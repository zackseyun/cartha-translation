  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/ימֵ֨י יְהוֹיָקִ֤ים בֶּן יֹאשִׁיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה עַד תֹּם֙ עַשְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/צִדְקִיָּ֥הוּ בֶן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה עַד גְּל֥וֹת יְרוּשָׁלִַ֖ם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִֽׁי־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/003.yaml
  text: And it continued in the days of Jehoiakim son of Josiah[a], king of Judah, until the completion of the eleventh year of Zedekiah son of Josiah, king of Judah[b], until the exile of Jerusalem in the fifth month.
translation:
  language: fr
  text: Elle continua de lui être adressée au temps de Jojakim, fils de Josias, roi de Juda, jusqu’à la fin de la onzième année de Sédécias, fils de Josias, roi de Juda, jusqu’à la déportation de Jérusalem[a], au cinquième mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire la déportation des habitants de Jérusalem lors de la chute de la ville.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: Elle continua de lui être adressée
  rationale: Le sujet implicite est « la parole de l’Éternel » du verset 2. Dans cette phrase qui prolonge la période du ministère de Jérémie, la tournure française exprime naturellement que cette parole continua de lui parvenir, sans réduire וַיְהִי à un simple événement ponctuel.
- source_word: בִּימֵי
  choice: au temps de
  rationale: Cette expression temporelle rend naturellement l’hébraïsme « aux jours de » tout en conservant sa portée générale.
- source_word: יְהוֹיָקִים
  choice: Jojakim
  rationale: Forme française courante du nom royal.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: fils de Josias
  rationale: Désignation filiale directe, avec la forme française traditionnelle du nom.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rendu direct du titre royal.
- source_word: עַד תֹּם
  choice: jusqu’à la fin de
  rationale: « La fin » exprime clairement et naturellement le terme atteint par la période indiquée.
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: la onzième année
  rationale: Dans une formule de datation royale, le nombre cardinal hébreu désigne idiomatiquement la onzième année du règne.
- source_word: לְצִדְקִיָּהוּ
  choice: de Sédécias
  rationale: Le préfixe לְ marque ici la référence au règne de Sédécias; « de Sédécias » convient à la formule française.
- source_word: גְּלוֹת
  choice: la déportation
  rationale: Le terme désigne ici l’action historique d’emmener en exil; « déportation » est plus précis que le seul état d’« exil ».
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française courante du nom de la ville; la métonymie de la ville pour sa population est conservée dans le texte.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: au cinquième mois
  rationale: Rendu direct et naturel de l’indication chronologique hébraïque.
theological_decisions:
- issue: Sujet implicite et continuité de la révélation
  choice: « Elle continua de lui être adressée » renvoie à « la parole de l’Éternel » au verset précédent.
  alternative: « Et cela arriva » ou « Et elle fut »
  rationale: Le verset dépend syntaxiquement du précédent et délimite la durée pendant laquelle la parole divine fut adressée à Jérémie. Le rendu choisi explicite seulement ce lien discursif nécessaire en français, sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les noms propres suivent leurs formes bibliques françaises courantes. La répétition de « jusqu’à » conserve la progression chronologique de l’hébreu, et la métonymie « déportation de Jérusalem » est maintenue puis expliquée en note.
