source:
  edition: WLC
  text: וְ/נִלְחֲמ֥וּ אֵלֶ֖י/ךָ וְ/לֹא י֣וּכְלוּ לָ֑/ךְ כִּֽי אִתְּ/ךָ֥ אֲנִ֛י נְאֻם יְהוָ֖ה לְ/הַצִּילֶֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/019.yaml
  text: They will fight against you[a], but they will not prevail against you, for I am with you, declares Yahweh[c][b], to deliver you.
translation:
  language: fr
  text: Ils te combattront, mais ils ne l’emporteront pas sur toi[a], car je suis avec toi, déclare Yahweh[b], pour te délivrer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne te vaincront pas » ; plus littéralement : « ils ne pourront pas contre toi ».'
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte le nom divin YHWH, rendu ici par « Yahweh ».
    reason: alternative_reading
  - marker: c
    text: 'Ou : « pour te secourir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְחֲמוּ אֵלֶיךָ
  choice: Ils te combattront
  rationale: Le niphal de לחם avec אֶל exprime ici une action hostile dirigée contre Jérémie. « Ils te combattront » est naturel, direct et n’amplifie pas le conflit jusqu’à une guerre généralisée.
- source_word: וְלֹא יוּכְלוּ לָךְ
  choice: mais ils ne l’emporteront pas sur toi
  rationale: La construction יכל avec ל exprime l’incapacité des adversaires à réussir contre Jérémie. « Ne pas l’emporter sur » rend idiomatiquement leur échec sans promettre l’absence de toute souffrance.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’échec des adversaires et convient au registre prophétique.
- source_word: אִתְּךָ אֲנִי
  choice: je suis avec toi
  rationale: Cette formulation conserve le sens littéral ainsi que la portée de l’assurance de la présence divine.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: « Déclare » rend clairement la formule prophétique נְאֻם, tandis que « Yahweh » représente le nom divin יהוה plutôt qu’un titre substitutif.
- source_word: לְהַצִּילֶךָ
  choice: pour te délivrer
  rationale: Le hiphil de נצל désigne l’action d’arracher quelqu’un au danger. « Délivrer » convient au registre prophétique et garde la force de l’intervention divine.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel divin sans le remplacer par un titre.
- issue: Portée de la promesse de protection
  choice: ils ne l’emporteront pas sur toi
  alternative: ils ne te vaincront pas ; ils ne pourront rien contre toi
  rationale: La formulation promet l’échec final des adversaires grâce à la présence et à l’intervention de Dieu, sans transformer cette promesse en garantie d’absence de conflit ou de souffrance.
- issue: Lien de l’infinitif לְהַצִּילֶךָ
  choice: pour te délivrer
  alternative: afin de te sauver
  rationale: L’infinitif exprime le but ou le résultat de la présence active de Yahweh. La formulation française conserve ce lien sans préciser davantage le mode de la délivrance.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la cadence prophétique, la répétition de « toi » et la tension entre un conflit réel et l’assurance que les adversaires n’auront pas le dernier mot.
