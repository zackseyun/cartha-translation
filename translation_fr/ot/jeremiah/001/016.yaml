  text: וְ/דִבַּרְתִּ֤י מִשְׁפָּטַ/י֙ אוֹתָ֔/ם עַ֖ל כָּל רָעָתָ֑/ם אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לְ/מַעֲשֵׂ֥י יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/016.yaml
  text: And I will pronounce my judgments against them for all their evil[a], because they have forsaken me, burned incense to other gods[b], and bowed down to the works of their own hands.
translation:
  language: fr
  text: Je prononcerai contre eux mes jugements au sujet de tout le mal qu’ils ont fait, parce qu’ils m’ont abandonné, qu’ils ont brûlé de l’encens à d’autres dieux et qu’ils se sont prosternés devant les œuvres de leurs mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Les « œuvres de leurs mains » désignent ici les idoles qu’ils avaient eux-mêmes fabriquées.
    reason: cultural_note
lexical_decisions:
- source_word: וְדִבַּרְתִּי מִשְׁפָּטַי אוֹתָם
  choice: Je prononcerai mes jugements contre eux
  rationale: Dans ce contexte judiciaire et prophétique, דבר avec משפטים désigne une déclaration formelle de jugements. « Prononcerai » en rend la force juridique, tandis que « contre eux » explicite naturellement la valeur contextuelle de אוֹתָם.
- source_word: עַל כָּל רָעָתָם
  choice: à cause de tout le mal qu’ils ont commis
  rationale: עַל indique ici le motif du jugement. « Le mal qu’ils ont commis » exprime en français naturel le sens moral et actif de רָעָתָם sans le réduire aux seuls actes cultuels ensuite énumérés.
- source_word: אֲשֶׁר
  choice: ':'
  rationale: Le deux-points introduit naturellement en français l’explication concrète du mal évoqué, sans imposer au relatif hébreu une valeur exclusivement causale.
- source_word: עֲזָבוּנִי
  choice: ils m’ont abandonné
  rationale: « Abandonné » conserve la portée relationnelle et covenantale de עזב dans l’accusation prophétique, en français moderne et courant.
- source_word: וַיְקַטְּרוּ לֵאלֹהִים אֲחֵרִים
  choice: ils ont brûlé de l’encens pour d’autres dieux
  rationale: Le piel de קטר désigne ici l’action cultuelle de faire brûler de l’encens ou une offrande produisant de la fumée. « Pour » indique clairement les destinataires du rite.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: ils se sont prosternés
  rationale: Ce choix préserve le geste physique exprimé par le verbe, tout en laissant le contexte faire ressortir sa valeur cultuelle.
- source_word: לְמַעֲשֵׂי יְדֵיהֶם
  choice: devant les œuvres de leurs propres mains
  rationale: La formulation conserve l’image et l’ironie prophétique de personnes adorant ce qu’elles ont elles-mêmes fabriqué. « Devant » convient idiomatiquement au verbe « se prosterner ».
theological_decisions:
- issue: Nature de l’action divine dans וְדִבַּרְתִּי מִשְׁפָּטַי
  choice: Dieu prononce formellement ses jugements contre le peuple.
  alternative: Dieu parle simplement de ses règles de justice, ou exécute ses jugements sans que leur proclamation soit mise en relief.
  rationale: 'L’association de דבר et משפטים dans ce cadre prophétique a une force judiciaire : il s’agit d’énoncer les décisions divines.'
- issue: Présentation des actes idolâtres
  choice: 'Conserver les trois éléments concrets : abandon de Dieu, encens offert à d’autres dieux et prosternation devant des objets fabriqués.'
  alternative: Résumer l’ensemble par « ils ont adoré des idoles ».
  rationale: La formulation détaillée respecte la progression de l’accusation hébraïque et sa tension théologique sans l’aplatir.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la force judiciaire de l’ouverture et le parallélisme des trois accusations. « Se prosterner » préserve le geste concret plutôt que de le remplacer directement par « adorer ».
