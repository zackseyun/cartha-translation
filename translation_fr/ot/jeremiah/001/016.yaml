    issue: Le deux-points ne rend pas explicitement la relation causale d’אֲשֶׁר.
    rationale: Dans ce contexte d’accusation, la proposition introduite par אֲשֶׁר donne les motifs des jugements. « Parce qu’ils » rend cette relation clairement sans changer le sens.
  - severity: low
    issue: « Pour d’autres dieux » est moins directement aligné sur לֵאלֹהִים אֲחֵרִים.
    rationale: « À d’autres dieux » exprime plus précisément le destinataire du rite et demeure idiomatique avec « brûler de l’encens ».
  - severity: low
    issue: La note a propose « Je leur exposerai mes jugements », qui atténue le sens de proclamation contre eux.
    rationale: Une alternative doit conserver à la fois l’idée de parole formelle et l’orientation hostile/contextuelle de la formule.
