  source_fidelity: Le sens judiciaire de וְדִבַּרְתִּי מִשְׁפָּטַי est bien rendu par « Je prononcerai ... mes jugements ». Cependant, le lien introduit par אֲשֶׁר est mieux rendu explicitement comme causal, conformément au contexte et à l’audit anglais. « À d’autres dieux » correspond plus directement au datif hébreu que « pour d’autres dieux ».
  naturalness: La formulation révisée reste naturelle en français international moderne. La coordination avec « parce qu’ils » et les subjonctifs évite une répétition lourde tout en maintenant les trois chefs d’accusation.
  terminology: « Jugements », « abandonné », « brûlé de l’encens », « autres dieux » et « se sont prosternés » conservent les termes juridiques, relationnels et cultuels du texte. « Les œuvres de leurs mains » préserve l’image ironique sans introduire explicitement « idoles » dans le texte.
