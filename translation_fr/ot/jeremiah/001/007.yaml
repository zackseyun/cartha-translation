id: JER.1.7
reference: Jeremiah 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י אַל תֹּאמַ֖ר נַ֣עַר אָנֹ֑כִי כִּ֠י עַֽל כָּל אֲשֶׁ֤ר אֶֽשְׁלָחֲ/ךָ֙ תֵּלֵ֔ךְ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר אֲצַוְּ/ךָ֖ תְּדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/007.yaml
  text: But Yahweh said to me[a], “Do not say, ‘I am a youth,’ for to all to whom I send you, you shall go, and all that I command you[b], you shall speak.”
translation:
  language: fr
  text: 'Mais Yahweh me dit : « Ne dis pas : “Je suis jeune[a]”, car tu iras vers tous ceux à qui je t’enverrai[b], et tu diras tout ce que je t’ordonnerai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je suis un jeune homme », « Je suis un garçon ». Le mot hébreu נַעַר peut désigner divers degrés de jeunesse ou d’inexpérience.
    reason: lexical_alternative
  - marker: b
    text: Ou « partout où je t’enverrai, tu iras ». L’expression hébraïque peut désigner plus généralement toute destination ou toute mission à laquelle Yahweh envoie Jérémie.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le passé simple convient à la narration biblique en français moderne et introduit naturellement le discours direct.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: אַל תֹּאמַר
  choice: Ne dis pas
  rationale: אַל suivi de l’inaccompli exprime ici une interdiction directe.
- source_word: נַעַר
  choice: jeune
  rationale: Le terme désigne une personne jeune et peut aussi évoquer son inexpérience; l’adjectif substantivé implicite dans « je suis jeune » évite de préciser indûment l’âge.
- source_word: עַל כָּל אֲשֶׁר אֶשְׁלָחֲךָ
  choice: vers tous ceux à qui je t’enverrai
  rationale: Cette formulation conserve l’orientation vers l’ensemble des destinataires possibles, tout en signalant en note l’interprétation locative également plausible.
- source_word: תֵּלֵךְ
  choice: tu iras
  rationale: Le futur français exprime naturellement l’action prescrite qui découle de l’envoi divin.
- source_word: וְאֵת כָּל אֲשֶׁר אֲצַוְּךָ תְּדַבֵּר
  choice: et tu diras tout ce que je t’ordonnerai
  rationale: « Ordonner » garde la force de צוה; « dire » rend ici naturellement דבר dans le cadre d’un message verbal confié au prophète.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » préserve le nom propre sans le remplacer par le titre traditionnel.
- issue: Portée de la mission confiée à Jérémie
  choice: vers tous ceux à qui je t’enverrai
  alternative: partout où je t’enverrai
  rationale: L’hébreu permet une compréhension orientée vers des destinataires aussi bien qu’une généralisation locative. Le texte retient la première sans exclure la seconde, donnée en note.
translation_notes:
  register: Français international moderne, digne et direct. Le contraste avec l’objection du verset précédent est rendu par « Mais ». Les futurs « tu iras » et « tu diras » maintiennent le parallélisme et l’autorité de l’envoi sans recourir au tour vieilli « tu devras » ou à un futur à valeur artificiellement solennelle.
