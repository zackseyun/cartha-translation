  text: וַ/יְהִ֨י דְבַר יְהוָ֤ה אֵלַ/י֙ שֵׁנִ֣ית לֵ/אמֹ֔ר מָ֥ה אַתָּ֖ה רֹאֶ֑ה וָ/אֹמַ֗ר סִ֤יר נָפ֨וּחַ֙ אֲנִ֣י רֹאֶ֔ה וּ/פָנָ֖י/ו מִ/פְּנֵ֥י צָפֽוֹנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/013.yaml
  text: And the word of Yahweh came to me a second time[a], saying, “What do you see?” And I said, “I see a boiling pot[b], and its face is from the north.”
translation:
  language: fr
  text: 'Et la parole de Yahweh me fut adressée une deuxième fois : « Que vois-tu ? » Je répondis : « Je vois une marmite bouillonnante[a], et sa face est du côté du nord[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une marmite sur laquelle on souffle » ou « une marmite attisée » ; le participe hébreu peut évoquer un feu que l’on active en soufflant et, par conséquent, une marmite portée à ébullition.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, de façon elliptique : « sa face [est] de devant la face du nord ». L’expression peut désigner le côté exposé ou l’ouverture de la marmite et son orientation par rapport au nord ; son sens exact demeure incertain.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Conserve la formule prophétique habituelle et rend le nom divin explicitement.
- source_word: שֵׁנִית
  choice: une deuxième fois
  rationale: Exprime précisément la succession indiquée par l’adverbe hébreu.
- source_word: מָה אַתָּה רֹאֶה
  choice: Que vois-tu ?
  rationale: Formulation française naturelle correspondant au participe hébreu dans le discours direct.
- source_word: סִיר
  choice: marmite
  rationale: Désigne clairement un récipient de cuisson sans donner à l’image une tonalité archaïque.
- source_word: נָפוּחַ
  choice: bouillonnante
  rationale: Rend naturellement l’effet probable d’un feu attisé par le souffle, tout en signalant en note le sens plus littéral.
- source_word: וּפָנָיו
  choice: sa face
  rationale: Préserve l’image concrète et inhabituelle du texte hébreu plutôt que de trancher entre le côté, l’avant et l’ouverture du récipient.
- source_word: מִפְּנֵי צָפוֹנָה
  choice: du côté du nord
  rationale: Maintient le rapport directionnel avec le nord sans préciser abusivement l’orientation exacte de la marmite.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Transcrit le nom propre divin conformément à l’orientation du projet, sans le remplacer par un titre.
- issue: Orientation de la marmite
  choice: sa face est du côté du nord
  alternative: elle est inclinée depuis le nord / sa face est détournée du nord
  rationale: L’expression hébraïque est difficile et l’image ne permet pas de fixer avec certitude la géométrie de la marmite. Le texte principal conserve donc la tension directionnelle, tandis que la note expose l’incertitude.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple est limité aux verbes introducteurs brefs, où il reste naturel dans un récit biblique. Les formulations inhabituelles « sa face » et « du côté du nord » sont maintenues afin de ne pas effacer l’ambiguïté de la vision.
