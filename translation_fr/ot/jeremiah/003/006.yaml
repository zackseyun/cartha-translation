source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י בִּ/ימֵי֙ יֹאשִׁיָּ֣הוּ הַ/מֶּ֔לֶךְ הֲֽ/רָאִ֔יתָ אֲשֶׁ֥ר עָשְׂתָ֖ה מְשֻׁבָ֣ה יִשְׂרָאֵ֑ל הֹלְכָ֨ה הִ֜יא עַל כָּל הַ֣ר גָּבֹ֗הַּ וְ/אֶל תַּ֛חַת כָּל עֵ֥ץ רַעֲנָ֖ן וַ/תִּזְנִי שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/006.yaml
  text: And the LORD said to me in the days of King Josiah, “Have you seen what faithless Israel has done? She went up on every high hill and under every green tree, and there she prostituted herself.”
translation:
  language: fr
  text: 'L’Éternel me dit, à l’époque du roi Josias : « As-tu vu ce qu’a fait Israël l’infidèle ? Elle est allée sur toute haute colline et sous tout arbre verdoyant, et là elle s’est prostituée. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et immédiatement reconnaissable du tétragramme, sans introduire une vocalisation conjecturale dans le corps du texte.
- source_word: מְשֻׁבָה יִשְׂרָאֵל
  choice: Israël l’infidèle
  rationale: מְשֻׁבָה qualifie ici Israël personnifiée et évoque son abandon déloyal de l’alliance ; « l’infidèle » restitue ce sens dans un français naturel tout en préparant l’image conjugale de la prostitution.
- source_word: הַר גָּבֹהַּ
  choice: haute colline
  rationale: Expression liée aux lieux élevés où se pratiquait le culte ; la traduction littérale laisse ce contexte ressortir sans ajouter explicitement « lieu de culte ».
- source_word: עֵץ רַעֲנָן
  choice: arbre verdoyant
  rationale: Restitue l’idée d’un arbre luxuriant ou au feuillage frais, formule associée aux pratiques cultuelles dénoncées.
- source_word: וַתִּזְנִי
  choice: elle s’est prostituée
  rationale: Conserve la métaphore sexuelle et religieuse forte du verbe זנה ainsi que la personnification féminine d’Israël.
theological_decisions:
- issue: Nature de l’infidélité d’Israël
  choice: Conserver l’image de la prostitution sans l’expliciter comme idolâtrie dans le corps du verset.
  alternative: « elle s’est livrée à l’idolâtrie »
  rationale: Le texte emploie délibérément une métaphore conjugale et sexuelle qui porte à la fois les dimensions cultuelle et relationnelle de l’infidélité ; l’expliciter supprimerait cette tension.
- issue: Rendu du nom divin
  choice: « l’Éternel »
  alternative: « YHWH » ou « Yahvé »
  rationale: Ce choix suit un usage français courant et digne tout en évitant de présenter comme certaine une prononciation reconstruite.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La syntaxe demeure proche de l’hébreu, mais « à l’époque de » est préféré à « aux jours de » pour plus de naturel. La personnification féminine d’Israël et la vigueur de la métaphore sont préservées.
