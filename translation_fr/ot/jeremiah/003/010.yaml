source:
  edition: WLC
  text: וְ/גַם בְּ/כָל זֹ֗את לֹא שָׁ֨בָה אֵלַ֜/י בָּגוֹדָ֧ה אֲחוֹתָ֛/הּ יְהוּדָ֖ה בְּ/כָל לִבָּ֑/הּ כִּ֥י אִם בְּ/שֶׁ֖קֶר נְאֻם יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/010.yaml
  text: Yet in spite of all this[a], faithless Judah, her sister did not return to me with all her heart, but only in falsehood[b], declares Yahweh.
translation:
  language: fr
  text: Pourtant, malgré tout cela, sa sœur, l’infidèle Juda, n’est pas revenue à moi de tout son cœur, mais seulement de manière mensongère[b] — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Littéralement « mais seulement dans le mensonge » ; Juda n’est pas revenue à Yahweh avec sincérité.
    reason: literal_rendering
lexical_decisions:
- source_word: וְגַם בְּכָל זֹאת
  choice: Pourtant, malgré tout cela
  rationale: L’expression ajoute un constat fortement concessif à ce qui précède. « Pourtant, malgré tout cela » restitue cette progression et ce contraste dans un français naturel.
- source_word: שָׁבָה אֵלַי
  choice: n’est pas revenue à moi
  rationale: Le verbe שׁוּב exprime ici un retour relationnel vers Yahweh, avec une portée de repentance et de fidélité à l’alliance, sans qu’il soit nécessaire d’expliciter davantage cette portée.
- source_word: בָּגוֹדָה
  choice: infidèle
  rationale: Le terme qualifie Juda comme déloyale dans sa relation d’alliance. « Infidèle » convient au contexte conjugal et familial de la métaphore, tout en restant naturel en français.
- source_word: אֲחוֹתָהּ יְהוּדָה
  choice: Juda, sa sœur
  rationale: Cette apposition conserve explicitement la personnification féminine de Juda et son lien de sœur avec Israël dans le contexte.
- source_word: בְּכָל לִבָּהּ
  choice: de tout son cœur
  rationale: Cette tournure française idiomatique rend l’idée d’un retour entier et sincère.
- source_word: כִּי אִם בְּשֶׁקֶר
  choice: mais seulement en faisant semblant
  rationale: La construction restrictive oppose le retour entier à un retour faux et insincère. Cette formulation exprime clairement en français moderne le sens contextuel de בְּשֶׁקֶר.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule solennelle rend la formule prophétique nominale et conserve le nom divin יְהוָה sous la forme « Yahweh ».
theological_decisions:
- issue: Portée du « retour » de Juda
  choice: Conserver « revenir à moi » sans ajouter explicitement « se repentir »
  alternative: Traduire par « ne s’est pas repentie et n’est pas revenue à moi »
  rationale: Le contexte donne au verbe une portée de repentance et de restauration relationnelle, mais le texte hébreu emploie uniquement le verbe « revenir ». La formulation retenue préserve cette richesse sans explicitation doctrinale.
- issue: Personnification de Juda comme sœur
  choice: Maintenir le féminin et la relation de sœur
  alternative: Parler simplement de la nation de Juda
  rationale: La métaphore familiale structure le passage et renforce l’accusation d’infidélité. La supprimer affaiblirait la rhétorique prophétique.
- issue: Nature du retour de Juda
  choice: Présenter son retour comme simulé et insincère
  alternative: Comprendre בְּשֶׁקֶר comme une erreur involontaire
  rationale: L’opposition avec « de tout son cœur » indique une démarche extérieure ou feinte, non un retour sincère. La traduction n’ajoute toutefois aucun détail sur la forme historique de cette simulation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la personnification féminine de Juda. « En faisant semblant » privilégie l’intelligibilité, tandis que la note signale la formulation hébraïque plus littérale.
