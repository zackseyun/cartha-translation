revisions:
- from: Pourtant, malgré tout cela, Juda, sa sœur infidèle[a], n’est pas revenue à moi de tout son cœur, mais seulement en faisant semblant[b] — déclaration de Yahweh.
  to: Pourtant, malgré tout cela, sa sœur, l’infidèle Juda, n’est pas revenue à moi de tout son cœur, mais seulement de manière mensongère[b] — déclaration de Yahweh.
  rationale: 'La révision remplace une explicitation trop étroite du mensonge par une expression française qui conserve l’étendue sémantique de בְּשֶׁקֶר. Elle clarifie aussi l’apposition personnifiant Juda comme la sœur d’Israël. La note a est supprimée : « infidèle » est une traduction directe et naturelle de בָּגוֹדָה dans ce contexte, et l’alternative « perfide » n’est pas nécessaire à la compréhension.'
