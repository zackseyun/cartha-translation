    text: Littéralement « mais seulement dans le mensonge » ; Juda n’est pas revenue à Yahweh avec sincérité.
    reason: literal_rendering
  revision_rationale: 'La révision remplace une explicitation trop étroite du mensonge par une expression française qui conserve l’étendue sémantique de בְּשֶׁקֶר. Elle clarifie aussi l’apposition personnifiant Juda comme la sœur d’Israël. La note a est supprimée : « infidèle » est une traduction directe et naturelle de בָּגוֹדָה dans ce contexte, et l’alternative « perfide » n’est pas nécessaire à la compréhension.'
