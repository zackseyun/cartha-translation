source:
  edition: WLC
  text: אַ֚ךְ דְּעִ֣י עֲוֺנֵ֔/ךְ כִּ֛י בַּ/יהוָ֥ה אֱלֹהַ֖יִ/ךְ פָּשָׁ֑עַתְּ וַ/תְּפַזְּרִ֨י אֶת דְּרָכַ֜יִ/ךְ לַ/זָּרִ֗ים תַּ֚חַת כָּל עֵ֣ץ רַעֲנָ֔ן וּ/בְ/קוֹלִ֥/י לֹא שְׁמַעְתֶּ֖ם נְאֻם יְהֹוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/013.yaml
  text: Only acknowledge your guilt[a], that you have rebelled against Yahweh your God and scattered your ways among strangers under every green tree, and you have not obeyed my voice[b], declares Yahweh.
translation:
  language: fr
  text: 'Reconnais seulement ta faute[a] : tu t’es révoltée contre Yahweh, ton Dieu, tu as dispersé tes voies parmi les étrangers, sous tout arbre verdoyant[b], et vous n’avez pas écouté ma voix — déclaration de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner la culpabilité ou le tort commis.
    reason: alternative_reading
  - marker: b
    text: « Sous tout arbre verdoyant » est une expression récurrente qui désigne des lieux de culte illicite.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ דְּעִי עֲוֺנֵךְ
  choice: Reconnais seulement ta faute
  rationale: אַךְ focalise l’unique exigence, tandis que ידע à l’impératif signifie ici reconnaître ou admettre. « Faute » exprime la culpabilité morale de עָוֹן dans un français actuel.
- source_word: פָּשָׁעַתְּ
  choice: tu t’es révoltée
  rationale: פשע désigne une rébellion contre une autorité légitime. Le féminin singulier du texte, qui s’adresse à Israël/Juda personnifiée, est conservé.
- source_word: בַּיהוָה אֱלֹהַיִךְ
  choice: contre Yahweh, ton Dieu
  rationale: Avec פשע, la préposition בְּ a ici une valeur adversative. Le nom divin est translittéré « Yahweh ».
- source_word: וַתְּפַזְּרִי אֶת דְּרָכַיִךְ
  choice: tu as dispersé tes chemins
  rationale: La formulation garde l’image hébraïque inhabituelle de la dispersion des « chemins », sans la réduire d’emblée à une interprétation sexuelle ou cultuelle.
- source_word: לַזָּרִים
  choice: vers des étrangers
  rationale: זָרִים signifie littéralement « étrangers ». Le contexte évoque l’adultère et l’idolâtrie, mais le texte ne précise pas « dieux ».
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: sous tout arbre verdoyant
  rationale: « Verdoyant » rend רַעֲנָן et conserve cette expression prophétique récurrente associée aux lieux de culte illicite.
- source_word: וּבְקוֹלִי לֹא שְׁמַעְתֶּם
  choice: et vous n’avez pas écouté ma voix
  rationale: La traduction conserve l’idiome de la voix et, surtout, le passage remarquable du féminin singulier au masculin pluriel dans le verbe hébreu.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule nominale rend la formule prophétique solennelle נְאֻם יְהוָה sans la transformer en simple verbe de parole.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: La translittération maintient le nom d’alliance présent deux fois dans le texte source.
- issue: Identification des זָרִים
  choice: des étrangers
  alternative: des dieux étrangers
  rationale: Le contexte d’infidélité cultuelle soutient l’interprétation idolâtrique, mais l’hébreu nomme seulement des « étrangers » ; le texte principal préserve donc la métaphore et son ambiguïté.
- issue: Changement de nombre et de genre dans l’adresse
  choice: tu t’es révoltée… vous n’avez pas écouté
  alternative: uniformiser toute la phrase au singulier
  rationale: Le texte hébreu passe explicitement du féminin singulier au masculin pluriel. Le français permet de rendre ce changement, qui ne doit pas être silencieusement supprimé.
translation_notes:
  register: Français international moderne, digne et accessible. Le féminin singulier personnifie le peuple comme une femme infidèle ; le passage soudain au pluriel est intentionnellement conservé. La ponctuation met en relief l’appel initial et la formule prophétique finale.
