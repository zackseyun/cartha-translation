revisions:
- from: 'Reconnais seulement ta faute[a] : tu t’es révoltée contre Yahweh, ton Dieu, tu as dispersé tes chemins vers des étrangers sous tout arbre verdoyant[b], et vous n’avez pas écouté ma voix — déclaration de Yahweh.'
  to: 'Reconnais seulement ta faute[a] : tu t’es révoltée contre Yahweh, ton Dieu, tu as dispersé tes voies parmi les étrangers, sous tout arbre verdoyant[b], et vous n’avez pas écouté ma voix — déclaration de Yahweh.'
  rationale: La révision limitée remplace « chemins » par « voies » et « vers » par « parmi ». Elle améliore le français et respecte mieux la polysémie métaphorique de l’hébreu, sans transformer « étrangers » en « dieux étrangers » ni neutraliser l’alternance singulier/pluriel du texte source. Les deux appels de note demeurent correctement ancrés et les notes sont conservées.
  reviewer_model: gpt-5.6-terra
