  text: וָ/אֹמַ֗ר אַחֲרֵ֨י עֲשׂוֹתָ֧/הּ אֶת כָּל אֵ֛לֶּה אֵלַ֥/י תָּשׁ֖וּב וְ/לֹא שָׁ֑בָה ו/תראה בָּגוֹדָ֥ה אֲחוֹתָ֖/הּ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/007.yaml
  text: And I said[a], ‘After she had done all these things, she will return to me,’ but she did not return[c][b]; and her treacherous sister Judah saw it.
translation:
  language: fr
  text: 'Et j’ai dit : « Après avoir fait tout cela, elle reviendra[a] vers moi. » Mais elle n’est pas revenue[b], et Juda, sa sœur perfide[c], l’a vu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « elle reviendrait vers moi ». L’imparfait hébreu peut exprimer un avenir attendu depuis un point de vue passé.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe traduit par « revenir » peut aussi signifier « retourner » et, dans le contexte de l’alliance, « se repentir ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « sa sœur infidèle, Juda ». Le mot hébreu peut mettre l’accent sur l’infidélité ou sur la trahison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Je me suis dit
  rationale: Le wayyiqtol de אמר poursuit le récit au passé. Le pronom réfléchi rend naturellement en français une parole intérieure ou une attente formulée par le locuteur, sans changer son contenu.
- source_word: אַחֲרֵי עֲשׂוֹתָהּ אֶת כָּל אֵלֶּה
  choice: Après avoir fait tout cela
  rationale: La préposition אַחֲרֵי suivie de l’infinitif construit et du suffixe se rend naturellement par une proposition infinitive temporelle; « tout cela » reprend fidèlement le démonstratif pluriel hébreu.
- source_word: אֵלַי תָּשׁוּב
  choice: elle reviendra vers moi
  rationale: שׁוב exprime ici le retour vers le Seigneur, avec une portée relationnelle et alliancélle. Le futur dans la citation directe conserve l’attente envisagée depuis le moment passé du récit.
- source_word: וְלֹא שָׁבָה
  choice: Mais elle n’est pas revenue
  rationale: « Mais » marque le contraste, tandis que la répétition de « revenir » maintient le lien lexical avec תָּשׁוּב et le motif du retour.
- source_word: וַתֵּרֶא
  choice: l’a vu
  rationale: ראה signifie simplement « voir ». Le pronom « l’ » explicite en français l’objet implicite, à savoir ce qui vient d’être raconté.
- source_word: בָּגוֹדָה
  choice: perfide
  rationale: Le terme dérivé de בגד évoque la déloyauté et la trahison, notamment dans le cadre de l’alliance. « Perfide » en conserve la force sans développer une interprétation supplémentaire.
- source_word: אֲחוֹתָהּ יְהוּדָה
  choice: sa sœur perfide, Juda
  rationale: Cette formulation conserve la métaphore familiale qui présente Juda comme la sœur d’Israël et identifie clairement cette sœur par l’apposition « Juda ».
theological_decisions:
- issue: Portée d’alliance de שׁוּב
  choice: revenir
  alternative: se détourner de sa conduite; se repentir
  rationale: « Revenir » préserve à la fois le mouvement de retour et sa portée spirituelle ou relationnelle, sans réduire le verbe au seul concept explicite de repentance.
- issue: Caractérisation de Juda par בָּגוֹדָה
  choice: sœur perfide
  alternative: sœur infidèle
  rationale: « Perfide » souligne la dimension de trahison; « infidèle » ferait davantage ressortir l’infidélité à l’alliance. Le choix retenu garde la vigueur accusatrice du mot hébreu.
- issue: Valeur temporelle de תָּשׁוּב après וָאֹמַר
  choice: elle reviendra
  alternative: elle reviendrait
  rationale: Dans une citation directe, le futur rend naturellement l’attente du locuteur. Le conditionnel français est également possible si l’on comprend la phrase comme un discours rapporté depuis le point de vue narratif.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est volontairement simple; la répétition de « revenir » conserve le motif central du texte. « Perfide » appartient à un registre légèrement soutenu, mais reste clair et restitue mieux que « infidèle » la nuance de trahison.
