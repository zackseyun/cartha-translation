source:
  edition: WLC
  text: שׁ֚וּבוּ בָּנִ֣ים שׁוֹבָבִ֔ים אֶרְפָּ֖ה מְשׁוּבֹֽתֵי/כֶ֑ם הִנְ/נוּ֙ אָתָ֣נוּ לָ֔/ךְ כִּ֥י אַתָּ֖ה יְהֹוָ֥ה אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/022.yaml
  text: Return[a], O backsliding children; I will heal your backslidings. Behold, we come to you[b], for you are Yahweh our God.
translation:
  language: fr
  text: 'Revenez[a], enfants infidèles ; je guérirai vos infidélités[b].


    « Nous voici, nous venons à toi, car tu es Yahvé, notre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète une même racine qui évoque à la fois le fait de revenir et celui de se détourner.
    reason: wordplay
  - marker: b
    text: 'Ou : « vos égarements », « vos retours en arrière » ou « vos apostasies ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Revenez
  rationale: L’impératif pluriel de שוב appelle le peuple à revenir vers Dieu. « Revenez » conserve le mouvement relationnel et concret sans le réduire au seul repentir intérieur.
- source_word: בָּנִים
  choice: enfants
  rationale: Dans cette adresse collective au peuple de l’alliance, בנים désigne les enfants de Dieu. « Enfants » est naturel en français et n’exclut pas les femmes visées par l’appel collectif.
- source_word: שׁוֹבָבִים
  choice: infidèles
  rationale: Le terme qualifie ceux qui se sont détournés. « Infidèles » exprime ici la rupture relationnelle et l’infidélité à l’alliance, tout en restant compréhensible en français courant.
- source_word: אֶרְפָּה
  choice: je guérirai
  rationale: Le verbe רפא signifie « guérir ». La traduction garde intacte la métaphore concrète de la restauration spirituelle.
- source_word: מְשׁוּבֹתֵיכֶם
  choice: vos infidélités
  rationale: Le nom pluriel désigne les détournements ou infidélités du peuple. Le pluriel hébreu est conservé, ainsi que le lien sémantique avec שׁוֹבָבִים.
- source_word: הִנְנוּ אָתָנוּ לָךְ
  choice: Nous voici, nous venons à toi
  rationale: הננו marque la présence et la disponibilité immédiates, tandis que אתנו לך exprime le mouvement vers Dieu. La formulation française rend les deux éléments sans les fusionner.
- source_word: יְהֹוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » représente le nom personnel divin יהוה plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Expression d’alliance directe et naturelle correspondant au nom avec suffixe de première personne du pluriel.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre de Dieu. « Yahvé » le rend explicitement en français et évite de le remplacer silencieusement par un titre.
- issue: Portée de בנים dans l’adresse au peuple
  choice: enfants
  alternative: fils
  rationale: Bien que le nom soit morphologiquement masculin pluriel, il sert ici d’adresse collective au peuple. « Enfants » préserve cette filiation collective sans limiter artificiellement l’appel aux hommes.
- issue: Rapport entre le commandement divin et la réponse du peuple
  choice: La réponse est mise entre guillemets
  alternative: Tout présenter comme une seule parole sans changement de locuteur
  rationale: Après la promesse « je guérirai », le pluriel « nous voici, nous venons » indique un changement de locuteur. Les guillemets le rendent lisible sans ajouter d’identification absente du texte.
translation_notes:
  register: Français international actuel, digne et direct. La ponctuation distingue l’appel de Dieu de la réponse du peuple. « Enfants infidèles » est plus idiomatique que « fils rétrogrades », tandis que les notes signalent le jeu de racines et les principales possibilités lexicales.
