  text: וְ/אָנֹכִ֣י אָמַ֗רְתִּי אֵ֚יךְ אֲשִׁיתֵ֣/ךְ בַּ/בָּנִ֔ים וְ/אֶתֶּן לָ/ךְ֙ אֶ֣רֶץ חֶמְדָּ֔ה נַחֲלַ֥ת צְבִ֖י צִבְא֣וֹת גּוֹיִ֑ם וָ/אֹמַ֗ר אָבִ/י֙ תקראו לִ֔/י וּ/מֵ/אַחֲרַ֖/י לֹ֥א תשובו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/019.yaml
  text: And I said[a], ‘How I would set you among the sons and give you a desirable land, the most beautiful inheritance of the nations' armies.’ And I said, ‘You will call me[b], “My Father,” and you will not turn away from following me.’
translation:
  language: fr
  text: 'Et moi, je m’étais dit : « Comment te placerais-je parmi les fils[a] et te donnerais-je un pays de délices, le plus bel héritage des nations[b] ? » Et j’avais dit : « Tu m’appelleras “Mon Père”, et tu ne te détourneras pas de moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans un sens familial plus large : « parmi les enfants » ; l’hébreu dit littéralement « parmi les fils ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque est très condensée et son analyse est discutée. Elle peut aussi être comprise dans le sens de « un héritage glorieux parmi les nations » ou « un héritage, parure des nations ».
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: Comme je voulais
  rationale: Dans cette déclaration rétrospective, אֵיךְ introduit une exclamation exprimant le projet divin. « Comme je voulais » en restitue la force sans transformer le propos en question sur la capacité de Dieu.
- source_word: אֲשִׁיתֵךְ בַּבָּנִים
  choice: te placer parmi les fils
  rationale: שׁית signifie « placer, établir » et בנים est le pluriel masculin « fils ». La formulation conserve l’image filiale et le contraste grammatical entre la destinataire féminine singulière et les fils.
- source_word: אֶרֶץ חֶמְדָּה
  choice: un pays désirable
  rationale: חמדה évoque ce qui est désiré, précieux ou délectable. « Pays désirable » garde ce champ sémantique et la tonalité liée au don du pays.
- source_word: נַחֲלַת צְבִי צִבְאוֹת גּוֹיִם
  choice: le plus bel héritage parmi les nations
  rationale: La construction hébraïque est très condensée. נחלה désigne un héritage, צבי la beauté ou la splendeur, et צבאות גוים peut se comprendre comme une expression intensive ou collective relative aux nations. Le texte principal privilégie une formulation française intelligible, tandis que la note conserve une lecture plus littérale.
- source_word: אָבִי תקראו לִי
  choice: Tu m’appelleras « Mon Père »
  rationale: קרא avec ל peut exprimer l’appel ou la manière de nommer quelqu’un. Dans ce contexte filial, l’adresse directe « Mon Père » est naturelle. Le qeré singulier תקרא, signalé par la tradition massorétique face au ketiv pluriel תקראו, correspond à la destinataire collective au singulier.
- source_word: וּמֵאַחֲרַי לֹא תשובו
  choice: tu ne te détourneras pas de moi
  rationale: Littéralement, l’expression évoque le fait de revenir ou de se détourner d’après quelqu’un, c’est-à-dire de cesser de le suivre. La traduction conserve l’idée relationnelle et directionnelle en français naturel, en suivant le qeré singulier תשובי implicite dans la tradition de lecture.
theological_decisions:
- issue: Langage filial genré dans בַּבָּנִים
  choice: parmi les fils
  alternative: parmi les enfants
  rationale: Le nom hébreu est explicitement masculin pluriel. « Fils » maintient l’image filiale genrée du texte, tandis qu’une note indique que le terme peut avoir un sens familial plus large.
- issue: Interprétation de נַחֲלַת צְבִי צִבְאוֹת גּוֹיִם
  choice: le plus bel héritage parmi les nations
  alternative: un héritage magnifique des armées des nations
  rationale: La syntaxe et les relations entre les substantifs sont incertaines. Le choix principal rend le sens probable de splendeur exceptionnelle sans imposer l’image militaire, mais la note préserve la lecture lexicale plus littérale.
- issue: Nombre grammatical dans les formes écrites תקראו et תשובו
  choice: singulier selon la lecture massorétique et l’adresse féminine singulière
  alternative: pluriel selon les consonnes écrites
  rationale: Le contexte et les indications massorétiques conduisent traditionnellement à lire les verbes au féminin singulier, en accord avec la destinataire collective. La variation entre ketiv et qeré est signalée en note afin de ne pas masquer l’état du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « J’avais dit » rend la structure וְאָנֹכִי אָמַרְתִּי ... וָאֹמַר, et l’exclamation restitue la valeur affective de אֵיךְ. Les marqueurs [a] et [b] figurent dans le texte principal.
