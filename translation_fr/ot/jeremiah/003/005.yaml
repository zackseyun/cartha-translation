source:
  edition: WLC
  text: הֲ/יִנְטֹ֣ר לְ/עוֹלָ֔ם אִם יִשְׁמֹ֖ר לָ/נֶ֑צַח הִנֵּ֥ה דברתי וַ/תַּעֲשִׂ֥י הָ/רָע֖וֹת וַ/תּוּכָֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/005.yaml
  text: Will he be angry forever? Will he keep it to the end? Look[a], you have spoken, and you have done evil things[c][b], and you have prevailed.
translation:
  language: fr
  text: 'Gardera-t-il rancune pour toujours ? Gardera-t-il sa colère à jamais ? Voici : tu as parlé[a], tu as commis les mauvaises actions, et tu as réussi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte consonantique peut aussi se lire : « j’ai parlé » ; la vocalisation massorétique et le contexte favorisent « tu as parlé », adressé à Juda.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « et tu as prévalu ». Le verbe peut indiquer que Juda a réussi à poursuivre ses mauvaises actions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִנְטֹר לְעוֹלָם
  choice: Gardera-t-il rancune pour toujours ?
  rationale: נטר signifie ici conserver de la colère ou du ressentiment. « Garder rancune » restitue directement cette idée dans un français naturel, tandis que « pour toujours » rend la durée indéfinie de עוֹלָם.
- source_word: אִם יִשְׁמֹר לָנֶצַח
  choice: Entretiendra-t-il sa colère sans fin ?
  rationale: שׁמר signifie littéralement « garder »; l'objet implicite, en parallèle avec נטר, est la colère ou le ressentiment. « Entretenir sa colère » évite une répétition lourde de « garder » et explicite sobrement l'objet. « Sans fin » rend לָנֶצַח.
- source_word: הִנֵּה
  choice: Pourtant
  rationale: Dans ce contexte, הִנֵּה attire l'attention sur le contraste accusateur entre les paroles de Juda et ses actes. « Pourtant » exprime naturellement cette force discursive en français, sans l'archaïsme de « voici » employé isolément.
- source_word: דברתי
  choice: tu as parlé
  rationale: La forme consonantique non vocalisée permet aussi « j'ai parlé », mais la vocalisation massorétique et le contexte soutiennent ici le féminin singulier « tu as parlé », adressé à Juda.
- source_word: וַתַּעֲשִׂי הָרָעוֹת
  choice: tu as commis ces mauvaises actions
  rationale: Le féminin singulier poursuit l'adresse à Juda. Le pluriel défini הָרָעוֹת vise des actes mauvais concrets; « ces mauvaises actions » en rend naturellement la référence définie.
- source_word: וַתּוּכָל
  choice: et tu as persisté
  rationale: יכל signifie fondamentalement « pouvoir, réussir, prévaloir ». Dans ce contexte, la formule indique que Juda a pu poursuivre ses mauvaises actions, voire y a réussi. « Persisté » communique ce sens contextuel sans suggérer une victoire légitime; l'ambiguïté lexicale est signalée en note.
theological_decisions:
- issue: Enchaînement des locuteurs dans la dernière partie du verset
  choice: 'Lire toute la séquence comme une adresse directe à Juda : « tu as parlé… tu as commis… tu as persisté »'
  alternative: Lire דברתי comme « j'ai parlé », avec un changement de locuteur au milieu de la phrase
  rationale: La vocalisation massorétique donnée lit דִּבַּרְתְּ (« tu as parlé », féminin singulier), en accord avec les verbes féminins qui suivent et avec les paroles de Juda au verset précédent. La possibilité liée au texte consonantique est néanmoins conservée en note.
- issue: Rapport entre les paroles pieuses et les actes mauvais de Juda
  choice: Rendre הִנֵּה par « Pourtant » pour faire entendre le contraste rhétorique
  alternative: 'Employer un marqueur présentatif plus formel : « Voici » ou « Regarde »'
  rationale: Le passage oppose les paroles de Juda à sa conduite sans imposer une explication doctrinale supplémentaire. « Pourtant » rend cette tension dans un français idiomatique.
translation_notes:
  register: Français international moderne, digne et directement intelligible. Les deux questions conservent le parallélisme hébreu sans répétition artificielle. Le féminin singulier est maintenu dans l'adresse à Juda. Les ambiguïtés de דברתי et de וַתּוּכָל sont signalées sans trancher au-delà de ce que permettent la vocalisation et le contexte.
