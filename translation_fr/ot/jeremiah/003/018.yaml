source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔מָּה יֵלְכ֥וּ בֵית יְהוּדָ֖ה עַל בֵּ֣ית יִשְׂרָאֵ֑ל וְ/יָבֹ֤אוּ יַחְדָּו֙ מֵ/אֶ֣רֶץ צָפ֔וֹן עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר הִנְחַ֖לְתִּי אֶת אֲבוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/018.yaml
  text: In those days the house of Judah will go with the house of Israel[b][a], and they will come together from the land of the north to the land that I gave as an inheritance to your fathers.
translation:
  language: fr
  text: En ces jours-là, la maison de Juda se joindra à la maison d’Israël[a], et ensemble elles viendront du pays du nord vers le pays que j’ai donné en héritage à vos pères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ira vers la maison d’Israël ». La préposition hébraïque peut indiquer un mouvement vers Israël, mais le contexte évoque probablement le ralliement des deux maisons.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « vos ancêtres ». L’hébreu dit littéralement « vos pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵמָּה
  choice: En ces jours-là
  rationale: Expression temporelle prophétique courante, naturelle en français et fidèle au registre du texte.
- source_word: יֵלְכוּ ... עַל
  choice: se joindra à
  rationale: Le verbe signifie fondamentalement « aller », mais la construction avec עַל, éclairée par « ensemble » dans la proposition suivante, exprime ici vraisemblablement le ralliement de Juda à Israël.
- source_word: בֵית יְהוּדָה ... בֵּית יִשְׂרָאֵל
  choice: la maison de Juda ... la maison d’Israël
  rationale: Conserve la désignation collective et son importance dans le discours prophétique.
- source_word: וְיָבֹאוּ יַחְדָּו
  choice: et ensemble elles viendront
  rationale: Rend distinctement le verbe « venir » et l’adverbe « ensemble », tout en accordant le pronom avec les deux maisons en français.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: du pays du nord
  rationale: Préserve le motif géographique et prophétique du retour depuis le nord dans une formulation française naturelle.
- source_word: עַל הָאָרֶץ
  choice: vers le pays
  rationale: Dans ce contexte de déplacement, עַל indique la destination; « vers » évite une formulation française pesante tout en conservant le mouvement.
- source_word: אֲשֶׁר הִנְחַלְתִּי
  choice: que j’ai donné en héritage
  rationale: Exprime la valeur causative du hiphil de נחל, qui présente le pays comme un héritage accordé par Dieu.
- source_word: אֶת אֲבוֹתֵיכֶם
  choice: à vos pères
  rationale: Reproduit le masculin pluriel explicite de l’hébreu; « à vos ancêtres » reste une possibilité sémantique plus générale.
theological_decisions:
- issue: Réunion de Juda et d’Israël
  choice: « la maison de Juda se joindra à la maison d’Israël »
  alternative: « la maison de Juda ira vers la maison d’Israël »
  rationale: Le contexte de restauration et la proposition « ensemble elles viendront » favorisent l’idée de ralliement et d’unité retrouvée, sans suggérer une domination ou une attaque.
- issue: Portée de אֲבוֹתֵיכֶם
  choice: « vos pères »
  alternative: « vos ancêtres »
  rationale: Le texte hébreu emploie une forme masculine explicite. La traduction principale la conserve, tandis que la note signale le sens collectif possible.
translation_notes:
  register: Français international moderne, clair et digne. Le tour prophétique « En ces jours-là » et les expressions « maison de Juda » et « maison d’Israël » sont conservés; la syntaxe demeure fluide pour un lectorat général.
