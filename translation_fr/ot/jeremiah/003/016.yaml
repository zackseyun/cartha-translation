  text: וְ/הָיָ֡ה כִּ֣י תִרְבּוּ֩ וּ/פְרִיתֶ֨ם בָּ/אָ֜רֶץ בַּ/יָּמִ֤ים הָ/הֵ֨מָּה֙ נְאֻם יְהוָ֔ה לֹא יֹ֣אמְרוּ ע֗וֹד אֲרוֹן֙ בְּרִית יְהוָ֔ה וְ/לֹ֥א יַעֲלֶ֖ה עַל לֵ֑ב וְ/לֹ֤א יִזְכְּרוּ ב/וֹ֙ וְ/לֹ֣א יִפְקֹ֔דוּ וְ/לֹ֥א יֵעָשֶׂ֖ה עֽוֹד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/016.yaml
  text: And it shall be[a], when you have multiplied and been fruitful in the land in those days, declares Yahweh, they will no longer say, ‘The ark of the covenant of Yahweh.’ It will not come to mind, and they will not remember it or miss it[b], nor will it be made again.
translation:
  language: fr
  text: 'Quand vous serez devenus nombreux et féconds dans le pays, en ces jours-là — déclaration de Yahweh —, on ne dira plus : « L’arche de l’alliance de Yahweh. » Elle ne viendra plus à l’esprit, on ne se souviendra plus d’elle, on ne la regrettera pas[a] et on n’en fera plus[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « on ne s’en préoccupera pas » ou « on ne la recherchera pas ». Le verbe hébreu peut prendre plusieurs sens voisins ; ici, il indique probablement que l’absence de l’arche ne sera plus ressentie comme un manque.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « on ne fabriquera pas d’autre arche ». La tournure hébraïque est passive et laisse l’objet implicite ; il s’agit vraisemblablement de ne pas construire une arche de remplacement.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: La formule introduit ici une circonstance future. En français actuel, « Quand » exprime naturellement cette relation temporelle sans alourdir la phrase.
- source_word: תִרְבּוּ וּפְרִיתֶם
  choice: vous serez devenus nombreux et féconds
  rationale: « Devenus nombreux » rend רבה, tandis que « féconds » conserve le sens de פרה et l’écho de la formule biblique associant multiplication et fécondité.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Dans ce contexte, אֶרֶץ désigne vraisemblablement le territoire d’Israël/Juda plutôt que la terre entière.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: en ces jours-là
  rationale: Formule prophétique traditionnelle, claire et naturelle en français moderne.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formulation distingue la formule solennelle נְאֻם de la simple parole rapportée et conserve le nom divin.
- source_word: לֹא יֹאמְרוּ עוֹד
  choice: on ne dira plus
  rationale: Le pronom indéfini « on » rend naturellement en français le pluriel non précisé du verbe hébreu.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: L’arche de l’alliance de Yahweh
  rationale: Rendu transparent de la chaîne construite, conservé comme une expression citée conformément au verbe « dire ».
- source_word: וְלֹא יַעֲלֶה עַל לֵב
  choice: Elle ne viendra plus à l’esprit
  rationale: Rend idiomatiquement l’expression hébraïque littérale « monter sur le cœur », c’est-à-dire venir à la pensée.
- source_word: וְלֹא יִזְכְּרוּ בוֹ
  choice: on ne se souviendra plus d’elle
  rationale: Le suffixe pronominal renvoie à l’arche; la reprise féminine est naturelle en français.
- source_word: וְלֹא יִפְקֹדוּ
  choice: on ne la regrettera pas
  rationale: פקד possède ici plusieurs nuances possibles. « Regretter » exprime probablement l’idée que l’absence de l’arche ne sera plus ressentie comme un manque, tout en signalant l’incertitude en note.
- source_word: וְלֹא יֵעָשֶׂה עוֹד
  choice: on n’en fera plus
  rationale: Le passif hébreu laisse son objet implicite. Cette formulation française concise renvoie à l’arche sans imposer dans le corps du texte la notion explicite de remplacement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre et suit le choix éditorial indiqué, sans le remplacer par un titre.
- issue: Statut futur de l’arche
  choice: Conserver les négations concrètes concernant sa mention, son souvenir, le sentiment de son absence et sa fabrication
  alternative: Interpréter explicitement le verset comme l’abolition de toute portée de l’ancienne alliance, ou seulement comme la prédiction de la perte matérielle de l’arche
  rationale: Le verset décrit la disparition de l’arche comme point de référence, mais ne formule pas à lui seul une doctrine générale sur l’alliance. La traduction évite donc d’élargir son affirmation.
- issue: Objet implicite de יֵעָשֶׂה
  choice: Renvoyer implicitement à l’arche par « en »
  alternative: « on ne fabriquera pas d’autre arche »
  rationale: Le sens d’une arche de remplacement est probable, mais le passif hébreu ne nomme pas explicitement l’objet. Une note expose cette lecture sans supprimer l’ellipse du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le rythme prophétique grâce à l’incise « déclaration de Yahweh », tandis que les idiomes hébreux sont rendus naturellement. Les répétitions négatives restent perceptibles sans produire une syntaxe artificielle.
