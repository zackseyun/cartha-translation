id: JER.3.14
reference: Jeremiah 3:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שׁ֣וּבוּ בָנִ֤ים שׁוֹבָבִים֙ נְאֻם יְהוָ֔ה כִּ֥י אָנֹכִ֖י בָּעַ֣לְתִּי בָ/כֶ֑ם וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶחָ֣ד מֵ/עִ֗יר וּ/שְׁנַ֨יִם֙ מִ/מִּשְׁפָּחָ֔ה וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/014.yaml
  text: Return[a], O faithless children, declares Yahweh, for I am your master; and I will take you, one from a city and two from a clan, and I will bring you to Zion.
translation:
  language: fr
  text: Revenez, fils infidèles, déclare Yahweh, car je suis votre maître[a]. Je vous prendrai, un d’une ville et deux d’un clan, et je vous conduirai à Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je suis votre mari » ou « je vous ai épousés ». Le verbe hébreu peut exprimer aussi bien l’autorité d’un maître que la relation conjugale.'
    reason: alternative_reading
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Revenez
  rationale: L’impératif de שוב appelle ici au retour vers Yahweh et à la relation d’alliance; « Revenez » conserve à la fois les dimensions relationnelle et spatiale sans expliciter davantage par « repentez-vous ».
- source_word: בָנִים שׁוֹבָבִים
  choice: enfants infidèles
  rationale: בָנִים peut désigner ici les membres du peuple comme enfants de Yahweh, tandis que שׁוֹבָבִים évoque ceux qui se sont détournés et ont rompu leur fidélité. Cette formulation est naturelle en français et maintient la portée collective.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend la formule prophétique solennelle נְאֻם et conserve le nom divin personnel יהוה sous la forme « Yahweh ».
- source_word: כִּי אָנֹכִי בָּעַלְתִּי בָכֶם
  choice: car je suis votre maître
  rationale: Le verbe בעל peut exprimer l’autorité d’un maître ou la relation d’un mari. Le sens d’autorité est retenu dans le texte, tandis que la nuance conjugale, importante dans le contexte, est signalée en note.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: Je vous prendrai
  rationale: Traduction directe de לקח qui convient à l’image du rassemblement et de la restauration annoncés.
- source_word: אֶחָד מֵעִיר וּשְׁנַיִם מִמִּשְׁפָּחָה
  choice: un d’une ville et deux d’un clan
  rationale: La formulation conserve la construction distributive sans ajouter « chaque », absent du texte. מִשְׁפָּחָה désigne ici vraisemblablement un groupe de parenté plus large qu’une famille nucléaire.
- source_word: וְהֵבֵאתִי אֶתְכֶם צִיּוֹן
  choice: et je vous conduirai à Sion
  rationale: « Conduire à » exprime naturellement en français le déplacement sous la direction de Yahweh vers Sion.
theological_decisions:
- issue: Faut-il mettre au premier plan la nuance conjugale de בָּעַלְתִּי ?
  choice: « je suis votre maître » dans le texte, avec la nuance conjugale en note
  alternative: « je suis votre mari » ou « je vous ai épousés »
  rationale: Le verbe hébreu superpose potentiellement autorité et mariage. Le contexte du chapitre soutient l’image conjugale, mais l’adresse « enfants » rend sa formulation directe moins naturelle. La note préserve cette ambiguïté et la tension théologique sans les résoudre artificiellement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu sans devenir artificielle; le nom « Yahweh » et le toponyme traditionnel « Sion » sont conservés.
