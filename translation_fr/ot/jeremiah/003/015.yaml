id: JER.3.15
reference: Jeremiah 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַתִּ֥י לָ/כֶ֛ם רֹעִ֖ים כְּ/לִבִּ֑/י וְ/רָע֥וּ אֶתְ/כֶ֖ם דֵּעָ֥ה וְ/הַשְׂכֵּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/015.yaml
  text: And I will give you shepherds after my own heart[c][b][a], and they will shepherd you with knowledge and understanding.
translation:
  language: fr
  text: Je vous donnerai des bergers[a] selon mon cœur[b], et ils prendront soin de vous avec connaissance et discernement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « pasteurs », mais l’hébreu emploie l’image plus large de bergers qui prennent soin du peuple de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, en accord avec ma volonté et mes desseins.
    reason: idiom_clarification
  - marker: c
    text: Ou « avec connaissance et intelligence avisée » ; le second terme peut aussi exprimer la perspicacité ou la sagesse pratique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je vous donnerai
  rationale: Le parfait qal à la première personne, relié au contexte prophétique, exprime ici une promesse future. La tournure française intègre naturellement le complément indirect לָכֶם.
- source_word: רֹעִים
  choice: bergers
  rationale: Le terme désigne littéralement des bergers et, par métaphore, les responsables qui prennent soin du peuple. « Bergers » conserve cette image sans introduire la notion ecclésiale plus particulière de « pasteurs ».
- source_word: כְּלִבִּי
  choice: selon mon cœur
  rationale: Cette expression proche de la forme hébraïque évoque l’accord avec la volonté, les desseins et les dispositions de Dieu, plutôt qu’une simple affection divine.
- source_word: וְרָעוּ אֶתְכֶם
  choice: et ils prendront soin de vous
  rationale: Le verbe רעה signifie faire paître, conduire ou prendre soin comme un berger. Cette formulation française naturelle garde l’étendue de l’action pastorale sans réduire celle-ci au seul fait de nourrir.
- source_word: דֵּעָה
  choice: connaissance
  rationale: Le nom exprime normalement la connaissance. Ce choix le distingue du terme suivant.
- source_word: וְהַשְׂכֵּיל
  choice: et discernement
  rationale: La forme renvoie à l’intelligence avisée, à la perspicacité ou au discernement. « Discernement » forme avec « connaissance » un couple clair et naturel en français moderne.
theological_decisions:
- issue: Nature des bergers promis
  choice: Des responsables humains donnés par Dieu, décrits par la métaphore du berger
  alternative: Des pasteurs au sens spécifiquement ecclésial, ou plus étroitement des rois et gouvernants
  rationale: Dans le contexte de Jérémie, la promesse porte sur une direction restaurée du peuple de l’alliance. La métaphore générale laisse ouverte l’étendue exacte des fonctions sans importer une structure ecclésiale ultérieure.
- issue: Sens de « selon mon cœur »
  choice: Des responsables conformes à la volonté et aux desseins de Dieu
  alternative: Des responsables qui seraient seulement particulièrement aimés de Dieu
  rationale: L’expression hébraïque indique principalement la conformité au cœur, c’est-à-dire à la volonté ou aux dispositions de Dieu, et non la seule affection.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore du berger est conservée dans le nom, tandis que le verbe est rendu idiomatiquement par « prendre soin de » afin d’éviter la formulation peu naturelle ou excessivement pastorale « faire paître des personnes ». Le parallélisme « connaissance et discernement » maintient les deux notions distinctes.
