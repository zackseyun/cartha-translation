  source_fidelity: 'Le texte français rend fidèlement les principaux éléments hébreux : la rétention passive des pluies, l’absence de la pluie tardive, l’image concrète du « front d’une prostituée » et le refus délibéré d’éprouver la honte. L’agent de la rétention reste, à juste titre, implicite. « Pluie de printemps » communique correctement la valeur saisonnière de מַלְקוֹשׁ, tandis que la note conserve l’alternative plus littérale « pluie tardive ».'
