id: JER.3.3
reference: Jeremiah 3:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּמָּנְע֣וּ רְבִבִ֔ים וּ/מַלְק֖וֹשׁ ל֣וֹא הָיָ֑ה וּ/מֵ֨צַח אִשָּׁ֤ה זוֹנָה֙ הָ֣יָה לָ֔/ךְ מֵאַ֖נְתְּ הִכָּלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/003.yaml
  text: Therefore the showers were withheld[a], and there was no spring rain; yet you had the forehead of a prostitute—you refused to be ashamed.
translation:
  language: fr
  text: C’est pourquoi les averses ont été retenues, et il n’y a pas eu de pluie de printemps[a]. Pourtant, tu as eu le front d’une prostituée ; tu as refusé d’avoir honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pluie tardive ». Le terme hébreu désigne la pluie de fin de saison, qui tombe au printemps dans le cycle agricole.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּנְעוּ
  choice: ont été retenues
  rationale: Le niphal de מנע exprime ici le fait que les pluies ont été retenues. La tournure passive conserve l’agent implicite et convient au contexte de jugement.
- source_word: רְבִבִים
  choice: les averses
  rationale: Le nom désigne des pluies ou averses. « Les averses » est concret, naturel et fidèle à l’image météorologique.
- source_word: מַלְקוֹשׁ
  choice: pluie de printemps
  rationale: Le terme désigne la pluie tardive de la saison agricole, qui tombe au printemps. Cette formulation en communique clairement le sens aux lecteurs modernes.
- source_word: מֵצַח
  choice: front
  rationale: Le mot désigne littéralement le front. Le maintien de cette image corporelle préserve l’expression frappante de l’impudence.
- source_word: אִשָּׁה זוֹנָה
  choice: une prostituée
  rationale: L’expression désigne littéralement une femme qui se prostitue. « Une prostituée » est actuel, compréhensible et moins archaïque que « courtisane ».
- source_word: הָיָה לָךְ
  choice: tu as eu
  rationale: Cette construction avec היה et ל exprime la possession. Le passé composé s’intègre naturellement à la suite des événements décrits.
- source_word: מֵאַנְתְּ
  choice: tu as refusé
  rationale: מאן exprime un refus délibéré ; « tu as refusé » en conserve la force directe.
- source_word: הִכָּלֵם
  choice: d’avoir honte
  rationale: L’infinitif de כלם évoque ici l’expérience de la honte. Après « refuser », « d’avoir honte » est une formulation française naturelle.
theological_decisions:
- issue: Métaphore sexuelle de l’infidélité envers l’alliance
  choice: Conserver directement l’image du « front d’une prostituée ».
  alternative: Rendre seulement l’idée par « tu as été effrontée » ou « tu n’as eu aucune honte ».
  rationale: La formulation prophétique rapproche volontairement la prostitution de l’infidélité de Juda. Garder l’image préserve sa vigueur et sa portée théologique sans la réduire à une simple remarque sur l’impudence.
- issue: Agent qui retient les pluies
  choice: Employer une tournure passive sans nommer explicitement l’agent.
  alternative: Préciser que Dieu a retenu les pluies.
  rationale: Le texte hébreu emploie une forme passive et laisse l’agent inexprimé. Le contexte peut suggérer l’action divine, mais la traduction ne doit pas expliciter ce que ce verset garde implicite.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe reste accessible tout en conservant le parallélisme, le passif du jugement et l’image volontairement rude du texte hébreu.
