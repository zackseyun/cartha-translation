  text: נִשְׁכְּבָ֣ה בְּ/בָשְׁתֵּ֗/נוּ וּֽ/תְכַסֵּ/נוּ֮ כְּלִמָּתֵ/נוּ֒ כִּי֩ לַ/יהוָ֨ה אֱלֹהֵ֜י/נוּ חָטָ֗אנוּ אֲנַ֨חְנוּ֙ וַ/אֲבוֹתֵ֔י/נוּ מִ/נְּעוּרֵ֖י/נוּ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/לֹ֣א שָׁמַ֔עְנוּ בְּ/ק֖וֹל יְהֹוָ֥ה אֱלֹהֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/025.yaml
  text: Let us lie down in our shame[a], and let our disgrace cover us, for we have sinned against Yahweh our God—we and our fathers—from our youth even to this day, and we have not obeyed the voice of Yahweh our God.
translation:
  language: fr
  text: Couchons-nous dans notre honte, et que notre humiliation nous couvre, car nous avons péché contre Yahvé, notre Dieu, nous et nos ancêtres[a], depuis notre jeunesse jusqu’à ce jour, et nous n’avons pas obéi à la voix de Yahvé, notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « nos pères ».'
    reason: Précision lexicale sur la forme hébraïque אָבוֹתֵינוּ.
lexical_decisions:
- source_word: נִשְׁכְּבָה
  choice: Couchons-nous
  rationale: Le cohortatif qal à la première personne du pluriel exprime ici une exhortation volontaire et conserve l’image concrète de personnes qui se couchent, accablées de honte.
- source_word: בְּבָשְׁתֵּנוּ
  choice: dans notre honte
  rationale: La préposition ב marque la condition dans laquelle le peuple se couche ; cette formulation est directe et naturelle en français.
- source_word: וּתְכַסֵּנוּ כְּלִמָּתֵנוּ
  choice: et que notre humiliation nous couvre
  rationale: Le tour avec « que » rend la valeur volitive de l’imparfait en parallèle avec le cohortatif précédent. « Humiliation » distingue כְּלִמָּה de בֹּשֶׁת sans effacer le parallélisme.
- source_word: לַיהוָה ... חָטָאנוּ
  choice: nous avons péché contre Yahvé
  rationale: Avec חטא, ל désigne ici celui envers qui la faute a été commise ; « pécher contre » l’exprime clairement.
- source_word: אֲנַחְנוּ וַאֲבוֹתֵינוּ
  choice: nous et nos ancêtres[a]
  rationale: Dans ce contexte de culpabilité nationale prolongée depuis la jeunesse d’Israël, « ancêtres » communique naturellement la portée générationnelle ; une note conserve le sens littéral du terme masculin « pères ».
- source_word: מִנְּעוּרֵינוּ וְעַד הַיּוֹם הַזֶּה
  choice: depuis notre jeunesse jusqu’à ce jour
  rationale: Cette expression restitue la continuité temporelle de la rébellion depuis les débuts du peuple jusqu’au présent.
- source_word: וְלֹא שָׁמַעְנוּ בְּקוֹל
  choice: et nous n’avons pas écouté la voix
  rationale: La formulation garde l’image hébraïque de l’écoute de la voix, tout en laissant entendre son sens idiomatique d’obéissance.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » translittère le nom divin יהוה au lieu de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahvé » conserve sa fonction de nom propre dans un français moderne et digne.
- issue: Portée générationnelle de וַאֲבוֹתֵינוּ
  choice: nos ancêtres
  alternative: nos pères
  rationale: Le contexte vise les générations précédentes d’Israël. « Ancêtres » rend cette portée sans exclure artificiellement les femmes, tandis que la note signale la forme littérale masculine.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Le parallélisme pénitentiel et l’image de la honte qui couvre le peuple sont conservés ; la ponctuation souligne l’exhortation initiale sans ajouter de contenu.
