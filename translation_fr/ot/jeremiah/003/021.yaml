source:
  edition: WLC
  text: ק֚וֹל עַל שְׁפָיִ֣ים נִשְׁמָ֔ע בְּכִ֥י תַחֲנוּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל כִּ֤י הֶעֱוּוּ֙ אֶת דַּרְכָּ֔/ם שָׁכְח֖וּ אֶת יְהֹוָ֥ה אֱלֹהֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/021.yaml
  text: A voice is heard on the bare heights[a], the weeping and pleas for mercy of the sons of Israel, because they have made their way crooked[c][b]; they have forgotten Yahweh their God.
translation:
  language: fr
  text: 'Une voix se fait entendre sur les hauteurs dénudées : ce sont les pleurs et les supplications des fils d’Israël[a], car ils ont rendu leur chemin tortueux[b] ; ils ont oublié Yahweh, leur Dieu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des enfants d’Israël » ou « du peuple d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ils ont perverti leur conduite » ou « ils ont déformé leur voie ».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu porte YHWH, nom divin traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: ק֚וֹל
  choice: Une voix
  rationale: קוֹל désigne couramment une voix ou un bruit. « Une voix » conserve l’introduction vive du texte, tandis que la suite en précise la nature.
- source_word: עַל שְׁפָיִים
  choice: sur les hauteurs dénudées
  rationale: שְׁפָיִים désigne des hauteurs découvertes et sans végétation. « Hauteurs dénudées » exprime à la fois l’élévation et le caractère exposé, sans imposer le sens technique de lieux de culte.
- source_word: נִשְׁמָע
  choice: se fait entendre
  rationale: Le niphal de שׁמע a ici un sens passif. « Se fait entendre » est naturel en français et garde la mise en relief auditive.
- source_word: בְּכִי תַחֲנוּנֵי
  choice: les pleurs et les supplications
  rationale: בְּכִי signifie « pleurs » et תַחֲנוּנִים des appels insistants à la faveur ou à la compassion. « Supplications » conserve la gravité pénitentielle sans ajouter explicitement un objet absent de l’hébreu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: La construction signifie littéralement « fils d’Israël ». Cette forme conserve l’expression masculine du texte ; une note indique son emploi collectif possible.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la cause des pleurs. « Car » convient au registre solennel tout en restant courant.
- source_word: הֶעֱוּוּ אֶת דַּרְכָּם
  choice: ils ont rendu leur chemin tortueux
  rationale: Le hiphil de עוה exprime l’action de rendre courbe, tortueux ou pervers. Cette formulation préserve la métaphore concrète du chemin et sa portée morale.
- source_word: שָׁכְחוּ
  choice: ils ont oublié
  rationale: Le parfait décrit l’oubli accompli qui explique la lamentation présente. Le passé composé est naturel en français.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Le texte porte le Tétragramme, nom personnel divin. « Yahweh » le représente comme nom plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: La construction avec suffixe signifie directement « leur Dieu » et souligne la relation d’alliance rendue tragique par leur oubli.
theological_decisions:
- issue: Rendu du nom divin יְהֹוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le Tétragramme. Le translittérer par « Yahweh » distingue le nom personnel du titre אֲדֹנָי et préserve la portée relationnelle de « leur Dieu ».
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les enfants d’Israël / le peuple d’Israël
  rationale: La forme hébraïque est masculine plurielle, mais l’expression peut désigner collectivement les Israélites. Le texte principal conserve la forme source et la note signale la portée collective sans la trancher silencieusement.
- issue: Valeur morale de הֶעֱוּוּ אֶת דַּרְכָּם
  choice: ont rendu leur chemin tortueux
  alternative: ont perverti leur conduite
  rationale: La traduction retenue garde l’image hébraïque du chemin déformé tout en laissant le contexte communiquer sa dimension morale, plutôt que de remplacer directement la métaphore par une interprétation abstraite.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase explicative « ce sont » clarifie l’apposition entre la voix entendue et les pleurs sans ajouter une provenance absente du texte. Le vocabulaire conserve les images hébraïques des hauteurs et du chemin tortueux.
