  rationale: La révision rend explicitement la causalité et la valeur cumulative de l’expression hébraïque, améliore l’idiomaticité française de la désignation d’Israël et conserve les images conjugales, juridiques et sexuelles ainsi que la variation rhétorique entre « infidèle » et « perfide ». Les repères de notes restent correctement ancrés.
