id: JER.3.8
reference: Jeremiah 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אֵ֗רֶא כִּ֤י עַל כָּל אֹדוֹת֙ אֲשֶׁ֤ר נִֽאֲפָה֙ מְשֻׁבָ֣ה יִשְׂרָאֵ֔ל שִׁלַּחְתִּ֕י/הָ וָ/אֶתֵּ֛ן אֶת סֵ֥פֶר כְּרִיתֻתֶ֖י/הָ אֵלֶ֑י/הָ וְ/לֹ֨א יָֽרְאָ֜ה בֹּֽגֵדָ֤ה יְהוּדָה֙ אֲחוֹתָ֔/הּ וַ/תֵּ֖לֶךְ וַ/תִּ֥זֶן גַּם הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/008.yaml
  text: And I saw that because backsliding Israel had committed adultery in all these matters[a], I had sent her away and given her a certificate of divorce. Yet her treacherous sister Judah did not fear[c][b], but she too went and prostituted herself.
translation:
  language: fr
  text: 'J’ai vu que, à cause de tous les adultères commis par Israël l’infidèle, je l’avais renvoyée et lui avais donné un acte de divorce[a]. Pourtant, Juda, sa sœur perfide, n’a pas eu peur : elle aussi est allée se prostituer[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une lettre de divorce ». L’hébreu désigne le document juridique qui officialise le divorce.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression prolonge la métaphore du chapitre : l’infidélité envers Dieu est décrite comme une prostitution.'
    reason: metaphor_clarification
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Je vis
  rationale: Rend directement le verbe ראה à la première personne et conserve la progression narrative.
- source_word: כִּי עַל כָּל אֹדוֹת אֲשֶׁר נִאֲפָה
  choice: que, parce que… avait commis l’adultère en toutes ces occasions
  rationale: La formulation garde à la fois la perception introduite par כִּי et la valeur causale de עַל כָּל אֹדוֹת אֲשֶׁר, tout en restant naturelle en français.
- source_word: מְשֻׁבָה יִשְׂרָאֵל
  choice: Israël la rebelle
  rationale: מְשֻׁבָה évoque le fait de se détourner. « La rebelle » exprime cette défection en français courant sans confondre ce terme avec בֹּגֵדָה.
- source_word: שִׁלַּחְתִּיהָ
  choice: je l’avais renvoyée
  rationale: Dans la métaphore conjugale, « renvoyer » convient au contexte du divorce et restitue l’action antérieure motivée par l’adultère.
- source_word: סֵפֶר כְּרִיתֻתֶיהָ
  choice: un acte de divorce
  rationale: Désigne clairement le document juridique formalisant le divorce, dans un registre moderne et digne.
- source_word: וְלֹא יָרְאָה
  choice: n’eut pas peur
  rationale: Conserve le sens premier de ירא plutôt que d’expliciter par « ne tira pas la leçon », ce qui préserverait moins bien l’ambiguïté du texte.
- source_word: בֹּגֵדָה יְהוּדָה
  choice: Juda… perfide
  rationale: « Perfide » rend la déloyauté traîtresse de בגד et maintient la distinction lexicale avec מְשֻׁבָה.
- source_word: וַתֵּלֶךְ וַתִּזֶן
  choice: alla se prostituer
  rationale: Préserve sans l’atténuer la métaphore sexuelle employée pour l’infidélité à l’alliance.
theological_decisions:
- issue: Maintien de la métaphore conjugale de l’infidélité à l’alliance
  choice: Conserver « adultère », « renvoyée », « acte de divorce » et « se prostituer »
  alternative: Remplacer l’ensemble par un vocabulaire général d’infidélité ou d’idolâtrie
  rationale: L’hébreu développe explicitement une image conjugale, sexuelle et juridique. La rendre directement préserve la force et la tension de l’accusation prophétique.
- issue: Distinction entre מְשֻׁבָה et בֹּגֵדָה
  choice: « la rebelle » pour Israël et « perfide » pour Juda
  alternative: Employer « infidèle » pour les deux
  rationale: Les deux désignations hébraïques ne sont pas identiques. Les différencier respecte la variation rhétorique du texte.
- issue: Portée de ירא
  choice: « n’eut pas peur »
  alternative: « ne tira pas la leçon » ou « ne fut pas avertie »
  rationale: La traduction littérale laisse ouvertes la crainte du jugement, la crainte de Dieu et l’idée de prendre avertissement, sans imposer une seule interprétation.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La personnification féminine d’Israël et de Juda ainsi que les images fortes de l’adultère, du divorce et de la prostitution sont conservées.
