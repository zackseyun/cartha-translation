revisions:
- from: 'Je vis que, parce qu’Israël la rebelle avait commis l’adultère en toutes ces occasions, je l’avais renvoyée et lui avais donné un acte de divorce[a]. Pourtant, Juda, sa sœur perfide, n’eut pas peur : elle aussi alla se prostituer[b].'
