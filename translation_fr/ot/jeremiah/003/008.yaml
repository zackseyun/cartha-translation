review_pass:
  verdict: revise
  source_fidelity: 'La métaphore conjugale et juridique est bien conservée, de même que la distinction entre Israël et Juda. Toutefois, « en toutes ces occasions » rend פחות précisément עַל כָּל אֹדוֹת אֲשֶׁר : l’expression désigne les motifs ou les actes d’adultère accumulés, plutôt que des « occasions » indéterminées. « À cause de tous les adultères commis par » rend plus directement le rapport causal et la force cumulative de כָּל.'
  naturalness: Le texte est globalement clair, mais « Israël la rebelle » est une apposition peu idiomatique en français international moderne et « en toutes ces occasions » reste lourd. « Israël l’infidèle » est plus naturel dans la personnification conjugale du passage, sans confondre le terme avec « perfide » appliqué à Juda.
  terminology: « Acte de divorce », « renvoyée », « adultères », « perfide » et « se prostituer » conviennent. « Infidèle » pour מְשֻׁבָה est ici préférable à « rebelle », car il s’inscrit naturellement dans l’image matrimoniale tout en laissant « perfide » distinguer בֹּגֵדָה.
  issues:
  - severity: medium
    issue: Rendu de עַל כָּל אֹדוֹת אֲשֶׁר par « en toutes ces occasions »
    rationale: Cette formulation décrit des circonstances, alors que l’hébreu exprime les motifs cumulés du renvoi, liés aux adultères d’Israël. « À cause de tous les adultères commis par » est plus fidèle et naturel.
  - severity: low
    issue: « Israël la rebelle »
    rationale: L’apposition est maladroite en français et « rebelle » met l’accent sur la révolte plutôt que sur le fait de s’être détournée dans le cadre de la métaphore conjugale. « Israël l’infidèle » est idiomatique et contextuellement juste.
  revised_text: 'J’ai vu que, à cause de tous les adultères commis par Israël l’infidèle, je l’avais renvoyée et lui avais donné un acte de divorce[a]. Pourtant, Juda, sa sœur perfide, n’a pas eu peur : elle aussi est allée se prostituer[b].'
