source:
  edition: WLC
  text: אָכֵ֥ן לַ/שֶּׁ֛קֶר מִ/גְּבָע֖וֹת הָמ֣וֹן הָרִ֑ים אָכֵן֙ בַּ/יהֹוָ֣ה אֱלֹהֵ֔י/נוּ תְּשׁוּעַ֖ת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/023.yaml
  text: Surely[a], from the hills comes only falsehood, the tumult on the mountains; surely in Yahweh our God is the salvation of Israel.
translation:
  language: fr
  text: Oui, ce qui vient des collines — le tumulte sur les montagnes[a] — n’est que mensonge ; oui, c’est en Yahweh, notre Dieu, que se trouve le salut d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bruit des montagnes » ; l’hébreu peut aussi se comprendre plus littéralement comme « le tumulte des montagnes ».
    reason: Alternative lexicale et ambiguïté de la relation syntaxique dans הָמוֹן הָרִים.
lexical_decisions:
- source_word: אָכֵן
  choice: Oui
  rationale: La particule marque ici une affirmation emphatique et confessionnelle. La répétition de « Oui » restitue naturellement en français le parallélisme et la force des deux occurrences.
- source_word: לַשֶּׁקֶר
  choice: n’est que mensonge
  rationale: שֶׁקֶר désigne le mensonge ou la fausseté. Dans la syntaxe elliptique, l’expression qualifie de trompeur l’espoir placé dans ce qui vient des collines.
- source_word: מִגְּבָעוֹת
  choice: ce qui vient des collines
  rationale: Le préfixe מִן indique la provenance. Cette formulation garde l’image des collines tout en rendant explicite, sans surinterprétation, l’ellipse hébraïque.
- source_word: הָמוֹן הָרִים
  choice: ce tumulte sur les montagnes
  rationale: הָמוֹן peut désigner un bruit, un tumulte ou une foule. « Tumulte » convient au contexte probable des pratiques cultuelles sur les hauteurs, tandis que la note préserve l’ambiguïté de la construction hébraïque.
- source_word: בַּיהוָה
  choice: c’est en Yahweh … que se trouve
  rationale: La préposition בְּ exprime ici le lieu ou la source où réside le salut, en contraste avec les collines trompeuses. La tournure clivée est naturelle en français et souligne ce contraste.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Traduction directe de la désignation confessionnelle et relationnelle.
- source_word: תְּשׁוּעַת יִשְׂרָאֵל
  choice: le salut d’Israël
  rationale: Cette formulation conserve la relation de construit, qui peut désigner le salut appartenant à Israël ou accordé à Israël, sans trancher inutilement.
theological_decisions:
- issue: Contraste implicite entre les hauteurs cultuelles et Yahweh comme véritable source du salut
  choice: Les collines et le tumulte des montagnes sont présentés comme mensongers, tandis que le salut d’Israël se trouve en Yahweh.
  alternative: Comprendre הָמוֹן הָרִים plus littéralement comme « la multitude des montagnes », sans référence probable au tumulte cultuel.
  rationale: Le contexte de Jérémie associe fréquemment collines et montagnes au culte infidèle. La traduction maintient ce contraste implicite sans ajouter « idoles » ou « hauts lieux », termes absents du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise de « Oui » conserve l’élan confessionnel du verset ; la tournure « c’est en… que » met en relief le contraste sans alourdir la phrase.
