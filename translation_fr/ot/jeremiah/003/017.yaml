source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא יִקְרְא֤וּ לִ/ירוּשָׁלִַ֨ם֙ כִּסֵּ֣א יְהוָ֔ה וְ/נִקְוּ֨וּ אֵלֶ֧י/הָ כָֽל הַ/גּוֹיִ֛ם לְ/שֵׁ֥ם יְהוָ֖ה לִ/ירוּשָׁלִָ֑ם וְ/לֹא יֵלְכ֣וּ ע֔וֹד אַחֲרֵ֕י שְׁרִר֖וּת לִבָּ֥/ם הָ/רָֽע־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/017.yaml
  text: At that time they will call Jerusalem ‘the throne of Yahweh,’ and all the nations will gather to it[a], to Jerusalem, for the name of Yahweh[b]. They will no longer walk after the stubbornness of their evil heart.
translation:
  language: fr
  text: À ce moment-là, on appellera Jérusalem « le trône de Yahweh », et toutes les nations s’y rassembleront[a], à Jérusalem, en l’honneur du nom de Yahweh[b]. Elles ne suivront plus l’obstination de leur cœur mauvais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « y seront rassemblées » ou « y afflueront ». Le verbe hébreu est difficile ici ; dans ce contexte, il décrit les nations qui convergent vers Jérusalem.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « pour le nom de Yahweh ». L’expression peut aussi être comprise comme « vers le nom de Yahweh » ; elle associe la venue des nations au nom de Yahweh, sans préciser davantage la nature de leur démarche.
    reason: translation_clarification
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: À ce moment-là
  rationale: Expression temporelle française naturelle qui conserve le repère prophétique introduisant la scène future.
- source_word: יִקְרְאוּ לִירוּשָׁלַם כִּסֵּא יְהוָה
  choice: on appellera Jérusalem « le trône de Yahweh »
  rationale: Le pronom indéfini « on » rend naturellement en français le pluriel non précisé du verbe hébreu, tout en conservant la construction active et l’image du trône.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle en français moderne du nom divin, plutôt que substitution par un titre.
- source_word: וְנִקְוּוּ אֵלֶיהָ
  choice: et toutes les nations s’y rassembleront
  rationale: Dans ce contexte, le niphal de קוה décrit le rassemblement des nations vers Jérusalem. « S’y rassembleront » est idiomatique et garde l’orientation vers la ville sans imposer l’idée plus précise de pèlerinage.
- source_word: כָל הַגּוֹיִם
  choice: toutes les nations
  rationale: Le terme désigne ici largement les peuples du monde; « nations » convient mieux que « païens » ou « Gentils ».
- source_word: לְשֵׁם יְהוָה
  choice: pour le nom de Yahweh
  rationale: Cette formulation concise conserve l’ambiguïté de la préposition ל, qui peut exprimer l’orientation vers le nom ou l’honneur qui lui est rendu.
- source_word: לִירוּשָׁלָם
  choice: à Jérusalem
  rationale: La répétition explicite du nom de la ville est maintenue comme dans l’hébreu.
- source_word: וְלֹא יֵלְכוּ עוֹד אַחֲרֵי
  choice: Elles ne suivront plus
  rationale: « Suivre » rend naturellement l’idiome hébreu « marcher après » en français courant, sans perdre l’idée d’une conduite déterminée par quelque chose.
- source_word: שְׁרִרוּת לִבָּם הָרָע
  choice: l’obstination de leur cœur mauvais
  rationale: « Obstination » exprime la ténacité rebelle de שְׁרִרוּת. Le singulier collectif « leur cœur » suit l’hébreu, et « mauvais » traduit directement הָרָע.
theological_decisions:
- issue: Jérusalem appelée « le trône de Yahweh »
  choice: Conserver directement l’image sans en préciser l’accomplissement eschatologique.
  alternative: Interpréter explicitement l’expression comme symbolique, ecclésiale ou comme un règne futur littéral.
  rationale: Le verset identifie Jérusalem au lieu du règne royal de Yahweh, mais ne définit pas ici la nature exacte de cet accomplissement.
- issue: Mouvement des nations vers Jérusalem
  choice: Le rendre comme un rassemblement vers Jérusalem.
  alternative: Le préciser comme pèlerinage cultuel, conversion spirituelle ou soumission politique.
  rationale: Le texte indique un mouvement collectif vers Jérusalem en rapport avec le nom de Yahweh, sans imposer une seule de ces interprétations.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe active est préservée là où elle reste naturelle; les répétitions significatives de l’hébreu sont maintenues. Le nom divin est rendu par « Yahweh ».
