source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י צִדְּקָ֥ה נַפְשָׁ֖/הּ מְשֻׁבָ֣ה יִשְׂרָאֵ֑ל מִ/בֹּגֵדָ֖ה יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/011.yaml
  text: And Yahweh said to me[a], “Faithless Israel has shown herself more righteous than treacherous Judah.”
translation:
  language: fr
  text: 'Yahvé m’a dit : « Israël l’infidèle[a] s’est montrée plus juste que Juda la traîtresse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Israël la rebelle » ou « Israël qui s’est détournée ».
    reason: Le terme hébreu qualifie celle qui se détourne ou abandonne sa fidélité ; « infidèle » souligne la rupture relationnelle, tandis que les autres formulations rendent plus explicitement le mouvement d’éloignement.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française établie du nom divin, qui préserve le nom d’alliance dans une graphie naturelle en français moderne.
- source_word: וַיֹּאמֶר אֵלַי
  choice: me dit
  rationale: Rend simplement et naturellement la formule narrative hébraïque, avec le complément à la première personne.
- source_word: צִדְּקָה נַפְשָׁהּ
  choice: s’est montrée plus juste
  rationale: Restitue l’idée réflexive de « son être/elle-même » et, avec le מן comparatif qui suit, exprime une justice relative sans déclarer Israël innocente en elle-même.
- source_word: מְשֻׁבָה
  choice: l’infidèle
  rationale: Désigne Israël comme celle qui s’est détournée de Yahvé; « infidèle » convient au cadre relationnel de l’alliance tout en restant clair et actuel.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom national, ici personnifié au féminin.
- source_word: מִבֹּגֵדָה
  choice: que … la traîtresse
  rationale: Le préfixe מן porte la comparaison, tandis que בגד évoque une trahison active de l’alliance; le féminin conserve la personnification du texte.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle du royaume du Sud, personnifié ici au féminin.
theological_decisions:
- issue: Justice relative d’Israël par rapport à Juda
  choice: « s’est montrée plus juste que »
  alternative: « s’est justifiée par rapport à »
  rationale: La construction établit une comparaison entre deux communautés coupables. Elle maintient le caractère saisissant du jugement sans suggérer qu’Israël serait absolument juste devant Dieu.
translation_notes:
  register: Français moderne, sobre et digne. La personnification féminine d’Israël et de Juda est conservée par les épithètes « l’infidèle » et « la traîtresse ».
