    rationale: Après « Si un homme renvoie sa femme », le subjonctif isolé peut se lire comme une prescription. La coordination « et qu’elle le quitte pour devenir... » exprime clairement la suite hypothétique.
  - severity: medium
    issue: Le texte principal présente וְשׁוֹב אֵלַי comme une question, tandis que sa forme hébraïque est un impératif.
    rationale: La lecture rhétorique est défendable dans le contexte, mais l’impératif féminin singulier doit être rendu dans le texte principal; l’analyse interrogative est conservée en note afin de ne pas effacer l’ambiguïté interprétative.
