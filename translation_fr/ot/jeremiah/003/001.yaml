source:
  edition: WLC
  text: לֵ/אמֹ֡ר הֵ֣ן יְשַׁלַּ֣ח אִ֣ישׁ אֶת אִשְׁתּ/וֹ֩ וְ/הָלְכָ֨ה מֵ/אִתּ֜/וֹ וְ/הָיְתָ֣ה לְ/אִישׁ אַחֵ֗ר הֲ/יָשׁ֤וּב אֵלֶ֨י/הָ֙ ע֔וֹד הֲ/ל֛וֹא חָנ֥וֹף תֶּחֱנַ֖ף הָ/אָ֣רֶץ הַ/הִ֑יא וְ/אַ֗תְּ זָנִית֙ רֵעִ֣ים רַבִּ֔ים וְ/שׁ֥וֹב אֵלַ֖/י נְאֻם יְהֹוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/001.yaml
  text: It is said[a], ‘If a man sends away his wife, and she goes from him and becomes another man’s, will he return to her again? Would not that land be utterly polluted? But you have prostituted yourself with many lovers[b], and would you return to me?’ declares Yahweh.
translation:
  language: fr
  text: 'Il est dit : « Si un homme renvoie sa femme et qu’elle le quitte pour devenir la femme d’un autre, reviendra-t-il encore vers elle ? Cette terre-là ne serait-elle pas tout à fait souillée ? Mais toi, tu t’es prostituée avec de nombreux amants ; reviens vers moi[a] ! » — déclaration de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « … et reviendrais-tu vers moi ? », en comprenant la dernière proposition comme une question rhétorique plutôt que comme un impératif.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֵאמֹר
  choice: Il est dit
  rationale: La forme infinitive introduit ici de manière impersonnelle un cas juridique hypothétique.
- source_word: הֵן
  choice: Si
  rationale: Dans ce cadre juridique, le terme introduit naturellement une supposition.
- source_word: יְשַׁלַּח ... אֶת אִשְׁתּוֹ
  choice: renvoie sa femme
  rationale: Le verbe désigne ici le renvoi marital, c’est-à-dire le divorce, tout en conservant l’image concrète de l’hébreu.
- source_word: וְהָלְכָה מֵאִתּוֹ
  choice: qu’elle le quitte
  rationale: Cette formulation française naturelle exprime le départ de la femme loin de son premier mari.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: devienne la femme d’un autre
  rationale: L’hébreu est elliptique, littéralement « devienne à un autre homme » ; le contexte marital justifie d’expliciter « la femme ».
- source_word: הֲיָשׁוּב אֵלֶיהָ עוֹד
  choice: reviendra-t-il encore vers elle ?
  rationale: La traduction conserve le verbe « revenir », l’adverbe d’itération et la force rhétorique de la question.
- source_word: הֲלוֹא חָנוֹף תֶּחֱנַף הָאָרֶץ הַהִיא
  choice: Ce pays-là ne serait-il pas entièrement souillé ?
  rationale: « Entièrement » rend l’intensification produite par l’infinitif absolu associé au verbe conjugué ; « souillé » convient à la profanation évoquée.
- source_word: וְאַתְּ זָנִית
  choice: Et toi, tu t’es prostituée
  rationale: La formulation garde la vigueur de la métaphore prophétique de l’infidélité, sans archaïsme.
- source_word: רֵעִים רַבִּים
  choice: avec de nombreux amants
  rationale: Bien que le nom puisse signifier « compagnons », le contexte sexuel et conjugal appelle ici « amants ».
- source_word: וְשׁוֹב אֵלַי
  choice: Reviendrais-tu vers moi ?
  rationale: La forme est comprise comme une question rhétorique dans la continuité du passage, tout en signalant en note la lecture impérative possible.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule nominale solennelle rend distinctement la formule prophétique et le nom divin.
theological_decisions:
- issue: 'Valeur de וְשׁוֹב אֵלַי : invitation impérative ou question rhétorique'
  choice: 'Question rhétorique : « Reviendrais-tu vers moi ? »'
  alternative: 'Invitation impérative : « Et pourtant, reviens vers moi ! »'
  rationale: Les questions rhétoriques qui précèdent favorisent la lecture interrogative, laquelle maintient la force accusatrice. Toutefois, la morphologie permet aussi une invitation impérative surprenante ; cette possibilité théologiquement significative est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et direct. Le vocabulaire juridique et conjugal reste accessible ; la métaphore prophétique conserve sa force. Le nom divin est rendu par « Yahweh ».
