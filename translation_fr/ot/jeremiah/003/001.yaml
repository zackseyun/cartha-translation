  verdict: revise
  source_fidelity: La dernière proposition, וְשׁוֹב אֵלַי, est formellement un impératif féminin singulier (« reviens vers moi »). Le contexte permet une compréhension rhétorique, mais le texte principal devrait rendre d’abord cette morphologie et signaler la lecture interrogative en note. La séquence hypothétique initiale est par ailleurs mieux rendue en français par une construction coordonnée, plutôt que par « qu’elle le quitte et devienne », qui sonne comme une injonction.
  naturalness: La révision corrige la syntaxe conditionnelle française et emploie « cette terre-là », plus naturel et plus proche de la portée concrète de הָאָרֶץ. Le registre reste moderne, solennel et accessible.
  terminology: « Renvoie sa femme », « la femme d’un autre », « souillée », « prostituée » et « amants » rendent adéquatement le cadre marital, la souillure de la terre et la métaphore prophétique. « Yahweh » est conservé conformément au choix du projet.
