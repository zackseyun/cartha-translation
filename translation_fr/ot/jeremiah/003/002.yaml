language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שְׂאִֽי עֵינַ֨יִ/ךְ עַל שְׁפָיִ֜ם וּ/רְאִ֗י אֵיפֹה֙ לֹ֣א שגלת עַל דְּרָכִים֙ יָשַׁ֣בְתְּ לָ/הֶ֔ם כַּ/עֲרָבִ֖י בַּ/מִּדְבָּ֑ר וַ/תַּחֲנִ֣יפִי אֶ֔רֶץ בִּ/זְנוּתַ֖יִ/ךְ וּ/בְ/רָעָתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/002.yaml
  text: 'Lift up your eyes to the bare heights and see: where have you not been lain with? By the roads you sat waiting for them[a], like an Arab in the wilderness[b], and you have polluted the land with your prostitution and with your wickedness.'
translation:
  language: fr
  text: 'Lève les yeux vers les hauteurs dénudées et regarde : où n’a-t-on pas couché avec toi[a] ? Au bord des chemins, tu les attendais, assise, comme un Arabe dans le désert[b]. Tu as souillé le pays par ta prostitution et ta méchanceté.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici un verbe sexuel cru, dans une métaphore de l’infidélité envers l’alliance.
    reason: lexical_alternative
  - marker: b
    text: L’image évoque vraisemblablement quelqu’un qui se tient à l’affût le long des routes du désert; elle souligne la recherche délibérée et publique de partenaires, non l’origine ethnique en elle-même.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂאִי עֵינַיִךְ
  choice: Lève les yeux
  rationale: Expression française naturelle qui conserve l’impératif féminin singulier et l’image corporelle de l’hébreu.
- source_word: שְׁפָיִם
  choice: les hauteurs dénudées
  rationale: Désigne des hauteurs sans végétation et laisse subsister leur possible association cultuelle sans traduire directement par « hauts lieux ».
- source_word: שגלת
  choice: n’a-t-on pas couché avec toi
  rationale: Rend directement le sens sexuel, volontairement cru, sans introduire l’idée de contrainte que comporteraient « violer » ou « abuser ».
- source_word: עַל דְּרָכִים יָשַׁבְתְּ לָהֶם
  choice: Au bord des chemins, tu les attendais, assise
  rationale: Explicite idiomatiquement l’attente suggérée par le datif tout en conservant la posture exprimée par ישׁב.
- source_word: כַּעֲרָבִי בַּמִּדְבָּר
  choice: comme un Arabe dans le désert
  rationale: Conserve le sens lexical et historique du comparatif; une note précise que l’image porte sur l’affût le long des routes désertiques.
- source_word: וַתַּחֲנִיפִי אֶרֶץ
  choice: Tu as souillé le pays
  rationale: Le hiphil de חנף exprime ici la contamination morale du pays; « souillé » convient à la rhétorique prophétique.
- source_word: בִּזְנוּתַיִךְ
  choice: par ta prostitution
  rationale: Préserve la métaphore sexuelle vive de l’infidélité d’alliance.
- source_word: וּבְרָעָתֵךְ
  choice: et ta méchanceté
  rationale: Rend le terme moral général רעה avec un poids éthique clair en français moderne.
theological_decisions:
- issue: Métaphore sexuelle prophétique de l’infidélité envers l’alliance
  choice: Conserver dans le texte l’image de la relation sexuelle et de la prostitution.
  alternative: Remplacer la métaphore par une référence explicite à l’idolâtrie.
  rationale: L’hébreu emploie délibérément une image sexuelle choquante. La conserver respecte la rhétorique prophétique et évite d’imposer dans la traduction l’explication théologique de la métaphore.
- issue: Agent et consentement dans שגלת
  choice: Employer la tournure impersonnelle « n’a-t-on pas couché avec toi » sans préciser coercition ou consentement.
  alternative: « où n’as-tu pas été violée ? » ou « où ne t’es-tu pas prostituée ? »
  rationale: La forme hébraïque est passive et le verbe est cru, mais elle ne spécifie pas à elle seule la contrainte; le contexte décrit en même temps une poursuite active des partenaires. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement féminin singulier correspond à l’adresse prophétique faite à Juda. La ponctuation garde la force de l’interpellation, et le vocabulaire sexuel demeure explicite sans devenir artificiellement vulgaire.
