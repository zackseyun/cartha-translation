  variant: modern international French
source:
  edition: WLC
  text: הָלֹ֡ךְ וְ/קָֽרָאתָ֩ אֶת הַ/דְּבָרִ֨ים הָ/אֵ֜לֶּה צָפ֗וֹנָ/ה וְ֠/אָמַרְתָּ שׁ֣וּבָ/ה מְשֻׁבָ֤ה יִשְׂרָאֵל֙ נְאֻם יְהוָ֔ה לֽוֹא אַפִּ֥יל פָּנַ֖/י בָּ/כֶ֑ם כִּֽי חָסִ֤יד אֲנִי֙ נְאֻם יְהוָ֔ה לֹ֥א אֶטּ֖וֹר לְ/עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/012.yaml
  text: 'Go and proclaim these words toward the north[a], and say: Return, faithless Israel, declares Yahweh. I will not look on you in anger, for I am faithful, declares Yahweh; I will not stay angry forever.'
translation:
  language: fr
  text: 'Va proclamer ces paroles en direction du nord et dis : « Reviens, Israël infidèle ! — déclaration de Yahweh. Je ne vous regarderai pas avec colère, car je suis fidèle[a] — déclaration de Yahweh. Je ne resterai pas en colère pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « miséricordieux ». Le terme hébreu peut évoquer la fidélité à l’alliance, la bonté ou la miséricorde.
    reason: Alternative lexicale permettant de préserver l’étendue sémantique de חָסִיד.
lexical_decisions:
- source_word: הָלֹךְ וְקָרָאתָ
  choice: Va proclamer
  rationale: L’infinitif absolu הָלֹךְ renforce l’ordre porté par le verbe suivant. « Va proclamer » rend naturellement l’urgence et la dimension publique de la mission prophétique.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: Cette formulation conserve le pluriel concret de l’hébreu tout en restant idiomatique en français.
- source_word: צָפוֹנָה
  choice: en direction du nord
  rationale: L’adverbe directionnel désigne un mouvement ou une proclamation orientée vers le nord, probablement vers la région associée à Israël exilé.
- source_word: שׁוּבָה
  choice: Reviens
  rationale: Le singulier correspond à Israël personnifié et conserve à la fois la portée relationnelle et l’idée de retour de שׁוב.
- source_word: מְשֻׁבָה יִשְׂרָאֵל
  choice: Israël infidèle
  rationale: מְשֻׁבָה évoque l’abandon ou l’apostasie. « Infidèle » exprime clairement la déloyauté d’Israël dans le cadre de l’alliance.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule nominale solennelle distingue le refrain prophétique d’un simple « dit Yahweh » et rend directement le nom divin.
- source_word: לֹא אַפִּיל פָּנַי בָּכֶם
  choice: Je ne vous regarderai pas avec colère
  rationale: Littéralement, Yahweh ne fera pas « tomber sa face » sur eux. La traduction explicite l’hostilité du visage sans introduire une image obscure en français.
- source_word: חָסִיד אֲנִי
  choice: car je suis fidèle
  rationale: חָסִיד caractérise ici la loyauté bienveillante de Yahweh. « Fidèle » met en avant sa constance dans l’alliance, tandis que l’autre nuance majeure est signalée en note.
- source_word: לֹא אֶטּוֹר לְעוֹלָם
  choice: Je ne resterai pas en colère pour toujours
  rationale: נטר exprime ici le maintien de la colère ou du ressentiment. Cette formulation française claire conserve l’idée de durée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel de l’alliance plutôt que de le remplacer par un titre.
- issue: Nuance de חָסִיד appliqué à Yahweh
  choice: fidèle
  alternative: miséricordieux
  rationale: « Fidèle » fait ressortir la loyauté constante de Yahweh, mais le mot peut également souligner sa bonté ou sa miséricorde. La note conserve cette ambiguïté réelle.
- issue: Passage du singulier au pluriel
  choice: « Reviens » au singulier, puis « vous » au pluriel
  alternative: Uniformiser au singulier
  rationale: Le texte hébreu interpelle d’abord Israël comme une personne collective au singulier, puis emploie un suffixe pluriel. La traduction maintient cette variation plutôt que de la lisser.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif direct et les déclarations brèves conservent la force de l’appel prophétique. Le marqueur de note est placé après « fidèle », le mot auquel la variante se rapporte.
