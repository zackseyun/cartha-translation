  text: וְ/הָיָה֙ מִ/קֹּ֣ל זְנוּתָ֔/הּ וַ/תֶּחֱנַ֖ף אֶת הָ/אָ֑רֶץ וַ/תִּנְאַ֥ף אֶת הָ/אֶ֖בֶן וְ/אֶת הָ/עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/009.yaml
  text: And because of the lightness of her prostitution[b][a], she polluted the land and committed adultery with stone and wood.
translation:
  language: fr
  text: À cause du retentissement de sa prostitution[a], elle a souillé le pays et commis l’adultère avec la pierre et le bois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est difficile. Littéralement, elle évoque le « bruit » ou le « retentissement » de sa prostitution, peut-être sa notoriété. Une autre lecture la comprend comme « à cause de la légèreté de sa prostitution », c’est-à-dire parce qu’elle la banalisait ou la tenait pour peu de chose.
    reason: lexical_alternative
  - marker: b
    text: « La pierre et le bois » désignent ici des idoles faites de ces matériaux.
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל
  choice: par le retentissement de
  rationale: קוֹל désigne littéralement la voix, le son, le bruit ou ce qui se rapporte. « Retentissement » conserve l’image auditive et peut évoquer ici le caractère notoire de la prostitution, sans imposer dans le texte principal l’interprétation selon laquelle celle-ci aurait été tenue pour insignifiante.
- source_word: זְנוּתָהּ
  choice: sa prostitution
  rationale: Le terme garde la force de la métaphore sexuelle employée par le prophète pour l’infidélité idolâtre, dans un français actuel et non archaïque.
- source_word: וַתֶּחֱנַף
  choice: elle a souillé
  rationale: Avec le pays comme complément, « souiller » exprime naturellement la profanation et l’impureté produites par l’infidélité idolâtre.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte d’alliance, le mot vise vraisemblablement le territoire de Juda plutôt que la terre entière.
- source_word: וַתִּנְאַף
  choice: commis l’adultère
  rationale: Cette formulation directe conserve la métaphore conjugale et le sens ordinaire du verbe נאף.
- source_word: אֶת־הָאֶבֶן וְאֶת־הָעֵץ
  choice: avec la pierre et le bois
  rationale: La traduction maintient les matériaux nommés par l’hébreu et laisse implicite, comme le texte source, qu’ils représentent des idoles.
theological_decisions:
- issue: Métaphore sexuelle prophétique de l’idolâtrie
  choice: Conserver « prostitution » et « adultère » dans le texte principal.
  alternative: Remplacer ces termes par « infidélité » ou « apostasie ».
  rationale: Jérémie présente délibérément l’idolâtrie comme une rupture conjugale de l’alliance. Atténuer cette image réduirait la force théologique du texte.
- issue: Référence implicite de « la pierre et le bois »
  choice: Nommer seulement les matériaux dans le texte principal et expliquer l’allusion en note.
  alternative: Traduire explicitement « avec des idoles de pierre et de bois ».
  rationale: L’hébreu emploie une métonymie et n’ajoute pas le mot « idoles » ; la conserver respecte la vigueur de l’expression.
- issue: Ambiguïté de מִקּוֹל זְנוּתָהּ
  choice: Rendre l’image auditive par « par le retentissement de sa prostitution » et signaler les autres compréhensions en note.
  alternative: Traduire « parce qu’elle tenait sa prostitution pour peu de chose » ou « à cause de la légèreté de sa prostitution ».
  rationale: L’expression hébraïque est difficile. Le choix principal reste proche du sens attesté de קוֹל et préserve l’idée possible de notoriété, tandis que la note conserve l’interprétation de banalisation sans la présenter comme certaine.
translation_notes:
  register: Français international moderne, sobre et digne. « Retentissement » est légèrement soutenu mais courant et permet de conserver l’image auditive inhabituelle de l’hébreu. La syntaxe reste concise et prophétique.
