  text: וְ/הַ/בֹּ֗שֶׁת אָֽכְלָ֛ה אֶת יְגִ֥יעַ אֲבוֹתֵ֖י/נוּ מִ/נְּעוּרֵ֑י/נוּ אֶת צֹאנָ/ם֙ וְ/אֶת בְּקָרָ֔/ם אֶת בְּנֵי/הֶ֖ם וְ/אֶת בְּנוֹתֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/024.yaml
  text: But shame has devoured the labor of our fathers from our youth—their flocks and their herds[a], their sons and their daughters.
translation:
  language: fr
  text: 'Mais la honte a dévoré, depuis notre jeunesse, le fruit du travail de nos pères : leur petit et leur gros bétail, leurs fils et leurs filles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la chose honteuse » ; il s’agit probablement d’une désignation méprisante de Baal ou de l’idolâtrie.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַבֹּשֶׁת
  choice: Mais la Honte
  rationale: Le nom signifie littéralement « la honte », mais peut servir chez Jérémie de désignation méprisante de Baal ou de l’idolâtrie. La majuscule signale ici la personnification possible sans expliciter le référent. La conjonction est rendue par « Mais » selon la progression contextuelle.
- source_word: אָכְלָה
  choice: a dévoré
  rationale: Le verbe signifie « manger » et, avec des biens ou des personnes comme objets, « dévorer, consumer ». « A dévoré » conserve l’image vigoureuse de l’hébreu.
- source_word: יְגִיעַ אֲבוֹתֵינוּ
  choice: le fruit du travail de nos pères
  rationale: יְגִיעַ désigne ce que produit ou procure le labeur. « Le fruit du travail » exprime ce résultat et introduit naturellement l’énumération qui suit.
- source_word: מִנְּעוּרֵינוּ
  choice: depuis notre jeunesse
  rationale: Cette formulation française naturelle exprime une durée commencée dans la jeunesse et prolongée jusqu’au moment évoqué.
- source_word: צֹאנָם וְאֶת בְּקָרָם
  choice: leur petit et leur gros bétail
  rationale: צֹאן désigne collectivement les ovins et caprins, et בָּקָר les bovins. L’expression française distingue précisément les deux catégories tout en restant concise.
- source_word: בְּנֵיהֶם וְאֶת בְּנוֹתֵיהֶם
  choice: leurs fils et leurs filles
  rationale: La traduction conserve les deux termes sexués et le parallélisme explicite de l’hébreu.
theological_decisions:
- issue: Emploi possible de « la Honte » comme métonymie de Baal ou de l’idolâtrie
  choice: Conserver « la Honte » dans le texte principal
  alternative: « la chose honteuse », « Baal » ou « l’idolâtrie »
  rationale: L’hébreu permet d’entendre soit une honte personnifiée, soit une désignation méprisante de Baal ou de l’idolâtrie. Le texte principal préserve cette tension sans imposer un référent, tandis que la note indique l’autre compréhension.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure garde l’image de la dévoration et la structure d’énumération du texte hébreu. La note est placée à la fin du verset, avec son marqueur correspondant dans le texte principal.
