  text: הֲ/ל֣וֹא מֵ/עַ֔תָּה קראתי לִ֖/י אָבִ֑/י אַלּ֥וּף נְעֻרַ֖/י אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/004.yaml
  text: Have you not just now called to me[a], ‘My Father[b], you are the friend of my youth’?”
translation:
  language: fr
  text: 'Ne viens-tu pas tout juste[a] de m’appeler : « Mon Père, tu es l’ami[b] de ma jeunesse » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « désormais ». L’expression hébraïque peut désigner soit un appel récent, soit une orientation à partir de maintenant.
    reason: lexical_alternative
  - marker: b
    text: Ou « le compagnon » ou « le guide ». L’hébreu אַלּוּף peut désigner un proche associé, un intime ou un guide, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Ne… pas
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative; cette tournure est naturelle en français.
- source_word: מֵעַתָּה
  choice: viens-tu… de
  rationale: Dans ce contexte, l’expression évoque un appel tout récent. La construction « venir de » rend naturellement cette valeur temporelle, tout en signalant en note l’autre lecture possible.
- source_word: קראתי לִי
  choice: m’appeler
  rationale: Le parfait qal à la deuxième personne féminine singulière s’adresse à Juda personnifiée; לִי désigne celui auquel elle s’adresse.
- source_word: אָבִי
  choice: Mon Père
  rationale: Forme d’adresse directe à Dieu; la majuscule relève de la convention typographique française.
- source_word: אַלּוּף נְעֻרַי
  choice: le compagnon de ma jeunesse
  rationale: אַלּוּף peut désigner un proche compagnon ou un guide. « Compagnon » conserve ici le sens relationnel sans imposer la nuance d’autorité.
- source_word: אָתָּה
  choice: toi, le compagnon
  rationale: Le pronom indépendant est rendu par une dislocation emphatique naturelle en français; la copule, absente en hébreu, n’a pas besoin d’être explicitée.
theological_decisions:
- issue: Identité de l’interlocutrice et portée de son appel
  choice: La question s’adresse à Juda/Israël personnifiée comme une femme et cite les paroles qu’elle adresse récemment au Seigneur.
  alternative: On peut entendre cette citation comme l’exposition ironique d’un retour superficiel plutôt que comme une prière sincère.
  rationale: La forme verbale féminine singulière et le contexte de Jérémie 3 établissent l’interlocutrice. La traduction cite son appel sans trancher sa sincérité.
translation_notes:
  register: Français moderne, digne et oralement fluide. La question rhétorique et l’adresse affective sont conservées; l’ambiguïté de אַלּוּף et de מֵעַתָּה est indiquée en note.
