source:
  edition: WLC
  text: אָכֵ֛ן בָּגְדָ֥ה אִשָּׁ֖ה מֵ/רֵעָ֑/הּ כֵּ֣ן בְּגַדְתֶּ֥ם בִּ֛/י בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/020.yaml
  text: Surely[a], as a woman betrays her companion, so you have betrayed me, O house of Israel, declares Yahweh.
translation:
  language: fr
  text: Certes, de même qu’une femme trahit son compagnon[a], de même vous m’avez trahi, ô maison d’Israël, déclaration de l’Éternel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme une épouse trahit son mari ». L’hébreu dit littéralement « une femme » et « son compagnon », mais le contexte plus large présente l’infidélité d’Israël au moyen de l’image du mariage.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֵן
  choice: Oui
  rationale: Introduit ici une affirmation forte en réponse au contexte précédent; « Oui » garde cette force tout en restant naturel en français moderne.
- source_word: בָּגְדָה / בְּגַדְתֶּם
  choice: trahit / avez trahi
  rationale: Le verbe exprime la déloyauté et la perfidie dans une relation. « Trahir » restitue clairement la rupture relationnelle; le présent donne à la comparaison une portée générale, tandis que le passé composé présente la trahison d’Israël comme accomplie et toujours pertinente.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Le nom peut désigner une femme ou une épouse. Le choix plus large évite de préciser davantage que le texte hébreu, tout en laissant le contexte conjugal éclairer l’image.
- source_word: מֵרֵעָהּ
  choice: son compagnon
  rationale: רֵעַ désigne largement un compagnon, un proche ou un ami. « Son compagnon » conserve cette amplitude lexicale sans imposer « mari » dans le texte principal.
- source_word: כֵּן
  choice: ainsi
  rationale: Marque explicitement le parallèle entre la comparaison et la conduite d’Israël, dans un registre digne et naturel.
- source_word: בִּי
  choice: m’avez trahi
  rationale: Avec בגד, la préposition désigne la personne envers laquelle la trahison est commise. La construction directe est idiomatique en français.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: Conserve la désignation collective et liée à l’alliance, plutôt que de la réduire à « Israël ».
- source_word: נְאֻם יְהוָה
  choice: déclaration de l’Éternel
  rationale: Rend la formule prophétique solennelle נְאֻם. « L’Éternel » est une manière française traditionnelle et intelligible de représenter le nom divin יהוה.
theological_decisions:
- issue: Nature de la relation évoquée dans la comparaison
  choice: Une femme trahit son compagnon
  alternative: Une épouse trahit son mari
  rationale: Le contexte de Jérémie 3 développe l’image du mariage pour parler de l’infidélité d’Israël. Cependant, le verset emploie littéralement « femme » et « compagnon », non un terme explicite pour « mari ». Le texte principal maintient donc l’ambiguïté lexicale, et la note signale l’interprétation conjugale possible.
translation_notes:
  register: Français international moderne, clair et digne. La comparaison conserve un léger caractère formel avec « ainsi » et « maison d’Israël ». « Déclaration de l’Éternel » maintient la solennité de la formule prophétique.
