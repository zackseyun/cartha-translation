  text: כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עָלֶ֖י/ךָ בָּרֽוּךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel, concerning you, Baruch:'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh, le Dieu d’Israël, à ton sujet[a], Baruch :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à propos de toi » ; moins probablement, « contre toi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette tournure française naturelle et digne rend la formule prophétique d’introduction sans donner au parfait hébreu une valeur simplement passée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la chaîne construite et conserve le titre d’alliance sous sa forme habituelle en français.
- source_word: עָלֶיךָ
  choice: à ton sujet
  rationale: Rend la relation exprimée par עַל sans imposer le sens hostile possible de « contre toi » ; le tutoiement correspond au singulier masculin hébreu.
- source_word: בָּרוּךְ
  choice: Baruch
  rationale: Translittération française usuelle du nom propre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre au lieu de lui substituer un titre.
- issue: Portée de עָלֶיךָ
  choice: à ton sujet
  alternative: contre toi
  rationale: Le contexte introduit une parole qui concerne Baruch. La valeur hostile reste lexicalement possible, mais elle est moins probable et est donc signalée en note plutôt qu’intégrée au texte.
translation_notes:
  register: Français international moderne, clair et digne. « Voici ce que dit » restitue naturellement la formule prophétique ; la ponctuation finale introduit l’oracle qui suit.
