  text: הַ/דָּבָ֗ר אֲשֶׁ֤ר דִּבֶּר֙ יִרְמְיָ֣הוּ הַ/נָּבִ֔יא אֶל בָּר֖וּךְ בֶּֽן נֵֽרִיָּ֑ה בְּ/כָתְב/וֹ֩ אֶת הַ/דְּבָרִ֨ים הָ/אֵ֤לֶּה עַל סֵ֨פֶר֙ מִ/פִּ֣י יִרְמְיָ֔הוּ בַּ/שָּׁנָה֙ הָֽ/רְבִעִ֔ית לִ/יהוֹיָקִ֧ים בֶּן יֹאשִׁיָּ֛הוּ מֶ֥לֶךְ יְהוּדָ֖ה לֵ/אמֹֽר־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/001.yaml
  text: 'The word that Jeremiah the prophet spoke to Baruch son of Neriah when he wrote these words in a scroll at the mouth of Jeremiah[a], in the fourth year of Jehoiakim son of Josiah, king of Judah, saying:'
translation:
  language: fr
  text: 'La parole que Jérémie, le prophète, adressa à Baruch, fils de Nérija, lorsque celui-ci écrivit ces paroles sur un rouleau sous la dictée de Jérémie[a], la quatrième année du règne de Joïakim, fils de Josias et roi de Juda, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la bouche de Jérémie ».'
    reason: L’expression hébraïque imagée désigne ici une dictée orale ; la note en préserve la formulation littérale.
lexical_decisions:
- source_word: הַדָּבָר
  choice: La parole
  rationale: דָּבָר peut désigner une parole, un message ou une affaire. « La parole » conserve ici le registre formel d’une introduction prophétique.
- source_word: דִּבֶּר ... אֶל
  choice: adressa à
  rationale: Le verbe דבר signifie « parler »; avec אֶל et un contenu prophétique, « adressa à » est naturel en français et indique clairement le destinataire.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Traduction directe du titre qui désigne la fonction de Jérémie.
- source_word: בְּכָתְבוֹ
  choice: lorsque celui-ci écrivit
  rationale: La préposition ב avec l’infinitif construit a ici une valeur temporelle. « Celui-ci » explicite sans ambiguïté que le sujet est Baruch, conformément au contexte.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: Dans ce contexte de dictée et de mise par écrit, « paroles » rend mieux le sens textuel que « choses » ou « affaires ».
- source_word: עַל סֵפֶר
  choice: sur un rouleau
  rationale: סֵפֶר désigne ici un document écrit, vraisemblablement un rouleau. « Sur un rouleau » est idiomatique en français et évite l’anachronisme possible de « livre ».
- source_word: מִפִּי יִרְמְיָהוּ
  choice: sous la dictée de Jérémie
  rationale: L’expression signifie littéralement « de la bouche de Jérémie » et décrit une dictée orale. La traduction principale en donne clairement le sens, tandis que la note conserve l’image hébraïque.
- source_word: בַּשָּׁנָה הָרְבִעִית לִיהוֹיָקִים
  choice: la quatrième année du règne de Joïakim
  rationale: Il s’agit d’une formule de datation royale. L’ajout de « du règne » exprime naturellement en français la fonction du ל préfixé au nom du roi.
- source_word: לֵאמֹר
  choice: 'Jérémie dit :'
  rationale: La formule introduit les paroles qui suivent. La reprise explicite de « Jérémie » produit une phrase française naturelle et identifie clairement le locuteur attendu au verset suivant.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, digne et accessible. Les noms propres suivent les formes françaises bibliques courantes : Jérémie, Baruch, Nérija, Joïakim, Josias et Juda. La longue construction hébraïque est légèrement réorganisée et conclue par « Jérémie dit : » pour assurer la clarté sans modifier le rapport entre la dictée, la rédaction et la parole qui suit.'
