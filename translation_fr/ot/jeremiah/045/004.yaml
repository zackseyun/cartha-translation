  text: כֹּ֣ה תֹּאמַ֣ר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֤ה אֲשֶׁר בָּנִ֨יתִי֙ אֲנִ֣י הֹרֵ֔ס וְ/אֵ֥ת אֲשֶׁר נָטַ֖עְתִּי אֲנִ֣י נֹתֵ֑שׁ וְ/אֶת כָּל הָ/אָ֖רֶץ הִֽיא׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/004.yaml
  text: 'This is what you shall say to him: ‘This is what Yahweh says: Behold[a], what I have built I am tearing down, and what I have planted I am uprooting, that is, the whole land.’'
translation:
  language: fr
  text: 'Voici ce que tu lui diras : « Voici ce que dit Yahweh : Voici, ce que j’ai bâti, je le démolis, et ce que j’ai planté, je l’arrache — et cela à tout le pays[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à toute la terre ». Le mot hébreu peut désigner soit un pays, soit la terre ; dans le contexte immédiat, « pays » est préféré.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹּאמַר אֵלָיו
  choice: Voici ce que tu lui diras
  rationale: כֹּה introduit les paroles à transmettre. Le futur français exprime naturellement ici l’instruction prophétique portée par l’inaccompli תֹּאמַר.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Cette formulation française naturelle conserve la formule du messager prophétique et rend le nom divin יְהוָה par « Yahweh ».
- source_word: הִנֵּה
  choice: Regarde
  rationale: L’impératif attire l’attention sur l’annonce solennelle. « Regarde » est actuel et intelligible sans affaiblir la force discursive de הִנֵּה.
- source_word: אֲשֶׁר בָּנִיתִי אֲנִי הֹרֵס
  choice: ce que j’ai bâti, je le démolis
  rationale: Le passé composé rend l’action antérieure de bâtir, tandis que le présent traduit le participe הֹרֵס et son action en cours ou imminente. « Démolir » maintient précisément l’image de la construction.
- source_word: וְאֵת אֲשֶׁר נָטַעְתִּי אֲנִי נֹתֵשׁ
  choice: et ce que j’ai planté, je l’arrache
  rationale: « Planter » et « arracher » conservent l’image agricole ainsi que le motif récurrent de Jérémie opposant bâtir et planter à démolir et arracher.
- source_word: וְאֶת כָּל הָאָרֶץ הִיא
  choice: — et cela dans tout le pays
  rationale: La proposition hébraïque est elliptique. Cette formulation conserve son caractère récapitulatif tout en produisant un français intelligible. Dans le contexte, הָאָרֶץ désigne vraisemblablement le pays soumis au jugement, sans exclure lexicalement le sens de « terre ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. Sa translittération préserve ce nom au lieu de lui substituer un titre.
- issue: Portée de הָאָרֶץ
  choice: tout le pays
  alternative: toute la terre
  rationale: Le contexte immédiat du jugement annoncé par Jérémie favorise le pays, vraisemblablement Juda. Une note conserve l’autre sens lexical possible sans imposer une portée universelle.
- issue: Fonction de la proposition finale elliptique
  choice: et cela dans tout le pays
  alternative: c’est-à-dire tout le pays
  rationale: Le pronom הִיא et l’accusatif initial permettent une lecture récapitulative ou emphatique dont la syntaxe exacte reste condensée. « Et cela dans tout le pays » évite de présenter comme certaine une stricte équivalence appositionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse individuelle à Baruch. Le parallélisme et les métaphores de construction et de plantation sont conservés; le tiret signale la reprise elliptique finale.
