  text: וְ/אַתָּ֛ה תְּבַקֶּשׁ לְ/ךָ֥ גְדֹל֖וֹת אַל תְּבַקֵּ֑שׁ כִּ֡י הִנְ/נִי֩ מֵבִ֨יא רָעָ֤ה עַל כָּל בָּשָׂר֙ נְאֻם יְהוָ֔ה וְ/נָתַתִּ֨י לְ/ךָ֤ אֶֽת נַפְשְׁ/ךָ֙ לְ/שָׁלָ֔ל עַ֥ל כָּל הַ/מְּקֹמ֖וֹת אֲשֶׁ֥ר תֵּֽלֶךְ שָֽׁם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/005.yaml
  text: And you—are you seeking great things for yourself? Do not seek them, for behold, I am bringing disaster on all flesh, declares the LORD. But I will give you your life as plunder in every place where you go.
translation:
  language: fr
  text: Et toi, tu cherches de grandes choses pour toi-même ? Ne les cherche pas. Car voici que je fais venir le malheur sur toute chair — déclaration du SEIGNEUR. Mais, partout où tu iras, je te donnerai ta vie comme butin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְדֹלוֹת
  choice: de grandes choses
  rationale: Conserve l’expression large et volontairement indéterminée de l’hébreu, sans préciser s’il s’agit d’honneur, de réussite ou de sécurité.
- source_word: רָעָה
  choice: le malheur
  rationale: Dans ce contexte de jugement, le terme désigne une calamité infligée plutôt qu’un mal moral.
- source_word: כָּל־בָּשָׂר
  choice: tout être humain
  rationale: Rend idiomatiquement l’expression hébraïque visant ici l’ensemble des humains, sans le calque moins naturel « toute chair ».
- source_word: נְאֻם יְהוָה
  choice: déclaration du SEIGNEUR
  rationale: Reproduit la formule prophétique solennelle et représente le tétragramme selon la convention française en petites capitales.
- source_word: וְנָתַתִּי לְךָ אֶת־נַפְשְׁךָ לְשָׁלָל
  choice: je te donnerai ta vie comme butin
  rationale: Préserve l’image frappante du survivant qui n’emporte que sa propre vie comme prise de guerre.
- source_word: עַל כָּל־הַמְּקֹמוֹת אֲשֶׁר תֵּלֶךְ־שָׁם
  choice: partout où tu iras
  rationale: Expression française naturelle qui conserve la portée distributive de l’hébreu.
theological_decisions:
- issue: Portée de « tout être humain »
  choice: Maintenir la formulation universelle du texte
  alternative: Restreindre explicitement le référent aux habitants de Juda ou aux peuples alors jugés
  rationale: Le verset emploie l’expression générale כָּל־בָּשָׂר ; le contexte peut en préciser l’application, mais la traduction ne doit pas introduire une limitation absente de la proposition.
- issue: Sens de la promesse faite à Baruch
  choice: Conserver la métaphore « ta vie comme butin »
  alternative: Paraphraser par « je te laisserai la vie sauve »
  rationale: La paraphrase transmettrait l’effet pratique, mais effacerait l’image théologique et littéraire de la survie comme unique gain au milieu du jugement.
translation_notes:
  register: Français international moderne, sobre et prophétique. Le tutoiement est requis par l’adresse singulière. La reprise « Et toi, tu… » marque l’emphase de וְאַתָּה ; la question puis l’impératif bref gardent la force de l’admonestation. Aucun marqueur de note n’est nécessaire.
