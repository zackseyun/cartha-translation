review_pass:
  verdict: revise
  source_fidelity: La structure emphatique (« Et toi »), la question, l’interdiction, l’annonce divine et la promesse de survie sont fidèlement rendues. Toutefois, « tout être humain » explicite et restreint légèrement כָּל־בָּשָׂר (« toute chair »), expression volontairement plus large et imagée que le français peut conserver ici.
  naturalness: Le français proposé est globalement moderne et fluide. « Chercher de grandes choses » est plus idiomatique dans cette exhortation que « rechercher de grandes choses ». « Toute chair » demeure une expression biblique française claire dans ce registre prophétique.
  terminology: « Le malheur », « déclaration du SEIGNEUR » et « ta vie comme butin » rendent adéquatement les termes et la formule du texte. Le maintien de « toute chair » préserve l’imagerie et l’ouverture référentielle de l’hébreu sans imposer une interprétation.
  issues:
  - severity: medium
    issue: « tout être humain » pour כָּל־בָּשָׂר
    rationale: Cette formulation interprète « chair » comme exclusivement humaine. Bien que ce soit vraisemblablement le référent principal dans le contexte, l’hébreu emploie l’expression plus large « toute chair »; il convient d’en conserver l’ambiguïté et l’image.
  - severity: low
    issue: « recherches » / « recherche »
    rationale: Le verbe « chercher » est plus naturel et direct en français moderne pour l’idée de rechercher ou poursuivre de grandes choses dans une admonestation.
