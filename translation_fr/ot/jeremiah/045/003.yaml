  terminology: « Yahweh » suit la décision terminologique fournie pour le tétragramme. Le couple « chagrin » / « douleur » préserve utilement la distinction sémantique entre le deuil ou la peine affective (יָגוֹן) et la souffrance (מַכְאוֹב). « Repos » rend adéquatement מְנוּחָה.
