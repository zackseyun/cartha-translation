  source_fidelity: 'Le texte rend fidèlement la plainte rapportée : אָמַרְתָּ est correctement introduit par « Tu as dit », l’exclamation אָמַרְתָּ אֽוֹי נָא לִי conserve son caractère de lamentation personnelle et intensifiée, et כִּי garde sa valeur explicative avec « Car ». « Yahweh a ajouté le chagrin à ma douleur » respecte la relation d’addition de יָסַף עַל et distingue convenablement יָגוֹן de מַכְאוֹב. « Je suis épuisé à force de gémir » exprime de façon recevable l’état résultant du parfait יָגַעְתִּי et la circonstance/cause indiquée par בְּאַנְחָתִי. La dernière proposition conserve exactement l’idée de ne pas trouver de repos.'
