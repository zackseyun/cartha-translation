  text: אָמַ֨רְתָּ֙ אֽוֹי נָ֣א לִ֔/י כִּֽי יָסַ֧ף יְהוָ֛ה יָג֖וֹן עַל מַכְאֹבִ֑/י יָגַ֨עְתִּי֙ בְּ/אַנְחָתִ֔/י וּ/מְנוּחָ֖ה לֹ֥א מָצָֽאתִי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/003.yaml
  text: You said[a], ‘Woe is me now, for Yahweh has added sorrow to my pain. I am weary with my groaning, and I have found no rest.’
translation:
  language: fr
  text: 'Tu as dit : « Ah, malheur à moi ![a] Car Yahweh a ajouté le chagrin à ma douleur. Je suis épuisé à force de gémir, et je n’ai trouvé aucun repos. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Hélas pour moi ! » L’expression hébraïque est un cri de lamentation et de détresse.'
    reason: Alternative lexicale pour אֽוֹי נָא לִי et explicitation de sa force affective.
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: Tu as dit
  rationale: Le qal accompli à la 2e personne du masculin singulier introduit la plainte de Baruch. Le passé composé convient naturellement au contexte narratif français.
- source_word: אֽוֹי נָא לִי
  choice: Ah, malheur à moi !
  rationale: אוי exprime une lamentation douloureuse, tandis que נָא renforce ici le cri plutôt qu’il ne formule une demande polie. « Ah » restitue cette force affective dans un français actuel.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison de la lamentation et maintient explicitement le lien explicatif.
- source_word: יָסַף
  choice: a ajouté
  rationale: Le verbe יסף signifie ici « ajouter » ou « accroître » ; cette formulation conserve l’image d’un chagrin venant s’ajouter à une douleur déjà présente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme un nom propre, sans lui substituer un titre.
- source_word: יָגוֹן
  choice: le chagrin
  rationale: Le terme désigne la peine ou le chagrin et garde ici sa dimension affective, distincte de מַכְאוֹב, « douleur ».
- source_word: עַל מַכְאֹבִי
  choice: à ma douleur
  rationale: Après יסף, עַל indique ce à quoi quelque chose vient s’ajouter. « À ma douleur » est direct et idiomatique.
- source_word: יָגַעְתִּי בְּאַנְחָתִי
  choice: Je suis épuisé à force de gémir
  rationale: יגע exprime l’épuisement, et ב peut indiquer ici la cause ou le moyen. « À force de gémir » rend naturellement l’usure produite par des plaintes répétées.
- source_word: וּמְנוּחָה לֹא מָצָאתִי
  choice: et je n’ai trouvé aucun repos
  rationale: La formulation conserve le verbe « trouver » et rend מְנוּחָה par « repos », sans réduire le sens au seul soulagement physique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: L’hébreu emploie directement le tétragramme comme nom propre. « Yahweh » préserve cette fonction et évite de remplacer le nom par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. La plainte conserve son intensité sans archaïsme marqué ; les deux termes יָגוֹן et מַכְאוֹב restent distingués par « chagrin » et « douleur ».
