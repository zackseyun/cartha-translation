id: JER.8.20
reference: Jeremiah 8:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עָבַ֥ר קָצִ֖יר כָּ֣לָה קָ֑יִץ וַ/אֲנַ֖חְנוּ ל֥וֹא נוֹשָֽׁעְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/020.yaml
  text: The harvest has passed[a], the summer has ended, and we have not been saved.
translation:
  language: fr
  text: La moisson est passée, l’été est terminé, et nous n’avons pas été sauvés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « délivrés » : le verbe hébreu peut désigner le fait d’être arraché à un danger ou à un malheur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבַר
  choice: est passée
  rationale: Le qal accompli indique que la moisson appartient désormais au passé. « Est passée » est naturel en français et garde l’idée d’une occasion désormais révolue.
- source_word: קָצִיר
  choice: la moisson
  rationale: Le nom désigne la moisson ou le temps de la récolte. « La moisson » convient au parallélisme saisonnier et reste concis.
- source_word: כָּלָה
  choice: est fini
  rationale: Le qal accompli exprime l’achèvement. « Est fini » forme un parallèle clair et naturel avec « est passée ».
- source_word: קַיִץ
  choice: l’été
  rationale: Dans le parallélisme avec la moisson, le sens saisonnier ordinaire est le plus probable, sans qu’il soit nécessaire d’expliciter l’association possible avec les fruits d’été.
- source_word: וַאֲנַחְנוּ
  choice: et nous
  rationale: La conjonction coordonne directement les propositions. Le contraste ressort suffisamment du contexte sans transformer explicitement « et » en « mais ».
- source_word: לֹא
  choice: ne… pas
  rationale: Négation française directe du verbe.
- source_word: נוֹשָׁעְנוּ
  choice: ne sommes pas sauvés
  rationale: Le niphal accompli à la première personne du pluriel exprime le fait de ne pas avoir reçu le salut ou la délivrance attendue. Cette formulation conserve la voix passive et la portée large du verbe.
theological_decisions:
- issue: Sens de ישׁע dans une lamentation nationale
  choice: sauvés
  alternative: délivrés
  rationale: « Sauvés » rend directement le verbe hébreu et conserve sa résonance théologique générale, tandis que le contexte l’oriente vers le secours face au malheur sans le limiter à une notion doctrinale ultérieure. « Délivrés » reste une possibilité lexicale valable.
translation_notes:
  register: Français international moderne, simple et digne. Le rythme ternaire de la lamentation et le parallélisme des deux saisons sont conservés.
