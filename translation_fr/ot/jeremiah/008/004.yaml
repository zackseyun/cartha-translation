source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/יִפְּל֖וּ וְ/לֹ֣א יָק֑וּמוּ אִם יָשׁ֖וּב וְ/לֹ֥א יָשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/004.yaml
  text: 'You shall say to them[a], ‘Thus says Yahweh: Do people fall and not rise again? Does one turn away and not return?’'
translation:
  language: fr
  text: 'Tu leur diras : « Ainsi parle Yahweh : Tombe-t-on sans se relever ? S’écarte-t-on sans revenir[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie deux fois le même verbe, rendu ici par « s’écarter » puis « revenir ».
    reason: Préserver et expliquer la répétition lexicale de שוב sans proposer une alternative française ambiguë.
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Tu leur diras
  rationale: Le futur français exprime naturellement l’ordre prophétique adressé à Jérémie; la conjonction initiale n’est pas nécessaire dans ce verset isolé.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique consacrée, rendue au présent en français; le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: הֲיִפְּלוּ וְלֹא יָקוּמוּ
  choice: Tombe-t-on sans se relever ?
  rationale: La tournure impersonnelle française exprime avec naturel la vérité générale formulée au pluriel en hébreu et conserve la force de la question rhétorique.
- source_word: אִם יָשׁוּב וְלֹא יָשׁוּב
  choice: S’écarte-t-on sans revenir ?
  rationale: La seconde proposition est comprise comme une question rhétorique parallèle. « S’écarter » puis « revenir » communique le mouvement d’éloignement et de retour, tandis qu’une note signale la répétition du même verbe hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Sens du double emploi de שׁוב
  choice: s’écarter… revenir
  alternative: faire demi-tour… revenir
  rationale: Le contexte oppose vraisemblablement l’éloignement au retour, mais la répétition hébraïque autorise aussi l’idée de faire demi-tour; la note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. Les questions impersonnelles en « on » rendent naturellement la portée proverbiale du texte. La ponctuation distingue clairement la commission prophétique de la parole citée.
