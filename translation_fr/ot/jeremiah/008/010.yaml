id: JER.8.10
reference: Jeremiah 8:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵן֩ אֶתֵּ֨ן אֶת נְשֵׁי/הֶ֜ם לַ/אֲחֵרִ֗ים שְׂדֽוֹתֵי/הֶם֙ לְ/י֣וֹרְשִׁ֔ים כִּ֤י מִ/קָּטֹן֙ וְ/עַד גָּד֔וֹל כֻּלֹּ֖/ה בֹּצֵ֣עַ בָּ֑צַע מִ/נָּבִיא֙ וְ/עַד כֹּהֵ֔ן כֻּלֹּ֖/ה עֹ֥שֶׂה שָּֽׁקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/010.yaml
  text: Therefore I will give their wives to others[a], their fields to those who will possess them; for from the least even to the greatest, every one of them is greedy for unjust gain; from prophet even to priest[c][b], every one of them practices falsehood.
translation:
  language: fr
  text: C’est pourquoi je donnerai leurs femmes à d’autres, et leurs champs à ceux qui en prendront possession[a]. Car, du plus petit au plus grand, tous sont avides de profits malhonnêtes[b] ; du prophète au prêtre, tous pratiquent la tromperie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ceux qui en hériteront ». Le verbe hébreu peut signifier « hériter » ou « prendre possession » ; ici, le contexte évoque probablement une prise de possession par de nouveaux occupants.
    reason: lexical_alternative
  - marker: b
    text: Ou « avides de gain ». L’expression hébraïque peut désigner l’appât du gain en général, mais elle implique souvent un profit malhonnête ou injuste dans les textes prophétiques.
    reason: lexical_alternative
  - marker: c
    text: Ou « agissent avec fausseté » ou « se conduisent de manière trompeuse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque clairement la conséquence judiciaire découlant de l’accusation précédente.
- source_word: אֶתֵּן
  choice: je donnerai
  rationale: L’imparfait hébreu, dans cet oracle de jugement, exprime naturellement une action future annoncée par Dieu.
- source_word: נְשֵׁיהֶם
  choice: leurs femmes
  rationale: Dans ce contexte familial et social, le terme désigne les épouses ; « leurs femmes » est une formulation française courante et digne.
- source_word: לַאֲחֵרִים
  choice: à d’autres
  rationale: Rend sans surinterprétation le substantif hébreu désignant d’autres personnes.
- source_word: שְׂדוֹתֵיהֶם
  choice: leurs champs
  rationale: Conserve l’image concrète des propriétés agricoles.
- source_word: לְיוֹרְשִׁים
  choice: à ceux qui en prendront possession
  rationale: Le verbe ירשׁ peut signifier hériter ou prendre possession ; ici, le contexte de dépossession favorise cette dernière nuance sans effacer l’ambiguïté, signalée en note.
- source_word: כִּי מִקָּטֹן וְעַד גָּדוֹל
  choice: En effet, du plus petit au plus grand
  rationale: Rend le mérisme qui englobe toutes les catégories sociales et relie l’annonce du jugement à sa cause.
- source_word: כֻּלֹּה
  choice: tous
  rationale: Exprime naturellement en français la portée distributive et exhaustive du singulier collectif hébreu.
- source_word: בֹּצֵעַ בָּצַע
  choice: sont avides de profits malhonnêtes
  rationale: La construction à racine répétée exprime une recherche avide du gain, souvent teintée d’injustice dans le contexte prophétique.
- source_word: מִנָּבִיא וְעַד כֹּהֵן
  choice: du prophète au prêtre
  rationale: Préserve le second mérisme, qui vise l’ensemble des responsables religieux.
- source_word: עֹשֶׂה שָּׁקֶר
  choice: pratiquent la tromperie
  rationale: Exprime une conduite habituelle de fausseté ou de fraude, et non une parole mensongère isolée.
theological_decisions:
- issue: Nature du jugement annoncé contre les familles et les biens
  choice: Présenter Dieu comme celui qui livre les épouses et les champs à d’autres en jugement.
  alternative: Décrire uniquement les pertes ordinaires causées par la guerre, sans dimension judiciaire explicite.
  rationale: La première personne « je donnerai » attribue directement cette dépossession à l’action judiciaire de Dieu, sans qu’il soit nécessaire d’ajouter des précisions absentes du verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme du verset et ses deux mérismes sont conservés. Les répétitions de « tous » rendent la portée exhaustive de l’hébreu, tandis que les notes préservent les principales ambiguïtés lexicales.
