  text: מַדּ֨וּעַ שׁוֹבְבָ֜ה הָ/עָ֥ם הַ/זֶּ֛ה יְרוּשָׁלִַ֖ם מְשֻׁבָ֣ה נִצַּ֑חַת הֶחֱזִ֨יקוּ֙ בַּ/תַּרְמִ֔ית מֵאֲנ֖וּ לָ/שֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/005.yaml
  text: Why has this people turned away—Jerusalem—with a perpetual turning away? They hold fast to deceit[c][b][a]; they refuse to return.
translation:
  language: fr
  text: Pourquoi ce peuple — Jérusalem — persiste-t-il à se détourner[a] ? Ils s’attachent à la tromperie ; ils refusent de revenir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « Pourquoi ce peuple — Jérusalem — s’est-il détourné dans un détournement perpétuel ? » ou « … dans une apostasie persistante ? »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu répète dans ce verset des mots apparentés au verbe « tourner, revenir » : le peuple se détourne, mais refuse de revenir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Introduit naturellement en français la question rhétorique du texte hébreu.
- source_word: שׁוֹבְבָה
  choice: se détourne-t-il
  rationale: Exprime l’éloignement coupable dans un français actuel et maintient le lien sémantique avec « revenir » à la fin du verset.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Reproduit directement la désignation prophétique sans lui donner le sens plus politique de « nation ».
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Le nom est pris comme une apposition qui identifie « ce peuple » ; les tirets rendent cette construction perceptible.
- source_word: מְשֻׁבָה נִצַּחַת
  choice: se détourne-t-il sans cesse
  rationale: Cette formulation naturelle transpose l’idée d’un détournement persistant. Elle évite les termes plus techniques « apostasie » et « rétrogradation », tout en conservant le mouvement exprimé par la racine שוב.
- source_word: הֶחֱזִיקוּ
  choice: Ils s’attachent
  rationale: Rend l’idée de saisir fermement et de persister délibérément dans une conduite.
- source_word: בַּתַּרְמִית
  choice: à la tromperie
  rationale: « Tromperie » exprime clairement la fausseté ou la fraude visée, sans imposer une nuance plus précise que le contexte.
- source_word: מֵאֲנוּ
  choice: ils refusent
  rationale: Traduit directement la résistance volontaire exprimée par le verbe hébreu.
- source_word: לָשׁוּב
  choice: de revenir
  rationale: Conserve le sens fondamental de שוב et le contraste verbal entre se détourner et revenir, sans expliciter par « se repentir » une implication laissée implicite.
theological_decisions:
- issue: Rendre la répétition de שוב et מְשׁוּבָה
  choice: Employer « se détourner » puis « revenir » et signaler le jeu lexical en note.
  alternative: Employer « apostasier » et « se repentir », ou une terminologie traditionnelle de rétrogradation.
  rationale: Le contraste du verset porte sur le mouvement d’éloignement et le refus du retour. La formulation choisie le garde accessible sans ajouter une terminologie confessionnelle ou technique.
- issue: Fonction syntaxique de « Jérusalem »
  choice: Comprendre « Jérusalem » comme une apposition à « ce peuple » et l’encadrer de tirets.
  alternative: 'Comprendre le nom comme un vocatif : « Pourquoi ce peuple se détourne-t-il, Jérusalem… ? »'
  rationale: L’apposition identifiant le peuple à Jérusalem paraît la lecture syntaxique la plus naturelle, mais le vocatif demeure possible et est conservé en note.
- issue: Portée de נִצַּחַת
  choice: « sans cesse »
  alternative: « pour toujours », « d’un détournement perpétuel » ou « dans une apostasie durable »
  rationale: « Sans cesse » rend ici la persistance continue de l’infidélité sans suggérer nécessairement qu’un retour futur serait métaphysiquement impossible.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation verbale « se détourne sans cesse » privilégie la clarté naturelle tout en préservant, avec « revenir », le contraste central de l’hébreu. Les tirets signalent l’apposition sans ajouter de contenu.
