- from: Ah ! si ma tête devenait de l’eau et mes yeux une source de larmes[a] ! Je pleurerais jour et nuit ceux de la fille de mon peuple qui ont été tués.
  to: Ah ! si ma tête était de l’eau et si mes yeux étaient une source de larmes[a], je pleurerais jour et nuit les victimes de la fille de mon peuple.
  rationale: La révision remplace l’idée ajoutée de changement (« devenait ») par l’état souhaité exprimé dans l’idiome hébreu. Elle reformule aussi le dernier groupe pour rendre plus directement et naturellement les personnes tuées, tout en préservant la personnification poétique « la fille de mon peuple » et l’ambiguïté quant au locuteur.
