source:
  edition: WLC
  text: מִֽי יִתֵּ֤ן רֹאשִׁ/י֙ מַ֔יִם וְ/עֵינִ֖/י מְק֣וֹר דִּמְעָ֑ה וְ/אֶבְכֶּה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֵ֖ת חַֽלְלֵ֥י בַת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/023.yaml
  text: Oh[a], that my head were water, and my eyes a fountain of tears, so that I might weep day and night for the slain of the daughter of my people.
translation:
  language: fr
  text: Ah ! si ma tête était de l’eau et si mes yeux étaient une source de larmes[a], je pleurerais jour et nuit les victimes de la fille de mon peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et mon œil une source de larmes ». L’hébreu emploie le singulier, là où le français dit naturellement « mes yeux ».'
    reason: Précision grammaticale et variante de traduction littérale.
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ah ! si…
  rationale: Cette tournure hébraïque exprime ici un souhait intense et douloureux, non une question littérale. « Ah ! si… » en restitue naturellement la force dans un registre poétique.
- source_word: רֹאשִׁי מַיִם
  choice: ma tête devenait de l’eau
  rationale: La formulation conserve l’image corporelle saisissante du texte, sans la réduire à une simple abondance de larmes.
- source_word: וְעֵינִי מְקוֹר דִּמְעָה
  choice: et mes yeux une source de larmes
  rationale: « Source » rend naturellement מְקוֹר en français. Le pluriel « mes yeux » est idiomatique, tandis que le singulier morphologique de l’hébreu est signalé en note.
- source_word: וְאֶבְכֶּה
  choice: Je pleurerais
  rationale: Le conditionnel français exprime naturellement la conséquence souhaitée après « Ah ! si… ».
- source_word: יוֹמָם וָלַיְלָה
  choice: jour et nuit
  rationale: Cette expression française courante préserve l’idée d’une lamentation continuelle.
- source_word: חַלְלֵי
  choice: ceux… qui ont été tués
  rationale: Dans ce contexte, le terme désigne des personnes abattues ou tuées, probablement victimes de violences ou de guerre. Cette formulation est claire et plus précise que le simple mot « morts ».
- source_word: בַת עַמִּי
  choice: la fille de mon peuple
  rationale: La traduction conserve la personnification prophétique inhabituelle au lieu de la remplacer par le seul mot « peuple ».
theological_decisions:
- issue: Faut-il expliciter l’identité du locuteur de la lamentation ?
  choice: Ne pas l’expliciter
  alternative: Présenter explicitement les paroles comme celles de Jérémie ou de Dieu
  rationale: Le verset ne nomme pas son locuteur, et le contexte permet une tension interprétative. La traduction ne doit pas la résoudre artificiellement.
- issue: Faut-il aplanir la personnification בַת עַמִּי ?
  choice: Conserver « la fille de mon peuple »
  alternative: Traduire simplement « mon peuple » ou « mon peuple bien-aimé »
  rationale: L’image appartient à la poésie prophétique et contribue à la force affective de la lamentation ; elle ne doit pas être remplacée par une interprétation.
translation_notes:
  register: Français international moderne, poétique et digne. L’exclamation initiale rend le souhait douloureux ; les images concrètes de la tête changée en eau et de la source de larmes sont préservées. La syntaxe finale reste volontairement marquée afin de conserver la personnification « la fille de mon peuple ».
