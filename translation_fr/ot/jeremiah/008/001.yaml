source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֣יא נְאֻם יְהוָ֡ה ו/יציאו אֶת עַצְמ֣וֹת מַלְכֵֽי יְהוּדָ֣ה וְ/אֶת עַצְמוֹת שָׂרָי/ו֩ וְ/אֶת עַצְמ֨וֹת הַ/כֹּהֲנִ֜ים וְ/אֵ֣ת עַצְמ֣וֹת הַ/נְּבִיאִ֗ים וְ/אֵ֛ת עַצְמ֥וֹת יוֹשְׁבֵֽי יְרוּשָׁלִָ֖ם מִ/קִּבְרֵי/הֶֽם־־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/001.yaml
  text: At that time, declares Yahweh, they will bring out the bones of the kings of Judah, the bones of its officials, the bones of the priests, the bones of the prophets, and the bones of the inhabitants of Jerusalem from their graves.
translation:
  language: fr
  text: En ce temps-là, déclare Yahweh, on retirera de leurs tombes les os des rois de Juda, les os de ses dignitaires, les os des prêtres, les os des prophètes et les os des habitants de Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: En ce temps-là
  rationale: Expression temporelle française naturelle qui conserve la valeur déictique de l’hébreu.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule prophétique nominale de façon digne et reconnaissable, sans la réduire à un simple « dit Yahweh ».
- source_word: וְיֹצִיאוּ
  choice: on sortira
  rationale: Le hiphil exprime le fait de faire sortir les os. Le sujet pluriel n’étant pas précisé, le pronom indéfini « on » est plus naturel en français qu’un « ils » sans antécédent.
- source_word: עַצְמוֹת
  choice: les os
  rationale: Conserve le terme concret ainsi que sa répétition rhétorique devant chaque groupe.
- source_word: מַלְכֵי יְהוּדָה
  choice: les rois de Juda
  rationale: Rendu direct de la chaîne construite.
- source_word: שָׂרָיו
  choice: ses hauts fonctionnaires
  rationale: שׂרים désigne ici les dignitaires ou responsables politiques de Juda. « Hauts fonctionnaires » est moderne et distingue clairement ce groupe des rois.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent courant de l’office cultuel.
- source_word: הַנְּבִיאִים
  choice: les prophètes
  rationale: Équivalent français courant et précis.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִָם
  choice: les habitants de Jérusalem
  rationale: Rend naturellement le participe substantivé collectif.
- source_word: מִקִּבְרֵיהֶם
  choice: de leurs tombes
  rationale: « Tombes » est un équivalent clair et général de קברים; le possessif pluriel reprend l’ensemble des défunts énumérés.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin; sa translittération le distingue d’un titre et suit la convention du projet.
- issue: Répétition rhétorique de עַצְמוֹת
  choice: Répéter « les os » devant chaque catégorie
  alternative: Employer « les os » une seule fois avant toute la liste
  rationale: La répétition hébraïque souligne l’ampleur et l’horreur de la profanation; elle demeure naturelle en français.
- issue: Sujet non exprimé de וְיֹצִיאוּ
  choice: on sortira
  alternative: ils sortiront
  rationale: L’hébreu laisse les agents non identifiés. Le français « on » préserve cette indétermination sans créer un pronom personnel dépourvu d’antécédent.
translation_notes:
  register: Français international moderne, digne et accessible. Les tirets isolent la formule prophétique sans interrompre lourdement l’énumération. La répétition volontaire de « les os » reproduit l’insistance du texte source.
