id: JER.8.22
reference: Jeremiah 8:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/צֳרִי֙ אֵ֣ין בְּ/גִלְעָ֔ד אִם רֹפֵ֖א אֵ֣ין שָׁ֑ם כִּ֗י מַדּ֨וּעַ֙ לֹ֣א עָֽלְתָ֔ה אֲרֻכַ֖ת בַּת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/022.yaml
  text: Is there no balm in Gilead? Is there no physician there? Why then has the healing of the daughter of my people not come about?[a][b]
translation:
  language: fr
  text: N’y a-t-il pas de baume[a] en Galaad ? N’y a-t-il pas de médecin là ? Pourquoi donc la guérison[b] de la fille de mon peuple n’est-elle pas venue ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « résine médicinale » ou « baume résineux ». Le mot hébreu désigne une gomme ou résine médicinale associée à Galaad.
    reason: lexical_alternative
  - marker: b
    text: Ou « rétablissement » ou « restauration ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֳרִי
  choice: baume
  rationale: Le terme désigne une gomme ou résine médicinale associée à Galaad. « Baume » est naturel en français, maintient l’image médicale et convient au registre poétique.
- source_word: אֵין
  choice: n’y a-t-il pas
  rationale: La particule exprime l’absence ; la tournure interrogative française restitue ici la force rhétorique du texte.
- source_word: בְּגִלְעָד
  choice: en Galaad
  rationale: Traduction locative directe avec la forme française traditionnelle du nom géographique.
- source_word: אִם
  choice: n’y a-t-il pas (seconde question)
  rationale: Dans ce parallélisme, אִם introduit une seconde interrogation rhétorique plutôt qu’une condition.
- source_word: רֹפֵא
  choice: médecin
  rationale: Le participe désigne celui qui soigne. « Médecin » s’accorde avec l’image du baume et évite les connotations particulières que pourrait prendre « guérisseur ».
- source_word: שָׁם
  choice: là-bas
  rationale: L’adverbe renvoie à Galaad ; « là-bas » est idiomatique et distingue clairement ce lieu du point de vue du locuteur.
- source_word: כִּי מַדּוּעַ
  choice: pourquoi donc
  rationale: Cette formulation exprime naturellement en français l’inférence étonnée tirée des deux questions précédentes.
- source_word: לֹא עָלְתָה
  choice: n’est-elle pas venue
  rationale: Avec אֲרֻכָה, le verbe évoque l’apparition ou l’avènement de la guérison. « Venue » garde une part de l’image dynamique sans imposer le sens spatial littéral de « monter ».
- source_word: אֲרֻכַת
  choice: la guérison
  rationale: Le nom peut désigner la guérison, le rétablissement ou la restauration de la santé. « Guérison » prolonge clairement la métaphore médicale.
- source_word: בַּת עַמִּי
  choice: la fille de mon peuple
  rationale: La traduction conserve la personnification prophétique et sa charge affective au lieu de la réduire au simple référent « mon peuple ».
theological_decisions:
- issue: Faut-il expliciter ou aplanir l’expression prophétique « fille de mon peuple » ?
  choice: Conserver « la fille de mon peuple » dans le texte principal.
  alternative: « mon peuple » ou « mon peuple bien-aimé »
  rationale: L’expression personnifie collectivement le peuple et porte la tonalité de lamentation. La conserver respecte la tension littéraire et n’ajoute aucune identification doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions rhétoriques et la personnification poétique sont maintenues ; le vocabulaire médical unifie les trois propositions.
