source:
  edition: WLC
  text: וּ/שְׁטָחוּ/ם֩ לַ/שֶּׁ֨מֶשׁ וְ/לַ/יָּרֵ֜חַ וּ/לְ/כֹ֣ל צְבָ֣א הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר אֲהֵב֜וּ/ם וַ/אֲשֶׁ֤ר עֲבָדוּ/ם֙ וַֽ/אֲשֶׁר֙ הָלְכ֣וּ אַֽחֲרֵי/הֶ֔ם וַ/אֲשֶׁ֣ר דְּרָשׁ֔וּ/ם וַ/אֲשֶׁ֥ר הִֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם לֹ֤א יֵאָֽסְפוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְיֽוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/002.yaml
  text: And they will spread them out before the sun and the moon and all the host of the heavens[a], which they loved and which they served and after which they walked and which they sought and to which they bowed down. They will not be gathered, and they will not be buried[c][b]; they will become dung on the surface of the ground.
translation:
  language: fr
  text: On les étalera devant le soleil, la lune et toute l’armée des cieux[a], qu’ils ont aimés et servis, qu’ils ont suivis et recherchés[b], et devant lesquels ils se sont prosternés. Ils ne seront ni recueillis ni enterrés ; ils deviendront du fumier à la surface du sol[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute l’armée du ciel ».
    reason: Variante française possible pour l’expression hébraïque צְבָא הַשָּׁמַיִם.
  - marker: b
    text: Ou « consultés » ou « interrogés ». Le verbe hébreu peut désigner une recherche religieuse ou le fait de consulter pour obtenir une réponse.
    reason: Le verbe דרשׁ possède ici une gamme de sens que « recherchés » ne précise pas entièrement.
  - marker: c
    text: Littéralement « sur la face du sol ».
    reason: La note signale l’image concrète de l’expression hébraïque derrière la formulation idiomatique française.
lexical_decisions:
- source_word: וּשְׁטָחוּם
  choice: On les étalera
  rationale: Le verbe שׁטח décrit ici l’action d’étendre et d’exposer les restes mentionnés dans le contexte. Le pronom « les » conserve la référence hébraïque sans répéter explicitement « os », tandis que le « on » français rend naturellement le sujet indéfini du pluriel verbal.
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: devant le soleil, la lune
  rationale: Dans ce contexte d’exposition, la préposition ל est rendue naturellement par « devant ». La coordination française évite de répéter inutilement l’article et la préposition.
- source_word: וּלְכֹל צְבָא הַשָּׁמַיִם
  choice: et toute l’armée des cieux
  rationale: « Armée » préserve l’image collective de צבא, et « des cieux » reflète la forme hébraïque tout en gardant explicite le cadre du culte céleste.
- source_word: אֲשֶׁר אֲהֵבוּם וַאֲשֶׁר עֲבָדוּם
  choice: qu’ils ont aimés et servis
  rationale: « Servir » maintient le sens cultuel possible de עבד sans le confondre avec le geste distinct de prosternation exprimé plus loin.
- source_word: וַאֲשֶׁר הָלְכוּ אַחֲרֵיהֶם
  choice: qu’ils ont suivis
  rationale: L’expression hébraïque « marcher après » signifie ici suivre dans l’allégeance. « Suivre » est idiomatique en français moderne et conserve ce sens.
- source_word: וַאֲשֶׁר דְּרָשׁוּם
  choice: consultés
  rationale: Dans ce contexte religieux et astral, דרשׁ peut désigner le fait de consulter ou d’interroger. « Consultés » fait entendre cette démarche cultuelle sans exclure le sens plus large de « recherchés », signalé en note.
- source_word: וַאֲשֶׁר הִשְׁתַּחֲווּ לָהֶם
  choice: devant lesquels ils se sont prosternés
  rationale: « Se prosterner » conserve le geste concret de השתחוה et sa portée cultuelle, tout en le distinguant de « servir ».
- source_word: לֹא יֵאָסְפוּ וְלֹא יִקָּבֵרוּ
  choice: Ils ne seront ni recueillis ni enterrés
  rationale: « Recueillis » convient au rassemblement de restes en vue des rites funéraires ; la construction « ni… ni… » restitue clairement la double négation.
- source_word: לְדֹמֶן
  choice: du fumier
  rationale: דמן désigne du fumier ou des excréments. « Fumier » garde la brutalité de l’image prophétique et reste naturel en français.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: à la surface du sol
  rationale: Cette formulation française rend naturellement l’expression idiomatique « sur la face du sol » sans perdre l’idée d’une exposition visible et non enterrée.
theological_decisions:
- issue: Maintien de la série des actes de dévotion envers les réalités célestes
  choice: 'Conserver les cinq actes distincts : aimer, servir, suivre, consulter et se prosterner'
  alternative: Regrouper plusieurs verbes sous « adorer » ou « rendre un culte »
  rationale: L’accumulation hébraïque souligne l’étendue de l’attachement du peuple. Garder les verbes distincts préserve la force de l’accusation sans imposer une systématisation doctrinale.
- issue: Interprétation de צְבָא הַשָּׁמַיִם
  choice: toute l’armée des cieux
  alternative: tous les astres du ciel
  rationale: '« Armée des cieux » conserve la métaphore et l’ambiguïté référentielle du texte : l’expression peut englober les corps célestes sans être réduite d’emblée au seul terme « astres ».'
- issue: Valeur religieuse de דְּרָשׁוּם
  choice: consultés
  alternative: recherchés
  rationale: Le contexte du culte céleste favorise l’idée d’une consultation religieuse, possiblement divinatoire, mais la note maintient le sens plus général afin de ne pas résoudre entièrement l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe conserve l’accumulation solennelle des verbes tout en restant lisible. « Fumier » maintient sans l’atténuer l’image dégradante du jugement prophétique.
