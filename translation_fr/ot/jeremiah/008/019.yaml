    issue: Majuscule interprétative à « Son Roi »
    rationale: מַלְכָּהּ signifie « son roi »; l’hébreu ne fournit pas de majuscule théologique. Même si le parallélisme favorise une référence à Yahweh, la minuscule conserve l’ambiguïté textuelle.
  - severity: low
    issue: « m’ont-ils irrité » atténue légèrement la force causative
    rationale: Le hifil הִכְעִיסוּנִי est rendu plus exactement et naturellement par « ont-ils provoqué ma colère ».
  - severity: low
    issue: « statues sculptées » est redondant
    rationale: פסילים désigne des images taillées/sculptées; « images sculptées » est plus idiomatique tout en conservant la précision lexicale.
