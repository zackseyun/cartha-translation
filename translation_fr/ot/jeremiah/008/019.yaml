id: JER.8.19
reference: Jeremiah 8:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּה ק֞וֹל שַֽׁוְעַ֣ת בַּת עַמִּ֗/י מֵ/אֶ֨רֶץ֙ מַרְחַקִּ֔ים הַֽ/יהוָה֙ אֵ֣ין בְּ/צִיּ֔וֹן אִם מַלְכָּ֖/הּ אֵ֣ין בָּ֑/הּ מַדּ֗וּעַ הִכְעִס֛וּ/נִי בִּ/פְסִלֵי/הֶ֖ם בְּ/הַבְלֵ֥י נֵכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/019.yaml
  text: 'Look—the cry of the daughter of my people from a distant land: “Is Yahweh not in Zion? Is her King not in her?” Why have they provoked me to anger with their carved images[c][b][a], with foreign idols?'
translation:
  language: fr
  text: 'Voici le cri de la fille de mon peuple, depuis un pays lointain[a] : « Yahweh n’est-il pas à Sion ? Son roi n’est-il pas en elle ? » « Pourquoi ont-ils provoqué ma colère par leurs images sculptées, par les vaines idoles étrangères[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis un pays de grandes distances », c’est-à-dire de très loin.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par les vanités étrangères ». Le mot hébreu traduit par « vaines idoles » les dénonce comme vides et sans valeur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Introduit avec vivacité ce qui est perçu ou entendu; « Voici » convient au registre prophétique sans être obscur.
- source_word: קוֹל שַׁוְעַת
  choice: le cri
  rationale: Le groupe signifie littéralement « la voix/le bruit du cri ». En français, « le cri » exprime naturellement cet appel angoissé sans lourdeur.
- source_word: בַּת עַמִּי
  choice: la fille de mon peuple
  rationale: Conserve la métaphore familiale et collective propre au langage prophétique plutôt que de l’aplanir en « mon peuple ».
- source_word: מֵאֶרֶץ מַרְחַקִּים
  choice: depuis un pays lointain
  rationale: Le pluriel abstrait מַרְחַקִּים souligne l’éloignement; cette formulation française est naturelle et garde l’idée d’une grande distance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu.
- source_word: אֵין בְּצִיּוֹן
  choice: n’est-il pas à Sion ?
  rationale: Rend directement la question rhétorique avec la négation existentielle hébraïque.
- source_word: אִם מַלְכָּהּ אֵין בָּהּ
  choice: Son Roi n’est-il pas en elle ?
  rationale: אִם enchaîne ici une seconde question. « En elle » conserve la personnification féminine de Sion.
- source_word: הִכְעִסוּנִי
  choice: m’ont-ils irrité
  rationale: Le hifil de כעס indique que le peuple a suscité la colère divine; « irriter » rend ce sens causatif de façon concise.
- source_word: בִּפְסִילֵיהֶם
  choice: par leurs statues sculptées
  rationale: פְּסִילִים désigne concrètement des représentations taillées ou sculptées destinées au culte.
- source_word: בְּהַבְלֵי נֵכָר
  choice: par les vaines idoles étrangères
  rationale: הֶבֶל évoque le vide, la vanité et l’inanité; dans ce contexte polémique, le terme vise des idoles associées à ce qui est étranger.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; la translittération préserve le caractère personnel du nom sans le remplacer par un titre.
- issue: Référent de מַלְכָּהּ, « son roi »
  choice: « Son Roi », compris comme Yahweh
  alternative: « son roi », pouvant être lu comme un roi humain
  rationale: Le parallélisme avec « Yahweh n’est-il pas à Sion ? » identifie très probablement le Roi à Yahweh. La majuscule signale ce référent contextuel sans ajouter de nom au texte.
- issue: Identification des locuteurs
  choice: Les deux premières questions sont le cri du peuple; la dernière est la réponse de Yahweh
  alternative: Présenter toute la suite comme un seul discours sans attribution distincte
  rationale: Le passage passe naturellement du cri de la fille du peuple à une parole divine à la première personne (« m’ont-ils irrité »). Les guillemets séparés rendent visible ce changement, bien que l’hébreu ancien ne comporte pas de ponctuation de dialogue.
translation_notes:
  register: Français international moderne, poétique et digne. La métaphore « fille de mon peuple » ainsi que la personnification féminine de Sion sont conservées. La ponctuation distingue le cri du peuple de la réponse divine; les marqueurs [a] et [b] figurent dans le texte.
