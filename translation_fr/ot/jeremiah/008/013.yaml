  text: אָסֹ֥ף אֲסִיפֵ֖/ם נְאֻם יְהֹוָ֑ה אֵין֩ עֲנָבִ֨ים בַּ/גֶּ֜פֶן וְ/אֵ֧ין תְּאֵנִ֣ים בַּ/תְּאֵנָ֗ה וְ/הֶֽ/עָלֶה֙ נָבֵ֔ל וָ/אֶתֵּ֥ן לָ/הֶ֖ם יַעַבְרֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/013.yaml
  text: I will surely gather them[a], declares Yahweh. There are no grapes on the vine, and no figs on the fig tree; even the leaf has withered[b], and what I gave them will pass away from them.
translation:
  language: fr
  text: « Je les ramasserai, oui, je les ramasserai[a], déclare Yahweh. Il n’y a pas de raisins sur la vigne, ni de figues sur le figuier ; même les feuilles se sont flétries, et ce que je leur ai donné leur échappera[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je les balaierai complètement » ou « Je les ferai tous disparaître. » L’hébreu renforce le verbe « ramasser, recueillir », qui peut ici évoquer un enlèvement total ou l’anéantissement.'
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition est difficile en hébreu. On pourrait aussi comprendre : « ce que je leur ai donné leur sera retiré », ou une formulation semblable.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָסֹף אֲסִיפֵם
  choice: Je les ramasserai tous
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. « Ramasser » conserve le sens premier de אסף et s’accorde avec l’image de la récolte, tandis que « tous » exprime l’intensification. Dans ce contexte de jugement, l’expression peut aussi évoquer l’enlèvement ou l’anéantissement, possibilités signalées en note.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Formule prophétique solennelle et courante. Le nom divin יהוה est transcrit « Yahweh ».
- source_word: אֵין עֲנָבִים בַּגֶּפֶן
  choice: Il n’y a plus de raisins sur la vigne
  rationale: Le français « il n’y a plus » exprime naturellement l’absence constatée dans cette scène de dévastation, sans préciser la cause.
- source_word: וְאֵין תְּאֵנִים בַּתְּאֵנָה
  choice: ni de figues sur le figuier
  rationale: La coordination elliptique est naturelle en français et préserve le parallélisme entre la vigne et le figuier.
- source_word: וְהֶעָלֶה נָבֵל
  choice: même les feuilles se sont flétries
  rationale: Le singulier hébreu peut avoir une valeur collective. Le pluriel est plus naturel en français, et « même » fait ressortir la progression vers une stérilité complète.
- source_word: וָאֶתֵּן לָהֶם
  choice: ce que je leur ai donné
  rationale: Cette formulation reste générale comme l’hébreu et n’identifie pas arbitrairement le don à la terre, à la Loi ou aux bénédictions.
- source_word: יַעַבְרוּם
  choice: leur échappera
  rationale: La forme hébraïque est difficile. « Leur échappera » conserve l’idée de passage et de perte tout en produisant une phrase française intelligible, sans préciser exactement le mécanisme du retrait.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » rend le nom propre plutôt qu’un titre de substitution.
- issue: Portée de la formule initiale de jugement
  choice: Je les ramasserai tous
  alternative: Je les balaierai complètement / Je les ferai tous disparaître
  rationale: Le choix principal conserve l’image lexicale de אסף et son lien possible avec la récolte. Les autres lectures rendent plus explicitement la menace, mais ajoutent une interprétation au verbe.
- issue: Interprétation de la dernière proposition
  choice: ce que je leur ai donné leur échappera
  alternative: ce que je leur ai donné leur sera retiré
  rationale: La syntaxe hébraïque est obscure. Le texte principal exprime la perte sans imposer une analyse grammaticale trop précise ; la note présente une lecture passive plus explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation garde le mouvement de l’oracle et son imagerie agricole. Le pluriel « les feuilles » rend naturellement en français le singulier collectif hébreu. Les deux notes maintiennent les ambiguïtés réelles du texte sans alourdir le verset.
