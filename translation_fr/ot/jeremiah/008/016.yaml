source:
  edition: WLC
  text: מִ/דָּ֤ן נִשְׁמַע֙ נַחְרַ֣ת סוּסָ֗י/ו מִ/קּוֹל֙ מִצְהֲל֣וֹת אַבִּירָ֔י/ו רָעֲשָׁ֖ה כָּל הָ/אָ֑רֶץ וַ/יָּב֗וֹאוּ וַ/יֹּֽאכְלוּ֙ אֶ֣רֶץ וּ/מְלוֹאָ֔/הּ עִ֖יר וְ/יֹ֥שְׁבֵי בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/016.yaml
  text: From Dan is heard the snorting of his horses[a]; at the sound of the neighing of his stallions the whole land quakes. They come and devour the land and its fullness[c][b], the city and those who dwell in it.
translation:
  language: fr
  text: Depuis Dan, on entend le renâclement de ses chevaux ; au bruit des hennissements de ses puissants coursiers[a], tout le pays tremble[b]. Ils arrivent et dévorent le pays et tout ce qu’il contient[c], la ville et ceux qui l’habitent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ses étalons » ou « de ses chevaux puissants ». Le terme hébreu souligne leur force et ne désigne pas nécessairement leur sexe.
    reason: lexical_alternative
  - marker: b
    text: Ou « toute la terre tremble ». Le mot hébreu peut signifier « pays » ou « terre » ; ici, « pays » convient au contexte de l’invasion.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « le pays et ce qui le remplit ».
    reason: literal_rendering
lexical_decisions:
- source_word: מִדָּן
  choice: De Dan
  rationale: 'Le nom propre est conservé et la préposition marque le point d’origine : l’invasion se fait entendre depuis la frontière nord.'
- source_word: נַחְרַת סוּסָיו
  choice: le souffle bruyant de ses chevaux
  rationale: נַחְרָה évoque la respiration forte ou le renâclement des chevaux. Cette formulation reste naturelle et sonore en français, sans suggérer à tort qu’ils refusent d’avancer.
- source_word: מִצְהֲלוֹת אַבִּירָיו
  choice: au bruit des hennissements de ses puissants coursiers
  rationale: אַבִּירָיו désigne ici, dans le contexte équin, des chevaux remarquables par leur force. « Puissants coursiers » préserve cette nuance sans imposer le sexe qu’exprimerait « étalons ».
- source_word: רָעֲשָׁה כָּל הָאָרֶץ
  choice: tout le pays tremble
  rationale: אֶרֶץ peut désigner le pays ou la terre ; le contexte immédiat de l’invasion du territoire favorise « pays », tandis que le présent restitue la vivacité prophétique.
- source_word: וַיָּבֹאוּ וַיֹּאכְלוּ
  choice: Ils arrivent et dévorent
  rationale: Le présent dramatique rend la scène vive. « Dévorent » conserve la métaphore violente du verbe « manger » appliqué aux envahisseurs.
- source_word: אֶרֶץ וּמְלוֹאָהּ
  choice: le pays et tout ce qu’il contient
  rationale: Cette expression rend naturellement מְלוֹאָהּ, littéralement « ce qui le remplit », sans obscurité en français moderne.
- source_word: עִיר וְיֹשְׁבֵי בָהּ
  choice: la ville et ceux qui l’habitent
  rationale: La formulation conserve la valeur participiale de יֹשְׁבֵי et la distingue clairement du territoire environnant.
theological_decisions:
- issue: Référent des suffixes masculins dans « ses chevaux » et « ses puissants coursiers »
  choice: Conserver le possessif masculin singulier sans expliciter son référent
  alternative: Dire « les chevaux de l’ennemi » ou employer « leurs chevaux »
  rationale: L’hébreu porte un suffixe masculin singulier, probablement lié à l’envahisseur envisagé collectivement, mais le verset ne nomme pas ici ce référent. L’expliciter résoudrait une ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et imagé. Le parallélisme et le présent prophétique sont conservés. « Souffle bruyant » évite l’ambiguïté moderne de « renâclement », tandis que « coursiers » maintient une légère élévation poétique adaptée au registre prophétique.
