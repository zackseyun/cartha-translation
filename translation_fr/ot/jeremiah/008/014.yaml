id: JER.8.14
reference: Jeremiah 8:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל מָה֙ אֲנַ֣חְנוּ יֹֽשְׁבִ֔ים הֵֽאָסְפ֗וּ וְ/נָב֛וֹא אֶל עָרֵ֥י הַ/מִּבְצָ֖ר וְ/נִדְּמָה שָּׁ֑ם כִּי֩ יְהוָ֨ה אֱלֹהֵ֤י/נוּ הֲדִמָּ֨/נוּ֙ וַ/יַּשְׁקֵ֣/נוּ מֵי רֹ֔אשׁ כִּ֥י חָטָ֖אנוּ לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/014.yaml
  text: Why are we sitting still? Gather yourselves[a], and let us enter the fortified cities and perish there, for Yahweh our God has doomed us and given us poisoned water to drink[b], because we have sinned against Yahweh.
translation:
  language: fr
  text: Pourquoi restons-nous assis ? Rassemblez-vous, entrons dans les villes fortifiées et périssons-y[a], car Yahweh, notre Dieu, nous a voués à la ruine et nous a fait boire de l’eau empoisonnée[b], parce que nous avons péché contre Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et restons-y silencieux » ou « et soyons-y anéantis » ; le verbe hébreu peut évoquer le silence, l’immobilité ou la destruction.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de l’eau de poison » ou « de l’eau d’une plante amère et toxique ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: restons-nous assis
  rationale: Le sens premier de ישׁב, « être assis, demeurer », est conservé; dans cette question pressante, la formulation évoque naturellement l’inaction.
- source_word: הֵאָסְפוּ
  choice: Rassemblez-vous
  rationale: L’impératif nifal appelle le groupe à se réunir; la forme pronominale française rend clairement cet appel collectif.
- source_word: עָרֵי הַמִּבְצָר
  choice: les villes fortifiées
  rationale: Cette expression française courante conserve la dimension urbaine et défensive du syntagme hébreu.
- source_word: וְנִדְּמָה
  choice: et périssons-y
  rationale: Dans ce contexte de siège et de jugement, le verbe דמה désigne probablement la destruction ou la ruine. Une note conserve l’ambiguïté réelle avec le silence et l’anéantissement.
- source_word: הֲדִמָּנוּ
  choice: nous a voués à la ruine
  rationale: Le hifil de דמה présente Yahweh comme celui qui livre le peuple à la ruine. Cette formulation exprime le jugement sans préciser indûment son mécanisme.
- source_word: מֵי רֹאשׁ
  choice: de l’eau empoisonnée
  rationale: רֹאשׁ désigne ici une substance ou plante toxique et amère. « Eau empoisonnée » transmet directement l’image concrète; la traduction littérale figure en note.
- source_word: חָטָאנוּ לַיהוָה
  choice: nous avons péché contre Yahweh
  rationale: « Pécher contre » est la construction française naturelle pour exprimer l’offense dirigée envers Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Sens des deux formes issues de דמה dans le langage du jugement
  choice: Le peuple envisage de périr dans les villes fortifiées parce que Yahweh l’a voué à la ruine.
  alternative: Le peuple va s’y tenir en silence parce que Yahweh l’a réduit au silence ou l’a anéanti.
  rationale: Le contexte d’invasion, de villes fortifiées, d’eau empoisonnée et de confession du péché favorise le sens de ruine. La note signale toutefois la polysémie du verbe et évite de supprimer la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La question initiale garde l’image concrète de personnes assises, tandis que « voués à la ruine » explicite sobrement la force causative du second emploi de דמה. Le nom Yahweh est conservé.
