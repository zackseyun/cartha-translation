source:
  edition: WLC
  text: הֹבִ֕שׁוּ כִּ֥י תוֹעֵבָ֖ה עָשׂ֑וּ גַּם בּ֣וֹשׁ לֹֽא יֵבֹ֗שׁוּ וְ/הִכָּלֵם֙ לֹ֣א יָדָ֔עוּ לָ/כֵ֞ן יִפְּל֣וּ בַ/נֹּפְלִ֗ים בְּ/עֵ֧ת פְּקֻדָּתָ֛/ם יִכָּשְׁל֖וּ אָמַ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/012.yaml
  text: Were they ashamed because they had done an abomination? No[a], they were not ashamed at all; they did not even know how to blush. Therefore they will fall among the fallen; at the time of their punishment they will stumble, says Yahweh.
translation:
  language: fr
  text: Ont-ils eu honte d’avoir commis une abomination ? Non, ils n’ont éprouvé aucune honte ; ils ne savaient même pas rougir. C’est pourquoi ils tomberont parmi ceux qui tombent ; au temps de leur châtiment[a], ils trébucheront, dit Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au temps de leur visitation ». Le terme hébreu peut désigner le moment où Dieu intervient pour juger ou demander des comptes.
    reason: alternative lexicale préservant l’étendue sémantique de פְּקֻדָּה
lexical_decisions:
- source_word: הֹבִשׁוּ
  choice: Ont-ils eu honte
  rationale: Le contexte et la négation emphatique qui suit favorisent une question rhétorique. Cette formulation conserve le champ sémantique de la honte sans transformer celle-ci en simple humiliation subie.
- source_word: כִּי תוֹעֵבָה עָשׂוּ
  choice: d’avoir commis une abomination
  rationale: La tournure causale relie la honte attendue à l’acte commis. « Abomination » garde la forte portée morale et religieuse de תוֹעֵבָה.
- source_word: גַּם בּוֹשׁ לֹא יֵבֹשׁוּ
  choice: Non, ils n’ont éprouvé aucune honte
  rationale: La construction hébraïque intensifie la négation ; « aucune honte » en rend naturellement l’insistance en français.
- source_word: וְהִכָּלֵם לֹא יָדָעוּ
  choice: ils ne savent même pas rougir
  rationale: « Rougir » exprime de manière idiomatique la manifestation visible de la honte, tandis que « même » rend la progression emphatique.
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Ce connecteur introduit clairement la conséquence judiciaire de leur absence de honte.
- source_word: יִפְּלוּ בַנֹּפְלִים
  choice: ils tomberont parmi ceux qui tombent
  rationale: La formulation conserve la répétition et le jeu verbal de la racine נפל, plutôt que de les aplanir.
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: au temps de leur châtiment
  rationale: Dans ce contexte de jugement, « châtiment » exprime le sens contextuel probable de פְּקֻדָּה, tout en signalant en note l’autre valeur possible du terme.
- source_word: יִכָּשְׁלוּ
  choice: ils trébucheront
  rationale: Ce choix maintient la métaphore de la perte d’équilibre et son lien avec la chute mentionnée juste avant.
- source_word: אָמַר יְהוָה
  choice: dit Yahvé
  rationale: Le présent français convient à la formule prophétique, et « Yahvé » rend explicitement le nom divin יהוה selon l’usage français courant.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin. « Yahvé » le représente explicitement en suivant la forme traditionnellement reçue en français, plutôt que de le remplacer par un titre.
- issue: Sens judiciaire de פְּקֻדָּה
  choice: châtiment
  alternative: visite / intervention
  rationale: Le contexte annonce la chute et le trébuchement, ce qui favorise un sens judiciaire. La note conserve toutefois l’ambivalence du mot, qui peut désigner le moment où Dieu intervient ou demande des comptes.
translation_notes:
  register: Français international moderne, digne et direct. La question rhétorique et les répétitions liées à la honte et à la chute sont conservées. Le vocabulaire prophétique reste fort sans archaïsmes inutiles.
