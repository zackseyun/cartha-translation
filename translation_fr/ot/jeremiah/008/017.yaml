  text: כִּי֩ הִנְ/נִ֨י מְשַׁלֵּ֜חַ בָּ/כֶ֗ם נְחָשִׁים֙ צִפְעֹנִ֔ים אֲשֶׁ֥ר אֵין לָ/הֶ֖ם לָ֑חַשׁ וְ/נִשְּׁכ֥וּ אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/017.yaml
  text: For behold[a], I am sending among you snakes, vipers that cannot be charmed, and they will bite you[b], declares Yahweh.
translation:
  language: fr
  text: Car voici, j’envoie parmi vous des serpents, des vipères[a] qui ne peuvent pas être charmées[b]. Ils vous mordront — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aspics ». Le mot hébreu désigne un serpent venimeux, sans permettre d’en déterminer avec certitude l’espèce.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour lesquels il n’y a pas d’incantation ». Il s’agit d’une incantation, ou d’un charme murmuré, employé pour charmer les serpents.'
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Conserve la valeur explicative du connecteur hébreu et son lien avec le contexte précédent.
- source_word: הִנְנִי מְשַׁלֵּחַ
  choice: voici que j’envoie
  rationale: « Voici que » rend l’insistance déictique de הִנְנִי, tandis que le présent traduit naturellement l’action imminente et certaine exprimée par le participe.
- source_word: בָּכֶם
  choice: parmi vous
  rationale: Évoque les serpents lâchés au milieu du peuple tout en laissant clairement entendre le jugement dirigé contre lui.
- source_word: נְחָשִׁים צִפְעֹנִים
  choice: des serpents, des vipères
  rationale: « Serpents » rend le terme général, et « vipères » précise le caractère venimeux et dangereux du second terme sans prétendre identifier avec certitude une espèce.
- source_word: אֲשֶׁר אֵין לָהֶם לָחַשׁ
  choice: sur lesquels aucun charme n’agit
  rationale: Rend en français naturel l’idée d’une incantation de charmeur de serpents qui demeure sans effet, tout en signalant par une note la formulation plus littérale.
- source_word: וְנִשְּׁכוּ אֶתְכֶם
  choice: Ils vous mordront
  rationale: Le verbe désigne précisément la morsure; le futur exprime ici la conséquence certaine de l’envoi.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Conserve le poids de la formule prophétique et rend directement le nom divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
- issue: Nature des serpents et inefficacité du charme
  choice: Des vipères réelles dans l’image prophétique, sur lesquelles le charme n’agit pas
  alternative: Comprendre le langage uniquement comme une métaphore générale du jugement
  rationale: La traduction conserve l’image concrète choisie par le texte sans décider si son accomplissement doit être compris littéralement, symboliquement ou selon les deux dimensions.
translation_notes:
  register: Français international actuel, clair et digne. « Voici que » maintient la solennité prophétique sans recourir à une tournure archaïque; la ponctuation détache sobrement la formule finale.
