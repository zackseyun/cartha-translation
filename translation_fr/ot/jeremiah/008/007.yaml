  text: גַּם חֲסִידָ֣ה בַ/שָּׁמַ֗יִם יָֽדְעָה֙ מֽוֹעֲדֶ֔י/הָ וְ/תֹ֤ר ו/סוס וְ/עָג֔וּר שָׁמְר֖וּ אֶת עֵ֣ת בֹּאָ֑/נָה וְ/עַמִּ֕/י לֹ֣א יָֽדְע֔וּ אֵ֖ת מִשְׁפַּ֥ט יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/007.yaml
  text: Even the stork in the heavens knows her appointed times, and the turtledove, the swift, and the crane keep the time of their coming; but my people do not know the judgment of the LORD.
translation:
  language: fr
  text: Même la cigogne dans le ciel connaît les temps qui lui sont fixés ; la tourterelle, le martinet et la grue observent le moment de leur arrivée. Mais mon peuple ne connaît pas le droit de l’Éternel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le jugement de l’Éternel » ; le mot hébreu peut désigner son droit, ses exigences ou sa décision judiciaire.'
    reason: Signale l’étendue sémantique de מִשְׁפָּט, importante pour l’interprétation du verset.
lexical_decisions:
- source_word: חֲסִידָה
  choice: cigogne
  rationale: Identification zoologique usuelle et bien établie du terme hébreu.
- source_word: מוֹעֲדֶיהָ
  choice: les temps qui lui sont fixés
  rationale: Exprime les périodes déterminées ou saisonnières connues de l’oiseau, tout en conservant l’idée de rendez-vous fixé portée par מועד.
- source_word: תֹר
  choice: tourterelle
  rationale: Équivalent français courant du nom d’oiseau hébreu.
- source_word: סוס
  choice: martinet
  rationale: Dans cette liste d’oiseaux migrateurs, le terme désigne vraisemblablement le martinet, bien que l’identification reste discutée.
- source_word: עָגוּר
  choice: grue
  rationale: Identification traditionnelle et contextuellement vraisemblable, sans certitude absolue.
- source_word: שָׁמְרוּ
  choice: respectent
  rationale: Rend l’idée d’observer fidèlement une échéance naturelle.
- source_word: עֵת בֹּאָנָה
  choice: le temps de leur retour
  rationale: Le suffixe féminin pluriel renvoie aux oiseaux; dans le contexte migratoire, leur venue est naturellement exprimée comme leur retour saisonnier.
- source_word: מִשְׁפַּט יְהוָה
  choice: le droit de l’Éternel
  rationale: מִשְׁפָּט peut désigner ici l’ordre juste, l’exigence ou la décision de YHWH; « droit » conserve cette amplitude mieux que « jugement » seul. « l’Éternel » suit l’usage français traditionnel pour le tétragramme.
theological_decisions:
- issue: Sens de מִשְׁפַּט יְהוָה
  choice: le droit de l’Éternel
  alternative: le jugement de l’Éternel / ce que l’Éternel exige
  rationale: Le contexte oppose l’instinct des oiseaux à l’incapacité du peuple de reconnaître l’ordre normatif et les décisions divines. « Droit » préserve cette tension sans limiter le terme au châtiment ni le paraphraser en simple commandement.
translation_notes:
  register: Français moderne, naturel et digne. Le parallélisme poétique est conservé. Les identifications zoologiques sont formulées dans le texte selon les équivalents les plus plausibles, et l’incertitude principale est notée dans les décisions lexicales.
