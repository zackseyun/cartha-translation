source:
  edition: WLC
  text: אֵיכָ֤ה תֹֽאמְרוּ֙ חֲכָמִ֣ים אֲנַ֔חְנוּ וְ/תוֹרַ֥ת יְהוָ֖ה אִתָּ֑/נוּ אָכֵן֙ הִנֵּ֣ה לַ/שֶּׁ֣קֶר עָשָׂ֔ה עֵ֖ט שֶׁ֥קֶר סֹפְרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/008.yaml
  text: How can you say[a], ‘We are wise, and the law of Yahweh is with us’? But look, the lying pen of the scribes has made it into a lie.
translation:
  language: fr
  text: 'Comment pouvez-vous dire : « Nous sommes sages, et la loi de Yahweh est avec nous » ? Mais regardez : la plume mensongère des scribes en a fait un mensonge.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Oui, regardez : la plume des scribes a produit la fausseté », ou : « la plume trompeuse des scribes a agi faussement. » L’hébreu est très condensé et permet plusieurs manières d’exprimer la falsification opérée par les scribes.'
    reason: 'Alternative lexicale et syntaxique : les rapports entre לַשֶּׁקֶר, עָשָׂה et עֵט שֶׁקֶר סֹפְרִים sont ambigus.'
lexical_decisions:
- source_word: אֵיכָה
  choice: Comment pouvez-vous
  rationale: Cette tournure rend l’interrogation indignée et incrédule du prophète dans un français naturel.
- source_word: חֲכָמִים אֲנַחְנוּ
  choice: Nous sommes sages
  rationale: Rend directement la prétention à la sagesse, sans la spécialisation que pourrait suggérer « nous sommes des sages ».
- source_word: תּוֹרַת יְהוָה
  choice: la loi de Yahweh
  rationale: « Loi » conserve ici la portée textuelle et liée à l’alliance de תּוֹרָה, tandis que le nom divin est translittéré.
- source_word: אִתָּנוּ
  choice: est avec nous
  rationale: Traduction directe qui préserve l’ambiguïté entre possession, présence et adhésion revendiquées.
- source_word: אָכֵן הִנֵּה
  choice: Mais regardez
  rationale: Marque à la fois la réfutation emphatique et l’appel à constater, dans un registre moderne et digne.
- source_word: לַשֶּׁקֶר
  choice: en a fait un mensonge
  rationale: La construction française exprime la valeur résultative possible de la préposition ל et maintient la répétition de l’idée de fausseté.
- source_word: עֵט שֶׁקֶר סֹפְרִים
  choice: la plume mensongère des scribes
  rationale: Rend de façon concise la chaîne hébraïque compacte en caractérisant la plume par la fausseté, tout en signalant les autres analyses possibles en note.
theological_decisions:
- issue: Sens de תּוֹרַת יְהוָה dans la polémique prophétique
  choice: la loi de Yahweh
  alternative: l’instruction de Yahweh
  rationale: « Loi » conserve la dimension liée à l’alliance et au texte revendiqué par les scribes; « instruction » reste lexicalement possible, mais serait moins immédiatement évocateur ici.
- issue: Nature précise de l’accusation portée contre les scribes
  choice: leur plume a fait de la loi un mensonge
  alternative: leur plume a produit la fausseté / a agi faussement
  rationale: Le référent implicite de « en » est naturellement la loi mentionnée juste avant, mais l’hébreu est très condensé; la note conserve donc les autres constructions sans trancher au-delà du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Regardez » garde la force déictique de הִנֵּה sans l’archaïsme de « voici » ou « voyez ». Le tutoiement est exclu puisque les verbes hébreux s’adressent à un groupe.
