  text: עַל שֶׁ֥בֶר בַּת עַמִּ֖/י הָשְׁבָּ֑רְתִּי קָדַ֕רְתִּי שַׁמָּ֖ה הֶחֱזִקָֽתְ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/021.yaml
  text: For the brokenness of the daughter of my people I am broken[a]; I mourn[c][b]; horror has seized me.
translation:
  language: fr
  text: À cause de la brisure de la fille de mon peuple, je suis brisé[a] ; je porte le deuil[b] ; l’épouvante s’est emparée de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie la même racine pour « brisure » et « je suis brisé », créant un jeu de mots. On pourrait aussi traduire : « À cause de la ruine de la fille de mon peuple, je suis anéanti. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je suis assombri ». Le verbe hébreu évoque l’obscurité associée au chagrin et au deuil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: À cause de
  rationale: La préposition introduit ici la cause ou le motif de la douleur du locuteur. « À cause de » exprime clairement ce rapport en français moderne.
- source_word: שֶׁבֶר
  choice: fracture
  rationale: Le nom désigne une cassure, une fracture ou un effondrement. « Fracture » conserve l’image concrète et permet de faire entendre l’écho avec « je suis brisé ».
- source_word: בַּת עַמִּי
  choice: la fille de mon peuple
  rationale: Cette expression prophétique personnifie le peuple sous les traits d’une fille. La traduction conserve cette image biblique sans la paraphraser.
- source_word: הָשְׁבָּרְתִּי
  choice: je suis brisé
  rationale: 'Le verbe reprend la même racine que שֶׁבֶר, produisant un effet délibéré : la fracture du peuple brise aussi le locuteur. Le présent exprime naturellement l’état résultant dans cette lamentation.'
- source_word: קָדַרְתִּי
  choice: je porte le deuil
  rationale: Le verbe évoque littéralement l’assombrissement et, dans ce contexte, l’affliction ou le deuil. « Je porte le deuil » restitue le sens idiomatique tout en suggérant l’assombrissement lié au chagrin.
- source_word: שַׁמָּה
  choice: l’épouvante
  rationale: Le terme peut désigner l’effroi, la stupeur ou la consternation devant un désastre. « L’épouvante » est naturel, fort et adapté à l’émotion du verset.
- source_word: הֶחֱזִקַתְנִי
  choice: s’est emparée de moi
  rationale: La forme causative de חזק présente l’épouvante comme une force qui saisit et tient le locuteur. Cette expression française préserve cette intensité.
theological_decisions:
- issue: Identité du locuteur affligé
  choice: Ne pas préciser s’il s’agit exclusivement de Jérémie ou d’une voix divine/prophétique.
  alternative: Identifier explicitement le locuteur comme Jérémie ou comme Dieu.
  rationale: Le verset lui-même emploie seulement la première personne et le contexte poétique peut faire entendre une voix prophétique étroitement associée à la douleur divine. La traduction conserve cette tension sans l’interpréter.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification « la fille de mon peuple » est maintenue, de même que l’écho lexical entre la fracture collective et le locuteur brisé. La ponctuation en trois propositions conserve le rythme accumulatif de la lamentation.
