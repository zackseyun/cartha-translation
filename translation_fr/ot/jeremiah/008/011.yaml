  text: וַ/יְרַפּ֞וּ אֶת שֶׁ֤בֶר בַּת עַמִּ/י֙ עַל נְקַלָּ֔ה לֵ/אמֹ֖ר שָׁל֣וֹם שָׁל֑וֹם וְ/אֵ֖ין שָׁלֽוֹם־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/011.yaml
  text: They have treated the wound of the daughter of my people lightly[a], saying, ‘Peace[b], peace,’ when there is no peace.
translation:
  language: fr
  text: 'Ils ont pansé à la légère[a] la blessure de la fille de mon peuple, en disant : « Paix ! Paix ! »[b], alors qu’il n’y a pas de paix.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « superficiellement », « comme s’il s’agissait de peu de chose ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « paix » peut aussi désigner le bien-être, l’intégrité ou la sécurité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַפּוּ
  choice: Ils soignent
  rationale: Le verbe רפא signifie « guérir, soigner ». « Soignent » maintient la métaphore médicale sans laisser entendre que la guérison a réellement abouti.
- source_word: שֶׁבֶר
  choice: la blessure
  rationale: Avec le verbe « soigner », « blessure » rend naturellement l’image d’une fracture ou d’un dommage grave.
- source_word: בַּת עַמִּי
  choice: la fille de mon peuple
  rationale: Cette expression conserve la personnification prophétique et sa charge affective, sans la réduire au simple « mon peuple ».
- source_word: עַל נְקַלָּה
  choice: à la légère
  rationale: Cette locution française exprime le fait de traiter comme peu grave une blessure sérieuse, tout en permettant aussi la nuance de superficialité.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Rend directement l’infinitif hébreu qui introduit le contenu de la fausse assurance.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: « Paix ! Paix ! »
  rationale: Conserve le terme traditionnel et la répétition emphatique, presque comme un slogan, du texte hébreu.
- source_word: וְאֵין שָׁלוֹם
  choice: alors qu’il n’y a pas de paix
  rationale: Exprime clairement le contraste entre leur proclamation rassurante et la réalité, sans supprimer la répétition lexicale de שָׁלוֹם.
theological_decisions:
- issue: Maintien de la personnification prophétique
  choice: Conserver « la fille de mon peuple » dans le texte principal
  alternative: « mon peuple » ou « mon peuple bien-aimé »
  rationale: L’hébreu personnifie le peuple comme une fille. Cette image porte une force poétique, affective et prophétique qu’une paraphrase effacerait.
- issue: Étendue sémantique de שָׁלוֹם
  choice: Employer « paix » dans le texte principal
  alternative: « bien-être », « sécurité » ou « tout va bien »
  rationale: « Paix » préserve la correspondance lexicale et la force de la répétition. Une note signale que le mot hébreu possède ici un champ de sens plus large.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’image hébraïque tout en étant naturelle en français. Les exclamations mettent en relief la répétition emphatique de שָׁלוֹם.
