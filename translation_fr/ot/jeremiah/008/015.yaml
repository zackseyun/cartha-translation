id: JER.8.15
reference: Jeremiah 8:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קַוֵּ֥ה לְ/שָׁל֖וֹם וְ/אֵ֣ין ט֑וֹב לְ/עֵ֥ת מַרְפֵּ֖ה וְ/הִנֵּ֥ה בְעָתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/015.yaml
  text: We hoped for peace[a], but there was no good; for a time of healing, but behold[c][b], terror.
translation:
  language: fr
  text: 'Nous espérions la paix[a], mais rien de bon n’est venu ; un temps de guérison, mais voici : la terreur[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Nous attendions la paix » ou « Nous comptions sur la paix ». Le mot traduit par « paix » peut aussi désigner le bien-être ou l’intégrité.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’effroi » ou « l’épouvante ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֵּה
  choice: Nous espérions
  rationale: Dans le contexte, la forme est comprise comme une lamentation à la première personne du pluriel. « Espérions » exprime naturellement l’attente confiante déçue, tout en laissant en note les nuances d’attendre et d’escompter.
- source_word: לְשָׁלוֹם
  choice: la paix
  rationale: שָׁלוֹם désigne ici la paix, mais peut aussi englober le bien-être et l’intégrité; « paix » reste le terme français le plus direct et naturel.
- source_word: וְאֵין טוֹב
  choice: mais rien de bon n’est venu
  rationale: Littéralement, « et il n’y a pas de bien ». La formulation française rend la valeur adversative et l’absence de l’issue favorable attendue sans préciser la nature de ce bien.
- source_word: לְעֵת מַרְפֵּה
  choice: un temps de guérison
  rationale: מַרְפֵּה peut évoquer guérison, remède ou rétablissement. « Un temps de guérison » conserve l’expression temporelle et la portée large de l’image.
- source_word: וְהִנֵּה
  choice: mais voici
  rationale: הִנֵּה introduit avec force le résultat opposé à l’attente. « Mais voici » garde à la fois le contraste et l’effet soudain.
- source_word: בְעָתָה
  choice: la terreur
  rationale: Le nom exprime une peur intense, l’effroi ou l’épouvante. « Terreur » est bref et restitue le contraste abrupt avec la guérison espérée.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme de la lamentation et son renversement abrupt sont conservés; le point-virgule sépare les deux attentes parallèles, et les deux occurrences de « mais » marquent leur déception.
