  text: הִקְשַׁ֤בְתִּי וָֽ/אֶשְׁמָע֙ לוֹא כֵ֣ן יְדַבֵּ֔רוּ אֵ֣ין אִ֗ישׁ נִחָם֙ עַל רָ֣עָת֔/וֹ לֵ/אמֹ֖ר מֶ֣ה עָשִׂ֑יתִי כֻּלֹּ֗/ה שָׁ֚ב ב/מרצות/ם כְּ/ס֥וּס שׁוֹטֵ֖ף בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/006.yaml
  text: 'I have paid attention and listened: they do not speak rightly[a]. No man repents of his evil, saying, ‘What have I done?’ Every one turns in his own course[c][b], like a horse rushing into battle.'
translation:
  language: fr
  text: 'J’ai prêté attention et j’ai écouté : ils ne disent pas ce qui est juste[a]. Personne[b] ne se repent de son mal en disant : « Qu’ai-je fait ? » Chacun reprend sa course[c], comme un cheval qui fonce dans la bataille.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne parlent pas correctement ». Littéralement : « ce n’est pas ainsi qu’ils parlent ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pas un homme » ; le masculin singulier hébreu est employé ici dans un sens représentatif.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « Tous retournent à leur course ». L’expression hébraïque décrit leur persistance précipitée dans la voie qu’ils suivent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשַׁבְתִּי וָאֶשְׁמָע
  choice: J’ai été attentif et j’ai écouté
  rationale: Le premier verbe exprime une écoute délibérément attentive, tandis que le second signifie entendre ou écouter. Cette formulation conserve leur succession sans les fondre en un seul verbe.
- source_word: לוֹא כֵן יְדַבֵּרוּ
  choice: ils ne parlent pas comme il faut
  rationale: Littéralement, « ce n’est pas ainsi qu’ils parlent ». Dans le contexte, l’expression porte un jugement sur leurs paroles. La traduction choisie est naturelle en français tout en laissant la note signaler la formulation plus littérale.
- source_word: אֵין אִישׁ
  choice: Personne
  rationale: La tournure hébraïque signifie littéralement « il n’y a pas un homme ». Ici, אִישׁ a une portée représentative et générique; « personne » exprime naturellement l’absence totale d’exception en français moderne.
- source_word: נִחָם עַל רָעָתוֹ
  choice: ne regrette le mal qu’il a fait
  rationale: נחם exprime ici le regret susceptible d’entraîner un changement, et רעה désigne le mal moral. Cette formulation française rend clairement le sens sans imposer un vocabulaire confessionnel plus technique.
- source_word: לֵאמֹר מֶה עָשִׂיתִי
  choice: 'en disant : « Qu’ai-je fait ? »'
  rationale: La question hébraïque est conservée sans ajouter « de mal », puisque cette idée ressort déjà du contexte.
- source_word: כֻּלֹּה שָׁב בִּמְרוּצָתָם
  choice: Chacun reprend sa course
  rationale: La formulation distributive implique chaque individu, tandis que מרוצה évoque une course ou un élan. « Reprend » rend ici שׁוב comme un retour persistant à la même conduite et prépare l’image du cheval.
- source_word: כְּסוּס שׁוֹטֵף בַּמִּלְחָמָה
  choice: comme un cheval qui fonce dans la bataille
  rationale: שוטף évoque un mouvement impétueux et irrésistible. « Fonce » restitue avec naturel la violence de l’élan du cheval vers le combat.
theological_decisions:
- issue: Portée de אִישׁ dans une affirmation représentative
  choice: Personne
  alternative: Pas un homme
  rationale: Bien que le nom hébreu soit masculin singulier, il fonctionne ici de manière générique. « Personne » évite en français une restriction masculine absente du sens contextuel; la note conserve la forme littérale.
- issue: Sens moral de נִחָם
  choice: regrette
  alternative: se repent
  rationale: Le contexte dénonce l’absence de regret et de changement face au mal. « Regrette » préserve ce sens sans transformer le verbe en terme doctrinal technique; « se repent » demeure une traduction possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme oppose l’écoute attentive du locuteur à l’absence de parole juste et de regret, puis s’accélère dans l’image finale. Les guillemets français et une ponctuation claire facilitent la lecture publique.
