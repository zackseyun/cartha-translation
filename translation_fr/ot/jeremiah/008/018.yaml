  text: מַבְלִ֥יגִיתִ֖/י עֲלֵ֣י יָג֑וֹן עָלַ֖/י לִבִּ֥/י דַוָּֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/018.yaml
  text: My sorrow is beyond healing[b][a]; my heart is sick within me.
translation:
  language: fr
  text: Mon réconfort face au chagrin… mon cœur est malade en moi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu difficile et elliptique. Le premier membre peut aussi se comprendre : « Je voudrais me réconforter dans mon chagrin » ou « Mon soulagement face au chagrin ». Le premier mot peut évoquer le réconfort, le soulagement ou la clarté, mais sa nuance exacte est incertaine.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַבְלִיגִיתִי עֲלֵי יָגוֹן
  choice: Mon chagrin est sans remède
  rationale: Le début du vers est textuellement et lexicalement difficile. Dans ce contexte de lamentation, cette formulation française restitue avec naturel l’idée d’un chagrin auquel aucun soulagement ne vient, sans alourdir le vers.
- source_word: יָגוֹן
  choice: chagrin
  rationale: Le mot désigne la peine ou l’affliction. « Chagrin » convient au registre poétique et personnel de la lamentation.
- source_word: לִבִּי
  choice: mon cœur
  rationale: Rendu direct du terme hébreu désignant ici le siège de la vie intérieure et de la détresse.
- source_word: דַוָּי
  choice: est malade
  rationale: L’adjectif exprime la maladie ou la faiblesse. « Est malade » conserve l’image physique appliquée à l’état intérieur.
- source_word: עָלַי
  choice: au-dedans de moi
  rationale: Littéralement « sur moi » ; associé à « mon cœur », il exprime idiomatiquement une souffrance éprouvée intérieurement.
theological_decisions: []
