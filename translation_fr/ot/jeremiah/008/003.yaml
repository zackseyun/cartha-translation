revisions:
- from: La mort sera préférée à la vie par tous ceux qui resteront de cette famille mauvaise, dans tous les lieux où ils se trouveront encore[a], là où je les ai chassés — déclaration de Yahweh des armées.
  to: La mort sera préférée à la vie par tous les survivants de cette mauvaise famille, dans tous les lieux restants[a] où je les ai chassés — déclaration de Yahweh, le Maître des armées.
  rationale: Une correction est nécessaire parce que la version précédente transfère à tort la notion de « rester » des lieux aux exilés. La version révisée maintient la voix passive, le contraste mort/vie, le caractère collectif des survivants et la formule divine, tout en laissant la note traiter l’expression hébraïque inhabituelle.
