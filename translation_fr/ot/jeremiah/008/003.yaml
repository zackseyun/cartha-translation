  text: וְ/נִבְחַ֥ר מָ֨וֶת֙ מֵֽ/חַיִּ֔ים לְ/כֹ֗ל הַ/שְּׁאֵרִית֙ הַ/נִּשְׁאָרִ֔ים מִן הַ/מִּשְׁפָּחָ֥ה הָֽ/רָעָ֖ה הַ/זֹּ֑את בְּ/כָל הַ/מְּקֹמ֤וֹת הַ/נִּשְׁאָרִים֙ אֲשֶׁ֣ר הִדַּחְתִּ֣י/ם שָׁ֔ם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/003.yaml
  text: And death will be chosen rather than life by all the remnant who remain from this evil family[a], in all the places where the remnant remain, where I have driven them—declares Yahweh of hosts.
translation:
  language: fr
  text: La mort sera préférée à la vie par tous les survivants de cette mauvaise famille, dans tous les lieux restants[a] où je les ai chassés — déclaration de Yahweh, le Maître des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « dans tous les lieux qui restent où je les ai chassés là ». Le mot « restants » qualifie les lieux, bien que la formulation soit inhabituelle ; elle évoque les divers lieux d’exil où les survivants ont été dispersés.'
    reason: Préserve l’ancrage grammatical de הַנִּשְׁאָרִים à « lieux » et signale la formulation hébraïque difficile sans en imposer une interprétation supplémentaire.
lexical_decisions:
- source_word: וְנִבְחַר מָוֶת מֵחַיִּים
  choice: La mort sera préférée à la vie
  rationale: Le nifal de בחר exprime ici le choix ou la préférence sous une forme passive. « Sera préférée » rend naturellement en français la comparaison marquée par מִן, tout en conservant la formulation saisissante qui place « la mort » en tête.
- source_word: לְכֹל הַשְּׁאֵרִית הַנִּשְׁאָרִים
  choice: par tous ceux qui resteront
  rationale: Dans la construction passive française, לְ introduit naturellement l’agent. La combinaison de שְׁאֵרִית et du participe נִשְׁאָרִים désigne l’ensemble des survivants. Une traduction littérale comme « tout le reste qui restera » serait peu naturelle; « tous ceux qui resteront » en transmet clairement le sens sans donner ici à « reste » une valeur théologique automatiquement positive.
- source_word: מִן הַמִּשְׁפָּחָה הָרָעָה הַזֹּאת
  choice: de cette famille mauvaise
  rationale: מִשְׁפָּחָה peut désigner une famille, un clan ou un groupe apparenté. « Famille » reste assez large, tandis que « mauvaise » rend directement רָעָה sans préciser indûment la nature du mal.
- source_word: בְּכָל הַמְּקֹמוֹת הַנִּשְׁאָרִים
  choice: dans tous les lieux où ils se trouveront encore[a]
  rationale: La syntaxe hébraïque dit formellement « dans tous les lieux restants », expression difficile et ambiguë en français. Le contexte des survivants dispersés favorise une formulation qui les situe dans chaque lieu d’exil, tandis que la note conserve la forme littérale.
- source_word: אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: là où je les ai chassés
  rationale: Le hifil de נדח évoque l’action de repousser, disperser ou bannir. « Chassés » garde la force du jugement et le passé composé relie l’expulsion antérieure à leur situation présente.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclaration de Yahweh des armées
  rationale: נְאֻם est une formule prophétique solennelle, bien rendue par « déclaration de ». Le nom divin est translittéré « Yahweh », et צְבָאוֹת est conservé par le titre traditionnel et riche de sens « des armées ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre sans substituer un titre.
- issue: Valeur du « reste » dans שְׁאֵרִית
  choice: tous ceux qui resteront
  alternative: tout le reste / tous les survivants
  rationale: Dans ce contexte, le groupe restant demeure sous le jugement et ne représente pas nécessairement un reste porteur d’espérance. La formulation choisie conserve cette tension sans lui attribuer une signification doctrinale positive ou négative supplémentaire.
- issue: Préférence pour la mort
  choice: La mort sera préférée à la vie
  alternative: Ils choisiront la mort plutôt que la vie
  rationale: La forme passive de l’hébreu est maintenue. Le verset décrit l’extrémité de leur détresse sans expliciter le moyen par lequel la mort serait choisie.
translation_notes:
  register: Français international moderne, solennel mais accessible. L’ordre marqué « La mort… à la vie » et la voix passive préservent la force rhétorique de l’hébreu. « Déclaration de » garde le caractère oraculaire de la formule finale.
