  verdict: revise
  source_fidelity: La formulation principale actuelle déplace « restants » (הַנִּשְׁאָרִים), qui qualifie grammaticalement « lieux » (הַמְּקֹמוֹת), vers les exilés (« où ils se trouveront encore »). La note le reconnaît littéralement, mais l’explication donnée y rattache encore le terme aux survivants. La révision conserve l’étrangeté contrôlée de l’hébreu et l’explicite en note.
  naturalness: « Tous les survivants de cette mauvaise famille » est naturel et rend de manière condensée le double langage du reste et de ceux qui restent. « Les lieux restants » est un peu marqué en français, mais il est justifié ici par la fidélité à la construction source et clarifié par la note. « Yahweh, le Maître des armées » est plus idiomatique en français moderne que « Yahweh des armées », tout en conservant le titre.
  terminology: « La mort sera préférée à la vie » préserve la voix passive et la préférence comparative. « Survivants » convient dans ce contexte de jugement sans conférer au « reste » une valeur théologique positive. Le nom divin est conservé sous la forme « Yahweh ».
  issues:
  - severity: medium
    issue: Le second הַנִּשְׁאָרִים est rendu comme si les personnes, et non les lieux, « se trouvaient encore ».
    rationale: Dans בְּכָל הַמְּקֹמוֹת הַנִּשְׁאָרִים, le participe/adjectif est rattaché à « lieux ». La traduction et la note doivent préserver cette référence, même si l’expression est inhabituelle.
  - severity: low
    issue: La note actuelle explique la dispersion des survivants au lieu d’expliquer d’abord la qualification des lieux.
    rationale: La dispersion est bien le contexte, mais elle ne doit pas effacer l’ambiguïté ou la construction lexicale du texte hébreu.
  - severity: low
    issue: « Yahweh des armées » est un calque syntaxiquement lourd en français moderne.
    rationale: « Yahweh, le Maître des armées » rend naturellement le titre צְבָאוֹת sans réduction de sens.
  revised_text: La mort sera préférée à la vie par tous les survivants de cette mauvaise famille, dans tous les lieux restants[a] où je les ai chassés — déclaration de Yahweh, le Maître des armées.
