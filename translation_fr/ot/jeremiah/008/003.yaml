    reason: Préserve l’ancrage grammatical de הַנִּשְׁאָרִים à « lieux » et signale la formulation hébraïque difficile sans en imposer une interprétation supplémentaire.
  revision_rationale: Une correction est nécessaire parce que la version précédente transfère à tort la notion de « rester » des lieux aux exilés. La version révisée maintient la voix passive, le contraste mort/vie, le caractère collectif des survivants et la formule divine, tout en laissant la note traiter l’expression hébraïque inhabituelle.
