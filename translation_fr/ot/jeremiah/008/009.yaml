id: JER.8.9
reference: Jeremiah 8:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֹבִ֣ישׁוּ חֲכָמִ֔ים חַ֖תּוּ וַ/יִּלָּכֵ֑דוּ הִנֵּ֤ה בִ/דְבַר יְהוָה֙ מָאָ֔סוּ וְ/חָכְמַֽת מֶ֖ה לָ/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/009.yaml
  text: The wise men are put to shame; they are dismayed and captured. Look[a], they have rejected the word of Yahweh, so what wisdom do they have?
translation:
  language: fr
  text: 'Les sages sont couverts de honte ; ils sont consternés et capturés[a]. Voici, ils ont rejeté la parole de Yahweh : quelle sagesse ont-ils donc ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « saisis » ou « pris au piège ». Le verbe hébreu peut désigner le fait d’être capturé ou pris dans un piège.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: sont couverts de honte
  rationale: Cette tournure exprime une honte publique et une humiliation manifeste, plutôt qu’un simple sentiment intérieur.
- source_word: חֲכָמִים
  choice: les sages
  rationale: Le substantif désigne ici la classe reconnue des sages. En français, « les sages » est naturel et suffisamment précis dans ce contexte.
- source_word: חַתּוּ
  choice: sont consternés
  rationale: Le verbe évoque l’effondrement du courage et le désarroi ; « consternés » rend cet état avec dignité et concision.
- source_word: וַיִּלָּכֵדוּ
  choice: et pris au piège
  rationale: Le verbe לכד peut signifier saisir, capturer ou prendre au piège. Cette formulation conserve l’image d’un jugement auquel les sages ne peuvent échapper.
- source_word: הִנֵּה
  choice: omis comme marqueur explicite
  rationale: Dans cette phrase française, la ponctuation et l’enchaînement direct mettent naturellement en relief l’explication qui suit. Traduire mécaniquement par « voici » ou « voyez » serait moins idiomatique.
- source_word: בִדְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » convient au contexte prophétique et peut désigner à la fois la déclaration et l’enseignement révélé de Dieu.
- source_word: מָאָסוּ
  choice: ont rejeté
  rationale: Le verbe exprime une répudiation délibérée, et non une simple aversion émotionnelle.
- source_word: וְחָכְמַת מֶה לָהֶם
  choice: quelle sagesse ont-ils donc ?
  rationale: La question rhétorique nie qu’ils possèdent une véritable sagesse après avoir rejeté la parole divine. « Donc » rend la relation logique portée par la conjonction.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ; le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre, conformément à la convention du projet.
- issue: Nature de la sagesse attribuée aux sages
  choice: question rhétorique laissant entendre qu’ils n’ont aucune véritable sagesse
  alternative: question portant seulement sur le degré ou le type de leur sagesse
  rationale: Le rejet de la parole de Yahweh fonde la dénonciation, mais la traduction garde la forme interrogative du texte au lieu d’expliciter la conclusion.
translation_notes:
  register: Français international moderne, naturel et digne. La structure brève et accusatrice du verset est conservée, avec un point-virgule puis deux-points pour faire ressortir le lien entre le rejet de la parole divine et l’absence de sagesse.
