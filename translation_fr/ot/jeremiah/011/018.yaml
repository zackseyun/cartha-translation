source:
  edition: WLC
  text: וַֽ/יהוָ֥ה הֽוֹדִיעַ֖/נִי וָֽ/אֵדָ֑עָ/ה אָ֖ז הִרְאִיתַ֥/נִי מַעַלְלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/018.yaml
  text: And Yahweh made it known to me[a], and I knew; then you showed me their deeds.
translation:
  language: fr
  text: Yahweh me l’a fait savoir, et je l’ai su ; alors, tu m’as montré leurs actes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu passe de la troisième personne (« Yahweh ») à la deuxième (« tu m’as montré »), probablement parce que Jérémie s’adresse directement à Yahweh. Certaines traductions harmonisent ainsi : « il m’a montré ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré « Yahweh » conformément à la ligne éditoriale, tandis que le waw initial est rendu naturellement par l’enchaînement de la phrase plutôt que par un « et » lourd en français.
- source_word: הוֹדִיעַנִי
  choice: me l’a fait savoir
  rationale: Cette formulation conserve la valeur causative du hiphil de ידע. Le pronom « l’ » représente sobrement l’objet implicite en hébreu.
- source_word: וָאֵדָעָה
  choice: et je l’ai su
  rationale: Le « et » respecte la coordination hébraïque sans imposer une relation causale plus explicite que le texte. Le pronom « l’ » rend la phrase naturelle en français.
- source_word: אָז
  choice: alors
  rationale: « Alors » exprime ici avec naturel la succession temporelle indiquée par אָז.
- source_word: הִרְאִיתַנִי
  choice: tu m’as montré
  rationale: Le verbe est à la deuxième personne masculine singulière. Cette traduction préserve donc le passage soudain de la mention de Yahweh à l’adresse directe.
- source_word: מַעַלְלֵיהֶם
  choice: leurs agissements
  rationale: « Agissements » désigne des actes considérés dans leur portée morale, sans ajouter explicitement « mauvais », absent du texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération garde visible le nom propre de l’alliance présent dans le texte source.
- issue: Passage de la troisième à la deuxième personne pour parler à Dieu
  choice: Conserver « Yahweh… tu m’as montré »
  alternative: 'Harmoniser à la troisième personne : « Yahweh… il m’a montré »'
  rationale: Le texte massorétique passe explicitement du nom divin à un verbe à la deuxième personne. La traduction conserve cette transition rhétorique sans la lisser.
translation_notes:
  register: Français moderne, international et digne. La formulation reste proche de la structure hébraïque tout en étant intelligible à la lecture. Le point-virgule marque les deux temps de la révélation.
