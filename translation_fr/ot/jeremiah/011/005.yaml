  to: 'afin que j’accomplisse le serment que j’ai fait à vos pères[a] : leur donner un pays ruisselant de lait et de miel, comme c’est le cas aujourd’hui. » Et je répondis : « Amen, Yahweh[b]. »'
  rationale: La révision retire l’ajout interprétatif « on le voit » et restitue la valeur attestative de l’expression hébraïque par « comme c’est le cas aujourd’hui ». Elle adopte aussi une narration plus proche de la formule hébraïque, tout en restant naturelle en français. Les notes existantes sont exactes, nécessaires et leurs ancrages sont conservés.
