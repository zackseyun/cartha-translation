  text: לְמַעַן֩ הָקִ֨ים אֶת הַ/שְּׁבוּעָ֜ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֽוֹתֵי/כֶ֗ם לָ/תֵ֤ת לָ/הֶם֙ אֶ֣רֶץ זָבַ֥ת חָלָ֛ב וּ/דְבַ֖שׁ כַּ/יּ֣וֹם הַ/זֶּ֑ה וָ/אַ֥עַן וָ/אֹמַ֖ר אָמֵ֥ן יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/005.yaml
  text: so that I may establish the oath that I swore to your fathers[a], to give them a land flowing with milk and honey, as it is this day.” And I answered and said, “Amen[b], Yahweh.”
translation:
  language: fr
  text: 'afin que j’accomplisse le serment que j’ai fait à vos pères[a] : leur donner un pays ruisselant de lait et de miel, comme c’est le cas aujourd’hui. » Et je répondis : « Amen, Yahweh[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à vos ancêtres ». L’hébreu dit littéralement « à vos pères ».
    reason: lexical_alternative
  - marker: b
    text: « Yahweh » transcrit le nom divin YHWH, souvent rendu par « le SEIGNEUR » dans les traductions françaises.
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Rend naturellement en français la valeur de but, avec une possible nuance de résultat liée au contexte précédent.
- source_word: הָקִים
  choice: j’accomplisse
  rationale: Au hiphil avec « le serment » pour objet, le verbe exprime ici la mise à exécution ou l’accomplissement de ce qui a été juré; « accomplir un serment » est naturel et précis en français.
- source_word: הַשְּׁבוּעָה אֲשֶׁר נִשְׁבַּעְתִּי
  choice: le serment que j’ai fait
  rationale: Préserve la répétition sémantique hébraïque tout en employant la collocation française courante « faire un serment ».
- source_word: לַאֲבוֹתֵיכֶם
  choice: à vos pères
  rationale: Conserve le masculin explicite et l’écho probable aux pères d’Israël; une note signale la traduction plus générique possible.
- source_word: לָתֵת לָהֶם
  choice: leur donner
  rationale: Rend directement l’infinitif qui explicite le contenu du serment.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: un pays ruisselant de lait et de miel
  rationale: Expression française biblique claire qui conserve l’image d’abondance du participe hébreu.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme on le voit aujourd’hui
  rationale: Exprime le fait que la situation présente atteste l’accomplissement de la promesse, sans le calque peu naturel « comme en ce jour ».
- source_word: וָאַעַן וָאֹמַר
  choice: Alors j’ai répondu
  rationale: Le doublet narratif hébreu « j’ai répondu et j’ai dit » est condensé selon l’usage naturel du français, sans perte de contenu discursif.
- source_word: אָמֵן
  choice: Amen
  rationale: Conserve la réponse liturgique et affirmative sans imposer l’explicitation interprétative « ainsi soit-il ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Sens de הָקִים appliqué au serment
  choice: j’accomplisse le serment
  alternative: je confirme le serment / je mette à exécution le serment
  rationale: Le contexte concerne la réalisation historique de la promesse de donner le pays. « Accomplir » rend cette mise en œuvre sans réduire le verbe à une simple confirmation verbale.
- issue: Portée de לַאֲבוֹתֵיכֶם
  choice: vos pères
  alternative: vos ancêtres
  rationale: Le texte emploie le masculin pluriel et peut évoquer spécialement les pères auxquels la promesse du pays fut faite. La note maintient ouverte la portée généalogique plus large.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin; sa translittération le distingue d’un titre, tandis que la note indique la convention française fréquente.
- issue: Force de אָמֵן dans la réponse de Jérémie
  choice: Amen
  alternative: Ainsi soit-il
  rationale: « Amen » conserve l’ambivalence entre assentiment, confirmation et souhait d’accomplissement, au lieu de la résoudre par une paraphrase.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu, mais les formulations inutilement calquées sont évitées. Les marqueurs [a] et [b] figurent tous deux dans le texte.
