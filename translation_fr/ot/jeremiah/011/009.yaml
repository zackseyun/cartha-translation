id: JER.11.9
reference: Jeremiah 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י נִֽמְצָא קֶ֨שֶׁר֙ בְּ/אִ֣ישׁ יְהוּדָ֔ה וּ/בְ/יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/009.yaml
  text: And Yahweh said to me[b][a], “A conspiracy has been found among the men of Judah and among the inhabitants of Jerusalem.”
translation:
  language: fr
  text: 'Yahweh me dit : « Une conspiration a été découverte parmi les gens de Juda et les habitants de Jérusalem.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un complot a été découvert » ; le terme hébreu peut désigner une conspiration à caractère séditieux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: me dit
  rationale: Le wayyiqtol de אמר poursuit la narration. En français, le passé simple rend naturellement cette progression sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin יהוה, qui conserve ici sa valeur de nom propre plutôt que de lui substituer un titre.
- source_word: אֵלָי
  choice: me
  rationale: La préposition avec suffixe de première personne est rendue idiomatiquement par le pronom indirect français.
- source_word: נִמְצָא
  choice: a été découverte
  rationale: Le nifal accompli de מצא indique qu’une réalité a été trouvée ou mise au jour. Le passé composé exprime naturellement en français une découverte dont le constat demeure pertinent.
- source_word: קֶשֶׁר
  choice: une conspiration
  rationale: Dans ce contexte prophétique, קֶשֶׁר désigne un complot concerté, éventuellement séditieux. « Conspiration » en conserve la force sans préciser excessivement sa nature.
- source_word: בְּאִישׁ יְהוּדָה
  choice: parmi les gens de Juda
  rationale: איש, bien qu’au singulier, a ici un sens collectif. « Les gens de Juda » communique ce collectif de façon naturelle et inclusive en français, sans transformer Juda en simple indication géographique.
- source_word: וּבְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: et les habitants de Jérusalem
  rationale: Le participe substantivé de ישב désigne ceux qui résident dans la ville. Après « parmi », la coordination permet naturellement de ne pas répéter la préposition.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le Tétragramme comme nom propre. « Yahweh » le préserve au lieu de lui substituer le titre traditionnel.
- issue: Nature de קֶשֶׁר
  choice: conspiration
  alternative: complot séditieux
  rationale: Le contexte peut comporter une nuance de trahison ou de rébellion, mais le verset ne la définit pas explicitement. « Conspiration » préserve cette latitude.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient à la narration prophétique écrite ; « les gens de Juda » rend le singulier collectif hébreu sans lourdeur ni masculin générique explicite.
