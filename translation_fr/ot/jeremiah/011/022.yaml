  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י פֹקֵ֖ד עֲלֵי/הֶ֑ם הַ/בַּֽחוּרִים֙ יָמֻ֣תוּ בַ/חֶ֔רֶב בְּנֵי/הֶם֙ וּ/בְנ֣וֹתֵי/הֶ֔ם יָמֻ֖תוּ בָּ/רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/022.yaml
  text: 'Therefore thus says Yahweh of hosts: Behold[a], I am about to punish them. The young men will die by the sword; their sons and their daughters will die by famine.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle Yahweh des armées : « Voici que je vais les punir[a]. Les jeunes hommes mourront par l’épée ; leurs fils et leurs filles mourront de famine. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leur demander des comptes » ou « intervenir contre eux ». L’hébreu dit littéralement : « je vais visiter sur eux » ; dans ce contexte, le verbe désigne une intervention judiciaire, c’est-à-dire une punition.'
    reason: 'Alternative lexicale pour פֹקֵד עֲלֵיהֶם : le sens littéral de « visiter » serait obscur en français moderne, tandis que le contexte établit la portée judiciaire et punitive.'
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime clairement la conséquence tirée du contexte précédent, dans un français actuel et soutenu.
- source_word: כֹּה אָמַר
  choice: ainsi parle
  rationale: Conserve la formule solennelle du messager prophétique tout en restant naturelle en français biblique moderne.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Transcrit le nom divin et rend צְבָאוֹת sans limiter ces armées aux seules forces humaines.
- source_word: הִנְנִי פֹקֵד עֲלֵיהֶם
  choice: Voici que je vais leur demander des comptes
  rationale: « Voici que » marque l’insistance et l’imminence ; « demander des comptes » communique la portée judiciaire de פקד avec עַל sans recourir au calque français désormais opaque « les visiter ».
- source_word: הַבַּחוּרִים
  choice: Les jeunes hommes
  rationale: Désigne les hommes jeunes, vraisemblablement en âge de combattre, conformément au contexte de mort par l’épée.
- source_word: יָמֻתוּ בַחֶרֶב
  choice: mourront par l’épée
  rationale: Préserve l’image et la formule de jugement hébraïques désignant une mort violente.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: leurs fils et leurs filles
  rationale: Maintient la distinction explicite entre descendants masculins et féminins.
- source_word: יָמֻתוּ בָּרָעָב
  choice: mourront de famine
  rationale: רָעָב désigne ici la famine, non une simple sensation de faim ; la tournure est idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; sa transcription préserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Portée judiciaire de הִנְנִי פֹקֵד עֲלֵיהֶם
  choice: Voici que je vais leur demander des comptes
  alternative: Voici que je vais les punir ; voici que j’interviens contre eux
  rationale: Le contexte impose une action divine de jugement. La formulation retenue conserve l’idée de mise en cause et de responsabilité sans préciser au-delà du texte la forme exacte de la sanction.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique « ainsi parle » garde une cadence solennelle ; « Voici que je vais » exprime l’imminence sans archaïsme excessif. Le parallélisme entre l’épée et la famine est conservé.
