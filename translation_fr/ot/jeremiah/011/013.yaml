  text: כִּ֚י מִסְפַּ֣ר עָרֶ֔י/ךָ הָי֥וּ אֱלֹהֶ֖י/ךָ יְהוּדָ֑ה וּ/מִסְפַּ֞ר חֻצ֣וֹת יְרוּשָׁלִַ֗ם שַׂמְתֶּ֤ם מִזְבְּחוֹת֙ לַ/בֹּ֔שֶׁת מִזְבְּח֖וֹת לְ/קַטֵּ֥ר לַ/בָּֽעַל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/013.yaml
  text: For your gods[a], O Judah, have become as numerous as your cities; and as numerous as the streets of Jerusalem, you have set up altars to Shame[b], altars to make offerings to Baal.
translation:
  language: fr
  text: 'Car tes dieux, ô Juda, sont devenus aussi nombreux que tes villes ; et vous avez dressé autant d’autels qu’il y a de rues à Jérusalem : des autels pour la Honte[a], des autels pour faire fumer des offrandes en l’honneur de Baal[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « la Honte », désignation méprisante d’une divinité païenne, probablement Baal.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour brûler de l’encens en l’honneur de Baal ». Le verbe hébreu désigne souvent une offrande que l’on fait fumer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de ce qui précède et conserve la valeur explicative de la conjonction.
- source_word: מִסְפַּר עָרֶיךָ ... מִסְפַּר חֻצוֹת יְרוּשָׁלִַם
  choice: aussi nombreux que tes villes ... autant d’autels qu’il y a de rues à Jérusalem
  rationale: Rend naturellement en français la correspondance numérique exprimée deux fois par מִסְפַּר, sans perdre le parallélisme.
- source_word: הָיוּ אֱלֹהֶיךָ יְהוּדָה
  choice: tes dieux, Juda, sont devenus
  rationale: Le parfait de היה décrit ici l’état auquel on est arrivé ; « sont devenus » en exprime la nuance. « Juda » est conservé comme apostrophe directe.
- source_word: חֻצוֹת
  choice: rues
  rationale: Désigne ici les voies ou espaces publics de la ville ; « rues » est le terme moderne le plus accessible.
- source_word: שַׂמְתֶּם מִזְבְּחוֹת
  choice: vous avez dressé ... des autels
  rationale: Dans ce contexte cultuel, « dresser des autels » rend idiomatiquement l’action de les placer ou de les établir.
- source_word: לַבֹּשֶׁת
  choice: à la Honte
  rationale: בֹּשֶׁת signifie littéralement « honte » et sert ici de désignation méprisante d’une divinité païenne. La majuscule conserve son emploi quasi titulaire.
- source_word: לְקַטֵּר
  choice: pour faire brûler des offrandes
  rationale: Le verbe évoque la production de fumée dans un acte cultuel. Cette formulation garde une certaine largeur puisque l’objet brûlé n’est pas précisé dans l’hébreu, tandis que la possibilité de l’encens est signalée en note.
- source_word: לַבָּעַל
  choice: en l’honneur de Baal
  rationale: Exprime naturellement en français la destination cultuelle indiquée par la préposition hébraïque.
theological_decisions:
- issue: Passage d’une adresse au singulier à une adresse au pluriel
  choice: Conserver « tes ... Juda » puis « vous avez dressé »
  alternative: Uniformiser tout le verset au singulier ou tout au pluriel
  rationale: L’hébreu personnifie d’abord Juda au singulier, puis s’adresse collectivement à ses habitants au pluriel. Le maintien de ce changement respecte la tension grammaticale du texte source.
- issue: Interprétation de לַבֹּשֶׁת
  choice: Traduire par « la Honte » dans le texte
  alternative: Remplacer directement le terme par « Baal » ou traduire « la chose honteuse »
  rationale: Le texte hébreu emploie une désignation polémique signifiant « honte » plutôt que le nom propre de la divinité. La traduction conserve ce procédé, et la note indique l’identification probable.
- issue: Portée de לְקַטֵּר
  choice: Employer « faire brûler des offrandes » et signaler l’encens en note
  alternative: Traduire directement « brûler de l’encens »
  rationale: Le verbe se rapporte souvent à l’encens ou, plus largement, à une offrande produisant de la fumée, mais aucun objet n’est exprimé ici. La formulation principale évite de préciser davantage que l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme numérique est reformulé de manière idiomatique, tandis que l’apostrophe à Juda, le passage du singulier au pluriel et la désignation polémique « la Honte » sont conservés.
