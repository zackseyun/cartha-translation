    issue: Apostrophe à Juda insuffisamment marquée
    rationale: Dans « tes dieux, Juda », Juda peut se lire comme une simple apposition. « ô Juda » rend explicitement le vocatif hébreu.
  - severity: medium
    issue: « faire brûler des offrandes »
    rationale: Cette expression est peu naturelle et peut évoquer l’immolation ou le sacrifice entièrement brûlé. קטר renvoie plus précisément à l’action de faire monter une offrande en fumée, sans objet exprimé.
  - severity: low
    issue: « autels à la Honte »
    rationale: La construction est moins idiomatique en français pour des autels dédiés à une divinité ou entité cultuelle. « autels pour la Honte » préserve la destination sans expliciter davantage.
