source:
  edition: WLC
  text: וְ/אַתָּ֗ה אַל תִּתְפַּלֵּל֙ בְּעַד הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַל תִּשָּׂ֥א בַעֲדָ֖/ם רִנָּ֣ה וּ/תְפִלָּ֑ה כִּ֣י אֵינֶ֣/נִּי שֹׁמֵ֗עַ בְּ/עֵ֛ת קָרְאָ֥/ם אֵלַ֖/י בְּעַ֥ד רָעָתָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/014.yaml
  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, for I am not listening at the time when they call to me because of their disaster.
translation:
  language: fr
  text: Mais toi, ne prie pas pour ce peuple et n’élève en leur faveur ni cri ni prière, car je n’écoute pas au moment où ils m’appellent à cause de leur malheur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de leur calamité ». Le mot hébreu peut aussi signifier « mal » dans d’autres contextes, mais il désigne ici le malheur qui s’abat sur eux.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: La conjonction suivie du pronom indépendant introduit une adresse contrastive et emphatique à Jérémie. « Mais toi » rend ce changement de destinataire avec naturel.
- source_word: אַל תִּתְפַּלֵּל
  choice: ne prie pas
  rationale: La particule négative avec la forme verbale exprime une interdiction. « Prier » conserve le sens courant du verbe sans le restreindre à l’intercession.
- source_word: בְּעַד הָעָם הַזֶּה
  choice: pour ce peuple
  rationale: La préposition indique ici que la prière serait faite en faveur du peuple. Cette formulation est simple et naturelle en français.
- source_word: וְאַל תִּשָּׂא
  choice: et n’élève
  rationale: Le verbe נשׂא signifie littéralement « lever, porter ». « Élever un cri ou une prière » préserve l’image hébraïque tout en restant intelligible en français.
- source_word: בַעֲדָם
  choice: en leur faveur
  rationale: La préposition marque de nouveau l’idée d’intercession au bénéfice d’autrui.
- source_word: רִנָּה וּתְפִלָּה
  choice: ni cri ni prière
  rationale: רִנָּה désigne ici un appel vocal pressant plutôt qu’un chant joyeux. Après une interdiction, la tournure corrélative française « ni… ni… » rend naturellement les deux termes coordonnés.
- source_word: כִּי אֵינֶנִּי שֹׁמֵעַ
  choice: car je n’écoute pas
  rationale: Le participe négatif exprime le refus actuel de prêter attention et d’exaucer. « Je n’écoute pas » garde cette valeur active sans imposer un futur.
- source_word: בְּעֵת קָרְאָם אֵלַי
  choice: au moment où ils m’appellent
  rationale: La formulation explicite la valeur temporelle de בְּעֵת et rend naturellement la direction de l’appel vers Dieu.
- source_word: בְּעַד רָעָתָם
  choice: à cause de leur malheur
  rationale: Dans ce contexte, רָעָה désigne vraisemblablement la calamité qui pousse le peuple à appeler Dieu. « Malheur » conserve cependant une certaine amplitude lexicale et convient au registre prophétique.
theological_decisions:
- issue: Sens de רָעָה dans la proposition finale
  choice: malheur, au sens de calamité subie
  alternative: mal ou méchanceté morale
  rationale: La proposition décrit le moment où le peuple appelle Dieu sous l’effet du jugement qui l’atteint. Le contexte favorise donc une calamité subie plutôt que sa faute morale, tout en justifiant une note puisque le terme peut ailleurs désigner le mal.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme de l’interdiction hébraïque sans devenir artificielle. Le marqueur de note est placé après « malheur », le terme auquel la note se rapporte.
