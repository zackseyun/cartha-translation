base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/017.yaml
  text: And Yahweh of Armies[a], who planted you, has spoken disaster against you because of the evil of the house of Israel and the house of Judah, which they have done to themselves, provoking me to anger by making offerings to Baal.
translation:
  language: fr
  text: Et Yahvé des armées, qui t’a plantée, a prononcé le malheur contre toi à cause du mal que la maison d’Israël et la maison de Juda ont commis[a], pour provoquer ma colère en brûlant de l’encens pour Baal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu ajoute littéralement « pour elles » ou « à elles ». Cette expression peut indiquer leur intérêt, les conséquences pour elles-mêmes ou leur propre responsabilité ; elle peut aussi être comprise simplement comme « qu’elles ont commis ».
    reason: ambiguïté grammaticale et sémantique de לָהֶם
  - marker: b
    text: 'Ou : « en faisant fumer des offrandes pour Baal ». Le verbe hébreu désigne la production de fumée dans un rite, souvent en brûlant de l’encens.'
    reason: alternative lexicale pour לְקַטֵּר
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: Et Yahvé des armées
  rationale: Le nom divin est translittéré sous sa forme française courante « Yahvé », et צְבָאוֹת est rendu par « des armées », formulation moderne qui conserve la portée militaire et souveraine du titre.
- source_word: הַנּוֹטֵעַ אוֹתָךְ
  choice: qui t’a plantée
  rationale: La métaphore végétale du contexte immédiat est conservée. Le féminin « plantée » correspond au suffixe hébreu féminin singulier, qui renvoie à la communauté figurée par l’olivier du verset précédent.
- source_word: דִּבֶּר עָלַיִךְ רָעָה
  choice: a prononcé le malheur contre toi
  rationale: Ici רָעָה désigne le malheur annoncé comme jugement, non le mal moral. « Prononcé » garde la valeur déclarative de דִּבֶּר.
- source_word: רָעַת בֵּית יִשְׂרָאֵל וּבֵית יְהוּדָה
  choice: le mal que la maison d’Israël et la maison de Juda ont commis
  rationale: Dans cette seconde occurrence, la même racine désigne le mal moral. « Maison » préserve l’expression collective et familiale de l’hébreu.
- source_word: אֲשֶׁר עָשׂוּ לָהֶם
  choice: qu[’elles] ont commis pour elles-mêmes
  rationale: Le pronom לָהֶם est maintenu afin de ne pas effacer la nuance d’intérêt, de résultat ou de responsabilité personnelle, même si sa fonction exacte reste ambiguë.
- source_word: לְהַכְעִסֵנִי
  choice: elles m’ont irrité
  rationale: Le hifil exprime le fait de provoquer la colère. Une proposition coordonnée est plus naturelle en français qu’une accumulation de participes.
- source_word: לְקַטֵּר לַבָּעַל
  choice: en faisant brûler de l’encens pour Baal
  rationale: Le verbe קטר évoque précisément la production de fumée dans un acte cultuel, souvent par l’encens; la note conserve l’alternative plus large des offrandes fumigées.
theological_decisions:
- issue: Sens distinct de רָעָה et רָעַת dans le même verset
  choice: « le malheur » pour le jugement prononcé par Yahvé, puis « le mal » pour la conduite d’Israël et de Juda
  alternative: Employer « mal » aux deux endroits, ou « désastre » puis « méchanceté »
  rationale: La distinction française rend les deux sens contextuels de la même racine sans laisser entendre que Yahvé commettrait un mal moral, tout en maintenant l’écho lexical par la proximité de « malheur » et « mal ».
- issue: Portée de לָהֶם
  choice: « pour elles-mêmes » dans le texte, avec une note signalant l’ambiguïté
  alternative: Omettre le pronom en traduisant simplement « qu’elles ont commis », ou comprendre « contre elles-mêmes »
  rationale: L’hébreu marque explicitement un rapport à elles-mêmes, mais peut indiquer l’intérêt, le résultat ou la responsabilité plutôt qu’une action réflexive stricte. La note évite de trancher silencieusement.
- issue: Nature de l’acte cultuel envers Baal
  choice: « faisant brûler de l’encens pour Baal »
  alternative: « faisant fumer des offrandes pour Baal »
  rationale: Le sens le plus fréquent et le plus précis dans ce contexte idolâtre est l’encens, mais le verbe peut englober plus largement une offrande produisant de la fumée; cette possibilité est préservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore de la plantation, les expressions collectives « maison d’Israël » et « maison de Juda », ainsi que le contraste entre malheur judiciaire et mal moral sont conservés. Les reprises pronominales féminines traitent les deux « maisons » comme sujet collectif tout en restant naturelles en français.
