language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָֽלְכ֞וּ עָרֵ֣י יְהוּדָ֗ה וְ/יֹשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם וְ/זָֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֛ר הֵ֥ם מְקַטְּרִ֖ים לָ/הֶ֑ם וְ/הוֹשֵׁ֛עַ לֹֽא יוֹשִׁ֥יעוּ לָ/הֶ֖ם בְּ/עֵ֥ת רָעָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/012.yaml
  text: Then the cities of Judah and the inhabitants of Jerusalem will go and cry out to the gods to whom they burn incense[a], but they will certainly not save them in the time of their trouble.
translation:
  language: fr
  text: Alors les villes de Juda et les habitants de Jérusalem iront crier vers les dieux auxquels ils offrent de l’encens ; mais ceux-ci ne les sauveront en aucun cas au temps de leur malheur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de leur calamité » ou « de leur désastre ».
    reason: Alternative lexicale pour רָעָתָם, qui désigne ici le malheur subi.
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: Alors … iront
  rationale: Le parfait avec waw s’inscrit ici dans une séquence prophétique à valeur future. « Alors » exprime naturellement la conséquence dans le contexte.
- source_word: עָרֵי יְהוּדָה
  choice: les villes de Juda
  rationale: Traduction directe de la chaîne construite, tout en conservant la personnification collective du texte source.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: les habitants de Jérusalem
  rationale: Le participe désigne collectivement la population résidente ; « habitants » est courant et précis en français moderne.
- source_word: וְזָעֲקוּ אֶל
  choice: crier vers
  rationale: Le verbe זעק évoque un appel pressant lancé dans la détresse. « Crier vers » conserve à la fois l’intensité et la direction de l’appel.
- source_word: הָאֱלֹהִים
  choice: les dieux
  rationale: 'Le pluriel est imposé par le contexte immédiat : il s’agit des divinités auxquelles les Judéens rendent un culte.'
- source_word: אֲשֶׁר הֵם מְקַטְּרִים לָהֶם
  choice: auxquels ils font brûler de l’encens
  rationale: Cette formulation rend explicitement l’acte cultuel désigné par קטר, sans ajouter d’interprétation.
- source_word: וְהוֹשֵׁעַ לֹא יוֹשִׁיעוּ לָהֶם
  choice: mais ceux-ci ne les sauveront en aucun cas
  rationale: L’infinitif absolu suivi du verbe conjugué renforce ici la négation. « En aucun cas » restitue cette insistance en français naturel ; « ceux-ci » clarifie que le sujet est « les dieux ».
- source_word: בְּעֵת רָעָתָם
  choice: au temps de leur malheur
  rationale: Dans ce contexte, רָעָה désigne une détresse ou une calamité subie plutôt que le mal moral. « Malheur » est idiomatique et garde une certaine largeur de sens.
theological_decisions:
- issue: Référent de אֱלֹהִים
  choice: les faux dieux auxquels Juda et Jérusalem rendent un culte
  alternative: un dieu ou des êtres divins au sens générique
  rationale: La proposition relative mentionnant l’encens et le contexte polémique du passage identifient des divinités adorées par le peuple. Le texte traduit dit simplement « les dieux », sans ajouter le qualificatif interprétatif « faux ».
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la personnification des villes et l’insistance de la construction hébraïque, tout en clarifiant naturellement le changement de sujet par « ceux-ci ».
