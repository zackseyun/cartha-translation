  rationale: Révision limitée de l’expression de l’offrande d’encens afin d’obtenir une formulation française plus idiomatique et de préserver clairement la relation cultuelle exprimée par la préposition hébraïque. Le reste du texte, y compris l’emphase négative et l’ancre de note, est conservé.
