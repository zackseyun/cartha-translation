source:
  edition: WLC
  text: כִּי֩ הָעֵ֨ד הַעִדֹ֜תִי בַּ/אֲבֽוֹתֵי/כֶ֗ם בְּ/יוֹם֩ הַעֲלוֹתִ֨/י אוֹתָ֜/ם מֵ/אֶ֤רֶץ מִצְרַ֨יִם֙ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֔ה הַשְׁכֵּ֥ם וְ/הָעֵ֖ד לֵ/אמֹ֑ר שִׁמְע֖וּ בְּ/קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/007.yaml
  text: For I solemnly warned your fathers in the day I brought them up from the land of Egypt[a], and to this day, rising early and warning them, saying, ‘Listen to my voice.’
translation:
  language: fr
  text: 'Car j’ai solennellement averti vos pères le jour où je les ai fait monter du pays d’Égypte ; et, jusqu’à ce jour, je n’ai cessé de les avertir en disant : « Écoutez ma voix[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Obéissez à ma voix ». En hébreu, cette expression peut désigner une écoute qui se traduit par l’obéissance, particulièrement dans le cadre de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit naturellement en français la justification de l’affirmation précédente.
- source_word: הָעֵד הַעִדֹתִי
  choice: j’ai solennellement averti
  rationale: L’infinitif absolu associé au verbe conjugué renforce l’idée verbale ; dans ce contexte d’alliance, il s’agit d’un avertissement pressant et solennel.
- source_word: בַּאֲבוֹתֵיכֶם
  choice: vos pères
  rationale: Conserve le terme familial masculin et la formulation historique de l’alliance, plutôt que de généraliser par « vos ancêtres ».
- source_word: בְּיוֹם הַעֲלוֹתִי אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: depuis le jour où je les ai fait monter du pays d’Égypte
  rationale: Préserve l’expression traditionnelle de l’exode avec le factitif « faire monter », tout en reliant naturellement ce point de départ à « jusqu’à aujourd’hui ».
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: jusqu’à aujourd’hui
  rationale: Rend l’action continue depuis l’exode jusqu’au moment où parle le prophète.
- source_word: הַשְׁכֵּם וְהָעֵד
  choice: Sans relâche, je les ai avertis
  rationale: L’expression idiomatique évoque une action répétée, diligente et empressée. « Sans relâche » en transmet le sens dans un français naturel sans faire croire que le propos porte principalement sur l’heure matinale.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Formule française courante qui introduit le contenu de l’avertissement.
- source_word: שִׁמְעוּ בְּקוֹלִי
  choice: Écoutez ma voix
  rationale: Conserve l’image auditive de l’hébreu tout en laissant ouverte sa forte implication d’obéissance dans le cadre de l’alliance.
theological_decisions:
- issue: Portée d’alliance de שִׁמְעוּ בְּקוֹלִי
  choice: Écoutez ma voix
  alternative: Obéissez-moi
  rationale: La tournure hébraïque peut demander l’obéissance, mais sa forme demeure celle de l’écoute. Le texte principal conserve cette tension ; la note signale explicitement l’autre rendu possible.
translation_notes:
  register: Français international moderne, digne et accessible. La première phrase conserve la solennité et l’ancrage historique de l’hébreu ; « sans relâche » rend de façon idiomatique la persistance exprimée par l’image hébraïque du lever matinal. Le marqueur de note est placé après « ma voix », expression qu’il commente.
