    text: Ou « Obéissez à ma voix ». En hébreu, cette expression peut désigner une écoute qui se traduit par l’obéissance, particulièrement dans le cadre de l’alliance.
    reason: lexical_alternative
  revision_rationale: La révision rétablit explicitement la séquence temporelle de l’hébreu et rend הַשְׁכֵּם וְהָעֵד par une expression française idiomatique de l’avertissement continu, sans surinterpréter l’image du lever matinal. Elle conserve l’ambiguïté sémantique de שִׁמְעוּ בְּקוֹלִי dans le texte principal et dans la note.
