revisions:
- from: 'Car j’ai solennellement averti vos pères depuis le jour où je les ai fait monter du pays d’Égypte jusqu’à aujourd’hui. Sans relâche, je les ai avertis en disant : « Écoutez ma voix[a]. »'
  to: 'Car j’ai solennellement averti vos pères le jour où je les ai fait monter du pays d’Égypte ; et, jusqu’à ce jour, je n’ai cessé de les avertir en disant : « Écoutez ma voix[a]. »'
  rationale: La révision rétablit explicitement la séquence temporelle de l’hébreu et rend הַשְׁכֵּם וְהָעֵד par une expression française idiomatique de l’avertissement continu, sans surinterpréter l’image du lever matinal. Elle conserve l’ambiguïté sémantique de שִׁמְעוּ בְּקוֹלִי dans le texte principal et dans la note.
