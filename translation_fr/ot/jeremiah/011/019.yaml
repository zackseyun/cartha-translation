source:
  edition: WLC
  text: וַ/אֲנִ֕י כְּ/כֶ֥בֶשׂ אַלּ֖וּף יוּבַ֣ל לִ/טְב֑וֹחַ וְ/לֹֽא יָדַ֜עְתִּי כִּֽי עָלַ֣/י חָשְׁב֣וּ מַחֲשָׁב֗וֹת נַשְׁחִ֨יתָה עֵ֤ץ בְּ/לַחְמ/וֹ֙ וְ/נִכְרְתֶ֨/נּוּ֙ מֵ/אֶ֣רֶץ חַיִּ֔ים וּ/שְׁמ֖/וֹ לֹֽא יִזָּכֵ֥ר עֽוֹד־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/019.yaml
  text: 'But I was like a gentle lamb led to the slaughter[a], and I did not know that they had devised plans against me: ‘Let us destroy the tree with its food, and let us cut him off from the land of the living[b], so that his name will be remembered no more.’'
translation:
  language: fr
  text: 'Mais moi, j’étais comme un agneau docile qu’on mène pour être abattu[a]. Je ne savais pas qu’ils avaient conçu des projets contre moi : « Détruisons l’arbre avec sa nourriture[b] ; retranchons-le du pays des vivants, afin que son nom ne soit plus jamais rappelé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un agneau apprivoisé » ou « un agneau familier de l’être humain » ; le sens de l’adjectif hébreu est incertain.
    reason: lexical_alternative
  - marker: b
    text: Hébreu obscur ; littéralement, « l’arbre avec son pain/sa nourriture ». Beaucoup comprennent l’image comme la destruction totale de l’arbre avec son fruit ou ses produits.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֶבֶשׂ אַלּוּף
  choice: comme un agneau docile
  rationale: כֶּבֶשׂ désigne un agneau. Le sens de אַלּוּף est difficile ici, mais évoque vraisemblablement un animal apprivoisé, familier de l’être humain ou sans méfiance. « Docile » exprime naturellement sa vulnérabilité sans trancher entièrement la question lexicale, signalée en note.
- source_word: יוּבַל לִטְבוֹחַ
  choice: qu’on mène à l’abattoir
  rationale: La forme passive de יבל suivie de l’infinitif de טבח exprime le fait d’être mené pour être abattu. Cette formulation française conserve l’image tout en restant naturelle.
- source_word: וְלֹא יָדַעְתִּי
  choice: Je ne savais pas
  rationale: Traduction directe du parfait à la première personne ; elle souligne l’ignorance du prophète sans ajouter d’interprétation.
- source_word: חָשְׁבוּ מַחֲשָׁבוֹת
  choice: ils avaient conçu des projets
  rationale: Le verbe et le nom apparentés insistent sur une action délibérée. « Concevoir des projets » rend cette intention en français naturel, tandis que « contre moi » en indique le caractère hostile.
- source_word: נַשְׁחִיתָה
  choice: Détruisons
  rationale: Le cohortatif à la première personne du pluriel introduit la parole des conspirateurs. « Détruisons » convient au contexte meurtrier.
- source_word: עֵץ בְּלַחְמוֹ
  choice: l’arbre avec sa nourriture
  rationale: La locution est obscure. לֶחֶם signifie normalement « pain » ou, plus largement, « nourriture ». Le rendu conserve cette difficulté au lieu de substituer silencieusement « fruit », interprétation possible mais non certaine.
- source_word: וְנִכְרְתֶנּוּ
  choice: retranchons-le
  rationale: כרת signifie « couper, retrancher ». En français, le pronom « le » maintient le passage métaphorique de l’arbre à la personne visée, que la suite identifie par « son nom ».
- source_word: מֵאֶרֶץ חַיִּים
  choice: du pays des vivants
  rationale: Expression hébraïque désignant le monde de ceux qui vivent. « Pays des vivants » est exact, clair et idiomatique dans un registre biblique actuel.
- source_word: וּשְׁמוֹ לֹא יִזָּכֵר עוֹד
  choice: afin qu’on ne se souvienne plus de son nom
  rationale: Le niphal de זכר peut signifier « être rappelé », « être mentionné » ou « être gardé en mémoire ». La formulation choisie exprime l’effacement recherché tout en restant naturelle.
theological_decisions:
- issue: Portée de la métaphore violente dans le discours des conspirateurs
  choice: Présenter le verset comme le témoignage de Jérémie au sujet d’un complot contre sa vie, sans ajouter d’interprétation messianique dans le texte.
  alternative: Lire principalement l’agneau mené à l’abattoir comme une prophétie typologique de la passion du Christ.
  rationale: Le contexte immédiat concerne Jérémie et le projet de ses adversaires. Une lecture typologique ultérieure peut exister, mais elle ne doit pas être introduite dans la traduction au-delà de ce qu’affirme l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation distingue clairement le témoignage du prophète et les paroles des conspirateurs. Le choix « nourriture » conserve l’étrangeté réelle de l’hébreu, explicitée en note, tandis que « retranchons-le » maintient le mouvement métaphorique sans l’aplanir.
