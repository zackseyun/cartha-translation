  text: זַ֤יִת רַֽעֲנָן֙ יְפֵ֣ה פְרִי תֹ֔אַר קָרָ֥א יְהוָ֖ה שְׁמֵ֑/ךְ לְ/ק֣וֹל הֲמוּלָּ֣ה גְדֹלָ֗ה הִצִּ֥ית אֵשׁ֙ עָלֶ֔י/הָ וְ/רָע֖וּ דָּלִיּוֹתָֽי/ו־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/016.yaml
  text: The LORD called your name, ‘A green olive tree, beautiful with good fruit.’ At the sound of a great roar he set fire to it, and its branches are ruined.
translation:
  language: fr
  text: 'Le SEIGNEUR t’a appelée : « Olivier verdoyant, beau par ses fruits et son apparence. » Au bruit d’un grand tumulte, il y a mis le feu, et ses branches ont été détruites.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ses branches se sont brisées » ; le sens exact du verbe hébreu est incertain.'
    reason: La forme rare וְרָעוּ peut désigner la ruine ou la détérioration des branches ; « détruites » est retenu dans le texte, sans préciser le mécanisme.
lexical_decisions:
- source_word: זַיִת רַעֲנָן
  choice: olivier verdoyant
  rationale: L’expression désigne un olivier luxuriant, frais et vigoureux ; « verdoyant » conserve l’image poétique avec naturel.
- source_word: יְפֵה פְרִי תֹאַר
  choice: beau et chargé de fruits magnifiques
  rationale: La construction hébraïque est dense et légèrement incertaine, associant beauté, fruit et apparence. Cette formulation française préserve les deux idées principales sans produire une syntaxe obscure.
- source_word: קָרָא יְהוָה שְׁמֵךְ
  choice: Le SEIGNEUR t’avait appelée
  rationale: Littéralement, « le SEIGNEUR avait appelé ton nom ». En français naturel, « t’avait appelée » exprime l’attribution de ce nom métaphorique ; le féminin correspond à l’image de l’entité comparée à l’olivier.
- source_word: לְקוֹל הֲמוּלָּה גְדֹלָה
  choice: au bruit d’un grand fracas
  rationale: הֲמוּלָּה peut évoquer un tumulte, un grondement ou un grand bruit. « Fracas » convient au contexte de destruction tout en gardant la force auditive de l’expression.
- source_word: וְרָעוּ דָּלִיּוֹתָיו
  choice: ses branches ont été ravagées
  rationale: Le verbe rare dans cette forme décrit la détérioration ou la destruction des branches. « Ravagées » conserve cette portée sans préciser abusivement le mécanisme exact.
theological_decisions:
- issue: Sujet de « il y a mis le feu »
  choice: Le pronom « il » renvoie naturellement au SEIGNEUR
  alternative: Laisser entendre qu’un ennemi ou le tumulte lui-même met le feu
  rationale: Le seul agent masculin explicite du verset est le SEIGNEUR, et le contexte immédiat présente le jugement comme son action. Le pronom maintient toutefois la sobriété de l’hébreu.
- issue: Valeur temporelle de קָרָא
  choice: 'plus-que-parfait : « t’avait appelée »'
  alternative: 'passé composé : « t’a appelée »'
  rationale: Le contexte oppose le nom favorable autrefois donné à l’olivier et le jugement qui vient ensuite ; le plus-que-parfait rend clairement ce contraste narratif sans en changer le sens.
translation_notes:
  register: Français moderne, international et digne. La métaphore de l’olivier reste vive, tandis que la syntaxe hébraïque compacte est rendue de façon intelligible. Le tétragramme est traduit selon la convention française courante par « le SEIGNEUR ».
