revisions:
- from: Le SEIGNEUR t’avait appelée « olivier verdoyant, beau et chargé de fruits magnifiques ». Mais au bruit d’un grand fracas, il y a mis le feu, et ses branches ont été ravagées.[a]
  to: 'Le SEIGNEUR t’a appelée : « Olivier verdoyant, beau par ses fruits et son apparence. » Au bruit d’un grand tumulte, il y a mis le feu, et ses branches ont été détruites.[a]'
  rationale: La révision supprime les ajouts interprétatifs (« Mais », « magnifiques »), rend les deux éléments de יפה פרי תאר par « ses fruits et son apparence », et emploie un temps français qui ne surinterprète pas la chronologie. Elle conserve l’ambiguïté du verbe final au moyen d’une note ancrée sur l’expression concernée.
