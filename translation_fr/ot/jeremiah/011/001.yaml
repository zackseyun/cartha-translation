id: JER.11.1
reference: Jeremiah 11:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/001.yaml
  text: The word that came to Jeremiah from Yahweh[a], saying,
translation:
  language: fr
  text: 'La parole[a] qui parvint à Jérémie de la part de Yahvé, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : Le message.'
    reason: דָּבָר peut désigner aussi bien une « parole » qu’un « message » dans ce contexte prophétique.
lexical_decisions:
- source_word: הַדָּבָר
  choice: La parole
  rationale: Dans cette formule prophétique, דָּבָר désigne la parole communiquée par Dieu. « La parole » conserve la formulation traditionnelle et l’amplitude du terme hébreu, tandis que « le message » reste possible.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: qui parvint à
  rationale: Littéralement, la parole « fut/vint vers » Jérémie. « Parvint à » rend naturellement en français l’idée qu’elle lui fut communiquée, sans effacer l’image dynamique de l’hébreu.
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: Forme française usuelle du nom du prophète.
- source_word: מֵאֵת
  choice: de la part de
  rationale: La locution marque ici l’origine de la parole et se rend idiomatiquement par « de la part de ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin יהוה, qui préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: L’infinitif introduit les paroles qui suivent. « En ces termes » est une tournure française naturelle qui signale clairement la continuation du discours au verset suivant.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme, nom propre du Dieu d’Israël. « Yahvé » le représente directement; « le SEIGNEUR » refléterait la tradition de lecture substitutive.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la structure d’introduction prophétique tout en remplaçant le littéral peu naturel « disant » par « en ces termes », qui appelle la suite du passage.
