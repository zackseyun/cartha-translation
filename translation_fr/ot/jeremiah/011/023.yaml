source:
  edition: WLC
  text: וּ/שְׁאֵרִ֕ית לֹ֥א תִֽהְיֶ֖ה לָ/הֶ֑ם כִּֽי אָבִ֥יא רָעָ֛ה אֶל אַנְשֵׁ֥י עֲנָת֖וֹת שְׁנַ֥ת פְּקֻדָּתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/023.yaml
  text: And no remnant will remain for them[a], for I will bring disaster on the men of Anathoth in the year of their punishment.
translation:
  language: fr
  text: Et il ne leur restera aucun survivant, car je ferai venir le malheur sur les hommes d’Anatoth, l’année de leur châtiment.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’année de leur visitation ». Le terme hébreu peut désigner une visitation, une intervention ou un châtiment ; dans ce contexte de jugement, il a un sens punitif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאֵרִית לֹא תִהְיֶה לָהֶם
  choice: Et il ne restera parmi eux aucun survivant
  rationale: שְׁאֵרִית désigne ce qui subsiste, notamment les survivants. « Aucun survivant » exprime naturellement en français l’absence totale de reste humain, tandis que « parmi eux » rend l’idée de לָהֶם dans ce contexte.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison du jugement annoncé et se rend naturellement par « car ».
- source_word: אָבִיא רָעָה
  choice: je ferai venir le malheur
  rationale: Le hiphil de בוא signifie « faire venir » ou « amener ». Dans cet oracle de jugement, רָעָה désigne un malheur infligé plutôt que le mal moral.
- source_word: אֶל אַנְשֵׁי עֲנָתוֹת
  choice: sur les hommes d’Anatoth
  rationale: אַנְשֵׁי signifie littéralement « hommes de ». Le contexte immédiat vise les hommes d’Anatoth qui complotent contre Jérémie; « sur » s’accorde avec l’expression française « faire venir le malheur sur ».
- source_word: שְׁנַת פְּקֻדָּתָם
  choice: l’année où je leur demanderai des comptes
  rationale: פְּקֻדָּה peut évoquer une intervention, une visite ou, dans ce contexte judiciaire, le moment où Dieu demande des comptes. Cette formulation française conserve l’idée punitive sans réduire le terme à une notion abstraite.
theological_decisions:
- issue: Sens de רָעָה lorsque Dieu fait venir le jugement
  choice: le malheur
  alternative: le mal ; le désastre
  rationale: Le contexte indique une calamité judiciaire, non un mal moral. « Malheur » préserve le caractère néfaste de l’événement sans attribuer à Dieu le mal moral.
- issue: Portée de אַנְשֵׁי עֲנָתוֹת
  choice: les hommes d’Anatoth
  alternative: les habitants d’Anatoth
  rationale: Le nom hébreu est explicitement masculin et le contexte mentionne les hommes qui conspirent contre Jérémie. La traduction conserve cette précision plutôt que de généraliser.
- issue: Valeur de פְּקֻדָּה
  choice: le moment où Dieu leur demandera des comptes
  alternative: leur châtiment ; leur visitation
  rationale: Le terme garde l’idée d’une intervention divine ayant ici une portée punitive. La note signale l’alternative plus formelle afin de préserver l’étendue sémantique de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. « Aucun survivant » est plus idiomatique que « aucun reste » dans ce contexte humain. La tournure « demander des comptes » rend clairement la force judiciaire de פְּקֻדָּה, tandis que la note conserve son sens plus littéral et son ambiguïté lexicale.
