id: JER.11.2
reference: Jeremiah 11:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁמְע֕וּ אֶת דִּבְרֵ֖י הַ/בְּרִ֣ית הַ/זֹּ֑את וְ/דִבַּרְתָּ/ם֙ אֶל אִ֣ישׁ יְהוּדָ֔ה וְ/עַל יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/002.yaml
  text: Hear the words of this covenant[a], and speak them to the men of Judah and to the inhabitants of Jerusalem.
translation:
  language: fr
  text: Écoutez les paroles de cette alliance et dites-les aux gens de Juda[a] et aux habitants de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à chaque homme de Juda »; l’expression hébraïque peut avoir un sens collectif ou distributif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: Impératif qal pluriel de שׁמע. « Écoutez » exprime une écoute attentive sans expliciter excessivement la nuance possible d’obéissance.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: les paroles de cette alliance
  rationale: « Paroles » rend directement le pluriel construit דִּבְרֵי, et « alliance » est le terme français courant dans ce contexte biblique pour בְּרִית.
- source_word: וְדִבַּרְתָּם
  choice: et dites-les
  rationale: La forme piel, avec suffixe masculin pluriel, poursuit l’ordre donné et renvoie aux « paroles »; « dites-les » est naturel en français et conserve l’objet explicite.
- source_word: אֶל אִישׁ יְהוּדָה
  choice: aux gens de Juda
  rationale: אִישׁ est ici un singulier collectif ou distributif. « Aux gens de Juda » en restitue naturellement la portée collective en français, tandis qu’une note signale la forme littérale.
- source_word: וְעַל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: et aux habitants de Jérusalem
  rationale: Dans le parallélisme avec אֶל, עַל désigne ici les destinataires de la parole. Le participe substantivé יֹשְׁבֵי est rendu par « habitants ».
theological_decisions:
- issue: Portée collective ou distributive de אִישׁ יְהוּדָה
  choice: aux gens de Juda
  alternative: à chaque homme de Juda
  rationale: Le singulier אִישׁ peut avoir une valeur collective ou distributive. Le texte principal adopte une formulation française naturelle sans limiter indûment le groupe aux seuls hommes adultes; la note conserve l’expression plus littérale et l’ambiguïté de portée.
translation_notes:
  register: Français moderne, clair et digne. L’impératif pluriel « Écoutez » est maintenu, tandis que le second ordre, adressé au singulier dans l’hébreu, reste naturellement formulé sans expliciter son destinataire.
