source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קְרָ֨א אֶת כָּל הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֥וֹת יְרוּשָׁלִַ֖ם לֵ/אמֹ֑ר שִׁמְע֗וּ אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/006.yaml
  text: 'And Yahweh said to me[a], “Proclaim all these words in the cities of Judah and in the streets of Jerusalem[b], saying: Hear the words of this covenant and do them.”'
translation:
  language: fr
  text: 'Yahweh me dit : « Proclame toutes ces paroles dans les villes de Juda et sur les places de Jérusalem[a] : Écoutez les paroles de cette alliance et mettez-les en pratique[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les rues de Jérusalem » ; le mot hébreu désigne des espaces publics ouverts de la ville.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et faites-les ».'
    reason: literal_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: קְרָא
  choice: Proclame
  rationale: L’impératif demande une déclaration publique ; « proclame » en exprime naturellement la portée.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: Dans ce contexte prophétique, דְּבָרִים désigne les paroles du message et fait écho aux « paroles de cette alliance ».
- source_word: בְּעָרֵי יְהוּדָה
  choice: dans les villes de Juda
  rationale: Rend directement la localisation et conserve la désignation géographique.
- source_word: וּבְחֻצוֹת יְרוּשָׁלִַם
  choice: et sur les places de Jérusalem
  rationale: חֻצוֹת désigne ici les espaces publics ouverts de la ville ; « places » rend clairement ce cadre de proclamation publique.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement le contenu de la proclamation sans le calque pesant « en disant ».
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: Conserve le sens premier de l’impératif et distingue l’écoute de la mise en pratique exprimée ensuite.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: les paroles de cette alliance
  rationale: Préserve le lien lexical avec les « paroles » précédentes et le cadre explicite de l’alliance.
- source_word: וַעֲשִׂיתֶם אוֹתָם
  choice: et mettez-les en pratique
  rationale: Exprime idiomatiquement en français l’action d’accomplir les paroles de l’alliance, tout en maintenant la distinction avec l’écoute.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le choix conserve le nom personnel présent dans l’hébreu, sans lui substituer un titre.
- issue: Portée de שִׁמְעוּ
  choice: Écoutez… et mettez-les en pratique
  alternative: Obéissez aux paroles de cette alliance
  rationale: Le texte distingue l’écoute de l’action. Traduire le premier verbe par « obéir » effacerait cette progression et ferait double emploi avec le second.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure hébraïque, tandis que « mettez-les en pratique » et l’emploi des deux-points assurent un français naturel.
