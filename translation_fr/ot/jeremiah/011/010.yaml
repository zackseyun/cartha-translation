    issue: « Eux aussi » interprète l’emphase de וְהֵמָּה comme une addition explicite.
    rationale: Le contexte établit bien un parallèle avec les ancêtres, mais le pronom indépendant hébreu met principalement en relief le sujet (« eux-mêmes »). Cette formulation conserve l’emphase sans ajouter « aussi » au texte.
  revised_text: Ils sont retombés dans les fautes de leurs ancêtres d’autrefois[a], qui avaient refusé d’écouter mes paroles. Eux-mêmes ont suivi d’autres dieux pour les servir. La maison d’Israël et la maison de Juda ont rompu mon alliance, celle que j’avais conclue avec leurs ancêtres.
