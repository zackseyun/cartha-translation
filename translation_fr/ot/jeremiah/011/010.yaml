source:
  edition: WLC
  text: שָׁ֩בוּ֩ עַל עֲוֺנֹ֨ת אֲבוֹתָ֜/ם הָ/רִֽאשֹׁנִ֗ים אֲשֶׁ֤ר מֵֽאֲנוּ֙ לִ/שְׁמ֣וֹעַ אֶת דְּבָרַ֔/י וְ/הֵ֣מָּה הָלְכ֗וּ אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָ֑/ם הֵפֵ֤רוּ בֵֽית יִשְׂרָאֵל֙ וּ/בֵ֣ית יְהוּדָ֔ה אֶת בְּרִיתִ֕/י אֲשֶׁ֥ר כָּרַ֖תִּי אֶת אֲבוֹתָֽ/ם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/010.yaml
  text: They have returned to the iniquities of their first fathers[a], who refused to hear my words, and they themselves have gone after other gods to serve them[c][b]. The house of Israel and the house of Judah have broken my covenant that I made with their fathers.
translation:
  language: fr
  text: Ils sont retombés dans les fautes de leurs ancêtres d’autrefois[a], qui avaient refusé d’écouter mes paroles. Eux-mêmes ont suivi d’autres dieux pour les servir. La maison d’Israël et la maison de Juda ont rompu mon alliance, celle que j’avais conclue avec leurs ancêtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leurs premiers pères » ; il s’agit de leurs ancêtres des générations antérieures.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ עַל עֲוֺנֹת
  choice: sont retombés dans les fautes
  rationale: L’expression décrit le retour à une conduite coupable antérieure. « Retomber dans » exprime naturellement cette rechute, tandis que « fautes » conserve ici la portée morale de עָוֹן sans limiter le mot à la seule culpabilité juridique.
- source_word: אֲבוֹתָם הָרִאשֹׁנִים
  choice: leurs ancêtres d’autrefois
  rationale: Le syntagme désigne les générations antérieures. Cette formulation française est naturelle et rend la valeur temporelle de רִאשֹׁנִים sans l’étrangeté de « premiers pères ».
- source_word: מֵאֲנוּ לִשְׁמוֹעַ אֶת דְּבָרַי
  choice: avaient refusé d’écouter mes paroles
  rationale: מָאֵן signifie « refuser ». Dans ce contexte, שׁמע implique une écoute attentive pouvant mener à l’obéissance; « écouter » préserve cette amplitude mieux que le simple « entendre ».
- source_word: וְהֵמָּה
  choice: Eux aussi
  rationale: Le pronom indépendant marque les membres de la génération présente et souligne qu’ils reproduisent eux-mêmes la conduite de leurs ancêtres. « Aussi » explicite le parallèle contextuel sans alourdir le français.
- source_word: הָלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: ont suivi d’autres dieux
  rationale: הלך אחרי est un idiome d’allégeance. « Suivre » en donne le sens naturel tout en conservant l’image directrice.
- source_word: לְעָבְדָם
  choice: pour les servir
  rationale: עבד désigne le service rendu à ces divinités et comporte dans ce contexte une dimension cultuelle. « Servir » en demeure l’équivalent direct.
- source_word: בֵּית יִשְׂרָאֵל וּבֵית יְהוּדָה
  choice: La maison d’Israël et la maison de Juda
  rationale: La répétition de « maison » conserve la formulation collective et dynastico-covenantale de l’hébreu.
- source_word: הֵפֵרוּ אֶת בְּרִיתִי
  choice: ont rompu mon alliance
  rationale: Dans un contexte d’alliance, le hiphil de פרר signifie rompre ou violer. « Rompre une alliance » est idiomatique et précis en français.
- source_word: אֲשֶׁר כָּרַתִּי אֶת אֲבוֹתָם
  choice: celle que j’avais conclue avec leurs ancêtres
  rationale: Le français dit naturellement « conclure une alliance », là où l’hébreu emploie littéralement « couper ». Le plus-que-parfait situe clairement cette conclusion avant la rupture actuelle.
theological_decisions:
- issue: Continuité entre la rébellion présente, celle des ancêtres et l’alliance
  choice: Le texte présente la génération actuelle comme retombant dans les fautes anciennes et rompant l’alliance conclue avec ses ancêtres.
  alternative: Traiter l’alliance comme un simple fait historique sans implication pour la génération présente.
  rationale: L’hébreu relie explicitement la rechute actuelle aux fautes des générations antérieures et à l’alliance conclue avec les ancêtres. La traduction maintient ce lien sans préciser davantage la nature théologique de cette continuité.
- issue: Portée de שׁמע
  choice: « écouter », qui peut inclure l’accueil obéissant sans l’imposer explicitement
  alternative: « obéir », qui rendrait explicite une nuance contextuelle mais réduirait l’ambiguïté lexicale
  rationale: Le verbe peut aller de l’audition à l’écoute obéissante. « Écouter » préserve cette tension sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. « Ancêtres » évite l’ambiguïté actuelle de « pères »; « retombés » rend idiomatiquement l’idée d’un retour à une ancienne conduite. Le seul appel de note [a] figure bien dans le texte.
