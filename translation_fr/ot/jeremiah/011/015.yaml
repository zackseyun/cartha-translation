revisions:
- from: Quel droit ma bien-aimée a-t-elle d’être dans ma maison[a], alors qu’elle met à exécution ses nombreux projets criminels ? La viande consacrée[b] peut-elle éloigner de toi ta méchanceté[c] ? Alors, tu exultes !
  to: Quel droit a ma bien-aimée dans ma maison[a], elle qui accomplit ses nombreuses machinations ? La viande consacrée[b] peut-elle éloigner de toi ton mal[c] ? Alors, tu exulteras !
  rationale: La révision conserve la lecture interprétative, également suivie dans l’audit anglais, selon laquelle la viande sacrificielle ne peut écarter le mal de Juda. Elle évite cependant de présenter « méchanceté » comme le seul sens possible de רָעָה et corrige la note afin qu’elle distingue plus nettement le texte hébreu difficile de son interprétation. « Machinations » évite l’anachronisme juridique de « projets criminels » tout en gardant la force négative du contexte.
  reviewer_model: gpt-5.6-terra
