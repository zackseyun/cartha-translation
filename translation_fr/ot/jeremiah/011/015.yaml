    rationale: Le texte hébreu porte littéralement « et [de] la chair consacrée passeront de dessus toi » avec un verbe pluriel et sans objet explicite. Il faut signaler plus clairement que la relation de « ton mal » au verbe est une interprétation, non une formulation explicite du texte.
