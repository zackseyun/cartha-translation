  text: מֶ֣ה לִֽ/ידִידִ֞/י בְּ/בֵיתִ֗/י עֲשׂוֹתָ֤/הּ הַֽ/מְזִמָּ֨תָ/ה֙ הָֽ/רַבִּ֔ים וּ/בְשַׂר קֹ֖דֶשׁ יַעַבְר֣וּ מֵֽ/עָלָ֑יִ/ךְ כִּ֥י רָעָתֵ֖/כִי אָ֥ז תַּעֲלֹֽזִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/015.yaml
  text: What right has my beloved in my house[c][b][a], when she has done her many wicked schemes? Can holy flesh remove your evil from you? Then you rejoice!
translation:
  language: fr
  text: Quel droit a ma bien-aimée dans ma maison[a], elle qui accomplit ses nombreuses machinations ? La viande consacrée[b] peut-elle éloigner de toi ton mal[c] ? Alors, tu exulteras !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Que vient faire ma bien-aimée dans ma maison ? » La « maison » désigne ici le temple du Seigneur.'
    reason: lexical_alternative
  - marker: b
    text: La « viande consacrée » désigne vraisemblablement de la viande provenant des sacrifices.
    reason: cultural_note
  - marker: c
    text: 'L’hébreu de la fin du verset est difficile et sa syntaxe est incertaine. Littéralement, il dit approximativement : « et la chair consacrée passera de dessus toi, car ton mal — alors tu exulteras ». Le texte ne précise pas explicitement ce qui s’éloigne. « Ton mal » peut désigner soit ta méchanceté, soit le malheur qui te menace.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֶה לִידִידִי בְּבֵיתִי
  choice: Quel droit ma bien-aimée a-t-elle d’être dans ma maison
  rationale: La tournure idiomatique מֶה לְ... בְּ... exprime une contestation du droit ou de la place de quelqu’un. « Quel droit… ? » restitue sa force rhétorique, tandis que « ma maison » conserve l’image hébraïque qui désigne ici le temple.
- source_word: עֲשׂוֹתָהּ הַמְזִמָּתָה הָרַבִּים
  choice: alors qu’elle met à exécution ses nombreux projets criminels
  rationale: La syntaxe hébraïque est difficile. מְזִמָּה désigne ici des projets moralement condamnables; « mettre à exécution » rend l’idée de עשה appliqué à des projets, et « nombreux » représente רַבִּים.
- source_word: וּבְשַׂר קֹדֶשׁ
  choice: La viande consacrée
  rationale: L’expression désigne vraisemblablement la viande provenant des sacrifices. « Viande consacrée » est plus naturel en français actuel que « chair sainte », tout en conservant le caractère cultuel.
- source_word: יַעַבְרוּ מֵעָלָיִךְ
  choice: peut-elle éloigner de toi
  rationale: עבר signifie fondamentalement « passer »; avec מֵעַל, le contexte permet l’idée de faire disparaître ou d’éloigner. La formulation interrogative exprime la vanité du recours au rite sans repentance.
- source_word: רָעָתֵכִי
  choice: ta méchanceté
  rationale: רָעָה peut désigner le mal moral ou le malheur. Le contexte immédiat d’inconduite et de confiance abusive dans le culte favorise ici le sens moral, sans que l’ambiguïté textuelle soit dissimulée dans la note.
- source_word: תַּעֲלֹזִי
  choice: tu exultes
  rationale: Le verbe עלז exprime une joie vive, voire triomphante. « Exulter » conserve cette intensité et l’ironie mordante de l’accusation.
theological_decisions:
- issue: Identité de « ma bien-aimée »
  choice: Conserver l’expression comme désignation ironique de Juda ou Jérusalem, peuple lié à Dieu par l’alliance.
  alternative: Comprendre l’expression comme visant une adoratrice individuelle ou la communauté du temple sans nuance ironique.
  rationale: Les formes féminines du verset conviennent à Juda ou Jérusalem personnifiée. Garder « ma bien-aimée » préserve la tension entre l’affection liée à l’alliance et l’infidélité dénoncée.
- issue: Portée de la viande consacrée
  choice: Présenter la phrase comme une question niant que la participation au sacrifice puisse ôter la méchanceté persistante.
  alternative: Y voir une allusion générale au culte du temple, ou considérer le texte comme trop incertain pour préciser le rapport logique.
  rationale: La proximité entre la viande consacrée et רָעָתֵכִי soutient une critique de la confiance placée dans le rite. La traduction conserve cependant l’image sacrificielle plutôt que de la remplacer par une explication doctrinale.
- issue: Sens de רָעָתֵכִי
  choice: Le comprendre principalement comme « ta méchanceté ».
  alternative: Le comprendre comme « ton malheur » ou « le châtiment qui te menace ».
  rationale: Le contexte moral favorise « méchanceté », mais le nom hébreu peut aussi désigner un malheur; cette autre lecture est signalée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation garde l’adresse féminine et l’ironie du texte. Les termes techniques sont évités dans le corps du verset; les difficultés syntaxiques et l’ambiguïté entre faute morale et malheur sont exposées en note.
