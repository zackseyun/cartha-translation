source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֤יא אֲלֵי/הֶם֙ רָעָ֔ה אֲשֶׁ֥ר לֹֽא יוּכְל֖וּ לָ/צֵ֣את מִמֶּ֑/נָּה וְ/זָעֲק֣וּ אֵלַ֔/י וְ/לֹ֥א אֶשְׁמַ֖ע אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/011.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am bringing on them a disaster from which they will not be able to escape; and they will cry out to me, but I will not listen to them.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh : Voici, je vais faire venir sur eux un malheur[a] auquel ils ne pourront échapper. Ils crieront vers moi, mais je ne les écouterai pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un désastre » ou « une calamité ». Ici, le mot hébreu רָעָה désigne un jugement destructeur, et non le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque explicitement la conséquence de l’accusation précédente, dans un français naturel et soutenu.
- source_word: כֹּה אָמַר יְהוָה
  choice: voici ce que dit Yahweh
  rationale: Rend naturellement en français moderne la formule prophétique du messager tout en conservant le nom divin.
- source_word: הִנְנִי מֵבִיא
  choice: Je vais faire venir
  rationale: L’association de הִנְנִי avec le participe présente une action imminente et certaine; cette tournure française en restitue l’élan sans la réduire à un simple futur.
- source_word: רָעָה
  choice: un malheur
  rationale: Dans ce contexte, le terme désigne une calamité relevant du jugement, et non le mal moral. « Malheur » conserve la gravité du mot et son champ sémantique sans surinterprétation.
- source_word: אֲשֶׁר לֹא יוּכְלוּ לָצֵאת מִמֶּנָּה
  choice: auquel ils ne pourront échapper
  rationale: Rend idiomatiquement l’image hébraïque de l’impossibilité de sortir de la calamité.
- source_word: וְזָעֲקוּ אֵלַי
  choice: Ils crieront vers moi
  rationale: זעק exprime un appel pressant lancé dans la détresse; « crier vers » conserve cette intensité et la direction de l’appel.
- source_word: וְלֹא אֶשְׁמַע אֲלֵיהֶם
  choice: mais je ne les écouterai pas
  rationale: Dans le contexte d’un appel au secours, שׁמע signifie non seulement entendre, mais prêter attention et répondre; « mais » explicite naturellement le contraste.
theological_decisions:
- issue: Sens de רָעָה dans l’annonce du jugement divin
  choice: un malheur
  alternative: un désastre ; un mal ; une calamité
  rationale: Le contexte parle d’une calamité infligée comme jugement de l’alliance, non de mal moral. « Malheur » évite de présenter Dieu comme auteur du mal moral tout en préservant la portée négative du terme hébreu.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel ; le Seigneur ; Jéhovah
  rationale: Le texte hébreu emploie le nom propre divin. Sa translittération préserve ici sa fonction de nom d’alliance sans lui substituer un titre.
- issue: Portée de שׁמע dans le refus divin
  choice: je ne les écouterai pas
  alternative: je ne les entendrai pas
  rationale: Le refus ne porte pas sur la capacité auditive, mais sur le fait de ne pas accueillir leur appel ni y répondre. Le français « écouter » transmet ce sens contextuel.
translation_notes:
  register: Français international moderne, clair et digne. La formule prophétique conserve sa solennité sans archaïsme. La répétition des pronoms et les propositions brèves maintiennent la force de l’annonce judiciaire.
