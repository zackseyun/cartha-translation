source:
  edition: WLC
  text: אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבֽוֹתֵי/כֶ֡ם בְּ/י֣וֹם הוֹצִיאִֽ/י אוֹתָ֣/ם מֵ/אֶֽרֶץ מִצְרַיִם֩ מִ/כּ֨וּר הַ/בַּרְזֶ֜ל לֵ/אמֹ֗ר שִׁמְע֤וּ בְ/קוֹלִ/י֙ וַ/עֲשִׂיתֶ֣ם אוֹתָ֔/ם כְּ/כֹ֥ל אֲשֶׁר אֲצַוֶּ֖ה אֶתְ/כֶ֑ם וִ/הְיִ֤יתֶם לִ/י֙ לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/004.yaml
  text: which I commanded your fathers on the day I brought them out from the land of Egypt[a], from the iron furnace, saying, ‘Listen to my voice and do them, according to all that I command you; and you shall be my people[c][b], and I will be your God,’
translation:
  language: fr
  text: 'que j’avais prescrite à vos pères[a] le jour où je les ai fait sortir du pays d’Égypte, de la fournaise de fer[b], en disant : « Écoutez ma voix[c] et mettez en pratique tout ce que je vous commande. Et vous serez mon peuple, et moi, je serai votre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos ancêtres ». L’hébreu dit littéralement « vos pères ».
    reason: lexical_alternative
  - marker: b
    text: La « fournaise de fer » est une image de l’Égypte comme lieu d’oppression et de dure souffrance.
    reason: cultural_note
  - marker: c
    text: 'L’expression « Écoutez ma voix » implique aussi l’obéissance ; on pourrait traduire : « Obéissez-moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר צִוִּיתִי
  choice: que j’avais prescrite
  rationale: La proposition relative renvoie à l’alliance du verset précédent. Le plus-que-parfait situe naturellement cette prescription avant le discours rapporté, et « prescrire » conserve son caractère impératif.
- source_word: אֲבוֹתֵיכֶם
  choice: vos pères
  rationale: Le texte hébreu emploie explicitement le pluriel masculin « pères ». Une note indique le sens plus large d’ancêtres.
- source_word: בְּיוֹם הוֹצִיאִי אוֹתָם
  choice: le jour où je les ai fait sortir
  rationale: Cette formulation garde l’ancrage temporel concret et rend correctement la valeur causative de הוֹצִיאִי.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Formule française naturelle qui conserve la mention formelle du pays d’Égypte.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: de la fournaise de fer
  rationale: La métaphore hébraïque est conservée sans l’expliciter dans le corps du texte.
- source_word: לֵאמֹר
  choice: Je leur ai dit
  rationale: En français courant, cette tournure introduit clairement les paroles prononcées et explicite le destinataire déjà présent dans le contexte immédiat.
- source_word: שִׁמְעוּ בְקוֹלִי
  choice: Écoutez ma voix
  rationale: Cette traduction conserve l’image auditive de l’hébreu tout en laissant au contexte l’idée d’obéissance.
- source_word: וַעֲשִׂיתֶם אוֹתָם כְּכֹל אֲשֶׁר אֲצַוֶּה אֶתְכֶם
  choice: et mettez en pratique tout ce que je vous commande
  rationale: « Mettre en pratique » rend idiomatiquement l’action exigée. Le regroupement de la construction évite le français peu naturel « faites-les » tout en conservant l’étendue totale du commandement.
- source_word: וִהְיִיתֶם לִי לְעָם
  choice: Alors vous serez mon peuple
  rationale: La formule française exprime naturellement le résultat attendu dans cette déclaration d’alliance.
- source_word: וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים
  choice: et moi, je serai votre Dieu
  rationale: Cette formulation restitue la relation d’alliance et met en relief le pronom hébreu אָנֹכִי.
theological_decisions:
- issue: Langage masculin relatif aux générations antérieures
  choice: vos pères
  alternative: vos ancêtres
  rationale: Le masculin lexical du texte source est conservé, tandis que la note signale que le référent englobe les générations antérieures d’Israël.
- issue: Nuance d’obéissance dans שִׁמְעוּ בְקוֹלִי
  choice: Écoutez ma voix
  alternative: Obéissez-moi
  rationale: Le choix principal préserve la métaphore auditive et la tension lexicale de l’expression. L’exigence d’obéissance devient explicite dans « mettez en pratique ».
- issue: Relation entre l’obéissance et la formule d’alliance
  choice: Alors vous serez mon peuple
  alternative: et vous serez mon peuple
  rationale: « Alors » rend la progression syntaxique et le résultat énoncé sans définir au-delà du texte la nature théologique précise de cette relation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement lissée pour éviter des calques peu naturels, mais les images de la voix, de la fournaise et la formule d’alliance sont préservées.
