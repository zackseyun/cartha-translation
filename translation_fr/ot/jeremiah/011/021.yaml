source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ עַל אַנְשֵׁ֣י עֲנָת֔וֹת הַֽ/מְבַקְשִׁ֥ים אֶֽת נַפְשְׁ/ךָ֖ לֵ/אמֹ֑ר לֹ֤א תִנָּבֵא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וְ/לֹ֥א תָמ֖וּת בְּ/יָדֵֽ/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/021.yaml
  text: Therefore[a], this is what Yahweh says concerning the men of Anathoth who are seeking your life, saying, “Do not prophesy in the name of Yahweh[c][b], lest you die by our hand.”
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahvé au sujet des hommes d’Anatoth qui cherchent à t’ôter la vie[a] : « Ne prophétise pas au nom de Yahvé, sinon tu mourras de notre main[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui recherchent ta vie »; cette expression hébraïque signifie qu’ils cherchent à te tuer.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et tu ne mourras pas de notre main ». Dans ce contexte, cette formulation est comprise comme une menace : s’il prophétise, ils le tueront.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conséquence tirée du contexte précédent, dans un français actuel et soutenu.
- source_word: כֹּה אָמַר יְהוָה
  choice: voici ce que dit Yahvé
  rationale: Rend naturellement la formule prophétique de messager tout en conservant sa solennité.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français le nom divin représenté par le tétragramme, au lieu de le remplacer par un titre.
- source_word: עַל
  choice: au sujet de
  rationale: La préposition introduit ici les personnes visées par la déclaration divine; « contre » serait possible selon le contexte, mais plus interprétatif.
- source_word: אַנְשֵׁי עֲנָתוֹת
  choice: les hommes d’Anatoth
  rationale: Reproduit le substantif masculin pluriel et le nom traditionnel français de la localité.
- source_word: הַמְבַקְשִׁים אֶת נַפְשְׁךָ
  choice: qui cherchent à t’ôter la vie
  rationale: Exprime clairement l’idiome hébreu désignant des hommes qui tentent de tuer Jérémie, sans atténuer leur intention.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent plus naturellement les paroles qui explicitent la menace; le sens quotatif de l’infinitif est pleinement conservé.
- source_word: לֹא תִנָּבֵא
  choice: Ne prophétise pas
  rationale: L’inaccompli négatif a ici la force directe d’une interdiction.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahvé
  rationale: Expression française consacrée pour parler sous l’autorité du Dieu nommé.
- source_word: וְלֹא תָמוּת בְּיָדֵנוּ
  choice: sinon tu mourras de notre main
  rationale: Rend en français naturel la menace attachée à l’interdiction, tout en conservant l’image de la main des agresseurs; la forme négative littérale est signalée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom propre divin; « Yahvé » en conserve la fonction et correspond à sa forme française courante.
- issue: Portée de אַנְשֵׁי עֲנָתוֹת
  choice: les hommes d’Anatoth
  alternative: les gens d’Anatoth
  rationale: Le texte emploie un pluriel masculin désignant les hommes de la ville; la traduction ne neutralise pas cette précision.
- issue: Interprétation de la proposition finale négative
  choice: 'une menace explicite : « sinon tu mourras »'
  alternative: « et tu ne mourras pas de notre main »
  rationale: La formulation littéralement négative fonctionne en contexte comme la conséquence menaçante de l’interdiction. La note préserve la forme et l’ambiguïté syntaxique de l’hébreu.
translation_notes:
  register: Français international actuel, digne et direct. Le tutoiement suit la deuxième personne masculine singulière de l’hébreu. « De notre main » conserve volontairement l’image sémitique sans rendre la phrase obscure.
