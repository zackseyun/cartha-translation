source:
  edition: WLC
  text: וַֽ/יהוָ֤ה צְבָאוֹת֙ שֹׁפֵ֣ט צֶ֔דֶק בֹּחֵ֥ן כְּלָי֖וֹת וָ/לֵ֑ב אֶרְאֶ֤ה נִקְמָֽתְ/ךָ֙ מֵ/הֶ֔ם כִּ֥י אֵלֶ֖י/ךָ גִּלִּ֥יתִי אֶת רִיבִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/020.yaml
  text: But you[a], O Yahweh of hosts, who judge righteously, who test the kidneys and the heart, let me see your vengeance on them[c][b], for to you I have revealed my case.
translation:
  language: fr
  text: Mais toi, Yahvé des armées, qui juges avec justice et qui examines les reins et le cœur[a], que je voie ta vengeance contre eux[b], car c’est à toi que j’ai exposé ma cause[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « les reins et le cœur » : dans la pensée hébraïque, ces organes représentent les pensées, les sentiments et les motivations les plus profondes.'
    reason: cultural_note
  - marker: b
    text: Ou « l’action par laquelle tu feras justice » ou « la manière dont tu défendras ma cause ».
    reason: lexical_alternative
  - marker: c
    text: Ou « mon litige », « mon procès » ou « ma plainte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: Mais toi, Yahvé des armées
  rationale: La conjonction prend ici une valeur adversative dans le fil du discours. « Toi » rend explicite l’adresse directe, tandis que « Yahvé » transcrit le nom divin selon l’usage français courant. « Des armées » restitue le titre צְבָאוֹת de manière claire sans le limiter explicitement aux seules armées humaines.
- source_word: שֹׁפֵט צֶדֶק
  choice: qui juges avec justice
  rationale: Le participe décrit l’action caractéristique de Yahvé. « Avec justice » rend naturellement צֶדֶק comme la qualité ou la manière de juger.
- source_word: בֹּחֵן כְּלָיוֹת וָלֵב
  choice: qui examines les reins et le cœur
  rationale: « Examines » exprime l’idée d’une investigation profonde. Les images anthropologiques concrètes de l’hébreu sont conservées dans le texte et expliquées en note.
- source_word: אֶרְאֶה
  choice: que je voie
  rationale: Bien qu’il s’agisse formellement d’un inaccompli à la première personne, le contexte de prière permet une nuance volitive. « Que je voie » conserve cette demande sans ajouter un causatif absent de l’hébreu.
- source_word: נִקְמָתְךָ מֵהֶם
  choice: ta vengeance contre eux
  rationale: Le nom נְקָמָה désigne la vengeance ou l’action de faire justice. « Contre eux » est idiomatique en français et rend la cible indiquée par מֵהֶם.
- source_word: כִּי אֵלֶיךָ גִּלִּיתִי אֶת רִיבִי
  choice: car c’est à toi que j’ai exposé ma cause
  rationale: « Car » introduit le fondement de la demande. La tournure clivée rend l’accent placé sur אֵלֶיךָ, « à toi ». « Exposé » conserve l’idée de dévoiler, et « cause » exprime la dimension juridique de רִיב.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: La transcription « Yahvé », traditionnelle et immédiatement reconnaissable en français, préserve la référence personnelle au nom d’alliance au lieu de la remplacer par un titre.
- issue: Image anthropologique des « reins et du cœur »
  choice: conserver l’image hébraïque dans le texte
  alternative: traduire par « les pensées et les intentions profondes »
  rationale: Le texte présente Dieu comme celui qui sonde l’intériorité humaine. Garder les termes concrets préserve la forme et la portée de l’image biblique; une note en précise le sens culturel.
- issue: Valeur de נְקָמָה
  choice: vengeance
  alternative: rétribution ou justice rendue
  rationale: « Vengeance » est l’équivalent lexical direct et maintient la tension du texte, où le prophète demande à voir l’intervention punitive de Dieu. La note signale que le terme peut aussi mettre l’accent sur l’action de faire justice ou de défendre sa cause.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité de la prière sans employer de tournures archaïques. Les images concrètes et la nuance juridique de l’hébreu sont maintenues, avec des notes pour les lecteurs modernes.
