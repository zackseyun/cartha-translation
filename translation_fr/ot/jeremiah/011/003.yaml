  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אָר֣וּר הָ/אִ֔ישׁ אֲשֶׁר֙ לֹ֣א יִשְׁמַ֔ע אֶת דִּבְרֵ֖י הַ/בְּרִ֥ית הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/003.yaml
  text: 'And you shall say to them, ‘Thus says the LORD, the God of Israel: Cursed is the man who does not listen to the words of this covenant,’'
translation:
  language: fr
  text: 'Tu leur diras : « Voici ce que dit le SEIGNEUR, le Dieu d’Israël : Maudit soit l’homme qui n’écoute pas[a] les paroles de cette alliance, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « qui n’obéit pas aux paroles de cette alliance ».'
    reason: Signale la valeur obéientielle possible du verbe hébreu שׁמע dans le contexte de l’alliance, sans effacer le sens premier d’écoute dans le texte principal.
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Tu leur diras
  rationale: Conserve la deuxième personne du singulier adressée à Jérémie et le pluriel du complément.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule prophétique naturelle en français moderne, correspondant à l’introduction solennelle de l’oracle.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reconnue, sans le confondre avec le titre divin ordinaire.
- source_word: אָרוּר הָאִישׁ
  choice: Maudit soit l’homme
  rationale: Reproduit avec naturel et solennité la formule de malédiction hébraïque.
- source_word: יִשְׁמַע
  choice: n’écoute pas
  rationale: Préserve le sens premier d’entendre ou d’écouter, tout en laissant percevoir dans ce contexte d’alliance l’idée d’obéissance, explicitée en note.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: les paroles de cette alliance
  rationale: Traduction formellement proche qui conserve l’expression hébraïque et son caractère juridique et relationnel.
theological_decisions:
- issue: Portée de שׁמע dans le cadre de l’alliance
  choice: n’écoute pas
  alternative: n’obéit pas à
  rationale: Le verbe peut impliquer l’obéissance, mais traduire seulement par « obéir » effacerait l’image biblique de l’écoute. Le texte principal conserve cette tension et la note indique l’autre valeur contextuelle.
translation_notes:
  register: Français moderne, clair et solennel. Le tutoiement correspond à l’adresse divine au prophète. La ponctuation marque nettement la formule d’introduction et la proclamation de malédiction.
