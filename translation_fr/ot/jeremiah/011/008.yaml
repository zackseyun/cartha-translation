source:
  edition: WLC
  text: וְ/לֹ֤א שָֽׁמְעוּ֙ וְ/לֹֽא הִטּ֣וּ אֶת אָזְנָ֔/ם וַ/יֵּ֣לְכ֔וּ אִ֕ישׁ בִּ/שְׁרִיר֖וּת לִבָּ֣/ם הָ/רָ֑ע וָ/אָבִ֨יא עֲלֵי/הֶ֜ם אֶֽת כָּל דִּבְרֵ֧י הַ/בְּרִית הַ/זֹּ֛את אֲשֶׁר צִוִּ֥יתִי לַ/עֲשׂ֖וֹת וְ/לֹ֥א עָשֽׂוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/008.yaml
  text: Yet they did not listen or incline their ear[a], but each one walked in the stubbornness of his evil heart; so I brought upon them all the words of this covenant, which I commanded them to do[b], but they did not do them.
translation:
  language: fr
  text: Mais ils n’ont pas écouté ni prêté l’oreille[a] ; chacun a suivi l’obstination de son cœur mauvais. Alors j’ai fait venir sur eux toutes les paroles de cette alliance[b], que je leur avais ordonné de mettre en pratique, mais ils ne les ont pas mises en pratique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’ont pas entendu » ; dans ce contexte, l’expression implique aussi qu’ils ont refusé d’obéir.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « toutes les paroles de cette alliance » ; l’expression peut inclure les jugements dont l’alliance les menaçait, et pas seulement ses commandements.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: écouté
  rationale: Le verbe peut signifier entendre, écouter ou obéir. « Écouté » conserve ici à la fois l’idée d’une écoute attentive et celle d’une réponse attendue, sans réduire le sens à la seule obéissance.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: prêté l’oreille
  rationale: Cette expression française naturelle conserve l’image hébraïque de l’oreille tout en exprimant l’attention volontaire.
- source_word: וַיֵּלְכוּ אִישׁ
  choice: chacun a suivi
  rationale: אִישׁ a ici une valeur distributive et désigne chaque membre du peuple, sans viser exclusivement les hommes. « A suivi » rend naturellement la métaphore hébraïque de la conduite.
- source_word: בִּשְׁרִירוּת
  choice: les penchants obstinés
  rationale: Le terme désigne une disposition volontairement obstinée. Cette formulation idiomatique en français exprime l’obstination intérieure sans rendre la phrase artificielle.
- source_word: לִבָּם הָרָע
  choice: de son cœur mauvais
  rationale: Avec « chacun », le singulier distributif « son cœur » reflète naturellement la construction hébraïque. « Mauvais » rend directement רַע.
- source_word: וָאָבִיא עֲלֵיהֶם
  choice: Alors j’ai fait venir sur eux
  rationale: « Alors » fait ressortir la conséquence de leur refus, tandis que « fait venir sur eux » conserve la causalité et l’image du texte source.
- source_word: כָּל דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: toutes les paroles de cette alliance
  rationale: La traduction garde le terme large « paroles » au lieu de le restreindre aux commandements ou aux malédictions de l’alliance.
- source_word: אֲשֶׁר צִוִּיתִי לַעֲשׂוֹת
  choice: que je leur avais ordonné de mettre en pratique
  rationale: « Mettre en pratique » rend ici le verbe « faire » de manière claire et naturelle dans le contexte d’exigences d’alliance. Le pronom « leur » est fourni par le contexte.
- source_word: וְלֹא עָשׂוּ
  choice: mais ils ne les ont pas mises en pratique
  rationale: Le pronom « les » reprend explicitement « les paroles » et la répétition de « mettre en pratique » reproduit l’insistance du texte hébreu.
theological_decisions:
- issue: Portée de « toutes les paroles de cette alliance »
  choice: Conserver « paroles » et signaler que l’expression peut inclure les jugements annoncés par l’alliance.
  alternative: « toutes les malédictions de cette alliance » ou « toutes les clauses de cette alliance »
  rationale: Dans le contexte, les sanctions de l’alliance sont vraisemblablement comprises, mais l’hébreu emploie le terme plus large דִּבְרֵי. La traduction ne doit donc pas trancher en faveur d’une portée exclusivement punitive ou prescriptive.
- issue: Valeur de אִישׁ
  choice: « chacun »
  alternative: « chaque homme »
  rationale: Le mot fonctionne distributivement pour les membres du peuple. « Chacun » restitue cette portée sans introduire une limitation masculine absente de l’intention contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « prêter l’oreille » conserve l’image du texte source sans paraître archaïque ; « mettre en pratique » communique clairement l’exigence concrète de l’alliance.
