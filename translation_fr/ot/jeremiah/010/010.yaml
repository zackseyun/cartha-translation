source:
  edition: WLC
  text: וַֽ/יהוָ֤ה אֱלֹהִים֙ אֱמֶ֔ת הֽוּא אֱלֹהִ֥ים חַיִּ֖ים וּ/מֶ֣לֶךְ עוֹלָ֑ם מִ/קִּצְפּ/וֹ֙ תִּרְעַ֣שׁ הָ/אָ֔רֶץ וְ/לֹֽא יָכִ֥לוּ גוֹיִ֖ם זַעְמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/010.yaml
  text: But Yahweh is the true God[a]; he is the living God and the everlasting King. At his wrath the earth quakes[c][b], and the nations cannot endure his indignation.
translation:
  language: fr
  text: Mais Yahweh[a] est le vrai Dieu[b] ; il est le Dieu vivant et le Roi éternel[c]. Devant sa colère, la terre tremble, et les nations ne peuvent supporter son indignation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et Yahweh » ; la conjonction peut être simplement connective, mais elle marque probablement ici le contraste avec les idoles évoquées dans le contexte.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « le Dieu de vérité ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le Roi pour toujours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Mais Yahweh
  rationale: La conjonction ו peut être simplement connective, mais le contexte oppose ici Yahweh aux idoles. Le nom divin est translittéré conformément à sa présence explicite dans l’hébreu.
- source_word: אֱלֹהִים אֱמֶת
  choice: le vrai Dieu
  rationale: Cette formulation naturelle exprime le contraste avec les faux dieux, tout en signalant en note la lecture possible « le Dieu de vérité ».
- source_word: אֱלֹהִים חַיִּים
  choice: le Dieu vivant
  rationale: Expression française consacrée et claire, qui maintient le contraste avec les idoles sans vie.
- source_word: וּמֶלֶךְ עוֹלָם
  choice: et le Roi éternel
  rationale: עוֹלָם désigne ici une royauté sans fin ; « éternel » est naturel, digne et concis en français.
- source_word: מִקִּצְפּוֹ
  choice: Devant sa colère
  rationale: La préposition מִן marque ici la cause ou la réaction suscitée par la colère divine. « Devant » rend naturellement cette relation sans imposer une causalité trop analytique.
- source_word: תִּרְעַשׁ הָאָרֶץ
  choice: la terre tremble
  rationale: רעש exprime un ébranlement. « La terre » convient à la portée universelle du passage, et « tremble » est idiomatique en français.
- source_word: וְלֹא יָכִלוּ גוֹיִם
  choice: et les nations ne peuvent supporter
  rationale: יכל avec son complément exprime l’incapacité à tenir sous l’effet de la colère divine ; « supporter » conserve ce sens.
- source_word: זַעְמוֹ
  choice: son indignation
  rationale: זַעַם désigne une colère intense, souvent divine. « Indignation » garde un registre solennel et une possible nuance judiciaire.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le Tétragramme. « Yahweh » préserve le caractère de nom propre sans substituer un titre.
- issue: Valeur de la conjonction initiale ו
  choice: Mais
  alternative: Et
  rationale: Le contexte immédiat établit une opposition rhétorique entre Yahweh et les idoles ; « Mais » rend cette valeur adversative probable, tandis que la note conserve l’autre possibilité.
- issue: Sens de אֱלֹהִים אֱמֶת
  choice: le vrai Dieu
  alternative: le Dieu de vérité
  rationale: Le contexte polémique favorise l’identification de Yahweh comme le Dieu véritable, mais la construction hébraïque permet aussi une relation avec la vérité ; cette ambiguïté est signalée.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme hébreu et le contraste théologique sans archaïsmes inutiles.
