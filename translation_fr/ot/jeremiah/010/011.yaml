source:
  edition: WLC
  text: כִּ/דְנָה֙ תֵּאמְר֣וּן לְ/ה֔וֹם אֱלָ֣הַיָּ֔/א דִּֽי שְׁמַיָּ֥/א וְ/אַרְקָ֖/א לָ֣א עֲבַ֑דוּ יֵאבַ֧דוּ מֵֽ/אַרְעָ֛/א וּ/מִן תְּח֥וֹת שְׁמַיָּ֖/א אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/011.yaml
  text: 'Thus you shall say to them: “The gods that did not make the heavens and the earth will perish from the earth and from under these heavens.”[a][b]'
translation:
  language: fr
  text: 'Voici ce que vous leur direz : « Les dieux[b] qui n’ont fait ni le ciel ni la terre disparaîtront[a] de la terre et de sous ces cieux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « périront » ou « seront détruits ». Le verbe araméen peut désigner le fait de périr, d’être anéanti ou de disparaître.
    reason: lexical_alternative
  - marker: b
    text: L’expression « les dieux » peut désigner les idoles, les divinités supposées, ou les unes et les autres ; la formulation polémique reste volontairement générale.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּדְנָה
  choice: Voici ce que
  rationale: Cette tournure française introduit naturellement la formule exacte à prononcer tout en conservant la valeur déictique de l’adverbe araméen.
- source_word: תֵּאמְרוּן לְהוֹם
  choice: vous leur direz
  rationale: Le futur français exprime ici avec naturel l’instruction adressée à un groupe, sans la réduire à une simple prédiction.
- source_word: אֱלָהַיָּא
  choice: les dieux
  rationale: Le nom araméen est un pluriel déterminé. « Les dieux » maintient la portée polémique générale du texte.
- source_word: שְׁמַיָּא וְאַרְקָא
  choice: le ciel ni la terre
  rationale: Dans la proposition négative, « ni… ni… » est idiomatique. « Le ciel et la terre » est en français la formule biblique naturelle désignant l’ensemble du monde créé.
- source_word: לָא עֲבַדוּ
  choice: n’ont fait
  rationale: Le passé composé rend naturellement en français l’accompli araméen et présente l’absence d’œuvre créatrice comme un fait établi.
- source_word: יֵאבַדוּ
  choice: périront
  rationale: 'Le verbe conserve son sens intransitif et l’ironie du passage : les dieux qui n’ont rien créé sont eux-mêmes voués à disparaître.'
- source_word: מֵאַרְעָא
  choice: de la terre
  rationale: Le contexte cosmique favorise « terre » plutôt que « pays ».
- source_word: וּמִן תְּחוֹת שְׁמַיָּא אֵלֶּה
  choice: et de dessous ces cieux
  rationale: La formulation garde la préposition « sous/dessous », le pluriel de « cieux » et le démonstratif אֵלֶּה (« ces »), malgré son caractère marqué en français.
theological_decisions:
- issue: Référent de « les dieux »
  choice: Conserver l’expression générale « les dieux »
  alternative: Préciser « les idoles » ou « les prétendus dieux »
  rationale: Le texte araméen oppose ces dieux au Créateur sans préciser s’il vise les idoles matérielles, les divinités supposées ou les deux. La traduction ne tranche pas cette ambiguïté.
- issue: Nature de leur fin
  choice: « périront »
  alternative: « seront détruits » ou « disparaîtront »
  rationale: « Périront » préserve la forme intransitive et ne précise pas le moyen de leur disparition, conformément à l’amplitude sémantique du verbe araméen.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure d’ouverture est naturelle à l’oral comme à l’écrit. « Ces cieux » est volontairement plus marqué afin de conserver le démonstratif explicite du texte araméen.
