source:
  edition: WLC
  text: עֹשֵׂ֥ה אֶ֨רֶץ֙ בְּ/כֹח֔/וֹ מֵכִ֥ין תֵּבֵ֖ל בְּ/חָכְמָת֑/וֹ וּ/בִ/תְבוּנָת֖/וֹ נָטָ֥ה שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/012.yaml
  text: He made the earth by his power[a]; he established the world by his wisdom[b], and by his understanding he stretched out the heavens.
translation:
  language: fr
  text: Il a fait la terre par sa puissance[a] ; il a affermi le monde par sa sagesse[b] et, par son intelligence, il a déployé les cieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il fait la terre par sa puissance, il affermit le monde… ». Les deux premiers verbes sont des participes en hébreu; ils peuvent aussi se traduire avec une valeur présente ou descriptive.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « monde » désigne souvent la terre comme monde ordonné ou habité.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂה
  choice: a fait
  rationale: Le participe hébreu peut avoir une valeur présente ou désigner celui qui agit. Le passé s’accorde naturellement avec le verbe final נָטָה et présente ici l’œuvre créatrice comme accomplie, sans masquer l’autre possibilité, signalée en note.
- source_word: אֶרֶץ
  choice: la terre
  rationale: Le cadre cosmique et le parallèle avec le monde et les cieux favorisent « terre » plutôt que « pays ».
- source_word: בְּכֹחוֹ
  choice: par sa puissance
  rationale: La préposition בְּ a ici une valeur instrumentale; « puissance » exprime la force créatrice évoquée par כֹּחַ.
- source_word: מֵכִין
  choice: a affermi
  rationale: Le hiphil de כון exprime l’idée de rendre stable, de fixer solidement ou d’établir. « Affermir » conserve cette image de stabilité cosmique. Comme עֹשֵׂה, la forme est participiale, possibilité signalée en note.
- source_word: תֵּבֵל
  choice: le monde
  rationale: תֵּבֵל désigne souvent le monde ordonné ou habité. « Le monde » est naturel et précis dans ce parallélisme cosmique.
- source_word: בְּחָכְמָתוֹ
  choice: par sa sagesse
  rationale: La formulation rend la valeur instrumentale de בְּ et conserve le thème biblique de la création accomplie avec sagesse.
- source_word: וּבִתְבוּנָתוֹ
  choice: et, par son intelligence
  rationale: « Intelligence » distingue תְּבוּנָה de חָכְמָה (« sagesse ») tout en restant naturel en français.
- source_word: נָטָה
  choice: a déployé
  rationale: Avec les cieux, נטה évoque l’action d’étendre ou de déployer. « Déployer » garde l’image spatiale dans un français actuel et digne.
- source_word: שָׁמָיִם
  choice: les cieux
  rationale: Le pluriel traditionnel « les cieux » reflète la forme hébraïque et convient mieux au contexte cosmique que « le ciel » ou « le firmament ».
theological_decisions:
- issue: Le sujet divin est implicite dans le verset
  choice: Employer le pronom « Il » sans ajouter de nom divin
  alternative: « Dieu a fait… » ou « Le SEIGNEUR a fait… »
  rationale: L’hébreu commence par des prédicats verbaux sans répéter ici le nom du sujet, repris du contexte. Le pronom maintient cette continuité sans introduire un titre absent de la proposition.
- issue: Valeur temporelle des deux participes initiaux
  choice: Les rendre au passé, en harmonie avec le verbe final et le contexte de création
  alternative: « Il fait la terre… il affermit le monde… » ou « Lui qui fait… qui affermit… »
  rationale: Les participes permettent une lecture présente, habituelle ou descriptive. Le passé donne une phrase française cohérente avec נָטָה (« il a déployé »), tandis que la note préserve l’ambiguïté grammaticale réelle.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le rythme ternaire et la répétition de « par » préservent le parallélisme hébreu; « affermi » et « déployé » maintiennent les images concrètes de stabilité et d’extension.
