  variant: modern international French
source:
  edition: WLC
  text: לְ/ק֨וֹל תִּתּ֜/וֹ הֲמ֥וֹן מַ֨יִם֙ בַּ/שָּׁמַ֔יִם וַ/יַּעֲלֶ֥ה נְשִׂאִ֖ים מִ/קְצֵ֣ה ארץ בְּרָקִ֤ים לַ/מָּטָר֙ עָשָׂ֔ה וַ/יּ֥וֹצֵא ר֖וּחַ מֵ/אֹצְרֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/013.yaml
  text: At the sound of his voice[a], there is a roar of waters in the heavens, and he makes clouds rise from the ends of the earth; he makes lightning for the rain[b], and brings out the wind from his storehouses.
translation:
  language: fr
  text: Quand il fait retentir sa voix[a], un grondement d’eaux se fait entendre dans le ciel. Il fait monter les nuages[b] des extrémités de la terre, il produit les éclairs pour la pluie et fait sortir le vent de ses dépôts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Au son de son donner, un tumulte d’eaux est dans le ciel » ; l’expression hébraïque est très condensée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les vapeurs » ou « les brumes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל תִּתּוֹ
  choice: Quand il fait entendre sa voix
  rationale: L’expression hébraïque, littéralement « au son de son donner », est très condensée. Cette formulation française restitue idiomatiquement l’idée qu’il donne ou fait retentir sa voix, tout en conservant l’action personnelle de Dieu.
- source_word: הֲמוֹן מַיִם
  choice: les eaux grondent
  rationale: הָמוֹן peut évoquer aussi bien une multitude qu’un tumulte sonore. Dans le contexte de l’orage et après la mention de la voix, « grondent » rend naturellement la dimension acoustique.
- source_word: בַּשָּׁמַיִם
  choice: dans le ciel
  rationale: שָׁמַיִם désigne ici la voûte céleste où se produisent les phénomènes météorologiques. « Dans le ciel » est plus naturel en français moderne que « dans les cieux » dans ce contexte.
- source_word: וַיַּעֲלֶה נְשִׂאִים
  choice: Il fait monter les nuages
  rationale: La forme causative de עלה indique qu’il les fait s’élever. נְשִׂאִים désigne ici des masses de vapeur ou des nuages.
- source_word: מִקְצֵה אֶרֶץ
  choice: des extrémités de la terre
  rationale: Cette expression idiomatique désigne les régions les plus lointaines du monde et conserve l’ampleur cosmique du texte.
- source_word: בְּרָקִים לַמָּטָר עָשָׂה
  choice: il produit les éclairs pour la pluie
  rationale: La traduction conserve la préposition ל et le rapport volontairement peu explicité entre les éclairs et la pluie, sans imposer une interprétation météorologique plus précise.
- source_word: וַיּוֹצֵא רוּחַ
  choice: et fait sortir le vent
  rationale: רוּחַ signifie ici « vent » dans la séquence météorologique. « Fait sortir » reflète la forme causative et l’image des réserves divines.
- source_word: מֵאֹצְרֹתָיו
  choice: de ses réserves
  rationale: אֹצָר peut désigner un dépôt, un entrepôt ou un trésor. « Réserves » transmet clairement en français l’image d’un lieu où les forces naturelles sont gardées.
theological_decisions:
- issue: Langage anthropomorphique de la manifestation divine dans l’orage
  choice: 'Conserver l’action personnelle de Dieu : « sa voix », « il fait », « il produit »'
  alternative: Décrire les phénomènes météorologiques de manière impersonnelle
  rationale: L’hébreu attribue directement à Dieu la maîtrise active de l’orage. La traduction maintient cette affirmation sans la réduire à un simple processus naturel.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme met en valeur la succession des phénomènes de l’orage. Les ambiguïtés de הֲמוֹן et du rapport entre les éclairs et la pluie sont respectées autant que le permet une formulation claire.
