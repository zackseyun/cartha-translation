  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/אַחַ֖ת יִבְעֲר֣וּ וְ/יִכְסָ֑לוּ מוּסַ֥ר הֲבָלִ֖ים עֵ֥ץ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/008.yaml
  text: But together they are stupid and foolish[b][a]; the instruction of idols is wood.
translation:
  language: fr
  text: Mais, tous ensemble[a], ils sont stupides et insensés ; l’instruction des idoles[b], c’est du bois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et tous pareillement, ils sont abrutis et insensés » ; l’expression initiale peut signifier « ensemble », « tous de même » ou « en une seule chose ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « vanités » ; dans ce contexte, ce terme prophétique désigne couramment les idoles ou des choses sans valeur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַחַת
  choice: Mais tous ensemble
  rationale: L’expression est difficile et idiomatique. Avec les verbes au pluriel, elle indique probablement que tous sont semblables ou réunis dans le même état. « Mais » marque naturellement le contraste avec le verset précédent.
- source_word: יִבְעֲרוּ
  choice: ils sont stupides
  rationale: Le verbe בער signifie ici « être abruti, dépourvu de raison », et non « brûler ». « Stupides » exprime clairement ce jugement intellectuel et moral en français actuel.
- source_word: וְיִכְסָלוּ
  choice: et insensés
  rationale: Le verbe כסל évoque la folie ou le manque de discernement. « Insensés » forme avec « stupides » un parallélisme naturel sans gommer la présence de deux termes hébreux.
- source_word: מוּסַר
  choice: l’instruction
  rationale: מוּסָר peut désigner l’instruction, la discipline ou la correction. « Instruction » conserve ici le sens le plus large et la formulation énigmatique du texte.
- source_word: הֲבָלִים
  choice: des idoles
  rationale: Le mot signifie littéralement « vanités » ou « souffles », mais il désigne fréquemment les idoles comme réalités vaines dans la polémique prophétique. La note préserve le sens littéral.
- source_word: עֵץ הוּא
  choice: c’est du bois
  rationale: La proposition nominale hébraïque est brève et incisive. « C’est du bois » souligne avec naturel en français la simple matière de l’idole sans ajouter « seulement » ou « rien que ».
theological_decisions:
- issue: Référent et portée de la proposition finale dans la polémique contre les idoles
  choice: L’instruction liée aux idoles est abruptement identifiée à du bois.
  alternative: L’idole de bois elle-même serait l’instructeur, ou la phrase qualifierait l’enseignement de « ligneux », donc sans vie.
  rationale: L’hébreu est condensé et son articulation syntaxique demeure difficile. La formulation retenue conserve cette tension tout en maintenant l’opposition contextuelle entre le Dieu vivant et les objets de bois fabriqués.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe brève de la dernière proposition conserve le caractère tranchant et quelque peu énigmatique de l’hébreu.
