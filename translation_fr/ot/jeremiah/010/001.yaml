source:
  edition: WLC
  text: שִׁמְע֣וּ אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה עֲלֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/001.yaml
  text: Hear the word that Yahweh has spoken concerning you[a], O house of Israel.
translation:
  language: fr
  text: Écoutez la parole que Yahweh a prononcée à votre sujet, maison d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif masculin pluriel appelle l’ensemble des destinataires à une écoute attentive. « Écoutez » est naturel en français et conserve la force de la convocation prophétique.
- source_word: הַדָּבָר
  choice: la parole
  rationale: דָּבָר peut désigner une parole ou un message. « La parole » préserve l’expression prophétique traditionnelle tout en restant claire dans la proposition relative.
- source_word: אֲשֶׁר דִּבֶּר
  choice: que ... a prononcée
  rationale: Le parfait דִּבֶּר désigne ici une parole déjà formulée et immédiatement pertinente. « A prononcée » évite en français la répétition peu élégante « la parole ... a dite ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte hébreu porte le nom divin YHWH. « Yahweh » le rend comme nom propre au lieu de lui substituer un titre.
- source_word: עֲלֵיכֶם
  choice: à votre sujet
  rationale: Avec un verbe de parole, עַל peut signifier « au sujet de » ou, selon le contexte, « contre ». Le verset introductif ne suffit pas à imposer la nuance hostile; « à votre sujet » préserve cette ouverture.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: Cette formule d’adresse prophétique désigne collectivement Israël. Sans « ô », devenu marqué en français courant, le vocatif demeure clair et digne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie le tétragramme comme nom personnel. La translittération « Yahweh » conserve ce nom, tandis que « le SEIGNEUR » reflète la tradition de substitution à la lecture.
- issue: Portée de עֲלֵיכֶם
  choice: à votre sujet
  alternative: contre vous
  rationale: La préposition peut introduire une parole concernant les destinataires ou dirigée contre eux. L’introduction seule ne permet pas de trancher en faveur de la valeur adversative; la formulation retenue évite d’anticiper le jugement.
translation_notes:
  register: Français international moderne, clair et digne. La tournure conserve le parallélisme prophétique et l’identité collective de « maison d’Israël », tout en évitant l’interjection archaïsante « ô ».
