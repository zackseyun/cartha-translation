  rationale: La révision remplace une image de propriété potentiellement restrictive par une expression française qui rend la dépendance implicite dans l’énoncé hébreu. Elle améliore également la syntaxe de la seconde ligne sans modifier l’ambiguïté théologique du verset ni les ancres de notes.
