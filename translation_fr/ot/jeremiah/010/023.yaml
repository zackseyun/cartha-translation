id: JER.10.23
reference: Jeremiah 10:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָדַ֣עְתִּי יְהוָ֔ה כִּ֛י לֹ֥א לָ/אָדָ֖ם דַּרְכּ֑/וֹ לֹֽא לְ/אִ֣ישׁ הֹלֵ֔ךְ וְ/הָכִ֖ין אֶֽת צַעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/023.yaml
  text: I know[a], O Yahweh, that a man's way is not his own[b]; it is not for a man who walks to direct his steps.
translation:
  language: fr
  text: 'Je le sais, Yahweh : la voie de l’être humain ne dépend pas de lui[a] ; ce n’est pas à l’homme qui marche de diriger ses pas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ce n’est pas à l’être humain qu’appartient sa voie ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « d’établir » ou « d’affermir ses pas ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Je sais
  rationale: Le parfait qal à la première personne exprime ici une conviction reconnue et durable ; le présent français rend naturellement cette valeur confessionnelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: לָאָדָם
  choice: l’être humain
  rationale: אָדָם désigne ici l’être humain de manière générique. Cette formulation moderne évite de restreindre indûment l’énoncé au sexe masculin.
- source_word: דַּרְכּוֹ
  choice: sa voie
  rationale: דֶּרֶךְ évoque à la fois le chemin et le cours de l’existence ; « voie » conserve cette portée figurée dans un registre digne.
- source_word: לֹא לָאָדָם דַּרְכּוֹ
  choice: la voie de l’être humain ne lui appartient pas
  rationale: La proposition hébraïque est elliptique, littéralement « pas à l’être humain sa voie ». La formulation française exprime clairement que l’être humain ne dispose pas souverainement de son parcours, sans préciser au-delà du texte comment celui-ci est déterminé.
- source_word: לְאִישׁ הֹלֵךְ
  choice: à l’homme qui marche
  rationale: Cette traduction préserve le substantif אִישׁ et la valeur participiale de הֹלֵךְ, tout en laissant entendre le parcours concret et existentiel.
- source_word: וְהָכִין
  choice: de diriger
  rationale: Le hiphil de כון peut signifier établir, affermir, préparer ou régler. Avec « ses pas », « diriger » rend naturellement l’idée d’ordonner sa propre marche, tandis qu’une note conserve l’alternative plus formelle.
- source_word: אֶת צַעֲדוֹ
  choice: ses pas
  rationale: Le singulier collectif hébreu se rend idiomatiquement au pluriel en français et désigne les mouvements qui composent le parcours d’une personne.
theological_decisions:
- issue: Action humaine et souveraineté divine
  choice: Le verset nie que l’être humain possède en propre la maîtrise ultime de sa voie et de ses pas.
  alternative: Le verset pourrait être développé soit comme une affirmation déterministe, soit seulement comme l’aveu pratique d’une limitation humaine.
  rationale: La traduction maintient la forte déclaration de dépendance du texte, mais n’ajoute aucune explication métaphysique sur la manière dont Dieu dirige la vie humaine.
translation_notes:
  register: Français international moderne, clair et digne. « L’être humain » rend la portée générique de אָדָם, tandis que « l’homme qui marche » préserve le parallélisme lexical avec אִישׁ. La syntaxe conserve la tension entre l’expérience humaine de la marche et l’absence de maîtrise ultime sur son parcours.
