reference: Jeremiah 10:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֶ֣בֶל הֵ֔מָּה מַעֲשֵׂ֖ה תַּעְתֻּעִ֑ים בְּ/עֵ֥ת פְּקֻדָּתָ֖/ם יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/015.yaml
  text: They are vanity, a work of mockery; at the time of their punishment they will perish.
translation:
  language: fr
  text: Ils ne sont que du néant, une œuvre de dérision[a] ; au temps de leur châtiment, ils périront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une œuvre d’illusion » ou « de tromperie ». Le terme hébreu peut évoquer la dérision aussi bien que l’égarement.'
    reason: Préserver l’ambiguïté lexicale de תַּעְתֻּעִים sans imposer une interprétation unique.
lexical_decisions:
- source_word: הֶבֶל
  choice: néant
  rationale: Le terme désigne ici la vacuité et l'inconsistance des idoles ; « néant » exprime naturellement en français leur absence de valeur réelle.
- source_word: מַעֲשֵׂה תַּעְתֻּעִים
  choice: une œuvre dérisoire
  rationale: תַּעְתֻּעִים évoque ce qui trompe, égare ou prête à la dérision. Dans ce contexte polémique sur les idoles, « dérisoire » conserve l'idée de ridicule sans imposer le seul sens de « tromperie ».
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: quand viendra le temps de leur châtiment
  rationale: פְּקֻדָּה peut désigner une intervention, une visitation ou un châtiment. Le contexte judiciaire favorise « châtiment », tandis que la tournure temporelle reste naturelle.
- source_word: יֹאבֵדוּ
  choice: ils disparaîtront
  rationale: Le verbe אבד signifie périr ou disparaître. « Disparaîtront » convient aux idoles vouées à être supprimées lors du jugement.
theological_decisions:
- issue: Référent du suffixe dans פְּקֻדָּתָם
  choice: leur châtiment, rapporté aux idoles
  alternative: le temps où leurs fabricants ou leurs peuples seront jugés
  rationale: L'antécédent grammatical immédiat est le pluriel « ils », qui désigne les objets idolâtres ; la traduction maintient ce lien sans développer davantage l'agent du jugement.
- issue: Nuance de תַּעְתֻּעִים
  choice: dérision / caractère dérisoire
  alternative: illusion, tromperie ou œuvre qui égare
  rationale: Le mot est rare et permet plusieurs nuances. « Dérisoire » respecte la lecture contextuelle et la tradition de « mockery », tout en évitant d'attribuer explicitement aux idoles une intention de tromper.
translation_notes:
  register: Français international moderne, sobre et dignifié. La formulation garde le parallélisme bref de l'hébreu et évite un vocabulaire inutilement technique ou confessionnel.
