source:
  edition: WLC
  text: מִ֣י לֹ֤א יִֽרָאֲ/ךָ֙ מֶ֣לֶךְ הַ/גּוֹיִ֔ם כִּ֥י לְ/ךָ֖ יָאָ֑תָה כִּ֣י בְ/כָל חַכְמֵ֧י הַ/גּוֹיִ֛ם וּ/בְ/כָל מַלְכוּתָ֖/ם מֵ/אֵ֥ין כָּמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/007.yaml
  text: Who would not fear you[a], O King of the nations? For this is your due; for among all the wise men of the nations and in all their kingdoms[b], there is none like you.
translation:
  language: fr
  text: 'Qui ne te craindrait pas[a], roi des nations ? Car c’est ce qui te revient[b] : parmi tous les sages des nations et dans tous leurs royaumes, nul n’est comme toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui ne devrait te craindre ? » La question rhétorique hébraïque peut exprimer soit ce qui arriverait, soit ce qui est juste et approprié.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « car cela te convient » ou « car cela t’est dû ». Il s’agit de la crainte qui revient légitimement à Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרָאֲךָ
  choice: ne te craindrait pas
  rationale: La tournure rhétorique מִי לֹא suivie de l’inaccompli peut exprimer aussi bien ce qui arriverait que ce qui devrait arriver. « Craindre » conserve toute la force de ירא, notamment la tension entre crainte et profond respect envers Dieu.
- source_word: מֶלֶךְ הַגּוֹיִם
  choice: roi des nations
  rationale: Cette construction d’annexion désigne directement Dieu par un titre royal universel. « Roi des nations » est précis, naturel et n’ajoute pas d’explication absente de l’hébreu.
- source_word: יָאָתָה
  choice: c’est ce qui te revient
  rationale: Le verbe exprime ce qui convient à quelqu’un ou lui revient à juste titre. La formulation renvoie naturellement, en français, à la crainte évoquée dans la question précédente.
- source_word: חַכְמֵי הַגּוֹיִם
  choice: les sages des nations
  rationale: חכמים désigne ici les personnes réputées sages. « Les sages » est actuel, inclusif au niveau collectif et plus naturel que « les hommes sages », sans modifier la référence du masculin pluriel hébreu.
- source_word: מַלְכוּתָם
  choice: leurs royaumes
  rationale: Dans ce contexte pluriel, le nom désigne le plus naturellement les royaumes ou domaines royaux des nations.
- source_word: מֵאֵין כָּמוֹךָ
  choice: nul n’est comme toi
  rationale: Cette expression idiomatique affirme l’incomparabilité absolue de Dieu. « Nul n’est comme toi » en donne une traduction concise et digne.
- source_word: כִּי ... כִּי
  choice: 'Car ... :'
  rationale: Le premier כִּי introduit la raison pour laquelle la crainte est appropriée; le second fonde cette affirmation sur l’incomparabilité divine. Les deux rapports logiques sont conservés, le second par les deux-points afin d’éviter une répétition lourde en français.
theological_decisions:
- issue: Royauté divine sur les nations
  choice: roi des nations
  alternative: roi qui règne sur les nations
  rationale: Le titre direct de l’hébreu affirme la royauté universelle de Dieu. La traduction la conserve sans explicitation supplémentaire.
- issue: Sens de la crainte de Dieu
  choice: te craindrait
  alternative: te révérerait
  rationale: « Craindre » préserve la catégorie biblique plus forte et maintient la tension entre effroi, respect et révérence, au lieu de la réduire au seul respect.
- issue: Caractère approprié de la crainte
  choice: c’est ce qui te revient
  alternative: cela te convient
  rationale: Le texte présente la crainte comme la réponse qui revient légitimement à Dieu. Cette formulation exprime cette convenance sans introduire une obligation doctrinale plus précise que l’hébreu.
translation_notes:
  register: Français international moderne, courant et digne. La minuscule à « roi » suit l’usage français dans l’apostrophe, tandis que la formulation conserve la solennité du titre. Les deux-points rendent explicitement le lien justificatif du second כִּי sans alourdir la phrase.
