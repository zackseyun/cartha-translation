source:
  edition: WLC
  text: כְּ/תֹ֨מֶר מִקְשָׁ֥ה הֵ֨מָּה֙ וְ/לֹ֣א יְדַבֵּ֔רוּ נָשׂ֥וֹא יִנָּשׂ֖וּא כִּ֣י לֹ֣א יִצְעָ֑דוּ אַל תִּֽירְא֤וּ מֵ/הֶם֙ כִּי לֹ֣א יָרֵ֔עוּ וְ/גַם הֵיטֵ֖יב אֵ֥ין אוֹתָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/005.yaml
  text: They are like a scarecrow in a cucumber field[a], and they cannot speak; they must be carried, because they cannot walk. Do not fear them, for they cannot do harm[b], nor can they do good.
translation:
  language: fr
  text: 'Ils sont comme un épouvantail dans un champ de concombres[a] et ne peuvent pas parler. Il faut les porter, car ils ne peuvent pas marcher. N’ayez pas peur d’eux : ils ne peuvent faire aucun mal, ni aucun bien[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme un poteau dans un champ de melons ». L’image hébraïque est difficile; beaucoup y voient un épouvantail ou un poteau dressé dans une plantation.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et faire du bien n’est pas en eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹמֶר מִקְשָׁה
  choice: comme un épouvantail dans un champ de concombres
  rationale: 'L’expression hébraïque est difficile : תֹמֶר évoque ici vraisemblablement une forme dressée, tandis que מִקְשָׁה désigne une plantation de concombres ou de melons. « Épouvantail » rend naturellement l’image d’un objet immobile dans un champ, sans masquer l’incertitude, signalée en note.'
- source_word: וְלֹא יְדַבֵּרוּ
  choice: et ne peuvent pas parler
  rationale: Dans cette description de l’impuissance des idoles, la négation exprime leur incapacité, et non seulement le fait qu’elles gardent le silence.
- source_word: נָשׂוֹא יִנָּשׂוּא
  choice: Il faut les porter
  rationale: L’infinitif absolu associé au verbe passif souligne la nécessité de les transporter. Cette formulation française est claire et idiomatique.
- source_word: כִּי לֹא יִצְעָדוּ
  choice: car ils ne peuvent pas marcher
  rationale: Le verbe signifie faire des pas ou marcher. Le contexte oppose l’objet porté à un être capable de se déplacer seul.
- source_word: אַל תִּירְאוּ מֵהֶם
  choice: N’ayez pas peur d’eux
  rationale: Cette formulation courante conserve toute la force de l’interdiction prophétique.
- source_word: כִּי לֹא יָרֵעוּ
  choice: ils ne peuvent faire aucun mal
  rationale: Le hiphil de רעע désigne ici le fait de causer du mal. « Aucun mal » exprime clairement l’impuissance totale des idoles.
- source_word: וְגַם הֵיטֵיב אֵין אוֹתָם
  choice: ni aucun bien
  rationale: La construction hébraïque nie qu’elles soient en mesure de faire du bien. La coordination elliptique est naturelle en français et maintient le parallélisme avec « aucun mal ».
theological_decisions:
- issue: Nature de la polémique contre les idoles
  choice: 'Exprimer leur incapacité totale : elles ne peuvent ni parler, ni marcher, ni faire du mal ou du bien.'
  alternative: 'Traduire les négations comme de simples constats : elles ne parlent pas, ne marchent pas et ne font pas de mal.'
  rationale: Le contexte présente les idoles comme des objets inertes fabriqués par des humains. Les formulations avec « ne peuvent pas » communiquent cette impuissance sans ajouter de particularité confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. Le pluriel masculin reprend les objets idolâtriques du contexte. La ponctuation répartit les propositions courtes sans alourdir le rythme; l’ambiguïté de l’image initiale et la tournure particulière de la dernière proposition sont conservées en notes.
