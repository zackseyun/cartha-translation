    text: Certains comprennent « Oufaz » comme une variante du nom « Ophir ».
    reason: Le texte hébreu massorétique lit Oufaz, mais une identification ou variante ancienne avec Ophir est parfois proposée.
  revision_rationale: 'La seule correction est stylistique et syntaxique : « œuvre des mains d’un orfèvre » restitue plus naturellement en français l’expression hébraïque qui souligne la fabrication manuelle. Le texte conserve les noms propres, l’ambiguïté prudente de la note sur Oufaz/Ophir, ainsi que le pluriel contextuel de « ils sont tous ».'
