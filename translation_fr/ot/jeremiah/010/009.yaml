  to: De l’argent martelé est apporté de Tarsis, et de l’or d’Oufaz[a] ; c’est l’œuvre d’un artisan, œuvre des mains d’un orfèvre. Le bleu et la pourpre leur servent de vêtements ; ils sont tous l’œuvre d’artisans habiles.
