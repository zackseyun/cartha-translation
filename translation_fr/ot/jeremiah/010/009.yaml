id: JER.10.9
reference: Jeremiah 10:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֶּ֣סֶף מְרֻקָּ֞ע מִ/תַּרְשִׁ֣ישׁ יוּבָ֗א וְ/זָהָב֙ מֵֽ/אוּפָ֔ז מַעֲשֵׂ֥ה חָרָ֖שׁ וִ/ידֵ֣י צוֹרֵ֑ף תְּכֵ֤לֶת וְ/אַרְגָּמָן֙ לְבוּשָׁ֔/ם מַעֲשֵׂ֥ה חֲכָמִ֖ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/009.yaml
  text: Beaten silver is brought from Tarshish[a], and gold from Uphaz, the work of a craftsman and of the hands of a goldsmith. Blue and purple are their clothing; all of them are the work of skilled men.
translation:
  language: fr
  text: De l’argent martelé est apporté de Tarsis, et de l’or d’Oufaz[a] ; c’est l’œuvre d’un artisan, œuvre des mains d’un orfèvre. Le bleu et la pourpre leur servent de vêtements ; ils sont tous l’œuvre d’artisans habiles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains comprennent « Oufaz » comme une variante du nom « Ophir ».
    reason: Le texte hébreu massorétique lit Oufaz, mais une identification ou variante ancienne avec Ophir est parfois proposée.
lexical_decisions:
- source_word: כֶּסֶף מְרֻקָּע
  choice: argent martelé
  rationale: כֶּסֶף désigne ici le métal précieux, et le participe passif מְרֻקָּע indique qu’il a été battu ou martelé, vraisemblablement en feuilles.
- source_word: מִתַּרְשִׁישׁ יוּבָא
  choice: est apporté de Tarsis
  rationale: Le hofal יוּבָא exprime l’action passive « être apporté » ; Tarsis est conservé comme nom de lieu.
- source_word: וְזָהָב מֵאוּפָז
  choice: et de l’or d’Oufaz[a]
  rationale: Le texte massorétique porte אוּפָז, transcrit « Oufaz ». Le rapprochement possible avec Ophir est signalé en note plutôt qu’introduit dans le texte.
- source_word: מַעֲשֵׂה חָרָשׁ וִידֵי צוֹרֵף
  choice: c’est l’œuvre d’un artisan et des mains d’un orfèvre
  rationale: La formulation conserve l’image hébraïque des « mains » et rend חָרָשׁ par le terme général « artisan », tandis que צוֹרֵף désigne ici un spécialiste du travail des métaux précieux.
- source_word: תְּכֵלֶת וְאַרְגָּמָן לְבוּשָׁם
  choice: Le bleu et la pourpre leur servent de vêtements
  rationale: Les deux termes désignent des couleurs ou étoffes teintes de luxe. Cette formulation française naturelle garde leur fonction d’habillement.
- source_word: מַעֲשֵׂה חֲכָמִים כֻּלָּם
  choice: ils sont tous l’œuvre d’artisans habiles
  rationale: Dans ce contexte, חֲכָמִים qualifie la compétence technique plutôt que la sagesse morale. « Artisans habiles » exprime clairement cette valeur professionnelle.
theological_decisions:
- issue: Portée et référent de כֻּלָּם (« tous »)
  choice: ils sont tous
  alternative: tout cela est
  rationale: Le masculin pluriel est maintenu afin de ne pas réduire le référent aux seules matières mentionnées ; dans le contexte, il renvoie naturellement aux objets cultuels fabriqués, tout en conservant la légère dépendance au contexte de l’hébreu.
- issue: Valeur de חֲכָמִים
  choice: artisans habiles
  alternative: hommes sages
  rationale: Le contexte de fabrication exige une compétence artisanale, non une qualification spirituelle ou morale. Le français « artisans » reste au masculin grammatical sans affirmer au-delà du texte que seuls des hommes sont visés.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve les images concrètes de l’hébreu (« œuvre », « mains ») tout en évitant des tournures inutilement archaïques. Le marqueur [a] est placé après « Oufaz », terme auquel la note se rapporte.
