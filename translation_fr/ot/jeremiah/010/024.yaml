source:
  edition: WLC
  text: יַסְּרֵ֥/נִי יְהוָ֖ה אַךְ בְּ/מִשְׁפָּ֑ט אַל בְּ/אַפְּ/ךָ֖ פֶּן תַּמְעִטֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/024.yaml
  text: Discipline me[a], Yahweh, but with justice, not in your anger[c][b], lest you diminish me.
translation:
  language: fr
  text: Corrige-moi[a], Yahweh, mais avec justice[b], non dans ta colère, de peur que tu ne me diminues[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Discipline-moi » ou « Châtie-moi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avec jugement » ou « selon le droit ». Le terme hébreu peut désigner le jugement, la justice ou ce qui est conforme au droit.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « de peur que tu ne me rendes petit »; ou « que tu ne m’amoindrisses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְּרֵנִי
  choice: Corrige-moi
  rationale: Le piel de יסר exprime ici une action corrective pouvant inclure la discipline. « Corrige-moi » est naturel en français moderne et conserve la demande adressée à Dieu sans recourir au terme vieilli « châtie-moi ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément au texte hébreu, plutôt que remplacé par un titre.
- source_word: אַךְ
  choice: mais
  rationale: 'La particule limite la demande : le locuteur accepte la correction, mais en précise la manière. « Mais » rend clairement cette valeur adversative et restrictive.'
- source_word: בְּמִשְׁפָּט
  choice: avec justice
  rationale: מִשְׁפָּט peut désigner le jugement, la justice ou une juste mesure. Dans le contraste avec la colère, « avec justice » exprime une correction juste et mesurée sans éliminer l’idée de jugement.
- source_word: בְּאַפְּךָ
  choice: dans ta colère
  rationale: אַף désigne couramment la colère. « Dans ta colère » suit la construction hébraïque et reste naturel en français.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure française introduit naturellement le résultat redouté exprimé par פֶּן.
- source_word: תַּמְעִיטֵנִי
  choice: tu ne me réduises à rien
  rationale: Le hiphil de מעט signifie faire devenir petit, diminuer. Dans ce contexte de colère divine redoutée, « réduire à rien » rend la portée potentiellement dévastatrice de l’expression, tout en signalant en note la formulation plus littérale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. La translittération préserve le caractère personnel du nom divin sans lui substituer un titre.
- issue: Nuance de מִשְׁפָּט dans la demande de correction
  choice: avec justice
  alternative: selon le jugement / avec une juste mesure
  rationale: Le verset oppose une correction juste à une intervention dictée par la colère. Ce choix maintient ensemble la réalité de la discipline et la demande qu’elle ne soit pas destructrice.
- issue: Portée de תַּמְעִיטֵנִי
  choice: tu ne me réduises à rien
  alternative: tu ne m’amoindrisses / tu ne me diminues
  rationale: La formulation principale exprime la gravité du résultat redouté sans affirmer explicitement l’anéantissement; la note conserve le sens lexical plus littéral et l’ambiguïté d’intensité.
translation_notes:
  register: Français international moderne, digne et direct. L’impératif « Corrige-moi » est accessible sans être familier. « De peur que… ne » relève d’un registre soutenu mais courant dans une prière biblique; le « ne » y est explétif. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
