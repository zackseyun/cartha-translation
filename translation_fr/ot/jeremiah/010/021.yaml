source:
  edition: WLC
  text: כִּ֤י נִבְעֲרוּ֙ הָֽ/רֹעִ֔ים וְ/אֶת יְהוָ֖ה לֹ֣א דָרָ֑שׁוּ עַל כֵּן֙ לֹ֣א הִשְׂכִּ֔ילוּ וְ/כָל מַרְעִיתָ֖/ם נָפֽוֹצָה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/021.yaml
  text: For the shepherds have become stupid[a], and they have not sought Yahweh; therefore they have not acted wisely[c][b], and all their flock is scattered.
translation:
  language: fr
  text: Car les bergers[b] sont devenus stupides[a] et n’ont pas cherché Yahweh ; c’est pourquoi ils n’ont pas agi avec sagesse[c], et tout leur troupeau s’est dispersé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « privés de bon sens » ou « abrutis ».
    reason: lexical_alternative
  - marker: b
    text: Les « bergers » représentent probablement les dirigeants du peuple; le « troupeau » désigne alors ceux dont ils avaient la charge.
    reason: cultural_note
  - marker: c
    text: Ou « n’ont pas réussi ». Le verbe hébreu peut évoquer à la fois une conduite avisée et la réussite qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעֲרוּ
  choice: sont devenus stupides
  rationale: Le niphal de בער exprime ici un état d’abrutissement ou de profonde déraison. « Sont devenus stupides » garde la vigueur du reproche prophétique dans un français actuel.
- source_word: הָרֹעִים
  choice: les bergers
  rationale: La métaphore concrète est conservée; dans Jérémie, elle désigne vraisemblablement les dirigeants du peuple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin présent dans le texte hébreu.
- source_word: דָרָשׁוּ
  choice: ont cherché
  rationale: דרש peut signifier chercher Dieu, s’adresser à lui ou le consulter. « Chercher » conserve cette amplitude relationnelle et pratique.
- source_word: עַל־כֵּן
  choice: C’est pourquoi
  rationale: Cette tournure française naturelle marque clairement la conséquence.
- source_word: הִשְׂכִּילוּ
  choice: ont agi avec sagesse
  rationale: Le hiphil de שכל associe la conduite avisée à la réussite qui peut en résulter. Le contexte causal met au premier plan le défaut de discernement dans l’action.
- source_word: מַרְעִיתָם
  choice: leur troupeau
  rationale: Bien que le nom puisse désigner le pâturage ou ce qui est mené au pâturage, le parallèle avec les « bergers » favorise ici le sens collectif de « troupeau ».
- source_word: נָפוֹצָה
  choice: a été dispersé
  rationale: Le verbe פוץ décrit la dispersion du troupeau comme résultat de la faute des bergers; le singulier s’accorde avec le collectif.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: « Yahweh » préserve dans le corps du texte le nom propre divin plutôt que de le remplacer par un titre.
- issue: Identification des « bergers »
  choice: Maintien de la métaphore dans le texte, avec explication en note
  alternative: les dirigeants
  rationale: Le texte source dit littéralement « bergers ». La note indique la portée politique probable sans effacer l’image ni imposer une catégorie précise de responsables.
translation_notes:
  register: Français international moderne, direct et digne. La forte accusation portée par נִבְעֲרוּ est conservée sans archaïsme. La métaphore pastorale reste visible, tandis que les notes signalent sa portée et l’ambivalence de הִשְׂכִּילוּ.
