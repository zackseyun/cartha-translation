  yaml_path: translation/ot/jeremiah/010/019.yaml
  text: Woe is me because of my brokenness[a]; my wound is grievous. But I said, “Surely this is my sickness[c][b], and I must bear it.”
translation:
  language: fr
  text: 'Malheur à moi, à cause de mon désastre ! Ma plaie est grave. Mais je me suis dit : « Certes, c’est là mon mal ; je le porterai. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: א֥וֹי לִי
  choice: Malheur à moi !
  rationale: Cette exclamation rend avec force et dignité le cri de détresse exprimé par אוי לי.
- source_word: עַל שִׁבְרִי
  choice: Je suis brisé
  rationale: שׁבר évoque une fracture, une blessure ou un désastre. La formulation française naturelle « je suis brisé » conserve à la fois l’image corporelle et la portée plus large de la dévastation, tandis que עַל est exprimé idiomatiquement par la construction exclamative.
- source_word: נַחְלָה מַכָּתִי
  choice: ma blessure est grave
  rationale: מַכָּה désigne une blessure ou un coup, et נַחְלָה indique ici qu’elle est malade, affaiblie ou sérieuse. « Grave » exprime la sévérité sans imposer le sens plus précis d’« incurable ».
- source_word: אַךְ
  choice: Pourtant… C’est bien là
  rationale: Dans le contexte, אַךְ marque le constat résigné du locuteur. « Pourtant » assure la transition, tandis que « bien » porte la nuance d’affirmation.
- source_word: חֳלִי
  choice: mon mal
  rationale: חֳלִי signifie maladie ou souffrance. « Mon mal » préserve l’ambivalence entre affection physique et affliction, tout en restant naturel en français.
- source_word: וְאֶשָּׂאֶנּוּ
  choice: et je dois le supporter
  rationale: נשׂא signifie porter ou supporter. Dans ce contexte de résignation, « je dois le supporter » exprime la nécessité assumée, sans dissimuler en note la possibilité d’un simple futur.
