revisions:
- from: 'Malheur à moi ! Je suis brisé[a] ; ma blessure est grave[b]. Pourtant, je me suis dit : « C’est bien là mon mal, et je dois le supporter[c]. »'
  to: 'Malheur à moi, à cause de mon désastre ! Ma plaie est grave. Mais je me suis dit : « Certes, c’est là mon mal ; je le porterai. »'
  rationale: La révision rétablit la relation causale de la première ligne, rend la valeur affirmative de אַךְ sans contraste artificiel, et laisse ouverte la nuance de l’imparfait final. Les notes ont été adaptées au texte révisé et conservent les alternatives lexicales et modales pertinentes.
