base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/025.yaml
  text: Pour out your wrath on the nations that do not know you[a], and on the clans that do not call on your name; for they have devoured Jacob, they have devoured him and consumed him, and they have laid waste his habitation.
translation:
  language: fr
  text: Déverse ta fureur sur les nations qui ne te connaissent pas, et sur les clans qui n’invoquent pas ton nom, car ils ont dévoré Jacob ; ils l’ont dévoré, ils l’ont anéanti, et ils ont dévasté sa demeure.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son pâturage » ou « son lieu de séjour » ; le mot hébreu peut désigner un pâturage aussi bien qu’une demeure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפֹךְ חֲמָתְךָ
  choice: Déverse ta fureur
  rationale: L’impératif conserve l’image énergique d’un liquide répandu. « Fureur » exprime ici l’intensité de חֵמָה dans une prière de jugement, avec un français naturel et digne.
- source_word: הַגּוֹיִם אֲשֶׁר לֹא יְדָעוּךָ
  choice: les nations qui ne te connaissent pas
  rationale: « Nations » évite le sens technique plus tardif de « païens ». « Connaître » maintient la formulation directe et sa possible portée relationnelle sans l’expliciter abusivement.
- source_word: מִשְׁפָּחוֹת
  choice: les clans
  rationale: Le terme désigne des groupes de parenté plus larges que la famille domestique ; « clans » préserve cette nuance et le parallélisme avec les nations.
- source_word: בְּשִׁמְךָ לֹא קָרָאוּ
  choice: qui n’invoquent pas ton nom
  rationale: L’expression קרא בשם désigne ici le fait d’invoquer Dieu, notamment dans la prière ou le culte. « Invoquer » est idiomatique et précis en français.
- source_word: אָכְלוּ אֶת יַעֲקֹב וַאֲכָלֻהוּ
  choice: ils ont dévoré Jacob ; ils l’ont dévoré
  rationale: La répétition du même verbe hébreu est conservée afin de rendre l’insistance rhétorique et la violence de l’image.
- source_word: וַיְכַלֻּהוּ
  choice: ils l’ont anéanti
  rationale: Le verbe ajoute l’idée d’achever, d’épuiser entièrement ou de faire disparaître. « Anéanti » marque cette progression après « dévoré » sans introduire un registre familier.
- source_word: נָוֵהוּ
  choice: sa demeure
  rationale: נָוֶה peut désigner un pâturage, un séjour ou une demeure. Dans ce contexte de dévastation nationale, « demeure » convient naturellement tout en laissant l’autre sens dans une note.
- source_word: הֵשַׁמּוּ
  choice: ils ont dévasté
  rationale: La forme causative signifie rendre désert ou désolé. « Dévaster » est un équivalent français courant qui conserve la gravité de l’action.
theological_decisions:
- issue: Prière imprécatoire demandant le jugement des peuples étrangers
  choice: 'Conserver sans atténuation la demande directe : « Déverse ta fureur »'
  alternative: Transformer la demande en simple annonce du jugement ou affaiblir « fureur » en « mécontentement »
  rationale: L’hébreu formule explicitement une demande adressée à Dieu. La traduction doit préserver cette tension théologique plutôt que la neutraliser.
- issue: Sens de « ne pas connaître » Dieu
  choice: Traduire littéralement « qui ne te connaissent pas »
  alternative: Expliciter par « qui ne te reconnaissent pas comme Dieu »
  rationale: Le verbe peut impliquer connaissance relationnelle et reconnaissance, mais le texte ne précise pas davantage ; la formulation retenue conserve cette amplitude.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le tutoiement correspond à l’adresse directe à Dieu. La répétition volontaire de « ils ont dévoré » reproduit l’insistance de l’hébreu. Le marqueur [a] est placé après « sa demeure », le terme auquel se rapporte la note.
