id: JER.10.20
reference: Jeremiah 10:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָהֳלִ֣/י שֻׁדָּ֔ד וְ/כָל מֵיתָרַ֖/י נִתָּ֑קוּ בָּנַ֤/י יְצָאֻ֨/נִי֙ וְ/אֵינָ֔/ם אֵין נֹטֶ֥ה עוֹד֙ אָהֳלִ֔/י וּ/מֵקִ֖ים יְרִיעוֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/020.yaml
  text: My tent is destroyed[a], and all my ropes are torn away. My sons have gone from me, and they are no more[d][c][b]. There is no one left to stretch out my tent again and set up my curtains.
translation:
  language: fr
  text: Ma tente est dévastée[a], et toutes mes cordes sont arrachées. Mes fils m’ont quittée[b] et ne sont plus là. Il n’y a plus personne pour dresser ma tente et en tendre les toiles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pillée » ou « détruite ». Le verbe hébreu peut évoquer aussi bien le pillage que la dévastation violente.
    reason: lexical_alternative
  - marker: b
    text: « Mes fils » peut désigner les enfants au sens propre ou, dans cette personnification, le peuple ou les habitants qui sont partis.
    reason: cultural_note
lexical_decisions:
- source_word: אָהֳלִי
  choice: ma tente
  rationale: Le sens concret de « tente » maintient l’image filée par les cordes, l’action de tendre et les toiles.
- source_word: שֻׁדָּד
  choice: est dévastée
  rationale: Le passif évoque une ruine violente, voire un pillage. « Dévastée » rend cette violence sans réduire le sens au seul vol de biens.
- source_word: מֵיתָרַי
  choice: mes cordes
  rationale: Il s’agit des cordes qui maintiennent une tente; « cordes » est précis et naturel en français contemporain.
- source_word: נִתָּקוּ
  choice: sont arrachées
  rationale: Le verbe exprime le détachement ou la rupture; « arrachées » convient à des cordes violemment détachées.
- source_word: בָּנַי
  choice: mes fils
  rationale: Le nom hébreu est explicitement masculin pluriel. La traduction conserve cette forme tout en laissant ouverte sa portée littérale ou collective.
- source_word: יְצָאֻנִי
  choice: m’ont quittée
  rationale: La tournure exprime le départ loin de la locutrice. L’accord féminin suit la personnification implicite de la ville ou de la communauté sans la nommer dans le texte.
- source_word: וְאֵינָם
  choice: et ne sont plus là
  rationale: Cette formulation exprime leur absence présente sans conclure qu’ils sont nécessairement morts.
- source_word: אֵין נֹטֶה עוֹד אָהֳלִי
  choice: Il ne reste personne pour tendre de nouveau ma tente
  rationale: « Tendre » garde le geste concret du montage d’une tente, tandis que « de nouveau » rend עוֹד dans le contexte de sa destruction.
- source_word: יְרִיעוֹתַי
  choice: mes toiles
  rationale: Le mot désigne les grandes pièces d’étoffe formant la tente. « Toiles » est plus naturel ici que « rideaux » et préserve l’image matérielle.
- source_word: וּמֵקִים
  choice: et dresser
  rationale: « Dresser » est le verbe idiomatique pour mettre en place les éléments d’une tente et rend l’idée de faire tenir debout.
theological_decisions:
- issue: Identité des « fils »
  choice: Conserver « mes fils » sans explicitation dans le corps du verset
  alternative: Traduire par « mes enfants » ou « mes habitants »
  rationale: L’hébreu dit littéralement « mes fils », mais dans la personnification poétique ils peuvent représenter les habitants ou le peuple. Le texte conserve cette tension et la note signale l’ambiguïté.
- issue: Portée de וְאֵינָם
  choice: « ne sont plus là »
  alternative: « ne sont plus »
  rationale: La formule retenue affirme l’absence sans imposer l’idée de mort, ce qui convient également à un contexte de départ ou d’exil.
translation_notes:
  register: Français international actuel, sobre et poétique. La métaphore cohérente de la tente est conservée avec « tente », « cordes », « tendre », « dresser » et « toiles ». Le féminin de « quittée » laisse entendre la voix personnifiée de la ville ou de la communauté.
