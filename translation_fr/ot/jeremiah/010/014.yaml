source:
  edition: WLC
  text: נִבְעַ֤ר כָּל אָדָם֙ מִ/דַּ֔עַת הֹבִ֥ישׁ כָּל צוֹרֵ֖ף מִ/פָּ֑סֶל כִּ֛י שֶׁ֥קֶר נִסְכּ֖/וֹ וְ/לֹא ר֥וּחַ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/014.yaml
  text: Every man is stupid[a], without knowledge; every metalworker is put to shame by his idol, for his cast image is a lie[c][b], and there is no breath in them.
translation:
  language: fr
  text: Tout être humain est stupide, privé de connaissance[a] ; tout artisan du métal est couvert de honte à cause de l’idole sculptée, car son image coulée est un mensonge, et il n’y a en elles aucun souffle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « faute de connaissance ». La préposition hébraïque peut marquer soit la privation, soit la cause.'
    reason: lexical_alternative
  - marker: b
    text: Ou « aucun esprit ». Le mot hébreu peut désigner le souffle ou l’esprit ; ici, il souligne que les idoles sont sans vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעַר
  choice: est stupide
  rationale: Le niphal de בער exprime ici l’abrutissement ou l’absence de discernement, et non un simple manque d’information. « Est stupide » en restitue directement la vigueur polémique en français moderne.
- source_word: כָּל אָדָם
  choice: Tout être humain
  rationale: אָדָם désigne ici l’être humain de façon générique, avec la portée distributive de כָּל. Cette formulation naturelle conserve l’universalité grammaticale sans limiter indûment le propos aux hommes de sexe masculin.
- source_word: מִדַּעַת
  choice: privé de connaissance
  rationale: La préposition מִן peut être comprise comme privative ou causale. Le choix principal exprime la privation, tout en signalant en note la lecture causale possible.
- source_word: הֹבִישׁ
  choice: est couvert de honte
  rationale: Le hiphil de בוש indique que l’artisan se trouve honteusement confondu. Cette tournure française convient au résultat exprimé dans le contexte.
- source_word: צוֹרֵף
  choice: artisan du métal
  rationale: Le terme désigne celui qui affine, fond ou travaille le métal. « Artisan du métal » reste assez large pour inclure la fabrication d’images sans imposer le sens plus étroit d’orfèvre.
- source_word: מִפָּסֶל
  choice: à cause de l’idole sculptée
  rationale: מִן a ici une valeur causale probable, et פֶּסֶל désigne une image fabriquée à usage idolâtre, souvent sculptée. Le français rend explicitement la fonction cultuelle et le mode de fabrication.
- source_word: שֶׁקֶר
  choice: un mensonge
  rationale: Le nom désigne la fausseté ou la tromperie. « Un mensonge » conserve la force concrète de la polémique prophétique.
- source_word: נִסְכּוֹ
  choice: son image coulée
  rationale: Le mot renvoie à une image de métal obtenue par coulée. Le suffixe possessif est rendu par « son », et « image coulée » est clair en français contemporain.
- source_word: וְלֹא רוּחַ בָּם
  choice: et il n’y a en elles aucun souffle
  rationale: רוּחַ peut signifier souffle, esprit ou vent. Ici, « souffle » souligne que les idoles sont sans vie. Le féminin pluriel « elles » reprend collectivement les images idolâtres malgré les formes singulières précédentes.
theological_decisions:
- issue: Portée de l’accusation contre l’humanité et les idoles
  choice: Le verset dénonce, dans le cadre immédiat de la polémique contre l’idolâtrie, l’absence de discernement humain et le caractère mensonger et inerte des idoles.
  alternative: On pourrait isoler la première proposition et y voir une affirmation générale sur toute l’humanité sous tous ses rapports.
  rationale: La répétition de « tout » donne aux formules une vaste portée, mais le contexte et les propositions sur l’artisan et l’image fabriquée orientent précisément l’accusation vers l’idolâtrie. La traduction conserve cette tension sans transformer le verset en énoncé doctrinal abstrait.
- issue: Sens de רוּחַ dans les idoles
  choice: « Souffle » exprime leur absence de vie.
  alternative: « Esprit » est également possible sur le plan lexical.
  rationale: Dans cette polémique, l’opposition principale est entre une fabrication matérielle et un être vivant. « Souffle » rend ce point sans nier l’éventail sémantique du terme hébreu, indiqué en note.
translation_notes:
  register: Français international moderne, direct et digne. La rudesse de « stupide » et de « mensonge » conserve la vigueur de l’hébreu prophétique. La ponctuation maintient le parallélisme des propositions, et les notes préservent les ambiguïtés réelles de מִן et de רוּחַ.
