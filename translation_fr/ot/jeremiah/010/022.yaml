  text: ק֤וֹל שְׁמוּעָה֙ הִנֵּ֣ה בָאָ֔ה וְ/רַ֥עַשׁ גָּד֖וֹל מֵ/אֶ֣רֶץ צָפ֑וֹן לָ/שׂ֞וּם אֶת עָרֵ֧י יְהוּדָ֛ה שְׁמָמָ֖ה מְע֥וֹן תַּנִּֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/022.yaml
  text: The sound of a report—look, it is coming!—a great commotion from the land of the north, to make the cities of Judah a desolation, a haunt of jackals.
translation:
  language: fr
  text: 'Le bruit d’une nouvelle : la voici qui arrive ! Un grand fracas vient du pays du Nord, pour faire des villes de Juda une désolation, un repaire de chacals.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֤וֹל שְׁמוּעָה֙
  choice: Un bruit se fait entendre
  rationale: קול désigne un son ou une voix, et שמועה ce qui est entendu, une nouvelle ou une rumeur. Cette formulation française naturelle conserve ici l'annonce auditive sans préciser abusivement s'il s'agit d'une nouvelle ou du bruit de l'armée.
- source_word: הִנֵּ֣ה בָאָ֔ה
  choice: le voici qui arrive !
  rationale: הנה attire vivement l'attention, tandis que le féminin בָאָה renvoie probablement à שמועה. La tournure restitue l'imminence et l'effet d'alerte.
- source_word: רַ֥עַשׁ גָּד֖וֹל
  choice: Un grand fracas
  rationale: רעש évoque un bruit violent, un tumulte ou un ébranlement. « Fracas » convient au contexte d'une invasion imminente.
- source_word: שְׁמָמָה
  choice: un lieu dévasté
  rationale: Le nom exprime la dévastation et l'abandon qui en résulte. La formulation reste concrète et idiomatique en français.
- source_word: מְע֥וֹן תַּנִּֽים
  choice: un repaire de chacals
  rationale: מעון est une demeure ou un refuge; תנים désigne vraisemblablement des chacals dans ce contexte de ruines désertes.
theological_decisions: []
translation_notes:
  register: Style prophétique vif et solennel, en français moderne. La ponctuation rend l'alerte et la progression du verset sans ajouter d'explication interprétative.
