id: JER.10.2
reference: Jeremiah 10:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֶל דֶּ֤רֶךְ הַ/גּוֹיִם֙ אַל תִּלְמָ֔דוּ וּ/מֵ/אֹת֥וֹת הַ/שָּׁמַ֖יִם אַל תֵּחָ֑תּוּ כִּֽי יֵחַ֥תּוּ הַ/גּוֹיִ֖ם מֵ/הֵֽמָּה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/002.yaml
  text: 'Thus says Yahweh: Do not learn the way of the nations[a], and do not be dismayed at the signs of the heavens, because the nations are dismayed at them.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « N’apprenez pas la voie des nations et ne soyez pas effrayés par les signes du ciel[a], car les nations en sont effrayées. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les présages célestes ».'
    reason: Le mot hébreu peut désigner des signes interprétés comme des présages.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, naturelle et digne en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé directement dans le texte hébreu.
- source_word: דֶּרֶךְ הַגּוֹיִם
  choice: la voie des nations
  rationale: « Voie » conserve l’image hébraïque tout en désignant ici la conduite et les pratiques; « nations » évite les connotations plus tardives de « païens » ou « gentils ».
- source_word: אַל תִּלְמָדוּ
  choice: N’apprenez pas
  rationale: Rend directement le verbe « apprendre » sans expliciter à l’excès l’idée contextuelle d’adopter ou d’imiter.
- source_word: מֵאֹתוֹת הַשָּׁמַיִם
  choice: par les signes du ciel
  rationale: « Signes » préserve la portée du terme, qui peut désigner des phénomènes interprétés comme des présages; « ciel » est idiomatique en français.
- source_word: תֵּחָתּוּ / יֵחַתּוּ
  choice: soyez effrayés / sont effrayées
  rationale: Exprime clairement la peur déstabilisante portée par le verbe חתה et maintient la répétition de l’hébreu.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français le motif de l’interdiction.
- source_word: מֵהֵמָּה
  choice: en
  rationale: Le pronom reprend idiomatiquement « les signes du ciel » dans « en sont effrayées ».
theological_decisions:
- issue: Sens de גּוֹיִם dans la dénonciation de pratiques étrangères
  choice: nations
  alternative: païens; gentils
  rationale: Le terme désigne ici les peuples autres qu’Israël. « Nations » reste neutre, proche de l’hébreu et dépourvu d’associations confessionnelles ajoutées.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Nature des « signes du ciel »
  choice: signes du ciel
  alternative: présages célestes
  rationale: La traduction principale conserve le lexème général « signes », tandis que la note signale sa valeur probable de présages dans ce contexte sans réduire le texte à cette seule interprétation.
translation_notes:
  register: Français international moderne, avec une tenue prophétique sobre. La structure parallèle et la répétition de « effrayés » sont conservées; les guillemets français délimitent la parole divine.
