source:
  edition: WLC
  text: מֵ/אֵ֥ין כָּמ֖וֹ/ךָ יְהוָ֑ה גָּד֥וֹל אַתָּ֛ה וְ/גָד֥וֹל שִׁמְ/ךָ֖ בִּ/גְבוּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/006.yaml
  text: There is none like you[a], O Yahweh; you are great, and your name is great in might.
translation:
  language: fr
  text: Nul n’est comme toi, Yahvé[a] ! Tu es grand, et ton nom est grand en puissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom divin, traditionnellement rendu en français par « le SEIGNEUR » ou « l’ÉTERNEL » ; ici transcrit « Yahvé ».'
    reason: Signaler le nom divin présent dans l’hébreu et la convention de traduction traditionnelle.
lexical_decisions:
- source_word: מֵאֵין כָּמוֹךָ
  choice: Nul n’est comme toi
  rationale: L’expression hébraïque nie l’existence de tout être comparable à Yahvé. « Nul n’est comme toi » conserve l’adresse personnelle et la concision poétique.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le texte porte le nom divin YHWH. « Yahvé » est sa transcription française courante, plutôt que la substitution traditionnelle par un titre.
- source_word: גָּדוֹל אַתָּה
  choice: Tu es grand
  rationale: Cette formulation naturelle en français restitue directement l’adjectif attribut et l’affirmation de la grandeur divine.
- source_word: וְגָדוֹל שִׁמְךָ
  choice: et ton nom est grand
  rationale: Le choix maintient le parallélisme avec la proposition précédente et conserve « nom », qui peut aussi évoquer la renommée et le caractère de la personne.
- source_word: בִּגְבוּרָה
  choice: en puissance
  rationale: La préposition בְּ peut ici exprimer le domaine ou la manifestation. « En puissance » garde la densité de l’hébreu sans expliciter indûment « par tes hauts faits » ni ajouter un possessif absent du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR / l’ÉTERNEL
  rationale: Le verset emploie directement le tétragramme. La transcription « Yahvé » préserve le caractère de nom propre, tandis qu’une note signale la convention française traditionnelle.
- issue: Portée de בִּגְבוּרָה
  choice: en puissance
  alternative: par ta puissance / par des actes puissants
  rationale: L’hébreu ne précise pas explicitement le possesseur de la puissance ni des actes particuliers. Le rendu retenu préserve cette concision et cette légère indétermination.
translation_notes:
  register: Français moderne, digne et poétique. « Nul » convient au registre biblique sans être archaïque ; le parallélisme et la brièveté de l’hébreu sont conservés.
