  text: בְּ/כֶ֥סֶף וּ/בְ/זָהָ֖ב יְיַפֵּ֑/הוּ בְּ/מַסְמְר֧וֹת וּ/בְ/מַקָּב֛וֹת יְחַזְּק֖וּ/ם וְ/ל֥וֹא יָפִֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/004.yaml
  text: They decorate it with silver and with gold[b][a]; they fasten it with nails and with hammers so that it will not totter.
translation:
  language: fr
  text: On l’orne d’argent et d’or ; on le fixe solidement[a] avec des clous et des marteaux, afin qu’il ne vacille pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « on les fixe solidement » ou « on les affermit » ; le suffixe hébreu est pluriel, et son référent est incertain.'
    reason: textual_grammatical_ambiguity
  - marker: b
    text: 'Ou : « afin qu’il ne bouge pas » ou « afin qu’il ne soit pas ébranlé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: d’argent et d’or
  rationale: Les prépositions ב indiquent ici vraisemblablement la matière ou le moyen de l’ornementation. La tournure française « d’argent et d’or » est naturelle et garde le parallélisme des deux métaux.
- source_word: יְיַפֵּהוּ
  choice: on l’embellit
  rationale: Le piel de יפה signifie « rendre beau, orner ». « Embellir » restitue directement l’action sans ajouter de détail sur la manière de décorer.
- source_word: בְּמַסְמְרוֹת וּבְמַקָּבוֹת
  choice: avec des clous et des marteaux
  rationale: מסמרות désigne des clous ou des chevilles, et מקבות des marteaux ou maillets. Dans cette scène de fabrication, les équivalents usuels « clous » et « marteaux » sont clairs.
- source_word: יְחַזְּקוּם
  choice: on le consolide
  rationale: Le piel de חזק exprime ici l’action d’affermir ou de rendre stable. Le suffixe massorétique est pluriel (« les »), alors que l’objet décrit dans le contexte immédiat est singulier ; le texte principal suit le référent contextuel, et la note conserve la forme hébraïque.
- source_word: וְלֹא יָפִיק
  choice: pour qu’il ne vacille pas
  rationale: Après l’action de consolider, וְלֹא peut naturellement exprimer le but ou le résultat. יפיק évoque ici l’instabilité ou l’oscillation ; « vaciller » maintient la force satirique du contexte.
theological_decisions:
- issue: Portée satirique de la description de l’idole
  choice: Décrire un objet qu’il faut embellir puis stabiliser pour l’empêcher de vaciller
  alternative: Présenter de façon plus neutre les étapes de fabrication d’un objet cultuel
  rationale: Le contexte de Jérémie 10.3-5 tourne en dérision l’objet fabriqué, dépourvu d’autonomie. La traduction conserve cette satire sans expliciter davantage que le texte.
- issue: Nombre du complément de יְחַזְּקוּם
  choice: Employer le singulier dans le texte principal et signaler le pluriel hébreu en note
  alternative: Traduire formellement « on les consolide », malgré l’absence d’un antécédent pluriel clair dans la phrase
  rationale: Le suffixe consonantique et massorétique est pluriel, mais le contexte parle de l’objet au singulier. La note préserve cette tension textuelle au lieu de la masquer.
translation_notes:
  register: Français international moderne, sobre et digne. Le pronom indéfini « on » rend naturellement le pluriel impersonnel hébreu. « Embellit », « consolide » et « vacille » restent accessibles tout en conservant le relief ironique du passage.
