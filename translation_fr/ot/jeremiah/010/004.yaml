  rationale: La révision remplace « consolider » par « fixer solidement », plus exact et plus naturel avec des clous et des marteaux. Elle conserve le singulier contextuel dans le texte français tout en documentant avec davantage de précision l’ambiguïté du suffixe pluriel hébreu. Les deux notes sont ancrées aux expressions auxquelles elles se rapportent.
