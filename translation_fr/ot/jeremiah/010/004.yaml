  source_fidelity: Le premier verbe rend bien יְיַפֵּהוּ (« orner/embellir ») et la finale « afin qu’il ne vacille pas » exprime adéquatement l’idée d’instabilité de יָפִיק. En revanche, « consolider » est moins précis dans ce contexte artisanal que « fixer solidement ». Le suffixe pluriel de יְחַזְּקוּם est réel, mais son référent demeure difficile; le singulier contextuel peut être conservé dans le texte, à condition que la note indique l’ambiguïté sans prétendre la résoudre.
  naturalness: « Orner d’argent et d’or » et « fixer solidement avec des clous et des marteaux » sont des formulations modernes, claires et idiomatiques. « Afin que » convient au registre biblique sobre sans être archaïque.
  terminology: « Orner », « clous », « marteaux » et « vaciller » sont justes et ne surinterprètent pas la satire du contexte. La note grammaticale doit présenter le pluriel hébreu comme une difficulté de référent, plutôt que de l’identifier implicitement à un objet singulier.
