  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י קוֹלֵ֛עַ אֶת יוֹשְׁבֵ֥י הָ/אָ֖רֶץ בַּ/פַּ֣עַם הַ/זֹּ֑את וַ/הֲצֵר֥וֹתִי לָ/הֶ֖ם לְמַ֥עַן יִמְצָֽאוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/018.yaml
  text: 'For thus says Yahweh: Behold[a], I am slinging out the inhabitants of the land at this time[c][b], and I will press them hard so that they may be found.'
translation:
  language: fr
  text: 'Car ainsi parle Yahvé : « Voici, cette fois-ci, je vais projeter les habitants du pays[b] comme avec une fronde[a] ; je les mettrai à l’étroit, afin qu’ils trouvent[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le verbe évoque l’action de lancer avec une fronde ; on pourrait aussi traduire « projeter au loin » ou « chasser violemment ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les habitants de la terre », si l’expression est comprise dans un sens plus large.
    reason: alternative_reading
  - marker: c
    text: 'La dernière proposition est difficile et elliptique : le verbe est actif (« qu’ils trouvent »), mais son objet n’est pas exprimé. Autres compréhensions possibles : « afin qu’ils le ressentent » ou « afin qu’ils soient pris ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin personnel sous sa forme française courante et en préserve la référence d’alliance.
- source_word: הִנְנִי
  choice: 'Me voici : je vais'
  rationale: Rend l’insistance et l’immédiateté de la formule hébraïque, tout en introduisant naturellement en français l’action imminente exprimée par le participe.
- source_word: קוֹלֵעַ
  choice: lancer au loin comme avec une fronde
  rationale: Conserve l’image concrète et violente de la fronde, qu’un simple « chasser » ou « jeter dehors » effacerait.
- source_word: יוֹשְׁבֵי הָאָרֶץ
  choice: les habitants du pays
  rationale: Dans le contexte, אֶרֶץ désigne vraisemblablement le pays de Juda; « pays » évite d’universaliser indûment la portée du jugement.
- source_word: בַּפַּעַם הַזֹּאת
  choice: cette fois
  rationale: Expression française naturelle qui conserve la valeur temporelle et circonstancielle de la formule.
- source_word: וַהֲצֵרוֹתִי
  choice: je vais les serrer de près
  rationale: Le causatif de צור évoque la détresse par resserrement ou contrainte; cette formulation garde cette image sans préciser abusivement qu’il s’agit d’un siège.
- source_word: לְמַעַן יִמְצָאוּ
  choice: afin qu’on les trouve
  rationale: La forme hébraïque est difficile et sans objet explicite. La tournure française conserve une lecture passive possible et évite d’ajouter « cela ».
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: le pays
  alternative: la terre
  rationale: Le contexte immédiat vise les habitants de Juda; « le pays » préserve cette portée probable sans exclure la polysémie du terme hébreu.
- issue: Sens de לְמַעַן יִמְצָאוּ
  choice: afin qu’on les trouve
  alternative: afin qu’ils le ressentent / afin qu’ils soient pris
  rationale: La finale est elliptique et discutée. Le texte principal en garde l’étrangeté et n’introduit pas d’objet absent de l’hébreu; la note signale les principales compréhensions possibles.
translation_notes:
  register: Français international moderne, digne et accessible. L’image vive de la fronde est explicitée sans devenir familière. La syntaxe conserve volontairement une certaine étrangeté dans la proposition finale, conformément à l’ambiguïté de l’hébreu.
