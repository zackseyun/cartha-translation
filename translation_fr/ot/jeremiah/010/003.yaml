revisions:
- from: 'Car les coutumes des peuples ne sont que vanité : on coupe un arbre dans la forêt, ouvrage des mains d’un artisan qui se sert d’une hache[a].'
  to: 'Car les coutumes des peuples ne sont que vanité : on abat un arbre de la forêt, puis les mains d’un artisan le façonnent avec une hache[a].'
  rationale: La révision remplace « dans la forêt » par « de la forêt » afin de rendre la provenance marquée par מִן. Elle rend également explicite, en français idiomatique, la fabrication humaine exprimée par « ouvrage des mains d’un artisan », sans introduire d’interprétation doctrinale. La relation explicative du second כִּי est naturellement conservée par les deux-points.
