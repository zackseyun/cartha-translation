source:
  edition: WLC
  text: כִּֽי חֻקּ֥וֹת הָֽ/עַמִּ֖ים הֶ֣בֶל ה֑וּא כִּֽי עֵץ֙ מִ/יַּ֣עַר כְּרָת֔/וֹ מַעֲשֵׂ֥ה יְדֵ֥י חָרָ֖שׁ בַּֽ/מַּעֲצָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/003.yaml
  text: For the customs of the peoples are vanity[a], for a tree is cut from the forest, the work of the hands of a craftsman with an axe.
translation:
  language: fr
  text: 'Car les coutumes des peuples ne sont que vanité : on abat un arbre de la forêt, puis les mains d’un artisan le façonnent avec une hache[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec une herminette » ; le terme hébreu désigne un outil servant à couper ou à façonner le bois, mais l’instrument précis est incertain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקּוֹת
  choice: coutumes
  rationale: Dans ce contexte polémique visant les usages religieux des peuples, « coutumes » exprime des pratiques établies plutôt que des prescriptions juridiques formelles.
- source_word: הָעַמִּים
  choice: des peuples
  rationale: « Peuples » conserve la pluralité ethnique du terme hébreu sans suggérer nécessairement des États modernes.
- source_word: הֶבֶל
  choice: ne sont que vanité
  rationale: הֶבֶל évoque littéralement le souffle ou la vapeur, puis ce qui est vide, futile ou sans valeur. « Ne sont que vanité » restitue ici cette condamnation sans expliciter davantage que le texte.
- source_word: כִּי
  choice: Car
  rationale: Le premier כִּי introduit la raison de l’exhortation précédente. Le second est représenté par les deux-points, qui rendent naturellement en français l’explication concrète venant à l’appui de l’affirmation.
- source_word: עֵץ מִיַּעַר
  choice: un arbre dans la forêt
  rationale: La formulation conserve l’image concrète de l’arbre provenant de la forêt plutôt que de réduire immédiatement עֵץ au matériau « bois ».
- source_word: כְּרָתוֹ
  choice: on coupe
  rationale: La tournure impersonnelle française rend l’action avec son objet sans introduire un agent déterminé absent du contexte.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: ouvrage des mains d’un artisan
  rationale: Cette expression garde l’accent du texte sur la fabrication humaine tout en restant naturelle et digne en français.
- source_word: בַּמַּעֲצָד
  choice: qui se sert d’une hache
  rationale: « Hache » est immédiatement compréhensible dans ce contexte de travail du bois. La proposition relative rattache clairement l’outil à l’artisan; l’incertitude sur l’outil précis est signalée en note.
theological_decisions:
- issue: Rendre la polémique contre l’idolâtrie sans importer de terminologie doctrinale ultérieure
  choice: les coutumes des peuples ne sont que vanité
  alternative: les pratiques des nations sont sans valeur
  rationale: La formulation préserve à la fois la condamnation des usages cultuels évoqués et l’image ouverte de הֶבֶל — vide, souffle, futilité — sans ajouter au verset une qualification théologique absente de l’hébreu.
translation_notes:
  register: Français international moderne, courant et digne. La construction concrète met en relief l’origine forestière et la fabrication humaine de l’objet. Le deux-points évite une répétition lourde de « car » tout en conservant la relation explicative du second כִּי.
