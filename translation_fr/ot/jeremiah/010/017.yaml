  text: אִסְפִּ֥י מֵ/אֶ֖רֶץ כִּנְעָתֵ֑/ךְ ישבתי בַּ/מָּצֽוֹר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/017.yaml
  text: Gather up your bundle from the land[a], you who dwell under siege.
translation:
  language: fr
  text: Ramasse ton bagage à terre[a], toi qui es assiégée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Rassemble du pays tes biens, toi qui habites sous le siège. » Le mot hébreu rendu par « bagage » est rare et peut désigner des biens, des marchandises ou un paquet. « À terre » peut aussi se comprendre « du pays »; l’expression finale peut évoquer une personne vivant sous le siège ou dans un lieu assiégé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְפִּי
  choice: Ramasse
  rationale: Impératif féminin singulier de אסף. « Ramasse » exprime naturellement l’action de réunir des effets en vue d’un départ.
- source_word: מֵאֶרֶץ
  choice: à terre
  rationale: אֶרֶץ peut désigner la terre, le sol ou le pays. Avec le verbe « ramasser », « à terre » rend concrètement l’image, sans exclure dans la note le sens possible de « du pays ».
- source_word: כִּנְעָתֵךְ
  choice: ton bagage
  rationale: Ce nom rare désigne vraisemblablement des biens ou effets rassemblés pour être transportés. « Bagage » convient au contexte d’un départ forcé et respecte le singulier collectif avec suffixe féminin.
- source_word: ישבתי
  choice: toi qui habites
  rationale: La forme consonantique difficile est comprise, conformément au contexte, comme une adresse féminine à l’habitante personnifiée. Cette tournure reste naturelle en français.
- source_word: בַּמָּצוֹר
  choice: dans une ville assiégée
  rationale: מָצוֹר peut désigner un siège, une situation de siège ou un lieu assiégé. La formulation française explicite naturellement le lieu où demeure la destinataire.
theological_decisions: []
translation_notes:
  register: Français international actuel, direct et digne. Le féminin de l’adresse hébraïque n’est pas marqué artificiellement dans « toi qui habites », mais demeure perceptible dans le contexte de la personnification de la ville.
