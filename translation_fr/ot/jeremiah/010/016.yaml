id: JER.10.16
reference: Jeremiah 10:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא כְ/אֵ֜לֶּה חֵ֣לֶק יַעֲקֹ֗ב כִּֽי יוֹצֵ֤ר הַ/כֹּל֙ ה֔וּא וְ/יִ֨שְׂרָאֵ֔ל שֵׁ֖בֶט נַֽחֲלָת֑/וֹ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/016.yaml
  text: Not like these is the Portion of Jacob[a], for he is the Former of all things, and Israel is the tribe of his inheritance[b]; Yahweh of hosts is his name.
translation:
  language: fr
  text: La part de Jacob[a] n’est pas comme ceux-là, car c’est lui qui façonne toutes choses, et Israël est la tribu de son héritage[b]. Yahweh des armées est son nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi rendre l’expression par « la portion de Jacob ». Le sens est que le Dieu d’Israël ne ressemble pas aux objets idolâtriques qui viennent d’être décrits.
    reason: lexical_alternative
  - marker: b
    text: Ou « le bâton » ou « le sceptre de son héritage ». Le mot hébreu peut signifier « tribu », « bâton » ou « sceptre »; ici, « tribu » présente Israël comme le peuple qui appartient à Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק יַעֲקֹב
  choice: la part de Jacob
  rationale: חֵלֶק désigne une part ou une portion attribuée. Dans le contexte, l’expression présente le Dieu d’Israël comme la part propre de Jacob, par contraste avec les idoles.
- source_word: כְאֵלֶּה
  choice: comme ceux-là
  rationale: Le démonstratif renvoie aux objets idolâtriques décrits auparavant. « Ceux-là » conserve ce renvoi sans introduire explicitement le mot « idoles ».
- source_word: יוֹצֵר הַכֹּל
  choice: celui qui façonne toutes choses
  rationale: Le participe יוֹצֵר évoque l’action de former ou de façonner, ce qui maintient le contraste avec les idoles façonnées par des humains; הַכֹּל exprime ici la totalité de ce que Dieu a formé.
- source_word: שֵׁבֶט נַחֲלָתוֹ
  choice: la tribu de son héritage
  rationale: שֵׁבֶט peut signifier « tribu », « bâton » ou « sceptre ». Avec Israël comme sujet, « tribu » exprime le plus naturellement le peuple qui appartient à Dieu, tout en laissant l’autre sens en note.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré « Yahweh ». « Des armées » rend le titre צְבָאוֹת de manière concise sans en limiter la portée aux seules armées terrestres.
- source_word: שְׁמוֹ
  choice: est son nom
  rationale: Cette formulation directe conserve la solennité de la formule hébraïque d’identification.
theological_decisions:
- issue: Référent de « la part de Jacob »
  choice: L’expression désigne Yahweh comme la part propre de Jacob, en opposition aux idoles.
  alternative: Comprendre l’expression de façon plus abstraite comme « ce qui revient à Jacob ».
  rationale: Le contexte immédiat oppose les idoles au Dieu vivant qui a tout façonné. La traduction littérale préserve cette portée d’alliance sans ajouter d’explication dans le corps du texte.
- issue: Sens de שֵׁבֶט appliqué à Israël
  choice: « tribu », au sens du peuple constituant l’héritage de Dieu.
  alternative: « bâton » ou « sceptre » de son héritage.
  rationale: La polysémie du terme doit être signalée. Dans cette construction, la lecture « tribu » s’accorde le mieux avec Israël comme peuple appartenant à Yahweh, mais la lecture concrète « bâton/sceptre » demeure lexicalement possible.
translation_notes:
  register: Français international moderne, sobre et digne. « Façonne » conserve l’image de l’artisan présente dans le texte hébreu. La structure finale « Yahweh des armées est son nom » garde le caractère solennel de la formule source.
