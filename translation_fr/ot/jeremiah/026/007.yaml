source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֛וּ הַ/כֹּהֲנִ֥ים וְ/הַ/נְּבִאִ֖ים וְ/כָל הָ/עָ֑ם אֶֽת יִרְמְיָ֔הוּ מְדַבֵּ֛ר אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/בֵ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/007.yaml
  text: And the priests and the prophets and all the people heard Jeremiah speaking these words in the house of Yahweh[a].
translation:
  language: fr
  text: Les prêtres, les prophètes et tout le peuple entendirent Jérémie prononcer ces paroles dans la maison de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans le temple de Yahweh ». Littéralement : « dans la maison de Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: entendirent
  rationale: Le wayyiqtol fait avancer le récit au passé. « Entendirent » rend ici le sens simple de שׁמע sans y ajouter l’idée d’obéissance.
- source_word: הַכֹּהֲנִים וְהַנְּבִאִים וְכָל הָעָם
  choice: Les prêtres, les prophètes et tout le peuple
  rationale: Ces termes désignent naturellement les prêtres, les prophètes et l’ensemble du peuple présent. En français, une énumération avec virgules et un seul « et » final est plus fluide sans modifier la coordination hébraïque.
- source_word: אֶת יִרְמְיָהוּ מְדַבֵּר
  choice: Jérémie prononcer
  rationale: Après « entendre », l’infinitif français exprime naturellement la perception de Jérémie en train de parler. « Prononcer » convient au complément « ces paroles » et conserve la valeur du participe מְדַבֵּר.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: Dans ce contexte de proclamation, דְּבָרִים désigne les paroles qui viennent d’être dites plutôt que des « choses » indéterminées.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: Cette formulation conserve l’expression hébraïque « maison de YHWH »; « temple de Yahweh » en explicite correctement le référent contextuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par la translittération française courante « Yahweh », conformément au choix éditorial de préserver le nom propre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre, tandis que « le Seigneur » représente la tradition de substitution à la lecture.
- issue: Sens de « maison de Yahweh »
  choice: maison de Yahweh dans le texte, avec « temple de Yahweh » en note
  alternative: temple de Yahweh dans le texte
  rationale: Le rendu principal garde l’image lexicale de בַּיִת sans obscurcir le contexte; la note fournit l’équivalent institutionnel naturel.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. La coordination hébraïque répétée est allégée selon l’usage français, et le nom divin est translittéré.
