  terminology: « Michée », « Ézéchias », « Juda », « Sion » et « Jérusalem » sont les formes françaises établies. « Yahweh des armées » correspond directement à יהוה צבאות. « La montagne de la Maison », avec sa note explicative, préserve l’expression hébraïque sans masquer son référent cultuel. La note b signale adéquatement l’ambiguïté possible de בָּמוֹת sans imposer le sens de sites cultuels.
