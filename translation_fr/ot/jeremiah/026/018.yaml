source:
  edition: WLC
  text: מיכיה הַ/מּ֣וֹרַשְׁתִּ֔י הָיָ֣ה נִבָּ֔א בִּ/ימֵ֖י חִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֶל כָּל עַם֩ יְהוּדָ֨ה לֵ/אמֹ֜ר כֹּֽה אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת צִיּ֞וֹן שָׂדֶ֤ה תֵֽחָרֵשׁ֙ וִ/ירוּשָׁלַ֨יִם֙ עִיִּ֣ים תִּֽהְיֶ֔ה וְ/הַ֥ר הַ/בַּ֖יִת לְ/בָמ֥וֹת יָֽעַר־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/018.yaml
  text: 'Micah the Morashtite was prophesying in the days of Hezekiah king of Judah[a], and he said to all the people of Judah, saying, “Thus says Yahweh of Armies: Zion will be plowed as a field, and Jerusalem will become ruins[c][b], and the mountain of the house will become wooded heights.”'
translation:
  language: fr
  text: 'Michée, originaire de Morésheth, prophétisait au temps d’Ézéchias, roi de Juda. Il dit à tout le peuple de Juda : « Voici ce que dit Yahweh des armées : Sion sera labourée comme un champ, Jérusalem deviendra un monceau de ruines, et la montagne de la Maison[a] deviendra des hauteurs boisées[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire la montagne du Temple.
    reason: cultural_note
  - marker: b
    text: 'Ou : « des hauts lieux couverts de forêt » ; le terme hébreu peut désigner des hauteurs ou des lieux de culte situés en hauteur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מיכיה הַמּוֹרַשְׁתִּי
  choice: Michée, originaire de Morésheth
  rationale: « Michée » est la forme française traditionnelle du nom. Le gentilé hébreu désigne son origine; une formulation explicite est plus naturelle et immédiatement compréhensible en français que « le Morashtite ».
- source_word: הָיָה נִבָּא
  choice: prophétisait
  rationale: La construction avec היה et le participe exprime une activité en cours ou caractéristique dans le passé; l’imparfait français en rend naturellement la valeur durative.
- source_word: בִּימֵי חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: au temps d’Ézéchias, roi de Juda
  rationale: « Au temps de » rend l’expression temporelle idiomatiquement, tout en conservant le titre royal en apposition.
- source_word: כֹּה אָמַר יְהוָה צְבָאוֹת
  choice: Voici ce que dit Yahweh des armées
  rationale: Cette formule française actuelle et digne restitue l’introduction solennelle. Le nom divin est translittéré, et « des armées » rend concrètement le pluriel צְבָאוֹת.
- source_word: צִיּוֹן שָׂדֶה תֵחָרֵשׁ
  choice: Sion sera labourée comme un champ
  rationale: La formulation conserve l’image de Sion traitée comme une terre agricole, sans préciser au-delà de l’hébreu si elle sera transformée en champ.
- source_word: עִיִּים
  choice: un monceau de ruines
  rationale: Le pluriel hébreu évoque des amas ou des monceaux de décombres. Le singulier collectif est idiomatique en français et plus évocateur que le simple mot « ruines ».
- source_word: וְהַר הַבַּיִת
  choice: la montagne de la Maison
  rationale: Cette traduction conserve l’expression hébraïque et sa désignation révérencielle du Temple; une note explicite le référent.
- source_word: לְבָמוֹת יָעַר
  choice: deviendra des hauteurs boisées
  rationale: « Hauteurs » préserve le sens spatial de בָּמוֹת sans imposer ici le sens cultuel de « hauts lieux »; « boisées » rend יָעַר et l’image d’un site redevenu sauvage.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin propre. « Yahweh » le distingue d’un titre et suit directement la forme du tétragramme, sans importer une interprétation confessionnelle particulière.
- issue: Sens du titre צְבָאוֹת
  choice: des armées
  alternative: de l’univers / des puissances célestes
  rationale: Le terme désigne des armées ou troupes organisées et peut englober les forces célestes. « Des armées » garde l’image concrète et la portée ouverte du titre.
- issue: Portée de בָּמוֹת dans la dernière proposition
  choice: hauteurs
  alternative: hauts lieux
  rationale: Le mot peut désigner de simples hauteurs ou des sanctuaires élevés. Dans cette image de dévastation et de retour à l’état sauvage, « hauteurs » préserve la topographie sans ajouter nécessairement une connotation cultuelle; l’alternative est signalée en note.
translation_notes:
  register: Français international moderne, digne et lisible. L’imparfait « prophétisait » conserve l’aspect duratif de l’hébreu. Les répétitions sémitiques inutiles à la fluidité française sont allégées dans l’introduction du discours, tandis que les trois images parallèles de destruction sont maintenues.
