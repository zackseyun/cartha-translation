  source_fidelity: 'Le texte rend fidèlement les éléments essentiels de l’hébreu : Michée de Morésheth, l’activité prophétique à l’époque d’Ézéchias, l’adresse à tout le peuple de Juda et les trois images parallèles de dévastation. « Prophétisait » restitue de façon recevable la valeur durative de הָיָה נִבָּא. « Sera labourée comme un champ », « un monceau de ruines » et « deviendra des hauteurs boisées » transmettent correctement les images sans les surinterpréter.'
