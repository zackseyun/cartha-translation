  yaml_path: translation/ot/jeremiah/026/006.yaml
  text: then I will make this house like Shiloh[b][a], and I will make this city a curse to all the nations of the earth.
translation:
  language: fr
  text: alors je rendrai cette maison semblable à Silo[a], et je ferai de cette ville une malédiction[b] pour toutes les nations de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Silo avait autrefois abrité le sanctuaire. Le lieu avait ensuite subi le jugement et la dévastation.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction : « je ferai de cette ville un objet de malédiction pour toutes les nations de la terre »; c’est-à-dire qu’elle servira d’exemple dans les malédictions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: alors je traiterai
  rationale: Dans la suite de la condition énoncée au verset précédent, le waw introduit la conséquence. Avec la comparaison « comme Silo », נתן exprime ici le fait de faire subir à cette maison le même sort.
- source_word: הַבַּיִת הַזֶּה
  choice: cette maison
  rationale: Le référent est le temple, mais « maison » conserve le terme hébreu et sa portée théologique tout en restant clair dans le contexte.
- source_word: כְּשִׁלֹה
  choice: comme Silo
  rationale: La préposition כ marque une comparaison avec Silo, ancien lieu du sanctuaire frappé par le jugement.
- source_word: הָעִיר הַזֹּאת
  choice: cette ville
  rationale: Expression démonstrative directe qui désigne Jérusalem dans le contexte.
- source_word: אֶתֵּן לִקְלָלָה
  choice: je ferai de … un objet de malédiction
  rationale: Cette formulation française rend naturellement l’idée que la ville servira d’exemple ou de formule lorsque l’on prononcera une malédiction, sans suggérer qu’elle maudira elle-même les nations.
- source_word: לְכֹל גּוֹיֵי הָאָרֶץ
  choice: pour toutes les nations de la terre
  rationale: Ici, הארץ a une portée mondiale et le ל indique le groupe aux yeux duquel ou dans l’usage duquel la ville deviendra un objet de malédiction.
theological_decisions:
- issue: Désignation du temple
  choice: cette maison
  alternative: ce temple
  rationale: Le maintien de « maison » suit la formulation hébraïque et préserve l’écho de la maison de l’Éternel sans expliciter excessivement le référent.
- issue: Portée de la formule de jugement contre la ville
  choice: un objet de malédiction
  alternative: une malédiction
  rationale: Le syntagme hébreu peut présenter la ville comme une malédiction ou comme un exemple invoqué dans des malédictions. « Objet de malédiction » exprime clairement l’idiome sans déterminer la forme précise de son emploi.
- issue: Sort de la maison comparé à Silo
  choice: je traiterai cette maison comme Silo
  alternative: je rendrai cette maison semblable à Silo
  rationale: La comparaison annonce le même jugement et la même dévastation que ceux subis par Silo. « Traiterai … comme » est naturel en français et ne précise pas au-delà du texte la modalité exacte du désastre.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe garde le parallélisme du texte hébreu. « Silo » suit la forme française traditionnelle du toponyme biblique.
