  terminology: « Jojakim » et « Urie » sont des formes bibliques françaises usuelles. « Hommes de guerre » préserve la portée militaire de גִּבּוֹרָיו, tandis que « hauts fonctionnaires » rend convenablement les dignitaires/officiels de cour visés par הַשָּׂרִים. « Faire mourir » rend avec une gravité adéquate l’intention exprimée par בקש + infinitif.
