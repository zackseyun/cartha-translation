  text: וַ/יִּשְׁמַ֣ע הַ/מֶּֽלֶךְ יְ֠הוֹיָקִים וְ/כָל גִּבּוֹרָ֤י/ו וְ/כָל הַ/שָּׂרִים֙ אֶת דְּבָרָ֔י/ו וַ/יְבַקֵּ֥שׁ הַ/מֶּ֖לֶךְ הֲמִית֑/וֹ וַ/יִּשְׁמַ֤ע אוּרִיָּ֨הוּ֙ וַ/יִּרָ֔א וַ/יִּבְרַ֖ח וַ/יָּבֹ֥א מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/021.yaml
  text: When King Jehoiakim[a], and all his mighty men, and all the officials heard his words, the king sought to put him to death. But when Uriah heard[b], he was afraid and fled and went to Egypt.
translation:
  language: fr
  text: Lorsque le roi Jojakim, tous ses hommes de guerre[a] et tous les hauts fonctionnaires entendirent ses paroles, le roi chercha à le faire mourir. Quand Urie l’apprit, il eut peur, s’enfuit et se rendit en Égypte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ses hommes vaillants ». Le terme hébreu peut désigner des hommes puissants ou des guerriers.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « vint en Égypte » ou « arriva en Égypte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: entendirent / l’apprit
  rationale: Le premier emploi décrit l’audition des paroles d’Urie. Pour le second, où l’objet est sous-entendu, « l’apprit » exprime naturellement en français qu’Urie eut connaissance du projet du roi.
- source_word: גִּבּוֹרָיו
  choice: ses hommes de guerre
  rationale: Dans ce contexte royal, גִּבּוֹרָיו désigne vraisemblablement les hommes vaillants ou combattants attachés au roi. « Hommes de guerre » conserve la nuance militaire dans un registre digne et clair.
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: שׂרים désigne ici les dirigeants ou dignitaires de la cour. « Hauts fonctionnaires » évite de les présenter nécessairement comme des princes de sang.
- source_word: דְּבָרָיו
  choice: ses paroles
  rationale: Rendu formel de דְּבָרָיו, qui renvoie aux paroles prophétiques d’Urie dans le contexte immédiat.
- source_word: וַיְבַקֵּשׁ ... הֲמִיתוֹ
  choice: chercha à le faire mourir
  rationale: Cette formulation conserve la construction exprimant le dessein ou la tentative du roi ainsi que la gravité de la mise à mort.
- source_word: וַיִּרָא
  choice: il eut peur
  rationale: Expression narrative naturelle en français pour la réaction immédiate d’Urie.
- source_word: וַיִּבְרַח
  choice: s’enfuit
  rationale: Rendu concis qui conserve l’urgence de la fuite.
- source_word: וַיָּבֹא מִצְרָיִם
  choice: se rendit en Égypte
  rationale: Le verbe signifie formellement « venir/arriver », mais le français adopte naturellement le point de vue du déplacement vers la destination.
- source_word: וַ
  choice: Quand Urie l’apprit
  rationale: La coordination hébraïque fait progresser le récit. La subordination temporelle française relie naturellement la nouvelle du projet royal à la peur et à la fuite d’Urie, sans imposer un contraste absent du texte.
theological_decisions: []
