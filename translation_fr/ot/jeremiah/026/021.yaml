  source_fidelity: 'Le texte rend fidèlement la structure narrative hébraïque : le roi Jojakim, ses hommes de guerre et les hauts fonctionnaires entendent les paroles d’Urie ; le roi cherche à le mettre à mort ; Urie l’apprend, prend peur, fuit et va en Égypte. « L’apprit » explicite de façon idiomatique l’objet implicite de la seconde occurrence de « entendre », sans ajout doctrinal ni changement de sens.'
