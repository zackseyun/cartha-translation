  text: אַ֗ךְ יַ֚ד אֲחִיקָ֣ם בֶּן שָׁפָ֔ן הָיְתָ֖ה אֶֽת יִרְמְיָ֑הוּ לְ/בִלְתִּ֛י תֵּת אֹת֥/וֹ בְ/יַד הָ/עָ֖ם לַ/הֲמִיתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/024.yaml
  text: But the hand of Ahikam son of Shaphan was with Jeremiah[b][a], so that he was not given into the hand of the people to put him to death.
translation:
  language: fr
  text: Mais Ahikam, fils de Shaphân, soutint Jérémie[a], afin qu’on ne le livre pas au pouvoir du peuple pour le mettre à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la main d’Ahikam, fils de Shaphân, était avec Jérémie » ; cette expression signifie qu’Ahikam le soutenait et le protégeait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mais
  rationale: La particule marque ici le contraste avec la menace de mort qui pesait sur Jérémie.
- source_word: יַד אֲחִיקָם ... הָיְתָה אֶת יִרְמְיָהוּ
  choice: Ahikam… apporta son soutien à Jérémie
  rationale: Littéralement, « la main d’Ahikam… était avec Jérémie ». L’expression désigne son appui actif et sa protection; une traduction idiomatique évite en français une formulation obscure.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ahikam, fils de Shafân
  rationale: Le lien filial est rendu directement; la graphie française traditionnelle et reconnaissable « Shafân » est retenue.
- source_word: לְבִלְתִּי תֵּת אֹתוֹ
  choice: si bien qu’on ne le livra pas
  rationale: La construction exprime ici le résultat, ou le but réalisé, du soutien d’Ahikam. Le pronom indéfini « on » conserve l’absence de sujet explicite dans l’hébreu.
- source_word: בְיַד הָעָם
  choice: au pouvoir du peuple
  rationale: Littéralement, « dans la main du peuple »; l’expression signifie être livré sous son contrôle. « Au pouvoir de » transmet naturellement cet idiome en français.
- source_word: לַהֲמִיתוֹ
  choice: pour le faire mourir
  rationale: Le hifil de מות signifie « causer la mort ». Cette formulation conserve la valeur causative sans préciser indûment le mode de mise à mort.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La traduction rend explicitement les deux idiomes hébreux liés à la « main », tout en signalant en note l’image de la première expression. La seconde est traduite par « au pouvoir du peuple » pour éviter une tournure française artificielle.
