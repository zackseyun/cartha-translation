source:
  edition: WLC
  text: הֶ/הָמֵ֣ת הֱ֠מִתֻ/הוּ חִזְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה וְ/כָל יְהוּדָ֗ה הֲ/לֹא֮ יָרֵ֣א אֶת יְהוָה֒ וַ/יְחַל֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יִּנָּ֣חֶם יְהוָ֔ה אֶל הָ/רָעָ֖ה אֲשֶׁר דִּבֶּ֣ר עֲלֵי/הֶ֑ם וַ/אֲנַ֗חְנוּ עֹשִׂ֛ים רָעָ֥ה גְדוֹלָ֖ה עַל נַפְשׁוֹתֵֽי/נוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/019.yaml
  text: Did Hezekiah king of Judah and all Judah put him to death? Did he not fear Yahweh and seek the favor of Yahweh[c][b][a], and Yahweh relented concerning the disaster that he had spoken against them? But we are doing great evil against ourselves.
translation:
  language: fr
  text: Ézéchias, roi de Juda, et tout Juda l’ont-ils vraiment mis à mort ? N’a-t-il pas craint Yahweh et recherché la faveur de Yahweh[a] ? Et Yahweh a renoncé au malheur qu’il avait annoncé contre eux[b]. Mais nous, nous commettons un grand mal contre nous-mêmes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « a cherché à apaiser la face de Yahweh » ; idiome signifiant rechercher sa faveur ou le supplier.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « Yahweh a changé d’avis au sujet du malheur qu’il avait annoncé contre eux ».'
    reason: alternative_reading
  - marker: c
    text: Le même mot hébreu est rendu plus tôt par « malheur », au sens de calamité ou de jugement, et ici par « mal », au sens moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָמֵת הֱמִתֻהוּ
  choice: l’ont-ils vraiment mis à mort
  rationale: La construction intensive associant l’infinitif absolu et le verbe conjugué est rendue naturellement par « vraiment », tandis que « mettre à mort » évite de donner au geste une nuance judiciaire plus précise que l’hébreu.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה וְכָל יְהוּדָה
  choice: Ézéchias, roi de Juda, et tout Juda
  rationale: Le nom suit sa forme française traditionnelle, et l’expression collective « tout Juda » conserve la portée représentative du texte hébreu.
- source_word: הֲלֹא יָרֵא אֶת יְהוָה
  choice: N’a-t-il pas craint Yahweh
  rationale: « Craindre Yahweh » garde la force religieuse et relationnelle habituelle de ירא dans ce contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיְחַל אֶת פְּנֵי יְהוָה
  choice: recherché la faveur de Yahweh
  rationale: Cette formulation française claire exprime l’idiome hébreu qui évoque littéralement le fait d’adoucir ou de supplier la face de Yahweh.
- source_word: וַיִּנָּחֶם יְהוָה אֶל הָרָעָה
  choice: Yahweh a renoncé au malheur
  rationale: « A renoncé » exprime le retrait du jugement annoncé sans effacer la représentation textuelle d’une réponse de Dieu; « malheur » désigne ici une calamité plutôt qu’un mal moral.
- source_word: אֲשֶׁר דִּבֶּר עֲלֵיהֶם
  choice: qu’il avait annoncé contre eux
  rationale: Dans ce contexte prophétique, « annoncé contre eux » rend clairement une parole de jugement dirigée contre ses destinataires.
- source_word: וַאֲנַחְנוּ עֹשִׂים רָעָה גְדוֹלָה עַל נַפְשׁוֹתֵינוּ
  choice: Mais nous, nous commettons un grand mal contre nous-mêmes
  rationale: « Commettre un grand mal » donne ici à רָעָה son sens moral, tandis que « contre nous-mêmes » restitue naturellement l’idée d’une conduite qui porte atteinte à nos propres personnes.
theological_decisions:
- issue: Langage anthropopathique décrivant la réponse de Dieu
  choice: Yahweh a renoncé au malheur
  alternative: Yahweh a changé d’avis au sujet du malheur
  rationale: La formulation retenue affirme réellement que Dieu retire le jugement annoncé en réponse à la crainte et à la supplication, sans résoudre par avance la tension avec les affirmations théologiques sur son immutabilité.
translation_notes:
  register: Français international moderne, naturel et digne. Les questions rhétoriques restent nettes; « vraiment » restitue l’intensification hébraïque. La répétition « Mais nous, nous » est idiomatique en français et souligne le contraste. Les termes « malheur » et « mal » permettent de signaler les deux sens contextuels du même mot hébreu.
