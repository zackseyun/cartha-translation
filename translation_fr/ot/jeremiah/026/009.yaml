  text: מַדּוּעַ֩ נִבֵּ֨יתָ בְ/שֵׁם יְהוָ֜ה לֵ/אמֹ֗ר כְּ/שִׁלוֹ֙ יִֽהְיֶה֙ הַ/בַּ֣יִת הַ/זֶּ֔ה וְ/הָ/עִ֥יר הַ/זֹּ֛את תֶּחֱרַ֖ב מֵ/אֵ֣ין יוֹשֵׁ֑ב וַ/יִּקָּהֵ֧ל כָּל הָ/עָ֛ם אֶֽל יִרְמְיָ֖הוּ בְּ/בֵ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/009.yaml
  text: Why have you prophesied in the name of the LORD, saying, ‘This house will become like Shiloh, and this city will be laid waste, with no inhabitant’?” Then all the people gathered against Jeremiah in the house of the LORD.
translation:
  language: fr
  text: '« Pourquoi as-tu prophétisé au nom du SEIGNEUR en disant : “Cette maison deviendra comme Silo, et cette ville sera dévastée, sans aucun habitant” ? » Alors tout le peuple se rassembla contre Jérémie dans la maison du SEIGNEUR.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Rend directement la question accusatrice introduite par l’adverbe interrogatif hébreu.
- source_word: בְשֵׁם יְהוָה
  choice: au nom du SEIGNEUR
  rationale: Expression française naturelle pour l’autorité invoquée; « SEIGNEUR » suit la convention de traduction du tétragramme.
- source_word: כְשִׁלוֹ יִהְיֶה הַבַּיִת הַזֶּה
  choice: Cette maison deviendra comme Silo
  rationale: « Deviendra » exprime ici le changement d’état impliqué par היה, tandis que « comme Silo » conserve l’allusion historique sans l’expliciter.
- source_word: תֶּחֱרַב
  choice: sera dévastée
  rationale: Le verbe חרב décrit la désolation ou la ruine; « sera dévastée » convient à une ville et préserve la force de la menace.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sans aucun habitant
  rationale: Rend la privation exprimée par מֵאֵין et le participe substantivé יוֹשֵׁב de façon idiomatique.
- source_word: וַיִּקָּהֵל כָּל הָעָם אֶל יִרְמְיָהוּ
  choice: Alors tout le peuple se rassembla contre Jérémie
  rationale: La préposition אֶל indique littéralement un rassemblement vers Jérémie; dans ce contexte hostile, « contre » transmet correctement l’orientation menaçante du groupe.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison du SEIGNEUR
  rationale: Conserve le même terme « maison » que dans la parole citée et désigne le temple sans remplacer l’image hébraïque.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: La petite capitale suit une convention française largement intelligible qui distingue le tétragramme du titre ordinaire « Seigneur », sans imposer une vocalisation discutée.
- issue: Portée de la comparaison avec Silo
  choice: Conserver simplement « comme Silo »
  alternative: Expliciter que le temple sera détruit comme le sanctuaire de Silo
  rationale: Le verset présuppose l’allusion historique sans en détailler le sens; l’expliciter dans le texte résoudrait ce que le lecteur est invité à comprendre du contexte.
- issue: Orientation du rassemblement populaire
  choice: contre Jérémie
  alternative: autour de Jérémie / auprès de Jérémie
  rationale: Le contexte immédiat est celui d’une confrontation et d’une menace de mort; « contre » rend cette hostilité, bien que אֶל puisse être plus neutre isolément.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe de l’accusation directe est conservée, avec une ponctuation naturelle. « Maison » est maintenu pour le temple afin de préserver la reprise lexicale interne du verset.
