  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֖ה אָמַ֣ר יְהוָ֑ה אִם לֹ֤א תִשְׁמְעוּ֙ אֵלַ֔/י לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/004.yaml
  text: 'And you shall say to them, ‘Thus says the LORD: If you do not listen to me, to walk in my law that I have set before you,’'
translation:
  language: fr
  text: 'Tu leur diras : « Voici ce que dit le SEIGNEUR : Si vous ne m’écoutez pas, en suivant ma loi que j’ai placée devant vous,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit le SEIGNEUR
  rationale: Formule prophétique rendue dans un français naturel et digne; « le SEIGNEUR » représente le tétragramme conformément à l’usage biblique français courant.
- source_word: תִשְׁמְעוּ אֵלַי
  choice: vous ne m’écoutez pas
  rationale: Le verbe שמע avec אֶל exprime ici l’écoute qui implique l’attention et l’obéissance, sans qu’il soit nécessaire d’expliciter cette dernière.
- source_word: לָלֶכֶת בְּתוֹרָתִי
  choice: en suivant la loi
  rationale: Littéralement « marcher dans ma loi »; « suivre » transmet naturellement l’idée de conformer sa conduite à la Torah tout en conservant le lien syntaxique avec l’écoute.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: j’ai placée devant vous
  rationale: Préserve l’image hébraïque d’une instruction mise devant le peuple, plutôt que de réduire le sens à « donnée ».
theological_decisions:
- issue: Sens de תּוֹרָה
  choice: la loi
  alternative: mon enseignement
  rationale: Dans ce contexte d’alliance, « loi » demeure la désignation française reconnue de la Torah; le possessif est déjà porté par la proposition relative « que j’ai placée » et par le locuteur divin, mais « ma loi » serait également possible. Le texte retient explicitement « la loi » pour alléger la formulation sans modifier la référence.
- issue: Relation entre écouter et marcher
  choice: en suivant
  alternative: pour suivre
  rationale: L’hébreu juxtapose « écouter » et l’infinitif « marcher ». « En suivant » conserve la nuance selon laquelle la conduite manifeste l’écoute, sans trancher trop fortement entre résultat, but et explication.
translation_notes:
  register: Français international moderne, clair et solennel. Le verset reste syntaxiquement ouvert, puisqu’il introduit la condition dont la suite vient aux versets suivants. Guillemets français employés pour le discours divin.
