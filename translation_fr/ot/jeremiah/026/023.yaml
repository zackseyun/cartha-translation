  text: וַ/יּוֹצִ֨יאוּ אֶת אוּרִיָּ֜הוּ מִ/מִּצְרַ֗יִם וַ/יְבִאֻ֨/הוּ֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹיָקִ֔ים וַ/יַּכֵּ֖/הוּ בֶּ/חָ֑רֶב וַ/יַּשְׁלֵךְ֙ אֶת נִבְלָת֔/וֹ אֶל קִבְרֵ֖י בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/023.yaml
  text: They brought Uriah out of Egypt and brought him to King Jehoiakim[a], and he struck him down with the sword and threw his corpse into the burial places of the common people.
translation:
  language: fr
  text: Ils firent sortir Urie d’Égypte et l’amenèrent au roi Jojakim. Celui-ci le frappa de l’épée et jeta son cadavre dans les tombes des gens du peuple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les sépultures du peuple ». L’hébreu peut désigner les tombes réservées aux gens ordinaires, par opposition à une sépulture honorifique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ אֶת־אוּרִיָּהוּ מִמִּצְרַיִם
  choice: Ils firent sortir Urie d’Égypte
  rationale: Le hiphil de יצא exprime la causation (« faire sortir »). Cette formulation française conserve directement cette valeur et rend naturellement la provenance marquée par מן.
- source_word: וַיְבִאֻהוּ אֶל־הַמֶּלֶךְ יְהוֹיָקִים
  choice: et l’amenèrent au roi Jojakim
  rationale: Le hiphil de בוא avec suffixe objet signifie « amener ». « Au roi Jojakim » restitue simplement le titre et le nom hébreux.
- source_word: וַיַּכֵּהוּ בֶּחָרֶב
  choice: Celui-ci le frappa de l’épée
  rationale: נכה signifie d’abord « frapper »; le complément « de l’épée » et la mention du cadavre rendent l’issue mortelle explicite sans remplacer le verbe hébreu par « tuer ». « Celui-ci » marque clairement le passage des verbes pluriels au singulier.
- source_word: נִבְלָתוֹ
  choice: son cadavre
  rationale: נְבֵלָה désigne le corps mort ou cadavre. « Cadavre » est précis, courant et conserve la nuance déshonorante du contexte.
- source_word: קִבְרֵי בְּנֵי הָעָם
  choice: les tombes des gens du peuple
  rationale: קִבְרֵי désigne des tombes ou lieux de sépulture. « Gens du peuple » rend l’expression sociale בְּנֵי הָעָם sans le littéralisme peu naturel « fils du peuple », tout en laissant ouverte la portée exacte de l’expression.
theological_decisions:
- issue: Passage de verbes au pluriel à des verbes au singulier
  choice: Conserver des agents pluriels pour l’extradition et le transport, puis attribuer au roi l’exécution et l’abandon du cadavre par « Celui-ci ».
  alternative: Comprendre les verbes singuliers comme collectifs ou poursuivre avec un sujet pluriel implicite.
  rationale: L’hébreu passe de וַיּוֹצִיאוּ et וַיְבִאֻהוּ au pluriel à וַיַּכֵּהוּ et וַיַּשְׁלֵךְ au singulier. Le roi Jojakim est l’antécédent singulier le plus proche; la traduction conserve donc ce changement d’agence au lieu de le lisser.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est divisée en deux phrases pour rendre clairement le changement de sujet grammatical. Le nom יְהוֹיָקִים est rendu selon la forme française biblique courante « Jojakim ».
