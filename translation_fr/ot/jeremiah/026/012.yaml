  text: וַ/יֹּ֤אמֶר יִרְמְיָ֨הוּ֙ אֶל כָּל הַ/שָּׂרִ֔ים וְ/אֶל כָּל הָ/עָ֖ם לֵ/אמֹ֑ר יְהוָ֣ה שְׁלָחַ֗/נִי לְ/הִנָּבֵ֞א אֶל הַ/בַּ֤יִת הַ/זֶּה֙ וְ/אֶל הָ/עִ֣יר הַ/זֹּ֔את אֵ֥ת כָּל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שְׁמַעְתֶּֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/012.yaml
  text: Then Yirmeyahu said to all the officials and to all the people, saying, “The LORD sent me to prophesy against this house and against this city all the words that you have heard.”
translation:
  language: fr
  text: 'Alors Jérémie dit à tous les responsables et à tout le peuple : « Le SEIGNEUR m’a envoyé prophétiser contre cette maison et contre cette ville toutes les paroles que vous avez entendues. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: les chefs
  rationale: Le terme désigne ici les responsables civils ou dignitaires; « chefs » est naturel et suffisamment large dans ce contexte.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française courante en petites capitales, sans introduire une vocalisation discutée.
- source_word: לְהִנָּבֵא אֶל
  choice: prophétiser contre
  rationale: Avec un message de jugement visant le temple et la ville, la préposition אֶל prend ici naturellement une valeur hostile, bien que son sens premier soit « vers/à ».
- source_word: הַבַּיִת הַזֶּה
  choice: cette maison
  rationale: Conserve l’image hébraïque et la désignation contextuelle du temple sans l’expliciter dans le corps du verset.
theological_decisions:
- issue: Nature de la mission prophétique
  choice: « Le SEIGNEUR m’a envoyé »
  alternative: « Le SEIGNEUR m’avait envoyé »
  rationale: Le parfait hébreu énonce directement le mandat divin invoqué par Jérémie; le passé composé français garde cette force sans ajouter de nuance temporelle.
- issue: Orientation de la prophétie envers le temple et la ville
  choice: « contre »
  alternative: « au sujet de » ou « à »
  rationale: Le contexte immédiat est celui d’un oracle de jugement. « Contre » exprime cette portée tout en laissant le contenu exact aux paroles déjà entendues.
translation_notes:
  register: Français moderne, clair et digne. L’infinitif hébraïque לֵאמֹר (« en disant ») n’est pas reproduit séparément, car les deux-points introduisant le discours direct en rendent naturellement la fonction.
