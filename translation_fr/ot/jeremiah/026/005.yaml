source:
  edition: WLC
  text: לִ/שְׁמֹ֗עַ עַל דִּבְרֵ֨י עֲבָדַ֣/י הַ/נְּבִאִ֔ים אֲשֶׁ֥ר אָנֹכִ֖י שֹׁלֵ֣חַ אֲלֵי/כֶ֑ם וְ/הַשְׁכֵּ֥ם וְ/שָׁלֹ֖חַ וְ/לֹ֥א שְׁמַעְתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/005.yaml
  text: to listen to the words of my servants the prophets[a], whom I am sending to you, rising early and sending, though you have not listened,
translation:
  language: fr
  text: d’écouter les paroles de mes serviteurs, les prophètes, que je vous envoie sans relâche[a] ; mais vous n’avez pas écouté,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « me levant tôt et envoyant ». Cette expression hébraïque évoque une action empressée, persistante et répétée.'
    reason: La note rend visible l’image idiomatique de l’hébreu, remplacée dans le texte par une formulation française naturelle.
lexical_decisions:
- source_word: לִשְׁמֹעַ
  choice: d’écouter
  rationale: L’infinitif avec ל dépend de la proposition conditionnelle du verset précédent. « Écouter » conserve à la fois l’acte d’entendre attentivement et l’idée implicite de tenir compte, sans expliciter excessivement par « obéir ».
- source_word: עַל דִּבְרֵי
  choice: les paroles
  rationale: Avec שׁמע, עַל introduit ici ce qui doit être écouté. « Les paroles » rend directement le pluriel concret דִּבְרֵי, plutôt que de l’interpréter comme un unique « message ».
- source_word: עֲבָדַי הַנְּבִאִים
  choice: mes serviteurs, les prophètes
  rationale: « Serviteurs » convient au titre donné aux agents mandatés par Dieu. L’apposition « les prophètes » identifie ces serviteurs sans mettre au premier plan la notion sociale d’esclavage.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ אֲלֵיכֶם
  choice: que je vous envoie
  rationale: Le participe שֹׁלֵחַ exprime dans ce contexte une action présente et répétée. Le présent français reste naturel et permet au complément idiomatique suivant d’en préciser la persistance.
- source_word: וְהַשְׁכֵּם וְשָׁלֹחַ
  choice: avec insistance[a]
  rationale: La tournure, littéralement liée au fait de se lever tôt et d’envoyer, est un idiome hébreu exprimant une initiative répétée, empressée et persistante. « Avec insistance » en communique la force en français courant, tandis que la note conserve sa forme littérale.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: mais vous n’avez pas écouté
  rationale: La coordination prend ici une valeur adversative après l’envoi insistant des prophètes. Le passé composé exprime naturellement le refus antérieur dont les effets demeurent pertinents, sans ajouter un complément absent de l’hébreu.
theological_decisions:
- issue: Sens de l’idiome וְהַשְׁכֵּם וְשָׁלֹחַ
  choice: avec insistance
  alternative: me levant tôt et envoyant ; sans relâche ; à maintes reprises
  rationale: La formulation hébraïque anthropomorphique souligne l’empressement et la persistance de Dieu à envoyer ses prophètes, plutôt qu’un simple renseignement sur l’heure de leur envoi. La traduction transmet cette force sans effacer la forme littérale, donnée en note.
- issue: Valeur de עֲבָדַי
  choice: mes serviteurs
  alternative: mes esclaves
  rationale: Dans cette formule de mandat prophétique, le mot désigne ceux qui sont au service de Dieu et envoyés par lui. « Serviteurs » respecte ce rôle sans introduire au premier plan une nuance de statut servile que le contexte ne développe pas.
- issue: Portée de שׁמע
  choice: écouter
  alternative: entendre ; obéir
  rationale: Le verbe peut impliquer qu’on tient compte de ce qui est entendu. « Écouter » préserve cette tension entre audition et réponse fidèle, alors qu’« obéir » trancherait explicitement en faveur d’une seule composante du sens.
translation_notes:
  register: Français international moderne, clair et digne. La phrase demeure syntaxiquement liée au contexte précédent, comme dans le texte source. La virgule appositive autour de « les prophètes » clarifie que ceux-ci sont les serviteurs mentionnés. Le point-virgule fait ressortir le contraste sans transformer le fragment en phrase autonome.
