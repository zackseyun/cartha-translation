  text: וַ/יֹּאמְר֤וּ הַ/שָּׂרִים֙ וְ/כָל הָ/עָ֔ם אֶל הַ/כֹּהֲנִ֖ים וְ/אֶל הַ/נְּבִיאִ֑ים אֵין לָ/אִ֤ישׁ הַ/זֶּה֙ מִשְׁפַּט מָ֔וֶת כִּ֗י בְּ/שֵׁ֛ם יְהוָ֥ה אֱלֹהֵ֖י/נוּ דִּבֶּ֥ר אֵלֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/016.yaml
  text: Then the officials and all the people said to the priests and the prophets[a], “This man does not deserve the sentence of death[b], for he has spoken to us in the name of Yahweh our God.”
translation:
  language: fr
  text: 'Alors les hauts fonctionnaires et tout le peuple dirent aux prêtres et aux prophètes : « Cet homme ne mérite pas la peine de mort, car il nous a parlé au nom de Yahweh, notre Dieu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: Le terme désigne ici les autorités civiles qui interviennent dans ce cadre judiciaire. « Hauts fonctionnaires » est moderne et distingue clairement ces responsables des prêtres et des prophètes.
- source_word: וְכָל הָעָם
  choice: et tout le peuple
  rationale: Traduction directe qui conserve la participation collective du peuple au verdict.
- source_word: הַכֹּהֲנִים ... הַנְּבִיאִים
  choice: aux prêtres et aux prophètes
  rationale: Termes usuels et précis pour les deux groupes auxquels les autorités et le peuple s’adressent.
- source_word: אֵין לָאִישׁ הַזֶּה מִשְׁפַּט מָוֶת
  choice: Cet homme ne mérite pas la peine de mort
  rationale: La tournure hébraïque signifie littéralement qu’il n’y a pas pour cet homme de jugement de mort. Dans cette scène de procès, « ne mérite pas la peine de mort » exprime naturellement l’absence de culpabilité passible de mort.
- source_word: כִּי
  choice: car
  rationale: Introduit la justification du verdict dans un registre soutenu mais courant.
- source_word: בְּשֵׁם יְהוָה אֱלֹהֵינוּ
  choice: au nom de Yahweh, notre Dieu
  rationale: « Au nom de » conserve l’idée d’autorité et de mandat. La virgule rend naturelle en français l’apposition « notre Dieu ».
- source_word: דִּבֶּר אֵלֵינוּ
  choice: il nous a parlé
  rationale: Le passé composé convient à une parole prononcée dont la portée demeure directement pertinente pour le verdict.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Portée judiciaire de מִשְׁפַּט מָוֶת
  choice: la peine de mort
  alternative: une condamnation à mort
  rationale: Dans le contexte du procès de Jérémie, l’expression relève du droit pénal. « La peine de mort » est idiomatique et maintient cette portée judiciaire sans ajouter de précision doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton public et judiciaire de la scène, avec un discours direct fluide.
