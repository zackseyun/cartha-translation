source:
  edition: WLC
  text: וַ/אֲנִ֖י הִנְ/נִ֣י בְ/יֶדְ/כֶ֑ם עֲשׂוּ לִ֛/י כַּ/טּ֥וֹב וְ/כַ/יָּשָׁ֖ר בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/014.yaml
  text: But as for me[a], here I am in your hand[b]. Do to me what is good and right in your eyes.
translation:
  language: fr
  text: Quant à moi, me voici entre vos mains[a]. Faites à mon égard ce qui est bon et juste à vos yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans votre main » ; il s’agit d’une expression indiquant que quelqu’un est sous le pouvoir d’autrui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant introduit un contraste et recentre le discours sur la situation personnelle de Jérémie.
- source_word: הִנְנִי
  choice: me voici
  rationale: Cette formule présentative exprime ici la disponibilité de Jérémie face à la décision de ses juges, dans un français naturel et digne.
- source_word: בְיֶדְכֶם
  choice: entre vos mains
  rationale: L’expression française idiomatique conserve l’image de la main et signifie clairement que Jérémie est sous leur pouvoir, bien que le français emploie naturellement le pluriel.
- source_word: עֲשׂוּ לִי
  choice: Faites à mon égard
  rationale: Cette formulation rend l’action dirigée envers Jérémie sans suggérer qu’ils doivent le transformer en quelque chose.
- source_word: כַטּוֹב וְכַיָּשָׁר
  choice: ce qui est bon et juste
  rationale: « Bon » et « juste » préservent l’association d’une appréciation favorable et d’une rectitude morale ou judiciaire.
- source_word: בְּעֵינֵיכֶם
  choice: à vos yeux
  rationale: La tournure conserve la métaphore hébraïque du jugement porté par les destinataires tout en restant courante en français.
