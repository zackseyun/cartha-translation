  text: אַ֣ךְ יָדֹ֣עַ תֵּדְע֗וּ כִּ֣י אִם מְמִתִ֣ים אַתֶּם֮ אֹתִ/י֒ כִּי דָ֣ם נָקִ֗י אַתֶּם֙ נֹתְנִ֣ים עֲלֵי/כֶ֔ם וְ/אֶל הָ/עִ֥יר הַ/זֹּ֖את וְ/אֶל יֹשְׁבֶ֑י/הָ כִּ֣י בֶ/אֱמֶ֗ת שְׁלָחַ֤/נִי יְהוָה֙ עֲלֵי/כֶ֔ם לְ/דַבֵּר֙ בְּ/אָזְנֵי/כֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/015.yaml
  text: Only know for certain that if you put me to death[a], you are bringing innocent blood on yourselves, on this city, and on its inhabitants[b]; for in truth Yahweh has sent me to you to speak all these words in your hearing.
translation:
  language: fr
  text: Sachez avec certitude que, si vous me mettez à mort[a], vous faites peser la culpabilité d’un sang innocent sur vous-mêmes, sur cette ville et sur ses habitants. Car, en vérité, Yahweh m’a envoyé vers vous pour vous dire toutes ces paroles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si vous me faites mourir ». Le verbe hébreu est causatif et, dans ce contexte judiciaire, « mettre à mort » convient bien.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour parler dans vos oreilles ». Cette expression signifie leur adresser ces paroles afin qu’ils les entendent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ יָדֹעַ תֵּדְעוּ
  choice: Mais sachez-le bien
  rationale: אַךְ marque ici une réserve ou un avertissement solennel, tandis que l’infinitif absolu avec le verbe conjugué renforce l’exhortation. Cette tournure française en restitue naturellement l’insistance.
- source_word: מְמִתִים אַתֶּם אֹתִי
  choice: vous me faites mourir
  rationale: Le participe hiphil de מות est causatif. « Faites mourir » conserve cette forme et convient au contexte d’une mise à mort décidée judiciairement.
- source_word: דָם נָקִי
  choice: sang innocent
  rationale: Expression hébraïque consacrée désignant le sang versé à tort, celui d’une personne innocente.
- source_word: נֹתְנִים עֲלֵיכֶם
  choice: vous faites retomber la responsabilité ... sur vous-mêmes
  rationale: Littéralement « vous mettez sur vous ». Dans ce contexte, l’expression indique que les destinataires encourront la responsabilité du sang versé; l’explicitation évite de suggérer que le sang matériel tombe sur eux.
- source_word: וְאֶל הָעִיר הַזֹּאת וְאֶל יֹשְׁבֶיהָ
  choice: sur cette ville et sur ses habitants
  rationale: La construction étend à la ville et à ses habitants les conséquences ou la responsabilité liées au sang innocent.
- source_word: בֶאֱמֶת
  choice: en vérité
  rationale: La locution souligne solennellement la réalité de la mission prophétique de Jérémie.
- source_word: שְׁלָחַנִי יְהוָה עֲלֵיכֶם
  choice: Yahweh m’a envoyé vers vous
  rationale: Le parfait présente l’envoi comme accompli et toujours pertinent. Avec שׁלח, עַל indique ici la direction de la mission vers ses destinataires.
- source_word: לְדַבֵּר בְּאָזְנֵיכֶם
  choice: pour prononcer à vos oreilles
  rationale: La formulation conserve l’image concrète de l’hébreu, « parler dans/aux oreilles », tout en restant intelligible en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » le rend comme nom propre sans lui substituer un titre.
- issue: Nature de la conséquence du sang innocent
  choice: la responsabilité du sang innocent retombe sur les coupables, la ville et ses habitants
  alternative: 'traduction littérale : « vous mettez du sang innocent sur vous »'
  rationale: Le langage hébraïque exprime la culpabilité ou la responsabilité résultant d’une mise à mort injuste. Le français explicite cet idiome sans définir davantage le mécanisme du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le caractère solennel de l’avertissement. « Yahweh » transcrit le nom divin; les images hébraïques sont conservées lorsqu’elles restent claires, avec une note pour l’expression relative aux oreilles.
