  text: Then some of the elders of the land stood up and said to all the assembly of the people[a], saying,
translation:
  language: fr
  text: 'Alors quelques hommes parmi les anciens du pays se levèrent et dirent à toute l’assemblée du peuple :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levèrent
  rationale: Le qal narratif de קום indique qu’ils se lèvent pour prendre publiquement la parole; « se levèrent » convient au registre narratif et délibératif.
- source_word: אֲנָשִׁים מִזִּקְנֵי הָאָרֶץ
  choice: quelques hommes parmi les anciens du pays
  rationale: 'אֲנָשִׁים désigne explicitement des hommes, tandis que מִן est ici partitif : ils appartiennent au groupe des anciens. « Quelques » rend naturellement cette valeur sans faire des hommes et des anciens deux groupes distincts.'
- source_word: וַיֹּאמְרוּ
  choice: dirent
  rationale: Rendu français courant de אמר dans une introduction au discours direct.
- source_word: אֶל כָּל קְהַל הָעָם
  choice: à toute l’assemblée du peuple
  rationale: קָהָל désigne ici le peuple réuni en assemblée; « toute » représente כָּל et conserve la portée collective.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles qui suivent et remplissent la fonction discursive de לֵאמֹר sans la tournure lourde « en disant ».
