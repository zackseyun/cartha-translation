id: JER.26.10
reference: Jeremiah 26:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֣וּ שָׂרֵ֣י יְהוּדָ֗ה אֵ֚ת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יַּעֲל֥וּ מִ/בֵּית הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה וַ/יֵּֽשְׁב֛וּ בְּ/פֶ֥תַח שַֽׁעַר יְהוָ֖ה הֶ/חָדָֽשׁ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/010.yaml
  text: When the officials of Judah heard these words[c][b][a], they went up from the king’s house to the house of Yahweh and sat at the entrance of the New Gate of Yahweh.
translation:
  language: fr
  text: Quand les hauts responsables de Juda entendirent ces paroles, ils montèrent du palais royal à la maison de Yahweh et s’assirent à l’entrée de la Nouvelle Porte de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire une porte de l’enceinte du temple appelée « Nouvelle Porte ».
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי יְהוּדָה
  choice: les hauts responsables de Juda
  rationale: Le terme שָׂרִים désigne ici des hommes investis d’une haute autorité politique ou administrative. « Hauts responsables » est naturel en français moderne et évite de suggérer nécessairement des princes de sang.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: Dans ce contexte, דְּבָרִים renvoie aux propos prononcés par Jérémie; « paroles » conserve cette dimension verbale.
- source_word: וַיַּעֲלוּ
  choice: ils montèrent
  rationale: Le verbe עלה exprime un mouvement ascendant, vraisemblablement vers l’enceinte du temple; la formulation française reste concise et fidèle.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: du palais royal
  rationale: Littéralement « de la maison du roi ». « Palais royal » transmet naturellement en français la fonction du bâtiment sans ambiguïté.
- source_word: בֵּית יְהוָה
  choice: à la maison de Yahweh
  rationale: La traduction conserve l’image hébraïque de la « maison » tout en désignant le temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיֵּשְׁבוּ
  choice: et s’assirent
  rationale: Rendu direct de ישׁב; une éventuelle fonction judiciaire de cette action demeure implicite, comme dans l’hébreu.
- source_word: בְּפֶתַח
  choice: à l’entrée
  rationale: פֶּתַח désigne l’ouverture ou l’entrée; « à l’entrée » exprime naturellement la position des responsables par rapport à la porte.
- source_word: שַׁעַר יְהוָה הֶחָדָשׁ
  choice: la Nouvelle Porte de Yahweh
  rationale: La formulation respecte la relation syntaxique avec Yahweh et traite « Nouvelle Porte » comme la désignation connue d’une porte du complexe du temple.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu porte le nom divin lui-même. « Yahweh » le conserve comme nom propre au lieu de le remplacer par le titre traditionnel.
- issue: Portée institutionnelle de שָׂרֵי
  choice: hauts responsables
  alternative: princes
  rationale: Le mot peut désigner des princes ou des dirigeants officiels. Le contexte met en scène des autorités judéennes, sans imposer l’idée d’une noblesse héréditaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. « Palais royal » privilégie la clarté idiomatique, tandis que « maison de Yahweh » conserve l’image théologique et architecturale du texte source.
