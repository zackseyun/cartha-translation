  text: וַ/יֹּ֨אמְר֜וּ הַ/כֹּהֲנִ֤ים וְ/הַ/נְּבִאִים֙ אֶל הַ/שָּׂרִ֔ים וְ/אֶל כָּל הָ/עָ֖ם לֵ/אמֹ֑ר מִשְׁפַּט מָ֨וֶת֙ לָ/אִ֣ישׁ הַ/זֶּ֔ה כִּ֤י נִבָּא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את כַּ/אֲשֶׁ֥ר שְׁמַעְתֶּ֖ם בְּ/אָזְנֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/011.yaml
  text: Then the priests and the prophets said to the officials and to all the people, saying, “A sentence of death is for this man, because he has prophesied against this city, just as you have heard with your own ears.”
translation:
  language: fr
  text: 'Alors les prêtres et les prophètes dirent aux hauts responsables et à tout le peuple : « Cet homme mérite la mort, car il a prophétisé contre cette ville, comme vous l’avez entendu de vos propres oreilles. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: les hauts responsables
  rationale: Le terme désigne ici les autorités civiles chargées d’examiner l’accusation; « hauts responsables » est naturel et évite l’anachronisme possible de « princes ».
- source_word: מִשְׁפַּט מָוֶת לָאִישׁ הַזֶּה
  choice: Cet homme mérite la mort
  rationale: Cette tournure française idiomatique rend le verdict ou jugement de mort réclamé contre Jérémie sans ajouter qu’une condamnation a déjà été officiellement prononcée.
- source_word: נִבָּא אֶל הָעִיר הַזֹּאת
  choice: il a prophétisé contre cette ville
  rationale: Dans ce contexte accusatoire, la préposition אֶל introduit la ville visée par une prophétie hostile; « contre » exprime cette portée contextuelle.
- source_word: כַּאֲשֶׁר שְׁמַעְתֶּם בְּאָזְנֵיכֶם
  choice: comme vous l’avez entendu de vos propres oreilles
  rationale: Conserve l’expression emphatique concrète de l’hébreu dans un français clair.
theological_decisions:
- issue: Nature de la déclaration « מִשְׁפַּט מָוֶת »
  choice: Cet homme mérite la mort
  alternative: Une sentence de mort s’impose pour cet homme
  rationale: Le contexte présente l’accusation des prêtres et des prophètes devant les autorités, non nécessairement un verdict judiciaire déjà rendu. La formulation retenue conserve cette distinction et n’approuve pas leur accusation.
- issue: Orientation de la prophétie
  choice: contre cette ville
  alternative: au sujet de cette ville
  rationale: Le contexte immédiat montre que les accusateurs considèrent le message comme dirigé contre Jérusalem; « contre » préserve la force de leur grief sans préciser davantage le contenu théologique de la prophétie.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le participe hébreu לֵאמֹר n’est pas rendu par « en disant », jugé redondant après « dirent »; les deux-points en remplissent naturellement la fonction.
