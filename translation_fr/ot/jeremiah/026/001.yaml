  yaml_path: translation/ot/jeremiah/026/001.yaml
  text: At the beginning of the reign of Jehoiakim son of Josiah[a], king of Judah, this word came from Yahweh, saying[c][b],
translation:
  language: fr
  text: 'Au début du règne de Jojakim, fils de Josias, roi de Juda, cette parole vint de Yahweh :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרֵאשִׁית מַמְלְכוּת
  choice: Au début du règne de
  rationale: L’expression situe l’événement dans la première période du règne; cette formulation est naturelle en français moderne.
- source_word: יְהוֹיָקִים בֶּן יֹאשִׁיָּהוּ
  choice: Jojakim, fils de Josias
  rationale: Les noms suivent leur forme française biblique usuelle, et la relation filiale est rendue directement.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Titre en apposition à Jojakim, sans article conformément à l’usage français.
- source_word: הָיָה הַדָּבָר הַזֶּה
  choice: cette parole vint
  rationale: Littéralement, « cette parole fut »; dans cette formule prophétique, « vint » exprime naturellement la survenue de la révélation tout en conservant « parole ».
- source_word: מֵאֵת יְהוָה
  choice: de Yahweh
  rationale: מֵאֵת indique la provenance, tandis que Yahweh représente directement le nom divin יהוה.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Dans ce contexte introductif, les deux-points annoncent naturellement en français les paroles qui suivent, sans le calque lourd « disant ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom divin; « Yahweh » le représente comme nom propre plutôt que de lui substituer un titre.
- issue: Valeur de דָּבָר dans la formule prophétique
  choice: parole
  alternative: message
  rationale: « Parole » conserve la portée d’un énoncé divin et l’idiome biblique, sans préciser davantage que l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Syntaxe fluide mais proche de la formule prophétique hébraïque; les deux-points préparent le discours du verset suivant.
