id: JER.26.2
reference: Jeremiah 26:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עֲמֹד֮ בַּ/חֲצַ֣ר בֵּית יְהוָה֒ וְ/דִבַּרְתָּ֞ עַל כָּל עָרֵ֣י יְהוּדָ֗ה הַ/בָּאִים֙ לְ/הִשְׁתַּחֲוֺ֣ת בֵּית יְהוָ֔ה אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁ֥ר צִוִּיתִ֖י/ךָ לְ/דַבֵּ֣ר אֲלֵי/הֶ֑ם אַל תִּגְרַ֖ע דָּבָֽר׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/002.yaml
  text: 'Thus says Yahweh: Stand in the court of the house of Yahweh[a], and speak to all the cities of Judah that come to worship at the house of Yahweh all the words that I have commanded you to speak to them[c][b]; do not hold back a word.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « Tiens-toi dans la cour de la maison de Yahweh[a] et adresse à tous les habitants des villes de Juda qui viennent se prosterner dans la maison de Yahweh toutes les paroles que je t’ai ordonné de leur transmettre[b]. N’en retranche pas un mot[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans la cour du temple de Yahweh ». Littéralement : « dans la cour de la maison de Yahweh ».'
    reason: L’expression hébraïque dit « maison », tandis que « temple » explicite ici le référent.
  - marker: b
    text: 'Littéralement : « parle sur toutes les villes de Juda ». La préposition hébraïque peut aussi être comprise au sens de « contre » ou « au sujet de »; le contexte paraît désigner les habitants de ces villes venus se prosterner.'
    reason: La construction prépositionnelle conserve une réelle ambiguïté quant à la relation entre le discours et les villes.
  - marker: c
    text: 'Ou « N’en omets pas un mot »; littéralement : « Ne retranche pas une parole ».'
    reason: Le verbe peut exprimer l’action de retrancher, diminuer ou omettre une partie du message.
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Cette formulation conserve la cadence solennelle de la formule prophétique tout en restant naturelle en français moderne.
- source_word: עֲמֹד
  choice: Tiens-toi
  rationale: L’impératif exprime ici le fait de prendre position à l’endroit désigné; « tiens-toi » convient mieux au contexte que le simple « reste debout ».
- source_word: בַּחֲצַר בֵּית יְהוָה
  choice: dans la cour de la maison de Yahweh
  rationale: « Cour » rend directement חָצֵר, et « maison de Yahweh » préserve l’expression hébraïque plutôt que de la remplacer par « temple ».
- source_word: עַל כָּל עָרֵי יְהוּדָה
  choice: à tous les habitants des villes de Juda
  rationale: Les villes sont prises métonymiquement pour leurs habitants, identifiés ensuite comme ceux qui viennent adorer. Cette explicitation évite en français l’idée peu naturelle de parler à des villes, tout en signalant l’ambiguïté de la préposition en note.
- source_word: הַבָּאִים לְהִשְׁתַּחֲוֺת
  choice: qui viennent se prosterner
  rationale: « Se prosterner » conserve à la fois le geste corporel et sa portée cultuelle, là où « adorer » n’exprimerait que la fonction.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: toutes les paroles
  rationale: Le pluriel « paroles » garde l’accent sur l’intégralité du message confié au prophète.
- source_word: אֲשֶׁר צִוִּיתִיךָ לְדַבֵּר אֲלֵיהֶם
  choice: que je t’ai ordonné de leur transmettre
  rationale: « Transmettre » rend naturellement en français la mission de communiquer aux destinataires les paroles reçues, sans exiger la répétition lourde de « parler ».
- source_word: אַל תִּגְרַע דָּבָר
  choice: N’en retranche pas un mot
  rationale: Le verbe גרע signifie diminuer ou retrancher. Cette traduction conserve l’image et exprime clairement l’interdiction d’omettre quoi que ce soit.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom divin; sa translittération le distingue d’un titre et préserve la référence personnelle sans ajouter d’interprétation confessionnelle.
- issue: Portée de עַל devant « toutes les villes de Juda »
  choice: adresse à tous les habitants des villes de Juda
  alternative: parle contre toutes les villes de Juda / au sujet de toutes les villes de Juda
  rationale: La proposition relative désigne ceux qui viennent des villes pour se prosterner, ce qui favorise l’idée des personnes auxquelles Jérémie doit s’adresser. La préposition permet toutefois d’autres nuances, conservées en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique garde une solennité mesurée. « Maison de Yahweh » préserve l’image hébraïque, tandis que « se prosterner » maintient le geste cultuel. Les guillemets encadrent la parole divine.
