source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֵיטִ֤יבוּ דַרְכֵי/כֶם֙ וּ/מַ֣עַלְלֵי/כֶ֔ם וְ/שִׁמְע֕וּ בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/יִנָּחֵ֣ם יְהוָ֔ה אֶל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/013.yaml
  text: So now[a], make your ways and your deeds good, and listen to the voice of Yahweh your God[c][b], and Yahweh will relent concerning the disaster that he has spoken against you.
translation:
  language: fr
  text: À présent donc, améliorez votre conduite et vos actes[a], écoutez Yahvé, votre Dieu[b], et Yahvé renoncera au malheur qu’il a annoncé contre vous[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « améliorez vos voies et vos actes ». L’hébreu dit littéralement : « rendez bonnes vos voies et vos actes ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « écoutez la voix de Yahvé, votre Dieu ». Cette expression implique souvent l’obéissance; on pourrait donc traduire : « obéissez à Yahvé, votre Dieu ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « Yahvé se ravisera au sujet du malheur ». Plus littéralement, le verbe hébreu peut exprimer le regret ou le fait de revenir sur une décision annoncée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Marque à la fois la transition et la conséquence exhortative, dans un français actuel et soutenu.
- source_word: הֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: rendez bonnes vos voies et vos actions
  rationale: Préserve le causatif de יטב ainsi que la métaphore éthique des « voies »; « actions » rend naturellement מַעֲלָלִים en français moderne.
- source_word: וְשִׁמְעוּ בְּקוֹל
  choice: écoutez la voix
  rationale: Conserve l’expression hébraïque et sa texture rhétorique, tout en laissant entendre dans ce contexte l’idée d’obéissance.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre, conformément à la couche anglaise consultée et à un usage français intelligible.
- source_word: וְיִנָּחֵם
  choice: renoncera
  rationale: Dans ce contexte de jugement annoncé, le niphal de נחם exprime le fait de revenir sur l’exécution du malheur; « renoncera » évite de suggérer une faute morale en Dieu sans effacer la réversibilité de l’annonce.
- source_word: אֶל הָרָעָה
  choice: au malheur
  rationale: רָעָה désigne ici une calamité ou un malheur, non le mal moral; avec « renoncer », la construction française naturelle appelle « à ».
- source_word: דִּבֶּר עֲלֵיכֶם
  choice: qu’il a annoncé contre vous
  rationale: « Annoncé » explicite sobrement qu’il s’agit d’une parole de jugement, tandis que « contre vous » conserve l’orientation hostile de עֲלֵיכֶם.
theological_decisions:
- issue: Le changement annoncé dans l’action divine
  choice: Yahvé renoncera au malheur
  alternative: Yahvé se ravisera au sujet du malheur / regrettera le malheur
  rationale: La formulation préserve la tension biblique entre l’annonce divine du jugement et la possibilité que celui-ci ne soit pas exécuté en cas de changement de conduite, sans attribuer à Dieu un repentir moral.
- issue: Valeur de l’écoute de la voix divine
  choice: écoutez la voix de Yahvé
  alternative: obéissez à Yahvé
  rationale: La traduction garde l’image explicite de l’hébreu, tandis qu’une note signale la portée fréquente d’obéissance sans la substituer au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conserve les impératifs directs, la métaphore des « voies » et l’expression « écouter la voix », tout en employant « malheur » pour la calamité annoncée. Les marqueurs de notes suivent l’élément précis qu’ils éclairent.
