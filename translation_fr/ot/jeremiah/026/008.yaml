source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִרְמְיָ֗הוּ לְ/דַבֵּר֙ אֵ֣ת כָּל אֲשֶׁר צִוָּ֣ה יְהוָ֔ה לְ/דַבֵּ֖ר אֶל כָּל הָ/עָ֑ם וַ/יִּתְפְּשׂ֨וּ אֹת֜/וֹ הַ/כֹּהֲנִ֧ים וְ/הַ/נְּבִאִ֛ים וְ/כָל הָ/עָ֥ם לֵ/אמֹ֖ר מ֥וֹת תָּמֽוּת׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/008.yaml
  text: And it happened[a], when Yirmeyahu had finished speaking all that Yahweh had commanded him to speak to all the people, that the priests and the prophets and all the people seized him, saying, “You must surely die!”
translation:
  language: fr
  text: 'Lorsque Yirmeyahou eut fini de dire à tout le peuple tout ce que Yahweh lui avait ordonné de dire, les prêtres, les prophètes et tout le peuple se saisirent de lui en disant : « Tu dois mourir[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Mourir, tu mourras. » L’hébreu associe un infinitif absolu à un verbe conjugué pour marquer l’insistance ; on pourrait aussi traduire : « Tu mourras certainement. »'
    reason: La note signale la construction emphatique hébraïque et une autre traduction possible.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Lorsque … eut fini
  rationale: La construction introduit la circonstance temporelle et l’enchaînement du récit. Le passé antérieur exprime naturellement en français l’achèvement de la parole avant la saisie, sans reproduire lourdement la formule narrative hébraïque.
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu, adaptée au registre courant de la traduction.
- source_word: לְדַבֵּר אֵת כָּל אֲשֶׁר
  choice: de dire … tout ce que
  rationale: Cette formulation rend la totalité du contenu communiqué et reste naturelle en français moderne.
- source_word: צִוָּה יְהוָה לְדַבֵּר
  choice: Yahweh lui avait ordonné de dire
  rationale: Le plus-que-parfait marque que l’ordre divin précède l’accomplissement rapporté. Le pronom « lui » explicite en français le destinataire implicite de l’ordre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération directe du tétragramme, qui conserve le nom propre divin au lieu de le remplacer par un titre.
- source_word: וַיִּתְפְּשׂוּ אֹתוֹ
  choice: se saisirent de lui
  rationale: Rend l’action énergique de mettre la main sur Jérémie sans préciser indûment qu’il s’agissait déjà d’une arrestation formelle.
- source_word: הַכֹּהֲנִים וְהַנְּבִאִים וְכָל הָעָם
  choice: les prêtres, les prophètes et tout le peuple
  rationale: Conserve les trois composantes de la coalition ainsi que la portée globale de כָּל.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Équivalent français direct de l’infinitif quotatif qui introduit les paroles prononcées.
- source_word: מוֹת תָּמוּת
  choice: Tu dois mourir
  rationale: La combinaison de l’infinitif absolu et du verbe conjugué exprime une affirmation emphatique, ici sous forme de menace ou de verdict. Cette tournure française est ferme et idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Yahvé
  rationale: Le texte porte un nom propre. « Yahweh » le conserve explicitement sans le remplacer par un titre ; la vocalisation antique exacte demeure toutefois incertaine.
- issue: Portée de « tout le peuple »
  choice: Conserver « tout le peuple »
  alternative: la foule entière
  rationale: Le texte associe explicitement כָּל au peuple. La traduction maintient cette généralisation rhétorique sans décider si chaque individu présent participa personnellement à la saisie.
- issue: Force de מוֹת תָּמוּת
  choice: Tu dois mourir
  alternative: Tu mourras certainement
  rationale: Le contexte permet d’entendre à la fois une menace et un verdict exigeant la mort. « Tu dois mourir » préserve cette dimension sans transformer la parole en simple prédiction.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe suit l’ordre logique du récit tout en évitant le calque pesant « Et il arriva que ». Le tutoiement convient à l’adresse directe faite à un seul homme. La répétition de « dire » est conservée parce qu’elle correspond à celle de la racine דבר dans le texte hébreu.
