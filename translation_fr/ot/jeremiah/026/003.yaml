  text: אוּלַ֣י יִשְׁמְע֔וּ וְ/יָשֻׁ֕בוּ אִ֖ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וְ/נִחַמְתִּ֣י אֶל הָ/רָעָ֗ה אֲשֶׁ֨ר אָנֹכִ֤י חֹשֵׁב֙ לַ/עֲשׂ֣וֹת לָ/הֶ֔ם מִ/פְּנֵ֖י רֹ֥עַ מַעַלְלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/003.yaml
  text: Perhaps they will listen[a], and each man will turn from his evil way[c][b], and I will relent concerning the disaster that I am planning to bring on them because of the evil of their deeds.
translation:
  language: fr
  text: Peut-être écouteront-ils[a] et chacun se détournera de sa mauvaise voie[b] ; je renoncerai alors au malheur[c] que j’envisage de leur faire subir à cause de la méchanceté de leurs actes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « entendront » ; le verbe hébreu peut exprimer à la fois le fait d’entendre et celui de tenir compte de ce qui est dit.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « reviendra » ou « se repentira de sa mauvaise conduite ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « je changerai d’avis au sujet du malheur ». L’hébreu emploie, au sujet de Dieu, un langage qui présente le jugement annoncé comme pouvant être retenu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Peut-être
  rationale: Rend simplement la possibilité ou l’espérance exprimée par la particule hébraïque, sans en atténuer la force.
- source_word: יִשְׁמְעוּ
  choice: écouteront-ils
  rationale: Dans ce contexte prophétique, שׁמע désigne non seulement le fait d’entendre, mais aussi celui de prêter attention et d’obéir ; « écouter » conserve cette amplitude.
- source_word: וְיָשֻׁבוּ
  choice: se détournera-t-il
  rationale: שׁוב signifie tourner ou revenir. Avec le complément « de sa mauvaise voie », « se détourner » exprime naturellement le mouvement moral sans employer directement le terme interprétatif « se repentir ».
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier distributif vise chaque personne au sein du peuple. « Chacun » reproduit cette portée en français naturel sans alourdir le texte.
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: de sa mauvaise voie
  rationale: Conserve la métaphore prophétique de la « voie » comme conduite ou orientation de vie, ainsi que sa qualification morale.
- source_word: וְנִחַמְתִּי
  choice: je reviendrai sur
  rationale: Dans un contexte de jugement divin annoncé, נחם indique que Dieu renonce à exécuter le malheur annoncé. Cette formulation française garde le langage de changement de décision sans suggérer une faute morale de Dieu.
- source_word: אֶל הָרָעָה
  choice: sur le malheur
  rationale: רעה désigne ici une calamité infligée en jugement, non le mal moral ; « malheur » convient au registre prophétique.
- source_word: חֹשֵׁב לַעֲשׂוֹת לָהֶם
  choice: que j’envisage de leur faire subir
  rationale: חשב suivi de l’infinitif exprime un projet ou une intention. « Faire subir » rend idiomatiquement l’idée d’amener un malheur sur eux.
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיהֶם
  choice: à cause de la méchanceté de leurs actes
  rationale: La préposition a ici une valeur causale, et מעללים désigne leurs actes ou leurs pratiques ; la traduction distingue clairement leur mal moral du « malheur » judiciaire.
theological_decisions:
- issue: Rendu de נחם appliqué à Dieu
  choice: je reviendrai sur le malheur
  alternative: je changerai d’avis au sujet du malheur ; je renoncerai au malheur
  rationale: Le verset présente réellement le jugement annoncé comme susceptible de ne pas être exécuté si le peuple se détourne de sa mauvaise voie. La formulation préserve cette conditionnalité et la tension du langage appliqué à Dieu, sans transformer נחם en repentance pour une faute morale.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore de la « voie » est conservée, tandis que la syntaxe reste naturelle. Les termes « méchanceté » et « malheur » distinguent le mal moral des actes humains de la calamité annoncée comme jugement.
