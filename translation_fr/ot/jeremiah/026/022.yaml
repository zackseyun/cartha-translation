id: JER.26.22
reference: Jeremiah 26:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֧לֶךְ יְהוֹיָקִ֛ים אֲנָשִׁ֖ים מִצְרָ֑יִם אֵ֣ת אֶלְנָתָ֧ן בֶּן עַכְבּ֛וֹר וַ/אֲנָשִׁ֥ים אִתּ֖/וֹ אֶל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/022.yaml
  text: 'Then King Jehoiakim sent men to Egypt: Elnathan son of Achbor[a], and men with him, to Egypt.'
translation:
  language: fr
  text: 'Alors le roi Jojakim envoya des hommes en Égypte : Elnathan, fils d’Akbor, ainsi que des hommes qui l’accompagnaient, en Égypte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète « en Égypte » à la fin pour indiquer la destination d’Elnathan et des hommes qui l’accompagnaient; la traduction conserve cette répétition.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Alors… envoya
  rationale: Le verbe שׁלח signifie ici « envoyer »; « alors » rend naturellement la progression narrative portée par le waw consécutif.
- source_word: הַמֶּלֶךְ יְהוֹיָקִים
  choice: le roi Jojakim
  rationale: Cette formulation française naturelle conserve le titre et le nom du souverain.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Dans cette mission officielle, le terme désigne des agents masculins; « hommes » est précis sans généraliser.
- source_word: מִצְרַיִם
  choice: Égypte
  rationale: Forme française usuelle du nom de lieu.
- source_word: אֵת
  choice: ':'
  rationale: La marque de l’objet direct introduit ici la désignation des hommes envoyés; les deux-points rendent clairement cette précision en français.
- source_word: אֶלְנָתָן בֶּן עַכְבּוֹר
  choice: Elnathan, fils d’Akbor
  rationale: Les noms sont translittérés selon des formes françaises claires, et le patronyme est rendu par la tournure habituelle « fils de ».
- source_word: וַאֲנָשִׁים אִתּוֹ
  choice: ainsi que des hommes qui l’accompagnaient
  rationale: Cette tournure naturelle exprime que d’autres hommes étaient avec Elnathan, sans préciser un rôle que l’hébreu ne donne pas.
- source_word: אֶל מִצְרַיִם
  choice: en Égypte
  rationale: La répétition finale de la destination est conservée; après un verbe de mouvement, « en Égypte » est idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition inhabituelle de la destination est maintenue parce qu’elle appartient explicitement au texte hébreu.
