  source_fidelity: Le texte rend correctement la construction descriptive (« il y avait aussi un homme qui prophétisait »), l’autorité exprimée par « au nom de Yahweh », l’origine d’Urie et le sens contextuellement adversatif de עַל (« contre »). La dernière expression, כְּכֹל דִּבְרֵי יִרְמְיָהוּ, comporte explicitement l’idée de totalité (« toutes les paroles »), que « les mêmes propos » atténue quelque peu.
