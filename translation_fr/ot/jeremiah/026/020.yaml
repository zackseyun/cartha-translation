  text: וְ/גַם אִ֗ישׁ הָיָ֤ה מִתְנַבֵּא֙ בְּ/שֵׁ֣ם יְהוָ֔ה אֽוּרִיָּ֨הוּ֙ בֶּֽן שְׁמַעְיָ֔הוּ מִ/קִּרְיַ֖ת הַיְּעָרִ֑ים וַ/יִּנָּבֵ֞א עַל הָ/עִ֤יר הַ/זֹּאת֙ וְ/עַל הָ/אָ֣רֶץ הַ/זֹּ֔את כְּ/כֹ֖ל דִּבְרֵ֥י יִרְמְיָֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/020.yaml
  text: And there was also a man prophesying in the name of Yahweh[a], Uriah son of Shemaiah from Kiriath-jearim[b], and he prophesied against this city and against this land according to all the words of Jeremiah.
translation:
  language: fr
  text: 'Il y avait aussi un homme qui prophétisait au nom de Yahweh : Urie, fils de Shemaya, de Qiryath-Yéarim. Il prophétisa contre cette ville et contre ce pays[a], en accord avec toutes les paroles de Jérémie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au sujet de cette ville et de ce pays ». La préposition hébraïque peut introduire plus généralement le sujet d’une prophétie, mais le contexte favorise ici le sens de jugement : « contre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אִישׁ הָיָה מִתְנַבֵּא
  choice: Il y avait aussi un homme qui prophétisait
  rationale: Rend naturellement en français la valeur additive de וְגַם et la construction descriptive הָיָה מִתְנַבֵּא, qui présente une activité prophétique en cours.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: Expression française courante pour parler sous l’autorité divine, tout en conservant le nom propre יהוה.
- source_word: אֽוּרִיָּהוּ בֶּן שְׁמַעְיָהוּ
  choice: Urie, fils de Shemaya
  rationale: Emploie des formes françaises ou des translittérations lisibles des noms hébreux, sans ajouter d’information.
- source_word: מִקִּרְיַת הַיְּעָרִים
  choice: de Qiryath-Yéarim
  rationale: La préposition indique l’origine; le toponyme est translittéré et le trait d’union en fait clairement une seule désignation géographique.
- source_word: וַיִּנָּבֵא
  choice: Il prophétisa
  rationale: Conserve le même verbe que dans la première proposition, avec un passé simple adapté à la progression narrative.
- source_word: עַל הָעִיר הַזֹּאת וְעַל הָאָרֶץ הַזֹּאת
  choice: contre cette ville et contre ce pays
  rationale: Le contexte de jugement favorise la valeur adversative de עַל; « pays » convient mieux que « terre » à la réalité territoriale locale.
- source_word: כְּכֹל דִּבְרֵי יִרְמְיָהוּ
  choice: en tenant les mêmes propos que Jérémie
  rationale: Exprime en français naturel la correspondance complète entre le message d’Urie et les paroles de Jérémie, sans suggérer nécessairement une citation mot à mot.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » le traite comme le nom propre divin plutôt que de le remplacer par un titre.
- issue: Valeur de עַל avec le verbe prophétiser
  choice: contre cette ville et contre ce pays
  alternative: au sujet de cette ville et de ce pays
  rationale: Le contexte rapproche le message d’Urie des annonces de jugement de Jérémie, ce qui favorise « contre », mais la valeur thématique plus générale de la préposition demeure possible et est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement du texte hébreu, tandis que « en tenant les mêmes propos que Jérémie » évite le calque peu naturel « selon toutes les paroles de Jérémie ». Le marqueur [a] figure dans le texte à l’endroit correspondant.
