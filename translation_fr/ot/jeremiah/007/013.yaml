- from: Et maintenant, puisque vous avez commis tous ces actes — déclaration de Yahweh —, que je vous ai parlé sans relâche[a], mais que vous n’avez pas écouté, que je vous ai appelés, mais que vous n’avez pas répondu,
  to: Et maintenant, puisque vous avez commis tous ces actes — déclaration de Yahweh —, je vous ai parlé sans relâche[a], mais vous n’avez pas écouté ; je vous ai appelés, mais vous n’avez pas répondu,
  rationale: La révision rétablit une syntaxe française claire en coordonnant directement les deux interventions de Yahweh et les deux refus du peuple. Elle conserve la ponctuation finale suspendue, car la conséquence de ces motifs se poursuit au verset suivant. Le rendu interprétatif prudent « sans relâche » est maintenu, avec l'image idiomatique explicitée en note.
