id: JER.7.13
reference: Jeremiah 7:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֗ה יַ֧עַן עֲשׂוֹתְ/כֶ֛ם אֶת כָּל הַ/מַּֽעֲשִׂ֥ים הָ/אֵ֖לֶּה נְאֻם יְהוָ֑ה וָ/אֲדַבֵּ֨ר אֲלֵי/כֶ֜ם הַשְׁכֵּ֤ם וְ/דַבֵּר֙ וְ/לֹ֣א שְׁמַעְתֶּ֔ם וָ/אֶקְרָ֥א אֶתְ/כֶ֖ם וְ/לֹ֥א עֲנִיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/013.yaml
  text: And now[a], because you have done all these deeds, declares Yahweh, and I spoke to you, rising early and speaking, but you did not listen, and I called to you, but you did not answer[b],
translation:
  language: fr
  text: Et maintenant, puisque vous avez commis tous ces actes — déclaration de Yahweh —, je vous ai parlé sans relâche[a], mais vous n’avez pas écouté ; je vous ai appelés, mais vous n’avez pas répondu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « me levant tôt pour parler ». Cette expression hébraïque évoque une parole adressée avec empressement, de façon répétée et persistante.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec le contexte précédent et la transition vers la conséquence annoncée.
- source_word: יַעַן עֲשׂוֹתְכֶם אֶת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: puisque vous avez commis tous ces actes
  rationale: יַעַן introduit la cause; « commis » convient au contexte de faute, tandis que « actes » rend מַעֲשִׂים sans l’atténuer en simples « choses ».
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule prophétique solennelle et conserve le nom divin comme nom propre.
- source_word: וָאֲדַבֵּר אֲלֵיכֶם הַשְׁכֵּם וְדַבֵּר
  choice: je vous ai parlé sans relâche
  rationale: L’expression hébraïque, littéralement liée au fait de se lever tôt pour parler, est idiomatique et exprime ici l’empressement et la répétition; la note en conserve l’image concrète.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: mais vous n’avez pas écouté
  rationale: « Écouté » maintient l’image auditive tout en laissant entendre le refus d’obéir, sans réduire שׁמע à l’une seule de ces nuances.
- source_word: וָאֶקְרָא אֶתְכֶם
  choice: je vous ai appelés
  rationale: Rend directement l’appel adressé au peuple; l’accord au pluriel correspond au destinataire collectif.
- source_word: וְלֹא עֲנִיתֶם
  choice: mais vous n’avez pas répondu
  rationale: Préserve l’image dialogique d’un appel demeuré sans réponse.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le Tétragramme comme nom personnel; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Traitement de l’idiome הַשְׁכֵּם וְדַבֵּר
  choice: sans relâche dans le texte, avec le sens littéral en note
  alternative: me levant tôt et parlant
  rationale: Une reproduction littérale serait peu naturelle et potentiellement obscure en français. Le texte principal communique la persistance de l’action, tandis que la note préserve l’image et sa nuance d’empressement.
- issue: Portée syntaxique du verset
  choice: maintenir une proposition suspendue se prolongeant au verset suivant
  alternative: transformer le verset en phrase autonome
  rationale: Le verset expose les motifs de la conséquence formulée ensuite; la virgule finale garde cette dépendance syntaxique et rhétorique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement pluriel correspond à l’adresse collective. La structure causale reste volontairement inachevée, car la conséquence apparaît au verset suivant.
