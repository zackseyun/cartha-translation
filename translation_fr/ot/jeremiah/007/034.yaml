source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֣י מֵ/עָרֵ֣י יְהוּדָ֗ה וּ/מֵֽ/חֻצוֹת֙ יְר֣וּשָׁלִַ֔ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֣וֹל כַּלָּ֑ה כִּ֥י לְ/חָרְבָּ֖ה תִּהְיֶ֥ה הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/034.yaml
  text: And I will put an end[a], from the cities of Judah and from the streets of Jerusalem, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride[c][b], for the land will become a ruin.
translation:
  language: fr
  text: Je ferai disparaître des villes de Juda et des rues de Jérusalem les cris de joie et d’allégresse, la voix du marié et celle de la mariée, car le pays deviendra une désolation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une terre dévastée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: Je ferai disparaître
  rationale: 'Le hiphil de שׁבת exprime ici une action causative : Dieu fera cesser ces sons. « Je ferai disparaître » est naturel en français et maintient clairement l’action divine.'
- source_word: מֵעָרֵי יְהוּדָה
  choice: des villes de Juda
  rationale: La préposition מִן indique ici le lieu d’où ces sons seront éliminés ; « des villes de Juda » est direct et idiomatique.
- source_word: וּמֵחֻצוֹת יְרוּשָׁלִַם
  choice: et des rues de Jérusalem
  rationale: חֻצוֹת désigne les rues ou les espaces publics. « Rues » fournit un équivalent clair sans exclure entièrement la dimension publique du terme.
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: les cris de joie et d’allégresse
  rationale: קוֹל désigne le son ou la voix ; avec ces noms abstraits de réjouissance, « cris » évoque naturellement les manifestations audibles de la fête. « Joie » et « allégresse » préservent la paire de termes distincts.
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: la voix du marié et celle de la mariée
  rationale: Avec des personnes, « voix » rend directement קוֹל. La reprise par « celle » conserve le parallélisme sans lourdeur, et « marié / mariée » convient au français courant.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la disparition des réjouissances.
- source_word: לְחָרְבָּה תִּהְיֶה הָאָרֶץ
  choice: le pays deviendra un désert
  rationale: La construction היה avec לְ exprime ici un devenir. חָרְבָּה désigne un état de dévastation ; « un désert » exprime naturellement en français un pays rendu désert et dévasté.
theological_decisions:
- issue: Action divine dans le jugement
  choice: « Je ferai disparaître » maintient Dieu comme sujet explicite de l’action.
  alternative: Une tournure impersonnelle telle que « les cris cesseront ».
  rationale: Le verbe hébreu à la première personne et à la forme causative attribue directement à Dieu la cessation des réjouissances ; il ne convient pas d’atténuer cette donnée.
- issue: Nature de la dévastation du pays
  choice: « le pays deviendra un désert » décrit l’aboutissement du jugement sans préciser davantage son mécanisme.
  alternative: « le pays deviendra une ruine » ou « sera dévasté ».
  rationale: Le substantif חָרְבָּה porte l’idée de désolation ou de dévastation. La traduction conserve cette image sans ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme accumulatif de l’hébreu est conservé, tout en évitant une répétition artificielle de « son » devant chaque élément. Le marqueur [a] figure bien dans le texte principal.
