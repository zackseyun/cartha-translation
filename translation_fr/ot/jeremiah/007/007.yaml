source:
  edition: WLC
  text: וְ/שִׁכַּנְתִּ֤י אֶתְ/כֶם֙ בַּ/מָּק֣וֹם הַ/זֶּ֔ה בָּ/אָ֕רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבֽוֹתֵי/כֶ֑ם לְ/מִן עוֹלָ֖ם וְ/עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/007.yaml
  text: then I will let you dwell in this place[b][a], in the land that I gave to your fathers from of old and forever.
translation:
  language: fr
  text: Alors je vous laisserai habiter dans ce lieu, dans le pays que j’ai donné à vos pères[a], depuis les temps anciens et pour toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à vos ancêtres ». L’hébreu dit littéralement « à vos pères ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression hébraïque va d’un passé lointain à un avenir sans limite définie. Autre traduction possible : « depuis toujours et pour toujours ».'
    reason: translation_clarification
lexical_decisions:
- source_word: וְשִׁכַּנְתִּי
  choice: Alors je vous laisserai habiter
  rationale: 'Le hifil de שׁכן a ici une valeur causative ou permissive : Dieu permettra au peuple de continuer à habiter dans le pays ou l’y maintiendra. « Je vous laisserai habiter » est naturel en français et convient au contexte conditionnel.'
- source_word: בַּמָּקוֹם הַזֶּה
  choice: dans ce lieu
  rationale: Cette traduction conserve le nom מָקוֹם et le démonstratif sans préciser davantage s’il s’agit du pays, de Jérusalem ou du secteur du Temple.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ désigne ici le territoire donné aux ancêtres, et non la terre entière.
- source_word: אֲשֶׁר נָתַתִּי
  choice: que j’ai donné
  rationale: Le passé composé exprime naturellement en français un don antérieur dont les effets demeurent pertinents dans le contexte.
- source_word: לַאֲבוֹתֵיכֶם
  choice: à vos pères
  rationale: La traduction formelle « pères » conserve le terme masculin hébreu אָבוֹת ; « ancêtres », plus inclusif et idiomatique, est signalé en note.
- source_word: לְמִן עוֹלָם וְעַד עוֹלָם
  choice: depuis les temps anciens et pour toujours
  rationale: Le premier עוֹלָם regarde vers un passé lointain, tandis que le second ouvre sur un avenir sans limite définie. Cette formulation préserve ce mouvement temporel sans imposer l’idée métaphysique d’une éternité passée.
theological_decisions:
- issue: La promesse implique-t-elle une possession inconditionnelle et permanente du pays ?
  choice: Présenter la déclaration comme la conséquence de la condition formulée dans le contexte immédiat, sans ajouter d’explication doctrinale.
  alternative: Formuler le verset comme une garantie absolue de possession du pays, indépendamment de l’obéissance du peuple.
  rationale: Le verset poursuit la construction conditionnelle des versets précédents. La traduction conserve donc la promesse de maintien dans le pays sans trancher les débats plus larges sur la permanence de l’alliance.
- issue: Portée syntaxique de לְמִן עוֹלָם וְעַד עוֹלָם
  choice: Rattacher l’expression temporelle à l’ensemble de l’affirmation concernant le pays ancestral, tout en conservant une ponctuation qui n’exclut pas totalement son lien avec le fait d’y habiter.
  alternative: La rattacher exclusivement au verbe « donner » ou exclusivement à « habiter ».
  rationale: L’hébreu place l’expression en fin de phrase et ne résout pas explicitement sa portée syntaxique. La traduction évite de surdéterminer cette relation.
translation_notes:
  register: Français international moderne, digne et accessible. « Habiter » est préféré à « demeurer » pour sa clarté courante, tandis que « vos pères » conserve la forme du texte source avec une solution plus idiomatique en note.
