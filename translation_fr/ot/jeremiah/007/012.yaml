  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י לְכוּ נָ֗א אֶל מְקוֹמִ/י֙ אֲשֶׁ֣ר בְּ/שִׁיל֔וֹ אֲשֶׁ֨ר שִׁכַּ֧נְתִּֽי שְׁמִ֛/י שָׁ֖ם בָּ/רִֽאשׁוֹנָ֑ה וּ/רְאוּ֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתִי ל֔/וֹ מִ/פְּנֵ֕י רָעַ֖ת עַמִּ֥/י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/012.yaml
  text: For go now to my place that was in Shiloh[a], where I made my name dwell at first, and see what I did to it because of the evil of my people Israel.
translation:
  language: fr
  text: Car allez donc à mon sanctuaire qui était à Silo, où, autrefois, j’avais fait demeurer mon nom[a]. Voyez ce que je lui ai fait à cause du mal commis par mon peuple Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « où j’avais établi mon nom ». L’hébreu conserve l’image du nom de Dieu que celui-ci fait demeurer en ce lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui appuie l’avertissement précédent et conserve naturellement la valeur causale du contexte.
- source_word: לְכוּ נָא
  choice: allez donc
  rationale: L’impératif pluriel accompagné de נָא exprime ici une exhortation pressante; « donc » rend cette insistance sans politesse artificielle.
- source_word: מְקוֹמִי
  choice: mon sanctuaire
  rationale: Le sens littéral est « mon lieu », mais le contexte désigne le lieu cultuel de Dieu à Silo; « mon sanctuaire » est naturel et explicite la référence sans modifier l’argument.
- source_word: אֲשֶׁר בְּשִׁלוֹ
  choice: qui était à Silo
  rationale: Le passé convient à l’évocation de Silo comme ancien sanctuaire désormais présenté en exemple de jugement.
- source_word: שִׁכַּנְתִּי שְׁמִי שָׁם
  choice: où […] j’avais fait demeurer mon nom
  rationale: Conserve l’image hébraïque du nom que Dieu fait demeurer en un lieu, plutôt que de l’aplanir en « placer mon nom ».
- source_word: בָּרִאשׁוֹנָה
  choice: autrefois
  rationale: Marque Silo comme lieu cultuel antérieur; en français moderne, « autrefois » est plus naturel ici que « au commencement ».
- source_word: וּרְאוּ
  choice: Voyez
  rationale: Rend directement le second impératif pluriel et invite les destinataires à considérer le précédent historique.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי לוֹ
  choice: ce que je lui ai fait
  rationale: Le pronom masculin singulier renvoie naturellement au lieu ou sanctuaire; le français conserve ce renvoi grammatical.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: Exprime clairement la cause du jugement.
- source_word: רָעַת עַמִּי יִשְׂרָאֵל
  choice: du mal commis par mon peuple Israël
  rationale: רָעָה désigne ici le mal moral à l’origine du jugement. « Commis par » évite que « le mal de mon peuple » soit compris comme un malheur subi.
theological_decisions:
- issue: Langage de la présence divine dans שִׁכַּנְתִּי שְׁמִי שָׁם
  choice: où […] j’avais fait demeurer mon nom
  alternative: où j’avais placé mon nom
  rationale: Cette formulation garde l’image biblique de la demeure du nom de Dieu et son association d’alliance avec Silo, sans suggérer que l’essence divine serait enfermée dans le sanctuaire.
- issue: Valeur temporelle de la proposition relative concernant Silo
  choice: qui était à Silo
  alternative: qui est à Silo
  rationale: Le raisonnement présente Silo comme l’ancien sanctuaire dont le sort doit servir d’avertissement à Jérusalem; le passé rend ce rapport historique en français.
translation_notes:
  register: Français international moderne, digne et accessible. « Sanctuaire » rend le référent contextuel de « mon lieu »; la syntaxe reste énergique grâce aux deux impératifs. Le plus-que-parfait situe naturellement l’établissement ancien du nom de Dieu avant le jugement évoqué.
