  text: הִנֵּ֤ה אַתֶּם֙ בֹּטְחִ֣ים לָ/כֶ֔ם עַל דִּבְרֵ֖י הַ/שָּׁ֑קֶר לְ/בִלְתִּ֖י הוֹעִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/008.yaml
  text: Look[b][a], you are trusting in deceptive words to no benefit.
translation:
  language: fr
  text: Voici, vous vous fiez à des paroles mensongères[a], en vain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des paroles trompeuses » ou « des paroles fausses ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sans aucun profit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Interpellation emphatique qui attire l’attention. « Voici » garde la force déictique et demeure digne et intelligible en français moderne.
- source_word: בֹּטְחִים
  choice: vous vous fiez
  rationale: Le participe exprime une attitude en cours ou habituelle. « Vous vous fiez » rend naturellement l’idée de confiance placée dans quelque chose.
- source_word: לָכֶם
  choice: vous vous fiez
  rationale: Le datif pronominal accompagne idiomatiquement le verbe. La tournure pronominale française « se fier » l’intègre sans imposer un sens réfléchi plus fort que ne le permet l’hébreu.
- source_word: עַל
  choice: à
  rationale: Avec « se fier », le français demande la préposition « à », équivalent idiomatique de la relation de dépendance exprimée par עַל.
- source_word: דִּבְרֵי הַשָּׁקֶר
  choice: des paroles mensongères
  rationale: Le syntagme désigne des paroles caractérisées par le mensonge ou la fausseté. « Paroles mensongères » conserve cette force sans décider si elles sont simplement fausses ou délibérément trompeuses.
- source_word: לְבִלְתִּי הוֹעִיל
  choice: et cela ne sert à rien
  rationale: Cette formulation naturelle rend l’absence totale d’utilité exprimée par l’infinitif négatif, sans faire artificiellement des « paroles » le sujet grammatical d’un verbe comme « profiter ».
theological_decisions: []
