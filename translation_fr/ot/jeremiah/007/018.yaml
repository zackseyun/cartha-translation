  text: הַ/בָּנִ֞ים מְלַקְּטִ֣ים עֵצִ֗ים וְ/הָֽ/אָבוֹת֙ מְבַעֲרִ֣ים אֶת הָ/אֵ֔שׁ וְ/הַ/נָּשִׁ֖ים לָשׁ֣וֹת בָּצֵ֑ק לַ/עֲשׂ֨וֹת כַּוָּנִ֜ים לִ/מְלֶ֣כֶת הַ/שָּׁמַ֗יִם וְ/הַסֵּ֤ךְ נְסָכִים֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֖עַן הַכְעִסֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/018.yaml
  text: The children gather wood[a], the fathers kindle the fire, and the women knead dough to make cakes for the Queen of Heaven and to pour out drink offerings to other gods, so as to provoke me to anger.
translation:
  language: fr
  text: Les enfants ramassent du bois, les pères allument le feu, et les femmes pétrissent la pâte pour faire des gâteaux à la Reine du ciel[a] et pour verser des libations à d’autres dieux, pour m’irriter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque מְלֶכֶת הַשָּׁמַיִם est traditionnellement comprise comme « la Reine du ciel », probablement un titre donné à une déesse adorée en Juda. Certains ont proposé « l’œuvre du ciel », mais le contexte favorise ici une divinité personnelle qui reçoit des offrandes.
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַקְּטִים עֵצִים
  choice: ramassent du bois
  rationale: Le participe désigne l’action de recueillir ou de rassembler. « Ramasser du bois » est naturel en français et ne précise pas indûment qu’il s’agit de brindilles ou de bois de chauffage.
- source_word: מְבַעֲרִים אֶת הָאֵשׁ
  choice: allument le feu
  rationale: Cette expression désigne ici le fait de mettre le feu en activité. « Allument le feu » est idiomatique et clair en français moderne.
- source_word: לָשׁוֹת בָּצֵק
  choice: pétrissent la pâte
  rationale: Le verbe hébreu exprime précisément le pétrissage, et non le simple mélange des ingrédients.
- source_word: כַּוָּנִים
  choice: gâteaux
  rationale: Le terme désigne des gâteaux façonnés pour un usage cultuel. Le contexte d’offrande rend cette fonction suffisamment claire sans ajouter « sacrificiels ».
- source_word: מְלֶכֶת הַשָּׁמַיִם
  choice: la Reine du ciel
  rationale: La lecture traditionnelle et la mieux adaptée au contexte comprend l’expression comme le titre d’une divinité féminine céleste. La majuscule signale un titre divin sans identifier davantage la déesse.
- source_word: וְהַסֵּךְ נְסָכִים
  choice: et pour verser des libations
  rationale: « Verser des libations » rend précisément l’acte cultuel. La répétition de « pour » clarifie que les deux actions expriment le but des préparatifs familiaux.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: à d’autres dieux
  rationale: Cette traduction directe conserve « autres » sans introduire l’idée plus interprétative de dieux étrangers.
- source_word: לְמַעַן הַכְעִסֵנִי
  choice: afin de provoquer ma colère
  rationale: La formulation conserve la valeur finale ou résultative de לְמַעַן et la force causative du verbe, tout en restant naturelle en français.
theological_decisions:
- issue: Identification de מְלֶכֶת הַשָּׁמַיִם
  choice: la Reine du ciel
  alternative: l’ouvrage du ciel
  rationale: Le contexte décrit des rites idolâtres et des offrandes adressées à une divinité personnelle; la même expression réapparaît dans Jérémie avec ce sens. La variante proposée est néanmoins signalée en note afin de préserver le débat lexical sans l’imposer au texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la succession concrète des tâches accomplies par toute la famille. « Libations » est un terme cultuel précis; le verbe « verser » en rend immédiatement le sens. Le marqueur de note est placé après l’expression qu’il explique.
