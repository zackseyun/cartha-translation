base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/022.yaml
  text: For I did not speak to your fathers or command them on the day I brought them out of the land of Egypt concerning burnt offering and sacrifice[a][b][c].
translation:
  language: fr
  text: Car je n’ai pas parlé à vos pères, et je ne leur ai pas donné d’ordres, le jour où je les ai fait sortir du pays d’Égypte, au sujet des holocaustes et des sacrifices[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au sujet de l’holocauste et du sacrifice » ; les singuliers hébreux peuvent désigner ces offrandes comme des catégories.'
    reason: lexical_alternative
  - marker: b
    text: La formulation vigoureuse souligne, dans ce contexte prophétique, la place centrale de l’obéissance plutôt que celle des rites sacrificiels ; voir le verset suivant. La traduction conserve toutefois la négation telle qu’elle est formulée en hébreu.
    reason: theological_tension
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la réprimande précédente et conserve la valeur causale du terme.
- source_word: לֹא דִבַּרְתִּי אֶת אֲבוֹתֵיכֶם
  choice: je n’ai pas parlé à vos pères
  rationale: Rend directement le verbe « parler » et conserve l’expression historique « vos pères », qui désigne ici les générations de l’Exode.
- source_word: וְלֹא צִוִּיתִים
  choice: ni ne leur ai donné d’ordres
  rationale: Exprime naturellement en français le verbe « commander » tout en maintenant le parallélisme négatif avec « je n’ai pas parlé ».
- source_word: בְּיוֹם הוציא אוֹתָם מֵאֶרֶץ מִצְרָיִם
  choice: le jour où je les ai fait sortir du pays d’Égypte
  rationale: Conserve l’ancrage temporel explicite et la formulation causative de la sortie d’Égypte.
- source_word: עַל דִּבְרֵי
  choice: au sujet de
  rationale: Introduit clairement le domaine concerné sans ajouter de notion de priorité absente de la formulation hébraïque.
- source_word: עוֹלָה וָזָבַח
  choice: des holocaustes et des sacrifices
  rationale: « Holocauste » est le terme français établi pour l’offrande entièrement consumée. Les pluriels français présentent naturellement ces deux noms singuliers hébreux comme des catégories cultuelles.
theological_decisions:
- issue: La négation pourrait-elle laisser entendre qu’aucun commandement sacrificiel n’a jamais été donné ?
  choice: 'Maintenir sans l’atténuer la négation du texte : « je n’ai pas parlé… ni ne leur ai donné d’ordres… au sujet des holocaustes et des sacrifices »'
  alternative: 'Traduire selon une priorité relative, par exemple : « ce n’est pas principalement au sujet des holocaustes et des sacrifices que je leur ai donné des ordres »'
  rationale: L’hébreu formule une négation vigoureuse. La traduction préserve cette tension prophétique ; le contexte du verset suivant peut orienter l’interprétation vers la primauté de l’obéissance, mais cette harmonisation ne doit pas être insérée dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. « Vos pères » conserve l’expression historique de l’hébreu ; « vos ancêtres » serait plus courant, mais moins proche de la forme du texte. La syntaxe garde l’ordre général de la source tout en restant naturelle en français.
