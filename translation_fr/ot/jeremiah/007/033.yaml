  text: וְֽ/הָ֨יְתָ֜ה נִבְלַ֨ת הָ/עָ֤ם הַ/זֶּה֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֣ת הָ/אָ֑רֶץ וְ/אֵ֖ין מַחֲרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/033.yaml
  text: The corpses of this people will become food for the birds of the heavens and for the beasts of the earth[a], with no one to frighten them away.
translation:
  language: fr
  text: Les cadavres de ce peuple serviront de nourriture aux oiseaux du ciel et aux bêtes de la terre[a], sans que personne les fasse fuir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le cadavre de ce peuple servira de nourriture […] sans que personne ne les fasse fuir. » En hébreu, « cadavre » est au singulier, mais peut avoir ici un sens collectif ; dans la dernière proposition, le complément d’objet est sous-entendu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: serviront de
  rationale: Dans ce discours prophétique, la forme verbale annonce un résultat futur. Avec לְמַאֲכָל, « serviront de nourriture » est naturel en français.
- source_word: נִבְלַת הָעָם הַזֶּה
  choice: les cadavres des gens de ce peuple
  rationale: Le singulier hébreu « cadavre » a ici une valeur collective. La formulation française rend clairement la pluralité des morts sans laisser entendre que le peuple entier formerait un seul corps.
- source_word: לְמַאֲכָל
  choice: de nourriture
  rationale: Le nom désigne ce qui est destiné à être mangé; « nourriture » conserve la sobriété et la brutalité de l’image.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: aux oiseaux du ciel
  rationale: עוֹף est collectif dans cette expression. « Oiseaux du ciel » est une tournure française naturelle qui reste proche de l’hébreu.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: et aux bêtes de la terre
  rationale: בְּהֵמָה fonctionne collectivement pour les animaux terrestres; « bêtes de la terre » préserve le parallélisme et le registre prophétique.
- source_word: וְאֵין מַחֲרִיד
  choice: sans que personne les fasse fuir
  rationale: Le participe causatif exprime l’action d’effrayer ou de mettre en fuite. Le pronom explicite naturellement en français l’objet sous-entendu, à savoir les oiseaux et les bêtes.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. « Les gens de ce peuple » évite l’ambiguïté française de « les cadavres de ce peuple », qui pourrait évoquer le cadavre collectif du peuple, tout en rendant la valeur collective du singulier hébreu. Le marqueur [a] est placé après le couple d’animaux, là où la note éclaire à la fois le nombre de « cadavre » et l’objet implicite de la proposition finale.
