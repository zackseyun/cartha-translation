  variant: modern international French
source:
  edition: WLC
  text: וּ/בָאתֶ֞ם וַ/עֲמַדְתֶּ֣ם לְ/פָנַ֗/י בַּ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר נִקְרָא שְׁמִ֣/י עָלָ֔י/ו וַ/אֲמַרְתֶּ֖ם נִצַּ֑לְנוּ לְמַ֣עַן עֲשׂ֔וֹת אֵ֥ת כָּל הַ/תּוֹעֵב֖וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/010.yaml
  text: Then you come and stand before me in this house[a], which is called by my name, and say[b], ‘We are delivered!’—so that you may do all these abominations.
translation:
  language: fr
  text: 'Puis vous venez vous tenir devant moi dans cette maison[a], sur laquelle mon nom est invoqué, et vous dites : « Nous sommes délivrés ! »[b] — pour commettre toutes ces abominations.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ce temple ». Le mot hébreu signifie littéralement « maison ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Nous sommes sauvés ! » ou « Nous sommes en sécurité ! »
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתֶם
  choice: Puis vous venez
  rationale: Le waw poursuit la séquence accusatrice; le présent français conserve la vivacité rhétorique, et « puis » en marque l’enchaînement.
- source_word: וַעֲמַדְתֶּם לְפָנַי
  choice: vous tenir devant moi
  rationale: Rend directement l’expression עמד לפני, qui désigne le fait de se présenter et de demeurer dans la présence de quelqu’un.
- source_word: בַּבַּיִת הַזֶּה
  choice: dans cette maison
  rationale: « Maison » traduit littéralement בַּיִת et conserve la portée de la maison de Dieu, même si le référent contextuel est le temple.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: sur laquelle mon nom est invoqué
  rationale: Cette formulation suit étroitement l’idiome hébreu « mon nom est appelé/invoqué sur elle », qui marque l’appartenance de la maison à Dieu, sans le réduire à la simple attribution d’un nom.
- source_word: נִצַּלְנוּ
  choice: Nous sommes délivrés !
  rationale: Le nifal de נצל exprime le fait d’être arraché au danger ou délivré. La tournure préserve ici l’ambiguïté entre délivrance déjà reçue et sécurité revendiquée.
- source_word: לְמַעַן עֲשׂוֹת
  choice: pour pouvoir commettre
  rationale: לְמַעַן avec l’infinitif introduit ici le but, avec une ironie accusatrice. « Pour pouvoir » rend naturellement cette finalité sans ajouter une valeur itérative absente de la forme.
- source_word: כָּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: toutes ces abominations
  rationale: « Abominations » conserve la force religieuse et morale de תּוֹעֵבוֹת ainsi que son registre biblique, tout en restant intelligible en français actuel.
theological_decisions:
- issue: Désignation du sanctuaire
  choice: maison
  alternative: temple
  rationale: Le lieu est bien le temple de Jérusalem, mais l’hébreu dit « maison ». Garder ce terme préserve le lien théologique entre la demeure, le nom divin et l’appartenance à Dieu.
- issue: Idiome du nom divin
  choice: sur laquelle mon nom est invoqué
  alternative: qui porte mon nom
  rationale: Le choix retenu maintient la formulation passive et la préposition de l’hébreu. L’alternative est plus idiomatique, mais explicite davantage l’idée d’appartenance.
- issue: Portée de נִצַּלְנוּ
  choice: Nous sommes délivrés !
  alternative: Nous sommes sauvés ! / Nous sommes en sécurité !
  rationale: « Délivrés » traduit l’idée de secours sans imposer soit un sens doctrinal plus large de salut, soit la seule notion de sécurité. L’exclamation fait entendre leur assurance présomptueuse.
- issue: Valeur de la proposition finale
  choice: pour pouvoir commettre
  alternative: afin de commettre / de manière à commettre
  rationale: 'La formulation conserve la tension choquante du texte : les interlocuteurs traitent leur délivrance supposée comme une permission de commettre ces actes. Elle n’atténue pas ce lien de finalité.'
translation_notes:
  register: Français international moderne, digne et direct. Le rythme accusateur est maintenu par la succession des verbes au présent. « Commettre » s’associe naturellement à des actes condamnables; le point d’exclamation final fait ressortir l’indignation et l’ironie de la question implicite.
