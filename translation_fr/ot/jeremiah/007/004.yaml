source:
  edition: WLC
  text: אַל תִּבְטְח֣וּ לָ/כֶ֔ם אֶל דִּבְרֵ֥י הַ/שֶּׁ֖קֶר לֵ/אמֹ֑ר הֵיכַ֤ל יְהוָה֙ הֵיכַ֣ל יְהוָ֔ה הֵיכַ֥ל יְהוָ֖ה הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/004.yaml
  text: Do not trust in deceptive words[a], saying, “The temple of Yahweh, the temple of Yahweh[b], the temple of Yahweh are these.”
translation:
  language: fr
  text: 'Ne vous fiez pas à des paroles trompeuses[a], en disant : « Le temple de Yahweh, le temple de Yahweh, le temple de Yahweh : les voilà ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des paroles mensongères ». Le terme hébreu peut souligner soit leur fausseté, soit leur effet trompeur.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu se termine par un pronom pluriel : « eux » ou « ceux-ci ». Son référent précis est discuté ; il peut renvoyer aux édifices du temple désignés par ceux qui parlent. La triple répétition exprime leur confiance mal placée dans le sanctuaire lui-même.'
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: אַל תִּבְטְחוּ לָכֶם
  choice: Ne placez pas votre confiance
  rationale: אַל suivi de l’inaccompli exprime l’interdiction. La tournure française rend naturellement בטח et laisse implicite la nuance réfléchie de לָכֶם, difficile à exprimer sans lourdeur.
- source_word: אֶל דִּבְרֵי הַשֶּׁקֶר
  choice: dans des paroles trompeuses
  rationale: Après בטח, אֶל introduit ce en quoi l’on se confie. שׁקר peut désigner la fausseté ou la tromperie ; « trompeuses » conserve ici les deux dimensions.
- source_word: לֵאמֹר
  choice: en disant
  rationale: L’infinitif introduit le contenu des paroles trompeuses ; « en disant » est direct et idiomatique.
- source_word: הֵיכַל יְהוָה
  choice: le temple de Yahweh
  rationale: הֵיכַל désigne ici le temple de Jérusalem. La construction est rendue simplement, et le nom divin יְהוָה est translittéré « Yahweh ».
- source_word: הֵמָּה
  choice: c’est ici
  rationale: Le pronom démonstratif pluriel renvoie vraisemblablement au lieu ou aux bâtiments montrés. Le français littéral « ce sont eux » serait obscur ; « c’est ici » préserve le geste démonstratif sans identifier artificiellement trois temples.
theological_decisions:
- issue: Triple répétition de הֵיכַל יְהוָה
  choice: Répéter intégralement trois fois « le temple de Yahweh »
  alternative: Réduire la formule ou traduire « Voici le temple de Yahweh »
  rationale: La répétition rhétorique met en relief la confiance mal placée dans le sanctuaire ; elle doit rester audible sans que la traduction explique à la place du prophète.
- issue: Référent de הֵמָּה
  choice: « c’est ici », avec une note signalant la formulation hébraïque
  alternative: « ce sont eux » ou « ce sont ceux-ci »
  rationale: La forme plurielle est authentique mais son référent précis reste discuté, peut-être les bâtiments du complexe du temple. La traduction française rend le sens démonstratif probable, tandis que la note préserve l’ambiguïté formelle.
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel ; sa translittération le distingue d’un titre et suit la convention fournie pour le projet.
translation_notes:
  register: Français international actuel, digne et oralement fluide. La triple formule est conservée. L’exclamation rend la force du slogan, tandis que les notes gardent visibles l’alternative lexicale de שׁקר et la difficulté du pluriel הֵמָּה.
