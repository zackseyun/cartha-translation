source:
  edition: WLC
  text: הַ/מְעָרַ֣ת פָּרִצִ֗ים הָיָ֨ה הַ/בַּ֧יִת הַ/זֶּ֛ה אֲשֶׁר נִקְרָֽא שְׁמִ֥/י עָלָ֖י/ו בְּ/עֵינֵי/כֶ֑ם גַּ֧ם אָנֹכִ֛י הִנֵּ֥ה רָאִ֖יתִי נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/011.yaml
  text: Has this house[a], which is called by my name, become a den of robbers in your eyes? Even I myself, look, I have seen it, declares Yahweh.
translation:
  language: fr
  text: Cette maison, sur laquelle mon nom est invoqué, est-elle devenue à vos yeux une caverne de brigands[a] ? Moi aussi, oui, je l’ai vu — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une caverne d’hommes violents » ou « un repaire de bandits ». Le terme hébreu peut désigner plus largement des hommes violents et sans loi, et pas seulement des voleurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעָרַת
  choice: caverne
  rationale: Le nom désigne une grotte servant de repaire ou de refuge. « Caverne » conserve l’image concrète de l’hébreu et reste naturelle dans l’expression française.
- source_word: פָּרִצִים
  choice: brigands
  rationale: Le terme désigne des hommes violents et sans loi, notamment des pillards ou des bandits. « Brigands » exprime à la fois la criminalité prédatrice et l’idée de bande violente sans réduire le sens au seul vol.
- source_word: הָיָה
  choice: est-elle devenue
  rationale: 'Le parfait peut ici exprimer l’état résultant : la maison a été transformée, dans leur manière de la considérer et de l’utiliser, en refuge de malfaiteurs.'
- source_word: הַבַּיִת הַזֶּה
  choice: cette maison
  rationale: Traduction directe qui préserve la désignation biblique du temple comme maison de Dieu; le contexte identifie clairement le bâtiment.
- source_word: נִקְרָא שְׁמִי עָלָיו
  choice: sur laquelle mon nom est invoqué
  rationale: 'La formulation conserve la construction hébraïque et son ambiguïté féconde : le nom de Dieu est proclamé sur cette maison, qui se trouve ainsi placée sous son nom et lui appartient.'
- source_word: בְּעֵינֵיכֶם
  choice: à vos yeux
  rationale: Équivalent idiomatique français qui garde la dimension évaluative de l’expression hébraïque.
- source_word: גַּם אָנֹכִי
  choice: Moi aussi, oui
  rationale: La combinaison est fortement emphatique. La dislocation « Moi aussi » et le renforcement « oui » rendent l’insistance sans lourdeur excessive.
- source_word: הִנֵּה רָאִיתִי
  choice: je l’ai vu
  rationale: הִנֵּה attire l’attention et renforce ici l’affirmation. En français, « oui » placé avec le sujet emphatique rend cette force, tandis que le pronom « l’ » explicite naturellement l’objet sous-entendu.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Formule prophétique solennelle qui présente la parole comme l’oracle ou la déclaration divine, tout en restant compréhensible en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin exprimé directement par le tétragramme, plutôt que substitution par un titre.
theological_decisions:
- issue: Expression du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le représente directement et le distingue d’un simple titre.
- issue: Valeur de היה dans la question rhétorique
  choice: est-elle devenue
  alternative: est-elle
  rationale: La lecture résultative fait ressortir la transformation accusée par le prophète, tout en laissant ouverte la valeur stative possible de la forme hébraïque.
- issue: Portée de נִקְרָא שְׁמִי עָלָיו
  choice: sur laquelle mon nom est invoqué
  alternative: qui porte mon nom
  rationale: La traduction plus formelle préserve l’idiome d’autorité, d’appartenance et de présence sans choisir exclusivement l’une de ces implications théologiques.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La syntaxe conserve la question rhétorique et l’image concrète de la caverne. « Déclaration de Yahweh » maintient le poids de la formule prophétique sans archaïsme marqué.
