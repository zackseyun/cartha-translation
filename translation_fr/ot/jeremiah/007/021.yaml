source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עֹלוֹתֵי/כֶ֛ם סְפ֥וּ עַל זִבְחֵי/כֶ֖ם וְ/אִכְל֥וּ בָשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/021.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Add your burnt offerings to your sacrifices, and eat the flesh.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées, le Dieu d’Israël : « Ajoutez vos holocaustes à vos sacrifices[a], et mangez la viande. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos sacrifices de paix » ; le terme hébreu peut désigner plus précisément des sacrifices dont l’offrant mangeait une part.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule prophétique naturelle en français moderne, qui introduit solennellement une déclaration divine sans archaïsme inutile.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh, le Dieu des armées
  rationale: Le nom personnel divin est conservé. Dans ce titre, « le Dieu des armées » exprime naturellement en français l’autorité de Yahweh sur les armées célestes et terrestres, sans réduire nécessairement le sens aux seules forces militaires humaines.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la construction hébraïque qui identifie le Dieu d’Israël.
- source_word: עֹלוֹתֵיכֶם
  choice: vos holocaustes
  rationale: « Holocaustes » est le terme cultuel français usuel pour les offrandes entièrement consumées sur l’autel.
- source_word: סְפוּ עַל
  choice: Ajoutez … à
  rationale: Cette construction française reproduit clairement l’impératif hébreu et conserve son ironie mordante.
- source_word: זִבְחֵיכֶם
  choice: vos sacrifices
  rationale: Le terme hébreu peut désigner les sacrifices en général. Le contexte peut évoquer plus précisément ceux dont les adorateurs mangeaient une part, possibilité signalée en note.
- source_word: וְאִכְלוּ בָשָׂר
  choice: et mangez la viande
  rationale: « Viande » est le terme naturel dans ce contexte alimentaire et sacrificiel. L’impératif coordonné conserve la force ironique de la déclaration.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom personnel divin; sa translittération préserve ce nom plutôt que de lui substituer un titre.
- issue: Portée de זִבְחֵיכֶם en contraste avec les holocaustes
  choice: vos sacrifices
  alternative: vos sacrifices de paix
  rationale: Le mot peut être général, même si son opposition aux holocaustes suggère ici des sacrifices dont on pouvait manger la viande. Le texte principal conserve l’ambiguïté lexicale, tandis que la note présente la lecture plus précise.
translation_notes:
  register: Français international moderne, clair et digne. La tournure prophétique reste solennelle, tandis que le point d’exclamation final fait ressortir l’ironie vive des impératifs sans l’expliquer dans le texte.
