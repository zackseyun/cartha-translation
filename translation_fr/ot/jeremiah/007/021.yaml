    rationale: « Yahweh, le Dieu des armées » explicite et reformule le titre, alors que le texte porte littéralement « Yahweh des armées ». Cette reformulation produit en outre une double apposition avec « le Dieu d’Israël ». « Yahweh des armées » préserve mieux la forme et la concision du titre.
  - severity: low
    issue: Point d’exclamation ajouté
    rationale: L’hébreu comporte des impératifs ironiques, mais ne requiert pas de point d’exclamation. Le retirer évite une interprétation typographique supplémentaire.
  - severity: low
    issue: Formulation de la note
    rationale: Dans le cadre sacrificiel, « offrant » décrit plus précisément la personne qui présente le sacrifice que « adorateur », sans modifier l’option lexicale signalée.
