source:
  edition: WLC
  text: כִּ֣י אִֽם אֶת הַ/דָּבָ֣ר הַ֠/זֶּה צִוִּ֨יתִי אוֹתָ֤/ם לֵ/אמֹר֙ שִׁמְע֣וּ בְ/קוֹלִ֔/י וְ/הָיִ֤יתִי לָ/כֶם֙ לֵֽ/אלֹהִ֔ים וְ/אַתֶּ֖ם תִּֽהְיוּ לִ֣/י לְ/עָ֑ם וַ/הֲלַכְתֶּ֗ם בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אֲצַוֶּ֣ה אֶתְ/כֶ֔ם לְמַ֖עַן יִיטַ֥ב לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/023.yaml
  text: 'But this command I gave them: ‘Listen to my voice[a], and I will be your God, and you shall be my people; and walk in all the way that I command you, so that it may go well with you.’'
translation:
  language: fr
  text: 'Mais voici le commandement que je leur ai donné : « Écoutez ma voix[a], et je serai votre Dieu, et vous serez mon peuple ; suivez toute la voie que je vous prescris, afin que tout aille bien pour vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Obéissez-moi ». En hébreu, l’expression « écouter la voix » implique souvent l’obéissance.
    reason: Alternative lexicale et précision sur l’idiome hébreu.
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais
  rationale: Dans le contexte, l’expression introduit une correction contrastive après la négation du verset précédent. « Mais » rend naturellement cette valeur adversative.
- source_word: הַדָּבָר הַזֶּה
  choice: voici le commandement
  rationale: דָּבָר peut désigner une parole, une chose ou une affaire ; avec צִוִּיתִי, il s’agit ici du contenu d’un commandement. La tournure française évite une répétition maladroite.
- source_word: צִוִּיתִי אוֹתָם לֵאמֹר
  choice: que je leur ai donné
  rationale: Avec « le commandement », cette formulation française transmet le sens de « j’ai commandé », tandis que les deux-points introduisent directement les paroles prononcées.
- source_word: שִׁמְעוּ בְקוֹלִי
  choice: Écoutez ma voix
  rationale: La traduction conserve l’image hébraïque et le sens premier d’entendre ou d’écouter, sans effacer la nuance d’obéissance impliquée dans cet idiome d’alliance.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: Alors je serai votre Dieu
  rationale: Cette formule naturelle en français conserve la relation d’alliance. « Alors » explicite sobrement la portée consécutive que peut prendre le waw dans la suite de l’impératif.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: et vous serez mon peuple
  rationale: La formulation française usuelle préserve le parallélisme et la réciprocité de la formule d’alliance.
- source_word: וַהֲלַכְתֶּם בְּכָל הַדֶּרֶךְ
  choice: Suivez entièrement la voie
  rationale: Littéralement, il est question de marcher dans toute la voie. « Suivez entièrement la voie » conserve la métaphore de la voie, son caractère singulier et l’idée d’une obéissance sans réserve, dans un français naturel.
- source_word: אֲשֶׁר אֲצַוֶּה אֶתְכֶם
  choice: que je vous prescris
  rationale: L’imparfait hébreu peut avoir ici une valeur présente ou prospective. Le présent français convient à une stipulation générale et « prescris » évite la répétition de « commandement ».
- source_word: לְמַעַן יִיטַב לָכֶם
  choice: afin que tout aille bien pour vous
  rationale: Cette tournure rend clairement le but exprimé par לְמַעַן et l’idiome de bien-être יִיטַב לָכֶם.
theological_decisions:
- issue: Formule d’alliance
  choice: « je serai votre Dieu, et vous serez mon peuple »
  alternative: « je serai Dieu pour vous, et vous serez pour moi un peuple »
  rationale: La formulation choisie restitue naturellement en français la relation réciproque de l’alliance sans ajouter de contenu doctrinal.
- issue: Portée de שִׁמְעוּ בְקוֹלִי
  choice: « Écoutez ma voix » dans le texte principal
  alternative: « Obéissez-moi » ou « Obéissez à ma voix »
  rationale: L’idiome implique souvent l’obéissance, mais son expression concrète est celle de l’écoute. Le texte principal conserve cette image et une note signale la nuance.
- issue: Relation entre l’écoute et la formule d’alliance
  choice: Employer « Alors » avant « je serai votre Dieu »
  alternative: Coordonner simplement par « et »
  rationale: Dans cette chaîne verbale, le waw peut exprimer la suite ou la conséquence de l’impératif. « Alors » rend cette relation possible sans transformer le passage en exposé doctrinal sur la nature de l’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image de la voix et celle de la voie, tout en évitant les calques peu naturels tels que « marcher dans toute la voie ».
