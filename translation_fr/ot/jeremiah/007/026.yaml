  source_fidelity: La première proposition rend fidèlement שָׁמְעוּ אֵלַי par « ils ne m’ont pas écouté ». « N’ont pas tendu l’oreille » rend bien l’idiome הִטּוּ אֶת־אָזְנָם sans le réduire à « obéi ». La métaphore de la nuque est conservée. En revanche, « ont fait pire » est un peu plus vague que הֵרֵעוּ, qui qualifie explicitement une conduite mauvaise; « ont agi plus mal » restitue mieux cette valeur et le comparatif עם מֵאֲבוֹתָם.
  naturalness: Le français est globalement naturel et d’un registre approprié. Pour une partie du corps déterminée par le sujet, « raidi la nuque » est plus idiomatique que « raidi leur nuque ». « Ont agi plus mal que leurs pères » est également naturel et plus précis dans ce contexte.
  terminology: « Écouté », « tendre l’oreille », « nuque » et « pères » sont des choix exacts et accessibles. La note sur « ancêtres » préserve correctement l’extension possible de אָבוֹת. La note sur la nuque doit éviter d’ajouter l’idée spécifique de « se laisser diriger », qui n’est pas exprimée directement par l’hébreu.
