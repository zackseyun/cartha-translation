  text: וְ/ל֤וֹא שָׁמְעוּ֙ אֵלַ֔/י וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָ֑/ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם הֵרֵ֖עוּ מֵ/אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/026.yaml
  text: Yet they did not listen to me[a], and they did not incline their ear, but they stiffened their neck[b]; they acted more wickedly than their fathers.
translation:
  language: fr
  text: Pourtant, ils ne m’ont pas écouté et n’ont pas tendu l’oreille[a] ; ils ont raidi la nuque[b] et ont agi plus mal que leurs pères[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « n’ont pas incliné leur oreille », expression qui signifie qu’ils n’ont pas prêté attention.'
    reason: cultural_note
  - marker: b
    text: « Raidir la nuque » est une image exprimant l’obstination.
    reason: cultural_note
  - marker: c
    text: 'Ou : « leurs ancêtres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֵלַי
  choice: ne m’ont pas écouté
  rationale: Avec אֶל, שׁמע exprime ici une écoute attentive qui implique l’accueil du message. « Écouté » conserve ce sens sans expliciter excessivement par « obéi ».
- source_word: הִטּוּ אֶת אָזְנָם
  choice: n’ont pas tendu l’oreille
  rationale: Cette expression préserve l’image hébraïque d’une oreille que l’on incline pour prêter attention, dans une formulation française naturelle.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: ils ont raidi leur nuque
  rationale: La traduction conserve la métaphore hébraïque de l’obstination plutôt que de la remplacer par une interprétation abstraite.
- source_word: הֵרֵעוּ
  choice: ont fait pire
  rationale: Le hifil de רעע exprime ici le fait d’agir mal. Avec la comparaison introduite par מִן, « ont fait pire » rend naturellement en français l’aggravation de leur conduite.
- source_word: מֵאֲבוֹתָם
  choice: que leurs pères
  rationale: אָבוֹת peut désigner les pères ou, plus largement, les ancêtres. « Leurs pères » maintient la formulation hébraïque et la comparaison avec les générations précédentes.
- source_word: וְלֹא ... וְלֹא ... וַ
  choice: Pourtant ... et ... ; ... et ...
  rationale: « Pourtant » exprime la valeur adversative du premier waw dans le contexte, tandis que la coordination française garde la progression des propositions sans lourdeur.
theological_decisions:
- issue: Force interprétative de שׁמע
  choice: ne m’ont pas écouté
  alternative: ne m’ont pas obéi
  rationale: L’écoute implique ici le refus de tenir compte de la parole divine, mais « écouté » préserve l’étendue du terme hébreu sans réduire d’emblée son sens à l’obéissance.
- issue: Portée de אָבוֹת
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: Le terme peut viser les pères au sens strict ou les générations antérieures. Le texte principal conserve l’expression plus formelle, tandis que la note signale le sens élargi.
- issue: Comparatif de conduite morale
  choice: ont fait pire que
  alternative: ont agi plus mal que
  rationale: Les deux rendent le comparatif explicite. « Ont fait pire » est plus idiomatique en français moderne tout en conservant le jugement moral du verbe hébreu.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme de l’écoute refusée est maintenu, ainsi que la métaphore concrète de la nuque raidie. « Ont fait pire » privilégie une tournure courante sans atténuer la gravité morale du texte.
