  text: עֲמֹ֗ד בְּ/שַׁ֨עַר֙ בֵּ֣ית יְהוָ֔ה וְ/קָרָ֣אתָ שָּׁ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה וְ/אָמַרְתָּ֞ שִׁמְע֣וּ דְבַר יְהוָ֗ה כָּל יְהוּדָה֙ הַ/בָּאִים֙ בַּ/שְּׁעָרִ֣ים הָ/אֵ֔לֶּה לְ/הִֽשְׁתַּחֲוֺ֖ת לַ/יהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/002.yaml
  text: Stand in the gate of the house of Yahweh[a], and proclaim there this word, and say, “Hear the word of Yahweh, all Judah, who enter through these gates to worship Yahweh.”
translation:
  language: fr
  text: 'Place-toi à la porte de la maison de Yahweh et proclame là cette parole, et dis : « Écoutez la parole de Yahweh, vous tous de Juda qui entrez par ces portes pour vous prosterner devant Yahweh[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour adorer Yahweh ». Le verbe hébreu désigne l’action de s’incliner ou de se prosterner, notamment dans le culte.
    reason: alternative lexicale
lexical_decisions:
- source_word: עֲמֹד
  choice: Place-toi
  rationale: L’impératif demande à Jérémie de prendre position à un endroit précis. « Place-toi » exprime naturellement cette idée en français.
- source_word: בְּשַׁעַר בֵּית יְהוָה
  choice: à la porte de la maison de Yahweh
  rationale: « À la porte » rend la localisation sans suggérer que Jérémie se tient matériellement à l’intérieur d’une porte. « Maison de Yahweh » conserve l’expression hébraïque plutôt que de l’expliciter par « temple ».
- source_word: וְקָרָאתָ שָּׁם אֶת־הַדָּבָר הַזֶּה
  choice: et proclame là cette parole
  rationale: Dans ce contexte prophétique, קרא désigne une annonce publique. « Cette parole » maintient le singulier et l’idiome prophétique de l’hébreu.
- source_word: וְאָמַרְתָּ
  choice: Tu diras
  rationale: Le futur français à valeur injonctive restitue naturellement la consigne divine qui introduit le discours direct.
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: Écoutez la parole de Yahweh
  rationale: « Écoutez » est plus idiomatique qu’un calque avec « entendre » pour une exhortation adressée à un groupe, tout en gardant la formule prophétique « parole de Yahweh ».
- source_word: כָּל־יְהוּדָה הַבָּאִים
  choice: vous tous de Juda qui entrez
  rationale: Cette formulation rend l’adresse collective « tout Juda » et rattache clairement le participe pluriel aux personnes interpellées.
- source_word: לְהִשְׁתַּחֲוֺת לַיהוָה
  choice: pour vous prosterner devant Yahweh
  rationale: Le verbe חוה à la forme réfléchie évoque l’acte de se courber ou de se prosterner en hommage cultuel. La traduction conserve ici le geste concret plutôt que de le réduire au terme général « adorer ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu, plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve sa fonction de nom propre sans lui substituer un titre.
- issue: Portée cultuelle de לְהִשְׁתַּחֲוֺת
  choice: vous prosterner devant Yahweh
  alternative: adorer Yahweh
  rationale: Le contexte est clairement cultuel, mais le verbe garde l’image physique de l’inclination. « Se prosterner devant » préserve à la fois le geste et sa valeur d’adoration.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’expression hébraïque « maison de Yahweh » et la force concrète de « se prosterner », tout en employant une syntaxe française naturelle.
