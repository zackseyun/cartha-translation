base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/014.yaml
  text: So I will do to the house that is called by my name[a], in which you trust, and to the place that I gave to you and to your fathers[b], just as I did to Shiloh.
translation:
  language: fr
  text: Alors je ferai à la maison qui porte mon nom[a], celle où vous mettez votre confiance, ainsi qu’au lieu que je vous ai donné, à vous et à vos pères, comme j’ai fait à Silo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « sur laquelle mon nom est appelé ». Cette expression hébraïque indique que la maison appartient au Seigneur ou est identifiée à lui.'
    reason: lexical_alternative
  - marker: b
    text: Silo était un ancien lieu de culte dont la destruction sert ici d’avertissement ; voir 1 Samuel 4 et Jérémie 7.12.
    reason: cross_reference
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: Alors, je traiterai
  rationale: Le waw relie la sentence à l’avertissement précédent. « Alors » exprime naturellement cette conséquence, tandis que « traiter » permet de conserver en français la brièveté menaçante de l’hébreu sans ajouter explicitement ce que Dieu fera.
- source_word: לַבַּיִת
  choice: la maison
  rationale: Le terme signifie littéralement « maison » et désigne ici le Temple. Le maintien de « maison » préserve le vocabulaire hébreu ainsi que sa distinction avec « le lieu ».
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: sur laquelle mon nom est invoqué
  rationale: Cette formulation reste proche de l’image hébraïque, tout en étant intelligible en français. L’expression indique que la maison porte le nom de Dieu, lui appartient et lui est publiquement associée.
- source_word: אֲשֶׁר אַתֶּם בֹּטְחִים בּוֹ
  choice: celle dans laquelle vous placez votre confiance
  rationale: Le participe exprime une confiance persistante. « Placer sa confiance dans » est idiomatique et rend clairement l’objet de cette fausse sécurité.
- source_word: וְלַמָּקוֹם
  choice: ainsi que le lieu
  rationale: « Lieu » conserve le terme hébreu et sa distinction avec la « maison »; le référent peut englober Jérusalem ou le site sacré plus largement.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: que je vous ai donné, à vous et à vos pères
  rationale: La reprise « à vous » fait entendre la construction hébraïque et évite que « vos pères » paraisse dépendre directement du verbe sans préposition. « Pères » traduit formellement אָבוֹתֵיכֶם.
- source_word: כַּאֲשֶׁר עָשִׂיתִי לְשִׁלוֹ
  choice: comme j’ai traité Silo
  rationale: La comparaison reprend le même verbe qu’au début du verset. « Traiter » produit en français une phrase naturelle et conserve l’omission menaçante de la nature précise du jugement.
theological_decisions:
- issue: Langage d’appartenance exprimé par le nom divin
  choice: sur laquelle mon nom est invoqué
  alternative: qui porte mon nom
  rationale: La formulation choisie préserve davantage l’image passive de l’hébreu et laisse la note expliquer l’idée d’appartenance, sans réduire l’expression à une simple dénomination.
- issue: Distinction entre la maison et le lieu
  choice: Conserver « maison » et « lieu » comme deux désignations distinctes
  alternative: Employer « Temple » puis « sanctuaire »
  rationale: L’hébreu distingue explicitement בַּיִת de מָקוֹם. Cette distinction laisse ouverte l’étendue exacte du jugement annoncé et évite d’ajouter une précision théologique.
- issue: Traduction de « vos pères »
  choice: vos pères
  alternative: vos ancêtres
  rationale: « Pères » correspond directement au mot hébreu et maintient la coloration historique et familiale de l’alliance; « ancêtres » serait plus inclusif mais légèrement plus interprétatif.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « traiter » conserve l’écho verbal de עשה aux deux extrémités du verset et son imprécision volontairement menaçante. « Silo » suit la forme française traditionnelle du toponyme.
