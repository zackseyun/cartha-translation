revisions:
- from: Alors, je traiterai la maison sur laquelle mon nom est invoqué[a], celle dans laquelle vous placez votre confiance, ainsi que le lieu que je vous ai donné, à vous et à vos pères, comme j’ai traité Silo[b].
  to: Alors je ferai à la maison qui porte mon nom[a], celle où vous mettez votre confiance, ainsi qu’au lieu que je vous ai donné, à vous et à vos pères, comme j’ai fait à Silo[b].
  rationale: La révision remplace une image française potentiellement ambiguë par l’équivalent idiomatique « qui porte mon nom », tout en signalant la forme littérale dans la note. Elle remplace aussi « traiter » par « faire à », tournure qui maintient la brièveté et l’objet implicite de l’action divine dans le texte source. Les termes fondamentaux et l’ambiguïté délibérée de la sentence sont conservés.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:39:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et les référents du texte hébreu sont bien respectés : la « maison » et le « lieu » restent distincts, la confiance du peuple porte sur la maison, le don est fait au peuple et à ses pères, et Silo demeure le précédent comparatif. Toutefois, « mon nom est invoqué » risque d’évoquer l’invocation cultuelle ou la prière, plutôt que l’idiome hébreu indiquant qu’un lieu porte le nom de Dieu ou lui est attaché.'
  naturalness: « Traiter la maison » et « traiter Silo » sont peu naturels en français lorsqu’il s’agit de lieux. La formulation révisée conserve l’ellipse menaçante de l’hébreu tout en étant idiomatique. « Celle dans laquelle » est aussi allégé.
  terminology: « Maison », « lieu », « pères » et « Silo » conviennent. « Qui porte mon nom » rend naturellement en français le sens idiomatique de אשר נקרא שמי עליו sans imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: « sur laquelle mon nom est invoqué »
    rationale: Cette expression peut signifier que l’on prie ou appelle Dieu sur ce lieu. L’hébreu אומר littéralement que le nom de Dieu est « appelé sur » la maison, idiome d’appartenance, de désignation ou d’identification ; « qui porte mon nom » restitue ce sens plus sûrement.
  - severity: low
    issue: « je traiterai la maison » / « comme j’ai traité Silo »
    rationale: Le verbe « traiter » avec des bâtiments ou des localités sonne inhabituel et peut suggérer une manière de les administrer. « Je ferai à … comme j’ai fait à … » garde l’objet du verbe non exprimé, comme en hébreu, et reste clair dans la menace contextuelle.
