source:
  edition: WLC
  text: כִּ֤י אִם הֵיטֵיב֙ תֵּיטִ֔יבוּ אֶת דַּרְכֵי/כֶ֖ם וְ/אֶת מַֽעַלְלֵי/כֶ֑ם אִם עָשׂ֤וֹ תַֽעֲשׂוּ֙ מִשְׁפָּ֔ט בֵּ֥ין אִ֖ישׁ וּ/בֵ֥ין רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/005.yaml
  text: For if you truly make your ways and your deeds good[a], if you truly do justice between a man and his neighbor[b],
translation:
  language: fr
  text: Car si vous améliorez vraiment votre conduite et vos actes[a], si vous faites vraiment justice entre un homme et son prochain[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si vous corrigez réellement vos voies et vos agissements ». L’hébreu renforce le verbe au moyen d’un infinitif absolu, ici comme dans la proposition suivante.
    reason: lexical_alternative
  - marker: b
    text: Ou « si vous rendez vraiment la justice entre un homme et son prochain ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Car si
  rationale: Cette tournure conserve à la fois la valeur connective de כִּי et la condition introduite par אִם, sans accentuer indûment le contraste avec le verset précédent.
- source_word: הֵיטֵיב תֵּיטִיבוּ
  choice: vous améliorez vraiment
  rationale: L’infinitif absolu joint au verbe conjugué intensifie l’action. « vraiment » restitue naturellement cette insistance, tandis qu’« améliorer » convient aux compléments « conduite » et « actes ».
- source_word: דַּרְכֵיכֶם
  choice: votre conduite
  rationale: Le pluriel hébreu « vos voies » désigne ici la manière de vivre. « Votre conduite » rend clairement cette métaphore en français courant sans en modifier la portée morale.
- source_word: מַעַלְלֵיכֶם
  choice: vos actes
  rationale: Le nom désigne les actions ou les agissements. « Actes » est naturel, précis et s’accorde bien avec « conduite ».
- source_word: אִם עָשׂוֹ תַעֲשׂוּ
  choice: si vous pratiquez vraiment
  rationale: La seconde construction avec infinitif absolu marque elle aussi l’insistance. « Pratiquer la justice » est idiomatique et indique une action habituelle ou concrète.
- source_word: מִשְׁפָּט
  choice: la justice
  rationale: Dans ce contexte, le terme évoque l’exercice de ce qui est juste dans les relations sociales, plutôt qu’un jugement isolé.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: entre un homme et son prochain
  rationale: Cette formulation préserve le masculin singulier représentatif de אִישׁ et rend רֵעֵהוּ par le terme biblique français encore intelligible « son prochain ».
theological_decisions:
- issue: Langage masculin représentatif dans אִישׁ
  choice: un homme
  alternative: une personne
  rationale: L’hébreu emploie le masculin singulier אִישׁ dans une formule sociale et juridique de portée représentative. La traduction conserve cette forme sans limiter nécessairement l’application aux seuls hommes.
translation_notes:
  register: Français moderne, clair et digne. « Conduite » explicite naturellement la métaphore hébraïque des « voies »; « son prochain » conserve la tonalité biblique sans être archaïque. La phrase reste ouverte par une virgule, conformément à la structure conditionnelle qui se poursuit au verset suivant.
