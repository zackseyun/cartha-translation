  text: גָּזִּ֤י נִזְרֵ/ךְ֙ וְֽ/הַשְׁלִ֔יכִי וּ/שְׂאִ֥י עַל שְׁפָיִ֖ם קִינָ֑ה כִּ֚י מָאַ֣ס יְהוָ֔ה וַ/יִּטֹּ֖שׁ אֶת דּ֥וֹר עֶבְרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/029.yaml
  text: Cut off your hair and throw it away[a], and raise a lament on the bare heights[b], for Yahweh has rejected and abandoned the generation of his wrath.
translation:
  language: fr
  text: Coupe ta chevelure[a] et jette-la ; entonne une lamentation sur les hauteurs dénudées, car Yahweh a rejeté et abandonné la génération vouée à sa fureur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta couronne » ou « ta chevelure consacrée ». Le terme hébreu peut désigner la consécration, une couronne ou la chevelure associée à une consécration ; les ordres de couper et de jeter favorisent ici le sens de « chevelure ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la génération de sa fureur ». On peut aussi comprendre : « la génération sous sa fureur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: גָּזִּי
  choice: Coupe
  rationale: L’impératif féminin singulier de גזז exprime l’action de couper ou de tondre. « Coupe » est naturel en français et convient aux cheveux pris comme objet.
- source_word: נִזְרֵךְ
  choice: tes cheveux
  rationale: נֵזֶר peut désigner la consécration, une couronne ou la chevelure liée à la consécration. Les verbes « couper » et « jeter » favorisent ici le sens concret de cheveux ; une note conserve les autres nuances lexicales.
- source_word: וְהַשְׁלִיכִי
  choice: et jette-les
  rationale: L’impératif de שלך indique qu’ils doivent être délibérément jetés au loin ou mis au rebut. Le pronom pluriel suit l’usage français avec « cheveux ».
- source_word: וּשְׂאִי ... קִינָה
  choice: entonne une lamentation
  rationale: Avec קִינָה pour objet, נשׂא signifie commencer ou faire entendre une lamentation. « Entonne » restitue cette expression de manière idiomatique et digne.
- source_word: עַל שְׁפָיִם
  choice: sur les hauteurs dénudées
  rationale: שְׁפָיִם désigne des hauteurs nues ou arides. « Hauteurs dénudées » préserve l’image géographique sans imposer le sens cultuel de « hauts lieux ».
- source_word: כִּי מָאַס יְהוָה
  choice: car Yahweh a rejeté
  rationale: מאס exprime le rejet. Le nom divin יהוה est translittéré « Yahweh » afin de conserver le nom propre présent dans le texte source.
- source_word: וַיִּטֹּשׁ
  choice: et abandonné
  rationale: נטש signifie délaisser ou abandonner. « Abandonné » est clair, actuel et renforce sans redondance excessive le verbe « rejeté ».
- source_word: דּוֹר עֶבְרָתוֹ
  choice: la génération qui subit sa fureur
  rationale: Le groupe construit signifie littéralement « la génération de sa fureur ». La formulation française choisie explicite la relation la plus probable — une génération placée sous la colère divine — tandis que la note conserve la forme littérale et son ambiguïté.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Interprétation de נִזְרֵךְ
  choice: tes cheveux
  alternative: ta couronne ; ta chevelure consacrée
  rationale: L’ordre de couper puis de jeter favorise une référence aux cheveux. Le texte principal évite toutefois d’ajouter explicitement « consacrés », nuance présente dans le champ lexical mais non univoque ici.
- issue: Rapport exprimé par דּוֹר עֶבְרָתוֹ
  choice: la génération qui subit sa fureur
  alternative: la génération de sa fureur
  rationale: Le construit hébreu demeure sémantiquement serré. Le français courant demande de préciser le rapport ; la traduction indique que cette génération est sous la fureur de Yahweh, tandis que la note préserve le littéral et l’autre lecture possible.
translation_notes:
  register: Français international moderne, accessible et digne. Le tutoiement féminin singulier reflète les impératifs hébreux adressés à Jérusalem personnifiée. « Entonne une lamentation » conserve la force poétique de l’oracle, et « fureur » rend l’intensité de עֶבְרָה.
