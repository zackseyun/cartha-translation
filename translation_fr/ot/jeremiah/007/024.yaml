base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/024.yaml
  text: But they did not listen[a], and they did not incline their ear, but walked in their own counsels, in the stubbornness of their evil heart[c][b], and they went backward and not forward.
translation:
  language: fr
  text: Mais ils n’ont pas écouté[a] ni prêté l’oreille. Ils ont suivi leurs propres conseils[b], dans l’obstination de leur cœur mauvais[c], et ils sont allés en arrière et non en avant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entendu » ; dans ce contexte, il s’agit d’une écoute attentive qui conduit à tenir compte de ce qui est dit.
    reason: lexical_alternative
  - marker: b
    text: Ou « leurs propres projets » ou « leurs propres desseins ».
    reason: lexical_alternative
  - marker: c
    text: Dans la pensée hébraïque, le « cœur » désigne ici la volonté et la pensée intérieures, et pas seulement les émotions.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: ils n’ont pas écouté
  rationale: שׁמע peut signifier entendre, écouter ou obéir. Ici, « écouter » exprime le refus d’une écoute attentive sans expliciter davantage l’idée d’obéissance.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: ni prêté l’oreille
  rationale: Cette expression française naturelle conserve l’image de l’oreille tout en exprimant clairement l’attention.
- source_word: וַיֵּלְכוּ בְּמֹעֵצוֹת
  choice: Ils ont suivi leurs propres conseils
  rationale: הלך avec ב décrit ici une conduite conforme à des conseils ou desseins. « Suivre » rend ce sens idiomatiquement; le suffixe hébreu justifie « leurs propres ».
- source_word: בִּשְׁרִרוּת
  choice: dans l’obstination
  rationale: Le nom désigne chez Jérémie une volonté obstinée et rétive. « Obstination » est clair, digne et proche du sens.
- source_word: לִבָּם הָרָע
  choice: de leur cœur mauvais
  rationale: « Cœur » conserve l’image hébraïque, laquelle englobe la volonté et la pensée aussi bien que les sentiments. Le singulier collectif de l’hébreu est maintenu.
- source_word: וַיִּהְיוּ לְאָחוֹר וְלֹא לְפָנִים
  choice: ils sont allés en arrière plutôt qu’en avant
  rationale: Cette formulation restitue le contraste directionnel entre recul et progression. « Plutôt que » rend naturellement en français l’opposition « et non » sans la transformer en interprétation doctrinale.
theological_decisions:
- issue: Anthropologie morale dans « leur cœur mauvais »
  choice: Conserver telle quelle la qualification morale du cœur
  alternative: Paraphraser par « nature pécheresse » ou développer en une affirmation générale sur la dépravation
  rationale: Le verset qualifie explicitement leur cœur de mauvais et leur conduite d’obstinée, mais ne formule pas ici de doctrine anthropologique plus vaste.
translation_notes:
  register: Français international moderne, clair et digne. « Prêter l’oreille » conserve l’image source sans archaïsme marqué; « suivre leurs propres conseils » est plus naturel que le calque « marcher dans leurs conseils ». Tous les marqueurs de notes figurent dans le texte.
