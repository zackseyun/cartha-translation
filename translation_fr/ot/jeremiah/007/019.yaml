  text: הַ/אֹתִ֛/י הֵ֥ם מַכְעִסִ֖ים נְאֻם יְהוָ֑ה הֲ/ל֣וֹא אֹתָ֔/ם לְמַ֖עַן בֹּ֥שֶׁת פְּנֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/019.yaml
  text: Is it I whom they are provoking? declares Yahweh. Is it not themselves[a], to the shame of their own faces?
translation:
  language: fr
  text: Est-ce moi qu’ils provoquent à la colère ? déclare Yahweh. N’est-ce pas eux-mêmes, à leur propre honte[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour la honte de leurs visages ». La seconde question conserve en hébreu une ellipse après « eux-mêmes » ; on peut aussi comprendre : « Ne se font-ils pas honte à eux-mêmes ? »'
    reason: La note préserve l’image hébraïque des « visages » et signale l’ellipse syntaxique sans imposer une explicitation unique.
lexical_decisions:
- source_word: הַאֹתִי
  choice: Est-ce vraiment moi que
  rationale: La particule interrogative, suivie du marqueur d’objet et du pronom de première personne, met fortement « moi » en relief. « Est-ce vraiment moi que… ? » restitue naturellement cette question rhétorique en français.
- source_word: מַכְעִסִים
  choice: ils irritent
  rationale: Le hiphil de כעס signifie provoquer à la colère, irriter ou exaspérer. « Irriter » est actuel et concis, tout en laissant le contexte préciser qu’il s’agit de provoquer Yahweh.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formule prophétique solennelle est rendue de façon naturelle et reconnaissable, tandis que le nom divin est conservé.
- source_word: הֲלוֹא
  choice: N’est-ce pas plutôt
  rationale: La particule introduit une question rhétorique appelant une réponse affirmative et marque ici un contraste correctif avec la première question. « Plutôt » rend ce contraste sans transformer la question en affirmation.
- source_word: אֹתָם
  choice: eux-mêmes
  rationale: La forme signifie littéralement « eux », mais, en opposition à « moi », le français demande naturellement le pronom renforcé « eux-mêmes » pour exprimer que les conséquences retombent sur eux.
- source_word: לְמַעַן בֹּשֶׁת פְּנֵיהֶם
  choice: pour leur propre honte
  rationale: לְמַעַן peut exprimer ici le but ou le résultat. Cette formulation conserve cette ouverture sémantique et traduit idiomatiquement l’expression littérale « la honte de leur visage ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom divin plutôt que de lui substituer un titre.
- issue: Objet réel de la provocation et portée de la seconde question
  choice: « eux-mêmes, pour leur propre honte »
  alternative: « Ne se provoquent-ils pas eux-mêmes, à leur propre honte ? »
  rationale: Le contraste rhétorique affirme que leur conduite ne lèse pas Yahweh en dernier ressort, mais retombe sur eux. La traduction évite toutefois d’ajouter un nouveau verbe absent de la seconde proposition hébraïque.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Les deux questions rhétoriques et leur contraste sont conservés. « Irriter » évite une périphrase lourde, tandis que la note signale l’image hébraïque du visage et l’ellipse verbale.
