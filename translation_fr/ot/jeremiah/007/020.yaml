  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה הִנֵּ֨ה אַפִּ֤/י וַֽ/חֲמָתִ/י֙ נִתֶּ֨כֶת֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה עַל הָֽ/אָדָם֙ וְ/עַל הַ/בְּהֵמָ֔ה וְ/עַל עֵ֥ץ הַ/שָּׂדֶ֖ה וְ/עַל פְּרִ֣י הָֽ/אֲדָמָ֑ה וּ/בָעֲרָ֖ה וְ/לֹ֥א תִכְבֶּֽה־׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/020.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], my anger and my wrath are being poured out on this place, on man and on beast, on the trees of the field and on the fruit of the ground; it will burn and will not be quenched.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : « Voici que ma colère et ma fureur se déversent sur ce lieu, sur l’être humain[a] et sur les animaux, sur les arbres des champs et sur les fruits du sol. Cela brûlera et ne s’éteindra pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici le singulier אָדָם, avec un sens générique : l’humanité.'
    reason: Préciser la forme singulière et la portée collective du terme source.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit la conséquence de l’accusation précédente dans un français actuel et soutenu.
- source_word: כֹּה אָמַר
  choice: ainsi parle
  rationale: Conserve la formule prophétique traditionnelle tout en restant naturelle en français.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Distingue le titre אֲדֹנָי du nom divin יהוה et évite l’expression maladroite « le Seigneur SEIGNEUR ».
- source_word: הִנֵּה
  choice: Voici que
  rationale: Marque avec solennité l’annonce divine sans recourir à une tournure archaïque.
- source_word: אַפִּי וַחֲמָתִי
  choice: ma colère et ma fureur
  rationale: Rend les deux termes distincts et leur intensification, sans les réduire à un seul sentiment.
- source_word: נִתֶּכֶת
  choice: se déversent
  rationale: Reproduit l’image d’un déversement du jugement; le pluriel français s’accorde naturellement avec les deux noms coordonnés.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: sur ce lieu
  rationale: Dans ce contexte de déversement, אֶל désigne la cible sur laquelle tombe le jugement.
- source_word: הָאָדָם
  choice: l’être humain
  rationale: Exprime la valeur générique du singulier hébreu sans la limiter aux hommes de sexe masculin.
- source_word: הַבְּהֵמָה
  choice: les animaux
  rationale: Rend la catégorie collective de façon claire et suffisamment large; « bétail » serait trop restrictif.
- source_word: עֵץ הַשָּׂדֶה
  choice: les arbres des champs
  rationale: Le singulier collectif hébreu est naturellement rendu au pluriel en français, tout en conservant l’image des champs.
- source_word: פְּרִי הָאֲדָמָה
  choice: les fruits du sol
  rationale: Préserve l’image agricole et le lien lexical avec la terre cultivée.
- source_word: וּבָעֲרָה וְלֹא תִכְבֶּה
  choice: Cela brûlera et ne s’éteindra pas
  rationale: Conserve l’image du feu et l’indétermination relative de son référent, sans ajouter explicitement un nom absent de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe un titre au nom divin; rendre יהוה par « Yahweh » maintient cette distinction et rend visible le nom d’alliance.
- issue: Valeur générique de הָאָדָם
  choice: l’être humain
  alternative: l’homme
  rationale: Le nom est singulier mais générique, opposant ici l’humanité aux animaux et au monde végétal; « l’être humain » communique clairement cette portée inclusive.
- issue: Référent du verbe féminin וּבָעֲרָה
  choice: Cela brûlera
  alternative: Elle brûlera
  rationale: La forme féminine peut reprendre collectivement la colère et la fureur ou prolonger l’image du jugement déversé; le démonstratif neutre français préserve cette relative ambiguïté.
translation_notes:
  register: Français international moderne, digne et prophétique. La formule « ainsi parle » conserve la solennité biblique; « voici que » reste soutenu sans être archaïque. Les parallélismes et l’étendue cosmique du jugement sont maintenus.
