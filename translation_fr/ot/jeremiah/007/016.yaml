  text: וְ/אַתָּ֞ה אַל תִּתְפַּלֵּ֣ל בְּעַד הָ/עָ֣ם הַ/זֶּ֗ה וְ/אַל תִּשָּׂ֧א בַעֲדָ֛/ם רִנָּ֥ה וּ/תְפִלָּ֖ה וְ/אַל תִּפְגַּע בִּ֑/י כִּי אֵינֶ֥/נִּי שֹׁמֵ֖עַ אֹתָֽ/ךְ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/016.yaml
  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, and do not intercede with me[b], for I am not listening to you.
translation:
  language: fr
  text: Mais toi, ne prie pas pour ce peuple, ne fais monter en leur faveur ni cri suppliant ni prière, et n’intercède pas auprès de moi[a], car je ne t’écoute pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ne me supplie pas» ou «n’insiste pas auprès de moi»; le verbe hébreu peut exprimer une supplication pressante ou une intercession.
    reason: lexical_alternative
  - marker: b
    text: Ou «car je ne t’écouterai pas». La forme participiale hébraïque peut décrire un refus actuel et continu, tandis que le contexte permet aussi une traduction au futur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: La conjonction suivie du pronom indépendant met Jérémie en contraste avec le peuple et souligne l’adresse directe.
- source_word: אַל תִּתְפַּלֵּל בְּעַד הָעָם הַזֶּה
  choice: ne prie pas pour ce peuple
  rationale: אַל avec l’imparfait exprime ici une interdiction directe; בְּעַד marque la prière faite en faveur d’autrui.
- source_word: וְאַל תִּשָּׂא בַעֲדָם רִנָּה וּתְפִלָּה
  choice: ne fais monter en leur faveur ni cri suppliant ni prière
  rationale: «Faire monter» rend naturellement l’image de נשׂא appliquée à une prière. רִנָּה désigne ici un cri pressant; «suppliant» explicite sa valeur contextuelle sans le confondre avec תְּפִלָּה. La tournure «ni… ni…» exprime la portée inclusive de l’interdiction.
- source_word: וְאַל תִּפְגַּע בִּי
  choice: et n’intercède pas auprès de moi
  rationale: Dans ce contexte de prière en faveur du peuple, le verbe פגע au hiphil évoque une démarche insistante d’intercession adressée à Dieu.
- source_word: כִּי אֵינֶנִּי שֹׁמֵעַ אֹתָךְ
  choice: car je ne t’écoute pas
  rationale: La construction négative avec le participe présente le refus divin comme actuel ou continu. «Je ne t’écoute pas» conserve cette valeur tout en restant naturel en français.
theological_decisions:
- issue: Portée de l’interdiction faite à Jérémie d’intercéder
  choice: Une interdiction divine directe et insistante d’intercéder pour ce peuple dans la situation présente
  alternative: Une simple mise en garde hyperbolique, sans interdiction effective
  rationale: La triple répétition de אַל et la motivation finale indiquent une interdiction réelle dans le contexte immédiat. La traduction en garde la sévérité sans en tirer une doctrine générale sur toute intercession.
- issue: Valeur temporelle et volitive de la déclaration divine finale
  choice: «je ne t’écoute pas», refus actuel exprimé par le participe
  alternative: «je ne t’écouterai pas», lecture à valeur future
  rationale: Le participe hébreu soutient naturellement une situation présente ou continue, mais le contexte permet aussi d’entendre la conséquence future si Jérémie priait; cette possibilité est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. «Mais toi» conserve l’adresse contrastive et solennelle. «Cri suppliant» maintient la distinction entre רִנָּה et «prière» tout en indiquant le caractère pressant du cri. Les deux notes préservent les ambiguïtés lexicales et temporelles du texte hébreu.
