  terminology: « Intercéder auprès de moi » correspond précisément au sens contextuel de הִפְגִּיעַ בְּ dans une séquence de prières prohibées. « Cri suppliant » distingue utilement רִנָּה de « prière » sans transformer le cri en une catégorie technique. Les notes lexicales sur l’intercession insistante et sur la valeur temporelle du participe sont justifiées et leurs ancres correspondent aux expressions concernées.
