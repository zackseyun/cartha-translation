  source_fidelity: 'Le texte rend fidèlement la triple interdiction : ne pas prier pour le peuple, ne pas faire monter un cri ni une prière en sa faveur, et ne pas intercéder auprès de Dieu. « Mais toi » restitue bien l’adresse contrastive וְאַתָּה. « Je ne t’écoute pas » rend de manière recevable la négation avec participe שֹׁמֵעַ, qui peut décrire un refus en cours; la possibilité d’un futur est correctement signalée.'
