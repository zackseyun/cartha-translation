  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם זֶ֤ה הַ/גּוֹי֙ אֲשֶׁ֣ר לֽוֹא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהָ֔י/ו וְ/לֹ֥א לָקְח֖וּ מוּסָ֑ר אָֽבְדָה֙ הָֽ/אֱמוּנָ֔ה וְ/נִכְרְתָ֖ה מִ/פִּי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/028.yaml
  text: Then you shall say to them[a], ‘This is the nation that did not listen to the voice of Yahweh its God and did not accept correction. Faithfulness has perished; it has been cut off from their mouth.’
translation:
  language: fr
  text: 'Alors, tu leur diras : « Voilà la nation qui n’a pas écouté la voix de Yahweh, son Dieu, et qui n’a pas accepté la correction. La fidélité[a] a disparu ; elle a été retranchée de leur bouche. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La vérité a disparu. » Le mot hébreu אֱמוּנָה peut signifier « fidélité », « fiabilité » ou « vérité ».'
    reason: Alternative lexicale authentique du terme hébreu.
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Alors, tu leur diras
  rationale: Le waw suivi du parfait, dans ce discours prophétique, marque la progression et prend ici une valeur injonctive. « Alors » rend naturellement l’enchaînement.
- source_word: זֶה הַגּוֹי
  choice: Voilà la nation
  rationale: Cette formulation française restitue avec naturel la construction démonstrative et conserve le nom collectif singulier גּוֹי.
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: n’a pas écouté la voix
  rationale: L’expression hébraïque implique l’écoute qui conduit à l’obéissance. La traduction conserve l’image auditive sans réduire le sens au seul verbe « obéir ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: Le suffixe masculin singulier s’accorde grammaticalement avec le collectif singulier « nation ».
- source_word: לֹא לָקְחוּ מוּסָר
  choice: n’a pas accepté la correction
  rationale: מוּסָר peut désigner la correction, la discipline ou l’instruction. « Accepter la correction » convient au contexte de réprimande et reste idiomatique en français.
- source_word: אָבְדָה הָאֱמוּנָה
  choice: La fidélité a disparu
  rationale: אֱמוּנָה exprime ici la fidélité, la fiabilité ou la vérité. « Fidélité » garde la dimension morale et relationnelle du reproche, tandis que « a disparu » rend naturellement le constat de perte porté par אָבְדָה.
- source_word: וְנִכְרְתָה מִפִּיהֶם
  choice: elle a été retranchée de leur bouche
  rationale: Le niphal de כרת signifie « être retranché » ou « être coupé ». La formulation conserve l’image forte et le singulier collectif de « bouche » dans l’hébreu.
theological_decisions:
- issue: Sens de אֱמוּנָה dans un contexte de reproche adressé au peuple de l’alliance
  choice: fidélité
  alternative: vérité
  rationale: Le terme peut désigner aussi bien la fidélité et la fiabilité que la vérité. « Fidélité » fait ressortir la dimension relationnelle et éthique sans exclure celle de véracité ; l’autre lecture plausible est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier correspond à l’adresse faite au prophète. Les images hébraïques de la « voix » et de ce qui est « retranché de leur bouche » sont maintenues afin de préserver la vigueur poétique et la possible résonance d’alliance.
