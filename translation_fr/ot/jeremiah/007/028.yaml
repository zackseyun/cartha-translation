  source_fidelity: 'Le texte rend fidèlement les éléments essentiels de l’hébreu : l’injonction adressée au prophète, la désignation collective au singulier (« la nation »), le refus d’écouter la voix de Yahweh et d’accepter la correction, puis la perte de l’אֱמוּנָה et son retranchement « de leur bouche ». Le maintien du pluriel dans « leur bouche » correspond au suffixe pluriel hébreu.'
  naturalness: Le français est moderne, clair et d’un registre prophétique sobre. « Alors, tu leur diras », « Voilà la nation » et « accepter la correction » sont idiomatiques. « Elle a été retranchée de leur bouche » conserve volontairement l’image forte du texte et demeure compréhensible en français biblique contemporain.
  terminology: « Yahweh » suit la politique de rendu du tétragramme. « Son Dieu » reflète correctement l’accord grammatical du suffixe singulier avec le collectif « nation ». « Fidélité » est un choix solide pour אֱמוּנָה, et la note préserve à juste titre l’alternative lexicale substantielle « vérité ».
