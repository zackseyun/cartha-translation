  text: וְ/דִבַּרְתָּ֤ אֲלֵי/הֶם֙ אֶת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/לֹ֥א יִשְׁמְע֖וּ אֵלֶ֑י/ךָ וְ/קָרָ֥אתָ אֲלֵי/הֶ֖ם וְ/לֹ֥א יַעֲנֽוּ/כָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/027.yaml
  text: You shall speak all these words to them[a], but they will not listen to you; you shall call to them, but they will not answer you.
translation:
  language: fr
  text: Tu leur diras toutes ces paroles, mais ils ne t’écouteront pas[a]. Tu les appelleras, mais ils ne te répondront pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ne t’entendront pas » ou « ils ne t’obéiront pas ». Le verbe hébreu peut signifier entendre, écouter ou obéir selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ
  choice: Tu leur diras
  rationale: Le qatal qal à la 2e personne masculine singulière, coordonné dans cette instruction prophétique, exprime ici une action prescrite et future. Le futur français la rend naturellement.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: Dans le contexte de la proclamation prophétique, דְּבָרִים désigne les paroles communiquées plutôt que des choses ou des affaires.
- source_word: וְלֹא יִשְׁמְעוּ אֵלֶיךָ
  choice: mais ils ne t’écouteront pas
  rationale: שׁמע avec אֶל signifie écouter quelqu’un et peut aussi impliquer lui obéir. « Écouter » conserve cette amplitude sans réduire le sens à la simple perception auditive. « Mais » exprime naturellement le contraste porté ici par la coordination.
- source_word: וְקָרָאתָ אֲלֵיהֶם
  choice: Tu les appelleras
  rationale: קרא avec אֶל signifie appeler ou lancer un appel à quelqu’un. Cette formulation reste directe sans préciser indûment le volume ou le caractère formel de l’appel.
- source_word: וְלֹא יַעֲנוּכָה
  choice: mais ils ne te répondront pas
  rationale: Le qal de ענה signifie couramment répondre. Le pronom suffixe est explicitement rendu par « te ».
