id: JER.7.3
reference: Jeremiah 7:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הֵיטִ֥יבוּ דַרְכֵי/כֶ֖ם וּ/מַֽעַלְלֵי/כֶ֑ם וַ/אֲשַׁכְּנָ֣ה אֶתְ/כֶ֔ם בַּ/מָּק֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/003.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Make your ways and your deeds good[b], and I will let you dwell in this place.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées, le Dieu d’Israël : Améliorez votre conduite et vos actes[a], et je vous laisserai habiter en ce lieu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Rendez bons vos chemins et vos actes » ; ou : « Réformez votre conduite et vos actes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je vous ferai habiter en ce lieu » ; ou encore : « je vous laisserai demeurer en ce lieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule classique du messager prophétique, naturelle en français biblique actuel et fidèle à la solennité de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, qui préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Dans le titre divin, cette formulation rend directement l’idée de forces organisées sans préciser s’il s’agit d’armées célestes ou terrestres.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de la construction hébraïque qui identifie le Dieu d’Israël.
- source_word: הֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: Améliorez votre conduite et vos actes
  rationale: Le causatif de יטב appelle une réforme active. « Conduite » exprime naturellement la métaphore des « chemins », tandis que « actes » désigne les comportements concrets.
- source_word: וַאֲשַׁכְּנָה אֶתְכֶם
  choice: et je vous laisserai habiter
  rationale: Le hiphil de שכן peut exprimer le fait de faire habiter ou de permettre de demeurer. Dans cet avertissement d’alliance, cette traduction souligne la permission de continuer à résider sans exclure l’action souveraine de Dieu.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: en ce lieu
  rationale: Conserve l’indétermination de מקום, qui peut viser le sanctuaire, Jérusalem ou, plus largement, le pays, sans trancher prématurément.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le nom propre est conservé afin de ne pas le remplacer par un titre et de maintenir son rôle dans la formule prophétique.
- issue: Portée de וַאֲשַׁכְּנָה אֶתְכֶם dans le contexte de l’alliance
  choice: je vous laisserai habiter
  alternative: je vous ferai habiter ; je vous laisserai demeurer
  rationale: Le choix principal convient à la menace d’expulsion implicite et préserve la tension entre l’action de Dieu et le maintien du peuple dans le lieu. La note signale la valeur causative également possible.
translation_notes:
  register: Français international moderne, clair et digne. « Ainsi parle » garde la cadence prophétique traditionnelle sans archaïsme excessif. « Conduite » évite le caractère peu naturel de « chemins » dans ce contexte moral, tandis que les notes préservent la forme plus littérale et l’ambiguïté du causatif.
