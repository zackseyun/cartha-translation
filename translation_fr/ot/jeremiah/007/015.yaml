  text: וְ/הִשְׁלַכְתִּ֥י אֶתְ/כֶ֖ם מֵ/עַ֣ל פָּנָ֑/י כַּ/אֲשֶׁ֤ר הִשְׁלַ֨כְתִּי֙ אֶת כָּל אֲחֵי/כֶ֔ם אֵ֖ת כָּל זֶ֥רַע אֶפְרָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/015.yaml
  text: And I will cast you out from before me[a], just as I cast out all your brothers[c][b], all the offspring of Ephraim.
translation:
  language: fr
  text: Je vous rejetterai loin de ma présence[a], comme j’ai rejeté tous vos frères[b], toute la descendance d’Éphraïm[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant ma face ». Autres traductions possibles : « de devant moi » ou « hors de ma vue ».'
    reason: lexical_alternative
  - marker: b
    text: Les « frères » de Juda sont ici les autres Israélites, en particulier ceux du royaume du Nord.
    reason: cultural_note
  - marker: c
    text: Éphraïm représente ici le royaume du Nord, celui d’Israël.
    reason: cross_reference
lexical_decisions:
- source_word: וְהִשְׁלַכְתִּי אֶתְכֶם
  choice: Je vous rejetterai
  rationale: Le hiphil de שׁלך exprime ici une expulsion énergique et un rejet. « Rejeter » est naturel en français et conserve la portée judiciaire de la parole.
- source_word: מֵעַל פָּנָי
  choice: loin de ma présence
  rationale: Littéralement « de dessus/devant ma face ». Dans ce contexte, l’expression évoque l’éloignement de devant Dieu; « loin de ma présence » rend clairement l’idiome sans le réduire à la seule perception visuelle.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Introduit directement la comparaison entre le jugement annoncé à Juda et celui déjà subi par le royaume du Nord.
- source_word: כָּל אֲחֵיכֶם
  choice: tous vos frères
  rationale: Le terme conserve l’image familiale et désigne les autres Israélites, en particulier ceux du royaume du Nord.
- source_word: אֵת כָּל זֶרַע אֶפְרָיִם
  choice: toute la descendance d’Éphraïm
  rationale: זֶרַע désigne collectivement la postérité ou la descendance. Le nom Éphraïm est maintenu plutôt que remplacé par son référent politique.
theological_decisions:
- issue: Sens de l’expression de rejet מֵעַל פָּנָי
  choice: loin de ma présence
  alternative: de devant moi / hors de ma vue
  rationale: Cette formulation préserve l’idée relationnelle et judiciaire d’une expulsion de devant Dieu, sans tirer de conclusion supplémentaire sur l’omniprésence divine.
- issue: Portée de אֲחֵיכֶם
  choice: frères
  alternative: compatriotes / gens de votre peuple
  rationale: Le masculin pluriel et la métaphore de parenté sont conservés; une note explicite le référent collectif.
- issue: Référent d’Éphraïm
  choice: conserver Éphraïm dans le texte
  alternative: le royaume du Nord / Israël
  rationale: Le texte hébreu nomme Éphraïm. La métonymie désignant le royaume du Nord est expliquée en note plutôt qu’intégrée à la traduction.
translation_notes:
  register: Français international moderne, sobre et solennel. La répétition de « rejetterai / rejeté » reproduit celle du verbe hébreu; les trois marqueurs de note figurent dans le texte principal, au plus près des expressions concernées.
