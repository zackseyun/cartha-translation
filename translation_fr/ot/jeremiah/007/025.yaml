  text: לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר יָצְא֤וּ אֲבֽוֹתֵי/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ אֶת כָּל עֲבָדַ֣/י הַ/נְּבִיאִ֔ים י֖וֹם הַשְׁכֵּ֥ם וְ/שָׁלֹֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/025.yaml
  text: From the day your fathers came out of the land of Egypt until this day[a], I have sent to you all my servants the prophets, day after day[b], rising early and sending them.
translation:
  language: fr
  text: Depuis le jour où vos ancêtres[a] sont sortis du pays d’Égypte jusqu’à ce jour, je vous ai envoyé tous mes serviteurs, les prophètes, jour après jour[b], me levant de bonne heure et les envoyant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vos pères » ; ici, l’expression désigne les ancêtres d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'Expression idiomatique hébraïque : « se lever de bonne heure et envoyer », qui souligne l’empressement et la persévérance avec lesquels Dieu a envoyé les prophètes.'
    reason: cultural_note
lexical_decisions:
- source_word: לְמִן הַיּוֹם אֲשֶׁר ... עַד הַיּוֹם הַזֶּה
  choice: Depuis le jour où… jusqu’à aujourd’hui
  rationale: Cette formulation française naturelle conserve le point de départ et la continuité de la période jusqu’au présent du locuteur.
- source_word: יָצְאוּ אֲבוֹתֵיכֶם
  choice: vos ancêtres sont sortis
  rationale: Dans ce contexte historique, אָבוֹת désigne les générations antérieures d’Israël. « Ancêtres » communique ce sens sans laisser entendre qu’il s’agit seulement des pères immédiats.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: La formule développée conserve l’écho caractéristique du récit de l’Exode.
- source_word: וָאֶשְׁלַח אֲלֵיכֶם
  choice: je vous ai envoyé
  rationale: Le passé composé exprime en français les envois répétés accomplis au cours de la période qui va de l’Exode jusqu’au jour évoqué.
- source_word: אֶת כָּל עֲבָדַי הַנְּבִיאִים
  choice: tous mes serviteurs, les prophètes
  rationale: L’apposition identifie les prophètes comme les serviteurs mandatés par Dieu. La virgule rend clairement cette relation en français.
- source_word: יוֹם הַשְׁכֵּם וְשָׁלֹחַ
  choice: jour après jour, me levant de bonne heure pour les envoyer
  rationale: La traduction maintient à la fois la répétition quotidienne et l’image idiomatique du lever matinal, qui souligne l’empressement et la persévérance.
theological_decisions:
- issue: Sens de עֲבָדַי appliqué aux prophètes
  choice: mes serviteurs
  alternative: mes esclaves
  rationale: Le contexte met en avant leur service et leur mission comme envoyés de Dieu, non leur condition juridique; « serviteurs » est donc fidèle sans introduire une nuance étrangère au propos.
- issue: Expression anthropomorphique הַשְׁכֵּם וְשָׁלֹחַ
  choice: me levant de bonne heure pour les envoyer
  alternative: les envoyant sans relâche
  rationale: Le maintien de l’image préserve la forme et la force rhétorique de l’hébreu sans résoudre l’anthropomorphisme par une paraphrase.
translation_notes:
  register: Français international moderne, digne et accessible. La structure temporelle et l’apposition sont conservées, tandis que la note explique l’idiome hébraïque volontairement maintenu dans le texte.
