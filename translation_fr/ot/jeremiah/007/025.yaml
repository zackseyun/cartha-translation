  verdict: revise
  source_fidelity: 'Le sens général est fidèle : la période va de la sortie d’Égypte jusqu’au présent du discours, et Dieu a envoyé tous ses prophètes. Toutefois, « pour les envoyer » introduit une relation de but qui n’est pas exprimée par les deux infinitifs coordonnés de l’hébreu. « Jusqu’à ce jour » rend aussi plus précisément הַיּוֹם הַזֶּה que « jusqu’à aujourd’hui ».'
  naturalness: La formulation révisée demeure naturelle en français international moderne et conserve un registre biblique sobre. « Me levant de bonne heure et les envoyant » reflète plus directement l’idiome sans alourdir la phrase.
  terminology: « Ancêtres », « pays d’Égypte », « mes serviteurs, les prophètes » et « jour après jour » sont appropriés. L’apposition avec virgules rend convenablement l’identification des prophètes comme serviteurs de Dieu.
