revisions:
- from: Depuis le jour où vos ancêtres[a] sont sortis du pays d’Égypte jusqu’à aujourd’hui, je vous ai envoyé tous mes serviteurs, les prophètes, jour après jour[b], me levant de bonne heure pour les envoyer.
  to: Depuis le jour où vos ancêtres[a] sont sortis du pays d’Égypte jusqu’à ce jour, je vous ai envoyé tous mes serviteurs, les prophètes, jour après jour[b], me levant de bonne heure et les envoyant.
  rationale: La révision corrige la légère surcharge interprétative introduite par « pour les envoyer » et emploie « jusqu’à ce jour » pour suivre de plus près le repère temporel hébreu. Elle conserve toutes les autres options fidèles du projet, y compris l’ambiguïté lexicale de « pères », expliquée en note.
