    issue: « pour les envoyer » transforme la coordination en finalité
    rationale: L’hébreu הַשְׁכֵּם וְשָׁלֹחַ (« se levant tôt et envoyant ») associe deux infinitifs dans une expression idiomatique de persévérance. La préposition « pour » ajoute une nuance de but non explicite dans le texte source.
  - severity: low
    issue: « jusqu’à aujourd’hui » est légèrement moins précis que « jusqu’à ce jour »
    rationale: הַיּוֹם הַזֶּה renvoie au jour du discours. « Jusqu’à ce jour » maintient ce repère déictique sans l’actualiser inutilement pour le lecteur.
  revised_text: Depuis le jour où vos ancêtres[a] sont sortis du pays d’Égypte jusqu’à ce jour, je vous ai envoyé tous mes serviteurs, les prophètes, jour après jour[b], me levant de bonne heure et les envoyant.
