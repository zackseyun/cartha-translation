source:
  edition: WLC
  text: הֲ/גָנֹ֤ב רָצֹ֨חַ֙ וְֽ/נָאֹ֔ף וְ/הִשָּׁבֵ֥עַ לַ/שֶּׁ֖קֶר וְ/קַטֵּ֣ר לַ/בָּ֑עַל וְ/הָלֹ֗ךְ אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹֽא יְדַעְתֶּֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/009.yaml
  text: Will you steal[a], murder, commit adultery, swear falsely, burn incense to Baal[b], and go after other gods that you have not known—
translation:
  language: fr
  text: Allez-vous voler, commettre des meurtres, commettre l’adultère, jurer faussement, brûler de l’encens pour Baal et aller à la suite d’autres dieux que vous n’avez pas connus[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que vous n’avez pas reconnus » ; le verbe peut évoquer ici aussi bien la connaissance que la reconnaissance ou la relation.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/גָנֹב
  choice: Allez-vous voler
  rationale: La particule interrogative הֲ ouvre une question rhétorique qui porte sur toute la série. « Allez-vous » conserve son élan accusateur et prospectif dans un français naturel.
- source_word: רָצֹחַ
  choice: assassiner
  rationale: רצח désigne normalement le fait de tuer illicitement. « Assassiner » exprime cette portée morale et juridique plus précisément que le simple « tuer ».
- source_word: וְ/נָאֹף
  choice: commettre l’adultère
  rationale: נאף est le terme courant et précis pour l’adultère; cette formulation est idiomatique en français moderne.
- source_word: וְ/הִשָּׁבֵעַ לַ/שֶּׁקֶר
  choice: prêter de faux serments
  rationale: L’expression désigne des serments mensongers. Cette formulation garde le cadre juridique et religieux de l’hébreu.
- source_word: וְ/קַטֵּר לַ/בָּעַל
  choice: brûler de l’encens pour Baal
  rationale: Dans ce contexte cultuel, קטר évoque l’encens que l’on fait brûler ou une offrande produisant de la fumée. La traduction retenue est directe et aisément compréhensible.
- source_word: וְ/הָלֹךְ אַחֲרֵי
  choice: aller à la suite de
  rationale: Cette expression conserve l’image hébraïque du déplacement derrière quelqu’un tout en exprimant naturellement l’idée d’adhésion ou de fidélité.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: La formulation rend directement le sens de l’hébreu sans préciser, de manière interprétative, qu’il s’agirait de dieux étrangers.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: que vous n’avez pas connus
  rationale: Le parfait est rendu par le passé composé, et « connaître » maintient l’ampleur sémantique de ידע sans réduire le propos à la seule connaissance intellectuelle.
theological_decisions:
- issue: Nature de la connaissance des autres dieux
  choice: que vous n’avez pas connus
  alternative: que vous n’avez pas reconnus
  rationale: Dans un contexte d’alliance et de culte, ידע peut évoquer la connaissance, la relation ou la reconnaissance. Le texte principal garde le terme plus large « connus », tandis que la note signale l’autre nuance possible sans trancher la tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique est maintenue, ainsi que le tiret final indiquant que la phrase et l’accusation se poursuivent au verset suivant.
