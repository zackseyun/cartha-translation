language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גֵּ֣ר יָת֤וֹם וְ/אַלְמָנָה֙ לֹ֣א תַֽעֲשֹׁ֔קוּ וְ/דָ֣ם נָקִ֔י אַֽל תִּשְׁפְּכ֖וּ בַּ/מָּק֣וֹם הַ/זֶּ֑ה וְ/אַחֲרֵ֨י אֱלֹהִ֧ים אֲחֵרִ֛ים לֹ֥א תֵלְכ֖וּ לְ/רַ֥ע לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/006.yaml
  text: Do not oppress the foreigner[a], the fatherless, and the widow; do not shed innocent blood in this place[c][b]; and do not go after other gods to your own harm.
translation:
  language: fr
  text: N’opprimez pas l’étranger[a], l’orphelin[b] ni la veuve. Ne versez pas de sang innocent dans ce lieu et ne suivez pas d’autres dieux[c], pour votre propre malheur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le résident étranger » : il s’agit d’un non-Israélite établi au sein de la communauté.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu peut désigner plus précisément une personne privée de père.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « n’allez pas derrière d’autres dieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: l’étranger
  rationale: Le terme désigne ici un non-Israélite établi au sein de la communauté et socialement vulnérable. « L’étranger » est clair en français courant, tandis que « résident étranger » explicite davantage son statut.
- source_word: יָתוֹם
  choice: l’orphelin
  rationale: « L’orphelin » est le terme français naturel pour cette catégorie sociale vulnérable, même si l’hébreu peut viser plus précisément celui qui est privé de père.
- source_word: אַלְמָנָה
  choice: la veuve
  rationale: Équivalent français direct et précis de cette catégorie sociale.
- source_word: תַעֲשֹׁקוּ
  choice: opprimez
  rationale: Le verbe exprime l’oppression ou l’exploitation des personnes vulnérables; « opprimer » conserve sa force sociale et morale.
- source_word: דָם נָקִי
  choice: du sang innocent
  rationale: Expression française établie qui conserve la portée juridique et morale de la formule hébraïque désignant une mise à mort injuste.
- source_word: תִּשְׁפְּכוּ
  choice: versez
  rationale: Avec « sang », « verser » est l’équivalent idiomatique français du verbe hébreu, plutôt que le littéral « répandre un liquide ».
- source_word: בַּמָּקוֹם הַזֶּה
  choice: dans ce lieu
  rationale: Rendu direct qui maintient la désignation explicite du lieu dans le cadre du discours au Temple.
- source_word: אַחֲרֵי ... לֹא תֵלְכוּ
  choice: ne suivez pas
  rationale: Littéralement « ne marchez/n’allez pas derrière ». « Suivre » exprime naturellement en français l’idée d’adhésion et d’allégeance sans effacer le sens de l’expression.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Traduction directe qui n’ajoute pas la nuance ethnique que pourrait suggérer « dieux étrangers ».
- source_word: לְרַע לָכֶם
  choice: pour votre propre malheur
  rationale: La formule indique que cette conduite retombe au détriment des destinataires; « propre » rend explicite cette portée réflexive en français naturel.
theological_decisions:
- issue: Désignation des groupes socialement vulnérables
  choice: l’étranger, l’orphelin et la veuve
  alternative: le résident étranger, celui qui est privé de père et la veuve
  rationale: La traduction conserve les trois catégories distinctes du texte plutôt que de les réduire à une désignation générale, tout en employant un français accessible.
- issue: Portée de לְרַע לָכֶם
  choice: pour votre propre malheur
  alternative: à votre détriment
  rationale: La traduction conserve l’idée que le fait de suivre d’autres dieux nuit aux destinataires, sans préciser davantage la nature de ce malheur.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs brefs préservent la force exhortative du passage; « ni » coordonne naturellement les groupes après la négation. Tous les marqueurs de note figurent immédiatement après l’expression concernée.
