id: JER.7.32
reference: Jeremiah 7:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/לֹא יֵאָמֵ֨ר ע֤וֹד הַ/תֹּ֨פֶת֙ וְ/גֵ֣יא בֶן הִנֹּ֔ם כִּ֖י אִם גֵּ֣יא הַ/הֲרֵגָ֑ה וְ/קָבְר֥וּ בְ/תֹ֖פֶת מֵ/אֵ֥ין מָקֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/032.yaml
  text: Therefore, look, days are coming, declares the LORD, when it will no longer be called Topheth and the Valley of Ben-hinnom, but the Valley of Slaughter; and they will bury in Topheth because there is no place left.
translation:
  language: fr
  text: C’est pourquoi, voici que des jours viennent — déclaration du SEIGNEUR — où l’on ne dira plus « le Tofeth » ni « la vallée de Ben-Hinnom », mais « la vallée du Massacre » ; et l’on enterrera les morts au Tofeth, faute de place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Rend explicitement le lien de conséquence avec le jugement annoncé dans le contexte.
- source_word: הִנֵּה יָמִים בָּאִים
  choice: voici que des jours viennent
  rationale: Conserve la formule prophétique hébraïque et sa force d’annonce, dans un français digne et intelligible.
- source_word: נְאֻם יְהוָה
  choice: déclaration du SEIGNEUR
  rationale: « Déclaration » restitue la formule solennelle נְאֻם ; « le SEIGNEUR » suit la convention française traditionnelle pour le tétragramme.
- source_word: הַתֹּפֶת
  choice: le Tofeth
  rationale: Translittération usuelle du nom propre du lieu, avec l’article présent en hébreu.
- source_word: גֵיא בֶן הִנֹּם
  choice: la vallée de Ben-Hinnom
  rationale: Préserve la forme du toponyme et sa relation nominale sans interprétation ajoutée.
- source_word: גֵיא הַהֲרֵגָה
  choice: la vallée du Massacre
  rationale: הֲרֵגָה désigne une tuerie ou un massacre ; la majuscule signale le nouveau nom donné au lieu.
- source_word: וְקָבְרוּ
  choice: et l’on enterrera les morts
  rationale: Le verbe signifie « ils enterreront » ; le sujet indéfini français « l’on » convient, et « les morts » explicite seulement l’objet implicite évident du verbe dans ce contexte.
- source_word: מֵאֵין מָקוֹם
  choice: faute de place
  rationale: 'Expression française naturelle qui conserve la relation causale : les inhumations auront lieu là parce qu’il n’y aura pas de place ailleurs.'
theological_decisions:
- issue: Rendu du tétragramme יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: La petite capitale suit une convention biblique française largement reconnue tout en distinguant le nom divin du titre ordinaire « Seigneur ».
- issue: Rapport entre les deux anciens noms
  choice: « le Tofeth » ni « la vallée de Ben-Hinnom »
  alternative: « le Tofeth » et « la vallée de Ben-Hinnom »
  rationale: Après une négation, « ni » rend naturellement le וְ coordonnant deux appellations qui ne seront plus employées, sans décider si elles désignent exactement la même étendue.
translation_notes:
  register: Français international moderne, solennel mais accessible. La tournure prophétique « voici que des jours viennent » est volontairement conservée. Les guillemets permettent de distinguer clairement les noms anciens du nouveau nom annoncé.
