source:
  edition: WLC
  text: הַֽ/אֵינְ/ךָ֣ רֹאֶ֔ה מָ֛ה הֵ֥מָּה עֹשִׂ֖ים בְּ/עָרֵ֣י יְהוּדָ֑ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/017.yaml
  text: Do you not see what they are doing in the cities of Judah and in the streets of Jerusalem?[a]
translation:
  language: fr
  text: Ne vois-tu pas ce qu’ils font dans les villes de Juda et dans les rues de Jérusalem[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les places » ou « les espaces ouverts » de Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵינְךָ רֹאֶה
  choice: Ne vois-tu pas
  rationale: Rend naturellement en français la question rhétorique négative adressée directement à Jérémie, tout en conservant le sens visuel et perceptif de רֹאֶה.
- source_word: מָה
  choice: ce que
  rationale: Introduit idiomatiquement en français le contenu de ce qui est vu.
- source_word: הֵמָּה עֹשִׂים
  choice: ils font
  rationale: Le pronom indépendant הֵמָּה désigne « ils », et le participe עֹשִׂים présente une action en cours. Le présent français exprime naturellement cette valeur sans lourdeur.
- source_word: בְּעָרֵי יְהוּדָה
  choice: dans les villes de Juda
  rationale: Préserve la valeur locative et la relation construite du texte hébreu.
- source_word: וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: et dans les rues de Jérusalem
  rationale: « Rues » est ici un équivalent français naturel de חֻצוֹת dans un cadre urbain, tandis que ses autres sens possibles sont signalés en note.
