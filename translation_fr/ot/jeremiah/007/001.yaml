  text: 'The word that came to Yirmeyahu from the LORD, saying:'
translation:
  language: fr
  text: 'La parole qui fut adressée à Jérémie de la part du SEIGNEUR :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: La parole
  rationale: Dans cette formule prophétique, דָּבָר désigne le message divin communiqué au prophète ; « la parole » conserve l’expression biblique naturelle en français.
- source_word: הָיָה אֶל־יִרְמְיָהוּ
  choice: qui fut adressée à Jérémie
  rationale: Littéralement « qui fut/vint à Jérémie ». La formulation française traditionnelle et naturelle « fut adressée à » exprime clairement la réception du message sans en modifier le sens.
- source_word: מֵאֵת יְהוָה
  choice: de la part du SEIGNEUR
  rationale: מֵאֵת marque ici la provenance personnelle. « De la part de » la rend précisément ; le tétragramme est représenté par « le SEIGNEUR », conformément à l’usage français courant.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introducteur « en disant » annonce les paroles qui suivent. En français moderne, les deux-points remplissent naturellement cette fonction sans lourdeur.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: « Le SEIGNEUR » respecte la convention de lecture ancienne et l’usage biblique français largement reconnu, sans imposer une vocalisation reconstruite du nom divin.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche de la formule hébraïque tout en évitant le calque peu naturel « la parole qui vint à Jérémie… disant ».
