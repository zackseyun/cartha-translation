source:
  edition: WLC
  text: וּ/בָנ֞וּ בָּמ֣וֹת הַ/תֹּ֗פֶת אֲשֶׁר֙ בְּ/גֵ֣יא בֶן הִנֹּ֔ם לִ/שְׂרֹ֛ף אֶת בְּנֵי/הֶ֥ם וְ/אֶת בְּנֹתֵי/הֶ֖ם בָּ/אֵ֑שׁ אֲשֶׁר֙ לֹ֣א צִוִּ֔יתִי וְ/לֹ֥א עָלְתָ֖ה עַל לִבִּֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/031.yaml
  text: They have built the high places of Topheth[a], which is in the Valley of Ben-hinnom, to burn their sons and their daughters in the fire—something I did not command, nor did it come up in my heart.
translation:
  language: fr
  text: Ils ont construit les hauts lieux de Tofeth, dans la vallée de Ben-Hinnom, pour brûler leurs fils et leurs filles dans le feu — ce que je n’ai pas ordonné et ce qui ne m’est jamais venu à l’esprit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce qui n’est pas monté sur mon cœur ». Cette expression hébraïque exprime un rejet catégorique.'
    reason: Alternative lexicale et explication de l’image hébraïque.
lexical_decisions:
- source_word: וּבָנוּ
  choice: Ils ont construit
  rationale: Le qatal qal, troisième personne du pluriel, décrit une action accomplie dont le résultat demeure pertinent. Le passé composé convient naturellement au français moderne.
- source_word: בָּמוֹת הַתֹּפֶת
  choice: les hauts lieux de Tofeth
  rationale: « Hauts lieux » conserve le sens cultuel établi de בָּמוֹת, tandis que Tofeth est traité comme un nom de lieu et translittéré.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: dans la vallée de Ben-Hinnom
  rationale: גֵיא est traduit par « vallée » et le nom géographique Ben-Hinnom est translittéré plutôt que décomposé en « fils de Hinnom ».
- source_word: לִשְׂרֹף
  choice: pour brûler
  rationale: L’infinitif construit avec ל exprime ici le but.
- source_word: אֶת־בְּנֵיהֶם וְאֶת־בְּנֹתֵיהֶם
  choice: leurs fils et leurs filles
  rationale: La formulation garde la distinction explicite de l’hébreu au lieu de la réduire au terme générique « enfants ».
- source_word: בָּאֵשׁ
  choice: au feu
  rationale: Cette tournure française rend naturellement le moyen et le contexte de la mise à mort par le feu.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: chose que je n’ai pas ordonnée
  rationale: Le relatif renvoie à la pratique qui vient d’être décrite. « Chose que » explicite ce référent sans ajouter d’interprétation.
- source_word: וְלֹא עָלְתָה עַל־לִבִּי
  choice: et qui ne m’est pas montée au cœur
  rationale: Cette formulation conserve l’image anthropomorphique et l’ambiguïté de l’expression hébraïque, tout en restant compréhensible en français; une équivalence idiomatique est donnée en note.
theological_decisions:
- issue: Désaveu divin du sacrifice d’enfants
  choice: Conserver l’expression imagée « ne m’est pas montée au cœur » comme une répudiation absolue de cette pratique.
  alternative: « ne m’est jamais venue à l’esprit »
  rationale: L’équivalent plus idiomatique peut, en français, être entendu comme une affirmation précise sur les limites de la connaissance divine. Le texte hébreu formule avant tout un rejet vigoureux; la traduction principale préserve donc son anthropomorphisme et sa tension sans les résoudre doctrinalement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit de près la progression de l’hébreu, mais l’incise après le tiret clarifie naturellement le référent de la proposition relative. Le marqueur [a] est placé sur l’expression qu’explique réellement la note.
