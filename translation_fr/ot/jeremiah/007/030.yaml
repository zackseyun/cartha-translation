id: JER.7.30
reference: Jeremiah 7:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי עָשׂ֨וּ בְנֵי יְהוּדָ֥ה הָ/רַ֛ע בְּ/עֵינַ֖/י נְאֻום יְהוָ֑ה שָׂ֣מוּ שִׁקּֽוּצֵי/הֶ֗ם בַּ/בַּ֛יִת אֲשֶׁר נִקְרָא שְׁמִ֥/י עָלָ֖י/ו לְ/טַמְּאֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/030.yaml
  text: For the sons of Judah have done what is evil in my sight[a], declares Yahweh. They have put their abominations in the house that is called by my name[c][b], to defile it.
translation:
  language: fr
  text: Car les fils de Juda ont fait ce qui est mal à mes yeux, déclare Yahweh. Ils ont placé leurs objets abominables[a] dans la maison qui porte mon nom[b][c], pour la souiller.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne des choses cultuelles répugnantes, probablement des idoles dans ce contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la maison sur laquelle mon nom est appelé ».'
    reason: lexical_alternative
  - marker: c
    text: Il s’agit du temple de Jérusalem.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison ou l’explication du jugement annoncé dans le contexte précédent, tout en conservant clairement le lien logique.
- source_word: בְנֵי יְהוּדָה
  choice: les fils de Juda
  rationale: Conserve l’expression de parenté hébraïque qui désigne collectivement le peuple de Juda; la formulation reste intelligible en français biblique moderne.
- source_word: הָרַע בְּעֵינַי
  choice: ce qui est mal à mes yeux
  rationale: Rend l’adjectif substantivé et préserve l’image hébraïque des « yeux » comme expression de l’évaluation divine.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend avec sobriété la formule prophétique solennelle et conserve le nom divin personnel.
- source_word: שִׁקּוּצֵיהֶם
  choice: leurs objets abominables
  rationale: Le terme vise des choses cultuelles tenues pour répugnantes, vraisemblablement des idoles ici. « Objets abominables » garde cette dimension concrète sans réduire explicitement le sens aux seules idoles.
- source_word: בַּבַּיִת
  choice: dans la maison
  rationale: Reproduit le mot hébreu « maison »; dans le contexte, il désigne le temple de Jérusalem, ce qu’explicite une note.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: qui porte mon nom
  rationale: Expression française naturelle pour l’idiome signifiant que cette maison appartient à Yahweh et lui est publiquement associée; la formulation littérale est signalée en note.
- source_word: לְטַמְּאוֹ
  choice: pour la souiller
  rationale: Rend l’infinitif de but ou de résultat et exprime à la fois la contamination cultuelle et la profanation morale du sanctuaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Nature des שִׁקּוּצִים placés dans le temple
  choice: objets abominables
  alternative: abominations; idoles
  rationale: Le contexte cultuel suggère fortement des idoles ou objets idolâtriques, mais le terme hébreu est plus large. La traduction conserve cette portée sans imposer une identification plus précise que le texte.
translation_notes:
  register: Français international actuel, digne et accessible. La structure accusatoire et la métaphore « à mes yeux » sont conservées; l’idiome relatif au nom divin est rendu naturellement, avec sa forme littérale en note.
