  text: וָ/אֶתֵּ֞ן לִ/פְנֵ֣י בְּנֵ֣י בֵית הָ/רֵכָבִ֗ים גְּבִעִ֛ים מְלֵאִ֥ים יַ֖יִן וְ/כֹס֑וֹת וָ/אֹמַ֥ר אֲלֵי/הֶ֖ם שְׁתוּ יָֽיִן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/005.yaml
  text: Then I set before the sons of the house of the Rekabites bowls full of wine and cups[a], and I said to them, “Drink wine.”
translation:
  language: fr
  text: 'Je plaçai devant les membres de la maison des Rékabites des bols pleins de vin et des coupes, et je leur dis : « Buvez du vin. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן לִפְנֵי
  choice: Je plaçai devant
  rationale: Le verbe נתן, avec לִפְנֵי et des récipients comme objet, signifie ici « placer devant ». Le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: בְּנֵי בֵית הָרֵכָבִים
  choice: les membres de la famille des Rékabites
  rationale: Littéralement « les fils de la maison des Rékabites ». En français actuel, « les membres de la famille » rend naturellement l’appartenance au groupe familial sans suggérer qu’il s’agit uniquement des fils au sens biologique.
- source_word: גְּבִעִים
  choice: des cruches
  rationale: Le terme désigne ici de grands récipients contenant le vin, distincts des כֹּסוֹת servant à boire. « Cruches » préserve cette distinction fonctionnelle sans imposer une forme trop précise.
- source_word: מְלֵאִים יַיִן
  choice: pleines de vin
  rationale: Rendu direct et naturel de l’adjectif מְלֵאִים suivi de יַיִן.
- source_word: וְכֹסוֹת
  choice: et des coupes
  rationale: כּוֹס désigne un récipient individuel pour boire. « Coupes » est naturel dans ce contexte et maintient la distinction avec les grands récipients.
- source_word: וָאֹמַר אֲלֵיהֶם
  choice: puis je leur dis
  rationale: « Je leur dis » rend directement אמר אֲלֵיהֶם. « Puis » exprime naturellement la progression narrative du waw consécutif.
- source_word: שְׁתוּ יָיִן
  choice: Buvez du vin
  rationale: L’impératif pluriel est conservé. En français, l’article partitif est requis dans cet emploi et n’ajoute pas l’idée interprétative de « quelque peu ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure hébraïque littérale « les fils de la maison » est rendue idiomatiquement, tandis que la distinction entre les récipients contenant le vin et les coupes destinées à boire est conservée.
