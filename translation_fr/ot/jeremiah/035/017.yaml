source:
  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֤י צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֧י מֵבִ֣יא אֶל יְהוּדָ֗ה וְ/אֶ֤ל כָּל יֽוֹשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתִּי עֲלֵי/הֶ֑ם יַ֣עַן דִּבַּ֤רְתִּי אֲלֵי/הֶם֙ וְ/לֹ֣א שָׁמֵ֔עוּ וָ/אֶקְרָ֥א לָ/הֶ֖ם וְ/לֹ֥א עָנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/017.yaml
  text: 'Therefore[a], thus says Yahweh, the God of hosts, the God of Israel: Behold, I am bringing on Judah and on all the inhabitants of Jerusalem all the disaster that I have spoken against them, because I spoke to them and they did not listen, and I called to them and they did not answer.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh, le Dieu des armées, le Dieu d’Israël : Je vais faire venir sur Juda et sur tous les habitants de Jérusalem tout le malheur[a] que j’ai annoncé contre eux, parce que je leur ai parlé sans qu’ils écoutent et que je les ai appelés sans qu’ils répondent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la calamité » ou « tout le désastre ». Le mot hébreu peut aussi signifier « mal » dans d’autres contextes ; ici, il désigne le jugement annoncé contre Juda et Jérusalem.
    reason: Alternative lexicale permettant de conserver l’étendue sémantique de רָעָה sans suggérer ici le mal moral.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque clairement la conséquence tirée du contraste précédent avec l’obéissance des Rékabites, dans un français naturel et soutenu.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Rend la formule prophétique traditionnelle de manière actuelle, claire et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé directement dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: le Dieu des armées
  rationale: Le nom אֱלֹהִים est ici en construit avec צְבָאוֹת. « Armées » est intelligible aujourd’hui et conserve l’idée de puissances organisées sans préciser qu’elles seraient seulement terrestres ou célestes.
- source_word: הִנְנִי מֵבִיא
  choice: Je vais faire venir
  rationale: Exprime l’annonce solennelle et imminente d’une action divine. Une tournure distincte comme « Voici, je fais venir » serait plus formelle mais moins naturelle en français courant.
- source_word: אֶל יְהוּדָה וְאֶל כָּל יֹשְׁבֵי יְרוּשָׁלִַם
  choice: sur Juda et sur tous les habitants de Jérusalem
  rationale: Dans ce contexte de jugement, « sur » rend naturellement la calamité dirigée vers Juda et Jérusalem.
- source_word: כָּל הָרָעָה
  choice: tout le malheur
  rationale: רָעָה désigne ici une calamité annoncée comme jugement, et non le mal moral. « Malheur » garde une certaine largeur sémantique et convient au registre prophétique.
- source_word: אֲשֶׁר דִּבַּרְתִּי עֲלֵיהֶם
  choice: que j’ai annoncé contre eux
  rationale: Dans cet oracle de jugement, דבר על désigne une parole prononcée à leur encontre. « Annoncé » rend naturellement la déclaration prophétique sans ajouter l’idée d’une exécution déjà accomplie.
- source_word: יַעַן
  choice: parce que
  rationale: Introduit directement la cause du jugement en français moderne.
- source_word: דִּבַּרְתִּי אֲלֵיהֶם וְלֹא שָׁמֵעוּ
  choice: je leur ai parlé et qu’ils n’ont pas écouté
  rationale: Conserve la répétition de la parole divine et l’absence d’écoute, au sens d’attention et d’obéissance.
- source_word: וָאֶקְרָא לָהֶם וְלֹא עָנוּ
  choice: je les ai appelés et ils n’ont pas répondu
  rationale: Reproduit simplement le parallélisme final entre l’appel divin et le refus de répondre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » le préserve explicitement sans le remplacer par un titre.
- issue: Sens de הָרָעָה dans le jugement divin
  choice: malheur
  alternative: mal ; calamité ; désastre
  rationale: Le contexte parle du jugement annoncé contre Juda et Jérusalem. « Malheur » désigne ici le dommage ou la calamité et n’attribue pas à Dieu la production du mal moral, tout en préservant la portée assez large du terme hébreu.
- issue: Portée de צְבָאוֹת
  choice: armées
  alternative: puissances ; armées célestes
  rationale: Le terme peut évoquer les armées ou puissances célestes et terrestres. Le rendu général « armées » évite de trancher une portée que le texte ne précise pas.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure causale et le parallélisme hébreux, tout en remplaçant les calques peu naturels. « Voici ce que dit » maintient la solennité prophétique ; « Je vais faire venir » rend הִנְנִי avec une annonce vive et imminente.
