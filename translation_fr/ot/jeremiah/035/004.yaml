source:
  edition: WLC
  text: וָ/אָבִ֤א אֹתָ/ם֙ בֵּ֣ית יְהוָ֔ה אֶל לִשְׁכַּ֗ת בְּנֵ֛י חָנָ֥ן בֶּן יִגְדַּלְיָ֖הוּ אִ֣ישׁ הָ/אֱלֹהִ֑ים אֲשֶׁר אֵ֨צֶל֙ לִשְׁכַּ֣ת הַ/שָּׂרִ֔ים אֲשֶׁ֣ר מִ/מַּ֗עַל לְ/לִשְׁכַּ֛ת מַעֲשֵׂיָ֥הוּ בֶן שַׁלֻּ֖ם שֹׁמֵ֥ר הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/004.yaml
  text: So I brought them into the house of Yahweh[a], into the chamber of the sons of Hanan son of Igdaliah, the man of God, which was beside the chamber of the officials, which was above the chamber of Maaseiah son of Shallum[c][b], the keeper of the threshold.
translation:
  language: fr
  text: Je les fis donc entrer dans la maison de Yahweh[a], dans la salle des fils de Hanân[b], fils de Yigdalia, l’homme de Dieu. Cette salle était à côté de celle des responsables et au-dessus de celle de Maaséya, fils de Shalloum, le gardien du seuil[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le temple de Yahweh ». Littéralement : « la maison de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « les fils de Hanân » peut désigner ses descendants, sa maisonnée ou le groupe qui lui était associé.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le portier ». Littéralement : « le gardien du seuil ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבִא
  choice: Je les conduisis donc
  rationale: Le wayyiqtol poursuit la séquence narrative. « Conduire » exprime naturellement ici le fait de faire entrer des personnes dans un lieu, tandis que « donc » conserve la progression du récit.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Traduction directe de l’expression hébraïque, avec le nom divin rendu par « Yahweh » conformément à la donnée source et à la ligne éditoriale indiquée.
- source_word: לִשְׁכַּת
  choice: la salle
  rationale: Dans le cadre du temple, לִשְׁכָּה désigne une pièce ou salle attenante. « Salle » est actuel et naturel en français, sans perdre la valeur architecturale.
- source_word: בְּנֵי חָנָן
  choice: les fils de Hanân
  rationale: La traduction formelle garde l’ambiguïté de בְּנֵי, qui peut désigner les fils proprement dits, les descendants, la maisonnée ou un groupe associé.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: L’expression est un titre reconnu dans le texte biblique; l’article défini français en restitue la valeur honorifique.
- source_word: אֵצֶל
  choice: à côté de
  rationale: Rend clairement et naturellement la proximité spatiale indiquée par la préposition.
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: שָׂרִים désigne ici vraisemblablement des dignitaires ou responsables officiels. « Hauts fonctionnaires » communique leur rang sans les identifier à des princes de sang royal.
- source_word: מִמַּעַל לְ
  choice: au-dessus de
  rationale: Rend sans ambiguïté la relation verticale entre les salles.
- source_word: שֹׁמֵר הַסַּף
  choice: le gardien du seuil
  rationale: Traduction littérale qui conserve l’image et le titre de fonction; il pouvait s’agir d’un portier du temple.
- source_word: חָנָן ... יִגְדַּלְיָהוּ ... מַעֲשֵׂיָהוּ ... שַׁלֻּם
  choice: Hanân ... Yigdalia ... Maaséya ... Shalloum
  rationale: Les noms propres sont translittérés sous des formes françaises lisibles, tout en restant proches de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre plutôt que de le remplacer par un titre; une note signale l’expression traditionnelle « temple du SEIGNEUR ».
- issue: Portée du titre אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  alternative: un homme de Dieu
  rationale: La formulation définie respecte le tour hébreu et son emploi comme titre reconnu, sans préciser davantage la fonction de Hanân.
translation_notes:
  register: Français international moderne, digne et accessible. Le découpage en deux phrases allège la longue chaîne de relatives hébraïque sans modifier les rapports spatiaux. Les termes architecturaux et administratifs restent précis, et les ambiguïtés réelles sont conservées ou signalées en note.
