  to: Je les fis donc entrer dans la maison de Yahweh[a], dans la salle des fils de Hanân[b], fils de Yigdalia, l’homme de Dieu. Cette salle était à côté de celle des responsables et au-dessus de celle de Maaséya, fils de Shalloum, le gardien du seuil[c].
