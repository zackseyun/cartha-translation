  text: הוּקַ֡ם אֶת דִּבְרֵ֣י יְהוֹנָדָ֣ב בֶּן רֵ֠כָב אֲשֶׁר צִוָּ֨ה אֶת בָּנָ֜י/ו לְ/בִלְתִּ֣י שְׁתֽוֹת יַ֗יִן וְ/לֹ֤א שָׁתוּ֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י שָֽׁמְע֔וּ אֵ֖ת מִצְוַ֣ת אֲבִי/הֶ֑ם וְ/אָ֨נֹכִ֜י דִּבַּ֤רְתִּי אֲלֵי/כֶם֙ הַשְׁכֵּ֣ם וְ/דַבֵּ֔ר וְ/לֹ֥א שְׁמַעְתֶּ֖ם אֵלָֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/014.yaml
  text: The words of Jehonadab son of Rechab[a], which he commanded his sons—not to drink wine—have been upheld, and they have not drunk wine to this day, because they have obeyed the command of their father. But I have spoken to you, rising early and speaking[b], and you have not listened to me.
translation:
  language: fr
  text: 'Les paroles de Yehonadab, fils de Rékab[a], par lesquelles il avait ordonné à ses fils de ne pas boire de vin, ont été mises en pratique : jusqu’à ce jour, ils n’ont pas bu de vin, car ils ont obéi au commandement de leur père. Mais moi, je vous ai parlé sans relâche[b], et vous ne m’avez pas écouté.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jonadab » pour « Yehonadab ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « me levant tôt et parlant », expression hébraïque qui évoque une parole adressée avec empressement et persévérance.'
    reason: cultural_note
lexical_decisions:
- source_word: הוּקַם אֶת דִּבְרֵי
  choice: Les paroles […] ont été respectées
  rationale: Le passif de קום indique ici que les paroles ont été mises en pratique et maintenues. « Ont été respectées » est naturel en français tout en conservant la forme passive.
- source_word: יְהוֹנָדָב בֶּן רֵכָב
  choice: Jonadab, fils de Rékab
  rationale: « Jonadab » est la forme française traditionnelle et courante du nom; « Rékab » reproduit distinctement le nom hébreu רֵכָב.
- source_word: אֲשֶׁר צִוָּה אֶת בָּנָיו לְבִלְתִּי שְׁתוֹת יַיִן
  choice: qu’il avait données à ses fils — l’ordre de ne pas boire de vin
  rationale: Le plus-que-parfait situe l’injonction antérieure du père. L’apposition avec « l’ordre » explicite la valeur impérative de צוה sans réduire דִּבְרֵי à un seul terme technique.
- source_word: וְלֹא שָׁתוּ עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour, ils n’en ont pas bu
  rationale: Le pronom « en » reprend naturellement « du vin » en français, tandis que le passé composé exprime une observance prolongée jusqu’au présent du récit.
- source_word: כִּי שָׁמְעוּ אֵת מִצְוַת אֲבִיהֶם
  choice: car ils ont obéi au commandement de leur père
  rationale: Avec מִצְוַת, שמע signifie écouter de manière effective, donc obéir. Le singulier « commandement » respecte la forme hébraïque.
- source_word: וְאָנֹכִי
  choice: Moi, pourtant
  rationale: La disjonction pronominale et la conjonction marquent un contraste appuyé entre l’obéissance des Rékabites et le refus des destinataires.
- source_word: הַשְׁכֵּם וְדַבֵּר
  choice: sans relâche
  rationale: L’expression infinitive hébraïque, littéralement liée au fait de se lever tôt pour parler, est un idiome de persistance et d’empressement. « Sans relâche » en transmet naturellement la fonction; la note conserve l’image source.
- source_word: וְלֹא שְׁמַעְתֶּם אֵלָי
  choice: mais vous ne m’avez pas écouté
  rationale: « Écouté » préserve ici le parallélisme lexical avec שמע tout en laissant entendre, sans le sur-expliciter, le refus d’obéir.
theological_decisions:
- issue: Contraste entre l’obéissance filiale des Rékabites et la réponse du peuple à Dieu
  choice: Conserver le contraste par « Moi, pourtant » et « vous ne m’avez pas écouté »
  alternative: « Mais moi, je vous ai parlé constamment, et vous ne m’avez pas obéi »
  rationale: Le texte oppose clairement les deux attitudes, mais n’ajoute pas ici de qualification doctrinale telle que « rébellion contre l’alliance ». « Écouté » préserve aussi la tension sémantique de שמע entre écoute et obéissance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe met en relief le contraste rhétorique. L’idiome hébreu est rendu naturellement dans le texte et son image littérale est conservée en note.
