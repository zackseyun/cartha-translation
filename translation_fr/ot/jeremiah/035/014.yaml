revisions:
- from: 'Les paroles que Jonadab, fils de Rékab[a], avait données à ses fils — l’ordre de ne pas boire de vin — ont été respectées : jusqu’à ce jour, ils n’en ont pas bu, car ils ont obéi au commandement de leur père. Moi, pourtant, je vous ai parlé sans relâche[b], mais vous ne m’avez pas écouté.'
  to: 'Les paroles de Yehonadab, fils de Rékab[a], par lesquelles il avait ordonné à ses fils de ne pas boire de vin, ont été mises en pratique : jusqu’à ce jour, ils n’ont pas bu de vin, car ils ont obéi au commandement de leur père. Mais moi, je vous ai parlé sans relâche[b], et vous ne m’avez pas écouté.'
  rationale: La révision restaure la force directive de צִוָּה et une syntaxe française qui rattache clairement l’interdiction de boire du vin aux paroles de Yehonadab. Elle conserve l’ambiguïté intentionnelle de « vous ne m’avez pas écouté », sans imposer « obéi », et maintient la note qui documente l’image de l’idiome hébreu.
  reviewer_model: gpt-5.6-terra
