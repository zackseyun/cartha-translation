    text: Ou « Jonadab » pour « Yehonadab ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « me levant tôt et parlant », expression hébraïque qui évoque une parole adressée avec empressement et persévérance.'
    reason: cultural_note
  revision_rationale: La révision restaure la force directive de צִוָּה et une syntaxe française qui rattache clairement l’interdiction de boire du vin aux paroles de Yehonadab. Elle conserve l’ambiguïté intentionnelle de « vous ne m’avez pas écouté », sans imposer « obéi », et maintient la note qui documente l’image de l’idiome hébreu.
