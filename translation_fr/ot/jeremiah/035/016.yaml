source:
  edition: WLC
  text: כִּ֣י הֵקִ֗ימוּ בְּנֵי֙ יְהוֹנָדָ֣ב בֶּן רֵכָ֔ב אֶת מִצְוַ֥ת אֲבִי/הֶ֖ם אֲשֶׁ֣ר צִוָּ֑/ם וְ/הָ/עָ֣ם הַ/זֶּ֔ה לֹ֥א שָׁמְע֖וּ אֵלָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/016.yaml
  text: For the sons of Jehonadab son of Rechab have kept the command of their father that he commanded them[b][a], but this people have not listened to me.
translation:
  language: fr
  text: Car les descendants de Jonadab, fils de Récab, ont respecté l’ordre que leur père[a] leur avait donné, mais ce peuple ne m’a pas écouté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « leur ancêtre » ; hébreu : « leur père ».'
    reason: lexical_alternative
  - marker: b
    text: « Écouté » peut aussi avoir ici le sens d’« obéi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’affirmation précédente et conserve naturellement sa valeur explicative.
- source_word: הֵקִימוּ
  choice: ont respecté
  rationale: Dans la construction avec מִצְוַת, le hifil de קום signifie faire tenir un ordre, donc l’observer ou le respecter.
- source_word: בְּנֵי יְהוֹנָדָב בֶּן רֵכָב
  choice: les descendants de Jonadab, fils de Rékab
  rationale: Dans ce contexte clanique, בְּנֵי désigne les descendants de Jonadab plutôt que ses fils immédiats; cette formulation est claire en français moderne.
- source_word: מִצְוַת
  choice: l’ordre
  rationale: מִצְוָה désigne ici une prescription ayant autorité; « ordre » est naturel et précis.
- source_word: אֲבִיהֶם
  choice: leur père
  rationale: Le texte hébreu emploie littéralement le terme « père », qui maintient le contraste rhétorique entre l’obéissance à un père humain et le refus d’écouter Dieu.
- source_word: אֲשֶׁר צִוָּם
  choice: que leur père leur avait donné
  rationale: Le plus-que-parfait situe naturellement en français l’ordre antérieur à son observation; « donner un ordre » rend idiomatiquement le verbe צוה.
- source_word: וְהָעָם הַזֶּה
  choice: mais ce peuple
  rationale: La conjonction exprime ici un contraste net entre les Rékabites et le peuple; « ce peuple » préserve la nuance de mise à distance du démonstratif.
- source_word: לֹא שָׁמְעוּ אֵלָי
  choice: ne m’a pas écouté
  rationale: La traduction conserve le sens premier de שׁמע avec אֶל, tout en laissant entendre sa portée d’obéissance dans le contexte.
theological_decisions:
- issue: Désignation de Jonadab par rapport au clan rékabite
  choice: leur père
  alternative: leur ancêtre
  rationale: Bien que Jonadab soit l’ancêtre du groupe, l’hébreu dit « leur père ». Garder cette image préserve le contraste théologique et rhétorique entre la fidélité à l’ordre paternel et le refus d’écouter Dieu.
- issue: Portée de שׁמע dans la réponse du peuple à Dieu
  choice: ne m’a pas écouté
  alternative: ne m’a pas obéi
  rationale: « Écouter » préserve l’expression hébraïque et son ambiguïté féconde, tandis que le contexte fait clairement entendre l’idée d’obéissance sans l’imposer dans le corps du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Descendants » évite que « fils » soit compris comme désignant la première génération seulement. Les marqueurs de notes suivent immédiatement les expressions concernées.
