  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/012.yaml
  text: Then the word of Yahweh came to Yirmeyahu[a], saying[b],
translation:
  language: fr
  text: 'Alors la parole de Yahweh fut adressée à Jérémie :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors ... fut adressée
  rationale: Dans cette formule narrative, le wayyiqtol de היה marque la progression du récit. En français moderne, la tournure « Alors la parole… fut adressée » restitue naturellement la séquence sans employer le calque archaïque « il arriva que ».
- source_word: דְּבַר
  choice: la parole
  rationale: Dans la formule prophétique דְּבַר יְהוָה, « la parole » désigne une communication divine et conserve le lien lexical avec l’expression hébraïque récurrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition indique ici le destinataire de la parole; dans la locution française « être adressé à », « à » est l’équivalent naturel.
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: « Jérémie » est la forme française établie du nom hébreu Yirmeyahou et convient à une traduction française naturelle et accessible.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif « en disant » introduit le discours qui suit. En français, les deux-points remplissent idiomatiquement cette fonction sans alourdir la formule.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » en préserve le caractère de nom propre, tandis que « le SEIGNEUR » représente la substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, digne et fluide. La formule passive « fut adressée à » est consacrée dans le registre prophétique sans être obscure; les deux-points annoncent naturellement le contenu du message au verset suivant.
