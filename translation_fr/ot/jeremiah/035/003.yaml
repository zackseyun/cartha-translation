  text: וָ/אֶקַּ֞ח אֶת יַאֲזַנְיָ֤ה בֶֽן יִרְמְיָ֨הוּ֙ בֶּן חֲבַצִּנְיָ֔ה וְ/אֶת אֶחָ֖י/ו וְ/אֶת כָּל בָּנָ֑י/ו וְ/אֵ֖ת כָּל בֵּ֥ית הָ/רֵכָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/003.yaml
  text: So I took Jaazaniah son of Jeremiah[a], son of Habazziniah, and his brothers, and all his sons[b], and the whole house of the Rechabites.
translation:
  language: fr
  text: Alors je pris[a] Jaazania, fils de Jérémie, fils de Habatsinia, ainsi que ses frères, tous ses fils et toute la maison des Récabites[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Et je pris ». La forme narrative hébraïque permet plusieurs enchaînements naturels en français.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « maison » désigne la famille élargie ou le clan des Récabites, et non un bâtiment.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Je pris donc
  rationale: Le wayyiqtol qal de לקח fait progresser le récit et présente cette action comme la suite de l’ordre reçu. « Donc » exprime naturellement en français ce lien narratif et logique sans le surinterpréter.
- source_word: יַאֲזַנְיָה
  choice: Yaazania
  rationale: Translittération française du nom propre hébreu, avec « Y » pour représenter le yod initial.
- source_word: בֶן
  choice: fils de
  rationale: Emploi généalogique ordinaire indiquant ici la filiation dans la chaîne des noms.
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre biblique.
- source_word: חֲבַצִּנְיָה
  choice: Habatsinia
  rationale: Translittération française qui rend la consonne צ par « ts » et conserve la forme du nom hébreu.
- source_word: אֶחָיו
  choice: ses frères
  rationale: Le sens direct de אָח est « frère » ; le contexte n’impose pas le sens élargi de « parents » ou « membres du clan ».
- source_word: כָּל בָּנָיו
  choice: tous ses fils
  rationale: בָּנִים est ici un pluriel masculin et désigne naturellement les fils de Yaazania ; cette formulation évite de neutraliser sans nécessité le terme source.
- source_word: כָּל בֵּית הָרֵכָבִים
  choice: toute la maison des Rékabites
  rationale: « Maison » conserve l’image familiale et collective de בֵּית, tandis que la note précise qu’il ne s’agit pas d’un bâtiment. « Rékabites » est la forme gentilique française usuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La coordination a été légèrement variée (« ainsi que ») pour éviter une accumulation pesante, tout en conservant chacun des groupes du texte hébreu. Les noms propres suivent une translittération adaptée au français, sauf « Jérémie », dont la forme française traditionnelle est retenue.
