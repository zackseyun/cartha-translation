  variant: modern international French
source:
  edition: WLC
  text: וַ/נִּשְׁמַ֗ע בְּ/ק֨וֹל יְהוֹנָדָ֤ב בֶּן רֵכָב֙ אָבִ֔י/נוּ לְ/כֹ֖ל אֲשֶׁ֣ר צִוָּ֑/נוּ לְ/בִלְתִּ֤י שְׁתֽוֹת יַ֨יִן֙ כָּל יָמֵ֔י/נוּ אֲנַ֣חְנוּ נָשֵׁ֔י/נוּ בָּנֵ֖י/נוּ וּ/בְנֹתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/008.yaml
  text: 'So we have obeyed the voice of Jehonadab son of Rechab[a], our father, in everything that he commanded us: not to drink wine all our days—we, our wives, our sons[b], and our daughters.'
translation:
  language: fr
  text: 'Nous avons obéi à la voix de Yehonadab, fils de Rékab, notre père, en tout ce qu’il nous a ordonné : ne pas boire de vin durant toute notre vie, ni nous, ni nos femmes, ni nos fils, ni nos filles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּשְׁמַע בְּקוֹל
  choice: Nous avons obéi à la voix de
  rationale: La construction שׁמע בְּקוֹל signifie écouter en donnant suite, donc obéir. La formulation française conserve l’image hébraïque de la « voix » tout en exprimant clairement l’obéissance.
- source_word: יְהוֹנָדָב בֶּן־רֵכָב
  choice: Yehonadab, fils de Rékab
  rationale: Translittération moderne des noms d’après leur forme hébraïque pleine dans ce verset.
- source_word: אָבִינוּ
  choice: notre père
  rationale: Le terme désigne ici un ancêtre, mais « notre père » préserve l’expression familiale et ancestrale du texte hébreu.
- source_word: לְכֹל אֲשֶׁר צִוָּנוּ
  choice: en tout ce qu’il nous a ordonné
  rationale: Cette formulation restitue naturellement la portée exhaustive de l’expression hébraïque.
- source_word: לְבִלְתִּי שְׁתוֹת יַיִן
  choice: ne pas boire de vin
  rationale: L’infinitif négatif indique le contenu précis de l’ordre reçu.
- source_word: כָּל יָמֵינוּ
  choice: durant toute notre vie
  rationale: Équivalent français naturel de l’expression littérale « tous nos jours », avec la même portée viagère.
- source_word: אֲנַחְנוּ נָשֵׁינוּ בָּנֵינוּ וּבְנֹתֵינוּ
  choice: ni nous, ni nos femmes, ni nos fils, ni nos filles
  rationale: Dans le contexte de l’interdiction négative, la répétition de « ni » rend clairement en français que celle-ci s’applique à chacun des groupes énumérés, tout en conservant leur distinction explicite.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « obéir à la voix de » conserve volontairement l’idiome hébraïque sans être obscure. Les noms suivent une translittération proche de l’hébreu. Aucun marqueur de note n’est requis puisqu’aucune note n’est proposée.
