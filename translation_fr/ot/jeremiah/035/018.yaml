source:
  edition: WLC
  text: וּ/לְ/בֵ֨ית הָ/רֵכָבִ֜ים אָמַ֣ר יִרְמְיָ֗הוּ כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֚עַן אֲשֶׁ֣ר שְׁמַעְתֶּ֔ם עַל מִצְוַ֖ת יְהוֹנָדָ֣ב אֲבִי/כֶ֑ם וַֽ/תִּשְׁמְרוּ֙ אֶת כָּל מִצְוֺתָ֔י/ו וַֽ/תַּעֲשׂ֔וּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖ה אֶתְ/כֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/018.yaml
  text: 'And to the house of the Rechabites Jeremiah said[a], “Thus says Yahweh of hosts, the God of Israel: Because you have obeyed the command of Jehonadab your father, and have kept all his commands, and have done according to all that he commanded you,”'
translation:
  language: fr
  text: 'À la famille des Rékabites, Jérémie dit : « Voici ce que dit Yahweh des armées, le Dieu d’Israël : parce que vous avez obéi à l’ordre de Yehonadab[a], votre père, que vous avez observé tous ses ordres et que vous avez agi conformément à tout ce qu’il vous a ordonné,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aussi appelé Yonadab dans certaines traductions.
    reason: Signaler la forme abrégée courante du même nom et éviter que les lecteurs ne pensent qu’il s’agit de deux personnages différents.
lexical_decisions:
- source_word: וּלְבֵית הָרֵכָבִים
  choice: À la famille des Rékabites
  rationale: Dans cette construction, בַּיִת désigne la maison au sens de groupe familial ou de lignée. « Famille » exprime clairement ce sens en français moderne.
- source_word: אָמַר יִרְמְיָהוּ
  choice: Jérémie dit
  rationale: Rendu narratif direct et naturel du verbe אָמַר.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formulation conserve la solennité de la formule prophétique tout en restant naturelle en français actuel.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré, et צְבָאוֹת est rendu par « armées », terme clair qui peut englober les puissances célestes et terrestres.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct de la chaîne construite hébraïque.
- source_word: יַעַן אֲשֶׁר
  choice: Parce que
  rationale: La locution introduit le motif de la déclaration divine développée au verset suivant.
- source_word: שְׁמַעְתֶּם עַל מִצְוַת
  choice: vous avez obéi à l’ordre de
  rationale: Dans ce contexte, שׁמע avec עַל exprime une écoute suivie d’obéissance, et non une simple perception auditive.
- source_word: יְהוֹנָדָב אֲבִיכֶם
  choice: Yehonadab, votre ancêtre
  rationale: « Yehonadab » reflète la forme pleine du nom dans le texte hébreu. אָב peut désigner un père ou, comme ici, un ancêtre de la lignée.
- source_word: וַתִּשְׁמְרוּ אֶת כָּל מִצְוֺתָיו
  choice: que vous avez observé tous ses ordres
  rationale: שׁמר appliqué à des prescriptions signifie les garder ou les observer. « Observer » convient naturellement à des ordres en français.
- source_word: וַתַּעֲשׂוּ כְּכֹל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: et agi conformément à tout ce qu’il vous avait ordonné
  rationale: « Conformément à » rend la préposition כְּּ de כְּכֹל, tandis que le plus-que-parfait situe naturellement l’ordre antérieur à l’obéissance rapportée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte emploie le nom divin personnel. Sa translittération préserve cette donnée au lieu de la remplacer par un titre.
- issue: Valeur de אָב dans l’expression אֲבִיכֶם
  choice: votre ancêtre
  alternative: votre père
  rationale: Le mot hébreu peut désigner un père ou un ancêtre. Ici, Yehonadab est l’ancêtre des Rékabites; « ancêtre » transmet donc le référent sans introduire une filiation immédiate.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste ouverte par une virgule, puisque la déclaration divine commencée ici se poursuit au verset 19.
