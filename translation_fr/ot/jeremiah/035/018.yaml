    rationale: Le mot hébreu est « votre père ». Son emploi peut assurément être dynastique ou ancestral, mais traduire « ancêtre » impose cette explication historique plutôt que de conserver le terme relationnel employé par le texte.
  - severity: low
    issue: Parallélisme de la subordonnée causale
    rationale: Ajouter « que » avant « vous avez agi » explicite la coordination des trois actions sans modifier le sens.
