  text: and not to build houses for us to live in[a]; and vineyard and field and seed have not been ours.
translation:
  language: fr
  text: et de ne pas bâtir de maisons pour y habiter ; nous ne possédons ni vigne, ni champ, ni semence.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְבִלְתִּי בְּנוֹת
  choice: et de ne pas bâtir
  rationale: La construction négative à l’infinitif poursuit la liste des prescriptions. « Bâtir » convient au registre biblique sans être obscur.
- source_word: בָּתִּים לְשִׁבְתֵּנוּ
  choice: des maisons pour y habiter
  rationale: Rend concrètement les maisons destinées à servir d’habitation, avec une tournure française naturelle.
- source_word: וְכֶרֶם וְשָׂדֶה וָזֶרַע
  choice: ni vigne, ni champ, ni semence
  rationale: Après la négation, la coordination française par « ni » restitue clairement l’énumération hébraïque. Les trois noms conservent leur sens concret et leur nombre singulier collectif.
- source_word: לֹא יִהְיֶה לָּנוּ
  choice: nous ne possédons
  rationale: L’expression existentielle avec ל indique ici la possession. Le présent exprime naturellement l’état durable décrit dans le discours, sans imposer la nuance plus forte de propriété juridique qu’aurait « ne nous appartient ».
