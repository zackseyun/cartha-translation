  yaml_path: translation/ot/jeremiah/035/010.yaml
  text: So we have lived in tents[b][a], and we have obeyed and done all that Jonadab our father commanded us.
translation:
  language: fr
  text: Nous avons vécu dans des tentes, nous avons obéi et fait tout ce que notre père Jonadab nous avait commandé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֵּשֶׁב בָּאֳהָלִים
  choice: nous avons donc habité sous des tentes
  rationale: Le verbe ישׁב désigne ici le fait de résider. En français, « habiter sous des tentes » est l’expression naturelle pour ce mode de vie; « donc » relie cette pratique aux prescriptions rappelées dans le contexte.
- source_word: וַנִּשְׁמַע
  choice: nous avons obéi
  rationale: Dans le contexte d’un commandement, שׁמע signifie écouter en donnant suite, donc obéir, et non simplement percevoir des paroles.
- source_word: וַנַּעַשׂ
  choice: et fait
  rationale: עשה exprime la mise en pratique effective et conserve le parallélisme hébreu entre écouter avec obéissance et faire.
- source_word: כְּכֹל אֲשֶׁר
  choice: tout ce que
  rationale: Cette tournure rend naturellement en français l’idée de conformité complète à l’ensemble des ordres reçus.
- source_word: צִוָּנוּ
  choice: nous avait commandé
  rationale: צוה est le verbe courant pour donner un commandement. Le plus-que-parfait français situe naturellement l’ordre de Jonadab avant l’obéissance récapitulée ici.
- source_word: יוֹנָדָב
  choice: Jonadab
  rationale: Cette translittération française correspond à la forme consonantique du texte hébreu et à l’usage biblique français courant.
- source_word: אָבִינוּ
  choice: notre père
  rationale: La traduction littérale préserve le langage familial du texte; dans le contexte, Jonadab est le père ancestral du groupe.
theological_decisions:
- issue: Sens de שׁמע en rapport avec le commandement
  choice: obéi
  alternative: écouté
  rationale: Le contexte met l’accent sur la conformité concrète aux ordres de Jonadab. « Obéi » exprime le sens contextuel de l’idiome hébreu sans ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination simple conserve le rythme récapitulatif de l’hébreu. Aucun marqueur de note n’est requis, puisque les variantes lexicales n’affectent pas substantiellement le sens publié.
