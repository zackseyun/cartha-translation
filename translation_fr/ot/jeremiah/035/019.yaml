source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לֹֽא יִכָּרֵ֨ת אִ֜ישׁ לְ/יוֹנָדָ֧ב בֶּן רֵכָ֛ב עֹמֵ֥ד לְ/פָנַ֖/י כָּל הַ/יָּמִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/019.yaml
  text: 'Therefore thus says Yahweh of hosts[b][a], the God of Israel: Jonadab the son of Rechab shall never lack a man standing before me all the days.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle Yahvé des armées, le Dieu d’Israël : Jamais Jonadab, fils de Rékab, ne manquera d’un homme qui se tienne devant moi, tous les jours.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Il ne sera jamais retranché à Jonadab, fils de Rékab, un homme se tenant devant moi, tous les jours. » L’expression « se tenir devant moi » peut désigner un service dans la présence de Dieu, sans que le texte précise une fonction particulière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Rend naturellement la conclusion déduite du récit précédent.
- source_word: כֹּה אָמַר
  choice: ainsi parle
  rationale: Formule prophétique française consacrée, digne et directement compréhensible.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת sans limiter explicitement les armées à une seule sphère.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la chaîne construite hébraïque.
- source_word: לֹא יִכָּרֵת אִישׁ לְיוֹנָדָב בֶּן רֵכָב
  choice: Jamais Jonadab, fils de Rékab, ne manquera d’un homme
  rationale: Exprime en français naturel l’idiome de l’absence de retranchement ou d’interruption d’un représentant masculin, tout en signalant la formulation littérale en note.
- source_word: עֹמֵד לְפָנַי
  choice: qui se tienne devant moi
  rationale: Préserve l’image de la présence et du service devant Dieu sans imposer une fonction sacerdotale ou cultuelle précise.
- source_word: כָּל הַיָּמִים
  choice: tous les jours
  rationale: Conserve l’expression temporelle hébraïque et son caractère durable sans en préciser davantage la portée.
theological_decisions:
- issue: Sens de la promesse d’un homme « devant » Dieu
  choice: Maintenir l’idée d’un représentant durable de la lignée de Jonadab se tenant devant Dieu, sans préciser son office.
  alternative: Interpréter la phrase comme une promesse de sacerdoce perpétuel, ou seulement comme la survie générale de descendants.
  rationale: L’expression peut évoquer un service dans la présence divine, mais le verset ne définit aucune charge particulière; la traduction préserve donc cette ouverture.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Ainsi parle » garde la cadence prophétique; les noms sont francisés selon l’usage biblique courant. Le marqueur [a] est placé après l’ensemble de la promesse qu’il explique.
