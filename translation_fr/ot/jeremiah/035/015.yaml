  to: 'Je vous ai envoyé sans relâche tous mes serviteurs, les prophètes[a], pour vous dire : « Que chacun revienne de sa mauvaise voie, je vous en prie[b] ; améliorez vos actes[c] et ne suivez pas d’autres dieux pour les servir. Demeurez dans le pays que je vous ai donné, à vous et à vos ancêtres. » Mais vous n’avez pas tendu l’oreille et vous ne m’avez pas écouté.'
  rationale: La révision corrige la syntaxe de l’appel distributif et rend נא par une formule française correspondant à son insistance polie. Elle améliore également l’idiomaticité de l’appel à transformer les actes, tout en préservant les impératifs, les images et les ambiguïtés sémantiques du texte hébreu. Les ancres de notes restent correctement placées.
