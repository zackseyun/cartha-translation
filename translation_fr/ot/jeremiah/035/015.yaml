source:
  edition: WLC
  text: וָ/אֶשְׁלַ֣ח אֲלֵי/כֶ֣ם אֶת כָּל עֲבָדַ֣/י הַ/נְּבִאִ֣ים הַשְׁכֵּ֣ים וְ/שָׁלֹ֣חַ לֵ/אמֹ֡ר שֻׁבוּ נָ֡א אִישׁ֩ מִ/דַּרְכּ֨/וֹ הָ/רָעָ֜ה וְ/הֵיטִ֣יבוּ מַֽעַלְלֵי/כֶ֗ם וְ/אַל תֵּ֨לְכ֜וּ אַחֲרֵ֨י אֱלֹהִ֤ים אֲחֵרִים֙ לְ/עָבְדָ֔/ם וּ/שְׁבוּ֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תִּי לָ/כֶ֖ם וְ/לַ/אֲבֹֽתֵי/כֶ֑ם וְ/לֹ֤א הִטִּיתֶם֙ אֶֽת אָזְנְ/כֶ֔ם וְ/לֹ֥א שְׁמַעְתֶּ֖ם אֵלָֽ/י־־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/015.yaml
  text: And I sent to you all my servants the prophets[a], rising early and sending them, saying, ‘Please turn back, each man from his evil way, and make your deeds good, and do not go after other gods to serve them[d][c][b]. Then dwell in the land that I gave to you and to your fathers.’ But you did not incline your ear or listen to me.
translation:
  language: fr
  text: 'Je vous ai envoyé sans relâche tous mes serviteurs, les prophètes[a], pour vous dire : « Que chacun revienne de sa mauvaise voie, je vous en prie[b] ; améliorez vos actes[c] et ne suivez pas d’autres dieux pour les servir. Demeurez dans le pays que je vous ai donné, à vous et à vos ancêtres. » Mais vous n’avez pas tendu l’oreille et vous ne m’avez pas écouté.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « me levant tôt et envoyant », expression hébraïque qui évoque un envoi empressé et persévérant.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « Retournez, je vous en prie » ; de manière plus interprétative : « Repentez-vous ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « amendez votre conduite ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Je vous ai envoyé
  rationale: Le passé composé convient au récit rétrospectif en français moderne et exprime naturellement l’envoi accompli et répété des prophètes.
- source_word: עֲבָדַי הַנְּבִאִים
  choice: tous mes serviteurs, les prophètes
  rationale: La formulation conserve l’apposition qui présente les prophètes comme les serviteurs de Dieu.
- source_word: הַשְׁכֵּים וְשָׁלֹחַ
  choice: sans relâche
  rationale: Cette expression idiomatique hébraïque, littéralement liée au fait de se lever tôt pour envoyer, souligne l’empressement et la persévérance ; « sans relâche » en transmet naturellement la force.
- source_word: שֻׁבוּ נָא
  choice: Revenez donc
  rationale: « Revenez » préserve l’image concrète du retournement, tandis que « donc » rend ici la nuance pressante de נָא sans transformer le verbe en terme théologique spécialisé.
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: chacun, de votre mauvaise voie
  rationale: « Chacun » rend la valeur distributive du singulier אִישׁ. Le passage à « votre » permet une formulation française naturelle dans une adresse collective tout en maintenant la responsabilité individuelle.
- source_word: וְהֵיטִיבוּ מַעַלְלֵיכֶם
  choice: rendez bonnes vos actions
  rationale: Cette traduction conserve le sens causatif de יטב et la référence concrète aux actes, sans réduire l’expression à une disposition intérieure.
- source_word: וְאַל־תֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: ne suivez pas d’autres dieux
  rationale: « Suivre » rend naturellement en français la métaphore hébraïque consistant à aller derrière d’autres dieux.
- source_word: לְעָבְדָם
  choice: pour les servir
  rationale: « Servir » préserve le champ lexical de עבד, qui inclut ici le culte sans s’y limiter explicitement.
- source_word: וּשְׁבוּ אֶל־הָאֲדָמָה
  choice: Demeurez dans le pays
  rationale: L’impératif est conservé. « Demeurez » peut exprimer aussi bien le fait d’habiter que celui de rester, tandis que « pays » convient au territoire donné par Dieu.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבֹתֵיכֶם
  choice: que je vous ai donné, à vous et à vos ancêtres
  rationale: « Ancêtres » transmet clairement en français moderne le sens collectif de אֲבֹתֵיכֶם sans suggérer uniquement les pères immédiats.
- source_word: וְלֹא הִטִּיתֶם אֶת־אָזְנְכֶם
  choice: Mais vous n’avez pas tendu l’oreille
  rationale: L’image hébraïque de l’oreille inclinée est maintenue dans une expression française intelligible, distincte du second verbe « écouter ».
theological_decisions:
- issue: Portée de l’appel exprimé par שׁוּב
  choice: Revenez donc
  alternative: Repentez-vous donc
  rationale: Le contexte implique l’abandon du mal, mais « revenez » conserve la métaphore hébraïque et évite d’imposer au verbe un vocabulaire théologique plus systématisé.
- issue: Valeur de l’ordre וּשְׁבוּ concernant le pays
  choice: Demeurez dans le pays
  alternative: Alors vous pourrez demeurer dans le pays
  rationale: L’hébreu présente grammaticalement un impératif. La traduction ne le transforme donc pas explicitement en promesse conditionnelle, même si le contexte permet de percevoir un lien entre l’obéissance et le maintien dans le pays.
- issue: Nature du service rendu aux autres dieux
  choice: pour les servir
  alternative: pour les adorer
  rationale: Dans ce contexte, le service comporte manifestement une dimension cultuelle, mais « servir » conserve l’étendue sémantique du terme hébreu sans la réduire au seul acte d’adoration.
translation_notes:
  register: Français international moderne, digne et accessible. Les images encore compréhensibles, comme « tendre l’oreille », sont conservées ; les idiomes opaques sont rendus naturellement et signalés en note. La ponctuation souligne les différentes composantes de l’exhortation sans ajouter de relation logique absente de l’hébreu.
