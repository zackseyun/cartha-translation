source:
  edition: WLC
  text: וַ/יֹּאמְר֖וּ לֹ֣א נִשְׁתֶּה יָּ֑יִן כִּי֩ יוֹנָדָ֨ב בֶּן רֵכָ֜ב אָבִ֗י/נוּ צִוָּ֤ה עָלֵ֨י/נוּ֙ לֵ/אמֹ֔ר לֹ֧א תִשְׁתּוּ יַ֛יִן אַתֶּ֥ם וּ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/006.yaml
  text: But they said[a], “We will not drink wine, for Jonadab son of Rechab, our father, commanded us, saying, ‘You shall not drink wine, you or your sons[c][b], forever.’”
translation:
  language: fr
  text: 'Mais ils répondirent[a] : « Nous ne boirons pas de vin, car Jonadab, fils de Rékab, notre ancêtre[b], nous a donné cet ordre : “Ni vous ni vos fils[c] ne boirez de vin, pour toujours.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et ils dirent ». La conjonction narrative hébraïque peut être rendue de l’une ou l’autre manière ; « Mais » souligne le contraste avec l’invitation à boire du vin.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « notre père ». Ici, le mot désigne leur aïeul Jonadab.
    reason: cultural_note
  - marker: c
    text: L’hébreu dit précisément « vos fils », et non le terme plus général « vos enfants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Mais ils répondirent
  rationale: Le waw narratif fait progresser le récit, tandis que « Mais » exprime naturellement le contraste avec l’invitation à boire du verset précédent. « Répondirent » convient à cette réaction verbale directe.
- source_word: לֹא נִשְׁתֶּה יָּיִן
  choice: Nous ne boirons pas de vin
  rationale: L’inaccompli exprime ici un refus résolu en réponse à l’offre qui leur est faite.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de leur refus dans un registre français naturel et digne.
- source_word: יוֹנָדָב בֶּן רֵכָב
  choice: Jonadab, fils de Rékab
  rationale: Translittération française usuelle des noms et restitution directe du patronyme hébreu.
- source_word: אָבִינוּ
  choice: notre ancêtre
  rationale: אָב peut désigner un père ou un aïeul. Ici, Jonadab appartient à une génération antérieure du clan; « ancêtre » transmet clairement le sens contextuel sans laisser croire qu’il s’agit de leur père immédiat.
- source_word: צִוָּה עָלֵינוּ
  choice: nous a donné cet ordre
  rationale: Rend idiomatiquement en français la force obligatoire de la construction hébraïque « commander sur nous ».
- source_word: לֵאמֹר
  choice: 'cet ordre :'
  rationale: Les deux-points introduisent naturellement en français le contenu de l’ordre, sans reproduire le sémitisme « en disant ».
- source_word: לֹא תִשְׁתּוּ יַיִן
  choice: Vous ne boirez pas de vin
  rationale: Le futur français peut porter ici la valeur impérative durable de l’interdiction.
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: ni vous ni vos fils
  rationale: La reprise distributive explicite les deux groupes visés et conserve le terme masculin spécifique בנים, « fils ».
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Expression française courante qui rend la durée indéfinie et permanente de l’ordre.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct demeure ferme sans archaïsme. La ponctuation française et « nous a donné cet ordre » évitent un calque lourd de l’hébreu, tandis que « fils » et la portée durable de l’interdiction sont conservés.
