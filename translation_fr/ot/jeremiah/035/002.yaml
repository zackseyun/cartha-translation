revisions:
- from: Va vers la communauté des Rékabites, parle-leur, puis fais-les entrer dans la maison de Yahweh, dans l’une des salles, et donne-leur du vin à boire.
  to: Va chez la famille des Rékabites, parle-leur, puis amène-les dans la maison de Yahweh, dans l’une des salles, et donne-leur du vin à boire.
  rationale: Révision limitée afin de rendre plus fidèlement le sens collectif de « maison des Rékabites » et la relation de déplacement exprimée par les impératifs, tout en conservant le registre moderne, le nom Yahweh et l’absence d’idée de contrainte dans « donne-leur du vin à boire ». Aucun appel de note n’est requis par le texte français révisé.
