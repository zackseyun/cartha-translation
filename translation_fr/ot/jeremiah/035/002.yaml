  text: הָלוֹךְ֮ אֶל בֵּ֣ית הָ/רֵכָבִים֒ וְ/דִבַּרְתָּ֣ אוֹתָ֔/ם וַ/הֲבִֽאוֹתָ/ם֙ בֵּ֣ית יְהוָ֔ה אֶל אַחַ֖ת הַ/לְּשָׁכ֑וֹת וְ/הִשְׁקִיתָ֥ אוֹתָ֖/ם יָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/002.yaml
  text: Go to the house of the Rechabites[a], and speak to them, and bring them to the house of Yahweh, into one of the chambers, and give them wine to drink.
translation:
  language: fr
  text: Va chez la famille des Rékabites, parle-leur, puis amène-les dans la maison de Yahweh, dans l’une des salles, et donne-leur du vin à boire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ
  choice: Va
  rationale: L’impératif de הלך exprime ici un ordre direct; « Va » est naturel et concis.
- source_word: בֵּית הָרֵכָבִים
  choice: la communauté des Rékabites
  rationale: בֵּית désigne ici la maison au sens social de groupe familial ou clan, et non un bâtiment; « communauté » rend ce sens clairement en français courant.
- source_word: וְדִבַּרְתָּ אוֹתָם
  choice: parle-leur
  rationale: דבר avec le complément personnel signifie s’adresser à quelqu’un; « parle-leur » suit naturellement le contexte.
- source_word: וַהֲבִאוֹתָם
  choice: fais-les entrer
  rationale: Le hifil de בוא est causatif. Dans ce contexte de déplacement jusque dans une salle du sanctuaire, « fais-les entrer » en exprime précisément le mouvement.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction conserve l’image hébraïque de la « maison » ainsi que le nom divin personnel יהוה.
- source_word: אַחַת הַלְּשָׁכוֹת
  choice: l’une des salles
  rationale: לשכה désigne une salle ou chambre dans les dépendances du sanctuaire; « salle » est clair et naturel en français moderne.
- source_word: וְהִשְׁקִיתָ אוֹתָם יָיִן
  choice: donne-leur du vin à boire
  rationale: Le hifil de שקה signifie donner à boire. Cette formulation rend le causatif sans suggérer à tort qu’ils seraient contraints de boire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », qui préserve le nom personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom divin et évite de le remplacer par un titre.
- issue: Sens de בֵּית dans בֵּית הָרֵכָבִים
  choice: la communauté des Rékabites
  alternative: la maison des Rékabites
  rationale: Le contexte vise le groupe rékabite que Jérémie doit conduire au sanctuaire, non leur demeure. La traduction explicite donc le sens collectif sans ajouter de précision généalogique non exprimée.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs restent directs. « Maison de Yahweh » conserve l’expression cultuelle hébraïque, tandis que « salles » évite un archaïsme architectural inutile.
