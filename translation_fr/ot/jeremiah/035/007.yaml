revisions:
- from: Vous ne construirez pas de maison, vous ne sèmerez pas de semence et vous ne planterez pas de vigne; vous n’en posséderez pas non plus. Mais vous habiterez sous des tentes tous vos jours, afin de vivre longtemps sur la terre où vous séjournez en étrangers[a].
  to: Vous ne construirez pas de maison, vous ne sèmerez aucune semence et vous ne planterez pas de vigne; vous n’en aurez pas non plus. Mais vous habiterez dans des tentes tous vos jours, afin que vous viviez longtemps sur la terre où vous séjournez[a].
  rationale: La révision corrige la préposition relative aux tentes, allège une formulation française moins naturelle et laisse à la note la précision lexicale sur le statut de séjour temporaire. Elle maintient l’enchaînement, la force injonctive et les ambiguïtés contrôlées du texte hébreu.
