review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement les interdictions successives, l’alternative de l’habitation en tentes, le but (« afin que ») et la durée de vie sur la terre. Toutefois, « sous des tentes » ne correspond pas exactement à l’hébreu, qui dit « dans des tentes ». « En étrangers » explicite de manière un peu lourde une nuance réelle de גָּרִים; elle est mieux portée par une note, tandis que le texte conserve « séjournez ».
  naturalness: Le français est globalement clair et digne. « Habiter dans des tentes » est plus idiomatique et exact que « habiter sous des tentes ». « Vous n’en aurez pas non plus » rend naturellement la formule hébraïque sans imposer plus fortement que nécessaire l’idée juridique de propriété. « Aucune semence » évite la répétition un peu pesante de « semer de semence » tout en conservant l’objet concret.
  terminology: « Maison », « semence », « vigne », « tentes » et « terre » sont appropriés. La note conserve avec justesse la nuance de résidence non permanente associée à גּוּר, sans en faire une affirmation doctrinale ou sociale trop précise dans le texte principal.
  issues:
  - severity: medium
    issue: « sous des tentes »
    rationale: בָּאֳהָלִים signifie « dans des tentes ». En français, « sous des tentes » peut évoquer le fait d’être abrité par des tentes plutôt que d’y résider; « dans des tentes » est à la fois plus précis et naturel.
  - severity: low
    issue: « où vous séjournez en étrangers »
    rationale: La nuance d’étranger résident est défendable pour גָּרִים, mais l’expression française est moins fluide et interprète explicitement une nuance que la note peut préserver. « Où vous séjournez » garde le caractère non permanent sans surcharge.
  - severity: low
    issue: « vous n’en posséderez pas non plus »
    rationale: Le verbe hébreu exprime littéralement qu’il n’y en aura pas pour eux. « Vous n’en aurez pas non plus » est plus proche de cette formulation et préserve l’ambiguïté entre possession et disponibilité.
  revised_text: Vous ne construirez pas de maison, vous ne sèmerez aucune semence et vous ne planterez pas de vigne; vous n’en aurez pas non plus. Mais vous habiterez dans des tentes tous vos jours, afin que vous viviez longtemps sur la terre où vous séjournez[a].
  revised_footnotes:
  - marker: a
    text: Ou « où vous résidez comme étrangers » ou « où vous vivez comme résidents temporaires ». Le verbe hébreu désigne le séjour d’une personne qui n’est pas établie de façon permanente.
    reason: Précision lexicale sur la nuance de גָּרִים.
  revision_rationale: La révision corrige la préposition relative aux tentes, allège une formulation française moins naturelle et laisse à la note la précision lexicale sur le statut de séjour temporaire. Elle maintient l’enchaînement, la force injonctive et les ambiguïtés contrôlées du texte hébreu.
