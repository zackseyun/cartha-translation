  text: וּ/בַ֣יִת לֹֽא תִבְנ֗וּ וְ/זֶ֤רַע לֹֽא תִזְרָ֨עוּ֙ וְ/כֶ֣רֶם לֹֽא תִטָּ֔עוּ וְ/לֹ֥א יִֽהְיֶ֖ה לָ/כֶ֑ם כִּ֠י בָּ/אֳהָלִ֤ים תֵּֽשְׁבוּ֙ כָּל יְמֵי/כֶ֔ם לְמַ֨עַן תִּֽחְי֜וּ יָמִ֤ים רַבִּים֙ עַל פְּנֵ֣י הָ/אֲדָמָ֔ה אֲשֶׁ֥ר אַתֶּ֖ם גָּרִ֥ים שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/007.yaml
  text: You must not build a house[a], and you must not sow seed, and you must not plant a vineyard, nor shall you have one; but you shall live in tents all your days, so that you may live many days on the face of the land where you are residing there.
translation:
  language: fr
  text: Vous ne construirez pas de maison, vous ne sèmerez aucune semence et vous ne planterez pas de vigne; vous n’en aurez pas non plus. Mais vous habiterez dans des tentes tous vos jours, afin que vous viviez longtemps sur la terre où vous séjournez[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « où vous résidez comme étrangers » ou « où vous vivez comme résidents temporaires ». Le verbe hébreu désigne le séjour d’une personne qui n’est pas établie de façon permanente.
    reason: Précision lexicale sur la nuance de גָּרִים.
lexical_decisions:
- source_word: וּבַיִת לֹא תִבְנוּ
  choice: Vous ne construirez pas de maison
  rationale: « Maison » désigne ici le bâtiment, en contraste direct avec les tentes. Le futur français exprime naturellement une interdiction solennelle dans une instruction rapportée.
- source_word: וְזֶרַע לֹא תִזְרָעוּ
  choice: vous ne sèmerez pas de semence
  rationale: Cette formulation conserve l’image agricole concrète et la répétition étymologique de l’hébreu, sans préciser indûment une culture particulière.
- source_word: וְכֶרֶם לֹא תִטָּעוּ
  choice: vous ne planterez pas de vigne
  rationale: En français courant, « planter une vigne » désigne naturellement l’établissement d’un vignoble et rend bien l’activité agricole visée.
- source_word: וְלֹא יִהְיֶה לָכֶם
  choice: vous n’en posséderez pas non plus
  rationale: La tournure existentielle avec לָכֶם exprime ici la possession. Le pronom « en » reprend naturellement la vigne mentionnée juste avant, tout en laissant possible une portée récapitulative.
- source_word: כִּי בָּאֳהָלִים תֵּשְׁבוּ
  choice: Mais vous habiterez sous des tentes
  rationale: כִּי introduit l’alternative positive aux interdictions. « Habiter sous des tentes » est une expression française naturelle et digne pour la résidence nomade.
- source_word: כָּל יְמֵיכֶם
  choice: tous vos jours
  rationale: Rendu proche de l’expression hébraïque, intelligible dans un registre biblique moderne.
- source_word: לְמַעַן תִּחְיוּ יָמִים רַבִּים
  choice: afin de vivre longtemps
  rationale: La formule française rend le but exprimé par לְמַעַן et l’idiome hébraïque littéralement associé à de « nombreux jours ».
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sur la terre
  rationale: « Sur la terre » rend idiomatiquement la locution hébraïque sans la lourdeur de « sur la face du sol ».
- source_word: אֲשֶׁר אַתֶּם גָּרִים שָׁם
  choice: où vous séjournez en étrangers
  rationale: Le verbe גור évoque une résidence sans implantation permanente et souvent le statut d’étranger résident. Cette formulation conserve cette nuance importante sans la redondance littérale de שָׁם après אֲשֶׁר.
theological_decisions:
- issue: Portée de גָּרִים dans le rapport des Rékabites à la terre
  choice: où vous séjournez en étrangers
  alternative: où vous résidez
  rationale: Le choix retenu préserve la condition non permanente et socialement extérieure suggérée par גור, pertinente pour le mode de vie rékabite, sans transformer le verset en affirmation doctrinale plus précise qu’il ne l’est.
- issue: Référent de וְלֹא יִהְיֶה לָכֶם
  choice: vous n’en posséderez pas non plus
  alternative: et vous n’en aurez pas
  rationale: Le singulier renvoie probablement à la vigne, mais peut aussi résumer l’interdiction de posséder ce type de bien agricole. « En posséder » maintient cette légère ouverture tout en étant clair.
translation_notes:
  register: Français international moderne, digne et accessible. Les futurs négatifs rendent l’instruction solennelle; « habiter sous des tentes » évite à la fois l’archaïsme et la banalité. Le marqueur [a] est placé immédiatement après l’expression qu’il explique.
