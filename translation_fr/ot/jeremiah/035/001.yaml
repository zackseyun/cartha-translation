id: JER.35.1
reference: Jeremiah 35:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה בִּ/ימֵ֨י יְהוֹיָקִ֧ים בֶּן יֹאשִׁיָּ֛הוּ מֶ֥לֶךְ יְהוּדָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/001.yaml
  text: The word that came to Jeremiah from Yahweh in the days of Jehoiakim son of Josiah[a], king of Judah, saying,
translation:
  language: fr
  text: 'La parole qui fut adressée à Jérémie de la part de Yahvé[a], au temps de Jojakim, fils de Josias, roi de Juda, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici le nom divin YHWH.
    reason: Préciser que « Yahvé » transcrit le tétragramme présent dans le texte source.
lexical_decisions:
- source_word: הַדָּבָר
  choice: La parole
  rationale: Dans cette formule prophétique, דָּבָר désigne la parole ou le message reçu de Dieu. « La parole » conserve le caractère traditionnel et formulaire de l’hébreu.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: qui fut adressée à
  rationale: L’expression hébraïque introduit une révélation reçue par un prophète. Cette tournure française naturelle restitue l’idée sans traduire littéralement le verbe « être ».
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: Forme française usuelle du nom du prophète.
- source_word: מֵאֵת
  choice: de la part de
  rationale: La préposition composée marque ici la source de la parole. « De la part de » convient naturellement à une communication divine.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin YHWH, préférée à la substitution par un titre.
- source_word: בִּימֵי
  choice: au temps de
  rationale: Cette expression rend naturellement l’indication chronologique hébraïque « aux jours de » sans la limiter explicitement au règne.
- source_word: יְהוֹיָקִים
  choice: Jojakim
  rationale: Forme française biblique usuelle de ce nom royal.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: fils de Josias
  rationale: Rendu direct de l’expression généalogique hébraïque, avec la forme française usuelle du nom.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: L’apposition française restitue directement le titre et le territoire.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: L’infinitif hébreu introduit les paroles qui suivent. « En ces termes » assure une transition naturelle en français tout en conservant la fonction discursive.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme YHWH. La transcription « Yahvé » préserve le nom propre au lieu de le remplacer silencieusement par un titre.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le caractère solennel de la suscription prophétique, tandis que « au temps de » et « en ces termes » évitent une littéralité peu naturelle.
