  text: וַ/יְהִ֗י בַּ/עֲל֨וֹת נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶל֮ אֶל הָ/אָרֶץ֒ וַ/נֹּ֗אמֶר בֹּ֚אוּ וְ/נָב֣וֹא יְרוּשָׁלִַ֔ם מִ/פְּנֵי֙ חֵ֣יל הַ/כַּשְׂדִּ֔ים וּ/מִ/פְּנֵ֖י חֵ֣יל אֲרָ֑ם וַ/נֵּ֖שֶׁב בִּ/ירוּשָׁלִָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/011.yaml
  text: But when Nebuchadnezzar king of Babylon came up against the land[a], we said, ‘Come[b], and let us go to Jerusalem because of the army of the Chaldeans and because of the army of Aram.’ So we settled in Jerusalem.
translation:
  language: fr
  text: 'Mais lorsque Nabuchodonosor, roi de Babylone, est monté contre le pays, nous avons dit : « Venez, allons à Jérusalem à cause de l’armée des Chaldéens[a] et de l’armée d’Aram[b]. » Nous nous sommes donc installés à Jérusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des Babyloniens ».'
    reason: lexical_alternative
  - marker: b
    text: Aram est traditionnellement rendu par « Syrie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּעֲלוֹת
  choice: Mais lorsque … est monté
  rationale: La construction introduit une circonstance temporelle avec un léger contraste. « Est monté contre » conserve l’image du mouvement militaire et son orientation hostile dans ce contexte.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, le terme désigne le territoire de Juda. « Le pays » est naturel en français tout en conservant la portée géographique générale de l’hébreu.
- source_word: וַנֹּאמֶר
  choice: nous avons dit
  rationale: Rend simplement le verbe narratif à la première personne du pluriel, sans ajouter un destinataire absent du texte.
- source_word: בֹּאוּ וְנָבוֹא
  choice: Venez, allons
  rationale: Conserve l’impératif suivi du cohortatif, qui exprime une exhortation et une résolution collectives.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: Exprime la raison du déplacement sans préciser davantage si l’accent porte sur la peur, la fuite ou la simple présence menaçante des armées.
- source_word: חֵיל
  choice: armée
  rationale: Dans ce contexte militaire, le mot désigne une force armée ; « armée » est le terme français le plus clair et direct.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Conserve la désignation ethnopolitique employée dans le texte hébreu ; « Babyloniens » est une équivalence contextuelle plus familière.
- source_word: אֲרָם
  choice: Aram
  rationale: Conserve le nom propre hébreu plutôt que de lui substituer l’appellation géographique traditionnelle « Syrie ».
- source_word: וַנֵּשֶׁב
  choice: nous nous sommes donc installés
  rationale: Le verbe ישב peut signifier habiter, demeurer ou s’établir. Ici, il décrit leur établissement à Jérusalem à la suite de leur décision ; le passé composé convient au récit français.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et largement reconnaissable du nom du roi de Babylone.
