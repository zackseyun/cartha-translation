revisions:
- from: 'Voici ce que dit le SEIGNEUR des armées, le Dieu d’Israël : « Va dire aux hommes de Juda et aux habitants de Jérusalem : “Ne vous laisserez-vous pas instruire en écoutant mes paroles ? déclare le SEIGNEUR.” »'
  to: 'Voici ce que dit le SEIGNEUR des armées, le Dieu d’Israël : « Va dire aux hommes de Juda et aux habitants de Jérusalem : “Ne recevrez-vous pas l’instruction d’écouter mes paroles ? déclare le SEIGNEUR.” »'
  rationale: La révision limitée remplace « vous laisser instruire en écoutant » par « recevoir l’instruction d’écouter ». Elle maintient la question rhétorique, le registre et l’ambiguïté fonctionnelle de l’infinitif hébreu, tout en évitant de faire de l’écoute le simple moyen de recevoir l’instruction.
  reviewer_model: gpt-5.6-terra
