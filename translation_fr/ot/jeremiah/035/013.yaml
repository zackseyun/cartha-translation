base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/013.yaml
  text: 'Thus says the LORD of hosts, the God of Israel: Go and say to the men of Judah and to the inhabitants of Jerusalem, ‘Will you not receive instruction by listening to my words? declares the LORD.’'
translation:
  language: fr
  text: 'Voici ce que dit le SEIGNEUR des armées, le Dieu d’Israël : « Va dire aux hommes de Juda et aux habitants de Jérusalem : “Ne recevrez-vous pas l’instruction d’écouter mes paroles ? déclare le SEIGNEUR.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: le SEIGNEUR des armées
  rationale: Rend le nom divin selon la convention française des petites capitales et conserve le sens concret de צְבָאוֹת sans le paraphraser.
- source_word: לְאִישׁ יְהוּדָה
  choice: aux hommes de Juda
  rationale: Le singulier collectif אִישׁ désigne ici la population masculine ou, plus largement, les gens de Juda; cette formulation reste proche de l’hébreu tout en étant claire.
- source_word: הֲלוֹא תִקְחוּ מוּסָר לִשְׁמֹעַ אֶל דְּבָרַי
  choice: Ne vous laisserez-vous pas instruire en écoutant mes paroles ?
  rationale: מוּסָר recouvre l’instruction, l’avertissement et la correction. La tournure pronominale française exprime naturellement l’idée de recevoir cette instruction, tandis que « en écoutant » maintient le lien entre l’instruction et l’écoute des paroles divines.
- source_word: נְאֻם יְהוָה
  choice: déclare le SEIGNEUR
  rationale: Rend clairement la formule prophétique qui authentifie l’oracle comme parole divine.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: La convention typographique « le SEIGNEUR » signale qu’il s’agit du nom divin dans le texte source, tout en suivant un usage français largement intelligible et sans imposer une vocalisation particulière.
- issue: Portée de מוּסָר
  choice: se laisser instruire
  alternative: accepter la correction / tirer la leçon
  rationale: Le choix retenu garde ensemble les dimensions pédagogique et corrective du terme, sans réduire le reproche à une punition ni à une simple acquisition intellectuelle.
translation_notes:
  register: Registre prophétique digne et actuel. L’impératif singulier « Va dire » s’adresse à Jérémie. La question rhétorique conserve le reproche implicite du texte hébreu; l’imparfait ou le futur français n’a pas été ajouté, afin de garder son caractère direct.
