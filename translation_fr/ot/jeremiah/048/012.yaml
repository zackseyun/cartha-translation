  text: לָ/כֵ֞ן הִנֵּ֖ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּחְתִּי ל֥/וֹ צֹעִ֖ים וְ/צֵעֻ֑/הוּ וְ/כֵלָ֣י/ו יָרִ֔יקוּ וְ/נִבְלֵי/הֶ֖ם יְנַפֵּֽצוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/012.yaml
  text: Therefore behold[a], days are coming, declares Yahweh, when I will send to him pourers, and they will pour him out[c][b]; they will empty his vessels and shatter their jars.
translation:
  language: fr
  text: C’est pourquoi, voici que des jours viennent, déclare Yahweh, où j’enverrai vers lui des hommes chargés de transvaser[a]. Ils le transvaseront[b], videront ses récipients et briseront leurs jarres[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hommes qui font basculer les récipients ». Le mot hébreu est rare ; le contexte du vin versé, des récipients vidés et des jarres brisées favorise l’idée du transvasement.
    reason: lexical_alternative
  - marker: b
    text: 'Autre compréhension possible : « ils le feront errer ». Le contexte de l’image vinicole favorise toutefois « ils le transvaseront ».'
    reason: alternative_reading
  - marker: c
    text: Littéralement « leurs jarres ». Certains comprennent ou proposent « ses jarres », en référence à Moab, mais le texte hébreu reçu porte « leurs ».
    reason: textual_difficulty
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Rend le lien logique avec la description précédente de la tranquillité de Moab, dans un français naturel.
- source_word: הִנֵּה
  choice: voici que
  rationale: Conserve la fonction d’appel à l’attention et la force de l’annonce prophétique.
- source_word: יָמִים בָּאִים
  choice: des jours viennent
  rationale: Suit de près la formule prophétique hébraïque tout en restant idiomatique en français.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend solennellement la formule prophétique et conserve le nom divin.
- source_word: וְשִׁלַּחְתִּי לוֹ
  choice: j’enverrai vers lui
  rationale: La préposition ל indique la direction vers Moab; « vers lui » évite d’ajouter explicitement « contre lui », bien que le contexte soit hostile.
- source_word: צֹעִים
  choice: des hommes chargés de transvaser
  rationale: Le terme est rare et difficile. Le contexte du vin, des récipients vidés et des cruches brisées favorise l’image d’agents qui transvasent, rendue ici sans créer un nom français artificiel.
- source_word: וְצֵעֻהוּ
  choice: ils le transvaseront
  rationale: Le contexte prolonge l’image de Moab comme vin demeuré sur sa lie; « transvaser » exprime le déplacement du contenu d’un récipient à un autre.
- source_word: וְכֵלָיו יָרִיקוּ
  choice: videront ses récipients
  rationale: Le hifil de ריק signifie « vider ». « Récipients » garde l’image générale des contenants sans en préciser indûment la matière.
- source_word: וְנִבְלֵיהֶם יְנַפֵּצוּ
  choice: briseront leurs cruches
  rationale: נבל désigne ici un contenant, probablement une jarre ou cruche. Le suffixe masculin pluriel « leurs » du texte reçu est conservé malgré la difficulté référentielle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération représente directement le nom divin du texte source sans le remplacer par un titre.
- issue: Portée de l’image du transvasement appliquée à Moab
  choice: Conserver la métaphore sans l’expliciter théologiquement
  alternative: Paraphraser comme une déportation ou un jugement
  rationale: Le verset décrit le jugement au moyen d’une image vinicole. La traduction maintient cette tension imagée sans identifier les agents ni définir davantage la nature du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le rythme prophétique, tandis que « des hommes chargés de transvaser » rend intelligible un terme hébreu rare sans effacer son incertitude. Les termes « récipients » et « cruches » maintiennent l’image concrète du vin et de ses contenants.
