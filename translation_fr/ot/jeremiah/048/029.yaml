source:
  edition: WLC
  text: שָׁמַ֥עְנוּ גְאוֹן מוֹאָ֖ב גֵּאֶ֣ה מְאֹ֑ד גָּבְה֧/וֹ וּ/גְאוֹנ֛/וֹ וְ/גַאֲוָת֖/וֹ וְ/רֻ֥ם לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/029.yaml
  text: We have heard of the pride of Moab—he is exceedingly proud—of his haughtiness[a], his pride, his arrogance, and the loftiness of his heart.
translation:
  language: fr
  text: Nous avons entendu parler de l’orgueil de Moab — il est extrêmement orgueilleux —, de sa hauteur[a], de son orgueil, de son arrogance et de l’élévation de son cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «de son attitude hautaine».
    reason: Alternative idiomatique explicitant le sens moral de la métaphore hébraïque de la hauteur.
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: Nous avons entendu parler
  rationale: Le qatal à la première personne du pluriel exprime ici une connaissance reçue et établie; le passé composé est naturel en français et «entendre parler de» convient avec le complément nominal.
- source_word: גְאוֹן
  choice: orgueil
  rationale: Dans ce contexte de jugement, le mot désigne l’orgueil arrogant de Moab plutôt que sa majesté.
- source_word: מוֹאָב
  choice: Moab
  rationale: Forme française traditionnelle et transparente du nom propre.
- source_word: גֵּאֶה מְאֹד
  choice: il est extrêmement orgueilleux
  rationale: La proposition parenthétique conserve l’intensification de מְאֹד et l’insistance rhétorique du texte.
- source_word: גָּבְהוֹ
  choice: sa hauteur
  rationale: Le choix garde la métaphore de l’élévation tout en laissant le contexte d’orgueil en indiquer la portée morale.
- source_word: וּגְאוֹנוֹ
  choice: son orgueil
  rationale: La répétition du vocabulaire de l’orgueil est maintenue afin de préserver l’effet cumulatif de l’hébreu.
- source_word: וְגַאֲוָתוֹ
  choice: son arrogance
  rationale: «Arrogance» distingue naturellement ce quasi-synonyme sans atténuer la dénonciation.
- source_word: וְרֻם לִבּוֹ
  choice: l’élévation de son cœur
  rationale: Cette formulation conserve à la fois l’image verticale de רוּם et l’expression anthropologique du cœur.
theological_decisions: []
