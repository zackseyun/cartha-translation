id: JER.48.17
reference: Jeremiah 48:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נֻ֤דוּ ל/וֹ֙ כָּל סְבִיבָ֔י/ו וְ/כֹ֖ל יֹדְעֵ֣י שְׁמ֑/וֹ אִמְר֗וּ אֵיכָ֤ה נִשְׁבַּר֙ מַטֵּה עֹ֔ז מַקֵּ֖ל תִּפְאָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/017.yaml
  text: 'Mourn for him[a], all you around him, and all who know his name, say: “How the mighty scepter is broken[c][b], the staff of splendor!”'
translation:
  language: fr
  text: 'Plaignez-le[a], vous tous qui l’entourez, et vous tous qui connaissez son nom[b] ! Dites : « Comment a été brisé le sceptre puissant, le bâton majestueux[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Lamentez-vous sur lui » ou « secouez la tête sur lui » ; le verbe hébreu peut désigner une lamentation, souvent accompagnée d’un geste.
    reason: lexical_alternative
  - marker: b
    text: « Connaissez son nom » peut aussi signifier « connaissez sa renommée » ou « sa réputation ».
    reason: lexical_alternative
  - marker: c
    text: Les mots hébreux peuvent tous deux désigner un bâton ou une verge ; l’image évoque probablement la puissance et la gloire de Moab désormais brisées.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻדוּ ל/וֹ
  choice: Plaignez-le
  rationale: Le verbe נוד peut exprimer une lamentation compatissante, parfois accompagnée d’un mouvement de tête. « Plaignez-le » rend naturellement l’appel à prendre part au deuil tout en conservant Moab personnifié au masculin.
- source_word: כָּל סְבִיבָיו
  choice: vous tous qui l’entourez
  rationale: Cette formulation garde la valeur d’adresse de l’impératif et désigne les peuples ou témoins situés autour de Moab.
- source_word: וְכֹל יֹדְעֵי שְׁמוֹ
  choice: et vous tous qui connaissez son nom
  rationale: La traduction formelle préserve l’ambiguïté de שֵׁם, qui peut désigner le nom propre aussi bien que la renommée ou la réputation.
- source_word: אִמְרוּ
  choice: Dites
  rationale: Impératif simple qui introduit directement la plainte citée sans accentuer artificiellement son intensité.
- source_word: אֵיכָה נִשְׁבַּר
  choice: Comment a-t-il été brisé
  rationale: « Comment » conserve la tournure exclamative de lamentation portée par אֵיכָה. Le passé composé passif rend l’accompli hébreu et son résultat présent.
- source_word: מַטֵּה עֹז
  choice: le sceptre puissant
  rationale: מַטֶּה peut être un bâton, une verge ou un sceptre. Dans l’image de la puissance nationale de Moab abattue, « sceptre » fait entendre l’autorité sans exclure l’image concrète de l’objet brisé.
- source_word: מַקֵּל תִּפְאָרָה
  choice: le bâton majestueux
  rationale: « Bâton » maintient le parallélisme avec le sceptre, tandis que « majestueux » exprime ici la gloire, l’éclat et la dignité associés à תִּפְאָרָה dans un français naturel.
theological_decisions:
- issue: Référent masculin du pronom singulier
  choice: Moab est personnifié par « le » et « il ».
  alternative: Employer le neutre grammatical avec « la nation » ou reformuler sans pronom.
  rationale: Le texte hébreu emploie un suffixe masculin singulier et présente Moab comme une personne que ses voisins doivent plaindre; conserver cette personnification respecte la force poétique sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, poétique et digne. L’inversion disloquée « le sceptre puissant, le bâton majestueux » conserve l’effet de lamentation et le parallélisme hébreu. Les trois marqueurs de notes figurent dans le texte dans leur ordre d’apparition.
