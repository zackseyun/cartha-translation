id: JER.48.20
reference: Jeremiah 48:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֹבִ֥ישׁ מוֹאָ֛ב כִּֽי חַ֖תָּה הילילי ו/זעקי הַגִּ֣ידוּ בְ/אַרְנ֔וֹן כִּ֥י שֻׁדַּ֖ד מוֹאָֽב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/020.yaml
  text: 'Moab is put to shame[a], for she is shattered[c][b]. Wail and cry out! Declare it by the Arnon: Moab is devastated.'
translation:
  language: fr
  text: 'Moab est couvert de honte, car il est brisé[a]. Lamente-toi et pousse des cris ! Annoncez-le près de l’Arnon[b] : Moab est ravagé[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il est consterné » ou « il s’est effondré ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à l’Arnon » ou « dans la région de l’Arnon ».
    reason: lexical_alternative
  - marker: c
    text: Ou « est mis à sac » ou « est dévasté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁ
  choice: est couvert de honte
  rationale: Le hiphil exprime ici le résultat d’une humiliation. « Est couvert de honte » rend naturellement en français l’idée que Moab a été réduit à la honte.
- source_word: מוֹאָב
  choice: Moab
  rationale: Forme française traditionnelle et internationale du nom du peuple et du territoire.
- source_word: כִּי
  choice: car
  rationale: Introduit la cause ou l’explication de la honte de Moab, dans un registre prophétique naturel.
- source_word: חַתָּה
  choice: il est brisé
  rationale: Le verbe חתת peut évoquer l’effondrement, la terreur ou la consternation. « Brisé » conserve l’image forte de la ruine sans exclure l’abattement.
- source_word: הילילי
  choice: Lamente-toi
  rationale: Impératif féminin singulier adressé de manière personnifiée à Moab. « Se lamenter » exprime clairement le deuil public et sonore dans un français actuel et digne.
- source_word: ו/זעקי
  choice: et pousse des cris
  rationale: L’impératif féminin singulier désigne un cri intense de détresse. Cette formulation s’associe naturellement à « Lamente-toi ».
- source_word: הַגִּידוּ
  choice: Annoncez-le
  rationale: L’impératif pluriel appelle plusieurs destinataires à faire connaître publiquement la nouvelle de la chute de Moab; le pronom reprend cette nouvelle implicite.
- source_word: בְ/אַרְנֹון
  choice: près de l’Arnon
  rationale: La préposition ב est souple, et l’Arnon désigne ici vraisemblablement le cours d’eau ou sa gorge. « Près de » donne une localisation géographique naturelle tout en signalant la proximité.
- source_word: שֻׁדַּד
  choice: est ravagé
  rationale: Le pual de שדד décrit le fait d’être dévasté, mis à sac ou dépouillé. « Ravagé » exprime largement la ruine sans limiter le sens au seul pillage.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et solennel. Les changements de nombre du texte hébreu sont conservés : deux impératifs au singulier personnifient Moab, puis « Annoncez » est au pluriel. Le masculin « il » reprend le nom propre Moab, tandis que les impératifs ne marquent pas le genre en français.'
