base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/007.yaml
  text: Because you trusted in your works and in your treasures[a], you also will be captured; and Chemosh will go out into exile[e][d][c][b], his priests and his officials together.
translation:
  language: fr
  text: Parce que tu as mis ta confiance dans tes œuvres[a] et dans tes trésors[b], toi aussi, tu seras prise. Kemosh[c] partira en exil[d], avec ses prêtres et ses responsables[e], tous ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans tes actes » ou « dans ce que tu as produit ». Le mot hébreu peut désigner les œuvres, les actes ou ce que l’on produit.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans tes richesses » ou « dans tes réserves ».
    reason: lexical_alternative
  - marker: c
    text: Kemosh était le dieu national de Moab.
    reason: cultural_note
  - marker: d
    text: Ou « en captivité ».
    reason: lexical_alternative
  - marker: e
    text: Ou « ses princes » ou « ses chefs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יַעַן
  choice: Parce que
  rationale: La combinaison hébraïque renforce le lien causal. En français moderne, « Parce que » exprime naturellement cette causalité sans lourdeur redondante.
- source_word: בִּטְחֵךְ
  choice: tu as mis ta confiance
  rationale: Le parfait qal féminin singulier exprime la confiance placée antérieurement dans ce qui devient le motif du jugement. Cette tournure française rend clairement l'idée de dépendance.
- source_word: בְּמַעֲשַׂיִךְ
  choice: dans tes réalisations
  rationale: מַעֲשֶׂה peut désigner les œuvres, les actes ou ce qui a été produit. « Réalisations » convient au parallèle avec les richesses sans réduire le mot aux seules actions morales.
- source_word: וּבְאֹצְרוֹתַיִךְ
  choice: et dans tes trésors
  rationale: אֹצָר peut désigner un trésor, des richesses accumulées ou un entrepôt. « Trésors » conserve ici l'objet de la confiance tout en laissant l'autre sens en note.
- source_word: גַּם אַתְּ
  choice: toi aussi
  rationale: La construction souligne l'inclusion emphatique de Moab dans le jugement annoncé. « Toi aussi » en garde l'accent.
- source_word: תִּלָּכֵדִי
  choice: tu seras prise
  rationale: Le niphal imparfait féminin singulier de לכד a ici un sens passif de capture. Le féminin correspond à Moab personnifiée et apostrophée.
- source_word: וְיָצָא
  choice: partira
  rationale: Dans la suite prophétique, le parfait prend une valeur future. « Partira » exprime naturellement le départ forcé précisé par « en exil ».
- source_word: כמיש
  choice: Kemosh
  rationale: Translittération française claire du nom propre du dieu moabite, distincte d'une traduction ou d'une interprétation.
- source_word: בַּגּוֹלָה
  choice: en exil
  rationale: La locution désigne la déportation. « En exil » est idiomatique et conserve l'image polémique du dieu emmené avec ses serviteurs.
- source_word: כֹּהֲנָיו
  choice: ses prêtres
  rationale: Le suffixe masculin singulier renvoie naturellement à Kemosh, présenté comme une personne dans le récit.
- source_word: וְשָׂרָיו
  choice: ses hauts responsables
  rationale: שַׂר couvre les sens de chef, prince ou dignitaire. « Hauts responsables » reste large et naturel dans le contexte politico-cultuel.
- source_word: יַחַד
  choice: avec
  rationale: La construction française « avec ses prêtres et ses hauts responsables » rend leur départ conjoint; l'idée de totalité commune est maintenue sans ajouter le lourd « tous ensemble ».
theological_decisions:
- issue: Référent et statut de Kemosh
  choice: Kemosh est rendu comme la divinité moabite nommée, représentée comme partant en exil avec ses prêtres et ses hauts responsables.
  alternative: Comprendre Kemosh comme un nom de lieu ou un titre dynastique.
  rationale: Le sens contextuel le plus direct est celui du dieu national de Moab, personnifié dans sa défaite. Le texte garde ainsi sa force polémique sans commentaire doctrinal ajouté.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le féminin de « prise » maintient l'apostrophe à Moab. La ponctuation sépare clairement la cause, le jugement contre Moab et l'exil de Kemosh avec son entourage.
