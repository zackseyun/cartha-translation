  text: אוֹי לְ/ךָ֣ מוֹאָ֔ב אָבַ֖ד עַם כְּמ֑וֹשׁ כִּֽי לֻקְּח֤וּ בָנֶ֨י/ךָ֙ בַּ/שֶּׁ֔בִי וּ/בְנֹתֶ֖י/ךָ בַּ/שִּׁבְיָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/046.yaml
  text: Woe to you[a], Moab! The people of Chemosh have perished, for your sons have been taken captive, and your daughters into captivity.
translation:
  language: fr
  text: Malheur à toi, Moab ! Le peuple de Kemosh a péri, car tes fils ont été emmenés captifs, et tes filles ont été emmenées en captivité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en déportation ». Les deux termes hébreux rendus par « captifs » et « en captivité » sont presque synonymes et forment un parallélisme poétique.
    reason: alternative lexicale et préservation du parallélisme hébreu
lexical_decisions:
- source_word: אוֹי לְךָ מוֹאָב
  choice: Malheur à toi, Moab !
  rationale: « Malheur à toi » conserve la force de lamentation et de jugement de l’interjection prophétique אוֹי, tandis que לְךָ désigne Moab comme objet de cette lamentation.
- source_word: אָבַד
  choice: a péri
  rationale: Le parfait exprime ici la ruine accomplie du sujet collectif singulier עַם ; « a péri » reste direct sans préciser un agent destructeur.
- source_word: עַם כְּמוֹשׁ
  choice: le peuple de Kemosh
  rationale: Cette construction à l’état construit désigne le peuple lié à Kemosh, divinité nationale de Moab. « Kemosh » suit une translittération française courante.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif qui explique le malheur annoncé.
- source_word: לֻקְּחוּ בָנֶיךָ בַּשֶּׁבִי
  choice: tes fils ont été emmenés captifs
  rationale: La formulation conserve le passif de לקח et rend naturellement en français l’idée de capture et de déportation portée par בַּשֶּׁבִי.
- source_word: וּבְנֹתֶיךָ בַּשִּׁבְיָה
  choice: et tes filles en déportation
  rationale: L’ellipse du verbe est maintenue comme en hébreu. « Déportation » exprime le déplacement forcé tout en distinguant légèrement les deux termes hébreux presque synonymes.
theological_decisions:
- issue: Lien entre Moab et Kemosh
  choice: le peuple de Kemosh
  alternative: le peuple qui appartient à Kemosh
  rationale: Le génitif français préserve la relation concise et potentiellement chargée de sens de la construction hébraïque, sans préciser s’il s’agit uniquement d’appartenance, de culte ou d’identité nationale.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme prophétique est conservé, ainsi que le parallélisme entre les fils et les filles.
