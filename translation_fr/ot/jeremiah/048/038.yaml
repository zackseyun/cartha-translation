source:
  edition: WLC
  text: עַ֣ל כָּל גַּגּ֥וֹת מוֹאָ֛ב וּ/בִ/רְחֹבֹתֶ֖י/הָ כֻּלֹּ֣/ה מִסְפֵּ֑ד כִּֽי שָׁבַ֣רְתִּי אֶת מוֹאָ֗ב כִּ/כְלִ֛י אֵֽין חֵ֥פֶץ בּ֖/וֹ נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/038.yaml
  text: On all the rooftops of Moab and in her squares[a], everywhere there is mourning; for I have broken Moab like a vessel in which there is no delight, declares Yahweh.
translation:
  language: fr
  text: Sur tous les toits de Moab et sur ses places, tout n’est que lamentation, car j’ai brisé Moab comme un vase dont personne ne veut[a] — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans lequel on ne trouve aucun plaisir » ; on peut aussi comprendre : « qui n’a aucune valeur » ou « dont personne ne veut ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּגּוֹת
  choice: toits
  rationale: Le nom désigne les toits plats des maisons, qui servaient aussi d’espaces de vie. « Toits » conserve l’image concrète dans un français naturel.
- source_word: רְחֹבֹתֶיהָ
  choice: ses places
  rationale: רְחוֹב désigne souvent un espace urbain large et ouvert, notamment une place publique, plutôt qu’une rue étroite.
- source_word: כֻּלֹּה מִסְפֵּד
  choice: tout n’est que lamentation
  rationale: Cette formulation restitue la portée totale de כֻּלֹּה et la déclaration nominale concise de l’hébreu.
- source_word: מִסְפֵּד
  choice: lamentation
  rationale: Le terme peut désigner à la fois l’expression publique du deuil et les rites qui l’accompagnent. « Lamentation » convient au contexte prophétique sans restreindre le sens aux seules larmes.
- source_word: שָׁבַרְתִּי
  choice: j’ai brisé
  rationale: Le parfait présente l’action comme accomplie, et « brisé » maintient la métaphore d’un objet rendu inutilisable.
- source_word: כִּכְלִי
  choice: comme un vase
  rationale: כְּלִי est un terme large pouvant désigner un récipient, un ustensile ou un objet. Dans cette image de quelque chose que l’on brise, « vase » est concret et naturel, sans imposer une forme précise.
- source_word: אֵין חֵפֶץ בּוֹ
  choice: dont personne ne veut
  rationale: La tournure rend naturellement l’idée d’un objet qui ne suscite ni désir ni intérêt. Une note conserve le sens plus littéral de חֵפֶץ, « plaisir » ou « agrément ».
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule nominale solennelle correspond à l’expression prophétique hébraïque et préserve le nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en préserve la fonction de nom propre sans le remplacer par un titre.
- issue: Portée de אֵין חֵפֶץ בּוֹ
  choice: dont personne ne veut
  alternative: dans lequel on ne trouve aucun plaisir
  rationale: Le texte peut exprimer le manque d’agrément, de désir ou de valeur attribuée au vase. Le texte principal donne l’implication idiomatique, tandis que la note maintient la formulation plus littérale et son ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La structure demeure proche de l’hébreu, tandis que « dont personne ne veut » exprime idiomatiquement la valeur pragmatique de la dernière comparaison. Le tiret met en relief la formule prophétique finale.
