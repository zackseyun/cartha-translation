reference: Jeremiah 48:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָר֗וּר עֹשֶׂ֛ה מְלֶ֥אכֶת יְהוָ֖ה רְמִיָּ֑ה וְ/אָר֕וּר מֹנֵ֥עַ חַרְבּ֖/וֹ מִ/דָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/010.yaml
  text: Cursed is the one who does the work of Yahweh negligently[a], and cursed is the one who holds back his sword from blood.
translation:
  language: fr
  text: Maudit soit celui qui accomplit avec négligence[a] l’œuvre de Yahweh ! Maudit soit celui qui retient son épée loin du sang !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec tromperie » ou « avec perfidie ». Le mot hébreu רְמִיָּה peut évoquer la tromperie ou la perfidie ; ici, il désigne probablement une exécution relâchée ou négligente de la tâche.
    reason: alternative lexicale
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit soit
  rationale: Cette formule française naturelle conserve la force imprécatoire de l’adjectif prédicatif hébreu.
- source_word: עֹשֶׂה
  choice: celui qui accomplit
  rationale: Le participe est employé comme nom avec une portée générale. « Celui qui accomplit » rend clairement cette fonction et convient à une tâche confiée.
- source_word: מְלֶאכֶת יְהוָה
  choice: l’œuvre de Yahweh
  rationale: מְלָאכָה désigne ici l’œuvre ou la tâche comprise, dans le contexte du jugement contre Moab, comme venant de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: רְמִיָּה
  choice: avec négligence
  rationale: Dans ce contexte, le mot qualifie vraisemblablement une exécution relâchée ou négligente de la tâche. La possibilité lexicale « avec tromperie » est conservée en note.
- source_word: מֹנֵעַ
  choice: retient
  rationale: Le participe exprime l’action de retenir ou d’empêcher. « Retient » s’emploie naturellement avec l’épée et préserve l’image.
- source_word: חַרְבּוֹ
  choice: son épée
  rationale: Rendu direct du nom singulier muni du suffixe masculin singulier.
- source_word: מִדָּם
  choice: loin du sang
  rationale: La préposition מִן exprime l’éloignement ou la retenue par rapport au sang. Cette formulation française préserve l’image concrète et abrupte sans la réduire au seul sens abstrait de « carnage ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » en conserve la fonction de nom propre sans lui substituer un titre.
- issue: Faut-il atténuer l’image violente du jugement ?
  choice: conserver « retient son épée loin du sang »
  alternative: empêche son épée de verser le sang ; retient son épée de tuer
  rationale: L’hébreu présente le jugement confié comme une scène violente et concrète. La traduction garde cette tension et cette rudesse sans ajouter d’explication justificative.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme imprécatoire est marqué par la répétition de « Maudit soit ». L’image abrupte de l’épée et du sang est maintenue, et l’ambiguïté de רְמִיָּה est signalée en note.
