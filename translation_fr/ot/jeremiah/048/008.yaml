source:
  edition: WLC
  text: וְ/יָבֹ֨א שֹׁדֵ֜ד אֶל כָּל עִ֗יר וְ/עִיר֙ לֹ֣א תִמָּלֵ֔ט וְ/אָבַ֥ד הָ/עֵ֖מֶק וְ/נִשְׁמַ֣ד הַ/מִּישֹׁ֑ר אֲשֶׁ֖ר אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/008.yaml
  text: And the destroyer will come against every city[a], and no city will escape; the valley will perish, and the plain will be destroyed, as Yahweh has said.
translation:
  language: fr
  text: Le dévastateur viendra contre chaque ville, et aucune ville n’échappera ; la vallée périra, et le plateau[a] sera détruit, comme Yahweh l’a dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la plaine » ou « le haut pays ». Le terme hébreu désigne une terre plane et peut, en Moab, renvoyer à la région élevée du plateau.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁדֵד
  choice: le dévastateur
  rationale: Le participe substantivé désigne celui qui ravage ou pille. « Le dévastateur » convient au contexte de jugement et reste naturel en français actuel.
- source_word: וְיָבֹא
  choice: viendra
  rationale: L’imparfait hébreu employé dans ce discours prophétique a ici une valeur prédictive, rendue naturellement par le futur simple.
- source_word: אֶל כָּל עִיר
  choice: contre chaque ville
  rationale: La préposition אֶל indique littéralement un mouvement vers, mais la présence d’un envahisseur lui donne ici une nuance hostile que « contre » exprime clairement.
- source_word: וְעִיר לֹא תִמָּלֵט
  choice: et aucune ville n’échappera
  rationale: Après l’énoncé distributif précédent, le singulier a une portée générale. « Aucune ville » rend clairement la totalité du jugement.
- source_word: הָעֵמֶק
  choice: la vallée
  rationale: עֵמֶק désigne couramment une vallée et peut renvoyer ici à la région de la vallée en Moab.
- source_word: וְאָבַד
  choice: périra
  rationale: Le verbe exprime la ruine ou la disparition. « Périra » conserve la force du langage prophétique.
- source_word: הַמִּישֹׁר
  choice: le plateau
  rationale: מִישׁוֹר désigne un terrain plat ou une plaine et, dans la géographie de Moab, peut désigner le plateau élevé. « Le plateau » rend bien ce contraste régional avec la vallée, tandis qu’une note conserve les autres possibilités.
- source_word: וְנִשְׁמַד
  choice: sera détruit
  rationale: Le niphal de שׁמד exprime le fait d’être détruit ou exterminé. Cette formulation est exacte sans renforcer indûment le sens.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: comme Yahweh l’a dit
  rationale: La proposition relative renvoie à la déclaration divine qui garantit l’accomplissement annoncé. La formulation française est naturelle et conserve le nom divin.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase conserve le parallélisme entre la vallée et le plateau ainsi que la progression catégorique du jugement. Le marqueur de note est placé après « plateau », terme auquel la note se rapporte.
