source:
  edition: WLC
  text: כִּ֤י כָל רֹאשׁ֙ קָרְחָ֔ה וְ/כָל זָקָ֖ן גְּרֻעָ֑ה עַ֤ל כָּל יָדַ֨יִם֙ גְּדֻדֹ֔ת וְ/עַל מָתְנַ֖יִם שָֽׂק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/037.yaml
  text: For every head is bald[a], and every beard is cut off; on all the hands are gashes[b], and on the waist is sackcloth.
translation:
  language: fr
  text: Car toutes les têtes sont rasées, toutes les barbes sont coupées ; toutes les mains portent des incisions[a], et les reins sont couverts d’une toile de sac[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner des entailles faites sur les mains ou, plus largement, sur les bras en signe de deuil.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur les reins, une toile de sac » ; il s’agit d’un tissu grossier porté autour de la taille en signe de deuil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication du deuil décrit dans le contexte, avec une valeur causale naturelle en français.
- source_word: כָל רֹאשׁ קָרְחָה
  choice: toutes les têtes sont rasées
  rationale: קָרְחָה désigne ici la calvitie ou le rasage comme signe de deuil. « Sont rasées » exprime clairement cette pratique sans lourdeur.
- source_word: וְכָל זָקָן גְּרֻעָה
  choice: toutes les barbes sont coupées
  rationale: גְּרֻעָה évoque ce qui est retranché ou diminué ; « coupées » conserve le parallélisme des gestes de deuil sans préciser si la barbe est entièrement rasée ou seulement taillée.
- source_word: עַל כָּל יָדַיִם גְּדֻדֹת
  choice: toutes les mains portent des incisions
  rationale: גְּדֻדֹת désigne des entailles rituelles de deuil. La formulation française est naturelle tout en conservant littéralement יָדַיִם, qui peut englober les mains et les bras.
- source_word: וְעַל מָתְנַיִם שָׂק
  choice: les reins sont couverts d’une toile de sac
  rationale: מָתְנַיִם désigne la région des reins ou de la taille. « Les reins » préserve l’image corporelle biblique, tandis que « couverts d’une toile de sac » rend naturellement le vêtement de deuil.
