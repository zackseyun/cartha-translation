lexical_decisions:
- source_word: וְ/עַל
  choice: contre
  rationale: La préposition répétée עַל, précédée de la conjonction, poursuit la liste des lieux visés par le jugement. En français, la coordination est rendue naturellement par la juxtaposition, puis par « et » avant le dernier élément.
- source_word: דִּיבוֹן
  choice: Dibon
  rationale: Nom de lieu translittéré selon la forme française usuelle.
- source_word: נְבוֹ
  choice: Nébo
  rationale: Nom de lieu employé ici comme toponyme; la forme française usuelle porte un accent aigu.
- source_word: בֵּית דִּבְלָתַיִם
  choice: Beth-Diblataïm
  rationale: Nom de lieu composé translittéré plutôt que traduit; le trait d’union rend lisible sa structure, et « aïm » conserve la finale hébraïque.
