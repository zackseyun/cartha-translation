  text: עַל כֵּ֞ן לִבִּ֤/י לְ/מוֹאָב֙ כַּ/חֲלִלִ֣ים יֶהֱמֶ֔ה וְ/לִבִּ/י֙ אֶל אַנְשֵׁ֣י קִֽיר חֶ֔רֶשׂ כַּ/חֲלִילִ֖ים יֶהֱמֶ֑ה עַל כֵּ֛ן יִתְרַ֥ת עָשָׂ֖ה אָבָֽדוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/036.yaml
  text: Therefore my heart moans for Moab like flutes, and my heart moans like flutes for the men of Kir-heres, because the abundance he made has perished.
translation:
  language: fr
  text: C’est pourquoi mon cœur gémit pour Moab comme des flûtes, et mon cœur gémit pour les gens de Kir-Hérès comme des flûtes. C’est pourquoi les richesses qu’il avait acquises ont disparu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ce qu’il avait produit a péri ». L’expression hébraïque peut désigner l’abondance, les réserves ou les biens accumulés.'
    reason: Préserver l’ambiguïté lexicale de יִתְרַת עָשָׂה et présenter une traduction plus formelle possible.
lexical_decisions:
- source_word: יֶהֱמֶה
  choice: gémit
  rationale: Le verbe exprime ici une plainte profonde et sonore ; « gémit » convient naturellement au cœur et maintient l’image musicale des flûtes.
- source_word: כַחֲלִלִים / כַחֲלִילִים
  choice: comme des flûtes
  rationale: Traduction directe de l’instrument à vent associé au deuil, sans ajouter une interprétation absente du texte.
- source_word: אַנְשֵׁי קִיר חֶרֶשׂ
  choice: les gens de Kir-Hérès
  rationale: « Gens » rend naturellement אַנְשֵׁי sans restreindre inutilement la référence aux seuls hommes adultes.
- source_word: יִתְרַת עָשָׂה
  choice: les richesses qu’il avait acquises
  rationale: יִתְרָה désigne ce qui reste ou l’abondance ; avec עָשָׂה, l’expression peut viser les biens amassés. Cette formulation française exprime le sens économique probable tout en signalant en note l’ambiguïté.
- source_word: אָבָדוּ
  choice: ont disparu
  rationale: Le pluriel hébreu s’accorde avec les biens ou richesses envisagés collectivement et indique leur perte.
theological_decisions:
- issue: Identité du locuteur dont le cœur gémit
  choice: Conserver « mon cœur » sans identifier explicitement le locuteur
  alternative: Préciser qu’il s’agit du prophète ou de Dieu
  rationale: Le verset ne nomme pas ici le locuteur ; l’expliciter résoudrait indûment une ambiguïté littéraire et théologique.
- issue: Sujet singulier de עָשָׂה
  choice: « qu’il avait acquises »
  alternative: « qu’ils avaient acquises » ou « qu’elle avait acquises »
  rationale: Le texte massorétique porte un verbe masculin singulier. Le français conserve ce singulier, probablement référé à Moab personnifié ou à son peuple pris collectivement, sans le remplacer par un pluriel conjectural.
translation_notes:
  register: Français moderne, international et digne. La répétition de « mon cœur gémit comme des flûtes » est maintenue pour reproduire la lamentation insistante de l’hébreu ; la ponctuation répartit clairement les trois propositions.
