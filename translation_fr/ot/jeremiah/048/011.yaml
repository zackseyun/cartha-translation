  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שַׁאֲנַ֨ן מוֹאָ֜ב מִ/נְּעוּרָ֗י/ו וְ/שֹׁקֵ֥ט הוּא֙ אֶל שְׁמָרָ֔י/ו וְ/לֹֽא הוּרַ֤ק מִ/כְּלִי֙ אֶל כֶּ֔לִי וּ/בַ/גּוֹלָ֖ה לֹ֣א הָלָ֑ךְ עַל כֵּ֗ן עָמַ֤ד טַעְמ/וֹ֙ בּ֔/וֹ וְ/רֵיח֖/וֹ לֹ֥א נָמָֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/011.yaml
  text: Moab has been at ease from his youth[a], and he has been undisturbed on his dregs; he has not been poured from vessel to vessel, and he has not gone into exile. Therefore his taste has remained in him, and his scent has not changed.
translation:
  language: fr
  text: Moab est tranquille depuis sa jeunesse ; il est en repos sur ses lies[a]. Il n’a pas été transvasé de récipient en récipient et il n’est pas allé en exil. C’est pourquoi sa saveur est restée en lui, et son odeur n’a pas changé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une image viticole : un vin laissé sur son dépôt, sans être transvasé d’un récipient à un autre.'
    reason: Explication de la métaphore viticole implicite dans le texte hébreu.
lexical_decisions:
- source_word: שַׁאֲנַן
  choice: vivait dans la tranquillité
  rationale: Exprime une sécurité durable et une existence sans bouleversement, avec la nuance critique du contexte prophétique.
- source_word: מִנְּעוּרָיו
  choice: depuis sa jeunesse
  rationale: Rend directement l’expression temporelle et conserve la personnification de Moab.
- source_word: שֹׁקֵט ... אֶל שְׁמָרָיו
  choice: il reposait sur sa lie
  rationale: Conserve l’image du vin laissé sans être remué sur son dépôt ; « lie » est le terme français courant dans ce contexte viticole.
- source_word: הוּרַק מִכְּלִי אֶל כֶּלִי
  choice: n’a pas été transvasé d’un récipient dans un autre
  rationale: « Transvasé » rend précisément le transfert du vin entre contenants, tandis que « récipient » respecte le caractère générique de כְּלִי.
- source_word: וּבַגּוֹלָה לֹא הָלָךְ
  choice: il n’est pas parti en exil
  rationale: Rend clairement le départ forcé loin du pays sans surinterpréter le mode précis de déportation.
- source_word: טַעְמוֹ
  choice: sa saveur
  rationale: Dans l’image viticole, « saveur » est naturel en français et désigne la qualité gustative du vin.
- source_word: עָמַד ... בּוֹ
  choice: il a gardé
  rationale: Exprime idiomatiquement la persistance de la saveur, littéralement demeurée en lui.
- source_word: רֵיחוֹ
  choice: son odeur
  rationale: Terme sensoriel neutre qui évite la connotation nécessairement agréable d’« arôme ».
- source_word: נָמָר
  choice: n’a pas changé
  rationale: Rend simplement le sens d’altération ou de changement dans le parallèle avec la saveur conservée.
theological_decisions:
- issue: Personnification de Moab au masculin singulier
  choice: Conserver le masculin singulier par « sa jeunesse », « il », « sa lie », « sa saveur » et « son odeur ».
  alternative: Employer des formulations visant explicitement le peuple ou la nation de Moab.
  rationale: L’hébreu présente constamment Moab comme une entité masculine singulière ; la traduction maintient cette personnification sans lui ajouter une interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore viticole est conservée, avec « transvasé », terme précis mais largement compréhensible. La ponctuation rend perceptible la progression entre la longue tranquillité de Moab, l’absence d’exil et la permanence de ses caractéristiques.
