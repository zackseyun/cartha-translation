  text: ה/ניס מִ/פְּנֵ֤י הַ/פַּ֨חַד֙ יִפֹּ֣ל אֶל הַ/פַּ֔חַת וְ/הָֽ/עֹלֶה֙ מִן הַ/פַּ֔חַת יִלָּכֵ֖ד בַּ/פָּ֑ח כִּֽי אָבִ֨יא אֵלֶ֧י/הָ אֶל מוֹאָ֛ב שְׁנַ֥ת פְּקֻדָּתָ֖/ם נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/044.yaml
  text: He who flees from the terror will fall into the pit[a], and he who comes up from the pit will be caught in the snare; for I will bring upon her, upon Moab, the year of their punishment, declares Yahweh.
translation:
  language: fr
  text: Celui qui fuit devant la terreur tombera dans la fosse, et celui qui remonte de la fosse sera pris au piège ; car je ferai venir sur elle, sur Moab, l’année de leur châtiment[a], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’année de leur visitation » ou « l’année de leur reddition de comptes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הניס
  choice: Celui qui fuit
  rationale: Le participe substantivé désigne de manière générale toute personne qui fuit; cette formulation conserve le singulier et le ton proverbial.
- source_word: הפחד
  choice: la terreur
  rationale: פַּחַד évoque ici l’effroi causé par le jugement, plus fortement que la simple peur.
- source_word: הפחת
  choice: la fosse
  rationale: פַּחַת désigne une fosse pouvant servir de piège; « fosse » reste bref et maintient la succession terreur–fosse–piège.
- source_word: והעלה מן הפחת
  choice: celui qui remonte de la fosse
  rationale: Le participe substantivé est rendu parallèlement au premier; « remonte » traduit עלה sans préciser indûment la manière dont la personne en sort.
- source_word: ילכד בפח
  choice: sera pris au piège
  rationale: Cette expression française naturelle conserve l’image du פַּח et la distingue de la fosse précédente.
- source_word: כי אביא אליה אל מואב
  choice: Car je ferai venir sur elle, sur Moab
  rationale: La construction annonce ce que Yahweh fera venir contre Moab; le féminin « elle » est conservé et explicité par l’apposition « sur Moab ».
- source_word: שנת פקדתם
  choice: l’année où je leur demanderai des comptes
  rationale: Dans cet oracle de jugement, פְּקֻדָּה indique une intervention divine punitive. Cette formulation française exprime le règlement de comptes sans réduire le terme à la seule idée d’une peine infligée.
- source_word: נאם יהוה
  choice: déclare Yahweh
  rationale: La formule prophétique garde sa solennité, et le nom divin יהוה est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Sens de פְּקֻדָּה dans l’oracle de jugement
  choice: l’année où je leur demanderai des comptes
  alternative: l’année de leur châtiment; l’année de leur intervention
  rationale: Le contexte impose une portée punitive, tandis que la note signale que le mot hébreu désigne plus largement une intervention ou inspection conduisant ici au jugement.
- issue: Référents pronominaux dans אליה et פקדתם
  choice: « sur elle » pour Moab, puis « leur » conformément au suffixe masculin pluriel
  alternative: uniformiser les deux en « sur Moab… de son châtiment »
  rationale: Le texte hébreu passe réellement d’un suffixe féminin singulier à un suffixe masculin pluriel. La traduction conserve cette tension grammaticale au lieu de l’harmoniser silencieusement.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme proverbial est conservé, ainsi que les trois images successives de la terreur, de la fosse et du piège. Le changement de genre et de nombre des suffixes hébreux n’est pas lissé.
