revisions:
- from: Celui qui fuit devant la terreur tombera dans la fosse, et celui qui remonte de la fosse sera pris au piège. Car je ferai venir sur elle, sur Moab, l’année où je leur demanderai des comptes[a], déclare Yahweh.
  to: Celui qui fuit devant la terreur tombera dans la fosse, et celui qui remonte de la fosse sera pris au piège ; car je ferai venir sur elle, sur Moab, l’année de leur châtiment[a], déclare Yahweh.
  rationale: La révision conserve le changement hébreu de référent entre « elle » (féminin singulier, Moab présenté comme entité) et « leur » (masculin pluriel), sans l’harmoniser. Elle remplace une paraphrase verbale par le groupe nominal du texte source et reformule la note pour signaler des alternatives lexicales défendables sans présenter une glose contextuelle comme un sens littéral.
