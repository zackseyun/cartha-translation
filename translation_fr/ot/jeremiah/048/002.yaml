  text: אֵ֣ין עוֹד֮ תְּהִלַּ֣ת מוֹאָב֒ בְּ/חֶשְׁבּ֗וֹן חָשְׁב֤וּ עָלֶ֨י/הָ֙ רָעָ֔ה לְכ֖וּ וְ/נַכְרִיתֶ֣/נָּה מִ/גּ֑וֹי גַּם מַדְמֵ֣ן תִּדֹּ֔מִּי אַחֲרַ֖יִ/ךְ תֵּ֥לֶךְ חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/002.yaml
  text: 'There is no more praise for Moab[a]. In Heshbon they have devised evil against her: ‘Come, let us cut her off from being a nation.’ You too, Madmen, will be silenced[b]; the sword will go after you.'
translation:
  language: fr
  text: 'Il n’y a plus de louange pour Moab[a]. À Heshbon, on a projeté son malheur : « Venez, supprimons-la du nombre des nations ! » Toi aussi, Madmen, tu seras réduite au silence[b] ; l’épée te poursuivra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, le nom Heshbon et le verbe traduit par « on a projeté » ont des sonorités proches, ce qui crée un jeu de mots.
    reason: lexical_alternative
  - marker: b
    text: Madmen est probablement un nom de lieu. En hébreu, ce nom fait écho au verbe traduit par « tu seras réduite au silence », ce qui renforce l’annonce du jugement.
    reason: cultural_note
lexical_decisions:
- source_word: אֵין עוֹד תְּהִלַּת מוֹאָב
  choice: Il n’y a plus de louange pour Moab
  rationale: « Louange » reste proche de תְּהִלָּה, qui peut aussi désigner la renommée. La tournure française exprime naturellement la cessation annoncée par אֵין עוֹד sans réduire le sens à la seule gloire politique.
- source_word: בְּחֶשְׁבּוֹן חָשְׁבוּ
  choice: À Heshbon, on a projeté
  rationale: La préposition est comprise au sens locatif. Le pronom indéfini « on » rend le sujet pluriel non identifié, et « projeté » exprime ici le calcul hostile de חָשַׁב. Le jeu sonore hébreu ne peut être reproduit naturellement en français et est signalé en note.
- source_word: עָלֶיהָ רָעָה
  choice: son malheur
  rationale: Dans ce contexte, רָעָה désigne le mal ou le désastre projeté contre Moab. « Son malheur » garde la force négative tout en indiquant clairement qu’il s’agit du sort funeste préparé pour elle, plutôt que de sa propre faute morale.
- source_word: לְכוּ וְנַכְרִיתֶנָּה מִגּוֹי
  choice: Venez, supprimons-la du nombre des nations
  rationale: « Venez » introduit naturellement l’exhortation, tandis que « supprimons-la du nombre des nations » communique l’anéantissement de Moab comme entité nationale sans suggérer nécessairement l’extermination de chaque individu.
- source_word: מַדְמֵן תִּדֹּמִּי
  choice: Madmen, tu seras réduite au silence
  rationale: Madmen est conservé comme nom de lieu. « Réduite au silence » rend le passif de sens contextuel porté par תִּדֹּמִּי et laisse entendre la destruction sans l’expliciter au-delà du texte.
- source_word: אַחֲרַיִךְ תֵּלֶךְ חָרֶב
  choice: l’épée te poursuivra
  rationale: Cette formulation française naturelle conserve la personnification de l’épée et la valeur de אַחֲרַיִךְ, littéralement « derrière toi » ou « après toi ».
