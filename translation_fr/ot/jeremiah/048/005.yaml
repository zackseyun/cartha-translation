source:
  edition: WLC
  text: כִּ֚י מַעֲלֵ֣ה ה/לחות בִּ/בְכִ֖י יַֽעֲלֶה בֶּ֑כִי כִּ֚י בְּ/מוֹרַ֣ד חוֹרֹנַ֔יִם צָרֵ֥י צַֽעֲקַת שֶׁ֖בֶר שָׁמֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/005.yaml
  text: For on the ascent of Luhith they go up with weeping[b][a]; for on the descent of Horonaim they have heard the distressing cry of destruction.
translation:
  language: fr
  text: Car, sur la montée de Louhith, on monte en pleurs, en pleurs[a] ; car, à la descente de Horonaïm, on entend un cri angoissé de destruction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète ici le nom « pleurs » pour insister : littéralement, « en pleurs, il/on monte — pleurs ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu de cette partie du verset est difficile. On peut aussi comprendre plus littéralement : « les ennemis ont entendu un cri de destruction » ; d’autres y voient, comme dans le texte, « un cri angoissé de destruction ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מַעֲלֵה
  choice: montée
  rationale: Le nom désigne une voie montante ou une pente ascendante ; « montée » conserve le relief et forme un contraste naturel avec « descente ».
- source_word: הַלֻּחוֹת
  choice: Louhith
  rationale: Le contexte indique un nom de lieu. La translittération française usuelle est retenue.
- source_word: בִּבְכִי ... בֶּכִי
  choice: en pleurs — en pleurs
  rationale: La répétition du nom hébreu intensifie la lamentation. Cette formulation la maintient sans produire une tournure française excessivement lourde.
- source_word: יַעֲלֶה
  choice: on monte
  rationale: Bien que la forme verbale soit à la troisième personne du masculin singulier, elle peut avoir ici une valeur indéfinie ou collective. « On » préserve cette indétermination.
- source_word: בְּמוֹרַד
  choice: dans la descente
  rationale: Le terme désigne une pente ou une voie descendante et répond intentionnellement à « montée » dans le premier membre.
- source_word: חוֹרֹנַיִם
  choice: Horonaïm
  rationale: Nom de lieu translittéré selon l'usage français.
- source_word: צָרֵי
  choice: angoissé
  rationale: La forme est difficile. Dans ce contexte, elle est comprise comme qualifiant le cri par l'idée de détresse, tout en signalant en note l'analyse possible « les ennemis ».
- source_word: צַעֲקַת
  choice: cri
  rationale: Le mot désigne un appel ou un cri puissant ; « cri » est direct et naturel.
- source_word: שֶׁבֶר
  choice: destruction
  rationale: Dans ce contexte de jugement, le nom évoque la ruine ou l'effondrement causé par le désastre.
- source_word: שָׁמֵעוּ
  choice: ils ont entendu
  rationale: La forme est un accompli à la troisième personne du pluriel. Le passé composé respecte sa morphologie tout en laissant le sujet collectif non précisé, comme en hébreu.
theological_decisions:
- issue: Identité du sujet de « ils ont entendu »
  choice: Le sujet demeure non précisé.
  alternative: 'Comprendre צָרֵי comme le sujet : « les ennemis ont entendu » ou « les ennemis de… ont entendu ».'
  rationale: Le texte hébreu est syntaxiquement difficile ; ne pas identifier explicitement le sujet évite de trancher au-delà de ce que permet le contexte.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme topographique « montée / descente » et la répétition expressive de « en pleurs » sont conservés. Les noms de lieux suivent une translittération française lisible.
