source:
  edition: WLC
  text: הַשְׁכִּירֻ֕/הוּ כִּ֥י עַל יְהוָ֖ה הִגְדִּ֑יל וְ/סָפַ֤ק מוֹאָב֙ בְּ/קִיא֔/וֹ וְ/הָיָ֥ה לִ/שְׂחֹ֖ק גַּם הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/026.yaml
  text: Make him drunk[a], because he has magnified himself against Yahweh; and Moab shall wallow in his vomit, and he too shall become a laughingstock.
translation:
  language: fr
  text: Enivrez-le, car il s’est élevé avec arrogance contre Yahweh. Moab se roulera dans son vomi[a], et lui aussi deviendra un objet de dérision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « battra des mains dans son vomi ». Le verbe hébreu peut évoquer le fait de battre ou de frapper, mais, dans cette scène d’ivresse humiliante, il peut décrire Moab qui se roule ou se débat dans son vomi.'
    reason: Alternative lexicale due à l’ambiguïté de וְסָפַק.
lexical_decisions:
- source_word: הַשְׁכִּירֻהוּ
  choice: Enivrez-le
  rationale: L’impératif pluriel hiphil de שׁכר, avec un suffixe objet masculin singulier, ordonne de rendre Moab ivre. « Enivrez-le » est direct, naturel et conserve l’image du jugement.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’ordre. « Car » convient au registre biblique moderne sans être archaïque.
- source_word: עַל יְהוָה הִגְדִּיל
  choice: il s’est élevé avec arrogance contre Yahweh
  rationale: Avec עַל, le hiphil de גדל exprime ici une prétention orgueilleuse dirigée contre Yahweh. Cette formulation restitue à la fois l’idée de grandeur revendiquée et son caractère hostile.
- source_word: וְסָפַק
  choice: se roulera
  rationale: Dans l’image de l’ivresse et du vomi, le verbe est compris contextuellement comme un mouvement humiliant dans lequel Moab se débat ou se vautre. Son sens plus littéral possible, « battre/frapper », est signalé en note.
- source_word: בְּקִיאוֹ
  choice: dans son vomi
  rationale: La préposition בְּ et le nom קִיא décrivent concrètement l’abaissement de Moab au milieu de son propre vomi.
- source_word: וְהָיָה לִשְׂחֹק
  choice: deviendra un objet de dérision
  rationale: La tournure exprime le fait de devenir la cible des moqueries. « Un objet de dérision » est clair, digne et naturel en français international.
- source_word: גַּם הוּא
  choice: lui aussi
  rationale: Cette expression souligne que Moab, à son tour, connaîtra le ridicule.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom divin personnel sans substituer un titre.
- issue: Nature de l’orgueil de Moab
  choice: s’est élevé avec arrogance contre Yahweh
  alternative: s’est grandi contre Yahweh
  rationale: Le réfléchi explicite l’emploi idiomatique du hiphil de גדל sans réduire l’expression à une simple vantardise; « avec arrogance » rend la valeur négative imposée par le contexte de jugement.
translation_notes:
  register: Français international moderne, clair et digne. L’image crue du texte hébreu est conservée. Le pronom masculin renvoie à Moab, personnifié.
