review_pass:
  verdict: revise
  source_fidelity: 'La première proposition est correctement rendue. Toutefois, וְעָרֶיהָ עָלָה est une construction elliptique et disputée : le projet transforme trop directement le sujet implicite en « un assaillant ». Une tournure impersonnelle (« on est monté contre ses villes ») rend l''interprétation militaire probable sans ajouter un acteur déterminé; l''autre lecture est conservée en note. « À l’abattoir » concrétise indûment טֶבַח comme un lieu d’abattage; « au massacre » restitue mieux le sens de mise à mort violente.'
  naturalness: Le français est globalement clair et solennel. « On est monté contre ses villes » est idiomatique tout en gardant l'ellipse du texte. « Sont descendus au massacre » conserve l'image verbale sans la formulation inutilement concrète et déshumanisante d’« abattoir ».
  terminology: « Moab », « le Roi » et « Yahvé des armées » sont appropriés au français moderne et respectent les choix terminologiques. « Les meilleurs de ses jeunes hommes » rend correctement l'idée d'hommes d'élite. La note traditionnelle doit demeurer une simple indication lexicale, sans présenter une substitution traditionnelle comme le texte traduit.
  issues:
  - severity: medium
    issue: Sujet explicite ajouté dans la proposition concernant les villes
    rationale: Le texte hébreu ne nomme pas « un assaillant ». Cette compréhension militaire est possible, mais le français peut la rendre par l'impersonnel et la note doit présenter sans spéculation l'autre analyse de la syntaxe.
  - severity: medium
    issue: « À l’abattoir » surdétermine לַטָּבַח
    rationale: טֶבַח désigne le massacre ou la tuerie; il ne désigne pas nécessairement un abattoir comme lieu. « Au massacre » est plus fidèle et conserve le registre tragique.
  - severity: low
    issue: Note a spéculative (« parties en fumée »)
    rationale: Cette image n'est pas exprimée par le texte et ne correspond pas à l'alternative signalée dans l'audit anglais. La note doit exposer l'ambiguïté sans lui attribuer une paraphrase imagée.
