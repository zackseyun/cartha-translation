  text: שֻׁדַּ֤ד מוֹאָב֙ וְ/עָרֶ֣י/הָ עָלָ֔ה וּ/מִבְחַ֥ר בַּֽחוּרָ֖י/ו יָרְד֣וּ לַ/טָּ֑בַח נְאֻ֨ם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/015.yaml
  text: Moab is devastated[a], and her cities have gone up; the choicest of her young men have gone down to the slaughter, declares the King[b], whose name is Yahweh of Armies.
translation:
  language: fr
  text: Moab est dévasté, et l’on est monté contre ses villes[a] ; les meilleurs de ses jeunes hommes sont descendus au massacre. Voilà ce que déclare le Roi, lui dont le nom est Yahvé des armées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est concis et difficile. On peut aussi comprendre littéralement : « et ses villes sont montées » ; la tournure peut évoquer une montée à l’attaque contre les villes de Moab.'
    reason: alternative_reading
  - marker: b
    text: 'Traduction française traditionnelle : « le SEIGNEUR des armées » ou « l’Éternel des armées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁדַּד
  choice: est dévasté
  rationale: Le poual de שׁדד décrit Moab comme victime d’une destruction violente ou d’un pillage. « Est dévasté » exprime naturellement le résultat sans limiter le sens au seul pillage.
- source_word: וְעָרֶיהָ עָלָה
  choice: et un assaillant monte contre ses villes
  rationale: 'La tournure hébraïque est très elliptique : le verbe singulier « monte » n’a pas de sujet exprimé. Dans le contexte militaire, il peut évoquer un assaillant qui monte à l’attaque des villes. L’ambiguïté est signalée en note.'
- source_word: מִבְחַר בַּחוּרָיו
  choice: les meilleurs de ses jeunes hommes
  rationale: מִבְחַר désigne ce qui est choisi ou d’élite. Cette formulation française rend clairement la valeur sélective du nom et respecte le pluriel du verbe suivant.
- source_word: יָרְדוּ לַטָּבַח
  choice: sont descendus à l’abattoir
  rationale: « Sont descendus » conserve l’image de mouvement de ירד, tandis que « à l’abattoir » rend la destination funeste exprimée par לַטָּבַח et l’image déshumanisante du texte.
- source_word: נְאֻם
  choice: Voilà ce que déclare
  rationale: Cette formule française naturelle restitue la formule prophétique solennelle נְאֻם tout en reliant clairement la déclaration à ce qui précède.
- source_word: הַמֶּלֶךְ
  choice: le Roi
  rationale: Dans ce contexte, le mot est un titre divin, précisé par le nom et l’appellation qui suivent ; la majuscule signale cette fonction titulaire.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française courante « Yahvé » représente le nom divin יהוה au lieu de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: « Armées » rend le sens martial et éventuellement cosmique de צְבָאוֹת dans un français moderne, contrairement à l’archaïque « puissances » ou au traditionnel « armées célestes », qui préciserait excessivement.
- source_word: שְׁמוֹ
  choice: lui dont le nom est
  rationale: Cette tournure idiomatique conserve la proposition nominale qui identifie le Roi par son nom.
theological_decisions:
- issue: Rendu du nom divin יהוה dans le titre יהוה צבאות
  choice: Yahvé des armées
  alternative: le SEIGNEUR des armées
  rationale: Le texte porte directement le tétragramme, nom propre du Dieu d’Israël. « Yahvé » le représente comme nom plutôt que de le remplacer par le titre « SEIGNEUR ».
- issue: Identification de הַמֶּלֶךְ
  choice: le Roi
  alternative: le roi
  rationale: Le contexte identifie ce Roi à Yahvé des armées. La majuscule française marque la valeur de titre divin sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, sobre et solennel. Le rythme prophétique est conservé, tandis que les constructions hébraïques les plus elliptiques sont rendues intelligibles sans dissimuler leur incertitude.
