revisions:
- from: Moab est dévasté, et un assaillant monte contre ses villes[a] ; les meilleurs de ses jeunes hommes sont descendus à l’abattoir. Voilà ce que déclare le Roi, lui dont le nom est Yahvé des armées[b].
  to: Moab est dévasté, et l’on est monté contre ses villes[a] ; les meilleurs de ses jeunes hommes sont descendus au massacre. Voilà ce que déclare le Roi, lui dont le nom est Yahvé des armées[b].
  rationale: La révision évite d’identifier comme tel l’acteur absent de la clause hébraïque, conserve en note l’autre lecture syntaxique sans y ajouter l’image des villes « parties en fumée », et remplace « abattoir » par « massacre », qui correspond plus directement au champ sémantique de טֶבַח. Le reste du texte est maintenu.
