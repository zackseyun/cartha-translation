  text: Flee! Escape with your lives[b][a], and be like a juniper in the wilderness.
translation:
  language: fr
  text: Fuyez ! Sauvez vos vies et soyez comme un arbuste[a] dans le désert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’espèce végétale désignée par le mot hébreu est incertaine ; il pourrait s’agir notamment d’un genévrier ou d’un tamaris.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme Aroër dans le désert ». Le mot hébreu peut être compris soit comme un nom de lieu, soit comme le nom d’un arbuste du désert.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֻסוּ
  choice: Fuyez !
  rationale: Impératif pluriel direct et urgent de נוס ; « Fuyez ! » est naturel, bref et fidèle.
- source_word: מַלְּטוּ נַפְשְׁכֶם
  choice: Sauvez votre vie
  rationale: Dans ce contexte de fuite, נֶפֶשׁ désigne la vie ou la personne elle-même. Cette formulation exprime naturellement l’idée d’échapper à la mort.
- source_word: וְתִהְיֶינָה
  choice: et soyez
  rationale: L’imparfait, à valeur injonctive après les impératifs, poursuit naturellement la série de commandements.
- source_word: כַּעֲרוֹעֵר
  choice: comme un arbuste
  rationale: עֲרוֹעֵר peut désigner ici une plante désertique, mais son espèce exacte est incertaine. Le terme générique « arbuste » évite une précision botanique injustifiée.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » rend clairement מִדְבָּר dans cette image d’une plante isolée en milieu aride.
