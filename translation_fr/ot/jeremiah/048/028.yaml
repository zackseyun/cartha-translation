  to: Quittez les villes et demeurez dans le roc, habitants de Moab ! Soyez comme une colombe qui fait son nid sur les bords de l’ouverture d’une fosse[a].
  rationale: La révision améliore l’idiomaticité de l’expression désignant l’abri rocheux et remplace une précision architecturale non exprimée par l’hébreu par « les bords », qui rend plus sobrement la relation spatiale. La note et son ancre sont conservées, car elles signalent utilement l’alternative lexicale pour פַּחַת.
