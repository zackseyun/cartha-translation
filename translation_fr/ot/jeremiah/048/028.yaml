review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement les deux impératifs, l’apostrophe aux habitants de Moab, l’image de la colombe et la possible nuance de piège de פַּחַת. Toutefois, « parois bordant l’ouverture » interprète les « côtés/bords » (בְּעֶבְרֵי) comme des parois de façon trop concrète et ajoute l’idée de « bordant ». « Bords de l’ouverture » conserve plus directement l’ambiguïté spatiale de l’hébreu.
  naturalness: « Habitez dans le rocher » est compréhensible mais peu idiomatique en français actuel. « Demeurez dans le roc » est à la fois plus naturel dans un registre prophétique sobre et apte à évoquer l’abri rocheux singulier du texte. « Sur les bords de l’ouverture d’une fosse » est plus fluide que « sur les parois bordant l’ouverture d’une fosse ».
  terminology: « Roc » rend bien סֶלַע dans ce contexte. « Colombe », « ouverture » et « fosse » sont appropriés. La note conserve à juste titre la possibilité d’une « fosse-piège », sans imposer cette lecture au texte principal.
  issues:
  - severity: medium
    issue: « sur les parois bordant l’ouverture » est interprétatif
    rationale: בְּעֶבְרֵי désigne les côtés, bords ou abords ; le mot ne spécifie pas des parois, ni l’action de border. Une formulation moins déterminée préserve mieux l’image et l’incertitude spatiale.
  - severity: low
    issue: « habitez dans le rocher » est raide en français moderne
    rationale: La fidélité au singulier de סֶלַע peut être gardée avec « demeurez dans le roc », formulation plus naturelle et de registre prophétique convenable.
  revised_text: Quittez les villes et demeurez dans le roc, habitants de Moab ! Soyez comme une colombe qui fait son nid sur les bords de l’ouverture d’une fosse[a].
  revised_footnotes:
