base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/028.yaml
  text: Leave the cities and dwell in the rock[a], inhabitants of Moab, and be like a dove that nests on the sides of the mouth of a pit.
translation:
  language: fr
  text: Quittez les villes et demeurez dans le roc, habitants de Moab ! Soyez comme une colombe qui fait son nid sur les bords de l’ouverture d’une fosse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une fosse servant de piège » ; le mot hébreu peut désigner une fosse-piège, ce qui accentue le caractère précaire du refuge.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִזְבוּ עָרִים
  choice: Quittez les villes
  rationale: L’impératif pluriel appelle les habitants de Moab à partir de leurs centres urbains. « Quittez » garde la force du commandement sans ajouter l’intensité affective d’« abandonnez ».
- source_word: וְשִׁכְנוּ בַּסֶּלַע
  choice: et habitez dans le rocher
  rationale: שׁכן signifie demeurer ou habiter, et סלע désigne un rocher ou un escarpement rocheux. La formulation conserve le singulier et l’image concrète du refuge dans la roche.
- source_word: יֹשְׁבֵי מוֹאָב
  choice: habitants de Moab
  rationale: Le groupe fonctionne comme une apostrophe désignant ceux auxquels les impératifs sont adressés.
- source_word: וִהְיוּ כְיוֹנָה
  choice: Soyez comme une colombe
  rationale: La formulation rend directement l’impératif et la comparaison, dans un français naturel et digne.
- source_word: תְּקַנֵּן
  choice: qui fait son nid
  rationale: Le verbe au féminin singulier s’accorde avec « colombe » et décrit l’action de nicher ; « fait son nid » est courant et précis.
- source_word: בְּעֶבְרֵי פִי פָחַת
  choice: sur les parois bordant l’ouverture d’une fosse
  rationale: עברי évoque les côtés ou les flancs, פי signifie littéralement « bouche » et désigne ici l’ouverture, tandis que פחת désigne une fosse, avec une possible nuance de piège. Cette formulation restitue l’image spatiale sans produire une expression française obscure.
theological_decisions: []
