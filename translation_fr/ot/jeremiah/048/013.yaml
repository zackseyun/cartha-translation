reference: Jeremiah 48:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בֹ֥שׁ מוֹאָ֖ב מִ/כְּמ֑וֹשׁ כַּ/אֲשֶׁר בֹּ֨שׁוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל מִ/בֵּ֥ית אֵ֖ל מִבְטֶחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/013.yaml
  text: And Moab will be put to shame because of Chemosh[a], just as the house of Israel was put to shame because of Bethel[b], their confidence.
translation:
  language: fr
  text: Moab aura honte de Kemosh[a], comme la maison d’Israël a eu honte de Béthel, son objet de confiance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sera couvert de honte à cause de Kemosh ». Plus littéralement, l’hébreu peut se rendre par « aura honte de Kemosh ». Dans le contexte, la honte est liée à la confiance de Moab en Kemosh, qui aboutit au déshonneur.'
    reason: lexical_alternative
  - marker: b
    text: 'Béthel était un sanctuaire du royaume du Nord associé au culte des veaux. Plus littéralement : « de Béthel, leur confiance »; Béthel était ce en quoi la maison d’Israël plaçait sa confiance.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבֹשׁ
  choice: sera couvert de honte
  rationale: Le verbe בוש exprime ici l’aboutissement à la honte et au déshonneur. Cette tournure française fait ressortir l’humiliation résultant du jugement, sans la réduire à un sentiment intérieur.
- source_word: מוֹאָב
  choice: Moab
  rationale: Forme française usuelle du nom du peuple et du territoire.
- source_word: מִכְּמוֹשׁ
  choice: à cause de Kemosh
  rationale: Après בוש, מן peut désigner ce par rapport à quoi ou ce à cause de quoi la honte survient. La formulation garde le lien entre la confiance de Moab en Kemosh et son déshonneur.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Introduit naturellement la comparaison entre la honte future de Moab et celle déjà éprouvée par Israël.
- source_word: בֹּשׁוּ
  choice: a été couverte de honte
  rationale: Reprend le même champ lexical que le premier verbe et convient au sujet collectif féminin « la maison d’Israël ».
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Conserve la désignation collective hébraïque et sa portée nationale et relationnelle.
- source_word: מִבֵּית אֵל
  choice: à cause de Béthel
  rationale: Béthel désigne ici le sanctuaire du royaume du Nord auquel Israël s’était confié, et non la locution commune « maison de Dieu ».
- source_word: מִבְטָחָם
  choice: en qui elle mettait sa confiance
  rationale: Le nom désigne ici l’objet de la confiance. L’explicitation idiomatique rattache clairement ce complément à Béthel tout en conservant l’ironie de cette confiance déçue.
theological_decisions:
- issue: Référent de Béthel
  choice: Béthel est compris comme le centre cultuel du royaume du Nord dans lequel Israël mettait sa confiance.
  alternative: Traduire littéralement le nom par « maison de Dieu » comme une locution commune.
  rationale: Le parallèle oppose la confiance de Moab en Kemosh à celle d’Israël dans le sanctuaire de Béthel. La traduction du nom par « maison de Dieu » masquerait l’allusion historique et pourrait suggérer à tort qu’il s’agit ici de la confiance dans le vrai Dieu.
- issue: Nature de la honte liée à Kemosh
  choice: La honte est présentée comme survenant à cause de Kemosh, objet de la confiance de Moab.
  alternative: « Moab aura honte de Kemosh », formulation pouvant davantage évoquer un sentiment subjectif envers la divinité.
  rationale: L’hébreu permet plusieurs nuances avec מן après בוש. Le contexte de jugement et le parallèle avec Béthel favorisent l’idée d’une confiance qui aboutit au déshonneur, sans exclure entièrement la nuance d’avoir honte de l’objet défaillant.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « couvert de honte » préserve le parallélisme hébreu. « En qui elle mettait sa confiance » rend idiomatiquement l’apposition finale tout en gardant Béthel comme objet de confiance.
