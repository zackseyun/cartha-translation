review_pass:
  verdict: revise
  source_fidelity: La relation marquée par מִן après בוש est susceptible de plusieurs rendus (« avoir honte de », « être honteux à cause de/de la part de »). Le texte courant « à cause de » est défendable dans le contexte, mais le rendu direct « avoir honte de » préserve mieux cette latitude sans expliciter la causalité. L’apposition finale désigne Béthel comme ce en quoi Israël plaçait sa confiance.
  naturalness: « Moab aura honte de Kemosh » et « la maison d’Israël a eu honte de Béthel » sont idiomatiques en français moderne et maintiennent le parallélisme verbal. « Son objet de confiance » est une apposition naturelle; le singulier reprend grammaticalement le collectif « la maison d’Israël ».
  terminology: Moab, Kemosh, la maison d’Israël et Béthel sont correctement rendus. La note sur Béthel conserve à juste titre l’identification avec le sanctuaire du royaume du Nord sans transformer le nom propre en « maison de Dieu ».
