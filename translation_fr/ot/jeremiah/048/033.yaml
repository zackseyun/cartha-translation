  text: וְ/נֶאֶסְפָ֨ה שִׂמְחָ֥ה וָ/גִ֛יל מִ/כַּרְמֶ֖ל וּ/מֵ/אֶ֣רֶץ מוֹאָ֑ב וְ/יַ֨יִן֙ מִ/יקָבִ֣ים הִשְׁבַּ֔תִּי לֹֽא יִדְרֹ֣ךְ הֵידָ֔ד הֵידָ֖ד לֹ֥א הֵידָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/033.yaml
  text: Joy and gladness have been gathered from the orchard land and from the land of Moab[a]; I have made wine cease from the winepresses. No one will tread with a shout[c][b]; the shout is no shout.
translation:
  language: fr
  text: 'La joie et l’allégresse ont été ôtées des terres cultivées et du pays de Moab[a]. J’ai fait cesser le vin de couler des pressoirs. Personne ne foulera plus les raisins en poussant des cris[b] : le cri des vendanges ne sera pas un cri de joie[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du champ fertile ». Le mot hébreu désigne ici une terre fertile et cultivée, non le mont Carmel.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne le cri poussé lors du foulage des raisins ou des vendanges; il est normalement associé à la réjouissance.
    reason: cultural_note
  - marker: c
    text: 'L’hébreu répète de façon elliptique le mot « cri » : littéralement, « cri, cri — pas un cri ». Il oppose le cri attendu des vendanges à un cri qui n’est pas joyeux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֶסְפָה
  choice: ont disparu
  rationale: Le niphal de אסף peut exprimer le retrait ou la disparition. En français, « ont disparu » communique naturellement qu’on ne trouve plus la joie et l’allégresse dans les lieux mentionnés.
- source_word: שִׂמְחָה וָגִיל
  choice: la joie et l’allégresse
  rationale: Ces quasi-synonymes décrivent ensemble la joie festive; « allégresse » conserve la nuance d’exultation de גיל tout en restant digne et intelligible.
- source_word: כַּרְמֶל
  choice: les terres cultivées
  rationale: Ici, כרמל est un nom commun désignant une terre fertile et cultivée, et non le nom propre Carmel. Le pluriel collectif est idiomatique en français.
- source_word: אֶרֶץ מוֹאָב
  choice: le pays de Moab
  rationale: Cette formulation rend explicitement אֶרֶץ et exprime naturellement l’étendue géographique visée.
- source_word: יַיִן מִיקָבִים הִשְׁבַּתִּי
  choice: J’ai fait cesser le vin dans les pressoirs
  rationale: La tournure conserve le causatif de שבת et la première personne du discours divin. « Pressoirs » rend l’installation de production indiquée par יְקָבִים.
- source_word: יִדְרֹךְ
  choice: foulera plus les raisins
  rationale: Dans le contexte des pressoirs, דרך désigne le foulage des raisins. L’objet implicite est explicité en français pour éviter une formulation obscure.
- source_word: הֵידָד
  choice: cri de joie
  rationale: Le mot désigne ici le cri poussé pendant les vendanges ou le foulage. « Cri de joie » exprime dans le texte la valeur festive que le contexte exige.
- source_word: הֵידָד הֵידָד לֹא הֵידָד
  choice: le cri ne sera plus un cri de joie
  rationale: 'Cette formulation garde le contraste paradoxal de l’hébreu tout en le rendant compréhensible : tout cri qui subsisterait ne serait pas l’acclamation joyeuse attendue des vendanges.'
theological_decisions:
- issue: Identité du locuteur à la première personne dans הִשְׁבַּתִּי
  choice: Conserver « J’ai », compris dans le contexte comme la parole du Seigneur au sein de l’oracle.
  alternative: Attribuer la première personne au prophète ou à un narrateur non identifié.
  rationale: Le contexte de l’oracle de jugement soutient un locuteur divin, mais le verset n’ajoute aucun titre; la traduction préserve donc simplement la première personne sans explicitation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La traduction privilégie la clarté sans effacer la répétition rhétorique finale. « Terres cultivées » évite de prendre כרמל pour le nom propre Carmel; « foulera les raisins » explicite l’objet sous-entendu par le contexte viticole.
