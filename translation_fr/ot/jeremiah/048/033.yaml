revisions:
- from: 'La joie et l’allégresse ont disparu des terres cultivées et du pays de Moab[a]. J’ai fait cesser le vin dans les pressoirs. Personne ne foulera plus les raisins au cri de joie[b] : le cri ne sera plus un cri de joie[c].'
  to: 'La joie et l’allégresse ont été ôtées des terres cultivées et du pays de Moab[a]. J’ai fait cesser le vin de couler des pressoirs. Personne ne foulera plus les raisins en poussant des cris[b] : le cri des vendanges ne sera pas un cri de joie[c].'
  rationale: La révision rend plus idiomatique et plus exacte la cessation du vin provenant des pressoirs. Elle conserve la première personne, le langage agricole et le caractère elliptique de la clausule finale, tout en expliquant dans les notes l’association contextuelle du cri avec les vendanges. Aucun point doctrinal n’est ajouté.
