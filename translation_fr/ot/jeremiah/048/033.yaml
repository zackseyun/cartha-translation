    issue: Formulation française imprécise de « J’ai fait cesser le vin dans les pressoirs ».
    rationale: Le texte hébreu dit littéralement que le locuteur a fait cesser le vin « des pressoirs ». En français, on ne fait pas naturellement « cesser le vin dans » un pressoir; le vin cesse plutôt d’en couler.
  - severity: low
    issue: La note a propose « verger fertile » comme alternative principale.
    rationale: כַּרְמֶל désigne un terroir/une terre fertile cultivée; « verger » est possible dans certains contextes, mais est plus étroit que le sens lexical et n’est pas imposé par le verset.
  - severity: low
    issue: La répétition contrastive de הֵידָד est mieux représentée en identifiant le cri de vendange dans la seconde occurrence.
    rationale: Le texte ne précise pas grammaticalement « de joie », mais le contexte et l’ellipse opposent le cri attendu au pressoir à un cri qui n’est pas le cri festif attendu. Cette explicitation limitée est soutenue par le contexte et expliquée en note.
