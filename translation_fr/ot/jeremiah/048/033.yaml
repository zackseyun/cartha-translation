  verdict: revise
  source_fidelity: 'Révision nécessaire surtout pour la formulation de la cessation du vin : « faire cesser le vin dans les pressoirs » est peu idiomatique et rend imprécis le complément מן (« des pressoirs »). La reprise finale doit aussi mieux laisser entendre l’opposition rhétorique entre le cri des vendanges et un cri qui n’est plus joyeux.'
  naturalness: « J’ai fait cesser le vin dans les pressoirs » est maladroit en français moderne. « J’ai fait cesser le vin de couler des pressoirs » est naturel et explicite sans ajout substantiel. La formule finale révisée est plus lisible tout en conservant le paradoxe hébreu.
  terminology: « Joie et allégresse », « pays de Moab », « pressoirs » et « fouler les raisins » conviennent. Pour כַּרְמֶל, « terres cultivées » est recevable; la note doit éviter de restreindre indûment le terme à un verger.
  issues:
