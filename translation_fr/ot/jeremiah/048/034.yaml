review_pass:
  verdict: revise
  source_fidelity: Le sens général et la chaîne géographique sont bien rendus. Toutefois, « des lieux dévastés » explicite indûment le nom abstrait pluriel מְשַׁמּוֹת (« désolations ») et transforme les « eaux » en « lieux ». La seconde série de toponymes doit aussi être rattachée plus clairement à l’énoncé elliptique du cri/voix.
  naturalness: Le français est globalement digne et actuel, mais la phrase finale « Depuis Tsoar jusqu’à Horonaïm, jusqu’à Églath-Shelishiya » demeure un fragment difficile à lire après un point-virgule. Une ellipse poétique peut être conservée tout en la rattachant explicitement à « leur voix ».
  terminology: Les termes « cri », « élèvent la voix », « eaux » et « deviendront » sont appropriés. « Désolations », bien que plus littéral et un peu soutenu, rend mieux le pluriel abstrait hébreu sans ajouter « lieux ». Les graphies Soar, Éléalé, Yahats et Horonaïm sont plus usuelles et lisibles en français biblique moderne; Églath-Shelishiya reste une translittération prudente, assortie de la note nécessaire.
  issues:
  - severity: medium
    issue: « des lieux dévastés » ajoute « lieux » et modifie l’image des eaux de Nimrim.
    rationale: Le texte hébreu dit littéralement qu’elles « deviendront des désolations »; il ne désigne pas explicitement des lieux. La formulation ajoutée peut faire croire que les eaux deviennent des sites géographiques.
  - severity: low
    issue: La deuxième succession de localités est syntaxiquement trop détachée.
    rationale: L’hébreu emploie une ellipse poétique, mais en français le fragment après le point-virgule gagne à être rattaché à « leur voix », sans fournir un verbe absent du texte.
  - severity: low
    issue: Certaines graphies de noms sont moins conventionnelles en français.
    rationale: « Soar », « Éléalé » et « Yahats » assurent une présentation plus cohérente avec l’usage biblique français, sans enjeu de sens.
  revised_text: Du cri de Heshbon jusqu’à Éléalé, jusqu’à Yahats, ils élèvent la voix ; de Soar à Horonaïm, jusqu’à Églath-Shelishiya, leur voix s’élève. Car même les eaux de Nimrim deviendront des désolations.
  revised_footnotes:
