revisions:
- from: Depuis Heshbon, le cri retentit jusqu’à Éléalé ; jusqu’à Yahats, ils élèvent la voix. Depuis Tsoar jusqu’à Horonaïm, jusqu’à Églath-Shelishiya[a]. Car même les eaux de Nimrim deviendront des lieux dévastés.
  to: Du cri de Heshbon jusqu’à Éléalé, jusqu’à Yahats, ils élèvent la voix ; de Soar à Horonaïm, jusqu’à Églath-Shelishiya, leur voix s’élève. Car même les eaux de Nimrim deviendront des désolations.
  rationale: La révision conserve le mouvement géographique, le pluriel actif de « ils élèvent la voix » et l’ellipse poétique de la seconde série de lieux, tout en la rendant intelligible en français par « leur voix s’élève ». Elle retire l’ajout interprétatif « lieux » et rend מְשַׁמּוֹת par « désolations ». La note maintient l’alternative lexicale pour Églath-Shelishiya.
