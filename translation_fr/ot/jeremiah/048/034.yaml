  text: מִ/זַּעֲקַ֨ת חֶשְׁבּ֜וֹן עַד אֶלְעָלֵ֗ה עַד יַ֨הַץ֙ נָתְנ֣וּ קוֹלָ֔/ם מִ/צֹּ֨עַר֙ עַד חֹ֣רֹנַ֔יִם עֶגְלַ֖ת שְׁלִֽשִׁיָּ֑ה כִּ֚י גַּם מֵ֣י נִמְרִ֔ים לִ/מְשַׁמּ֖וֹת יִהְיֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/034.yaml
  text: From the cry of Heshbon to Elealeh[a], as far as Jahaz, they raise their voice; from Zoar to Horonaim, to Eglath-shelishiyah. For even the waters of Nimrim will become desolations.
translation:
  language: fr
  text: Du cri de Heshbon jusqu’à Éléalé, jusqu’à Yahats, ils élèvent la voix ; de Soar à Horonaïm, jusqu’à Églath-Shelishiya, leur voix s’élève. Car même les eaux de Nimrim deviendront des désolations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזַּעֲקַת חֶשְׁבּוֹן
  choice: Depuis Heshbon, le cri retentit
  rationale: זַעֲקָה désigne un cri de détresse. Cette formulation française naturelle exprime son point de départ géographique sans alourdir le vers par le calque « depuis le cri de Heshbon ».
- source_word: עַד
  choice: jusqu’à
  rationale: La répétition de עַד trace l’étendue géographique du cri et se rend directement par « jusqu’à ».
- source_word: נָתְנוּ קוֹלָם
  choice: ils élèvent la voix
  rationale: L’expression signifie littéralement « ils donnent leur voix » ; « ils élèvent la voix » en conserve le caractère actif et idiomatique.
- source_word: מִצֹּעַר
  choice: Depuis Tsoar
  rationale: La préposition מִן ouvre un second parcours géographique ; « depuis » préserve ce mouvement spatial.
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  choice: Églath-Shelishiya
  rationale: Dans cette suite de localités, l’expression est probablement un nom de lieu. La translittération maintient toutefois l’incertitude lexicale, signalée en note.
- source_word: כִּי גַּם
  choice: Car même
  rationale: כִּי introduit ici l’explication, tandis que גַּם ajoute une insistance ; « Car même » rend les deux valeurs.
- source_word: מֵי נִמְרִים
  choice: les eaux de Nimrim
  rationale: Le groupe construit désigne simplement les eaux associées au lieu appelé Nimrim.
- source_word: לִמְשַׁמּוֹת יִהְיוּ
  choice: deviendront des lieux dévastés
  rationale: Avec לְ et un nom de résultat, היה exprime le devenir. « Des lieux dévastés » conserve le pluriel hébreu tout en restant intelligible en français.
