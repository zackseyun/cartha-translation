  text: The disaster of Moab is near to come[b][a], and his calamity is hurrying very quickly.
translation:
  language: fr
  text: Le désastre de Moab est sur le point d’arriver, et son malheur se précipite à toute vitesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרוֹב
  choice: est sur le point de
  rationale: Dans la construction קָרוֹב ... לָבוֹא, l’adjectif prédicatif exprime l’imminence; cette tournure est naturelle en français moderne.
- source_word: אֵיד
  choice: désastre
  rationale: Le terme désigne une ruine ou une catastrophe destructrice; « désastre » convient au contexte de jugement prophétique.
- source_word: מוֹאָב
  choice: Moab
  rationale: Forme française conventionnelle du nom du pays et du peuple.
- source_word: לָבוֹא
  choice: arriver
  rationale: L’infinitif avec ל complète l’expression d’imminence. « Arriver » rend ici la venue prochaine du désastre sans lourdeur.
- source_word: רָעָתוֹ
  choice: son malheur
  rationale: Dans ce contexte, רָעָה désigne le sort funeste ou la calamité, non le mal moral. Le possessif français « son » conserve sans difficulté la référence à Moab.
- source_word: מִהֲרָה
  choice: se précipite
  rationale: Le verbe exprime la hâte ou la rapidité. « Se précipite » préserve l’image dynamique et la personnification du malheur.
- source_word: מְאֹד
  choice: à toute vitesse
  rationale: L’intensif renforce fortement l’idée de hâte; cette expression restitue l’emphase dans un français actuel.
