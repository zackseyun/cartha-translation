  text: רְדִ֤י מִ/כָּבוֹד֙ ישבי בַ/צָּמָ֔א יֹשֶׁ֖בֶת בַּת דִּיב֑וֹן כִּֽי שֹׁדֵ֤ד מוֹאָב֙ עָ֣לָה בָ֔/ךְ שִׁחֵ֖ת מִבְצָרָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/018.yaml
  text: Come down from your glory and sit in thirst[a], O inhabitant, daughter of Dibon, for the destroyer of Moab has come up against you[b]; he has destroyed your fortresses.
translation:
  language: fr
  text: Descends de ta gloire et assieds-toi dans la soif[a], ô habitante, fille de Dibôn[b] ! Car le dévastateur de Moab est monté contre toi ; il a détruit tes forteresses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « assieds-toi sur une terre desséchée ». L’hébreu peut évoquer soit la soif elle-même, soit le lieu aride auquel Dibôn est réduite.'
    reason: lexical_alternative
  - marker: b
    text: « Fille de Dibôn » est une personnification prophétique de la ville et de sa population sous les traits d’une femme.
    reason: cultural_note
lexical_decisions:
- source_word: רְדִי מִכָּבוֹד
  choice: Descends de ta gloire
  rationale: L’impératif féminin singulier s’adresse à la ville personnifiée. « Gloire » conserve la portée de כָּבוֹד, qui évoque ici sa grandeur et sa situation élevée.
- source_word: ישבי בַצָּמָא
  choice: assieds-toi sur une terre desséchée, toi qui habites là
  rationale: La vocalisation transmise associe un impératif féminin, « assieds-toi », à une forme participiale féminine, « toi qui habites ». צָמָא peut désigner la soif ou un lieu aride ; la traduction retient ici la valeur géographique tout en signalant l’autre possibilité en note.
- source_word: בַּת דִּיבוֹן
  choice: fille de Dibôn
  rationale: La formule prophétique personnifie Dibôn et ses habitants sous les traits d’une femme ; sa forme imagée est conservée.
- source_word: שֹׁדֵד מוֹאָב
  choice: le dévastateur de Moab
  rationale: שֹׁדֵד désigne celui qui ravage ou pille. « Dévastateur » convient au contexte militaire et évite d’anticiper exactement le verbe suivant.
- source_word: עָלָה בָךְ
  choice: monte contre toi
  rationale: La traduction préserve le mouvement exprimé par עלה ainsi que sa valeur militaire en contexte, plutôt que de réduire l’expression à « t’attaque ».
- source_word: שִׁחֵת מִבְצָרָיִךְ
  choice: il détruit tes forteresses
  rationale: שׁחת exprime ici la destruction ou la ruine, et מִבְצָר désigne une place fortifiée. Le présent français donne à l’annonce prophétique sa force immédiate.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’apostrophe poétique et la personnification de la ville sont maintenues. Le redoublement de ישבי / יֹשֶׁבֶת est rendu sans lourdeur excessive, et l’ambiguïté de בַצָּמָא est conservée par une note.
