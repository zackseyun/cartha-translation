id: JER.48.21
reference: Jeremiah 48:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מִשְׁפָּ֥ט בָּ֖א אֶל אֶ֣רֶץ הַ/מִּישֹׁ֑ר אֶל חֹל֥וֹן וְ/אֶל יַ֖הְצָ/ה וְ/עַל מופעת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/021.yaml
  text: And judgment has come upon the land of the plateau—upon Holon[a], and upon Jahzah[b], and upon Mephaath—
translation:
  language: fr
  text: 'Le jugement est venu sur le pays du plateau[a] : sur Holôn, sur Yahats[b] et sur Méphaath.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays de la plaine » ou « le haut plateau ». Le terme hébreu désigne une région élevée au relief plat.
    reason: lexical_alternative
  - marker: b
    text: Le nom Yahats est aussi transcrit « Yahas » ou « Yahtsa » dans certaines traductions.
    reason: alternative_transliteration
lexical_decisions:
- source_word: וּמִשְׁפָּט
  choice: Le jugement
  rationale: Dans cet oracle contre Moab, מִשְׁפָּט désigne moins la justice comme principe abstrait que la sentence mise à exécution. « Le jugement » conserve la portée judiciaire sans préciser indûment la forme du châtiment.
- source_word: בָּא
  choice: est venu
  rationale: L’accompli hébreu présente le jugement comme déjà survenu ou comme certain au point d’être décrit comme accompli. « Est venu » garde cette force prophétique vive.
- source_word: אֶל אֶרֶץ הַמִּישֹׁר
  choice: sur le pays du plateau
  rationale: מִישֹׁר désigne ici une région élevée et relativement plane, le plateau transjordanien. Après בוא, אֶל se rend naturellement par « sur » lorsqu’un jugement atteint un territoire.
- source_word: חֹלֹון
  choice: Holôn
  rationale: Nom de lieu translittéré sous une forme naturelle en français, avec l’accent circonflexe indiquant la voyelle longue traditionnelle.
- source_word: יַהְצָה
  choice: Yahats
  rationale: Translittération française usuelle du nom de cette ville, qui représente les consonnes hébraïques tout en restant lisible.
- source_word: מופעת
  choice: Méphaath
  rationale: Nom de lieu rendu selon sa forme française biblique conventionnelle.
- source_word: וְעַל
  choice: et sur
  rationale: Dans l’énumération, עַל reprend l’idée du jugement qui s’abat sur chaque localité; « et sur » maintient la cadence sans exagérer la nuance hostile.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et solennel. La structure avec deux-points rend clairement l’énumération des villes touchées, tandis que le passé composé conserve l’effet d’un jugement annoncé comme déjà accompli.
