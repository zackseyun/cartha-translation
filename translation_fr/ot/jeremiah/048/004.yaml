source:
  edition: WLC
  text: נִשְׁבְּרָ֖ה מוֹאָ֑ב הִשְׁמִ֥יעוּ זְּעָקָ֖ה צעורי/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/004.yaml
  text: Moab is shattered; her little ones have made a cry heard.
translation:
  language: fr
  text: Moab est brisé ; ses petits ont fait entendre un cri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu peut aussi être compris, avec une autre vocalisation et une autre division de la phrase : « Faites entendre un cri jusqu’à Tsoar. »'
    reason: Une lecture ancienne et plusieurs traductions rattachent les consonnes finales à Tsoar plutôt qu’à « ses petits » ; cette possibilité textuelle mérite d’être signalée sans remplacer la lecture massorétique.
lexical_decisions:
- source_word: נִשְׁבְּרָה
  choice: est brisé
  rationale: Le nifal exprime ici l’effondrement ou la destruction de Moab. « Est brisé » conserve l’image forte de la racine שׁבר sans préciser davantage la nature du désastre.
- source_word: צְעִירֶיהָ
  choice: ses petits
  rationale: Le terme désigne littéralement ceux de Moab qui sont petits ou jeunes. « Ses petits » reste naturel en français et préserve la possibilité qu’il s’agisse des enfants ou, plus largement, des plus faibles.
- source_word: הִשְׁמִיעוּ זְעָקָה
  choice: ont fait entendre un cri
  rationale: Cette formulation reproduit la valeur causative du hifil de שׁמע et garde זְעָקָה au singulier, conformément au texte massorétique.
theological_decisions:
- issue: Personnification de Moab et identité de « ses petits »
  choice: Conserver « ses petits » sans les identifier plus précisément
  alternative: « ses enfants » ou une lecture faisant référence à Tsoar
  rationale: Le texte présente Moab comme une entité collective féminine, mais le référent exact des « petits » demeure ouvert. La traduction évite de résoudre cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. La structure brève et frappante de l’hébreu est conservée, ainsi que le singulier « un cri ».
