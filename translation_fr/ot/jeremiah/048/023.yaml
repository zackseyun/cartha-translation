lexical_decisions:
- source_word: וְעַל
  choice: et contre
  rationale: Dans le contexte de l’oracle de jugement, עַל exprime la direction hostile de la parole contre chaque ville. La répétition de « et contre » reproduit la cadence insistante de l’hébreu.
- source_word: קִרְיָתַיִם
  choice: Qiryataïm
  rationale: Nom de lieu translittéré selon une forme française reconnaissable ; malgré son apparence morphologique de duel, il fonctionne ici comme un toponyme.
- source_word: בֵּית גָּמוּל
  choice: Beth-Gamoul
  rationale: Toponyme composé translittéré plutôt que traduit ; « Gamoul » rend naturellement la vocalisation hébraïque en français.
- source_word: בֵּית מְעוֹן
  choice: Beth-Méon
  rationale: Toponyme composé translittéré plutôt que traduit, dans une graphie française claire et usuelle.
