  verdict: revise
  source_fidelity: Le texte principal rend correctement la formule causative (« Je ferai disparaître »), le singulier représentatif des deux participes, le haut lieu cultuel et le destinataire singulier « son dieu ». « De Moab » est défendable en français avec « faire disparaître », tout en exprimant l’élimination de cette pratique ou de ses pratiquants du pays. La note actuelle, en revanche, introduit indûment un pluriel (« les hauts lieux », « les offrandes ») et présente une reformulation qui ne correspond pas nettement à la construction singulière du texte hébreu.
  naturalness: La phrase principale est naturelle, solennelle et compréhensible en français moderne. L’incise « déclaration de Yahweh » convient au registre prophétique. La note doit être resserrée afin de ne pas créer une alternative française maladroite ni élargir le sens par des pluriels non motivés.
  terminology: « Yahweh », « haut lieu », « brûler de l’encens » et « son dieu » sont des choix appropriés. Le verbe מקטיר peut viser l’encens ou plus largement une offrande dont on fait monter la fumée; cette réserve peut être signalée sans transformer le texte en « offrandes consumées ».
  issues:
