  text: וְ/הִשְׁבַּתִּ֥י לְ/מוֹאָ֖ב נְאֻם יְהוָ֑ה מַעֲלֶ֣ה בָמָ֔ה וּ/מַקְטִ֖יר לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/035.yaml
  text: And I will put an end in Moab—oracle of Yahweh—to the one who goes up to the high place and burns incense to his god[a].
translation:
  language: fr
  text: Je ferai disparaître de Moab — déclaration de Yahweh — celui qui monte au haut lieu et qui brûle de l’encens pour son dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Je ferai cesser en Moab le culte rendu sur le haut lieu et à son dieu. » L’hébreu emploie deux participes au masculin singulier (« celui qui monte […] et qui fait fumer »), qui peuvent désigner collectivement les adorateurs. Le second verbe peut évoquer l’encens ou, plus largement, une offrande que l’on fait fumer.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: Je ferai disparaître
  rationale: Le hiphil de שׁבת exprime ici l’action causative de faire cesser. Cette formulation française s’applique naturellement à la personne désignée par les participes, tout en gardant l’idée de mettre fin à son activité.
- source_word: לְמוֹאָב
  choice: de Moab
  rationale: Dans la tournure française « faire disparaître de Moab », la préposition marque le lieu d’où la personne ou l’activité sera éliminée; elle rend idiomatiquement la portée locale de לְ.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: נְאֻם est une formule prophétique nominale solennelle. « Déclaration » reste naturelle en français moderne sans transformer la formule en verbe introducteur.
- source_word: מַעֲלֶה בָמָה
  choice: celui qui monte au haut lieu
  rationale: Le participe singulier de עלה est conservé comme désignation générique d’un adorateur, et בָמָה est rendu par le terme cultuel usuel « haut lieu ».
- source_word: וּמַקְטִיר
  choice: et qui brûle de l’encens
  rationale: Dans ce contexte cultuel, le hiphil de קטר désigne naturellement l’action de faire fumer une offrande, souvent de l’encens. La formulation choisie est claire tout en faisant l’objet d’une précision en note.
- source_word: לֵאלֹהָיו
  choice: pour son dieu
  rationale: Ici, אֱלֹהִים avec le suffixe masculin singulier désigne vraisemblablement une divinité au singulier. « Pour » exprime naturellement le destinataire cultuel en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre. Sa translittération préserve explicitement le nom divin sans lui substituer un titre.
- issue: Ce que Yahweh fait cesser en Moab
  choice: celui qui monte au haut lieu et qui brûle de l’encens
  alternative: le culte pratiqué sur les hauts lieux
  rationale: Les deux participes masculins singuliers décrivent littéralement une personne, sans doute représentative des adorateurs en général. Le texte principal conserve cette forme personnelle et la note signale la lecture collective ou abstraite.
- issue: Nature de l’acte exprimé par מקטיר
  choice: brûle de l’encens
  alternative: fait fumer une offrande
  rationale: Le verbe peut concerner l’encens ou, plus largement, la fumée sacrificielle. Le contexte permet la traduction courante « brûler de l’encens », mais l’ambiguïté lexicale mérite d’être préservée en note.
translation_notes:
  register: Français moderne, digne et prophétique. La construction encadrée par des tirets préserve la formule solennelle נְאֻם יְהוָה. « Haut lieu » maintient le vocabulaire cultuel biblique standard, tandis que la note explicite les ambiguïtés du singulier représentatif et de la fumée sacrificielle.
