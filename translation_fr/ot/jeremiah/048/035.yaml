    issue: La note alternative emploie des pluriels et ajoute « les offrandes consumées ».
    rationale: Le texte hébreu a deux participes masculins singuliers et un complément singulier (« son dieu »). Le pluriel peut être expliqué comme valeur générique, mais ne doit pas être introduit dans la citation alternative comme s’il correspondait directement à la forme du texte. « Offrandes consumées » ajoute en outre une pluralité et une précision non exigées par מקטיר.
  - severity: low
    issue: La note peut distinguer plus clairement la lecture collective de la traduction littérale personnelle.
    rationale: L’explication doit indiquer que les singuliers peuvent désigner génériquement les adorateurs ou, par extension interprétative, leur culte, sans faire de cette extension le sens littéral du verset.
