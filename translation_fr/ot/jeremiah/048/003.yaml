  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹל צְעָקָה
  choice: Un cri retentit
  rationale: Littéralement « voix/bruit d’un cri ». Cette formulation française naturelle conserve l’idée d’un cri audible sans la lourdeur de « le bruit d’un cri ».
- source_word: מֵחֹרוֹנָיִם
  choice: depuis Horonaïm
  rationale: La préposition מִן indique ici la provenance du cri; « depuis » l’exprime clairement.
- source_word: שֹׁד
  choice: dévastation
  rationale: Le terme désigne une destruction violente ou un ravage; « dévastation » convient au contexte de jugement contre Moab.
- source_word: שֶׁבֶר גָּדוֹל
  choice: immense désastre
  rationale: שֶׁבֶר évoque ici l’effondrement, la ruine ou le désastre; גָּדוֹל en intensifie l’ampleur. « Immense désastre » produit un français idiomatique tout en gardant cette force.
