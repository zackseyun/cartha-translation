  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה הִנֵּ֥ה כַ/נֶּ֖שֶׁר יִדְאֶ֑ה וּ/פָרַ֥שׂ כְּנָפָ֖י/ו אֶל מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/040.yaml
  text: 'For thus says the LORD: Look, like an eagle he swoops down and spreads his wings over Moab.'
translation:
  language: fr
  text: 'Car voici ce que dit le SEIGNEUR :


    « Voici, tel un aigle, il vole

    et déploie ses ailes sur Moab. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Regardez !
  rationale: Cette interjection attire vivement l’attention sur la scène annoncée ; « Regardez ! » est direct et naturel en français moderne.
- source_word: כַנֶּשֶׁר
  choice: Tel un aigle
  rationale: נֶשֶׁר désigne ici le grand rapace employé comme image d’une attaque aérienne rapide et menaçante ; « aigle » est le rendu traditionnel et contextuellement approprié.
- source_word: יִדְאֶה
  choice: il prend son essor
  rationale: Le verbe דאה exprime le vol ou le vol plané d’un rapace. « Prend son essor » conserve l’image sans ajouter explicitement un mouvement descendant que le verbe hébreu, à lui seul, n’impose pas.
- source_word: וּפָרַשׂ כְּנָפָיו
  choice: et déploie ses ailes
  rationale: Rendu idiomatique et proche de l’hébreu, qui décrit l’extension des ailes.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française courante pour représenter le tétragramme divin tout en le distinguant typographiquement du titre ordinaire « Seigneur ».
theological_decisions:
- issue: Identité du sujet de « il prend son essor »
  choice: Conserver le pronom « il » sans identifier l’assaillant
  alternative: Expliciter « l’ennemi » ou nommer le conquérant
  rationale: L’hébreu laisse le sujet implicite dans cette phrase. Ne pas l’expliciter préserve la tension et évite d’introduire une identification absente du verset.
translation_notes:
  register: Français international moderne, solennel mais accessible. La disposition poétique met en valeur l’oracle et son image. Aucun marqueur de note n’est nécessaire.
