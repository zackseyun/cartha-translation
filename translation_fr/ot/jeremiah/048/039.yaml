reference: Jeremiah 48:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵ֥יךְ חַ֨תָּה֙ הֵילִ֔ילוּ אֵ֛יךְ הִפְנָה עֹ֥רֶף מוֹאָ֖ב בּ֑וֹשׁ וְ/הָיָ֥ה מוֹאָ֛ב לִ/שְׂחֹ֥ק וְ/לִ/מְחִתָּ֖ה לְ/כָל סְבִיבָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/039.yaml
  text: How shattered she is! Wail! How Moab has turned her back in shame! So Moab has become a laughingstock and a horror to all around her[a][b].
translation:
  language: fr
  text: Comme elle est brisée ! Poussez des cris de douleur ! Comme Moab a tourné le dos, couvert de honte[a] ! Moab est ainsi devenu la risée et un objet d’effroi[b] pour tous ceux qui l’entourent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « a tourné la nuque/le dos » ; cette expression hébraïque évoque ici le retrait ou la fuite dans la honte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un objet de consternation » ; le terme hébreu peut aussi évoquer l’épouvante ou la ruine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Comme
  rationale: Introduit à deux reprises une exclamation de lamentation; « Comme » conserve l’élan poétique sans transformer le cri en simple constat.
- source_word: חַתָּה
  choice: elle est brisée
  rationale: Le verbe de la racine חתת exprime ici l’effondrement de Moab, envisagé comme une entité collective et personnifiée; « brisée » rend cette ruine plus concrètement que « consternée ».
- source_word: הֵילִילוּ
  choice: Poussez des cris de douleur
  rationale: Impératif pluriel appelant les auditeurs à une lamentation intense. Cette tournure est actuelle et naturelle, tout en gardant la force du verbe.
- source_word: הִפְנָה עֹרֶף
  choice: a tourné le dos
  rationale: Rend directement l’expression hébraïque « tourner la nuque/le dos », qui évoque le retrait ou la fuite dans la honte.
- source_word: מוֹאָב
  choice: Moab
  rationale: Transcription française traditionnelle du nom propre.
- source_word: בּוֹשׁ
  choice: couvert de honte
  rationale: Exprime l’état honteux dans lequel Moab se retire; l’accord masculin suit le genre grammatical de « Moab » en français.
- source_word: וְהָיָה
  choice: est ainsi devenu
  rationale: Le parfait présente l’état résultant du jugement comme accompli dans la lamentation prophétique; « ainsi » explicite sobrement la conséquence.
- source_word: לִשְׂחֹק
  choice: la risée
  rationale: Désigne celui dont on se moque. « La risée » est idiomatique, précis et naturel en français contemporain.
- source_word: לִמְחִתָּה
  choice: un objet d’effroi
  rationale: Le nom peut évoquer l’effroi, la ruine ou la consternation. Dans le parallélisme, il désigne ce que Moab est devenu aux yeux de ceux qui l’entourent, sans imposer qu’il les menace activement.
- source_word: לְכָל סְבִיבָיו
  choice: pour tous ceux qui l’entourent
  rationale: Conserve la portée large de l’hébreu, qui vise tous ceux d’alentour plutôt que seulement des voisins politiquement définis.
theological_decisions: []
