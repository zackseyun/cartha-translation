  text: אֲנִ֤י יָדַ֨עְתִּי֙ נְאֻם יְהוָ֔ה עֶבְרָת֖/וֹ וְ/לֹא כֵ֑ן בַּדָּ֖י/ו לֹא כֵ֥ן עָשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/030.yaml
  text: I know his wrath[a], declares Yahweh, and it is not so; his boasts have accomplished nothing.
translation:
  language: fr
  text: Je connais sa fureur, déclare Yahweh, mais il n’en est pas ainsi ; ses vantardises n’ont rien accompli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ses propos mensongers n’ont pas produit ce qu’ils prétendaient produire » ; ou : « ses paroles creuses sont sans effet ». Littéralement, la dernière partie se lit approximativement : « ses propos mensongers : ils n’ont pas fait ainsi ». L’hébreu est difficile et elliptique.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Je connais
  rationale: 'Le parfait qal à la première personne peut exprimer ici un état présent et établi : Yahweh connaît pleinement l’attitude de Moab.'
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formulation naturelle et solennelle rend la formule prophétique tout en conservant le nom divin.
- source_word: עֶבְרָתוֹ
  choice: sa fureur
  rationale: עֶבְרָה désigne couramment une colère débordante ou violente ; « fureur » en exprime ici la force sans la confondre directement avec l’orgueil mentionné dans le contexte.
- source_word: וְלֹא כֵן
  choice: mais il n’en est pas ainsi
  rationale: La tournure conserve la réfutation brève et quelque peu énigmatique de l’hébreu, sans préciser abusivement ce qui est nié.
- source_word: בַּדָּיו
  choice: ses vantardises
  rationale: Dans le contexte immédiat de l’orgueil de Moab, ce choix rend les propos faux, creux et présomptueux évoqués par le terme.
- source_word: לֹא כֵן עָשׂוּ
  choice: n’ont rien accompli
  rationale: Littéralement, « n’ont pas fait ainsi » ; cette formulation française exprime de manière intelligible l’inefficacité des prétentions de Moab tout en signalant l’incertitude dans une note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: « Yahweh » représente directement le tétragramme et maintient sa valeur de nom propre dans la déclaration prophétique.
- issue: Interprétation de la proposition difficile בַּדָּיו לֹא כֵן עָשׂוּ
  choice: ses vantardises n’ont rien accompli
  alternative: ses mensonges sont faux ; ils n’ont pas agi ainsi
  rationale: L’hébreu est elliptique. Le contexte favorise une dénonciation de la vanité des prétentions orgueilleuses de Moab, mais la note conserve d’autres analyses possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure volontairement concise afin de préserver la brusque réfutation de l’hébreu ; une note expose l’ambiguïté de la proposition finale.
