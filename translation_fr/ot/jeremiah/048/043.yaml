source:
  edition: WLC
  text: פַּ֥חַד וָ/פַ֖חַת וָ/פָ֑ח עָלֶ֛י/ךָ יוֹשֵׁ֥ב מוֹאָ֖ב נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/043.yaml
  text: Terror and the pit and the snare are upon you[a], inhabitant of Moab[b], declares Yahweh.
translation:
  language: fr
  text: La terreur, la fosse et le piège sont sur toi, habitant de Moab[a], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cette triade fait écho à Ésaïe 24.17 : « la terreur, la fosse et le piège ».'
    reason: cross_reference
lexical_decisions:
- source_word: פַּחַד
  choice: la terreur
  rationale: Le nom désigne ici un effroi accablant; « terreur » convient au contexte de jugement et conserve la force de la triade.
- source_word: פַחַת
  choice: la fosse
  rationale: Le terme évoque une fosse servant de piège, dans une formule de jugement également attestée en Ésaïe 24.17.
- source_word: פָח
  choice: le piège
  rationale: Le nom désigne un dispositif destiné à capturer; « piège » est naturel en français et reste distinct de « fosse ».
- source_word: עָלֶיךָ
  choice: sont sur toi
  rationale: Cette formulation rend directement la préposition עַל avec le suffixe de deuxième personne du masculin singulier, tout en laissant entendre le malheur qui s'abat sur le destinataire.
- source_word: יוֹשֵׁב מוֹאָב
  choice: habitant de Moab
  rationale: Le participe masculin singulier est employé comme vocatif et représente collectivement la population de Moab.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: « Déclare » restitue avec solennité la formule prophétique, tandis que le nom divin est translittéré.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en préserve la fonction de nom personnel sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et solennel. La structure ternaire et l'adresse représentative au singulier sont conservées. Le choix « terreur » rend suffisamment la valeur de פַּחַד; aucune note d'alternative lexicale n'est nécessaire.
