source:
  edition: WLC
  text: לְ/מוֹאָ֡ב כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל ה֤וֹי אֶל נְבוֹ֙ כִּ֣י שֻׁדָּ֔דָה הֹבִ֥ישָׁה נִלְכְּדָ֖ה קִרְיָתָ֑יִם הֹבִ֥ישָׁה הַ/מִּשְׂגָּ֖ב וָ/חָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/001.yaml
  text: 'Concerning Moab: Thus says Yahweh of hosts[a], the God of Israel: Woe to Nebo, for it is devastated. Kiriathaim is put to shame; it is captured[b]. The stronghold is put to shame and shattered.'
translation:
  language: fr
  text: 'Au sujet de Moab[a] : Ainsi parle Yahvé des armées, le Dieu d’Israël :


    « Malheur à Nébo, car elle est dévastée !


    Qiryataïm est humiliée, elle est prise.


    La forteresse[b] est humiliée et brisée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Contre Moab ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Misgab », si le terme est compris comme un nom de lieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמוֹאָב
  choice: Au sujet de Moab
  rationale: Dans l’intitulé d’un oracle, לְ peut introduire son objet sans exprimer à lui seul l’hostilité. « Au sujet de » préserve cette portée large, tandis que le contenu manifeste clairement le jugement.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française « Yahvé » rend le nom divin יהוה comme nom propre plutôt que de le remplacer par un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Cette traduction conserve l’image concrète de צבא, qui peut désigner les armées ou les troupes, célestes comme terrestres, sans la réduire à une seule catégorie.
- source_word: הוֹי
  choice: Malheur à
  rationale: Dans cet oracle de jugement, הוֹי exprime à la fois la lamentation et la dénonciation; « Malheur à » en restitue naturellement la force.
- source_word: נְבוֹ
  choice: Nébo
  rationale: Le nom de lieu est translittéré sous une forme française claire et usuelle.
- source_word: כִּי שֻׁדָּדָה
  choice: car elle est dévastée
  rationale: Le passif de שׁדד évoque les ravages violents, souvent liés au pillage. « Dévastée » exprime le résultat sans préciser excessivement le mode de destruction.
- source_word: הֹבִישָׁה
  choice: est couverte de honte
  rationale: La forme causative décrit le déshonneur subi. Cette formulation française rend mieux cette honte imposée qu’un simple sentiment intérieur.
- source_word: נִלְכְּדָה
  choice: elle est prise
  rationale: Dans un contexte militaire, le niphal de לכד signifie qu’une ville est prise ou capturée; « prise » est l’expression française naturelle pour une cité.
- source_word: קִרְיָתָיִם
  choice: Qiryataïm
  rationale: Le toponyme est translittéré de manière à refléter ses consonnes hébraïques tout en restant lisible en français.
- source_word: הַמִּשְׂגָּב
  choice: La forteresse
  rationale: L’article défini et le sens courant de מִשְׂגָּב favorisent ici le nom commun désignant un lieu élevé et sûr, donc une forteresse. La possibilité d’un toponyme est signalée en note.
- source_word: וָחָתָּה
  choice: et abattue
  rationale: חתת peut évoquer le fait d’être brisé, abattu ou frappé de terreur. Appliqué à la forteresse et parallèlement aux verbes de destruction, « abattue » garde à la fois l’idée d’effondrement et celle de défaite.
theological_decisions:
- issue: Valeur de la préposition לְ dans l’intitulé de l’oracle
  choice: Au sujet de Moab
  alternative: Contre Moab
  rationale: Le contexte est hostile, mais la préposition elle-même a une portée plus large qu’une marque explicitement adversative. La traduction choisie conserve cette distinction.
- issue: Nom commun ou nom de lieu pour הַמִּשְׂגָּב
  choice: 'Nom commun : « la forteresse »'
  alternative: 'Nom de lieu : « Misgab »'
  rationale: L’article et l’usage lexical ordinaire appuient la lecture comme nom commun, mais le texte permet assez la lecture toponymique pour qu’elle soit conservée en note.
- issue: Portée de חתת dans la dernière proposition
  choice: abattue
  alternative: brisée ou consternée
  rationale: Le terme peut décrire aussi bien un brisement qu’un effroi. « Abattue » convient à une forteresse vaincue tout en préservant une part de cette amplitude sémantique.
translation_notes:
  register: Français international moderne, naturel et digne. Les phrases brèves et le parallélisme conservent le rythme de l’oracle. La personnification féminine des villes est maintenue, et les ambiguïtés réelles de l’intitulé, de הַמִּשְׂגָּב et de חתת ne sont pas résolues de manière dogmatique.
