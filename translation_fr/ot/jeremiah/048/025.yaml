  text: נִגְדְּעָה֙ קֶ֣רֶן מוֹאָ֔ב וּ/זְרֹע֖/וֹ נִשְׁבָּ֑רָה נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/025.yaml
  text: The horn of Moab is cut off[a], and his arm is broken, declares Yahweh.
translation:
  language: fr
  text: La corne de Moab a été coupée[a], et son bras a été brisé — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, la « corne » et le « bras » sont ici des images de la force et de la puissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגְדְּעָה
  choice: a été abattue
  rationale: Le nifal de גדע exprime l’action de couper ou d’abattre. « A été abattue » convient naturellement à l’image de la corne et présente l’action comme accomplie.
- source_word: קֶרֶן
  choice: corne
  rationale: Le sens concret est « corne », image poétique de la force ou de la puissance. La traduction conserve la métaphore au lieu de la remplacer par son interprétation.
- source_word: מוֹאָב
  choice: Moab
  rationale: Forme française traditionnelle du nom du pays et du peuple.
- source_word: וּזְרֹעוֹ
  choice: et son bras
  rationale: זְרוֹעַ signifie littéralement « bras » et représente souvent la force ou la puissance militaire. Le suffixe masculin singulier est rendu par « son », Moab étant personnifié.
- source_word: נִשְׁבָּרָה
  choice: a été brisé
  rationale: Le nifal de שבר signifie « être brisé ». Cette formulation maintient le parallélisme passif et l’image poétique.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: La formule prophétique נְאֻם marque solennellement une parole divine; « déclaration de » en conserve la forme nominale et la gravité. Le nom divin est transcrit « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » transcrit le nom personnel plutôt que de le remplacer par un titre.
- issue: Interprétation des images de la corne et du bras
  choice: conserver les métaphores dans le texte et en expliciter le sens en note
  alternative: traduire directement par « la force » et « la puissance »
  rationale: Les deux images parallèles appartiennent à la poésie prophétique et désignent la force de Moab. Les conserver respecte le relief et la tension du texte hébreu.
translation_notes:
  register: Français international moderne, sobre et solennel. Le parallélisme poétique hébreu est préservé; le tiret met en relief la formule prophétique finale.
