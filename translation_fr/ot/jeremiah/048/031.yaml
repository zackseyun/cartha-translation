  text: עַל כֵּן֙ עַל מוֹאָ֣ב אֲיֵלִ֔יל וּ/לְ/מוֹאָ֥ב כֻּלֹּ֖/ה אֶזְעָ֑ק אֶל אַנְשֵׁ֥י קִֽיר חֶ֖רֶשׂ יֶהְגֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/031.yaml
  text: Therefore I will wail over Moab[a], and I will cry out for all Moab[b]; for the men of Kir-heres one moans.
translation:
  language: fr
  text: C’est pourquoi je me lamenterai sur Moab, je pousserai des cris pour Moab tout entier ; on gémit sur les hommes de Kir-Hérès.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière proposition est difficile. On peut aussi comprendre : « je gémis sur les hommes de Kir-Hérès » ou « il gémit sur les hommes de Kir-Hérès ». Le nom du lieu apparaît ailleurs sous la forme apparentée Kir-Haréseth.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲיֵלִיל
  choice: je me lamenterai
  rationale: Le hifil de ילל exprime une lamentation forte. « Je me lamenterai » est naturel et digne en français moderne, sans atténuer le contexte funèbre.
- source_word: אֶזְעָק
  choice: je pousserai des cris
  rationale: זעק désigne un cri puissant, souvent provoqué par la détresse. Cette expression le distingue du verbe précédent tout en conservant son intensité.
- source_word: כֻּלֹּה
  choice: tout entier
  rationale: Accordé avec le nom masculin Moab, ce tour rend la totalité collective exprimée par l’hébreu.
- source_word: אֶל
  choice: sur
  rationale: Dans cette lamentation, la préposition introduit vraisemblablement l’objet au sujet duquel on gémit. « Sur » conserve ce rapport sans imposer l’idée d’un bénéficiaire.
- source_word: אַנְשֵׁי קִיר חֶרֶשׂ
  choice: les hommes de Kir-Hérès
  rationale: « Hommes » traduit explicitement אַנְשֵׁי, et « Kir-Hérès » translittère la forme du nom de lieu attestée dans ce verset.
- source_word: יֶהְגֶּה
  choice: on gémit
  rationale: הגה peut évoquer une plainte ou un gémissement sourd. Le sujet de la troisième personne est incertain ; le pronom indéfini français préserve cette indétermination.
