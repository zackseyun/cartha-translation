id: JER.48.42
reference: Jeremiah 48:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נִשְׁמַ֥ד מוֹאָ֖ב מֵ/עָ֑ם כִּ֥י עַל יְהוָ֖ה הִגְדִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/042.yaml
  text: And Moab will be destroyed as a people[a], because he magnified himself against Yahweh.
translation:
  language: fr
  text: Moab sera détruit en tant que peuple, parce qu’il s’est élevé contre Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il s’est rendu grand contre Yahweh » ; c’est-à-dire, il s’est exalté avec arrogance contre lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַד
  choice: sera anéanti
  rationale: Le nifal accompli prend ici, dans le discours prophétique, une valeur future. « Sera anéanti » conserve la voix passive et exprime la destruction nationale annoncée.
- source_word: מוֹאָב
  choice: Moab
  rationale: Forme française traditionnelle du nom du peuple et du territoire.
- source_word: מֵעָם
  choice: en tant que peuple
  rationale: La préposition מִן avec עַם indique ici la perte du statut de peuple distinct, plutôt qu’un retrait d’entre plusieurs peuples.
- source_word: כִּי
  choice: parce que
  rationale: Introduit explicitement la cause du jugement.
- source_word: עַל
  choice: contre
  rationale: Dans ce contexte d’orgueil hostile, la préposition marque l’opposition dirigée contre Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle en français du nom divin, qui préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: הִגְדִּיל
  choice: s’est élevé
  rationale: Le hifil de גדל exprime ici l’exaltation orgueilleuse de soi. « S’est élevé » restitue naturellement en français la valeur réfléchie suggérée par le contexte, sans réduire le terme à la seule idée de vantardise.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; le rendre par « Yahweh » préserve le nom personnel tout en évitant de le remplacer par un titre.
- issue: Nature de la faute de Moab
  choice: il s’est élevé contre Yahweh
  alternative: il a agi avec arrogance contre Yahweh
  rationale: La formulation retenue conserve l’image hébraïque de la grandeur revendiquée et la tension entre auto-exaltation et opposition à Dieu, tandis que l’alternative explicite davantage l’orgueil.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « en tant que peuple » précise que le jugement vise l’existence de Moab comme entité nationale distincte. Le marqueur de note est placé après la proposition qu’il éclaire.
