  text: and against Kerioth[a], and against Bozrah, and against all the cities of the land of Moab, far and near.
translation:
  language: fr
  text: Et contre Qeriyoth, et contre Botsra, et contre toutes les villes du pays de Moab, celles qui sont éloignées comme celles qui sont proches.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: contre
  rationale: Dans le contexte de l’oracle, la préposition répétée introduit les lieux visés par le jugement. « Contre » rend naturellement cette orientation hostile; la répétition de « et » n’est pas nécessaire en français dans cette énumération.
- source_word: קְרִיּוֹת
  choice: Qeriyoth
  rationale: Nom de lieu moabite, translittéré plutôt que traduit comme le nom commun « villes ». La graphie rend la forme hébraïque tout en restant lisible en français.
- source_word: בָּצְרָה
  choice: Botsra
  rationale: Nom propre de la ville moabite mentionnée dans ce contexte. « Botsra » est une translittération française claire qui la distingue d’un nom commun.
- source_word: כָּל עָרֵי אֶרֶץ מוֹאָב
  choice: toutes les villes du pays de Moab
  rationale: Rend directement la chaîne construite hébraïque dans un français naturel et précis.
- source_word: הָרְחֹקוֹת וְהַקְּרֹבוֹת
  choice: les lointaines comme les proches
  rationale: Les adjectifs féminins pluriels qualifient les villes. La tournure « les… comme les… » conserve le mérisme, qui englobe toutes les villes sans exception, tout en étant idiomatique en français.
