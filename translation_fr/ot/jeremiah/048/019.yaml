  text: אֶל דֶּ֛רֶךְ עִמְדִ֥י וְ/צַפִּ֖י יוֹשֶׁ֣בֶת עֲרוֹעֵ֑ר שַׁאֲלִי נָ֣ס וְ/נִמְלָ֔טָה אִמְרִ֖י מַה נִּֽהְיָֽתָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/019.yaml
  text: Stand by the road and watch, inhabitant of Aroer; ask the man who flees and the woman who escapes, “What has happened?”
translation:
  language: fr
  text: 'Tiens-toi près de la route et guette, habitante d’Aroër ! Demande à l’homme qui fuit et à la femme qui s’échappe : « Que s’est-il passé ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶל דֶּרֶךְ
  choice: près de la route
  rationale: Exprime naturellement la position demandée à proximité de la route, d’où l’on peut observer et interroger les fugitifs.
- source_word: וְצַפִּי
  choice: et guette
  rationale: Le verbe צפה évoque l’action de surveiller attentivement ou de guetter ; ce choix conserve cette nuance active.
- source_word: יוֹשֶׁבֶת עֲרוֹעֵר
  choice: habitante d’Aroër
  rationale: Le participe féminin singulier personnifie la population ou la ville d’Aroër et gouverne les impératifs féminins.
- source_word: נָס
  choice: l’homme qui fuit
  rationale: Le participe masculin singulier désigne ici un fugitif masculin ; la formulation explicite le genre grammatical sans alourdir le français.
- source_word: וְנִמְלָטָה
  choice: la femme qui s’échappe
  rationale: La forme féminine singulière désigne une rescapée ou fugitive ; « s’échappe » rend le mouvement de mise à l’abri.
- source_word: מַה נִּהְיָתָה
  choice: Que s’est-il passé ?
  rationale: Rend directement l’interrogation idiomatique portant sur l’événement survenu.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. L’adresse féminine à Aroër ainsi que le contraste grammatical entre le fugitif masculin et la fugitive féminine sont conservés.
