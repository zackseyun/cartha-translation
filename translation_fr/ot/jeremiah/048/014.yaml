  text: How can you say[a], ‘We are mighty men, men of valor for battle’?”
translation:
  language: fr
  text: 'Comment pouvez-vous dire : « Nous sommes des guerriers, des hommes vaillants pour le combat » ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵיךְ
  choice: Comment pouvez-vous
  rationale: Introduit une question rhétorique incrédule et réprobatrice. « Comment pouvez-vous » en restitue naturellement la force.
- source_word: תֹּאמְרוּ
  choice: dire
  rationale: Qal inaccompli, deuxième personne du pluriel, intégré à la tournure française « Comment pouvez-vous dire ».
- source_word: גִּבּוֹרִים
  choice: des guerriers
  rationale: Dans ce contexte militaire, le terme désigne des combattants puissants ou aguerris ; « guerriers » est naturel et évite l’expression vieillie « hommes puissants ».
- source_word: אֲנָחְנוּ
  choice: Nous sommes
  rationale: Le pronom indépendant souligne l’affirmation orgueilleuse des Moabites ; la copule est nécessaire en français.
- source_word: וְאַנְשֵׁי חַיִל
  choice: des hommes vaillants
  rationale: La construction désigne des hommes dotés de force, de valeur ou de bravoure militaire. « Hommes vaillants » conserve ce sens sans exagérer la précision.
- source_word: לַמִּלְחָמָה
  choice: prêts au combat
  rationale: Le ל exprime ici l’aptitude ou la destination par rapport à la guerre. « Prêts au combat » rend naturellement en français l’idée d’hommes aptes à combattre.
