  text: בְּ/צֵ֥ל חֶשְׁבּ֛וֹן עָמְד֖וּ מִ/כֹּ֣חַ נָסִ֑ים כִּֽי אֵ֞שׁ יָצָ֣א מֵ/חֶשְׁבּ֗וֹן וְ/לֶֽהָבָה֙ מִ/בֵּ֣ין סִיח֔וֹן וַ/תֹּ֨אכַל֙ פְּאַ֣ת מוֹאָ֔ב וְ/קָדְקֹ֖ד בְּנֵ֥י שָׁאֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/045.yaml
  text: In the shadow of Heshbon the fugitives stand without strength[a], for a fire has gone out from Heshbon, and a flame from the midst of Sihon[d][c][b]; it has consumed the corner of Moab and the crown of the head of the sons of tumult.
translation:
  language: fr
  text: À l’ombre de Heshbon, les fuyards s’arrêtent, à bout de forces[a]. Car un feu est sorti de Heshbon, et une flamme du milieu de Sihôn[b] ; elle a dévoré l’extrémité de Moab[c] et le sommet du crâne des fils du tumulte[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se sont arrêtés, faute de forces ». Le parfait hébreu peut être rendu au passé, et l’expression peut signifier « faute de force ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « d’entre Sihôn ». Le nom de Sihôn peut désigner par métonymie la ville ou le royaume qui lui était associé.
    reason: lexical_alternative
  - marker: c
    text: Ou « le bord de Moab » ou « le coin de Moab ». Le mot hébreu désigne un côté, un bord ou une extrémité.
    reason: lexical_alternative
  - marker: d
    text: Ou « des gens bruyants » ou « des fils du vacarme ». L’expression hébraïque est poétique et peut évoquer le tumulte, le fracas ou l’agitation.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵל חֶשְׁבּוֹן
  choice: À l’ombre de Heshbon
  rationale: Conserve l’image concrète de l’ombre et la valeur locative de la préposition, dans un français naturel.
- source_word: עָמְדוּ מִכֹּחַ נָסִים
  choice: les fuyards s’arrêtent, à bout de forces
  rationale: Le parfait peut produire une scène prophétique vive. « S’arrêtent » exprime ici l’immobilisation des personnes en fuite, tandis que « à bout de forces » rend idiomatiquement מִכֹּחַ sans effacer son interprétation possible comme manque de force.
- source_word: אֵשׁ יָצָא מֵחֶשְׁבּוֹן
  choice: un feu est sorti de Heshbon
  rationale: Reproduit directement l’image et le mouvement du texte hébreu.
- source_word: מִבֵּין סִיחוֹן
  choice: du milieu de Sihôn
  rationale: Préserve le sens spatial de מִבֵּין et la métonymie énigmatique par laquelle le roi Sihôn peut désigner le lieu ou le domaine qui lui est associé.
- source_word: וַתֹּאכַל
  choice: il a dévoré
  rationale: « Dévorer » est une image française naturelle pour l’action destructrice du feu. Le masculin reprend collectivement « un feu », bien que l’hébreu féminin puisse s’accorder avec « flamme ».
- source_word: פְּאַת מוֹאָב
  choice: le flanc de Moab
  rationale: פֵּאָה désigne un côté, un bord ou une extrémité. « Flanc » garde la métaphore corporelle et prépare le parallélisme avec le sommet du crâne.
- source_word: וְקָדְקֹד בְּנֵי שָׁאוֹן
  choice: et le sommet du crâne des fils du tumulte
  rationale: Rend explicitement קָדְקֹד comme le haut de la tête et conserve l’expression poétique ambiguë « fils du tumulte » plutôt que de l’interpréter comme simple bruit ou arrogance.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La formulation maintient les images corporelles et guerrières du texte ainsi que les ambiguïtés de מִבֵּין סִיחוֹן, פְּאַת et בְּנֵי שָׁאוֹן. La graphie « Heshbon » suit la forme fournie; « Sihôn » distingue clairement le nom propre en français.
