  terminology: Les noms Heshbon et Sihôn sont cohérents. « Fuyards », « feu », « flamme », « fils du tumulte » et « sommet du crâne » préservent convenablement le registre et les images du texte. Aucun enjeu théologique confessionnel n’est présent.
