base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/027.yaml
  text: Was Israel not a laughingstock to you? Was he found among thieves[a], that whenever you spoke of him, you shook your head?
translation:
  language: fr
  text: Israël n’était-il pas pour toi un objet de moquerie ? A-t-il été trouvé parmi des voleurs, pour que, chaque fois que tu parles de lui, tu secoues la tête[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu t’agites avec mépris ». Le verbe hébreu décrit un mouvement d’agitation ou de balancement ; la tête n’est pas explicitement mentionnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂחֹק
  choice: un objet de moquerie
  rationale: Le nom désigne ici la dérision dont quelqu’un est l’objet. Cette formulation est naturelle en français moderne et conserve la portée du terme hébreu.
- source_word: הָיָה לְךָ
  choice: était-il ... pour toi
  rationale: La construction exprime ce qu’Israël représentait aux yeux de Moab, tout en gardant la valeur relationnelle de לְ.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé selon sa forme française habituelle.
- source_word: אִם בְּגַנָּבִים נִמְצָאָה
  choice: Avait-il été surpris parmi des voleurs
  rationale: La question rhétorique compare implicitement Israël à quelqu’un pris en compagnie de voleurs. « Surpris » rend dans ce contexte la nuance possible de « trouvé » ou « pris sur le fait », sans affirmer qu’Israël était lui-même un voleur.
- source_word: כִּי מִדֵּי
  choice: pour que, chaque fois que
  rationale: La tournure relie le geste méprisant à chaque évocation répétée d’Israël. « Chaque fois que » exprime clairement cet aspect itératif.
- source_word: דְבָרֶיךָ בּוֹ
  choice: tu parlais de lui
  rationale: L’expression idiomatique signifie parler au sujet de quelqu’un. Le contexte est hostile, mais la traduction n’ajoute pas explicitement « contre lui ».
- source_word: תִּתְנוֹדָד
  choice: tu hoches la tête
  rationale: Le verbe évoque un mouvement répété d’agitation ou de balancement. Dans ce contexte de raillerie, le hochement de tête communique naturellement en français le geste de mépris, tout en signalant en note que la partie du corps n’est pas exprimée.
