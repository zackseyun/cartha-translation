  text: תְּנוּ צִ֣יץ לְ/מוֹאָ֔ב כִּ֥י נָצֹ֖א תֵּצֵ֑א וְ/עָרֶ֨י/הָ֙ לְ/שַׁמָּ֣ה תִֽהְיֶ֔ינָה מֵ/אֵ֥ין יוֹשֵׁ֖ב בָּ/הֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/009.yaml
  text: Give a wing to Moab[a], for she will surely flee away; and her cities will become a desolation[b], with no inhabitant in them.
translation:
  language: fr
  text: Donnez une aile à Moab[a], car elle s’enfuira certainement ; ses villes deviendront une désolation, sans habitants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Donnez une fleur — ou un ornement — à Moab ». Le mot hébreu désigne habituellement une fleur ou un ornement, mais le contexte immédiat, qui annonce le départ de Moab, favorise ici l’image d’une aile. L’hébreu emploie le singulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: Donnez
  rationale: L’impératif pluriel de נתן appelle directement les destinataires à « donner » ; ce choix conserve la vigueur de l’injonction prophétique.
- source_word: צִיץ
  choice: des ailes
  rationale: Le nom est singulier et signifie plus couramment « fleur » ou « ornement », mais le départ évoqué aussitôt après favorise ici une image de vol. En français, le pluriel idiomatique « des ailes » rend naturellement cette image sans nier l’incertitude lexicale, signalée en note.
- source_word: לְמוֹאָב
  choice: à Moab
  rationale: La préposition ל marque ici le bénéficiaire ou destinataire de ce qui est donné ; « à Moab » est direct et idiomatique.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’injonction et « car » convient au registre poétique et prophétique.
- source_word: נָצֹא תֵּצֵא
  choice: elle va prendre son envol
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’action de sortir ou partir. Dans le contexte de l’image précédente, « prendre son envol » exprime poétiquement un départ certain, tandis que la note conserve le sens littéral.
- source_word: וְעָרֶיהָ
  choice: ses villes
  rationale: Le suffixe féminin renvoie à Moab, envisagée comme une entité collective.
- source_word: לְשַׁמָּה תִהְיֶינָה
  choice: seront réduites en lieux dévastés
  rationale: La construction décrit l’aboutissement en désolation. Cette formulation française exprime clairement la ruine des différentes villes.
- source_word: מֵאֵין יוֹשֵׁב בָּהֵן
  choice: sans aucun habitant
  rationale: L’expression indique une dépopulation totale ; le complément locatif serait redondant en français après « ses villes ».
