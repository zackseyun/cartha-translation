translation_notes:
  register: Français international moderne, naturel et digne, avec un rythme prophétique concis. L’ambiguïté inhabituelle de צִיץ est conservée en note plutôt que résolue silencieusement. L’intensification hébraïque de נָצֹא תֵּצֵא est rendue par la tournure imminente et imagée « va prendre son envol ».
