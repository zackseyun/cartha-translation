    issue: Temps et nuance du second passif
    rationale: « Sont conquises » est possible dans un présent prophétique, mais le parfait hébreu et la piste d’audit privilégient l’annonce d’une prise accomplie. « Ont été prises » rend cette nuance et le sens militaire de נתפשה de façon plus directe.
  - severity: low
    issue: Translittération du toponyme
    rationale: La traduction emploie « Qerioth », tandis que la piste d’audit anglaise a retenu « Kerioth ». L’harmonisation en « Kerioth » est sûre ici; l’alternative appellative demeure signalée en note.
  revised_text: Kerioth a été prise[a], et les forteresses ont été prises. En ce jour-là, le cœur des guerriers de Moab sera comme celui d’une femme en travail.
