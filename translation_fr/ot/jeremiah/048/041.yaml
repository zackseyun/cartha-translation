source:
  edition: WLC
  text: נִלְכְּדָה֙ הַ/קְּרִיּ֔וֹת וְ/הַ/מְּצָד֖וֹת נִתְפָּ֑שָׂה וְֽ֠/הָיָה לֵ֞ב גִּבּוֹרֵ֤י מוֹאָב֙ בַּ/יּ֣וֹם הַ/ה֔וּא כְּ/לֵ֖ב אִשָּׁ֥ה מְצֵרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/041.yaml
  text: Kerioth has been captured[a], and the strongholds have been seized; and the heart of Moab’s warriors will be on that day like the heart of a woman in labor.
translation:
  language: fr
  text: Kerioth a été prise[a], et les forteresses ont été prises. En ce jour-là, le cœur des guerriers de Moab sera comme celui d’une femme en travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Les villes ont été prises », si הַקְּרִיּוֹת est compris comme un nom commun plutôt que comme le nom de lieu Kerioth.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַקְּרִיּוֹת
  choice: Qerioth
  rationale: Dans le contexte de l’oracle contre Moab, la forme est vraisemblablement le nom propre d’une ville moabite, même si une lecture comme nom commun, « les villes », reste possible.
- source_word: נִלְכְּדָה
  choice: est prise
  rationale: Le niphal de לכד exprime la capture. Le présent français convient à l’annonce prophétique vive et respecte le singulier du texte massorétique.
- source_word: הַמְּצָדוֹת
  choice: les forteresses
  rationale: Le terme désigne des lieux fortifiés; « forteresses » est naturel, précis et conserve le cadre militaire.
- source_word: נִתְפָּשָׂה
  choice: sont conquises
  rationale: Le passif de תפשׂ indique que les forteresses sont saisies ou prises. « Conquises » évite une répétition immédiate tout en gardant le parallélisme militaire; le verbe hébreu est morphologiquement au singulier malgré le sujet pluriel.
- source_word: לֵב
  choice: le cœur
  rationale: Le mot désigne ici le for intérieur, notamment le courage et la résolution. Le maintien de « cœur » préserve l’image hébraïque.
- source_word: גִּבּוֹרֵי מוֹאָב
  choice: les guerriers de Moab
  rationale: Dans ce contexte militaire, גִּבּוֹרֵי désigne les combattants valeureux ou puissants; « guerriers » est clair et actuel.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Cette formulation française naturelle conserve le repère temporel caractéristique du discours prophétique.
- source_word: כְּלֵב אִשָּׁה מְצֵרָה
  choice: comme celui d’une femme en travail
  rationale: Le pronom « celui » reprend naturellement « cœur » et évite une répétition lourde. « Femme en travail » conserve l’image de l’accouchement et l’idée de détresse intense.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve le parallélisme militaire, l’image du cœur et la comparaison avec une femme en travail, sans expliciter la peur ou la perte de courage au-delà du texte.
