base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/032.yaml
  text: With the weeping of Jazer I weep for you[a], vine of Sibmah; your branches crossed the sea; they reached as far as Jazer[c][b]. Upon your summer fruit and upon your grape harvest the destroyer has fallen.
translation:
  language: fr
  text: Je pleure sur toi avec les pleurs de Yazer[a], vigne de Sibma ! Tes rameaux[b] ont traversé la mer ; ils ont atteint la mer de Yazer[c]. Le dévastateur s’est abattu sur tes fruits d’été et sur ta vendange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je pleure sur toi plus que l’on ne pleure sur Yazer » ; la préposition initiale peut avoir une valeur comparative.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tes pousses » ou « tes vrilles ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu porte « la mer de Yazer ». Comme Yazer se trouvait à l’intérieur des terres, certains y voient une hyperbole poétique ; d’autres proposent de modifier le texte et de lire simplement : « ils ont atteint Yazer ».'
    reason: textual_variant
lexical_decisions:
- source_word: מִבְּכִי יַעְזֵר
  choice: avec les pleurs de Yazer
  rationale: La préposition מִן est difficile ici et peut exprimer l’association ou la comparaison. « Avec les pleurs de » conserve le lien poétique sans imposer le sens comparatif.
- source_word: אֶבְכֶּה לָּךְ
  choice: je pleure … sur toi
  rationale: Dans cette lamentation, l’imparfait hébreu exprime naturellement l’action présente du locuteur ; « sur toi » marque en français l’objet de la lamentation.
- source_word: הַגֶּפֶן שִׂבְמָה
  choice: vigne de Sibma
  rationale: L’expression est comprise comme une apostrophe métaphorique adressée à Sibma ; l’exclamation rend cette valeur vocative.
- source_word: נְטִישֹׁתַיִךְ
  choice: tes rameaux
  rationale: Le terme désigne les prolongements ou pousses étendues d’une vigne. « Rameaux » est clair, naturel et maintient l’image viticole.
- source_word: עָבְרוּ יָם
  choice: ont traversé la mer
  rationale: Traduction directe et imagée du parfait de עבר suivi de יָם.
- source_word: עַד יָם יַעְזֵר נָגָעוּ
  choice: ils ont atteint la mer de Yazer
  rationale: Cette traduction suit le texte massorétique tel qu’il est vocalisé et conserve sa géographie poétique difficile sans correction conjecturale.
- source_word: קֵיץ
  choice: fruits d’été
  rationale: Le nom désigne les fruits mûrs de la saison estivale ; le pluriel est idiomatique en français.
- source_word: בָּצִיר
  choice: vendange
  rationale: Dans le contexte de la vigne, le mot désigne spécifiquement la récolte des raisins.
- source_word: שֹׁדֵד
  choice: le dévastateur
  rationale: Le participe désigne celui qui ravage ou pille ; « dévastateur » convient au contexte de destruction agricole.
- source_word: נָפָל עַל
  choice: s’est abattu sur
  rationale: Cette tournure française préserve l’image d’un fléau tombant soudainement sur les récoltes tout en étant naturelle.
- source_word: יַעְזֵר / שִׂבְמָה
  choice: Yazer / Sibma
  rationale: Translittérations françaises usuelles et transparentes des noms de lieux.
theological_decisions:
- issue: Faut-il corriger ou expliciter la formule difficile « mer de Yazer » ?
  choice: 'Conserver dans le texte principal la lecture massorétique : « ils ont atteint la mer de Yazer »'
  alternative: « ils ont atteint Yazer » ou « ils se sont étendus jusqu’à Yazer »
  rationale: La difficulté est textuelle et géographique plutôt que doctrinale. Garder l’expression reçue préserve l’ambiguïté et l’hyperbole poétique possibles, tandis qu’une note signale les autres analyses sans les imposer.
translation_notes:
  register: Français international actuel, digne et poétique. Le parallélisme agricole et l’image de la vigne sont maintenus. Les termes « rameaux », « fruits d’été », « vendange » et « dévastateur » restent accessibles tout en convenant au registre prophétique.
