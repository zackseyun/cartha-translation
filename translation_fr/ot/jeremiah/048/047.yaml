  text: וְ/שַׁבְתִּ֧י שְׁבוּת מוֹאָ֛ב בְּ/אַחֲרִ֥ית הַ/יָּמִ֖ים נְאֻם יְהוָ֑ה עַד הֵ֖נָּה מִשְׁפַּ֥ט מוֹאָֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/047.yaml
  text: Yet I will restore the fortunes of Moab in the latter days[a], declares Yahweh. Thus far is the judgment of Moab.
translation:
  language: fr
  text: Mais je rétablirai la situation de Moab[a] dans les derniers jours[b], déclare Yahweh. C’est ici que s’achève le jugement de Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je ramènerai les captifs de Moab ». L’expression hébraïque peut désigner le retour de captivité ou d’exil, ou plus largement le rétablissement d’une situation.
    reason: alternative_lexicale_et_ambiguite_idiomatique
  - marker: b
    text: Ou « dans les temps à venir ». L’expression hébraïque peut désigner simplement l’avenir, tout en ayant parfois une portée eschatologique.
    reason: alternative_temporelle_et_ambiguite
lexical_decisions:
- source_word: וְשַׁבְתִּי שְׁבוּת
  choice: Mais je rétablirai la situation
  rationale: La tournure idiomatique exprime un renversement de situation, souvent après une captivité. « Mais » fait ressortir le contraste avec le jugement qui précède, et « rétablirai la situation » reste naturel en français sans limiter la promesse au seul retour d’exil.
- source_word: מוֹאָב
  choice: Moab
  rationale: Forme française usuelle du nom du peuple et du territoire.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: dans les derniers jours
  rationale: Cette traduction conserve la portée future et la résonance potentiellement eschatologique de l’expression hébraïque, sans en fixer plus précisément l’accomplissement.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend avec solennité la formule prophétique et transcrit explicitement le nom divin.
- source_word: עַד הֵנָּה
  choice: Ici prend fin
  rationale: L’expression marque la clôture de l’oracle sur Moab. Cette formulation française en transmet clairement la fonction discursive.
- source_word: מִשְׁפַּט מוֹאָב
  choice: le jugement prononcé contre Moab
  rationale: Dans ce contexte, מִשְׁפַּט désigne le jugement ou la sentence prophétique concernant Moab; « contre » explicite naturellement sa portée hostile dans l’oracle.
theological_decisions:
- issue: Portée du rétablissement promis à Moab
  choice: Présenter comme réelle la promesse d’un rétablissement futur, sans préciser son mécanisme ni son cadre doctrinal.
  alternative: Y voir exclusivement un redressement politique historique ou, à l’inverse, l’inclusion eschatologique des nations dans la miséricorde divine.
  rationale: Le verset annonce sans ambiguïté un renversement futur pour Moab, mais ne précise ni la forme ni l’époque exacte de son accomplissement. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la solennité prophétique tout en évitant les archaïsmes. Le nom divin est rendu par « Yahweh » conformément à la décision terminologique fournie.
