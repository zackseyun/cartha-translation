source:
  edition: WLC
  text: הִנֵּה֙ אֲנִ֣י יְהוָ֔ה אֱלֹהֵ֖י כָּל בָּשָׂ֑ר הֲֽ/מִמֶּ֔/נִּי יִפָּלֵ֖א כָּל דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/027.yaml
  text: Behold[a], I am Yahweh, the God of all flesh. Is anything too difficult for me?
translation:
  language: fr
  text: Voici, je suis Yahweh, le Dieu de toute chair. Y a-t-il quoi que ce soit de trop difficile pour moi[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Y aurait-il quoi que ce soit de trop merveilleux pour moi ? » Le verbe hébreu peut désigner ce qui est extraordinaire ou ce qui dépasse les capacités de quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque solennellement l’attention et introduit la déclaration divine; « Voici » conserve la dignité du discours sans ajouter un verbe absent de l’hébreu.
- source_word: אֲנִי
  choice: je suis
  rationale: La proposition nominale hébraïque appelle naturellement la copule en français dans cette déclaration d’identité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵי כָּל בָּשָׂר
  choice: le Dieu de toute chair
  rationale: Rend directement l’expression hébraïque et en préserve l’ampleur ainsi que la résonance biblique, sans la limiter explicitement à la seule humanité.
- source_word: הֲמִמֶּנִּי
  choice: pour moi
  rationale: Dans la construction avec פלא, la préposition exprime ce qui dépasse la capacité de quelqu’un; « pour moi » est idiomatique en français.
- source_word: יִפָּלֵא
  choice: trop difficile
  rationale: Le niphal de פלא peut désigner ce qui est extraordinaire ou hors de portée. Ici, l’interrogation porte sur la capacité de Dieu; « trop difficile » exprime naturellement ce sens sans aller jusqu’à « impossible ».
- source_word: כָּל דָּבָר
  choice: quoi que ce soit
  rationale: Formulation française naturelle dans une question rhétorique, qui conserve la portée universelle de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme; sa transcription préserve la référence au nom divin personnel.
- issue: Portée de l’expression « toute chair »
  choice: Conserver « toute chair »
  alternative: toute l’humanité; tout être vivant
  rationale: L’expression hébraïque est large et ne doit pas être réduite sans nécessité. Le calque reste intelligible en français biblique et préserve l’ambiguïté entre les humains et l’ensemble des êtres mortels.
- issue: Nuance de יִפָּלֵא
  choice: trop difficile
  alternative: trop merveilleux; impossible
  rationale: Le contexte souligne la puissance divine, mais le verbe conserve une nuance d’extraordinaire ou de prodigieux. Le texte principal donne le sens contextuel, tandis que la note maintient l’alternative lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » maintient la solennité de l’adresse divine; « toute chair » conserve volontairement l’idiome biblique et sa portée ouverte. La ponctuation française emploie une espace avant le point d’interrogation.
