  text: וְ/שַׂשְׂתִּ֥י עֲלֵי/הֶ֖ם לְ/הֵטִ֣יב אוֹתָ֑/ם וּ/נְטַעְתִּ֞י/ם בָּ/אָ֤רֶץ הַ/זֹּאת֙ בֶּ/אֱמֶ֔ת בְּ/כָל לִבִּ֖/י וּ/בְ/כָל נַפְשִֽׁ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/041.yaml
  text: I will rejoice over them to do them good[a], and I will plant them in this land in faithfulness, with all my heart and with all my soul.
translation:
  language: fr
  text: Je me réjouirai de leur faire du bien, et je les planterai dans ce pays en toute fidélité[a], de tout mon cœur et de toute mon âme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en vérité » ou « véritablement ».'
    reason: Alternative lexicale reflétant l’étendue sémantique de בֶּאֱמֶת.
lexical_decisions:
- source_word: וְשַׂשְׂתִּי עֲלֵיהֶם לְהֵיטִיב אוֹתָם
  choice: Je prendrai plaisir à leur faire du bien
  rationale: Cette formulation française naturelle exprime la joie que Dieu éprouve à l’égard de son peuple en lui faisant du bien, tout en conservant le lien de but porté par l’infinitif hébreu.
- source_word: וּנְטַעְתִּים
  choice: je les planterai
  rationale: Le sens concret de « planter » préserve la métaphore agricole de Jérémie, qui évoque ici un établissement durable.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: dans ce pays
  rationale: Dans ce contexte territorial, « pays » rend naturellement אֶרֶץ en français moderne sans effacer la référence au territoire promis.
- source_word: בֶּאֱמֶת
  choice: en toute fidélité
  rationale: Le nom אֱמֶת peut exprimer la vérité, la fiabilité ou la fidélité. Ici, il souligne la constance entière avec laquelle Dieu établira son peuple.
- source_word: בְּכָל לִבִּי וּבְכָל נַפְשִׁי
  choice: de tout mon cœur et de toute mon âme
  rationale: Cette expression française transparente conserve l’idiome hébreu de l’engagement total ainsi que son parallélisme.
theological_decisions:
- issue: Langage anthropomorphique appliqué à l’engagement intérieur de Dieu
  choice: Conserver « de tout mon cœur et de toute mon âme »
  alternative: Paraphraser par « de tout mon être » ou « avec un engagement total »
  rationale: L’hébreu attribue explicitement à Dieu le langage personnel du cœur et de l’âme. Le conserver maintient la force relationnelle et l’engagement total de la promesse sans les réduire à une abstraction.
- issue: Sens de בֶּאֱמֶת dans la promesse de restauration
  choice: en toute fidélité
  alternative: en vérité ; véritablement
  rationale: Le contexte met en avant la fiabilité de l’engagement divin à rétablir durablement le peuple. Les autres sens restent toutefois lexicalement possibles et sont signalés en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase privilégie une tournure naturelle pour l’expression de la joie divine, tout en maintenant la métaphore de la plantation et le langage anthropomorphique du texte hébreu.
