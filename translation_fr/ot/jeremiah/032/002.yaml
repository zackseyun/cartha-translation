source:
  edition: WLC
  text: וְ/אָ֗ז חֵ֚יל מֶ֣לֶךְ בָּבֶ֔ל צָרִ֖ים עַל יְרוּשָׁלִָ֑ם וְ/יִרְמְיָ֣הוּ הַ/נָּבִ֗יא הָיָ֤ה כָלוּא֙ בַּ/חֲצַ֣ר הַ/מַּטָּרָ֔ה אֲשֶׁ֖ר בֵּֽית מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/002.yaml
  text: At that time the army of the king of Babylon was besieging Jerusalem[a], and Jeremiah the prophet was confined in the court of the guard[b], which was in the house of the king of Judah.
translation:
  language: fr
  text: À ce moment-là, l’armée du roi de Babylone assiégeait Jérusalem, et le prophète Jérémie était enfermé dans la cour de la garde, située dans le palais du roi de Juda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison du roi de Juda » ; l’expression désigne ici le palais ou l’ensemble du complexe royal.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאָז
  choice: À ce moment-là
  rationale: Marque le cadre temporel du récit. Cette tournure est naturelle en français moderne et conserve la valeur temporelle de l’hébreu.
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: l’armée du roi de Babylone
  rationale: חֵיל désigne ici l’ensemble des forces militaires placées sous l’autorité du roi de Babylone ; « armée » en est l’équivalent courant le plus clair.
- source_word: צָרִים עַל יְרוּשָׁלִָם
  choice: assiégeait Jérusalem
  rationale: Le participe décrit une action militaire en cours. En français, le singulier s’accorde avec le nom collectif « armée », et l’imparfait rend naturellement l’arrière-plan narratif.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: le prophète Jérémie
  rationale: Conserve explicitement le titre apposé au nom tout en suivant l’ordre le plus naturel en français.
- source_word: הָיָה כָלוּא
  choice: était enfermé
  rationale: Exprime l’état de détention sans supposer une cellule de prison conventionnelle, puisque le lieu est ensuite précisé comme une cour gardée.
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: dans la cour de la garde
  rationale: Rend l’expression institutionnelle désignant une cour servant de lieu surveillé ou de détention, sans la réduire à une « prison ».
- source_word: אֲשֶׁר בֵּית מֶלֶךְ יְהוּדָה
  choice: située dans le palais du roi de Juda
  rationale: La proposition relative situe la cour dans la « maison » royale, c’est-à-dire le palais ou complexe palatial. « Située » explicite en français le rapport locatif sous-entendu en hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait présente les deux situations simultanées en cours. « Cour de la garde » conserve la désignation institutionnelle traditionnelle tout en restant intelligible.
