source:
  edition: WLC
  text: הִנְ/נִ֤י מְקַבְּצָ/ם֙ מִ/כָּל הָ֣/אֲרָצ֔וֹת אֲשֶׁ֨ר הִדַּחְתִּ֥י/ם שָׁ֛ם בְּ/אַפִּ֥/י וּ/בַ/חֲמָתִ֖/י וּ/בְ/קֶ֣צֶף גָּד֑וֹל וַ/הֲשִֽׁבֹתִי/ם֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה וְ/הֹשַׁבְתִּ֖י/ם לָ/בֶֽטַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/037.yaml
  text: Behold[a], I am gathering them from all the lands where I drove them in my anger and in my wrath and in great indignation[b], and I will bring them back to this place and make them dwell in safety.
translation:
  language: fr
  text: Voici[a], je les rassemble de tous les pays où je les ai chassés dans ma colère, dans ma fureur et dans ma grande indignation[b]. Je les ramènerai en ce lieu et je les y ferai habiter en sécurité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Voici, je vais les rassembler. » La construction hébraïque peut exprimer une action imminente ou future tenue pour certaine.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu accumule ici trois termes désignant la colère divine; « grande indignation » rend le troisième sans atténuer cette insistance.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici
  rationale: Introduit la déclaration avec une force solennelle et une immédiateté prophétique, dans un français biblique encore naturel.
- source_word: מְקַבְּצָם
  choice: je les rassemble
  rationale: Le participe avec הִנְנִי peut exprimer une action imminente ou certaine. Le présent français conserve cette nuance sans exclure la portée future.
- source_word: מִכָּל הָאֲרָצוֹת
  choice: de tous les pays
  rationale: Dans ce contexte d’exil, אֲרָצוֹת désigne les différents territoires ou pays où le peuple a été dispersé.
- source_word: הִדַּחְתִּים
  choice: je les ai chassés
  rationale: Rend l’idée d’une expulsion imposée et maintient explicitement l’action divine.
- source_word: בְּאַפִּי
  choice: dans ma colère
  rationale: Traduit naturellement l’emploi idiomatique du terme hébreu désignant la colère.
- source_word: וּבַחֲמָתִי
  choice: dans ma fureur
  rationale: Préserve l’accumulation de termes de jugement tout en les distinguant en français.
- source_word: וּבְקֶצֶף גָּדוֹל
  choice: dans ma grande indignation
  rationale: Conserve un troisième terme distinct et l’intensification exprimée par גָּדוֹל.
- source_word: וַהֲשִׁבֹתִים
  choice: Je les ramènerai
  rationale: Exprime clairement le sens causatif et spatial du retour depuis l’exil.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: en ce lieu
  rationale: Rend directement la référence au lieu dont parle le contexte, sans la préciser davantage que l’hébreu.
- source_word: וְהֹשַׁבְתִּים
  choice: je les y ferai habiter
  rationale: Préserve le sens causatif du verbe et le lien explicite avec « ce lieu ».
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: Expression française claire et actuelle pour une habitation à l’abri du danger.
theological_decisions:
- issue: Maintien de l’accumulation des termes désignant la colère divine
  choice: colère / fureur / grande indignation
  alternative: colère / courroux / grande fureur
  rationale: L’hébreu accumule trois termes proches pour renforcer le jugement. Des équivalents français distincts en conservent l’intensité sans leur attribuer artificiellement des sens théologiques techniques.
- issue: Valeur aspectuelle de הִנְנִי suivi du participe
  choice: Voici, je les rassemble
  alternative: Voici, je vais les rassembler / Voici, je les rassemblerai
  rationale: Le présent préserve la forme participiale et peut évoquer une action engagée, imminente ou tenue pour certaine. Une note maintient explicitement l’ambiguïté temporelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » conserve la solennité prophétique; la syntaxe demeure fluide, et « y » évite une répétition lourde tout en maintenant le renvoi à « ce lieu ».
