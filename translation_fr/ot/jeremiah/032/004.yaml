base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/004.yaml
  text: And Zedekiah king of Judah will not escape from the hand of the Chaldeans[a], for he will surely be given into the hand of the king of Babylon, and he will speak mouth to mouth with him[b], and his eyes will see his eyes.
translation:
  language: fr
  text: Sédécias, roi de Juda, n’échappera pas au pouvoir des Chaldéens[a], car il sera bel et bien livré au pouvoir du roi de Babylone. Il s’entretiendra avec lui en personne[b], et ses yeux verront les siens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la main des Chaldéens ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sa bouche parlera avec sa bouche » — celle de Sédécias avec celle du roi de Babylone ; c’est-à-dire qu’il s’entretiendra personnellement avec lui.'
    reason: idiom_explanation
  - marker: c
    text: 'Littéralement : « ses yeux verront ses yeux » ; c’est-à-dire qu’il le verra directement, les yeux dans les yeux.'
    reason: idiom_explanation
lexical_decisions:
- source_word: יִמָּלֵט
  choice: n’échappera pas
  rationale: Le niphal de מלט exprime ici le fait d’échapper ou de se soustraire à la capture. Cette formulation est naturelle en français et convient au contexte militaire.
- source_word: מִיַּד הַכַּשְׂדִּים
  choice: au pouvoir des Chaldéens
  rationale: Littéralement « de la main des Chaldéens ». En français actuel, « au pouvoir de » rend clairement l’idée de maîtrise ou de contrôle sans suggérer seulement une localisation physique.
- source_word: הִנָּתֹן יִנָּתֵן
  choice: il sera bel et bien livré
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude de l’action. « Bel et bien » restitue cette insistance tout en conservant le passif.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: au pouvoir du roi de Babylone
  rationale: L’expression hébraïque de la « main » désigne ici l’autorité et la maîtrise. La même tournure française que dans la première proposition assure clarté et cohérence.
- source_word: וְדִבֶּר פִּיו עִם פִּיו
  choice: Il lui parlera directement, de bouche à bouche
  rationale: L’hébreu dit concrètement « sa bouche parlera avec sa bouche ». L’ajout de « directement » explicite la rencontre personnelle, tandis que « de bouche à bouche » conserve l’image inhabituelle du texte sans la remplacer silencieusement par « face à face ».
- source_word: וְעֵינָיו אֶת־עֵינוֹ תִּרְאֶינָה
  choice: ses yeux verront les siens
  rationale: Cette traduction préserve l’image réciproque et concrète de l’hébreu, tout en restant intelligible en français. Elle souligne que Sédécias se trouvera personnellement devant le roi de Babylone.
- source_word: צִדְקִיָּהוּ
  choice: Sédécias
  rationale: Forme française traditionnelle et largement reconnue du nom biblique.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Le texte hébreu emploie la désignation ethnique et politique précise « Chaldéens » ; elle n’est donc pas nivelée en « Babyloniens ».
