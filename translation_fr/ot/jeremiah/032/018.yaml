  text: עֹ֤שֶׂה חֶ֨סֶד֙ לַֽ/אֲלָפִ֔ים וּ/מְשַׁלֵּם֙ עֲוֺ֣ן אָב֔וֹת אֶל חֵ֥יק בְּנֵי/הֶ֖ם אַחֲרֵי/הֶ֑ם הָ/אֵ֤ל הַ/גָּדוֹל֙ הַ/גִּבּ֔וֹר יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/018.yaml
  text: showing steadfast love to thousands[a], and repaying the iniquity of fathers into the lap of their children after them—the great, mighty God, Yahweh of Armies[b], is his name.
translation:
  language: fr
  text: 'toi qui manifestes un amour fidèle envers des milliers[a] et qui fais retomber la faute des pères dans le giron de leurs enfants après eux, le Dieu grand et puissant, Yahvé des armées : tel est son nom.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « envers des milliers de générations », d’après des formules semblables relatives à l’alliance dans d’autres passages ; l’hébreu dit ici simplement « envers des milliers ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « Yahvé des armées » : la traduction traditionnelle emploie « le SEIGNEUR des armées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה חֶסֶד
  choice: qui manifestes un amour fidèle
  rationale: Les participes poursuivent l’adresse à Dieu commencée dans le contexte. « Manifester un amour fidèle » rend naturellement la loyauté, la bonté et la constance exprimées par חֶסֶד.
- source_word: לַאֲלָפִים
  choice: envers des milliers
  rationale: L’hébreu dit simplement « envers/pour des milliers » sans nom exprimé. Le texte principal conserve cette concision et la note signale l’interprétation possible en générations.
- source_word: וּמְשַׁלֵּם עֲוֺן
  choice: et qui fais retomber la faute
  rationale: שׁלם au piel exprime ici la rétribution. La formulation française garde la force de la conséquence rétributive tout en laissant à עָוֹן sa portée de faute pouvant inclure culpabilité et châtiment.
- source_word: אָבוֹת
  choice: des pères
  rationale: Le masculin pluriel est conservé avec le terme français direct « pères ».
- source_word: אֶל חֵיק
  choice: dans le giron
  rationale: Cette expression conserve l’image hébraïque de ce qui est déposé au plus près d’une personne; « giron » convient au registre solennel du passage.
- source_word: בְּנֵיהֶם אַחֲרֵיהֶם
  choice: de leurs enfants après eux
  rationale: בנים peut désigner les fils ou, collectivement, les enfants. « Après eux » maintient explicitement la succession générationnelle.
- source_word: הָאֵל הַגָּדוֹל הַגִּבּוֹר
  choice: Dieu grand et puissant
  rationale: La formulation française naturelle préserve les deux attributs divins et le ton doxologique.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La transcription française usuelle rend le nom divin personnel plutôt que de le remplacer silencieusement par un titre.
- source_word: צְבָאוֹת
  choice: le Seigneur des armées
  rationale: « Armées » communique clairement le sens concret de צְבָאוֹת; l’ensemble rend le titre divin traditionnel sans recourir à l’expression aujourd’hui opaque « des armées célestes » si celle-ci était ajoutée sans être explicite.
theological_decisions:
- issue: La rétribution entre générations
  choice: Conserver l’affirmation selon laquelle la faute des pères retombe dans le giron de leurs enfants après eux.
  alternative: Réduire l’expression aux seules conséquences sociales, ou préciser qu’il s’agit du châtiment direct d’enfants innocents.
  rationale: Le verset affirme une dimension intergénérationnelle sans en expliquer ici toutes les modalités. La traduction ne résout pas la tension avec les textes qui soulignent la responsabilité individuelle.
- issue: Le titre יְהוָה צְבָאוֹת
  choice: Yahvé, le Seigneur des armées
  alternative: Yahvé des armées; le SEIGNEUR de l’univers; l’Éternel des armées.
  rationale: Cette formulation distingue le nom personnel du titre et rend intelligible la souveraineté militaire évoquée par צְבָאוֹת, sans employer une tournure française trop abrupte.
translation_notes:
  register: Français international moderne, digne et accessible. Le début est formulé comme la suite de l’adresse directe du verset précédent. Les images « giron » et « armées » sont maintenues afin de préserver la densité poétique et théologique de l’hébreu.
