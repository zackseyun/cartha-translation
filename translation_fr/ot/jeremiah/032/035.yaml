  text: וַ/יִּבְנוּ֩ אֶת בָּמ֨וֹת הַ/בַּ֜עַל אֲשֶׁ֣ר בְּ/גֵ֣יא בֶן הִנֹּ֗ם לְ֠/הַעֲבִיר אֶת בְּנֵי/הֶ֣ם וְ/אֶת בְּנוֹתֵי/הֶם֮ לַ/מֹּלֶךְ֒ אֲשֶׁ֣ר לֹֽא צִוִּיתִ֗י/ם וְ/לֹ֤א עָֽלְתָה֙ עַל לִבִּ֔/י לַ/עֲשׂ֖וֹת הַ/תּוֹעֵבָ֣ה הַ/זֹּ֑את לְמַ֖עַן החטי אֶת יְהוּדָֽה־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/035.yaml
  text: They built the high places of Baal that are in the Valley of Ben-hinnom[a], to make their sons and their daughters pass through the fire to Molech—something I had not commanded them, nor had it entered my heart that they should do this abomination[c][b], causing Judah to sin.
translation:
  language: fr
  text: Ils ont bâti les hauts lieux de Baal, qui se trouvent dans la vallée de Ben-Hinnom[a], afin d’y faire passer leurs fils et leurs filles à Molek[b] — ce que je ne leur avais pas ordonné — et jamais il ne m’était venu au cœur qu’ils commettent cette abomination pour faire pécher Juda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la vallée du fils de Hinnom ».
    reason: Alternative lexicale conservant la traduction littérale du nom hébreu.
  - marker: b
    text: Littéralement « afin de faire passer leurs fils et leurs filles à Molek ». Dans ce contexte cultuel, l’expression désigne un sacrifice d’enfants; elle est ailleurs associée au feu.
    reason: Note culturelle et textuelle distinguant la formulation hébraïque de son sens contextuel, sans ajouter le feu au texte du verset.
  - marker: c
    text: Ou « cela ne m’était jamais venu à l’esprit ». Littéralement « cela n’était pas monté sur mon cœur ».
    reason: Alternative idiomatique et indication de l’image anthropomorphique hébraïque.
lexical_decisions:
- source_word: בָּמוֹת הַבַּעַל
  choice: les hauts lieux consacrés à Baal
  rationale: « Hauts lieux » conserve le terme biblique désignant des sites cultuels; « consacrés à » exprime naturellement en français le rapport construit avec Baal.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: dans la vallée de Ben-Hinnom
  rationale: La translittération préserve le nom géographique ancien sans recourir à « géhenne », qui serait anachronique ici; la traduction littérale figure en note.
- source_word: לְהַעֲבִיר אֶת־בְּנֵיהֶם וְאֶת־בְּנוֹתֵיהֶם לַמֹּלֶךְ
  choice: afin de faire passer leurs fils et leurs filles par le feu pour les offrir à Molek
  rationale: La formulation conserve l’image de l’expression cultuelle tout en explicitant en français son rapport au feu et sa destination sacrificielle; la note signale la forme plus littérale de l’hébreu.
- source_word: וְלֹא עָלְתָה עַל־לִבִּי
  choice: et il ne m’était jamais venu au cœur
  rationale: Cette expression française garde l’anthropomorphisme du texte hébreu et sa force rhétorique, sans le réduire à une formulation abstraite sur la pensée.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: cette abomination
  rationale: « Abomination » rend la gravité cultuelle et morale de תּוֹעֵבָה dans un registre biblique encore compréhensible aujourd’hui.
- source_word: לְמַעַן הַחֲטִיא אֶת־יְהוּדָה
  choice: entraînant ainsi Juda dans le péché
  rationale: Cette formulation rend la valeur causative du hiphil de חטא et évite de faire de לְמַעַן une affirmation trop rigide d’intention lorsque la conséquence est au premier plan.
theological_decisions:
- issue: Nature de l’expression relative au sacrifice des enfants
  choice: Conserver « faire passer ... par le feu » tout en ajoutant « pour les offrir à Molek ».
  alternative: Traduire seulement « faire passer leurs fils et leurs filles à Molek » ou directement « sacrifier leurs fils et leurs filles à Molek ».
  rationale: Le choix maintient l’image de l’idiome hébreu tout en rendant intelligible sa portée sacrificielle dans le contexte cultuel. La note distingue clairement l’explicitation du libellé hébreu.
- issue: Langage anthropomorphique appliqué à Dieu
  choice: « il ne m’était jamais venu au cœur »
  alternative: « cela ne m’était jamais venu à l’esprit »
  rationale: La traduction garde le mot et l’image du cœur présents dans l’hébreu ainsi que la tension théologique du propos, sans transformer le verset en affirmation explicative sur la connaissance divine.
- issue: Valeur de לְמַעַן devant le causatif de « pécher »
  choice: « entraînant ainsi Juda dans le péché »
  alternative: « afin de faire pécher Juda »
  rationale: La première formulation conserve le rapport causal ou résultatif sans imposer que faire pécher Juda ait été le but consciemment recherché par les bâtisseurs.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve les expressions bibliques établies « hauts lieux » et « abomination », ainsi que l’image forte du cœur. « Molek » suit une translittération française courante du nom hébreu מֹלֶךְ.
