id: JER.32.6
reference: Jeremiah 32:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר יִרְמְיָ֑הוּ הָיָ֥ה דְּבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/006.yaml
  text: And Jeremiah said[a], "The word of Yahweh came to me, saying,"
translation:
  language: fr
  text: 'Jérémie dit : « La parole de Yahweh[a] me fut adressée en ces termes : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH »; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le waw consécutif fait progresser le récit. En français, la simple succession des phrases suffit naturellement à exprimer cet enchaînement, sans imposer un « alors » plus marqué.
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: הָיָה דְבַר־יְהוָה אֵלַי
  choice: La parole de Yahweh me fut adressée
  rationale: Cette formulation idiomatique rend la formule prophétique hébraïque, littéralement « la parole de Yahweh fut/vint à moi », tout en indiquant clairement une communication divine.
- source_word: דְבַר
  choice: parole
  rationale: « Parole » conserve le lien lexical avec דבר et la formule prophétique traditionnelle; « message » serait possible, mais moins formellement proche.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin représenté par le tétragramme, plutôt que substitution par un titre.
- source_word: אֵלַי
  choice: me fut adressée
  rationale: La construction française rend idiomatiquement la direction vers le locuteur exprimée par la préposition אֶל et le suffixe de première personne.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit le contenu de la parole divine au verset suivant. « En ces termes » constitue une transition naturelle et digne en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le nom divin. « Yahweh » le représente comme nom propre, tandis que la note signale la substitution traditionnelle par « le SEIGNEUR ».
translation_notes:
  register: Français moderne, clair et digne. La ponctuation introduit une citation qui se poursuit au verset suivant. Le passé simple convient à la narration écrite et à la formule prophétique sans créer d’archaïsme lexical.
