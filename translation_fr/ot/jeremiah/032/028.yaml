language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֕ן כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנְ/נִ֣י נֹתֵן֩ אֶת הָ/עִ֨יר הַ/זֹּ֜את בְּ/יַ֣ד הַ/כַּשְׂדִּ֗ים וּ/בְ/יַ֛ד נְבֽוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/028.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am giving this city into the hand of the Chaldeans and into the hand of Nebuchadnezzar king of Babylon, and he will capture it.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle Yahweh : Voici, je livre cette ville aux Chaldéens et à Nabuchodonosor[a], roi de Babylone, et il s’en emparera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Nabuchodrétsar », forme également transcrite « Nabuchadrétsar » ; « Nabuchodonosor » est la forme française traditionnelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque clairement la conséquence de ce qui précède tout en restant naturel en français moderne.
- source_word: כֹּה אָמַר יְהוָה
  choice: ainsi parle Yahweh
  rationale: Conserve la formule solennelle du messager prophétique et rend directement le nom divin.
- source_word: הִנְנִי נֹתֵן
  choice: Voici, je livre
  rationale: « Voici » garde la force emphatique de הִנְנִי, tandis que « je livre » exprime naturellement le transfert imminent sous le pouvoir ennemi indiqué par le contexte.
- source_word: הָעִיר הַזֹּאת
  choice: cette ville
  rationale: Rendu direct et idiomatique du nom accompagné du démonstratif.
- source_word: בְּיַד הַכַּשְׂדִּים וּבְיַד נְבוּכַדְרֶאצַּר
  choice: aux Chaldéens et à Nabuchodonosor
  rationale: L’expression hébraïque « dans la main de » désigne ici la remise au pouvoir de quelqu’un ; « livrer à » restitue clairement cet idiome en français sans répétition lourde.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Préserve l’ethnonyme hébreu plutôt que de l’expliciter par « Babyloniens ».
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et largement reconnue ; la forme plus proche de l’orthographe hébraïque du verset est signalée en note.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Rendu direct de la chaîne construite hébraïque.
- source_word: וּלְכָדָהּ
  choice: et il s’en emparera
  rationale: Le verbe désigne la prise d’une ville ; le pronom masculin singulier conserve la syntaxe hébraïque et renvoie naturellement au roi qui vient d’être nommé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le Tétragramme ; « Yahweh » représente directement le nom propre sans le remplacer par un titre.
- issue: Référent du sujet masculin singulier dans וּלְכָדָהּ
  choice: « il », renvoyant naturellement à Nabuchodonosor
  alternative: « elle sera prise », ou les Chaldéens compris collectivement
  rationale: La forme verbale est au masculin singulier et son antécédent singulier explicite le plus proche est Nabuchodonosor. Le pronom conserve cette tension syntaxique sans ajouter « son armée ».
translation_notes:
  register: Français moderne, digne et accessible. La formule prophétique « ainsi parle Yahweh » conserve la solennité de l’original. « Je livre » rend idiomatiquement l’image du transfert « dans la main de », tandis que « Voici » maintient l’emphase hébraïque.
