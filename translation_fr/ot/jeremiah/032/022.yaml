  text: וַ/תִּתֵּ֤ן לָ/הֶם֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את אֲשֶׁר נִשְׁבַּ֥עְתָּ לַ/אֲבוֹתָ֖/ם לָ/תֵ֣ת לָ/הֶ֑ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/022.yaml
  text: And you gave them this land[a], which you swore to their fathers to give them, a land flowing with milk and honey.
translation:
  language: fr
  text: Tu leur as donné ce pays[a], que tu avais juré à leurs pères de leur donner, un pays ruisselant de lait et de miel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs ancêtres ». L’hébreu dit « leurs pères » et désigne les ancêtres fondateurs d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Tu leur as donné
  rationale: Le verbe נתן signifie couramment « donner ». Le passé composé convient naturellement au récit dans cette prière et conserve l’adresse directe à Dieu.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ce pays
  rationale: אֶרֶץ désigne ici le territoire promis. En français moderne, « ce pays » est plus naturel que « cette terre » dans ce contexte territorial.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ
  choice: que tu avais juré
  rationale: נשבע exprime explicitement un serment. Le plus-que-parfait situe naturellement ce serment avant le don du pays, sans réduire sa force à une simple promesse.
- source_word: לַאֲבוֹתָם
  choice: à leurs pères
  rationale: Le texte hébreu emploie explicitement אָבוֹת, « pères », ici au sens des ancêtres fondateurs d’Israël. La formulation est conservée dans le texte, avec une note signalant l’autre rendu possible.
- source_word: לָתֵת לָהֶם
  choice: de leur donner
  rationale: Cette construction infinitive précise le contenu du serment et préserve la répétition du verbe נתן présente en hébreu.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: un pays où coulent le lait et le miel
  rationale: Cette tournure française naturelle conserve l’image hébraïque traditionnelle d’abondance agricole et de bénédiction.
theological_decisions:
- issue: Langage patriarcal dans la formule de l’alliance
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: L’hébreu emploie le terme masculin אָבוֹת et renvoie aux pères fondateurs d’Israël. Le texte garde cette formulation sans la neutraliser, tandis que la note explicite son sens collectif et historique.
translation_notes:
  register: Français international moderne, naturel et digne. Tutoiement maintenu dans l’adresse directe à Dieu. La coordination initiale וַ־ n’est pas rendue mécaniquement par « Et », car le verset s’insère dans une prière continue et la phrase française reste fluide sans elle.
