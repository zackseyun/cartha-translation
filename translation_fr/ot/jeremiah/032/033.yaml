  text: They turned their back to me and not their face[a]; though I taught them, rising early and teaching[b], they would not listen to receive correction.
translation:
  language: fr
  text: Ils m’ont tourné le dos plutôt que de me faire face[a]. Bien que je les aie instruits, me levant tôt pour les enseigner[b], ils n’ont pas écouté pour recevoir la correction[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ils ont tourné vers moi la nuque — ou le dos — et non le visage. »'
    reason: La note conserve l’image corporelle et l’opposition du texte hébreu.
  - marker: b
    text: 'Littéralement : « me levant tôt et enseignant ». Cette expression hébraïque évoque un enseignement assidu et répété.'
    reason: La note explique l’idiome de Jérémie tout en laissant le texte principal exprimer son sens naturel.
  - marker: c
    text: 'Ou : « la discipline » ou « l’instruction ». Le mot hébreu peut désigner une réprimande qui vise à former et à corriger.'
    reason: La note conserve l’étendue sémantique de מוּסָר.
lexical_decisions:
- source_word: וַיִּפְנוּ אֵלַי עֹרֶף וְלֹא פָנִים
  choice: Ils m’ont tourné le dos, au lieu de se tourner vers moi
  rationale: Cette formulation française naturelle rend l’opposition hébraïque entre la nuque ou le dos et le visage, image d’un rejet délibéré, sans reproduire une tournure française maladroite.
- source_word: וְלַמֵּד אֹתָם הַשְׁכֵּם וְלַמֵּד
  choice: Je n’ai cessé de les instruire
  rationale: L’expression littérale « me levant tôt et enseignant » est un idiome fréquent chez Jérémie qui exprime une action diligente, répétée et persistante. La traduction restitue son sens en français courant.
- source_word: וְאֵינָם שֹׁמְעִים
  choice: mais ils n’ont pas écouté
  rationale: Le contexte indique non une incapacité à entendre, mais un refus persistant de prêter attention.
- source_word: לָקַחַת מוּסָר
  choice: n’ont pas accepté la correction
  rationale: מוּסָר peut désigner la correction, la discipline ou l’instruction à visée formatrice. « Accepter la correction » convient au contexte de réprimande prophétique tout en conservant cette nuance formative.
