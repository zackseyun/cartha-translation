  text: וַ/תֹּצֵ֛א אֶת עַמְּ/ךָ֥ אֶת יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בְּ/אֹת֣וֹת וּ/בְ/מוֹפְתִ֗ים וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בְ/אֶזְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָ֖א גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/021.yaml
  text: And you brought your people Israel out of the land of Egypt with signs and wonders[a], with a strong hand and an outstretched arm, and with great terror.
translation:
  language: fr
  text: Tu as fait sortir ton peuple, Israël, du pays d’Égypte, par des signes et des prodiges, par une main forte et un bras étendu, et avec une grande terreur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une grande crainte » ou « avec un profond respect ». Le terme hébreu peut évoquer la crainte, la terreur ou l’effroi mêlé de respect.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּצֵא
  choice: tu as fait sortir
  rationale: 'Le hifil de יצא exprime la causation : Dieu a fait sortir Israël. Cette formulation est naturelle en français et conserve la force causative de l’hébreu.'
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: ton peuple, Israël
  rationale: Israël est en apposition à « ton peuple ». La virgule rend clairement cette relation tout en conservant la désignation d’alliance et l’adresse directe à Dieu.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Formulation française courante qui exprime le mouvement hors d’Égypte avec « faire sortir ».
- source_word: בְּאֹתוֹת וּבְמוֹפְתִים
  choice: par des signes et des prodiges
  rationale: La préposition ב est instrumentale. « Signes et prodiges » est une expression claire et bien établie qui maintient les deux termes hébreux.
- source_word: וּבְיָד חֲזָקָה
  choice: par une main forte
  rationale: Traduction proche de l’expression hébraïque, qui demeure intelligible en français et évoque la puissance exercée par Dieu.
- source_word: וּבְאֶזְרֹעַ נְטוּיָה
  choice: et un bras étendu
  rationale: Rend littéralement et naturellement la formule de l’Exode décrivant l’intervention puissante de Dieu.
- source_word: וּבְמוֹרָא גָּדוֹל
  choice: et en inspirant une grande terreur
  rationale: מוֹרָא peut désigner la terreur, la crainte ou ce qui l’inspire. La tournure verbale naturelle en français conserve ici le caractère redoutable des actes divins sans faire de la terreur un simple instrument matériel parallèle aux signes.
theological_decisions:
- issue: Sens de וּבְמוֹרָא גָּדוֹל dans la formule de l’Exode
  choice: en inspirant une grande terreur
  alternative: avec une grande crainte / en inspirant un profond respect
  rationale: Le contexte permet une nuance de terreur suscitée par les actes redoutables de Dieu, tandis que le terme hébreu peut aussi couvrir la crainte révérencielle. Le texte principal retient la force redoutable du contexte égyptien et la note préserve l’amplitude sémantique.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme des moyens employés lors de l’Exode est conservé, avec une légère adaptation idiomatique de la dernière expression. Le tutoiement maintient l’adresse directe de la prière à Dieu.
