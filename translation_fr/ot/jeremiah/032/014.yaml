  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל לָק֣וֹחַ אֶת הַ/סְּפָרִ֣ים הָ/אֵ֡לֶּה אֵ֣ת סֵפֶר֩ הַ/מִּקְנָ֨ה הַ/זֶּ֜ה וְ/אֵ֣ת הֶ/חָת֗וּם וְ/אֵ֨ת סֵ֤פֶר הַ/גָּלוּי֙ הַ/זֶּ֔ה וּ/נְתַתָּ֖/ם בִּ/כְלִי חָ֑רֶשׂ לְמַ֥עַן יַעַמְד֖וּ יָמִ֥ים רַבִּֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/014.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Take these documents, this deed of purchase, both the sealed copy and this open copy, and put them in an earthenware vessel[b], so that they may last for many days.'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh des armées, le Dieu d’Israël : « Prends ces documents[a] : cet acte d’achat, le document scellé et ce document ouvert[b]. Mets-les dans un récipient en terre cuite, afin qu’ils se conservent pendant de nombreux jours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ces rouleaux ». Le mot hébreu peut désigner divers écrits; ici, il s’agit de documents relatifs à une transaction juridique.
    reason: lexical_alternative
  - marker: b
    text: Ou « ce document non scellé ». L’hébreu oppose ce document au document scellé.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par le terme français courant dans ce titre, qui évoque les forces placées sous le commandement souverain de Dieu.
- source_word: לָקוֹחַ
  choice: Prends
  rationale: L’infinitif absolu a ici une valeur impérative; l’impératif français exprime clairement l’instruction.
- source_word: הַסְּפָרִים הָאֵלֶּה
  choice: ces documents
  rationale: Dans le contexte d’une transaction foncière, סְפָרִים désigne des écrits juridiques; « documents » reste assez large sans imposer leur forme matérielle.
- source_word: סֵפֶר הַמִּקְנָה
  choice: cet acte d’achat
  rationale: L’expression désigne le document juridique constatant l’acquisition du terrain; « acte d’achat » en communique naturellement la fonction.
- source_word: הֶחָתוּם
  choice: le document scellé
  rationale: Le substantif sous-entendu est explicité en français. La formulation évite d’affirmer qu’il s’agit nécessairement d’une simple copie.
- source_word: סֵפֶר הַגָּלוּי
  choice: ce document ouvert
  rationale: « Ouvert » maintient le contraste lexical avec le document scellé, tout en laissant une note préciser le sens possible de « non scellé ».
- source_word: בִּכְלִי חָרֶשׂ
  choice: dans un récipient en terre cuite
  rationale: La formulation rend la matière du contenant sans en préciser indûment la forme.
- source_word: לְמַעַן יַעַמְדוּ
  choice: afin qu’ils se conservent
  rationale: Dans ce contexte d’archivage, le verbe exprime la préservation durable plutôt qu’une position physique.
- source_word: יָמִים רַבִּים
  choice: pendant de nombreux jours
  rationale: Cette traduction conserve l’image temporelle hébraïque tout en restant compréhensible en français moderne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; la translittération préserve le nom divin sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation présente les trois expressions suivantes comme le contenu des « documents ». Les démonstratifs du texte hébreu sont conservés sans alourdir excessivement la phrase.
