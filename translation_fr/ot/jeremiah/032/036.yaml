  text: וְ/עַתָּ֕ה לָ/כֵ֛ן כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אֶל הָ/עִ֨יר הַ/זֹּ֜את אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים נִתְּנָה֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל בַּ/חֶ֖רֶב וּ/בָ/רָעָ֥ב וּ/בַ/דָּֽבֶר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/036.yaml
  text: 'Now therefore[a], thus says Yahweh, the God of Israel, concerning this city of which you say, ‘It has been given into the hand of the king of Babylon by the sword, by famine[b], and by pestilence’:'
translation:
  language: fr
  text: 'Maintenant donc, ainsi parle Yahvé, le Dieu d’Israël, au sujet de cette ville dont vous dites : « Elle a été livrée aux mains du roi de Babylone par l’épée, la famine et la peste[a] » :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’épidémie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה לָכֵן
  choice: Maintenant donc
  rationale: Conserve à la fois le repère discursif et temporel וְעַתָּה et la conclusion logique marquée par לָכֵן, dans une tournure française naturelle.
- source_word: כֹּה אָמַר
  choice: ainsi parle
  rationale: Formule prophétique française consacrée, digne et actuelle, qui rend directement la formule de messager.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre; « Yahvé » est la forme française courante.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la construction hébraïque.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: au sujet de cette ville
  rationale: Dans ce contexte de déclaration, אֶל introduit le thème visé; cette formulation est plus naturelle que le littéral « à cette ville ».
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: dont vous dites
  rationale: Conserve la proposition relative en français idiomatique et introduit clairement l’affirmation des interlocuteurs.
- source_word: נִתְּנָה
  choice: Elle a été livrée
  rationale: Le niphal parfait présente la remise de la ville comme accomplie ou tenue pour certaine; le passé composé passif respecte cet aspect sans imposer une valeur progressive.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: aux mains du roi de Babylone
  rationale: Rend l’image hébraïque de la main comme pouvoir ou maîtrise par une expression française transparente.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדָּבֶר
  choice: par l’épée, la famine et la peste
  rationale: Préserve la triade traditionnelle des moyens de jugement tout en évitant de répéter inutilement la préposition en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa transcription préserve cette donnée plutôt que de la remplacer par un titre.
- issue: Valeur aspectuelle de נִתְּנָה
  choice: Elle a été livrée
  alternative: Elle est livrée / Elle est en train d’être livrée
  rationale: Le parfait niphal peut décrire la remise comme accomplie ou certaine. Le passé composé convient ici, tout en reconnaissant que le contexte du siège permet une lecture résultative ou en cours.
translation_notes:
  register: Français international moderne, de registre soutenu mais accessible. La formule « ainsi parle Yahvé » conserve la solennité prophétique; la citation reste syntaxiquement ouverte sur la suite de l’oracle.
