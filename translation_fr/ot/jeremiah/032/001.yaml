id: JER.32.1
reference: Jeremiah 32:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה אֶֽל יִרְמְיָ֨הוּ֙ מֵ/אֵ֣ת יְהוָ֔ה ב/שנת הָ/עֲשִׂרִ֔ית לְ/צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הִ֧יא הַ/שָּׁנָ֛ה שְׁמֹנֶֽה עֶשְׂרֵ֥ה שָׁנָ֖ה לִ/נְבֽוּכַדְרֶאצַּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/001.yaml
  text: The word that came to Jeremiah from Yahweh in the tenth year of Zedekiah king of Judah[a], which was the eighteenth year of Nebuchadnezzar.
translation:
  language: fr
  text: La parole qui fut adressée à Jérémie de la part de Yahweh, la dixième année du règne de Sédécias, roi de Juda — c’était la dix-huitième année du règne de Nabuchodonosor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: La parole
  rationale: Dans cette formule prophétique, דָּבָר désigne une communication divine. « La parole » conserve la formulation biblique consacrée sans réduire le sens à une simple information.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: qui fut adressée à
  rationale: Cette tournure française naturelle exprime l’arrivée d’une parole au prophète et évite le calque moins idiomatique « qui vint à ».
- source_word: מֵאֵת יְהוָה
  choice: de la part de Yahweh
  rationale: מֵאֵת indique ici la source personnelle de la parole. « De la part de » convient naturellement à une communication adressée à quelqu’un, tandis que le nom divin est translittéré « Yahweh ».
- source_word: ב/שנת הָעֲשִׂרִית לְ/צִדְקִיָּהוּ
  choice: la dixième année du règne de Sédécias
  rationale: Le préfixe לְ marque la référence au règne du roi. L’ajout explicatif « du règne de » rend clairement en français la formule de datation hébraïque.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Le titre royal apposé au nom est rendu directement et conformément à l’usage français.
- source_word: הִיא הַשָּׁנָה שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: c’était la dix-huitième année
  rationale: Le pronom féminin renvoie à l’année et met en équivalence les deux systèmes de datation. Le français n’a pas besoin de reproduire la répétition hébraïque de « année ».
- source_word: לִנְבוּכַדְרֶאצַּר
  choice: du règne de Nabuchodonosor
  rationale: Dans cette formule chronologique, לְ situe l’année par rapport au règne du souverain. « Nabuchodonosor » est la forme française traditionnelle et courante du nom.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre et suit la décision doctrinale fournie, sans remplacer celui-ci par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la formule prophétique « La parole… » et clarifie les deux datations royales par « du règne de », implicite dans l’hébreu. Le tiret met lisiblement en relief leur équivalence.
