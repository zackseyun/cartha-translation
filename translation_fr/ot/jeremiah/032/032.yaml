source:
  edition: WLC
  text: עַל֩ כָּל רָעַ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י יְהוּדָ֗ה אֲשֶׁ֤ר עָשׂוּ֙ לְ/הַכְעִסֵ֔/נִי הֵ֤מָּה מַלְכֵי/הֶם֙ שָֽׂרֵי/הֶ֔ם כֹּהֲנֵי/הֶ֖ם וּ/נְבִֽיאֵי/הֶ֑ם וְ/אִ֣ישׁ יְהוּדָ֔ה וְ/יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/032.yaml
  text: because of all the evil of the sons of Israel and the sons of Judah that they did to provoke me to anger—they[a], their kings, their officials, their priests, and their prophets[c][b], and the men of Judah and the inhabitants of Jerusalem.
translation:
  language: fr
  text: à cause de tout le mal que les fils d’Israël et les fils de Juda[a] ont fait pour provoquer ma colère[b] — eux, leurs rois, leurs dirigeants, leurs prêtres et leurs prophètes, ainsi que les hommes de Juda[c] et les habitants de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le peuple d’Israël et le peuple de Juda ». L’hébreu dit littéralement « les fils d’Israël et les fils de Juda ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pour m’irriter ».
    reason: lexical_alternative
  - marker: c
    text: Ou « chaque homme de Juda ». En hébreu, « homme » est au singulier et possède ici un sens collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כָּל רָעַת
  choice: à cause de tout le mal
  rationale: Dans le contexte, עַל indique la cause du jugement annoncé au verset précédent. « Tout le mal » conserve à la fois la portée globale de כָּל et le sens moral de רָעָה.
- source_word: בְּנֵי יִשְׂרָאֵל וּבְנֵי יְהוּדָה
  choice: les fils d’Israël et les fils de Juda
  rationale: Cette formulation rend directement l’expression hébraïque « fils de » et conserve sa forme collective masculine, tout en signalant en note l’équivalent idiomatique moderne.
- source_word: אֲשֶׁר עָשׂוּ
  choice: que … ont fait
  rationale: Rendu verbal simple et direct de la proposition relative, sans ajouter une nuance absente du verbe עשה.
- source_word: לְהַכְעִסֵנִי
  choice: pour provoquer ma colère
  rationale: Le hiphil de כעס exprime l’action de provoquer à la colère. La formulation française restitue naturellement cette valeur causative.
- source_word: הֵמָּה
  choice: eux
  rationale: Le pronom indépendant reprend avec emphase les responsables. Le tiret et « eux » préservent cette reprise appositionnelle inhabituelle sans la supprimer.
- source_word: מַלְכֵיהֶם
  choice: leurs rois
  rationale: Correspondance directe du nom et du suffixe possessif.
- source_word: שָׂרֵיהֶם
  choice: leurs dirigeants
  rationale: שָׂרִים désigne ici les détenteurs de responsabilités politiques ou administratives. « Dirigeants » est actuel et suffisamment large, sans imposer le sens dynastique de « princes ».
- source_word: כֹּהֲנֵיהֶם וּנְבִיאֵיהֶם
  choice: leurs prêtres et leurs prophètes
  rationale: Rendu usuel et direct des deux groupes religieux inclus dans la liste des responsables.
- source_word: וְאִישׁ יְהוּדָה
  choice: ainsi que les hommes de Juda
  rationale: Le singulier אִישׁ possède ici une valeur collective. Le pluriel français exprime naturellement cette collectivité tout en conservant la désignation masculine du texte source.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: et les habitants de Jérusalem
  rationale: Formulation française naturelle pour le participe substantivé désignant la population résidente.
theological_decisions:
- issue: Langage collectif masculin dans בְּנֵי et אִישׁ
  choice: Conserver « fils » et « hommes » dans le texte principal.
  alternative: Employer « peuple d’Israël et peuple de Juda » puis « population de Juda ».
  rationale: Les termes hébreux ont une forme masculine et une portée collective. Le texte principal en garde la forme représentative sans prétendre que seuls des individus masculins sont nécessairement visés; les notes indiquent les équivalents collectifs possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve son caractère de proposition causale dépendant du verset précédent. Le tiret maintient la reprise emphatique et quelque peu heurtée de l’hébreu, tandis que « ainsi que » clarifie la coordination finale sans effacer la liste cumulative.
