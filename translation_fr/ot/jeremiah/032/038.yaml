  yaml_path: translation/ot/jeremiah/032/038.yaml
  text: And they will be my people[a], and I will be their God.
translation:
  language: fr
  text: Ils seront mon peuple[a], et moi, je serai leur Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ils seront pour moi un peuple, et moi, je serai pour eux Dieu » ; c’est une formule hébraïque d’alliance qui exprime une appartenance et une relation réciproques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Ils seront
  rationale: Dans cette suite de promesses prophétiques, le parfait qal précédé de la conjonction a une valeur future. « Ils seront » restitue naturellement le sens simple de היה.
- source_word: לִי לְעָם
  choice: mon peuple
  rationale: Littéralement « pour moi comme peuple » ou « à moi pour peuple » ; dans cette formule d’alliance, le français exprime naturellement cette relation d’appartenance par « mon peuple ».
- source_word: וַאֲנִי
  choice: et moi, je
  rationale: La conjonction relie les deux membres réciproques sans marquer d’opposition. La dislocation « et moi, je » conserve l’accent explicite porté par אֲנִי et l’équilibre de la formule.
- source_word: אֶהְיֶה
  choice: je serai
  rationale: L’imparfait qal à la première personne exprime ici l’engagement futur de Dieu et maintient le parallélisme verbal avec « ils seront ».
- source_word: לָהֶם לֵאלֹהִים
  choice: leur Dieu
  rationale: Littéralement « pour eux comme Dieu » ; la formule d’alliance désigne une relation déterminée et réciproque, rendue idiomatiquement en français par « leur Dieu », et non « un Dieu ».
theological_decisions:
- issue: Rendu de la formule d’alliance
  choice: Ils seront mon peuple, et moi, je serai leur Dieu.
  alternative: Ils seront pour moi un peuple, et je serai pour eux Dieu.
  rationale: Le choix retient la formulation française naturelle de la relation réciproque d’alliance tout en conservant ses deux pôles et son orientation future. La note signale la structure hébraïque plus littérale sans ajouter de précision doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « et moi, je » est naturelle en français et rend l’insistance du pronom hébreu ainsi que le parallélisme de la formule.
