source:
  edition: WLC
  text: וָ/אֶתֵּ֞ן אֶת הַ/סֵּ֣פֶר הַ/מִּקְנָ֗ה אֶל בָּר֣וּךְ בֶּן נֵרִיָּה֮ בֶּן מַחְסֵיָה֒ לְ/עֵינֵי֙ חֲנַמְאֵ֣ל דֹּדִ֔/י וּ/לְ/עֵינֵי֙ הָֽ/עֵדִ֔ים הַ/כֹּתְבִ֖ים בְּ/סֵ֣פֶר הַ/מִּקְנָ֑ה לְ/עֵינֵי֙ כָּל הַ/יְּהוּדִ֔ים הַ/יֹּשְׁבִ֖ים בַּ/חֲצַ֥ר הַ/מַּטָּרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/012.yaml
  text: Then I gave the deed of purchase to Baruch son of Neriah[a], son of Mahseiah, in the sight of Hanamel my uncle, and in the sight of the witnesses who had written in the deed of purchase[e][d][c][b], in the sight of all the Judeans who were sitting in the court of the guard.
translation:
  language: fr
  text: Puis je remis l’acte d’achat à Baruch, fils de Nériya, fils de Mahséya, sous les yeux de Hanamel, mon oncle[a], sous les yeux des témoins qui avaient écrit dans l’acte d’achat[b], et sous les yeux de tous les Judéens[c] qui étaient assis dans la cour de la garde[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu dit ici « mon oncle ». Ailleurs dans le chapitre, Hanamel est présenté comme le fils de l’oncle de Jérémie, donc comme son cousin.
    reason: cross_reference
  - marker: b
    text: 'Ou « les témoins qui écrivaient dans l’acte d’achat ». L’hébreu dit littéralement : « les témoins, ceux qui écrivent dans l’acte d’achat ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « tous les Juifs ». « Judéens » souligne ici leur appartenance au royaume de Juda.
    reason: lexical_alternative
  - marker: d
    text: Ou « la cour de la prison »; il s’agit de l’espace surveillé où Jérémie était détenu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Puis je remis
  rationale: Le wayyiqtol fait progresser le récit. « Puis » exprime naturellement la succession, et « remis » convient à la transmission formelle d’un document.
- source_word: סֵפֶר הַמִּקְנָה
  choice: l’acte d’achat
  rationale: Dans ce contexte juridique, סֵפֶר désigne un document écrit et מִקְנָה une acquisition; « acte d’achat » restitue clairement leur sens conjoint.
- source_word: בָּרוּךְ בֶּן נֵרִיָּה בֶּן מַחְסֵיָה
  choice: Baruch, fils de Nériya, fils de Mahséya
  rationale: Les noms sont translittérés en français moderne, et la chaîne généalogique hébraïque est conservée.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Cette expression garde l’image littérale des « yeux » ainsi que le caractère public et attesté de l’acte; sa répétition reproduit la formule juridique du texte.
- source_word: חֲנַמְאֵל דֹּדִי
  choice: Hanamel, mon oncle
  rationale: דּוֹד signifie normalement « oncle ». La traduction suit ici le libellé immédiat, tout en signalant en note la tension avec l’identification donnée ailleurs dans le chapitre.
- source_word: הָעֵדִים הַכֹּתְבִים בְּסֵפֶר הַמִּקְנָה
  choice: les témoins qui avaient écrit dans l’acte d’achat
  rationale: Cette formulation reste proche du participe « ceux qui écrivent » et de la préposition בְּ, sans préciser indûment qu’il s’agissait nécessairement d’une signature.
- source_word: כָּל הַיְּהוּדִים
  choice: tous les Judéens
  rationale: Dans le cadre historique du royaume de Juda, « Judéens » rend la référence géographique et politique de יְהוּדִים plus précisément que le sens religieux moderne de « Juifs ».
- source_word: הַיֹּשְׁבִים
  choice: qui étaient assis
  rationale: Le participe de ישׁב décrit ici directement les personnes présentes dans la cour; « étaient assis » en conserve le sens concret.
- source_word: חֲצַר הַמַּטָּרָה
  choice: la cour de la garde
  rationale: חָצֵר désigne une cour et מַטָּרָה le lieu surveillé où Jérémie était détenu; cette expression reste concise et conforme au contexte.
theological_decisions:
- issue: Lien de parenté entre Hanamel et Jérémie
  choice: « mon oncle », selon le sens immédiat de דֹּדִי dans ce verset
  alternative: « mon cousin » ou « mon parent » d’après Jérémie 32.7-9, où Hanamel est présenté comme le fils de l’oncle de Jérémie
  rationale: La traduction ne corrige pas silencieusement la formulation hébraïque du verset; une note conserve la tension interne du chapitre.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « sous les yeux de » est volontairement maintenue pour préserver la solennité publique et juridique de la scène. Les noms propres suivent une translittération française usuelle et cohérente.
