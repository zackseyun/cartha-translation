  text: וּ/בָ֣אוּ הַ/כַּשְׂדִּ֗ים הַ/נִּלְחָמִים֙ עַל הָ/עִ֣יר הַ/זֹּ֔את וְ/הִצִּ֜יתוּ אֶת הָ/עִ֥יר הַ/זֹּ֛את בָּ/אֵ֖שׁ וּ/שְׂרָפ֑וּ/הָ וְ/אֵ֣ת הַ/בָּתִּ֡ים אֲשֶׁר֩ קִטְּר֨וּ עַל גַּגּֽוֹתֵי/הֶ֜ם לַ/בַּ֗עַל וְ/הִסִּ֤כוּ נְסָכִים֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֖עַן הַכְעִסֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/029.yaml
  text: And the Chaldeans who are fighting against this city will come and set this city on fire and burn it[a], along with the houses on whose rooftops they burned incense to Baal and poured out drink offerings to other gods, to provoke me to anger.
translation:
  language: fr
  text: Les Chaldéens qui combattent contre cette ville viendront, y mettront le feu et la brûleront[a], ainsi que les maisons sur les toits desquelles on a brûlé de l’encens à Baal et versé des libations à d’autres dieux, afin de provoquer ma colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Babyloniens ». L’hébreu dit « les Chaldéens », terme qui désigne souvent les forces néo-babyloniennes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: C’est l’équivalent lexical direct; dans ce contexte, le terme désigne les forces néo-babyloniennes. L’alternative contextuelle « les Babyloniens » est conservée en note.
- source_word: הַנִּלְחָמִים עַל
  choice: qui combattent cette ville
  rationale: Le participe exprime une action militaire en cours. En français, « combattre cette ville » rend naturellement l’hostilité dirigée contre elle sans préciser indûment la tactique.
- source_word: וְהִצִּיתוּ אֶת הָעִיר הַזֹּאת בָּאֵשׁ וּשְׂרָפוּהָ
  choice: y mettront le feu et la brûleront
  rationale: « Mettre le feu à » est l’expression française idiomatique correspondant au hiphil de יצת avec באש. Le pronom adverbial « y » évite une répétition lourde, tandis que « la » reprend correctement le nom féminin « ville ».
- source_word: וְאֵת הַבָּתִּים
  choice: ainsi que les maisons
  rationale: Cette formulation relie clairement le second objet à l’action de brûler tout en restant naturelle en français.
- source_word: אֲשֶׁר קִטְּרוּ עַל גַּגּוֹתֵיהֶם
  choice: sur les toits desquelles on a brûlé de l’encens
  rationale: Le piel de קטר désigne couramment l’action de brûler de l’encens ou une offrande produisant de la fumée. Le pronom indéfini « on » respecte l’absence de sujet explicite dans la relative hébraïque sans imposer un antécédent précis.
- source_word: לַבַּעַל
  choice: en l’honneur de Baal
  rationale: La préposition indique le destinataire divin de l’offrande. « En l’honneur de » est idiomatique dans le contexte cultuel et ne change pas le sens.
- source_word: וְהִסִּכוּ נְסָכִים
  choice: et versé des offrandes de vin
  rationale: L’expression désigne l’action rituelle de verser des libations. « Offrandes de vin » est plus accessible que « libations » et explicite naturellement la forme habituelle de ces offrandes liquides.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: à d’autres dieux
  rationale: « D’autres dieux » correspond directement à l’hébreu, sans introduire la nuance interprétative de « dieux étrangers ».
- source_word: לְמַעַן הַכְעִסֵנִי
  choice: afin de provoquer ma colère
  rationale: La formulation conserve la valeur de but ou de résultat de למען et la force causative du hiphil de כעס, tout en étant naturelle en français.
theological_decisions:
- issue: La réaction divine face à l’idolâtrie
  choice: afin de provoquer ma colère
  alternative: de manière à m’irriter
  rationale: L’hébreu présente explicitement les actes idolâtres comme provoquant la colère de Dieu. La traduction maintient cette dimension personnelle et judiciaire sans l’atténuer ni l’amplifier.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit étroitement la progression de l’hébreu tout en évitant les lourdeurs. Le futur rend la séquence prophétique; le présent du participe dans « qui combattent » marque l’action militaire déjà en cours.
