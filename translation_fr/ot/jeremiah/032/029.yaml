  terminology: « Chaldéens », « Baal », « d’autres dieux » et « provoquer ma colère » conviennent. La note sur « Babyloniens » préserve utilement l’alternative contextuelle. « Libations » rend avec précision נסכים sans ajouter « vin », absent du texte.
