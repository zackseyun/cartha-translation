  text: וַ/יָּבֹ֜אוּ וַ/יִּֽרְשׁ֣וּ אֹתָ֗/הּ וְ/לֹֽא שָׁמְע֤וּ בְ/קוֹלֶ֨/ךָ֙ ו/ב/תרות/ך לֹא הָלָ֔כוּ אֵת֩ כָּל אֲשֶׁ֨ר צִוִּ֧יתָה לָ/הֶ֛ם לַ/עֲשׂ֖וֹת לֹ֣א עָשׂ֑וּ וַ/תַּקְרֵ֣א אֹתָ֔/ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/023.yaml
  text: They came in and took possession of it[a], but they did not listen to your voice, and they did not walk in your law. They did not do all that you commanded them to do[b], and you brought upon them all this disaster.
translation:
  language: fr
  text: Ils sont entrés dans le pays et en ont pris possession. Mais ils n’ont pas écouté ta voix et n’ont pas suivi ta loi[a]. Ils n’ont rien fait de tout ce que tu leur avais ordonné de faire. Et tu as fait venir sur eux tout ce malheur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils n’ont pas marché dans tes lois ». Le mot hébreu traduit par « loi » peut aussi signifier « instruction » ou « enseignement » ; il est ici au pluriel.'
    reason: Précision lexicale et conservation de la métaphore hébraïque.
  - marker: b
    text: 'Littéralement : « tu as appelé sur eux tout ce malheur », expression qui signifie que Dieu l’a fait venir sur eux.'
    reason: Explication d’un idiome hébreu qui serait obscur s’il était reproduit mot à mot.
lexical_decisions:
- source_word: וַיָּבֹאוּ וַיִּרְשׁוּ אֹתָהּ
  choice: Ils sont entrés dans le pays et en ont pris possession
  rationale: Le verbe בוא exprime l’entrée dans le pays mentionné dans le contexte, et ירשׁ désigne ici sa prise de possession effective. L’explicitation « dans le pays » donne en français un antécédent naturel au pronom hébreu féminin.
- source_word: וְלֹא שָׁמְעוּ בְקוֹלֶךָ
  choice: ils n’ont pas écouté ta voix
  rationale: Cette formulation conserve l’image relationnelle et l’expression hébraïque, qui reste naturelle en français biblique moderne.
- source_word: וּבְתוֹרֹתֶךָ לֹא הָלָכוּ
  choice: ils n’ont pas suivi ta loi
  rationale: Littéralement, le texte parle de ne pas « marcher dans » les torot de Dieu. « Suivre ta loi » rend naturellement l’idée de régler sa conduite sur l’enseignement divin; le singulier collectif convient au français, tandis qu’une note signale la portée de תורה et la forme plurielle du texte.
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתָה לָהֶם לַעֲשׂוֹת לֹא עָשׂוּ
  choice: Ils n’ont rien fait de tout ce que tu leur avais ordonné de faire
  rationale: La tournure française restitue avec force la négation portant sur la totalité des commandements, sans la lourdeur d’une reproduction mot à mot.
- source_word: וַתַּקְרֵא אֹתָם אֵת כָּל הָרָעָה הַזֹּאת
  choice: Alors, tu as fait venir sur eux tout ce malheur
  rationale: 'Le double complément de קרא est ici idiomatique: Dieu fait survenir le jugement. « Faire venir » garde une partie de l’image verbale sans produire en français une expression obscure. רעה désigne ici un malheur ou une calamité, non le mal moral.'
theological_decisions:
- issue: Sens de תורה dans le cadre de l’alliance
  choice: ta loi
  alternative: tes instructions; ton enseignement
  rationale: Le contexte concerne les obligations données par Dieu à Israël. « Loi » exprime leur caractère normatif, tandis que la note préserve le sens plus large d’« instruction » et signale que la forme hébraïque est plurielle.
- issue: Nature de הָרָעָה comme jugement divin
  choice: tout ce malheur
  alternative: toute cette catastrophe; tout ce désastre; tout ce mal
  rationale: Dans ce contexte, רעה désigne le malheur subi en conséquence de la désobéissance. Cette traduction évite de faire croire que Dieu accomplit un mal moral, tout en maintenant explicitement qu’il fait venir le jugement.
- issue: Lien logique de la dernière proposition
  choice: Alors
  alternative: et
  rationale: Le waw hébreu enchaîne les faits et, dans le contexte, le dernier acte apparaît comme la conséquence du refus d’obéir. « Alors » exprime ce rapport sans ajouter une causalité plus précise que celle du passage.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement divin correspond à l’adresse directe de la prière. La métaphore peu naturelle « marcher dans la loi » est rendue par « suivre », avec sa forme littérale en note. Les marqueurs [a] et [b] figurent dans le texte.
