  text: And I charged Baruch before their eyes[a], saying[b],
translation:
  language: fr
  text: Et je donnai cet ordre à Baruch sous leurs yeux[a] :[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant eux », c’est-à-dire publiquement, en présence des témoins.
