lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: Je donnai alors cet ordre
  rationale: Le verbe צוה exprime ici un ordre ou une instruction solennelle. Cette formulation naturelle conserve la force du verbe dans le cadre juridique et public du récit; le waw narratif situe l’action dans la succession passée.
- source_word: אֶת
  choice: '[marque de l’objet direct, non traduite]'
  rationale: La particule désigne Baruch comme complément d’objet direct et n’appelle aucun équivalent distinct en français.
- source_word: בָּרוּךְ
  choice: Baruch
  rationale: Le nom propre est rendu selon sa forme française biblique usuelle.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: L’expression garde l’image concrète de l’hébreu et indique que l’ordre est donné publiquement, en présence des témoins.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français actuel, les deux-points introduisent naturellement les paroles qui suivent et rendent la fonction discursive de l’infinitif hébreu sans le calque pesant « en disant ».
