  source_fidelity: 'Le sens fondamental est fidèle : l’annonce est imminente, l’impératif porte sur le champ d’Anatoth, et מִשְׁפַּט הַגְּאֻלָּה est bien rendu comme un droit familial à portée juridique. Toutefois, dans l’hébreu, « ton oncle » qualifie Shalloum, non Hanamel (confirmé par le v. 8, où Hanamel est appelé le fils de l’oncle de Jérémie). La formulation française actuelle peut faire de Hanamel l’oncle de Jérémie.'
