source:
  edition: WLC
  text: הִנֵּ֣ה חֲנַמְאֵ֗ל בֶּן שַׁלֻּם֙ דֹּֽדְ/ךָ֔ בָּ֥א אֵלֶ֖י/ךָ לֵ/אמֹ֑ר קְנֵ֣ה לְ/ךָ֗ אֶת שָׂדִ/י֙ אֲשֶׁ֣ר בַּ/עֲנָת֔וֹת כִּ֥י לְ/ךָ֛ מִשְׁפַּ֥ט הַ/גְּאֻלָּ֖ה לִ/קְנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/007.yaml
  text: Look[a], Hanamel son of Shallum, your uncle, is coming to you, saying, ‘Buy my field that is in Anathoth, for the right of redemption to buy it belongs to you.’
translation:
  language: fr
  text: 'Voici que Hanamel, fils de Shalloum, qui est ton oncle, vient te trouver pour te dire : « Achète mon champ qui est à Anatoth, car c’est à toi que revient le droit de rachat[a] pour l’acquérir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « droit de rédemption » ou « droit de reprise ». L’hébreu désigne le droit, fondé sur la parenté, de racheter une propriété familiale.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Introduit avec vivacité un événement imminent sans employer l’archaïque « voici, regarde ».
- source_word: חֲנַמְאֵל
  choice: Hanamel
  rationale: Translittération française claire du nom propre hébreu.
- source_word: דֹּדְךָ
  choice: ton oncle
  rationale: Dans ce contexte de propriété familiale, דּוֹד désigne l’oncle et non le bien-aimé.
- source_word: בָּא אֵלֶיךָ
  choice: vient te trouver
  rationale: Le participe présente une venue imminente; cette formulation est naturelle en français et exprime le mouvement vers Jérémie.
- source_word: לֵאמֹר
  choice: pour te dire
  rationale: Introduit naturellement le discours direct en français.
- source_word: קְנֵה לְךָ
  choice: Achète
  rationale: Rend directement et clairement l’impératif de קנה; le pronom réfléchi implicite n’a pas besoin d’être exprimé.
- source_word: שָׂדִי
  choice: mon champ
  rationale: Conserve la désignation concrète de la propriété.
- source_word: בַּעֲנָתוֹת
  choice: à Anatoth
  rationale: Forme française traditionnelle et intelligible du nom de lieu; la préposition « à » convient à une localité.
- source_word: מִשְׁפַּט הַגְּאֻלָּה
  choice: le droit de rachat
  rationale: Exprime le droit juridiquement reconnu du proche parent de racheter un bien familial, sans spiritualiser גְּאֻלָּה.
- source_word: כִּי לְךָ
  choice: car c’est à toi que revient
  rationale: Rend la raison et l’attribution du droit avec une tournure française idiomatique.
- source_word: לִקְנוֹת
  choice: pour l’acquérir
  rationale: Rend l’infinitif et explicite son objet, le champ, au moyen du pronom « l’ ».
theological_decisions:
- issue: Sens de גְּאֻלָּה dans le droit foncier familial
  choice: rachat au sens juridique fondé sur la parenté
  alternative: rédemption; droit de reprise
  rationale: Le contexte concerne l’acquisition d’une terre familiale par le parent habilité. « Rachat » garde la notion légale sans lui imposer un sens spirituel ultérieur.
- issue: Portée de מִשְׁפַּט
  choice: un droit reconnu qui revient à Jérémie
  alternative: une obligation juridique stricte imposée à Jérémie
  rationale: Le terme possède une force juridique, mais le verset ne tranche pas à lui seul la tension entre droit et devoir du proche parent; la formulation française évite de la résoudre abusivement.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici que » préserve l’immédiateté de l’annonce; « droit de rachat » communique le cadre juridique familial sans jargon excessif.
