source:
  edition: WLC
  text: כִּֽי הָי֨וּ בְנֵֽי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י יְהוּדָ֗ה אַ֣ךְ עֹשִׂ֥ים הָ/רַ֛ע בְּ/עֵינַ֖/י מִ/נְּעֻרֹֽתֵי/הֶ֑ם כִּ֣י בְנֵֽי יִשְׂרָאֵ֗ל אַ֣ךְ מַכְעִסִ֥ים אֹתִ֛/י בְּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/030.yaml
  text: For the sons of Israel and the sons of Judah have done only what was evil in my eyes from their youth[a], for the sons of Israel have only provoked me by the work of their hands[b], declares Yahweh.
translation:
  language: fr
  text: Car les fils d’Israël et les fils de Juda n’ont fait que ce qui est mal à mes yeux depuis leur jeunesse[a] ; car les fils d’Israël n’ont fait que m’irriter par l’œuvre de leurs mains[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « les Israélites » ou « le peuple d’Israël », et « le peuple de Juda ». L’hébreu dit littéralement « les fils d’Israël » et « les fils de Juda ».
    reason: lexical_alternative
  - marker: b
    text: « L’œuvre de leurs mains » peut aussi désigner plus précisément les idoles qu’ils ont fabriquées.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve la désignation collective littérale et son parallèle avec « les fils de Juda » ; une note signale les formulations françaises plus courantes.
- source_word: וּבְנֵי יְהוּדָה
  choice: et les fils de Juda
  rationale: Préserve le parallélisme formel ainsi que la distinction entre Israël et Juda.
- source_word: אַךְ
  choice: ne… que
  rationale: Rend naturellement en français la valeur restrictive et intensive répétée dans les deux propositions.
- source_word: עֹשִׂים הָרַע בְּעֵינַי
  choice: n’ont fait que ce qui est mal à mes yeux
  rationale: Conserve l’image hébraïque du jugement porté par Dieu tout en restant clair en français moderne.
- source_word: מִנְּעֻרֹתֵיהֶם
  choice: depuis leur jeunesse
  rationale: Rend l’ancienneté continue de cette conduite, probablement depuis les débuts du peuple, sans expliciter davantage que l’hébreu.
- source_word: מַכְעִסִים אֹתִי
  choice: m’irriter
  rationale: Exprime le fait de susciter la colère divine ; l’infinitif après « ne faire que » rend naturellement la construction participiale.
- source_word: בְּמַעֲשֵׂה יְדֵיהֶם
  choice: par l’œuvre de leurs mains
  rationale: Maintient l’expression concrète de l’hébreu et laisse ouverte sa portée entre les actions humaines en général et les idoles fabriquées.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend la formule prophétique avec solennité et conserve le nom divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Portée de « les fils d’Israël » dans la seconde proposition
  choice: Répéter « les fils d’Israël » sans ajouter Juda.
  alternative: Employer « ils » ou expliciter « Israël et Juda ».
  rationale: L’hébreu répète précisément בְנֵי יִשְׂרָאֵל. Cette répétition peut avoir une portée représentative ou constituer un resserrement rhétorique ; la traduction ne tranche pas.
- issue: Portée de « l’œuvre de leurs mains »
  choice: Conserver l’expression générale dans le texte et signaler en note sa possible référence aux idoles.
  alternative: Traduire directement « par les idoles qu’ils ont fabriquées ».
  rationale: Le contexte permet une allusion à l’idolâtrie, mais l’expression hébraïque peut aussi viser plus largement leurs actes ; l’ambiguïté doit rester perceptible.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « ne… que » reproduit la double restriction de אַךְ. Le point-virgule évite une phrase artificiellement coupée, et « oui » donne à la seconde occurrence de כִּי une valeur explicative ou emphatique naturelle sans effacer son lien avec la première proposition.
