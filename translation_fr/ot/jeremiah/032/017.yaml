  text: אֲהָהּ֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּ֣ה אַתָּ֣ה עָשִׂ֗יתָ אֶת הַ/שָּׁמַ֨יִם֙ וְ/אֶת הָ/אָ֔רֶץ בְּ/כֹֽחֲ/ךָ֙ הַ/גָּד֔וֹל וּ/בִֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה לֹֽא יִפָּלֵ֥א מִמְּ/ךָ֖ כָּל דָּבָֽר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/017.yaml
  text: Ah, Lord GOD! Look, you yourself made the heavens and the earth by your great power and by your outstretched arm. Nothing is too difficult for you.
translation:
  language: fr
  text: Ah ! Seigneur DIEU ! Voici, c’est toi qui as fait le ciel et la terre par ta grande puissance et par ton bras étendu. Rien n’est trop difficile pour toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲהָהּ
  choice: Ah !
  rationale: Conserve l’interjection de prière, qui exprime ici une vive émotion sans en préciser artificiellement la nuance.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur DIEU
  rationale: Rend le titre אֲדֹנָי par « Seigneur » et distingue le nom divin יהוה selon la convention typographique française « DIEU ».
- source_word: הִנֵּה אַתָּה
  choice: C’est toi qui
  rationale: Formulation française naturelle qui préserve l’insistance portée par le pronom « toi » et la valeur présentative de הִנֵּה.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: le ciel et la terre
  rationale: Expression consacrée et naturelle en français pour désigner l’ensemble de la création; le pluriel morphologique hébreu שָׁמַיִם se rend normalement par le singulier collectif « ciel ».
- source_word: בִזְרֹעֲךָ הַנְּטוּיָה
  choice: par ton bras étendu
  rationale: Préserve l’image anthropomorphique biblique de la puissance divine en action.
- source_word: לֹא יִפָּלֵא מִמְּךָ כָּל דָּבָר
  choice: Rien n’est trop difficile pour toi
  rationale: 'Exprime idiomatiquement le sens de פלא au niphal avec מִן : aucune chose ne dépasse la capacité de Dieu.'
theological_decisions:
- issue: Portée de כָּל דָּבָר
  choice: Rien n’est trop difficile pour toi
  alternative: Aucune chose ne t’est impossible
  rationale: La formulation choisie reste proche de l’idée qu’aucune affaire ou réalité n’est extraordinairement difficile au point d’échapper à Dieu, sans développer davantage l’affirmation.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste fluide pour une lecture publique, tout en conservant l’interjection, l’insistance sur « toi » et l’image du bras étendu.
