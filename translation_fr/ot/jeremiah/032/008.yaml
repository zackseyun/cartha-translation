id: JER.32.8
reference: Jeremiah 32:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבֹ֣א אֵ֠לַ/י חֲנַמְאֵ֨ל בֶּן דֹּדִ֜/י כִּ/דְבַ֣ר יְהוָה֮ אֶל חֲצַ֣ר הַ/מַּטָּרָה֒ וַ/יֹּ֣אמֶר אֵלַ֡/י קְנֵ֣ה נָ֠א אֶת שָׂדִ֨/י אֲשֶׁר בַּ/עֲנָת֜וֹת אֲשֶׁ֣ר בְּ/אֶ֣רֶץ בִּנְיָמִ֗ין כִּֽי לְ/ךָ֞ מִשְׁפַּ֧ט הַ/יְרֻשָּׁ֛ה וּ/לְ/ךָ֥ הַ/גְּאֻלָּ֖ה קְנֵה לָ֑/ךְ וָ/אֵדַ֕ע כִּ֥י דְבַר יְהוָ֖ה הֽוּא־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/008.yaml
  text: Then Hanamel the son of my uncle came to me in the court of the guard[a], according to the word of Yahweh, and he said to me, “Please buy my field that is at Anathoth, in the land of Benjamin, for the right of inheritance is yours and the redemption is yours. Buy it for yourself.” Then I knew that this was the word of Yahweh.
translation:
  language: fr
  text: 'Hanamel, le fils de mon oncle, vint donc me trouver dans la cour de la garde, conformément à la parole de Yahweh. Il me dit : « Achète, je te prie, mon champ qui se trouve à Anatoth, dans le territoire de Benjamin, car tu as le droit d’en hériter et tu as le droit de rachat[a]. Achète-le pour toi. » Je reconnus alors que c’était la parole de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le rachat t’appartient ». Il s’agit du droit — et éventuellement de la responsabilité — qu’avait un proche parent de racheter un bien familial.'
    reason: Clarifier la portée juridique et familiale de גְּאֻלָּה tout en conservant l’ambiguïté entre droit et devoir.
lexical_decisions:
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole de Yahweh
  rationale: La préposition כְּ exprime ici la conformité à l’annonce divine précédente. Cette formulation conserve le lien narratif sans réduire דָּבָר à une simple prédiction.
- source_word: חֲצַר הַמַּטָּרָה
  choice: la cour de la garde
  rationale: L’expression désigne la cour surveillée où Jérémie était détenu. « Cour de la garde » reste proche de l’hébreu sans préciser abusivement qu’il s’agissait d’une prison.
- source_word: קְנֵה נָא
  choice: Achète, je te prie
  rationale: קנה signifie ici acheter un bien foncier, tandis que נָא atténue l’impératif et lui donne la force d’une requête.
- source_word: שָׂדִי
  choice: mon champ
  rationale: Le sens ordinaire de שָׂדֶה convient au contexte d’une transaction foncière et se rend naturellement par « champ ».
- source_word: בַּעֲנָתוֹת אֲשֶׁר בְּאֶרֶץ בִּנְיָמִין
  choice: qui se trouve à Anatoth, dans le territoire de Benjamin
  rationale: « À Anatoth » situe le champ, et « territoire de Benjamin » rend ici אֶרֶץ de manière naturelle en français géographique.
- source_word: מִשְׁפַּט הַיְרֻשָּׁה
  choice: le droit d’en hériter
  rationale: מִשְׁפָּט exprime un droit ou titre légal et יְרֻשָּׁה l’héritage ou la possession. Le pronom « en » explicite naturellement le rapport au champ.
- source_word: הַגְּאֻלָּה
  choice: le droit de rachat
  rationale: Dans ce contexte familial et foncier, גְּאֻלָּה désigne le rachat exercé par un proche parent. L’ajout de « droit » rend en français la portée juridique implicite, sans décider s’il s’agit uniquement d’un privilège ou aussi d’un devoir.
- source_word: קְנֵה לָךְ
  choice: Achète-le pour toi
  rationale: Le datif לָךְ a ici le sens idiomatique « pour toi-même ». L’objet est repris explicitement pour obtenir une phrase française complète.
- source_word: וָאֵדַע כִּי דְבַר יְהוָה הוּא
  choice: Je reconnus alors que c’était la parole de Yahweh
  rationale: Le verbe ידע marque ici la reconnaissance, à travers l’accomplissement de l’annonce précédente, de l’origine divine de la parole.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le tétragramme comme nom divin. « Yahweh » préserve sa fonction de nom propre sans lui substituer un titre.
- issue: Portée juridique de הַגְּאֻלָּה
  choice: le droit de rachat
  alternative: le devoir de rachat / le rachat
  rationale: Le cadre juridique israélite associe le proche parent au rachat du patrimoine familial. Le verset met explicitement en avant l’habilitation de Jérémie; « droit de rachat » préserve cette idée sans nier qu’une responsabilité familiale puisse aussi être impliquée.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe reste proche du mouvement de l’hébreu tout en évitant les tournures juridiques opaques. Le marqueur [a] figure dans le texte principal.
