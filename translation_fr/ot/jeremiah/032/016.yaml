source:
  edition: WLC
  text: וָ/אֶתְפַּלֵּ֖ל אֶל יְהוָ֑ה אַחֲרֵ֤י תִתִּ/י֙ אֶת סֵ֣פֶר הַ/מִּקְנָ֔ה אֶל בָּר֥וּךְ בֶּן נֵרִיָּ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/016.yaml
  text: After I had given the deed of purchase to Baruch son of Neriah[a], I prayed to Yahweh, saying,
translation:
  language: fr
  text: 'Après avoir remis l’acte d’achat à Baruch, fils de Néria, j’ai prié Yahweh en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל
  choice: j’ai prié
  rationale: Le hitpael de פלל signifie couramment « prier ». Cette formulation naturelle n’ajoute aucune intensité absente de l’hébreu.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: La préposition אֶל marque le destinataire de la prière, rendu naturellement en français sans répéter « à » après « prier » ; le tétragramme est translittéré « Yahweh ».
- source_word: אַחֲרֵי תִתִּי
  choice: Après avoir remis
  rationale: La construction temporelle indique une action achevée avant la prière. « Après avoir remis » exprime clairement cette antériorité en français.
- source_word: סֵפֶר הַמִּקְנָה
  choice: l’acte d’achat
  rationale: סֵפֶר désigne ici un document écrit et הַמִּקְנָה en précise la fonction juridique liée à l’achat. « Acte d’achat » est concis et idiomatique.
- source_word: אֶל בָּרוּךְ בֶּן נֵרִיָּה
  choice: à Baruch, fils de Néria
  rationale: La relation patronymique est conservée dans une formulation française naturelle ; les noms propres sont translittérés selon leur forme usuelle en français.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit le contenu de la prière au verset suivant. « En ces termes : » remplit naturellement cette fonction en français tout en préparant le discours direct.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » préserve ici le caractère de nom propre sans importer une interprétation confessionnelle supplémentaire.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe temporelle établit nettement la succession des actions, et le deux-points annonce la prière qui commence au verset suivant.
