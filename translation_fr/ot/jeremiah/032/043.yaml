id: JER.32.43
reference: Jeremiah 32:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נִקְנָ֥ה הַ/שָּׂדֶ֖ה בָּ/אָ֣רֶץ הַ/זֹּ֑את אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים שְׁמָמָ֥ה הִיא֙ מֵ/אֵ֤ין אָדָם֙ וּ/בְהֵמָ֔ה נִתְּנָ֖ה בְּ/יַ֥ד הַ/כַּשְׂדִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/043.yaml
  text: Fields will be bought in this land of which you say[a], ‘It is a desolation, without man or beast[b]; it has been given into the hand of the Chaldeans.’
translation:
  language: fr
  text: 'Des champs seront achetés dans ce pays dont vous dites : « C’est une terre dévastée, où il n’y a ni être humain ni bétail[a] ; elle a été livrée aux mains des Chaldéens[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sans être humain ni bête » ; l’expression indique l’absence de toute population et de tout bétail.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des Babyloniens ». Hébreu : « des Chaldéens ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְנָה הַשָּׂדֶה
  choice: Des champs seront achetés
  rationale: Le niphal de קנה exprime ici l’achat au passif. Le singulier défini הַשָּׂדֶה peut avoir une valeur collective, que le pluriel français rend naturellement dans le contexte des transactions foncières. « De nouveau » n’est pas ajouté, car cette idée vient du contexte plutôt que des mots du verset.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: dans ce pays
  rationale: « Pays » désigne naturellement ici le territoire concerné, sans réduire אֶרֶץ à une simple parcelle de terre.
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: dont vous dites
  rationale: Cette tournure française introduit clairement l’appréciation formulée par les interlocuteurs au sujet du pays.
- source_word: שְׁמָמָה הִיא
  choice: C’est une terre dévastée
  rationale: Le substantif שְׁמָמָה décrit un état de dévastation. La formulation nominale française demeure naturelle tout en conservant cette force.
- source_word: מֵאֵין אָדָם וּבְהֵמָה
  choice: où il n’y a ni être humain ni bétail
  rationale: La formule exprime l’absence totale d’habitants humains et d’animaux domestiques. « Être humain » rend le sens générique de אָדָם, tandis que « bétail » convient à בְּהֵמָה dans ce contexte territorial.
- source_word: נִתְּנָה בְּיַד
  choice: elle a été livrée aux mains de
  rationale: Le parfait passif indique que la terre a été remise au pouvoir de l’ennemi, avec un résultat encore présent. « Livrée aux mains de » conserve l’image hébraïque dans un français idiomatique.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Ce terme garde la désignation historique et ethnique précise du texte hébreu ; « Babyloniens » est une clarification possible.
theological_decisions:
- issue: Sens générique de אָדָם dans la formule d’absence
  choice: être humain
  alternative: homme
  rationale: Dans ce contexte, אָדָם ne désigne pas spécifiquement un individu masculin, mais toute présence humaine. « Être humain » transmet ce sens sans résoudre autrement la tension entre l’humanité et le bétail.
- issue: Valeur collective de הַשָּׂדֶה
  choice: des champs
  alternative: le champ
  rationale: Le contexte de restauration et de multiples achats fonciers favorise une lecture collective du singulier hébreu, sans introduire l’idée non exprimée de répétition.
translation_notes:
  register: Français international moderne, digne et accessible. Le passif et l’image des « mains » préservent la forme du texte, tandis que la syntaxe reste naturelle. Les marqueurs [a] et [b] sont placés immédiatement après les expressions qu’ils expliquent.
