  text: So I wrote it in the deed[a], sealed it, called witnesses, and weighed out the silver on the scales.
translation:
  language: fr
  text: J’écrivis l’acte[a], le scellai, fis appel à des témoins et pesai l’argent à la balance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le rouleau » ou « dans le document » ; le mot hébreu סֵפֶר est un terme général désignant un écrit. Ici, il s’agit probablement de l’acte d’achat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶכְתֹּב
  choice: Je consignai donc
  rationale: Le wayyiqtol qal à la première personne poursuit la séquence narrative. « Consigner » exprime naturellement l’action de mettre l’opération par écrit dans un cadre juridique.
- source_word: בַּסֵּפֶר
  choice: l’acte
  rationale: סֵפֶר est un terme général désignant un écrit, un document ou un rouleau. Dans le contexte immédiat d’un achat foncier, « l’acte » rend au mieux sa fonction juridique, tout en laissant l’étendue lexicale en note.
- source_word: וָאֶחְתֹּם
  choice: le scellai
  rationale: חתם désigne ici le scellement juridique du document. Le pronom reprend naturellement « l’acte ».
- source_word: וָאָעֵד עֵדִים
  choice: pris des témoins
  rationale: Dans ce contexte juridique, le hiphil de עוד avec עֵדִים signifie faire attester l’opération par des témoins. « Prendre des témoins » est une formulation française claire et concise.
- source_word: וָאֶשְׁקֹל
  choice: pesai
  rationale: שקל décrit la pesée du métal remis en paiement; le complément et la balance rendent l’idée commerciale explicite sans ajout.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: כֶּסֶף désigne littéralement l’argent-métal et, par extension, la monnaie. En français, « l’argent », associé à la pesée, conserve naturellement les deux dimensions.
- source_word: בְּמֹאזְנָיִם
  choice: sur une balance
  rationale: מֹאזְנַיִם désigne l’instrument de pesée à deux plateaux. « Sur une balance » est idiomatique en français moderne et conserve l’image concrète.
