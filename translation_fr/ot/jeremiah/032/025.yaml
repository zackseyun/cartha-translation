source:
  edition: WLC
  text: וְ/אַתָּ֞ה אָמַ֤רְתָּ אֵלַ/י֙ אֲדֹנָ֣/י יְהוִ֔ה קְנֵֽה לְ/ךָ֧ הַ/שָּׂדֶ֛ה בַּ/כֶּ֖סֶף וְ/הָעֵ֣ד עֵדִ֑ים וְ/הָ/עִ֥יר נִתְּנָ֖ה בְּ/יַ֥ד הַ/כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/025.yaml
  text: Yet you yourself said to me[a], Lord Yahweh[b], ‘Buy the field for yourself with silver and call witnesses,’ though the city has been given into the hand of the Chaldeans.
translation:
  language: fr
  text: 'Pourtant, c’est toi qui m’as dit, Seigneur Yahweh[a] : « Achète pour toi le champ avec de l’argent et fais venir des témoins », alors même que la ville a été livrée aux Chaldéens[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Seigneur DIEU ». L’hébreu associe le titre « Seigneur » au nom divin Yahweh.
    reason: divine_name
  - marker: b
    text: 'Ou, plus littéralement : « et la ville a été livrée entre les mains des Chaldéens ». La conjonction hébraïque peut aussi se comprendre « tandis que ». Les Chaldéens désignent ici la puissance babylonienne.'
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: וְאַתָּה
  choice: Pourtant, c’est toi qui
  rationale: La conjonction et le pronom indépendant marquent ici le contraste et l’insistance dans la plainte de Jérémie.
- source_word: אָמַרְתָּ אֵלַי
  choice: m’as dit
  rationale: Le passé composé convient naturellement en français au rappel d’une parole antérieure encore au cœur de la prière.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: « Seigneur » traduit אֲדֹנָי et « Yahweh » représente explicitement le nom divin יהוה, sans confondre les deux éléments du titre.
- source_word: קְנֵה לְךָ הַשָּׂדֶה
  choice: Achète pour toi le champ
  rationale: Cette formulation rend l’impératif קְנֵה ainsi que לְךָ, qui souligne l’implication personnelle de Jérémie.
- source_word: בַּכֶּסֶף
  choice: avec de l’argent
  rationale: כֶּסֶף signifie littéralement « argent » au sens du métal et, par extension, du moyen de paiement; la formulation française conserve les deux résonances.
- source_word: וְהָעֵד עֵדִים
  choice: et prends des témoins
  rationale: Le hiphil de עוד avec עֵדִים demande de faire intervenir officiellement des témoins; « prends des témoins » est naturel dans ce contexte juridique.
- source_word: וְהָעִיר
  choice: alors même que la ville
  rationale: La conjonction hébraïque est formellement « et », mais le contexte lui donne une force concessive qui exprime la tension de la plainte.
- source_word: נִתְּנָה
  choice: a été livrée
  rationale: Le niphal accompli présente la ville comme déjà remise au pouvoir ennemi; « a été livrée » rend naturellement ce résultat présent.
- source_word: בְּיַד
  choice: aux
  rationale: Littéralement « dans la main de »; en français courant, « livrée aux » exprime clairement le transfert sous leur pouvoir sans lourdeur idiomatique.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Le terme historique précis est conservé plutôt que remplacé dans le texte par « Babyloniens ».
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU / Seigneur, l’Éternel
  rationale: Le choix distingue le titre אֲדֹנָי du nom propre יהוה et rend ce dernier explicitement, sans effacer son caractère de nom divin.
- issue: Rapport entre l’ordre d’acheter et la chute de la ville
  choice: alors même que
  alternative: et / tandis que
  rationale: La formulation rend la valeur concessive suggérée par le contexte tout en signalant en note que la conjonction hébraïque reste plus simple et donc ambiguë.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « c’est toi qui » garde l’insistance du pronom hébreu; « alors même que » fait entendre la tension de la prière sans masquer, grâce à la note, l’ambiguïté de la conjonction.
