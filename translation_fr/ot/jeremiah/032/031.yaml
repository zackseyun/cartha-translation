    issue: Ajout de « je dois »
    rationale: Le texte hébreu emploie un infinitif précédé de ל, susceptible d’exprimer finalité ou résultat, mais non une obligation explicite. « Je dois » interprète et restreint indûment cette ambiguïté.
  - severity: low
    issue: Note de bas de page imprécise quant au littéral
    rationale: « De devant ma face » ne correspond pas exactement à « de devant moi » dans le texte principal, et « chasser » est plus interprétatif que le verbe hébreu « écarter/ôter ». La note est ajustée pour distinguer littéral et alternative.
