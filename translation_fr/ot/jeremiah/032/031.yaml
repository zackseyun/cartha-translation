- from: Car cette ville n’a cessé de provoquer ma colère et ma fureur depuis le jour où ils l’ont bâtie jusqu’à aujourd’hui, si bien que je dois l’écarter de devant moi.[a]
  to: Car cette ville a suscité ma colère et ma fureur depuis le jour où ils l’ont bâtie jusqu’à ce jour, au point que je l’écarte de devant ma face.[a]
  rationale: La révision retire l’obligation ajoutée par « je dois » et rend la relation consécutive de façon idiomatique avec « au point que », sans imposer une lecture strictement finaliste. Elle conserve l’imagerie anthropomorphique en rétablissant « ma face » dans le texte, tandis que la note donne une alternative française courante.
