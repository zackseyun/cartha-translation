  variant: modern international French
source:
  edition: WLC
  text: כִּ֧י עַל אַפִּ֣/י וְ/עַל חֲמָתִ֗/י הָ֤יְתָה לִּ/י֙ הָ/עִ֣יר הַ/זֹּ֔את לְ/מִן הַ/יּוֹם֙ אֲשֶׁ֣ר בָּנ֣וּ אוֹתָ֔/הּ וְ/עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה לַ/הֲסִירָ֖/הּ מֵ/עַ֥ל פָּנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/031.yaml
  text: For this city has been to me a cause of my anger and my wrath from the day they built it even to this day[b][a], so that I should remove it from before my face.
translation:
  language: fr
  text: Car cette ville a suscité ma colère et ma fureur depuis le jour où ils l’ont bâtie jusqu’à ce jour, au point que je l’écarte de devant ma face.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’écarter de dessus ma face »; ou : « l’écarter de ma présence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison du jugement énoncé dans le contexte précédent.
- source_word: עַל אַפִּי וְעַל חֲמָתִי
  choice: n’a cessé de provoquer ma colère et ma fureur
  rationale: L’expression hébraïque, littéralement « sur ma colère et sur ma fureur », indique idiomatiquement que la ville a constamment suscité la colère de Dieu. La tournure française rend aussi la durée qui va de sa construction jusqu’au présent.
- source_word: אַפִּי
  choice: ma colère
  rationale: אַף désigne littéralement le nez ou les narines, mais exprime couramment la colère par métonymie.
- source_word: חֲמָתִי
  choice: ma fureur
  rationale: חֵמָה évoque une colère ardente; « fureur » maintient l’intensité et se distingue naturellement de « colère ».
- source_word: הָיְתָה לִּי
  choice: n’a cessé de provoquer
  rationale: La construction décrit la relation persistante de la ville à Dieu depuis sa fondation jusqu’au jour présent; cette formulation française en exprime naturellement la continuité sans reproduire maladroitement « a été pour moi ».
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּנוּ אוֹתָהּ
  choice: depuis le jour où ils l’ont bâtie
  rationale: לְמִן marque le point de départ. Le sujet pluriel indéfini du texte hébreu est conservé par « ils ».
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: jusqu’à aujourd’hui
  rationale: Rend clairement la continuité jusqu’au moment présent.
- source_word: לַהֲסִירָהּ
  choice: si bien que je dois l’écarter
  rationale: Le ל préfixé à l’infinitif peut indiquer le résultat ou la finalité. « Si bien que » préserve ici la nuance consécutive, tandis que « je dois » exprime l’issue qui en découle sans la réduire à une simple intention.
- source_word: מֵעַל פָּנָי
  choice: de devant moi
  rationale: Expression concrète et naturelle qui reste proche de l’hébreu « de dessus/devant ma face » et signifie l’exclusion de la présence divine.
theological_decisions:
- issue: Langage anthropomorphique concernant la colère et la présence divines
  choice: Conserver « ma colère et ma fureur » ainsi que l’image « de devant moi »
  alternative: Employer un langage plus abstrait, comme « me mettre en colère » et « chasser de ma présence »
  rationale: L’hébreu emploie un langage corporel et concret. Le rendre de façon intelligible sans l’effacer préserve l’imagerie et la tension théologique du texte.
- issue: 'Valeur de לַהֲסִירָהּ : conséquence ou finalité'
  choice: « si bien que je dois l’écarter »
  alternative: « afin de l’écarter »
  rationale: La syntaxe permet une nuance de résultat ou de finalité. Dans ce contexte, la conséquence du long état de provocation paraît dominante, mais la formulation ne nie pas que l’action relève aussi de la volonté divine.
translation_notes:
  register: Français international moderne, naturel et digne. « Bâtie » convient au registre biblique sans être archaïque; « écarter de devant moi » conserve l’image hébraïque tout en restant compréhensible.
