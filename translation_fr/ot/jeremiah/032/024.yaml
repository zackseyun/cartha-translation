language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּ֣ה הַ/סֹּלְל֗וֹת בָּ֣אוּ הָ/עִיר֮ לְ/לָכְדָ/הּ֒ וְ/הָ/עִ֣יר נִתְּנָ֗ה בְּ/יַ֤ד הַ/כַּשְׂדִּים֙ הַ/נִּלְחָמִ֣ים עָלֶ֔י/הָ מִ/פְּנֵ֛י הַ/חֶ֥רֶב וְ/הָ/רָעָ֖ב וְ/הַ/דָּ֑בֶר וַ/אֲשֶׁ֥ר דִּבַּ֛רְתָּ הָיָ֖ה וְ/הִנְּ/ךָ֥ רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/024.yaml
  text: Look[a], the siege ramps have come up against the city to capture it, and the city has been given into the hand of the Chaldeans who are fighting against it, because of the sword and the famine and the plague. What you spoke has happened, and look[c][b], you see it.
translation:
  language: fr
  text: Voici, les rampes de siège sont arrivées jusqu’à la ville pour s’en emparer. La ville est livrée aux Chaldéens[a] qui l’attaquent, à cause de l’épée, de la famine et de la peste[b]. Ce que tu avais annoncé est arrivé, et voici, tu le vois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Babyloniens ». Le texte hébreu dit « aux Chaldéens », peuple associé ici à la puissance néo-babylonienne.
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’épidémie ». Le terme hébreu désigne une maladie contagieuse meurtrière.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה / וְהִנְּךָ
  choice: Voici / et voici
  rationale: La particule déictique attire vivement l’attention. « Voici » garde sa force et sa répétition dans un français actuel et digne.
- source_word: הַסֹּלְלוֹת
  choice: les rampes de siège
  rationale: Le terme désigne les terrassements élevés contre une ville assiégée; cette formulation est concrète et immédiatement compréhensible.
- source_word: בָּאוּ הָעִיר
  choice: sont arrivées jusqu’à la ville
  rationale: Le texte décrit les ouvrages de siège parvenus au contact de la ville. « Jusqu’à » exprime naturellement cette progression sans ajouter explicitement la muraille.
- source_word: לְלָכְדָהּ
  choice: pour s’en emparer
  rationale: Le verbe לכד désigne la prise d’une ville. « S’emparer de » convient au contexte militaire et évite la répétition de « ville ».
- source_word: נִתְּנָה בְּיַד
  choice: est livrée aux
  rationale: L’expression hébraïque signifie être remis au pouvoir de quelqu’un. Le français idiomatique « livrée aux » en transmet clairement le sens.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Le nom ethnique précis du texte hébreu est conservé; une note indique l’équivalent historique plus familier.
- source_word: הַנִּלְחָמִים עָלֶיהָ
  choice: qui l’attaquent
  rationale: Le participe décrit l’action militaire en cours contre la ville. « Attaquent » est naturel et précis dans ce contexte.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: La préposition présente ici l’épée, la famine et la peste comme les facteurs qui entraînent la chute de la ville.
- source_word: הַחֶרֶב וְהָרָעָב וְהַדָּבֶר
  choice: l’épée, la famine et la peste
  rationale: La triade traditionnelle des fléaux est conservée; « peste » est un terme français courant pour דֶּבֶר, sans préciser indûment une maladie moderne particulière.
- source_word: וַאֲשֶׁר דִּבַּרְתָּ הָיָה
  choice: Ce que tu avais annoncé est arrivé
  rationale: Le plus-que-parfait situe la parole divine avant son accomplissement présent. « Annoncé » exprime une parole préalable sans développer une interprétation doctrinale.
- source_word: וְהִנְּךָ רֹאֶה
  choice: et voici, tu le vois
  rationale: La formulation maintient à la fois la particule d’attention et l’affirmation que Dieu voit l’événement accompli.
theological_decisions:
- issue: Accomplissement de la parole divine
  choice: Ce que tu avais annoncé est arrivé
  alternative: Ce que tu avais dit s’est réalisé
  rationale: Le rendu affirme simplement la correspondance entre la parole antérieure de Dieu et la catastrophe présente, sans expliciter davantage le mode de cet accomplissement.
- issue: Cause immédiate de la livraison de la ville
  choice: à cause de l’épée, de la famine et de la peste
  alternative: devant l’épée, la famine et la peste
  rationale: « À cause de » rend le rapport causal probable de מִפְּנֵי tout en laissant intacte la tension entre les moyens humains du siège et l’affirmation passive que la ville est livrée.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement est conservé puisque Jérémie s’adresse directement à Dieu. La répétition de « voici » reflète celle de l’hébreu; la syntaxe reste fluide sans effacer l’image concrète du siège.
