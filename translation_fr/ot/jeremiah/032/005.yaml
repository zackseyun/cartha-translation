  text: וּ/בָבֶ֞ל יוֹלִ֤ךְ אֶת צִדְקִיָּ֨הוּ֙ וְ/שָׁ֣ם יִֽהְיֶ֔ה עַד פָּקְדִ֥/י אֹת֖/וֹ נְאֻם יְהוָ֑ה כִּ֧י תִֽלָּחֲמ֛וּ אֶת הַ/כַּשְׂדִּ֖ים לֹ֥א תַצְלִֽיחוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/005.yaml
  text: And he will take Zedekiah to Babylon, and there he will remain until I attend to him, declares the LORD. Though you fight against the Chaldeans, you will not succeed.
translation:
  language: fr
  text: Il emmènera Sédécias à Babylone, et celui-ci y restera jusqu’à ce que j’intervienne à son égard, déclare le SEIGNEUR. Même si vous combattez les Chaldéens, vous ne réussirez pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּקְדִי אֹתוֹ
  choice: j’intervienne à son égard
  rationale: Le verbe פקד peut désigner une intervention divine favorable ou défavorable. Cette formulation française conserve cette ambiguïté sans préciser prématurément la nature de l’intervention.
- source_word: נְאֻם יְהוָה
  choice: déclare le SEIGNEUR
  rationale: Formule prophétique naturelle et solennelle; « le SEIGNEUR » représente conventionnellement le nom divin יהוה.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Rend directement le nom historique du peuple employé dans le texte hébreu.
- source_word: תַצְלִיחוּ
  choice: vous ne réussirez pas
  rationale: Exprime clairement l’idée de ne pas parvenir au résultat recherché, sans ajouter d’objet absent de l’hébreu.
theological_decisions:
- issue: Valeur de כִּי devant la proposition sur le combat
  choice: Même si vous combattez
  alternative: Si vous combattez / Car vous combattrez
  rationale: La lecture concessive correspond au contexte et à la consultation anglaise auditée, tout en conservant la tension entre l’action humaine et l’échec annoncé.
- issue: Nature de l’intervention divine envers Sédécias
  choice: Formulation volontairement non précisée
  alternative: jusqu’à ce que je prenne soin de lui / jusqu’à ce que je le punisse
  rationale: Le texte ne dit pas explicitement si la visitation est favorable ou judiciaire; la traduction ne tranche donc pas cette question théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Celui-ci » évite une ambiguïté référentielle autour de Sédécias; « à son égard » maintient l’indétermination du verbe פקד.
