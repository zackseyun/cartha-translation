source:
  edition: WLC
  text: אֲשֶׁר שַׂ֠מְתָּ אֹת֨וֹת וּ/מֹפְתִ֤ים בְּ/אֶֽרֶץ מִצְרַ֨יִם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וּ/בְ/יִשְׂרָאֵ֖ל וּ/בָֽ/אָדָ֑ם וַ/תַּעֲשֶׂה לְּ/ךָ֥ שֵׁ֖ם כַּ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/020.yaml
  text: who set signs and wonders in the land of Egypt[a], and in Israel and among mankind to this day, and made a name for yourself, as it is this day.
translation:
  language: fr
  text: toi qui as accompli des signes et des prodiges dans le pays d’Égypte, en Israël et parmi les humains, jusqu’à aujourd’hui[a], et tu t’es ainsi acquis la renommée que tu as aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « jusqu’à aujourd’hui » peut se rapporter aux signes et prodiges en Égypte seulement, ou avoir une portée plus large et inclure aussi Israël et l’ensemble des humains.
    reason: ambiguïté syntaxique
lexical_decisions:
- source_word: שַׂמְתָּ (שׂוּם)
  choice: as accompli
  rationale: Avec « signes et prodiges », « accomplir » exprime naturellement en français l’action de produire ces manifestations. Le sens concret de שׂוּם (« mettre, placer ») serait peu idiomatique ici.
- source_word: אֹתוֹת וּמֹפְתִים
  choice: des signes et des prodiges
  rationale: Cette paire traditionnelle et claire conserve la distinction entre des actes qui signifient quelque chose et des événements qui suscitent l’étonnement, sans les réduire au seul terme « miracles ».
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: dans le pays d’Égypte
  rationale: La formulation garde אֶרֶץ (« pays ») et la précision géographique de l’hébreu.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à aujourd’hui
  rationale: Équivalent français naturel de l’expression temporelle hébraïque, placé là où elle apparaît dans le texte massorétique.
- source_word: וּבְיִשְׂרָאֵל
  choice: ainsi qu’en Israël
  rationale: « En Israël » rend naturellement la valeur spatiale ou collective de בְּ; « ainsi que » relie clairement ce complément à la série précédente.
- source_word: וּבָאָדָם
  choice: et parmi les humains
  rationale: אָדָם est ici collectif et désigne l’ensemble des êtres humains, non un individu nommé Adam. « Les humains » est actuel, inclusif et concret.
- source_word: וַתַּעֲשֶׂה לְּךָ שֵׁם
  choice: et qui t’es fait un nom
  rationale: L’expression idiomatique française correspond étroitement à l’hébreu et évoque une renommée établie.
- source_word: כַּיּוֹם הַזֶּה
  choice: tel qu’il est aujourd’hui
  rationale: Cette tournure rattache naturellement l’expression comparative au « nom », c’est-à-dire à la renommée désormais manifeste, tout en restant proche de l’hébreu.
theological_decisions:
- issue: Portée de עַד הַיּוֹם הַזֶּה (« jusqu’à aujourd’hui »)
  choice: Conserver l’expression immédiatement après « dans le pays d’Égypte »
  alternative: La faire porter explicitement sur les signes accomplis en Égypte, en Israël et parmi tous les humains
  rationale: L’ordre massorétique place l’expression temporelle après l’Égypte, mais la coordination qui suit permet une portée plus large. Le texte principal conserve l’ordre source et la note signale l’ambiguïté sans la résoudre.
- issue: Sens collectif de אָדָם
  choice: parmi les humains
  alternative: parmi l’humanité ; parmi les hommes
  rationale: Le terme vise ici l’humanité collectivement. « Parmi les humains » évite de faire croire à l’individu Adam et ne restreint pas le référent aux personnes de sexe masculin.
- issue: Nature des « signes et prodiges »
  choice: Ne pas remplacer la paire par « miracles »
  alternative: des miracles
  rationale: La paire hébraïque peut désigner des actes miraculeux, mais elle maintient aussi leurs fonctions de signe et d’émerveillement. La traduction conserve cette tension sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. La construction « toi qui… » conserve le lien relatif de אֲשֶׁר avec le contexte précédent. « Accomplir des signes et des prodiges » est plus naturel que le calque « placer », tandis que « t’es fait un nom » garde l’idiome concret de l’hébreu.
