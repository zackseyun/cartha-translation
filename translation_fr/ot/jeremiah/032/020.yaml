  source_fidelity: 'Le sens fondamental est bien rendu : Dieu a accompli des « signes et prodiges » en Égypte, en Israël et parmi l’humanité, et s’est acquis une renommée. Cependant, la position de « jusqu’à aujourd’hui » dans le texte français tend à en limiter la portée à l’Égypte, alors que sa portée dans l’hébreu reste syntaxiquement disputée et peut inclure la série qui suit.'
  naturalness: « Toi qui as accompli des signes et des prodiges » est naturel et convient au registre. En revanche, « t’es fait un nom tel qu’il est aujourd’hui » est lourd et son pronom « il » produit une formulation moins idiomatique en français moderne. « Tu t’es ainsi acquis la renommée que tu as aujourd’hui » exprime clairement l’idiome hébreu.
  terminology: « Signes et prodiges », « pays d’Égypte », « Israël » et « parmi les humains » sont appropriés. « Parmi les humains » rend correctement le collectif אָדָם sans introduire de restriction sexuée ni identifier le terme à Adam.
