  to: toi qui as accompli des signes et des prodiges dans le pays d’Égypte, en Israël et parmi les humains, jusqu’à aujourd’hui[a], et tu t’es ainsi acquis la renommée que tu as aujourd’hui.
  rationale: 'La révision déplace « jusqu’à aujourd’hui » après les trois compléments afin de préserver en français la possible portée large de l’expression hébraïque, tout en maintenant une note sur l’ambiguïté. Elle remplace aussi le calque final par une expression française moderne et fidèle à l’idiome « se faire un nom ». La note sur אָדָם n’est plus nécessaire : « parmi les humains » est non ambigu dans le texte et n’appelle pas d’alternative textuellement significative.'
