  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה כַּ/אֲשֶׁ֤ר הֵבֵ֨אתִי֙ אֶל הָ/עָ֣ם הַ/זֶּ֔ה אֵ֛ת כָּל הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את כֵּ֣ן אָנֹכִ֞י מֵבִ֤יא עֲלֵי/הֶם֙ אֶת כָּל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר עֲלֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/042.yaml
  text: 'For thus says Yahweh: Just as I brought on this people all this great disaster[b][a], so I will bring on them all the good that I am speaking concerning them.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahvé : « De même que j’ai fait venir sur ce peuple tout ce grand malheur[a], de même je ferai venir sur eux tout le bien dont je parle à leur sujet[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute cette grande calamité ». Le mot hébreu peut signifier « mal » ou « malheur » ; ici, il désigne la catastrophe du jugement, non un mal moral commis par Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « tout le bien que je leur promets ». Plus littéralement : « tout le bien dont je parle à leur sujet ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: Car voici ce que dit Yahvé
  rationale: « Car » marque le lien explicatif avec le contexte précédent. La tournure « voici ce que dit » rend naturellement la formule prophétique, tandis que « Yahvé » conserve le nom divin.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: De même que… de même
  rationale: Cette construction conserve le parallélisme explicite entre le jugement passé et le bien à venir.
- source_word: הֵבֵאתִי אֶל הָעָם הַזֶּה
  choice: j’ai fait venir sur ce peuple
  rationale: Le factitif hébreu est rendu par « faire venir », qui maintient clairement l’action divine et s’accorde avec la préposition française « sur ».
- source_word: כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: tout ce grand malheur
  rationale: Dans ce contexte de jugement, רָעָה désigne une catastrophe ou un malheur subi, plutôt que le mal moral. « Malheur » reste proche de la portée du terme hébreu.
- source_word: מֵבִיא עֲלֵיהֶם
  choice: je ferai venir sur eux
  rationale: Le participe hébreu exprime ici une action future présentée comme certaine. Le futur français est naturel dans cette promesse prophétique, tout en conservant le verbe « faire venir ».
- source_word: כָּל הַטּוֹבָה
  choice: tout le bien
  rationale: Cette expression large préserve l’étendue de טוֹבָה sans la limiter à la prospérité matérielle ou à une forme particulière de bénédiction.
- source_word: אֲשֶׁר אָנֹכִי דֹּבֵר עֲלֵיהֶם
  choice: que j’annonce à leur sujet
  rationale: « Annonce » convient à une parole prophétique et reste plus proche du verbe « parler » que « promettre »; « à leur sujet » conserve la valeur de עַל.
theological_decisions:
- issue: Sens de רָעָה lorsque Dieu agit
  choice: malheur
  alternative: mal, désastre, calamité
  rationale: Le contexte oppose le jugement catastrophique au bien futur. « Malheur » exprime les conséquences du jugement sans faire dire au texte que Dieu commet un mal moral.
- issue: Valeur du participe מֵבִיא dans la promesse
  choice: je ferai venir
  alternative: je fais venir / je suis en train de faire venir
  rationale: Le futur rend en français la certitude d’une action divine encore à venir dans ce contexte, sans prétendre que sa réalisation est déjà en cours.
- issue: Portée de דֹּבֵר
  choice: j’annonce
  alternative: je promets
  rationale: Le contexte permet de comprendre une promesse, mais le verbe hébreu signifie littéralement « parler ». « Annonce » laisse subsister cette nuance sans surinterprétation.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « de même que… de même » et « faire venir sur » conserve volontairement le parallélisme et l’action divine explicite du texte hébreu.
