  text: וָ/אֶקַּ֖ח אֶת סֵ֣פֶר הַ/מִּקְנָ֑ה אֶת הֶֽ/חָת֛וּם הַ/מִּצְוָ֥ה וְ/הַ/חֻקִּ֖ים וְ/אֶת הַ/גָּלֽוּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/011.yaml
  text: Then I took the deed of purchase[a], the sealed copy, containing the terms and conditions[b], and the open copy.
translation:
  language: fr
  text: 'Puis je pris l’acte d’achat : l’exemplaire scellé, avec les clauses et les dispositions[a], et l’exemplaire non scellé[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’acte d’achat, le document scellé, le commandement et les prescriptions ». Le sens précis de ces termes juridiques hébreux est incertain; ils désignent probablement les clauses et les dispositions de l’acte.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’exemplaire ouvert », c’est-à-dire non scellé et donc accessible, par opposition à l’exemplaire scellé.'
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Puis je pris
  rationale: Le waw consécutif fait avancer le récit; « Puis » exprime naturellement la succession, et le passé simple convient au registre narratif biblique moderne et digne.
- source_word: סֵפֶר הַמִּקְנָה
  choice: l’acte d’achat
  rationale: סֵפֶר désigne ici un document écrit et מִקְנָה une acquisition. Dans cette transaction foncière, « acte d’achat » rend clairement la nature juridique du document.
- source_word: הֶחָתוּם
  choice: l’exemplaire scellé
  rationale: Le participe signifie « scellé ». « Exemplaire » explicite en français le document visé et prépare le contraste avec הַגָּלוּי, sans ajouter une interprétation étrangère au contexte.
- source_word: הַמִּצְוָה וְהַחֻקִּים
  choice: les clauses et les dispositions
  rationale: Pris ensemble dans ce contexte juridique, les termes désignent vraisemblablement les stipulations et prescriptions de l’acte. Cette formulation conserve deux éléments distincts sans recourir à l’expression plus figée « termes et conditions ».
- source_word: הַגָּלוּי
  choice: l’exemplaire non scellé
  rationale: Le mot signifie littéralement ce qui est découvert ou ouvert. En français juridique courant, « non scellé » rend clairement le contraste documentaire avec l’exemplaire scellé.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les deux points présentent les deux formes de l’acte, tandis que les virgules signalent que l’exemplaire scellé comporte les clauses et dispositions. Les notes préservent l’ambiguïté des termes juridiques hébreux et le sens littéral de « ouvert ».
