id: JER.32.34
reference: Jeremiah 32:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּשִׂ֣ימוּ שִׁקּֽוּצֵי/הֶ֗ם בַּ/בַּ֛יִת אֲשֶׁר נִקְרָֽא שְׁמִ֥/י עָלָ֖י/ו לְ/טַמְּאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/034.yaml
  text: They put their detestable things in the house that is called by my name[b][a], to defile it.
translation:
  language: fr
  text: Ils ont placé leurs objets abominables[a] dans la maison qui porte mon nom[b], afin de la profaner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs abominations ». Le terme hébreu désigne souvent des objets ou des pratiques détestables, en particulier dans un contexte idolâtre.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur laquelle mon nom est appelé ». La « maison » désigne ici le Temple.
    reason: idiom_and_context
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Ils ont placé
  rationale: Le verbe שׂים décrit ici une action passée concrète. « Placer » est naturel en français et convient à l’introduction d’objets dans un lieu consacré.
- source_word: שִׁקּוּצֵיהֶם
  choice: leurs objets abominables
  rationale: שִׁקּוּץ désigne ce qui inspire l’horreur ou le dégoût, souvent dans un contexte idolâtre. « Objets abominables » conserve cette portée sans préciser indûment qu’il s’agit exclusivement d’idoles.
- source_word: בַּבַּיִת
  choice: dans la maison
  rationale: בַּיִת signifie littéralement « maison ». Le contexte désigne le Temple, mais garder « maison » permet de préserver l’expression hébraïque dans le texte principal.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: qui porte mon nom
  rationale: Littéralement, le nom de Dieu est « appelé sur » cette maison, formule exprimant son appartenance et sa consécration. « Qui porte mon nom » rend naturellement cet idiome en français.
- source_word: לְטַמְּאוֹ
  choice: afin de la profaner
  rationale: L’infinitif exprime le but ou le résultat. טמא évoque ici la souillure rituelle et morale du sanctuaire ; « profaner » traduit clairement cette atteinte à un lieu consacré.
theological_decisions:
- issue: Traduction de בַּבַּיִת comme « maison » ou comme « Temple »
  choice: maison
  alternative: Temple
  rationale: « Maison » suit directement l’hébreu, tandis que le contexte et la mention du nom de Dieu indiquent qu’il s’agit du Temple. Une note fournit la désignation explicite sans l’introduire dans le texte principal.
- issue: Portée de שִׁקּוּצֵיהֶם
  choice: objets abominables
  alternative: idoles / abominations
  rationale: Le contexte est idolâtre, mais le substantif hébreu peut désigner plus largement des choses détestables. La traduction choisie maintient cette latitude sémantique.
translation_notes:
  register: Français international moderne, clair et digne. « Objets abominables » reste intelligible tout en conservant la portée cultuelle du terme ; « profaner » convient naturellement à un sanctuaire.
