base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/009.yaml
  text: 'So I bought the field from Hanamel the son of my uncle[a], who was at Anathoth[b], and I weighed out the silver to him: seventeen shekels of silver.'
translation:
  language: fr
  text: 'J’achetai donc le champ à Hanamel, fils de mon oncle, qui était à Anatoth[a], et je lui pesai l’argent : dix-sept sicles d’argent[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition hébraïque peut aussi se comprendre comme se rapportant au champ : « le champ qui était à Anatoth ».'
    reason: ambiguïté grammaticale de l’antécédent de la proposition relative
  - marker: b
    text: 'L’hébreu dit littéralement : « sept sicles et dix d’argent », expression comprise comme un total de dix-sept sicles d’argent.'
    reason: forme littérale inhabituelle de l’indication numérique
lexical_decisions:
- source_word: וָאֶקְנֶה
  choice: J’achetai donc
  rationale: Le wayyiqtol de קנה poursuit le récit et désigne ici clairement un achat. « Donc » marque naturellement l’accomplissement de l’instruction reçue.
- source_word: הַשָּׂדֶה
  choice: le champ
  rationale: שׂדה désigne couramment un champ ou une parcelle de terre ; « champ » convient au contexte foncier sans alourdir le français.
- source_word: מֵאֵת חֲנַמְאֵל
  choice: à Hanamel
  rationale: La préposition indique la personne auprès de qui le bien est acheté. La construction française « acheter à quelqu’un » rend naturellement cette relation commerciale.
- source_word: בֶּן דֹּדִי
  choice: fils de mon oncle
  rationale: Cette traduction conserve la formulation familiale explicite de l’hébreu au lieu de la réduire à « mon cousin ».
- source_word: אֲשֶׁר בַּעֲנָתוֹת
  choice: qui se trouvait à Anatoth
  rationale: Dans le contexte, la proposition relative est comprise comme localisant le champ. L’ambiguïté grammaticale sur son antécédent est signalée en note.
- source_word: וָאֶשְׁקֲלָה לּוֹ אֶת הַכֶּסֶף
  choice: Puis je lui pesai l’argent
  rationale: Le verbe שקל évoque concrètement la pesée du métal servant au paiement ; cette image historique est conservée plutôt que remplacée par le simple verbe « payer ».
- source_word: שִׁבְעָה שְׁקָלִים וַעֲשָׂרָה הַכָּסֶף
  choice: dix-sept sicles d’argent
  rationale: L’ordre numérique hébreu, littéralement « sept sicles et dix », exprime naturellement un total de dix-sept. « Argent » conserve le métal pesé, et « sicles » le nom de l’unité.
