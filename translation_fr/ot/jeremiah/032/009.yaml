translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans être archaïque. La formulation conserve la pesée concrète de l’argent et la relation familiale littérale, tout en signalant les ambiguïtés réelles en notes.
