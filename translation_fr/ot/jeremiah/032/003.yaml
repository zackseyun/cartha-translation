  text: אֲשֶׁ֣ר כְּלָא֔/וֹ צִדְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָ֖ה לֵ/אמֹ֑ר מַדּוּעַ֩ אַתָּ֨ה נִבָּ֜א לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י נֹתֵ֜ן אֶת הָ/עִ֥יר הַ/זֹּ֛את בְּ/יַ֥ד מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/003.yaml
  text: 'because Zedekiah king of Judah had confined him[a], saying, “Why do you prophesy, saying, ‘Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon, and he will capture it’?”'
translation:
  language: fr
  text: 'parce que Sédécias, roi de Juda, l’avait enfermé[a], en disant : « Pourquoi prophétises-tu ainsi : “Voici ce que dit Yahweh : Je vais livrer cette ville entre les mains du roi de Babylone, et il s’en emparera” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’avait retenu » ou « l’avait emprisonné ».'
    reason: Le verbe hébreu peut désigner l’action de retenir, d’enfermer ou d’emprisonner.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: parce que
  rationale: Dans le contexte, la particule rattache ce verset au précédent en donnant la raison de l’emprisonnement de Jérémie; « parce que » rend clairement cette fonction discursive.
- source_word: כְּלָאוֹ
  choice: l’avait fait enfermer
  rationale: Le verbe désigne l’action de retenir ou d’emprisonner. Cette formulation française naturelle exprime la détention ordonnée par le roi, tandis que le plus-que-parfait situe l’action avant les paroles citées.
- source_word: מַדּוּעַ אַתָּה נִבָּא לֵאמֹר
  choice: Pourquoi prophétises-tu en ces termes
  rationale: Cette tournure conserve le verbe « prophétiser » et introduit naturellement en français le contenu exact de la prophétie, sans la répétition lourde de « en disant ».
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Formulation actuelle et solennelle qui conserve la formule prophétique de messager ainsi que le nom divin.
- source_word: הִנְנִי נֹתֵן
  choice: Je vais livrer
  rationale: Le participe accompagné de הִנְנִי présente une action divine imminente et certaine. « Je vais livrer » en restitue naturellement l’immédiateté en français.
- source_word: בְּיַד
  choice: entre les mains de
  rationale: L’expression française garde l’image sémitique de la main tout en indiquant clairement la remise au pouvoir de quelqu’un.
- source_word: וּלְכָדָהּ
  choice: et il s’en emparera
  rationale: Le verbe לכד désigne la prise militaire d’une ville. Le pronom « en » reprend naturellement « cette ville », et le sujet masculin singulier renvoie au roi de Babylone.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le tétragramme, nom personnel de Dieu. « Yahweh » le représente directement au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La double citation est maintenue pour distinguer les paroles de Sédécias de la formule prophétique citée. Le verset commence par une minuscule, car il poursuit syntaxiquement la phrase du verset précédent.
