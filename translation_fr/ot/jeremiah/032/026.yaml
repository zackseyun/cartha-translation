  text: וַ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/026.yaml
  text: Then the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: fr
  text: 'Alors la parole de Yahweh fut adressée à Jérémie :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors ... fut adressée
  rationale: Le waw consécutif fait avancer le récit. En français, la tournure idiomatique « la parole fut adressée » exprime naturellement la venue d’une parole divine sans reproduire lourdement « il arriva ».
- source_word: דְּבַר
  choice: la parole
  rationale: Dans la formule prophétique דְּבַר יְהוָה, « la parole » est la traduction consacrée et transparente; elle préserve la portée théologique de l’expression.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: Dans la locution française « être adressé à », la préposition rend naturellement la direction indiquée par אֶל.
- source_word: יִרְמְיָהוּ
  choice: Jérémie
  rationale: Forme française usuelle du nom du prophète.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif hébreu introduit le contenu du discours. En français moderne, les deux-points remplissent naturellement cette fonction et évitent le calque pesant « en disant ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: Yéhovah
  rationale: Le texte porte directement le Tétragramme. « Yahweh » en conserve le caractère de nom propre sans le remplacer par le titre « le Seigneur »; « Yéhovah » demeure une autre forme traditionnelle.
translation_notes:
  register: Français moderne, sobre et digne. La formule prophétique est rendue idiomatiquement par « la parole de Yahweh fut adressée à », et לֵאמֹר par les deux-points.
