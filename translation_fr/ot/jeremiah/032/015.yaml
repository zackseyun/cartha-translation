  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל ע֣וֹד יִקָּנ֥וּ בָתִּ֛ים וְ/שָׂד֥וֹת וּ/כְרָמִ֖ים בָּ/אָ֥רֶץ הַ/זֹּֽאת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/015.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Houses and fields and vineyards will again be bought in this land.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh des armées, le Dieu d’Israël : Des maisons, des champs et des vignes seront de nouveau achetés[a] dans ce pays.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « on achètera de nouveau des maisons, des champs et des vignes dans ce pays ». Le verbe hébreu est au niphal, forme qui peut parfois avoir une valeur moyenne ou proche de l’actif ; le passif « seront achetés » en préserve ici le plus directement la forme.'
    reason: alternative lexicale et grammaticale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’acte symbolique accompli dans le contexte immédiat.
- source_word: כֹה אָמַר
  choice: voici ce que dit
  rationale: Rend naturellement en français moderne la formule prophétique de messager, tout en conservant sa solennité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Rend directement le titre divin et reste clair pour un lectorat francophone moderne.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Reproduit clairement la relation construite et l’identification du Dieu qui parle.
- source_word: עוֹד
  choice: de nouveau
  rationale: Dans ce contexte de restauration, le terme annonce la reprise d’une activité interrompue.
- source_word: יִקָּנוּ
  choice: seront achetés
  rationale: Le niphal est rendu au passif, ce qui préserve la forme hébraïque et met l’accent sur la reprise des transactions ordinaires.
- source_word: בָתִּים וְשָׂדוֹת וּכְרָמִים
  choice: des maisons, des champs et des vignes
  rationale: Traduction directe et idiomatique des trois catégories de biens immobiliers et agricoles.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: dans ce pays
  rationale: Dans ce contexte géographique et national, « pays » rend naturellement אֶרֶץ sans effacer la référence au territoire d’Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le choix conserve le nom propre révélé dans le texte hébreu, sans le remplacer par « le Seigneur ».
- issue: Valeur du niphal יִקָּנוּ
  choice: 'passif : « seront de nouveau achetés »'
  alternative: 'valeur moyenne ou active impersonnelle : « on achètera de nouveau »'
  rationale: Le passif représente le plus directement la morphologie hébraïque, tout en laissant la restauration du commerce foncier au premier plan.
translation_notes:
  register: Français international moderne, clair et digne. La formule « voici ce que dit » est plus naturelle aujourd’hui que « ainsi parle », tandis que « Yahweh des armées » conserve la solennité du titre divin. Le marqueur de note est placé sur le verbe concerné.
