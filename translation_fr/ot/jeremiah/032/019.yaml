source:
  edition: WLC
  text: גְּדֹל֙ הָֽ/עֵצָ֔ה וְ/רַ֖ב הָ/עֲלִֽילִיָּ֑ה אֲשֶׁר עֵינֶ֣י/ךָ פְקֻח֗וֹת עַל כָּל דַּרְכֵי֙ בְּנֵ֣י אָדָ֔ם לָ/תֵ֤ת לְ/אִישׁ֙ כִּ/דְרָכָ֔י/ו וְ/כִ/פְרִ֖י מַעֲלָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/019.yaml
  text: great in counsel and mighty in deed[a], whose eyes are open upon all the ways of the sons of man, to give to each man according to his ways and according to the fruit of his deeds.
translation:
  language: fr
  text: grand dans tes desseins et puissant dans tes actes, toi dont les yeux sont ouverts sur toutes les voies des êtres humains, afin de rendre à chacun selon ses voies et selon le fruit de ses actes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּדֹל הָעֵצָה
  choice: grand par tes desseins
  rationale: עֵצָה peut désigner le conseil, le projet ou le dessein. « Tes desseins » exprime ici avec naturel la sagesse intentionnelle de Dieu, tout en conservant l’adresse à la deuxième personne portée par le contexte et par la suite du verset.
- source_word: רַב הָעֲלִילִיָּה
  choice: puissant par tes actes
  rationale: עֲלִילִיָּה désigne l’action ou l’accomplissement. Cette formulation maintient le parallélisme entre la conception divine et sa mise en œuvre efficace.
- source_word: עֵינֶיךָ פְקֻחוֹת
  choice: toi dont les yeux sont ouverts
  rationale: La traduction conserve l’image anthropomorphique concrète du texte hébreu plutôt que de l’abstraire en une affirmation générale d’omniscience.
- source_word: עַל כָּל דַּרְכֵי בְּנֵי אָדָם
  choice: sur toutes les voies des êtres humains
  rationale: דֶּרֶךְ évoque ici la conduite ou le parcours de vie. בְּנֵי אָדָם est une expression collective désignant l’humanité; « êtres humains » en restitue directement le sens en français moderne.
- source_word: לָתֵת לְאִישׁ
  choice: afin de rendre à chacun
  rationale: L’infinitif exprime le but ou le résultat. Dans ce contexte de rétribution selon la conduite, « rendre » explicite la valeur contextuelle de נתן sans aller jusqu’au terme plus chargé « rétribuer »; אִישׁ est distributif et se rend naturellement par « chacun ».
- source_word: כִּדְרָכָיו
  choice: selon ses voies
  rationale: Le pluriel hébreu est conservé et reprend le motif des « voies » humaines, c’est-à-dire la conduite de chacun.
- source_word: וְכִפְרִי מַעֲלָלָיו
  choice: et selon le fruit de ses actes
  rationale: « Fruit » préserve la métaphore hébraïque du résultat produit par les actions, tandis que « actes » conserve leur portée morale.
theological_decisions:
- issue: Langage anthropomorphique concernant la connaissance divine
  choice: Conserver « dont les yeux sont ouverts »
  alternative: « qui vois toutes les voies humaines »
  rationale: L’image corporelle appartient à la force littéraire du texte et exprime la vigilance exhaustive de Dieu sans la remplacer par une formulation théologique abstraite.
- issue: Expression collective masculine בְּנֵי אָדָם et singulier distributif אִישׁ
  choice: Employer « les êtres humains » et « chacun »
  alternative: « les fils de l’homme » et « à chaque homme »
  rationale: Ces expressions hébraïques ont ici une portée générique et collective. Le français moderne exprime ce sens sans ambiguïté par des formulations inclusives, sans modifier la portée théologique du jugement individuel.
- issue: Rapport entre les voies, les actes et la rétribution divine
  choice: « rendre à chacun selon ses voies et selon le fruit de ses actes »
  alternative: « donner à chacun selon ses voies… »
  rationale: Le contexte donne à נתן une valeur rétributive. « Rendre » demeure assez large pour ne pas préciser si la conséquence est récompense ou châtiment, préservant ainsi la tension du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre les desseins et les actes est maintenu, ainsi que les images concrètes des yeux ouverts, des voies et du fruit. La phrase reste un fragment syntaxique cohérent avec le contexte immédiat de la prière.
