source:
  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית עוֹלָ֔ם אֲשֶׁ֤ר לֹֽא אָשׁוּב֙ מֵ/אַ֣חֲרֵי/הֶ֔ם לְ/הֵיטִיבִ֖/י אוֹתָ֑/ם וְ/אֶת יִרְאָתִ/י֙ אֶתֵּ֣ן בִּ/לְבָבָ֔/ם לְ/בִלְתִּ֖י ס֥וּר מֵ/עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/040.yaml
  text: I will make with them an everlasting covenant[a], that I will not turn away from them, to do them good. And I will put the fear of me in their hearts[b], so that they will not turn away from me.
translation:
  language: fr
  text: 'Je conclurai avec eux une alliance perpétuelle[a] : je ne me détournerai pas d’eux, afin de leur faire du bien. Je mettrai dans leur cœur la crainte de moi[b], afin qu’ils ne se détournent pas de moi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une alliance éternelle » ou « une alliance pour toujours ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ma crainte », c’est-à-dire la crainte dirigée vers moi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרַתִּי
  choice: Je conclurai
  rationale: Littéralement, l’hébreu dit « couper une alliance » ; en français, « conclure une alliance » restitue naturellement cet idiome.
- source_word: בְּרִית עוֹלָם
  choice: une alliance perpétuelle
  rationale: « Perpétuelle » exprime la durée indéfinie et permanente de עוֹלָם dans ce contexte d’alliance, sans imposer une systématisation théologique.
- source_word: אֲשֶׁר לֹא אָשׁוּב מֵאַחֲרֵיהֶם
  choice: je ne me détournerai plus d’eux
  rationale: Cette formulation française naturelle exprime que Dieu ne se retirera pas d’eux. « Plus » rend ici la cessation durable impliquée par la négation de שוב dans le contexte.
- source_word: לְהֵיטִיבִי אוֹתָם
  choice: mais je leur ferai du bien
  rationale: La proposition indique l’action bienfaisante liée au fait que Dieu ne se détournera pas d’eux. « Mais » explicite légèrement ce lien positif sans en changer le sens.
- source_word: יִרְאָתִי
  choice: la crainte de moi
  rationale: Le suffixe de première personne désigne une crainte orientée vers Dieu. Cette traduction évite l’ambiguïté de « ma crainte », qui pourrait sembler désigner une crainte éprouvée par Dieu.
- source_word: בִּלְבָבָם
  choice: dans leur cœur
  rationale: En hébreu, le cœur est le centre de la volonté et des dispositions intérieures. Le singulier collectif est idiomatique en français.
- source_word: לְבִלְתִּי סוּר מֵעָלָי
  choice: afin qu’ils ne se détournent pas de moi
  rationale: « Afin que » conserve la valeur de but ou de résultat visé de la construction, sans trancher davantage la relation théologique entre don divin et fidélité humaine.
theological_decisions:
- issue: Durée de l’alliance
  choice: alliance perpétuelle
  alternative: alliance éternelle
  rationale: « Perpétuelle » affirme la permanence de l’alliance dans ce passage tout en laissant intacte la portée précise de עוֹלָם.
- issue: Sens de la crainte envers Dieu
  choice: la crainte de moi
  alternative: ma crainte
  rationale: Le texte parle de la crainte dirigée vers Dieu et placée par lui dans le cœur du peuple. La traduction préserve cette dynamique sans réduire la crainte à la terreur ni importer une doctrine particulière de la persévérance.
- issue: Rapport entre l’action divine et la fidélité humaine
  choice: afin qu’ils ne se détournent pas de moi
  alternative: de sorte qu’ils ne se détourneront pas de moi
  rationale: « Afin que » préserve la nuance finale de לְבִלְתִּי et la tension entre l’initiative divine et la réponse humaine, sans transformer explicitement le but en formulation strictement causale ou déterministe.
translation_notes:
  register: Français international moderne, digne et accessible. « Conclure une alliance » est idiomatique ; « faire du bien » garde la simplicité concrète de l’hébreu. Le parallélisme des deux emplois de « se détourner » met en relief la fidélité de Dieu et celle attendue du peuple.
