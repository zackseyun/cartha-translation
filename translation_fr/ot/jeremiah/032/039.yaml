source:
  edition: WLC
  text: וְ/נָתַתִּ֨י לָ/הֶ֜ם לֵ֤ב אֶחָד֙ וְ/דֶ֣רֶךְ אֶחָ֔ד לְ/יִרְאָ֥ה אוֹתִ֖/י כָּל הַ/יָּמִ֑ים לְ/ט֣וֹב לָ/הֶ֔ם וְ/לִ/בְנֵי/הֶ֖ם אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/039.yaml
  text: And I will give them one heart and one way[a], so that they may fear me all their days[b], for their good and for the good of their children after them.
translation:
  language: fr
  text: Je leur donnerai un seul cœur[a] et une seule voie[b], afin qu’ils me craignent tous les jours, pour leur bien et celui de leurs enfants après eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi évoquer un cœur sans partage. L’hébreu dit littéralement « un seul cœur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un seul chemin ». En hébreu, la « voie » peut désigner au sens figuré une manière de vivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je leur donnerai
  rationale: Le qatal à la première personne, coordonné dans ce discours prophétique, exprime ici une promesse future. « Donner » rend directement נתן.
- source_word: לֵב אֶחָד
  choice: un seul cœur
  rationale: 'Cette formulation conserve la métaphore hébraïque et son ambiguïté féconde : elle peut évoquer aussi bien l’unité du peuple qu’une disposition intérieure sans partage.'
- source_word: וְדֶרֶךְ אֶחָד
  choice: et une seule voie
  rationale: דרך désigne une voie ou un chemin et peut, au sens figuré, renvoyer à une manière de vivre. « Voie » préserve cette image sans l’expliciter excessivement.
- source_word: לְיִרְאָה אוֹתִי
  choice: afin qu’ils me craignent
  rationale: L’infinitif construit avec ל exprime le but. « Craindre » maintient le vocabulaire biblique de la crainte révérencielle sans le réduire à la terreur ni le paraphraser.
- source_word: כָּל הַיָּמִים
  choice: tous les jours
  rationale: Rendu proche du sens littéral « tous les jours », exprimant une durée constante dans une tournure française naturelle.
- source_word: לְטוֹב לָהֶם
  choice: pour leur bien
  rationale: La construction avec ל indique ici le bénéfice ou l’avantage; « pour leur bien » est idiomatique et précis.
- source_word: וְלִבְנֵיהֶם אַחֲרֵיהֶם
  choice: et celui de leurs enfants après eux
  rationale: « Celui » reprend naturellement « bien » en français. בנים est rendu directement par « enfants », et « après eux » conserve la perspective générationnelle.
theological_decisions:
- issue: Sens de « un seul cœur et une seule voie »
  choice: Conserver les deux métaphores, qui peuvent exprimer une disposition intérieure unifiée et une manière de vivre commune orientée vers Dieu.
  alternative: Expliciter uniquement l’unité communautaire, ou uniquement l’intégrité personnelle et la consécration sans partage.
  rationale: L’hébreu permet ces dimensions complémentaires. Une traduction littérale préserve cette ampleur théologique au lieu de trancher en faveur d’une seule lecture.
- issue: Sens de « me craignent »
  choice: Maintenir « craignent » dans son sens contextuel de crainte révérencielle envers Dieu au sein de la relation d’alliance.
  alternative: Paraphraser par « me révèrent » ou comprendre le terme comme la seule terreur.
  rationale: Dans ce contexte de restauration de l’alliance, ירא inclut respect, révérence et fidélité. Le terme français traditionnel conserve aussi la tension propre à l’expression source.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle. « Un seul cœur » et « une seule voie » conservent le parallélisme ainsi que l’ambiguïté entre unité communautaire et intégrité spirituelle.
