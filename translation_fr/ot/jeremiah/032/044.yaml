revisions:
- from: On achètera des champs avec de l’argent, on rédigera des actes, on les scellera et on les fera attester par des témoins, dans le territoire de Benjamin, aux alentours de Jérusalem, dans les villes de Juda, dans les villes de la région montagneuse, dans les villes du Bas-Pays[a] et dans les villes du Néguev. Car je rétablirai leur situation[b], déclare Yahweh.
  to: On achètera des champs avec de l’argent, on rédigera un acte, on le scellera et on le fera attester par des témoins, dans le territoire de Benjamin, aux alentours de Jérusalem, dans les villes de Juda, dans les villes de la région montagneuse, dans les villes de la plaine[a] et dans les villes du Néguev. Car je rétablirai leur sort[b], déclare Yahweh.
  rationale: La révision conserve l’actif indéfini et la portée juridique du texte, tout en alignant le singulier de « acte » sur le singulier hébreu. « Plaine » remplace un régionalisme français ambigu, et « rétablirai leur sort » rend de manière plus idiomatique l’expression hébraïque de restauration, sans éliminer ses lectures liées à l’exil.
