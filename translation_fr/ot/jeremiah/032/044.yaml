  text: שָׂד֞וֹת בַּ/כֶּ֣סֶף יִקְנ֗וּ וְ/כָת֨וֹב בַּ/סֵּ֥פֶר וְ/חָתוֹם֮ וְ/הָעֵ֣ד עֵדִים֒ בְּ/אֶ֨רֶץ בִּנְיָמִ֜ן וּ/בִ/סְבִיבֵ֣י יְרוּשָׁלִַ֗ם וּ/בְ/עָרֵ֤י יְהוּדָה֙ וּ/בְ/עָרֵ֣י הָ/הָ֔ר וּ/בְ/עָרֵ֥י הַ/שְּׁפֵלָ֖ה וּ/בְ/עָרֵ֣י הַ/נֶּ֑גֶב כִּֽי אָשִׁ֥יב אֶת שְׁבוּתָ֖/ם נְאֻם יְהוָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/044.yaml
  text: Fields will be bought with silver[a], and deeds will be written in a scroll and sealed and witnessed by witnesses in the land of Benjamin, around Jerusalem, and in the cities of Judah, in the cities of the hill country, in the cities of the lowland, and in the cities of the Negeb; for I will restore their fortunes[c][b], declares Yahweh.
translation:
  language: fr
  text: On achètera des champs avec de l’argent, on rédigera un acte, on le scellera et on le fera attester par des témoins, dans le territoire de Benjamin, aux alentours de Jérusalem, dans les villes de Juda, dans les villes de la région montagneuse, dans les villes de la plaine[a] et dans les villes du Néguev. Car je rétablirai leur sort[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « la Shéphéla », région de basses terres située en Juda.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « je ramènerai leurs exilés » ou « je mettrai fin à leur captivité ». L’expression hébraïque peut désigner le retour d’exil aussi bien qu’un rétablissement plus général.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂדוֹת בַּכֶּסֶף יִקְנוּ
  choice: On achètera des champs avec de l’argent
  rationale: Le pluriel שָׂדוֹת désigne ici des parcelles agricoles. La tournure impersonnelle avec « on » rend naturellement l’actif hébreu sans inventer de sujet précis; « argent » conserve à la fois l’idée du métal monétaire et celle du moyen de paiement.
- source_word: וְכָתוֹב בַּסֵּפֶר וְחָתוֹם
  choice: on rédigera des actes, on les scellera
  rationale: Dans ce contexte de transaction foncière, סֵפֶר désigne un écrit juridique. « Actes » explicite sobrement sa fonction, tandis que « sceller » conserve le geste légal exprimé par חתם.
- source_word: וְהָעֵד עֵדִים
  choice: on les fera attester par des témoins
  rationale: La construction causative exprime l’attestation officielle par des témoins. Cette formulation française garde la portée juridique sans reproduire maladroitement la répétition littérale « témoigner des témoins ».
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: dans le territoire de Benjamin
  rationale: Dans l’énumération géographique, אֶרֶץ désigne le territoire rattaché à Benjamin; « territoire » est ici plus précis que « pays ».
- source_word: וּבִסְבִיבֵי יְרוּשָׁלִַם
  choice: aux alentours de Jérusalem
  rationale: La locution rend clairement la zone qui entoure Jérusalem dans un français actuel.
- source_word: הָהָר
  choice: la région montagneuse
  rationale: Le terme désigne la zone élevée de Juda et non une montagne unique.
- source_word: הַשְּׁפֵלָה
  choice: le Bas-Pays
  rationale: Il s’agit d’une région géographique précise de Juda. « Bas-Pays » en traduit le sens tout en fonctionnant comme un nom régional; une note donne aussi la forme traditionnelle.
- source_word: הַנֶּגֶב
  choice: le Néguev
  rationale: Dans cette liste de régions, le mot fonctionne comme un nom géographique précis plutôt que comme la simple direction du sud.
- source_word: אָשִׁיב אֶת שְׁבוּתָם
  choice: je rétablirai leur situation
  rationale: L’expression idiomatique annonce un renversement de la détresse et une restauration globale. Cette traduction n’enferme pas le sens dans le seul retour physique des exilés.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de l’expression de restauration שְׁבוּת
  choice: je rétablirai leur situation
  alternative: je ramènerai leurs exilés / je mettrai fin à leur captivité
  rationale: L’idiome peut évoquer le retour d’exil ou la fin de la captivité, mais aussi plus largement le rétablissement de la communauté. Le texte principal conserve cette ampleur et la note signale les lectures plus concrètes.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition géographique du texte hébreu est conservée. La série d’actions juridiques est rendue par « on » afin de respecter l’actif hébreu tout en gardant le sujet indéfini.
