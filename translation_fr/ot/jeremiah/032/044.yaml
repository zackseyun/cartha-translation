  naturalness: Le français est dans l’ensemble moderne et fluide. « Le Bas-Pays » sonne toutefois peu idiomatique et peut évoquer les Pays-Bas. « Rétablirai leur sort » est une formulation française plus établie et plus naturelle que « rétablirai leur situation » pour conserver l’ampleur de l’idiome hébreu.
  terminology: « Yahweh », « territoire de Benjamin », « région montagneuse » et « Néguev » conviennent. « Plaine » rend clairement la région de la Shéphéla, avec la note culturelle pour préserver le nom technique. La note sur שְׁבוּת maintient utilement les sens possibles sans les trancher.
