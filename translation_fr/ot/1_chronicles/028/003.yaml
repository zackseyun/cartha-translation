id: 1CH.28.3
reference: 1 Chronicles 28:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָ/אֱלֹהִים֙ אָ֣מַר לִ֔/י לֹא תִבְנֶ֥ה בַ֖יִת לִ/שְׁמִ֑/י כִּ֣י אִ֧ישׁ מִלְחָמ֛וֹת אַ֖תָּה וְ/דָמִ֥ים שָׁפָֽכְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/003.yaml
  text: But God said to me[a], ‘You shall not build a house for my name[b], because you are a man of wars and have shed blood.’
translation:
  language: fr
  text: 'Mais Dieu m’a dit : « Tu ne bâtiras pas de maison pour mon nom[a], car tu es un homme de guerre[b] et tu as versé du sang. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Une « maison pour mon nom » désigne le temple comme le lieu associé au nom et à la présence de Dieu.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « un homme de guerres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֱלֹהִים
  choice: Mais Dieu
  rationale: 'Le וְ prend ici naturellement une valeur adversative dans le fil du discours de David : malgré son projet de bâtir, Dieu le lui a interdit.'
- source_word: אָמַר לִי
  choice: m’a dit
  rationale: Rend directement le verbe אמר accompagné du complément לִי, dans un français naturel.
- source_word: לֹא תִבְנֶה
  choice: Tu ne bâtiras pas
  rationale: Le futur à valeur injonctive conserve le ton solennel et l’ambiguïté entre interdiction et déclaration divine.
- source_word: בַיִת
  choice: maison
  rationale: Conserve le sens concret de בַיִת et l’expression biblique, sans expliciter par « temple » ce que le contexte permet de comprendre.
- source_word: לִשְׁמִי
  choice: pour mon nom
  rationale: Traduction directe de l’expression qui associe le sanctuaire au nom révélé et à la présence de Dieu.
- source_word: כִּי
  choice: car
  rationale: Introduit clairement la raison donnée par Dieu, dans un registre digne et fluide.
- source_word: אִישׁ מִלְחָמוֹת
  choice: un homme de guerre
  rationale: Expression française naturelle correspondant à l’hébreu littéral « un homme de guerres »; une note signale le pluriel du texte source.
- source_word: וְדָמִים שָׁפָכְתָּ
  choice: et tu as versé du sang
  rationale: Rend l’idiome hébreu par son équivalent français courant, sans ajouter de jugement moral explicite.
theological_decisions:
- issue: La raison pour laquelle David ne peut pas bâtir le temple
  choice: La traduction présente les guerres de David et le sang qu’il a versé comme les raisons données par Dieu.
  alternative: Préciser qu’il s’agit soit de violences moralement coupables, soit seulement d’une incompatibilité rituelle ou symbolique avec la fonction de bâtisseur du temple.
  rationale: Le verset ne détermine pas explicitement si ce sang versé était coupable, rituellement disqualifiant ou simplement incompatible avec le rôle envisagé. La formulation préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. « Bâtir » maintient le registre biblique sans être archaïque; « maison » et « pour mon nom » préservent les images et l’expression théologique de l’hébreu.
