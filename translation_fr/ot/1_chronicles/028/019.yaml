  text: הַ/כֹּ֥ל בִּ/כְתָ֛ב מִ/יַּ֥ד יְהוָ֖ה עָלַ֣/י הִשְׂכִּ֑יל כֹּ֖ל מַלְאֲכ֥וֹת הַ/תַּבְנִֽית׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/019.yaml
  text: All this he made clear to me in writing from the hand of Yahweh[b][a], all the works of the pattern.
translation:
  language: fr
  text: 'Tout cela, Yahweh me l’a fait comprendre par un écrit venant de la main de Yahweh[a] : tous les travaux du plan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible : « La main de Yahweh était sur moi, et il m’a fait comprendre tous les travaux du plan. »'
    reason: alternative_reading
  - marker: b
    text: Ou « modèle » ou « projet » ; le terme désigne la forme ou le plan à suivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: Tout cela
  rationale: 'Le contexte donne à כֹּל une valeur récapitulative : David renvoie à l’ensemble des dispositions qu’il vient d’énumérer.'
- source_word: בִּכְתָב
  choice: par un écrit
  rationale: Cette formulation indique que les instructions ont été communiquées sous forme écrite, tout en s’intégrant naturellement à la syntaxe française.
- source_word: מִיַּד יְהוָה
  choice: venant de sa main
  rationale: L’expression conserve l’image hébraïque de la main comme source et agent directs de la révélation divine; l’antécédent de « sa » est Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré conformément à l’usage du projet.
- source_word: עָלַי הִשְׂכִּיל
  choice: Yahweh me l’a fait comprendre
  rationale: Le hiphil de שׂכל exprime ici le fait de donner l’intelligence ou de faire comprendre. Le pronom « me » rend la relation à David, tandis que la note conserve l’autre analyse possible de עָלַי.
- source_word: כֹּל מַלְאֲכוֹת
  choice: tous les travaux
  rationale: מְלָאכוֹת désigne les travaux ou tâches nécessaires à la réalisation du sanctuaire; « travaux » convient au contexte architectural.
- source_word: הַתַּבְנִית
  choice: le plan
  rationale: Dans ce contexte architectural, תַּבְנִית désigne le plan ou le modèle révélé. « Plan » est naturel en français et n’exclut pas la notion de modèle.
theological_decisions:
- issue: Analyse de la proposition condensée עָלַי הִשְׂכִּיל
  choice: Yahweh me l’a fait comprendre
  alternative: La main de Yahweh était sur moi et il m’a fait comprendre
  rationale: Le texte principal traite Yahweh comme sujet implicite de הִשְׂכִּיל et rattache le contenu compris à l’écrit. Comme עָלַי peut aussi se rattacher explicitement à « la main de Yahweh », cette lecture est conservée en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’image biblique de la main divine, tandis que la ponctuation clarifie que « tous les travaux » explicite le contenu de « tout cela ».
