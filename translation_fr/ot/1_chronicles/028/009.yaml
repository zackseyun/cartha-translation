  text: וְ/אַתָּ֣ה שְׁלֹמֹֽה בְנִ֡/י דַּע֩ אֶת אֱלֹהֵ֨י אָבִ֜י/ךָ וְ/עָבְדֵ֗/הוּ בְּ/לֵ֤ב שָׁלֵם֙ וּ/בְ/נֶ֣פֶשׁ חֲפֵצָ֔ה כִּ֤י כָל לְבָבוֹת֙ דּוֹרֵ֣שׁ יְהוָ֔ה וְ/כָל יֵ֥צֶר מַחֲשָׁב֖וֹת מֵבִ֑ין אִֽם תִּדְרְשֶׁ֨/נּוּ֙ יִמָּ֣צֵא לָ֔/ךְ וְ/אִם תַּֽעַזְבֶ֖/נּוּ יַזְנִיחֲ/ךָ֥ לָ/עַֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/009.yaml
  text: And you[a], Solomon my son, know the God of your father and serve him with a whole heart and a willing soul, for Yahweh searches all hearts and understands every intention of the thoughts. If you seek him, he will let himself be found by you; but if you forsake him[b], he will cast you off forever.
translation:
  language: fr
  text: Et toi, Salomon, mon fils, connais le Dieu de ton père et sers-le d’un cœur entier et d’une âme volontaire, car Yahweh sonde tous les cœurs et comprend toutes les intentions qui se forment dans les pensées. Si tu le cherches, il se laissera trouver par toi[a] ; mais si tu l’abandonnes, il te rejettera pour toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il sera trouvé par toi ». Le verbe hébreu est de forme passive ou réflexive.
    reason: lexical_alternative
  - marker: b
    text: Ou « il te repoussera à jamais ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּע
  choice: connais
  rationale: L’impératif appelle Salomon à reconnaître et à connaître personnellement Dieu, et non à posséder seulement un savoir intellectuel.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: le Dieu de ton père
  rationale: Cette formulation conserve le lien familial et la continuité de l’alliance dans l’exhortation de David à Salomon.
- source_word: וְעָבְדֵהוּ
  choice: et sers-le
  rationale: Le verbe englobe ici le service fidèle, l’obéissance et le culte ; « sers-le » en préserve l’étendue.
- source_word: בְּלֵב שָׁלֵם
  choice: d’un cœur entier
  rationale: שָׁלֵם exprime l’intégrité et la totalité. « Cœur entier » évite de suggérer une perfection sans faute tout en rendant l’idée d’une fidélité sans partage.
- source_word: וּבְנֶפֶשׁ חֲפֵצָה
  choice: et d’une âme bien disposée
  rationale: נֶפֶשׁ désigne la personne intérieure, tandis que חֲפֵצָה exprime le désir et la volonté. Cette formulation est naturelle en français et conserve les deux dimensions.
- source_word: כִּי כָל לְבָבוֹת דּוֹרֵשׁ יְהוָה
  choice: car Yahweh sonde tous les cœurs
  rationale: Dans ce contexte, דרשׁ signifie examiner ou pénétrer en profondeur. « Sonde » exprime clairement cette connaissance divine.
- source_word: וְכָל יֵצֶר מַחֲשָׁבוֹת מֵבִין
  choice: et discerne toutes les intentions des pensées
  rationale: יֵצֶר évoque ce qui se forme intérieurement, notamment une inclination ou une intention. « Discerne » rend מֵבִין avec naturel et souligne la compréhension pénétrante de Dieu sans préciser davantage l’ambiguïté de l’expression.
- source_word: אִם תִּדְרְשֶׁנּוּ
  choice: si tu le cherches
  rationale: Dans ce contexte d’alliance, le verbe désigne la recherche de Dieu dans la fidélité et la dépendance.
- source_word: יִמָּצֵא לָךְ
  choice: il se laissera trouver par toi
  rationale: Le niphal de מצא a une valeur passive ou réflexive. Cette traduction garde l’idée que Dieu est réellement trouvé tout en laissant entendre qu’il se rend accessible.
- source_word: תַּעַזְבֶנּוּ
  choice: si tu l’abandonnes
  rationale: עזב exprime ici la rupture de fidélité envers Dieu. « Abandonnes » est actuel, clair et suffisamment solennel.
- source_word: יַזְנִיחֲךָ לָעַד
  choice: il te rejettera pour toujours
  rationale: Le hiphil de זנח exprime le rejet. La traduction maintient sans l’atténuer la gravité de l’avertissement formulé dans le texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Distinction entre le cœur et l’âme
  choice: Conserver « cœur » et « âme » dans le texte principal.
  alternative: Réduire les deux expressions à des catégories psychologiques telles que l’esprit ou la volonté.
  rationale: L’hébreu distingue לֵב et נֶפֶשׁ pour exprimer l’engagement de toute la personne. Maintenir cette distinction évite d’aplatir l’anthropologie du texte.
- issue: Accessibilité divine dans יִמָּצֵא לָךְ
  choice: « il se laissera trouver par toi »
  alternative: « il sera trouvé par toi » ou « tu le trouveras »
  rationale: La forme hébraïque permet une lecture passive ou réflexive. Le choix principal exprime idiomatiquement en français la recherche humaine et l’accessibilité accordée par Dieu, sans transformer cette nuance en système doctrinal.
- issue: Gravité de l’avertissement de l’alliance
  choice: « il te rejettera pour toujours »
  alternative: « il te repoussera à jamais »
  rationale: Le texte formule un avertissement catégorique. La traduction en conserve la force sans chercher à résoudre des questions théologiques plus larges que le verset ne traite pas.
translation_notes:
  register: Français international moderne, digne et direct. « Cœur entier » et « âme bien disposée » restent accessibles tout en conservant les images anthropologiques hébraïques. Le parallélisme de l’exhortation, de la motivation et de l’avertissement est maintenu.
