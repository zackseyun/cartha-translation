  terminology: « Yahweh », « Dieu », « cœur », « âme », « servir », « sonder », « chercher », « abandonner » et « rejeter » conviennent. « Pour toujours » rend bien לָעַד. Les ancres de notes sont correctement placées et leurs contenus correspondent aux alternatives signalées.
