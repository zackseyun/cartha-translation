  source_fidelity: 'Le sens général est fidèle au texte hébreu : l’adresse à Salomon, la connaissance et le service de Dieu, le cœur entier, l’âme volontaire, la recherche de Dieu et l’avertissement final sont correctement rendus. « Il se laissera trouver » est une bonne expression française de la forme niphal, sans imposer une interprétation doctrinale. Toutefois, « toutes les intentions des pensées » calque l’hébreu de manière peu idiomatique et rend insuffisamment la notion de formation ou de disposition intérieure portée par יֵצֶר.'
