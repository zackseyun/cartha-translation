  text: וַ/יִּתֵּ֣ן דָּוִ֣יד לִ/שְׁלֹמֹ֣ה בְנ֡/וֹ אֶת תַּבְנִ֣ית הָ/אוּלָם֩ וְֽ/אֶת בָּ֨תָּ֜י/ו וְ/גַנְזַכָּ֧י/ו וַ/עֲלִיֹּתָ֛י/ו וַ/חֲדָרָ֥י/ו הַ/פְּנִימִ֖ים וּ/בֵ֥ית הַ/כַּפֹּֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/011.yaml
  text: Then David gave to Solomon his son the plan of the portico[a], its houses, its treasuries, its upper rooms, its inner chambers, and the house of the mercy seat.
translation:
  language: fr
  text: David donna alors à son fils Salomon le plan du vestibule, de ses bâtiments, de ses salles du trésor, de ses chambres hautes, de ses pièces intérieures et de la salle du propitiatoire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « salle du couvercle d’expiation ». Le mot hébreu désigne le couvercle de l’arche située dans le lieu très saint.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: plan
  rationale: Dans ce contexte architectural, le terme désigne le modèle ou le plan précis transmis en vue de la construction.
- source_word: הָאוּלָם
  choice: vestibule
  rationale: Le mot désigne le hall d’entrée du Temple; « vestibule » est clair, actuel et architecturalement précis.
- source_word: בָּתָּיו
  choice: ses bâtiments
  rationale: Le pluriel de בַּיִת renvoie ici vraisemblablement aux différentes structures du complexe plutôt qu’à des maisons d’habitation.
- source_word: גַנְזַכָּיו
  choice: ses salles du trésor
  rationale: Le terme désigne des lieux où étaient conservés des objets précieux ou consacrés; cette formulation est plus transparente que le seul mot « trésors ».
- source_word: עֲלִיֹּתָיו
  choice: ses chambres hautes
  rationale: Le terme désigne des pièces aménagées à l’étage; « chambres hautes » conserve la désignation architecturale traditionnelle sans être obscure.
- source_word: חֲדָרָיו הַפְּנִימִים
  choice: ses pièces intérieures
  rationale: Cette traduction restitue simplement les chambres ou pièces situées à l’intérieur, sans ajouter l’idée superlative de « les plus intérieures ».
- source_word: בֵית הַכַּפֹּרֶת
  choice: la salle du propitiatoire
  rationale: Littéralement « la maison du propitiatoire »; dans ce plan architectural, בֵית désigne naturellement la salle qui abritait le couvercle de l’arche.
- source_word: וַיִּתֵּן
  choice: David donna alors
  rationale: Le waw narratif fait progresser le récit; « alors » exprime naturellement cette succession en français.
theological_decisions:
- issue: Traduction de כַּפֹּרֶת dans le vocabulaire du sanctuaire
  choice: propitiatoire
  alternative: couvercle d’expiation
  rationale: « Propitiatoire » est le terme cultuel français établi pour le couvercle de l’arche, tandis que l’autre traduction en explicite la fonction. La note conserve cette possibilité sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation reste proche de l’énumération architecturale hébraïque tout en clarifiant que בֵית הַכַּפֹּרֶת désigne vraisemblablement une salle.
