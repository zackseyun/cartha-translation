  text: לַ/זָּהָ֤ב בַּ/מִּשְׁקָל֙ לַ/זָּהָ֔ב לְ/כָל כְּלֵ֖י עֲבוֹדָ֣ה וַ/עֲבוֹדָ֑ה לְ/כֹ֨ל כְּלֵ֤י הַ/כֶּ֨סֶף֙ בְּ/מִשְׁקָ֔ל לְ/כָל כְּלֵ֖י עֲבוֹדָ֥ה וַ/עֲבוֹדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/014.yaml
  text: the weight of the gold for all the articles of every kind of service[a], and the weight of the silver for all the articles of every kind of service.
translation:
  language: fr
  text: le poids de l’or pour tous les objets destinés à chaque type de service[a], et le poids de l’argent pour tous les objets destinés à chaque type de service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète littéralement « service et service », tournure distributive qui signifie ici « chaque type de service » ou « chaque usage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זָהָב
  choice: or
  rationale: Terme courant désignant le matériau; l’article hébreu n’a pas besoin d’être reproduit dans cette formulation française.
- source_word: בַּמִּשְׁקָל
  choice: le poids
  rationale: Dans cette phrase elliptique de type inventaire, le nom précédé de ב indique la quantité déterminée selon le poids; la formulation nominale française s’intègre naturellement à la liste.
- source_word: כְּלֵי
  choice: objets
  rationale: Terme générique qui englobe récipients, ustensiles et autres pièces affectées au service du sanctuaire, sans restreindre indûment leur nature.
- source_word: עֲבוֹדָה
  choice: service
  rationale: Dans ce contexte cultuel, le mot désigne les fonctions ou usages liés au service du sanctuaire.
- source_word: עֲבוֹדָה וַעֲבוֹדָה
  choice: chaque type de service
  rationale: La répétition hébraïque a une valeur distributive. Cette tournure française en restitue le sens sans reproduire une répétition peu naturelle.
- source_word: כֶּסֶף
  choice: argent
  rationale: Désigne le métal, en parallèle avec l’or.
- source_word: לְכָל / לְכֹל
  choice: pour tous / à chaque
  rationale: Le premier emploi porte sur l’ensemble des objets, tandis que la répétition distributive qui suit est rendue par « chaque type ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne, avec une structure nominale qui conserve le caractère elliptique d’une liste d’inventaire. « Destinés à » explicite sobrement la relation marquée par לְ et évite de donner l’impression que les objets accomplissent eux-mêmes le service.
