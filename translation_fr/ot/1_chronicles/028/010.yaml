  text: רְאֵ֣ה עַתָּ֗ה כִּֽי יְהוָ֛ה בָּ֧חַר בְּ/ךָ֛ לִ/בְנֽוֹת בַּ֥יִת לַ/מִּקְדָּ֖שׁ חֲזַ֥ק וַ/עֲשֵֽׂה׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/010.yaml
  text: See now[a], for Yahweh has chosen you to build a house for the sanctuary. Be strong[b], and do it.
translation:
  language: fr
  text: Considère maintenant[a] que Yahweh t’a choisi pour bâtir une maison pour le sanctuaire[b]. Sois fort et fais-le.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Regarde maintenant » ou « Prends garde maintenant ». Ici, l’impératif invite à une attention réfléchie, et non seulement à l’action de voir.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « une maison pour le sanctuaire ». On peut aussi comprendre : « une maison qui servira de sanctuaire ». Il s’agit du temple en tant que lieu saint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה עַתָּה
  choice: Considère maintenant ceci
  rationale: L’impératif ראה appelle ici à prêter attention et à réfléchir, plutôt qu’à simplement regarder. « Considère » garde cette force exhortative, tandis que « maintenant » rend עַתָּה.
- source_word: כִּי
  choice: ':'
  rationale: Dans cette formulation française, les deux-points introduisent naturellement le contenu et le motif de l’exhortation sans alourdir la phrase. La relation explicative portée par כִּי demeure perceptible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בָּחַר בְּךָ
  choice: t’a choisi
  rationale: Le passé composé exprime une décision accomplie dont la portée reste actuelle dans cette exhortation.
- source_word: לִבְנוֹת בַּיִת לַמִּקְדָּשׁ
  choice: pour bâtir une maison pour le sanctuaire
  rationale: « Bâtir » rend naturellement בנה. Le maintien des deux noms, « maison » et « sanctuaire », évite de réduire la formule hébraïque au seul mot « temple ».
- source_word: חֲזַק
  choice: Sois fort
  rationale: Cette formule directe conserve l’exhortation à la force, à la fermeté et à la résolution.
- source_word: וַעֲשֵׂה
  choice: et fais-le
  rationale: Le pronom reprend naturellement en français la tâche de construction évoquée juste avant, comme l’implique le contexte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette distinction au lieu de lui substituer un titre.
- issue: Rapport entre בַּיִת et לַמִּקְדָּשׁ
  choice: une maison pour le sanctuaire
  alternative: un temple / une maison comme sanctuaire
  rationale: Le texte hébreu juxtapose « maison » et « sanctuaire » au moyen de ל. Le rendu retenu conserve cette formulation et sa légère ambiguïté plutôt que de l’interpréter entièrement.
translation_notes:
  register: Français international moderne, direct et digne. « Considère » exprime l’attention réfléchie demandée par l’ouverture; « fais-le » garde la brièveté énergique de la conclusion.
