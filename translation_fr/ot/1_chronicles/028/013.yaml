base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/013.yaml
  text: for the divisions of the priests and the Levites[a], and for all the work of the service of the house of Yahweh[b], and for all the vessels of service of the house of Yahweh.
translation:
  language: fr
  text: pour les classes des prêtres et des Lévites[a], pour toutes les tâches du service de la maison de Yahweh, et pour tous les objets[b] du service de la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : les groupes organisés des prêtres et des Lévites.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : les ustensiles ou les instruments.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְלְקוֹת
  choice: classes
  rationale: Dans les Chroniques, le terme désigne des groupes organisés auxquels sont attribuées des périodes ou des fonctions de service. « Classes » exprime cette organisation sans lui donner une coloration militaire.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant du nom désignant les membres de la prêtrise d’Israël ; l’article défini hébreu est conservé.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation traditionnelle et immédiatement compréhensible des membres de la tribu affectés au service sacré.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: les tâches du service
  rationale: Cette formulation naturelle rend l’ensemble des travaux ou fonctions liés au service du sanctuaire tout en maintenant la distinction entre מְלֶאכָה, le travail ou la tâche, et עֲבוֹדָה, le service.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’image hébraïque plutôt que de l’expliciter par « temple », et le nom divin est translittéré sous la forme « Yahweh ».
- source_word: כְּלֵי
  choice: objets
  rationale: Le terme désigne collectivement les divers récipients, ustensiles ou instruments employés dans le service. « Objets » est assez large pour ne pas le limiter aux seuls contenants.
- source_word: לְכָל
  choice: pour tous / pour toutes
  rationale: La répétition de la préposition לְ avec כֹּל structure l’énumération des éléments couverts ; « pour » reproduit clairement cette fonction en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre et correspond à la convention fournie pour ce projet.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe conserve la forme énumérative du fragment hébreu, qui dépend du contexte précédent. « Classes » garde la nuance d’organisation du service, tandis que « objets » évite de restreindre כְּלֵי à des récipients.
