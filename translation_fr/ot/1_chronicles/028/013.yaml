  naturalness: Le français est globalement naturel et conserve à juste titre le caractère de fragment dépendant du verset précédent. « Tous les objets du service de la maison de Yahweh » est à la fois plus concis, plus parallèle à « les tâches du service » et plus proche de l’hébreu que « objets servant au service ».
