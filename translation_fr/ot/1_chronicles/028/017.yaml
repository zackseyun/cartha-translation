base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/017.yaml
  text: and the forks, the basins, and the pitchers of pure gold; and for the golden bowls, by weight for each bowl and bowl; and for the silver bowls, by weight for each bowl and bowl.
translation:
  language: fr
  text: ainsi que les fourchettes, les bassins et les cruches en or pur ; pour les coupes d’or, selon le poids de chaque coupe[a] ; et pour les coupes d’argent, selon le poids de chaque coupe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète « pour coupe et coupe », tournure distributive indiquant que le poids était déterminé pour chaque récipient. La même expression est employée pour les coupes d’argent.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּזְלָגוֹת
  choice: fourchettes
  rationale: Le nom désigne des ustensiles du sanctuaire munis de pointes. « Fourchettes » est concret, actuel et compréhensible, sans recourir à l’expression vieillie « fourchettes à viande ».
- source_word: מִּזְרָקוֹת
  choice: bassins
  rationale: Ce terme désigne couramment des récipients employés dans le service sacrificiel. « Bassins » permet aussi de le distinguer de כְפוֹרֵי, rendu plus loin par « coupes ».
- source_word: קְּשָׂוֹת
  choice: cruches
  rationale: Le terme semble désigner des récipients servant à verser. « Cruches » exprime naturellement cette fonction; « aiguières » serait plus soutenu et « coupes » moins précis.
- source_word: זָהָב טָהוֹר
  choice: en or pur
  rationale: Cette formulation française naturelle indique la matière des ustensiles précédents et conserve la qualification de pureté.
- source_word: כְפוֹרֵי
  choice: coupes
  rationale: Dans cet inventaire, le mot désigne des récipients probablement peu profonds. « Coupes » est naturel et maintient la distinction lexicale avec les « bassins ».
- source_word: בְּמִשְׁקָל
  choice: le poids prévu
  rationale: Le contexte poursuit l’énumération des matériaux et mesures remis ou prescrits par David. Cette formulation rend clairement l’attribution d’un poids déterminé à chaque objet.
- source_word: לִכְפוֹר וּכְפוֹר
  choice: pour chacune
  rationale: La répétition hébraïque a une valeur distributive, littéralement « pour coupe et coupe ». « Pour chacune » en restitue naturellement le sens en français, tandis qu’une note conserve la forme de l’hébreu.
- source_word: כֶּסֶף
  choice: argent
  rationale: Équivalent français standard du métal, ici mis en contraste avec l’or.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et lisible. Le verset prolonge syntaxiquement l’inventaire des versets précédents; l’ouverture « ainsi que » en rend la continuité. La répétition distributive hébraïque est exprimée naturellement dans le texte et explicitée en note.
