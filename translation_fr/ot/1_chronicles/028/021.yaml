source:
  edition: WLC
  text: וְ/הִנֵּ֗ה מַחְלְקוֹת֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם לְ/כָל עֲבוֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/עִמְּ/ךָ֙ בְ/כָל מְלָאכָ֜ה לְ/כָל נָדִ֤יב בַּֽ/חָכְמָה֙ לְ/כָל עֲבוֹדָ֔ה וְ/הַ/שָּׂרִ֥ים וְ/כָל הָ/עָ֖ם לְ/כָל דְּבָרֶֽי/ךָ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/021.yaml
  text: And behold[a], the divisions of the priests and the Levites are for all the service of the house of God, and with you in all the work will be every willing man skilled in wisdom for every kind of service; the officials also, and all the people[b], will be wholly at your command.
translation:
  language: fr
  text: 'Et voici : les classes des prêtres et des lévites sont là pour tout le service de la maison de Dieu. Pour tous les travaux, tu auras aussi à tes côtés tout homme de bonne volonté qui possède la compétence nécessaire à chaque tâche. Les chefs et tout le peuple[a] seront à ta disposition pour toutes tes instructions.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour toutes tes paroles »; c’est-à-dire prêts à exécuter toutes tes instructions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Conserve la fonction déictique et emphatique du marqueur discursif hébreu dans un français digne et encore naturel.
- source_word: מַחְלְקוֹת
  choice: les classes
  rationale: Désigne les groupes organisés ou rotations des prêtres et des lévites; « classes » est le terme français usuel dans ce contexte institutionnel.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: des prêtres et des lévites
  rationale: Maintient les deux catégories précises du personnel affecté au culte.
- source_word: לְכָל עֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: pour tout le service de la maison de Dieu
  rationale: Préserve à la fois l'étendue complète du service et l'expression concrète « maison de Dieu », sans la réduire interprétativement à « Temple ».
- source_word: וְעִמְּךָ בְכָל מְלָאכָה
  choice: Pour tous les travaux, tu auras aussi à tes côtés
  rationale: Rend naturellement en français l'assistance promise à Salomon dans l'ensemble du travail, tout en conservant l'idée de présence à ses côtés.
- source_word: לְכָל נָדִיב בַּחָכְמָה
  choice: tout homme de bonne volonté qui possède la compétence nécessaire
  rationale: נָדִיב exprime ici la disposition volontaire et חָכְמָה une sagesse pratique ou compétence artisanale. La formulation conserve le masculin singulier du texte tout en restant idiomatique.
- source_word: לְכָל עֲבוֹדָה
  choice: à chaque tâche
  rationale: Exprime l'application de la compétence à toute sorte de service et évite une répétition française pesante.
- source_word: וְהַשָּׂרִים
  choice: Les chefs
  rationale: Dans le cadre royal et administratif, שׂרים désigne les responsables ou dirigeants; « chefs » reste clair sans suggérer nécessairement une noblesse héréditaire.
- source_word: וְכָל הָעָם
  choice: et tout le peuple
  rationale: Traduction directe qui maintient l'étendue collective du soutien promis.
- source_word: לְכָל דְּבָרֶיךָ
  choice: seront à ta disposition pour toutes tes instructions
  rationale: Le sens littéral est « pour toutes tes paroles »; dans ce contexte, il s'agit de la disponibilité à exécuter les directives de Salomon. La traduction conserve explicitement la totalité exprimée par לְכָל.
theological_decisions:
- issue: Référence masculine dans נָדִיב
  choice: tout homme de bonne volonté
  alternative: toute personne volontaire / chaque volontaire
  rationale: Le substantif adjectival hébreu est au masculin singulier. La traduction garde cette forme sans en tirer une exclusion théologique qui n'est pas explicitée dans le verset.
- issue: Traduction de בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  alternative: le Temple de Dieu
  rationale: « Maison de Dieu » reproduit l'image cultuelle concrète du texte source; « Temple » serait contextuellement juste, mais plus interprétatif.
- issue: Portée de לְכָל דְּבָרֶיךָ
  choice: pour toutes tes instructions
  alternative: pour toutes tes paroles / dans toutes tes affaires
  rationale: Le contexte favorise les directives à exécuter, mais la formulation garde la totalité des « paroles » sans transformer la phrase en affirmation absolue d'obéissance illimitée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe hébraïque a été légèrement réorganisée pour la clarté, tout en maintenant les catégories cultuelles, le masculin singulier de נָדִיב, l'image de la « maison de Dieu » et la nuance pratique de חָכְמָה.
