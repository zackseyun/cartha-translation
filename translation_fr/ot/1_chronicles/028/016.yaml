    rationale: La formulation « et celui de l’argent » fait de « poids » le substantif sous-entendu pour l’argent. Le texte hébreu dit littéralement « et argent pour les tables d’argent »; dans ce contexte l’ellipse peut être comprise, mais il est préférable de ne pas la rendre explicitement comme si elle était répétée.
  - severity: medium
    issue: 'Expression principale peu naturelle : « tables de la disposition »'
    rationale: En français, « disposition » sans complément ne désigne pas spontanément l’arrangement cultuel des pains. « Présentation » donne une expression plus lisible tout en laissant la note expliciter le référent probable.
