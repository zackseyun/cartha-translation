  text: וְ/אֶת הַ/זָּהָ֥ב מִשְׁקָ֛ל לְ/שֻׁלְחֲנ֥וֹת הַֽ/מַּעֲרֶ֖כֶת לְ/שֻׁלְחַ֣ן וְ/שֻׁלְחָ֑ן וְ/כֶ֖סֶף לְ/שֻׁלְחֲנ֥וֹת הַ/כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/016.yaml
  text: and the weight of the gold for the tables of the arrangement[a], for each table and table, and silver for the silver tables.
translation:
  language: fr
  text: ainsi que le poids de l’or pour les tables de la présentation[a], table par table, et l’argent pour les tables d’argent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tables pour les pains disposés » ; traditionnellement « tables des pains de proposition ».
    reason: Alternative lexicale explicitant la réalité cultuelle probablement désignée par le terme hébreu מַעֲרֶכֶת.
lexical_decisions:
- source_word: מִשְׁקָל
  choice: poids
  rationale: Dans cet inventaire du mobilier du Temple, le terme désigne la quantité de métal précieux déterminée par pesée pour chaque objet.
- source_word: שֻׁלְחֲנוֹת הַמַּעֲרֶכֶת
  choice: tables de la disposition
  rationale: Cette formulation garde la transparence et l’ambiguïté de l’hébreu, où מַעֲרֶכֶת désigne ce qui est disposé en ordre, probablement les pains placés en rangées devant Dieu. Une formulation cultuelle plus explicite est donnée en note.
- source_word: לְשֻׁלְחָן וְשֻׁלְחָן
  choice: table par table
  rationale: Le redoublement du singulier a une valeur distributive. « Table par table » la restitue naturellement en français sans perdre l’idée d’une attribution individuelle.
- source_word: כֶּסֶף
  choice: argent
  rationale: Le terme désigne ici le métal et forme un contraste direct avec l’or.
- source_word: שֻׁלְחֲנוֹת הַכָּסֶף
  choice: tables d’argent
  rationale: Le groupe construit désigne le plus naturellement des tables faites d’argent ou caractérisées comme telles; cette traduction reste concise sans introduire l’idée non exprimée d’un placage.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et lisible. « Ainsi que » respecte le caractère continuatif du verset, tandis que « celui de l’argent » évite une répétition lourde sans modifier le sens.
