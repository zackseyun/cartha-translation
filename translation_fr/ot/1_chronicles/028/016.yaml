  source_fidelity: Le verset rend correctement le poids (מִשְׁקָל), l’opposition entre l’or et l’argent, les tables et la valeur distributive de « table par table ». Toutefois, « celui de l’argent » étend explicitement « poids » à l’argent, alors que l’hébreu coordonne simplement « l’argent » dans le second membre. Une formulation qui laisse cette ellipse moins explicitée est préférable.
  naturalness: « Tables de la disposition » est grammaticalement possible, mais peu idiomatique et insuffisamment évocateur sans complément en français moderne. « Tables de la présentation » est plus naturel dans ce contexte cultuel tout en ne nommant pas directement les pains dans le texte principal.
  terminology: « Présentation » rend de manière naturelle le sens d’une chose disposée devant Dieu, sans imposer dans le texte principal l’expression traditionnelle « pains de proposition ». La note conserve les possibilités explicatives. « Tables d’argent » et « table par table » sont appropriés.
