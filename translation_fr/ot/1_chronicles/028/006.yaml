    rationale: Bien que « cour » puisse désigner un espace clos, le pluriel « cours » est ambigu en français moderne (notamment « leçons ») et est moins idiomatique pour les enceintes du temple. « Mes parvis » identifie naturellement les cours sacrées visées par חֲצֵרוֹת sans modifier le sens.
