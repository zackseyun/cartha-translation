  text: וַ/יֹּ֣אמֶר לִ֔/י שְׁלֹמֹ֣ה בִנְ/ךָ֔ הֽוּא יִבְנֶ֥ה בֵיתִ֖/י וַ/חֲצֵרוֹתָ֑/י כִּי בָחַ֨רְתִּי ב֥/וֹ לִ/י֙ לְ/בֵ֔ן וַ/אֲנִ֖י אֶֽהְיֶה לּ֥/וֹ לְ/אָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/006.yaml
  text: And he said to me[a], ‘Solomon your son—he will build my house and my courts, for I have chosen him for myself as a son, and I will be to him as a father.’
translation:
  language: fr
  text: 'Il m’a dit : « Salomon, ton fils, c’est lui qui construira ma maison et mes parvis, car je l’ai choisi pour être mon fils, et moi, je serai son père[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « je l’ai choisi pour moi comme fils, et je serai pour lui comme un père ».'
    reason: La note signale la forme particulière de la double construction avec לְ, tandis que le texte principal en donne le sens idiomatique en français.
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Il m’a dit
  rationale: Le verbe narratif וַיֹּאמֶר est rendu par un passé composé naturel en français moderne, tandis que לִי indique le destinataire.
- source_word: שְׁלֹמֹה בִנְךָ הוּא
  choice: Salomon, ton fils, c’est lui
  rationale: La dislocation avec « c’est lui » restitue naturellement en français l’insistance portée par le pronom indépendant הוּא.
- source_word: יִבְנֶה בֵיתִי
  choice: construira ma maison
  rationale: « Maison » traduit directement בֵּית et conserve la résonance théologique du lieu de résidence de Dieu sans remplacer explicitement le mot par « temple ».
- source_word: וַחֲצֵרוֹתָי
  choice: et mes cours
  rationale: Dans le contexte du sanctuaire, חֲצֵרוֹת désigne les espaces clos entourant l’édifice; « cours » est précis et usuel.
- source_word: כִּי בָחַרְתִּי בוֹ
  choice: car je l’ai choisi
  rationale: כִּי introduit ici le motif du choix de Salomon; le passé composé exprime un choix accompli dont l’effet demeure.
- source_word: לִי לְבֵן
  choice: pour être mon fils
  rationale: Cette formulation française naturelle exprime la relation filiale visée par la double construction avec לְ, sans réduire le choix à une simple fonction.
- source_word: וַאֲנִי אֶהְיֶה לוֹ לְאָב
  choice: et moi, je serai son père
  rationale: Le pronom détaché « moi » rend l’insistance de וַאֲנִי; « je serai son père » transpose idiomatiquement la formule relationnelle אֶהְיֶה לוֹ לְאָב.
theological_decisions:
- issue: Le langage de père et de fils dans la relation entre Dieu et Salomon
  choice: Conserver directement les termes « mon fils » et « son père ».
  alternative: « Je l’ai choisi pour moi comme fils, et je serai pour lui comme un père. »
  rationale: La formulation maintient pleinement le langage de l’alliance royale sans l’affaiblir en simple comparaison, tout en évitant d’importer dans ce contexte immédiat des conclusions théologiques ultérieures.
translation_notes:
  register: Français international moderne, naturel et digne. La structure « c’est lui qui » rend l’emphase hébraïque sans lourdeur; « maison » et « cours » préservent le vocabulaire concret du sanctuaire.
