  verdict: revise
  source_fidelity: 'Le sens du texte hébreu est correctement rendu : Yahweh choisit Salomon, fils de David, pour occuper le trône du royaume qui appartient à Yahweh et exerce son autorité sur Israël. « Siéger » convient au contexte d’intronisation. La révision ne modifie pas le sens, mais rend plus nette en français la portée de עַל־יִשְׂרָאֵל.'
  naturalness: La virgule avant le second tiret était fautive en français (« —, »). De plus, « du royaume de Yahweh, sur Israël » laisse « sur Israël » syntaxiquement flottant. « du royaume de Yahweh sur Israël » rattache clairement ce complément à « royaume » tout en restant concis et naturel dans un registre biblique moderne.
  terminology: « Yahweh », « fils », « trône » et « royaume » sont cohérents avec le texte source et avec les choix du projet. La note conserve l’attribution ultime de la royauté à Yahweh sans imposer d’interprétation confessionnelle.
