base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/005.yaml
  text: And from among all my sons—for Yahweh has given me many sons—he chose Solomon my son to sit on the throne of the kingdom of Yahweh over Israel[a][b].
translation:
  language: fr
  text: Parmi tous mes fils — car Yahweh m’a donné beaucoup de fils — il a choisi mon fils Salomon pour siéger sur le trône du royaume de Yahweh sur Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « le trône du royaume de Yahweh sur Israël » souligne que la royauté exercée sur Israël appartient en dernier ressort à Yahweh, même si Salomon en est le roi humain.
    reason: cross_reference
lexical_decisions:
- source_word: וּמִכָּל בָּנַי
  choice: Parmi tous mes fils
  rationale: Le français « parmi » exprime naturellement la sélection à l’intérieur d’un groupe. « Fils » conserve la précision masculine du contexte de succession royale.
- source_word: כִּי רַבִּים בָּנִים נָתַן לִי יְהוָה
  choice: car Yahweh m’a donné beaucoup de fils
  rationale: כִּי introduit ici une explication incidente. Le passé composé convient au don passé dont le résultat demeure présent.
- source_word: וַיִּבְחַר בִּשְׁלֹמֹה בְנִי
  choice: il a choisi mon fils Salomon
  rationale: Le sujet reste Yahweh. L’ordre « mon fils Salomon » est naturel en français et garde le lien filial explicite.
- source_word: לָשֶׁבֶת עַל כִּסֵּא
  choice: pour siéger sur le trône
  rationale: Dans ce contexte d’intronisation, « siéger » rend la position royale et sa fonction sans réduire le verbe à la simple action physique de s’asseoir.
- source_word: מַלְכוּת יְהוָה
  choice: du royaume de Yahweh
  rationale: La chaîne construite attribue explicitement le royaume à Yahweh; la formulation française conserve cette affirmation.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: La préposition exprime ici l’autorité royale exercée sur Israël. La répétition de « sur » préserve la relation syntaxique du texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre est translittéré selon la convention du projet, ce qui préserve sa référence personnelle et alliance-covenantale.
- issue: Sens de « trône du royaume de Yahweh »
  choice: Conserver intégralement « le trône du royaume de Yahweh »
  alternative: le trône royal d’Israël
  rationale: Le texte hébreu présente le royaume comme appartenant à Yahweh; une simplification en « royaume d’Israël » effacerait cette portée théologique.
- issue: Valeur royale de לָשֶׁבֶת
  choice: siéger
  alternative: s’asseoir
  rationale: « Siéger » exprime idiomatiquement l’exercice de la royauté tout en conservant l’image du trône.
translation_notes:
  register: Français international moderne, digne et accessible. Les tirets signalent la proposition explicative. Le nom « Yahweh » suit la convention du projet; la formulation inhabituelle mais signifiante « royaume de Yahweh » est volontairement conservée.
