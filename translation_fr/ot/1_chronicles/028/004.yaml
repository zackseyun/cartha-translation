revisions:
- from: Pourtant, Yahweh, le Dieu d’Israël, m’a choisi dans toute la maison de mon père pour être roi sur Israël pour toujours[a]. En effet, il a choisi Juda comme chef[b] ; dans la maison de Juda, il a choisi la maison de mon père, et parmi les fils de mon père, il a pris plaisir en moi pour me faire régner sur tout Israël.
  to: Or Yahweh, le Dieu d’Israël, m’a choisi d’entre toute la maison de mon père pour être roi sur Israël pour toujours[a]. En effet, il a choisi Juda comme chef[b] et, dans la maison de Juda, il a choisi la maison de mon père ; parmi les fils de mon père, il m’a accordé sa faveur pour faire de moi roi sur tout Israël.
  rationale: La révision remplace une expression spatiale ambiguë par « d’entre toute la maison de mon père », supprime le contraste non exigé par le texte, et emploie des formulations françaises naturelles qui conservent la faveur divine personnelle et le sens causatif de l’intronisation. Les deux notes restent ancrées aux expressions qu’elles expliquent et préservent les ambiguïtés lexicales et temporelles pertinentes.
