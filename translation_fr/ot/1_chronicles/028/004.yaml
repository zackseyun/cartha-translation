  text: וַ/יִּבְחַ֡ר יְהוָ֣ה אֱלֹהֵי֩ יִשְׂרָאֵ֨ל בִּ֜/י מִ/כֹּ֣ל בֵּית אָבִ֗/י לִ/הְי֨וֹת לְ/מֶ֤לֶךְ עַל יִשְׂרָאֵל֙ לְ/עוֹלָ֔ם כִּ֤י בִֽ/יהוּדָה֙ בָּחַ֣ר לְ/נָגִ֔יד וּ/בְ/בֵ֥ית יְהוּדָ֖ה בֵּ֣ית אָבִ֑/י וּ/בִ/בְנֵ֣י אָבִ֔/י בִּ֣/י רָצָ֔ה לְ/הַמְלִ֖יךְ עַל כָּל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/004.yaml
  text: Yet Yahweh[a], the God of Israel, chose me from all my father's house to be king over Israel forever; for he chose Judah as leader, and in the house of Judah, my father's house, and among my father's sons[b], he took pleasure in me to make me king over all Israel.
translation:
  language: fr
  text: Or Yahweh, le Dieu d’Israël, m’a choisi d’entre toute la maison de mon père pour être roi sur Israël pour toujours[a]. En effet, il a choisi Juda comme chef[b] et, dans la maison de Juda, il a choisi la maison de mon père ; parmi les fils de mon père, il m’a accordé sa faveur pour faire de moi roi sur tout Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Pour toujours » traduit un terme hébreu pouvant désigner une durée perpétuelle ou indéfiniment prolongée ; ici, il concerne la permanence de la royauté davidique.
    reason: cultural_note
  - marker: b
    text: 'Ou « comme prince » ou « comme dirigeant » (hébreu : nagid).'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: וַיִּבְחַר / בָּחַר
  choice: a choisi / il a choisi
  rationale: « Choisir » rend naturellement les deux occurrences de בחר et maintient leur répétition significative.
- source_word: בִּי מִכֹּל בֵּית אָבִי
  choice: m’a choisi dans toute la maison de mon père
  rationale: Cette formulation indique que David a été choisi au sein de toute sa maison paternelle, tout en restant naturelle en français.
- source_word: לִהְיוֹת לְמֶלֶךְ
  choice: pour être roi
  rationale: La construction infinitive exprime la fonction à laquelle David a été choisi.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression conserve la portée durable, voire perpétuelle, du terme hébreu dans le cadre de la royauté davidique.
- source_word: לְנָגִיד
  choice: comme chef
  rationale: « Chef » exprime ici une autorité dirigeante sans imposer le sens dynastique moderne de « prince » ni assimiler le terme à « roi ».
- source_word: וּבְבֵית יְהוּדָה בֵּית אָבִי
  choice: dans la maison de Juda, il a choisi la maison de mon père
  rationale: L’ajout de « il a choisi », implicite par ellipse en hébreu, clarifie en français la progression Juda → maison de Juda → maison du père de David, tout en respectant la préposition בְּ.
- source_word: וּבִבְנֵי אָבִי
  choice: et parmi les fils de mon père
  rationale: Cette traduction garde la formulation généalogique explicite de l’hébreu plutôt que de la réduire à « mes frères ».
- source_word: בִּי רָצָה
  choice: il a pris plaisir en moi
  rationale: La formulation maintient la nuance de faveur ou de bon plaisir et ne la confond pas avec le verbe précédent « choisir ».
- source_word: לְהַמְלִיךְ
  choice: pour me faire régner
  rationale: Le hiphil de מלך est causatif. « Me faire régner » le restitue avec naturel et évite la répétition lourde de « pour me faire roi » après « pour être roi ».
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sur tout Israël
  rationale: La traduction conserve l’étendue de l’autorité royale affirmée par le texte.
theological_decisions:
- issue: Portée de לְעוֹלָם dans la royauté de David
  choice: pour toujours
  alternative: à perpétuité ; pour une durée indéfinie
  rationale: « Pour toujours » conserve l’horizon dynastique et covenantal de l’affirmation sans expliquer dans le verset la manière dont cette permanence s’accomplit.
- issue: Sens de נָגִיד
  choice: chef
  alternative: prince ; dirigeant
  rationale: Le terme désigne une personne placée à la tête du peuple. « Chef » préserve cette latitude sans établir une hiérarchie technique entre cette fonction et la royauté.
- issue: Ellipse dans la succession des choix divins
  choice: répéter « il a choisi » devant « la maison de mon père »
  alternative: 'conserver une coordination elliptique : « et dans la maison de Juda, la maison de mon père »'
  rationale: La répétition explicite en français rend intelligible la progression du choix divin déjà gouvernée par בחר en hébreu, sans ajouter une nouvelle affirmation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure a été légèrement explicitée pour rendre claire la succession des choix divins. Les marqueurs de notes [a] et [b] figurent dans le texte à l’endroit correspondant.
