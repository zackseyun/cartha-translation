base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/015.yaml
  text: and the weight for the lampstands of gold and their lamps of gold[a], by the weight of each lampstand and its lamps; and for the lampstands of silver, by weight for each lampstand and its lamps, according to the service of each lampstand.
translation:
  language: fr
  text: Il fixa également le poids des chandeliers en or et de leurs lampes en or, pour chaque chandelier et ses lampes ; pour les chandeliers en argent, le poids de chaque chandelier et de ses lampes, selon le service de chaque chandelier.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « chandelier et chandelier » dans les expressions rendues par « chaque chandelier » ; cette répétition a une valeur distributive et considère les chandeliers un par un.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: poids
  rationale: Dans ce contexte d’inventaire du sanctuaire, le nom désigne une quantité déterminée par pesée. « Poids » est précis et naturel.
- source_word: מְנֹרוֹת
  choice: chandeliers
  rationale: מְנוֹרָה désigne le support portant les lampes, et non les lampes elles-mêmes. « Chandeliers » est le terme biblique français courant et maintient cette distinction.
- source_word: נֵרֹתֵיהֶם / נֵרֹתֶיהָ
  choice: lampes
  rationale: Le mot נֵר désigne les lampes individuelles placées sur le chandelier; « lampes » les distingue clairement de leur support.
- source_word: זָהָב
  choice: or
  rationale: Le matériau est explicitement répété en hébreu pour les chandeliers et leurs lampes; cette répétition est conservée.
- source_word: בְּמִשְׁקַל מְנוֹרָה וּמְנוֹרָה
  choice: le poids de chaque chandelier
  rationale: La répétition hébraïque « chandelier et chandelier » a une valeur distributive. « Chaque chandelier » en rend naturellement le sens en français.
- source_word: וְלִמְנֹרוֹת הַכֶּסֶף
  choice: pour les chandeliers en argent
  rationale: Cette formulation garde le parallèle avec les chandeliers en or tout en restant idiomatique en français.
- source_word: כַּעֲבוֹדַת מְנוֹרָה וּמְנוֹרָה
  choice: selon la fonction de chaque chandelier
  rationale: עֲבוֹדָה peut ici désigner le service, l’usage ou la fonction assignée à l’objet cultuel. « Fonction » convient à un objet et préserve le cadre du sanctuaire sans préciser davantage l’usage envisagé.
