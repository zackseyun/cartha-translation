  text: וּ/לְ/מִזְבַּ֧ח הַ/קְּטֹ֛רֶת זָהָ֥ב מְזֻקָּ֖ק בַּ/מִּשְׁקָ֑ל וּ/לְ/תַבְנִ֣ית הַ/מֶּרְכָּבָ֗ה הַ/כְּרֻבִ֤ים זָהָב֙ לְ/פֹ֣רְשִׂ֔ים וְ/סֹכְכִ֖ים עַל אֲר֥וֹן בְּרִית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/018.yaml
  text: and for the altar of incense[a], refined gold by weight; and for the pattern of the chariot[b], the cherubim of gold spreading out their wings and overshadowing the ark of the covenant of Yahweh.
translation:
  language: fr
  text: et, pour l’autel de l’encens, de l’or affiné, au poids ; et pour le modèle du char[a], les chérubins d’or qui déploient leurs ailes et couvrent[b] l’arche de l’alliance de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le plan » ou « la maquette du char ». L’expression hébraïque est difficile et peut désigner la structure formée par les chérubins, conçue comme un trône-char associé à l’arche.
    reason: alternative_reading
  - marker: b
    text: Ou « abritent de leurs ailes » ; le verbe hébreu décrit les chérubins dont les ailes étendues recouvrent l’arche.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: l’autel de l’encens
  rationale: Rend directement la relation construite et désigne clairement l’objet cultuel.
- source_word: זָהָב מְזֻקָּק
  choice: de l’or affiné
  rationale: Préserve le sens métallurgique d’un or purifié par affinage.
- source_word: בַּמִּשְׁקָל
  choice: selon le poids fixé
  rationale: Exprime une quantité attribuée d’après un poids déterminé, de façon naturelle en français.
- source_word: תַבְנִית הַמֶּרְכָּבָה
  choice: le modèle du char
  rationale: Conserve les sens directs de תַבְנִית et מֶרְכָּבָה sans résoudre une expression difficile en « trône-char ».
- source_word: הַכְּרֻבִים זָהָב
  choice: les chérubins en or
  rationale: Emploie le terme biblique français usuel et indique simplement leur matériau.
- source_word: לְפֹרְשִׂים
  choice: qui déploient leurs ailes
  rationale: Le verbe signifie étendre ou déployer ; l’objet implicite « ailes » est fourni par l’iconographie explicite des chérubins de l’arche.
- source_word: וְסֹכְכִים
  choice: et couvrent
  rationale: Rend sobrement l’action de recouvrir ou d’abriter par-dessus, sans imposer une nuance supplémentaire.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahvé
  rationale: Préserve toute la chaîne construite ainsi que le nom divin personnel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; « Yahvé » est la forme française traditionnelle et immédiatement reconnaissable du nom personnel, sans le remplacer par un titre.
- issue: Rapport entre le char et les chérubins
  choice: maintenir « le modèle du char » suivi de « les chérubins en or »
  alternative: le modèle du trône-char formé par les chérubins en or
  rationale: La formulation hébraïque est difficile. Le texte principal conserve sa tension grammaticale et son image, tandis que la note signale l’interprétation possible liée au trône porté par les chérubins.
translation_notes:
  register: Français international moderne, digne et lisible. La coordination et le caractère elliptique sont conservés parce que le verset poursuit la liste commencée dans le contexte. Les marqueurs de notes sont placés sur les expressions réellement commentées.
