  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לִ/שְׁלֹמֹ֣ה בְנ֗/וֹ חֲזַ֤ק וֶ/אֱמַץ֙ וַ/עֲשֵׂ֔ה אַל תִּירָ֖א וְ/אַל תֵּחָ֑ת כִּי֩ יְהוָ֨ה אֱלֹהִ֤ים אֱלֹהַ/י֙ עִמָּ֔/ךְ לֹ֤א יַרְפְּ/ךָ֙ וְ/לֹ֣א יַֽעַזְבֶ֔/ךָּ עַד לִ/כְל֕וֹת כָּל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/020.yaml
  text: And David said to Solomon his son[a], “Be strong and courageous, and do it. Do not fear or be dismayed, for Yahweh God, my God, is with you. He will not fail you or forsake you until all the work for the service of the house of Yahweh is finished.”
translation:
  language: fr
  text: 'David dit à son fils Salomon : « Sois fort et courageux, et agis. N’aie pas peur et ne te laisse pas abattre, car Yahweh Dieu, mon Dieu, est avec toi. Il ne te laissera pas tomber[a] et ne t’abandonnera pas jusqu’à ce que soit achevé tout le travail au service de la maison de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il ne te lâchera pas » ; le verbe hébreu peut exprimer l’idée de ne pas relâcher sa prise ou son soutien.'
    reason: Alternative lexicale permettant de percevoir l’image sous-jacente à רפה.
lexical_decisions:
- source_word: חֲזַק וֶאֱמַץ
  choice: Sois fort et courageux
  rationale: Les deux impératifs forment une exhortation hébraïque courante. Cette formulation française naturelle en conserve la force et le parallélisme.
- source_word: וַעֲשֵׂה
  choice: et agis
  rationale: L’impératif appelle Salomon à passer à l’action dans l’œuvre du temple. « Agis » reste direct sans ajouter un complément absent de l’hébreu.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: N’aie pas peur et ne te laisse pas abattre
  rationale: Le premier verbe exprime la peur; le second, dans cette formule d’exhortation, évoque l’effondrement du courage ou le découragement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהִים אֱלֹהַי
  choice: Dieu, mon Dieu
  rationale: La répétition appositionnelle de l’hébreu est conservée afin de maintenir son insistance et la relation personnelle exprimée par David.
- source_word: עִמָּךְ
  choice: est avec toi
  rationale: La proposition nominale hébraïque ne comporte pas de verbe exprimé. Le présent français en reflète naturellement l’affirmation.
- source_word: לֹא יַרְפְּךָ
  choice: Il ne te laissera pas tomber
  rationale: À la forme causative, רפה peut évoquer le relâchement d’une prise ou d’un soutien. Cette expression française idiomatique conserve cette nuance et la distingue du verbe suivant, « abandonner ».
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: et ne t’abandonnera pas
  rationale: עזב signifie ici quitter ou abandonner. Le choix français garde la solennité de l’assurance donnée à Salomon.
- source_word: עַד לִכְלוֹת
  choice: jusqu’à ce que soit achevé
  rationale: L’infinitif construit indique le terme de l’action en vue, rendu naturellement par une proposition temporelle.
- source_word: כָּל מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: tout le travail nécessaire au service de la maison de Yahweh
  rationale: Cette formulation déploie naturellement la chaîne de noms hébraïque tout en conservant les notions distinctes de travail, de service et de maison de Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente directement au lieu de le remplacer par le titre « Seigneur ».
- issue: Portée temporelle de עַד, « jusqu’à »
  choice: Conserver « jusqu’à ce que » sans préciser ce qui advient ensuite
  alternative: Reformuler de manière à garantir explicitement une présence permanente
  rationale: L’hébreu assure le soutien de Dieu pendant toute l’exécution de la tâche, sans affirmer ici qu’il cesserait ensuite ni expliciter la période ultérieure. La traduction préserve cette limite rhétorique sans en tirer une conclusion théologique.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs restent vigoureux sans archaïsme. « Maison de Yahweh » conserve la désignation biblique du temple, tandis que « travail nécessaire au service » rend lisible la chaîne nominale hébraïque.
