source:
  edition: WLC
  text: וְ֠/עַתָּה לְ/עֵינֵ֨י כָל יִשְׂרָאֵ֤ל קְהַל יְהוָה֙ וּ/בְ/אָזְנֵ֣י אֱלֹהֵ֔י/נוּ שִׁמְר֣וּ וְ/דִרְשׁ֔וּ כָּל מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם לְמַ֤עַן תִּֽירְשׁוּ֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה וְ/הִנְחַלְתֶּ֛ם לִ/בְנֵי/כֶ֥ם אַחֲרֵי/כֶ֖ם עַד עוֹלָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/008.yaml
  text: And now[a], in the sight of all Israel, the assembly of Yahweh, and in the hearing of our God, keep and seek all the commandments of Yahweh your God[b], so that you may possess the good land and leave it as an inheritance to your sons after you forever.
translation:
  language: fr
  text: Et maintenant, devant tout Israël, l’assemblée de Yahweh, et à l’écoute de notre Dieu, observez et recherchez tous les commandements de Yahweh votre Dieu, afin que vous possédiez[a] le bon pays et que vous le transmettiez en héritage à vos fils[b] après vous, pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « receviez en héritage le bon pays ». Le verbe hébreu peut exprimer le fait d’hériter ou celui de posséder, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « fils » ; le terme hébreu est au masculin pluriel, et non le terme plus général « enfants ».
    reason: lexical_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la liaison avec le discours précédent et le passage rhétorique à l’exhortation présente.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Rend l’image hébraïque et souligne que l’exhortation est prononcée publiquement devant tout Israël.
- source_word: קְהַל יְהוָה
  choice: l’assemblée de Yahweh
  rationale: קהל désigne ici la communauté réunie; « assemblée » est actuel, clair et moins chargé institutionnellement que « congrégation ».
- source_word: וּבְאָזְנֵי אֱלֹהֵינוּ
  choice: et aux oreilles de notre Dieu
  rationale: Préserve l’anthropomorphisme hébraïque et le parallèle entre les yeux d’Israël et les oreilles de Dieu, tout en signifiant que Dieu entend cette exhortation solennelle.
- source_word: שִׁמְרוּ
  choice: observez
  rationale: Avec des commandements pour complément, « observer » exprime naturellement en français le fait de s’y conformer fidèlement.
- source_word: וְדִרְשׁוּ
  choice: et recherchez
  rationale: 'Conserve la force volitive de דרש : il ne s’agit pas seulement d’étudier les commandements, mais de les rechercher avec application.'
- source_word: כָּל מִצְוֺת
  choice: tous les commandements
  rationale: Reproduction directe du pluriel précédé de כל, sans réduction à une idée générale de loi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme dans le texte source.
- source_word: לְמַעַן
  choice: afin que
  rationale: Exprime clairement la visée ou le résultat attendu de l’obéissance.
- source_word: תִּירְשׁוּ
  choice: vous possédiez
  rationale: ירשׁ peut signifier hériter ou prendre possession. Dans ce contexte, « posséder » convient au maintien d’Israël dans le bon pays tout en laissant l’autre nuance visible en note.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: ce bon pays
  rationale: « Bon pays » conserve la qualification covenantale traditionnelle; le démonstratif français reprend naturellement le pays connu dans le contexte.
- source_word: וְהִנְחַלְתֶּם
  choice: et que vous le transmettiez en héritage
  rationale: Le causatif de נחל signifie faire hériter les descendants; cette formulation française rend clairement la transmission du pays.
- source_word: לִבְנֵיכֶם
  choice: à vos fils
  rationale: Le substantif hébreu est explicitement masculin pluriel; la traduction conserve cette précision lexicale.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Formulation française naturelle qui conserve la portée temporelle indéfinie et durable de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom personnel divin; sa transcription évite de le remplacer silencieusement par un titre.
- issue: Nuance de ירשׁ concernant le pays
  choice: possédiez
  alternative: receviez en héritage
  rationale: Le verbe couvre les idées de possession et d’héritage. Le contexte immédiat porte sur la conservation et la transmission du pays; le texte retient « possédiez » et la note maintient l’autre lecture possible.
- issue: Genre de בנים
  choice: fils
  alternative: enfants
  rationale: Le terme source est masculin pluriel. « Fils » en reproduit la forme sans généraliser, tandis qu’une note signale explicitement cette donnée.
translation_notes:
  register: Français international moderne, digne et accessible. La construction solennelle « sous les yeux… et aux oreilles… » garde le parallélisme imagé de l’hébreu. « Recherchez » est volontairement conservé à côté d’« observez » afin de ne pas réduire דרש à la seule étude intellectuelle ni de fusionner les deux impératifs.
