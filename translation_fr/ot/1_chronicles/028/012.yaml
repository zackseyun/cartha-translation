  to: 'ainsi que le plan de tout ce qu’il avait à l’esprit[a] : pour les cours de la maison de Yahvé, pour toutes les salles tout autour, pour les salles du trésor de la maison de Dieu et pour les salles du trésor des choses saintes.'
  rationale: La révision retire l’ajout interprétatif « avait reçu », emploie une expression française idiomatique correspondant à la lecture anthropologique possible, et préserve explicitement en note la lecture d’un Esprit divin. Elle rend aussi יהוה par « Yahvé » et place l’ancre au point d’ambiguïté.
