source:
  edition: WLC
  text: וְ/תַבְנִ֗ית כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה בָ/ר֨וּחַ֙ עִמּ֔/וֹ לְ/חַצְר֧וֹת בֵּית יְהוָ֛ה וּ/לְ/כָל הַ/לְּשָׁכ֖וֹת סָבִ֑יב לְ/אֹֽצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹצְר֖וֹת הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/012.yaml
  text: 'and the plan of all that was in the Spirit with him: for the courts of the house of Yahweh[a], for all the surrounding chambers, for the treasuries of the house of God, and for the treasuries of the holy things.'
translation:
  language: fr
  text: 'ainsi que le plan de tout ce qu’il avait à l’esprit[a] : pour les cours de la maison de Yahvé, pour toutes les salles tout autour, pour les salles du trésor de la maison de Dieu et pour les salles du trésor des choses saintes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de tout ce qui était dans l’Esprit avec lui ». L’expression hébraïque peut désigner soit ce qui était dans la pensée ou le cœur de David, soit ce qui lui était communiqué par l’Esprit de Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: תַבְנִית
  choice: plan
  rationale: Dans ce contexte architectural, le mot désigne le plan ou le modèle des différentes parties du sanctuaire.
- source_word: כֹּל אֲשֶׁר הָיָה בָרוּחַ עִמּוֹ
  choice: tout ce qu’il avait reçu par l’Esprit
  rationale: Cette formulation française naturelle fait ressortir la probable origine divine du plan, tout en laissant la lecture anthropologique dans la note.
- source_word: לְחַצְרוֹת
  choice: les cours
  rationale: « Cours » est le terme architectural courant pour les espaces ouverts du complexe du temple.
- source_word: בֵּית יְהוָה
  choice: la maison de l’Éternel
  rationale: « Maison » conserve l’image hébraïque, tandis que « l’Éternel » rend le nom divin selon l’usage biblique français établi.
- source_word: לְּשָׁכוֹת סָבִיב
  choice: toutes les salles qui l’entouraient
  rationale: « Salles » est clair en français moderne, et la proposition relative rend naturellement leur disposition autour de l’édifice.
- source_word: אֹצְרוֹת
  choice: trésoreries
  rationale: Le mot désigne ici des locaux où étaient conservés des biens du sanctuaire.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette traduction littérale maintient le parallélisme avec « la maison de l’Éternel ».
- source_word: הַקֳּדָשִׁים
  choice: les choses saintes
  rationale: La formulation directe conserve l’étendue du pluriel, qui peut inclure divers objets ou dons consacrés.
theological_decisions:
- issue: Sens de בָרוּחַ עִמּוֹ
  choice: '« ce qu’il avait reçu par l’Esprit » : référence probable à l’Esprit de Dieu'
  alternative: « tout ce qu’il avait dans son esprit », c’est-à-dire dans sa pensée ou son cœur
  rationale: Le contexte des plans révélés, notamment le verset 19, favorise une origine divine. Toutefois, l’hébreu permet aussi de comprendre l’esprit humain de David; cette ambiguïté réelle est donc conservée en note.
translation_notes:
  register: Français moderne, digne et accessible. La formulation principale privilégie la lecture divine suggérée par le contexte, sans supprimer l’autre analyse possible de l’hébreu.
