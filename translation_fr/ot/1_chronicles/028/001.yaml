source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל דָּוִ֣יד אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֡ל שָׂרֵ֣י הַ/שְּׁבָטִ֣ים וְ/שָׂרֵ֣י הַ/מַּחְלְק֣וֹת הַ/מְשָׁרְתִ֪ים אֶת הַ/מֶּ֟לֶךְ וְ/שָׂרֵ֣י הָ/אֲלָפִ֣ים וְ/שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/שָׂרֵ֣י כָל רְכוּשׁ וּ/מִקְנֶה֩ לַ/מֶּ֨לֶךְ וּ/לְ/בָנָ֜י/ו עִם הַ/סָּרִיסִ֧ים וְ/הַ/גִּבּוֹרִ֛ים וּֽ/לְ/כָל גִּבּ֥וֹר חָ֖יִל אֶל יְרוּשָׁלִָֽם־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/001.yaml
  text: 'Then David assembled at Jerusalem all the leaders of Israel: the leaders of the tribes[a], the leaders of the divisions that served the king, the commanders of thousands and of hundreds, and the leaders over all the property and livestock belonging to the king and to his sons, together with the officials, the mighty men, and every mighty man of valor.'
translation:
  language: fr
  text: 'David réunit à Jérusalem tous les chefs d’Israël : les chefs des tribus, les chefs des divisions au service du roi, les commandants de milliers et de centaines, les responsables de tous les biens et troupeaux appartenant au roi et à ses fils, ainsi que les fonctionnaires de la cour[a], les hommes vaillants et tous les hommes de valeur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « eunuques » ; le terme hébreu peut désigner soit des eunuques au sens propre, soit, plus généralement, des fonctionnaires de la cour royale.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: réunit
  rationale: Le hiphil de קהל exprime ici l’action de convoquer et de rassembler officiellement; « réunit » est naturel et convient à cette assemblée institutionnelle.
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: les chefs d’Israël
  rationale: שַׂר couvre les fonctions de chef, responsable ou commandant; « chefs » sert ici de terme générique avant l’énumération des différentes charges.
- source_word: שָׂרֵי הַשְּׁבָטִים
  choice: les chefs des tribus
  rationale: Cette formulation rend directement le groupe construit et reste cohérente avec le terme générique employé juste avant.
- source_word: הַמַּחְלְקוֹת הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: les divisions au service du roi
  rationale: מַחְלְקוֹת désigne des groupes organisés par roulement ou divisions, tandis que le participe précise leur service auprès du roi.
- source_word: שָׂרֵי הָאֲלָפִים וְשָׂרֵי הַמֵּאוֹת
  choice: les commandants de milliers et de centaines
  rationale: Dans ce cadre militaire et administratif, « commandants » convient à שָׂרֵי; « milliers » et « centaines » conservent les désignations hébraïques sans décider s’il s’agit toujours d’effectifs exacts.
- source_word: רְכוּשׁ וּמִקְנֶה
  choice: biens et troupeaux
  rationale: רְכוּשׁ désigne les possessions ou richesses, et מִקְנֶה le bétail au sens collectif; ce binôme français est clair et suffisamment large.
- source_word: לַמֶּלֶךְ וּלְבָנָיו
  choice: appartenant au roi et à ses fils
  rationale: Le lamed marque ici la possession ou l’association; « appartenant à » explicite naturellement ce rapport.
- source_word: הַסָּרִיסִים
  choice: les fonctionnaires de la cour
  rationale: סָרִיס peut désigner des eunuques au sens propre ou des fonctionnaires royaux. Le contexte administratif favorise la fonction, tandis que l’autre sens est conservé en note.
- source_word: הַגִּבּוֹרִים
  choice: les guerriers d’élite
  rationale: Dans les Chroniques, le pluriel désigne souvent les guerriers renommés de David; cette expression française rend leur statut sans archaïsme.
- source_word: כָל גִּבּוֹר חָיִל
  choice: tous les vaillants guerriers
  rationale: L’expression associe force personnelle et valeur ou capacité militaire. « Vaillants guerriers » en restitue le sens idiomatique dans un français actuel.
