  - severity: low
    issue: « Guerriers d’élite » est interprétatif
    rationale: גִּבּוֹרִים désigne des hommes forts, vaillants ou guerriers, mais ne signifie pas explicitement qu’ils constituent une élite. Une formulation plus neutre préserve mieux la portée du terme source.
