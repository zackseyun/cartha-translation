  source_fidelity: La condition introduite par אִם est bien conservée. « J’affermirai », « son royaume » et « pour toujours » rendent fidèlement וַהֲכִינוֹתִי, מַלְכוּתוֹ et עַד־לְעוֹלָם. La finale explicative « comme il le fait aujourd’hui » correspond naturellement à l’ellipse de כַּיּוֹם הַזֶּה dans son contexte.
  naturalness: '« Tenir ferme pour mettre en pratique » est peu idiomatique en français moderne : « s’attache fermement à mettre en pratique » exprime plus naturellement la fermeté persistante visée par יֶחֱזַק. « Ordonnances » convient mieux que « règles » au registre juridique et scripturaire de מִשְׁפָּטַי.'
  terminology: Le couple « commandements et ordonnances » maintient la distinction entre מִצְוֺת et מִשְׁפָּטִים, avec un registre formel accessible. La note b est ajustée afin de demeurer une véritable variante du texte révisé.
