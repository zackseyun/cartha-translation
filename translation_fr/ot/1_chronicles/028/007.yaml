  text: וַ/הֲכִינוֹתִ֥י אֶת מַלְכוּת֖/וֹ עַד לְ/עוֹלָ֑ם אִם יֶחֱזַ֗ק לַ/עֲשׂ֛וֹת מִצְוֺתַ֥/י וּ/מִשְׁפָּטַ֖/י כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/007.yaml
  text: And I will establish his kingdom forever[a], if he is strong to do my commandments and my judgments[c][b], as at this day.
translation:
  language: fr
  text: J’affermirai son royaume pour toujours[a], s’il s’attache fermement à mettre en pratique mes commandements et mes ordonnances[b], comme il le fait aujourd’hui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’établirai » ou « je rendrai ferme » son royaume.
    reason: lexical_alternative
  - marker: b
    text: Ou « s’il se montre résolu à mettre en pratique mes commandements et mes règles ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « comme en ce jour », c’est-à-dire comme il le fait maintenant.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲכִינוֹתִי
  choice: J’affermirai
  rationale: Le hiphil de כון signifie ici faire tenir fermement, affermir ou établir. « J’affermirai » convient au contexte royal et fait écho à l’idée de fermeté présente dans la proposition conditionnelle.
- source_word: מַלְכוּתוֹ
  choice: son royaume
  rationale: מַלְכוּת peut désigner la royauté, le règne ou le royaume. « Royaume » demeure naturel en français et conserve l’ampleur dynastique du terme.
- source_word: עַד לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression marque une durée sans fin; « pour toujours » en restitue clairement la force en français moderne.
- source_word: אִם
  choice: s’il
  rationale: La particule אִם introduit explicitement une condition, qu’il importe de conserver sans l’atténuer.
- source_word: יֶחֱזַק
  choice: tient ferme
  rationale: Le verbe חזק exprime ici la fermeté et la détermination dans l’obéissance. « Tient ferme » préserve cette image avec un français naturel.
- source_word: לַעֲשׂוֹת
  choice: pour mettre en pratique
  rationale: Littéralement « pour faire ». Avec des commandements et des règles, « mettre en pratique » exprime clairement l’accomplissement concret sans réduire le sens à une simple observance formelle.
- source_word: מִצְוֺתַי
  choice: mes commandements
  rationale: « Commandements » conserve la tonalité formelle et l’aspect prescriptif de מִצְוָה.
- source_word: וּמִשְׁפָּטַי
  choice: et mes règles
  rationale: מִשְׁפָּטִים peut désigner des jugements, des ordonnances ou des règles. Dans ce contexte légal, « règles » est clair, actuel et suffisamment large.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme il le fait aujourd’hui
  rationale: L’expression hébraïque signifie littéralement « comme en ce jour ». Dans le contexte, elle renvoie à la conduite présente de Salomon; l’explicitation minimale rend l’ellipse intelligible en français.
theological_decisions:
- issue: Caractère conditionnel de la promesse relative au royaume de Salomon
  choice: La pérennité de son royaume est formulée comme dépendant de sa fermeté à pratiquer les commandements et les règles de Dieu.
  alternative: Présenter l’obéissance de Salomon comme une simple description de son caractère, sans condition explicite.
  rationale: La particule אִם introduit sans ambiguïté une condition. La traduction conserve donc la tension avec les dimensions inconditionnelles de la promesse davidique attestées ailleurs, sans chercher à les harmoniser dans ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la condition explicite et l’image de fermeté du texte hébreu. L’ellipse finale est légèrement explicitée dans le corps du texte, tandis que sa forme littérale est signalée en note.
