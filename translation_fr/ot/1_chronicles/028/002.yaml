base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/002.yaml
  text: Then King David rose to his feet and said[a], “Hear me, my brothers and my people. It was in my heart to build a house of rest for the ark of the covenant of Yahweh, and for the footstool of our God[c][b], and I made preparations to build it.”
translation:
  language: fr
  text: 'Alors le roi David se leva et dit : « Écoutez-moi, mes frères[a] et mon peuple ! J’avais à cœur de construire une demeure de repos[b] pour l’arche de l’alliance de Yahweh, et pour le marchepied de notre Dieu[c] ; j’ai fait des préparatifs pour la construire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes compatriotes » ; l’hébreu dit littéralement « mes frères », masculin pluriel employé dans cette allocution publique.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « une maison de repos » : une demeure stable où l’arche pourrait reposer.'
    reason: lexical_alternative
  - marker: c
    text: L’expression peut comprendre l’arche comme le marchepied associé à la présence de Dieu parmi son peuple ; voir Psaume 132.7.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּקָם דָּוִיד הַמֶּלֶךְ עַל רַגְלָיו
  choice: le roi David se leva et se tint debout
  rationale: Rend explicitement le mouvement de se lever et l’expression « sur ses pieds », dans un français naturel adapté à une allocution solennelle.
- source_word: שְׁמָעוּנִי
  choice: Écoutez-moi
  rationale: L’impératif de שמע suivi du suffixe de première personne appelle ici l’attention de l’assemblée ; « Écoutez-moi » est plus idiomatique en français actuel que « Entendez-moi ».
- source_word: אַחַי וְעַמִּי
  choice: mes frères et mon peuple
  rationale: Conserve le terme masculin « frères » et la double relation de parenté et d’appartenance nationale exprimée par l’hébreu.
- source_word: אֲנִי עִם לְבָבִי לִבְנוֹת
  choice: J’avais à cœur de construire
  rationale: Rend naturellement l’idiome hébreu exprimant l’intention intérieure et résolue, sans en faire un ordre divin ni une décision accomplie.
- source_word: בֵּית מְנוּחָה
  choice: une demeure de repos
  rationale: Préserve les deux notions de maison ou demeure et de repos, tout en évitant la raideur de « maison de repos », expression aujourd’hui associée à un établissement pour personnes âgées.
- source_word: לַאֲרוֹן בְּרִית יְהוָה
  choice: pour l’arche de l’alliance de Yahweh
  rationale: Reproduit clairement la chaîne construite hébraïque et conserve le nom divin personnel.
- source_word: וְלַהֲדֹם רַגְלֵי אֱלֹהֵינוּ
  choice: ainsi qu’un marchepied pour notre Dieu
  rationale: Conserve la métaphore du marchepied sans identifier explicitement les deux groupes nominaux dans le corps du texte, puisque la relation syntaxique peut être comprise comme coordination ou apposition explicative.
- source_word: וַהֲכִינוֹתִי לִבְנוֹת
  choice: et j’ai fait des préparatifs pour la construire
  rationale: Le hiphil de כון exprime la préparation ; le pronom féminin reprend naturellement la demeure à construire, objet implicite de l’infinitif hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve sa fonction de nom propre au lieu de le remplacer par un titre.
- issue: Relation entre l’arche et le marchepied de Dieu
  choice: Maintien de la coordination, avec explication en note
  alternative: « c’est-à-dire un marchepied pour notre Dieu »
  rationale: Le וְ hébreu permet une coordination formelle tandis que le contexte favorise une lecture appositionnelle où l’arche est associée au marchepied de la présence divine. La traduction ne tranche pas silencieusement cette tension.
- issue: Portée du masculin אַחַי
  choice: mes frères
  alternative: mes compatriotes
  rationale: Le masculin pluriel du texte est conservé. Dans cette allocution publique, le mot peut aussi désigner plus largement les membres du peuple apparenté, ce que précise la note.
translation_notes:
  register: Français international actuel, digne et accessible. L’allocution garde sa solennité sans tournures archaïques. « Demeure de repos » préserve l’image cultuelle tout en évitant le sens moderne indésirable de « maison de repos ».
