base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/015.yaml
  text: According to all these words and according to all this vision[b][a], so Nathan spoke to David.
translation:
  language: fr
  text: Conformément à toutes ces paroles et conformément à toute cette vision[a], Nathan parla ainsi à David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « révélation ». Le mot hébreu חָזוֹן désigne une vision prophétique ou une communication révélée.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל ... וּכְכֹל
  choice: Conformément à toutes ... et à toute
  rationale: La préposition כְּ avec כֹּל exprime la conformité. La répétition de « à toute » conserve le parallélisme de l’hébreu tout en restant naturelle en français.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: דְּבָרִים peut désigner des paroles, des choses ou des faits. Ici, Nathan transmet le message divin qui vient d’être énoncé ; « paroles » rend donc bien son contenu verbal sans éliminer l’autre possibilité lexicale.
- source_word: הֶחָזוֹן הַזֶּה
  choice: toute cette vision
  rationale: חָזוֹן désigne une vision prophétique ou une révélation. « Vision » est la correspondance directe et usuelle ; la note signale l’autre traduction possible.
- source_word: כֵּן
  choice: ainsi
  rationale: כֵּן marque la correspondance entre ce qui a été reçu et ce que Nathan a communiqué. La place de « ainsi » près du verbe exprime clairement cette fonction.
- source_word: דִּבֶּר נָתָן אֶל דָּוִיד
  choice: Nathan parla ainsi à David
  rationale: דִּבֶּר signifie « parler », et אֶל indique ici le destinataire. Le passé simple convient au registre narratif biblique français, dans une formulation claire et digne.
theological_decisions: []
