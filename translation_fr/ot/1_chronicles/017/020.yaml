source:
  edition: WLC
  text: יְהוָה֙ אֵ֣ין כָּמ֔וֹ/ךָ וְ/אֵ֥ין אֱלֹהִ֖ים זוּלָתֶ֑/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/020.yaml
  text: O Yahweh[a], there is none like you, and there is no God besides you, in all that we have heard with our own ears.
translation:
  language: fr
  text: Ô Yahweh, nul n’est comme toi, et il n’y a pas de Dieu en dehors de toi[a], d’après tout ce que nous avons entendu de nos propres oreilles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il n’y a aucun dieu excepté toi » ; ou : « il n’y a pas de Dieu à part toi ».'
    reason: Variante lexicale permettant de rendre autrement אֱלֹהִים זוּלָתֶךָ tout en conservant l’affirmation d’exclusivité.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit « Yahweh » afin de représenter directement le tétragramme, conformément à la convention du projet.
- source_word: אֵין כָּמוֹךָ
  choice: nul n’est comme toi
  rationale: Cette formulation digne et naturelle exprime l’absence de tout être comparable à Yahweh tout en restant proche de la structure hébraïque.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: et il n’y a pas de Dieu en dehors de toi
  rationale: « En dehors de toi » rend l’exclusion exprimée par זוּלָתֶךָ sans réduire l’énoncé à une simple supériorité comparative.
- source_word: בְּכֹל אֲשֶׁר
  choice: d’après tout ce que
  rationale: 'La préposition בְ introduit ici le fondement ou la mesure de la confession : celle-ci concorde avec l’ensemble du témoignage reçu.'
- source_word: שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: nous avons entendu de nos propres oreilles
  rationale: Le passé composé convient au bilan fait dans la prière, et l’expression française conserve l’insistance concrète de « nos oreilles ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ou le SEIGNEUR
  rationale: Le texte emploie explicitement le nom divin. La translittération retenue le préserve plutôt que de le remplacer par un titre.
- issue: Portée de וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: 'une affirmation exclusive : « il n’y a pas de Dieu en dehors de toi »'
  alternative: une simple affirmation de supériorité parmi plusieurs dieux
  rationale: La construction existentielle avec זוּלָתֶךָ nie directement l’existence d’un autre Dieu; elle ne dit pas seulement que Yahweh serait incomparable.
translation_notes:
  register: Français international actuel, solennel mais accessible. « Ô » conserve l’adresse priante; « nul n’est comme toi » donne une dignité littéraire sans archaïsme excessif.
