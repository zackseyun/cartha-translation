source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י יִשְׂרָאֵ֤ל וּ/נְטַעְתִּ֨י/הוּ֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹא יוֹסִ֤יפוּ בְנֵי עַוְלָה֙ לְ/בַלֹּת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/009.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], and they will dwell in their own place and be disturbed no more. And the sons of wickedness will no longer wear them down, as at the first[b],
translation:
  language: fr
  text: Je désignerai un lieu pour mon peuple Israël et je l’y planterai ; il y habitera et ne sera plus troublé. Les hommes malfaisants[a] ne continueront plus à l’accabler comme autrefois[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de l’injustice » ou « les fils du mal ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme au début » ; l’expression désigne une période antérieure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: Je fixerai un lieu
  rationale: שׂים signifie fondamentalement « placer, fixer, établir ». Avec מָקוֹם, « fixer un lieu » exprime naturellement l’initiative divine sans ajouter l’idée de don absente du texte.
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: pour mon peuple Israël
  rationale: Cette formulation conserve à la fois le lien d’alliance exprimé par « mon peuple » et le nom propre Israël.
- source_word: וּנְטַעְתִּיהוּ
  choice: et je l’implanterai
  rationale: Le verbe signifie littéralement « planter ». Le pronom masculin singulier reprend collectivement « mon peuple Israël »; le français permet ici de conserver ce singulier collectif.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: Il habitera chez lui
  rationale: Le sujet singulier continue de désigner Israël comme peuple collectif. Dans ce contexte, תַּחְתָּיו exprime l’établissement dans sa propre place; « chez lui » rend clairement cet idiome.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: et ne sera plus inquiété
  rationale: רגז peut évoquer l’agitation, l’ébranlement ou le trouble. Le passif français convient au contexte de menaces extérieures et de sécurité nationale.
- source_word: בְנֵי עַוְלָה
  choice: Les hommes malfaisants
  rationale: L’expression hébraïque signifie littéralement « les fils de l’injustice/du mal ». « Les hommes malfaisants » en restitue le sens dans un français actuel tout en signalant la tournure littérale en note.
- source_word: לְבַלֹּתוֹ
  choice: à l’accabler
  rationale: Dans cette forme, בלה décrit une action qui use ou épuise. « Accabler » rend l’oppression prolongée sans limiter le terme à une destruction physique.
- source_word: לֹא יוֹסִיפוּ
  choice: ne recommenceront plus
  rationale: La construction avec יסף et l’infinitif indique qu’une action ne se reproduira plus.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: comme autrefois
  rationale: L’expression renvoie à la période antérieure où Israël subissait l’oppression. « Comme autrefois » est naturel et conserve la référence temporelle générale.
theological_decisions:
- issue: Référence collective singulière à Israël
  choice: 'Conserver le singulier collectif : « je l’implanterai. Il habitera… ne sera plus inquiété… l’accabler ».'
  alternative: 'Employer le pluriel en comprenant « mon peuple » comme l’ensemble de ses membres : « je les implanterai; ils habiteront… ».'
  rationale: Les suffixes et verbes hébreux sont au masculin singulier et renvoient à Israël comme peuple collectif. Cette forme demeure claire et naturelle en français, tout en respectant de près la cohésion grammaticale du texte.
- issue: Sens idiomatique de תַּחְתָּיו
  choice: « chez lui », au sens d’une installation stable dans sa propre place.
  alternative: Traduire formellement par « sous lui », formulation obscure dans ce contexte.
  rationale: Le contexte porte sur le lieu assigné à Israël et sur sa sécurité. « Chez lui » transmet cette idée sans imposer un référent artificiel à « sous lui ».
- issue: Nature des oppresseurs désignés par בְנֵי עַוְלָה
  choice: « les hommes malfaisants », expression générale désignant ceux qui pratiquent le mal.
  alternative: « les fils de l’injustice », calque formel de l’idiome hébraïque.
  rationale: La traduction choisie ne précise ni une identité historique ni une catégorie doctrinale que le texte ne nomme pas; la note conserve l’image originale.
translation_notes:
  register: Français international moderne, digne et accessible. Le singulier collectif appliqué à Israël est maintenu, puisqu’il est naturel en français et reflète la grammaire hébraïque. La virgule finale indique que la phrase se poursuit au verset suivant.
