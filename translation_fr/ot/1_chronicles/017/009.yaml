  naturalness: Le français est globalement digne et accessible. La révision rend plus explicite et fluide le lien entre le lieu accordé et l’implantation d’Israël, tout en évitant une formulation administrative ou ambiguë.
  terminology: « Mon peuple Israël », « planter », « hommes malfaisants » et « accabler » conviennent. Les notes conservent avec justesse l’idiome hébreu « fils de l’injustice » et l’alternative temporelle finale.
