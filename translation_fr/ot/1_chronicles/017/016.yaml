  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔יד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִֽי אֲנִ֞י יְהוָ֤ה אֱלֹהִים֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/016.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, O Yahweh God, and what is my house, that you have brought me this far?”
translation:
  language: fr
  text: 'Alors le roi David entra et s’assit devant Yahweh. Il dit : « Qui suis-je, Yahweh Dieu, et qu’est-ce que ma maison[a], pour que tu m’aies conduit jusqu’ici ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma maisonnée », « ma famille » ou « ma dynastie ». Ici, le mot hébreu traduit par « maison » peut désigner les proches de David et sa lignée royale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entra
  rationale: Le verbe בוא peut signifier venir, aller ou entrer. Dans ce contexte d’accès à la présence divine, « entra » rend naturellement le mouvement sans préciser un lieu absent du texte.
- source_word: וַיֵּשֶׁב
  choice: s’assit
  rationale: Le sens concret « s’asseoir » convient à la suite narrative et préserve simplement le geste rapporté.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » traduit directement לִפְנֵי et peut exprimer la présence. Le nom divin יְהוָה est translittéré « Yahweh ».
- source_word: מִי אֲנִי
  choice: Qui suis-je
  rationale: Cette formulation française naturelle conserve la question par laquelle David exprime son humilité.
- source_word: וּמִי בֵיתִי
  choice: et qu’est-ce que ma maison
  rationale: L’hébreu emploie littéralement « qui » une seconde fois, mais le français demande naturellement « qu’est-ce que » pour parler de la maison au sens collectif ou dynastique.
- source_word: בֵיתִי
  choice: ma maison
  rationale: « Maison » préserve la largeur sémantique de בַּיִת, qui peut désigner la maisonnée, la famille ou la lignée royale dans ce contexte.
- source_word: הֲבִיאֹתַנִי
  choice: tu m’aies conduit
  rationale: Le hifil de בוא signifie faire venir ou amener. « Conduit » exprime ici de façon naturelle l’action par laquelle Dieu a mené David à sa situation présente.
- source_word: עַד הֲלֹם
  choice: jusqu’ici
  rationale: Cette expression française concise conserve à la fois l’idée d’aboutissement et l’éventuelle nuance de progression jusqu’au point présent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Portée de « ma maison »
  choice: Conserver « maison » dans le texte avec une note
  alternative: ma famille / ma maisonnée / ma dynastie
  rationale: Le contexte de la promesse faite à David donne au terme une portée familiale et dynastique, mais choisir uniquement « dynastie » résoudrait une polyvalence réelle du mot hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La structure interrogative et le terme métaphorique « maison » sont maintenus, tandis que « qu’est-ce que » évite en français la raideur d’un calque de la seconde occurrence hébraïque de « qui ».
