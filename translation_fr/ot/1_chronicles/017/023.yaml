source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ יֵאָמֵ֖ן עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/023.yaml
  text: And now[a], Yahweh, let the word that you have spoken concerning your servant and concerning his house be established forever, and do as you have spoken.
translation:
  language: fr
  text: Et maintenant, Yahweh, que la parole que tu as prononcée au sujet de ton serviteur et de sa maison[a] soit établie pour toujours, et fais comme tu l’as dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sa dynastie » ou « de sa lignée ». Dans ce contexte d’alliance, le mot hébreu traduit par « maison » peut désigner une maisonnée, une lignée familiale ou une dynastie royale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: La conjonction et l’adverbe temporel marquent la transition entre la louange précédente et la demande présente; « Et maintenant » conserve ce mouvement du discours.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: הַדָּבָר
  choice: la parole
  rationale: Dans ce contexte, le terme désigne la promesse divine, mais « parole » demeure proche de l’hébreu et maintient le lien explicite avec ce que Dieu a dit.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: que tu as prononcée
  rationale: Cette formulation française naturelle présente la parole comme une déclaration antérieure dont la portée demeure actuelle.
- source_word: עַל עַבְדְּךָ וְעַל בֵּיתוֹ
  choice: au sujet de ton serviteur et de sa maison
  rationale: La préposition exprime ici ce que concerne la parole divine. « Maison » conserve le terme chargé de sens dans l’alliance sans le réduire d’emblée à une seule interprétation.
- source_word: יֵאָמֵן
  choice: soit établie
  rationale: Le niphal de אמן exprime l’idée d’être rendu ferme, confirmé ou durablement établi. Cette tournure convient à une parole divine appelée à demeurer.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Expression française courante et digne pour la durée sans fin indiquée par l’hébreu.
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: et fais comme tu l’as dit
  rationale: La demande appelle Dieu à agir conformément à sa parole. La formulation est directe, naturelle et conserve la force de l’impératif hébreu.
theological_decisions:
- issue: Sens de « sa maison » dans le contexte de l’alliance davidique
  choice: Conserver « sa maison » dans le texte principal
  alternative: « sa dynastie » ou « sa lignée »
  rationale: Dans 1 Chroniques 17, la « maison » de David comprend son foyer et sa lignée royale. Garder l’image hébraïque préserve son amplitude et sa portée dans l’alliance; une note signale les sens dynastiques possibles sans imposer une seule interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à l’adresse directe de David à Dieu. La syntaxe conserve la cadence solennelle de la prière tout en restant immédiatement compréhensible.
