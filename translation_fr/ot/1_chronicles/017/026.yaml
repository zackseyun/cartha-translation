  text: וְ/עַתָּ֣ה יְהוָ֔ה אַתָּה ה֖וּא הָ/אֱלֹהִ֑ים וַ/תְּדַבֵּר֙ עַֽל עַבְדְּ/ךָ֔ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/026.yaml
  text: And now[a], Yahweh, you are God, and you have spoken this good thing concerning your servant.
translation:
  language: fr
  text: Et maintenant, Yahweh, c’est toi qui es Dieu, et tu as dit cette bonne chose au sujet de ton serviteur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu as fait cette bonne promesse au sujet de ton serviteur ». Littéralement : « tu as dit cette bonne chose au sujet de ton serviteur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec ce qui précède et la transition rhétorique de la prière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, conformément à la politique du projet.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: c’est toi qui es Dieu
  rationale: Rend l’insistance portée par la succession des pronoms tout en restant naturelle en français moderne.
- source_word: וַתְּדַבֵּר
  choice: tu as annoncé
  rationale: Exprime une parole antérieure dont la portée demeure actuelle, sans introduire explicitement la notion interprétative de promesse.
- source_word: עַל עַבְדְּךָ
  choice: au sujet de ton serviteur
  rationale: Avec le verbe parler, עַל indique ici le thème ou la personne concernée; «serviteur» convient à l’humble manière dont David se désigne devant Dieu.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: cette bonne chose
  rationale: Préserve la formulation large et concrète de l’hébreu sans la préciser silencieusement comme une promesse.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le nom divin; sa translittération préserve cette particularité sans substituer un titre.
- issue: Nature de «cette bonne chose»
  choice: Maintien de la formulation non précisée dans le texte principal
  alternative: cette bonne promesse
  rationale: Le contexte permet de comprendre une promesse, mais le nom «promesse» n’apparaît pas explicitement dans l’hébreu; l’ambiguïté lexicale est donc conservée et expliquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure clivée « c’est toi qui es Dieu » restitue l’emphase hébraïque. « Annoncé » évite la lourdeur de « parlé cette bonne chose » tout en ne transformant pas implicitement la parole en promesse.
