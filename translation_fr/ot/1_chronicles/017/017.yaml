  text: וַ/תִּקְטַ֨ן זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֱלֹהִ֔ים וַ/תְּדַבֵּ֥ר עַל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵ/רָח֑וֹק וּ/רְאִיתַ֗/נִי כְּ/ת֧וֹר הָ/אָדָ֛ם הַֽ/מַּעֲלָ֖ה יְהוָ֥ה אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/017.yaml
  text: And this was a small thing in your eyes[a], O God; yet you have spoken concerning your servant’s house for a long time to come, and you have regarded me according to the rank of man on high, O Yahweh God.
translation:
  language: fr
  text: Cela a été peu de chose à tes yeux, ô Dieu ; et pourtant, tu as parlé de la maison de ton serviteur pour un avenir lointain. Tu m’as considéré selon la condition de l’homme élevé[a], Yahweh Dieu !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu m’as fait voir les générations humaines à venir » ; ou : « tu m’as considéré comme un homme de haut rang ». La dernière proposition est difficile en hébreu et peut être comprise de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן זֹאת בְּעֵינֶיךָ
  choice: Cela a été peu de chose à tes yeux
  rationale: Conserve l’image hébraïque de l’évaluation « aux yeux » de Dieu tout en employant une tournure française naturelle.
- source_word: וַתְּדַבֵּר עַל בֵּית עַבְדְּךָ
  choice: tu as même parlé de la maison de ton serviteur
  rationale: « Parler de » reste proche de דבר על sans expliciter en « promettre » la portée que le contexte permet de comprendre. « Même » exprime ici la progression du discours.
- source_word: לְמֵרָחוֹק
  choice: pour un avenir lointain
  rationale: Le contexte donne à l’éloignement une valeur temporelle concernant l’avenir de la dynastie de David.
- source_word: וּרְאִיתַנִי
  choice: Tu m’as considéré
  rationale: ראה dépasse ici la simple perception visuelle et indique la manière dont Dieu envisage ou traite David.
- source_word: כְּתוֹר הָאָדָם הַמַּעֲלָה
  choice: comme un homme de haut rang
  rationale: Cette formulation française rend le sens probable d’ordre, de condition ou de rang associé à תור et l’idée d’élévation portée par הַמַּעֲלָה, sans masquer dans la note l’obscurité de l’hébreu.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Conserve le nom divin personnel suivi du titre אֱלֹהִים dans l’apostrophe finale.
theological_decisions:
- issue: Sens de la proposition difficile וּרְאִיתַנִי כְּתוֹר הָאָדָם הַמַּעֲלָה
  choice: Tu m’as considéré comme un homme de haut rang
  alternative: tu m’as fait voir les générations humaines à venir ; tu m’as considéré selon la condition de l’homme élevé
  rationale: Le texte massorétique est stable, mais sa syntaxe et le sens de תור dans cette expression sont obscurs. Le texte principal retient l’idée probable d’un statut élevé accordé à David, tandis que la note conserve les autres analyses importantes sans trancher artificiellement.
translation_notes:
  register: Français international actuel, digne et accessible. L’apostrophe « ô Dieu » maintient le ton de la prière, tandis que la seconde phrase évite une période excessivement lourde. Le marqueur de note est placé sur la proposition réellement ambiguë.
