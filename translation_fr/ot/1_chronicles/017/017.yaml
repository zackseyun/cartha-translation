- from: Cela a été peu de chose à tes yeux, ô Dieu, et tu as même parlé de la maison de ton serviteur pour un avenir lointain. Tu m’as considéré comme un homme de haut rang[a], Yahweh Dieu !
  to: Cela a été peu de chose à tes yeux, ô Dieu ; et pourtant, tu as parlé de la maison de ton serviteur pour un avenir lointain. Tu m’as considéré selon la condition de l’homme élevé[a], Yahweh Dieu !
  rationale: La révision préserve plus exactement l’ambiguïté syntaxique et sémantique de וּרְאִיתַנִי כְּתוֹר הָאָדָם הַמַּעֲלָה. Le texte principal ne tranche plus en faveur de l’interprétation selon laquelle David serait directement qualifié d’homme de haut rang, tandis que cette lecture demeure disponible en note. Le marqueur est ancré sur l’ensemble précis de la proposition difficile.
