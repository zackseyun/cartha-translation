source:
  edition: WLC
  text: ה֥וּא יִבְנֶה לִּ֖/י בָּ֑יִת וְ/כֹנַנְתִּ֥י אֶת כִּסְא֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/012.yaml
  text: He will build a house for me[a], and I will establish his throne forever.
translation:
  language: fr
  text: C’est lui qui me construira une maison[a], et j’affermirai son trône pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un temple ». Le mot hébreu signifie littéralement « maison » et désigne ici le sanctuaire que Salomon construira.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: C’est lui qui
  rationale: Le pronom indépendant masculin singulier met ici le sujet en relief. La tournure française « C’est lui qui » rend naturellement cette insistance.
- source_word: יִבְנֶה
  choice: construira
  rationale: L’imparfait qal de בנה a ici une valeur future dans le contexte de la promesse.
- source_word: לִּי
  choice: me … une maison
  rationale: Le pronom objet indirect français dans « me construira une maison » exprime naturellement que la maison est construite pour le locuteur.
- source_word: בָּיִת
  choice: une maison
  rationale: Le terme signifie littéralement « maison ». Dans ce contexte, il désigne le sanctuaire que Salomon construira, mais conserver « maison » préserve le vocabulaire et le lien littéraire du texte hébreu.
- source_word: וְכֹנַנְתִּי
  choice: et j’affermirai
  rationale: La forme issue de כון exprime l’idée de rendre ferme, stable ou durable. « J’affermirai » convient au contexte royal et restitue cette image.
- source_word: אֶת כִּסְאוֹ
  choice: son trône
  rationale: Le nom muni du suffixe masculin singulier se rend naturellement par « son trône ».
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Cette locution exprime ici une durée sans terme; « pour toujours » est clair, naturel et laisse intacte la portée de la promesse.
theological_decisions:
- issue: Rendre בָּיִת littéralement ou préciser qu’il s’agit du temple
  choice: maison
  alternative: temple
  rationale: Le texte hébreu emploie le mot général « maison ». Le conserver maintient les liens littéraires et théologiques de la promesse davidique, tandis qu’une note indique son référent contextuel.
- issue: Portée de עַד עוֹלָם dans la promesse davidique
  choice: pour toujours
  alternative: à jamais
  rationale: La traduction énonce directement la durée affirmée par le texte sans trancher les débats sur les modalités ou l’accomplissement ultime de cette promesse.
translation_notes:
  register: Français international moderne, digne et accessible. « C’est lui qui » marque l’insistance portée par הוּא; « j’affermirai » conserve l’image de stabilité associée au trône.
