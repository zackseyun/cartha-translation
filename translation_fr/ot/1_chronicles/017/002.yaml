  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל דָּוִ֔יד כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ עֲשֵׂ֑ה כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/002.yaml
  text: And Nathan said to David, “Do all that is in your heart, for God is with you.”
translation:
  language: fr
  text: 'Alors Nathan dit à David : « Fais tout ce que tu as à cœur de faire, car Dieu est avec toi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession en français sans alourdir la phrase.
- source_word: נָתָן אֶל־דָּוִיד
  choice: Nathan dit à David
  rationale: Les noms propres suivent leur forme française traditionnelle, et אֶל avec un verbe de parole se rend idiomatiquement par « à ».
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: tout ce que tu as à cœur de faire
  rationale: לֵבָב désigne ici l'intention ou le projet intérieur. Cette expression française naturelle conserve l'image du cœur tout en explicitant son orientation vers l'action commandée par עֲשֵׂה.
- source_word: עֲשֵׂה
  choice: Fais
  rationale: L'impératif de עשה est direct et général. « Fais » en conserve la simplicité et la force.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison du conseil de Nathan. « Car » convient au registre narratif digne et courant.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, אֱלֹהִים avec l'article désigne le Dieu d'Israël; le français idiomatique emploie simplement « Dieu », et non « le Dieu ».
- source_word: עִמָּךְ
  choice: est avec toi
  rationale: Cette formulation rend directement la présence et le soutien divins exprimés par עִם avec le suffixe de deuxième personne.
theological_decisions:
- issue: Désignation divine הָאֱלֹהִים
  choice: Dieu
  alternative: le Seigneur
  rationale: Le texte hébreu porte אֱלֹהִים et non le nom divin YHWH. « Dieu » respecte donc la distinction lexicale sans importer une désignation différente.
- issue: Portée de « Dieu est avec toi »
  choice: Conserver l'affirmation sans l'expliciter
  alternative: Dieu approuve tous tes projets
  rationale: La formule exprime la présence ou le soutien divins, mais le contexte suivant corrigera le conseil initial de Nathan. La traduction ne doit donc pas transformer cette parole en approbation divine absolue de chaque projet.
translation_notes:
  register: Français international moderne, narratif et digne. « Tu » correspond à l'adresse personnelle singulière. La tournure « avoir à cœur de faire » est naturelle et conserve l'image hébraïque du cœur comme siège de l'intention.
