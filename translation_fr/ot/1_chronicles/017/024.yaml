source:
  edition: WLC
  text: וְ֠/יֵֽאָמֵן וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֱלֹהִ֖ים לְ/יִשְׂרָאֵ֑ל וּ/בֵית דָּוִ֥יד עַבְדְּ/ךָ֖ נָכ֥וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/024.yaml
  text: May it be established[a], and may your name be magnified forever, saying, ‘Yahweh of hosts, the God of Israel[b], is God to Israel,’ and may the house of David your servant be established before you.
translation:
  language: fr
  text: 'Que cela soit établi, et que ton nom soit magnifié pour toujours, afin que l’on dise : « Yahweh des armées, le Dieu d’Israël, est Dieu pour Israël[a] ! » Et que la maison[b] de David, ton serviteur, soit affermie devant toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « est le Dieu d’Israël ». L’hébreu dit plus littéralement : « est Dieu pour Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, la « maison » de David désigne sa lignée royale, c’est-à-dire sa dynastie.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵאָמֵן
  choice: Que cela soit confirmé
  rationale: Le niphal à valeur optative exprime ici le souhait que ce qui précède, notamment la promesse divine, soit reconnu comme ferme et certain. « Cela » préserve l’absence de sujet explicite dans l’hébreu.
- source_word: וְיִגְדַּל שִׁמְךָ
  choice: que ton nom soit magnifié
  rationale: La tournure optative porte sur la grandeur et la renommée du nom de Dieu. « Magnifié » conserve la valeur honorifique du verbe tout en gardant le mot « nom ».
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Expression française naturelle qui rend la durée indéfinie et durable de l’hébreu.
- source_word: לֵאמֹר
  choice: afin que l’on dise
  rationale: Dans ce contexte, l’infinitif introduit l’acclamation publique qui résultera de la confirmation de la promesse; cette formulation est plus naturelle en français qu’un participe isolé.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré, tandis que צְבָאוֹת est rendu par l’expression française courante qui peut évoquer l’ensemble des forces placées sous l’autorité divine.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement le groupe construit qui identifie Yahweh comme le Dieu d’Israël.
- source_word: אֱלֹהִים לְיִשְׂרָאֵל
  choice: est Dieu pour Israël
  rationale: La préposition לְ est conservée par « pour », ce qui maintient la nuance relationnelle ou bénéficiaire sans la réduire d’emblée à une simple possession.
- source_word: וּבֵית דָּוִיד עַבְדְּךָ
  choice: Et que la maison de David, ton serviteur
  rationale: « Maison » conserve l’image hébraïque tout en désignant ici la lignée royale de David; l’apposition « ton serviteur » se rapporte à David.
- source_word: נָכוֹן לְפָנֶיךָ
  choice: soit affermie devant toi
  rationale: « Affermie » exprime l’état stable et durable indiqué par נָכוֹן, tandis que « devant toi » conserve la formulation relationnelle de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel divin; sa translittération le distingue du titre אֲדֹנָי et préserve la donnée hébraïque.
- issue: Valeur des formes verbales dans la prière
  choice: Des souhaits introduits par « que »
  alternative: Des futurs de l’indicatif
  rationale: David répond à la promesse de Dieu par une prière; les formes verbales ont donc ici une valeur optative plutôt que celle d’une simple prédiction.
- issue: Sens de אֱלֹהִים לְיִשְׂרָאֵל
  choice: est Dieu pour Israël
  alternative: est le Dieu d’Israël
  rationale: La traduction retenue maintient la préposition hébraïque et sa nuance relationnelle, même si la formulation possessive constitue une interprétation française possible et plus fluide.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme de la prière est conservé par les propositions optatives en « que ». « Magnifié » relève d’un registre biblique encore compréhensible; « maison » garde l’image dynastique de l’original, explicitée en note.
