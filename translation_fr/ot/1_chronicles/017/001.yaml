  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר יָשַׁ֥ב דָּוִ֖יד בְּ/בֵית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜יד אֶל נָתָ֣ן הַ/נָּבִ֗יא הִנֵּ֨ה אָנֹכִ֤י יוֹשֵׁב֙ בְּ/בֵ֣ית הָֽ/אֲרָזִ֔ים וַ/אֲר֥וֹן בְּרִית יְהוָ֖ה תַּ֥חַת יְרִיעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/001.yaml
  text: It happened[a], when David was living in his house, that David said to Nathan the prophet, “Look, I am living in a house of cedar, but the ark of the covenant of Yahweh is under curtains.”
translation:
  language: fr
  text: 'Alors que David habitait dans sa maison, il dit au prophète Nathan : « Regarde ! Moi, j’habite dans une maison en bois de cèdre, tandis que l’arche de l’alliance de Yahweh est sous des tentures[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sous des toiles de tente ». Le mot hébreu désigne des pièces d’étoffe, en particulier les toiles d’une tente ou du sanctuaire portatif.'
    reason: Alternative lexicale précisant la valeur contextuelle possible de יְרִיעוֹת.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Il arriva, alors que
  rationale: Cette formulation rend l’ouverture narrative et introduit naturellement la circonstance temporelle, sans recourir à l’archaïque « il advint que ».
- source_word: יָשַׁב ... יוֹשֵׁב
  choice: habitait ... j’habite
  rationale: Dans le contexte d’une résidence, ישׁב signifie « habiter ». La répétition du verbe hébreu est conservée dans le récit et dans les paroles de David.
- source_word: בְּבֵיתוֹ
  choice: dans sa maison
  rationale: Le texte dit littéralement « sa maison ». « Palais » préciserait le statut royal, mais ferait perdre la répétition rhétorique de « maison ».
- source_word: נָתָן הַנָּבִיא
  choice: le prophète Nathan
  rationale: Ordre idiomatique en français moderne pour le nom accompagné de sa fonction.
- source_word: הִנֵּה
  choice: Regarde !
  rationale: L’interjection attire l’attention de Nathan sur le contraste constaté par David. « Voici » serait possible, mais moins direct ici.
- source_word: בְּבֵית הָאֲרָזִים
  choice: dans une maison en bois de cèdre
  rationale: La précision « en bois de » exprime clairement en français que le cèdre est le matériau de construction.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: tandis que l’arche de l’alliance de Yahweh
  rationale: Le waw introduit ici un contraste entre la demeure de David et l’abri de l’arche. « Tandis que » le rend sans durcir ce contraste.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la forme explicite du texte hébreu.
- source_word: תַּחַת יְרִיעוֹת
  choice: est sous des tentures
  rationale: יְרִיעוֹת désigne des pièces d’étoffe ou tentures, notamment celles d’une tente ou du tabernacle. La traduction principale reste formellement proche sans imposer cette précision contextuelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » en préserve la fonction de nom personnel sans lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La structure narrative hébraïque et la répétition d’« habiter » sont conservées, tandis que l’ordre des mots est adapté à l’usage français. L’opposition entre la maison en cèdre et l’abri textile de l’arche reste explicite.
