source:
  edition: WLC
  text: מַה יּוֹסִ֨יף ע֥וֹד דָּוִ֛יד אֵלֶ֖י/ךָ לְ/כָב֣וֹד אֶת עַבְדֶּ֑/ךָ וְ/אַתָּ֖ה אֶֽת עַבְדְּ/ךָ֥ יָדָֽעְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/018.yaml
  text: What more can David add before you for honoring your servant? You know your servant.
translation:
  language: fr
  text: Que pourrait encore ajouter David devant toi au sujet de l’honneur fait à ton serviteur[a] ? Et toi, tu connais ton serviteur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est difficile. On pourrait aussi traduire : « pour avoir honoré ton serviteur », « pour l’honneur de ton serviteur » ou « afin d’honorer ton serviteur ». On peut également comprendre le début ainsi : « Que pourrait encore te dire David… ? », bien que le verbe « dire » ne soit pas exprimé en hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: Que
  rationale: Introduit naturellement en français la question rhétorique « Que pourrait encore… ? ».
- source_word: יוֹסִיף עוֹד
  choice: pourrait encore ajouter
  rationale: Rend l’idée d’ajouter davantage sans introduire dans le texte principal le verbe « dire », absent de l’hébreu.
- source_word: דָּוִיד
  choice: David
  rationale: Forme française traditionnelle du nom propre.
- source_word: אֵלֶיךָ
  choice: devant toi
  rationale: Dans cette prière solennelle, cette formulation exprime la présence de Dieu; « à toi » demeure possible.
- source_word: לְכָבוֹד אֶת עַבְדֶּךָ
  choice: au sujet de l’honneur fait à ton serviteur
  rationale: La construction hébraïque est condensée et difficile. Cette formulation lisible rattache l’honneur à l’action de Dieu sans présenter comme certaine une analyse syntaxique contestée.
- source_word: וְאַתָּה
  choice: Et toi
  rationale: Conserve la conjonction et l’emphase portée par le pronom indépendant.
- source_word: יָדָעְתָּ
  choice: tu connais
  rationale: Le parfait hébreu désigne ici la connaissance établie que Dieu a de David; le présent est naturel en français.
theological_decisions:
- issue: Sens de לְכָבוֹד אֶת עַבְדֶּךָ
  choice: « au sujet de l’honneur fait à ton serviteur »
  alternative: « pour avoir honoré ton serviteur », « pour l’honneur de ton serviteur » ou « afin d’honorer ton serviteur »
  rationale: Le contexte évoque l’honneur accordé à David par Dieu, mais la syntaxe reste difficile. Le choix principal préserve cette orientation tout en signalant l’ambiguïté réelle dans la note.
- issue: Portée de יָדַע appliqué au serviteur
  choice: « tu connais ton serviteur »
  alternative: « tu as connu ton serviteur »
  rationale: La traduction ne précise pas davantage la nature de cette connaissance et évite ainsi d’ajouter une interprétation théologique absente de la proposition.
translation_notes:
  register: Français international moderne, digne et adapté à une prière. Le tour « devant toi » garde la solennité de l’adresse; la formulation principale reste volontairement sobre face à une syntaxe hébraïque ambiguë.
