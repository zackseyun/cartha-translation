  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שֹׁפְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר צִוִּ֛יתִי לִ/רְע֥וֹת אֶת עַמִּ֖/י לֵ/אמֹ֑ר לָ֛/מָּה לֹא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/006.yaml
  text: In all the places where I have walked among all Israel[a], did I ever speak a word to one of the judges of Israel, whom I commanded to shepherd my people, saying, ‘Why have you not built for me a house of cedar?’
translation:
  language: fr
  text: 'Dans tous les lieux où je me suis déplacé parmi tout Israël[a], ai-je jamais adressé une parole à l’un des juges d’Israël que j’avais chargé de conduire mon peuple comme un berger, en disant : « Pourquoi ne m’avez-vous pas construit une maison de cèdre ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le passage parallèle de 2 Samuel 7.7 porte « tribus d’Israël » ; certains témoins reflètent plutôt « chefs » ou « sceptres ». Ici, le texte hébreu des Chroniques porte « juges d’Israël ».
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: je me suis déplacé
  rationale: Le hitpael de הלך exprime ici les déplacements de Dieu avec son peuple. Cette formulation française rend naturellement l’idée de mouvement répété sans imposer une marche littérale.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: au milieu de tout Israël
  rationale: Avec le verbe de déplacement, la préposition indique la présence de Dieu parmi l’ensemble du peuple, et non seulement une étendue géographique.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: ai-je jamais adressé une parole
  rationale: 'La tournure interrogative et l’accusatif de même racine donnent une forte valeur rhétorique : Dieu nie avoir formulé une telle demande.'
- source_word: אֶת אַחַד שֹׁפְטֵי יִשְׂרָאֵל
  choice: à l’un des juges d’Israël
  rationale: Avec דבר, אֶת introduit ici la personne à laquelle la parole est adressée. « À » est précis et idiomatique en français.
- source_word: שֹׁפְטֵי יִשְׂרָאֵל
  choice: juges d’Israël
  rationale: Le texte hébreu des Chroniques porte bien « juges »; il ne convient pas de l’harmoniser silencieusement avec le parallèle de 2 Samuel.
- source_word: צִוִּיתִי לִרְעוֹת
  choice: j’avais chargés de conduire mon peuple comme un berger
  rationale: צוה marque la mission confiée et רעה conserve l’image pastorale du gouvernement et du soin. L’explicitation « comme un berger » est naturelle en français.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Expression d’appartenance relationnelle et d’alliance, rendue directement.
- source_word: לָמָּה לֹא בְנִיתֶם לִי
  choice: Pourquoi ne m’avez-vous pas construit
  rationale: Le passé composé exprime naturellement en français l’absence de construction jusqu’au moment évoqué. Le pluriel « vous » correspond à בְנִיתֶם et vise collectivement les juges.
- source_word: בֵּית אֲרָזִים
  choice: une maison en bois de cèdre
  rationale: L’expression désigne une maison construite en cèdre. « En bois de cèdre » évite l’ambiguïté française possible d’une maison appartenant au cèdre tout en gardant le sens matériel.
theological_decisions:
- issue: La leçon « juges » dans les Chroniques face à « tribus » dans le passage parallèle de 2 Samuel 7.7
  choice: Traduire le texte massorétique des Chroniques par « juges d’Israël » dans le corps du verset.
  alternative: Harmoniser avec 2 Samuel 7.7 en traduisant « tribus d’Israël », ou adopter une interprétation comme « chefs d’Israël ».
  rationale: La primauté du texte source exige de conserver la leçon attestée en 1 Chroniques. La différence avec Samuel est signalée en note sans être résolue artificiellement.
- issue: Métaphore pastorale de רעה
  choice: 'Conserver explicitement l’image du berger : « conduire mon peuple comme un berger ».'
  alternative: Traduire seulement par « gouverner » ou « diriger ».
  rationale: L’image associe autorité et soin pastoral; l’aplatir ferait perdre une dimension littéraire et théologique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase hébraïque très longue est répartie en deux questions pour assurer une lecture naturelle, sans modifier sa force rhétorique. Le pluriel de la citation finale est conservé.
