id: 1CH.17.11
reference: 1 Chronicles 17:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי מָלְא֤וּ יָמֶ֨י/ךָ֙ לָ/לֶ֣כֶת עִם אֲבֹתֶ֔י/ךָ וַ/הֲקִֽימוֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יִהְיֶ֖ה מִ/בָּנֶ֑י/ךָ וַ/הֲכִינוֹתִ֖י אֶת מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/011.yaml
  text: And it shall be[a], when your days are fulfilled to go to be with your fathers, that I will raise up your offspring after you, who shall be one of your sons, and I will establish his kingdom.
translation:
  language: fr
  text: Quand tes jours seront arrivés à leur terme et que tu iras rejoindre tes ancêtres[a], je susciterai après toi un descendant, qui sera l’un de tes fils, et j’affermirai son royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aller avec tes pères » ; expression hébraïque évoquant la mort et le fait de rejoindre ses ancêtres.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: La formule introduit ici une circonstance future temporelle. « Quand » restitue naturellement la construction en français sans alourdir la phrase.
- source_word: מָלְאוּ יָמֶיךָ
  choice: tes jours seront arrivés à leur terme
  rationale: Cette expression idiomatique désigne l’achèvement de la vie. La formulation française conserve la solennité de l’hébreu tout en restant claire.
- source_word: לָלֶכֶת עִם אֲבֹתֶיךָ
  choice: tu iras rejoindre tes ancêtres
  rationale: Littéralement, le texte dit « aller avec tes pères ». « Rejoindre tes ancêtres » rend clairement l’euphémisme de la mort tout en conservant l’image particulière employée dans les Chroniques.
- source_word: וַהֲקִימוֹתִי
  choice: je susciterai
  rationale: Le hifil de קום exprime ici l’action de faire surgir un successeur. « Susciter » convient au contexte dynastique et se distingue du verbe suivant.
- source_word: זַרְעֲךָ
  choice: un descendant
  rationale: זֶרַע peut être collectif ou singulier. La proposition relative qui suit désigne ici une personne issue des fils de David ; « un descendant » rend naturellement cette précision sans employer le calque opaque « semence ».
- source_word: אַחֲרֶיךָ
  choice: après toi
  rationale: Cette expression conserve directement l’idée de succession temporelle et dynastique.
- source_word: אֲשֶׁר יִהְיֶה מִבָּנֶיךָ
  choice: qui sera l’un de tes fils
  rationale: 'La préposition מִן a ici une valeur partitive : le successeur promis sera pris parmi les fils de David.'
- source_word: וַהֲכִינוֹתִי
  choice: j’affermirai
  rationale: Le hifil de כון signifie rendre ferme, assurer ou établir solidement. « Affermir » exprime la stabilité promise et évite de confondre ce verbe avec קום.
- source_word: מַלְכוּתוֹ
  choice: son royaume
  rationale: « Royaume » garde la portée dynastique et politique du terme, sans la réduire au seul exercice personnel de la royauté.
theological_decisions:
- issue: Portée dynastique et résonance messianique possible
  choice: Traduire directement la promesse d’un successeur davidique issu des fils de David, sans ajouter de titre messianique.
  alternative: Expliciter dans le texte principal une lecture messianique du descendant.
  rationale: Le verset vise immédiatement un successeur appartenant à la descendance de David. Sa portée messianique dans le développement canonique ne doit pas être supprimée, mais elle ne doit pas non plus être introduite par des mots absents de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton solennel de la promesse dynastique, tandis que la note signale l’image hébraïque propre au passage.
