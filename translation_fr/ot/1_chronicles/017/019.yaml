base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/019.yaml
  text: O Yahweh[a], for the sake of your servant and according to your heart, you have done all this greatness[b], to make known all these great things.
translation:
  language: fr
  text: Ô Yahweh, en faveur de ton serviteur et selon ton cœur[a], tu as accompli toute cette grandeur[b], afin de faire connaître toutes les grandes choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « selon ta volonté ». Littéralement : « selon ton cœur ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu passe du singulier « toute cette grandeur » au pluriel « toutes les grandes choses » : le singulier peut résumer l’ensemble, et le pluriel en désigner les diverses manifestations.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin YHWH, qui le distingue d’un titre comme « Seigneur ».
- source_word: בַּעֲבוּר עַבְדְּךָ
  choice: à cause de ton serviteur
  rationale: La construction exprime le motif ou la considération liée au serviteur. « À cause de » reste naturel et laisse ouverte la nuance précise du rapport.
- source_word: וּכְלִבְּךָ
  choice: et selon ton cœur
  rationale: La traduction conserve l’image hébraïque du cœur comme siège de la volonté, de l’intention et du désir, sans la réduire à une seule interprétation.
- source_word: עָשִׂיתָ
  choice: tu as accompli
  rationale: Le passé composé exprime un acte réalisé dont la portée demeure présente; « accomplir » convient au contexte de l’action divine.
- source_word: כָּל הַגְּדוּלָּה הַזֹּאת
  choice: toute cette grandeur
  rationale: Le singulier abstrait de l’hébreu est conservé comme résumé collectif de l’action grandiose de Dieu.
- source_word: לְהֹדִיעַ
  choice: afin de faire connaître
  rationale: L’infinitif causatif exprime ici le but de l’action; « faire connaître » en rend directement le sens.
- source_word: כָּל הַגְּדֻלּוֹת
  choice: toutes ces grandes choses
  rationale: Le pluriel hébreu désigne les diverses manifestations de la grandeur et maintient le contraste avec le singulier précédent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / Jéhovah
  rationale: « Yahweh » représente directement le nom propre divin sans le remplacer par un titre ni retenir une vocalisation tardive.
- issue: Expression anthropomorphique « selon ton cœur »
  choice: selon ton cœur
  alternative: selon ta volonté
  rationale: Le maintien de la métaphore préserve la richesse de l’hébreu, où le cœur évoque l’intention, la volonté et le désir, sans imposer une seule explicitation.
translation_notes:
  register: Français international moderne, digne et accessible. L’invocation « Ô Yahweh » garde le ton solennel de la prière. La syntaxe reste proche de l’hébreu tout en étant naturelle en français; le passage intentionnel du singulier au pluriel est préservé.
