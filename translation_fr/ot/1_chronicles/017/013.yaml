  text: אֲנִי֙ אֶֽהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִֽהְיֶה לִּ֣/י לְ/בֵ֑ן וְ/חַסְדִּ/י֙ לֹא אָסִ֣יר מֵֽ/עִמּ֔/וֹ כַּ/אֲשֶׁ֣ר הֲסִיר֔וֹתִי מֵ/אֲשֶׁ֥ר הָיָ֖ה לְ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/013.yaml
  text: I will be a father to him[a], and he will be a son to me. And I will not remove my steadfast love from him[b], as I removed it from the one who was before you.
translation:
  language: fr
  text: Je serai pour lui un père, et il sera pour moi un fils[a]. Je ne lui retirerai pas mon amour fidèle, comme je l’ai retiré à celui qui était avant toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je serai son père, et il sera mon fils. »'
    reason: lexical_alternative
  - marker: b
    text: « Celui qui était avant toi » désigne Saül, le prédécesseur de David comme roi.
    reason: cross_reference
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: Je serai pour lui un père
  rationale: Cette formulation garde la construction relationnelle de l’hébreu tout en restant claire et naturelle en français.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: et lui sera pour moi un fils
  rationale: Le pronom tonique « lui » maintient le parallélisme et le contraste avec la première proposition, tandis que « pour moi un fils » conserve la formulation relationnelle de l’hébreu.
- source_word: חַסְדִּי
  choice: mon amour fidèle
  rationale: Dans ce contexte d’alliance, חֶסֶד exprime à la fois l’amour et une fidélité durable. « Amour fidèle » rend ces deux dimensions sans réduire le terme à la seule compassion ni l’alourdir d’une explicitation doctrinale.
- source_word: לֹא אָסִיר מֵעִמּוֹ
  choice: Je ne lui retirerai pas
  rationale: « Retirer à quelqu’un » exprime naturellement en français le hiphil de סור et permet de reprendre le même verbe dans la comparaison qui suit.
- source_word: כַּאֲשֶׁר הֲסִירוֹתִי
  choice: comme je l’ai retiré
  rationale: Le pronom « l’ » reprend « mon amour fidèle », objet sous-entendu en hébreu, et la répétition de « retirer » reproduit l’écho verbal du texte source.
- source_word: מֵאֲשֶׁר הָיָה לְפָנֶיךָ
  choice: à celui qui était avant toi
  rationale: La traduction préserve la désignation indirecte du prédécesseur de David sans introduire son nom dans le texte principal. Ici, « avant toi » indique l’antériorité dans la royauté.
theological_decisions:
- issue: La relation père-fils dans l’alliance davidique
  choice: Conserver directement les termes « père » et « fils » ainsi que leur formulation relationnelle.
  alternative: Je prendrai soin de lui comme un père, et il m’appartiendra comme un fils.
  rationale: Le texte établit une filiation royale liée à l’alliance. Une paraphrase en termes de soins ou d’appartenance atténuerait une formulation biblique porteuse d’une tension théologique importante.
- issue: Le sens de חֶסֶד dans un contexte d’alliance
  choice: mon amour fidèle
  alternative: ma bonté ; ma miséricorde ; ma fidélité à l’alliance
  rationale: « Amour fidèle » garde ensemble l’affection, la faveur et la constance relationnelle du terme, sans le limiter à la miséricorde ni expliciter dans le texte ce que le contexte permet d’inférer.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme père-fils et la répétition du verbe « retirer » sont conservés; la désignation indirecte de Saül reste dans le texte principal.
