  text: כִּ֣י אַתָּ֣ה אֱלֹהַ֗/י גָּלִ֨יתָ֙ אֶת אֹ֣זֶן עַבְדְּ/ךָ֔ לִ/בְנ֥וֹת ל֖/וֹ בָּ֑יִת עַל כֵּן֙ מָצָ֣א עַבְדְּ/ךָ֔ לְ/הִתְפַּלֵּ֖ל לְ/פָנֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/025.yaml
  text: For you[a], my God, have revealed to your servant that you will build him a house[b]; therefore your servant has found courage to pray before you.
translation:
  language: fr
  text: Car toi, mon Dieu, tu as révélé à ton serviteur que tu lui bâtirais une maison[a]. C’est pourquoi ton serviteur a trouvé le courage de prier devant toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une dynastie » ; ici, « maison » peut désigner une lignée royale durable.
    reason: alternative_reading
lexical_decisions:
- source_word: גָּלִיתָ אֶת אֹזֶן עַבְדְּךָ
  choice: tu as révélé à ton serviteur
  rationale: L’expression signifie littéralement « tu as découvert l’oreille de ton serviteur ». Il s’agit d’un idiome hébreu exprimant la révélation ou la communication d’une information; le rendre selon son sens donne un français clair et naturel.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: que tu lui bâtirais une maison
  rationale: L’infinitif indique le contenu de la révélation. Le conditionnel français convient à un événement futur annoncé depuis le point de vue passé du verbe « as révélé », sans affaiblir la promesse.
- source_word: בָּיִת
  choice: maison
  rationale: « Maison » conserve l’image hébraïque et sa polysémie dans le contexte de la promesse davidique, où le mot peut désigner la maisonnée et la lignée royale, et non seulement un bâtiment.
- source_word: מָצָא ... לְהִתְפַּלֵּל
  choice: a trouvé le courage de te prier
  rationale: La tournure hébraïque exprime ici l’assurance ou la hardiesse acquise pour entreprendre la prière. Cette formulation idiomatique est naturelle en français.
- source_word: לְפָנֶיךָ
  choice: te prier
  rationale: Le complément « devant toi » est implicite dans l’usage français de « te prier ». Cette formulation évite le peu naturel « prier devant toi » tout en conservant l’orientation personnelle de la prière vers Dieu.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans cette prière royale, le terme est une autodésignation respectueuse qui exprime la soumission à Dieu; « serviteur » convient mieux au registre que « esclave ».
theological_decisions:
- issue: Sens de « maison » dans la promesse davidique
  choice: Conserver « maison » dans le texte et signaler le sens dynastique en note
  alternative: Traduire explicitement par « dynastie » ou « lignée royale »
  rationale: Le mot hébreu entretient une image à plusieurs niveaux. « Maison » préserve cette tension et évite de limiter la promesse à une seule explicitation interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement causal du verset. « Bâtir » maintient la métaphore de la maison; « te prier » est préféré à « prier devant toi » pour un français naturel.
