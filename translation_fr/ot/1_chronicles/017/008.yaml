  rationale: La révision remplace la formulation française maladroite « faire un nom » par « donner une renommée », qui exprime directement la portée idiomatique de שֵׁם. « J’ai fait disparaître devant toi » rend l’idée que Dieu a ôté les ennemis de devant David, dans un français plus courant que « retranché ... devant toi ». Le contraste entre actions passées et promesse future, ainsi que l’ambiguïté de « terre » et « pays », sont préservés.
