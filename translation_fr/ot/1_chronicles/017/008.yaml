  terminology: « Renommée » rend ici la valeur de réputation glorieuse de שֵׁם sans imposer d’interprétation théologique. « Grands » respecte le substantif adjectival hébreu et évite d’ajouter un genre. La note conserve l’ambiguïté légitime de אָרֶץ (« terre » / « pays »).
  issues:
