  text: וָֽ/אֶהְיֶ֣ה עִמְּ/ךָ֗ בְּ/כֹל֙ אֲשֶׁ֣ר הָלַ֔כְתָּ וָ/אַכְרִ֥ית אֶת כָּל אוֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ וְ/עָשִׂ֤יתִֽי לְ/ךָ֙ שֵׁ֔ם כְּ/שֵׁ֥ם הַ/גְּדוֹלִ֖ים אֲשֶׁ֥ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/008.yaml
  text: And I have been with you wherever you have gone[a], and I have cut off all your enemies from before you[b], and I will make for you a name like the name of the great ones who are on the earth.
translation:
  language: fr
  text: J’ai été avec toi partout où tu es allé, et j’ai fait disparaître devant toi tous tes ennemis. Je te donnerai une renommée comparable à celle des grands de la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des grands du pays » ; le mot hébreu peut désigner la terre ou le pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: J’ai été avec toi
  rationale: Le wayyiqtol rappelle ici l’accompagnement passé de Dieu. Le passé composé est naturel en français actuel et relie cette fidélité passée à la situation présente.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: partout où tu es allé
  rationale: Cette tournure rend naturellement l’expression hébraïque « dans tout ce où tu es allé », qui vise tous les lieux et parcours de David.
- source_word: וָאַכְרִית אֶת כָּל אוֹיְבֶיךָ
  choice: j’ai retranché tous tes ennemis
  rationale: « Retrancher » conserve l’image de כרת tout en exprimant l’élimination des ennemis; « tous » reprend explicitement כָּל.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: Rend de façon concise l’idiome spatial hébreu, selon lequel les ennemis sont ôtés de devant David.
- source_word: וְעָשִׂיתִי לְךָ שֵׁם
  choice: Je te ferai un nom
  rationale: Le parfait précédé de la conjonction a ici une valeur future dans la séquence de promesse. L’expression française conserve l’image biblique du « nom », au sens de renommée.
- source_word: כְּשֵׁם הַגְּדוֹלִים
  choice: aussi grand que celui des grands
  rationale: Cette formulation française exprime naturellement la comparaison entre la renommée de David et celle des personnages éminents, sans ajouter une précision de genre absente de l’adjectif hébreu substantivé.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: de la terre
  rationale: « Terre » convient au cadre large de la renommée promise, tout en laissant une note signaler le sens également possible de « pays ».
theological_decisions:
- issue: Séquence temporelle des actions divines
  choice: Deux actions passées (« J’ai été », « j’ai retranché »), suivies d’une promesse future (« Je te ferai »).
  alternative: Rendre toutes les propositions au passé ou toutes au futur.
  rationale: La syntaxe et le contexte opposent le rappel de la fidélité divine déjà manifestée à la promesse concernant la renommée future de David.
- issue: Portée de אָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le nom hébreu permet les deux lectures. Le contexte d’une renommée comparable à celle des grands favorise la portée générale, sans exclure la lecture territoriale, conservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve les images hébraïques de retrancher les ennemis et de faire un nom, tout en évitant le calque peu naturel « un nom comme le nom ». Le marqueur de note est placé après la proposition concernée.
