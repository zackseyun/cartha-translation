source:
  edition: WLC
  text: וַ֠/תִּתֵּן אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/022.yaml
  text: And you made your people Israel your people forever[a], and you, O Yahweh, became their God.
translation:
  language: fr
  text: Tu as établi ton peuple, Israël, comme ton peuple pour toujours, et toi, Yahweh, tu es devenu[a] leur Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu as été leur Dieu ». L’hébreu peut aussi recevoir ici un sens plus statif ; le texte principal met en valeur l’établissement de la relation d’alliance dans ce contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: tu as établi
  rationale: Le verbe נתן signifie littéralement « donner », mais, dans cette construction avec les deux compléments introduits par ל, il exprime ici l’établissement d’Israël dans un statut déterminé. « Établir » restitue naturellement cette valeur constitutive en français.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: ton peuple Israël
  rationale: Cette formulation conserve l’apposition hébraïque et présente Israël comme le peuple déjà désigné comme appartenant à Dieu.
- source_word: לְךָ לְעָם
  choice: comme ton peuple
  rationale: 'Les deux prépositions ל expriment l’appartenance et le statut résultant : Israël est établi comme le peuple de Yahweh.'
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Expression française courante qui rend clairement l’idée de durée indéfinie et permanente portée par עַד עוֹלָם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver son caractère de nom personnel dans le texte source.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: tu es devenu leur Dieu
  rationale: Le parfait de היה, dans ce récit de l’établissement de l’alliance, peut marquer l’entrée dans une relation définie. « Tu es devenu leur Dieu » en restitue la force narrative et relationnelle sans décrire un changement dans la nature de Dieu.
theological_decisions:
- issue: Rendu de la formule d’alliance היה + ל + אֱלֹהִים
  choice: tu es devenu leur Dieu
  alternative: tu as été leur Dieu
  rationale: Le choix principal met en valeur l’établissement de la relation d’alliance raconté dans le contexte. L’autre lecture, plus stative, reste grammaticalement possible et est donc signalée en note afin de préserver l’ambiguïté de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « ton peuple Israël comme ton peuple » est conservée parce qu’elle reflète la formulation hébraïque et souligne l’identité d’alliance, malgré sa légère insistance stylistique.
