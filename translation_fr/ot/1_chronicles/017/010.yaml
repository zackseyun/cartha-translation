source:
  edition: WLC
  text: וּ/לְ/מִ/יָּמִ֗ים אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הִכְנַ֖עְתִּי אֶת כָּל אוֹיְבֶ֑י/ךָ וָ/אַגִּ֣ד לָ֔/ךְ וּ/בַ֖יִת יִֽבְנֶה לְּ/ךָ֥ יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/010.yaml
  text: from the days when I appointed judges over my people Israel. And I will subdue all your enemies. Moreover[a], I tell you that Yahweh will build you a house.
translation:
  language: fr
  text: depuis le temps où j’ai établi des juges sur mon peuple Israël. Je soumettrai tous tes ennemis. De plus, je t’annonce que Yahweh te bâtira une maison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « maison » désigne aussi une lignée royale, c’est-à-dire une dynastie.
    reason: Le mot hébreu בַּיִת porte un jeu de sens essentiel entre maison et dynastie; la note éclaire ce sens sans le remplacer dans le texte.
lexical_decisions:
- source_word: וּלְמִיָּמִים
  choice: depuis le temps
  rationale: La locution renvoie à la période commencée lorsque Dieu a établi les juges; « depuis le temps » est naturel en français et convient à la continuité syntaxique avec le verset précédent.
- source_word: אֲשֶׁר צִוִּיתִי שֹׁפְטִים
  choice: où j’ai établi des juges
  rationale: Dans ce contexte historique, צוה exprime la désignation ou l’institution des juges plutôt qu’un ordre qui leur serait adressé.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: sur mon peuple Israël
  rationale: « Sur » conserve l’idée d’autorité exprimée par עַל et maintient l’expression d’alliance « mon peuple Israël ».
- source_word: וְהִכְנַעְתִּי
  choice: J’abaisserai
  rationale: Le parfait précédé de waw s’inscrit dans la suite des promesses et reçoit ici une valeur future. « Abaisser » rend le causatif de כנע sans suggérer nécessairement une destruction.
- source_word: אֶת כָּל אוֹיְבֶיךָ
  choice: tous tes ennemis
  rationale: Cette formulation française courante préserve la totalité exprimée par כָּל.
- source_word: וָאַגִּד לָךְ
  choice: Je t’annonce en outre ceci
  rationale: נגד désigne une déclaration; la tournure française marque la progression du discours et la solennité de l’annonce divine.
- source_word: וּבַיִת יִבְנֶה לְּךָ יְהוָה
  choice: Yahweh te bâtira une maison
  rationale: La formulation conserve « maison » et le jeu de sens entre édifice et lignée royale. L’ordre français place naturellement le sujet divin en tête.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Sens de « maison » dans la dernière proposition
  choice: Conserver « maison » dans le texte principal, avec une note signalant le sens dynastique.
  alternative: Yahweh établira pour toi une dynastie.
  rationale: Le contexte de l’alliance davidique exploite le double sens de בַּיִת, maison matérielle et maison royale. Une explicitation dans le corps du texte supprimerait ce jeu littéraire et sa tension théologique.
- issue: Valeur temporelle de וְהִכְנַעְתִּי
  choice: 'Futur : « J’abaisserai »'
  alternative: 'Passé : « J’ai abaissé »'
  rationale: Dans la séquence de promesses, la forme présente naturellement l’assujettissement des ennemis comme une action promise, même si la morphologie hébraïque permettrait isolément une lecture accomplie.
translation_notes:
  register: Français international moderne, digne et accessible. Le début en minuscule signale que le verset poursuit la phrase du verset précédent. « Établi des juges » et « te bâtira une maison » restent proches de l’hébreu tout en étant naturels; « maison » conserve volontairement l’ambiguïté littéraire.
