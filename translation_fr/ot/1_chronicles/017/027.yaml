source:
  edition: WLC
  text: וְ/עַתָּ֗ה הוֹאַ֨לְתָּ֙ לְ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֤ה יְהוָה֙ בֵּרַ֔כְתָּ וּ/מְבֹרָ֖ךְ לְ/עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/027.yaml
  text: And now[a], you have been pleased to bless the house of your servant, that it may be before you forever; for you, O Yahweh, have blessed it[c][b], and it is blessed forever.
translation:
  language: fr
  text: Et maintenant, tu as bien voulu[a] bénir la maison[b] de ton serviteur, afin qu’elle soit pour toujours devant toi. Car toi, Yahweh, tu l’as bénie, et elle est bénie pour toujours[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu as entrepris de bénir » ou « tu as consenti à bénir ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, la « maison » désigne vraisemblablement la lignée ou la dynastie de David, et non seulement son habitation.
    reason: cultural_note
  - marker: c
    text: 'Ou : « et qu’elle soit bénie pour toujours ». Certains comprennent l’hébreu comme l’expression d’un souhait, bien que la forme se lise plus naturellement comme l’affirmation d’un état durable.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Cette expression conserve à la fois le lien exprimé par וְ et la transition temporelle marquée par עַתָּה.
- source_word: הוֹאַלְתָּ
  choice: tu as bien voulu
  rationale: Le verbe exprime ici la volonté favorable ou le consentement gracieux. Cette formulation convient au contexte de prière sans ajouter la nuance plus soutenue de « daigner ».
- source_word: לְבָרֵךְ
  choice: bénir
  rationale: L’infinitif complète directement הוֹאַלְתָּ et reçoit son sens courant.
- source_word: בֵּית עַבְדְּךָ
  choice: la maison de ton serviteur
  rationale: « Maison » garde l’étendue familiale et dynastique possible de בַּיִת dans le contexte de la promesse faite à David.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: afin qu’elle soit pour toujours devant toi
  rationale: La formulation conserve l’idée de résultat ainsi que l’expression « devant toi », sans la réduire explicitement à la durée, à la faveur ou à la présence divine.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit le fondement de l’affirmation précédente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: בֵּרַכְתָּ
  choice: tu l’as bénie
  rationale: Le parfait désigne l’acte de bénédiction déjà accompli, qui fonde l’état exprimé dans la proposition finale.
- source_word: וּמְבֹרָךְ לְעוֹלָם
  choice: et elle est bénie pour toujours
  rationale: Le participe passif est rendu comme un état résultant et durable. Cette lecture est grammaticalement plus directe qu’une formulation optative, tout en laissant celle-ci en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le représente directement sans lui substituer un titre.
- issue: Valeur de וּמְבֹרָךְ לְעוֹלָם
  choice: 'déclaration résultative : « et elle est bénie pour toujours »'
  alternative: 'souhait : « et qu’elle soit bénie pour toujours »'
  rationale: La forme hébraïque est un participe passif, non un impératif ni un jussif explicite. La déclaration d’un état durable est donc retenue, tandis que la lecture comme souhait reste signalée.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe à Dieu. La syntaxe reste proche de l’hébreu tout en évitant les archaïsmes ; la répétition de « bénir / bénie » est conservée parce qu’elle structure le raisonnement du verset.
