    text: 'Ou : « par de grandes choses et des choses redoutables ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « expulser de devant ton peuple […] des nations ». L’ordre des mots hébreux est inhabituel; le passage parallèle en 2 Samuel 7.23 présente lui aussi une difficulté textuelle.'
    reason: textual_variant
  revision_rationale: La révision rend explicitement la valeur de séparation de מִפְּנֵי et améliore l’idiomaticité sans modifier la syntaxe ample, la question rhétorique ou l’ambiguïté textuelle signalée. Le pronom « lui » rattache naturellement « que tu as racheté d’Égypte » à « ton peuple Israël » tout en préservant la reprise relative de l’hébreu.
