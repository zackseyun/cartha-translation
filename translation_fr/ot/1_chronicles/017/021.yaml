revisions:
- from: Et qui est comme ton peuple Israël, nation unique sur la terre, que Dieu est allé racheter pour lui-même afin d’en faire son peuple, pour te faire un nom par des actes grands et redoutables[a], en chassant des nations devant ton peuple[b], que tu as racheté d’Égypte ?
  to: Et qui est comme ton peuple Israël, nation unique sur la terre, que Dieu est allé racheter pour lui-même afin d’en faire son peuple, pour te faire un nom par de grands et redoutables actes[a], en expulsant de devant ton peuple[b] des nations, lui que tu as racheté d’Égypte ?
  rationale: La révision rend explicitement la valeur de séparation de מִפְּנֵי et améliore l’idiomaticité sans modifier la syntaxe ample, la question rhétorique ou l’ambiguïté textuelle signalée. Le pronom « lui » rattache naturellement « que tu as racheté d’Égypte » à « ton peuple Israël » tout en préservant la reprise relative de l’hébreu.
