  text: וּ/מִי֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁר֩ הָלַ֨ךְ הָ/אֱלֹהִ֜ים לִ/פְדּ֧וֹת ל֣/וֹ עָ֗ם לָ/שׂ֤וּם לְ/ךָ֙ שֵׁ֚ם גְּדֻלּ֣וֹת וְ/נֹרָא֔וֹת לְ/גָרֵ֗שׁ מִ/פְּנֵ֧י עַמְּ/ךָ֛ אֲשֶׁר פָּדִ֥יתָ מִ/מִּצְרַ֖יִם גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/021.yaml
  text: And who is like your people Israel[a], one nation on the earth, whom God went to redeem for himself as a people, to make for yourself a name by great and fearsome deeds, driving out nations from before your people[b], whom you redeemed from Egypt?
translation:
  language: fr
  text: Et qui est comme ton peuple Israël, nation unique sur la terre, que Dieu est allé racheter pour lui-même afin d’en faire son peuple, pour te faire un nom par de grands et redoutables actes[a], en expulsant de devant ton peuple[b] des nations, lui que tu as racheté d’Égypte ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par de grandes choses et des choses redoutables ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « expulser de devant ton peuple […] des nations ». L’ordre des mots hébreux est inhabituel; le passage parallèle en 2 Samuel 7.23 présente lui aussi une difficulté textuelle.'
    reason: textual_variant
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ יִשְׂרָאֵל
  choice: Et qui est comme ton peuple Israël
  rationale: 'Conserve la question rhétorique et la comparaison personnelle introduite par מִי, tout en maintenant l’adresse à Dieu : Israël est « ton peuple ».'
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: nation unique sur la terre
  rationale: Exprime naturellement en français la singularité affirmée par אֶחָד dans ce contexte, sans réduire אֶרֶץ au seul pays d’Israël.
- source_word: אֲשֶׁר הָלַךְ הָאֱלֹהִים
  choice: que Dieu est allé
  rationale: Préserve le langage concret, voire anthropomorphique, du déplacement divin exprimé par הָלַךְ.
- source_word: לִפְדּוֹת לוֹ עָם
  choice: racheter pour lui-même afin d’en faire son peuple
  rationale: 'Rend פדה par le terme biblique courant « racheter » et explicite sobrement la valeur résultative : le peuple racheté devient le peuple de Dieu.'
- source_word: לָשׂוּם לְךָ שֵׁם
  choice: pour te faire un nom
  rationale: Cette tournure française naturelle exprime l’établissement de la renommée de Dieu tout en conservant la deuxième personne.
- source_word: גְּדֻלּוֹת וְנוֹרָאוֹת
  choice: par des actes grands et redoutables
  rationale: « Redoutables » garde à נוראות sa force d’effroi mêlé de révérence; « actes » explicite le substantif implicite requis en français.
- source_word: לְגָרֵשׁ מִפְּנֵי עַמְּךָ ... גּוֹיִם
  choice: en chassant des nations devant ton peuple
  rationale: Rattache l’expulsion aux actes puissants de Dieu et rend l’ordre syntaxique le plus probable malgré la position finale inhabituelle de גּוֹיִם.
- source_word: אֲשֶׁר פָּדִיתָ מִמִּצְרַיִם
  choice: que tu as racheté d’Égypte
  rationale: Maintient la reprise de la rédemption et le passage de la troisième à la deuxième personne présent dans l’hébreu.
theological_decisions:
- issue: La renommée que Dieu acquiert par la rédemption
  choice: pour te faire un nom
  alternative: pour rendre ton nom célèbre
  rationale: La formulation retenue conserve l’image hébraïque et l’affirmation que les actes rédempteurs de Dieu établissent sa renommée, sans ajouter de cadre doctrinal.
- issue: La portée de נוראות
  choice: redoutables
  alternative: impressionnants
  rationale: « Redoutables » préserve la tension entre admiration, crainte et puissance divine; « impressionnants » serait trop faible et trop courant.
- issue: Le changement de la troisième à la deuxième personne pour Dieu
  choice: Dieu est allé… pour te faire… tu as racheté
  alternative: tu es allé… pour te faire… tu as racheté
  rationale: Le texte hébreu passe intentionnellement de « Dieu » à l’adresse directe. La traduction conserve cette variation plutôt que de l’uniformiser.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase ample et la question rhétorique sont conservées. « Nation unique » communique la singularité sans employer une formulation française artificielle; « redoutables » maintient la gravité théologique du texte.
