  text: וְ/הַֽעֲמַדְתִּ֛י/הוּ בְּ/בֵיתִ֥/י וּ/בְ/מַלְכוּתִ֖/י עַד הָ/עוֹלָ֑ם וְ/כִסְא֕/וֹ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/014.yaml
  text: But I will establish him in my house and in my kingdom forever[c][b][a], and his throne will be established forever.
translation:
  language: fr
  text: Mais je l’établirai[b] dans ma maison[c] et dans mon royaume pour toujours[a], et son trône sera affermi pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je le placerai dans ma maison et à la tête de mon royaume pour toujours. » La préposition hébraïque peut recevoir une interprétation liée à l’autorité, mais le texte principal en conserve la formulation parallèle et le sens plus large.'
    reason: lexical_alternative
  - marker: b
    text: Le pronom peut désigner immédiatement le descendant royal de David, en particulier Salomon, tout en s’inscrivant dans la promesse davidique plus large, comprise par la suite dans un sens messianique.
    reason: alternative_reading
  - marker: c
    text: « Ma maison » peut désigner la maison de Dieu au sens large dans le cadre de l’alliance; certains y voient plus précisément le temple ou la maisonnée royale de Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַעֲמַדְתִּיהוּ
  choice: Mais je l’établirai
  rationale: Le hifil de עמד exprime ici le fait de placer quelqu’un dans une position ferme et durable. « Établir » convient au contexte royal et à celui de l’alliance. La conjonction est rendue par « Mais » pour faire ressortir le contraste avec l’avertissement précédent.
- source_word: בְּבֵיתִי
  choice: dans ma maison
  rationale: La traduction directe de בְּ par « dans » préserve l’étendue de sens de בית, qui peut évoquer la maison, la maisonnée, le sanctuaire ou le domaine de Dieu sans imposer une seule interprétation.
- source_word: וּבְמַלְכוּתִי
  choice: et dans mon royaume
  rationale: Cette formulation conserve le parallélisme avec « dans ma maison » et rend מלכות naturellement par « royaume », tout en laissant ouverte la nuance exacte de position ou d’autorité.
- source_word: עַד הָעוֹלָם
  choice: pour toujours
  rationale: L’expression idiomatique indique une durée permanente. « Pour toujours » est clair, naturel et approprié à la promesse d’alliance.
- source_word: וְכִסְאוֹ
  choice: et son trône
  rationale: Le sens royal concret de כסא est conservé plutôt que paraphrasé par « règne » ou « dynastie ».
- source_word: יִהְיֶה נָכוֹן
  choice: sera affermi
  rationale: נכון exprime ici la fermeté, la stabilité et l’établissement durable. « Sera affermi » est idiomatique en français et conserve le lien sémantique avec « je l’établirai ».
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Comme dans la première occurrence, l’expression marque une permanence durable; la répétition française reflète celle de l’hébreu.
theological_decisions:
- issue: Référent du pronom masculin singulier dans la promesse davidique
  choice: Conserver « l’ » sans identifier explicitement son référent dans le texte principal.
  alternative: Salomon en particulier, la lignée royale de David collectivement, ou finalement le Messie.
  rationale: L’hébreu emploie un pronom masculin singulier sans préciser ici son référent. Le contexte permet une portée immédiate liée au descendant royal de David et une portée messianique ultérieure; la traduction ne tranche pas cette tension.
- issue: Portée de « ma maison »
  choice: Traduire littéralement par « ma maison ».
  alternative: Mon temple, ma maisonnée ou mon domaine royal.
  rationale: בית peut porter plusieurs résonances dans ce contexte. La formulation littérale préserve cette richesse sans réduire le sens au temple ou à une maison dynastique.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « pour toujours » reproduit l’insistance de l’hébreu. « Affermi » maintient le registre royal et solennel sans archaïsme excessif.
