  text: וַֽ/יְהִ֖י בַּ/לַּ֣יְלָה הַ/ה֑וּא וַ/יְהִי֙ דְּבַר אֱלֹהִ֔ים אֶל נָתָ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/003.yaml
  text: But that night the word of God came to Nathan[a], saying,
translation:
  language: fr
  text: 'Mais cette nuit-là, la parole de Dieu fut adressée à Nathan[a] en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une parole venant de Dieu parvint à Nathan ».
    reason: Alternative lexicale qui explicite דְּבַר אֱלֹהִים comme une parole ayant Dieu pour source plutôt que par la formule établie « la parole de Dieu ».
lexical_decisions:
- source_word: וַיְהִי
  choice: Mais … fut adressée
  rationale: Le premier וַיְהִי assure la progression du récit tout en marquant, dans le contexte, un léger contraste avec ce qui précède ; « Mais » le rend naturellement. Le second est intégré à la tournure française « fut adressée » afin d’éviter une répétition pesante.
- source_word: בַּלַּיְלָה הַהוּא
  choice: cette nuit-là
  rationale: Cette expression temporelle naturelle conserve la valeur démonstrative de הַהוּא.
- source_word: דְּבַר אֱלֹהִים
  choice: la parole de Dieu
  rationale: Dans une formule de révélation prophétique, « la parole de Dieu » conserve le registre solennel et le rapport construit de l’hébreu, sans réduire דָּבָר à un simple message.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom désigne ici, au singulier, le Dieu d’Israël.
- source_word: אֶל נָתָן
  choice: à Nathan
  rationale: אֶל indique ici le destinataire ; « à Nathan » est la formulation française naturelle.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit le discours direct qui suit. « En ces termes : » remplit cette fonction plus naturellement en français moderne que le calque « disant ».'
theological_decisions:
- issue: Rendu de la formule de révélation דְּבַר אֱלֹהִים
  choice: la parole de Dieu
  alternative: une parole venant de Dieu
  rationale: Le choix principal préserve la formulation traditionnelle et le poids théologique de la révélation prophétique. La note maintient l’autre lecture possible du rapport entre les noms, sans imposer une interprétation.
translation_notes:
  register: Français international moderne, digne et fluide. La tournure passive « fut adressée » appartient au registre biblique courant sans être archaïque ; le deux-points annonce clairement les paroles du verset suivant.
