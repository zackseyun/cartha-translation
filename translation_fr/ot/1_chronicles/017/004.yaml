  text: לֵ֤ךְ וְ/אָמַרְתָּ֙ אֶל דָּוִ֣יד עַבְדִּ֔/י כֹּ֖ה אָמַ֣ר יְהוָ֑ה לֹ֥א אַתָּ֛ה תִּבְנֶה לִּ֥/י הַ/בַּ֖יִת לָ/שָֽׁבֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/004.yaml
  text: 'Go and say to David my servant[b][a], ‘Thus says Yahweh: You shall not build for me the house to dwell in.’'
translation:
  language: fr
  text: 'Va dire à David, mon serviteur : « Voici ce que dit Yahweh : Ce n’est pas toi qui bâtiras pour moi la maison où j’habiterai.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu ne bâtiras pas pour moi la maison où j’habiterai. » Plus littéralement, l’ordre des mots hébreux souligne « toi » : « Ce n’est pas toi qui bâtiras pour moi la maison où habiter. »'
    reason: La négation suivie du pronom sujet emphatique peut se rendre soit en mettant l’accent sur l’identité du bâtisseur, soit comme une interdiction directe.
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: Va dire
  rationale: 'La succession de l’impératif et du parfait à valeur injonctive forme en français naturel une seule commission : « Va dire ».'
- source_word: דָּוִיד עַבְדִּי
  choice: David, mon serviteur
  rationale: « Serviteur » convient au statut de David au service de Yahweh sans suggérer ici en premier lieu la condition d’esclave.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Cette formulation française actuelle et digne rend la formule de messager prophétique tout en conservant le nom divin.
- source_word: לֹא אַתָּה תִּבְנֶה
  choice: Ce n’est pas toi qui me bâtiras
  rationale: 'La construction clivée rend l’insistance portée par le pronom אַתָּה : le texte met l’accent sur l’identité de celui qui ne bâtira pas, plutôt que d’énoncer seulement une interdiction.'
- source_word: לִּי הַבַּיִת
  choice: me bâtiras la maison
  rationale: Le pronom datif est rendu idiomatiquement avec « bâtir quelque chose à/pour quelqu’un »; « la maison » conserve l’image hébraïque plutôt que de l’expliciter par « le Temple ».
- source_word: לָשָׁבֶת
  choice: où j’habiterai
  rationale: L’infinitif de but décrit la maison comme lieu de résidence divine. L’ajout explicite du sujet « je » est requis par le français et découle du datif « pour moi » dans le contexte.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom propre de l’alliance.
- issue: Portée de לֹא אַתָּה
  choice: Ce n’est pas toi qui me bâtiras
  alternative: Tu ne me bâtiras pas
  rationale: Le pronom sujet explicite, non nécessaire en hébreu, est focalisé. La tournure choisie préserve cette emphase et la tension entre identification du bâtisseur et interdiction adressée à David.
- issue: Sens de הַבַּיִת
  choice: la maison
  alternative: le Temple
  rationale: Dans le contexte, il s’agit du futur sanctuaire, mais le maintien de « maison » respecte le lexème du texte et sa portée théologique.
translation_notes:
  register: Français international moderne, direct et digne. « Bâtir » convient au contexte cultuel et garde une légère solennité sans archaïsme. La ponctuation clarifie les deux niveaux de discours.
