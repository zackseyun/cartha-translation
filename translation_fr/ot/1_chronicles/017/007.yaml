source:
  edition: WLC
  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗יד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מִֽן אַחֲרֵ֖י הַ/צֹּ֑אן לִ/הְי֣וֹת נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/007.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people Israel.'
translation:
  language: fr
  text: 'Maintenant donc, voici ce que tu diras à mon serviteur David : « Voici ce que dit Yahweh des armées : C’est moi qui t’ai pris au pâturage[a], alors que tu suivais le troupeau, pour que tu sois chef[b] de mon peuple Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’enclos » pour « au pâturage ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dirigeant » ou « prince » pour « chef ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Rend à la fois la transition introduite par ו et la valeur temporelle, avec une possible nuance de conséquence, de עַתָּה.
- source_word: כֹּה תֹאמַר
  choice: voici ce que tu diras
  rationale: Formulation française actuelle et naturelle qui conserve la force directive de la formule de messager.
- source_word: לְעַבְדִּי
  choice: à mon serviteur
  rationale: Dans ce contexte, עֶבֶד désigne David dans son service envers Dieu et fonctionne comme un titre honorable, sans mettre au premier plan le statut d’esclave.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend le titre צְבָאוֹת sans le limiter explicitement aux seules armées humaines ou célestes.
- source_word: לְקַחְתִּיךָ
  choice: C’est moi qui t’ai pris
  rationale: Rend directement le verbe לקח, tandis que la tournure emphatique française reflète la présence explicite du pronom אֲנִי.
- source_word: מִן הַנָּוֶה
  choice: au pâturage
  rationale: Dans le contexte pastoral, נָוֶה désigne naturellement le lieu où paît ou séjourne le troupeau; « au pâturage » s’intègre idiomatiquement après « prendre ».
- source_word: מִן אַחֲרֵי הַצֹּאן
  choice: alors que tu suivais le troupeau
  rationale: Exprime en français naturel l’image hébraïque de David placé derrière le petit bétail pour le conduire, sans effacer la métaphore du berger.
- source_word: לִהְיוֹת נָגִיד
  choice: pour que tu sois chef
  rationale: נָגִיד désigne une personne établie à la tête du peuple. « Chef » communique l’autorité sans imposer le titre royal plus précis de « roi ».
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: de mon peuple Israël
  rationale: Après « chef », la construction française avec « de » exprime naturellement l’autorité sur le peuple tout en conservant son identification comme Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Portée du titre צְבָאוֹת
  choice: des armées
  alternative: des armées célestes
  rationale: Le terme peut évoquer diverses armées ou puissances rangées. La traduction retenue préserve cette amplitude au lieu de préciser sans nécessité qu’elles sont célestes.
- issue: Statut exprimé par עַבְדִּי
  choice: mon serviteur
  alternative: mon esclave
  rationale: Ici, le mot présente David comme celui qui appartient au service de Dieu et qu’il a choisi; « serviteur » respecte cette relation sans faire du statut servile l’idée dominante.
- issue: Nature de la fonction exprimée par נָגִיד
  choice: chef
  alternative: prince
  rationale: Le terme souligne l’établissement de David à la tête d’Israël sans employer ici le mot hébreu ordinaire pour « roi ». « Chef » maintient cette distinction et ne résout pas excessivement la portée du titre.
translation_notes:
  register: Français international moderne, digne et accessible. Les formules prophétiques sont rendues naturellement sans archaïsme. La répétition de « voici ce que » reflète les deux formules distinctes du texte hébreu. Les marqueurs de notes sont placés immédiatement après les mots auxquels leurs variantes se rapportent.
