revisions:
- from: Car je n’ai habité dans aucune maison depuis le jour où j’ai fait monter Israël jusqu’à aujourd’hui ; je suis allé de tente en tente et d’une demeure à l’autre.[a]
  to: Car je n’ai habité dans aucune maison depuis le jour où j’ai fait monter Israël jusqu’à aujourd’hui ; je suis passé de tente en tente et d’une demeure à l’autre.[a]
  rationale: La révision limite l’explicitation du verbe hébreu tout en conservant une formulation française fluide. Elle clarifie également la nature de l’ellipse textuelle et maintient l’alternative cultuelle « tabernacle » sans l’imposer.
  reviewer_model: gpt-5.6-terra
