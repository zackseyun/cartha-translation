  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת מִן הַ/יּ֗וֹם אֲשֶׁ֤ר הֶעֱלֵ֨יתִי֙ אֶת יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָֽ/אֶהְיֶ֛ה מֵ/אֹ֥הֶל אֶל אֹ֖הֶל וּ/מִ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/005.yaml
  text: For I have not lived in a house from the day that I brought up Israel to this day[a], but I have gone from tent to tent and from dwelling place to dwelling place.
translation:
  language: fr
  text: Car je n’ai habité dans aucune maison depuis le jour où j’ai fait monter Israël jusqu’à aujourd’hui ; je suis passé de tente en tente et d’une demeure à l’autre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’un tabernacle à l’autre ». L’hébreu dit littéralement : « et depuis une demeure » ; le terme correspondant à « à l’autre » n’est pas exprimé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: j’ai habité
  rationale: Avec un lieu, le verbe signifie couramment « habiter » ou « demeurer ». « Habiter » est naturel en français moderne et convient au contraste avec une maison permanente.
- source_word: בְּבַיִת
  choice: dans aucune maison
  rationale: Sous la négation, « dans aucune maison » rend naturellement l’hébreu « dans une maison ». « Temple » préciserait indûment un sens que le mot ne porte pas à lui seul.
- source_word: הֶעֱלֵיתִי אֶת יִשְׂרָאֵל
  choice: j’ai fait monter Israël
  rationale: Le hifil de עלה exprime l’action de faire monter ou de conduire vers le haut et renvoie ici à la sortie d’Égypte, sans que « d’Égypte » soit explicité dans le verset.
- source_word: וָאֶהְיֶה
  choice: je suis allé
  rationale: Le sens formel est « j’ai été », mais les compléments « de tente en tente » expriment une mobilité. « Je suis allé » rend cette implication de façon idiomatique sans ajouter de destination précise.
- source_word: מֵאֹהֶל אֶל אֹהֶל
  choice: de tente en tente
  rationale: Cette formulation concise conserve la répétition et le mouvement entre des lieux temporaires.
- source_word: וּמִמִּשְׁכָּן
  choice: et d’une demeure à l’autre
  rationale: מִשְׁכָּן désigne une demeure et peut, dans le contexte cultuel, désigner le tabernacle. La construction hébraïque finale est elliptique ; la traduction complète le parallèle exigé par le français, tandis que la note signale la forme littérale et l’autre rendu possible.
theological_decisions:
- issue: Terminologie du sanctuaire sans projection de la théologie ultérieure du Temple
  choice: « maison » et « demeure » dans le texte principal
  alternative: « temple » et « tabernacle »
  rationale: Le verset oppose une maison permanente aux sanctuaires transportables. « Temple » importerait une précision absente de בַּיִת, tandis que « demeure » conserve le sens lexical de מִשְׁכָּן. La possibilité cultuelle « tabernacle » est maintenue en note.
- issue: Ellipse dans la dernière expression hébraïque
  choice: 'Compléter en français : « d’une demeure à l’autre »'
  alternative: 'Traduire littéralement : « et depuis une demeure »'
  rationale: Le texte massorétique s’achève sur une expression elliptique après le parallèle « de tente en tente ». Le complément français rend le mouvement probablement sous-entendu sans masquer la forme inhabituelle du texte source, laquelle est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme de la phrase conserve l’opposition entre l’absence de résidence permanente et la mobilité du sanctuaire. Le point-virgule évite un lourd « mais », qui n’est pas explicitement marqué par une conjonction adversative dans l’hébreu.
