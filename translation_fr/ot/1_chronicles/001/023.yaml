  text: and Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: fr
  text: Et Ophir, Havila et Jobab. Tous ceux-là étaient les fils[a] de Joktan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « descendants de Joktan ». L’hébreu dit « fils de Joktan », mais, dans un contexte généalogique, « fils » peut parfois désigner plus largement les membres d’une lignée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: et
  rationale: אֵת est un marqueur d’objet direct qui ne se traduit pas en français; le וְ coordonne les noms. Dans une énumération française, la coordination répétée de l’hébreu se rend naturellement par « et » avant le dernier nom.
- source_word: אוֹפִיר
  choice: Ophir
  rationale: Nom propre rendu sous sa forme française biblique courante.
- source_word: חֲוִילָה
  choice: Havila
  rationale: Nom propre translittéré sous une forme française claire et usuelle.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Nom propre rendu sous sa forme française biblique courante.
- source_word: כָּל אֵלֶּה
  choice: Tous ceux-là
  rationale: Cette expression récapitule les noms qui précèdent et conserve la valeur démonstrative de אֵלֶּה.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le nom masculin pluriel construit signifie littéralement « fils de ». Cette formulation est conservée dans le texte, tout en signalant en note son sens généalogique potentiellement plus large.
- source_word: יָקְטָן
  choice: Yoqtan
  rationale: Translittération française moderne du nom hébreu, qui représente notamment la consonne initiale י par Y et ק par q.
