lexical_decisions:
- source_word: אַרְפַּכְשַׁד
  choice: Arpakshad
  rationale: Translittération française qui suit directement la forme hébraïque; « Arphaxad » relève surtout de la tradition grecque et latine.
- source_word: יָלַד
  choice: engendra
  rationale: Dans cette généalogie masculine, le verbe exprime la filiation. « Engendra » est concis, précis et demeure naturel dans le registre généalogique biblique.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur hébreu de l’objet direct, sans équivalent lexical autonome en français.
- source_word: שָׁלַח / שֶׁלַח
  choice: Shélah
  rationale: Les deux vocalisations massorétiques présentes dans le verset désignent la même personne; une graphie française uniforme rend la forme hébraïque.
- source_word: עֵבֶר
  choice: Éber
  rationale: Translittération française directe de la forme hébraïque עֵבֶר.
