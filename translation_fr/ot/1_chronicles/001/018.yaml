  text: Arpachshad fathered Shelah[b][a], and Shelah fathered Eber.
translation:
  language: fr
  text: Arpakshad engendra Shélah[a], et Shélah engendra Éber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Shélah; certaines traductions et des passages généalogiques parallèles emploient la forme traditionnelle « Salah ».'
