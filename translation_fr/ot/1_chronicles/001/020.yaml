lexical_decisions:
- source_word: יָקְטָן
  choice: Yoqtân
  rationale: Nom propre translittéré au plus près de la forme hébraïque, dans un usage français lisible.
- source_word: יָלַד
  choice: engendra
  rationale: Dans cette généalogie, le verbe désigne la paternité. « Engendra » est une formulation concise et consacrée en français biblique, sans suggérer que le sujet masculin a donné naissance.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Particule introduisant le complément d’objet direct, rendue par la syntaxe française.
- source_word: אַלְמוֹדָד
  choice: Almodad
  rationale: Nom propre translittéré selon sa forme hébraïque et l’usage français.
- source_word: שָׁלֶף
  choice: Shélef
  rationale: Nom propre translittéré en conservant la consonne initiale sh et les voyelles du texte massorétique.
- source_word: חֲצַרְמָוֶת
  choice: Hatsarmaveth
  rationale: Nom propre translittéré de manière à refléter la forme hébraïque tout en restant prononçable en français.
- source_word: יָרַח
  choice: Yérah
  rationale: Nom propre translittéré avec un Y initial, qui correspond au yod hébreu et convient à l’usage français moderne.
