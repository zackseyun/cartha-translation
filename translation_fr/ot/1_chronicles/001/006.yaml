lexical_decisions:
- source_word: וּבְנֵי
  choice: Fils de
  rationale: בְנֵי est le pluriel construit de « fils ». Dans cette généalogie, la coordination initiale וּ peut rester implicite en français, où la succession des entrées suffit à marquer la continuité de la liste.
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Nom propre conservé sous sa forme française traditionnelle.
- source_word: אַשְׁכֲּנַז
  choice: Ashkenaz
  rationale: Nom propre translittéré selon l’usage français courant.
- source_word: דִיפַת
  choice: Diphath
  rationale: Le texte massorétique des Chroniques porte דִיפַת, rendu directement par « Diphath »; la leçon parallèle « Riphath » est signalée en note.
- source_word: תוֹגַרְמָה
  choice: Togarma
  rationale: Nom propre rendu selon la forme française biblique courante.
