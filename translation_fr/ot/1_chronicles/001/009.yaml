base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/009.yaml
  text: 'The sons of Cush: Seba[a], Havilah, Sabta, Raama, and Sabteca[c][b]. And the sons of Raama: Sheba and Dedan.'
translation:
  language: fr
  text: 'Les fils de Koush : Séba, Havila, Sabta, Raama[a] et Sabteka[b]. Et les fils de Raama : Shéba[c] et Dedan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : Raema.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionnellement : Sabteca.'
    reason: lexical_alternative
  - marker: c
    text: Certaines traductions françaises écrivent « Séba », comme au début du verset, mais l’hébreu emploie ici une consonne initiale différente.
    reason: textual_clarity
lexical_decisions:
- source_word: וּבְנֵי כוּשׁ
  choice: Les fils de Koush
  rationale: La formule généalogique בְּנֵי est rendue littéralement par « les fils de ». La conjonction initiale n’est pas exprimée, car elle relie ce verset à la liste précédente sans devoir être reproduite en français. Koush est la forme française usuelle du nom propre.
- source_word: סְבָא
  choice: Séba
  rationale: Translittération française du nom propre, avec un s correspondant au samekh hébreu.
- source_word: חֲוִילָה
  choice: Havila
  rationale: Forme française courante du nom propre, sans h final non prononcé.
- source_word: סַבְתָּא
  choice: Sabta
  rationale: Translittération directe et traditionnelle en français.
- source_word: רַעְמָא
  choice: Raama
  rationale: Cette forme suit de près les consonnes et la vocalisation hébraïques tout en évitant de confondre ce nom avec Rama, nom distinct dans la Bible.
- source_word: סַבְתְּכָא
  choice: Sabteka
  rationale: Le k rend clairement la consonne hébraïque kaf en français moderne; la forme traditionnelle « Sabteca » est signalée en note.
- source_word: וּבְנֵי רַעְמָא
  choice: Les fils de Raama
  rationale: La répétition de la formule marque une sous-branche de la généalogie. Une nouvelle phrase rend naturellement cette structure; la conjonction hébraïque n’a pas besoin d’être reproduite.
- source_word: שְׁבָא
  choice: Shéba
  rationale: Le groupe « sh » distingue le shin de ce nom du samekh de Séba (סְבָא), distinction présente dans l’hébreu mais souvent effacée dans les formes françaises traditionnelles.
- source_word: דְדָן
  choice: Dedan
  rationale: Translittération française simple du nom propre, sans développement interprétatif.
theological_decisions: []
translation_notes:
  register: Style généalogique sobre et digne. Les formes françaises restent faciles à lire, tout en distinguant autant que possible les noms que l’hébreu écrit différemment.
