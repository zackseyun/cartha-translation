lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le wayyiqtol de מוּת fait avancer le récit. Le passé simple convient au registre narratif biblique soutenu en français.
- source_word: בָּלַע
  choice: Béla
  rationale: Nom propre translittéré selon l’usage biblique français courant.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Le qal wayyiqtol de מלך exprime ici l’accession au pouvoir dans une formule de succession royale; « régna » en conserve la concision.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans ce contexte de succession, תחת avec suffixe indique que Jobab prend la place de son prédécesseur.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Translittération française usuelle du nom propre.
- source_word: בֶּן זֶרַח
  choice: fils de Zérah
  rationale: Rendu transparent de la construction patronymique hébraïque.
- source_word: מִבָּצְרָה
  choice: originaire de Botsra
  rationale: La préposition מִן peut indiquer la provenance ou l’association avec une localité. « Originaire de » exprime naturellement la provenance personnelle sans exclure un lien territorial.
