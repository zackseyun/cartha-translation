  text: וַ/יָּ֖מָת הֲדָ֑ד וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו שַׂמְלָ֖ה מִ/מַּשְׂרֵקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/047.yaml
  text: Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: fr
  text: Hadad mourut, et Samla, de Masréqa, régna à sa place[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après lui ». L’hébreu dit littéralement « sous lui » ; dans ce contexte, l’expression indique la succession royale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le verbe מוּת désigne simplement la mort. « Mourut » est direct, naturel et respecte le style concis de la liste royale.
- source_word: הֲדָד
  choice: Hadad
  rationale: Nom propre translittéré selon sa forme usuelle en français.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans une formule de succession royale, מָלַךְ signifie exercer la royauté. « Régna » conserve le style de la liste sans expliciter davantage que l’hébreu.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: La préposition תַּחַת avec suffixe marque ici le remplacement dans la fonction royale. « À sa place » rend clairement cette succession tout en restant proche de l’expression hébraïque.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Nom propre translittéré sous une forme naturelle en français; le h final de la graphie anglaise n’est pas nécessaire pour représenter l’hébreu.
- source_word: מִמַּשְׂרֵקָה
  choice: de Masréqa
  rationale: Le préfixe מִן indique l’origine ou l’association géographique. En français, « de Masréqa » identifie naturellement Samla par sa localité.
