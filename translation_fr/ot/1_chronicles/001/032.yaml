  text: וּ/בְנֵ֨י קְטוּרָ֜ה פִּילֶ֣גֶשׁ אַבְרָהָ֗ם יָלְדָ֞ה אֶת זִמְרָ֧ן וְ/יָקְשָׁ֛ן וּ/מְדָ֥ן וּ/מִדְיָ֖ן וְ/יִשְׁבָּ֣ק וְ/שׁ֑וּחַ וּ/בְנֵ֥י יָקְשָׁ֖ן שְׁבָ֥א וּ/דְדָֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/032.yaml
  text: 'And the sons of Keturah[a], Abraham’s concubine: she bore Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. And the sons of Jokshan: Sheba and Dedan.'
translation:
  language: fr
  text: 'Et les fils de Ketura[a], la concubine d’Abraham : elle mit au monde Zimran, Yoqshan, Medân, Madian, Yishbaq et Shouah. Et les fils de Yoqshan : Saba et Dedân.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En Genèse 25.1, Ketura est appelée la femme d’Abraham ; ici, le Chroniste la désigne précisément comme sa concubine.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: Fils de
  rationale: Le pluriel construit signifie « fils de ». Dans le style condensé des généalogies, le français peut omettre la conjonction initiale sans perdre l’enchaînement de la liste.
- source_word: קְטוּרָה
  choice: Ketura
  rationale: Forme française courante du nom propre hébreu.
- source_word: פִּילֶגֶשׁ
  choice: concubine
  rationale: Le terme désigne ici une femme unie à Abraham avec un statut inférieur à celui d’une épouse principale. « Concubine » en conserve précisément la distinction.
- source_word: יָלְדָה
  choice: elle mit au monde
  rationale: Le féminin singulier renvoie explicitement à Ketura. Cette formulation est naturelle en français et convient au contexte généalogique.
- source_word: זִמְרָן
  choice: Zimran
  rationale: Transcription usuelle du nom propre.
- source_word: יָקְשָׁן
  choice: Yoqshan
  rationale: Transcription française proche de la forme hébraïque יָקְשָׁן, avec « q » pour le qof.
- source_word: מְדָן
  choice: Medân
  rationale: Forme française traditionnelle permettant de distinguer ce nom de Madian.
- source_word: מִדְיָן
  choice: Madian
  rationale: Forme française biblique bien établie du nom propre.
- source_word: יִשְׁבָּק
  choice: Yishbaq
  rationale: Transcription française proche de l’hébreu, distinguant le qof final.
- source_word: שׁוּחַ
  choice: Shouah
  rationale: Transcription naturelle en français de la voyelle ou et de la consonne initiale shin.
- source_word: שְׁבָא
  choice: Saba
  rationale: Forme française traditionnelle du nom biblique.
- source_word: דְדָן
  choice: Dedân
  rationale: Forme française traditionnelle du nom propre.
theological_decisions:
- issue: Statut de Ketura par rapport à Abraham
  choice: concubine
  alternative: épouse ; épouse de second rang
  rationale: Le texte hébreu emploie explicitement פִּילֶגֶשׁ. La traduction conserve ce terme au lieu de l’harmoniser avec Genèse 25.1, où Ketura est appelée la femme d’Abraham.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe nominale brève (« Fils de… ») garde le rythme compact d’une généalogie. Les noms suivent des formes françaises établies lorsqu’elles sont largement reconnues, et une transcription lisible proche de l’hébreu dans les autres cas.
