  text: וּ/בְנֵ֥י לוֹטָ֖ן חֹרִ֣י וְ/הוֹמָ֑ם וַ/אֲח֥וֹת לוֹטָ֖ן תִּמְנָֽע׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/039.yaml
  text: 'The sons of Lotan: Hori and Homam[a]; and Lotan’s sister was Timna.'
translation:
  language: fr
  text: 'Les fils de Lotan : Hori et Homam[a] ; la sœur de Lotan était Timna.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la généalogie parallèle de Genèse 36.22, ce nom apparaît sous la forme « Hémam » plutôt que « Homam ».
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Dans cette généalogie, le construit pluriel בְּנֵי désigne précisément les « fils de ». La conjonction initiale n’a pas besoin d’être rendue, car le français énumératif est plus naturel sans « et ».
- source_word: לוֹטָן
  choice: Lotân
  rationale: Nom propre translittéré ; l’accent circonflexe signale la voyelle longue de la forme hébraïque et distingue clairement le nom de la graphie française du patriarche Loth.
- source_word: חֹרִי
  choice: Hori
  rationale: Dans ce contexte généalogique, la forme est comprise comme un nom de personne, et non comme le nom ethnique « Horite ».
- source_word: וְהוֹמָם
  choice: et Homam
  rationale: La forme propre à ce verset est הוֹמָם, rendue par « Homam ». La graphie différente de Genèse 36.22 est signalée en note plutôt que substituée au texte des Chroniques.
- source_word: וַאֲחוֹת לוֹטָן
  choice: La sœur de Lotân était
  rationale: אֲחוֹת signifie « sœur ». Le français exige ici une copule, absente mais implicite dans la proposition nominale hébraïque. Une nouvelle phrase restitue naturellement cette notice généalogique.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Translittération du nom propre selon la forme consonantique présente dans ce verset.
