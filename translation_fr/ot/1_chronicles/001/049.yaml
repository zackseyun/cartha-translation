id: 1CH.1.49
reference: 1 Chronicles 1:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֖מָת שָׁא֑וּל וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו בַּ֥עַל חָנָ֖ן בֶּן עַכְבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/049.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: fr
  text: Shaoul mourut[a], et Baal-Hanân, fils d’Akbor, régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les versions françaises traditionnelles écrivent souvent ces noms « Saül », « Baal-Hanan » et « Acbor ». Cette traduction emploie des translittérations plus directement fondées sur l’hébreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: 'Le qatal narratif précédé de וַ exprime ici la suite du récit : « et il mourut ». Le passé simple convient au registre bref et généalogique du passage, sans introduire d’euphémisme.'
- source_word: שָׁאוּל
  choice: Shaoul
  rationale: Translittération française proche de la forme et de la prononciation hébraïques, plutôt que la forme française traditionnelle « Saül ».
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans cette formule de succession royale, le verbe מלך indique que le personnage régna ou devint roi. « Régna » reste concis et correspond au parallélisme du texte.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: La préposition תַּחַת avec suffixe exprime ici le remplacement dans la succession royale. « À sa place » est naturel et précis en français moderne.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanân
  rationale: Translittération du nom composé hébreu ; le trait d’union en rend clairement les deux éléments, et l’accent circonflexe signale la voyelle longue de חָנָן selon un usage français lisible.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette notice généalogique, בֶּן désigne simplement la filiation immédiate.
- source_word: עַכְבּוֹר
  choice: Akbor
  rationale: Translittération simplifiée fondée sur l’hébreu, plus directe que la forme française traditionnelle « Acbor ».
