base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/017.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud, and Aram; Uz, Hul, Gether, and Meshech.'
translation:
  language: fr
  text: 'Les fils de Sem : Élam, Assour, Arpakshad, Loud et Aram ; Outs, Houl, Guéter et Méshek[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la généalogie parallèle, Genèse 10.23 porte « Mash » au lieu de « Méshek ».
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן introduit ici une généalogie. « Les fils de » est direct et conserve le registre généalogique, sans élargir explicitement le sens à « descendants ».
- source_word: שֵׁם
  choice: Sem
  rationale: Forme française traditionnelle et largement reconnue du nom propre biblique.
- source_word: עֵילָם
  choice: Élam
  rationale: Transcription française usuelle de ce nom propre, avec l’accent requis en français.
- source_word: אַשּׁוּר
  choice: Assour
  rationale: Dans cette liste généalogique, le mot désigne le personnage nommé plutôt que le territoire ultérieurement appelé Assyrie.
- source_word: אַרְפַּכְשַׁד
  choice: Arpakshad
  rationale: Transcription proche de la forme hébraïque, préférable ici à une forme héritée du grec ou du latin.
- source_word: לוּד
  choice: Loud
  rationale: Le texte porte le nom propre singulier Loud, et non le nom ethnique pluriel Loudim.
- source_word: אֲרָם
  choice: Aram
  rationale: Le contexte généalogique demande le nom de l’ancêtre, non une désignation géographique telle que « Syrie ».
- source_word: עוּץ
  choice: Outs
  rationale: Transcription française lisible du nom propre hébreu.
- source_word: חוּל
  choice: Houl
  rationale: Transcription française du nom propre, avec « ou » pour la voyelle longue hébraïque.
- source_word: גֶתֶר
  choice: Guéter
  rationale: Transcription adaptée aux conventions graphiques françaises afin de préserver une prononciation proche de l’hébreu.
- source_word: מֶשֶׁךְ
  choice: Méshek
  rationale: Le texte massorétique de 1 Chroniques porte Méshek. La leçon différente de la généalogie parallèle est signalée en note sans modifier le texte principal.
theological_decisions:
- issue: Rapport d’Outs, Houl, Guéter et Méshek avec Aram
  choice: Les présenter grammaticalement comme faisant partie de la liste des fils de Sem, tout en marquant la division interne par un point-virgule.
  alternative: Les présenter comme les fils d’Aram, conformément à la structure explicite de Genèse 10.23.
  rationale: Dans le texte hébreu de 1 Chroniques 1.17, tous les noms suivent directement « les fils de Sem » et aucune nouvelle formule « les fils d’Aram » n’est exprimée. Le point-virgule respecte la pause majeure après Aram sans résoudre la tension avec le passage parallèle.
translation_notes:
  register: Français moderne, sobre et digne. Les noms sont adaptés aux conventions françaises tout en restant proches de l’hébreu. Le point-virgule reproduit la division marquée par l’accentuation massorétique après « Aram », sans ajouter de lien généalogique absent du verset.
