id: 1CH.1.43
reference: 1 Chronicles 1:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ/מְּלָכִ֗ים אֲשֶׁ֤ר מָלְכוּ֙ בְּ/אֶ֣רֶץ אֱד֔וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֣י יִשְׂרָאֵ֑ל בֶּ֚לַע בֶּן בְּע֔וֹר וְ/שֵׁ֥ם עִיר֖/וֹ דִּנְהָֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/043.yaml
  text: 'And these are the kings who reigned in the land of Edom before any king reigned over the sons of Israel: Bela son of Beor, and the name of his city was Dinhabah.'
translation:
  language: fr
  text: 'Et voici les rois qui régnèrent dans le pays d’Édom avant qu’un roi ne règne sur les Israélites[a] : Béla, fils de Béor ; sa ville s’appelait Dinhaba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avant le règne d’un roi pour les fils d’Israël » ; on peut aussi comprendre : « avant qu’aucun roi ne règne sur les Israélites ».'
    reason: La construction hébraïque associe l’infinitif de « régner » au nom « roi » et emploie une préposition pouvant indiquer une relation à Israël ; le français doit expliciter cette relation.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Et voici
  rationale: Cette formule française naturelle conserve à la fois la conjonction qui relie le verset à la liste précédente et la valeur présentative du démonstratif hébreu.
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: les rois qui régnèrent
  rationale: Le verbe מלך désigne ici l’exercice de la royauté. Le passé simple convient au registre narratif et généalogique.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: dans le pays d’Édom
  rationale: Cette formulation garde explicitement אֶרֶץ, « pays », tout en restant idiomatique en français.
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ
  choice: avant qu’un roi ne règne
  rationale: La tournure française restitue naturellement l’infinitif hébreu accompagné du nom apparenté, sans transformer le singulier indéfini en affirmation explicitement universelle.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sur les Israélites
  rationale: Dans ce contexte royal, « sur » exprime le peuple gouverné. « Les Israélites » rend en français moderne l’expression idiomatique « les fils d’Israël ».
- source_word: בֶּלַע בֶּן בְּעוֹר
  choice: Béla, fils de Béor
  rationale: Les noms suivent leur forme française usuelle, et « fils de » rend directement la filiation.
- source_word: וְשֵׁם עִירוֹ דִּנְהָבָה
  choice: sa ville s’appelait Dinhaba
  rationale: 'Cette formulation dynamique exprime clairement et naturellement la proposition nominale hébraïque : « le nom de sa ville était Dinhaba ».'
theological_decisions:
- issue: Moment où commence la royauté en Israël
  choice: avant qu’un roi ne règne sur les Israélites
  alternative: avant qu’aucun roi ne règne sur les Israélites
  rationale: L’hébreu emploie le singulier indéfini מֶלֶךְ, « un roi ». La traduction principale le conserve, plutôt que de préciser « aucun », tout en maintenant la référence générale au début de la monarchie israélite.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple maintient le ton historique de la liste. Les noms propres portent les accents usuels en français ; « Dinhaba » suit la forme française courante.
