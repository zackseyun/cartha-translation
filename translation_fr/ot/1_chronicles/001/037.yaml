lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Pluriel construit de בֵּן introduisant ici une liste généalogique d’enfants immédiats; « fils de » est la formulation française la plus directe.
- source_word: רְעוּאֵל
