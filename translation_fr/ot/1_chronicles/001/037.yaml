  rationale: Translittération française courante du nom hébreu, avec des accents facilitant une prononciation naturelle.
- source_word: נַחַת
  choice: Nahath
  rationale: Nom propre translittéré plutôt que traduit; le th maintient une graphie biblique française reconnaissable.
- source_word: זֶרַח
  choice: Zérah
  rationale: Nom propre translittéré; son éventuel sens lexical n’est pas introduit dans la traduction.
- source_word: שַׁמָּה
  choice: Shamma
  rationale: Translittération adaptée au français; le h final hébreu n’est pas représenté comme une consonne prononcée.
- source_word: וּ/מִזָּה
  choice: et Mizza
  rationale: La conjonction est rendue par « et »; le nom propre est translittéré en conservant la consonne redoublée signalée par le dagesh.
