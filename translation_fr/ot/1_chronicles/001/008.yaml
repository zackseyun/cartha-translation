  text: בְּנֵ֖י חָ֑ם כּ֥וּשׁ וּ/מִצְרַ֖יִם פּ֥וּט וּ/כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/008.yaml
  text: 'The sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: fr
  text: 'Les fils[a] de Cham : Koush, Mitsraïm[b], Pouth et Canaan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « descendants ». Dans les généalogies hébraïques, le mot « fils » peut désigner des fils directs ou, plus largement, des descendants.
    reason: lexical_alternative
  - marker: b
    text: Nom hébreu traditionnellement associé à l’Égypte. La forme « Mitsraïm » est conservée ici parce qu’il s’agit d’un nom dans une liste généalogique.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Pluriel construit de בֵּן dans une formule généalogique. « Les fils de » est naturel et fidèle, tout en pouvant désigner des descendants plus éloignés.
- source_word: חָם
  choice: Cham
  rationale: Nom propre rendu selon sa forme française biblique traditionnelle et encore courante.
- source_word: כּוּשׁ
  choice: Koush
  rationale: Translittération française claire du nom propre hébreu, préférable ici à un nom géographique puisque le terme figure dans une généalogie.
- source_word: מִצְרַיִם
  choice: Mitsraïm
  rationale: Le nom hébreu est conservé sous une forme translittérée, car il apparaît comme nom propre dans une liste généalogique, aux côtés de Koush, Pouth et Canaan.
- source_word: פּוּט
  choice: Pouth
  rationale: Forme française traditionnelle et transparente du nom propre hébreu.
- source_word: כְנָעַן
  choice: Canaan
  rationale: Forme française usuelle de ce nom propre, employé ici dans la généalogie.
