  yaml_path: translation/ot/1_chronicles/001/013.yaml
  text: And Canaan fathered Sidon his firstborn[b][a], and Heth.
translation:
  language: fr
  text: Et Canaan engendra Sidon, son premier-né, et Heth[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Heth est l’ancêtre associé aux Hittites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: Canaan
  rationale: Le nom propre est transcrit selon l’usage français courant. La conjonction initiale n’est pas rendue séparément, car le français généalogique enchaîne naturellement sans « et » en tête de verset.
- source_word: יָלַד
  choice: engendra
  rationale: Dans cette généalogie, le verbe désigne l’action d’un père qui donne naissance à une descendance. « Engendra » est précis, concis et reste naturel dans le registre généalogique biblique.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: La marque de l’objet direct n’a pas d’équivalent lexical autonome en français.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Cette forme correspond à la transcription française courante du nom propre.
- source_word: בְּכֹר/וֹ
  choice: son premier-né
  rationale: Cette formulation conserve explicitement la notion de rang de naissance exprimée par le nom hébreu et son suffixe possessif.
- source_word: וְ/אֶת
  choice: et
  rationale: La conjonction relie naturellement le second descendant au premier; la marque de l’objet direct n’est pas rendue séparément.
- source_word: חֵת
  choice: Heth
  rationale: Le texte porte ici le nom personnel de l’ancêtre, et non le nom collectif des Hittites.
theological_decisions:
- issue: Statut de Heth dans la généalogie
  choice: Conserver le nom personnel « Heth »
  alternative: Traduire de manière interprétative par « les Hittites »
  rationale: La forme hébraïque désigne ici un individu de la généalogie. La traduction évite de remplacer cet ancêtre par le peuple qui lui est traditionnellement associé.
translation_notes:
  register: Français moderne, sobre et digne. « Engendra » maintient la précision généalogique sans recourir à une périphrase plus lourde. Le marqueur de note [a] figure immédiatement après « Heth ».
