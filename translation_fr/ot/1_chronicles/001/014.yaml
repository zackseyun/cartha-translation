translation:
  language: fr
  text: les Jébuséens[a], les Amoréens et les Guirgasiens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici des gentilés au singulier dans un sens collectif pour désigner les peuples : les Jébuséens, les Amoréens et les Guirgasiens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: les Jébuséens
  rationale: Le gentilébreu morphologiquement singulier a ici un sens collectif dans la liste généalogique; le pluriel français désigne naturellement le peuple.
- source_word: הָאֱמֹרִי
  choice: les Amoréens
  rationale: Comme les gentilés voisins, ce singulier hébreu représente collectivement un peuple; « les Amoréens » est la forme française courante.
- source_word: הַגִּרְגָּשִׁי
  choice: les Guirgasiens
  rationale: Le gentilé singulier est compris collectivement et rendu par le nom de peuple au pluriel, conformément à l'usage français biblique courant.
- source_word: וְאֶת / וְאֵת
  choice: virgules et « et » final
  rationale: אֵת est un marqueur d'objet direct sans équivalent lexical en français; les conjonctions répétées sont rendues naturellement par l'énumération française et un « et » avant le dernier élément.
