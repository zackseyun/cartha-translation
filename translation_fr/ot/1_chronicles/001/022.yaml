  text: Ebal[a], Abimael, and Sheba.
translation:
  language: fr
  text: Ébal[a], Abimaël et Saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la généalogie parallèle de Genèse 10.28, ce nom apparaît sous la forme « Obal ».
