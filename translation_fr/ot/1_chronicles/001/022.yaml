lexical_decisions:
- source_word: וְאֶת
  choice: et / coordination de la liste
  rationale: La conjonction וְ associée à la marque de l’objet אֶת introduit chaque nom. En français, les marques de l’objet ne sont pas rendues et la coordination s’exprime naturellement par la ponctuation puis « et » devant le dernier élément.
- source_word: עֵיבָל
  choice: Ébal
  rationale: Translittération française usuelle de la forme hébraïque présente dans ce verset. La forme différente « Obal » du passage parallèle en Genèse 10.28 est signalée en note.
- source_word: אֲבִימָאֵל
  choice: Abimaël
  rationale: Translittération du nom propre selon l’usage français, avec le tréma indiquant que les voyelles a et ë appartiennent à des syllabes distinctes.
- source_word: שְׁבָא
  choice: Saba
  rationale: Forme française traditionnelle et largement reconnue correspondant à l’hébreu שְׁבָא; elle évite de confondre ce nom avec Séba, qui représente ailleurs un nom hébreu distinct.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La structure nominale très concise de la liste généalogique est conservée, sans ajout de verbe ni d’explication dans le corps du texte.
