  text: וַ/יָּ֨מָת֙ בַּ֣עַל חָנָ֔ן וַ/יִּמְלֹ֤ךְ תַּחְתָּי/ו֙ הֲדַ֔ד וְ/שֵׁ֥ם עִיר֖/וֹ פָּ֑עִי וְ/שֵׁ֨ם אִשְׁתּ֤/וֹ מְהֵיטַבְאֵל֙ בַּת מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/050.yaml
  text: Baal-hanan died[a], and Hadad reigned in his place. The name of his city was Pai, and the name of his wife was Mehetabel daughter of Matred[b], daughter of Mezahab.
translation:
  language: fr
  text: Baal-Hanân mourut, et Hadad régna à sa place. Le nom de sa ville était Paï[a], et le nom de sa femme était Mehétabeel, fille de Matred[b], fille de Mé-Zahab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En Genèse 36.39, le nom de la ville est « Paou », tandis que le texte des Chroniques porte « Paï ».
    reason: textual_variant
  - marker: b
    text: Dans un contexte généalogique, la seconde expression « fille de » peut avoir le sens de « petite-fille de »; la traduction conserve toutefois la formulation littérale de l’hébreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת בַּעַל חָנָן
  choice: Baal-Hanân mourut
  rationale: Le verbe מות dans cette forme narrative marque simplement la mort du roi précédent et la progression de la succession. Le nom propre est translittéré selon l’usage français.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: régna à sa place
  rationale: Cette formule de succession royale exprime l’accession de Hadad au règne après Baal-Hanân; la formulation française reste proche de l’hébreu et naturelle.
- source_word: וְשֵׁם עִירוֹ פָּעִי
  choice: Le nom de sa ville était Paï
  rationale: La proposition nominale hébraïque appelle naturellement « était » en français. La forme propre au texte des Chroniques, פָּעִי, est conservée plutôt que remplacée par celle de Genèse 36.39.
- source_word: וְשֵׁם אִשְׁתּוֹ מְהֵיטַבְאֵל
  choice: et le nom de sa femme était Mehétabeel
  rationale: La formule de dénomination est maintenue dans un français clair et digne; le nom propre est translittéré.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: fille de Matred, fille de Mé-Zahab
  rationale: La répétition exacte de « fille de » préserve l’ambiguïté généalogique de l’hébreu, sans imposer l’interprétation « petite-fille de ».
- source_word: מֵי זָהָב
  choice: Mé-Zahab
  rationale: Dans ce contexte généalogique, l’expression est comprise comme un nom propre et translittérée, non traduite littéralement.
