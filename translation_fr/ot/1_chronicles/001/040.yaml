base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/040.yaml
  text: 'The sons of Shobal: Alian[a], Manahath, Ebal, Shephi, and Onam[b]. And the sons of Zibeon: Aiah and Anah.'
translation:
  language: fr
  text: 'Les fils de Shobal : Alian[a], Manahath, Ébal, Shephi[b] et Onam. Les fils de Tsibéon : Ayya et Ana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « Alian »; dans la généalogie parallèle de Genèse 36.23, on lit « Alvan ».
    reason: alternative_reading
  - marker: b
    text: Les Chroniques portent « Shephi »; dans le passage parallèle de Genèse 36.23, on lit « Shepho ».
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Dans cette généalogie, le terme désigne les fils nommément énumérés. La tournure française conserve la formulation généalogique directe de l’hébreu.
- source_word: עַלְיָן
  choice: Alian
  rationale: Translittération de la forme propre à ce verset dans le texte hébreu des Chroniques, sans l’harmoniser avec la forme parallèle de Genèse 36.23.
- source_word: מָנַחַת
  choice: Manahath
  rationale: Translittération usuelle du nom propre hébreu en français biblique.
- source_word: עֵיבָל
  choice: Ébal
  rationale: Translittération française naturelle de la forme hébraïque, avec accent initial conforme à l’usage français.
- source_word: שְׁפִי
  choice: Shephi
  rationale: Reproduction de la forme lue dans les Chroniques; la variante Shepho de Genèse 36.23 est signalée en note plutôt qu’introduite dans le texte.
- source_word: אוֹנָם
  choice: Onam
  rationale: Translittération directe du nom propre hébreu.
- source_word: צִבְעוֹן
  choice: Tsibéon
  rationale: La graphie « Ts » rend naturellement le son initial hébreu en français, et l’accent facilite la lecture française du nom.
- source_word: אַיָּה
  choice: Ayya
  rationale: Cette graphie rend la consonne médiane redoublée et permet une prononciation française proche de la forme hébraïque.
- source_word: עֲנָה
  choice: Ana
  rationale: Translittération française simple et lisible du nom hébreu.
- source_word: וְ / וּ / וַ
  choice: et
  rationale: Les conjonctions coordonnent simplement les noms et les deux groupes généalogiques. En français, la ponctuation et « et » rendent cette structure sans lourdeur.
