  text: וּ/בְנֵ֥י יָוָ֖ן אֱלִישָׁ֣ה וְ/תַרְשִׁ֑ישָׁ/ה כִּתִּ֖ים וְ/רוֹדָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/007.yaml
  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Rodanim.'
translation:
  language: fr
  text: 'Et les fils de Yavân : Élisha, Tarsis, Kittim et Rodanim[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En Genèse 10.4, on lit « Dodanim » au lieu de « Rodanim » ; il s’agit d’une variante textuelle du nom.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: בְּנֵי est le pluriel construit de « fils ». Dans cette généalogie, « les fils de » conserve la forme généalogique du texte. Le וּ initial marque la coordination avec le contexte précédent, mais n’est pas rendu par « et » afin d’éviter une tournure artificielle en français dans cet énoncé nominal.
- source_word: יָוָן
  choice: Yavân
  rationale: Nom propre translittéré plutôt que rendu par « Grèce » ou « les Grecs » ; la graphie Yavân représente clairement le nom hébreu en français.
- source_word: אֱלִישָׁה
  choice: Élisha
  rationale: Translittération française lisible du nom propre hébreu.
- source_word: תַרְשִׁישָׁה
  choice: Tarsis
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre correspondant à Tarshish ; le ה final ne reçoit pas de rendu distinct.
- source_word: כִּתִּים
  choice: Kittim
  rationale: Translittération lisible de cet ethnonyme ou nom géographique, qui conserve le pluriel formel hébreu.
- source_word: וְרוֹדָנִים
  choice: et Rodanim
  rationale: Le texte massorétique des Chroniques porte רוֹדָנִים, « Rodanim ». La variante « Dodanim » du passage parallèle est signalée en note sans remplacer la leçon du texte source.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne, avec la concision propre à une liste généalogique. Les noms sont translittérés ou donnés sous leur forme française établie. Le marqueur de note est placé après « Rodanim », le nom directement concerné par la variante.
