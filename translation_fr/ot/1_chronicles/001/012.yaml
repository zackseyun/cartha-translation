  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/012.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: fr
  text: les Patrousites, les Kaslouhites — c’est de là que sont issus les Philistins[a] — et les Caphtorites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de là sortirent les Philistins ». Dans 1 Chroniques, cette proposition se rattache le plus naturellement aux Kaslouhites qui la précèdent immédiatement. Cependant, Genèse 10.14 présente la même formulation, et d’autres textes bibliques associent aussi les Philistins à Caphtor (voir Amos 9.7 ; Jérémie 47.4).'
    reason: cross_reference
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: Patrousites
  rationale: Translittération française actuelle du nom de ce peuple, dérivé de Patros, sans chercher à en préciser davantage l’identité.
- source_word: כַּסְלֻחִים
  choice: Kaslouhites
  rationale: Translittération de cet ethnonyme au référent incertain; le k rend directement la consonne hébraïque et la finale -ites marque naturellement un peuple en français.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: c’est de là que sont issus
  rationale: Rend le sens littéral de provenance (« sortir de là ») dans un français naturel, tout en conservant l’ambiguïté de מִשָּׁם plutôt qu’en imposant « d’eux ».
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Forme française usuelle de cet ethnonyme.
- source_word: כַּפְתֹּרִים
  choice: Caphtorites
  rationale: Translittération française traditionnelle du nom de ce peuple associé à Caphtor.
- source_word: וְאֶת
  choice: et / ainsi que
  rationale: Le marqueur d’objet אֶת ne se traduit pas; les conjonctions répétées sont rendues par une coordination française naturelle qui conserve la structure de la liste.
theological_decisions:
- issue: Rattachement de la proposition sur l’origine des Philistins
  choice: Conserver « de là » dans le texte et placer la proposition immédiatement après les Kaslouhites.
  alternative: « dont sont issus les Philistins », ou rattacher explicitement la proposition aux Caphtorites.
  rationale: Dans l’ordre syntaxique du texte massorétique, la proposition suit immédiatement les Kaslouhites, mais son adverbe מִשָּׁם signifie littéralement « de là ». Cette formulation préserve la donnée de Chroniques sans effacer la tradition biblique qui associe aussi les Philistins à Caphtor.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation détache la proposition explicative sans transformer la généalogie en phrase complète; les ethnonymes sont translittérés selon des formes françaises lisibles.
