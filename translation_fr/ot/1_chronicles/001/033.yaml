base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/033.yaml
  text: 'The sons of Midian: Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.'
translation:
  language: fr
  text: 'Fils de Madian : Épha, Épher, Hénoc, Abida et Eldaa. Tous ceux-là étaient fils de Ketura.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: Fils de Madian
  rationale: Le nom construit pluriel introduit une liste généalogique. En français, l’intitulé nominal sans verbe ni conjonction initiale est naturel et fidèle à ce style.
- source_word: עֵיפָה
  choice: Épha
  rationale: Transcription française usuelle de ce nom propre hébreu.
- source_word: וָעֵפֶר
  choice: Épher
  rationale: Le nom propre est transcrit selon l’usage biblique français; les conjonctions hébraïques de la série sont rendues par la ponctuation française et « et » devant le dernier nom.
- source_word: וַחֲנוֹךְ
  choice: Hénok
  rationale: Forme française traditionnelle du nom חֲנוֹךְ, immédiatement reconnaissable sans confondre son identité dans la généalogie.
- source_word: וַאֲבִידָע
  choice: Abida
  rationale: Transcription française sobre du nom propre hébreu.
- source_word: וְאֶלְדָּעָה
  choice: et Eldaa
  rationale: La conjonction est exprimée devant le dernier élément de l’énumération, conformément à l’usage français.
- source_word: כָּל אֵלֶּה
  choice: Tous ceux-là
  rationale: Rend directement le récapitulatif démonstratif hébreu et renvoie clairement aux hommes qui viennent d’être nommés.
- source_word: בְּנֵי קְטוּרָה
  choice: étaient fils de Ketoura
  rationale: Le verbe « étaient » est ajouté pour former une phrase française complète; « fils de » conserve la formulation généalogique du texte.
