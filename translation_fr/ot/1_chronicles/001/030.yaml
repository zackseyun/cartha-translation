- source_word: וְ/דוּמָה
  choice: Douma
  rationale: Nom propre translittéré sous une forme naturelle en français; la conjonction hébraïque est rendue implicitement par la ponctuation de l’énumération.
- source_word: מַשָּׂא
  choice: Massa
  rationale: Dans ce contexte généalogique, il s’agit d’un nom propre et non du nom commun pouvant signifier « fardeau » ou « oracle ».
- source_word: חֲדַד
  choice: Hadad
  rationale: Le texte massorétique de 1 Chroniques porte Hadad; cette leçon est conservée malgré la forme parallèle Hadar en Genèse 25.15.
- source_word: וְ/תֵימָא
  choice: et Téma
  rationale: Le nom propre est translittéré, et la conjonction וְ est rendue par « et » devant le dernier élément de la liste.
