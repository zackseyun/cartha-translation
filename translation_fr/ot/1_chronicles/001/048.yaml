  text: וַ/יָּ֖מָת שַׂמְלָ֑ה וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו שָׁא֖וּל מֵ/רְחֹב֥וֹת הַ/נָּהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/048.yaml
  text: Samlah died[a], and Shaul from Rehoboth by the River reigned in his place.
translation:
  language: fr
  text: Samla mourut, et Shaoul, de Rehoboth-sur-le-Fleuve[a], régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « Rehoboth du fleuve » ; beaucoup y comprennent une référence à l’Euphrate.
    reason: La relation exacte exprimée dans le nom de lieu et l’identité du fleuve ne sont pas entièrement explicites dans le texte hébreu.
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le qal wayyiqtol de מות indique simplement la mort. « Mourut » est direct, naturel et sans euphémisme.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Translittération française simple du nom propre hébreu, sans h final muet inutile.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans cette formule de succession royale, מלך signifie qu’un homme accède à la royauté et règne; « régna » conserve la formulation concise du texte.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans un contexte de succession, תחת avec suffixe signifie « à la place de lui »; l’expression française choisie est naturelle et précise.
- source_word: שָׁאוּל
  choice: Shaoul
  rationale: Translittération française courante du nom hébreu, qui permet aussi de ne pas l’assimiler artificiellement au roi Saül d’Israël.
- source_word: מֵרְחֹבוֹת
  choice: originaire de Rehoboth
  rationale: Le préfixe מ־ marque ici la provenance. « Originaire de » rend cette relation plus explicitement que le seul « de ».
- source_word: הַנָּהָר
  choice: du Fleuve
  rationale: Le syntagme signifie littéralement « le fleuve » et peut avoir une valeur géographique déterminée, souvent comprise comme une désignation de l’Euphrate. La majuscule préserve cette valeur possible sans introduire le nom « Euphrate » dans le texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Les noms sont translittérés selon des formes lisibles en français. Le trait d’union dans « Rehoboth-du-Fleuve » présente l’ensemble comme une désignation géographique tout en renvoyant en note l’ambiguïté de l’hébreu.
