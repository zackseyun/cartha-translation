  text: בְּנֵ֣י יֶ֔פֶת גֹּ֣מֶר וּ/מָג֔וֹג וּ/מָדַ֖י וְ/יָוָ֣ן וְ/תֻבָ֑ל וּ/מֶ֖שֶׁךְ וְ/תִירָֽס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/005.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: fr
  text: 'Les fils de Japhet[a] : Gomer, Magog, Madaï, Yavân, Toubal, Méshek et Tiras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, l’expression « fils de » peut désigner les fils immédiats ou, plus largement, les descendants; elle introduit ici la lignée de Japhet sous forme de liste.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן introduit ici une liste généalogique. « Les fils de » est naturel et formel en français, tout en laissant au terme sa possible portée généalogique plus large, signalée en note.
- source_word: יֶפֶת
  choice: Japhet
  rationale: Nom propre rendu selon la forme biblique française courante.
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Nom propre translittéré selon l’usage biblique français courant.
- source_word: מָגוֹג
  choice: Magog
  rationale: Nom propre translittéré selon l’usage biblique français courant.
- source_word: מָדַי
  choice: Madaï
  rationale: Le texte présente un nom personnel ou généalogique; la translittération évite de l’interpréter directement comme une désignation ethnique des Mèdes.
- source_word: יָוָן
  choice: Yavân
  rationale: Translittération française transparente du nom hébreu, plutôt qu’une interprétation géographique comme « Grèce ».
- source_word: תֻבָל
  choice: Toubal
  rationale: Nom propre translittéré selon les conventions phonétiques françaises.
- source_word: מֶשֶׁךְ
  choice: Méshek
  rationale: Nom propre translittéré de manière accessible en français, en représentant שׁ par « sh ».
- source_word: תִירָס
  choice: Tiras
  rationale: Nom propre translittéré.
- source_word: וְ / וּ
  choice: virgules, puis « et » avant le dernier nom
  rationale: Les conjonctions hébraïques structurent l’énumération. La ponctuation française et un « et » final en rendent naturellement la fonction sans répétition pesante.
