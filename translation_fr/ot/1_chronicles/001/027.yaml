lexical_decisions:
- source_word: אַבְרָם
  choice: Abram
  rationale: Nom propre rendu selon sa forme française traditionnelle et courante dans la Bible.
- source_word: הוּא
  choice: c’est-à-dire
  rationale: Dans cette proposition nominale qui met en relation deux formes du même nom, cette expression rend naturellement en français la fonction d’identification du pronom indépendant hébreu, littéralement « lui ».
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Nom propre rendu selon sa forme française traditionnelle et courante; le texte identifie Abram à Abraham, nom qu’il a reçu par la suite.
theological_decisions:
- issue: Rendu de la formule d’identification sans verbe dans un contexte généalogique
  choice: Abram, c’est-à-dire Abraham.
  alternative: Abram, lui, c’est Abraham. / Abram est Abraham.
  rationale: L’hébreu relie les deux noms au moyen du pronom הוּא dans une proposition nominale. « C’est-à-dire » exprime clairement et naturellement l’identification en français, sans ajouter d’interprétation théologique.
translation_notes:
  register: Français international moderne, simple et digne. La ponctuation met en valeur la brève précision généalogique, tandis que la note conserve les formes plus littérales de l’hébreu.
