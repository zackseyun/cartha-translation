  text: בְּנֵ֖י עֵשָׂ֑ו אֱלִיפַ֛ז רְעוּאֵ֥ל וִ/יע֖וּשׁ וְ/יַעְלָ֥ם וְ/קֹֽרַח׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/035.yaml
  text: 'The sons of Esau: Eliphaz[a], Reuel, Jeush, Jalam, and Korah.'
translation:
  language: fr
  text: 'Fils d’Ésaü : Éliphaz, Réouel[a], Yéouch, Yalam et Coré.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce nom est aussi transcrit Ragouël dans certaines traditions.
    reason: Variante de translittération transmise notamment par les traditions grecque et latine; elle ne désigne pas une autre personne.
lexical_decisions:
- source_word: בְּנֵי
  choice: Fils de
  rationale: Le pluriel construit de בֵּן introduit ici la liste généalogique des fils immédiats d’Ésaü; « Fils de » est précis et naturel.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Forme française biblique courante du nom propre hébreu.
- source_word: אֱלִיפַז
  choice: Éliphaz
  rationale: Translittération française traditionnelle et aisément reconnaissable.
- source_word: רְעוּאֵל
  choice: Réouel
  rationale: Cette graphie représente directement les éléments vocaliques du texte hébreu et correspond à un usage français établi.
- source_word: וִיעוּשׁ
  choice: Yéouch
  rationale: Le waw initial est la conjonction; le nom יעוש commence par yod. « Yéouch » rend plus directement la forme hébraïque que la graphie traditionnelle « Jéusch ».
- source_word: וְיַעְלָם
  choice: Yalam
  rationale: Le waw initial est la conjonction; « Yalam » rend simplement le nom hébreu יעלם, sans conserver la graphie anglaise Jalam.
- source_word: וְקֹרַח
  choice: et Coré
  rationale: « Coré » est la forme française biblique courante de קֹרַח; la conjonction hébraïque est rendue par « et » devant le dernier nom.
