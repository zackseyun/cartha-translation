  text: וַ/יּ֥וֹלֶד אַבְרָהָ֖ם אֶת יִצְחָ֑ק בְּנֵ֣י יִצְחָ֔ק עֵשָׂ֖ו וְ/יִשְׂרָאֵֽל־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/034.yaml
  text: 'Abraham fathered Isaac[a]. The sons of Isaac: Esau and Israel.'
translation:
  language: fr
  text: 'Abraham fut le père d’Isaac. Les fils d’Isaac : Ésaü et Israël[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Israël, c’est-à-dire Jacob.
    reason: Clarifie l’identité de la personne tout en conservant dans le texte principal le nom employé par l’hébreu.
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: fut le père de
  rationale: Dans ce contexte généalogique, le hifil de ילד indique qu’Abraham devint le père d’Isaac. Cette formulation est naturelle en français moderne et évite le caractère soutenu ou vieilli d’« engendra ».
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Cette particule marque le complément d’objet direct en hébreu et n’a pas d’équivalent lexical autonome en français.
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בן introduit la descendance immédiate d’Isaac sous une forme concise, adaptée à une généalogie.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Forme française usuelle du nom propre hébreu.
- source_word: וְיִשְׂרָאֵל
  choice: et Israël
  rationale: Le texte hébreu emploie explicitement le nom Israël. La traduction le conserve au lieu de l’harmoniser avec le nom Jacob.
theological_decisions:
- issue: Rendu de יִשְׂרָאֵל dans la liste des fils d’Isaac
  choice: Israël
  alternative: Jacob
  rationale: Même si la personne désignée est Jacob, le texte source l’appelle ici Israël. Conserver ce nom respecte la formulation hébraïque et maintient le lien entre les deux noms sans harmonisation implicite.
translation_notes:
  register: Français moderne, clair et digne. La tournure « fut le père de » privilégie une expression courante plutôt que le traditionnel « engendra ». Le style nominal de la seconde phrase conserve la concision de la généalogie.
