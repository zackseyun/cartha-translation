  text: וְ/אֶת הַ/חִוִּ֥י וְ/אֶת הַֽ/עַרְקִ֖י וְ/אֶת הַ/סִּינִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/015.yaml
  text: and the Hivites[a], and the Arkites, and the Sinites.
translation:
  language: fr
  text: les Hivites[a], les Arqites et les Sinites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici des gentilés au singulier avec l’article (« le Hivite », « l’Arqite », « le Sinite »), mais, dans cette généalogie, ils désignent des peuples ou des clans; d’où le pluriel en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: et / coordination par la ponctuation
  rationale: La conjonction וְ marque la coordination de la liste. En français naturel, elle est exprimée devant le dernier élément, tandis que les éléments précédents sont séparés par des virgules. Le marqueur d’objet direct אֶת n’a pas d’équivalent à rendre ici.
- source_word: הַחִוִּי
  choice: les Hivites
  rationale: Ce gentilé hébreu singulier avec article désigne collectivement un peuple dans cette généalogie; le pluriel français rend naturellement cette valeur collective.
- source_word: הָעַרְקִי
  choice: les Arqites
  rationale: Gentilé désignant un groupe humain lié à Arqa; la graphie « Arqites » reflète le nom propre et le pluriel exprime la valeur collective du singulier hébreu.
- source_word: הַסִּינִי
  choice: les Sinites
  rationale: Gentilé employé collectivement pour un peuple ou un clan; le pluriel convient à une liste généalogique de groupes humains.
theological_decisions: []
