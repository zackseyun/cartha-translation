base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/011.yaml
  text: Mizraim fathered the Ludites[a], the Anamites, the Lehabites, and the Naphtuhites.
translation:
  language: fr
  text: Mitsraïm engendra les Loudim[a], les Anamim, les Lehabim et les Naftouhim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, sous forme de noms de peuples francisés : « les Loudites, les Anamites, les Lehabites et les Naftouhites ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Mitsraïm
  rationale: Dans cette généalogie, le terme fonctionne comme un nom personnel; il est donc translittéré plutôt que traduit par « Égypte ».
- source_word: יָלַד
  choice: engendra
  rationale: Dans une formule généalogique, le verbe exprime la procréation ou l'ascendance. « Engendra » est concis, digne et conserve la formulation masculine du texte hébreu.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Cette particule marque le complément d'objet direct et n'a pas d'équivalent lexical autonome en français.
- source_word: לודיים
  choice: Loudim
  rationale: Le nom de peuple est directement translittéré, car le français ne forme pas naturellement ici un gentilé équivalent à l'anglais « Ludites ».
- source_word: עֲנָמִים
  choice: Anamim
  rationale: Translittération du nom de peuple, en cohérence avec les autres noms de la liste.
- source_word: לְהָבִים
  choice: Lehabim
  rationale: Translittération du nom de peuple, sans transformer arbitrairement le nom hébreu en gentilé français.
- source_word: נַפְתֻּחִים
  choice: Naftouhim
  rationale: Translittération française qui représente naturellement les consonnes et les voyelles du nom hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La formule généalogique « engendra » conserve la concision de l'hébreu. Les noms de peuples sont translittérés; l'article pluriel « les » indique leur valeur collective.
