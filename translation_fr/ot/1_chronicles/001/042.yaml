  text: בְּֽנֵי אֵ֔צֶר בִּלְהָ֥ן וְ/זַעֲוָ֖ן יַעֲקָ֑ן בְּנֵ֥י דִישׁ֖וֹן ע֥וּץ וַ/אֲרָֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/042.yaml
  text: 'The sons of Ezer: Bilhan[a], Zaavan, and Jaakan[b]. The sons of Dishon: Uz and Aran.'
translation:
  language: fr
  text: 'Les fils d’Étser : Bilhan, Zaavan et Yaakan[a]. Les fils de Dishôn : Outs et Arân.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « Yaakan » ; la généalogie parallèle en Genèse 36.27 porte « Akan ».
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן introduit ici une liste généalogique de fils directs. « Les fils de » est précis, naturel et traditionnel en français.
- source_word: אֵצֶר
  choice: Étser
  rationale: Nom propre translittéré en tenant compte de la consonne hébraïque צ, rendue par « ts » en français.
- source_word: בִּלְהָן
  choice: Bilhan
  rationale: Translittération française directe du nom propre hébreu.
- source_word: זַעֲוָן
  choice: Zaavan
  rationale: Cette forme reflète la vocalisation du texte hébreu des Chroniques et permet de la distinguer de la variante « Zavan » en Genèse 36.27.
- source_word: יַעֲקָן
  choice: Yaakan
  rationale: Le yod initial est rendu par « Y » en français. Cette forme suit le texte des Chroniques sans l’assimiler à la variante « Akan » de Genèse 36.27.
- source_word: דִישׁוֹן
  choice: Dishôn
  rationale: Translittération du nom propre, avec « ô » pour signaler la voyelle longue et le distinguer clairement de Dishân.
- source_word: עוּץ
  choice: Outs
  rationale: 'Translittération adaptée au français : « ou » rend la voyelle hébraïque longue, et « ts » la consonne צ.'
- source_word: אֲרָן
  choice: Arân
  rationale: Translittération française du nom propre, avec « â » pour refléter la voyelle longue accentuée.
