source:
  edition: WLC
  text: וַ/יָּ֖מָת חוּשָׁ֑ם וַ/יִּמְלֹ֨ךְ תַּחְתָּ֜י/ו הֲדַ֣ד בֶּן בְּדַ֗ד הַ/מַּכֶּ֤ה אֶת מִדְיָן֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב וְ/שֵׁ֥ם עִיר֖/וֹ עיות־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/046.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab; and the name of his city was Avith.
translation:
  language: fr
  text: Housham mourut. Hadad, fils de Bedad, régna à sa place. C’est lui qui battit Madian dans la campagne de Moab. Sa ville s’appelait Avith[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Aioth », autre translittération possible du nom de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le verbe מות désigne directement la mort; le passé simple convient au récit généalogique et évite tout euphémisme.
- source_word: חוּשָׁם
  choice: Housham
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: régna à sa place
  rationale: Rend à la fois l’exercice de la royauté exprimé par מלך et la succession indiquée par תחתיו.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Hadad, fils de Bedad
  rationale: Translittération des noms propres et restitution directe du patronyme introduit par בן.
- source_word: הַמַּכֶּה אֶת מִדְיָן
  choice: C’est lui qui battit Madian
  rationale: Le participe de נכה caractérise Hadad par une action militaire notable. « Battit » est naturel en français et reste moins explicatif que « vainquit les Madianites ».
- source_word: בִּשְׂדֵה מוֹאָב
  choice: dans la campagne de Moab
  rationale: שׂדה peut désigner un champ ou, dans ce contexte géographique et militaire, la campagne ouverte d’un pays; cette formulation préserve cette nuance sans suggérer nécessairement une seule parcelle.
- source_word: וְשֵׁם עִירוֹ
  choice: Sa ville s’appelait
  rationale: Expression française naturelle correspondant à la formule hébraïque littérale « et le nom de sa ville était ».
- source_word: עיות
  choice: Avith
  rationale: Forme française traditionnelle du nom de lieu; la graphie non vocalisée transmise ici permet aussi une autre translittération, signalée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. Le verset est réparti en phrases courtes pour éviter une relative française dont l’antécédent serait ambigu, tout en conservant l’identification emphatique de Hadad comme celui qui battit Madian.
