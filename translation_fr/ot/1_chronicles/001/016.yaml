  text: and the Arvadites[a], and the Zemarites, and the Hamathites.
translation:
  language: fr
  text: Et les Arvadiens, les Tsemariens et les Hamathiens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: et / ponctuation de liste
  rationale: Dans cette liste généalogique, וְ relie les différents peuples, tandis que אֵת est un marqueur d’objet direct qui ne se traduit pas séparément en français. Une énumération avec des virgules et « et » avant le dernier élément est naturelle.
- source_word: הָאַרְוָדִי
  choice: les Arvadiens
  rationale: Le gentilé hébreu, singulier dans sa forme mais collectif dans son emploi, désigne ici le peuple lié à Arvad. Le pluriel français rend clairement cette valeur collective.
- source_word: הַצְּמָרִי
  choice: les Tsemariens
  rationale: Comme les gentilés voisins, cette forme singulière a un sens collectif. « Tsemariens » conserve le lien avec le nom hébreu Tsemar tout en désignant naturellement un peuple.
- source_word: הַחֲמָתִי
  choice: les Hamathiens
  rationale: Ce gentilé désigne collectivement le peuple associé à Hamath. Le pluriel « Hamathiens » convient au style d’une liste de peuples.
