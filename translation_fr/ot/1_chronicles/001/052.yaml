  yaml_path: translation/ot/1_chronicles/001/052.yaml
  text: Chief Oholibamah[a], chief Elah, chief Pinon.
translation:
  language: fr
  text: Le chef[a] Oholibama, le chef Éla, le chef Pinon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chef de clan ». Certaines versions anciennes traduisent par « duc ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: chef
  rationale: Dans les listes édomites, le terme désigne un dirigeant de tribu ou de clan, et non spécifiquement un commandant militaire. « Chef » est concis, naturel et convient à la formule répétée.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Le nom propre est translittéré selon sa forme française courante, sans être traduit.
- source_word: אֵלָה
  choice: Éla
  rationale: Le nom propre est translittéré en français; l’accent facilite la prononciation et correspond à l’usage biblique français.
- source_word: פִּינֹן
  choice: Pinon
  rationale: Le nom propre est translittéré directement sous sa forme française concise.
theological_decisions: []
translation_notes:
  register: Formulation sobre et répétitive, fidèle au caractère généalogique de la liste. « Chef » relève d’un français moderne et digne; « duc » a été écarté du texte principal parce qu’il évoque un titre nobiliaire européen anachronique.
