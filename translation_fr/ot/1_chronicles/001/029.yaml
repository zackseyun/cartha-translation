  text: אֵ֖לֶּה תֹּלְדוֹתָ֑/ם בְּכ֤וֹר יִשְׁמָעֵאל֙ נְבָי֔וֹת וְ/קֵדָ֥ר וְ/אַדְבְּאֵ֖ל וּ/מִבְשָֽׂם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/029.yaml
  text: 'These are their generations: the firstborn of Ishmael[a], Nebaioth, Kedar, Adbeel, and Mibsam.'
translation:
  language: fr
  text: 'Voici leur descendance : le premier-né d’Ismaël, Nebayoth[a], ainsi que Qédar, Adbéel et Mibsam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nebayoth est aussi transcrit « Nebajoth » dans certaines traductions françaises.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Formule déictique naturelle en français pour introduire une liste généalogique.
- source_word: תֹּלְדוֹתָם
  choice: leur descendance
  rationale: Dans ce contexte généalogique, le terme désigne la lignée ou les descendants. « Leur descendance » conserve le suffixe pluriel et son antécédent implicite sans le préciser artificiellement.
- source_word: בְּכוֹר
  choice: le premier-né
  rationale: Rend directement le statut de premier-né sans ajouter « fils », absent de l’hébreu.
- source_word: יִשְׁמָעֵאל
  choice: Ismaël
  rationale: Forme française traditionnelle et courante du nom.
- source_word: נְבָיוֹת
  choice: Nebayoth
  rationale: Transcription française lisible de la forme hébraïque; la variante traditionnelle « Nebajoth » est signalée en note.
- source_word: קֵדָר
  choice: Qédar
  rationale: Transcription française usuelle du nom hébreu, avec Q pour la consonne initiale et accent pour guider la lecture.
- source_word: אַדְבְּאֵל
  choice: Adbéel
  rationale: Transcription française transparente du nom propre.
- source_word: מִבְשָׂם
  choice: Mibsam
  rationale: Transcription directe et courante du nom propre.
theological_decisions: []
