  yaml_path: translation/ot/1_chronicles/001/038.yaml
  text: 'And the sons of Seir: Lotan[a], Shobal, Zibeon, Anah, Dishon, Ezer, and Dishan.'
translation:
  language: fr
  text: 'Et les fils[a] de Séir : Lotan, Shobal, Tsibéon, Ana, Dishon, Étser et Dishan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les généalogies, le mot hébreu traduit par « fils » peut désigner des fils directs ou, plus largement, des descendants ou des membres d’un clan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Et les fils
  rationale: Le pluriel construit בְּנֵי introduit la liste généalogique. La conjonction וּ est rendue par « Et » afin de conserver la continuité avec les listes précédentes.
- source_word: שֵׂעִיר
  choice: Séir
  rationale: Nom propre de personne dans ce contexte généalogique, transcrit selon l’usage biblique français.
- source_word: לוֹטָן
  choice: Lotân
  rationale: Transcription française du nom propre, avec l’accent circonflexe indiquant la voyelle longue finale.
- source_word: שׁוֹבָל
  choice: Shobal
  rationale: Transcription française lisible du nom propre hébreu.
- source_word: צִבְעוֹן
  choice: Tsibéon
  rationale: Transcription française qui rend צ par « ts » et conserve une forme naturelle pour le lectorat francophone.
- source_word: עֲנָה
  choice: Ana
  rationale: Transcription française simple du nom propre.
- source_word: דִישֹׁן
  choice: Dishôn
  rationale: Transcription qui distingue ce nom de דִישָׁן, « Dishân », mentionné à la fin du verset.
- source_word: אֵצֶר
  choice: Étser
  rationale: Transcription française qui rend le צ hébreu par « ts ».
- source_word: דִישָׁן
  choice: Dishân
  rationale: La vocalisation est conservée afin de distinguer ce nom de דִישֹׁן, « Dishôn ».
