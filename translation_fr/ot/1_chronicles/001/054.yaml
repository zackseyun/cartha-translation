  text: Chief Magdiel[a], chief Iram. These were the chiefs of Edom.
translation:
  language: fr
  text: Le chef Magdiel, le chef Iram. Ce furent les chefs d’Édom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les chefs de clan d’Édom ». Le terme hébreu peut désigner des dirigeants de tribu ou de clan ; certaines traductions anciennes emploient « ducs ».
    reason: alternative_lexicale
lexical_decisions:
- source_word: אַלּוּף
  choice: chef / chefs de clan
  rationale: Dans les listes édomites, אַלּוּף désigne un dirigeant tribal ou clanique. « Chef » garde la brièveté de la liste devant chaque nom, tandis que « chefs de clan » explicite naturellement la fonction dans le résumé.
- source_word: מַגְדִּיאֵל
  choice: Magdiel
  rationale: Nom propre translittéré selon l’usage français courant, sans en traduire le sens possible.
- source_word: עִירָם
  choice: Iram
  rationale: Nom propre translittéré selon l’usage français courant.
- source_word: אֵלֶּה
  choice: Tels furent
  rationale: La proposition hébraïque est sans verbe. « Tels furent » forme en français une conclusion naturelle et rétrospective à la liste.
- source_word: אַלּוּפֵי אֱדוֹם
  choice: les chefs de clan d’Édom
  rationale: Le construit résume les personnages précédents comme dirigeants des groupes claniques d’Édom. Cette formulation précise la valeur contextuelle du titre sans recourir à l’ancien « ducs ».
