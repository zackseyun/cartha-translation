  text: בְּנֵ֥י עֲנָ֖ה דִּישׁ֑וֹן וּ/בְנֵ֣י דִישׁ֔וֹן חַמְרָ֥ן וְ/אֶשְׁבָּ֖ן וְ/יִתְרָ֥ן וּ/כְרָֽןס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/041.yaml
  text: 'The sons of Anah: Dishon. And the sons of Dishon: Hamran[a], Eshban, Ithran, and Keran.'
translation:
  language: fr
  text: 'Les fils d’Ana : Dishôn. Et les fils de Dishôn : Hamrân[a], Eshbân, Yitrân et Kerân.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la généalogie parallèle de Genèse 36.26, on lit « Hemdân » au lieu de « Hamrân ». Le texte principal suit ici le texte massorétique de 1 Chroniques.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Dans cette liste généalogique, le pluriel construit de בֵּן désigne naturellement les fils. Cette formulation suit de près l’hébreu tout en étant idiomatique en français.
- source_word: עֲנָה
  choice: Ana
  rationale: Nom propre transcrit sous une forme française simple et usuelle.
- source_word: דִּישׁוֹן
  choice: Dishôn
  rationale: Le même nom désigne d’abord le fils d’Ana, puis le père des quatre personnes suivantes; une seule graphie est donc conservée. L’accent circonflexe aide à représenter la voyelle longue sans alourdir la lecture.
- source_word: וּבְנֵי
  choice: Et les fils de
  rationale: La conjonction ו est rendue par « Et » afin de préserver l’enchaînement explicite des deux notices généalogiques.
- source_word: חַמְרָן
  choice: Hamrân
  rationale: Le texte massorétique de 1 Chroniques porte חמרן, transcrit « Hamrân ». La forme différente de Genèse 36.26 est signalée en note plutôt que substituée au texte source.
- source_word: אֶשְׁבָּן
  choice: Eshbân
  rationale: Transcription française directe du nom propre hébreu.
- source_word: יִתְרָן
  choice: Yitrân
  rationale: La graphie avec Y représente directement la consonne initiale hébraïque yod et reste naturelle pour un lecteur francophone.
- source_word: כְרָן
  choice: Kerân
  rationale: Transcription française directe du nom propre; la conjonction hébraïque préfixée est rendue par « et » devant le dernier élément de l’énumération.
