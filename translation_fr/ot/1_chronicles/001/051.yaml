  text: וַ/יָּ֖מָת הֲדָ֑ד וַ/יִּהְיוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עליה אַלּ֥וּף יְתֵֽתס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/051.yaml
  text: 'Hadad died[a], and the chiefs of Edom were: Chief Timna, Chief Aliah[c][b], Chief Jetheth.'
translation:
  language: fr
  text: 'Hadad mourut, et voici quels furent les chefs[a] d’Édom : le chef Timna, le chef Alia[b] et le chef Yeteth.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, le mot traduit par « chefs » désigne des chefs de clan ou de groupe tribal édomites. Certaines traductions anciennes emploient « ducs ».
    reason: lexical_alternative
  - marker: b
    text: Dans le passage parallèle, Genèse 36.40 porte le nom « Alva » ; le texte des Chroniques porte ici « Alia ».
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le wayyiqtol de מות poursuit le récit et se rend naturellement au passé simple dans ce contexte généalogique.
- source_word: הֲדָד
  choice: Hadad
  rationale: Translittération française usuelle du nom propre.
- source_word: וַיִּהְיוּ
  choice: et voici quels furent
  rationale: Cette formulation française introduit naturellement la liste tout en conservant la succession narrative et la valeur copulative de היה.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: chefs / le chef
  rationale: Dans les listes édomites, אַלּוּף désigne un responsable de clan ou de groupe tribal. « Chef » est clair, actuel et préserve la répétition du titre devant chaque nom.
- source_word: אֱדוֹם
  choice: Édom
  rationale: Forme française traditionnelle du nom géographique et ethnique.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Translittération concise et proche de la forme hébraïque.
- source_word: עליה
  choice: Alia
  rationale: La forme propre au texte des Chroniques est translittérée sans la remplacer par celle du passage parallèle de la Genèse.
- source_word: יְתֵת
  choice: Yeteth
  rationale: Translittération française du nom hébreu, avec yod initial rendu par « Y » et les deux consonnes finales conservées.
