lexical_decisions:
- source_word: קֵינָן
  choice: Kénan
  rationale: Nom propre transcrit directement d’après l’hébreu, avec des accents adaptés à la lecture française. « Kénan » est clair et déjà bien attesté en français.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Nom propre translittéré plutôt que traduit. Cette forme rend sobrement la forme hébraïque et évite d’ajouter une voyelle longue issue de traditions de transcription secondaires.
- source_word: יָרֶד
  choice: Yéred
  rationale: La forme « Yéred » représente directement l’initiale et les voyelles de l’hébreu יָרֶד. Le traditionnel « Jéred » demeure signalé en note pour faciliter la reconnaissance du nom.
