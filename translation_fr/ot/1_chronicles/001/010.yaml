  yaml_path: translation/ot/1_chronicles/001/010.yaml
  text: And Cush fathered Nimrod[a]; he began to be a mighty one in the land.
translation:
  language: fr
  text: Koush engendra Nimrod. Celui-ci commença à être un homme puissant dans le pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la terre ». Le mot hébreu אֶרֶץ peut désigner un pays ou la terre.
    reason: Alternative lexicale reflétant l’ambiguïté réelle de אֶרֶץ.
lexical_decisions:
- source_word: וְכ֖וּשׁ
  choice: Koush
  rationale: La conjonction relie simplement cette notice à la généalogie précédente et peut rester implicite en français. Le nom כּוּשׁ est rendu selon sa forme française courante, « Koush ».
- source_word: יָלַד
  choice: engendra
  rationale: Dans une généalogie, ילד exprime ici la paternité. « Engendra » est concis, précis et appartient au registre généalogique biblique sans être obscur.
- source_word: נִמְר֑וֹד
  choice: Nimrod
  rationale: Transcription française usuelle du nom propre.
- source_word: הוּא
  choice: Celui-ci
  rationale: Le pronom indépendant reprend Nimrod avec une légère mise en relief. « Celui-ci » rend clairement cette reprise en français.
- source_word: הֵחֵל לִהְיוֹת
  choice: commença à devenir
  rationale: הֵחֵל signifie « commencer » et לִהְיוֹת « être/devenir ». Dans ce contexte, « commença à devenir » est plus naturel en français que « commença à être », tout en conservant l'aspect progressif de la construction.
- source_word: גִּבּוֹר
  choice: un homme puissant
  rationale: גִּבּוֹר désigne une personne forte ou puissante, parfois un guerrier ou un héros. Le contexte n'étant pas explicitement militaire, « un homme puissant » garde le sens général sans le restreindre.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ peut désigner un pays, un territoire ou la terre entière. « Dans le pays » retient ici la portée locale sans exclure l'autre lecture, signalée en note.
theological_decisions:
- issue: Portée de בָּאָרֶץ dans la description de Nimrod
  choice: dans le pays
  alternative: sur la terre
  rationale: Le nom אֶרֶץ permet aussi bien une référence territoriale qu'une référence à toute la terre. Le verset ne tranche pas explicitement; la lecture plus vaste est donc conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le style concis d'une notice généalogique; « engendra » est retenu comme terme généalogique précis, et la répétition hébraïque est rendue par deux phrases naturelles.
