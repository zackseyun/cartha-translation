  verdict: revise
  source_fidelity: 'La notice généalogique est globalement fidèle : « engendra », « Nimrod », « homme puissant » et « dans le pays » rendent sobrement les éléments hébreux. Toutefois, « commença à devenir » ne correspond pas avec assez de précision à הֵחֵל לִהְיוֹת (« commença à être ») : « devenir » ajoute une nuance de changement d’état qui n’est pas exprimée par l’infinitif להיות.'
  naturalness: « Koush engendra Nimrod » est concis et approprié au registre généalogique. « Celui-ci commença à être un homme puissant » est un peu littéral, mais demeure grammatical, compréhensible et reflète utilement la construction hébraïque. Il est préférable à la formulation lourde et sémantiquement déplacée « commença à devenir ».
  terminology: « Koush », « engendra », « Nimrod » et « homme puissant » conviennent au français biblique moderne. La note conserve correctement l’alternative légitime de portée pour אֶרֶץ. L’ancre [a] est placée sur « pays », le mot concerné.
  issues:
