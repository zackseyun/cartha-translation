    issue: « commença à devenir » pour הֵחֵל לִהְיוֹת
    rationale: Le verbe hébreu היה à l’infinitif signifie ici « être ». Rendre l’ensemble par « commença à devenir » introduit une notion de transformation que le texte ne formule pas et produit une expression française peu naturelle. « Commença à être » conserve la construction et son caractère possiblement ingressive sans surinterprétation.
  revised_text: Koush engendra Nimrod. Celui-ci commença à être un homme puissant dans le pays[a].
  revised_footnotes:
