  rationale: Nom propre rendu selon sa forme française biblique usuelle.
- source_word: וְ/יִשְׁמָעֵאל
  choice: et Ismaël
  rationale: La conjonction simple וְ est rendue par « et », suivie de la forme française usuelle du nom propre.
