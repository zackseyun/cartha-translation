- source_word: וָ/קֵדְמָה
  choice: et Qedma
  rationale: La conjonction ו est rendue par « et » ; le nom propre est transcrit « Qedma », forme proche de l’hébreu et distinguant ק de כּ.
- source_word: אֵלֶּה הֵם
  choice: Tels furent
  rationale: Rend naturellement en français la proposition nominale d’identification récapitulative, dans le cadre passé de la généalogie.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le terme désigne ici les fils mâles d’Ismaël énumérés dans la généalogie ; la traduction littérale convient au contexte.
- source_word: יִשְׁמָעֵאל
  choice: Ismaël
  rationale: Forme française biblique conventionnelle du nom propre.
