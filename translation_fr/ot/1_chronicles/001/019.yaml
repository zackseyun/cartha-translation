source:
  edition: WLC
  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/019.yaml
  text: 'And to Eber were born two sons: the name of the one was Peleg[a], because in his days the earth was divided; and his brother’s name was Joktan.'
translation:
  language: fr
  text: 'Éber eut deux fils : l’un s’appelait Péleg[a], car de son temps la terre fut divisée ; son frère s’appelait Yoqtân.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays fut divisé ». Le mot hébreu peut désigner la terre entière aussi bien qu’un pays ou un territoire ; le texte ne précise pas la nature de cette division.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר יֻלַּד שְׁנֵי בָנִים
  choice: Éber eut deux fils
  rationale: Cette formulation française naturelle rend la naissance de deux fils à Éber sans reproduire lourdement le passif hébreu.
- source_word: שֵׁם הָאֶחָד
  choice: l’un s’appelait
  rationale: Rend idiomatiquement « le nom de l’un » sans interpréter הָאֶחָד comme « le premier ».
- source_word: פֶּלֶג
  choice: Péleg
  rationale: Translittération française usuelle du nom propre, avec accent pour guider la prononciation.
- source_word: כִּי בְיָמָיו
  choice: car de son temps
  rationale: כִּי introduit ici l’explication du nom ; « de son temps » est une expression française naturelle correspondant à « durant ses jours ».
- source_word: נִפְלְגָה הָאָרֶץ
  choice: la terre fut divisée
  rationale: Le passif et l’idée de division sont conservés. « Terre » garde la portée large de הָאָרֶץ, tandis qu’une note signale son autre sens possible.
- source_word: וְשֵׁם אָחִיו
  choice: son frère s’appelait
  rationale: Formulation française fluide qui conserve la relation fraternelle et la symétrie de la phrase.
- source_word: יָקְטָן
  choice: Yoqtân
  rationale: Translittération française du nom hébreu, distinguant la consonne initiale yod et la consonne qoph.
theological_decisions:
- issue: Nature de la division évoquée au temps de Péleg
  choice: Conserver « la terre fut divisée » sans préciser la nature de cette division.
  alternative: « le pays fut divisé », ou expliciter une division des peuples, des langues ou des territoires
  rationale: Le texte hébreu ne précise ni l’étendue ni la nature de la division. La traduction préserve donc cette ambiguïté au lieu d’imposer une interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe généalogique est rendue avec naturel, tout en maintenant l’ambiguïté de הָאָרֶץ et le lien explicatif entre le nom de Péleg et la division.
