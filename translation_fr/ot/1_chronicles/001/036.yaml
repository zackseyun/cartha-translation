source:
  edition: WLC
  text: בְּנֵ֖י אֱלִיפָ֑ז תֵּימָ֤ן וְ/אוֹמָר֙ צְפִ֣י וְ/גַעְתָּ֔ם קְנַ֖ז וְ/תִמְנָ֥ע וַ/עֲמָלֵֽק׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/036.yaml
  text: 'The sons of Eliphaz: Teman[a], Omar, Zephi, Gatam, Kenaz, Timna[b], and Amalek.'
translation:
  language: fr
  text: 'Les fils d’Éliphaz : Témân, Omar, Tsephi[a], Gatam, Qenaz, Timna[b] et Amalec.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici Tsephi ; en Genèse 36.11, le nom apparaît sous la forme Tsepho.
    reason: textual_variant
  - marker: b
    text: Genèse 36.12 présente Timna comme la concubine d’Éliphaz et Amalec comme leur fils. Ici, le livre des Chroniques place les deux noms dans la liste introduite par « Les fils d’Éliphaz ».
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Pluriel construit de בֵּן introduisant une liste généalogique. « Les fils de » est ici plus précis que « les descendants de ».
- source_word: אֱלִיפָז
  choice: Éliphaz
  rationale: Translittération française usuelle du nom propre.
- source_word: תֵּימָן
  choice: Témân
  rationale: Translittération française du nom propre, distinguant les deux voyelles longues du texte massorétique.
- source_word: אוֹמָר
  choice: Omar
  rationale: Translittération directe du nom propre.
- source_word: צְפִי
  choice: Tsephi
  rationale: Reproduit la forme propre à ce verset, צְפִי, sans l’harmoniser avec la forme צְפוֹ de Genèse 36.11.
- source_word: גַעְתָּם
  choice: Gatam
  rationale: Translittération française lisible du nom propre.
- source_word: קְנַז
  choice: Qenaz
  rationale: Le q rend distinctement la consonne hébraïque qof, selon une translittération française courante des noms bibliques.
- source_word: תִמְנָע
  choice: Timna
  rationale: Translittération de la forme vocalisée dans ce verset; le nom est conservé dans la liste telle qu’elle se présente en hébreu.
- source_word: עֲמָלֵק
  choice: Amalec
  rationale: Forme française établie du nom propre et ancestral.
- source_word: וְ / וַ
  choice: virgules, puis « et » avant le dernier nom
  rationale: Cette ponctuation naturelle en français restitue clairement la série coordonnée sans répéter mécaniquement la conjonction hébraïque.
theological_decisions:
- issue: Rapport généalogique de Timna et d’Amalec par comparaison avec Genèse 36.12
  choice: Présenter Timna et Amalec dans la liste introduite par « Les fils d’Éliphaz », conformément à la syntaxe de Chroniques.
  alternative: Identifier explicitement Timna comme concubine d’Éliphaz et Amalec comme leur fils, en harmonisant le verset avec Genèse 36.12.
  rationale: Le texte hébreu de Chroniques donne une liste simple après « Les fils d’Éliphaz ». La traduction conserve cette formulation et signale en note la tension avec le récit parallèle, sans la résoudre dans le texte principal.
translation_notes:
  register: Français international moderne, sobre et digne. Les noms sont translittérés dans des formes françaises lisibles; la structure concise de la généalogie est conservée. Les appels de note sont placés sur les noms auxquels leurs explications se rapportent.
