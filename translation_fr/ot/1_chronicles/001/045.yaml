  text: וַ/יָּ֖מָת יוֹבָ֑ב וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו חוּשָׁ֖ם מֵ/אֶ֥רֶץ הַ/תֵּימָנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/045.yaml
  text: And Yobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: fr
  text: Yobab[a] mourut, et Housham, du pays des Témanites[b], régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « Jobab ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de la région de Témân » ou « du pays du Témanite ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le wayyiqtol de מות fait avancer le récit. Le français emploie naturellement le passé simple dans cette formule généalogique et royale.
- source_word: יוֹבָב
  choice: Yobab
  rationale: Cette translittération rend directement la forme hébraïque יוֹבָב; « Jobab » est la forme française traditionnelle.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans cette formule de succession, מלך indique que Housham accéda à la royauté et régna; « régna » garde la concision de l’hébreu.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans un contexte de succession, תחת avec suffixe exprime le remplacement direct; « à sa place » est naturel et précis.
- source_word: חוּשָׁם
  choice: Housham
  rationale: Translittération française lisible du nom hébreu חוּשָׁם, avec « ou » pour la voyelle /u/ et « sh » pour שׁ.
- source_word: מֵאֶרֶץ
  choice: du pays de
  rationale: מן avec אֶרֶץ indique l’origine géographique. « Du pays de » rend cette provenance en français naturel.
- source_word: הַתֵּימָנִי
  choice: des Témanites
  rationale: Le terme peut être compris comme un gentilé collectif après « pays »; le pluriel français donne une formulation naturelle sans supprimer les autres analyses possibles, signalées en note.
