lexical_decisions:
- source_word: אַלּוּף
  choice: chef
  rationale: Dans les listes édomites, ce terme désigne un dirigeant tribal ou clanique. « Chef » est naturel, concis et convient à la forme de la liste, sans recourir à l’archaïque « duc ».
- source_word: קְנַז
  choice: Quenaz
  rationale: Nom propre translittéré selon une forme française biblique courante.
- source_word: תֵּימָן
  choice: Témân
  rationale: Le terme fonctionne ici comme un nom propre dans la liste des chefs édomites; il est donc translittéré plutôt qu’interprété comme le nom d’une région.
- source_word: מִבְצָר
  choice: Mibtsar
  rationale: Nom propre translittéré; « ts » représente de manière accessible la consonne hébraïque צ.
