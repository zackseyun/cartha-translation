  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le pluriel construit signifie littéralement « les fils de ». La formulation massorétique est conservée malgré la difficulté et n’est pas harmonisée avec la liste parallèle de 2 Samuel 23.
- source_word: הָשֵׁם
  choice: Hashem
  rationale: Nom propre translittéré selon une forme française lisible, sans le confondre avec l’expression hébraïque courante employée pour désigner le nom divin.
- source_word: הַגִּזוֹנִי
  choice: le Guizonite
  rationale: Gentilé ou désignation d’origine avec article ; la terminaison française « -ite » et la graphie « Gui- » rendent naturellement la consonne dure devant i.
- source_word: יוֹנָתָן
  choice: Jonathan
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: בֶּן
  choice: fils de
  rationale: Le singulier construit introduit la filiation dans cette liste de noms.
- source_word: שָׁגֵה
  choice: Shagué
  rationale: Translittération adaptée au français, avec « gu » pour préserver la consonne dure et « é » pour la voyelle finale.
- source_word: הַהֲרָרִי
  choice: le Hararite
  rationale: Gentilé ou désignation d’origine avec article, rendu selon le modèle français courant en « -ite ».
