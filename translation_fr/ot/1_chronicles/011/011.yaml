  text: וְ/אֵ֛לֶּה מִסְפַּ֥ר הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑יד יָשָׁבְעָ֣ם בֶּן חַכְמוֹנִ֗י רֹ֚אשׁ ה/שלושים הֽוּא עוֹרֵ֧ר אֶת חֲנִית֛/וֹ עַל שְׁלֹשׁ מֵא֥וֹת חָלָ֖ל בְּ/פַ֥עַם אֶחָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/011.yaml
  text: 'And these are the number of David’s mighty men: Jashobeam son of Hachmoni[a], the chief of the Thirty; he wielded his spear against three hundred slain in one encounter.'
translation:
  language: fr
  text: 'Voici la liste des vaillants guerriers de David : Yashobéam, fils de Hakmoni, chef des Trente. Il brandit sa lance[a] contre trois cents hommes, qu’il tua en une seule fois.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leva sa lance » ou « mania sa lance ». Le verbe hébreu peut signifier « éveiller » ou « susciter »; dans ce contexte militaire, les traductions varient entre « lever », « brandir » et « manier » la lance.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: la liste
  rationale: Le sens premier est « nombre, dénombrement », mais le mot introduit ici un relevé nominatif. « La liste » exprime naturellement cette fonction en français moderne sans laisser entendre que le verset va seulement donner un total.
- source_word: הַגִּבֹּרִים
  choice: les vaillants guerriers
  rationale: גִּבּוֹר désigne ici des hommes remarquables par leur force et leurs exploits militaires. « Vaillants guerriers » conserve à la fois la valeur héroïque et le contexte militaire.
- source_word: אֲשֶׁר לְדָוִיד
  choice: de David
  rationale: Le ל marque ici l’appartenance ou l’association. Le complément « de David » est la formulation française la plus directe.
- source_word: יָשָׁבְעָם בֶּן חַכְמוֹנִי
  choice: Yashobéam, fils de Hakmoni
  rationale: Les noms sont translittérés et la filiation explicite introduite par בֶּן est conservée.
- source_word: רֹאשׁ הַשלושים
  choice: chef des Trente
  rationale: רֹאשׁ exprime le rang de chef. « Les Trente » est traité comme la désignation traditionnelle du groupe d’élite.
- source_word: עוֹרֵר אֶת חֲנִיתוֹ
  choice: Il brandit sa lance
  rationale: Le verbe עורר signifie fondamentalement « éveiller, mettre en mouvement ». Avec une lance dans un contexte guerrier, « brandir » rend de façon naturelle l’action martiale tout en laissant en note d’autres nuances possibles.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: contre trois cents hommes, qu’il tua
  rationale: עַל indique l’action dirigée contre des adversaires, et חָלָל désigne des hommes tués, souvent transpercés. La proposition relative donne un français clair sans atténuer l’issue mortelle.
- source_word: בְּפַעַם אֶחָת
  choice: en une seule fois
  rationale: Cette expression désigne une seule occasion ou un seul épisode. La traduction reste proche de l’hébreu sans suggérer, comme « d’un seul coup », un unique mouvement physique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. « Vaillants guerriers » garde la dignité du vocabulaire héroïque biblique, tandis que « la liste » évite la tournure peu naturelle « le nombre des guerriers ». Les noms propres suivent une translittération française lisible.
