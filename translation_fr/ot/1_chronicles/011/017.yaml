base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/017.yaml
  text: And David longed and said[b][a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: fr
  text: 'David éprouva un vif désir et dit : « Qui[a] me donnera à boire de l’eau du puits[b] de Bethléem qui est à la porte ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi rendre cette parole de manière plus idiomatique : « Si seulement quelqu’un me donnait à boire de l’eau du puits de Bethléem qui est à la porte ! »'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « puits » peut aussi désigner une citerne ou une fosse. Dans ce contexte, il désigne vraisemblablement un point d’eau.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתאו
  choice: fut saisi d’un vif désir
  rationale: Le verbe au hitpael exprime un désir intense. Cette formulation naturelle en français conserve cette intensité sans ajouter l’idée d’un besoin physique.
- source_word: מי
  choice: Qui me donnera
  rationale: L’interrogatif introduit littéralement une question qui exprime ici un souhait. La traduction garde cette forme plutôt que de la remplacer dans le texte par « Si seulement quelqu’un… ».
- source_word: ישקני מים
  choice: me donnera à boire de l’eau
  rationale: Le hifil de שקה signifie « donner à boire »; la formulation conserve aussi la mention explicite de l’eau.
- source_word: מבּור
  choice: du puits
  rationale: בור peut désigner un puits, une citerne ou une fosse. Dans ce contexte, il s’agit d’une source connue d’eau potable; « puits » est donc le choix contextuel le plus clair.
- source_word: בית לחם
  choice: Bethléem
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: אשר בשער
  choice: qui est près de la porte
  rationale: La proposition relative situe le puits par rapport à la porte de la ville. « Près de la porte » est clair et naturel, tout en préservant la relation spatiale sans la préciser excessivement.
