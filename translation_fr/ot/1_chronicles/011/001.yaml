  yaml_path: translation/ot/1_chronicles/011/001.yaml
  text: Then all Israel gathered to David at Hebron, saying, “Look, we are your bone and your flesh.”
translation:
  language: fr
  text: 'Alors tout Israël se rassembla auprès de David à Hébron et lui dit : « Voici : nous sommes de tes os et de ta chair. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: se rassembla
  rationale: Le verbe exprime le rassemblement; l’accord au singulier avec « tout Israël » est naturel en français.
- source_word: אֶל־דָּוִיד
  choice: auprès de David
  rationale: Rend le mouvement vers David sans suggérer seulement une destination géographique.
- source_word: לֵאמֹר
  choice: et lui dit
  rationale: Formulation française naturelle pour introduire les paroles; « tout Israël » est traité comme un collectif singulier.
- source_word: הִנֵּה
  choice: '[non rendu séparément]'
  rationale: Dans cette déclaration identitaire, la valeur présentative est naturellement portée en français par l’énoncé direct; « voici » serait plus raide.
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: de tes os et de ta chair
  rationale: Conserve l’image idiomatique hébraïque de parenté et de solidarité, ainsi que les possessifs de deuxième personne.
theological_decisions:
- issue: Portée de « tout Israël »
  choice: Conserver « tout Israël »
  alternative: « tous les Israélites »
  rationale: Le texte présente Israël comme une collectivité politique et familiale; la formulation littérale maintient cette portée sans la préciser davantage.
- issue: Image de parenté
  choice: « de tes os et de ta chair »
  alternative: « de ta famille » / « du même sang que toi »
  rationale: La métaphore biblique est théologiquement et intertextuellement significative; l’expliciter réduirait sa richesse et résoudrait son sens de façon indue.
translation_notes:
  register: Français international moderne, digne et lisible. La métaphore hébraïque est volontairement conservée. Le présent français « nous sommes » rend l’énoncé nominal hébreu.
