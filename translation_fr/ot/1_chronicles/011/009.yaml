  text: וַ/יֵּ֥לֶךְ דָּוִ֖יד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֥ה צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/009.yaml
  text: And David became greater and greater[a], and Yahweh of hosts was with him.
translation:
  language: fr
  text: David devenait de plus en plus grand[a], et Yahweh des armées était avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « David allait, allant et devenant grand » ; cette tournure hébraïque indique qu’il devenait progressivement de plus en plus grand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדוֹל
  choice: devenait de plus en plus puissant
  rationale: La construction idiomatique, qui associe le verbe « aller » à un infinitif absolu et à « grand », exprime une progression continue. En contexte royal et militaire, « puissant » rend naturellement la grandeur croissante de David sans suggérer un déplacement physique.
- source_word: דָּוִיד
  choice: David
  rationale: Forme française conventionnelle du nom propre.
- source_word: וַיהוָה צְבָאוֹת
  choice: et Yahweh des armées
  rationale: Le tétragramme est rendu par « Yahweh ». « Des armées » conserve l’image concrète de צְבָאוֹת et forme en français un titre divin intelligible.
- source_word: עִמּוֹ
  choice: était avec lui
  rationale: Rend directement l’idée de présence et d’accompagnement exprimée par עִם avec le suffixe pronominal.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le nom divin; sa translittération préserve cette distinction.
- issue: Relation entre la grandeur de David et la présence divine
  choice: et
  alternative: car
  rationale: Le waw hébreu coordonne les deux propositions. « Et » préserve la relation sans imposer une causalité que le verset ne marque pas explicitement.
- issue: Sens du titre צְבָאוֹת
  choice: des armées
  alternative: tout-puissant
  rationale: La traduction concrète conserve l’imagerie du titre hébreu, tandis que « tout-puissant » en donnerait une interprétation théologique plus générale.
translation_notes:
  register: Français international moderne, clair et digne. La formulation progressive est idiomatique; le titre divin conserve son image militaire sans archaïsme inutile.
