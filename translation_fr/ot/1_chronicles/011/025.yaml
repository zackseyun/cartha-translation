  text: Among the Thirty[a], he was indeed honored, but he did not attain to the Three[b]; and David appointed him over his bodyguard.
translation:
  language: fr
  text: Il était certes plus honoré que les Trente[a], mais il n’atteignit pas le rang des Trois. David le plaça à la tête de sa garde personnelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Parmi les Trente, il était certes honoré. » La préposition hébraïque peut être comprise dans un sens comparatif ou partitif.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de sa garde » ou « de ceux qui étaient sous son commandement ». Le terme hébreu peut désigner une garde ou, plus largement, un groupe ou une charge relevant de l’autorité de David.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשִׁים
  choice: plus honoré que les Trente
  rationale: מִן devant le nom du groupe se comprend naturellement ici dans un sens comparatif, en parallèle avec la précision selon laquelle il n’atteignit pas le rang des Trois. La note conserve néanmoins la lecture partitive possible.
- source_word: הִנּוֹ נִכְבָּד הוּא
  choice: il était plus honoré
  rationale: נִכְבָּד exprime ici l’honneur ou la considération attachés au rang. En français, la tournure comparative porte suffisamment l’emphase de הִנּוֹ sans recourir à un « voici » peu naturel.
- source_word: וְאֶל הַשְּׁלוֹשָׁה לֹא בָא
  choice: mais il n’atteignit pas le rang des Trois
  rationale: Le verbe בוא avec אֶל est employé idiomatiquement pour l’accès à un niveau ou à un rang. La mention du « rang » rend ce sens clair sans faire des Trois autre chose que le groupe d’élite désigné par le texte.
- source_word: וַיְשִׂימֵהוּ דָוִיד
  choice: David le plaça à la tête de
  rationale: Dans ce contexte militaire, שׂים décrit l’affectation à une responsabilité. « Placer à la tête de » rend à la fois l’acte de nomination et la construction avec עַל.
- source_word: עַל מִשְׁמַעְתּוֹ
  choice: à la tête de sa garde personnelle
  rationale: מִשְׁמַעַת peut désigner une garde ou un corps placé sous autorité. « Garde personnelle » convient au cadre royal, tandis que la note signale l’étendue sémantique possible.
