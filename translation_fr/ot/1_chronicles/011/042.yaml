base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/042.yaml
  text: Adina son of Shiza the Reubenite[a], a chief of the Reubenites, and with him were thirty.
translation:
  language: fr
  text: Adina, fils de Shiza, le Rubénite, chef des Rubénites ; trente hommes étaient avec lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et sur lui [étaient] trente ». Dans cette liste militaire, l’expression signifie probablement que trente hommes lui étaient rattachés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדִינָא
  choice: Adina
  rationale: Nom propre translittéré de manière simple et conforme à sa forme hébraïque.
- source_word: בֶן
  choice: fils de
  rationale: Dans cette liste de guerriers, le terme indique naturellement la filiation directe.
- source_word: שִׁיזָא
  choice: Shiza
  rationale: Nom propre translittéré sans en proposer une traduction.
- source_word: הָרְאוּבֵנִי
  choice: le Rubénite
  rationale: Le gentilé avec article désigne l’appartenance d’Adina à la tribu de Ruben.
- source_word: רֹאשׁ
  choice: chef
  rationale: Dans ce contexte de liste militaire, le mot exprime une fonction de direction, et non le sens anatomique de « tête ».
- source_word: לָרְאוּבֵנִי
  choice: des Rubénites
  rationale: La préposition marque ici le groupe sur lequel s’exerce cette direction ; « chef des Rubénites » est naturel en français.
- source_word: וְעָלָיו
  choice: étaient avec lui
  rationale: Littéralement « sur lui » ou « au-dessus de lui » ; dans cette liste militaire, l’expression indique probablement que des hommes lui étaient rattachés ou l’accompagnaient.
- source_word: שְׁלוֹשִׁים
  choice: trente hommes
  rationale: Le nombre est explicite, tandis que « hommes » est sous-entendu par le contexte militaire et nécessaire à une formulation française naturelle.
