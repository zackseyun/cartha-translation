  text: Sibbecai the Hushathite[a], Ilai the Ahohite.
translation:
  language: fr
  text: Sibbecaï, le Houshatite[a] ; Ilaï, l’Ahohite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines traductions ont « Iraï » ici, sous l’influence du passage parallèle en 2 Samuel 23.26. Le texte hébreu de 1 Chroniques 11.29 porte « Ilaï ».
    reason: alternative_reading
lexical_decisions:
- source_word: סִבְּכַי
  choice: Sibbecaï
  rationale: Nom propre transcrit d’après l’hébreu, avec un tréma qui rend immédiatement lisible en français la séparation des voyelles finales.
- source_word: הַחֻשָׁתִי
  choice: le Houshatite
  rationale: Désignation d’origine ou de clan munie de l’article ; cette transcription conserve le lien avec le nom hébreu sous-jacent tout en suivant les habitudes phonétiques du français.
- source_word: עִילַי
  choice: Ilaï
  rationale: Le texte hébreu de 1 Chroniques porte bien Ilaï ; la transcription française maintient cette forme sans l’harmoniser avec le passage parallèle.
- source_word: הָאֲחוֹחִי
  choice: l’Ahohite
  rationale: Désignation de clan munie de l’article, transcrite sous une forme naturelle et reconnaissable en français.
