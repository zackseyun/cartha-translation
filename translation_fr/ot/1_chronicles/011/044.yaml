base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/044.yaml
  text: Uzzia the Ashterathite[a], Shama and Jeiel[b], the sons of Hotham the Aroerite.
translation:
  language: fr
  text: Ouzzia l’Ashtératite[a], Shama et Yeouel[b], fils de Hotam l’Aroérite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Ashtarothite »; ce gentilé désigne probablement un homme originaire d’Ashtaroth ou d’Ashtéroth.
    reason: lexical_alternative
  - marker: b
    text: Une autre lecture donne « Yeïel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזִּיָא
  choice: Ouzzia
  rationale: Transcription française naturelle du nom propre hébreu, sans lui ajouter la finale d’une autre forme du nom.
- source_word: הָעֲשְׁתְּרָתִי
  choice: l’Ashtératite
  rationale: Gentilé formé sur Ashtérath/Ashtaroth; cette forme suit de près la vocalisation hébraïque tout en restant lisible en français.
- source_word: שָׁמָע
  choice: Shama
  rationale: Transcription directe de la forme du nom dans le texte massorétique.
- source_word: ויעואל
  choice: et Yeouel
  rationale: La conjonction est rendue par « et » et le nom est transcrit d’après la forme consonantique fournie; l’autre forme traditionnelle est signalée en note.
- source_word: בְּנֵי
  choice: fils de
  rationale: Le pluriel construit exprime ici la filiation de Shama et de Yeouel; en français, « fils de » convient sans article dans cette liste de noms.
- source_word: חוֹתָם
  choice: Hotam
  rationale: Transcription française directe du nom propre hébreu.
- source_word: הָעֲרֹעֵרִי
  choice: l’Aroérite
  rationale: Gentilé dérivé d’Aroër, rendu selon une formation française naturelle.
