source:
  edition: WLC
  text: גַּם תְּמ֣וֹל גַּם שִׁלְשׁ֗וֹם גַּ֚ם בִּ/הְי֣וֹת שָׁא֣וּל מֶ֔לֶךְ אַתָּ֛ה הַ/מּוֹצִ֥יא וְ/הַ/מֵּבִ֖יא אֶת יִשְׂרָאֵ֑ל וַ/יֹּאמֶר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּה֙ תִּהְיֶ֣ה נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/002.yaml
  text: Even in times past[a], even before, when Saul was king, you were the one who led Israel out and brought them in; and Yahweh your God said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over my people Israel.’
translation:
  language: fr
  text: 'Même autrefois[a], même du temps où Saül était roi, c’était toi qui faisais sortir Israël et l’y faisais rentrer[b]. Yahweh, ton Dieu, t’a dit : « C’est toi qui feras paître mon peuple Israël, et c’est toi qui seras le chef[c] de mon peuple Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « hier et avant-hier », expression hébraïque signifiant « autrefois » ou « par le passé ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « faire sortir et faire rentrer Israël » décrit ici l’exercice de la direction du peuple, notamment lors de ses déplacements et de ses campagnes.
    reason: lexical_alternative
  - marker: c
    text: Ou « dirigeant » ou « prince ». Le mot hébreu n’est pas le terme habituel traduit par « roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם תְּמוֹל גַּם שִׁלְשׁוֹם
  choice: Déjà autrefois
  rationale: L’expression signifie littéralement « hier et avant-hier », mais fonctionne ici comme un idiome désignant le passé. « Déjà autrefois » en restitue naturellement la valeur temporelle et l’insistance.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ
  choice: même quand Saül était roi
  rationale: La construction infinitive introduit une proposition temporelle. Le גַּם qui la précède ajoute ici l’idée de « même ».
- source_word: אַתָּה הַמּוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: c’était toi qui faisais sortir et rentrer Israël
  rationale: La formulation conserve l’image hébraïque des sorties et des retours tout en soulignant, par « c’était toi », le rôle effectif de David à la tête d’Israël.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: אַתָּה תִרְעֶה אֶת עַמִּי אֶת יִשְׂרָאֵל
  choice: C’est toi qui conduiras mon peuple Israël comme un berger
  rationale: Le verbe רעה porte une métaphore pastorale appliquée au gouvernement. Cette formulation la rend clairement en français moderne sans la réduire au simple verbe « gouverner ».
- source_word: נָגִיד
  choice: chef
  rationale: נָגִיד désigne un dirigeant établi sur le peuple sans être le terme ordinaire pour « roi ». « Chef » préserve cette distinction et reste naturel dans ce contexte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom personnel divin. Sa translittération préserve cette donnée sans lui substituer un titre.
- issue: Métaphore royale du berger dans תִרְעֶה
  choice: conduiras mon peuple Israël comme un berger
  alternative: feras paître mon peuple Israël
  rationale: Le choix maintient explicitement l’image du berger tout en évitant qu’en français moderne « faire paître » soit compris comme une simple action d’élevage plutôt que comme une métaphore de direction.
- issue: Portée politique de נָגִיד
  choice: chef
  alternative: prince
  rationale: Le terme évoque l’autorité dirigeante de David, mais il ne s’agit pas du mot מֶלֶךְ, « roi », utilisé pour Saül dans le même verset. « Chef » conserve cette tension lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition emphatique de אַתָּה est rendue par « c’était toi » puis « c’est toi ». Les images hébraïques de la sortie et du retour ainsi que du berger sont conservées, avec une explicitation minimale pour assurer leur intelligibilité.
