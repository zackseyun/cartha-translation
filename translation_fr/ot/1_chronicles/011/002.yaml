    rationale: גַּם תְּמוֹל גַּם שִׁלְשׁוֹם comporte deux occurrences de גַּם. « Déjà autrefois » rend le passé mais efface cette double insistance. « Même autrefois, même du temps où… » la restitue plus nettement en français.
  - severity: medium
    issue: La métaphore verbale de berger est reformulée en comparaison
    rationale: אַתָּה תִרְעֶה signifie littéralement que David « fera paître/bergera » le peuple. « Conduiras ... comme un berger » communique l'idée, mais remplace la prédication métaphorique directe par une comparaison. « Tu feras paître » conserve mieux l'image et la forme.
