id: 1CH.11.8
reference: 1 Chronicles 11:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּ֤בֶן הָ/עִיר֙ מִ/סָּבִ֔יב מִן הַ/מִּלּ֖וֹא וְ/עַד הַ/סָּבִ֑יב וְ/יוֹאָ֕ב יְחַיֶּ֖ה אֶת שְׁאָ֥ר הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/008.yaml
  text: He built the city all around[a], from the Millo even to the surrounding area[b], and Joab restored the rest of the city.
translation:
  language: fr
  text: Il bâtit la ville tout autour, depuis le Millo[a] jusqu’aux alentours, et Joab restaura[b] le reste de la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « Millo » est un lieu ou un ouvrage de Jérusalem dont la nature exacte reste incertaine; il pourrait s’agir de terrasses ou d’un remblai fortifié.
    reason: cultural_note
  - marker: b
    text: Le verbe hébreu signifie littéralement « fit vivre »; ici, il désigne probablement la remise en état ou la revitalisation de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Il bâtit
  rationale: Le qal narratif de בנה exprime simplement l’action de bâtir. Le pronom « Il » reprend naturellement David, sujet du contexte précédent, sans ajouter son nom au texte.
- source_word: הָעִיר
  choice: la ville
  rationale: עִיר désigne ici Jérusalem, appelée la ville de David dans le contexte.
- source_word: מִסָּבִיב
  choice: tout autour
  rationale: Cette expression adverbiale indique que les travaux s’étendaient autour de la ville.
- source_word: מִן הַמִּלּוֹא
  choice: depuis le Millo
  rationale: Le référent exact de מִלּוֹא étant incertain, le terme topographique traditionnel est conservé plutôt que remplacé par une interprétation conjecturale.
- source_word: וְעַד הַסָּבִיב
  choice: jusqu’aux alentours
  rationale: La formulation hébraïque, concise et quelque peu obscure, indique l’étendue des travaux au-delà du Millo ou jusqu’au pourtour. « Aux alentours » en préserve le caractère général sans imposer un élément architectural précis.
- source_word: וְיוֹאָב
  choice: et Joab
  rationale: Le nom propre est rendu sous sa forme française biblique habituelle.
- source_word: יְחַיֶּה
  choice: restaura
  rationale: Le piel de חיה signifie littéralement « faire vivre ». Appliqué à une ville dans ce contexte de construction, il évoque sa remise en état ou sa revitalisation; « restaura » rend naturellement cet emploi figuré.
- source_word: אֶת שְׁאָר הָעִיר
  choice: le reste de la ville
  rationale: שְׁאָר désigne ce qui demeure ou la partie restante; cette expression est naturelle et précise en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Bâtit » conserve la simplicité du récit, tandis que « restaura » rend l’image hébraïque de manière intelligible. La formulation légèrement ouverte « jusqu’aux alentours » respecte l’imprécision du syntagme topographique hébreu.
