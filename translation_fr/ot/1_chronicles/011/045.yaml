lexical_decisions:
- source_word: יְדִיעֲאֵל
  choice: Yediaël
  rationale: Nom propre transcrit selon des conventions françaises modernes, en conservant la consonne initiale yod par « Y » et la séparation vocalique par le tréma.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette liste, le sens de filiation immédiate est le plus naturel et la formulation française est transparente.
- source_word: שִׁמְרִי
  choice: Shimri
  rationale: Transcription usuelle et directe du nom propre hébreu.
- source_word: וְיֹחָא
  choice: et Yoha
  rationale: La conjonction est rendue explicitement et le nom propre est transcrit selon une forme française naturelle.
- source_word: אָחִיו
  choice: son frère
  rationale: Le sens ordinaire d’אָח est « frère » ; rien dans ce contexte n’impose le sens élargi de « parent ».
- source_word: הַתִּיצִי
  choice: le Tizite
  rationale: Le gentilé ou nom de clan est transcrit sans préciser une origine géographique ou familiale que le texte ne permet pas d’établir.
