  text: וְ/אַבְשַׁ֣י אֲחִֽי יוֹאָ֗ב ה֤וּא הָיָה֙ רֹ֣אשׁ הַ/שְּׁלוֹשָׁ֔ה וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל ו/לא שֵׁ֖ם בַּ/שְּׁלוֹשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/020.yaml
  text: And Abishai[a], the brother of Joab, was chief of the Three. He brandished his spear against three hundred slain[c][b], and had a name among the Three.
translation:
  language: fr
  text: Abishaï, frère de Joab, était le chef des Trois[a]. Il brandit sa lance contre trois cents hommes, qu’il tua[b], et il se fit un nom parmi les Trois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les Trois ». Dans le passage parallèle (2 Samuel 23.18), certaines traductions rendent différemment le nom de ce groupe en raison de difficultés textuelles et contextuelles concernant « trois » et « trente ».'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « contre trois cents tués ». L’hébreu formule le résultat de l’exploit de manière elliptique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: chef
  rationale: Dans ce contexte militaire, le terme désigne le rang ou la fonction de commandement, non la tête au sens propre.
- source_word: הַשְּׁלוֹשָׁה / בַּשְּׁלוֹשָׁה
  choice: les Trois / parmi les Trois
  rationale: Le texte massorétique porte clairement « les trois ». La traduction conserve cette leçon sans l'harmoniser avec les difficultés textuelles et contextuelles concernant « trois » et « trente » dans les passages parallèles.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: brandit sa lance
  rationale: L'expression évoque littéralement le fait d'éveiller ou de mettre en mouvement la lance. « Brandit » rend naturellement et vivement l'action guerrière.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: contre trois cents hommes, qui furent tués
  rationale: חָלָל désigne une personne tuée ou transpercée. Cette formulation française exprime le résultat de l'exploit tout en évitant d'ajouter explicitement qu'Abishaï les tua tous de sa propre main, lien que l'hébreu laisse implicite.
- source_word: שֵׁם
  choice: se fit un nom
  rationale: Cette expression française naturelle conserve l'image hébraïque du « nom » tout en communiquant l'idée de renommée acquise.
- source_word: אַבְשַׁי
  choice: Abishaï
  rationale: Translittération française usuelle du nom personnel hébreu.
- source_word: אֲחִי יוֹאָב
  choice: frère de Joab
  rationale: Rendu direct et naturel de la construction hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve « les Trois », conformément à l'hébreu massorétique, et maintient dans une note l'ambiguïté de la formulation relative aux trois cents morts.
