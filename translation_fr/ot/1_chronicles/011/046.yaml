  text: Eliel the Mahavite[a], and Jeribai and Joshaviah, the sons of Elnaam[b], and Ithmah the Moabite.
translation:
  language: fr
  text: Éliel, le Mahavite[a], Yeribaï et Yoshavia, fils d’Elnaam, et Yitma, le Moabite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « le Mahavite »; le lieu ou le clan auquel cette désignation renvoie exactement est incertain.'
    reason: cultural_note
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: Éliel
  rationale: Nom propre transcrit selon les usages français, avec des accents qui en facilitent la lecture.
- source_word: הַמַּחֲוִים
  choice: le Mahavite
  rationale: Désignation d’origine incertaine; une transcription préserve la forme hébraïque sans identifier abusivement un lieu ou un clan précis.
- source_word: וִירִיבַי
  choice: Yeribaï
  rationale: Nom propre transcrit directement depuis l’hébreu; le tréma signale que la finale se prononce séparément.
- source_word: וְיוֹשַׁוְיָה
  choice: Yoshavia
  rationale: Nom propre transcrit de manière lisible en français, avec « sh » pour שׁ.
- source_word: בְּנֵי
  choice: fils de
  rationale: Le pluriel construit rattache Yeribaï et Yoshavia à Elnaam; le français n’exige pas d’article dans cette apposition.
- source_word: אֶלְנָעַם
  choice: Elnaam
  rationale: Nom propre transcrit sans traduire son étymologie.
- source_word: וְיִתְמָה
  choice: Yitma
  rationale: Transcription française proche de la forme hébraïque, avec « y » pour le yod initial et « t » pour le tav non spirantisé.
- source_word: הַמּוֹאָבִי
  choice: le Moabite
  rationale: Le gentilé défini sert d’épithète identificatrice; l’article hébreu est conservé naturellement en français.
