  text: Parmi les vaillants guerriers, il y avait Asaël, frère de Joab, et Elhanân, fils de Dodo, de Bethléem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגִבּוֹרֵי הַחֲיָלִים
  choice: Parmi les vaillants guerriers, il y avait
  rationale: L’expression désigne des combattants d’élite reconnus pour leur bravoure. Cette formulation française introduit naturellement la suite de la liste, bien que le verbe soit sous-entendu en hébreu.
- source_word: עֲשָׂה אֵל
  choice: Asaël
  rationale: Transcription française usuelle du nom propre עֲשָׂה־אֵל.
- source_word: אֲחִי יוֹאָב
  choice: frère de Joab
  rationale: Rend directement la relation exprimée par la construction hébraïque, sans article superflu en français.
- source_word: אֶלְחָנָן
  choice: Elhanân
  rationale: Transcription française du nom propre, avec accent circonflexe pour guider la prononciation et distinguer les syllabes finales.
- source_word: בֶּן דּוֹדוֹ
  choice: fils de Dodo
  rationale: La formule généalogique est rendue directement; Dodo est ici un nom propre.
- source_word: מִבֵּית לָחֶם
  choice: de Bethléem
  rationale: La préposition מִן indique ici l’origine géographique. « De Bethléem » conserve simplement la formulation hébraïque sans la transformer en gentilé.
