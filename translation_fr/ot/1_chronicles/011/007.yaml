source:
  edition: WLC
  text: וַ/יֵּ֥שֶׁב דָּוִ֖יד בַּ/מְצָ֑ד עַל כֵּ֥ן קָרְאוּ ל֖/וֹ עִ֥יר דָּוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/007.yaml
  text: David lived in the stronghold[a]; therefore they called it the City of David.
translation:
  language: fr
  text: David s’installa dans la forteresse[a] ; c’est pourquoi on l’appela la Cité de David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « place forte ». Le mot hébreu מְצָד désigne un lieu fortifié.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: s’installa
  rationale: Dans un récit et avec l’indication d’un lieu, ישב signifie habiter ou établir sa résidence. « S’installa » exprime naturellement ici le fait que David prit résidence dans la place conquise.
- source_word: בַּמְצָד
  choice: dans la forteresse
  rationale: מְצָד désigne une place fortifiée servant de position défensive. « Forteresse » est clair et naturel en français moderne, tout en conservant le sens militaire du terme.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: Cette locution introduit la conséquence de l’installation de David dans la forteresse et conserve explicitement le lien causal.
- source_word: קָרְאוּ לוֹ
  choice: on l’appela
  rationale: L’hébreu emploie un verbe actif au pluriel, mais sans sujet nommé. Le pronom indéfini « on » rend cette tournure naturellement en français, et « l’ » renvoie à la forteresse ou au lieu.
- source_word: עִיר דָּוִיד
  choice: la Cité de David
  rationale: Il s’agit d’une désignation géographique consacrée. La majuscule signale son emploi comme nom propre.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et fluide. « S’installa » convient au contexte narratif ; « forteresse » reste accessible tout en préservant la dimension défensive. Le point-virgule maintient nettement le rapport entre l’action et la dénomination du lieu.
