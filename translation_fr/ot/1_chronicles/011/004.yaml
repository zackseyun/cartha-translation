  text: וַ/יֵּ֨לֶךְ דָּוִ֧יד וְ/כָל יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם הִ֣יא יְב֑וּס וְ/שָׁם֙ הַ/יְבוּסִ֔י יֹשְׁבֵ֖י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/004.yaml
  text: Then David and all Israel went to Jerusalem—that is[a], Jebus—where the Jebusites, the inhabitants of the land, were.
translation:
  language: fr
  text: Puis David et tout Israël se rendirent à Jérusalem, c’est-à-dire Jébus. Là se trouvaient les Jébusites[a], les habitants du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le Jébusite » ; le singulier hébreu a ici un sens collectif, d’où « les Jébusites ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Puis … se rendirent
  rationale: Le wayyiqtol fait avancer le récit. « Puis » exprime cette progression narrative, et « se rendre à » traduit naturellement le déplacement vers Jérusalem.
- source_word: וְכָל יִשְׂרָאֵל
  choice: et tout Israël
  rationale: Cette formulation conserve le groupe nominal collectif et présente David et Israël comme les sujets coordonnés du déplacement.
- source_word: יְרוּשָׁלִַם הִיא יְבוּס
  choice: Jérusalem, c’est-à-dire Jebus
  rationale: Le pronom הִיא identifie Jérusalem à Jebus, son ancien nom; la tournure explicative est claire et naturelle en français moderne.
- source_word: וְשָׁם
  choice: Là
  rationale: La valeur littérale « et là » est rendue par une nouvelle phrase brève, qui respecte la structure hébraïque sans alourdir le français.
- source_word: הַיְבוּסִי
  choice: les Jébusites
  rationale: Bien que le gentilé soit morphologiquement au singulier, il a ici un sens collectif, confirmé par le participe pluriel qui suit. Le pluriel français exprime naturellement ce sens.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: les habitants du pays
  rationale: Le participe construit signifie « habitants de ». Dans ce contexte, אָרֶץ désigne le pays ou territoire local habité par les Jébusites, et non la terre entière.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est scindée après « Jebus » pour conserver la valeur locative de וְשָׁם tout en évitant une relative lourde. L’apposition « les habitants du pays » maintient la formulation descriptive du texte hébreu.
