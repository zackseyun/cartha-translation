base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/005.yaml
  text: The inhabitants of Jebus said to David[a], “You will not come in here.” But David captured the stronghold of Zion, that is, the City of David.
translation:
  language: fr
  text: 'Les habitants de Jébus dirent à David : « Tu n’entreras pas ici[a]. » Mais David s’empara de la forteresse de Sion, qui est la Cité de David.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Tu ne viendras pas ici. » On peut aussi comprendre : « Tu ne viendras pas jusqu’ici. » Dans ce contexte, ces paroles expriment un refus de laisser David entrer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי יְבוּס
  choice: les habitants de Jébus
  rationale: Le syntagme construit désigne collectivement ceux qui habitent Jébus. « Les habitants de Jébus » est naturel, précis et actuel en français.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: Tu n’entreras pas ici
  rationale: L’hébreu dit littéralement « tu ne viendras pas ici », mais dans le contexte cette parole constitue un refus d’accès. « Tu n’entreras pas ici » en restitue clairement la portée sans ajouter de motif.
- source_word: וַיִּלְכֹּד
  choice: s’empara de
  rationale: Dans un contexte militaire, לכד exprime la prise d’un lieu. « S’empara de » est idiomatique en français et conserve la force de l’action.
- source_word: מְצֻדַת צִיּוֹן
  choice: la forteresse de Sion
  rationale: מְצוּדָה désigne un ouvrage ou un site défensif. « Forteresse » est clair et convient au contexte militaire.
- source_word: הִיא עִיר דָּוִיד
  choice: qui est la Cité de David
  rationale: La proposition nominale identifie la forteresse de Sion à la Cité de David. « Qui est » conserve la forme d’identification de l’hébreu sans la transformer en glose explicative.
- source_word: עִיר דָּוִיד
  choice: la Cité de David
  rationale: Il s’agit ici d’une désignation géographique établie; la majuscule à « Cité » marque son emploi comme nom propre.
