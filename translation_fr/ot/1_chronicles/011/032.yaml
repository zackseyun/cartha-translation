lexical_decisions:
- source_word: חוּרַי
  choice: Houraï
  rationale: Nom propre transcrit selon des conventions françaises naturelles, le tréma signalant que le a et le i se prononcent séparément.
- source_word: מִנַּחֲלֵי
  choice: des ouadis de
  rationale: Le nom נַחַל peut désigner une vallée, un ravin ou le lit d’un cours d’eau saisonnier. « Ouadis » rend bien cette réalité géographique sans imposer l’idée d’un cours d’eau permanent.
- source_word: גָעַשׁ
  choice: Gaash
  rationale: Nom de lieu transcrit plutôt que traduit.
- source_word: אֲבִיאֵל
  choice: Abiel
  rationale: Nom propre transcrit selon l’usage français courant.
- source_word: הָעַרְבָתִי
  choice: l’Arbathite
  rationale: Le terme est un gentilé indiquant l’origine géographique d’Abiel ; cette forme le conserve sans identifier avec certitude le lieu concerné.
