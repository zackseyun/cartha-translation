  text: Houraï, des ouadis de Gaash[a] ; Abiel, l’Arbathite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des vallées de Gaash » ou « des ravins de Gaash ». Le terme hébreu peut désigner un ouadi, un ravin, le lit d’un torrent ou une vallée.
    reason: lexical_alternative
  - marker: b
    text: '« Arbathite » est un gentilé : il désigne un homme originaire d’Arbath ou d’un lieu peut-être lié à l’Araba.'
