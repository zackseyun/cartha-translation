  text: מַהְרַי֙ הַ/נְּטֹ֣פָתִ֔י חֵ֥לֶד בֶּֽן בַּֽעֲנָ֖ה הַ/נְּטוֹפָתִֽי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/030.yaml
  text: Maharai the Netophathite[a], Heled son of Baanah the Netophathite;
translation:
  language: fr
  text: Maharaï, le Netophatite[a] ; Héled, fils de Baana, le Netophatite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « originaire de Netopha », ici et à la fin du verset.
    reason: Alternative lexicale explicitant le sens du gentilé hébreu.
lexical_decisions:
- source_word: מַהְרַי
  choice: Maharaï
  rationale: Nom propre translittéré en français ; le tréma indique que les voyelles finales se prononcent séparément.
- source_word: הַנְּטֹפָתִי
  choice: le Netophatite
  rationale: Adjectif d’origine muni de l’article, désignant un homme de Netopha. Cette forme concise conserve la structure de l’hébreu ; « originaire de Netopha » reste possible.
- source_word: חֵלֶד
  choice: Héled
  rationale: Nom propre translittéré selon un usage français naturel.
- source_word: בֶּן
  choice: fils de
  rationale: Rendu usuel de la relation filiale dans une liste de noms.
- source_word: בַּעֲנָה
  choice: Baana
  rationale: Nom propre translittéré ; la consonne gutturale médiane n’a pas d’équivalent direct naturel en français.
- source_word: הַנְּטוֹפָתִי
  choice: le Netophatite
  rationale: La répétition du gentilé est conservée, ainsi que son rattachement immédiat à Baana, sans l’attribuer silencieusement à Héled.
