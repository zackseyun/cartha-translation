  text: וַ/יֵּרְד֡וּ שְֽׁלוֹשָׁה֩ מִן הַ/שְּׁלוֹשִׁ֨ים רֹ֤אשׁ עַל הַ/צֻּר֙ אֶל דָּוִ֔יד אֶל מְעָרַ֖ת עֲדֻלָּ֑ם וּ/מַחֲנֵ֣ה פְלִשְׁתִּ֔ים חֹנָ֖ה בְּ/עֵ֥מֶק רְפָאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/015.yaml
  text: Then three of the thirty chiefs went down to the rock[a], to David, at the cave of Adullam, while the camp of the Philistines was encamped in the Valley of Rephaim.
translation:
  language: fr
  text: Puis trois des trente chefs descendirent vers le rocher, auprès de David, à la grotte d’Adoullam, tandis que le camp des Philistins était installé dans la vallée des Rephaïm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: descendirent
  rationale: Le verbe ירד exprime un déplacement vers le bas. Le passé simple convient au récit historique dans un registre français digne et naturel.
- source_word: שְׁלוֹשָׁה מִן־הַשְּׁלוֹשִׁים רֹאשׁ
  choice: trois des trente chefs
  rationale: La formulation conserve l’appartenance des trois au groupe des trente et rend רֹאשׁ comme une indication de rang, sans préciser indûment une fonction militaire.
- source_word: עַל־הַצּוּר
  choice: sur le rocher
  rationale: עַל a ici son sens spatial concret habituel. « Sur le rocher » préserve la topographie et la syntaxe condensée du texte hébreu.
- source_word: אֶל־דָּוִיד אֶל־מְעָרַת עֲדֻלָּם
  choice: vers David, sur le rocher, à la grotte d’Adoullam
  rationale: Le premier אֶל marque la direction vers David; le second situe naturellement celui-ci à la grotte d’Adoullam. La position de « sur le rocher » demeure quelque peu ambiguë, conformément à l’hébreu.
- source_word: וּמַחֲנֵה פְלִשְׁתִּים חֹנָה
  choice: tandis que le camp des Philistins était installé
  rationale: La proposition participiale fournit l’arrière-plan circonstanciel. « Était installé » rend l’état durable du camp sans la lourdeur de « campait » appliqué au camp lui-même.
- source_word: בְּעֵמֶק רְפָאִים
  choice: dans la vallée des Rephaïm
  rationale: Le nom géographique est rendu selon sa forme française traditionnelle et transparente.
