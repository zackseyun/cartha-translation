review_pass:
  verdict: revise
  source_fidelity: La version situe de façon peu claire « sur le rocher » après « vers David », ce qui risque d’en faire la position de David plutôt que le premier but du mouvement. L’hébreu enchaîne « vers/sur le rocher », « vers David », puis « vers la grotte d’Adoullam » dans une syntaxe condensée. Une légère réorganisation française rend ce premier élément sans trancher entièrement les relations syntaxiques. Le reste rend correctement le déplacement, le groupe des trente, le cadre circonstanciel et le toponyme.
  naturalness: « Descendirent vers David, sur le rocher » est heurté en français et crée une ambiguïté spatiale mal contrôlée. « Descendirent vers le rocher, auprès de David, à la grotte d’Adoullam » est plus lisible et narratif, tout en restant sobre.
  terminology: « Chefs », « Philistins », « grotte d’Adoullam » et « vallée des Rephaïm » conviennent au français biblique moderne international. « Était installé » est une expression naturelle pour l’état durable d’un camp.
  issues:
  - severity: medium
    issue: Ordre et rattachement de « sur le rocher »
    rationale: Dans le texte français, « sur le rocher » suit « vers David » et s’insère maladroitement entre David et la grotte. Le texte source place le rocher avant David; le rendre d’abord évite un rattachement français artificiel tout en conservant l’ambiguïté résiduelle signalée en note.
  revised_text: Puis trois des trente chefs descendirent vers le rocher, auprès de David, à la grotte d’Adoullam, tandis que le camp des Philistins était installé dans la vallée des Rephaïm.
  revised_footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « trois des trente chefs descendirent sur le rocher, vers David, vers la grotte d’Adoullam ». La syntaxe hébraïque est condensée, et le rapport précis entre le rocher, David et la grotte demeure ambigu.'
    reason: lexical_alternative
  revision_rationale: La révision remet le rocher à la première place dans la séquence du déplacement et emploie « auprès de David » pour une formulation française fluide qui présente David comme étant à la grotte. La note conserve une forme plus proche de l’enchaînement hébreu et signale explicitement l’ambiguïté syntaxique, sans imposer une identification topographique ou une interprétation supplémentaire.
