revisions:
- from: Puis trois des trente chefs descendirent vers David, sur le rocher[a], à la grotte d’Adoullam, tandis que le camp des Philistins était installé dans la vallée des Rephaïm.
  to: Puis trois des trente chefs descendirent vers le rocher, auprès de David, à la grotte d’Adoullam, tandis que le camp des Philistins était installé dans la vallée des Rephaïm.
  rationale: La révision remet le rocher à la première place dans la séquence du déplacement et emploie « auprès de David » pour une formulation française fluide qui présente David comme étant à la grotte. La note conserve une forme plus proche de l’enchaînement hébreu et signale explicitement l’ambiguïté syntaxique, sans imposer une identification topographique ou une interprétation supplémentaire.
