  source_fidelity: Le texte rend fidèlement la répudiation solennelle, la question rhétorique portant sur le « sang », le risque vital répété, le refus de David et la conclusion sur les trois guerriers. « Au péril de leur vie » exprime justement בְּנַפְשׁוֹתָם sans suggérer qu’ils sont morts. « Que mon Dieu me garde de faire cela ! » est une transposition idiomatique recevable de la formule hébraïque, dont la nuance précise de מֵאֱלֹהַי demeure discutée.
