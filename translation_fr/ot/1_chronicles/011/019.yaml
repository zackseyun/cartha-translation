source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר חָלִילָ/ה֩ לִּ֨/י מֵ/אֱלֹהַ֜/י מֵ/עֲשׂ֣וֹת זֹ֗את הֲ/דַ֣ם הָ/אֲנָשִׁים֩ הָ/אֵ֨לֶּה אֶשְׁתֶּ֤ה בְ/נַפְשׁוֹתָ/ם֙ כִּ֣י בְ/נַפְשׁוֹתָ֣/ם הֱבִיא֔וּ/ם וְ/לֹ֥א אָבָ֖ה לִ/שְׁתּוֹתָ֑/ם אֵ֣לֶּה עָשׂ֔וּ שְׁלֹ֖שֶׁת הַ/גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/019.yaml
  text: And he said[a], “Far be it from me, by my God, to do this! Shall I drink the blood of these men at the cost of their lives? For they brought it at the cost of their lives.” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: fr
  text: 'Il dit : « Que mon Dieu me garde de faire cela ! Boirais-je le sang[a] de ces hommes au péril de leur vie ? Car c’est au péril de leur vie[b] qu’ils l’ont apportée. » Il ne voulut donc pas la boire. Voilà ce que firent les trois vaillants guerriers.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: David parle de l’eau comme du « sang » de ces hommes parce qu’ils l’ont obtenue en exposant leur vie à un danger mortel.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « avec leur vie ». L’expression est répétée en hébreu pour souligner le danger qu’ils ont couru.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵאֱלֹהַי מֵעֲשׂוֹת זֹאת
  choice: Que mon Dieu me garde de faire cela !
  rationale: Cette formule française actuelle et solennelle rend la vive répudiation exprimée par חָלִילָה ainsi que l’appel à Dieu, sans imposer une analyse trop précise de la préposition מִן dans une tournure difficile.
- source_word: הֲדַם הָאֲנָשִׁים הָאֵלֶּה אֶשְׁתֶּה
  choice: Boirais-je le sang de ces hommes
  rationale: Le conditionnel interrogatif restitue la question rhétorique. « Sang » conserve l’image explicite et saisissante de l’hébreu.
- source_word: בְנַפְשׁוֹתָם
  choice: au péril de leur vie
  rationale: נֶפֶשׁ désigne ici la vie physique exposée au danger. « Au péril de leur vie » évite de laisser entendre que les hommes sont effectivement morts, tout en exprimant le risque mortel.
- source_word: כִּי בְנַפְשׁוֹתָם הֱבִיאוּם
  choice: Car c’est au péril de leur vie qu’ils l’ont apportée
  rationale: La reprise de « au péril de leur vie » respecte la répétition emphatique de l’hébreu. Le pronom français féminin singulier renvoie naturellement à l’eau mentionnée dans le contexte.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Il ne voulut donc pas la boire
  rationale: אָבָה exprime le consentement ou la volonté. « Ne voulut pas » en donne une expression française concise, tandis que « donc » explicite sobrement le lien logique du récit.
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבּוֹרִים
  choice: Voilà ce que firent les trois vaillants guerriers
  rationale: Cette formulation naturelle conserve la fonction récapitulative de la proposition. « Vaillants guerriers » rend le sens militaire et héroïque de גִּבּוֹרִים sans recourir au calque peu naturel « hommes puissants ».
theological_decisions:
- issue: Sens du « sang » dans la déclaration de David
  choice: Conserver « sang » dans le texte et laisser le contexte indiquer que David assimile moralement l’eau au sang des hommes.
  alternative: Paraphraser par « cette eau obtenue au péril de leur vie ».
  rationale: Le texte hébreu emploie explicitement דָּם. Préserver cette image maintient la force éthique et théologique de la réaction de David sans résoudre la métaphore à la place du lecteur.
- issue: Sens contextuel de נֶפֶשׁ
  choice: Traduire par « vie ».
  alternative: Traduire par « âme ».
  rationale: Le passage parle du danger mortel couru par les guerriers, et non de la nature immatérielle de l’être humain.
- issue: Force de מֵאֱלֹהַי dans la formule de répudiation
  choice: Intégrer l’appel à Dieu dans « Que mon Dieu me garde de faire cela ! ».
  alternative: « Loin de moi, devant mon Dieu, l’idée de faire cela ! » ou « Par mon Dieu, loin de moi l’idée de faire cela ! »
  rationale: La construction hébraïque permet des nuances de provenance, de présence divine ou d’appel solennel. La formulation retenue conserve l’invocation de Dieu et la répudiation énergique sans trancher artificiellement entre ces analyses.
translation_notes:
  register: Français international moderne, digne et narratif. La formulation reste accessible, évite les archaïsmes et conserve l’image forte du sang ainsi que la répétition emphatique relative au péril de la vie.
