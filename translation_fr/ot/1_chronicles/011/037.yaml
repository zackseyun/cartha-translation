  text: Hetsro, du Carmel[a], Naaraï, fils d’Ezbaï[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « le Carmélite », c’est-à-dire un homme originaire du Carmel.
    reason: lexical_alternative
  - marker: b
    text: 'Dans la liste parallèle de 2 Samuel 23.35, les noms correspondants sont différents : « Hetsraï, du Carmel, Paaraï, l’Arbite ». Le texte des Chroniques conserve ici une forme distincte.'
    reason: cross_reference
lexical_decisions:
- source_word: חֶצְרוֹ
  choice: Hetsro
  rationale: Nom propre transcrit d’après la forme hébraïque propre au texte des Chroniques, sans l’harmoniser avec la liste parallèle de 2 Samuel.
- source_word: הַכַּרְמְלִי
  choice: du Carmel
  rationale: Le gentilé hébreu avec article désigne une personne originaire du Carmel. « du Carmel » est naturel en français et évite l’ambiguïté moderne de « carmélite », qui évoque généralement un ordre religieux postérieur.
- source_word: נַעֲרַי
  choice: Naaraï
  rationale: Transcription française du nom propre hébreu, avec le tréma pour signaler que les voyelles finales se prononcent séparément.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette liste de noms, le sens direct de filiation convient le mieux; rien n’impose le sens plus large de « descendant de ».
- source_word: אֶזְבָּי
  choice: Ezbaï
  rationale: Transcription française directe du nom propre hébreu, avec le tréma pour rendre clairement la suite vocalique finale.
