lexical_decisions:
- source_word: צֶלֶק
  choice: Tsélek
  rationale: Transcription française usuelle du nom hébreu, avec « Ts » pour צ et accents facilitant une prononciation naturelle.
- source_word: הָעַמּוֹנִי
  choice: l’Ammonite
  rationale: Le gentilé défini identifie Tsélek par son origine ; cette formulation est naturelle dans une liste de guerriers.
- source_word: נַחְרַי
  choice: Naharaï
  rationale: Transcription française qui représente les syllabes du nom hébreu et signale la séparation finale par un tréma.
- source_word: הַבֵּרֹתִי
  choice: le Béérothite
  rationale: Gentilé défini dérivé de Bééroth ; cette forme conserve clairement le lien avec le nom du lieu.
- source_word: נֹשֵׂא כְּלֵי
  choice: porte-armes
  rationale: Expression française concise et idiomatique pour la fonction désignée par le participe « porter » suivi de « armes/équipement » ; la traduction plus littérale est indiquée en note.
- source_word: יוֹאָב
  choice: Joab
  rationale: Forme française biblique courante du nom propre.
- source_word: בֶּן צְרוּיָה
  choice: fils de Tserouya
  rationale: Rend directement la filiation maternelle par laquelle Joab est régulièrement identifié dans Samuel et les Chroniques.
