  text: Zelek the Ammonite[a], Naharai the Beerothite, the armor-bearer of Joab son of Zeruiah;
translation:
  language: fr
  text: Tsélek l’Ammonite ; Naharaï le Béérothite, porte-armes[a] de Joab, fils de Tserouya ;
