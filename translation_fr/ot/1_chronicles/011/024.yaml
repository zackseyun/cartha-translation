  text: אֵ֣לֶּה עָשָׂ֔ה בְּנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וְ/ל/וֹ שֵׁ֖ם בִּ/שְׁלוֹשָׁ֥ה הַ/גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/024.yaml
  text: These things Benaiah son of Jehoiada did[a], and he had a name among the three mighty men.
translation:
  language: fr
  text: Voilà ce que fit Benaya, fils de Yehoyada. Il était renommé[a] parmi les trois vaillants guerriers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il avait un nom ».'
    reason: L’hébreu emploie un idiome où le « nom » désigne la renommée ou la réputation.
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: Voilà ce que fit
  rationale: La tournure reprend les exploits racontés juste avant. « Voilà ce que fit » restitue naturellement en français la valeur récapitulative du démonstratif pluriel suivi de עָשָׂה.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya, fils de Yehoyada
  rationale: Les noms sont translittérés depuis l’hébreu, et la relation de filiation est rendue par la formule française naturelle « fils de ».
- source_word: וְלוֹ שֵׁם
  choice: Il était renommé
  rationale: L’expression hébraïque signifie littéralement qu’« un nom » lui appartenait, idiome indiquant ici sa renommée. La formulation retenue transmet clairement ce sens tout en signalant le littéralisme en note.
- source_word: בִּשְׁלוֹשָׁה
  choice: parmi les trois
  rationale: La préposition בְּ exprime ici la position ou la reconnaissance de Benaya par rapport à ce groupe de trois.
- source_word: הַגִּבֹּרִים
  choice: vaillants guerriers
  rationale: Dans ce contexte militaire, גִּבּוֹרִים désigne des combattants d’élite réputés pour leur bravoure. « Vaillants guerriers » conserve à la fois la force du terme et sa fonction militaire.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La phrase hébraïque est divisée en deux phrases françaises pour éviter une coordination lourde, sans modifier le rapport entre les exploits de Benaya et sa renommée.
