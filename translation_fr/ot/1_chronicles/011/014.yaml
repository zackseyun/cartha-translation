id: 1CH.11.14
reference: 1 Chronicles 11:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּֽתְיַצְּב֤וּ בְ/תוֹךְ הַ/חֶלְקָה֙ וַ/יַּצִּיל֔וּ/הָ וַ/יַּכּ֖וּ אֶת פְּלִשְׁתִּ֑ים וַ/יּ֥וֹשַׁע יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/014.yaml
  text: And they took their stand in the middle of the plot and delivered it[a], and they struck down the Philistines, and Yahweh saved by a great victory.
translation:
  language: fr
  text: Ils prirent position au milieu de la parcelle, la sauvèrent et frappèrent les Philistins. Yahweh accorda une grande victoire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahweh opéra une grande délivrance » ou « Yahweh accomplit un grand salut ».
    reason: Le nom תְּשׁוּעָה peut désigner une victoire, une délivrance ou un salut ; l'hébreu l'emploie avec le verbe apparenté « sauver ».
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: Ils prirent position
  rationale: Le hitpael de יצב exprime une prise de position ferme et délibérée. « Prirent position » convient naturellement au contexte militaire.
- source_word: בְתוֹךְ הַחֶלְקָה
  choice: au milieu de la parcelle
  rationale: תוך désigne le milieu, et חלקה une portion délimitée de terre cultivée. « Parcelle » conserve cette précision agricole.
- source_word: וַיַּצִּילוּהָ
  choice: la sauvèrent
  rationale: Le suffixe féminin renvoie à la parcelle. נצל signifie sauver ou arracher au danger ; « la sauvèrent » conserve l'objet explicite sans ajouter la mention de l'ennemi.
- source_word: וַיַּכּוּ אֶת־פְּלִשְׁתִּים
  choice: frappèrent les Philistins
  rationale: נכה signifie frapper et peut, dans un récit de bataille, impliquer une défaite meurtrière. La traduction garde ici la formulation concrète sans préciser davantage l'issue.
- source_word: וַיּוֹשַׁע יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: Yahweh accorda une grande victoire
  rationale: La construction associe le verbe ישׁע au nom apparenté תשועה. En contexte militaire, « accorda une grande victoire » rend naturellement l'action salvatrice de Yahweh, sans introduire d'objet absent de l'hébreu ; la note conserve les autres nuances possibles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de le distinguer d'un titre tel que « le Seigneur ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin ; « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Rapport entre le salut divin et la victoire militaire
  choice: Yahweh accorda une grande victoire
  alternative: Yahweh opéra une grande délivrance
  rationale: Le contexte immédiat est celui d'un combat, ce qui favorise « victoire », mais תשועה garde une portée de salut ou de délivrance, signalée en note.
translation_notes:
  register: Français moderne, sobre et narratif. La coordination hébraïque est légèrement allégée, tout en conservant la progression des actions et l'absence d'objet explicite dans la dernière proposition.
