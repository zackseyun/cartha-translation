  text: וַ/יִּבְקְע֨וּ הַ/שְּׁלֹשָׁ֜ה בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בּ֤וֹר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑יד וְ/לֹֽא אָבָ֤ה דָוִיד֙ לִ/שְׁתּוֹתָ֔/ם וַ/יְנַסֵּ֥ךְ אֹתָ֖/ם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/018.yaml
  text: So the three broke through into the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But David was not willing to drink it; instead, he poured it out to Yahweh.
translation:
  language: fr
  text: Les trois se frayèrent donc un passage dans le camp des Philistins. Ils puisèrent de l’eau au puits de Bethléem, qui se trouvait à la porte, l’emportèrent et l’apportèrent à David. Mais David ne voulut pas la boire ; il la répandit pour Yahvé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « il l’offrit à Yahvé en libation ». Le verbe hébreu peut désigner l’action de verser une offrande liquide.'
    reason: Alternative lexicale précisant la portée cultuelle possible du verbe נסך.
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: se frayèrent un passage
  rationale: Dans ce contexte militaire, le verbe décrit une percée à travers les positions ennemies. Cette expression française en restitue la force sans évoquer littéralement le fait de fendre un objet.
- source_word: הַשְּׁלֹשָׁה
  choice: les trois
  rationale: L’hébreu dit simplement « les trois » ; leur identité ressort du contexte, sans qu’il soit nécessaire d’ajouter « vaillants guerriers » dans ce verset.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: dans le camp des Philistins
  rationale: Avec « se frayer un passage », la préposition exprime naturellement la pénétration dans le camp ennemi.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: ils puisèrent de l’eau
  rationale: « Puiser de l’eau » est l’équivalent français courant et précis de l’action décrite.
- source_word: מִבּוֹר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: au puits de Bethléem, près de la porte
  rationale: בּוֹר peut désigner une fosse, une citerne ou un puits. Puisqu’on y puise de l’eau à boire, « puits » convient naturellement ; « près de la porte » rend la localisation sans la préciser au-delà du texte.
- source_word: וַיִּשְׂאוּ וַיָּבִיאוּ אֶל דָּוִיד
  choice: l’emportèrent et l’apportèrent à David
  rationale: 'La répétition des deux verbes est conservée : le premier exprime le transport de l’eau, le second son arrivée auprès de David.'
- source_word: וְלֹא אָבָה דָוִיד לִשְׁתּוֹתָם
  choice: David ne voulut pas la boire
  rationale: אָבָה porte sur la volonté ou le consentement. Le féminin singulier est idiomatique en français, son antécédent étant « l’eau », bien que l’hébreu emploie un suffixe pluriel.
- source_word: וַיְנַסֵּךְ אֹתָם לַיהוָה
  choice: il la répandit pour Yahvé
  rationale: Le texte principal conserve le geste concret de verser l’eau. Le verbe נסך peut aussi désigner une libation cultuelle ; cette nuance est signalée en note.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle du nom divin préserve ici le nom personnel exprimé par le tétragramme plutôt que de lui substituer un titre.
theological_decisions:
- issue: Portée cultuelle du geste de David
  choice: 'Décrire dans le texte le geste concret : « il la répandit pour Yahvé », avec une note sur la libation.'
  alternative: « Il l’offrit à Yahvé en libation. »
  rationale: Le verbe hébreu peut avoir une valeur sacrificielle, mais il désigne aussi directement l’acte de répandre. La formulation retenue préserve l’image narrative sans effacer la portée cultuelle, explicitée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative reste fluide, tandis que les répétitions significatives de l’hébreu et l’ambiguïté entre geste concret et libation cultuelle sont préservées.
