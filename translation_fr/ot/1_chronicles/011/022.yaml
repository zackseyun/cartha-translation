base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/022.yaml
  text: Benaiah son of Jehoiada[a], son of a mighty man, a man of many deeds, from Kabzeel—he struck down the two heroes of Moab. He also went down and struck down the lion in the midst of a pit on a snowy day.
translation:
  language: fr
  text: Benaya, fils de Yehoyada, était le fils d’un homme vaillant, auteur de nombreux exploits, originaire de Qabseel. Il abattit les deux héros de Moab[a]. Il descendit aussi dans une fosse et y abattit un lion, un jour de neige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La signification de l’expression hébraïque est incertaine : elle peut désigner « les deux fils d’Ariel de Moab », « les deux Ariel de Moab » ou « les deux héros de Moab, semblables à des lions ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ חַיִל
  choice: un homme vaillant
  rationale: Dans ce contexte guerrier, l’expression désigne un homme reconnu pour sa force et sa bravoure. « Vaillant » conserve cette portée martiale dans un français naturel et digne.
- source_word: רַב פְּעָלִים
  choice: auteur de nombreux exploits
  rationale: L’expression signifie littéralement « nombreux en actes ». « Auteur de nombreux exploits » rend ici l’idée d’actions remarquables sans archaïsme.
- source_word: מִן קַבְצְאֵל
  choice: originaire de Qabseel
  rationale: La préposition מִן indique le lieu d’origine. Cette formulation française explicite naturellement le rapport à Qabseel.
- source_word: הִכָּה
  choice: abattit
  rationale: Le verbe נכה signifie frapper ou terrasser. Dans ce récit d’exploits guerriers, « abattit » exprime l’issue violente sans employer le très littéral et moins naturel « frappa ».
- source_word: שְׁנֵי אֲרִיאֵל מוֹאָב
  choice: les deux héros de Moab[a]
  rationale: אֲרִיאֵל est difficile et peut évoquer Ariel comme nom propre ou des hommes semblables à des lions. « Héros » communique le sens probable dans cette liste guerrière, tandis que la note conserve les autres analyses possibles.
- source_word: יָרַד
  choice: descendit
  rationale: Le verbe indique un mouvement vers le bas, vraisemblablement à l’intérieur de la fosse.
- source_word: הָאֲרִי
  choice: un lion
  rationale: Le nom désigne clairement le lion. L’article hébreu peut être rendu de manière idiomatique par l’indéfini lors de la première mention en français.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: dans une fosse
  rationale: La locution situe l’action à l’intérieur d’une excavation. « Fosse » reste assez général pour ne pas trancher entre une fosse naturelle et une citerne.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: un jour de neige
  rationale: Cette tournure française naturelle reste proche du sens littéral « au jour de la neige » et préserve le détail circonstanciel.
