base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/021.yaml
  text: He was more honored than the two among the three[a], and he became their commander; but he did not attain to the three.
translation:
  language: fr
  text: Parmi les trois, il était plus honoré que les deux[a], et il devint leur chef. Cependant, il n’atteignit pas le rang des Trois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu est condensé et difficile. Il peut aussi se lire, de façon très littérale et ambiguë, comme indiquant qu’il était « honoré plus que les trois par les deux ». Le sens général est qu’il jouissait d’un grand honneur dans un groupe hiérarchisé, sans toutefois égaler les Trois.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשָׁה בַשְּׁנַיִם
  choice: Parmi les trois, il était plus honoré que les deux autres
  rationale: La formulation hébraïque est condensée et difficile. Cette traduction comprend בַשְּׁנַיִם comme une référence aux deux autres membres du groupe de trois et explicite la comparaison pour produire un français intelligible, tout en signalant l’incertitude dans une note.
- source_word: נִכְבָּד
  choice: était plus honoré
  rationale: Le nifal de כבד exprime ici l’honneur ou l’estime dont quelqu’un jouit. Le comparatif « plus honoré » convient à la construction et conserve la nuance de rang.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: et il devint leur chef
  rationale: שַׂר désigne un chef ou un commandant. « Chef » est naturel en français moderne et convient au contexte militaire sans préciser excessivement la fonction.
- source_word: וְעַד הַשְּׁלוֹשָׁה לֹא בָא
  choice: Cependant, il n’atteignit pas le rang des Trois
  rationale: Avec עַד, בוא exprime ici l’idée d’atteindre un niveau ou un rang. L’ajout de « le rang » rend ce sens idiomatique en français. La majuscule à « Trois » distingue le groupe d’élite auquel il n’égala pas, dans ce contexte, le statut.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe explicite la comparaison nécessaire à la compréhension, tandis que la note préserve l’ambiguïté réelle de l’hébreu. « Les Trois » est traité comme la désignation contextuelle d’un groupe d’élite.
