  text: וְ/הֽוּא הִכָּה֩ אֶת הָ/אִ֨ישׁ הַ/מִּצְרִ֜י אִ֥ישׁ מִדָּ֣ה חָמֵ֣שׁ בָּ/אַמָּ֗ה וּ/בְ/יַ֨ד הַ/מִּצְרִ֤י חֲנִית֙ כִּ/מְנ֣וֹר אֹרְגִ֔ים וַ/יֵּ֥רֶד אֵלָ֖י/ו בַּ/שָּׁ֑בֶט וַ/יִּגְזֹ֤ל אֶֽת הַ/חֲנִית֙ מִ/יַּ֣ד הַ/מִּצְרִ֔י וַ/יַּהַרְגֵ֖/הוּ בַּ/חֲנִיתֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/023.yaml
  text: And he struck down the Egyptian[a], a man five cubits tall. In the Egyptian’s hand was a spear like a weaver’s beam, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[c][b], and killed him with his own spear.
translation:
  language: fr
  text: Il abattit l’Égyptien[a], un homme haut de cinq coudées[b]. Dans la main de l’Égyptien se trouvait une lance dont la hampe était comme une ensouple de tisserand. Il descendit vers lui avec un bâton[c], arracha la lance de la main de l’Égyptien et le tua avec sa propre lance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « l’homme égyptien ».
    reason: lexical_alternative
  - marker: b
    text: La coudée était une ancienne unité de longueur correspondant approximativement à la distance entre le coude et l’extrémité des doigts.
    reason: cultural_note
  - marker: c
    text: Ou « une massue » ou « une verge ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: abattit
  rationale: Le verbe peut désigner le fait de frapper; dans ce contexte de combat, «abattit» exprime la mise hors de combat sans anticiper entièrement le verbe explicite «tua» à la fin du verset.
- source_word: הָאִישׁ הַמִּצְרִי
  choice: l’Égyptien
  rationale: Cette formulation naturelle en français désigne clairement l’adversaire sans répéter inutilement «homme».
- source_word: אִישׁ מִדָּה חָמֵשׁ בָּאַמָּה
  choice: un homme haut de cinq coudées
  rationale: La mesure qui suit précise ici la stature de l’homme; la formulation conserve l’unité ancienne et reste claire.
- source_word: חֲנִית
  choice: lance
  rationale: «Lance» convient à cette arme imposante et à la comparaison de sa hampe avec une pièce de métier à tisser.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: dont le bois était comme l’ensouple d’un métier à tisser
  rationale: מְנוֹר désigne vraisemblablement une grosse pièce de bois du métier; «ensouple» est précis, tandis que «le bois» explicite naturellement que la comparaison porte sur la hampe.
- source_word: וַיֵּרֶד אֵלָיו
  choice: Il descendit vers lui
  rationale: La traduction conserve le mouvement littéral exprimé par ירד sans ajouter une nuance tactique absente du texte.
- source_word: בַּשָּׁבֶט
  choice: avec un bâton
  rationale: שֵׁבֶט peut désigner un bâton, une verge ou une massue; «bâton» est ici le choix le plus neutre.
- source_word: וַיִּגְזֹל
  choice: arracha
  rationale: Le verbe exprime une prise par la force; «arracha» convient au geste vif du combat.
- source_word: וַיַּהַרְגֵהוּ
  choice: le tua
  rationale: Le verbe indique explicitement la mise à mort; «tua» est direct et moderne.
- source_word: בַּחֲנִיתוֹ
  choice: avec sa propre lance
  rationale: Le suffixe renvoie naturellement à la lance de l’Égyptien qui vient d’être arrachée; «sa propre» clarifie cette référence sans modifier le sens.
theological_decisions: []
