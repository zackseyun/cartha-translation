lexical_decisions:
- source_word: אֱלִיאֵל
  choice: Éliel
  rationale: Nom propre transcrit selon l’usage français, avec un accent initial qui en facilite la lecture.
- source_word: וְעוֹבֵד
  choice: Obed
  rationale: Nom propre précédé en hébreu de la conjonction. Dans l’énumération française, la conjonction n’est exprimée naturellement qu’avant le dernier élément.
- source_word: וְיַעֲשִׂיאֵל
  choice: et Jaassiel
  rationale: Nom propre transcrit en français; le double a rend distinctement la succession vocalique du début du nom, tandis que la conjonction introduit naturellement le dernier élément de la liste.
- source_word: הַמְּצֹבָיָה
  choice: le Metsobaya
  rationale: Désignation d’origine munie de l’article, probablement un gentilé lié à un lieu ou à un clan. Une transcription prudente conserve cette fonction sans identifier de façon spéculative le nom sous-jacent.
