  variant: modern international French
source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם דָּוִ֥יד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֨וּ אֶת דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל כִּ/דְבַ֥ר יְהוָ֖ה בְּ/יַד שְׁמוּאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and David made a covenant with them at Hebron before Yahweh. Then they anointed David king over Israel, according to the word of Yahweh by Samuel.
translation:
  language: fr
  text: Ainsi, tous les anciens d’Israël vinrent auprès du roi, à Hébron. David conclut avec eux une alliance à Hébron, devant Yahweh. Puis ils oignirent David comme roi sur Israël, conformément à la parole de Yahweh par l’intermédiaire de Samuel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de Samuel », expression qui signifie ici « par l’intermédiaire de Samuel ».'
    reason: La note explicite l’idiome hébreu בְּיַד (« par la main de ») au point où son sens médiateur est rendu en français.
lexical_decisions:
- source_word: זִקְנֵי
  choice: anciens
  rationale: « Anciens » est le terme français usuel pour les représentants officiellement reconnus d’Israël et conserve la fonction sociopolitique du mot hébreu.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: L’hébreu emploie ici le titre défini sans répéter le nom de David; « le roi » préserve cette désignation narrative.
- source_word: חֶבְרוֹנָה / בְּחֶבְרוֹן
  choice: à Hébron
  rationale: La première forme indique un mouvement en direction d’Hébron, tandis que la seconde situe l’alliance dans cette ville. En français, « vinrent auprès du roi à Hébron » et « à Hébron » rendent naturellement ces deux nuances en contexte.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: conclut ... une alliance
  rationale: L’expression signifie littéralement « couper une alliance ». « Conclure une alliance » est l’équivalent idiomatique, précis et digne en français moderne.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Cette formulation concise conserve l’idée que l’alliance est conclue en présence de Dieu et sous son regard, sans explicitation excessive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin rend directement le tétragramme plutôt que de lui substituer un titre.
- source_word: וַיִּמְשְׁחוּ
  choice: ils oignirent
  rationale: Le verbe désigne concrètement l’onction royale; « consacrèrent » serait plus interprétatif.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: comme roi sur Israël
  rationale: Cette tournure française exprime clairement l’installation de David dans la fonction royale et l’étendue de son autorité.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole de Yahweh
  rationale: « Parole » rend directement דָבָר et maintient le lien avec la déclaration divine sans réduire celle-ci à une promesse.
- source_word: בְּיַד שְׁמוּאֵל
  choice: transmise par Samuel
  rationale: L’expression signifie littéralement « par la main de Samuel » et présente Samuel comme l’intermédiaire de la parole divine. La traduction choisie restitue naturellement cette médiation en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel divin au lieu de le remplacer par un titre.
- issue: Rôle de Samuel dans la parole divine
  choice: la parole de Yahweh transmise par Samuel
  alternative: la parole de Yahweh par la main de Samuel
  rationale: Le choix maintient Yahweh comme source de la parole et Samuel comme son médiateur, tout en rendant intelligiblement l’idiome hébreu sans lui attribuer une portée doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et solennel. Le passé simple convient au récit historique écrit; « conclure une alliance » et « oindre » conservent le registre biblique sans archaïsme inutile. Le marqueur [a] est placé après « Samuel », là où se trouve l’expression hébraïque expliquée.
