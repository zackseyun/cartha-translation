base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/006.yaml
  text: And David said[a], “Whoever strikes down a Jebusite first shall become chief and commander.” So Joab son of Zeruiah went up first[b], and he became chief.
translation:
  language: fr
  text: 'David dit : « Le premier qui frappera un Jébusien deviendra chef et commandant[a]. » Joab, fils de Tserouya, monta le premier[b], et il devint chef.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « deviendra chef et prince ». Les deux termes hébreux désignent des fonctions d’autorité.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe « monta » peut évoquer ici une montée à l’assaut de la forteresse, mais le texte hébreu dit simplement « monta ».
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַכֵּה יְבוּסִי
  choice: Quiconque abattra un Jébusien
  rationale: 'כָּל suivi du participe fonctionne ici comme un relatif indéfini : « quiconque ». Dans ce contexte militaire, נכה exprime l’idée de frapper à mort ou d’abattre; le singulier יְבוּסִי désigne naturellement un membre du peuple jébusien.'
- source_word: בָּרִאשׁוֹנָה
  choice: le premier
  rationale: L’adverbe marque la priorité dans l’action. « Le premier » est naturel en français et convient dans les deux occurrences.
- source_word: יִהְיֶה לְרֹאשׁ וּלְשָׂר
  choice: deviendra chef et commandant
  rationale: La construction היה + ל indique l’accès à une fonction. רֹאשׁ évoque la position de chef, tandis que שַׂר désigne ici un dirigeant ou commandant. La traduction conserve les deux termes sans archaïsme.
- source_word: וַיַּעַל
  choice: monta
  rationale: עלה signifie littéralement « monter ». Le contexte peut suggérer une montée à l’assaut de la forteresse, mais le verbe hébreu ne dit pas explicitement « attaquer ».
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: Joab, fils de Tserouya
  rationale: Transcription française courante des noms, avec la filiation rendue directement.
- source_word: וַיְהִי לְרֹאשׁ
  choice: et il devint chef
  rationale: Cette formulation reprend רֹאשׁ de la promesse précédente. Le texte ne répète pas שַׂר dans cette dernière proposition; seul « chef » est donc conservé.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le futur convient à la proclamation de David; « abattra » garde la force du contexte militaire. La répétition de « chef » préserve l’écho lexical du texte hébreu.
