- from: 'David dit : « Quiconque abattra le premier un Jébusien deviendra chef et commandant[a]. » Joab, fils de Tserouya, monta le premier[b], et il devint chef.'
  to: 'David dit : « Le premier qui frappera un Jébusien deviendra chef et commandant[a]. » Joab, fils de Tserouya, monta le premier[b], et il devint chef.'
  rationale: La révision clarifie que la récompense revient à celui qui frappera en premier, tout en préservant le sens militaire non surinterprété de נכה. Elle remplace aussi une note a imprécise par une alternative française fidèle aux deux titres hébreux.
