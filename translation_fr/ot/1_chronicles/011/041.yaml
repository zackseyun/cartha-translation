  rationale: Forme française traditionnelle et courante du nom propre hébreu, employée notamment dans le récit de 2 Samuel 11.
- source_word: הַ/חִתִּי
  choice: le Hittite
  rationale: Le gentilé hébreu muni de l’article désigne l’origine ou l’appartenance ethnique d’Urie; « Hittite » est la forme française standard.
- source_word: זָבָד
  choice: Zabad
  rationale: Translittération française usuelle de ce nom propre hébreu.
- source_word: בֶּן
  choice: fils de
  rationale: Rend directement la relation de filiation exprimée par l’état construit hébreu et convient au style concis d’une liste.
- source_word: אַחְלָי
  choice: Ahlaï
  rationale: Translittération française claire du nom propre hébreu, avec tréma pour signaler que les voyelles se prononcent séparément.
