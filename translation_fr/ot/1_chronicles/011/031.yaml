  text: אִיתַ֣י בֶּן רִיבַ֗י מִ/גִּבְעַת֙ בְּנֵ֣י בִנְיָמִ֔ן בְּנָיָ֖ה הַ/פִּרְעָתֹנִֽי־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/031.yaml
  text: Ittai son of Ribai[a], from Gibeah of the sons of Benjamin; Benaiah the Pirathonite;
translation:
  language: fr
  text: Ittaï, fils de Ribaï, de Guibéa des Benjaminites[a] ; Benaya, le Piratonite ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Guibéa des fils de Benjamin ».'
    reason: La note conserve l’expression hébraïque tribale et précise son rattachement à Guibéa.
lexical_decisions:
- source_word: אִיתַי
  choice: Ittaï
  rationale: Nom propre translittéré selon un usage français clair, avec le tréma indiquant que les deux voyelles se prononcent séparément.
- source_word: בֶּן רִיבַי
  choice: fils de Ribaï
  rationale: La construction nominale exprime ici la filiation directe ; « fils de » est son équivalent français naturel.
- source_word: מִגִּבְעַת
  choice: de Guibéa
  rationale: La préposition מִן indique la provenance ou le rattachement, et גִּבְעַת fonctionne ici comme un nom de lieu.
- source_word: בְּנֵי בִנְיָמִן
  choice: parmi les descendants de Benjamin
  rationale: Littéralement « fils de Benjamin », cette expression désigne ici les membres issus de Benjamin, donc l’appartenance tribale. « Descendants » conserve l’image généalogique sans suggérer qu’ils seraient tous ses fils immédiats.
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Nom propre translittéré de manière simple et conforme à sa prononciation hébraïque approximative.
- source_word: הַפִּרְעָתֹנִי
  choice: le Piratonite
  rationale: Le gentilé avec article identifie Benaya par son lien avec Piratôn. La forme française « Piratonite » conserve cette désignation sans préciser au-delà de l’hébreu la nature exacte du lien.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La structure en liste et le point-virgule final sont conservés en accord avec le contexte. « Parmi » explicite le rapport entre Ittaï et le groupe benjaminite tout en évitant l’enchaînement ambigu « de Guibéa, des descendants de Benjamin ».
