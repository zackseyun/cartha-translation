source:
  edition: WLC
  text: וְ/אַחֲרָ֛י/ו אֶלְעָזָ֥ר בֶּן דּוֹד֖וֹ הָ/אֲחוֹחִ֑י ה֖וּא בִּ/שְׁלוֹשָׁ֥ה הַ/גִּבֹּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/012.yaml
  text: After him was Eleazar son of Dodo the Ahohite[a]; he was among the three mighty men.
translation:
  language: fr
  text: Après lui venait Éléazar, fils de Dodo, l’Ahohite. Il comptait parmi les trois vaillants guerriers[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il était l’un des trois vaillants guerriers ». L’expression hébraïque peut indiquer l’appartenance au groupe d’élite des trois.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Après lui venait
  rationale: L’expression situe Éléazar à la suite du guerrier précédent dans la liste. Le verbe « venait », implicite en hébreu, donne en français une phrase naturelle sans suggérer une proximité spatiale.
- source_word: אֶלְעָזָר
  choice: Éléazar
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: בֶּן דּוֹדוֹ
  choice: fils de Dodo
  rationale: « Fils de » rend le sens généalogique immédiat de בֶּן, et Dodo représente la forme du nom dans le texte massorétique de ce verset.
- source_word: הָאֲחוֹחִי
  choice: l’Ahohite
  rationale: Le gentilé ou nom de clan est conservé sous une forme translittérée, conformément à l’usage biblique français.
- source_word: בִּשְׁלוֹשָׁה
  choice: parmi les trois
  rationale: La préposition בְּ avec le nombre exprime ici l’appartenance au groupe connu des trois, tout en laissant subsister la légère souplesse de la tournure hébraïque.
- source_word: הַגִּבֹּרִים
  choice: vaillants guerriers
  rationale: Dans ce contexte militaire, גִּבּוֹרִים désigne les combattants d’élite de David. « Vaillants guerriers » est clair en français moderne et conserve la valeur quasi titulaire du terme.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La formulation conserve le caractère de liste du passage, tandis que « comptait parmi » exprime l’appartenance sans préciser davantage le rang d’Éléazar.
