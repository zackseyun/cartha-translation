id: 1CH.11.10
reference: 1 Chronicles 11:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה רָאשֵׁ֤י הַ/גִּבּוֹרִים֙ אֲשֶׁ֣ר לְ/דָוִ֔יד הַ/מִּתְחַזְּקִ֨ים עִמּ֧/וֹ בְ/מַלְכוּת֛/וֹ עִם כָּל יִשְׂרָאֵ֖ל לְ/הַמְלִיכ֑/וֹ כִּ/דְבַ֥ר יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/010.yaml
  text: These were the chiefs of the mighty men who belonged to David[a], who strengthened themselves with him in his kingdom, together with all Israel, to make him king[b], according to the word of Yahweh concerning Israel.
translation:
  language: fr
  text: Voici les chefs des vaillants guerriers de David, ceux qui le soutinrent fermement[a] dans son règne[b], avec tout Israël, afin de le faire roi, conformément à la parole de Yahweh au sujet d’Israël[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « qui se montrèrent forts avec lui » ou « qui se fortifièrent avec lui ». Dans ce contexte, l’expression désigne probablement leur ferme soutien à David.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans sa royauté » ou « dans son royaume ». Le mot hébreu peut désigner la royauté, l’exercice du pouvoir royal ou le royaume.'
    reason: lexical_alternative
  - marker: c
    text: 'Plus littéralement : « sur Israël ». Ici, l’expression signifie probablement « au sujet d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַגִּבּוֹרִים
  choice: les chefs des vaillants guerriers
  rationale: רָאשֵׁי désigne ici les principaux membres ou chefs, tandis que הַגִּבּוֹרִים renvoie aux combattants d’élite de David. « Vaillants guerriers » exprime naturellement en français la valeur militaire et héroïque du terme.
- source_word: אֲשֶׁר לְדָוִיד
  choice: de David
  rationale: Le לְ marque l’appartenance ou l’association. Le complément français « de David » est direct, naturel et n’implique pas une possession servile.
- source_word: הַמִּתְחַזְּקִים עִמּוֹ
  choice: ceux qui le soutinrent fermement
  rationale: Le hitpael de חזק avec עִם peut évoquer le fait de se montrer fort aux côtés de quelqu’un et, dans ce contexte d’accession au trône, de lui apporter un soutien résolu. La note conserve la formulation plus littérale.
- source_word: בְמַלְכוּתוֹ
  choice: dans sa royauté
  rationale: מַלְכוּת peut désigner la royauté, le règne ou le royaume. « Royauté » convient au contexte de l’établissement de David comme roi sans réduire le mot à un territoire.
- source_word: עִם כָּל יִשְׂרָאֵל
  choice: avec tout Israël
  rationale: Rend directement l’accompagnement exprimé par עִם et montre que ces chefs agissent de concert avec l’ensemble d’Israël.
- source_word: לְהַמְלִיכוֹ
  choice: afin de le faire roi
  rationale: Le hiphil de מלך signifie faire régner quelqu’un ou l’établir comme roi. Cette formulation est transparente et fidèle.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole de Yahweh
  rationale: « Parole » préserve la référence à la déclaration divine, et « conformément à » exprime la valeur normative de la préposition כְּ.
- source_word: עַל יִשְׂרָאֵל
  choice: au sujet d’Israël
  rationale: Avec דָּבָר, עַל signifie naturellement « au sujet de » ou « concernant ». La note signale le rendu formel possible « sur Israël ».
theological_decisions:
- issue: Sens de הַמִּתְחַזְּקִים עִמּוֹ
  choice: Un soutien résolu apporté à David lors de l’établissement de sa royauté
  alternative: Ils se fortifièrent avec lui ou se montrèrent forts à ses côtés
  rationale: Le contexte immédiat précise qu’ils agissaient afin de faire David roi. Le texte principal communique donc la portée politique et militaire probable, tandis que la note maintient l’ambiguïté de la forme réflexive hébraïque.
- issue: Portée de בְמַלְכוּתוֹ
  choice: La royauté de David, comprise largement comme son pouvoir royal
  alternative: Son règne ou son royaume territorial
  rationale: Le contexte porte sur l’accession de David. « Royauté » conserve la possibilité d’un sens institutionnel et politique sans imposer l’idée d’un territoire.
- issue: Rapport syntaxique de עַל יִשְׂרָאֵל
  choice: La parole de Yahweh au sujet d’Israël
  alternative: La parole de Yahweh sur Israël, ou la royauté de David sur Israël
  rationale: La proximité de כִּדְבַר יְהוָה favorise le rattachement à la parole divine, mais la note garde visible la formulation hébraïque plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » rend naturellement la formule présentative וְאֵלֶּה sans introduire un marqueur temporel absent. Le passé simple convient au registre narratif biblique soutenu, tout en restant intelligible.
