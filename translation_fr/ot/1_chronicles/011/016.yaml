  yaml_path: translation/ot/1_chronicles/011/016.yaml
  text: David was in the stronghold[b][a], and the garrison of the Philistines was then in Bethlehem.
translation:
  language: fr
  text: David se trouvait alors dans la forteresse[a], et la garnison des Philistins était alors à Bethléem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « place forte » ou « refuge fortifié ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּצוּדָה
  choice: forteresse
  rationale: Le terme désigne un lieu fortifié ou une position défensive. « Forteresse » convient au contexte militaire et reste naturel en français.
- source_word: נְצִיב
  choice: garnison
  rationale: Dans ce contexte philistin et militaire, le mot désigne vraisemblablement un poste ou une force d’occupation plutôt qu’un gouverneur civil.
- source_word: פְּלִשְׁתִּים
  choice: Philistins
  rationale: Forme française usuelle du nom de ce peuple.
- source_word: בְּבֵית לָחֶם
  choice: à Bethléem
  rationale: La préposition בְּ marque ici le lieu ; en français, le nom d’une ville s’introduit naturellement par « à ».
- source_word: אָז ... אָז
  choice: alors ... alors
  rationale: La répétition hébraïque est conservée afin de respecter le parallélisme temporel et l’insistance du texte source.
- source_word: וְדָוִיד
  choice: David
  rationale: Le waw initial relie cette phrase au récit précédent, mais il n’est pas nécessaire de le rendre explicitement en français moderne dans cette proposition circonstancielle.
