  register: Français international moderne, narratif et digne. Le verset conserve le nom de lieu, l’orge comme détail agricole précis et le terme général «peuple». La syntaxe a été légèrement réorganisée pour une lecture française fluide sans résoudre les ambiguïtés du texte.
