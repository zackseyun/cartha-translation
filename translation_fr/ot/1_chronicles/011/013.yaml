base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/013.yaml
  text: He was with David at Pas-dammim[a], where the Philistines had gathered for battle. Now the plot of the field was full of barley[b], and the people fled from before the Philistines.
translation:
  language: fr
  text: Il était avec David à Pas-Dammim[a], où les Philistins s’étaient rassemblés pour livrer bataille. La parcelle du champ était pleine d’orge, et le peuple s’enfuit devant les Philistins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pas-Dammim est un nom de lieu. Comparer le récit parallèle en 1 Samuel 17.1, où le site est appelé Éphès-Dammim.
    reason: cross_reference
lexical_decisions:
- source_word: בַּפַּס דַּמִּים
  choice: à Pas-Dammim
  rationale: Le syntagme est compris comme un nom de lieu dans les Chroniques. La translittération préserve cette fonction sans transformer son étymologie possible en traduction.
- source_word: נֶאֱסְפוּ
  choice: s’étaient rassemblés
  rationale: Le nifal de אסף exprime ici le rassemblement des Philistins; le plus-que-parfait situe naturellement cette action avant la scène racontée.
- source_word: לַמִּלְחָמָה
  choice: pour livrer bataille
  rationale: Dans le contexte d’un affrontement précis, cette expression française est naturelle et rend la finalité militaire du rassemblement.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: une parcelle de champ
  rationale: חלקה désigne une portion délimitée de terrain; «parcelle de champ» conserve ce caractère concret.
- source_word: מְלֵאָה שְׂעוֹרִים
  choice: couverte d’orge
  rationale: Le texte nomme précisément l’orge. En français, «couverte d’orge» exprime naturellement qu’une parcelle cultivée en était remplie.
- source_word: וְהָעָם
  choice: le peuple
  rationale: La traduction reste générale comme עם, sans préciser «les soldats» ou «les hommes», bien que le contexte soit militaire.
- source_word: נָסוּ מִפְּנֵי פְלִשְׁתִּים
  choice: s’enfuit devant les Philistins
  rationale: «Fuir devant» est un idiome français naturel qui conserve l’image hébraïque d’une retraite face à l’ennemi.
theological_decisions: []
