    issue: Reformulation existentielle de la proposition sur la parcelle
    rationale: « Il y avait là une parcelle de champ » introduit une présentation existentielle absente du texte, qui dit plus directement que la parcelle du champ était pleine d’orge.
  - severity: low
    issue: « Couverte d’orge » est moins précis que le prédicat hébreu
    rationale: מְלֵאָה signifie « pleine ». « Pleine d’orge » préserve plus exactement l’image sans nuire au français.
  revised_text: Il était avec David à Pas-Dammim[a], où les Philistins s’étaient rassemblés pour livrer bataille. La parcelle du champ était pleine d’orge, et le peuple s’enfuit devant les Philistins.
  revised_footnotes:
