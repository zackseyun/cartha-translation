source:
  edition: WLC
  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/תַּעֲמֹ֧ד מִלְחָמָ֛ה בְּ/גֶ֖זֶר עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֞ה סִבְּכַ֣י הַ/חֻֽשָׁתִ֗י אֶת סִפַּ֛י מִ/ילִדֵ֥י הָ/רְפָאִ֖ים וַ/יִּכָּנֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/004.yaml
  text: After this[a], war arose at Gezer with the Philistines. Then Sibbecai the Hushathite struck down Sippai, one of the descendants of the Rephaim[b], and they were subdued.
translation:
  language: fr
  text: Après cela, une guerre éclata à Guézer contre les Philistins. Alors Sibbecaï, le Houshatite, abattit Sippaï[a], l’un des descendants des Rephaïm[b], et ils furent soumis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Saphaï ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « les Rephaïm » ; traditionnellement aussi traduit par « les géants ».'
    reason: lexical_alternative
  - marker: c
    text: Le pronom « ils » désigne probablement les Philistins.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Après cela
  rationale: Transition narrative temporelle naturelle en français moderne, sans reproduire lourdement la formule hébraïque « et il arriva après cela ».
- source_word: וַתַּעֲמֹד מִלְחָמָה
  choice: une guerre éclata
  rationale: L’expression indique le commencement ou la survenue d’un conflit; « éclata » est idiomatique et conserve cette valeur inchoative.
- source_word: בְּגֶזֶר
  choice: à Guézer
  rationale: La préposition française « à » convient au lieu où se déroule le conflit; le nom propre est translittéré selon l’usage français.
- source_word: עִם פְּלִשְׁתִּים
  choice: contre les Philistins
  rationale: Bien que עִם signifie littéralement « avec », le contexte guerrier exprime ici l’opposition; « contre » rend clairement et naturellement cette relation en français.
- source_word: אָז
  choice: Alors
  rationale: Marque simplement la succession des événements dans le récit.
- source_word: הִכָּה
  choice: abattit
  rationale: Dans un contexte de combat, נכה désigne le fait de frapper et de terrasser; « abattit » garde la force martiale sans expliciter davantage le mode de mort.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: Sibbecaï, le Houshatite
  rationale: Translittération française du nom personnel et du gentilé, avec une apposition naturelle.
- source_word: סִפַּי
  choice: Sippaï
  rationale: Translittération correspondant à la vocalisation massorétique; la variante « Saphaï » est signalée en note.
- source_word: מִילִדֵי הָרְפָאִים
  choice: l’un des descendants des Rephaïm
  rationale: יְלִידֵי exprime l’origine ou la descendance. La formulation française explicite naturellement que Sippaï appartient à ce groupe, tandis que « Rephaïm » reste un nom translittéré.
- source_word: וַיִּכָּנֵעוּ
  choice: et ils furent soumis
  rationale: Le nifal de כנע exprime ici la soumission militaire. Le pronom pluriel de l’hébreu est conservé afin de ne pas préciser silencieusement son référent.
theological_decisions:
- issue: Traduction de הָרְפָאִים
  choice: les Rephaïm
  alternative: les géants
  rationale: Le terme peut désigner un peuple ou un clan et ne constitue pas nécessairement une description physique. La translittération évite d’imposer l’interprétation traditionnelle « géants », laquelle est néanmoins indiquée en note.
- issue: Référent du pluriel וַיִּכָּנֵעוּ
  choice: ils furent soumis
  alternative: les Philistins furent soumis
  rationale: Le contexte favorise les Philistins comme référent, mais l’hébreu ne répète pas leur nom. Le maintien du pronom préserve cette légère ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms sont adaptés aux conventions françaises courantes. La syntaxe reste accessible, tandis que la note sur le dernier pronom préserve l’ambiguïté réelle du texte hébreu.
