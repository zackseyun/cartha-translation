  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה בְּ/גַ֑ת וַ/יְהִ֣י אִ֣ישׁ מִדָּ֗ה וְ/אֶצְבְּעֹתָ֤י/ו שֵׁשׁ וָ/שֵׁשׁ֙ עֶשְׂרִ֣ים וְ/אַרְבַּ֔ע וְ/גַם ה֖וּא נוֹלַ֥ד לְ/הָ/רָפָֽא־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/006.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six each, twenty-four in all; he also was born to Rapha.
translation:
  language: fr
  text: Il y eut encore une guerre à Gath. Il y avait là un homme de très grande taille, qui avait six doigts à chaque main et six orteils à chaque pied, soit vingt-quatre en tout. Lui aussi était né de Rapha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « descendait du géant » ou « était l’un des Rephaïm ». L’hébreu dit littéralement « était né du Rapha ».
    reason: Préserver les principales interprétations de la désignation hébraïque singulière הָרָפָא.
lexical_decisions:
- source_word: עוֹד
  choice: encore
  rationale: Dans cette séquence narrative, le mot signale la répétition du conflit.
- source_word: מִלְחָמָה
  choice: une guerre
  rationale: Le nom désigne ici le conflit de manière générale plutôt qu’un affrontement ponctuel.
- source_word: בְּגַת
  choice: à Gath
  rationale: La préposition indique le lieu du conflit; « à Gath » est naturel en français.
- source_word: אִישׁ מִדָּה
  choice: un homme de très grande taille
  rationale: L’expression, littéralement « un homme de mesure/stature », décrit ici une taille corporelle exceptionnelle.
- source_word: אֶצְבְּעֹתָיו שֵׁשׁ וָשֵׁשׁ
  choice: six doigts à chaque main et six orteils à chaque pied
  rationale: Le terme désigne les doigts ou, selon le membre concerné, les orteils. La formulation explicite la répartition impliquée par « six et six » et confirmée par le total de vingt-quatre.
- source_word: עֶשְׂרִים וְאַרְבַּע
  choice: soit vingt-quatre en tout
  rationale: La précision présente le total des doigts et des orteils.
- source_word: וְגַם הוּא
  choice: Lui aussi
  rationale: La tournure rattache cet homme aux autres guerriers de même origine mentionnés dans le contexte.
- source_word: נוֹלַד לְהָרָפָא
  choice: était né de Rapha
  rationale: Cette traduction conserve le singulier et le nom translittéré, sans trancher entre ancêtre individuel, groupe familial et désignation liée aux Rephaïm.
theological_decisions:
- issue: Identité de הָרָפָא
  choice: Rapha, conservé comme désignation ancestrale ou familiale ambiguë
  alternative: « le géant » ou « les Rephaïm »
  rationale: La forme hébraïque est singulière et porte l’article. Dans ce contexte, elle peut renvoyer à un ancêtre, à une lignée ou au groupe associé aux Rephaïm. La translittération évite de résoudre une ambiguïté que le texte ne tranche pas.
translation_notes:
  register: Français international actuel, clair et digne. Les deux premières propositions hébraïques ont été réparties en phrases françaises naturelles. La description des vingt-quatre doigts et orteils est explicitée sans employer de vocabulaire médical.
