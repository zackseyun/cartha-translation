  text: וַ/יְהִ֡י לְ/עֵת֩ תְּשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מְּלָכִ֗ים וַ/יִּנְהַ֣ג יוֹאָב֩ אֶת חֵ֨יל הַ/צָּבָ֜א וַ/יַּשְׁחֵ֣ת אֶת אֶ֣רֶץ בְּנֵֽי עַמּ֗וֹן וַ/יָּבֹא֙ וַ/יָּ֣צַר אֶת רַבָּ֔ה וְ/דָוִ֖יד יֹשֵׁ֣ב בִּ/ירֽוּשָׁלִָ֑ם וַ/יַּ֥ךְ יוֹאָ֛ב אֶת רַבָּ֖ה וַ/יֶּֽהֶרְסֶֽ/הָ׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/001.yaml
  text: And it happened at the time of the turning of the year[a], at the time when kings go out, that Joab led out the army and devastated the land of the Ammonites, and he came and besieged Rabbah. But David stayed in Jerusalem. And Joab struck Rabbah and tore it down.
translation:
  language: fr
  text: Au retour de l’année[a], à l’époque où les rois partent, Joab mena l’armée, ravagea le pays des Ammonites, puis vint et assiégea Rabba. David, lui, resta à Jérusalem. Joab attaqua Rabba et la démolit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « au printemps, à l’époque où les rois partent en campagne ». L’hébreu dit plus littéralement : « au retour de l’année, à l’époque où les rois partent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשׁוּבַת הַשָּׁנָה
  choice: au temps où l’année recommence
  rationale: L’expression évoque littéralement le retour ou le tournant de l’année. Cette formulation française conserve l’image temporelle sans imposer dans le texte principal l’interprétation saisonnière « au printemps ».
- source_word: לְעֵת צֵאת הַמְּלָכִים
  choice: à l’époque où les rois partent
  rationale: Le complément de « partent » reste implicite comme en hébreu. Le contexte militaire permet de comprendre qu’ils partent en campagne, sans qu’il soit nécessaire de l’ajouter au texte.
- source_word: וַיִּנְהַג ... חֵיל הַצָּבָא
  choice: Joab mena l’armée
  rationale: Le verbe exprime l’action de conduire ou d’emmener. « Mena l’armée » rend naturellement en français l’ensemble hébreu, dont les deux noms désignent les forces militaires.
- source_word: וַיַּשְׁחֵת אֶת אֶרֶץ בְּנֵי עַמּוֹן
  choice: ravagea le pays des Ammonites
  rationale: Le verbe désigne ici une destruction infligée au territoire lors d’une campagne. « Ravagea » est précis et naturel; « Ammonites » rend idiomatiquement « fils d’Ammon ».
- source_word: וַיָּצַר
  choice: assiéger
  rationale: 'Ce verbe a ici son sens militaire courant: encercler une ville et lui imposer un siège.'
- source_word: וְדָוִיד יֹשֵׁב בִּירוּשָׁלִָם
  choice: David, lui, resta à Jérusalem
  rationale: Le participe indique une situation qui se prolonge. La dislocation « lui » fait ressortir naturellement le contraste entre David, demeuré à Jérusalem, et Joab en campagne.
- source_word: וַיַּךְ
  choice: attaqua
  rationale: Le verbe hébreu peut signifier frapper, attaquer ou vaincre. Pour une armée agissant contre une ville, « attaqua » est naturel et évite de préciser au-delà du contexte l’issue déjà évoquée par le verbe suivant.
- source_word: וַיֶּהֶרְסֶהָ
  choice: la démolit
  rationale: Le verbe signifie renverser ou démolir. « La démolit » conserve la vigueur du terme et distingue cette destruction de celle du territoire mentionnée plus tôt.
- source_word: רַבָּה
  choice: Rabba
  rationale: Translittération française usuelle du nom de la ville ammonite.
