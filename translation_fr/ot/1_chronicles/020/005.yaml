  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה אֶת פְּלִשְׁתִּ֑ים וַ/יַּ֞ךְ אֶלְחָנָ֣ן בֶּן יעור אֶת לַחְמִי֙ אֲחִי֙ גָּלְיָ֣ת הַ/גִּתִּ֔י וְ/עֵ֣ץ חֲנִית֔/וֹ כִּ/מְנ֖וֹר אֹרְגִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/005.yaml
  text: And there was war with the Philistines again[a], and Elhanan son of Jair struck down Lahmi, the brother of Goliath the Gittite, whose spear shaft was like a weaver’s beam.
translation:
  language: fr
  text: Il y eut encore une guerre contre les Philistins[a]. Elhanan, fils de Jaïr, abattit Lahmi, frère de Goliath de Gath. Le bois de sa lance était comme l’ensouple d’un métier à tisser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le passage parallèle en 2 Samuel 21.19 présente un texte hébreu difficile, souvent discuté en rapport avec ce verset. Le texte des Chroniques dit explicitement qu’Elhanan tua Lahmi, frère de Goliath.
    reason: textual_variant
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: Il y eut encore une guerre
  rationale: Cette tournure française naturelle introduit un nouvel épisode dans une série de conflits; « encore » rend עוֹד dans son contexte.
- source_word: אֶת פְּלִשְׁתִּים
  choice: contre les Philistins
  rationale: Avec « guerre », la préposition « contre » exprime naturellement en français la partie adverse marquée ici par אֶת.
- source_word: וַיַּךְ
  choice: abattit
  rationale: Dans ce contexte guerrier, נכה indique un coup mortel. « Abattit » conserve l’image de frapper tout en exprimant clairement l’issue.
- source_word: אֶלְחָנָן בֶּן יעור
  choice: Elhanan, fils de Jaïr
  rationale: Les noms propres suivent leur forme française usuelle; l’apposition avec virgules est naturelle en français.
- source_word: אֶת לַחְמִי
  choice: Lahmi
  rationale: Le texte massorétique présente לַחְמִי comme le nom propre de l’homme abattu; la marque de l’objet direct אֶת ne se traduit pas.
- source_word: אֲחִי גָּלְיָת
  choice: frère de Goliath
  rationale: La relation fraternelle est explicite dans le texte hébreu et demeure directe en français.
- source_word: הַגִּתִּי
  choice: de Gath
  rationale: Cette formulation française claire rend le gentilé « Gittite » en explicitant son origine géographique sans ajouter d’information.
- source_word: וְעֵץ חֲנִיתוֹ
  choice: Le bois de sa lance
  rationale: La formulation garde le concret de עֵץ, « bois », et reprend sans ambiguïté Lahmi comme possesseur de la lance.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: comme l’ensouple d’un métier à tisser
  rationale: מְנוֹר désigne ici la grosse pièce de bois du métier à tisser. « Ensouple » est le terme français précis, éclairé par son complément.
theological_decisions:
- issue: Rapport avec le récit parallèle difficile de 2 Samuel 21.19, qui peut donner l’impression qu’Elhanan tua Goliath lui-même
  choice: 'Suivre le libellé explicite des Chroniques: Elhanan abattit Lahmi, frère de Goliath.'
  alternative: Modifier ou développer le texte à partir de 2 Samuel, ou interpréter « Lahmi » comme un élément de « Bethléhémite ».
  rationale: La traduction doit rendre le sens du texte hébreu des Chroniques sans y importer ni y résoudre silencieusement la difficulté textuelle du passage parallèle. Une note signale cette difficulté.
translation_notes:
  register: Français international moderne, digne et lisible. « Ensouple » est un terme technique précis, immédiatement clarifié par « d’un métier à tisser ». La syntaxe reste proche de l’hébreu sans être artificielle.
