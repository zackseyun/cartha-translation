  text: וַ/יְחָרֵ֖ף אֶת יִשְׂרָאֵ֑ל וַ/יַּכֵּ֨/הוּ֙ יְה֣וֹנָתָ֔ן בֶּן שִׁמְעָ֖א אֲחִ֥י דָוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/007.yaml
  text: And when he taunted Israel[a], Jonathan son of Shimea, David’s brother, struck him down.
translation:
  language: fr
  text: Il insulta Israël[a], et Jonathan, fils de Shiméa — le frère de David —, l’abattit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « défia Israël ». Le verbe hébreu peut évoquer aussi bien l’outrage méprisant que le défi ouvert.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: il provoqua
  rationale: Le verbe חרף exprime ici une parole insultante et provocatrice dirigée contre Israël. « Provoqua » rend naturellement en français moderne cette dimension de défi verbal, tandis que la note conserve l’autre nuance importante.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte désigne directement l’entité collective Israël; le nom peut naturellement représenter le peuple tout entier en français.
- source_word: וַיַּכֵּהוּ
  choice: l’abattit
  rationale: Dans ce récit de combat, נכה désigne un coup mortel. « L’abattit » communique sobrement l’issue létale sans remplacer l’action par le seul résultat « le tua ».
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom.
- source_word: בֶּן שִׁמְעָא
  choice: fils de Shiméa
  rationale: La relation filiale est rendue directement; « Shiméa » est une translittération française claire du nom hébreu.
- source_word: אֲחִי דָוִיד
  choice: frère de David
  rationale: Rend exactement la construction hébraïque tout en restant naturelle en français.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La coordination hébraïque est conservée sans lourdeur; « Puis » marque la progression du récit. La virgule encadre clairement l’apposition « fils de Shiméa, frère de David » sans trancher autrement que le texte la relation grammaticale de « frère de David ».
