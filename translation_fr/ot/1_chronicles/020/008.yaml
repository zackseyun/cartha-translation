review_pass:
  verdict: revise
  source_fidelity: Le démonstratif, la naissance/ascendance, Gath, la chute au combat et la double agentivité de David et de ses serviteurs sont bien rendus. Toutefois, « issus du Rapha » présente Rapha comme une désignation de groupe avec article et affaiblit la possibilité, retenue par le texte anglais principal, d’un ancêtre nommé Rapha. « Nés de Rapha » rend plus directement נוּלְּדוּ לְהָרָפָא, tandis que la note conserve l’analyse alternative.
  naturalness: « Ceux-là » et « tombèrent » conviennent au registre biblique moderne. En revanche, « tombèrent de la main de » n’est pas idiomatique en français pour exprimer l’agent d’une mort; « tombèrent sous la main de » est une formulation claire, littéraire et naturelle qui conserve l’image hébraïque.
  terminology: « Rapha » est conservé sans introduire « géant » dans le texte. La note doit éviter de faire des Rephaïm une identification certaine et présenter le lien comme possible.
  issues:
  - severity: medium
    issue: Expression française de l’agentivité
    rationale: « Tomber de la main de David » suggère une provenance ou une chute physique depuis une main. L’hébreu בְּיַד exprime ici l’agent; « sous la main de » transmet naturellement cette valeur en français.
  - severity: low
    issue: Portée de « du Rapha »
    rationale: La forme française avec article oriente fortement vers une appellation de lignée, alors que l’hébreu permet aussi de comprendre Rapha comme un ancêtre éponyme. Employer « de Rapha » dans le texte et réserver « du Rapha » à la variante en note préserve mieux l’ambiguïté.
