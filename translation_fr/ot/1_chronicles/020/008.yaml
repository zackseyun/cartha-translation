  text: אֵ֛ל נוּלְּד֥וּ לְ/הָ/רָפָ֖א בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖יד וּ/בְ/יַד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/008.yaml
  text: These were born to Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: fr
  text: Ceux-là étaient nés de Rapha à Gath[a], et ils tombèrent sous la main de David et sous celle de ses serviteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du Rapha » ; l’expression pourrait désigner des descendants des Rephaïm, c’est-à-dire une lignée de géants à Gath.'
    reason: La forme hébraïque peut désigner soit un ancêtre nommé Rapha, soit une lignée liée aux Rephaïm.
lexical_decisions:
- source_word: אֵל
  choice: Ceux-là
  rationale: Le démonstratif renvoie aux guerriers mentionnés précédemment. « Ceux-là » reste autonome et n’ajoute pas un nom absent de l’hébreu.
- source_word: נוּלְּדוּ
  choice: étaient issus
  rationale: Le nifal de ילד signifie littéralement « étaient nés ». Dans ce contexte généalogique, « étaient issus » exprime naturellement en français l’idée de naissance et de filiation sans préciser indûment le degré de descendance.
- source_word: לְהָרָפָא
  choice: du Rapha
  rationale: La forme singulière avec article peut désigner un ancêtre éponyme ou une lignée. « du Rapha » conserve cette désignation inhabituelle au lieu de la remplacer par « géant » ou par le pluriel « Rephaïm ».
- source_word: בְּגַת
  choice: à Gath
  rationale: La préposition בְּ a ici une valeur locative; « à Gath » est la tournure française normale avec un nom de ville.
- source_word: וַיִּפְּלוּ
  choice: et ils tombèrent
  rationale: « Tombèrent » conserve l’image du verbe נפל tout en évoquant clairement la mort ou la défaite dans ce contexte guerrier.
- source_word: בְיַד
  choice: de la main de
  rationale: La tournure conserve l’image hébraïque de la main comme expression de l’agent, avec une formulation française littéraire mais claire.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: « Serviteurs » rend directement עֲבָדִים; dans le cadre royal et militaire, il désigne les hommes au service de David sans réduire explicitement leur rôle à celui de soldats.
theological_decisions:
- issue: Identité de הָרָפָא
  choice: Une personne ou lignée désignée comme « le Rapha », sans l’identifier explicitement à un géant
  alternative: Rapha comme ancêtre personnel; « le géant »; les Rephaïm
  rationale: L’hébreu emploie une forme singulière avec article, non le pluriel habituel « Rephaïm ». Le texte principal et la note préservent donc l’incertitude entre ancêtre éponyme et groupe familial, sans imposer l’interprétation des géants.
translation_notes:
  register: Français international moderne, digne et légèrement littéraire. La répétition hébraïque de « la main » est allégée par « celle », tout en conservant l’image et les deux agents. Le terme inhabituel « le Rapha » est maintenu afin de préserver l’ambiguïté du texte source.
