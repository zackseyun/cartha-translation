- from: Ceux-là étaient issus du Rapha[a], à Gath, et ils tombèrent de la main de David et de celle de ses serviteurs.
  to: Ceux-là étaient nés de Rapha à Gath[a], et ils tombèrent sous la main de David et sous celle de ses serviteurs.
  rationale: La révision remplace une tournure d’agentivité non idiomatique par « sous la main de », conserve la répétition des deux agents, et rend Rapha comme nom propre dans le texte principal. La note maintient sans la trancher la possibilité d’une désignation clanique liée aux Rephaïm.
