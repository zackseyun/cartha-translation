  text: וַ/יִּקַּ֣ח דָּוִ֣יד אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וַֽ/יִּמְצָאָ֣/הּ מִשְׁקַ֣ל כִּכַּר זָהָ֗ב וּ/בָ/הּ֙ אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑יד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/002.yaml
  text: And David took the crown of their king from his head and found that it weighed a talent of gold, and in it was a precious stone; and it was placed on David’s head. And he carried off very much plunder from the city.
translation:
  language: fr
  text: David prit la couronne de leur roi[a] de dessus sa tête. Il constata qu’elle pesait un talent[b] d’or et qu’une pierre précieuse s’y trouvait. Elle se trouva sur la tête de David. Il emporta aussi une très grande quantité de butin de la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de Milkom » (ou « Malkam »), si מַלְכָּם est compris comme le nom du dieu des Ammonites plutôt que comme « leur roi ».
    reason: alternative_reading
  - marker: b
    text: Le talent était une importante unité de poids ancienne, souvent estimée à environ 34 kilogrammes, mais sa valeur exacte variait.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: couronne
  rationale: Terme français courant et digne pour une coiffure royale; « diadème » serait possible, mais moins naturel ici.
- source_word: מַלְכָּם
  choice: leur roi
  rationale: La forme se comprend naturellement comme מֶלֶךְ avec suffixe de troisième personne du masculin pluriel. La suite « de dessus sa tête » favorise un référent humain; la lecture comme nom divin est conservée en note.
- source_word: מֵעַל רֹאשׁוֹ
  choice: de dessus sa tête
  rationale: Rend concrètement la préposition hébraïque et convient à l’action de retirer une couronne.
- source_word: וַיִּמְצָאָהּ מִשְׁקַל כִּכַּר זָהָב
  choice: Il constata qu’elle pesait un talent d’or
  rationale: Expression française naturelle du poids découvert, sans convertir l’unité ancienne dans le texte.
- source_word: וּבָהּ אֶבֶן יְקָרָה
  choice: elle était ornée d’une pierre précieuse
  rationale: Rend idiomatiquement la présence de la pierre sur la couronne sans préciser indûment la nature de la gemme.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִיד
  choice: Elle fut placée sur la tête de David
  rationale: Exprime naturellement en français le passage de la couronne de la tête du roi à celle de David; le passif demeure une explicitation contextuelle du littéral « elle fut sur ».
- source_word: וּשְׁלַל הָעִיר הוֹצִיא
  choice: Il emporta aussi […] de butin de la ville
  rationale: « Butin » est le terme militaire moderne; « emporta » traduit la sortie et l’enlèvement du butin.
- source_word: הַרְבֵּה מְאֹד
  choice: une très grande quantité
  rationale: Formulation française naturelle qui conserve la forte insistance quantitative.
theological_decisions:
- issue: 'Référent de מַלְכָּם : le roi des Ammonites ou la divinité ammonite Milkom/Malkam'
  choice: leur roi
  alternative: Milkom (ou Malkam)
  rationale: La morphologie et le pronom singulier de « sa tête » soutiennent bien « leur roi », mais la vocalisation consonantique permet aussi le nom de la divinité ammonite. Cette ambiguïté réelle est signalée sans être éliminée.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases sont légèrement segmentées pour la lisibilité. Les marqueurs [a] et [b] figurent immédiatement après les expressions concernées.
