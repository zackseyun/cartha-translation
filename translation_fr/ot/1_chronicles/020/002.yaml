  to: David prit la couronne de leur roi[a] de dessus sa tête. Il constata qu’elle pesait un talent[b] d’or et qu’une pierre précieuse s’y trouvait. Elle se trouva sur la tête de David. Il emporta aussi une très grande quantité de butin de la ville.
  rationale: 'Les deux corrections limitent la traduction aux assertions du texte hébreu : la pierre est simplement présente dans la couronne, et la couronne se trouve sur la tête de David sans qu’une action de pose soit explicitement introduite. Les notes, leurs marqueurs et le sens du passage sont conservés.'
