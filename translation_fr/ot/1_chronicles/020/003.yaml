source:
  edition: WLC
  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֨שַׂר בַּ/מְּגֵרָ֜ה וּ/בַ/חֲרִיצֵ֤י הַ/בַּרְזֶל֙ וּ/בַ/מְּגֵר֔וֹת וְ/כֵן֙ יַעֲשֶׂ֣ה דָוִ֔יד לְ/כֹ֖ל עָרֵ֣י בְנֵי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛יד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/003.yaml
  text: He brought out the people who were in it and put them to work with saws[a], iron tools, and axes. Thus David did to all the cities of the Ammonites[b]. Then David and all the people returned to Jerusalem.
translation:
  language: fr
  text: Il fit sortir les gens qui s’y trouvaient et les mit au travail[a] avec des scies, des outils de fer et des haches[b]. David agit de même envers toutes les villes des Ammonites. Puis David et tout le peuple retournèrent à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, peut-être : « les plaça sous des scies, des traîneaux de battage en fer et des instruments tranchants ». Certains, notamment à la lumière de 2 Samuel 12.31, comprennent que David les fit exécuter au moyen de ces instruments.'
    reason: alternative_reading
  - marker: b
    text: Les mots hébreux désignant ces outils sont en partie incertains ; il pourrait s’agir plus généralement d’instruments de fer tranchants.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: fit sortir
  rationale: Le hiphil de יצא exprime naturellement l’action de faire sortir les habitants de la ville; cette formulation concrète et idiomatique conserve ce sens.
- source_word: וַיָּשַׂר
  choice: les mit au travail
  rationale: Le verbe est difficile. Dans la formulation propre aux Chroniques, il peut désigner l’affectation des captifs à un travail réalisé avec les instruments énumérés. La traduction principale évite d’importer automatiquement le sens plus violent souvent attribué au parallèle de 2 Samuel 12.31, tout en signalant cette autre lecture en note.
- source_word: בַּמְּגֵרָה
  choice: avec des scies
  rationale: מְגֵרָה désigne une scie. Le pluriel français convient à une liste générale d’instruments de travail.
- source_word: בַּחֲרִיצֵי הַבַּרְזֶל
  choice: des outils de fer
  rationale: Le terme désigne des objets acérés ou tranchants, mais leur forme exacte reste incertaine. « Outils de fer » demeure lisible sans imposer une précision que l’hébreu ne garantit pas.
- source_word: וּבַמְּגֵרוֹת
  choice: et des haches
  rationale: Le terme est difficile et ressemble au mot précédent rendu par « scies ». Dans ce contexte, « haches » permet de rendre un autre type plausible d’instrument tranchant; l’incertitude lexicale est indiquée en note.
- source_word: וְכֵן יַעֲשֶׂה
  choice: David agit de même
  rationale: La tournure récapitule ce que David fit dans l’ensemble des villes ammonites. Le passé simple rend naturellement la narration française, tandis que « de même » conserve la valeur de וכן.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: envers toutes les villes des Ammonites
  rationale: « Ammonites » est l’ethnonyme français naturel pour בְנֵי עַמּוֹן; « envers » exprime ici l’action appliquée à chacune de leurs villes.
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: retournèrent à Jérusalem
  rationale: שוב suivi d’une destination signifie couramment « retourner ». Le pluriel s’accorde naturellement avec le sujet composé « David et tout le peuple ».
theological_decisions:
- issue: Le verset décrit-il la mise au travail forcé des Ammonites ou leur exécution au moyen de ces instruments ?
  choice: Le texte principal présente David mettant les captifs au travail avec les instruments énumérés.
  alternative: Le passage peut être compris, notamment à la lumière de 2 Samuel 12.31, comme décrivant leur exécution au moyen de scies et d’instruments de fer.
  rationale: La formulation des Chroniques diffère de celle du parallèle de Samuel et permet une lecture liée au travail imposé. La traduction ne doit donc pas importer silencieusement dans ce verset la lecture plus violente du texte parallèle. Comme l’hébreu demeure difficile et que l’enjeu est important, l’autre interprétation est explicitement conservée en note.
translation_notes:
  register: Français international moderne, narratif et digne. « Les gens qui s’y trouvaient » reste accessible sans affaiblir la référence aux habitants capturés; « les mit au travail » est idiomatique et laisse la note préserver l’ambiguïté historique et théologique du passage.
