  text: 'The sons of Uzziel: Micah the first[b][a], and Isshiah the second.'
translation:
  language: fr
  text: 'Les fils d’Ouzziel : Mika, le premier[a], et Yishshiya[b], le second.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chef » ; littéralement, en hébreu, « la tête ».
    reason: lexical_alternative
  - marker: b
    text: Ce nom est aussi transcrit « Isshiah », « Ishshiah » ou « Jeshaiah ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן introduit ici les deux fils nommés d’Ouzziel. « Les fils de » est direct et naturel dans ce contexte généalogique.
- source_word: עֻזִּיאֵל
  choice: Ouzziel
  rationale: Translittération française usuelle de ce nom propre hébreu.
- source_word: מִיכָה
  choice: Mika
  rationale: Translittération claire et proche de la forme hébraïque, adaptée au français moderne.
- source_word: הָרֹאשׁ
  choice: le premier
  rationale: רֹאשׁ signifie littéralement « tête » et peut désigner le chef ou celui qui occupe le premier rang. En parallèle avec « le second », « le premier » rend naturellement le sens ordinal probable sans effacer l’autre lecture, signalée en note.
- source_word: וְיִשִּׁיָּה
  choice: et Yishiya
  rationale: Le nom est translittéré au plus près de la forme consonantique hébraïque, avec la conjonction rendue par « et ».
- source_word: הַשֵּׁנִי
  choice: le second
  rationale: L’adjectif ordinal désigne le deuxième des deux fils mentionnés; « le second » convient naturellement à une série de deux.
