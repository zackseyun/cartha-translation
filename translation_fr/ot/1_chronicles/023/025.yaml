source:
  edition: WLC
  text: כִּ֚י אָמַ֣ר דָּוִ֔יד הֵנִ֛יחַ יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל לְ/עַמּ֑/וֹ וַ/יִּשְׁכֹּ֥ן בִּ/ירוּשָׁלִַ֖ם עַד לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/025.yaml
  text: For David said[a], “Yahweh, the God of Israel, has given rest to his people, and he has dwelt in Jerusalem forever.”
translation:
  language: fr
  text: 'Car David a dit : « Yahweh, le Dieu d’Israël, a accordé le repos à son peuple, et il demeure[a] à Jérusalem pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il s’est établi » ou « il demeurera ». Le verbe hébreu peut présenter la demeure de Yahweh comme une réalité établie et durable, ou comme appelée à se poursuivre.'
    reason: Lecture temporelle alternative de la forme verbale hébraïque.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication de l’instruction précédente ; « Car » en conserve clairement la valeur causale.
- source_word: אָמַר דָּוִיד
  choice: David avait dit
  rationale: Le plus-que-parfait situe naturellement cette déclaration antérieure de David comme fondement de la disposition rapportée dans le contexte, sans modifier son contenu.
- source_word: הֵנִיחַ
  choice: a accordé le repos
  rationale: Le hiphil de נוח exprime l’action de procurer le repos ou la sécurité. « Accorder le repos » rend à la fois la valeur causative et le résultat durable.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la présence explicite du tétragramme dans le texte hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette construction génitivale, en apposition à « Yahweh », reçoit sa formulation française directe et habituelle.
- source_word: לְעַמּוֹ
  choice: à son peuple
  rationale: La préposition לְ indique ici le bénéficiaire de l’action de donner le repos.
- source_word: וַיִּשְׁכֹּן
  choice: et il demeure
  rationale: Le verbe שכן désigne le fait d’habiter ou de demeurer. Le présent français exprime naturellement l’état établi et durable visé dans la déclaration, tout en signalant en note les autres valeurs temporelles possibles de la forme hébraïque.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: « À » est la préposition française idiomatique pour indiquer le séjour dans une ville.
- source_word: עַד לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression rend clairement la durée indéfinie et permanente exprimée par l’hébreu, sans archaïsme.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin ; sa translittération préserve cette donnée plutôt que de lui substituer un titre.
- issue: Valeur temporelle de la demeure de Yahweh à Jérusalem
  choice: il demeure à Jérusalem pour toujours
  alternative: il demeurera à Jérusalem pour toujours ; il s’est établi à Jérusalem pour toujours
  rationale: Dans l’enchaînement de la citation, la forme hébraïque peut présenter l’installation ou la demeure de Yahweh comme une réalité établie, durable ou prospective. Le présent français conserve l’idée centrale d’une présence durable sans trancher excessivement la valeur temporelle ; la note explicite l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Accorder le repos » conserve l’expression biblique tout en restant naturelle ; le présent « demeure » évite une précision temporelle excessive et la note maintient l’ambiguïté de l’hébreu.
