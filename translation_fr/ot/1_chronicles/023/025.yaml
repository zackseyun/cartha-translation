  - severity: low
    issue: Note temporelle incomplète pour « il demeure »
    rationale: La note ne mentionne que le futur, alors que la forme peut également être comprise comme décrivant une installation ou une demeure déjà établie. L’ajout de cette possibilité explique mieux le présent retenu sans imposer une analyse unique.
