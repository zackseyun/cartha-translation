  verdict: revise
  source_fidelity: « Car » rend bien כִּי dans sa fonction explicative. « David avait dit » introduit toutefois un plus-que-parfait que la forme hébraïque אָמַר ne requiert pas; « David a dit » reproduit plus directement l’énoncé. Pour וַיִּשְׁכֹּן, le présent « il demeure » est une bonne restitution française de la présence établie et durable dans la citation, à condition que la note n’exclue pas la nuance accomplie de la forme verbale.
  naturalness: Le français est moderne, clair et d’un registre biblique accessible. « Yahweh », « le Dieu d’Israël », « a accordé le repos » et « à Jérusalem pour toujours » sont naturels. « David a dit » est plus direct et moins interprétatif que « David avait dit ».
  terminology: Le nom divin Yahweh est traité de manière cohérente. « Accorder le repos » conserve la valeur causative de הֵנִיחַ. La note est ajustée pour présenter sans parti pris la lecture d’une demeure établie ainsi que la lecture prospective signalée dans l’audit anglais.
