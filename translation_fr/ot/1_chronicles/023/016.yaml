  text: 'The sons of Gershom: Shebuel the chief[a].'
translation:
  language: fr
  text: 'Fils de Gershom : Shebuel, le chef.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tête » (c’est-à-dire celui qui est à la tête).
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Fils de
  rationale: Le pluriel construit de בֵּן introduit ici une lignée dans une liste généalogique et administrative. « Fils de » reste direct et naturel, sans élargir explicitement le sens à « descendants ».
- source_word: גֵרְשׁוֹם
  choice: Gershom
  rationale: Le nom propre est translittéré selon la forme hébraïque présente ici, distincte de Gershon.
- source_word: שְׁבוּאֵל
  choice: Shebuel
  rationale: Translittération française claire du nom propre hébreu.
- source_word: הָרֹאשׁ
  choice: le chef
  rationale: Dans cette liste d’organisation des Lévites, רֹאשׁ muni de l’article désigne vraisemblablement celui qui occupe la position principale ou dirige. « Le chef » est idiomatique en français moderne, tandis que « la tête » conserve plus littéralement l’image hébraïque.
