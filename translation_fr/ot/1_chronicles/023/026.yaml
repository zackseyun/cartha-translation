  revision_rationale: La révision remplace « ni tous les objets » par « et tous les objets », afin de préserver la coordination et la totalité exprimées par וְאֶת כָּל־כֵּלָיו sans créer une ambiguïté française de portée. La note est légèrement lissée pour présenter plus clairement la tournure littérale.
