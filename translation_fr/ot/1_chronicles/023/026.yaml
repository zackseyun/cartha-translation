revisions:
- from: De plus, les Lévites n’auront plus à porter[a] le tabernacle ni tous les objets utilisés pour son service.
  to: De plus, les Lévites n’auront plus à porter[a] le tabernacle et tous les objets utilisés pour son service.
  rationale: La révision remplace « ni tous les objets » par « et tous les objets », afin de préserver la coordination et la totalité exprimées par וְאֶת כָּל־כֵּלָיו sans créer une ambiguïté française de portée. La note est légèrement lissée pour présenter plus clairement la tournure littérale.
