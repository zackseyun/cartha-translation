  text: וְ/גַ֖ם לַ/לְוִיִּ֑ם אֵין לָ/שֵׂ֧את אֶת הַ/מִּשְׁכָּ֛ן וְ/אֶת כָּל כֵּלָ֖י/ו לַ/עֲבֹדָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/026.yaml
  text: And also[a], the Levites no longer need to carry the tabernacle and all its utensils for its service.
translation:
  language: fr
  text: De plus, les Lévites n’auront plus à porter[a] le tabernacle et tous les objets utilisés pour son service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’y a pas à porter pour les Lévites »; on peut aussi comprendre : « les Lévites n’ont pas à porter ».'
    reason: La construction hébraïque אֵין avec l’infinitif exprime l’absence de nécessité ou de tâche à accomplir; la nuance temporelle « plus » découle du contexte plutôt que d’un adverbe explicite.
lexical_decisions:
- source_word: וְגַם
  choice: De plus
  rationale: Cette expression conserve la valeur à la fois connective et additive de la formule hébraïque, dans un français naturel.
- source_word: לַלְוִיִּם
  choice: les Lévites
  rationale: La préposition ל marque ici les personnes concernées par l’absence d’obligation; le français les présente naturellement comme sujet de la proposition.
- source_word: אֵין לָשֵׂאת
  choice: n’auront plus à porter
  rationale: Littéralement, la tournure exprime qu’il n’y a pas, pour eux, à porter. Dans le contexte de l’installation durable du sanctuaire et de la réorganisation des fonctions lévitiques, elle indique que ce transport ne leur incombera plus, plutôt qu’une interdiction morale.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: « Tabernacle » est le terme français traditionnel, précis et largement compris pour la demeure cultuelle mobile d’Israël.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: ni tous les objets
  rationale: כֵּלִים est un terme large désignant des objets, récipients, instruments ou équipements. Sous la négation, « ni » rend naturellement la coordination hébraïque וְ, tandis que « tous » préserve כָּל.
- source_word: לַעֲבֹדָתוֹ
  choice: utilisés pour son service
  rationale: Le suffixe masculin singulier renvoie le plus naturellement au tabernacle. Cette formulation indique clairement que ces objets sont destinés à son service cultuel.
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et accessible. « Porter » maintient le vocabulaire concret du texte; « objets utilisés pour son service » évite de limiter le terme hébreu à des ustensiles ou à des récipients.
