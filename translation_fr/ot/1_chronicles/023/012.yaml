  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel—four.'
translation:
  language: fr
  text: 'Fils de Qehath : Amram, Yitsehar, Hébron et Ouzziel — quatre en tout.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Fils de
  rationale: Le pluriel construit introduit ici la liste généalogique des quatre fils nommés. La tournure concise « Fils de » convient naturellement à ce type de liste.
- source_word: קְהָת
  choice: Qehath
  rationale: Translittération française qui rend la consonne initiale hébraïque et correspond à une forme biblique française reconnue.
- source_word: עַמְרָם
  choice: Amram
  rationale: Forme française traditionnelle et transparente du nom propre.
- source_word: יִצְהָר
  choice: Yitsehar
  rationale: Translittération française lisible qui rend les principales consonnes du nom hébreu, notamment le yod initial et le tsadé.
- source_word: חֶבְרוֹן
  choice: Hébron
  rationale: Forme française usuelle du nom propre; le contexte généalogique indique qu’il s’agit ici d’une personne.
- source_word: וְעֻזִּיאֵל
  choice: et Ouzziel
  rationale: La conjonction est rendue par « et »; « Ouzziel » est une forme française lisible et établie du nom.
- source_word: אַרְבָּעָה
  choice: quatre en tout
  rationale: Le nombre récapitule les personnes énumérées. « Quatre en tout » exprime clairement cette fonction en français naturel sans ajouter d’information.
