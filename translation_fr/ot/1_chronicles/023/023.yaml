  text: בְּנֵ֣י מוּשִׁ֗י מַחְלִ֥י וְ/עֵ֛דֶר וִ/ירֵמ֖וֹת שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/023.yaml
  text: 'The sons of Mushi: Mahli[a], Eder, and Jeremoth—three.'
translation:
  language: fr
  text: 'Les fils de Moushi : Mahli, Éder et Yerémoth — trois en tout.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit de « fils » introduit ici une liste généalogique de trois personnes nommées. La traduction directe « les fils de » convient mieux que le terme plus large « les descendants de ».
- source_word: מוּשִׁי
  choice: Moushi
  rationale: Nom propre translittéré sous une forme naturelle en français, où « ou » représente la voyelle /u/.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Nom propre translittéré ; le groupe « hl » conserve la distinction consonantique du nom hébreu sans adopter une graphie française traditionnelle moins transparente.
- source_word: וְעֵדֶר
  choice: Éder
  rationale: La conjonction est rendue dans la coordination française de la liste ; le nom propre est translittéré avec un accent initial correspondant à la prononciation française.
- source_word: וִירֵמוֹת
  choice: et Yerémoth
  rationale: La conjonction est explicitement rendue devant le dernier élément. « Yerémoth » représente le yod initial par « Y » et suit une forme française lisible du nom.
- source_word: שְׁלֹשָׁה
  choice: trois en tout
  rationale: Le cardinal récapitule le nombre de fils énumérés. « En tout » explicite naturellement en français sa fonction récapitulative sans modifier le contenu.
