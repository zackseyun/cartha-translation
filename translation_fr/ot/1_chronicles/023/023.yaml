translation_notes:
  register: 'Formulation généalogique brève, digne et naturelle en français moderne. Le deux-points introduit la liste et le tiret met en relief le total récapitulatif. Aucune note n’est reprise : la variante orthographique anglaise « Jeremoth/Jerimoth » ne constitue pas à elle seule une variante pertinente pour la traduction française.'
