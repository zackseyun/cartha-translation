lexical_decisions:
- source_word: בְּנֵי
  choice: Fils de
  rationale: Le pluriel construit de בֵּן introduit ici une liste généalogique immédiate. « Fils de » reproduit directement et naturellement cette structure en français.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nom propre transcrit selon sa forme française biblique courante.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Nom propre transcrit de façon cohérente dans ses deux occurrences, d’abord comme fils de Merari, puis comme père d’Éléazar et de Qish.
- source_word: וּמוּשִׁי
  choice: et Mouchi
  rationale: La conjonction וּ est rendue par « et »; le nom est transcrit sous la forme française biblique courante « Mouchi ».
- source_word: בְּנֵי מַחְלִי
  choice: Fils de Mahli
  rationale: La répétition de la rubrique généalogique hébraïque est conservée afin de rendre clairement la subdivision de la lignée.
- source_word: אֶלְעָזָר
  choice: Éléazar
  rationale: Nom propre rendu sous sa forme française biblique courante, avec les accents usuels.
- source_word: וְקִישׁ
  choice: et Qish
  rationale: La conjonction est rendue par « et » et le nom קִישׁ par « Qish », translittération française qui distingue la consonne initiale qoph.
