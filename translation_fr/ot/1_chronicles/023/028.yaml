  text: כִּ֣י מַעֲמָדָ֞/ם לְ/יַד בְּנֵ֣י אַהֲרֹ֗ן לַ/עֲבֹדַת֙ בֵּ֣ית יְהוָ֔ה עַל הַ/חֲצֵרוֹת֙ וְ/עַל הַ/לְּשָׁכ֔וֹת וְ/עַֽל טָהֳרַ֖ת לְ/כָל קֹ֑דֶשׁ וּ/מַֽעֲשֵׂ֔ה עֲבֹדַ֖ת בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/028.yaml
  text: For their duty was to assist the sons of Aaron in the service of the house of Yahweh, concerning the courts and the chambers, and the purification of all that is holy, and the work of the service of the house of God.
translation:
  language: fr
  text: 'Car leur fonction[a] était d’assister[b] les fils d’Aaron dans le service de la maison de Yahweh : ils étaient chargés des parvis et des chambres, de la purification de tout ce qui est saint[c] et des travaux du service de la maison de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur poste » ou « leur charge ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à la main des fils d’Aaron », expression qui peut signifier être à leurs côtés ou les assister.
    reason: lexical_alternative
  - marker: c
    text: Ou « la purification de toute chose sainte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: Introduit ici une explication de la mission confiée aux lévites dans le contexte précédent.
- source_word: מַעֲמָדָם
  choice: leur fonction
  rationale: Le nom désigne leur position ou charge assignée; « fonction » exprime naturellement en français cette responsabilité officielle.
- source_word: לְיַד בְּנֵי אַהֲרֹן
  choice: d’assister les fils d’Aaron
  rationale: Littéralement « à la main/aux côtés des fils d’Aaron »; dans ce contexte, l’expression décrit le rôle de soutien des lévites sans préciser davantage la nature de l’autorité.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: dans le service de la maison de Yahweh
  rationale: עֲבֹדָה désigne le service cultuel, et « maison » conserve la désignation traditionnelle du Temple.
- source_word: עַל הַחֲצֵרוֹת וְעַל הַלְּשָׁכוֹת
  choice: en ce qui concerne les cours, les salles
  rationale: עַל introduit ici les domaines relevant de leur responsabilité; « cours » et « salles » sont des termes architecturaux clairs et naturels.
- source_word: וְעַל טָהֳרַת לְכָל קֹדֶשׁ
  choice: la purification de tout ce qui est saint
  rationale: Cette formulation conserve la portée collective de קֹדֶשׁ et le caractère rituel de טָהֳרָה sans préciser des objets que l’hébreu ne nomme pas.
- source_word: וּמַעֲשֵׂה עֲבֹדַת בֵּית הָאֱלֹהִים
  choice: et les tâches du service de la maison de Dieu
  rationale: « Tâches du service » rend de manière naturelle l’association de מַעֲשֵׂה et עֲבֹדַת tout en maintenant son sens administratif général.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Relation des lévites avec les prêtres aaroniques dans לְיַד בְּנֵי אַהֲרֹן
  choice: d’assister les fils d’Aaron
  alternative: d’être aux côtés des fils d’Aaron
  rationale: « Assister » rend la fonction de soutien indiquée par l’expression, sans imposer une conception plus précise de la hiérarchie que celle qu’exprime le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe explicative du verset est conservée, tandis que les expressions administratives et cultuelles sont rendues sans archaïsme excessif.
