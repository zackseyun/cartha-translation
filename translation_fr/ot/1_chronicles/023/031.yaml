source:
  edition: WLC
  text: וּ/לְ/כֹ֨ל הַעֲל֤וֹת עֹלוֹת֙ לַ/יהוָ֔ה לַ/שַּׁבָּת֔וֹת לֶ/חֳדָשִׁ֖ים וְ/לַ/מֹּעֲדִ֑ים בְּ/מִסְפָּ֨ר כְּ/מִשְׁפָּ֧ט עֲלֵי/הֶ֛ם תָּמִ֖יד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/031.yaml
  text: and for all the burnt offerings offered to Yahweh on the Sabbaths[a], at the new moons, and at the appointed feasts, by number according to the ordinance concerning them, continually before Yahweh.
translation:
  language: fr
  text: et pour offrir à Yahweh tous les holocaustes[a], aux sabbats, aux nouvelles lunes et aux fêtes fixées, en nombre, selon la règle qui les concerne, continuellement devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et pour tout le fait d’offrir des holocaustes ». L’hébreu associe l’infinitif « faire monter » au nom « holocaustes » pour désigner l’acte sacrificiel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל הַעֲלוֹת עֹלוֹת
  choice: et pour offrir à Yahweh tous les holocaustes
  rationale: L’infinitif de עלה suivi du nom עֹלוֹת exprime l’action de faire monter, c’est-à-dire d’offrir, les holocaustes. Cette formulation française reste naturelle tout en conservant l’idée de totalité portée par כֹל.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition indique le destinataire de l’offrande; le nom divin יהוה est transcrit « Yahweh ».
- source_word: לַשַּׁבָּתוֹת
  choice: les jours de sabbat
  rationale: La préposition marque ici les occasions du calendrier cultuel. Le pluriel hébreu est rendu par une expression française idiomatique.
- source_word: לֶחֳדָשִׁים
  choice: aux nouvelles lunes
  rationale: Dans ce contexte cultuel, חֳדָשִׁים désigne les célébrations de la nouvelle lune, et non simplement les mois.
- source_word: וְלַמֹּעֲדִים
  choice: et lors des fêtes fixées
  rationale: מוֹעֲדִים désigne les temps de fête établis dans le calendrier sacré; « fêtes fixées » conserve à la fois les notions de célébration et de temps déterminé.
- source_word: בְּמִסְפָּר כְּמִשְׁפָּט עֲלֵיהֶם
  choice: selon le nombre prescrit pour chacune de ces occasions
  rationale: Le syntagme indique que le nombre des sacrifices devait correspondre à la règle applicable. « Ces occasions » explicite l’antécédent probable sans déterminer davantage que ne le permet le contexte.
- source_word: תָּמִיד לִפְנֵי יְהוָה
  choice: continuellement devant Yahweh
  rationale: תָּמִיד exprime la régularité durable du service, et « devant Yahweh » conserve l’expression cultuelle de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom d’alliance sans le remplacer par un titre.
- issue: Référent de עֲלֵיהֶם dans la prescription numérique
  choice: pour chacune de ces occasions
  alternative: à leur sujet
  rationale: Le masculin pluriel peut renvoyer aux sabbats, nouvelles lunes et fêtes mentionnés juste avant. La formulation choisie rend ce lien probable, tandis que la note implicite de prescription est portée par מִשְׁפָּט.
translation_notes:
  register: Français international moderne, digne et lisible. Le verset conserve sa forme syntaxiquement dépendante du contexte précédent. « Holocaustes » est maintenu comme terme cultuel établi; « fêtes fixées » évite de réduire מוֹעֲדִים à de simples rendez-vous profanes.
