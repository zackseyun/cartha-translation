  rationale: La révision rétablit une série temporelle française régulière et remplace l’explicitation restrictive de l’antécédent par « la règle qui les concerne », qui reflète le pronom hébreu pluriel sans décider s’il renvoie aux offrandes ou aux occasions. « En nombre » rend directement בְּמִסְפָּר, tandis que « selon la règle » rend כְּמִשְׁפָּט dans un français naturel.
