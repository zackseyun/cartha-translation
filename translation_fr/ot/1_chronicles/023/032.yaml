  text: וְ/שָׁמְר֞וּ אֶת מִשְׁמֶ֣רֶת אֹֽהֶל מוֹעֵ֗ד וְ/אֵת֙ מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וּ/מִשְׁמֶ֕רֶת בְּנֵ֥י אַהֲרֹ֖ן אֲחֵי/הֶ֑ם לַ/עֲבֹדַ֖ת בֵּ֥ית יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/032.yaml
  text: And they were to keep charge of the tent of meeting[a], the charge of the holy place, and the charge of the sons of Aaron their brothers, for the service of the house of Yahweh.
translation:
  language: fr
  text: Ils devaient assumer la responsabilité de la tente de la Rencontre, du sanctuaire[a] et de ce qui concernait les fils d’Aaron, leurs frères, pour le service de la maison de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du lieu saint ». Le terme hébreu peut désigner le lieu saint en particulier ou le sanctuaire plus largement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Ils devaient assurer
  rationale: Dans ce résumé des fonctions lévitiques, le verbe exprime une responsabilité assignée plutôt qu’un simple événement passé.
- source_word: מִשְׁמֶרֶת
  choice: garde / charge
  rationale: Le nom désigne une garde, une responsabilité ou une fonction confiée. « Garde » convient aux deux premières occurrences; « charge » évite de faire croire que les Lévites devaient protéger physiquement les fils d’Aaron, tout en maintenant l’ambiguïté relationnelle de l’hébreu.
- source_word: אֹהֶל מוֹעֵד
  choice: tente de la Rencontre
  rationale: Rendu transparent et consacré des deux éléments hébreux; « Rencontre » prend une majuscule comme désignation cultuelle.
- source_word: הַקֹּדֶשׁ
  choice: le sanctuaire
  rationale: Dans ce contexte cultuel, le terme peut désigner le lieu saint ou, plus largement, l’espace sacré. « Sanctuaire » conserve cette amplitude.
- source_word: בְּנֵי אַהֲרֹן אֲחֵיהֶם
  choice: les fils d’Aaron, leurs frères
  rationale: Cette formulation conserve la désignation familiale et sacerdotale de l’hébreu sans la remplacer par l’explicitation « descendants ».
- source_word: לַעֲבֹדַת
  choice: pour le service de
  rationale: Le nom désigne ici le travail cultuel et administratif accompli dans la maison de Yahvé.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: « Maison » traduit directement בֵּית, tandis que « Yahvé » représente le nom divin יהוה au lieu de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahvé » rend le nom propre et le distingue du titre אֲדֹנָי.
- issue: Rapport entre les Lévites et les fils d’Aaron
  choice: la charge des fils d’Aaron, leurs frères
  alternative: la garde confiée par les fils d’Aaron, leurs frères
  rationale: La construction hébraïque reste concise et peut évoquer la responsabilité liée aux prêtres aaroniques sans préciser explicitement si elle est exercée pour eux, avec eux ou sous leur autorité. La traduction ne tranche pas cette relation.
translation_notes:
  register: Français international moderne, sobre et cultuel. La structure ternaire de l’hébreu est perceptible, tout en évitant une formulation qui ferait des fils d’Aaron l’objet d’une garde physique.
