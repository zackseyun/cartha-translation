- from: Ils devaient assurer la garde de la tente de la Rencontre, la garde du sanctuaire[a] et la charge des fils d’Aaron, leurs frères, pour le service de la maison de Yahvé.
  to: Ils devaient assumer la responsabilité de la tente de la Rencontre, du sanctuaire[a] et de ce qui concernait les fils d’Aaron, leurs frères, pour le service de la maison de Yahvé.
  rationale: La révision emploie une expression unique pour les trois occurrences de מִשְׁמֶרֶת et clarifie avec retenue que la troisième responsabilité est liée aux fils d’Aaron, sans préciser si elle s’exerce pour eux, avec eux ou sous leur autorité. La note et le rendu de Yahvé sont conservés.
