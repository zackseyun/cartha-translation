lexical_decisions:
- source_word: לַגֵּרְשֻׁנִּי
  choice: Pour les Guershonites
  rationale: Le ל préfixé introduit ici une catégorie dans la répartition des Lévites. « Pour les Guershonites » restitue naturellement en français la fonction de rubrique de l’expression, tandis que le pluriel collectif correspond au contexte.
- source_word: לַעְדָּן
  choice: Laédân
  rationale: Nom propre translittéré d’après la forme massorétique לַעְדָּן. « Laédân » rend les voyelles et la consonne gutturale de façon lisible en français.
- source_word: וְשִׁמְעִי
  choice: et Shiméï
  rationale: La conjonction וְ est rendue par « et ». Le nom propre שִׁמְעִי est translittéré « Shiméï » selon un usage français clair.
