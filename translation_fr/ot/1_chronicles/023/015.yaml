  text: 'Les fils de Moïse : Guershom et Éliézer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן introduit ici une liste généalogique. « Les fils de » est direct, naturel et plus précis que « les descendants de » dans ce contexte.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Nom propre rendu selon sa forme française traditionnelle et immédiatement reconnaissable.
- source_word: גֵּרְשֹׁם
  choice: Guershom
  rationale: Cette translittération française distingue le fils de Moïse de Guershon, nom proche mais différent porté par un fils de Lévi.
- source_word: וֶ/אֱלִיעֶזֶר
  choice: et Éliézer
  rationale: La conjonction ו est additive et se traduit naturellement par « et ». אֱלִיעֶזֶר est rendu par la forme française usuelle « Éliézer », à ne pas confondre avec Éléazar.
