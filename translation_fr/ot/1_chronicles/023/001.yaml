id: 1CH.23.1
reference: 1 Chronicles 23:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/דָוִ֥יד זָקֵ֖ן וְ/שָׂבַ֣ע יָמִ֑ים וַ/יַּמְלֵ֛ךְ אֶת שְׁלֹמֹ֥ה בְנ֖/וֹ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/001.yaml
  text: David was old and full of days[a], and he made his son Solomon king over Israel.
translation:
  language: fr
  text: David était vieux et rassasié de jours[a], et il établit son fils Salomon comme roi sur Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avancé en âge » ; littéralement « vieux et rassasié de jours ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: était vieux
  rationale: Le qatal décrit l’âge avancé de David. « Était vieux » est direct, naturel et fidèle, sans ajouter de nuance absente de l’hébreu.
- source_word: וְשָׂבַע יָמִים
  choice: et rassasié de jours
  rationale: Cette expression idiomatique évoque une longue vie arrivée à sa pleine mesure. La formulation conserve l’image littéraire de l’hébreu, tandis que la note donne l’équivalent français plus courant.
- source_word: וַיַּמְלֵךְ
  choice: il établit … comme roi
  rationale: 'Le hifil de מלך a ici un sens causatif : David fit régner Salomon ou l’installa dans la royauté. « Établit … comme roi » exprime cela naturellement sans introduire une cérémonie de couronnement non mentionnée.'
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: son fils Salomon
  rationale: Cet ordre est naturel en français et conserve explicitement le lien filial.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: Avec le vocabulaire royal, עַל désigne le peuple sur lequel s’exerce l’autorité. Le texte ne dit pas « tout Israël ».
- source_word: וְ
  choice: et
  rationale: La conjonction initiale relie ce verset au récit précédent. En français, commencer directement par « David » évite un « Or » ou « Alors » plus interprétatif; la coordination interne rend explicitement la progression du verset.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Rassasié de jours » préserve l’image hébraïque traditionnelle sans être entièrement opaque grâce à la note. « Établit … comme roi » conserve la valeur causative sans supposer un rite précis.
