  yaml_path: translation/ot/1_chronicles/023/010.yaml
  text: 'And the sons of Shimei: Jahath[a], Zina, Jeush, and Beriah. These were the sons of Shimei—four.'
translation:
  language: fr
  text: 'Fils de Shiméi : Yahath[a], Zina, Yéoush et Beria. Ce sont les quatre fils de Shiméi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au verset 11, le deuxième nom apparaît sous la forme « Ziza »; ici, le texte hébreu porte « Zina ».
    reason: Variante de forme du nom dans le contexte immédiat.
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעִי
  choice: Fils de Shiméi
  rationale: Dans cette liste généalogique, le waw sert de liaison et peut rester implicite en français. La tournure nominale concise est naturelle; « fils » peut aussi désigner des descendants ou des membres d’une lignée.
- source_word: יַחַת
  choice: Yahath
  rationale: Translittération française du nom hébreu, avec y pour le yod initial et th pour la consonne finale selon l’usage biblique courant.
- source_word: זִינָא
  choice: Zina
  rationale: Le texte hébreu de ce verset porte Zina. La forme différente du verset suivant est signalée en note sans être substituée au texte source.
- source_word: וִיעוּשׁ
  choice: Yéoush
  rationale: Translittération adaptée à la lecture française; la conjonction préfixée est rendue naturellement dans l’énumération.
- source_word: וּבְרִיעָה
  choice: et Beria
  rationale: Le nom est translittéré et la conjonction hébraïque est explicitement rendue pour clore la liste.
- source_word: אֵלֶּה בְנֵי שִׁמְעִי אַרְבָּעָה
  choice: Ce sont les quatre fils de Shiméi
  rationale: La phrase nominale hébraïque est rendue au présent, sans imposer un temps absent de l’original. L’intégration de « quatre » avant le nom produit une conclusion naturelle en français tout en conservant le total explicite.
