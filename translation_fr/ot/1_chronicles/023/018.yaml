lexical_decisions:
- source_word: בְּנֵי
  choice: Fils de
  rationale: Le pluriel construit de בֵּן introduit les membres de la lignée de Yitsehar. « Fils de » rend directement l’hébreu et convient au contexte généalogique.
- source_word: יִצְהָר
  choice: Yitsehar
  rationale: Nom propre translittéré selon une forme française qui représente les consonnes de l’hébreu.
- source_word: שְׁלֹמִית
  choice: Shelomith
  rationale: Nom propre translittéré dans une forme française lisible, en conservant la consonne finale de l’hébreu.
- source_word: הָרֹאשׁ
  choice: le chef
  rationale: Dans cette liste généalogique et organisationnelle, רֹאשׁ avec l’article désigne vraisemblablement le membre principal ou dirigeant. « Le chef » exprime naturellement cette fonction en français, sans exclure les autres nuances possibles.
