base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/011.yaml
  text: Jahath was the first and Zizah the second[a]; Jeush and Beriah did not have many sons[b], so they became one father’s house for one reckoning.
translation:
  language: fr
  text: Yahath était le premier, et Ziza[a] le second. Yeoush et Beria n’eurent pas beaucoup de fils ; ils furent donc comptés comme une seule maison paternelle, pour un seul dénombrement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On trouve aussi la transcription « Zizah ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme une maison paternelle, pour un seul dénombrement ». Le terme hébreu peut évoquer le dénombrement, l’inscription ou l’organisation en une seule division administrative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: était
  rationale: Dans cette notice généalogique, le verbe sert de copule et indique la place de Yahath dans l’ordre présenté.
- source_word: יַחַת
  choice: Yahath
  rationale: Transcription française du nom hébreu, avec y pour la consonne initiale.
- source_word: הָרֹאשׁ
  choice: le premier
  rationale: Bien que le mot signifie littéralement « la tête » ou « le chef », son opposition à « le second » indique ici le rang dans la liste.
- source_word: זִיזָה
  choice: Ziza
  rationale: Transcription française naturelle du nom propre ; le h final du système de translittération savante n’est pas nécessaire en français.
- source_word: הַשֵּׁנִי
  choice: le second
  rationale: L’adjectif ordinal indique la place de Ziza après Yahath.
- source_word: יְעוּשׁ
  choice: Yeoush
  rationale: Transcription française du nom hébreu, qui rend la consonne initiale et la voyelle longue.
- source_word: בְּרִיעָה
  choice: Beria
  rationale: Forme française claire du nom propre hébreu.
- source_word: לֹא הִרְבּוּ בָנִים
  choice: n’eurent pas beaucoup de fils
  rationale: L’expression signifie littéralement qu’ils « ne multiplièrent pas les fils » ; cette formulation française en transmet naturellement le sens tout en conservant la référence précise aux fils.
- source_word: וַיִּהְיוּ
  choice: ils formèrent donc
  rationale: 'Le verbe introduit ici le résultat administratif de leur petit nombre : leurs lignées constituèrent ensemble une seule unité.'
- source_word: לְבֵית אָב
  choice: une seule maison paternelle
  rationale: בית אב désigne une maison issue d’un même père, c’est-à-dire un groupe de parenté patrilinéaire ; « maison paternelle » conserve ce cadre social sans le réduire à un simple foyer.
- source_word: לִפְקֻדָּה אֶחָת
  choice: comptée comme une seule unité
  rationale: פקדה peut désigner un recensement, une inscription ou une organisation administrative. Dans ce contexte, la formulation exprime clairement que les deux lignées étaient enregistrées et traitées ensemble, sans imposer un sens trop étroit.
