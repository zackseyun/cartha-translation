- from: Yahath était le premier, et Ziza[a] le second. Yeoush et Beria n’eurent pas beaucoup de fils ; ils formèrent donc une seule maison paternelle, comptée comme une seule unité[b].
  to: Yahath était le premier, et Ziza[a] le second. Yeoush et Beria n’eurent pas beaucoup de fils ; ils furent donc comptés comme une seule maison paternelle, pour un seul dénombrement[b].
  rationale: La révision remplace une formulation active par « furent comptés comme », qui rend le mieux le statut administratif exprimé par le texte tout en conservant l’ambiguïté de פקדה. La note est ajustée afin que « un seul » porte correctement sur le dénombrement.
