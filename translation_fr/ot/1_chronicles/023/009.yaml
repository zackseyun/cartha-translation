source:
  edition: WLC
  text: בְּנֵ֣י שִׁמְעִ֗י שלמות וַ/חֲזִיאֵ֛ל וְ/הָרָ֖ן שְׁלֹשָׁ֑ה אֵ֛לֶּה רָאשֵׁ֥י הָ/אָב֖וֹת לְ/לַעְדָּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/009.yaml
  text: 'The sons of Shimei: Shelomoth[a], Haziel, and Haran—three. These were the heads of the fathers’ houses of Ladan.'
translation:
  language: fr
  text: 'Fils de Shiméi : Shelomoth[a], Haziel et Harân — trois en tout. Ils étaient les chefs des maisons ancestrales de Ladân.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On trouve aussi la forme « Shelomith » pour ce nom.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעִי
  choice: Fils de Shiméi
  rationale: Dans cette liste généalogique, la construction désigne naturellement les fils immédiats de Shiméi plutôt que ses descendants au sens large.
- source_word: שלמות
  choice: Shelomoth
  rationale: Cette translittération rend la forme consonantique et la vocalisation du nom dans le texte massorétique.
- source_word: וַחֲזִיאֵל
  choice: Haziel
  rationale: Translittération directe de חֲזִיאֵל, sans lui substituer la forme apparentée Yahaziel attestée ailleurs.
- source_word: וְהָרָן
  choice: et Harân
  rationale: Le nom propre est translittéré selon sa forme hébraïque, avec l’accent circonflexe marquant la voyelle longue dans l’usage français retenu.
- source_word: שְׁלֹשָׁה
  choice: trois en tout
  rationale: La précision explicite conserve le décompte récapitulatif de l’hébreu tout en donnant une tournure française naturelle.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: les chefs des maisons ancestrales
  rationale: Dans le cadre généalogique et administratif des Chroniques, l’expression désigne les représentants principaux des unités familiales issues des pères. « Maisons ancestrales » est plus transparent en français moderne que le calque « maisons des pères ».
- source_word: לְלַעְדָּן
  choice: de Ladân
  rationale: La préposition marque ici l’appartenance ou le rattachement à la lignée de Ladân.
