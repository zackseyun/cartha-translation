base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/029.yaml
  text: and for the bread of the arrangement[a], and for the fine flour for the grain offering, and for the wafers of unleavened bread, and for what is cooked on the griddle, and for what is well-mixed, and for every measure and size,
translation:
  language: fr
  text: pour les pains disposés en rangées[a], pour la fleur de farine destinée à l’offrande végétale, pour les galettes sans levain, pour ce qui est cuit sur la plaque, pour ce qui est bien mélangé, et pour toute mesure de capacité et toute dimension,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les pains de proposition » ou « les pains de la Présence ». L’hébreu signifie littéralement « le pain de la disposition » ou « le pain de l’ordonnancement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: les pains disposés en rangées
  rationale: L’expression désigne littéralement le pain de la disposition ou de l’ordonnancement. Cette formulation française rend concrètement מַעֲרֶכֶת sans imposer l’expression interprétative « pains de la Présence ».
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Terme français usuel pour une farine très fine et raffinée employée dans les offrandes.
- source_word: מִנְחָה
  choice: offrande végétale
  rationale: Dans ce contexte cultuel, le mot désigne l’offrande préparée à partir de produits agricoles plutôt qu’une offrande générique.
- source_word: רְקִיקֵי הַמַּצּוֹת
  choice: galettes sans levain
  rationale: רְקִיקִים désigne des galettes minces, et הַמַּצּוֹת précise qu’elles sont sans levain.
- source_word: מַּחֲבַת
  choice: ce qui est cuit sur la plaque
  rationale: Le nom renvoie à une plaque ou poêle plate utilisée pour la cuisson; dans cette liste de préparations, la traduction désigne ce qui y est préparé.
- source_word: מֻּרְבָּכֶת
  choice: ce qui est bien mélangé
  rationale: Le participe passif évoque une préparation mélangée, probablement avec de l’huile, sans permettre de préciser davantage le procédé.
- source_word: מְשׂוּרָה
  choice: mesure de capacité
  rationale: Le terme renvoie à une quantité ou mesure étalon, vraisemblablement de capacité.
- source_word: מִדָּה
  choice: dimension
  rationale: Associé à מְשׂוּרָה, le mot élargit l’idée aux dimensions ou aux autres normes de mesure.
