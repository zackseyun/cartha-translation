  text: וְ/לַ/עֲמֹד֙ בַּ/בֹּ֣קֶר בַּ/בֹּ֔קֶר לְ/הֹד֥וֹת וּ/לְ/הַלֵּ֖ל לַ/יהוָ֑ה וְ/כֵ֖ן לָ/עָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/030.yaml
  text: and to stand every morning to give thanks and to praise Yahweh[a], and likewise at evening,
translation:
  language: fr
  text: et se tenir debout chaque matin[a] pour remercier et louer Yahweh, et de même le soir,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « matin après matin », expression qui indique un service quotidien régulier.'
    reason: La note conserve la répétition littérale de בַּבֹּקֶר בַּבֹּקֶר, rendue de façon idiomatique par « chaque matin » dans le texte.
lexical_decisions:
- source_word: וְ/לַ/עֲמֹד
  choice: et se tenir debout
  rationale: L’infinitif construit exprime ici une fonction assignée dans le contexte précédent. « Se tenir debout » conserve la posture concrète et le cadre solennel du service.
- source_word: בַּ/בֹּקֶר בַּ/בֹּקֶר
  choice: chaque matin
  rationale: La répétition a une valeur distributive et indique une obligation quotidienne régulière. « Chaque matin » est naturel en français moderne.
- source_word: לְ/הֹדֹות
  choice: pour remercier
  rationale: Dans ce contexte cultuel, le hifil de ידה désigne l’action de rendre grâce ou de remercier, et non celle de confesser.
- source_word: וּ/לְ/הַלֵּל
  choice: et louer
  rationale: Le piel de הלל signifie louer. Cette formulation directe n’ajoute pas une idée de chant absente du verbe lui-même.
- source_word: לַ/יהוָה
  choice: Yahweh
  rationale: Le texte hébreu emploie directement le tétragramme יהוה ; « Yahweh » en rend le caractère de nom propre.
- source_word: וְ/כֵן
  choice: et de même
  rationale: L’expression relie le service du soir à celui du matin en indiquant que les mêmes actions doivent être accomplies.
- source_word: לָ/עָרֶב
  choice: le soir
  rationale: L’expression désigne le moment correspondant du service quotidien. « Le soir » est la tournure française la plus naturelle ici.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset porte le nom propre divin. « Yahweh » le représente directement sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La construction infinitive et la virgule finale sont conservées parce que le verset poursuit la phrase commencée dans le contexte précédent et continuée au verset suivant.
