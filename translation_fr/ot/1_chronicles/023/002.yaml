  text: וַ/יֶּאֱסֹף֙ אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֔ל וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/002.yaml
  text: And he gathered all the leaders of Israel[a], and the priests and the Levites.
translation:
  language: fr
  text: Il rassembla tous les chefs d’Israël[a], ainsi que les prêtres et les Lévites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dirigeants d’Israël », « les responsables d’Israël » ou « les princes d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: Il rassembla
  rationale: Le wayyiqtol fait progresser le récit. « Il rassembla » exprime naturellement l’action de réunir les groupes mentionnés, sans qu’il soit nécessaire de rendre mécaniquement la conjonction initiale en français.
- source_word: כָּל
  choice: tous les
  rationale: Le quantificateur marque la totalité et s’emploie naturellement avec le nom pluriel défini.
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: les chefs d’Israël
  rationale: שָׂרִים peut désigner des chefs, dirigeants, responsables ou princes. « Chefs » convient au contexte institutionnel, reste actuel et n’implique pas qu’il s’agisse nécessairement de fils de roi.
- source_word: וְהַכֹּהֲנִים
  choice: ainsi que les prêtres
  rationale: « Prêtres » est l’équivalent français usuel de כֹּהֲנִים. « Ainsi que » coordonne clairement les catégories après le premier groupe.
- source_word: וְהַלְוִיִּם
  choice: et les Lévites
  rationale: « Lévites » est la désignation française conventionnelle et précise de ce groupe.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. La coordination « ainsi que… et… » évite une succession lourde de trois « et », tout en conservant les trois groupes distincts. Le passé simple convient au registre narratif biblique sans être archaïque.
