  text: בְּנֵ֖י חֶבְר֑וֹן יְרִיָּ֤הוּ הָ/רֹאשׁ֙ אֲמַרְיָ֣ה הַ/שֵּׁנִ֔י יַחֲזִיאֵל֙ הַ/שְּׁלִישִׁ֔י וִֽ/יקַמְעָ֖ם הָ/רְבִיעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/019.yaml
  text: 'The sons of Hebron: Jeriah the first[a], Amariah the second, Jahaziel the third, and Jekameam the fourth.'
translation:
  language: fr
  text: 'Fils d’Hébron : Yeria, le premier[a] ; Amaria, le deuxième ; Yahaziel, le troisième ; et Yeqaméam, le quatrième.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la tête » ou « le chef » ; dans cette série, le terme a le sens de « le premier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי חֶבְרוֹן
  choice: Fils d’Hébron
  rationale: Le construit pluriel בְּנֵי introduit ici une liste généalogique de fils ; « Fils d’Hébron » est direct, naturel et précis.
- source_word: יְרִיָּהוּ
  choice: Yeria
  rationale: Translittération française moderne du nom propre, en rendant la consonne initiale hébraïque par Y et sans conserver une terminaison théophore longue étrangère à l’usage français courant.
- source_word: הָרֹאשׁ
  choice: le premier
  rationale: Même si רֹאשׁ signifie littéralement « tête » et peut désigner le chef, son parallélisme avec « le deuxième », « le troisième » et « le quatrième » lui donne ici une fonction ordinale.
- source_word: אֲמַרְיָה
  choice: Amaria
  rationale: Forme française claire du nom propre hébreu.
- source_word: יַחֲזִיאֵל
  choice: Yahaziel
  rationale: Translittération française qui représente l’initiale hébraïque par Y et conserve la forme reconnaissable du nom.
- source_word: וִיקַמְעָם
  choice: et Yeqaméam
  rationale: La conjonction est rendue par « et » ; le nom est translittéré selon sa vocalisation massorétique, avec une graphie adaptée au français.
- source_word: הַשֵּׁנִי / הַשְּׁלִישִׁי / הָרְבִיעִי
  choice: le deuxième / le troisième / le quatrième
  rationale: Les adjectifs ordinaux hébreux marquent directement l’ordre des quatre fils dans la liste.
