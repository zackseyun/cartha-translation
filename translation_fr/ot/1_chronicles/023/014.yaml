  text: Quant à Moïse, l’homme de Dieu, ses fils furent comptés parmi la tribu de Lévi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Expression française naturelle et consacrée qui correspond directement au titre hébreu.
- source_word: יִקָּרְאוּ עַל שֵׁבֶט הַלֵּוִי
  choice: furent comptés parmi la tribu de Lévi
  rationale: Dans ce contexte généalogique et administratif, l’expression indique l’inscription ou le rattachement des fils de Moïse à la tribu de Lévi; « parmi » rend leur inclusion sans suggérer qu’ils formaient eux-mêmes toute la tribu.
theological_decisions:
- issue: Statut des fils de Moïse dans l’organisation lévitique
  choice: furent comptés parmi la tribu de Lévi
  alternative: furent appelés d’après la tribu de Lévi
  rationale: Le sens contextuel est celui du classement généalogique des descendants de Moïse comme Lévites, non d’une vocation particulière ni d’un changement de nom.
translation_notes:
  register: Français international moderne, sobre et digne. « Quant à Moïse » reproduit la mise en relief initiale de l’hébreu; le passé simple convient au registre narratif biblique sans être archaïque.
