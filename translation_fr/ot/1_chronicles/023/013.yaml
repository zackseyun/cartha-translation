base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/013.yaml
  text: 'The sons of Amram: Aaron and Moses. And Aaron was set apart[a], he and his sons forever, to sanctify him as most holy, to burn incense before Yahweh, to minister to him, and to bless in his name forever.'
translation:
  language: fr
  text: 'Les fils d’Amram : Aaron et Moïse. Aaron fut mis à part — lui et ses fils, pour toujours — afin de le consacrer comme très saint[a], de brûler de l’encens devant Yahvé, de le servir et de bénir en son nom pour toujours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sainteté des saintetés », une tournure superlative signifiant « très saint ». Le calque « saint des saints » est aussi possible, mais il pourrait ici évoquer à tort le lieu très saint du sanctuaire.'
    reason: La note rend compte de la construction superlative hébraïque et de son alternative littérale, tout en précisant pourquoi « très saint » convient au contexte.
lexical_decisions:
- source_word: בְּנֵי עַמְרָם
  choice: Les fils d’Amram
  rationale: Le sens immédiat est celui des fils d’Amram, puisque Aaron et Moïse sont nommés directement.
- source_word: וַיִּבָּדֵל
  choice: fut mis à part
  rationale: Le nifal de בדל exprime ici une séparation en vue d’une fonction particulière et sacrée.
- source_word: לְהַקְדִּישׁוֹ קֹדֶשׁ קָדָשִׁים
  choice: afin de le consacrer comme très saint
  rationale: Le suffixe masculin singulier est conservé par « le », qui renvoie naturellement à Aaron. « Très saint » rend la construction superlative hébraïque sans évoquer à tort le lieu appelé « Saint des saints ».
- source_word: הוּא וּבָנָיו עַד עוֹלָם
  choice: lui et ses fils, pour toujours
  rationale: La formulation garde l’apposition hébraïque et le caractère durable de la charge sacerdotale.
- source_word: לְהַקְטִיר
  choice: faire brûler de l’encens
  rationale: Dans ce contexte sacerdotal, le verbe désigne naturellement l’action de faire fumer l’encens, même s’il peut aussi s’appliquer plus largement à ce qui est offert en fumée.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahvé
  rationale: « Devant » exprime la présence, et « Yahvé » représente le nom divin יהוה.
- source_word: לְשָׁרְתוֹ
  choice: assurer son service
  rationale: Cette expression française naturelle conserve la nuance de service cultuel propre au contexte sacerdotal.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: et de bénir en son nom
  rationale: La formulation préserve la portée du nom comme autorité ou moyen de la bénédiction, sans trancher davantage.
theological_decisions:
- issue: Référent des suffixes singuliers dans « le consacrer » et « son service »
  choice: « le consacrer » renvoie à Aaron ; « son service » renvoie à Yahvé
  alternative: Comprendre le premier suffixe de manière impersonnelle, ou faire renvoyer le second à Aaron
  rationale: Après la mise à part d’Aaron, le premier suffixe masculin singulier renvoie le plus naturellement à lui. Après « devant Yahvé », le service est le plus naturellement celui qui est rendu à Yahvé. La traduction conserve toutefois les pronoms du texte plutôt que d’ajouter des noms explicatifs.
- issue: Portée de « pour toujours »
  choice: Conserver ses deux occurrences et rattacher la première à Aaron et à ses fils
  alternative: Reformuler explicitement en termes de descendance ou de charge perpétuelle
  rationale: Le texte présente Aaron et ses fils dans une fonction durable, puis répète la durée à propos de la bénédiction. La traduction maintient cette structure sans développer une interprétation institutionnelle.
translation_notes:
  register: Français international moderne, digne et lisible. Les tirets rendent claire l’apposition « lui et ses fils, pour toujours » sans effacer le singulier du verbe appliqué à Aaron. Le vocabulaire cultuel reste précis sans archaïsme inutile.
