  text: בְּנֵ֣י לַעְדָּ֗ן הָ/רֹ֧אשׁ יְחִיאֵ֛ל וְ/זֵתָ֥ם וְ/יוֹאֵ֖ל שְׁלֹשָֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/008.yaml
  text: 'The sons of Ladan: Jehiel the head[a], and Zetham and Joel—three.'
translation:
  language: fr
  text: 'Fils de Ladân : Yehiel, le chef[a], Zétam et Joël — trois en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le premier ». L’hébreu signifie littéralement « la tête » et peut désigner Yehiel comme le fils prééminent ou l’aîné.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Fils de
  rationale: Le pluriel construit signifie littéralement « fils de ». Ici, il introduit trois personnes nommées et se traduit naturellement ainsi.
- source_word: לַעְדָּן
  choice: Ladân
  rationale: Transcription française du nom propre hébreu, avec accent circonflexe indiquant la voyelle longue.
- source_word: הָרֹאשׁ
  choice: le chef
  rationale: Le terme signifie littéralement « la tête » et, appliqué à une personne, « le chef » ou « celui qui est à la tête ». Cette formulation préserve mieux l'ambiguïté entre rang familial et fonction dirigeante que « le premier ».
- source_word: יְחִיאֵל
  choice: Yehiel
  rationale: Transcription française transparente du nom propre hébreu.
- source_word: וְזֵתָם
  choice: Zétam
  rationale: Le waw coordonne ce nom aux autres; en français, la coordination est portée par « et » avant le dernier élément de l'énumération.
- source_word: וְיוֹאֵל
  choice: et Joël
  rationale: Traduction de la conjonction et transcription française usuelle du nom propre.
- source_word: שְׁלֹשָׁה
  choice: trois en tout
  rationale: Le cardinal récapitule explicitement le nombre des fils énumérés; « en tout » rend sa fonction récapitulative en français naturel.
theological_decisions: []
