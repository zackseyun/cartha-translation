  text: מֵ/אֵ֗לֶּה לְ/נַצֵּ֨חַ֙ עַל מְלֶ֣אכֶת בֵּית יְהוָ֔ה עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָ֑לֶף וְ/שֹׁטְרִ֥ים וְ/שֹׁפְטִ֖ים שֵׁ֥שֶׁת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/004.yaml
  text: Of these, twenty-four thousand were to oversee the work of the house of Yahweh, and six thousand were officers and judges.
translation:
  language: fr
  text: Parmi eux, vingt-quatre mille étaient chargés de superviser le travail de la maison de Yahweh, et six mille étaient officiers et juges.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: Parmi eux
  rationale: La préposition מִן introduit ici une partie de l’ensemble des Lévites mentionné précédemment. « Parmi eux » exprime naturellement cette valeur partitive en français.
- source_word: לְנַצֵּחַ עַל
  choice: étaient chargés de superviser
  rationale: Le piel infinitif de נצח, suivi de עַל, désigne dans ce contexte administratif la direction ou la supervision. Cette formulation rend aussi la valeur d’affectation portée par l’infinitif.
- source_word: מְלֶאכֶת בֵּית יְהוָה
  choice: le travail de la maison de Yahweh
  rationale: מְלָאכָה désigne le travail ou l’ensemble des tâches. « Maison » conserve l’image hébraïque sans expliciter par « temple », et le nom divin est translittéré « Yahweh ».
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vingt-quatre mille
  rationale: Rendu cardinal direct, écrit en toutes lettres dans le texte courant.
- source_word: וְשֹׁטְרִים
  choice: responsables
  rationale: שֹׁטְרִים désigne des agents chargés de fonctions administratives ou d’exécution. « Responsables » est naturel et suffisamment large, sans suggérer à tort des officiers militaires ou policiers modernes.
- source_word: וְשֹׁפְטִים
  choice: juges
  rationale: Le terme désigne directement ceux qui exercent une fonction judiciaire.
- source_word: שֵׁשֶׁת אֲלָפִים
  choice: six mille
  rationale: Rendu cardinal direct, écrit en toutes lettres par cohérence.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » conserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la répartition administrative du verset et le terme « maison » maintient la formulation concrète de l’hébreu.
