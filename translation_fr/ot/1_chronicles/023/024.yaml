revisions:
- from: Voici les descendants de Lévi, selon leurs familles ancestrales et leurs chefs de famille. Ils furent recensés nominativement, chacun individuellement[a]. Ceux qui accomplissaient les tâches liées au service de la maison de Yahweh étaient âgés de vingt ans ou plus.
  to: 'Voici les fils de Lévi, selon leurs familles ancestrales : les chefs de famille, recensés nominativement, un par un[a], qui accomplissaient le travail pour le service de la maison de Yahweh, âgés de vingt ans ou plus.'
  rationale: La révision rétablit l’apposition « les chefs de famille » et maintient dans une même construction les personnes recensées, leur comptage individuel et leur affectation au service. Elle conserve les choix terminologiques appropriés et la note liée à l’expression de comptage individuel.
