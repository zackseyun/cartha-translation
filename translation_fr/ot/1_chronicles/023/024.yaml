review_pass:
  verdict: revise
  source_fidelity: 'La reformulation en trois phrases rend le sens général, mais elle dissocie et réorganise excessivement la longue désignation des Lévites. En particulier, « selon leurs familles ancestrales et leurs chefs de famille » coordonne à tort deux éléments qui sont appositifs dans l’hébreu : les « chefs de famille » qualifient les fils de Lévi recensés. La version révisée conserve aussi plus nettement le lien entre le recensement nominatif, le comptage individuel et les personnes qui effectuaient le service.'
  naturalness: Le français du projet est globalement clair et moderne. « Familles ancestrales » et « chefs de famille » sont naturels. Une seule phrase structurée par des virgules et une apposition est ici plus fidèle sans devenir lourde.
  terminology: « Yahweh », « service de la maison de Yahweh » et « vingt ans ou plus » conviennent. « Un par un » rend idiomatiquement l’expression de comptage individuel; la note conserve l’image concrète de l’hébreu.
  issues:
  - severity: medium
    issue: Coordination fautive de « familles ancestrales » et « chefs de famille »
    rationale: Le texte hébreu présente les chefs de famille comme une apposition descriptive des fils de Lévi, non comme un second terme régi parallèlement par « selon ». Cette coordination obscurcit la syntaxe et le référent.
  - severity: medium
    issue: Dissociation du recensement et des personnes affectées au service
    rationale: Le découpage en phrases fait de « Ceux qui accomplissaient » une reprise potentiellement distincte des personnes précédemment recensées. Le participe hébreu appartient à la même chaîne descriptive.
  revised_text: 'Voici les fils de Lévi, selon leurs familles ancestrales : les chefs de famille, recensés nominativement, un par un[a], qui accomplissaient le travail pour le service de la maison de Yahweh, âgés de vingt ans ou plus.'
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « selon leurs crânes » ou « tête par tête » ; expression indiquant que chaque personne était comptée séparément.'
    reason: L’hébreu emploie une image concrète qu’une traduction idiomatique française ne peut conserver sans devenir obscure.
  revision_rationale: La révision rétablit l’apposition « les chefs de famille » et maintient dans une même construction les personnes recensées, leur comptage individuel et leur affectation au service. Elle conserve les choix terminologiques appropriés et la note liée à l’expression de comptage individuel.
