  text: אֵ֣לֶּה בְנֵֽי לֵוִי֩ לְ/בֵ֨ית אֲבֹתֵי/הֶ֜ם רָאשֵׁ֧י הָ/אָב֣וֹת לִ/פְקוּדֵי/הֶ֗ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם עֹשֵׂה֙ הַ/מְּלָאכָ֔ה לַ/עֲבֹדַ֖ת בֵּ֣ית יְהוָ֑ה מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/024.yaml
  text: These were the sons of Levi by their fathers’ houses[a], the heads of the fathers’ houses, according to those counted of them, by the number of names, head by head, doing the work for the service of the house of Yahweh, from twenty years old and upward.
translation:
  language: fr
  text: 'Voici les fils de Lévi, selon leurs familles ancestrales : les chefs de famille, recensés nominativement, un par un[a], qui accomplissaient le travail pour le service de la maison de Yahweh, âgés de vingt ans ou plus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon leurs crânes » ou « tête par tête » ; expression indiquant que chaque personne était comptée séparément.'
    reason: L’hébreu emploie une image concrète qu’une traduction idiomatique française ne peut conserver sans devenir obscure.
lexical_decisions:
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: selon leurs familles ancestrales
  rationale: L’expression désigne les subdivisions familiales d’Israël fondées sur l’ascendance. « Familles ancestrales » est plus naturel en français moderne que le calque « maisons de leurs pères ».
- source_word: רָאשֵׁי הָאָבוֹת
  choice: leurs chefs de famille
  rationale: L’expression vise les responsables des groupes familiaux. Cette formulation française restitue la fonction sans employer le calque obscur « chefs des pères ».
- source_word: לִפְקוּדֵיהֶם בְּמִסְפַּר שֵׁמוֹת
  choice: Ils furent recensés nominativement
  rationale: Les deux expressions renvoient ensemble au dénombrement des personnes inscrites par leur nom. La formulation demeure concrète tout en étant naturelle en français.
- source_word: לְגֻלְגְּלֹתָם
  choice: chacun individuellement
  rationale: Littéralement « selon leurs crânes/têtes », cette locution signifie que chaque personne était comptée séparément. Le sens idiomatique figure dans le texte, tandis que l’image hébraïque est signalée en note.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: ceux qui accomplissaient les tâches
  rationale: Le participe singulier a une valeur collective et désigne les Lévites affectés au travail. Le pluriel explicite cette valeur en français.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: liées au service de la maison de Yahweh
  rationale: עֲבֹדָה recouvre ici les fonctions cultuelles et pratiques exercées dans le sanctuaire. « Service » conserve cette amplitude, et « maison » rend l’appellation hébraïque du temple.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: âgés de vingt ans ou plus
  rationale: Cette tournure française exprime clairement et naturellement l’âge minimal indiqué par l’idiome hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le distingue d’un simple titre et suit la politique du projet, sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Les longues séries nominales de l’hébreu ont été réparties en trois phrases afin de rendre clairement le recensement, les personnes affectées au service et la limite d’âge, sans effacer leurs liens logiques.
