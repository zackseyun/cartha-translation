base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/017.yaml
  text: 'The sons of Eliezer: Rehabiah was the chief[a], and Eliezer had no other sons; but the sons of Rehabiah became very many.'
translation:
  language: fr
  text: 'Fils d’Éliézer : Rehabia, le chef. Éliézer n’eut pas d’autres fils, mais les fils de Rehabia devinrent extrêmement nombreux[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se multiplièrent considérablement ».'
    reason: Cette variante rend plus directement la valeur dynamique de רָבוּ et l’intensification exprimée par לְמָעְלָה.
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אֱלִיעֶזֶר
  choice: 'Fils d’Éliézer :'
  rationale: La formule généalogique est rendue comme un intitulé elliptique, naturel en français, tout en conservant sa fonction d’énumération.
- source_word: רְחַבְיָה
  choice: Rehabia
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: הָרֹאשׁ
  choice: le chef
  rationale: Dans ce contexte généalogique et organisationnel, le terme désigne vraisemblablement le membre principal ou le chef de la maison; « le chef » conserve cette valeur sans imposer le sens chronologique de « premier ».
- source_word: וְלֹא הָיָה לֶאֱלִיעֶזֶר בָּנִים אֲחֵרִים
  choice: Éliézer n’eut pas d’autres fils
  rationale: La construction existentielle possessive est rendue idiomatiquement; « d’autres » indique que Rehabia était son seul fils.
- source_word: וּבְנֵי רְחַבְיָה
  choice: mais les fils de Rehabia
  rationale: « Mais » exprime le contraste contextuel entre le fils unique d’Éliézer et la nombreuse descendance de Rehabia.
- source_word: רָבוּ לְמָעְלָה
  choice: devinrent extrêmement nombreux
  rationale: רָבוּ exprime l’accroissement ou la multiplication, tandis que לְמָעְלָה en renforce ici fortement le degré. Cette formulation française restitue à la fois le développement et l’abondance.
