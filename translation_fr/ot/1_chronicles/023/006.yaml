  text: 'David divided them into divisions for the sons of Levi: Gershon[a], Kohath, and Merari.'
translation:
  language: fr
  text: 'David les répartit en divisions parmi les fils de Lévi : Guershon[a], Kehath et Merari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour Guershon, Kehath et Merari » ; la préposition hébraïque devant Guershon peut régir toute la liste.'
