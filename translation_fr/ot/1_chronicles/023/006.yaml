  source_fidelity: Le verbe עם suffixe objet (« les répartit ») et « en divisions » rendent fidèlement וַיְחַלְּקֵם מַחְלְקוֹת. En revanche, « selon les fils de Lévi » atténue la valeur de classification/appartenance de la préposition ל. « Parmi les fils de Lévi » exprime plus directement le cadre de la répartition. La préposition devant Guershon est susceptible de régir la liste, possibilité conservée en note.
  naturalness: La formulation révisée est claire et idiomatique en français international moderne. « Parmi les fils de Lévi » s’enchaîne naturellement avec l’énumération.
  terminology: « Fils de Lévi » préserve le cadre généalogique du texte. « Kehath » est l’orthographe française biblique plus courante que « Qehath » dans une traduction française; « Guershon » et « Merari » sont maintenus.
