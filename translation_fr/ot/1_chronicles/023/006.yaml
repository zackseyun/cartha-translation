lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: les répartit
  rationale: Le piel de חלק exprime ici l’action de diviser ou de répartir, et le suffixe de troisième personne du masculin pluriel est rendu explicitement par « les ». « Répartit » convient naturellement à l’organisation de personnes en divisions.
- source_word: מַחְלְקוֹת
  choice: en divisions
  rationale: Le nom désigne des divisions ou groupes organisés. Avec « répartit », la préposition « en » exprime clairement le résultat de l’action tout en restant proche de l’hébreu.
- source_word: לִבְנֵי לֵוִי
  choice: selon les fils de Lévi
  rationale: L’expression conserve la formulation généalogique « fils de Lévi ». « Selon » rend ici le cadre de classement par lignées et permet à la liste suivante de fonctionner naturellement comme apposition.
- source_word: לְגֵרְשׁוֹן קְהָת וּמְרָרִי
  choice: Guershon, Qehath et Merari
  rationale: Il s’agit des trois grandes lignées lévitiques. Après les deux-points, les noms précisent naturellement « les fils de Lévi » ; la note conserve la possibilité de faire porter plus explicitement la préposition sur la liste.
