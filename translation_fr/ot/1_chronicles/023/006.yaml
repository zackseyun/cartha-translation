translation_notes:
  register: Français international moderne, clair et digne. Les formes « Guershon », « Qehath » et « Merari » suivent des translittérations françaises usuelles. La structure généalogique de l’hébreu est conservée sans remplacer « fils de Lévi » par « Lévites ».
