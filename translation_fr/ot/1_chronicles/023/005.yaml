  text: וְ/אַרְבַּ֥עַת אֲלָפִ֖ים שֹׁעֲרִ֑ים וְ/אַרְבַּ֤עַת אֲלָפִים֙ מְהַֽלְלִ֣ים לַ/יהוָ֔ה בַּ/כֵּלִ֕ים אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/הַלֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/005.yaml
  text: and four thousand gatekeepers[a], and four thousand praising Yahweh with the instruments that I made to praise him.
translation:
  language: fr
  text: et quatre mille gardiens des portes, et quatre mille qui louent Yahweh avec les instruments que j’ai fabriqués, destinés à la louange.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁעֲרִים
  choice: gardiens des portes
  rationale: Le terme désigne les personnes affectées à la garde des portes. « Gardiens des portes » convient naturellement au cadre administratif du temple et évoque mieux de grands accès que « portiers ».
- source_word: מְהַֽלְלִים
  choice: qui louaient
  rationale: Le participe décrit la fonction exercée par ce groupe dans l’énumération. L’imparfait français rend ici cette activité continue dans un récit au passé.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Le texte porte explicitement le tétragramme, rendu comme nom propre afin de préserver le nom divin.
- source_word: בַּכֵּלִים
  choice: avec les instruments
  rationale: כֵּלִים est un terme large, mais le contexte de la louange indique clairement des instruments employés à cette fin, sans qu’il soit nécessaire d’ajouter « de musique ».
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: que j’avais fabriqués
  rationale: Le pronom relatif renvoie aux instruments. Le plus-que-parfait exprime naturellement en français leur fabrication antérieure à l’organisation décrite.
- source_word: לְהַלֵּל
  choice: pour le louer
  rationale: L’infinitif avec לְ exprime le but. Le complément « le » reprend naturellement Yahweh tout en conservant le sens de la construction.
- source_word: וְאַרְבַּעַת אֲלָפִים ... וְאַרְבַּעַת אֲלָפִים
  choice: et quatre mille… et quatre mille
  rationale: La répétition est maintenue afin de respecter la structure hébraïque et de distinguer les deux groupes.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le tétragramme figure directement dans le texte; sa translittération préserve ici sa valeur de nom propre sans substituer un titre.
- issue: Référent implicite de לְהַלֵּל
  choice: pour le louer
  alternative: pour la louange
  rationale: Le contexte immédiat permet de comprendre Yahweh comme objet de la louange. La formulation française explicite ce référent grammaticalement implicite sans modifier le but exprimé par l’infinitif.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination répétée reproduit l’énumération du verset. « Gardiens des portes » est clair pour un lectorat général, tandis que « fabriqués » convient mieux que « faits » à des instruments.
