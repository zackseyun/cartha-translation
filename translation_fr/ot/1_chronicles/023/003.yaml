base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/003.yaml
  text: The Levites were counted from thirty years old and upward[a], and their number by heads, man by man, was thirty-eight thousand.
translation:
  language: fr
  text: Les Lévites de trente ans et plus furent recensés ; leur effectif, dénombré individuellement[a], était de trente-huit mille hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon leurs têtes, hommes » ; l’expression indique un dénombrement individuel d’hommes adultes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּפְרוּ
  choice: furent recensés
  rationale: Le passif rend la forme niphal et « recenser » exprime naturellement le dénombrement officiel dans ce contexte.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation française usuelle de ce groupe.
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמָעְלָה
  choice: âgés de trente ans ou plus
  rationale: Formulation française actuelle et précise du seuil d’âge exprimé par l’idiome hébreu.
- source_word: וַיְהִי מִסְפָּרָם
  choice: leur nombre […] s’élevait à
  rationale: Tour français naturel pour introduire le total d’un recensement.
- source_word: לְגֻלְגְּלֹתָם
  choice: tête par tête
  rationale: Conserve l’image concrète de l’hébreu tout en indiquant clairement un dénombrement individuel.
- source_word: לִגְבָרִים
  choice: parmi les hommes
  rationale: Préserve la précision masculine du texte sans alourdir la formulation par une répétition artificielle.
- source_word: שְׁלֹשִׁים וּשְׁמוֹנָה אָלֶף
  choice: 38 000
  rationale: Rendu direct du total, avec la présentation numérique courante en français.
