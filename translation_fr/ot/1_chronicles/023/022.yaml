source:
  edition: WLC
  text: וַ/יָּ֨מָת֙ אֶלְעָזָ֔ר וְ/לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וַ/יִּשָּׂא֥וּ/ם בְּנֵי קִ֖ישׁ אֲחֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/022.yaml
  text: Eleazar died and had no sons[a], but only daughters; and the sons of Kish, their brothers[b], married them.
translation:
  language: fr
  text: Éléazar mourut sans avoir de fils, mais seulement des filles. Les fils de Kis, leurs frères[b], les épousèrent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « les prirent pour femmes ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « leurs frères » désigne probablement des proches parents appartenant à la branche familiale apparentée, et non nécessairement leurs frères au sens strict.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le verbe מות signifie directement « mourir ». Le passé simple convient au registre narratif sobre et digne des Chroniques.
- source_word: אֶלְעָזָר
  choice: Éléazar
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et largement reconnue.
- source_word: וְלֹא הָיוּ לוֹ בָּנִים
  choice: sans avoir de fils
  rationale: Dans l’opposition explicite avec les filles, בָּנִים désigne ici des fils et non les enfants en général. Cette tournure restitue naturellement l’expression hébraïque d’absence de descendance masculine.
- source_word: כִּי אִם בָּנוֹת
  choice: mais seulement des filles
  rationale: 'כִּי אִם exprime ici une restriction contrastive : Éléazar n’avait pas de fils, uniquement des filles.'
- source_word: וַיִּשָּׂאוּם
  choice: les épousèrent
  rationale: Dans ce contexte, נשׂא avec des femmes pour objet signifie les prendre en mariage. « Les épousèrent » est clair et naturel en français moderne.
- source_word: בְּנֵי קִישׁ
  choice: les fils de Qish
  rationale: La construction généalogique hébraïque est conservée. « Qish » représente directement les consonnes du nom hébreu קִישׁ.
- source_word: אֲחֵיהֶם
  choice: leurs frères
  rationale: Le terme signifie formellement « leurs frères ». Le texte garde cette désignation tout en signalant en note qu’elle peut viser des parents proches du même clan.
theological_decisions:
- issue: Portée du terme אֲחֵיהֶם dans le cadre familial
  choice: leurs frères
  alternative: leurs proches parents
  rationale: La traduction conserve le sens lexical direct sans préciser artificiellement le degré exact de parenté; une note expose la portée clanique possible et préserve l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple maintient le registre narratif biblique sans archaïsme lexical. Les formulations généalogiques restent proches de l’hébreu, tandis que « les épousèrent » assure une lecture naturelle.
