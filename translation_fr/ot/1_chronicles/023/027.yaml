  yaml_path: translation/ot/1_chronicles/023/027.yaml
  text: For by the last words of David[a], the sons of Levi were numbered from twenty years old and upward.
translation:
  language: fr
  text: Car, d’après les dernières paroles de David[a], on compta les fils de Lévi âgés de vingt ans et plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en vertu des dernières paroles de David ». L’hébreu peut indiquer que ce recensement fut effectué sur la base des dernières directives de David.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve naturellement le lien logique du texte hébreu.
- source_word: בְּדִבְרֵי דָוִיד הָאַחֲרֹנִים
  choice: d’après les dernières paroles de David
  rationale: La préposition ב peut indiquer ici le fondement ou la norme du recensement. « D’après » est naturel en français tout en préservant l’ambiguïté entre paroles et directives.
- source_word: הֵמָּה מִסְפַּר
  choice: on compta
  rationale: La tournure hébraïque est elliptique et renvoie au dénombrement des Lévites. La formulation impersonnelle française restitue ce sens sans préciser un agent absent du texte.
- source_word: בְּנֵי לֵוִי
  choice: les fils de Lévi
  rationale: Conserve l’expression généalogique hébraïque, qui désigne collectivement les descendants de Lévi.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: depuis l’âge de vingt ans et au-dessus
  rationale: Rend la formule hébraïque d’âge de manière claire et relativement formelle, en incluant les personnes plus âgées.
