  yaml_path: translation/ot/1_chronicles/016/042.yaml
  text: And with them were Heman and Jeduthun with trumpets and cymbals for sounding aloud[a], and instruments for the songs of God; and the sons of Jeduthun were at the gate.
translation:
  language: fr
  text: Avec eux se trouvaient Héman et Yedoutoun, avec des trompettes et des cymbales pour en faire entendre le son, ainsi que des instruments pour les chants de Dieu. Les fils de Yedoutoun étaient à la porte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étaient chargés de la porte » ou « étaient portiers » ; l’hébreu dit littéralement « à/pour la porte » et peut désigner un service assigné à cet endroit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Auprès d’eux se trouvaient
  rationale: La préposition exprime la présence aux côtés des personnes déjà mentionnées; le verbe « se trouvaient » est ajouté en français pour former une phrase naturelle.
- source_word: הֵימָן וִידוּתוּן
  choice: Héman et Yedoutoun
  rationale: Translittération française claire des deux noms propres hébreux.
- source_word: חֲצֹצְרוֹת וּמְצִלְתַּיִם
  choice: des trompettes et des cymbales
  rationale: Équivalents français usuels des instruments cérémoniels désignés par l’hébreu.
- source_word: לְמַשְׁמִיעִים
  choice: pour les faire retentir
  rationale: La forme causative de שמע signifie ici « faire entendre ». Cette formulation française conserve l’idée de produire publiquement le son des trompettes et des cymbales sans préciser indûment une mélodie.
- source_word: וּכְלֵי שִׁיר הָאֱלֹהִים
  choice: ainsi que des instruments pour les chants de Dieu
  rationale: La traduction garde le lien explicite entre les instruments, les chants et Dieu, sans réduire l’expression au sens plus général d’« instruments de musique ».
- source_word: וּבְנֵי יְדוּתוּן
  choice: Les fils de Yedoutoun
  rationale: « Fils » rend directement le terme généalogique masculin בְּנֵי dans ce contexte lévitique.
- source_word: לַשָּׁעַר
  choice: étaient à la porte
  rationale: L’hébreu dit littéralement « à/pour la porte ». Le texte principal conserve cette expression concise et laisse en note l’interprétation fonctionnelle probable.
