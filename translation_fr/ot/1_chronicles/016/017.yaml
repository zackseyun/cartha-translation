  - marker: b
    text: Ou « une alliance éternelle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: Il l’établit
  rationale: Le hiphil de עמד exprime ici l’action de faire tenir fermement ou de mettre en vigueur. « Il l’établit » est naturel en français et convient à la portée juridique et relationnelle du contexte. Le pronom « l’ » conserve l’anaphore féminine sans imposer un antécédent précis.
- source_word: לְיַעֲקֹב
  choice: pour Jacob
  rationale: La préposition ל peut marquer le destinataire ou le bénéficiaire. Dans cette construction, « pour Jacob » est idiomatique en français et se maintient dans le parallélisme avec Israël.
- source_word: לְחֹק
  choice: comme une prescription
  rationale: חֹק désigne une règle fixée, une prescription ou un décret. « Prescription » conserve la nuance normative et juridique sans suggérer nécessairement une loi votée, comme pourrait le faire « statut » en français moderne.
- source_word: לְיִשְׂרָאֵל
  choice: pour Israël
  rationale: Cette formulation reproduit le parallélisme avec « pour Jacob » et conserve les deux noms employés dans le texte hébreu.
- source_word: בְּרִית עוֹלָם
  choice: comme une alliance perpétuelle
  rationale: « Alliance » rend le terme théologique central בְּרִית. Dans ce contexte, « perpétuelle » exprime la durée permanente de עוֹלָם sans trancher en faveur d’une conception philosophique abstraite de l’éternité.
theological_decisions:
- issue: Antécédent du pronom suffixe dans וַיַּעֲמִידֶהָ
  choice: Le rendre par « l’ » sans préciser davantage son antécédent.
  alternative: Expliciter « l’alliance » ou « le serment » selon le contexte précédent.
  rationale: Les versets précédents associent l’alliance, la parole jurée et le serment. Le pronom français maintient cette référence contextuelle sans réduire l’ambiguïté du texte à un seul antécédent.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébreu est conservé, de même que la virgule finale indiquant que la phrase se poursuit dans le contexte poétique.
