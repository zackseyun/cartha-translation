  - severity: medium
    issue: La note a emploie « il le confirma », avec un accord masculin discordant.
    rationale: Le suffixe de וַיַּעֲמִידֶהָ est féminin. La note ne devrait pas introduire une forme française masculine qui suggère un antécédent plus précis ou différent. Une formulation qui décrit la valeur du verbe évite de forcer l’antécédent.
