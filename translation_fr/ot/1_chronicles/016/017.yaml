  text: And he confirmed it to Jacob as a statute[a], to Israel as an everlasting covenant[b],
translation:
  language: fr
  text: Il l’établit pour Jacob comme une loi[a], pour Israël comme une alliance perpétuelle[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un décret ». Le verbe hébreu peut aussi exprimer l’idée d’affermir ou de confirmer.
