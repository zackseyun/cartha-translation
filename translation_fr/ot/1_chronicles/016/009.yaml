  text: שִׁ֤ירוּ ל/וֹ֙ זַמְּרוּ ל֔/וֹ שִׂ֖יחוּ בְּ/כָל נִפְלְאֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/009.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous deeds.
translation:
  language: fr
  text: Chantez-lui, chantez ses louanges ; parlez de toutes ses merveilles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « racontez toutes ses merveilles » ou « méditez sur toutes ses merveilles ». Le verbe hébreu peut évoquer aussi bien la parole que la réflexion, mais le contexte d’exhortation publique favorise ici un sens verbal.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Chantez
  rationale: Impératif pluriel du verbe courant « chanter » ; cette formulation directe conserve le parallélisme poétique.
- source_word: לֹו
  choice: pour lui
  rationale: La préposition ל avec suffixe peut indiquer le destinataire ou celui en l’honneur de qui l’on chante. « Pour lui » est naturel en français et convient aux deux premiers impératifs.
- source_word: זַמְּרוּ לֹו
  choice: célébrez-le par vos chants
  rationale: Le piel de זמר désigne le chant ou la musique de louange. Cette formulation distingue le deuxième membre du simple « chantez » sans introduire l’idée plus étroite d’un instrument.
- source_word: שִׂיחוּ
  choice: parlez de
  rationale: Le verbe peut évoquer la parole, le récit ou la méditation. Dans cette exhortation publique, le sens verbal extérieur paraît le plus probable, tout en laissant l’autre nuance en note.
- source_word: בְּכָל
  choice: de toutes
  rationale: Avec « parler », la préposition hébraïque est rendue idiomatiquement par « de », tandis que « toutes » préserve la portée globale de כָּל.
- source_word: נִפְלְאֹתָיו
  choice: ses œuvres merveilleuses
  rationale: Le nom désigne les actes extraordinaires de Dieu qui suscitent l’émerveillement. « Œuvres merveilleuses » exprime à la fois leur caractère admirable et leur dimension concrète.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des impératifs est conservé, avec une légère variation lexicale pour rendre la différence entre שׁיר et זמר. Le point-virgule reflète les membres poétiques du verset.
