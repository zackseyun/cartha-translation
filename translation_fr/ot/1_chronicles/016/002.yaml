id: 1CH.16.2
reference: 1 Chronicles 16:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔יד מֵ/הַעֲל֥וֹת הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֥רֶךְ אֶת הָ/עָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/002.yaml
  text: When David finished offering up the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh.
translation:
  language: fr
  text: Quand David eut fini d’offrir l’holocauste et les sacrifices de paix[a], il bénit le peuple au nom de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion » ou « sacrifices de bien-être ».
    reason: Alternative lexicale reflétant les nuances possibles de שְׁלָמִים.
lexical_decisions:
- source_word: וַיְכַל
  choice: Quand … eut fini
  rationale: Le wayyiqtol de כלה marque ici l’achèvement et relie temporellement cette action à la bénédiction qui suit. Le passé antérieur convient au récit français après « quand ».
- source_word: מֵהַעֲלוֹת
  choice: d’offrir
  rationale: Après כלה, מִן avec l’infinitif construit exprime l’action menée à son terme. En français, « finir d’offrir » est naturel et conserve le sens sacrificiel du verbe.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: עֹלָה est le terme sacrificiel usuel pour l’offrande entièrement consumée. « Holocauste » est la désignation biblique française reconnue pour cette catégorie de sacrifice.
- source_word: וְהַשְּׁלָמִים
  choice: et les sacrifices de paix
  rationale: שְׁלָמִים désigne une catégorie de sacrifices liée à la paix, au bien-être et à la communion. « Sacrifices de paix » reste précis et intelligible, tandis que les autres nuances sont signalées en note.
- source_word: וַיְבָרֶךְ
  choice: il bénit
  rationale: ברך signifie simplement « bénir » dans ce contexte; cette formulation est exacte, naturelle et digne.
- source_word: אֶת־הָעָם
  choice: le peuple
  rationale: Le texte dit « le peuple » sans quantificateur; il ne convient donc pas d’ajouter « tout ».
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: בְּשֵׁם se rend naturellement par « au nom de ». Le nom divin יהוה est translittéré « Yahweh » afin de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Sens du terme sacrificiel שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion; sacrifices de bien-être
  rationale: Le terme hébreu peut évoquer la paix, le bien-être ou la communion. Le texte principal conserve la désignation traditionnelle de la catégorie sacrificielle, sans réduire son champ sémantique; les autres traductions légitimes figurent en note.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel; le Seigneur; Jéhovah
  rationale: L’hébreu emploie explicitement le tétragramme. La translittération « Yahweh » préserve le caractère de nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, au registre narratif digne et accessible. Le passé antérieur après « quand » exprime clairement l’antériorité immédiate dans un récit au passé. La terminologie sacrificielle demeure reconnaissable, avec la nuance lexicale préservée en note.
