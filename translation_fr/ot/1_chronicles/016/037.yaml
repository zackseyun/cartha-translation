revisions:
- from: David laissa là, devant l’arche de l’alliance de Yahweh, Asaph et ses frères, afin qu’ils assurent constamment le service devant l’arche, selon ce qui était requis chaque jour.[a]
  to: David laissa là, devant l’arche de l’alliance de Yahweh, Asaph et ses frères, pour exercer le service devant l’arche, continuellement, selon les exigences de chaque jour.[a]
  rationale: La révision supprime l’imparfait non exprimé par l’hébreu, rend plus directement le service cultuel de לְשָׁרֵת et conserve la répétition structurante de « devant l’arche ». La note maintient la littéralité et l’ambiguïté lexicale de l’idiome final.
