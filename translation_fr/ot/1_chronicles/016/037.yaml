  text: וַ/יַּֽעֲזָב שָׁ֗ם לִ/פְנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה לְ/אָסָ֖ף וּ/לְ/אֶחָ֑י/ו לְ/שָׁרֵ֞ת לִ/פְנֵ֧י הָ/אָר֛וֹן תָּמִ֖יד לִ/דְבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/037.yaml
  text: So he left Asaph and his brothers there before the ark of the covenant of Yahweh[a], to minister before the ark continually, according to each day's requirement.
translation:
  language: fr
  text: David laissa là, devant l’arche de l’alliance de Yahweh, Asaph et ses frères, pour exercer le service devant l’arche, continuellement, selon les exigences de chaque jour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon l’affaire d’un jour en son jour » ; autre traduction possible : « selon ce qui est prescrit pour chaque jour ».'
    reason: L’hébreu emploie une tournure idiomatique qui désigne la tâche, la prescription ou l’exigence propre à chaque jour.
lexical_decisions:
- source_word: וַיַּעֲזָב
  choice: laissa
  rationale: Le verbe עזב signifie normalement « laisser ». Dans ce contexte administratif, il indique que David laissa Asaph et ses frères sur place pour assurer durablement leur service, sans introduire l’idée plus interprétative de « nommer ».
- source_word: שָׁם
  choice: là
  rationale: Adverbe locatif simple, renvoyant au lieu où se trouvait l’arche.
- source_word: לִפְנֵי אֲרוֹן בְּרִית יְהוָה
  choice: devant l’arche de l’alliance de Yahweh
  rationale: « Devant » conserve la valeur spatiale et cultuelle de לִפְנֵי. La chaîne construite est maintenue, et le nom divin יְהוָה est transcrit « Yahweh ».
- source_word: לְאָסָף וּלְאֶחָיו
  choice: Asaph et ses frères
  rationale: « Frères » reproduit le sens direct de אחים tout en pouvant naturellement désigner ici ses compagnons lévites.
- source_word: לְשָׁרֵת
  choice: afin qu’ils assurent le service
  rationale: Dans ce cadre cultuel, שרת désigne un service liturgique. Cette formulation est naturelle en français et explicite que le sujet implicite est Asaph avec ses frères.
- source_word: לִפְנֵי הָאָרוֹן תָּמִיד
  choice: constamment le service devant l’arche
  rationale: תמיד exprime la régularité continue du service. « Constamment » conserve cette portée sans suggérer nécessairement une activité ininterrompue à chaque instant.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: selon ce qui était requis chaque jour
  rationale: Cette expression idiomatique renvoie à la tâche ou prescription propre à chaque journée. La formulation française en transmet le sens administratif et cultuel tout en signalant en note l’image littérale.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le caractère de nom propre et suit la convention fournie, sans remplacer celui-ci par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « devant l’arche » est conservée parce qu’elle structure le verset hébreu. Le sujet « David » est explicité à partir du contexte immédiat afin d’éviter en français un pronom initial sans antécédent dans un verset isolé.
