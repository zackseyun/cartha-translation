review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : David laisse Asaph et ses frères devant l’arche de l’alliance de Yahweh pour y exercer un service régulier. Toutefois, « ce qui était requis » introduit inutilement un imparfait que l’hébreu ne porte pas et affaiblit la formulation normative/journalière de לִדְבַר יוֹם בְּיוֹמוֹ.'
  naturalness: Le français est clair et de registre approprié. « Assurer le service » est recevable, mais « exercer le service » est plus direct dans un contexte cultuel et permet une syntaxe plus proche de l’enchaînement hébreu. « Selon les exigences de chaque jour » est naturel et précis.
  terminology: « Yahweh », « arche de l’alliance », « Asaph », « ses frères » et la répétition de « devant l’arche » sont appropriés. La note doit conserver le caractère idiomatique de l’expression finale sans donner à « affaire » une valeur trop technique en français.
  issues:
  - severity: low
    issue: Temps implicite ajouté dans « ce qui était requis chaque jour »
    rationale: L’expression hébraïque désigne la prescription ou la tâche propre à chaque jour, sans marquage d’imparfait. « Les exigences de chaque jour » rend ce sens sans ajout temporel.
  - severity: low
    issue: Formulation légèrement indirecte de l’activité cultuelle
    rationale: « Afin qu’ils assurent constamment le service » est compréhensible, mais « pour exercer le service devant l’arche, continuellement » reproduit plus directement la construction infinitive et la portée de תמיד.
  revised_text: David laissa là, devant l’arche de l’alliance de Yahweh, Asaph et ses frères, pour exercer le service devant l’arche, continuellement, selon les exigences de chaque jour.[a]
