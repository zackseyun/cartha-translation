    reason: L’hébreu emploie une tournure idiomatique qui désigne la tâche, la prescription ou l’exigence propre à chaque jour.
  revision_rationale: La révision supprime l’imparfait non exprimé par l’hébreu, rend plus directement le service cultuel de לְשָׁרֵת et conserve la répétition structurante de « devant l’arche ». La note maintient la littéralité et l’ambiguïté lexicale de l’idiome final.
