  text: וְ/אִמְר֕וּ הוֹשִׁיעֵ֨/נוּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/נוּ וְ/קַבְּצֵ֥/נוּ וְ/הַצִּילֵ֖/נוּ מִן הַ/גּוֹיִ֑ם לְ/הֹדוֹת֙ לְ/שֵׁ֣ם קָדְשֶׁ֔/ךָ לְ/הִשְׁתַּבֵּ֖חַ בִּ/תְהִלָּתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/035.yaml
  text: And say[a], “Save us, O God of our salvation; gather us and deliver us from the nations[b], that we may give thanks to your holy name and glory in your praise.”
translation:
  language: fr
  text: 'Et dites : « Sauve-nous, Dieu de notre salut ! Rassemble-nous et délivre-nous des nations[a], afin que nous rendions grâce à ton saint nom et que nous nous glorifiions de ta louange[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des peuples ».
    reason: lexical_alternative
  - marker: b
    text: Ou « que nous exultions en te louant » ; le verbe peut aussi exprimer l’idée de se féliciter ou de mettre sa fierté dans cette louange.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִמְרוּ
  choice: Et dites
  rationale: L’impératif pluriel introduit la réponse de l’assemblée. « Et » conserve l’enchaînement liturgique marqué par la conjonction.
- source_word: הוֹשִׁיעֵנוּ
  choice: Sauve-nous
  rationale: Rend directement l’impératif causatif de ישׁע, tout en réservant « délivre-nous » au verbe נצל qui suit.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Dieu de notre salut
  rationale: Reproduit naturellement la construction hébraïque sans la transformer en titre théologique ultérieur.
- source_word: וְקַבְּצֵנוּ
  choice: Rassemble-nous
  rationale: Exprime l’action de réunir un peuple dispersé et conserve la possible nuance de restauration.
- source_word: וְהַצִּילֵנוּ
  choice: et délivre-nous
  rationale: Distingue נצל du précédent ישׁע et convient à l’idée d’arracher le peuple à une situation hostile.
- source_word: מִן־הַגּוֹיִם
  choice: du milieu des nations
  rationale: Dans ce contexte, גּוֹיִם désigne les peuples parmi lesquels Israël est dispersé. « Du milieu de » explicite sobrement la sortie hors de ces nations.
- source_word: לְהוֹדוֹת לְשֵׁם קָדְשֶׁךָ
  choice: afin que nous rendions grâce à ton saint nom
  rationale: La tournure finale rend la valeur de but de לְ. « Rendre grâce » correspond au sens cultuel de ידה, et « ton saint nom » conserve la formulation révérencielle.
- source_word: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: et que nous nous glorifiions de ta louange
  rationale: Le verbe pronominal « se glorifier de » garde la nuance positive d’exultation ou de fierté du hitpael, tandis que « ta louange » préserve la formulation dense et quelque peu ambiguë de l’hébreu.
theological_decisions:
- issue: Portée de « les nations »
  choice: du milieu des nations
  alternative: du milieu des païens
  rationale: Le passage évoque les peuples parmi lesquels Israël peut être dispersé, sans imposer ici une opposition théologique ultérieure entre Juifs et non-Juifs.
- issue: Sens de l’expression finale de fierté et de louange
  choice: nous nous glorifiions de ta louange
  alternative: nous exultions en te louant
  rationale: La formulation retenue conserve l’idée hébraïque de se glorifier ou de tirer fierté, mais en orientant clairement cette fierté vers la louange de Dieu plutôt que vers soi-même.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le vocatif est rendu sans « ô », peu naturel dans l’usage courant, et la ponctuation met en valeur la prière collective. Les deux verbes « sauver » et « délivrer » restent distincts, conformément à l’hébreu.
