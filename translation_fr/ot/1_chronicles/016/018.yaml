  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: fr
  text: 'en disant[a] : « Je te donnerai le pays de Canaan, la part[b] de votre héritage. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu passe du singulier (« te ») au pluriel (« votre héritage »), ce qui peut indiquer un passage du patriarche auquel la promesse est adressée à ses descendants, héritiers de l’alliance.
    reason: lexical_alternative
  - marker: b
    text: Ou « le lot ». Le mot hébreu désigne littéralement une corde ou une ligne de mesure et, par extension, une part de territoire mesurée et attribuée.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: en disant
  rationale: L’infinitif construit introduit le contenu de la parole d’alliance commencée au verset précédent. « En disant » conserve ce lien de manière naturelle en français.
- source_word: לְךָ
  choice: te
  rationale: Le suffixe masculin singulier désigne le patriarche auquel la promesse est adressée; « te » rend directement le complément du verbe « donner ».
- source_word: אֶתֵּן
  choice: je donnerai
  rationale: Dans ce contexte de promesse, l’imparfait qal à la première personne du singulier a naturellement une valeur future.
- source_word: אֶרֶץ כְּנָעַן
  choice: le pays de Canaan
  rationale: Cette expression désigne le territoire concret promis. « Le pays de Canaan » est la formulation française courante et précise.
- source_word: חֶבֶל
  choice: la part
  rationale: Le nom désigne littéralement une corde ou une ligne de mesure, puis, par extension, une part de territoire mesurée et attribuée. « La part » conserve l’idée d’attribution sans produire un littéralisme maladroit.
- source_word: נַחֲלַתְכֶם
  choice: qui vous revient en héritage
  rationale: Le nom désigne un bien reçu en héritage, notamment la terre de l’alliance. Cette formulation naturelle conserve le suffixe pluriel « vous » et exprime le rapport entre la part attribuée et l’héritage.
theological_decisions:
- issue: Passage du destinataire singulier au possessif pluriel
  choice: 'Conserver les deux nombres : « Je te donnerai… qui vous revient en héritage »'
  alternative: Uniformiser au singulier (« qui te revient en héritage ») ou expliciter « à toi et à tes descendants »
  rationale: L’hébreu juxtapose explicitement le singulier לְךָ et le pluriel נַחֲלַתְכֶם. La traduction maintient ce déplacement, qui peut faire passer du patriarche destinataire de la promesse à ses descendants héritiers, sans l’expliquer directement dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant une expression peu idiomatique comme « la part de votre héritage ». Le changement du singulier au pluriel est volontairement préservé.
