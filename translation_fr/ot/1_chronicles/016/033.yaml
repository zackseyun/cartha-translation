  text: אָ֥ז יְרַנְּנ֖וּ עֲצֵ֣י הַ/יָּ֑עַר מִ/לִּ/פְנֵ֣י יְהוָ֔ה כִּי בָ֖א לִ/שְׁפּ֥וֹט אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/033.yaml
  text: Then the trees of the forest will sing for joy before Yahweh[c][b][a], for he comes to judge the earth.
translation:
  language: fr
  text: Alors les arbres de la forêt pousseront des cris de joie[a] devant Yahweh, car il vient[b] juger la terre.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chanteront de joie ». Le verbe hébreu peut évoquer un chant ou une acclamation jubilante.
    reason: lexical_alternative
  - marker: b
    text: Ou « il va venir juger la terre ». La forme hébraïque peut présenter une action à venir comme vive et certaine dans un contexte poétique.
    reason: lexical_alternative
  - marker: c
    text: Ou « le pays »; dans ce contexte de louange cosmique, « la terre » paraît préférable.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: L’adverbe temporel introduit naturellement la scène qui s’ensuit.
- source_word: יְרַנְּנוּ
  choice: pousseront des cris de joie
  rationale: Le piel de רנן désigne une expression sonore et jubilante; cette formulation française conserve l’ambiguïté entre chant et acclamation.
- source_word: עֲצֵי הַיָּעַר
  choice: les arbres de la forêt
  rationale: Traduction directe du groupe construit, qui préserve la personnification poétique.
- source_word: מִלִּפְנֵי
  choice: devant
  rationale: Dans ce contexte, le terme situe la joie en présence de Yahweh sans reproduire lourdement l’idiome hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, plutôt que substitution par un titre.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de la joie de la création dans un registre poétique digne.
- source_word: בָא
  choice: il vient
  rationale: Le qatal poétique présente la venue comme vive et certaine; le présent français en conserve la force.
- source_word: לִשְׁפּוֹט
  choice: juger
  rationale: Rend directement la fonction judiciaire et gouvernementale exprimée par שׁפט.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le contexte cosmique favorise la terre entière, tout en laissant possible le sens plus local de pays.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve sans lui substituer un titre.
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: La louange de la création dans le contexte favorise une portée universelle, mais le nom hébreu peut aussi désigner un territoire.
- issue: Valeur temporelle de בָא
  choice: il vient
  alternative: il va venir; il est venu
  rationale: La forme accomplie peut, dans cette poésie, présenter une venue imminente ou certaine avec une grande vivacité; le présent français préserve cette tension.
translation_notes:
  register: Français international moderne, poétique et digne. « Pousser des cris de joie » reste naturel tout en conservant la dimension sonore de רנן. Les notes sont placées après les expressions auxquelles elles se rapportent.
