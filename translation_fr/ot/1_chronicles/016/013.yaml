  text: זֶ֚רַע יִשְׂרָאֵ֣ל עַבְדּ֔/וֹ בְּנֵ֥י יַעֲקֹ֖ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/013.yaml
  text: O offspring of Israel his servant[a], sons of Jacob[c][b], his chosen ones.
translation:
  language: fr
  text: Descendants d’Israël, son serviteur[a], fils de Jacob[b], ceux qu’il a choisis[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le pronom « son » renvoie à Dieu : Israël est son serviteur.'
    reason: referent_clarification
  - marker: b
    text: Ou « enfants de Jacob » ; l’hébreu dit littéralement « fils de Jacob ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ses élus ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: descendants
  rationale: Le nom hébreu, au singulier collectif, désigne ici la postérité d’Israël. « Descendants » exprime naturellement ce sens collectif en français moderne, sans l’ambiguïté que pourrait créer le littéral « semence ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française traditionnelle du nom personnel et communautaire.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: Dans ce contexte d’alliance, עבד présente Israël dans sa relation de service et d’appartenance à Dieu ; « serviteur » convient mieux que « esclave ».
- source_word: בְּנֵי
  choice: fils de
  rationale: La construction hébraïque signifie littéralement « fils de » et fonctionne ici comme une désignation généalogique et collective conventionnelle.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Forme française traditionnelle du nom du patriarche.
- source_word: בְּחִירָיו
  choice: ceux qu’il a choisis
  rationale: Cette formulation claire et actuelle rend explicitement le pluriel et l’acte de choisir, sans la charge doctrinale que peut porter « élus ».
theological_decisions:
- issue: Référent des suffixes masculins singuliers dans « son serviteur » et « ceux qu’il a choisis »
  choice: 'Les pronoms renvoient à Dieu : Israël est son serviteur, et les fils de Jacob sont ceux qu’il a choisis.'
  alternative: On pourrait conserver une apposition plus lâche sans expliciter mentalement le possesseur, mais le contexte désigne naturellement Dieu.
  rationale: Le texte hébreu garde le référent sous forme pronominale. La traduction fait de même avec « son » et « il », préservant la formulation tout en laissant le contexte identifier Dieu.
translation_notes:
  register: Adresse poétique directe, concise et solennelle. Le français demeure actuel et accessible. « Descendants » privilégie le sens naturel du singulier collectif hébreu ; « fils de Jacob » conserve l’expression généalogique du texte source.
