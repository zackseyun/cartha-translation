id: 1CH.16.12
reference: 1 Chronicles 16:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זִכְר֗וּ נִפְלְאֹתָי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה מֹפְתָ֖י/ו וּ/מִשְׁפְּטֵי פִֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/012.yaml
  text: Remember his wondrous deeds that he has done[a], his signs[c][b], and the judgments of his mouth.
translation:
  language: fr
  text: Souvenez-vous des merveilles[a] qu’il a accomplies, de ses signes[b] et des jugements qu’il a prononcés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « actes merveilleux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « prodiges » ou « manifestations extraordinaires ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « des décisions » ou « des décrets sortis de sa bouche ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Souvenez-vous
  rationale: L’impératif pluriel de זכר appelle les destinataires à se rappeler activement les actes de Dieu. « Souvenez-vous » est naturel, direct et conserve la force exhortative.
- source_word: נִפְלְאֹתָיו
  choice: ses merveilles
  rationale: Le terme désigne les actes extraordinaires de Dieu qui suscitent l’émerveillement. En français, « merveilles » peut naturellement désigner ces œuvres, tandis que la proposition relative précise qu’il les a accomplies.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il a accomplies
  rationale: La proposition relative qualifie les merveilles comme des actes réalisés par Dieu. Le passé composé convient à l’appel présent à se souvenir d’actions achevées.
- source_word: מֹפְתָיו
  choice: ses signes
  rationale: מופת désigne souvent une manifestation qui atteste la puissance divine. « Signes » reste courant et n’impose pas la nuance plus étroite de « miracles » ni la coloration parfois menaçante de « présages ».
- source_word: וּמִשְׁפְּטֵי פִיהוּ
  choice: et des jugements qu’il a prononcés
  rationale: משפטים peut désigner des jugements, des décisions ou des décrets. La formulation française rend naturellement l’image de paroles issues de sa bouche sans réduire la portée judiciaire du terme.
theological_decisions:
- issue: Distinction entre נִפְלְאֹתָיו et מֹפְתָיו dans le parallélisme
  choice: 'Employer deux termes distincts : « merveilles » et « signes ».'
  alternative: « actes merveilleux » et « prodiges »
  rationale: L’hébreu rapproche deux notions apparentées sans les confondre. Deux rendus distincts préservent cette texture poétique et la possible fonction attestatrice des מֹפְתִים.
- issue: Portée de מִשְׁפְּטֵי
  choice: « jugements »
  alternative: « décisions » ou « décrets »
  rationale: « Jugements » conserve la nuance judiciaire première tout en laissant ouverte la possibilité de décisions ou d’ordonnances divines, signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La répétition des compléments introduits par « de » soutient le rythme de l’exhortation. « Qu’il a prononcés » rend idiomatiquement l’expression hébraïque « les jugements de sa bouche », dont l’image plus littérale demeure perceptible dans la note.
