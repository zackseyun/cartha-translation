  text: וַ/יִּֽתְהַלְּכוּ֙ מִ/גּ֣וֹי אֶל גּ֔וֹי וּ/מִ/מַּמְלָכָ֖ה אֶל עַ֥ם אַחֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/020.yaml
  text: And they wandered from nation to nation[a], and from one kingdom to another people.
translation:
  language: fr
  text: Ils allaient de nation en nation, et d’un royaume vers un autre peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: ils allaient
  rationale: Le hitpael de הלך exprime ici un déplacement répété, précisé par les compléments « de… en… ». L’imparfait français rend naturellement cette progression sans imposer l’idée plus marquée d’une errance.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: de nation en nation
  rationale: Cette tournure française idiomatique conserve la répétition de גּוֹי et le sens distributif du mouvement.
- source_word: וּמִמַּמְלָכָה
  choice: et d’un royaume
  rationale: מַמְלָכָה signifie « royaume » ; l’article indéfini permet une formulation française naturelle dans la construction parallèle.
- source_word: אֶל עַם אַחֵר
  choice: vers un autre peuple
  rationale: « Peuple » préserve la distinction lexicale entre עַם et גּוֹי. « Vers » évite la lecture selon laquelle le peuple serait un territoire, tout en conservant la direction exprimée par אֶל.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. La structure parallèle de l’hébreu est conservée, ainsi que la distinction entre « nation », « royaume » et « peuple ».
