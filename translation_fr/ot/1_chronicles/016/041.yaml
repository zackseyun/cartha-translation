id: 1CH.16.41
reference: 1 Chronicles 16:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עִמָּ/הֶם֙ הֵימָ֣ן וִֽ/ידוּת֔וּן וּ/שְׁאָר֙ הַ/בְּרוּרִ֔ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לְ/הֹדוֹת֙ לַֽ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/041.yaml
  text: And with them were Heman and Jeduthun and the rest of those chosen, who were designated by name to give thanks to Yahweh, for his steadfast love endures forever.
translation:
  language: fr
  text: Avec eux se trouvaient Héman, Yedoutoun et les autres personnes choisies, qui avaient été désignées par leur nom[a] pour rendre grâce à Yahweh, car son amour fidèle dure pour toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avaient été nommées individuellement » ou « avaient été expressément désignées ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car son amour fidèle est pour toujours ». Il s’agit d’un refrain liturgique fréquent.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Avec eux se trouvaient
  rationale: Le verbe est sous-entendu en hébreu. « Se trouvaient » restitue naturellement en français la présence du groupe auprès des personnes mentionnées auparavant.
- source_word: הֵימָן וִידוּתוּן
  choice: Héman, Yedoutoun
  rationale: Translittération des deux noms propres selon des formes françaises claires et courantes.
- source_word: וּשְׁאָר הַבְּרוּרִים
  choice: et les autres personnes choisies
  rationale: שְׁאָר désigne le reste du groupe et הַבְּרוּרִים ceux qui ont été sélectionnés. « Personnes » évite d’ajouter le mot « hommes », absent de l’hébreu.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: qui avaient été désignées par leur nom
  rationale: Le niphal de נקב associé à « noms » exprime une désignation explicite et individuelle. Le plus-que-parfait situe naturellement cette désignation avant le service décrit.
- source_word: לְהֹדוֹת
  choice: pour rendre grâce
  rationale: Dans ce contexte liturgique, le hiphil de ידה signifie remercier ou louer. « Rendre grâce » convient au registre cultuel sans exclure la dimension de louange.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le nom divin יהוה est translittéré afin de préserver le nom propre présent dans le texte hébreu.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: car son amour fidèle dure pour toujours
  rationale: חֶסֶד désigne ici l’amour loyal et constant de Dieu. Le verbe « dure », implicite en hébreu, donne en français une formulation naturelle tout en conservant la portée temporelle de לְעוֹלָם.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie directement le Tétragramme. « Yahweh » préserve sa fonction de nom propre sans le remplacer par un titre.
- issue: Portée de חֶסֶד
  choice: amour fidèle
  alternative: bonté / miséricorde / amour d’alliance
  rationale: « Amour fidèle » conserve à la fois l’affection, la loyauté et la constance du terme, sans limiter celui-ci à une seule formulation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure collective du texte hébreu, le nom divin et la formule liturgique, tout en explicitant seulement les éléments verbaux nécessaires à un français naturel.
