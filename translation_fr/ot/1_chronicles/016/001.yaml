source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יַּצִּ֣יגוּ אֹת֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָֽטָה ל֖/וֹ דָּוִ֑יד וַ/יַּקְרִ֛יבוּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/001.yaml
  text: So they brought in the ark of God and set it in the midst of the tent that David had pitched for it[b][a], and they offered burnt offerings and peace offerings before God.
translation:
  language: fr
  text: Ils apportèrent l’arche de Dieu et la placèrent au milieu de la tente[a] que David avait dressée pour elle. Puis ils offrirent devant Dieu des holocaustes et des sacrifices de communion[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’intérieur de la tente » ; l’expression hébraïque signifie littéralement « au milieu de la tente », mais peut désigner plus généralement ce qui se trouve à l’intérieur.
    reason: lexical_alternative
  - marker: b
    text: Ou « sacrifices de paix » ou « sacrifices de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: ils apportèrent donc
  rationale: Le hiphil de בוא signifie ici « apporter » ou « faire entrer ». « Apportèrent » exprime naturellement le déplacement de l’arche jusqu’à la tente; « donc » marque la continuité narrative sans surcharger la phrase.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Cette formulation reproduit l’expression hébraïque exacte sans ajouter la mention de l’alliance, absente du verset.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: la placèrent
  rationale: Le verbe causatif indique qu’on met quelque chose à une place déterminée. Le pronom est rendu par « la » conformément au genre français d’« arche ».
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: au milieu de la tente
  rationale: Cette traduction conserve la nuance spatiale concrète de בְּתוֹךְ, tout en signalant en note que l’expression peut plus largement signifier « à l’intérieur ».
- source_word: הָאֹהֶל
  choice: la tente
  rationale: Le texte emploie le nom commun « tente ». « Tabernacle » introduirait une identification cultuelle que ce verset ne formule pas explicitement.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִיד
  choice: que David avait dressée pour elle
  rationale: נטה, employé à propos d’une tente, signifie la dresser ou la déployer. Le plus-que-parfait rend l’antériorité implicite, et « pour elle » rapporte naturellement לוֹ à l’arche.
- source_word: וַיַּקְרִיבוּ
  choice: ils offrirent
  rationale: Dans un contexte sacrificiel, le hiphil de קרב désigne l’action de présenter ou d’offrir un sacrifice.
- source_word: עֹלוֹת
  choice: des holocaustes
  rationale: « Holocaustes » est le terme cultuel français établi pour les sacrifices entièrement consumés sur l’autel et distingue clairement cette catégorie d’offrande.
- source_word: שְׁלָמִים
  choice: des sacrifices de communion
  rationale: Cette expression française actuelle rend la dimension de paix, de bien-être et de partage associée aux שְׁלָמִים sans les réduire à des sacrifices génériques.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: devant Dieu
  rationale: La traduction concise et transparente conserve l’idée hébraïque d’agir devant la face ou en présence de Dieu.
theological_decisions:
- issue: Terminologie des sacrifices
  choice: Conserver les catégories distinctes « holocaustes » et « sacrifices de communion ».
  alternative: « sacrifices entièrement brûlés et sacrifices de paix » ou simplement « sacrifices »
  rationale: Le texte nomme deux types précis d’offrandes. Les distinguer préserve la portée rituelle et théologique du passage sans ajouter d’interprétation doctrinale.
- issue: Identification de la tente
  choice: Traduire הָאֹהֶל par « la tente ».
  alternative: « le tabernacle »
  rationale: Le nom hébreu est le terme ordinaire pour une tente, et le verset précise que David l’avait dressée pour l’arche. « Tabernacle » pourrait identifier à tort cette tente au sanctuaire mosaïque.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit, tandis que le vocabulaire cultuel précis est maintenu sans archaïsmes inutiles. Les deux notes préservent l’étendue sémantique des expressions hébraïques.
