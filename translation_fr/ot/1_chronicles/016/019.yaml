    rationale: « Une poignée » est une paraphrase possible, mais ne conserve pas l’alternative importante « presque rien / fort peu » signalée par l’ambiguïté de כִּמְעַט.
  revised_text: quand vous étiez peu nombreux, très peu nombreux, et que vous séjourniez comme étrangers dans le pays.
