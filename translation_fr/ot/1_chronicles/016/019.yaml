    issue: Formulation de כִּמְעַט
    rationale: « Vraiment très peu » ajoute une tournure d’insistance française qui n’est pas nécessaire et rend moins nettement l’alternative lexicale « presque rien ». « Très peu nombreux » est plus direct et fidèle au parallélisme.
  - severity: low
