  yaml_path: translation/ot/1_chronicles/016/019.yaml
  text: when you were few in number[a], very few, and sojourners in it,
translation:
  language: fr
  text: quand vous étiez peu nombreux, très peu nombreux, et que vous séjourniez comme étrangers dans le pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּהְיוֹתְכֶם
  choice: quand vous étiez
  rationale: La préposition בְּ avec l’infinitif construit de היה et le suffixe de deuxième personne du pluriel introduit une proposition temporelle. « Quand vous étiez » est naturel en français et en conserve le sens.
- source_word: מְתֵי מִסְפָּר
  choice: peu nombreux
  rationale: Cette expression désigne un groupe réduit, aisément dénombrable. « Peu nombreux » rend clairement l’idiome hébreu.
- source_word: כִּמְעַט
  choice: vraiment très peu
  rationale: Dans ce contexte, l’expression renforce l’idée de petit nombre. « Vraiment très peu » garde cette insistance sans faire croire que le groupe était littéralement inexistant.
- source_word: וְגָרִים
  choice: et étrangers en séjour
  rationale: Le participe de גור désigne ceux qui vivent dans un pays sans y être établis comme autochtones ni en posséder pleinement le statut. « Étrangers en séjour » préserve cette nuance mieux que le seul mot « étrangers ».
- source_word: בָּהּ
  choice: dans le pays
  rationale: Le suffixe féminin singulier renvoie au pays mentionné dans le contexte. La répétition explicite de « pays » est plus claire et naturelle en français que « en lui » ou « là ».
