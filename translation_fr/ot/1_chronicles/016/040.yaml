  variant: modern international French
source:
  edition: WLC
  text: לְֽ/הַעֲלוֹת֩ עֹל֨וֹת לַ/יהוָ֜ה עַל מִזְבַּ֧ח הָ/עֹלָ֛ה תָּמִ֖יד לַ/בֹּ֣קֶר וְ/לָ/עָ֑רֶב וּ/לְ/כָל הַ/כָּתוּב֙ בְּ/תוֹרַ֣ת יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/040.yaml
  text: to offer burnt offerings to Yahweh on the altar of burnt offering continually[a], morning and evening, and according to all that is written in the law of Yahweh, which he commanded for Israel.
translation:
  language: fr
  text: pour offrir constamment à Yahweh des holocaustes sur l’autel des holocaustes, matin et soir, conformément à tout ce qui est écrit dans la loi[a] de Yahweh, qu’il a prescrite à Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’instruction de Yahweh » ; le mot hébreu torah peut signifier aussi bien « loi » qu’« instruction ».
    reason: Alternative lexicale permettant de préserver l’étendue de sens de תּוֹרָה.
lexical_decisions:
- source_word: לְהַעֲלוֹת
  choice: pour offrir
  rationale: Dans le contexte sacrificiel, le hifil de עלה signifie idiomatiquement « offrir » un sacrifice, plutôt que, littéralement, « faire monter ».
- source_word: עֹלוֹת
  choice: des holocaustes
  rationale: עֹלָה désigne le sacrifice entièrement consumé sur l’autel ; « holocauste » est le terme cultuel français établi.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque ici le destinataire de l’offrande, et le nom divin יהוה est rendu par « Yahweh ».
- source_word: מִזְבַּח הָעֹלָה
  choice: l’autel des holocaustes
  rationale: Cette expression construite désigne l’autel destiné aux holocaustes ; le pluriel français est naturel dans ce contexte.
- source_word: תָּמִיד
  choice: constamment
  rationale: Le terme exprime la continuité régulière du service cultuel, dont le rythme est ensuite précisé par « matin et soir ».
- source_word: לַבֹּקֶר וְלָעָרֶב
  choice: matin et soir
  rationale: Cette formulation française courante rend clairement le rythme quotidien indiqué par les deux expressions temporelles.
- source_word: וּלְכָל הַכָּתוּב
  choice: conformément à tout ce qui est écrit
  rationale: La préposition ל exprime ici la conformité aux prescriptions écrites ; cette traduction évite un calque obscur.
- source_word: בְּתוֹרַת יְהוָה
  choice: dans la loi de Yahweh
  rationale: Dans ce contexte cultuel et normatif, « loi » communique clairement les prescriptions écrites, tandis qu’une note conserve le sens possible d’« instruction ».
- source_word: אֲשֶׁר צִוָּה עַל יִשְׂרָאֵל
  choice: qu’il a prescrite à Israël
  rationale: Le verbe צוה avec עַל présente le commandement comme imposé à Israël. « Prescrire à » rend ce rapport naturellement en français ; le pronom relatif reprend « la loi » sans exclure l’ensemble de son contenu écrit.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme ; « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée du relatif אֲשֶׁר
  choice: « qu’il a prescrite à Israël », avec « loi » comme antécédent grammatical en français
  alternative: « tout ce qu’il a prescrit à Israël »
  rationale: L’hébreu permet de rattacher la proposition relative à la loi ou, plus largement, à tout ce qui y est écrit. La formulation retenue reste concise et conserve l’idée que cette loi a été prescrite à Israël sans ajouter une explication absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset est conservé comme proposition infinitive, conformément à sa fonction syntaxique dans la phrase commencée au verset précédent. Le vocabulaire cultuel traditionnel « holocauste » est maintenu pour sa précision.
