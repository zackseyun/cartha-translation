  text: יִרְעַ֤ם הַ/יָּם֙ וּ/מְלוֹא֔/וֹ יַעֲלֹ֥ץ הַ/שָּׂדֶ֖ה וְ/כָל אֲשֶׁר בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/032.yaml
  text: Let the sea thunder[a], and all that fills it; let the field exult[b], and all that is in it.
translation:
  language: fr
  text: Que la mer et tout ce qui la remplit grondent[a] ! Que la campagne et tout ce qui s’y trouve exultent !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retentissent » ou « rugissent ». Le verbe hébreu désigne un bruit puissant, semblable à un grondement ou au tonnerre.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעַם
  choice: gronde
  rationale: Le verbe רעם évoque un bruit puissant, grondant ou retentissant. « Gronder » convient naturellement à la mer en français et conserve la force sonore de l’image.
- source_word: הַיָּם
  choice: la mer
  rationale: Équivalent français direct et usuel de יָם dans ce contexte poétique.
- source_word: וּמְלוֹאוֹ
  choice: avec tout ce qui la remplit
  rationale: מְלוֹא désigne littéralement la « plénitude », c’est-à-dire tout ce qui remplit la mer. Cette formulation explicite ce sens en français moderne sans réduire l’expression à son contenu seul.
- source_word: יַעֲלֹץ
  choice: exulte
  rationale: Le verbe עלץ exprime une joie vive et jubilante. « Exulter » en préserve l’intensité et le registre poétique.
- source_word: הַשָּׂדֶה
  choice: la campagne
  rationale: שָׂדֶה peut désigner un champ ou l’étendue ouverte des terres. Ici, avec « tout ce qui s’y trouve », « la campagne » rend naturellement le sens collectif et contraste avec la mer.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: avec tout ce qui s’y trouve
  rationale: La formulation garde la portée exhaustive de כָל et rattache clairement la proposition à la campagne.
theological_decisions: []
translation_notes:
  register: Poésie élevée mais claire, avec deux impératifs de souhait parallèles. La personnification de la mer et de la campagne est conservée. « Avec » restitue ici le waw d’accompagnement de façon naturelle en français.
