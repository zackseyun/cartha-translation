    issue: Nuance de « à cause d’eux »
    rationale: Cette expression peut attribuer aux patriarches une responsabilité causale négative dans la réprimande des rois. La préposition עַל indique plus largement une action les concernant ou accomplie pour leur protection. « À leur sujet » est plus neutre dans le texte, tandis que la note conserve « en leur faveur ».
  revised_text: 'Il ne permit à personne de les opprimer ; il réprimanda des rois à leur sujet :'
