review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est correctement rendu : Dieu ne permet pas l’oppression des patriarches et intervient auprès de rois en référence à eux. Toutefois, « à cause d’eux » peut en français suggérer qu’ils sont eux-mêmes la cause fautive de la réprimande, nuance qui n’est pas imposée par עֲלֵיהֶם. « À leur sujet » conserve mieux la relation référentielle sans éliminer la possibilité d’une intervention en leur faveur.'
  naturalness: « Il ne permit à personne de les opprimer » est idiomatique, sobre et adapté au français international moderne. Le point-virgule sépare clairement les deux actions, et les deux-points finaux préparent naturellement la citation du verset suivant.
  terminology: « Opprimer », « réprimanda » et « rois » correspondent bien aux termes hébreux. Le pronom « il » reprend naturellement Dieu depuis le contexte. La note maintient l’alternative bénéficiaire de la préposition sans surinterprétation.
  issues:
