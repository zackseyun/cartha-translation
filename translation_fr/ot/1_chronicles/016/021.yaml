  text: לֹא הִנִּ֤יחַ לְ/אִישׁ֙ לְ/עָשְׁקָ֔/ם וַ/יּ֥וֹכַח עֲלֵי/הֶ֖ם מְלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/021.yaml
  text: He allowed no man to oppress them[a], and he rebuked kings on their account,
translation:
  language: fr
  text: 'Il ne permit à personne de les opprimer ; il réprimanda des rois à leur sujet :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנִּיחַ
  choice: laissa
  rationale: À la forme causative, avec la négation et un infinitif, le verbe signifie « permettre, laisser ». « Ne laissa personne » est naturel en français moderne.
- source_word: אִישׁ
  choice: personne
  rationale: Le singulier masculin hébreu a ici une portée générique après la négation. « Personne » rend clairement cette valeur sans désigner exclusivement un homme.
- source_word: לְעָשְׁקָם
  choice: les opprimer
  rationale: Le verbe עָשַׁק évoque l’oppression, la spoliation ou l’exploitation. « Opprimer » convient à la portée générale de ce résumé historique.
- source_word: וַיּוֹכַח
  choice: réprimanda
  rationale: Dans ce contexte, יכח désigne une réprimande adressée à des rois. « Réprimanda » exprime nettement cette intervention sans ajouter la notion d’un châtiment.
- source_word: עֲלֵיהֶם
  choice: à cause d’eux
  rationale: La préposition עַל avec suffixe peut indiquer ici le motif ou la personne en faveur de laquelle Dieu intervient. Le texte principal conserve la nuance causale, tandis que la note signale la nuance bénéficiaire.
- source_word: מְלָכִים
  choice: des rois
  rationale: Le nom signifie directement « rois » et ne nécessite pas d’être généralisé en « dirigeants ».
theological_decisions:
- issue: Sujet implicite des verbes
  choice: Le pronom « il » renvoie à Dieu, sujet repris du contexte.
  alternative: Laisser le sujet non précisé.
  rationale: L’hébreu permet de reprendre implicitement le sujet du contexte, tandis que le français exige ici un sujet exprimé. Le contexte présente l’action protectrice de Dieu envers les patriarches.
- issue: Sens de עֲלֵיהֶם
  choice: « à cause d’eux » dans le texte, avec « en leur faveur » en note.
  alternative: « en leur faveur » ou « à leur sujet » dans le texte principal.
  rationale: La construction admet une nuance causale ou bénéficiaire. Une note préserve cette ambiguïté sans imposer une interprétation théologique plus précise que l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. « Personne » est idiomatique pour l’emploi générique de אִישׁ. La ponctuation finale par deux-points respecte le fait que le verset introduit les paroles citées au verset suivant.
