id: 1CH.16.26
reference: 1 Chronicles 16:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֠י כָּל אֱלֹהֵ֤י הָ/עַמִּים֙ אֱלִילִ֔ים וַ/יהוָ֖ה שָׁמַ֥יִם עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/026.yaml
  text: For all the gods of the peoples are idols[b][a], but Yahweh made the heavens.
translation:
  language: fr
  text: Car tous les dieux des peuples[a] sont des idoles, mais[b] Yahweh a fait les cieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des nations ».
    reason: lexical_alternative
  - marker: b
    text: La conjonction hébraïque signifie littéralement « et », mais elle exprime ici un contraste.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel à louer Yahweh dans le contexte immédiat, tout en conservant la valeur explicative de la conjonction hébraïque.
- source_word: כָּל אֱלֹהֵי הָעַמִּים
  choice: tous les dieux des peuples
  rationale: Rend directement la portée globale de כָּל, le sens courant d’אֱלֹהֵי pour les divinités adorées, et le pluriel collectif de עַמִּים.
- source_word: אֱלִילִים
  choice: des idoles
  rationale: Le mot désigne des idoles avec une nuance dépréciative, voire l’idée de choses sans valeur. « Idoles » exprime clairement le contraste sans amplifier le texte.
- source_word: וַיהוָה
  choice: mais Yahweh
  rationale: La conjonction ו peut être rendue ici par « mais », car les deux propositions opposent les divinités des peuples à Yahweh, auteur des cieux.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Le pluriel français « les cieux » correspond à la forme hébraïque et convient naturellement au langage de la création.
- source_word: עָשָׂה
  choice: a fait
  rationale: Rend simplement le sens général du verbe עשה sans lui substituer le verbe plus spécifique « créer ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le nom divin. « Yahweh » le conserve comme nom propre et évite de le remplacer par un titre.
- issue: Valeur de la conjonction ו devant יהוה
  choice: mais
  alternative: et
  rationale: La coordination hébraïque marque ici un contraste manifeste entre les idoles et Yahweh, qui a fait les cieux. La note conserve toutefois la forme plus littérale possible.
- issue: Statut des « dieux des peuples »
  choice: dieux
  alternative: êtres divins ; prétendus dieux
  rationale: 'La formulation directe préserve la tension rhétorique du texte : il les appelle « dieux » tout en affirmant qu’ils sont des idoles, sans résoudre cette tension par une paraphrase théologique.'
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste concise et conserve le parallélisme antithétique de l’hébreu. « Les cieux » maintient le registre biblique sans archaïsme excessif.
