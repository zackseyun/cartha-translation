source:
  edition: WLC
  text: וַ/יְחַלֵּק֙ לְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל מֵ/אִ֖ישׁ וְ/עַד אִשָּׁ֑ה לְ/אִישׁ֙ כִּכַּר לֶ֔חֶם וְ/אֶשְׁפָּ֖ר וַ/אֲשִׁישָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/003.yaml
  text: He distributed to every person of Israel[a], from man to woman, to each one a loaf of bread, a portion of meat, and a raisin cake.
translation:
  language: fr
  text: Il distribua à chaque Israélite, homme ou femme, un pain, une portion de viande[a] et un gâteau de raisins secs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « une portion », ou encore un autre aliment. Le mot hébreu est rare et son sens exact demeure incertain; beaucoup y voient ici une portion de viande.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: Il distribua
  rationale: Le piel narratif de חלק désigne ici la distribution de parts à la foule. « Distribua » est naturel et conserve ce sens concret.
- source_word: לְכָל אִישׁ יִשְׂרָאֵל
  choice: à chaque Israélite
  rationale: אִישׁ a ici une valeur distributive. « Chaque Israélite » exprime clairement l’appartenance au peuple d’Israël sans exclure les femmes, explicitement mentionnées aussitôt après.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: homme ou femme
  rationale: Cette formulation rend de manière naturelle en français l’expression hébraïque qui englobe les destinataires des deux sexes.
- source_word: לְאִישׁ
  choice: valeur rendue par « chaque »
  rationale: La reprise distributive hébraïque souligne que chacun reçut les mêmes aliments. En français, répéter « à chacun » alourdirait la phrase; « chaque Israélite » porte déjà cette valeur.
- source_word: כִּכַּר לֶחֶם
  choice: un pain
  rationale: כִּכָּר désigne ici un pain, probablement de forme ronde. Le simple « un pain » est idiomatique et n’ajoute pas un détail incertain.
- source_word: אֶשְׁפָּר
  choice: une portion de viande
  rationale: Ce nom rare est de sens incertain. Dans ce contexte de distribution festive, « portion de viande » correspond à l’interprétation contextuelle la plus courante, tout en appelant une note.
- source_word: אֲשִׁישָׁה
  choice: un gâteau de raisins secs
  rationale: Le terme désigne vraisemblablement une préparation pressée à base de raisins secs. Cette expression est claire en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La tournure « chaque Israélite, homme ou femme » conserve à la fois la portée distributive et l’inclusion explicite des hommes et des femmes. La note est placée sur le terme réellement incertain.
