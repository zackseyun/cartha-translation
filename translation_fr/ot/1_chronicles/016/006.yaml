  yaml_path: translation/ot/1_chronicles/016/006.yaml
  text: And Benaiah and Jahaziel the priests were continually with the trumpets before the ark of the covenant of God[a].
translation:
  language: fr
  text: Benaya et Yahaziel, les prêtres, étaient constamment avec les trompettes devant l’arche de l’alliance de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sonnaient constamment des trompettes devant l’arche de l’alliance de Dieu ». L’hébreu n’exprime pas le verbe, bien que ce soit probablement le sens voulu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנָיָהוּ וְ/יַחֲזִיאֵל
  choice: Benaya et Yahaziel
  rationale: Les noms propres sont translittérés selon des formes françaises proches de l’hébreu; le waw initial assure ici la continuité du récit sans qu’un « Et » soit nécessaire en français.
- source_word: הַ/כֹּהֲנִים
  choice: les prêtres
  rationale: Rendu direct du nom défini pluriel qui précise la fonction de Benaya et de Yahaziel.
- source_word: בַּ/חֲצֹצְרוֹת
  choice: avec les trompettes
  rationale: Le nom désigne des trompettes, et la préposition peut exprimer l’accompagnement ou l’instrument. Le texte n’énonce pas explicitement le verbe « sonner ».
- source_word: תָּמִיד
  choice: constamment
  rationale: L’adverbe indique la continuité ou la régularité du service, sans en préciser le rythme exact.
- source_word: לִ/פְנֵי
  choice: devant
  rationale: Rendu naturel qui conserve à la fois la position spatiale et le cadre cultuel.
- source_word: אֲרוֹן בְּרִית הָ/אֱלֹהִים
  choice: l’arche de l’alliance de Dieu
  rationale: Cette formulation rend fidèlement la chaîne construite et correspond à l’expression française biblique claire et établie.
theological_decisions:
- issue: Faut-il expliciter que les prêtres sonnaient des trompettes ?
  choice: Conserver dans le texte principal la formulation « se tenaient constamment avec les trompettes ».
  alternative: « sonnaient constamment des trompettes devant l’arche de l’alliance de Dieu »
  rationale: Le contexte rend l’action de sonner très probable, mais l’hébreu ne contient aucun verbe explicite correspondant. Le texte principal préserve donc cette ellipse et la note signale le sens vraisemblable.
translation_notes:
  register: Français international moderne, sobre et digne. « Se tenaient » fournit le minimum verbal nécessaire à une phrase française intelligible, tandis que la note préserve l’ambiguïté de l’ellipse hébraïque.
