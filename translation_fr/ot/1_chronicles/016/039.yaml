source:
  edition: WLC
  text: וְ/אֵ֣ת צָד֣וֹק הַ/כֹּהֵ֗ן וְ/אֶחָי/ו֙ הַ/כֹּ֣הֲנִ֔ים לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה בַּ/בָּמָ֖ה אֲשֶׁ֥ר בְּ/גִבְעֽוֹן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/039.yaml
  text: And Zadok the priest and his fellow priests were before the tabernacle of Yahweh at the high place that was in Gibeon,[a]
translation:
  language: fr
  text: Il laissa aussi le prêtre Tsadok et ses collègues prêtres[a] devant le tabernacle de Yahweh, au haut lieu qui se trouvait à Gabaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses frères, les prêtres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: Il laissa aussi
  rationale: Le וְ coordonne ce groupe aux compléments des versets précédents, tandis que אֵת marque le complément d’objet direct. Pour que le verset soit intelligible en français, le verbe sous-entendu est repris du contexte (v. 37), sans donner à la particule אֵת une traduction autonome.
- source_word: צָדוֹק הַכֹּהֵן
  choice: le prêtre Tsadok
  rationale: Le nom propre est translittéré selon l’usage français courant, et le titre défini est placé avant le nom de façon naturelle.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: et ses collègues prêtres[a]
  rationale: Littéralement « ses frères, les prêtres ». Dans ce cadre de service cultuel, « collègues prêtres » exprime naturellement l’appartenance au même groupe de prêtres sans imposer un lien biologique; la formulation littérale est signalée en note.
- source_word: לִפְנֵי
  choice: devant
  rationale: Le terme indique la position ou le service en présence du sanctuaire; « devant » en conserve directement la valeur locative.
- source_word: מִשְׁכַּן יְהוָה
  choice: le tabernacle de Yahweh
  rationale: מִשְׁכָּן désigne ici la demeure cultuelle mobile, traditionnellement appelée « tabernacle » en français. Le nom divin est rendu par « Yahweh ».
- source_word: בַּבָּמָה
  choice: au haut lieu
  rationale: בָּמָה est le terme usuel pour un lieu cultuel élevé. « Haut lieu » conserve ce sens technique sans ajouter ici de jugement négatif.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: qui se trouvait à Gabaon
  rationale: La proposition relative localise le haut lieu. « Gabaon » est la forme française traditionnelle du toponyme.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Portée de אֶחָיו dans un groupe sacerdotal
  choice: ses collègues prêtres
  alternative: ses frères, les prêtres
  rationale: Le mot « frères » peut désigner des membres du même groupe. Le contexte concerne les prêtres affectés ensemble au sanctuaire; la traduction principale rend cette relation fonctionnelle, tandis que la note préserve la formulation et l’ambiguïté de l’hébreu.
- issue: Statut du haut lieu de Gabaon
  choice: haut lieu
  alternative: sanctuaire des hauteurs
  rationale: Le terme est traduit sans lui attribuer automatiquement la condamnation associée à certains hauts lieux ailleurs, puisque ce passage y situe le tabernacle de Yahweh.
translation_notes:
  register: Français international moderne, clair et digne. La reprise « Il laissa » rend explicite le verbe sous-entendu par la continuité syntaxique avec le verset 37. Le vocabulaire cultuel traditionnel (« tabernacle », « haut lieu ») est conservé pour sa précision.
