id: 1CH.16.30
reference: 1 Chronicles 16:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חִ֤ילוּ מִ/לְּ/פָנָי/ו֙ כָּל הָ/אָ֔רֶץ אַף תִּכּ֥וֹן תֵּבֵ֖ל בַּל תִּמּֽוֹט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/030.yaml
  text: Tremble before him[a], all the earth; indeed, the world is established; it shall not be moved.
translation:
  language: fr
  text: 'Tremble devant lui, terre entière ! Oui, le monde est solidement établi : il ne vacillera pas[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il ne chancellera pas » ou « il ne sera pas ébranlé ». L’image hébraïque est celle d’une ferme stabilité.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִילוּ
  choice: Tremble
  rationale: L’impératif de חול évoque ici le fait de trembler sous l’effet de la présence divine. Le singulier français s’accorde naturellement avec l’apostrophe collective « terre entière », sans réduire la portée universelle du pluriel hébreu.
- source_word: מִלְּפָנָיו
  choice: devant lui
  rationale: Cette expression désigne littéralement ce qui est devant sa face ou sa présence. « Devant lui » restitue clairement et naturellement la relation à la présence divine.
- source_word: כָּל הָאָרֶץ
  choice: terre entière
  rationale: Dans ce contexte cosmique de louange, אֶרֶץ désigne l’ensemble de la terre, non un territoire particulier. L’apostrophe « terre entière » est concise et idiomatique en français.
- source_word: אַף
  choice: Oui
  rationale: La particule renforce l’affirmation qui suit. « Oui » en traduit l’insistance sans lui donner une valeur simplement additive.
- source_word: תִּכּוֹן
  choice: est solidement établi
  rationale: Le niphal de כון exprime un état de fermeté et de stabilité. L’adverbe « solidement » rend explicite cette nuance tout en conservant la forme passive de l’hébreu.
- source_word: תֵּבֵל
  choice: le monde
  rationale: תֵּבֵל désigne souvent le monde ordonné ou habité. « Le monde » en est ici l’équivalent français le plus naturel et le plus concis.
- source_word: בַּל
  choice: ne… pas
  rationale: Cette particule négative poétique est rendue directement par la négation française usuelle.
- source_word: תִּמּוֹט
  choice: il ne vacillera pas
  rationale: Le verbe מוט au niphal évoque ce qui chancelle, glisse ou perd sa stabilité. « Ne vacillera pas » conserve cette image plus nettement qu’une formulation pouvant suggérer une immobilité physique absolue.
theological_decisions:
- issue: Langage de stabilité cosmique
  choice: Le verset affirme la stabilité du monde établi sous le règne de Dieu, au moyen de l’image de ce qui ne vacille pas.
  alternative: Traduire « il ne sera pas déplacé » ou « il ne sera pas ébranlé », formulations susceptibles d’être comprises comme une affirmation d’immobilité physique.
  rationale: Le langage poétique hébreu souligne la fermeté et la sécurité de l’ordre créé. « Il ne vacillera pas » préserve cette affirmation théologique sans trancher une question cosmologique étrangère au propos.
translation_notes:
  register: Français international moderne, poétique et digne. L’apostrophe directe « terre entière » garde la vigueur de l’impératif hébreu, tandis que « solidement établi » et « ne vacillera pas » rendent le parallélisme de la stabilité.
