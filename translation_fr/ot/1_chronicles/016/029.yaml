  text: הָב֥וּ לַ/יהוָ֖ה כְּב֣וֹד שְׁמ֑/וֹ שְׂא֤וּ מִנְחָה֙ וּ/בֹ֣אוּ לְ/פָנָ֔י/ו הִשְׁתַּחֲו֥וּ לַ/יהוָ֖ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/029.yaml
  text: Ascribe to Yahweh the glory due his name; bring an offering and come before him[a]. Bow down to Yahweh in holy splendor.
translation:
  language: fr
  text: Rendez à Yahweh la gloire qui revient à son nom ; apportez une offrande et venez devant lui. Prosternez-vous devant Yahweh dans la splendeur de la sainteté[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en saint apparat » ; peut-être : « dans une sainte splendeur ».'
    reason: 'Alternative lexicale : l’expression hébraïque peut désigner la splendeur associée à la sainteté ou une parure cultuelle.'
lexical_decisions:
- source_word: הָבוּ
  choice: Rendez
  rationale: Dans cette formule liturgique, le verbe appelle à reconnaître et à attribuer à Yahweh la gloire qui lui revient ; « rendez » conserve l’idée de donner ce qui est dû tout en restant naturel en français.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », conformément à sa fonction de nom divin dans le texte hébreu.
- source_word: כְּבוֹד שְׁמוֹ
  choice: la gloire qui revient à son nom
  rationale: Cette formulation exprime naturellement en français la gloire associée au nom de Yahweh et qui lui est due, sans réduire « nom » à une simple appellation.
- source_word: שְׂאוּ מִנְחָה
  choice: apportez une offrande
  rationale: Avec מִנְחָה, שְׂאוּ a le sens idiomatique d’apporter ou de présenter un don cultuel ; « offrande » n’en précise pas indûment la nature.
- source_word: וּבֹאוּ לְפָנָיו
  choice: et venez devant lui
  rationale: La traduction conserve l’image spatiale de l’approche de Dieu dans le cadre du culte, avec une expression claire et digne.
- source_word: הִשְׁתַּחֲווּ
  choice: Prosternez-vous
  rationale: Le verbe désigne concrètement le fait de s’incliner profondément ou de se prosterner en hommage ; ce choix préserve mieux le geste corporel que le terme plus général « adorez ».
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: dans une sainte splendeur
  rationale: Cette expression garde la densité poétique de l’hébreu et son association entre sainteté et magnificence, sans trancher définitivement entre splendeur abstraite et parure cultuelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme comme nom propre. « Yahweh » le représente sans le remplacer par un titre.
- issue: Sens de בְּהַדְרַת קֹדֶשׁ
  choice: dans une sainte splendeur
  alternative: dans la splendeur de la sainteté ; revêtus d’ornements sacrés
  rationale: La construction hébraïque peut évoquer la magnificence propre à la sainteté ou une parure sacrée portée par les adorateurs. Le texte principal conserve cette ambiguïté poétique et la note signale les principales lectures.
translation_notes:
  register: Français international moderne, solennel et accessible. Le parallélisme impératif et la dimension corporelle du culte sont conservés. Le point-virgule structure les trois appels successifs sans alourdir le verset.
