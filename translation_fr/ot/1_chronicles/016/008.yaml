source:
  edition: WLC
  text: הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָ/עַמִּ֖ים עֲלִילֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/008.yaml
  text: Give thanks to Yahweh[a]; call on his name[b]; make his deeds known among the peoples.
translation:
  language: fr
  text: Rendez grâce à Yahweh, invoquez son nom ; faites connaître ses actes[b] parmi les peuples[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les nations ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ses œuvres » ; le terme hébreu désigne ce qu’il a fait.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: Rendez grâce
  rationale: L’impératif pluriel du hifil de ידה exprime ici l’action de remercier ou de louer Dieu. « Rendez grâce » est l’expression française consacrée, naturelle et précise dans un contexte de célébration.
- source_word: לַֽיהוָה
  choice: à Yahweh
  rationale: Le tétragramme יהוה est rendu par le nom propre « Yahweh », conformément à sa fonction de nom d’alliance dans le texte hébreu.
- source_word: קִרְא֣וּ בִשְׁמוֹ
  choice: invoquez son nom
  rationale: Dans cette construction, קרא suivi de בְּשֵׁם désigne l’invocation adressée à Dieu. « Invoquez son nom » restitue naturellement l’expression hébraïque et conserve la portée de « nom » comme identité révélée.
- source_word: הוֹדִ֥יעוּ
  choice: faites connaître
  rationale: 'Le hifil impératif de ידע a une valeur causative : amener d’autres personnes à savoir. « Faites connaître » en préserve directement la force.'
- source_word: בָעַמִּים
  choice: parmi les peuples
  rationale: Le pluriel עַמִּים vise les divers peuples. « Peuples » conserve cette pluralité humaine et ethnique sans imposer la notion géopolitique moderne d’États-nations.
- source_word: עֲלִילֹתָיו
  choice: ses actes
  rationale: עֲלִילוֹת désigne ce que quelqu’un a fait, ses actions ou ses œuvres. « Ses actes » reste large et n’ajoute pas l’idée de puissance que comporterait « ses hauts faits ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le conserve comme nom plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international actuel, digne et adapté à la proclamation publique. Les trois impératifs pluriels sont conservés. La ponctuation fait ressortir le parallélisme sans alourdir la phrase.
