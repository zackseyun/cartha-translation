source:
  edition: WLC
  text: דִּרְשׁ֤וּ יְהוָה֙ וְ/עֻזּ֔/וֹ בַּקְּשׁ֥וּ פָנָ֖י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/011.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: fr
  text: Recherchez Yahweh et sa force ; recherchez sans cesse sa face[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa présence » (littéralement « sa face »).
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Recherchez
  rationale: L’impératif appelle à se tourner activement vers Dieu et à le rechercher, plutôt qu’à simplement demander des renseignements. « Recherchez » convient au ton exhortatif et soutenu du verset.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, plutôt que par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: וְעֻזּוֹ
  choice: et sa force
  rationale: עֹז désigne ici la force ou la puissance. « Sa force » est direct et garde ouverte la nuance selon laquelle la puissance recherchée appartient à Yahweh et se trouve auprès de lui.
- source_word: בַּקְּשׁוּ
  choice: recherchez
  rationale: בקש exprime une recherche intentionnelle et persévérante. Répéter « recherchez » préserve le parallélisme poétique sans imposer en français une distinction plus forte que celle qu’exige le contexte.
- source_word: פָנָיו
  choice: sa face
  rationale: Le sens littéral est « sa face ». L’expression concrète demeure intelligible et riche en français biblique moderne, tandis que le sens idiomatique « sa présence » est signalé en note.
- source_word: תָּמִיד
  choice: sans cesse
  rationale: תמיד exprime la continuité ou la constance. « Sans cesse » est naturel en français actuel et restitue clairement l’appel à une recherche persistante.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom divin au lieu de lui substituer un titre.
- issue: Sens de פָנָיו
  choice: sa face
  alternative: sa présence
  rationale: Le texte hébreu emploie l’image de la face, qui peut idiomatiquement désigner la présence personnelle de Dieu. Le texte principal préserve l’image et la note explicite l’autre rendu possible.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « recherchez » conserve le parallélisme des deux impératifs hébreux ; « sa face » maintient l’image concrète sans masquer son sens idiomatique.
