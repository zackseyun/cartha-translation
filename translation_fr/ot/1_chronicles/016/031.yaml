    issue: Neutralisation du pluriel dans « Que l’on dise »
    rationale: וְיֹאמְרוּ est à la troisième personne du pluriel. Même si l’antécédent précis demeure implicite, il peut renvoyer aux cieux et à la terre personnifiés. « On » introduit un sujet indéfini singulier et modifie cette relation poétique potentielle; « qu’ils disent » conserve le pluriel et l’ambiguïté.
  revised_text: 'Que les cieux se réjouissent, que la terre soit dans l’allégresse, et qu’ils disent[a] parmi les nations : « Yahweh règne ! »'
