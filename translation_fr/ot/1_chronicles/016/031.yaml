reference: 1 Chronicles 16:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִשְׂמְח֤וּ הַ/שָּׁמַ֨יִם֙ וְ/תָגֵ֣ל הָ/אָ֔רֶץ וְ/יֹאמְר֥וּ בַ/גּוֹיִ֖ם יְהוָ֥ה מָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/031.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; and let them say among the nations, “Yahweh reigns!”
translation:
  language: fr
  text: 'Que les cieux se réjouissent, que la terre soit dans l’allégresse, et qu’ils disent[a] parmi les nations : « Yahweh règne ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet pluriel n’est pas exprimé explicitement ; il peut renvoyer aux cieux et à la terre personnifiés.
    reason: ambiguïté grammaticale
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: Que … se réjouissent
  rationale: L’imparfait qal à valeur volitive ouvre ici une invitation poétique à la joie ; la tournure française en « que » en conserve naturellement la force.
- source_word: הַשָּׁמַיִם
  choice: les cieux
  rationale: Le pluriel poétique désigne ici le domaine céleste dans une proclamation de portée cosmique, et non seulement le ciel visible.
- source_word: וְתָגֵל
  choice: et que … soit dans l’allégresse
  rationale: Le verbe גיל exprime une joie vive, voire exultante. Cette formulation maintient le parallélisme sans répéter « se réjouir ».
- source_word: הָאָרֶץ
  choice: la terre
  rationale: En parallèle avec « les cieux », ארץ désigne l’ensemble de la terre plutôt qu’un territoire particulier.
- source_word: וְיֹאמְרוּ
  choice: Que l’on dise
  rationale: L’imparfait qal pluriel poursuit la séquence volitive. Le pronom indéfini « on » donne en français une proclamation publique naturelle, tandis qu’une note conserve l’information grammaticale du pluriel hébreu.
- source_word: בַגּוֹיִם
  choice: parmi les nations
  rationale: גוים désigne ici les peuples du monde ; « parmi les nations » exprime le cadre public et international de la proclamation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: מָלָךְ
  choice: règne
  rationale: Dans cette formule de proclamation royale, le parfait de מלך affirme la réalité présente de la royauté de Yahweh. « Règne » est idiomatique et n’impose pas l’idée qu’il vient seulement de devenir roi.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre révélé dans le texte, alors que « le SEIGNEUR » lui substituerait un titre.
- issue: Valeur temporelle de מָלָךְ
  choice: règne
  alternative: est devenu roi
  rationale: La formule peut être comprise comme une proclamation de la royauté effective de Yahweh sans affirmer nécessairement un commencement temporel de son règne ; la traduction conserve ainsi la tension du parfait hébreu sans importer une transition non exigée.
translation_notes:
  register: Style poétique, actuel et digne. Le parallélisme cosmique est conservé, avec une ponctuation française qui distingue l’appel à la joie de la proclamation royale.
