  text: אַֽל תִּגְּעוּ֙ בִּ/מְשִׁיחָ֔/י וּ/בִ/נְבִיאַ֖/י אַל תָּרֵֽעוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/022.yaml
  text: Do not touch my anointed ones[a], and do not harm my prophets.
translation:
  language: fr
  text: Ne touchez pas à mes oints[a], et ne faites pas de mal à mes prophètes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mes oints ». Le terme hébreu est apparenté au mot « Messie », mais il désigne ici, au pluriel, des personnes consacrées par Dieu, et non spécifiquement le Messie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: touchez
  rationale: נגע signifie couramment « toucher ». Dans cette interdiction, le verbe évoque un contact hostile sans préciser davantage la forme de l’agression.
- source_word: בִּמְשִׁיחָי
  choice: à ceux que j’ai consacrés par l’onction
  rationale: Le nom מָשִׁיחַ désigne une personne ointe. Le pluriel avec suffixe de première personne est rendu explicitement, tandis que cette formulation naturelle évite que « mes messies » soit compris comme une référence au Messie unique.
- source_word: וּבִנְבִיאַי
  choice: à mes prophètes
  rationale: נָבִיא signifie directement « prophète » ; la forme plurielle avec suffixe de première personne donne « mes prophètes ».
- source_word: תָּרֵעוּ
  choice: ne faites aucun mal
  rationale: La forme causative de רעע exprime ici le fait de faire du mal ou de nuire. Cette traduction conserve la portée générale de l’interdiction.
- source_word: אַל
  choice: Ne… pas
  rationale: אַל suivi de l’inaccompli marque une interdiction ; « ne… pas » en est l’équivalent français courant.
theological_decisions:
- issue: Sens de מְשִׁיחָי dans un contexte pluriel non spécifiquement messianique
  choice: ceux que j’ai consacrés par l’onction
  alternative: mes oints ; mes messies
  rationale: Le terme hébreu est apparenté au titre « Messie », mais son pluriel désigne ici plus largement des personnes consacrées par Dieu. La traduction ne lui impose donc pas une référence au Messie unique.
translation_notes:
  register: Français moderne, digne et accessible. « Consacrés par l’onction » explicite le sens du terme hébreu tout en conservant son arrière-plan cultuel ; le parallélisme des deux interdictions est maintenu.
