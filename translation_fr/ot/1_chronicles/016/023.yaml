  text: שִׁ֤ירוּ לַֽ/יהוָה֙ כָּל הָ/אָ֔רֶץ בַּשְּׂר֥וּ מִ/יּֽוֹם אֶל י֖וֹם יְשׁוּעָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/023.yaml
  text: Sing to Yahweh[a], all the earth[b]; proclaim his salvation from day to day.
translation:
  language: fr
  text: Chantez pour Yahweh[a], terre entière ! Jour après jour, annoncez la bonne nouvelle de son salut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, nom divin traditionnellement vocalisé « Yahweh » ; certaines traductions mettent « le SEIGNEUR ».'
    reason: divine_name
  - marker: b
    text: 'On peut aussi traduire : « proclamez son salut ». Le verbe hébreu exprime l’annonce d’une bonne nouvelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Chantez
  rationale: Impératif pluriel de שׁיר. « Chantez » restitue directement l’appel sans ajouter explicitement l’idée de louange.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici le destinataire ou celui en l’honneur de qui l’on chante. « Pour Yahweh » est naturel en français moderne et conserve le nom divin.
- source_word: כָּל הָאָרֶץ
  choice: terre entière
  rationale: Dans cette convocation hymnique, אֶרֶץ désigne le monde habité plutôt qu’un territoire particulier. La tournure vocative « terre entière » rend naturellement la portée universelle.
- source_word: בַּשְּׂרוּ
  choice: annoncez la bonne nouvelle
  rationale: Le piel de בשׂר signifie annoncer une nouvelle favorable. Cette formulation explicite la nuance positive du verbe, qu’un simple « proclamez » pourrait atténuer.
- source_word: מִיּוֹם אֶל יוֹם
  choice: jour après jour
  rationale: L’expression indique une proclamation quotidienne et répétée. « Jour après jour » est idiomatique et évite le possible sens progressif de « de jour en jour ».
- source_word: יְשׁוּעָתוֹ
  choice: son salut
  rationale: יְשׁוּעָה peut désigner le salut, la délivrance ou la victoire. « Son salut » garde ici l’expression large et théologiquement ouverte du texte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Sens de « son salut »
  choice: son salut
  alternative: la délivrance qu’il accorde
  rationale: Le possessif hébreu est conservé sans préciser de manière interprétative s’il désigne le salut qui vient de Dieu, son œuvre de délivrance ou sa victoire.
translation_notes:
  register: Style poétique, actuel et digne. L’apostrophe « terre entière » conserve l’élan universel du chant, tandis que l’antéposition « Jour après jour » met en relief la continuité de la proclamation.
