  text: זִכְר֤וּ לְ/עוֹלָם֙ בְּרִית֔/וֹ דָּבָ֥ר צִוָּ֖ה לְ/אֶ֥לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/015.yaml
  text: Remember his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: fr
  text: Souvenez-vous toujours de son alliance, de la parole[a] qu’il a prescrite pour mille générations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la promesse qu’il a prescrite pour mille générations ».
    reason: Alternative lexicale pour דָּבָר dans son contexte d’alliance.
lexical_decisions:
- source_word: זִכְרוּ
  choice: Souvenez-vous
  rationale: L’impératif qal masculin pluriel s’adresse à la communauté. « Souvenez-vous » rend directement l’exhortation en français courant et digne.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression marque ici la permanence; « pour toujours » est naturel en français et conserve la portée temporelle de l’hébreu.
- source_word: בְּרִיתוֹ
  choice: son alliance
  rationale: Dans ce contexte théologique, בְּרִית désigne l’engagement contraignant de Dieu; « alliance » est le terme français précis et usuel.
- source_word: דָּבָר
  choice: la parole
  rationale: דָּבָר peut signifier « parole », « chose » ou, par extension contextuelle, « promesse ». « La parole » conserve la largeur du terme hébreu sans expliciter à tort une seule nuance.
- source_word: צִוָּה
  choice: il a prescrite
  rationale: צוה exprime normalement l’action de commander ou de prescrire. Dans la construction française avec « parole », « prescrite » garde la force d’autorité du verbe tout en évitant la tournure peu naturelle « la parole qu’il a commandée ».
- source_word: לְאֶלֶף דּוֹר
  choice: pour mille générations
  rationale: La préposition לְ peut ici exprimer l’étendue dans la durée. « Pour mille générations » est idiomatique et ne tranche pas entre une valeur strictement numérique et une expression de très longue durée.
theological_decisions:
- issue: Faut-il rendre דָּבָר par « parole » ou par le terme contextuellement plus explicite « promesse » ?
  choice: la parole
  alternative: la promesse
  rationale: Le lexème hébreu est plus large que « promesse ». Le parallélisme avec « alliance » permet d’entendre cette nuance sans l’imposer; l’autre lecture est donc conservée en note.
translation_notes:
  register: Français international moderne, avec un ton exhortatif et digne. La répétition « de son alliance, de la parole » conserve l’apposition poétique de l’hébreu. Le marqueur de note est placé immédiatement après le mot concerné.
