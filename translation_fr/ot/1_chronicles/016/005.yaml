  text: אָסָ֥ף הָ/רֹ֖אשׁ וּ/מִשְׁנֵ֣/הוּ זְכַרְיָ֑ה יְעִיאֵ֡ל וּ/שְׁמִֽירָמ֡וֹת וִֽ/יחִיאֵ֡ל וּ/מַתִּתְיָ֡ה וֶ/אֱלִיאָ֡ב וּ/בְנָיָהוּ֩ וְ/עֹבֵ֨ד אֱדֹ֜ם וִֽ/יעִיאֵ֗ל בִּ/כְלֵ֤י נְבָלִים֙ וּ/בְ/כִנֹּר֔וֹת וְ/אָסָ֖ף בַּֽ/מְצִלְתַּ֥יִם מַשְׁמִֽיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/005.yaml
  text: Asaph was the chief[a], and second to him was Zechariah; then Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom, and Jeiel, with instruments of harps and lyres[b]; and Asaph sounded the cymbals.
translation:
  language: fr
  text: Asaph était le chef[a], et Zacharie occupait le second rang après lui. Puis venaient Yeïel, Shemiramoth, Yehiel, Mattitia, Eliab, Benaya, Obed-Édom et Yeïel, avec des harpes et des lyres[b]. Asaph faisait retentir les cymbales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Asaph était le premier, et Zacharie le second après lui. » Le terme hébreu exprime ici le rang principal.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu distingue deux instruments à cordes, le nèvel et le kinnor, traditionnellement rendus ici par « harpe » et « lyre ». Leur forme exacte demeure incertaine.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: le chef
  rationale: Dans cette liste de responsables du service musical, רֹאשׁ désigne le rang principal et non une partie du corps. « Le chef » est naturel et concis en français.
- source_word: וּמִשְׁנֵהוּ
  choice: occupait le second rang après lui
  rationale: Le nom avec suffixe indique que Zacharie venait en second par rapport à Asaph. Cette formulation explicite la relation hiérarchique sans transformer le terme en titre technique.
- source_word: יְעִיאֵל / וִיעִיאֵל
  choice: Yeïel
  rationale: Les deux graphies massorétiques du verset renvoient au même nom. Une translittération française cohérente est employée aux deux endroits.
- source_word: בִּכְלֵי נְבָלִים וּבְכִנֹּרוֹת
  choice: avec des harpes et des lyres
  rationale: Le texte distingue deux sortes d’instruments à cordes, נֵבֶל et כִּנּוֹר. Les équivalents traditionnels et compréhensibles « harpe » et « lyre » maintiennent cette distinction, tandis que le sens instrumental de כְּלֵי est rendu naturellement par la tournure française.
- source_word: בַּמְצִלְתַּיִם
  choice: les cymbales
  rationale: Le duel lexicalisé désigne une paire de cymbales, et l’article hébreu est naturellement rendu par l’article défini français.
- source_word: מַשְׁמִיעַ
  choice: faisait retentir
  rationale: Le participe hiphil de שמע exprime ici le fait de faire entendre ou résonner les cymbales. L’imparfait français convient à la description de la fonction habituelle d’Asaph.
