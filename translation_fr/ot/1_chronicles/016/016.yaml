  text: אֲשֶׁ֤ר כָּרַת֙ אֶת אַבְרָהָ֔ם וּ/שְׁבוּעָת֖/וֹ לְ/יִצְחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/016.yaml
  text: which he made with Abraham[a], and his oath to Isaac—
translation:
  language: fr
  text: qu’il a conclue avec Abraham[a], et son serment à Isaac —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’il a coupée avec Abraham » ; en hébreu, « couper une alliance » signifie conclure une alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: qu’il
  rationale: Le relatif reprend « l’alliance » du verset précédent; cette formulation évite la lourdeur de « laquelle » en français courant.
- source_word: כָּרַת
  choice: avait conclue
  rationale: Le verbe signifie littéralement « couper », mais, avec l’alliance sous-entendue comme antécédent, l’expression idiomatique française est « conclure une alliance ». Le plus-que-parfait assure un enchaînement naturel avec l’appel à se souvenir au verset précédent.
- source_word: אֶת אַבְרָהָם
  choice: avec Abraham
  rationale: Même si אֶת est ici le marqueur de l’objet, le français construit naturellement « conclure une alliance » avec « avec » pour désigner le partenaire de l’alliance.
- source_word: וּשְׁבוּעָתוֹ
  choice: et le serment qu’il avait fait
  rationale: Cette formulation conserve le sens de « son serment » tout en explicitant naturellement en français que Dieu en est l’auteur, sans ajouter de contenu.
- source_word: לְיִצְחָק
  choice: à Isaac
  rationale: La préposition ל désigne ici le destinataire du serment; « à Isaac » en rend directement le sens.
theological_decisions:
- issue: Expression hébraïque de la conclusion d’une alliance
  choice: qu’il avait conclue avec Abraham
  alternative: qu’il avait coupée avec Abraham
  rationale: Le sens conventionnel de l’expression כרת ברית est rendu par l’idiome français « conclure une alliance ». La note conserve l’image littérale sans introduire de lecture doctrinale particulière.
translation_notes:
  register: Français moderne, digne et accessible. Le verset étant syntaxiquement lié au précédent, le féminin de « conclue » reprend « l’alliance ». Le tiret final est conservé pour marquer la poursuite de la phrase au verset suivant.
