source:
  edition: WLC
  text: וַ/יֵּלְכ֥וּ כָל הָ/עָ֖ם אִ֣ישׁ לְ/בֵית֑/וֹ וַ/יִּסֹּ֥ב דָּוִ֖יד לְ/בָרֵ֥ךְ אֶת בֵּיתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/043.yaml
  text: Then all the people went[a], each man to his house, and David turned to bless his household.
translation:
  language: fr
  text: Puis tout le peuple s’en alla, chacun chez lui, et David se tourna pour bénir sa maison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa maisonnée » ou « sa famille ». Le mot hébreu peut désigner la demeure elle-même ou les personnes qui y sont rattachées.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: s’en alla
  rationale: Le wayyiqtol de הלך fait avancer le récit. Avec le sujet collectif « tout le peuple », le singulier français est naturel; la tournure pronominale exprime ici le départ sans emphase excessive.
- source_word: כָל הָעָם
  choice: tout le peuple
  rationale: עַם désigne ici l’ensemble du peuple réuni. « Tout le peuple » est direct, courant et fidèle au contexte narratif.
- source_word: אִישׁ לְבֵיתוֹ
  choice: chacun chez lui
  rationale: אִישׁ a une valeur distributive après « tout le peuple ». « Chacun chez lui » rend naturellement cette distribution et le retour de chacun à son domicile, sans imposer en français une formulation masculine lourde.
- source_word: וַיִּסֹּב
  choice: se tourna
  rationale: Le verbe סבב indique un changement de direction. « Se tourna » conserve ce sens fondamental, tandis que « retourna » préciserait davantage que l’hébreu.
- source_word: לְבָרֵךְ
  choice: pour bénir
  rationale: L’infinitif avec לְ exprime ici le but. « Pour bénir » garde la formulation théologique simple et directe de ברך.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: בַּיִת peut désigner aussi bien la demeure que les personnes qui la composent. « Sa maison » préserve en français cette polysémie biblique mieux que « sa famille », tandis qu’une note explicite l’ambiguïté.
theological_decisions:
- issue: Objet de la bénédiction de David
  choice: sa maison
  alternative: sa famille / les gens de sa maison
  rationale: L’hébreu בֵּיתוֹ demeure lexicalement ambigu entre la demeure, la maisonnée et la famille. Le texte principal conserve cette tension plutôt que de limiter explicitement la bénédiction aux seuls membres de la famille.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase suit le mouvement narratif de l’hébreu. « Chacun chez lui » est idiomatique et distributif; « sa maison » maintient l’ambiguïté du dernier בֵּיתוֹ, explicitée en note.
