source:
  edition: WLC
  text: ה֤וֹד וְ/הָדָר֙ לְ/פָנָ֔י/ו עֹ֥ז וְ/חֶדְוָ֖ה בִּ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/027.yaml
  text: Splendor and majesty are before him[a]; strength and joy are in his place.
translation:
  language: fr
  text: 'La splendeur et la majesté sont devant lui ;

    la force et la joie sont dans le lieu qui est le sien[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans sa demeure » ou « dans son sanctuaire ». L’hébreu dit littéralement « dans son lieu », expression plus large que celle du passage parallèle en Psaume 96.6.
    reason: 'Lecture alternative : préserver la formulation générale de l’hébreu tout en indiquant les sens plus précis suggérés par le contexte.'
lexical_decisions:
- source_word: הוֹד
  choice: splendeur
  rationale: Le nom évoque un éclat imposant ou une magnificence solennelle. « Splendeur » convient au parallélisme poétique sans se confondre avec הָדָר.
- source_word: הָדָר
  choice: majesté
  rationale: Dans ce couple poétique, le terme exprime la dignité et la grandeur majestueuse. « Majesté » complète naturellement « splendeur ».
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Cette traduction conserve l’image spatiale et relationnelle de l’hébreu, littéralement « devant sa face », tout en restant naturelle en français.
- source_word: עֹז
  choice: force
  rationale: Le mot désigne couramment la force ou la puissance. « Force » est ici direct, clair et bien équilibré avec « joie ».
- source_word: חֶדְוָה
  choice: joie
  rationale: Le terme signifie joie ou allégresse. « Joie » est simple, actuel et adapté au parallélisme du vers.
- source_word: בִּמְקֹמוֹ
  choice: dans le lieu qui est le sien
  rationale: L’hébreu dit largement « dans son lieu ». Cette formulation française en garde l’indétermination sans imposer le sens plus précis de « sanctuaire » et évite la tournure peu idiomatique « dans son lieu ».
theological_decisions:
- issue: Faut-il comprendre מְקוֹמוֹ comme une désignation précise du sanctuaire ou du Temple ?
  choice: 'Conserver le sens large : « le lieu qui est le sien »'
  alternative: « sa demeure » ou « son sanctuaire »
  rationale: Le contexte liturgique et le parallèle de Psaume 96.6 peuvent suggérer le sanctuaire, mais le texte des Chroniques emploie מְקוֹמוֹ, « son lieu ». La traduction ne l’harmonise donc pas avec le psaume et signale en note les interprétations contextuelles plus précises.
translation_notes:
  register: Registre poétique, digne et accessible. Le parallélisme nominal de l’hébreu est conservé, ainsi que son imagerie spatiale. La seconde ligne emploie une formulation légèrement développée afin de rendre מְקוֹמוֹ en français naturel sans en réduire la portée au sanctuaire.
