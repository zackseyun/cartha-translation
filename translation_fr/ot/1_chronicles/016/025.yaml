source:
  edition: WLC
  text: כִּי֩ גָד֨וֹל יְהוָ֤ה וּ/מְהֻלָּל֙ מְאֹ֔ד וְ/נוֹרָ֥א ה֖וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/025.yaml
  text: For Yahweh is great and greatly to be praised[a], and he is to be feared above all gods.
translation:
  language: fr
  text: Car Yahweh est grand et digne d’être grandement loué ; il est à craindre[a] plus que tous les dieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « redoutable ». Le mot hébreu désigne celui qui inspire la crainte et un profond respect.
    reason: alternative_lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel à la louange dans le contexte immédiat et conserve naturellement la valeur explicative de la conjonction.
- source_word: גָדוֹל
  choice: grand
  rationale: Rend directement la grandeur, la majesté et la prééminence de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: מְהֻלָּל מְאֹד
  choice: mérite d’être abondamment loué
  rationale: Le participe passif exprime que Yahweh doit recevoir la louange, tandis que מְאֹד l’intensifie. Cette formulation est claire et naturelle en français moderne.
- source_word: נוֹרָא
  choice: à craindre
  rationale: Conserve l’idée d’une crainte mêlée de profond respect suscitée par Dieu, sans affaiblir le terme en simple admiration ni le réduire à la terreur.
- source_word: עַל כָּל אֱלֹהִים
  choice: plus que tous les dieux
  rationale: Dans ce contexte, עַל marque la supériorité comparative de Yahweh, et אֱלֹהִים désigne les dieux des peuples.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom personnel divin ; sa transcription le distingue d’un simple titre.
- issue: Portée de נוֹרָא appliqué à Dieu
  choice: il est à craindre
  alternative: il est redoutable
  rationale: « À craindre » maintient explicitement la dimension de crainte révérencielle. « Redoutable » est possible, mais peut surtout évoquer la menace ou la puissance.
- issue: Référence aux אֱלֹהִים au pluriel
  choice: tous les dieux
  alternative: tous les êtres divins
  rationale: « Dieux » est le sens lexical simple dans le contraste polémique du contexte, sans trancher ici la question de leur statut ontologique.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « mérite d’être abondamment loué » évite l’expression peu naturelle « grandement loué » tout en conservant l’intensification de l’hébreu. Le point-virgule reflète le parallélisme du verset.
