  text: הוֹד֤וּ לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/034.yaml
  text: Give thanks to Yahweh[a], for he is good[b]; for his steadfast love endures forever.
translation:
  language: fr
  text: Rendez grâce à Yahweh[a], car il est bon, car son amour fidèle[b] dure pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, nom divin traditionnellement transcrit « Yahweh ».'
    reason: divine_name
  - marker: b
    text: Ou « sa fidélité à l’alliance ». Le mot hébreu désigne un amour loyal, constant et fidèle.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: Rendez grâce
  rationale: L’impératif pluriel de ידה au hifil exprime ici l’action de remercier et de louer. « Rendez grâce » restitue naturellement la formule liturgique sans la réduire à la seule louange.
- source_word: לַ/יהוָה֙
  choice: à Yahweh
  rationale: Le texte porte directement le nom divin יהוה. « Yahweh » le rend comme un nom propre et préserve sa référence d’alliance.
- source_word: כִּ֣י … כִּ֥י
  choice: car … car
  rationale: Les deux occurrences introduisent les motifs de l’appel à rendre grâce. Leur répétition conserve le parallélisme et la cadence de l’hébreu.
- source_word: ט֔וֹב
  choice: bon
  rationale: Le terme affirme simplement la bonté de Dieu, notamment dans ses bienfaits. « Bon » en garde toute l’étendue sans explicitation excessive.
- source_word: חַסְדּֽ/וֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, loyauté et constance, souvent dans un cadre relationnel ou d’alliance. « Amour fidèle » maintient ces dimensions sans limiter le sens à la compassion ou à une notion technique d’alliance.
- source_word: לְ/עוֹלָ֖ם חַסְדּֽ/וֹ
  choice: son amour fidèle dure pour toujours
  rationale: La proposition hébraïque est sans verbe exprimé. Le français demande ici un prédicat; « dure » rend la permanence impliquée, tandis que « pour toujours » restitue לְעוֹלָם.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Puisque le texte emploie le Tétragramme comme nom propre, « Yahweh » en préserve la fonction et évite de le remplacer silencieusement par un titre.
- issue: Portée théologique de חֶסֶד
  choice: amour fidèle
  alternative: fidélité à l’alliance / bonté / miséricorde
  rationale: « Amour fidèle » conserve ensemble l’affection bienveillante et la loyauté durable. « Fidélité à l’alliance » expliciterait davantage le contexte possible, mais rétrécirait une expression hébraïque plus riche.
translation_notes:
  register: Français international moderne, sobre et liturgique. La répétition de « car » reprend le rythme de la formule hébraïque; « rend grâce » demeure courant dans un registre religieux digne sans être archaïque.
