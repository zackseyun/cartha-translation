  text: הָב֤וּ לַֽ/יהוָה֙ מִשְׁפְּח֣וֹת עַמִּ֔ים הָב֥וּ לַ/יהוָ֖ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/028.yaml
  text: Ascribe to Yahweh[a], families of the peoples, ascribe to Yahweh glory and strength.
translation:
  language: fr
  text: 'Rendez à Yahweh, familles des peuples,

    rendez à Yahweh gloire et puissance.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבוּ
  choice: Rendez
  rationale: L’impératif pluriel signifie ici reconnaître et attribuer à Yahweh ce qui lui revient. « Rendez » exprime naturellement cette idée en français dans un contexte liturgique.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל indique le destinataire, et le nom divin יהוה est translittéré « Yahweh » afin de conserver le nom propre présent dans l’hébreu.
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: familles des peuples
  rationale: « Familles » conserve la notion de groupes de parenté portée par מִשְׁפְּחוֹת, tandis que « des peuples » maintient le pluriel et la portée universelle de עַמִּים.
- source_word: כָּבוֹד
  choice: gloire
  rationale: Dans cet appel à la louange, כָּבוֹד désigne la gloire ou l’honneur reconnus comme appartenant à Dieu; « gloire » est ici le terme français le plus juste.
- source_word: וָעֹז
  choice: et puissance
  rationale: עֹז désigne la force ou la puissance. « Puissance » forme en français une expression liturgique naturelle avec « gloire » et désigne clairement un attribut reconnu à Yahweh.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre יהוה. « Yahweh » en conserve la fonction de nom divin sans le remplacer par un titre.
translation_notes:
  register: Style poétique, liturgique et digne, avec répétition de l’impératif conservée. Le parallélisme hébreu est rendu sur deux lignes. « Familles des peuples » reste volontairement proche de la formulation source tout en étant intelligible en français moderne.
