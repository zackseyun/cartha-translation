  naturalness: '« Rendre grâce Yahweh » n’est pas idiomatique en français moderne : rendre grâce se construit normalement avec « à ». La coordination révisée est naturelle, claire et conserve un registre digne.'
  terminology: « Yahweh », « Lévites », « arche », « faire mémoire », « rendre grâce » et « louer » sont appropriés. « Faire mémoire » préserve utilement l’ouverture liturgique du hiphil de זכר.
