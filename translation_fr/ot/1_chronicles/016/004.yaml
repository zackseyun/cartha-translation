  text: וַ/יִּתֵּ֞ן לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה מִן הַ/לְוִיִּ֖ם מְשָׁרְתִ֑ים וּ/לְ/הַזְכִּיר֙ וּ/לְ/הוֹד֣וֹת וּ/לְ/הַלֵּ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/004.yaml
  text: He appointed some of the Levites to minister before the ark of Yahweh[a], to commemorate, to give thanks, and to praise Yahweh, the God of Israel.
translation:
  language: fr
  text: Il désigna certains Lévites pour servir devant l’arche de Yahweh, pour faire mémoire, rendre grâce à Yahweh et le louer, lui, le Dieu d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rappeler » ou « mentionner ». Le verbe hébreu peut désigner une action liturgique qui évoque ou entretient le souvenir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Il désigna
  rationale: Dans ce contexte d’attribution d’une fonction, le sens idiomatique de נתן est « désigner » ou « établir », plutôt que simplement « donner ».
- source_word: מִן הַלְוִיִּם
  choice: certains Lévites
  rationale: 'La préposition מִן a ici un sens partitif : David choisit des membres du groupe des Lévites.'
- source_word: מְשָׁרְתִים
  choice: pour servir
  rationale: Le participe désigne un service cultuel. « Servir » reste clair et digne sans introduire un titre ecclésiastique étranger au texte.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: devant l’arche de Yahweh
  rationale: « Devant » conserve la relation spatiale et cultuelle exprimée par לִפְנֵי, tandis que le rapport construit est rendu directement.
- source_word: וּלְהַזְכִּיר
  choice: pour faire mémoire
  rationale: Le hiphil de זכר peut exprimer une action liturgique consistant à rappeler, mentionner ou entretenir le souvenir. « Faire mémoire » préserve cette nuance sans fournir un complément absent de l’hébreu.
- source_word: וּלְהוֹדוֹת
  choice: rendre grâce
  rationale: Dans ce cadre de culte, ידה désigne l’action de remercier Dieu; « rendre grâce » est une formulation française naturelle et soutenue.
- source_word: וּלְהַלֵּל
  choice: louer
  rationale: Le piel de הלל signifie couramment « louer ». Le texte ne précise pas explicitement qu’il s’agit de chanter.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette formulation rend directement la construction hébraïque et conserve clairement le titre relationnel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom divin יהוה. La translittération « Yahweh » le distingue d’un titre et préserve son caractère de nom propre.
- issue: Objet implicite de וּלְהַזְכִּיר
  choice: Ne pas préciser ce dont il faut faire mémoire
  alternative: faire mémoire des œuvres de Yahweh; rappeler Yahweh
  rationale: L’hébreu ne fournit aucun complément. Le garder implicite préserve l’ouverture du texte entre commémoration, proclamation et mention liturgique.
translation_notes:
  register: Français international moderne, clair et digne. La série « faire mémoire, rendre grâce et louer » conserve le parallélisme des trois infinitifs hébreux. « Servir » évite le terme plus institutionnel « officier ».
