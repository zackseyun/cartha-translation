  text: בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִן הָ/עוֹלָ֖ם וְ/עַ֣ד הָ/עֹלָ֑ם וַ/יֹּאמְר֤וּ כָל הָ/עָם֙ אָמֵ֔ן וְ/הַלֵּ֖ל לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/036.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Then all the people said[b], “Amen!” and praised Yahweh.
translation:
  language: fr
  text: 'Béni soit Yahweh, le Dieu d’Israël,

    depuis toujours et pour toujours[a] !


    Alors tout le peuple a dit : « Amen ! » et a loué Yahweh[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’éternité en éternité » ou « d’âge en âge ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est très concis. La dernière expression peut aussi être comprise comme une acclamation : « Amen ! Louez Yahweh ! »'
    reason: textual_ambiguity
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Cette formule française naturelle et solennelle rend le participe passif employé dans une bénédiction liturgique, avec sa nuance doxologique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette formulation rend directement la chaîne construite et constitue une apposition naturelle en français.
- source_word: מִן הָעוֹלָם וְעַד הָעֹלָם
  choice: depuis toujours et pour toujours
  rationale: Cette expression actuelle et digne communique l’étendue temporelle sans limites de la formule hébraïque, tout en restant aisément compréhensible.
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: Tout le peuple a répondu
  rationale: Le verbe signifie littéralement « a dit », mais « a répondu » explicite naturellement la fonction de la parole collective dans ce contexte liturgique sans modifier son contenu.
- source_word: אָמֵן
  choice: Amen !
  rationale: La translittération consacrée préserve la réponse liturgique collective et sa force d’assentiment.
- source_word: וְהַלֵּל לַיהוָה
  choice: et a loué Yahweh
  rationale: Cette lecture comprend la formule compacte comme la suite narrative de la réponse du peuple. Une note conserve l’autre analyse possible, selon laquelle les mots appartiennent à la citation et constituent un appel à louer Yahweh.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. Employer « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Portée temporelle de עוֹלָם dans la doxologie
  choice: depuis toujours et pour toujours
  alternative: d’éternité en éternité
  rationale: Le choix exprime une durée sans bornes dans une langue française actuelle, sans imposer au terme hébreu une définition philosophique plus précise que le contexte.
- issue: Analyse de וְהַלֵּל לַיהוָה
  choice: 'suite narrative : le peuple a loué Yahweh'
  alternative: 'parole citée : « Amen ! Louez Yahweh ! »'
  rationale: La syntaxe hébraïque est très compacte et permet de comprendre la louange soit comme l’action rapportée du peuple, soit comme une exhortation intégrée à sa réponse. Le texte principal privilégie une lecture narrative fluide, tandis que la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et adapté à une proclamation liturgique. La mise en vers souligne le caractère doxologique sans ajouter de contenu. « A répondu » est plus idiomatique que « a dit » dans cette scène collective; les deux exclamations conservent la vigueur de la bénédiction et de l’acclamation.
