lexical_decisions:
- source_word: וְ/עֹבֵד אֱדֹם
  choice: Obed-Édom
  rationale: Le nom propre est translittéré selon une forme française courante ; dans cette énumération, la conjonction initiale n’a pas besoin d’être exprimée par « et » en tête de phrase.
- source_word: וַ/אֲחֵי/הֶם
  choice: et leurs frères
  rationale: Le suffixe hébreu de troisième personne du pluriel est conservé, malgré son antécédent peu explicite dans cette liste.
- source_word: שִׁשִּׁים וּ/שְׁמוֹנָה
  choice: au nombre de soixante-huit
  rationale: Cette formulation française naturelle indique clairement l’effectif du groupe.
- source_word: בֶּן יְדִיתוּן
  choice: fils de Yedoutoun
  rationale: La désignation filiale est maintenue, et le nom est translittéré directement de l’hébreu.
- source_word: וְ/חֹסָה
  choice: et Hosa
  rationale: La conjonction associe Hosa à Obed-Édom dans la fonction indiquée ensuite.
- source_word: לְ/שֹׁעֲרִים
  choice: étaient portiers
  rationale: La préposition לְ exprime ici la fonction ou l’affectation ; le verbe « étaient » est ajouté pour former une proposition française naturelle.
