  text: And Obed-edom and their brothers[a], sixty-eight; and Obed-edom son of Jeduthun and Hosah were gatekeepers.
translation:
  language: fr
  text: Et Obed-Édom et leurs frères[a], au nombre de soixante-huit ; Obed-Édom, fils de Jeduthun, et Hosa étaient gardiens des portes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leurs frères ». Certaines traductions mettent « ses frères » pour préciser le rapport avec Obed-Édom, mais le texte hébreu reçu porte un suffixe pluriel.'
