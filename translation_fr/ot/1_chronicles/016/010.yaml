source:
  edition: WLC
  text: הִֽתְהַֽלְלוּ֙ בְּ/שֵׁ֣ם קָדְשׁ֔/וֹ יִשְׂמַ֕ח לֵ֖ב מְבַקְשֵׁ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/010.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: fr
  text: Glorifiez-vous de son saint nom ! Que le cœur de ceux qui recherchent Yahvé[a] se réjouisse !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom divin, traditionnellement rendu par « le Seigneur »; autre transcription possible : « Yahweh ».'
    reason: Signaler le tétragramme et les principales conventions de traduction ou de transcription.
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: Glorifiez-vous
  rationale: L’impératif hitpael de הלל exprime ici le fait de tirer fierté, de se réjouir avec exaltation ou de se glorifier de quelqu’un. « Glorifiez-vous » conserve la construction avec « de », le ton poétique et la force de l’exhortation, sans suggérer que les fidèles se glorifient eux-mêmes.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: de son saint nom
  rationale: La préposition בְּ marque ici ce en quoi les fidèles mettent leur fierté. « De son saint nom » est une tournure française naturelle et fidèle; « saint » rend directement קָדְשׁוֹ.
- source_word: יִשְׂמַח
  choice: Que ... se réjouisse
  rationale: L’imparfait hébreu a ici une valeur volitive ou jussive dans la suite de l’exhortation. La construction française avec « que » en restitue naturellement la force.
- source_word: לֵב
  choice: le cœur
  rationale: Le singulier collectif hébreu désigne l’être intérieur des personnes concernées. Le français peut conserver ce singulier dans « le cœur de ceux qui… » sans obscurcir le sens collectif.
- source_word: מְבַקְשֵׁי
  choice: ceux qui recherchent
  rationale: Le participe substantivé décrit des personnes caractérisées par une recherche continue de Dieu. « Ceux qui recherchent » exprime clairement cette orientation durable.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme YHWH; elle préserve ici un nom personnel plutôt que de le remplacer par le titre « le Seigneur ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme. La forme « Yahvé », accompagnée d’une note, préserve cette donnée du texte tout en signalant la tradition française qui emploie « le Seigneur ».
- issue: Objet de la glorification
  choice: Glorifiez-vous de son saint nom
  alternative: Soyez fiers de son saint nom
  rationale: Le choix retenu maintient la tension biblique entre la condamnation de l’orgueil centré sur soi et l’exhortation à mettre toute sa fierté dans le nom de Dieu. Il évite de réduire l’expression à un simple sentiment de fierté.
translation_notes:
  register: Français international moderne, poétique et digne. Les deux exclamations rendent le mouvement exhortatif du verset. Le singulier collectif « le cœur » est conservé, tandis que « ceux qui recherchent » reste immédiatement compréhensible.
