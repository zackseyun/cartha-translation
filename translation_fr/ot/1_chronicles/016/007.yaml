  text: בַּ/יּ֣וֹם הַ/ה֗וּא אָ֣ז נָתַ֤ן דָּוִיד֙ בָּ/רֹ֔אשׁ לְ/הֹד֖וֹת לַ/יהוָ֑ה בְּ/יַד אָסָ֖ף וְ/אֶחָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/007.yaml
  text: On that day then David first appointed Asaph and his brothers to give thanks to Yahweh[a].
translation:
  language: fr
  text: Ce jour-là, David confia alors pour la première fois à Asaph et à ses frères la charge de rendre grâce à Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « David établit Asaph et ses frères à la tête pour rendre grâce à Yahweh », ou « David confia d’abord à Asaph et à ses frères la charge de rendre grâce à Yahweh ». L’expression hébraïque peut souligner le commencement, la priorité ou une fonction de direction.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Cette expression temporelle rend naturellement en français la préposition ב et le démonstratif hébreu.
- source_word: אָז
  choice: alors
  rationale: L’adverbe marque la succession dans le récit et reste distinct de l’expression « ce jour-là ».
- source_word: נָתַן
  choice: chargea
  rationale: Pris avec l’infinitif לְהֹדוֹת et l’expression בְּיַד, le verbe « donner » exprime ici l’attribution d’une responsabilité; « chargea » restitue cet emploi idiomatique.
- source_word: בָּרֹאשׁ
  choice: pour la première fois
  rationale: Dans ce contexte, l’expression peut signaler l’instauration initiale de cette fonction liturgique. Comme elle peut aussi évoquer la priorité ou la direction, son ambiguïté est signalée en note.
- source_word: לְהֹדוֹת
  choice: rendre grâce
  rationale: Le hiphil de ידה désigne ici l’action liturgique de remercier et de louer Dieu; « rendre grâce » convient au registre cultuel tout en restant courant.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La traduction conserve le nom divin personnel יהוה sous la forme « Yahweh ».
- source_word: בְּיַד אָסָף וְאֶחָיו
  choice: Asaph et ses frères
  rationale: Littéralement « par la main d’Asaph et de ses frères », cette tournure indique ici les personnes auxquelles la responsabilité est confiée. La syntaxe française l’intègre comme complément direct de « chargea ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le Tétragramme; « Yahweh » préserve le caractère personnel du nom divin sans le remplacer par un titre.
- issue: Nature de la charge confiée à Asaph et à ses frères
  choice: une responsabilité liturgique de rendre grâce
  alternative: la remise d’un chant ou psaume à exécuter
  rationale: Le texte hébreu n’énonce pas explicitement l’objet qui aurait été « donné ». La traduction principale suit la lecture administrative suggérée par le contexte sans ajouter « psaume » ou « chant ».
translation_notes:
  register: Français international moderne, digne et accessible. « Chargea … de » rend l’idiome administratif sans lourdeur; la légère insistance de « ce jour-là … alors » conserve les deux marqueurs temporels du texte hébreu.
