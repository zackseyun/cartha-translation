  text: ה֚וּא יְהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָל הָ/אָ֖רֶץ מִשְׁפָּטָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/014.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: fr
  text: Lui, Yahweh[b], est notre Dieu ; ses jugements s’étendent sur toute la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans tout le pays », si אֶרֶץ est compris dans un sens plus localisé. Ici, « terre » est retenu en raison de la portée universelle du contexte.'
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte le nom divin YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: הוּא
  choice: C’est lui
  rationale: Le pronom indépendant est emphatique dans cette proposition sans verbe. « C’est lui » restitue naturellement cette mise en relief en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin YHWH est translittéré afin de conserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים désigne ici sans ambiguïté le Dieu unique d’Israël ; le suffixe de première personne du pluriel donne « notre Dieu ».
- source_word: בְּכָל הָאָרֶץ
  choice: sur toute la terre
  rationale: Avec מִשְׁפָּטָיו, la tournure française « s’étendent sur toute la terre » exprime naturellement la portée universelle de בְּכָל, tout en conservant en note la possibilité du sens localisé « pays » pour אֶרֶץ.
- source_word: מִשְׁפָּטָיו
  choice: ses jugements
  rationale: '« Jugements » conserve la gamme sémantique de מִשְׁפָּט : décisions judiciaires, actes de jugement et exercice de la justice, sans réduire le terme à des ordonnances particulières.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le Tétragramme. « Yahweh » préserve le caractère de nom propre sans remplacer celui-ci par un titre.
- issue: Portée de הָאָרֶץ
  choice: toute la terre
  alternative: tout le pays
  rationale: Le contexte hymnique favorise une portée universelle, mais le terme hébreu peut aussi désigner un territoire ; cette ambiguïté lexicale est signalée en note.
- issue: Valeur de מִשְׁפָּטָיו
  choice: ses jugements
  alternative: sa justice ; ses décisions
  rationale: Le pluriel concret « jugements » laisse ouvertes les dimensions judiciaire, gouvernementale et active du terme hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre « C’est lui, Yahweh, notre Dieu » préserve l’emphase initiale de l’hébreu. Le verbe « s’étendent » est explicité pour produire une phrase française naturelle sans résoudre davantage la nature des « jugements ».
