source:
  edition: WLC
  text: סַפְּר֤וּ בַ/גּוֹיִם֙ אֶת כְּבוֹד֔/וֹ בְּ/כָל הָ/עַמִּ֖ים נִפְלְאֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/024.yaml
  text: Declare his glory among the nations, his wondrous deeds among all the peoples.
translation:
  language: fr
  text: Annoncez sa gloire parmi les nations, ses œuvres merveilleuses parmi tous les peuples.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַפְּרוּ
  choice: Annoncez
  rationale: L’impératif pluriel de ספר appelle ici à faire connaître publiquement. « Annoncez » exprime naturellement cette proclamation, sans le ton plus simplement narratif de « racontez ».
- source_word: בַגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici les nations au sens large. « Parmi » rend la préposition ב et convient à l’appel à proclamer au milieu d’elles.
- source_word: כְּבוֹדוֹ
  choice: sa gloire
  rationale: כָּבוֹד évoque l’honneur, la majesté et la splendeur manifestée de Dieu. « Gloire » est ici le terme français le plus juste et le plus naturel.
- source_word: בְּכָל־הָעַמִּים
  choice: parmi tous les peuples
  rationale: « Peuples » rend עַמִּים tout en préservant la variation poétique avec גּוֹיִם, traduit auparavant par « nations ».
- source_word: נִפְלְאֹתָיו
  choice: ses œuvres merveilleuses
  rationale: Le terme issu de פלא désigne des actes extraordinaires qui suscitent l’émerveillement. « Œuvres merveilleuses » garde à la fois l’idée d’actes accomplis et leur caractère admirable.
theological_decisions:
- issue: Référent des suffixes pronominaux (« sa », « ses »)
  choice: Les pronoms renvoient au Dieu d’Israël, dont la gloire et les œuvres doivent être annoncées universellement.
  alternative: Répéter explicitement « du Seigneur » dans le verset.
  rationale: Le contexte immédiat identifie clairement le référent. Conserver les pronoms respecte la formulation hébraïque sans ajouter d’explication doctrinale au texte.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve le parallélisme poétique entre « nations » et « peuples », ainsi que l’impératif adressé à une pluralité de personnes.
