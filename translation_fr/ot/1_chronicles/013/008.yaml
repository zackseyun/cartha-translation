  text: וְ/דָוִ֣יד וְ/כָל יִשְׂרָאֵ֗ל מְשַׂחֲקִ֛ים לִ/פְנֵ֥י הָ/אֱלֹהִ֖ים בְּ/כָל עֹ֑ז וּ/בְ/שִׁירִ֤ים וּ/בְ/כִנֹּרוֹת֙ וּ/בִ/נְבָלִ֣ים וּ/בְ/תֻפִּ֔ים וּ/בִ/מְצִלְתַּ֖יִם וּ/בַ/חֲצֹצְרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/008.yaml
  text: And David and all Israel were celebrating before God with all their might[a], with songs, lyres, harps, tambourines, cymbals, and trumpets.
translation:
  language: fr
  text: David et tout Israël célébraient[a] devant Dieu de toutes leurs forces, avec des chants, des lyres, des harpes, des tambourins, des cymbales et des trompettes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jouaient » ou « se réjouissaient » ; le verbe hébreu peut désigner une activité joyeuse et festive.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: célébraient
  rationale: Le participe de שׂחק peut désigner une activité joyeuse, ludique ou festive. Dans cette procession accompagnée de chants et d’instruments, « célébraient » exprime naturellement la réjouissance publique sans la réduire au jeu instrumental.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: devant Dieu
  rationale: Cette formulation concise conserve l’idée d’une activité accomplie en présence de Dieu, dans un cadre cultuel.
- source_word: בְּכָל עֹז
  choice: de toutes leurs forces
  rationale: עֹז évoque ici la force et la vigueur. L’expression française idiomatique rend l’intensité de l’action du sujet collectif.
- source_word: שִׁירִים
  choice: chants
  rationale: Le nom pluriel désigne naturellement des chants et ne doit pas être transformé en simple action de chanter.
- source_word: כִנֹּרוֹת
  choice: lyres
  rationale: Le כִּנּוֹר était vraisemblablement un instrument à cordes de type lyre; ce terme est plus précis que « harpes ».
- source_word: נְבָלִים
  choice: harpes
  rationale: Le נֵבֶל est un autre instrument à cordes, distinct du כִּנּוֹר. Son identification exacte restant incertaine, « harpes » est un équivalent moderne clair qui maintient cette distinction.
- source_word: תֻפִּים
  choice: tambourins
  rationale: Le תֹּף était un tambour sur cadre ou un instrument semblable au tambourin; « tambourins » est accessible et convient au contexte festif.
- source_word: מְצִלְתַּיִם
  choice: cymbales
  rationale: Équivalent français courant et bien établi pour cet instrument de percussion.
- source_word: חֲצֹצְרוֹת
  choice: trompettes
  rationale: Le terme désigne des trompettes cérémonielles. Le matériau n’étant pas précisé dans ce verset, il n’est pas ajouté.
- source_word: וְדָוִיד וְכָל יִשְׂרָאֵל
  choice: David et tout Israël
  rationale: « Tout Israël » rend naturellement le collectif national. La conjonction hébraïque initiale sert à enchaîner le récit, mais son omission en tête d’un verset isolé donne une phrase française plus naturelle sans perte de sens.
theological_decisions:
- issue: Traduction de הָאֱלֹהִים
  choice: Dieu
  alternative: le Dieu
  rationale: Malgré l’article hébreu, l’expression désigne ici de manière habituelle le Dieu d’Israël. « Dieu » est la formulation française naturelle et ne modifie pas le référent.
translation_notes:
  register: Français international moderne, digne et fluide. L’énumération conserve les catégories du texte hébreu et distingue les deux instruments à cordes. Le marqueur de note est placé immédiatement après le verbe concerné afin d’éviter de l’associer à l’expression « de toutes leurs forces ».
