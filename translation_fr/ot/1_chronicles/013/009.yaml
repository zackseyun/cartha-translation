  text: וַ/יָּבֹ֖אוּ עַד גֹּ֣רֶן כִּידֹ֑ן וַ/יִּשְׁלַ֨ח עֻזָּ֜א אֶת יָד֗/וֹ לֶ/אֱחֹז֙ אֶת הָ֣/אָר֔וֹן כִּ֥י שָֽׁמְט֖וּ הַ/בָּקָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/009.yaml
  text: When they came to the threshing floor of Kidon[a], Uzza reached out his hand to take hold of the ark, because the oxen stumbled.
translation:
  language: fr
  text: Lorsqu’ils arrivèrent à l’aire de battage de Kidôn, Ouzza tendit la main pour saisir l’arche, car les bœufs avaient trébuché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avaient glissé ». Le verbe hébreu peut exprimer l’idée de glisser ou de laisser tomber ; ici, il décrit le mouvement déstabilisateur des bœufs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן כִּידֹן
  choice: l’aire de battage de Kidôn
  rationale: גֹּרֶן désigne une aire de battage, et כִּידֹן est conservé comme nom propre sous la forme française translittérée « Kidôn ».
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: tendit la main
  rationale: L’expression formée avec שׁלח et « main » décrit le geste d’étendre la main. « Tendit la main » est naturel et précis en français moderne.
- source_word: לֶאֱחֹז
  choice: pour saisir
  rationale: אחז signifie prendre ou tenir fermement. « Saisir » rend ici le geste destiné à retenir ou stabiliser l’arche, sans lui donner une connotation hostile.
- source_word: הָאָרוֹן
  choice: l’arche
  rationale: Le texte hébreu porte simplement « l’arche » ; aucun complément tel que « de Dieu » n’est ajouté.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison du geste d’Ouzza. « Car » maintient clairement ce lien causal dans une narration française digne et fluide.
- source_word: שָׁמְטוּ
  choice: avaient trébuché
  rationale: Le verbe peut évoquer un glissement ou le fait de laisser tomber. Avec les bœufs comme sujet, « avaient trébuché » exprime naturellement le mouvement déstabilisateur, tandis qu’une note conserve l’incertitude lexicale.
- source_word: הַבָּקָר
  choice: les bœufs
  rationale: בָּקָר peut désigner les bovins en général, mais le contexte du transport renvoie aux animaux de trait ; « les bœufs » est donc précis.
