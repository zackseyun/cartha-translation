source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔א וַ/יַּכֵּ֕/הוּ עַ֛ל אֲשֶׁר שָׁלַ֥ח יָד֖/וֹ עַל הָ/אָר֑וֹן וַ/יָּ֥מָת שָׁ֖ם לִ/פְנֵ֥י אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/010.yaml
  text: Then Yahweh’s anger burned against Uzza[a], and he struck him down because he had put out his hand to the ark; and he died there before God.
translation:
  language: fr
  text: Alors la colère de Yahweh s’enflamma contre Ouzza, et il le frappa parce que celui-ci avait tendu la main vers l’arche ; Ouzza mourut là, devant Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: Alors la colère de Yahweh s’enflamma
  rationale: L’expression idiomatique hébraïque décrit littéralement la colère qui brûle. « S’enflamma » en conserve la force tout en restant naturel en français moderne.
- source_word: בְּעֻזָּא
  choice: contre Ouzza
  rationale: Avec l’expression חרה אף, la préposition בְּ désigne ici la personne contre laquelle la colère est dirigée.
- source_word: וַיַּכֵּהוּ
  choice: il le frappa
  rationale: Le verbe נכה signifie « frapper » et peut, selon le contexte, désigner un coup mortel. La proposition suivante énonce explicitement la mort d’Ouzza, ce qui permet de conserver ici la formulation sobre de l’hébreu sans répétition interprétative.
- source_word: עַל אֲשֶׁר
  choice: parce que
  rationale: Cette tournure introduit la raison du jugement ; « parce que » est direct et idiomatique.
- source_word: שָׁלַח יָדוֹ עַל הָאָרוֹן
  choice: il avait tendu la main vers l’arche
  rationale: La formulation rend le geste physique exprimé par שׁלח יד sans lui attribuer une intention hostile. Le plus-que-parfait explicite naturellement en français l’antériorité du geste par rapport au coup.
- source_word: הָאָרוֹן
  choice: l’arche
  rationale: Le texte porte simplement « l’arche » ; le contexte en précise déjà l’identité.
- source_word: וַיָּמָת שָׁם
  choice: il mourut là
  rationale: Traduction directe de la succession narrative, conservant l’adverbe שָׁם, « là ».
- source_word: לִפְנֵי אֱלֹהִים
  choice: devant Dieu
  rationale: לִפְנֵי signifie couramment « devant » ou « en présence de ». « Devant Dieu » est concis, solennel et fidèle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Variation entre יְהוָה et אֱלֹהִים dans le même verset
  choice: « Yahweh » puis « Dieu »
  alternative: Harmoniser les deux désignations
  rationale: La variation lexicale du texte hébreu est maintenue plutôt que nivelée.
- issue: Nature exacte du geste d’Ouzza
  choice: Ne pas préciser son intention
  alternative: Présenter le geste comme une attaque ou comme une tentative explicitement protectrice
  rationale: Le verset mentionne le geste de la main vers l’arche, mais n’en formule pas ici l’intention. La traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit, tandis que le plus-que-parfait marque clairement l’action antérieure. La ponctuation conserve l’enchaînement solennel des deux conséquences.
