  - severity: low
    issue: Note alternative potentiellement connotée
    rationale: « Porter la main sur » peut suggérer une action hostile en français. Comme l’expression principale rend déjà le geste avec retenue, cette note n’est pas nécessaire.
  revised_text: Alors la colère de Yahweh s’enflamma contre Ouzza, et il le frappa parce que celui-ci avait tendu la main vers l’arche ; Ouzza mourut là, devant Dieu.
