- from: Alors la colère de Yahweh s’enflamma contre Ouzza, et il le frappa parce qu’il avait tendu la main vers l’arche[a] ; il mourut là, devant Dieu.
  to: Alors la colère de Yahweh s’enflamma contre Ouzza, et il le frappa parce que celui-ci avait tendu la main vers l’arche ; Ouzza mourut là, devant Dieu.
  rationale: La révision explicite les deux référents humains afin de conserver sans équivoque la chaîne narrative du texte source. La note est supprimée, car son alternative française introduit une connotation possible d’hostilité et n’est pas requise pour préserver une ambiguïté textuelle réelle.
