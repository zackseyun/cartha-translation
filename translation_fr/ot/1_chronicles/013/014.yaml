source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן הָ/אֱלֹהִ֜ים עִם בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם בְּ/בֵית֖/וֹ שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית עֹבֵֽד אֱדֹ֖ם וְ/אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/014.yaml
  text: And the ark of God remained with the household of Obed-edom[a], in his house, for three months. And Yahweh blessed the household of Obed-edom and all that belonged to him.
translation:
  language: fr
  text: L’arche de Dieu resta auprès de la maisonnée d’Obed-Édom[a], dans sa maison, pendant trois mois. Yahweh bénit la maisonnée d’Obed-Édom et tout ce qui lui appartenait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la maison d’Obed-Édom » aux deux endroits. Le mot hébreu peut désigner aussi bien le bâtiment que la maisonnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: Le verbe ישׁב peut signifier « s’asseoir », « habiter » ou « rester ». Ici, « resta » exprime naturellement la présence temporaire et continue de l’arche.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Cette formulation traduit exactement le titre hébreu, sans ajouter la mention de l’alliance absente du verset.
- source_word: עִם בֵּית עֹבֵד אֱדֹם
  choice: auprès de la maisonnée d’Obed-Édom
  rationale: בֵּית peut désigner une maison ou l’ensemble des personnes qui y sont rattachées. « Maisonnée » garde ici le sens collectif tout en permettant de distinguer l’expression suivante, qui indique le bâtiment.
- source_word: בְּבֵיתוֹ
  choice: dans sa maison
  rationale: L’expression précise le lieu physique où se trouvait l’arche.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: pendant trois mois
  rationale: « Pendant » marque naturellement en français la durée exprimée par l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » représente le nom divin יהוה et suit la convention du projet.
- source_word: אֶת בֵּית עֹבֵד אֱדֹם
  choice: la maisonnée d’Obed-Édom
  rationale: Dans le contexte de la bénédiction, בֵּית vise vraisemblablement la communauté domestique plutôt que le seul bâtiment, sans exclure ce qui relève de la maison.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: et tout ce qui lui appartenait
  rationale: Cette formulation naturelle conserve la portée large de l’hébreu, qui englobe l’ensemble de ce qui était à lui.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre sans substituer un titre.
- issue: Portée de la bénédiction sur בֵּית עֹבֵד אֱדֹם
  choice: la maisonnée d’Obed-Édom
  alternative: la maison d’Obed-Édom
  rationale: « Maisonnée » fait entendre que la bénédiction touche les personnes rattachées à Obed-Édom, tandis que la suite, « tout ce qui lui appartenait », en élargit explicitement la portée. Une note conserve l’autre lecture possible.
translation_notes:
  register: Français moderne, clair et digne. « Maisonnée » est légèrement soutenu mais reste courant et permet de préserver la distinction contextuelle entre le groupe domestique et la maison comme lieu. Le nom propre est écrit « Obed-Édom » selon l’usage français.
