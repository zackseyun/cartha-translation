  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לְ/כֹ֣ל קְהַ֣ל יִשְׂרָאֵ֗ל אִם עֲלֵי/כֶ֨ם ט֜וֹב וּ/מִן יְהוָ֣ה אֱלֹהֵ֗י/נוּ נִפְרְצָה֙ נִשְׁלְחָ֞ה עַל אַחֵ֣י/נוּ הַ/נִּשְׁאָרִ֗ים בְּ/כֹל֙ אַרְצ֣וֹת יִשְׂרָאֵ֔ל וְ/עִמָּ/הֶ֛ם הַ/כֹּהֲנִ֥ים וְ/הַ/לְוִיִּ֖ם בְּ/עָרֵ֣י מִגְרְשֵׁי/הֶ֑ם וְ/יִקָּבְצ֖וּ אֵלֵֽי/נוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/002.yaml
  text: And David said to all the assembly of Israel[a], “If it seems good to you, and if it is from Yahweh our God, let us send word to our brothers who remain in all the lands of Israel, and also to the priests and Levites with them in the cities of their pasturelands[d][c][b], that they may gather to us.”
translation:
  language: fr
  text: 'David dit à toute l’assemblée d’Israël : « Si cela vous paraît bon et si cela vient de Yahweh, notre Dieu, envoyons de tous côtés[a] un message à nos frères[b] qui restent dans toutes les régions d’Israël, ainsi qu’aux prêtres et aux lévites qui sont parmi eux, dans leurs villes et sur les terrains de parcours qui y sont rattachés[c], afin qu’ils se rassemblent auprès de nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « faisons une percée ; envoyons ». L’expression semble évoquer un envoi largement diffusé.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « frères » désigne collectivement les autres Israélites.
    reason: lexical_alternative
  - marker: c
    text: Il s’agit des terrains ouverts, notamment destinés au pâturage, qui étaient rattachés aux villes des prêtres et des lévites.
    reason: cultural_note
lexical_decisions:
- source_word: קְהַל
  choice: assemblée
  rationale: « Assemblée » désigne naturellement ici l’ensemble national réuni, sans connotation ecclésiastique indue.
- source_word: אִם עֲלֵיכֶם טוֹב
  choice: Si cela vous paraît bon
  rationale: Cette tournure française actuelle rend l’expression idiomatique d’approbation tout en maintenant l’appel au jugement de l’assemblée.
- source_word: וּמִן יְהוָה אֱלֹהֵינוּ
  choice: et si cela vient de Yahweh, notre Dieu
  rationale: Le second « si cela » est implicite en hébreu. Son ajout rend la coordination naturelle en français et préserve la distinction entre l’accord du peuple et l’approbation divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin présent dans le texte hébreu.
- source_word: נִפְרְצָה נִשְׁלְחָה
  choice: envoyons de tous côtés un message
  rationale: Le premier verbe évoque littéralement une percée ou une expansion et, associé à « envoyons », indique vraisemblablement une diffusion étendue. La formulation française exprime cette portée sans conserver une image obscure.
- source_word: עַל אַחֵינוּ
  choice: à nos frères
  rationale: Avec le verbe « envoyer », la préposition introduit ici les destinataires. « Frères » conserve l’image familiale appliquée collectivement aux autres Israélites.
- source_word: הַנִּשְׁאָרִים
  choice: qui restent
  rationale: Cette traduction sobre désigne ceux qui se trouvent encore dans les diverses régions, sans imposer au mot le sens théologique de « reste ».
- source_word: בְּכֹל אַרְצוֹת יִשְׂרָאֵל
  choice: dans toutes les régions d’Israël
  rationale: « Régions » restitue naturellement en français le pluriel hébreu « terres » et souligne l’étendue territoriale.
- source_word: בְּעָרֵי מִגְרְשֵׁיהֶם
  choice: dans les villes auxquelles sont rattachés leurs pâturages
  rationale: La formulation explicite le rapport entre les villes lévitiques et les terrains ouverts qui leur étaient attribués, tout en restant lisible.
- source_word: וְיִקָּבְצוּ אֵלֵינוּ
  choice: afin qu’ils se rassemblent auprès de nous
  rationale: « Afin que » exprime la finalité de l’envoi, tandis que « auprès de nous » conserve l’orientation indiquée par l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Yahvé
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par un titre, sans développer d’interprétation doctrinale.
- issue: Rapport entre l’approbation de l’assemblée et la volonté divine
  choice: « Si cela vous paraît bon et si cela vient de Yahweh »
  alternative: « Si cela vous paraît bon, avec l’accord de Yahweh »
  rationale: La traduction retenue préserve les deux conditions coordonnées du texte et n’assimile pas automatiquement le consentement humain à l’approbation divine.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la longue proposition délibérative du discours de David tout en la clarifiant par une ponctuation naturelle. Les termes « prêtres », « lévites », « assemblée » et « pâturages » sont courants et précis.
