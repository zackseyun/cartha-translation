revisions:
- from: 'David dit à toute l’assemblée d’Israël : « Si cela vous paraît bon et si cela vient de Yahweh, notre Dieu, envoyons de tous côtés[a] un message à nos frères[b] qui restent dans toutes les régions d’Israël, ainsi qu’aux prêtres et aux lévites qui sont avec eux, dans les villes auxquelles sont rattachés leurs pâturages[c], afin qu’ils se rassemblent auprès de nous. »'
  to: 'David dit à toute l’assemblée d’Israël : « Si cela vous paraît bon et si cela vient de Yahweh, notre Dieu, envoyons de tous côtés[a] un message à nos frères[b] qui restent dans toutes les régions d’Israël, ainsi qu’aux prêtres et aux lévites qui sont parmi eux, dans leurs villes et sur les terrains de parcours qui y sont rattachés[c], afin qu’ils se rassemblent auprès de nous. »'
  rationale: La révision clarifie, sans modifier le sens, que les prêtres et les lévites sont répartis parmi les Israélites et que les terrains de parcours sont attenants à leurs villes. Elle conserve l’ambiguïté limitée de l’expression idiomatique « faisons une percée ; envoyons » dans la note, tout en gardant dans le texte une formulation française lisible.
