    issue: Relation des prêtres et lévites aux Israélites et à leurs villes
    rationale: Le texte hébreu associe les prêtres et lévites aux Israélites auxquels le message doit être envoyé, puis les situe dans leurs villes avec leurs terrains attenants. « Qui sont avec eux » laisse la relation compréhensible, mais « qui sont parmi eux » est plus naturel dans ce contexte; la mention explicite des terrains rattachés aux villes améliore aussi la précision.
