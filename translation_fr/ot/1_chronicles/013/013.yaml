base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/013.yaml
  text: So David did not bring the ark to himself[a], into the City of David; instead[b], he turned it aside to the house of Obed-edom the Gittite.
translation:
  language: fr
  text: David ne fit donc pas transporter l’arche chez lui, dans la cité de David ; il la détourna vers la maison d’Obed-Édom, le Guittite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: C’est-à-dire un homme de Gath.
    reason: cultural_clarification
lexical_decisions:
- source_word: הֵסִיר
  choice: ne fit pas venir
  rationale: Le hiphil de סוּר peut exprimer l’action d’écarter, d’enlever ou de déplacer. Avec l’arche comme objet et une destination indiquée, « faire venir » rend naturellement en français le déplacement projeté sans effacer la valeur plus littérale signalée en note.
- source_word: אֵלָיו
  choice: auprès de lui
  rationale: La préposition avec suffixe signifie littéralement « vers lui ». « Auprès de lui » garde cette relation avec David tout en s’accordant avec la précision géographique qui suit.
- source_word: עִיר דָּוִיד
  choice: la Cité de David
  rationale: Il s’agit d’un nom de lieu établi. La majuscule à « Cité » signale cet emploi toponymique.
- source_word: וַיַּטֵּהוּ
  choice: il la détourna
  rationale: Le hiphil de נָטָה décrit ici la réorientation de l’arche hors de l’itinéraire prévu. « Détourner » est actuel, concret et fidèle au mouvement du récit.
- source_word: בֵּית
  choice: la maison de
  rationale: בַּיִת peut désigner la maison ou la maisonnée. Puisque l’arche est conduite dans un lieu où elle séjournera, « maison » convient au contexte tout en laissant ouverte l’idée du foyer.
- source_word: עֹבֵד אֱדֹם
  choice: Obed-Édom
  rationale: Cette translittération française usuelle conserve les deux éléments du nom et emploie l’accent requis par la lecture française.
- source_word: הַגִּתִּי
  choice: le Guittite
  rationale: Le gentilé hébreu est rendu directement par le gentilé français traditionnel; une note explicite son rapport à Gath pour les lecteurs modernes.
