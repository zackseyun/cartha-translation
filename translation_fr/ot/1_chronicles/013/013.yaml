revisions:
- from: David ne fit donc pas venir l’arche auprès de lui[a], dans la Cité de David, mais il la détourna vers la maison d’Obed-Édom, le Guittite[b].
  to: David ne fit donc pas transporter l’arche chez lui, dans la cité de David ; il la détourna vers la maison d’Obed-Édom, le Guittite[b].
  rationale: La révision clarifie la destination de l’arche en français tout en préservant l’amplitude du verbe hébreu en note. Le point-virgule marque le contraste entre l’abandon de l’itinéraire vers la cité de David et la réorientation vers la maison d’Obed-Édom. L’ancre a est supprimée du texte, car la note correspond à une alternative lexicale non nécessaire à la lecture courante ; l’ancre b demeure correctement attachée au gentilé expliqué.
