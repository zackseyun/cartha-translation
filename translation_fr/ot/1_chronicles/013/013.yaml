review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : David ne conduit pas l’arche dans la Cité de David et la réoriente vers la maison d’Obed-Édom. Toutefois, « auprès de lui, dans la Cité de David » est syntaxiquement ambigu en français et rend moins clairement la double destination exprimée par l’hébreu.'
  naturalness: « Chez lui, dans la cité de David » est plus naturel et plus clair en français moderne que « auprès de lui, dans la Cité de David ». La coordination par point-virgule conserve le contraste narratif sans alourdir la phrase.
  terminology: « Arche », « cité de David », « Obed-Édom » et « le Guittite » sont appropriés. La note sur le Guittite est utile. La note a est à resserrer, car sa formulation actuelle introduit inutilement « pour la conduire ».
  issues:
  - severity: medium
    issue: Ambiguïté syntaxique de « auprès de lui, dans la Cité de David »
    rationale: La juxtaposition peut laisser entendre que David se trouve déjà dans la Cité de David plutôt que d’indiquer que l’arche devait être amenée chez lui, dans cette cité. « Chez lui, dans la cité de David » rend plus idiomatiquement la relation entre אֵלָיו et אֶל־עִיר דָּוִיד.
  - severity: low
    issue: Note a trop paraphrastique
    rationale: « N’éloigna donc pas l’arche pour la conduire auprès de lui » ne correspond pas à une alternative française directe et ajoute une construction explicative absente du texte. Une note brève peut signaler les sens « retirer/enlever » et « amener/faire transporter » sans les combiner.
  revised_text: David ne fit donc pas transporter l’arche chez lui, dans la cité de David ; il la détourna vers la maison d’Obed-Édom, le Guittite[b].
  revised_footnotes:
  - marker: a
    text: 'Ou : « David ne retira pas l’arche chez lui ». Le verbe hébreu peut signifier « retirer », « enlever » ou, dans ce contexte, « amener » ou « faire transporter ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire un homme de Gath.
    reason: cultural_clarification
