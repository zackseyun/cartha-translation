  text: וַ/יִּוָּעַ֣ץ דָּוִ֗יד עִם שָׂרֵ֧י הָ/אֲלָפִ֛ים וְ/הַ/מֵּא֖וֹת לְ/כָל נָגִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/001.yaml
  text: And David consulted with the commanders of the thousands and the hundreds[a], with every leader.
translation:
  language: fr
  text: David consulta les chefs de milliers et de centaines, ainsi que chaque dirigeant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: consulta
  rationale: Le nifal de יעץ exprime ici une délibération menée avec d’autres personnes. « Consulta » est naturel et conserve cette idée sans archaïsme.
- source_word: עִם
  choice: avec (exprimé par la construction directe « consulter quelqu’un »)
  rationale: En français moderne, « consulter les chefs » exprime idiomatiquement le fait de prendre conseil auprès d’eux; ajouter « avec » serait moins naturel dans cette construction.
- source_word: שָׂרֵי
  choice: chefs
  rationale: שָׂר désigne des responsables ou commandants. Avec les unités de milliers et de centaines, « chefs » convient au cadre militaire et administratif sans surinterprétation.
- source_word: הָאֲלָפִים
  choice: de milliers
  rationale: L’expression désigne vraisemblablement des unités militaires ou administratives. La formulation littérale préserve l’organisation numérique du texte hébreu.
- source_word: וְהַמֵּאוֹת
  choice: et de centaines
  rationale: Le terme forme avec « milliers » une paire désignant des unités organisées; la traduction en maintient le parallélisme.
- source_word: לְכָל
  choice: tous les
  rationale: Dans cette construction, לְכָל étend la liste des personnes consultées. « Tous les » restitue clairement cette portée en français idiomatique.
- source_word: נָגִיד
  choice: dirigeants
  rationale: נָגִיד désigne une personne investie d’une fonction de direction. « Dirigeants » reste assez large pour ne pas imposer la nuance plus précise de prince ou de souverain.
theological_decisions: []
