  text: וַ/יֹּאמְר֥וּ כָֽל הַ/קָּהָ֖ל לַ/עֲשׂ֣וֹת כֵּ֑ן כִּֽי יָשַׁ֥ר הַ/דָּבָ֖ר בְּ/עֵינֵ֥י כָל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/004.yaml
  text: And all the assembly said to do so[a], for the matter was right in the eyes of all the people.
translation:
  language: fr
  text: Toute l’assemblée déclara qu’il fallait faire ainsi[a], car la chose parut juste aux yeux de tout le peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Toute l’assemblée dit qu’il fallait faire ainsi » ; la formulation hébraïque exprime le consentement de l’assemblée à la proposition.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: déclara
  rationale: Le verbe אמר signifie littéralement « dire ». Avec le sujet collectif « toute l’assemblée », le singulier français est naturel; le contexte exprime une approbation formulée collectivement sans réduire le verbe à un simple « être d’accord ».
- source_word: כָל הַקָּהָל
  choice: toute l’assemblée
  rationale: קָהָל désigne ici la communauté réunie. « Assemblée » convient à ce rassemblement national et évite la coloration ecclésiale que pourrait avoir « congrégation ».
- source_word: לַעֲשׂוֹת כֵּן
  choice: qu’il fallait agir ainsi
  rationale: L’infinitif עשה avec כֵּן signifie « faire ainsi ». Cette tournure rend naturellement en français le consentement de l’assemblée à la proposition, tout en conservant dans la note l’alternative plus formelle.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la raison de la réponse de l’assemblée; « car » maintient clairement ce lien explicatif.
- source_word: יָשַׁר
  choice: parut juste
  rationale: יָשַׁר qualifie la chose de droite, juste ou convenable selon l’évaluation du peuple. Associé à l’expression « aux yeux de », « parut juste à » en restitue naturellement le sens.
- source_word: הַדָּבָר
  choice: la chose
  rationale: דָּבָר peut signifier « parole », « chose » ou « affaire ». « La chose » reste proche du texte et renvoie sans ajout interprétatif à la proposition qui vient d’être faite.
- source_word: בְּעֵינֵי כָל הָעָם
  choice: à tout le peuple
  rationale: Littéralement « aux yeux de tout le peuple ». L’équivalent idiomatique français « parut juste à tout le peuple » exprime la même appréciation sans tournure artificielle.
