  to: David et tout Israël montèrent à Baala, c’est-à-dire à Qiriath-Yéarim, qui appartient à Juda, pour en faire monter l’arche de Dieu, Yahweh, qui siège au-dessus des chérubins et dont le nom est invoqué.[a]
