review_pass:
  verdict: revise
  source_fidelity: 'Le rendu suit fidèlement le déplacement (« montèrent »), l’identification de Baala à Qiriath-Yéarim, le rattachement à Juda et le transport de l’arche. En revanche, « sur elle » n’est pas exprimé dans le texte hébreu de 1 Chroniques 13.6 : il provient de la formulation plus développée du parallèle de 2 Samuel 6.2 et résout indûment l’ellipse finale.'
  naturalness: Le français est clair, moderne et d’un registre approprié. La suppression de « lui » et de l’ajout « sur elle » rend la clausule plus fluide sans prétendre déterminer ce que l’hébreu laisse elliptique.
  terminology: « Arche de Dieu », « Yahweh », « chérubins », « Juda » et les noms de lieux sont cohérents. « Yahweh » respecte le choix éditorial fourni. « Invoqué » est une explicitation idiomatique modérée de l’expression du Nom ; la note conserve l’alternative où l’arche est désignée par le Nom.
  issues:
  - severity: medium
    issue: Ajout de « sur elle » dans la proposition finale
    rationale: Le texte massorétique de 1 Ch 13.6 s’achève par אשר נקרא שם (« dont/le nom est appelé »), sans équivalent de « sur elle ». Le parallèle de 2 S 6.2 comporte une formulation plus longue, mais ne doit pas être incorporé au texte principal de Chroniques.
  - severity: low
    issue: Note alternative à reformuler légèrement
    rationale: « appelée du Nom de Yahweh » est possible, mais « appelée du nom de Yahweh » est plus naturel en français et distingue mieux cette lecture de la formulation principale.
  revised_text: David et tout Israël montèrent à Baala, c’est-à-dire à Qiriath-Yéarim, qui appartient à Juda, pour en faire monter l’arche de Dieu, Yahweh, qui siège au-dessus des chérubins et dont le nom est invoqué.[a]
