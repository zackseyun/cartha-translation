  text: וַ/יַּ֨עַל דָּוִ֤יד וְ/כָל יִשְׂרָאֵל֙ בַּעֲלָ֔תָ/ה אֶל קִרְיַ֥ת יְעָרִ֖ים אֲשֶׁ֣ר לִ/יהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵת֩ אֲר֨וֹן הָ/אֱלֹהִ֧ים יְהוָ֛ה יוֹשֵׁ֥ב הַ/כְּרוּבִ֖ים אֲשֶׁר נִקְרָ֥א שֵֽׁם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/006.yaml
  text: So David and all Israel went up to Baalah[a], that is, to Kiriath-jearim, which belongs to Judah, to bring up from there the ark of God, Yahweh who is enthroned above the cherubim, whose name is called upon it.
translation:
  language: fr
  text: David et tout Israël montèrent à Baala, c’est-à-dire à Qiriath-Yéarim, qui appartient à Juda, pour en faire monter l’arche de Dieu, Yahweh, qui siège au-dessus des chérubins et dont le nom est invoqué.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « l’arche de Dieu, appelée du nom de Yahweh, qui siège au-dessus des chérubins ». L’hébreu de la dernière proposition est elliptique. Comparer 2 Samuel 6.2.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: montèrent
  rationale: Le verbe עלה exprime ici un déplacement vers le haut; « montèrent » convient naturellement au récit de voyage.
- source_word: בַּעֲלָתָה
  choice: à Baala
  rationale: Nom de lieu, avec le hé directionnel rendu naturellement par la préposition « à ».
- source_word: אֶל קִרְיַת יְעָרִים
  choice: c’est-à-dire à Qiriath-Yéarim
  rationale: Le second nom précise l’identité de Baala; « c’est-à-dire » explicite cette apposition sans en changer le sens.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: qui appartient à Juda
  rationale: La construction avec ל marque ici le rattachement territorial à Juda.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: afin d’en faire monter
  rationale: Le causatif de עלה signifie faire monter ou transporter vers le haut; « en » reprend naturellement « de là » en français.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Rendu direct et consacré de la construction génitive hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française courante du nom divin, qui conserve son statut de nom propre.
- source_word: יוֹשֵׁב הַכְּרוּבִים
  choice: qui siège au-dessus des chérubins
  rationale: Le participe évoque la royauté divine en relation avec les chérubins; « au-dessus » convient à l’image de l’arche sans introduire « entre », absent de l’hébreu.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: lui dont le nom est invoqué sur elle
  rationale: La proposition est elliptique. Ce rendu conserve le passif et rattache prudemment « sur elle » à l’arche, tout en signalant l’ambiguïté par une note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin; sa translittération préserve cette donnée plutôt que de lui substituer un titre.
- issue: Référent et sens de אֲשֶׁר נִקְרָא שֵׁם
  choice: lui dont le nom est invoqué sur elle
  alternative: l’arche appelée du Nom
  rationale: L’hébreu est fortement elliptique et son rattachement syntaxique demeure discuté. Le texte principal garde le rapport entre Yahweh, son nom et l’arche, tandis que la note présente une lecture idiomatique alternative.
translation_notes:
  register: Français international moderne, digne et lisible. Les noms propres suivent une translittération française cohérente. La formulation préserve l’ambiguïté syntaxique de la fin du verset sans imposer une interprétation confessionnelle.
