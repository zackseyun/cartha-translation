source:
  edition: WLC
  text: וְ/נָסֵ֛בָּה אֶת אֲר֥וֹן אֱלֹהֵ֖י/נוּ אֵלֵ֑י/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ בִּ/ימֵ֥י שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/003.yaml
  text: And let us bring the ark of our God back to us[a], for we did not seek it in the days of Shaul.
translation:
  language: fr
  text: Ramenons auprès de nous l’arche de notre Dieu, car nous ne l’avons pas recherchée[a] du temps de Saül.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi signifier « consulter » ou « s’enquérir de ». Le pronom peut renvoyer à l’arche ; certaines traductions comprennent qu’il renvoie à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסֵבָּה
  choice: Ramenons
  rationale: Le cohortatif à la première personne du pluriel exprime ici une proposition collective. Avec l’arche comme objet et « auprès de nous » comme destination, « Ramenons » restitue naturellement l’idée de la faire revenir.
- source_word: אֶת אֲרוֹן אֱלֹהֵינוּ
  choice: l’arche de notre Dieu
  rationale: La chaîne construite avec le suffixe de première personne du pluriel signifie directement « l’arche de notre Dieu »; le terme cultuel « arche » est conservé.
- source_word: אֵלֵינוּ
  choice: auprès de nous
  rationale: La préposition indique un mouvement en direction de la communauté. « Auprès de nous » convient idiomatiquement au retour de l’arche et évite la tournure moins naturelle « à nous ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la proposition; « car » maintient clairement ce rapport explicatif dans un registre narratif digne.
- source_word: לֹא דְרַשְׁנֻהוּ
  choice: nous ne l’avons pas recherchée
  rationale: Le verbe דרש peut signifier rechercher, s’enquérir de ou consulter. Le suffixe masculin singulier renvoie grammaticalement à אֲרוֹן, masculin en hébreu; en français, la reprise de « l’arche » exige le féminin. « Recherchée » conserve la référence concrète tout en laissant entendre la négligence religieuse plus large.
- source_word: בִּימֵי שָׁאוּל
  choice: du temps de Saül
  rationale: Cette expression française naturelle rend « aux jours de Saül ». La forme française courante du nom biblique, « Saül », est employée.
theological_decisions:
- issue: Objet de « nous ne l’avons pas recherchée »
  choice: Le pronom renvoie dans le texte principal à l’arche.
  alternative: « nous n’avons pas recherché Dieu » ou « nous ne l’avons pas consulté »
  rationale: Le suffixe hébreu reprend le plus naturellement « arche », nom masculin en hébreu. Remplacer explicitement ce référent par Dieu résoudrait une tension que le texte laisse implicite. La traduction conserve donc l’objet grammatical tout en signalant en note les autres nuances possibles du verbe.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif « Ramenons » rend la valeur exhortative du cohortatif sans lourdeur. « Du temps de Saül » est plus idiomatique que « aux jours de Saül » tout en conservant le cadre historique.
