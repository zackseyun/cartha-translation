  text: וַ/יִּירָ֤א דָוִיד֙ אֶת הָ֣/אֱלֹהִ֔ים בַּ/יּ֥וֹם הַ/ה֖וּא לֵ/אמֹ֑ר הֵ֚יךְ אָבִ֣יא אֵלַ֔/י אֵ֖ת אֲר֥וֹן הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/012.yaml
  text: And David feared God that day[a], saying, “How can I bring the ark of God to me?”
translation:
  language: fr
  text: 'Ce jour-là, David eut peur de Dieu[a] et dit : « Comment puis-je faire venir jusqu’à moi l’arche de Dieu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut saisi de crainte devant Dieu » ; selon le contexte, le verbe hébreu peut exprimer la peur, l’effroi ou une crainte révérencielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: eut peur de
  rationale: Le verbe ירא exprime ici une peur suscitée par le jugement divin qui vient de frapper Ouzza. « Eut peur de » rend naturellement en français cette réaction immédiate, tout en laissant la note signaler la nuance possible de crainte révérencielle.
- source_word: אֶת הָאֱלֹהִים
  choice: Dieu
  rationale: Le marqueur d’objet direct אֶת n’est pas traduit; הָאֱלֹהִים désigne ici Dieu. « Avoir peur de Dieu » est idiomatique en français.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Expression temporelle française naturelle et précise, correspondant directement à « en ce jour-là ».
- source_word: לֵאמֹר
  choice: et dit
  rationale: L’infinitif hébreu introduit les paroles directes. Dans ce récit, « et dit » est plus naturel en français que le calque « en disant ».
- source_word: הֵיךְ
  choice: Comment pourrais-je
  rationale: Le conditionnel traduit la question inquiète de David concernant la possibilité de faire venir l’arche, sans réduire celle-ci à une simple demande de procédure.
- source_word: אָבִיא
  choice: faire venir
  rationale: Le hiphil de בוא a un sens causatif, « faire venir, amener ». « Faire venir » exprime clairement cette valeur dans le contexte du transport de l’arche.
- source_word: אֵלַי
  choice: chez moi
  rationale: Littéralement « vers moi ». Dans ce contexte spatial, « chez moi » est naturel et conserve l’ambiguïté entre la demeure, le lieu et la sphère de David.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Cette formulation transparente conserve la construction hébraïque et la terminologie récurrente du récit.
theological_decisions:
- issue: Nature de la réaction de David au jugement de Dieu
  choice: « eut peur de Dieu »
  alternative: « craignit Dieu » ou « éprouva une crainte révérencielle envers Dieu »
  rationale: La mort d’Ouzza donne au verbe une forte dimension de peur et d’effroi. La traduction ne l’adoucit pas en simple respect, tandis que la note préserve l’étendue sémantique du verbe hébreu et la tension entre peur et révérence.
translation_notes:
  register: Français moderne, international et digne. La syntaxe narrative est fluide; « chez moi » évite le calque peu naturel « vers moi », et le conditionnel dans la question restitue l’inquiétude de David sans ajouter d’explication doctrinale.
