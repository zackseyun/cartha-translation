source:
  edition: WLC
  text: וַ/יִּ֣חַר לְ/דָוִ֔יד כִּֽי פָרַ֧ץ יְהוָ֛ה פֶּ֖רֶץ בְּ/עֻזָּ֑א וַ/יִּקְרָ֞א לַ/מָּק֤וֹם הַ/הוּא֙ פֶּ֣רֶץ עֻזָּ֔א עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/011.yaml
  text: And David was angry because Yahweh had broken out against Uzza[a]; so he called that place Perez-uzza to this day.
translation:
  language: fr
  text: David se mit en colère parce que Yahweh avait ouvert une brèche contre Ouzza. Il donna à cet endroit le nom de Pérets-Ouzza[a], jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Pérets-Ouzza » peut signifier « brèche contre Ouzza » ou « irruption contre Ouzza ». Ce nom reprend le jeu de mots hébreu de la phrase « Yahweh avait ouvert une brèche contre Ouzza ».
    reason: Signaler le jeu de mots fondé sur la répétition de la racine פרץ et expliquer le nom du lieu.
lexical_decisions:
- source_word: וַיִּחַר לְדָוִיד
  choice: David se mit en colère
  rationale: L’expression idiomatique indique que la colère s’enflamma chez David. Cette formulation moderne en restitue clairement la force sans préciser contre qui sa colère était dirigée, ce que l’hébreu ne dit pas.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici la cause de la colère de David.
- source_word: פָרַץ יְהוָה פֶּרֶץ
  choice: Yahweh avait ouvert une brèche
  rationale: Le verbe פָרַץ et le nom apparenté פֶּרֶץ créent une reprise lexicale évoquant une irruption violente ou une brèche. « ouvrir une brèche » garde cette image et prépare le nom Pérets-Ouzza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme un nom propre plutôt que remplacé par un titre.
- source_word: בְּעֻזָּא
  choice: contre Ouzza
  rationale: La préposition désigne Ouzza comme la personne visée par l’irruption divine; « contre » convient naturellement à ce contexte.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: C’est pourquoi il appela cet endroit
  rationale: Cette tournure rend la formule de dénomination et explicite naturellement en français le lien avec l’événement précédent.
- source_word: פֶּרֶץ עֻזָּא
  choice: Pérets-Ouzza
  rationale: Le nom de lieu est translittéré selon un usage français, tandis que sa signification et le jeu de mots sont signalés en note.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: nom qu’il porte encore aujourd’hui
  rationale: Cette formulation idiomatique française indique que cette appellation demeurait en usage au moment de la rédaction.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le tétragramme comme nom propre de Dieu; sa translittération préserve cette fonction sans lui substituer un titre.
- issue: Objet de la colère de David
  choice: Ne pas préciser contre qui David était en colère
  alternative: David se mit en colère contre Yahweh
  rationale: L’hébreu dit que la colère s’enflamma chez David à cause de l’événement, mais ne nomme pas explicitement la personne contre laquelle elle était dirigée.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image inhabituelle de la brèche afin de maintenir le jeu de mots hébreu, expliqué en note, et évite de déterminer la cible de la colère de David.
