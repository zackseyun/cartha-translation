  text: וַ/יַּרְכִּ֜יבוּ אֶת אֲר֤וֹן הָ/אֱלֹהִים֙ עַל עֲגָלָ֣ה חֲדָשָׁ֔ה מִ/בֵּ֖ית אֲבִינָדָ֑ב וְ/עֻזָּ֣א וְ/אַחְי֔וֹ נֹהֲגִ֖ים בָּ/עֲגָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/007.yaml
  text: So they set the ark of God on a new cart from the house of Abinadab[a], and Uzza and Ahio were guiding the cart.
translation:
  language: fr
  text: Ils transportèrent l’arche de Dieu sur un chariot neuf depuis la maison d’Abinadab. Ouzza et Ahio conduisaient le chariot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « menaient le chariot ». Le participe hébreu peut désigner l’action de mener ou de conduire un véhicule.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכִּיבוּ
  choice: ils placèrent
  rationale: Le hifil de רכב signifie ici faire monter ou faire transporter sur un véhicule. « Placèrent ... sur » exprime naturellement l’action en français sans la surinterpréter.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Rendu traditionnel, précis et immédiatement intelligible dans ce contexte cultuel.
- source_word: עַל עֲגָלָה חֲדָשָׁה
  choice: sur un chariot neuf
  rationale: עגלה désigne un chariot ou une charrette. « Chariot » convient au transport de l’arche, et l’adjectif « neuf » est conservé explicitement.
- source_word: מִבֵּית אֲבִינָדָב
  choice: et la sortirent de la maison d’Abinadab
  rationale: Le syntagme indique la provenance. En français, la reprise verbale explicite rend clairement que l’arche vient de la maison, tout en restant fidèle au sens de la préposition מן.
- source_word: עֻזָּא
  choice: Ouzza
  rationale: Translittération française courante du nom hébreu.
- source_word: אַחְיוֹ
  choice: Ahio
  rationale: Translittération usuelle et transparente du nom propre.
- source_word: נֹהֲגִים בָּעֲגָלָה
  choice: conduisaient le chariot
  rationale: Le participe נהג peut exprimer l’action de mener ou de conduire un véhicule ou les animaux qui le tirent. « Conduisaient le chariot » est naturel et garde cette latitude contextuelle.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le passé simple convient au registre narratif biblique, tandis que l’imparfait rend la valeur durative du participe hébreu. La phrase a été légèrement explicitée pour éviter que « de la maison d’Abinadab » ne semble modifier « un chariot neuf ».
