revisions:
- from: David rassembla donc tout Israël, depuis le Shihor d’Égypte[a] jusqu’à Lebo-Hamath[b], afin de faire venir de Qiryath-Yearim le coffre de Dieu.
  to: David rassembla tout Israël, depuis le Shihor d’Égypte[a] jusqu’à Lebo-Hamath[b], pour faire venir de Qiryath-Yearim l’arche de Dieu.
  rationale: La révision supprime une inférence logique absente de l’hébreu et remplace « coffre » par « arche », terme français consacré qui rend le référent cultuel d’אַרוֹן avec exactitude. La note sur Shihor est légèrement nuancée afin de ne pas surdéterminer l’identification géographique. Les ancres demeurent correctement associées aux expressions commentées.
