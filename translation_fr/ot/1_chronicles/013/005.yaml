  text: וַ/יַּקְהֵ֤ל דָּוִיד֙ אֶת כָּל יִשְׂרָאֵ֔ל מִן שִׁיח֥וֹר מִצְרַ֖יִם וְ/עַד לְב֣וֹא חֲמָ֑ת לְ/הָבִיא֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים מִ/קִּרְיַ֖ת יְעָרִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/005.yaml
  text: So David assembled all Israel[a], from the Shihor of Egypt to Lebo-hamath[b], to bring the ark of God from Kiriath-jearim.
translation:
  language: fr
  text: David rassembla tout Israël, depuis le Shihor d’Égypte[a] jusqu’à Lebo-Hamath[b], pour faire venir de Qiryath-Yearim l’arche de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « Shihor d’Égypte » est une désignation de la frontière méridionale ; certains y voient « le torrent d’Égypte ».
    reason: cultural_note
  - marker: b
    text: 'Ou, plus littéralement : « jusqu’à l’entrée de Hamath ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: rassembla
  rationale: Le hiphil de קהל indique que David fit se réunir le peuple. « Rassembla » est naturel en français et convient à une assemblée nationale.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Cette formulation conserve l’expression collective nationale de l’hébreu, qui peut désigner l’ensemble du peuple représenté sans nécessairement viser chaque individu.
- source_word: מִן שִׁיחוֹר מִצְרַיִם
  choice: depuis le Shihor d’Égypte
  rationale: La translittération « Shihor » préserve le nom géographique hébreu et évite d’identifier trop rapidement ce lieu à un cours d’eau précis.
- source_word: וְעַד לְבוֹא חֲמָת
  choice: jusqu’à Lebo-Hamath
  rationale: L’expression, littéralement liée à « l’entrée de Hamath », fonctionne ici comme une désignation géographique reconnue. La translittération garde cette valeur toponymique, tandis que le sens littéral est signalé en note.
- source_word: לְהָבִיא
  choice: afin de faire venir
  rationale: L’infinitif exprime le but du rassemblement. « Afin de faire venir » rend clairement cette finalité et le mouvement de l’objet depuis Qiryath-Yearim.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: le coffre de Dieu
  rationale: « Coffre » exprime concrètement le sens de אֲרוֹן en français courant, sans ajouter dans ce verset le terme interprétatif « alliance ».
- source_word: מִקִּרְיַת יְעָרִים
  choice: de Qiryath-Yearim
  rationale: Cette translittération française conserve le nom propre hébreu et rend la préposition de provenance.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure géographique « depuis… jusqu’à… » est conservée. Les appels de note ont été placés auprès des expressions qu’ils expliquent ; cela corrige l’inversion apparente des marqueurs dans la couche anglaise de consultation.
