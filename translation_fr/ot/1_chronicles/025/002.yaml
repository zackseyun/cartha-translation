  text: לִ/בְנֵ֣י אָסָ֗ף זַכּ֧וּר וְ/יוֹסֵ֛ף וּ/נְתַנְיָ֥ה וַ/אֲשַׂרְאֵ֖לָה בְּנֵ֣י אָסָ֑ף עַ֚ל יַד אָסָ֔ף הַ/נִּבָּ֖א עַל יְדֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/002.yaml
  text: 'Of the sons of Asaph: Zaccur[a], Joseph, Nethaniah, and Asharelah, sons of Asaph, under the direction of Asaph, who prophesied under the direction of the king.'
translation:
  language: fr
  text: 'Parmi les fils d’Asaph : Zaccur, Joseph, Nethania et Asharelah, fils d’Asaph, sous la direction d’Asaph[a], qui prophétisait sous la direction du roi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main d’Asaph […] par la main du roi ». L’expression hébraïque peut désigner l’intermédiaire, la supervision ou la direction.'
    reason: Préciser l’image littérale et l’étendue sémantique de l’expression hébraïque עַל יַד.
lexical_decisions:
- source_word: לִבְנֵי
  choice: Parmi les fils de
  rationale: Dans cette liste, le préfixe ל introduit une subdivision du groupe recensé. « Parmi les fils de » fonctionne naturellement comme en-tête de cette catégorie.
- source_word: זַכּוּר וְיוֹסֵף וּנְתַנְיָה וַאֲשַׂרְאֵלָה
  choice: Zaccur, Joseph, Nethania et Asareéla
  rationale: Les noms propres sont translittérés selon des formes bibliques françaises reconnaissables, tout en suivant les formes du texte hébreu.
- source_word: בְּנֵי אָסָף
  choice: fils d’Asaph
  rationale: La répétition présente en hébreu est conservée, car elle rattache explicitement les quatre hommes à la lignée ou au groupe d’Asaph.
- source_word: עַל יַד / עַל יְדֵי
  choice: sous la direction de
  rationale: L’expression signifie littéralement « par la main de », mais peut exprimer l’autorité, la supervision ou l’intermédiaire. « Sous la direction de » convient ici au cadre administratif et préserve le parallélisme des deux occurrences.
- source_word: הַנִּבָּא
  choice: qui prophétisait
  rationale: Le participe du verbe נבא décrit l’activité prophétique d’Asaph. L’imparfait français rend naturellement cette fonction ou activité durable dans le contexte du service musical.
theological_decisions:
- issue: Sens de « prophétiser » dans le cadre musical du temple
  choice: Conserver « qui prophétisait »
  alternative: « qui exécutait une musique inspirée » ou « qui chantait prophétiquement »
  rationale: Le Chroniste emploie explicitement נבא. Le traduire par « prophétiser » maintient l’affirmation théologique et son amplitude sans réduire l’activité à une simple exécution musicale ni préciser au-delà du texte la manière dont elle s’exerçait.
translation_notes:
  register: Français international moderne, naturel et digne. La structure de liste et la répétition de « fils d’Asaph » sont conservées; l’expression idiomatique hébraïque est rendue clairement sans effacer son sens littéral, indiqué en note.
