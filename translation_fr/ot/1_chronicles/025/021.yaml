  text: The fourteenth was Mattithiah[a], his sons and his brothers, twelve.
translation:
  language: fr
  text: 'Le quatorzième fut Mattithia[a], avec ses fils et ses frères : douze en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Pour quatorze, Mattithia. » Dans cette liste, le nombre désigne le quatorzième lot ou groupe.'
