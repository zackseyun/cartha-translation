lexical_decisions:
- source_word: לְאַרְבָּעָה עָשָׂר
  choice: Le quatorzième
  rationale: Dans la formule répétée de cette liste, לְ suivi d’un nombre désigne le rang du lot ou du groupe. « Le quatorzième » est naturel en français et n’ajoute pas dans le corps du texte le mot « lot », qui reste implicite.
- source_word: מַתִּתְיָהוּ
  choice: Mattithia
  rationale: Cette forme française rend le nom hébreu de manière claire et conforme à l’usage biblique francophone courant.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le nom hébreu désigne précisément les fils, plutôt qu’un terme générique comme « enfants ».
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: « Frères » est le sens direct et moderne du terme; « parents » serait trop large.
- source_word: שְׁנֵים עָשָׂר
  choice: douze en tout
  rationale: Le nombre indique l’effectif total du groupe associé à Mattithia. « En tout » explicite naturellement en français la fonction du nombre sans modifier son contenu.
