  text: the twelfth to Hashabiah[a], his sons and his brothers, twelve.
translation:
  language: fr
  text: 'Le douzième[a] revint à Hashabia, à ses fils et à ses frères : douze en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les douze », selon une traduction plus littérale ; le contexte favorise le sens ordinal « le douzième », puisque les lots sont énumérés dans l’ordre tout au long du chapitre.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: le douzième
  rationale: Dans la suite ordonnée des lots, le cardinal hébreu fonctionne ici comme un ordinal. « Le douzième » exprime naturellement cette valeur en français, tout en signalant en note la lecture plus littérale.
- source_word: לַחֲשַׁבְיָה
  choice: revint à Hashabia
  rationale: Le préfixe ל marque l’attribution du lot. « Revint à » rend clairement cette relation dans une liste de tirages au sort, sans alourdir le texte par la répétition du mot « lot ».
- source_word: חֲשַׁבְיָה
  choice: Hashabia
  rationale: Le nom propre est translittéré sous une forme courante et naturelle en français biblique.
- source_word: בָּנָיו
  choice: ses fils
  rationale: בנים désigne ici les descendants masculins du chef de groupe; « fils » conserve cette précision.
- source_word: וְאֶחָיו
  choice: et à ses frères
  rationale: Le sens premier de אחים est « frères ». La répétition de « à » rattache clairement tout le groupe à l’attribution exprimée par « revint à ».
- source_word: שְׁנֵים עָשָׂר
  choice: douze en tout
  rationale: Le nombre final indique l’effectif total du groupe. « En tout » explicite sobrement cette fonction de récapitulation en français.
