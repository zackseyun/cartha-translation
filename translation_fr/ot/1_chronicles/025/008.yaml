  text: And they cast lots for duties[a], the small as well as the great[b], the teacher with the student.
translation:
  language: fr
  text: Ils tirèrent au sort les charges de service, le petit comme le grand, l’expert avec l’élève.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּפִּילוּ גּוֹרָלוֹת
  choice: Ils tirèrent au sort
  rationale: La construction causative de נפל avec גּוֹרָלוֹת forme l’expression consacrée désignant le tirage au sort. Cette formulation est naturelle en français et conserve l’action du texte.
- source_word: מִשְׁמֶרֶת
  choice: les tours de service
  rationale: Dans le contexte de l’organisation du service musical du temple, le nom désigne une charge ou une période de service assignée. « Tours de service » rend concrètement cette organisation sans ajouter de possessif absent de l’hébreu.
- source_word: לְעֻמַּת
  choice: sans distinction entre
  rationale: Ici, la préposition exprime la mise sur un pied d’égalité des catégories mentionnées plutôt qu’une opposition spatiale. La formulation française explicite naturellement cet effet du tirage au sort.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: le petit et le grand
  rationale: Cette traduction conserve l’expression hébraïque de rang ou de condition, au lieu de la réduire à une distinction d’âge.
- source_word: מֵבִין
  choice: l’expert
  rationale: Le participe désigne littéralement celui qui comprend, donc une personne compétente ou expérimentée. « Expert » préserve mieux ce sens lexical que « maître », tout en convenant au contraste avec l’élève.
- source_word: עִם תַּלְמִיד
  choice: et l’élève
  rationale: תַּלְמִיד désigne une personne qui apprend. Dans ce cadre de formation musicale, « élève » est idiomatique et évite les connotations religieuses plus marquées de « disciple ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique. La répétition « entre… et…, entre… et… » restitue les deux couples de catégories tout en restant naturelle. Les notes préservent l’idiome hébreu et l’ambiguïté de מֵבִין.
