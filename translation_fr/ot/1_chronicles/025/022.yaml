  text: לַ/חֲמִשָּׁ֤ה עָשָׂר֙ לִֽ/ירֵמ֔וֹת בָּנָ֥י/ו וְ/אֶחָ֖י/ו שְׁנֵ֥ים עָשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/022.yaml
  text: 'For the fifteenth[a], to Jeremoth: his sons and his brothers[b], twelve.'
translation:
  language: fr
  text: 'Le quinzième[a] fut pour Jérémoth : ses fils et ses frères, douze en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Le quinzième, pour Jérémoth. » Le mot « lot » est sous-entendu par la formule répétée dans ce chapitre, mais il ne figure pas ici dans le texte hébreu.'
    reason: cross_reference
lexical_decisions:
- source_word: לַחֲמִשָּׁה עָשָׂר
  choice: Le quinzième
  rationale: Dans la formule répétée de ce chapitre, l’expression a une valeur ordinale et désigne le quinzième lot. Le mot « lot » est sous-entendu par le contexte, mais absent de l’hébreu; il n’est donc pas ajouté au texte principal.
- source_word: לִירֵמוֹת
  choice: fut pour Yerémoth
  rationale: La préposition ל marque ici l’attribution. La tournure « fut pour » rend naturellement cette fonction dans une liste de lots tout en conservant la concision de l’hébreu.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme hébreu désigne précisément les fils, et non les enfants en général.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: C’est le sens direct du nom; selon le contexte, il peut aussi englober des proches parents masculins ou des membres apparentés du groupe, mais « frères » reste la traduction la plus transparente.
- source_word: שְׁנֵים עָשָׂר
  choice: douze en tout
  rationale: Le nombre indique l’effectif total formé par les fils et les frères de Yerémoth. « en tout » explicite naturellement cette fonction sans modifier le nombre.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe elliptique propre à la liste est légèrement développée par « fut » et « en tout » pour être naturelle en français, sans ajouter « lot » au texte principal. Le nom יְרֵמוֹת/יִרֵמוֹת est rendu par « Yerémoth », translittération transparente qui distingue la consonne initiale hébraïque d’un J français.
