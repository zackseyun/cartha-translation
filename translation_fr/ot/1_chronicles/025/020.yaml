lexical_decisions:
- source_word: לִשְׁלֹשָׁה עָשָׂר
  choice: Le treizième
  rationale: Dans cette liste de tirages au sort, le préfixe ל indique l’attribution (« pour le treizième »). La formulation française « Le treizième » restitue naturellement la structure elliptique du registre, sans ajouter « lot », absent de ce verset.
- source_word: שׁוּבָאֵל
  choice: Shoubaël
  rationale: Le nom propre est translittéré selon une forme française claire, avec « ou » pour le son /u/ et un tréma pour signaler que les voyelles finales se prononcent séparément.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme hébreu désigne spécifiquement les fils, et non les enfants en général.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: Le sens lexical direct est « frères »; dans ce contexte d’organisation, le mot peut éventuellement englober des proches masculins, mais cette possibilité ne doit pas remplacer le terme du texte.
- source_word: שְׁנֵים עָשָׂר
  choice: douze
  rationale: Le nombre est conservé dans la formulation nominale et concise de la liste, sans ajouter le verbe « étaient », absent de l’hébreu.
