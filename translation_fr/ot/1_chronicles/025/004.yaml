  text: לְ/הֵימָ֑ן בְּנֵ֣י הֵימָ֡ן בֻּקִּיָּ֡הוּ מַתַּנְיָ֡הוּ עֻ֠זִּיאֵל שְׁבוּאֵ֨ל וִֽ/ירִימ֜וֹת חֲנַנְיָ֣ה חֲנָ֗נִי אֱלִיאָ֤תָה גִדַּ֨לְתִּי֙ וְ/רֹמַ֣מְתִּי עֶ֔זֶר יָשְׁבְּקָ֣שָׁה מַלּ֔וֹתִי הוֹתִ֖יר מַחֲזִיאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/004.yaml
  text: 'To Heman: the sons of Heman: Bukkiah[a], Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir[c][b], Mahazioth.'
translation:
  language: fr
  text: 'Pour Héman : les fils d’Héman : Bukkiyah, Mattanyah, Ouzziel, Shebouel, Yérimoth, Hananyah, Hanani, Éliata, Giddalti[a], Romamti-Ézer, Yoshbekasha, Malloti, Hotir et Mahazioth.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plusieurs de ces noms, notamment « Giddalti » et « Romamti-Ézer », peuvent aussi être compris comme des mots formant une phrase. Dans ce contexte de liste, ils sont traduits comme des noms propres.
    reason: alternative_reading
lexical_decisions:
- source_word: לְ/הֵימָן
  choice: Pour Héman
  rationale: Dans la structure du chapitre, le préfixe לְ introduit le groupe attribué à Héman; « Pour Héman » exprime naturellement cette répartition.
- source_word: בְּנֵי הֵימָן
  choice: les fils d’Héman
  rationale: בְּנֵי désigne ici les fils nommés dans la liste; le sens généalogique direct convient au contexte.
- source_word: שְׁבוּאֵל
  choice: Shebouel
  rationale: Translittération française lisible qui suit les consonnes et la vocalisation du texte massorétique.
- source_word: וִֽ/ירִימוֹת
  choice: Yérimoth
  rationale: Le nom est translittéré d’après la forme hébraïque יְרִימוֹת; la conjonction est rendue par la coordination naturelle de la liste française.
- source_word: גִדַּלְתִּי
  choice: Giddalti
  rationale: Bien que la forme puisse évoquer un verbe, sa place dans cette liste de fils indique qu’elle fonctionne ici comme nom propre.
- source_word: וְ/רֹמַמְתִּי עֶזֶר
  choice: Romamti-Ézer
  rationale: Le contexte de recensement favorise un nom propre composé; le trait d’union rend cette unité transparente en français sans effacer l’autre analyse possible.
theological_decisions:
- issue: Faut-il comprendre plusieurs formes de la seconde moitié du verset comme des noms propres ou comme les éléments d’une phrase porteuse de sens?
  choice: Lire toute la séquence comme une liste de noms propres.
  alternative: Comprendre notamment Giddalti et Romamti-Ézer, avec des formes voisines, comme une phrase telle que « j’ai grandi et élevé le secours… ».
  rationale: Le contexte immédiat recense les fils et les groupes de musiciens. La traduction retient donc la fonction onomastique, tout en signalant en note la réelle possibilité linguistique d’entendre derrière certains noms une suite verbale.
translation_notes:
  register: Français international actuel, sobre et digne. Les noms sont translittérés de façon à rester proches de l’hébreu tout en étant prononçables en français. Le verbe « étaient » clarifie naturellement la construction nominale du registre sans ajouter d’information substantielle.
