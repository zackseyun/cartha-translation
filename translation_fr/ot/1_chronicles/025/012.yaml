  text: הַ/חֲמִישִׁ֣י נְתַנְיָ֔הוּ בָּנָ֥י/ו וְ/אֶחָ֖י/ו שְׁנֵ֥ים עָשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/012.yaml
  text: The fifth was Nethaniah[a]; his sons and his brothers were twelve.
translation:
  language: fr
  text: Le cinquième fut Netaniahou[a] ; ses fils et ses frères étaient douze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, d’après le contexte : « Le cinquième lot revint à Netaniahou ; ses fils et ses frères étaient douze. » L’hébreu omet des mots comme « lot » et « revint à », que l’on déduit de la liste environnante.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: Le cinquième
  rationale: L’adjectif ordinal défini est employé elliptiquement dans cette liste. Le contexte permet de comprendre « le cinquième lot » ou « le cinquième groupe », mais ces noms ne figurent pas dans le verset hébreu.
- source_word: נְתַנְיָהוּ
  choice: Netaniahou
  rationale: Translittération française moderne du nom hébreu, qui en conserve notamment la finale -yahou.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le pluriel masculin de בֵּן avec suffixe de troisième personne du masculin singulier désigne ici ses fils.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: Le sens ordinaire de אָח au pluriel convient à la formule de cette liste ; le sens plus large de « parents » n’est pas requis.
- source_word: שְׁנֵים עָשָׂר
  choice: étaient douze
  rationale: Le nombre cardinal clôt la formule et indique l’effectif du groupe. Le verbe « étaient », absent mais sous-entendu en hébreu, est nécessaire pour une phrase française naturelle.
