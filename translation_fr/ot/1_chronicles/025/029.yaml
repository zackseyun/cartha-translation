lexical_decisions:
- source_word: לִשְׁנַיִם וְעֶשְׂרִים
  choice: Le vingt-deuxième
  rationale: Dans la formule récurrente du chapitre, l’expression indique le rang du tirage au sort. L’ordinal français rend naturellement le nombre, tandis que « lot » demeure implicite comme en hébreu.
- source_word: לְגִדַּלְתִּי
  choice: fut pour Guidalti
  rationale: Le préfixe ל marque ici l’attribution à Guidalti. La tournure « fut pour » restitue naturellement cette valeur dans le contexte d’un tirage au sort.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le nom hébreu désigne précisément les fils, et non les enfants de manière générale.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: Le sens lexical ordinaire est « frères »; le contexte n’impose pas l’élargissement à « parents » ou « membres de sa parenté ».
- source_word: שְׁנֵים עָשָׂר
  choice: douze en tout
  rationale: Le nombre final donne l’effectif total du groupe. « En tout » explicite cette fonction avec naturel sans modifier le contenu numérique.
