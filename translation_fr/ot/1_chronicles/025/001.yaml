source:
  edition: WLC
  text: וַ/יַּבְדֵּ֣ל דָּוִיד֩ וְ/שָׂרֵ֨י הַ/צָּבָ֜א לַ/עֲבֹדָ֗ה לִ/בְנֵ֤י אָסָף֙ וְ/הֵימָ֣ן וִֽ/ידוּת֔וּן ה/נביאים בְּ/כִנֹּר֥וֹת בִּ/נְבָלִ֖ים וּ/בִ/מְצִלְתָּ֑יִם וַֽ/יְהִי֙ מִסְפָּרָ֔/ם אַנְשֵׁ֥י מְלָאכָ֖ה לַ/עֲבֹדָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/001.yaml
  text: 'And David and the commanders of the army set apart for the service the sons of Asaph[a], Heman, and Jeduthun, who prophesied with lyres, harps, and cymbals; and their number, the men for the work of their service[b], was:'
translation:
  language: fr
  text: 'David et les chefs de l’armée mirent à part pour le service les fils d’Asaph, de Héman et de Yedoutoun[a], qui prophétisaient au son des lyres, des harpes et des cymbales[b]. Voici le nombre des hommes chargés du travail de leur service :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « fils » peut aussi désigner des descendants ou les membres des groupes rattachés à Asaph, Héman et Yedoutoun.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction, plus formelle : « les prophètes, avec des lyres, des harpes et des cymbales ». L’hébreu permet de comprendre « les prophètes » comme une apposition aux noms d’Asaph, de Héman et de Yedoutoun.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּבְדֵּל
  choice: mirent à part
  rationale: Le hiphil de בדל exprime ici une mise à part en vue d’une fonction définie. « Mirent à part » est naturel en français et n’ajoute pas l’idée plus précise d’une nomination officielle.
- source_word: שָׂרֵי הַצָּבָא
  choice: les chefs de l’armée
  rationale: שָׂרִים désigne des chefs ou hauts responsables, et צָבָא l’armée ou l’armée organisée. Cette traduction conserve le sens ordinaire de l’expression malgré son emploi dans l’organisation du service du sanctuaire.
- source_word: לַעֲבֹדָה
  choice: pour le service
  rationale: Dans ce contexte cultuel, עֲבֹדָה désigne le service organisé, vraisemblablement celui du sanctuaire.
- source_word: לִבְנֵי אָסָף וְהֵימָן וִידוּתוּן
  choice: les fils d’Asaph, de Héman et de Yedoutoun
  rationale: « Fils » préserve l’expression hébraïque, qui peut désigner aussi bien des fils au sens strict que des descendants ou les membres d’un groupe rattaché à ces chefs.
- source_word: הנביאים
  choice: qui prophétisaient
  rationale: La forme décrit ces hommes dans l’exercice d’une activité prophétique. La proposition relative donne une syntaxe française claire tout en maintenant le lien explicite entre prophétie et musique.
- source_word: בְּכִנֹּרוֹת בִּנְבָלִים וּבִמְצִלְתָּיִם
  choice: au son des lyres, des harpes et des cymbales
  rationale: « Au son de » exprime naturellement en français l’accompagnement instrumental marqué par בְּ. « Lyres », « harpes » et « cymbales » sont des équivalents modernes accessibles qui maintiennent la distinction entre les instruments.
- source_word: וַיְהִי מִסְפָּרָם
  choice: Voici le nombre
  rationale: Cette formule introduit l’énumération des versets suivants. Le deux-points conserve cette fonction prospective.
- source_word: אַנְשֵׁי מְלָאכָה לַעֲבֹדָתָם
  choice: les hommes chargés du travail de leur service
  rationale: La formulation maintient la distinction entre מְלָאכָה, le travail ou la tâche, et עֲבֹדָה, le service, sans transformer explicitement ces hommes en artisans qualifiés.
theological_decisions:
- issue: Rapport de הנביאים avec Asaph, Héman et Yedoutoun et avec le ministère musical
  choice: « qui prophétisaient au son des lyres, des harpes et des cymbales »
  alternative: « les prophètes, avec des lyres, des harpes et des cymbales »
  rationale: La relative exprime idiomatiquement l’activité prophétique associée aux instruments. Une note conserve toutefois la possibilité de comprendre le terme comme une apposition nominale, sans trancher davantage la nature exacte de ce ministère.
translation_notes:
  register: Français international moderne, digne et lisible. Les noms propres suivent des formes françaises reconnaissables; « Yedoutoun » représente plus directement l’initiale hébraïque que « Jedoutoun ». La phrase garde le deux-points final parce que l’énumération se poursuit dans les versets suivants.
