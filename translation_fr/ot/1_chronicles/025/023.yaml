  text: לְ/שִׁשָּׁ֤ה עָשָׂר֙ לַ/חֲנַנְיָ֔הוּ בָּנָ֥י/ו וְ/אֶחָ֖י/ו שְׁנֵ֥ים עָשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/023.yaml
  text: The sixteenth was for Hananyahu[a], his sons and his brothers[b], twelve.
translation:
  language: fr
  text: 'Le seizième revint à Hananiahou[a], à ses fils et à ses frères : douze en tout[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite d’après le contexte : « Le seizième lot revint à Hananiahou. » Le mot « lot » est sous-entendu par les versets environnants, mais il ne figure pas dans l’hébreu de ce verset.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « douze ».'
    reason: translation_clarity
lexical_decisions:
- source_word: לְשִׁשָּׁה עָשָׂר
  choice: Le seizième revint à
  rationale: La préposition לְ associée au nombre ordinal indique ici l’attribution dans la série des lots. « Revint à » donne en français une formulation naturelle sans introduire dans le texte principal le mot « lot », qui reste implicite.
- source_word: לַחֲנַנְיָהוּ
  choice: Hananiahou
  rationale: Cette translittération française restitue de près la forme hébraïque חֲנַנְיָהוּ et sa finale théophore -yahou.
- source_word: בָּנָיו
  choice: ses fils
  rationale: בָּנִים désigne ici les fils dans le cadre de cette liste de groupes masculins.
- source_word: וְאֶחָיו
  choice: et à ses frères
  rationale: אָח signifie directement « frère »; même si le terme peut parfois englober des proches ou des compagnons, le sens direct convient à la formule récurrente du chapitre.
- source_word: שְׁנֵים עָשָׂר
  choice: douze en tout
  rationale: Le nombre final indique l’effectif total du groupe. « En tout » explicite naturellement en français la fonction du nombre, tout en signalant en note que l’hébreu dit seulement « douze ».
theological_decisions: []
translation_notes:
  register: Français international actuel, sobre et adapté au style concis d’une liste. Les deux-points conservent l’effet récapitulatif du nombre final, tandis que « en tout » évite une tournure française heurtée.
