base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/009.yaml
  text: The first lot came out for Asaph[a], for Joseph; Gedaliah the second, he and his brothers and his sons[b], twelve.
translation:
  language: fr
  text: 'Le premier lot tomba[a] pour Asaph, pour Joseph ; le deuxième, pour Guedaliahou : lui, ses frères et ses fils, douze en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Le premier lot sortit pour Asaph, pour Joseph. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: le lot tomba
  rationale: Dans le contexte d’un tirage au sort, « le lot tomba » est l’expression française naturelle. Le verbe hébreu signifie littéralement « sortit », nuance signalée en note.
- source_word: לְאָסָף לְיוֹסֵף
  choice: pour Asaph, pour Joseph
  rationale: La répétition de « pour » reproduit les deux prépositions hébraïques et préserve la relation syntaxique concise, sans décider explicitement si Joseph est présenté comme représentant de la maison d’Asaph.
- source_word: גְּדַלְיָהוּ
  choice: Guedaliahou
  rationale: Cette forme française translittère le nom hébreu en conservant sa terminaison -yahou, plutôt que d’adopter une forme anglicisée.
- source_word: הוּא וְאֶחָיו וּבָנָיו
  choice: lui, ses frères et ses fils
  rationale: Le pronom indépendant est maintenu par « lui », et les termes masculins précis « frères » et « fils » sont conservés.
- source_word: שְׁנֵים עָשָׂר
  choice: douze en tout
  rationale: Le nombre indique l’effectif total du groupe. « En tout » rend cette fonction clairement en français sans ajouter de verbe absent de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et lisible. La construction elliptique du registre est conservée après le point-virgule, tandis que « en tout » clarifie naturellement que le nombre douze correspond à l’ensemble du groupe.
