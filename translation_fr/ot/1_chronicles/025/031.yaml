  text: for the twenty-fourth[a], Romamti-ezer, his sons and his brothers, twelve.
translation:
  language: fr
  text: pour le vingt-quatrième[a], Romamti-Ézer, ses fils et ses frères, douze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour le vingt-quatrième » ; dans toute cette section, cette expression renvoie au vingt-quatrième lot ou groupe.'
    reason: cross_reference
lexical_decisions:
- source_word: לְ/אַרְבָּעָה וְ/עֶשְׂרִים
  choice: pour le vingt-quatrième
  rationale: La préposition לְ indique l’attribution (« pour »), et le nombre cardinal a ici une valeur ordinale déterminée par la série des lots. Le mot « lot » reste implicite dans le texte hébreu et n’est donc pas ajouté au texte principal.
- source_word: לְ/רוֹמַמְתִּי עָזֶר
  choice: Romamti-Ézer
  rationale: Nom propre translittéré en français moderne, avec trait d’union pour représenter l’unité du nom composé.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme hébreu désigne précisément les fils dans cette liste masculine.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: Le sens lexical direct est « ses frères »; une acception élargie comme « parents » ou « compagnons » demeure possible dans ce contexte, mais n’est pas imposée.
- source_word: שְׁנֵים עָשָׂר
  choice: douze
  rationale: Nombre cardinal indiquant l’effectif total du groupe, conformément au schéma de toute la section.
