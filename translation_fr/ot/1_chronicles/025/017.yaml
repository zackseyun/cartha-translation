  rationale: Transcription française usuelle du nom propre hébreu.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme désigne ici les fils dans le cadre de cette liste familiale et musicale.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: Rendu direct du sens ordinaire du terme ; le contexte peut éventuellement inclure des proches ou des membres du même groupe familial, sans qu’il soit nécessaire de le préciser dans le texte.
- source_word: שְׁנֵים עָשָׂר
  choice: douze
  rationale: Nombre cardinal indiquant le total des fils et des frères associés à Shimeï.
