  text: The third was Zaccur[a], his sons and his brothers, twelve.
translation:
  language: fr
  text: 'Le troisième fut Zaccur[a], avec ses fils et ses frères : douze en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le contexte : « Le troisième sort échut à Zaccur ; avec ses fils et ses frères, ils étaient douze. » Le mot « sort » est sous-entendu d’après les versets environnants et n’est pas répété ici en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: Le troisième
  rationale: L’ordinal défini sert de repère dans la série des groupes désignés par tirage au sort. Le nom « sort » reste implicite, comme dans l’hébreu.
- source_word: זַכּוּר
  choice: Zaccur
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le pluriel masculin de בֵּן avec suffixe de troisième personne du masculin singulier désigne précisément « ses fils ».
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: Rend directement le pluriel אַחִים avec suffixe possessif, sans l’élargir inutilement à la parenté.
- source_word: שְׁנֵים עָשָׂר
  choice: douze en tout
  rationale: Indique l’effectif total du groupe. « En tout » explicite naturellement en français la fonction récapitulative du nombre sans ajouter de contenu substantiel.
