  text: for the twentieth[a], Eliathah; his sons and his brothers, twelve.
translation:
  language: fr
  text: 'pour le vingtième[a], Éliatha, ses fils et ses frères : douze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « pour le vingtième lot : Éliatha, ses fils et ses frères, douze ». Le mot « lot » est sous-entendu dans la structure répétitive du chapitre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֶשְׂרִים
  choice: pour le vingtième
  rationale: Dans la liste des lots du chapitre, le ל préfixé marque l’attribution, tandis que עֶשְׂרִים désigne ici le vingtième rang de la série. La formulation concise conserve la structure répétitive de l’hébreu.
- source_word: לֶ/אֱלִיָּתָה
  choice: Éliata
  rationale: Le nom propre est translittéré; le ל préfixé est intégré à la formule d’attribution « pour le vingtième », et le nom se place en apposition.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le pluriel de בֵּן avec suffixe masculin singulier désigne ses descendants masculins dans cette liste.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: « Frères » préserve le sens familial ordinaire de אחים sans l’élargir inutilement à « parents » ou « membres du clan ».
- source_word: שְׁנֵים עָשָׂר
  choice: douze
  rationale: Le nombre cardinal indique l’effectif total du groupe. La tournure nominale avec deux-points reproduit naturellement le style sans verbe de la liste hébraïque.
