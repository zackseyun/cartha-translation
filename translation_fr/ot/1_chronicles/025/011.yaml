lexical_decisions:
- source_word: הָרְבִיעִי
  choice: Le quatrième
  rationale: L’ordinal est employé elliptiquement dans cette liste de groupes désignés par tirage au sort. La formulation concise conserve cette ellipse, tandis que la note explicite le sens contextuel.
- source_word: לַיִּצְרִי
  choice: pour Yitsri
  rationale: Le préfixe ל marque ici l’attribution. « Pour » est naturel en français dans une liste de lots assignés.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme hébreu désigne précisément ses fils et non, de manière générale, ses enfants.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: « Frères » est le sens direct du nom; selon le contexte, il peut aussi englober de proches parents ou des membres associés du groupe, mais rien n’impose ici d’élargir la traduction.
- source_word: שְׁנֵים עָשָׂר
  choice: douze
  rationale: Le nombre indique l’effectif total du groupe. La construction nominale concise reproduit le style du registre hébreu sans ajouter de verbe.
