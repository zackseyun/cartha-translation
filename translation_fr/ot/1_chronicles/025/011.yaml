  text: 'Le quatrième[a] : pour Yitsri, ses fils et ses frères : douze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement d’après le contexte : « Le quatrième lot revint à Yitsri. » Le mot « lot » est sous-entendu dans cette liste, mais il ne figure pas dans ce verset.'
