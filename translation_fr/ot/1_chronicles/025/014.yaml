  text: The seventh fell to Jesharelah[a]; his sons and his brothers were twelve.
translation:
  language: fr
  text: Le septième lot revint à Yesharéla[a] ; ses fils et ses frères étaient douze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Le septième, Yesharéla, ses fils et ses frères, douze » ; les mots « lot revint à » sont ajoutés d’après la formule d’attribution répétée dans les versets voisins.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁבִעִי
  choice: Le septième lot
  rationale: L’ordinal est employé substantivement dans une liste d’attribution par tirage au sort. L’ajout de « lot » explicite naturellement en français ce que le contexte sous-entend.
- source_word: יְשַׂרְאֵלָה
  choice: Yesharéla
  rationale: Le nom propre est translittéré selon une forme adaptée à la lecture française, sans être traduit.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme hébreu désigne spécifiquement ses fils ; la formulation conserve cette précision.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: Le sens ordinaire est « frères », même si, dans ce type de liste, le mot peut éventuellement inclure des proches ou des membres masculins du groupe familial.
- source_word: שְׁנֵים עָשָׂר
  choice: étaient douze
  rationale: Le nombre indique l’effectif total des fils et des frères. L’ajout du verbe donne une phrase française naturelle.
- source_word: '[formule d’attribution sous-entendue]'
  choice: revint à
  rationale: L’hébreu présente une proposition elliptique sans verbe, mais les versets environnants fournissent la formule répétée du tirage au sort. « Revint à » exprime sobrement cette attribution.
