  source_fidelity: La première occurrence de עַל־יְדֵי est bien rendue par « sous la direction de leur père », et la seconde peut désigner l’autorité royale sur Asaph, Jeduthun et Héman. Toutefois, « pour le chant » rend moins bien בַּשִּׁיר, qui situe ces personnes dans l’activité musicale; « dans la musique » restitue plus naturellement ce sens collectif dans ce contexte instrumental et cultuel.
  naturalness: La formulation révisée est fluide en français moderne international. « Dans la musique de la maison de Yahweh » évite l’ambiguïté fonctionnelle de « pour le chant », tout en conservant « maison » plutôt que d’expliciter par « temple ».
