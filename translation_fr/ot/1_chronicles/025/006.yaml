  text: כָּל אֵ֣לֶּה עַל יְדֵי֩ אֲבִי/הֶ֨ם בַּ/שִּׁ֜יר בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ נְבָלִ֣ים וְ/כִנֹּר֔וֹת לַ/עֲבֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים עַ֚ל יְדֵ֣י הַ/מֶּ֔לֶךְ אָסָ֥ף וִ/ידוּת֖וּן וְ/הֵימָֽן־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/006.yaml
  text: 'All these were under the direction of their father in the music of the house of Yahweh[a], with cymbals, harps, and lyres, for the service of the house of God, under the direction of the king: Asaph, Jeduthun[c][b], and Heman.'
translation:
  language: fr
  text: Tous ceux-là étaient sous la direction de leur père dans la musique de la maison de Yahweh, avec des cymbales, des harpes et des lyres[a], pour le service de la maison de Dieu. Asaph, Jeduthun et Héman étaient sous la direction du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte des deux instruments anciens traduits par « harpes » et « lyres » est incertaine.
    reason: cultural_note
lexical_decisions:
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: sous la direction de leur père
  rationale: L’expression idiomatique « sous la main de » marque ici l’autorité et la supervision exercées par chacun des pères sur son groupe.
- source_word: בַּשִּׁיר
  choice: pour le chant
  rationale: Le nom שִׁיר peut désigner le chant, l’action de chanter ou la musique. « Pour le chant » demeure proche de l’hébreu et convient au service musical accompagné d’instruments.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’image hébraïque, tandis que « Yahweh » représente directement le nom divin יהוה.
- source_word: בִּמְצִלְתַּיִם
  choice: avec des cymbales
  rationale: La préposition a ici une valeur instrumentale, et le nom désigne des cymbales employées dans la musique cultuelle.
- source_word: נְבָלִים וְכִנֹּרוֹת
  choice: des luths et des lyres
  rationale: Ces deux termes désignent des instruments anciens à cordes dont les équivalents modernes précis restent incertains. Deux appellations distinctes préservent la distinction du texte source.
- source_word: לַעֲבֹדַת בֵּית הָאֱלֹהִים
  choice: pour le service de la maison de Dieu
  rationale: עֲבֹדָה exprime ici le service cultuel sans nécessiter un vocabulaire ecclésiastique plus tardif.
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: sous la direction du roi
  rationale: La répétition de la même expression idiomatique indique la direction ou l’autorité royale.
- source_word: אָסָף וִידוּתוּן וְהֵימָן
  choice: Asaph, Yedoutoun et Hémân
  rationale: Les noms propres sont translittérés sous des formes françaises reconnaissables; « Yedoutoun » représente plus directement l’initiale hébraïque que « Jeduthun ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin sans le remplacer par un titre.
- issue: Rapport syntaxique de עַל יְדֵי הַמֶּלֶךְ avec les trois noms
  choice: Asaph, Yedoutoun et Hémân étaient sous la direction du roi
  alternative: sous la direction du roi, d’Asaph, de Yedoutoun et de Hémân
  rationale: L’hébreu est compact et peut paraître syntaxiquement tendu. Le contexte immédiat présente Asaph, Yedoutoun et Hémân comme les pères des groupes, placés eux-mêmes sous l’autorité du roi; cette formulation française rend ce rapport sans faire des quatre noms une série de directeurs coordonnés.
translation_notes:
  register: Français moderne, international et digne. La phrase a été divisée en deux pour clarifier la hiérarchie administrative tout en conservant le parallélisme de l’expression « sous la direction de ». Le mot « maison » est maintenu pour préserver l’image hébraïque plutôt que de l’expliciter par « temple ».
