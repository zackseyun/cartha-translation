lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: le sixième
  rationale: L’ordinal défini est elliptique dans cette liste de groupes désignés par tirage au sort. La formulation concise conserve le style hébreu, tandis que la note explicite l’élément sous-entendu.
- source_word: בֻקִּיָּהוּ
  choice: Boukkiahou
  rationale: Le nom propre est translittéré sous une forme qui reflète l’hébreu et se lit naturellement en français.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme hébreu désigne précisément ses fils dans ce contexte généalogique et administratif.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: « Frères » rend directement le sens premier du mot, sans exclure que celui-ci puisse avoir une portée plus large dans ce groupe de musiciens.
- source_word: שְׁנֵים עָשָׂר
  choice: douze
  rationale: Le nombre indique l’effectif total du groupe. Le maintenir en apposition respecte la concision de l’hébreu.
