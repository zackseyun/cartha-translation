lexical_decisions:
- source_word: לְ/אֶחָד וְ/עֶשְׂרִים
  choice: pour le vingt et unième
  rationale: Dans cette série, le ל préfixé indique l’attribution dans l’ordre des lots. « Pour le vingt et unième » rend naturellement cet ordre sans ajouter « lot », terme sous-entendu par le contexte mais absent de ce verset.
- source_word: לְ/הוֹתִיר
  choice: Hotir
  rationale: הוֹתִיר est un nom propre. Le ל préfixé est intégré à la tournure « pour le vingt et unième, Hotir », plutôt que rendu une seconde fois.
- source_word: בָּנָיו
  choice: ses fils
  rationale: בנים désigne ici les fils dans le cadre de cette liste, et non les enfants au sens général.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: Le sens familial direct de אחים est conservé. Même si le mot peut parfois désigner des proches ou des compagnons dans une liste, le contexte n’impose pas ici un élargissement.
- source_word: שְׁנֵים עָשָׂר
  choice: douze
  rationale: Le nombre indique l’effectif total du groupe. La formulation elliptique et concise du texte hébreu est conservée.
