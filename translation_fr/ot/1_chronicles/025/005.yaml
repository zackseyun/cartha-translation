  text: כָּל אֵ֨לֶּה בָנִ֜ים לְ/הֵימָ֗ן חֹזֵ֥ה הַ/מֶּ֛לֶךְ בְּ/דִבְרֵ֥י הָ/אֱלֹהִ֖ים לְ/הָרִ֣ים קָ֑רֶן וַ/יִּתֵּ֨ן הָ/אֱלֹהִ֜ים לְ/הֵימָ֗ן בָּנִ֛ים אַרְבָּעָ֥ה עָשָׂ֖ר וּ/בָנ֥וֹת שָׁלֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/005.yaml
  text: All these were sons of Heman[a], the king’s seer in the words of God, to exalt the horn[b]. And God gave Heman fourteen sons and three daughters.
translation:
  language: fr
  text: Tous ceux-là étaient fils de Hémân, le voyant du roi concernant les paroles de Dieu[a], pour élever la corne[b]. Dieu donna à Hémân quatorze fils et trois filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par les paroles de Dieu » ou « dans les affaires de Dieu ». La formulation hébraïque est condensée et peut décrire de diverses manières le rapport entre la fonction de Hémân et la révélation divine.
    reason: alternative_reading
  - marker: b
    text: Ou « pour relever la corne ». Dans la Bible, la corne est une image de la force, de l’honneur ou d’une position élevée.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹזֵה
  choice: voyant
  rationale: « Voyant » rend directement la fonction de celui qui reçoit une révélation et conserve la nuance prophétique et royale propre au contexte des Chroniques.
- source_word: בְּדִבְרֵי הָאֱלֹהִים
  choice: concernant les paroles de Dieu
  rationale: Cette formulation française reste naturelle tout en conservant le lien entre la fonction de Hémân et la révélation divine. La note signale les autres rapports syntaxiques possibles.
- source_word: לְהָרִים קָרֶן
  choice: pour élever la corne
  rationale: La traduction maintient l’image biblique de la corne élevée, qui peut évoquer la force, l’honneur ou une position exaltée, sans préciser abusivement à qui elle se rapporte.
- source_word: וַיִּתֵּן הָאֱלֹהִים לְהֵימָן
  choice: Dieu donna à Hémân
  rationale: Cette tournure naturelle en français exprime fidèlement que les enfants sont un don accordé par Dieu à Hémân.
- source_word: בָנִים אַרְבָּעָה עָשָׂר וּבָנוֹת שָׁלֹשׁ
  choice: quatorze fils et trois filles
  rationale: La formulation reproduit clairement les nombres et la distinction explicite entre fils et filles.
theological_decisions:
- issue: Rapport entre le voyant du roi et les paroles de Dieu
  choice: Hémân est présenté comme le voyant du roi concernant les paroles de Dieu.
  alternative: Hémân est le voyant du roi « par les paroles de Dieu » ou « dans les affaires de Dieu ».
  rationale: La construction hébraïque est condensée. Le texte principal indique le domaine de son activité révélatrice, tandis que la note préserve les autres relations syntaxiques possibles sans imposer une compréhension doctrinale plus précise.
- issue: Sens de l’élévation de la corne
  choice: Conserver la métaphore de la corne élevée.
  alternative: Interpréter l’expression comme « accroître la force » ou « conférer de l’honneur ».
  rationale: L’hébreu ne réduit pas l’image à une seule notion et ne précise pas explicitement de quelle personne la corne est élevée. Maintenir la métaphore préserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. Le nom Hémân suit la graphie française traditionnelle. La syntaxe reste fluide tout en conservant, avec l’appui des notes, l’ambiguïté de la proposition sur les paroles de Dieu et la métaphore de la corne.
