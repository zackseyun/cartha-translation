  text: For the seventeenth[a], Joshbekashah, his sons and his brothers, twelve.
translation:
  language: fr
  text: 'Le dix-septième lot[a] revint à Yachbeqacha, à ses fils et à ses frères : douze en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour le dix-septième, à Yachbeqacha » ; le mot « lot » est sous-entendu d’après le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשִׁבְעָה עָשָׂר
  choice: Le dix-septième lot
  rationale: Dans cette liste, l’expression ordinale précédée de לְ indique le rang attribué par tirage au sort. Le mot « lot », sous-entendu en hébreu d’après le contexte, est explicité pour produire une phrase française claire.
- source_word: לְיָשְׁבְּקָשָׁה
  choice: revint à Yochbekacha
  rationale: Le לְ marque ici le bénéficiaire de l’attribution. « Revint à » exprime naturellement en français le résultat du tirage au sort.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme désigne spécifiquement les fils dans ce registre masculin.
- source_word: וְאֶחָיו
  choice: et à ses frères
  rationale: Le sens direct est « frères »; la possibilité plus large de proches parents masculins n’est pas imposée au texte.
- source_word: שְׁנֵים עָשָׂר
  choice: douze en tout
  rationale: Le nombre cardinal indique l’effectif total du groupe; « en tout » rend cette fonction explicite et naturelle en français.
