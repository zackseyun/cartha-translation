- source_word: יְשַׁעְיָהוּ
  choice: Ésaïe
  rationale: Forme française traditionnelle et courante de ce nom biblique dans ce contexte.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme hébreu désigne ici les fils, et non les enfants au sens générique.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: Le sens familial direct de אחים convient à la formule de cette liste; rien n’impose ici le sens élargi de proches ou de compagnons.
- source_word: שְׁנֵים עָשָׂר
  choice: douze
  rationale: Le nombre indique l’effectif total du groupe. L’hébreu n’exprime aucun verbe; la formulation nominale concise préserve le style de la liste.
