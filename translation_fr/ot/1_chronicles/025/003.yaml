base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/003.yaml
  text: 'Of Jeduthun: the sons of Jeduthun—Gedaliah, Zeri, Jeshaiah, Hashabiah, and Mattithiah, six—under the direction of their father Jeduthun, who prophesied with the lyre in giving thanks and praise to Yahweh.'
translation:
  language: fr
  text: 'De Yedoutoun : les fils de Yedoutoun — Guedalia, Tseri, Ésaïe, Hashabia et Mattithia, soit six[a] — étaient sous la direction de leur père Yedoutoun, qui prophétisait avec la lyre, en rendant grâce et en louant Yahvé[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu donne ici cinq noms, puis indique « six ». Certains pensent qu’un autre fils a été omis de la liste ou que Yedoutoun lui-même est compté.
    reason: textual_variant
  - marker: b
    text: 'Autre traduction possible : « qui prophétisait avec la lyre pour rendre grâce et louer Yahvé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִידוּתוּן
  choice: De Yedoutoun
  rationale: Le préfixe ל introduit ici la section consacrée au groupe de Yedoutoun. « De Yedoutoun » convient au style de catalogue du chapitre.
- source_word: בְּנֵי יְדוּתוּן
  choice: les fils de Yedoutoun
  rationale: La formulation familiale de l’hébreu est conservée; dans ce contexte, elle peut désigner les membres de sa maison ou de sa lignée affectés au service musical.
- source_word: גְּדַלְיָהוּ וּצְרִי וִישַׁעְיָהוּ חֲשַׁבְיָהוּ וּמַתִּתְיָהוּ
  choice: Guedalia, Tseri, Ésaïe, Hashabia et Mattitia
  rationale: Les noms sont transcrits selon des formes françaises usuelles et immédiatement lisibles.
- source_word: שִׁשָּׁה
  choice: soit six
  rationale: Le nombre explicite du texte massorétique est maintenu, sans corriger la discordance avec les cinq noms énumérés.
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: sous la direction de leur père
  rationale: L’expression idiomatique évoque ici l’autorité et la supervision exercées dans le cadre du service musical.
- source_word: בַּכִּנּוֹר
  choice: au son de la lyre
  rationale: כִּנּוֹר désigne vraisemblablement une lyre antique. Cette tournure française exprime naturellement l’accompagnement instrumental.
- source_word: הַנִּבָּא
  choice: qui prophétisait
  rationale: Le sens prophétique ordinaire du participe niphal de נבא est conservé, sans le réduire à une simple prestation musicale.
- source_word: עַל הֹדוֹת וְהַלֵּל
  choice: en rendant grâce et en adressant des louanges
  rationale: La formulation exprime naturellement le contenu ou la finalité de cette activité prophétique et musicale, tout en distinguant les deux termes hébreux.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: Le nom divin est rendu par sa forme française courante « Yahvé », plutôt que remplacé par un titre.
theological_decisions:
- issue: Sens de la prophétie musicale dans le culte
  choice: Conserver « prophétisait » dans le texte principal.
  alternative: « exécutait une musique inspirée » ou « chantait sous l’inspiration »
  rationale: Le Chroniste emploie explicitement le vocabulaire de la prophétie pour les musiciens du sanctuaire. La traduction maintient cette catégorie et la tension théologique du texte, tandis que le contexte précise qu’elle s’exerce avec la lyre, dans l’action de grâce et la louange.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe explicite le verbe sous-entendu dans cette entrée de catalogue. Les termes « prophétisait », « lyre », « rendre grâce » et « louanges » préservent le registre cultuel sans archaïsme excessif.
