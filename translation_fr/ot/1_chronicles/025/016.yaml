  text: The ninth was Mattanyahu[a], his sons and his brothers, twelve.
translation:
  language: fr
  text: 'Le neuvième fut Mattanyahou[a], avec ses fils et ses frères : douze en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Mattanyahou ; ce nom est traditionnellement rendu par « Matthania » dans de nombreuses traductions.'
