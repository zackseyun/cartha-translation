lexical_decisions:
- source_word: הַתְּשִׁיעִי
  choice: Le neuvième fut
  rationale: L’adjectif ordinal défini est employé elliptiquement dans la liste des groupes désignés par tirage au sort. « Fut » explicite en français la copule sous-entendue sans ajouter « lot », absent du texte.
- source_word: מַתַּנְיָהוּ
  choice: Mattanyahou
  rationale: Cette translittération française reproduit directement la forme hébraïque du nom, notamment sa finale -yahu.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme hébreu désigne spécifiquement les fils dans cette liste familiale et cultuelle.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: « Frères » conserve le sens lexical premier, tout en laissant ouverte la possibilité contextuelle de proches appartenant au même groupe.
- source_word: שְׁנֵים עָשָׂר
  choice: douze en tout
  rationale: Le nombre indique le total formé par les fils et les frères du responsable nommé. « En tout » rend cette fonction de totalisation de manière naturelle en français.
