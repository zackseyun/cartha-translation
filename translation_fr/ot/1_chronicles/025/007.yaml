  text: וַ/יְהִ֤י מִסְפָּרָ/ם֙ עִם אֲחֵי/הֶ֔ם מְלֻמְּדֵי שִׁ֖יר לַ/יהוָ֑ה כָּל הַ֨/מֵּבִ֔ין מָאתַ֖יִם שְׁמוֹנִ֥ים וּ/שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/007.yaml
  text: Their number[a], together with their brothers who were trained in singing to Yahweh, all who were skillful[b], was two hundred eighty-eight.
translation:
  language: fr
  text: Leur nombre, avec leurs frères qui étaient formés au chant pour Yahweh[a], tous ceux qui étaient compétents[b], était de deux cent quatre-vingt-huit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au chant adressé à Yahweh ». La préposition hébraïque peut indiquer le but du service musical ou la destination du chant.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tous ceux qui comprenaient »; dans ce contexte, il s’agit de personnes compétentes ou expertes dans le travail musical.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפָּרָם
  choice: leur nombre
  rationale: Le nom avec suffixe désigne le total de ces hommes; « leur nombre » est fidèle et naturel en français.
- source_word: עִם אֲחֵיהֶם
  choice: avec leurs frères
  rationale: עִם exprime l’accompagnement, et אֲחֵיהֶם signifie littéralement « leurs frères » dans ce contexte de service lévitique masculin.
- source_word: מְלֻמְּדֵי שִׁיר
  choice: qui avaient été formés au chant
  rationale: Le participe passif de למד indique un apprentissage ou une formation reçue; שִׁיר désigne ici le chant.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל peut marquer la destination ou le but du service musical; « pour Yahweh » reste naturel tout en laissant ouverte la nuance d’un chant qui lui est adressé.
- source_word: כָּל הַמֵּבִין
  choice: tous ceux qui étaient compétents
  rationale: Dans ce contexte musical, le participe de בין renvoie à la compréhension exercée comme savoir-faire ou expertise, et non à la seule compréhension intellectuelle.
- source_word: מָאתַיִם שְׁמוֹנִים וּשְׁמוֹנָה
  choice: deux cent quatre-vingt-huit
  rationale: La suite des nombres hébreux donne directement 288; le nombre est écrit en toutes lettres selon un style biblique courant.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre sans remplacer celui-ci par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve l’énumération hébraïque tout en précisant les liens entre les groupes. Le nom divin est translittéré « Yahweh ».
