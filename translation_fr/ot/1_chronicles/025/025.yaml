    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמוֹנָה עָשָׂר
  choice: Le dix-huitième
  rationale: Dans cette liste, le préfixe ל marque l’attribution du dix-huitième rang ou lot. « Le dix-huitième » conserve la formulation elliptique de l’hébreu sans ajouter dans le texte le mot « lot », seulement implicite dans le contexte.
- source_word: לַחֲנָנִי
  choice: fut pour Hanani
  rationale: Le préfixe ל exprime ici l’attribution à Hanani. Le nom propre est translittéré selon l’usage français.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme hébreu désigne précisément ses fils et préserve la structure familiale de la liste.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: Le sens direct est « ses frères » ; rien dans ce contexte n’impose le sens élargi de parents ou de compagnons.
- source_word: שְׁנֵים עָשָׂר
  choice: douze en tout
  rationale: Le nombre indique l’effectif total du groupe. « En tout » rend cette fonction de manière naturelle en français sans modifier le nombre.
