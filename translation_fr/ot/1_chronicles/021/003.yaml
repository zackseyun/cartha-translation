  text: וַ/יֹּ֣אמֶר יוֹאָ֗ב יוֹסֵף֩ יְהוָ֨ה עַל עַמּ֤/וֹ כָּ/הֵם֙ מֵאָ֣ה פְעָמִ֔ים הֲ/לֹא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֻּלָּ֥/ם לַ/אדֹנִ֖/י לַ/עֲבָדִ֑ים לָ֣/מָּה יְבַקֵּ֥שׁ זֹאת֙ אֲדֹנִ֔/י לָ֛/מָּה יִהְיֶ֥ה לְ/אַשְׁמָ֖ה לְ/יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/003.yaml
  text: But Joab said[a], “May Yahweh add to his people a hundred times as many as they are! Are they not all, my lord the king[c][b], servants of my lord? Why does my lord seek this? Why should it become guilt for Israel?”
translation:
  language: fr
  text: 'Mais Joab dit : « Que Yahweh ajoute à son peuple cent fois leur nombre actuel ! Mon seigneur le roi, ne sont-ils pas tous les serviteurs[a] de mon seigneur ? Pourquoi mon seigneur demande-t-il cela ? Pourquoi Israël en porterait-il la culpabilité[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « esclaves ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme peut désigner une culpabilité ou une responsabilité exposant Israël aux conséquences de cet acte.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹסֵף
  choice: Que ... rende ... plus nombreux
  rationale: Le jussif exprime ici un souhait ou une prière. La tournure « Que Yahweh... » en restitue naturellement la valeur optative en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte directement le nom divin יהוה ; « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- source_word: עַל עַמּוֹ כָּהֵם מֵאָה פְעָמִים
  choice: rende son peuple cent fois plus nombreux qu’il ne l’est
  rationale: Cette formulation française exprime clairement l’idée idiomatique d’une multiplication par rapport à l’effectif présent, sans reproduire maladroitement l’ordre des mots hébreu.
- source_word: הֲלֹא
  choice: ne sont-ils pas
  rationale: La question négative est rhétorique et appelle une réponse affirmative.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Ô roi mon seigneur
  rationale: Cette apostrophe conserve le respect de l’adresse de cour tout en suivant un ordre naturel en français.
- source_word: כֻּלָּם לַאדֹנִי לַעֲבָדִים
  choice: ne sont-ils pas tous les serviteurs de mon seigneur ?
  rationale: « Serviteurs » convient au contexte d’autorité royale et de sujétion politique ; une note conserve le sens plus fort possible d’עֲבָדִים.
- source_word: יְבַקֵּשׁ זֹאת
  choice: demande-t-il cela
  rationale: בקש peut signifier chercher, demander ou réclamer. Dans ce contexte, Joab met en cause la demande du recensement ; « demander » est naturel sans en préciser excessivement la nuance.
- source_word: יִהְיֶה לְאַשְׁמָה לְיִשְׂרָאֵל
  choice: cela rendrait-il Israël coupable
  rationale: La construction désigne une culpabilité ou responsabilité qui atteindrait Israël à cause de cette action, et non une offrande pour la culpabilité.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le tétragramme comme nom propre. La translittération préserve cette fonction et évite de remplacer le nom par un titre.
- issue: Statut exprimé par עֲבָדִים
  choice: serviteurs
  alternative: esclaves
  rationale: Dans cette adresse au roi, le mot souligne surtout la soumission de l’ensemble du peuple à l’autorité royale. « Esclaves » demeure lexicalement possible et est signalé en note.
- issue: Sens de אַשְׁמָה
  choice: culpabilité d’Israël
  alternative: responsabilité entraînant une sanction pour Israël
  rationale: Le contexte vise la faute ou la responsabilité résultant du recensement. La traduction ne réduit pas le terme à un sacrifice de réparation et la note maintient la dimension possible de responsabilité exposant à des conséquences.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. L’adresse « Ô roi mon seigneur » garde la déférence de cour sans archaïsme excessif. Les répétitions de « mon seigneur », présentes dans l’hébreu, sont conservées pour respecter l’insistance de Joab.
