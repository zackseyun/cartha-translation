base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/004.yaml
  text: But the king’s word prevailed against Joab[a]. So Joab went out and went throughout all Israel[b], and he came to Jerusalem.
translation:
  language: fr
  text: Mais la parole du roi l’emporta sur Joab[a]. Joab partit donc, parcourut tout Israël[b], et arriva à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ordre du roi s’imposa à Joab ».
    reason: lexical_alternative
  - marker: b
    text: Ou « voyagea à travers tout Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבַר הַמֶּלֶךְ
  choice: Mais la parole du roi
  rationale: « Parole » conserve l’expression hébraïque, qui désigne ici la directive autoritaire du roi. « Mais » marque le contraste avec l’objection de Joab au verset précédent.
- source_word: חָזַק עַל
  choice: l’emporta sur Joab
  rationale: L’expression signifie littéralement « fut forte sur/contre » et indique que la décision royale a eu raison de la résistance de Joab. « L’emporta sur » est naturel en français tout en conservant l’image de prédominance.
- source_word: וַיֵּצֵא יוֹאָב
  choice: Joab partit donc
  rationale: Le verbe יָצָא signifie ordinairement « sortir ». Dans ce contexte de déplacement, « partit » est plus naturel en français, et « donc » exprime la conséquence narrative.
- source_word: וַיִּתְהַלֵּךְ בְּכָל יִשְׂרָאֵל
  choice: parcourut tout Israël
  rationale: La forme hitpael de הָלַךְ évoque ici le fait de circuler ou de voyager à travers le territoire. « Parcourut » rend ce mouvement étendu avec concision, sans ajouter les détails implicites du recensement.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Rendu direct de l’expression qui indique l’étendue nationale complète du déplacement.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: puis revint à Jérusalem
  rationale: Le verbe בּוֹא signifie littéralement « venir/arriver ». Le contexte du voyage rend « revint » naturel en français, mais une note conserve la formulation plus stricte « arriva ».
