revisions:
- from: 'Mais le roi David dit à Ornan : « Non ! Je l’achèterai bel et bien à son prix intégral, car je ne prendrai pas pour Yahweh ce qui t’appartient, et je n’offrirai pas gratuitement un holocauste.[a] »'
  to: 'Mais le roi David dit à Ornan : « Non, car je l’achèterai assurément en payant le prix complet en argent ; je ne prendrai pas pour Yahweh ce qui t’appartient, et je n’offrirai pas non plus un holocauste sans rien payer. »'
  rationale: La révision rétablit explicitement « en argent », conserve l’emphase de l’achat et le nom Yahweh, et rend plus nettement en français l’idée qu’un holocauste ne doit pas être offert sans coût pour David. La note maintient l’ambiguïté syntaxique possible du texte hébreu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:20:40Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, y compris le refus emphatique, l’achat effectif et le refus d’employer le bien d’Ornan pour Yahweh. Toutefois, « à son prix intégral » ne rend pas explicitement בְּכֶסֶף (« en argent »), élément présent dans le texte source. La coordination de « prendre » et « offrir » est défendable; la note préserve utilement l’autre analyse syntaxique possible.
  naturalness: Le français est globalement clair et moderne. « en payant le prix complet en argent » est plus idiomatique et plus exact que « à son prix intégral ». « Je n’offrirai pas gratuitement un holocauste » est grammatical, mais « je n’offrirai pas non plus un holocauste sans rien payer » exprime plus naturellement, dans ce contexte, le coût assumé par David.
  terminology: « Yahweh » correspond au nom divin explicite. « Holocauste » est un terme cultuel français établi et précis pour עֹלָה. « Bel et bien » restitue l’insistance de l’infinitif absolu, mais « assurément » convient mieux au registre narratif solennel tout en conservant l’emphase.
  issues:
  - severity: medium
    issue: Omission de la mention de l’argent dans le prix d’achat
    rationale: בְּכֶסֶף מָלֵא signifie littéralement un paiement complet « en argent / en silver ». « à son prix intégral » transmet l’idée de totalité, mais omet le moyen de paiement explicitement mentionné.
  - severity: low
    issue: Formulation française de l’offrande « gratuitement »
    rationale: Elle est possible, mais peut laisser entendre que l’acte cultuel est offert gratuitement à Yahweh. La formulation « sans rien payer » situe plus clairement le refus de David d’offrir un sacrifice ne lui coûtant rien, sans ajouter une interprétation doctrinale.
  revised_text: 'Mais le roi David dit à Ornan : « Non, car je l’achèterai assurément en payant le prix complet en argent ; je ne prendrai pas pour Yahweh ce qui t’appartient, et je n’offrirai pas non plus un holocauste sans rien payer. »'
  revised_footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « je ne prendrai pas pour Yahweh ce qui t’appartient et [ne] ferai monter un holocauste pour rien ». La construction infinitive peut aussi rattacher plus étroitement l’offrande au fait de prendre le bien d’Ornan : « ... ce qui t’appartient pour offrir un holocauste sans rien payer ».'
    reason: 'La portée syntaxique de l’infinitif hébreu וְהַעֲלוֹת est discutée : il peut poursuivre le refus comme action coordonnée ou exprimer plus étroitement le but lié à la prise du bien.'
  revision_rationale: La révision rétablit explicitement « en argent », conserve l’emphase de l’achat et le nom Yahweh, et rend plus nettement en français l’idée qu’un holocauste ne doit pas être offert sans coût pour David. La note maintient l’ambiguïté syntaxique possible du texte hébreu.
