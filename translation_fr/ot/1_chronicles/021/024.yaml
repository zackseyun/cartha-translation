  text: וַ/יֹּ֨אמֶר הַ/מֶּ֤לֶךְ דָּוִיד֙ לְ/אָרְנָ֔ן לֹ֕א כִּֽי קָנֹ֥ה אֶקְנֶ֖ה בְּ/כֶ֣סֶף מָלֵ֑א כִּ֠י לֹא אֶשָּׂ֤א אֲשֶׁר לְ/ךָ֙ לַ/יהוָ֔ה וְ/הַעֲל֥וֹת עוֹלָ֖ה חִנָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/024.yaml
  text: But King David said to Ornan[a], “No, for I will surely buy it for the full price in silver, because I will not take for Yahweh what is yours[b], nor offer up a burnt offering for nothing.”
translation:
  language: fr
  text: 'Mais le roi David dit à Ornan : « Non, car je l’achèterai assurément en payant le prix complet en argent ; je ne prendrai pas pour Yahweh ce qui t’appartient, et je n’offrirai pas non plus un holocauste sans rien payer. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כִּי
  choice: Non ! … car
  rationale: La tournure exprime d’abord un refus ferme, puis en donne la raison. Cette formulation conserve ces deux fonctions dans un français naturel.
- source_word: קָנֹה אֶקְנֶה
  choice: Je l’achèterai bel et bien
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’engagement de David. « bel et bien » restitue cette insistance sans alourdir la phrase.
- source_word: בְּכֶסֶף מָלֵא
  choice: à son prix intégral
  rationale: L’expression désigne un paiement complet en argent, par opposition à un don ou à un prix symbolique. En français moderne, « prix intégral » transmet naturellement l’idée principale.
- source_word: אֶשָּׂא אֲשֶׁר לְךָ
  choice: je ne prendrai pas … ce qui t’appartient
  rationale: Dans ce contexte, נשׂא signifie prendre ou s’approprier un bien. Le relatif possessif est rendu explicitement et simplement.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition marque ici la destination cultuelle du bien. Le nom divin יהוה est transcrit « Yahweh ».
- source_word: וְהַעֲלוֹת עוֹלָה
  choice: et je n’offrirai pas … un holocauste
  rationale: Le verbe et le nom apparentés désignent l’action de faire monter sur l’autel une offrande entièrement consumée. « Offrir un holocauste » est le terme cultuel français clair et établi.
- source_word: חִנָּם
  choice: gratuitement
  rationale: L’adverbe signifie ici « sans payer, sans qu’il en coûte rien ». « gratuitement » conserve directement le contraste avec le paiement intégral.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. La transcription « Yahweh » préserve le caractère de nom propre sans introduire une paraphrase confessionnelle.
- issue: Lien syntaxique entre la prise du bien et l’offrande
  choice: 'deux refus coordonnés : ne pas prendre le bien d’Ornan et ne pas offrir gratuitement'
  alternative: 'un seul refus développé par un infinitif de but : ne pas prendre le bien d’Ornan pour offrir gratuitement un holocauste'
  rationale: L’infinitif introduit par וְ peut prolonger la négation sous la forme d’une action coordonnée, lecture cohérente avec le parallélisme du propos. La construction hébraïque permet toutefois de rattacher plus étroitement l’offrande à la prise ; cette possibilité est signalée en note.
translation_notes:
  register: Français moderne, digne et directement compréhensible. L’exclamation rend la fermeté du refus ; « bel et bien » restitue l’emphase hébraïque. Le vocabulaire sacrificiel « holocauste » est conservé pour sa précision, tandis que la syntaxe générale reste fluide.
