reference: 1 Chronicles 21:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא בִּ/רְא֤וֹת דָּוִיד֙ כִּי עָנָ֣/הוּ יְהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֣ן הַ/יְבוּסִ֑י וַ/יִּזְבַּ֖ח שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/028.yaml
  text: At that time[a], when David saw that Yahweh had answered him at the threshing floor of Ornan the Jebusite, he sacrificed there.
translation:
  language: fr
  text: En ce temps-là, lorsque David vit que Yahvé lui avait répondu[a] sur l’aire de battage d’Ornan le Jébusite, il y offrit un sacrifice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’avait exaucé ». Dans ce contexte, le verbe hébreu peut désigner la réponse de Dieu, notamment à une prière ou à un sacrifice.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: En ce temps-là
  rationale: Expression temporelle française courante qui maintient le lien narratif sans imposer l’idée d’un instant précis.
- source_word: בִּרְאוֹת דָּוִיד
  choice: lorsque David vit
  rationale: L’infinitif construit précédé de ב exprime ici une circonstance temporelle; cette proposition est naturelle en français.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce que David constata, sans transformer explicitement le rapport en lien causal.
- source_word: עָנָהוּ
  choice: lui avait répondu
  rationale: Le verbe ענה signifie répondre; le plus-que-parfait indique naturellement que la réponse divine était déjà manifeste lorsque David la constata.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est rendu comme nom propre, selon sa forme française courante, plutôt que remplacé par un titre.
- source_word: בְּגֹרֶן
  choice: sur l’aire de battage
  rationale: גֹּרֶן désigne l’aire où l’on bat les céréales; « sur » convient à cet espace ouvert et maintient la localisation.
- source_word: אָרְנָן הַיְבוּסִי
  choice: Ornan le Jébusite
  rationale: Le nom propre est translittéré et le gentilé est rendu sous sa forme française traditionnelle et intelligible.
- source_word: וַיִּזְבַּח
  choice: il y offrit un sacrifice
  rationale: Le verbe זבח désigne l’action sacrificielle. Cette formulation française explicite naturellement l’acte sans préciser le type d’offrande.
- source_word: שָׁם
  choice: y
  rationale: Le pronom adverbial reprend avec concision et naturel le lieu qui vient d’être mentionné.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin. Le conserver comme nom propre évite de lui substituer le titre אֲדֹנָי et préserve la distinction lexicale du texte source.
- issue: Nature de la réponse divine
  choice: lui avait répondu
  alternative: l’avait exaucé
  rationale: « Répondu » conserve la portée générale de ענה. « Exaucé » exprimerait plus précisément une réponse favorable à une prière, ce que le contexte suggère, mais que le verbe seul ne rend pas obligatoire.
translation_notes:
  register: Français moderne, digne et narratif. La phrase suit de près l’enchaînement hébreu tout en employant une syntaxe française fluide. Le marqueur de note est placé après « répondu », le mot auquel la variante se rapporte.
