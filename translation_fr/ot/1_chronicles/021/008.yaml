  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִיד֙ אֶל הָ֣/אֱלֹהִ֔ים חָטָ֣אתִֽי מְאֹ֔ד אֲשֶׁ֥ר עָשִׂ֖יתִי אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/עַתָּ֗ה הַֽעֲבֶר נָא֙ אֶת עֲו֣וֹן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/008.yaml
  text: Then David said to God[a], “I have sinned greatly in doing this thing. But now, please take away the guilt of your servant, for I have acted very foolishly.”
translation:
  language: fr
  text: 'David dit alors à Dieu : « J’ai gravement péché en faisant cela. Maintenant, je t’en prie, enlève la faute de ton serviteur[a], car j’ai agi de manière tout à fait insensée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner la culpabilité ou les conséquences qui découlent de la faute.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait avancer le récit ; « alors » exprime naturellement cette succession en français.
- source_word: אֶל הָאֱלֹהִים
  choice: à Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne le Dieu d’Israël ; « à Dieu » est la formulation française idiomatique.
- source_word: חָטָאתִי מְאֹד
  choice: J’ai gravement péché
  rationale: Le passé composé convient à la confession d’un acte accompli dont les effets demeurent, et « gravement » rend l’intensif מְאֹד avec dignité.
- source_word: אֲשֶׁר עָשִׂיתִי אֶת הַדָּבָר הַזֶּה
  choice: en faisant cela
  rationale: Cette formulation relie directement le péché à l’acte précis sans alourdir le français par le calque « cette chose ».
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Le terme marque le passage de la confession à la demande ; le contexte suffit à faire sentir cette transition sans ajouter une opposition trop forte.
- source_word: הַעֲבֶר נָא
  choice: je t’en prie, enlève
  rationale: L’impératif causatif exprime l’éloignement ou la suppression, tandis que נָא donne à la demande son caractère suppliant.
- source_word: עֲוֹן
  choice: la faute
  rationale: « Faute » conserve ici une certaine amplitude entre l’acte mauvais et la culpabilité qui en résulte ; une note signale les autres nuances possibles.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Il s’agit d’une autodésignation respectueuse devant Dieu, plutôt que d’une insistance sur un statut d’esclave.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée à l’appui de la supplication.
- source_word: נִסְכַּלְתִּי מְאֹד
  choice: j’ai agi de manière tout à fait insensée
  rationale: La formulation garde la valeur active du verbe — David qualifie sa conduite — et rend l’intensité de מְאֹד dans un registre actuel et digne.
theological_decisions:
- issue: Portée de עָוֹן dans la supplication de David
  choice: « la faute », avec une note indiquant la culpabilité et ses conséquences possibles
  alternative: « la culpabilité » ou « la peine due à la faute »
  rationale: Le mot hébreu peut désigner l’acte mauvais, la culpabilité ou la charge qui en découle. « Faute » convient à la confession sans réduire le terme à la seule peine, et la note préserve son étendue sémantique.
translation_notes:
  register: Français international moderne, naturel et digne. La confession reste solennelle sans archaïsmes ; la supplication est explicite, et l’ambiguïté de עָוֹן est conservée dans la note.
