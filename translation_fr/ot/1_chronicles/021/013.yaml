source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר דָּוִ֛יד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד אֶפְּלָה נָּ֣א בְ/יַד יְהוָ֗ה כִּֽי רַבִּ֤ים רַחֲמָי/ו֙ מְאֹ֔ד וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/013.yaml
  text: Then David said to Gad[a], “I am in great distress. Please let me fall into the hand of Yahweh, for his mercies are very great; but do not let me fall into the hand of man.”
translation:
  language: fr
  text: 'David dit alors à Gad : « Je suis dans une très grande détresse. Je t’en prie, que je tombe entre les mains de Yahweh, car sa compassion est immense ; mais que je ne tombe pas entre les mains des humains[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la main de l’humain » ; cette expression contraste le pouvoir humain avec la main de Yahweh.'
    reason: La note signale le singulier et l’image exacts de l’hébreu, rendus dans le texte par l’expression française idiomatique « entre les mains des humains ».
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: Je suis dans une très grande détresse
  rationale: Cette tournure naturelle en français exprime l’angoisse profonde et la situation sans issue évoquées par l’idiome hébreu.
- source_word: אֶפְּלָה נָּא
  choice: Ah ! Que je tombe
  rationale: Le cohortatif accompagné de נָא exprime ici un souhait pressant et suppliant. « Ah ! Que je tombe » en restitue la force sans ajouter un agent absent de l’hébreu.
- source_word: בְיַד יְהוָה
  choice: entre les mains de Yahweh
  rationale: L’expression désigne le fait d’être livré au pouvoir ou au jugement de quelqu’un. Le pluriel idiomatique français conserve l’image de la main tout en restant naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin présent dans le texte hébreu.
- source_word: כִּי רַבִּים רַחֲמָיו מְאֹד
  choice: car sa compassion est immense
  rationale: Le pluriel hébreu רַחֲמִים peut désigner la compassion profonde de Dieu. Le singulier collectif est idiomatique en français, tandis qu’« immense » rend l’intensification de רַבִּים מְאֹד.
- source_word: וּבְיַד אָדָם
  choice: mais que je ne tombe entre les mains des humains
  rationale: « Les humains » rend le sens générique de אָדָם et marque clairement l’opposition entre le jugement divin et le pouvoir humain. Le pluriel « mains » est l’expression française naturelle.
- source_word: אַל אֶפֹּל
  choice: que je ne tombe pas
  rationale: Cette formulation rend directement la demande négative à la première personne et maintient le parallélisme avec « que je tombe ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom propre divin ; « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Rendu de אָדָם en contraste avec Yahweh
  choice: les humains
  alternative: l’homme
  rationale: Dans ce contexte, אָדָם désigne l’être humain en tant qu’agent de jugement, non un homme particulier. « Les humains » préserve le contraste théologique entre le pouvoir divin et le pouvoir humain sans suggérer un individu masculin précis.
- issue: Nombre grammatical de רַחֲמָיו
  choice: sa compassion
  alternative: ses compassions / ses bontés
  rationale: Le pluriel hébreu intensif ou abstrait ne se transpose pas naturellement par « compassions » en français courant. « Sa compassion est immense » conserve le sens et l’intensité sans imposer une distinction théologique absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La construction exclamative exprime l’urgence de la supplication de David. Le parallélisme des deux occurrences de « tomber entre les mains » et la tension entre compassion divine et pouvoir humain sont conservés.
