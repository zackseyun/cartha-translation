  to: 'Ornan dit à David : « Prends-le pour toi, et que mon seigneur le roi fasse ce qui lui paraît bon.[a] Voici, je donne le bétail pour les holocaustes, les traîneaux de dépiquage pour le feu,[b] et le blé pour l’offrande de céréales.[c] Je donne tout. »'
