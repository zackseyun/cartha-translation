base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/023.yaml
  text: And Ornan said to David, “Take it for yourself, and let my lord the king do what is good in his eyes. See, I have given the cattle for burnt offerings, the threshing sledges for wood, and the wheat for the grain offering. I have given it all.”
translation:
  language: fr
  text: 'Ornan dit à David : « Prends-le pour toi, et que mon seigneur le roi fasse ce qui lui paraît bon.[a] Voici, je donne le bétail pour les holocaustes, les traîneaux de dépiquage pour le feu,[b] et le blé pour l’offrande de céréales.[c] Je donne tout. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fasse ce qui est bon à ses yeux ».'
    reason: lexical_alternative
  - marker: b
    text: Ces instruments de dépiquage doivent servir de combustible pour le sacrifice.
    reason: cultural_note
  - marker: c
    text: Ou « l’offrande ». Dans un contexte sacrificiel, le terme hébreu désigne couramment une offrande de produits céréaliers.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לָךְ
  choice: Prends-le pour toi
  rationale: L’impératif avec לָךְ marque l’appropriation personnelle. Le pronom « le » reprend naturellement le bien proposé dans le contexte immédiat.
- source_word: וְיַעַשׂ אֲדֹנִי הַמֶּלֶךְ הַטּוֹב בְּעֵינָיו
  choice: et que mon seigneur le roi fasse ce qui lui paraît bon
  rationale: Cette formulation française rend naturellement l’idiome hébreu littéral « ce qui est bon à ses yeux », qui exprime ici la liberté d’agir selon son jugement.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Il s’agit d’une formule de respect adressée à David, et non d’un titre divin.
- source_word: רְאֵה
  choice: Vois
  rationale: L’impératif attire l’attention sur l’offre qu’Ornan détaille; « Vois » conserve sa force discursive dans un registre digne.
- source_word: הַבָּקָר לָעֹלוֹת
  choice: les bœufs pour les holocaustes
  rationale: בקר désigne collectivement les bovins et, dans ce contexte sacrificiel et agricole, « bœufs » est précis et idiomatique. עֹלוֹת est rendu par le terme sacrificiel courant « holocaustes ».
- source_word: הַמּוֹרִגִּים לָעֵצִים
  choice: les traîneaux à dépiquer comme bois de feu
  rationale: מוֹרִגִּים désigne des instruments lourds servant au dépiquage. Ils sont ici offerts pour être brûlés; « comme bois de feu » explicite sobrement la fonction de לָעֵצִים.
- source_word: הַחִטִּים לַמִּנְחָה
  choice: le blé pour l’offrande de céréales
  rationale: Dans ce contexte cultuel, מִנְחָה désigne l’offrande végétale ou céréalière; la formulation distingue clairement le blé fourni et l’offrande à préparer.
- source_word: הַכֹּל נָתָתִּי
  choice: Je donne tout
  rationale: Le parfait hébreu présente l’offre comme pleinement accordée. Le présent français convient naturellement à l’acte de donation accompli par cette déclaration.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les termes cultuels « holocaustes » et « offrande de céréales » assurent la précision, tandis que les notes préservent l’idiome hébreu et les renseignements culturels sans alourdir le verset.
