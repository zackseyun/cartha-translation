  text: וַ/יֹּ֨אמֶר דָּוִ֤יד אֶל יוֹאָב֙ וְ/אֶל שָׂרֵ֣י הָ/עָ֔ם לְכ֗וּ סִפְרוּ֙ אֶת יִשְׂרָאֵ֔ל מִ/בְּאֵ֥ר שֶׁ֖בַע וְ/עַד דָּ֑ן וְ/הָבִ֣יאוּ אֵלַ֔/י וְ/אֵדְעָ֖ה אֶת מִסְפָּרָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/002.yaml
  text: Then David said to Joab and to the commanders of the people[a], “Go, count Israel from Beersheba to Dan, and bring it to me, so that I may know their number.”
translation:
  language: fr
  text: 'Alors David dit à Joab et aux chefs du peuple : « Allez, comptez Israël depuis Bersabée jusqu’à Dan[a], puis apportez-m’en le résultat, afin que je sache combien ils sont. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « depuis Bersabée jusqu’à Dan » signifie : d’une extrémité d’Israël à l’autre.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » restitue naturellement cette succession en français moderne.
- source_word: שָׂרֵי הָעָם
  choice: les chefs du peuple
  rationale: שָׂרִים peut désigner des chefs, hauts responsables ou commandants. « Chefs » préserve cette largeur de sens sans imposer une fonction exclusivement militaire.
- source_word: לְכוּ
  choice: Allez
  rationale: Impératif pluriel direct et idiomatique du verbe הלך.
- source_word: סִפְרוּ אֶת יִשְׂרָאֵל
  choice: comptez Israël
  rationale: Le verbe ספר signifie ici compter ou recenser. La formulation concise conserve Israël comme nom collectif, conformément à l’hébreu.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: depuis Bersabée jusqu’à Dan
  rationale: La formule géographique désigne toute l’étendue d’Israël, du sud au nord. « Bersabée » est la forme française traditionnelle et intelligible du toponyme.
- source_word: וְהָבִיאוּ אֵלַי
  choice: puis apportez-m’en le résultat
  rationale: L’hébreu dit littéralement « apportez à moi » en laissant l’objet implicite. En français, « le résultat » explicite sobrement le résultat du dénombrement sans anticiper la formulation suivante.
- source_word: וְאֵדְעָה אֶת מִסְפָּרָם
  choice: afin que je sache combien ils sont
  rationale: Le cohortatif exprime le but recherché. Cette tournure française naturelle rend à la fois l’idée de connaissance et celle de leur nombre.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La syntaxe demeure proche de l’hébreu tout en explicitant l’objet sous-entendu de « apportez ». Le terme général « chefs » évite de réduire sans certitude les שָׂרֵי הָעָם à des commandants militaires.
