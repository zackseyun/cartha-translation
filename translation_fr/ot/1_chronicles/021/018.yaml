source:
  edition: WLC
  text: וּ/מַלְאַ֧ךְ יְהוָ֛ה אָמַ֥ר אֶל גָּ֖ד לֵ/אמֹ֣ר לְ/דָוִ֑יד כִּ֣י יַעֲלֶ֣ה דָוִ֗יד לְ/הָקִ֤ים מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבֻסִֽי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/018.yaml
  text: And the angel of Yahweh said to Gad to tell David that David should go up to set up an altar to Yahweh on the threshing floor of Ornan the Jebusite[a][b].
translation:
  language: fr
  text: L’ange de Yahweh[a] dit à Gad de dire à David de monter[b] pour dresser un autel à Yahweh sur l’aire de battage d’Ornan le Jébusite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’il monte » ou « qu’il doit monter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: L’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager ou un ange ; dans ce récit, il s’agit d’un être céleste, d’où « ange ». Le nom divin יְהוָה est rendu par « Yahweh ».
- source_word: אָמַר אֶל גָּד
  choice: dit à Gad
  rationale: Rendu direct et idiomatique du verbe courant אָמַר.
- source_word: לֵאמֹר לְדָוִיד
  choice: de dire à David
  rationale: Conserve le verbe de parole répété dans l’hébreu et introduit naturellement en français le contenu de l’ordre.
- source_word: כִּי יַעֲלֶה דָוִיד
  choice: de monter
  rationale: Dans ce contexte directif, l’infinitif français transmet naturellement l’ordre adressé à David tout en conservant le mouvement exprimé par עלה.
- source_word: לְהָקִים מִזְבֵּחַ
  choice: dresser un autel
  rationale: הקים signifie faire se tenir, dresser ou établir ; « dresser un autel » est précis, naturel et plus proche du verbe hébreu que le terme générique « construire ».
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le ל marque ici la destination ou la consécration de l’autel ; « un autel à Yahweh » est idiomatique en français.
- source_word: בְּגֹרֶן
  choice: sur l’aire de battage
  rationale: גֹרֶן désigne l’aire où l’on bat les céréales ; « sur » exprime adéquatement l’emplacement physique.
- source_word: אָרְנָן הַיְבֻסִי
  choice: d’Ornan le Jébusite
  rationale: Le nom propre est translittéré « Ornan » et le gentilé הַיְבֻסִי est rendu selon l’usage français par « le Jébusite ».
theological_decisions:
- issue: Sens de מַלְאַךְ dans l’expression מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Le contexte narratif présente une figure céleste, ce qui favorise « ange », sans supprimer l’autre sens lexical possible, signalé en note.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération rend explicitement le nom propre divin présent dans le texte hébreu sans le remplacer par un titre.
- issue: Force directive de כִּי יַעֲלֶה דָוִיד
  choice: de monter
  alternative: qu’il monte / qu’il doit monter
  rationale: Après « dire à David de », l’infinitif exprime naturellement une consigne en français. Il évite de préciser excessivement si la forme hébraïque doit être comprise comme ordre, obligation ou instruction.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la répétition du verbe de parole et le mouvement de « monter », tout en évitant la répétition peu naturelle du nom de David. « Aire de battage » est le terme courant et précis.
