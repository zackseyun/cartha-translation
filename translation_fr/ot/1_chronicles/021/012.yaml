source:
  edition: WLC
  text: אִם שָׁל֨וֹשׁ שָׁנִ֜ים רָעָ֗ב וְ/אִם שְׁלֹשָׁ֨ה חֳדָשִׁ֜ים נִסְפֶּ֥ה מִ/פְּנֵי צָרֶי/ךָ֮ וְ/חֶ֣רֶב אוֹיְבֶ֣/ךָ לְ/מַשֶּׂגֶת֒ וְ/אִם שְׁלֹ֣שֶׁת יָ֠מִים חֶ֣רֶב יְהוָ֤ה וְ/דֶ֨בֶר֙ בָּ/אָ֔רֶץ וּ/מַלְאַ֣ךְ יְהוָ֔ה מַשְׁחִ֖ית בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה רְאֵ֔ה מָֽה אָשִׁ֥יב אֶת שֹׁלְחִ֖/י דָּבָֽר־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/012.yaml
  text: either three years of famine[a], or three months of being swept away before your foes while the sword of your enemies overtakes you, or three days of the sword of Yahweh, even pestilence in the land, with the angel of Yahweh destroying throughout all the territory of Israel[b]. Now consider what answer I should return to the one who sent me.
translation:
  language: fr
  text: « Soit trois années de famine, soit trois mois pendant lesquels tu seras emporté[a] devant tes adversaires et l’épée de tes ennemis te rattrapera, soit trois jours de l’épée de Yahweh, à savoir une épidémie[b] dans le pays, avec l’ange de Yahweh qui détruira dans tout le territoire d’Israël. Vois maintenant ce que je dois répondre à celui qui m’a envoyé. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « consumé » ou « voué à la ruine » ; le participe hébreu peut décrire quelqu’un qui est balayé ou détruit au combat.
    reason: lexical_alternative
  - marker: b
    text: Ou « une peste » ; le mot hébreu désigne une maladie épidémique, dans ce contexte de jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: famine
  rationale: Dans ce contexte de jugement national, le terme désigne une grave pénurie de nourriture; « famine » est l’équivalent français naturel.
- source_word: נִסְפֶּה
  choice: tu seras emporté
  rationale: Le participe niphal évoque le fait d’être entraîné dans la ruine ou balayé devant l’ennemi, sans limiter explicitement le sens à la mort.
- source_word: מִפְּנֵי צָרֶיךָ
  choice: devant tes adversaires
  rationale: L’expression décrit une déroute ou une fuite face à des forces hostiles; « adversaires » évite de répéter immédiatement « ennemis ».
- source_word: חֶרֶב אוֹיְבֶיךָ לְמַשֶּׂגֶת
  choice: l’épée de tes ennemis te rattrapera
  rationale: La formulation conserve l’image de l’épée et rend naturellement l’idée d’atteindre quelqu’un au cours d’une poursuite.
- source_word: חֶרֶב יְהוָה
  choice: l’épée de Yahweh
  rationale: Cette traduction préserve l’image et son contraste avec « l’épée de tes ennemis ».
- source_word: דֶבֶר
  choice: épidémie
  rationale: Le mot désigne ici une maladie contagieuse frappant collectivement le pays dans un contexte de jugement; « épidémie » est clair en français moderne.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: « Ange » convient à l’agent céleste du récit tout en conservant l’expression hébraïque sans préciser davantage son identité.
- source_word: מַשְׁחִית
  choice: sèmera la destruction
  rationale: Cette tournure française restitue la valeur active du participe causatif et son action dévastatrice à travers le territoire.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: dans tout le territoire d’Israël
  rationale: Ici, גְּבוּל renvoie à toute l’étendue du pays plutôt qu’aux seules lignes frontalières.
- source_word: רְאֵה
  choice: vois maintenant
  rationale: L’impératif invite David à examiner la situation et à décider; le français conserve l’image tout en restant idiomatique dans ce contexte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom divin; « Yahweh » le rend comme un nom propre plutôt que de le remplacer par un titre.
- issue: Identité de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: La traduction garde la désignation du texte sans trancher la question théologique de la nature ou de l’identité exacte de cet ange.
- issue: Rapport entre « l’épée de Yahweh » et דֶבֶר
  choice: c’est-à-dire une épidémie
  alternative: et une épidémie
  rationale: Dans le contexte immédiat, l’épidémie et l’action de l’ange précisent la forme prise par « l’épée de Yahweh »; « c’est-à-dire » rend cette apposition sans identifier de manière exhaustive toute occurrence biblique de cette image.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La structure ternaire des choix est conservée, ainsi que les images parallèles des deux épées. Les marqueurs de notes sont placés immédiatement après les mots auxquels leurs variantes se rapportent.
