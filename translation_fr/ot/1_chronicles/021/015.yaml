  text: וַ/יִּשְׁלַח֩ הָ/אֱלֹהִ֨ים מַלְאָ֥ךְ לִֽ/ירוּשָׁלִַם֮ לְ/הַשְׁחִיתָ/הּ֒ וּ/כְ/הַשְׁחִ֗ית רָאָ֤ה יְהוָה֙ וַ/יִּנָּ֣חֶם עַל הָֽ/רָעָ֔ה וַ/יֹּ֨אמֶר לַ/מַּלְאָ֤ךְ הַ/מַּשְׁחִית֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֔ד עִם גֹּ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/015.yaml
  text: And God sent an angel to Jerusalem to destroy it[a], but as he was destroying it, Yahweh saw and relented concerning the calamity, and he said to the destroying angel, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was standing by the threshing floor of Ornan the Jebusite.
translation:
  language: fr
  text: 'Dieu envoya un ange à Jérusalem pour la détruire. Mais tandis qu’il la détruisait, Yahweh vit et se ravisa au sujet du désastre[a]. Il dit à l’ange destructeur : « Assez ! Maintenant, retire ta main[b]. » L’ange de Yahweh se tenait près de l’aire de battage d’Ornân le Jébusien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se ravisa au sujet du malheur ». Ici, le mot hébreu désigne le désastre infligé comme jugement, non le mal moral.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « relâche ta main » ; autrement dit, cesse d’agir.'
    reason: idiom_explanation
lexical_decisions:
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: L’article, le contexte et le verbe au singulier désignent clairement le Dieu d’Israël.
- source_word: מַלְאָךְ
  choice: ange
  rationale: Dans ce contexte de jugement divin, il s’agit d’un messager céleste ; « ange » est le terme français naturel.
- source_word: לְהַשְׁחִיתָהּ
  choice: pour la détruire
  rationale: Le hifil de שׁחת exprime ici l’action destructrice dirigée contre Jérusalem ; le pronom féminin reprend la ville.
- source_word: וּכְהַשְׁחִית
  choice: Mais tandis qu’il la détruisait
  rationale: La construction exprime une action en cours, interrompue par l’intervention de Yahweh. « Mais » rend clairement le tournant narratif.
- source_word: וַיִּנָּחֶם עַל הָרָעָה
  choice: renonça au désastre
  rationale: נחם décrit ici le renoncement à poursuivre le jugement, tandis que רעה désigne un désastre et non le mal moral. Cette formulation conserve la réaction divine racontée par le texte.
- source_word: הַמַּלְאָךְ הַמַּשְׁחִית
  choice: l’ange destructeur
  rationale: Le participe qualifie l’ange par son activité. « Ange destructeur » est concis, idiomatique et garde sa force active.
- source_word: רַב
  choice: Assez !
  rationale: L’adjectif est employé comme une exclamation brève ordonnant l’arrêt de la destruction.
- source_word: הֶרֶף יָדֶךָ
  choice: retire ta main
  rationale: Cette expression imagée ordonne la cessation de l’action. La traduction conserve l’image de la main tout en restant compréhensible en français moderne.
- source_word: גֹּרֶן אָרְנָן הַיְבוּסִי
  choice: l’aire de battage d’Ornân le Jébusien
  rationale: « Aire de battage » désigne précisément l’emplacement agricole ; Ornân et son appartenance jébusienne sont transcrits explicitement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération rend visible le nom propre divin présent dans l’hébreu, sans le remplacer par un titre.
- issue: Langage anthropopathique de וַיִּנָּחֶם עַל הָרָעָה
  choice: renonça au désastre
  alternative: regretta le désastre
  rationale: « Renonça » exprime l’arrêt du jugement dans le déroulement narratif sans nier la réaction attribuée à Dieu ni imposer une théorie philosophique sur un changement intérieur divin.
- issue: Identité de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: Yahweh manifesté sous forme angélique
  rationale: La traduction littérale préserve l’expression hébraïque sans décider si ce personnage est un ange créé ou une manifestation divine.
translation_notes:
  register: Français international moderne, digne et narratif. Les phrases restent directes ; l’image hébraïque de la main est conservée et expliquée en note. Le nom divin est rendu par « Yahweh », et la tension du récit concernant le renoncement divin demeure intacte.
