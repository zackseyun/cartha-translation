  naturalness: Le français est moderne, clair et de registre narratif approprié. « Se ravisa au sujet du désastre » rend plus naturellement et plus explicitement la relation de נחם עם על, sans expliquer ou résoudre la tension anthropopathique du texte.
  terminology: « Yahweh », « ange destructeur », « aire de battage », « Ornân » et « Jébusien » sont appropriés. « Désastre » rend correctement רָעָה dans ce contexte de jugement et la note écarte utilement le sens de mal moral.
