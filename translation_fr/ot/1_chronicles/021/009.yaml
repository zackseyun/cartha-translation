source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל גָּ֔ד חֹזֵ֥ה דָוִ֖יד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/009.yaml
  text: And Yahweh spoke to Gad[a], David’s seer, saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Gad, le voyant de David, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH »; autre transcription possible : « Yahvé ».'
    reason: Signaler la forme hébraïque du nom divin et une transcription française courante.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le waw narratif suivi de דבר fait avancer le récit. « Parla à » rend naturellement la construction avec אֶל et conserve la distinction avec la formule introductive לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: אֶל גָּד
  choice: à Gad
  rationale: אֶל marque ici le destinataire de la parole; « à Gad » est la tournure française naturelle.
- source_word: חֹזֵה דָוִיד
  choice: le voyant de David
  rationale: חֹזֵה désigne celui qui reçoit une révélation par vision. « Voyant » préserve mieux cette nuance que le terme plus général « prophète »; le complément de nom rend clairement la relation avec David.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette formule hébraïque introduit le discours direct. « En ces termes » est une formulation française actuelle et digne, plus naturelle ici que le calque « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Yahvé
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel sans le remplacer par le titre « le Seigneur »; « Yahvé » est une autre transcription française courante.
translation_notes:
  register: Français international moderne, sobre et narratif. « Le voyant de David » conserve le terme technique hébreu, tandis que « en ces termes » introduit naturellement le discours direct qui suit.
