revisions:
- from: 'David dit alors à Ornân : « Donne-moi l’emplacement de l’aire de battage, afin que j’y construise un autel à l’Éternel. Donne-le-moi contre son prix intégral, afin que le fléau qui frappe le peuple cesse. »'
  to: 'David dit alors à Ornân : « Donne-moi l’emplacement de l’aire de battage, afin que j’y construise un autel à l’Éternel. Donne-le-moi à son prix entier, afin que le fléau soit écarté du peuple. »'
  rationale: La révision remplace une expression commerciale non idiomatique par « à son prix entier » et rend le retrait du fléau au moyen d’un passif français naturel, sans ajouter d’agent ni caractériser le fléau au-delà du texte source.
  reviewer_model: gpt-5.6-terra
