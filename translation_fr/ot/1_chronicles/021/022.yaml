base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/022.yaml
  text: Then David said to Ornan, “Give me the place of the threshing floor, so that I may build on it an altar to the LORD. Give it to me for the full price, so that the plague may be stopped from upon the people.”
translation:
  language: fr
  text: 'David dit alors à Ornân : « Donne-moi l’emplacement de l’aire de battage, afin que j’y construise un autel à l’Éternel. Donne-le-moi à son prix entier, afin que le fléau soit écarté du peuple. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְקוֹם הַגֹּרֶן
  choice: l’emplacement de l’aire de battage
  rationale: « Emplacement » exprime ici le lieu ou terrain précis de l’aire, tandis que « aire de battage » est l’équivalent français naturel de גֹּרֶן.
- source_word: בְּכֶסֶף מָלֵא
  choice: contre son prix intégral
  rationale: L’expression indique un paiement complet, sans remise ni don; cette formulation française restitue clairement la valeur idiomatique.
- source_word: וְתֵעָצַר
  choice: cesse
  rationale: Le verbe à la forme passive signifie que le fléau doit être arrêté ou retenu; en français, « que ... cesse » est naturel sans préciser un agent que l’hébreu ne nomme pas.
- source_word: מֵעַל הָעָם
  choice: qui frappe le peuple
  rationale: Littéralement « de dessus le peuple » décrit le retrait du fléau pesant sur lui. La relative rend ce rapport naturellement en français et évite le calque peu idiomatique « de dessus le peuple ».
theological_decisions:
- issue: Rendu du tétragramme יהוה
  choice: l’Éternel
  alternative: YHWH / Yahvé
  rationale: « L’Éternel » est une convention française largement reconnue pour le nom divin et convient au registre biblique courant, sans ajouter d’interprétation doctrinale.
- issue: Agent de l’arrêt du fléau
  choice: afin que le fléau ... cesse
  alternative: afin que Dieu arrête le fléau
  rationale: L’hébreu emploie une forme passive sans nommer explicitement l’agent; la traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe directe conserve la répétition impérative de « Donne-moi », importante dans la demande de David.
