review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : David demande le site de l’aire pour y bâtir un autel à l’Éternel et veut payer le prix entier afin que le fléau soit retiré du peuple. Cependant, « qui frappe le peuple » transforme l’image hébraïque du fléau pesant sur le peuple et devant être arrêté/retiré en une action explicitement décrite, ce qui est une légère explicitation.'
  naturalness: « Contre son prix intégral » n’est pas une tournure française naturelle dans ce contexte commercial. « À son prix entier » est idiomatique, clair et conserve l’idée de paiement sans rabais. « Soit écarté du peuple » rend naturellement la construction passive sans imposer d’agent.
  terminology: « L’emplacement de l’aire de battage » convient pour מְקוֹם הַגֹּרֶן. « L’Éternel » est une convention française biblique recevable pour יהוה. « Fléau » rend correctement מַגֵּפָה.
  issues:
  - severity: medium
    issue: Expression de paiement peu idiomatique
    rationale: « Contre son prix intégral » est maladroit en français moderne et le possessif peut obscurcir le sens. L’hébreu demande que le terrain soit donné en échange de son plein prix.
  - severity: low
    issue: Explicitation de la relation entre le fléau et le peuple
    rationale: « Le fléau qui frappe le peuple cesse » est compréhensible, mais l’hébreu dit que le fléau est arrêté/retiré « de dessus le peuple ». Une formulation passive conserve mieux cette image et l’absence d’agent explicite.
  revised_text: 'David dit alors à Ornân : « Donne-moi l’emplacement de l’aire de battage, afin que j’y construise un autel à l’Éternel. Donne-le-moi à son prix entier, afin que le fléau soit écarté du peuple. »'
