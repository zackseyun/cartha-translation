source:
  edition: WLC
  text: וַ/יַּ֤עַל דָּוִיד֙ בִּ/דְבַר גָּ֔ד אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/019.yaml
  text: So David went up at the word of Gad[b][a], which he had spoken in the name of Yahweh.
translation:
  language: fr
  text: David monta donc conformément à la parole de Gad[a], que celui-ci avait prononcée au nom de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur l’ordre de Gad ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה exprime un déplacement vers le haut. « Monta » conserve cette nuance directionnelle dans une formulation française naturelle.
- source_word: בִּדְבַר גָּד
  choice: conformément à la parole de Gad
  rationale: La préposition ב marque ici la conformité ou le fondement de l’action. Cette formulation montre que David obéit à la parole transmise par Gad sans réduire דָּבָר au seul sens d’« ordre ».
- source_word: אֲשֶׁר דִּבֶּר
  choice: que celui-ci avait prononcée
  rationale: Le plus-que-parfait situe naturellement la parole avant l’action de David. « Celui-ci » identifie Gad comme sujet tout en évitant l’ambiguïté d’un simple pronom français.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: La formule indique que Gad parle sous l’autorité de Yahweh. Elle est rendue directement et conserve le nom divin personnel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » représente le tétragramme comme nom propre, conformément à la donnée hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve ici le nom divin plutôt que de lui substituer un titre.
- issue: Autorité de la parole de Gad
  choice: au nom de Yahweh
  alternative: par l’autorité de Yahweh
  rationale: La traduction littérale et idiomatique maintient l’expression prophétique biblique sans expliciter davantage que le texte source la nature de cette autorité.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en levant par « celui-ci » une ambiguïté pronominale qui serait artificielle en français.
