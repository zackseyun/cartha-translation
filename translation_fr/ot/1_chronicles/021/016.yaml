source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א דָוִ֜יד אֶת עֵינָ֗י/ו וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֗ד בֵּ֤ין הָ/אָ֨רֶץ֙ וּ/בֵ֣ין הַ/שָּׁמַ֔יִם וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ נְטוּיָ֖ה עַל יְרוּשָׁלִָ֑ם וַ/יִּפֹּ֨ל דָּוִ֧יד וְ/הַ/זְּקֵנִ֛ים מְכֻסִּ֥ים בַּ/שַּׂקִּ֖ים עַל פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/016.yaml
  text: David lifted up his eyes and saw the angel of Yahweh standing between the earth and the heavens[a], with his sword drawn in his hand, stretched out over Jerusalem. Then David and the elders, covered in sackcloth, fell on their faces.
translation:
  language: fr
  text: David leva les yeux et vit l’ange de Yahvé, qui se tenait entre la terre et les cieux[a], son épée dégainée dans sa main, tendue au-dessus de Jérusalem. Alors David et les anciens, revêtus de toile de sac, tombèrent face contre terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entre terre et ciel ». L’hébreu porte « entre la terre et les cieux ».
    reason: Signaler une formulation française possible tout en expliquant que le texte hébreu emploie les formes définies « la terre » et « les cieux ».
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: leva les yeux
  rationale: Expression française naturelle qui conserve l’image concrète et la solennité de l’idiome hébreu.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahvé
  rationale: Rend directement la construction hébraïque et emploie la forme française courante du nom divin.
- source_word: עֹמֵד
  choice: qui se tenait
  rationale: Exprime naturellement en français la posture visible indiquée par le participe hébreu.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: entre la terre et les cieux
  rationale: Conserve le contraste cosmique ainsi que la forme plurielle de שָׁמַיִם, tout en restant intelligible en français.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: son épée dégainée à la main
  rationale: « Dégainée » restitue l’état résultant du participe passif, et « à la main » est l’équivalent idiomatique de la locution hébraïque.
- source_word: נְטוּיָה עַל־יְרוּשָׁלִָם
  choice: tendue au-dessus de Jérusalem
  rationale: Préserve l’image menaçante de l’épée étendue sur la ville sans préciser davantage la direction que ne le fait l’hébreu.
- source_word: מְכֻסִּים בַּשַּׂקִּים
  choice: revêtus de toile de sac
  rationale: « Toile de sac » désigne clairement en français moderne le vêtement associé au deuil, à l’humiliation ou à la pénitence; « revêtus » rend naturellement le participe passif.
- source_word: וַיִּפֹּל ... עַל־פְּנֵיהֶם
  choice: tombèrent face contre terre
  rationale: Équivalent français courant qui conserve à la fois le mouvement physique et l’idée de prosternation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahvé » en conserve le caractère de nom propre dans une forme bien établie en français, plutôt que de lui substituer un titre.
- issue: Identité de מַלְאַךְ יְהוָה
  choice: l’ange de Yahvé
  alternative: le messager de Yahvé
  rationale: « Ange » est le rendu français usuel dans ce contexte céleste. La traduction ne précise pas davantage le rapport entre cet ange et Yahvé, préservant ainsi la formulation et la tension du texte.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe reste fluide tout en conservant les images concrètes du texte hébreu. « Toile de sac » est maintenu comme terme culturel biblique immédiatement compréhensible.
