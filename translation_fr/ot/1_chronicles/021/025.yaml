  text: וַ/יִּתֵּ֥ן דָּוִ֛יד לְ/אָרְנָ֖ן בַּ/מָּק֑וֹם שִׁקְלֵ֣י זָהָ֔ב מִשְׁקָ֖ל שֵׁ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/025.yaml
  text: And David gave Ornan six hundred shekels of gold by weight for the place[a].
translation:
  language: fr
  text: David donna à Ornan, pour le lieu, six cents sicles d’or en poids[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le récit parallèle de 2 Samuel 24.24 mentionne cinquante sicles d’argent. Ici, le texte des Chroniques indique six cents sicles d’or, peut-être parce que l’achat n’a pas la même étendue ou parce que les deux récits reposent sur des traditions textuelles différentes.
    reason: Renvoi au récit parallèle et préservation de la différence textuelle sans harmonisation.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Le verbe נתן signifie couramment « donner ». Dans ce contexte d’achat, la valeur de paiement ressort naturellement du montant indiqué, sans qu’il soit nécessaire de remplacer le verbe hébreu par « paya ».
- source_word: לְאָרְנָן
  choice: à Ornân
  rationale: Le texte des Chroniques porte le nom Ornân. La forme Arauna appartient au récit parallèle de 2 Samuel et n’est donc pas introduite ici.
- source_word: בַּמָּקוֹם
  choice: pour cet endroit
  rationale: מָקוֹם désigne un lieu ou un emplacement. La préposition et le contexte de transaction indiquent le prix donné en échange de l’endroit.
- source_word: שִׁקְלֵי זָהָב
  choice: sicles d’or
  rationale: « Sicles » conserve l’unité de poids ancienne, tandis que « d’or » rend explicitement la matière mentionnée dans l’hébreu.
- source_word: מִשְׁקָל
  choice: au poids prescrit
  rationale: מִשְׁקָל précise qu’il s’agit d’une mesure de poids. La formulation française indique que la somme est évaluée selon le poids, sans conversion moderne conjecturale.
- source_word: שֵׁשׁ מֵאוֹת
  choice: six cents
  rationale: Le nombre est traduit directement, sans l’ajuster à celui du récit parallèle.
theological_decisions:
- issue: Différence numérique et matérielle avec le récit parallèle de 2 Samuel 24.24
  choice: Conserver « six cents sicles d’or » conformément au texte hébreu des Chroniques.
  alternative: Harmoniser avec les cinquante sicles d’argent mentionnés en 2 Samuel 24.24.
  rationale: Le texte massorétique des Chroniques affirme explicitement « six cents sicles d’or ». La traduction doit préserver cette donnée et la tension intertextuelle plutôt que les harmoniser. Une différence dans l’étendue de l’achat ou dans la tradition textuelle reste possible, mais ne doit pas être imposée dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Ornân » suit la forme propre aux Chroniques. « Sicle » conserve l’unité ancienne. La tournure « au poids prescrit » explicite la fonction de מִשְׁקָל tout en évitant une conversion moderne incertaine.
