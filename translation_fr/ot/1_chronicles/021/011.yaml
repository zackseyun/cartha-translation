  text: וַ/יָּ֥בֹא גָ֖ד אֶל דָּוִ֑יד וַ/יֹּ֥אמֶר ל֛/וֹ כֹּֽה אָמַ֥ר יְהוָ֖ה קַבֶּל לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/011.yaml
  text: So Gad came to David and said to him[a], “Thus says Yahweh, ‘Choose for yourself—’”
translation:
  language: fr
  text: 'Gad vint trouver David et lui dit : « Voici ce que dit Yahweh : “Choisis pour toi[a]…” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Accepte pour toi… » Dans le contexte, Gad demande à David de choisir parmi les possibilités énoncées au verset suivant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint trouver
  rationale: Le verbe בוא décrit l’arrivée de Gad auprès de David. « Vint trouver » exprime naturellement en français moderne ce mouvement vers une personne.
- source_word: גָד
  choice: Gad
  rationale: Nom propre rendu selon sa forme française traditionnelle.
- source_word: אֶל דָּוִיד
  choice: David
  rationale: Avec « vint trouver », la direction marquée par אֶל est exprimée idiomatiquement sans préposition distincte.
- source_word: וַיֹּאמֶר לוֹ
  choice: et lui dit
  rationale: Rend directement le verbe אמר et son complément indirect pronominal.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule française naturelle et digne correspondant à la formule de messager prophétique hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel, plutôt que substitution par un titre.
- source_word: קַבֶּל
  choice: Choisis
  rationale: Le sens lexical fondamental est « recevoir, accepter », mais le contexte immédiat présente plusieurs options entre lesquelles David doit faire un choix.
- source_word: לָךְ
  choice: pour toi-même
  rationale: Conserve la valeur personnelle du datif et souligne que David doit lui-même faire ce choix.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme, un nom personnel; « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Valeur contextuelle de קַבֶּל
  choice: Choisis
  alternative: Accepte
  rationale: « Choisis » explicite la fonction de l’impératif dans ce passage, où des possibilités sont proposées au verset suivant; la note préserve toutefois le sens lexical plus littéral.
translation_notes:
  register: Français international moderne, naturel et digne. La formule prophétique reste solennelle sans archaïsme; les points de suspension rendent l’énoncé volontairement inachevé qui se poursuit au verset suivant.
