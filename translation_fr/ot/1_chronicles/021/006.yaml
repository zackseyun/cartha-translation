  text: וְ/לֵוִי֙ וּ/בִנְיָמִ֔ן לֹ֥א פָקַ֖ד בְּ/תוֹכָ֑/ם כִּֽי נִתְעַ֥ב דְּבַר הַ/מֶּ֖לֶךְ אֶת יוֹאָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/006.yaml
  text: But he did not count Levi and Benjamin among them[a], because the king’s command was detestable to Joab.
translation:
  language: fr
  text: Mais il ne recensa pas Lévi et Benjamin parmi eux, car l’ordre du roi faisait horreur à Joab[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car la parole du roi était odieuse à Joab ».'
    reason: Conserve les possibilités plus littérales de דבר (« parole ») et de la construction passive נִתְעַב (« était odieuse »), sans modifier le sens général.
lexical_decisions:
- source_word: וְ/לֵוִי֙ וּ/בִנְיָמִ֔ן
  choice: Mais il ne recensa pas Lévi et Benjamin
  rationale: Le וְ initial marque ici le contraste avec les résultats du recensement donnés au verset précédent; « mais » le rend naturellement. Les noms des deux tribus sont conservés sous leurs formes françaises usuelles.
- source_word: לֹ֥א פָקַ֖ד
  choice: ne recensa pas
  rationale: Dans ce contexte de dénombrement national, פקד signifie compter ou recenser. « Recenser » est précis, actuel et évite une formulation inutilement lourde.
- source_word: בְּ/תוֹכָ֑/ם
  choice: parmi eux
  rationale: Rend directement l’idée d’inclusion dans l’ensemble déjà dénombré, sans préciser davantage que l’hébreu l’identité du référent.
- source_word: כִּֽי
  choice: car
  rationale: Introduit la raison pour laquelle Joab n’a pas inclus ces tribus; « car » convient au registre narratif soutenu tout en restant courant.
- source_word: נִתְעַ֥ב
  choice: faisait horreur
  rationale: Le nifal exprime ici une vive répulsion. La tournure française « faisait horreur à » conserve cette forte valeur affective sans archaïsme.
- source_word: דְּבַר הַ/מֶּ֖לֶךְ
  choice: l’ordre du roi
  rationale: דבר peut désigner une parole, une affaire ou un ordre. Dans le contexte, il s’agit de la directive royale de procéder au recensement; « ordre » explicite naturellement ce sens contextuel.
- source_word: אֶת יוֹאָֽב
  choice: à Joab
  rationale: Après ce verbe d’évaluation ou de réaction, אֶת désigne la personne qui éprouve la répulsion. La construction « faisait horreur à Joab » rend clairement ce rapport.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Recensa » fournit le terme précis du contexte, tandis que « faisait horreur » restitue avec naturel la forte répulsion exprimée par l’hébreu.
