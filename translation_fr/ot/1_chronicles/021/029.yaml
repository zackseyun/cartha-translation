id: 1CH.21.29
reference: 1 Chronicles 21:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מִשְׁכַּ֣ן יְ֠הוָה אֲשֶׁר עָשָׂ֨ה מֹשֶׁ֧ה בַ/מִּדְבָּ֛ר וּ/מִזְבַּ֥ח הָ/עוֹלָ֖ה בָּ/עֵ֣ת הַ/הִ֑יא בַּ/בָּמָ֖ה בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/029.yaml
  text: The tabernacle of Yahweh, which Moses had made in the wilderness, and the altar of burnt offering were at that time on the high place at Gibeon.
translation:
  language: fr
  text: Le tabernacle de Yahweh, que Moïse avait construit dans le désert, ainsi que l’autel des holocaustes, se trouvaient alors sur le haut lieu de Gabaon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכַּן
  choice: tabernacle
  rationale: Dans ce contexte cultuel, le terme désigne le sanctuaire mobile de l’époque de Moïse. « Tabernacle » est le terme français consacré et suffisamment précis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר עָשָׂה מֹשֶׁה
  choice: que Moïse avait construit
  rationale: Le plus-que-parfait situe cette construction avant les événements racontés. « Construit » exprime naturellement en français la fabrication du sanctuaire, tout en restant dans le champ du verbe général עָשָׂה.
- source_word: בַמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est le rendu français courant de מִדְבָּר dans le cadre du séjour d’Israël hors des régions habitées.
- source_word: מִזְבַּח הָעוֹלָה
  choice: l’autel des holocaustes
  rationale: Cette expression cultuelle française désigne clairement l’autel où les offrandes étaient entièrement brûlées.
- source_word: בָּעֵת הַהִיא
  choice: alors
  rationale: « Alors » restitue avec concision et naturel la situation temporelle indiquée par l’hébreu.
- source_word: בַּבָּמָה
  choice: sur le haut lieu
  rationale: « Haut lieu » conserve le sens cultuel technique de בָּמָה, tandis que « sur » reflète la préposition et l’image spatiale du texte.
- source_word: בְּגִבְעוֹן
  choice: de Gabaon
  rationale: En français, « le haut lieu de Gabaon » identifie naturellement le site cultuel situé dans cette ville.
- source_word: וּ
  choice: ainsi que
  rationale: Dans la coordination interne, « ainsi que » relie clairement les deux éléments qui se trouvaient à Gabaon. La conjonction initiale n’exige pas l’ajout d’un marqueur discursif autonome en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Valeur cultuelle de בָּמָה
  choice: haut lieu
  alternative: hauteur
  rationale: Dans ce contexte, il s’agit d’un site cultuel. « Haut lieu » maintient ce sens sans préciser davantage la nature ou la légitimité du sanctuaire.
translation_notes:
  register: Français moderne, digne et direct. La phrase conserve les termes cultuels établis (« tabernacle », « autel des holocaustes », « haut lieu ») tout en employant une syntaxe naturelle. L’accord au pluriel de « se trouvaient » traite le tabernacle et l’autel comme les deux éléments coordonnés du sujet.
