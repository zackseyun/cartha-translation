  text: וַ/יֹּ֣אמֶר דָּוִ֣יד אֶֽל הָ/אֱלֹהִ֡ים הֲ/לֹא֩ אֲנִ֨י אָמַ֜רְתִּי לִ/מְנ֣וֹת בָּ/עָ֗ם וַ/אֲנִי ה֤וּא אֲשֶׁר חָטָ֨אתִי֙ וְ/הָרֵ֣עַ הֲרֵע֔וֹתִי וְ/אֵ֥לֶּה הַ/צֹּ֖אן מֶ֣ה עָשׂ֑וּ יְהוָ֣ה אֱלֹהַ֗/י תְּהִ֨י נָ֤א יָֽדְ/ךָ֙ בִּ֚/י וּ/בְ/בֵ֣ית אָבִ֔/י וּֽ/בְ/עַמְּ/ךָ֖ לֹ֥א לְ/מַגֵּפָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/017.yaml
  text: Then David said to God[a], “Was it not I who ordered the people to be counted? I am the one who has sinned and done great evil. But these sheep—what have they done? O Yahweh my God, please let your hand be against me and against my father’s house[d][c][b], but not against your people for a plague.”
translation:
  language: fr
  text: 'David dit alors à Dieu[a] : « N’est-ce pas moi qui ai ordonné de recenser le peuple ? C’est moi qui ai péché et qui ai vraiment mal agi. Mais ces brebis, qu’ont-elles fait ? Yahweh, mon Dieu, que ta main s’abatte donc sur moi et sur la maison de mon père[b], mais non sur ton peuple pour le frapper d’un fléau[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « N’est-ce pas moi qui ai dit de compter le peuple ? »'
    reason: lexical_alternative
  - marker: b
    text: La « maison de mon père » désigne ici la famille ou la lignée de David.
    reason: cultural_note
  - marker: c
    text: 'Autre traduction possible : « mais que ta main ne soit pas sur ton peuple pour lui infliger un fléau ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא אֲנִי אָמַרְתִּי לִמְנוֹת בָּעָם
  choice: N’est-ce pas moi qui ai ordonné de recenser le peuple ?
  rationale: La question rhétorique attend une réponse affirmative. אָמַרְתִּי signifie littéralement « j’ai dit », mais désigne ici l’ordre donné par David de procéder au recensement.
- source_word: וַאֲנִי הוּא אֲשֶׁר חָטָאתִי
  choice: C’est moi qui ai péché
  rationale: La tournure hébraïque est emphatique et souligne la responsabilité personnelle de David.
- source_word: וְהָרֵעַ הֲרֵעוֹתִי
  choice: et qui ai vraiment mal agi
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’action. Cette formulation française conserve l’intensité tout en restant naturelle et sans préciser au-delà du texte la nature du mal.
- source_word: וְאֵלֶּה הַצֹּאן
  choice: Mais ces brebis
  rationale: 'La métaphore pastorale du texte hébreu est conservée explicitement : David assimile le peuple à des brebis.'
- source_word: יְהוָה אֱלֹהַי
  choice: Yahweh, mon Dieu
  rationale: Le nom divin est translittéré, et le possessif direct אֱלֹהַי est rendu par « mon Dieu ».
- source_word: תְּהִי נָא יָדְךָ בִּי
  choice: que ta main s’abatte donc sur moi
  rationale: La « main » est maintenue comme image de la puissance divine agissant en jugement. « S’abatte sur » communique naturellement la portée punitive indiquée par le contexte.
- source_word: בִּי וּבְבֵית אָבִי
  choice: sur moi et sur la maison de mon père
  rationale: « Maison de mon père » conserve l’expression familiale et dynastique de l’hébreu sans la réduire à un bâtiment.
- source_word: וּבְעַמְּךָ לֹא לְמַגֵּפָה
  choice: mais non sur ton peuple pour le frapper d’un fléau
  rationale: 'La construction hébraïque compacte est explicitée avec mesure en français : David demande que le peuple ne soit pas la cible d’un fléau.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Portée de « ces brebis »
  choice: Conserver la métaphore sans identifier son référent dans le corps du verset
  alternative: ces gens innocents
  rationale: Le texte appelle le peuple « brebis » et pose une question rhétorique sur ce qu’elles ont fait. La traduction ne transforme pas cette implication en déclaration explicite d’innocence.
- issue: Sens de la main divine
  choice: Conserver « ta main » avec « s’abatte sur »
  alternative: que ton jugement frappe
  rationale: La métaphore biblique est préservée, tandis que le verbe français rend sa valeur punitive claire dans le contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe directe préserve l’aveu emphatique de David, la métaphore des brebis et celle de la main divine. « Recenser » est naturel dans ce contexte administratif et « vraiment mal agi » restitue l’intensification hébraïque sans archaïsme.
