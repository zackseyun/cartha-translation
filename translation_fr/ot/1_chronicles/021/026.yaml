base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/026.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings. He called on Yahweh[a], and he answered him with fire from heaven on the altar of burnt offering.
translation:
  language: fr
  text: Là, David construisit un autel pour Yahweh et y offrit des holocaustes et des sacrifices de paix[a]. Il invoqua Yahweh, qui lui répondit par un feu venu du ciel et tombé sur l’autel de l’holocauste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion ».
    reason: Alternative lexicale courante pour שְׁלָמִים, qui souligne la communion liée à cette catégorie sacrificielle plutôt que son lien étymologique avec la paix.
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִיד
  choice: Là, David construisit
  rationale: « Là » reprend naturellement le lieu mentionné dans le contexte, et « construisit » exprime précisément l’action concrète de bâtir l’autel.
- source_word: מִזְבֵּחַ לַיהוָה
  choice: un autel pour Yahweh
  rationale: La préposition indique la destination ou la consécration de l’autel. « Pour » est naturel en français, tandis que le nom divin est transcrit « Yahweh ».
- source_word: וַיַּעַל עֹלוֹת
  choice: y offrit des holocaustes
  rationale: Dans ce contexte cultuel, le verbe désigne l’action d’offrir. Le pronom « y » rattache clairement les offrandes à l’autel sans alourdir la phrase.
- source_word: וּשְׁלָמִים
  choice: des sacrifices de paix
  rationale: Cette formulation conserve le lien lexical du terme hébreu avec la paix et évite de réduire d’emblée la catégorie sacrificielle à une seule interprétation. « Sacrifices de communion » est signalé en note comme autre traduction courante.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: Il invoqua Yahweh
  rationale: Dans un contexte de prière, « invoquer » rend avec naturel l’appel adressé à Dieu.
- source_word: וַיַּעֲנֵהוּ בָאֵשׁ
  choice: qui lui répondit par le feu
  rationale: La relative rend explicite sans ambiguïté que Yahweh est le sujet de la réponse. « Par le feu » conserve la valeur instrumentale de la préposition hébraïque.
- source_word: מִן הַשָּׁמַיִם עַל מִזְבַּח הָעֹלָה
  choice: venu du ciel sur l’autel de l’holocauste
  rationale: « Du ciel » est l’équivalent idiomatique français. « L’autel de l’holocauste » conserve l’association cultuelle exprimée par le génitif hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. La transcription « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Nature de la réponse divine par le feu
  choice: Yahweh « lui répondit par le feu venu du ciel »
  alternative: Yahweh fit tomber ou envoya du feu du ciel
  rationale: La traduction conserve l’affirmation narrative du texte sans ajouter un verbe de mouvement ou une explication du phénomène qui ne sont pas exprimés.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple convient au registre biblique littéraire sans être archaïque. La syntaxe reste claire et évite les développements interprétatifs.
