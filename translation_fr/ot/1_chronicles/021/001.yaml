  text: וַ/יַּֽעֲמֹ֥ד שָׂטָ֖ן עַל יִשְׂרָאֵ֑ל וַ/יָּ֨סֶת֙ אֶת דָּוִ֔יד לִ/מְנ֖וֹת אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/001.yaml
  text: Then Satan stood up against Israel and incited David to count Israel[a][b].
translation:
  language: fr
  text: Alors Satan[a] se dressa contre Israël et incita David à compter Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un adversaire ». Le mot hébreu satan peut désigner un adversaire ou servir de nom ou de titre personnel : « Satan ».'
    reason: lexical_alternative
  - marker: b
    text: En 2 Samuel 24.1, l’incitation est attribuée à l’Éternel, dans le contexte de sa colère contre Israël. Les Chroniques présentent Satan comme l’agent immédiat, sans effacer la tension théologique entre les deux récits.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: se dressa
  rationale: Le verbe עמד signifie littéralement « se tenir debout » ou « prendre position ». « Se dressa » conserve l’image concrète et exprime ici une initiative hostile.
- source_word: שָׂטָן
  choice: Satan
  rationale: Sans article en hébreu, le terme peut fonctionner ici comme une désignation personnelle. « Satan » reflète le référent le plus probable, tandis que le sens lexical « un adversaire » est signalé en note.
- source_word: עַל יִשְׂרָאֵל
  choice: contre Israël
  rationale: Dans ce contexte hostile, la préposition עַל se rend naturellement par « contre ».
- source_word: וַיָּסֶת
  choice: incita
  rationale: La forme causative de סות exprime l’idée de pousser ou d’inciter quelqu’un à agir, sans nécessairement impliquer une contrainte irrésistible.
- source_word: לִמְנוֹת
  choice: à compter
  rationale: מנה signifie « compter » ou « dénombrer ». « Compter » est direct, courant et moins explicatif que « faire le recensement de ».
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: L’objet direct est simplement « Israël » ; conserver cette formulation respecte la concision de l’hébreu.
theological_decisions:
- issue: Identité et sens de שָׂטָן
  choice: Satan comme figure personnelle hostile
  alternative: un adversaire
  rationale: Le nom peut désigner de manière générique un adversaire, mais le contexte permet vraisemblablement d’y voir Satan comme être personnel. La note conserve l’ambiguïté lexicale réelle sans l’imposer au texte principal.
- issue: Relation avec 2 Samuel 24.1
  choice: Présenter Satan comme l’agent immédiat selon les Chroniques
  alternative: Harmoniser explicitement ce verset avec l’attribution à la colère de l’Éternel en 2 Samuel 24.1
  rationale: Le texte des Chroniques nomme Satan, tandis que 2 Samuel 24.1 attribue l’incitation à la colère de l’Éternel. La traduction ne résout pas artificiellement cette tension théologique ; elle la signale en note.
translation_notes:
  register: Français international moderne, clair et digne. « Se dressa » préserve l’image hébraïque tout en exprimant l’opposition ; « incita » et « compter » restent précis et naturels. Les deux marqueurs de note figurent dans le texte principal.
