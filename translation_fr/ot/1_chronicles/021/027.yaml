source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לַ/מַּלְאָ֔ךְ וַ/יָּ֥שֶׁב חַרְבּ֖/וֹ אֶל נְדָנָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/027.yaml
  text: And Yahweh spoke to the angel[b][a], and he returned his sword to its sheath.
translation:
  language: fr
  text: Yahweh parla à l’ange[a], et il remit son épée dans son fourreau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dit à l’ange ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « fit revenir son épée dans son fourreau ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin, plutôt que remplacé par un titre.
- source_word: וַיֹּאמֶר
  choice: parla
  rationale: Le verbe אמר signifie fondamentalement « dire ». Ici, sans paroles rapportées, « parla à » est naturel en français et n’ajoute pas l’idée explicite d’un ordre.
- source_word: לַמַּלְאָךְ
  choice: à l’ange
  rationale: מַלְאָךְ peut désigner un messager ou un ange ; le contexte du personnage céleste tenant une épée favorise nettement « ange ».
- source_word: וַיָּשֶׁב
  choice: remit
  rationale: La forme causative de שוב exprime l’idée de faire revenir ou de replacer. Avec une épée comme objet, « remit » rend ce mouvement de manière concise et naturelle.
- source_word: חַרְבּוֹ
  choice: son épée
  rationale: Le suffixe possessif renvoie, dans le contexte immédiat, à l’épée de l’ange.
- source_word: אֶל נְדָנָהּ
  choice: dans son fourreau
  rationale: נְדָן désigne l’étui rigide d’une arme blanche. « Fourreau » est le terme français courant, et « dans » exprime naturellement le rangement de l’épée.
theological_decisions:
- issue: Sujet de וַיָּשֶׁב (« et il remit »)
  choice: Le pronom « il » renvoie naturellement à l’ange, mentionné juste avant.
  alternative: Yahweh pourrait être pris comme sujet grammatical maintenu, faisant revenir l’épée.
  rationale: Le contexte narratif et le possessif « son épée » favorisent l’ange comme sujet. Le simple pronom « il », plutôt que « celui-ci », conserve toutefois la formulation pronominale et sa légère souplesse syntaxique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la coordination simple du récit hébreu. « Parla à » évite de supposer le contenu précis de la parole, tandis que « remit son épée dans son fourreau » offre une formulation idiomatique sans effacer la valeur causative du verbe, signalée en note.
