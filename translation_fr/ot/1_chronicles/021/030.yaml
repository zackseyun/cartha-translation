  rationale: La reformulation de « aller devant elle » en « se rendre auprès de la Demeure » rend le mouvement vers le lieu de culte de façon idiomatique en français moderne. Elle s’accorde avec le contexte du verset précédent, tout en conservant en note l’interprétation alternative selon laquelle le pronom renvoie à Dieu. Aucun changement n’est apporté à la cause de la peur, à l’image de l’épée ni au titre divin.
