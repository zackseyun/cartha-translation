base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/030.yaml
  text: But David could not go before it to seek God[a], because he was terrified by the sword of the angel of Yahweh.
translation:
  language: fr
  text: Mais David ne pouvait pas se rendre auprès de la Demeure pour chercher Dieu[a], car il était terrifié par l’épée de l’ange de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se rendre devant lui », si le pronom renvoie à Dieu plutôt qu’à la Demeure située à Gabaon.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא
  choice: Mais… ne pouvait pas
  rationale: La conjonction poursuit le récit avec un léger contraste par rapport au verset précédent; « mais » le rend naturellement en français.
- source_word: לָלֶכֶת
  choice: aller
  rationale: Dans ce contexte, הלך désigne le déplacement vers le sanctuaire situé à Gabaon.
- source_word: לְפָנָיו
  choice: devant elle
  rationale: Le suffixe masculin singulier renvoie vraisemblablement à la Demeure mentionnée au verset 29; en français, « elle » s’accorde avec « la Demeure », l’antécédent contextuel.
- source_word: לִדְרֹשׁ אֱלֹהִים
  choice: pour chercher Dieu
  rationale: דרשׁ associé à Dieu peut évoquer le fait de se tourner vers lui dans la prière et le culte, sans se limiter à une demande de renseignement.
- source_word: נִבְעַת
  choice: était terrifié
  rationale: Le nifal exprime ici une peur intense, provoquée par l’épée visible de l’ange.
- source_word: חֶרֶב מַלְאַךְ יְהוָה
  choice: l’épée de l’ange de Yahvé
  rationale: « Épée » conserve l’image concrète du récit, et מלאך désigne clairement ici un être céleste. Le nom divin est rendu par « Yahvé » conformément à l’usage du projet.
theological_decisions:
- issue: Référent du pronom dans לְפָנָיו
  choice: La Demeure de Yahvé à Gabaon, mentionnée au verset 29
  alternative: Dieu lui-même (« devant lui »), ou plus généralement le lieu de culte
  rationale: La Demeure est l’antécédent contextuel le plus proche et le verset explique pourquoi David ne s’y rendit pas. Une note conserve toutefois l’autre interprétation possible.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle; l’ambiguïté réelle du pronom est signalée en note.
