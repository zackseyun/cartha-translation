  text: וַ/יָּבֹ֥א דָוִ֖יד עַד אָרְנָ֑ן וַ/יַּבֵּ֤ט אָרְנָן֙ וַ/יַּ֣רְא אֶת דָּוִ֔יד וַ/יֵּצֵא֙ מִן הַ/גֹּ֔רֶן וַ/יִּשְׁתַּ֧חוּ לְ/דָוִ֛יד אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/021.yaml
  text: When David came to Ornan[a], Ornan looked and saw David, and he went out from the threshing floor and bowed down before David with his face to the ground.
translation:
  language: fr
  text: David arriva jusqu’à Ornan. Ornan regarda et vit David ; il sortit de l’aire de battage et se prosterna devant David, le visage contre terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’inclina profondément devant David ». L’hébreu décrit une prosternation complète, le visage contre terre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא דָוִיד עַד אָרְנָן
  choice: David arriva jusqu’à Ornan
  rationale: Le verbe בוא peut exprimer le fait de venir, d’aller ou d’arriver selon le point de vue, et עַד marque ici le terme du déplacement. « Arriva jusqu’à » rend naturellement les deux éléments sans les surinterpréter.
- source_word: וַיַּבֵּט אָרְנָן וַיַּרְא אֶת דָּוִיד
  choice: Ornan regarda et vit David
  rationale: La formulation conserve la succession des deux verbes hébreux, d’abord l’orientation du regard, puis la perception de David, au lieu de les fondre en un seul.
- source_word: וַיֵּצֵא מִן הַגֹּרֶן
  choice: il sortit de l’aire de battage
  rationale: גורן désigne l’aire où l’on battait les céréales. « Sortit de » restitue clairement le mouvement exprimé par יצא et מן.
- source_word: וַיִּשְׁתַּחוּ לְדָוִיד
  choice: se prosterna devant David
  rationale: Le verbe décrit ici un geste physique profond de déférence envers un supérieur humain. « Se prosterna devant » en garde la force concrète sans suggérer nécessairement une adoration divine.
- source_word: אַפַּיִם אָרְצָה
  choice: le visage contre terre
  rationale: Cette expression idiomatique, littéralement orientée « face/nez vers la terre », décrit une prosternation complète. La formulation française est claire et naturelle.
theological_decisions:
- issue: Le geste d’Ornan pourrait-il être rendu comme un acte d’adoration envers David ?
  choice: se prosterna devant David
  alternative: adora David ; rendit hommage à David
  rationale: השתחוה peut désigner l’adoration ou une profonde révérence selon le contexte. Ici, David est un roi humain et la description précise la posture corporelle ; la traduction conserve donc le geste sans lui attribuer explicitement une portée cultuelle.
translation_notes:
  register: Français moderne, digne et accessible. Le point-virgule clarifie la progression de la scène, tandis que « aire de battage » conserve le terme agricole précis. Le nom propre est écrit « Ornan », conformément à la forme donnée dans le texte source et la couche de consultation.
