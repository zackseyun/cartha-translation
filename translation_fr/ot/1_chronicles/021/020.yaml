base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/020.yaml
  text: Ornan turned and saw the angel[a], and his four sons with him were hiding themselves, while Ornan was threshing wheat.
translation:
  language: fr
  text: Ornân se retourna et vit l’ange[a]. Ses quatre fils, qui étaient avec lui, se cachaient, tandis qu’Ornân battait du blé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu est à une forme réfléchie ; « se cachaient » en rend la nuance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: se retourna
  rationale: Le verbe שׁוב signifie « revenir » ou « se tourner ». Dans ce contexte, « se retourna » exprime naturellement le mouvement qui permet à Ornân de voir l’ange, sans ajouter de marqueur temporel absent de l’hébreu.
- source_word: וַיַּרְא אֶת הַמַּלְאָךְ
  choice: vit l’ange
  rationale: מַלְאָךְ peut désigner un messager ou un ange, mais le contexte du jugement divin indique ici un être céleste ; « l’ange » est donc le rendu le plus clair.
- source_word: וְאַרְבַּעַת בָּנָיו עִמּוֹ
  choice: Ses quatre fils, qui étaient avec lui
  rationale: Cette formulation française rattache sans ambiguïté עִמּוֹ aux fils et conserve l’idée qu’ils se trouvaient avec Ornân.
- source_word: מִתְחַבְּאִים
  choice: se cachaient
  rationale: La forme hitpael a une valeur réfléchie ou moyenne. Le verbe pronominal français « se cacher » rend naturellement cette nuance, tandis que l’imparfait correspond à l’action en cours exprimée par le participe.
- source_word: וְאָרְנָן דָּשׁ חִטִּים
  choice: tandis qu’Ornân battait du blé
  rationale: La proposition décrit l’activité de fond d’Ornân au même moment. « Tandis que » et l’imparfait rendent cette valeur circonstancielle, et חִטִּים désigne précisément le blé.
