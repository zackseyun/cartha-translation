  text: וַ/יִּתֵּ֥ן יוֹאָ֛ב אֶת מִסְפַּ֥ר מִפְקַד הָ/עָ֖ם אֶל דָּוִ֑יד וַ/יְהִ֣י כָֽל יִשְׂרָאֵ֡ל אֶ֣לֶף אֲלָפִים֩ וּ/מֵאָ֨ה אֶ֤לֶף אִישׁ֙ שֹׁ֣לֵֽף חֶ֔רֶב וִֽ/יהוּדָ֕ה אַרְבַּע֩ מֵא֨וֹת וְ/שִׁבְעִ֥ים אֶ֛לֶף אִ֖ישׁ שֹׁ֥לֵֽף חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/005.yaml
  text: Joab gave the number of the census of the people to David. All Israel was 1,100,000 men drawing the sword[a], and Judah was 470,000 men drawing the sword.
translation:
  language: fr
  text: Joab remit à David le chiffre du recensement du peuple. Tout Israël comptait 1 100 000[a] hommes tirant l’épée, et Juda 470 000 hommes tirant l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mille milliers et cent mille ».'
    reason: La note préserve la manière inhabituelle dont le nombre est formulé dans le texte hébreu.
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: le chiffre du recensement du peuple
  rationale: La formulation conserve les deux notions de מִסְפַּר (« chiffre, total ») et de מִפְקַד (« recensement, dénombrement »), tout en restant naturelle en français moderne.
- source_word: וַיְהִי כָל יִשְׂרָאֵל
  choice: Tout Israël comptait
  rationale: Le verbe « comptait » exprime naturellement le total résultant introduit par la construction hébraïque, tout en préservant le sens collectif de « tout Israël ».
- source_word: אֶלֶף אֲלָפִים וּמֵאָה אֶלֶף
  choice: 1 100 000
  rationale: Les chiffres arabes, avec les espaces typographiques françaises, rendent clairement ce grand nombre. Une note conserve la formulation littérale inhabituelle de l’hébreu.
- source_word: אִישׁ
  choice: hommes
  rationale: Dans ce contexte de recensement militaire, אִישׁ désigne collectivement les hommes recensés comme combattants.
- source_word: שֹׁלֵף חֶרֶב
  choice: tirant l’épée
  rationale: Cette expression conserve l’image précise du participe שֹׁלֵף, « tirer, dégainer », plutôt que de la généraliser en « porter les armes ».
- source_word: וִיהוּדָה
  choice: et Juda
  rationale: La seconde donnée est coordonnée à la première. En français, le verbe « comptait » reste naturellement sous-entendu dans cette proposition parallèle.
- source_word: אַרְבַּע מֵאוֹת וְשִׁבְעִים אֶלֶף
  choice: 470 000
  rationale: Les chiffres arabes présentent le total clairement selon l’usage typographique français.
