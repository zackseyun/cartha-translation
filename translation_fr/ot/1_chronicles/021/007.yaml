source:
  edition: WLC
  text: וַ/יֵּ֨רַע֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה וַ/יַּ֖ךְ אֶת יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/007.yaml
  text: But this matter was evil in the sight of God[a], so he struck Israel.
translation:
  language: fr
  text: Mais cette affaire était mauvaise aux yeux de Dieu[a] ; alors il frappa Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « déplut à Dieu ». L’hébreu dit littéralement : « était mauvaise aux yeux de Dieu ».'
    reason: Alternative lexicale signalant une formulation française plus idiomatique tout en précisant la force et l’image de l’hébreu.
lexical_decisions:
- source_word: וַיֵּרַע
  choice: fut mauvaise
  rationale: Le verbe issu de רעע exprime ici une évaluation fortement négative, qui peut comporter une portée morale. « Fut mauvaise » en conserve la force, contrairement au plus doux « déplut ».
- source_word: בְּעֵינֵי הָאֱלֹהִים
  choice: aux yeux de Dieu
  rationale: Cette expression rend directement l’idiome hébreu tout en restant naturelle en français et en conservant l’idée du jugement porté par Dieu.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Le texte emploie אֱלֹהִים, et non le nom divin YHWH ; « Dieu » est donc requis.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: cette affaire
  rationale: דָּבָר peut désigner une chose, une affaire ou un fait. Dans ce contexte, « cette affaire » renvoie naturellement au recensement sans préciser davantage que l’hébreu.
- source_word: וַיַּךְ
  choice: frappa
  rationale: נכה signifie couramment « frapper ». Ce choix conserve la force du jugement sans ajouter l’idée explicite de mise à mort, absente du verbe pris isolément dans ce verset.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: Le complément direct désigne Israël collectivement ; aucune explicitation comme « le peuple d’Israël » n’est nécessaire.
- source_word: וַ ... וַ
  choice: Mais ... alors
  rationale: « Mais » marque naturellement le contraste narratif entre l’action précédente et son évaluation divine. « Alors » fait ressortir la succession à portée consécutive sans transformer explicitement la coordination en énoncé causal.
theological_decisions:
- issue: Évaluation divine du recensement et jugement infligé à Israël
  choice: Le texte affirme que l’affaire fut mauvaise aux yeux de Dieu, puis que Dieu frappa Israël.
  alternative: Atténuer l’évaluation en disant seulement que l’affaire « déplut » à Dieu, ou adoucir « frappa » en parlant d’une simple réaction défavorable.
  rationale: 'L’hébreu associe une évaluation négative forte à une intervention divine directe. La formulation conserve la tension du récit : l’acte de David est jugé, tandis qu’Israël est frappé, sans tenter d’expliquer ni de résoudre ici la question du jugement collectif.'
translation_notes:
  register: Français moderne, digne et accessible. La tournure « mauvaise aux yeux de Dieu » garde l’image hébraïque, familière au registre biblique sans être archaïque. Le point-virgule clarifie le passage de l’évaluation au jugement.
