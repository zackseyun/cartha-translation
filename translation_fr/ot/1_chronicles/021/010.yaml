  text: לֵךְ֩ וְ/דִבַּרְתָּ֨ אֶל דָּוִ֜יד לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה שָׁל֕וֹשׁ אֲנִ֖י נֹטֶ֣ה עָלֶ֑י/ךָ בְּחַר לְ/ךָ֛ אַחַ֥ת מֵ/הֵ֖נָּה וְ/אֶֽעֱשֶׂה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/010.yaml
  text: 'Go and speak to David[a], saying, ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: fr
  text: 'Va parler à David et dis-lui : « Voici ce que dit Yahweh : Je place devant toi trois choses[a]. Choisis-en une, et je te la ferai subir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Trois, moi, j’étends sur toi. » L’hébreu ne précise pas ce que sont ces trois éléments; le contexte indique qu’ils sont présentés à David afin qu’il en choisisse un.'
    reason: Conserver l’image du verbe נטה et signaler que l’objet reste implicite dans le texte hébreu.
lexical_decisions:
- source_word: לֵךְ וְדִבַּרְתָּ אֶל דָּוִיד לֵאמֹר
  choice: Va parler à David et dis-lui
  rationale: Cette formulation française naturelle conserve l’ordre d’aller, l’adresse à David et la fonction introductive de לֵאמֹר sans recourir au calque lourd « en disant ».
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Rend naturellement en français moderne la formule de messager prophétique, tout en transcrivant directement le nom divin.
- source_word: שָׁלוֹשׁ אֲנִי נֹטֶה עָלֶיךָ
  choice: Je place devant toi trois choses
  rationale: Le texte hébreu ne nomme pas les trois éléments. « Choses » fournit seulement le support grammatical nécessaire, tandis que « place devant toi » exprime leur présentation à David en vue d’un choix. Une note conserve l’image littérale plus difficile.
- source_word: בְּחַר לְךָ אַחַת מֵהֵנָּה
  choice: Choisis-en une
  rationale: Le pronom partitif français reprend clairement les trois éléments; le sens réfléchi de לְךָ est suffisamment porté par l’impératif adressé personnellement à David.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: et je te la ferai subir
  rationale: Dans ce contexte punitif, עשה avec ל indique que la chose choisie sera accomplie à l’encontre de David. Cette tournure est plus naturelle que le calque « je te la ferai », sans préciser prématurément la nature du châtiment.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre plutôt que de le remplacer par un titre.
- issue: Objet non exprimé après שָׁלוֹשׁ
  choice: trois choses
  alternative: trois châtiments / trois possibilités
  rationale: L’hébreu laisse le nom sous-entendu. « Choses » évite de définir ces trois éléments avant que le verset suivant ne les expose.
- issue: Valeur punitive de וְאֶעֱשֶׂה לָּךְ
  choice: je te la ferai subir
  alternative: je la ferai pour toi
  rationale: Les trois choix sont des conséquences punitives; la valeur défavorable est donc contextuellement requise, mais la traduction ne précise pas davantage leur nature.
translation_notes:
  register: Français international moderne, digne et direct. La formule prophétique demeure solennelle sans archaïsmes; la syntaxe est adaptée à l’usage français courant.
