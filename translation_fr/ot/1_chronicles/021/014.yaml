source:
  edition: WLC
  text: וַ/יִּתֵּ֧ן יְהוָ֛ה דֶּ֖בֶר בְּ/יִשְׂרָאֵ֑ל וַ/יִּפֹּל֙ מִ/יִּשְׂרָאֵ֔ל שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/014.yaml
  text: So Yahweh sent a plague on Israel[a], and seventy thousand men of Israel fell.
translation:
  language: fr
  text: Alors Yahweh envoya une épidémie en Israël[a], et soixante-dix mille hommes d’Israël tombèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une peste ». Le terme hébreu désigne une épidémie mortelle, souvent dans un contexte de jugement divin.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיִּתֵּן
  choice: envoya
  rationale: Le verbe signifie littéralement « donna », mais, avec דֶּבֶר, « envoya une épidémie » exprime naturellement en français l’action directe attribuée à Yahweh.
- source_word: דֶּבֶר
  choice: une épidémie
  rationale: Le terme désigne une maladie mortelle qui se répand, souvent dans un contexte de jugement divin. « Épidémie » est clair et actuel; « peste » demeure une autre traduction possible.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La préposition situe ici l’épidémie au sein d’Israël; cette formulation est naturelle en français et ne transforme pas explicitement la relation en hostilité (« contre »).
- source_word: וַיִּפֹּל
  choice: tombèrent
  rationale: Le choix conserve l’image hébraïque de la chute comme expression de la mort, sans l’expliciter davantage.
- source_word: מִיִּשְׂרָאֵל
  choice: d’Israël
  rationale: Cette tournure exprime naturellement l’appartenance des victimes au peuple d’Israël.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: soixante-dix mille hommes
  rationale: Le nom אִישׁ signifie ici « homme » au collectif après le nombre; la traduction conserve cette désignation plutôt que de la généraliser en « personnes ».
theological_decisions:
- issue: Action divine dans le jugement
  choice: Yahweh envoya une épidémie
  alternative: Yahweh permit qu’une épidémie frappe Israël
  rationale: L’hébreu attribue directement l’action à Yahweh et ne contient aucun verbe signifiant « permettre ». La traduction maintient cette tension théologique sans l’atténuer.
translation_notes:
  register: Français international moderne, sobre et digne. « Alors » assure la continuité narrative; le passé simple convient au registre narratif biblique sans être archaïque. L’expression « tombèrent » préserve l’image de l’hébreu.
