id: 1CH.22.15
reference: 1 Chronicles 22:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עִמְּ/ךָ֤ לָ/רֹב֙ עֹשֵׂ֣י מְלָאכָ֔ה חֹצְבִ֕ים וְ/חָרָשֵׁ֥י אֶ֖בֶן וָ/עֵ֑ץ וְ/כָל חָכָ֖ם בְּ/כָל מְלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/015.yaml
  text: 'And with you in abundance are workers for the task: stonecutters[a], and craftsmen of stone and wood, and every skilled man for every kind of work.'
translation:
  language: fr
  text: 'Tu as aussi avec toi un grand nombre d’ouvriers pour réaliser les travaux : des tailleurs de pierre, des artisans travaillant la pierre et le bois, ainsi que toute personne compétente dans toutes sortes de travaux[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout habile dans tout travail »; on peut aussi traduire : « tout artisan compétent pour chaque type de travail ».'
    reason: La formulation hébraïque, au masculin singulier et très condensée, peut décrire collectivement l’ensemble des ouvriers qualifiés ou souligner leur compétence pour les divers travaux.
lexical_decisions:
- source_word: וְעִמְּךָ
  choice: Tu as aussi avec toi
  rationale: Cette formulation naturelle conserve l’idée littérale de personnes qui sont « avec toi », l’adresse directe à Salomon et le lien avec le verset précédent.
- source_word: לָרֹב
  choice: un grand nombre
  rationale: L’expression indique une quantité abondante; « un grand nombre » est idiomatique en français dans cette construction.
- source_word: עֹשֵׂי מְלָאכָה
  choice: des ouvriers pour réaliser les travaux
  rationale: Le participe désigne ceux qui exécutent le travail du chantier. Cette formulation exprime clairement leur fonction sans employer un terme archaïque.
- source_word: חֹצְבִים
  choice: des tailleurs de pierre
  rationale: Dans le contexte de la construction du temple, le participe désigne ceux qui taillent la pierre; l’objet implicite est précisé par le contexte immédiat.
- source_word: וְחָרָשֵׁי אֶבֶן וָעֵץ
  choice: des artisans travaillant la pierre et le bois
  rationale: חָרָשׁ désigne un artisan qualifié. La formulation française conserve les deux matériaux et distingue naturellement ces artisans des tailleurs de pierre déjà mentionnés.
- source_word: וְכָל חָכָם
  choice: ainsi que toute personne compétente
  rationale: Dans ce contexte, חָכָם exprime l’habileté pratique plutôt que la sagesse intellectuelle. « Toute personne compétente » rend la valeur représentative du masculin singulier hébreu en français courant.
- source_word: בְּכָל מְלָאכָה
  choice: dans toutes sortes de travaux
  rationale: La formule exprime l’ensemble des spécialités nécessaires au chantier sans suggérer artificiellement que chaque individu maîtrise absolument chaque métier.
theological_decisions:
- issue: Valeur du masculin singulier dans וְכָל חָכָם
  choice: toute personne compétente
  alternative: tout homme habile / tout artisan compétent
  rationale: Le masculin singulier a ici une portée représentative au sein de la main-d’œuvre. La traduction choisie préserve cette portée générale sans transformer le passage en affirmation particulière sur le sexe de chaque artisan.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire concret du chantier est conservé, tandis que la syntaxe hébraïque nominale est rendue par une phrase française naturelle.
