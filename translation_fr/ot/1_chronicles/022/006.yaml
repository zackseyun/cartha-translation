  text: וַ/יִּקְרָ֖א לִ/שְׁלֹמֹ֣ה בְנ֑/וֹ וַ/יְצַוֵּ֨/הוּ֙ לִ/בְנ֣וֹת בַּ֔יִת לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/006.yaml
  text: Then he called for Solomon his son and commanded him to build a house for Yahweh[a], the God of Israel.
translation:
  language: fr
  text: Puis David appela son fils Salomon et lui ordonna de bâtir une maison[a] pour Yahvé, le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un temple ». L’hébreu dit littéralement « une maison ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Puis David appela
  rationale: Le wayyiqtol fait progresser le récit. « Puis » exprime naturellement la succession; le nom « David », implicite dans le verbe hébreu, clarifie en français l’identité du sujet dans ce verset isolé.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: son fils Salomon
  rationale: Cette formulation française naturelle conserve à la fois le nom propre et le lien filial exprimé par בְנוֹ.
- source_word: וַיְצַוֵּהוּ
  choice: et lui ordonna
  rationale: Le verbe צוה exprime ici un ordre ayant une force réelle; « ordonna » en conserve clairement l’autorité.
- source_word: לִבְנוֹת
  choice: de bâtir
  rationale: L’infinitif précise le contenu de l’ordre. « Bâtir » convient au registre digne du projet du sanctuaire tout en restant courant.
- source_word: בַּיִת
  choice: une maison
  rationale: Le sens lexical direct est « maison ». Dans le contexte, il s’agit du temple, mais conserver « maison » préserve l’image et le choix de vocabulaire hébreux; l’interprétation « temple » est signalée en note.
- source_word: לַיהוָה
  choice: pour Yahvé
  rationale: La préposition ל marque ici la destination ou la dédicace de l’édifice. « Pour » est naturel en français. « Yahvé » est la forme française courante du nom divin יהוה.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette traduction directe du groupe construit identifie Yahvé comme le Dieu d’Israël.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le Tétragramme. « Yahvé » restitue le nom divin sous sa forme française courante plutôt que de le remplacer par un titre.
- issue: Interprétation cultuelle de בַּיִת
  choice: une maison
  alternative: un temple
  rationale: Le contexte désigne bien le futur temple, mais l’hébreu emploie le mot ordinaire « maison ». Le texte principal garde cette formulation sans effacer sa portée théologique, tandis que la note donne l’équivalent contextuel.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste simple et narrative. « Bâtir » apporte une légère solennité adaptée au sanctuaire sans être archaïque.
