  variant: modern international French
source:
  edition: WLC
  text: עַתָּ֗ה תְּנ֤וּ לְבַבְ/כֶם֙ וְ/נַפְשְׁ/כֶ֔ם לִ/דְר֖וֹשׁ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/ק֗וּמוּ וּ/בְנוּ֙ אֶת מִקְדַּשׁ֙ יְהוָ֣ה הָֽ/אֱלֹהִ֔ים לְ/הָבִ֞יא אֶת אֲר֣וֹן בְּרִית יְהוָ֗ה וּ/כְלֵי֙ קֹ֣דֶשׁ הָֽ/אֱלֹהִ֔ים לַ/בַּ֖יִת הַ/נִּבְנֶ֥ה לְ/שֵׁם יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/019.yaml
  text: Now set your heart and your soul to seek Yahweh your God[a]. Rise up and build the sanctuary of Yahweh God[b], to bring the ark of the covenant of Yahweh and the holy vessels of God into the house that is to be built for the name of Yahweh.
translation:
  language: fr
  text: Maintenant, consacrez votre cœur et votre âme à rechercher Yahweh votre Dieu[a]. Levez-vous et construisez le sanctuaire de Yahweh Dieu, afin d’apporter l’arche de l’alliance de Yahweh et les objets sacrés de Dieu dans la maison[b] qui doit être construite pour le nom de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donnez votre cœur et votre âme » à rechercher Yahweh votre Dieu.'
    reason: lexical_alternative
  - marker: b
    text: Ici, la « maison » désigne l’édifice du temple qui doit être construit pour le nom de Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: Marque temporelle et discursive qui introduit naturellement une exhortation pressante.
- source_word: תְּנוּ לְבַבְכֶם וְנַפְשְׁכֶם
  choice: consacrez votre cœur et votre âme
  rationale: Littéralement « donnez votre cœur et votre âme ». « Consacrez » exprime en français actuel la résolution entière demandée, tandis que la note conserve l’image hébraïque.
- source_word: לְבָב / נֶפֶשׁ
  choice: cœur et âme
  rationale: Maintient explicitement les deux termes anthropologiques sans les réduire à une notion abstraite ni leur imposer une distinction technique.
- source_word: לִדְרוֹשׁ
  choice: rechercher
  rationale: Dans cette construction avec Dieu, le verbe désigne une recherche volontaire et dévouée; « rechercher » convient au registre exhortatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte source.
- source_word: וְקוּמוּ וּבְנוּ
  choice: Levez-vous et construisez
  rationale: Rend directement les deux impératifs coordonnés dans un français digne et courant.
- source_word: מִקְדַּשׁ
  choice: le sanctuaire
  rationale: Désigne le lieu saint et permet de conserver la distinction avec la « maison » mentionnée ensuite.
- source_word: יְהוָה הָאֱלֹהִים
  choice: Yahweh Dieu
  rationale: Conserve sans ajout la juxtaposition du nom divin et du titre אֱלֹהִים; la formulation, inhabituelle mais intelligible, reflète celle de l’hébreu.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: Préserve clairement la chaîne de compléments du texte hébreu.
- source_word: כְלֵי קֹדֶשׁ הָאֱלֹהִים
  choice: les objets sacrés de Dieu
  rationale: כְּלִי peut désigner des objets, ustensiles ou récipients; « objets » garde ici une portée suffisamment large.
- source_word: לַבַּיִת הַנִּבְנֶה לְשֵׁם יְהוָה
  choice: dans la maison qui sera construite pour le nom de Yahweh
  rationale: Rend la destination, le participe décrivant la construction prévue, et la formule théologique « pour le nom » sans l’expliciter dans le corps du texte.
theological_decisions:
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Le cœur et l’âme
  choice: Conserver les deux termes
  alternative: tout votre être; votre esprit et votre cœur
  rationale: Le parallélisme intensifie l’engagement total, mais le texte ne définit pas ici une anthropologie technique; les deux termes sont donc maintenus sans explication doctrinale.
- issue: Expression « pour le nom de Yahweh »
  choice: Conserver la formule littéraire et théologique
  alternative: en l’honneur de Yahweh; pour Yahweh
  rationale: La formule associe le temple au nom divin tout en préservant la tension entre la présence de Dieu et l’édifice; une paraphrase risquerait de résoudre cette nuance.
- issue: Désignation יְהוָה הָאֱלֹהִים
  choice: Yahweh Dieu
  alternative: Yahweh, le Dieu; le Seigneur Dieu
  rationale: La traduction conserve la forme compacte et quelque peu marquée du texte massorétique, sans introduire une apposition absente ni substituer un titre au nom.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs gardent leur force exhortative. « Consacrez » évite le calque peu naturel « donnez », signalé en note. Les répétitions de « Yahweh » et de « Dieu », ainsi que la distinction entre « sanctuaire » et « maison », sont maintenues au plus près du texte source.
