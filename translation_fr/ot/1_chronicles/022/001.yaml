source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔יד זֶ֣ה ה֔וּא בֵּ֖ית יְהוָ֣ה הָ/אֱלֹהִ֑ים וְ/זֶה מִּזְבֵּ֥חַ לְ/עֹלָ֖ה לְ/יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/001.yaml
  text: Then David said[a], “This is the house of Yahweh God[b], and this is the altar for burnt offering for Israel.”
translation:
  language: fr
  text: 'Alors David dit : « Voici la maison[a] de Yahweh Dieu, et voici l’autel destiné à l’holocauste[b] pour Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le temple ». Littéralement : « la maison ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’autel destiné aux holocaustes pour Israël ». Le singulier hébreu peut avoir un sens générique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement la succession narrative en français.
- source_word: דָּוִיד
  choice: David
  rationale: Forme française usuelle du nom propre.
- source_word: זֶה הוּא
  choice: Voici
  rationale: La construction démonstrative produit une identification appuyée. « Voici » conserve sa force déictique sans ajouter explicitement « le lieu de ».
- source_word: בֵּית
  choice: la maison
  rationale: Le nom hébreu signifie littéralement « maison ». Ce choix préserve l’image biblique et évite de préciser par interprétation qu’il s’agit du futur temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Le terme qualifie ici le nom divin dans l’expression « Yahweh Dieu ».
- source_word: מִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français courant de la structure sacrificielle désignée.
- source_word: לְעֹלָה
  choice: destiné à l’holocauste
  rationale: Cette formulation rend la relation marquée par לְ et conserve le singulier hébreu, susceptible d’un sens générique.
- source_word: לְיִשְׂרָאֵל
  choice: pour Israël
  rationale: Formulation concise qui conserve la relation de destination ou d’appartenance à Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom divin au lieu de le remplacer par un titre.
- issue: Interprétation de בֵּית comme « maison » ou « temple »
  choice: la maison
  alternative: le temple
  rationale: Même si le contexte désigne le site du futur temple, l’hébreu dit « maison ». La traduction retenue maintient cette image et sa portée théologique sans expliciter davantage que le texte.
- issue: Nombre de עֹלָה
  choice: l’holocauste
  alternative: les holocaustes
  rationale: Le singulier hébreu est conservé dans le texte principal tout en laissant ouverte sa valeur générique; l’autre compréhension est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. « Voici » restitue l’identification déictique répétée; « Yahweh Dieu » conserve de près la formulation hébraïque malgré son caractère plus marqué en français courant.
