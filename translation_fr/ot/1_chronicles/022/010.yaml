reference: 1 Chronicles 22:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֽוּא יִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י וְ/הוּא֙ יִהְיֶה לִּ֣/י לְ/בֵ֔ן וַ/אֲנִי ל֖/וֹ לְ/אָ֑ב וַ/הֲכִ֨ינוֹתִ֜י כִּסֵּ֧א מַלְכוּת֛/וֹ עַל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/010.yaml
  text: He will build a house for my name[a], and he will be a son to me, and I will be a father to him, and I will establish the throne of his kingdom over Israel forever.
translation:
  language: fr
  text: C’est lui qui bâtira une maison pour mon nom[a]. Il sera pour moi un fils, et moi, je serai pour lui un père. J’établirai pour toujours le trône de son royaume sur Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un temple pour mon nom ». L’hébreu dit littéralement « une maison pour mon nom ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיִת
  choice: maison
  rationale: Le sens premier est « maison ». Dans ce contexte, il s’agit du temple, mais garder « maison pour mon nom » préserve l’expression hébraïque et sa portée métaphorique.
- source_word: לִשְׁמִי
  choice: pour mon nom
  rationale: Traduction directe de l’expression hébraïque désignant une maison consacrée au nom et à la présence de Dieu, sans explicitation interprétative dans le texte principal.
- source_word: לְבֵן
  choice: pour moi un fils
  rationale: Cette formulation française conserve la relation directement affirmée par la construction hébraïque et s’insère dans le parallélisme de la formule d’alliance.
- source_word: לְאָב
  choice: pour lui un père
  rationale: Le choix reproduit le parallèle relationnel avec « pour moi un fils » tout en restant naturel dans un registre biblique moderne et digne.
- source_word: וַהֲכִינוֹתִי
  choice: J’établirai
  rationale: Le hiphil de כון exprime l’action d’affermir ou d’établir durablement. « Établir » convient naturellement à la stabilité dynastique promise.
- source_word: כִּסֵּא מַלְכוּתוֹ
  choice: le trône de son royaume
  rationale: La traduction conserve à la fois les notions de trône et de royaume, ainsi que la formulation dynastique du texte source.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: Avec l’idée de royauté, עַל indique ici l’exercice de l’autorité sur Israël.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Expression française actuelle et claire qui rend la durée indéfinie et permanente de la promesse.
theological_decisions:
- issue: Formule d’alliance père-fils appliquée à Salomon et porteuse d’une portée davidique plus large
  choice: « Il sera pour moi un fils, et moi, je serai pour lui un père. »
  alternative: « Je le traiterai comme un fils » ou une autre paraphrase atténuant la relation directement affirmée
  rationale: L’hébreu énonce directement la relation. La conserver maintient à la fois la référence immédiate à Salomon et la portée canonique plus large de la promesse, sans imposer au verset une résolution doctrinale ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe relationnelle conserve le parallélisme solennel de la formule d’alliance, tandis que « maison » maintient l’image hébraïque avec une note explicitant son référent cultuel.
