source:
  edition: WLC
  text: הִנֵּה בֵ֞ן נוֹלָ֣ד לָ֗/ךְ ה֤וּא יִהְיֶה֙ אִ֣ישׁ מְנוּחָ֔ה וַ/הֲנִח֥וֹתִי ל֛/וֹ מִ/כָּל אוֹיְבָ֖י/ו מִ/סָּבִ֑יב כִּ֤י שְׁלֹמֹה֙ יִהְיֶ֣ה שְׁמ֔/וֹ וְ/שָׁל֥וֹם וָ/שֶׁ֛קֶט אֶתֵּ֥ן עַל יִשְׂרָאֵ֖ל בְּ/יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/009.yaml
  text: Behold[a], a son will be born to you. He will be a man of rest, and I will give him rest from all his enemies all around; for Solomon will be his name[b], and I will give peace and quiet to Israel in his days.
translation:
  language: fr
  text: Voici qu’un fils te naîtra. Ce sera un homme de repos, et je lui accorderai le repos en le délivrant de tous les ennemis qui l’entourent. Car son nom sera Salomon[a], et je donnerai à Israël paix et tranquillité de son temps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, le nom « Salomon » est rapproché du mot traduit ici par « paix » ; le verset l’associe aussi au « repos ».
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Conserve la fonction d’annonce solennelle et d’appel à l’attention, dans une tournure française naturelle.
- source_word: בֵן נוֹלָד לָךְ
  choice: un fils te naîtra
  rationale: Le participe passif prend ici une valeur future dans le contexte de la promesse; la formulation française exprime directement que ce fils naîtra à David.
- source_word: אִישׁ מְנוּחָה
  choice: un homme de repos
  rationale: Cette formulation volontairement marquée préserve le substantif « repos » et son lien lexical avec le verbe suivant, sans le confondre avec שָׁלוֹם, rendu par « paix ».
- source_word: וַהֲנִחוֹתִי לוֹ
  choice: je lui accorderai le repos
  rationale: Rend la causalité divine et maintient la répétition thématique de « repos »; « accorder » est idiomatique en français actuel.
- source_word: מִכָּל אוֹיְבָיו מִסָּבִיב
  choice: en le délivrant de tous les ennemis qui l’entourent
  rationale: Explicite de façon idiomatique le sens de la préposition מן après « donner du repos » et conserve à la fois la totalité des ennemis et leur présence alentour.
- source_word: כִּי
  choice: En effet
  rationale: Introduit naturellement l’explication qui relie le nom annoncé au repos et à la paix promis.
- source_word: שְׁלֹמֹה יִהְיֶה שְׁמוֹ
  choice: son nom sera Salomon
  rationale: Tournure française naturelle qui conserve l’énoncé explicite du nom et son rôle dans l’explication.
- source_word: וְשָׁלוֹם וָשֶׁקֶט
  choice: paix et tranquillité
  rationale: Distingue les deux termes hébreux et évite de confondre שֶׁקֶט avec le « repos » déjà employé pour מְנוּחָה.
- source_word: בְּיָמָיו
  choice: durant sa vie
  rationale: Exprime en français courant l’idée temporelle de « pendant ses jours », c’est-à-dire du vivant ou sous le règne de Salomon.
theological_decisions:
- issue: Lien entre le repos, le nom de Salomon et la paix
  choice: Maintenir « repos » pour מְנוּחָה et la racine נוח, puis « paix » pour שָׁלוֹם, avec une note sur le rapprochement sonore et thématique avec Salomon.
  alternative: Rendre אִישׁ מְנוּחָה par « un homme de paix » afin de lisser le thème.
  rationale: Le texte emploie des mots distincts tout en les rapprochant délibérément. La traduction conserve cette distinction et laisse apparaître la tension poétique sans réduire tous les termes à une seule notion.
translation_notes:
  register: Français international actuel, digne et accessible. « Homme de repos » est une expression légèrement marquée, retenue pour préserver la structure et le réseau lexical de l’hébreu; le reste de la phrase privilégie une syntaxe française fluide.
