revisions:
- from: Voici qu’un fils te naîtra. Ce sera un homme de repos, et je lui accorderai le repos en le délivrant de tous les ennemis qui l’entourent. En effet, son nom sera Salomon[a], et je donnerai à Israël paix et tranquillité durant sa vie.
  to: Voici qu’un fils te naîtra. Ce sera un homme de repos, et je lui accorderai le repos en le délivrant de tous les ennemis qui l’entourent. Car son nom sera Salomon[a], et je donnerai à Israël paix et tranquillité de son temps.
  rationale: La seule révision nécessaire remplace « durant sa vie » par « de son temps », afin de rendre plus exactement la portée de בְּיָמָיו tout en conservant un français moderne et naturel. La note est maintenue, avec une ponctuation typographique française normalisée.
