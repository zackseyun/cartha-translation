  yaml_path: translation/ot/1_chronicles/022/017.yaml
  text: Then David commanded all the leaders of Israel to help Solomon his son.
translation:
  language: fr
  text: Puis David ordonna à tous les chefs d’Israël d’aider son fils Salomon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Puis David ordonna
  rationale: Le wayyiqtol de צוה fait progresser le récit et exprime une directive investie d’autorité. « Puis » rend naturellement la succession narrative, tandis que « ordonna » conserve la force du verbe.
- source_word: שָׂרֵי
  choice: chefs
  rationale: שָׂרִים désigne ici les principaux dirigeants d’Israël. « Chefs » est clair, actuel et suffisamment large pour ne pas préciser indûment leur fonction.
- source_word: לְכָל שָׂרֵי יִשְׂרָאֵל
  choice: à tous les chefs d’Israël
  rationale: Cette formulation conserve l’inclusion de l’ensemble des dirigeants nationaux ainsi que la relation exprimée par « d’Israël ».
- source_word: לַעְזֹר
  choice: d’aider
  rationale: L’infinitif de עזר signifie directement « aider » ou « assister » ; « aider » est le choix le plus naturel en français courant.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: son fils Salomon
  rationale: Le français idiomatique place naturellement le lien filial avant le nom propre. La traduction conserve à la fois l’identité de Salomon et l’accent contextuel sur sa relation avec David.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe est naturelle sans atténuer l’autorité de l’ordre donné par David.
