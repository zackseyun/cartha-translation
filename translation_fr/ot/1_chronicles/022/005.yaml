  text: וַ/יֹּ֣אמֶר דָּוִ֗יד שְׁלֹמֹ֣ה בְנִ/י֮ נַ֣עַר וָ/רָךְ֒ וְ/הַ/בַּ֜יִת לִ/בְנ֣וֹת לַ/יהוָ֗ה לְ/הַגְדִּ֨יל לְ/מַ֜עְלָ/ה לְ/שֵׁ֤ם וּ/לְ/תִפְאֶ֨רֶת֙ לְ/כָל הָ֣/אֲרָצ֔וֹת אָכִ֥ינָה נָּ֖א ל֑/וֹ וַ/יָּ֧כֶן דָּוִ֛יד לָ/רֹ֖ב לִ/פְנֵ֥י מוֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/005.yaml
  text: And David said[a], “My son Solomon is young and inexperienced, and the house to be built for Yahweh must be made exceedingly great in fame and splendor in all lands[c][b]. I will now make preparation for it.” So David made abundant preparations before his death.
translation:
  language: fr
  text: 'David dit : « Salomon, mon fils, est jeune et inexpérimenté[a]. La maison[b] qui sera bâtie pour Yahweh devra être d’une grandeur extraordinaire, afin d’être renommée et magnifique dans tous les pays[c]. Je vais maintenant faire des préparatifs à cette fin[d]. » Ainsi, David fit d’abondants préparatifs avant sa mort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jeune et tendre ». L’adjectif hébreu peut désigner ce qui est tendre ou délicat ; ici, il évoque probablement le manque de maturité ou d’expérience de Salomon.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « le temple ». Littéralement : « la maison ».'
    reason: lexical_alternative
  - marker: c
    text: 'Plus littéralement : « afin d’être un nom et une splendeur pour tous les pays » ; on peut aussi comprendre : « afin d’avoir renom et gloire dans tous les pays ».'
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « pour lui ». Le pronom hébreu peut renvoyer à Salomon ou, plus probablement dans ce contexte, à la maison ou à sa construction.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: נַעַר וָרָךְ
  choice: jeune et inexpérimenté
  rationale: « Jeune » exprime l’âge relatif de Salomon. רַךְ signifie littéralement « tendre, délicat », mais, dans ce contexte où David juge nécessaires des préparatifs préalables, le mot évoque naturellement son manque de maturité ou d’expérience.
- source_word: הַבַּיִת
  choice: la maison
  rationale: Le terme hébreu signifie « maison ». Le conserver maintient l’image de la maison de Yahweh et évite de remplacer sans nécessité le mot source par l’interprétation explicative « temple ».
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La forme hébraïque porte directement le nom divin יהוה ; « Yahweh » le rend comme nom propre plutôt que de le remplacer par un titre.
- source_word: לְהַגְדִּיל לְמַעְלָה
  choice: devra être d’une grandeur extraordinaire
  rationale: La tournure hébraïque intensifie fortement la grandeur attendue de l’édifice. Cette formulation est naturelle en français tout en conservant sa valeur superlative.
- source_word: לְשֵׁם וּלְתִפְאֶרֶת
  choice: afin d’être renommée et magnifique
  rationale: 'La répétition de לְ exprime ici la finalité ou le résultat visé : la maison doit avoir un grand renom et une splendeur visible. La formulation française rend les deux dimensions sans les confondre.'
- source_word: לְכָל הָאֲרָצוֹת
  choice: dans tous les pays
  rationale: Le pluriel אֲרָצוֹת désigne ici les pays ou territoires parmi lesquels la renommée et la magnificence de la maison seront connues.
- source_word: אָכִינָה נָּא לוֹ
  choice: Je vais donc faire des préparatifs pour cela
  rationale: Le cohortatif exprime la résolution de David. נָא renforce ici son initiative immédiate, rendue naturellement par « donc » avec le futur proche. Le pronom renvoie très probablement à la maison ou à sa construction, sans exclure grammaticalement Salomon comme bénéficiaire.
- source_word: לָרֹב
  choice: d’abondants préparatifs
  rationale: L’expression indique que David prépara une très grande quantité de matériaux et de ressources ; l’adjectif « abondants » restitue cette idée avec fluidité.
- source_word: לִפְנֵי מוֹתוֹ
  choice: avant sa mort
  rationale: Traduction directe de l’expression temporelle hébraïque.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » conserve cette fonction et distingue le nom divin d’un simple titre.
- issue: Traduction de הַבַּיִת
  choice: la maison
  alternative: le temple
  rationale: « Maison » est le sens lexical direct et conserve la résonance théologique de la demeure consacrée à Yahweh ; « temple » est une explicitation contextuelle possible, signalée en note.
- issue: Rapport de לְשֵׁם וּלְתִפְאֶרֶת avec la grandeur de la maison
  choice: finalité exprimée par « afin d’être renommée et magnifique »
  alternative: qualité exprimée par « en renom et en splendeur »
  rationale: Les prépositions peuvent marquer le but ou le résultat sans imposer une distinction rigide. La traduction retient une finalité naturelle en français, tandis que la note conserve une formulation plus littérale.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement segmentée pour rester claire à l’oral comme à l’écrit. « Maison » préserve l’image hébraïque, tandis que « grandeur extraordinaire » et « d’abondants préparatifs » rendent naturellement l’intensité du texte.
