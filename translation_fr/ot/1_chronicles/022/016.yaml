  text: לַ/זָּהָ֥ב לַ/כֶּ֛סֶף וְ/לַ/נְּחֹ֥שֶׁת וְ/לַ/בַּרְזֶ֖ל אֵ֣ין מִסְפָּ֑ר ק֣וּם וַ/עֲשֵׂ֔ה וִ/יהִ֥י יְהוָ֖ה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/016.yaml
  text: For the gold[a], the silver, the bronze, and the iron, there is no number. Rise up and work[c][b], and may Yahweh be with you.
translation:
  language: fr
  text: Quant à l’or, à l’argent, au bronze[a] et au fer, ils sont innombrables[b]. Lève-toi et mets-toi à l’œuvre, et que Yahvé soit avec toi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cuivre ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il n’y a pas de nombre » ; autre traduction : « on ne peut pas les compter ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « Yahvé sera avec toi ». La forme hébraïque peut exprimer un souhait ou une bénédiction.
    reason: alternative_reading
lexical_decisions:
- source_word: לַזָּהָב לַכֶּסֶף וְלַנְּחֹשֶׁת וְלַבַּרְזֶל
  choice: Quant à l’or, à l’argent, au bronze et au fer
  rationale: La préposition ל répétée introduit ici vraisemblablement les matériaux comme thème. « Quant à » restitue naturellement cette reprise en français.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans une liste de matériaux destinés à la construction et au mobilier cultuel, le bronze est probablement le métal visé, même si le terme peut aussi désigner le cuivre.
- source_word: אֵין מִסְפָּר
  choice: ils sont innombrables
  rationale: Cette tournure idiomatique exprime une quantité impossible à compter. La formulation française est claire et conserve l’idée d’innombrabilité.
- source_word: קוּם וַעֲשֵׂה
  choice: Lève-toi et mets-toi à l’œuvre
  rationale: Les deux impératifs appellent Salomon à passer résolument à l’action. « Mets-toi à l’œuvre » convient au contexte de la construction sans préciser indûment un geste particulier.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: et que Yahvé soit avec toi
  rationale: La forme jussive exprime naturellement un souhait ou une bénédiction. Le nom divin est rendu par « Yahvé » plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » représente directement le nom divin et constitue une forme française largement reconnue.
- issue: Valeur de וִיהִי dans la bénédiction finale
  choice: que Yahvé soit avec toi
  alternative: Yahvé sera avec toi ; laisse Yahvé être avec toi
  rationale: Le jussif se comprend le plus naturellement comme un souhait ou une bénédiction, mais la forme hébraïque permet aussi une lecture proche de l’assurance au futur.
translation_notes:
  register: Français international actuel, digne et accessible. « Quant à » maintient la structure thématique de l’hébreu, tandis que « mets-toi à l’œuvre » rend l’exhortation de façon idiomatique dans le contexte de la construction.
