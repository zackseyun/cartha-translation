  text: וּ/בַרְזֶ֣ל לָ֠/רֹב לַֽ/מִּסְמְרִ֞ים לְ/דַלְת֧וֹת הַ/שְּׁעָרִ֛ים וְ/לַֽ/מְחַבְּר֖וֹת הֵכִ֣ין דָּוִ֑יד וּ/נְחֹ֥שֶׁת לָ/רֹ֖ב אֵ֥ין מִשְׁקָֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/003.yaml
  text: And David prepared iron in abundance for the nails for the doors of the gates and for the fastenings[b][a], and bronze in abundance without weight.
translation:
  language: fr
  text: David prépara du fer en abondance pour les clous destinés aux portes des portails et pour les pièces d’assemblage[a], ainsi que du bronze en quantité impossible à peser[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les charnières »; le terme hébreu désigne plus généralement des pièces servant à relier ou à assembler.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « il n’y avait pas de poids »; l’expression indique une quantité trop grande pour être pesée.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזֶל
  choice: fer
  rationale: Le nom désigne directement le fer, ici comme matériau de construction.
- source_word: לָרֹב
  choice: en abondance / en quantité impossible à peser
  rationale: La locution exprime une très grande quantité. « En abondance » convient au fer; avec אֵין מִשְׁקָל, la seconde occurrence est rendue naturellement par « en quantité impossible à peser ».
- source_word: מִּסְמְרִים
  choice: clous
  rationale: Dans ce contexte de portes, « clous » est le terme français courant tout en conservant la portée générale du mot hébreu.
- source_word: דַלְתוֹת הַשְּׁעָרִים
  choice: les portes des portails
  rationale: Cette formulation reproduit clairement le rapport entre les battants ou portes et les portails auxquels ils appartiennent, sans la lourdeur de « portes des portes ».
- source_word: מְחַבְּרוֹת
  choice: pièces d’assemblage
  rationale: Le terme désigne de façon générale des éléments servant à relier ou assembler. Cette traduction évite de préciser indûment qu’il s’agit de charnières.
- source_word: הֵכִין
  choice: prépara
  rationale: Le verbe signifie préparer ou mettre à disposition; « prépara » conserve le sens et la structure du texte.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans les listes bibliques de matériaux de construction, « bronze » est l’équivalent contextuel usuel, même si « cuivre » peut parfois être envisagé.
- source_word: אֵין מִשְׁקָל
  choice: en quantité impossible à peser
  rationale: Littéralement, l’expression évoque l’absence de pesée ou de poids déterminé; dans le contexte, elle indique hyperboliquement une quantité trop grande pour être pesée.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste proche de la syntaxe hébraïque, tout en évitant l’ambiguïté française de « portes des portes ». Les notes préservent l’incertitude concernant la quincaillerie et la forme littérale de l’hyperbole finale.
