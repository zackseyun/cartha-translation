  text: וַ/יֹּ֣אמֶר דָּוִ֔יד לִ/כְנוֹס֙ אֶת הַ/גֵּרִ֔ים אֲשֶׁ֖ר בְּ/אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יַּעֲמֵ֣ד חֹֽצְבִ֗ים לַ/חְצוֹב֙ אַבְנֵ֣י גָזִ֔ית לִ/בְנ֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/002.yaml
  text: And David ordered the foreigners who were in the land of Israel to be gathered[c][b][a], and he appointed stonecutters to cut dressed stones for building the house of God.
translation:
  language: fr
  text: David ordonna de rassembler les étrangers[a] qui se trouvaient dans le pays d’Israël. Il désigna des tailleurs de pierre pour tailler des pierres de taille[b] destinées à la construction de la maison de Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les résidents étrangers ». Le terme hébreu désigne des non-Israélites qui résident dans le pays.
    reason: lexical_alternative
  - marker: b
    text: Ou « des pierres taillées » ou « des pierres équarries ».
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire le temple.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ordonna
  rationale: Employé avec l’infinitif « rassembler », le verbe « dire » introduit ici une directive. « Ordonna » en rend naturellement la force en français.
- source_word: לִכְנוֹס
  choice: de rassembler
  rationale: L’infinitif exprime le contenu de l’ordre donné par David, sans laisser entendre qu’il rassemble lui-même ces personnes.
- source_word: הַגֵּרִים
  choice: les étrangers
  rationale: Le terme désigne des non-Israélites établis dans le pays. « Étrangers » est clair et courant; une note précise la nuance de résidence.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: dans le pays d’Israël
  rationale: La mention explicite du « pays » préserve אֶרֶץ et sa portée territoriale.
- source_word: וַיַּעֲמֵד
  choice: il désigna
  rationale: Dans ce contexte administratif, le verbe indique que David affecte des ouvriers à une tâche déterminée.
- source_word: חֹצְבִים
  choice: des tailleurs de pierre
  rationale: Le participe désigne les ouvriers chargés de travailler la pierre; cette expression est précise et naturelle en français moderne.
- source_word: לַחְצוֹב
  choice: pour tailler
  rationale: L’infinitif indique la tâche confiée aux ouvriers et conserve le lien lexical avec leur métier.
- source_word: אַבְנֵי גָזִית
  choice: des pierres de taille
  rationale: L’expression française usuelle désigne des pierres taillées et préparées pour la construction.
- source_word: לִבְנוֹת
  choice: destinées à la construction
  rationale: Cette formulation exprime clairement le but des pierres préparées, avec une syntaxe française fluide.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette traduction conserve l’image et la formulation hébraïques sans remplacer dans le texte le mot « maison » par son référent interprétatif, le temple.
theological_decisions:
- issue: Rendu de בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  alternative: le temple de Dieu
  rationale: Le projet concerne bien le futur temple, mais l’hébreu dit littéralement « maison de Dieu ». Le texte principal conserve cette expression, tandis qu’une note explicite le référent.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde les répétitions lexicales utiles autour de la taille de la pierre et conserve « maison de Dieu », tout en explicitant en note qu’il s’agit du temple.
