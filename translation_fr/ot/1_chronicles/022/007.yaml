source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר דָּוִ֖יד לִ/שְׁלֹמֹ֑ה בנ/ו אֲנִי֙ הָיָ֣ה עִם לְבָבִ֔/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֥ה אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/007.yaml
  text: And David said to Solomon his son[a], “As for me[b], it was in my heart to build a house for the name of Yahweh my God.”
translation:
  language: fr
  text: 'David dit à son fils Salomon : « Quant à moi, j’avais à cœur de construire une maison pour le nom de Yahweh, mon Dieu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le waw consécutif fait progresser le récit. En français moderne, le passé simple suffit naturellement, sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: à son fils Salomon
  rationale: Cette formulation est naturelle en français et restitue explicitement le lien filial exprimé par בְנוֹ.
- source_word: אֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant porte une certaine emphase; « Quant à moi » la rend sans lourdeur.
- source_word: הָיָה עִם לְבָבִי
  choice: j’avais à cœur
  rationale: Cette expression française courante conserve l’image du cœur tout en exprimant l’intention intérieure ou le dessein de David.
- source_word: לִבְנוֹת בַּיִת
  choice: de construire une maison
  rationale: בַּיִת signifie littéralement « maison ». Le maintien de ce terme préserve la diction théologique du texte, même si le référent est le temple.
- source_word: לְשֵׁם
  choice: pour le nom de
  rationale: La formulation conserve l’expression hébraïque et sa portée cultuelle, plutôt que de la réduire à « en l’honneur de ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהָי
  choice: mon Dieu
  rationale: Le suffixe possessif de première personne est explicite et doit être conservé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom divin plutôt que de lui substituer un titre.
- issue: Rendu de בַּיִת dans le contexte du sanctuaire
  choice: maison
  alternative: temple
  rationale: L’hébreu dit « maison ». Ce choix maintient le vocabulaire source et l’expression « une maison pour le nom de Yahweh », tandis que « temple » expliciterait le référent.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est naturelle, tout en conservant l’emphase de אֲנִי, l’image du cœur, le terme « maison » et la formule théologique « pour le nom de Yahweh ».
