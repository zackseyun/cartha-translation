source:
  edition: WLC
  text: וַ/עֲצֵ֥י אֲרָזִ֖ים לְ/אֵ֣ין מִסְפָּ֑ר כִּֽי הֵ֠בִיאוּ הַ/צִּֽידֹנִ֨ים וְ/הַ/צֹּרִ֜ים עֲצֵ֧י אֲרָזִ֛ים לָ/רֹ֖ב לְ/דָוִֽיד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/004.yaml
  text: and cedar timbers without number[a], for the Sidonians and Tyrians had brought cedar timbers in abundance to David.
translation:
  language: fr
  text: et du bois de cèdre en quantité incalculable[a], car les Sidoniens et les Tyriens avaient apporté à David du bois de cèdre en abondance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des pièces de bois de cèdre ». Le terme hébreu peut désigner de manière générale le bois ou les éléments tirés des cèdres; dans ce contexte de construction, il s’agit vraisemblablement de matériau de construction.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲצֵי אֲרָזִים
  choice: et du bois de cèdre
  rationale: Dans ce contexte de matériaux destinés à la construction, עֲצֵי אֲרָזִים désigne vraisemblablement le matériau plutôt que des arbres sur pied. « Bois de cèdre » est naturel en français et conserve la portée générale de l’hébreu.
- source_word: לְ/אֵין מִסְפָּר
  choice: en quantité incalculable
  rationale: L’expression hébraïque indique qu’il n’était pas possible d’en établir le nombre. Cette formulation française rend clairement l’idée d’une quantité immense tout en convenant à un nom massif.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici l’explication de la quantité mentionnée auparavant. « Car » maintient le lien explicatif et le registre narratif.
- source_word: הֵבִיאוּ
  choice: avaient apporté
  rationale: Le parfait hiphil signifie « ils ont apporté ». Le plus-que-parfait français situe naturellement cet apport avant la situation décrite dans le récit.
- source_word: הַ/צִּידֹנִים
  choice: les Sidoniens
  rationale: Ce gentilé pluriel désigne les habitants de Sidon; « les Sidoniens » est la forme française courante et concise.
- source_word: וְ/הַ/צֹּרִים
  choice: et les Tyriens
  rationale: Ce gentilé pluriel désigne les habitants de Tyr; « les Tyriens » est la forme française usuelle et forme un parallèle naturel avec « les Sidoniens ».
- source_word: לָ/רֹב
  choice: en abondance
  rationale: La locution exprime une grande quantité. « En abondance » est idiomatique et approprié à l’approvisionnement en matériaux.
- source_word: לְ/דָוִד
  choice: à David
  rationale: La préposition ל marque ici le destinataire; « à David » en est le rendu le plus direct.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve son ouverture par « et », puisqu’elle poursuit l’énumération du verset précédent. Le choix du nom massif « bois de cèdre » évite l’expression moins idiomatique « bois de cèdres » et rend bien le matériau de construction.
