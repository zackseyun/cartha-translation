source:
  edition: WLC
  text: וְ/הִנֵּ֨ה בְ/עָנְיִ֜/י הֲכִינ֣וֹתִי לְ/בֵית יְהוָ֗ה זָהָ֞ב כִּכָּרִ֤ים מֵֽאָה אֶ֨לֶף֙ וְ/כֶ֗סֶף אֶ֤לֶף אֲלָפִים֙ כִּכָּרִ֔ים וְ/לַ/נְּחֹ֤שֶׁת וְ/לַ/בַּרְזֶל֙ אֵ֣ין מִשְׁקָ֔ל כִּ֥י לָ/רֹ֖ב הָיָ֑ה וְ/עֵצִ֤ים וַ/אֲבָנִים֙ הֲכִינ֔וֹתִי וַ/עֲלֵי/הֶ֖ם תּוֹסִֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/014.yaml
  text: Behold[a], in my affliction I have prepared for the house of Yahweh one hundred thousand talents of gold, and one million talents of silver; and for the bronze and the iron there is no weighing, for it was in abundance. I have prepared timber and stones[c][b], and you may add to them.
translation:
  language: fr
  text: 'Voici : dans ma détresse[a], j’ai préparé pour la maison de Yahweh cent mille talents d’or et un million[b] de talents d’argent. Quant au bronze et au fer, impossible d’en indiquer le poids, tant il y en a. J’ai aussi préparé du bois de construction et des pierres, et tu en ajouteras[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ma pauvreté ». Le terme hébreu peut désigner l’affliction, les difficultés ou la pauvreté.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mille milliers ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « tu peux en ajouter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Voici
  rationale: « Voici » rend directement la particule présentative הִנֵּה sans lui ajouter une valeur temporelle absente de l’hébreu.
- source_word: בְעָנְיִי
  choice: dans ma détresse
  rationale: עֳנִי désigne ici l’affliction, la misère ou les difficultés. « Dans ma détresse » préserve cette amplitude mieux qu’une référence exclusivement financière à la pauvreté.
- source_word: הֲכִינוֹתִי
  choice: j’ai préparé
  rationale: Le hifil de כון signifie « préparer, mettre en état ». Le passé composé exprime naturellement en français une préparation achevée dont les résultats sont disponibles pour Salomon.
- source_word: לְבֵית יְהוָה
  choice: pour la maison de Yahweh
  rationale: « Maison » conserve l’image hébraïque de בַּיִת, tout en désignant clairement le futur temple dans le contexte. Le nom divin est transcrit « Yahweh ».
- source_word: כִּכָּרִים
  choice: talents
  rationale: Le talent est l’équivalent traditionnel et reconnu de cette grande unité de poids antique.
- source_word: מֵאָה אֶלֶף
  choice: cent mille
  rationale: Traduction directe du nombre hébreu.
- source_word: אֶלֶף אֲלָפִים
  choice: un million
  rationale: Cette formulation française actuelle communique clairement la quantité exprimée littéralement en hébreu par « mille milliers ».
- source_word: וְלַנְּחֹשֶׁת וְלַבַּרְזֶל אֵין מִשְׁקָל
  choice: Quant au bronze et au fer, impossible d’en indiquer le poids
  rationale: La tournure rend le sens de « il n’y a pas de poids/pesée » sans laisser entendre que les métaux seraient dépourvus de poids. Elle conserve l’idée qu’aucun poids ne peut être fourni en raison de l’abondance.
- source_word: כִּי לָרֹב הָיָה
  choice: tant il y en a
  rationale: 'Cette expression française naturelle transmet la raison donnée par le texte : la quantité des métaux est extrêmement grande.'
- source_word: וְעֵצִים וַאֲבָנִים
  choice: J’ai aussi préparé du bois de construction et des pierres
  rationale: Dans le contexte du chantier du temple, עֵצִים désigne naturellement du bois destiné à la construction. Le verbe « préparé », sous-entendu en hébreu à cet endroit, est repris en français pour la clarté.
- source_word: וַעֲלֵיהֶם תּוֹסִיף
  choice: et tu pourras en ajouter
  rationale: 'L’inaccompli hifil adressé à Salomon peut exprimer ici une possibilité ou une consigne atténuée : David a préparé les matériaux, et Salomon peut compléter les réserves.'
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La transcription « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Force modale de וַעֲלֵיהֶם תּוֹסִיף
  choice: tu pourras en ajouter
  alternative: tu en ajouteras
  rationale: La forme hébraïque permet aussi bien une permission qu’une instruction ou l’annonce d’une action future. Le texte principal retient la permission adaptée au contexte, tandis que la note préserve la lecture plus ferme.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression hébraïque, mais « impossible d’en indiquer le poids » évite une formulation française trompeuse. Les nombres sont donnés en toutes lettres, et les ambiguïtés lexicales ou modales significatives sont conservées en notes.
