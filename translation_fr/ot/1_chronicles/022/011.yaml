source:
  edition: WLC
  text: עַתָּ֣ה בְנִ֔/י יְהִ֥י יְהוָ֖ה עִמָּ֑/ךְ וְ/הִצְלַחְתָּ֗ וּ/בָנִ֨יתָ֙ בֵּ֚ית יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר עָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/011.yaml
  text: Now[a], my son, may Yahweh be with you, and may you prosper and build the house of Yahweh your God[c][b], as he has spoken concerning you.
translation:
  language: fr
  text: Maintenant, mon fils, que Yahweh soit avec toi ! Puisses-tu réussir[a] et bâtir la maison[b] de Yahweh, ton Dieu, comme il l’a dit à ton sujet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prospérer » ; le verbe hébreu peut exprimer la réussite ou la prospérité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le temple de Yahweh, ton Dieu ». Littéralement : « la maison de Yahweh, ton Dieu ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « comme il te l’a promis ». Plus littéralement : « comme il a parlé à ton sujet ».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: Marqueur temporel et discursif qui introduit naturellement la bénédiction et l’exhortation de David.
- source_word: בְנִי
  choice: mon fils
  rationale: Rend directement l’adresse paternelle avec le suffixe de première personne.
- source_word: יְהִי יְהוָה עִמָּךְ
  choice: que Yahweh soit avec toi
  rationale: Le jussif יְהִי exprime ici un souhait ou une bénédiction, non une simple prédiction.
- source_word: וְהִצְלַחְתָּ
  choice: Puisses-tu réussir
  rationale: Le hiphil de צלח peut signifier réussir ou prospérer. « Réussir » convient à l’accomplissement de la construction sans suggérer principalement la richesse matérielle.
- source_word: וּבָנִיתָ
  choice: et bâtir
  rationale: Le verbe est coordonné au précédent et intégré à la portée souhaitative de la bénédiction; l’infinitif après « puisses-tu » donne une formulation française fluide.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: la maison de Yahweh, ton Dieu
  rationale: « Maison » préserve l’image et la formulation hébraïques; « temple » est une explicitation contextuelle signalée en note.
- source_word: כַּאֲשֶׁר דִּבֶּר עָלֶיךָ
  choice: comme il l’a déclaré à ton sujet
  rationale: Rend דבר + על sans transformer implicitement la parole divine en promesse explicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » en préserve la fonction de nom propre.
- issue: Valeur de la séquence verbale après יְהִי
  choice: 'Bénédiction et souhait : « que Yahweh soit… Puisses-tu réussir et bâtir »'
  alternative: 'Prédiction : « Yahweh sera… tu réussiras et bâtiras »'
  rationale: Le jussif initial favorise nettement une lecture bénédictive. Les parfaits coordonnés peuvent être compris dans son prolongement, tout en laissant percevoir l’accomplissement attendu.
- issue: Sens de דִּבֶּר עָלֶיךָ
  choice: « il l’a déclaré à ton sujet »
  alternative: « il te l’a promis »
  rationale: Le contexte peut évoquer une promesse, mais le verbe signifie littéralement parler ou déclarer; la traduction évite donc de préciser plus que l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation distingue la bénédiction portant sur la présence divine du souhait concernant la réussite de Salomon, sans rompre leur lien. « Bâtir » conserve un registre biblique courant sans être archaïque.
