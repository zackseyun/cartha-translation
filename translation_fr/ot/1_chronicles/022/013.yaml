id: 1CH.22.13
reference: 1 Chronicles 22:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֣ז תַּצְלִ֔יחַ אִם תִּשְׁמ֗וֹר לַ/עֲשׂוֹת֙ אֶת הַֽ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה עַל יִשְׂרָאֵ֑ל חֲזַ֣ק וֶ/אֱמָ֔ץ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/013.yaml
  text: Then you will prosper[a], if you are careful to do the statutes and the judgments that Yahweh commanded Moses for Israel. Be strong and courageous. Do not fear[b], and do not be dismayed.
translation:
  language: fr
  text: Alors tu réussiras[a], si tu veilles à mettre en pratique les prescriptions et les règles[b] que Yahweh a commandées à Moïse pour Israël. Sois fort et courageux. N’aie pas peur et ne te laisse pas abattre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu prospéreras ». Le verbe hébreu peut désigner aussi bien la réussite que la prospérité.
    reason: lexical_alternative
  - marker: b
    text: Ou « les décrets et les ordonnances ». L’hébreu emploie deux termes juridiques distincts.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Introduit ici la conséquence de l’exhortation précédente, de manière naturelle en français.
- source_word: תַּצְלִיחַ
  choice: tu réussiras
  rationale: Le hiphil de צלח peut exprimer la réussite ou la prospérité. « Réussiras » évite en français une connotation exclusivement matérielle, tout en conservant l’idée d’une entreprise menée à bien.
- source_word: אִם תִּשְׁמֹר לַעֲשׂוֹת
  choice: si tu veilles à mettre en pratique
  rationale: L’expression associe l’idée de garder avec celle d’agir; cette formulation française rend l’attention vigilante et l’obéissance concrète.
- source_word: הַחֻקִּים
  choice: les prescriptions
  rationale: Rend le caractère établi et normatif de חֻקִּים, tout en le distinguant du terme juridique suivant.
- source_word: הַמִּשְׁפָּטִים
  choice: les règles
  rationale: Dans ce contexte de Torah, le mot désigne des règles ou dispositions de droit. « Règles » reste compréhensible et distinct de « prescriptions ».
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה עַל יִשְׂרָאֵל
  choice: que Yahweh a commandées à Moïse pour Israël
  rationale: Conserve Moïse comme destinataire direct du commandement et rend עַל par « pour », Israël étant le peuple concerné. La tournure demeure légèrement marquée, comme l’hébreu, mais intelligible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé directement dans le texte hébreu.
- source_word: חֲזַק וֶאֱמָץ
  choice: Sois fort et courageux
  rationale: Rend la formule d’exhortation hébraïque par une expression française courante, digne et directe.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Formulation idiomatique et directe de l’interdiction en français moderne.
- source_word: וְאַל תֵּחָת
  choice: et ne te laisse pas abattre
  rationale: Le verbe peut évoquer le fait d’être brisé, consterné ou découragé. Cette expression naturelle conserve la force de l’exhortation sans suggérer une simple émotion passagère.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom d’alliance au lieu de le remplacer par un titre.
- issue: Lien entre réussite et observance
  choice: Conserver la proposition conditionnelle « si »
  alternative: Reformuler comme une promesse inconditionnelle de prospérité
  rationale: L’hébreu rattache explicitement la réussite à l’observance attentive des prescriptions et des règles. La traduction maintient cette tension sans élargir la promesse à une prospérité matérielle générale.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète l’adresse personnelle à Salomon. « Mettre en pratique » explicite idiomatiquement l’obéissance active, tandis que « ne te laisse pas abattre » rend la gravité de חתת dans un français courant.
