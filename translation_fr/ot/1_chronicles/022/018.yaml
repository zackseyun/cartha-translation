source:
  edition: WLC
  text: הֲ/לֹ֨א יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ עִמָּ/כֶ֔ם וְ/הֵנִ֥יחַ לָ/כֶ֖ם מִ/סָּבִ֑יב כִּ֣י נָתַ֣ן בְּ/יָדִ֗/י אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נִכְבְּשָׁ֥ה הָ/אָ֛רֶץ לִ/פְנֵ֥י יְהוָ֖ה וְ/לִ/פְנֵ֥י עַמּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/018.yaml
  text: Is not Yahweh your God with you? And has he not given you rest on every side? For he has given the inhabitants of the land into my hand[a], and the land has been subdued before Yahweh and before his people.
translation:
  language: fr
  text: Yahweh, votre Dieu, n’est-il pas avec vous ? Ne vous a-t-il pas accordé le repos de tous côtés ? En effet, il a livré entre mes mains les habitants du pays, et le pays a été soumis devant Yahweh et devant son peuple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le pronom « son » renvoie très probablement à Yahweh ; il pourrait toutefois être compris comme renvoyant à David. On pourrait aussi traduire : « sous le regard de son peuple ».'
    reason: Préserver l’ambiguïté possible du référent du suffixe et signaler la nuance sémantique de לִפְנֵי.
lexical_decisions:
- source_word: הֲלֹא
  choice: n’est-il pas / ne… a-t-il pas
  rationale: La particule introduit une question rhétorique qui attend une réponse affirmative. La formulation interrogative française en conserve la force.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם עִמָּכֶם
  choice: votre Dieu… avec vous
  rationale: Dans ce contexte, אֱלֹהִים désigne au singulier le Dieu d’Israël, et עִם exprime sa présence favorable auprès du peuple.
- source_word: וְהֵנִיחַ לָכֶם מִסָּבִיב
  choice: Ne vous a-t-il pas accordé le repos de tous côtés ?
  rationale: Le verbe désigne ici le repos ou la tranquillité accordés face aux ennemis environnants. La répétition interrogative rend explicite en français la portée de הֲלֹא sur les deux propositions.
- source_word: כִּי
  choice: En effet
  rationale: La conjonction introduit le fondement de la question rhétorique précédente. « En effet » exprime naturellement ce lien explicatif.
- source_word: נָתַן בְּיָדִי
  choice: il a livré entre mes mains
  rationale: L’expression idiomatique signifie placer sous le pouvoir de quelqu’un. « Livrer entre mes mains » conserve l’image hébraïque tout en étant idiomatique en français.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: les habitants du pays
  rationale: Cette formulation rend directement le participe substantivé et convient au contexte territorial.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: le pays a été soumis
  rationale: Le niphal de כבש exprime le fait d’avoir été assujetti ou maîtrisé; le passé composé souligne le résultat acquis.
- source_word: לִפְנֵי יְהוָה וְלִפְנֵי עַמּוֹ
  choice: devant Yahweh et devant son peuple
  rationale: « Devant » maintient le parallélisme de l’hébreu et laisse à l’expression sa portée de présence, d’autorité ou de regard.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le représente directement sans substituer un titre confessionnel traditionnel.
- issue: Référent du suffixe dans עַמּוֹ (« son peuple »)
  choice: Le texte principal laisse grammaticalement « son » se rapporter naturellement à Yahweh.
  alternative: Le suffixe peut être compris comme renvoyant à David.
  rationale: Yahweh est l’antécédent saillant et le plus proche dans la proposition, et l’association « Yahweh et son peuple » est naturelle. Une note conserve toutefois l’autre possibilité grammaticale sans résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions rhétoriques sont formulées naturellement; « repos de tous côtés » conserve le vocabulaire biblique sans devenir obscur. Le marqueur [a] figure dans le texte principal.
