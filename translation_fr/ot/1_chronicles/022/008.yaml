source:
  edition: WLC
  text: וַ/יְהִ֨י עָלַ֤/י דְּבַר יְהוָה֙ לֵ/אמֹ֔ר דָּ֤ם לָ/רֹב֙ שָׁפַ֔כְתָּ וּ/מִלְחָמ֥וֹת גְּדֹל֖וֹת עָשִׂ֑יתָ לֹֽא תִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י כִּ֚י דָּמִ֣ים רַבִּ֔ים שָׁפַ֥כְתָּ אַ֖רְצָ/ה לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/008.yaml
  text: But the word of Yahweh came to me[a], saying, ‘You have shed much blood and fought great wars. You shall not build a house for my name[d][c][b], because you have shed much blood on the earth before me.’
translation:
  language: fr
  text: 'La parole de Yahweh m’est parvenue : « Tu as versé beaucoup de sang[a] et mené de grandes guerres[b]. Tu ne bâtiras pas de maison pour mon nom[c], car tu as versé beaucoup de sang à terre[d] devant moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du sang en abondance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « livré de grandes guerres ».'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire le temple.
    reason: cultural_note
  - marker: d
    text: 'Ou : « sur la terre » ou « vers le sol ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עָלַי דְּבַר יְהוָה
  choice: Mais la parole de Yahweh m’est parvenue
  rationale: 'Rend naturellement l’idiome hébreu selon lequel la parole divine vient sur quelqu’un, tout en conservant « parole » et le nom divin Yahweh. Le contexte donne à וַ une valeur contrastive appropriée : « Mais ».'
- source_word: דָּם לָרֹב
  choice: beaucoup de sang
  rationale: Conserve l’image concrète du sang et exprime clairement sa grande quantité.
- source_word: שָׁפַכְתָּ
  choice: tu as versé
  rationale: Avec « sang », le verbe forme l’expression française courante « verser du sang ».
- source_word: וּמִלְחָמוֹת גְּדֹלוֹת עָשִׂיתָ
  choice: et mené de grandes guerres
  rationale: « Mener des guerres » est une expression française naturelle qui rend le sens de l’hébreu littéral « faire de grandes guerres ».
- source_word: לֹא תִבְנֶה בַיִת לִשְׁמִי
  choice: Tu ne bâtiras pas de maison pour mon nom
  rationale: Conserve « maison » et « pour mon nom », formulations importantes du texte, sans remplacer explicitement la maison par le temple.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français la raison de l’interdiction.
- source_word: דָּמִים רַבִּים
  choice: beaucoup de sang
  rationale: Préserve la reprise lexicale et l’image concrète, bien que le pluriel hébreu puisse évoquer plus précisément le sang versé ou les actes sanglants.
- source_word: אַרְצָה
  choice: à terre
  rationale: Rend la valeur directionnelle de la forme hébraïque, littéralement « vers la terre/le sol », et convient idiomatiquement au sang versé.
- source_word: לְפָנָי
  choice: devant moi
  rationale: Traduction directe qui maintient l’idée que ces actes ont eu lieu sous le regard de Dieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom personnel de l’alliance.
- issue: Sens de בַיִת dans le contexte du sanctuaire
  choice: maison
  alternative: temple
  rationale: Le référent est bien le temple, mais le mot hébreu signifie « maison ». Le conserver maintient le motif biblique de la maison bâtie pour le nom de Dieu.
- issue: Portée de דָּמִים רַבִּים
  choice: beaucoup de sang
  alternative: de nombreux actes sanglants / beaucoup de sang versé
  rationale: La formulation concrète respecte la reprise du texte et n’impose pas une interprétation technique de culpabilité liée au sang, même si le pluriel hébreu peut porter cette nuance.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur « tu ne bâtiras pas » préserve l’ambiguïté entre annonce et interdiction. La répétition de « beaucoup de sang » reproduit l’insistance hébraïque.
