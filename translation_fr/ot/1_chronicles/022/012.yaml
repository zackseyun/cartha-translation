source:
  edition: WLC
  text: אַ֣ךְ יִֽתֶּן לְּ/ךָ֤ יְהוָה֙ שֵׂ֣כֶל וּ/בִינָ֔ה וִֽ/יצַוְּ/ךָ֖ עַל יִשְׂרָאֵ֑ל וְ/לִ/שְׁמ֕וֹר אֶת תּוֹרַ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/012.yaml
  text: Only[a], may Yahweh give you insight and understanding, and command you concerning Israel[b], that you may keep the law of Yahweh your God.
translation:
  language: fr
  text: Que Yahweh t’accorde seulement discernement et intelligence, qu’il te donne la responsabilité d’Israël[a], afin que tu observes la loi[b] de Yahweh, ton Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il te donne des directives concernant Israël » ; l’hébreu peut aussi exprimer l’attribution d’une responsabilité sur Israël.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’instruction » de Yahweh, ton Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Seulement
  rationale: La particule restrictive ou focalisante introduit ici le souhait de David en mettant cette demande au premier plan.
- source_word: יִתֶּן
  choice: que … donne
  rationale: L’imparfait a ici une valeur de souhait ou de bénédiction, rendue naturellement en français par « que Yahweh te donne ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, conformément à la pratique du projet.
- source_word: שֵׂכֶל וּבִינָה
  choice: discernement et intelligence
  rationale: « Discernement » exprime la sagesse pratique de שֵׂכֶל, tandis qu’« intelligence » rend בִינָה sans confondre les deux termes.
- source_word: וִיצַוְּךָ עַל יִשְׂרָאֵל
  choice: qu’il te confie la charge d’Israël
  rationale: Dans ce contexte royal, צוה avec עַל peut exprimer une responsabilité confiée sur Israël. La formulation française reste naturelle tout en signalant en note le sens plus directement verbal de « donner des ordres ».
- source_word: וְלִשְׁמוֹר
  choice: afin que tu respectes
  rationale: Le waw suivi de l’infinitif exprime ici le but. « Respecter » rend l’observance effective demandée par שמר.
- source_word: תּוֹרַת
  choice: la loi
  rationale: Dans ce contexte d’alliance, « loi » est clair et traditionnel, tandis qu’une note conserve le sens plus large d’« instruction ».
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend directement le nom avec le suffixe masculin singulier adressé à Salomon.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom propre divin.
- issue: Sens de וִיצַוְּךָ עַל יִשְׂרָאֵל
  choice: qu’il te confie la charge d’Israël
  alternative: qu’il te donne des ordres au sujet d’Israël
  rationale: Le contexte de la royauté de Salomon favorise l’idée d’une charge confiée, mais la construction hébraïque permet aussi de comprendre que Yahweh lui donne des ordres concernant Israël; cette ambiguïté est conservée en note.
- issue: Portée de תּוֹרָה
  choice: loi
  alternative: instruction
  rationale: « Loi » convient au cadre d’alliance, sans nier la dimension d’enseignement du terme hébreu, indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe de David à Salomon. Les deux membres « discernement et intelligence » préservent le parallélisme sans employer deux synonymes identiques.
