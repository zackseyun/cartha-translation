  text: בְּנֵ֖י יְחִֽיאֵלִ֑י זֵתָם֙ וְ/יוֹאֵ֣ל אָחִ֔י/ו עַל אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/022.yaml
  text: 'The sons of Jehieli: Zetham and Joel his brother were over the treasuries of the house of Yahweh[a].'
translation:
  language: fr
  text: 'Les fils de Yehieli : Zétam et son frère Joël avaient la charge des trésors de la maison de Yahweh[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « maison de Yahweh » ; traditionnellement rendu par « maison de l’Éternel ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יְחִיאֵלִי
  choice: Les fils de Yehieli
  rationale: Le pluriel construit de בֵּן est rendu directement par « les fils de ». יְחִיאֵלִי est traité comme un nom propre en apposition, conformément au contexte généalogique et administratif.
- source_word: זֵתָם וְיוֹאֵל אָחִיו
  choice: Zétam et son frère Joël
  rationale: La formulation française place naturellement « son frère » avant Joël tout en préservant le suffixe masculin singulier de אָחִיו, qui présente Joël comme le frère de Zétam.
- source_word: עַל
  choice: étaient responsables de
  rationale: Dans ce contexte administratif, עַל indique une fonction de surveillance ou de responsabilité. Cette expression est plus naturelle en français actuel que le calque « étaient sur ».
- source_word: אֹצְרוֹת
  choice: les trésors
  rationale: Le terme désigne ici les réserves précieuses placées sous administration dans la maison de Yahweh. « Trésors » conserve le sens lexical sans imposer qu'il s'agisse uniquement de locaux de stockage.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » traduit formellement בֵּית et maintient l'expression cultuelle hébraïque; le nom divin est translittéré « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin, tandis que la note signale l'usage traditionnel français.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe administrative est rendue idiomatiquement, tandis que « maison de Yahweh » conserve la forme et la portée cultuelle de l'hébreu.
