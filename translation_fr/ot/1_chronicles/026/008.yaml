base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/008.yaml
  text: All these were from the sons of Obed-edom—they and their sons and their brothers, able men with strength for the service—sixty-two belonging to Obed-edom.
translation:
  language: fr
  text: 'Tous ceux-là étaient issus des fils d’Obed-Édom : eux, leurs fils et leurs frères[a], des hommes capables et forts pour le service[b] ; ils étaient soixante-deux pour Obed-Édom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « leurs proches parents » : le mot hébreu traduit par « frères » peut désigner plus largement les hommes de la parenté ou du clan.'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque peut aussi se traduire par « hommes de valeur, doués de force » ; dans ce contexte, elle souligne vraisemblablement leur aptitude et leur vigueur pour le service.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי עֹבֵד אֱדֹם
  choice: des descendants d’Obed-Édom
  rationale: Littéralement « d’entre les fils d’Obed-Édom ». En français généalogique, « descendants » exprime naturellement l’appartenance à sa lignée sans laisser entendre qu’ils étaient tous ses fils immédiats.
- source_word: הֵמָּה וּבְנֵיהֶם וַאֲחֵיהֶם
  choice: eux, leurs fils et leurs frères
  rationale: La formulation conserve les trois groupes et rend אֲחֵיהֶם par son sens direct, « leurs frères », tout en signalant en note son extension possible aux hommes de la parenté.
- source_word: אִישׁ חַיִל בַּכֹּחַ
  choice: des hommes capables et forts
  rationale: Dans le contexte du service assigné, חַיִל indique l’aptitude ou la valeur, tandis que כֹּחַ exprime la force. Cette traduction conserve les deux idées sans donner à l’expression un sens exclusivement militaire.
- source_word: לַעֲבֹדָה
  choice: pour le service
  rationale: Le terme désigne ici la tâche ou le service auquel ces hommes étaient affectés. « Service » convient au contexte cultuel sans ajouter explicitement « du Temple », absent de ce verset.
- source_word: שִׁשִּׁים וּשְׁנַיִם לְעֹבֵד אֱדֹם
  choice: Ils étaient soixante-deux, rattachés à Obed-Édom
  rationale: Le nombre est rendu directement, et le לְ final comme une relation d’appartenance au groupe ou à la maison d’Obed-Édom. Une nouvelle phrase évite une construction nominale lourde en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. « Obed-Édom » suit la forme française usuelle. La ponctuation clarifie l’énumération et le total tout en préservant le rapport de ces hommes à la lignée d’Obed-Édom.
