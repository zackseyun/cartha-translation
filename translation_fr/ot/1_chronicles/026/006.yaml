  naturalness: La phrase est naturelle et conserve une cadence généalogique appropriée. « Avaient autorité sur la maison de leur père » est à la fois plus précis et idiomatique que « exerçaient l’autorité dans leur famille paternelle ».
  terminology: « Hommes forts et valeureux » rend de manière recevable גִּבּוֹרֵי חַיִל sans imposer un sens exclusivement militaire. « Maison de leur père » préserve le terme social et familial hébreu; la note explicite son sens collectif.
