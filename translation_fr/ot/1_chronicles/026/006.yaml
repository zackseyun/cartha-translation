  text: וְ/לִֽ/שְׁמַֽעְיָ֤ה בְנ/וֹ֙ נוֹלַ֣ד בָּנִ֔ים הַ/מִּמְשָׁלִ֖ים לְ/בֵ֣ית אֲבִי/הֶ֑ם כִּֽי גִבּ֥וֹרֵי חַ֖יִל הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/006.yaml
  text: And to Shemaiah his son[a], sons were born who ruled over their fathers’ house[b], for they were mighty men of valor.
translation:
  language: fr
  text: À Shemaïa, son fils, naquirent des fils qui avaient autorité sur la maison de leur père[a], car c’étaient des hommes forts et valeureux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui dirigeaient la maison de leur père ». La « maison du père » désigne la maisonnée ou le groupe familial paternal.'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque peut désigner des hommes reconnus pour leur force, leur bravoure, leur compétence ou leur valeur, et pas seulement des guerriers.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁמַעְיָה בְנוֹ
  choice: À Shemaeya, son fils
  rationale: La préposition לְ avec la formule de naissance se rend naturellement par « à », tandis que בְנוֹ identifie Shemaeya comme le fils d’Obed-Édom mentionné auparavant. Le וְ de liaison n’a pas besoin d’être rendu par « et » en français moderne dans cette liste.
- source_word: נוֹלַד בָּנִים
  choice: naquirent des fils
  rationale: Bien que le verbe hébreu ait formellement une forme au singulier, son sujet sémantique est le pluriel בָּנִים ; le français exige donc le pluriel. L’inversion conserve une tournure généalogique naturelle et digne.
- source_word: הַמִּמְשָׁלִים
  choice: qui exerçaient l’autorité
  rationale: Le participe de משל exprime ici l’exercice d’une autorité ou d’une direction. Cette formulation évite de préciser sans preuve s’il s’agissait d’une domination politique, militaire ou simplement familiale.
- source_word: לְבֵית אֲבִיהֶם
  choice: dans leur famille paternelle
  rationale: בֵּית אָב désigne la maison paternelle comme unité familiale ou clanique, plutôt qu’un bâtiment. « Famille paternelle » est clair en français moderne et maintient le singulier collectif de בֵית.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’autorité exercée par ces fils.
- source_word: גִּבּוֹרֵי חַיִל
  choice: des hommes forts et valeureux
  rationale: L’expression peut évoquer la bravoure, la force, la capacité ou la valeur reconnue. Cette traduction conserve sa vigueur sans la limiter au domaine militaire.
- source_word: הֵמָּה
  choice: c’étaient
  rationale: Le pronom indépendant donne du relief à l’affirmation ; la tournure présentative française « c’étaient » le reflète naturellement.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère généalogique du verset tout en explicitant le sens social de « maison du père » et sans réduire גִּבּוֹרֵי חַיִל à une acception exclusivement militaire.
