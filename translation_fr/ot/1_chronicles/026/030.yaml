  text: לַֽ/חֶבְרוֹנִ֡י חֲשַׁבְיָהוּ֩ וְ/אֶחָ֨י/ו בְּנֵי חַ֜יִל אֶ֣לֶף וּ/שְׁבַע מֵא֗וֹת עַ֚ל פְּקֻדַּ֣ת יִשְׂרָאֵ֔ל מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן מַעְרָ֑בָ/ה לְ/כֹל֙ מְלֶ֣אכֶת יְהוָ֔ה וְ/לַ/עֲבֹדַ֖ת הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/030.yaml
  text: 'For the Hebronites: Hashabiah and his brothers[a], 1,700 capable men, were in charge of the oversight of Israel west of the Jordan, for all the work of the LORD and for the service of the king.'
translation:
  language: fr
  text: Quant aux Hébronites, Hashabia et ses frères, soit 1 700 hommes compétents, étaient chargés de superviser Israël à l’ouest du Jourdain[a], pour toute l’œuvre de Yahvé et pour le service du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au-delà du Jourdain, vers l’ouest », c’est-à-dire du côté occidental du Jourdain.'
    reason: La note conserve la formulation spatiale de l’hébreu, tandis que le texte principal en donne le sens géographique naturel en français.
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: Quant aux Hébronites
  rationale: Le singulier collectif désigne ici le groupe lévitique des Hébronites. Cette tournure s’insère naturellement dans une liste administrative.
- source_word: חֲשַׁבְיָהוּ
  choice: Hashabia
  rationale: Translittération française usuelle du nom hébreu.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: Conserve le sens familial direct, tout en laissant ouverte la possibilité contextuelle de membres plus largement apparentés au même clan.
- source_word: בְּנֵי חַיִל
  choice: hommes compétents
  rationale: Dans ce contexte administratif, l’expression souligne l’aptitude et la capacité plutôt qu’une valeur spécifiquement guerrière.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 1 700
  rationale: Notation numérique conforme à l’usage typographique français moderne.
- source_word: עַל פְּקֻדַּת יִשְׂרָאֵל
  choice: étaient responsables de la surveillance d’Israël
  rationale: פְּקֻדָּה peut désigner une charge, une responsabilité ou une supervision. La formulation française préserve ici la nuance administrative sans la préciser excessivement.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מַעְרָבָה
  choice: à l’ouest du Jourdain
  rationale: Équivalent français clair de l’indication géographique; la formulation hébraïque plus littérale est signalée en note.
- source_word: לְכֹל מְלֶאכֶת יְהוָה
  choice: pour tout le travail de Yahvé
  rationale: מְלָאכָה couvre largement le travail, les tâches ou les affaires. « Tout le travail » conserve cette ampleur.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Restitue en français le nom divin représenté par le tétragramme hébreu, plutôt que de le remplacer silencieusement par un titre.
- source_word: וְלַעֲבֹדַת הַמֶּלֶךְ
  choice: et pour le service du roi
  rationale: עֲבֹדָה désigne ici le service ou les fonctions accomplies pour le roi, en parallèle avec le travail relatif à Yahvé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte source emploie directement le tétragramme. « Yahvé » le rend comme nom propre en français et évite de substituer un titre, sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe administrative reste perceptible sans lourdeur; « soit » relie naturellement l’effectif à Hashabia et à ses frères. Le marqueur de note est placé après l’expression géographique qu’il explique.
