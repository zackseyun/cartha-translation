  text: וּ/לְ/חֹסָ֥ה מִן בְּנֵי מְרָרִ֖י בָּנִ֑ים שִׁמְרִ֤י הָ/רֹאשׁ֙ כִּ֣י לֹא הָיָ֣ה בְכ֔וֹר וַ/יְשִׂימֵ֥/הוּ אָבִ֖י/הוּ לְ/רֹֽאשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/010.yaml
  text: 'And Hosah[a], from the sons of Merari, had sons: Shimri the chief, though he was not the firstborn; his father made him chief.'
translation:
  language: fr
  text: 'Quant à Hosa, l’un des descendants de Merari, il eut des fils : Shimri était le chef, bien qu’il ne soit pas le premier-né[a] ; son père l’établit chef.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car il n’était pas le premier-né ». La conjonction hébraïque peut avoir un sens explicatif aussi bien que concessif.'
    reason: alternative lexicale
lexical_decisions:
- source_word: וּלְחֹסָה
  choice: Quant à Hosa
  rationale: Dans ce contexte de liste généalogique, לְ devant le nom introduit la personne concernée. « Quant à Hosa » restitue naturellement cette construction et le lien avec ce qui précède.
- source_word: מִן בְּנֵי מְרָרִי
  choice: l’un des descendants de Merari
  rationale: L’expression signifie littéralement « d’entre les fils de Merari » et indique l’appartenance de Hosa à cette lignée. « Descendants » évite de faire de Hosa un fils immédiat de Merari.
- source_word: בָּנִים
  choice: il eut des fils
  rationale: L’hébreu présente une proposition nominale, « des fils », à laquelle le français doit ajouter un lien verbal. Cette formulation reste concise et conserve le pluriel masculin du texte.
- source_word: שִׁמְרִי
  choice: Shimri
  rationale: Le nom propre est translittéré selon sa forme hébraïque.
- source_word: הָרֹאשׁ
  choice: était le chef
  rationale: רֹאשׁ désigne ici le premier en rang ou le responsable du groupe familial, non la tête au sens physique. « Chef » convient au contexte administratif et généalogique.
- source_word: כִּי לֹא הָיָה בְכוֹר
  choice: bien qu’il ne soit pas le premier-né
  rationale: כִּי peut être explicatif ou causal, mais la proposition crée vraisemblablement ici un contraste entre le rang de Shimri et son ordre de naissance. La note conserve l’autre lecture possible.
- source_word: וַיְשִׂימֵהוּ אָבִיהוּ לְרֹאשׁ
  choice: son père l’avait établi chef
  rationale: שׂים avec לְ exprime la désignation à une fonction. Le plus-que-parfait rend naturellement en français l’action antérieure qui explique le statut déjà mentionné, tout en répétant « chef » comme l’hébreu répète רֹאשׁ.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la structure de la notice généalogique tout en explicitant seulement les liens verbaux nécessaires en français.
