base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/029.yaml
  text: For the Izharites[a], Chenaniah and his sons were assigned to the outside work over Israel, as officers and judges.
translation:
  language: fr
  text: Quant aux Yitseharites, Kenania et ses fils étaient chargés des tâches extérieures[a] pour Israël, en qualité d’administrateurs et de juges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « travail extérieur » : il s’agit probablement de fonctions administratives et judiciaires exercées parmi les Israélites, en dehors du service central du sanctuaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: Quant aux Yitseharites
  rationale: Le ל préfixé introduit ici un groupe familial dans une liste. Le singulier collectif hébreu est rendu naturellement par le pluriel français « Yitseharites ».
- source_word: כְּנַנְיָהוּ
  choice: Kenania
  rationale: Le nom propre est translittéré sous une forme lisible et courante en français, sans traduire son étymologie.
- source_word: וּבָנָיו
  choice: et ses fils
  rationale: Dans ce contexte généalogique et administratif, בנים désigne les fils de Kenania.
- source_word: לַמְּלָאכָה הַחִיצוֹנָה
  choice: étaient chargés des tâches extérieures
  rationale: מְלָאכָה désigne un travail ou une charge, et חִיצוֹנָה ce qui est extérieur. La formulation française explicite sobrement l’affectation implicite dans cette liste.
- source_word: עַל יִשְׂרָאֵל
  choice: concernant Israël
  rationale: עַל peut exprimer l’autorité, la responsabilité ou le domaine concerné. « concernant Israël » reste naturel tout en évitant de préciser excessivement la nature de cette relation administrative.
- source_word: לְשֹׁטְרִים
  choice: en qualité d’administrateurs
  rationale: שֹׁטְרִים désigne ici des agents investis de responsabilités administratives, et non des policiers ou des officiers militaires.
- source_word: וּלְשֹׁפְטִים
  choice: et de juges
  rationale: Le terme désigne directement ceux qui exercent une fonction judiciaire.
theological_decisions:
- issue: Nature des « tâches extérieures »
  choice: Conserver l’expression générale « tâches extérieures » et l’expliquer en note avec prudence
  alternative: Préciser dans le texte qu’il s’agit de tâches accomplies hors du sanctuaire
  rationale: Le contexte suggère des fonctions extérieures au service central du sanctuaire, mais le verset ne définit pas explicitement cette opposition. La traduction préserve donc l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe de liste est rendue par « Quant aux… », tandis que « en qualité de » marque sans lourdeur les fonctions exercées.
