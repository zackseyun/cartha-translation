  text: And Shelemiah had sons and brothers[a], valiant men[b], eighteen.
translation:
  language: fr
  text: Quant à Meshélémia[a], ses fils et ses frères étaient des hommes capables[b], dix-huit en tout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et pour Meshélémia » ; cette tournure hébraïque introduit la personne dont on donne le décompte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des hommes de valeur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְשֶֽׁלֶמְיָ֗הוּ
  choice: Quant à Meshélémia
  rationale: La préposition לְ introduit ici la personne dont on donne le décompte. « Quant à » restitue naturellement cette fonction en français. La forme hébraïque du nom est rendue par « Meshélémia ».
- source_word: בָּנִים
  choice: ses fils
  rationale: Le nom hébreu désigne ici les descendants masculins de Meshélémia. Le possessif explicite en français le rapport exprimé par la construction hébraïque.
- source_word: וְ/אַחִים
  choice: et ses frères
  rationale: Le sens ordinaire de אַחִים est « frères ». Rien dans le contexte n’impose le sens plus large de « parents ».
- source_word: בְּנֵי חָיִל
  choice: des hommes capables
  rationale: L’expression idiomatique, littéralement « fils de force/valeur », qualifie des hommes aptes et solides. Dans le contexte de fonctions organisées, « hommes capables » est naturel sans réduire nécessairement חַיִל à la seule bravoure militaire.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: dix-huit en tout
  rationale: Le cardinal donne le total du groupe. « En tout » rend explicite en français la fonction récapitulative du nombre placé en fin de proposition.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le nombre en position finale, comme dans l’hébreu, tout en ajoutant « en tout » pour rendre clairement sa valeur récapitulative.
