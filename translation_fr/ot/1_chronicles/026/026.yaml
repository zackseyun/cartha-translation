source:
  edition: WLC
  text: ה֧וּא שְׁלֹמ֣וֹת וְ/אֶחָ֗י/ו עַ֣ל כָּל אֹצְר֤וֹת הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר הִקְדִּ֜ישׁ דָּוִ֣יד הַ/מֶּ֗לֶךְ וְ/רָאשֵׁ֧י הָ/אָב֛וֹת לְ/שָׂרֵֽי הָ/אֲלָפִ֥ים וְ/הַ/מֵּא֖וֹת וְ/שָׂרֵ֥י הַ/צָּבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/026.yaml
  text: Shelomoth and his brothers were over all the treasuries of the holy things that King David[a], the heads of the fathers’ houses, the commanders of thousands and of hundreds[b], and the commanders of the army had dedicated.
translation:
  language: fr
  text: Shelomoth et ses frères étaient responsables de tous les trésors des biens consacrés[a] que le roi David, les chefs des familles ancestrales[b], les chefs de milliers et de centaines, ainsi que les chefs de l’armée avaient consacrés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les choses saintes » ou « les dons consacrés ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « les chefs des pères » : expression administrative désignant les responsables des groupes familiaux fondés sur l’ascendance.'
    reason: cultural_note
lexical_decisions:
- source_word: הוּא שְׁלֹמוֹת וְאֶחָיו
  choice: Shelomoth et ses frères étaient
  rationale: Le pronom singulier הוּא introduit Shelomoth, mais l’ensemble « Shelomoth et ses frères » appelle naturellement un verbe au pluriel en français.
- source_word: עַל
  choice: étaient responsables de
  rationale: Dans ce cadre administratif, la préposition exprime la responsabilité et la surveillance; cette formulation est plus naturelle en français moderne que le calque « étaient sur ».
- source_word: כָּל אֹצְרוֹת הַקֳּדָשִׁים
  choice: tous les trésors contenant les biens sacrés
  rationale: אֹצָר peut désigner un trésor, un dépôt ou le lieu où des biens sont conservés. « Contenant » explicite sobrement le rapport entre les dépôts et les objets consacrés, sans confondre les contenants avec leur contenu.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: que ... avaient consacrés
  rationale: Le hiphil de קדשׁ signifie mettre à part comme sacré ou consacrer. Le pluriel français correspond à la série coordonnée de personnes qui ont accompli cette consécration.
- source_word: דָּוִיד הַמֶּלֶךְ
  choice: le roi David
  rationale: L’ordre français courant place le titre avant le nom.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: les chefs des familles ancestrales
  rationale: Il s’agit d’une expression socio-administrative fondée sur les lignées. Cette formulation reste compréhensible sans reproduire littéralement l’hébraïsme « chefs des pères ».
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: les chefs de milliers et de centaines
  rationale: La formulation conserve les unités militaires ou administratives de l’hébreu et leur hiérarchie, sans transformer nécessairement les nombres en effectifs exacts.
- source_word: שָׂרֵי הַצָּבָא
  choice: les chefs de l’armée
  rationale: צָבָא désigne ici la force militaire; « chefs de l’armée » est clair, actuel et digne.
theological_decisions:
- issue: Étendue du groupe ayant consacré les biens
  choice: La consécration est attribuée collectivement au roi David et à tous les groupes de responsables énumérés.
  alternative: Comprendre que David seul a consacré les biens et que les groupes suivants ont un rapport indirect avec eux.
  rationale: La coordination répétée par וְ présente le plus naturellement l’ensemble des personnes nommées comme sujets du verbe singulier hébreu employé dans un sens collectif. Le français utilise donc le pluriel « avaient consacrés ».
translation_notes:
  register: Français international moderne, clair et soutenu. « Responsables de » rend naturellement la fonction administrative; « trésors contenant les biens sacrés » évite l’ambiguïté moderne de « trésoreries » tout en gardant l’image institutionnelle du texte.
