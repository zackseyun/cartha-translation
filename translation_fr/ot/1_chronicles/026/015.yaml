  text: לְ/עֹבֵ֥ד אֱדֹ֖ם נֶ֑גְבָּ/ה וּ/לְ/בָנָ֖י/ו בֵּ֥ית הָ/אֲסֻפִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/015.yaml
  text: To Obed-edom[a], the south; and to his sons, the house of stores.
translation:
  language: fr
  text: À Obed-Édom, le côté sud ; et à ses fils, la maison des réserves[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la maison des dépôts » ou « la maison des collections ». Le terme hébreu peut désigner des réserves ou des lieux où l’on entrepose ce qui a été rassemblé.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹבֵד אֱדֹם
  choice: À Obed-Édom
  rationale: La préposition לְ marque ici l’attribution dans la répartition des postes par tirage au sort. La tournure elliptique « À Obed-Édom » conserve la formule concise de l’hébreu.
- source_word: נֶגְבָּה
  choice: le côté sud
  rationale: Le nom muni de la terminaison directionnelle désigne ici le côté ou la direction du sud. « Le côté sud » convient au contexte de l’affectation des portes.
- source_word: וּלְבָנָיו
  choice: et à ses fils
  rationale: La traduction rend directement le lien familial et la seconde attribution introduite par לְ.
- source_word: בֵּית
  choice: la maison
  rationale: Le terme est conservé dans son sens architectural au sein de la construction génitive hébraïque.
- source_word: הָאֲסֻפִּים
  choice: des réserves
  rationale: Dérivé de la racine אסף, « rassembler », le terme peut désigner ce qui est entreposé ou les lieux de dépôt. « Maison des réserves » exprime naturellement un bâtiment destiné aux biens rassemblés sans faire de « magasins » une certitude lexicale.
