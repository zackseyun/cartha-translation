review_pass:
  verdict: revise
  source_fidelity: Le texte hébreu exprime la provenance (« des guerres et du butin »), suivie d’un verbe de consécration dont l’objet est implicite, puis le but (« pour renforcer la maison de Yahweh »). « Sur les biens pris… et sur le butin » ne rend pas correctement la préposition מן et brouille la relation entre les deux compléments.
  naturalness: La formulation révisée est naturelle en français international actuel et conserve un registre biblique sobre. « Des biens issus des guerres et du butin » explicite avec retenue l’objet sous-entendu, sans transformer le texte en description rituelle.
  terminology: « Consacré » rend directement le hiphil de קדשׁ. « Renforcer » est plus proche de לחזק que « consolider », tout en restant idiomatique pour la maison/sanctuaire. « Maison de Yahweh » préserve l’expression hébraïque et le nom divin.
  issues:
  - severity: medium
    issue: « Sur les biens pris pendant les guerres et sur le butin »
    rationale: Les deux מן hébreux marquent la source ou la provenance, non le thème ou l’objet indirect exprimé par « sur ». En outre, la construction française coordonne de manière maladroite « biens pris pendant les guerres » et « butin ».
  - severity: medium
    issue: « ils avaient fait des consécrations »
    rationale: Cette nominalisation ne rend pas aussi directement l’action de consacrer des biens; elle suggère des actes ou rites de consécration plutôt que l’affectation d’objets, dont l’hébreu laisse l’objet implicite.
