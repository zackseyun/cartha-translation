  text: מִן הַ/מִּלְחָמ֥וֹת וּ/מִן הַ/שָּׁלָ֖ל הִקְדִּ֑ישׁוּ לְ/חַזֵּ֖ק לְ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/027.yaml
  text: From the wars and from the spoil they had dedicated things to strengthen the house of Yahweh.
translation:
  language: fr
  text: Ils avaient consacré des biens issus des guerres et du butin pour renforcer la maison de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu ne précise pas l’objet de « avaient consacré ». Autres traductions possibles : « des batailles » pour « des guerres », « du pillage » pour « du butin », et « soutenir » ou « consolider » pour « renforcer ».'
    reason: L’objet direct de הִקְדִּישׁוּ est implicite; certains termes admettent des équivalents français proches.
lexical_decisions:
- source_word: מִן הַמִּלְחָמוֹת וּמִן הַשָּׁלָל
  choice: Sur les biens pris pendant les guerres et sur le butin
  rationale: Les deux compléments introduits par מִן indiquent ici la provenance de ce qui a été consacré. L’explicitation « biens pris » fournit naturellement en français l’objet que l’hébreu laisse sous-entendu, sans identifier arbitrairement les deux catégories.
- source_word: הִקְדִּישׁוּ
  choice: ils avaient fait des consécrations
  rationale: Le hiphil de קדשׁ exprime la mise à part pour un usage sacré. Cette formulation française conserve le pluriel implicite des biens consacrés et le plus-que-parfait situe l’action par rapport au relevé narratif environnant.
- source_word: לְחַזֵּק
  choice: afin de consolider
  rationale: חזק signifie rendre fort ou affermir. « Consolider » convient à un bâtiment et peut couvrir le renforcement matériel, l’entretien ou les réparations sans réduire le sens à une seule opération.
- source_word: לְבֵית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » préserve l’image hébraïque du sanctuaire, tandis que « Yahweh » représente directement le nom divin יְהוָה.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le représente sans le remplacer par un titre.
- issue: Nature de l’action exprimée par הִקְדִּישׁוּ
  choice: fait des consécrations
  alternative: donné
  rationale: Le choix maintient la dimension sacrée de la mise à part sans préciser davantage le rite ou le statut des biens.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase explicite sobrement l’objet implicite pour éviter une construction peu naturelle, tout en signalant cette particularité dans la note.
