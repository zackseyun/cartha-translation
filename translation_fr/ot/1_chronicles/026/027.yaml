revisions:
- from: Sur les biens pris pendant les guerres et sur le butin, ils avaient fait des consécrations afin de consolider la maison de Yahweh.[a]
  to: Ils avaient consacré des biens issus des guerres et du butin pour renforcer la maison de Yahweh.[a]
  rationale: La révision rétablit la valeur de provenance des deux compléments introduits par מן, rend הִקְדִּישׁוּ par le verbe français direct « avaient consacré » et conserve une explicitation minimale (« des biens ») de l’objet implicite. Elle maintient le plus-que-parfait, le but exprimé par l’infinitif et le nom Yahweh.
  reviewer_model: gpt-5.6-terra
