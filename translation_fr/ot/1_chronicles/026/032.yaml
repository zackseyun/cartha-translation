base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/032.yaml
  text: And his brothers[a], valiant men, were two thousand seven hundred heads of fathers’ houses; and King David appointed them over the Reubenites, the Gadites, and the half-tribe of Manasseh for every matter of God and of the king.
translation:
  language: fr
  text: Ses frères[a], des hommes de valeur, étaient au nombre de deux mille sept cents, chefs de maisons ancestrales. Le roi David les établit responsables des Rubénites, des Gadites et de la demi-tribu de Manassé pour toutes les affaires de Dieu et celles du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : ses proches parents.'
    reason: Le terme hébreu peut désigner des parents ou membres du même clan, et non seulement des frères au sens strict.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: Ses frères
  rationale: Le suffixe renvoie à Hashabia, mentionné au verset précédent. « Frères » rend directement le terme hébreu, qui peut aussi désigner plus largement des membres du même clan.
- source_word: בְּנֵי חַיִל
  choice: des hommes de valeur
  rationale: Cette expression désigne des hommes reconnus pour leur force, leur valeur ou leur compétence. Dans ce cadre administratif, « hommes de valeur » conserve cette amplitude sans réduire le sens à la seule bravoure militaire.
- source_word: אַלְפַּיִם וּשְׁבַע מֵאוֹת
  choice: deux mille sept cents
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: chefs de maisons ancestrales
  rationale: Il s’agit des responsables des unités familiales ou claniques issues d’un ancêtre commun. Cette formulation française reste transparente tout en évitant le calque peu naturel « maisons des pères ».
- source_word: וַיַּפְקִידֵם ... עַל
  choice: les établit responsables de
  rationale: Le hiphil de פקד avec עַל exprime ici l’attribution officielle d’une responsabilité sur les groupes nommés.
- source_word: הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: des Rubénites, des Gadites et de la demi-tribu de Manassé
  rationale: Les gentilés hébreux au singulier collectif sont naturellement rendus au pluriel en français.
- source_word: לְכָל דְּבַר הָאֱלֹהִים וּדְבַר הַמֶּלֶךְ
  choice: pour toutes les affaires de Dieu et celles du roi
  rationale: דבר signifie ici affaire, question ou responsabilité. Le pluriel français exprime naturellement la valeur distributive de כָּל tout en conservant le parallèle entre le domaine de Dieu et celui du roi.
theological_decisions:
- issue: Étendue de la responsabilité administrative à l’égard de Dieu et du roi
  choice: La traduction distingue les affaires de Dieu de celles du roi sans préciser davantage leur contenu.
  alternative: « pour tout ce qui concernait Dieu et le roi »
  rationale: L’hébreu présente deux sphères de responsabilité, religieuse et royale, mais n’établit pas explicitement entre elles de hiérarchie ni de rapport doctrinal. Le rendu choisi conserve cette distinction sans importer de catégories postérieures.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Maisons ancestrales » conserve la structure sociale du texte sans employer un calque obscur; « les établit responsables de » rend clairement le caractère officiel de la nomination.
