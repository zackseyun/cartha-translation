lexical_decisions:
- source_word: וּ/לְ/עֹבֵד אֱדֹם בָּנִים
  choice: Obed-Édom eut pour fils
  rationale: La formulation hébraïque est elliptique, littéralement « et à Obed-Édom, des fils ». Le français exige un verbe ; « eut pour fils » rend naturellement la formule généalogique tout en introduisant la liste qui suit.
- source_word: שְׁמַעְיָה
  choice: Shemaïa
  rationale: Transcription française courante du nom hébreu, avec tréma pour signaler la séparation vocalique.
- source_word: הַבְּכוֹר
  choice: le premier-né
  rationale: Le terme désigne le fils premier-né et ne constitue pas un simple ordinal ; cette traduction conserve sa nuance familiale.
- source_word: יְהוֹזָבָד
  choice: Yehoshabad
  rationale: Transcription directement fondée sur la forme hébraïque du nom et adaptée aux conventions phonétiques françaises.
- source_word: הַשֵּׁנִי
  choice: le deuxième
  rationale: Rend directement l’ordinal hébreu indiquant l’ordre des fils.
- source_word: יוֹאָח
  choice: Yoah
  rationale: Transcription française concise de la forme hébraïque.
- source_word: הַשְּׁלִשִׁי
  choice: le troisième
  rationale: Rend directement l’ordinal hébreu.
- source_word: שָׂכָר
  choice: Sakar
  rationale: La forme consonantique est ici Sakar, distincte du nom hébreu Issakar ; la transcription préserve cette distinction.
- source_word: הָרְבִיעִי
  choice: le quatrième
  rationale: Rend directement l’ordinal hébreu.
- source_word: נְתַנְאֵל
  choice: Netanéel
  rationale: Transcription française fondée sur l’hébreu, préférable ici à une forme passée par le grec.
- source_word: הַחֲמִישִׁי
  choice: le cinquième
  rationale: Rend directement l’ordinal hébreu.
