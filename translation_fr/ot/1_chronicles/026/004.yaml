  text: 'And Obed-edom had sons: Shemaiah the firstborn[a], Jehozabad the second, Joah the third, and Sakar the fourth[b], and Nethanel the fifth.'
translation:
  language: fr
  text: 'Obed-Édom eut pour fils : Shemaïa, le premier-né, Yehozabad, le deuxième, Yoah, le troisième, Sakar[a], le quatrième, et Netanéel, le cinquième.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
