base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/016.yaml
  text: For Shuppim and Hosah[a], the lot fell to the west, with the Gate of Shallecheth on the ascending highway, guard corresponding to guard.
translation:
  language: fr
  text: 'Pour Shouppim et Hosa, le côté ouest fut attribué, avec la porte de Shalléketh[a], sur la route surélevée qui monte : un poste de garde en face de l’autre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « la porte de l’Expulsion » ; « Shalléketh » est probablement un nom propre dérivé d’un verbe signifiant « jeter dehors » ou « précipiter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֻׁפִּים וּלְחֹסָה
  choice: Pour Shouppim et Hosa
  rationale: Le préfixe לְ marque ici l’attribution dans le contexte de la répartition des postes par tirage au sort. La répétition de « pour » n’est pas nécessaire en français.
- source_word: לַמַּעֲרָב
  choice: le côté ouest fut attribué
  rationale: L’hébreu présente une formulation elliptique dans la suite des attributions des versets précédents. Cette formulation française explicite seulement le verbe sous-entendu, sans répéter nécessairement la mention du tirage au sort.
- source_word: עִם
  choice: avec
  rationale: Conserve le rapport simple d’association entre le secteur occidental et la porte mentionnée.
- source_word: שַׁעַר שַׁלֶּכֶת
  choice: la porte de Shalléketh
  rationale: Shalléketh est vraisemblablement le nom propre de la porte. La translittération préserve ce nom, tandis que son sens étymologique possible est signalé en note.
- source_word: בַּמְסִלָּה הָעוֹלָה
  choice: sur la route surélevée qui monte
  rationale: מְסִלָּה désigne une voie aménagée ou surélevée, et le participe הָעוֹלָה indique qu’elle monte. La formulation garde les deux éléments topographiques.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: un poste de garde en face de l’autre
  rationale: מִשְׁמָר peut désigner la garde ou son poste; ici, l’agencement spatial favorise « poste de garde ». « En face de » conserve le sens premier de לְעֻמַּת sans suggérer une opposition hostile.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les noms sont adaptés à une translittération naturelle en français. La syntaxe elliptique de l’hébreu est légèrement explicitée pour assurer la clarté, tandis que la disposition des postes de garde reste formulée de manière concrète sans surinterprétation.
