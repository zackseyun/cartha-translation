base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/031.yaml
  text: For the Hebronites[a], Jeriah was the chief of the Hebronites according to his generations by fathers’ houses. In the fortieth year of David’s reign they were sought out[c][b], and among them mighty men of valor were found at Jazer of Gilead.
translation:
  language: fr
  text: Quant aux Hébronites[a], Yeriya était leur chef, selon les lignées de ses maisons ancestrales[b]. La quarantième année du règne de David, on fit des recherches à leur sujet, et l’on trouva parmi eux, à Yazer en Galaad, des hommes vaillants[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Des Hébronites ».'
    reason: lexical_alternative
  - marker: b
    text: Les « maisons ancestrales » étaient des groupes de parenté fondés sur un ancêtre commun, et non de simples foyers familiaux.
    reason: cultural_note
  - marker: c
    text: L’expression hébraïque peut aussi désigner de puissants guerriers ou des hommes particulièrement capables.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: Quant aux Hébronites
  rationale: Le ל préfixé introduit ici le groupe comme nouveau thème. « Quant aux » restitue naturellement cette fonction discursive en français.
- source_word: יְרִיָּה הָרֹאשׁ
  choice: Yeriya était leur chef
  rationale: « Yeriya » suit de près la forme hébraïque du nom; רֹאשׁ désigne ici le responsable du groupe. Le possessif évite une répétition lourde sans modifier le référent.
- source_word: לְתֹלְדֹתָיו לְאָבוֹת
  choice: selon ses lignées et ses maisons ancestrales
  rationale: « Lignées » exprime les divisions généalogiques de תֹּלְדוֹת, tandis que « maisons ancestrales » rend le groupement clanique fondé sur l’ascendance. Le singulier du suffixe hébreu est conservé par « ses ».
- source_word: בִּשְׁנַת הָאַרְבָּעִים לְמַלְכוּת דָּוִיד
  choice: La quarantième année du règne de David
  rationale: Formulation française naturelle de la datation royale, fidèle au sens de מַלְכוּת dans ce contexte.
- source_word: נִדְרָשׁוּ
  choice: on fit des recherches à leur sujet
  rationale: Le niphal de דרש évoque ici une recherche ou enquête portant sur le groupe. La tournure impersonnelle française conserve l’indétermination de l’agent et la valeur passive du texte.
- source_word: וַיִּמָּצֵא בָהֶם
  choice: l’on trouva parmi eux
  rationale: Le verbe morphologiquement singulier permet une tournure impersonnelle. Celle-ci est idiomatique en français et évite de lui attribuer un sujet précis absent de l’hébreu.
- source_word: גִּבּוֹרֵי חַיִל
  choice: des hommes vaillants
  rationale: Cette expression qualifie des hommes distingués par leur force, leur bravoure ou leur capacité. « Hommes vaillants » en garde la force sans imposer exclusivement un rôle militaire.
- source_word: בְּיַעְזֵיר גִּלְעָד
  choice: à Yazer en Galaad
  rationale: La préposition situe les hommes à Yazer, ville du territoire de Galaad. Les formes françaises « Yazer » et « Galaad » sont retenues.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe généalogique a été légèrement fluidifiée, tout en maintenant les notions de lignées et de maisons ancestrales ainsi que l’indétermination de l’agent de la recherche.
