  text: Hilkiah the second[a], Tebaliah the third, Zechariah the fourth. All the sons and brothers of Hosah were thirteen.
translation:
  language: fr
  text: Hilqiya, le deuxième, Tebalia, le troisième, et Zacharie, le quatrième. Tous les fils et les frères[a] de Hosa étaient au nombre de treize.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, au sens large : « parents masculins », car le mot traduit par « frères » peut désigner des hommes de la parenté.'
