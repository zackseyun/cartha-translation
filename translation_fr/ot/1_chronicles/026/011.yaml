  choice: Hilqiya
  rationale: Translittération française moderne du nom propre hébreu, conservant sa forme usuelle dans les traductions bibliques françaises.
- source_word: הַשֵּׁנִי
  choice: le deuxième
  rationale: Adjectif ordinal défini indiquant le rang dans l’énumération.
- source_word: טְבַלְיָהוּ
  choice: Tebalia
  rationale: Translittération française naturelle du nom propre hébreu.
- source_word: הַשְּׁלִשִׁי
  choice: le troisième
  rationale: Adjectif ordinal défini, rendu parallèlement aux autres rangs.
- source_word: זְכַרְיָהוּ
  choice: Zacharie
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: הָרְבִעִי
  choice: le quatrième
  rationale: Adjectif ordinal défini indiquant le quatrième rang.
- source_word: כָּל
  choice: en tout
  rationale: Dans cette proposition récapitulative, cette expression française rend naturellement la valeur totalisante de כָּל avec le nombre final.
- source_word: בָּנִים
  choice: les fils
  rationale: Le terme hébreu désigne explicitement les fils dans ce registre généalogique.
- source_word: וְאַחִים
  choice: et les frères
  rationale: Rendu lexical direct; le mot peut toutefois désigner plus largement des parents masculins dans un cadre clanique.
- source_word: לְחֹסָה
  choice: de Hosa
  rationale: La préposition marque ici le rapport familial à Hosa; le complément introduit par « de » est naturel en français.
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: treize
  rationale: Nombre cardinal indiquant l’effectif total du groupe.
