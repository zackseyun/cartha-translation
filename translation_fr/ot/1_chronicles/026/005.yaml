  text: Ammiel the sixth[a], Issachar the seventh, Peullethai the eighth; for God had blessed him.
translation:
  language: fr
  text: Ammiel, le sixième ; Issacar, le septième ; Peullethaï, le huitième ; car Dieu l’avait béni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car Dieu l’a béni ». L’hébreu n’indique pas explicitement le plus-que-parfait.'
    reason: alternative lexicale et temporelle
lexical_decisions:
- source_word: עַמִּיאֵל
  choice: Ammiel
  rationale: Nom propre transcrit selon l’usage français courant.
- source_word: הַשִּׁשִּׁי
  choice: le sixième
  rationale: Ordinal défini qui poursuit l’énumération des fils selon leur rang.
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Forme française traditionnelle et largement reconnue du nom propre ; le contexte désigne ici un fils d’Obed-Édom.
- source_word: הַשְּׁבִיעִי
  choice: le septième
  rationale: Ordinal défini, parallèle aux autres éléments de la liste.
- source_word: פְּעֻלְּתַי
  choice: Peoulletaï
  rationale: Transcription française qui rend les voyelles et la consonne redoublée perceptibles dans la forme hébraïque.
- source_word: הַשְּׁמִינִי
  choice: le huitième
  rationale: Ordinal défini qui achève cette série.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français l’explication du nombre de fils mentionnés.
- source_word: בֵרֲכוֹ
  choice: l’avait béni
  rationale: Le verbe בּרך accompagné du suffixe masculin singulier indique que Dieu a béni l’homme visé ; le plus-que-parfait exprime naturellement en français que cette bénédiction précède et explique la descendance énumérée.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Désignation courante du Dieu d’Israël ; le contexte impose ici le sens singulier.
theological_decisions:
- issue: Référent du pronom dans « l’avait béni »
  choice: Le pronom renvoie à Obed-Édom, père nommé dans le contexte immédiat.
  alternative: Le pronom peut être compris plus largement comme visant sa maison ou sa lignée.
  rationale: Le passage environnant énumère les fils et les descendants d’Obed-Édom ; la proposition explicative attribue donc le plus naturellement leur nombre à la bénédiction que Dieu lui a accordée, sans que le verset répète son nom.
translation_notes:
  register: Français moderne, sobre et digne. Les points-virgules rendent clairement la structure de l’énumération ; la répétition des articles devant les ordinaux suit le parallélisme hébreu.
