  text: וּ/שְׁבֻאֵל֙ בֶּן גֵּרְשׁ֣וֹם בֶּן מֹשֶׁ֔ה נָגִ֖יד עַל הָ/אֹצָרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/024.yaml
  text: And Shebuel son of Gershom[a], son of Moses[b], was chief over the treasuries.
translation:
  language: fr
  text: Et Shebuel, fils de Gershom, fils de Moïse, était chef préposé aux trésors[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dépôts ». Le terme peut désigner soit les lieux où sont conservés les biens précieux, soit les biens eux-mêmes, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁבֻאֵל
  choice: Et Shébuel
  rationale: La conjonction ו relie ce verset à l’énumération précédente; « Et » conserve cette continuité. Le nom propre est translittéré selon un usage français clair et actuel.
- source_word: בֶּן גֵּרְשׁוֹם בֶּן מֹשֶׁה
  choice: fils de Guershom, fils de Moïse
  rationale: Dans cette chaîne généalogique, בֶּן indique la filiation directe. La répétition est maintenue, et les noms suivent des formes françaises usuelles.
- source_word: נָגִיד
  choice: responsable
  rationale: Dans ce contexte administratif, le terme désigne celui qui est investi de l’autorité et chargé de la supervision. « Responsable » est naturel en français moderne sans suggérer la royauté que pourrait évoquer « prince ».
- source_word: עַל
  choice: des
  rationale: Avec « responsable », la construction idiomatique française « responsable de » exprime l’autorité ou la supervision portée par עַל.
- source_word: הָ/אֹצָרוֹת
  choice: les trésors
  rationale: Dans le contexte des biens consacrés et des ressources du sanctuaire, « trésors » convient au sens administratif tout en laissant ouverte la possibilité que le mot désigne les richesses ou les lieux où elles sont gardées.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe généalogique demeure concise, tandis que « responsable des trésors » rend naturellement la fonction administrative.
