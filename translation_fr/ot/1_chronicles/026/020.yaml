source:
  edition: WLC
  text: וְֽ/הַ/לְוִיִּ֑ם אֲחִיָּ֗ה עַל אֽוֹצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹֽצְר֖וֹת הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/020.yaml
  text: And of the Levites[b][a], Ahijah was over the treasuries of the house of God and the treasuries of the holy things.
translation:
  language: fr
  text: Quant aux Lévites[a], Ahija était responsable des trésors de la maison de Dieu et des trésors des choses saintes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Et les Lévites : Ahija était responsable de… » Le début de la phrase hébraïque est assez elliptique et peut servir de transition ou d’intitulé.'
    reason: alternative_reading
  - marker: b
    text: L’expression « choses saintes » peut aussi se traduire par « choses consacrées » ou « biens consacrés » ; elle désigne ce qui avait été mis à part pour un usage sacré.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Quant aux Lévites
  rationale: La construction ouvre vraisemblablement une transition thématique. « Quant aux Lévites » rend clairement cette fonction tout en laissant en note le caractère elliptique de l’hébreu.
- source_word: אֲחִיָּה
  choice: Ahiya
  rationale: Translittération française claire du nom hébreu אֲחִיָּה.
- source_word: עַל
  choice: était responsable de
  rationale: Dans ce contexte administratif, la préposition exprime la responsabilité ou la surveillance. Cette formulation est naturelle en français moderne.
- source_word: אֹצְרוֹת
  choice: trésors
  rationale: Dans le contexte du sanctuaire, le terme désigne les réserves ou dépôts de biens placés sous la surveillance d’un responsable; « trésors » conserve la formulation traditionnelle et institutionnelle.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Traduction directe de l’expression hébraïque, sans la préciser par l’interprétation « temple ».
- source_word: וּלְאֹצְרוֹת
  choice: et des trésors
  rationale: Le second groupe est coordonné au premier et dépend lui aussi de l’idée de responsabilité exprimée par עַל; il n’est pas nécessaire de répéter le verbe en français.
- source_word: הַקֳּדָשִׁים
  choice: les choses saintes
  rationale: Le pluriel substantivé désigne des biens mis à part comme saints. La traduction directe conserve l’étendue du sens sans décider s’il s’agit précisément d’offrandes, d’objets ou d’autres biens consacrés.
theological_decisions:
- issue: Nature exacte des הַקֳּדָשִׁים
  choice: choses saintes
  alternative: biens consacrés / choses consacrées
  rationale: Le texte ne précise pas la catégorie exacte de ces biens sacrés. « Choses saintes » préserve cette indétermination et évite de réduire le terme aux seules offrandes.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « Quant aux Lévites » clarifie la transition sans effacer l’ellipse signalée en note; « maison de Dieu » et « choses saintes » maintiennent les expressions concrètes de l’hébreu.
