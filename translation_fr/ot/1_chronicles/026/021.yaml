    issue: « les Yéhielites » transforme un nom propre singulier en nom collectif pluriel.
    rationale: Le texte hébreu porte יְחִיאֵלִי, rendu dans les traditions textuelles et les versions de référence par le nom personnel « Jehieli/Yéhieli ». Le verset suivant mentionne les fils de Yéhieli, ce qui confirme qu’il s’agit ici de leur ancêtre ou chef nommé.
  - severity: medium
    issue: « c’est-à-dire les descendants du Guershonite rattachés à Ladân » est une reformulation interprétative et grammaticalement artificielle.
    rationale: Le texte juxtapose des désignations généalogiques; il ne présente pas une apposition explicative de type « c’est-à-dire ». La révision préserve cette structure et évite de faire de « le Guershonite » un individu indéterminé.
  - severity: medium
    issue: La note b donne une prétendue formulation littérale inexacte (« chefs des pères »).
    rationale: L’hébreu רָאשֵׁי הָאָבוֹת signifie littéralement « chefs des pères/maisons paternelles » dans l’usage généalogique; il ne convient pas de citer une forme française tronquée comme si elle était littérale.
