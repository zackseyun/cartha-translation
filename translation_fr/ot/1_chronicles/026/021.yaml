revisions:
- from: Chez les fils[a] de Ladân, c’est-à-dire les descendants du Guershonite rattachés à Ladân, les chefs des familles ancestrales[b] de Ladân le Guershonite étaient les Yéhielites[c].
  to: 'Les fils[a] de Ladân, les fils des Guershonites issus de Ladân, chefs des maisons paternelles[b] : Yéhieli.'
  rationale: La correction restitue Yéhieli comme nom propre singulier et remplace l’explication intrusive par une énumération généalogique proche de l’hébreu. Elle conserve l’ambiguïté et la densité de la construction source tout en employant un français moderne et lisible. La note textuelle c est supprimée, car l’alternative « Yéhielites » n’est pas justifiée ici.
