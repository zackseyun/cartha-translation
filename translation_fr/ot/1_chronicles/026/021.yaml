base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/021.yaml
  text: 'The sons of Ladan[b][a], the sons of the Gershonite belonging to Ladan: the heads of the fathers’ houses belonging to Ladan the Gershonite were Jehieli.'
translation:
  language: fr
  text: 'Les fils[a] de Ladân, les fils des Guershonites issus de Ladân, chefs des maisons paternelles[b] : Yéhieli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les généalogies, « fils » peut aussi désigner des descendants plus éloignés.
    reason: lexical_alternative
  - marker: b
    text: Expression désignant les responsables des unités familiales fondées sur l’ascendance, comparables à des clans.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: fils / descendants
  rationale: Le terme signifie littéralement « fils », mais peut désigner une lignée plus large dans une généalogie. « Fils » maintient la forme généalogique au début du verset, tandis que « descendants » explicite naturellement la seconde occurrence.
- source_word: לַעְדָּן
  choice: Ladân
  rationale: Translittération française claire du nom propre hébreu, avec l’accent circonflexe indiquant la voyelle longue.
- source_word: הַגֵּרְשֻׁנִּי
  choice: le Guershonite
  rationale: La forme gentilice désigne l’appartenance à la lignée ou au clan de Guershon. La formulation concise conserve le registre généalogique.
- source_word: לְלַעְדָּן
  choice: rattachés à Ladân / de Ladân
  rationale: La préposition לְ marque ici la relation ou le classement généalogique, non une direction. « Rattachés à » rend cette affiliation explicite.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: les chefs des familles ancestrales
  rationale: L’expression désigne les responsables des unités familiales fondées sur l’ascendance. Cette formulation française rend le sens institutionnel sans calquer maladroitement « maisons des pères ».
- source_word: יְחִיאֵלִי
  choice: les Yéhielites
  rationale: La forme désigne vraisemblablement le groupe familial issu de Yéhiel, ce que confirme le verset suivant, qui parle des « fils des Yéhielites ». Le pluriel collectif convient donc mieux ici qu’un nom personnel singulier.
