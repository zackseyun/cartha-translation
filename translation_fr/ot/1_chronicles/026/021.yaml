  verdict: revise
  source_fidelity: La forme יְחִיאֵלִי est ici un nom propre singulier, « Yéhieli », et non un pluriel collectif. La syntaxe généalogique énumérative du verset doit être conservée sans introduire une paraphrase explicative (« c’est-à-dire ») qui modifie les relations exprimées.
  naturalness: La révision garde le style condensé, mais intelligible, d’une notice généalogique. « Chefs des maisons paternelles » rend l’expression technique sans l’expliciter excessivement dans le texte.
  terminology: « Ladân », « Guershonites » et « Yéhieli » sont employés de manière cohérente. « Maisons paternelles » correspond à בתי אבות / « maisons des pères » et la note explique cette institution familiale.
  issues:
