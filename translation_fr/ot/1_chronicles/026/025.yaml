base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/025.yaml
  text: 'And his brothers belonging to Eliezer: Rehabiah his son[a], and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.'
translation:
  language: fr
  text: 'Et ses frères rattachés à Éliézer : Rechabia, son fils[a] ; Ésaïe, son fils ; Joram, son fils ; Zicri, son fils ; et Shelomoth, son fils.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ses frères d’Éliézer ». La construction hébraïque introduit vraisemblablement la branche familiale issue d’Éliézer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו
  choice: Et ses frères
  rationale: Le pluriel de אָח avec suffixe de troisième personne masculin singulier signifie littéralement « ses frères ». Dans ce contexte généalogique, le terme peut désigner plus largement des membres de la parenté, mais la traduction conserve l’expression hébraïque.
- source_word: לֶאֱלִיעֶזֶר
  choice: rattachés à Éliézer
  rationale: La préposition לְ exprime ici vraisemblablement l’appartenance ou le rattachement à la branche d’Éliézer. « Rattachés à » reste naturel en français tout en évitant de préciser indûment la relation.
- source_word: רְחַבְיָהוּ
  choice: Rehabia
  rationale: Transcription française claire du nom propre hébreu, sans traduire son sens étymologique.
- source_word: בְנוֹ
  choice: son fils
  rationale: La répétition de cette expression dans l’hébreu marque explicitement chaque maillon de la lignée; elle est donc conservée à chaque occurrence.
- source_word: וִישַׁעְיָהוּ
  choice: Yeshaya
  rationale: Cette transcription distingue cet homme du prophète couramment appelé Ésaïe en français, tout en représentant clairement le nom hébreu.
- source_word: וְיֹרָם
  choice: Joram
  rationale: Le texte porte la forme courte יוֹרָם, rendue par sa forme française conventionnelle « Joram ».
- source_word: וְזִכְרִי
  choice: Zikri
  rationale: Transcription française régulière du nom propre hébreu.
- source_word: וּשְׁלֹמוֹת
  choice: et Shelomith
  rationale: Transcription reconnaissable du nom propre tel qu’il est traditionnellement distingué en français; la conjonction hébraïque est rendue devant le dernier élément de la liste.
theological_decisions: []
