  text: For the Amramites[a], the Izharites, the Hebronites, and the Uzzielites.
translation:
  language: fr
  text: Pour les Amramites[a], les Yitseharites, les Hébronites et les Ouzziélites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quant aux Amramites, aux Yitseharites, aux Hébronites et aux Ouzziélites. » L’hébreu ne comporte que quatre noms de clans précédés de la préposition ל ; l’ensemble sert de titre de rubrique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעַמְרָמִי
  choice: Pour les Amramites
  rationale: Le ל préfixé à une désignation familiale introduit ici vraisemblablement une rubrique dans une liste administrative. « Pour » conserve cette fonction tout en donnant une formulation française naturelle.
- source_word: לַיִּצְהָרִי
  choice: les Yitseharites
  rationale: Forme gentilice désignant le clan issu de Yitsehar. La translittération sous forme de nom de clan maintient la concision et le parallélisme de l’hébreu.
- source_word: לַחֶבְרוֹנִי
  choice: les Hébronites
  rationale: Désignation gentilice du clan associé à Hébron, rendue de manière cohérente avec les autres noms de clans.
- source_word: לָעָזִּיאֵלִי
  choice: et les Ouzziélites
  rationale: Désignation gentilice du clan issu d’Ouzziel. La conjonction « et », absente de cette liste nominale hébraïque, est ajoutée conformément à l’usage naturel du français.
