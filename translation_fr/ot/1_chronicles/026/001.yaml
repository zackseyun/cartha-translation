  terminology: « Gardiens des portes », « Coréites », « Meshélémia » et « Coré » sont appropriés. « Divisions » rend avec précision les unités organisées de service sans les interpréter comme de simples groupes informels. Le nom Asaph doit être conservé tel que le porte le texte massorétique fourni, sans harmonisation généalogique.
