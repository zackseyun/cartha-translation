  text: לְ/מַחְלְק֖וֹת לְ/שֹׁעֲרִ֑ים לַ/קָּרְחִ֕ים מְשֶֽׁלֶמְיָ֥הוּ בֶן קֹרֵ֖א מִן בְּנֵ֥י אָסָֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/001.yaml
  text: 'For the divisions of the gatekeepers: of the Korahites[a], Meshelemiah son of Kore, from the sons of Asaph.'
translation:
  language: fr
  text: 'Pour les divisions des gardiens des portes[a] : pour les Coréites, Meshélémia, fils de Coré, parmi les fils d’Asaph.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Selon les divisions des gardiens des portes. » L’expression initiale sert de rubrique et introduit les divisions des gardiens des portes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלְקוֹת לְשֹׁעֲרִים
  choice: Pour les groupes de gardiens des portes
  rationale: La première préposition introduit ici le sujet ou la rubrique. מַחְלְקוֹת désigne les divisions organisées ou équipes de service ; « groupes » est clair en français actuel, tandis que « gardiens des portes » rend précisément la fonction de שֹׁעֲרִים.
- source_word: לַקָּרְחִים
  choice: parmi les Coréites
  rationale: L’expression situe Meshélémia dans le clan des descendants de Coré. « Coréites » est la forme française usuelle, et « parmi » convient à la syntaxe elliptique d’une liste.
- source_word: מְשֶׁלֶמְיָהוּ
  choice: Meshélémia
  rationale: Translittération française du nom propre selon sa forme consonantique dans ce verset.
- source_word: בֶן קֹרֵא
  choice: fils de Coré
  rationale: בֶן exprime ici naturellement une filiation immédiate ; le nom קֹרֵא est rendu par la forme française « Coré ».
- source_word: מִן בְּנֵי אָסָף
  choice: d’entre les fils d’Asaph
  rationale: מִן indique l’appartenance à un ensemble familial. « D’entre » conserve cette nuance sans préciser davantage l’identité d’Asaph.
