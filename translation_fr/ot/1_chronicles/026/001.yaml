  - severity: low
    issue: « d’entre les fils d’Asaph »
    rationale: La formulation est compréhensible, mais « parmi les fils d’Asaph » est plus idiomatique dans une notice elliptique et conserve la valeur d’origine ou d’appartenance de מִן.
