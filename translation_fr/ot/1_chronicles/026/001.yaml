  source_fidelity: 'Le texte hébreu a une syntaxe de rubrique elliptique : « Pour les divisions des gardiens des portes : pour les Coréites, Meshélémia, fils de Coré, parmi les fils d’Asaph. » Le projet rend globalement les éléments lexicaux, mais « parmi les Coréites » transforme plus nettement le syntagme de clan introduit par ל en indication d’appartenance de Meshélémia. « Pour les Coréites » conserve mieux le parallélisme administratif des prépositions et l’ellipse de la source. « Divisions » est aussi le correspondant direct et institutionnel de מַחְלְקוֹת, préférable à « groupes ».'
