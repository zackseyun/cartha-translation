base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/017.yaml
  text: On the east were six Levites; on the north[a], four a day; on the south, four a day; and at the storehouses, two by two.
translation:
  language: fr
  text: À l’est, six Lévites ; au nord, quatre par jour ; au sud, quatre par jour ; et aux entrepôts[a], deux par deux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Assouppim. Le terme peut désigner un lieu précis ou un ensemble de salles plutôt que des entrepôts au sens général.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּזְרָח
  choice: À l’est
  rationale: L’expression directionnelle introduit le côté auquel les gardiens sont affectés ; cette formulation est naturelle en français dans une liste de postes.
- source_word: הַלְוִיִּם
  choice: Lévites
  rationale: Le nom désigne ici les membres du groupe lévitique chargés de la garde. L’article hébreu n’a pas besoin d’être rendu dans cette construction française.
- source_word: שִׁשָּׁה
  choice: six
  rationale: Le nombre indique l’effectif affecté au côté est.
- source_word: לַצָּפוֹנָה
  choice: au nord
  rationale: Expression locative parallèle aux indications de l’est et du sud.
- source_word: לַיּוֹם
  choice: par jour
  rationale: Dans ce relevé administratif, l’expression indique un effectif quotidien ; « par jour » rend clairement sa valeur distributive.
- source_word: אַרְבָּעָה
  choice: quatre
  rationale: Nombre cardinal indiquant les effectifs quotidiens au nord et au sud.
- source_word: לַנֶּגְבָּה
  choice: au sud
  rationale: Expression directionnelle rendue de façon parallèle à « à l’est » et « au nord ».
- source_word: וְלָאֲסֻפִּים
  choice: et aux entrepôts[a]
  rationale: Le terme semble désigner des locaux de rassemblement ou de stockage dans l’ensemble du Temple, mais son référent exact reste incertain ; la note conserve cette ambiguïté.
- source_word: שְׁנַיִם שְׁנָיִם
  choice: deux par deux
  rationale: La répétition du nombre a une valeur distributive et indique une affectation par groupes de deux.
