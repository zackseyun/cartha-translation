  text: וַ/יִּפֹּ֧ל הַ/גּוֹרָ֛ל מִזְרָ֖חָ/ה לְ/שֶֽׁלֶמְיָ֑הוּ וּ/זְכַרְיָ֨הוּ בְנ֜/וֹ יוֹעֵ֣ץ בְּ/שֶׂ֗כֶל הִפִּ֨ילוּ֙ גּֽוֹרָל֔וֹת וַ/יֵּצֵ֥א גוֹרָל֖/וֹ צָפֽוֹנָ/ה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/014.yaml
  text: The lot for the east fell to Shelemyahu. Then they cast lots for his son Zekaryahu[a], a counselor with insight, and his lot came out for the north.
translation:
  language: fr
  text: Le lot pour l’est tomba sur Shélémia. Puis on tira au sort pour son fils Zacharie, un conseiller doué de discernement[a], et le lot lui attribua le nord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un conseiller avisé ». L’expression hébraïque décrit littéralement Zacharie comme « un conseiller avec discernement » ou « avec prudence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל הַגּוֹרָל
  choice: Le lot … tomba
  rationale: L’expression française conserve l’image concrète de l’hébreu נפל avec גּוֹרָל tout en restant naturelle dans le contexte d’un tirage au sort.
- source_word: מִזְרָחָה
  choice: pour l’est
  rationale: Le hé directionnel indique ici le secteur attribué; « pour l’est » exprime clairement cette affectation.
- source_word: לְשֶׁלֶמְיָהוּ
  choice: sur Shélémia
  rationale: Avec « le lot tomba », la préposition « sur » rend naturellement le destinataire marqué par לְ. Le nom suit une forme française courante proche de l’hébreu.
- source_word: וּזְכַרְיָהוּ בְנוֹ
  choice: Puis on tira au sort pour son fils Zacharie
  rationale: La formulation explicite en français la reprise du tirage au sort exprimée plus loin dans la proposition hébraïque. « Puis » rend la progression narrative du waw sans alourdir la phrase.
- source_word: יוֹעֵץ בְּשֶׂכֶל
  choice: un conseiller doué de discernement
  rationale: 'Cette traduction conserve les deux éléments: יוֹעֵץ, « conseiller », et שֶׂכֶל, « discernement, intelligence pratique ». Elle évite de réduire l’expression au seul adjectif « sage ».'
- source_word: הִפִּילוּ גּוֹרָלוֹת
  choice: on tira au sort
  rationale: « Tirer au sort » est l’expression française idiomatique correspondant au hiphil de נפל avec גּוֹרָלוֹת. Le sujet indéfini pluriel hébreu est rendu naturellement par « on ».
- source_word: וַיֵּצֵא גוֹרָלוֹ
  choice: et le lot lui attribua
  rationale: La tournure exprime idiomatiquement en français le résultat qui « sort » du tirage, tout en distinguant ce verbe de « tomba » employé au début.
- source_word: צָפוֹנָה
  choice: le nord
  rationale: Le hé directionnel désigne le secteur septentrional attribué; le sens d’affectation est porté par le verbe français « attribua ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation garde l’image du lot qui « tombe » dans la première proposition, mais emploie des expressions françaises idiomatiques pour la suite. Les noms sont donnés sous leurs formes françaises usuelles, Shélémia et Zacharie.
