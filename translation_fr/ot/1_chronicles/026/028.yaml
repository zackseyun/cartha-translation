source:
  edition: WLC
  text: וְ/כֹ֨ל הַֽ/הִקְדִּ֜ישׁ שְׁמוּאֵ֤ל הָ/רֹאֶה֙ וְ/שָׁא֣וּל בֶּן קִ֔ישׁ וְ/אַבְנֵ֣ר בֶּן נֵ֔ר וְ/יוֹאָ֖ב בֶּן צְרוּיָ֑ה כֹּ֚ל הַ/מַּקְדִּ֔ישׁ עַ֥ל יַד שְׁלֹמִ֖ית וְ/אֶחָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/028.yaml
  text: And all that Samuel the seer[a], Saul son of Kish, Abner son of Ner[b], and Joab son of Zeruiah had dedicated—everything that anyone had dedicated—was under the care of Shelomith and his brothers.
translation:
  language: fr
  text: Tout ce que Samuel le voyant[a], Saül fils de Qish, Abner fils de Ner et Joab fils de Tserouya avaient consacré — tout ce que quiconque avait consacré — était confié à Shelomith et à ses frères.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « voyant » est un ancien titre désignant une figure prophétique.
    reason: cultural_note
  - marker: b
    text: 'Ou : « était sous la responsabilité de Shelomith et de ses frères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Tout ce que
  rationale: Dans ce contexte, כֹּל englobe l’ensemble des biens consacrés; « Tout ce que » introduit naturellement en français la liste des personnes qui les avaient consacrés.
- source_word: הַהִקְדִּישׁ
  choice: avaient consacré
  rationale: Le hiphil de קדשׁ désigne ici l’action de vouer ou d’affecter des biens à un usage sacré. Le plus-que-parfait convient au regard rétrospectif du passage.
- source_word: שְׁמוּאֵל הָרֹאֶה
  choice: Samuel le voyant
  rationale: « Voyant » conserve le titre hébreu spécifique רֹאֶה sans l’assimiler au terme plus général « prophète ».
- source_word: בֶּן
  choice: fils de
  rationale: La formule généalogique désigne ici directement la filiation.
- source_word: צְרוּיָה
  choice: Tserouya
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: כֹּל הַמַּקְדִּישׁ
  choice: tout ce que quiconque avait consacré
  rationale: La formulation rend le participe actif substantivé et la portée générale de כֹּל, tout en montrant que la phrase récapitule l’ensemble des biens consacrés, au-delà des personnes déjà nommées.
- source_word: עַל יַד
  choice: était confié à
  rationale: Dans ce contexte administratif, l’expression idiomatique indique la responsabilité ou la garde; « était confié à » est naturel et précis en français.
- source_word: שְׁלֹמִית
  choice: Shelomith
  rationale: Translittération du nom propre hébreu.
- source_word: וְאֶחָיו
  choice: et à ses frères
  rationale: Le pluriel masculin muni du suffixe renvoie naturellement aux frères de Shelomith, probablement associés à sa responsabilité administrative.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La construction avec tirets conserve la reprise emphatique de l’hébreu, tandis que « confié à » exprime clairement la fonction administrative sans reproduire littéralement l’idiome « sur la main de ».
