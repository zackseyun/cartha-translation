  yaml_path: translation/ot/1_chronicles/026/019.yaml
  text: These were the divisions of the gatekeepers for the sons of the Korahites and for the sons of Merari[a].
translation:
  language: fr
  text: Voici les groupes de gardiens des portes pour les descendants de Coré et pour les descendants de Merari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Tels étaient
  rationale: Le démonstratif pluriel ouvre une phrase récapitulative sans verbe exprimé en hébreu. L’imparfait convient naturellement en français au cadre narratif de la liste, tandis que le présent littéral est signalé en note.
- source_word: מַחְלְקוֹת
  choice: les groupes
  rationale: Le terme désigne ici des divisions organisées affectées au service du sanctuaire. « Groupes » exprime clairement cette organisation en français moderne sans la connotation militaire possible de « divisions ».
- source_word: הַשֹּׁעֲרִים
  choice: de gardiens des portes
  rationale: Le mot désigne les hommes chargés de surveiller les portes. « Gardiens des portes » est précis, actuel et adapté au cadre du sanctuaire.
- source_word: לִבְנֵי הַקָּרְחִי
  choice: parmi les descendants de Coré
  rationale: L’expression désigne l’appartenance au clan issu de Coré. « Descendants » rend le sens collectif de « fils » dans une généalogie, et « parmi » exprime la répartition des groupes à l’intérieur de ces lignées.
- source_word: וְלִבְנֵי מְרָרִי
  choice: et les descendants de Merari
  rationale: Le français reprend la structure parallèle tout en rendant l’expression clanique « fils de Merari » par « descendants de Merari ».
