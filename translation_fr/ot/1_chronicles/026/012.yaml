  text: לְ֠/אֵלֶּה מַחְלְק֨וֹת הַ/שֹּֽׁעֲרִ֜ים לְ/רָאשֵׁ֧י הַ/גְּבָרִ֛ים מִשְׁמָר֖וֹת לְ/עֻמַּ֣ת אֲחֵי/הֶ֑ם לְ/שָׁרֵ֖ת בְּ/בֵ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/012.yaml
  text: For these divisions of the gatekeepers[a], the chief men had assigned duties corresponding to those of their brothers, to minister in the house of Yahweh.
translation:
  language: fr
  text: Pour ces divisions de gardiens des portes[a], les principaux responsables avaient, comme leurs frères, des charges de service, pour servir dans la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les chefs des hommes avaient des tours de garde aux côtés de leurs frères ». L’hébreu est condensé : le mot traduit par « charges de service » peut aussi désigner des tours de garde ou des services, et l’expression peut marquer une relation de correspondance ou de proximité avec leurs frères.'
    reason: Signaler la syntaxe elliptique et les principales possibilités lexicales de מִשְׁמָרוֹת et לְעֻמַּת, sans introduire l’idée d’une assignation.
lexical_decisions:
- source_word: לְאֵלֶּה מַחְלְקוֹת
  choice: Pour ces classes
  rationale: Le ל préfixé introduit l’organisation décrite, tandis que מַחְלְקוֹת désigne des groupes organisés pour le service. « Classes » est courant dans le contexte des rotations cultuelles.
- source_word: הַשֹּׁעֲרִים
  choice: gardiens des portes
  rationale: Désigne les hommes chargés de surveiller et de gérer les accès; cette expression est plus transparente en français moderne que « portiers » dans ce contexte.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: les chefs
  rationale: La formule hébraïque est condensée et signifie littéralement « les chefs des hommes ». « Les chefs » conserve la notion d’autorité sans suggérer à tort un rôle militaire.
- source_word: מִשְׁמָרוֹת
  choice: avaient des services assignés
  rationale: Le nom peut désigner des gardes, des tours de service ou des charges. L’hébreu étant elliptique, l’ajout minimal du verbe « avaient » produit une phrase française intelligible sans préciser qui a fait l’assignation.
- source_word: לְעֻמַּת אֲחֵיהֶם
  choice: correspondant à ceux de leurs frères
  rationale: לְעֻמַּת exprime ici une relation de correspondance ou de parallèle. Le terme familial « frères » est conservé plutôt que remplacé par une interprétation contextuelle.
- source_word: לְשָׁרֵת
  choice: afin de servir
  rationale: Le verbe exprime le service cultuel. « Servir » reste naturel et digne en français, le cadre sacré étant explicité par « dans la maison de Yahweh ».
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: La traduction conserve l’image hébraïque de la « maison » ainsi que le nom divin personnel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » restitue le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de אֲחֵיהֶם
  choice: leurs frères
  alternative: leurs compatriotes lévites
  rationale: Le sens littéral et relationnel est maintenu sans expliciter dans le texte une identification contextuelle plus précise.
- issue: Nature de מִשְׁמָרוֹת
  choice: services assignés
  alternative: tours de garde
  rationale: Le terme peut couvrir aussi bien des périodes de garde que des charges de service. Le choix principal maintient cette largeur sémantique, tandis que la note signale les autres possibilités.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La formulation garde l’ellipse administrative du texte tout en ajoutant seulement le verbe nécessaire à une phrase française naturelle.
