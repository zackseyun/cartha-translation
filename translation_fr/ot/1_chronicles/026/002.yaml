  text: 'And Shelemiah had sons: Zechariah the firstborn[a], Jediael the second, Zebadiah the third[b], and Jathniel the fourth.'
translation:
  language: fr
  text: Et Shelémia eut pour fils Zacharie, le premier-né, Jediaël, le deuxième, Zebadia, le troisième, et Jatniel, le quatrième.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִמְשֶׁלֶמְיָהוּ בָּנִים
  choice: Shelémia eut pour fils
  rationale: La construction généalogique hébraïque est littéralement « et à Shelémia, des fils ». Le français idiomatique exprime cette relation par « eut pour fils », tout en conservant explicitement la filiation masculine.
- source_word: זְכַרְיָהוּ
  choice: Zacharie
  rationale: Forme française biblique usuelle de ce nom propre.
- source_word: הַבְּכוֹר
  choice: le premier-né
  rationale: Le terme désigne précisément le fils premier-né, et non simplement l’aîné au sens large.
- source_word: יְדִיעֲאֵל
  choice: Jediaël
  rationale: Transcription française claire du nom hébreu, avec le tréma indiquant la séparation des voyelles.
- source_word: הַשֵּׁנִי
  choice: le deuxième
  rationale: Rendu direct de l’ordinal, harmonisé avec les ordinaux suivants.
- source_word: זְבַדְיָהוּ
  choice: Zebadia
  rationale: Transcription française naturelle du nom hébreu.
- source_word: הַשְּׁלִישִׁי
  choice: le troisième
  rationale: Rendu direct de l’ordinal hébreu.
- source_word: יַתְנִיאֵל
  choice: Jatniel
  rationale: Transcription française conventionnelle, où le yod initial des noms bibliques est couramment rendu par J.
- source_word: הָרְבִיעִי
  choice: le quatrième
  rationale: Rendu direct de l’ordinal hébreu.
