base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/007.yaml
  text: 'The sons of Shemaiah: Othni[a], Rephael, Obed, Elzabad, whose brothers were capable men, Elihu and Semakiah.'
translation:
  language: fr
  text: Les fils de Shemaya étaient Othni, Rephaël, Obed et Elzabad. Les frères de ce dernier, Élihou et Semakiahou, étaient des hommes capables[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hommes vaillants » ou « des hommes de valeur ». L’expression hébraïque peut évoquer la force, la vaillance ou la compétence ; ici, elle souligne probablement leur aptitude au service.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שְׁמַעְיָה
  choice: Les fils de Shemaya
  rationale: Le groupe construit exprime la filiation. Cette formulation conserve le style généalogique tout en restant naturelle en français.
- source_word: עָתְנִי וּרְפָאֵל וְעוֹבֵד אֶלְזָבָד
  choice: Othni, Rephaël, Obed et Elzabad
  rationale: Les noms propres sont translittérés sous des formes claires et adaptées à l’usage français; le tréma de « Rephaël » signale que les voyelles se prononcent séparément.
- source_word: אֶחָיו
  choice: Les frères de ce dernier
  rationale: Le suffixe hébreu est à la troisième personne du masculin singulier, littéralement « ses frères ». « De ce dernier » rattache naturellement Élihou et Semakia à Elzabad, l’antécédent masculin singulier le plus proche, sans remplacer le singulier par un pluriel interprétatif.
- source_word: בְּנֵי חָיִל
  choice: des hommes capables
  rationale: Dans cette liste de portiers, חַיִל peut désigner la force, la valeur ou l’aptitude. « Hommes capables » met en avant leur compétence pour le service sans imposer une nuance exclusivement militaire.
- source_word: אֱלִיהוּ וּסְמַכְיָהוּ
  choice: Élihou et Semakia
  rationale: Translittération française lisible des noms hébreux, avec des formes qui reflètent leur vocalisation massorétique.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La phrase hébraïque très compacte est répartie en deux phrases afin de rendre clairement la relation syntaxique entre Elzabad, ses frères et leur qualité, tout en conservant le singulier du suffixe hébreu.
