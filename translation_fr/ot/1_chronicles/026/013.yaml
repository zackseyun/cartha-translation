  yaml_path: translation/ot/1_chronicles/026/013.yaml
  text: And they cast lots[a], small and great alike, according to their fathers’ houses, for each gate.
translation:
  language: fr
  text: Ils tirèrent au sort, les petits comme les grands, selon leurs familles ancestrales, pour chaque porte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète le nom « porte » au singulier (« pour porte et porte »), pour exprimer une répartition porte par porte.
    reason: La répétition du nom singulier en hébreu exprime une distribution que le français rend naturellement par « chaque ».
lexical_decisions:
- source_word: וַיַּפִּילוּ גוֹרָלוֹת
  choice: Ils tirèrent au sort
  rationale: L’expression hébraïque formée avec le hifil de נפל et גוֹרָלוֹת désigne idiomatiquement le recours au tirage au sort. La formulation française usuelle rend clairement l’action sans reproduire littéralement « faire tomber des sorts ».
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: les petits comme les grands
  rationale: Cette formulation conserve l’opposition hébraïque entre « petit » et « grand » ainsi que l’idée d’une participation sans distinction, sans préciser de manière incertaine s’il s’agit de l’âge, du rang ou de l’importance.
- source_word: לְבֵית אֲבוֹתָם
  choice: selon leurs familles ancestrales
  rationale: בֵּית אָבוֹת désigne ici les unités familiales ou claniques fondées sur la lignée paternelle. « Familles ancestrales » est naturel en français moderne et évite l’opacité de « maisons de leurs pères ».
- source_word: לְשַׁעַר וָשָׁעַר
  choice: pour chaque porte
  rationale: 'La répétition du nom singulier a une valeur distributive : les attributions sont faites individuellement pour les différentes portes. « Pour chaque porte » en donne le sens naturel.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tour « les petits comme les grands » préserve l’ambiguïté de l’expression hébraïque, tandis que « familles ancestrales » explicite sobrement la structure familiale sans ajouter de précision confessionnelle.
