  text: 'For the Parbar on the west: four at the road[b][a], and two at the Parbar.'
translation:
  language: fr
  text: 'Pour le Parbar, à l’ouest : quatre à la voie surélevée[b], et deux au Parbar[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Parbar » transcrit un terme hébreu rare dont le sens exact est incertain. Il pourrait désigner une enceinte, une cour, une annexe ou, selon la traduction traditionnelle, un faubourg.
    reason: lexical_alternative
  - marker: b
    text: Ou « route » ou « chaussée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְבָּר
  choice: Parbar
  rationale: Ce terme hébreu rare désigne apparemment un secteur ou un élément architectural précis près du Temple, mais son sens exact demeure incertain. La translittération évite de privilégier sans preuve suffisante « colonnade », « cour », « annexe » ou « enceinte ».
- source_word: מַעֲרָב
  choice: à l’ouest
  rationale: Le terme indique le côté ou la direction de l’ouest; cette formulation est naturelle dans une liste d’affectations.
- source_word: אַרְבָּעָה
  choice: quatre
  rationale: Nombre cardinal désignant vraisemblablement quatre gardes ou quatre postes, déterminés par le contexte du passage.
- source_word: מְסִלָּה
  choice: voie surélevée
  rationale: Le mot peut désigner une route aménagée, souvent surélevée, ou une chaussée. « Voie surélevée » conserve cette nuance sans imposer l’idée moderne d’une autoroute.
- source_word: שְׁנַיִם
  choice: deux
  rationale: Nombre cardinal désignant la seconde affectation dans cette liste.
- source_word: לְ
  choice: du côté de / près de
  rationale: La préposition répétée marque ici les emplacements auxquels les gardes sont affectés; le français demande des formulations légèrement différentes selon le complément.
