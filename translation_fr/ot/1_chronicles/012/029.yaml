  text: וְ/צָד֥וֹק נַ֖עַר גִּבּ֣וֹר חָ֑יִל וּ/בֵית אָבִ֥י/ו שָׂרִ֖ים עֶשְׂרִ֥ים וּ/שְׁנָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/029.yaml
  text: And Zadok[a], a young man mighty in valor[b], and from his father’s house twenty-two commanders.
translation:
  language: fr
  text: Et Tsadok, un jeune homme puissant et vaillant[a], et vingt-deux chefs issus de la maison de son père[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un homme puissant et valeureux » ou « un vaillant guerrier ».
    reason: L’expression hébraïque גִּבּוֹר חָיִל peut désigner à la fois la force, la vaillance et, dans ce contexte, la capacité guerrière.
  - marker: b
    text: Littéralement « la maison de son père »; peut aussi désigner sa lignée paternelle ou son clan.
    reason: L’idiome hébreu בֵית אָבִיו renvoie au groupe familial rattaché à la lignée paternelle.
lexical_decisions:
- source_word: צָדוֹק
  choice: Tsadok
  rationale: Nom propre translittéré selon une forme française proche de l’hébreu.
- source_word: נַעַר
  choice: un jeune homme
  rationale: Dans cette liste militaire, le terme désigne naturellement un homme jeune, sans qu’il soit nécessaire d’y voir un serviteur.
- source_word: גִּבּוֹר חָיִל
  choice: vaillant
  rationale: Dans ce contexte militaire, l’expression qualifie la force et la bravoure de Tsadok. La formulation concise s’intègre naturellement à la phrase nominale hébraïque.
- source_word: בֵית אָבִיו
  choice: sa famille paternelle
  rationale: L’expression désigne la maisonnée, la lignée ou le groupe familial rattaché au père; «famille paternelle» conserve cette structure sociale sans donner à «maison» un sens matériel.
- source_word: שָׂרִים
  choice: chefs
  rationale: Le terme désigne ici des hommes exerçant une autorité. «Chefs» préserve une certaine généralité, là où «commandants» imposerait plus nettement un grade militaire.
- source_word: עֶשְׂרִים וּשְׁנָיִם
  choice: vingt-deux
  rationale: Rendu direct du nombre cardinal.
- source_word: וְ
  choice: et
  rationale: La conjonction maintient la structure cumulative de la liste; en français, la première conjonction est implicitement portée par la continuité du contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase nominale et la coordination de l’hébreu sont conservées sans ajouter de verbe absent du texte source.
