  text: אֵ֥לֶּה מִ/בְּנֵי גָ֖ד רָאשֵׁ֣י הַ/צָּבָ֑א אֶחָ֤ד לְ/מֵאָה֙ הַ/קָּטָ֔ן וְ/הַ/גָּד֖וֹל לְ/אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/015.yaml
  text: These were from the sons of Gad[a], heads of the army; the least was for a hundred, and the greatest for a thousand.
translation:
  language: fr
  text: 'Ce sont des fils de Gad, chefs de l’armée : le moindre en valait cent, et le plus grand, mille[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le moindre, un pour cent, et le plus grand, pour mille ». Cette tournure concise peut exprimer leur valeur ou leur efficacité militaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מִבְּנֵי גָד
  choice: Ce sont ceux des fils de Gad
  rationale: La proposition hébraïque est nominale. Cette formulation conserve l’expression tribale littérale « fils de Gad » tout en étant naturelle en français.
- source_word: רָאשֵׁי הַצָּבָא
  choice: chefs de l’armée
  rationale: רָאשֵׁי désigne ici les chefs ou dirigeants; « chefs de l’armée » restitue clairement la fonction militaire sans imposer un grade précis.
- source_word: הַקָּטָן
  choice: le moindre
  rationale: Dans l’opposition avec הַגָּדוֹל, le terme désigne vraisemblablement celui qui avait le moins de rang, de force ou d’importance, plutôt qu’une petite taille physique.
- source_word: אֶחָד לְמֵאָה ... וְהַגָּדוֹל לְאָלֶף
  choice: le moindre en valait cent, et le plus grand, mille
  rationale: L’hébreu elliptique énonce littéralement une proportion « un pour cent… le grand pour mille ». « En valait » exprime naturellement la valeur ou l’efficacité militaire probable, tandis que la note préserve la formulation plus littérale et son ambiguïté.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste concise et conserve l’expression familiale et tribale « fils de Gad ». L’ellipse numérique hébraïque est rendue de façon intelligible dans le texte, avec sa forme plus littérale signalée en note.
