source:
  edition: WLC
  text: וּ/מִן הַ/דָּנִי֙ עֹרְכֵ֣י מִלְחָמָ֔ה עֶשְׂרִֽים וּ/שְׁמוֹנָ֥ה אֶ֖לֶף וְ/שֵׁ֥שׁ מֵאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/036.yaml
  text: From Dan[a], twenty-eight thousand six hundred prepared for battle.
translation:
  language: fr
  text: De Dan, 28 600 hommes rangés en ordre de bataille[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prêts au combat » ou « se mettant en formation pour le combat ». La tournure participiale hébraïque souligne la préparation militaire ou la mise en ordre de bataille.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: De
  rationale: La conjonction préfixée peut se traduire littéralement par « et », mais dans cette liste tribale, « De » assure en français un enchaînement naturel sans perte de sens.
- source_word: הַדָּנִי
  choice: Dan
  rationale: Le gentilé hébreu désigne ici la tribu représentée dans le dénombrement; « Dan » est plus naturel et évite un singulier trompeur comme « le Danite ».
- source_word: עֹרְכֵי מִלְחָמָה
  choice: hommes rangés en ordre de bataille
  rationale: Le participe exprime l'action de disposer ou de se disposer pour le combat. Cette formulation conserve l'image d'une formation militaire tout en restant claire en français moderne.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 28 600
  rationale: Rendu direct du nombre hébreu selon la notation typographique française courante.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et digne. L'ajout de « hommes », implicite dans ce dénombrement militaire, permet une syntaxe naturelle; « rangés en ordre de bataille » préserve davantage l'image du participe hébreu qu'une simple expression générale de disponibilité.
