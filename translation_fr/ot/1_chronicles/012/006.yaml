  text: Eluzai[a], Jerimoth, Bealiah, Shemariahu, and Shephatiah the Haruphite.
translation:
  language: fr
  text: Élouzaï, Yerimoth, Béalia, Shemariahou et Shephatiahou le Harifite[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Harouphite ». Le gentilé hébreu peut refléter un nom de clan apparenté à Hariph, attesté ailleurs sous une forme voisine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְעוּזַי
  choice: Élouzaï
  rationale: Nom propre translittéré selon des conventions françaises lisibles; le tréma distingue les deux voyelles finales.
- source_word: וִירִימוֹת
  choice: Yerimoth
  rationale: Nom propre translittéré; le waw conjonctif est rendu naturellement par la ponctuation de l’énumération plutôt que répété devant chaque nom.
- source_word: וּבְעַלְיָה
  choice: Béalia
  rationale: Nom propre translittéré dans une forme naturelle en français, sans traduire l’élément théophore ou nominal.
- source_word: וּשְׁמַרְיָהוּ
  choice: Shemariahou
  rationale: La finale hébraïque pleine -yāhû est conservée sous la forme française « -iahou ».
- source_word: וּשְׁפַטְיָהוּ
  choice: Shephatiahou
  rationale: Nom propre translittéré en conservant la finale hébraïque pleine -yāhû; « ph » représente ici la consonne spirantisée selon une convention française courante.
- source_word: החריפי
  choice: le Harifite
  rationale: Le gentilé articulé indique l’appartenance à une famille ou à un clan. La forme « Harifite » suit directement les consonnes du texte source fourni et adapte le suffixe gentilicial au français.
theological_decisions: []
translation_notes:
  register: Énumération concise et digne, avec translittération française moderne des noms. Le marqueur de note est placé après le gentilé auquel la variante se rapporte.
