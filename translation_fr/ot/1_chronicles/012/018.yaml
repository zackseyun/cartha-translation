base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/018.yaml
  text: David went out before them and answered and said to them[a], “If you have come to me in peace to help me, my heart will be united with you; but if you have come to betray me to my enemies, though there is no violence in my hands[b], may the God of our fathers see and judge.”
translation:
  language: fr
  text: 'David sortit à leur rencontre et leur dit : « Si vous venez à moi dans des intentions pacifiques pour m’aider, mon cœur s’unira à vous. Mais si c’est pour me livrer par traîtrise à mes ennemis[a], alors qu’il n’y a aucune violence dans mes mains, que le Dieu de nos pères voie et juge[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour me tromper ». Le verbe hébreu peut désigner une tromperie perfide ; dans ce contexte, « me livrer par traîtrise à mes ennemis » explicite l’issue redoutée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qu’il tranche » ou « qu’il réprimande ». Le verbe hébreu peut désigner l’action d’arbitrer, de rendre une décision ou de reprendre.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא דָוִיד לִפְנֵיהֶם
  choice: David sortit à leur rencontre
  rationale: Littéralement, David « sortit devant eux ». Dans ce contexte, « à leur rencontre » exprime naturellement en français le mouvement par lequel il se présente devant le groupe, sans suggérer qu’il les accueille déjà favorablement.
- source_word: וַיַּעַן וַיֹּאמֶר לָהֶם
  choice: et leur dit
  rationale: La formule narrative hébraïque « répondit et dit » est idiomatiquement condensée en français. Aucun propos antérieur immédiat n’exige ici le verbe « répondre ».
- source_word: אִם לְשָׁלוֹם בָּאתֶם אֵלַי
  choice: Si vous venez à moi dans des intentions pacifiques
  rationale: לְשָׁלוֹם décrit ici le caractère pacifique et loyal de leur démarche. Cette formulation française est plus naturelle que le calque « pour la paix ».
- source_word: לְעָזְרֵנִי
  choice: pour m’aider
  rationale: L’infinitif exprime directement le but de leur venue.
- source_word: יִהְיֶה לִּי עֲלֵיכֶם לֵבָב לְיָחַד
  choice: mon cœur s’unira à vous
  rationale: La tournure hébraïque idiomatique exprime une solidarité sincère et une unité de cœur. La traduction conserve l’image du cœur sans reproduire une syntaxe obscure.
- source_word: לְרַמּוֹתַנִי לְצָרַי
  choice: pour me livrer par traîtrise à mes ennemis
  rationale: רמה peut signifier tromper ou agir avec traîtrise. Le complément « à mes ennemis » indique ici une trahison ayant pour résultat de livrer David à ses adversaires.
- source_word: בְּלֹא חָמָס בְּכַפַּי
  choice: alors qu’il n’y a aucune violence entre mes mains
  rationale: La traduction préserve חמס, « violence, tort », ainsi que l’image concrète des paumes ou mains, qui affirme l’innocence de David.
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: le Dieu de nos pères
  rationale: Cette expression traditionnelle correspond précisément au masculin pluriel hébreu et conserve sa résonance ancestrale et collective.
- source_word: יֵרֶא ... וְיוֹכַח
  choice: que ... le voie et qu’il juge
  rationale: Les formes verbales ont ici la valeur d’un appel solennel à l’intervention divine. Le pronom « le » renvoie à la situation de violence ou de trahison évoquée. יכח peut désigner l’action d’arbitrer, de reprendre ou de rendre une décision.
theological_decisions:
- issue: Nature de l’intervention divine dans l’appel final
  choice: que le Dieu de nos pères le voie et qu’il juge
  alternative: le Dieu de nos pères verra et jugera ; que le Dieu de nos pères voie et réprimande
  rationale: Le contexte favorise un souhait ou un appel à l’arbitrage divin plutôt qu’une simple prédiction. « Juge » rend la dimension judiciaire sans déterminer d’avance sous quelle forme Dieu interviendra.
translation_notes:
  register: Français moderne, international et digne. Le discours reste direct et solennel. « À leur rencontre » et « dans des intentions pacifiques » évitent des calques peu naturels, tandis que « mon cœur » et « entre mes mains » conservent les images importantes de l’hébreu.
