  text: בְּנֵ֣י יְהוּדָ֔ה נֹשְׂאֵ֥י צִנָּ֖ה וָ/רֹ֑מַח שֵׁ֧שֶׁת אֲלָפִ֛ים וּ/שְׁמוֹנֶ֥ה מֵא֖וֹת חֲלוּצֵ֥י צָבָֽא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/025.yaml
  text: From the sons of Judah[a], carrying shield and spear, there were 6,800 equipped for battle.
translation:
  language: fr
  text: 'Des fils de Juda, portant le grand bouclier et la lance : 6 800 hommes équipés pour le combat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: Des fils de Juda
  rationale: L’expression désigne les membres ou descendants de la tribu de Juda. « Des fils de Juda » conserve la forme hébraïque et s’intègre à l’énumération des contingents tribaux.
- source_word: נֹשְׂאֵי
  choice: portant
  rationale: Le participe décrit ceux qui portent leur équipement militaire ; « portant » est naturel et précis en français actuel.
- source_word: צִנָּה
  choice: le grand bouclier
  rationale: צִנָּה désigne généralement un bouclier de grandes dimensions, par opposition à un bouclier plus petit ; cette précision lexicale peut être rendue naturellement en français.
- source_word: וָרֹמַח
  choice: et la lance
  rationale: רֹמַח désigne une lance ou une pique ; « lance » est le terme français courant et accessible.
- source_word: שֵׁשֶׁת אֲלָפִים וּשְׁמוֹנֶה מֵאוֹת
  choice: 6 800
  rationale: L’expression numérique signifie « six mille huit cents ». Les chiffres et l’espace typographique française facilitent la lecture de cette liste militaire.
- source_word: חֲלוּצֵי צָבָא
  choice: hommes équipés pour le combat
  rationale: Dans ce contexte militaire, l’expression désigne des hommes équipés ou préparés pour combattre. L’ajout explicite de « hommes » produit une phrase française complète sans modifier le référent.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve la structure d’une liste de contingents tout en évitant une syntaxe artificielle. Aucun marqueur de note n’est nécessaire, car la nuance de צִנָּה est rendue dans le texte et חֲלוּצֵי צָבָא reçoit une traduction claire sans éliminer une ambiguïté théologique.
