- source_word: עֲזַרְאֵל
  choice: Azarel
  rationale: Nom propre transcrit directement; cette graphie est naturelle et lisible en français.
- source_word: יוֹעֶזֶר
  choice: Yoézer
  rationale: Transcription de la forme hébraïque qui préserve le yod initial et distingue les éléments vocaliques du nom.
- source_word: יָשָׁבְעָם
  choice: Yashobéam
  rationale: Transcription de la forme propre à ce verset, sans lui substituer une autre forme nominale attestée ailleurs.
- source_word: הַקָּרְחִים
  choice: les Coréites
  rationale: Le pluriel gentilique avec article désigne les membres du clan de Coré; «les Coréites» est une formulation française concise et traditionnelle.
