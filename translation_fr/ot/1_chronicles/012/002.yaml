base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/002.yaml
  text: They were archers[a], able to use both the right hand and the left in hurling stones and shooting arrows with the bow; they were from Saul’s brothers, from Benjamin.
translation:
  language: fr
  text: Ils étaient armés d’arcs et savaient se servir aussi bien de la main droite que de la gauche pour lancer des pierres et tirer des flèches à l’arc. Ils faisaient partie de la parenté[a] de Saül et étaient de la tribu de Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « des frères de Saül ». Le mot hébreu peut désigner des frères au sens strict, mais aussi des proches parents ou des membres de la même famille élargie ou tribu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשְׁקֵי קֶשֶׁת
  choice: armés d’arcs
  rationale: Cette expression désigne ceux qui sont équipés d’un arc et savent le manier. « Armés d’arcs » reste proche de la formulation hébraïque tout en étant naturel en français.
- source_word: מַיְמִינִים וּמַשְׂמִאלִים
  choice: savaient se servir aussi bien de la main droite que de la gauche
  rationale: Les participes expriment ici l’aptitude à employer l’une ou l’autre main, et non une simple préférence naturelle pour une main.
- source_word: בָּאֲבָנִים
  choice: pour lancer des pierres
  rationale: Le contexte militaire implique la projection de pierres. Cette traduction exprime l’action sans ajouter explicitement une fronde, qui n’est pas nommée dans le texte.
- source_word: וּבַחִצִּים בַּקָּשֶׁת
  choice: et tirer des flèches à l’arc
  rationale: Cette formulation française rend clairement l’emploi des flèches au moyen de l’arc et forme un parallèle naturel avec le lancer de pierres.
- source_word: מֵאֲחֵי שָׁאוּל
  choice: des frères de Saül
  rationale: « Frères » traduit directement אחים et préserve son éventail sémantique; une note indique qu’il peut s’agir de parents ou de membres du même groupe familial plutôt que de frères au sens strict.
- source_word: מִבִּנְיָמִן
  choice: de la tribu de Benjamin
  rationale: L’ajout explicatif « de la tribu » rend immédiatement compréhensible en français que Benjamin désigne ici l’appartenance tribale.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase a été divisée en deux pour éviter une construction lourde. Le marqueur de note est placé après « frères », le terme auquel la variante lexicale se rapporte.
