  text: וּ/מֵ/אָשֵׁ֗ר יוֹצְאֵ֥י צָבָ֛א לַ/עֲרֹ֥ךְ מִלְחָמָ֖ה אַרְבָּעִ֥ים אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/037.yaml
  text: And from Asher[a], forty thousand who went out for military service, to array themselves for battle.
translation:
  language: fr
  text: Et d’Aser, 40 000 hommes qui partaient pour le service militaire afin de se ranger en ordre de bataille.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « 40 000 hommes sortant pour le service militaire afin de se ranger en ordre de bataille ». L’expression hébraïque peut désigner les hommes affectés ou disponibles pour le service militaire ; le verbe suivant évoque leur mise en formation pour le combat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאָשֵׁר
  choice: Et d’Aser
  rationale: Le waw et la préposition מן sont rendus naturellement par « Et d’ ». Aser est le nom de la tribu, sans qu’il soit nécessaire d’ajouter « tribu ».
- source_word: יוֹצְאֵי צָבָא
  choice: hommes aptes au service militaire
  rationale: L’expression désigne ceux qui partent ou sont mobilisables pour le service armé. Cette formulation française convient au contexte de dénombrement militaire sans suggérer qu’ils étaient déjà partis à cet instant.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: à se ranger en ordre de bataille
  rationale: Dans un contexte militaire, ערך exprime la mise en ordre ou en formation. La tournure pronominale française restitue naturellement l’idée de troupes qui prennent position pour combattre.
- source_word: אַרְבָּעִים אָלֶף
  choice: 40 000
  rationale: Rendu direct du nombre cardinal, selon l’usage typographique français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Service militaire » garde le sens organisé de צבא, tandis que « se ranger en ordre de bataille » conserve l’image militaire de ערך sans lourdeur littérale.
