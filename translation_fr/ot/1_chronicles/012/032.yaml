base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/032.yaml
  text: And from the half-tribe of Manasseh[a], eighteen thousand, who were designated by name, came to make David king.
translation:
  language: fr
  text: De la demi-tribu de Manassé, dix-huit mille qui furent désignés nommément pour venir faire de David le roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « désignés par noms » ; c’est-à-dire individuellement désignés ou expressément inscrits.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵחֲצִי מַטֵּה מְנַשֶּׁה
  choice: De la demi-tribu de Manassé
  rationale: Dans ce contexte tribal et militaire, מַטֶּה désigne une tribu. « Demi-tribu » est l’expression française consacrée et naturelle. La conjonction initiale relie ce membre à la liste précédente, mais n’a pas besoin d’être rendue par « et » dans cette phrase française autonome.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: dix-huit mille hommes
  rationale: Le nombre est rendu directement. « Hommes » est explicité d’après le contexte de la liste des contingents, afin d’éviter que le nombre reste artificiellement sans référent en français.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: désignés nommément
  rationale: Le nifal de נקב exprime ici une désignation explicite, et בְּשֵׁמוֹת indique qu’elle s’est faite par nom. « Désignés nommément » conserve le passif et reste idiomatique.
- source_word: לָבוֹא לְהַמְלִיךְ אֶת דָּוִיד
  choice: vinrent établir David comme roi
  rationale: Les infinitifs hébreux expriment la venue et son but. Dans cette énumération, une forme verbale finie donne une phrase française naturelle. Le hifil de מלך signifie faire devenir roi ou installer comme roi ; « établir David comme roi » évite de limiter l’action à une cérémonie de couronnement.
theological_decisions:
- issue: Portée de לְהַמְלִיךְ
  choice: établir David comme roi
  alternative: couronner David
  rationale: Le verbe causatif indique que David est fait ou reconnu roi, sans préciser nécessairement un rite matériel de couronnement.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère d’une liste de contingents tout en donnant une phrase complète et naturelle. Le marqueur de note est placé après l’expression qu’il explique.
