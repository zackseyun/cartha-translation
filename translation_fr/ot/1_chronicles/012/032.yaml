review_pass:
  verdict: revise
  source_fidelity: La mention ajoutée « hommes » n’est pas exprimée dans ce verset, même si le contexte militaire la rend plausible. Surtout, la formulation révisée rend explicitement que la désignation nominative avait pour objet leur venue afin de faire David roi. « Faire de David le roi » traduit directement le hifil de מלך sans imposer un rite de couronnement.
  naturalness: La phrase révisée est naturelle en français international moderne et conserve le rythme d’une liste de contingents. La relative évite l’ambiguïté selon laquelle seuls les « désignés nommément » seraient une simple apposition sans lien avec le but de leur venue.
  terminology: « Demi-tribu de Manassé » est exact et usuel. « Nommément » rend bien בְּשֵׁמוֹת. La note est ajustée pour ne pas présenter « leurs noms » comme une traduction littérale obligatoire et pour conserver la nuance d’inscription ou de désignation individuelle.
