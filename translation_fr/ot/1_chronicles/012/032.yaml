    issue: Ajout de « hommes »
    rationale: Le texte hébreu donne seulement « dix-huit mille »; l’ajout est contextuellement compréhensible, mais il n’est pas nécessaire et dépasse légèrement l’expression du verset.
  - severity: low
    issue: Lien du complément de but insuffisamment explicite
    rationale: Dans l’hébreu, ceux qui étaient désignés par nom l’étaient « pour venir faire David roi ». Une relative avec « pour venir » rend ce lien syntaxique plus nettement.
  - severity: low
    issue: Note présentée comme littérale de façon imprécise
    rationale: « Par leurs noms » est une explicitation française possible, mais le texte porte littéralement « par noms »; la note peut expliquer l’idiome sans surtraduire le possessif.
