  rationale: La révision retire l’ajout non exprimé « hommes », explicite la portée du but introduit par les infinitifs hébreux et emploie « faire de David le roi », équivalent direct et idiomatique de « make David king ». La note conserve l’alternative lexicale sans attribuer au texte un possessif absent.
