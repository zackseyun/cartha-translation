revisions:
- from: 'De même, ceux qui étaient près d’eux, jusqu’à Issacar, Zabulon et Nephtali[a], apportaient des vivres[b] sur des ânes, des chameaux, des mulets et des bovins : de la farine, des gâteaux de figues, des gâteaux de raisins secs[c], du vin, de l’huile, ainsi que des bovins et des moutons en abondance, car il y avait de la joie en Israël.'
  to: 'De plus, ceux qui étaient près d’eux, jusqu’à Issacar, Zabulon et Nephtali[a], apportaient des vivres[b], à dos d’ânes, de chameaux, de mulets et de bovins : des denrées, de la farine, des gâteaux de figues, des raisins secs[c], du vin, de l’huile, ainsi que des bovins et des moutons en abondance, car il y avait de la joie en Israël.'
  rationale: La révision traduit explicitement מַאֲכָל par « des denrées », maintient la distinction avec לֶחֶם rendu par « vivres », et choisit « raisins secs » pour ne pas surinterpréter צִמּוּקִים. La formulation « à dos de » rend le transport par les animaux de façon idiomatique tout en conservant la mention, inhabituelle mais explicite, des bovins. Les ancres de notes correspondent aux termes ou à la construction concernés.
