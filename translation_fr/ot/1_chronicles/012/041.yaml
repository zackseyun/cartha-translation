source:
  edition: WLC
  text: וְ/גַ֣ם הַ/קְּרֽוֹבִים אֲ֠לֵי/הֶם עַד יִשָׂשכָ֨ר וּ/זְבֻל֜וּן וְ/נַפְתָּלִ֗י מְבִיאִ֣ים לֶ֡חֶם בַּ/חֲמוֹרִ֣ים וּ/בַ/גְּמַלִּ֣ים וּ/בַ/פְּרָדִ֣ים וּֽ/בַ/בָּקָ֡ר מַאֲכָ֡ל קֶ֠מַח דְּבֵלִ֨ים וְ/צִמּוּקִ֧ים וְ/יַֽיִן וְ/שֶׁ֛מֶן וּ/בָקָ֥ר וְ/צֹ֖אן לָ/רֹ֑ב כִּ֥י שִׂמְחָ֖ה בְּ/יִשְׂרָאֵֽל־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/041.yaml
  text: 'Also those near them[a], as far as Issachar and Zebulun and Naphtali, were bringing food on donkeys, camels, mules, and cattle: provisions of flour, fig cakes, raisin cakes, wine, oil, cattle, and sheep in abundance[c][b], for there was joy in Israel.'
translation:
  language: fr
  text: 'De plus, ceux qui étaient près d’eux, jusqu’à Issacar, Zabulon et Nephtali[a], apportaient des vivres[b], à dos d’ânes, de chameaux, de mulets et de bovins : des denrées, de la farine, des gâteaux de figues, des raisins secs[c], du vin, de l’huile, ainsi que des bovins et des moutons en abondance, car il y avait de la joie en Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « même jusqu’à Issacar, Zabulon et Nephtali ». Cette expression indique l’étendue géographique de ceux qui apportaient les provisions.
    reason: alternative_reading
  - marker: b
    text: L’hébreu signifie littéralement « pain », mais le mot introduit ici une liste plus large de denrées.
    reason: lexical_alternative
  - marker: c
    text: Ou « raisins séchés ». Le terme peut peut-être désigner des raisins secs préparés ou pressés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: De même
  rationale: Rend la continuité et la valeur additive de l’expression hébraïque dans un français naturel.
- source_word: הַקְּרֹבִים אֲלֵיהֶם
  choice: ceux qui étaient près d’eux
  rationale: Préserve le sens relationnel et géographique sans préciser indûment qu’il s’agissait uniquement de voisins établis.
- source_word: עַד יִשָּׂשכָר וּזְבֻלוּן וְנַפְתָּלִי
  choice: jusqu’à Issacar, Zabulon et Nephtali
  rationale: La préposition עַד marque ici l’étendue géographique.
- source_word: מְבִיאִים
  choice: apportaient
  rationale: Le participe exprime une action en cours ou répétée dans le récit; l’imparfait français convient à cet aspect.
- source_word: לֶחֶם
  choice: des vivres
  rationale: Bien que le nom signifie littéralement « pain », il désigne ici l’ensemble des denrées détaillées ensuite.
- source_word: בַּחֲמוֹרִים וּבַגְּמַלִּים וּבַפְּרָדִים וּבַבָּקָר
  choice: sur des ânes, des chameaux, des mulets et des bovins
  rationale: La préposition ב indique le moyen de transport. Le texte mentionne des animaux, non des chariots; « sur » conserve cette image malgré le caractère inhabituel du transport sur des bovins.
- source_word: מַאֲכָל
  choice: '[ponctuation introductive : deux-points]'
  rationale: Le nom introduit une liste de denrées et ferait double emploi avec « vivres » en français; les deux-points rendent naturellement sa fonction explicative.
- source_word: קֶמַח
  choice: farine
  rationale: Équivalent courant du produit de grain finement moulu.
- source_word: דְּבֵלִים
  choice: gâteaux de figues
  rationale: Désigne des masses de figues pressées, préparées pour la conservation et le transport.
- source_word: צִמּוּקִים
  choice: gâteaux de raisins secs
  rationale: Rend le sens probable de raisins séchés réunis en masses pressées dans cette liste de provisions, tout en signalant l’alternative en note.
- source_word: יַיִן
  choice: vin
  rationale: Équivalent français usuel.
- source_word: שֶׁמֶן
  choice: huile
  rationale: Le texte dit simplement « huile »; « huile d’olive » serait plausible dans le contexte, mais plus précis que l’hébreu.
- source_word: בָקָר וְצֹאן לָרֹב
  choice: des bovins et des moutons en abondance
  rationale: Distingue le gros bétail du petit bétail et conserve l’idée de grande quantité.
- source_word: כִּי שִׂמְחָה בְּיִשְׂרָאֵל
  choice: car il y avait de la joie en Israël
  rationale: Suit sobrement la proposition nominale hébraïque sans ajouter la cause précise de la joie.
