  text: וְ/ר֣וּחַ לָבְשָׁ֗ה אֶת עֲמָשַׂי֮ רֹ֣אשׁ ה/שלושים לְ/ךָ֤ דָוִיד֙ וְ/עִמְּ/ךָ֣ בֶן יִשַׁ֔י שָׁל֨וֹם שָׁל֜וֹם לְ/ךָ֗ וְ/שָׁלוֹם֙ לְ/עֹ֣זְרֶ֔/ךָ כִּ֥י עֲזָרְ/ךָ֖ אֱלֹהֶ֑י/ךָ וַ/יְקַבְּלֵ֣/ם דָּוִ֔יד וַֽ/יִּתְּנֵ֖/ם בְּ/רָאשֵׁ֥י הַ/גְּדֽוּד־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/019.yaml
  text: And the Spirit clothed Amasai, chief of the Thirty, and he said, “Yours are we, David, and with you, son of Jesse! Peace, peace to you, and peace to your helpers, for your God helps you.” Then David received them and made them chiefs of the troops.
translation:
  language: fr
  text: 'Alors l’Esprit revêtit Amasaï[a], chef des Trente, qui déclara :

    « Nous sommes à toi, David,

    et avec toi, fils de Jessé !

    Paix, paix à toi,

    et paix à ceux qui t’aident[b],

    car ton Dieu t’aide[c]. »

    David les accueillit et les établit chefs de la troupe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un esprit revêtit Amasaï » ou « l’Esprit s’empara d’Amasaï ». L’hébreu dit littéralement : « un esprit revêtit Amasaï ».'
    reason: alternative_reading
  - marker: b
    text: Ou « à celui qui t’aide » ; le singulier hébreu peut être compris dans un sens collectif.
    reason: lexical_alternative
  - marker: c
    text: Ou « car ton Dieu t’a aidé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ לָבְשָׁה
  choice: Alors l’Esprit revêtit
  rationale: Conserve la métaphore hébraïque de l’habillement et son probable agent divin. « Alors » rend naturellement la progression narrative du waw sans alourdir la phrase.
- source_word: אֶת עֲמָשַׂי
  choice: Amasaï
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: רֹאשׁ הַשְּׁלֹשִׁים
  choice: chef des Trente
  rationale: רֹאשׁ désigne ici un chef; la majuscule à « Trente » indique un corps militaire reconnu plutôt qu’un simple nombre.
- source_word: לְךָ דָוִיד וְעִמְּךָ בֶן יִשַׁי
  choice: Nous sommes à toi, David, et avec toi, fils de Jessé
  rationale: Explicite sobrement l’ellipse hébraïque tout en conservant le parallélisme et la formule d’allégeance.
- source_word: שָׁלוֹם שָׁלוֹם לְךָ
  choice: Paix, paix à toi
  rationale: Maintient la répétition emphatique de שָׁלוֹם au lieu de la réduire à une seule formule.
- source_word: וְשָׁלוֹם לְעֹזְרֶךָ
  choice: et paix à ceux qui t’aident
  rationale: Le participe singulier peut avoir une valeur collective; cette formulation convient au groupe reçu ensuite par David.
- source_word: כִּי עֲזָרְךָ אֱלֹהֶיךָ
  choice: car ton Dieu t’aide
  rationale: Le parfait hébreu peut exprimer ici le soutien avéré et continu de Dieu; le présent français en rend naturellement la portée.
- source_word: וַיְקַבְּלֵם
  choice: David les accueillit
  rationale: « Accueillir » exprime naturellement dans ce contexte la réception favorable du groupe, sans supposer une cérémonie formelle.
- source_word: וַיִּתְּנֵם בְּרָאשֵׁי הַגְּדוּד
  choice: les établit chefs de la troupe
  rationale: Rend l’idiome d’une nomination à une fonction de commandement tout en conservant le singulier collectif de הַגְּדוּד.
theological_decisions:
- issue: רוּחַ désigne-t-il l’Esprit divin ou simplement un esprit / une impulsion spirituelle ?
  choice: l’Esprit
  alternative: un esprit ; l’esprit
  rationale: Dans les Chroniques, l’habilitation de responsables par l’Esprit est un motif récurrent, et l’expression selon laquelle l’esprit « revêt » Amasaï suggère fortement l’action divine. La note conserve néanmoins l’indétermination formelle du nom hébreu sans article.
- issue: Valeur temporelle de עֲזָרְךָ
  choice: ton Dieu t’aide
  alternative: ton Dieu t’a aidé
  rationale: Le contexte permet aussi bien de souligner l’aide déjà manifestée que le soutien continu de Dieu. Le présent est retenu dans le texte, tandis que la note signale le parfait possible.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition poétique met en valeur le parallélisme et la répétition de la déclaration d’Amasaï. La métaphore inhabituelle « l’Esprit revêtit » est volontairement conservée afin de ne pas aplanir l’image hébraïque.
