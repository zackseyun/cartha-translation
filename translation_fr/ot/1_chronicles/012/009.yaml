  verdict: revise
  source_fidelity: La traduction restitue correctement l’origine gadite, le ralliement à David, le cadre de la forteresse dans le désert, les qualifications militaires et les deux comparaisons. Toutefois, « des leurs » n’est pas exprimé par l’hébreu et l’image des visages doit conserver plus clairement la comparaison.
  naturalness: Le français est moderne et fluide. « À la forteresse dans le désert » est plus naturel et plus directement fidèle que « dans la forteresse du désert » tout en laissant la note signaler l’ambiguïté directionnelle.
  terminology: « Gadites », « vaillants guerriers », « grand bouclier » et « lance » conviennent. « Sachant manier » est une explicitation acceptable de la préparation militaire exprimée par le participe, avec une note littérale adéquate.
