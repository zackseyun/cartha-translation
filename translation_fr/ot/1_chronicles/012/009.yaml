  text: וּ/מִן הַ/גָּדִ֡י נִבְדְּל֣וּ אֶל דָּוִיד֩ לַ/מְצַ֨ד מִדְבָּ֜רָ/ה גִּבֹּרֵ֣י הַ/חַ֗יִל אַנְשֵׁ֤י צָבָא֙ לַ/מִּלְחָמָ֔ה עֹרְכֵ֥י צִנָּ֖ה וָ/רֹ֑מַח וּ/פְנֵ֤י אַרְיֵה֙ פְּנֵי/הֶ֔ם וְ/כִ/צְבָאיִ֥ם עַל הֶ/הָרִ֖ים לְ/מַהֵֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/009.yaml
  text: Some of the Gadites separated themselves to David at the stronghold in the wilderness[a], mighty warriors, men of the army for battle, able to handle shield and spear, whose faces were like the faces of lions[c][b], and who were as swift as gazelles on the mountains.
translation:
  language: fr
  text: Des Gadites se séparèrent pour rejoindre David à la forteresse dans le désert[a]. C’étaient de vaillants guerriers, des hommes de guerre prêts au combat, sachant manier le grand bouclier et la lance[b]. Leurs visages étaient comme ceux de lions et, sur les montagnes, ils étaient aussi rapides que des gazelles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers David, à la forteresse dans le désert ». La suite des prépositions en hébreu peut indiquer soit le lieu où ils rejoignirent David, soit la direction de leur déplacement.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « disposant le grand bouclier et la lance », expression qui décrit des hommes préparés et habiles au combat.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « comme des gazelles sur les montagnes, pour se hâter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַגָּדִי
  choice: Des Gadites
  rationale: Le gentilé précédé de מִן désigne des hommes issus de la tribu de Gad, sans viser nécessairement toute la tribu.
- source_word: נִבְדְּלוּ
  choice: se séparèrent des leurs
  rationale: Le niphal de בדל exprime une séparation. « Des leurs » rend naturellement en français le groupe d’origine implicite, sans préciser leur motivation.
- source_word: אֶל דָּוִיד
  choice: pour se rallier à David
  rationale: אֶל marque le mouvement vers David. Dans ce contexte militaire, le ralliement est clairement impliqué; cette formulation évite le français peu naturel « se séparèrent vers David ».
- source_word: לַמְצַד מִדְבָּרָה
  choice: dans la forteresse du désert
  rationale: מְצַד désigne une place forte ou forteresse. Le texte permet cependant de comprendre la préposition comme indiquant une destination; cette ambiguïté est signalée en note.
- source_word: גִּבֹּרֵי הַחַיִל
  choice: de vaillants guerriers
  rationale: L’expression désigne des combattants forts et éprouvés. Cette traduction actuelle conserve à la fois la valeur et le caractère militaire.
- source_word: אַנְשֵׁי צָבָא לַמִּלְחָמָה
  choice: des hommes de guerre prêts au combat
  rationale: La formulation rend leur identité militaire et leur aptitude au combat sans introduire l’idée plus précise d’un entraînement formel.
- source_word: עֹרְכֵי צִנָּה וָרֹמַח
  choice: sachant manier le grand bouclier et la lance
  rationale: ערך évoque ici la mise en ordre ou la préparation des armes pour le combat. « Sachant manier » exprime leur compétence militaire; צִנָּה est le grand bouclier couvrant le corps.
- source_word: וּפְנֵי אַרְיֵה פְּנֵיהֶם
  choice: Ils avaient des visages de lions
  rationale: La métaphore hébraïque est conservée directement, sans la réduire à une seule qualité telle que le courage ou la férocité.
- source_word: וְכִצְבָאִים עַל הֶהָרִים לְמַהֵר
  choice: sur les montagnes, ils étaient aussi rapides que des gazelles
  rationale: לְמַהֵר explicite la rapidité qui fonde la comparaison avec les gazelles; l’ordre français met également en relief le terrain montagneux.
