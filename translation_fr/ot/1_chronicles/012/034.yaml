source:
  edition: WLC
  text: מִ/זְּבֻל֞וּן יוֹצְאֵ֣י צָבָ֗א עֹרְכֵ֧י מִלְחָמָ֛ה בְּ/כָל כְּלֵ֥י מִלְחָמָ֖ה חֲמִשִּׁ֣ים אָ֑לֶף וְ/לַ/עֲדֹ֖ר בְּ/לֹא לֵ֥ב וָ/לֵֽב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/034.yaml
  text: From Zebulun[a], fifty thousand men fit for military service, prepared for battle with every kind of weapon of war[b], to help without a divided heart.
translation:
  language: fr
  text: De Zabulon, 50 000 hommes aptes au service militaire, prêts au combat avec toutes les armes de guerre, pour prêter main-forte[a], sans avoir le cœur partagé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour rejoindre les rangs » ou « pour apporter leur soutien ». Le verbe hébreu est rare ici; il exprime probablement l’idée de se joindre aux autres dans un soutien uni.
    reason: alternative_reading
  - marker: b
    text: Littéralement « sans cœur et cœur », expression hébraïque désignant une loyauté qui n’est ni divisée ni double.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְּבֻלוּן
  choice: De Zabulon
  rationale: La préposition מִן indique ici l’origine du contingent. « De Zabulon » convient naturellement à cette liste tribale.
- source_word: יוֹצְאֵי צָבָא
  choice: hommes aptes au service militaire
  rationale: L’expression désigne ceux qui sont en mesure de partir avec l’armée, donc les hommes disponibles et qualifiés pour le service militaire.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: prêts au combat
  rationale: Le participe évoque la mise en ordre ou en formation pour la bataille. Cette formulation restitue clairement leur état de préparation sans imposer une image tactique trop précise.
- source_word: בְּכָל כְּלֵי מִלְחָמָה
  choice: avec toutes sortes d’armes de guerre
  rationale: כְּלֵי מִלְחָמָה désigne l’équipement ou les armes militaires. « Toutes sortes de » rend naturellement la portée de בְּכָל en français.
- source_word: חֲמִשִּׁים אָלֶף
  choice: 50 000
  rationale: Rendu numérique direct, clair et adapté à une liste de contingents.
- source_word: וְלַעֲדֹר
  choice: venus prêter main-forte
  rationale: Le verbe, rare et difficile dans ce contexte, semble exprimer l’idée de se joindre aux autres pour soutenir la cause de David. « Prêter main-forte » en donne le sens fonctionnel tout en signalant l’élan collectif.
- source_word: בְּלֹא לֵב וָלֵב
  choice: sans avoir le cœur partagé
  rationale: Littéralement « sans cœur et cœur », cet idiome nie une loyauté divisée ou une disposition double. La traduction conserve l’image hébraïque du cœur tout en restant intelligible.
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. Le verset conserve la forme elliptique d’un élément de liste. « Prêter main-forte » reste courant sans être familier, tandis que « le cœur partagé » préserve l’image et la tension de l’idiome hébreu.
