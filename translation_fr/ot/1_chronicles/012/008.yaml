  yaml_path: translation/ot/1_chronicles/012/008.yaml
  text: and Joelah and Zebadiah[a], the sons of Jeroham from Gedor.
translation:
  language: fr
  text: Yoéla et Zebadia, fils de Yeroham, originaires de Guedor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיוֹעֵאלָה
  choice: Yoéla
  rationale: Le nom propre est transcrit sous une forme française lisible; la conjonction initiale s’intègre naturellement à l’énumération sans qu’il soit nécessaire de la rendre ici par « et ».
- source_word: וּזְבַדְיָה
  choice: et Zebadia
  rationale: La conjonction וּ est rendue par « et », et le nom propre est transcrit selon une forme française courante.
- source_word: בְּנֵי
  choice: fils de
  rationale: Le pluriel construit de בֵּן désigne ici le lien filial direct le plus naturel; « descendants de » serait possible dans certains contextes généalogiques, mais n’est pas requis ici.
- source_word: יְרֹחָם
  choice: Yeroam
  rationale: Le nom propre est transcrit en français de manière à représenter la consonne initiale hébraïque et à rester aisément prononçable.
- source_word: מִן הַגְּדוֹר
  choice: originaires de Guedor
  rationale: La préposition מִן indique la provenance. « Originaires de » exprime clairement que Guedor est le lieu d’origine des deux hommes, tandis que l’article hébreu n’a pas à être rendu devant le nom de lieu en français.
theological_decisions: []
translation_notes:
  register: Style bref et digne, adapté à la fin d’une liste de noms. Les noms propres suivent une translittération française moderne et cohérente. « Originaires de » évite que « de Guedor » soit compris comme un second lien de filiation.
