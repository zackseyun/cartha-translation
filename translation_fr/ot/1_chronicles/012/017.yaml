  text: וַ/יָּבֹ֗אוּ מִן בְּנֵ֤י בִנְיָמִן֙ וִֽ/יהוּדָ֔ה עַד לַ/מְצָ֖ד לְ/דָוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/017.yaml
  text: And some of the sons of Benjamin and Judah came to the stronghold[b][a], to David.
translation:
  language: fr
  text: Des hommes de Benjamin et de Juda vinrent rejoindre David à la place forte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « forteresse » ou « refuge fortifié ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vinrent
  rationale: Le wayyiqtol de בוא fait progresser le récit et décrit ici un mouvement vers David.
- source_word: מִן בְּנֵי בִנְיָמִן וִיהוּדָה
  choice: Des hommes de Benjamin et de Juda
  rationale: 'La préposition מִן a une valeur partitive : il s’agit de membres issus de ces tribus, non de leur totalité. Cette formulation rend ce sens naturellement en français.'
- source_word: עַד לַמְצָד
  choice: dans la forteresse
  rationale: עַד marque la destination du mouvement, tandis que מְצָד désigne un refuge fortifié. En français, « vinrent ... dans la forteresse » exprime naturellement l’arrivée au lieu visé.
- source_word: לְדָוִיד
  choice: auprès de David
  rationale: 'La préposition לְ rattache David à la destination : ces hommes viennent le rejoindre là où il se trouve. « Auprès de David » évite la répétition maladroite de deux compléments introduits par « à ».'
theological_decisions: []
