- source_word: עֹבַדְיָה
  choice: Abdias
  rationale: Forme française traditionnelle et largement reconnue du nom propre biblique.
- source_word: הַשֵּׁנִי
  choice: le deuxième
  rationale: L’adjectif ordinal défini indique directement la deuxième place dans la liste.
- source_word: אֱלִיאָב
  choice: Éliab
  rationale: Transcription française courante du nom propre.
- source_word: הַשְּׁלִשִׁי
  choice: le troisième
  rationale: L’adjectif ordinal défini indique directement la troisième place dans la liste.
