base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/023.yaml
  text: For day by day they came to David to help him[a], until there was a great camp, like the camp of God.
translation:
  language: fr
  text: Car, jour après jour, ils venaient auprès de David pour l’aider, jusqu’à former un grand camp, comme le camp de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un camp divin » ou « comme un camp céleste ». L’expression hébraïque reste concise et évocatrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit une explication liée au contexte narratif précédent, sans renforcer indûment la relation logique.
- source_word: לְעֶת יוֹם בְּיוֹם
  choice: jour après jour
  rationale: Rend naturellement l’idée d’une action répétée et continue au fil des jours.
- source_word: יָבֹאוּ
  choice: venaient
  rationale: L’imparfait français exprime bien l’action passée répétée signalée par « jour après jour ».
- source_word: עַל דָּוִיד
  choice: auprès de David
  rationale: Dans ce contexte de venue en vue d’aider David, la préposition indique le mouvement vers lui plutôt qu’une action hostile.
- source_word: לְעָזְרוֹ
  choice: pour l’aider
  rationale: Rend directement la valeur de but de l’infinitif avec suffixe pronominal.
- source_word: עַד לְמַחֲנֶה גָדוֹל
  choice: jusqu’à former un grand camp
  rationale: Explicite sobrement le résultat atteint par l’arrivée continuelle des gens, tout en conservant l’image du camp.
- source_word: כְּמַחֲנֵה אֱלֹהִים
  choice: comme le camp de Dieu
  rationale: Conserve la comparaison et le génitif hébreu sans réduire son caractère évocateur à la seule idée de grandeur.
theological_decisions:
- issue: Sens de אֱלֹהִים dans כְּמַחֲנֵה אֱלֹהִים
  choice: Dieu
  alternative: divin / céleste
  rationale: « Le camp de Dieu » est la lecture la plus directe et préserve la résonance théologique ainsi que l’ambiguïté évocatrice de l’expression hébraïque.
translation_notes:
  register: Français international moderne, fluide et digne. « Des gens » évite d’introduire exclusivement « des hommes » là où le verbe hébreu ne fournit pas de sujet nominal explicite; le contexte détermine le groupe visé.
