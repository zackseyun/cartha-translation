  text: הָ/רֹ֨אשׁ אֲחִיעֶ֜זֶר וְ/יוֹאָ֗שׁ בְּנֵי֙ הַ/שְּׁמָעָ֣ה הַ/גִּבְעָתִ֔י ו/יזואל וָ/פֶ֖לֶט בְּנֵ֣י עַזְמָ֑וֶת וּ/בְרָכָ֕ה וְ/יֵה֖וּא הָ/עֲנְּתֹתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/003.yaml
  text: The chief was Ahiezer[a], then Joash, the sons of Shemaah the Gibeathite; and Jeziel and Pelet, the sons of Azmaveth[b]; and Beracah and Jehu the Anathothite.
translation:
  language: fr
  text: Le chef était Ahiézer, puis Joas, fils de Haschemaa, de Guibéa ; Jeziel[a] et Pélet, fils d’Azmaveth ; Beraka[b] et Jéhu, d’Anathoth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Jeziel » peut aussi être transcrit « Iziel ».
    reason: lexical_alternative
  - marker: b
    text: Le nom « Beraka » peut aussi être transcrit « Berakha ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: Le chef était
  rationale: Dans cette liste, רֹאשׁ désigne le premier ou le responsable du groupe, non une « tête » au sens littéral. Le verbe « était », absent de la proposition nominale hébraïque, est ajouté pour obtenir un français naturel.
- source_word: אֲחִיעֶזֶר
  choice: Ahiézer
  rationale: Transcription française usuelle du nom propre.
- source_word: וְיוֹאָשׁ
  choice: puis Joas
  rationale: La conjonction signifie littéralement « et » ; « puis » rend naturellement la succession des noms après la désignation du chef.
- source_word: בְּנֵי הַשְּׁמָעָה
  choice: fils de Shemaa
  rationale: בְּנֵי exprime ici la filiation. La forme הַשְּׁמָעָה est traitée comme un nom propre et transcrite « Shemaa ».
- source_word: הַגִּבְעָתִי
  choice: le Guibéatite
  rationale: Ce gentilé indique une personne originaire de Guibéa ; la forme française concise conserve la structure de l’hébreu.
- source_word: ויזואל
  choice: Yeziel
  rationale: Transcription française du nom consonantique ; l’absence de vocalisation massorétique dans la forme transmise laisse place à une autre lecture, signalée en note.
- source_word: וָפֶלֶט
  choice: et Pélet
  rationale: Transcription directe du nom propre, sans développer son éventuel sens étymologique.
- source_word: בְּנֵי עַזְמָוֶת
  choice: fils d’Azmaveth
  rationale: Construction généalogique ordinaire, avec transcription française reconnaissable du nom.
- source_word: וּבְרָכָה
  choice: Beraka
  rationale: Transcription française qui rend le כ par k ; une graphie plus proche de certaines conventions savantes est indiquée en note.
- source_word: וְיֵהוּא
  choice: et Jéhu
  rationale: Forme française biblique usuelle du nom propre.
- source_word: הָעֲנְּתֹתִי
  choice: l’Anatotite
  rationale: Gentilé dérivé d’Anatoth, rendu sous une forme française concise et traditionnelle.
