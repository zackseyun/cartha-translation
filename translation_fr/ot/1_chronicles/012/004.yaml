  yaml_path: translation/ot/1_chronicles/012/004.yaml
  text: and Ishmaiah the Gibeonite[b][a], a mighty man among the Thirty and over the Thirty.
translation:
  language: fr
  text: et Yishmaïa, le Gabaonite, vaillant guerrier parmi les Trente[a] et au-dessus des Trente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Trente » ; la préposition hébraïque peut indiquer qu’il appartenait au groupe d’élite appelé « les Trente ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « au-dessus des Trente » ; l’expression indique probablement une fonction de commandement ou un rang supérieur par rapport aux Trente.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/יִֽשְׁמַֽעְיָה
  choice: et Yishmaeya
  rationale: La conjonction וְ poursuit l’énumération. Le nom propre est translittéré sous une forme lisible en français tout en reflétant l’hébreu.
- source_word: הַ/גִּבְעוֹנִי
  choice: le Gabaonite
  rationale: Le gentilé avec article désigne l’origine ou l’appartenance de Yishmaeya. « Gabaonite » est la forme française traditionnelle et immédiatement reconnaissable.
- source_word: גִּבּוֹר
  choice: vaillant guerrier
  rationale: Dans cette liste militaire, גִּבּוֹר désigne un homme reconnu pour sa force et sa bravoure au combat. « Vaillant guerrier » rend clairement cette valeur sans réduire le terme à la seule force physique.
- source_word: בַּ/שְּׁלֹשִׁים
  choice: parmi les Trente
  rationale: La préposition בְּ situe vraisemblablement Yishmaeya au sein du groupe d’élite appelé « les Trente », tout en permettant une autre nuance que la note conserve.
- source_word: וְ/עַל הַ/שְּׁלֹשִׁים
  choice: et à la tête des Trente
  rationale: Dans ce contexte, עַל exprime vraisemblablement une autorité ou un rang supérieur par rapport aux Trente. Cette tournure française naturelle garde la relation avec le groupe sans ajouter de titre absent de l’hébreu.
theological_decisions: []
translation_notes:
  register: Style bref et digne adapté à une liste militaire. « Vaillant guerrier » est courant et clair en français international ; la majuscule à « Trente » signale qu’il s’agit du nom d’un groupe déterminé. Les deux propositions potentiellement tendues — membre des Trente et placé à leur tête — sont maintenues sans harmonisation.
