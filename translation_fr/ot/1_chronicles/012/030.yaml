  text: וּ/מִן בְּנֵ֧י בִנְיָמִ֛ן אֲחֵ֥י שָׁא֖וּל שְׁלֹ֣שֶׁת אֲלָפִ֑ים וְ/עַד הֵ֨נָּה֙ מַרְבִּיתָ֔/ם שֹׁמְרִ֕ים מִשְׁמֶ֖רֶת בֵּ֥ית שָׁאֽוּל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/030.yaml
  text: And from the sons of Benjamin[a], Saul’s brothers, three thousand[b]; until then most of them had been keeping watch over the house of Saul.
translation:
  language: fr
  text: 'Et parmi les fils de Benjamin, les frères[a] de Saül : 3 000. Jusqu’alors, la plupart d’entre eux gardaient la maison de Saül[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « frères » peut aussi désigner ici les proches ou les membres du même groupe familial ou tribal que Saül.
    reason: lexical_alternative
  - marker: b
    text: La « maison de Saül » peut désigner sa maisonnée, sa lignée royale ou, plus largement, les intérêts qui lui étaient liés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי בִנְיָמִן
  choice: Parmi les fils de Benjamin
  rationale: La formulation conserve l’image généalogique et tribale de l’hébreu tout en s’intégrant naturellement à la liste numérique du contexte. La conjonction וּ poursuit cette liste, sans qu’un « et » initial soit nécessaire en français.
- source_word: אֲחֵי שָׁאוּל
  choice: les frères de Saül
  rationale: « Frères » rend formellement אֲחֵי et maintient l’expression de parenté du texte. Puisque le mot peut désigner ici des membres du même groupe familial ou tribal plutôt que les seuls frères biologiques, une note conserve cette extension possible.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: 3 000 hommes
  rationale: Le nombre est rendu directement. « Hommes » est explicité d’après le contexte militaire de la liste, sans modifier le décompte.
- source_word: וְעַד הֵנָּה
  choice: Jusqu’alors
  rationale: Dans ce récit historique, l’expression renvoie à la période qui précédait le ralliement décrit, et non au présent du lecteur.
- source_word: מַרְבִּיתָם
  choice: la plupart d’entre eux
  rationale: Cette formulation française courante exprime clairement la majorité indiquée par le nom hébreu.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: continuaient à veiller sur
  rationale: Le participe décrit une attitude ou fonction durable jusqu’au moment évoqué. « Veiller sur » restitue l’idée de garde exprimée par les deux mots apparentés sans produire une répétition pesante en français.
- source_word: בֵּית שָׁאוּל
  choice: la maison de Saül
  rationale: « Maison » préserve l’étendue sémantique de בֵּית, qui peut désigner la maisonnée, la lignée ou les intérêts liés à la royauté de Saül, sans imposer une seule interprétation.
theological_decisions:
- issue: Portée de la fidélité des Benjaminites envers Saül
  choice: continuaient à veiller sur la maison de Saül
  alternative: étaient restés fidèles à la dynastie de Saül
  rationale: La traduction retenue conserve le vocabulaire de garde et l’ambiguïté de « maison ». L’alternative préciserait à la fois une fidélité politique et une dynastie, notions plausibles dans le contexte mais plus étroites que le texte hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La structure en deux phrases clarifie l’énumération. Les formulations « fils de Benjamin » et « maison de Saül » conservent les images généalogiques de l’hébreu, tandis que les notes préviennent une lecture excessivement étroite.
