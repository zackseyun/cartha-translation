base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/035.yaml
  text: 'From Naphtali: 1,000 commanders[b][a], and with them 37,000 with shield and spear.'
translation:
  language: fr
  text: 'De Nephtali : 1 000 commandants[a] et, avec eux, 37 000 hommes portant le bouclier[b] et la lance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chefs » ou « capitaines ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « bouclier » peut désigner plus précisément un grand bouclier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנַּפְתָּלִי
  choice: De Nephtali
  rationale: Dans cette énumération tribale, cette formulation française rend naturellement « et de/depuis Nephtali » sans alourdir la succession des groupes.
- source_word: שָׂרִים
  choice: commandants
  rationale: Le terme désigne des chefs ou responsables de haut rang ; dans ce contexte militaire, « commandants » exprime clairement leur fonction sans préciser indûment un grade.
- source_word: אָלֶף
  choice: 1 000
  rationale: La notation chiffrée convient à une liste d’effectifs et reste immédiatement lisible.
- source_word: וְעִמָּהֶם
  choice: et, avec eux
  rationale: Cette tournure conserve la coordination et indique que les 37 000 accompagnent les 1 000 commandants.
- source_word: בְּצִנָּה
  choice: portant le bouclier
  rationale: La préposition introduit ici l’équipement dont ces hommes sont munis. צִנָּה peut désigner plus précisément un grand bouclier, possibilité signalée en note.
- source_word: וַחֲנִית
  choice: et la lance
  rationale: « Lance » est l’équivalent français courant de חֲנִית et convient à cette liste d’armes.
- source_word: שְׁלֹשִׁים וְשִׁבְעָה אָלֶף
  choice: 37 000 hommes
  rationale: Le nombre est présenté en chiffres pour la lisibilité ; « hommes » explicite sobrement le nom sous-entendu par l’énumération militaire hébraïque.
