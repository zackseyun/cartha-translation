  source_fidelity: 'Le texte rend fidèlement l’introduction de liste, la venue auprès de David à Tsiklag, la contrainte persistante liée à Saül et l’appartenance à des guerriers valeureux. Toutefois, « lui prêtaient main-forte » introduit un bénéficiaire explicite (David) qui n’est pas exprimé dans l’hébreu : עֹזְרֵי הַמִּלְחָמָה les qualifie simplement comme auxiliaires dans la guerre / au combat.'
