  text: וְ/אֵ֗לֶּה הַ/בָּאִ֤ים אֶל דָּוִיד֙ לְ/צִ֣יקְלַ֔ג ע֣וֹד עָצ֔וּר מִ/פְּנֵ֖י שָׁא֣וּל בֶּן קִ֑ישׁ וְ/הֵ֨מָּה֙ בַּ/גִּבּוֹרִ֔ים עֹזְרֵ֖י הַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/001.yaml
  text: These are the men who came to David at Ziklag while he was still kept back because of Saul son of Kish[a]; and they were among the mighty warriors[b], helpers in war.
translation:
  language: fr
  text: Voici ceux qui vinrent auprès de David à Tsiklag, alors qu’il était encore tenu à l’écart à cause de Saül, fils de Qish[a] ; ils comptaient parmi les vaillants guerriers[b], auxiliaires au combat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retenu » ou « confiné » à cause de Saül, fils de Qish.
    reason: lexical_alternative
  - marker: b
    text: Ou « hommes valeureux » ; le mot hébreu désigne des hommes puissants ou vaillants, souvent dans un contexte guerrier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici ceux
  rationale: Introduit naturellement en français moderne la liste qui suit, tout en conservant la valeur présentative du démonstratif.
- source_word: הַבָּאִים אֶל דָּוִיד
  choice: qui vinrent auprès de David
  rationale: Le participe substantivé désigne le groupe venu rejoindre David ; le passé simple convient au registre narratif digne, et « auprès de » évite de faire de David une simple destination géographique.
- source_word: לְצִיקְלַג
  choice: à Tsiklag
  rationale: Dans ce contexte, la préposition désigne le lieu où David se trouvait lorsque ces hommes vinrent auprès de lui.
- source_word: עוֹד עָצוּר
  choice: alors qu’il était encore tenu à l’écart
  rationale: « Encore » rend la continuité exprimée par עוֹד. « Tenu à l’écart » conserve l’idée de contrainte sans préciser indûment qu’il aurait été emprisonné.
- source_word: מִפְּנֵי שָׁאוּל בֶּן קִישׁ
  choice: à cause de Saül, fils de Qish
  rationale: מִפְּנֵי exprime ici la cause de la situation de David. La translittération « Qish » distingue clairement la consonne hébraïque initiale.
- source_word: בַּגִּבּוֹרִים
  choice: parmi les vaillants guerriers
  rationale: גִּבּוֹרִים désigne ici des hommes reconnus pour leur valeur martiale ; « vaillants guerriers » est clair et naturel.
- source_word: עֹזְרֵי הַמִּלְחָמָה
  choice: qui lui prêtaient main-forte au combat
  rationale: Rend idiomatiquement leur fonction d’auxiliaires militaires. Le pronom « lui » explicite en français le bénéficiaire naturellement fourni par le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient à l’introduction historique d’une liste. Les notes maintiennent l’étendue sémantique des termes עָצוּר et גִּבּוֹרִים sans imposer une interprétation plus précise que l’hébreu.
