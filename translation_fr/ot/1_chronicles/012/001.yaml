revisions:
- from: Voici ceux qui vinrent auprès de David à Tsiklag, alors qu’il était encore tenu à l’écart à cause de Saül, fils de Qish[a] ; ils comptaient parmi les vaillants guerriers[b] qui lui prêtaient main-forte au combat.
