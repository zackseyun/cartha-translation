  text: וְ֠/אֵלֶּה מִסְפְּרֵ֞י רָאשֵׁ֤י הֶֽ/חָלוּץ֙ לַ/צָּבָ֔א בָּ֥אוּ עַל דָּוִ֖יד חֶבְר֑וֹנָ/ה לְ/הָסֵ֞ב מַלְכ֥וּת שָׁא֛וּל אֵלָ֖י/ו כְּ/פִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/024.yaml
  text: And these are the numbers of the heads of the armed troops for war[a], who came to David at Hebron to turn Saul’s kingdom over to him, according to the word of Yahweh.
translation:
  language: fr
  text: Voici les effectifs des hommes armés pour la guerre qui vinrent rejoindre David à Hébron afin de lui transférer la royauté de Saül, conformément à la parole de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon la bouche de Yahweh », expression qui signifie « conformément à la parole de Yahweh » ou « comme Yahweh l’avait déclaré ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפְּרֵי רָאשֵׁי
  choice: les effectifs
  rationale: Dans cette liste militaire, l’expression désigne le dénombrement des personnes. « Les effectifs » rend naturellement en français le pluriel מִסְפְּרֵי et l’idée de personnes comptées portée par רָאשֵׁי, sans donner à tort l’impression qu’il ne s’agit que de chefs.
- source_word: הֶחָלוּץ לַצָּבָא
  choice: des hommes armés pour la guerre
  rationale: הֶחָלוּץ désigne collectivement ceux qui sont équipés et prêts pour le service militaire; לַצָּבָא en précise la destination guerrière.
- source_word: בָּאוּ עַל דָּוִיד
  choice: vinrent rejoindre David
  rationale: Ici, la préposition עַל après בוא exprime un mouvement vers David dans le but de se rallier à lui, non une action hostile. « Rejoindre » rend clairement ce contexte d’adhésion.
- source_word: חֶבְרוֹנָה
  choice: à Hébron
  rationale: Le ה directionnel indique le mouvement vers Hébron; intégré à la phrase française, « rejoindre David à Hébron » est naturel et conserve le lieu d’arrivée.
- source_word: לְהָסֵב
  choice: afin de lui transférer
  rationale: Le hifil de סבב exprime ici le fait de faire passer l’autorité royale de Saül à David. « Transférer » rend ce changement de détenteur sans suggérer un simple déplacement matériel.
- source_word: מַלְכוּת שָׁאוּל
  choice: la royauté de Saül
  rationale: מַלְכוּת peut désigner le règne, le pouvoir royal ou la royauté. Dans ce contexte, c’est l’autorité royale de Saül qui passe à David; « royauté » est donc plus précis que le territoire évoqué par « royaume ».
- source_word: כְּפִי יְהוָה
  choice: conformément à la parole de Yahweh
  rationale: Littéralement « selon la bouche de Yahweh », cette expression idiomatique renvoie à ce que Yahweh a déclaré. La formulation retenue en transmet le sens tout en conservant le nom divin.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom propre divin au lieu de le remplacer par un titre.
- issue: Sens de מַלְכוּת dans le transfert de pouvoir
  choice: la royauté de Saül
  alternative: le royaume de Saül
  rationale: Le passage décrit l’établissement de David comme roi conformément à la parole divine. « Royauté » maintient l’accent sur l’autorité ou la dignité royale transférée, sans exclure les conséquences politiques de ce transfert.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Effectifs » convient au contexte d’un recensement militaire; « vinrent rejoindre » explicite naturellement le ralliement impliqué par le contexte. Le marqueur [a] est placé sur l’expression qu’il explique.
