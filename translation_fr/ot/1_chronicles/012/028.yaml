  text: and Jehoiada[a], the leader of Aaron, and with him three thousand seven hundred.
translation:
  language: fr
  text: et Yehoyada, le chef des Aaronites[a], et avec lui, trois mille sept cents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, littéralement : « chef pour Aaron » ou « chef d’Aaron ». La préposition hébraïque peut indiquer une relation d’affiliation ou de représentation.'
    reason: La relation exacte exprimée par לְאַהֲרֹן n’est pas précisée; la note préserve les principales possibilités sans les trancher.
lexical_decisions:
- source_word: וִ/יהוֹיָדָע
  choice: et Yehoyada
  rationale: La conjonction est conservée pour maintenir la continuité de l’énumération. Le nom propre est translittéré sous une forme française proche de l’hébreu.
- source_word: הַ/נָּגִיד
  choice: chef
  rationale: Le terme désigne un dirigeant ou responsable. « Chef » convient au contexte de recensement sans suggérer nécessairement un titre royal.
- source_word: לְ/אַהֲרֹן
  choice: des descendants d’Aaron
  rationale: 'La préposition exprime ici vraisemblablement l’appartenance ou la représentation : Yehoyada dirige le groupe sacerdotal issu d’Aaron. Une note conserve la formulation plus littérale et son ambiguïté.'
- source_word: וְ/עִמּ/וֹ
  choice: avec qui se trouvaient
  rationale: Cette tournure française naturelle exprime que le nombre indiqué correspond aux hommes qui accompagnaient Yehoyada.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּ/שְׁבַע מֵאוֹת
  choice: 3 700 hommes
  rationale: Le nombre exact est conservé et présenté selon l’usage typographique français. « Hommes » est explicité d’après le contexte militaire de la liste.
