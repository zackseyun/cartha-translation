  yaml_path: translation/ot/1_chronicles/012/040.yaml
  text: They were there with David for three days[a], eating and drinking, because their brothers had prepared for them.
translation:
  language: fr
  text: Ils furent là avec David pendant trois jours, mangeant et buvant, car leurs frères[a] avaient fait des préparatifs pour eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs proches » ou « les membres de leur clan ». L’hébreu dit littéralement « leurs frères », terme qui peut désigner ici plus largement des membres de la même famille, du même clan ou de la même tribu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם עִם דָּוִיד
  choice: Ils furent là avec David
  rationale: Le verbe היה exprime ici simplement la présence dans le récit. « Ils furent là » conserve cette valeur sans transformer explicitement la présence en séjour prolongé; עִם est rendu directement par « avec ».
- source_word: יָמִים שְׁלוֹשָׁה
  choice: pendant trois jours
  rationale: Le groupe nominal marque la durée; « pendant » l’exprime naturellement en français.
- source_word: אֹכְלִים וְשׁוֹתִים
  choice: mangeant et buvant
  rationale: Les participes décrivent une activité continue durant ces trois jours. La formulation explicite du texte est conservée plutôt que résumée par « faisant la fête » ou « festoyant ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle ils pouvaient manger et boire; « car » convient au registre narratif et soutenu sans être archaïque.
- source_word: הֵכִינוּ לָהֶם
  choice: avaient fait des préparatifs pour eux
  rationale: Le hifil de כון signifie « préparer, mettre en état ». Comme l’objet préparé reste implicite en hébreu, cette formulation française évite d’ajouter expressément « des vivres », tout en donnant une construction idiomatique complète.
- source_word: אֲחֵיהֶם
  choice: leurs frères
  rationale: Le sens lexical direct est « leurs frères ». Dans ce contexte tribal, le terme peut toutefois désigner plus largement des parents ou des membres de leur clan, possibilité signalée en note.
theological_decisions:
- issue: Portée du terme אֲחֵיהֶם dans un contexte tribal
  choice: leurs frères
  alternative: leurs parents; les membres de leur clan
  rationale: Le texte emploie le terme masculin concret « frères ». Le conserver dans le texte principal respecte la formulation hébraïque sans exclure la portée sociale plus large que le mot peut avoir ici; cette ambiguïté est maintenue en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde la progression du récit hébreu et ses participes, tout en rendant idiomatiquement l’objet implicite du verbe « préparer ».
