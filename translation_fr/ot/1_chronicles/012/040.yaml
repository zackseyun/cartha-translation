  text: וַ/יִּהְיוּ שָׁ֤ם עִם דָּוִיד֙ יָמִ֣ים שְׁלוֹשָׁ֔ה אֹכְלִ֖ים וְ/שׁוֹתִ֑ים כִּֽי הֵכִ֥ינוּ לָ/הֶ֖ם אֲחֵי/הֶֽם־־־׃
base_translation:
