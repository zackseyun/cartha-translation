source:
  edition: WLC
  text: וּ/מִֽ/מְּנַשֶּׁ֞ה נָפְל֣וּ עַל דָּוִ֗יד בְּ/בֹא֨/וֹ עִם פְּלִשְׁתִּ֧ים עַל שָׁא֛וּל לַ/מִּלְחָמָ֖ה וְ/לֹ֣א עֲזָרֻ֑/ם כִּ֣י בְ/עֵצָ֗ה שִׁלְּחֻ֜/הוּ סַרְנֵ֤י פְלִשְׁתִּים֙ לֵ/אמֹ֔ר בְּ/רָאשֵׁ֕י/נוּ יִפּ֖וֹל אֶל אֲדֹנָ֥י/ו שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/020.yaml
  text: Some from Manasseh also defected to David when he came with the Philistines against Saul for battle[a], though they did not help them, because the lords of the Philistines, after taking counsel, sent him away, saying[b], “He may defect to his master Saul at the cost of our heads.”
translation:
  language: fr
  text: 'Des hommes de Manassé se rallièrent aussi à David[a] lorsqu’il vint avec les Philistins pour combattre Saül. Cependant, ils ne les aidèrent pas, car les chefs des Philistins, après s’être concertés, renvoyèrent David en disant : « Il pourrait se rallier à son maître Saül au prix de nos têtes[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « tombèrent vers David » ; cette expression hébraïque signifie ici passer dans son camp ou se joindre à lui.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « avec nos têtes » : autrement dit, au prix de nos vies ou pour notre propre ruine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמְּנַשֶּׁה
  choice: Des hommes de Manassé se rallièrent aussi
  rationale: Le partitif implicite est explicité par « des hommes de Manassé », puisque les individus concernés sont nommés au verset suivant. « Aussi » rend la valeur additive de la conjonction.
- source_word: נָפְלוּ עַל דָּוִיד
  choice: se rallièrent à David
  rationale: Dans ce contexte politico-militaire, l’expression signifie passer dans le camp de quelqu’un. « Se rallier à » est naturel en français et n’impose pas nécessairement la nuance péjorative de « faire défection ».
- source_word: בְּבֹאוֹ עִם פְּלִשְׁתִּים עַל שָׁאוּל לַמִּלְחָמָה
  choice: lorsqu’il vint avec les Philistins pour combattre Saül
  rationale: La construction infinitive exprime le temps, עִם l’accompagnement, עַל l’orientation hostile et לַמִּלְחָמָה le but. La formulation française restitue ces rapports avec naturel.
- source_word: וְלֹא עֲזָרֻם
  choice: Cependant, ils ne les aidèrent pas
  rationale: Le suffixe pluriel renvoie très probablement aux Philistins. Les pronoms conservent néanmoins la concision et la légère ambiguïté référentielle de l’hébreu.
- source_word: כִּי בְעֵצָה
  choice: car les chefs des Philistins, après s’être concertés
  rationale: בְעֵצָה évoque une décision prise à la suite d’une délibération. « Après s’être concertés » exprime clairement cette circonstance.
- source_word: שִׁלְּחֻהוּ
  choice: renvoyèrent David
  rationale: Le piel de שלח signifie ici congédier David et l’écarter de l’expédition. La répétition du nom évite une succession de pronoms potentiellement confuse en français.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: les chefs des Philistins
  rationale: סַרְנֵי est le titre propre aux dirigeants des cités philistines. « Chefs » est actuel, digne et suffisamment général pour ne pas les réduire à des commandants militaires.
- source_word: בְרָאשֵׁינוּ
  choice: au prix de nos têtes
  rationale: La traduction conserve l’image frappante de l’hébreu, tout en étant intelligible comme une menace de mort ou de ruine.
- source_word: יִפּוֹל אֶל אֲדֹנָיו שָׁאוּל
  choice: Il pourrait se rallier à son maître Saül
  rationale: Le verbe reprend l’idée d’un passage dans l’autre camp. Le conditionnel « pourrait » rend l’appréhension exprimée par l’inaccompli, et « maître » convient au rapport politique de David avec Saül sans connotation théologique indue.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Se rallier » maintient le parallélisme entre les hommes de Manassé et la crainte des chefs philistins, tandis que « au prix de nos têtes » conserve l’image concrète de l’original.
