base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/038.yaml
  text: And from beyond the Jordan[a], from the Reubenites, the Gadites, and the half-tribe of Manasseh, with every kind of military equipment for war, there were one hundred twenty thousand.
translation:
  language: fr
  text: De l’autre côté du Jourdain[a], parmi les Rubénites, les Gadites et la demi-tribu de Manassé, il y avait cent vingt mille hommes avec tout l’équipement militaire pour le combat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-delà du Jourdain ». L’expression hébraïque peut être rendue différemment selon le point de vue géographique, sans que celui-ci soit précisé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לַיַּרְדֵּן
  choice: De l’autre côté du Jourdain
  rationale: L’expression désigne la région située au-delà ou de l’autre côté du Jourdain, sans fixer explicitement le point de vue géographique.
- source_word: מִן הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: parmi les Rubénites, les Gadites et la demi-tribu de Manassé
  rationale: Les gentilés hébreux au singulier ont un sens collectif. « Parmi » rend naturellement l’origine de l’effectif au sein de ces groupes tribaux.
- source_word: בְּכֹל כְּלֵי צְבָא מִלְחָמָה
  choice: étaient munis de tout l’équipement militaire nécessaire au combat
  rationale: כְּלֵי désigne largement les objets, armes ou équipements. La formulation française conserve cette portée militaire sans la réduire aux seules armes.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: cent vingt mille hommes
  rationale: Le nombre est rendu directement. « Hommes » est explicité d’après le contexte de recensement des contingents militaires, le substantif étant sous-entendu en hébreu.
