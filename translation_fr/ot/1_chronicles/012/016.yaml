  text: אֵ֣לֶּה הֵ֗ם אֲשֶׁ֨ר עָבְר֤וּ אֶת הַ/יַּרְדֵּן֙ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן וְ/ה֥וּא מְמַלֵּ֖א עַל כָּל גדיתי/ו וַ/יַּבְרִ֨יחוּ֙ אֶת כָּל הָ֣/עֲמָקִ֔ים לַ/מִּזְרָ֖ח וְ/לַֽ/מַּעֲרָֽב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/016.yaml
  text: These are the men who crossed the Jordan in the first month[a], when it was overflowing all its banks, and they put to flight all those in the valleys, to the east and to the west.
translation:
  language: fr
  text: Ce sont eux qui traversèrent le Jourdain au premier mois, alors qu’il débordait toutes ses berges. Ils mirent en fuite tous ceux qui habitaient les vallées[a], vers l’est comme vers l’ouest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toutes les vallées » ; il s’agit ici de ceux qui les habitaient, puisque le verbe signifie « faire fuir » ou « mettre en fuite ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: Ce sont eux
  rationale: La formule d’identification emphatique se rend naturellement ainsi en français, sans devoir ajouter « les hommes », déjà implicite dans le contexte.
- source_word: אֲשֶׁר עָבְרוּ אֶת הַיַּרְדֵּן
  choice: qui traversèrent le Jourdain
  rationale: עָבַר désigne ici le fait concret de franchir le fleuve ; « traverser » est précis et naturel.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: au premier mois
  rationale: Rendu direct de l’expression temporelle, qui conserve la manière biblique de désigner le mois sans lui attribuer un nom absent du texte.
- source_word: וְהוּא מְמַלֵּא עַל כָּל גְּדִיתָיו
  choice: alors qu’il débordait par-dessus toutes ses rives
  rationale: Le pronom renvoie au Jourdain et la proposition décrit sa crue. « Débordait par-dessus » exprime clairement מְמַלֵּא עַל, tandis que « toutes ses rives » conserve l’étendue exprimée par כָּל.
- source_word: וַיַּבְרִיחוּ
  choice: Ils mirent en fuite
  rationale: La forme causative de ברח signifie faire fuir. « Mettre en fuite » garde cette valeur et convient au contexte militaire sans amplifier le résultat.
- source_word: אֶת כָּל הָעֲמָקִים
  choice: tous ceux qui habitaient les vallées
  rationale: Le texte dit littéralement « toutes les vallées », mais le verbe causatif exige ici des êtres susceptibles de fuir. Le rendu explicite la métonymie sans identifier plus précisément ces habitants.
- source_word: לַמִּזְרָח וְלַמַּעֲרָב
  choice: vers l’est comme vers l’ouest
  rationale: Cette formulation française naturelle conserve les deux directions et leur parallélisme.
theological_decisions: []
