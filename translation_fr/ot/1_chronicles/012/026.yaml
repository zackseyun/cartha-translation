  text: Des descendants de Siméon, 7 100 vaillants guerriers pour le service militaire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן בְּנֵי שִׁמְעוֹן
  choice: Parmi les descendants de Siméon
  rationale: L’expression hébraïque désigne les membres issus de la tribu de Siméon. « Parmi les descendants » rend naturellement la provenance du contingent sans suggérer qu’il s’agit uniquement des fils immédiats de Siméon.
- source_word: גִּבּוֹרֵי חַיִל
  choice: vaillants guerriers
  rationale: Dans ce contexte militaire, l’expression désigne des combattants reconnus pour leur force, leur courage et leur capacité. « Vaillants guerriers » en restitue les deux dimensions dans un français actuel et digne.
- source_word: לַצָּבָא
  choice: aptes au service militaire
  rationale: Le syntagme précise leur aptitude ou leur affectation à l’armée. Cette formulation française s’intègre naturellement à la liste de contingents et conserve la fonction militaire exprimée par l’hébreu.
- source_word: שִׁבְעַת אֲלָפִים וּמֵאָה
  choice: 7 100
  rationale: Le nombre exact est rendu en chiffres selon la typographie française moderne, avec une espace comme séparateur des milliers.
