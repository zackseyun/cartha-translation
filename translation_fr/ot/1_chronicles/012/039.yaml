  text: כָּל אֵ֜לֶּה אַנְשֵׁ֣י מִלְחָמָה֮ עֹדְרֵ֣י מַעֲרָכָה֒ בְּ/לֵבָ֤ב שָׁלֵם֙ בָּ֣אוּ חֶבְר֔וֹנָ/ה לְ/הַמְלִ֥יךְ אֶת דָּוִ֖יד עַל כָּל יִשְׂרָאֵ֑ל וְ֠/גַם כָּל שֵׁרִ֧ית יִשְׂרָאֵ֛ל לֵ֥ב אֶחָ֖ד לְ/הַמְלִ֥יךְ אֶת דָּוִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/039.yaml
  text: All these were men of war[a], arrayed for battle, who came to Hebron with a whole heart to make David king over all Israel; and also all the rest of Israel were of one heart to make David king.
translation:
  language: fr
  text: Tous ceux-là étaient des hommes de guerre, rangés en ordre de bataille, qui vinrent à Hébron d’un cœur entier pour faire régner David sur tout Israël. Tout le reste d’Israël était également d’un seul cœur pour faire régner David.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: hommes de guerre
  rationale: Rend directement la construction hébraïque et conserve sa forme masculine ainsi que son sens militaire, dans un registre biblique encore compréhensible aujourd’hui.
- source_word: עֹדְרֵי מַעֲרָכָה
  choice: rangés en ordre de bataille
  rationale: Le participe évoque la mise en formation de combat; cette formulation française conserve plus précisément cette nuance que le simple « prêts au combat ».
- source_word: בְּלֵבָב שָׁלֵם
  choice: d’un cœur entier
  rationale: Conserve l’image du cœur et exprime l’intégrité, la plénitude et l’absence de division dans leur intention, sans réduire l’expression à un adverbe.
- source_word: בָּאוּ חֶבְרוֹנָה
  choice: ils vinrent à Hébron
  rationale: Le hé directionnel indique un mouvement vers Hébron; « vinrent à » convient au point de vue narratif.
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: pour établir David comme roi
  rationale: Le hiphil de מלך signifie ici faire régner ou installer comme roi. « Établir comme roi » est naturel et n’ajoute pas la cérémonie particulière qu’impliquerait « couronner ».
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sur tout Israël
  rationale: Formulation française habituelle pour exprimer l’exercice de la royauté sur l’ensemble de la nation.
- source_word: כָּל שֵׁרִית יִשְׂרָאֵל
  choice: tout le reste d’Israël
  rationale: Dans ce résumé narratif, שֵׁרִית désigne vraisemblablement les Israélites autres que ceux qui viennent d’être énumérés; « reste » évite d’introduire ici la notion théologique plus marquée de « reste fidèle ».
- source_word: לֵב אֶחָד
  choice: d’un seul cœur
  rationale: Préserve la métaphore hébraïque et exprime naturellement l’unité d’intention en français.
theological_decisions:
- issue: Portée théologique possible de שֵׁרִית (« reste »)
  choice: tout le reste d’Israël
  alternative: tout le reste fidèle d’Israël / tout ce qui restait d’Israël
  rationale: Même si le terme peut recevoir une portée théologique dans les écrits prophétiques, le contexte immédiat résume ici le soutien national accordé à David. La traduction retenue préserve le sens contextuel sans importer la notion technique d’un reste fidèle.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition finale de « pour établir David comme roi » est maintenue parce qu’elle structure l’hébreu et souligne l’unanimité entre les guerriers réunis et le reste d’Israël. Les deux expressions distinctes « d’un cœur entier » et « d’un seul cœur » conservent le contraste entre intégrité personnelle et unité collective.
