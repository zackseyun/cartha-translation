  text: וּ/מִן בְּנֵ֣י אֶפְרַ֔יִם עֶשְׂרִ֥ים אֶ֖לֶף וּ/שְׁמוֹנֶ֣ה מֵא֑וֹת גִּבּ֣וֹרֵי חַ֔יִל אַנְשֵׁ֥י שֵׁמ֖וֹת לְ/בֵ֥ית אֲבוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/031.yaml
  text: And from the sons of Ephraim[a], twenty thousand eight hundred mighty men of valor, men of renown according to their fathers’ houses.
translation:
  language: fr
  text: 'Parmi les fils d’Éphraïm : 20 800 vaillants guerriers, des hommes de renom[a] dans leurs lignées familiales.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « hommes de noms », expression qui désigne des hommes distingués ou bien connus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Parmi
  rationale: La préposition introduit le contingent issu d’Éphraïm dans la suite de l’énumération. « Parmi » rend naturellement cette relation en français.
- source_word: בְּנֵי אֶפְרַיִם
  choice: les fils d’Éphraïm
  rationale: La formulation conserve l’expression généalogique hébraïque tout en désignant ici les membres de la tribu d’Éphraïm.
- source_word: עֶשְׂרִים אֶלֶף וּשְׁמוֹנֶה מֵאוֹת
  choice: 20 800
  rationale: La notation chiffrée avec l’espace des milliers est claire en français moderne et conserve exactement le nombre hébreu.
- source_word: גִּבּוֹרֵי חַיִל
  choice: vaillants guerriers
  rationale: Dans ce contexte de rassemblement militaire, l’expression désigne des hommes à la fois puissants, courageux et aptes au combat.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: des hommes renommés
  rationale: Littéralement « hommes de noms », cet idiome désigne des hommes connus et distingués. « Renommés » en restitue sobrement la valeur honorifique.
- source_word: לְבֵית אֲבוֹתָם
  choice: dans leurs familles ancestrales
  rationale: L’expression situe leur renommée au sein des unités de parenté paternelles. « Familles ancestrales » est naturel et conserve la dimension généalogique sans imposer le calque obscur « maisons de leurs pères ».
