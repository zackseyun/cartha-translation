translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La formulation conserve « les temps », expression volontairement large qui peut viser le moment historique et les circonstances qui l’accompagnent. Le texte principal explicite légèrement יוֹדְעֵי בִינָה par « capables de discerner » et rend l’idiome final de façon naturelle, avec sa forme littérale en note.
