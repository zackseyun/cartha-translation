base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/033.yaml
  text: 'From the sons of Issachar[a], men who understood the times, to know what Israel should do: their chiefs were two hundred[b], and all their brothers were under their command.'
translation:
  language: fr
  text: Parmi les fils d’Issacar, il y avait des hommes capables de discerner les temps afin de savoir ce qu’Israël devait faire. Leurs chefs étaient deux cents, et tous leurs frères suivaient leurs directives.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous leurs frères étaient selon leur bouche » ; expression signifiant qu’ils se conformaient à leur parole ou à leur direction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשָּׂשכָר
  choice: Parmi les fils d’Issacar
  rationale: La préposition מִן situe ce groupe au sein de l’énumération des contingents tribaux. « Fils d’Issacar » conserve la désignation généalogique et tribale de l’hébreu.
- source_word: יוֹדְעֵי בִינָה לָעִתִּים
  choice: des hommes capables de discerner les temps
  rationale: La construction exprime une compréhension avisée des temps ou des circonstances. « Discerner les temps » restitue à la fois la capacité intellectuelle et le jugement pratique, dans un français naturel et digne.
- source_word: לָדַעַת מַה יַעֲשֶׂה יִשְׂרָאֵל
  choice: afin de savoir ce qu’Israël devait faire
  rationale: L’infinitif marque le but, tandis que l’imparfait hébreu désigne ici l’action appropriée dans la situation. « Devait faire » exprime cette orientation pratique sans transformer le passage en prédiction.
- source_word: רָאשֵׁיהֶם מָאתַיִם
  choice: Leurs chefs étaient deux cents
  rationale: רָאשֵׁיהֶם désigne leurs chefs ou dirigeants. La formulation conserve la structure de la proposition nominale hébraïque tout en restant idiomatique en français.
- source_word: וְכָל אֲחֵיהֶם
  choice: et tous leurs frères
  rationale: « Frères » rend directement אֲחֵיהֶם et convient au contexte d’un rassemblement tribal masculin, tout en pouvant désigner les autres membres de la tribu.
- source_word: עַל־פִּיהֶם
  choice: suivaient leurs directives
  rationale: Littéralement « selon leur bouche », l’expression signifie agir d’après leur parole ou sous leur autorité. « Suivaient leurs directives » rend clairement l’idée sans imposer un cadre militaire plus précis que le texte.
