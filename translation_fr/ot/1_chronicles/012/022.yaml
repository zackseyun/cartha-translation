id: 1CH.12.22
reference: 1 Chronicles 12:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵ֗מָּה עָזְר֤וּ עִם דָּוִיד֙ עַֽל הַ/גְּד֔וּד כִּֽי גִבּ֥וֹרֵי חַ֖יִל כֻּלָּ֑/ם וַ/יִּהְי֥וּ שָׂרִ֖ים בַּ/צָּבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/022.yaml
  text: And they helped David against the raiding band[a], for all of them were mighty men of valor[c][b], and they became commanders in the army.
translation:
  language: fr
  text: Ils aidèrent David contre la bande de pillards[a], car ils étaient tous de vaillants guerriers[b], et ils devinrent des chefs dans l’armée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre la troupe » ; le mot hébreu peut désigner une troupe armée ou une bande qui effectue des raids.
    reason: lexical_alternative
  - marker: b
    text: Ou « de puissants hommes de guerre » ; l’expression hébraïque désigne des combattants courageux et capables.
    reason: lexical_alternative
  - marker: c
    text: Ou « des commandants » ou « des capitaines ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Ils
  rationale: Le pronom indépendant souligne le groupe concerné. En français, le sujet explicite « ils » le désigne naturellement sans alourdir la phrase.
- source_word: עָזְרוּ עִם דָּוִיד
  choice: aidèrent David
  rationale: Le verbe עזר signifie « aider, soutenir ». Malgré la préposition עִם, la construction française naturelle présente David comme bénéficiaire direct de l’aide.
- source_word: עַל הַגְּדוּד
  choice: contre la bande de pillards
  rationale: Dans ce contexte militaire, עַל exprime l’opposition et גְּדוּד peut désigner une troupe, notamment une bande effectuant des raids.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici une explication et « car » conserve clairement ce rapport logique.
- source_word: גִבּוֹרֵי חַיִל
  choice: de vaillants guerriers
  rationale: Cette expression militaire courante désigne des combattants courageux et capables. La formulation choisie en restitue le sens avec naturel en français moderne.
- source_word: כֻּלָּם
  choice: tous
  rationale: Le terme insiste sur la totalité du groupe; « tous » préserve cette portée distributive.
- source_word: וַיִּהְיוּ
  choice: ils devinrent
  rationale: La forme narrative marque ici l’accession à un statut, plutôt qu’un simple état statique.
- source_word: שָׂרִים
  choice: des chefs
  rationale: Dans ce cadre militaire, שָׂרִים désigne des personnes exerçant une autorité. « Chefs » évite d’imposer un grade moderne trop précis.
- source_word: בַּצָּבָא
  choice: dans l’armée
  rationale: צָבָא désigne ici la force militaire organisée; « armée » est l’équivalent français moderne le plus direct.
theological_decisions: []
