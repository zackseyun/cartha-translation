  text: בְּ/לֶכְתּ֣/וֹ אֶל צִֽיקְלַ֗ג נָפְל֣וּ עָלָ֣י/ו מִֽ/מְּנַשֶּׁ֡ה עַ֠דְנַח וְ/יוֹזָבָ֤ד וִ/ידִֽיעֲאֵל֙ וּ/מִיכָאֵ֣ל וְ/יוֹזָבָ֔ד וֶ/אֱלִיה֖וּא וְ/צִלְּתָ֑י רָאשֵׁ֥י הָ/אֲלָפִ֖ים אֲשֶׁ֥ר לִ/מְנַשֶּֽׁה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/021.yaml
  text: 'As he went to Ziklag[a], some from Manasseh defected to him: Adnah, Jozabad, Jediael, Michael, another Jozabad, Elihu, and Zillethai[c][b], chiefs of the thousands that belonged to Manasseh.'
translation:
  language: fr
  text: 'Alors qu’il se rendait à Tsiqlag, des hommes de Manassé se rallièrent à lui[a] : Adnah, Yozabad, Yediaël, Mikaël, Yozabad[b], Élihou et Tsilletaï. Ils étaient chefs des milliers de Manassé[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « tombèrent sur lui », expression qui signifie ici qu’ils passèrent dans le camp de David.
    reason: lexical_alternative
  - marker: b
    text: Le nom Yozabad figure deux fois dans la liste hébraïque; il s’agit donc de deux hommes portant le même nom.
    reason: cultural_note
  - marker: c
    text: L’expression « chefs des milliers » peut désigner des commandants d’unités militaires ou des responsables de divisions claniques de Manassé.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתּוֹ אֶל צִיקְלַג
  choice: Alors qu’il se rendait à Tsiqlag
  rationale: La préposition ב avec l’infinitif construit exprime ici la simultanéité ou le cadre temporel. « Alors qu’il se rendait » est naturel en français et conserve cette valeur. « Tsiqlag » suit une translittération française proche de l’hébreu.
- source_word: נָפְלוּ עָלָיו
  choice: se rallièrent à lui
  rationale: L’expression est un idiome politico-militaire signifiant passer dans le camp de quelqu’un. « Se rallièrent à lui » rend le changement d’allégeance sans la littéralité obscure de « tombèrent sur lui ».
- source_word: מִמְּנַשֶּׁה
  choice: des hommes de Manassé
  rationale: Le texte indique leur origine tribale. L’ajout explicatif minimal « des hommes » produit une phrase française naturelle sans préciser davantage que l’hébreu.
- source_word: עַדְנַח וְיוֹזָבָד וִידִיעֲאֵל וּמִיכָאֵל וְיוֹזָבָד וֶאֱלִיהוּא וְצִלְּתָי
  choice: Adnah, Yozabad, Yediaël, Mikaël, Yozabad, Élihou et Tsilletaï
  rationale: Les noms sont translittérés selon des formes adaptées au français. La répétition de Yozabad est maintenue dans le texte même, comme en hébreu, sans introduire « un autre », absent de la source; une note prévient toute confusion.
- source_word: רָאשֵׁי הָאֲלָפִים
  choice: chefs des milliers
  rationale: 'Cette traduction conserve l’expression hébraïque et son ambiguïté: אֲלָפִים peut désigner des unités militaires d’un millier ou des divisions claniques.'
- source_word: אֲשֶׁר לִמְנַשֶּׁה
  choice: de Manassé
  rationale: Le complément rattache ces « milliers » à Manassé. La formulation concise respecte la structure et évite de trancher entre organisation militaire et clanique.
