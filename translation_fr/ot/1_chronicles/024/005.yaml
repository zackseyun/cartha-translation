revisions:
- from: On les répartit par tirage au sort, ceux-ci avec ceux-là[a], car il y avait des responsables du sanctuaire et des responsables de Dieu[b] parmi les fils d’Éléazar comme parmi les fils d’Itamar.
  to: Ils les répartirent par tirage au sort, ceux-ci avec ceux-là[a], car il y avait, parmi les fils d’Éléazar et parmi les fils d’Itamar, des chefs du sanctuaire et des chefs de Dieu[b].
  rationale: La révision corrige l’ambiguïté française créée par « responsables de Dieu » et adopte un passé narratif explicite. Elle conserve la construction parallèle, l’ellipse du texte source et l’absence de toute expansion institutionnelle dans le corps du verset.
