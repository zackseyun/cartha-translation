  yaml_path: translation/ot/1_chronicles/024/005.yaml
  text: So they divided them by lots[a], these with those[b], because there were officers of the sanctuary and officers of God from the sons of Eleazar and from the sons of Ithamar.
translation:
  language: fr
  text: Ils les répartirent par tirage au sort, ceux-ci avec ceux-là[a], car il y avait, parmi les fils d’Éléazar et parmi les fils d’Itamar, des chefs du sanctuaire et des chefs de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux-ci avec ceux-là ». La formule peut aussi évoquer la mise en parallèle ou le traitement conjoint d’un groupe avec l’autre.'
    reason: La tournure hébraïque elliptique אֵלֶּה עִם אֵלֶּה est conservée dans le texte sans préciser davantage la relation entre les groupes.
  - marker: b
    text: 'Ou : « des chefs des choses saintes et des chefs de Dieu ». Certains comprennent la seconde expression comme une forme abrégée de « chefs de la maison de Dieu », mais le mot « maison » ne figure pas dans l’hébreu.'
    reason: Les expressions שָׂרֵי קֹדֶשׁ et שָׂרֵי הָאֱלֹהִים sont parallèles, mais leur référence institutionnelle exacte reste discutée.
lexical_decisions:
- source_word: וַיַּחְלְקוּם
  choice: On les répartit
  rationale: Le piel de חלק avec suffixe désigne ici la répartition des groupes sacerdotaux. « Répartit » exprime naturellement une attribution organisée sans réduire le verbe à une simple classification.
- source_word: בְּגוֹרָלוֹת
  choice: par tirage au sort
  rationale: Cette expression française idiomatique rend le moyen d’attribution indiqué par le pluriel גּוֹרָלוֹת.
- source_word: אֵלֶּה עִם אֵלֶּה
  choice: ceux-ci avec ceux-là
  rationale: La formulation conserve les deux démonstratifs et la concision distributive de l’hébreu, tout en laissant ouverte la relation précise entre les deux ensembles.
- source_word: שָׂרֵי קֹדֶשׁ
  choice: responsables du sanctuaire
  rationale: שָׂרִים peut désigner des chefs, dignitaires ou responsables. Dans ce contexte sacerdotal et administratif, « responsables » est naturel et non monarchique; קֹדֶשׁ renvoie vraisemblablement à la sphère sacrée, ici rendue par « sanctuaire ».
- source_word: וְשָׂרֵי הָאֱלֹהִים
  choice: et des responsables de Dieu
  rationale: La traduction maintient l’expression inhabituelle et littérale « de Dieu », sans ajouter « maison » ou « service », absents de l’hébreu.
- source_word: מִבְּנֵי אֶלְעָזָר וּבִבְנֵי אִיתָמָר
  choice: parmi les fils d’Éléazar comme parmi les fils d’Itamar
  rationale: « Fils » conserve l’expression généalogique. « Parmi… comme parmi… » rend clairement la présence de responsables dans les deux lignées, tout en respectant le parallélisme contextuel.
theological_decisions:
- issue: Sens de שָׂרֵי קֹדֶשׁ וְשָׂרֵי הָאֱלֹהִים
  choice: responsables du sanctuaire et responsables de Dieu
  alternative: chefs du sanctuaire et chefs de Dieu; responsables des choses saintes et responsables de Dieu; responsables de la maison de Dieu
  rationale: Les deux désignations parallèles sont conservées sans les fusionner ni ajouter une institution absente du texte. La note signale les principales possibilités lexicales et l’ellipse parfois supposée.
translation_notes:
  register: Français international moderne, digne et lisible. Le tour « ceux-ci avec ceux-là » est volontairement plus proche de l’hébreu et son étrangeté est explicitée en note. « Responsables » évite la connotation royale de « princes » et convient à une fonction sacerdotale ou administrative.
