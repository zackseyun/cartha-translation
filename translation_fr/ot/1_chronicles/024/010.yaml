  text: the seventh to Hakkoz[a], the eighth to Abijah.
translation:
  language: fr
  text: le septième à Haqqots[a], le huitième à Abiya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour Haqqots… pour Abiya ». Dans cette liste d’attributions, la préposition hébraïque ל peut se rendre de l’une ou l’autre manière.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַקּוֹץ
  choice: à Haqqots
  rationale: Le préfixe ל marque ici l’attribution dans la liste des classes sacerdotales. « Haqqots » rend le nom hébreu הַקּוֹץ par une translittération adaptée au français.
- source_word: הַשְּׁבִעִי
  choice: le septième
  rationale: L’adjectif ordinal avec article désigne le septième rang ou lot de la série; l’article et le style elliptique de la liste sont conservés.
- source_word: לַאֲבִיָּה
  choice: à Abiya
  rationale: Comme dans le membre précédent, le préfixe ל exprime l’attribution. « Abiya » est une translittération française naturelle du nom אֲבִיָּה.
- source_word: הַשְּׁמִינִי
  choice: le huitième
  rationale: L’ordinal articulé, parallèle à « le septième », indique le huitième rang ou lot.
theological_decisions: []
