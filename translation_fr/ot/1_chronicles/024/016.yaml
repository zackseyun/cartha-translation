  text: for Pethahiah[a], the nineteenth; for Jehezkel, the twentieth.
translation:
  language: fr
  text: pour Pethahia, le dix-neuvième ; pour Yehézqel[a], le vingtième.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ézéchiel », forme française traditionnelle de ce nom hébreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְתַחְיָה
  choice: pour Petahia
  rationale: Dans cette liste des classes sacerdotales, la préposition ל indique l’attribution du lot ou du rang. Le nom propre est translittéré sous une forme naturelle en français.
- source_word: תִּשְׁעָה עָשָׂר
  choice: le dix-neuvième
  rationale: L’expression cardinale hébraïque a ici une valeur ordinale dans la succession des classes ; le nom « lot » ou « rang » reste sous-entendu comme dans le texte source.
- source_word: לִיחֶזְקֵאל
  choice: pour Yéhezqel[a]
  rationale: La préposition ל marque de nouveau l’attribution. « Yéhezqel » reproduit le nom hébreu plus directement, sans l’assimiler silencieusement à sa forme française traditionnelle « Ézéchiel ».
- source_word: הָעֶשְׂרִים
  choice: le vingtième
  rationale: Le numéral muni de l’article fonctionne comme un ordinal dans cette série ; le nom déterminé demeure implicite.
theological_decisions: []
translation_notes:
  register: Formulation concise et symétrique, conforme au style d’une liste. Les ordinaux rendent explicitement la fonction contextuelle des numéraux hébreux, tandis que le lot ou le rang demeure sous-entendu.
