lexical_decisions:
- source_word: לְחָרִם
  choice: à Harim
  rationale: Le préfixe לְ marque ici l’attribution dans la liste des sorts. « À » restitue naturellement cette relation tout en conservant l’ellipse de l’hébreu. Harim est translittéré.
- source_word: הַשְּׁלִישִׁי
  choice: le troisième
  rationale: L’adjectif ordinal défini désigne le troisième sort ou groupe dans la série. La formulation elliptique de la liste est conservée.
- source_word: לִשְׂעֹרִים
  choice: à Séorim
  rationale: Comme dans le premier membre, le préfixe לִ marque l’attribution par le sort. Le nom propre est translittéré, avec un accent conforme à l’usage français pour guider la prononciation.
- source_word: הָרְבִעִי
  choice: le quatrième
  rationale: L’adjectif ordinal défini, parallèle à « le troisième », désigne le quatrième sort ou groupe.
