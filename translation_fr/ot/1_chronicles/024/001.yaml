  yaml_path: translation/ot/1_chronicles/024/001.yaml
  text: 'These were the divisions of the sons of Aaron: the sons of Aaron were Nadab and Abihu[a], Eleazar and Ithamar.'
translation:
  language: fr
  text: 'Quant aux fils d’Aaron, voici leurs classes[a] : les fils d’Aaron étaient Nadab et Abihou, Éléazar et Itamar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « divisions » : le terme hébreu désigne ici des groupes sacerdotaux organisés.'
