lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: Quant aux fils d’Aaron
  rationale: La conjonction et la préposition introduisent ici une nouvelle rubrique. « Quant aux » restitue naturellement cette fonction thématique sans ajouter une valeur temporelle absente de l’hébreu.
- source_word: מַחְלְקוֹתָם
  choice: leurs classes
  rationale: Le nom désigne des groupes organisés pour le service. « Classes » est un terme français courant dans le contexte des classes sacerdotales et conserve l’idée de répartition structurée.
- source_word: בְּנֵי אַהֲרֹן
  choice: les fils d’Aaron
  rationale: Traduction directe et naturelle de la construction hébraïque, avec maintien de « fils » conformément au référent masculin explicite.
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: Nadab et Abihou, Éléazar et Itamar
  rationale: Formes françaises usuelles des noms propres bibliques; les conjonctions et le regroupement de la liste sont conservés.
