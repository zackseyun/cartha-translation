- source_word: הַתְּשִׁעִי
  choice: le neuvième
  rationale: L’ordinal défini est employé substantivement et désigne le neuvième rang ou lot. L’article est conservé pour respecter la structure concise de l’hébreu.
- source_word: לִשְׁכַנְיָהוּ
  choice: à Shekania
  rationale: Comme dans le premier membre, לְ indique l’attribution. « Shekania » est une translittération française lisible du nom hébreu, sans donner une valeur particulière à l’élément théophore final.
- source_word: הָעֲשִׂרִי
  choice: le dixième
  rationale: L’ordinal défini désigne le dixième rang ou lot et conserve le parallélisme de l’énumération hébraïque.
