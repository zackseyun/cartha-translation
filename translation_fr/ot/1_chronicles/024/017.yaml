lexical_decisions:
- source_word: לְ/יָכִין
  choice: pour Yakin
  rationale: Dans cette liste des classes sacerdotales, la préposition לְ indique l’attribution ou l’ordre échu à la personne nommée. Le nom propre est translittéré selon une forme française naturelle.
- source_word: אֶחָד וְ/עֶשְׂרִים
  choice: le vingt et unième
  rationale: L’expression cardinale hébraïque, littéralement « un et vingt », a ici une valeur ordinale dans la succession des classes.
- source_word: לְ/גָמוּל
  choice: pour Gamoul
  rationale: Comme dans le premier membre, לְ marque l’attribution de la classe à la personne nommée. « Gamoul » rend la vocalisation hébraïque dans une translittération adaptée au français.
- source_word: שְׁנַיִם וְ/עֶשְׂרִים
  choice: le vingt-deuxième
  rationale: La formulation cardinale, littéralement « deux et vingt », fonctionne comme un ordinal dans cette liste numérotée.
