  text: 'And the sons of Mushi: Mahli[a], Eder, and Jeremoth. These were the sons of the Levites according to their fathers'' houses.'
translation:
  language: fr
  text: 'Et les fils de Mouchi : Mahli, Éder et Yerimoth. Ce sont là les fils des Lévites, selon leurs maisons paternelles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי מוּשִׁי
  choice: Et les fils de Mouchi
  rationale: La conjonction וּ relie cette notice à la liste précédente, et la formule généalogique est conservée naturellement en français.
- source_word: מַחְלִי וְעֵדֶר וִירִימוֹת
  choice: Mahli, Éder et Yerimoth
  rationale: Les noms propres sont translittérés sous des formes françaises claires; les conjonctions hébraïques successives sont rendues selon l’usage naturel d’une énumération française.
- source_word: אֵלֶּה
  choice: Tels étaient
  rationale: Le démonstratif récapitule les personnes énumérées; l’imparfait convient au registre généalogique français sans modifier le sens.
- source_word: בְּנֵי הַלְוִיִּם
  choice: les descendants de Lévi
  rationale: Littéralement « les fils des Lévites »; dans ce contexte récapitulatif, « descendants de Lévi » exprime clairement l’appartenance généalogique et évite l’impression qu’il s’agit des fils immédiats de plusieurs Lévites.
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: selon leurs familles paternelles
  rationale: Cette expression administrative et généalogique désigne les groupes familiaux constitués selon la lignée paternelle; la formulation retenue est naturelle et précise en français moderne.
