  text: וַ/יָּ֨מָת נָדָ֤ב וַ/אֲבִיהוּא֙ לִ/פְנֵ֣י אֲבִי/הֶ֔ם וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַֽ/יְכַהֲנ֔וּ אֶלְעָזָ֖ר וְ/אִיתָמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/002.yaml
  text: But Nadab and Abihu died before their father[a], and they had no sons; so Eleazar and Ithamar served as priests.
translation:
  language: fr
  text: Mais Nadab et Abihou moururent avant leur père[a] et ils n’eurent pas de fils. Éléazar et Itamar exercèrent donc le sacerdoce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en présence de leur père ». L’expression hébraïque peut avoir un sens spatial (« devant, en présence de ») ou temporel (« avant », c’est-à-dire du vivant de leur père).
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּמָת
  choice: moururent
  rationale: Le wayyiqtol de מוּת rapporte un événement passé; le passé simple convient au registre narratif soutenu du passage.
- source_word: לִפְנֵי
  choice: avant
  rationale: 'Avec «leur père», l’expression se comprend naturellement au sens temporel: ils moururent du vivant de leur père. Le sens spatial possible est conservé en note.'
- source_word: אֲבִיהֶם
  choice: leur père
  rationale: Le nom avec suffixe masculin pluriel renvoie au père commun de Nadab et Abihou, Aaron.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: ils n’eurent pas de fils
  rationale: בָּנִים désigne ici des fils, non des enfants de manière générique; la tournure française reste directe et précise.
- source_word: וַיְכַהֲנוּ
  choice: exercèrent la fonction de prêtres
  rationale: Le piel de כָּהַן exprime l’exercice du service sacerdotal; cette formulation préserve la valeur verbale et reste claire en français moderne.
- source_word: אֶלְעָזָר וְאִיתָמָר
  choice: Éléazar et Itamar
  rationale: Les noms propres suivent des formes françaises bibliques usuelles et immédiatement reconnaissables.
theological_decisions:
- issue: Sens de לִפְנֵי אֲבִיהֶם
  choice: avant leur père
  alternative: en présence de leur père
  rationale: Le contexte favorise le sens temporel, c’est-à-dire avant la mort de leur père, mais la valeur spatiale de l’expression hébraïque demeure possible et peut faire écho au récit de Lévitique 10. L’ambiguïté est donc signalée plutôt que supprimée.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif des Chroniques sans archaïsme excessif. La formulation «exercèrent la fonction de prêtres» rend explicitement l’activité sacerdotale exprimée par le verbe hébreu.
