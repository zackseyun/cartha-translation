lexical_decisions:
- source_word: לְמַלְכִּיָּה
  choice: à Malkiya
  rationale: Dans cette liste d’attribution des lots, la préposition לְ indique naturellement en français le destinataire de chaque lot. Le nom est translittéré directement d’après l’hébreu.
- source_word: הַחֲמִישִׁי
  choice: le cinquième
  rationale: L’ordinal défini est employé substantivement et désigne, dans la formule elliptique de la liste, le cinquième lot ou rang.
- source_word: לְמִיָּמִן
  choice: à Miyamin
  rationale: Comme dans le premier membre, לְ marque l’attribution. La graphie française choisie représente directement la forme hébraïque du nom.
- source_word: הַשִּׁשִּׁי
  choice: le sixième
  rationale: L’ordinal défini poursuit la formule concise d’attribution et désigne le sixième lot ou rang.
