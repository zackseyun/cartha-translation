  text: le cinquième à Malkiya[a], le sixième à Miyamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour Malkiya… pour Miyamin ». Dans cette liste d’attribution des lots, la préposition hébraïque peut se rendre des deux manières.
