  text: וַ/יִּמָּצְא֣וּ בְֽנֵי אֶלְעָזָ֡ר רַבִּ֞ים לְ/רָאשֵׁ֧י הַ/גְּבָרִ֛ים מִן בְּנֵ֥י אִיתָמָ֖ר וַֽ/יַּחְלְק֑וּ/ם לִ/בְנֵ֨י אֶלְעָזָ֜ר רָאשִׁ֤ים לְ/בֵית אָבוֹת֙ שִׁשָּׁ֣ה עָשָׂ֔ר וְ/לִ/בְנֵ֧י אִיתָמָ֛ר לְ/בֵ֥ית אֲבוֹתָ֖/ם שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/004.yaml
  text: 'The sons of Eleazar were found to be more numerous[a], as heads of the men, than the sons of Ithamar, and they divided them thus: for the sons of Eleazar, sixteen heads of fathers’ houses, and for the sons of Ithamar, according to their fathers’ houses[b], eight.'
translation:
  language: fr
  text: 'On trouva, chez les fils d’Éléazar, un plus grand nombre de chefs parmi les hommes que chez les fils d’Itamar. On les répartit ainsi : pour les fils d’Éléazar, seize chefs de maisons paternelles[b] ; pour les fils d’Itamar, huit chefs selon leurs maisons paternelles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Les « maisons paternelles » étaient des groupes familiaux issus d’un même ancêtre et constituaient une unité généalogique et administrative en Israël.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמָּצְאוּ רַבִּים
  choice: On trouva … plus
  rationale: 'Le niphal de מצא exprime ici un constat, tandis que רַבִּים prend une valeur comparative en raison de מִן : le groupe d’Éléazar comptait davantage de chefs que celui d’Itamar.'
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: parmi … plus de chefs d’hommes
  rationale: Cette formulation conserve les deux éléments de l’expression hébraïque, « chefs » et « hommes », sans donner à גְּבָרִים un sens militaire que le contexte sacerdotal n’impose pas.
- source_word: וַיַּחְלְקוּם
  choice: On les répartit ainsi
  rationale: Le verbe désigne ici la répartition des descendants sacerdotaux en groupes de service ; le pronom indéfini français rend naturellement le sujet non précisé du pluriel hébreu.
- source_word: רָאשִׁים
  choice: chefs
  rationale: « Chefs » exprime la responsabilité exercée au sein des groupes familiaux et reprend le vocabulaire de la première proposition.
- source_word: לְבֵית אָבוֹת / לְבֵית אֲבוֹתָם
  choice: de maisons paternelles / selon leurs maisons paternelles
  rationale: Cette expression maintient la terminologie généalogique et administrative de Chroniques ; la seconde formulation fait ressortir le suffixe possessif et la valeur distributive.
- source_word: שִׁשָּׁה עָשָׂר / שְׁמוֹנָה
  choice: seize / huit
  rationale: Les nombres sont rendus directement comme le décompte des chefs correspondant aux groupes familiaux.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Itamar » suit la forme française courante. La ponctuation en deux phrases et le point-virgule rendent clairement la comparaison puis la répartition numérique, tout en préservant la structure du verset.
