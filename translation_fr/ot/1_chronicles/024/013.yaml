  text: for Huppah[a], the thirteenth; for Jeshebeab, the fourteenth.
translation:
  language: fr
  text: pour Houppa[a], le treizième ; pour Yéshébeab, le quatorzième.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Houppa […] à Yéshébeab ». Dans cette liste d’attributions, la préposition hébraïque peut être rendue de l’une ou l’autre manière.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חֻפָּה
  choice: pour Houppa
  rationale: Dans cette liste d’attribution des classes sacerdotales par tirage au sort, le préfixe לְ marque le bénéficiaire ou le destinataire de l’attribution. « Pour Houppa » est naturel en français et conserve cette valeur.
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: le treizième
  rationale: 'La forme cardinale hébraïque a ici une fonction ordinale : elle indique le rang du lot dans la série.'
- source_word: לְ/יֶשֶׁבְאָב
  choice: pour Yéshébeab
  rationale: Comme dans le premier membre, לְ indique l’attribution. « Yéshébeab » rend le nom propre hébreu יֶשֶׁבְאָב selon une translittération adaptée au français.
- source_word: אַרְבָּעָה עָשָׂר
  choice: le quatorzième
  rationale: Bien que l’hébreu emploie formellement un nombre cardinal, le contexte ordonné des lots appelle naturellement l’ordinal français.
