  yaml_path: translation/ot/1_chronicles/024/022.yaml
  text: 'For the Izharite: Shelomoth[b][a]; for the sons of Shelomoth: Jahath.'
translation:
  language: fr
  text: 'Pour les Izharites : Shelomoth ; pour les fils de Shelomoth : Yahath.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: Pour l’Izharite
  rationale: Dans cette liste administrative, le préfixe ל indique naturellement une attribution, rendue par « pour ». Le terme dérivé d’Izhar désigne ici un membre ou représentant du clan.
- source_word: שְׁלֹמוֹת
  choice: Shelomoth
  rationale: Nom propre translittéré de façon cohérente avec la forme hébraïque.
- source_word: לִבְנֵי
  choice: pour les fils de
  rationale: Le préfixe ל exprime de nouveau l’attribution. בְּנֵי signifie littéralement « fils de », tout en pouvant désigner plus largement des descendants dans une liste généalogique ou administrative.
- source_word: יָחַת
  choice: Yahath
  rationale: Translittération française du nom propre, avec Y pour représenter le yod initial et th pour le tav final selon une convention biblique française courante.
