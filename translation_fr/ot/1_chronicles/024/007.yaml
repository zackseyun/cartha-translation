  text: The first lot came out for Jehoiarib[a], the second for Jedaiah.
translation:
  language: fr
  text: Le premier lot revint à Yehoyarib, le deuxième à Yedaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: revint
  rationale: Dans le contexte d’un tirage au sort, « revint à » exprime naturellement en français l’attribution indiquée par le verbe יצא, littéralement « sortit ».
- source_word: הַגּוֹרָל
  choice: lot
  rationale: « Lot » est le terme français usuel pour le résultat ou la part attribuée par tirage au sort dans ce contexte d’organisation sacerdotale.
- source_word: הָרִאשׁוֹן
  choice: le premier
  rationale: L’ordinal défini marque le premier rang dans la série et correspond directement à la construction hébraïque.
- source_word: לִיהוֹיָרִיב
  choice: à Yehoyarib
  rationale: La préposition ל marque ici le bénéficiaire de l’attribution; « à » convient naturellement avec « revint ».
- source_word: לִידַעְיָה
  choice: à Yedaya
  rationale: La préposition ל indique de même le bénéficiaire du deuxième lot.
- source_word: הַשֵּׁנִי
  choice: le deuxième
  rationale: L’ordinal défini indique le rang suivant et forme un parallèle clair avec « le premier ».
