base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/027.yaml
  text: 'The sons of Merari: of Jaaziah, his son, Shoham, Zaccur, and Ibri.'
translation:
  language: fr
  text: 'Fils de Merari : de Jaazia, son fils[a], Shoham, Zakkour et Ibri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son fils ». La syntaxe hébraïque est difficile. Certains comprennent « Beno » comme un nom propre; d’autres donnent au terme un sens pluriel : « ses fils ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: Fils de Merari
  rationale: Le pluriel construit introduit une liste généalogique. « Fils de » est direct et conventionnel, tout en pouvant désigner les membres d’une lignée.
- source_word: לְיַעֲזִיָּהוּ
  choice: de Jaazia
  rationale: La préposition לְ marque ici vraisemblablement la branche généalogique associée à Jaazia. « de Jaazia » conserve cette relation sans la préciser davantage.
- source_word: בְנוֹ
  choice: son fils
  rationale: Le texte massorétique vocalisé porte naturellement le singulier « son fils ». Cette lecture est maintenue malgré la syntaxe difficile; les autres analyses sont signalées en note.
- source_word: וְשֹׁהַם
  choice: Shoham
  rationale: Nom propre translittéré sous une forme proche de l’hébreu.
- source_word: וְזַכּוּר
  choice: Zakkour
  rationale: Nom propre translittéré de manière à représenter la consonne redoublée et la voyelle longue dans une graphie française lisible.
- source_word: וְעִבְרִי
  choice: Ibri
  rationale: Nom propre translittéré sous une forme naturelle en français.
