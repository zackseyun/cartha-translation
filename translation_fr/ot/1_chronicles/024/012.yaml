  text: the eleventh to Eliashib[b][a], the twelfth to Jakim.
translation:
  language: fr
  text: le onzième à Éliashib[a], le douzième à Yakim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour Éliashib… pour Yakim ». La préposition hébraïque peut recevoir l’une ou l’autre traduction dans cette liste d’attributions.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אֶלְיָשִׁיב
  choice: à Éliashib
  rationale: Dans cette liste de classes sacerdotales attribuées par tirage au sort, le préfixe לְ indique le destinataire de l’attribution. « À Éliashib » le rend naturellement en français, tandis que le nom propre est translittéré.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: le onzième
  rationale: La forme cardinale « onze » a ici une fonction ordinale dans la suite des lots. Le masculin renvoie implicitement au lot, exprimé dans le contexte mais non répété dans ce verset.
- source_word: לְ/יָקִים
  choice: à Yakim
  rationale: Le préfixe לְ marque de nouveau l’attribution. « Yakim » reproduit directement la vocalisation hébraïque יָקִים et convient aux usages modernes de translittération en français.
- source_word: שְׁנֵים עָשָׂר
  choice: le douzième
  rationale: Comme le premier nombre, « douze » fonctionne ici comme un ordinal dans la liste. Le mot « lot » reste implicite et n’est donc pas ajouté au texte principal.
