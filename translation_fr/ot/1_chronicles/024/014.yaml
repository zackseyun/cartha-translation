  text: for Bilgah[a], the fifteenth; for Immer, the sixteenth.
translation:
  language: fr
  text: pour Bilga, le quinzième ; pour Immer, le seizième.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quinze » et « seize » ; dans ce contexte de lots numérotés, ces nombres ont le sens ordinal : « le quinzième » et « le seizième ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: pour Bilga
  rationale: Le préfixe לְ marque ici l’attribution dans la liste des classes sacerdotales. « Pour Bilga » rend naturellement cette formule en français.
- source_word: חֲמִשָּׁה עָשָׂר
  choice: le quinzième
  rationale: La forme hébraïque est cardinale (« quinze »), mais elle a une valeur ordinale dans cette succession de lots attribués.
- source_word: לְ/אִמֵּר
  choice: pour Immer
  rationale: Comme devant Bilga, le préfixe לְ indique l’attribution du lot à la classe sacerdotale d’Immer.
- source_word: שִׁשָּׁה עָשָׂר
  choice: le seizième
  rationale: La forme cardinale (« seize ») fonctionne ici comme un ordinal dans l’énumération des lots.
