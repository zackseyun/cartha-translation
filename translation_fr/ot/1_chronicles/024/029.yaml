lexical_decisions:
- source_word: לְקִישׁ
  choice: Pour Qish
  rationale: Dans cette liste, la préposition לְ sert vraisemblablement à introduire une rubrique ou une lignée. « Pour Qish » en conserve la concision et la structure.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le pluriel construit signifie littéralement « fils de ». Même si le terme peut parfois désigner des descendants, la mention immédiate d'un seul nom favorise ici la traduction littérale.
- source_word: קִישׁ
  choice: Qish
  rationale: Transcription du nom propre hébreu קִישׁ, avec « Q » pour rendre distinctement la consonne initiale.
- source_word: יְרַחְמְאֵל
  choice: Yerahméel
  rationale: Transcription française du nom propre hébreu, en rendant le yod initial par « Y » et en conservant une forme lisible en français.
