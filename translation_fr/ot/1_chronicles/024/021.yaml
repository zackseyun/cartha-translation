  text: לִ/רְחַבְיָ֑הוּ לִ/בְנֵ֣י רְחַבְיָ֔הוּ הָ/רֹ֖אשׁ יִשִּׁיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/021.yaml
  text: For Rehabiah[a], from the sons of Rehabiah, the chief was Isshiah.
translation:
  language: fr
  text: Pour Rehabia[a], parmi les fils de Rehabia, le chef était Yishiya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quant à Rehabia, parmi les fils de Rehabia, Yishiya était le chef. »'
    reason: La préposition ל peut introduire une rubrique au sens de « pour » ou de « quant à », et l’ordre des mots hébreu permet cette autre formulation.
lexical_decisions:
- source_word: לִרְחַבְיָהוּ
  choice: Pour Rehabia
  rationale: La préposition ל introduit ici une nouvelle rubrique familiale dans l’énumération. « Pour Rehabia » conserve cette fonction de classement sans préciser davantage une relation que l’hébreu laisse concise.
- source_word: לִבְנֵי רְחַבְיָהוּ
  choice: parmi les fils de Rehabia
  rationale: בְּנֵי désigne les fils ou descendants masculins de Rehabia. Dans ce contexte généalogique, « parmi les fils » exprime naturellement que le chef nommé appartient à cette branche, tout en maintenant le vocabulaire familial du texte.
- source_word: הָרֹאשׁ
  choice: le chef
  rationale: רֹאשׁ signifie littéralement « tête », mais désigne ici le principal représentant de la famille. « Le chef » est clair, actuel et adapté au registre administratif de la liste.
- source_word: יִשִּׁיָּה
  choice: Yishiya
  rationale: Le nom propre est translittéré de manière lisible en français, en rendant la consonne initiale י par « Y » et la terminaison théophore abrégée par « iya ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « Rehabia », présente dans l’hébreu et structurante pour la généalogie, est conservée. « Fils » est maintenu plutôt que généralisé en « descendants ».
