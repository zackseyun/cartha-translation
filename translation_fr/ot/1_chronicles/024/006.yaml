base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/006.yaml
  text: Shemaiah son of Nethanel[a], the scribe from among the Levites, recorded them in the presence of the king, the officials, Zadok the priest, Ahimelech son of Abiathar, and the heads of the fathers’ houses of the priests and of the Levites—one father’s house being taken for Eleazar, and one being taken for Ithamar.
translation:
  language: fr
  text: 'Shemaeya, fils de Nethaneel, le scribe qui faisait partie des Lévites, les inscrivit en présence du roi, des hauts responsables, du prêtre Sadoc, d’Ahimélec, fils d’Abiatar, et des chefs des maisons ancestrales des prêtres et des Lévites : une maison ancestrale fut prise pour Éléazar, et une fut prise pour Itamar.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très condensé : « une maison ancestrale prise pour Éléazar, et prise, prise pour Itamar ». Il semble décrire la sélection de maisons des lignées d’Éléazar et d’Itamar, mais la formulation exacte demeure elliptique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתְּבֵם
  choice: les inscrivit
  rationale: Le verbe כתב avec le suffixe masculin pluriel renvoie aux groupes ou noms établis dans le contexte précédent. « Les inscrivit » exprime naturellement la mise par écrit dans un registre sans préciser indûment le support.
- source_word: הַסּוֹפֵר
  choice: le scribe
  rationale: סֹפֵר désigne ici un rédacteur officiel chargé de l’inscription; « scribe » conserve la fonction historique.
- source_word: מִן הַלֵּוִי
  choice: qui faisait partie des Lévites
  rationale: Cette formulation rend la nuance partitive de מן et l’appartenance de Shemaeya au groupe lévitique, tout en évitant le français peu naturel « parmi le Lévite ».
- source_word: לִפְנֵי
  choice: en présence de
  rationale: Dans cette procédure publique, לִפְנֵי présente les personnes comme témoins de l’inscription.
- source_word: הַשָּׂרִים
  choice: les hauts responsables
  rationale: שָׂרִים désigne des dignitaires ou responsables du royaume; ce choix évite que « princes » soit compris comme « fils du roi ».
- source_word: רָאשֵׁי הָאָבוֹת
  choice: les chefs des maisons ancestrales
  rationale: L’expression désigne les dirigeants des unités familiales ou claniques. « Maisons ancestrales » restitue la réalité sociale sans le calque moins clair « maisons des pères ».
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: des prêtres et des Lévites
  rationale: Les groupes précisent à quelles maisons ancestrales appartiennent les chefs mentionnés.
- source_word: בֵּית אָב אֶחָד
  choice: une maison ancestrale
  rationale: בֵּית אָב est une unité familiale et généalogique; le terme choisi est clair en français moderne tout en gardant la dimension ancestrale.
- source_word: אָחֻז
  choice: était prise
  rationale: Le participe passif de אחז signifie littéralement « prise ». Dans le contexte du tirage et de la répartition, la formulation garde l’image du texte sans imposer « choisie » ou « tirée au sort ».
- source_word: לְאֶלְעָזָר ... לְאִיתָמָר
  choice: pour Éléazar ... pour Itamar
  rationale: La préposition ל marque ici le rattachement ou l’attribution aux deux lignées sacerdotales; « pour » préserve cette souplesse.
- source_word: וְאָחֻז אָחֻז לְאִיתָמָר
  choice: puis une pour Itamar
  rationale: L’hébreu est elliptique et répète le participe. Le français supplée « une » d’après la première proposition et « puis » rend la succession, tandis que la note signale la formulation littérale et son ambiguïté.
