base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/031.yaml
  text: These also cast lots alongside their brothers[a], the sons of Aaron, before King David, Zadok, Ahimelech[b], and the heads of the fathers’ houses of the priests and of the Levites—the chief fathers’ houses as well as those of their younger brothers.
translation:
  language: fr
  text: 'Eux aussi tirèrent au sort, aux côtés de leurs frères, les fils d’Aaron[a], en présence du roi David, de Tsadok, d’Ahimélek et des chefs des maisons ancestrales des prêtres et des lévites : les maisons ancestrales des chefs aussi bien que celles de leurs frères cadets[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en correspondance avec leurs frères, les fils d’Aaron ». L’expression hébraïque peut évoquer ce qui est en face, ce qui correspond ou ce qui se tient aux côtés de quelque chose.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu, très condensé, dit littéralement : « les maisons ancestrales du chef, en correspondance avec son frère cadet ». Les formes au singulier peuvent avoir ici une valeur distributive : les branches principales et les branches cadettes correspondantes étaient considérées de la même manière lors du tirage au sort.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיַּפִּילוּ ... גּוֹרָלוֹת
  choice: tirèrent au sort
  rationale: Expression française naturelle et consacrée pour l’idiome hébreu signifiant recourir au tirage au sort.
- source_word: גַם הֵם
  choice: Eux aussi
  rationale: Renvoie aux groupes lévitiques mentionnés précédemment et souligne qu’ils participèrent eux aussi au tirage.
- source_word: לְעֻמַּת אֲחֵיהֶם בְּנֵי אַהֲרֹן
  choice: aux côtés de leurs frères, les fils d’Aaron
  rationale: Rend le parallélisme administratif exprimé par לְעֻמַּת sans imposer l’image spatiale plus étroite de personnes placées face à face; une note conserve les autres nuances possibles.
- source_word: לִפְנֵי
  choice: en présence de
  rationale: Exprime clairement le cadre public et officiel du tirage au sort.
- source_word: דָוִיד הַמֶּלֶךְ
  choice: le roi David
  rationale: Ordre usuel du titre et du nom en français.
- source_word: וְצָדוֹק וַאֲחִימֶלֶךְ
  choice: Tsadok, d’Ahimélek
  rationale: Translittérations françaises usuelles des noms hébreux, intégrées à l’énumération régie par « en présence de ».
- source_word: רָאשֵׁי הָאָבוֹת
  choice: les chefs des maisons ancestrales
  rationale: Désigne les responsables des unités familiales ou claniques; « maisons ancestrales » conserve la structure sociale ancienne tout en restant intelligible.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: des prêtres et des lévites
  rationale: Le complément identifie les groupes auxquels appartiennent les maisons ancestrales.
- source_word: אָבוֹת הָרֹאשׁ לְעֻמַּת אָחִיו הַקָּטָן
  choice: la maison ancestrale du chef fut mise sur le même plan que celle de son frère cadet
  rationale: Le texte hébreu est elliptique et emploie le singulier. Cette formulation rend le contraste entre chef et cadet ainsi que leur traitement parallèle, tout en signalant en note la littéralité et l’ambiguïté de la construction.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au récit historique. « Maisons ancestrales » maintient la réalité clanique du texte sans le calque moins transparent « maisons des pères ». Les deux notes préservent l’amplitude de לְעֻמַּת et l’ellipse du dernier membre.
