  text: אֵ֣לֶּה פְקֻדָּתָ֞/ם לַ/עֲבֹדָתָ֗/ם לָ/ב֤וֹא לְ/בֵית יְהוָה֙ כְּ/מִשְׁפָּטָ֔/ם בְּ/יַ֖ד אַהֲרֹ֣ן אֲבִי/הֶ֑ם כַּ/אֲשֶׁ֣ר צִוָּ֔/הוּ יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/019.yaml
  text: These were their appointed duties for their service[a], to enter the house of Yahweh according to their ordinance, under the hand of Aaron their father, as Yahweh, the God of Israel[b], had commanded him.
translation:
  language: fr
  text: 'Telles étaient les fonctions qui leur étaient assignées pour leur service : entrer dans la maison de Yahweh selon l’ordre qui leur était prescrit, sous l’autorité d’Aaron, leur père[a], comme Yahweh, le Dieu d’Israël, le lui avait ordonné.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par/sous la main d’Aaron ». L’expression peut désigner son administration, son autorité ou son rôle d’intermédiaire.'
    reason: Préserve la nuance de l’idiome hébreu בְּיַד sans alourdir le texte.
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: leurs fonctions assignées
  rationale: Le nom dérivé de פקד désigne ici les charges ou attributions fixées aux classes sacerdotales. « Fonctions assignées » exprime à la fois l’organisation officielle et les responsabilités concrètes.
- source_word: לַעֲבֹדָתָם
  choice: pour leur service
  rationale: Dans ce contexte sacerdotal, עֲבֹדָה désigne le service cultuel. « Service » est naturel en français et n’importe pas une terminologie ecclésiastique ultérieure.
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: ils devaient entrer dans la maison de Yahweh
  rationale: L’infinitif בוא indique ici l’entrée dans le sanctuaire en vue du service. La tournure avec « ils devaient » explicite naturellement en français le rapport entre les fonctions assignées et leur accomplissement.
- source_word: כְּמִשְׁפָּטָם
  choice: selon l’ordre qui leur était prescrit
  rationale: מִשְׁפָּט peut désigner une règle, une ordonnance ou une procédure fixée. Dans ce passage sur la rotation des classes sacerdotales, « ordre prescrit » rend clairement ce cadre réglementé.
- source_word: בְּיַד אַהֲרֹן
  choice: sous l’autorité d’Aaron
  rationale: L’expression littérale « par/sous la main d’Aaron » est un idiome d’administration ou d’autorité. L’équivalent français retenu communique directement ce sens.
- source_word: אֲבִיהֶם
  choice: leur père
  rationale: Le texte présente Aaron comme le père ancestral des prêtres. La traduction littérale conserve l’expression généalogique hébraïque.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: comme ... le lui avait ordonné
  rationale: Le suffixe masculin singulier renvoie naturellement à Aaron. Le plus-que-parfait marque en français le commandement divin antérieur qui fonde l’organisation décrite.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahweh, le Dieu d’Israël
  rationale: La mise en apposition reflète clairement la construction hébraïque, et le nom divin est translittéré « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Valeur de בְּיַד אַהֲרֹן dans l’organisation sacerdotale
  choice: sous l’autorité d’Aaron
  alternative: par la main d’Aaron
  rationale: L’idiome peut exprimer l’agence ou l’autorité. Ici, le contexte des règles données aux classes sacerdotales favorise le sens administratif, sans exclure qu’Aaron en ait été le médiateur.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure hébraïque, tout en rendant explicitement et naturellement les rapports syntaxiques. Aucun archaïsme n’est conservé pour le seul effet de style.
