base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/003.yaml
  text: David[a], with Zadok from the sons of Eleazar and Ahimelech from the sons of Ithamar, divided them according to their appointment in their service.
translation:
  language: fr
  text: David, avec Sadoc, issu de la lignée d’Éléazar, et Ahimélec, issu de la lignée d’Itamar, les répartit selon leurs charges[a] dans leur service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon les fonctions qui leur étaient assignées dans leur service ». Le terme hébreu peut évoquer une charge, une responsabilité de surveillance ou une affectation ordonnée.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: les répartit
  rationale: Le verbe חָלַק signifie directement « diviser, répartir ». Dans le contexte de l’organisation des groupes sacerdotaux, « répartit » exprime naturellement une division ordonnée sans ajouter explicitement la notion de classes.
- source_word: וְצָדוֹק
  choice: avec Tsadok
  rationale: La conjonction hébraïque est rendue idiomatiquement par « avec », qui montre que Tsadok participe avec David à cette répartition.
- source_word: מִן בְּנֵי אֶלְעָזָר
  choice: l’un des descendants d’Éléazar
  rationale: L’expression « parmi les fils d’Éléazar » désigne ici l’appartenance à une lignée. « L’un des descendants » est clair et naturel en français moderne.
- source_word: וַאֲחִימֶלֶךְ
  choice: et Ahimélek
  rationale: Le nom propre est transcrit selon un usage français courant.
- source_word: מִן בְּנֵי אִיתָמָר
  choice: l’un des descendants d’Itamar
  rationale: Comme dans la proposition parallèle, l’expression identifie Ahimélek comme membre de la lignée d’Itamar.
- source_word: לִפְקֻדָּתָם
  choice: selon les fonctions qui leur étaient assignées
  rationale: פְּקֻדָּה peut évoquer une charge, une responsabilité, une surveillance ou une affectation ordonnée. Cette formulation convient au contexte administratif tout en évitant de préciser excessivement la nature institutionnelle de ces fonctions.
- source_word: בַּעֲבֹדָתָם
  choice: dans leur service
  rationale: עֲבֹדָה désigne le travail ou le service, ici le service sacerdotal. « Service » conserve ce sens cultuel sans recourir au terme plus interprétatif « ministère ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les liens généalogiques sont exprimés par « descendants » plutôt que par le calque « fils », tandis que le vocabulaire du service sacerdotal reste sobre et non confessionnel.
