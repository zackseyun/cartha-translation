lexical_decisions:
- source_word: לְמַחְלִי
  choice: Pour Mahli
  rationale: Le לְ préfixé sert vraisemblablement à introduire un élément ou un thème dans cette liste généalogique. « Pour Mahli » conserve cette structure en français naturel.
- source_word: אֶלְעָזָר
  choice: Éléazar
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: וְלֹא הָיָה לוֹ
  choice: qui n’eut pas
  rationale: L’expression hébraïque signifie littéralement qu’il n’y avait pas de fils « à lui ». La proposition relative rattache naturellement l’information à Éléazar en français, tandis que « n’eut pas » rend l’idée de possession dans le cadre généalogique.
- source_word: בָּנִים
  choice: de fils
  rationale: בָּנִים désigne ici des fils, donnée pertinente dans une généalogie, plutôt que les enfants en général.
