  rationale: Le préfixe לְ indique de nouveau l’attribution. Le nom propre hébreu est translittéré sans chercher à en traduire le sens.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: le dix-huitième
  rationale: Le contexte de la série des lots impose une lecture ordinale naturelle en français.
