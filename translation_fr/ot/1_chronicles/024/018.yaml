lexical_decisions:
- source_word: לִדְלָיָהוּ
  choice: pour Delaya
  rationale: Le préfixe ל marque ici l’attribution du lot ou de la classe sacerdotale. « pour » rend naturellement cette fonction dans une liste. Le nom est translittéré sous la forme française Delaya.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים
  choice: le vingt-troisième
  rationale: La construction cardinale littérale « trois et vingt » indique, dans cette suite de lots sacerdotaux, le rang ordinal.
- source_word: לְמַעַזְיָהוּ
  choice: pour Maazia
  rationale: Comme dans le premier membre, le préfixe ל exprime l’attribution. « pour » convient au style énumératif, et le nom est translittéré sous une forme française claire.
- source_word: אַרְבָּעָה וְעֶשְׂרִים
  choice: le vingt-quatrième
  rationale: La forme cardinale littérale « quatre et vingt » a ici une valeur ordinale dans la succession des classes.
