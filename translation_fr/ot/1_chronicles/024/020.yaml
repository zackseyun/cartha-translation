  text: וְ/לִ/בְנֵ֥י לֵוִ֖י הַ/נּוֹתָרִ֑ים לִ/בְנֵ֤י עַמְרָם֙ שֽׁוּבָאֵ֔ל לִ/בְנֵ֥י שׁוּבָאֵ֖ל יֶחְדְּיָֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/020.yaml
  text: 'And for the remaining sons of Levi: for the sons of Amram[a], Shubael; for the sons of Shubael[b], Jehdeiah.'
translation:
  language: fr
  text: 'Quant aux autres fils de Lévi : parmi les fils d’Amram, Shoubaël[a] ; parmi les fils de Shoubaël, Yehdeyahu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans cette liste elliptique, les noms désignent vraisemblablement les chefs ou représentants des différentes branches familiales.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי לֵוִי הַנּוֹתָרִים
  choice: Quant aux autres fils de Lévi
  rationale: La formule introduit la suite de la liste administrative. « Quant aux » rend naturellement la transition, tandis que « autres » exprime ici ceux qui restent à mentionner.
- source_word: לִבְנֵי עַמְרָם
  choice: parmi les fils d’Amram
  rationale: Dans cette liste elliptique, la préposition introduit une branche familiale dont un représentant est ensuite nommé. « Parmi » explicite sobrement cette relation sans ajouter de fonction absente de l’hébreu.
- source_word: שׁוּבָאֵל
  choice: Shoubaël
  rationale: Transcription française moderne du nom propre hébreu, avec le tréma signalant que les voyelles se prononcent séparément.
- source_word: לִבְנֵי שׁוּבָאֵל
  choice: parmi les fils de Shoubaël
  rationale: La répétition conserve la structure généalogique et administrative du texte hébreu.
- source_word: יֶחְדְּיָהוּ
  choice: Yehdeya
  rationale: Transcription française lisible du nom hébreu, qui en reflète les principales consonnes et évite une graphie française archaïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La formulation garde la brièveté d’une liste administrative tout en rendant explicite, par « parmi », le rapport implicite entre chaque branche familiale et le nom qui suit.
