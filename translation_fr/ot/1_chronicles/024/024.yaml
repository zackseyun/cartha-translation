lexical_decisions:
- source_word: בְּנֵי
  choice: Fils de
  rationale: Le pluriel construit de בֵּן introduit ici une formule généalogique. « Fils de » conserve directement la forme concise de la liste.
- source_word: עֻזִּיאֵל
  choice: Ouzziel
  rationale: Translittération française usuelle du nom propre, avec « ou » pour le son initial /u/.
- source_word: מִיכָה
  choice: Michée
  rationale: Forme française biblique reconnue du nom propre hébreu מִיכָה.
- source_word: לִ/בְנֵי
  choice: parmi les fils de
  rationale: Dans cette liste, le ל préfixé relie le sous-groupe à son ancêtre. « Parmi les fils de » rend naturellement cette relation sans lui donner une valeur de destination artificielle.
- source_word: שמור
  choice: Shamir
  rationale: Nom propre rendu par une translittération française lisible et conventionnelle. La graphie consonantique transmise permet aussi la forme « Shemor », signalée en note.
