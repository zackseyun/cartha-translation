  yaml_path: translation/ot/1_chronicles/024/024.yaml
  text: 'The sons of Uzziel: Micah[a]; of the sons of Micah: Shamir.'
translation:
  language: fr
  text: 'Fils d’Ouzziel : Michée ; fils de Michée : Schamir[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Shemor » ; la graphie hébraïque שמור du nom peut être translittérée de l’une ou l’autre manière.
