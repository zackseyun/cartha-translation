  text: 'And the sons of Shecaniah: Shemaiah. And the sons of Shemaiah: Hattush[a], Igal, Bariah, Neariah, and Shaphat—six.'
translation:
  language: fr
  text: 'Fils de Shekania : Shemaïa. Fils de Shemaïa : Hattoush[a], Yigal, Bariah, Nearia et Shaphat — six en tout.'
  philosophy: optimal-equivalence
  footnotes:
