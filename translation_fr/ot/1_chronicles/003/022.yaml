lexical_decisions:
- source_word: וּבְנֵי
  choice: Fils de
  rationale: Dans cette formule généalogique, le pluriel construit בְּנֵי désigne directement les fils; le français omet naturellement la conjonction initiale dans une liste.
- source_word: שְׁכַנְיָה
  choice: Shekania
  rationale: Translittération française moderne du nom propre hébreu, avec k pour כ.
- source_word: שְׁמַעְיָה
  choice: Shemaïa
  rationale: Translittération française lisible du nom propre; le tréma distingue les voyelles finales.
- source_word: חַטּוּשׁ
  choice: Hattoush
  rationale: Translittération adaptée aux conventions graphiques françaises, où « ou » rend le son /u/.
- source_word: יִגְאָל
  choice: Yigal
  rationale: Le y initial représente directement le yod hébreu et évite une prononciation française ambiguë de « Igal ».
- source_word: בָרִיחַ
  choice: Bariah
  rationale: Suit le texte consonantique massorétique présent, sans le remplacer par le nom plus familier Beria.
- source_word: נְעַרְיָה
  choice: Nearia
  rationale: Translittération française claire du nom propre, sans h final non prononcé.
- source_word: שָׁפָט
  choice: Shaphath
  rationale: Translittération française traditionnelle et intelligible du nom propre.
- source_word: שִׁשָּׁה
  choice: six en tout
  rationale: Le nombre cardinal est conservé explicitement malgré les cinq noms visibles; « en tout » exprime naturellement sa fonction récapitulative.
