  text: All these were David’s sons[a], besides the sons of the concubines; and Tamar was their sister.
translation:
  language: fr
  text: Tous ceux-là étaient fils de David[a], sans compter les fils des concubines. Tamar était leur sœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tous étaient fils de David, à part les fils des concubines. » L’expression hébraïque peut soit exclure ces fils du groupe qui vient d’être récapitulé, soit les mentionner comme un groupe supplémentaire qui ne figure pas dans la liste principale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל בְּנֵי דָוִיד
  choice: Tous ceux-là étaient fils de David
  rationale: כֹּל récapitule les personnes précédemment nommées. En français, « Tous ceux-là » rend naturellement cette fonction récapitulative; la copule « étaient » est ajoutée conformément à l’usage français dans cette proposition nominale.
- source_word: מִלְּבַד
  choice: sans compter
  rationale: La locution peut marquer l’exception ou ce qui demeure hors du groupe principal. « Sans compter » conserve cette nuance sans imposer une exclusion absolue.
- source_word: בְּנֵי פִילַגְשִׁים
  choice: les fils des concubines
  rationale: La traduction garde le masculin pluriel de בְּנֵי et le terme social précis « concubines », sans ajouter « de David », que le contexte suffit à indiquer.
- source_word: וְתָמָר אֲחוֹתָם
  choice: Tamar était leur sœur
  rationale: La proposition hébraïque est nominale; le français exige naturellement « était ». Une nouvelle phrase rend avec clarté l’ajout généalogique introduit par וְ.
