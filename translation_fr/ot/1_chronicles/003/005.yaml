base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/005.yaml
  text: 'These were born to him in Jerusalem: Shimea[a], Shobab, Nathan[b], and Solomon—four by Bath-shua daughter of Ammiel.'
translation:
  language: fr
  text: 'Voici ceux qui lui naquirent à Jérusalem : Shiméa[a], Shobab, Nathan et Salomon — quatre de Bath-Shoua[b], fille d’Ammiel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le passage parallèle de 2 Samuel 5.14, ce nom apparaît sous la forme Shammoua.
    reason: textual_variant
  - marker: b
    text: Dans 2 Samuel 11.3 et les passages apparentés, elle est appelée Bethsabée, fille d’Éliam.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici ceux
  rationale: Cette formulation introduit naturellement en français le nouveau groupe de la généalogie tout en conservant la valeur démonstrative de l’hébreu.
- source_word: נוּלְּדוּ לוֹ
  choice: qui lui naquirent
  rationale: Le passif du verbe ילד et le pronom renvoyant à David sont conservés sans répéter son nom, déjà fourni par le contexte.
- source_word: בִּירוּשָׁלָיִם
  choice: à Jérusalem
  rationale: Expression locative française naturelle indiquant le lieu de naissance.
- source_word: שִׁמְעָא
  choice: Shiméa
  rationale: Transcrit la forme propre aux Chroniques sans l’harmoniser avec Shammoua dans le passage parallèle de 2 Samuel.
- source_word: שׁוֹבָב
  choice: Shobab
  rationale: Transcription française claire du nom propre hébreu.
- source_word: נָתָן
  choice: Nathan
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française conventionnelle du nom royal, adaptée à un lectorat général.
- source_word: אַרְבָּעָה
  choice: soit quatre fils
  rationale: Le nombre récapitule les quatre personnes énumérées; « fils » explicite naturellement en français leur relation généalogique, claire dans le contexte.
- source_word: לְבַת שׁוּעַ
  choice: de Bath-Shoua
  rationale: Dans « quatre fils de Bath-Shoua », la préposition française exprime naturellement la maternité tout en suivant le nom donné par le texte des Chroniques.
- source_word: בַּת עַמִּיאֵל
  choice: fille d’Ammiel
  rationale: Rend directement l’expression hébraïque de filiation.
theological_decisions:
- issue: Forme du nom de la femme de David et de son père dans les Chroniques par rapport au parallèle de Samuel
  choice: Bath-Shoua, fille d’Ammiel
  alternative: Bethsabée, fille d’Éliam
  rationale: Le texte hébreu des Chroniques porte Bath-Shoua et Ammiel. La traduction suit donc le texte source sans l’harmoniser avec 2 Samuel, tout en signalant la forme parallèle en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe généalogique reste concise; les formes propres au texte des Chroniques sont maintenues, tandis que les divergences des passages parallèles sont indiquées sans harmonisation.
