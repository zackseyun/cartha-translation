- source_word: בְּנוֹ
  choice: son fils
  rationale: Le nom בֵּן avec le suffixe de troisième personne du masculin singulier signifie directement « son fils ». Dans une généalogie, il peut parfois désigner un descendant plus éloigné, mais la succession royale énumérée ici permet de conserver le sens immédiat.
