  text: וּ/בֶן חֲנַנְיָ֖ה פְּלַטְיָ֣ה וִ/ישַֽׁעְיָ֑ה בְּנֵ֤י רְפָיָה֙ בְּנֵ֣י אַרְנָ֔ן בְּנֵ֥י עֹבַדְיָ֖ה בְּנֵ֥י שְׁכַנְיָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/021.yaml
  text: 'And the sons of Hananiah: Pelatiah and Jeshaiah; the sons of Rephaiah[a], the sons of Arnan, the sons of Obadiah, the sons of Shecaniah.'
translation:
  language: fr
  text: 'Et le fils de Hanania : Pelatia et Yeshaya ; les fils de Rephaya[a], les fils d’Arnân, les fils d’Abdias, les fils de Shekania.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La syntaxe hébraïque est condensée et quelque peu difficile. Le texte dit littéralement : « Et le fils de Hanania : Pelatia et Yeshaya ; les fils de Rephaya, les fils d’Arnân, les fils d’Abdias, les fils de Shekania. » Certains comprennent une partie de cette suite au sens plus large d’une lignée de descendants plutôt que de fils immédiats.'
    reason: Signaler le singulier surprenant du texte hébreu et préserver l’ambiguïté sur la portée généalogique de « fils ».
lexical_decisions:
- source_word: וּבֶן
  choice: Les fils de
  rationale: Le texte massorétique porte littéralement le singulier « et le fils de », mais il est suivi de deux noms coordonnés. Le pluriel rend en français la relation généalogique apparente sans masquer la difficulté, signalée en note.
- source_word: חֲנַנְיָה
  choice: Hanania
  rationale: Nom propre translittéré sous une forme française claire et usuelle.
- source_word: פְּלַטְיָה וִישַׁעְיָה
  choice: Pelatia et Yeshaya
  rationale: Les deux noms propres sont translittérés distinctement ; « Yeshaya » évite de l’identifier sans nécessité au prophète Ésaïe.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette généalogie, l’expression désigne les fils ou, plus largement, les descendants. La traduction formelle « les fils de » conserve la structure répétitive de l’hébreu.
- source_word: רְפָיָה
  choice: Rephaya
  rationale: Translittération française du nom propre hébreu.
- source_word: אַרְנָן
  choice: Arnân
  rationale: Translittération française du nom propre, avec accent circonflexe indiquant la voyelle finale longue dans l’usage biblique français.
- source_word: עֹבַדְיָה
  choice: Abdias
  rationale: Forme française biblique traditionnelle et immédiatement reconnaissable de ce nom propre.
- source_word: שְׁכַנְיָה
  choice: Shekania
  rationale: Translittération française transparente du nom propre hébreu.
theological_decisions:
- issue: Nature exacte des relations dans la suite généalogique
  choice: Conserver « les fils de » à chaque étape
  alternative: Traduire par « les descendants de » ou présenter toute la série comme une succession directe de générations
  rationale: La syntaxe hébraïque est condensée et ne permet pas d’établir avec certitude que chaque relation concerne des fils immédiats. La formulation retenue préserve le langage du texte, tandis que la note maintient ouverte la possibilité d’une lignée de descendants.
translation_notes:
  register: Français moderne, sobre et digne. La répétition de « les fils de » reproduit volontairement le rythme généalogique de l’hébreu. Les noms sont adaptés aux conventions françaises sans harmonisation doctrinale.
