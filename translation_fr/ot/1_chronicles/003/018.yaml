  text: Malkiram, Pedaya, Shénatsar, Yekamia, Hoshama et Nedabia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכִּירָם
  choice: Malkiram
  rationale: Nom propre transcrit directement d’après l’hébreu; « k » représente naturellement כּ en français.
- source_word: פְדָיָה
  choice: Pedaya
  rationale: Nom propre transcrit selon les usages français, avec « y » pour le yod de l’élément final.
- source_word: שֶׁנְאַצַּר
  choice: Shénatsar
  rationale: La transcription française rend שׁ par « sh », la voyelle initiale par « é » et צּ par « ts »; elle reste lisible sans effacer le redoublement indiqué par la vocalisation.
- source_word: יְקַמְיָה
  choice: Yekamia
  rationale: Le yod initial est rendu par « Y » en français, et la forme suit au plus près la vocalisation hébraïque.
- source_word: הוֹשָׁמָע
  choice: Hoshama
  rationale: Transcription lisible du nom hébreu, avec « sh » pour שׁ.
- source_word: נְדַבְיָה
  choice: Nedabia
  rationale: Transcription française naturelle du nom propre et de son élément final.
- source_word: וּ / וְ
  choice: et
  rationale: Les conjonctions préfixées relient les noms; en français naturel, des virgules séparent la série et « et » précède le dernier nom.
