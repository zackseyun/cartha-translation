base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/010.yaml
  text: And the son of Solomon was Rehoboam; Abijah his son[a], Asa his son, Jehoshaphat his son.
translation:
  language: fr
  text: Le fils de Salomon fut Roboam ; Abiya, son fils[a] ; Asa, son fils ; Josaphat, son fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Abiya ». Dans 1–2 Rois, ce même roi est aussi désigné par la variante « Abiyam ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֶן שְׁלֹמֹה
  choice: Le fils de Salomon
  rationale: La construction introduit le maillon suivant de la généalogie. En français, l’article défini suffit naturellement ici ; la ponctuation conserve l’enchaînement généalogique sans alourdir la phrase par un « et » initial.
- source_word: רְחַבְעָם
  choice: Roboam
  rationale: Forme française traditionnelle et couramment reconnue du nom hébreu.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Transcription française claire de la forme אֲבִיָּה employée par le Chroniste, distincte de la forme Abiyam attestée dans les livres des Rois.
- source_word: בְנ/וֹ
  choice: son fils
  rationale: Le nom muni du suffixe masculin singulier marque la filiation et la succession. La répétition de « son fils » reproduit la cadence généalogique de l’hébreu.
- source_word: אָסָא
  choice: Asa
  rationale: Transcription française usuelle du nom hébreu.
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
