  text: the third[a], Absalom son of Maacah, daughter of Talmai king of Geshur; the fourth, Adonijah son of Haggith.
translation:
  language: fr
  text: le troisième, Absalom, fils de Maaka, elle-même fille de Talmaï, roi de Gueshour[a] ; le quatrième, Adonias, fils de Hagguit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « petite-fille de Talmaï », car, dans un contexte généalogique, « fille » peut parfois désigner une descendante plus éloignée. L’hébreu dit le plus directement : « fille de Talmaï, roi de Gueshour ».'
    reason: Alternative lexicale préservant l’étendue possible du terme généalogique hébreu.
lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: le troisième
  rationale: L’ordinal défini poursuit l’énumération des fils de David commencée au verset précédent.
- source_word: לְאַבְשָׁלוֹם
  choice: Absalom
  rationale: Nom propre rendu selon sa forme française biblique usuelle ; la préposition לְ introduit ici le membre correspondant de la liste.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette généalogie, le terme exprime directement la filiation.
- source_word: מַעֲכָה
  choice: Maaka
  rationale: Translittération française claire du nom propre hébreu.
- source_word: בַּת
  choice: fille de
  rationale: Le sens direct est « fille de » ; un emploi généalogique plus large reste possible et est signalé en note.
- source_word: תַּלְמַי
  choice: Talmaï
  rationale: Translittération française du nom propre, avec tréma pour indiquer que les voyelles finales se prononcent séparément.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: roi de Gueshour
  rationale: La chaîne construite indique que Talmaï règne sur Gueshour.
- source_word: הָרְבִיעִי
  choice: le quatrième
  rationale: L’ordinal défini continue explicitement l’énumération.
- source_word: אֲדֹנִיָּה
  choice: Adonias
  rationale: Forme française biblique usuelle du nom propre.
- source_word: חַגִּית
  choice: Hagguit
  rationale: Translittération française claire du nom propre hébreu.
