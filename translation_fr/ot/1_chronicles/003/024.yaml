  text: וּ/בְנֵ֣י אֶלְיוֹעֵינַ֗י הדיוהו וְ/אֶלְיָשִׁ֡יב וּ/פְלָיָ֡ה וְ֠/עַקּוּב וְ/יוֹחָנָ֧ן וּ/דְלָיָ֛ה וַ/עֲנָ֖נִי שִׁבְעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/024.yaml
  text: 'And the sons of Elyoenai: Hodaviah[a], Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani—seven.'
translation:
  language: fr
  text: 'Les fils d’Élyoénaï : Hodavia[a], Éliashib, Pelaya, Akkoub, Yohanan, Delaya et Anani — sept en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La graphie hébraïque de ce premier nom est inhabituelle. « Hodavia » suit l’identification conventionnelle la plus probable ; d’autres rendus sont possibles, notamment « Hodia » ou une translittération plus proche de la graphie, telle que « Hodevahou ».
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Fils de
  rationale: Dans une généalogie, בְּנֵי désigne normalement les « fils de ». Le français omet naturellement la conjonction initiale dans ce verset qui poursuit une liste.
- source_word: אֶלְיוֹעֵינַי
  choice: Élyoénaï
  rationale: Translittération française du nom propre, qui suit de près la vocalisation hébraïque.
- source_word: הדיוהו
  choice: Hodavia
  rationale: Le graphisme hébreu transmis est inhabituel. « Hodavia » retient l’identification conventionnelle la plus probable sous une forme adaptée au français, tout en signalant l’incertitude en note.
- source_word: וְאֶלְיָשִׁיב
  choice: Éliashib
  rationale: Translittération française claire du nom propre hébreu.
- source_word: וּפְלָיָה
  choice: Pelaya
  rationale: Translittération française qui représente la finale hébraïque -yāh sans imposer une graphie anglaise.
- source_word: וְעַקּוּב
  choice: Akkoub
  rationale: La graphie française « ou » rend la voyelle /u/, et le double k reflète la consonne redoublée du texte hébreu.
- source_word: וְיוֹחָנָן
  choice: Yohanan
  rationale: Translittération directe et intelligible de la forme hébraïque, distincte des variantes théophores plus longues.
- source_word: וּדְלָיָה
  choice: Delaya
  rationale: Translittération française du nom propre avec représentation naturelle de la finale -yāh.
- source_word: וַעֲנָנִי
  choice: et Anani
  rationale: Le nom propre est translittéré, et la conjonction est rendue devant le dernier élément conformément à l’usage français.
- source_word: שִׁבְעָה
  choice: sept en tout
  rationale: Le nombre récapitule explicitement les fils énumérés. « En tout » exprime naturellement en français sa fonction de total généalogique sans ajouter de contenu substantiel.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne, adapté au style condensé d’une généalogie. Les noms sont translittérés selon des conventions phonétiques françaises plutôt qu’au moyen de graphies anglaises. Le tiret met en relief le total final.
