  text: אֲמַצְיָ֧הוּ בְנ֛/וֹ עֲזַרְיָ֥ה בְנ֖/וֹ יוֹתָ֥ם בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/012.yaml
  text: Amaziah his son[a], Azariah his son, Jotham his son.
translation:
  language: fr
  text: Amatsia, son fils ; Azaria[a], son fils ; Yotam, son fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce roi est aussi appelé Ozias ailleurs.
    reason: Signaler l’autre nom biblique du même roi sans remplacer la forme Azaria présente dans le texte hébreu.
lexical_decisions:
- source_word: אֲמַצְיָהוּ
  choice: Amatsia
  rationale: Nom propre rendu selon la forme française biblique courante, sans traduire son sens étymologique.
- source_word: בְנוֹ
  choice: son fils
  rationale: Le nom בֵּן avec le suffixe masculin singulier signifie directement « son fils ». La formule est conservée à chacune de ses trois occurrences, même si certaines généalogies bibliques peuvent parfois abréger une lignée.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Le texte hébreu porte explicitement עֲזַרְיָה. « Ozias », autre nom sous lequel ce roi est connu, n’est donc pas substitué au nom présent dans ce verset.
- source_word: יוֹתָם
  choice: Yotam
  rationale: Transcription française moderne du nom propre hébreu, avec une graphie qui représente clairement sa consonne initiale.
theological_decisions:
- issue: Portée de la formule généalogique בְנוֹ
  choice: Conserver « son fils » aux trois occurrences.
  alternative: Employer « son descendant » pour tenir compte d’une éventuelle généalogie abrégée.
  rationale: Le texte répète expressément בְנוֹ, « son fils ». Rien dans ce verset n’impose d’élargir le terme à « descendant » ; la formulation directe préserve donc la transparence du texte sans trancher plus largement la question des généalogies télescopées.
- issue: Identification d’Azaria avec Ozias
  choice: Garder « Azaria » dans le texte et signaler « Ozias » en note.
  alternative: Remplacer « Azaria » par « Ozias » dans le corps du texte.
  rationale: La forme du texte source est Azaria. La remplacer par Ozias harmoniserait le verset avec d’autres passages au lieu de traduire sa formulation propre.
translation_notes:
  register: Formulation généalogique brève et solennelle, ponctuée par des points-virgules pour rendre lisible la succession. Les noms suivent des formes françaises modernes et reconnaissables. Le marqueur de note est placé immédiatement après « Azaria », auquel la note se rapporte.
