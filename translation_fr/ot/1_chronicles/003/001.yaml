  text: וְ/אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י דָויִ֔ד אֲשֶׁ֥ר נֽוֹלַד ל֖/וֹ בְּ/חֶבְר֑וֹן הַ/בְּכ֣וֹר אַמְנֹ֗ן לַ/אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית שֵׁנִי֙ דָּנִיֵּ֔אל לַ/אֲבִיגַ֖יִל הַֽ/כַּרְמְלִֽית־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/001.yaml
  text: 'These were David’s sons who were born to him in Hebron: the firstborn[a], Amnon, by Ahinoam the Jezreelite; the second, Daniel, by Abigail the Carmelite.'
translation:
  language: fr
  text: 'Voici les fils de David qui lui naquirent à Hébron : le premier-né[a], Amnon, né d’Ahinoam la Jizréélite ; le deuxième, Daniel, né d’Abigaïl la Carmélite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la liste parallèle de 2 Samuel 3.3, ce fils est appelé Kiléab plutôt que Daniel.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Introduit naturellement une nouvelle section généalogique en français tout en conservant la force présentative du démonstratif hébreu.
- source_word: הָיוּ בְּנֵי דָוִיד
  choice: les fils de David
  rationale: La tournure présentative française avec « Voici » rend naturellement l’ensemble de la proposition; « fils » maintient la référence masculine propre à la généalogie.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: qui lui naquirent
  rationale: Conserve la relation exprimée par לוֹ et la perspective de la naissance, sans reformuler le texte en engendrement actif.
- source_word: בְּחֶבְרוֹן
  choice: à Hébron
  rationale: « À » est la préposition française normale devant un nom de ville.
- source_word: הַבְּכוֹר
  choice: le premier-né
  rationale: Préserve la valeur de statut généalogique de בכור, au-delà du simple ordre d’âge.
- source_word: אַמְנוֹן
  choice: Amnon
  rationale: Transcription française usuelle du nom propre.
- source_word: לַאֲחִינֹעַם הַיִּזְרְעֵאלִית
  choice: fils d’Ahinoam de Jizréel
  rationale: Dans cette formule généalogique, לְ introduit la mère; « fils de » exprime clairement et naturellement la filiation maternelle, tandis que le gentilé féminin est rendu par l’origine géographique.
- source_word: שֵׁנִי
  choice: le deuxième
  rationale: Rend explicitement l’ordinal qui structure la liste.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Conserve la forme du nom attestée ici dans les Chroniques, sans l’harmoniser avec le passage parallèle.
- source_word: לַאֲבִיגַיִל הַכַּרְמְלִית
  choice: fils d’Abigaïl du Carmel
  rationale: Rend la filiation maternelle et comprend le gentilé comme une indication d’origine liée au Carmel.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe présentative « Voici » convient à l’ouverture d’une liste généalogique. « Qui lui naquirent » garde une légère solennité biblique sans devenir archaïque. Les gentilés féminins sont rendus par des indications géographiques naturelles en français.
