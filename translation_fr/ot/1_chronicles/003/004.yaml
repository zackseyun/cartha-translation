base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/004.yaml
  text: Six were born to him in Hebron, and he reigned there seven years and six months; and in Jerusalem he reigned thirty-three years.
translation:
  language: fr
  text: Six fils lui naquirent à Hébron. Il y régna sept ans et six mois, et il régna trente-trois ans à Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁשָּׁה נוֹלַד לוֹ
  choice: Six fils lui naquirent
  rationale: Le passif de ילד avec ל signifie naturellement « naquirent à/lui ». Le nom « fils », sous-entendu par la liste précédente, est ajouté pour obtenir une phrase française claire sans remplacer le passif par une formulation plus interprétative comme « il engendra ».
- source_word: בְחֶבְרוֹן
  choice: à Hébron
  rationale: La préposition locative ב devant un nom de ville se rend naturellement par « à » en français.
- source_word: וַיִּמְלָךְ שָׁם
  choice: Il y régna
  rationale: Dans ce contexte, מלך désigne l'exercice de la royauté; « régna » est précis, et « y » reprend naturellement Hébron.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: sept ans et six mois
  rationale: Traduction française directe et idiomatique de la durée.
- source_word: וּשְׁלֹשִׁים וְשָׁלוֹשׁ שָׁנָה
  choice: trente-trois ans
  rationale: L'ordre numérique hébreu est rendu selon l'usage naturel du français moderne.
- source_word: מָלַךְ בִּירוּשָׁלִָם
  choice: il régna trente-trois ans à Jérusalem
  rationale: Cette formulation conserve le sens locatif et la durée tout en suivant un ordre fluide en français.
