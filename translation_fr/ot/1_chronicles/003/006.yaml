lexical_decisions:
- source_word: יִבְחָר
  choice: Yibhar
  rationale: Nom propre translittéré directement de l’hébreu. En français, « Y » représente clairement le yod initial, tandis que « bh » permet de refléter la réalisation spirante du beth sans confondre le nom avec le verbe français « ibare ».
- source_word: אֱלִישָׁמָע
  choice: Élishama
  rationale: Translittération française lisible du nom propre; l’accent initial guide la prononciation, et l’ayin final n’est pas représenté dans la forme courante.
- source_word: אֱלִיפָלֶט
  choice: Élifélet
  rationale: Translittération adaptée aux conventions graphiques françaises, avec accents pour une lecture naturelle; le nom n’est pas traduit.
- source_word: וְ
  choice: et
  rationale: 'Les conjonctions préfixées coordonnent les noms. En français naturel, seule la dernière est exprimée: « A, B et C ».'
