  yaml_path: translation/ot/1_chronicles/003/020.yaml
  text: and Hashubah[a], Ohel, Berekiah, Hasadiah[b], and Jushab-hesed—five.
translation:
  language: fr
  text: 'Hashouba, Ohel, Bérékia, Hasadia et Youshab-Hésed[a] : cinq[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En hébreu, ce nom est écrit en deux éléments : « Youshab Hésed ». Il s’agit vraisemblablement d’un seul nom personnel composé.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte simplement « cinq », formule elliptique qui récapitule les cinq noms de la liste.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲשֻׁבָה
  choice: ainsi que Hashouba
  rationale: Le nom propre est translittéré. La conjonction initiale relie ce fragment à la liste du verset précédent ; « ainsi que » rend ce lien plus naturellement en français qu’un simple « et » en tête de verset.
- source_word: וָ/אֹהֶל
  choice: Ohel
  rationale: Le terme fonctionne ici comme un nom de personne et non comme le nom commun « tente » ; il est donc translittéré.
- source_word: וּ/בֶרֶכְיָה
  choice: Bérékia
  rationale: Translittération française lisible du nom hébreu, avec des accents indiquant naturellement la prononciation.
- source_word: וַֽ/חֲסַדְיָה
  choice: Hasadia
  rationale: Le nom propre est translittéré sans traduire ses éléments théophores.
- source_word: י֥וּשַׁב חֶ֖סֶד
  choice: Youshab-Hésed
  rationale: Les deux éléments graphiquement distincts en hébreu sont compris comme un seul nom personnel composé. Le trait d’union le signale clairement au lecteur français.
- source_word: חָמֵשׁ
  choice: cinq en tout
  rationale: Le cardinal résume les cinq noms. « En tout » explicite en français la fonction récapitulative du mot sans modifier son sens.
