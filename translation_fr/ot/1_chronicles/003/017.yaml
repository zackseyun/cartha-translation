source:
  edition: WLC
  text: וּ/בְנֵי֙ יְכָנְיָ֣ה אַסִּ֔ר שְׁאַלְתִּיאֵ֖ל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/017.yaml
  text: 'And the sons of Jeconiah: Assir[a], Shealtiel his son.'
translation:
  language: fr
  text: 'Et les fils de Yekonia : Assir[a], Shealtiel, son fils.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Et les fils de Yekonia le captif : Shealtiel, son fils. » Le mot hébreu אַסִּר peut être compris soit comme le nom propre « Assir », soit comme le nom commun « captif » ou « prisonnier ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: Et les fils de
  rationale: La conjonction ו est conservée par « Et » pour maintenir l’enchaînement généalogique, et בְנֵי reçoit son sens généalogique ordinaire, « les fils de ».
- source_word: יְכָנְיָה
  choice: Yekonia
  rationale: Translittération française directe du nom hébreu, sous une forme claire et actuelle.
- source_word: אַסִּר
  choice: Assir
  rationale: Dans cette liste généalogique, le terme peut être compris comme un nom propre. Toutefois, sa forme est identique au nom commun signifiant « captif » ou « prisonnier » ; cette ambiguïté réelle est conservée en note.
- source_word: שְׁאַלְתִּיאֵל
  choice: Shealtiel
  rationale: Translittération française du nom hébreu, proche de sa forme source et reconnaissable dans la tradition biblique.
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le suffixe pronominal exprime la possession. « Son fils » est la formulation française naturelle, bien que le référent syntaxique puisse paraître moins explicite dans cette suite de noms.
theological_decisions:
- issue: Faut-il comprendre אַסִּר comme le nom propre « Assir » ou comme l’appellatif « le captif » ?
  choice: Le retenir comme nom propre, « Assir », dans le texte principal.
  alternative: '« Et les fils de Yekonia le captif : Shealtiel, son fils. »'
  rationale: La vocalisation massorétique et la structure de la généalogie permettent la lecture comme nom propre, mais l’hébreu autorise aussi la lecture comme nom commun. La note préserve cette ambiguïté sans imposer une résolution doctrinale ou historique.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la brièveté de la généalogie hébraïque ; les noms sont translittérés au plus près de l’hébreu, et l’ambiguïté de אַסִּר est explicitement signalée.
