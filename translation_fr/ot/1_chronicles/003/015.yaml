  text: וּ/בְנֵי֙ יֹאשִׁיָּ֔הוּ הַ/בְּכוֹר֙ יוֹחָנָ֔ן הַ/שֵּׁנִ֖י יְהוֹיָקִ֑ים הַ/שְּׁלִשִׁי֙ צִדְקִיָּ֔הוּ הָ/רְבִיעִ֖י שַׁלּֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/015.yaml
  text: 'And the sons of Josiah: the firstborn[a], Johanan; the second, Jehoiakim; the third, Zedekiah; the fourth, Shallum.'
translation:
  language: fr
  text: 'Fils de Josias : le premier-né, Yohanân ; le deuxième, Joïakim ; le troisième, Sédécias ; le quatrième, Shalloum[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shalloum est généralement identifié à Joachaz en 2 Rois 23.30-34 et en Jérémie 22.11 ; dans cette généalogie de Josias, le Chroniste conserve le nom Shalloum.
    reason: Renvoi permettant de signaler l’identification courante sans harmoniser ni modifier le nom donné par le texte hébreu.
lexical_decisions:
- source_word: וּבְנֵי
  choice: Fils de
  rationale: Dans cette formule généalogique, le français peut omettre naturellement la conjonction initiale tout en conservant la continuité de la liste. « Fils » désigne ici les fils immédiats, puisque quatre d’entre eux sont énumérés.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Forme française biblique traditionnelle et largement reconnue du nom.
- source_word: הַבְּכוֹר
  choice: le premier-né
  rationale: Rend directement l’ordre de naissance et le statut exprimés par le terme hébreu.
- source_word: יוֹחָנָן
  choice: Yohanân
  rationale: Translittération française claire du nom hébreu, distinguée de la forme française « Jean ».
- source_word: הַשֵּׁנִי
  choice: le deuxième
  rationale: Rend simplement l’ordinal et maintient la progression de la liste.
- source_word: יְהוֹיָקִים
  choice: Joïakim
  rationale: Forme française biblique usuelle correspondant exactement au nom présent dans le texte hébreu.
- source_word: הַשְּׁלִשִׁי
  choice: le troisième
  rationale: Traduction directe et cohérente de l’ordinal.
- source_word: צִדְקִיָּהוּ
  choice: Sédécias
  rationale: Forme française biblique traditionnelle et immédiatement reconnaissable.
- source_word: הָרְבִיעִי
  choice: le quatrième
  rationale: Traduction directe et cohérente de l’ordinal.
- source_word: שַׁלּוּם
  choice: Shalloum
  rationale: Translittération française courante du nom tel qu’il figure dans le texte hébreu.
theological_decisions:
- issue: Ordre généalogique et ordre de succession au trône
  choice: Conserver la liste des fils de Josias et les indications ordinales exactement selon la présentation hébraïque.
  alternative: Réordonner les noms ou les harmoniser dans le corps du texte avec la succession royale rapportée dans les livres des Rois.
  rationale: Le verset présente explicitement une généalogie assortie d’ordinaux. La traduction ne doit pas résoudre dans le texte principal la tension avec les récits historiques parallèles.
translation_notes:
  register: Français moderne, sobre et digne, avec une ponctuation adaptée à une liste généalogique. Les formes françaises bibliques établies sont retenues pour les noms royaux ; « Yohanân » et « Shalloum » suivent une translittération française transparente.
