  yaml_path: translation/ot/1_chronicles/003/023.yaml
  text: 'The sons of Neariah: Elioenai[a], Hezekiah, and Azrikam—three.'
translation:
  language: fr
  text: 'Les fils de Nearia : Élioénaï[a], Ézéchias et Azrikam — trois en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « le fils de Nearia », mais, dans ce contexte généalogique, cette expression introduit une liste de trois descendants; d’où « les fils de Nearia ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: Les fils de
  rationale: La forme hébraïque est morphologiquement au singulier (« et le fils de »), mais elle introduit ici trois noms et se termine par le total « trois ». Dans ce contexte généalogique, le français idiomatique emploie donc un intitulé collectif au pluriel.
- source_word: נְעַרְיָה
  choice: Nearia
  rationale: Nom propre translittéré sous une forme française courante, sans traduire son étymologie.
- source_word: אֶלְיוֹעֵינַי
  choice: Élioénaï
  rationale: Translittération française usuelle du nom propre, avec accents facilitant une prononciation naturelle.
- source_word: וְחִזְקִיָּה
  choice: Ézéchias
  rationale: Forme française traditionnelle et largement reconnue du nom biblique Hizqiyyah.
- source_word: וְעַזְרִיקָם
  choice: et Azrikam
  rationale: Le nom propre est translittéré, et la conjonction hébraïque est rendue naturellement devant le dernier élément de l’énumération.
- source_word: שְׁלֹשָׁה
  choice: trois en tout
  rationale: Le nombre cardinal récapitule explicitement les trois descendants énumérés; « en tout » rend clairement sa fonction récapitulative en français.
