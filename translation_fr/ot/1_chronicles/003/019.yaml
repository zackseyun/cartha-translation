base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/019.yaml
  text: 'The sons of Pedaiah: Zerubbabel and Shimei[a]. And the sons of Zerubbabel: Meshullam and Hananiah; and Shelomith was their sister.'
translation:
  language: fr
  text: 'Les fils de Pedaya : Zorobabel et Shimeï. Les fils de Zorobabel[a] : Meshoullam et Hanania ; Shelomith était leur sœur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte ici le singulier : « le fils de Zorobabel ». Comme deux fils sont ensuite nommés, certains y voient une irrégularité du texte ou un emploi généalogique à valeur collective.'
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי פְדָיָה
  choice: Les fils de Pedaya
  rationale: Dans ce contexte généalogique, בְּנֵי désigne naturellement les fils. La conjonction initiale n’est pas exprimée, car une nouvelle rubrique généalogique se formule plus naturellement ainsi en français.
- source_word: זְרֻבָּבֶל וְשִׁמְעִי
  choice: Zorobabel et Shimeï
  rationale: Les noms sont transcrits selon des formes françaises bibliques usuelles, et la coordination hébraïque est conservée.
- source_word: וּבֶן זְרֻבָּבֶל
  choice: Les fils de Zorobabel[a]
  rationale: Le texte hébreu porte le singulier « fils », mais il est suivi de deux noms masculins et de la mention de leur sœur. Le pluriel exprime le sens apparent de l’énumération, tandis que la forme singulière du texte source est explicitement signalée en note.
- source_word: מְשֻׁלָּם וַחֲנַנְיָה
  choice: Meshoullam et Hanania
  rationale: Transcription française claire des noms propres avec maintien de leur coordination.
- source_word: וּשְׁלֹמִית אֲחוֹתָם
  choice: Shelomith était leur sœur
  rationale: Le suffixe pluriel de אֲחוֹתָם est rendu par « leur ». Le verbe « était » est ajouté pour former en français une proposition naturelle correspondant à la proposition nominale hébraïque.
