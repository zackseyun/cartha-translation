translation:
  language: fr
  text: le cinquième, Shephatia, fils d’Abital[a] ; le sixième, Yitream, fils d’Égla, femme de David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à Abital ». Dans cette formule généalogique, cela signifie qu’Abital était sa mère.'
