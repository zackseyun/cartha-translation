lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: le cinquième
  rationale: L'adjectif ordinal défini poursuit la liste numérotée des fils de David.
- source_word: שְׁפַטְיָה
  choice: Shephatia
  rationale: Le nom propre est translittéré sous une forme lisible et usuelle en français.
- source_word: לַאֲבִיטָל
  choice: fils d'Abital
  rationale: Dans cette formule généalogique, la préposition ל indique la maternité. « Fils d'Abital » l'exprime naturellement en français sans suggérer qu'Abital est le père.
- source_word: הַשִּׁשִּׁי
  choice: le sixième
  rationale: L'ordinal défini est rendu parallèlement à « le cinquième ».
- source_word: יִתְרְעָם
  choice: Yitream
  rationale: Cette translittération française représente le yod initial et conserve la forme du nom hébreu.
- source_word: לְעֶגְלָה
  choice: fils d'Égla
  rationale: Comme dans le membre précédent, la préposition ל marque ici la maternité dans une formule généalogique.
- source_word: אִשְׁתּוֹ
  choice: sa femme
  rationale: Le nom אִשָּׁה avec le suffixe masculin singulier signifie ici « sa femme » et désigne naturellement Égla comme femme de David.
theological_decisions:
- issue: Référent et portée de « sa femme » dans « Égla, sa femme »
  choice: Conserver la précision explicite selon laquelle Égla était la femme de David, sans lui attribuer un statut particulier.
  alternative: Identifier Égla à Mikal, ou comprendre la formule comme l'indication d'un rang spécial parmi les femmes de David.
  rationale: Le texte nomme simplement Égla comme « sa femme » sans expliquer pourquoi cette précision est ajoutée. La traduction ne tranche donc pas les identifications ou implications proposées ultérieurement.
translation_notes:
  register: Français moderne, sobre et digne. La répétition « fils de » clarifie la relation maternelle exprimée par ל, tandis que les points-virgules préservent la structure concise de la liste généalogique.
