  text: וּ/בְנֵ֖י יְהוֹיָקִ֑ים יְכָנְיָ֥ה בְנ֖/וֹ צִדְקִיָּ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/016.yaml
  text: 'And the sons of Jehoiakim: Jeconiah his son[a], Zedekiah his son.'
translation:
  language: fr
  text: 'Et les fils de Jojakim : Jéconias, son fils[a], Sédécias, son fils.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est concis : « Jéconias, son fils, Sédécias, son fils. » On peut y voir une simple succession généalogique. Les interprètes ne s’accordent toutefois pas tous : les deux noms peuvent être compris comme ceux de deux fils de Jojakim, ou Sédécias comme le fils de Jéconias, selon l’enchaînement formulé ici.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Et les fils de
  rationale: Le nom בְּנֵי est le pluriel construit de « fils » et introduit une notice généalogique. La conjonction וּ est rendue par « Et » afin de conserver la continuité de la liste.
- source_word: יְהוֹיָקִים
  choice: Jojakim
  rationale: Forme française biblique usuelle du nom propre hébreu.
- source_word: יְכָנְיָה
  choice: Jekonia
  rationale: Forme française correspondant au nom hébreu employé ici, distincte des variantes ou formes abrégées attestées ailleurs.
- source_word: בְנ֖/וֹ
  choice: son fils
  rationale: Le nom בֵּן avec suffixe masculin singulier de troisième personne se rend naturellement par « son fils ». Sa première occurrence est conservée explicitement.
- source_word: צִדְקִיָּה
  choice: Sédécias
  rationale: Forme française biblique usuelle du nom propre hébreu.
- source_word: בְנֽ/וֹ
  choice: son fils
  rationale: La répétition de l'indication généalogique est maintenue, conformément à la formulation concise de l'hébreu.
theological_decisions:
- issue: Syntaxe généalogique et lien de parenté dans une notice difficile
  choice: 'Conserver littéralement la suite concise : « Jekonia, son fils, Sédécias, son fils »'
  alternative: Comprendre Jekonia et Sédécias comme deux fils de Jojakim, ou rattacher le second « son fils » à Jekonia dans une succession imbriquée.
  rationale: L'hébreu répète formellement « son fils » sans lever entièrement l'ambiguïté du référent. La traduction ne l'harmonise pas avec d'autres récits historiques et laisse la note signaler les lectures possibles.
translation_notes:
  register: Français moderne, digne et direct. Les formes françaises usuelles des noms bibliques sont retenues. La ponctuation rend la liste lisible sans supprimer l'ambiguïté réelle de la syntaxe hébraïque.
