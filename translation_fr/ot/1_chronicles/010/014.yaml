  text: וְ/לֹֽא דָרַ֥שׁ בַּֽ/יהוָ֖ה וַ/יְמִיתֵ֑/הוּ וַ/יַּסֵּב֙ אֶת הַ/מְּלוּכָ֔ה לְ/דָוִ֖יד בֶּן יִשָֽׁי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/014.yaml
  text: He did not seek Yahweh[b][a], so he put him to death and turned the kingdom over to David son of Jesse.
translation:
  language: fr
  text: Il n’avait pas cherché Yahweh[a]. C’est pourquoi Yahweh le fit mourir et transféra la royauté[b] à David, fils de Jessé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « interrogé Yahweh » ou « consulté Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le royaume » ou « le pouvoir royal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָרַשׁ בַּיהוָה
  choice: chercher Yahweh
  rationale: Avec ב et un objet divin, דרש peut signifier chercher, interroger ou consulter. « Chercher Yahweh » reste naturel et conserve à la fois l’idée de demander sa direction et la dimension relationnelle de l’expression.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans l’hébreu plutôt que de lui substituer un titre.
- source_word: וַיְמִיתֵהוּ
  choice: Yahweh le fit mourir
  rationale: Le hiphil de מות exprime une causalité. La répétition explicite de « Yahweh » en français clarifie le sujet implicite des verbes hébreux et maintient l’attribution de la mort de Saül à Yahweh.
- source_word: וַיַּסֵּב
  choice: transféra
  rationale: Le hiphil de סבב peut exprimer l’action de faire passer ou de transférer quelque chose à un autre; « transféra » convient naturellement au passage de la royauté à David.
- source_word: הַמְּלוּכָה
  choice: la royauté
  rationale: Dans ce contexte, מְלוּכָה désigne principalement la dignité ou le pouvoir royal transmis de Saül à David, plutôt que le territoire du royaume.
- source_word: לְדָוִיד בֶּן־יִשַׁי
  choice: à David, fils de Jessé
  rationale: Cette formulation rend naturellement en français le patronyme hébreu.
theological_decisions:
- issue: L’action de Yahweh dans la mort de Saül
  choice: Le texte attribue directement à Yahweh le fait d’avoir fait mourir Saül.
  alternative: Yahweh aurait seulement permis la mort de Saül.
  rationale: Le sujet contextuel des verbes est Yahweh, et la forme causative de מות exprime son action sans la réduire à une simple permission. La traduction conserve cette tension sans développer une théorie des causes secondaires.
translation_notes:
  register: Français international moderne, digne et accessible. Le plus-que-parfait rattache naturellement cette faute au récit précédent; « Alors » rend le lien consécutif sans imposer une causalité plus explicite que l’hébreu. La répétition de « Yahweh » évite en français toute ambiguïté sur le sujet de « le fit mourir ».
