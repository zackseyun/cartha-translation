  text: וַ/תִּכְבַּ֤ד הַ/מִּלְחָמָה֙ עַל שָׁא֔וּל וַ/יִּמְצָאֻ֖/הוּ הַ/מּוֹרִ֣ים בַּ/קָּ֑שֶׁת וַ/יָּ֖חֶל מִן הַ/יּוֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/003.yaml
  text: The battle grew heavy against Saul, and the archers found him, and he was badly wounded by the archers.
translation:
  language: fr
  text: Le combat s’acharna contre Saül ; les archers le trouvèrent, et il fut blessé par les archers[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il fut saisi d’une vive angoisse à cause des archers ». Le verbe hébreu peut désigner une profonde détresse plutôt qu’une blessure physique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד
  choice: devint acharné
  rationale: Le verbe signifie littéralement « devenir lourd ». Dans le contexte d’un combat, « devenir acharné » exprime naturellement en français l’intensification et la forte pression exercée.
- source_word: הַמִּלְחָמָה עַל שָׁאוּל
  choice: Le combat … contre Saül
  rationale: מִלְחָמָה désigne ici le combat, et עַל prend un sens hostile rendu naturellement par « contre ».
- source_word: וַיִּמְצָאֻהוּ
  choice: le repérèrent
  rationale: מצא signifie couramment « trouver ». Dans cette scène militaire, « repérer » communique de façon idiomatique que les archers découvrirent la position de Saül, sans ajouter qu’ils l’avaient déjà atteint.
- source_word: הַמּוֹרִים בַּקָּשֶׁת
  choice: Les archers
  rationale: L’expression signifie littéralement « ceux qui tirent à l’arc » ; « les archers » en est l’équivalent français précis et naturel.
- source_word: וַיָּחֶל
  choice: il fut blessé
  rationale: La forme verbale est difficile et peut évoquer soit une blessure physique, soit une vive détresse. « Il fut blessé » convient au déroulement du récit, mais l’autre compréhension est conservée en note. Aucun adverbe comme « grièvement » n’est ajouté, puisqu’il n’a pas d’équivalent explicite dans ce verset.
- source_word: מִן הַיּוֹרִים
  choice: par leurs tirs
  rationale: La préposition מִן indique ici la source ou la cause. « Par leurs tirs » évite une répétition lourde d’« archers » tout en rattachant clairement la blessure à leurs projectiles.
theological_decisions:
- issue: Nature de ce que Saül subit de la part des archers
  choice: Une blessure physique dans le texte principal
  alternative: Une vive angoisse ou détresse provoquée par les archers
  rationale: Le contexte militaire favorise la blessure physique, mais le verbe hébreu permet aussi une lecture exprimant la douleur ou l’angoisse. La note maintient cette ambiguïté réelle sans trancher davantage que le contexte ne le permet.
translation_notes:
  register: Français international actuel, sobre et narratif. « Devint acharné » rend l’image idiomatique de la bataille qui devient « lourde », tandis que « le repérèrent » conserve distinctement l’action de trouver Saül avant la mention de ce qu’il subit.
