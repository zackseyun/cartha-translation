  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ אֶל נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָבֹ֜אוּ הָ/עֲרֵלִ֤ים הָ/אֵ֨לֶּה֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ־׀־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and mistreat me.” But his armor-bearer was not willing, because he was very afraid[c][b]. So Saul took the sword and fell on it.
translation:
  language: fr
  text: 'Alors Saül dit à celui qui portait ses armes : « Tire ton épée et transperce-moi avec elle, de peur que ces incirconcis ne viennent et ne me maltraitent[a]. » Mais celui qui portait ses armes ne voulut pas, car il avait très peur. Saül prit donc l’épée et tomba sur elle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’ils se jouent de moi » ou « qu’ils m’outragent » ; le terme hébreu évoque un traitement violent et humiliant sans en préciser la forme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: celui qui portait ses armes
  rationale: Rend directement l’expression hébraïque « porteur de ses armes/équipements » dans un français naturel, sans recourir au terme plus technique « écuyer ».
- source_word: שְׁלֹף חַרְבְּךָ
  choice: Tire ton épée
  rationale: Dans ce contexte, שלף désigne l’action de tirer l’épée, vraisemblablement de son fourreau.
- source_word: וְדָקְרֵנִי בָהּ
  choice: et transperce-moi avec
  rationale: דקר exprime l’idée de percer avec une arme; « transperce-moi » restitue clairement l’intention mortelle sans ajout.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: ces incirconcis
  rationale: Conserve la désignation polémique exacte du texte au lieu de lui substituer explicitement « Philistins ».
- source_word: וְהִתְעַלְּלוּ בִי
  choice: et ne me maltraitent
  rationale: Le verbe évoque un traitement violent, humiliant ou outrageant sans en préciser la forme; « maltraitent » préserve cette largeur sémantique.
- source_word: וְלֹא אָבָה
  choice: ne voulut pas
  rationale: Rend simplement et fidèlement l’absence de consentement exprimée par אָבָה.
- source_word: כִּי יָרֵא מְאֹד
  choice: car il avait très peur
  rationale: Reproduit la relation causale et l’intensification de la peur sans la renforcer en « terrifié ».
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: se laissa tomber dessus
  rationale: Préserve l’image hébraïque de tomber sur l’épée tout en indiquant naturellement en français le caractère volontaire du geste imposé par le contexte.
theological_decisions:
- issue: Nature du traitement redouté par Saül
  choice: ne me maltraitent
  alternative: ne se jouent de moi / ne m’outragent
  rationale: L’hébreu laisse ouverte la forme exacte des violences et humiliations redoutées. La traduction ne précise donc ni torture, ni mutilation, ni dérision exclusivement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative reste proche de l’hébreu, tandis que « celui qui portait ses armes » évite un terme historique potentiellement trompeur. Le démonstratif de « ces incirconcis » est conservé.
