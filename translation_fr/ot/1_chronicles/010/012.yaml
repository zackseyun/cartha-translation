  text: וַ/יָּקוּמוּ֮ כָּל אִ֣ישׁ חַיִל֒ וַ/יִּשְׂא֞וּ אֶת גּוּפַ֣ת שָׁא֗וּל וְ/אֵת֙ גּוּפֹ֣ת בָּנָ֔י/ו וַ/יְבִיא֖וּ/ם יָבֵ֑ישָׁ/ה וַ/יִּקְבְּר֨וּ אֶת עַצְמוֹתֵי/הֶ֜ם תַּ֤חַת הָ/אֵלָה֙ בְּ/יָבֵ֔שׁ וַ/יָּצ֖וּמוּ שִׁבְעַ֥ת יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/012.yaml
  text: Then all the valiant men arose and carried away the body of Saul and the bodies of his sons[a], and brought them to Jabesh[b]. They buried their bones under the oak in Jabesh and fasted seven days.
translation:
  language: fr
  text: Alors tous les hommes vaillants se levèrent, emportèrent le corps de Saül et les corps de ses fils, et les amenèrent à Jabès[a]. Ils enterrèrent leurs os sous le térébinthe[b] à Jabès et jeûnèrent pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le récit parallèle précise qu’il s’agit de Jabès en Galaad; ici, le texte hébreu dit simplement « Jabès ».
    reason: cross_reference
  - marker: b
    text: Ou « sous le chêne ». Le mot hébreu אֵלָה peut désigner un grand arbre du type térébinthe ou chêne.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: tous les hommes vaillants
  rationale: Cette expression désigne des hommes caractérisés par leur force, leur courage ou leur valeur guerrière. « Hommes vaillants » est naturel en français moderne et conserve cette nuance.
- source_word: גּוּפַת ... גּוּפֹת
  choice: le corps de Saül et les corps de ses fils
  rationale: Le terme désigne ici des corps morts. « Corps » est clair dans le contexte et moins dur que « cadavres », tout en restant fidèle.
- source_word: וַיִּשְׂאוּ
  choice: emportèrent
  rationale: Le verbe exprime ici l’action de soulever les corps et de les transporter hors du lieu où ils se trouvaient.
- source_word: וַיְבִיאוּם יָבֵישָׁה
  choice: les amenèrent à Jabès
  rationale: Le texte hébreu de ce verset emploie la forme abrégée « Jabès » plutôt que « Jabès en Galaad »; la traduction respecte cette formulation.
- source_word: עַצְמוֹתֵיהֶם
  choice: leurs os
  rationale: Le mot hébreu signifie concrètement « os ». Cette traduction préserve l'enchaînement singulier du récit, qui parle d'abord des corps, puis de leurs os, sans le lisser en « restes ».
- source_word: תַּחַת הָאֵלָה
  choice: sous le térébinthe
  rationale: אֵלָה désigne un grand arbre du type térébinthe ou chêne. « Térébinthe » est une identification traditionnelle et précise, tandis qu'une note conserve l'incertitude botanique.
- source_word: וַיָּצֻמוּ שִׁבְעַת יָמִים
  choice: et jeûnèrent pendant sept jours
  rationale: La formulation française exprime naturellement la durée du jeûne de deuil.
