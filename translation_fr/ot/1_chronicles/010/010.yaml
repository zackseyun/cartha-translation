  text: וַ/יָּשִׂ֨ימוּ֙ אֶת כֵּלָ֔י/ו בֵּ֖ית אֱלֹהֵי/הֶ֑ם וְ/אֶת גֻּלְגָּלְתּ֥/וֹ תָקְע֖וּ בֵּ֥ית דָּגֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/010.yaml
  text: They put his armor in the house of their gods[b][a], and they fastened his skull in the house of Dagon.
translation:
  language: fr
  text: Ils déposèrent ses armes dans le temple de leurs dieux[a] et fixèrent son crâne[b] dans le temple de Dagon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison de leurs dieux ». Le mot hébreu traduit ici par « temple » signifie couramment « maison ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sa tête ». Le terme hébreu désigne proprement le crâne, mais peut aussi évoquer la tête.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Ils déposèrent
  rationale: Le verbe שׂים signifie mettre, placer ou déposer. « Déposèrent » convient naturellement au placement d'objets dans un sanctuaire.
- source_word: כֵּלָיו
  choice: ses armes
  rationale: כְּלִי peut désigner des objets, du matériel ou des armes. Dans ce contexte de mort au combat, « armes » rend le référent probable sans préciser à tort qu'il s'agit uniquement d'une armure.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: le temple de leurs dieux
  rationale: בַּיִת signifie littéralement « maison », mais désigne couramment le temple d'une divinité dans un contexte cultuel. « Temple » est ici le français naturel et non ambigu.
- source_word: גֻּלְגָּלְתּוֹ
  choice: son crâne
  rationale: גֻּלְגֹּלֶת désigne le crâne et peut, par extension, évoquer la tête. « Crâne » est l'équivalent lexical le plus précis dans cette scène.
- source_word: תָקְעוּ
  choice: fixèrent
  rationale: תקע peut signifier enfoncer, planter ou fixer. « Fixèrent » exprime la mise en exposition sans imposer l'idée plus précise et incertaine d'un empalement.
- source_word: בֵּית דָּגוֹן
  choice: le temple de Dagon
  rationale: Dans ce contexte cultuel, בֵּית désigne le temple; Dagon est conservé comme nom propre de la divinité.
