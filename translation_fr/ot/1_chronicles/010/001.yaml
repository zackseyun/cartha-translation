  text: וּ/פְלִשְׁתִּ֖ים נִלְחֲמ֣וּ בְ/יִשְׂרָאֵ֑ל וַ/יָּ֑נָס אִֽישׁ יִשְׂרָאֵל֙ מִ/פְּנֵ֣י פְלִשְׁתִּ֔ים וַ/יִּפְּל֥וּ חֲלָלִ֖ים בְּ/הַ֥ר גִּלְבֹּֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/001.yaml
  text: The Philistines fought against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: fr
  text: Les Philistins combattirent contre Israël, et les hommes d’Israël[a] s’enfuirent devant les Philistins et tombèrent morts sur le mont Guilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « l’homme d’Israël » ; le singulier a ici un sens collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Les Philistins
  rationale: « Philistins » est le nom français traditionnel de ce peuple. Le ו initial assure la continuité narrative, mais n’exige pas ici un « et » en tête de phrase en français.
- source_word: נִלְחֲמוּ בְיִשְׂרָאֵל
  choice: combattirent contre Israël
  rationale: Le nifal de לחם construit avec ב désigne ici une action militaire hostile. « Combattre contre » exprime clairement cette relation en français courant.
- source_word: וַיָּנָס אִישׁ יִשְׂרָאֵל
  choice: Les hommes d’Israël s’enfuirent
  rationale: Bien que אִישׁ soit morphologiquement singulier, il a ici un sens collectif ou distributif. « Les hommes d’Israël » conserve la référence masculine aux combattants sans transformer l’expression en désignation générale de tout le peuple.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: devant les Philistins
  rationale: L’expression מִפְּנֵי signifie littéralement « de devant » ou « loin de la présence de ». Avec le verbe « s’enfuir », « devant les Philistins » rend naturellement la fuite face à l’ennemi.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: et tombèrent, tués
  rationale: La combinaison de נפל et חֲלָלִים est une formule de récit de bataille. Cette formulation maintient à la fois l’idée de tomber et celle d’avoir été tué, sans réduire le sens à une simple mort.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: sur le mont Guilboa
  rationale: « Mont Guilboa » est la forme française usuelle du toponyme, et « sur » convient à la localisation du combat sur cette hauteur.
