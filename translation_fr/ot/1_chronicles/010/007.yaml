source:
  edition: WLC
  text: וַ֠/יִּרְאוּ כָּל אִ֨ישׁ יִשְׂרָאֵ֤ל אֲשֶׁר בָּ/עֵ֨מֶק֙ כִּ֣י נָ֔סוּ וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ עָרֵי/הֶם֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/007.yaml
  text: When all the men of Israel who were in the valley saw that they had fled and that Saul and his sons were dead[a], they abandoned their cities and fled[c][b]; then the Philistines came and lived in them.
translation:
  language: fr
  text: Quand tous les hommes d’Israël qui se trouvaient dans la vallée[a] virent qu’ils avaient fui et que Saül et ses fils étaient morts, ils abandonnèrent leurs villes et s’enfuirent. Alors les Philistins vinrent s’y installer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la plaine ».
    reason: lexical_alternative
  - marker: b
    text: Ou « y habiter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: virent
  rationale: Le sens premier de ראה est la perception visuelle. « Virent » conserve le caractère concret du récit sans introduire l’interprétation « comprirent ».
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: tous les hommes d’Israël
  rationale: Le singulier אִישׁ après כָּל a une valeur distributive et le texte hébreu emploie explicitement un terme masculin.
- source_word: אֲשֶׁר בָּעֵמֶק
  choice: qui se trouvaient dans la vallée
  rationale: עֵמֶק désigne normalement une vallée, même si « plaine » est possible selon la topographie envisagée.
- source_word: כִּי נָסוּ
  choice: qu’ils avaient fui
  rationale: Le plus-que-parfait marque naturellement que la fuite observée précède l’abandon des villes. Le pronom conserve l’absence de sujet nominal explicite dans l’hébreu.
- source_word: וְכִי מֵתוּ שָׁאוּל וּבָנָיו
  choice: et que Saül et ses fils étaient morts
  rationale: « Étaient morts » exprime naturellement en français l’état résultant constaté sur le champ de bataille.
- source_word: וַיַּעַזְבוּ עָרֵיהֶם
  choice: ils abandonnèrent leurs villes
  rationale: עזב signifie laisser derrière soi ou abandonner; le contexte militaire implique une évacuation forcée.
- source_word: וַיָּנֻסוּ
  choice: et s’enfuirent
  rationale: נוס est le verbe courant pour prendre la fuite; « s’enfuirent » convient au registre narratif.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: Alors les Philistins vinrent
  rationale: « Alors » rend clairement la progression narrative portée par le waw consécutif.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: s’y installer
  rationale: ישב peut signifier habiter ou s’établir. Ici, « s’y installer » exprime clairement la prise de possession durable des villes abandonnées.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique, tandis que le plus-que-parfait indique les événements déjà accomplis au moment où les habitants les constatent. Les pronoms de l’hébreu sont conservés sans préciser davantage l’identité du groupe ayant fui.
