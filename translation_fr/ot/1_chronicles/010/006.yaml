  yaml_path: translation/ot/1_chronicles/010/006.yaml
  text: So Saul died[a], and his three sons, and all his house died together.
translation:
  language: fr
  text: Ainsi, Saül, ses trois fils et toute sa maison moururent tous ensemble.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute sa maisonnée » ou « toute sa famille ». L’hébreu dit littéralement « toute sa maison » ; ce terme peut désigner la maisonnée, la famille ou la lignée, et non un bâtiment.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Ainsi, Saül mourut
  rationale: Le wayyiqtol de מוּת fait avancer le récit et présente ici l’aboutissement des événements précédents. « Ainsi » rend naturellement cette continuité à valeur de conséquence, tandis que « mourut » traduit simplement le verbe.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et courante du nom.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: ainsi que ses trois fils
  rationale: Le groupe construit avec le numéral et le suffixe de troisième personne signifie « ses trois fils ». « Ainsi que » coordonne naturellement ces sujets avec Saül sans suggérer que le premier verbe ne concerne que lui.
- source_word: וְכָל בֵּיתוֹ
  choice: et toute sa maison
  rationale: בַּיִת peut désigner une maison au sens concret, mais aussi une maisonnée, une famille ou une lignée. Le maintien de « maison » préserve cette amplitude sémantique sans préciser excessivement la portée.
- source_word: יַחְדָּו
  choice: avec lui
  rationale: L’adverbe signifie littéralement « ensemble ». Dans cette construction française, « avec lui » exprime idiomatiquement la mort commune de Saül, de ses fils et de sa maison, sans nécessairement affirmer une simultanéité absolue.
- source_word: מֵתוּ
  choice: mourut
  rationale: Le parfait qal pluriel de מוּת décrit leur mort. En français, le sujet collectif singulier « toute sa maison » commande naturellement le singulier « mourut » ; la répétition conserve l’insistance de l’hébreu.
theological_decisions:
- issue: Portée de « toute sa maison »
  choice: Conserver « toute sa maison » dans le texte principal, avec une note explicitant son sens collectif possible.
  alternative: « toute sa maisonnée » ou « toute sa famille »
  rationale: L’expression hébraïque ne doit pas être transformée sans nuance en affirmation selon laquelle chaque membre de la famille élargie ou toute la descendance de Saül serait mort. « Maison » préserve la largeur et la tension du texte.
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple convient au registre biblique écrit. La coordination reste proche de la structure hébraïque, tandis que « ainsi que » et « avec lui » évitent une phrase maladroite en français. Le marqueur [a] est placé immédiatement après la proposition concernée.
