lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Quand … apprirent
  rationale: Le waw consécutif fait progresser le récit, mais la proposition prépare surtout l’action du verset suivant. « Quand » exprime naturellement cette relation temporelle en français.
- source_word: כֹּל יָבֵישׁ גִּלְעָד
  choice: tous les habitants de Yabesh en Galaad
  rationale: L’hébreu dit littéralement « tout Yabesh-Galaad », mais le verbe au pluriel montre qu’il s’agit de la population de la ville. La formulation explicite est plus naturelle et immédiatement compréhensible en français.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tout ce que
  rationale: Cette tournure rend de manière concise et naturelle l’ensemble de ce qui avait été fait.
- source_word: עָשׂוּ
  choice: avaient fait
  rationale: Le plus-que-parfait indique clairement que les actes des Philistins précèdent le moment où la nouvelle parvient aux habitants.
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Forme française courante du nom de ce peuple.
- source_word: לְשָׁאוּל
  choice: à Saül
  rationale: La préposition ל désigne ici la personne touchée par l’action. « À Saül » conserve la formulation large de l’hébreu sans préciser davantage la nature hostile de l’acte.
