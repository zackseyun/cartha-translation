  text: וַ/יַּדְבְּק֣וּ פְלִשְׁתִּ֔ים אַחֲרֵ֥י שָׁא֖וּל וְ/אַחֲרֵ֣י בָנָ֑י/ו וַ/יַּכּ֣וּ פְלִשְׁתִּ֗ים אֶת יוֹנָתָ֧ן וְ/אֶת אֲבִינָדָ֛ב וְ/אֶת מַלְכִּי שׁ֖וּעַ בְּנֵ֥י שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/002.yaml
  text: And the Philistines pursued Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua, the sons of Saul.
translation:
  language: fr
  text: Les Philistins talonnèrent Saül et ses fils[a]. Ils abattirent Jonathan, Abinadab et Malki-Shoua, les fils de Saül.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poursuivirent Saül et ses fils de très près ». Le verbe hébreu signifie littéralement « s’attacher à » et décrit ici une poursuite acharnée au combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵי
  choice: talonnèrent
  rationale: Avec אַחֲרֵי dans ce récit de bataille, דבק exprime une poursuite serrée et acharnée. « Talonner » restitue naturellement en français l’idée de rester au plus près des fuyards.
- source_word: בָנָיו
  choice: ses fils
  rationale: Le nom désigne ici les descendants masculins de Saül, que la suite identifie par leur nom.
- source_word: וַיַּכּוּ
  choice: abattirent
  rationale: Dans ce contexte militaire, נכה indique qu’ils les frappèrent à mort. « Abattirent » conserve l’image de la mise à terre sans employer le terme archaïque « frappèrent » au sens de tuer.
- source_word: פְלִשְׁתִּים
  choice: les Philistins / ils
  rationale: Le nom du peuple est rendu selon l’usage français. La seconde occurrence devient le pronom « ils » afin d’éviter une répétition lourde, sans ambiguïté sur le sujet.
- source_word: יוֹנָתָן
  choice: Jonathan
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Translittération française usuelle du nom.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malki-Shoua
  rationale: Translittération adaptée à la phonétique française; le trait d’union reflète les deux éléments graphiques du nom hébreu.
- source_word: בְּנֵי שָׁאוּל
  choice: les fils de Saül
  rationale: L’apposition finale identifie explicitement les trois hommes et reprend fidèlement la structure hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Talonnèrent » rend avec concision l’intensité concrète de la poursuite; « abattirent » convient au récit de bataille. La coordination hébraïque entre les deux propositions est rendue par deux phrases pour une lecture française plus fluide.
