source:
  edition: WLC
  text: וַ/יָּ֣מָת שָׁא֗וּל בְּ/מַֽעֲל/וֹ֙ אֲשֶׁ֣ר מָעַ֣ל בַּֽ/יהוָ֔ה עַל דְּבַ֥ר יְהוָ֖ה אֲשֶׁ֣ר לֹא שָׁמָ֑ר וְ/גַם לִ/שְׁא֥וֹל בָּ/א֖וֹב לִ/דְרֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/013.yaml
  text: So Saul died for his unfaithfulness by which he was unfaithful to Yahweh[a], because of the word of Yahweh, which he did not keep, and also because he asked counsel of a medium[b], to inquire.
translation:
  language: fr
  text: 'Ainsi, Saül mourut à cause de son infidélité : il avait été infidèle envers Yahweh[a], n’avait pas observé la parole de Yahweh et avait aussi consulté un médium[b] pour obtenir des renseignements.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause de la rupture de fidélité qu’il avait commise contre Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut désigner un médium, c’est-à-dire une personne qui cherche à obtenir des informations des morts ou des esprits, ou l’esprit des morts ainsi consulté. Voir 1 Samuel 28.7.
    reason: cultural_note_and_lexical_ambiguity
lexical_decisions:
- source_word: וַיָּמָת
  choice: Ainsi, Saül mourut
  rationale: Le waw narratif fait avancer le récit tout en reliant la mort de Saül aux faits précédents ; « Ainsi » en exprime naturellement la portée consécutive.
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: à cause de l’infidélité par laquelle il s’était montré infidèle
  rationale: Le nom מַעַל et le verbe apparenté מָעַל décrivent une rupture de fidélité. La répétition française conserve autant que possible l’insistance et le jeu étymologique de l’hébreu.
- source_word: בַּיהוָה
  choice: envers Yahweh
  rationale: Avec מָעַל, la préposition désigne celui envers qui l’infidélité a été commise. « Envers » convient naturellement au vocabulaire de la fidélité sans atténuer la faute.
- source_word: עַל דְּבַר יְהוָה אֲשֶׁר לֹא שָׁמָר
  choice: il n’avait pas gardé la parole de Yahweh
  rationale: « Garder la parole » préserve le vocabulaire d’alliance de שׁמר et reste intelligible en français biblique moderne. La proposition est intégrée comme première explication concrète de l’infidélité.
- source_word: וְגַם לִשְׁאוֹל בָּאוֹב
  choice: et avait aussi interrogé un médium
  rationale: La construction ajoute un second motif. « Médium » est un terme français actuel pour la personne associée à la consultation des morts ou des esprits, tout en laissant la note signaler l’ambiguïté lexicale de אוֹב.
- source_word: לִדְרֹשׁ
  choice: afin d’obtenir des indications
  rationale: 'L’infinitif exprime le but de la consultation : rechercher une information ou une direction. Cette formulation évite en français la répétition maladroite « interroger… afin de consulter ».'
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom d’alliance יהוה. « Yahweh » le représente comme nom propre plutôt que de lui substituer un titre.
- issue: Caractérisation de la faute de Saül
  choice: infidélité
  alternative: faute / sacrilège / rupture de fidélité
  rationale: מַעַל évoque ici une déloyauté grave envers Yahweh et sa parole. « Infidélité » rend cette dimension relationnelle et liée à l’alliance sans réduire la faute à une simple transgression générique.
- issue: Référent de אוֹב
  choice: un médium
  alternative: un esprit des morts
  rationale: Dans le contexte narratif de 1 Samuel 28, le mot peut désigner la personne consultée par Saul, mais son champ lexical peut aussi viser l’esprit associé à la pratique. Le texte principal adopte la lecture personnelle la plus naturelle en contexte, et la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et lisible. La structure causale a été rendue explicite sans effacer la répétition hébraïque de la racine מעל. Le deux-points introduit les deux manifestations de l’infidélité de Saül.
