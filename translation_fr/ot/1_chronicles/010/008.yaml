  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים לְ/פַשֵּׁ֖ט אֶת הַֽ/חֲלָלִ֑ים וַֽ/יִּמְצְא֤וּ אֶת שָׁאוּל֙ וְ/אֶת בָּנָ֔י/ו נֹפְלִ֖ים בְּ/הַ֥ר גִּלְבֹּֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/008.yaml
  text: It happened on the next day that the Philistines came to strip the slain[b][a], and they found Saul and his sons fallen on Mount Gilboa.
translation:
  language: fr
  text: Le lendemain[a], les Philistins vinrent dépouiller les morts[b]. Ils trouvèrent Saül et ses fils tombés sur le mont Guilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le jour suivant ».'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de retirer aux morts du champ de bataille leurs vêtements, leurs armes et les autres objets de valeur.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Le lendemain
  rationale: L’expression situe directement la scène au jour qui suit les événements racontés. En français narratif, « Le lendemain » rend naturellement la valeur temporelle; il n’est pas nécessaire de reproduire וַיְהִי par une formule lourde comme « il arriva que ».
- source_word: לְפַשֵּׁט
  choice: dépouiller
  rationale: Dans ce contexte de champ de bataille, le verbe désigne l’action d’enlever aux tués leurs vêtements, leurs armes et leurs objets de valeur. « Dépouiller » est précis et idiomatique en français.
- source_word: הַחֲלָלִים
  choice: les morts
  rationale: Le terme désigne ici ceux qui ont été tués au combat. « Les morts » est clair et naturel; le contexte militaire conserve le sens de victimes abattues.
- source_word: נֹפְלִים
  choice: tombés
  rationale: Le participe conserve l’image hébraïque de ceux qui sont tombés au combat, tout en laissant le contexte indiquer leur mort.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: sur le mont Guilboa
  rationale: Rendu français usuel du nom géographique et de la préposition employée avec une montagne.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Deux phrases remplacent la longue coordination hébraïque pour une lecture naturelle sans modifier la succession des actions. « Dépouiller les morts » est idiomatique et digne; « tombés » préserve l’image du texte source.
