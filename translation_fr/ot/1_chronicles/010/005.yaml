  text: When his armor-bearer saw that Saul was dead[b][a], he too fell on the sword and died.
translation:
  language: fr
  text: Quand son porteur d’armes[a] vit que Saül était mort, il se jeta lui aussi sur l’épée[b] et mourut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui qui portait ses armes » ou « son porteur d’équipement ».'
    reason: lexical_alternative
  - marker: b
    text: Se jeter sur une épée était une manière de se donner la mort.
    reason: cultural_note
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: son porteur d’armes
  rationale: Cette expression construite désigne littéralement « celui qui porte ses armes ou son équipement ». « Porteur d’armes » est l’appellation française naturelle et traditionnelle de cette fonction militaire.
- source_word: כִּי
  choice: que
  rationale: 'La conjonction introduit ici le contenu de ce que voit le porteur d’armes : il voit que Saül est mort.'
- source_word: מֵת
  choice: était mort
  rationale: Le terme décrit l’état de Saül au moment où le porteur d’armes le constate. L’imparfait français convient à l’arrière-plan du récit.
- source_word: וַיִּפֹּל
  choice: se jeta
  rationale: Le verbe signifie normalement « tomber », mais, avec « sur l’épée » et la mort qui suit, la tournure décrit un geste volontaire. « Se jeta » rend naturellement l’action en français sans expliciter davantage le suicide.
- source_word: גַּם הוּא
  choice: lui aussi
  rationale: 'Cette formulation conserve la valeur additive et emphatique : le porteur d’armes suit Saül dans la mort.'
- source_word: עַל הַחֶרֶב
  choice: sur l’épée
  rationale: L’hébreu porte l’article défini et ne précise pas qu’il s’agit de sa propre épée. La traduction préserve cette formulation plutôt que d’ajouter un possessif.
- source_word: וַיָּמֹת
  choice: et mourut
  rationale: Cette traduction directe maintient la brièveté de la succession narrative et indique l’issue du geste.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le passé simple convient au registre biblique dignifié sans être archaïque. La formulation conserve « l’épée », conformément à l’hébreu, et évite d’ajouter « son ».
