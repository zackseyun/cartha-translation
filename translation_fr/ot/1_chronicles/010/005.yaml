  text: וַ/יַּ֥רְא נֹשֵֽׂא כֵלָ֖י/ו כִּ֣י מֵ֣ת שָׁא֑וּל וַ/יִּפֹּ֥ל גַּם ה֛וּא עַל הַ/חֶ֖רֶב וַ/יָּמֹֽת־־־׃ס
base_translation:
