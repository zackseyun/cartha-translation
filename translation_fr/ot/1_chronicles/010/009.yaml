  terminology: « Idoles » rend correctement עֲצַבֵּיהֶם dans son contexte polémique et cultuel; la note « images » signale utilement l'alternative lexicale. « Armes » est un choix contextuellement solide pour כֵּלָיו, sans restreindre indûment le terme à l'armure. Les noms et le registre sont cohérents.
