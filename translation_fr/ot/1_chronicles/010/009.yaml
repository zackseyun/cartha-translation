  text: וַ/יַּ֨פְשִׁיטֻ֔/הוּ וַ/יִּשְׂא֥וּ אֶת רֹאשׁ֖/וֹ וְ/אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר אֶת עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/009.yaml
  text: They stripped him[a], took his head and his weapons, and sent word throughout the land of the Philistines to proclaim the news to their idols and to the people.
translation:
  language: fr
  text: Ils le dépouillèrent, emportèrent sa tête et ses armes, puis envoyèrent des messagers dans tout le pays des Philistins pour annoncer la nouvelle à leurs idoles[a] et au peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leurs images ».'
    reason: 'Alternative lexicale : le terme hébreu peut désigner des images cultuelles aussi bien que des idoles.'
lexical_decisions:
- source_word: וַיַּפְשִׁיטֻהוּ
  choice: Ils le dépouillèrent
  rationale: Le verbe פשט à cette forme signifie dépouiller quelqu’un de ses vêtements ou de son équipement. Le complément étant la personne elle-même, cette formulation reste concise sans préciser « de son armure », absent de la proposition.
- source_word: וַיִּשְׂאוּ אֶת רֹאשׁוֹ
  choice: emportèrent sa tête
  rationale: נשא peut signifier lever, prendre ou porter. Dans ce contexte de trophée de guerre, « emportèrent » exprime naturellement la saisie et le transport de la tête sans ajouter explicitement la décapitation.
- source_word: כֵּלָיו
  choice: ses armes
  rationale: כְּלִי désigne largement des objets, instruments ou armes. Dans le contexte du champ de bataille, « armes » est le choix le plus naturel, tout en évitant le terme plus étroit « armure ».
- source_word: וַיְשַׁלְּחוּ
  choice: envoyèrent des messagers
  rationale: Le verbe signifie simplement « envoyer ». En français, le but exprimé par לְבַשֵּׂר permet de rendre explicite le moyen humain naturellement sous-entendu, sans modifier le sens de l’action.
- source_word: בְאֶרֶץ פְלִשְׁתִּים סָבִיב
  choice: dans tout le pays des Philistins
  rationale: Cette expression indique une diffusion de tous côtés à travers le territoire philistin. La formulation choisie est idiomatique et fidèle à cette portée.
- source_word: לְבַשֵּׂר
  choice: pour annoncer la nouvelle
  rationale: בשר signifie annoncer une nouvelle, ici de manière triomphale. Cette traduction conserve l’idée d’annonce sans lui donner artificiellement une connotation religieuse positive.
- source_word: עֲצַבֵּיהֶם
  choice: leurs idoles
  rationale: עֶצֶב peut désigner une image cultuelle ou une idole et porte souvent une nuance polémique. « Idoles » convient au contexte religieux philistin, tandis que « images » demeure une possibilité lexicale.
- source_word: הָעָם
  choice: au peuple
  rationale: L’hébreu porte le collectif défini singulier « le peuple ». La traduction en conserve la forme sans ajouter le possessif interprétatif « leur ».
theological_decisions:
- issue: Traduction de עֲצַבֵּיהֶם dans le contexte cultuel
  choice: leurs idoles
  alternative: leurs images
  rationale: Le terme renvoie aux représentations cultuelles des divinités philistines. « Idoles » conserve la nuance négative habituelle du terme dans la Bible hébraïque, sans développer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. Le récit reste direct et conserve l’enchaînement des actions de l’hébreu. « Emportèrent » rend ici נשא plus précisément que le simple « prirent »; « des messagers » explicite sobrement le moyen implicite de l’annonce.
