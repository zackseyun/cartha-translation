  text: וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת הַ/יְלוּדִ֔ים אֲשֶׁ֥ר הָיוּ ל֖/וֹ בִּ/ירוּשָׁלִָ֑ם שַׁמּ֣וּעַ וְ/שׁוֹבָ֔ב נָתָ֖ן וּ/שְׁלֹמֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/004.yaml
  text: 'And these are the names of the children born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: fr
  text: 'Voici les noms des enfants qui lui naquirent à Jérusalem : Shammoua, Shobab, Nathan et Salomon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Cette formule introduit naturellement en français moderne la liste qui suit, tout en maintenant son lien avec le contexte.
- source_word: שְׁמוֹת
  choice: les noms de
  rationale: Le pluriel construit de « nom » sert à introduire une liste de personnes.
- source_word: הַיְלוּדִים אֲשֶׁר הָיוּ לוֹ
  choice: des enfants qui lui naquirent
  rationale: Le participe passif signifie littéralement « ceux qui étaient nés » et la construction avec ל exprime ici le rapport à David. « Les enfants qui lui naquirent » conserve la notion de naissance sans substituer au texte le nom ordinaire pour « fils ».
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, « naître à » est la tournure idiomatique pour indiquer le lieu de naissance.
- source_word: שַׁמּוּעַ
  choice: Shammoua
  rationale: Translittération française usuelle du nom hébreu, avec « ou » pour rendre le son /u/.
- source_word: שׁוֹבָב
  choice: Shobab
  rationale: Translittération du nom propre hébreu adaptée à l'usage français.
- source_word: נָתָן
  choice: Nathan
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française traditionnelle établie du nom hébreu.
