lexical_decisions:
- source_word: יִבְחָר
  choice: Yibhar
  rationale: Nom propre translittéré d’après l’hébreu massorétique. « Y » rend ici naturellement la consonne initiale yod en français.
- source_word: אֱלִישׁוּעַ
  choice: Élishoua
  rationale: Nom propre translittéré directement d’après la forme du texte massorétique des Chroniques; la graphie française emploie « sh » et « ou » pour rendre clairement les sons hébreux.
- source_word: אֶלְפָּלֶט
  choice: Elpélet
  rationale: Nom propre translittéré selon la vocalisation massorétique, avec des accents adaptés à une lecture française naturelle.
- source_word: וְ
  choice: et
  rationale: La conjonction préfixée coordonne simplement le dernier nom avec les précédents.
