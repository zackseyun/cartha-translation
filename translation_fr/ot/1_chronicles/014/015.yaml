revisions:
- from: Quand tu entendras un bruit de pas dans la cime des arbres à baume[a], alors pars au combat, car Dieu sera sorti devant toi pour frapper le camp des Philistins.
  to: Quand tu entendras un bruit de pas au sommet des arbres à baume[a], alors pars au combat, car Dieu est déjà sorti devant toi pour frapper le camp des Philistins.
  rationale: La révision corrige une tournure spatiale peu naturelle et remplace un futur antérieur lourd par un parfait français accompagné de « déjà », qui rend explicitement l'action divine accomplie avant l'action ordonnée. Elle maintient l'ambiguïté botanique et le niveau de précision du texte source.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:40:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : le signe auditif, l''ordre d''aller au combat, l''action préalable de Dieu et la cible philistine sont tous conservés. « Bruit de pas » rend bien קול הצעדה sans imposer explicitement une armée. Le parfait יצא présente l''action divine comme accomplie au moment du signe ; le futur antérieur proposé est défendable, mais moins naturel et plus lourd en français dans cette parole directe.'
  naturalness: « Dans la cime des arbres » est maladroit, car plusieurs arbres n'ont pas une seule « cime » collective. « Au sommet des arbres » est idiomatique. « Dieu sera sorti devant toi » est grammatical, mais sonne administratif et peu naturel ; « Dieu est déjà sorti devant toi » exprime clairement l'antériorité pertinente dans une instruction prospective.
  terminology: « Dieu », « Philistins » et « arbres à baume » conviennent. La note conserve à juste titre l'incertitude botanique et les principales solutions traditionnelles. « Baca » est la translittération française/internationale plus habituelle que « baka ».
  issues:
  - severity: low
    issue: Localisation dans les arbres
    rationale: « Dans la cime des arbres » emploie un singulier collectif peu naturel avec « arbres ». Le pluriel du texte hébreu appelle naturellement « au sommet des arbres ».
  - severity: medium
    issue: Rendu de l'antériorité de l'action divine
    rationale: « Dieu sera sorti devant toi » cherche à rendre le parfait dans un cadre futur, mais reste raide en français moderne. « Dieu est déjà sorti devant toi » conserve l'accompli et rend explicitement l'antériorité sans modifier le sens.
  - severity: low
    issue: Translittération dans la note
    rationale: « Baca » correspond mieux à la forme internationale courante et à la note anglaise que « baka ».
  revised_text: Quand tu entendras un bruit de pas au sommet des arbres à baume[a], alors pars au combat, car Dieu est déjà sorti devant toi pour frapper le camp des Philistins.
  revised_footnotes:
  - marker: a
    text: Ou « arbres baca » ; traditionnellement « mûriers ». L’espèce exacte désignée par le mot hébreu est incertaine.
    reason: lexical_alternative
  revision_rationale: La révision corrige une tournure spatiale peu naturelle et remplace un futur antérieur lourd par un parfait français accompagné de « déjà », qui rend explicitement l'action divine accomplie avant l'action ordonnée. Elle maintient l'ambiguïté botanique et le niveau de précision du texte source.
