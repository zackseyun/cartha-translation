  text: וִ֠/יהִי כְּֽ/שָׁמְעֲ/ךָ֞ אֶת ק֤וֹל הַ/צְּעָדָה֙ בְּ/רָאשֵׁ֣י הַ/בְּכָאִ֔ים אָ֖ז תֵּצֵ֣א בַ/מִּלְחָמָ֑ה כִּֽי יָצָ֤א הָֽ/אֱלֹהִים֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת אֶת מַחֲנֵ֥ה פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/015.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then go out to battle, for God has gone out before you to strike down the camp of the Philistines.
translation:
  language: fr
  text: Quand tu entendras un bruit de pas au sommet des arbres à baume[a], alors pars au combat, car Dieu est déjà sorti devant toi pour frapper le camp des Philistins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « arbres baca » ; traditionnellement « mûriers ». L’espèce exacte désignée par le mot hébreu est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי כְּשָׁמְעֲךָ
  choice: Quand tu entendras
  rationale: La construction avec כְּ et l’infinitif construit introduit la circonstance temporelle. Le futur français convient à cette instruction portant sur le signe à venir, sans ajouter l’idée plus précise de « dès que ».
- source_word: קוֹל הַצְּעָדָה
  choice: un bruit de pas
  rationale: קוֹל désigne ici un phénomène audible et צְעָדָה l’action de marcher ou de faire des pas. « Bruit de pas » reste concret et évite de préciser indûment qu’il s’agit d’une armée en marche.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: dans la cime des arbres à baume
  rationale: רָאשִׁים désigne les parties hautes des arbres. L’identification botanique de בְּכָאִים demeure incertaine ; « arbres à baume » donne une désignation compréhensible, assortie d’une note.
- source_word: אָז תֵּצֵא בַמִּלְחָמָה
  choice: alors pars au combat
  rationale: אָז marque la conséquence temporelle ; יצא signifie sortir ou partir, et le contexte militaire donne naturellement « pars au combat ».
- source_word: כִּי יָצָא הָאֱלֹהִים לְפָנֶיךָ
  choice: car Dieu sera sorti devant toi
  rationale: כִּי introduit la raison de l’ordre. Le parfait יָצָא présente l’action divine comme accomplie au moment où le signe sera entendu ; le futur antérieur français préserve cette antériorité et « devant toi » conserve l’image militaire.
- source_word: לְהַכּוֹת אֶת מַחֲנֵה פְלִשְׁתִּים
  choice: pour frapper le camp des Philistins
  rationale: L’infinitif hiphil de נכה exprime ici le but de la sortie de Dieu. « Frapper » conserve l’image verbale et sa force militaire sans remplacer explicitement l’action par son résultat (« vaincre »).
theological_decisions:
- issue: Sens de הָאֱלֹהִים
  choice: Dieu
  alternative: les dieux
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים commande ici un verbe singulier et désigne le Dieu d’Israël ; le singulier français est donc requis.
- issue: Temporalité de יָצָא appliqué à l’action divine
  choice: sera sorti
  alternative: est sorti / sortira
  rationale: Dans cette instruction prospective, le parfait présente la sortie de Dieu comme déjà accomplie lorsque David percevra le signe. Le futur antérieur rend cette relation sans réduire la déclaration à un présent général ni gommer son aspect accompli.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier correspond à l’adresse à David. La formulation conserve le signe auditif, le mouvement de Dieu précédant David au combat et l’incertitude botanique.
