source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ דָּוִ֔יד כַּֽ/אֲשֶׁ֥ר צִוָּ֖/הוּ הָֽ/אֱלֹהִ֑ים וַ/יַּכּוּ֙ אֶת מַחֲנֵ֣ה פְלִשְׁתִּ֔ים מִ/גִּבְע֖וֹן וְ/עַד גָּֽזְרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/016.yaml
  text: So David did as God had commanded him, and they struck down the Philistine army from Gibeon as far as Gezer.
translation:
  language: fr
  text: David fit donc ce que Dieu lui avait ordonné, et ils battirent l’armée philistine[a] depuis Guibéon jusqu’à Guézer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le camp des Philistins ». Le mot « camp » peut ici désigner l’armée qui y est rassemblée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ דָּוִיד כַּאֲשֶׁר
  choice: David fit donc ce que
  rationale: La tournure exprime simplement que David agit conformément à l’ordre reçu. « Fit ce que » est naturel en français moderne, tandis que « donc » marque la progression du récit.
- source_word: צִוָּהוּ הָאֱלֹהִים
  choice: Dieu lui avait ordonné
  rationale: Le plus-que-parfait indique naturellement que l’ordre divin précède son exécution. Malgré l’article hébreu, הָאֱלֹהִים désigne ici Dieu comme nom propre.
- source_word: וַיַּכּוּ
  choice: ils battirent
  rationale: La forme verbale est plurielle et renvoie à David avec ses hommes. Dans ce contexte militaire, נכה décrit le fait de frapper ou de vaincre; « battirent » conserve la vigueur de l’action sans ajouter une idée d’extermination.
- source_word: מַחֲנֵה פְלִשְׁתִּים
  choice: l’armée philistine
  rationale: מַחֲנֶה signifie littéralement « camp », mais peut désigner par métonymie les forces qui y sont rassemblées. Ici, « armée » rend clairement le référent militaire en français courant; le sens littéral est signalé en note.
- source_word: מִגִּבְעוֹן וְעַד גָּזְרָה
  choice: depuis Guibéon jusqu’à Guézer
  rationale: La construction indique l’étendue géographique de l’action. « Depuis… jusqu’à… » rend explicitement le point de départ et la limite.
theological_decisions:
- issue: Sujet du verbe pluriel וַיַּכּוּ
  choice: '« ils » : David et ses hommes'
  alternative: David seul comme sujet exprimé au singulier dans la traduction
  rationale: Le verbe hébreu est morphologiquement pluriel. Le pronom « ils » préserve ce détail et laisse le contexte identifier David et ses forces comme acteurs.
- issue: Référent de מַחֲנֵה פְלִשְׁתִּים
  choice: les forces militaires philistines
  alternative: le camp matériel des Philistins
  rationale: Le contexte de combat favorise l’emploi métonymique de « camp » pour les troupes, sans exclure que le terme évoque leur campement.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms de lieux suivent les formes françaises usuelles « Guibéon » et « Guézer ». Le pronom pluriel « ils » est maintenu pour refléter précisément la grammaire hébraïque.
