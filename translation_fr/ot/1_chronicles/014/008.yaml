  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּי נִמְשַׁ֨ח דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל כָּל יִשְׂרָאֵ֔ל וַ/יַּעֲל֥וּ כָל פְּלִשְׁתִּ֖ים לְ/בַקֵּ֣שׁ אֶת דָּוִ֑יד וַ/יִּשְׁמַ֣ע דָּוִ֔יד וַ/יֵּצֵ֖א לִ/פְנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/008.yaml
  text: When the Philistines heard that David had been anointed king over all Israel[a], all the Philistines went up to seek David. And David heard, and went out before them.
translation:
  language: fr
  text: Lorsque les Philistins apprirent que David avait reçu l’onction comme roi sur tout Israël, tous les Philistins montèrent à la recherche de David. David l’apprit et sortit devant eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sortit à leur rencontre » ou « sortit pour les affronter ». L’hébreu dit littéralement « sortit devant eux » ; dans ce contexte, l’expression peut évoquer un affrontement militaire sans l’énoncer explicitement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ / וַיִּשְׁמַע
  choice: apprirent / l’apprit
  rationale: Dans ce récit, שׁמע désigne le fait de recevoir une nouvelle. La répétition du verbe français rappelle le lien narratif entre ce qu’apprennent les Philistins et ce qu’apprend David.
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française usuelle de ce peuple dans le récit biblique.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de la nouvelle apprise par les Philistins.
- source_word: נִמְשַׁח דָּוִיד לְמֶלֶךְ
  choice: David avait reçu l’onction comme roi
  rationale: Cette formulation exprime le passif de משׁח et la fonction royale indiquée par לְמֶלֶךְ, tout en restant claire en français moderne. Le plus-que-parfait marque l’antériorité par rapport à la nouvelle reçue.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sur tout Israël
  rationale: La préposition עַל indique ici l’étendue de l’autorité royale de David.
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: Le verbe עלה signifie littéralement « monter » et conserve ici la perspective géographique du récit sans ajouter explicitement l’idée d’une marche militaire.
- source_word: כָל פְּלִשְׁתִּים
  choice: tous les Philistins
  rationale: Cette traduction conserve l’expression collective et emphatique du texte hébreu sans la réduire explicitement à une armée.
- source_word: לְבַקֵּשׁ אֶת דָּוִיד
  choice: à la recherche de David
  rationale: בקשׁ signifie « chercher ». Le contexte laisse entendre une intention hostile, mais cette formulation ne la précise pas au-delà du texte.
- source_word: וַיֵּצֵא לִפְנֵיהֶם
  choice: sortit devant eux
  rationale: Cette traduction conserve au plus près l’image de לִפְנֵיהֶם, « devant eux », sans décider si David alla simplement à leur rencontre ou s’avança pour les affronter.
theological_decisions: []
