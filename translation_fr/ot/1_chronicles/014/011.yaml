source:
  edition: WLC
  text: וַ/יַּעֲל֥וּ בְּ/בַֽעַל פְּרָצִים֮ וַ/יַּכֵּ֣/ם שָׁ֣ם דָּוִיד֒ וַ/יֹּ֣אמֶר דָּוִ֔יד פָּרַ֨ץ הָֽ/אֱלֹהִ֧ים אֶת אוֹיְבַ֛/י בְּ/יָדִ֖/י כְּ/פֶ֣רֶץ מָ֑יִם עַל כֵּ֗ן קָֽרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בַּ֥עַל פְּרָצִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/011.yaml
  text: So they went up to Baal-perazim[a], and David struck them down there. And David said, “God has broken through my enemies by my hand, like a bursting flood of waters.” Therefore they called the name of that place Baal-perazim.
translation:
  language: fr
  text: 'Ils montèrent donc à Baal-Peratsim[a], et David les battit là. David dit : « Dieu a ouvert une brèche chez mes ennemis par ma main, comme les eaux qui font une brèche. » C’est pourquoi on donna à ce lieu le nom de Baal-Peratsim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Baal-Peratsim » évoque le « maître des brèches » et fait écho au mot traduit par « a ouvert une brèche » dans la déclaration de David.
    reason: Jeu de mots étymologique essentiel entre le nom du lieu et la déclaration de David.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Ils montèrent
  rationale: Le verbe עלה décrit couramment une montée ou une progression militaire. « Montèrent » conserve l’image directionnelle sans préciser indûment la tactique.
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: à Baal-Peratsim / Baal-Peratsim
  rationale: Le nom de lieu est translittéré. La forme « Peratsim » garde un lien audible avec la racine hébraïque פרץ, dont le jeu de mots est expliqué en note.
- source_word: וַיַּכֵּם
  choice: David les battit
  rationale: Dans un contexte militaire, נכה peut signifier frapper ou vaincre. « Les battit » exprime clairement la défaite infligée sans ajouter explicitement qu’ils furent tous tués.
- source_word: פָּרַץ
  choice: a ouvert une brèche
  rationale: פרץ évoque l’action de rompre, de faire irruption ou d’ouvrir une brèche. Cette formulation conserve le jeu lexical avec Peratsim et prépare la comparaison avec les eaux.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Malgré l’article en hébreu, le terme désigne ici Dieu comme sujet singulier, ce que confirme le verbe au singulier.
- source_word: אֶת אוֹיְבַי
  choice: parmi mes ennemis
  rationale: Avec « ouvrir une brèche », le complément direct hébreu se rend naturellement en français par « parmi mes ennemis », en exprimant que Dieu a rompu leurs rangs.
- source_word: בְּיָדִי
  choice: par ma main
  rationale: La traduction conserve l’image hébraïque de la main comme moyen d’action, tout en attribuant explicitement l’initiative et la victoire à Dieu.
- source_word: כְּפֶרֶץ מָיִם
  choice: comme une brèche ouverte par les eaux
  rationale: L’expression représente des eaux qui rompent une barrière et ouvrent une brèche. La répétition de « brèche » maintient le jeu de mots central de la phrase.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Connecteur causal naturel en français narratif moderne.
- source_word: קָרְאוּ שֵׁם הַמָּקוֹם הַהוּא
  choice: on donna à ce lieu le nom de
  rationale: Le verbe hébreu est à la troisième personne du pluriel indéfini. Le pronom français « on » le rend naturellement sans harmoniser avec un sujet singulier.
theological_decisions:
- issue: Articulation de l’action divine et de l’action humaine
  choice: Dieu est le sujet de la victoire, accomplie « par ma main »
  alternative: Réduire l’expression à « Dieu m’a donné la victoire » ou faire de David le sujet principal
  rationale: Le singulier פָּרַץ attribue l’action à Dieu, tandis que בְּיָדִי présente David comme l’instrument humain. La traduction conserve ces deux affirmations sans effacer leur tension.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve la répétition de « brèche », volontaire en raison du jeu de mots hébreu, ainsi que l’expression imagée « par ma main ».
