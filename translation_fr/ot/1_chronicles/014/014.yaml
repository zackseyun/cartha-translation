  yaml_path: translation/ot/1_chronicles/014/014.yaml
  text: So David inquired of God again[a], and God said to him, “You shall not go up after them. Circle around from behind them, and come against them opposite the balsam trees.”
translation:
  language: fr
  text: 'David consulta de nouveau Dieu, et Dieu lui dit : « Ne monte pas à leur poursuite. Détourne-toi d’eux et viens contre eux en face des arbres à baume[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les bekhaïm » ; l’espèce exacte de ces arbres est incertaine. On traduit aussi traditionnellement par « mûriers ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל עוֹד דָּוִיד בֵּאלֹהִים
  choice: David consulta de nouveau Dieu
  rationale: Le verbe שׁאל construit avec ב exprime ici la recherche d’une directive divine. « Consulter Dieu » rend ce sens naturellement, tandis que « de nouveau » traduit la répétition marquée par עוֹד.
- source_word: וַיֹּאמֶר לוֹ הָאֱלֹהִים
  choice: et Dieu lui dit
  rationale: Formule narrative simple, rendue sans explicitation supplémentaire.
- source_word: לֹא תַעֲלֶה אַחֲרֵיהֶם
  choice: Ne monte pas à leur poursuite
  rationale: « Monter » conserve l’image de עלה, qui peut désigner une avancée militaire, et « à leur poursuite » rend אַחֲרֵיהֶם sans transformer la phrase en ordre explicite d’attaque.
- source_word: הָסֵב מֵעֲלֵיהֶם
  choice: Contourne-les
  rationale: L’impératif demande un changement de direction ou un mouvement de contournement. Cette formulation française exprime clairement la manœuvre sans imposer la précision « par-derrière », absente de la formulation massorétique de ce verset.
- source_word: וּבָאתָ לָהֶם
  choice: et viens les attaquer
  rationale: Dans ce contexte militaire, בוא avec ל indique que David doit venir contre l’ennemi. « Attaquer » explicite sobrement la valeur contextuelle du mouvement hostile.
- source_word: מִמּוּל
  choice: en face de
  rationale: Le terme indique une position vis-à-vis ou à l’opposé d’un repère.
- source_word: הַבְּכָאִים
  choice: les arbres à baume
  rationale: L’identification botanique demeure incertaine. « Arbres à baume » reflète une interprétation lexicale courante et reste intelligible, tandis qu’une note signale l’incertitude.
