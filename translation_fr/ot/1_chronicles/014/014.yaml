review_pass:
  verdict: revise
  source_fidelity: « David consulta de nouveau Dieu » rend bien וַיִּשְׁאַל עוֹד ... בֵּאלֹהִים. La défense de monter « à leur poursuite » est recevable pour אַחֲרֵיהֶם. En revanche, « Contourne-les » ne rend pas suffisamment מֵעֲלֵיהֶם (« en t’écartant d’eux / loin d’eux ») et peut suggérer que les Philistins eux-mêmes constituent le repère immédiat à contourner. « Viens les attaquer » explicite plus que le simple mouvement hostile de וּבָאתָ לָהֶם; « viens contre eux » conserve mieux la formulation source.
  naturalness: La phrase est fluide et de registre narratif moderne. « Détourne-toi d’eux » est naturel, clair et plus proche de l’hébreu que « Contourne-les ».
  terminology: « Dieu », « arbres à baume » et la note d’incertitude botanique conviennent. La translittération « bekhaïm » est acceptable; la note signale utilement que « mûriers » est une traduction traditionnelle plutôt qu’une identification certaine.
  issues:
  - severity: medium
    issue: « Contourne-les » atténue ou déplace le sens de מֵעֲלֵיהֶם.
    rationale: Le texte massorétique ordonne de se détourner / s’écarter d’eux; contrairement au parallèle de 2 Samuel 5:23, il ne précise pas « par-derrière ». Une formulation qui garde l’éloignement évite d’importer cette précision.
  - severity: low
    issue: « Viens les attaquer » est légèrement plus explicite que וּבָאתָ לָהֶם.
    rationale: Dans le contexte militaire, le mouvement est bien hostile, mais « viens contre eux » maintient l’ambiguïté contrôlée du verbe hébreu tout en restant idiomatique.
