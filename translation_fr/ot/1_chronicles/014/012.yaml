source:
  edition: WLC
  text: וַ/יַּעַזְבוּ שָׁ֖ם אֶת אֱלֹֽהֵי/הֶ֑ם וַ/יֹּ֣אמֶר דָּוִ֔יד וַ/יִּשָּׂרְפ֖וּ בָּ/אֵֽשׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/012.yaml
  text: And they left their gods there[a], and David gave the order[b], and they were burned with fire.
translation:
  language: fr
  text: Ils laissèrent là leurs dieux[a]. David donna alors l’ordre[b], et ces dieux furent brûlés au feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs idoles ». L’hébreu dit littéralement « leurs dieux », mais il s’agit vraisemblablement de leurs représentations cultuelles.
    reason: lexical_alternative
  - marker: b
    text: 'Le récit parallèle de 2 Samuel 5.21 dit plutôt : « David et ses hommes les emportèrent. » Ici, les Chroniques rapportent qu’ils furent brûlés au feu sur l’ordre de David.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: ils laissèrent
  rationale: Le verbe עזב peut signifier « laisser » ou « abandonner ». Ici, « laissèrent » décrit naturellement les objets abandonnés sur place, sans accentuer outre mesure l’idée de renoncement religieux.
- source_word: שָׁם
  choice: là
  rationale: L’adverbe indique simplement le lieu et se rend directement par « là ».
- source_word: אֶת אֱלֹהֵיהֶם
  choice: leurs dieux
  rationale: L’hébreu dit littéralement « leurs dieux ». Dans le contexte, il s’agit vraisemblablement de leurs représentations cultuelles, mais le texte ne choisit pas ici le terme plus explicite « idoles ».
- source_word: וַיֹּאמֶר דָּוִיד
  choice: David donna alors l’ordre
  rationale: Littéralement, « David dit ». Comme aucune parole n’est citée et que la proposition suivante en rapporte l’exécution, la formulation française exprime naturellement la valeur directive de cette parole.
- source_word: וַיִּשָּׂרְפוּ
  choice: ils furent brûlés
  rationale: La forme est comprise ici dans un sens passif, avec « leurs dieux » comme antécédent. Cette traduction évite d’introduire un sujet agent explicite absent du texte.
- source_word: בָּאֵשׁ
  choice: au feu
  rationale: La préposition indique ici le moyen de destruction. « Brûlés au feu » est une formulation française claire qui conserve la mention explicite du feu.
theological_decisions:
- issue: Désignation des objets cultuels philistins par אֱלֹהֵיהֶם
  choice: leurs dieux
  alternative: leurs idoles
  rationale: La traduction conserve le terme employé par le texte hébreu et laisse une note préciser son référent probable, au lieu de substituer dans le corps du verset une qualification interprétative.
- issue: Rapport avec le récit parallèle de 2 Samuel 5.21
  choice: 'suivre la formulation propre aux Chroniques : ordre de David, puis destruction par le feu'
  alternative: harmoniser avec 2 Samuel en disant que David et ses hommes les emportèrent
  rationale: Le texte des Chroniques doit être traduit selon sa propre formulation, sans effacer la différence avec le récit parallèle.
translation_notes:
  register: Français moderne, courant et digne. Le passé simple convient au récit historique écrit. La formulation garde « leurs dieux » dans le texte principal, tout en expliquant le référent probable en note, et préserve le passif hébreu dans la dernière proposition.
