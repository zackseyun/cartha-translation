source:
  edition: WLC
  text: וַ/יִּשְׁאַ֨ל דָּוִ֤יד בֵּ/אלֹהִים֙ לֵ/אמֹ֔ר הַ/אֶֽעֱלֶה֙ עַל פלשתיים וּ/נְתַתָּ֖/ם בְּ/יָדִ֑/י וַ/יֹּ֨אמֶר ל֤/וֹ יְהוָה֙ עֲלֵ֔ה וּ/נְתַתִּ֖י/ם בְּ/יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/010.yaml
  text: And David inquired of God[a], saying, “Shall I go up against the Philistines, and will you give them into my hand?” And Yahweh said to him, “Go up, and I will give them into your hand.”
translation:
  language: fr
  text: 'David consulta Dieu en disant : « Dois-je monter contre les Philistins ? Les livreras-tu entre mes mains[a] ? » Yahvé lui répondit : « Monte, et je les livrerai entre tes mains. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les donneras-tu dans ma main ? » Cette expression hébraïque signifie les livrer au pouvoir de David.'
    reason: Précision sur l'idiome hébreu נתן ביד et sur son image littérale.
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: consulta Dieu
  rationale: Dans ce contexte, שׁאל avec בְּ désigne une demande de direction adressée à Dieu. « Consulter Dieu » exprime naturellement en français une démarche solennelle, et non une simple question.
- source_word: הַאֶעֱלֶה
  choice: Dois-je monter
  rationale: La question porte sur l'opportunité d'entreprendre l'offensive. « Monter » conserve le verbe de mouvement עלה ainsi que sa reprise dans l'impératif divin.
- source_word: עַל פלשתיים
  choice: contre les Philistins
  rationale: Dans ce contexte militaire, עַל indique un mouvement hostile dirigé contre les Philistins.
- source_word: וּנְתַתָּם בְּיָדִי / וּנְתַתִּים בְּיָדֶךָ
  choice: les livreras-tu entre mes mains / je les livrerai entre tes mains
  rationale: L'expression נתן ביד signifie placer quelqu'un au pouvoir d'un autre. « Livrer entre les mains » est une tournure française naturelle qui conserve l'image hébraïque et la symétrie entre la question et la réponse.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le texte porte le nom divin YHWH. « Yahvé » est sa forme française courante et le distingue d'un simple titre comme « le Seigneur ».
- source_word: עֲלֵה
  choice: Monte
  rationale: L'impératif reprend exactement la racine עלה employée dans la question de David; la répétition est donc maintenue.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le verset emploie directement le tétragramme, nom propre du Dieu d'Israël. Sa transcription française préserve cette distinction sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue reste direct; la répétition de « monter » et de « livrer entre les mains » reproduit la structure du texte hébreu.
