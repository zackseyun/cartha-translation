  text: וַ/יֵּ֣דַע דָּוִ֔יד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל כִּֽי נִשֵּׂ֤את לְ/מַ֨עְלָ/ה֙ מַלְכוּת֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/002.yaml
  text: And David knew that Yahweh had established him as king over Israel[b][a], for his kingdom had been greatly exalted for the sake of his people Israel.
translation:
  language: fr
  text: David reconnut que Yahweh l’avait établi roi sur Israël, car son royaume avait été hautement élevé[a] pour le bien de son peuple Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avait été élevé très haut ».'
    reason: lexical_alternative
  - marker: b
    text: Le possessif peut désigner Yahweh — Israël étant alors le peuple de Yahweh — ou David.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: reconnut
  rationale: Le qal de ידע peut exprimer ici la prise de conscience ou la reconnaissance d’un fait. « Reconnut » convient au récit et reste plus naturel que le simple « sut » dans ce contexte.
- source_word: הֱכִינוֹ
  choice: l’avait établi
  rationale: Le hifil de כון exprime l’idée d’établir fermement ou de confirmer. Cette formulation convient à l’accession de David à la fonction royale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לְמֶלֶךְ
  choice: roi
  rationale: Après « établir », le français naturel dit « établir quelqu’un roi » pour exprimer sa nomination ou sa confirmation dans cette fonction.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: Dans ce contexte royal, עַל indique l’autorité exercée sur Israël.
- source_word: נִשֵּׂאת לְמַעְלָה
  choice: avait été grandement exalté
  rationale: Le nifal de נשׂא avec לְמַעְלָה décrit une élévation remarquable. Cette traduction exprime l’accroissement du rang ou du prestige tout en conservant la forme passive.
- source_word: מַלְכוּתוֹ
  choice: son royaume
  rationale: מַלְכוּת peut désigner le royaume, la royauté ou le règne. « Son royaume » est direct et intelligible, sans exclure l’idée de pouvoir royal.
- source_word: בַּעֲבוּר
  choice: pour le bien de
  rationale: 'La préposition indique ici le but ou le bénéfice : l’élévation du royaume sert le peuple d’Israël.'
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: son peuple Israël
  rationale: Cette formulation suit de près l’hébreu et conserve naturellement l’ambiguïté du possessif, qui peut grammaticalement renvoyer à Yahweh ou à David.
theological_decisions:
- issue: Référent du possessif dans « son peuple Israël »
  choice: Conserver l’ambiguïté du possessif dans le texte principal, avec une préférence contextuelle possible pour Yahweh
  alternative: Expliciter « le peuple de Yahweh » ou « le peuple de David »
  rationale: L’hébreu עַמּוֹ permet formellement les deux référents. Le contexte théologique des Chroniques favorise Israël comme peuple de Yahweh, mais le français « son peuple » préserve sans difficulté la tension du texte source.
- issue: Valeur du second כִּי
  choice: 'Valeur causale : « car »'
  alternative: 'Valeur explicative ou complétive : « que »'
  rationale: 'La seconde proposition explique comment David reconnaît que Yahweh l’a établi : l’élévation de son royaume en constitue le signe ou le motif.'
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la syntaxe hébraïque tout en étant lisible; elle conserve la voix passive et l’ambiguïté réelle du possessif.
