  text: The Philistines came and raided the Valley of Rephaim[a].
translation:
  language: fr
  text: Les Philistins arrivèrent et firent une incursion dans la vallée de Refaïm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se déployèrent dans la vallée de Refaïm ». Le verbe hébreu peut désigner le fait de se déployer ou d’effectuer une incursion ; le contexte indique une opération militaire hostile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Les Philistins
  rationale: פְלִשְׁתִּים est le nom du peuple philistin. La conjonction וּ assure ici la continuité du récit et peut rester implicite en français naturel.
- source_word: בָּאוּ
  choice: vinrent
  rationale: Le qal accompli de בוא signifie « venir ». Le passé simple convient au registre narratif biblique tout en restant clair en français moderne.
- source_word: וַיִּפְשְׁטוּ
  choice: faire une incursion
  rationale: Dans ce contexte militaire, פשט peut désigner le fait de se déployer ou d'effectuer une incursion. « Faire une incursion » exprime l'action hostile sans ajouter explicitement l'idée de pillage.
- source_word: בְּ/עֵמֶק
  choice: dans la vallée de
  rationale: עֵמֶק désigne une vallée et la préposition בְּ est rendue directement par « dans ».
- source_word: רְפָאִים
  choice: Refaïm
  rationale: Ici, רְפָאִים fait partie d'un nom de lieu. La translittération française « Refaïm » conserve le nom propre hébreu.
