source:
  edition: WLC
  text: וַ/יֵּצֵ֥א שֵׁם דָּוִ֖יד בְּ/כָל הָֽ/אֲרָצ֑וֹת וַֽ/יהוָ֛ה נָתַ֥ן אֶת פַּחְדּ֖/וֹ עַל כָּל הַ/גּוֹיִֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/017.yaml
  text: And David’s name went out into all the lands[b][a], and Yahweh put the fear of him on all the nations.
translation:
  language: fr
  text: Le nom de David se répandit dans tous les pays[a], et Yahweh fit peser sur toutes les nations la crainte de David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La renommée de David se répandit dans tous les pays. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sa crainte ». Le suffixe renvoie très probablement à David ; grammaticalement, il pourrait aussi renvoyer à Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא שֵׁם דָּוִיד
  choice: Le nom de David se répandit
  rationale: L’expression hébraïque dit littéralement que le « nom » de David « sortit ». En français, « se répandit » rend naturellement l’idée que sa réputation s’étendit, tout en conservant la métonymie biblique du « nom ».
- source_word: בְּכָל הָאֲרָצוֹת
  choice: dans tous les pays
  rationale: Le pluriel אֲרָצוֹת désigne ici les pays ou territoires environnants. « Dans tous les pays » est naturel en français moderne et convient au mouvement implicite de la renommée qui se répand.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: נָתַן אֶת פַּחְדּוֹ עַל
  choice: fit tomber […] la crainte de David
  rationale: La tournure française « faire tomber la crainte sur » rend l’expression hébraïque dans laquelle Yahweh place ou fait peser cette crainte sur les nations. La répétition de « David » clarifie le référent du suffixe sans alourdir la phrase.
- source_word: כָּל הַגּוֹיִם
  choice: toutes les nations
  rationale: גּוֹיִם désigne ici les peuples ou nations entourant Israël ; « nations » conserve cette portée collective et politique.
theological_decisions:
- issue: Référent du suffixe masculin singulier dans פַּחְדּוֹ (« sa crainte » / « la crainte de lui »)
  choice: 'Le suffixe renvoie à David : les nations éprouvent de la crainte devant David.'
  alternative: 'Le suffixe pourrait grammaticalement renvoyer à Yahweh : les nations éprouvent la crainte de Yahweh.'
  rationale: David est le référent masculin immédiatement mis en avant, et le contexte relie sa renommée à ses victoires accordées par Yahweh. La lecture retenue est donc la plus cohérente dans le contexte, tout en signalant dans une note l’ambiguïté formelle du suffixe hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image biblique du « nom » tout en employant « se répandit », idiomatique en français. « Fit tomber […] la crainte » garde la force causative de l’action divine sans résoudre silencieusement l’ambiguïté grammaticale, laquelle est explicitée en note.
