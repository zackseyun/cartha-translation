- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Forme française courante du nom de ce peuple, avec l’article défini requis par l’usage et le contexte.
- source_word: וַיִּפְשְׁטוּ
  choice: se déployèrent
  rationale: Dans ce contexte militaire, פשט décrit vraisemblablement des troupes qui s’étendent ou prennent position sur le terrain. « Se déployèrent » conserve cette idée sans préciser indûment qu’il s’agit d’un pillage.
- source_word: בָּעֵמֶק
  choice: dans la vallée
  rationale: La préposition ב est rendue dans son sens locatif le plus direct, et l’article hébreu par l’article défini français.
