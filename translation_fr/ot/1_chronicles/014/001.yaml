  text: וַ֠/יִּשְׁלַח חירם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִיד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י קִ֔יר וְ/חָרָשֵׁ֖י עֵצִ֑ים לִ/בְנ֥וֹת ל֖/וֹ בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/001.yaml
  text: Then Hiram king of Tyre sent messengers to David[a], and cedar timber, masons, and carpenters[b], to build a house for him.
translation:
  language: fr
  text: Hiram, roi de Tyr, envoya alors des messagers à David[a], ainsi que du bois de cèdre, des maçons et des charpentiers, pour lui construire une maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des envoyés ». Dans un contexte royal, le terme hébreu peut désigner des représentants officiels.
    reason: lexical_alternative
  - marker: b
    text: Ou « lui construire un palais ». Le mot hébreu traduit par « maison » peut désigner une résidence royale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya alors
  rationale: Le waw consécutif fait progresser le récit; « alors » rend naturellement cette succession en français sans surcharger la coordination.
- source_word: חירם
  choice: Hiram
  rationale: La forme consonantique de ce verset correspond à Hiram, nom traditionnellement employé en français pour le roi de Tyr.
- source_word: מֶלֶךְ צֹר
  choice: roi de Tyr
  rationale: La chaîne construite désigne directement la fonction et le royaume d’Hiram; l’apposition française se passe naturellement d’article.
- source_word: מַלְאָכִים
  choice: messagers
  rationale: Le terme désigne largement des personnes envoyées; dans ce contexte royal, « envoyés » est également possible, mais « messagers » préserve mieux l’étendue lexicale.
- source_word: וַעֲצֵי אֲרָזִים
  choice: ainsi que du bois de cèdre
  rationale: Il s’agit de matériau destiné à la construction plutôt que d’arbres vivants. « Ainsi que » relie naturellement les fournitures et les artisans à l’envoi.
- source_word: חָרָשֵׁי קִיר
  choice: des maçons
  rationale: L’expression désigne des artisans travaillant aux murs; « maçons » est le terme français précis et naturel dans ce contexte.
- source_word: חָרָשֵׁי עֵצִים
  choice: des charpentiers
  rationale: Le syntagme désigne des artisans du bois; dans le contexte d’un bâtiment, « charpentiers » est idiomatique.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: pour lui construire une maison
  rationale: L’infinitif exprime le but. « Maison » conserve le sens lexical direct de בַּיִת sans imposer l’interprétation contextuelle « palais ».
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe place le sujet en tête, conformément à l’usage narratif français, tout en conservant la progression du texte hébreu. « Maison » demeure dans le texte principal afin de préserver l’ambiguïté lexicale.
