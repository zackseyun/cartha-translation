source:
  edition: WLC
  text: וַ/יִּקַּ֨ח דָּוִ֥יד ע֛וֹד נָשִׁ֖ים בִּ/ירוּשָׁלִָ֑ם וַ/יּ֧וֹלֶד דָּוִ֛יד ע֖וֹד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/003.yaml
  text: And David took more wives in Jerusalem[a], and David fathered more sons and daughters.
translation:
  language: fr
  text: David prit d’autres femmes à Jérusalem[a], et il eut encore des fils et des filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « épousa d’autres femmes » ; l’hébreu dit littéralement « prit d’autres femmes ».
    reason: 'Alternative lexicale : « épousa » explicite la relation conjugale suggérée par le contexte, tandis que le texte principal conserve de plus près le verbe hébreu.'
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לָקַח signifie littéralement « prendre ». Dans ce contexte, « prit des femmes » conserve la formulation hébraïque, tandis que « épousa » expliciterait davantage la relation.
- source_word: עוֹד
  choice: encore
  rationale: 'עוֹד exprime ici l''ajout : David prit d''autres femmes et eut d''autres enfants. « Encore » restitue naturellement la répétition dans les deux propositions.'
- source_word: נָשִׁים
  choice: des femmes
  rationale: נָשִׁים peut désigner des femmes ou des épouses. Avec « prit », le français « prit des femmes » préserve cette latitude lexicale, tandis que le contexte indique qu'elles deviennent ses épouses.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition בְּ devant un nom de ville se rend naturellement par « à » en français.
- source_word: וַיּוֹלֶד
  choice: il eut
  rationale: La forme causative de ילד avec David comme sujet signifie qu'il devint père. « Il eut des fils et des filles » est idiomatique et précis en français moderne, sans l'archaïsme de « engendra ».
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: La traduction conserve la mention explicite des deux groupes plutôt que de généraliser par « des enfants ».
- source_word: דָּוִיד
  choice: David
  rationale: Forme française conventionnelle du nom propre.
theological_decisions:
- issue: Description narrative de la polygamie de David
  choice: Présenter le fait sans qualification morale ajoutée.
  alternative: Introduire une nuance d'approbation ou de désapprobation.
  rationale: Le verset rapporte que David prit d'autres femmes et eut d'autres enfants, mais ne formule lui-même aucun jugement moral. La traduction conserve cette neutralité narrative.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « encore » reflète celle de עוֹד dans les deux propositions. Le second « David » de l'hébreu est remplacé par « il » pour éviter une lourdeur peu naturelle en français, sans perte de référent.
