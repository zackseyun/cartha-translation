  text: וַ/אֲחֵי/הֶ֗ם רָאשִׁים֙ לְ/בֵ֣ית אֲבוֹתָ֔/ם אֶ֕לֶף וּ/שְׁבַ֥ע מֵא֖וֹת וְ/שִׁשִּׁ֑ים גִּבּ֣וֹרֵי חֵ֔יל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/013.yaml
  text: And their brothers[a], heads of their fathers’ houses[c][b], were 1,760 mighty men of valor for the work of the service of the house of God.
translation:
  language: fr
  text: 'Leurs frères[a], chefs de leurs maisons ancestrales, étaient au nombre de 1 760 : des hommes de valeur[b] pour le travail du service de la maison de Dieu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « membres de leur clan ». Le mot hébreu traduit par « frères » peut désigner des parents plus éloignés, et non seulement des frères au sens strict.
    reason: lexical_alternative
  - marker: b
    text: Ou « hommes vaillants » ou « hommes capables ». L’expression hébraïque évoque la force, la valeur ou une capacité reconnue; dans ce contexte, elle n’implique pas nécessairement le combat.
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire le temple.
    reason: clarification
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Leurs frères
  rationale: Le pluriel de אָח peut désigner des frères au sens propre ou, plus largement, des membres du même clan. « Frères » conserve l’image familiale du texte hébreu, tandis qu’une note signale l’extension possible du terme.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: chefs de leurs familles
  rationale: L’expression désigne les responsables des unités familiales ancestrales. Cette formulation est naturelle en français moderne; la traduction littérale « maisons de leurs pères » serait moins immédiatement compréhensible.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 1 760
  rationale: La suite numérique hébraïque donne 1 760; l’espace suit l’usage typographique français pour les milliers.
- source_word: גִּבּוֹרֵי חֵיל
  choice: des hommes forts et capables
  rationale: L’expression peut évoquer la vaillance, la force ou une aptitude reconnue. Puisque le contexte porte sur le service du sanctuaire plutôt que sur la guerre, « forts et capables » préserve sa valeur honorifique sans imposer un sens militaire.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: accomplir les tâches du service
  rationale: La formulation garde les deux notions du texte hébreu—le travail ou les tâches (מְלָאכָה) et le service (עֲבוֹדָה)—tout en évitant une tournure française pesante comme « le travail du service ».
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette traduction reproduit l’expression hébraïque et sa portée cultuelle sans la remplacer directement par le terme interprétatif « temple ».
theological_decisions:
- issue: Portée du terme de parenté masculin
  choice: frères
  alternative: parents; membres de leur clan
  rationale: Le contexte généalogique et cultuel concerne des hommes, et le terme hébreu est explicitement familial. « Frères » respecte cette donnée tout en laissant à la note la possibilité d’un sens clanique plus large.
- issue: Désignation du sanctuaire
  choice: maison de Dieu
  alternative: temple de Dieu
  rationale: Le texte source emploie « maison de Dieu ». Conserver cette expression évite de remplacer sans nécessité l’image théologique du texte par son référent explicité.
- issue: Valeur de גִּבּוֹרֵי חֵיל dans un contexte cultuel
  choice: hommes forts et capables
  alternative: hommes vaillants; vaillants guerriers
  rationale: L’expression marque une force ou une capacité reconnue, mais le contexte immédiat ne décrit pas une action militaire. La traduction maintient l’éloge sans transformer ces serviteurs en guerriers.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est divisée en deux phrases pour rendre clairement le nombre puis la qualification des hommes. « Familles » restitue naturellement l’unité ancestrale exprimée par l’idiome hébreu, tandis que « maison de Dieu » conserve l’image du texte source.
