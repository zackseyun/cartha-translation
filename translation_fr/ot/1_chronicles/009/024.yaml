  text: לְ/אַרְבַּ֣ע רוּח֔וֹת יִהְי֖וּ הַ/שֹּׁעֲרִ֑ים מִזְרָ֥ח יָ֖מָּ/ה צָפ֥וֹנָ/ה וָ/נֶֽגְבָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/024.yaml
  text: 'The gatekeepers were at the four directions: east[a], west, north, and south.'
translation:
  language: fr
  text: 'Les gardiens des portes se tenaient aux quatre points cardinaux[a] : à l’est, à l’ouest, au nord et au sud.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux quatre vents » ; ici, les « vents » désignent les quatre directions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: aux quatre points cardinaux
  rationale: Littéralement « aux quatre vents » ; dans cette énumération des orientations, l’expression désigne clairement les quatre directions. « Points cardinaux » est naturel et précis en français.
- source_word: יִהְיוּ
  choice: se tenaient
  rationale: Le verbe signifie simplement « être ». « Se tenaient » exprime ici la présence des gardiens à ces emplacements sans ajouter explicitement l’idée d’une affectation.
- source_word: הַשֹּׁעֲרִים
  choice: les gardiens des portes
  rationale: Le nom désigne les personnes chargées de surveiller les portes. Cette formulation est claire, moderne et adaptée au contexte du sanctuaire.
- source_word: מִזְרָח יָמָּה צָפוֹנָה וָנֶגְבָּה
  choice: à l’est, à l’ouest, au nord et au sud
  rationale: Les formes directionnelles hébraïques énumèrent les quatre orientations. יָמָּה, littéralement « vers la mer », signifie ici l’ouest, et נֶגְבָּה désigne ici le sud plutôt que la région du Néguev.
