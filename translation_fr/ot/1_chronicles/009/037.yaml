  text: Guedor, Ahio, Zacharie et Mikloth.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/גְד֣וֹר
  choice: Guedor
  rationale: Nom propre précédé de la conjonction ו. La forme « Guedor » suit l’usage français et maintient la prononciation dure du g hébreu.
- source_word: וְ/אַחְי֔וֹ
  choice: Ahio
  rationale: Nom propre translittéré plutôt que traduit. La conjonction hébraïque est rendue par la coordination naturelle de l’énumération française.
- source_word: וּ/זְכַרְיָ֖ה
  choice: Zacharie
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu זְכַרְיָה.
- source_word: וּ/מִקְלֽוֹת
  choice: Mikloth
  rationale: Translittération française lisible du nom propre hébreu; le h final conserve la forme biblique courante sans lui attribuer une valeur phonétique particulière.
