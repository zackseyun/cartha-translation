id: 1CH.9.23
reference: 1 Chronicles 9:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵ֨ם וּ/בְנֵי/הֶ֜ם עַל הַ/שְּׁעָרִ֧ים לְ/בֵית יְהוָ֛ה לְ/בֵ֥ית הָ/אֹ֖הֶל לְ/מִשְׁמָרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/023.yaml
  text: They and their sons were over the gates of the house of Yahweh[a], that is, the house of the tent, as guards.
translation:
  language: fr
  text: Eux et leurs fils étaient responsables des portes de la maison de Yahvé, c’est-à-dire de la maison de la tente[a], où ils assuraient la garde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la maison du tabernacle ». L’hébreu dit littéralement : « la maison de la tente ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Eux
  rationale: Le pronom reprend le groupe déjà mentionné. « Eux » rend cette reprise avec naturel sans imposer en français le « et » initial hébreu.
- source_word: וּבְנֵיהֶם
  choice: et leurs fils
  rationale: Dans ce contexte de fonction héréditaire, בנים désigne les fils ou descendants masculins plutôt que les enfants en général.
- source_word: עַל הַשְּׁעָרִים
  choice: étaient responsables des portes
  rationale: Avec עַל, le contexte indique une responsabilité de surveillance, et non une simple position auprès des portes.
- source_word: לְבֵית יְהוָה
  choice: des portes de la maison de Yahvé
  rationale: La tournure rattache les portes au sanctuaire; « maison de Yahvé » conserve l’expression hébraïque et le nom divin.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin YHWH, préférable ici à un titre de substitution.
- source_word: לְבֵית הָאֹהֶל
  choice: la maison de la tente
  rationale: Cette traduction conserve l’expression inhabituelle de l’hébreu sans la réduire silencieusement au seul terme « tabernacle ».
- source_word: לְמִשְׁמָרוֹת
  choice: où ils assuraient la garde
  rationale: Le nom pluriel évoque les fonctions ou services de garde. Cette formulation française exprime clairement leur rôle sans préciser indûment une organisation en divisions.
theological_decisions:
- issue: Rapport entre « maison de Yahvé » et « maison de la tente »
  choice: Présenter la seconde expression comme une désignation explicative de la première au moyen de « c’est-à-dire »
  alternative: Comprendre « maison de la tente » comme un autre lieu, ou remplacer directement l’expression par « tabernacle »
  rationale: La juxtaposition hébraïque établit vraisemblablement une continuité entre le temple et le sanctuaire sous forme de tente. La traduction garde les deux expressions et leur tension historique et théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Étaient responsables des portes » exprime une charge officielle avec plus de naturel que le calque « étaient sur les portes ». L’expression source inhabituelle « maison de la tente » est maintenue et expliquée en note.
