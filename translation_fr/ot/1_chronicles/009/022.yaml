  text: כֻּלָּ֤/ם הַ/בְּרוּרִים֙ לְ/שֹׁעֲרִ֣ים בַּ/סִּפִּ֔ים מָאתַ֖יִם וּ/שְׁנֵ֣ים עָשָׂ֑ר הֵ֤מָּה בְ/חַצְרֵי/הֶם֙ הִתְיַחְשָׂ֔/ם הֵ֣מָּה יִסַּ֥ד דָּוִ֛יד וּ/שְׁמוּאֵ֥ל הָ/רֹאֶ֖ה בֶּ/אֱמוּנָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/022.yaml
  text: All these who were chosen as gatekeepers at the thresholds were two hundred and twelve[a]. They were enrolled by genealogy in their villages. David and Samuel the seer established them in their office of trust.
translation:
  language: fr
  text: Tous ceux qui furent choisis comme gardiens des portes, postés aux seuils, étaient au nombre de deux cent douze. Ils furent inscrits dans les registres généalogiques de leurs villages. David et Samuel le voyant les établirent dans une charge de confiance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les établirent en raison de leur fidélité », ou « les établirent dans leur fidélité ».'
    reason: La construction de בֶּאֱמוּנָתָם peut désigner une charge digne de confiance, le motif de leur nomination ou la fidélité dans laquelle ils furent établis.
lexical_decisions:
- source_word: הַבְּרוּרִים
  choice: qui avaient été choisis
  rationale: Le participe passif désigne ceux qui ont été sélectionnés pour une fonction. « Choisis » conserve cette idée sans préciser indûment le mode de sélection.
- source_word: לְשֹׁעֲרִים
  choice: comme gardiens des portes
  rationale: Le terme désigne ceux qui surveillent les portes ou les accès. Cette formulation est claire en français moderne et convient au service du sanctuaire.
- source_word: בַּסִּפִּים
  choice: postés aux seuils
  rationale: סַף désigne le seuil. L’ajout idiomatique de « postés » rend naturellement en français la localisation des gardiens sans réduire le mot à la notion plus générale d’entrée.
- source_word: מָאתַיִם וּשְׁנֵים עָשָׂר
  choice: deux cent douze
  rationale: Rendu direct du nombre cardinal, avec « cent » invariable puisqu’il est suivi d’un autre nombre.
- source_word: בְחַצְרֵיהֶם
  choice: de leurs villages
  rationale: Dans ce contexte de résidence et de recensement généalogique, חָצֵר désigne des villages ou agglomérations plutôt que des cours du temple.
- source_word: הִתְיַחְשָׂם
  choice: avaient été inscrits dans les registres généalogiques
  rationale: La forme verbale renvoie à l’inscription ou au classement selon l’ascendance. La formulation française explicite naturellement la nature officielle de cet enregistrement.
- source_word: יִסַּד
  choice: avaient établis
  rationale: Le verbe exprime l’action de fonder ou de mettre durablement en place. Ici, « établir dans une charge » convient au contexte administratif sans introduire un vocabulaire ecclésiastique ultérieur.
- source_word: הָרֹאֶה
  choice: le voyant
  rationale: Le texte emploie le titre ancien et spécifique de « voyant », qui mérite d’être conservé plutôt que d’être uniformisé en « prophète ».
- source_word: בֶּאֱמוּנָתָם
  choice: dans cette charge de confiance
  rationale: Le nom peut évoquer la fidélité, la fiabilité ou une responsabilité confiée. Dans ce contexte d’organisation des gardiens, la traduction retenue met en avant la charge officielle tout en gardant la notion de confiance.
theological_decisions:
- issue: Sens de בֶּאֱמוּנָתָם à la fin du verset
  choice: David et Samuel les établirent dans une charge de confiance
  alternative: David et Samuel les établirent à cause de leur fidélité, ou les établirent dans leur fidélité
  rationale: La construction est concise et admet une nuance administrative aussi bien que morale. Le contexte des fonctions et de l’enregistrement des gardiens favorise l’idée d’une responsabilité confiée, tandis que la note préserve les autres lectures possibles.
translation_notes:
  register: Français international moderne, digne et accessible. Le plus-que-parfait assure la cohérence narrative des mesures déjà prises par David et Samuel. « Gardiens des portes » est préféré à « portiers » pour éviter les connotations modernes de concierge, et « postés aux seuils » conserve distinctement l’image hébraïque des seuils.
