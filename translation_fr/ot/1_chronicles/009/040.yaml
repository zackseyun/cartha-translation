translation_notes:
  register: Français international moderne, naturel et digne. La tournure généalogique reste concise. Les noms suivent de près les formes hébraïques, tandis que la variation interne Merib-Baal/Meri-Baal est conservée dans une note plutôt que reproduite dans le corps du verset.
