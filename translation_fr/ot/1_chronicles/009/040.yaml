  yaml_path: translation/ot/1_chronicles/009/040.yaml
  text: And the son of Jehonathan was Merib-baal[b][a], and Merib-baal fathered Micah.
translation:
  language: fr
  text: Le fils de Yehonatan était Merib-Baal[b][a], et Merib-Baal engendra Mica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans ce verset, l’hébreu écrit le nom du père sous deux formes légèrement différentes : « Merib-Baal », puis la forme abrégée « Meri-Baal ». Le texte harmonise le nom pour plus de clarté.'
    reason: textual_variant
  - marker: b
    text: Dans la généalogie parallèle, 1 Samuel 14.49 appelle le fils de Saül « Jonathan » plutôt que « Yehonatan ». Ici, le texte hébreu des Chroniques porte la forme « Yehonatan ».
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: Le fils de
  rationale: בֶן signifie « fils ». Dans une généalogie française suivie, la juxtaposition suffit naturellement à assurer le lien avec le verset précédent, sans rendre mécaniquement le ו initial.
- source_word: יְהוֹנָתָן
  choice: Yehonatan
  rationale: Le nom propre est translittéré d’après la forme hébraïque précise du Chroniste, sans la normaliser en « Jonathan ».
- source_word: מְרִיב בָּעַל
  choice: Merib-Baal
  rationale: Le nom composé est translittéré avec un trait d’union, ce qui conserve ses deux éléments hébreux sans les traduire.
- source_word: וּ/מְרִי בַעַל
  choice: et Merib-Baal
  rationale: Le ו est rendu par « et ». La graphie abrégée Meri-Baal désigne ici le même homme; le texte principal harmonise le nom pour rendre la généalogie claire, tout en signalant la différence en note.
- source_word: הוֹלִיד
  choice: engendra
  rationale: À la forme hiphil et dans un contexte généalogique, le verbe signifie « engendrer, devenir le père de ». « Engendra » est concis, exact et digne, sans être obscur en français biblique courant.
- source_word: אֶת מִיכָה
  choice: Mika
  rationale: אֶת marque le complément d’objet direct et ne se traduit pas séparément. מִיכָה est translittéré « Mika » selon une représentation française moderne du nom hébreu.
