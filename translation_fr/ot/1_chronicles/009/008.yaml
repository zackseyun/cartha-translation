  text: וְ/יִבְנְיָה֙ בֶּן יְרֹחָ֔ם וְ/אֵלָ֥ה בֶן עֻזִּ֖י בֶּן מִכְרִ֑י וּ/מְשֻׁלָּם֙ בֶּן שְׁפַטְיָ֔ה בֶּן רְעוּאֵ֖ל בֶּן יִבְנִיָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/008.yaml
  text: and Ibneiah son of Jeroham[a], and Elah son of Uzzi, son of Michri, and Meshullam son of Shephatiah, son of Reuel, son of Ibnijah.
translation:
  language: fr
  text: Yibneya, fils de Yeroham, et Éla, fils d’Uzzi, fils de Mikri, et Meshoullam, fils de Shefatya, fils de Reouel, fils de Yibniya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms propres hébreux sont translittérés plutôt que traduits. Selon les traductions, leurs graphies peuvent varier, par exemple Yibneya/Jibneya, Reouel/Ragouel ou Yibniya/Jibniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: et / juxtaposition
  rationale: La conjonction relie les personnes de la liste. En français, sa répétition systématique serait lourde; la juxtaposition après le premier nom et « et » avant le dernier groupe rendent naturellement la coordination hébraïque.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette généalogie, le sens normal est celui de la filiation; rien dans le contexte n’impose le terme plus large « descendant de ».
- source_word: יִבְנְיָה
  choice: Yibneya
  rationale: Nom propre translittéré d’après la forme hébraïque massorétique, avec y initial correspondant à י.
- source_word: יְרֹחָם
  choice: Yeroham
  rationale: Translittération française lisible du nom propre hébreu.
- source_word: אֵלָה
  choice: Éla
  rationale: Forme française claire, distinguant la voyelle initiale et évitant une prononciation fautive.
- source_word: עֻזִּי
  choice: Uzzi
  rationale: Translittération usuelle et intelligible du nom propre.
- source_word: מִכְרִי
  choice: Mikri
  rationale: Le k rend directement la consonne hébraïque כ dans ce contexte et convient mieux au français que la graphie anglaise « Michri ».
- source_word: מְשֻׁלָּם
  choice: Meshoullam
  rationale: La graphie « sh » et la séquence « ou » offrent une translittération française accessible de שׁ et ֻ.
- source_word: שְׁפַטְיָה
  choice: Shefatya
  rationale: Translittération française proche de la forme hébraïque, sans reprendre mécaniquement la forme anglaise « Shephatiah ».
- source_word: רְעוּאֵל
  choice: Reouel
  rationale: Cette forme suit le texte massorétique et représente les voyelles hébraïques; elle n’adopte pas la variante traditionnelle « Ragouel ».
- source_word: יִבְנִיָּה
  choice: Yibniya
  rationale: Translittération de la forme hébraïque finale, distincte de יִבְנְיָה au début du verset; le choix préserve cette légère différence au lieu d’uniformiser les deux noms.
