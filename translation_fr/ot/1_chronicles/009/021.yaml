  text: זְכַרְיָה֙ בֶּ֣ן מְשֶֽׁלֶמְיָ֔ה שֹׁעֵ֥ר פֶּ֖תַח לְ/אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/021.yaml
  text: Zechariah son of Meshelemiah was gatekeeper at the entrance to the tent of meeting[a].
translation:
  language: fr
  text: Zacharie, fils de Meshélémia, était gardien à l’entrée de la tente de la Rencontre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « portier à la porte de la tente de la Rencontre ».
    reason: 'Alternative lexicale : « portier » rend plus explicitement שֹׁעֵר et « porte » représente l’alternative usuelle pour פֶּתַח.'
lexical_decisions:
- source_word: זְכַרְיָה
  choice: Zacharie
  rationale: Forme française traditionnelle et courante du nom hébreu, adaptée à partir de l’original.
- source_word: בֶּן
  choice: fils de
  rationale: Le contexte généalogique immédiat favorise le sens filial ordinaire plutôt que le sens plus large de « descendant de ».
- source_word: מְשֶׁלֶמְיָה
  choice: Meshélémia
  rationale: Translittération francisée du nom propre hébreu, avec accents facilitant une prononciation naturelle en français.
- source_word: שֹׁעֵר
  choice: gardien
  rationale: Le nom désigne la personne chargée de surveiller un accès. « Gardien » est naturel en français et évite de suggérer nécessairement une porte monumentale.
- source_word: פֶּתַח
  choice: entrée
  rationale: Le terme désigne l’ouverture ou le passage d’accès; « entrée » convient naturellement à la fonction du gardien.
- source_word: לְאֹהֶל
  choice: de la tente
  rationale: Dans l’expression française « à l’entrée de », le rapport exprimé par ל est rendu idiomatiquement sans perdre le lien spatial avec la tente.
- source_word: מוֹעֵד
  choice: Rencontre
  rationale: Dans l’expression cultuelle fixe אֹהֶל מוֹעֵד, « Rencontre » conserve l’idée du rendez-vous ou de la rencontre instituée avec Dieu.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la Rencontre
  rationale: Cette désignation reste proche de l’expression hébraïque et plus transparente que le terme interprétatif « tabernacle ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise comme l’hébreu; « était gardien » explicite naturellement la proposition nominale. La majuscule à « Rencontre » signale qu’il s’agit de la désignation consacrée du sanctuaire, non d’une rencontre quelconque.
