  text: וּ/בִ/ירוּשָׁלִַ֨ם֙ יָשְׁב֔וּ מִן בְּנֵ֥י יְהוּדָ֖ה וּ/מִן בְּנֵ֣י בִנְיָמִ֑ן וּ/מִן בְּנֵ֥י אֶפְרַ֖יִם וּ/מְנַשֶּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/003.yaml
  text: And in Jerusalem some from the sons of Judah, and some from the sons of Benjamin, and some from the sons of Ephraim and Manasseh, lived there.
translation:
  language: fr
  text: À Jérusalem habitaient des descendants de Juda[a], des descendants de Benjamin, ainsi que des descendants d’Éphraïm et de Manassé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’entre les fils de Juda… d’entre les fils de Benjamin… d’entre les fils d’Éphraïm et de Manassé » ; il s’agit ici de membres issus de ces groupes tribaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִירוּשָׁלִַם
  choice: À Jérusalem
  rationale: La préposition בְּ marque le lieu. Le ו initial relie le verset au contexte précédent, mais il n’est pas nécessaire de le rendre explicitement en français, où l’ouverture par le complément de lieu assure une transition naturelle.
- source_word: יָשְׁבוּ
  choice: habitaient
  rationale: Le verbe ישׁב exprime ici le fait de résider. « Habitaient » est à la fois naturel, digne et plus précis que « étaient installés », qui pourrait suggérer davantage l’acte d’établissement.
- source_word: מִן בְּנֵי
  choice: des descendants de
  rationale: Le מִן répété désigne des personnes issues de chaque groupe, et non la totalité de celui-ci. En français, l’article partitif « des » exprime naturellement cette sélection, tandis que « descendants » restitue l’idiome généalogique בְּנֵי sans l’étrangeté de « fils de » dans ce contexte tribal.
- source_word: וּמִן בְּנֵי אֶפְרַיִם וּמְנַשֶּׁה
  choice: ainsi que des descendants d’Éphraïm et de Manassé
  rationale: Le mot בְּנֵי, exprimé avec Éphraïm, porte aussi syntaxiquement sur Manassé. « Ainsi que » rend clairement la dernière coordination, et la répétition de « des descendants » maintient la structure des groupes précédents.
theological_decisions: []
translation_notes:
  register: Français international moderne, avec une syntaxe simple et soutenue. Le déplacement de « À Jérusalem » en tête respecte l’ordre hébreu et évite l’ajout de « là ». La répétition partielle conserve le rythme énumératif du texte source.
