  text: וּ/מִן בְּנֵי֙ הַ/כֹּ֣הֲנִ֔ים רֹקְחֵ֥י הַ/מִּרְקַ֖חַת לַ/בְּשָׂמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/030.yaml
  text: And some of the sons of the priests were compounders of the ointment of spices[a].
translation:
  language: fr
  text: Parmi les fils des prêtres, certains préparaient le mélange d’aromates[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « préparaient le mélange parfumé pour les aromates ».'
    reason: La relation exacte exprimée par לְ dans לַבְּשָׂמִים peut indiquer la destination ou la fonction plutôt que la composition.
lexical_decisions:
- source_word: וּמִן
  choice: Parmi … certains
  rationale: Cette tournure française naturelle exprime la valeur partitive de la préposition מִן avec la conjonction, sans produire le calque maladroit « et d’entre ».
- source_word: בְּנֵי הַכֹּהֲנִים
  choice: les fils des prêtres
  rationale: Le rendu conserve l’expression familiale et généalogique de l’hébreu, qui désigne ici des membres des familles sacerdotales.
- source_word: רֹקְחֵי
  choice: préparaient
  rationale: Le participe désigne ceux qui confectionnaient une préparation composée. « Préparaient » est clair, actuel et suffisamment précis dans ce contexte, sans imposer le métier plus spécifique de parfumeur.
- source_word: הַמִּרְקַחַת
  choice: le mélange
  rationale: Le nom désigne une préparation obtenue par composition. « Mélange » préserve cette portée générale, tandis que « onguent » préciserait sans certitude sa consistance ou son usage.
- source_word: לַבְּשָׂמִים
  choice: d’aromates
  rationale: בְּשָׂמִים désigne des substances aromatiques. Le français « mélange d’aromates » rend naturellement la relation entre la préparation et ses substances, tandis que la note conserve une autre analyse possible du לְ.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La phrase nominale hébraïque est rendue par une proposition verbale naturelle; l’imparfait situe cette responsabilité habituelle dans la description des fonctions du personnel du Temple.
