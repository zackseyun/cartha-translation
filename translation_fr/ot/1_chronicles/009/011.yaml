source:
  edition: WLC
  text: וַ/עֲזַרְיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖יד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/011.yaml
  text: and Azariah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, chief officer of the house of God.
translation:
  language: fr
  text: et Azaria, fils de Hilqiya, fils de Meshoullam, fils de Tsadoq, fils de Merayoth, fils d’Ahitoub, dirigeant de la maison de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chef », « responsable » ou « gouverneur » de la maison de Dieu.
    reason: Le mot נְגִיד peut désigner un dirigeant, un chef ou une personne investie d’une autorité de supervision; le contexte ne précise pas un titre administratif français exact.
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: et Azaria
  rationale: La conjonction וַ־ marque la poursuite de la liste du verset précédent. Le nom est rendu selon une translittération française courante.
- source_word: בֶן
  choice: fils de
  rationale: La formule généalogique répétée est rendue de façon constante. « Fils de » conserve la forme du texte, même si les généalogies bibliques peuvent parfois omettre certaines générations.
- source_word: חִלְקִיָּה
  choice: Hilqiya
  rationale: Translittération française du nom hébreu, conservant le qoph par « q » et la finale théophore sous la forme « ya ».
- source_word: מְשֻׁלָּם
  choice: Meshoullam
  rationale: Translittération française lisible du nom propre hébreu.
- source_word: צָדוֹק
  choice: Tsadoq
  rationale: Translittération française lisible, avec צ rendu par « ts » et ק par « q ».
- source_word: מְרָיוֹת
  choice: Merayoth
  rationale: Translittération française du nom propre hébreu.
- source_word: אֲחִיטוּב
  choice: Ahitoub
  rationale: Translittération française traditionnelle et lisible du nom propre.
- source_word: נְגִיד
  choice: dirigeant
  rationale: Le terme désigne une personne placée à la tête d’une institution ou chargée de la superviser. « Dirigeant » reste naturel en français moderne tout en préservant l’étendue sémantique du mot.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette traduction transparente conserve l’image hébraïque de la « maison », sans la réduire explicitement au seul bâtiment du temple.
theological_decisions:
- issue: Sens de אֱלֹהִים dans la désignation du sanctuaire
  choice: Dieu
  alternative: les dieux
  rationale: Dans le contexte du sanctuaire d’Israël, le terme désigne sans ambiguïté le Dieu d’Israël; le singulier français est donc requis.
translation_notes:
  register: Français international moderne, sobre et digne. La structure généalogique répétitive est conservée. Le marqueur de note est placé après l’expression qu’il explique, contrairement à son emplacement manifestement décalé dans la couche anglaise fournie.
