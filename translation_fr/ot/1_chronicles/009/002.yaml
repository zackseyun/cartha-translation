  text: וְ/הַ/יּוֹשְׁבִים֙ הָ/רִ֣אשֹׁנִ֔ים אֲשֶׁ֥ר בַּ/אֲחֻזָּתָ֖/ם בְּ/עָרֵי/הֶ֑ם יִשְׂרָאֵל֙ הַ/כֹּ֣הֲנִ֔ים הַ/לְוִיִּ֖ם וְ/הַ/נְּתִינִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/002.yaml
  text: The first inhabitants who lived in their possessions in their cities were Israel[a], the priests, the Levites, and the temple servants.
translation:
  language: fr
  text: Les premiers habitants qui vivaient sur leurs terres, dans leurs villes, étaient les Israélites, les prêtres, les lévites et les serviteurs du Temple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : les Nethinim, terme hébreu désignant une catégorie de personnes affectées au service du Temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹשְׁבִים
  choice: les habitants qui vivaient
  rationale: Le participe de ישׁב désigne ceux qui résident en un lieu. Cette formulation est naturelle en français et maintient la valeur descriptive du participe.
- source_word: הָרִאשֹׁנִים
  choice: les premiers
  rationale: L’adjectif peut signifier « premiers » ou « anciens ». Dans le contexte du repeuplement, « les premiers » conserve la formulation hébraïque sans expliciter davantage la chronologie.
- source_word: בַּאֲחֻזָּתָם
  choice: sur leurs terres
  rationale: אֲחֻזָּה désigne une possession foncière ou un domaine détenu. « Sur leurs terres » exprime naturellement cette réalité en français sans imposer le sens plus précis d’« héritage ».
- source_word: בְּעָרֵיהֶם
  choice: dans leurs villes
  rationale: Traduction directe de l’expression, qui désigne les centres habités leur appartenant ou associés à leurs groupes.
- source_word: יִשְׂרָאֵל
  choice: les Israélites
  rationale: Le nom collectif « Israël » désigne ici les membres du peuple dans une énumération de groupes. « Les Israélites » rend cette fonction de façon claire et idiomatique en français.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français usuel de כֹּהֲנִים dans le cadre du service cultuel d’Israël.
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: Désignation française habituelle du groupe lévitique, distingué ici des prêtres.
- source_word: וְהַנְּתִינִים
  choice: et les serviteurs du Temple
  rationale: נְתִינִים désigne une catégorie reconnue de personnes affectées au service du sanctuaire. La traduction fonctionnelle est compréhensible pour le lecteur moderne; la translittération traditionnelle est donnée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition spatiale « sur leurs terres, dans leurs villes » conserve les deux compléments hébreux tout en évitant le peu naturel « dans leurs possessions ». La conjonction initiale n’est pas rendue par un marqueur discursif artificiel, le verset pouvant se lire naturellement dans la continuité du contexte.
