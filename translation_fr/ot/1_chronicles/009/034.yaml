  terminology: « Chefs », « maisons ancestrales », « Lévites », « lignées » et « Jérusalem » conviennent. « Tous des chefs » garde le même terme français pour les deux occurrences hébraïques tout en indiquant naturellement qu’il s’agit de chefs au sein des lignées ou maisons mentionnées.
