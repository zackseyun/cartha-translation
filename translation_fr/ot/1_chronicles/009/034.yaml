  text: אֵלֶּה֩ רָאשֵׁ֨י הָ/אָב֧וֹת לַ/לְוִיִּ֛ם לְ/תֹלְדוֹתָ֖/ם רָאשִׁ֑ים אֵ֖לֶּה יָשְׁב֥וּ בִ/ירוּשָׁלִָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/034.yaml
  text: These were the heads of the fathers’ houses of the Levites[a], according to their generations, heads[b]. These lived in Jerusalem.
translation:
  language: fr
  text: Tels étaient les chefs des maisons ancestrales des Lévites, selon leurs lignées, tous des chefs[a]. Ils habitaient à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète le même mot qu’au début du verset, probablement pour insister sur leur rang.
    reason: lexical_note
lexical_decisions:
- source_word: רָאשֵׁי
  choice: les chefs de
  rationale: Le construit désigne ceux qui sont à la tête d’unités familiales ou claniques. « Chefs de » rend naturellement cet idiome en français.
- source_word: הָאָבוֹת
  choice: maisons ancestrales
  rationale: Dans les Chroniques, l’expression désigne des groupes familiaux fondés sur l’ascendance, et non de simples foyers individuels.
- source_word: לַלְוִיִּם
  choice: des Lévites
  rationale: 'La préposition marque ici l’appartenance ou la relation : ces maisons ancestrales sont celles des Lévites.'
- source_word: לְתֹלְדוֹתָם
  choice: selon leurs lignées
  rationale: Dans ce contexte généalogique, תּוֹלְדוֹת renvoie aux lignes de descendance. « Lignées » est plus naturel en français actuel que « générations » tout en évitant d’imposer l’idée de registres écrits.
- source_word: רָאשִׁים
  choice: des chefs
  rationale: Le terme répète la racine employée au début du verset et souligne leur rang. La répétition est conservée malgré sa légère lourdeur, car elle appartient à la formulation hébraïque.
- source_word: יָשְׁבוּ
  choice: habitaient
  rationale: Le verbe indique ici la résidence durable; « habitaient » convient au registre narratif et administratif.
- source_word: בִירוּשָׁלִָם
  choice: à Jérusalem
  rationale: Rendu locatif français usuel du nom de lieu.
