  text: 'And the sons of Micah: Pithon, Melech, and Tahrea.'
translation:
  language: fr
  text: 'Et les fils de Mica : Pithon, Mélec et Tahrea.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Et les fils de
  rationale: Le waw suivi du pluriel construit de בֵּן introduit la ligne généalogique suivante. « Et les fils de » conserve le lien avec le contexte et la formule généalogique.
- source_word: מִיכָה
  choice: Mika
  rationale: Nom propre transcrit selon une forme française simple, proche de l’hébreu Mikhah, sans le confondre avec le nom français du prophète Michée.
- source_word: פִּיתוֹן
  choice: Pitôn
  rationale: Transcription française du nom propre hébreu, avec accent circonflexe pour signaler la voyelle longue sans alourdir la lecture.
- source_word: וָמֶלֶךְ
  choice: Mélek
  rationale: Le nom propre est transcrit en français. La conjonction préfixée n’est pas répétée, conformément à l’usage naturel des énumérations françaises.
- source_word: וְתַחְרֵעַ
  choice: et Tahréa
  rationale: Le waw est rendu par « et » devant le dernier élément de la liste; le nom propre est transcrit au plus près de sa forme hébraïque dans un français lisible.
theological_decisions: []
translation_notes:
  register: Style généalogique sobre et digne. Les noms sont transcrits dans une graphie française lisible tout en restant proches de l’hébreu; la ponctuation par deux-points rend clairement la relation entre le père et la liste des fils.
