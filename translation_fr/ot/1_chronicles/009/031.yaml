source:
  edition: WLC
  text: וּ/מַתִּתְיָה֙ מִן הַ/לְוִיִּ֔ם ה֥וּא הַ/בְּכ֖וֹר לְ/שַׁלֻּ֣ם הַ/קָּרְחִ֑י בֶּ/אֱמוּנָ֕ה עַ֖ל מַעֲשֵׂ֥ה הַ/חֲבִתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/031.yaml
  text: And Mattithiah[a], from the Levites, the firstborn of Shallum the Korahite[b], was entrusted with the work of the flat cakes.
translation:
  language: fr
  text: Mattithia, l’un des lévites, premier-né de Shallum, le Coréite, avait la charge[a] de la confection des galettes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’en occupait fidèlement » ; l’expression hébraïque peut évoquer soit une charge confiée à Mattithia, soit la fidélité avec laquelle il l’exerçait.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne une sorte de gâteau ou de galette, peut-être cuite à la poêle ou sur une plaque.
    reason: cultural_note
lexical_decisions:
- source_word: וּמַתִּתְיָה
  choice: Mattitia
  rationale: Le nom propre est translittéré selon une forme française courante; la conjonction initiale, qui assure ici la simple continuité de la liste, n’a pas besoin d’être rendue explicitement.
- source_word: מִן הַלְוִיִּם
  choice: l’un des lévites
  rationale: La préposition מִן exprime ici l’appartenance au groupe; cette formulation est naturelle en français et précise que Mattitia fait partie des lévites.
- source_word: הוּא הַבְּכוֹר לְשַׁלֻּם
  choice: premier-né de Shalloum
  rationale: בְּכוֹר désigne le premier-né. La formulation conserve le terme hébreu sans le remplacer par l’interprétation plus explicite « fils aîné ».
- source_word: הַקָּרְחִי
  choice: le Coréite
  rationale: Le gentilé familial indique l’appartenance à la lignée de Coré; « Coréite » est la forme française traditionnelle et concise.
- source_word: בֶּאֱמוּנָה עַל
  choice: avait la charge
  rationale: Dans ce contexte d’organisation du service, l’expression indique une responsabilité confiée et exercée avec fiabilité. La note préserve l’autre nuance possible, celle d’une manière fidèle d’accomplir la tâche.
- source_word: מַעֲשֵׂה
  choice: la confection
  rationale: מַעֲשֶׂה peut désigner le travail ou l’action de faire; avec un aliment, « confection » exprime naturellement le travail de préparation.
- source_word: הַחֲבִתִּים
  choice: des galettes
  rationale: Le mot désigne un type de gâteau ou de galette préparé à la poêle ou sur une plaque. « Galettes » garde le sens culinaire concret sans ajouter une fonction sacrificielle non exprimée dans le verset.
theological_decisions:
- issue: Nuance de בֶּאֱמוּנָה dans l’attribution de la tâche
  choice: avait la charge
  alternative: s’en occupait fidèlement
  rationale: Le contexte administratif favorise l’idée d’une charge confiée, mais l’hébreu peut aussi qualifier la fidélité avec laquelle Mattitia accomplissait ce travail; l’ambiguïté est signalée en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’identification généalogique hébraïque tout en évitant une tournure artificielle. Les notes conservent l’incertitude lexicale réelle.
