base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/042.yaml
  text: Ahaz fathered Jarah[a], and Jarah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: fr
  text: Achaz engendra Yaara[a] ; Yaara engendra Alémeth, Azmaveth et Zimri ; Zimri engendra Motsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La généalogie parallèle en 1 Chroniques 8.36 porte « Yehoadda » au lieu de « Yaara ». Les manuscrits des Chroniques lisent ici « Yaara », forme conservée dans le texte.
    reason: textual_variant
lexical_decisions:
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans cette généalogie, le hifil de ילד exprime la paternité biologique. « Engendra » est concis, digne et usuel dans le registre généalogique biblique français.
- source_word: יַעְרָה
  choice: Yaéra
  rationale: Nom propre translittéré d’après la forme hébraïque du présent verset, sans l’harmoniser avec le passage parallèle.
- source_word: עָלֶמֶת
  choice: Alémeth
  rationale: Nom propre translittéré selon une forme française lisible, avec th conventionnel pour la consonne finale.
- source_word: עַזְמָוֶת
  choice: Azmaveth
  rationale: Nom propre translittéré sous sa forme française biblique courante.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Nom propre translittéré directement.
- source_word: מוֹצָא
  choice: Motsa
  rationale: Nom propre translittéré en rendant צ par « ts », conformément à une convention française claire.
- source_word: וְ
  choice: et / ponctuation
  rationale: La conjonction coordonne les générations et les noms. Une ponctuation française naturelle évite de surcharger la phrase tout en préservant les liens syntaxiques.
- source_word: אֶת
  choice: non traduit
  rationale: La marque de l’objet direct n’a pas d’équivalent lexical en français; sa fonction est portée par la syntaxe.
