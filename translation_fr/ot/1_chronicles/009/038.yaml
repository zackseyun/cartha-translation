  text: וּ/מִקְל֖וֹת הוֹלִ֣יד אֶת שִׁמְאָ֑ם וְ/אַף הֵ֗ם נֶ֧גֶד אֲחֵי/הֶ֛ם יָשְׁב֥וּ בִ/ירֽוּשָׁלִַ֖ם עִם אֲחֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/038.yaml
  text: Mikloth fathered Shimeam[a]. They also lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: fr
  text: Mikloth engendra Shiméam[a]. Eux aussi habitaient en face de leurs frères, à Jérusalem[b], avec leurs frères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Shiméam; certaines traductions ont « Shiméa », probablement par harmonisation avec des formes généalogiques parallèles.'
    reason: alternative_reading
  - marker: b
    text: Ou « devant leurs frères » ou « près de leurs frères », pour « en face de leurs frères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: Mikloth
  rationale: Nom propre translittéré; la conjonction initiale est absorbée dans l’enchaînement naturel du récit généalogique.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans une généalogie, le hiphil de ילד exprime la paternité. « Engendra » est concis, précis et d’un registre biblique encore intelligible.
- source_word: אֶת שִׁמְאָם
  choice: Shiméam
  rationale: Le nom suit la forme consonantique du texte massorétique de ce vers, sans harmonisation avec les formes généalogiques parallèles.
- source_word: וְאַף הֵם
  choice: Eux aussi
  rationale: Cette formulation rend la valeur additive, légèrement emphatique, de וְאַף הֵם dans un français naturel.
- source_word: נֶגֶד
  choice: en face de
  rationale: Conserve le sens spatial de correspondance ou de vis-à-vis sans préciser indûment la distance exacte.
- source_word: אֲחֵיהֶם
  choice: leurs frères
  rationale: Rend littéralement le terme de parenté; le contexte généalogique peut viser des membres apparentés du même groupe, mais ne nécessite pas de paraphrase.
- source_word: יָשְׁבוּ
  choice: habitaient
  rationale: Dans cette notice de résidence, ישב décrit le fait d’habiter; l’imparfait français convient au cadre narratif.
- source_word: בִירוּשָׁלִַם
  choice: à Jérusalem
  rationale: Forme française courante du nom de lieu avec la préposition idiomatique employée pour une ville.
- source_word: עִם אֲחֵיהֶם
  choice: avec leurs frères
  rationale: Rend directement l’association exprimée par עִם et conserve la répétition délibérée de « leurs frères ».
