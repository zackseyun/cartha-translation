revisions:
- from: Leurs frères, recensés selon leurs lignées[a], étaient au nombre de neuf cent cinquante-six. Tous ces hommes étaient chefs de familles paternelles[b] dans leurs maisons ancestrales.
  to: Leurs frères, selon leurs généalogies[a], étaient au nombre de neuf cent cinquante-six. Tous ces hommes étaient chefs de maisons paternelles[b] dans leurs maisons paternelles.
  rationale: La révision retire l’ajout non exprimé de « recensés » et rend de façon cohérente les deux expressions hébraïques apparentées relatives aux maisons paternelles. Elle conserve le registre généalogique, le nombre et l’ambiguïté clanique de « frères », explicitée en note.
