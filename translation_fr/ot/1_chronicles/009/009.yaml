    issue: Ajout de « recensés »
    rationale: Le texte hébreu dit littéralement « leurs frères, selon leurs généalogies », sans verbe ni terme indiquant un recensement. Le contexte est généalogique, mais l’ajout transforme une qualification en acte de recensement explicite.
  - severity: medium
    issue: « Maisons ancestrales » ne rend pas pleinement la terminologie paternelle
    rationale: לְבֵית אֲבֹתֵיהֶם reprend l’expression de la maison paternelle / maison des pères. « Ancestrales » est plus large et atténue ce marqueur social et généalogique.
