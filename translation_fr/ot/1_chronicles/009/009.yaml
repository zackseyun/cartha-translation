base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/009.yaml
  text: And their brothers[a], according to their generations, were nine hundred and fifty-six[b]. All these men were heads of fathers’ houses in their fathers’ households.
translation:
  language: fr
  text: Leurs frères, selon leurs généalogies[a], étaient au nombre de neuf cent cinquante-six. Tous ces hommes étaient chefs de maisons paternelles[b] dans leurs maisons paternelles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon leurs lignées ». Le terme hébreu désigne les lignées de descendance ou les registres généalogiques.
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque désignant les responsables de groupes familiaux organisés selon l’ascendance paternelle.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Leurs frères
  rationale: Le nom אָח signifie d’abord « frère », mais peut aussi désigner des membres du même clan. « Frères » conserve ici le terme de parenté hébreu dans ce relevé généalogique masculin.
- source_word: לְתֹלְדוֹתָם
  choice: recensés selon leurs lignées
  rationale: תּוֹלְדוֹת renvoie ici aux lignes de descendance ou aux registres généalogiques. Cette formulation rend explicite le contexte de recensement sans réduire le terme à de simples générations chronologiques.
- source_word: תְּשַׁע מֵאוֹת וַחֲמִשִּׁים וְשִׁשָּׁה
  choice: neuf cent cinquante-six
  rationale: Rendu cardinal direct et idiomatique en français.
- source_word: כָּל אֵלֶּה אֲנָשִׁים
  choice: Tous ces hommes
  rationale: אֲנָשִׁים désigne ici les hommes recensés et responsables des groupes familiaux; le masculin explicite du texte est donc conservé.
- source_word: רָאשֵׁי אָבוֹת
  choice: chefs de familles paternelles
  rationale: Expression sociale et généalogique désignant les responsables de groupes familiaux structurés selon l’ascendance paternelle. Le choix reste intelligible tout en conservant cette dimension.
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: dans leurs maisons ancestrales
  rationale: בֵּית אָבוֹת désigne la maison ou le groupe familial ancestral. « Maisons ancestrales » préserve l’image institutionnelle de la maison sans répéter « familles paternelles ».
