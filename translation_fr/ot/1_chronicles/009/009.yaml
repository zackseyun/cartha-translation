review_pass:
  verdict: revise
  source_fidelity: La formulation « recensés selon leurs lignées » ajoute l’idée explicite de recensement, qui n’est pas exprimée par לְתֹלְדוֹתָם (« selon leurs généalogies / lignées »). « Maisons ancestrales » affaiblit aussi la référence spécifiquement paternelle de בֵּית אָבוֹת. Le nombre et la désignation masculine « tous ces hommes » sont corrects.
  naturalness: Le français est globalement clair et digne. « Chefs de maisons paternelles » est une expression technique un peu inhabituelle, mais elle est naturelle dans un registre biblique-généalogique et plus précise que « familles paternelles ». La répétition de « maisons paternelles » reflète volontairement la terminologie sociale du texte.
  terminology: « Frères » conserve le terme de parenté hébreu, avec la note qui signale la portée clanique possible. « Généalogies », « chefs de maisons paternelles » et « maisons paternelles » rendent les termes techniques sans imposer une interprétation confessionnelle.
  issues:
