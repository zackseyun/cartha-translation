  text: כִּ֣י בֶ/אֱמוּנָ֞ה הֵ֗מָּה אַרְבַּ֨עַת֙ גִּבֹּרֵ֣י הַ/שֹּׁעֲרִ֔ים הֵ֖ם הַ/לְוִיִּ֑ם וְ/הָיוּ֙ עַל הַ/לְּשָׁכ֔וֹת וְ/עַ֥ל הָ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/026.yaml
  text: For these four mighty gatekeepers[a], who were Levites[b], were entrusted with the chambers and with the storehouses of the house of God.
translation:
  language: fr
  text: Car ces quatre portiers valeureux, qui étaient lévites, détenaient une charge de confiance[a] et étaient responsables des salles et des réserves[b] de la maison de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « exerçaient fidèlement leur fonction » ; l’hébreu souligne leur fidélité ou le fait que cette charge leur était confiée.
    reason: lexical_alternative
  - marker: b
    text: Ou « trésoreries » ou « salles du trésor ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’organisation décrite dans le contexte précédent.
- source_word: בֶאֱמוּנָה
  choice: occupaient un poste de confiance
  rationale: Le nom אֱמוּנָה évoque ici la fidélité, la fiabilité ou une charge confiée. Cette formulation française exprime naturellement la confiance attachée à leur fonction sans effacer l’idée de fidélité.
- source_word: אַרְבַּעַת גִּבֹּרֵי הַשֹּׁעֲרִים
  choice: ces quatre principaux portiers
  rationale: Dans ce cadre administratif, גִּבֹּרֵי qualifie vraisemblablement des hommes éminents, capables ou de premier rang. « Principaux » convient mieux au contexte que le littéral « puissants ».
- source_word: הֵם הַלְוִיִּם
  choice: qui étaient lévites
  rationale: Rend naturellement en français l’identification appositive de ces portiers comme lévites.
- source_word: וְהָיוּ עַל
  choice: avaient la responsabilité de
  rationale: La construction היה על indique ici une fonction de surveillance ou de responsabilité.
- source_word: הַלְּשָׁכוֹת
  choice: les salles
  rationale: Désigne les pièces ou salles annexes employées pour le service du sanctuaire; « salles » est clair en français moderne.
- source_word: הָאֹצְרוֹת
  choice: les réserves
  rationale: Le terme peut désigner des lieux où sont conservés des biens, des provisions ou des objets précieux. « Réserves » garde cette portée large.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Traduction transparente qui conserve l’expression hébraïque et sa référence au sanctuaire.
