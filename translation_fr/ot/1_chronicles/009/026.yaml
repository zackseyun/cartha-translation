  naturalness: La révision reste en français international moderne et fluide. « Détenaient une charge de confiance » exprime naturellement le caractère officiel et fiable de la fonction, sans alourdir la phrase.
  terminology: « Portiers », « lévites », « salles », « réserves » et « maison de Dieu » conviennent au contexte cultuel. La note sur « trésoreries » préserve l’autre sens possible de אֹצְרוֹת avec davantage de précision que « trésors », qui désigne plutôt le contenu que le lieu.
