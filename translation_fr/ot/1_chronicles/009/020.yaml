  text: וּ/פִֽינְחָ֣ס בֶּן אֶלְעָזָ֗ר נָגִ֨יד הָיָ֧ה עֲלֵי/הֶ֛ם לְ/פָנִ֖ים יְהוָ֥ה עִמּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/020.yaml
  text: And Phinehas son of Eleazar had formerly been chief over them[a]; Yahweh was with him.
translation:
  language: fr
  text: Et Pinhas, fils d’Éléazar, avait été autrefois leur chef[a] ; Yahvé était avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Et Pinhas, fils d’Éléazar, était leur chef autrefois. » L’ordre des mots en hébreu permet de rattacher étroitement « autrefois » soit à la fonction antérieure, soit à l’ensemble de la proposition.'
    reason: ambiguïté syntaxique et temporelle
lexical_decisions:
- source_word: וּפִינְחָס
  choice: Et Pinhas
  rationale: Le nom est translittéré sous la forme française moderne « Pinhas », proche de l’hébreu. La conjonction וּ est rendue par « Et » pour conserver le lien avec le contexte précédent.
- source_word: בֶּן אֶלְעָזָר
  choice: fils d’Éléazar
  rationale: Cette formulation française concise reproduit naturellement la relation généalogique exprimée par l’hébreu.
- source_word: נָגִיד
  choice: chef
  rationale: Le terme désigne une personne placée à la tête d’un groupe. « Chef » convient au contexte cultuel et administratif sans lui donner nécessairement une portée royale.
- source_word: הָיָה
  choice: avait été
  rationale: Avec לְפָנִים, la forme verbale renvoie ici à une fonction exercée dans un temps antérieur au cadre narratif.
- source_word: עֲלֵיהֶם
  choice: leur chef
  rationale: La préposition עַל avec suffixe exprime l’autorité exercée sur les personnes précédemment mentionnées. En français, « leur chef » est plus naturel que « chef sur eux ».
- source_word: לְפָנִים
  choice: autrefois
  rationale: L’adverbe indique une époque antérieure. « Autrefois » est courant, digne et fidèle à la valeur temporelle du terme.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française conventionnelle du nom divin représenté par le tétragramme, plutôt qu’une substitution par un titre.
- source_word: עִמּוֹ
  choice: était avec lui
  rationale: La traduction littérale préserve la portée ouverte de la présence divine, sans préciser davantage s’il s’agit de soutien, de faveur ou d’accompagnement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin. Sa translittération française préserve le caractère personnel du nom plutôt que de le remplacer par un titre.
- issue: Portée de « Yahvé était avec lui »
  choice: Conserver la formulation sans l’expliciter
  alternative: Yahvé le soutenait
  rationale: L’expression peut évoquer la présence, la faveur ou le soutien divins. La traduction retenue maintient cette richesse sans imposer une seule interprétation.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste concise, emploie les formes françaises « Pinhas », « Éléazar » et « Yahvé », et conserve l’ambiguïté temporelle de l’hébreu dans une note.
