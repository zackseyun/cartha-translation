  yaml_path: translation/ot/1_chronicles/009/043.yaml
  text: And Moza fathered Binea[a], and his son was Rephaiah, his son Eleasah, his son Azel.
translation:
  language: fr
  text: Motsa engendra Binéa. Celui-ci eut pour fils Rephaïa, qui eut pour fils Éléasa, qui eut pour fils Atsel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « et Rephaïa son fils, Éléasa son fils, Atsel son fils ». La formulation française explicite les antécédents successifs de « son fils » dans la chaîne généalogique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: Motsa
  rationale: Nom propre translittéré selon une forme française qui représente le tsadé par « ts ».
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans une généalogie, le hifil de ילד exprime l’engendrement. « Engendra » est concis, digne et idiomatique dans ce registre.
- source_word: בִּנְעָא
  choice: Binéa
  rationale: Translittération française du nom propre, proche de la vocalisation massorétique.
- source_word: וּרְפָיָה בְנוֹ
  choice: Rephaïa fut son fils
  rationale: La proposition hébraïque est nominale. Le verbe « fut » est ajouté en français pour ouvrir naturellement la chaîne généalogique sans ajouter de relation différente.
- source_word: אֶלְעָשָׂה בְנוֹ
  choice: Éléasa son fils
  rationale: Maintient la formulation généalogique répétée et le lien filial du texte hébreu.
- source_word: אָצֵל בְנוֹ
  choice: Atsel son fils
  rationale: Translittère le nom propre et conserve explicitement la relation filiale finale.
