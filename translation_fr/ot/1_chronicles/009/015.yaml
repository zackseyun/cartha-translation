source:
  edition: WLC
  text: וּ/בַקְבַּקַּ֥ר חֶ֖רֶשׁ וְ/גָלָ֑ל וּ/מַתַּנְיָה֙ בֶּן מִיכָ֔א בֶּן זִכְרִ֖י בֶּן אָסָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/015.yaml
  text: and Bakbakkar[a], Heresh, and Galal, and Mattaniah son of Mica, son of Zichri[b], son of Asaph.
translation:
  language: fr
  text: ainsi que Bakbakkar, Héresh et Galal, et Mattania, fils de Mika, fils de Zikri, fils d’Asaph.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַקְבַּקַּר
  choice: ainsi que Bakbakkar
  rationale: La conjonction ו poursuit l’énumération commencée dans le contexte précédent. « ainsi que » rend ce lien naturellement en français, et le nom propre est translittéré.
- source_word: חֶרֶשׁ
  choice: Héresh
  rationale: Le nom propre est translittéré sous une forme française qui reflète les consonnes hébraïques.
- source_word: וְ/גָלָל
  choice: et Galal
  rationale: La conjonction est conservée pour marquer l’enchaînement de la liste; le nom est translittéré.
- source_word: וּ/מַתַּנְיָה
  choice: et Mattania
  rationale: La conjonction est rendue dans l’énumération et le nom reçoit sa forme biblique française usuelle.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette chaîne généalogique, בֶּן est rendu littéralement par « fils de ». Le terme peut ailleurs désigner plus largement un descendant, mais rien n’oblige ici à expliciter cette extension possible.
- source_word: מִיכָא
  choice: Mika
  rationale: Cette translittération distingue la forme hébraïque מִיכָא du nom plus courant Michée et évite de substituer une forme française correspondant à un autre nom biblique.
- source_word: זִכְרִי
  choice: Zikri
  rationale: Translittération claire du nom hébreu, adaptée aux conventions graphiques du français moderne.
- source_word: אָסָף
  choice: Asaph
  rationale: Forme française biblique courante du nom propre.
theological_decisions: []
translation_notes:
  register: Style généalogique sobre et digne. La répétition de « fils de » conserve la structure explicite de l’hébreu. L’ouverture « ainsi que » signale que le verset poursuit la liste du verset précédent, sans produire en français une entrée artificielle par « et ».
