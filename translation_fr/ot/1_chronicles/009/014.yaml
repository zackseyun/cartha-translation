  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַֽעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה מִן בְּנֵ֥י מְרָרִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/014.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, from the sons of Merari.'
translation:
  language: fr
  text: 'Et parmi les lévites : Shemaya, fils de Hashoub, fils d’Azriqam, fils de Hashabia, d’entre les fils de Merari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: Parmi les lévites
  rationale: La préposition מִן introduit un membre issu du groupe des lévites. Dans la continuité de la liste, « Parmi les lévites » est plus naturel en français que « Et d’entre les lévites », sans perdre le rapport additif au contexte.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Transcription française usuelle du nom hébreu, avec « sh » pour שׁ et « y » pour י.
- source_word: בֶן
  choice: fils de
  rationale: Dans cette chaîne généalogique, בֶן indique normalement la filiation. « Fils de » conserve la forme et la possible portée généalogique de l’hébreu.
- source_word: חַשּׁוּב
  choice: Hashoub
  rationale: Transcription adaptée aux conventions phonétiques françaises; le redoublement consonantique de l’hébreu n’a pas besoin d’être reproduit graphiquement.
- source_word: עַזְרִיקָם
  choice: Azriqam
  rationale: Transcription française proche de la forme hébraïque, avec « q » pour ק.
- source_word: חֲשַׁבְיָה
  choice: Hashabia
  rationale: Transcription française du nom hébreu, qui conserve distinctement ses éléments phonétiques principaux.
- source_word: מִן בְּנֵי מְרָרִי
  choice: l’un des descendants de Merari
  rationale: Ici, בְּנֵי désigne le groupe issu de Merari plutôt que ses seuls fils immédiats. Cette formulation rend naturellement en français l’appartenance de Shemaya à cette lignée lévitique.
