base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/044.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan[b]. These were the sons of Azel.'
translation:
  language: fr
  text: 'Atsel eut six fils[a]. Voici leurs noms : Azrikam, son premier-né, Ismaël, Shearia, Abdias et Hanan. Ce sont les fils d’Atsel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu vocalisé dit littéralement « six fils », mais ne donne ensuite que cinq noms : Azrikam est qualifié de « son premier-né ». Le passage parallèle en 1 Chroniques 8.38 énumère un sixième fils, Bokrou ; cette lecture peut aussi expliquer le mot hébreu ici.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וּלְאָצֵל שִׁשָּׁה בָנִים
  choice: Atsel eut six fils
  rationale: La tournure française exprime naturellement la relation de filiation indiquée par לְ dans cette formule généalogique, tout en conservant le nombre et le terme précis « fils ».
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: dont voici les noms
  rationale: Cette formulation actuelle et naturelle introduit la liste tout en respectant le suffixe pluriel « leurs » du texte hébreu.
- source_word: עַזְרִיקָם
  choice: Azrikam
  rationale: Transcription française transparente du nom hébreu.
- source_word: בֹּכְרוּ
  choice: Bokrou
  rationale: Le mot est compris ici comme un nom propre, ce qui donne bien les six noms annoncés par le verset. La vocalisation peut toutefois aussi se comprendre comme « son premier-né »; cette ambiguïté réelle est signalée en note.
- source_word: יִשְׁמָעֵאל
  choice: Ismaël
  rationale: Forme française traditionnelle et largement reconnaissable du nom.
- source_word: שְׁעַרְיָה
  choice: Shearia
  rationale: Transcription française lisible du nom hébreu, sans terminaison anglaise ajoutée.
- source_word: עֹבַדְיָה
  choice: Abdias
  rationale: Forme française biblique courante du nom hébreu.
- source_word: חָנָן
  choice: Hanan
  rationale: Transcription française usuelle du nom.
- source_word: אֵלֶּה בְּנֵי אָצַל
  choice: Ce sont là les fils d’Atsel
  rationale: La formule finale reprend clairement le nom d’Atsel et conserve la fonction récapitulative de l’hébreu.
