  source_fidelity: La vocalisation du texte massorétique (בֹּכְרוּ) signifie « son premier-né » et qualifie Azrikam ; elle ne présente pas Bokrou comme un sixième nom. Le texte affirme toutefois qu’Atsel a six fils tout en n’en énumérant explicitement que cinq selon cette vocalisation. Cette tension doit être conservée et signalée, non résolue silencieusement dans le texte.
  naturalness: La formulation proposée est naturelle en français moderne et garde le ton sobre d’une liste généalogique. « Voici leurs noms » rend plus directement la formule hébraïque que « dont voici les noms ».
  terminology: « fils », « premier-né », Ismaël, Abdias et Hanan conviennent. « Atsel » et « Shearia » sont maintenus de façon cohérente avec le projet. La note distingue clairement la lecture massorétique de la possibilité textuelle attestée par le parallèle, sans transformer celle-ci en traduction principale.
  issues:
  - severity: high
    issue: Le texte principal traite « Bokrou » comme un nom propre.
    rationale: Dans le WLC fourni, בֹּכְרוּ est vocalisé « son premier-né » et se rapporte à Azrikam. Rendre ce mot par un sixième nom privilégie une autre lecture contre la forme textuelle de base.
  - severity: medium
    issue: La note affirme que le mot « peut être lu » comme nom propre, mais le texte principal choisit cette lecture pour harmoniser le décompte.
    rationale: La contradiction numérique du texte massorétique est réelle. Elle doit être explicitement signalée ; le parallèle de 1 Chroniques 8:38 peut expliquer l’existence de la lecture « Bokrou », mais ne doit pas supprimer la difficulté dans la traduction du WLC.
  - severity: low
    issue: « dont voici les noms » est moins direct que la formule correspondante.
    rationale: « Voici leurs noms » est idiomatique et reflète simplement « et voici leurs noms ».
