source:
  edition: WLC
  text: וּ/מִן בְּנֵ֖י בִּנְיָמִ֑ן סַלּוּא֙ בֶּן מְשֻׁלָּ֔ם בֶּן הוֹדַוְיָ֖ה בֶּן הַ/סְּנֻאָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/007.yaml
  text: 'And from the sons of Benjamin: Sallu son of Meshullam[a], son of Hodaviah[c][b], son of Hassenuah.'
translation:
  language: fr
  text: 'Et parmi les fils de Benjamin : Sallou, fils de Meshoullam, fils de Hodavia, fils de Hassenoua.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les généalogies hébraïques, « fils de » peut désigner un fils direct ou, plus largement, un descendant.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִן
  choice: Parmi
  rationale: La préposition מִן introduit ici un membre issu du groupe mentionné, tandis que ו relie ce verset à la liste précédente. En français, « Parmi » rend naturellement cette relation dans le registre généalogique.
- source_word: בְּנֵי בִּנְיָמִן
  choice: les fils de Benjamin
  rationale: Littéralement « les fils de Benjamin » ; dans ce registre, l’expression désigne les membres ou descendants de la tribu, tout en conservant la forme généalogique du texte hébreu.
- source_word: סַלּוּא
  choice: Sallou
  rationale: Translittération française naturelle du nom hébreu, avec « ou » pour /u/.
- source_word: בֶּן
  choice: fils de
  rationale: La répétition de בֶּן structure la chaîne généalogique. « Fils de » préserve cette forme, sans exclure que certaines généalogies puissent omettre des générations.
- source_word: מְשֻׁלָּם
  choice: Meshoullam
  rationale: Translittération adaptée aux conventions phonographiques françaises.
- source_word: הוֹדַוְיָה
  choice: Hodavia
  rationale: Le choix suit la forme vocalisée du texte massorétique ici, plutôt qu’une graphie apparentée attestée dans d’autres traditions généalogiques.
- source_word: הַסְּנֻאָה
  choice: Hassenoua
  rationale: Dans ce contexte généalogique, la forme est comprise comme un nom propre ; la consonne redoublée reflète l’assimilation de l’article hébreu.
