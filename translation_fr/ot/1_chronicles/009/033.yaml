source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ֠/מְשֹׁרְרִים רָאשֵׁ֨י אָב֧וֹת לַ/לְוִיִּ֛ם בַּ/לְּשָׁכֹ֖ת פטירים כִּֽי יוֹמָ֥ם וָ/לַ֛יְלָה עֲלֵי/הֶ֖ם בַּ/מְּלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/033.yaml
  text: These were the singers[a], heads of fathers’ houses of the Levites, in the chambers, free from other duties, for they were occupied in the work day and night.
translation:
  language: fr
  text: 'Voici les chanteurs, chefs des familles lévitiques : ils étaient dans les salles, dispensés[a] des autres tâches, car le travail leur incombait jour et nuit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est rare; il peut aussi se traduire par « exemptés » ou « dégagés ». Il indique probablement qu’ils étaient libérés des autres tâches en raison de leur service continuel de chanteurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: les chanteurs
  rationale: Le participe de שׁיר désigne ceux qui chantent. « Chanteurs » est direct, moderne et plus précis que « musiciens ».
- source_word: רָאשֵׁי אָבוֹת לַלְוִיִּם
  choice: chefs des familles lévitiques
  rationale: Cette formulation naturelle en français exprime la fonction de chefs des groupes familiaux ou ancestraux parmi les Lévites, sans reproduire littéralement l’expression hébraïque peu idiomatique « maisons des pères ».
- source_word: בַּלְּשָׁכֹת
  choice: dans les salles
  rationale: לשכה désigne des pièces ou salles, ici dans le complexe cultuel. La traduction n’ajoute pas « du Temple », qui reste implicite dans le contexte.
- source_word: פטירים
  choice: dispensés des autres tâches
  rationale: 'Ce terme rare est généralement compris au sens de « libres », « exemptés » ou « dégagés ». Le complément « des autres tâches » explicite sobrement l’implication contextuelle : leur service continu les dégageait des autres fonctions.'
- source_word: יוֹמָם וָלַיְלָה
  choice: jour et nuit
  rationale: Cette expression conserve directement la paire temporelle hébraïque et l’idée d’une responsabilité continue.
- source_word: עֲלֵיהֶם בַּמְּלָאכָה
  choice: le travail leur incombait
  rationale: Littéralement, le travail était « sur eux ». « Leur incombait » rend naturellement en français cette idée de charge ou de responsabilité sans préciser davantage la nature du travail.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Chanteurs » est préféré à l’archaïsant « chantres »; « salles » conserve la référence spatiale sans ajouter explicitement le Temple. La seconde proposition rend l’obligation exprimée par l’idiome hébreu tout en préservant le caractère général de « travail ».
