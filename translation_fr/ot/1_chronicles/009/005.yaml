lexical_decisions:
- source_word: וּ/מִן
  choice: Parmi
  rationale: Dans cette liste généalogique, la préposition introduit le groupe dont est issu le personnage nommé. « Parmi » rend naturellement cette relation en français; l’enchaînement additif est suffisamment porté par la structure du registre.
- source_word: הַ/שִּׁילוֹנִי
  choice: les Shilonites
  rationale: Bien que le gentilé hébreu soit morphologiquement au singulier, il a ici une valeur collective après la préposition. La translittération « Shilonites » suit directement la forme consonantique du texte.
- source_word: עֲשָׂיָה
  choice: Asaya
  rationale: Le nom propre est translittéré selon un usage français courant, plutôt que traduit.
- source_word: הַ/בְּכֹר
  choice: le premier-né
  rationale: Le terme désigne spécifiquement le fils premier-né, et non simplement l’aîné au sens large.
- source_word: וּ/בָנָיו
  choice: et ses fils
  rationale: Le nom hébreu désigne ici les fils, tandis que la conjonction conserve la structure sobre de la liste.
