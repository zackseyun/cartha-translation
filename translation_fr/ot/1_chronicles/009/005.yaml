  text: 'And from the Shilonites: Asaiah the firstborn and his sons[a].'
translation:
  language: fr
  text: 'Et parmi les Shilonites : Asaya, le premier-né, et ses fils.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « les Shélonites », selon une autre identification traditionnelle de ce clan.
