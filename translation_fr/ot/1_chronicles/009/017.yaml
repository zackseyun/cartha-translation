  text: וְ/הַ/שֹּׁעֲרִים֙ שַׁלּ֣וּם וְ/עַקּ֔וּב וְ/טַלְמֹ֖ן וַ/אֲחִימָ֑ן וַ/אֲחִי/הֶ֥ם שַׁלּ֖וּם הָ/רֹֽאשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/017.yaml
  text: And the gatekeepers were Shallum[a], Akkub, Talmon, Ahiman, and their brothers; Shallum was the chief.
translation:
  language: fr
  text: Les gardiens des portes étaient Shalloum, Akkoub, Talmôn et Ahimân, avec leurs frères[a]. Shalloum était le chef.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les membres de leur clan » ; l’hébreu dit littéralement « leurs frères », expression qui peut désigner des frères biologiques ou, dans ce genre de liste, des membres du même clan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: les gardiens des portes
  rationale: Désigne les hommes chargés de surveiller et de garder les portes, ici dans le contexte du temple. Cette formulation est claire et naturelle en français moderne.
- source_word: שַׁלּוּם
  choice: Shalloum
  rationale: Nom propre translittéré selon une forme française courante qui rend la consonne initiale et la voyelle longue finales.
- source_word: עַקּוּב
  choice: Akkoub
  rationale: Nom propre translittéré en conservant le redoublement consonantique et une graphie adaptée au français.
- source_word: טַלְמֹן
  choice: Talmôn
  rationale: Nom propre translittéré; l’accent circonflexe aide à distinguer la voyelle de la dernière syllabe selon l’usage biblique français.
- source_word: אֲחִימָן
  choice: Ahimân
  rationale: Nom propre translittéré dans une forme naturelle en français biblique.
- source_word: אֲחִיהֶם
  choice: leurs frères
  rationale: Rend littéralement le terme hébreu, tout en laissant ouverte son extension possible à des membres du même clan ou groupe.
- source_word: הָרֹאשׁ
  choice: le chef
  rationale: Le nom exprime ici le rang ou la fonction de direction; « le chef » est plus naturel en français que le calque « la tête ».
- source_word: וְ...וְ...וַ...וַ
  choice: énumération coordonnée en français
  rationale: Les conjonctions hébraïques répétées sont rendues par une énumération française fluide, avec « et » avant le dernier nom et « avec » pour rattacher le groupe des frères.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe en deux phrases évite une coordination lourde et rend clairement le statut de Shalloum, sans préciser au-delà de l’hébreu la nature du lien exprimé par « frères ».
