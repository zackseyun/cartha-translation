  text: וּ/סְבִיב֥וֹת בֵּית הָ/אֱלֹהִ֖ים יָלִ֑ינוּ כִּֽי עֲלֵי/הֶ֣ם מִשְׁמֶ֔רֶת וְ/הֵ֥ם עַל הַ/מַּפְתֵּ֖חַ וְ/לַ/בֹּ֥קֶר לַ/בֹּֽקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/027.yaml
  text: They spent the night around the house of God[a], because the duty of guarding it was upon them, and they were in charge of opening it morning by morning.
translation:
  language: fr
  text: Ils passaient la nuit aux abords de la maison de Dieu, car la garde leur était confiée. Ils en assuraient l’ouverture[a], matin après matin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils étaient préposés à la clé ». L’hébreu peut évoquer soit la garde de la clé, soit la responsabilité d’ouvrir la maison de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְבִיבוֹת
  choice: autour de
  rationale: Cette formulation conserve le sens spatial de la forme adverbiale hébraïque et reste naturelle en français.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: La traduction littérale préserve l’expression hébraïque; dans le contexte, elle désigne le sanctuaire sans qu’il soit nécessaire de la remplacer par « temple ».
- source_word: יָלִינוּ
  choice: passaient la nuit
  rationale: Le verbe exprime le fait de demeurer ou de loger quelque part pendant la nuit, sans impliquer nécessairement qu’ils dormaient.
- source_word: עֲלֵיהֶם מִשְׁמֶרֶת
  choice: ils étaient chargés de la garder
  rationale: Cette tournure française rend naturellement l’idée hébraïque d’une garde placée sous leur responsabilité. Le pronom renvoie à la maison de Dieu.
- source_word: וְהֵם עַל הַמַּפְתֵּחַ
  choice: ils étaient responsables de son ouverture
  rationale: L’hébreu dit littéralement qu’ils étaient « sur la clé ». Le contexte et la mention répétée du matin indiquent la responsabilité fonctionnelle d’ouvrir la maison de Dieu, tout en laissant la lecture littérale en note.
- source_word: וְלַבֹּקֶר לַבֹּקֶר
  choice: chaque matin
  rationale: La répétition hébraïque exprime une action régulière et récurrente; « chaque matin » est l’équivalent français le plus naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Maison de Dieu » conserve l’image hébraïque, tandis que « responsables de son ouverture » rend naturellement la fonction administrative suggérée par le contexte sans dissimuler le sens littéral, signalé en note.
