review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : les portiers passaient la nuit aux abords de la maison de Dieu parce que la garde leur incombait, et ils avaient la charge de l’ouverture quotidienne. Toutefois, « autour de la maison » peut suggérer une disposition circulaire immédiate; « aux abords » rend plus naturellement le sens de séjour dans les environs. La formulation de l’ouverture doit également rester liée à la responsabilité, plutôt qu’à l’acte seul.'
  naturalness: « Ils étaient responsables de son ouverture, chaque matin » est compréhensible, mais légèrement pesant et la virgule isole maladroitement le complément temporel. « Ils en assuraient l’ouverture, matin après matin » est plus idiomatique en français moderne et conserve l’idée de fonction confiée.
  terminology: « Maison de Dieu » préserve correctement l’expression hébraïque sans imposer « temple ». « Garde » et « ouverture » conviennent au contexte des portiers. La note maintient à juste titre l’ambiguïté lexicale de מַפְתֵּחַ (« clé » / responsabilité de l’ouverture).
