  - severity: low
    issue: Formulation de l’ouverture quotidienne
    rationale: « Responsables de son ouverture, chaque matin » est moins fluide; une formulation exprimant qu’ils en assuraient l’ouverture rend mieux la charge durable et la récurrence exprimée par « matin après matin ».
