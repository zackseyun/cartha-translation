source:
  edition: WLC
  text: וְֽ/עַד הֵ֔נָּה בְּ/שַׁ֥עַר הַ/מֶּ֖לֶךְ מִזְרָ֑חָ/ה הֵ֚מָּה הַ/שֹּׁ֣עֲרִ֔ים לְ/מַחֲנ֖וֹת בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/018.yaml
  text: Until then they were at the king’s gate on the east[b][a]; they were the gatekeepers for the camps of the sons of Levi.
translation:
  language: fr
  text: Jusqu’à présent[a], ils sont à la porte du roi, du côté est. Ce sont les gardiens des portes des campements[b] des fils de Lévi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusque-là ». L’expression hébraïque peut renvoyer au présent du narrateur ou à un point du récit.
    reason: lexical_alternative
  - marker: b
    text: Ou « groupes organisés » ou « divisions ». Le terme hébreu désigne des campements et, selon le contexte, les groupes qui les composent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד הֵנָּה
  choice: Jusqu’à présent
  rationale: L’expression indique une continuité temporelle jusqu’au point de référence du narrateur. « Jusqu’à présent » rend naturellement l’hébreu tout en laissant en note la possibilité d’un repère passé.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: à la porte du roi
  rationale: La préposition בְּ est ici locative. « Porte du roi » conserve directement la construction hébraïque.
- source_word: מִזְרָחָה
  choice: à l’est
  rationale: La forme directionnelle situe ou oriente la porte du côté est; « à l’est » est clair et naturel en français.
- source_word: הֵמָּה הַשֹּׁעֲרִים
  choice: Ce sont les gardiens des portes
  rationale: Le pronom indépendant הֵמָּה met le groupe en relief, et שֹׁעֲרִים désigne les personnes chargées de surveiller les portes.
- source_word: לְמַחֲנוֹת
  choice: affectés aux campements
  rationale: מַחֲנוֹת signifie littéralement « campements », mais peut aussi désigner des groupes organisés. « Affectés aux » explicite sobrement la relation marquée par לְ sans décider que le terme signifie nécessairement « divisions ».
- source_word: בְּנֵי לֵוִי
  choice: les fils de Lévi
  rationale: Cette traduction conserve l’expression généalogique hébraïque plutôt que de la remplacer par le raccourci interprétatif « les Lévites ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve « porte du roi » et « fils de Lévi », tout en rendant explicite l’affectation des gardiens. Les notes préservent les ambiguïtés temporelle et organisationnelle de l’hébreu.
