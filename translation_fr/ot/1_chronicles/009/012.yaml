  text: וַ/עֲדָיָה֙ בֶּן יְרֹחָ֔ם בֶּן פַּשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה וּ/מַעְשַׂ֨י בֶּן עֲדִיאֵ֧ל בֶּן יַחְזֵ֛רָה בֶּן מְשֻׁלָּ֥ם בֶּן מְשִׁלֵּמִ֖ית בֶּן אִמֵּֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/012.yaml
  text: and Adaiah son of Jeroham[a], son of Pashhur, son of Malchijah, and Maasai son of Adiel, son of Jahzerah, son of Meshullam, son of Meshillemith, son of Immer.
translation:
  language: fr
  text: Et Adaya, fils de Jéroham, fils de Pashhour, fils de Malkiya, et Maasaï, fils d’Adiel, fils de Yahzérah, fils de Meshoullam, fils de Meshillémith[a], fils d’Immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte ici « Meshillémith » ; une forme apparentée de ce nom apparaît ailleurs sous la forme « Meshillémoth ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲדָיָה
  choice: Adaya
  rationale: Le nom propre est transcrit selon les conventions françaises. La conjonction וַ est rendue par la coordination de la liste en français, sans ajouter « et » au début d’un verset qui constitue un fragment dépendant du contexte précédent.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette suite généalogique, « fils de » reproduit naturellement la structure hébraïque, tout en laissant ouverte la possibilité biblique d’une filiation plus éloignée.
- source_word: יְרֹחָם
  choice: Jéroham
  rationale: Transcription française usuelle du nom propre hébreu.
- source_word: פַּשְׁחוּר
  choice: Pashhour
  rationale: Transcription française qui représente le ח par « h » dans cette forme biblique traditionnelle.
- source_word: מַלְכִּיָּה
  choice: Malkiya
  rationale: Transcription proche de la forme hébraïque, avec « k » pour כּ et « ya » pour l’élément final יָּה.
- source_word: וּמַעְשַׂי
  choice: et Maasaï
  rationale: La conjonction est rendue par « et ». Le nom est transcrit d’après la forme consonantique et vocalisée présente ici, sans l’assimiler au nom plus long Maaséya.
- source_word: עֲדִיאֵל
  choice: Adiel
  rationale: Transcription française transparente du nom propre.
- source_word: יַחְזֵרָה
  choice: Yahzéra
  rationale: Transcription fondée sur la forme hébraïque, avec « Y » pour le yod initial et des accents adaptés à la lecture française.
- source_word: מְשֻׁלָּם
  choice: Meshoullam
  rationale: Transcription française représentant la voyelle qibbouts par « ou » et la consonne redoublée par « ll ».
- source_word: מְשִׁלֵּמִית
  choice: Meshillémith
  rationale: La transcription suit directement la forme vocalisée du texte massorétique de ce verset et la distingue de la forme apparentée Meshillémoth.
- source_word: אִמֵּר
  choice: Immer
  rationale: Transcription directe du nom propre, conservant le redoublement du mem.
