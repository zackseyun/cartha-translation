  text: וּ/בְנ֥/וֹ הַ/בְּכ֖וֹר עַבְדּ֑וֹן וְ/צ֣וּר וְ/קִ֔ישׁ וּ/בַ֥עַל וְ/נֵ֖ר וְ/נָדָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/036.yaml
  text: And his firstborn son was Abdon[a], then Zur, Kish, Baal, Ner, and Nadab.
translation:
  language: fr
  text: Son fils aîné était Abdon, et Tsur, Kis, Baal, Ner et Nadab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנוֹ
  choice: Son fils
  rationale: Le nom בְּנוֹ signifie « son fils »; la conjonction initiale וּ est absorbée dans l’enchaînement naturel de la généalogie en français.
- source_word: הַבְּכוֹר
  choice: premier-né
  rationale: Ce terme désigne le premier-né. Cette formulation conserve le registre généalogique et évite de réduire la notion au simple âge relatif exprimé par « aîné ».
- source_word: עַבְדּוֹן
  choice: Abdôn
  rationale: Nom propre translittéré selon une forme française usuelle, avec l’accent circonflexe signalant la voyelle longue.
- source_word: וְצוּר
  choice: puis Tsour
  rationale: La conjonction répétée introduit la suite de la liste. « Puis » rend cette progression de manière idiomatique sans imposer une relation autre que l’ordre généalogique présenté.
- source_word: וְקִישׁ
  choice: Qish
  rationale: Nom propre translittéré; la conjonction est intégrée à la structure française de l’énumération.
- source_word: וּבַעַל
  choice: Baal
  rationale: Le texte présente ici בַּעַל comme un nom personnel; sa forme est conservée sans euphémisation.
- source_word: וְנֵר
  choice: Ner
  rationale: Nom propre translittéré; la conjonction est absorbée dans l’énumération française.
- source_word: וְנָדָב
  choice: et Nadab
  rationale: Le dernier וְ est rendu par « et », conformément à l’usage français en fin d’énumération.
theological_decisions:
- issue: Le nom personnel בַּעַל dans une généalogie israélite
  choice: Baal, comme nom personnel
  alternative: Remplacer ou modifier le nom afin d’éviter son association avec la divinité cananéenne
  rationale: Dans ce contexte généalogique, le texte hébreu donne explicitement בַּעַל comme nom d’une personne. Le conserver reflète le texte source sans cautionner le culte idolâtre ni harmoniser avec d’autres traditions nominales.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase nominale hébraïque reçoit « était » pour être naturelle en français, tandis que la note conserve sa structure plus littérale. Les noms sont translittérés sans francisation excessive.
