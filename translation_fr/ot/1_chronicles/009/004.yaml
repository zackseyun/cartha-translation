  text: Uthai son of Ammihud[a], son of Omri, son of Imri, son of Bani, from the sons of Perez son of Judah.
translation:
  language: fr
  text: Outhaï, fils d’Ammihoud, fils d’Omri, fils d’Imri, fils de Bani[a], d’entre les descendants de Pérets, fils de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte écrit hébreu porte בני, qui peut être compris comme le nom « Bani »; la lecture traditionnelle indique מן, « de ». Cette dernière lecture donnerait : « fils d’Imri, d’entre les descendants de Pérets, fils de Juda ». Le texte principal suit la lecture du nom propre, qui prolonge la chaîne généalogique.'
    reason: textual_variant
lexical_decisions:
- source_word: עוּתַי
  choice: Outaï
  rationale: Nom propre translittéré selon l’usage français biblique courant.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette généalogie, cette expression rend directement la forme hébraïque, sans exclure une éventuelle compression des générations.
- source_word: עַמִּיהוּד
