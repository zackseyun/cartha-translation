  rationale: Translittération naturelle du nom propre en français.
- source_word: בני/מן
  choice: Bani
  rationale: La lecture comme nom propre poursuit la chaîne généalogique de manière cohérente. La difficulté textuelle et la lecture alternative « parmi » sont signalées en note.
- source_word: בְּנֵי
  choice: parmi les descendants de
  rationale: Dans cette désignation de clan, « descendants de » exprime plus naturellement que « fils de » l’appartenance à la lignée de Pérets, tout en conservant le sens généalogique.
- source_word: פֶרֶץ
  choice: Pérets
  rationale: Forme française conventionnelle du nom propre.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française conventionnelle; Juda désigne ici l’ancêtre de la lignée.
