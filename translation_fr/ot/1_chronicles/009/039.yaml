  variant: modern international French
source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/039.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: fr
  text: Ner engendra Qish, Qish engendra Saül, et Saül engendra Jonathan, Malki-Shoua, Abinadab et Eshbaal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eshbaal est appelé Ish-Bosheth en 2 Samuel 2.8 et dans les passages apparentés.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans cette généalogie, le hifil de ילד exprime l’action d’engendrer. « Engendra » est concis, digne et usuel dans le registre généalogique biblique.
- source_word: נֵר
  choice: Ner
  rationale: Nom propre transcrit sous sa forme française biblique courante.
- source_word: קִישׁ
  choice: Qish
  rationale: Transcription française qui représente la consonne initiale hébraïque qoph et distingue ce nom de formes fondées sur la convention anglaise.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Forme française traditionnelle et courante du nom.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malki-Shoua
  rationale: Le nom composé est rendu par une transcription adaptée au français; le trait d’union en manifeste l’unité tout en conservant ses deux éléments.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Forme française biblique courante du nom propre.
- source_word: אֶשְׁבָּעַל
  choice: Eshbaal
  rationale: Le texte des Chroniques porte explicitement אֶשְׁבָּעַל; la traduction suit donc cette forme sans l’harmoniser avec le nom employé dans Samuel.
- source_word: וְ
  choice: et
  rationale: Les conjonctions structurent la succession généalogique; elles sont rendues là où le français naturel les requiert.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Cette particule marque le complément d’objet direct défini en hébreu et n’a pas d’équivalent lexical autonome en français.
theological_decisions:
- issue: Rapport entre Eshbaal et Ish-Bosheth
  choice: Conserver « Eshbaal » dans le texte et signaler l’autre nom en note.
  alternative: Remplacer « Eshbaal » par « Ish-Bosheth » pour harmoniser avec 2 Samuel.
  rationale: Le texte massorétique de 1 Chroniques doit être traduit tel quel. La note permet d’identifier le personnage sans effacer la différence entre les traditions nominales.
translation_notes:
  register: Français moderne, clair et digne, avec le verbe généalogique traditionnel « engendrer ». Les noms suivent des formes françaises reconnues ou une transcription francisée cohérente.
