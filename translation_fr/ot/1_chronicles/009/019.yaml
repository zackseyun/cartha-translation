  text: וְ/שַׁלּ֣וּם בֶּן ק֠וֹרֵא בֶּן אֶבְיָסָ֨ף בֶּן קֹ֜רַח וְֽ/אֶחָ֧י/ו לְ/בֵית אָבִ֣י/ו הַ/קָּרְחִ֗ים עַ֚ל מְלֶ֣אכֶת הָ/עֲבוֹדָ֔ה שֹׁמְרֵ֥י הַ/סִּפִּ֖ים לָ/אֹ֑הֶל וַ/אֲבֹֽתֵי/הֶם֙ עַל מַחֲנֵ֣ה יְהוָ֔ה שֹׁמְרֵ֖י הַ/מָּבֽוֹא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/019.yaml
  text: And Shallum son of Kore[a], son of Ebiasaph, son of Korah, and his brothers from his father’s house, the Korahites, were over the work of the service, keepers of the thresholds of the tent; and their fathers had been over the camp of Yahweh[b], keepers of the entrance.
translation:
  language: fr
  text: 'Shalloum, fils de Qoré[a], fils d’Ébiasaph, fils de Coré, et ses frères de sa famille paternelle, les Coréites, étaient chargés du travail du service : ils gardaient les seuils de la tente[b]. Leurs pères avaient été responsables du camp de Yahweh[c] et en gardaient l’entrée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qoré transcrit קוֹרֵא (Qoréa), un nom distinct de Coré, qui transcrit קֹרַח (Qorah).
    reason: clarification de deux noms hébreux distincts
  - marker: b
    text: 'Autre traduction possible : « les portes de la tente ». L’hébreu dit littéralement « les seuils de la tente ».'
    reason: alternative lexicale
  - marker: c
    text: « Yahweh » transcrit le nom divin YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: explicitation du rendu du nom divin
lexical_decisions:
- source_word: וְשַׁלּוּם
  choice: Shalloum
  rationale: Le waw relie le verset à la liste précédente, mais la coordination française est naturellement portée par « et ses frères » dans cette longue phrase nominale.
- source_word: בֶּן קוֹרֵא בֶּן אֶבְיָסָף בֶּן קֹרַח
  choice: fils de Coré, fils d’Ébiasaph, fils de Coré
  rationale: La formule généalogique répétée est conservée, sans la réduire à une simple idée de descendance.
- source_word: וְאֶחָיו לְבֵית אָבִיו
  choice: et ses frères de sa famille paternelle
  rationale: « Frères » conserve le terme familial, tandis que « famille paternelle » exprime naturellement l’unité clanique désignée par « maison du père ».
- source_word: הַקָּרְחִים
  choice: les Coréites
  rationale: Le pluriel gentilique désigne les membres de la lignée de Coré.
- source_word: עַל מְלֶאכֶת הָעֲבוֹדָה
  choice: étaient chargés du travail du service
  rationale: La préposition indique ici la responsabilité; « service » évite les connotations ecclésiales plus tardives de « ministère ».
- source_word: שֹׁמְרֵי הַסִּפִּים לָאֹהֶל
  choice: ils gardaient les seuils de la tente
  rationale: Le participe exprime une fonction continue; « seuils » conserve l’image concrète du texte et « tente » traduit le terme non technique אֹהֶל.
- source_word: וַאֲבֹתֵיהֶם עַל מַחֲנֵה יְהוָה
  choice: Leurs pères avaient été responsables du camp de Yahweh
  rationale: Le plus-que-parfait marque le regard rétrospectif; « pères » conserve le langage généalogique et « responsables » rend idiomatiquement l’idée de surveillance.
- source_word: שֹׁמְרֵי הַמָּבוֹא
  choice: en gardaient l’entrée
  rationale: Cette formulation rend la fonction de gardiens et rattache clairement l’entrée au camp, sans ajouter de précision absente de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette donnée plutôt que de lui substituer un titre.
- issue: Degré de technicité du vocabulaire du sanctuaire
  choice: la tente
  alternative: le tabernacle
  rationale: L’hébreu emploie le mot ordinaire pour « tente »; la traduction ne rend pas le référent plus technique que la formulation source.
- issue: Référent de הַסִּפִּים
  choice: les seuils
  alternative: les portes
  rationale: Le sens concret de « seuils » est retenu, tout en signalant en note la traduction fonctionnelle possible dans ce contexte de garde des accès.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement restructurée en deux phrases pour éviter une accumulation pesante, tout en conservant la généalogie, les rapports de responsabilité et le parallèle entre les gardiens présents et leurs pères.
