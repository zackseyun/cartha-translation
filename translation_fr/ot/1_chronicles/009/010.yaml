  text: 'Et parmi les prêtres : Yedaïa, Yehoyarib et Yakin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: Parmi
  rationale: Dans cette liste, la conjonction et la préposition introduisent le groupe dont sont tirés les noms. « Parmi » est naturel en français et conserve cette relation partitive; l’enchaînement avec le contexte suffit à rendre la valeur connective de וּ.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant et précis du nom hébreu défini désignant le groupe sacerdotal.
- source_word: יְדַעְיָה
  choice: Yedaïa
  rationale: Translittération française moderne du nom hébreu, avec tréma pour signaler la séparation vocalique finale.
- source_word: וִיהוֹיָרִיב
  choice: Yehoyarib
  rationale: Translittération proche de la forme hébraïque du nom; la conjonction préfixée est rendue par la coordination française de la liste.
- source_word: וְיָכִין
  choice: et Yakin
  rationale: Le waw est rendu par « et » devant le dernier élément, et le nom est translittéré selon sa consonne initiale hébraïque.
