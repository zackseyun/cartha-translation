base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/035.yaml
  text: In Gibeon lived Jeiel the father of Gibeon[b][a], and his wife's name was Maacah.
translation:
  language: fr
  text: À Gabaon habitait Yeïel[a], père de Gabaon[b], et sa femme, qui s’appelait Maaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom peut aussi être transcrit « Yeouel »; voir le passage parallèle en 1 Chroniques 8.29.
    reason: textual_variant
  - marker: b
    text: Ou « fondateur de Gabaon » ou « chef de Gabaon »; littéralement, en hébreu, « père de Gabaon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/גִבְע֛וֹן
  choice: À Gabaon
  rationale: Le waw relie cette notice au contexte, mais n’a pas besoin d’être rendu explicitement en tête de phrase. La préposition בְּ exprime ici le lieu.
- source_word: יָשְׁב֥וּ
  choice: habitaient
  rationale: Le verbe ישׁב désigne ici le fait de résider. Le pluriel hébreu est conservé, conformément au texte massorétique, en comprenant Yeïel et sa femme comme sujets de la phrase.
- source_word: אֲבִֽי גִבְע֖וֹן
  choice: père de Gabaon
  rationale: Cette traduction conserve l’expression hébraïque, qui peut désigner le père ou l’ancêtre d’une personne, mais aussi le fondateur ou le chef d’une localité ou d’un clan.
- source_word: יעואל
  choice: Yeïel
  rationale: La vocalisation massorétique et le passage parallèle de 1 Chroniques 8.29 soutiennent la forme traditionnelle Yeïel; la graphie consonantique permet toutefois une autre lecture, signalée en note.
- source_word: וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ
  choice: et sa femme, qui s’appelait
  rationale: Formulation française naturelle qui rend la proposition nominale « et le nom de sa femme [était] » sans en modifier le sens.
- source_word: מַעֲכָֽה
  choice: Maaka
  rationale: Transcription française claire du nom hébreu מַעֲכָה, distinguant le son final de la consonne ח.
