  text: וְ/עֹבַדְיָה֙ בֶּֽן שְׁמַֽעְיָ֔ה בֶּן גָּלָ֖ל בֶּן יְדוּת֑וּן וּ/בֶרֶכְיָ֤ה בֶן אָסָא֙ בֶּן אֶלְקָנָ֔ה הַ/יּוֹשֵׁ֖ב בְּ/חַצְרֵ֥י נְטוֹפָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/016.yaml
  text: and Obadiah son of Shemaiah[a], son of Galal, son of Jeduthun, and Berechiah son of Asa, son of Elkanah, who lived in the villages of the Netophathites.
translation:
  language: fr
  text: et Abdias, fils de Shemaïa, fils de Galal, fils de Jedoutoun, et Bérékia, fils d’Asa, fils d’Elqana, qui habitait dans les villages des Netophatiens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans les hameaux de Netopha » : le gentilé hébreu peut désigner soit les habitants de Netopha, soit, dans cette expression, le lieu lui-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹבַדְיָה
  choice: et Abdias
  rationale: La conjonction relie Abdias à la liste précédente. « Abdias » est la forme française traditionnelle et intelligible de ce nom.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette généalogie, « fils de » rend directement la relation exprimée, sans exclure le possible télescopage propre aux listes généalogiques.
- source_word: שְׁמַעְיָה
  choice: Shemaïa
  rationale: Transcription française usuelle du nom personnel.
- source_word: גָּלָל
  choice: Galal
  rationale: Transcription directe du nom personnel.
- source_word: יְדוּתוּן
  choice: Jedoutoun
  rationale: Forme française traditionnelle du nom personnel.
- source_word: וּ/בֶרֶכְיָה
  choice: et Bérékia
  rationale: La conjonction poursuit l’énumération avec un autre Lévite; le nom suit une transcription française courante.
- source_word: אָסָא
  choice: Asa
  rationale: Forme française traditionnelle du nom personnel; le texte l’emploie ici simplement comme patronyme.
- source_word: אֶלְקָנָה
  choice: Elqana
  rationale: Transcription française moderne du nom personnel hébreu.
- source_word: הַ/יּוֹשֵׁב
  choice: qui habitait
  rationale: Le participe désigne Bérékia et exprime sa résidence; l’imparfait donne en français une formulation naturelle et durable.
- source_word: בְּ/חַצְרֵי
  choice: dans les villages de
  rationale: Dans ce contexte géographique, le terme désigne des agglomérations rurales ou hameaux, et non des cours ou enceintes.
- source_word: נְטוֹפָתִי
  choice: les Netophatiens
  rationale: L’adjectif gentilé désigne les habitants rattachés à Netopha. La formulation conserve cette lecture collective tout en signalant en note la lecture géographique possible.
