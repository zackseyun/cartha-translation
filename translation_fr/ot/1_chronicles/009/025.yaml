  text: וַ/אֲחֵי/הֶ֨ם בְּ/חַצְרֵי/הֶ֜ם לָ/ב֨וֹא לְ/שִׁבְעַ֧ת הַ/יָּמִ֛ים מֵ/עֵ֥ת אֶל עֵ֖ת עִם אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/025.yaml
  text: And their brothers in their villages were to come in every seven days[a], from time to time[b], with these.
translation:
  language: fr
  text: Leurs frères, qui habitaient dans leurs villages, devaient venir les rejoindre à intervalles réguliers de sept jours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour sept jours » ; l’hébreu semble désigner un roulement de service sur une période de sept jours.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Leurs frères
  rationale: Le sens premier est « leurs frères »; dans ce contexte, il peut aussi désigner leurs compagnons lévites, mais la formulation littérale reste naturelle en français.
- source_word: בְּחַצְרֵיהֶם
  choice: qui habitaient dans leurs villages
  rationale: חָצֵר peut désigner une cour, une enceinte ou un village. Ici, le contexte résidentiel hors du sanctuaire favorise « villages »; l'ajout de « qui habitaient » explicite naturellement la relation en français.
- source_word: לָבוֹא
  choice: devaient venir les rejoindre
  rationale: L'infinitif avec ל exprime ici une venue prévue dans le cadre du service. « Devaient venir » rend cette obligation organisée, tandis que « les rejoindre » exprime naturellement עִם אֵלֶּה sans laisser un démonstratif français obscur.
- source_word: לְשִׁבְעַת הַיָּמִים
  choice: tous les sept jours
  rationale: La formule évoque probablement un roulement ou un intervalle de sept jours. « Tous les sept jours » est clair et idiomatique, sans préciser davantage la nature du service.
- source_word: מֵעֵת אֶל עֵת
  choice: à intervalles réguliers
  rationale: L'expression indique une récurrence d'une période à l'autre. Cette traduction s'accorde avec le système de rotation suggéré par le contexte, tout en conservant l'idée de périodicité.
- source_word: עִם אֵלֶּה
  choice: les rejoindre
  rationale: Littéralement « avec ceux-ci ». Le pronom renvoie aux portiers déjà en fonction; « les rejoindre » transmet la relation de façon naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe explicite le cadre résidentiel et la venue programmée sans ajouter de précision institutionnelle absente de l’hébreu.
