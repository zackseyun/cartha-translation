  verdict: revise
  source_fidelity: La phrase rend correctement les frères établis dans les villages, leur venue programmée et leur association aux personnes déjà en service. Toutefois, « tous les sept jours, à intervalles réguliers » juxtapose deux expressions temporelles largement redondantes et rend moins clairement la relation entre les deux membres hébreux. Une formulation unifiée conserve la périodicité sans prétendre résoudre au-delà du nécessaire la valeur de לְשִׁבְעַת הַיָּמִים.
  naturalness: La phrase est globalement naturelle, mais l’enchaînement « tous les sept jours, à intervalles réguliers » est pesant. « À intervalles réguliers de sept jours » est plus fluide en français international moderne.
  terminology: « Frères », « villages » et « les rejoindre » conviennent au contexte et n’imposent pas une lecture confessionnelle. La note sur l’alternative « pour sept jours » doit être conservée, car la construction temporelle hébraïque admet cette possibilité.
