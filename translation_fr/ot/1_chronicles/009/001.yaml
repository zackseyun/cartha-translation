source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵל֙ הִתְיַחְשׂ֔וּ וְ/הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֖פֶר מַלְכֵ֣י יִשְׂרָאֵ֑ל וִ/יהוּדָ֛ה הָגְל֥וּ לְ/בָבֶ֖ל בְּ/מַעֲלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/001.yaml
  text: So all Israel was enrolled by genealogy[a], and behold, they are written in the Book of the Kings of Israel[b]; and Judah was taken into exile to Babylon because of their unfaithfulness.
translation:
  language: fr
  text: Tout Israël fut inscrit dans les généalogies[a], et les voilà consignés dans le livre des rois d’Israël ; Juda fut déporté à Babylone à cause de leur infidélité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut enregistré selon les généalogies » ou « fut recensé d’après les lignées familiales ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à cause de leur trahison » ou « à cause de leur manquement à la fidélité ». Le terme hébreu désigne une rupture de fidélité, souvent envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחְשׂוּ
  choice: fut inscrit dans les généalogies
  rationale: Le hitpael de יחס désigne l’établissement ou l’enregistrement de la filiation. Cette formulation garde le sens généalogique et administratif tout en restant naturelle en français.
- source_word: וְהִנָּם
  choice: et les voilà
  rationale: « Les voilà » restitue la valeur présentative et emphatique du marqueur hébreu sans recourir à l’archaïsant « voici que ».
- source_word: כְּתוּבִים
  choice: consignés
  rationale: 'Le participe passif décrit un état résultant : les Israélites figurent dans un document écrit. « Consignés » convient au contexte d’archives.'
- source_word: עַל סֵפֶר
  choice: dans le Livre
  rationale: Avec un verbe d’écriture, le français idiomatique emploie « dans ». « Livre » peut désigner ici un document ou registre officiel.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: L’expression identifie le titre ou la désignation d’un document historique; la majuscule à « Livre » le signale sans ajouter de précision absente de l’hébreu.
- source_word: וִיהוּדָה הָגְלוּ
  choice: Juda fut déporté
  rationale: Le hofal indique que Juda subit l’exil. Le singulier français convient au nom collectif « Juda », tandis que « déporté » conserve la force passive.
- source_word: לְבָבֶל
  choice: à Babylone
  rationale: Rendu français courant de la destination indiquée par la préposition hébraïque.
- source_word: בְּמַעֲלָם
  choice: à cause de leur infidélité
  rationale: מַעַל évoque une rupture de fidélité ou une trahison, souvent dans le cadre de la relation avec Dieu. « Infidélité » préserve cette portée sans explicitation doctrinale excessive; le pluriel possessif reflète le suffixe hébreu renvoyant aux membres du peuple.
theological_decisions:
- issue: Nature de la faute exprimée par בְּמַעֲלָם
  choice: infidélité
  alternative: faute; trahison; manquement
  rationale: « Infidélité » conserve l’idée de rupture de foi ou de loyauté inhérente au terme, sans réduire celui-ci à une faute générique ni expliciter davantage que le texte.
- issue: Voix de הָגְלוּ
  choice: Juda fut déporté
  alternative: Juda partit en exil
  rationale: La forme hofal présente Juda comme subissant la déportation. Le passif préserve donc le contexte de jugement et évite de suggérer un départ volontaire.
translation_notes:
  register: Français international moderne, digne et accessible. « Les voilà consignés » maintient l’effet présentatif de l’hébreu; « déporté » exprime clairement l’exil subi. Le possessif pluriel « leur » suit le suffixe hébreu et traite Juda comme un peuple collectif.
