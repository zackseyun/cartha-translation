  yaml_path: translation/ot/1_chronicles/009/006.yaml
  text: 'And from the sons of Zerah: Jeuel and their brothers[a], six hundred and ninety.'
translation:
  language: fr
  text: 'Et parmi les fils de Zérah : Yeouel et leurs frères[a], six cent quatre-vingt-dix.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi comprendre : « Yeouel et ses frères, six cent quatre-vingt-dix », si Yeouel est considéré comme le représentant du clan. Toutefois, le suffixe hébreu traduit par « leurs » est au pluriel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  choice: Parmi
  rationale: La préposition introduit un groupe issu de la lignée de Zérah. En français, « Parmi » s’intègre naturellement à la liste tout en rendant la relation partitive; la continuité additive peut rester implicite.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Rendu direct et traditionnel dans un registre généalogique; l’expression peut également désigner plus largement les descendants ou membres du clan.
- source_word: זֶרַח
  choice: Zérah
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: יְעוּאֵל
  choice: Yeouel
  rationale: Translittération française lisible du nom hébreu, conservant approximativement ses éléments consonantiques et vocaliques.
- source_word: וַ/אֲחֵי/הֶם
  choice: et leurs frères
  rationale: Le suffixe hébreu est explicitement à la troisième personne du masculin pluriel. Le pluriel est donc conservé malgré l’absence d’un antécédent pluriel immédiat clairement exprimé.
- source_word: שֵׁשׁ מֵאוֹת וְ/תִשְׁעִים
  choice: six cent quatre-vingt-dix
  rationale: Le nombre est écrit en toutes lettres conformément au registre biblique courant; « cent » et « vingt » restent invariables puisqu’ils sont suivis d’un autre nombre.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne, adapté à une liste généalogique. La formulation conserve le pluriel surprenant du texte hébreu et signale en note la lecture française plus lissée.
