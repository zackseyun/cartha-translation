  naturalness: La phrase est fluide et d’un registre moderne approprié. « Matériel » est plus idiomatique et plus exact que « mobilier » dans ce contexte de gestion d’objets cultuels. La répétition de « de » reste naturelle et reflète les domaines distincts de responsabilité.
  terminology: « Objets sacrés », « farine fine », « vin », « huile » et « aromates » conviennent. « Oliban » restitue précisément לְבוֹנָה; une note fournit le terme plus courant « encens » et l’alternative liée au sanctuaire pour l’expression « objets sacrés ».
