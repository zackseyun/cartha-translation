  text: וּ/מֵ/הֶ֗ם מְמֻנִּים֙ עַל הַ/כֵּלִ֔ים וְ/עַ֖ל כָּל כְּלֵ֣י הַ/קֹּ֑דֶשׁ וְ/עַל הַ/סֹּ֨לֶת֙ וְ/הַ/יַּ֣יִן וְ/הַ/שֶּׁ֔מֶן וְ/הַ/לְּבוֹנָ֖ה וְ/הַ/בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/029.yaml
  text: And some of them were appointed over the vessels[a], over all the holy vessels, and over the fine flour, the wine, the oil, the frankincense, and the spices.
translation:
  language: fr
  text: Certains d’entre eux étaient chargés du matériel, de tous les objets sacrés[a], ainsi que de la farine fine, du vin, de l’huile, de l’oliban[b] et des aromates.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : de tous les objets du sanctuaire.'
    reason: La construction peut aussi être comprise comme désignant les objets appartenant au sanctuaire.
  - marker: b
    text: C’est-à-dire l’encens, ou frankincense.
    reason: L’oliban désigne spécifiquement la résine aromatique appelée en français courant « encens ».
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Certains d’entre eux
  rationale: 'Le préfixe מִן avec suffixe a ici un sens partitif : il désigne certains membres du groupe mentionné.'
- source_word: מְמֻנִּים עַל
  choice: étaient chargés de
  rationale: Le participe passif exprime une responsabilité assignée; cette tournure française est naturelle et conserve l’idée de délégation.
- source_word: הַכֵּלִים
  choice: le mobilier
  rationale: כְּלִי est un terme large désignant objets, ustensiles ou équipement. Ici, « mobilier » rend naturellement l’ensemble des biens ou équipements dont ils avaient la charge, tout en le distinguant de la catégorie sacrée qui suit.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: tous les objets sacrés
  rationale: La construction peut désigner les objets caractérisés par leur sainteté ou ceux du sanctuaire. « Objets sacrés » conserve la formulation compacte sans préciser davantage que l’hébreu.
- source_word: הַסֹּלֶת
  choice: la farine fine
  rationale: סֹלֶת désigne une farine de qualité fine, notamment employée dans les offrandes.
- source_word: הַיַּיִן
  choice: le vin
  rationale: Équivalent direct dans ce contexte de réserves cultuelles.
- source_word: הַשֶּׁמֶן
  choice: l’huile
  rationale: L’hébreu dit simplement « huile »; préciser « d’olive » irait au-delà du texte.
- source_word: הַלְּבוֹנָה
  choice: l’encens
  rationale: לְבוֹנָה désigne plus précisément l’oliban, couramment appelé « encens » en français biblique et cultuel.
- source_word: הַבְּשָׂמִים
  choice: les aromates
  rationale: Le terme désigne des substances aromatiques; « aromates » convient au contexte sacré mieux que « parfums » et reste assez large.
theological_decisions: []
