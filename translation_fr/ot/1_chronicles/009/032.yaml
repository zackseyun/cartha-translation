  text: וּ/מִן בְּנֵ֧י הַ/קְּהָתִ֛י מִן אֲחֵי/הֶ֖ם עַל לֶ֣חֶם הַֽ/מַּעֲרָ֑כֶת לְ/הָכִ֖ין שַׁבַּ֥ת שַׁבָּֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/032.yaml
  text: And some of the sons of the Kohathites[a], from among their brothers, were in charge of the bread of the arrangement, to prepare it Sabbath by Sabbath.
translation:
  language: fr
  text: Certains des descendants des Qehatites, parmi leurs frères, étaient responsables des pains disposés[a], afin de les préparer sabbat après sabbat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression traditionnellement rendue par « pains de proposition » ou « pains de la Présence ». L’hébreu désigne littéralement du pain disposé ou mis en ordre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי הַקְּהָתִי
  choice: Certains des descendants des Qehatites
  rationale: Le premier מִן a ici un sens partitif. « Descendants » rend naturellement l’expression clanique בְּנֵי en français moderne, sans suggérer qu’il s’agit seulement des fils immédiats.
- source_word: מִן אֲחֵיהֶם
  choice: pris parmi leurs frères
  rationale: Le second מִן est également partitif. « Frères » conserve l’expression familiale hébraïque, qui désigne ici les autres membres du groupe lévitique.
- source_word: עַל
  choice: étaient chargés de
  rationale: Dans ce contexte de répartition des fonctions, עַל exprime la responsabilité confiée à ces hommes.
- source_word: לֶחֶם הַמַּעֲרָכֶת
  choice: les pains disposés en rangées
  rationale: מַעֲרֶכֶת évoque ce qui est disposé ou ordonné. Cette formulation française exprime concrètement le sens probable de l’expression sans reprendre comme texte principal les appellations traditionnelles plus opaques.
- source_word: לְהָכִין
  choice: devaient les préparer
  rationale: L’infinitif indique la tâche associée à leur charge. Le pronom « les » reprend explicitement les pains, comme l’exige plus naturellement le français.
- source_word: שַׁבַּת שַׁבָּת
  choice: sabbat après sabbat
  rationale: La répétition du nom a une valeur distributive. Cette tournure conserve à la fois le rythme de l’hébreu et l’idée d’une préparation effectuée chaque sabbat.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement réorganisée pour rendre les deux expressions partitives naturelles, tout en conservant la terminologie familiale et la répétition expressive de « sabbat ».
