source:
  edition: WLC
  text: וּ/מֵ/הֶ֖ם עַל כְּלֵ֣י הָ/עֲבוֹדָ֑ה כִּֽי בְ/מִסְפָּ֣ר יְבִיא֔וּ/ם וּ/בְ/מִסְפָּ֖ר יוֹצִיאֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/028.yaml
  text: Some of them were in charge of the vessels of service[a], for they brought them in by count and took them out by count.
translation:
  language: fr
  text: 'Certains d’entre eux étaient responsables des objets utilisés pour le service[a] : ils les faisaient entrer en les comptant et les faisaient sortir en les comptant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des ustensiles du service » ou « du matériel servant au culte ». Le terme hébreu peut désigner de manière générale des récipients, des ustensiles, des objets ou des instruments.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Certains d’entre eux
  rationale: La construction partitive désigne une partie du groupe mentionné précédemment ; cette formulation est naturelle en français.
- source_word: עַל
  choice: étaient responsables de
  rationale: Dans ce contexte administratif, la préposition exprime une responsabilité ou une surveillance confiée.
- source_word: כְּלֵי הָעֲבוֹדָה
  choice: les objets utilisés pour le service
  rationale: כְּלִי est un terme large pouvant désigner des récipients, ustensiles, objets ou instruments ; עֲבוֹדָה renvoie ici au service du sanctuaire. La formulation reste claire sans préciser indûment la nature des objets.
- source_word: כִּי
  choice: ':'
  rationale: La proposition suivante explique concrètement leur responsabilité. En français, les deux-points rendent naturellement ce rapport explicatif.
- source_word: בְמִסְפָּר
  choice: en les comptant
  rationale: L’expression indique un contrôle numérique précis des objets à l’entrée comme à la sortie ; cette tournure est plus idiomatique que « par nombre ».
- source_word: יְבִיאוּם
  choice: ils les rentraient
  rationale: Le hiphil de בוא signifie « faire entrer, apporter à l’intérieur ». L’imparfait exprime ici une pratique habituelle.
- source_word: יוֹצִיאוּם
  choice: les ressortaient
  rationale: Le hiphil de יצא signifie « faire sortir ». Le choix forme un parallèle net avec « rentraient » et conserve l’idée de mouvement vers l’extérieur.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « Service » conserve le terme contextuel sans expliciter davantage que l’hébreu ; la note signale l’étendue sémantique de כְּלִי. La répétition « en les comptant » reproduit l’insistance du texte sur le contrôle de l’inventaire.
