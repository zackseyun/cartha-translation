base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/011.yaml
  text: And the sons of Gad lived opposite them in the land of Bashan[b][a], as far as Salecah.
translation:
  language: fr
  text: Les fils de Gad habitaient en face d’eux[a], dans le pays du Basan, jusqu’à Salca[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à côté d’eux » ou « vis-à-vis d’eux » ; l’expression hébraïque indique leur position par rapport au groupe mentionné précédemment.
    reason: lexical_alternative
  - marker: b
    text: Le nom « Salca » est aussi transcrit « Salka » ou « Saléka » dans certaines traductions.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: Les fils de Gad
  rationale: Dans ce contexte tribal, בְּנֵי désigne les membres ou descendants de la tribu de Gad. « Les fils de Gad » conserve la forme hébraïque traditionnelle tout en restant claire en français.
- source_word: לְנֶגְדָּם
  choice: en face d’eux
  rationale: La locution exprime une position relative par rapport au groupe mentionné auparavant. « En face d’eux » préserve le sens spatial sans préciser indûment la configuration géographique.
- source_word: יָשְׁבוּ
  choice: habitaient
  rationale: Le verbe יָשַׁב indique ici une résidence durable dans un territoire. « Habitaient » est naturel et n’impose pas l’idée d’un nouvel établissement.
- source_word: בְּאֶרֶץ הַבָּשָׁן
  choice: dans le pays du Basan
  rationale: אֶרֶץ désigne ici une région. « Basan » est la forme française biblique courante du nom géographique.
- source_word: עַד סַלְכָה
  choice: jusqu’à Salka
  rationale: עַד marque l’étendue géographique. « Salka » reproduit sobrement le nom hébreu סַלְכָה et convient à l’usage français.
