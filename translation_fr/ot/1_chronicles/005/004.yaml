  text: 'Les fils de Joël[a] : Shemaïa, son fils ; Gog, son fils ; Shimeï, son fils.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « descendants de Joël ». Dans les généalogies, le terme hébreu peut parfois désigner une descendance plus large ; toutefois, la répétition de « son fils » favorise ici l’idée d’une lignée directe.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן introduit ici une lignée généalogique. « Les fils de » conserve la formulation hébraïque, tandis que « descendants » reste possible selon l’usage généalogique.
- source_word: יוֹאֵל
  choice: Joël
  rationale: Forme française traditionnelle et transparente du nom propre hébreu.
- source_word: שְׁמַעְיָה
  choice: Shemaeya
  rationale: Translittération française lisible du nom hébreu, distinguant ses éléments phonétiques sans lui attribuer un sens dans le texte.
- source_word: בְנוֹ
  choice: son fils
  rationale: Le nom בֵּן avec suffixe masculin singulier marque le rapport filial; la répétition est conservée comme dans la formule généalogique hébraïque.
- source_word: גּוֹג
  choice: Gog
  rationale: Translittération française usuelle du nom propre; ici, il désigne simplement un membre de la généalogie.
- source_word: שִׁמְעִי
  choice: Shimeï
  rationale: Forme française traditionnelle du nom propre hébreu, avec le tréma indiquant que les voyelles se prononcent séparément.
