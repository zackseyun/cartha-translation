  text: They made war against the Hagrites[a], Jetur, Naphish, and Nodab.
translation:
  language: fr
  text: Ils firent la guerre aux Hagrites[a], à Yetour, à Naphish et à Nodab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Hagarites ». L’ethnonyme hébreu peut être translittéré de l’une ou l’autre manière.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ מִלְחָמָה
  choice: Ils firent la guerre
  rationale: L’expression hébraïque associe « faire » et « guerre ». « Faire la guerre » est son équivalent français naturel et conserve l’idée générale de guerre plutôt que celle d’un seul combat.
- source_word: עִם
  choice: aux / à
  rationale: Dans le contexte de la guerre, la préposition marque les adversaires. La construction française idiomatique est « faire la guerre à ».
- source_word: הַהַגְרִיאִים
  choice: les Hagrites
  rationale: L’ethnonyme hébreu est translittéré sous la forme française usuelle « Hagrites » ; l’article défini hébreu est rendu par « les ».
- source_word: וִיטוּר
  choice: Yetour
  rationale: Translittération française courante du nom propre hébreu יְטוּר.
- source_word: וְנָפִישׁ
  choice: Naphish
  rationale: Translittération française du nom propre hébreu.
- source_word: וְנוֹדָב
  choice: et Nodab
  rationale: Le nom propre est translittéré et la conjonction hébraïque est conservée pour clore naturellement l’énumération.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La tournure « firent la guerre à » restitue naturellement l’idiome hébreu, tandis que les noms propres suivent des formes de translittération françaises.
