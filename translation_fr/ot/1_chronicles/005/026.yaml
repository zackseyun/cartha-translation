  text: וַ/יָּעַר֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל אֶת ר֣וּחַ פּ֣וּל מֶֽלֶךְ אַשּׁ֗וּר וְ/אֶת ר֨וּחַ֙ תִּלְּגַ֤ת פִּלְנֶ֨סֶר֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּגְלֵ/ם֙ לָ/ראוּבֵנִ֣י וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ֠/יְבִיאֵ/ם לַ/חְלַ֨ח וְ/חָב֤וֹר וְ/הָרָא֙ וּ/נְהַ֣ר גּוֹזָ֔ן עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/026.yaml
  text: So the God of Israel stirred up the spirit of Pul king of Assyria[a], even the spirit of Tilgath-pilneser king of Assyria, and he took the Reubenites, the Gadites, and the half-tribe of Manasseh into exile, and brought them to Halah, Habor, Hara, and the river Gozan[b], to this day.
translation:
  language: fr
  text: Alors le Dieu d’Israël éveilla l’esprit de Poul, roi d’Assyrie, et l’esprit de Tilgath-Pilnéser, roi d’Assyrie[a]. Celui-ci déporta les Rubénites, les Gadites et la demi-tribu de Manassé, et les conduisit à Halah, à Habor, à Hara et au fleuve de Gozan, jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Poul et Tilgath-Pilnéser peuvent désigner ici deux rois distincts, ou deux noms du même roi d’Assyrie. Le verbe qui suit est au singulier.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּעַר
  choice: éveilla
  rationale: Le verbe exprime l’action de susciter ou de mettre en mouvement quelqu’un intérieurement. « Éveilla » reste proche de l’image hébraïque sans lui donner la nuance négative que pourrait avoir « incita ».
- source_word: ר֣וּחַ ... ר֨וּחַ
  choice: l’esprit de… l’esprit de
  rationale: La répétition de « l’esprit » reproduit celle de l’hébreu et conserve l’idée que Dieu agit sur l’élan intérieur ou la disposition du souverain.
- source_word: פּוּל
  choice: Poul
  rationale: Transcription française usuelle du nom propre hébreu.
- source_word: תִּלְּגַת פִּלְנֶסֶר
  choice: Tilgath-Pilnéser
  rationale: Cette transcription suit de près la forme propre au texte hébreu des Chroniques, plutôt que la forme française plus familière « Tiglath-Piléser ».
- source_word: וַיַּגְלֵם
  choice: Il déporta
  rationale: À la forme causative, גלה désigne ici le fait d’emmener une population en exil. « Déporta » est précis, naturel et concis en français.
- source_word: לָראוּבֵנִי וְלַגָּדִי
  choice: les Rubénites, les Gadites
  rationale: Ces gentilés désignent naturellement en français les membres des tribus de Ruben et de Gad.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: la demi-tribu de Manassé
  rationale: Expression française claire et traditionnelle pour la moitié transjordanienne de la tribu de Manassé.
- source_word: וַיְבִיאֵם
  choice: et les conduisit
  rationale: Le causatif de בוא signifie littéralement « faire venir ». Dans le contexte d’une déportation vers plusieurs lieux, « conduisit » exprime naturellement le déplacement imposé.
- source_word: לַחְלַח וְחָבוֹר וְהָרָא וּנְהַר גּוֹזָן
  choice: à Halah, à Habor, à Hara et au fleuve de Gozan
  rationale: Les noms de lieux sont transcrits, et נְהַר גּוֹזָן est rendu selon sa structure par « le fleuve de Gozan ».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: où ils sont restés jusqu’à ce jour
  rationale: L’ajout explicite de l’idée de permanence rend idiomatiquement en français le lien entre les lieux de déportation et « jusqu’à ce jour », sans modifier le sens contextuel.
theological_decisions:
- issue: Rapport entre Poul et Tilgath-Pilnéser
  choice: Le texte principal conserve la coordination littérale des deux noms.
  alternative: Comprendre Poul et Tilgath-Pilnéser comme deux noms du même roi d’Assyrie.
  rationale: La répétition de « l’esprit de » et la conjonction peuvent faire penser à deux souverains, tandis que le contexte historique et le verbe hébreu au singulier favorisent l’identification des deux noms à un même roi. La traduction ne tranche pas silencieusement cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu là où elle porte une ambiguïté réelle. Les noms propres suivent une transcription française cohérente avec la forme hébraïque des Chroniques.
