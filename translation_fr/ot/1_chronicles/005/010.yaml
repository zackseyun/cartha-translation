base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/010.yaml
  text: In the days of Saul they made war with the Hagrites[a], and they fell into their hand[b]; and they lived in their tents throughout all the region east of Gilead.
translation:
  language: fr
  text: Au temps de Saül, ils firent la guerre aux Hagrites[a], qui tombèrent entre leurs mains[b]. Ils habitèrent alors dans leurs tentes, dans toute la région située à l’est de Galaad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Hagarites ». L’ethnonyme hébreu désigne probablement un peuple associé à Agar.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ils tombèrent dans leur main », c’est-à-dire en leur pouvoir. D’après le contexte, ceux qui tombèrent sont les Hagrites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי שָׁאוּל
  choice: Au temps de Saül
  rationale: La construction idiomatique situe les événements durant le règne ou l’époque de Saül. « Au temps de » est naturel et digne en français moderne.
- source_word: עָשׂוּ מִלְחָמָה עִם
  choice: ils firent la guerre aux
  rationale: La locution signifie engager la guerre. Dans ce contexte hostile, le français demande naturellement « faire la guerre à », plutôt qu’un calque de la préposition hébraïque « avec ».
- source_word: הַהַגְרִאִים
  choice: les Hagrites
  rationale: « Hagrites » transcrit sobrement l’ethnonyme hébreu; la variante « Hagarites » peut en expliciter l’association probable avec Agar.
- source_word: וַיִּפְּלוּ בְּיָדָם
  choice: qui tombèrent entre leurs mains
  rationale: Cette formulation conserve l’image de l’idiome hébreu, qui exprime le fait de tomber au pouvoir de quelqu’un. Le relatif clarifie sans ambiguïté artificielle que le sujet implicite est celui des Hagrites.
- source_word: וַיֵּשְׁבוּ בְּאָהֳלֵיהֶם
  choice: Ils habitèrent alors sous leurs tentes
  rationale: ישב désigne ici le fait d’habiter après la victoire, sans nécessairement impliquer un établissement permanent. « Sous leurs tentes » est l’expression française idiomatique et conserve l’image concrète; le possessif renvoie vraisemblablement aux Hagrites.
- source_word: עַל כָּל פְּנֵי מִזְרָח לַגִּלְעָד
  choice: dans toute la région située à l’est de Galaad
  rationale: La tournure hébraïque décrit une étendue géographique complète à l’est de Galaad. Cette traduction en restitue naturellement le sens spatial.
theological_decisions: []
