  text: וְ/אֶחָי/ו֙ לְ/מִשְׁפְּחֹתָ֔י/ו בְּ/הִתְיַחֵ֖שׂ לְ/תֹלְדוֹתָ֑/ם הָ/רֹ֥אשׁ יְעִיאֵ֖ל וּ/זְכַרְיָֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/007.yaml
  text: 'And his brothers by their clans[a], in the genealogy of their generations: the chief was Jeiel, and Zechariah.'
translation:
  language: fr
  text: 'Ses frères, selon leurs clans, lorsqu’ils furent inscrits dans la généalogie de leurs générations[a] : le chef, Yeïel et Zacharie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lors de leur inscription généalogique selon leurs générations ».'
    reason: L’expression hébraïque condensée peut être comprise soit comme une circonstance d’inscription, soit comme la mention du registre généalogique où sont consignées les générations.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: Ses frères
  rationale: Le sens premier de אָח est « frère ». Dans cette généalogie, le terme peut aussi désigner plus largement des parents masculins, mais « frères » conserve le rendu le plus direct.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici les subdivisions familiales d’une tribu, d’où « clans ». Bien que le suffixe hébreu soit au masculin singulier (« ses clans »), le français emploie naturellement le pluriel en référence collective aux frères.
- source_word: בְּהִתְיַחֵשׂ
  choice: lors de leur inscription généalogique
  rationale: Le hitpael de יחס, fréquent dans les Chroniques, évoque l’enregistrement ou le recensement fondé sur l’ascendance. Cette formulation exprime clairement l’idée sans réduire le terme à une simple liste.
- source_word: לְתֹלְדוֹתָם
  choice: par générations
  rationale: תּוֹלְדוֹת renvoie ici aux générations ou lignées consignées dans les archives généalogiques. « Par générations » garde la structure distributive du texte.
- source_word: הָרֹאשׁ
  choice: le chef
  rationale: רֹאשׁ désigne la personne placée à la tête du groupe. « Le chef » est idiomatique et signale clairement le rang de Yeïel.
- source_word: יְעִיאֵל
  choice: Yeïel
  rationale: Translittération française usuelle et lisible du nom hébreu.
- source_word: וּזְכַרְיָהוּ
  choice: et Zacharie
  rationale: La forme française biblique traditionnelle « Zacharie » est claire et largement reconnue, tout en correspondant au nom hébreu זְכַרְיָהוּ.
theological_decisions:
- issue: Relation syntaxique entre Yeïel, « le chef », et Zacharie
  choice: « étaient Yeïel, le chef, et Zacharie »
  alternative: « le chef était Yeïel, et Zacharie »
  rationale: L’hébreu présente une construction nominale très condensée. Le français ajoute seulement la copule nécessaire et rattache explicitement « le chef » à Yeïel, sans attribuer à Zacharie un rang que le texte ne précise pas.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le caractère compact d’une liste généalogique tout en ajoutant la copule exigée par l’usage français. Le terme « clans » évite le sens trop domestique de « familles ».
