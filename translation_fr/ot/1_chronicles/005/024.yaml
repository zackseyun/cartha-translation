source:
  edition: WLC
  text: וְ/אֵ֖לֶּה רָאשֵׁ֣י בֵית אֲבוֹתָ֑/ם וְ/עֵ֡פֶר וְ/יִשְׁעִ֡י וֶ/אֱלִיאֵ֡ל וְ֠/עַזְרִיאֵל וְ/יִרְמְיָ֨ה וְ/הוֹדַוְיָ֜ה וְ/יַחְדִּיאֵ֗ל אֲנָשִׁים֙ גִּבּ֣וֹרֵי חַ֔יִל אַנְשֵׁ֣י שֵׁמ֔וֹת רָאשִׁ֖ים לְ/בֵ֥ית אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/024.yaml
  text: 'These were the heads of their fathers’ houses: Epher[a], Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel, mighty men of valor, men of renown[b], heads of their fathers’ houses.'
translation:
  language: fr
  text: 'Voici les chefs de leurs maisons ancestrales[a] : Épher, Yishéï, Éliel, Azriel, Jérémie, Hodavia et Yahdiel. C’étaient de vaillants guerriers, des hommes renommés[b], chefs de leurs maisons ancestrales.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne des unités familiales ou claniques issues d’un ancêtre commun.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « des hommes de noms », c’est-à-dire des hommes connus ou distingués.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Introduit naturellement une liste en français tout en rendant la valeur présentative de l’hébreu; le waw initial est absorbé dans la formulation.
- source_word: רָאשֵׁי בֵית אֲבוֹתָם
  choice: les chefs de leurs maisons ancestrales
  rationale: Préserve l’idée des unités familiales ou claniques rattachées à un ancêtre commun, sans les réduire à de simples foyers domestiques.
- source_word: עֵפֶר
  choice: Épher
  rationale: Translittération française proche des consonnes hébraïques.
- source_word: יִשְׁעִי
  choice: Yishéï
  rationale: Translittération française visant à représenter la forme hébraïque du nom sans l’assimiler à un autre nom biblique.
- source_word: אֱלִיאֵל
  choice: Éliel
  rationale: Forme française claire et proche de l’hébreu.
- source_word: עַזְרִיאֵל
  choice: Azriel
  rationale: Forme française usuelle et directement reconnaissable.
- source_word: יִרְמְיָה
  choice: Jérémie
  rationale: Forme française traditionnelle du nom hébreu.
- source_word: הוֹדַוְיָה
  choice: Hodavia
  rationale: Translittération française conservatrice de la forme présente dans ce verset.
- source_word: יַחְדִּיאֵל
  choice: Yahdiel
  rationale: Le y initial et la consonne gutturale sont rendus dans une forme lisible en français moderne.
- source_word: אֲנָשִׁים גִּבּוֹרֵי חַיִל
  choice: de vaillants guerriers
  rationale: Rend l’expression consacrée qui évoque à la fois la bravoure, la force et l’aptitude militaire, dans un français naturel.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: des hommes renommés
  rationale: Exprime idiomatiquement le sens de l’hébreu littéral « hommes de noms », c’est-à-dire des hommes connus et distingués.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: chefs de leurs maisons ancestrales
  rationale: Maintient la reprise finale intentionnelle de leur fonction dans l’organisation clanique.
