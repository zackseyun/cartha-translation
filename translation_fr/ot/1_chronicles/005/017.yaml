  text: כֻּלָּ/ם֙ הִתְיַחְשׂ֔וּ בִּ/ימֵ֖י יוֹתָ֣ם מֶֽלֶךְ יְהוּדָ֑ה וּ/בִ/ימֵ֖י יָרָבְעָ֥ם מֶֽלֶךְ יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/017.yaml
  text: All of them were enrolled by genealogy in the days of Jotham king of Judah[a], and in the days of Jeroboam king of Israel.
translation:
  language: fr
  text: Ils furent tous inscrits dans les registres généalogiques[a] à l’époque de Jotam, roi de Juda, et à l’époque de Jéroboam, roi d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « recensés selon leurs généalogies » ou « enregistrés dans les listes généalogiques ». Le verbe hébreu désigne le fait d’être inscrit ou compté dans un document généalogique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Ils furent tous
  rationale: Cette tournure rend la totalité exprimée par le nom avec suffixe de troisième personne du pluriel, dans un français naturel.
- source_word: הִתְיַחְשׂוּ
  choice: furent inscrits dans les registres généalogiques
  rationale: Le hitpael de יחשׂ, fréquent dans les Chroniques, désigne ici l’inscription ou le recensement de personnes selon leur généalogie. Cette formulation exprime clairement la réalité administrative et généalogique.
- source_word: בִּימֵי
  choice: à l’époque de
  rationale: Littéralement « aux jours de » ; « à l’époque de » est une expression actuelle et digne qui conserve le sens temporel sans suggérer nécessairement que l’inscription a duré pendant tout le règne.
- source_word: יוֹתָם
  choice: Jotam
  rationale: Forme française biblique usuelle du nom propre.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Traduction directe de la construction hébraïque.
- source_word: וּבִימֵי
  choice: et à l’époque de
  rationale: La répétition de la formule temporelle hébraïque est conservée afin de respecter le parallélisme et de distinguer les deux repères chronologiques.
- source_word: יָרָבְעָם
  choice: Jéroboam
  rationale: Forme française biblique usuelle du nom propre.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Traduction directe de la construction hébraïque, avec élision naturelle en français.
