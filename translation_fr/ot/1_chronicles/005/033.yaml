  text: Merayoth engendra Amaria, et Amaria engendra Ahitoub.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרָיוֹת
  choice: Merayoth
  rationale: Nom propre translittéré selon une forme française qui rend le yod consonantique et reste proche de l’hébreu.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans cette généalogie, le hiphil de ילד exprime la paternité ou la descendance. « Engendra » est concis, digne et traditionnellement intelligible dans un contexte généalogique.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur hébreu du complément d’objet direct, sans équivalent lexical autonome en français.
- source_word: אֲמַרְיָה
  choice: Amaria
  rationale: Nom propre translittéré sous sa forme française biblique courante.
- source_word: וַ/אֲמַרְיָה
  choice: et Amaria
  rationale: Le waw coordonne les deux propositions généalogiques; il est naturellement rendu par « et ».
- source_word: הוֹלִיד
  choice: engendra
  rationale: La répétition du même verbe hébreu est conservée pour assurer la clarté et la cohérence de la formule généalogique.
- source_word: אֲחִיטוּב
  choice: Ahitoub
  rationale: Nom propre translittéré selon la forme française biblique courante, où le shourouq est rendu par « ou ».
