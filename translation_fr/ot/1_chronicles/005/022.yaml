  naturalness: La répétition de « car » est acceptable et reflète la structure causale. En revanche, « beaucoup d’hommes tués tombèrent » n’est pas naturel en français moderne. « Beaucoup tombèrent, tués » conserve l’image de la chute au combat tout en étant clair et fluide.
  terminology: « La bataille venait de Dieu » rend de manière prudente la provenance exprimée par מִן, sans imposer une interprétation théologique plus développée. « S’établirent à leur place » convient au contexte d’occupation durable et de remplacement des habitants précédents. La note conserve une alternative légitime.
