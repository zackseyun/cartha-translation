- from: Car beaucoup d’hommes tués tombèrent, car la bataille venait de Dieu[a]. Ils s’installèrent à leur place jusqu’à l’exil.
  to: Car beaucoup tombèrent, tués, car la bataille venait de Dieu[a]. Ils s’établirent à leur place jusqu’à l’exil.
  rationale: La révision remplace une construction française calquée et peu idiomatique par « beaucoup tombèrent, tués », qui maintient le double élément hébreu — des personnes tuées et leur chute au combat — sans ajouter « hommes ». « S’établirent » exprime plus directement l’installation durable dans le territoire occupé. Le reste du texte et la note sont conservés, car ils rendent fidèlement la causalité et la formulation volontairement sobre de l’intervention divine.
