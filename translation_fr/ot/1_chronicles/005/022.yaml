  text: כִּֽי חֲלָלִ֤ים רַבִּים֙ נָפָ֔לוּ כִּ֥י מֵ/הָ/אֱלֹהִ֖ים הַ/מִּלְחָמָ֑ה וַ/יֵּשְׁב֥וּ תַחְתֵּי/הֶ֖ם עַד הַ/גֹּלָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/022.yaml
  text: For many slain fell[a], because the battle was from God; and they lived in their place until the exile.
translation:
  language: fr
  text: Car beaucoup tombèrent, tués, car la bataille venait de Dieu[a]. Ils s’établirent à leur place jusqu’à l’exil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car la bataille appartenait à Dieu ». L’expression hébraïque souligne que l’issue de la bataille venait de Dieu.'
    reason: Alternative lexicale et clarification de la formulation hébraïque.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La première occurrence introduit l’explication de la victoire rapportée auparavant; « Car » conserve naturellement cette valeur causale.
- source_word: חֲלָלִים רַבִּים
  choice: beaucoup d’hommes tués
  rationale: Le nom désigne des personnes transpercées ou tuées au combat. Cette formulation garde le sens militaire sans employer le terme plus général « victimes ».
- source_word: נָפָלוּ
  choice: tombèrent
  rationale: Dans un contexte militaire, נפל désigne couramment ceux qui tombent au combat; « tués » explicite déjà l’issue mortelle.
- source_word: כִּי
  choice: car
  rationale: La seconde occurrence donne la raison des nombreuses morts et conserve le lien causal du texte hébreu.
- source_word: מֵהָאֱלֹהִים
  choice: venait de Dieu
  rationale: La préposition מִן exprime ici la provenance ou la source. « Venait de Dieu » préserve cette formulation inhabituelle sans la réduire à une simple appartenance ni préciser davantage le mode d’action divine.
- source_word: הַמִּלְחָמָה
  choice: la bataille
  rationale: Le mot désigne ici l’affrontement militaire qui vient d’être raconté; « bataille » convient mieux au contexte immédiat que « guerre ».
- source_word: וַיֵּשְׁבוּ
  choice: ils s’installèrent
  rationale: ישב peut signifier habiter ou s’établir. Puisqu’il s’agit d’occuper le territoire des vaincus, « s’installèrent » rend clairement la nuance de prise de possession.
- source_word: תַחְתֵּיהֶם
  choice: à leur place
  rationale: L’expression indique que les vainqueurs remplacèrent les habitants défaits, et non qu’ils se trouvaient spatialement sous eux.
- source_word: עַד הַגֹּלָה
  choice: jusqu’à l’exil
  rationale: גּוֹלָה évoque l’exil ou la déportation des tribus; « l’exil » est ici une désignation concise et historiquement reconnaissable.
theological_decisions:
- issue: Intervention divine dans la bataille
  choice: car la bataille venait de Dieu
  alternative: car la bataille appartenait à Dieu
  rationale: L’hébreu présente Dieu comme la source de la bataille ou de son issue. La formulation retenue maintient cette affirmation et son ambiguïté sans développer une théologie de la guerre absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « beaucoup d’hommes tués tombèrent » demeure légèrement marqué afin de conserver la construction nominale et l’image militaire de l’hébreu; « s’installèrent » rend idiomatiquement l’occupation durable du territoire.
