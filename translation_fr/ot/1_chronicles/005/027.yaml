lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן désigne ici, dans cette généalogie, les trois fils immédiats de Lévi. « Les fils de » est la formulation française la plus directe et transparente, tout en laissant possible un emploi généalogique plus large ailleurs.
- source_word: לֵוִי
  choice: Lévi
  rationale: Nom propre rendu selon sa forme française traditionnelle et courante.
- source_word: גֵּרְשׁוֹן
  choice: Guershon
  rationale: Translittération française usuelle de ce nom, distinct de Guershom.
- source_word: קְהָת
  choice: Qehath
  rationale: Translittération française courante qui représente le nom hébreu קְהָת.
- source_word: מְרָרִי
  choice: Merari
  rationale: Forme française traditionnelle du nom hébreu מְרָרִי.
- source_word: וּ
  choice: et
  rationale: Conjonction simple reliant le dernier nom de l’énumération.
