base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/009.yaml
  text: To the east he settled as far as the entrance to the wilderness from the river Euphrates[a], because their livestock had multiplied in the land of Gilead.
translation:
  language: fr
  text: Vers l’est, il s’établit jusqu’à l’entrée du désert, depuis le fleuve Euphrate[a], car leur bétail s’était multiplié dans le pays de Galaad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à l’entrée du désert depuis le fleuve Euphrate ». La description de la limite est très resserrée en hébreu et le rattachement de « depuis le fleuve Euphrate » peut se comprendre de plusieurs façons.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלַמִּזְרָח
  choice: Vers l’est
  rationale: La locution indique une orientation spatiale. « Vers l’est » est naturel en français moderne; la conjonction initiale n’a pas besoin d’être exprimée au début de cette phrase.
- source_word: יָשַׁב
  choice: il s’établit
  rationale: Le singulier renvoie collectivement au groupe présenté par son représentant ancestral ou tribal. « S’établit » convient au contexte d’occupation territoriale.
- source_word: עַד לְבוֹא מִדְבָּרָה
  choice: jusqu’à l’entrée du désert
  rationale: L’expression marque l’étendue jusqu’à l’entrée ou aux abords du désert. La formulation conserve l’image spatiale concrète de l’hébreu.
- source_word: לְמִן הַנָּהָר פְּרָת
  choice: qui s’étend depuis le fleuve Euphrate
  rationale: La construction hébraïque est très resserrée et son rattachement syntaxique demeure incertain. La proposition relative rend intelligible en français le rapport entre le désert et l’Euphrate sans dissimuler l’ambiguïté, signalée en note.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’expansion vers l’est. « Car » établit clairement ce lien causal dans un registre narratif digne.
- source_word: מִקְנֵיהֶם
  choice: leur bétail
  rationale: Le terme désigne collectivement les animaux possédés, et pas seulement les bovins. « Bétail » est précis et courant.
- source_word: רָבוּ
  choice: s’était multiplié
  rationale: Le verbe exprime un accroissement numérique antérieur qui explique l’expansion territoriale.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: dans le pays de Galaad
  rationale: אֶרֶץ désigne ici un territoire. « Le pays de Galaad » conserve cette valeur géographique dans une formulation française naturelle.
