source:
  edition: WLC
  text: וַ/יִּֽמְעֲל֔וּ בֵּ/אלֹהֵ֖י אֲבוֹתֵי/הֶ֑ם וַ/יִּזְנ֗וּ אַחֲרֵי֙ אֱלֹהֵ֣י עַמֵּי הָ/אָ֔רֶץ אֲשֶׁר הִשְׁמִ֥יד אֱלֹהִ֖ים מִ/פְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/025.yaml
  text: But they acted unfaithfully against the God of their fathers and prostituted themselves after the gods of the peoples of the land[b][a], whom God had destroyed before them.
translation:
  language: fr
  text: Mais ils furent infidèles au Dieu de leurs ancêtres et se prostituèrent en suivant les dieux des peuples du pays[a], que Dieu avait exterminés devant eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le relatif hébreu peut aussi être rattaché aux « dieux » : « les dieux… que Dieu avait exterminés devant eux ». Le contexte favorise toutefois les peuples comme antécédent.'
    reason: ambiguïté syntaxique
lexical_decisions:
- source_word: וַיִּמְעֲלוּ
  choice: ils furent infidèles
  rationale: Le verbe מעל exprime ici une rupture de fidélité envers Dieu dans un contexte d’alliance. « Furent infidèles » est naturel et conserve cette dimension relationnelle.
- source_word: בֵּאלֹהֵי אֲבוֹתֵיהֶם
  choice: au Dieu de leurs ancêtres
  rationale: Avec מעל, la préposition ב désigne la personne envers laquelle l’infidélité est commise. « Ancêtres » rend אבות de façon inclusive et courante en français moderne.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: se prostituèrent en suivant
  rationale: « Se prostituèrent » préserve la métaphore sexuelle forte de זנה, tandis que « en suivant » rend la poursuite exprimée par אחרי sans produire une tournure française maladroite.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: les dieux des peuples du pays
  rationale: Cette formulation reproduit directement la chaîne construite hébraïque et garde la référence locale de הארץ.
- source_word: אֲשֶׁר הִשְׁמִיד אֱלֹהִים מִפְּנֵיהֶם
  choice: que Dieu avait exterminés devant eux
  rationale: Le pronom relatif renvoie naturellement aux « peuples », plutôt qu’aux dieux. Le singulier du verbe hébreu identifie אֱלֹהִים comme Dieu. Le plus-que-parfait marque l’antériorité de cette destruction.
theological_decisions:
- issue: Maintien de la métaphore sexuelle appliquée à l’idolâtrie
  choice: se prostituèrent en suivant les dieux
  alternative: furent infidèles en suivant les dieux
  rationale: Le texte emploie délibérément une image sexuelle pour décrire l’infidélité religieuse. La conserver maintient la force théologique du reproche sans la réduire à une simple désobéissance.
- issue: Antécédent du relatif אֲשֶׁר
  choice: les peuples que Dieu avait exterminés
  alternative: les dieux que Dieu avait exterminés
  rationale: En hébreu, le relatif est formellement ambigu, mais le contexte historique et l’expression השמיד ... מפניהם favorisent les peuples comme antécédent. La note signale l’autre rattachement grammatical possible.
- issue: Sens singulier de אֱלֹהִים dans la proposition relative
  choice: Dieu
  alternative: des dieux
  rationale: Le verbe singulier הִשְׁמִיד impose ici un sujet singulier et renvoie au Dieu d’Israël.
translation_notes:
  register: Français international moderne, digne et accessible. « Ancêtres » est préféré à « pères » pour exprimer naturellement la lignée antérieure. La métaphore explicite « se prostituèrent » est maintenue en raison de son importance dans le texte source.
