  text: וּ/בֶ֨לַע֙ בֶּן עָזָ֔ז בֶּן שֶׁ֖מַע בֶּן יוֹאֵ֑ל ה֚וּא יוֹשֵׁ֣ב בַּ/עֲרֹעֵ֔ר וְ/עַד נְב֖וֹ וּ/בַ֥עַל מְעֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/008.yaml
  text: and Bela son of Azaz[a], son of Shema, son of Joel; he lived in Aroer, as far as Nebo and Baal-meon.
translation:
  language: fr
  text: Et Béla, fils d’Azaz, fils de Shéma, fils de Joël, habitait[a] à Aroër, jusqu’à Nébo et Baal-Méon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « résidait » ; le participe hébreu désigne le fait de demeurer en un lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶלַע
  choice: et Béla
  rationale: La conjonction ו maintient la continuité de la liste généalogique; le nom propre est translittéré selon l’usage français.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette généalogie, la formule conserve simplement et formellement la relation de filiation exprimée par l’hébreu.
- source_word: עָזָז
  choice: Azaz
  rationale: Translittération du nom propre, sans le traduire.
- source_word: שֶׁמַע
  choice: Shéma
  rationale: Translittération française du nom propre hébreu.
- source_word: יוֹאֵל
  choice: Joël
  rationale: Forme française établie de ce nom propre.
- source_word: הוּא יוֹשֵׁב
  choice: Il habitait
  rationale: Le pronom indépendant reprend Béla après la chaîne généalogique, et le participe de ישׁב indique qu’il résidait dans ce lieu. L’imparfait convient à cette situation durable dans un récit au passé.
- source_word: בַּעֲרֹעֵר
  choice: à Aroër
  rationale: La préposition ב indique ici le lieu de résidence; « à » est naturel en français devant un nom de ville.
- source_word: וְעַד
  choice: jusqu’à
  rationale: Cette expression indique l’étendue géographique du territoire associé à la résidence de Béla.
- source_word: נְבוֹ
  choice: Nébo
  rationale: Forme française traditionnelle du nom de lieu.
- source_word: וּבַעַל מְעוֹן
  choice: et Baal-Méon
  rationale: Le ו coordonne les deux limites géographiques; le nom composé est translittéré avec un trait d’union.
