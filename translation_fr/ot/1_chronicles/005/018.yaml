revisions:
- from: 'Les fils de Ruben, les Gadites et la demi-tribu de Manassé comptaient 44 760 hommes vaillants : ils portaient le bouclier et l’épée, savaient manier l’arc[a], étaient entraînés au combat et aptes au service militaire[b].'
  to: 'Les fils de Ruben, les Gadites et la demi-tribu de Manassé étaient des hommes vaillants, portant bouclier et épée, bandant l’arc[a] et exercés à la guerre : ils étaient 44 760, aptes à partir en campagne[b].'
  rationale: La révision rétablit plus explicitement les images et les participes militaires de l’hébreu, notamment l’action de bander l’arc, et remplace « au combat » par « à la guerre ». Elle conserve le sens fonctionnel prudent de יֹצְאֵי צָבָא tout en clarifiant sa note. Aucun enjeu doctrinal ni ambiguïté textuelle disputée ne requiert de traitement supplémentaire.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:39:13Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens militaire et le dénombrement sont bien rendus. Toutefois, « savaient manier l’arc » exprime une compétence générale plutôt que l’action imagée de bander/tendre l’arc, et « au combat » est un peu plus étroit que « à la guerre ». La note b présente en outre une formulation littérale française maladroite.
  naturalness: La phrase révisée reste fluide en français international moderne tout en conservant la succession descriptive de l’hébreu. « Partir en campagne » rend naturellement l’idiome militaire final.
  terminology: Les désignations tribales, « hommes vaillants », le vocabulaire des armes et « exercés à la guerre » sont appropriés. « Aptes à partir en campagne » conserve le sens d’hommes disponibles ou qualifiés pour une expédition militaire sans surinterpréter l’expression.
  issues:
  - severity: low
    issue: « savaient manier l’arc » généralise l’expression וְדֹרְכֵי קֶשֶׁת.
    rationale: L’hébreu évoque spécifiquement le fait de bander/tendre l’arc. Une formulation participiale permet de préserver cette image sans nuire à la lisibilité.
  - severity: low
    issue: La note b dit « qui sortaient pour l’armée ».
    rationale: Cette traduction dite littérale est peu naturelle et risque de faire entendre un déplacement « pour l’armée » plutôt que l’idiome de départ en campagne. La note doit expliquer l’idiome plus clairement.
  - severity: low
    issue: « entraînés au combat » restreint légèrement « entraînés à la guerre ».
    rationale: מִלְחָמָה désigne la guerre/activité guerrière dans son ensemble; « à la guerre » est plus directement correspondant.
