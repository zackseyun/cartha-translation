source:
  edition: WLC
  text: בְּנֵֽי רְאוּבֵ֨ן וְ/גָדִ֜י וַ/חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁה֮ מִן בְּנֵי חַיִל֒ אֲ֠נָשִׁים נֹשְׂאֵ֨י מָגֵ֤ן וְ/חֶ֨רֶב֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת וּ/לְמוּדֵ֖י מִלְחָמָ֑ה אַרְבָּעִ֨ים וְ/אַרְבָּעָ֥ה אֶ֛לֶף וּ/שְׁבַע מֵא֥וֹת וְ/שִׁשִּׁ֖ים יֹצְאֵ֥י צָבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/018.yaml
  text: The sons of Reuben and the Gadites and the half-tribe of Manasseh[a], valiant men, men who carried shield and sword, who drew the bow, and who were trained for war, were forty-four thousand seven hundred sixty[c][b], able to go out to war.
translation:
  language: fr
  text: 'Les fils de Ruben, les Gadites et la demi-tribu de Manassé étaient des hommes vaillants, portant bouclier et épée, bandant l’arc[a] et exercés à la guerre : ils étaient 44 760, aptes à partir en campagne[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « qui bandent l’arc », expression hébraïque désignant l’action de tendre l’arc pour tirer.
    reason: cultural_note
  - marker: b
    text: Littéralement « ceux qui sortent pour l’armée » ; expression désignant des hommes aptes à partir en campagne.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רְאוּבֵן
  choice: Les fils de Ruben
  rationale: La formulation de parenté explicite de l’hébreu est conservée; dans ce contexte généalogique et tribal, elle désigne les descendants de Ruben.
- source_word: וְגָדִי
  choice: les Gadites
  rationale: La forme gentilique désigne les membres de la tribu de Gad; « Gadites » est l’équivalent français précis et usuel.
- source_word: וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: la demi-tribu de Manassé
  rationale: Cette expression française courante conserve clairement la désignation tribale.
- source_word: מִן בְּנֵי חַיִל
  choice: hommes vaillants
  rationale: Dans ce contexte militaire, l’expression désigne des hommes capables et valeureux. La préposition מִן est comprise comme introduisant la catégorie dénombrée.
- source_word: נֹשְׂאֵי מָגֵן וְחֶרֶב
  choice: ils portaient le bouclier et l’épée
  rationale: Rend concrètement le participe « portant » tout en produisant une phrase française naturelle.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: savaient manier l’arc
  rationale: L’expression hébraïque évoque littéralement l’action de tendre ou bander l’arc. « Manier l’arc » exprime naturellement en français l’aptitude militaire décrite sans les réduire au seul titre d’archers.
- source_word: וּלְמוּדֵי מִלְחָמָה
  choice: étaient entraînés au combat
  rationale: Le sens passif et résultatif de לְמוּדֵי est rendu par « entraînés »; « au combat » convient au contexte militaire.
- source_word: אַרְבָּעִים וְאַרְבָּעָה אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 44 760
  rationale: Les chiffres et l’espacement typographique français facilitent la lecture du dénombrement exact.
- source_word: יֹצְאֵי צָבָא
  choice: aptes au service militaire
  rationale: Cette expression rend le sens fonctionnel de l’idiome militaire, qui désigne des hommes capables ou disponibles pour partir en campagne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase est restructurée autour de « comptaient » pour intégrer naturellement le nombre tout en maintenant la série des qualifications militaires. Les images concrètes du bouclier, de l’épée et de l’arc sont préservées.
