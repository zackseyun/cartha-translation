revisions:
- from: Fils de Ruben, premier-né d’Israël — car il était bien le premier-né, mais, parce qu’il avait profané la couche de son père[a], son droit d’aînesse fut donné aux fils de Joseph, fils d’Israël, sans toutefois qu’il y ait inscription généalogique au titre du droit d’aînesse[b] —
  to: Les fils de Ruben, premier-né d’Israël — car il était le premier-né, mais parce qu’il avait profané la couche de son père[a], son droit d’aînesse fut donné aux fils de Joseph, fils d’Israël, mais sans être inscrit dans la généalogie au titre du droit d’aînesse[b] —
  rationale: La révision améliore l’idiomaticité française et resserre la correspondance avec le vocabulaire généalogique de l’hébreu. Elle ne résout pas le référent implicite de la dernière proposition et maintient donc la distinction textuelle entre primogéniture de naissance, droit d’aînesse et inscription généalogique.
