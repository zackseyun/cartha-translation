review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est fidèlement rendu : Ruben reste le premier-né, tandis que son droit d’aînesse est donné aux fils de Joseph en raison de la profanation de la couche paternelle. La finale exprime correctement le lien avec l’enregistrement généalogique, mais la tournure impersonnelle « sans toutefois qu’il y ait inscription généalogique » affaiblit inutilement l’infinitif hébreu et devient plus abstraite que le texte source.'
  naturalness: Le français est globalement soutenu et lisible. « Les fils de Ruben » est plus naturel que l’ouverture sans article dans une traduction française moderne. L’adverbe « bien » dans « il était bien le premier-né » ajoute une insistance interprétative qui n’est pas nécessaire. Une formulation passive à sujet non explicité conserve mieux la concision et l’ambiguïté du texte hébreu.
  terminology: « Premier-né », « droit d’aînesse », « profané », « couche » et « inscription dans la généalogie » conviennent. « Couche conjugale de son père » rend plus précisément l’idiome explicité par la note, sans rendre le texte principal indûment explicite.
  issues:
  - severity: low
    issue: Article absent à l’ouverture
    rationale: « Fils de Ruben » peut imiter une rubrique généalogique, mais « Les fils de Ruben » est plus idiomatique en français moderne tout en conservant la syntaxe suspendue du passage.
  - severity: low
    issue: Insistance ajoutée par « bien »
    rationale: Le pronom hébreu explicite peut marquer le sujet sans exiger l’ajout de « bien ». Le retirer évite une nuance emphatique non indispensable.
  - severity: medium
    issue: Finale trop impersonnelle et abstraite
    rationale: « Sans toutefois qu’il y ait inscription généalogique » ne rend pas aussi directement l’infinitif de s’inscrire/être enregistré dans une généalogie. « Sans être inscrit dans la généalogie au titre du droit d’aînesse » est plus proche du lexique source tout en ne tranchant pas le référent implicite.
  revised_text: Les fils de Ruben, premier-né d’Israël — car il était le premier-né, mais parce qu’il avait profané la couche de son père[a], son droit d’aînesse fut donné aux fils de Joseph, fils d’Israël, mais sans être inscrit dans la généalogie au titre du droit d’aînesse[b] —
