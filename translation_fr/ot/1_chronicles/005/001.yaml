source:
  edition: WLC
  text: וּ/בְנֵ֨י רְאוּבֵ֥ן בְּכֽוֹר יִשְׂרָאֵל֮ כִּ֣י ה֣וּא הַ/בְּכוֹר֒ וּֽ/בְ/חַלְּל/וֹ֙ יְצוּעֵ֣י אָבִ֔י/ו נִתְּנָה֙ בְּכֹ֣רָת֔/וֹ לִ/בְנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵ֑ל וְ/לֹ֥א לְ/הִתְיַחֵ֖שׂ לַ/בְּכֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/001.yaml
  text: The sons of Reuben[a], the firstborn of Israel—for he was the firstborn, but because he defiled his father’s bed, his birthright was given to the sons of Joseph son of Israel[b], though not to be enrolled by birthright—
translation:
  language: fr
  text: Les fils de Ruben, premier-né d’Israël — car il était le premier-né, mais parce qu’il avait profané la couche de son père[a], son droit d’aînesse fut donné aux fils de Joseph, fils d’Israël, mais sans être inscrit dans la généalogie au titre du droit d’aînesse[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie littéralement le pluriel « les couches de son père », expression qui désigne ici la couche conjugale de son père.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « mais sans être compté dans la généalogie selon le droit d’aînesse ». La proposition indique que le droit d’aînesse fut transféré aux fils de Joseph sans que ce transfert détermine simplement qui serait inscrit comme premier-né dans la généalogie.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי רְאוּבֵן
  choice: Fils de Ruben
  rationale: La formulation nominale conserve l’ouverture généalogique et son caractère syntaxiquement suspendu, qui se poursuit dans le contexte. Le waw n’exige pas ici l’ajout d’un marqueur français tel que « Or ».
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: premier-né d’Israël
  rationale: « Premier-né » exprime ici l’ordre de naissance et le statut familial de Ruben; « Israël » désigne Jacob.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: car il était bien le premier-né
  rationale: כִּי introduit une explication. « Bien » rend naturellement l’insistance portée par le pronom explicite הוּא, sans changer la proposition en contraste absolu.
- source_word: וּבְחַלְּלוֹ יְצוּעֵי אָבִיו
  choice: mais, parce qu’il avait profané la couche de son père
  rationale: L’infinitif avec בְּ a ici une valeur causale. « Profaner » garde la force cultuelle et morale de חלל. Le pluriel hébreu יְצוּעֵי est rendu par le singulier idiomatique français « la couche ».
- source_word: נִתְּנָה בְּכֹרָתוֹ
  choice: son droit d’aînesse fut donné
  rationale: בְּכֹרָה désigne les privilèges attachés au statut de premier-né, non le simple fait chronologique d’être né le premier.
- source_word: לִבְנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  choice: aux fils de Joseph, fils d’Israël
  rationale: La formulation conserve explicitement la relation généalogique de Joseph avec Israël.
- source_word: וְלֹא לְהִתְיַחֵשׂ לַבְּכֹרָה
  choice: sans toutefois qu’il y ait inscription généalogique au titre du droit d’aînesse
  rationale: התיחשׂ appartient au vocabulaire de l’enregistrement généalogique. La tournure impersonnelle évite d’imposer un sujet que l’hébreu ne précise pas nettement, tandis que « au titre du droit d’aînesse » maintient le lien avec לַבְּכֹרָה.
theological_decisions:
- issue: Distinction entre la primogéniture biologique de Ruben et le transfert du droit d’aînesse
  choice: Le texte affirme que Ruben demeure le premier-né selon la naissance, tandis que son droit d’aînesse est transféré aux fils de Joseph, sans assimiler simplement ce transfert à une nouvelle inscription généalogique comme premier-né.
  alternative: Comprendre que la lignée de Joseph remplace Ruben comme premier-né à tous égards.
  rationale: La dernière proposition limite ou qualifie explicitement le transfert. La traduction maintient la tension entre rang généalogique et privilèges du droit d’aînesse au lieu de les confondre.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Couche » convient au contexte biblique et sexuel sans être cru. Les tirets conservent la longue parenthèse explicative et la syntaxe suspendue du verset, qui mène à la suite de la généalogie.
