source:
  edition: WLC
  text: כִּ֤י יְהוּדָה֙ גָּבַ֣ר בְּ/אֶחָ֔י/ו וּ/לְ/נָגִ֖יד מִמֶּ֑/נּוּ וְ/הַ/בְּכֹרָ֖ה לְ/יוֹסֵֽף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/002.yaml
  text: For Judah prevailed over his brothers[a], and from him came the ruler, though the birthright belonged to Joseph.
translation:
  language: fr
  text: En effet, Juda fut plus puissant que ses frères, et de lui vint un chef[a], mais le droit d’aînesse appartenait à Joseph.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un dirigeant » ou « un prince ».
    reason: Alternative lexicale pour נָגִיד, dont le champ sémantique comprend chef, dirigeant et prince.
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: Introduit l’explication de l’affirmation précédente concernant Ruben et son droit d’aînesse; « En effet » marque naturellement ce lien explicatif en français.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: גָּבַר בְּאֶחָיו
  choice: fut le plus puissant parmi ses frères
  rationale: גבר exprime la force ou la supériorité; avec בְּאֶחָיו, la tournure indique la prééminence de Juda au sein de ses frères sans nécessairement évoquer un combat contre eux.
- source_word: וּלְנָגִיד מִמֶּנּוּ
  choice: et de lui est issu un chef
  rationale: נָגִיד désigne un chef, dirigeant ou prince, et מִמֶּנּוּ indique que celui-ci vient de Juda. Cette formulation française restitue clairement l’origine sans préciser davantage l’identité du chef.
- source_word: וְהַבְּכֹרָה לְיוֹסֵף
  choice: mais le droit d’aînesse appartenait à Joseph
  rationale: בְּכֹרָה désigne ici le statut ou privilège du premier-né. « Mais » rend le contraste contextuel entre la prééminence politique de Juda et le droit attribué à Joseph.
theological_decisions:
- issue: Rapport entre la prééminence de Juda et le droit d’aînesse de Joseph
  choice: Distinguer la puissance et la fonction dirigeante issues de Juda du droit d’aînesse appartenant à Joseph.
  alternative: Comprendre plus largement que Juda dominait tandis que Joseph conservait seulement des privilèges successoraux.
  rationale: L’hébreu juxtapose sans les confondre la prééminence de Juda, la venue d’un נָגִיד issu de lui et la בְּכֹרָה de Joseph. La traduction maintient cette tension.
- issue: Identité du נָגִיד
  choice: Ne pas identifier explicitement le chef.
  alternative: Interpréter directement le terme comme une référence à David, à la dynastie davidique ou au Messie.
  rationale: Le contexte peut orienter vers la royauté issue de Juda, mais le verset emploie seulement le nom commun נָגִיד. La traduction ne doit pas rendre explicite une identification laissée implicite par le texte.
translation_notes:
  register: Français moderne, international et digne. « Droit d’aînesse » est l’expression française usuelle pour le statut et les privilèges du premier-né. La formulation conserve le contraste entre Juda et Joseph ainsi que l’indétermination du terme נָגִיד.
