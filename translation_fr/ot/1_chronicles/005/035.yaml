  text: Ahimaaz fathered Azariah, and Azariah fathered Johanan.
translation:
  language: fr
  text: Ahimaats engendra Azaria, et Azaria engendra Yohanân.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ
  choice: Ahimaats
  rationale: Nom propre translittéré selon la forme française biblique usuelle; la conjonction initiale n’est pas rendue séparément, puisque le verset forme en français une phrase autonome.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans cette généalogie, le hifil de ילד exprime la paternité ou l’engendrement. « Engendra » est concis, précis et bien établi dans le registre généalogique biblique français.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur hébreu du complément d’objet direct, sans équivalent lexical autonome en français.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Nom propre translittéré sous sa forme française biblique usuelle.
- source_word: וַ/עֲזַרְיָה
  choice: et Azaria
  rationale: La conjonction préfixée relie naturellement les deux propositions généalogiques et se rend par « et ».
- source_word: יוֹחָנָן
  choice: Yohanân
  rationale: Translittération française permettant de distinguer ce nom hébreu de la forme française traditionnelle « Jean », tout en représentant יוֹחָנָן de façon transparente.
