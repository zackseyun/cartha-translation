  text: וּ/בְנֵ֣י עַמְרָ֔ם אַהֲרֹ֥ן וּ/מֹשֶׁ֖ה וּ/מִרְיָ֑ם וּ/בְנֵ֣י אַהֲרֹ֔ן נָדָב֙ וַ/אֲבִיה֔וּא אֶלְעָזָ֖ר וְ/אִיתָמָֽרס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/029.yaml
  text: 'The sons of Amram: Aaron[a], Moses, and Miriam; and the sons of Aaron: Nadab and Abihu, Eleazar and Ithamar.'
translation:
  language: fr
  text: 'Les fils d’Amram : Aaron[a], Moïse et Miriam. Les fils d’Aaron : Nadab, Abihou, Éléazar et Itamar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « fils de ». Dans cette généalogie, la liste placée sous Amram comprend aussi Miriam, avec Aaron et Moïse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמְרָם
  choice: Les fils d’Amram
  rationale: Le pluriel construit de בֵּן, précédé de la conjonction, introduit une rubrique généalogique. En français, la conjonction initiale peut être omise pour conserver un style de liste naturel.
- source_word: אַהֲרֹן וּמֹשֶׁה וּמִרְיָם
  choice: Aaron, Moïse et Miriam
  rationale: Les noms sont rendus selon leurs formes françaises courantes. Les conjonctions hébraïques répétées sont exprimées naturellement par « et » devant le dernier élément.
- source_word: וּבְנֵי אַהֲרֹן
  choice: Les fils d’Aaron
  rationale: Cette expression ouvre une deuxième sous-liste généalogique. Une nouvelle phrase brève restitue clairement la structure, sans devoir reproduire mécaniquement la conjonction.
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: Nadab, Abihou, Éléazar et Itamar
  rationale: Les noms propres suivent les formes françaises bibliques usuelles; les conjonctions sont organisées selon l’usage naturel du français.
theological_decisions:
- issue: L’emploi de « fils » alors que Miriam figure dans la liste
  choice: Conserver « Les fils d’Amram » dans le texte et expliquer l’usage dans une note
  alternative: Les enfants d’Amram
  rationale: Le texte hébreu emploie explicitement בְּנֵי, « fils de ». Garder cette formulation préserve la forme généalogique et sa tension avec l’inclusion de Miriam, sans la résoudre silencieusement.
translation_notes:
  register: Français moderne, sobre et digne, avec une ponctuation qui fait ressortir les deux sous-listes généalogiques. Les graphies Moïse, Abihou et Éléazar suivent l’usage français courant; Miriam est conservé plutôt que Marie afin d’identifier clairement la sœur d’Aaron et de Moïse.
