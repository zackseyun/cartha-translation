  text: Et Ouzzi engendra Zerahia, et Zerahia engendra Merayoth.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עֻזִּי
  choice: Ouzzi
  rationale: Nom propre transcrit selon l’usage biblique français courant; la conjonction initiale n’est pas rendue, car le verset français se lit ici comme une unité autonome.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Le hiphil de ילד exprime, dans une généalogie, le fait d’avoir pour descendant direct ou généalogique; «engendra» est concis, digne et traditionnellement intelligible en français.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur de l’objet direct, représenté naturellement par l’ordre des mots en français.
- source_word: זְרַחְיָה
  choice: Zerahia
  rationale: Transcription française claire du nom propre hébreu, cohérente avec les conventions bibliques francophones.
- source_word: וּֽ/זְרַֽחְיָה
  choice: et Zerahia
  rationale: La conjonction et la répétition du nom sont conservées afin de reproduire clairement la chaîne généalogique.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Le même verbe généalogique est rendu de façon identique dans les deux propositions.
- source_word: מְרָיֽוֹת
  choice: Merayoth
  rationale: Transcription française usuelle et lisible du nom propre hébreu.
theological_decisions:
- issue: Portée généalogique de הוֹלִיד
  choice: engendra
  alternative: fut le père de / eut pour descendant
  rationale: «Engendra» préserve la formulation généalogique sans préciser si le lien doit nécessairement être compris comme une filiation immédiate; les généalogies bibliques peuvent parfois condenser des générations.
translation_notes:
  register: Français moderne, sobre et digne. La répétition du verbe et du nom maintient le rythme en chaîne de l’hébreu. Les noms sont adaptés aux conventions de transcription françaises plutôt que reproduits selon les formes anglaises.
