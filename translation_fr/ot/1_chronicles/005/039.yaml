  text: And Shallum fathered Hilkiah, and Hilkiah fathered Azariah.
translation:
  language: fr
  text: Et Shalloum engendra Hilqiya, et Hilqiya engendra Azaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ
  choice: '[non rendu]'
  rationale: La conjonction relie cette notice généalogique à la précédente. En français, commencer directement par le nom est plus naturel dans une liste généalogique, sans perdre le lien contextuel.
- source_word: שַׁלּוּם
  choice: Shalloum
  rationale: Translittération française courante de ce nom propre hébreu.
- source_word: הוֹלִיד
  choice: engendra
  rationale: À la forme hiphil et dans un contexte généalogique, le verbe signifie « engendrer, devenir père de ». « Engendra » est concis, précis et demeure intelligible dans ce registre.
- source_word: אֶת
  choice: '[non traduit]'
  rationale: Marqueur hébreu de l’objet direct, sans équivalent lexical autonome en français.
- source_word: חִלְקִיָּה
  choice: Hilqiya
  rationale: Translittération française qui représente clairement les consonnes du nom hébreu et conserve son élément final théophore.
- source_word: וְ
  choice: et
  rationale: La conjonction coordonne l’étape suivante de la généalogie; « et » en restitue simplement la valeur.
- source_word: חִלְקִיָּה
  choice: Hilqiya
  rationale: Le nom répété est rendu de manière identique dans les deux propositions.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Le même verbe est répété avec le même sens généalogique; la traduction demeure donc constante.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Forme française courante et lisible du nom propre hébreu.
