  text: Joël, le chef, Shapham, le second[a], Jaanaï et Shaphath, en Basan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’adjoint » ou « le deuxième en rang ».
    reason: Le nom מִשְׁנֶה peut désigner soit celui qui occupe la deuxième place, soit un adjoint; le contexte ne permet pas de préciser la fonction.
lexical_decisions:
- source_word: יוֹאֵל
  choice: Joël
  rationale: Nom propre rendu selon sa forme française traditionnelle.
- source_word: הָרֹאשׁ
  choice: le chef
  rationale: רֹאשׁ signifie littéralement « tête » et désigne ici la personne de premier rang; « le chef » est naturel dans ce contexte de liste tribale.
- source_word: וְשָׁפָם
  choice: Shapham
  rationale: Nom propre translittéré selon une graphie française usuelle.
- source_word: הַמִּשְׁנֶה
  choice: le second
  rationale: מִשְׁנֶה indique une deuxième position ou un rang secondaire. « Le second » conserve la concision et la structure appositive de l’hébreu sans préciser davantage la fonction.
- source_word: וְיַעְנַי
  choice: Yaenaï
  rationale: Nom propre translittéré sous une forme adaptée à la lecture française.
- source_word: וְשָׁפָט
  choice: Shaphath
  rationale: Nom propre rendu selon sa forme française traditionnelle.
- source_word: בַּבָּשָׁן
  choice: en Basan
  rationale: Le préfixe בַּ signifie ici « dans/en »; en français, le nom géographique Basan s’emploie naturellement sans article dans cette tournure.
