source:
  edition: WLC
  text: וִ/יהוֹצָדָ֣ק הָלַ֔ךְ בְּ/הַגְל֣וֹת יְהוָ֔ה אֶת יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בְּ/יַ֖ד נְבֻכַדְנֶאצַּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/041.yaml
  text: And Jehozadak went away when Yahweh sent Judah and Jerusalem into exile by the hand of Nebuchadnezzar[a].
translation:
  language: fr
  text: Et Yehotsadaq s’en alla lorsque Yahvé emmena Juda et Jérusalem en exil par l’intermédiaire de Nabuchodonosor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Et Yehotsadaq alla lorsque Yahvé exila Juda et Jérusalem par la main de Nabuchodonosor. »'
    reason: Alternative plus formelle conservant le sens ordinaire de הָלַךְ et l’idiome בְּיַד.
lexical_decisions:
- source_word: וִיהוֹצָדָק
  choice: Yehotsadaq
  rationale: Translittération française proche de la forme hébraïque complète du nom; la conjonction initiale est omise en français, car le verset constitue la fin d’une notice généalogique et un « Et » initial serait moins naturel hors contexte immédiat.
- source_word: הָלַךְ
  choice: partit
  rationale: Le verbe signifie couramment « aller »; dans le contexte de la déportation, « partit » exprime naturellement l’éloignement sans préciser s’il fut lui-même emmené de force.
- source_word: בְּהַגְלוֹת
  choice: lorsque … déporta
  rationale: La préposition ב avec l’infinitif construit a ici une valeur temporelle. La formulation française avec un verbe conjugué reste naturelle tout en conservant Yahvé comme sujet de l’exil.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Translittération française courante du nom divin, plutôt que son remplacement par un titre.
- source_word: אֶת־יְהוּדָה וִירוּשָׁלָם
  choice: Juda et Jérusalem
  rationale: Les deux lieux sont les objets directs du verbe. La traduction n’ajoute pas « les habitants de », afin de préserver la métonymie du texte.
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: L’expression idiomatique indique l’agent ou l’instrument. Cette formulation française distingue clairement l’action souveraine de Yahvé de l’intervention historique du roi babylonien.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom du roi babylonien.
theological_decisions:
- issue: Articulation entre l’action divine et l’action humaine dans l’exil
  choice: Yahvé est le sujet de la déportation, accomplie par l’intermédiaire de Nabuchodonosor.
  alternative: Présenter Nabuchodonosor seul comme l’auteur effectif de la déportation.
  rationale: La syntaxe hébraïque fait de YHWH le sujet de l’infinitif et de Nabuchodonosor l’agent instrumental. La traduction maintient les deux niveaux d’action sans en atténuer la tension.
translation_notes:
  register: Français moderne, digne et accessible. « Déporta » convient au contexte historique et évite la tournure plus lourde « envoya en exil ». La note conserve une représentation plus formelle des deux expressions hébraïques principales.
