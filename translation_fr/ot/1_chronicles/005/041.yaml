revisions:
- from: Yehotsadaq partit lorsque Yahvé déporta Juda et Jérusalem par l’intermédiaire de Nabuchodonosor.[a]
  to: Et Yehotsadaq s’en alla lorsque Yahvé emmena Juda et Jérusalem en exil par l’intermédiaire de Nabuchodonosor.[a]
  rationale: La révision rétablit la conjonction initiale et rend plus explicitement la valeur causative et exilique de בְּהַגְלוֹת. Elle maintient l’ambiguïté sobre du texte quant au départ personnel de Yehotsadaq, la double agentivité de Yahvé et de Nabuchodonosor, ainsi que la métonymie « Juda et Jérusalem ».
  reviewer_model: gpt-5.6-terra
