  text: אֲחִי֙ בֶּן עַבְדִּיאֵ֣ל בֶּן גּוּנִ֔י רֹ֖אשׁ לְ/בֵ֥ית אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/015.yaml
  text: Ahi son of Abdiel[a], son of Guni, was head of their fathers’ houses.
translation:
  language: fr
  text: Ahi, fils d’Abdiel, fils de Gouni, était le chef de leur maison ancestrale.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la maison de leurs pères »; expression désignant leur famille ou clan ancestral.'
    reason: L’expression généalogique hébraïque בֵּית אֲבוֹתָם est littéralement au singulier et peut désigner l’unité familiale ou clanique issue des ancêtres.
lexical_decisions:
- source_word: אֲחִי
  choice: Ahi
  rationale: Nom propre transcrit selon une forme française simple et proche de l’hébreu.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette notice généalogique, la formule désigne le plus naturellement une filiation directe, même si le mot hébreu peut parfois signifier « descendant de ».
- source_word: עַבְדִּיאֵל
  choice: Abdiel
  rationale: Transcription française usuelle et transparente du nom propre.
- source_word: גּוּנִי
  choice: Gouni
  rationale: Transcription adaptée aux conventions phonétiques du français moderne.
- source_word: רֹאשׁ
  choice: chef
  rationale: Dans ce contexte social et généalogique, le terme désigne le responsable ou dirigeant; « chef » est plus naturel en français que le calque « tête ».
- source_word: לְבֵית אֲבוֹתָם
  choice: de leurs maisons ancestrales
  rationale: L’expression hébraïque désigne les unités familiales structurées par l’ascendance. Cette formulation conserve l’image de la maison tout en rendant clairement le sens collectif et généalogique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « fils de » reproduit la structure généalogique concise de l’hébreu. « Maisons ancestrales » rend l’organisation clanique sans employer une tournure française archaïque.
