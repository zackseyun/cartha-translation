  text: Abishoua engendra Boukki, et Boukki engendra Ouzzi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲבִישׁוּעַ
  choice: Abishua
  rationale: Nom propre rendu selon la forme française biblique usuelle, sans traduire son étymologie.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans cette généalogie, le hiphil de ילד exprime la paternité ou la descendance. « Engendra » est concis, précis et adapté au registre généalogique biblique.
- source_word: בֻּקִּי
  choice: Boukki
  rationale: Translittération française conventionnelle du nom propre, avec « ou » pour la voyelle /u/.
- source_word: וּבֻקִּי
  choice: et Boukki
  rationale: La conjonction préfixée ו est rendue par « et », ce qui conserve l’enchaînement simple de la généalogie.
- source_word: עֻזִּי
  choice: Ouzzi
  rationale: Translittération adaptée aux conventions graphiques françaises, avec « ou » pour /u/ et « zz » pour la consonne redoublée.
- source_word: אֶת
  choice: '[non traduit]'
  rationale: La particule hébraïque marque le complément d’objet direct défini et n’a pas d’équivalent naturel à exprimer en français.
