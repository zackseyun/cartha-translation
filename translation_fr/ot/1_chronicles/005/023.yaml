source:
  edition: WLC
  text: וּ/בְנֵ֗י חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יָשְׁב֖וּ בָּ/אָ֑רֶץ מִ/בָּשָׁ֞ן עַד בַּ֧עַל חֶרְמ֛וֹן וּ/שְׂנִ֥יר וְ/הַר חֶרְמ֖וֹן הֵ֥מָּה רָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/023.yaml
  text: And the sons of the half-tribe of Manasseh lived in the land from Bashan as far as Baal-hermon[a], Senir, and Mount Hermon[b]; they became numerous.
translation:
  language: fr
  text: Les membres de la demi-tribu de Manassé habitaient dans le pays, depuis le Basan jusqu’à Baal-Hermon, Senir et le mont Hermon[a]. Ils devinrent nombreux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Hermon, Senir et le mont Hermon sont des noms de lieux qui indiquent l’étendue septentrionale du territoire.
    reason: cultural_note
  - marker: b
    text: Ou « Ils augmentèrent en nombre » ou « Ils se multiplièrent ». Le verbe hébreu souligne leur croissance numérique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: Les membres de la demi-tribu de Manassé
  rationale: Dans ce contexte tribal, בְּנֵי désigne les membres du groupe plutôt que leurs seuls fils biologiques. « Les membres » communique ce sens naturellement en français moderne, tandis que « demi-tribu » conserve la désignation de l’unité tribale.
- source_word: יָשְׁבוּ
  choice: habitaient
  rationale: Le verbe ישׁב décrit ici le fait de résider dans une région. « Habitaient » est naturel et n’ajoute pas l’idée d’une installation initiale qu’aurait pu suggérer « s’établirent ».
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ désigne ici le pays ou territoire habité. « Pays » garde la formulation concrète de l’hébreu sans imposer une délimitation administrative.
- source_word: מִבָּשָׁן עַד
  choice: depuis le Basan jusqu’à
  rationale: La paire prépositionnelle מִן…עַד indique l’étendue géographique. L’article dans « le Basan » correspond à l’usage français traditionnel et idiomatique pour cette région.
- source_word: בַּעַל חֶרְמוֹן וּשְׂנִיר וְהַר חֶרְמוֹן
  choice: Baal-Hermon, Senir et le mont Hermon
  rationale: Les noms géographiques sont translittérés selon l’usage français; הַר est rendu par « mont » dans le toponyme « mont Hermon ».
- source_word: הֵמָּה רָבוּ
  choice: Ils devinrent nombreux
  rationale: רבה au qal peut exprimer le fait de devenir nombreux ou de s’accroître. Cette formulation rend clairement la croissance numérique, et le pronom séparé הֵמָּה est reflété par une proposition indépendante avec « ils ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Les membres » évite le littéralisme potentiellement trompeur de « les fils » dans un contexte tribal. La syntaxe géographique de l’hébreu est conservée sans chercher à identifier ou à harmoniser les différents toponymes.
