base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/013.yaml
  text: 'And their brothers[a], according to their fathers’ houses: Michael, Meshullam, Sheba, Jorai, Jachan, Zia[d][c][b], and Eber—seven.'
translation:
  language: fr
  text: Leurs frères[a], selon leurs maisons paternelles[b], étaient Mikaël, Meshoullam, Shéba, Yoraï, Yakan, Zia et Éber — sept en tout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les membres de leur parenté »; dans les généalogies, le mot hébreu traduit par « frères » peut désigner plus largement des membres du même clan.
    reason: lexical_alternative
  - marker: b
    text: Les « maisons paternelles » étaient des groupes familiaux ou claniques organisés selon la lignée du père.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Leurs frères
  rationale: Le sens premier est « leurs frères ». Dans ce contexte généalogique, le terme peut aussi désigner plus largement des parents appartenant au même clan; une note conserve cette possibilité.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: selon leurs maisons paternelles
  rationale: La formule désigne l’organisation par lignées ou maisonnées issues d’un même père. « Maisons paternelles » conserve cette structure sociale ancienne tout en restant compréhensible en français.
- source_word: מִיכָאֵל
  choice: Mikaël
  rationale: Transcription française usuelle du nom hébreu.
- source_word: וּמְשֻׁלָּם
  choice: Meshoullam
  rationale: Transcription française lisible du nom hébreu, avec « ou » pour le son /u/.
- source_word: וְשֶׁבַע
  choice: Shéba
  rationale: Le mot est compris ici comme un nom propre et transcrit selon l’usage français.
- source_word: וְיוֹרַי
  choice: Yoraï
  rationale: Transcription directe du nom propre hébreu adaptée à la lecture française.
- source_word: וְיַעְכָּן
  choice: Yakan
  rationale: Transcription française proche de la forme massorétique du nom.
- source_word: וְזִיעַ
  choice: Zia
  rationale: La forme retenue suit directement la vocalisation du texte massorétique fourni.
- source_word: וָעֵבֶר
  choice: et Éber
  rationale: « Éber » est la transcription française traditionnelle et transparente du nom hébreu עֵבֶר.
- source_word: שִׁבְעָה
  choice: sept en tout
  rationale: Le nombre récapitule les personnes nommées; « en tout » rend naturellement en français sa valeur de total récapitulatif.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase nominale hébraïque est explicitée par « étaient » pour être naturelle en français. Les noms sont transcrits selon des conventions françaises lisibles, et le tiret met en relief le total récapitulatif.
