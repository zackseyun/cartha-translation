- source_word: הוֹלִיד
  choice: engendra
  rationale: Même verbe généalogique ילד que dans la première proposition; la traduction identique préserve le parallélisme et la cohérence.
- source_word: אֲחִיטוּב
  choice: Ahitoub
  rationale: Nom propre translittéré selon sa forme française biblique usuelle.
