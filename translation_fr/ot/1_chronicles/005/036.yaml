  naturalness: La phrase est lisible et de registre biblique moderne. « Yohanan » est une forme française plus usuelle et plus cohérente pour ce nom que « Yohanân », qui relève d’une translittération partielle peu naturelle dans un texte français courant. « Servit comme prêtre » rend le verbe avec davantage de simplicité idiomatique.
  terminology: « Maison » conserve correctement בית, tandis que la note indique sobrement le référent cultuel. « Azaria » et « Salomon » sont appropriés en français. La note doit conserver son ancre après la normalisation du texte.
