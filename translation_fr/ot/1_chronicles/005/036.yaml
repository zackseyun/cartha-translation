  text: וְ/יוֹחָנָ֖ן הוֹלִ֣יד אֶת עֲזַרְיָ֑ה ה֚וּא אֲשֶׁ֣ר כִּהֵ֔ן בַּ/בַּ֕יִת אֲשֶׁר בָּנָ֥ה שְׁלֹמֹ֖ה בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/036.yaml
  text: And Johanan fathered Azariah[a]; he was the one who served as priest in the house that Solomon built in Jerusalem.
translation:
  language: fr
  text: Yohanan engendra Azaria[a] ; c’est lui qui servit comme prêtre dans la maison que Salomon bâtit à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le Temple » ; l’hébreu dit « dans la maison », expression courante pour désigner le Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹחָנָן
  choice: Yohanân
  rationale: Le nom hébreu est translittéré sous une forme française reconnaissable. La conjonction ו n’est pas rendue séparément, car la continuité généalogique suffit ici en français.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans ce contexte généalogique, le hifil de ילד exprime la paternité. « Engendra » est concis, précis et appartient au registre généalogique biblique sans être obscur.
- source_word: אֶת עֲזַרְיָה
  choice: Azaria
  rationale: La marque de l’objet direct אֶת n’est pas traduite ; le nom propre est donné sous sa forme française usuelle.
- source_word: הוּא אֲשֶׁר
  choice: c’est lui qui
  rationale: Cette tournure restitue naturellement en français la mise en relief produite par le pronom הוּא suivi du relatif.
- source_word: כִּהֵן
  choice: exerça la fonction de prêtre
  rationale: Le verbe כהן désigne l’exercice effectif du service sacerdotal, et non simplement la possession d’un titre.
- source_word: בַּ/בַּיִת
  choice: dans la maison
  rationale: Le texte hébreu dit littéralement « dans la maison ». Le contexte désigne le temple, mais le texte principal conserve le terme source et la note explicite son référent.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: que Salomon avait bâtie
  rationale: Le plus-que-parfait exprime naturellement en français que la construction de la maison précédait le service sacerdotal d’Azaria, sans modifier le rapport temporel implicite du texte.
- source_word: בִּ/ירוּשָׁלִָם
  choice: à Jérusalem
  rationale: « À » est la préposition française idiomatique avec un nom de ville et rend ici correctement le ב hébreu.
