translation_notes:
  register: Français international moderne, digne et lisible. La formulation garde la concision d’une généalogie tout en rendant explicitement l’accent de הוּא אֲשֶׁר. Le terme « maison » est conservé dans le texte afin de respecter l’image hébraïque, avec clarification en note.
