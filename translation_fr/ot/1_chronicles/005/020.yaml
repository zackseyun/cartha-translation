revisions:
- from: Ils reçurent de l’aide contre eux, et les Hagrites[a], ainsi que tous ceux qui étaient avec eux, furent livrés entre leurs mains[b], car ils crièrent vers Dieu pendant la bataille. Il accueillit leur supplication[c], parce qu’ils avaient mis leur confiance en lui.
  to: Ils reçurent de l’aide contre eux, et les Hagrites[a], ainsi que tous ceux qui étaient avec eux, furent livrés entre leurs mains[b], car ils crièrent vers Dieu pendant la bataille. Il les exauça[c], parce qu’ils avaient confiance en lui.
  rationale: La révision remplace une explicitation interprétative par « Il les exauça », qui rend directement la réponse favorable de Dieu aux personnes qui ont crié vers lui. Elle allège également l’expression de leur confiance tout en conservant la relation causale du texte.
