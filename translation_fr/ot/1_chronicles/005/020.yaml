  text: וַ/יֵּעָזְר֣וּ עֲלֵי/הֶ֔ם וַ/יִּנָּתְנ֤וּ בְ/יָדָ/ם֙ הַֽ/הַגְרִיאִ֔ים וְ/כֹ֖ל שֶׁ֣/עִמָּ/הֶ֑ם כִּ֠י לֵ/אלֹהִ֤ים זָעֲקוּ֙ בַּ/מִּלְחָמָ֔ה וְ/נַעְתּ֥וֹר לָ/הֶ֖ם כִּי בָ֥טְחוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/020.yaml
  text: They were helped against them[a], and the Hagrites and all who were with them were given into their hand, because they cried out to God in the battle[c][b], and he answered them because they trusted in him.
translation:
  language: fr
  text: Ils reçurent de l’aide contre eux, et les Hagrites[a], ainsi que tous ceux qui étaient avec eux, furent livrés entre leurs mains[b], car ils crièrent vers Dieu pendant la bataille. Il les exauça[c], parce qu’ils avaient confiance en lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Hagarites ».
    reason: alternative_reading
  - marker: b
    text: Littéralement « furent donnés entre leurs mains », expression signifiant qu’ils furent livrés à leur pouvoir et vaincus.
    reason: lexical_alternative
  - marker: c
    text: Ou « Il se laissa fléchir en leur faveur », c’est-à-dire qu’il répondit favorablement à leur prière.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָזְרוּ עֲלֵיהֶם
  choice: Ils reçurent de l’aide contre eux
  rationale: Le niphal de עזר est passif. Cette formulation conserve l’agent immédiat implicite tout en rendant la phrase naturelle en français; la suite indique que l’aide vient de Dieu.
- source_word: וַיִּנָּתְנוּ בְיָדָם
  choice: furent livrés entre leurs mains
  rationale: נתן au passif avec ביד est un idiome militaire exprimant la défaite et la remise au pouvoir des vainqueurs. La traduction conserve l’image hébraïque.
- source_word: הַהַגְרִיאִים
  choice: les Hagrites
  rationale: Translittération française concise du nom de ce peuple; « Hagarites » reste une variante possible.
- source_word: וְכֹל שֶׁעִמָּהֶם
  choice: ainsi que tous ceux qui étaient avec eux
  rationale: La formulation désigne naturellement les alliés ou les forces accompagnant les Hagrites.
- source_word: כִּי לֵאלֹהִים זָעֲקוּ
  choice: car ils crièrent vers Dieu
  rationale: זעק évoque un appel pressant au secours. « Crier vers Dieu » en conserve l’intensité et le destinataire.
- source_word: בַּמִּלְחָמָה
  choice: pendant la bataille
  rationale: L’article renvoie au combat précis du contexte; « pendant la bataille » est idiomatique en français.
- source_word: וְנַעְתּוֹר לָהֶם
  choice: Il accueillit leur supplication
  rationale: Le niphal de עתר indique que Dieu se laisse fléchir ou répond favorablement à une supplication. Cette formulation exprime la réponse favorable sans réduire le verbe au simple fait d’entendre.
- source_word: כִּי בָטְחוּ בוֹ
  choice: parce qu’ils avaient mis leur confiance en lui
  rationale: בטח ב exprime la confiance et l’appui placé en quelqu’un. Le plus-que-parfait marque naturellement l’antériorité de cette confiance par rapport à la réponse divine.
theological_decisions:
- issue: Agent de l’aide au combat
  choice: La tournure « Ils reçurent de l’aide » garde l’agent implicite dans la première proposition.
  alternative: « Dieu les aida contre leurs ennemis »
  rationale: La morphologie hébraïque est passive et ne nomme pas directement l’agent dans cette proposition, même si le contexte attribue clairement l’aide ultime à Dieu.
- issue: Réponse divine à la prière
  choice: « Il accueillit leur supplication »
  alternative: « Il se laissa fléchir en leur faveur »
  rationale: Le texte présente une réponse divine favorable à leur cri. Le choix principal est clair en français moderne, tandis que l’alternative reflète plus formellement la voix passive du verbe hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme excessif. La syntaxe passive et les liens causaux du texte hébreu sont préservés.
