id: 1CH.5.16
reference: 1 Chronicles 5:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּֽשְׁב֛וּ בַּ/גִּלְעָ֥ד בַּ/בָּשָׁ֖ן וּ/בִ/בְנֹתֶ֑י/הָ וּ/בְ/כָֽל מִגְרְשֵׁ֥י שָׁר֖וֹן עַל תּוֹצְאוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/016.yaml
  text: They lived in Gilead[a], in Bashan and its towns, and in all the pasturelands of Sharon[c][b], as far as their borders.
translation:
  language: fr
  text: Ils habitaient en Galaad, dans le Basan et dans les localités qui en dépendaient[a], ainsi que dans tous les pâturages[b] du Saron, jusqu’à leurs confins[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ses filles », expression hébraïque désignant les localités ou villages dépendants.
    reason: lexical_alternative
  - marker: b
    text: Ou « terrains découverts » ou « terrains communaux ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « sur leurs sorties », c’est-à-dire jusqu’à leurs limites extérieures.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Ils habitaient
  rationale: Le verbe ישׁב désigne ici le fait de résider dans un territoire. « Habitaient » est naturel en français moderne et n’insiste pas indûment sur l’installation initiale.
- source_word: בַּגִּלְעָד
  choice: en Galaad
  rationale: « Galaad » est la forme française usuelle de ce nom géographique biblique.
- source_word: בַּבָּשָׁן
  choice: dans le Basan
  rationale: « Basan » est la forme française traditionnelle et encore courante du nom géographique בָּשָׁן.
- source_word: וּבִבְנֹתֶיהָ
  choice: et dans les localités qui en dépendaient
  rationale: 'Littéralement « et dans ses filles » : en hébreu, les « filles » d’une région ou d’une ville sont les localités qui en dépendent. Le suffixe féminin singulier renvoie le plus naturellement au Basan.'
- source_word: מִגְרְשֵׁי
  choice: les pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts entourant les lieux habités, souvent utilisés comme pâturages. Ce choix convient au contexte territorial tout en restant courant.
- source_word: שָׁרוֹן
  choice: Saron
  rationale: « Saron » est la forme française usuelle de ce nom régional biblique.
- source_word: עַל תּוֹצְאוֹתָם
  choice: jusqu’à leurs confins
  rationale: L’expression, littéralement « sur leurs sorties », indique ici l’étendue extérieure ou les limites des territoires mentionnés. « Confins » conserve l’idée d’extrémités territoriales sans préciser davantage le référent du suffixe pluriel.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les formes géographiques françaises usuelles « Galaad », « Basan » et « Saron » sont retenues. La syntaxe explicite l’idiome des « filles » sans alourdir le corps du verset; les sens littéraux et les variantes lexicales sont signalés en notes.
