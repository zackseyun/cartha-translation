source:
  edition: WLC
  text: וַ/יִּשְׁבּ֣וּ מִקְנֵי/הֶ֗ם גְּֽמַלֵּי/הֶ֞ם חֲמִשִּׁ֥ים אֶ֨לֶף֙ וְ/צֹ֗אן מָאתַ֤יִם וַ/חֲמִשִּׁים֙ אֶ֔לֶף וַ/חֲמוֹרִ֖ים אַלְפָּ֑יִם וְ/נֶ֥פֶשׁ אָדָ֖ם מֵ֥אָה אָֽלֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/021.yaml
  text: 'They captured their livestock: 50,000 camels[a], 250,000 sheep, 2,000 donkeys, and 100,000 people.'
translation:
  language: fr
  text: 'Ils capturèrent leur bétail : 50 000 chameaux, 250 000 têtes de petit bétail, 2 000 ânes et 100 000 personnes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une personne humaine » ou « une âme humaine » (נֶפֶשׁ אָדָם), c’est-à-dire 100 000 personnes faites prisonnières.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: Ils capturèrent
  rationale: Le verbe שׁבה désigne ici la prise d’animaux et d’êtres humains. « Capturèrent » convient aux deux catégories et conserve l’idée de prise comme butin ou comme captifs.
- source_word: מִקְנֵיהֶם
  choice: leur bétail
  rationale: מִקְנֶה peut désigner des biens acquis ou du bétail, mais la liste d’animaux qui suit précise ici le sens.
- source_word: גְּמַלֵּיהֶם
  choice: 50 000 chameaux
  rationale: Traduction directe du nom pluriel; le possessif est déjà exprimé par « leur bétail » et n’a pas besoin d’être répété en français.
- source_word: וְצֹאן
  choice: 250 000 têtes de petit bétail
  rationale: צֹאן est un collectif qui peut englober les moutons et les chèvres. « Petit bétail » préserve cette portée sans la réduire aux seuls moutons.
- source_word: וַחֲמוֹרִים
  choice: 2 000 ânes
  rationale: Équivalent français moderne et direct de חֲמוֹרִים.
- source_word: וְנֶפֶשׁ אָדָם
  choice: 100 000 personnes
  rationale: L’expression signifie littéralement « personne humaine » ou « âme humaine » et désigne ici des êtres humains comptés individuellement, pris comme captifs.
- source_word: מֵאָה אָלֶף
  choice: 100 000
  rationale: Présentation numérique claire et cohérente avec les autres quantités du verset.
