  text: אֵ֣לֶּה בְּנֵ֣י אֲבִיחַ֗יִל בֶּן חוּרִ֡י בֶּן יָ֠רוֹחַ בֶּן גִּלְעָ֧ד בֶּן מִיכָאֵ֛ל בֶּן יְשִׁישַׁ֥י בֶּן יַחְדּ֖וֹ בֶּן בּֽוּז׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/014.yaml
  text: These were the sons of Abihail son of Huri[a], son of Jaroah, son of Gilead, son of Michael, son of Jeshishai, son of Jahdo, son of Buz.
translation:
  language: fr
  text: Voici les fils d’Abihayil[a], fils de Houri, fils de Yaroah, fils de Galaad, fils de Mikaël, fils de Yeshishaï, fils de Yahdo, fils de Bouz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, « fils de » et la répétition de cette formule peuvent désigner une lignée généalogique sans que toutes les générations soient nécessairement énumérées.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Le démonstratif pluriel introduit la lignée. « Voici » rend naturellement en français la formule de présentation sans imposer un temps absent de l’hébreu.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le pluriel construit de בן signifie directement « fils de ». Cette formulation conserve la structure généalogique, tout en laissant la note signaler que le terme peut avoir une portée plus large.
- source_word: אֲבִיחַיִל
  choice: Abihaïl
  rationale: Translittération française usuelle du nom propre, avec tréma pour marquer la séparation vocalique.
- source_word: בֶּן
  choice: fils de
  rationale: La formule répétée est conservée afin de reproduire fidèlement la chaîne généalogique hébraïque, sans présumer que chaque génération est nécessairement explicitée.
- source_word: חוּרִי
  choice: Houri
  rationale: Translittération adaptée aux conventions phonographiques françaises.
- source_word: יָרוֹחַ
  choice: Yaroah
  rationale: Translittération française lisible qui conserve approximativement la forme consonantique et vocalique du nom hébreu.
- source_word: גִּלְעָד
  choice: Galaad
  rationale: Forme française traditionnelle et largement reconnue du nom biblique.
- source_word: מִיכָאֵל
  choice: Mikaël
  rationale: Forme française transparente, proche de l’hébreu, avec tréma marquant les voyelles distinctes.
- source_word: יְשִׁישַׁי
  choice: Yeshishaï
  rationale: Translittération française qui représente le yod initial par Y, le שׁ par sh et la finale diphtonguée par aï.
- source_word: יַחְדּוֹ
  choice: Yahdo
  rationale: Translittération lisible en français; le h rend approximativement la consonne ח sans recourir à une graphie savante.
- source_word: בּוּז
  choice: Bouz
  rationale: La graphie « ou » rend naturellement en français la voyelle longue hébraïque.
theological_decisions:
- issue: Portée généalogique de « fils »
  choice: Conserver « fils de » dans le texte et préciser en note que la généalogie peut omettre des générations.
  alternative: Traduire « descendant de » à certains endroits.
  rationale: L’hébreu répète explicitement בן, mais l’usage généalogique peut désigner une filiation plus éloignée. Le texte principal préserve donc la forme, tandis que la note maintient l’ambiguïté culturelle et historique.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « fils de », caractéristique d’une généalogie, est volontairement maintenue. Les noms sont adaptés aux conventions françaises, en privilégiant les formes bibliques françaises reconnues lorsqu’elles existent.
