  text: Michée, son fils, Reaya, son fils, Baal[a], son fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « Baal » est un nom de personne dans la généalogie, et non un titre à traduire par « seigneur ».
    reason: 'Précision lexicale : le mot hébreu peut avoir d’autres emplois, mais il fonctionne ici comme un nom propre.'
lexical_decisions:
- source_word: מִיכָה
  choice: Michée
  rationale: Nom propre translittéré sous sa forme française traditionnelle et immédiatement reconnaissable.
- source_word: בְנֹו
  choice: son fils
  rationale: Le nom בֵּן avec le suffixe masculin singulier signifie littéralement « son fils ». La répétition est conservée, car elle structure la chaîne généalogique.
- source_word: רְאָיָה
  choice: Reaya
  rationale: Nom propre translittéré de façon claire en français, sans chercher à en traduire l’étymologie.
- source_word: בַּעַל
  choice: Baal
  rationale: Dans cette liste généalogique, le terme fonctionne comme un nom de personne. Il est donc translittéré plutôt que traduit par « maître » ou « seigneur ».
theological_decisions:
- issue: Faut-il comprendre בַּעַל comme un titre, une désignation divine ou un nom personnel ?
  choice: 'Le conserver comme nom personnel : « Baal »'
  alternative: Le traduire par « maître » ou « seigneur », ou l’expliciter comme le nom d’une divinité
  rationale: La syntaxe et le genre généalogique placent בַּעַל dans une suite de noms propres. La traduction ne doit pas lui imposer ici une interprétation théologique que le verset n’explicite pas.
translation_notes:
  register: Français moderne, sobre et digne. La répétition de « son fils » reproduit la structure concise de la généalogie hébraïque. Le marqueur de note est placé après « Baal », le terme auquel la note se rapporte.
