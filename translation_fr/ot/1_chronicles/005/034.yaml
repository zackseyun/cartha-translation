  rationale: Conjonction simple reliant les deux propositions généalogiques.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Le verbe généalogique répété est traduit de manière identique afin de préserver le parallélisme du texte.
- source_word: אֲחִימָעַץ
  choice: Ahimaats
  rationale: Nom propre transcrit sous une forme française qui rend la consonne finale hébraïque צ.
