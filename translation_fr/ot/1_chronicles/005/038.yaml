  text: Ahitub fathered Zadok, and Zadok fathered Shallum.
translation:
  language: fr
  text: Ahitoub engendra Tsadok, et Tsadok engendra Shalloum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִיטוּב
  choice: Ahitoub
  rationale: Nom propre transcrit selon la forme française biblique courante; la conjonction initiale n’a pas besoin d’être rendue séparément dans ce verset généalogique autonome.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans une généalogie, le hiphil de ילד signifie « engendrer, devenir le père de ». « Engendra » est précis, concis et adapté au registre biblique français sans être obscur.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur du complément d’objet direct, sans équivalent lexical autonome en français.
- source_word: צָדוֹק
  choice: Tsadok
  rationale: Transcription française transparente du nom propre hébreu, conservant sa consonne initiale.
- source_word: וְ/צָדוֹק
  choice: et Tsadok
  rationale: La conjonction ו est rendue naturellement par « et » pour relier les deux maillons de la généalogie.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Le même verbe généalogique est rendu de façon identique afin de préserver le parallélisme et la cohérence.
- source_word: שַׁלּוּם
  choice: Shalloum
  rationale: Transcription française usuelle et lisible du nom propre hébreu.
