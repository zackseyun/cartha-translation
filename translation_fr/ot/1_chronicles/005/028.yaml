  text: וּ/בְנֵ֖י קְהָ֑ת עַמְרָ֣ם יִצְהָ֔ר וְ/חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/028.yaml
  text: 'And the sons of Kohath: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: fr
  text: 'Et les fils de Qehath : Amram, Yitsehar, Hébron et Ouzziel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Fils de
  rationale: Dans cette généalogie, בְנֵי désigne naturellement les fils de Qehath. Le ו initial marque la continuité de la liste, déjà manifeste dans le contexte français, et n’exige pas ici un « Et » peu naturel en tête de fragment.
- source_word: קְהָת
  choice: Qehath
  rationale: Translittération française usuelle du nom hébreu, avec Q pour rendre la consonne ק et h pour signaler la consonne finale ח.
- source_word: עַמְרָם
  choice: Amram
  rationale: Forme française traditionnelle et transparente de ce nom propre.
- source_word: יִצְהָר
  choice: Yitsehar
  rationale: Translittération qui distingue les consonnes et les voyelles du nom hébreu יִצְהָר, sans le confondre avec une traduction de son éventuelle étymologie.
- source_word: וְ/חֶבְרוֹן
  choice: Hébron
  rationale: Forme française traditionnelle. Le contexte généalogique montre qu’il s’agit ici d’une personne, non de la ville; la coordination est rendue naturellement dans l’énumération française.
- source_word: וְ/עֻזִּיאֵל
  choice: et Ouzziel
  rationale: Forme française traditionnelle du nom propre; le ו préfixé est rendu par « et » devant le dernier élément de la liste.
