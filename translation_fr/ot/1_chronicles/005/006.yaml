  text: בְּאֵרָ֣ה בְנ֔/וֹ אֲשֶׁ֣ר הֶגְלָ֔ה תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשֻּׁ֑ר ה֥וּא נָשִׂ֖יא לָ/רֽאוּבֵנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/006.yaml
  text: Beerah his son[a], whom Tilgath-pilneser king of Assyria carried away into exile—he was a chief of the Reubenites.
translation:
  language: fr
  text: Bééra, son fils, que Tilgath-Pilnéser[a], roi d’Assyrie, emmena en exil — il était un chef des Rubénites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom du roi assyrien se présente ici en hébreu sous la forme « Tilgath-Pilnéser » ; beaucoup de traductions emploient la forme historique plus familière « Tiglath-Piléser ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵרָה
  choice: Beéra
  rationale: Nom propre transcrit sous une forme naturelle en français, en conservant la vocalisation massorétique.
- source_word: בְנוֹ
  choice: son fils
  rationale: Le nom avec suffixe masculin singulier renvoie au personnage précédemment nommé dans la généalogie; « son fils » est l’expression française naturelle.
- source_word: אֲשֶׁר
  choice: que
  rationale: La particule relative introduit une proposition où Beéra est l’objet du verbe; « que » rend directement ce rapport syntaxique.
- source_word: הֶגְלָה
  choice: emmena en exil
  rationale: Le hiphil de גלה exprime ici le fait de contraindre quelqu’un à partir en exil. Cette formulation conserve la valeur causative sans employer un vocabulaire trop technique.
- source_word: תִּלְגַת פִּלְנְאֶסֶר
  choice: Tilgath-Pilnéser
  rationale: Cette transcription suit la forme hébraïque propre à ce verset, plutôt que de l’harmoniser avec la forme historique plus familière « Tiglath-Piléser ».
- source_word: מֶלֶךְ אַשּׁוּר
  choice: roi d’Assyrie
  rationale: Rendu naturel de la chaîne construite, employé en apposition après le nom du souverain.
- source_word: הוּא
  choice: il
  rationale: Le pronom indépendant reprend Beéra avec une valeur résomptive et légèrement emphatique après la proposition relative.
- source_word: נָשִׂיא
  choice: un chef
  rationale: Dans ce contexte tribal et généalogique, le terme désigne un dirigeant reconnu. « Chef » évite les connotations royales que pourrait suggérer « prince ».
- source_word: לָרְאוּבֵנִי
  choice: des Rubénites
  rationale: Le lamed marque ici le groupe auquel se rapporte l’autorité du chef; « des Rubénites » est la tournure française la plus naturelle.
