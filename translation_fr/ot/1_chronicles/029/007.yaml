  text: וַֽ/יִּתְּנ֞וּ לַ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים זָהָ֞ב כִּכָּרִ֣ים חֲמֵֽשֶׁת אֲלָפִים֮ וַ/אֲדַרְכֹנִ֣ים רִבּוֹ֒ וְ/כֶ֗סֶף כִּכָּרִים֙ עֲשֶׂ֣רֶת אֲלָפִ֔ים וּ/נְחֹ֕שֶׁת רִבּ֛וֹ וּ/שְׁמוֹנַ֥ת אֲלָפִ֖ים כִּכָּרִ֑ים וּ/בַרְזֶ֖ל מֵֽאָה אֶ֥לֶף כִּכָּרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/007.yaml
  text: And they gave for the service of the house of God five thousand talents of gold and ten thousand darics[a], and ten thousand talents of silver, and eighteen thousand talents of bronze[c][b], and one hundred thousand talents of iron.
translation:
  language: fr
  text: Ils donnèrent pour le service de la maison de Dieu cinq mille talents[a] d’or, dix mille dariques[b], dix mille talents d’argent, dix-huit mille talents de bronze et cent mille talents de fer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « talent » était une importante unité de poids.
    reason: cultural_note
  - marker: b
    text: Une « darique » était une monnaie d’or perse.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ils donnèrent
  rationale: Le verbe נתן décrit ici une action accomplie. « Donnèrent » reste simple et proche de l’hébreu, sans préciser davantage la forme de la contribution.
- source_word: לַעֲבוֹדַת
  choice: pour le service de
  rationale: עֲבוֹדָה peut désigner le service ou le travail. Cette formulation conserve l’ampleur du terme, sans le limiter à la seule construction.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Traduction formelle et intelligible de l’expression hébraïque; « temple » serait plus interprétatif.
- source_word: כִּכָּרִים
  choice: talents
  rationale: Le talent est ici une ancienne unité de poids. Le terme traditionnel est conservé et expliqué en note.
- source_word: אֲדַרְכֹנִים
  choice: dariques
  rationale: Ce mot d’origine perse désigne une monnaie d’or précise; la translittération française « dariques » préserve cette réalité historique.
- source_word: רִבּוֹ וּשְׁמוֹנַת אֲלָפִים
  choice: dix-huit mille
  rationale: La formulation hébraïque additionne une dizaine de milliers et huit milliers, soit dix-huit mille; le total est exprimé naturellement en français.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Le terme peut désigner le cuivre ou le bronze. Dans le contexte des métaux destinés à la maison de Dieu, « bronze » est le rendu conventionnel et vraisemblable.
