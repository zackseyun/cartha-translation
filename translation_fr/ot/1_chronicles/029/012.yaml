revisions:
- from: La richesse et l’honneur[a] viennent de toi[b], et tu domines sur tout. Dans ta main sont la force et la puissance, et il est dans ta main d’élever[c] et de fortifier tous.
  to: La richesse et l’honneur[a] viennent de toi[b], et tu règnes sur tout. Dans ta main sont la force et la puissance ; dans ta main est le pouvoir d’élever[c] et de fortifier tous.
  rationale: La révision corrige une construction française maladroite en introduisant « le pouvoir », implication immédiate de l’expression hébraïque « dans ta main [est] », et conserve sa répétition emphatique. « Règnes » améliore l’idiomaticité sans modifier la portée du participe hébreu. Les notes existantes restent exactes et leurs ancres demeurent correctement attachées.
