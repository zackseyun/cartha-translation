base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/012.yaml
  text: Both riches and honor come from before you[a], and you rule over all. In your hand are power and might[c][b], and in your hand it is to make great and to strengthen all.
translation:
  language: fr
  text: La richesse et l’honneur[a] viennent de toi[b], et tu règnes sur tout. Dans ta main sont la force et la puissance ; dans ta main est le pouvoir d’élever[c] et de fortifier tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « la gloire ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « viennent de devant toi » ; autre traduction possible : « viennent de ta présence ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « rendre grands » ; le verbe peut aussi signifier « exalter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹשֶׁר
  choice: la richesse
  rationale: Le nom désigne l’abondance matérielle ou les biens. « La richesse » est naturel en français et convient au registre élevé de cette prière.
- source_word: הַכָּבוֹד
  choice: l’honneur
  rationale: Dans ce contexte, le terme évoque le prestige et la dignité accordés par Dieu. « L’honneur » forme un couple naturel avec « la richesse », tout en laissant « la gloire » comme possibilité en note.
- source_word: מִלְּפָנֶיךָ
  choice: viennent de toi
  rationale: L’expression signifie littéralement « de devant toi » ou « de ta présence » et présente Dieu comme la source de la richesse et de l’honneur. La formulation retenue transmet naturellement cet idiome en français, tandis que l’image hébraïque est conservée en note.
- source_word: מוֹשֵׁל בַּכֹּל
  choice: tu domines sur tout
  rationale: Le participe exprime l’exercice continu de la souveraineté. « Dominer sur tout » reste proche du texte et convient à une prière solennelle.
- source_word: בְיָדְךָ
  choice: dans ta main
  rationale: La métaphore concrète exprime la possession, la maîtrise et le pouvoir d’agir. Sa répétition est conservée conformément à l’emphase hébraïque.
- source_word: כֹּחַ וּגְבוּרָה
  choice: la force et la puissance
  rationale: Ce couple rend deux termes proches mais distincts, le premier évoquant la capacité ou la force et le second une puissance énergique ou souveraine.
- source_word: לְגַדֵּל
  choice: d’élever
  rationale: À la forme causative, le verbe signifie rendre grand et, appliqué à une personne, élever ou exalter. « Élever » est ici naturel sans préciser indûment la nature de cette grandeur.
- source_word: לְחַזֵּק
  choice: de fortifier
  rationale: Le verbe signifie rendre fort ou affermir. « Fortifier » conserve cette valeur causative dans un registre digne.
- source_word: לַכֹּל
  choice: tous
  rationale: Le terme est formellement général et peut désigner tous ou tout. Avec les verbes « élever » et « fortifier », le français « tous » privilégie naturellement les personnes sans restreindre davantage leur identité.
theological_decisions:
- issue: Expression de la provenance divine dans מִלְּפָנֶיךָ
  choice: viennent de toi
  alternative: viennent de devant toi / viennent de ta présence
  rationale: Le français idiomatique exprime clairement que Dieu est la source, tandis qu’une note préserve l’image littérale de ce qui procède de devant sa face ou de sa présence.
- issue: Portée de לַכֹּל
  choice: tous
  alternative: tout
  rationale: L’hébreu permet une portée générale. Le contexte des actes d’élever et de fortifier favorise la référence aux personnes, mais la traduction ne précise pas un groupe particulier.
- issue: Valeur de לְגַדֵּל
  choice: élever
  alternative: rendre grand / exalter
  rationale: « Élever » exprime l’action souveraine de Dieu sans y importer une doctrine particulière ; la formulation plus littérale est signalée en note.
translation_notes:
  register: Français international actuel, digne et lisible. Le parallélisme et la répétition de « dans ta main » sont maintenus afin de préserver le rythme de la prière et son insistance sur la souveraineté divine.
