  source_fidelity: 'Le sens fondamental est bien rendu : richesse et honneur ont leur origine auprès de Dieu, il exerce sa domination sur le tout, et force, puissance, élévation et affermissement relèvent de lui. « Tous » conserve de façon acceptable l’ampleur non spécifiée de לַכֹּל, sans imposer un référent plus précis. La note b préserve correctement l’expression hébraïque littérale מִלְּפָנֶיךָ.'
  naturalness: « Il est dans ta main d’élever et de fortifier tous » n’est pas idiomatique en français actuel. Une légère explicitation par « le pouvoir » rend la construction naturelle tout en gardant la métaphore répétée de la main et la force du parallélisme.
  terminology: « La richesse et l’honneur », « la force et la puissance », « élever » et « fortifier » conviennent au registre élevé de la prière. « Tu domines sur tout » est compréhensible, mais « tu règnes sur tout » est plus naturel et exprime mieux la souveraineté continue du participe מוֹשֵׁל.
