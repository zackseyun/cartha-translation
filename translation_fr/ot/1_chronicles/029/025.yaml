  text: וַ/יְגַדֵּ֨ל יְהוָ֤ה אֶת שְׁלֹמֹה֙ לְ/מַ֔עְלָ/ה לְ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּתֵּ֤ן עָלָי/ו֙ ה֣וֹד מַלְכ֔וּת אֲ֠שֶׁר לֹֽא הָיָ֧ה עַל כָּל מֶ֛לֶךְ לְ/פָנָ֖י/ו עַל יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/025.yaml
  text: And Yahweh made Solomon exceedingly great in the sight of all Israel[a], and gave him royal majesty such as had not been on any king before him over Israel.
translation:
  language: fr
  text: Yahweh éleva Salomon à un très haut rang aux yeux de tout Israël et lui accorda une majesté royale[a] qu’aucun roi ayant régné sur Israël avant lui n’avait eue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une splendeur royale » ou « l’éclat de la royauté ».
    reason: Alternative lexicale pour הוֹד מַלְכוּת, qui associe l’idée de majesté ou de splendeur à la royauté.
lexical_decisions:
- source_word: וַיְגַדֵּל ... לְמַעְלָה
  choice: éleva ... à un très haut rang
  rationale: Le hiphil de גדל exprime l’action de rendre grand, tandis que לְמַעְלָה renforce l’idée d’élévation. Cette formulation française restitue naturellement la grandeur exceptionnelle conférée à Salomon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: aux yeux de tout Israël
  rationale: Cette expression conserve l’image hébraïque tout en indiquant clairement que l’élévation de Salomon fut publique et reconnue par Israël.
- source_word: וַיִּתֵּן עָלָיו
  choice: lui accorda
  rationale: Littéralement « donna sur lui », l’expression désigne ici l’octroi d’une qualité ou d’un honneur. « Lui accorda » est naturel en français.
- source_word: הוֹד מַלְכוּת
  choice: majesté royale
  rationale: הוֹד peut désigner la majesté, l’éclat ou la splendeur, et מַלְכוּת en précise le caractère royal.
- source_word: אֲשֶׁר לֹא הָיָה עַל כָּל מֶלֶךְ לְפָנָיו
  choice: comme aucun roi avant lui n’en avait eu
  rationale: La tournure comparative française exprime fidèlement que cette majesté n’avait reposé sur aucun roi antérieur à Salomon.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: Avec le terme « roi », la préposition עַל marque l’autorité exercée sur le peuple.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel au lieu de le remplacer par un titre.
- issue: Portée de la grandeur conférée à Salomon
  choice: une élévation publique et une majesté royale sans précédent parmi les rois antérieurs d’Israël
  alternative: une supériorité absolue sur tous les rois sans restriction temporelle
  rationale: La proposition לְפָנָיו limite explicitement la comparaison aux rois qui ont précédé Salomon et ne doit pas être élargie.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde l’image « aux yeux de tout Israël » et rend l’intensification hébraïque sans lourdeur littérale.
