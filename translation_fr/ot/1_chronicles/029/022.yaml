  text: וַ/יֹּאכְל֨וּ וַ/יִּשְׁתּ֜וּ לִ/פְנֵ֧י יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וַ/יַּמְלִ֤יכוּ שֵׁנִית֙ לִ/שְׁלֹמֹ֣ה בֶן דָּוִ֔יד וַ/יִּמְשְׁח֧וּ לַ/יהוָ֛ה לְ/נָגִ֥יד וּ/לְ/צָד֖וֹק לְ/כֹהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/022.yaml
  text: And they ate and drank before Yahweh on that day with great joy[a], and they made Solomon son of David king a second time, and they anointed him for Yahweh as ruler[d][c][b], and Zadok as priest.
translation:
  language: fr
  text: Ce jour-là, ils mangèrent et burent devant Yahvé[a] avec une grande joie ; ils établirent Salomon, fils de David, roi pour la seconde fois[b], puis l’oignirent pour Yahvé[c] comme chef[d], et Tsadoq comme prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en présence de Yahvé ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de nouveau ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ils l’oignirent devant Yahvé comme chef » ; l’hébreu peut évoquer soit une consécration à Yahvé, soit un acte accompli en sa présence.
    reason: alternative_reading
  - marker: d
    text: Le mot hébreu traduit par « chef » (nagid) peut aussi être rendu, selon le contexte, par « dirigeant » ou « prince ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahvé
  rationale: L’expression signifie littéralement « devant » ou « en présence de » Yahvé. « Devant Yahvé » reste proche de l’hébreu et convient au cadre cultuel.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: avec une grande joie
  rationale: Cette formulation française naturelle rend la manière exprimée par בְּ et conserve l’intensité de l’adjectif.
- source_word: וַיַּמְלִיכוּ
  choice: ils établirent … comme roi
  rationale: Le hifil de מלך signifie faire régner ou établir comme roi. Cette traduction n’ajoute pas l’idée d’un couronnement matériel.
- source_word: שֵׁנִית
  choice: pour la seconde fois
  rationale: Cette expression conserve la précision de la répétition indiquée par l’adverbe hébreu.
- source_word: וַיִּמְשְׁחוּ
  choice: ils oignirent
  rationale: Le verbe משׁח est le terme habituel pour l’onction rituelle liée à l’installation royale ou sacerdotale.
- source_word: לַיהוָה
  choice: pour Yahvé
  rationale: Le ל peut marquer ici la relation, la destination ou la consécration à Yahvé. « Pour Yahvé » préserve cette nuance sans la réduire à la seule présence cérémonielle.
- source_word: לְנָגִיד
  choice: comme chef
  rationale: נָגִיד désigne un responsable placé à la tête du peuple. « Chef » exprime clairement cette autorité sans introduire le sens dynastique moderne de « prince ».
- source_word: לְכֹהֵן
  choice: comme prêtre
  rationale: Le nom désigne directement la fonction sacerdotale et forme un parallèle avec la fonction attribuée à Salomon.
- source_word: בֶן דָּוִיד
  choice: fils de David
  rationale: La désignation filiale est conservée et souligne l’appartenance dynastique de Salomon.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu porte le nom propre divin. Sa transcription préserve cette donnée au lieu de la remplacer par un titre.
- issue: Sens de לַיהוָה dans la proposition relative à l’onction
  choice: ils l’oignirent pour Yahvé comme chef
  alternative: ils l’oignirent devant Yahvé comme chef
  rationale: L’hébreu permet une nuance de consécration ou de relation à Yahvé, mais aussi une compréhension locale ou cérémonielle. Le texte retient « pour Yahvé » et signale l’autre possibilité en note afin de préserver l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche des enchaînements hébreux tout en divisant la longue phrase pour améliorer la lisibilité. Les termes institutionnels « roi », « chef » et « prêtre » sont courants et non confessionnels.
