base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/001.yaml
  text: Then King David said to all the assembly, “Solomon my son, the one God has chosen, is young and inexperienced, and the work is great; for the palace is not for man, but for the LORD God.”
translation:
  language: fr
  text: 'Puis le roi David dit à toute l’assemblée : « Mon fils Salomon, celui que Dieu a choisi, est jeune et inexpérimenté, et l’ouvrage est considérable. En effet, ce palais n’est pas destiné à un homme, mais au SEIGNEUR Dieu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקָּהָל
  choice: l’assemblée
  rationale: Désigne ici l’ensemble du peuple réuni devant David ; « assemblée » est précis, naturel et cohérent avec le contexte public.
- source_word: אֶחָד בָּחַר בּוֹ אֱלֹהִים
  choice: celui que Dieu a choisi
  rationale: Cette formulation française restitue l’identification emphatique de Salomon sans transformer אֶחָד en affirmation doctrinale explicite selon laquelle aucun autre n’aurait jamais été choisi.
- source_word: נַעַר וָרָךְ
  choice: jeune et inexpérimenté
  rationale: רַךְ signifie littéralement « tendre » ou « délicat », mais, associé à נַעַר dans ce contexte de responsabilité, il exprime le manque de maturité ou d’expérience.
- source_word: הַמְּלָאכָה גְדוֹלָה
  choice: l’ouvrage est considérable
  rationale: מְלָאכָה désigne le travail ou l’entreprise à accomplir ; « ouvrage » convient naturellement au projet de construction, tandis que « considérable » rend sa grandeur et son ampleur.
- source_word: הַבִּירָה
  choice: ce palais
  rationale: Le terme peut désigner une citadelle, un palais ou un grand édifice. Dans ce contexte, il présente le Temple projeté comme la demeure royale de Dieu ; « palais » conserve cette image.
- source_word: לַיהוָה אֱלֹהִים
  choice: au SEIGNEUR Dieu
  rationale: Le tétragramme יהוה est rendu selon la convention française courante par « SEIGNEUR », suivi du titre אֱלֹהִים, « Dieu ».
theological_decisions:
- issue: Portée de אֶחָד dans la désignation de Salomon
  choice: celui que Dieu a choisi
  alternative: le seul que Dieu ait choisi
  rationale: Le texte met Salomon en relief comme l’élu de Dieu pour cette tâche. La traduction retenue garde cette emphase sans imposer à אֶחָד une exclusivité absolue plus explicite que l’hébreu.
- issue: Destination sacrée du bâtiment
  choice: n’est pas destiné à un homme, mais au SEIGNEUR Dieu
  alternative: n’est pas pour un homme, mais pour le SEIGNEUR Dieu
  rationale: '« Destiné à » explicite naturellement la relation exprimée par לְ tout en préservant l’opposition théologique centrale : l’édifice est construit pour Dieu, non pour un souverain humain.'
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct conserve la solennité royale sans archaïsmes. « SEIGNEUR » en petites capitales typographiques simulées par les majuscules représente le nom divin יהוה.
