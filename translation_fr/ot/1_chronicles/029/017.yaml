revisions:
- from: Je sais, mon Dieu, que tu examines le cœur et que tu prends plaisir à la droiture. Pour ma part, c’est avec un cœur droit que j’ai offert volontairement toutes ces choses. Et maintenant, j’ai vu avec joie ton peuple ici présent faire volontairement des offrandes pour toi.[a]
  to: Je sais, mon Dieu, que tu examines le cœur et que tu prends plaisir à la droiture. Pour ma part, c’est avec un cœur droit que j’ai offert volontairement toutes ces choses. Et maintenant, j’ai vu avec joie ton peuple ici présent t’offrir librement des offrandes.[a]
  rationale: La révision rend explicitement le datif « à toi » par le pronom complément « t’ », conserve la répétition de la racine נדב par « volontairement / librement », et corrige la note afin qu’elle n’attribue pas au texte l’idée que le peuple s’offre lui-même. Aucun autre changement de sens n’est apporté.
