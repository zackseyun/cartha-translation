review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle au texte hébreu : Dieu examine le cœur, agrée la droiture, David a donné librement et se réjouit de voir le peuple présent donner librement. Toutefois, « pour toi » affaiblit la direction dative de לָךְ (« à toi »), et la note proposée introduit une traduction littérale inexacte de l’infinitif.'
  naturalness: Le français est globalement naturel, moderne et digne. « Ton peuple ici présent » est idiomatique. « Faire volontairement des offrandes » est compréhensible, mais « offrir librement » est plus direct et reproduit mieux la répétition verbale sans suggérer que les personnes s’offrent elles-mêmes.
  terminology: « Examine le cœur », « prend plaisir à la droiture », « cœur droit » et « offert volontairement » conviennent. « Libre­ment » rend bien le caractère spontané de נדב et permet une répétition française fluide. Le datif divin doit être rendu par « à toi ».
  issues:
  - severity: medium
    issue: « pour toi » rend לְךָ de manière moins précise.
    rationale: 'Dans ce contexte, לְךָ marque le destinataire des offrandes : « à toi », non simplement leur finalité (« pour toi »).'
  - severity: medium
    issue: La note dit littéralement « s’offrir volontairement à toi ».
    rationale: L’hébreu emploie l’infinitif hitpael de נדב, qui décrit une offrande ou un don volontaire, mais ne signifie pas littéralement que le peuple « s’offre » lui-même. Cette formulation peut induire un sens non exprimé par le texte.
  revised_text: Je sais, mon Dieu, que tu examines le cœur et que tu prends plaisir à la droiture. Pour ma part, c’est avec un cœur droit que j’ai offert volontairement toutes ces choses. Et maintenant, j’ai vu avec joie ton peuple ici présent t’offrir librement des offrandes.[a]
  revised_footnotes:
