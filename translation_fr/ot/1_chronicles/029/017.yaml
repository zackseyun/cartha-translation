source:
  edition: WLC
  text: וְ/יָדַ֣עְתִּי אֱלֹהַ֔/י כִּ֤י אַתָּה֙ בֹּחֵ֣ן לֵבָ֔ב וּ/מֵישָׁרִ֖ים תִּרְצֶ֑ה אֲנִ֗י בְּ/יֹ֤שֶׁר לְבָבִ/י֙ הִתְנַדַּ֣בְתִּי כָל אֵ֔לֶּה וְ/עַתָּ֗ה עַמְּ/ךָ֙ הַ/נִּמְצְאוּ פֹ֔ה רָאִ֥יתִי בְ/שִׂמְחָ֖ה לְ/הִֽתְנַדֶּב לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/017.yaml
  text: And I know[a], my God, that you test the heart and take pleasure in uprightness. I, in the uprightness of my heart, have willingly offered all these things[b], and now I have seen your people who are present here willingly offer to you with joy.
translation:
  language: fr
  text: Je sais, mon Dieu, que tu examines le cœur et que tu prends plaisir à la droiture. Pour ma part, c’est avec un cœur droit que j’ai offert volontairement toutes ces choses. Et maintenant, j’ai vu avec joie ton peuple ici présent t’offrir librement des offrandes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ton peuple qui se trouve ici [...] offrir librement à toi ». L’expression désigne ici des dons ou des offrandes faits de plein gré.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּחֵן לֵבָב
  choice: tu examines le cœur
  rationale: Le participe בֹּחֵן désigne l’action d’éprouver ou d’examiner. « Examiner » exprime naturellement en français l’évaluation du cœur, compris comme le siège des intentions et de la volonté.
- source_word: וּמֵישָׁרִים תִּרְצֶה
  choice: tu prends plaisir à la droiture
  rationale: מֵישָׁרִים évoque la droiture morale, tandis que רצה exprime ici l’agrément ou le plaisir. Cette formulation conserve à la fois la qualité morale et la disposition favorable de Dieu.
- source_word: בְּיֹשֶׁר לְבָבִי
  choice: c’est avec un cœur droit
  rationale: La tournure française rend de façon naturelle la manière et la qualité morale avec lesquelles David a donné, sans réduire le cœur aux seuls sentiments.
- source_word: הִתְנַדַּבְתִּי
  choice: j’ai offert volontairement
  rationale: Le hitpael de נדב exprime un don librement consenti. « Offrir volontairement » convient au contexte des dons destinés au temple.
- source_word: כָל אֵלֶּה
  choice: toutes ces choses
  rationale: Le démonstratif renvoie vraisemblablement aux biens offerts précédemment. La formulation reste explicite sans préciser davantage leur nature.
- source_word: עַמְּךָ הַנִּמְצְאוּ פֹה
  choice: ton peuple ici présent
  rationale: Le nifal de מצא signifie littéralement « se trouver », mais désigne idiomatiquement les personnes présentes en ce lieu.
- source_word: רָאִיתִי בְשִׂמְחָה
  choice: j’ai vu avec joie
  rationale: 'La formulation préserve le rattachement syntaxique naturel de בְשִׂמְחָה à l’observation de David : c’est avec joie qu’il voit le peuple donner.'
- source_word: לְהִתְנַדֶּב לָךְ
  choice: faire volontairement des offrandes pour toi
  rationale: L’infinitif de נדב exprime de nouveau l’acte de donner de plein gré. « Faire des offrandes » explicite naturellement le don dans ce contexte cultuel, tandis que « pour toi » conserve la destination divine.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Adresse possessive directe, rendue par la formulation française biblique courante.
theological_decisions:
- issue: Portée anthropologique de לֵבָב
  choice: « cœur », désignant la personne intérieure, notamment ses intentions et sa volonté
  alternative: « esprit » ou « être intérieur »
  rationale: Le français « cœur » conserve la métaphore hébraïque et sa richesse anthropologique sans la limiter aux émotions.
- issue: Sens de רצה appliqué à la droiture
  choice: Dieu « prend plaisir » à la droiture
  alternative: Dieu « agrée » ou « approuve » la droiture
  rationale: Le verbe peut exprimer l’agrément comme le plaisir. Le choix retenu préserve la dimension relationnelle et affective sans exclure l’idée d’approbation.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « volontairement » reflète la répétition hébraïque de la racine נדב. La seconde occurrence est formulée avec « faire des offrandes » afin d’éviter l’ambiguïté française selon laquelle les personnes s’offriraient elles-mêmes.
