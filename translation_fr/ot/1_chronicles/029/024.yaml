  text: וְ/כָל הַ/שָּׂרִים֙ וְ/הַ/גִּבֹּרִ֔ים וְ/גַ֕ם כָּל בְּנֵ֖י הַ/מֶּ֣לֶךְ דָּוִ֑יד נָ֣תְנוּ יָ֔ד תַּ֖חַת שְׁלֹמֹ֥ה הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/024.yaml
  text: And all the officials[a], the mighty men, and also all the sons of King David pledged allegiance to King Solomon.
translation:
  language: fr
  text: Tous les hauts responsables, les hommes vaillants, ainsi que tous les fils du roi David, firent acte d’allégeance[a] au roi Salomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donnèrent la main sous Salomon, le roi », expression hébraïque signifiant se soumettre à son autorité ou lui promettre fidélité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָּׂרִים
  choice: hauts responsables
  rationale: Le terme désigne largement des dirigeants ou des personnages de haut rang. « Hauts responsables » convient au contexte de la cour sans limiter leur fonction au domaine militaire ni leur attribuer nécessairement un titre princier.
- source_word: גִּבֹּרִים
  choice: hommes vaillants
  rationale: Cette expression conserve l’idée de bravoure et de puissance, souvent associée aux guerriers, sans supprimer la possible nuance plus large de prestige ou de capacité.
- source_word: בְּנֵי הַמֶּלֶךְ דָּוִיד
  choice: les fils du roi David
  rationale: Traduction directe qui maintient le lien filial explicite ainsi que le titre royal attribué à David.
- source_word: נָתְנוּ יָד תַּחַת
  choice: firent acte d’allégeance
  rationale: L’expression hébraïque, littéralement « donnèrent la main sous », est un idiome exprimant la soumission et la loyauté envers un supérieur. « Faire acte d’allégeance » en rend clairement la portée dans un français actuel et digne.
- source_word: שְׁלֹמֹה הַמֶּלֶךְ
  choice: au roi Salomon
  rationale: L’ordre français naturel « roi Salomon » rend l’apposition hébraïque « Salomon, le roi » et souligne son statut royal reconnu.
