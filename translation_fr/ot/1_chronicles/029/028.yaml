  text: וַ/יָּ֨מָת֙ בְּ/שֵׂיבָ֣ה טוֹבָ֔ה שְׂבַ֥ע יָמִ֖ים עֹ֣שֶׁר וְ/כָב֑וֹד וַ/יִּמְלֹ֛ךְ שְׁלֹמֹ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/028.yaml
  text: And he died in a good old age[a], full of days, riches, and honor; and Solomon his son reigned in his place.
translation:
  language: fr
  text: Il mourut dans une heureuse vieillesse, rassasié de jours, de richesse et d’honneur. Son fils Salomon régna à sa place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Il mourut
  rationale: Le wayyiqtol de מות fait avancer le récit. En français, la simple succession des phrases suffit à exprimer cet enchaînement sans qu’il soit nécessaire d’ajouter « puis ».
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: après une heureuse vieillesse
  rationale: L’expression décrit les circonstances positives de sa mort. « Après une heureuse vieillesse » est naturel en français moderne et conserve l’évaluation favorable portée par טוֹבָה.
- source_word: שְׂבַע יָמִים
  choice: rassasié de jours
  rationale: La formulation conserve l’image de l’expression hébraïque, qui évoque à la fois une longue vie et le fait d’en avoir reçu une pleine mesure.
- source_word: עֹשֶׁר וְכָבוֹד
  choice: de richesse et d’honneur
  rationale: עֹשֶׁר désigne la richesse matérielle, tandis que כָבוֹד renvoie ici à l’honneur et au prestige attachés au roi. Les compléments sont coordonnés à « jours » sous la portée de « rassasié ».
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Le qal de מלך signifie ici « régner » dans une formule de succession royale.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: Son fils Salomon
  rationale: Cet ordre est idiomatique en français et rend clairement le lien filial exprimé par בְנוֹ.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans une formule de succession, תחת avec suffixe signifie que Salomon prend la place royale de David.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La traduction garde l’image sémitique « rassasié de jours » sans la réduire à la seule idée d’un âge avancé. La ponctuation en deux phrases allège la longue coordination hébraïque sans modifier la progression du récit.
