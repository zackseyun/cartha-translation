id: 1CH.29.15
reference: 1 Chronicles 29:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי גֵרִ֨ים אֲנַ֧חְנוּ לְ/פָנֶ֛י/ךָ וְ/תוֹשָׁבִ֖ים כְּ/כָל אֲבֹתֵ֑י/נוּ כַּ/צֵּ֧ל יָמֵ֛י/נוּ עַל הָ/אָ֖רֶץ וְ/אֵ֥ין מִקְוֶֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/015.yaml
  text: For we are sojourners before you[a], and temporary residents, as all our fathers were. Our days on the earth are like a shadow[c][b], and there is no hope.
translation:
  language: fr
  text: Car nous sommes devant toi des étrangers[a] et des résidents temporaires[b], comme l’ont été tous nos ancêtres. Nos jours sur la terre sont comme une ombre, et il n’y a aucun espoir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « immigrés » ou « étrangers résidents ».
    reason: lexical_alternative
  - marker: b
    text: Ou « résidents étrangers ».
    reason: lexical_alternative
  - marker: c
    text: Dans ce contexte, l’absence d’espoir se rapporte au caractère fugitif de la vie humaine sur la terre; elle n’affirme pas nécessairement qu’il n’existe aucune espérance en Dieu.
    reason: cross_reference
lexical_decisions:
- source_word: גֵרִים
  choice: étrangers
  rationale: Le terme désigne des personnes qui résident dans un pays sans y avoir le statut des autochtones. « Étrangers » est naturel en français et conserve cette nuance sociale, sans réduire leur situation à un simple passage.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Cette expression, littéralement « devant ta face », marque ici la situation des humains en présence de Dieu. « Devant toi » en conserve la concision et l’orientation.
- source_word: תוֹשָׁבִים
  choice: résidents temporaires
  rationale: Le mot désigne des personnes établies dans un lieu sans y posséder un statut permanent. Cette formulation moderne rend clairement le parallélisme avec « étrangers ».
- source_word: כְּכָל אֲבֹתֵינוּ
  choice: comme l’ont été tous nos ancêtres
  rationale: « Ancêtres » exprime en français courant le sens collectif de אֲבֹתֵינוּ dans ce contexte historique, tandis que « l’ont été » explicite naturellement l’ellipse hébraïque.
- source_word: כַּצֵּל
  choice: comme une ombre
  rationale: La comparaison biblique évoque la brièveté et le caractère fugitif de la vie humaine; la métaphore est conservée sans explication dans le texte.
- source_word: יָמֵינוּ עַל הָאָרֶץ
  choice: nos jours sur la terre
  rationale: Traduction directe et idiomatique qui conserve à la fois la dimension temporelle et le cadre terrestre.
- source_word: וְאֵין מִקְוֶה
  choice: et il n’y a aucun espoir
  rationale: מִקְוֶה peut exprimer l’espoir ou l’attente. La formulation conserve la force et la tension de l’hébreu sans ajouter dans le texte une restriction interprétative.
theological_decisions:
- issue: Portée de וְאֵין מִקְוֶה dans le contexte de la mortalité humaine
  choice: « il n’y a aucun espoir », compris dans le contexte immédiat de la vie terrestre fugitive
  alternative: « il n’y a aucune perspective d’avenir » ou « il n’y a aucune attente »
  rationale: Le verset souligne la condition passagère des humains devant Dieu. La traduction garde l’affirmation abrupte de l’hébreu et sa tension théologique; une note indique son lien contextuel avec la brièveté de la vie sans affaiblir le texte ni lui faire nier explicitement toute espérance en Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La structure poétique et les deux termes parallèles décrivant le statut non permanent sont conservés. « Ancêtres » évite l’ambiguïté moderne de « pères » tout en rendant le sens collectif du terme hébreu.
