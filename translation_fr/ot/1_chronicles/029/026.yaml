  text: וְ/דָוִיד֙ בֶּן יִשָׁ֔י מָלַ֖ךְ עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/026.yaml
  text: And David son of Jesse reigned over all Israel.
translation:
  language: fr
  text: David, fils de Jessé, régna sur tout Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דָוִיד
  choice: David
  rationale: La conjonction וְ assure ici la continuité du récit. En français, au début de cette phrase récapitulative, elle peut rester implicite afin d’éviter un « Et » peu naturel, sans perte de sens.
- source_word: בֶּן יִשָׁי
  choice: fils de Jessé
  rationale: Le groupe construit signifie littéralement « fils de Jessé ». Cette formulation française est naturelle et conserve l’identification généalogique.
- source_word: מָלַךְ
  choice: régna
  rationale: Le qal accompli de מלך désigne ici l’exercice de la royauté, et non seulement l’accession au trône. « Régna » rend précisément cette valeur.
- source_word: עַל
  choice: sur
  rationale: Avec le verbe מלך, עַל introduit le peuple ou le territoire gouverné. « Régner sur » est l’expression idiomatique française.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: כָּל exprime ici la totalité du peuple d’Israël. « Tout Israël » est la formulation française concise et traditionnelle qui en conserve la portée.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le passé simple convient à la narration historique écrite et permet de rendre nettement l’exercice achevé de la royauté.
