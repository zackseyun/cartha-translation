  yaml_path: translation/ot/1_chronicles/029/005.yaml
  text: gold for the things of gold[a], and silver for the things of silver, and for every kind of work by the hands of craftsmen. And who is willing to fill his hand today for Yahweh?
translation:
  language: fr
  text: l’or pour les ouvrages en or, l’argent pour les ouvrages en argent, et pour tous les travaux à réaliser par des artisans. Qui donc est prêt à remplir sa main[a] aujourd’hui pour Yahweh ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « remplir sa main ». Cette expression hébraïque peut désigner une consécration ou le fait de présenter une offrande destinée au service sacré.'
    reason: Préciser le sens possible de l’expression cultuelle hébraïque, volontairement conservée dans le texte.
lexical_decisions:
- source_word: לַזָּהָב לַזָּהָב
  choice: l’or pour ce qui doit être en or
  rationale: 'La répétition hébraïque est elliptique : il s’agit de l’or destiné aux objets ou travaux en or. Cette formulation explicite sobrement l’ellipse.'
- source_word: וְלַכֶּסֶף לַכֶּסֶף
  choice: l’argent pour ce qui doit être en argent
  rationale: Le parallélisme avec l’or indique l’argent destiné aux objets ou travaux en argent.
- source_word: וּלְכָל מְלָאכָה בְּיַד חָרָשִׁים
  choice: et pour tous les ouvrages réalisés par la main des artisans
  rationale: « Ouvrages » convient au travail du sanctuaire, tandis que « par la main » conserve l’image hébraïque de l’exécution par des artisans qualifiés.
- source_word: וּמִי מִתְנַדֵּב
  choice: Qui donc est prêt
  rationale: Le verbe exprime une disposition volontaire. « Est prêt » rend naturellement l’appel rhétorique sans réduire celui-ci à un simple don financier.
- source_word: לְמַלֹּאות יָדוֹ
  choice: à remplir aujourd’hui sa main
  rationale: La traduction conserve l’expression cultuelle littérale et son ambiguïté entre consécration personnelle et offrande destinée au service sacré; la note en explique la portée possible.
- source_word: הַיּוֹם לַיהוָה
  choice: aujourd’hui ... pour Yahweh
  rationale: « Aujourd’hui » rend directement l’adverbe temporel; « pour Yahweh » conserve la relation exprimée par ל et le nom divin personnel.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve ici le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Portée de l’expression cultuelle לְמַלֹּאות יָדוֹ
  choice: remplir sa main
  alternative: consacrer sa main / se consacrer
  rationale: L’expression peut évoquer la consécration, l’investiture ou le fait d’apporter une offrande pour le service sacré. La formulation littérale, accompagnée d’une note, préserve cette tension plutôt que de trancher.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve le caractère fragmentaire du début du verset, qui poursuit l’énumération du verset précédent, ainsi que l’image concrète de la « main ».
