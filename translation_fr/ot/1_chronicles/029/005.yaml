  rationale: La révision supprime la modalité ajoutée par « doit », rend les deux premières ellipses par « ouvrages en or/en argent », et exprime les travaux des artisans comme des travaux à réaliser. L’idiome cultuel est conservé littéralement, avec sa note déplacée à l’endroit pertinent afin d’en préserver l’ambiguïté sans en imposer une interprétation.
