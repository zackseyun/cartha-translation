  text: וַ/יִּֽתְנַדְּבוּ֩ שָׂרֵ֨י הָ/אָב֜וֹת וְ/שָׂרֵ֣י שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/הַ/מֵּא֔וֹת וּ/לְ/שָׂרֵ֖י מְלֶ֥אכֶת הַ/מֶּֽלֶךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/006.yaml
  text: Then the leaders of the fathers’ houses[a], and the leaders of the tribes of Israel, and the commanders of the thousands and of the hundreds, and the overseers of the king’s work[c][b], gave willingly.
translation:
  language: fr
  text: Alors les chefs des maisons ancestrales[b], les chefs des tribus d’Israël, les chefs des unités de mille et de cent[c], ainsi que les responsables des travaux du roi, firent des dons de leur plein gré[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « offrirent de bon cœur » ou « se portèrent volontaires ». Le verbe hébreu souligne une réponse libre ; dans ce contexte, il désigne probablement des dons volontaires.
    reason: lexical_alternative
  - marker: b
    text: Les « maisons ancestrales » étaient des groupes familiaux ou claniques organisés selon la lignée paternelle.
    reason: cultural_note
  - marker: c
    text: Les unités de mille et de cent étaient des divisions militaires ou administratives ; il est donc question ici de leurs chefs.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְנַדְּבוּ
  choice: firent volontairement des dons
  rationale: Le hitpael de נדב exprime une réponse libre et volontaire. Dans le contexte immédiat, il s’agit de contributions matérielles ; cette formulation rend à la fois l’acte de donner et son caractère volontaire sans ajouter d’objet précis.
- source_word: שָׂרֵי
  choice: chefs
  rationale: Le terme désigne des personnes investies d’autorité. « Chefs » convient aux structures familiales, tribales et administratives énumérées ici, sans suggérer nécessairement un rang nobiliaire.
- source_word: הָאָבוֹת
  choice: maisons ancestrales
  rationale: L’expression renvoie aux divisions familiales ou claniques fondées sur l’ascendance paternelle. « Maisons ancestrales » conserve cette organisation sociale tout en restant compréhensible en français moderne.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: tribus d’Israël
  rationale: Traduction directe et usuelle des unités tribales d’Israël.
- source_word: הָאֲלָפִים וְהַמֵּאוֹת
  choice: unités de mille et de cent
  rationale: Les nombres désignent ici des divisions militaires ou administratives placées sous l’autorité de chefs. L’ajout explicatif « unités » évite de faire croire qu’il s’agit simplement de nombres de personnes.
- source_word: וּלְשָׂרֵי
  choice: ainsi que les responsables
  rationale: La préposition ל introduit vraisemblablement une autre catégorie de dirigeants chargés du travail royal. « Responsables » exprime clairement cette fonction administrative sans surinterpréter leur titre précis.
- source_word: מְלֶאכֶת הַמֶּלֶךְ
  choice: des travaux du roi
  rationale: מְלָאכָה peut désigner un travail, une tâche ou une activité. Le pluriel français convient naturellement aux projets et activités relevant de l’administration royale, tout en gardant une portée assez large.
