base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/019.yaml
  text: And give to Solomon my son a whole heart to keep your commandments[a], your testimonies, and your statutes, and to do all of them, and to build the fortress that I have prepared.
translation:
  language: fr
  text: Et donne à Salomon, mon fils, un cœur entier, afin qu’il garde tes commandements, tes témoignages et tes prescriptions, qu’il les mette tous en pratique et qu’il construise la citadelle[a] que j’ai préparée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « palais », ou simplement « Temple ». Le mot hébreu, inhabituel, désigne une construction imposante ou fortifiée ; ici, il renvoie au projet du sanctuaire, que David avait préparé pour que Salomon le construise.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה בְנִי תֵּן
  choice: Et donne à Salomon, mon fils
  rationale: La construction présente Salomon comme bénéficiaire de la demande adressée à Dieu. « Donne » restitue directement נתן, tandis que l’apposition « mon fils » reste explicite.
- source_word: לֵבָב שָׁלֵם
  choice: un cœur entier
  rationale: לֵבָב désigne ici le centre intérieur de la volonté et de la pensée, et שָׁלֵם exprime l’intégrité ou la totalité. « Un cœur entier » conserve l’image hébraïque sans réduire le sens à la seule sincérité ni imposer « sans partage ».
- source_word: לִשְׁמוֹר
  choice: afin qu’il garde
  rationale: Avec des commandements, שׁמר signifie les garder, les observer. La proposition finale rend naturellement en français la fonction des infinitifs hébreux après « donne ».
- source_word: מִצְוֺתֶיךָ עֵדְוֺתֶיךָ וְחֻקֶּיךָ
  choice: tes commandements, tes témoignages et tes prescriptions
  rationale: Cette série maintient trois termes distincts. « Témoignages » conserve la nuance juridique et covenantale de עֵדוֹת, tandis que « prescriptions » exprime les règles fixées désignées par חֻקִּים.
- source_word: וְלַעֲשׂוֹת הַכֹּל
  choice: qu’il les mette tous en pratique
  rationale: Le pronom reprend naturellement les trois catégories au pluriel. « Mettre en pratique » exprime le sens concret de עשׂה dans ce contexte d’obéissance.
- source_word: וְלִבְנוֹת הַבִּירָה
  choice: et qu’il construise la citadelle
  rationale: בִּירָה désigne une construction imposante, palatiale ou fortifiée. « Citadelle » conserve le caractère inhabituel du terme hébreu; une note précise qu’il s’agit ici du sanctuaire préparé par David.
- source_word: אֲשֶׁר הֲכִינוֹתִי
  choice: que j’ai préparée
  rationale: Le hiphil de כון signifie préparer ou rendre prêt. L’accord avec « citadelle » donne une formulation française directe tout en conservant la déclaration de David.
theological_decisions:
- issue: Sens de בִּירָה appliqué au sanctuaire de Jérusalem
  choice: citadelle, avec une note contextuelle
  alternative: palais; Temple; palais-temple
  rationale: Le mot hébreu est plus marqué que le terme ordinaire pour « Temple » et peut évoquer un palais ou une forteresse. Dans ce contexte, il désigne toutefois le sanctuaire que Salomon doit bâtir. Le texte garde l’étrangeté lexicale, tandis que la note empêche de comprendre qu’il s’agit d’un ouvrage militaire ou d’une résidence royale.
- issue: Nature du « cœur entier »
  choice: conserver la métaphore sans l’expliciter doctrinalement
  alternative: un cœur parfait; un cœur sans partage; une volonté entièrement fidèle
  rationale: שָׁלֵם peut exprimer la totalité, l’intégrité et la pleine loyauté. « Entier » préserve cette amplitude et évite de définir ici une doctrine de perfection ou de résoudre l’expression exclusivement comme absence de division intérieure.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe de prière est conservée, mais les infinitifs hébreux sont rendus par des propositions finales naturelles. Les trois catégories juridiques restent distinctes, et le terme rare בִּירָה est maintenu sous une forme marquée accompagnée d’une note explicative.
