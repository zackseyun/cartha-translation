  text: three thousand talents of gold[a], from the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the buildings[b],
translation:
  language: fr
  text: trois mille talents[a] d’or d’Ophir[b], et sept mille talents d’argent affiné, pour revêtir les murs des bâtiments ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « talent » est une ancienne unité de poids, et non une aptitude ou une capacité.
    reason: cultural_note
  - marker: b
    text: Ou « d’or provenant d’Ophir ». L’hébreu peut désigner de l’or venant d’Ophir ou employer « or d’Ophir » comme une désignation descriptive.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: trois mille
  rationale: Rend directement et naturellement la construction numérale hébraïque.
- source_word: כִּכְּרֵי / כִּכַּר
  choice: talents
  rationale: Le terme désigne une ancienne unité de poids importante. « Talents » est l’équivalent français traditionnel et évite une conversion moderne incertaine.
- source_word: זָהָב
  choice: or
  rationale: Désignation directe du métal précieux.
- source_word: מִזְּהַב אוֹפִיר
  choice: provenant de l’or d’Ophir
  rationale: Cette formulation rend la préposition מִן et conserve Ophir comme nom de lieu, tout en laissant à une note l’ambiguïté entre provenance et qualification de l’or.
- source_word: וְשִׁבְעַת אֲלָפִים
  choice: et sept mille
  rationale: Traduction directe de la coordination et du nombre cardinal.
- source_word: כֶּסֶף
  choice: argent
  rationale: Dans ce contexte, le mot désigne le métal précieux et non la monnaie.
- source_word: מְזֻקָּק
  choice: affiné
  rationale: Le participe passif évoque un métal soumis à un processus d’épuration ; « affiné » est précis et idiomatique en métallurgie.
- source_word: לָטוּחַ
  choice: pour revêtir
  rationale: Dans le contexte de métaux précieux appliqués sur des murs, « revêtir » exprime naturellement l’action de couvrir une surface d’une couche de métal, sans suggérer un simple enduit de mortier.
- source_word: קִירוֹת
  choice: les murs
  rationale: Équivalent courant du nom pluriel dans cette construction.
- source_word: הַבָּתִּים
  choice: des bâtiments
  rationale: Bien que le terme signifie littéralement « maisons », le contexte architectural du temple favorise « bâtiments », suffisamment large pour désigner les différentes structures sans évoquer des habitations privées.
