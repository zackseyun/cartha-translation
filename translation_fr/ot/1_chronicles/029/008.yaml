source:
  edition: WLC
  text: וְ/הַ/נִּמְצָ֤א אִתּ/וֹ֙ אֲבָנִ֔ים נָתְנ֖וּ לְ/אוֹצַ֣ר בֵּית יְהוָ֑ה עַ֥ל יַד יְחִיאֵ֖ל הַ/גֵּרְשֻׁנִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/008.yaml
  text: Whoever had precious stones gave them to the treasury of the house of Yahweh, into the care of Jehiel the Gershonite.
translation:
  language: fr
  text: Tous ceux qui avaient des pierres précieuses les donnèrent au trésor de la maison de Yahweh, sous la responsabilité de Yehiel le Guershonite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des pierres » et « par la main de Yehiel ». Dans ce contexte, il s’agit de pierres de valeur confiées à sa garde ou à sa supervision.'
    reason: La note signale à la fois l’absence de l’adjectif « précieuses » dans l’hébreu et l’image littérale de l’expression idiomatique עַל יַד.
lexical_decisions:
- source_word: וְהַנִּמְצָא אִתּוֹ
  choice: Tous ceux qui avaient
  rationale: La tournure avec le participe niphal de מצא et אִתּוֹ exprime idiomatiquement ce qui se trouvait en la possession de quelqu’un. Le pluriel distributif français convient au verbe pluriel נָתְנוּ et au contexte collectif.
- source_word: אֲבָנִים
  choice: des pierres précieuses
  rationale: Le nom signifie littéralement « pierres », mais, dans ce contexte de dons destinés au trésor du sanctuaire, il désigne naturellement des pierres de valeur. Cette précision contextuelle évite l’idée de simples pierres ordinaires.
- source_word: נָתְנוּ
  choice: les donnèrent
  rationale: נתן désigne ici la remise volontaire de biens; « donnèrent » reste direct, naturel et proche du texte.
- source_word: לְאוֹצַר
  choice: au trésor
  rationale: אוֹצָר peut désigner un dépôt, une réserve ou un trésor. Avec des objets de valeur appartenant à la maison de Yahweh, « trésor » convient le mieux.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette formulation conserve l’expression hébraïque « maison de YHWH » sans la remplacer par l’interprétation plus explicite « temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
- source_word: עַל יַד
  choice: sous la responsabilité de
  rationale: L’expression signifie littéralement « par la main de », mais marque ici la garde ou la supervision confiée à Yehiel. La traduction retenue en communique clairement la fonction.
- source_word: יְחִיאֵל
  choice: Yehiel
  rationale: Translittération française intelligible du nom hébreu יְחִיאֵל.
- source_word: הַגֵּרְשֻׁנִּי
  choice: le Guershonite
  rationale: Le gentilé identifie Yehiel comme membre du clan de Guershon; la forme française traditionnelle est claire et concise.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Nature des אֲבָנִים
  choice: pierres précieuses
  alternative: pierres
  rationale: L’hébreu dit simplement « pierres », mais le contexte immédiat de biens de valeur remis au trésor favorise le sens de pierres précieuses. Une note conserve toutefois la formulation littérale et son ambiguïté lexicale.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient à la narration biblique écrite sans être archaïque. « Maison de Yahweh » préserve l’expression hébraïque, tandis que « sous la responsabilité de » rend naturellement l’idiome administratif.
