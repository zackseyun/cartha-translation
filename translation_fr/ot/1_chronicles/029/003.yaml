revisions:
- from: De plus, parce que je prends plaisir à la maison de mon Dieu, je donne à la maison de mon Dieu mon trésor personnel d’or et d’argent, en plus de tout ce que j’ai préparé pour la maison sainte.[a]
  to: De plus, parce que la maison de mon Dieu m’est chère, je possède un trésor personnel d’or et d’argent, que j’ai donné à la maison de mon Dieu, en plus de tout ce que j’ai préparé pour la maison sacrée.[a]
  rationale: La révision restitue la valeur accomplie de נָתַתִּי par « j’ai donné », conserve explicitement la possession exprimée par יֶשׁ לִי, et adopte des formulations françaises plus naturelles sans perdre la répétition de « maison » ni la distinction entre le trésor personnel et les préparatifs déjà réalisés.
