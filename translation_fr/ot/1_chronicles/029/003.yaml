source:
  edition: WLC
  text: וְ/ע֗וֹד בִּ/רְצוֹתִ/י֙ בְּ/בֵ֣ית אֱלֹהַ֔/י יֶשׁ לִ֥/י סְגֻלָּ֖ה זָהָ֣ב וָ/כָ֑סֶף נָתַ֤תִּי לְ/בֵית אֱלֹהַ/י֙ לְ/מַ֔עְלָ/ה מִ/כָּל הֲכִינ֖וֹתִי לְ/בֵ֥ית הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/003.yaml
  text: Moreover[a], because of my delight in the house of my God, I have a personal treasure of gold and silver, and I have given it to the house of my God[c][b], over and above all that I have prepared for the holy house.
translation:
  language: fr
  text: De plus, parce que la maison de mon Dieu m’est chère, je possède un trésor personnel d’or et d’argent, que j’ai donné à la maison de mon Dieu, en plus de tout ce que j’ai préparé pour la maison sacrée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le sanctuaire » au lieu de « pour la maison sacrée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: De plus
  rationale: Introduit naturellement un ajout qui renchérit sur les préparatifs mentionnés auparavant.
- source_word: בִּרְצוֹתִי בְּבֵית אֱלֹהַי
  choice: parce que je prends plaisir à la maison de mon Dieu
  rationale: Le nom רָצוֹן avec suffixe exprime ici l’attachement ou le plaisir de David, et בְּ désigne naturellement l’objet de cet attachement.
- source_word: יֶשׁ לִי סְגֻלָּה
  choice: mon trésor personnel
  rationale: La construction יֶשׁ לִי marque la possession, tandis que סְגֻלָּה désigne un bien précieux détenu en propre. La formulation française met en évidence le contraste avec les ressources déjà préparées.
- source_word: זָהָב וָכָסֶף
  choice: d’or et d’argent
  rationale: Rend directement les deux matières précieuses dans une tournure française naturelle.
- source_word: נָתַתִּי
  choice: je donne
  rationale: Le parfait hébreu présente le don comme décidé ou accompli dans le cadre de la déclaration publique de David. Le présent français convient à cet acte de donation proclamé, sans imposer une antériorité absente du contexte immédiat.
- source_word: לְבֵית אֱלֹהַי
  choice: à la maison de mon Dieu
  rationale: Avec נתן, לְ indique le destinataire ou la destination du don.
- source_word: לְמַעְלָה מִכָּל הֲכִינוֹתִי
  choice: en plus de tout ce que j’ai préparé
  rationale: Exprime clairement l’idée d’un apport supplémentaire dépassant les préparatifs déjà effectués.
- source_word: לְבֵית הַקֹּדֶשׁ
  choice: pour la maison sainte
  rationale: Préserve l’image répétée de la « maison » et rend la construction littérale « maison de sainteté » dans un français digne et compréhensible.
theological_decisions:
- issue: Terminologie appliquée au sanctuaire dans le discours de David
  choice: maison de mon Dieu / maison sainte
  alternative: temple de mon Dieu / sanctuaire
  rationale: Le texte répète בַּיִת, « maison ». Conserver ce terme respecte l’image théologique du lieu destiné à Dieu sans substituer le terme interprétatif « temple ». « Sanctuaire » reste une traduction possible de la dernière expression.
- issue: Valeur temporelle de נָתַתִּי
  choice: je donne
  alternative: j’ai donné
  rationale: Le parfait peut décrire un acte accompli, mais dans cette annonce publique il peut aussi présenter comme arrêté le don que David détaille aussitôt aux versets suivants. Le présent français maintient la force performative de la déclaration sans résoudre excessivement la chronologie.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « maison de mon Dieu » est conservée comme dans l’hébreu. « Trésor personnel » distingue les biens propres de David des ressources déjà préparées pour le projet.
