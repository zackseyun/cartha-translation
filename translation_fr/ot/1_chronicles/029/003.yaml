    rationale: 'La formulation est calquée sur l’hébreu et demeure possible, mais elle est moins naturelle en français contemporain que l’expression d’un attachement : « la maison de mon Dieu m’est chère ».'
  - severity: low
    issue: « Maison sainte »
    rationale: Cette expression est intelligible, mais « maison sacrée » est plus idiomatique en français moderne tout en maintenant le lexème « maison » présent dans l’hébreu.
