  text: וַ/יִּשְׂמְח֤וּ הָ/עָם֙ עַל הִֽתְנַדְּבָ֔/ם כִּ֚י בְּ/לֵ֣ב שָׁלֵ֔ם הִֽתְנַדְּב֖וּ לַ/יהוָ֑ה וְ/גַם֙ דָּוִ֣יד הַ/מֶּ֔לֶךְ שָׂמַ֖ח שִׂמְחָ֥ה גְדוֹלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/009.yaml
  text: Then the people rejoiced because they had offered willingly[a], for with a whole heart they had offered willingly to Yahweh[b]; and David the king also rejoiced with great joy.
translation:
  language: fr
  text: Alors le peuple se réjouit de ces dons volontaires[a], car ils avaient été offerts à Yahvé d’un cœur sans partage[b]. Le roi David, lui aussi, se réjouit beaucoup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce qu’ils avaient offert volontairement ». Le verbe hébreu insiste sur le caractère libre et volontaire du don.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « d’un cœur complet ». Cette expression évoque une sincérité entière, sans partage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ הָעָם
  choice: Alors le peuple se réjouit
  rationale: Le passé simple convient au récit soutenu en français, tandis que « alors » rend naturellement la progression narrative portée par le waw consécutif.
- source_word: עַל הִתְנַדְּבָם
  choice: parce que tous avaient fait leurs offrandes de bon gré
  rationale: Le hitpael de נדב souligne le caractère libre et volontaire des contributions. « Tous » explicite naturellement en français que les membres du peuple sont les auteurs des offrandes, sans faire de « peuple » singulier l’antécédent direct de « ils ».
- source_word: כִּי
  choice: en effet
  rationale: Introduit l’explication de la joie du peuple et conserve le lien logique avec la proposition précédente.
- source_word: בְּלֵב שָׁלֵם
  choice: d’un cœur entier
  rationale: Conserve l’image hébraïque du cœur complet ou sans partage, tout en restant idiomatique et intelligible en français.
- source_word: הִתְנַדְּבוּ לַיהוָה
  choice: ils les avaient faites à Yahvé
  rationale: Le pronom reprend les offrandes et évite une répétition française pesante, tandis que la tournure garde l’idée d’un don volontaire adressé à Yahvé.
- source_word: וְגַם דָּוִיד הַמֶּלֶךְ
  choice: Le roi David, lui aussi
  rationale: L’incise « lui aussi » restitue clairement la valeur additive et emphatique de וְגַם dans un ordre naturel en français.
- source_word: שָׂמַח שִׂמְחָה גְדוֹלָה
  choice: éprouva une très grande joie
  rationale: Rend avec naturel l’intensité de l’accusatif interne hébreu, dont une reproduction littérale serait lourde en français.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahvé » représente en français moderne le nom propre divin et le distingue d’un titre, sans ajouter d’interprétation confessionnelle.
- issue: Sens de לַיהוָה dans le don volontaire
  choice: faites à Yahvé
  alternative: offertes pour Yahvé
  rationale: La préposition ל marque ici le destinataire des contributions. « À Yahvé » conserve cette relation sans préciser davantage la nature cultuelle ou matérielle du don.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient la cadence narrative biblique sans archaïsme marqué. La formulation préserve l’image concrète du « cœur entier » et le caractère volontaire des contributions.
