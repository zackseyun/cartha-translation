source:
  edition: WLC
  text: וְ/כִ֨י מִ֤י אֲנִי֙ וּ/מִ֣י עַמִּ֔/י כִּֽי נַעְצֹ֣ר כֹּ֔חַ לְ/הִתְנַדֵּ֖ב כָּ/זֹ֑את כִּֽי מִמְּ/ךָ֣ הַ/כֹּ֔ל וּ/מִ/יָּדְ/ךָ֖ נָתַ֥נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/014.yaml
  text: But who am I[a], and who are my people, that we should be able to offer willingly like this? For everything comes from you, and from your hand we have given to you.
translation:
  language: fr
  text: Mais qui suis-je, et qui est mon peuple, pour que nous puissions offrir volontairement de cette manière[a] ? Car tout vient de toi, et c’est de ta main que nous t’avons donné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « pour que nous retenions la force d’offrir volontairement ainsi » ; l’expression signifie ici avoir la capacité ou les moyens nécessaires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Mais
  rationale: La conjonction marque ici, dans la prière de David, un contraste empreint d’humilité et une reprise rhétorique. « Mais » rend naturellement ce mouvement en français.
- source_word: מִי אֲנִי וּמִי עַמִּי
  choice: qui suis-je, et qui est mon peuple
  rationale: מִי signifie normalement « qui ? ». La question rhétorique porte ici sur le rang et la dignité de David et de son peuple, et non sur leur nature.
- source_word: נַעְצֹר כֹּחַ
  choice: nous soyons capables
  rationale: L’expression évoque littéralement le fait de retenir ou de disposer de la force nécessaire. Dans ce contexte, elle désigne la capacité ou les moyens de contribuer; la formulation française choisie est claire sans préciser indûment si cette capacité est physique ou matérielle.
- source_word: לְהִתְנַדֵּב
  choice: faire […] des offrandes de bon cœur
  rationale: La forme réfléchie de נדב exprime une contribution volontaire et consentie. « De bon cœur » conserve la disposition volontaire, tandis que « offrandes » convient au contexte des dons destinés au temple.
- source_word: כָּזֹאת
  choice: de telles
  rationale: Le démonstratif renvoie à la générosité remarquable qui vient d’être décrite. « De telles offrandes » est idiomatique en français moderne.
- source_word: מִמְּךָ הַכֹּל
  choice: tout vient de toi
  rationale: La préposition indique la provenance. Cette formulation exprime directement que Dieu est la source de tout.
- source_word: וּמִיָּדְךָ
  choice: venait de ta main
  rationale: L’image hébraïque de la main comme source de ce qui est accordé est transparente en français et mérite d’être conservée.
- source_word: נָתַנּוּ לָךְ
  choice: ce que nous t’avons donné
  rationale: Le passé composé résume l’acte accompli évoqué dans la prière. La restructuration de la proposition évite une tournure française maladroite tout en conservant le don fait à Dieu.
theological_decisions:
- issue: La propriété divine et les dons humains
  choice: Le texte affirme que tout vient de Dieu et que les dons humains proviennent eux-mêmes de ce qu’il a accordé.
  alternative: Expliciter que les donateurs ne font que rendre à Dieu ce qui lui appartient déjà.
  rationale: L’hébreu présente clairement Dieu comme la source de tout et de ce qui lui est donné, mais il ne formule pas explicitement l’idée de « rendre ». La traduction maintient cette affirmation sans lui ajouter une formulation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique conserve le ton humble de la prière. « Offrandes de bon cœur » traduit la générosité volontaire sans recourir à un vocabulaire cultuel excessivement technique.
