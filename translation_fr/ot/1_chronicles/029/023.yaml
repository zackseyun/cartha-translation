source:
  edition: WLC
  text: וַ/יֵּ֣שֶׁב שְׁ֠לֹמֹה עַל כִּסֵּ֨א יְהוָ֧ה לְ/מֶ֛לֶךְ תַּֽחַת דָּוִ֥יד אָבִ֖י/ו וַ/יַּצְלַ֑ח וַ/יִּשְׁמְע֥וּ אֵלָ֖י/ו כָּל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/023.yaml
  text: Then Solomon sat on the throne of Yahweh as king in place of David his father[a], and he prospered, and all Israel listened to him.
translation:
  language: fr
  text: Salomon siégea alors sur le trône de Yahweh comme roi à la place de David, son père. Il prospéra, et tout Israël l’écouta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui obéit ». L’expression hébraïque peut désigner une écoute attentive, mais, dans ce contexte royal, elle implique probablement l’obéissance.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: siégea
  rationale: Le verbe signifie littéralement « s’assit » ou « demeura »; avec un trône, « siégea » conserve l’image concrète tout en exprimant naturellement l’exercice de la royauté.
- source_word: כִּסֵּא יְהוָה
  choice: le trône de Yahweh
  rationale: La construction hébraïque est conservée afin de présenter la royauté davidique comme exercée sous l’autorité de Yahweh, sans réduire la formule à un simple titre politique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu.
- source_word: לְמֶלֶךְ
  choice: comme roi
  rationale: La préposition marque ici la fonction assumée par Salomon; « comme roi » l’exprime clairement en français.
- source_word: תַּחַת דָּוִיד אָבִיו
  choice: à la place de David, son père
  rationale: Dans un contexte de succession dynastique, תַּחַת indique le remplacement, et non une simple postériorité temporelle.
- source_word: וַיַּצְלַח
  choice: Il prospéra
  rationale: Le verbe exprime la réussite et la progression favorable. « Prospéra » reste concis et n’ajoute pas explicitement une cause que le verset ne formule pas.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: l’écouta
  rationale: Cette formulation rend directement l’idée d’écoute attentive tout en permettant, dans le contexte royal, la nuance d’obéissance signalée en note.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Expression collective habituelle désignant l’ensemble du peuple; l’accord au singulier est naturel en français.
theological_decisions:
- issue: Sens du « trône de Yahweh » dans la royauté de Salomon
  choice: Conserver la formule « le trône de Yahweh »
  alternative: Paraphraser comme un trône appartenant à Yahweh ou comme le simple trône politique de Salomon
  rationale: La formulation du Chroniste attribue une portée théologique à la royauté davidique, exercée sous l’autorité divine. La traduction la préserve sans préciser davantage la nature de cette représentation.
- issue: Portée de שׁמע אל dans la réponse d’Israël au roi
  choice: Traduire par « l’écouta » et signaler la nuance d’obéissance en note
  alternative: Traduire directement par « lui obéit »
  rationale: L’hébreu peut désigner l’écoute attentive ou l’obéissance. Le contexte royal favorise la seconde nuance, mais le texte principal garde l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. « Siégea » évite le caractère trop matériel de « s’assit » sans transformer explicitement la phrase en formule d’intronisation. Les phrases sont légèrement désenchaînées pour éviter une accumulation lourde de « et » en français, tout en conservant la progression du récit hébreu.
