source:
  edition: WLC
  text: לְ/ךָ֣ יְ֠הוָה הַ/גְּדֻלָּ֨ה וְ/הַ/גְּבוּרָ֤ה וְ/הַ/תִּפְאֶ֨רֶת֙ וְ/הַ/נֵּ֣צַח וְ/הַ/ה֔וֹד כִּי כֹ֖ל בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֑רֶץ לְ/ךָ֤ יְהוָה֙ הַ/מַּמְלָכָ֔ה וְ/הַ/מִּתְנַשֵּׂ֖א לְ/כֹ֥ל לְ/רֹֽאשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/011.yaml
  text: Yours[a], O Yahweh, are the greatness and the power and the splendor and the victory and the majesty, for everything in the heavens and on the earth is yours. Yours, O Yahweh, is the kingdom, and you are exalted as head over all.
translation:
  language: fr
  text: À toi, Yahweh, la grandeur, la puissance, la splendeur, la prééminence[a] et la majesté, car tout ce qui est dans le ciel et sur la terre est à toi. À toi, Yahweh, la royauté, et tu es élevé au-dessus de tout, comme chef.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la victoire » ou « la pérennité ». Le mot hébreu נֵצַח peut évoquer ici le triomphe, la prééminence durable ou la permanence.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, qui préserve sa présence explicite dans l’hébreu.
- source_word: לְךָ
  choice: À toi / est à toi
  rationale: Exprime l’appartenance tout en conservant l’emphase et la répétition de la tournure hébraïque.
- source_word: הַגְּדֻלָּה
  choice: la grandeur
  rationale: Équivalent direct et naturel de ce nom abstrait.
- source_word: הַגְּבוּרָה
  choice: la puissance
  rationale: Rend l’idée de force efficace ou de pouvoir dans cette série d’attributs royaux.
- source_word: הַתִּפְאֶרֶת
  choice: la splendeur
  rationale: Restitue la beauté glorieuse évoquée par le terme sans la confondre avec הוֹד.
- source_word: הַנֵּצַח
  choice: la prééminence
  rationale: Dans cette doxologie, le mot peut désigner une supériorité durable; ce choix conserve mieux sa largeur sémantique que le seul sens de victoire.
- source_word: הַהוֹד
  choice: la majesté
  rationale: Convient au cadre royal et distingue ce terme de תפארת, rendu par « splendeur ».
- source_word: כִּי כֹל בַּשָּׁמַיִם וּבָאָרֶץ
  choice: car tout ce qui est dans le ciel et sur la terre est à toi
  rationale: Comprend כִּי comme causal et explicite naturellement en français l’appartenance sous-entendue par le contexte.
- source_word: הַמַּמְלָכָה
  choice: la royauté
  rationale: Le contexte porte sur l’exercice et la dignité du pouvoir royal plutôt que sur un territoire; « royauté » rend cette nuance.
- source_word: וְהַמִּתְנַשֵּׂא
  choice: et tu t’élèves
  rationale: Le participe hitpael peut exprimer le fait de s’élever ou d’être élevé; la forme française conserve ici l’image dynamique sans ajouter un agent.
- source_word: לְכֹל לְרֹאשׁ
  choice: comme chef au-dessus de tout
  rationale: Préserve la métaphore de la tête comme autorité suprême et rend la portée universelle de כֹל.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte source emploie explicitement le tétragramme; « Yahweh » le représente comme nom propre sans lui substituer un titre.
- issue: Sens de נֵצַח dans la série doxologique
  choice: la prééminence
  alternative: la victoire / la pérennité
  rationale: Le terme est polysémique et difficile ici. « Prééminence » convient à la série d’attributs de souveraineté, tandis qu’une note préserve les autres lectures plausibles.
- issue: Valeur de הַמַּמְלָכָה
  choice: la royauté
  alternative: le royaume / la souveraineté
  rationale: Le passage célèbre la domination royale de Dieu; « royauté » maintient l’ambiguïté entre dignité royale et exercice du règne sans réduire le mot à un domaine territorial.
- issue: Voix et nuance de וְהַמִּתְנַשֵּׂא
  choice: tu t’élèves
  alternative: tu es élevé
  rationale: La forme hébraïque permet une nuance réfléchie ou médio-passive. Le choix retient la formulation active-réfléchie, sans nier la possibilité de la lecture stative indiquée par l’alternative.
translation_notes:
  register: Français international moderne, solennel et accessible. La répétition « À toi, Yahweh » conserve le rythme liturgique et l’emphase du texte hébreu; l’énumération garde sa structure cumulative.
