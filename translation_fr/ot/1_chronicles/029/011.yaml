  to: À toi, Yahweh, la grandeur, la puissance, la splendeur, la prééminence[a] et la majesté, car tout ce qui est dans le ciel et sur la terre est à toi. À toi, Yahweh, la royauté, et tu es élevé au-dessus de tout, comme chef.
