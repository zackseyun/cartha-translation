  naturalness: Le français est globalement solennel, clair et naturel. « Tu es élevé au-dessus de tout, comme chef » rend plus idiomatiquement et sans implication indue la dernière proposition.
  terminology: « Grandeur », « puissance », « splendeur », « majesté » et « royauté » conviennent bien au registre royal et liturgique. Yahweh est conservé de manière cohérente. La note sur נֵצַח préserve utilement les sens concurrents.
