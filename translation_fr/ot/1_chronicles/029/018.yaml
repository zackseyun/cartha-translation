source:
  edition: WLC
  text: יְהוָ֗ה אֱ֠לֹהֵי אַבְרָהָ֞ם יִצְחָ֤ק וְ/יִשְׂרָאֵל֙ אֲבֹתֵ֔י/נוּ שֳׁמְרָ/ה זֹּ֣את לְ/עוֹלָ֔ם לְ/יֵ֥צֶר מַחְשְׁב֖וֹת לְבַ֣ב עַמֶּ֑/ךָ וְ/הָכֵ֥ן לְבָבָ֖/ם אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/018.yaml
  text: O Yahweh[a], God of Abraham, Isaac, and Israel, our fathers, keep this forever in the intentions of the thoughts of the heart of your people[d][c][b], and direct their heart toward you.
translation:
  language: fr
  text: Ô Yahvé[a], Dieu d’Abraham, d’Isaac et d’Israël[b], nos pères, garde cela à jamais comme la disposition des pensées du cœur de ton peuple[c], et affermis leur cœur envers toi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte le nom divin YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: divine_name
  - marker: b
    text: L’hébreu dit « Israël », et non « Jacob ».
    reason: source_clarification
  - marker: c
    text: 'Formulation hébraïque difficile : « garde cela à jamais comme inclination des pensées du cœur de ton peuple ». Le terme traduit par « disposition » peut aussi signifier « inclination » ou « dessein ».'
    reason: ambiguity
  - marker: d
    text: 'Ou : « oriente leur cœur vers toi » ; le verbe peut exprimer l’idée d’établir, d’affermir ou de diriger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre; « Yahvé » est la forme française courante.
- source_word: אֱלֹהֵי
  choice: Dieu de
  rationale: Rend naturellement l’état construit qui rattache Dieu aux trois patriarches.
- source_word: אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל אֲבֹתֵינוּ
  choice: Abraham, Isaac et Israël, nos pères
  rationale: Conserve « Israël », effectivement présent dans l’hébreu, ainsi que le masculin אֲבֹתֵינוּ, qui désigne ici les patriarches.
- source_word: שֳׁמְרָה זֹּאת לְעוֹלָם
  choice: garde à jamais cette disposition
  rationale: « Garde » exprime la demande de préserver durablement; « cette disposition » reprend le démonstratif en explicitant sobrement son référent dans le contexte précédent.
- source_word: לְיֵצֶר מַחְשְׁבוֹת לְבַב עַמֶּךָ
  choice: dans les pensées du cœur de ton peuple
  rationale: Rend le domaine intérieur visé tout en conservant le langage biblique du cœur; l’idée de יֵצֶר est portée par « disposition », sans produire une chaîne nominale peu naturelle en français.
- source_word: וְהָכֵן
  choice: et affermis
  rationale: Le hifil de כון peut signifier établir, rendre ferme, préparer ou orienter; « affermis » convient à l’image du cœur tourné vers Dieu sans exclure la stabilité.
- source_word: לְבָבָם אֵלֶיךָ
  choice: leur cœur envers toi
  rationale: Préserve le singulier collectif hébreu et l’orientation relationnelle exprimée par אֵלֶיךָ.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme; sa transcription maintient le nom propre et le distingue du titre אֲדֹנָי.
- issue: Nom du troisième patriarche
  choice: Israël
  alternative: Jacob
  rationale: Le texte massorétique lit explicitement יִשְׂרָאֵל; la traduction ne l’harmonise pas avec une formule patriarcale plus familière.
- issue: Sens de וְהָכֵן appliqué au cœur
  choice: affermis leur cœur envers toi
  alternative: oriente leur cœur vers toi
  rationale: « Affermis » conserve le sens d’établissement propre à כון, tandis que le complément « envers toi » maintient l’orientation; la note signale l’autre nuance possible.
translation_notes:
  register: Français international moderne, digne et adapté à la prière. L’interjection « Ô » conserve l’adresse solennelle; le tutoiement suit l’usage biblique français courant. La syntaxe est légèrement lissée afin d’éviter l’enchaînement abstrait et peu idiomatique « inclination des pensées du cœur », tout en documentant cette structure dans la note.
