  text: וּֽ/כְ/כָל כֹּחִ֞/י הֲכִינ֣וֹתִי לְ/בֵית אֱלֹהַ֗/י הַ/זָּהָ֣ב לַ֠/זָּהָב וְ/הַ/כֶּ֨סֶף לַ/כֶּ֜סֶף וְ/הַ/נְּחֹ֣שֶׁת לַ/נְּחֹ֗שֶׁת הַ/בַּרְזֶל֙ לַ/בַּרְזֶ֔ל וְ/הָ/עֵצִ֖ים לָ/עֵצִ֑ים אַבְנֵי שֹׁ֨הַם וּ/מִלּוּאִ֜ים אַבְנֵי פ֣וּךְ וְ/רִקְמָ֗ה וְ/כֹ֨ל אֶ֧בֶן יְקָרָ֛ה וְ/אַבְנֵי שַׁ֖יִשׁ לָ/רֹֽב־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/002.yaml
  text: 'And with all my strength I have prepared for the house of my God: the gold for the things of gold[a], and the silver for the things of silver, and the bronze for the things of bronze, the iron for the things of iron, and the wood for the things of wood; onyx stones, settings, stones of antimony, variegated stones, every precious stone[d][c][b], and marble stones in abundance.'
translation:
  language: fr
  text: De toutes mes forces, j’ai préparé pour la maison de mon Dieu l’or destiné aux ouvrages en or, l’argent aux ouvrages en argent, le bronze aux ouvrages en bronze, le fer aux ouvrages en fer et le bois aux ouvrages en bois ; des pierres d’onyx[a], des éléments de sertissage[b], des pierres d’antimoine[c], des pierres multicolores[d], toutes les pierres précieuses et des pierres de marbre en abondance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte de plusieurs pierres mentionnées dans ce verset est incertaine. « Onyx » pour שֹׁהַם et « marbre » pour שַׁיִשׁ suivent des traductions traditionnelles, mais d’autres identifications ont été proposées.
    reason: lexical_alternative
  - marker: b
    text: Le terme מִלּוּאִים peut aussi désigner des montures, des incrustations ou des éléments de remplissage.
    reason: lexical_alternative
  - marker: c
    text: L’expression rendue par « pierres d’antimoine » est difficile. Elle peut désigner des pierres liées à un pigment sombre, des éléments d’incrustation décorative ou une autre matière ornementale.
    reason: lexical_alternative
  - marker: d
    text: « Pierres multicolores » traduit רִקְמָה en fonction de cette liste de pierres et de matériaux. Ailleurs, le mot peut désigner un ouvrage brodé ou richement ouvragé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכָל כֹּחִי
  choice: De toutes mes forces
  rationale: Cette expression française naturelle rend l’idée que David a mobilisé toute sa force et tous ses moyens, sans réduire כֹּחַ à la seule capacité matérielle.
- source_word: הֲכִינוֹתִי
  choice: j’ai préparé
  rationale: Le passé composé exprime une action accomplie dont le résultat demeure pertinent au moment du discours.
- source_word: לְבֵית אֱלֹהַי
  choice: pour la maison de mon Dieu
  rationale: « Maison » conserve l’expression hébraïque et sa dimension personnelle ; « temple » serait une explicitation contextuelle.
- source_word: הַזָּהָב לַזָּהָב
  choice: l’or destiné aux ouvrages en or
  rationale: La répétition du matériau avec ל indique vraisemblablement son affectation aux objets fabriqués dans ce matériau. « Ouvrages » explicite sobrement ce rapport en français.
- source_word: וְהַכֶּסֶף לַכֶּסֶף
  choice: l’argent aux ouvrages en argent
  rationale: La formulation poursuit le parallélisme des matériaux tout en évitant une répétition française trop lourde de « destiné ».
- source_word: וְהַנְּחֹשֶׁת לַנְּחֹשֶׁת
  choice: le bronze aux ouvrages en bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze ; « bronze » convient bien au contexte des objets et aménagements du sanctuaire.
- source_word: הַבַּרְזֶל לַבַּרְזֶל
  choice: le fer aux ouvrages en fer
  rationale: Cette traduction maintient la structure répétitive et l’idée d’une matière réservée aux ouvrages correspondants.
- source_word: וְהָעֵצִים לָעֵצִים
  choice: le bois aux ouvrages en bois
  rationale: « Bois » conserve l’étendue de עֵצִים, tandis qu’« ouvrages » rend l’usage auquel le matériau est destiné.
- source_word: אַבְנֵי שֹׁהַם
  choice: des pierres d’onyx
  rationale: « Onyx » est l’identification traditionnelle de שֹׁהַם, mais l’incertitude minéralogique est signalée en note.
- source_word: וּמִלּוּאִים
  choice: des éléments de sertissage
  rationale: Le terme désigne probablement des éléments destinés à la pose ou à l’incrustation de pierres. Cette formulation française laisse ouverte la nature exacte de ces éléments.
- source_word: אַבְנֵי פוּךְ
  choice: des pierres d’antimoine
  rationale: פּוּךְ désigne habituellement l’antimoine ou un pigment sombre qui en est tiré. La traduction reste proche de la construction hébraïque sans préciser abusivement l’usage de ces pierres.
- source_word: וְרִקְמָה
  choice: des pierres multicolores
  rationale: רִקְמָה évoque ailleurs un travail bigarré ou brodé ; dans cette liste de pierres et de matériaux, des pierres aux couleurs variées constituent une interprétation contextuelle plausible, signalée en note.
- source_word: וְאַבְנֵי שַׁיִשׁ לָרֹב
  choice: et des pierres de marbre en abondance
  rationale: « Marbre » suit l’identification traditionnelle de שַׁיִשׁ ; « en abondance » rend directement לָרֹב.
