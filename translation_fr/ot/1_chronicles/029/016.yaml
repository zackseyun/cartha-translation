  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ כֹ֣ל הֶ/הָמ֤וֹן הַ/זֶּה֙ אֲשֶׁ֣ר הֲכִינֹ֔נוּ לִ/בְנֽוֹת לְ/ךָ֥ בַ֖יִת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ מִ/יָּדְ/ךָ֥ היא וּ/לְ/ךָ֥ הַ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/016.yaml
  text: O Yahweh our God[a], all this abundance that we have prepared to build you a house for your holy name is from your hand[c][b], and all things are yours.
translation:
  language: fr
  text: Ô Yahweh, notre Dieu, toute cette abondance que nous avons préparée pour te bâtir une maison pour ton saint nom vient de ta main, et tout est à toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, notre Dieu
  rationale: Le nom divin est transcrit « Yahweh », et אֱלֹהֵינוּ est naturellement rendu au singulier par « notre Dieu » dans cette invocation.
- source_word: כֹל הֶהָמוֹן הַזֶּה
  choice: toute cette abondance
  rationale: הָמוֹן désigne ici la grande quantité de richesses et de matériaux réunis pour la maison de Dieu; « abondance » conserve cette ampleur sans suggérer une foule.
- source_word: אֲשֶׁר הֲכִינֹנוּ
  choice: que nous avons préparée
  rationale: Le parfait exprime une préparation accomplie dont le résultat est présent; le participe passé s’accorde avec « abondance ».
- source_word: לִבְנוֹת לְךָ בַיִת
  choice: pour te bâtir une maison
  rationale: Cette formulation française naturelle conserve בַיִת, « maison », plutôt que de l’expliciter par « temple ».
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: en l’honneur de ton saint nom
  rationale: La préposition לְ marque ici la destination ou la dédicace. « En l’honneur de » rend clairement la maison consacrée au nom divin sans effacer la mention du nom.
- source_word: מִיָּדְךָ הִיא
  choice: vient de ta main
  rationale: Littéralement « elle est de ta main »; « vient de ta main » restitue naturellement en français l’origine divine tout en gardant l’image de la main.
- source_word: וּלְךָ הַכֹּל
  choice: et tout est à toi
  rationale: La formule concise préserve l’étendue potentiellement absolue de הַכֹּל et exprime directement l’appartenance.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Portée de וּלְךָ הַכֹּל
  choice: tout est à toi
  alternative: tout cela est à toi
  rationale: L’hébreu הַכֹּל peut viser tout ce qui vient d’être mentionné ou prendre une portée plus générale. « Tout est à toi » conserve cette ouverture sans la restreindre aux seuls matériaux.
translation_notes:
  register: Français international moderne, digne et accessible. L’invocation « Ô Yahweh » garde le ton solennel de la prière. La syntaxe reste proche de l’hébreu tout en étant fluide; « maison » maintient l’image biblique sans remplacer le terme par « temple ».
