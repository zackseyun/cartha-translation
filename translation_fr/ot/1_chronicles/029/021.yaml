  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּזְבְּח֣וּ לַ/יהוָ֣ה זְ֠בָחִים וַ/יַּעֲל֨וּ עֹל֜וֹת לַ/יהוָ֗ה לְֽ/מָחֳרַת֮ הַ/יּ֣וֹם הַ/הוּא֒ פָּרִ֨ים אֶ֜לֶף אֵילִ֥ים אֶ֛לֶף כְּבָשִׂ֥ים אֶ֖לֶף וְ/נִסְכֵּי/הֶ֑ם וּ/זְבָחִ֥ים לָ/רֹ֖ב לְ/כָל יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/021.yaml
  text: 'They sacrificed sacrifices to Yahweh and offered up burnt offerings to Yahweh on the next day after that day: one thousand bulls[a], one thousand rams, one thousand lambs, and their drink offerings[c][b], and sacrifices in abundance for all Israel.'
translation:
  language: fr
  text: 'Ils offrirent des sacrifices à Yahweh et présentèrent des holocaustes à Yahweh le lendemain de ce jour-là[a] : mille taureaux, mille béliers, mille agneaux, avec les libations[b] qui les accompagnaient, ainsi que des sacrifices en abondance pour tout Israël[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus simplement : « le lendemain ». L’hébreu dit littéralement « le lendemain de ce jour-là ».'
    reason: lexical_alternative
  - marker: b
    text: Les « libations » étaient des offrandes liquides versées avec les sacrifices d’animaux.
    reason: cultural_note
  - marker: c
    text: 'Ou : « au nom de tout Israël ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְבְּחוּ ... זְבָחִים
  choice: Ils offrirent des sacrifices
  rationale: Le verbe זבח et le nom apparenté désignent ici l’acte sacrificiel. Une reproduction littérale du groupe apparenté serait lourde en français; « offrirent des sacrifices » en restitue naturellement le sens cultuel.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition marque le destinataire ou la dédicace des offrandes. Le nom divin יהוה est transcrit « Yahweh ».
- source_word: וַיַּעֲלוּ עֹלוֹת
  choice: présentèrent des holocaustes
  rationale: עֹלוֹת désigne des sacrifices entièrement consumés sur l’autel. « Holocaustes » est le terme cultuel français établi, tandis que « présentèrent » rend idiomatiquement l’action d’offrir sans répéter le même verbe.
- source_word: לְמָחֳרַת הַיּוֹם הַהוּא
  choice: le lendemain de ce jour-là
  rationale: Cette formulation conserve l’expression temporelle légèrement appuyée de l’hébreu tout en restant compréhensible en français moderne.
- source_word: פָּרִים אֶלֶף
  choice: mille taureaux
  rationale: פָּרִים désigne ici des bovins mâles destinés au sacrifice; « taureaux » est précis et naturel.
- source_word: אֵילִים אֶלֶף
  choice: mille béliers
  rationale: אֵילִים désigne spécifiquement des béliers.
- source_word: כְּבָשִׂים אֶלֶף
  choice: mille agneaux
  rationale: Dans ce contexte sacrificiel, כְּבָשִׂים désigne naturellement de jeunes ovins, rendus par « agneaux ».
- source_word: וְנִסְכֵּיהֶם
  choice: avec les libations qui les accompagnaient
  rationale: Les נְסָכִים sont des offrandes liquides versées en accompagnement des animaux offerts. L’explicitation légère du pronom évite en français toute ambiguïté sur leur fonction.
- source_word: וּזְבָחִים לָרֹב
  choice: ainsi que des sacrifices en abondance
  rationale: לָרֹב exprime une quantité considérable; la phrase semble mentionner d’autres sacrifices en plus des holocaustes dénombrés.
- source_word: לְכָל יִשְׂרָאֵל
  choice: pour tout Israël
  rationale: Le français « pour » préserve la portée large de לְ sans imposer l’interprétation plus précise d’une action représentative ou substitutive.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte explicitement le tétragramme. La transcription « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Portée de לְכָל יִשְׂרָאֵל
  choice: pour tout Israël
  alternative: au nom de tout Israël
  rationale: La préposition peut exprimer le bénéfice, la destination ou la portée représentative. « Pour » maintient cette souplesse et n’introduit pas une théorie sacrificielle plus déterminée que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la distinction entre les sacrifices ordinaires et les holocaustes, ainsi que l’insistance temporelle de l’hébreu, tout en évitant un calque maladroit du groupe verbal apparenté זבח—זבחים.
