  terminology: « Yahweh » correspond au traitement demandé du tétragramme. « Sacrifices », « holocaustes », « libations », « taureaux », « béliers » et « agneaux » sont précis et cohérents. « Pour tout Israël » préserve la souplesse de לְכָל־יִשְׂרָאֵל; la note « au nom de tout Israël » est présentée comme une possibilité, non comme une interprétation imposée.
