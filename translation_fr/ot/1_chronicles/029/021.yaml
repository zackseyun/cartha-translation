  source_fidelity: Le texte rend fidèlement la succession des deux catégories d’offrandes (זְבָחִים puis עֹלוֹת), la formule temporelle emphatique, les trois groupes de mille animaux, les libations qui leur sont associées, et l’abondance des autres sacrifices pour tout Israël. « Avec les libations qui les accompagnaient » explicite de façon sobre le pronom de וְנִסְכֵּיהֶם sans en modifier le sens.
