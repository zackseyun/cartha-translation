  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֤ר מָלַךְ֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֥ם מָלַ֖ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/027.yaml
  text: The days that he reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: fr
  text: La durée de son règne sur Israël fut de quarante ans. Il régna sept ans à Hébron et trente-trois ans à Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: La durée de son règne
  rationale: L’expression hébraïque signifie littéralement « les jours pendant lesquels il régna ». En français moderne, « la durée de son règne » en restitue naturellement le sens temporel sans lourdeur.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: Avec le verbe מָלַךְ, la préposition עַל désigne le peuple sur lequel s’exerce le règne. Le texte ne comporte pas ici le mot « tout ».
- source_word: אַרְבָּעִים שָׁנָה
  choice: quarante ans
  rationale: Rendu français normal du nombre suivi du nom hébreu au singulier collectif.
- source_word: בְּחֶבְרוֹן מָלַךְ שֶׁבַע שָׁנִים
  choice: Il régna sept ans à Hébron
  rationale: Le verbe royal est rendu par « régner » et la localisation par « à », préposition idiomatique devant un nom de ville en français.
- source_word: וּבִירוּשָׁלִַם מָלַךְ שְׁלֹשִׁים וְשָׁלוֹשׁ
  choice: et trente-trois ans à Jérusalem
  rationale: Le second verbe, explicite en hébreu, reste aisément sous-entendu dans la coordination française; cette formulation conserve le parallélisme tout en évitant une répétition pesante.
