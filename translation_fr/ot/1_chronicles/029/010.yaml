  text: וַ/יְבָ֤רֶךְ דָּוִיד֙ אֶת יְהוָ֔ה לְ/עֵינֵ֖י כָּל הַ/קָּהָ֑ל וַ/יֹּ֣אמֶר דָּוִ֗יד בָּר֨וּךְ אַתָּ֤ה יְהוָה֙ אֱלֹהֵי֙ יִשְׂרָאֵ֣ל אָבִ֔י/נוּ מֵ/עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/010.yaml
  text: Then David blessed Yahweh in the sight of all the assembly[a], and David said, “Blessed are you, Yahweh, the God of Israel our father, from everlasting to everlasting.”
translation:
  language: fr
  text: 'Alors David bénit Yahweh sous les yeux de toute l’assemblée, et David dit : « Béni sois-tu, Yahweh, le Dieu de notre père Israël[a], d’éternité en éternité ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Dieu d’Israël, notre Père », si « notre Père » s’adresse directement à Dieu plutôt que de désigner Israël, c’est-à-dire Jacob.'
    reason: Lecture syntaxique alternative de אָבִינוּ.
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: bénit
  rationale: Le piel de ברך ayant Dieu pour objet désigne une bénédiction exprimée comme louange. « Bénit » conserve en outre le lien lexical avec בָּרוּךְ dans la parole qui suit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel au lieu de lui substituer un titre.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Cette expression française naturelle conserve l’image visuelle et le caractère public de l’expression hébraïque.
- source_word: כָּל הַקָּהָל
  choice: toute l’assemblée
  rationale: קָהָל désigne ici la communauté réunie ; « assemblée » convient au cadre public et solennel.
- source_word: בָּרוּךְ אַתָּה
  choice: Béni sois-tu
  rationale: Formule française idiomatique de bénédiction adressée directement à Dieu, avec une tonalité doxologique.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la chaîne construite hébraïque ; l’article défini est naturel en français dans cette apposition.
- source_word: אָבִינוּ
  choice: notre père
  rationale: Le suffixe est à la première personne du pluriel. Dans la lecture retenue, l’expression qualifie Israël/Jacob comme ancêtre du peuple, tout en conservant dans une note l’autre analyse syntaxique possible.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: depuis toujours et pour toujours
  rationale: Formulation française actuelle et solennelle exprimant une durée sans limite vers le passé comme vers l’avenir.
theological_decisions:
- issue: Référent de « notre père » dans אֱלֹהֵי יִשְׂרָאֵל אָבִינוּ
  choice: '« notre père » renvoie à Israël/Jacob : « le Dieu d’Israël notre père »'
  alternative: 'Comprendre « notre Père » comme une adresse apposée à Dieu : « Dieu d’Israël, notre Père »'
  rationale: L’enchaînement hébreu permet de rattacher אָבִינוּ à Israël, nom patriarcal de Jacob. La formulation principale préserve cette lecture sans supprimer l’autre possibilité, signalée en note.
translation_notes:
  register: Français international moderne, digne et liturgique sans archaïsme marqué. « Sous les yeux de » maintient l’image hébraïque ; « depuis toujours et pour toujours » rend l’ampleur temporelle de la doxologie dans une langue courante.
