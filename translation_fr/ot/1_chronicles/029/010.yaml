- from: 'Alors David bénit Yahweh sous les yeux de toute l’assemblée, et il dit : « Béni sois-tu, Yahweh, le Dieu d’Israël notre père[a], depuis toujours et pour toujours ! »'
  to: 'Alors David bénit Yahweh sous les yeux de toute l’assemblée, et David dit : « Béni sois-tu, Yahweh, le Dieu de notre père Israël[a], d’éternité en éternité ! »'
  rationale: La révision clarifie en français la lecture principale attestée dans le dossier — Israël/Jacob comme père ancestral — sans éliminer l’analyse alternative dans laquelle Dieu est appelé « notre Père ». Elle améliore aussi la correspondance de la formule temporelle avec l’hébreu, tout en maintenant un français international moderne et un ton de louange.
