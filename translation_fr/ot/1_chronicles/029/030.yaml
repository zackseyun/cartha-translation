  text: along with all his reign and his might[b][a], and the times that passed over him and over Israel and over all the kingdoms of the lands.
translation:
  language: fr
  text: avec tout son règne et sa puissance, ainsi que les événements qui lui sont arrivés[a], à Israël et à tous les royaumes des pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les temps qui sont passés sur lui »; ou « les circonstances qui lui sont survenues ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tous les royaumes des différentes contrées ». Le texte hébreu emploie le pluriel « pays » ou « terres », probablement à propos des territoires ou nations environnants.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִם
  choice: avec
  rationale: La préposition associe ces éléments au récit mentionné dans le verset précédent; « avec » convient naturellement à cette phrase qui se poursuit depuis le contexte.
- source_word: מַלְכוּתוֹ
  choice: son règne
  rationale: Dans ce résumé de la vie de David, le nom désigne plus probablement l’exercice et la durée de sa royauté que son territoire.
- source_word: גְבוּרָתוֹ
  choice: sa puissance
  rationale: Le terme peut évoquer la force, la vaillance ou les hauts faits. « Puissance » conserve ici sa portée générale sans le limiter à des exploits particuliers.
- source_word: הָעִתִּים
  choice: les temps
  rationale: Ce rendu direct préserve la formulation globale, qui embrasse les périodes et les circonstances de la vie de David et de l’histoire environnante.
- source_word: אֲשֶׁר עָבְרוּ עָלָיו
  choice: qui ont passé sur lui
  rationale: La traduction garde l’image hébraïque des temps qui « passent sur » quelqu’un, tout en signalant en note une formulation française plus explicite.
- source_word: וְעַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: La répétition de « sur » maintient le parallélisme de l’hébreu entre David, Israël et les royaumes.
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: tous les royaumes des pays
  rationale: Le pluriel « pays » respecte le pluriel hébreu et renvoie vraisemblablement aux territoires ou nations environnants, plutôt qu’à la terre entière.
