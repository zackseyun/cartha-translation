id: 1CH.29.13
reference: 1 Chronicles 29:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱלֹהֵ֔י/נוּ מוֹדִ֥ים אֲנַ֖חְנוּ לָ֑/ךְ וּֽ/מְהַֽלְלִ֖ים לְ/שֵׁ֥ם תִּפְאַרְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/013.yaml
  text: And now[a], our God, we give thanks to you and praise the name of your glory.
translation:
  language: fr
  text: Et maintenant, notre Dieu, nous te rendons grâce et nous louons ton nom glorieux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le nom de ta gloire ».'
    reason: La note préserve la construction nominale hébraïque לְשֵׁם תִּפְאַרְתֶּךָ, rendue de façon plus idiomatique dans le texte principal.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la liaison exprimée par וְ et la valeur temporelle et discursive de עַתָּה dans le déroulement de la prière.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement le nom avec le suffixe de première personne du pluriel, sans ajouter une particule vocative absente de l’hébreu.
- source_word: מוֹדִים אֲנַחְנוּ לָךְ
  choice: nous te rendons grâce
  rationale: Dans ce contexte cultuel, le hifil de ידה exprime l’action de remercier Dieu ou de lui rendre grâce. Cette formulation convient au registre de la prière et maintient la distinction avec le verbe suivant, « louer ».
- source_word: וּמְהַלְלִים
  choice: et nous louons
  rationale: Le participe piel de הלל désigne ici la louange. La reprise explicite de « nous » produit une coordination naturelle en français.
- source_word: לְשֵׁם תִּפְאַרְתֶּךָ
  choice: ton nom glorieux
  rationale: Cette formulation française naturelle conserve le motif biblique du « nom » tout en rendant la construction nominale hébraïque, littéralement « le nom de ta gloire », par un adjectif.
theological_decisions:
- issue: Forme de l’adresse à Dieu
  choice: notre Dieu
  alternative: ô notre Dieu
  rationale: La prière s’adresse directement à Dieu, mais l’hébreu ne comporte aucune particule imposant « ô ». La formulation retenue reste actuelle et digne sans ajouter une solennité archaïsante.
- issue: Expression théologique du « nom » et de la gloire
  choice: nous louons ton nom glorieux
  alternative: nous louons le nom de ta gloire
  rationale: Le « nom » est maintenu en raison de son importance dans le langage biblique de la louange. L’adjectif « glorieux » rend naturellement תִּפְאַרְתֶּךָ sans réduire l’expression à une simple louange adressée à Dieu pour sa gloire; la construction hébraïque plus formelle est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne, avec un registre de prière naturel. Le tutoiement correspond à l’adresse divine au singulier dans le texte hébreu et à l’usage courant des traductions bibliques françaises contemporaines.
