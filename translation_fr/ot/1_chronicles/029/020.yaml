base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/020.yaml
  text: Then David said to all the assembly, “Now bless Yahweh your God.” And all the assembly blessed Yahweh, the God of their fathers, and bowed their heads and prostrated themselves before Yahweh and before the king.
translation:
  language: fr
  text: 'Puis David dit à toute l’assemblée : « Bénissez donc[a] Yahvé, votre Dieu. » Toute l’assemblée bénit Yahvé, le Dieu de leurs pères, puis s’inclina et se prosterna devant Yahvé et devant le roi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je vous en prie, bénissez Yahvé, votre Dieu. » La particule נָא peut exprimer l’insistance, l’exhortation ou la prière.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit que les membres de l’assemblée se prosternèrent « devant Yahvé et devant le roi ». Il décrit un geste corporel d’hommage sans préciser que l’honneur rendu à chacun était de même nature.
    reason: theological_tension
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: Bénissez donc
  rationale: L’impératif בָּרְכוּ appelle l’assemblée à bénir Dieu, c’est-à-dire à proclamer sa louange. La particule נָא ajoute ici une nuance d’insistance ou d’exhortation, rendue naturellement par « donc ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française courante « Yahvé » préserve le nom divin exprimé par le tétragramme au lieu de lui substituer un titre.
- source_word: הַקָּהָל
  choice: l’assemblée
  rationale: קָהָל désigne ici l’ensemble du peuple réuni; « assemblée » convient au contexte public et cultuel.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: le Dieu de leurs pères
  rationale: Cette formulation conserve l’expression généalogique et historique masculine du texte hébreu, tout en restant intelligible en français contemporain.
- source_word: וַיִּקְּדוּ
  choice: Ils s’inclinèrent
  rationale: קדד décrit un mouvement d’inclination. Cette formulation n’ajoute pas explicitement « la tête », absente du texte, et distingue ce geste de la prosternation exprimée ensuite.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: se prosternèrent
  rationale: Le verbe désigne concrètement le fait de se courber jusqu’à terre ou de se prosterner. Le rendu corporel évite de traduire d’emblée par « adorer », puisque Yahvé et le roi sont tous deux introduits comme objets du geste.
- source_word: לַיהוָה וְלַמֶּלֶךְ
  choice: devant Yahvé et devant le roi
  rationale: Avec le verbe de prosternation, « devant » est idiomatique en français. Sa répétition rend clairement les deux compléments sans décider que l’honneur rendu à chacun était de même nature.
theological_decisions:
- issue: Le geste du peuple est dirigé à la fois vers Yahvé et vers le roi
  choice: 'Conserver le langage corporel commun : « se prosternèrent devant Yahvé et devant le roi »'
  alternative: « adorèrent Yahvé et rendirent hommage au roi »
  rationale: L’hébreu emploie le même verbe et la même construction pour les deux compléments. La traduction ne sépare donc pas artificiellement les gestes, mais n’emploie pas non plus « adorer », qui pourrait laisser entendre que le roi reçoit un culte divin.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases sont légèrement segmentées pour une lecture naturelle. « Yahvé » conserve le nom divin; « bénir », « assemblée » et « se prosterner » maintiennent le registre biblique sans archaïsme marqué.
