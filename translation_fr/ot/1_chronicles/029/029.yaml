base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/029.yaml
  text: The acts of David the king[a], the former and the latter, are written in the records of Samuel the seer, and in the records of Nathan the prophet[c][b], and in the records of Gad the seer.
translation:
  language: fr
  text: Les actes du roi David[a], les premiers et les derniers, sont consignés dans les écrits de Samuel le voyant[b], dans les écrits de Nathan le prophète et dans les écrits de Gad le voyant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les paroles » ou « les affaires du roi David, les premières et les dernières ». Ici, l’expression désigne les actes ou les événements de son règne.'
    reason: lexical_alternative
  - marker: b
    text: Les titres hébreux rendus par « voyant » pour Samuel et Gad sont deux termes distincts (רֹאֶה et חֹזֶה). Ils désignent tous deux ici une fonction prophétique ; « visionnaire » est une autre possibilité pour le second, mais est moins usuel comme titre biblique en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי דָּוִיד הַמֶּלֶךְ
  choice: les actes du roi David
  rationale: Dans ce résumé royal, דִּבְרֵי désigne les faits ou les actes qui ont marqué le règne de David, plutôt que ses seules paroles.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: des premiers aux derniers
  rationale: Cette paire embrasse l’ensemble des actes de David dans leur succession, tout en restant proche de la formulation hébraïque.
- source_word: הִנָּם כְּתוּבִים
  choice: sont consignés
  rationale: « Sont consignés » exprime naturellement l’idée d’une mise par écrit et rend inutile une traduction lourde de la particule déictique הִנָּם.
- source_word: עַל דִּבְרֵי שְׁמוּאֵל / נָתָן / גָּד
  choice: dans les écrits de Samuel / Nathan / Gad
  rationale: Dans ce contexte documentaire, « écrits » rend le sens de sources écrites sans préciser indûment leur genre littéraire; « dans » est idiomatique en français avec « consignés ».
- source_word: הָרֹאֶה
  choice: le voyant
  rationale: « Voyant » est le titre prophétique français usuel pour רֹאֶה.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Équivalent français courant et précis du titre נָבִיא.
- source_word: הַחֹזֶה
  choice: le visionnaire
  rationale: « Visionnaire » préserve dans le texte français la distinction lexicale entre חֹזֶה et רֹאֶה, sans nier la proximité fonctionnelle des deux titres.
theological_decisions:
- issue: Distinction entre les titres prophétiques רֹאֶה et חֹזֶה
  choice: Traduire רֹאֶה par « voyant » et חֹזֶה par « visionnaire »
  alternative: Traduire les deux titres par « voyant »
  rationale: L’hébreu emploie deux termes différents. Le français permet de conserver cette nuance de manière compréhensible, sans attribuer aux titres une différence doctrinale que le verset n’explicite pas.
translation_notes:
  register: 'Français international moderne, clair et digne. La formulation conserve la structure récapitulative du verset et distingue les trois titres: voyant, prophète et visionnaire.'
