base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/024.yaml
  text: And Shebaniah[a], Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer the priests were blowing the trumpets before the ark of God[c][b], and Obed-edom and Jehiah were gatekeepers for the ark.
translation:
  language: fr
  text: Les prêtres Shebania, Josaphat, Netanel, Amasaï, Zacharie, Benaya et Éliézer sonnaient des trompettes[a] devant l’arche de Dieu. Obed-Édom et Yehia étaient portiers auprès de l’arche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne souvent les trompettes droites employées par les prêtres dans le culte.
    reason: cultural_note
  - marker: b
    text: Ou « les gardiens de l’arche ». Le terme hébreu signifie habituellement « portiers » ou « gardiens des portes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Les prêtres
  rationale: L’article défini présente les hommes énumérés comme prêtres. Placer cette désignation avant les noms donne une phrase française claire sans modifier leur fonction.
- source_word: מחצצרים
  choice: sonnaient
  rationale: Le participe exprime une action en cours dans le cadre de la procession. « Sonnaient » est naturel en français pour l’action de jouer de la trompette.
- source_word: בַּחֲצֹצְרוֹת
  choice: des trompettes
  rationale: Le terme désigne les trompettes droites associées au service sacerdotal. Le texte de ce verset ne précise pas qu’elles sont en argent.
- source_word: לִפְנֵי
  choice: devant
  rationale: Rend directement la position des prêtres par rapport à l’arche dans la procession.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Traduction directe et idiomatique du groupe construit hébreu.
- source_word: שֹׁעֲרִים
  choice: les portiers
  rationale: Le mot désigne habituellement des personnes chargées de garder un accès dans un contexte sacré. « Portiers » conserve cette fonction institutionnelle, même si son application à l’arche est inhabituelle.
- source_word: לָאָרוֹן
  choice: affectés à l’arche
  rationale: Le lamed indique ici vraisemblablement la charge ou le domaine de responsabilité. Cette formulation française conserve le lien fonctionnel sans imaginer une porte appartenant à l’arche.
- source_word: וְעֹבֵד אֱדֹם
  choice: Obed-Édom
  rationale: Translittération française usuelle du nom propre, avec un trait d’union qui en rend les deux éléments lisibles.
- source_word: וִיחִיָּה
  choice: Yehia
  rationale: Translittération française transparente du nom hébreu, qui évite de donner au yod initial une valeur consonantique étrangère au texte source.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La syntaxe a été divisée en deux phrases pour alléger la longue coordination hébraïque. Les noms sont translittérés selon des formes accessibles en français, et l’expression inhabituelle « portiers affectés à l’arche » est conservée avec une note plutôt que résolue silencieusement.
