revisions:
- from: Les fils des Lévites portèrent l’arche de Dieu sur leurs épaules, au moyen des barres qui reposaient sur elles[a], exactement comme Moïse l’avait ordonné, conformément à la parole de Yahweh.
  to: Les fils des Lévites portèrent l’arche de Dieu sur leurs épaules, à l’aide des barres qui y reposaient, comme Moïse l’avait ordonné, conformément à la parole de Yahweh.
  rationale: La révision retire une intensification interprétative mineure et rend plus explicite, dans un français fluide, le fait que les barres reposaient sur les épaules des porteurs. Elle ne modifie ni le sens ni l’ambiguïté syntaxique limitée de l’hébreu.
