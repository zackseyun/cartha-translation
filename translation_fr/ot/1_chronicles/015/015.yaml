    reason: Alternative formelle pour la construction « avec les barres sur eux » ; la note explicite le rapport des barres aux épaules des porteurs.
  revision_rationale: La révision retire une intensification interprétative mineure et rend plus explicite, dans un français fluide, le fait que les barres reposaient sur les épaules des porteurs. Elle ne modifie ni le sens ni l’ambiguïté syntaxique limitée de l’hébreu.
