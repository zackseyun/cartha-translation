base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/015.yaml
  text: And the sons of the Levites carried the ark of God on their shoulders with the poles upon them[a], just as Moses had commanded according to the word of Yahweh.
translation:
  language: fr
  text: Les fils des Lévites portèrent l’arche de Dieu sur leurs épaules, à l’aide des barres qui y reposaient, comme Moïse l’avait ordonné, conformément à la parole de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: portèrent
  rationale: Dans ce contexte narratif, נשׂא désigne le transport de l’arche, et non le seul fait de la soulever. « Portèrent » est naturel et précis en français.
- source_word: בְנֵי הַלְוִיִּם
  choice: les fils des Lévites
  rationale: Cette formulation conserve l’expression filiale et tribale explicite de l’hébreu, plutôt que de la réduire à « les Lévites ».
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Le texte dit uniquement « l’arche de Dieu » ; ajouter « de l’alliance » introduirait un élément absent de ce verset.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: exactement comme Moïse l’avait ordonné
  rationale: כַּאֲשֶׁר exprime ici la conformité. Le plus-que-parfait situe naturellement l’ordre de Moïse avant son exécution.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole de Yahweh
  rationale: Cette traduction préserve le sens littéral de דָּבָר, « parole », ainsi que le lien entre l’ordre donné par Moïse et l’instruction divine.
- source_word: בִּכְתֵפָם
  choice: sur leurs épaules
  rationale: La formule rend clairement le lieu d’appui et la manière de porter l’arche.
- source_word: בַּמֹּטוֹת עֲלֵיהֶם
  choice: au moyen des barres qui reposaient sur elles
  rationale: La préposition בְּ indique ici le moyen, tandis que עֲלֵיהֶם précise que les barres étaient sur les porteurs, concrètement sur leurs épaules. La formulation française explicite ce rapport sans changer l’image.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom divin sans le remplacer par un titre.
- issue: Désignation tribale genrée בְנֵי הַלְוִיִּם
  choice: les fils des Lévites
  alternative: les Lévites
  rationale: L’hébreu emploie explicitement une expression masculine et filiale. La conserver évite d’aplanir la forme du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. « Arche », « Lévites » et « Yahweh » conservent le vocabulaire biblique nécessaire ; la syntaxe reste fluide sans effacer la précision du texte hébreu.
