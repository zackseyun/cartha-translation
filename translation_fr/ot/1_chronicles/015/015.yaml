    issue: Intensification non nécessaire dans « exactement comme Moïse l’avait ordonné »
    rationale: כַּאֲשֶׁר exprime la conformité (« comme / ainsi que ») sans exiger l’adverbe « exactement », qui renforce légèrement l’énoncé français.
  - severity: low
    issue: Référent des barres à clarifier dans la formulation et dans la note
    rationale: Le pronom « elles » peut se comprendre comme renvoyant aux épaules, mais « y » rend ce rattachement plus direct. La note peut expliciter que le pronom hébreu vise les porteurs dans le cadre concret de leurs épaules.
  revised_text: Les fils des Lévites portèrent l’arche de Dieu sur leurs épaules, à l’aide des barres qui y reposaient, comme Moïse l’avait ordonné, conformément à la parole de Yahweh.
