  yaml_path: translation/ot/1_chronicles/015/023.yaml
  text: Berechiah and Elkanah were gatekeepers for the ark[a].
translation:
  language: fr
  text: Bérékia et Elqana étaient portiers auprès de l’arche[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « portiers chargés de l’arche ». La préposition hébraïque peut indiquer soit leur affectation à l’arche, soit leur emplacement auprès d’elle.
    reason: alternative lexicale
lexical_decisions:
- source_word: בֶּרֶכְיָה
  choice: Bérékia
  rationale: Nom propre translittéré selon une forme française claire et proche de l’hébreu.
- source_word: אֶלְקָנָה
  choice: Elqana
  rationale: Nom propre translittéré selon une convention française qui représente distinctement la consonne hébraïque ק par « q ».
- source_word: שֹׁעֲרִים
  choice: portiers
  rationale: Le terme désigne les personnes chargées de surveiller un accès. « Portiers » est naturel dans ce contexte cultuel et plus précis que « gardes ».
- source_word: לָאָרוֹן
  choice: auprès de l’arche
  rationale: La préposition ל peut exprimer ici soit l’affectation, soit la proximité. « Auprès de l’arche » convient naturellement au rôle de portiers tout en laissant perceptible la nuance locale.
- source_word: וְ
  choice: et
  rationale: Conjonction française habituelle reliant les deux noms propres.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. La formulation conserve l’ambiguïté de la préposition hébraïque entre affectation et localisation.
