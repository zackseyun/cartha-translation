  text: וַ/יְהִ֥י דָוִ֛יד וְ/זִקְנֵ֥י יִשְׂרָאֵ֖ל וְ/שָׂרֵ֣י הָ/אֲלָפִ֑ים הַ/הֹֽלְכִ֗ים לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מִן בֵּ֥ית עֹבֵֽד אֱדֹ֖ם בְּ/שִׂמְחָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/025.yaml
  text: So David, and the elders of Israel, and the commanders of the thousands went to bring up the ark of the covenant of Yahweh from the house of Obed-edom with joy.
translation:
  language: fr
  text: David, les anciens d’Israël et les chefs de milliers se rendirent donc à la maison d’Obed-Édom pour faire monter l’arche de l’alliance de Yahweh, dans la joie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... הַהֹלְכִים
  choice: allèrent donc
  rationale: La tournure וַיְהִי introduit ici la scène narrative, tandis que le participe הַהֹלְכִים décrit l’action du groupe. Une proposition verbale française avec « donc » restitue naturellement cette fonction sans calquer « il arriva que ».
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: les anciens d’Israël
  rationale: Expression française consacrée et précise pour désigner le corps reconnu des responsables d’Israël.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: les chefs de milliers
  rationale: Cette formulation conserve la structure hébraïque et laisse ouverte la nature exacte, militaire ou administrative, des unités de mille.
- source_word: לְהַעֲלוֹת
  choice: chercher
  rationale: Dans ce contexte, le but est d’aller prendre l’arche chez Obed-Édom afin de la faire monter. « Aller chercher » est idiomatique en français et exprime le déplacement sans lourdeur.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: La traduction suit étroitement la chaîne construite hébraïque et conserve le nom divin personnel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du tétragramme, qui préserve ici le nom personnel présent dans le texte source plutôt que de lui substituer un titre.
- source_word: מִן בֵּית עֹבֵד אֱדֹם
  choice: dans la maison d’Obed-Édom
  rationale: Après « aller chercher », le français idiomatique indique le lieu d’où l’objet doit être pris avec « dans »; la valeur d’origine de מִן demeure portée par l’ensemble verbal.
- source_word: בְּשִׂמְחָה
  choice: au milieu des réjouissances
  rationale: Cette expression rend la manière ou l’atmosphère festive de l’action et sonne plus naturellement ici que le calque « avec joie ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par le titre « le SEIGNEUR »; « Jéhovah » repose sur une vocalisation hybride traditionnelle.
translation_notes:
  register: Français moderne, international et digne. La phrase garde le mouvement narratif du texte hébreu, tout en évitant la tournure vieillie « il arriva que ». « Chefs de milliers » préserve la légère indétermination institutionnelle de l’expression source.
