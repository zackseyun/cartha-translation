  text: כִּ֛י לְ/מַ בָּ/רִ֥אשׁוֹנָ֖ה לֹ֣א אַתֶּ֑ם פָּרַ֨ץ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ בָּ֔/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/013.yaml
  text: Because you were not there the first time[a], Yahweh our God broke out against us[b], because we did not seek him according to the ordinance.
translation:
  language: fr
  text: En effet, comme vous n’étiez pas là la première fois[a], Yahvé notre Dieu a fait une brèche contre nous, parce que nous ne l’avons pas cherché conformément à ce qui est prescrit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’ouverture de la phrase est très condensée en hébreu. On peut aussi comprendre : « Car, la première fois, ce n’était pas vous » ou rattacher plus directement « la première fois » à l’action de Yahvé. Le contexte suggère que les Lévites n’avaient pas participé comme il convenait à la première tentative de transport de l’arche.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « parce que nous ne l’avons pas consulté selon la règle prescrite ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַ בָּרִאשׁוֹנָה לֹא אַתֶּם
  choice: comme vous n’étiez pas là la première fois
  rationale: La formulation hébraïque est elliptique. Dans le contexte, David s’adresse aux Lévites et évoque leur absence lors de la première tentative de transport de l’arche. La traduction explicite sobrement ce sens implicite sans ajouter qu’ils ne la « portaient » pas.
- source_word: פָּרַץ ... בָּנוּ
  choice: a ouvert une brèche parmi nous
  rationale: Cette expression conserve l’image forte de פרץ, celle d’une irruption ou d’une brèche produite par le jugement divin, et rappelle le nom de Pérets-Ouzza dans le récit antérieur. « Parmi nous » rend ici naturellement la sphère touchée par cette action.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa valeur de nom propre dans le texte hébreu.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Traduction directe du nom avec le suffixe de première personne du pluriel.
- source_word: דְרַשְׁנֻהוּ
  choice: nous ne l’avons pas recherché
  rationale: דרשׁ peut signifier rechercher, consulter ou interroger. « Rechercher » préserve ici à la fois la dimension relationnelle et celle de la consultation de Dieu.
- source_word: כַּמִּשְׁפָּט
  choice: conformément à ce qui est prescrit
  rationale: Dans ce contexte, מִשְׁפָּט désigne la règle normative régissant le transport de l’arche. Cette formulation est claire en français moderne et garde l’idée d’une prescription obligatoire.
theological_decisions:
- issue: Ellipse dans la proposition initiale
  choice: Comprendre que les Lévites n’étaient pas présents lors de la première tentative
  alternative: « Car, la première fois, ce n’était pas vous » ou « Car, au commencement, Yahvé notre Dieu a ouvert une brèche parmi nous »
  rationale: Le contexte immédiat (v. 12-15) relie l’échec antérieur au fait que les Lévites n’avaient pas assumé leur rôle prescrit. La note maintient toutefois l’incertitude syntaxique réelle de l’hébreu.
- issue: Nature de l’action divine exprimée par פרץ
  choice: Conserver l’image d’une brèche ouverte parmi le peuple
  alternative: « s’est déchaîné contre nous » ou « nous a frappés »
  rationale: L’image de la brèche exprime la soudaineté et la gravité du jugement de Dieu, tout en préservant le lien verbal avec Pérets-Ouzza sans réduire le verbe à une simple notion de châtiment.
- issue: Sens de la recherche de Dieu « conformément à ce qui est prescrit »
  choice: Maintenir ensemble la recherche de Dieu et l’observance de la règle prescrite
  alternative: « nous ne l’avons pas consulté selon la règle »
  rationale: Le texte met en tension l’approche de Dieu et la procédure cultuelle correcte. La traduction ne réduit ni l’une à une attitude purement intérieure, ni l’autre à une formalité indépendante de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image biblique de la brèche, quelque peu marquée mais intelligible, afin de ne pas effacer l’écho narratif à Pérets-Ouzza. « Conformément à ce qui est prescrit » évite à la fois l’archaïsme de « selon l’ordonnance » et une paraphrase trop vague.
