revisions:
- from: En effet, comme vous n’étiez pas là la première fois[a], Yahvé notre Dieu a ouvert une brèche parmi nous, parce que nous ne l’avons pas recherché conformément à ce qui est prescrit[b].
  to: En effet, comme vous n’étiez pas là la première fois[a], Yahvé notre Dieu a fait une brèche contre nous, parce que nous ne l’avons pas cherché conformément à ce qui est prescrit[b].
  rationale: La révision corrige la direction de l’action exprimée par פרץ בָּנוּ, tout en conservant l’image de la brèche et son écho au récit antérieur. Elle remplace également « recherché » par « cherché », plus naturel en français pour l’acte de se tourner vers Dieu. L’ellipse initiale et l’ambiguïté lexicale de דרשׁ sont maintenues et signalées par les notes.
