  text: וְ/הַ/מְשֹׁ֣רְרִ֔ים הֵימָ֥ן אָסָ֖ף וְ/אֵיתָ֑ן בִּ/מְצִלְתַּ֥יִם נְחֹ֖שֶׁת לְ/הַשְׁמִֽיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/019.yaml
  text: The singers were Heman[a], Asaph, and Ethan, with bronze cymbals to sound aloud.
translation:
  language: fr
  text: Les chanteurs Héman, Asaph et Éthan faisaient retentir des cymbales de bronze[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec des cymbales de bronze, pour faire entendre ». L’objet de « faire entendre » n’est pas exprimé en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְשֹׁרְרִים
  choice: Les chanteurs
  rationale: Le participe substantivé avec l’article désigne précisément ceux qui chantent. La conjonction initiale est absorbée dans la syntaxe française, puisque le verset poursuit une énumération.
- source_word: הֵימָן אָסָף וְאֵיתָן
  choice: Hémân, Asaph et Étân
  rationale: Translittération française claire des trois noms propres, avec restitution naturelle de la conjonction dans l’énumération.
- source_word: בִּמְצִלְתַּיִם
  choice: des cymbales
  rationale: Le nom au duel désigne les cymbales; la préposition בְּ est instrumentale. En français, cette valeur est naturellement intégrée à la tournure «faisaient retentir des cymbales».
- source_word: נְחֹשֶׁת
  choice: de bronze
  rationale: Dans ce contexte instrumental, «bronze» est le terme moderne usuel et évite l’anachronisme possible de «laiton».
- source_word: לְהַשְׁמִיעַ
  choice: faisaient retentir
  rationale: L’infinitif hiphil de שׁמע signifie littéralement «faire entendre». Appliqué aux cymbales, «faire retentir» exprime naturellement la production d’un son nettement audible, sans ajouter explicitement l’idée de volume.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La formulation transforme l’énoncé hébreu elliptique en une phrase française naturelle tout en signalant en note la construction littérale et son ambiguïté.
