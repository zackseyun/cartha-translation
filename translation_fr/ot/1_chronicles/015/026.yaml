source:
  edition: WLC
  text: וַֽ/יְהִי֙ בֶּ/עְזֹ֣ר הָֽ/אֱלֹהִ֔ים אֶ֨ת הַ/לְוִיִּ֔ם נֹשְׂאֵ֖י אֲר֣וֹן בְּרִית יְהוָ֑ה וַ/יִּזְבְּח֥וּ שִׁבְעָֽה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/026.yaml
  text: And when God helped the Levites who were carrying the ark of the covenant of Yahweh[a], they sacrificed seven bulls and seven rams.
translation:
  language: fr
  text: Et lorsque Dieu aida les Lévites qui portaient l’arche de l’alliance de Yahweh, ils sacrifièrent sept taureaux et sept béliers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּעְזֹר
  choice: lorsque … aida
  rationale: L’infinitif construit précédé de ב, après ויהי, forme une proposition temporelle. « Lorsque … aida » restitue clairement cette relation en français.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Avec l’article en hébreu, le terme désigne ici le Dieu d’Israël; « Dieu » est la formulation naturelle en français.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation usuelle du groupe, avec l’article défini.
- source_word: נֹשְׂאֵי
  choice: qui portaient
  rationale: Le participe qualifie les Lévites et présente leur action en cours; l’imparfait français en rend naturellement la valeur durative.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: Cette formulation conserve de façon transparente toute la chaîne construite hébraïque sans trancher implicitement entre les rapports possibles des noms.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיִּזְבְּחוּ
  choice: ils sacrifièrent
  rationale: Le verbe désigne directement l’action sacrificielle et porte une forme masculine plurielle.
- source_word: שִׁבְעָה פָרִים
  choice: sept taureaux
  rationale: Dans ce contexte sacrificiel, פָרִים désigne naturellement des taureaux.
- source_word: וְשִׁבְעָה אֵילִים
  choice: et sept béliers
  rationale: « Béliers » rend directement אֵילִים, et la répétition du nombre respecte la formulation et le rythme de l’hébreu.
theological_decisions:
- issue: Sujet de l’action sacrificielle
  choice: ils sacrifièrent
  alternative: il sacrifia
  rationale: Le verbe וַיִּזְבְּחוּ est à la troisième personne du masculin pluriel. La traduction maintient ce pluriel sans préciser davantage qui, parmi les participants à la procession, accomplit l’action.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique soutenu, tandis que l’imparfait marque l’action en cours des porteurs. Le nom Yahweh est conservé.
