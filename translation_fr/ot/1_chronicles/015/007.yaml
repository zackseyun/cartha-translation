  text: 'For the sons of Gershom: Joel the chief[b][a], and 130 of his brothers.'
translation:
  language: fr
  text: 'Pour les fils de Guerschom : Joël, le chef, et 130 de ses frères[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » désigne les hommes appartenant au même groupe familial lévitique, et pas nécessairement les frères de Joël au sens strict.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Pour les fils de
  rationale: Le préfixe ל introduit ici un nouveau groupe dans l’énumération. « Pour les fils de » conserve cette fonction et le vocabulaire généalogique du texte.
- source_word: גֵּרְשׁוֹם
  choice: Guershom
  rationale: Cette forme française translittère la forme hébraïque présente dans ce verset, גֵּרְשׁוֹם.
- source_word: יוֹאֵל
  choice: Joël
  rationale: Forme française courante du nom hébreu יוֹאֵל.
- source_word: הַשָּׂר
  choice: le chef
  rationale: Dans cette liste de groupes lévitiques, שַׂר désigne le responsable placé à la tête du groupe, sans nécessairement comporter une nuance royale.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: La traduction conserve le sens premier de אָח tout en laissant le contexte indiquer qu’il s’agit des hommes du même groupe familial, et non nécessairement de frères germains.
- source_word: מֵאָה וּשְׁלֹשִׁים
  choice: '130'
  rationale: Le nombre cardinal est rendu en chiffres, conformément à la présentation naturelle d’un effectif dans une liste.
