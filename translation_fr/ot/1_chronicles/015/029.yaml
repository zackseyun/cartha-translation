  text: וַ/יְהִ֗י אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה בָּ֖א עַד עִ֣יר דָּוִ֑יד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִיד֙ מְרַקֵּ֣ד וּ/מְשַׂחֵ֔ק וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/029.yaml
  text: And as the ark of the covenant of Yahweh came to the city of David[a], Michal the daughter of Saul looked out through the window and saw King David dancing and playing, and she despised him in her heart.
translation:
  language: fr
  text: Lorsque l’arche de l’alliance de Yahvé arriva à la cité de David, Mikal, fille de Saül, regarda par la fenêtre et vit le roi David danser et jouer[a] ; elle le méprisa dans son cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se réjouir », « manifester sa joie » ou « faire la fête ».'
    reason: Le participe מְשַׂחֵק peut désigner le jeu ou une expression joyeuse et festive; le contexte ne permet pas de fixer une nuance unique.
lexical_decisions:
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahvé
  rationale: Rend directement la chaîne construite hébraïque et conserve le nom divin personnel.
- source_word: בָּא עַד עִיר דָּוִיד
  choice: arrivait à la cité de David
  rationale: בוא avec עַד exprime ici l’arrivée à destination. L’imparfait convient à la proposition circonstancielle introduisant la scène.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mikal, fille de Saül
  rationale: Préserve l’identification par la lignée de Saül tout en suivant une syntaxe française naturelle.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: regarda par la fenêtre
  rationale: Le verbe décrit le fait de regarder depuis ou à travers une fenêtre; la formulation n’impose pas une direction verticale que le contexte ne rend pas nécessaire.
- source_word: מְרַקֵּד
  choice: danser
  rationale: Le participe désigne ici un mouvement dansé énergique au cours de la procession.
- source_word: וּמְשַׂחֵק
  choice: manifester sa joie
  rationale: Dans ce contexte festif, le verbe évoque une expression publique et joyeuse pouvant aussi être comprise comme le fait de jouer, de se réjouir ou de faire la fête.
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: elle le méprisa dans son cœur
  rationale: Conserve à la fois la force du mépris exprimé par בזה et son caractère intérieur indiqué par בְּלִבָּהּ.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme comme nom personnel. « Yahvé » est sa forme française courante et évite de lui substituer un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase hébraïque a été divisée en deux phrases françaises pour la lisibilité, sans modifier la progression de la scène. « Cité de David » conserve la désignation historique traditionnelle.
