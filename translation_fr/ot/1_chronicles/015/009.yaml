  text: 'For the sons of Hebron: Eliel the chief[a], and eighty of his brothers.'
translation:
  language: fr
  text: 'Pour les fils d’Hébron : le chef Éliel et ses frères, au nombre de quatre-vingts[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « membres de sa parenté » ; l’hébreu dit littéralement « ses frères » et désigne probablement ici les hommes du groupe clanique représenté par Éliel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Pour les fils de
  rationale: Le préfixe ל introduit ici un groupe clanique dans une liste. « Pour les fils de » conserve l’expression hébraïque de parenté tout en restant naturel en français.
- source_word: חֶבְרוֹן
  choice: Hébron
  rationale: Nom propre personnel ou clanique, transcrit selon l’usage français courant.
- source_word: אֱלִיאֵל
  choice: Éliel
  rationale: Nom propre transcrit selon l’usage biblique français, avec les accents nécessaires à sa lecture naturelle.
- source_word: הַשָּׂר
  choice: le chef
  rationale: שַׂר désigne un dirigeant ou responsable. Dans cette liste de représentants claniques, « le chef » convient sans suggérer ni royauté ni fonction militaire précise.
- source_word: וְאֶחָיו
  choice: et … ses frères
  rationale: Le mot signifie littéralement « ses frères ». Dans ce contexte clanique, il peut désigner plus largement des hommes de sa parenté ou de son groupe, ambiguïté signalée en note.
- source_word: שְׁמוֹנִים
  choice: quatre-vingts
  rationale: Nombre cardinal indiquant l’effectif des hommes associés à Éliel.
