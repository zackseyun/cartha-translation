source:
  edition: WLC
  text: לִ/בְנֵ֖י עֻזִּיאֵ֑ל עַמִּינָדָ֣ב הַ/שָּׂ֔ר וְ/אֶחָ֕י/ו מֵאָ֖ה וּ/שְׁנֵ֥ים עָשָֽׂר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/010.yaml
  text: 'For the sons of Uzziel: Amminadab the chief[a], and his brothers, one hundred and twelve.'
translation:
  language: fr
  text: 'Pour les descendants d’Ouzziel : Amminadab, le chef[a], et ses frères, au nombre de cent douze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le dirigeant », « le responsable » ou « le prince ».
    reason: alternative lexicale pour הַשָּׂר, dont le sens exact dépend du rang et de la fonction exercés dans le contexte
lexical_decisions:
- source_word: לִבְנֵי
  choice: Pour les descendants de
  rationale: Le ל préfixé introduit ici un nouveau groupe dans l’énumération. « Pour » rend naturellement cette fonction, tandis que « descendants » exprime la valeur clanique de בנים dans ce contexte généalogique.
- source_word: עֻזִּיאֵל
  choice: Ouzziel
  rationale: Nom propre transcrit selon l’usage biblique français courant.
- source_word: עַמִּינָדָב
  choice: Amminadab
  rationale: Nom propre transcrit selon l’usage biblique français courant.
- source_word: הַשָּׂר
  choice: le chef
  rationale: שַׂר désigne un chef, un dirigeant, un responsable ou un prince. Dans cette liste de responsables de clans, « le chef » est clair et naturel.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: אָח peut désigner des frères au sens strict ou, plus largement, des hommes apparentés ou membres du même groupe. « Ses frères » conserve l’expression familiale et l’ambiguïté de l’hébreu.
- source_word: מֵאָה וּשְׁנֵים עָשָׂר
  choice: au nombre de cent douze
  rationale: Le nombre cardinal est rendu directement; « au nombre de » indique naturellement que cent douze se rapporte aux frères qui accompagnent Amminadab.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La formulation suit la structure d’une liste administrative tout en évitant le calque « fils d’Ouzziel », qui pourrait être compris comme désignant uniquement ses fils immédiats.
