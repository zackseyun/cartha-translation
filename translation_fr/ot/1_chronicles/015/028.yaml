source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל מַעֲלִים֙ אֶת אֲר֣וֹן בְּרִית יְהוָ֔ה בִּ/תְרוּעָה֙ וּ/בְ/ק֣וֹל שׁוֹפָ֔ר וּ/בַ/חֲצֹצְר֖וֹת וּ/בִ/מְצִלְתָּ֑יִם מַשְׁמִעִ֕ים בִּ/נְבָלִ֖ים וְ/כִנֹּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/028.yaml
  text: And all Israel was bringing up the ark of the covenant of Yahweh with shouting[a], with the sound of a horn, with trumpets, and with cymbals[b], making music with harps and lyres.
translation:
  language: fr
  text: Tout Israël faisait monter l’arche de l’alliance de Yahweh avec des acclamations[a], au son du cor[b], des trompettes et des cymbales, en faisant résonner les harpes et les lyres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec un grand cri » ; le terme hébreu peut désigner une forte clameur de célébration ou d’acclamation.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu désigne le shofar, traditionnellement un cor, distinct des « trompettes » mentionnées juste après.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: faisait monter
  rationale: Le participe hiphil exprime ici une action en cours. Le singulier s’accorde naturellement en français avec le sujet collectif « tout Israël ».
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: Cette formulation conserve la chaîne de construction et l’identité théologique précise de l’arche.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: תְרוּעָה
  choice: acclamations
  rationale: Le terme désigne un cri puissant, notamment une clameur collective d’acclamation dans un contexte festif ou cultuel. Une note conserve l’autre possibilité, plus littérale.
- source_word: קוֹל שׁוֹפָר
  choice: au son du cor
  rationale: קוֹל désigne explicitement le son, tandis que « cor » distingue le שׁוֹפָר des חֲצֹצְרוֹת mentionnées ensuite.
- source_word: חֲצֹצְרוֹת
  choice: trompettes
  rationale: Équivalent courant des trompettes cérémonielles droites, distinctes du cor.
- source_word: מְצִלְתַּיִם
  choice: cymbales
  rationale: Équivalent français usuel de cet instrument de percussion.
- source_word: מַשְׁמִעִים
  choice: en faisant résonner
  rationale: Le participe hiphil signifie « faire entendre ». Cette tournure française conserve l’accent sur le son tout en reliant clairement le verbe aux instruments à cordes qui suivent.
- source_word: נְבָלִים
  choice: harpes
  rationale: L’identification exacte des instruments antiques demeure approximative ; « harpes » maintient la distinction conventionnelle avec les כִנֹּרוֹת.
- source_word: כִנֹּרוֹת
  choice: lyres
  rationale: Ce choix distingue les deux catégories d’instruments à cordes nommées dans le texte, sans prétendre à une équivalence organologique exacte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel de Dieu au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. « Au milieu des acclamations » restitue le caractère collectif de la scène sans ajouter explicitement la joie, et « en faisant résonner » conserve la valeur auditive du participe hébreu.
