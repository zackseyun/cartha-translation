base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/020.yaml
  text: and Zechariah[a], Aziel, Shemiramoth, Jehiel, Unni, Eliab, Maaseiah, and Benaiah, with harps according to Alamoth.
translation:
  language: fr
  text: et Zacharie, Aziel, Shemiramoth, Yehiel, Ounni, Eliab, Maaséya et Benaya, avec des harpes, selon Alamoth[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des harpes dans un registre aigu » ; le terme hébreu « Alamoth » est peut-être une indication musicale associée aux jeunes femmes ou à des voix aiguës.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְבָלִים
  choice: avec des harpes
  rationale: Le nom désigne des instruments à cordes, souvent rendus par « harpes » ou « lyres ». « Harpes » est clair et naturel dans cette liste musicale, et la préposition ב est comprise ici dans un sens instrumental.
- source_word: עַל
  choice: selon
  rationale: Dans ce contexte musical, la préposition introduit probablement une indication de manière, d'exécution ou de registre. « Selon » conserve cette souplesse sans imposer une interprétation précise.
- source_word: עֲלָמוֹת
  choice: Alamoth[a]
  rationale: Le terme, apparenté au mot désignant de jeunes femmes, semble être une indication musicale technique dont le sens exact demeure incertain. La translittération préserve cette ambiguïté, tandis que la note présente l'interprétation possible d'un registre aigu.
- source_word: וּ/זְכַרְיָה וַ/עֲזִיאֵל וּ/שְׁמִירָמוֹת וִֽ/יחִיאֵל וְ/עֻנִּי וֶֽ/אֱלִיאָב וּ/מַעֲשֵׂיָהוּ וּ/בְנָיָהוּ
  choice: et Zacharie, Aziel, Shemiramoth, Yehiel, Ounni, Eliab, Maaséya et Benaya
  rationale: Les noms sont translittérés ou présentés sous leurs formes françaises usuelles. La conjonction initiale est conservée puisque le verset poursuit la liste précédente.
