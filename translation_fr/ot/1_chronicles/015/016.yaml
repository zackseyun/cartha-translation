base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/016.yaml
  text: Then David told the leaders of the Levites to appoint their brothers, the singers, with musical instruments—harps, lyres, and cymbals—sounding aloud, to raise songs of joy.
translation:
  language: fr
  text: Puis David ordonna aux chefs des Lévites d’établir leurs frères[a] comme chanteurs, avec des instruments de musique — luths, lyres et cymbales —, afin qu’ils les fassent retentir en élevant la voix avec joie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de leurs frères lévites.
    reason: cultural_note
  - marker: b
    text: Ou « afin qu’ils fassent monter le son avec joie ». L’hébreu dit littéralement « élever avec une voix/un son, pour la joie » ; le complément de « élever » n’est pas exprimé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִיד
  choice: Puis David ordonna
  rationale: Le waw consécutif fait progresser le récit. Avec l’infinitif לְהַעֲמִיד, « ordonna » rend naturellement en français la valeur directive de « dit ... de ».
- source_word: לְשָׂרֵי הַלְוִיִּם
  choice: aux chefs des Lévites
  rationale: שָׂרִים désigne ici les responsables du groupe; « chefs » est précis, courant et adapté au cadre d’organisation cultuelle.
- source_word: לְהַעֲמִיד
  choice: d’établir
  rationale: Le hiphil de עמד peut signifier faire tenir, placer ou établir dans une fonction. « Établir » conserve à la fois l’idée de désignation et celle de mise en place.
- source_word: אֶת אֲחֵיהֶם
  choice: leurs frères
  rationale: La traduction maintient le terme de parenté explicite de l’hébreu; dans ce contexte, il s’agit de leurs frères lévites.
- source_word: הַמְשֹׁרְרִים
  choice: comme chanteurs
  rationale: Le participe issu de שׁיר désigne spécifiquement ceux qui chantent. « Comme » explicite naturellement en français la fonction à laquelle ils sont établis.
- source_word: בִּכְלֵי שִׁיר
  choice: avec des instruments de musique
  rationale: Cette formulation idiomatique rend le syntagme « instruments de chant/musique » sans lourdeur.
- source_word: נְבָלִים
  choice: luths
  rationale: L’identification exacte de נֶבֶל reste incertaine. « Luths » désigne de façon conventionnelle un instrument ancien à cordes et permet de le distinguer de la lyre.
- source_word: וְכִנֹּרוֹת
  choice: lyres
  rationale: כִּנּוֹר est généralement identifié comme une lyre; ce choix préserve la distinction entre les deux catégories d’instruments à cordes.
- source_word: וּמְצִלְתָּיִם
  choice: et cymbales
  rationale: Le nom hébreu désigne directement des cymbales.
- source_word: מַשְׁמִיעִים
  choice: qu’ils feraient retentir
  rationale: Le hiphil de שׁמע signifie « faire entendre ». La proposition relative rattache naturellement en français l’action aux instruments et aux exécutants sans réduire le terme à la seule idée de volume.
- source_word: לְהָרִים בְּקוֹל לְשִׂמְחָה
  choice: en élevant la voix avec joie
  rationale: Cette traduction reste proche de l’expression hébraïque, littéralement « élever avec la voix/le son, pour la joie », tout en donnant une phrase française intelligible. Elle évite d’ajouter explicitement « chants », absent du dernier syntagme.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement réorganisée pour clarifier que les frères sont établis dans la fonction de chanteurs. Le choix « en élevant la voix » conserve l’image hébraïque tout en signalant en note l’ambiguïté entre voix humaine et son musical.
