lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: rassembla
  rationale: Le verbe אסף, dans cette forme narrative, indique que David réunit des personnes. « Rassembla » est naturel en français moderne et reste proche de l’hébreu.
- source_word: דָּוִיד
  choice: David
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: בְּנֵי אַהֲרֹן
  choice: les fils d’Aaron
  rationale: L’expression signifie littéralement « les fils d’Aaron ». Dans ce contexte, elle désigne vraisemblablement les membres de la lignée sacerdotale d’Aaron, mais la formulation généalogique du texte est conservée.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Équivalent français établi du terme désignant le groupe lévitique, adapté au contexte cultuel.
- source_word: אֵת ... וְאֵת
  choice: non traduit séparément; coordination par « et »
  rationale: אֵת marque les compléments d’objet direct définis sans avoir d’équivalent lexical en français. Sa répétition est rendue par la coordination française normale.
