  terminology: « Lévites », « fils de », « désignèrent » et « frères » conviennent. « Étan » remplace « Étân », dont la graphie avec accent circonflexe n’est pas justifiée ici. La note b doit parler des « fils de Merari » au pluriel, conformément au texte.
