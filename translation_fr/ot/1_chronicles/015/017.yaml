base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/017.yaml
  text: So the Levites appointed Heman son of Joel[a], and from his brothers Asaph son of Berechiah, and from the sons of Merari, their brothers[b], Ethan son of Kushaiah.
translation:
  language: fr
  text: Les Lévites désignèrent[a] donc Héman, fils de Joël, et, parmi ses frères, Asaph, fils de Bérékia, et, parmi les fils de Merari[b], leurs frères, Étan, fils de Koushaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « placèrent à leur poste » ; le verbe hébreu peut désigner le fait de faire prendre place à quelqu’un dans une fonction déterminée.
    reason: lexical_alternative
  - marker: b
    text: L’expression « fils de Merari » désigne ici les membres du clan issu de Merari, c’est-à-dire les Mérarites.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲמִידוּ
  choice: désignèrent
  rationale: Le hifil de עמד signifie ici faire prendre place à quelqu’un dans une fonction déterminée. « Désignèrent » exprime naturellement l’attribution officielle d’un rôle aux musiciens lévites, tandis qu’une note conserve l’image plus concrète du verbe.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation collective usuelle, avec conservation de l’article défini.
- source_word: אֵת
  choice: non traduit séparément
  rationale: Cette particule marque le complément d’objet direct et n’a pas d’équivalent français naturel.
- source_word: הֵימָן בֶּן יוֹאֵל
  choice: Héman, fils de Joël
  rationale: Les noms sont translittérés selon les formes françaises bibliques usuelles, et la filiation explicite est conservée.
- source_word: וּמִן אֶחָיו
  choice: puis, parmi ses frères
  rationale: La préposition מן marque ici le choix d’une personne au sein d’un groupe. « Parmi » rend ce sens plus clairement que le calque « de ses frères ».
- source_word: אָסָף בֶּן בֶּרֶכְיָהוּ
  choice: Asaph, fils de Bérékia
  rationale: Translittération française naturelle des noms et maintien de la relation généalogique.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: et, parmi les fils de Merari
  rationale: La formulation généalogique littérale « fils de Merari » est maintenue; dans ce contexte, elle désigne le clan mérarite.
- source_word: אֲחֵיהֶם
  choice: leurs frères
  rationale: Le terme familial est conservé sans expliciter davantage le référent du suffixe pluriel, afin de préserver la formulation et la légère ambiguïté de l’hébreu.
- source_word: אֵיתָן בֶּן קוּשָׁיָהוּ
  choice: Étân, fils de Koushaya
  rationale: Les noms propres sont rendus par une translittération française lisible, et la filiation est conservée.
theological_decisions: []
