  register: Français international moderne, digne et accessible. La phrase conserve l’enchaînement généalogique de l’hébreu tout en employant « parmi » pour rendre clairement la valeur partitive de מן. Les virgules autour des filiations facilitent la lecture sans résoudre le référent de « leurs frères ».
