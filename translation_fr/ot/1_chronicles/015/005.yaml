  yaml_path: translation/ot/1_chronicles/015/005.yaml
  text: 'For the sons of Kohath: Uriel the chief[a], and 120 of his brothers.'
translation:
  language: fr
  text: 'Des fils de Qehath : Ouriel, le chef, et ses frères, au nombre de 120[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses proches » ; ici, « frères » désigne probablement d’autres membres du clan de Qehath, et pas nécessairement ses seuls frères biologiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Pour les fils de
  rationale: Le préfixe ל introduit ici un groupe dans l’énumération des divisions lévitiques. « Pour les fils de » respecte la structure de la liste, tandis que « fils » conserve l’expression hébraïque qui peut désigner une lignée ou un clan.
- source_word: קְהָת
  choice: Qehath
  rationale: Nom propre de l’ancêtre lévitique, transcrit selon un usage français courant qui rend la consonne initiale hébraïque par Q.
- source_word: אוּרִיאֵל
  choice: Ouriel
  rationale: Transcription française usuelle du nom propre hébreu.
- source_word: הַשָּׂר
  choice: le chef
  rationale: שַׂר désigne ici le responsable ou chef du contingent familial; « chef » est naturel et n’introduit pas la connotation royale possible de « prince ».
- source_word: וְאֶחָיו
  choice: et … ses frères
  rationale: Le sens littéral est « ses frères », mais dans cette liste clanique le terme peut viser plus largement ses parents masculins ou les membres du même clan; l’ambiguïté est conservée et signalée en note.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: '120'
  rationale: L’emploi de chiffres convient à cette liste de dénombrement et restitue exactement « cent vingt ».
