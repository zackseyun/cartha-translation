  rationale: Transcription française courante du nom hébreu, sans ajouter de consonne finale étrangère à sa prononciation.
- source_word: הַשָּׂר
  choice: le chef
  rationale: שַׂר désigne ici le responsable reconnu du groupe; « chef » convient au contexte sans suggérer nécessairement un rang royal.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: « Frères » traduit directement אַחִים, tout en laissant une note signaler que le terme peut avoir un sens familial ou clanique plus large.
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: '220'
  rationale: La notation chiffrée est claire et naturelle dans une liste en français moderne.
