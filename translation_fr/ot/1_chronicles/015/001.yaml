id: 1CH.15.1
reference: 1 Chronicles 15:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּֽעַשׂ ל֥/וֹ בָתִּ֖ים בְּ/עִ֣יר דָּוִ֑יד וַ/יָּ֤כֶן מָקוֹם֙ לַֽ/אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יֶּט ל֖/וֹ אֹֽהֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/001.yaml
  text: And he made houses for himself in the city of David[a], and he prepared a place for the ark of God and pitched a tent for it.
translation:
  language: fr
  text: Il construisit pour lui-même des maisons dans la cité de David. Il prépara un emplacement pour l’arche de Dieu et dressa pour elle une tente[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dressa pour lui-même une tente ». Le suffixe hébreu peut renvoyer soit à l’arche, soit à David, mais le contexte immédiat favorise l’arche.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ לֹו בָתִּים
  choice: Il construisit pour lui-même des maisons
  rationale: Le verbe עשה signifie largement « faire », mais avec « maisons », « construire » est l’équivalent contextuel naturel. « Pour lui-même » rend explicitement le complément לֹו, et « maisons » conserve le pluriel non spécifié du texte.
- source_word: בְּעִיר דָּוִיד
  choice: dans la cité de David
  rationale: Traduction locative directe. « Cité de David » est l’appellation française traditionnelle et naturelle de ce lieu.
- source_word: וַיָּכֶן מָקוֹם
  choice: Il prépara un emplacement
  rationale: Au hiphil, כון exprime ici l’idée de préparer ou de rendre prêt. « Emplacement » convient à un lieu destiné à recevoir l’arche tout en restant sobre.
- source_word: לַאֲרוֹן הָאֱלֹהִים
  choice: pour l’arche de Dieu
  rationale: Rendu direct de l’expression hébraïque, sans ajout interprétatif.
- source_word: וַיֶּט ... אֹהֶל
  choice: dressa ... une tente
  rationale: Avec une tente comme objet, נטה désigne idiomatiquement l’action de la dresser. L’article indéfini respecte l’absence d’article devant אֹהֶל.
- source_word: לֹו
  choice: pour elle
  rationale: Le suffixe masculin singulier renvoie le plus naturellement, dans le contexte immédiat, à l’arche; en français, le pronom prend le genre féminin du nom « arche ».
theological_decisions:
- issue: Référent du suffixe dans וַיֶּט לֹו אֹהֶל
  choice: 'Le suffixe renvoie à l’arche : « dressa pour elle une tente »'
  alternative: 'Le suffixe renvoie à David : « dressa pour lui-même une tente »'
  rationale: La proposition précédente porte sur la préparation d’un emplacement pour l’arche; comprendre le suffixe comme renvoyant à l’arche assure donc la continuité la plus immédiate. L’autre lecture reste grammaticalement possible et est signalée en note.
translation_notes:
  register: Français moderne, clair et digne. La formulation reste proche de la structure hébraïque sans raideur excessive; « arche de Dieu » et « cité de David » conservent le vocabulaire biblique courant.
