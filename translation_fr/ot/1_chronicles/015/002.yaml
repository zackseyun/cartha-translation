  text: אָ֚ז אָמַ֣ר דָּוִ֔יד לֹ֤א לָ/שֵׂאת֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כִּ֖י אִם הַ/לְוִיִּ֑ם כִּי בָ֣/ם בָּחַ֣ר יְהוָ֗ה לָ/שֵׂ֞את אֶת אֲר֧וֹן יְהוָ֛ה וּֽ/לְ/שָׁרְת֖/וֹ עַד עוֹלָֽם־־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/002.yaml
  text: Then David said[a], “No one is to carry the ark of God except the Levites[b], for Yahweh has chosen them to carry the ark of Yahweh and to minister to him forever.”
translation:
  language: fr
  text: 'Alors David dit : « Personne ne doit porter l’arche de Dieu, excepté les Lévites[a], car Yahweh les a choisis pour porter l’arche de Yahweh et pour le servir[b] pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique : littéralement, « ne pas porter l’arche de Dieu, excepté les Lévites ». Le sujet sous-entendu peut aussi être rendu ainsi : « L’arche de Dieu ne doit être portée que par les Lévites. »'
    reason: lexical_alternative
  - marker: b
    text: Ou « en assurer le service ». Le verbe hébreu désigne souvent un service sacré ou liturgique. Le pronom renvoie très probablement à Yahweh, mais il peut grammaticalement être rapproché de l’arche.
    reason: ambiguity
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque naturellement la succession des événements et introduit la réaction de David.
- source_word: לֹא לָשֵׂאת אֶת אֲרוֹן הָאֱלֹהִים כִּי אִם הַלְוִיִּם
  choice: Personne ne doit porter l’arche de Dieu, excepté les Lévites
  rationale: L’hébreu est elliptique et ne précise pas le sujet de l’infinitif. Le français exige ici de l’expliciter; « personne ne doit » rend clairement la restriction normative sans en durcir inutilement la formulation.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: « Arche » est le terme français consacré et précis pour cet objet sacré.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation traditionnelle, exacte et immédiatement compréhensible du groupe concerné.
- source_word: כִּי בָם בָּחַר יְהוָה
  choice: car Yahweh les a choisis
  rationale: כִּי introduit le motif de la restriction, et le passé composé exprime un choix antérieur dont l’effet demeure.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לָשֵׂאת
  choice: porter
  rationale: Dans ce contexte, le verbe désigne l’action physique de transporter l’arche; « porter » est naturel et précis.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: Conserve explicitement le nom divin et la répétition voulue du mot « arche ».
- source_word: וּלְשָׁרְתוֹ
  choice: et pour le servir
  rationale: « Servir » est naturel en français et peut porter, dans ce contexte lévitique, le sens de service sacré ou cultuel.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Expression française courante et digne qui rend la durée continue de la charge.
theological_decisions:
- issue: Référent du suffixe dans וּלְשָׁרְתוֹ
  choice: « le servir », le pronom renvoyant à Yahweh
  alternative: « en assurer le service », compris comme un service lié à l’arche
  rationale: Yahweh est l’antécédent personnel le plus naturel, et le service lévitique est régulièrement présenté comme un service rendu à Yahweh. Toutefois, puisque « arche » est également masculin en hébreu, la proximité de ce nom permet une autre compréhension, signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la répétition de « l’arche » et du nom « Yahweh », tout en explicitant dans une note l’ellipse syntaxique et l’ambiguïté limitée du dernier pronom.
