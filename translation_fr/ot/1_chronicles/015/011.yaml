base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/011.yaml
  text: 'Then David called for Zadok and Abiathar the priests, and for the Levites: Uriel, Asaiah, Joel, Shemaiah, Eliel, and Amminadab.'
translation:
  language: fr
  text: Puis David convoqua les prêtres Tsadok et Abiathar, ainsi que les lévites Uriel, Asaya, Joël, Shemaya, Éliel et Amminadab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: convoqua
  rationale: Dans ce contexte, le verbe קרא désigne l’action de faire venir des personnes précises. « Convoqua » exprime naturellement cette idée en français.
- source_word: לְצָדוֹק וּלְאֶבְיָתָר הַכֹּהֲנִים
  choice: les prêtres Tsadok et Abiathar
  rationale: Cette formulation française naturelle conserve l’article défini hébreu et présente Tsadok et Abiathar dans leur fonction sacerdotale.
- source_word: וְלַלְוִיִּם
  choice: ainsi que les lévites
  rationale: La préposition ל dépend toujours du verbe « convoqua ». « Ainsi que » rend clairement l’ajout d’un second groupe sans alourdir la phrase.
- source_word: לְאוּרִיאֵל עֲשָׂיָה וְיוֹאֵל שְׁמַעְיָה וֶאֱלִיאֵל וְעַמִּינָדָב
  choice: Uriel, Asaya, Joël, Shemaya, Éliel et Amminadab
  rationale: Les noms propres sont translittérés sous des formes françaises lisibles. Le contexte syntaxique indique que ces six hommes sont les lévites convoqués.
- source_word: דָוִיד
  choice: David
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
