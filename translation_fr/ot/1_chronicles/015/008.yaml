  text: לִ/בְנֵ֖י אֱלִֽיצָפָ֑ן שְׁמַֽעְיָ֥ה הַ/שָּׂ֖ר וְ/אֶחָ֥י/ו מָאתָֽיִם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/008.yaml
  text: 'For the sons of Elizaphan: Shemaiah the chief[a], and two hundred of his brothers.'
translation:
  language: fr
  text: 'Pour les fils d’Élitsaphân : Shemaya, le chef, et ses frères : deux cents[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « membres de sa parenté » ou « membres de son clan » ; le mot hébreu traduit par « frères » peut désigner plus largement que des frères au sens strict dans ce type de liste généalogique.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: Pour les fils de
  rationale: Le ל préfixé introduit ici le groupe familial dans l’énumération. « Fils de » conserve l’expression hébraïque tout en désignant, dans ce contexte généalogique, une lignée ou un clan.
- source_word: אֱלִיצָפָן
  choice: Élitsaphân
  rationale: Translittération française moderne du nom hébreu, avec ts pour צ et accent indiquant naturellement la syllabe finale.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Translittération française lisible du nom hébreu שְׁמַעְיָה.
- source_word: הַ/שָּׂר
  choice: le chef
  rationale: שַׂר désigne un dirigeant, responsable ou dignitaire. « Chef » convient au responsable nommé d’un groupe familial sans lui attribuer une dignité royale ou une fonction militaire précise.
- source_word: וְ/אֶחָי/ו
  choice: et ... de ses frères
  rationale: אָח signifie littéralement « frère », mais peut désigner plus largement des parents ou membres du même clan. Le texte principal conserve le terme concret, tandis qu’une note signale son extension possible ici.
- source_word: מָאתָיִם
  choice: deux cents
  rationale: Rendu direct du nombre cardinal hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe nominale et concise de la liste hébraïque est préservée. L’ordre « le chef Shemaya » est naturel en français et garde clairement le titre associé au nom.
