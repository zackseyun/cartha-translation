  source_fidelity: 'Le texte rend fidèlement la séquence hébraïque : waw narratif (« Ainsi »), sujet double défini (« les prêtres et les lévites »), hitpael réfléchi de קדשׁ (« se consacrèrent »), puis l’infinitif de but hiphil de עלה (« afin de faire monter ») et l’objet complet (« l’arche de Yahweh, le Dieu d’Israël »).'
