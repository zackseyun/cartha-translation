  text: וַ/יִּֽתְקַדְּשׁ֔וּ הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/הַעֲל֕וֹת אֶת אֲר֥וֹן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/014.yaml
  text: So the priests and the Levites consecrated themselves to bring up the ark of Yahweh[a], the God of Israel.
translation:
  language: fr
  text: Ainsi, les prêtres et les lévites se consacrèrent[a] afin de faire monter l’arche de Yahweh, le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se sanctifièrent ».'
    reason: Alternative lexicale reflétant le sens de sainteté rituelle du verbe hébreu.
lexical_decisions:
- source_word: וַיִּתְקַדְּשׁוּ
  choice: se consacrèrent
  rationale: Le hitpael de קדשׁ exprime ici une préparation personnelle à un service sacré. « Se consacrèrent » est naturel en français moderne et conserve la dimension rituelle de sainteté.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français usuel de כֹּהֲנִים dans un contexte cultuel.
- source_word: וְהַלְוִיִּם
  choice: et les lévites
  rationale: Traduction standard de לְוִיִּם, avec maintien de l’article défini.
- source_word: לְהַעֲלוֹת
  choice: afin de faire monter
  rationale: Le hiphil de עלה signifie littéralement « faire monter ». Cette formulation respecte le déplacement de l’arche vers Jérusalem sans préciser indûment le mode de transport.
- source_word: אֶת אֲרוֹן
  choice: l’arche
  rationale: Dans ce contexte, אֲרוֹן désigne l’arche sacrée; « arche » est le terme français consacré et précis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Le groupe construit est rendu directement et se trouve en apposition à « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » en conserve la valeur de nom propre et correspond à sa translittération moderne courante.
- issue: Portée de וַיִּתְקַדְּשׁוּ
  choice: se consacrèrent
  alternative: se sanctifièrent
  rationale: Le choix maintient l’idée d’une préparation rituelle à une tâche sacrée sans suggérer que les prêtres et les lévites se rendaient saints par leur propre puissance.
translation_notes:
  register: Français international moderne, digne et accessible. « Ainsi » rend la continuité narrative du waw; « afin de » explicite naturellement la relation de but. Le marqueur de note est placé immédiatement après le terme concerné.
