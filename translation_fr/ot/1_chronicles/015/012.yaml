    rationale: La préposition אֶל marque la destination (« à/vers »). « Jusqu’à » est possible en contexte de déplacement, mais peut suggérer plus explicitement l’idée de trajet jusqu’à un point final. « Au lieu » est plus proche et plus neutre.
