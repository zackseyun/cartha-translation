review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est fidèlement rendu : les chefs lévitiques sont appelés à se consacrer avec leurs frères et à faire monter l’arche de Yahweh vers la destination préparée par David. « Maisons ancestrales » transmet convenablement la structure des maisons paternelles, et « faites monter » conserve le causatif et la direction ascendante de l’hébreu.'
  naturalness: Le français est soutenu et naturel dans l’ensemble. Toutefois, « jusqu’au lieu » ajoute légèrement une idée de parcours/terme final qui n’est pas exigée par אֶל (« vers/à »). « Au lieu » rend plus directement la préposition tout en restant idiomatique.
  terminology: « Lévites », « consacrez-vous », « arche de Yahweh » et « le Dieu d’Israël » sont exacts et cohérents. La note présente correctement « sanctifiez-vous » comme alternative et explique la valeur rituelle sans surcharge interprétative.
