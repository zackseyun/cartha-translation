  to: 'Il leur dit : « Vous êtes les chefs des maisons ancestrales des Lévites. Consacrez-vous[a], vous et vos frères, et faites monter l’arche de Yahweh, le Dieu d’Israël, au lieu que je lui ai préparé. »'
  rationale: La seule correction remplace « jusqu’au lieu » par « au lieu », afin de rendre la simple destination exprimée par אֶל sans ajouter une nuance de parcours. Le reste du texte et la note sont fidèles, naturels et terminologiquement appropriés.
