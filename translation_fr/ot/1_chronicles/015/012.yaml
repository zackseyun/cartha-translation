  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַתֶּ֛ם רָאשֵׁ֥י הָ/אָב֖וֹת לַ/לְוִיִּ֑ם הִֽתְקַדְּשׁוּ֙ אַתֶּ֣ם וַ/אֲחֵי/כֶ֔ם וְ/הַֽעֲלִיתֶ֗ם אֵ֣ת אֲר֤וֹן יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֶל הֲכִינ֖וֹתִי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/012.yaml
  text: And he said to them[a], “You are the heads of the fathers’ houses of the Levites. Sanctify yourselves, you and your brothers, and bring up the ark of Yahweh, the God of Israel, to the place I have prepared for it.”
translation:
  language: fr
  text: 'Il leur dit : « Vous êtes les chefs des maisons ancestrales des Lévites. Consacrez-vous[a], vous et vos frères, et faites monter l’arche de Yahweh, le Dieu d’Israël, au lieu que je lui ai préparé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sanctifiez-vous. » Le verbe hébreu désigne ici une consécration rituelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: les chefs des maisons ancestrales
  rationale: L’expression désigne les responsables des groupes familiaux établis selon l’ascendance paternelle. « Maisons ancestrales » restitue cette structure sociale de façon plus naturelle en français moderne que le calque « maisons des pères ».
- source_word: לַלְוִיִּם
  choice: des Lévites
  rationale: 'La préposition marque ici l’appartenance : ces chefs sont ceux des maisons ancestrales lévitiques.'
- source_word: הִתְקַדְּשׁוּ
  choice: Consacrez-vous
  rationale: La forme réfléchie du verbe קדשׁ évoque ici la préparation ou consécration rituelle. « Consacrez-vous » est naturel, digne et conserve la portée cultuelle.
- source_word: וַאֲחֵיכֶם
  choice: vous et vos frères
  rationale: Le terme signifie littéralement « vos frères » et désigne, dans le contexte, les autres Lévites apparentés ou membres du même groupe.
- source_word: וְהַעֲלִיתֶם
  choice: faites monter
  rationale: Le causatif de עלה signifie « faire monter ». Cette formulation conserve le mouvement ascendant exprimé par l’hébreu et convient au transport de l’arche.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: l’arche de Yahweh, le Dieu d’Israël
  rationale: La relation avec le nom divin et l’apposition « le Dieu d’Israël » sont toutes deux conservées explicitement.
- source_word: אֶל הֲכִינוֹתִי לוֹ
  choice: jusqu’au lieu que je lui ai préparé
  rationale: Après אֶל, l’hébreu sous-entend la destination. Le contexte montre qu’il s’agit du lieu préparé pour l’arche ; son explicitation est nécessaire à un français clair.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans le remplacer silencieusement par un titre.
- issue: Sens rituel de הִתְקַדְּשׁוּ
  choice: Consacrez-vous
  alternative: Sanctifiez-vous
  rationale: Le contexte concerne la préparation rituelle des Lévites au transport de l’arche. « Consacrez-vous » exprime cette mise à part sans ajouter de précision rituelle absente du verset.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe directe du discours est conservée. « Maisons ancestrales » rend la structure familiale ancienne sans calque obscur, tandis que « faites monter » maintient la nuance directionnelle de l’hébreu.
