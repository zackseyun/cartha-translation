base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/027.yaml
  text: David was clothed with a robe of fine linen[a], as were all the Levites who were carrying the ark, and the singers, and Chenaniah, the leader of the singing of the singers; and on David was a linen ephod.
translation:
  language: fr
  text: David était revêtu d’un manteau de lin fin, de même que tous les lévites qui portaient l’arche, les chanteurs et Kenania, le chef du chant[a]. David portait aussi un éphod de lin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Kenania, le responsable du transport », ou « le chef de la musique ». L’expression hébraïque est difficile.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְכֻרְבָּל בִּמְעִיל בּוּץ
  choice: était revêtu d’un manteau de fin lin
  rationale: Le participe passif décrit David vêtu d’un vêtement extérieur. « Revêtu » convient au registre cérémoniel, tandis que « manteau de fin lin » rend le type de vêtement et la qualité de la matière.
- source_word: הַלְוִיִּם הַנֹּשְׂאִים אֶת הָאָרוֹן
  choice: les lévites qui portaient l’arche
  rationale: Le participe exprime l’action en cours pendant la procession. « Porter » est clair et naturel en français.
- source_word: הַמְשֹׁרְרִים
  choice: les chanteurs
  rationale: Le terme désigne spécifiquement ceux qui chantent, plutôt que les musiciens en général.
- source_word: כְנַנְיָה
  choice: Kenania
  rationale: Translittération française claire du nom hébreu, sans ajout d’un h final non prononcé.
- source_word: הַשַּׂר
  choice: le chef chargé de
  rationale: Le mot désigne ici un responsable. Cette formulation française exprime naturellement sa fonction de direction.
- source_word: הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: du chant des chanteurs
  rationale: Cette lecture comprend מַשָּׂא comme l’élévation de la voix ou la conduite du chant. La construction hébraïque reste difficile; les autres analyses sont signalées en note.
- source_word: אֵפוֹד בָּד
  choice: un éphod de lin
  rationale: « Éphod » conserve le nom du vêtement cultuel particulier sans lui attribuer une portée sacerdotale que le verset n’explicite pas.
- source_word: וְעַל דָּוִיד
  choice: David portait aussi
  rationale: La tournure idiomatique indique que l’éphod était sur David. « Aussi » maintient la distinction entre ce vêtement et le manteau déjà mentionné.
theological_decisions:
- issue: Nature de la tenue de David dans un cadre liturgique
  choice: Conserver « éphod » comme nom du vêtement, sans qualifier celui-ci de sacerdotal.
  alternative: Traduire par « vêtement sacerdotal » ou en déduire que David exerçait ici une fonction de prêtre.
  rationale: Le texte décrit ce que David portait, mais ne formule aucune affirmation explicite sur une charge sacerdotale.
- issue: Construction difficile הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: « le chef chargé du chant des chanteurs », avec une note exposant l’incertitude
  alternative: « le responsable du transport » ou « le chef de la musique »
  rationale: מַשָּׂא peut évoquer le port ou le transport, mais a aussi été compris ici en rapport avec l’élévation de la voix. La note préserve l’ambiguïté du texte massorétique au lieu de la dissimuler.
translation_notes:
  register: Français international moderne, clair et digne. La phrase hébraïque très longue est divisée en deux pour faciliter la lecture, sans supprimer le lien entre le manteau et l’éphod supplémentaire.
