revisions:
- from: David était revêtu d’un manteau de fin lin, de même que tous les lévites qui portaient l’arche, les chanteurs et Kenania, le chef chargé du chant des chanteurs[a]. David portait aussi un éphod de lin.
  to: David était revêtu d’un manteau de lin fin, de même que tous les lévites qui portaient l’arche, les chanteurs et Kenania, le chef du chant[a]. David portait aussi un éphod de lin.
  rationale: La révision remplace une expression française lourde et interprétativement trop étroite par « le chef du chant », lecture possible de la séquence difficile, et conserve dans la note les principales alternatives, notamment celle du transport. « Lin fin » améliore l’idiomaticité française. La division en deux phrases et la distinction entre le manteau et l’éphod sont maintenues.
