base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/018.yaml
  text: 'And with them were their brothers of the second rank: Zechariah[a], Ben-Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Eliphelehu, and Mikneiah, and Obed-edom, and Jeiel, the gatekeepers.'
translation:
  language: fr
  text: Avec eux se trouvaient leurs frères de second rang :[a] Zacharie, Ben[b], Yaaziel, Shemiramoth, Yehiel, Ounni, Éliab, Benaya, Maaséya, Mattitya, Éliphéléhou, Miknéya, Obed-Édom et Yéiel, les portiers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs frères du deuxième groupe » ou « du second ordre ». L’expression hébraïque distingue probablement un rang ou un groupe secondaire parmi les lévites ou les musiciens.
    reason: lexical_alternative
  - marker: b
    text: La liste hébraïque est difficile à cet endroit. Elle peut être lue comme donnant « Ben » séparément avant Yaaziel ; certaines interprétations rattachent toutefois ces éléments autrement, notamment sous la forme « Ben-Yaaziel ».
    reason: textual_or_syntactical_ambiguity
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Avec eux se trouvaient
  rationale: La proposition hébraïque est sans verbe exprimé. « Se trouvaient » restitue naturellement en français l’idée d’accompagnement.
- source_word: אֲחֵיהֶם
  choice: leurs frères
  rationale: Le sens littéral est « leurs frères » ; dans ce contexte, il s’agit de leurs frères lévites ou de leurs compagnons de service.
- source_word: הַמִּשְׁנִים
  choice: de second rang
  rationale: Le terme dérive de l’idée de « second » et distingue vraisemblablement un groupe ou un rang secondaire, sans préciser davantage sa fonction.
- source_word: זְכַרְיָהוּ בֵּן וְיַעֲזִיאֵל
  choice: Zacharie, Ben, Yaaziel
  rationale: Le texte hébreu transmis présente בֵּן entre Zacharie et Yaaziel, avec une conjonction devant Yaaziel. La traduction conserve donc Ben comme élément distinct tout en signalant en note l’incertitude de la liste.
- source_word: הַשֹּׁעֲרִים
  choice: les portiers
  rationale: Le pluriel défini désigne ceux qui gardent les portes et se rapporte naturellement aux deux derniers noms, Obed-Édom et Yéiel.
