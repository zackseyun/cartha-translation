source:
  edition: WLC
  text: וּ/כְנַנְיָ֥הוּ שַֽׂר הַ/לְוִיִּ֖ם בְּ/מַשָּׂ֑א יָסֹר֙ בַּ/מַּשָּׂ֔א כִּ֥י מֵבִ֖ין הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/022.yaml
  text: And Chenaniah[a], chief of the Levites, directed the carrying[b], because he was skillful at it.
translation:
  language: fr
  text: Kenania, chef des Lévites chargé du transport[a], dirigeait le transport[b], car il était compétent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Kenania, chef des Lévites chargé du chant, dirigeait le chant, car il s’y connaissait ». Le mot hébreu traduit par « transport » signifie habituellement « charge » ou « transport », mais certains lui donnent ici un sens musical en raison des chanteurs et des musiciens mentionnés dans le contexte.
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu répète le même terme : « dans le transport … dans le transport ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְנַנְיָהוּ
  choice: Kenania
  rationale: Transcription française courante du nom hébreu, sous une forme naturelle dans un texte biblique français.
- source_word: שַׂר הַלְוִיִּם
  choice: chef des Lévites
  rationale: Dans ce contexte cultuel et administratif, שַׂר désigne un responsable placé à la tête d’un groupe.
- source_word: בְּמַשָּׂא
  choice: chargé du transport
  rationale: מַשָּׂא signifie habituellement « charge, fardeau, transport ». La formulation française explicite naturellement la responsabilité de Kenania tout en gardant le sens concret le plus direct.
- source_word: יָסֹר
  choice: donnait des instructions
  rationale: Le verbe exprime ici l’action d’instruire ou de diriger. Cette traduction préserve l’idée d’une supervision active sans préciser davantage la fonction.
- source_word: בַּמַּשָּׂא
  choice: pour le transport
  rationale: La répétition du même nom hébreu est conservée dans le corps du texte, car elle rattache explicitement les instructions de Kenania à sa responsabilité.
- source_word: כִּי מֵבִין הוּא
  choice: car il était compétent
  rationale: Le participe de בין peut désigner ici une personne qui comprend bien une tâche et sait l’accomplir. « Compétent » rend ce sens pratique avec sobriété.
theological_decisions:
- issue: Sens de מַשָּׂא dans un contexte où figurent aussi des chanteurs et des musiciens
  choice: transport
  alternative: chant
  rationale: Le sens lexical ordinaire de מַשָּׂא est « charge, fardeau » et, par extension, « transport ». Le contexte plus large du déplacement de l’arche favorise ce sens, mais la lecture musicale demeure possible et est signalée sans être imposée.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « transport » reflète volontairement celle de l’hébreu; « donnait des instructions » rend la fonction de direction sans employer un vocabulaire administratif trop technique.
