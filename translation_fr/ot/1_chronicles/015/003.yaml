  source_fidelity: 'Le sens fondamental est bien rendu : David convoque tout Israël à Jérusalem afin d’y faire monter l’arche de Yahweh vers le lieu qu’il avait préparé. « Faire monter » rend adéquatement le hifil de עלה. La note, toutefois, attribue de façon trop catégorique l’alternative masculine à Yahweh : le suffixe hébreu לוֹ peut aussi renvoyer à l’arche, qui est grammaticalement masculine en hébreu.'
