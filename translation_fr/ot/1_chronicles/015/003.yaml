  text: וַ/יַּקְהֵ֥ל דָּוִ֛יד אֶת כָּל יִשְׂרָאֵ֖ל אֶל יְרֽוּשָׁלִָ֑ם לְ/הַעֲלוֹת֙ אֶת אֲר֣וֹן יְהוָ֔ה אֶל מְקוֹמ֖/וֹ אֲשֶׁר הֵכִ֥ין לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/003.yaml
  text: And David assembled all Israel at Jerusalem to bring up the ark of Yahweh to its place[b][a], which he had prepared for it.
translation:
  language: fr
  text: David rassembla tout Israël à Jérusalem pour faire monter l’arche de Yahweh à l’endroit qu’il avait préparé pour elle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il avait préparé pour lui ». Le suffixe hébreu masculin peut renvoyer à l’arche, qui est masculine en hébreu, ou, selon une autre lecture, à Yahweh. Dans le contexte, il est le plus naturellement compris comme désignant l’arche.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: rassembla
  rationale: Le hifil de קהל exprime ici le fait de réunir un groupe. « Rassembla » est naturel en français et convient à cette convocation publique.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Cette expression collective désigne la nation, éventuellement représentée par ses membres convoqués. La formulation française conserve l’expression sans l’expliciter indûment.
- source_word: אֶל יְרוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition אֶל marque normalement la direction vers un lieu. Avec « rassembler », le français « à Jérusalem » exprime naturellement à la fois le lieu visé et celui du rassemblement.
- source_word: לְהַעֲלוֹת
  choice: afin de faire monter
  rationale: Le hifil de עלה signifie faire monter ou amener vers le haut. « Faire monter » préserve cette nuance géographique et cultuelle, tandis que « afin de » rend clairement le but.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: La construction nominale est rendue directement. « Arche » est le terme français biblique courant pour ce coffre sacré, et le nom divin est conservé comme nom propre.
- source_word: אֶל מְקוֹמוֹ
  choice: jusqu’à son emplacement
  rationale: Le suffixe renvoie le plus naturellement à l’arche. « Emplacement » convient à un lieu précis préparé pour la recevoir, et « jusqu’à » rend la destination du déplacement sans ajouter l’idée non exprimée d’un emplacement « légitime » ou « définitif ».
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: qu’il avait préparé pour elle
  rationale: Le plus proche référent contextuel est l’arche, féminin en français. Le plus-que-parfait indique que David avait préparé cet emplacement auparavant. Une note conserve toutefois la possibilité grammaticale que « pour lui » renvoie à Yahweh.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le tétragramme comme nom personnel. « Yahweh » le représente directement au lieu de lui substituer un titre, sans introduire d’interprétation confessionnelle.
- issue: Référent du suffixe dans לוֹ
  choice: l’arche (« pour elle »)
  alternative: Yahweh (« pour lui »)
  rationale: Dans le contexte immédiat, l’emplacement a été préparé pour recevoir l’arche. Toutefois, le suffixe hébreu masculin peut aussi être compris comme renvoyant à Yahweh; cette ambiguïté réelle est signalée en note.
translation_notes:
  register: Français moderne, clair et digne. « Tout Israël » conserve l’expression collective biblique; « faire monter » garde la nuance du verbe hébreu sans rendre la phrase artificiellement archaïque.
