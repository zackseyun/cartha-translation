base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/021.yaml
  text: and Mattithiah[a], Eliphelehu, Mikneiah, Obed-edom, Jeiel, and Azaziah were to lead with lyres according to the Sheminith.
translation:
  language: fr
  text: Mattithyahou, Éliphéléhou, Miknéyahou, Obed-Édom, Yéïel et Azazyahou étaient chargés de diriger avec des lyres selon la Sheminith[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la huitième » ou « dans l’octave inférieure ». L’expression hébraïque traduite par « selon la Sheminith » est un terme musical dont le sens précis est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתִּתְיָהוּ
  choice: Mattitia
  rationale: Nom propre translittéré sous une forme française lisible, en conservant les principaux éléments consonantiques de l’hébreu.
- source_word: אֱלִיפְלֵהוּ
  choice: Éliféléhou
  rationale: Translittération française qui conserve la finale hébraïque -hou.
- source_word: מִקְנֵיָהוּ
  choice: Miknéyahou
  rationale: Translittération qui rend le nom hébreu et son élément théophore final sans passer par la forme anglaise.
- source_word: עֹבֵד אֱדֹם
  choice: Obed-Édom
  rationale: Nom composé translittéré et relié par un trait d’union pour faciliter la lecture.
- source_word: יעִיאֵל
  choice: Yéïel
  rationale: Translittération française distinguant les voyelles successives par un tréma.
- source_word: עֲזַזְיָהוּ
  choice: Azazyahou
  rationale: Translittération française conservant la finale théophore -yahou.
- source_word: בְּכִנֹּרוֹת
  choice: jouaient des lyres
  rationale: כִּנּוֹר désigne un instrument à cordes de type lyre; la préposition ב est instrumentale. Le verbe «jouaient» est fourni naturellement par le contexte de la liste de musiciens.
- source_word: עַל הַשְּׁמִינִית
  choice: selon la Sheminith
  rationale: Il s’agit d’une indication musicale technique dont le sens précis demeure incertain; la translittération préserve cette incertitude.
- source_word: לְנַצֵּחַ
  choice: pour diriger
  rationale: Dans un contexte musical, נצח peut exprimer la direction ou la conduite de l’exécution; l’infinitif final est rendu comme une indication de fonction ou de but.
