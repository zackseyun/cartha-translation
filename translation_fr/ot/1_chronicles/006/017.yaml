source:
  edition: WLC
  text: וַ/יִּהְי֨וּ מְשָׁרְתִ֜ים לִ/פְנֵ֨י מִשְׁכַּ֤ן אֹֽהֶל מוֹעֵד֙ בַּ/שִּׁ֔יר עַד בְּנ֧וֹת שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם וַ/יַּעַמְד֥וּ כְ/מִשְׁפָּטָ֖/ם עַל עֲבוֹדָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/017.yaml
  text: They were ministering before the tabernacle[a], the tent of meeting, with song until Solomon built the house of Yahweh in Jerusalem[c][b], and they stood according to their ordinance over their service.
translation:
  language: fr
  text: Ils assuraient le service devant le tabernacle, la tente de la rencontre, en chantant[a], jusqu’à ce que Salomon construise la maison de Yahweh[b] à Jérusalem. Ils se tenaient selon leur règle établie pour leur service[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par le chant » ou « avec des chants ».
    reason: La construction hébraïque peut indiquer le moyen ou la manière dont ils assuraient le service.
  - marker: b
    text: La « maison de Yahweh » désigne ici le temple.
    reason: Cette note clarifie le référent sans remplacer dans le texte l’expression hébraïque « maison ».
  - marker: c
    text: 'Littéralement : « ils se tenaient selon leur règle, à leur service ». Le mot traduit par « règle établie » peut aussi signifier « ordre établi » ou « coutume ».'
    reason: La formulation hébraïque est concise et permet plusieurs nuances quant à l’organisation prescrite de leur service.
lexical_decisions:
- source_word: מְשָׁרְתִים
  choice: assuraient le service
  rationale: Le participe désigne l’exercice régulier de fonctions cultuelles. Cette formulation est naturelle en français et convient au contexte liturgique.
- source_word: לִפְנֵי
  choice: devant
  rationale: 'Rend directement la relation spatiale et cultuelle : leur service s’exerçait devant le sanctuaire.'
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: le tabernacle, la tente de la rencontre
  rationale: Les deux désignations hébraïques sont conservées en apposition, sans les fondre en un seul terme.
- source_word: בַּשִּׁיר
  choice: par le chant
  rationale: Exprime le moyen ou la manière de leur service musical, tout en laissant en note les autres nuances possibles de la préposition.
- source_word: עַד בְּנוֹת שְׁלֹמֹה
  choice: jusqu’à ce que Salomon construise
  rationale: L’infinitif construit marque ici le terme de cette organisation; une proposition verbale est la tournure française la plus naturelle.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Conserve l’image hébraïque de la « maison » plutôt que de l’interpréter directement comme « temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: וַיַּעַמְדוּ
  choice: ils se tenaient à leur poste
  rationale: Le verbe signifie littéralement « se tenir » ou « prendre position »; « à leur poste » explicite naturellement sa portée fonctionnelle dans ce contexte.
- source_word: כְמִשְׁפָּטָם
  choice: conformément à la règle fixée
  rationale: מִשְׁפָּט désigne ici vraisemblablement une règle, un ordre établi ou une coutume régissant leur service.
- source_word: עַל עֲבוֹדָתָם
  choice: pour leur service
  rationale: Exprime la relation entre leur position assignée et la tâche cultuelle dont ils avaient la charge, sans imposer l’idée d’une autorité hiérarchique.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre du Dieu d’Israël. Sa transcription préserve cette distinction, tandis que « le SEIGNEUR » substituerait un titre traditionnel.
- issue: Rapport entre la « maison » et le temple
  choice: maison de Yahweh
  alternative: temple de Yahweh
  rationale: La traduction garde le mot concret du texte hébreu et ne remplace pas l’image par l’identification explicative de son référent.
translation_notes:
  register: Français international actuel, digne et accessible. Le vocabulaire cultuel traditionnel est conservé lorsqu’il reste largement intelligible (« tabernacle », « tente de la rencontre »), tandis que la dernière proposition est légèrement explicitée pour produire une phrase française naturelle sans effacer la formulation hébraïque, donnée en note.
