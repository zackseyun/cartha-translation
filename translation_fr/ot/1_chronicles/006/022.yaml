  text: son of Tahath[a], son of Assir, son of Ebiasaph, son of Korah.
translation:
  language: fr
  text: fils de Tahath, fils d’Assir, fils d’Ébiasaph[a], fils de Coré.
  philosophy: optimal-equivalence
  footnotes:
