lexical_decisions:
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette chaîne généalogique, בֶּן exprime la filiation et se rend naturellement par « fils de ». Même si certaines généalogies peuvent omettre des générations, rien dans ce verset n’impose le sens plus large de « descendant de ».
- source_word: תַּחַת
  choice: Tahath
  rationale: Nom propre translittéré en français au plus près de la forme hébraïque.
- source_word: אַסִּיר
  choice: Assir
  rationale: Nom propre translittéré selon une forme française claire et proche de l’hébreu.
- source_word: אֶבְיָסָף
  choice: Ébiasaph
  rationale: Cette forme française reflète de près la forme vocalisée hébraïque ; « Abiasaph » est une variante traditionnelle du même nom.
- source_word: קֹרַח
  choice: Coré
  rationale: Forme française traditionnelle, courante et immédiatement reconnaissable du nom hébreu קֹרַח.
