base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/045.yaml
  text: 'and from the tribe of Benjamin: Geba with its pasturelands[a], Alemeth with its pasturelands, and Anathoth with its pasturelands—all their cities were thirteen cities according to their families.'
translation:
  language: fr
  text: 'Et de la tribu de Benjamin : Guéba avec ses pâturages, Alémeth[a] avec ses pâturages et Anatoth avec ses pâturages. Toutes leurs villes étaient au nombre de treize, selon leurs clans.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « Alémeth » ; dans la liste parallèle de Josué 21.18, on lit « Almon ».
    reason: Signaler la forme différente du nom dans le passage parallèle sans modifier le texte massorétique de 1 Chroniques.
lexical_decisions:
- source_word: וּמִמַּטֵּה בִנְיָמִן
  choice: et, de la tribu de Benjamin
  rationale: מַטֶּה désigne ici la tribu comme division d’Israël. La conjonction et la préposition maintiennent le lien avec l’énumération précédente.
- source_word: גֶּבַע
  choice: Guéba
  rationale: Nom de lieu transcrit selon l’usage biblique français courant.
- source_word: מִגְרָשֶׁיהָ
  choice: avec ses pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts entourant une ville, notamment ceux qui étaient attribués aux villes lévitiques; « pâturages » exprime clairement leur fonction principale.
- source_word: עָלֶמֶת
  choice: Alémeth
  rationale: Le texte massorétique porte עָלֶמֶת; cette forme propre au verset est conservée dans le texte principal plutôt que remplacée par celle de la liste parallèle.
- source_word: עֲנָתוֹת
  choice: Anatoth
  rationale: Nom de lieu transcrit sous sa forme française biblique usuelle.
- source_word: כָּל עָרֵיהֶם שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: Ils avaient en tout treize villes
  rationale: 'Cette formulation française naturelle rend la récapitulation « toutes leurs villes : treize villes » sans laisser entendre que les trois villes nommées dans ce seul verset seraient au nombre de treize.'
- source_word: בְּמִשְׁפְּחוֹתֵיהֶם
  choice: réparties selon leurs clans
  rationale: מִשְׁפָּחוֹת désigne ici les groupes familiaux étendus auxquels les villes étaient attribuées; « clans » est plus précis que « familles » dans ce contexte tribal.
