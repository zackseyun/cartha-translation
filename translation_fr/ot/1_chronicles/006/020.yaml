lexical_decisions:
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette généalogie, בֶּן indique la filiation. La répétition de « fils de » conserve la structure en chaîne de l’hébreu et reste naturelle en français.
- source_word: ציף
  choice: Tsiph
  rationale: Nom propre translittéré en français de manière à refléter la consonne initiale צ et la consonne finale פ.
- source_word: אֶלְקָנָה
  choice: Elqana
  rationale: Nom propre translittéré directement depuis l’hébreu, avec « q » pour ק.
- source_word: מַחַת
  choice: Mahath
  rationale: Nom propre translittéré; « th » représente ici la consonne ת selon une graphie française biblique intelligible.
- source_word: עֲמָשָׂי
  choice: Amasaï
  rationale: Nom propre translittéré en français; le tréma indique que la finale « aï » se prononce en deux éléments.
