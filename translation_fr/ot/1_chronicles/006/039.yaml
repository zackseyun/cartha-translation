base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/039.yaml
  text: These were their dwelling places according to their settlements within their territory[a], for the sons of Aaron, of the family of the Kohathites; for the lot was theirs.
translation:
  language: fr
  text: Voici les lieux d’habitation des fils d’Aaron, de la famille des Qehatites, selon leurs localités, dans leur territoire[a], car le lot leur appartenait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon leurs campements » ou « selon leurs enceintes » pour « selon leurs localités ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבוֹתָם
  choice: les lieux d’habitation
  rationale: Le nom désigne les endroits où l’on réside. « Lieux d’habitation » reste concret, clair et proche de l’hébreu.
- source_word: לְטִירוֹתָם
  choice: avec leurs campements
  rationale: טִירָה peut désigner un campement, une localité ou une enceinte. « Campements » convient au cadre ancien sans exclure l’idée d’implantations établies; les autres possibilités sont signalées en note.
- source_word: בִּגְבוּלָם
  choice: dans leur territoire
  rationale: גְּבוּל désigne ici l’espace territorial délimité plutôt que la seule ligne frontalière.
- source_word: לִבְנֵי אַהֲרֹן
  choice: des fils d’Aaron
  rationale: Cette tournure conserve la désignation familiale et sacerdotale traditionnelle tout en s’intégrant naturellement à la phrase française.
- source_word: לְמִשְׁפַּחַת הַקְּהָתִי
  choice: du clan des Qehatites
  rationale: מִשְׁפָּחָה désigne ici une subdivision familiale ou clanique, et le gentilé singulier hébreu a un sens collectif.
- source_word: כִּי לָהֶם הָיָה הַגּוֹרָל
  choice: car le lot leur appartenait
  rationale: Cette formulation rend directement la construction possessive hébraïque et conserve l’image du partage par tirage au sort sans ajouter que le lot « tomba » sur eux.
theological_decisions: []
