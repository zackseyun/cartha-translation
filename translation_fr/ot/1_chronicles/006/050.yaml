base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/050.yaml
  text: They assigned by lot from the tribe of the sons of Judah[a], and from the tribe of the sons of Simeon, and from the tribe of the sons of Benjamin, these cities, which they called by name.
translation:
  language: fr
  text: Ils attribuèrent par tirage au sort, de la tribu des descendants de Juda, de celle des descendants de Siméon et de celle des descendants de Benjamin, les villes suivantes, dont ils citèrent les noms[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’ils appelleront par des noms ». Cette formule introduit la liste des villes nommées qui suit.'
    reason: La tournure hébraïque, avec « appeler » et le pluriel « noms », est idiomatique dans ce contexte. « Dont ils citèrent les noms » en rend la fonction sans imposer une interprétation plus précise du sujet ou de la nuance verbale.
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ils attribuèrent
  rationale: Le verbe signifie littéralement « donner », mais, dans le contexte de la répartition des villes lévitiques, « attribuer » exprime naturellement l'acte administratif sans en modifier le sens.
- source_word: בַגּוֹרָל
  choice: par tirage au sort
  rationale: Cette expression française courante rend clairement le procédé de répartition indiqué par גּוֹרָל.
- source_word: מִמַּטֵּה בְנֵי
  choice: sur les territoires des tribus des descendants de
  rationale: מַטֶּה désigne ici la tribu, et בְנֵי ses membres ou descendants. L'ajout de « territoires » explicite que les villes proviennent des domaines tribaux, idée qu'impose le contexte de l'attribution des villes, sans suggérer que les tribus elles-mêmes sont attribuées.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: les villes suivantes
  rationale: Le démonstratif annonce la liste qui suit; « suivantes » est naturel en français dans cette fonction cataphorique.
- source_word: אֲשֶׁר יִקְרְאוּ אֶתְהֶם בְּשֵׁמוֹת
  choice: désignées par leur nom
  rationale: La formule hébraïque emploie קרא, « appeler », avec « par des noms ». Cette formulation française conserve l'idée de nomination tout en annonçant naturellement une liste.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La phrase évite le calque lourd « tribus des fils de » au profit de « tribus des descendants de » et clarifie discrètement la provenance territoriale des villes.
