lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Nom de lieu transcrit selon sa forme française biblique usuelle.
- source_word: מִגְרָשֶׁיהָ
  choice: ses terres de pâturage
  rationale: Dans le contexte des villes lévitiques, מִגְרָשׁ désigne les terrains ouverts rattachés à une ville, notamment destinés au bétail. Cette formulation est claire en français moderne et conserve la fonction concrète de ces terres.
- source_word: יַעְזֵיר
  choice: Yazer
  rationale: Nom de lieu transcrit sous une forme française naturelle, le y initial représentant le yod hébreu.
- source_word: וְאֶת
  choice: et / ainsi que
  rationale: La conjonction répétée et le marqueur d’objet structurent l’énumération. Le marqueur d’objet ne se traduit pas directement; une légère variation évite une succession pesante tout en maintenant la liste.
