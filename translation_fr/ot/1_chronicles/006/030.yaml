lexical_decisions:
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette généalogie, בֶּן exprime une relation de filiation immédiate ou plus largement généalogique. La répétition de « fils de » conserve la formule hébraïque et s’intègre naturellement à la liste.
- source_word: חֲשַׁבְיָה
  choice: Hashabia
  rationale: Le nom propre est translittéré selon sa forme française biblique courante, sans traduire sa signification.
- source_word: אֲמַצְיָה
  choice: Amatsia
  rationale: Cette translittération française courante représente le nom hébreu et évite de passer par sa forme anglaise.
- source_word: חִלְקִיָּה
  choice: Hilkia
  rationale: La forme française biblique courante préserve la reconnaissance du personnage tout en représentant directement le nom hébreu.
