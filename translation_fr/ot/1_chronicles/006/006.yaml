- source_word: עִדּוֹ
  choice: Iddo
  rationale: Transcription française usuelle de ce nom propre.
- source_word: זֶרַח
  choice: Zérah
  rationale: Transcription du nom propre qui rend la première voyelle et la consonne finale sans traduire le nom.
- source_word: יְאָתְרַי
  choice: Yeatraï
  rationale: Transcription française proche de la vocalisation massorétique ; le tréma indique que la voyelle finale se prononce séparément.
