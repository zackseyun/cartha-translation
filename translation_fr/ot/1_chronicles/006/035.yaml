  text: וְ/אֵ֖לֶּה בְּנֵ֣י אַהֲרֹ֑ן אֶלְעָזָ֥ר בְּנ֛/וֹ פִּֽינְחָ֥ס בְּנ֖/וֹ אֲבִישׁ֥וּעַ בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/035.yaml
  text: 'And these were the sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son.'
translation:
  language: fr
  text: 'Voici les fils d’Aaron : Éléazar, son fils ; Phinéas, son fils ; Abishua, son fils.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: La formule hébraïque introduit une liste généalogique. « Voici » rend naturellement cette fonction présentative en français, sans imposer un temps verbal absent de l’expression nominale.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le contexte énumère une succession filiale directe ; « fils » conserve donc le sens généalogique précis plutôt que le sens plus large de « descendants ».
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Forme française biblique usuelle du nom propre.
- source_word: אֶלְעָזָר
  choice: Éléazar
  rationale: Forme française biblique usuelle du nom propre.
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le nom avec suffixe masculin singulier indique, à chaque étape, la filiation directe avec l’homme nommé juste avant.
- source_word: פִּינְחָס
  choice: Phinéas
  rationale: Forme française biblique traditionnelle et largement reconnue du nom hébreu.
- source_word: אֲבִישׁוּעַ
  choice: Abishua
  rationale: Translittération française claire et proche de l’hébreu, également attestée dans l’usage biblique francophone.
