base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/055.yaml
  text: 'And from the half-tribe of Manasseh: Aner with its pasturelands[a], and Bileam with its pasturelands, for the clan of the remaining sons of Kohath.'
translation:
  language: fr
  text: 'Et de la demi-tribu de Manassé : Aner avec ses terres de pâturage, et Biléam avec ses terres de pâturage, pour le clan des fils de Qehath qui restaient.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  choice: De la demi-tribu de Manassé
  rationale: מַחֲצִית désigne une moitié et מַטֶּה une tribu dans ce contexte territorial. « Demi-tribu » est la formulation française courante et concise.
- source_word: אֶת עָנֵר
  choice: Aner
  rationale: Le nom de lieu est translittéré sans être traduit.
- source_word: מִגְרָשֶׁיהָ
  choice: ses terres de pâturage
  rationale: מִגְרָשׁ désigne les terrains ouverts dépendant d’une ville, notamment ceux qui étaient attribués aux Lévites. « Terres de pâturage » exprime clairement leur fonction probable.
- source_word: בִּלְעָם
  choice: Biléam
  rationale: Cette forme suit directement le texte consonantique massorétique בִּלְעָם, avec une accentuation adaptée au français.
- source_word: לְמִשְׁפַּחַת לִבְנֵי קְהָת הַנּוֹתָרִים
  choice: pour la famille des autres fils de Qehath
  rationale: Le singulier מִשְׁפַּחַת est conservé par « famille ». הַנּוֹתָרִים désigne ici ceux qui restent après les attributions précédentes; « les autres » est naturel en français tout en gardant cette relation contextuelle. « Fils » préserve le terme généalogique בְנֵי.
theological_decisions: []
translation_notes:
  register: 'Français moderne, digne et lisible. La structure de liste du texte hébreu est conservée après les deux-points. La graphie « Qehath » rend le nom קְהָת de manière cohérente et évite de le confondre avec une traduction. Aucune note textuelle n’est ajoutée : l’affirmation de la couche anglaise selon laquelle Josué 21.25 lirait « Ibleam » ne correspond pas au texte massorétique de ce passage, qui porte Taanak et Gath-Rimmôn.'
