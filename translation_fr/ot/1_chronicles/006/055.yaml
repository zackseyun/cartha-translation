  source_fidelity: La traduction rend correctement la demi-tribu, les deux localités et leurs terrains attenants. Toutefois, « les autres fils » atténue la valeur de הַנּוֹתָרִים, qui signifie « les fils restants » / « ceux qui restaient », non simplement « les autres ». La conjonction initiale est également présente dans l’hébreu.
  naturalness: « Clan » est plus précis et naturel que « famille » dans ce contexte d’organisation lévitique, où מִשְׁפָּחָה désigne un groupe clanique. La formulation révisée demeure fluide en français moderne.
  terminology: '« Terres de pâturage » rend convenablement מִגְרָשֶׁיהָ. Les noms Aner, Biléam, Manassé et Qehath sont conservés. Aucune note sur Josué 21.25 n’est ajoutée : le texte massorétique de ce verset parallèle ne porte pas « Ibleam ».'
