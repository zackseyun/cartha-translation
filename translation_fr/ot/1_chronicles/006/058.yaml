lexical_decisions:
- source_word: רָאמוֹת
  choice: Ramoth
  rationale: Nom de lieu transcrit sous sa forme française traditionnelle plutôt que traduit.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: Dans le contexte des villes lévitiques, מִגְרָשׁ désigne les terrains ouverts rattachés à une ville, notamment destinés au pâturage. Le suffixe féminin singulier renvoie chaque fois à la ville concernée.
- source_word: עָנֵם
  choice: Anem
  rationale: Transcription du nom de lieu עָנֵם tel qu’il figure dans le texte massorétique.
- source_word: וְאֶת
  choice: et
  rationale: La conjonction est rendue naturellement en français, tandis que la particule qui marque le complément d’objet direct n’a pas d’équivalent explicite.
