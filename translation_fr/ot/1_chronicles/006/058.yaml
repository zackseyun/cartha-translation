  register: 'Formulation simple, actuelle et digne. La répétition de « avec ses pâturages » conserve la structure distributive de l’hébreu. La note anglaise fournie n’a pas été reprise : elle semble déplacée ou incohérente avec ce verset, puisque le texte hébreu porte bien « Anem » et que la référence indiquée à Josué 21.25 ne constitue pas ici un parallèle direct fiable.'
