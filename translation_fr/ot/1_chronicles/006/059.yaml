  text: וּ/מִ/מַּטֵּ֣ה אָשֵׁ֔ר אֶת מָשָׁ֖ל וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת עַבְדּ֖וֹן וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/059.yaml
  text: 'and from the tribe of Asher: Mashal with its pasturelands[a], and Abdon with its pasturelands.'
translation:
  language: fr
  text: 'et de la tribu d’Aser : Mashal[a] avec ses pâturages, et Abdon avec ses pâturages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte des Chroniques porte « Mashal » ; dans la liste parallèle de Josué 21.30, le nom est « Mishal ».
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: et, de la tribu de
  rationale: Dans le contexte du partage territorial, מַטֶּה désigne une tribu. La conjonction et la préposition sont rendues par « et, de ».
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forme française traditionnelle et courante du nom de la tribu d’Asher.
- source_word: אֶת מָשָׁל
  choice: Mashal
  rationale: Le marqueur d’objet direct אֶת ne se traduit pas. Le toponyme suit ici la forme massorétique propre aux Chroniques; la variante de Josué 21.30 est signalée en note.
- source_word: מִגְרָשֶׁיהָ
  choice: avec ses pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts attenants à une ville, notamment destinés au bétail dans les listes de villes lévitiques. « Pâturages » est clair et naturel en français moderne; le suffixe féminin renvoie à la ville.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Transcription française usuelle du toponyme.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe fragmentaire de la liste est conservée, puisqu’elle prolonge les versets précédents. « Pâturages » est préféré à « banlieues » ou « terrains communaux », moins précis dans ce contexte.
