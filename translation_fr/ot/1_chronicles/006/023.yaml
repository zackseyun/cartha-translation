  text: fils de Jitsehar, fils de Kehath, fils de Lévi, fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire Jacob, désigné ici par le nom d’Israël.
    reason: Identifie le personnage tout en conservant dans le texte principal le nom hébreu effectivement employé, sans ajouter de qualification théologique.
lexical_decisions:
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette formule généalogique répétée, « fils de » rend naturellement et fidèlement le terme hébreu. Même si certaines généalogies bibliques peuvent omettre des générations, rien dans ce verset n’impose ici la formulation plus large « descendant de ».
- source_word: יִצְהָר
  choice: Yitsehar
  rationale: Transcription française usuelle du nom hébreu, qui en représente mieux la forme que la graphie anglaise « Izhar ».
- source_word: קְהָת
  choice: Kehath
  rationale: Transcription française traditionnelle et reconnaissable du nom propre hébreu.
- source_word: לֵוִי
  choice: Lévi
  rationale: Forme française établie du nom propre.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte hébreu porte explicitement « Israël », et non « Jacob » ; le nom source est donc conservé dans le texte principal.
theological_decisions: []
translation_notes:
  register: Formulation généalogique concise, digne et naturelle en français moderne. La répétition de « fils de » est conservée afin de reproduire la structure et le rythme de l’hébreu. Le marqueur de note est placé après « Israël », terme auquel la note se rapporte.
