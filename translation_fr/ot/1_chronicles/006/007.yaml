  text: בְּנֵ֖י קְהָ֑ת עַמִּינָדָ֣ב בְּנ֔/וֹ קֹ֥רַח בְּנ֖/וֹ אַסִּ֥יר בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/007.yaml
  text: 'The sons of Kohath: Amminadab his son[a], Korah his son, Assir his son.'
translation:
  language: fr
  text: 'Les fils de Qehath : Amminadab, son fils[a], Coré, son fils, Assir, son fils.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans des généalogies parallèles, l’ancêtre correspondant est appelé Yitsehar plutôt qu’Amminadab ; le texte hébreu porte ici Amminadab.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן introduit la généalogie. « Les fils de » conserve la formulation hébraïque, sans élargir inutilement le sens à « descendants ».
- source_word: קְהָת
  choice: Qehath
  rationale: Translittération française usuelle du nom propre, avec « Q » pour rendre la consonne initiale hébraïque.
- source_word: עַמִּינָדָב
  choice: Amminadab
  rationale: Translittération française traditionnelle du nom propre. Le texte hébreu de cette édition porte bien Amminadab, même si des généalogies parallèles donnent un autre nom.
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le nom singulier avec suffixe masculin singulier marque chaque étape de la filiation. « Son fils » reproduit directement la chaîne généalogique et sa répétition.
- source_word: קֹרַח
  choice: Coré
  rationale: Forme française biblique traditionnelle et largement reconnaissable du nom propre hébreu.
- source_word: אַסִּיר
  choice: Assir
  rationale: Translittération du nom propre ; son éventuel sens lexical n’est pas traduit dans ce contexte généalogique.
