source:
  edition: WLC
  text: וּ/בְנֵ֧י מְרָרִ֛י אֲחֵי/הֶ֖ם עַֽל הַ/שְּׂמֹ֑אול אֵיתָן֙ בֶּן קִישִׁ֔י בֶּן עַבְדִּ֖י בֶּן מַלּֽוּךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/029.yaml
  text: 'And the sons of Merari[a], their brothers, were on the left: Ethan son of Kishi, son of Abdi, son of Malluch.'
translation:
  language: fr
  text: 'Les fils de Merari, leurs frères[a], étaient à gauche : Étân, fils de Qishi, fils d’Abdi, fils de Mallouk.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les membres de leur clan » ; dans les généalogies, le mot hébreu traduit par « frères » peut désigner plus largement des membres du même groupe familial.
    reason: 'Alternative lexicale : le sens d’אֲחֵיהֶם peut dépasser celui de frères biologiques.'
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: בני signifie littéralement « fils de » et peut aussi désigner les descendants ou les membres d’une lignée. Dans cette liste généalogique, « les fils de » conserve la forme hébraïque tout en restant naturel en français.
- source_word: מְרָרִי
  choice: Merari
  rationale: Translittération française usuelle de ce nom propre.
- source_word: אֲחֵיהֶם
  choice: leurs frères
  rationale: אחים désigne d’abord des frères, mais peut s’étendre à des parents ou à des membres du même groupe familial. Le texte principal conserve l’image familiale de l’hébreu, tandis que la note signale son sens potentiellement plus large.
- source_word: עַל הַשְּׂמֹאול
  choice: étaient à gauche
  rationale: L’expression signifie littéralement « sur/à la gauche ». Le verbe « étaient » est ajouté pour rendre en français la proposition elliptique de l’hébreu sans préciser davantage le repère spatial.
- source_word: אֵיתָן
  choice: Étân
  rationale: Translittération adaptée aux conventions du français moderne.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette chaîne généalogique, בן se rend naturellement par « fils de ». Le terme peut parfois désigner un descendant plus éloigné, mais le texte ne contraint pas à expliciter cette possibilité.
- source_word: קִישִׁי
  choice: Qishi
  rationale: Translittération française du nom hébreu, distinguant la consonne initiale qoph.
- source_word: עַבְדִּי
  choice: Abdi
  rationale: Translittération française directe du nom propre.
- source_word: מַלּוּךְ
  choice: Mallouk
  rationale: Translittération française du nom propre, avec « ou » pour représenter la voyelle hébraïque.
