  yaml_path: translation/ot/1_chronicles/006/044.yaml
  text: Ashan with its pasturelands[a], and Beth-shemesh with its pasturelands.
translation:
  language: fr
  text: Ashân avec ses pâturages[a], et Beth-Shémesh avec ses pâturages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains témoins parallèles et certaines traductions donnent « Aïn » au lieu d’« Ashân » ici ; le texte massorétique des Chroniques porte « Ashân ».
    reason: textual_variant
lexical_decisions:
- source_word: עָשָׁן
  choice: Ashân
  rationale: Nom de lieu translittéré d’après le texte massorétique des Chroniques; l’accent circonflexe aide à représenter la voyelle longue dans la forme française usuelle.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: Dans le contexte des villes lévitiques, le terme désigne les terrains ouverts rattachés à la ville, notamment destinés au bétail; « pâturages » est clair et naturel en français.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Beth-Shémesh
  rationale: Nom propre translittéré plutôt que traduit; la graphie avec trait d’union et accents est lisible en français.
- source_word: וְאֶת
  choice: et
  rationale: La conjonction coordonne les éléments de la liste; le marqueur hébreu de l’objet direct n’a pas d’équivalent explicite nécessaire en français.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La structure brève de la liste hébraïque est conservée, avec des noms de lieux translittérés et une formulation naturelle.
