  text: וְ/לִ/בְנֵ֨י גֵרְשׁ֜וֹם לְ/מִשְׁפְּחוֹתָ֗/ם מִ/מַּטֵּ֣ה יִ֠שָׂשכָר וּ/מִ/מַּטֵּ֨ה אָשֵׁ֜ר וּ/מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וּ/מִ/מַּטֵּ֤ה מְנַשֶּׁה֙ בַּ/בָּשָׁ֔ן עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/047.yaml
  text: 'And to the sons of Gershom[a], according to their clans, from the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali[b], and from the tribe of Manasseh in Bashan: thirteen cities.'
translation:
  language: fr
  text: Aux fils de Guershom[a], selon leurs clans, on attribua, de la tribu d’Issacar, de la tribu d’Aser, de la tribu de Nephtali et de la tribu de Manassé en Basan[b], treize villes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici « Guershom » ; de nombreuses traductions emploient « Guershon », forme traditionnelle du nom de ce clan.
    reason: alternative_reading
  - marker: b
    text: Certaines traductions précisent « la demi-tribu de Manassé en Basan » ; le terme « demi-tribu » ne figure pas dans l’hébreu de ce verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Aux fils de
  rationale: La préposition לְ introduit les bénéficiaires de cette attribution. « Fils de » conserve l’expression généalogique hébraïque tout en étant naturel dans ce contexte.
- source_word: גֵרְשׁוֹם
  choice: Guershom
  rationale: Cette forme suit la graphie hébraïque précise du verset, גֵרְשׁוֹם, plutôt que la forme traditionnelle « Guershon » rencontrée ailleurs.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: selon leurs clans
  rationale: Dans ce cadre tribal et administratif, מִשְׁפָּחוֹת désigne les subdivisions claniques plutôt que les seules familles nucléaires.
- source_word: מִמַּטֵּה
  choice: de la tribu de
  rationale: Dans un contexte de répartition territoriale, מַטֶּה signifie « tribu ». La répétition de la formule hébraïque est conservée.
- source_word: מְנַשֶּׁה בַּבָּשָׁן
  choice: Manassé en Basan
  rationale: L’hébreu dit simplement « Manassé en Basan ». La traduction n’ajoute donc pas « demi-tribu », même si cette précision géographique est souvent explicitée.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: treize villes
  rationale: Traduction directe du groupe nominal hébreu, avec le nombre écrit en toutes lettres conformément au registre biblique.
- source_word: יִשָׂשכָר / אָשֵׁר / נַפְתָּלִי
  choice: Issacar / Aser / Nephtali
  rationale: Formes françaises bibliques largement reconnues des noms de tribus.
theological_decisions:
- issue: Identification de la portion de Manassé située en Basan
  choice: Manassé en Basan
  alternative: la demi-tribu de Manassé en Basan
  rationale: Le contexte permet de comprendre qu’il s’agit de la portion transjordanienne de Manassé, mais le mot « demi-tribu » ne figure pas dans ce verset hébreu. La formulation retenue préserve cette concision.
translation_notes:
  register: Français moderne, digne et accessible. Le verbe « on attribua » est explicité pour produire une phrase naturelle en français dans cette liste elliptique d’attributions, sans modifier les bénéficiaires ni la provenance des villes. Les noms propres suivent les formes françaises bibliques usuelles, sauf « Guershom », maintenu selon la graphie particulière du texte hébreu.
