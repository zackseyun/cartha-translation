lexical_decisions:
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette chaîne généalogique, בֶּן exprime directement la filiation. « fils de » conserve la structure répétitive et le rythme de l’hébreu, sans élargir inutilement le sens à « descendant de ».
- source_word: מִיכָאֵל
  choice: Mikaël
  rationale: Translittération française claire et usuelle du nom hébreu מִיכָאֵל, qui en reflète les éléments et la prononciation mieux que la forme francisée « Michel » dans ce contexte généalogique.
- source_word: בַּעֲשֵׂיָה
  choice: Baaséya
  rationale: Cette forme rend le texte hébreu reçu, qui commence ici par ב, et évite de le remplacer silencieusement par le nom ressemblant Maaséya, connu ailleurs.
- source_word: מַלְכִּיָּה
  choice: Malkiya
  rationale: Translittération française lisible qui suit de près les consonnes et les voyelles du nom hébreu מַלְכִּיָּה.
