  yaml_path: translation/ot/1_chronicles/006/051.yaml
  text: And from the families of the sons of Kohath[b][a], the cities of their territory were from the tribe of Ephraim.
translation:
  language: fr
  text: Parmi les clans des fils de Qehath[a], les villes de leur territoire[b] provenaient de la tribu d’Éphraïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi les familles des fils de Qehath ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « leurs villes frontalières » ; le mot hébreu peut désigner une frontière, des limites ou un territoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמִּשְׁפְּחוֹת
  choice: Quant aux clans
  rationale: מִשְׁפָּחוֹת désigne ici les groupes familiaux constitutifs d’un ensemble lévitique; « clans » est précis et naturel. La tournure « quant aux » rend la reprise du groupe dans le déroulement de la liste, sans reproduire lourdement le מִן partitif.
- source_word: בְּנֵי קְהָת
  choice: des fils de Qehath
  rationale: La formulation conserve l’expression généalogique hébraïque « fils de », qui peut inclure les descendants, ainsi que la forme usuelle française du nom Qehath.
- source_word: וַיְהִי
  choice: furent prises
  rationale: Dans le contexte de l’attribution des villes lévitiques, la copule introduit leur provenance tribale. « furent prises sur » explicite naturellement cette relation en français sans ajouter l’idée d’une conquête.
- source_word: עָרֵי גְבוּלָם
  choice: les villes de leur territoire
  rationale: גְבוּל peut désigner une frontière, des limites ou un territoire. Ici, « territoire » convient au contexte de répartition, tout en laissant en note l’autre lecture possible.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: sur la tribu d’Éphraïm
  rationale: מַטֶּה signifie « tribu » dans ce contexte. Avec des villes attribuées aux Lévites, « prises sur la tribu » exprime idiomatiquement leur provenance.
