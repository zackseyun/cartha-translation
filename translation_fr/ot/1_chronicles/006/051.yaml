translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le caractère récapitulatif d’une liste tout en évitant un calque peu naturel. Les deux notes signalent la portée collective de « fils » et l’ambiguïté réelle de גְבוּל.
