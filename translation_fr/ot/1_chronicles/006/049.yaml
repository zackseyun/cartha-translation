  text: וַ/יִּתְּנ֥וּ בְנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם אֶת הֶ/עָרִ֖ים וְ/אֶת מִגְרְשֵׁי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/049.yaml
  text: And the sons of Israel gave to the Levites the cities and their pasturelands[a][b].
translation:
  language: fr
  text: Les Israélites donnèrent aux Lévites les villes et les terres qui les entouraient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs pâturages » ou « leurs terrains communaux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: donnèrent
  rationale: Le qal wayyiqtol de נתן exprime simplement l’action de donner dans ce récit.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Bien que l’hébreu dise littéralement « les fils d’Israël », « les Israélites » est l’équivalent collectif naturel en français moderne et n’exclut pas les femmes du peuple.
- source_word: לַלְוִיִּם
  choice: aux Lévites
  rationale: Le datif et le nom du groupe tribal sont rendus directement par la formulation française consacrée.
- source_word: הֶעָרִים
  choice: les villes
  rationale: עָרִים désigne ici les villes attribuées aux Lévites; « villes » assure une terminologie claire et cohérente dans ce contexte.
- source_word: מִגְרְשֵׁיהֶם
  choice: les terres qui les entouraient
  rationale: מִגְרָשׁ désigne les espaces ouverts dépendant des villes, souvent utilisés comme pâturages. La formulation retenue préserve le sens spatial sans réduire leur fonction au seul pâturage.
