  yaml_path: translation/ot/1_chronicles/006/065.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead with its pasturelands[a], and Mahanaim with its pasturelands.'
translation:
  language: fr
  text: 'Et de la tribu de Gad : Ramoth en Galaad avec ses pâturages, et Mahanaïm avec ses pâturages.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: Et de la tribu de
  rationale: Dans le contexte de la répartition territoriale, מַטֶּה désigne une tribu. Les préfixes וּ et מִ sont rendus naturellement par « Et de ».
- source_word: גָד
  choice: Gad
  rationale: Nom propre de la tribu, selon la forme française usuelle.
- source_word: רָאמוֹת בַּגִּלְעָד
  choice: Ramoth en Galaad
  rationale: La préposition בְּ indique ici la localisation; « en Galaad » rend directement et naturellement la construction hébraïque.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts attenants à une ville lévitique, notamment destinés au bétail; « pâturages » est clair et idiomatique dans ce contexte.
- source_word: מַחֲנַיִם
  choice: Mahanaïm
  rationale: Transcription française usuelle du nom de lieu hébreu.
- source_word: וְאֶת
  choice: et
  rationale: La conjonction jointe au marqueur d’objet direct coordonne les éléments de la liste; seul « et » doit être exprimé en français.
