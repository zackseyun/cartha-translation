base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/040.yaml
  text: They gave them Hebron in the land of Judah[a], with its pasturelands around it.
translation:
  language: fr
  text: Ils leur donnèrent Hébron, dans le pays de Juda, avec les pâturages qui l’entouraient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les terrains communaux qui l’entouraient ». Le terme hébreu désigne les terrains non bâtis rattachés à une ville, souvent utilisés pour faire paître le bétail.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ils donnèrent
  rationale: Le wayyiqtol qal de נתן exprime ici la suite du récit. Le passé simple convient au registre narratif biblique en français, sans qu’il soit nécessaire de rendre explicitement la conjonction ו.
- source_word: לָהֶם
  choice: leur
  rationale: La préposition ל marque le complément d’attribution; « leur donnèrent » est la formulation française naturelle.
- source_word: חֶבְרוֹן
  choice: Hébron
  rationale: Nom géographique rendu selon sa forme française traditionnelle et courante.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: dans le pays de Juda
  rationale: אֶרֶץ désigne ici le pays ou territoire de Juda. Cette formulation conserve la désignation géographique sans la préciser excessivement.
- source_word: מִגְרָשֶׁיהָ
  choice: les pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts rattachés à une ville, souvent destinés au bétail dans le contexte des villes lévitiques. « Pâturages » en communique clairement la fonction principale.
- source_word: סְבִיבֹתֶיהָ
  choice: qui l’entouraient
  rationale: Le terme avec suffixe situe ces terrains autour d’Hébron. La proposition relative est naturelle en français et rattache sans ambiguïté les pâturages à la ville.
