source:
  edition: WLC
  text: וְ/אֵ֗לֶּה אֲשֶׁ֨ר הֶעֱמִ֥יד דָּוִ֛יד עַל יְדֵי שִׁ֖יר בֵּ֣ית יְהוָ֑ה מִ/מְּנ֖וֹחַ הָ/אָרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/016.yaml
  text: These are the men whom David appointed over the service of song in the house of Yahweh[b][a], after the ark came to rest.
translation:
  language: fr
  text: Voici ceux que David établit comme responsables du chant[a] dans la maison de Yahweh, après que l’arche eut trouvé son lieu de repos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chargés de chanter » ou « préposés au chant ». L’expression hébraïque désigne probablement la responsabilité du chant dans le sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « depuis le repos de l’arche ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici ceux
  rationale: Introduit naturellement en français la liste qui suit, tout en conservant la valeur démonstrative de l’hébreu.
- source_word: הֶעֱמִיד
  choice: établit
  rationale: Le hiphil de עמד indique ici que David affecta officiellement ces personnes à une fonction; « établit » conserve cette nuance institutionnelle sans réduire le verbe à une simple position physique.
- source_word: עַל יְדֵי שִׁיר
  choice: comme responsables du chant
  rationale: L’expression désigne vraisemblablement la responsabilité exercée à l’égard du chant cultuel. Cette formulation française est naturelle et garde la dimension administrative de l’hébreu.
- source_word: בֵּית יְהוָה
  choice: dans la maison de Yahweh
  rationale: « Maison » traduit directement בַּיִת et évite « temple », qui serait plus interprétatif dans ce contexte. Le nom divin יְהוָה est rendu par « Yahweh ».
- source_word: מִמְּנוֹחַ הָאָרוֹן
  choice: à partir du moment où l’arche eut trouvé le repos
  rationale: La préposition מִן associée à מְנוֹחַ marque le point de départ temporel lié à l’installation de l’arche. La tournure retenue reste proche de l’image hébraïque tout en étant idiomatique en français.
- source_word: הָאָרוֹן
  choice: l’arche
  rationale: Le texte dit simplement « l’arche »; préciser « de l’alliance » ajouterait une information implicite mais non exprimée dans ce verset.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Nature de la fonction musicale
  choice: responsables du chant
  alternative: chargés du service du chant
  rationale: Le texte associe une expression de responsabilité à « chant », mais ne définit pas précisément l’organisation cultuelle concernée. La traduction évite donc d’introduire une conception confessionnelle particulière du ministère musical.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve « maison » et « repos », images importantes du texte hébreu, tout en clarifiant naturellement la fonction des personnes énumérées.
