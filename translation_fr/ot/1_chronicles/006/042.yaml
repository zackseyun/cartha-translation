  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֗ן נָתְנוּ֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֶת חֶבְר֥וֹן וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַתִּ֥ר וְ/אֶֽת אֶשְׁתְּמֹ֖עַ וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/042.yaml
  text: 'And to the sons of Aaron they gave the cities of refuge: Hebron[a], and Libnah with its pasturelands, and Jattir, and Eshtemoa with its pasturelands.'
translation:
  language: fr
  text: 'On donna aux fils d’Aaron les villes de refuge : Hébron, Libna avec ses terres de pâturage[a], Yattir et Eshtemoa avec ses terres de pâturage.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terres communales » ; le terme hébreu désigne les espaces ouverts appartenant à une ville. Il est employé de nouveau à la fin du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: Aux fils d’Aaron
  rationale: La préposition ל marque ici les bénéficiaires. « Aux fils d’Aaron » est fidèle, naturel dans ce contexte généalogique et conserve le lien avec la phrase précédente exprimé par וְ.
- source_word: נָתְנוּ
  choice: ils donnèrent
  rationale: Le verbe נתן signifie couramment « donner ». Le contexte est celui d’une attribution territoriale, mais le choix littéral reste clair en français.
- source_word: עָרֵי הַמִּקְלָט
  choice: les villes de refuge
  rationale: Expression française établie et exacte pour les villes où une personne pouvait chercher protection selon la législation d’Israël.
- source_word: חֶבְרוֹן / לִבְנָה / יַתִּר / אֶשְׁתְּמֹעַ
  choice: Hébron / Libna / Yattir / Eshtemoa
  rationale: Transcriptions françaises usuelles ou transparentes des noms de lieux hébreux.
- source_word: מִגְרָשֶׁיהָ
  choice: avec ses terres de pâturage
  rationale: מִגְרָשׁ désigne les espaces ouverts dépendant d’une ville, notamment destinés au bétail. « Terres de pâturage » est précis et compréhensible; le suffixe féminin singulier renvoie chaque fois à la ville qui précède immédiatement.
theological_decisions:
- issue: Portée de l’expression « les villes de refuge » dans l’énumération
  choice: Conserver le pluriel et la structure de la liste sans préciser quelles villes possèdent ce statut
  alternative: Reformuler « la ville de refuge, Hébron, ainsi que Libna… »
  rationale: Le texte massorétique porte explicitement le pluriel עָרֵי הַמִּקְלָט. La traduction préserve cette formulation, même si le rapport précis entre le titre et chaque ville de la liste peut paraître ambigu.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation distingue nettement chaque ville; la répétition finale de « terres de pâturage » suit celle du texte hébreu.
