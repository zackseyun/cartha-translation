  text: and Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands.
translation:
  language: fr
  text: ainsi qu’Ajalon et ses pâturages[a], et Gath-Rimmon et ses pâturages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrains communaux » ou « terres environnantes ». Le terme hébreu désigne les terrains ouverts dépendant d’une ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: Ayalôn
  rationale: Nom de lieu translittéré selon une forme française claire, avec accent circonflexe pour signaler la voyelle longue finale.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: Le terme désigne les terrains ouverts dépendant d’une ville, notamment destinés au bétail; « pâturages » est naturel et précis dans cette liste de villes lévitiques.
- source_word: גַּת רִמּוֹן
  choice: Gath-Rimmôn
  rationale: Nom de lieu composé translittéré; le trait d’union indique qu’il s’agit d’un seul toponyme.
- source_word: וְאֶת
  choice: ainsi que / et
  rationale: La conjonction jointe au marqueur d’objet coordonne les éléments de la liste; le marqueur lui-même n’a pas d’équivalent lexical en français.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et adapté à une liste géographique. « Ainsi que » marque naturellement la continuité avec le contexte précédent, tandis que la répétition de « et » conserve la structure coordonnée de l’hébreu.
