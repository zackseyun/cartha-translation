base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/034.yaml
  text: And Aaron and his sons were offering on the altar of burnt offering and on the altar of incense[a], for all the work of the Most Holy Place and to make atonement for Israel, according to all that Moses the servant of God had commanded.
translation:
  language: fr
  text: Aaron et ses fils faisaient fumer les offrandes sur l’autel de l’holocauste et sur l’autel de l’encens, afin d’accomplir tout le service du lieu très saint[a] et de faire expiation pour Israël, conformément à tout ce qu’avait ordonné Moïse, serviteur de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des choses très saintes ». L’expression hébraïque peut désigner le lieu très saint ou des choses consacrées au plus haut degré.'
    reason: Préserver l’ambiguïté lexicale et référentielle de קֹדֶשׁ הַקֳּדָשִׁים.
lexical_decisions:
- source_word: מַקְטִירִים
  choice: faisaient fumer les offrandes
  rationale: Le participe hiphil de קטר désigne l’action de faire monter en fumée une offrande ou de l’encens. Cette formulation convient aux deux autels mentionnés sans limiter l’action aux seuls sacrifices animaux.
- source_word: מִזְבַּח הָעוֹלָה
  choice: l’autel de l’holocauste
  rationale: Expression cultuelle française courante et précise pour l’autel associé à l’offrande entièrement consumée.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: l’autel de l’encens
  rationale: Équivalent direct, naturel et immédiatement compréhensible.
- source_word: לְכֹל מְלֶאכֶת
  choice: tout le service de
  rationale: Dans ce contexte sacerdotal, מְלָאכָה désigne l’ensemble des tâches ou du service assigné; « service » rend naturellement cette dimension cultuelle sans la détailler davantage.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: le lieu très saint
  rationale: L’expression superlative peut désigner le sanctuaire intérieur ou les choses les plus saintes. Le contexte du service sacerdotal permet la lecture locale, tandis que l’autre possibilité est conservée en note.
- source_word: וּלְכַפֵּר עַל יִשְׂרָאֵל
  choice: et faisaient l’expiation pour Israël
  rationale: « Faire l’expiation » conserve le sens rituel large de כפר sans imposer une théorie particulière de l’expiation.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: conformément à tout ce qu’avait ordonné
  rationale: Cette formulation exprime la conformité à l’ensemble du commandement et s’intègre naturellement au récit au passé.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: serviteur de Dieu
  rationale: Conserve le titre solennel attribué à Moïse dans une formulation française biblique claire.
theological_decisions:
- issue: Référent de קֹדֶשׁ הַקֳּדָשִׁים
  choice: 'Lecture locale : « le lieu très saint »'
  alternative: « les choses très saintes »
  rationale: La construction hébraïque admet les deux lectures. Le contexte du service des autels favorise une référence au sanctuaire, mais l’ambiguïté réelle est signalée en note.
- issue: Portée de כפר
  choice: « faire l’expiation »
  alternative: « accomplir le rite d’expiation » ou « faire propitiation »
  rationale: Le choix retenu garde la portée sacrificielle du terme sans privilégier une explication doctrinale particulière de son mécanisme.
translation_notes:
  register: Français international moderne, clair et digne. La première phrase explicite sobrement l’objet implicite du verbe cultuel; la seconde évite une longue accumulation tout en maintenant le rapport entre le service sacerdotal, l’expiation et le commandement transmis par Moïse.
