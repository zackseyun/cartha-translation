  revision_rationale: La révision rétablit dans une même phrase le lien entre l’action rituelle et les deux infinitifs de finalité du texte hébreu. Elle remplace également « faire l’expiation » par l’expression française plus naturelle « faire expiation », sans modifier le sens ni résoudre l’ambiguïté du terme sacrificiel.
