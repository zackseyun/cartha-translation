    rationale: לְכֹל מְלֶאכֶת ... וּלְכַפֵּר présente les fonctions ou finalités rattachées à l’activité sacerdotale. « Ils accomplissaient… » est possible interprétativement, mais ne rend pas aussi directement cette relation.
  - severity: low
    issue: « Faisaient l’expiation » est une formulation peu idiomatique.
    rationale: « Faire expiation pour Israël » est l’expression française usuelle et conserve la portée rituelle ouverte de כפר sans ajouter de précision doctrinale.
  revised_text: Aaron et ses fils faisaient fumer les offrandes sur l’autel de l’holocauste et sur l’autel de l’encens, afin d’accomplir tout le service du lieu très saint[a] et de faire expiation pour Israël, conformément à tout ce qu’avait ordonné Moïse, serviteur de Dieu.
  revised_footnotes:
