revisions:
- from: Aaron et ses fils faisaient fumer les offrandes sur l’autel de l’holocauste et sur l’autel de l’encens. Ils accomplissaient tout le service du lieu très saint[a] et faisaient l’expiation pour Israël, conformément à tout ce qu’avait ordonné Moïse, serviteur de Dieu.
  to: Aaron et ses fils faisaient fumer les offrandes sur l’autel de l’holocauste et sur l’autel de l’encens, afin d’accomplir tout le service du lieu très saint[a] et de faire expiation pour Israël, conformément à tout ce qu’avait ordonné Moïse, serviteur de Dieu.
  rationale: La révision rétablit dans une même phrase le lien entre l’action rituelle et les deux infinitifs de finalité du texte hébreu. Elle remplace également « faire l’expiation » par l’expression française plus naturelle « faire expiation », sans modifier le sens ni résoudre l’ambiguïté du terme sacrificiel.
