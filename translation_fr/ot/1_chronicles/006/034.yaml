review_pass:
  verdict: revise
  source_fidelity: 'Le sens cultuel est globalement bien rendu : les deux autels, l’expiation pour Israël et l’obéissance au commandement de Moïse sont conservés. Toutefois, la scission en deux phrases transforme la construction finale de but (« pour tout le service… et pour faire expiation ») en une nouvelle affirmation indépendante et affaiblit son lien avec l’action d’Aaron et de ses fils.'
  naturalness: « Faire l’expiation » avec article est moins idiomatique en français biblique moderne que « faire expiation ». Une seule phrase, articulée par « afin d’ », restitue plus naturellement et plus clairement la syntaxe de l’original.
  terminology: « Autel de l’holocauste », « autel de l’encens », « lieu très saint » et « serviteur de Dieu » conviennent. La note conserve utilement l’alternative non locale de קֹדֶשׁ הַקֳּדָשִׁים.
  issues:
