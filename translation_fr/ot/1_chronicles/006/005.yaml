  text: 'De Guershom : Libni, son fils ; Jahath, son fils ; Zimma, son fils.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹם
  choice: Pour Guershom
  rationale: Le préfixe לְ introduit ici la lignée généalogique de Guershom. « Pour Guershom » conserve cette fonction d’en-tête et la structure concise de l’hébreu.
- source_word: לִבְנִי
  choice: Libni
  rationale: Nom propre, transcrit selon sa forme française biblique usuelle.
- source_word: בְנוֹ
  choice: son fils
  rationale: Le nom בֵּן muni du suffixe masculin singulier indique la filiation directe ; « son fils » est la formulation française naturelle.
- source_word: יַחַת
  choice: Yahath
  rationale: Nom propre transcrit sous une forme française qui représente le yod initial par « Y » et le ḥet final par « th », conformément à l’usage biblique courant.
- source_word: זִמָּה
  choice: Zimma
  rationale: Il s’agit ici d’un nom propre ; il est donc transcrit et non traduit, malgré le sens du nom commun apparenté dans d’autres contextes.
