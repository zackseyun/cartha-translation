  text: וְ/אֶת שְׂדֵ֥ה הָ/עִ֖יר וְ/אֶת חֲצֵרֶ֑י/הָ נָתְנ֖וּ לְ/כָלֵ֥ב בֶּן יְפֻנֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/041.yaml
  text: But the fields of the city and its pasturelands they gave to Caleb son of Jephunneh[a].
translation:
  language: fr
  text: Mais la campagne de la ville et ses villages[a], ils les donnèrent à Caleb, fils de Jephunné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses localités » ou « ses dépendances ». Le mot hébreu peut désigner des villages ou d’autres agglomérations rattachées à une ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: les terres de la ville
  rationale: שָׂדֶה désigne ici, collectivement, les terrains ouverts ou cultivables rattachés à la ville. « Les terres de la ville » est naturel en français et ne suggère pas un unique champ.
- source_word: חֲצֵרֶיהָ
  choice: les localités qui en dépendaient
  rationale: חָצֵר peut désigner des villages, des établissements ou des dépendances territoriales associés à une ville. Le choix retenu préserve cette relation sans imposer le sens plus précis de « pâturages ».
- source_word: נָתְנוּ
  choice: on les donna
  rationale: Le qal accompli de נתן signifie simplement « donner ». Le pronom reprend les deux éléments antéposés, tandis que « on » rend naturellement en français le sujet pluriel non exprimé.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: à Caleb, fils de Yefounné
  rationale: Le lamed introduit le bénéficiaire. Les noms sont translittérés dans une forme française lisible, avec une apposition naturelle.
- source_word: וְאֶת ... וְאֶת
  choice: Mais ... et ...
  rationale: Le premier waw marque ici, dans le contexte, un contraste avec l’attribution précédente de la ville elle-même; « Mais » explicite sobrement ce lien discursif.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La dislocation « les terres… on les donna » conserve la mise en relief de l’hébreu. « Localités qui en dépendaient » maintient l’ambiguïté lexicale mieux que le terme plus interprétatif « pâturages ».
