  terminology: Employer la forme française usuelle « Jephunné » améliore la cohérence onomastique pour un lectorat francophone. « Villages » est le rendu lexical principal le plus sobre de חֲצֵרֶיהָ; la note conserve les possibilités contextuelles plus larges.
