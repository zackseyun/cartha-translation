  text: לִ/בְנֵ֨י מְרָרִ֜י לְ/מִשְׁפְּחוֹתָ֗/ם מִ/מַּטֵּ֣ה רְ֠אוּבֵן וּֽ/מִ/מַּטֵּה גָ֞ד וּ/מִ/מַּטֵּ֤ה זְבוּלֻן֙ בַּ/גּוֹרָ֔ל עָרִ֖ים שְׁתֵּ֥ים עֶשְׂרֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/048.yaml
  text: To the sons of Merari, according to their clans, from the tribe of Reuben, from the tribe of Gad, and from the tribe of Zebulun, twelve cities by lot.
translation:
  language: fr
  text: Aux fils de Merari, selon leurs clans, furent attribuées par tirage au sort douze villes prises sur la tribu de Ruben, sur la tribu de Gad et sur la tribu de Zabulon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: Aux fils de Merari
  rationale: Le לְ introduit les bénéficiaires de l’attribution. « Fils de Merari » conserve l’expression généalogique du texte hébreu, tout en restant naturelle en français biblique moderne.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: selon leurs clans
  rationale: Dans le contexte de la répartition tribale, מִשְׁפָּחָה désigne les subdivisions claniques plutôt que les seuls foyers familiaux.
- source_word: מִמַּטֵּה
  choice: prises sur la tribu de
  rationale: מַטֶּה signifie ici « tribu ». « Prises sur » explicite sobrement que les villes provenaient des territoires des trois tribus, sans changer le sens de l’attribution.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française traditionnelle et courante du nom tribal.
- source_word: גָד
  choice: Gad
  rationale: Translittération française usuelle du nom tribal.
- source_word: זְבוּלֻן
  choice: Zabulon
  rationale: Forme française traditionnelle et largement reconnue du nom tribal.
- source_word: בַּגּוֹרָל
  choice: par tirage au sort
  rationale: Expression française naturelle qui indique le procédé d’attribution exprimé par le syntagme hébreu.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: douze villes
  rationale: Ordre naturel en français pour rendre le substantif suivi du nombre en hébreu.
