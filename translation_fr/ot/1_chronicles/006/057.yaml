lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: Et de la tribu de
  rationale: 'מַטֶּה désigne ici une tribu dans le contexte de la répartition des villes. La conjonction et la préposition marquent la continuation de la liste : « Et de la tribu de ».'
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: קֶדֶשׁ
  choice: Qédesh
  rationale: Translittération française usuelle du nom de lieu, sans ajout géographique absent de l’hébreu.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts, notamment destinés au pâturage, autour d’une ville lévitique. « Pâturages » est naturel, précis et compréhensible en français moderne.
- source_word: דָּבְרַת
  choice: Daberath
  rationale: Translittération du nom de lieu conforme à la forme consonantique et à la vocalisation du texte hébreu de ce verset.
