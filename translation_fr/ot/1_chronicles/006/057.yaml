  yaml_path: translation/ot/1_chronicles/006/057.yaml
  text: 'And from the tribe of Issachar: Kedesh with its pasturelands[a], and Daberath with its pasturelands.'
translation:
  language: fr
  text: 'Et de la tribu d’Issacar : Qedesh avec ses pâturages, et Daberath[a] avec ses pâturages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La liste parallèle de Josué 21.28 donne Qishyon à la place de Daberath.
