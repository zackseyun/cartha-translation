translation_notes:
  register: 'Français moderne, sobre et digne. La syntaxe conserve la répétition d’« Asaph » et la double formule « fils de », caractéristiques de la présentation hébraïque. Aucun appel de note n’est nécessaire : « à sa droite » rend directement et sans ambiguïté notable l’expression spatiale hébraïque.'
