  text: וְ/אָחִ֣י/ו אָסָ֔ף הָ/עֹמֵ֖ד עַל יְמִינ֑/וֹ אָסָ֥ף בֶּן בֶּרֶכְיָ֖הוּ בֶּן שִׁמְעָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/024.yaml
  text: 'And his brother Asaph stood at his right hand: Asaph son of Berechiah[a], son of Shimea.'
translation:
  language: fr
  text: 'Et son frère Asaph se tenait à sa droite : Asaph, fils de Bérékia, fils de Shiméa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָחִיו
  choice: Son frère
  rationale: Le nom אָח avec le suffixe de troisième personne du masculin singulier signifie naturellement « son frère ». La coordination וְ est rendue implicitement pour produire une phrase française naturelle dans cette liste organisationnelle.
- source_word: אָסָף
  choice: Asaph
  rationale: Nom propre conservé sous sa forme française usuelle. Sa répétition dans l’hébreu est maintenue.
- source_word: הָעֹמֵד
  choice: se tenait
  rationale: Le participe qal de עמד décrit ici la position occupée par Asaph. L’imparfait français « se tenait » exprime naturellement cet état dans le cadre du récit.
- source_word: עַל יְמִינוֹ
  choice: à sa droite
  rationale: L’expression désigne une position du côté droit de la personne évoquée. « À sa droite » est précis et idiomatique en français, sans surcharger la formulation.
- source_word: בֶּן
  choice: fils de
  rationale: La formule généalogique est rendue de manière identique à chacune de ses deux occurrences afin de conserver la structure de la filiation.
- source_word: בֶּרֶכְיָהוּ
  choice: Bérékia
  rationale: Transcription française moderne du nom propre hébreu, conforme à une prononciation accessible.
- source_word: שִׁמְעָא
  choice: Shiméa
  rationale: Transcription française claire du nom propre hébreu שִׁמְעָא.
