  text: בְּנֵ֥י מְרָרִ֖י מַחְלִ֣י וּ/מֻשִׁ֑י וְ/אֵ֛לֶּה מִשְׁפְּח֥וֹת הַ/לֵּוִ֖י לַ/אֲבוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/004.yaml
  text: 'The sons of Merari: Mahli and Mushi[b][a]. These were the clans of the Levites according to their fathers’ houses.'
translation:
  language: fr
  text: 'Fils de Merari : Mahli et Mushi. Tels étaient les clans[a] des Lévites, selon leurs maisons paternelles[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « familles ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « selon leurs pères »; dans ce contexte généalogique, il s’agit d’un classement par maisons paternelles ou lignées ancestrales.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: Fils de
  rationale: Le pluriel construit de בֵּן introduit ici les enfants nommés de Merari. La formule concise « Fils de » est naturelle dans une généalogie française.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nom propre translittéré selon l'usage français courant.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Nom propre translittéré.
- source_word: וּמֻשִׁי
  choice: et Mushi
  rationale: Le waw coordonne les deux noms; « Mushi » est une translittération française claire.
- source_word: וְאֵלֶּה
  choice: Tels étaient
  rationale: Cette tournure rend naturellement en français le démonstratif récapitulatif dans le cadre d'une généalogie, sans alourdir la phrase par un « et » initial.
- source_word: מִשְׁפְּחוֹת
  choice: les clans
  rationale: Dans ce contexte tribal et généalogique, le mot désigne des groupes de parenté plus larges que la famille nucléaire. « Clans » exprime clairement cette réalité sociale; « familles » demeure possible.
- source_word: הַלֵּוִי
  choice: des Lévites
  rationale: Bien que la forme hébraïque soit singulière, elle a ici une portée collective et désigne le groupe lévitique. Le pluriel est idiomatique et clair en français.
- source_word: לַאֲבוֹתֵיהֶם
  choice: selon leurs maisons paternelles
  rationale: Littéralement « selon leurs pères ». Dans cette formule généalogique, les pères représentent les lignées ou maisons ancestrales servant au classement; l'explicitation évite une formulation française opaque.
