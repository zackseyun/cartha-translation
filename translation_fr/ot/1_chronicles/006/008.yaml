lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elqana
  rationale: Nom propre transcrit selon un usage français courant, sans le traduire.
- source_word: בְנוֹ
  choice: son fils
  rationale: Le nom בֵּן avec le suffixe masculin singulier signifie directement « son fils ». Même si les généalogies peuvent parfois condenser des générations, la formulation filiale explicite est conservée.
- source_word: וְ
  choice: puis
  rationale: Dans cette suite généalogique, la conjonction relie les générations successives. « Puis » rend naturellement cette progression en français tout en préservant le lien entre les noms.
- source_word: אֶבְיָסָף
  choice: Ébiasaph
  rationale: Transcription du nom propre d’après la forme hébraïque présente dans le texte des Chroniques.
- source_word: אַסִּיר
  choice: Assir
  rationale: Transcription directe et usuelle du nom propre hébreu.
