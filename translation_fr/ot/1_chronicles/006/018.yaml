id: 1CH.6.18
reference: 1 Chronicles 6:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵ֥לֶּה הָ/עֹמְדִ֖ים וּ/בְנֵי/הֶ֑ם מִ/בְּנֵי֙ הַ/קְּהָתִ֔י הֵימָן֙ הַ/מְשׁוֹרֵ֔ר בֶּן יוֹאֵ֖ל בֶּן שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/018.yaml
  text: 'And these are the ones who stood[a], and their sons: from the sons of the Kohathites: Heman the singer, son of Joel[b], son of Samuel.'
translation:
  language: fr
  text: 'Voici ceux qui se tenaient à leur poste[a], ainsi que leurs fils : parmi les descendants de Qehath, Héman le chanteur, fils de Joël, fils de Samuel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui se tenaient debout »; dans ce contexte, l’expression peut désigner ceux qui occupaient leur fonction ou assuraient le service.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici ceux
  rationale: Introduit naturellement en français la liste qui suit tout en conservant la valeur présentative de la formule hébraïque.
- source_word: הָעֹמְדִים
  choice: qui se tenaient à leur poste
  rationale: Le participe signifie littéralement « ceux qui se tenaient debout » et, dans ce contexte d’organisation du service musical, évoque le fait d’occuper une fonction. La formulation française conserve l’image concrète sans réduire le sens au seul verbe « servir ».
- source_word: וּבְנֵיהֶם
  choice: ainsi que leurs fils
  rationale: Rend la coordination simple exprimée par ו tout en reliant naturellement les fils aux hommes qui viennent d’être désignés.
- source_word: מִבְּנֵי הַקְּהָתִי
  choice: parmi les descendants de Qehath
  rationale: Exprime idiomatiquement la filiation clanique indiquée par « parmi les fils du Qehatite », formulation qui serait peu naturelle en français.
- source_word: הֵימָן
  choice: Héman
  rationale: Forme française traditionnelle et transparente du nom propre.
- source_word: הַמְשׁוֹרֵר
  choice: le chanteur
  rationale: Désigne directement celui qui chante; « musicien » serait plus large et « chantre » plus spécialisé.
- source_word: בֶּן יוֹאֵל בֶּן שְׁמוּאֵל
  choice: fils de Joël, fils de Samuel
  rationale: Conserve sans expansion la construction généalogique hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « À leur poste » maintient l’image hébraïque de la position debout tout en rendant perceptible le contexte de service; la note conserve le sens littéral et son ouverture. Les noms suivent des formes françaises courantes.
