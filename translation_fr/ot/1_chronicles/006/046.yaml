revisions:
- from: Aux fils de Qehath qui restaient, dix villes provenant des familles de la tribu — de la demi-tribu, la moitié de Manassé[a] — furent attribuées par tirage au sort.
  to: Aux fils de Qehath qui restaient, dix villes prises sur la famille de la tribu — sur la demi-tribu, la moitié de Manassé[a] — furent attribuées par tirage au sort.
  rationale: La révision corrige le pluriel non littéral dans le texte et dans la note, et remplace une tournure française peu naturelle par « prises sur ». Elle conserve la répétition et l’ellipse de la formule hébraïque dans le corps du texte, avec une note qui permet de l’auditer sans imposer une analyse confessionnelle.
