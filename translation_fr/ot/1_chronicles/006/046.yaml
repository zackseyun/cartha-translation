review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement les bénéficiaires, le participe « qui restaient », l’attribution de dix villes et l’allocation par le sort. Toutefois, « familles » ne correspond pas à la forme singulière מִשְׁפַּחַת, et la note qualifie à tort ce pluriel de littéral. La formulation hébraïque étant elliptique et répétitive, elle doit être signalée sans en gommer l’étrangeté.
  naturalness: Le français est globalement clair, mais « dix villes provenant des familles » est peu idiomatique dans une formule d’attribution territoriale. « Prises sur » exprime plus naturellement que les villes sont prélevées sur le territoire ou le groupe concerné, sans rendre la syntaxe hébraïque artificiellement fluide.
  terminology: « Fils de Qehath », « demi-tribu », « Manassé » et « tirage au sort » conviennent au registre biblique moderne. La note est corrigée afin de reproduire le singulier du texte hébreu et de ne pas présenter une interprétation plurielle comme une citation littérale.
  issues:
  - severity: medium
    issue: La note donne « des familles » comme forme littérale.
    rationale: Le texte consonantique et vocalisé porte מִמִּשְׁפַּחַת, au singulier (« de la famille / du clan »). Même si le contexte peut autoriser une compréhension collective, le littéral de la note doit conserver le singulier.
  - severity: low
    issue: « provenant des familles » est maladroit pour qualifier les villes attribuées.
    rationale: En français, des villes ne « proviennent » pas naturellement de familles dans un contexte d’allotissement. « Prises sur » rend mieux l’idée d’une attribution prélevée sur la part tribale, tout en laissant la formule difficile explicitée par la note.
  revised_text: Aux fils de Qehath qui restaient, dix villes prises sur la famille de la tribu — sur la demi-tribu, la moitié de Manassé[a] — furent attribuées par tirage au sort.
