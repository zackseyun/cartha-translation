  text: וְ/לִ/בְנֵ֨י קְהָ֜ת הַ/נּוֹתָרִ֗ים מִ/מִּשְׁפַּ֣חַת הַ/מַּטֶּ֡ה מִֽ֠/מַּחֲצִית מַטֵּ֨ה חֲצִ֧י מְנַשֶּׁ֛ה בַּ/גּוֹרָ֖ל עָרִ֥ים עָֽשֶׂר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/046.yaml
  text: And to the sons of Kohath[a] who remained, from the families of the tribe, from the half-tribe, the half of Manasseh, ten cities were given by lot.
translation:
  language: fr
  text: Aux fils de Qehath qui restaient, dix villes prises sur la famille de la tribu — sur la demi-tribu, la moitié de Manassé[a] — furent attribuées par tirage au sort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « de la famille de la tribu, de la demi-tribu, la moitié de Manassé ». Cette formule répétitive renvoie à la demi-tribu de Manassé.'
    reason: La construction hébraïque est elliptique et répétitive. La note en conserve le singulier et la forme inhabituelle, tout en indiquant son référent dans le contexte de la répartition.
lexical_decisions:
- source_word: וְלִבְנֵי קְהָת
  choice: Aux fils de Qehath
  rationale: La préposition introduit les bénéficiaires de l’attribution. « Fils de » conserve l’expression généalogique hébraïque employée collectivement; « Qehath » est une forme française usuelle du nom.
- source_word: הַנּוֹתָרִים
  choice: qui restaient
  rationale: Le participe désigne les Qehathites restant à pourvoir après les attributions précédentes.
- source_word: מִמִּשְׁפַּחַת הַמַּטֶּה
  choice: provenant des familles de la tribu
  rationale: Dans ce contexte d’attribution territoriale, מַטֶּה signifie « tribu ». Le pluriel « familles » rend la valeur collective de מִשְׁפַּחַת, tandis que « provenant de » rattache naturellement cette indication aux villes attribuées.
- source_word: מִמַּחֲצִית מַטֵּה חֲצִי מְנַשֶּׁה
  choice: de la demi-tribu, la moitié de Manassé
  rationale: La formulation répétitive et difficile du texte hébreu est conservée plutôt que réduite sans indication à la simple expression « demi-tribu de Manassé ».
- source_word: בַּגּוֹרָל
  choice: par tirage au sort
  rationale: Expression française claire indiquant que la répartition s’est faite au moyen du sort.
- source_word: עָרִים עָשֶׂר
  choice: dix villes … furent attribuées
  rationale: L’hébreu ne comporte pas de verbe exprimé dans cette formule; « furent attribuées » est suppléé à partir du contexte immédiat.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La phrase a été légèrement réordonnée afin de rendre explicite que les villes, et non les Qehathites, proviennent du territoire tribal, tout en conservant dans le texte la répétition propre à l’hébreu.
