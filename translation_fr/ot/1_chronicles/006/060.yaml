lexical_decisions:
- source_word: חוּקֹק
  choice: Hukok
  rationale: Nom de lieu translittéré d’après le texte massorétique de 1 Chroniques, sans lui substituer la forme de la liste parallèle en Josué 21.31.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: Désigne les terrains non bâtis rattachés à une ville, notamment destinés au pâturage; cette formulation est naturelle et précise dans le contexte des villes lévitiques.
- source_word: רְחֹב
  choice: Rehob
  rationale: Nom de lieu translittéré selon sa forme hébraïque.
- source_word: וְאֶת
  choice: et / avec
  rationale: La coordination hébraïque introduit les villes successives; le lien entre chaque ville et ses terrains est rendu naturellement en français par «avec».
