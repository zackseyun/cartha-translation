  choice: Tahath
  rationale: Nom propre personnel conservé par translittération dans cette généalogie.
- source_word: בְּנוֹ
  choice: son fils
  rationale: La formule généalogique hébraïque signifie normalement « son fils ». Elle peut parfois désigner plus largement un descendant, mais rien ici n’exige d’expliciter cette possibilité dans le texte.
- source_word: אוּרִיאֵל
  choice: Uriel
  rationale: Translittération française usuelle de ce nom propre.
- source_word: עֻזִּיָּה
  choice: Ouzzia
  rationale: Forme française traditionnelle et intelligible, correspondant au nom hébreu ʿUzziyyā.
- source_word: וְשָׁאוּל
  choice: et Saül
  rationale: Le waw est rendu par « et » ; « Saül » est la forme française consacrée du nom hébreu Shaoul.
