base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/063.yaml
  text: 'And beyond the Jordan at Jericho[a], east of the Jordan, from the tribe of Reuben: Bezer in the wilderness, with its pasturelands, and Jahzah, with its pasturelands.'
translation:
  language: fr
  text: 'Et au-delà du Jourdain, près de Jéricho, à l’est du Jourdain, ils reçurent de la tribu de Ruben : Bétser, dans le désert, avec ses pâturages, et Yahça[a], avec ses pâturages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aussi appelé « Yahats » dans certaines traductions.
    reason: Variante française traditionnelle du nom de lieu יַהְצָה.
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרֵחוֹ
  choice: Et de l’autre côté du Jourdain, à la hauteur de Jéricho
  rationale: La formulation conserve le repère géographique donné par le Jourdain et situe le lieu par rapport à Jéricho. « À la hauteur de Jéricho » exprime naturellement en français la valeur locative de יְרֵחוֹ dans cette construction.
- source_word: לְמִזְרַח הַיַּרְדֵּן
  choice: à l’est du Jourdain
  rationale: מִזְרָח indique ici l’orientation géographique vers l’est; cette formulation est précise et idiomatique.
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: de la tribu de Ruben
  rationale: Dans le contexte d’une répartition territoriale, מַטֶּה désigne une tribu.
- source_word: בֶּצֶר
  choice: Bétser
  rationale: Transcription française du nom de lieu hébreu, avec ts pour représenter la consonne צ.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région aride ou peu habitée; « désert » est ici naturel et conforme au repère géographique traditionnel de cette ville.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: Dans les listes de villes lévitiques, מִגְרָשׁ désigne les terrains ouverts attenants à la ville, notamment destinés au bétail.
- source_word: יַהְצָה
  choice: Yahça
  rationale: Cette transcription suit la forme hébraïque présente dans ce verset; une forme française traditionnelle différente est signalée en note.
- source_word: אֶת … וְאֶת
  choice: ils reçurent … et
  rationale: La particule introduit les villes dans une énumération dépendant du contexte précédent. L’ajout explicite de « ils reçurent » produit une phrase française autonome sans modifier le sens de l’attribution.
