  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: עַמְרָם
  choice: Amram
  rationale: Forme française usuelle du nom propre.
- source_word: וְיִצְהָר
  choice: Yitsehar
  rationale: Translittération française qui représente les consonnes et la vocalisation du nom hébreu יִצְהָר; la conjonction est exprimée par la ponctuation de la liste.
- source_word: וְחֶבְרוֹן
  choice: Hébron
  rationale: Forme française traditionnelle du nom propre; dans ce contexte, il s’agit d’une personne et non de la ville.
- source_word: וְעֻזִּיאֵל
  choice: Ouzziel
  rationale: Forme française usuelle du nom propre; le ו préfixé est rendu par « et » devant le dernier élément de la liste.
