base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/052.yaml
  text: 'They gave them the cities of refuge: Shechem with its pasturelands in the hill country of Ephraim[a], and Gezer with its pasturelands.'
translation:
  language: fr
  text: 'Ils leur donnèrent les villes de refuge : Sichem, avec ses pâturages, dans la région montagneuse d’Éphraïm[a], et Guézer avec ses pâturages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « les villes de refuge : Sichem et ses pâturages dans la région montagneuse d’Éphraïm, et Guézer et ses pâturages ».'
    reason: La syntaxe hébraïque permet de lire « villes de refuge » comme l’introduction de toute la liste, sans limiter explicitement cette désignation au seul premier nom.
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ils leur donnèrent
  rationale: Le wayyiqtol de נתן exprime l’action successive du récit. Le passé simple convient au registre narratif biblique français sans qu’il soit nécessaire de rendre explicitement le ו initial.
- source_word: עָרֵי הַמִּקְלָט
  choice: les villes de refuge
  rationale: Expression française consacrée et claire pour les villes servant d’asile légal.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Forme française traditionnelle et largement reconnue du nom de lieu hébreu.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: Le terme désigne les terrains ouverts dépendant d’une ville, notamment destinés au bétail; « pâturages » est naturel dans le contexte des villes lévitiques.
- source_word: בְּהַר אֶפְרָיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: L’expression désigne les hautes terres associées à Éphraïm plutôt qu’un sommet unique.
- source_word: גֶּזֶר
  choice: Guézer
  rationale: Forme française usuelle du toponyme.
- source_word: וְאֶת ... וְאֶת
  choice: et ... ainsi que
  rationale: Cette formulation conserve la coordination des objets tout en produisant une énumération naturelle en français.
