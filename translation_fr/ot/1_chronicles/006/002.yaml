lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: La formule présentative introduit naturellement une liste en français. « Voici » restitue cette fonction sans imposer un « et » peu idiomatique ici.
- source_word: שְׁמוֹת
  choice: les noms
  rationale: Dans la construction שְׁמוֹת בְּנֵי, « les noms des fils de » est la formulation française naturelle.
- source_word: בְּנֵי
  choice: des fils de
  rationale: Dans cette généalogie, les deux personnes nommées sont présentées comme les fils immédiats de Guershom; « fils » est donc préférable au sens plus large de « descendants ».
- source_word: גֵרְשׁוֹם
  choice: Guershom
  rationale: Le texte hébreu porte גֵרְשׁוֹם; « Guershom » est une translittération française usuelle qui permet de le distinguer de la forme apparentée « Guershon ».
- source_word: לִבְנִי
  choice: Libni
  rationale: Nom propre rendu selon sa forme française biblique courante.
- source_word: וְשִׁמְעִי
  choice: et Shimeï
  rationale: Le waw coordonne le second nom; « Shimeï » est une translittération française courante de שִׁמְעִי.
