  text: 'These are the names of the sons of Gershom: Libni and Shimei[a].'
translation:
  language: fr
  text: 'Voici les noms des fils de Guershom[a] : Libni et Shimeï.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte ici « Guershom » ; certaines traditions anglaises emploient « Guershon » dans des généalogies apparentées.
