- source_word: בְּנוֹ / בנו
  choice: son fils
  rationale: Le nom בֵּן avec le suffixe masculin singulier de troisième personne signifie littéralement « son fils » ; la répétition présente dans le texte hébreu est conservée pour respecter le rythme généalogique.
- source_word: צוֹפַי
  choice: Tsophaï
  rationale: Transcription française du nom propre selon la vocalisation massorétique fournie ; une autre tradition de vocalisation peut donner « Tsouphaï ».
