lexical_decisions:
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette généalogie, le sens le plus naturel est « fils de ». Le terme peut parfois désigner plus largement un descendant lorsque des générations sont omises, possibilité signalée en note.
- source_word: יַחַת
  choice: Yahath
  rationale: Translittération française claire du nom hébreu, conservant la consonne initiale yod par « Y » et la finale חַת par « hath ».
- source_word: גֵּרְשֹׁם
  choice: Guershom
  rationale: La forme hébraïque est bien Guershom, avec un mem final; elle ne doit pas être harmonisée avec la forme distincte Guershon connue dans d’autres généalogies.
- source_word: לֵוִי
  choice: Lévi
  rationale: Forme française traditionnelle et courante du nom hébreu.
