translation:
  language: fr
  text: Hilets et ses pâturages[a], Debir et ses pâturages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu des Chroniques porte « Hilets ». La liste parallèle en Josué 21.15 porte « Holôn ».
