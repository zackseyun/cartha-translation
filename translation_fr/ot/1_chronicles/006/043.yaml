lexical_decisions:
- source_word: חִילֵז
  choice: Hilen
  rationale: Nom de lieu translittéré d’après la forme massorétique propre aux Chroniques. La consonne finale ז est ici rendue par « n » conformément à la lecture qeré implicite reflétée par la vocalisation et par la tradition textuelle de ce nom.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: Le terme désigne les terrains ouverts dépendant d’une ville lévitique, notamment destinés au bétail. « Pâturages » est naturel et clair en français dans cette liste.
- source_word: דְּבִיר
  choice: Debir
  rationale: Nom propre de lieu, translittéré selon l’usage français courant.
- source_word: וְאֶת / אֶת
  choice: avec / et
  rationale: Le marqueur d’objet אֶת n’a pas d’équivalent lexical en français. Dans cette énumération elliptique, la relation entre chaque ville et ses pâturages est rendue par « avec », tandis que וְ relie les éléments par « et ».
