  text: לִ/בְנֵי֮ גֵּרְשׁוֹם֒ מִ/מִּשְׁפַּ֗חַת חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת גּוֹלָ֥ן בַּ/בָּשָׁ֖ן וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת עַשְׁתָּר֖וֹת וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/056.yaml
  text: 'To the sons of Gershom[a], from the clan of the half-tribe of Manasseh: Golan in Bashan with its pasturelands, and Ashtaroth with its pasturelands.'
translation:
  language: fr
  text: 'Aux fils de Guershom, du clan de la demi-tribu de Manassé : Golan en Basan avec ses pâturages[a], et Ashtaroth avec ses pâturages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrains communaux » ; le mot hébreu désigne les espaces ouverts dépendant d’une ville, souvent utilisés pour faire paître les troupeaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גֵּרְשׁוֹם
  choice: Aux fils de Guershom
  rationale: Le préfixe ל indique les bénéficiaires de l’attribution. « Fils de Guershom » conserve l’expression généalogique hébraïque, qui peut inclure ses descendants.
- source_word: מִמִּשְׁפַּחַת חֲצִי מַטֵּה מְנַשֶּׁה
  choice: du clan de la demi-tribu de Manassé
  rationale: Dans ce contexte tribal, מִשְׁפָּחָה désigne un clan. « Demi-tribu » est l’expression française usuelle pour cette subdivision de Manassé.
- source_word: אֶת גּוֹלָן בַּבָּשָׁן
  choice: Golan, en Basan
  rationale: Golan est la ville attribuée et Basan la région où elle se trouve; la virgule rend clairement cette relation en français.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts rattachés à une ville, notamment destinés au pacage; « pâturages » est naturel et concret dans ce contexte.
- source_word: עַשְׁתָּרוֹת
  choice: Ashtaroth
  rationale: Translittération française transparente du nom de lieu hébreu.
- source_word: וְאֶת ... וְאֶת
  choice: avec ... et ... avec
  rationale: Cette formulation française naturelle préserve la coordination des deux villes et de leurs terrains respectifs.
theological_decisions: []
