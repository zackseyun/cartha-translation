base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/062.yaml
  text: 'To the sons of Merari who remained[a], from the tribe of Zebulun: Rimmono and its pasturelands, Tabor and its pasturelands.'
translation:
  language: fr
  text: 'Aux fils restants de Merari, issus de la tribu de Zabulon : Rimmono[a] et ses terrains de pâturage, Tabor et ses terrains de pâturage.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « Rimmono » ; le passage parallèle de Josué 21.35 porte « Dimna ».
    reason: textual_variant
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי הַנּוֹתָרִים
  choice: Aux fils de Merari qui restaient
  rationale: La préposition לְ introduit ici les bénéficiaires de l’attribution. Le participe הַנּוֹתָרִים désigne ceux qui restaient après les attributions précédentes.
- source_word: מִמַּטֵּה זְבוּלֻן
  choice: de la tribu de Zabulon
  rationale: Dans le contexte de la répartition du territoire, מַטֶּה désigne une tribu. « Zabulon » est la forme française courante du nom propre.
- source_word: רִמּוֹנוֹ
  choice: Rimmono
  rationale: Le texte massorétique de ce verset porte ce nom de lieu; la variante du passage parallèle est signalée en note plutôt que substituée au texte.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: Dans les listes de villes lévitiques, מִגְרָשׁ désigne les terrains ouverts entourant une ville, notamment destinés au bétail.
- source_word: תָּבוֹר
  choice: Tabor
  rationale: Le nom propre est translittéré selon sa forme française usuelle; il désigne ici une localité de la liste.
