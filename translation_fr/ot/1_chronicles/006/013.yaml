  text: וּ/בְנֵ֧י שְׁמוּאֵ֛ל הַ/בְּכֹ֥ר וַשְׁנִ֖י וַ/אֲבִיָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/013.yaml
  text: 'And the sons of Samuel: the firstborn[a], Vashni, and Abijah.'
translation:
  language: fr
  text: 'Et les fils de Samuel : le premier-né, Vashni[a], et Abiya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Vashni. L’expression peut aussi se comprendre comme « et le second » ; comparer 1 Samuel 8.2, où les fils de Samuel sont nommés Joël et Abiya.'
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Le nom construit בְנֵי suivi du nom propre se rend naturellement par « les fils de ». La coordination וּ est ici exprimée par l’enchaînement généalogique naturel en français plutôt que par un « et » initial lourd.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Transcription française traditionnelle et courante du nom propre.
- source_word: הַבְּכֹר
  choice: le premier-né
  rationale: Le terme désigne le rang familial; « le premier-né » en conserve précisément le sens généalogique.
- source_word: וַשְׁנִי
  choice: Vashni
  rationale: La vocalisation massorétique permet de lire la forme comme un nom propre. Cette lecture est conservée dans le texte, tandis que l’autre analyse possible, « et le second », est signalée en note.
- source_word: וַאֲבִיָּה
  choice: et Abiya
  rationale: La conjonction et le nom propre sont rendus directement; « Abiya » suit une transcription française courante de אֲבִיָּה.
theological_decisions:
- issue: Difficulté généalogique concernant les noms et l’ordre des fils de Samuel
  choice: Conserver « Vashni » dans le texte principal selon la vocalisation massorétique
  alternative: Comprendre וַשְׁנִי comme « et le second », ou rétablir « Joël » d’après 1 Samuel 8.2
  rationale: Le texte hébreu reçu est maintenu sans harmonisation silencieuse. L’ambiguïté réelle et le parallèle qui nomme Joël et Abiya sont présentés en note.
translation_notes:
  register: Français moderne, sobre et digne, adapté au style concis d’une généalogie. La ponctuation rend la structure nominale du verset sans ajouter de verbe absent de l’hébreu.
