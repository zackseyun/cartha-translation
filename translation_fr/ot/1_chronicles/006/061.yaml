  text: וּ/מִ/מַּטֵּ֣ה נַפְתָּלִ֗י אֶת קֶ֤דֶשׁ בַּ/גָּלִיל֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת חַמּ֖וֹן וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת קִרְיָתַ֖יִם וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/061.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee with its pasturelands[a], Hammon with its pasturelands, and Kiriathaim with its pasturelands.'
translation:
  language: fr
  text: 'Et de la tribu de Nephtali : Qédesh en Galilée avec ses pâturages[a], Hammon avec ses pâturages, et Qiriataïm avec ses pâturages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrains communaux » ; le mot hébreu désigne les terres ouvertes rattachées à chaque ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: Et de la tribu de
  rationale: Dans le contexte du partage territorial, מַטֶּה désigne une tribu. Les préfixes וּמִ sont naturellement rendus par « Et de ».
- source_word: נַפְתָּלִי
  choice: Nephtali
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: Qédesh en Galilée
  rationale: La préposition בְּ situe la ville dans la région; « en Galilée » est naturel et fidèle. La graphie « Qédesh » représente le nom hébreu en français moderne.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts rattachés à une ville lévitique, notamment destinés au bétail. Le suffixe féminin renvoie chaque fois à la ville nommée.
- source_word: חַמּוֹן
  choice: Hammon
  rationale: Translittération directe et usuelle du nom de lieu hébreu.
- source_word: קִרְיָתַיִם
  choice: Qiriataïm
  rationale: Translittération française du nom de lieu, avec tréma pour signaler que « aï » forme deux syllabes.
