lexical_decisions:
- source_word: קְדֵמוֹת
  choice: Kedémoth
  rationale: Nom de lieu translittéré selon un usage français lisible, sans le traduire.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: Le terme désigne les terrains ouverts rattachés à une ville, notamment aux villes lévitiques; « pâturages » est naturel en français et le possessif renvoie à chaque ville.
- source_word: מֵיפַעַת
  choice: Méphaath
  rationale: Nom de lieu translittéré sous une forme française qui rend la consonne ph par « ph » et indique clairement la prononciation initiale.
- source_word: וְאֶת ... וְאֶת
  choice: et ... et
  rationale: La conjonction jointe au marqueur d’objet direct organise la suite des villes et de leurs terrains; la coordination répétée conserve la structure additive de l’hébreu.
