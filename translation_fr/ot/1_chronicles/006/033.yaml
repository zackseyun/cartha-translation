id: 1CH.6.33
reference: 1 Chronicles 6:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּ֑ם נְתוּנִ֕ים לְ/כָ֨ל עֲבוֹדַ֔ת מִשְׁכַּ֖ן בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/033.yaml
  text: And their brothers the Levites were appointed for all the service of the tabernacle of the house of God[a].
translation:
  language: fr
  text: Leurs frères, les Lévites, étaient affectés[a] à tout le service du tabernacle de la maison de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « étaient donnés » ; ici, au sens d’être affectés ou assignés à une tâche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Leurs frères
  rationale: Le nom אֲחִים avec le suffixe de troisième personne du pluriel signifie littéralement « leurs frères » et peut aussi désigner des membres apparentés du même groupe. En français, le lien avec le contexte précédent rend inutile la traduction explicite du waw initial.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation tribale usuelle et précise des membres de la tribu de Lévi.
- source_word: נְתוּנִים
  choice: étaient affectés
  rationale: Le participe passif de נתן signifie littéralement « donnés ». Dans ce contexte d'organisation du service cultuel, « affectés » exprime naturellement l'idée d'une attribution durable à une fonction, tout en conservant la valeur passive.
- source_word: לְכָל עֲבוֹדַת
  choice: à tout le service
  rationale: La préposition ל marque ici l'affectation à une tâche, et עֲבוֹדָה désigne le service ou le travail cultuel. « Service » convient au contexte sans introduire un vocabulaire ecclésiastique postérieur.
- source_word: מִשְׁכַּן
  choice: tabernacle
  rationale: Terme français traditionnel et encore intelligible pour la demeure sacrée mobile. Il permet aussi de conserver la distinction présente dans l'hébreu entre מִשְׁכַּן et בֵּית.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Traduction directe de l'expression hébraïque. « Temple de Dieu » serait plus interprétatif et effacerait le terme « maison ».
theological_decisions:
- issue: Rapport entre « tabernacle » et « maison de Dieu » dans le contexte des Chroniques
  choice: 'Conserver les deux expressions distinctes : « le tabernacle de la maison de Dieu »'
  alternative: Réduire l'expression à « la maison de Dieu » ou la reformuler comme « le temple de Dieu »
  rationale: Le texte hébreu emploie à la fois מִשְׁכַּן et בֵּית הָאֱלֹהִים. Les maintenir préserve la formulation inhabituelle et la tension entre le langage du tabernacle et celui de la maison, sans les harmoniser.
translation_notes:
  register: Français international moderne, sobre et digne. « Affectés » est naturel dans un contexte d'organisation des fonctions, tandis que la note conserve le sens littéral du participe hébreu. La formulation inhabituelle « tabernacle de la maison de Dieu » est volontairement maintenue afin de refléter les deux termes du texte source.
