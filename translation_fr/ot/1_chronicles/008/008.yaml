base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/008.yaml
  text: And Shaharaim fathered children in the country of Moab after he sent away Hushim and Baara[b][a], his wives.
translation:
  language: fr
  text: Shaharaïm eut des enfants dans le territoire de Moab[a], après avoir renvoyé Houshim et Baara, ses épouses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans le champ de Moab »; on peut aussi traduire : « dans la campagne » ou « dans le territoire de Moab ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « depuis son renvoi d’eux : Houshim et Baara, ses épouses ». La construction hébraïque est difficile; elle est généralement comprise au sens de « après les avoir renvoyées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׁחֲרַיִם
  choice: Shaharaïm
  rationale: Le waw relie ce verset à la généalogie précédente; en français, l’enchaînement reste naturel sans rendre systématiquement la conjonction par « et ». Le nom propre est translittéré sous une forme lisible en français.
- source_word: הוֹלִיד
  choice: eut des enfants
  rationale: Dans ce contexte généalogique, le hiphil de ילד signifie « engendrer, devenir père ». Cette formulation naturelle n’anticipe ni le nombre ni l’identité des descendants indiqués au verset suivant.
- source_word: בִּ/שְׂדֵה מוֹאָב
  choice: dans le territoire de Moab
  rationale: שָׂדֶה signifie littéralement « champ », mais peut désigner une campagne, une contrée ou un territoire dans une expression géographique.
- source_word: מִן שִׁלְח/וֹ אֹתָם
  choice: après avoir renvoyé
  rationale: La préposition מִן suivie de l’infinitif construit exprime ici vraisemblablement une circonstance temporelle. « Après avoir renvoyé » restitue idiomatiquement cette relation tout en conservant la valeur de שלח.
- source_word: חוּשִׁים
  choice: Houshim
  rationale: Nom propre translittéré selon une graphie adaptée au français.
- source_word: וְ/אֶת בַּעֲרָא
  choice: et Baara
  rationale: Le marqueur d’objet direct introduit le second nom; seul le lien de coordination est exprimé en français.
- source_word: נָשָׁיו
  choice: ses femmes
  rationale: Le pluriel de אִשָּׁה avec suffixe désigne ici les épouses de Shaharaïm. « Ses femmes » est une formulation française naturelle qui préserve la portée matrimoniale du contexte.
theological_decisions:
- issue: Rapport syntaxique entre le renvoi et Houshim et Baara
  choice: Comprendre Houshim et Baara comme l’objet de « renvoyer » et comme les femmes de Shaharaïm
  alternative: Rattacher autrement les noms ou la mention « ses femmes » dans cette syntaxe difficile
  rationale: L’ordre hébreu et l’apposition נָשָׁיו soutiennent le sens retenu, mais la construction est assez resserrée pour justifier une note signalant sa littéralité et son ambiguïté relative.
translation_notes:
  register: Français moderne, sobre et digne, adapté au registre généalogique. La formulation évite une lourdeur littérale, tandis que les notes conservent les nuances géographique et syntaxique de l’hébreu.
