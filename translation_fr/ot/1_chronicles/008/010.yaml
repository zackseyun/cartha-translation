  text: וְ/אֶת יְע֥וּץ וְ/אֶת שָֽׂכְיָ֖ה וְ/אֶת מִרְמָ֑ה אֵ֥לֶּה בָנָ֖י/ו רָאשֵׁ֥י אָבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/010.yaml
  text: and Jeuz[a], and Sachia, and Mirmah. These were his sons, heads of fathers’ houses.
translation:
  language: fr
  text: ainsi que Yéouts, Sakia et Mirma. Ceux-ci étaient ses fils, chefs de maisons ancestrales[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chefs de clans ». L’hébreu dit littéralement « chefs de pères », expression qui désigne les responsables de maisons ancestrales ou de groupes familiaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְעוּץ
  choice: Yéouts
  rationale: Nom propre transcrit d’après la forme hébraïque yeʿûṣ, dans une graphie française qui rend distinctement les voyelles et la finale consonantique.
- source_word: שָׂכְיָה
  choice: Sakia
  rationale: Nom propre transcrit plutôt que traduit. « Sakia » offre une forme française lisible tout en suivant les consonnes et les voyelles du nom hébreu.
- source_word: מִרְמָה
  choice: Mirma
  rationale: Dans cette généalogie, le mot est un nom de personne; il ne convient donc pas de le traduire par le sens du nom commun apparenté, « tromperie ».
- source_word: אֵלֶּה
  choice: Ceux-ci
  rationale: Le démonstratif pluriel renvoie aux trois hommes qui viennent d’être nommés. « Ceux-ci » convient à des personnes et restitue naturellement la proposition nominale hébraïque.
- source_word: בָנָיו
  choice: ses fils
  rationale: Le pluriel masculin désigne ici les fils dans un contexte généalogique; cette formulation est plus précise que « ses enfants ».
- source_word: רָאשֵׁי אָבוֹת
  choice: chefs de maisons ancestrales
  rationale: L’expression désigne les responsables de groupes familiaux issus d’un ancêtre. « Maisons ancestrales » rend l’idiome sans conserver en français l’obscur littéralisme « pères ».
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: ainsi que …, … et …
  rationale: Les particules marquent la continuation d’une liste de compléments commencée au verset précédent. « Ainsi que » conserve ce lien syntaxique, tandis que la coordination répétée est rendue selon l’usage naturel du français.
theological_decisions: []
