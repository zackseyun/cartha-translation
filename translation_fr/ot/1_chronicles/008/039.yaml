  text: 'The sons of Eshek his brother: Ulam his firstborn[a], Jeush the second, and Eliphelet the third.'
translation:
  language: fr
  text: 'Les fils d’Ésheq, son frère[a] : Oulam, son premier-né, Yéoush le deuxième et Éliphéleth le troisième.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et les fils d’Ésheq, son frère ». L’hébreu commence par une conjonction, souvent laissée implicite dans le style généalogique français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Le nom pluriel à l’état construit introduit la descendance d’Ésheq. Dans une généalogie française, la conjonction initiale וּ peut naturellement rester implicite.
- source_word: עֵשֶׁק
  choice: Ésheq
  rationale: Nom propre translittéré d’après l’hébreu, avec une graphie adaptée au français moderne.
- source_word: אָחִיו
  choice: son frère
  rationale: Le sens ordinaire est « son frère ». Le référent du possessif dépend du contexte généalogique précédent, comme en hébreu.
- source_word: אוּלָם
  choice: Oulam
  rationale: Translittération française du nom propre hébreu.
- source_word: בְּכֹרוֹ
  choice: son premier-né
  rationale: Rend précisément le statut généalogique du fils né le premier, sans le réduire au simple sens d’« aîné ».
- source_word: יְעוּשׁ
  choice: Yéoush
  rationale: Translittération française du nom propre hébreu.
- source_word: הַשֵּׁנִי
  choice: le deuxième
  rationale: L’adjectif ordinal indique directement l’ordre des fils.
- source_word: וֶאֱלִיפֶלֶט
  choice: et Éliphéleth
  rationale: La conjonction précédant le dernier élément est conservée; le nom propre est translittéré selon une forme française lisible.
- source_word: הַשְּׁלִשִׁי
  choice: le troisième
  rationale: Rend directement l’adjectif ordinal hébreu.
