lexical_decisions:
- source_word: יִפְדְיָה
  choice: Yifdeya
  rationale: Nom propre transcrit d’après l’hébreu. La graphie avec Y rend directement la consonne initiale yod, tandis que la terminaison -ya reflète la forme abrégée du nom divin.
- source_word: פניאל
  choice: Peniel
  rationale: Nom propre transcrit selon la vocalisation du texte massorétique. « Penouel » est une forme apparentée attestée ailleurs, mais la vocalisation présente soutient ici « Peniel ».
- source_word: בְּנֵי
  choice: étaient fils de
  rationale: Pluriel construit de « fils ». Le français ajoute « étaient » dans cette proposition nominale généalogique afin d’obtenir une phrase naturelle et claire.
- source_word: שָׁשָׁק
  choice: Shashaq
  rationale: Nom propre transcrit de manière à représenter distinctement les consonnes hébraïques shin et qof, sans recourir à des graphies françaises anciennes.
