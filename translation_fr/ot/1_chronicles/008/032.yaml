  text: וּ/מִקְל֖וֹת הוֹלִ֣יד אֶת שִׁמְאָ֑ה וְ/אַף הֵ֗מָּה נֶ֧גֶד אֲחֵי/הֶ֛ם יָשְׁב֥וּ בִ/ירוּשָׁלִַ֖ם עִם אֲחֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/032.yaml
  text: Mikloth fathered Shimeah[a]. They too lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: fr
  text: Mikloth engendra Shiméa. Eux aussi habitaient en face de leurs frères[a], à Jérusalem, avec leurs frères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près de leurs frères »; la préposition hébraïque peut indiquer une position devant quelqu’un, en face de lui ou à proximité de lui.
    reason: lexical_alternative
  - marker: b
    text: Ici, « frères » désigne probablement des membres du même clan ou de la même parenté au sein de la généalogie benjaminite, et pas nécessairement seulement des frères biologiques.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: Mikloth
  rationale: Le nom propre est translittéré selon une forme française usuelle. La conjonction initiale n’est pas exprimée séparément, puisque le lien avec la généalogie précédente reste clair.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans ce contexte généalogique, le verbe désigne le fait d’avoir pour descendant direct; « engendra » est concis, digne et précis.
- source_word: אֶת שִׁמְאָה
  choice: Sh iméa
  rationale: La marque de l’objet direct n’est pas traduite; le nom personnel est translittéré « Shiméa ».
- source_word: וְאַף הֵמָּה
  choice: Eux aussi
  rationale: Cette tournure restitue l’idée emphatique d’inclusion portée par la combinaison hébraïque.
- source_word: נֶגֶד
  choice: en face de
  rationale: Le terme exprime une relation spatiale pouvant signifier « devant », « en face de » ou, selon le contexte, « près de ». « En face de » préserve ici le sens concret sans le réduire à la simple proximité.
- source_word: אֲחֵיהֶם
  choice: leurs frères
  rationale: Traduction littérale du terme de parenté; dans cette généalogie, il peut désigner plus largement des membres du même clan ou de la même parenté.
- source_word: יָשְׁבוּ
  choice: habitaient
  rationale: Le verbe signifie ici résider ou demeurer; « habitaient » est naturel dans une notice d’établissement.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: Forme française courante du nom de lieu, avec la préposition idiomatique.
- source_word: עִם אֲחֵיהֶם
  choice: avec leurs frères
  rationale: La répétition de « leurs frères » est conservée, conformément à l’hébreu, plutôt que lissée ou supprimée.
