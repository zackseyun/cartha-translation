- source_word: וַ/עֲרָד
  choice: Arad
  rationale: Le nom עֲרָד est transcrit « Arad ». La conjonction préfixée וַ est rendue par la ponctuation et la structure française de l’énumération.
- source_word: וָ/עָדֶר
  choice: et Éder
  rationale: La conjonction וָ est rendue par « et » devant le dernier élément. Le nom עָדֶר est transcrit « Éder » conformément à sa vocalisation massorétique.
