  variant: modern international French
source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִֽינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/033.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: fr
  text: Ner engendra Qish, Qish engendra Saül, et Saül engendra Jonathan, Malki-Shoua, Abinadab et Eshbaal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans 2 Samuel, Eshbaal est appelé Ish-Bosheth.
    reason: Indiquer l’autre forme du nom attestée dans le récit parallèle et aider le lecteur à reconnaître le même personnage.
lexical_decisions:
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans ce contexte généalogique, le hifil de ילד exprime la filiation masculine directe. « Engendra » en conserve la force et permet de reproduire clairement la structure répétitive de l’hébreu.
- source_word: נֵר
  choice: Ner
  rationale: Nom propre transcrit sous sa forme française usuelle.
- source_word: קִישׁ
  choice: Qish
  rationale: Transcription française qui représente naturellement la consonne initiale hébraïque et distingue ce nom du mot français « quiche ».
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Forme française usuelle du nom du fils de Saül, même si la forme hébraïque complète présente ici l’élément théophore initial.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malki-Shoua
  rationale: Transcription française du nom composé, avec un trait d’union qui en reflète les deux éléments.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Forme française courante de ce nom propre.
- source_word: אֶשְׁבָּעַל
  choice: Eshbaal
  rationale: Le texte hébreu des Chroniques porte explicitement Eshbaal. Cette forme est donc conservée dans le texte principal sans harmonisation avec le nom employé dans 2 Samuel.
theological_decisions:
- issue: Forme du nom du dernier fils de Saül dans la liste
  choice: Eshbaal dans le texte principal
  alternative: Ish-Bosheth
  rationale: Il s’agit d’une différence de forme nominale entre les livres bibliques, non d’une question doctrinale. La traduction suit directement le texte hébreu des Chroniques et signale en note la forme connue dans 2 Samuel.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « engendra » reprend la cadence généalogique de l’hébreu. Les noms suivent des formes françaises reconnaissables ou une transcription adaptée au français. Le marqueur de note est placé après « Eshbaal », le nom auquel la note se rapporte.
