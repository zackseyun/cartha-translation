  yaml_path: translation/ot/1_chronicles/008/030.yaml
  text: His firstborn son was Abdon[a], then Zur, Kish, Baal, and Nadab.
translation:
  language: fr
  text: Son fils premier-né était Abdon[a], puis Tsour, Qish, Baal et Nadab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Et son fils premier-né : Abdon, Tsour, Qish, Baal et Nadab. »'
    reason: La phrase hébraïque est une proposition nominale intégrée à une liste généalogique; le verbe « était » est sous-entendu, et la conjonction initiale relie ce verset au précédent.
lexical_decisions:
- source_word: וּבְנוֹ
  choice: Son fils
  rationale: Le nom בֵּן avec le suffixe pronominal signifie « son fils ». Le ו initial relie le verset à la généalogie précédente, mais il n’est pas nécessaire de le rendre par « et » dans une formulation française naturelle.
- source_word: הַבְּכוֹר
  choice: premier-né
  rationale: Le terme désigne le fils qui occupe le premier rang dans l’ordre des naissances. « Premier-né » en conserve directement le sens généalogique.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Nom propre transcrit selon une forme française claire et courante.
- source_word: וְצוּר
  choice: puis Tsour
  rationale: Le nom propre צוּר est transcrit « Tsour ». Dans cette énumération, « puis » rend naturellement la progression indiquée par la coordination répétée.
- source_word: וְקִישׁ
  choice: Qish
  rationale: Nom propre transcrit de manière à représenter la consonne hébraïque ק et à le distinguer du son français habituel de « qu ».
- source_word: וּבַעַל
  choice: Baal
  rationale: Il s’agit ici d’un nom de personne dans une généalogie; il est donc transcrit plutôt que traduit comme un titre ou interprété comme une référence explicite à une divinité.
- source_word: וְנָדָב
  choice: Nadab
  rationale: Nom propre transcrit selon une forme française claire et traditionnelle.
