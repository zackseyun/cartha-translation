base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/040.yaml
  text: The sons of Ulam were mighty men of valor[a], drawers of the bow, and had many sons and grandsons, one hundred and fifty[c][b]. All these were from the sons of Benjamin.
translation:
  language: fr
  text: Les fils d’Oulam étaient de vaillants guerriers et des archers[a] ; ils avaient beaucoup de fils et de petits-fils, soit cent cinquante en tout. Tous ceux-là descendaient de Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui bandent l’arc » ou « ceux qui foulent l’arc ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אוּלָם
  choice: Les fils d’Oulam étaient
  rationale: Le wayyiqtol de היה introduit ici une description récapitulative dans un cadre généalogique.
- source_word: אֲנָשִׁים גִּבֹּרֵי חַיִל
  choice: de vaillants guerriers
  rationale: Cette expression qualifie des hommes reconnus pour leur force et leur aptitude au combat; cette formulation française en restitue naturellement la portée militaire.
- source_word: דֹּרְכֵי קֶשֶׁת
  choice: des archers[a]
  rationale: L’expression participiale désigne littéralement ceux qui bandent ou foulent l’arc, c’est-à-dire des archers; une note conserve l’image hébraïque.
- source_word: וּמַרְבִּים בָּנִים וּבְנֵי בָנִים
  choice: Ils eurent beaucoup de fils et de petits-fils
  rationale: Le participe causatif de רבה exprime ici la multiplication de la descendance. « Petits-fils » rend naturellement l’expression « fils des fils ».
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: au nombre de cent cinquante
  rationale: La tournure indique clairement que le nombre récapitule l’ensemble des fils et petits-fils, tout en gardant la valeur de l’apposition hébraïque.
- source_word: כָּל אֵלֶּה מִבְּנֵי בִנְיָמִן
  choice: Tous ceux-là descendaient de Benjamin
  rationale: Dans ce contexte généalogique, מן avec בני marque l’appartenance par filiation; « descendaient de Benjamin » évite de suggérer qu’ils seraient ses fils immédiats.
