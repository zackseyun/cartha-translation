source:
  edition: WLC
  text: אֵ֣לֶּה רָאשֵׁ֥י אָב֛וֹת לְ/תֹלְדוֹתָ֖/ם רָאשִׁ֑ים אֵ֖לֶּה יָשְׁב֥וּ בִ/ירוּשָׁלִָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/028.yaml
  text: These were heads of fathers’ houses according to their generations[a], chief men. These lived in Jerusalem.
translation:
  language: fr
  text: 'Ceux-ci étaient les chefs des familles ancestrales, selon leurs lignées[a] : des hommes de premier rang. Ils habitaient à Jérusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon leurs générations ». L’hébreu répète aussi le mot traduit par « chefs » pour souligner leur rang.
    reason: Précise l’alternative lexicale de לְתֹלְדוֹתָם et signale l’insistance produite en hébreu par la répétition de la racine רֹאשׁ.
lexical_decisions:
- source_word: רָאשֵׁי אָבוֹת
  choice: les chefs des familles ancestrales
  rationale: L’expression désigne les responsables de groupes familiaux issus d’un même ancêtre. Cette formulation rend l’organisation familiale ancienne dans un français actuel, sans le calque peu naturel « chefs des pères ».
- source_word: לְתֹלְדוֹתָם
  choice: selon leurs lignées
  rationale: Le terme renvoie ici aux générations ou aux lignes de descendance selon lesquelles les chefs sont présentés. « Lignées » convient au contexte généalogique sans supposer explicitement des registres écrits.
- source_word: רָאשִׁים
  choice: des hommes de premier rang
  rationale: Le mot reprend la racine de « chefs » et souligne leur statut. Cette expression préserve l’insistance sans produire en français la répétition maladroite « chefs… chefs ».
- source_word: יָשְׁבוּ
  choice: habitaient
  rationale: Dans ce contexte, le verbe exprime la résidence. « Habitaient » est précis, naturel et d’un registre digne.
- source_word: בִירוּשָׁלָם
  choice: à Jérusalem
  rationale: Forme française usuelle du nom de lieu, avec la préposition appropriée au verbe « habiter ».
- source_word: אֵלֶּה ... אֵלֶּה
  choice: Ceux-ci ... Ils
  rationale: Le premier démonstratif est conservé explicitement. Le second est repris par un pronom afin d’éviter une lourdeur en français tout en maintenant la seconde proposition distincte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Familles ancestrales » restitue l’institution clanique sans employer le calque traditionnel mais obscur « maisons paternelles ». La ponctuation met en relief le statut des personnes énumérées.
