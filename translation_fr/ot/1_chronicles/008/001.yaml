  rationale: Rend naturellement l’ordinal défini au sein de l’énumération.
- source_word: וְאַחְרַח
  choice: Aharah
  rationale: Reproduit au plus près la forme massorétique אַחְרַח telle qu’elle figure dans ce verset.
- source_word: הַשְּׁלִישִׁי
  choice: le troisième
  rationale: Rend l’ordinal défini et préserve l’ordre généalogique explicite.
