- source_word: וֶ/אֱלִיאֵל
  choice: et Éliel
  rationale: Le nom est donné sous sa forme française conventionnelle, et la conjonction ו est rendue par « et » devant le dernier élément de l’énumération, conformément à l’usage naturel du français.
