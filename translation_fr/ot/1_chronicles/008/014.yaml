  rationale: Nom propre translittéré directement d’après l’hébreu, avec « sh » pour שׁ.
- source_word: וִ/ירֵמוֹת
  choice: et Yerémoth
  rationale: Le waw est rendu par « et » pour marquer le dernier élément de l’énumération. La forme du nom est rendue « Yerémoth », translittération française naturelle de ירמות tenant compte de la vocalisation massorétique et de la valeur consonantique initiale de י.
