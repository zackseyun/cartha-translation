  text: וַ/יּ֖וֹלֶד מִן חֹ֣דֶשׁ אִשְׁתּ֑/וֹ אֶת יוֹבָב֙ וְ/אֶת צִבְיָ֔א וְ/אֶת מֵישָׁ֖א וְ/אֶת מַלְכָּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/009.yaml
  text: And he fathered Jobab[a], Zibia, Mesha, and Malcam by Hodesh his wife.
translation:
  language: fr
  text: Il engendra de sa femme Hodesh Jobab, Tsibia, Mésha et Malkam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: il engendra
  rationale: Le hiphil de ילד, dans cette généalogie, désigne le fait d’avoir pour descendants les fils nommés. « Il engendra » conserve clairement la perspective généalogique masculine tout en restant compréhensible en français actuel.
- source_word: מִן
  choice: avec
  rationale: Devant le nom de l’épouse et mère des enfants, la préposition indique ici leur origine maternelle. « Avec sa femme Hodesh » est une formulation française naturelle; le sens plus littéral « de sa femme Hodesh » est signalé en note.
- source_word: חֹדֶשׁ אִשְׁתּוֹ
  choice: sa femme Hodesh
  rationale: חֹדֶשׁ est un nom propre, translittéré « Hodesh », et אִשְׁתּוֹ désigne sans ambiguïté son épouse dans ce contexte.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: Jobab, Tsibia, Mésha et Malkam
  rationale: Les marqueurs répétés du complément d’objet direct n’ont pas d’équivalent explicite nécessaire en français; ils sont rendus par une énumération coordonnée naturelle.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Translittération française usuelle du nom propre.
- source_word: צִבְיָא
  choice: Tsibia
  rationale: Translittération adaptée aux conventions phonétiques du français, où « Ts » représente naturellement le tsadé initial.
- source_word: מֵישָׁא
  choice: Mésha
  rationale: Translittération française du nom propre, avec accent pour guider la prononciation.
- source_word: מַלְכָּם
  choice: Malkam
  rationale: Le terme fonctionne ici comme un nom de personne; « Malkam » en donne une translittération claire en français.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le verbe « engendra » maintient la précision généalogique du texte, tandis que « avec sa femme Hodesh » évite une tournure française pesante. La note conserve la nuance plus littérale de la préposition hébraïque.
