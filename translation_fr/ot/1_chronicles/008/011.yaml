  text: וּ/מֵ/חֻשִׁ֛ים הוֹלִ֥יד אֶת אֲבִיט֖וּב וְ/אֶת אֶלְפָּֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/011.yaml
  text: And by Hushim he fathered Abitub and Elpaal[a].
translation:
  language: fr
  text: Et il eut d’Houshim Abitoub et Elpaal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Et, de Houshim, il engendra Abitoub et Elpaal. » La préposition hébraïque indique ici l’origine ou la relation généalogique de cette descendance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֻשִׁים
  choice: De Houshim
  rationale: La préposition מִן exprime ici l’origine ou la filiation. « De Houshim » conserve cette relation sans préciser au-delà de l’hébreu le statut exact de Houshim; la coordination initiale est rendue implicitement dans la continuité de la généalogie.
- source_word: הוֹלִיד
  choice: il eut pour fils
  rationale: Le hiphil de ילד signifie ici « engendrer, devenir père de ». La tournure française actuelle « eut pour fils » est naturelle dans une généalogie et maintient la filiation masculine indiquée par le contexte.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur de l’objet direct, sans équivalent lexical autonome en français.
- source_word: אֲבִיטוּב
  choice: Abitoub
  rationale: Translittération française lisible du nom propre hébreu.
- source_word: וְ/אֶת
  choice: et
  rationale: La conjonction est rendue par « et »; le marqueur de l’objet direct n’est pas traduit séparément.
- source_word: אֶלְפָּעַל
  choice: Elpaal
  rationale: Translittération française lisible du nom propre, sans apostrophe afin d’éviter une précision graphique inutile.
theological_decisions:
- issue: Nature de la relation exprimée par מֵחֻשִׁים
  choice: Conserver la formulation « De Houshim »
  alternative: « Avec Houshim » ou « Houshim lui donna »
  rationale: L’hébreu indique la provenance ou la relation généalogique, mais ne formule pas explicitement le rôle de Houshim. La traduction évite donc de préciser davantage que le texte source.
translation_notes:
  register: Français moderne, sobre et digne, adapté au style généalogique. « Il eut pour fils » évite l’archaïsme d’« engendra » dans le texte principal, tandis que la note conserve l’alternative plus formelle.
