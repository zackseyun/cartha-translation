source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י אֵח֑וּד אֵ֣לֶּה הֵ֞ם רָאשֵׁ֤י אָבוֹת֙ לְ/י֣וֹשְׁבֵי גֶ֔בַע וַ/יַּגְל֖וּ/ם אֶל מָנָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/006.yaml
  text: 'These were the sons of Ehud[a]. These were the heads of fathers’ houses for the inhabitants of Geba[b], and they carried them into exile to Manahath:'
translation:
  language: fr
  text: 'Voici les fils d’Éhoud. Ils étaient les chefs des familles ancestrales[a] des habitants de Guéba, et ils les déportèrent[b] à Manahath :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque rendue par « chefs des familles ancestrales » désigne les dirigeants de clans ou de maisonnées issues d’un même ancêtre.
    reason: cultural_note
  - marker: b
    text: Le texte hébreu ne précise pas explicitement qui déporta qui ; les deux groupes sont désignés par des pronoms pluriels.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה בְּנֵי אֵחוּד
  choice: Voici les fils d’Éhoud
  rationale: « Voici » introduit naturellement cette notice généalogique en français. « Fils » conserve la formulation généalogique hébraïque, qui peut aussi englober des descendants.
- source_word: אֵלֶּה הֵם רָאשֵׁי אָבוֹת
  choice: Ils étaient les chefs des familles ancestrales
  rationale: Le pronom reprend naturellement les fils d’Éhoud. « Familles ancestrales » exprime la structure sociale des maisons paternelles sans le calque peu idiomatique « maisons de pères ».
- source_word: לְיֹשְׁבֵי גֶבַע
  choice: des habitants de Guéba
  rationale: 'Le lamed indique ici vraisemblablement l’appartenance ou la relation : ces hommes étaient les chefs des groupes ancestraux liés aux habitants de Guéba.'
- source_word: וַיַּגְלוּם
  choice: et ils les déportèrent
  rationale: La forme causative de גלה avec suffixe objet pluriel décrit le fait de contraindre des personnes à partir en exil. « Déportèrent » est concis, actuel et conserve l’idée de déplacement forcé.
- source_word: אֶל מָנָחַת
  choice: à Manahath
  rationale: La préposition marque la destination; le nom de lieu est transcrit selon une forme française usuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La répétition démonstrative de l’hébreu est rendue par « Voici » puis par une reprise pronominale naturelle. L’ambiguïté concernant les référents de « ils » et « les » est conservée et signalée en note.
