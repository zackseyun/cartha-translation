base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/038.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan. All these were the sons of Azel.'
translation:
  language: fr
  text: 'Azel eut six fils[a], et voici leurs noms : Azrikam, son premier-né, Ismaël, Shearia, Abdias et Hanan. Tous ceux-là étaient les fils d’Azel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu annonce six fils, mais les noms énumérés n’en comptent que cinq. Il lit : « Azrikam, son premier-né, Ismaël, Shearia, Abdias et Hanan. »'
    reason: difficulté textuelle
lexical_decisions:
- source_word: וּלְאָצֵל שִׁשָּׁה בָנִים
  choice: Azel eut six fils
  rationale: La construction hébraïque avec לְ exprime ici la possession dans une formule généalogique. « Azel eut six fils » est naturel en français et conserve précisément le sens.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: dont voici les noms
  rationale: Cette tournure française rend naturellement la formule hébraïque qui introduit les noms des fils.
- source_word: עַזְרִיקָם
  choice: Azrikam
  rationale: Translittération usuelle du nom propre.
- source_word: בֹּכְרוּ
  choice: Bokérou
  rationale: Le mot est compris comme un nom propre, conformément à la syntaxe de la liste et au nombre annoncé de six fils. Le prendre au sens de « son premier-né » ne laisserait que cinq fils nommés.
- source_word: יִשְׁמָעֵאל
  choice: Ismaël
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: שְׁעַרְיָה
  choice: Shearia
  rationale: Translittération française lisible du nom propre hébreu.
- source_word: עֹבַדְיָה
  choice: Abdias
  rationale: Forme française traditionnelle du nom biblique.
- source_word: חָנָן
  choice: Hanan
  rationale: Translittération courante et claire du nom propre.
- source_word: כָּל אֵלֶּה בְּנֵי אָצַל
  choice: Tous ceux-là étaient fils d’Azel
  rationale: Rend directement la formule récapitulative hébraïque tout en gardant un style généalogique naturel en français.
