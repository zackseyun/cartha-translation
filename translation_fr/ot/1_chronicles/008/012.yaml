  text: וּ/בְנֵ֣י אֶלְפַּ֔עַל עֵ֥בֶר וּ/מִשְׁעָ֖ם וָ/שָׁ֑מֶד ה֚וּא בָּנָ֣ה אֶת אוֹנ֔וֹ וְ/אֶת לֹ֖ד וּ/בְנֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/012.yaml
  text: 'The sons of Elpaal: Eber[a], Misham, and Shemed[b]; he built Ono and Lod and its villages.'
translation:
  language: fr
  text: 'Les fils d’Elpaal : Éber, Misham et Shémed. Il[b] bâtit Ono, Lod et les villages qui en dépendaient[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et ses filles », expression hébraïque désignant les localités ou villages dépendant d’une ville.'
    reason: lexical_alternative
  - marker: b
    text: Le pronom « il » renvoie le plus naturellement à Shémed, le dernier fils nommé; certains le comprennent plus largement comme se rapportant à cette lignée familiale.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי אֶלְפַּעַל
  choice: Les fils d’Elpaal
  rationale: Le pluriel construit de בֵּן introduit une liste généalogique. La conjonction initiale n’est pas exprimée afin de produire un intitulé naturel en français.
- source_word: עֵבֶר וּמִשְׁעָם וָשָׁמֶד
  choice: Éber, Misham et Shémed
  rationale: Les noms propres sont translittérés directement, avec des accents aidant la lecture française lorsqu’ils conviennent.
- source_word: הוּא
  choice: Il
  rationale: Le pronom masculin singulier reprend le plus naturellement Shémed, dernier homme nommé, sans toutefois imposer explicitement cette identification dans le corps du texte.
- source_word: בָּנָה
  choice: bâtit
  rationale: Le qal accompli de בנה signifie normalement « bâtir ». « Fonda » ou « rebâtit » ajouterait une précision absente de la forme hébraïque.
- source_word: אוֹנוֹ וְאֶת לֹד
  choice: Ono, Lod
  rationale: Les deux toponymes sont translittérés à partir de leur forme hébraïque; les marqueurs d’objet direct ne sont pas rendus en français.
- source_word: וּבְנֹתֶיהָ
  choice: et les villages qui en dépendaient
  rationale: Littéralement « et ses filles »; appliquée à une ville, cette expression hébraïque désigne ses agglomérations ou villages dépendants. La formulation française transmet l’idiome sans l’aplatir en simples villages voisins.
theological_decisions:
- issue: Référent du pronom הוּא
  choice: Le texte garde le simple pronom « Il », avec une note indiquant que Shémed est le référent le plus naturel.
  alternative: Transformer le pronom en « Shémed » ou rapporter plus largement l’action à la famille d’Elpaal.
  rationale: La syntaxe favorise Shémed, dernier nom cité, mais l’expression généalogique permet une compréhension moins strictement individuelle. La traduction ne tranche donc pas silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase généalogique reste concise; « bâtit » conserve le sens formel du verbe, tandis que l’idiome urbain est rendu dans une formulation immédiatement intelligible.
