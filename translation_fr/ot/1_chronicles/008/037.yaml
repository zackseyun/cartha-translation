translation_notes:
  register: Français international moderne, sobre et digne. La construction nominale répétée (« son fils »), ponctuée par des points-virgules, conserve le rythme condensé de la généalogie hébraïque. Les graphies des noms suivent une translittération adaptée au français plutôt que les conventions anglaises.
