  text: And Moza fathered Binea; Rephah was his son, Eleasah his son, Azel his son.
translation:
  language: fr
  text: Motsa engendra Binéa[a], qui engendra Rapha[b], qui engendra Éléasa[c], qui engendra Atsel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Bina » ; le nom hébreu בִּנְעָא peut être translittéré de ces deux manières.
    reason: lexical_alternative
  - marker: b
    text: Certaines translittérations donnent « Rafa ».
    reason: lexical_alternative
  - marker: c
    text: Ou « Élasa ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצָא
  choice: Motsa
  rationale: La conjonction ו est rendue implicitement par la continuité de la généalogie, ce qui est naturel en français. Le nom מוֹצָא est translittéré « Motsa », forme qui représente le son de צ sans imposer une graphie anglaise.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans une généalogie, le hiphil de ילד signifie « engendrer, devenir père de ». « Engendra » est concis, précis et appartient au registre généalogique courant, sans être obscur.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: La marque hébraïque du complément d’objet direct n’a pas d’équivalent lexical en français ; la syntaxe française en exprime la fonction.
- source_word: בִּנְעָא
  choice: Binea
  rationale: Le nom est translittéré d’après sa forme hébraïque vocalisée ; la graphie « Binea » laisse percevoir la voyelle finale liée à ע.
- source_word: רָפָה
  choice: Rapha
  rationale: « Rapha » représente naturellement en français la vocalisation hébraïque et la consonne פ non occlusive dans ce contexte.
- source_word: בְנוֹ
  choice: son fils
  rationale: La répétition de « son fils » reproduit la structure en chaîne de l’hébreu, où chaque personnage est présenté comme le fils du précédent.
- source_word: אֶלְעָשָׂה
  choice: Éléasa
  rationale: Cette translittération française reflète les syllabes de la forme hébraïque tout en restant lisible et conforme aux habitudes françaises pour les noms bibliques.
- source_word: אָצֵל
  choice: Atsel
  rationale: « Atsel » rend clairement en français la consonne צ et suit directement la vocalisation hébraïque.
