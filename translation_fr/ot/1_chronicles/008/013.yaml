base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/013.yaml
  text: And Beriah and Shema—they were heads of fathers’ houses among the inhabitants of Aijalon[b][a]; they were the ones who drove out the inhabitants of Gath.
translation:
  language: fr
  text: Béria et Shéma étaient des chefs de familles parmi les habitants d’Ayalôn[a] ; ce sont eux qui chassèrent les habitants de Gath[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression hébraïque désignant les responsables de groupes familiaux ou de clans fondés sur l’ascendance.
    reason: cultural_note
  - marker: b
    text: 'Ou : « mirent en fuite ». Le verbe hébreu souligne qu’ils forcèrent les habitants de Gath à fuir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרִעָה וָשֶׁמַע
  choice: Béria et Shéma
  rationale: Les noms de personnes sont translittérés selon des formes françaises claires. La coordination hébraïque est rendue naturellement sans ajouter un « Et » peu idiomatique en tête de phrase.
- source_word: הֵמָּה
  choice: étaient / ce sont eux qui
  rationale: Le premier pronom indépendant s’intègre naturellement à la proposition française ; sa seconde occurrence, emphatique, est explicitement rendue par « ce sont eux qui ».
- source_word: רָאשֵׁי הָאָבוֹת
  choice: chefs des familles ancestrales
  rationale: Cette expression désigne les responsables de groupes familiaux fondés sur l’ascendance. Cette formulation reste précise tout en évitant le calque obscur « chefs des pères ».
- source_word: לְיוֹשְׁבֵי אַיָּלוֹן
  choice: parmi les habitants d’Ayalôn
  rationale: Dans ce contexte, la préposition indique vraisemblablement le groupe au sein duquel Béria et Shéma exerçaient leur autorité, plutôt que des personnes au bénéfice desquelles ils agissaient.
- source_word: אַיָּלוֹן
  choice: Ayalôn
  rationale: Le nom de lieu est translittéré dans une forme française proche de l’hébreu.
- source_word: הִבְרִיחוּ
  choice: chassèrent
  rationale: Le hiphil de ברח signifie faire fuir. « Chassèrent » exprime naturellement l’action causative et son résultat probable, tandis qu’une note conserve l’alternative plus littérale.
- source_word: אֶת יֹשְׁבֵי גַת
  choice: les habitants de Gath
  rationale: Traduction directe qui reprend « habitants » pour maintenir la cohérence lexicale avec la proposition précédente.
