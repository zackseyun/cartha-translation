  yaml_path: translation/ot/1_chronicles/008/007.yaml
  text: and Naaman[a], Ahijah[b], and Gera—he carried them into exile and fathered Uzza and Ahihud.
translation:
  language: fr
  text: et Naamân, Ahiya et Guéra — c’est lui[a] qui les emmena en exil[b] et qui engendra Ouzza et Ahihoud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom hébreu est au singulier et renvoie le plus naturellement à Guéra. Toutefois, la généalogie de cette section présente des difficultés textuelles et syntaxiques.
    reason: ambiguïté_syntaxique
  - marker: b
    text: 'Ou « qui les exila » ou « qui les déporta ». Le verbe hébreu est causatif : il signifie « les fit partir en exil ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: נַעֲמָן
  choice: Naamân
  rationale: Nom propre rendu selon la forme française traditionnelle et immédiatement reconnaissable.
- source_word: אֲחִיָּה
  choice: Ahiya
  rationale: Translittération française claire du nom propre, sans conserver la terminaison anglaise « -jah ».
- source_word: גֵרָא
  choice: Guéra
  rationale: Forme française usuelle qui représente naturellement la consonne initiale hébraïque.
- source_word: הוּא
  choice: c’est lui
  rationale: Le pronom indépendant a ici une valeur de reprise ou d’insistance; « c’est lui » la rend naturellement tout en laissant son antécédent à déterminer par la syntaxe.
- source_word: הֶגְלָם
  choice: qui les emmena en exil
  rationale: Le hiphil de גלה avec suffixe de troisième personne du pluriel signifie faire partir « eux » en exil; cette formulation conserve à la fois la valeur causative et l’objet pluriel.
- source_word: וְהוֹלִיד
  choice: et qui engendra
  rationale: Dans une généalogie, le hiphil de ילד désigne le fait d’engendrer. « Engendra » est précis, digne et courant dans ce genre littéraire.
- source_word: עֻזָּא
  choice: Ouzza
  rationale: Translittération française usuelle du nom propre.
- source_word: אֲחִיחֻד
  choice: Ahihoud
  rationale: Translittération française claire du nom propre.
