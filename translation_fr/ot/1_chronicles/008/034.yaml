  text: וּ/בֶן יְהוֹנָתָ֖ן מְרִ֣יב בָּ֑עַל וּ/מְרִ֥יב בַּ֖עַל הוֹלִ֥יד אֶת מִיכָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/034.yaml
  text: And the son of Jehonathan was Merib-baal[a], and Merib-baal fathered Micah.
translation:
  language: fr
  text: Le fils de Yehonatan fut Merib-Baal, et Merib-Baal engendra Mika[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En 2 Samuel 9.12, le même nom présente en hébreu une légère différence d’orthographe : מִיכָא au lieu de מִיכָה ici.'
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: Le fils de
  rationale: La conjonction ו relie ce maillon au déroulement de la généalogie. En français, la continuité est exprimée naturellement par l’enchaînement de la phrase, sans qu’un « et » initial soit nécessaire.
- source_word: יְהוֹנָתָן
  choice: Yehonatan
  rationale: Le nom est translittéré selon la forme précise employée par le Chroniste, sans être normalisé en « Jonathan ».
- source_word: מְרִיב בָּעַל / מְרִיב בַּעַל
  choice: Merib-Baal
  rationale: Le trait d’union permet de reconnaître les deux éléments hébreux comme un seul nom propre. La répétition désigne le même homme et reprend son nom pour poursuivre la généalogie.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans une généalogie, le hiphil de ילד indique que l’homme nommé est devenu le père du descendant. « Engendra » est concis, précis et adapté au registre généalogique.
- source_word: אֶת מִיכָה
  choice: Mika
  rationale: אֶת est la marque du complément d’objet direct et ne se traduit pas séparément. « Mika » translittère le nom מִיכָה sous une forme naturelle en français.
