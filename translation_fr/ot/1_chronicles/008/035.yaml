  text: וּ/בְנֵ֖י מִיכָ֑ה פִּית֥וֹן וָ/מֶ֖לֶךְ וְ/תַאְרֵ֥עַ וְ/אָחָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/035.yaml
  text: 'And the sons of Micah: Pithon[a], Melech, Tarea, and Ahaz.'
translation:
  language: fr
  text: 'Et les fils de Mika : Pitôn, Mélek, Taréa[a] et Ahaz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu est aussi transcrit « Tahréa » dans certaines traditions.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Et les fils de
  rationale: La conjonction וּ maintient la continuité de la généalogie, et בְנֵי désigne ici les fils nommément énumérés.
- source_word: מִיכָה
  choice: Mika
  rationale: Transcription française moderne du nom propre hébreu, qui évite de le confondre avec le prophète Michée.
- source_word: פִּיתוֹן
  choice: Pitôn
  rationale: Transcription directe du nom propre hébreu, avec l’accent circonflexe indiquant la voyelle longue.
- source_word: וָמֶלֶךְ
  choice: Mélek
  rationale: Dans ce contexte généalogique, מֶלֶךְ est un nom propre et non le nom commun « roi ». La conjonction n’est pas répétée en français dans l’énumération.
- source_word: וְתַאְרֵעַ
  choice: Taréa
  rationale: Transcription proche de la vocalisation massorétique du nom propre; une autre transcription traditionnelle est signalée en note.
- source_word: וְאָחָז
  choice: Ahaz
  rationale: Transcription française courante du nom propre; la conjonction est rendue naturellement par « et » devant le dernier élément de la liste.
theological_decisions: []
translation_notes:
  register: Style généalogique concis et digne. Les noms sont transcrits selon un usage français moderne, sans traduire Mélek par « roi ». Le marqueur de note est placé après Taréa, le nom auquel la variante Tahréa se rapporte.
