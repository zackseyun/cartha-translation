lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: Zebadia
  rationale: Nom propre précédé de la conjonction וּ. La forme « Zebadia » suit l’usage français courant des noms bibliques tout en représentant fidèlement l’hébreu זְבַדְיָה.
- source_word: וּ/מְשֻׁלָּם
  choice: Meshoullam
  rationale: Nom propre précédé de la conjonction וּ. « Meshoullam » est une translittération française claire et usuelle de מְשֻׁלָּם.
- source_word: וְ/חִזְקִי
  choice: Hizqi
  rationale: Nom propre précédé de la conjonction וְ. « Hizqi » reproduit directement la forme hébraïque חִזְקִי et évite de la confondre avec le nom différent Ézéchias.
- source_word: וָ/חָבֶר
  choice: Héber
  rationale: Nom propre précédé de la conjonction וָ. « Héber » est la forme française biblique traditionnelle et reconnaissable pour ce nom.
