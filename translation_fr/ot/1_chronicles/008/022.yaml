  rationale: Nom propre théophore transcrit plutôt que traduit; cette graphie est naturelle et reconnaissable en français.
- source_word: וְ / וָ / וֶ
  choice: et
  rationale: Les différents préfixes sont des formes vocalisées de la conjonction hébraïque. Dans une énumération française, des virgules séparent les premiers noms et « et » introduit le dernier.
