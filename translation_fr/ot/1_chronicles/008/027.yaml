  text: וְ/יַעֲרֶשְׁיָ֧ה וְ/אֵלִיָּ֛ה וְ/זִכְרִ֖י בְּנֵ֥י יְרֹחָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/027.yaml
  text: Jareshiah[a], Elijah, and Zichri were the sons of Jeroham.
translation:
  language: fr
  text: Yaaréshia, Élie et Zikri étaient fils[a] de Yéroham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfants » ou, dans un sens généalogique plus large, « descendants ».
    reason: alternative lexicale
lexical_decisions:
- source_word: יַעֲרֶשְׁיָה
  choice: Yaaréshia
  rationale: Nom propre translittéré d’après la forme hébraïque vocalisée, dans une graphie lisible en français.
- source_word: אֵלִיָּה
  choice: Élie
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu, préférée à une translittération mécanique comme « Éliyah ».
- source_word: זִכְרִי
  choice: Zikri
  rationale: Translittération française directe du nom propre hébreu, avec « k » pour rendre clairement le son consonantique.
- source_word: בְּנֵי
  choice: fils
  rationale: Le pluriel construit de בֵּן désigne le plus directement des « fils ». Les trois personnes nommées étant masculines, ce choix convient au contexte, tout en signalant en note la portée généalogique potentiellement plus large.
- source_word: יְרֹחָם
  choice: Yéroham
  rationale: Translittération du nom propre hébreu adaptée aux conventions et à la prononciation françaises.
