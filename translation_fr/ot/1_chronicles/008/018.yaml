  text: Yishmeraï, Yizlia et Yobab étaient les fils d’Elpaal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׁמְרַי
  choice: Yishmeraï
  rationale: Nom propre translittéré selon des conventions adaptées au français moderne; le yod initial est rendu par « Y » et le tréma évite de lire la finale comme une seule voyelle.
- source_word: יִזְלִיאָה
  choice: Yizlia
  rationale: Nom propre translittéré; « Y » représente le yod initial, et la forme reste lisible en français sans chercher à traduire le nom.
- source_word: יוֹבָב
  choice: Yobab
  rationale: Nom propre translittéré directement; « Y » rend le yod initial conformément à la prononciation hébraïque plutôt qu’à une forme traditionnelle passant par le latin.
- source_word: בְּנֵי
  choice: étaient fils de
  rationale: Pluriel construit de « fils ». Le texte hébreu est une proposition nominale; « étaient » est ajouté pour former une phrase française naturelle sans modifier le rapport généalogique.
- source_word: אֶלְפָּעַל
  choice: Elpaal
  rationale: Nom propre translittéré sous une forme simple et lisible; l’absence d’apostrophe évite une précision phonétique artificielle dans le corps du texte.
