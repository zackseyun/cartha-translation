  text: Guedor, Ahio et Zéker.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Zaker ». Le nom propre hébreu זָכֶר peut être transcrit de différentes manières.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְדוֹר
  choice: Guedor
  rationale: Le nom propre גְדוֹר est translittéré selon les conventions françaises. Dans cette liste généalogique, la conjonction initiale n’a pas besoin d’être répétée devant chaque nom pour restituer naturellement la coordination en français.
- source_word: וְאַחְיוֹ
  choice: Ahio
  rationale: Le nom propre אַחְיוֹ est translittéré « Ahio ». La coordination hébraïque répétée est rendue par la ponctuation française.
- source_word: וָזָכֶר
  choice: et Zéker
  rationale: La conjonction ו est rendue par « et » au dernier élément de la série. La forme « Zéker » reflète la vocalisation massorétique de זָכֶר et emploie une graphie accessible aux lecteurs francophones.
