base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/036.yaml
  text: Ahaz fathered Jehoaddah[a], and Jehoaddah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: fr
  text: Ahaz engendra Yehoadda[a]. Yehoadda engendra Alemeth, Azmaveth et Zimri, et Zimri engendra Motsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Yehoadda ; certaines traditions anglaises écrivent « Yehoada ».'
    reason: Variante de translittération du nom propre.
lexical_decisions:
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans cette généalogie, le hifil de ילד exprime la paternité ou la descendance directe. « Engendra » est concis, précis et reste intelligible dans le registre généalogique biblique.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Particule hébraïque marquant le complément d’objet direct défini; sa fonction est rendue par l’ordre normal des mots en français.
- source_word: יְהוֹעַדָּה
  choice: Yehoadda
  rationale: Translittération française qui suit de près la forme consonantique et la vocalisation du texte hébreu fourni.
- source_word: עָלֶמֶת
  choice: Alemeth
  rationale: Nom propre translittéré selon une forme biblique française claire.
- source_word: עַזְמָוֶת
  choice: Azmaveth
  rationale: Nom propre translittéré en conservant les principaux éléments consonantiques de l’hébreu.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Translittération française usuelle, employée de façon identique dans les deux occurrences.
- source_word: מוֹצָא
  choice: Motsa
  rationale: Translittération adaptée au français, où « ts » rend clairement la consonne hébraïque צ.
- source_word: וְ
  choice: et
  rationale: La conjonction relie simplement les membres et les générations de la liste, sans qu’il soit nécessaire d’expliciter davantage la succession.
