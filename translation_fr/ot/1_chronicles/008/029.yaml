  text: וּ/בְ/גִבְע֥וֹן יָשְׁב֖וּ אֲבִ֣י גִבְע֑וֹן וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ מַעֲכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/029.yaml
  text: In Gibeon lived the father of Gibeon[a], and his wife’s name was Maacah.
translation:
  language: fr
  text: À Gabaon habitaient le père de Gabaon[a] et sa femme, qui s’appelait Maaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le fondateur de Gabaon » ou « le chef de Gabaon » ; littéralement en hébreu : « le père de Gabaon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/גִבְע֥וֹן
  choice: À Gabaon
  rationale: Le préfixe combine la conjonction et la préposition (« et/à Gabaon »). En français, la conjonction peut rester implicite dans cette notice généalogique, tandis que le complément de lieu est conservé.
- source_word: יָשְׁב֖וּ
  choice: habitaient
  rationale: Le verbe ישׁב signifie ici résider ou habiter. L’imparfait « habitaient » convient à une notice généalogique décrivant le lieu de résidence.
- source_word: אֲבִ֣י גִבְע֑וֹן
  choice: le père de Gabaon
  rationale: 'La traduction littérale préserve l’expression hébraïque et son ambiguïté : « père » peut désigner un ancêtre, un fondateur ou un chef associé à la localité.'
- source_word: וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ
  choice: et sa femme, qui s’appelait
  rationale: Cette formulation française naturelle exprime la construction hébraïque « et le nom de sa femme [était] » sans modifier son sens.
- source_word: מַעֲכָֽה
  choice: Maaka
  rationale: Le nom propre est translittéré sous une forme française claire, reflétant les consonnes et la vocalisation hébraïques.
