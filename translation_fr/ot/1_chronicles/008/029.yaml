  register: Français moderne, naturel et digne. La formulation garde le pluriel du verbe hébreu en coordonnant explicitement le père de Gabaon et sa femme comme sujets de « habitaient », tout en conservant l’ambiguïté de « père de Gabaon » dans le texte principal.
