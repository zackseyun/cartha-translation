source:
  edition: WLC
  text: וְ/יוֹאָ֥ב בֶּן צְרוּיָ֖ה עַל הַ/צָּבָ֑א וִ/יהוֹשָׁפָ֥ט בֶּן אֲחִיל֖וּד מַזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/015.yaml
  text: And Joab son of Zeruiah was over the army[a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: fr
  text: Joab, fils de Tserouya, avait le commandement de l’armée, et Josaphat, fils d’Ahiloud, était archiviste[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « secrétaire » ou « chroniqueur »; le terme hébreu désigne un fonctionnaire royal chargé de conserver les archives et de rendre compte des affaires au roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: Joab
  rationale: La conjonction hébraïque relie ce verset à la liste administrative précédente; en français, la continuité de la liste reste naturelle sans commencer obligatoirement par « Et ». Le nom est rendu selon sa forme française usuelle.
- source_word: בֶּן צְרוּיָה
  choice: fils de Tserouya
  rationale: La filiation est traduite directement; « Tserouya » reproduit de manière lisible la forme hébraïque du nom.
- source_word: עַל הַ/צָּבָא
  choice: avait le commandement de l’armée
  rationale: L’expression indique que Joab exerçait l’autorité sur l’armée. Cette formulation française naturelle conserve la valeur fonctionnelle de la préposition עַל sans imposer un titre technique absent de l’hébreu.
- source_word: וִ/יהוֹשָׁפָט
  choice: et Josaphat
  rationale: La conjonction poursuit l’énumération des responsables; « Josaphat » est la forme française traditionnelle et largement reconnue du nom.
- source_word: בֶּן אֲחִיל֖וּד
  choice: fils d’Ahiloud
  rationale: La construction généalogique est rendue simplement et le nom est translittéré sous une forme adaptée au français.
- source_word: מַזְכִּיר
  choice: archiviste
  rationale: Dans le cadre de l’administration royale, le terme désigne un haut fonctionnaire chargé de conserver ou de rappeler les affaires et les actes officiels. « Archiviste » est concis et naturel, tandis qu’une note conserve les autres possibilités sans définir trop précisément une fonction dont l’étendue exacte demeure incertaine.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde la forme d’une liste de responsables tout en évitant le calque peu naturel « était sur l’armée ». Le marqueur de note est placé après « archiviste », le mot auquel la variante lexicale se rapporte.
