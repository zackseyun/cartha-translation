  text: וּ/בְנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע עַל הַ/כְּרֵתִ֖י וְ/הַ/פְּלֵתִ֑י וּ/בְנֵי דָוִ֥יד הָ/רִאשֹׁנִ֖ים לְ/יַ֥ד הַ/מֶּֽלֶךְ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/017.yaml
  text: And Benaiah son of Jehoiada was over the Kerethites and the Pelethites[c][b][a], and David’s sons were the chief officials at the king’s side.
translation:
  language: fr
  text: Benaya, fils de Yehoyada, avait autorité sur les Kérétiens et les Pélétiens. Les fils de David étaient les premiers[a] auprès du roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les principaux ». L’hébreu dit littéralement « les premiers » et peut indiquer leur rang à la cour.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à la main du roi », expression pouvant évoquer la proximité ou le service auprès de lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: commandait
  rationale: Dans ce contexte militaire ou administratif, la préposition marque l’autorité exercée sur un groupe. « Commandait » exprime naturellement cette responsabilité sans ajouter de titre absent de l’hébreu.
- source_word: הַכְּרֵתִי
  choice: les Kérétiens
  rationale: Nom de groupe translittéré plutôt qu’interprété; cette forme française suit directement l’hébreu.
- source_word: הַפְּלֵתִי
  choice: les Pélétiens
  rationale: Nom de groupe translittéré, conformément à la nature du terme dans le texte source.
- source_word: הָרִאשֹׁנִים
  choice: les premiers
  rationale: Le mot signifie littéralement « les premiers » et peut désigner le rang ou la prééminence. La traduction conserve cette ambiguïté plutôt que d’imposer « hauts fonctionnaires ».
- source_word: לְיַד הַמֶּלֶךְ
  choice: aux côtés du roi
  rationale: Littéralement « à la main du roi »; l’expression indique ici la proximité, l’assistance ou le service auprès du roi. « Aux côtés du roi » garde cette image relationnelle en français naturel.
- source_word: וּבְנֵי דָוִיד
  choice: Les fils de David
  rationale: Traduction directe et naturelle de la construction génitive.
- source_word: בְּנָיָהוּ בֶּן־יְהוֹיָדָע
  choice: Benaya, fils de Joad
  rationale: Les noms suivent des formes françaises bibliques reconnaissables, et la filiation est rendue simplement.
theological_decisions:
- issue: Statut exact des fils de David à la cour
  choice: les premiers aux côtés du roi
  alternative: les hauts fonctionnaires au service du roi
  rationale: L’hébreu indique leur prééminence et leur proximité fonctionnelle avec le roi, mais ne précise pas explicitement une charge administrative particulière. La formulation retenue préserve cette indétermination.
translation_notes:
  register: Français moderne, sobre et digne. La phrase est divisée en deux pour une lecture naturelle. Les noms de groupes sont translittérés, et l’ambiguïté de הָרִאשֹׁנִים est conservée dans le texte avec une note explicative.
