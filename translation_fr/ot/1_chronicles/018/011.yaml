source:
  edition: WLC
  text: גַּם אֹתָ֗/ם הִקְדִּ֞ישׁ הַ/מֶּ֤לֶךְ דָּוִיד֙ לַ/יהוָ֔ה עִם הַ/כֶּ֨סֶף֙ וְ/הַ/זָּהָ֔ב אֲשֶׁ֥ר נָשָׂ֖א מִ/כָּל הַ/גּוֹיִ֑ם מֵֽ/אֱד֤וֹם וּ/מִ/מּוֹאָב֙ וּ/מִ/בְּנֵ֣י עַמּ֔וֹן וּ/מִ/פְּלִשְׁתִּ֖ים וּ/מֵֽ/עֲמָלֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/011.yaml
  text: 'King David also dedicated these to Yahweh[a], along with the silver and the gold that he had taken from all the nations: from Edom, Moab, the Ammonites, the Philistines[c][b], and Amalek.'
translation:
  language: fr
  text: 'Le roi David consacra aussi ces objets[a] à Yahvé, avec l’argent et l’or qu’il avait pris[b] à toutes les nations : d’Édom, de Moab, des Ammonites[c], des Philistins et d’Amalec.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les consacra aussi » ; « ces objets » renvoie aux objets de bronze mentionnés au verset précédent.
    reason: cross_reference
  - marker: b
    text: Ou « emportés » ; le verbe hébreu signifie littéralement « porter » ou « emporter » et désigne ici des biens obtenus des nations, sans préciser s’il s’agit de butin ou de tribut.
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : « des fils d’Ammon », c’est-à-dire des Ammonites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֹתָם
  choice: aussi ceux-ci
  rationale: גַּם marque la continuité avec le verset précédent, et אֹתָם renvoie aux objets de bronze qui y sont mentionnés. « Ceux-ci » rend ce renvoi explicite sans ajouter le nom des objets au texte.
- source_word: הִקְדִּישׁ
  choice: consacra
  rationale: Dans ce contexte cultuel, le verbe désigne l’action de réserver des biens à Dieu. « Consacra » est naturel, digne et conserve cette portée sacrée.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: Le texte porte le nom divin יהוה. La forme française traditionnelle « Yahvé » le rend comme un nom propre plutôt que de le remplacer par un titre.
- source_word: עִם הַכֶּסֶף וְהַזָּהָב
  choice: avec l’argent et l’or
  rationale: « Avec » exprime simplement que ces objets furent consacrés en même temps que les métaux précieux; les articles hébreux sont naturellement conservés en français.
- source_word: אֲשֶׁר נָשָׂא
  choice: qu’il avait emportés
  rationale: נָשָׂא signifie littéralement porter ou emporter et, ici, évoque des biens pris aux nations vaincues. « Emportés » préserve cette nuance sans imposer exclusivement la catégorie de butin ou de tribut.
- source_word: מִכָּל הַגּוֹיִם
  choice: de toutes les nations
  rationale: Dans ce contexte politique et militaire, גּוֹיִם désigne les peuples-nations environnants; « nations » est précis et idiomatique.
- source_word: מִבְּנֵי עַמּוֹן
  choice: des Ammonites
  rationale: L’expression littérale « fils d’Ammon » est l’appellation hébraïque du peuple ammonite. L’ethnonyme français transmet naturellement le même référent.
- source_word: מֵאֱדוֹם וּמִמּוֹאָב ... וּמִפְּלִשְׁתִּים וּמֵעֲמָלֵק
  choice: d’Édom, de Moab, ... des Philistins et d’Amalec
  rationale: Les noms suivent les formes françaises bibliques usuelles et la répétition des prépositions respecte la structure de l’énumération hébraïque.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » conserve le caractère de nom propre et correspond à une forme française largement reconnue, sans substituer un titre au nom.
- issue: Nature des biens emportés
  choice: emportés
  alternative: pris comme butin
  rationale: Le verbe נָשָׂא peut, dans ce contexte, concerner du butin ou un tribut, mais le texte ne tranche pas explicitement entre ces catégories. Le choix retenu préserve cette ouverture.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le passé simple convient au récit historique écrit. L’énumération demeure compacte et suit le mouvement de l’hébreu.
