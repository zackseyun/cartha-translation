  - severity: medium
    issue: Formulation « emportés de toutes les nations »
    rationale: En français, « emporter de » est peu naturel pour des biens prélevés sur des peuples. « Pris à toutes les nations » rend clairement le complément d’origine sans imposer que les biens soient du butin plutôt que du tribut.
