  source_fidelity: 'Le sens est globalement fidèle : David consacre à Yahvé les objets de bronze mentionnés au verset précédent, avec l’argent et l’or obtenus des peuples énumérés. « Emportés de toutes les nations » rend cependant la relation marquée par מִן de façon peu idiomatique en français.'
  naturalness: « Ceux-ci » est grammaticalement possible, mais isolé après « consacra aussi », il est moins naturel et moins immédiatement clair que « ces objets ». « Pris à toutes les nations » est plus idiomatique que « emportés de toutes les nations ».
  terminology: « Consacra », « Yahvé », « Ammonites », « Philistins » et « Amalec » conviennent au registre biblique moderne et aux usages français. Le choix de « pris » ne tranche pas indûment entre butin et tribut.
