source:
  edition: WLC
  text: וַ/יַּ֖ךְ אֶת מוֹאָ֑ב וַ/יִּהְי֤וּ מוֹאָב֙ עֲבָדִ֣ים לְ/דָוִ֔יד נֹשְׂאֵ֖י מִנְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/002.yaml
  text: And he struck Moab[a], and the Moabites became servants to David, bringing tribute.
translation:
  language: fr
  text: Il frappa Moab, et les Moabites devinrent les serviteurs de David, lui apportant un tribut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se traduire : « devinrent les esclaves de David, lui apportant un présent ». Dans ce contexte de conquête, les mots désignent probablement la soumission des Moabites et le tribut imposé à un peuple vassal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Il frappa
  rationale: Le verbe נכה signifie concrètement « frapper ». Dans ce contexte militaire, « frappa » conserve l’image et la sobriété de l’hébreu sans préciser davantage l’ampleur de la victoire.
- source_word: מוֹאָב
  choice: Moab / les Moabites
  rationale: La première occurrence désigne le pays ou le peuple comme objet de l’action militaire. À la seconde, « les Moabites » est plus idiomatique en français puisque ce sont les membres du peuple qui deviennent serviteurs.
- source_word: וַיִּהְיוּ
  choice: devinrent
  rationale: Dans cette succession narrative, היה suivi d’un attribut exprime naturellement l’entrée dans un nouvel état après la conquête.
- source_word: עֲבָדִים
  choice: serviteurs
  rationale: עֲבָדִים peut désigner des serviteurs, des esclaves ou des sujets soumis. Ici, « serviteurs » préserve le terme relationnel sans imposer l’idée précise d’esclavage individuel; le contexte indique néanmoins une soumission politique.
- source_word: לְדָוִיד
  choice: de David
  rationale: Avec « serviteurs », le français idiomatique exprime par « de David » la relation de dépendance marquée par לְ.
- source_word: נֹשְׂאֵי
  choice: lui apportant
  rationale: Le participe de נשׂא signifie littéralement « portant ». « Lui apportant » rend naturellement l’action de présenter le tribut au souverain.
- source_word: מִנְחָה
  choice: un tribut
  rationale: Dans le contexte d’une nation vaincue et soumise, מִנְחָה désigne vraisemblablement un paiement remis au vainqueur, d’où « tribut » plutôt que « offrande » ou « présent ».
theological_decisions:
- issue: Nature de la dépendance exprimée par עֲבָדִים
  choice: serviteurs
  alternative: esclaves / sujets
  rationale: Le mot hébreu couvre plusieurs degrés de service et de dépendance. Le contexte militaire implique une sujétion réelle, mais ne permet pas à lui seul d’affirmer que chaque Moabite est devenu esclave au sens social précis; « serviteurs » maintient cette tension lexicale.
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation conserve le verbe concret « frappa » et évite de transformer explicitement la relation en une catégorie politique ou sociale plus précise que l’hébreu.
