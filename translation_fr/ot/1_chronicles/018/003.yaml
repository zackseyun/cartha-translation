  text: וַ/יַּ֥ךְ דָּוִ֛יד אֶת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה חֲמָ֑תָ/ה בְּ/לֶכְתּ֕/וֹ לְ/הַצִּ֥יב יָד֖/וֹ בִּֽ/נְהַר פְּרָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/003.yaml
  text: David struck Hadadezer king of Zobah[b][a], as he went to establish his power at the Euphrates River.
translation:
  language: fr
  text: David battit Hadadézer, roi de Tsoba, vers Hamath, alors que Hadadézer allait établir son autorité au fleuve Euphrate[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rétablir son autorité » ; littéralement « établir sa main » au fleuve Euphrate.
    reason: lexical_alternative
  - marker: b
    text: Le nom est écrit « Hadadézer » ici ; le passage parallèle de 2 Samuel 8.3 présente une forme variante, souvent rendue « Hadarézer ».
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: battit
  rationale: Le verbe נכה désigne littéralement le fait de frapper. Dans ce récit de campagne militaire, « battit » reste naturel en français et exprime l'action militaire sans préciser l'ampleur de la victoire.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadézer
  rationale: Translittération française de la forme propre aux Chroniques, avec accents facilitant la lecture.
- source_word: מֶלֶךְ צוֹבָה
  choice: roi de Tsoba
  rationale: Rend directement la chaîne construite qui indique le titre et le royaume d'Hadadézer.
- source_word: חֲמָתָה
  choice: du côté de Hamath
  rationale: Le hé directionnel indique un mouvement vers Hamath. Dans la syntaxe de cette notice de campagne, la locution française rattache naturellement cette indication à l'action de David sans imposer qu'il soit arrivé dans la ville même.
- source_word: בְּלֶכְתּוֹ
  choice: alors que celui-ci allait
  rationale: L'infinitif construit précédé de ב exprime une circonstance temporelle. « Celui-ci » indique sans lourdeur que le sujet est Hadadézer, conformément au référent masculin singulier le plus proche.
- source_word: לְהַצִּיב יָדוֹ
  choice: rétablir son autorité
  rationale: L'expression signifie littéralement « établir sa main ». Dans ce contexte politico-militaire, la main représente le pouvoir ou la domination. Le contexte parallèle favorise ici l'idée d'un contrôle exercé de nouveau, tout en signalant les autres possibilités en note.
- source_word: בִּנְהַר פְּרָת
  choice: sur le fleuve Euphrate
  rationale: פְּרָת désigne l'Euphrate et נָהָר précise qu'il s'agit du fleuve. « Sur » est idiomatique en français pour une autorité exercée dans la région du fleuve.
theological_decisions:
- issue: Sens de l'expression לְהַצִּיב יָדוֹ
  choice: rétablir son autorité
  alternative: établir son pouvoir ; littéralement, établir sa main
  rationale: La formulation principale communique le sens politico-militaire probable sans transformer l'image hébraïque en affirmation théologique. La note conserve l'ambiguïté entre établissement et rétablissement du contrôle.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent des formes françaises lisibles. « Du côté de Hamath » conserve la direction indiquée par חֲמָתָה, absente de la couche anglaise fournie mais présente dans le texte hébreu. Les appels de notes suivent leur point d'ancrage dans le texte.
