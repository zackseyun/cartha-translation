source:
  edition: WLC
  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יַּ֥ךְ דָּוִ֛יד אֶת פְּלִשְׁתִּ֖ים וַ/יַּכְנִיעֵ֑/ם וַ/יִּקַּ֛ח אֶת גַּ֥ת וּ/בְנֹתֶ֖י/הָ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/001.yaml
  text: After this[a], David struck the Philistines and subdued them, and he took Gath and its surrounding towns from the hand of the Philistines.
translation:
  language: fr
  text: Après cela, David frappa les Philistins et les soumit ; il leur prit Gath et les localités qui en dépendaient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses filles », expression qui désigne les petites villes ou les villages dépendant de Gath.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette formule assure la transition chronologique du récit. « Après cela » est naturel en français moderne sans reproduire lourdement l’hébreu « et il arriva après cela ».
- source_word: וַיַּךְ
  choice: frappa
  rationale: Dans un contexte militaire, נכה désigne l’action de frapper ou d’attaquer. « Frappa » conserve la force concrète du verbe, tandis que le verbe suivant en précise le résultat.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française usuelle de ce peuple.
- source_word: וַיַּכְנִיעֵם
  choice: les soumit
  rationale: La forme causative de כנע exprime la mise en sujétion. « Les soumit » rend clairement et sobrement le sens militaire et politique.
- source_word: וַיִּקַּח
  choice: il leur prit
  rationale: לקח signifie fondamentalement « prendre ». La construction « il leur prit » exprime naturellement la prise de contrôle et intègre en français l’idée de retrait à la puissance des Philistins portée par מִיַּד.
- source_word: גַּת
  choice: Gath
  rationale: Transcription française traditionnelle du nom de cette ville philistine.
- source_word: וּבְנֹתֶיהָ
  choice: les localités qui en dépendaient
  rationale: Littéralement « ses filles », expression désignant les agglomérations rattachées administrativement ou territorialement à une ville principale. Cette formulation transmet le rapport de dépendance sans supposer qu’elles étaient toutes immédiatement voisines.
- source_word: מִיַּד
  choice: leur
  rationale: L’expression hébraïque « de la main des Philistins » indique ici leur possession ou leur pouvoir. Le pronom dans « il leur prit » en communique le sens avec naturel en français.
