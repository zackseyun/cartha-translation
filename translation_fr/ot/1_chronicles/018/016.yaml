- source_word: שַׁוְשָׁא
  choice: Shavsha
  rationale: Translittération proche de la forme consonantique propre au texte des Chroniques.
- source_word: סוֹפֵר
  choice: secrétaire
  rationale: Dans l’administration royale, le mot désigne ici un haut fonctionnaire chargé de l’écrit; « secrétaire » communique naturellement cette fonction en français moderne.
