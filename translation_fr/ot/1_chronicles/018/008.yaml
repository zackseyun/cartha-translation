  text: וּ/מִ/טִּבְחַ֤ת וּ/מִ/כּוּן֙ עָרֵ֣י הֲדַדְעֶ֔זֶר לָקַ֥ח דָּוִ֛יד נְחֹ֖שֶׁת רַבָּ֣ה מְאֹ֑ד בָּ֣/הּ עָשָׂ֣ה שְׁלֹמֹ֗ה אֶת יָ֤ם הַ/נְּחֹ֨שֶׁת֙ וְ/אֶת הָֽ/עַמּוּדִ֔ים וְ/אֵ֖ת כְּלֵ֥י הַ/נְּחֹֽשֶׁת׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/008.yaml
  text: And from Tibhath and from Cun, cities of Hadadezer, David took a very great amount of bronze; with it Solomon made the bronze sea, the pillars, and the bronze articles.
translation:
  language: fr
  text: De Tibhath et de Koun, villes de Hadadézer, David emporta une très grande quantité de bronze. Avec ce bronze, Salomon fit la Mer de bronze, les colonnes et les objets de bronze.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans ce contexte d’ouvrages métalliques du Temple, « bronze » est le terme français traditionnel et naturel, même si l’hébreu peut désigner plus largement le cuivre ou un alliage cuivreux.
- source_word: יָם הַנְּחֹשֶׁת
  choice: la Mer de bronze
  rationale: « Mer » conserve le nom technique et imagé du grand bassin du Temple; la majuscule signale qu’il s’agit d’un ouvrage particulier.
- source_word: כְּלֵי הַנְּחֹשֶׁת
  choice: les objets de bronze
  rationale: « Objets » rend largement כְּלֵי sans préciser indûment leur fonction; « ustensiles » serait également possible mais plus restrictif.
- source_word: בָּהּ
  choice: Avec ce bronze
  rationale: L’expression explicite le référent féminin singulier, נְחֹשֶׁת, et rend naturellement l’idée que Salomon employa cette matière.
- source_word: לָקַח
  choice: emporta
  rationale: Dans le contexte du butin pris dans des villes conquises, « emporta » exprime mieux le mouvement et l’acquisition que le simple « prit ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Les noms propres suivent une translittération française courante. Deux phrases remplacent le point-virgule afin d’améliorer la lisibilité sans modifier le rapport entre le bronze pris par David et son emploi ultérieur par Salomon.
