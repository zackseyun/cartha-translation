  text: וַ/יִּמְלֹ֥ךְ דָּוִ֖יד עַל כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֗י עֹשֶׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה לְ/כָל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/014.yaml
  text: So David reigned over all Israel[a], and he administered justice and righteousness to all his people.
translation:
  language: fr
  text: David régna sur tout Israël, et il exerçait le droit et la justice[a] envers tout son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jugement et ce qui est juste ». Les deux termes hébreux associent l’exercice du droit à la rectitude morale.
    reason: Préciser la portée complémentaire des deux mots hébreux et signaler une traduction plus littérale possible.
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Le qal wayyiqtol de מלך désigne l’exercice de la royauté. « Régna » est naturel dans un récit historique et conserve la valeur royale du verbe.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sur tout Israël
  rationale: Avec מלך, עַל introduit le peuple ou le territoire soumis au règne. « Tout Israël » préserve explicitement l’étendue indiquée par כָּל.
- source_word: וַיְהִי עֹשֶׂה
  choice: il exerçait
  rationale: La construction היה suivie du participe exprime ici une activité habituelle et continue. L’imparfait français rend cet aspect, tandis que « exerçait » convient au contexte du gouvernement.
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Dans ce contexte royal, מִשְׁפָּט renvoie à l’ordre juridique et à son application. « Le droit » permet de le distinguer du terme coordonné צְדָקָה.
- source_word: וּצְדָקָה
  choice: et la justice
  rationale: צְדָקָה désigne ce qui est juste, droit ou conforme à la rectitude. « La justice » est ici un équivalent français naturel, tout en conservant avec « le droit » les deux dimensions de la formule hébraïque.
- source_word: לְכָל עַמּוֹ
  choice: envers tout son peuple
  rationale: La préposition לְ marque les personnes au bénéfice desquelles ou à l’égard desquelles David agit. « Envers » est idiomatique avec « exercer le droit et la justice » et le possessif rend le suffixe hébreu.
theological_decisions:
- issue: Traduction de la paire royale מִשְׁפָּט וּצְדָקָה
  choice: le droit et la justice
  alternative: le jugement et la justice ; la justice et l’équité
  rationale: 'La formulation retenue maintient deux notions liées mais non identiques : l’exercice du droit et la rectitude morale du règne. Elle évite de réduire la paire à un seul concept ou d’imposer une interprétation confessionnelle.'
translation_notes:
  register: Français international moderne, digne et lisible. L’imparfait « exerçait » exprime l’action habituelle du participe hébreu. « Ainsi » assure une transition narrative naturelle sans surcharger le simple enchaînement hébreu.
