  text: וַ/יִּשְׁמַ֕ע תֹּ֖עוּ מֶ֣לֶךְ חֲמָ֑ת כִּ֚י הִכָּ֣ה דָוִ֔יד אֶת כָּל חֵ֖יל הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/009.yaml
  text: When Tou king of Hamath heard that David had struck down all the army of Hadadezer king of Zobah,[a]
translation:
  language: fr
  text: Quand Tou, roi de Hamath, apprit que David avait battu toute l’armée de Hadadézer, roi de Tsoba,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Tou » ; le récit parallèle de 2 Samuel 8.9 porte « Toï ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Quand … apprit
  rationale: Le wayyiqtol fait progresser le récit, mais la proposition sert ici de cadre temporel à l’action du verset suivant. « Quand … apprit » rend naturellement cette fonction en français.
- source_word: תֹּעוּ
  choice: Toou
  rationale: Translittération de la forme propre aux Chroniques, distincte de « Toï » dans le récit parallèle de 2 Samuel 8.9.
- source_word: מֶלֶךְ חֲמָת
  choice: roi de Hamath
  rationale: Rend directement la chaîne construite qui précise la fonction et le royaume de Toou.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que Toou a appris.
- source_word: הִכָּה
  choice: avait battu
  rationale: Dans ce contexte militaire, נכה exprime la mise en défaite. « Avait battu » est idiomatique et conserve la force du verbe sans préciser indûment que tous les soldats auraient été tués.
- source_word: כָּל
  choice: toute
  rationale: Le quantificateur explicite est conservé et s’accorde avec « armée ».
- source_word: חֵיל
  choice: armée
  rationale: Dans ce contexte, le terme désigne les forces armées plutôt que la richesse ou la vigueur.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadézer
  rationale: Translittération française de la forme du nom attestée dans le texte massorétique de ce verset.
- source_word: מֶלֶךְ צוֹבָה
  choice: roi de Tsoba
  rationale: Rend directement le titre et le nom géographique, selon une translittération française naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase demeure ouverte par une virgule, conformément à sa fonction de proposition introductive dont l’action principale vient au verset suivant. Les noms propres suivent une translittération adaptée au français.
