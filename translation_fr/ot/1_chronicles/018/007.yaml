id: 1CH.18.7
reference: 1 Chronicles 18:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח דָּוִ֗יד אֵ֚ת שִׁלְטֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֣ר הָי֔וּ עַ֖ל עַבְדֵ֣י הֲדַדְעָ֑זֶר וַ/יְבִיאֵ֖/ם יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/007.yaml
  text: And David took the shields of gold that were on the servants of Hadadezer and brought them to Jerusalem[a][b][c].
translation:
  language: fr
  text: David prit les boucliers d’or[a] qui étaient portés par les serviteurs[b] de Hadadézer[c] et les apporta à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les boucliers dorés » ; l’hébreu peut désigner des boucliers recouverts d’or.
    reason: lexical_alternative
  - marker: b
    text: Ici, les « serviteurs » sont probablement des hommes de la suite royale ou militaire de Hadadézer, et non nécessairement des esclaves domestiques au sens moderne et étroit.
    reason: cultural_note
  - marker: c
    text: Certaines traditions textuelles, ainsi que le passage parallèle de 2 Samuel, donnent au nom la forme « Hadarézer ».
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח signifie couramment « prendre ». Le contexte militaire implique une prise de guerre, sans qu’il soit nécessaire d’expliciter « captura ».
- source_word: שִׁלְטֵי הַזָּהָב
  choice: les boucliers d’or
  rationale: שִׁלְטֵי désigne des boucliers, peut-être de petits boucliers. « Boucliers d’or » suit naturellement la construction hébraïque et laisse ouverte la possibilité d’objets plaqués d’or.
- source_word: אֲשֶׁר הָיוּ עַל
  choice: qui étaient portés par
  rationale: Littéralement, la proposition signifie « qui étaient sur ». En français, appliquée à des boucliers et à des hommes, « étaient portés par » exprime clairement l’image probable sans transformer la relation en simple possession.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: les serviteurs de Hadadézer
  rationale: עֲבָדִים signifie fondamentalement « serviteurs ». Dans ce cadre royal et militaire, le terme peut désigner des hommes de la suite ou des officiers, mais « serviteurs » préserve l’étendue sémantique.
- source_word: הֲדַדְעָזֶר
  choice: Hadadézer
  rationale: Cette forme représente le nom massorétique de ce verset dans une graphie française lisible. La variante Hadarézer est signalée en note.
- source_word: וַיְבִיאֵם יְרוּשָׁלִָם
  choice: et les apporta à Jérusalem
  rationale: Le hifil de בוא signifie « apporter, faire venir ». Le pronom suffixe est rendu par « les ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Le texte conserve « serviteurs », terme large de l’hébreu, tout en éclairant son sens contextuel en note. « Étaient portés par » rend idiomatiquement la tournure littérale « étaient sur ».
