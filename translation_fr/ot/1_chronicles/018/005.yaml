base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: fr
  text: Les Araméens de Damas[a] vinrent aider Hadadézer[b], roi de Tsoba, et David frappa vingt-deux mille hommes d’Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Aram de Damas » ; traditionnellement : « les Syriens de Damas ».'
    reason: lexical_alternative
  - marker: b
    text: Le nom est écrit « Hadadézer » ici ; certains passages parallèles portent la variante « Hadarézer ».
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרַם דַּרְמֶשֶׂק
  choice: les Araméens de Damas
  rationale: אֲרַם peut désigner le territoire d’Aram ou les Araméens. Avec le verbe pluriel וַיָּבֹא employé collectivement et dans ce contexte militaire, « les Araméens de Damas » est naturel en français, tout en évitant l’anachronique « Syriens ».
- source_word: לַעְזוֹר
  choice: aider
  rationale: L’infinitif de עזר signifie directement « aider » ou « porter secours » ; « aider » convient naturellement à l’alliance militaire sans ajouter de nuance absente du texte.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadézer
  rationale: Cette translittération suit la forme הֲדַדְעֶזֶר attestée ici et distingue cette graphie de la variante Hadarézer présente dans certains passages parallèles.
- source_word: מֶלֶךְ צוֹבָה
  choice: roi de Tsoba
  rationale: La construction génitive est rendue directement, avec une translittération française courante du nom de lieu.
- source_word: וַיַּךְ
  choice: abattit
  rationale: Dans un récit de bataille, נכה peut signifier frapper, abattre ou vaincre. Comme un nombre d’hommes suit immédiatement, « abattit » conserve la violence militaire sans expliciter davantage que l’hébreu.
- source_word: בַּאֲרָם
  choice: hommes d’Aram
  rationale: Le nom ethnogéographique avec la préposition ב est rendu idiomatiquement par l’appartenance à Aram, sans répéter obligatoirement « Araméens ».
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: vingt-deux mille hommes
  rationale: Rendu direct du nombre et de אִישׁ ; « soldats » serait plausible dans le contexte mais plus explicite que le texte source.
