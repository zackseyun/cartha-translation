  text: וַ/יִּלְכֹּד֩ דָּוִ֨יד מִמֶּ֜/נּוּ אֶ֣לֶף רֶ֗כֶב וְ/שִׁבְעַ֤ת אֲלָפִים֙ פָּֽרָשִׁ֔ים וְ/עֶשְׂרִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וַ/יְעַקֵּ֤ר דָּוִיד֙ אֶת כָּל הָ/רֶ֔כֶב וַ/יּוֹתֵ֥ר מִמֶּ֖/נּוּ מֵ֥אָה רָֽכֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/004.yaml
  text: David captured from him 1,000 chariots, 7,000 horsemen, and 20,000 foot soldiers. Then David hamstrung all the chariot horses, but left from them enough for 100 chariots.
translation:
  language: fr
  text: David lui prit 1 000 chars, 7 000 cavaliers[b] et 20 000 soldats à pied. Puis David coupa les jarrets à tous les chevaux attelés aux chars[a], mais en conserva assez pour 100 chars.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les chars » ou « toute la charrerie ». Comme le verbe signifie « couper les jarrets », l’expression désigne ici, par métonymie, les chevaux de l’unité de chars.'
    reason: lexical_alternative
  - marker: b
    text: Le passage parallèle de 2 Samuel 8.4 porte « 1 700 cavaliers » au lieu de « 7 000 cavaliers ». Il s’agit d’une différence numérique entre les textes transmis de ces passages parallèles.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: captura
  rationale: Le verbe לכד désigne couramment la capture ou la prise dans un contexte militaire ; « captura » est précis et naturel.
- source_word: מִמֶּנּוּ
  choice: lui
  rationale: Le suffixe hébreu est au singulier et renvoie à Hadadézer dans le contexte précédent.
- source_word: אֶלֶף רֶכֶב
  choice: 1 000 chars
  rationale: רכב peut désigner collectivement les chars de guerre ; avec un nombre, « chars » donne une formulation française claire et concrète.
- source_word: פָּרָשִׁים
  choice: cavaliers
  rationale: Le terme désigne des combattants montés ; « cavaliers » est courant, digne et moins technique que « cavalerie ».
- source_word: אִישׁ רַגְלִי
  choice: soldats à pied
  rationale: Cette expression rend le sens concret de « hommes à pied » dans son contexte militaire, en français moderne.
- source_word: וַיְעַקֵּר
  choice: coupa les jarrets
  rationale: Dans ce contexte, עקר décrit l'action de rendre les chevaux inutilisables en leur coupant les jarrets ; cette locution française est exacte et intelligible.
- source_word: אֶת כָּל הָרֶכֶב
  choice: tous les chevaux de chars
  rationale: Le texte dit littéralement « tous les chars / toute la charrerie », mais le verbe s'applique aux animaux ; רכב désigne donc ici par métonymie les chevaux affectés aux chars.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: mais en conserva assez pour 100 chars
  rationale: La formulation exprime naturellement que David épargna un nombre de chevaux suffisant pour cent chars, tout en respectant la métonymie du texte hébreu.
