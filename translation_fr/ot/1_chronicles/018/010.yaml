translation_notes:
  register: 'Français international moderne, naturel et digne. Les noms propres suivent une translittération française lisible : Hadadézer et Toou. Le verset conserve la tonalité diplomatique du récit tout en expliquant en notes les idiomes hébreux et le verbe sous-entendu dans la dernière proposition.'
