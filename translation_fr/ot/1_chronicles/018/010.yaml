revisions:
- from: Il envoya donc son fils Hadoram auprès du roi David pour prendre de ses nouvelles[a] et le féliciter[b] d’avoir combattu Hadadézer et de l’avoir vaincu, car Hadadézer avait été en guerre contre Toou[c]. Il lui envoya aussi toutes sortes d’objets en or, en argent et en bronze[d].
  to: Alors, il envoya son fils Hadoram auprès du roi David pour prendre de ses nouvelles[a] et le féliciter[b] d’avoir combattu Hadadézer et de l’avoir vaincu, car Hadadézer avait été en guerre contre Tou[c]. Il lui envoya aussi tous les objets en or, en argent et en bronze[d].
  rationale: La révision conserve les choix interprétatifs justifiés par le contexte diplomatique et les notes, tout en corrigeant la portée de כָּל־כְּלֵי (« tous les objets »), en adoptant la graphie française naturelle « Tou » et en remplaçant « donc » par le connecteur narratif « alors ».
