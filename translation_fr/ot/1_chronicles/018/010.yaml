source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח אֶת הֲדֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִיד ל/שאול ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עוּ הָיָ֣ה הֲדַדְעָ֑זֶר וְ/כֹ֗ל כְּלֵ֛י זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/010.yaml
  text: So he sent Hadoram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Tou[d][c][b]; and he sent all kinds of articles of gold and silver and bronze.
translation:
  language: fr
  text: Alors, il envoya son fils Hadoram auprès du roi David pour prendre de ses nouvelles[a] et le féliciter[b] d’avoir combattu Hadadézer et de l’avoir vaincu, car Hadadézer avait été en guerre contre Tou[c]. Il lui envoya aussi tous les objets en or, en argent et en bronze[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour lui demander au sujet de la paix » ; ici, la « paix » désigne son bien-être.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et le bénir ». Dans ce contexte diplomatique, il s’agit de lui adresser des félicitations après sa victoire.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « car Hadadézer était un homme de guerres avec Tou », expression signifiant qu’il était en guerre contre Tou.'
    reason: lexical_alternative
  - marker: d
    text: 'L’hébreu dit simplement : « et tous les objets en or, en argent et en bronze » ; le français explicite le verbe « envoya » et son destinataire d’après le contexte.'
    reason: supplied_for_clarity
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Il envoya donc
  rationale: Le wayyiqtol poursuit la suite narrative. « Donc » marque naturellement en français le lien avec le contexte, sans transformer la proposition en conclusion logique forte.
- source_word: הֲדוֹרָם בְּנוֹ
  choice: son fils Hadoram
  rationale: L’apposition hébraïque est rendue dans l’ordre le plus naturel en français, tout en conservant explicitement la relation filiale.
- source_word: לִשְׁאוֹל לוֹ לְשָׁלוֹם
  choice: pour prendre de ses nouvelles
  rationale: Cette expression française courante transmet l’idiome hébreu qui consiste à s’enquérir du bien-être ou de la paix de quelqu’un.
- source_word: וּלְבָרֲכוֹ
  choice: et le féliciter
  rationale: Dans cette ambassade envoyée après une victoire, ברך exprime une bénédiction qui prend pragmatiquement la forme de félicitations. Une note conserve le sens littéral.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: d’avoir combattu Hadadézer et de l’avoir vaincu
  rationale: נכה désigne ici la défaite militaire infligée à Hadadézer, sans nécessairement signifier qu’il a été tué. « Vaincu » est précis et naturel dans ce contexte.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעוּ הָיָה הֲדַדְעָזֶר
  choice: car Hadadézer avait été en guerre contre Toou
  rationale: La tournure littérale « homme de guerres avec Toou » est un idiome indiquant un état d’hostilité militaire. Le plus-que-parfait situe correctement cette hostilité par rapport à l’ambassade.
- source_word: וְכֹל כְּלֵי זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: Il lui envoya aussi toutes sortes d’objets en or, en argent et en bronze
  rationale: Le texte hébreu coordonne ces objets à ce qui a été envoyé sans répéter le verbe. Le français le rétablit pour la clarté. כְּלֵי est rendu largement par « objets », et נְחֹשֶׁת par « bronze », terme adapté au contexte antique.
