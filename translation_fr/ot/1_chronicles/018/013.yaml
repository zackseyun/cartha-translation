  text: וַ/יָּ֤שֶׂם בֶּֽ/אֱדוֹם֙ נְצִיבִ֔ים וַ/יִּהְי֥וּ כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑יד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/013.yaml
  text: He placed garrisons in Edom, and all Edom became servants to David. And the LORD gave David victory wherever he went.
translation:
  language: fr
  text: Il établit des garnisons en Édom, et tous les Édomites devinrent les serviteurs de David. L’Éternel accorda à David la victoire partout où il allait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצִיבִים
  choice: garnisons
  rationale: Dans ce contexte militaire et territorial, le pluriel désigne vraisemblablement des postes ou garnisons établis en Édom, plutôt que des gouverneurs.
- source_word: עֲבָדִים
  choice: serviteurs
  rationale: Le terme peut désigner des esclaves, des sujets ou des vassaux. Ici, appliqué collectivement à un peuple soumis à David, « serviteurs » préserve cette amplitude sans imposer l’idée d’esclavage individuel.
- source_word: וַיּוֹשַׁע
  choice: donnait la victoire
  rationale: Le verbe signifie littéralement « sauver, délivrer »; dans le récit des campagnes militaires, l’expression idiomatique française « donner la victoire » communique naturellement le sens contextuel.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et immédiatement reconnaissable du nom divin YHWH, distinct du titre « Seigneur ».
theological_decisions:
- issue: Action divine dans les victoires de David
  choice: « l’Éternel donnait la victoire à David »
  alternative: « l’Éternel sauvait David »
  rationale: Le contexte militaire favorise le sens de victoire ou de succès accordé par Dieu, sans effacer le fait que le texte attribue explicitement cette réussite à YHWH.
- issue: Statut des Édomites soumis
  choice: « serviteurs de David »
  alternative: « esclaves de David » ou « vassaux de David »
  rationale: Le mot hébreu עֲבָדִים ne précise pas à lui seul la forme juridique exacte de leur soumission; « serviteurs » maintient l’ambiguïté.
translation_notes:
  register: Français moderne, clair et digne. « Les Édomites » rend naturellement l’expression collective « tout Édom ». L’imparfait « donnait » exprime l’action répétée ou constante résumée par « partout où il allait ».
