source:
  edition: WLC
  text: וְ/אַבְשַׁ֣י בֶּן צְרוּיָ֗ה הִכָּ֤ה אֶת אֱדוֹם֙ בְּ/גֵ֣יא הַמֶּ֔לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/012.yaml
  text: And Abishai son of Zeruiah struck down eighteen thousand Edomites in the Valley of Salt[a].
translation:
  language: fr
  text: Abishaï, fils de Tserouya, frappa dix-huit mille Édomites dans la vallée du Sel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Édom » ; dans ce contexte de bataille, il s’agit du peuple d’Édom, c’est-à-dire des Édomites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשַׁי
  choice: Abishaï
  rationale: Le waw assure ici la continuité narrative, mais il n’est pas nécessaire de le rendre explicitement en français moderne. Le nom est translittéré sous sa forme française courante.
- source_word: בֶּן צְרוּיָה
  choice: fils de Tserouya
  rationale: Cette formulation restitue directement la désignation généalogique et reste naturelle en français.
- source_word: הִכָּה
  choice: tua
  rationale: Dans ce contexte militaire, avec un nombre de personnes comme complément, le hiphil de נכה désigne le fait d’abattre ou de tuer. « Tua » exprime clairement le bilan humain sans suggérer qu’Abishaï les aurait tous frappés personnellement.
- source_word: אֶת אֱדוֹם
  choice: Édomites
  rationale: L’hébreu porte littéralement le nom « Édom », mais le verbe militaire accompagné d’un dénombrement vise manifestement le peuple d’Édom plutôt que son territoire.
- source_word: בְּ/גֵיא הַמֶּלַח
  choice: dans la vallée du Sel
  rationale: Le syntagme construit גֵיא הַמֶּלַח est rendu comme un toponyme naturel en français.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: dix-huit mille
  rationale: Le nombre cardinal est écrit en toutes lettres conformément au registre littéraire biblique.
theological_decisions:
- issue: Édom désigne-t-il le peuple ou le territoire ?
  choice: le peuple d’Édom (« Édomites »)
  alternative: le territoire d’Édom
  rationale: La présence d’un verbe de combat et d’un total de dix-huit mille indique des personnes. La traduction explicite cette métonymie sans introduire d’interprétation doctrinale.
translation_notes:
  register: Français moderne, sobre et narratif. « Abishaï » et « Tserouya » suivent des translittérations françaises courantes ; « vallée du Sel » est traité comme un nom de lieu.
