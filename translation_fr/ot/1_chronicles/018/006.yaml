base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and the Arameans became David’s servants, bringing tribute[c][b]. And Yahweh gave victory to David wherever he went.
translation:
  language: fr
  text: David installa des garnisons dans l’Aram de Damas[a]. Les Araméens[b] devinrent les serviteurs de David et lui apportèrent un tribut. Yahweh accorda la victoire à David partout où il alla[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mit » dans l’Aram de Damas. L’objet « des garnisons » est sous-entendu d’après le contexte militaire ; on pourrait aussi traduire : « y posta des troupes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « Aram » ; traduction traditionnelle : « la Syrie » ou « les Syriens ».'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « sauva David » ou « délivra David ». Dans ce contexte militaire, l’expression signifie que Yahweh lui accordait la victoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: installa des garnisons
  rationale: Le verbe signifie littéralement « mettre, placer ». L’objet n’est pas exprimé dans le texte hébreu, mais le contexte militaire et le récit parallèle indiquent qu’il s’agit de garnisons. « Installa des garnisons » est naturel en français tout en signalant l’ellipse dans une note.
- source_word: בַּאֲרָם דַּרְמֶשֶׂק
  choice: dans l’Aram de Damas
  rationale: Cette formulation conserve la désignation géographique hébraïque, qui associe Aram à Damas, sans la réduire à la seule ville de Damas.
- source_word: אֲרָם
  choice: les Araméens
  rationale: Le nom collectif désigne ici le peuple soumis à David. « Araméens » reflète directement l’ethnonyme hébreu et évite l’appellation traditionnelle, mais historiquement moins précise dans ce contexte, « Syriens ».
- source_word: עֲבָדִים
  choice: serviteurs
  rationale: Dans ce contexte politique, le terme exprime la dépendance de vassaux. « Serviteurs » reste proche du lexique hébreu sans imposer la notion plus précise d’esclavage.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: lui apportèrent un tribut
  rationale: La construction désigne des sujets qui remettent un tribut à leur souverain. La formulation française explicite naturellement le destinataire implicite.
- source_word: וַיּוֹשַׁע
  choice: accorda la victoire
  rationale: Le hiphil de יָשַׁע signifie « sauver, délivrer ». Dans ce récit de campagnes militaires, « accorda la victoire » en exprime clairement la portée contextuelle, tandis qu’une note préserve les rendus plus littéraux.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » conserve le nom divin personnel représenté par le tétragramme, au lieu de lui substituer un titre.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: partout où il alla
  rationale: Cette expression idiomatique indique l’ensemble des déplacements ou campagnes de David sans limiter artificiellement son sens à la marche militaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel tout en évitant de le remplacer par un titre.
- issue: Portée salvatrice de וַיּוֹשַׁע dans un contexte militaire
  choice: accorda la victoire à David
  alternative: sauva David / délivra David
  rationale: Le contexte immédiat concerne les succès militaires de David. Le rendu choisi communique cette portée sans nier le sens fondamental de salut ou de délivrance, conservé en note.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Aram de Damas » conserve la géographie du texte source ; les notes rendent visibles l’objet implicite après וַיָּשֶׂם et l’ambivalence entre salut, délivrance et victoire dans וַיּוֹשַׁע.
