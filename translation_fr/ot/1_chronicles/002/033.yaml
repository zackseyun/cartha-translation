  text: 'And the sons of Jonathan: Peleth and Zaza. These were the sons of Jerahmeel.'
translation:
  language: fr
  text: 'Et les fils de Jonathan : Péleth et Zaza. Tels furent les fils de Jerahmeel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יוֹנָתָן
  choice: Fils de Jonathan
  rationale: Dans cette liste généalogique, le waw poursuit l’enchaînement sans devoir être rendu par « et » en français. La construction בְּנֵי יוֹנָתָן est rendue directement, avec une formulation nominale naturelle.
- source_word: פֶּלֶת
  choice: Péleth
  rationale: Le nom propre est translittéré selon des conventions françaises qui rendent perceptible la première voyelle accentuée et la consonne finale.
- source_word: וְזָזָא
  choice: et Zaza
  rationale: La conjonction coordonne le second fils nommé; le nom propre est translittéré sans être traduit.
- source_word: אֵלֶּה
  choice: Ceux-là
  rationale: Le démonstratif pluriel renvoie précisément aux deux hommes qui viennent d’être nommés. « Ceux-là » est clair et naturel dans cette formule récapitulative.
- source_word: הָיוּ
  choice: furent
  rationale: Le verbe היה sert ici de copule d’identification. Le passé simple convient au registre narratif et généalogique soutenu sans suggérer l’idée de devenir.
- source_word: בְּנֵי יְרַחְמְאֵל
  choice: les fils de Yerahméel
  rationale: La construction généalogique est conservée littéralement comme « les fils de », plutôt que généralisée en « descendants ». Le nom est translittéré d’après l’hébreu dans une forme lisible en français.
