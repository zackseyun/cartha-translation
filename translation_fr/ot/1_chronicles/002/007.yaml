  text: וּ/בְנֵ֖י כַּרְמִ֑י עָכָר֙ עוֹכֵ֣ר יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מָעַ֖ל בַּ/חֵֽרֶם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/007.yaml
  text: 'And the sons of Karmi: Achar[a], the troubler of Israel[b], who acted unfaithfully regarding the devoted things.'
translation:
  language: fr
  text: 'Fils de Karmi : Akar[a], celui qui sema le trouble en Israël, lui qui se montra infidèle à l’égard de ce qui était voué à la destruction[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Akan ». Les Chroniques emploient ici la forme « Akar », qui fait écho au verbe hébreu traduit par « sema le trouble ». Voir Josué 7.
    reason: alternative_reading
  - marker: b
    text: 'Hébreu : « ce qui était voué par interdit ». Il s’agit de ce qui avait été irrévocablement consacré à Dieu et, dans ce contexte, voué à la destruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי כַרְמִי
  choice: Fils de Karmi
  rationale: La formule généalogique hébraïque est rendue dans le style concis et naturel des listes de descendants. « Fils » conserve le pluriel du texte, même si un seul nom suit ici.
- source_word: עָכָר
  choice: Akar
  rationale: Le texte des Chroniques porte la forme ‘Akar, et non la forme ‘Akan connue en Josué 7. « Akar » la préserve sans harmoniser les deux passages.
- source_word: עוֹכֵר יִשְׂרָאֵל
  choice: celui qui sema le trouble en Israël
  rationale: Le participe qualifie Akar. Cette formulation française est naturelle et conserve autant que possible l’écho entre le nom ‘Akar et le verbe hébreu apparenté, qui évoque le trouble ou le malheur causé.
- source_word: מָעַל
  choice: se montra infidèle
  rationale: Le verbe désigne une grave infidélité, notamment une atteinte sacrilège à ce qui appartient à Dieu. La formulation garde cette dimension morale et religieuse sans employer un terme juridique archaïque.
- source_word: בַּחֵרֶם
  choice: à l’égard des biens voués à la destruction
  rationale: Le singulier hébreu avec article renvoie collectivement à ce qui était placé sous l’interdit dans le récit d’Akan. Le pluriel « biens » convient au contexte, tandis que « voués à la destruction » explicite la portée de חֵרֶם sans réduire le terme à une simple interdiction.
theological_decisions:
- issue: Sens de חֵרֶם dans le contexte du sacrilège et du jugement
  choice: les biens voués à la destruction
  alternative: ce qui était frappé d’interdit
  rationale: חֵרֶם associe l’idée d’une mise à part irrévocable pour Dieu à celle de destruction et d’interdiction d’usage humain. Le texte principal exprime clairement la destination des biens; la note signale la notion traditionnelle d’interdit sans résoudre davantage la tension lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La concision généalogique est conservée; « sema le trouble » garde une partie du jeu de mots hébreu, expliqué en note.
