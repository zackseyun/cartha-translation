  yaml_path: translation/ot/1_chronicles/002/009.yaml
  text: 'The sons of Hezron who were born to him: Jerahmeel[a], Ram, and Chelubai.'
translation:
  language: fr
  text: Les fils de Hetsron qui lui naquirent furent Yerahméel, Ram et Keloubaï[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Keloubaï est probablement la même personne que Caleb, appelé ainsi ailleurs dans cette généalogie.
