lexical_decisions:
- source_word: וּ/בְנֵי חֶצְרוֹן
  choice: Les fils … de Hetsron
  rationale: Le pluriel construit בְנֵי désigne les « fils de » Hetsron. La conjonction initiale וּ־ n’est pas rendue séparément, conformément au style naturel d’une liste généalogique en français.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: qui naquirent à Hetsron
  rationale: Le nifal de ילד avec לוֹ exprime ceux qui « lui naquirent ». La reprise explicite de Hetsron évite en français une référence pronominale pesante ou ambiguë, tout en conservant le point de vue de l’hébreu.
- source_word: יְרַחְמְאֵל
  choice: Yerahméel
  rationale: Transcription française moderne du nom propre hébreu.
- source_word: רָם
  choice: Ram
  rationale: Transcription directe du nom propre hébreu.
- source_word: כְּלוּבָי
  choice: Keloubaï
  rationale: Le texte consonantique porte כְּלוּבָי, transcrit directement « Keloubaï » plutôt qu’harmonisé avec le nom plus connu de Caleb.
- source_word: אֶת
  choice: —
  rationale: La particule marquant le complément d’objet direct n’a pas d’équivalent lexical à rendre en français.
