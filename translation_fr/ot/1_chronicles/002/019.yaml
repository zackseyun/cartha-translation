base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/019.yaml
  text: Azubah died[a], and Caleb took Ephrath as his wife[b], and she bore Hur to him.
translation:
  language: fr
  text: Azouba mourut, puis Caleb prit Éphrath pour femme[a], et elle lui enfanta Hour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Caleb prit Éphrath pour lui » ; en hébreu, cette expression signifie ici qu’il l’épousa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: mourut
  rationale: Le qal wayyiqtol de מות exprime directement la mort; « mourut » est l’équivalent français simple et digne.
- source_word: עֲזוּבָה
  choice: Azouba
  rationale: Nom propre translittéré selon une forme française usuelle, sans en traduire le sens.
- source_word: וַיִּקַּח לוֹ
  choice: prit … pour femme
  rationale: Avec une femme pour complément, לקח est un idiome matrimonial. Cette formulation conserve l’image hébraïque tout en rendant explicite le mariage.
- source_word: כָלֵב
  choice: Caleb
  rationale: Forme française établie du nom propre.
- source_word: אֶפְרָת
  choice: Éphrath
  rationale: Translittération de la forme courte אֶפְרָת attestée dans ce verset.
- source_word: וַתֵּלֶד לוֹ
  choice: elle lui donna un fils
  rationale: Le qal de ילד avec לוֹ indique qu’elle enfanta pour lui. En français courant, « lui donna un fils » exprime naturellement la relation sans suggérer que לוֹ appartient au nom de l’enfant.
- source_word: חוּר
  choice: Hour
  rationale: Forme française traditionnelle et transparente du nom propre.
