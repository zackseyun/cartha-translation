base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/035.yaml
  text: Sheshan gave his daughter to Jarha his servant as a wife[a], and she bore Attai to him.
translation:
  language: fr
  text: Shéshân donna sa fille pour femme à Yarha, son esclave[a], et elle lui enfanta Attaï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le mot hébreu עֶבֶד peut désigner un serviteur ou un esclave; « esclave » est retenu ici parce que le statut dépendant de Yarha au sein de la maison de Shéshân semble avoir une importance sociale dans le récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Le verbe נתן signifie littéralement « donner ». Avec « pour femme », le contexte matrimonial est clair sans qu’il soit nécessaire d’ajouter « en mariage ».
- source_word: שֵׁשָׁן
  choice: Shéshân
  rationale: Nom propre transcrit en français de manière à refléter la forme hébraïque.
- source_word: בִּתּוֹ
  choice: sa fille
  rationale: Rend directement le nom « fille » accompagné du suffixe possessif masculin singulier.
- source_word: לְיַרְחָע
  choice: à Yarha
  rationale: Le préfixe לְ désigne ici le bénéficiaire ou destinataire; le nom propre est transcrit en français.
- source_word: עַבְדּוֹ
  choice: son esclave
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Ici, l’identification de Yarha comme dépendant de la maison de Shéshân paraît socialement significative; « esclave » exprime plus nettement ce statut tout en laissant l’autre possibilité en note.
- source_word: לְאִשָּׁה
  choice: pour femme
  rationale: Expression matrimoniale hébraïque usuelle. « Pour femme » conserve sa concision et reste naturel dans un registre généalogique digne.
- source_word: וַתֵּלֶד
  choice: elle enfanta
  rationale: Au qal avec un sujet féminin, ילד signifie « enfanter, mettre au monde ». « Enfanta » permet de conserver la construction concise avec le nom de l’enfant.
- source_word: לוֹ
  choice: lui
  rationale: Le pronom datif rend le לְ suffixé et indique que Yarha est présenté comme le père dans la formule de naissance.
- source_word: עַתָּי
  choice: Attaï
  rationale: Nom propre transcrit selon une forme française claire, avec le tréma signalant que les deux voyelles se prononcent séparément.
theological_decisions: []
translation_notes:
  register: Style généalogique concis et digne. La tournure « elle lui enfanta Attaï » est légèrement soutenue, mais claire et proche de la structure hébraïque; elle évite une paraphrase telle que « elle lui donna un fils ».
