  text: וּ/בְנֵ֤י כָלֵב֙ אֲחִ֣י יְרַחְמְאֵ֔ל מֵישָׁ֥ע בְּכֹר֖/וֹ ה֣וּא אֲבִי זִ֑יף וּ/בְנֵ֥י מָרֵשָׁ֖ה אֲבִ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/042.yaml
  text: 'And the sons of Caleb the brother of Jerahmeel: Mesha his firstborn[a], who was the father of Ziph[b], and the sons of Mareshah the father of Hebron.'
translation:
  language: fr
  text: 'Les fils de Caleb, frère de Yerahméel : Mésha, son premier-né, qui fut le père de Zif[b], et les fils de Marésha, père d’Hébron[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La syntaxe hébraïque du dernier membre est difficile. Le texte massorétique dit littéralement : « et les fils de Marésha, père d’Hébron ». Certains comprennent : « et Marésha, père d’Hébron » ; la traduction retient ici la formulation du texte hébreu.'
    reason: alternative_reading
  - marker: b
    text: Dans les Chroniques, « père de » peut désigner non seulement le père biologique, mais aussi un ancêtre, un chef de clan ou le fondateur associé à un lieu.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי כָלֵב
  choice: Les fils de Caleb
  rationale: La formule généalogique « fils de » est conservée; selon le contexte, elle peut aussi désigner des descendants plus éloignés.
- source_word: אֲחִי יְרַחְמְאֵל
  choice: frère de Yerahméel
  rationale: Rend directement l’apposition hébraïque tout en restant naturelle en français.
- source_word: מֵישָׁע בְּכֹרוֹ
  choice: Mésha, son premier-né
  rationale: « Premier-né » préserve la nuance généalogique et le statut associé à בְּכוֹר.
- source_word: הוּא אֲבִי זִיף
  choice: qui fut le père de Zif
  rationale: La relative rattache clairement הוּא à Mésha. « Père de » maintient l’éventail de sens possible du terme אָב dans les généalogies.
- source_word: וּבְנֵי מָרֵשָׁה
  choice: et les fils de Marésha
  rationale: La formulation du texte massorétique est conservée malgré la difficulté syntaxique de la proposition finale.
- source_word: אֲבִי חֶבְרוֹן
  choice: père d’Hébron
  rationale: La traduction littérale préserve l’ambiguïté entre paternité biologique, ascendance, direction d’un clan et fondation ou association avec un lieu.
