  text: The sons of Onam were Shammai and Jada[a]. The sons of Shammai were Nadab and Abishur.
translation:
  language: fr
  text: Les fils d’Onam étaient Shammaï et Yada. Les fils de Shammaï étaient Nadab et Abishur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: étaient
  rationale: Dans cette formule généalogique, le verbe היה sert de copule pour présenter les fils d’Onam. « Étaient » rend naturellement cette fonction en français.
- source_word: בְנֵי
  choice: les fils de
  rationale: Le contexte énumère les membres masculins de la lignée immédiate ; « fils » est donc plus précis que « enfants » ou « descendants ».
- source_word: אוֹנָם
  choice: Onam
  rationale: Translittération du nom propre selon l’usage français courant.
- source_word: שַׁמַּי
  choice: Shammaï
  rationale: Translittération française du nom propre, conservée de manière identique dans ses deux occurrences.
- source_word: יָדָע
  choice: Yada
  rationale: La lettre hébraïque initiale yod est rendue par « Y » en français ; il s’agit ici d’un nom propre.
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: La conjonction hébraïque introduit la branche généalogique suivante. En français, une nouvelle phrase sans « et » exprime clairement la même progression tout en restant naturelle.
- source_word: נָדָב
  choice: Nadab
  rationale: Translittération usuelle du nom propre.
- source_word: אֲבִישׁוּר
  choice: Abishur
  rationale: Translittération claire du nom propre hébreu, avec « sh » pour la consonne שׁ.
