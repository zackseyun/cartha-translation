base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/055.yaml
  text: 'and the families of the scribes who lived at Jabez: the Tirathites[a], the Shimeathites, and the Sucathites. These are the Kenites who came from Hammath, the father of the house of Rechab.'
translation:
  language: fr
  text: 'et les familles de scribes qui habitaient à Yabets : les Tiréatiens, les Chiméatiens et les Soukatiens. Ce sont les Qéniens venus de Hammath, père de la maison de Rékab[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ancêtre » ou « le fondateur de la maison de Rékab ». Dans les généalogies, le mot hébreu traduit par « père » peut aussi désigner un ancêtre ou le fondateur d’un clan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת סֹפְרִים
  choice: et les familles de scribes
  rationale: Le waw maintient la continuité de la généalogie. « Familles » rend מִשְׁפְּחוֹת, et « scribes » traduit directement סֹפְרִים sans préciser indûment leur fonction.
- source_word: ישבו יַעְבֵּץ
  choice: qui habitaient à Yabets
  rationale: La tournure relative donne un français naturel et présente Yabets comme leur lieu de résidence.
- source_word: תִּרְעָתִים שִׁמְעָתִים שׂוּכָתִים
  choice: les Tiréatiens, les Chiméatiens et les Soukatiens
  rationale: Ces trois gentilés ou noms de clans sont translittérés sous des formes adaptées à la phonologie et à l’orthographe françaises.
- source_word: הֵמָּה הַקִּינִים
  choice: Ce sont les Qéniens
  rationale: La formulation conserve la valeur d’identification de הֵמָּה et emploie la forme française courante du nom de ce groupe.
- source_word: הַבָּאִים מֵחַמַּת
  choice: venus de Hammath
  rationale: Le participe avec מִן exprime une provenance, sans permettre de trancher entièrement entre déplacement géographique et origine généalogique.
- source_word: אֲבִי בֵית רֵכָב
  choice: père de la maison de Rékab
  rationale: La traduction conserve l’image hébraïque de « père » et l’expression généalogique « maison de », tandis qu’une note signale les sens possibles d’ancêtre ou de fondateur.
theological_decisions:
- issue: Nature du lien entre Hammath et la maison de Rékab
  choice: père de la maison de Rékab
  alternative: ancêtre ou fondateur de la maison de Rékab
  rationale: Le texte hébreu emploie אָב, dont la portée généalogique ou fondatrice reste ouverte ici; la traduction principale garde donc le terme concret et la note explicite l’ambiguïté.
translation_notes:
  register: Français international actuel, sobre et digne. Les noms de peuples sont francisés de manière lisible; la structure de liste et l’expression généalogique « maison de » sont conservées.
