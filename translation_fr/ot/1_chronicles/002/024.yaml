  text: וְ/אַחַ֥ר מוֹת חֶצְר֖וֹן בְּ/כָלֵ֣ב אֶפְרָ֑תָה וְ/אֵ֤שֶׁת חֶצְרוֹן֙ אֲבִיָּ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶת אַשְׁח֖וּר אֲבִ֥י תְקֽוֹעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/024.yaml
  text: After Hezron died in Caleb-ephrathah[a], Hezron’s wife Abijah bore to him Ashhur[b], the father of Tekoa.
translation:
  language: fr
  text: Après la mort de Hetsron à Caleb-Efrata[a], Abiya, femme de Hetsron, lui enfanta Ashhour, père de Teqoa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque traduite par « à Caleb-Efrata » est difficile. Elle peut désigner un lieu ou un clan; son lien exact avec le reste de la phrase demeure incertain.
    reason: alternative_reading
  - marker: b
    text: Ou « fondateur de Teqoa ». Dans les généalogies, « père de » peut désigner le fondateur ou l’ancêtre principal d’une localité ou d’un clan, et pas seulement le père biologique direct.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר מוֹת חֶצְרוֹן
  choice: Après la mort de Hetsron
  rationale: La tournure temporelle rend naturellement אַחַר suivi de l’infinitif construit מוֹת, sans alourdir la phrase.
- source_word: בְּכָלֵב אֶפְרָתָה
  choice: à Caleb-Efrata
  rationale: La préposition בְּ est comprise dans son sens locatif. Le trait d’union présente les deux éléments comme une seule désignation, tout en laissant en note l’incertitude syntaxique et référentielle.
- source_word: וְאֵשֶׁת חֶצְרוֹן אֲבִיָּה
  choice: Abiya, femme de Hetsron
  rationale: Cette formulation française conserve la répétition du nom Hetsron présente en hébreu et identifie clairement Abiya comme son épouse.
- source_word: וַתֵּלֶד לוֹ אֶת אַשְׁחוּר
  choice: lui donna un fils, Ashhour
  rationale: Cette expression idiomatique rend l’accouchement et le complément indirect לוֹ. Le mot « fils », implicite dans la relation généalogique et dans le verbe avec le nom masculin Ashhour, permet une phrase française claire.
- source_word: אֲבִי תְקוֹעַ
  choice: père de Teqoa
  rationale: La traduction formelle « père de » conserve la polysémie généalogique de אָב; l’interprétation possible « fondateur de » est signalée en note.
