translation_notes:
  register: Français moderne, naturel et digne. Les noms sont translittérés de manière lisible à partir de l’hébreu. La difficulté de בְּכָלֵב אֶפְרָתָה et l’étendue sémantique de אָב sont conservées au moyen de notes plutôt que résolues silencieusement.
