base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/050.yaml
  text: 'These were the sons of Caleb son of Hur[a], the firstborn of Ephrathah: Shobal, father of Kiriath-jearim.'
translation:
  language: fr
  text: 'Voici les fils de Caleb, fils de Hour, premier-né d’Éphrata : Shobal, père de Kiriath-Jearim[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fondateur de Kiriath-Jearim » ou « ancêtre de Kiriath-Jearim » ; dans les généalogies, l’hébreu « père de » peut désigner le fondateur ou l’ancêtre d’un clan ou d’une localité.
    reason: alternative_lexicale
lexical_decisions:
- source_word: אֵלֶּה הָיוּ
  choice: Voici
  rationale: Cette formule française introduit naturellement une notice généalogique et rend l’hébreu « ceux-ci étaient » sans lourdeur.
- source_word: בְּנֵי כָלֵב
  choice: les fils de Caleb
  rationale: Le pluriel « fils » conserve la forme généalogique de l’hébreu, qui peut aussi englober des descendants.
- source_word: בֶּן חוּר
  choice: Le fils de Hour
  rationale: Le texte massorétique porte le singulier « fils de Hour ». La ponctuation forte après « Caleb » favorise l’ouverture d’une nouvelle proposition plutôt que l’identification de Caleb comme fils de Hour; la difficulté textuelle est signalée en note.
- source_word: בְּכוֹר אֶפְרָתָה
  choice: premier-né d’Éphrata
  rationale: Dans l’ordre et la syntaxe retenus, le titre qualifie naturellement Hour, conformément au contexte généalogique, sans ajouter le mot « fils » absent de cette expression.
- source_word: שׁוֹבָל
  choice: Shobal
  rationale: Transcription française courante du nom propre.
- source_word: אֲבִי
  choice: père de
  rationale: La traduction littérale conserve l’idiome généalogique; dans ce contexte lié à une localité, le terme peut désigner un fondateur ou un ancêtre, ce que précise la note.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriath-Jearim
  rationale: Le nom de lieu est transcrit plutôt que traduit, selon un usage français transparent et largement reconnaissable.
theological_decisions:
- issue: Relation entre Caleb, Hour, Éphrata et Shobal
  choice: Traiter « le fils de Hour » comme une nouvelle proposition après « les fils de Caleb », puis comprendre Shobal comme ce fils et Hour comme « premier-né d’Éphrata ».
  alternative: '« Caleb, fils de Hour, premier-né d’Éphrata : Shobal… »'
  rationale: L’accentuation massorétique marque une séparation après « Caleb », et le contexte de 1 Chroniques 2 présente Hour comme fils de Caleb, non l’inverse. La formulation conserve néanmoins le singulier difficile du texte massorétique et le signale en note, au lieu de résoudre silencieusement la tension.
translation_notes:
  register: Français moderne, sobre et digne. La structure en deux phrases garde la coupure suggérée par l’accentuation hébraïque. Les noms propres sont transcrits sans traduire le toponyme; la difficulté du singulier « fils » est conservée et documentée.
