lexical_decisions:
- source_word: וַעֲזַרְיָה
  choice: Azaria
  rationale: Nom propre transcrit selon l’usage français courant. Le waw initial assure ici la continuité de la généalogie et n’a pas besoin d’être rendu séparément au début du verset.
- source_word: הֹלִיד
  choice: engendra
  rationale: Dans une généalogie, le hiphil de ילד signifie « engendrer » ou « devenir le père de ». « Engendra » est concis, précis et conforme au registre généalogique français.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marque de l’objet direct sans équivalent lexical autonome en français; sa fonction ressort de l’ordre normal des mots.
- source_word: חָלֶץ / וְחֶלֶץ
  choice: Hélets / et Hélets
  rationale: Le même nom propre est transcrit de manière uniforme dans les deux propositions; le waw de la seconde occurrence est rendu par « et ».
- source_word: אֶלְעָשָׂה
  choice: Éléasa
  rationale: Cette transcription française représente directement la forme hébraïque vocalisée du nom dans ce verset; « Élasa » est une forme française simplifiée possible.
