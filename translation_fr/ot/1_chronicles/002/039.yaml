  text: Azariah fathered Helez[a], and Helez fathered Eleasah.
translation:
  language: fr
  text: Azaria engendra Hélets, et Hélets engendra Éléasa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, selon une transcription simplifiée, « Élasa ».
