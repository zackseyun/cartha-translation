  text: וְ/אִישַׁ֛י הוֹלִ֥יד אֶת בְּכֹר֖/וֹ אֶת אֱלִיאָ֑ב וַ/אֲבִינָדָב֙ הַ/שֵּׁנִ֔י וְ/שִׁמְעָ֖א הַ/שְּׁלִישִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/013.yaml
  text: And Jesse fathered his firstborn Eliab[a], Abinadab the second, and Shimea the third.
translation:
  language: fr
  text: Et Isaï engendra son premier-né, Éliab, Abinadab, le deuxième, et Shiméa[a], le troisième.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « Shiméa » ; la liste parallèle en 1 Samuel 16.9 porte « Shamma ».
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישַׁי
  choice: Et Isaï
  rationale: La conjonction וְ assure ici la continuité de la généalogie. אִישַׁי est rendu selon la forme française traditionnelle « Isaï ».
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans une généalogie, le hifil de ילד signifie « engendrer, être le père de ». « Engendra » conserve précisément le lien généalogique masculin dans un registre biblique digne et clair.
- source_word: אֶת בְּכֹרוֹ אֶת אֱלִיאָב
  choice: son premier-né, Éliab
  rationale: בְּכֹרוֹ signifie « son premier-né » et Éliab en précise l’identité. La ponctuation française rend cette apposition explicite sans ajouter « fils », qui reste implicite.
- source_word: וַאֲבִינָדָב הַשֵּׁנִי
  choice: puis Abinadab, le deuxième
  rationale: L’ordinal הַשֵּׁנִי indique la place d’Abinadab parmi les fils nommés. « Puis » rend naturellement la progression de l’énumération, tandis que la virgule clarifie l’apposition.
- source_word: וְשִׁמְעָא הַשְּׁלִישִׁי
  choice: et Shiméa, le troisième
  rationale: שִׁמְעָא est translittéré « Shiméa » d’après la forme propre aux Chroniques, sans l’harmoniser avec le nom différent du récit parallèle en 1 Samuel. הַשְּׁלִישִׁי signifie « le troisième ».
