base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/018.yaml
  text: 'And Caleb son of Hezron fathered children by Azubah his wife[a], and by Jerioth; and these were her sons: Jesher, Shobab[b], and Ardon.'
translation:
  language: fr
  text: 'Caleb, fils de Hetsron, eut des enfants d’Azouba, sa femme[a], et de Yerioth. Voici ses fils[b] : Yésher, Shobab et Ardon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La syntaxe hébraïque est difficile. Yerioth peut désigner une seconde femme dont Caleb eut des enfants ou, selon une autre interprétation, être mise en apposition avec Azouba.
    reason: alternative_reading
  - marker: b
    text: L’hébreu porte littéralement « ses fils », avec un suffixe féminin singulier. L’antécédent exact de ce suffixe et l’organisation de la généalogie sont discutés.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: eut des enfants de
  rationale: Le hiphil de ילד signifie couramment « engendrer » ou « avoir pour descendants ». La tournure « eut des enfants de » exprime naturellement en français le lien généalogique avec les femmes nommées, sans donner à penser qu’Azouba et Yerioth seraient elles-mêmes les compléments désignant les enfants engendrés.
- source_word: אֶת עֲזוּבָה אִשָּׁה וְאֶת יְרִיעוֹת
  choice: d’Azouba, sa femme, et de Yerioth
  rationale: La construction hébraïque est condensée et difficile. « Sa femme » comprend אִשָּׁה en apposition à Azouba, tandis que Yerioth est coordonnée comme une autre femme liée à la descendance de Caleb. Une note conserve l’autre analyse possible.
- source_word: אִשָּׁה
  choice: sa femme
  rationale: Dans ce contexte généalogique, אִשָּׁה désigne naturellement une épouse. Le possessif, implicite dans la relation, est nécessaire à une formulation française idiomatique.
- source_word: יְרִיעוֹת
  choice: Yerioth
  rationale: Translittération française du nom propre hébreu.
- source_word: וְאֵלֶּה בָנֶיהָ
  choice: Voici les fils de celle-ci
  rationale: Le suffixe de בָנֶיהָ est au féminin singulier. « Celle-ci » maintient explicitement le genre féminin, contrairement au possessif français « ses », qui l’effacerait; une note signale que l’antécédent et l’organisation exacte de la généalogie demeurent discutés.
- source_word: יֵשֶׁר וְשׁוֹבָב וְאַרְדּוֹן
  choice: Yésher, Shobab et Ardon
  rationale: Translittération française des trois noms propres.
theological_decisions:
- issue: Ambiguïté généalogique concernant Azouba et Yerioth
  choice: Caleb a des enfants d’Azouba, sa femme, et de Yerioth; le suffixe féminin du texte massorétique est conservé dans « les fils de celle-ci ».
  alternative: Yerioth peut être comprise en apposition à Azouba plutôt que comme une seconde femme; d’autres reconstructions répartissent autrement les fils mentionnés.
  rationale: Il s’agit d’une difficulté syntaxique et textuelle, non d’un point doctrinal. Le texte principal suit au plus près la grammaire massorétique tout en laissant les autres analyses légitimes dans les notes.
translation_notes:
  register: Français international moderne, sobre et digne. « Eut des enfants de » évite l’archaïsme de « engendra » tout en gardant la relation généalogique. Les noms suivent une translittération française lisible, et les deux notes rendent visibles les difficultés réelles de l’hébreu sans les résoudre artificiellement.
