  text: וּ/שְׂג֖וּב הוֹלִ֣יד אֶת יָאִ֑יר וַֽ/יְהִי ל֗/וֹ עֶשְׂרִ֤ים וְ/שָׁלוֹשׁ֙ עָרִ֔ים בְּ/אֶ֖רֶץ הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/022.yaml
  text: Segub fathered Jair, and he had twenty-three cities in the land of Gilead.
translation:
  language: fr
  text: Segoub engendra Yaïr, et il eut vingt-trois villes dans le pays de Galaad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂגוּב
  choice: Segoub
  rationale: Le nom propre est transcrit selon l’usage français courant; la conjonction initiale n’a pas besoin d’être rendue séparément au début du verset.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans ce contexte généalogique, le hiphil de ילד exprime la paternité. « Engendra » est précis, digne et usuel dans les généalogies bibliques françaises.
- source_word: יָאִיר
  choice: Yaïr
  rationale: Transcription française courante du nom hébreu, avec tréma pour signaler que les voyelles se prononcent séparément.
- source_word: וַיְהִי לוֹ
  choice: qui eut
  rationale: La construction היה + ל exprime ici la possession. Le relatif « qui » désigne naturellement Yaïr, sujet le plus proche, conformément au contexte immédiat.
- source_word: עֶשְׂרִים וְשָׁלוֹשׁ
  choice: vingt-trois
  rationale: Rendu cardinal naturel en français moderne.
- source_word: עָרִים
  choice: villes
  rationale: עִיר peut désigner une ville ou une localité; « villes » conserve le sens territorial traditionnel sans préciser une taille que l’hébreu ne fixe pas.
- source_word: בְּאֶרֶץ הַגִּלְעָד
  choice: dans le pays de Galaad
  rationale: Cette formulation préserve אֶרֶץ et rend naturellement la désignation géographique en français.
theological_decisions:
- issue: Référent du pronom dans וַיְהִי לוֹ
  choice: Yaïr eut les vingt-trois villes
  alternative: Segoub eut les vingt-trois villes
  rationale: Le pronom masculin singulier est grammaticalement ambigu en soi, mais son antécédent naturel est Yaïr, le nom immédiatement précédent; le contexte parallèle de Nombres 32.41 associe également les localités à Yaïr.
translation_notes:
  register: Français moderne, sobre et digne, adapté à une notice généalogique. « Engendra » conserve la précision du registre généalogique sans employer une tournure inutilement longue.
