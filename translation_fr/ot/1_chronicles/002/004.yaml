  text: וְ/תָמָר֙ כַּלָּת֔/וֹ יָ֥לְדָה לּ֖/וֹ אֶת פֶּ֣רֶץ וְ/אֶת זָ֑רַח כָּל בְּנֵ֥י יְהוּדָ֖ה חֲמִשָּֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/004.yaml
  text: Tamar[a], his daughter-in-law, bore Perez and Zerah to him[b]. All the sons of Judah were five.
translation:
  language: fr
  text: Et Tamar, sa belle-fille, lui donna Pérets[a] et Zérah. Juda eut en tout cinq fils[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Pérets est aussi transcrit Perez ou Perets.
    reason: Variante de transcription du nom hébreu פֶּרֶץ.
  - marker: b
    text: Ce total comprend Er, Onân, Shéla, Pérets et Zérah.
    reason: Précision sur la récapitulation généalogique des versets précédents.
lexical_decisions:
- source_word: תָמָר
  choice: Tamar
  rationale: Nom propre transcrit sous sa forme française biblique courante.
- source_word: כַּלָּתוֹ
  choice: sa belle-fille
  rationale: כַּלָּה, avec le suffixe masculin singulier, désigne ici la femme du fils de Juda ; « belle-fille » est le terme de parenté naturel et précis en français.
- source_word: יָלְדָה לּוֹ
  choice: lui enfanta
  rationale: Le verbe ילד exprime l’accouchement, tandis que לּוֹ rattache les enfants à Juda. Cette formulation concise conserve les deux éléments dans le registre généalogique.
- source_word: פֶּרֶץ
  choice: Pérets
  rationale: Transcription française courante du nom hébreu, qui rend la consonne finale צ par « ts ».
- source_word: זָרַח
  choice: Zérah
  rationale: Forme française usuelle du nom propre hébreu.
- source_word: כָּל בְּנֵי יְהוּדָה חֲמִשָּׁה
  choice: Les fils de Juda étaient cinq en tout
  rationale: La tournure française naturelle conserve le sens récapitulatif de כָּל et le dénombrement explicite des fils de Juda.
theological_decisions:
- issue: Relation exprimée par לּוֹ entre Juda et les enfants mis au monde par Tamar
  choice: « lui enfanta Pérets et Zérah »
  alternative: « mit au monde pour lui Pérets et Zérah »
  rationale: « Lui enfanta » marque sobrement le lien généalogique avec Juda sans donner à « pour lui » une nuance moderne de but ou de service.
- issue: Récapitulation généalogique finale
  choice: « Les fils de Juda étaient cinq en tout »
  alternative: « Tous les fils de Juda étaient cinq »
  rationale: Le texte hébreu donne un total simple. La formulation retenue le préserve sans transformer l’énoncé en interprétation théologique, tout en restant idiomatique en français.
- issue: Terminologie sexuée de la parenté
  choice: Conserver « belle-fille » et « fils »
  alternative: Employer des termes génériques comme « parente » ou « enfants »
  rationale: Les mots hébreux désignent précisément une belle-fille et des descendants masculins dans cette liste généalogique.
translation_notes:
  register: Français international moderne, sobre et digne, avec une légère coloration généalogique dans « enfanta ». La dernière phrase adopte un ordre idiomatique tout en maintenant le total explicite du texte hébreu.
