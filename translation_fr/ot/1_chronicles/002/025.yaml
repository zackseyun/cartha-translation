  text: וַ/יִּהְי֧וּ בְנֵי יְרַחְמְאֵ֛ל בְּכ֥וֹר חֶצְר֖וֹן הַ/בְּכ֣וֹר רָ֑ם וּ/בוּנָ֥ה וָ/אֹ֛רֶן וָ/אֹ֖צֶם אֲחִיָּֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/025.yaml
  text: The sons of Jerahmeel[a], the firstborn of Hezron, were Ram his firstborn, Bunah, Oren, Ozem, and Ahijah.
translation:
  language: fr
  text: 'Les fils de Yerahméel[a], premier-né de Hetsron, étaient les suivants : Ram, son premier-né, Bouna, Oren, Otsem et Ahiya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La syntaxe hébraïque peut se comprendre comme une liste de cinq fils de Yerahméel, Ram étant désigné comme « son premier-né ». Certains comprennent différemment la place d’Ahiya dans la phrase, mais la lecture la plus directe y voit un autre nom propre de la liste.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: furent
  rationale: Dans cette liste généalogique, le verbe introduit les membres de la famille; « furent » rend naturellement cette fonction en français.
- source_word: בְנֵי
  choice: les fils de
  rationale: Dans ce contexte généalogique, le terme désigne les fils ou membres masculins de la lignée; « les fils de » en conserve la précision.
- source_word: יְרַחְמְאֵל
  choice: Yerahméel
  rationale: Translittération française moderne du nom propre hébreu.
- source_word: בְּכוֹר חֶצְרוֹן
  choice: premier-né de Hetsron
  rationale: L’expression précise le statut de Yerahméel parmi les fils de Hetsron et conserve la relation appositionnelle de l’hébreu.
- source_word: הַבְּכוֹר
  choice: son premier-né
  rationale: Le groupe apposé se rapporte le plus naturellement à Ram et indique qu’il était le premier-né de Yerahméel; le possessif rend cette relation explicite sans supprimer la répétition hébraïque.
- source_word: רָם
  choice: Ram
  rationale: Translittération usuelle du nom propre.
- source_word: וּבוּנָה
  choice: Bouna
  rationale: Translittération française du nom propre.
- source_word: וָאֹרֶן
  choice: Oren
  rationale: Translittération du nom propre.
- source_word: וָאֹצֶם
  choice: Otsem
  rationale: Translittération française du nom propre hébreu.
- source_word: אֲחִיָּה
  choice: Ahiya
  rationale: Le terme est compris, selon la lecture la plus directe de la série, comme un nom propre et translittéré en français.
