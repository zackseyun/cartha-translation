source:
  edition: WLC
  text: וּ/בֶן שַׁמַּ֖י מָע֑וֹן וּ/מָע֖וֹן אֲבִ֥י בֵֽית צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/045.yaml
  text: And the son of Shammai was Maon[a], and Maon was the father of Beth-zur.
translation:
  language: fr
  text: Le fils de Shammaï fut Maôn, et Maôn fut le père de Beth-Tsour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ancêtre » ou « le fondateur de Beth-Tsour ». Dans les généalogies, l’expression « père de » peut aussi désigner l’ancêtre principal ou le fondateur d’un clan ou d’une localité.
    reason: alternative lexicale
lexical_decisions:
- source_word: וּ/בֶן
  choice: Le fils de
  rationale: Dans cette suite généalogique, בֶן désigne naturellement le fils; le ו relie simplement cette notice à la précédente et peut rester implicite en français pour éviter une ouverture lourde par « Et ».
- source_word: שַׁמַּי
  choice: Shammaï
  rationale: Nom propre translittéré sous une forme française claire, avec le tréma qui distingue les voyelles finales.
- source_word: מָעוֹן
  choice: Maôn
  rationale: Le contexte généalogique présente ici Maôn comme un descendant ou un personnage, même si ce nom peut ailleurs désigner un lieu.
- source_word: וּ/מָעוֹן
  choice: et Maôn
  rationale: La répétition du nom, caractéristique des formules généalogiques hébraïques, est conservée naturellement.
- source_word: אֲבִי
  choice: fut le père de
  rationale: 'Cette formulation maintient l’expression généalogique ordinaire tout en laissant à la note la possibilité d’un sens plus large: ancêtre ou fondateur.'
- source_word: בֵית צֽוּר
  choice: Beth-Tsour
  rationale: Le nom de lieu ou de clan est translittéré plutôt que traduit littéralement par « maison de Tsour ».
