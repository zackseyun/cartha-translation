id: 1CH.2.46
reference: 1 Chronicles 2:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עֵיפָה֙ פִּילֶ֣גֶשׁ כָּלֵ֔ב יָֽלְדָ֛ה אֶת חָרָ֥ן וְ/אֶת מוֹצָ֖א וְ/אֶת גָּזֵ֑ז וְ/חָרָ֖ן הֹלִ֥יד אֶת גָּזֵֽז־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/046.yaml
  text: And Ephah[a], Caleb’s concubine, bore Haran, Moza, and Gazez; and Haran fathered Gazez.
translation:
  language: fr
  text: Épha, concubine de Caleb, enfanta Harân, Motsa et Gazez ; Harân engendra[a] Gazez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devint le père de » Gazez.'
    reason: Signale une autre formulation naturelle de la relation généalogique exprimée par la forme causative de ילד.
lexical_decisions:
- source_word: פִּילֶגֶשׁ
  choice: concubine
  rationale: Le terme hébreu désigne une femme ayant un statut conjugal reconnu mais inférieur à celui d’une épouse principale. « Concubine » est l’équivalent français usuel et concis.
- source_word: יָלְדָה
  choice: enfanta
  rationale: Dans une généalogie, ce verbe exprime de façon concise qu’une femme a donné naissance aux personnes nommées.
- source_word: הֹלִיד
  choice: engendra
  rationale: La forme causative de ילד exprime ici la paternité dans une lignée. « Engendra » conserve la valeur généalogique du terme et demeure clair en français biblique actuel.
- source_word: עֵיפָה
  choice: Épha
  rationale: Nom propre transcrit selon l’usage français.
- source_word: כָּלֵב
  choice: Caleb
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre.
- source_word: חָרָן
  choice: Harân
  rationale: Nom propre transcrit de manière identique dans ses deux occurrences.
- source_word: מוֹצָא
  choice: Motsa
  rationale: Transcription française qui représente la consonne hébraïque צ par « ts ».
- source_word: גָּזֵז
  choice: Gazez
  rationale: Nom propre transcrit de manière identique dans ses deux occurrences.
- source_word: וְ
  choice: et ;
  rationale: La conjonction coordonne les noms puis les deux propositions généalogiques ; le point-virgule rend clairement l’articulation entre les propositions.
- source_word: אֶת
  choice: non rendu séparément
  rationale: La marque hébraïque de l’objet direct n’a pas d’équivalent lexical en français et est exprimée par l’ordre des mots.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne, avec la concision propre aux notices généalogiques. Le marqueur de note est placé après « engendra », expression à laquelle la variante se rapporte, plutôt qu’après le nom Épha.
