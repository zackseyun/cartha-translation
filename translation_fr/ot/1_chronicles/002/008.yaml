  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, l’expression « les fils d’Étan » n’est suivie que d’un seul nom, « Azaria ». Il peut s’agir d’une formule généalogique introduisant la lignée d’Étan, ou le mot « fils » peut désigner plus largement ses descendants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Et les fils de
  rationale: La conjonction וּ est rendue par « Et » afin de conserver l’enchaînement généalogique. בְנֵי est le pluriel construit de « fils » ; le conserver respecte la formulation hébraïque sans la préciser artificiellement par « descendants ».
- source_word: אֵיתָן
  choice: Étan
  rationale: Nom propre translittéré selon l’usage biblique français courant.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Nom propre translittéré selon l’usage biblique français courant. Le nom reste au singulier bien qu’il suive le pluriel « fils », conformément au texte hébreu transmis.
