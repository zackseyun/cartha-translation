lexical_decisions:
- source_word: פִּלֶגֶשׁ
  choice: concubine
  rationale: Le terme désigne une femme liée à un homme par une union reconnue mais de rang secondaire. « Concubine » est l’équivalent français courant, concis et adapté au contexte généalogique.
- source_word: כָּלֵב
  choice: Caleb
  rationale: Nom propre rendu selon sa forme française biblique usuelle.
- source_word: מַעֲכָה
  choice: Maaka
  rationale: Translittération française lisible du nom propre hébreu, permettant de représenter la consonne כ sans employer le digramme anglais « ch ».
- source_word: יָלַד
  choice: enfanta
  rationale: Dans les généalogies, le verbe peut désigner de manière générale le fait d’engendrer. Le sujet étant explicitement une femme, « enfanta » est ici naturel et précis.
- source_word: שֶׁבֶר
  choice: Shéber
  rationale: Translittération française du nom propre, avec « sh » pour שׁ et un accent indiquant la voyelle fermée.
- source_word: וְאֶת
  choice: et
  rationale: La conjonction introduit le second complément d’objet; la marque hébraïque de l’objet direct n’a pas d’équivalent à exprimer en français.
- source_word: תִּרְחֲנָה
  choice: Tirhana
  rationale: Translittération française lisible du nom propre; « h » représente approximativement la consonne gutturale ח sans suggérer le son français de « ch ».
