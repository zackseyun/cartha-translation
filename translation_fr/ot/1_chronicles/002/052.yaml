  text: וַ/יִּהְי֤וּ בָנִים֙ לְ/שׁוֹבָ֔ל אֲבִ֖י קִרְיַ֣ת יְעָרִ֑ים הָרֹאֶ֖ה חֲצִ֥י הַ/מְּנֻחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/052.yaml
  text: 'And Shobal the father of Kiriath-jearim had sons: Haroeh[c][b][a], half of the Manahathites.'
translation:
  language: fr
  text: Shobal, père[a] de Qiryath-Yéarim, eut pour fils Haroé[b] et la moitié des Manahathites[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fondateur de Qiryath-Yéarim » ; dans les généalogies, « père de » peut désigner l’ancêtre ou le principal fondateur associé à une ville.
    reason: lexical_alternative
  - marker: b
    text: Haroé est peut-être un nom de personne correspondant à Réaya dans certaines traditions.
    reason: alternative_reading
  - marker: c
    text: Littéralement « la moitié des Menouhoth » ; l’expression peut aussi signifier « la moitié de Menouhoth » ou « la moitié des habitants, ou du clan, de Menouhoth (Manahath) ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְשׁוֹבָל
  choice: Shobal … eut pour fils
  rationale: Cette tournure française naturelle restitue l’expression hébraïque « il y eut des fils à Shobal » tout en conservant son sens généalogique.
- source_word: אֲבִי קִרְיַת יְעָרִים
  choice: père de Qiryath-Yéarim
  rationale: Le rendu littéral « père de » préserve l’expression généalogique, qui peut aussi désigner l’ancêtre, le fondateur ou le chef associé à une ville.
- source_word: קִרְיַת יְעָרִים
  choice: Qiryath-Yéarim
  rationale: Le nom de lieu est translittéré plutôt que traduit; cette forme reste proche de l’hébreu tout en étant lisible en français.
- source_word: הָרֹאֶה
  choice: Haroé
  rationale: Dans cette généalogie, la forme est comprise comme un nom propre. La translittération évite de trancher en faveur du sens lexical « le voyant » ou d’une harmonisation avec Réaya.
- source_word: חֲצִי הַמְּנֻחוֹת
  choice: la moitié des Manahathites
  rationale: Dans ce contexte généalogique et géographique, l’expression semble désigner la moitié d’un groupe humain ou clanique lié à Manahath; la note conserve les autres compréhensions possibles.
