lexical_decisions:
- source_word: וּ/בֹעַז
  choice: Boaz
  rationale: Nom propre rendu selon sa forme française biblique traditionnelle; la conjonction initiale n’est pas exprimée séparément, puisque le verset poursuit naturellement la généalogie.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans un contexte généalogique, le hiphil de ילד indique qu’un homme devient père en procréant. « Engendra » est précis, concis et bien établi dans le registre généalogique français.
- source_word: אֶת
  choice: '[non traduit]'
  rationale: Marqueur du complément d’objet direct, sans équivalent lexical naturel en français; sa fonction est portée par la syntaxe.
- source_word: עוֹבֵד
  choice: Obed
  rationale: Nom propre rendu selon sa forme française biblique traditionnelle.
- source_word: וְ/עוֹבֵד
  choice: et Obed
  rationale: La conjonction relie les deux propositions généalogiques; le nom conserve sa forme française traditionnelle.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Le verbe généalogique répété est traduit de manière identique afin de préserver le parallélisme et la cohérence.
- source_word: יִשָׁי
  choice: Jessé
  rationale: Forme française biblique traditionnelle du nom propre, immédiatement reconnaissable par le lectorat francophone.
