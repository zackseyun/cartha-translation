  text: Shema fathered Raham[a], the father of Jorkeam; and Rekem fathered Shammai.
translation:
  language: fr
  text: Shéma engendra Raham[a], père de Yorqéam, et Réqem engendra Shammaï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Raham, fondateur ou ancêtre de Yorqéam ». En hébreu, l’expression « père de » peut désigner le fondateur ou l’ancêtre d’un clan ou d’une localité, notamment dans les généalogies.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans une généalogie, le hiphil de ילד exprime la descendance. « Engendra » est concis, digne et traditionnellement intelligible en français, sans ajouter de précision absente de l’hébreu.
- source_word: אֲבִי
  choice: père de
  rationale: 'Cette traduction conserve directement la formulation hébraïque et son ambiguïté possible : il peut s’agir d’une paternité, mais aussi d’un rapport d’ancêtre ou de fondateur avec un clan ou une localité.'
- source_word: שֶׁמַע
  choice: Shéma
  rationale: Translittération adaptée à la lecture française du nom propre hébreu.
- source_word: רַחַם
  choice: Raham
  rationale: Translittération du nom propre hébreu.
- source_word: יָרְקֳעָם
  choice: Yorqéam
  rationale: 'Translittération adaptée au français : le yod initial est rendu par « Y », et le qoph par « q ».'
- source_word: רֶקֶם
  choice: Réqem
  rationale: Translittération adaptée au français, avec « q » pour le qoph.
- source_word: שַׁמָּי
  choice: Shammaï
  rationale: Translittération adaptée au français, avec le tréma pour signaler la prononciation distincte de la voyelle finale.
