  text: וְ/אַחַ֗ר בָּ֤א חֶצְרוֹן֙ אֶל בַּת מָכִיר֙ אֲבִ֣י גִלְעָ֔ד וְ/ה֣וּא לְקָחָ֔/הּ וְ/ה֖וּא בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת שְׂגֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/021.yaml
  text: Afterward Hezron went in to the daughter of Machir the father of Gilead[a], and he took her when he was sixty years old[c][b], and she bore Segub to him.
translation:
  language: fr
  text: Plus tard, Hetsron s’unit à la fille de Makir[a], père de Galaad[b]. Il la prit pour femme[c] alors qu’il avait soixante ans, et elle lui enfanta Segoub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « alla vers » ou « vint auprès de » ; dans ce contexte, l’expression hébraïque peut désigner avec discrétion une union sexuelle ou conjugale.
    reason: lexical_alternative
  - marker: b
    text: Dans une généalogie, « père de Galaad » peut aussi signifier « ancêtre de Galaad » ou « fondateur de Galaad ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « il la prit » ; l’expression peut aussi être rendue par « il l’épousa ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Plus tard
  rationale: Cette expression marque une étape ultérieure du récit généalogique. « Plus tard » est naturel en français moderne sans préciser davantage l’intervalle.
- source_word: בָּא אֶל
  choice: s’unit à
  rationale: Avec une femme comme complément, cette tournure peut désigner avec discrétion une union sexuelle ou conjugale. « S’unit à » restitue ce sens sans employer un calque hébraïque peu naturel en français.
- source_word: בַּת מָכִיר
  choice: la fille de Makir
  rationale: Rend directement la chaîne construite hébraïque et conserve le style généalogique.
- source_word: אֲבִי גִלְעָד
  choice: père de Galaad
  rationale: « Père » est l’équivalent direct de אָב, tout en laissant à la note la possibilité d’un sens généalogique plus large.
- source_word: לְקָחָהּ
  choice: il la prit pour femme
  rationale: Avec une femme comme objet, לָקַח peut exprimer le mariage. Cette formulation reste proche de l’image hébraïque tout en étant intelligible en français courant.
- source_word: וְהוּא בֶּן שִׁשִּׁים שָׁנָה
  choice: alors qu’il avait soixante ans
  rationale: Rend naturellement l’idiome hébraïque littéral « fils de soixante ans » et rattache clairement l’âge à Hetsron.
- source_word: וַתֵּלֶד לוֹ
  choice: elle lui donna
  rationale: Dans ce contexte généalogique, « elle lui donna [un fils] » rend de façon naturelle l’accouchement et conserve la valeur du pronom indirect לוֹ.
- source_word: שְׂגוּב
  choice: Segoub
  rationale: Translittération française usuelle du nom propre hébreu.
theological_decisions:
- issue: Nature de l’union entre Hetsron et la fille de Makir
  choice: Le texte associe une union intime (« s’unit à ») à la prise de la femme comme épouse.
  alternative: Traduire seulement par « eut des relations avec » ou seulement par « épousa ».
  rationale: Les deux verbes hébreux successifs évoquent respectivement l’approche ou l’union et le fait de prendre la femme, souvent en mariage. La traduction maintient ces deux éléments sans les fondre en une seule affirmation.
- issue: Sens généalogique de « père de Galaad »
  choice: Conserver « père » dans le texte.
  alternative: Préciser « ancêtre » ou « fondateur ».
  rationale: Le contexte généalogique permet plusieurs nuances de אָב. Le texte français conserve le terme direct et la note signale l’ambiguïté au lieu de la résoudre.
translation_notes:
  register: 'Français international moderne, clair et digne, avec une légère tonalité généalogique. Les noms suivent des formes françaises courantes : Hetsron, Makir, Galaad et Segoub. Les notes conservent les ambiguïtés lexicales de l’hébreu sans alourdir le texte principal.'
