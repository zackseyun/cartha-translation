  rationale: L’adjectif ordinal avec article indique le rang dans la liste généalogique ; l’article défini est conservé naturellement en français.
- source_word: רַדַּי
  choice: Raddaï
  rationale: Nom propre translittéré ; le tréma signale que la finale -aï se prononce en deux éléments vocaliques, conformément à l’usage français.
- source_word: הַחֲמִישִׁי
  choice: le cinquième
  rationale: L’adjectif ordinal avec article, parallèle au précédent, marque le rang dans la fratrie.
