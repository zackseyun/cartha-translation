  rationale: Nom propre rendu par une translittération française usuelle, sans en traduire le sens.
- source_word: הוֹלִיד / הֹלִיד
  choice: engendra
  rationale: Le hiphil de ילד, dans cette généalogie, désigne le fait d’avoir pour descendant direct ou d’engendrer. « Engendra » est concis, clair dans un contexte généalogique et conserve la répétition de l’hébreu.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur du complément d’objet direct, représenté en français par la construction syntaxique.
- source_word: יְקַמְיָה / וִיקַמְיָה
  choice: Yeqamia / et Yeqamia
  rationale: Le nom propre est translittéré selon une forme adaptée au français; la conjonction ו est rendue par « et », et la répétition du nom est conservée.
- source_word: אֱלִישָׁמָע
  choice: Élishama
  rationale: Nom propre translittéré sous une forme naturelle en français.
