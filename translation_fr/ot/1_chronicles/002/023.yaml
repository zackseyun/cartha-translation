language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח גְּשֽׁוּר וַ֠/אֲרָם אֶת חַוֺּ֨ת יָאִ֧יר מֵ/אִתָּ֛/ם אֶת קְנָ֥ת וְ/אֶת בְּנֹתֶ֖י/הָ שִׁשִּׁ֣ים עִ֑יר כָּל אֵ֕לֶּה בְּנֵ֖י מָכִ֥יר אֲבִי גִלְעָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/023.yaml
  text: But Geshur and Aram took the villages of Jair from them[a], along with Kenath and its daughter towns—sixty cities. All these were the sons of Machir[c][b], the father of Gilead.
translation:
  language: fr
  text: 'Mais Gueshour et Aram leur prirent les villages de Yaïr[a], ainsi que Qenath et les localités qui en dépendaient[b] : soixante villes. Tous ceux-là étaient les fils de Makir[c], père de Galaad.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Havvoth-Yaïr », nom de lieu signifiant « campements de Yaïr » ou « villages de Yaïr ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « ses filles » : les localités secondaires rattachées à Qenath.'
    reason: cultural_note
  - marker: c
    text: Ici, « fils de Makir » peut désigner ses descendants ou les membres de son clan, et non nécessairement ses fils immédiats.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prirent
  rationale: Le pluriel est naturel en français avec le sujet composé « Gueshour et Aram ». « Prendre » conserve la portée assez large de l’hébreu sans imposer explicitement l’idée d’une conquête militaire.
- source_word: גְּשׁוּר וַאֲרָם
  choice: Gueshour et Aram
  rationale: Les noms propres sont translittérés directement depuis l’hébreu ; « Aram » évite l’anachronisme possible de « Syrie ».
- source_word: חַוֺּת יָאִיר
  choice: les villages de Yaïr
  rationale: La traduction rend le sens transparent du toponyme tout en restant naturelle ; sa lecture comme nom de lieu est signalée en note.
- source_word: מֵאִתָּם
  choice: leur
  rationale: Le pronom complément dans « leur prirent » exprime naturellement en français que ces lieux furent retirés à leur possession.
- source_word: קְנָת
  choice: Qenath
  rationale: Translittération française proche de la forme hébraïque.
- source_word: בְּנֹתֶיהָ
  choice: les localités qui en dépendaient
  rationale: Littéralement « ses filles » ; l’expression désigne les établissements satellites rattachés à Qenath. La formulation française explicite l’idiome sans ajouter de précision indue.
- source_word: שִׁשִּׁים עִיר
  choice: soixante villes
  rationale: Traduction directe de l’expression hébraïque, qui récapitule le nombre total des agglomérations.
- source_word: כָּל אֵלֶּה
  choice: Tous ceux-là
  rationale: Le masculin personnel s’accorde avec la proposition généalogique qui suit, tout en laissant le contexte déterminer l’étendue exacte du groupe visé.
- source_word: בְּנֵי מָכִיר
  choice: étaient les fils de Makir
  rationale: La formulation reproduit directement l’expression généalogique hébraïque. « Fils » peut ici désigner plus largement les descendants ou les membres du clan, nuance indiquée en note.
- source_word: אֲבִי גִלְעָד
  choice: père de Galaad
  rationale: Cette formulation préserve l’idiome hébreu, qui peut désigner un père au sens strict ou un ancêtre.
theological_decisions:
- issue: Portée généalogique de בְּנֵי (« fils de »)
  choice: Conserver « fils de Makir » dans le texte
  alternative: « descendants de Makir » ou « appartenaient aux fils de Makir »
  rationale: Le rendu formel maintient la tension du texte entre filiation immédiate, descendance et appartenance clanique, sans trancher au-delà de l’hébreu.
translation_notes:
  register: Français international moderne, digne et lisible. Les noms suivent des formes françaises proches de l’hébreu. La métaphore opaque des « filles » est explicitée dans le texte et conservée littéralement en note ; les ambiguïtés généalogiques sont maintenues.
