source:
  edition: WLC
  text: בְּנֵ֣י שַׂלְמָ֗א בֵּ֥ית לֶ֨חֶם֙ וּ/נְט֣וֹפָתִ֔י עַטְר֖וֹת בֵּ֣ית יוֹאָ֑ב וַ/חֲצִ֥י הַ/מָּנַחְתִּ֖י הַ/צָּרְעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/054.yaml
  text: 'The sons of Salma: Bethlehem[a], the Netophathites, Atroth-beth-joab, half of the Manahathites[b], the Zorites.'
translation:
  language: fr
  text: 'Les fils de Salma : Bethléhem, les Netophatiens, Atroth-Beth-Joab, la moitié des Manahatiens[a], les Tsoréens[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « les Menouhothites ». Le rattachement exact de ce gentilé hébreu à un nom de lieu est incertain.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire les gens associés à Tsorea; on pourrait aussi traduire « les Tsoréathites ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Dans une généalogie, le terme peut englober les descendants et les groupes issus d’un ancêtre. La formulation traditionnelle « les fils de » conserve l’expression hébraïque tout en restant naturelle en français.
- source_word: שַׂלְמָא
  choice: Salma
  rationale: Translittération française simple du nom propre hébreu.
- source_word: בֵּית לֶחֶם
  choice: Bethléhem
  rationale: Forme française établie du nom de lieu. Dans cette liste généalogique, le lieu représente probablement la population ou le groupe qui lui est associé, mais le texte nomme directement Bethléhem.
- source_word: וּנְטוֹפָתִי
  choice: les Netophatiens
  rationale: Le gentilé hébreu désigne ici un groupe humain associé à Netopha; le pluriel français convient au contexte généalogique.
- source_word: עַטְרוֹת בֵּית יוֹאָב
  choice: Atroth-Beth-Joab
  rationale: L’expression est comprise comme un nom composé de lieu ou de groupe. Sa translittération évite de lui imposer une traduction littérale incertaine.
- source_word: וַחֲצִי
  choice: la moitié des
  rationale: Rend directement l’idée d’une moitié appartenant au groupe nommé ensuite; la coordination de la liste est portée naturellement par la ponctuation française.
- source_word: הַמָּנַחְתִּי
  choice: les Manahatiens
  rationale: Le mot est un gentilé avec article et désigne vraisemblablement un clan ou une population associés à Manahath. L’incertitude sur le nom de lieu correspondant est signalée en note.
- source_word: הַצָּרְעִי
  choice: les Tsoréens
  rationale: Ce gentilé désigne les personnes associées à Tsorea. « Tsoréens » conserve sous une forme concise le lien avec le nom hébreu.
