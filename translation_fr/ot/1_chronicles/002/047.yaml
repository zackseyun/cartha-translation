  yaml_path: translation/ot/1_chronicles/002/047.yaml
  text: 'The sons of Jahdai: Regem, Jotham, Geshan, Pelet, Ephah, and Shaaph.'
translation:
  language: fr
  text: 'Fils de Yahdaï : Réguem, Yotam, Guéshan, Péleth, Éfa et Shaaf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Fils de
  rationale: La forme construite plurielle introduit directement une liste généalogique. En français, l’ellipse « Fils de » est naturelle dans ce type de liste et évite d’alourdir le verset.
- source_word: יָהְדָּי
  choice: Yahdaï
  rationale: Transcription française du nom propre, avec Y pour représenter le yod initial et tréma pour distinguer les deux voyelles finales.
- source_word: רֶגֶם
  choice: Réguem
  rationale: Transcription adaptée aux conventions phonétiques du français.
- source_word: יוֹתָם
  choice: Yotam
  rationale: Transcription proche de la forme hébraïque, claire pour un lectorat francophone.
- source_word: גֵישָׁן
  choice: Guéshan
  rationale: Transcription française du nom propre ; « gu » conserve le son dur de ג devant é.
- source_word: פֶלֶט
  choice: Péleth
  rationale: Forme française biblique reconnaissable, tout en représentant le nom hébreu.
- source_word: עֵיפָה
  choice: Éfa
  rationale: Transcription concise du nom propre selon les usages français ; il s’agit ici d’une personne, non de l’unité de mesure homonyme.
- source_word: שָׁעַף
  choice: Shaaf
  rationale: Transcription lisible qui conserve les deux voyelles séparées du nom hébreu.
