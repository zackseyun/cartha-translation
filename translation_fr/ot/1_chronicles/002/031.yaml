  text: וּ/בְנֵ֥י אַפַּ֖יִם יִשְׁעִ֑י וּ/בְנֵ֤י יִשְׁעִי֙ שֵׁשָׁ֔ן וּ/בְנֵ֥י שֵׁשָׁ֖ן אַחְלָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/031.yaml
  text: 'The sons of Appaim: Ishi[a]; and the sons of Ishi: Sheshan; and the sons of Sheshan: Ahlai.'
translation:
  language: fr
  text: 'Et les fils d’Appaïm : Yishéï[a] ; et les fils de Yishéï : Shéshân ; et les fils de Shéshân : Ahlaï.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: À chaque occurrence, « fils de » peut aussi signifier « descendants de » ; dans les généalogies, l’hébreu בְּנֵי peut désigner une lignée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: fils de
  rationale: Dans cette formule généalogique répétée, בְּנֵי désigne normalement les fils, tout en pouvant parfois s’étendre aux descendants. La formulation française conserve la concision et la structure de l’hébreu.
- source_word: אַפַּיִם
  choice: Appaïm
  rationale: Nom propre translittéré en français ; le tréma indique que les voyelles finales se prononcent séparément.
- source_word: יִשְׁעִי
  choice: Yishéï
  rationale: Translittération française du nom hébreu, avec Y pour le yod initial et sh pour שׁ.
- source_word: שֵׁשָׁן
  choice: Shéshân
  rationale: Translittération française qui distingue les voyelles hébraïques et représente שׁ par sh.
- source_word: אַחְלָי
  choice: Ahlaï
  rationale: Translittération française du nom propre ; le h rend la consonne ח de façon lisible sans imposer une notation savante.
