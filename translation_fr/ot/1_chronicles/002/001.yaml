source:
  edition: WLC
  text: אֵ֖לֶּה בְּנֵ֣י יִשְׂרָאֵ֑ל רְאוּבֵ֤ן שִׁמְעוֹן֙ לֵוִ֣י וִ/יהוּדָ֔ה יִשָׂשכָ֖ר וּ/זְבֻלֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/001.yaml
  text: 'These are the sons of Israel: Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: fr
  text: 'Voici les fils d’Israël : Ruben, Siméon, Lévi, Juda, Issacar et Zabulon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Le démonstratif pluriel introduit une liste. « Voici » rend naturellement cette fonction présentative en français, sans qu’il soit nécessaire d’ajouter une copule.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le syntagme désigne ici les fils masculins de Jacob/Israël nommés individuellement, et non ses enfants en général ni ses descendants ultérieurs.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte hébreu emploie le nom Israël. Il est conservé plutôt que remplacé par Jacob, bien que les deux noms désignent ici le même patriarche.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: שִׁמְעוֹן
  choice: Siméon
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: לֵוִי
  choice: Lévi
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: וִיהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle du nom. La conjonction hébraïque ne requiert pas ici un « et » distinct, car l’énumération française place naturellement la coordination avant le dernier élément.
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Forme française traditionnelle et largement reconnue du nom biblique.
- source_word: וּזְבֻלוּן
  choice: et Zabulon
  rationale: La conjonction finale est rendue par « et » selon l’usage naturel du français; « Zabulon » est la forme française traditionnelle du nom.
