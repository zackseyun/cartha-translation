  text: וַ/תְּהִ֨י אִשָּׁ֥ה אַחֶ֛רֶת לִֽ/ירַחְמְאֵ֖ל וּ/שְׁמָ֣/הּ עֲטָרָ֑ה הִ֖יא אֵ֥ם אוֹנָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/026.yaml
  text: Jerahmeel also had another wife, and her name was Atarah; she was the mother of Onam.
translation:
  language: fr
  text: Yerahméel eut aussi une autre épouse, qui s’appelait Atara ; elle était la mère d’Onam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי ... לִירַחְמְאֵל
  choice: Yerahméel eut aussi
  rationale: La construction היה avec ל exprime ici la possession. « Eut » est naturel dans une notice généalogique, et « aussi » marque l’ajout d’une autre épouse dans le contexte.
- source_word: אִשָּׁה אַחֶרֶת
  choice: une autre femme
  rationale: Dans ce contexte généalogique, אִשָּׁה désigne une épouse ; le français courant peut employer « femme » dans ce sens, tandis que אַחֶרֶת indique qu’elle s’ajoute à une première.
- source_word: וּשְׁמָהּ
  choice: qui s’appelait
  rationale: Cette formulation idiomatique rend naturellement la formule hébraïque « et son nom était » sans en modifier le sens.
- source_word: עֲטָרָה
  choice: Atara
  rationale: Translittération française du nom propre, avec suppression du h final non prononcé.
- source_word: הִיא אֵם
  choice: elle fut la mère
  rationale: Le pronom indépendant est conservé par « elle » ; « fut la mère » convient au registre généalogique et exprime l’identification donnée par le texte.
- source_word: אוֹנָם
  choice: Onam
  rationale: Translittération conventionnelle du nom propre.
