base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/032.yaml
  text: 'The sons of Jada[a], Shammai’s brother: Jether and Jonathan. Jether died without sons.'
translation:
  language: fr
  text: Les fils de Jada, frère de Shammaï, étaient Jéther et Jonathan. Jéther mourut sans avoir de fils[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Jéther mourut : aucun fils » ; c’est-à-dire qu’il mourut sans avoir de fils.'
    reason: L’hébreu emploie une tournure nominale elliptique, rendue idiomatiquement dans le texte français.
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן introduit une nouvelle branche généalogique. La conjonction initiale n’a pas besoin d’être rendue séparément en français.
- source_word: יָדָע
  choice: Yada
  rationale: Translittération française régulière du nom hébreu יָדָע.
- source_word: אֲחִי שַׁמַּי
  choice: frère de Shammaï
  rationale: אֲחִי désigne ici littéralement le frère de Shammaï; rien dans le contexte n’impose le sens plus large de « parent ».
- source_word: יֶתֶר
  choice: Yéter
  rationale: Translittération française du nom propre, employée de façon identique dans ses deux occurrences.
- source_word: וְיוֹנָתָן
  choice: et Jonathan
  rationale: La conjonction est conservée entre les deux noms; « Jonathan » est la forme française biblique usuelle de יוֹנָתָן.
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le wayyiqtol fait avancer le bref récit généalogique; le passé simple convient au registre narratif écrit et dignifié.
- source_word: לֹא בָנִים
  choice: sans avoir de fils
  rationale: L’expression hébraïque elliptique signifie littéralement « pas de fils ». La formulation française explicite naturellement que Yéter mourut sans descendance masculine, point pertinent dans cette généalogie.
theological_decisions:
- issue: Portée de l’absence de descendance
  choice: sans avoir de fils
  alternative: sans avoir d’enfants
  rationale: Le texte dit précisément בָנִים, « fils ». Il ne permet pas d’affirmer que Yéter n’eut aucun enfant, notamment aucune fille.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient la concision du style généalogique. Les noms propres suivent une translittération française lisible, avec les trémas et accents utiles à la prononciation.
