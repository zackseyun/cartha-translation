source:
  edition: WLC
  text: וַ/תֵּ֗לֶד שַׁ֚עַף אֲבִ֣י מַדְמַנָּ֔ה אֶת שְׁוָ֛א אֲבִ֥י מַכְבֵּנָ֖ה וַ/אֲבִ֣י גִבְעָ֑א וּ/בַת כָּלֵ֖ב עַכְסָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/049.yaml
  text: Shepha fathered Sheva, the father of Machbenah and the father of Gibea; and Caleb’s daughter was Acsah.
translation:
  language: fr
  text: Elle enfanta Shaaf, père[a] de Madmanna, ainsi que Shéva, père de Makbéna et de Guibéa. Aksa était fille de Caleb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « père de » peut aussi signifier « ancêtre de » ou « fondateur de », notamment si les noms qui suivent désignent des clans ou des localités.
    reason: La formule אָבִי est formellement généalogique, mais son emploi dans les Chroniques peut exprimer une relation clanique ou territoriale; la note préserve cette ambiguïté sans la trancher.
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Elle enfanta
  rationale: Le verbe est au féminin singulier et son sujet implicite renvoie naturellement à Maaka dans le contexte précédent. « Enfanta » convient au registre généalogique.
- source_word: שַׁעַף
  choice: Shaaf
  rationale: Transcription française proche de l’hébreu Shaʿaf, avec omission naturelle du signe technique représentant la consonne pharyngale.
- source_word: אֲבִי
  choice: père de
  rationale: Traduction directe de la formule généalogique; dans ce type de liste, elle peut aussi présenter quelqu’un comme ancêtre d’un clan ou fondateur d’une localité.
- source_word: מַדְמַנָּה
  choice: Madmanna
  rationale: Transcription française de ce nom propre, explicitement présent dans le texte hébreu.
- source_word: שְׁוָא
  choice: Shéva
  rationale: Transcription distinguant ce nom de Shaaf et reflétant la vocalisation massorétique.
- source_word: מַכְבֵּנָה
  choice: Makbéna
  rationale: Transcription française qui rend la consonne כ par « k » et conserve l’accentuation lisible du nom.
- source_word: גִבְעָא
  choice: Guibéa
  rationale: Forme française lisible correspondant à la vocalisation hébraïque du nom.
- source_word: עַכְסָה
  choice: Aksa
  rationale: Transcription française simple et proche de la forme hébraïque.
theological_decisions:
- issue: Relation généalogique entre Shaaf et Shéva
  choice: Présenter Shaaf et Shéva comme deux personnes enfantées par le sujet féminin implicite
  alternative: « Shaaf engendra Shéva »
  rationale: La syntaxe hébraïque fait de « Shaaf, père de Madmanna » puis de « Shéva, père de Makbéna… » deux compléments du verbe féminin « elle enfanta ». La lecture de l’anglais de consultation omet Madmanna et transforme la relation, mais elle n’est pas soutenue par le WLC.
- issue: Portée de « père de »
  choice: Conserver la formule littérale tout en signalant son éventuelle valeur clanique ou géographique
  alternative: Traduire directement par « fondateur de » ou « ancêtre des habitants de »
  rationale: Le texte ne précise pas s’il s’agit d’une paternité biologique, d’une ascendance clanique ou de la fondation d’une localité; la traduction garde cette tension.
translation_notes:
  register: Français moderne, digne et concis, adapté à une généalogie. La coordination « ainsi que » clarifie que Shaaf et Shéva dépendent tous deux du verbe féminin, tandis que la dernière proposition nominale hébraïque est rendue naturellement par « Aksa était fille de Caleb ».
