  text: וּ/בְנֵ֥י נָדָ֖ב סֶ֣לֶד וְ/אַפָּ֑יִם וַ/יָּ֥מָת סֶ֖לֶד לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/030.yaml
  text: 'The sons of Nadab: Seled and Appaim[a]. Seled died without sons.'
translation:
  language: fr
  text: 'Les fils de Nadab : Séled et Appaïm. Séled mourut sans avoir de fils.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן introduit une notice généalogique. En français, « Les fils de » est naturel; la conjonction initiale n’a pas besoin d’être rendue séparément.
- source_word: נָדָב
  choice: Nadab
  rationale: Nom propre, transcrit selon l’usage biblique français courant.
- source_word: סֶלֶד
  choice: Séled
  rationale: Nom propre, transcrit de manière cohérente dans ses deux occurrences.
- source_word: וְאַפָּיִם
  choice: et Appaïm
  rationale: Dans ce contexte généalogique, la forme désigne un nom de personne; elle est donc transcrite plutôt que traduite comme un nom commun.
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le wayyiqtol de מוּת rapporte l’événement suivant. Le passé simple convient au registre narratif bref et soutenu d’une généalogie.
- source_word: לֹא בָנִים
  choice: sans avoir de fils
  rationale: L’expression hébraïque elliptique signifie littéralement « pas de fils ». « Sans avoir de fils » est idiomatique en français et conserve la référence précise aux fils, plutôt que de l’élargir aux enfants.
