  yaml_path: translation/ot/1_chronicles/002/043.yaml
  text: 'The sons of Hebron: Korah[a], Tappuah, Rekem, and Shema.'
translation:
  language: fr
  text: 'Les fils d’Hébron : Koré, Tappouah, Réqem et Shama.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: בְּנֵי est le pluriel construit de « fils » et introduit ici les enfants nommés d’Hébron. La conjonction וּ n’est pas rendue séparément, conformément au style naturel d’une liste généalogique en français.
- source_word: חֶבְרוֹן
  choice: Hébron
  rationale: Nom propre rendu sous sa forme française traditionnelle et largement reconnue.
- source_word: קֹרַח
  choice: Coré
  rationale: Nom propre rendu sous sa forme française biblique traditionnelle, immédiatement reconnaissable.
- source_word: תַפֻּחַ
  choice: Tappouah
  rationale: Translittération française du nom propre; le nom n’est pas traduit par son sens lexical possible, « pomme ».
- source_word: רֶקֶם
  choice: Réqem
  rationale: Translittération qui représente le nom hébreu et distingue la consonne ק par « q ».
- source_word: שָׁמַע
  choice: Shéma
  rationale: Translittération directe de la vocalisation massorétique שָׁמַע. La variante anglaise « Shamma » ne correspond pas à la forme vocalisée du texte hébreu fourni et ne nécessite donc pas de note dans l’édition française.
theological_decisions: []
translation_notes:
  register: Formulation généalogique concise, naturelle et digne. Les noms suivent des formes françaises traditionnelles lorsqu’elles sont bien établies et une translittération lisible dans les autres cas.
