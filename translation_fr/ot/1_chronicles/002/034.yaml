source:
  edition: WLC
  text: וְ/לֹֽא הָיָ֧ה לְ/שֵׁשָׁ֛ן בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וּ/לְ/שֵׁשָׁ֛ן עֶ֥בֶד מִצְרִ֖י וּ/שְׁמ֥/וֹ יַרְחָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/034.yaml
  text: Sheshan had no sons[a], only daughters. And Sheshan had an Egyptian servant whose name was Jarha.
translation:
  language: fr
  text: Shéshân n’eut pas de fils, mais seulement des filles. Il avait un esclave[a] égyptien nommé Yarha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le mot hébreu peut désigner un serviteur ou un esclave.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיָה לְשֵׁשָׁן
  choice: Shéshân n’eut pas / Il avait
  rationale: La construction hébraïque « être à/pour quelqu’un » exprime ici la possession. Ces formulations sont naturelles en français et le pronom évite une répétition lourde du nom.
- source_word: בָּנִים
  choice: fils
  rationale: Le terme est opposé explicitement à « filles » ; il désigne donc les descendants masculins et non les enfants en général.
- source_word: כִּי אִם
  choice: mais seulement
  rationale: Après une négation, cette locution signifie « excepté / mais seulement ». La formulation retenue restitue clairement le contraste.
- source_word: בָּנוֹת
  choice: filles
  rationale: Équivalent direct, nécessaire au contraste généalogique entre fils et filles.
- source_word: עֶבֶד
  choice: esclave
  rationale: Le mot peut désigner un serviteur ou un esclave. « Esclave » préserve ici sans l’atténuer l’idée d’un statut de dépendance, tandis qu’une note signale l’autre traduction possible.
- source_word: מִצְרִי
  choice: égyptien
  rationale: L’adjectif indique l’origine ou l’appartenance nationale de l’homme.
- source_word: וּשְׁמוֹ
  choice: nommé
  rationale: Littéralement « et son nom [était] ». « Nommé » transmet la même information de façon fluide en français.
- source_word: יַרְחָע
  choice: Yarha
  rationale: Translittération française transparente du nom propre hébreu.
theological_decisions: []
