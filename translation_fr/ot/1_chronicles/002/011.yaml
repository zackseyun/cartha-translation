source:
  edition: WLC
  text: וְ/נַחְשׁוֹן֙ הוֹלִ֣יד אֶת שַׂלְמָ֔א וְ/שַׂלְמָ֖א הוֹלִ֥יד אֶת בֹּֽעַז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/011.yaml
  text: Nahshon fathered Salma[a], and Salma fathered Boaz.
translation:
  language: fr
  text: Nahshon engendra Salma[a], et Salma engendra Booz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « Salma » ; certaines traductions lisent « Salmôn » pour harmoniser ce nom avec les généalogies parallèles (par exemple Ruth 4.20-21 ; Matthieu 1.4-5).
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נַחְשׁוֹן
  choice: Nahshon
  rationale: Nom propre transcrit d’après l’hébreu ; la conjonction initiale n’a pas besoin d’être rendue en français dans ce verset pris isolément.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans une généalogie, le hifil de ילד signifie « engendrer, devenir le père de ». « Engendra » est concis, digne et courant dans le registre généalogique biblique.
- source_word: אֶת
  choice: '[non traduit]'
  rationale: Marqueur du complément d’objet direct, sans équivalent lexical autonome en français.
- source_word: שַׂלְמָא
  choice: Salma
  rationale: Cette forme reproduit directement le nom hébreu du texte massorétique, sans l’harmoniser avec les généalogies parallèles.
- source_word: וְ/שַׂלְמָא
  choice: et Salma
  rationale: La conjonction וְ est naturellement rendue par « et », et le nom conserve la forme attestée ici.
- source_word: בֹּעַז
  choice: Booz
  rationale: « Booz » est la forme française usuelle et immédiatement reconnaissable du nom hébreu בֹּעַז.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le verbe « engendra » conserve la précision généalogique tout en restant naturel dans ce contexte. La forme « Salma » suit strictement le texte hébreu de ce verset.
