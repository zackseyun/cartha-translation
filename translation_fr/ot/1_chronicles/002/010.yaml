source:
  edition: WLC
  text: וְ/רָ֖ם הוֹלִ֣יד אֶת עַמִּינָדָ֑ב וְ/עַמִּינָדָב֙ הוֹלִ֣יד אֶת נַחְשׁ֔וֹן נְשִׂ֖יא בְּנֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/010.yaml
  text: Ram fathered Amminadab[a], and Amminadab fathered Nahshon, leader of the sons of Judah.
translation:
  language: fr
  text: Ram engendra Amminadab, et Amminadab engendra Nahshon, chef[a] des fils de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prince » ou « dirigeant ».
    reason: Alternative lexicale pour נְשִׂיא, dont le sens couvre plusieurs types de responsables éminents.
lexical_decisions:
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans cette généalogie, le hifil de ילד exprime le fait, pour un homme, d’avoir un descendant direct. « Engendra » est précis, concis et courant dans le registre généalogique biblique français.
- source_word: נְשִׂיא
  choice: chef
  rationale: Le terme désigne ici un responsable reconnu au sein de la tribu. « Chef » convient au cadre tribal sans suggérer nécessairement une royauté, tandis que « prince » demeure une traduction possible.
- source_word: בְּנֵי יְהוּדָה
  choice: les fils de Juda
  rationale: Cette formulation conserve l’expression masculine et généalogique explicite de l’hébreu, ainsi que le lien entre l’ancêtre Juda et ses descendants.
- source_word: רָם / עַמִּינָדָב / נַחְשׁוֹן
  choice: Ram / Amminadab / Nahshon
  rationale: Les noms propres sont translittérés de manière claire et cohérente, sans être traduits.
