base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/053.yaml
  text: 'And the clans of Kiriath-jearim: the Ithrites[a], the Puthites, the Shumathites, and the Mishraites[b]. From these came the Zorathites and the Eshtaolites.'
translation:
  language: fr
  text: 'Et les clans[a] de Qiryath-Yéarim : les Yitrites, les Poutites, les Shoumatites et les Mishraïtes. De ceux-ci sont issus[b] les Tsoréatites et les Eshtaolites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « familles ». Le terme hébreu désigne souvent, dans les généalogies, des groupes de parenté étendus.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sont sortis ». Dans ce contexte généalogique, l’expression indique que ces groupes provenaient des clans précédemment nommés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  choice: Et voici les clans
  rationale: Dans ce contexte généalogique, מִשְׁפָּחוֹת désigne des groupes étendus de parenté plutôt que de simples familles nucléaires. « Et voici » introduit naturellement la liste en français.
- source_word: קִרְיַת יְעָרִים
  choice: Qiryath-Yéarim
  rationale: Le nom de lieu est translittéré en suivant d’assez près sa forme hébraïque, avec une graphie lisible en français.
- source_word: הַיִּתְרִי
  choice: les Yitrites
  rationale: Nom de clan translittéré à partir de la forme hébraïque.
- source_word: וְהַפּוּתִי
  choice: les Poutites
  rationale: Nom de clan translittéré selon les conventions phonétiques naturelles du français.
- source_word: וְהַשֻּׁמָתִי
  choice: les Shoumatites
  rationale: La translittération conserve la forme développée du gentilé hébreu.
- source_word: וְהַמִּשְׁרָעִי
  choice: les Mishraïtes
  rationale: Nom de clan translittéré, avec le tréma pour rendre clairement la succession des voyelles en français.
- source_word: מֵאֵלֶּה
  choice: De ceux-ci
  rationale: L’expression renvoie directement aux clans qui viennent d’être énumérés.
- source_word: יָצְאוּ
  choice: sont issus
  rationale: Le verbe signifie littéralement « sortir »; dans cette généalogie, « être issus » exprime naturellement l’origine sans préciser davantage la nature exacte du lien.
- source_word: הַצָּרְעָתִי
  choice: les Tsoréatites
  rationale: Gentilé lié à Tsoréa, translittéré sous une forme adaptée au français.
- source_word: וְהָאֶשְׁתָּאֻלִי
  choice: les Eshtaolites
  rationale: Gentilé tiré d’Eshtaol, dont la relation au nom de lieu est préservée.
