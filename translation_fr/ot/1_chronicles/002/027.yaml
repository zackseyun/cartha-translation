  yaml_path: translation/ot/1_chronicles/002/027.yaml
  text: 'The sons of Ram: Jerahmeel the firstborn[a], Maaz, Jamin, and Eker.'
translation:
  language: fr
  text: 'Les fils de Ram, premier-né de Yerahméel : Maats, Yamin et Équer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: '[rendu par les deux-points]'
  rationale: Dans cette généalogie, le verbe introduit idiomatiquement une liste. Les deux-points rendent cette fonction de façon naturelle en français sans alourdir la phrase.
- source_word: בְנֵי
  choice: les fils de
  rationale: Dans ce contexte généalogique, le terme désigne les fils mâles de Ram.
- source_word: רָם
  choice: Ram
  rationale: Transcription française usuelle du nom propre.
- source_word: בְּכוֹר
  choice: premier-né
  rationale: 'Le terme est en apposition à Ram : Ram est le premier-né de Yerahméel. Cette analyse correspond également au contexte généalogique immédiat.'
- source_word: יְרַחְמְאֵל
  choice: Yerahméel
  rationale: Transcription française qui représente le yod initial et conserve une forme lisible du nom hébreu.
- source_word: מַעַץ
  choice: Maats
  rationale: Transcription du nom propre hébreu, avec « ts » pour la consonne finale צ.
- source_word: יָמִין
  choice: Yamin
  rationale: Transcription du nom propre; le yod initial est rendu par « Y ».
- source_word: עֵקֶר
  choice: Équer
  rationale: Transcription française du nom propre hébreu, avec une graphie adaptée à la prononciation française.
theological_decisions:
- issue: Rattachement de « premier-né »
  choice: « premier-né de Yerahméel » qualifie Ram
  alternative: Faire de Yerahméel le premier fils de Ram
  rationale: La construction hébraïque se lit « les fils de Ram, premier-né de Yerahméel », et 1 Chroniques 2.25 identifie déjà Ram comme le premier-né de Yerahméel. La ponctuation de la couche anglaise consultée obscurcit ce rapport syntaxique.
translation_notes:
  register: Style généalogique sobre et actuel. Les deux-points remplacent une formulation verbale lourde tout en gardant clairement l’introduction de la liste. Les noms sont transcrits selon des conventions françaises lisibles.
