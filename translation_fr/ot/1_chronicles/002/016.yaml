base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/016.yaml
  text: 'Their sisters were Zeruiah and Abigail. The sons of Zeruiah: Abishai, Joab, and Asahel—three.'
translation:
  language: fr
  text: Leurs sœurs étaient Tserouya et Abigaïl. Les fils de Tserouya étaient Abishaï, Joab et Asaël — trois en tout.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֹתֵיהֶם
  choice: Leurs sœurs étaient
  rationale: Le nom au pluriel avec suffixe de troisième personne masculine plurielle signifie « leurs sœurs ». Le français naturel peut laisser la conjonction initiale implicite tout en conservant l’ajout généalogique.
- source_word: צְרוּיָה
  choice: Tserouya
  rationale: Translittération française usuelle et transparente du nom hébreu.
- source_word: וַאֲבִיגָיִל
  choice: et Abigaïl
  rationale: Le nom propre est rendu selon sa forme française courante, et la conjonction est conservée.
- source_word: וּבְנֵי צְרוּיָה
  choice: Les fils de Tserouya étaient
  rationale: La construction signifie littéralement « les fils de Tserouya ». L’ajout de « étaient » produit une phrase généalogique naturelle sans modifier le sens.
- source_word: אַבְשַׁי
  choice: Abishaï
  rationale: Translittération française courante du nom propre.
- source_word: וְיוֹאָב
  choice: Joab
  rationale: Forme française traditionnelle et largement reconnue; la conjonction est portée par le dernier élément de l’énumération française.
- source_word: וַעֲשָׂהאֵל
  choice: et Asaël
  rationale: Forme française courante du nom; la conjonction introduit naturellement le dernier élément de la liste.
- source_word: שְׁלֹשָׁה
  choice: trois en tout
  rationale: Le nombre récapitulatif est explicitement conservé; « en tout » rend clairement sa fonction de total en français.
