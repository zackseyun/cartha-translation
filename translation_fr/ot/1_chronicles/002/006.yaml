  text: 'And the sons of Zerah: Zimri[a], Ethan, Heman, Kalkol[b], and Dara—five in all.'
translation:
  language: fr
  text: 'Et les fils de Zérah : Zimri, Étân, Hémân, Kalkol[a] et Dara[b] — cinq en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines traductions françaises traditionnelles donnent « Calcol ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte ici « Dara » ; le passage parallèle en 1 Rois 4.31 porte « Darda ».
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי זֶרַח
  choice: Les fils de Zérah
  rationale: בְנֵי est rendu par « fils », terme précis et naturel dans une généalogie; le nom propre זֶרַח est translittéré « Zérah ». La coordination initiale ו s’inscrit dans la continuité de la liste généalogique sans qu’un « et » initial soit nécessaire en français.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Translittération française usuelle du nom propre.
- source_word: וְאֵיתָן
  choice: Étân
  rationale: Translittération adaptée au français, avec les signes diacritiques qui guident la prononciation.
- source_word: וְהֵימָן
  choice: Hémân
  rationale: Translittération française du nom propre hébreu.
- source_word: וְכַלְכֹּל
  choice: Kalkol
  rationale: Cette forme reflète directement les consonnes hébraïques כ־ל־כ־ל; la variante traditionnelle « Calcol » est signalée en note.
- source_word: וָדָרַע
  choice: Dara
  rationale: Le texte massorétique de ce vers porte דָרַע, « Dara »; le texte principal n’est donc pas harmonisé avec la forme « Darda » du passage parallèle.
- source_word: כֻּלָּם חֲמִשָּׁה
  choice: cinq en tout
  rationale: Expression française naturelle qui restitue littéralement le dénombrement de l’ensemble des fils nommés.
