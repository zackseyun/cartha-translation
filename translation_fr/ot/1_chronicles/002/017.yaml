  text: וַ/אֲבִיגַ֕יִל יָלְדָ֖ה אֶת עֲמָשָׂ֑א וַ/אֲבִ֣י עֲמָשָׂ֔א יֶ֖תֶר הַ/יִּשְׁמְעֵאלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/017.yaml
  text: Abigail bore Amasa[a], and the father of Amasa was Jether the Ishmaelite.
translation:
  language: fr
  text: Abigaïl donna naissance à Amasa, et le père d’Amasa était Yéter, l’Ismaélite[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits ainsi que le passage parallèle de 2 Samuel 17.25 portent « Yitra, l’Israélite » au lieu de « Yéter, l’Ismaélite ». Le texte massorétique porte ici « Yéter, l’Ismaélite ».
    reason: textual_variant
lexical_decisions:
- source_word: יָלְדָה
  choice: donna naissance à
  rationale: Avec un sujet féminin, le qal de ילד signifie « donner naissance à » ou « enfanter ». Cette formulation est naturelle en français moderne et exprime clairement le lien maternel.
- source_word: אֶת עֲמָשָׂא
  choice: Amasa
  rationale: אֶת marque le complément d’objet direct et ne se traduit pas séparément. Le nom propre est translittéré sous la forme française usuelle « Amasa ».
- source_word: וַאֲבִי עֲמָשָׂא
  choice: et le père d’Amasa
  rationale: Cette traduction suit directement la construction hébraïque et conserve explicitement le lien généalogique.
- source_word: יֶתֶר
  choice: Yéter
  rationale: Le nom propre est translittéré en français de manière à refléter sa prononciation hébraïque.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: l’Ismaélite
  rationale: L’hébreu comporte l’article défini ; le gentilé sert ici à identifier Yéter.
