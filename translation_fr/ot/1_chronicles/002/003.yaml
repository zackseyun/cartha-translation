base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/003.yaml
  text: 'The sons of Judah: Er[a], Onan, and Shelah; three were born to him by Bath-shua the Canaanite. Er, Judah’s firstborn, was evil in the sight of Yahweh[b], and he put him to death.'
translation:
  language: fr
  text: 'Les fils de Juda : Er, Onân et Shéla. Tous les trois naquirent de la fille de Shoua, la Cananéenne[a]. Er, le premier-né de Juda, était mauvais aux yeux de Yahweh, et il le mit à mort[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi lire « Bath-Shoua la Cananéenne », si Bath-Shoua est compris ici comme un nom propre.
    reason: alternative lexicale
  - marker: b
    text: 'Ou, en explicitant le sujet : « Yahweh le mit à mort. » En hébreu, le sujet n’est pas répété ; il renvoie très probablement à Yahweh, mentionné juste avant.'
    reason: sujet implicite
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: Les fils de Juda
  rationale: Rend directement la construction généalogique hébraïque dans un français naturel et digne.
- source_word: שְׁלוֹשָׁה נוֹלַד לוֹ
  choice: Tous trois lui naquirent
  rationale: Conserve le nombre explicitement indiqué et la tournure passive du verbe ילד, tout en restant idiomatique en français.
- source_word: מִבַּת שׁוּעַ הַכְּנַעֲנִית
  choice: de la fille de Shoua, la Cananéenne
  rationale: 'Suit l''analyse compositionnelle la plus directe du texte massorétique : בַּת, « fille », suivi de Shoua; le féminin de « la Cananéenne » qualifie cette femme.'
- source_word: בְּכוֹר יְהוּדָה
  choice: le premier-né de Juda
  rationale: Préserve la relation de construction et l'accent généalogique.
- source_word: רַע בְּעֵינֵי יְהוָה
  choice: était mauvais aux yeux de Yahweh
  rationale: Reproduit la formule hébraïque d'évaluation divine sans en atténuer la portée morale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: וַיְמִיתֵהוּ
  choice: et il le fit mourir
  rationale: La tournure factitive rend la valeur causative du hifil; le pronom conserve le sujet implicite de l'hébreu.
theological_decisions:
- issue: Sujet implicite de וַיְמִיתֵהוּ
  choice: « il le fit mourir », où « il » renvoie à Yahweh
  alternative: « Yahweh le fit mourir »
  rationale: L'hébreu n'exprime pas de nouveau sujet; le référent le plus naturel est Yahweh, nommé immédiatement auparavant. Le pronom maintient toutefois la forme et la continuité du texte source.
- issue: Forme du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription préserve le caractère de nom propre du tétragramme sans transformer celui-ci en titre.
- issue: Analyse de בַּת־שׁוּעַ
  choice: la fille de Shoua
  alternative: Bath-Shoua, comme nom propre
  rationale: Dans ce verset, la lecture compositionnelle « fille de Shoua » est grammaticalement directe, mais la compréhension de l'ensemble comme nom propre reste possible et mérite d'être signalée.
translation_notes:
  register: Français international moderne, avec une dignité adaptée à une généalogie biblique. Les noms sont transcrits de façon lisible en français; la formule « aux yeux de » garde l'image hébraïque. Les deux ambiguïtés pertinentes — Bath-Shoua comme nom possible et le sujet sous-entendu du dernier verbe — sont conservées ou signalées.
