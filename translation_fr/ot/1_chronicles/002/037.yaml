  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָבָד
  choice: Zabad
  rationale: Nom propre masculin, translittéré selon la forme française biblique usuelle.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans cette généalogie, le hiphil de ילד signifie « engendrer » ou « devenir père de ». « Engendra » est concis, digne et conserve explicitement la filiation masculine.
- source_word: אֶת
  choice: '[non traduit]'
  rationale: Marqueur de l’objet direct sans équivalent lexical autonome en français ; sa fonction est rendue par la syntaxe.
- source_word: אֶפְלָל
  choice: Eflal
  rationale: Nom propre translittéré en français ; « f » représente naturellement le son de la lettre hébraïque פ sans daguesh.
- source_word: וְ
  choice: et
  rationale: Conjonction simple reliant les deux propositions généalogiques.
- source_word: עוֹבֵד
  choice: Obed
  rationale: Nom propre translittéré plutôt que traduit ; son lien étymologique avec le service n’est pas explicité dans le corps du texte.
