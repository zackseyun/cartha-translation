  text: וְ/אֶשְׁתּ֗וֹן הוֹלִ֞יד אֶת בֵּ֤ית רָפָא֙ וְ/אֶת פָּסֵ֔חַ וְ/אֶת תְּחִנָּ֖ה אֲבִ֣י עִ֣יר נָחָ֑שׁ אֵ֖לֶּה אַנְשֵׁ֥י רֵכָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/012.yaml
  text: Eshton fathered Beth-rapha[a], Paseah, and Tehinnah, the father of Ir-nahash[b]. These were the men of Rekah.
translation:
  language: fr
  text: Eshton engendra Beth-Rapha, Paséah et Tehinna, père d’Ir-Nahash[a][b]. Ce sont les hommes de Reka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fondateur d’Ir-Nahash » ; dans les généalogies, « père de » peut désigner un ancêtre ou le fondateur d’un groupe ou d’un lieu, et pas seulement le père biologique immédiat.
    reason: lexical_alternative
  - marker: b
    text: Ir-Nahash peut signifier « ville de Nahash », mais l’expression fonctionne probablement ici comme un nom de lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans cette généalogie, le hifil de ילד exprime l’engendrement ou l’établissement d’une descendance. « Engendra » est concis, digne et usuel dans le registre généalogique biblique.
- source_word: בֵּית רָפָא
  choice: Beth-Rapha
  rationale: Le groupe est traité ici comme un nom propre, en parallèle avec les noms suivants, plutôt que traduit littéralement par « maison de Rapha ».
- source_word: פָּסֵחַ
  choice: Paséah
  rationale: Nom propre translittéré selon une forme française claire, avec indication de la succession vocalique.
- source_word: תְּחִנָּה
  choice: Tehinna
  rationale: Nom propre translittéré plutôt que traduit d’après le nom commun apparenté signifiant « supplication ».
- source_word: אֲבִי עִיר נָחָשׁ
  choice: père d’Ir-Nahash
  rationale: La formulation conserve l’expression généalogique hébraïque, qui peut désigner aussi bien une paternité qu’un rôle d’ancêtre ou de fondateur. Ir-Nahash est rendu comme un nom de lieu.
- source_word: אֵלֶּה אַנְשֵׁי רֵכָה
  choice: Ceux-ci étaient les hommes de Réka
  rationale: « Hommes de » maintient le lien formel avec אַנְשֵׁי, qui peut désigner les membres d’un groupe ou les habitants d’un lieu. L’imparfait convient au récit généalogique français.
- source_word: רֵכָה
  choice: Réka
  rationale: Nom propre ou nom de lieu translittéré sous une forme naturelle en français.
theological_decisions:
- issue: Portée du titre « père de »
  choice: Maintenir « père d’Ir-Nahash » dans le texte et signaler en note le sens possible de « fondateur »
  alternative: Traduire directement « fondateur d’Ir-Nahash »
  rationale: L’hébreu אֲבִי reste ambigu dans un contexte généalogique et peut exprimer une relation biologique, ancestrale ou fondatrice. Le texte principal préserve l’image hébraïque sans trancher.
translation_notes:
  register: Français international moderne, avec un registre généalogique sobre et digne. Les noms propres sont translittérés de façon lisible en français. L’ambiguïté d’אֲבִי est conservée dans le texte et explicitée en note.
