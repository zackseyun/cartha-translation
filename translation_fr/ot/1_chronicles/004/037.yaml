  text: וְ/זִיזָ֨א בֶן שִׁפְעִ֧י בֶן אַלּ֛וֹן בֶּן יְדָיָ֥ה בֶן שִׁמְרִ֖י בֶּן שְׁמַֽעְיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/037.yaml
  text: and Ziza son of Shiphi[a], son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah.
translation:
  language: fr
  text: et Ziza, fils de Shifi, fils d’Allon, fils de Yedaya, fils de Shimri, fils de Shemaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/זִיזָא
  choice: et Ziza
  rationale: La conjonction וְ est rendue par « et », car le verset poursuit une liste généalogique. Le nom propre est transcrit sans être traduit; « Ziza » reflète la finale en aleph du texte hébreu.
- source_word: בֶן
  choice: fils de
  rationale: Dans cette formule généalogique, « fils de » est l’équivalent français naturel et direct. Sa répétition conserve la structure de l’hébreu.
- source_word: שִׁפְעִי
  choice: Shifi
  rationale: Transcription française lisible du nom, avec « sh » pour שׁ et « f » pour פ sans daguesh.
- source_word: אַלּוֹן
  choice: Allôn
  rationale: Le mot désigne ici une personne et non l’arbre; il est donc transcrit comme nom propre. L’accent circonflexe indique la voyelle longue sans surcharger la graphie.
- source_word: יְדָיָה
  choice: Yedaya
  rationale: Transcription adaptée au français moderne, où « y » représente naturellement le yod initial et médian.
- source_word: שִׁמְרִי
  choice: Shimri
  rationale: La graphie conserve « sh » pour la consonne hébraïque שׁ et fournit une forme aisément prononçable en français.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Transcription française claire du nom hébreu, préservant le début « Shem- » et l’élément final « -ya ».
