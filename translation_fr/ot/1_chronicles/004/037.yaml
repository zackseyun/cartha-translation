translation_notes:
  register: Phrase généalogique sobre et formelle, dans un français actuel. La répétition de « fils de » est maintenue pour reproduire clairement la chaîne d’ascendance. Les noms suivent une transcription française cohérente plutôt que les conventions propres à l’anglais.
