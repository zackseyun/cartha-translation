    rationale: « Yishé » ne reproduit pas de manière sûre la forme massorétique יִשְׁעִי. « Ishi » est une translittération directe, sobre et internationalement lisible.
  - severity: low
    issue: Graphie d’Ouziel
    rationale: « Ouziel » est la graphie française courante et évite le doublement non nécessaire dans « Ouzziel ».
