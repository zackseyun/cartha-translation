base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/042.yaml
  text: And some of them[a], from the sons of Simeon, went to Mount Seir—five hundred men—with Pelatiah, Neariah, Rephaiah, and Uzziel, sons of Ishi, at their head.
translation:
  language: fr
  text: 'Certains d’entre eux, parmi les fils de Siméon, se rendirent au mont Séir : cinq cents hommes, ayant à leur tête Pelatia, Nearia, Refaïa et Ouziel, fils d’Ishi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et Pelatia, Nearia, Refaïa et Ouziel, fils d’Ishi, étaient à leur tête ». La syntaxe hébraïque permet cette formulation et indique que ces hommes dirigeaient le groupe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם מִן בְּנֵי שִׁמְעוֹן
  choice: Certains d’entre eux, parmi les fils de Siméon
  rationale: « Certains d’entre eux » rend naturellement le sens partitif de וּמֵהֶם, tandis que « parmi les fils de Siméon » conserve la formulation généalogique du chroniqueur sans la lourdeur d’une répétition de « d’entre ».
- source_word: הָלְכוּ לְהַר שֵׂעִיר
  choice: partirent pour le mont Séir
  rationale: Le verbe simple de déplacement est rendu sans ajouter de nuance militaire. « Le mont Séir » est la désignation géographique française traditionnelle et correspond directement à la construction hébraïque.
- source_word: אֲנָשִׁים חֲמֵשׁ מֵאוֹת
  choice: cinq cents hommes
  rationale: Apposition numérique directe indiquant l’effectif du groupe, sans lui attribuer explicitement le caractère d’une armée.
- source_word: וּפְלַטְיָה וּנְעַרְיָה וּרְפָיָה וְעֻזִּיאֵל
  choice: Pelatia, Nearia, Refaïa et Ouzziel
  rationale: Translittérations françaises lisibles, proches des formes massorétiques et adaptées aux conventions phonétiques du français.
- source_word: בְּנֵי יִשְׁעִי
  choice: fils de Yishé
  rationale: Conserve l’identification généalogique des quatre hommes. « Yishé » distingue la consonne initiale de celle du nom traditionnellement rendu « Isaï », tout en restant prononçable en français.
- source_word: בְּרֹאשָׁם
  choice: ayant à leur tête
  rationale: Rend l’image idiomatique hébraïque et indique naturellement que les quatre hommes nommés conduisaient le groupe.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La structure généalogique « fils de Siméon » est conservée, tandis que l’ordre de la dernière proposition est légèrement réorganisé pour rendre clairement et naturellement en français la fonction dirigeante des quatre fils de Yishé.
