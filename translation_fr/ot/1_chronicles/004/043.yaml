  text: וַ/יַּכּ֕וּ אֶת שְׁאֵרִ֥ית הַ/פְּלֵטָ֖ה לַ/עֲמָלֵ֑ק וַ/יֵּ֣שְׁבוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/043.yaml
  text: And they struck down the remnant of the survivors of Amalek[b][a], and they lived there to this day.
translation:
  language: fr
  text: Ils abattirent ce qui restait des rescapés d’Amalec[a], puis ils s’établirent là jusqu’à ce jour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « le reste des Amalécites qui avaient échappé ». L’hébreu associe deux termes de sens voisin pour désigner ceux qui subsistaient après une dévastation.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils y habitèrent jusqu’à ce jour ». Le verbe peut exprimer le fait d’habiter un lieu ou de s’y établir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: ils abattirent
  rationale: Le verbe נכה décrit ici une action militaire dirigée contre les derniers survivants. « Abattirent » exprime l’issue vraisemblablement mortelle sans développer le texte en « exterminèrent ».
- source_word: שְׁאֵרִית הַפְּלֵטָה
  choice: ce qui restait des rescapés
  rationale: 'Cette formulation conserve les deux notions étroitement liées de l’hébreu : le reste et ceux qui ont échappé à une destruction antérieure.'
- source_word: לַעֲמָלֵק
  choice: d’Amalec
  rationale: Le nom propre désigne ici le peuple associé à Amalec. La tournure reste proche de l’hébreu tout en étant naturelle en français.
- source_word: וַיֵּשְׁבוּ
  choice: ils s’établirent
  rationale: ישב peut signifier habiter, demeurer ou s’établir. Dans ce contexte de prise de possession d’un territoire, « s’établirent » convient naturellement.
- source_word: שָׁם
  choice: là
  rationale: Adverbe de lieu renvoyant au territoire mentionné dans le contexte précédent.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Expression française consacrée qui correspond directement à la formule temporelle hébraïque.
