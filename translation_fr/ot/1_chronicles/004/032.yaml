base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/032.yaml
  text: And their settlements were Etam[a], Ain, Rimmon, Tochen, and Ashan—five cities.
translation:
  language: fr
  text: 'Leurs localités[a] étaient Étam, Aïn, Rimmôn, Tokhen et Ashân : cinq villes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « villages ». Le terme hébreu peut désigner de petites agglomérations ou des habitations encloses.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: leurs localités
  rationale: Le nom חָצֵר peut désigner un village, une petite agglomération ou un lieu habité délimité. « Localités » convient naturellement à cette liste géographique et garde une portée assez large.
- source_word: עֵיטָם
  choice: Étam
  rationale: Nom de lieu, translittéré selon les conventions françaises usuelles.
- source_word: עַיִן
  choice: Aïn
  rationale: Dans cette énumération de lieux, le mot est compris comme un toponyme, et non dans son sens courant d’« œil » ou de « source ».
- source_word: רִמּוֹן
  choice: Rimmôn
  rationale: Nom de lieu translittéré ; le sens lexical possible de « grenade » n’est pas traduit ici.
- source_word: תֹכֶן
  choice: Token
  rationale: Nom de lieu translittéré directement d’après la forme hébraïque.
- source_word: עָשָׁן
  choice: Ashân
  rationale: Nom de lieu translittéré selon les conventions françaises.
- source_word: עָרִים חָמֵשׁ
  choice: cinq villes
  rationale: עִיר désigne couramment une ville ou une agglomération. « Cinq villes » conserve le sens lexical traditionnel et résume les cinq lieux énumérés.
