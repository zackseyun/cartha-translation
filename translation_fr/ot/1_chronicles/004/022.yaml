  yaml_path: translation/ot/1_chronicles/004/022.yaml
  text: and Jokim[a], and the men of Cozeba, and Joash, and Saraph, who ruled in Moab and returned to Lehem[c][b]. These records are ancient.
translation:
  language: fr
  text: ainsi que Yoqim, les hommes de Kozéba, Joas et Saraph, qui devinrent maîtres de Moab[a], et Yashoubi-Léhem[b]. Ces faits sont anciens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « possédèrent Moab », « exercèrent leur autorité sur Moab » ou, peut-être, « épousèrent des Moabites ». L’expression hébraïque est concise et son sens incertain.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu incertain. On peut aussi comprendre : « et ils retournèrent à Léhem », voire « à Bethléem ».'
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « et les paroles — ou les affaires — sont anciennes »; on peut aussi comprendre : « ces choses remontent aux temps anciens ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹקִים
  choice: Yoqim
  rationale: Nom propre transcrit au plus près de l’hébreu, avec « Y » pour le yod initial et « q » pour le qof.
- source_word: אַנְשֵׁי כֹזֵבָא
  choice: les hommes de Kozéba
  rationale: Le pluriel construit אַנְשֵׁי désigne littéralement les « hommes de »; כֹזֵבָא est traité comme un nom de lieu.
- source_word: יוֹאָשׁ
  choice: Joas
  rationale: Forme française courante du nom propre hébreu.
- source_word: שָׂרָף
  choice: Saraph
  rationale: Dans ce contexte généalogique, le terme est compris comme un nom de personne et non traduit selon son sens commun possible.
- source_word: אֲשֶׁר בָּעֲלוּ לְמוֹאָב
  choice: qui devinrent maîtres en Moab
  rationale: Cette formulation garde l’idée fondamentale de בעל, « être maître, posséder, exercer une autorité », tout en restant naturelle en français. La tournure hébraïque étant obscure, d’autres interprétations sont signalées en note.
- source_word: יָשֻׁבִי לָחֶם
  choice: Yashoubi-Léhem
  rationale: La vocalisation massorétique se prête à la lecture d’un nom propre composé. Cette option évite de transformer silencieusement une forme difficile en proposition verbale; l’autre analyse est donnée en note.
- source_word: הַדְּבָרִים עַתִּיקִים
  choice: Ces faits sont anciens
  rationale: דְּבָרִים peut désigner des paroles, des faits ou des affaires. « Ces faits » conserve ici une portée générale sans introduire explicitement la notion de documents absente du texte.
