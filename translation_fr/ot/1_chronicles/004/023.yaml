  yaml_path: translation/ot/1_chronicles/004/023.yaml
  text: These were the potters and the inhabitants of Netaim and Gederah[a]; they lived there with the king for his work.
translation:
  language: fr
  text: C’étaient les potiers et les habitants de Netaïm et de Guedéra[a]. Ils habitaient là avec le roi pour son travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « C’étaient les potiers et ceux qui habitaient parmi des plantations et des enclos. » Les termes hébreux Netaïm et Guedéra peuvent être compris soit comme des noms de lieux, soit comme des noms communs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: C’étaient
  rationale: Le pronom démonstratif renvoie au groupe mentionné auparavant; la copule et l’imparfait sont naturellement ajoutés en français dans cette proposition nominale.
- source_word: הַיּוֹצְרִים
  choice: les potiers
  rationale: Le participe issu de יצר désigne ici très probablement des artisans qui façonnent l’argile; « potiers » est le sens contextuel le plus précis.
- source_word: וְיֹשְׁבֵי
  choice: et les habitants de
  rationale: Le participe construit de ישב désigne des résidents établis; cette formulation française en conserve la valeur nominale.
- source_word: נְטָעִים
  choice: Netaïm
  rationale: Dans ce contexte généalogique et géographique, le terme est vraisemblablement un nom de lieu, tout en pouvant aussi signifier « plantations »; cette possibilité est signalée en note.
- source_word: וּגְדֵרָה
  choice: et de Guedéra
  rationale: Le terme est vraisemblablement le nom de lieu Guedéra, coordonné à Netaïm; son sens commun de « clôture » ou « enceinte » demeure possible et figure en note.
- source_word: עִם הַמֶּלֶךְ
  choice: avec le roi
  rationale: La traduction directe de עִם préserve l’association avec le roi sans préciser indûment s’il s’agit de proximité, d’attachement ou de service royal.
- source_word: בִּמְלַאכְתּוֹ
  choice: pour accomplir son travail
  rationale: מְלָאכָה peut désigner le travail, la tâche ou le service. Cette formulation indique que leur activité était celle du roi sans réduire le terme à une fonction institutionnelle précise.
- source_word: יָשְׁבוּ שָׁם
  choice: Ils habitaient là
  rationale: Le verbe ישב avec שָׁם exprime ici la résidence; « habitaient là » est naturel, actuel et légèrement plus soutenu que « vivaient là ».
