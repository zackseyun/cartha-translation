  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בִ/בְתוּאֵל
  choice: à Betouel
  rationale: La préposition ב indique ici le lieu où les membres du groupe habitaient. Le ו relie ce nom à la liste commencée au verset précédent; en français, cette coordination peut rester implicite avant les premiers éléments de l’énumération. בְתוּאֵל est transcrit comme un nom de lieu.
- source_word: וּ/בְ/חָרְמָה
  choice: à Horma
  rationale: La préposition ב est rendue par « à », tournure française naturelle devant un nom de ville. חָרְמָה est transcrit comme un toponyme. La coordination hébraïque répétée est exprimée selon l’usage français de l’énumération.
- source_word: וּ/בְ/צִיקְלָג
  choice: et à Tsiklag
  rationale: Le ו final est rendu explicitement par « et », conformément à la syntaxe française d’une énumération. La préposition ב devient « à » et צִיקְלָג est transcrit « Tsiklag ».
