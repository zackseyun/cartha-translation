  yaml_path: translation/ot/1_chronicles/004/029.yaml
  text: and in Bilhah[a], and in Ezem, and in Tolad.
translation:
  language: fr
  text: à Bilha[a], à Ézem et à Tolad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans Bilha, dans Ézem et dans Tolad ». La préposition hébraïque ב peut recevoir l’une ou l’autre traduction dans une liste de localités.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בִלְהָה
  choice: à Bilha
  rationale: Dans cette liste de localités, la préposition בְּ indique le lieu. En français, « à » est la tournure naturelle devant un nom de ville ou de localité. Le nom propre est translittéré « Bilha ».
- source_word: וּ/בְ/עֶצֶם
  choice: à Ézem
  rationale: La construction וּבְ־ poursuit l'énumération des lieux habités. La préposition est naturellement rendue par « à », et le toponyme est translittéré « Ézem ».
- source_word: וּ/בְ/תוֹלָד
  choice: et à Tolad
  rationale: La même construction clôt la série. Le ו conjonctif est rendu par « et », conformément à l'usage français dans une énumération, et בְּ par « à ».
theological_decisions: []
translation_notes:
  register: Formulation concise et naturelle en français moderne. Les conjonctions hébraïques répétées ne sont pas toutes reproduites, puisque le français coordonne normalement seulement le dernier élément d’une telle énumération. Les accents de « Bilha » et « Ézem » suivent une translittération lisible en français.
