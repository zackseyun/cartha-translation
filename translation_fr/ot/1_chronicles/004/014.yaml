  text: וּ/מְעוֹנֹתַ֖י הוֹלִ֣יד אֶת עָפְרָ֑ה וּ/שְׂרָיָ֗ה הוֹלִ֤יד אֶת יוֹאָב֙ אֲבִי֙ גֵּ֣יא חֲרָשִׁ֔ים כִּ֥י חֲרָשִׁ֖ים הָיֽוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/014.yaml
  text: Meonothai fathered Ophrah[a], and Seraiah fathered Joab, the father of Ge-harashim[b], for they were craftsmen.
translation:
  language: fr
  text: Méonotaï eut pour fils Ophra, et Seraya eut pour fils Joab, le père[a] de Gué-Harashim[b], car ils étaient artisans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le fondateur de Gué-Harashim ». Dans les généalogies, l’expression « père de » peut désigner un fondateur ou un chef ancestral.
    reason: alternative_reading
  - marker: b
    text: Gué-Harashim signifie probablement « vallée des artisans ». L’hébreu le présente comme un nom de lieu, puis en explique le nom dans la proposition suivante.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעוֹנֹתַי
  choice: Méonotaï
  rationale: Nom propre transcrit sous une forme naturelle en français, avec le tréma signalant la séparation vocalique finale.
- source_word: הוֹלִיד
  choice: eut pour fils
  rationale: Dans cette notice généalogique, le hiphil de ילד exprime la filiation. Cette tournure est claire et actuelle, sans l’archaïsme de « begat/engendra » dans l’usage courant.
- source_word: עָפְרָה
  choice: Ophra
  rationale: Transcription française usuelle du nom propre, sans ajouter de précision sur son statut personnel ou géographique.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Transcription française lisible du nom propre hébreu.
- source_word: יוֹאָב
  choice: Joab
  rationale: Forme française traditionnelle et largement reconnue du nom.
- source_word: אֲבִי
  choice: le père de
  rationale: Conserve l’expression hébraïque, tout en signalant en note qu’elle peut désigner ici un fondateur ou un chef ancestral.
- source_word: גֵּיא חֲרָשִׁים
  choice: Gué-Harashim
  rationale: Le groupe fonctionne comme un nom de lieu. La transcription préserve cette fonction, tandis qu’une note en donne le sens probable.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français l’explication du nom du lieu.
- source_word: חֲרָשִׁים
  choice: artisans
  rationale: Terme assez large pour désigner des travailleurs qualifiés sans restreindre indûment le sens aux forgerons.
- source_word: הָיוּ
  choice: ils étaient
  rationale: Rend simplement la proposition nominale et maintient le pluriel collectif, dont le référent reste implicite dans l’hébreu.
theological_decisions:
- issue: Portée de l’expression « père de » appliquée à un lieu ou à sa population
  choice: Maintien de « le père de » dans le texte
  alternative: « le fondateur de » ou « l’ancêtre des habitants de »
  rationale: L’hébreu permet une relation de fondation ou de chefferie ancestrale, mais ne la précise pas explicitement. Le texte conserve donc l’image originale et la note présente l’autre compréhension possible.
translation_notes:
  register: Français international moderne, clair et digne. Les noms propres sont transcrits selon les habitudes françaises. La formulation conserve l’ambiguïté généalogique de « père de » et le caractère toponymique de Gué-Harashim.
