  yaml_path: translation/ot/1_chronicles/004/028.yaml
  text: They lived in Beer-sheba[a], Moladah[b], and Hazar-shual.
translation:
  language: fr
  text: Ils habitaient à Beer-Shéba, à Molada et à Hatsar-Shoual.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Ils habitaient
  rationale: Le verbe ישׁב au wayyiqtol pluriel exprime ici le fait de résider dans les localités énumérées. « Ils habitaient » est naturel en français moderne et n’ajoute pas l’idée d’une installation initiale.
- source_word: בִּבְאֵר שֶׁבַע
  choice: à Beer-Shéba
  rationale: Nom de lieu translittéré selon une forme française courante; la préposition ב est rendue par « à » devant une ville.
- source_word: וּמוֹלָדָה
  choice: à Molada
  rationale: Nom propre de lieu translittéré; la préposition « à », sous-entendue dans la coordination hébraïque, est répétée pour rendre l’énumération naturelle et claire en français.
- source_word: וַחֲצַר שׁוּעָל
  choice: à Hatsar-Shoual
  rationale: Nom propre composé translittéré d’après le texte hébreu; « Hatsar » représente חֲצַר et « Shoual » שׁוּעָל dans une graphie lisible en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Les noms de lieux sont translittérés plutôt que traduits; aucune note n’est nécessaire, car les variantes de graphie anglaises ne concernent pas directement le lectorat français.
