  text: וּ/בְ/בֵ֤ית מַרְכָּבוֹת֙ וּ/בַ/חֲצַ֣ר סוּסִ֔ים וּ/בְ/בֵ֥ית בִּרְאִ֖י וּֽ/בְ/שַׁעֲרָ֑יִם אֵ֥לֶּה עָרֵי/הֶ֖ם עַד מְלֹ֥ךְ דָּוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/031.yaml
  text: and in Beth-marcaboth[a], and in Hazar-susim, and in Beth-biri, and in Shaaraim[d][c][b]. These were their cities until David reigned.
translation:
  language: fr
  text: Et à Beth-Markaboth[a], à Hatsar-Sousim[b], à Beth-Biri[c] et à Shaaraïm[d]. Ce furent leurs villes jusqu’à ce que David règne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beth-Markaboth signifie littéralement « maison des chars », mais l’expression est ici traitée comme un nom de lieu.
    reason: lexical_alternative
  - marker: b
    text: Hatsar-Sousim peut signifier « cour des chevaux » ou « village des chevaux », mais l’expression est ici traitée comme un nom de lieu.
    reason: lexical_alternative
  - marker: c
    text: Beth-Biri peut aussi être transcrit « Beth-Bireï ».
    reason: alternative_reading
  - marker: d
    text: Shaaraïm pourrait avoir le sens étymologique de « deux portes », mais le terme est ici traité comme un nom de lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בֵית מַרְכָּבוֹת
  choice: à Beth-Markaboth
  rationale: Le contexte énumère des localités; le toponyme est donc translittéré plutôt que traduit. La forme française emploie « k » pour rendre le son consonantique de כּ.
- source_word: וּ/בַ/חֲצַר סוּסִים
  choice: à Hatsar-Sousim
  rationale: Le nom de lieu est conservé par translittération. « Hatsar » et « Sousim » donnent en français une indication naturelle de la prononciation hébraïque.
- source_word: וּ/בְ/בֵית בִּרְאִי
  choice: à Beth-Biri
  rationale: La construction parallèle et la liste de villes indiquent un toponyme. La vocalisation massorétique est représentée par « Biri », tandis qu’une variante de translittération est signalée en note.
- source_word: וּֽ/בְ/שַׁעֲרָיִם
  choice: à Shaaraïm
  rationale: Le terme est traité comme un nom de lieu; le tréma aide le lecteur francophone à distinguer les voyelles finales.
- source_word: אֵלֶּה עָרֵיהֶם
  choice: Telles furent leurs villes
  rationale: Cette formulation française reprend naturellement le démonstratif récapitulatif et le nom « villes », sans ajouter un verbe absent mais sous-entendu au-delà de ce qu’exige la syntaxe française.
- source_word: עַד מְלֹךְ דָּוִיד
  choice: jusqu’au règne de David
  rationale: L’infinitif construit exprime ici une limite temporelle. « Jusqu’au règne de David » reste concis et préserve l’ambiguïté entre l’avènement de David et la période où il régna.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et lisible. Les quatre toponymes sont translittérés selon des conventions adaptées au lectorat francophone; les conjonctions hébraïques répétées sont rendues naturellement par une série française, avec « et » avant le dernier élément.
