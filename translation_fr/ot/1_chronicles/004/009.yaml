  text: וַ/יְהִ֣י יַעְבֵּ֔ץ נִכְבָּ֖ד מֵ/אֶחָ֑י/ו וְ/אִמּ֗/וֹ קָרְאָ֨ה שְׁמ֤/וֹ יַעְבֵּץ֙ לֵ/אמֹ֔ר כִּ֥י יָלַ֖דְתִּי בְּ/עֹֽצֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/009.yaml
  text: Jabez was more honored than his brothers[a], and his mother called his name Jabez, saying[b], “Because I bore him in pain.”
translation:
  language: fr
  text: 'Yabets était plus honoré que ses frères, et sa mère l’avait appelé Yabets[a] en disant : « Parce que je l’ai mis au monde dans la douleur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Yabets rappelle en hébreu le mot traduit par « douleur » dans l’explication donnée par sa mère.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le chagrin ». Le mot hébreu peut désigner la douleur, le chagrin ou la peine.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: était
  rationale: La forme narrative avec היה introduit ici un état. Le simple imparfait français est naturel et n’ajoute pas de marqueur temporel absent de l’hébreu.
- source_word: יַעְבֵּץ
  choice: Yabets
  rationale: Transcription française usuelle du nom hébreu, répétée afin de conserver le lien avec l’explication donnée par la mère.
- source_word: נִכְבָּד מֵאֶחָיו
  choice: plus honoré que ses frères
  rationale: נכבד exprime le fait d’être tenu en honneur, et מן porte ici la comparaison. Cette formulation préserve directement les deux éléments.
- source_word: וְאִמּוֹ קָרְאָה שְׁמוֹ
  choice: et sa mère l’avait appelé
  rationale: Le français idiomatique rend la formule hébraïque « appeler son nom » par « appeler ». Le plus-que-parfait situe naturellement l’attribution du nom avant l’état évoqué dans le récit.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Formule introductive courante, rendue de manière naturelle sans effacer l’acte de parole.
- source_word: כִּי
  choice: Parce que
  rationale: La conjonction introduit l’explication causale du nom.
- source_word: יָלַדְתִּי
  choice: je l’ai mis au monde
  rationale: Expression française actuelle et digne pour l’acte d’enfanter; le pronom objet est fourni par le contexte.
- source_word: בְּעֹצֶב
  choice: dans la douleur
  rationale: עֹצֶב peut désigner douleur, chagrin ou peine. Dans le contexte de l’accouchement, « douleur » convient au premier plan tout en laissant une note signaler l’étendue sémantique.
