lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Et les fils de
  rationale: Le waw assure ici une simple liaison dans la généalogie, rendue par « Et ». Le pluriel construit בְנֵי est conservé par « les fils de », formule généalogique qui peut aussi désigner plus largement des descendants.
- source_word: חֶלְאָה
  choice: Hélea
  rationale: Nom propre translittéré selon une forme française qui distingue les voyelles indiquées par la vocalisation massorétique.
- source_word: צֶרֶת
  choice: Tséreth
  rationale: Translittération française du nom propre צֶרֶת, avec « Ts » pour tsadé et « th » conventionnel pour le tav final.
- source_word: יצחר
  choice: Yitsehar
  rationale: Le texte consonantique du WLC porte יצחר, rendu sans correction conjecturale par une translittération française proche de sa forme écrite.
- source_word: וְ/אֶתְנָן
  choice: et Ethnan
  rationale: Le waw coordonne le dernier nom de la série; אֶתְנָן est translittéré « Ethnan ».
