  yaml_path: translation/ot/1_chronicles/004/007.yaml
  text: 'And the sons of Helah: Zereth[a], Izhar[b], and Ethnan.'
translation:
  language: fr
  text: 'Et les fils[a] de Héla : Tséreth, Yitskhar et Ethnan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans une généalogie, l’expression « fils de » peut aussi désigner plus largement des descendants ou les membres d’une lignée.
