  text: וְ/ק֣וֹץ הוֹלִ֔יד אֶת עָנ֖וּב וְ/אֶת הַ/צֹּבֵבָ֑ה וּ/מִשְׁפְּח֥וֹת אֲחַרְחֵ֖ל בֶּן הָרֽוּם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/008.yaml
  text: Koz fathered Anub[a], Hazzobebah[b], and the families of Aharhel son of Harum.
translation:
  language: fr
  text: Kots engendra Anoub, Hatsobéba[a], ainsi que les familles[b] d’Aharhel, fils de Haroum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tsobéba », si l’article préfixé n’est pas conservé dans la transcription du nom.
    reason: lexical_alternative
  - marker: b
    text: On peut aussi traduire « clans » dans ce contexte généalogique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹץ
  choice: Kots
  rationale: Nom propre transcrit selon une forme claire en français moderne; l’absence d’article dans l’hébreu ne justifie pas « Hakots ».
- source_word: הוֹלִ֔יד
  choice: engendra
  rationale: Dans cette généalogie, le hiphil de ילד exprime l’engendrement ou la filiation; « engendra » est concis, digne et idiomatique dans une liste généalogique.
- source_word: עָנ֖וּב
  choice: Anoub
  rationale: Transcription française du nom propre hébreu, avec « ou » pour la voyelle longue.
- source_word: הַ/צֹּבֵבָ֑ה
  choice: Hatsobéba
  rationale: La transcription conserve le h provenant de l’article préfixé et rend צ par « ts »; « Tsobéba » reste possible si l’article n’est pas intégré au nom.
- source_word: וּ/מִשְׁפְּח֥וֹת
  choice: ainsi que les familles
  rationale: Dans ce contexte généalogique, le terme désigne des groupes familiaux; « familles » est immédiatement compréhensible, tandis que « clans » demeure une traduction possible.
- source_word: אֲחַרְחֵ֖ל
  choice: Aharhel
  rationale: Transcription directe du nom propre, en conservant les deux consonnes gutturales sous une forme lisible en français.
- source_word: בֶּן
  choice: fils de
  rationale: Formule généalogique française habituelle correspondant directement à l’hébreu.
- source_word: הָרֽוּם
  choice: Haroum
  rationale: Transcription française conforme à la vocalisation massorétique; « Haroum » rend la voyelle ou de l’hébreu.
