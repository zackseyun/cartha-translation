  text: וַ/יִּקְרָ֣א יַ֠עְבֵּץ לֵ/אלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אִם בָּרֵ֨ךְ תְּבָרֲכֵ֜/נִי וְ/הִרְבִּ֤יתָ אֶת גְּבוּלִ/י֙ וְ/הָיְתָ֤ה יָדְ/ךָ֙ עִמִּ֔/י וְ/עָשִׂ֥יתָ מֵּ/רָעָ֖ה לְ/בִלְתִּ֣י עָצְבִּ֑/י וַ/יָּבֵ֥א אֱלֹהִ֖ים אֵ֥ת אֲשֶׁר שָׁאָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/010.yaml
  text: And Jabez called on the God of Israel[a], saying, “If you would indeed bless me and enlarge my territory, and let your hand be with me[b], and keep me from harm so that I may not suffer pain!” And God granted what he asked.
translation:
  language: fr
  text: 'Yabets invoqua le Dieu d’Israël en disant : « Ah ! si tu me bénissais vraiment, si tu agrandissais mon territoire, si ta main était avec moi et si tu me préservais du malheur[a], afin que je ne connaisse pas la douleur[b] ! » Et Dieu lui accorda ce qu’il avait demandé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du mal ». Le mot hébreu peut désigner aussi bien le mal moral qu’un malheur ou une calamité ; le contexte favorise ici l’idée d’un malheur causant de la douleur.
    reason: lexical_alternative
  - marker: b
    text: Cette formulation fait écho à l’explication du nom de Yabets au verset précédent, où son nom est associé à la douleur.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: invoqua
  rationale: Dans le contexte d’une prière adressée à Dieu, le verbe exprime un appel religieux ou une supplication, et non le simple fait d’appeler.
- source_word: אִם בָּרֵךְ תְּבָרֲכֵנִי
  choice: Ah ! si tu me bénissais vraiment
  rationale: La particule אִם introduit ici un souhait ardent, tandis que l’infinitif absolu associé au verbe conjugué renforce la demande. Cette tournure française conserve à la fois la forme conditionnelle et l’intensité.
- source_word: וְהִרְבִּיתָ אֶת גְּבוּלִי
  choice: si tu agrandissais mon territoire
  rationale: גְּבוּל peut désigner une frontière, des limites ou le territoire qu’elles délimitent. « Territoire » convient ici sans transformer la demande en métaphore abstraite.
- source_word: וְהָיְתָה יָדְךָ עִמִּי
  choice: si ta main était avec moi
  rationale: L’image hébraïque de la main de Dieu exprime sa puissance et son aide. Elle reste claire en français et mérite d’être conservée.
- source_word: וְעָשִׂיתָ מֵּרָעָה
  choice: si tu me préservais du malheur
  rationale: La formulation hébraïque est condensée et רָעָה peut désigner le mal moral ou une calamité. La mention immédiate de la douleur favorise ici le sens de malheur ou de dommage.
- source_word: לְבִלְתִּי עָצְבִּי
  choice: afin que je ne connaisse pas la douleur
  rationale: Cette traduction exprime naturellement l’idée de ne pas subir la douleur et maintient l’écho avec l’explication du nom de Yabets au verset précédent.
- source_word: וַיָּבֵא אֱלֹהִים אֵת אֲשֶׁר שָׁאָל
  choice: Et Dieu lui accorda ce qu’il avait demandé
  rationale: L’expression signifie que Dieu fit aboutir la requête. « Accorder » rend cet idiome de manière naturelle et précise.
theological_decisions:
- issue: Nature de la demande d’élargissement du גְּבוּל
  choice: La demande est rendue concrètement par « agrandir mon territoire ».
  alternative: Élargir mon champ d’action ou ma sphère d’influence.
  rationale: Le mot hébreu désigne le plus naturellement des limites territoriales. La traduction n’impose ni une lecture métaphorique ni une application liée à une théologie moderne de la prospérité.
- issue: Sens de רָעָה dans la prière
  choice: Le texte principal porte « malheur ».
  alternative: Mal.
  rationale: Le contexte de douleur favorise l’idée d’adversité ou de dommage, mais la note conserve l’autre valeur lexicale possible et l’ambiguïté théologique du terme.
- issue: Forme inachevée de la demande introduite par אִם
  choice: 'La prière est rendue comme un souhait ardent : « Ah ! si… ! »'
  alternative: 'Une condition littérale : « Si tu me bénis vraiment… »'
  rationale: L’hébreu ne formule pas explicitement de conséquence. La tournure optative française préserve cette suspension rhétorique sans ajouter une promesse ou un vœu absent du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Yabets » suit une translittération française courante. La répétition de « si » restitue la progression insistante de la prière, tandis que « Ah ! » signale sa valeur de souhait plutôt qu’une condition ordinaire.
