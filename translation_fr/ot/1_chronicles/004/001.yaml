  text: בְּנֵ֖י יְהוּדָ֑ה פֶּ֧רֶץ חֶצְר֛וֹן וְ/כַרְמִ֖י וְ/ח֥וּר וְ/שׁוֹבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/001.yaml
  text: 'The sons of Judah: Perez[a], Hezron, Carmi, Hur, and Shobal.'
translation:
  language: fr
  text: 'Les fils[a] de Juda : Pérets, Hetsron, Karmi, Hour et Shobal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, l’expression « fils de » peut désigner des fils directs ou, plus largement, des descendants.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le pluriel construit de בֵּן signifie littéralement « les fils de ». Dans une généalogie, l’expression peut aussi désigner plus largement des descendants; cette souplesse est signalée en note.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom de l’ancêtre et de la tribu.
- source_word: פֶּרֶץ
  choice: Pérets
  rationale: Transcription française moderne du nom hébreu, qui rend la consonne finale צ par « ts ».
- source_word: חֶצְרוֹן
  choice: Hetsron
  rationale: Transcription française moderne du nom hébreu.
- source_word: כַרְמִי
  choice: Karmi
  rationale: Transcription proche de l’hébreu, avec « K » pour כ.
- source_word: חוּר
  choice: Hour
  rationale: Transcription française permettant de représenter la voyelle longue ou de l’hébreu.
- source_word: שׁוֹבָל
  choice: Shobal
  rationale: Transcription française claire et courante du nom hébreu.
- source_word: וְ
  choice: virgules, puis « et » avant le dernier nom
  rationale: La répétition de la conjonction hébraïque structure une liste simple; la ponctuation française et un seul « et » final en rendent naturellement la fonction.
theological_decisions:
- issue: Portée généalogique de « fils »
  choice: Conserver « fils » dans le texte et préciser en note sa portée possible.
  alternative: Traduire directement par « descendants ».
  rationale: Le mot hébreu dit formellement « fils », mais son emploi généalogique peut englober des descendants plus éloignés. La traduction conserve donc la formulation du texte sans masquer sa souplesse.
translation_notes:
  register: Formulation généalogique concise, digne et naturelle en français moderne. Les noms sont transcrits au plus près de l’hébreu selon des conventions françaises cohérentes.
