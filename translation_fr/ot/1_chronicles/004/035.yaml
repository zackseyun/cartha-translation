lexical_decisions:
- source_word: וְ
  choice: et
  rationale: La conjonction préfixée relie Joël à la liste précédente. En français, la ponctuation suffit après ce premier nom, tandis que le second « et » est conservé pour marquer le dernier élément de la série.
- source_word: יוֹאֵל
  choice: Joël
  rationale: Nom propre rendu selon sa forme française biblique courante.
- source_word: וְיֵהוּא
  choice: et Jéhu
  rationale: La conjonction est exprimée, et le nom propre reçoit sa forme française biblique traditionnelle.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette formule généalogique répétée, « fils de » rend directement le sens ordinaire, tout en laissant une note signaler que le terme hébreu peut parfois désigner un descendant plus éloigné.
- source_word: יֹשִׁבְיָה
  choice: Joshibia
  rationale: Translittération française lisible du nom propre hébreu, proche de ses formes bibliques françaises usuelles.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Forme française moderne qui représente clairement le nom hébreu.
- source_word: עֲשִׂיאֵל
  choice: Asiel
  rationale: Translittération française concise et naturelle du nom propre.
