source:
  edition: WLC
  text: וּ/בְנֵי֙ אֵ֣שֶׁת הֽוֹדִיָּ֔ה אֲח֣וֹת נַ֔חַם אֲבִ֥י קְעִילָ֖ה הַ/גַּרְמִ֑י וְ/אֶשְׁתְּמֹ֖עַ הַ/מַּעֲכָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/019.yaml
  text: And the sons of the wife of Hodiah[a], the sister of Naham[b], were the father of Keilah the Garmite and Eshtemoa the Maacathite.
translation:
  language: fr
  text: 'Les fils de la femme de Hodija, sœur de Naham : le père[a][b] de Keïla le Garmite et d’Eshtemoa le Maacathite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les généalogies, le mot hébreu rendu par « père » peut aussi désigner un ancêtre, un fondateur ou un chef de clan, et pas seulement le père biologique immédiat.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit d’abord « les fils », puis emploie le singulier « le père ». Cette formulation condensée peut résumer une relation entre clans plutôt qu’une simple succession de père en fils.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Le sens premier est « fils de ». Dans une généalogie, le mot peut aussi désigner plus largement des descendants, mais il convient de conserver ici la formulation directe de l’hébreu.
- source_word: אֵשֶׁת הוֹדִיָּה
  choice: la femme de Hodia
  rationale: La construction hébraïque exprime la relation conjugale. « Femme de » est naturel en français et n’impose aucune précision absente du texte.
- source_word: אֲחוֹת נַחַם
  choice: sœur de Naham
  rationale: Cette apposition précise l’identité de la femme de Hodia et suit clairement la structure du texte source.
- source_word: אֲבִי
  choice: le père de
  rationale: Le singulier hébreu est conservé malgré son rapport difficile avec « les fils ». Dans les généalogies, « père » peut aussi désigner un ancêtre, un fondateur ou un chef de clan.
- source_word: קְעִילָה
  choice: Quéila
  rationale: Le nom propre est translittéré sans décider s’il désigne ici une personne, un clan ou une localité personnifiée.
- source_word: הַגַּרְמִי
  choice: le Garmite
  rationale: L’adjectif gentilice ou clanique est rendu par une forme française correspondante, sans le paraphraser comme « descendant de Garm ».
- source_word: וְאֶשְׁתְּמֹעַ
  choice: et Eshtemoa
  rationale: Le nom propre est translittéré et coordonné à Quéila comme dans l’hébreu.
- source_word: הַמַּעֲכָתִי
  choice: le Maacatite
  rationale: Cette forme conserve la désignation ethnique ou clanique de l’hébreu sans en préciser davantage la nature.
theological_decisions:
- issue: Rapport entre le sujet pluriel « les fils » et le singulier « le père »
  choice: Conserver la discordance et la structure nominale au moyen de deux-points
  alternative: Harmoniser en « furent les pères » ou interpréter par « furent les ancêtres »
  rationale: Le texte hébreu est condensé et grammaticalement difficile. L’harmoniser effacerait une ambiguïté réelle et imposerait une reconstruction généalogique qui n’est pas explicitement donnée.
translation_notes:
  register: Français moderne, sobre et digne. Les deux-points rendent lisible la construction nominale de l’hébreu sans ajouter un verbe absent ni corriger silencieusement la discordance entre le pluriel « fils » et le singulier « père ». Les noms propres suivent une translittération française claire.
