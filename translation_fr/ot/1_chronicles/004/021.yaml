  text: בְּנֵי֙ שֵׁלָ֣ה בֶן יְהוּדָ֔ה עֵ֚ר אֲבִ֣י לֵכָ֔ה וְ/לַעְדָּ֖ה אֲבִ֣י מָרֵשָׁ֑ה וּ/מִשְׁפְּח֛וֹת בֵּית עֲבֹדַ֥ת הַ/בֻּ֖ץ לְ/בֵ֥ית אַשְׁבֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/021.yaml
  text: 'The sons of Shelah son of Judah: Er the father of Lecah[a], and Laadah the father of Mareshah, and the clans of the house of linen workers of the house of Ashbea.'
translation:
  language: fr
  text: 'Les fils de Shéla, fils de Juda : Er, père de Léka, Laada, père de Marésha, et les clans de la maison des ouvriers du lin fin, de Beth-Ashbéa[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation hébraïque de la fin du verset est très condensée. On peut aussi comprendre : « les clans de la maison de ceux qui travaillaient le lin fin, à Beth-Ashbéa ». Plus haut, « père de » peut également signifier « ancêtre de » ou « fondateur de ».'
    reason: Signale l’ambiguïté syntaxique et lexicale réelle sans imposer si Beth-Ashbéa désigne un lieu, une maison ou un groupe.
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Conserve la formulation généalogique concrète de l’hébreu; « descendants » serait possible, mais moins formellement proche.
- source_word: שֵׁלָה בֶן יְהוּדָה
  choice: Shéla, fils de Juda
  rationale: Maintient explicitement le lien généalogique exprimé par בֶן et emploie une translittération française claire.
- source_word: אֲבִי
  choice: père de
  rationale: Rend directement le terme hébreu tout en laissant ouverte, dans ce contexte généalogique et territorial, la possibilité du sens « ancêtre » ou « fondateur ».
- source_word: לֵכָה / לַעְדָּה / מָרֵשָׁה / אַשְׁבֵּעַ
  choice: Léka / Laada / Marésha / Ashbéa
  rationale: Translittérations adaptées à la phonologie et à l’orthographe françaises modernes.
- source_word: מִשְׁפְּחוֹת
  choice: les clans
  rationale: Dans une liste tribale, « clans » exprime mieux que « familles » les groupes étendus de parenté.
- source_word: בֵּית עֲבֹדַת הַבֻּץ
  choice: la maison des ouvriers du lin fin
  rationale: Communique l’idée d’un groupe ou d’une maison liés au travail du בּוּץ, textile fin généralement identifié au lin fin, sans effacer la métaphore de la « maison ».
- source_word: לְבֵית אַשְׁבֵּעַ
  choice: de la maison d’Ashbéa
  rationale: Préserve l’association à une « maison » nommée Ashbéa; la relation précise du לְ reste difficile dans cette notice très condensée.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La structure nominale et généalogique du verset est conservée; la légère rudesse de la dernière proposition reflète la compression de l’hébreu, éclairée par la note.
