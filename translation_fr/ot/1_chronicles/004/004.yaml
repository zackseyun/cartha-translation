source:
  edition: WLC
  text: וּ/פְנוּאֵל֙ אֲבִ֣י גְדֹ֔ר וְ/עֵ֖זֶר אֲבִ֣י חוּשָׁ֑ה אֵ֤לֶּה בְנֵי חוּר֙ בְּכ֣וֹר אֶפְרָ֔תָה אֲבִ֖י בֵּ֥ית לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/004.yaml
  text: Penuel[a], the father of Gedor, and Ezer, the father of Hushah—these were the sons of Hur, the firstborn of Ephrathah[b], the father of Bethlehem.
translation:
  language: fr
  text: Penouël[a], père[b] de Guedor, et Ézer, père de Housha. Ce sont les fils de Hour, premier-né d’Éphrata, père de Bethléem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Penouël » apparaît ailleurs sous la forme « Peniel »; il s’agit de deux formes du même nom.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte généalogique, le mot hébreu rendu par « père » peut aussi désigner un ancêtre, un fondateur ou le chef d’une localité ou d’un clan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנוּאֵל
  choice: Penouël
  rationale: Nom propre translittéré selon une graphie naturelle en français; le tréma indique que les deux dernières voyelles se prononcent séparément. La forme consonantique du texte hébreu est conservée, tandis que la variante « Peniel » est signalée en note.
- source_word: אֲבִי
  choice: père de
  rationale: Rend formellement l’expression hébraïque et préserve son idiome généalogique. Dans ce contexte, elle peut aussi désigner l’ancêtre, le fondateur ou le chef associé à une localité ou à un clan.
- source_word: גְדֹר
  choice: Guedor
  rationale: Nom propre de lieu ou de clan, translittéré sous une forme lisible en français.
- source_word: עֵזֶר
  choice: Ézer
  rationale: Nom propre personnel translittéré; l’accent initial facilite la lecture française.
- source_word: חוּשָׁה
  choice: Housha
  rationale: Nom propre de lieu ou de clan, translittéré sans le traduire.
- source_word: אֵלֶּה
  choice: Ce sont
  rationale: La proposition hébraïque est sans verbe exprimé; le présent français restitue naturellement l’identification généalogique sans imposer un temps absent de l’hébreu.
- source_word: בְנֵי
  choice: les fils de
  rationale: Traduction directe qui conserve la structure généalogique; le terme peut parfois avoir le sens plus large de descendants.
- source_word: חוּר
  choice: Hour
  rationale: Nom propre personnel translittéré selon les conventions françaises.
- source_word: בְּכֹר
  choice: premier-né de
  rationale: Conserve la forme construite et le statut de Hour par rapport à Éphrata, sans ajouter le mot « fils », absent à cet endroit.
- source_word: אֶפְרָתָה
  choice: Éphrata
  rationale: Nom propre translittéré selon une forme française biblique établie.
- source_word: בֵּית לָחֶם
  choice: Bethléem
  rationale: Forme française établie du nom de lieu; le nom n’est pas traduit littéralement.
theological_decisions:
- issue: Référent de l’expression finale « père de Bethléem »
  choice: Maintenir l’apposition après « Hour, premier-né d’Éphrata » sans explicitation supplémentaire
  alternative: Reformuler « Hour, le premier-né d’Éphrata et le père de Bethléem »
  rationale: Le masculin singulier אֲבִי renvoie naturellement à Hour, mais la construction serrée de l’hébreu est mieux préservée sans développer une relation que le texte laisse sous forme d’apposition.
translation_notes:
  register: Français international moderne, sobre et digne. Les noms propres sont translittérés sous des formes aisément prononçables en français. La répétition de « père » et la structure généalogique concise de l’hébreu sont conservées.
