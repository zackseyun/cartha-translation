  text: וְ/אִשְׁתּ֣/וֹ הַ/יְהֻדִיָּ֗ה יָלְדָ֞ה אֶת יֶ֨רֶד אֲבִ֤י גְדוֹר֙ וְ/אֶת חֶ֨בֶר֙ אֲבִ֣י שׂוֹכ֔וֹ וְ/אֶת יְקֽוּתִיאֵ֖ל אֲבִ֣י זָנ֑וֹחַ וְ/אֵ֗לֶּה בְּנֵי֙ בִּתְיָ֣ה בַת פַּרְעֹ֔ה אֲשֶׁ֥ר לָקַ֖ח מָֽרֶד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/018.yaml
  text: And his wife the Jewess bore Jered the father of Gedor[a], Heber the father of Soco, and Jekuthiel the father of Zanoah. These are the sons of Bithiah daughter of Pharaoh[c][b], whom Mered took as wife.
translation:
  language: fr
  text: Sa femme, la Judéenne[a], donna naissance à Yéred, père de Guedor[b], à Héber, père de Soko, et à Yeqoutiel, père de Zanoah. Ce sont là les fils de Bithia[c], fille du pharaon, que Méred prit pour femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa femme judéenne » ou « sa femme juive ».
    reason: lexical_alternative
  - marker: b
    text: Dans les Chroniques, « père de » peut aussi désigner le fondateur, l’ancêtre ou le chef d’un clan associé à un lieu. Il en va de même pour les deux autres emplois de l’expression dans ce verset.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu est difficile : le rapport entre « sa femme, la Judéenne » et Bithia, fille du pharaon, est discuté. Certains pensent qu’il s’agit de la même femme ; d’autres, de deux épouses différentes de Méred.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַיְהֻדִּיָּה
  choice: la Judéenne
  rationale: Le féminin du gentilé peut désigner une femme de Juda, judéenne ou juive. « La Judéenne » conserve ici la désignation d’origine tout en évitant que « la Juive » ne suggère trop directement un usage religieux ou plus tardif.
- source_word: יָלְדָה
  choice: donna naissance à
  rationale: Cette expression française naturelle rend précisément le verbe employé dans la formule généalogique.
- source_word: אֲבִי
  choice: père de
  rationale: La traduction formelle préserve l’expression hébraïque, qui peut aussi désigner le fondateur, l’ancêtre ou le chef d’un groupe associé à un lieu.
- source_word: שׂוֹכוֹ
  choice: Soko
  rationale: Transcription française lisible du nom de lieu hébreu.
- source_word: יְקוּתִיאֵל
  choice: Yeqoutiel
  rationale: Transcription française du nom propre, avec « q » pour la consonne hébraïque qoph.
- source_word: בְּנֵי
  choice: les fils
  rationale: L’hébreu dit explicitement « fils »; ce terme est conservé malgré la possibilité d’un sens généalogique plus large.
- source_word: בִּתְיָה בַת פַּרְעֹה
  choice: Bithia, fille du pharaon
  rationale: La construction appositionnelle et la relation familiale sont rendues directement; l’article convient au titre royal en français.
- source_word: לָקַח
  choice: avait prise pour femme
  rationale: Dans ce contexte matrimonial, « prendre » signifie épouser. Cette formulation garde l’image hébraïque tout en rendant le sens clair en français.
theological_decisions:
- issue: Rapport entre « sa femme, la Judéenne » et « Bithia, fille du pharaon »
  choice: Conserver l’enchaînement et la tension syntaxique du texte hébreu sans identifier explicitement les deux femmes ni les distinguer.
  alternative: Identifier la Judéenne à Bithia, ou restructurer le verset pour présenter clairement deux épouses distinctes de Méred.
  rationale: La syntaxe hébraïque est difficile et permet plusieurs analyses. La traduction ne tranche pas une question que le texte ne résout pas clairement.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation généalogique reste proche de l’hébreu, tandis que « donna naissance à » et « avait prise pour femme » rendent naturellement les idiomes de la langue source. Les noms propres suivent une transcription française cohérente.
