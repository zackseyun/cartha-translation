base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/006.yaml
  text: Naarah bore to him Ahuzzam[a], Hepher, Temeni, and Haahashtari[b]. These were the sons of Naarah.
translation:
  language: fr
  text: 'Naara lui donna des fils : Ahuzzam, Hépher, Témeni[a] et Haahashtari[b]. Ce sont là les fils de Naara.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Témeni peut aussi être compris comme une forme adjectivale signifiant « Téménite » ou « homme du Sud » ; dans cette généalogie, il est rendu comme un nom personnel.
    reason: lexical_alternative
  - marker: b
    text: Haahashtari peut aussi être translittéré « Ahashtari ». La forme hébraïque comporte l’article préfixé ha-, qui a pu se fixer comme partie du nom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד לוֹ
  choice: lui donna pour fils
  rationale: Cette tournure française naturelle conserve le sujet maternel et exprime sobrement la formule généalogique, sans préciser davantage la relation que ne le fait le contexte immédiat.
- source_word: נַעֲרָה
  choice: Naara
  rationale: Nom propre translittéré sous une forme claire et usuelle en français; la même graphie est conservée aux deux occurrences.
- source_word: אֲחֻזָּם
  choice: Ahuzzam
  rationale: Translittération du nom propre qui conserve le redoublement consonantique indiqué par l’hébreu.
- source_word: חֵפֶר
  choice: Hépher
  rationale: Translittération française conventionnelle du nom propre.
- source_word: תֵּימְנִי
  choice: Témeni
  rationale: Dans cette liste généalogique, la forme est rendue comme un nom personnel, tout en signalant en note sa possible valeur adjectivale.
- source_word: הָאֲחַשְׁתָּרִי
  choice: Haahashtari
  rationale: La translittération conserve le ha- préfixé dans la forme hébraïque, puisqu’il peut s’être fixé comme partie du nom.
- source_word: אֵלֶּה בְּנֵי נַעֲרָה
  choice: Ce sont là les fils de Naara
  rationale: Rendu idiomatique du résumé généalogique; « fils » respecte la désignation masculine explicite de l’hébreu.
