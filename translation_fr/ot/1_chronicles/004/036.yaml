  yaml_path: translation/ot/1_chronicles/004/036.yaml
  text: and Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah.
translation:
  language: fr
  text: Élioénaï, Jaakoba, Jeshohaïa, Asaya, Adiel, Jesimiel et Benaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְיוֹעֵינַי
  choice: Élioénaï
  rationale: Nom propre transcrit selon une forme française biblique lisible, avec tréma pour signaler que les voyelles finales se prononcent séparément.
- source_word: יַעֲקֹבָה
  choice: Jacobah
  rationale: Nom propre transcrit dans une graphie française transparente, proche de la forme hébraïque.
- source_word: יְשׁוֹחָיָה
  choice: Jeshohaïa
  rationale: Nom propre transcrit avec J initial selon l'usage français pour de nombreux noms hébreux et avec tréma pour guider la prononciation.
- source_word: עֲשָׂיָה
  choice: Asaya
  rationale: Transcription française simple du nom propre, sans reprendre la terminaison anglaise -iah.
- source_word: עֲדִיאֵל
  choice: Adiel
  rationale: Forme compacte, naturelle en français et fidèle aux éléments du nom hébreu.
- source_word: יְשִׂימִיאֵל
  choice: Jesimiel
  rationale: Transcription française lisible du nom propre, avec J initial conforme à l'usage biblique français.
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Transcription française usuelle et lisible, sans calque de la graphie anglaise Benaiah.
- source_word: וְ / וַ / וִ / וּ
  choice: virgules, puis « et » avant le dernier nom
  rationale: Les waw coordonnent les éléments de la liste. Le français moderne exprime naturellement cette coordination par des virgules et un dernier « et », sans perte de sens.
theological_decisions: []
translation_notes:
  register: Style généalogique sobre et digne. Les noms sont transcrits pour un lectorat francophone moderne; la coordination hébraïque répétée est idiomatiquement allégée.
