  text: וּ/כְל֥וּב אֲחִֽי שׁוּחָ֖ה הוֹלִ֣יד אֶת מְחִ֑יר ה֖וּא אֲבִ֥י אֶשְׁתּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/011.yaml
  text: Chelub[a], the brother of Shuhah, fathered Mehir; he was the father of Eshton.
translation:
  language: fr
  text: Keloub, frère de Shouha, engendra Mehir. Celui-ci fut le père[a] d’Eshton.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ancêtre » ou « le fondateur d’Eshton ». Dans les listes généalogiques, « père de » peut désigner le fondateur d’un clan ou d’une localité plutôt que le père biologique direct.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְל֥וּב
  choice: Keloub
  rationale: Nom propre translittéré selon une forme naturelle en français; la conjonction initiale n’a pas besoin d’être exprimée dans cette notice généalogique autonome.
- source_word: אֲחִֽי שׁוּחָ֖ה
  choice: frère de Shouha
  rationale: Rend directement la relation de parenté exprimée par la chaîne construite hébraïque.
- source_word: הוֹלִ֣יד
  choice: engendra
  rationale: Dans ce contexte généalogique, le hiphil de ילד désigne le fait de devenir père ou de produire une descendance; « engendra » est concis, digne et précis.
- source_word: מְחִ֑יר
  choice: Mehir
  rationale: Nom propre translittéré plutôt que traduit.
- source_word: ה֖וּא
  choice: Celui-ci
  rationale: Le pronom indépendant reprend naturellement Mehir, le référent masculin le plus proche, et maintient explicite la structure des deux propositions.
- source_word: אֲבִ֥י
  choice: le père de
  rationale: Rendu formel qui conserve le sens premier tout en signalant en note l’extension possible à un ancêtre ou au fondateur d’un groupe ou d’un lieu.
- source_word: אֶשְׁתּֽוֹן
  choice: Eshton
  rationale: Nom propre translittéré plutôt que traduit.
