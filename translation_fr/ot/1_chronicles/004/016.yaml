lexical_decisions:
- source_word: וּבְנֵי
  choice: Et les fils de
  rationale: Le nom בְּנֵי est le pluriel construit de « fils », et le préfixe וּ־ relie cette notice généalogique à ce qui précède.
- source_word: יְהַלֶּלְאֵל
  choice: Yehalléléel
  rationale: Nom propre translittéré d’après la forme massorétique, avec une graphie lisible en français moderne.
- source_word: זִיף
  choice: Ziph
  rationale: Nom propre translittéré ; « ph » rend ici la consonne finale selon une graphie biblique française bien établie.
- source_word: וְזִיפָה
  choice: Zipha
  rationale: Nom propre translittéré. La conjonction hébraïque est intégrée naturellement à l’énumération française.
- source_word: תִּירְיָא
  choice: Tiria
  rationale: Translittération française simple du nom propre, sans introduire le « h » de certaines graphies traditionnelles.
- source_word: וַאֲשַׂרְאֵל
  choice: et Asarel[a]
  rationale: Le nom propre est translittéré au plus près de la vocalisation massorétique ; la conjonction est rendue par « et » pour clore naturellement la liste.
