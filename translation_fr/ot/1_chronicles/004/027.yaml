reference: 1 Chronicles 4:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/לְ/שִׁמְעִ֞י בָּנִ֨ים שִׁשָּׁ֤ה עָשָׂר֙ וּ/בָנ֣וֹת שֵׁ֔שׁ וּ/לְ/אֶחָ֕י/ו אֵ֖ין בָּנִ֣ים רַבִּ֑ים וְ/כֹל֙ מִשְׁפַּחְתָּ֔/ם לֹ֥א הִרְבּ֖וּ עַד בְּנֵ֥י יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/027.yaml
  text: Shimei had sixteen sons and six daughters[a], but his brothers did not have many sons, and all their clans did not multiply as much as the sons of Judah.
translation:
  language: fr
  text: Shimeï eut seize fils et six filles. Mais ses frères n’eurent pas beaucoup de fils, et tous leurs clans ne devinrent pas aussi nombreux que les fils de Juda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « ne se multiplièrent pas autant que les fils de Juda » .'
    reason: Le verbe רבה peut être rendu soit par l’idée de devenir nombreux, soit plus littéralement par celle de se multiplier.
lexical_decisions:
- source_word: וּלְשִׁמְעִי
  choice: Shimeï eut
  rationale: La construction avec לְ exprime ici la possession dans une notice généalogique (« à Shimeï étaient… »). Le français idiomatique demande « Shimeï eut ».
- source_word: בָּנִים שִׁשָּׁה עָשָׂר וּבָנוֹת שֵׁשׁ
  choice: seize fils et six filles
  rationale: Les nombres et les liens de parenté sont rendus directement, dans l’ordre naturel du français.
- source_word: וּלְאֶחָיו אֵין בָּנִים רַבִּים
  choice: Mais ses frères n’eurent pas beaucoup de fils
  rationale: Le וְ introduit ici un contraste avec la nombreuse descendance de Shimeï; « mais » explicite naturellement cette relation. La construction existentielle avec לְ est rendue par le verbe « avoir ».
- source_word: וְכֹל מִשְׁפַּחְתָּם
  choice: et tous leurs clans
  rationale: Dans ce contexte généalogique, מִשְׁפָּחָה désigne des groupes de parenté plus larges que la famille nucléaire; « clans » convient donc mieux que « familles ».
- source_word: לֹא הִרְבּוּ
  choice: ne devinrent pas aussi nombreux
  rationale: Le hiphil de רבה exprime ici l’accroissement numérique. Cette formulation française claire conserve le sens démographique sans imposer une image supplémentaire.
- source_word: עַד בְּנֵי יְהוּדָה
  choice: que les fils de Juda
  rationale: עַד marque ici le degré atteint dans une comparaison numérique. « Fils de Juda » conserve l’expression généalogique hébraïque, qui peut viser plus largement ses descendants.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif et généalogique. La formulation conserve « fils de Juda », expression généalogique de la source, tout en rendant explicitement la comparaison numérique portée par עַד.
