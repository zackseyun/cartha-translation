  text: וַֽ/יִּמְצְא֤וּ מִרְעֶה֙ שָׁמֵ֣ן וָ/ט֔וֹב וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם וְ/שֹׁקֶ֖טֶת וּ/שְׁלֵוָ֑ה כִּ֣י מִן חָ֔ם הַ/יֹּשְׁבִ֥ים שָׁ֖ם לְ/פָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/040.yaml
  text: And they found rich and good pasture[a], and the land was broad, quiet, and peaceful, for those from Ham who had lived there formerly were there before.
translation:
  language: fr
  text: Ils trouvèrent de riches et bons pâturages, et le pays était vaste, tranquille et paisible, car les habitants qui s’y trouvaient autrefois étaient des descendants de Cham.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִרְעֶה
  choice: pâturages
  rationale: Le nom désigne un lieu où paissent les troupeaux. Le pluriel français est naturel dans ce contexte et évoque les terres disponibles pour le bétail.
- source_word: שָׁמֵן
  choice: riches
  rationale: Littéralement « gras » ; appliqué aux pâturages, le terme exprime leur abondance et leur fertilité. « Riches » restitue cet emploi idiomatique.
- source_word: טוֹב
  choice: bons
  rationale: L’adjectif porte une appréciation générale simple ; « bons » conserve cette valeur et s’associe naturellement à « riches ».
- source_word: רַחֲבַת יָדַיִם
  choice: vaste
  rationale: Cette expression idiomatique décrit un espace étendu et dégagé. « Vaste » est naturel et précis en français moderne.
- source_word: שֹׁקֶטֶת
  choice: tranquille
  rationale: Le participe décrit le pays comme calme, sans troubles. « Tranquille » en rend directement la nuance.
- source_word: שְׁלֵוָה
  choice: paisible
  rationale: Le mot peut exprimer la quiétude, l’aisance ou la sécurité. En parallèle avec « tranquille », « paisible » conserve ici l’idée d’une situation sans agitation ni menace.
- source_word: כִּי מִן חָם הַיֹּשְׁבִים שָׁם לְפָנִים
  choice: car des descendants de Cham y habitaient autrefois
  rationale: La tournure hébraïque identifie les anciens habitants comme issus de Cham. « Descendants de Cham » explicite naturellement en français la relation d’origine exprimée par מִן, tandis que « autrefois » rend לְפָנִים sans la redondance de la couche anglaise.
- source_word: חָם
  choice: Cham
  rationale: Forme française traditionnelle et largement reconnue du nom propre biblique.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La coordination simple du verset est préservée, tandis que la clause finale est formulée sans la répétition artificielle « autrefois… auparavant ». Aucun élément confessionnel n’est introduit.
