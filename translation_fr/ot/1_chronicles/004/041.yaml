  terminology: « Ézéchias », « Juda », « Méounites », « vouèrent à la destruction », « jusqu’à ce jour » et « pâturages pour leurs troupeaux » sont appropriés. « Vouer à la destruction » rend bien la portée technique de חרם sans la surinterpréter.
