  source_fidelity: 'Le sens général est fidèle au texte massorétique : les hommes recensés arrivent sous Ézéchias, frappent les tentes et le groupe désigné par le terme difficile הַמְּעוּנִים, les vouent à la destruction, puis s’installent à leur place en raison des pâturages. La note préserve correctement l’incertitude textuelle/lexicale concernant « Méounites ».'
