  text: וַ/יָּבֹ֡אוּ אֵלֶּה֩ הַ/כְּתוּבִ֨ים בְּ/שֵׁמ֜וֹת בִּ/ימֵ֣י יְחִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה וַ/יַּכּ֨וּ אֶת אָהֳלֵי/הֶ֜ם וְ/אֶת ה/מעינים אֲשֶׁ֤ר נִמְצְאוּ שָׁ֨מָּ/ה֙ וַ/יַּחֲרִימֻ/ם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יֵּשְׁב֖וּ תַּחְתֵּי/הֶ֑ם כִּֽי מִרְעֶ֥ה לְ/צֹאנָ֖/ם שָֽׁם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/041.yaml
  text: These[a], who were recorded by name, came in the days of Hezekiah king of Judah, and they struck down their tents and the Meunites who were found there, and devoted them to destruction to this day. Then they settled in their place, because there was pasture there for their flocks.
translation:
  language: fr
  text: Ces hommes, dont les noms étaient inscrits, vinrent au temps d’Ézéchias, roi de Juda. Ils frappèrent leurs tentes ainsi que les Méounites[a] qui se trouvaient là ; ils les vouèrent à la destruction jusqu’à ce jour. Puis ils s’établirent à leur place, car il y avait là des pâturages pour leurs troupeaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu est difficile. On comprend traditionnellement ce terme comme « les Méounites », nom d’un peuple ; certains y voient plutôt « les habitations » ou « les demeures ».
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּתוּבִים בְּשֵׁמוֹת
  choice: inscrits par leur nom
  rationale: Le participe passif et le complément indiquent que ces hommes figuraient nominativement dans un registre ou une généalogie. Cette formulation est naturelle en français et conserve la nuance administrative.
- source_word: וַיָּבֹאוּ
  choice: vinrent
  rationale: Le verbe בוא signifie couramment « venir » ou « arriver »; « vinrent » convient à l’enchaînement narratif.
- source_word: וַיַּכּוּ
  choice: frappèrent
  rationale: Dans un récit militaire, נכה exprime une attaque violente pouvant entraîner la défaite ou la mort. « Frappèrent » préserve cette force sans préciser davantage l’étendue des pertes.
- source_word: אָהֳלֵיהֶם
  choice: leurs tentes
  rationale: Le terme hébreu désigne ordinairement des tentes et correspond au cadre pastoral ou semi-nomade du passage.
- source_word: המעינים
  choice: les Méounites
  rationale: La forme difficile est traditionnellement comprise comme le nom d’un groupe humain. Cette lecture s’accorde avec le verbe « frapper » et avec la proposition « qui se trouvaient là »; l’autre interprétation est signalée en note.
- source_word: אֲשֶׁר נִמְצְאוּ שָׁמָּה
  choice: qui se trouvaient là
  rationale: Avec « les Méounites » comme antécédent, la relative est rendue personnellement et de manière idiomatique.
- source_word: וַיַּחֲרִימֻם
  choice: les vouèrent à la destruction
  rationale: Le hifil de חרם exprime la mise sous ḥerem, avec destination à la destruction. Cette traduction garde la portée particulière du verbe sans la réduire au simple fait de détruire.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Formule temporelle hébraïque conservée dans une expression française courante et digne.
- source_word: וַיֵּשְׁבוּ תַּחְתֵּיהֶם
  choice: ils s’établirent à leur place
  rationale: 'Dans ce contexte, תַּחְתֵּי exprime le remplacement: le nouveau groupe occupe le lieu de l’ancien.'
- source_word: מִרְעֶה לְצֹאנָם
  choice: des pâturages pour leurs troupeaux
  rationale: מִרְעֶה désigne un pâturage ou terrain de pacage, et צֹאן peut comprendre aussi bien les moutons que les chèvres; « troupeaux » conserve cette largeur.
theological_decisions:
- issue: Portée de חרם
  choice: les vouèrent à la destruction
  alternative: les exterminèrent / les mirent sous l’interdit
  rationale: La formulation retenue conserve à la fois la dimension technique de la mise sous ḥerem et son issue destructrice, sans ajouter une interprétation confessionnelle ni atténuer la violence du texte.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible, tout en conservant la formule « jusqu’à ce jour » et la tension de l’expression « vouer à la destruction ». Le marqueur de note est placé immédiatement après le terme réellement concerné.
