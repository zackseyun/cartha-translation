  text: וּ/בְנֵ֣י קְנַ֔ז עָתְנִיאֵ֖ל וּ/שְׂרָיָ֑ה וּ/בְנֵ֥י עָתְנִיאֵ֖ל חֲתַֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/013.yaml
  text: 'The sons of Kenaz: Othniel and Seraiah[a]. And the sons of Othniel: Hathath.'
translation:
  language: fr
  text: 'Fils de Kenaz : Otniel et Seraya. Fils d’Otniel : Hatath.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְנַז
  choice: Fils de Kenaz
  rationale: La formule généalogique avec le pluriel construit de בֵּן est rendue naturellement par « Fils de ». La conjonction initiale n’est pas explicitée, car le français généalogique introduit ici une nouvelle lignée sans exiger « et ».
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Transcription française courante du nom propre hébreu.
- source_word: וּשְׂרָיָה
  choice: et Seraya
  rationale: Le nom propre שְׂרָיָה est transcrit selon sa vocalisation hébraïque et précédé de « et » pour rendre la conjonction.
- source_word: וּבְנֵי עָתְנִיאֵל
  choice: Fils d’Otniel
  rationale: La formule généalogique répétée est conservée. Une nouvelle phrase nominale rend le style bref de la liste sans alourdir le français par un « et » initial.
- source_word: חֲתַת
  choice: Hatath
  rationale: Transcription directe et intelligible du nom propre hébreu.
