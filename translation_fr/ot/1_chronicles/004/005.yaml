  yaml_path: translation/ot/1_chronicles/004/005.yaml
  text: 'Ashhur the father of Tekoa had two wives: Helah and Naarah[a].'
translation:
  language: fr
  text: 'Ashhour, père de Teqoa[a], avait deux épouses : Hélea et Naara.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « fondateur de Teqoa » ou « ancêtre de Teqoa » : dans les généalogies, « père de » peut désigner le fondateur d’un clan ou d’une localité, et non seulement le père biologique direct.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַשְׁחוּר
  choice: Ashhour
  rationale: La préposition et la conjonction introduisent ici le personnage dans la suite généalogique; le français naturel peut rendre simplement le nom sans reproduire littéralement « et à ».
- source_word: אֲבִי תְקוֹעַ
  choice: père de Teqoa
  rationale: Cette formulation reste proche de l’hébreu tout en conservant la latitude généalogique de אָב, qui peut désigner un père, un ancêtre ou le fondateur d’un groupe ou d’une localité.
- source_word: הָיוּ
  choice: avait
  rationale: L’hébreu emploie le verbe « être » dans une construction possessive; « avait » en donne naturellement le sens en français.
- source_word: שְׁתֵּי נָשִׁים
  choice: deux femmes
  rationale: Dans cette notice généalogique, נָשִׁים désigne les épouses d’Ashhour; « femmes » est l’expression française naturelle dans la construction « avait deux femmes ».
- source_word: חֶלְאָה
  choice: Hélea
  rationale: Translittération française lisible du nom hébreu, avec indication de la consonne gutturale initiale par un h.
- source_word: וְנַעֲרָה
  choice: et Naara
  rationale: La conjonction coordonne les deux noms; « Naara » est une translittération française claire de la forme hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La tournure possessive est idiomatique, tandis que « père de » préserve l’ambiguïté du vocabulaire généalogique hébreu; celle-ci est explicitée en note.
