base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/017.yaml
  text: 'The sons of Ezrah: Jether[a], Mered, Epher, and Jalon; and she conceived Miriam, Shammai, and Ishbah[c][b], the father of Eshtemoa.'
translation:
  language: fr
  text: 'Les fils d’Ezrah[a] : Yéter, Méred, Éfer et Yalôn ; elle conçut[b] Miriam, Shammaï et Yishbah, père d’Eshtemoa[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et le fils d’Ezrah ». Comme plusieurs noms suivent, l’expression est généralement comprise collectivement : « les fils d’Ezrah ».'
    reason: textual_variant
  - marker: b
    text: 'L’hébreu dit seulement : « elle conçut » ; la femme n’est pas identifiée dans cette proposition.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « fondateur d’Eshtemoa », si Eshtemoa désigne ici un clan ou une localité plutôt qu’une personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: Les fils de
  rationale: Le texte hébreu porte littéralement le singulier « et le fils de », mais il est suivi de plusieurs noms. Le pluriel fonctionne naturellement comme rubrique généalogique, tandis que le singulier est signalé en note.
- source_word: עֶזְרָה
  choice: Ezra
  rationale: Nom propre translittéré sous une forme française usuelle; il est distinct d’Esdras, forme traditionnellement associée au scribe biblique.
- source_word: יֶתֶר וּמֶרֶד וְעֵפֶר וְיָלוֹן
  choice: Yéter, Méred, Éfer et Yalôn
  rationale: Noms propres translittérés en français, avec des accents destinés à guider une prononciation proche de l’hébreu.
- source_word: וַתַּהַר
  choice: Elle conçut
  rationale: Le verbe signifie « concevoir, devenir enceinte ». La forme féminine a un sujet non exprimé; la traduction ne l’identifie donc pas.
- source_word: מִרְיָם וְשַׁמַּי וְיִשְׁבָּח
  choice: Miriam, Shammaï et Yishbah
  rationale: Noms propres conservés comme éléments de la généalogie et translittérés sans déduire le sexe de Miriam à partir de l’usage du nom ailleurs.
- source_word: אֲבִי אֶשְׁתְּמֹעַ
  choice: père d’Eshtemoa
  rationale: Rendu formel et transparent de l’expression hébraïque. Dans une généalogie, « père de » peut aussi désigner l’ancêtre ou le fondateur d’un clan ou d’une localité; cette possibilité est indiquée en note.
