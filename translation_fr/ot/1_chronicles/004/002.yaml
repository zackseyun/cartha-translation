  text: וּ/רְאָיָ֤ה בֶן שׁוֹבָל֙ הוֹלִ֣יד אֶת יַ֔חַת וְ/יַ֣חַת הֹלִ֔יד אֶת אֲחוּמַ֖י וְ/אֶת לָ֑הַד אֵ֖לֶּה מִשְׁפְּח֥וֹת הַ/צָּֽרְעָתִֽי־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/002.yaml
  text: Reaiah son of Shobal fathered Jahath[a], and Jahath fathered Ahumai and Lahad. These were the clans of the Zorathites.
translation:
  language: fr
  text: Reaya, fils de Shobal, engendra Yahath, et Yahath engendra Ahoumaï et Lahad. Tels furent les clans des Tsoréatites.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les familles des Tsoréatites ». Le terme hébreu peut désigner des groupes de parenté étendus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאָיָה
  choice: Reaya
  rationale: Nom propre translittéré selon une forme française moderne qui reflète l’hébreu רְאָיָה.
- source_word: בֶן
  choice: fils de
  rationale: Conserve la formulation généalogique directe de l’hébreu, sans exclure l’élasticité possible du terme dans les généalogies.
- source_word: הוֹלִיד / הֹלִיד
  choice: engendra
  rationale: Le hiphil de ילד exprime ici l’engendrement dans une généalogie. « Engendra » est concis, digne et précis en français biblique courant.
- source_word: יַחַת
  choice: Yahath
  rationale: Translittération française du nom propre, avec « Y » pour yod et « th » pour la consonne finale ת.
- source_word: אֲחוּמַי
  choice: Ahoumaï
  rationale: Translittération française du nom propre, rendant le son ou par « ou » et signalant la finale distincte par le tréma.
- source_word: לָהַד
  choice: Lahad
  rationale: Translittération directe du nom propre hébreu.
- source_word: אֵלֶּה
  choice: Tels furent
  rationale: Tour français naturel renvoyant aux personnes nommées comme représentants ou ancêtres des groupes qui suivent.
- source_word: מִשְׁפְּחֹות
  choice: clans
  rationale: Dans ce cadre tribal et généalogique, le mot désigne des groupes de parenté étendus plutôt que de simples foyers familiaux.
- source_word: הַצָּרְעָתִי
  choice: les Tsoréatites
  rationale: Rend le gentilé hébreu dérivé de Tsorea, en désignant les membres des groupes associés à cette localité.
