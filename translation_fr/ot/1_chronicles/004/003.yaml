  text: וְ/אֵ֨לֶּה֙ אֲבִ֣י עֵיטָ֔ם יִזְרְעֶ֥אל וְ/יִשְׁמָ֖א וְ/יִדְבָּ֑שׁ וְ/שֵׁ֥ם אֲחוֹתָ֖/ם הַצְלֶלְפּֽוֹנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/003.yaml
  text: 'These were the sons of the father of Etam: Jezreel[a], Ishma, and Idbash[b]; and the name of their sister was Hazzelelponi.'
translation:
  language: fr
  text: 'Voici les fils du père d’Étam[a] : Yizréel, Yishma et Yidbash. Leur sœur s’appelait Hatslelponi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « père d’Étam »; la phrase est elliptique. Ici, « père » peut désigner le père, l’ancêtre ou le fondateur d’Étam, selon qu’Étam est compris comme une personne, un clan ou un lieu.
    reason: textual_and_lexical_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: La formule présente une nouvelle notice généalogique. « Voici » en rend naturellement la fonction introductive en français.
- source_word: אֲבִי עֵיטָם
  choice: les fils du père d’Étam
  rationale: L’hébreu porte littéralement « père d’Étam », mais la construction est elliptique et difficile après le démonstratif pluriel. « Les fils » explicite la relation généalogique sous-entendue, tandis qu’une note conserve l’ambiguïté de אָב, qui peut aussi désigner un ancêtre ou un fondateur.
- source_word: יִזְרְעֶאל
  choice: Yizréel
  rationale: Transcription française moderne du nom propre hébreu, distincte de sa traduction étymologique.
- source_word: וְיִשְׁמָא
  choice: Yishma
  rationale: Transcription directe du nom propre hébreu selon des conventions françaises modernes.
- source_word: וְיִדְבָּשׁ
  choice: et Yidbash
  rationale: Le nom propre est transcrit, et la conjonction finale de l’énumération est rendue selon l’usage français.
- source_word: וְשֵׁם אֲחוֹתָם
  choice: Leur sœur s’appelait
  rationale: Cette formulation idiomatique rend l’expression nominale « et le nom de leur sœur [était] » ainsi que le suffixe pluriel « leur ».
- source_word: הַצְלֶלְפּוֹנִי
  choice: Hatslelponi
  rationale: Transcription française du nom féminin, avec « ts » pour la consonne צ.
