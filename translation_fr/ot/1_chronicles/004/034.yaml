  text: and Meshobab[a], and Jamlech, and Joshah son of Amaziah.
translation:
  language: fr
  text: et Meshobab, et Yamlek[a], et Yosha, fils d’Amatsia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Selon les conventions de transcription, Yamlek peut aussi s’écrire Jamlek.
    reason: Variante de transcription d’un nom propre hébreu commençant par yod.
lexical_decisions:
- source_word: מְשׁוֹבָב
  choice: Meshobab
  rationale: Nom propre transcrit en français sans le traduire; cette forme reste proche de la vocalisation hébraïque.
- source_word: יַמְלֵךְ
  choice: Yamlek
  rationale: Nom propre transcrit avec un y initial, conformément à la consonne hébraïque yod; le k final offre une graphie française simple pour la consonne finale kaf.
- source_word: יוֹשָׁה
  choice: Yosha
  rationale: Transcription proche de l’hébreu, avec un y initial et « sh » pour la consonne shin; elle évite d’imposer une forme anglaise du nom.
- source_word: בֶּן
  choice: fils de
  rationale: Expression généalogique courante qui indique ici la filiation. Devant Amatsia, « de » s’élide naturellement en « d’ ».
- source_word: אֲמַצְיָה
  choice: Amatsia
  rationale: Forme française transparente et proche de l’hébreu; « ts » représente la consonne tsadé.
- source_word: וְ
  choice: et
  rationale: La conjonction est répétée devant les noms dans l’hébreu; sa répétition est conservée afin de respecter la structure de l’énumération.
theological_decisions: []
