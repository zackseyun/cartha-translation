base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/039.yaml
  text: They went to the entrance of Gedor[a], as far as the east side of the valley[b], to seek pasture for their flocks.
translation:
  language: fr
  text: Ils allèrent à l’entrée de Guedor[a], jusqu’au côté est de la vallée[b], pour y chercher un pâturage pour leurs troupeaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers les abords de Guedor » ; le terme hébreu peut désigner une entrée, une voie d’accès ou un lieu par lequel on entre.
    reason: lexical_alternative
  - marker: b
    text: Ou « à l’est de la vallée » ou « vers l’est de la vallée » ; l’expression hébraïque est une indication topographique concise.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Ils allèrent
  rationale: Le wayyiqtol de הלך poursuit la séquence narrative; le passé simple convient au registre narratif digne et concis.
- source_word: לִמְבוֹא
  choice: à l’entrée de
  rationale: מָבוֹא peut désigner une entrée, un accès ou une voie d’approche. « À l’entrée de » conserve clairement la valeur spatiale, tandis que la note signale l’autre nuance possible.
- source_word: גְדֹר
  choice: Guedor
  rationale: Nom de lieu translittéré selon une forme française qui rend le son initial dur de la consonne hébraïque.
- source_word: עַד
  choice: jusqu’au
  rationale: La préposition marque ici l’étendue spatiale du déplacement, et non une limite temporelle.
- source_word: לְמִזְרַח הַגָּיְא
  choice: au côté est de la vallée
  rationale: Cette formulation française naturelle présente מִזְרָח comme une zone ou un côté oriental, tout en laissant à la note les autres lectures possibles de cette expression topographique compacte.
- source_word: לְבַקֵּשׁ
  choice: pour chercher
  rationale: L’infinitif exprime le but du déplacement; « pour chercher » le rend directement en français courant.
- source_word: מִרְעֶה
  choice: des pâturages
  rationale: Le nom désigne l’herbe ou le terrain où paissent les animaux. Le pluriel français est idiomatique dans ce contexte sans imposer plusieurs lieux précis.
- source_word: לְצֹאנָם
  choice: pour leurs troupeaux
  rationale: צֹאן peut englober les ovins et les caprins; « troupeaux » évite de limiter indûment le sens aux seuls moutons.
