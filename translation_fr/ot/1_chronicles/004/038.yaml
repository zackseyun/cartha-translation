  text: These[a], who were mentioned by name, were leaders in their clans[b], and their ancestral houses increased greatly.
translation:
  language: fr
  text: Ceux-ci, inscrits nommément[a], étaient des chefs dans leurs clans, et leurs maisons ancestrales connurent une forte expansion[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ceux-ci, qui viennent/arrivent par noms. » Le participe hébreu signifie littéralement « venant » ; dans ce contexte généalogique, il peut désigner des personnes inscrites ou désignées nommément dans le registre.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et la maison de leurs pères fit irruption/s’accrut en grand nombre ». L’expression désigne leurs maisonnées ou lignées paternelles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ceux-ci
  rationale: Le démonstratif pluriel reprend les hommes nommés dans la liste généalogique précédente.
- source_word: הַבָּאִים בְּשֵׁמוֹת
  choice: inscrits nommément
  rationale: Le participe de בוא signifie littéralement « venant », mais, associé à « par noms » dans ce contexte généalogique, il désigne vraisemblablement ceux qui sont consignés ou recensés par leur nom.
- source_word: נְשִׂיאִים
  choice: chefs
  rationale: Le terme désigne ici les responsables d'unités familiales ou claniques; « chefs » conserve cette fonction sans connotation monarchique excessive.
- source_word: בְּמִשְׁפְּחוֹתָם
  choice: dans leurs clans
  rationale: Dans une généalogie, מִשְׁפָּחָה désigne souvent un groupe de parenté plus étendu que la famille nucléaire moderne.
- source_word: וּבֵית אֲבוֹתֵיהֶם
  choice: leurs maisons ancestrales
  rationale: L'expression renvoie aux lignées ou maisonnées patrilinéaires; cette formulation reste proche de l'image hébraïque tout en étant intelligible en français moderne.
- source_word: פָּרְצוּ לָרֹב
  choice: se multiplièrent considérablement
  rationale: Le verbe évoque une expansion vigoureuse, et לָרֹב en souligne l'abondance ou le grand nombre.
