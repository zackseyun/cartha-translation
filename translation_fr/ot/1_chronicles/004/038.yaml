  source_fidelity: 'Le sens principal est bien rendu : le groupe nommé dans la généalogie est présenté comme ayant un statut de chefs au sein de ses clans, et ses maisons/lignées paternelles connaissent un accroissement considérable. « Inscrits nommément » est une interprétation contextuelle défendable de הַבָּאִים בְּשֵׁמוֹת, à condition que la note conserve clairement la lecture littérale possible.'
  naturalness: La phrase est fluide dans l’ensemble. Toutefois, « maisons ancestrales se multiplièrent » peut évoquer des bâtiments qui se reproduisent et sonne moins naturel en français moderne. « Connurent une forte expansion » exprime naturellement la croissance des maisonnées ou lignées.
  terminology: '« Chefs » et « clans » conviennent au cadre généalogique. « Maisons ancestrales » conserve l’image de la maison ancestrale, mais la reformulation verbale évite une lecture matérielle. Les notes doivent être corrigées : la note a ne doit pas transformer la construction en « qui vinrent, désignés », et la note b doit refléter le verbe d’expansion plutôt que « s’étendirent jusqu’à devenir nombreuses ».'
