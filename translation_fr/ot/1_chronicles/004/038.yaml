  - severity: medium
    issue: La note b présente une paraphrase littérale inexacte.
    rationale: פָּרְצוּ évoque une irruption, une percée ou une forte expansion ; « s’étendirent jusqu’à devenir nombreuses » ne correspond pas à une formulation littérale et atténue l’image verbale.
  - severity: low
    issue: « Se multiplièrent » appliqué aux « maisons ancestrales » est peu idiomatique.
    rationale: En français, le mot « maison » risque d’être compris comme un édifice. Une expression d’expansion permet de maintenir le référent lignager sans modifier le sens.
