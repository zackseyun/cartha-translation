- from: Ceux-ci, inscrits nommément[a], étaient des chefs dans leurs clans, et leurs maisons ancestrales se multiplièrent considérablement[b].
  to: Ceux-ci, inscrits nommément[a], étaient des chefs dans leurs clans, et leurs maisons ancestrales connurent une forte expansion[b].
  rationale: La révision conserve l’interprétation contextuelle adoptée pour le participe, tout en donnant dans la note une alternative littérale grammaticale et sans la présenter comme certaine. Elle remplace la multiplication peu naturelle de « maisons » par une forte expansion et corrige la note sur le verbe פָּרְצוּ afin de mieux représenter son image d’accroissement vigoureux.
