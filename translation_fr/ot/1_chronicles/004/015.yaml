  text: וּ/בְנֵי֙ כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה עִ֥ירוּ אֵלָ֖ה וָ/נָ֑עַם וּ/בְנֵ֥י אֵלָ֖ה וּ/קְנַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/015.yaml
  text: 'And the sons of Caleb son of Jephunneh: Iru[a], Elah, and Naam; and the sons of Elah: Kenaz.'
translation:
  language: fr
  text: 'Les fils[a] de Caleb, fils de Jephunné : Irou, Éla et Naam ; et les fils d’Éla : Kenaz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, dans un sens plus large, « les descendants de Caleb, fils de Jephunné ». Dans les généalogies, « fils » peut parfois désigner plus largement des membres de la descendance, bien qu’ici l’énumération immédiate favorise le sens de « fils ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Dans cette généalogie, בְּנֵי désigne le plus naturellement des fils nommés directement, tout en pouvant parfois avoir le sens plus large de « descendants ».
- source_word: כָּלֵב בֶּן־יְפֻנֶּה
  choice: Caleb, fils de Jephunné
  rationale: L’apposition généalogique identifie ce Caleb par le nom de son père; les formes françaises traditionnelles et reconnaissables sont conservées.
- source_word: עִירוּ
  choice: Irou
  rationale: Transcription française lisible du nom propre hébreu.
- source_word: אֵלָה
  choice: Éla
  rationale: Le contexte généalogique indique un nom de personne; l’accent distingue clairement la prononciation française attendue.
- source_word: וָנָעַם
  choice: et Naam
  rationale: La vocalisation massorétique appuie le nom masculin Naam, non la forme différente Naama.
- source_word: וּבְנֵי אֵלָה
  choice: Les fils d’Éla
  rationale: La répétition de la formule généalogique introduit une branche secondaire issue d’Éla.
- source_word: וּקְנַז
  choice: Kenaz
  rationale: Forme française usuelle et reconnaissable du nom propre hébreu.
