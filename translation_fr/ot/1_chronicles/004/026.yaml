  - severity: low
    issue: « Shiméï » introduit un accent aigu qui suggère une voyelle /e/ accentuée non explicitée par la forme hébraïque.
    rationale: La graphie « Shimeï », usuelle en français pour ce nom, évite cette précision phonétique superflue tout en distinguant la voyelle finale.
