  yaml_path: translation/ot/1_chronicles/004/026.yaml
  text: 'The sons of Mishma: Hammuel his son, Zaccur his son, Shimei his son.'
translation:
  language: fr
  text: 'Fils de Mishma : Hammouël, son fils ; Zakkour, son fils ; Shimeï, son fils.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Fils de
  rationale: בְּנֵי est le pluriel construit de « fils ». Dans cette liste généalogique, « Fils de » restitue sobrement la structure hébraïque ; la conjonction וּ peut rester implicite en français.
- source_word: מִשְׁמָע
  choice: Mishma
  rationale: Nom propre transcrit d’après la forme hébraïque, dans une graphie naturelle en français.
- source_word: חַמּוּאֵל
  choice: Hammouel
  rationale: Transcription française du nom propre, avec « ou » pour rendre le son /u/ et la consonne redoublée conservée.
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le nom singulier avec suffixe masculin singulier signifie littéralement « son fils » et marque ici chaque étape de la filiation.
- source_word: זַכּוּר
  choice: Zakkour
  rationale: Transcription qui rend la consonne redoublée et emploie « ou » pour la voyelle hébraïque /u/.
- source_word: שִׁמְעִי
  choice: Shिमéï
  rationale: Transcription française visant à représenter la vocalisation hébraïque et à distinguer les deux dernières voyelles.
