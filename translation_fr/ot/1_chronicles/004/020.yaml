base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/020.yaml
  text: 'The sons of Shimon: Amnon and Rinnah[a], Ben-Hanan and Tilon[b]. And the sons of Ishi: Zoheth and Ben-Zoheth.'
translation:
  language: fr
  text: 'Les fils de Shimon : Amnon, Rinnah, Ben-Hanan[a] et Tilon. Et les fils de Yishaï : Zoheth et Ben-Zoheth[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fils de Hanan » ; dans cette liste généalogique, il s’agit toutefois probablement d’un nom propre.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le fils de Zoheth » ; dans cette liste généalogique, il s’agit toutefois probablement d’un nom propre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן introduit une liste généalogique. En tête de verset, la conjonction initiale n’a pas besoin d’être rendue pour que le français soit naturel ; à la seconde occurrence, elle est rendue par « Et ».
- source_word: שִׁימוֹן
  choice: Shimôn
  rationale: Translittération française du nom hébreu, plutôt que la forme traditionnelle « Siméon ».
- source_word: אַמְנוֹן וְרִנָּה
  choice: Amnon, Rinna
  rationale: Noms propres translittérés ; la coordination hébraïque est rendue selon l’usage naturel d’une énumération française.
- source_word: בֶּן חָנָן
  choice: Ben-Hanân[a]
  rationale: Dans cette suite généalogique, l’expression est vraisemblablement un nom propre composé. La note conserve toutefois la possibilité syntaxique « fils de Hanân ».
- source_word: ו/תולון
  choice: et Tilôn
  rationale: Nom propre translittéré d’après la vocalisation transmise par le texte massorétique.
- source_word: וּבְנֵי יִשְׁעִי
  choice: Et les fils de Yishéï
  rationale: La formule généalogique répétée est rendue littéralement, avec la conjonction qui poursuit la liste.
- source_word: זוֹחֵת
  choice: Zoheth
  rationale: Translittération du nom propre, en conservant une représentation distincte de la consonne ח.
- source_word: וּבֶן זוֹחֵת
  choice: et Ben-Zoheth[b]
  rationale: Comme aucun autre nom ne suit « fils de », l’ensemble est probablement un nom propre ; la lecture relationnelle reste signalée en note.
