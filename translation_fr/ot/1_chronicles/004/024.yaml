  yaml_path: translation/ot/1_chronicles/004/024.yaml
  text: 'The sons of Simeon: Nemuel[a], Jamin, Jarib, Zerah[c][b], and Shaul.'
translation:
  language: fr
  text: 'Les fils de Siméon : Nemouel[a], Yamin, Yarib, Zérah[b] et Shaoul[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la généalogie parallèle de Genèse 46.10, Nemouel est appelé Yemouel; le texte hébreu porte ici Nemouel.
    reason: alternative_reading
  - marker: b
    text: Zérah correspond à Tsohar dans les généalogies parallèles de Genèse 46.10 et d’Exode 6.15.
    reason: textual_variant
  - marker: c
    text: Shaoul est la forme hébraïque du nom traditionnellement rendu par Saül en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit de « fils » introduit ici une liste généalogique de personnes nommées; cette formulation est directe et naturelle en français.
- source_word: שִׁמְעוֹן
  choice: Siméon
  rationale: Forme française traditionnelle et transparente du nom propre hébreu.
- source_word: נְמוּאֵל
  choice: Nemouel
  rationale: Translittération française de la forme hébraïque propre à ce verset, distincte de la forme Yemouel attestée dans le passage parallèle.
- source_word: וְיָמִין
  choice: Yamin
  rationale: Le nom est translittéré selon les conventions françaises; la conjonction hébraïque est rendue naturellement dans l'énumération française par « et » devant le dernier élément seulement.
- source_word: יָרִיב
  choice: Yarib
  rationale: Translittération du nom propre sans en traduire le sens lexical.
- source_word: זֶרַח
  choice: Zérah
  rationale: Cette forme reproduit le nom hébreu présent dans le texte massorétique de ce verset; la forme différente des généalogies parallèles est signalée en note.
- source_word: שָׁאוּל
  choice: Shaoul
  rationale: Translittération française usuelle qui reflète clairement la forme hébraïque du nom.
