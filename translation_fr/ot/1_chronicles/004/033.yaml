base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/033.yaml
  text: And all their villages that were around these cities, as far as Baal—these were their settlements, and they had their genealogy recorded.
translation:
  language: fr
  text: Tous leurs villages[a] se trouvaient autour de ces villes, jusqu’à Baal. Tels étaient leurs lieux d’habitation, et ils furent inscrits dans les registres généalogiques[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hameaux » ou « localités ».
    reason: lexical_alternative
  - marker: b
    text: Ou « et ils se firent inscrire selon leur généalogie » ; l’expression hébraïque désigne une inscription généalogique.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: leurs villages
  rationale: Dans cette énumération géographique, חָצֵר désigne vraisemblablement de petites localités dépendant des villes mentionnées. « Villages » est précis et naturel en français moderne.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: se trouvaient autour de ces villes
  rationale: Cette formulation rend clairement la relation spatiale exprimée par le relatif et סְבִיבוֹת, sans calque pesant.
- source_word: עַד בָּעַל
  choice: jusqu’à Baal
  rationale: עַד indique ici la limite de l’étendue territoriale, et בָּעַל est conservé comme nom de lieu.
- source_word: זֹאת מוֹשְׁבֹתָם
  choice: Tels étaient leurs lieux d’habitation
  rationale: Le démonstratif singulier זֹאת résume l’ensemble qui précède. Le pluriel français reprend naturellement les différents lieux énumérés, tandis que « lieux d’habitation » distingue מוֹשָׁב de חָצֵר.
- source_word: וְהִתְיַחְשָׂם לָהֶם
  choice: et ils furent enregistrés selon leur généalogie
  rationale: Le verbe יחס au hitpael renvoie à l’inscription ou au recensement généalogique. La tournure passive française exprime clairement le résultat sans préciser indûment qui a procédé à l’enregistrement; la note conserve l’autre lecture possible de la forme réflexive.
