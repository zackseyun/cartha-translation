  text: וַ/יִּרְא֞וּ עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥ימוּ עִם דָּוִ֖יד וַ/יַּֽעַבְדֻ֑/הוּ וְ/לֹא אָבָ֣ה אֲרָ֔ם לְ/הוֹשִׁ֥יעַ אֶת בְּנֵי עַמּ֖וֹן עֽוֹד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/019.yaml
  text: When the servants of Hadadezer saw that they had been defeated before Israel[a], they made peace with David and served him. And Aram was no longer willing to help the sons of Ammon.
translation:
  language: fr
  text: Quand les serviteurs de Hadadézer virent qu’ils avaient été vaincus devant Israël, ils firent la paix avec David et le servirent. Aram ne voulut plus venir au secours des fils d’Ammon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Ammonites ». L’hébreu dit littéralement « des fils d’Ammon », expression qui sert ici de désignation ethnique.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: serviteurs
  rationale: Dans ce contexte royal et militaire, le terme désigne les hommes placés au service ou sous l’autorité de Hadadézer, sans mettre nécessairement l’accent sur l’esclavage.
- source_word: נִגְּפוּ
  choice: avaient été vaincus
  rationale: Le nifal exprime ici une défaite militaire. Cette formulation française est naturelle et n’implique pas que tous aient été tués.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: devant Israël
  rationale: La formulation conserve l’image hébraïque tout en exprimant clairement une défaite face à Israël; elle évite de réduire explicitement la préposition au seul sens de l’agent.
- source_word: וַיַּשְׁלִימוּ עִם דָּוִיד
  choice: ils firent la paix avec David
  rationale: Le hifil de שלם avec עִם désigne ici la conclusion de la paix avec David.
- source_word: וַיַּעַבְדֻהוּ
  choice: et le servirent
  rationale: Le verbe exprime le service et, dans ce cadre politique, la soumission à David. La traduction concise préserve cette portée sans l’expliciter davantage que l’hébreu.
- source_word: אֲרָם
  choice: Aram
  rationale: Le nom propre hébreu est conservé plutôt que remplacé par le terme géopolitique traditionnel « Syrie »; il fonctionne ici comme un collectif.
- source_word: לְהוֹשִׁיעַ
  choice: venir au secours de
  rationale: Dans le contexte d’une alliance militaire, le verbe signifie apporter une aide qui délivre. « Venir au secours de » rend mieux cette nuance que le simple « aider ».
- source_word: בְּנֵי עַמּוֹן
  choice: les fils d’Ammon
  rationale: La traduction reproduit l’expression hébraïque, qui sert ici de désignation ethnique; une note en donne l’équivalent français courant.
- source_word: לֹא אָבָה ... עוֹד
  choice: ne voulut plus
  rationale: La combinaison du refus et de עוֹד indique qu’Aram n’était désormais plus disposé à renouveler cette aide.
theological_decisions: []
