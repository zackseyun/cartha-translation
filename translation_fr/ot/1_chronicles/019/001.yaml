source:
  edition: WLC
  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יָּ֕מָת נָחָ֖שׁ מֶ֣לֶךְ בְּנֵי עַמּ֑וֹן וַ/יִּמְלֹ֥ךְ בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/001.yaml
  text: After this, Nahash king of the Ammonites died, and his son reigned in his place.
translation:
  language: fr
  text: Après cela, Nahash, roi des Ammonites, mourut, et son fils régna à sa place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Après cela
  rationale: La formule narrative hébraïque signifie littéralement « et il arriva après cela ». « Après cela » marque naturellement la transition temporelle en français moderne sans alourdir le récit.
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le verbe מות signifie simplement « mourir ». Le passé simple convient au registre narratif biblique, tout en restant clair et direct.
- source_word: נָחָשׁ
  choice: Nahash
  rationale: Le nom propre est translittéré selon sa forme française biblique courante.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: roi des Ammonites
  rationale: Littéralement « roi des fils d’Ammon » ; « des Ammonites » est l’expression ethnonymique naturelle et exacte en français.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Le verbe מלך exprime ici l’exercice ou l’accession au pouvoir royal. « Régna » conserve la formulation concise de l’hébreu et s’accorde avec le récit au passé simple.
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le suffixe possessif renvoie clairement à Nahash ; « son fils » restitue directement cette relation.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: L’expression indique que le fils succède à Nahash dans sa fonction royale. « À sa place » en conserve le sens sans explicitation supplémentaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient un registre narratif soutenu mais courant dans les traductions bibliques françaises. La syntaxe reste proche de l’hébreu sans reproduire sa formule introductive de manière artificielle.
