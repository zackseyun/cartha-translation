review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : les Ammonites constatent la fuite des forces araméennes, fuient à leur tour devant Abishaï et vont dans la ville. Toutefois, « revint » traduit un retour qui n’est pas exprimé par וַיָּבֹא (« vint »). De même, « rentrèrent » peut suggérer qu’ils retournaient dans une ville qu’ils avaient quittée, alors que le texte dit simplement qu’ils y entrèrent.'
  naturalness: Le français est fluide, moderne et d’un registre narratif approprié. « Entrèrent dans la ville » est aussi naturel que « rentrèrent » tout en étant plus exact. « Puis Joab vint à Jérusalem » est idiomatique et ne surcharge pas le verbe d’une nuance absente de l’hébreu.
  terminology: « Ammonites », « Araméens », « Abishaï », « Joab » et « Jérusalem » sont appropriés. « Les Araméens » rend naturellement en français le collectif אַרָם dans ce contexte militaire. L’explicitation « frère de Joab » est contextuellement fondée et évite une référence pronominale ambiguë.
  issues:
  - severity: medium
    issue: « Puis Joab revint à Jérusalem » ajoute l’idée de retour.
    rationale: Le verbe hébreu וַיָּבֹא signifie « vint/alla/arriva » selon le contexte; il ne porte pas en lui-même le préfixe sémantique « re- ». Le contexte peut faire supposer un retour, mais la traduction ne doit pas l’affirmer dans le texte principal.
  - severity: low
    issue: « Rentrèrent dans la ville » peut impliquer un retour.
    rationale: וַיָּבֹאוּ הָעִירָה indique le mouvement vers l’intérieur de la ville. « Entrèrent dans la ville » restitue cette valeur directionnelle sans implication supplémentaire.
