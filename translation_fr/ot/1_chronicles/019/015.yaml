base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/015.yaml
  text: When the Ammonites saw that Aram had fled[a], they also fled before Abishai his brother and entered the city[b]. Then Joab came to Jerusalem.
translation:
  language: fr
  text: Quand les Ammonites virent que les Araméens avaient pris la fuite, ils s’enfuirent eux aussi devant Abishaï, frère de Joab, et entrèrent dans la ville. Puis Joab vint à Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: les Ammonites
  rationale: L’expression hébraïque « fils d’Ammon » désigne le peuple d’Ammon; l’ethnonyme français est naturel et exact.
- source_word: כִּי נָס אֲרָם
  choice: que les Araméens avaient pris la fuite
  rationale: כִּי introduit ce qu’ils constatent. אֲרָם désigne ici collectivement les forces araméennes, et le plus-que-parfait marque clairement l’antériorité de leur fuite.
- source_word: וַיָּנוּסוּ גַם הֵם מִפְּנֵי
  choice: ils s’enfuirent eux aussi devant
  rationale: « Eux aussi » restitue l’emphase comparative de גַם הֵם, tandis que « devant » convient au contexte militaire.
- source_word: אַבְשַׁי אָחִיו
  choice: Abishaï, frère de Joab
  rationale: Le suffixe de אָחִיו renvoie naturellement à Joab dans le contexte. Nommer Joab évite en français une ambiguïté référentielle artificielle.
- source_word: וַיָּבֹאוּ הָעִירָה
  choice: et rentrèrent dans la ville
  rationale: La terminaison directionnelle indique un mouvement vers l’intérieur de la ville; dans ce repli militaire, « rentrèrent » est idiomatique.
- source_word: וַיָּבֹא יוֹאָב יְרוּשָׁלִָם
  choice: Puis Joab revint à Jérusalem
  rationale: Le contexte décrit la fin de l’engagement et le retour de Joab à son point de départ. « Puis » rend la progression narrative.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les ethnonymes usuels « Ammonites » et « Araméens » rendent naturellement les désignations collectives hébraïques. Aucun appel de note n’est nécessaire, puisque le texte principal explicite sans surcharge le référent de « son frère ».
