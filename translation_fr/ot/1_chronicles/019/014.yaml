  yaml_path: translation/ot/1_chronicles/019/014.yaml
  text: So Joab and the people who were with him advanced before Aram for battle[a], and they fled before him.
translation:
  language: fr
  text: Alors Joab et les hommes qui l’accompagnaient s’avancèrent pour livrer bataille aux Araméens[a], et ceux-ci s’enfuirent devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant Aram ». Le nom propre « Aram » désigne ici les forces araméennes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: s’avancèrent
  rationale: Le verbe נגשׁ signifie « s’approcher ». Dans ce contexte militaire et avec l’indication de but qui suit, « s’avancèrent » exprime naturellement le mouvement vers l’affrontement.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: et les hommes qui l’accompagnaient
  rationale: הָעָם signifie littéralement « le peuple », mais désigne ici les combattants placés sous les ordres de Joab. « Les hommes qui l’accompagnaient » reste sobre, naturel et évite de suggérer une population civile.
- source_word: לִפְנֵי אֲרָם
  choice: aux Araméens
  rationale: L’expression signifie littéralement « devant Aram ». Dans ce récit de bataille, elle indique que Joab s’avance au-devant des forces araméennes. Le français « livrer bataille aux Araméens » rend clairement la relation hostile sans conserver un calque obscur.
- source_word: לַמִּלְחָמָה
  choice: pour livrer bataille
  rationale: La préposition לְ indique ici le but. « Pour livrer bataille » est idiomatique en français et conserve le sens militaire de מִלְחָמָה.
- source_word: וַיָּנוּסוּ
  choice: ceux-ci s’enfuirent
  rationale: נוס signifie « fuir ». Le démonstratif « ceux-ci » explicite que le sujet sous-entendu est constitué des Araméens, et non de Joab et de ses hommes, ce qui évite une ambiguïté grammaticale en français.
- source_word: מִפָּנָיו
  choice: devant lui
  rationale: L’expression signifie littéralement « loin de sa face / de sa présence ». Dans un récit militaire, « s’enfuir devant lui » est une tournure française naturelle; le suffixe singulier renvoie à Joab.
