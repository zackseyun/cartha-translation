base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/007.yaml
  text: So they hired for themselves thirty-two thousand chariots[a], and the king of Maacah with his people. They came and camped before Medeba[b], and the sons of Ammon gathered from their cities and came to battle.
translation:
  language: fr
  text: Ils engagèrent pour leur compte trente-deux mille chars[a], ainsi que le roi de Maaka avec son peuple. Ils vinrent camper devant Médeba. Les fils d’Ammon[b] se rassemblèrent, venant de leurs villes, et vinrent livrer bataille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « chars » peut aussi désigner collectivement une force de chars, et pas nécessairement seulement un nombre de véhicules pris individuellement.
    reason: lexical_alternative
  - marker: b
    text: Ou « les Ammonites ». L’hébreu dit littéralement « les fils d’Ammon », désignation ethnique courante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכְּרוּ לָהֶם
  choice: Ils engagèrent pour eux-mêmes
  rationale: Le verbe שׂכר exprime l’engagement contre paiement, sans préciser explicitement qu’il s’agit de mercenaires; לָהֶם marque ici l’avantage ou l’intérêt des sujets.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: trente-deux mille chars
  rationale: Le nombre est rendu selon l’ordre naturel du français. רֶכֶב peut désigner des chars ou, collectivement, des troupes de chars; «chars» conserve le terme concret tout en laissant ouverte sa portée collective.
- source_word: מֶלֶךְ מַעֲכָה
  choice: le roi de Maaka
  rationale: L’état construit indique le roi du territoire de Maaka. La forme «Maaka» translittère directement le nom hébreu.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: עַם signifie normalement «peuple». Même si le contexte militaire peut viser les hommes de guerre du roi, «son peuple» évite de préciser au-delà du texte.
- source_word: וַיָּבֹאוּ וַיַּחֲנוּ לִפְנֵי מֵידְבָא
  choice: Ils vinrent camper devant Médeba
  rationale: La formulation française réunit naturellement les deux verbes narratifs. לִפְנֵי exprime ici une position en face ou aux abords de la ville; «devant» préserve cette relation spatiale.
- source_word: בְנֵי עַמּוֹן
  choice: Les fils d’Ammon
  rationale: La traduction littérale conserve la désignation ethnique hébraïque et son lien explicite avec Ammon; «les Ammonites» reste une formulation française possible.
- source_word: נֶאֶסְפוּ מֵעָרֵיהֶם
  choice: se rassemblèrent, quittant leurs villes
  rationale: Le niphal de אסף indique le rassemblement. מִן marque le point de départ; cette formulation rend clairement que les groupes sortirent de leurs différentes villes pour se réunir.
- source_word: וַיָּבֹאוּ לַמִּלְחָמָה
  choice: vinrent livrer bataille
  rationale: Cette expression française naturelle restitue le mouvement vers l’affrontement sans ajouter d’issue ni de nuance absente de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le texte conserve «les fils d’Ammon» et «son peuple» afin de ne pas réduire des termes hébreux plus larges à des désignations strictement militaires. Les marqueurs de note sont placés sur les expressions qu’ils expliquent.
