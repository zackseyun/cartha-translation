  text: וַ/יַּ֣רְא אֲרָ֗ם כִּ֣י נִגְּפוּ֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים וַ/יּוֹצִ֣יאוּ אֶת אֲרָ֔ם אֲשֶׁ֖ר מֵ/עֵ֣בֶר הַ/נָּהָ֑ר וְ/שׁוֹפַ֛ךְ שַׂר צְבָ֥א הֲדַדְעֶ֖זֶר לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/016.yaml
  text: When Aram saw that they had been defeated before Israel[a], they sent messengers and brought out the Arameans who were from beyond the River[b], with Shophach the commander of Hadadezer’s army before them.
translation:
  language: fr
  text: Quand les Araméens[a] virent qu’ils avaient été battus devant Israël, ils envoyèrent des messagers et firent venir les Araméens qui se trouvaient au-delà du Fleuve[b], avec Shophak, chef de l’armée de Hadadézer, à leur tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionnellement « les Syriens » ; l’hébreu porte « Aram » ou « les Araméens ».
    reason: lexical_alternative
  - marker: b
    text: Le Fleuve désigne probablement l’Euphrate ; l’hébreu dit simplement « au-delà du Fleuve ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: les Araméens
  rationale: Le nom désigne ici collectivement le peuple ou les forces d’Aram. Le pluriel français rend naturellement les verbes pluriels qui suivent dans l’hébreu, tout en conservant le nom ancien dans la forme « Araméens ».
- source_word: נִגְּפוּ
  choice: avaient été battus
  rationale: Le nifal exprime ici une défaite militaire. « Avaient été battus » est clair et n’implique pas nécessairement une destruction totale.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: devant Israël
  rationale: Cette formulation conserve l’image hébraïque tout en restant compréhensible en français; dans le contexte, elle signifie une défaite infligée par Israël.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte diplomatique et militaire, le terme désigne des émissaires humains, et non des anges.
- source_word: וַיּוֹצִיאוּ אֶת אֲרָם
  choice: firent venir les Araméens
  rationale: Le hifil de יצא signifie littéralement « faire sortir ». Ici, il s’agit de mobiliser et d’amener des renforts araméens; « firent venir » exprime naturellement ce mouvement en français.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: au-delà du Fleuve
  rationale: La traduction garde l’expression hébraïque sans préciser dans le corps du texte que le fleuve est vraisemblablement l’Euphrate.
- source_word: שַׂר צְבָא הֲדַדְעֶזֶר
  choice: chef de l’armée de Hadadézer
  rationale: Cette expression française actuelle rend directement le titre militaire hébreu.
- source_word: לִפְנֵיהֶם
  choice: marchait à leur tête
  rationale: Littéralement « devant eux »; dans un déplacement militaire, l’expression indique que Shophak conduisait les troupes.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les passés simples conviennent au récit historique. « Araméens » permet un accord naturel avec les verbes pluriels du texte hébreu, tandis que « au-delà du Fleuve » en préserve la formulation non explicitée.
