    issue: La dernière proposition est détachée en une nouvelle phrase et mise à l’imparfait.
    rationale: Le waw hébreu coordonne Shophak aux troupes mobilisées, et « devant eux » décrit sa position à leur tête. Une coordination dans la même phrase rend mieux la séquence narrative sans ajouter une durée implicite.
  - severity: low
    issue: La note b formule l’identification du Fleuve de manière légèrement ambiguë.
    rationale: « C’est-à-dire probablement » est moins précis que d’indiquer directement que le Fleuve désigne probablement l’Euphrate, tout en maintenant que l’hébreu ne le nomme pas.
