source:
  edition: WLC
  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַ/יַּ֣עַרְכ֔וּ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/011.yaml
  text: He put the rest of the troops under the command of Abishai his brother[a], and they drew up in battle formation to meet the Ammonites.
translation:
  language: fr
  text: Il plaça le reste des troupes sous le commandement de son frère Abishaï[a], et ils se rangèrent en ordre de bataille face aux Ammonites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « donna dans la main de son frère Abishaï », expression qui signifie qu’il les confia à son autorité ou à son commandement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: le reste des troupes
  rationale: יֶתֶר désigne ce qui reste. Dans ce récit militaire, הָעָם renvoie aux combattants placés sous l’autorité de Joab ; « troupes » exprime naturellement ce sens contextuel.
- source_word: נָתַן בְּיַד
  choice: plaça ... sous le commandement de
  rationale: Littéralement « donna dans la main de », cette tournure idiomatique exprime ici le fait de confier des troupes à l’autorité d’un chef.
- source_word: אַבְשַׁי אָחִיו
  choice: son frère Abishaï
  rationale: « Abishaï » est une transcription française courante du nom hébreu ; אָחִיו précise qu’il est le frère de Joab.
- source_word: וַיַּעַרְכוּ
  choice: ils se rangèrent en ordre de bataille
  rationale: Dans un contexte militaire, ערך désigne la disposition organisée des troupes en vue du combat.
- source_word: לִקְרַאת
  choice: face à
  rationale: La préposition peut signifier « à la rencontre de » ou « en face de ». Ici, « face à » restitue avec naturel la confrontation militaire sans expliciter davantage l’hostilité.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: L’expression littérale « fils d’Ammon » fonctionne comme un ethnonyme et se rend naturellement en français par « les Ammonites ».
