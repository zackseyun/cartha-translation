  source_fidelity: Le sens général est fidèle au texte hébreu. « Combattants sur chars » rend de manière raisonnable le terme רֶכֶב, qui désigne la force de chars sans préciser strictement les conducteurs. En revanche, « aussi » dans « Il fit aussi mourir » n’est pas exprimé par le texte et ajoute une nuance inutile.
  naturalness: Le français est naturel et le passé simple convient au récit. « Le chef de l’armée » est légèrement plus idiomatique et défini que « chef de l’armée » après le nom propre.
  terminology: Les noms Aram, Israël et Shophak sont convenablement conservés. La note textuelle doit éviter de présenter comme une citation du texte des Chroniques l’ajout interprétatif « [hommes des] » ; l’hébreu dit littéralement « sept mille chariots/charioterie », expression dont le référent militaire est discuté.
