  text: וַ/יָּ֣נָס אֲרָם֮ מִ/לִּ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜יד מֵ/אֲרָ֗ם שִׁבְעַ֤ת אֲלָפִים֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וְ/אֵ֛ת שׁוֹפַ֥ךְ שַֽׂר הַ/צָּבָ֖א הֵמִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/018.yaml
  text: And Aram fled before Israel[a], and David killed seven thousand chariot warriors from Aram and forty thousand foot soldiers[b], and he put Shophach the commander of the army to death.
translation:
  language: fr
  text: Aram prit la fuite devant Israël, et David tua sept mille combattants sur chars d’Aram[a] et quarante mille fantassins. Il fit mourir Shophak[b], le chef de l’armée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le passage parallèle de 2 Samuel 10.18, on lit « sept cents chars » et « quarante mille cavaliers ». Le texte des Chroniques lit ici « sept mille chariots » (expression pouvant désigner une force de chars) et « quarante mille fantassins ».
    reason: textual_variant
  - marker: b
    text: Dans le récit parallèle de 2 Samuel 10.16, 18, Shophak est appelé Shobak.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּנָס אֲרָם
  choice: Aram prit la fuite
  rationale: Le singulier collectif « Aram » personnifie ici les forces araméennes. Cette formulation conserve le nom hébreu et reste naturelle dans un récit militaire.
- source_word: מִלִּפְנֵי יִשְׂרָאֵל
  choice: devant Israël
  rationale: L’expression hébraïque indique une fuite face à l’armée d’Israël; « devant Israël » en garde la concision et l’image.
- source_word: וַיַּהֲרֹג דָּוִיד
  choice: David tua
  rationale: Le verbe הרג signifie directement « tuer »; le passé simple convient au registre narratif.
- source_word: שִׁבְעַת אֲלָפִים רֶכֶב
  choice: sept mille combattants sur chars
  rationale: רֶכֶב désigne littéralement les chars ou la force de chars. Dans ce dénombrement de personnes tuées, le terme fonctionne vraisemblablement par métonymie; « combattants sur chars » n’impose pas qu’il s’agisse uniquement des conducteurs.
- source_word: וְאַרְבָּעִים אֶלֶף אִישׁ רַגְלִי
  choice: quarante mille fantassins
  rationale: אִישׁ רַגְלִי, littéralement « homme à pied », est l’expression militaire courante pour un fantassin.
- source_word: שׁוֹפַךְ
  choice: Shophak
  rationale: Translittération française de la forme propre aux Chroniques; la forme différente du récit parallèle est signalée en note.
- source_word: שַׂר הַצָּבָא
  choice: chef de l’armée
  rationale: Cette expression rend clairement le grade militaire sans archaïsme.
- source_word: הֵמִית
  choice: fit aussi mourir
  rationale: Le hiphil de מות signifie « faire mourir, mettre à mort ». La formulation le distingue du verbe הרג employé plus tôt, tout en restant naturelle.
