source:
  edition: WLC
  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֧ה פְנֵי הַ/מִּלְחָמָ֛ה אֵלָ֖י/ו פָּנִ֣ים וְ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כָּל בָּחוּר֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/010.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose some of the best men from all Israel and arranged them to meet Aram.
translation:
  language: fr
  text: Quand Joab vit que le combat se présentait contre lui de face et par-derrière, il choisit parmi tous les hommes d’élite d’Israël[a] et les rangea en formation pour affronter les forces d’Aram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi tous les guerriers choisis d’Israël ». Le terme hébreu peut désigner des jeunes hommes ou, dans ce contexte, des combattants de choix.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Aram » ; le nom désigne ici les forces araméennes.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le sens narratif courant est « voir »; dans ce contexte, le verbe implique naturellement que Joab prend conscience de la situation tactique, sans qu’il soit nécessaire de remplacer l’image hébraïque par « comprit ».
- source_word: פְנֵי הַמִּלְחָמָה אֵלָיו פָּנִים וְאָחוֹר
  choice: il devait faire face au combat à la fois devant et derrière lui
  rationale: Cette formulation française naturelle rend la menace militaire venant de deux directions. Elle conserve le contraste « devant et derrière » sans reproduire littéralement l’expression peu idiomatique « la face du combat ».
- source_word: וַיִּבְחַר
  choice: il choisit
  rationale: Équivalent direct et naturel du verbe בחר dans ce récit.
- source_word: מִכָּל בָּחוּר בְּיִשְׂרָאֵל
  choice: parmi tous les hommes d’élite d’Israël
  rationale: Dans ce contexte militaire, בָּחוּר désigne vraisemblablement des combattants sélectionnés ou de choix. « Parmi » rend la valeur partitive de מִן sans préciser un nombre absent du texte.
- source_word: וַיַּעֲרֹךְ
  choice: les rangea en formation
  rationale: En contexte militaire, ערך signifie disposer ou ranger des troupes en ordre de bataille. L’ajout « en formation » explicite cette nuance sans surcharger le texte.
- source_word: לִקְרַאת אֲרָם
  choice: pour affronter les forces d’Aram
  rationale: לִקְרַאת exprime ici une rencontre hostile. Le texte nomme littéralement Aram; « les forces d’Aram » rend clairement la métonymie militaire tout en conservant le nom hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe privilégie une formulation militaire claire tout en maintenant les deux directions de l’attaque et le nom ancien « Aram ».
