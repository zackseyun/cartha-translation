  text: וַ/יֹּ֨אמֶר דָּוִ֜יד אֶֽעֱשֶׂה חֶ֣סֶד עִם חָנ֣וּן בֶּן נָחָ֗שׁ כִּֽי עָשָׂ֨ה אָבִ֤י/ו עִמִּ/י֙ חֶ֔סֶד וַ/יִּשְׁלַ֥ח דָּוִ֛יד מַלְאָכִ֖ים לְ/נַחֲמ֣/וֹ עַל אָבִ֑י/ו וַ/יָּבֹאוּ֩ עַבְדֵ֨י דָוִ֜יד אֶל אֶ֧רֶץ בְּנֵי עַמּ֛וֹן אֶל חָנ֖וּן לְ/נַחֲמֽ/וֹ־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, because his father showed kindness to me.” So David sent messengers to comfort him concerning his father. And David’s servants came to the land of the Ammonites, to Hanun, to comfort him.
translation:
  language: fr
  text: 'David dit : « Je ferai preuve de bonté envers Hanoun, fils de Nahash, puisque son père a fait preuve de bonté envers moi. » David envoya donc des messagers pour le consoler au sujet de son père[a]. Les serviteurs de David arrivèrent au pays des Ammonites, auprès de Hanoun, pour le consoler.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour le consoler au sujet de son père ». Dans ce contexte, l’expression indique que la consolation est occasionnée par la mort de son père.'
    reason: clarification_lexicale
lexical_decisions:
- source_word: חֶסֶד
  choice: bonté
  rationale: Dans ce contexte politique et interpersonnel, le terme désigne une bienveillance loyale manifestée entre deux parties. « Bonté » convient naturellement aux deux occurrences sans imposer ici un sens exclusivement lié à l’alliance.
- source_word: עָשָׂה חֶסֶד עִם
  choice: témoigner de la bonté à
  rationale: Cette formulation française rend naturellement l’expression idiomatique hébraïque, plus littéralement « faire bonté avec ».
- source_word: מַלְאָכִים
  choice: messagers
  rationale: Il s’agit de représentants humains envoyés par David. « Messagers » reste proche du terme hébreu sans préciser plus que le texte leur statut diplomatique.
- source_word: לְנַחֲמוֹ
  choice: pour le consoler
  rationale: Dans un contexte de deuil, le verbe désigne l’action d’apporter du réconfort à une personne endeuillée.
- source_word: עַל אָבִיו
  choice: de la mort de son père
  rationale: Avec le verbe « consoler », la préposition indique ici le motif du deuil. La mort est implicite dans l’hébreu et explicitée en français pour rendre clairement l’expression.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: le pays des Ammonites
  rationale: « Ammonites » est l’ethnonyme français usuel, et « pays » exprime naturellement le sens géographique de אֶרֶץ.
- source_word: עַבְדֵי דָוִיד
  choice: les serviteurs de David
  rationale: Le terme désigne des hommes au service de David. « Serviteurs » en est le rendu direct, sans ajouter le statut plus précis de fonctionnaires ou d’émissaires.
- source_word: וַיֹּאמֶר ... וַיִּשְׁלַח ... וַיָּבֹאוּ
  choice: David dit… David envoya donc… Les serviteurs de David arrivèrent
  rationale: La succession des formes narratives hébraïques est rendue par des passés simples; « donc » marque naturellement que l’envoi met à exécution l’intention annoncée.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. La répétition de « consoler » est conservée, comme dans l’hébreu. Le marqueur [a] est placé après l’explicitation concernée.
