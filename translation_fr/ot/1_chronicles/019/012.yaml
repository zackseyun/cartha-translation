  text: וַ/יֹּ֗אמֶר אִם תֶּחֱזַ֤ק מִמֶּ֨/נִּי֙ אֲרָ֔ם וְ/הָיִ֥יתָ לִּ֖/י לִ/תְשׁוּעָ֑ה וְ/אִם בְּנֵ֥י עַמּ֛וֹן יֶֽחֶזְק֥וּ מִמְּ/ךָ֖ וְ/הוֹשַׁעְתִּֽי/ךָ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/012.yaml
  text: And he said[a], “If Aram is too strong for me, then you shall be my salvation; but if the Ammonites are too strong for you[b], then I will save you.”
translation:
  language: fr
  text: 'Il dit : « Si les Araméens sont trop forts pour moi, tu viendras à mon secours ; et si les Ammonites sont trop forts pour toi, je te secourrai. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרָם
  choice: les Araméens
  rationale: Dans ce contexte militaire, le nom collectif désigne les forces araméennes. Le français emploie naturellement l’ethnonyme au pluriel, en accord avec l’usage du chapitre.
- source_word: תֶּחֱזַק / יֶחֶזְקוּ (חזק avec מן)
  choice: sont trop forts pour
  rationale: La construction comparative exprime ici une supériorité militaire. « Être trop fort pour » rend naturellement l’idée de surpasser l’adversaire sans affirmer nécessairement une victoire déjà acquise.
- source_word: וְהָיִיתָ לִּי לִתְשׁוּעָה
  choice: tu viendras à mon secours
  rationale: Littéralement, « tu seras pour moi en vue du salut/de la délivrance ». Dans une coordination militaire, « venir à mon secours » restitue clairement et dignement l’idiome.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Ethnonyme français courant correspondant à l’expression littérale « les fils d’Ammon ».
- source_word: וְהוֹשַׁעְתִּיךָ (ישע, hiphil)
  choice: je te secourrai
  rationale: Le verbe signifie sauver ou délivrer. « Secourir » convient au soutien mutuel sur le champ de bataille et fait écho à « secours » dans la proposition précédente.
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le passé simple rend de façon naturelle et soutenue la progression du récit hébreu en français.
theological_decisions: []
