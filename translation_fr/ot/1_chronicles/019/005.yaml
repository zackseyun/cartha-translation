  verdict: revise
  source_fidelity: La traduction rend fidèlement la progression du récit, l’état de honte intense des hommes, le séjour à Jéricho et le retour après la repousse des barbes. Toutefois, « des gens » explicite dans le texte principal l’objet non exprimé de וַיִּשְׁלַח; l’ellipse peut être conservée naturellement en français.
  naturalness: Le français est globalement moderne et fluide. « David envoya à leur rencontre » est une ellipse narrative recevable et plus fidèle. Après « jusqu’à ce que », le subjonctif présent « repoussent » exprime plus naturellement l’action attendue que le subjonctif passé « aient repoussé ».
  terminology: « Profondément humiliés », « Jéricho », « le roi » et « barbes » conviennent au contexte et au registre. Les notes conservent utilement les nuances de honte et de déshonneur ainsi que l’objet implicite de « envoya ».
