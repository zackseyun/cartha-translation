base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/005.yaml
  text: They went and told David about the men[a], and he sent to meet them, because the men were greatly humiliated. And the king said, “Stay in Jericho until your beards have grown back[b], then return.”
translation:
  language: fr
  text: 'Ils allèrent informer David au sujet de ces hommes. David envoya à leur rencontre[a], car ces hommes étaient profondément humiliés[b]. Le roi dit : « Restez à Jéricho jusqu’à ce que vos barbes repoussent, puis revenez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il envoya à leur rencontre » ; l’hébreu ne précise pas qui David envoya.'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « profondément honteux » ou « totalement déshonorés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיַּגִּידוּ לְדָוִיד עַל הָאֲנָשִׁים
  choice: Ils allèrent informer David au sujet de ces hommes
  rationale: Le pluriel des verbes est conservé sans identifier davantage ceux qui apportent la nouvelle. « Informer David au sujet de ces hommes » rend naturellement הגיד avec ל et על, sans préciser le contenu du rapport au-delà de l’hébreu.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: David envoya des gens à leur rencontre[a]
  rationale: Le français exige ici un complément plus explicite que l’hébreu. « Des gens » exprime sobrement les agents sous-entendus, sans les définir comme messagers dans le texte principal; la note signale l’ellipse originale.
- source_word: נִכְלָמִים מְאֹד
  choice: profondément humiliés[b]
  rationale: Le participe niphal de כלם décrit l’état de personnes couvertes de honte ou publiquement déshonorées. Dans le contexte de l’outrage subi, « profondément humiliés » restitue à la fois la honte sociale et l’intensité de מְאֹד.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: Restez à Jéricho
  rationale: Dans ce contexte, ישׁב signifie demeurer ou rester plutôt que simplement s’asseoir. Le nom de lieu reçoit sa forme française usuelle, « Jéricho ».
- source_word: עַד אֲשֶׁר יְצַמַּח זְקַנְכֶם
  choice: jusqu’à ce que vos barbes aient repoussé
  rationale: צמח signifie pousser ou croître. « Repoussé » rend explicite, de façon naturelle et contextuellement certaine, qu’elles avaient été coupées. Le pluriel français distributif convient à plusieurs hommes.
- source_word: וְשַׁבְתֶּם
  choice: puis revenez
  rationale: Après la proposition introduite par עַד אֲשֶׁר, la forme coordonnée indique l’action suivante. « Puis » exprime clairement cette succession.
- source_word: הַמֶּלֶךְ
  choice: Le roi
  rationale: Le titre défini est maintenu comme dans l’hébreu, au lieu d’être remplacé par le nom de David.
