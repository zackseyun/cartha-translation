    rationale: Le verbe hébreu וַיִּשְׁלַח n’exprime pas son objet. Même si des envoyés sont contextuellement implicites, « des gens » les introduit explicitement. Le français permet de garder l’ellipse par « David envoya à leur rencontre ».
