source:
  edition: WLC
  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗יד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֣א אֲלֵ/הֶ֔ם וַֽ/יַּעֲרֹ֖ךְ אֲלֵ/הֶ֑ם וַ/יַּעֲרֹ֨ךְ דָּוִ֜יד לִ/קְרַ֤את אֲרָם֙ מִלְחָמָ֔ה וַ/יִּֽלָּחֲמ֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, came against them, and drew up in battle formation against them. Then David drew up for battle to meet Aram, and they fought with him.
translation:
  language: fr
  text: Quand David en fut informé, il rassembla tout Israël, traversa le Jourdain, marcha contre eux et se rangea en ordre de bataille face à eux. Puis David se rangea en ordre de bataille pour affronter Aram, et ils combattirent contre lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec lui ». Dans ce contexte, l’expression hébraïque signifie qu’ils combattirent contre David.'
    reason: La préposition hébraïque עִם signifie habituellement « avec », mais, associée ici au verbe « combattre », elle désigne la personne affrontée.
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִיד
  choice: Quand David en fut informé
  rationale: La tournure passive conserve l’absence d’agent exprimé et relie naturellement l’information aux événements précédents.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: il rassembla tout Israël
  rationale: « Rassembler » rend simplement le verbe אָסַף tout en laissant le contexte indiquer qu’il s’agit d’une mobilisation militaire.
- source_word: וַיַּעֲבֹר הַיַּרְדֵּן
  choice: traversa le Jourdain
  rationale: Formulation française directe et idiomatique correspondant au mouvement exprimé par עבר.
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: marcha contre eux
  rationale: Dans ce contexte militaire, la préposition אֶל indique une progression hostile; « marcha contre » l’exprime sans ajouter de détail tactique.
- source_word: וַיַּעֲרֹךְ אֲלֵיהֶם
  choice: se rangea en ordre de bataille face à eux
  rationale: Le verbe ערך a ici son sens militaire de mise en ordre des forces. La forme pronominale française supplée naturellement l’objet implicite sans nommer explicitement les troupes.
- source_word: וַיַּעֲרֹךְ דָּוִיד לִקְרַאת אֲרָם מִלְחָמָה
  choice: David se rangea en ordre de bataille pour affronter Aram
  rationale: Cette formulation maintient la répétition de ערך, rend מִלְחָמָה par « en ordre de bataille » et conserve à לִקְרַאת l’idée d’aller à la rencontre de l’adversaire.
- source_word: אֲרָם
  choice: Aram
  rationale: Le nom propre hébreu est conservé plutôt que remplacé par le nom géopolitique plus tardif « Syrie » ou par l’interprétation collective « les Araméens ».
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: ils combattirent contre lui
  rationale: Avec le verbe לחם, עִם peut introduire l’adversaire. Le contexte identifie clairement David comme celui contre qui le combat est mené; « avec lui » risquerait en français de suggérer une alliance.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « se rangea en ordre de bataille » reflète celle du verbe hébreu ערך. Les pronoms pluriels demeurent tels que dans le texte source, sans expliciter leur référent au-delà de ce que permet le contexte.
