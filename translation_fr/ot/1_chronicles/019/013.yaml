source:
  edition: WLC
  text: חֲזַ֤ק וְ/נִֽתְחַזְּקָה֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה הַ/טּ֥וֹב בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/013.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: fr
  text: Sois fort, et fortifions-nous[a] pour notre peuple et pour les villes de notre Dieu. Que Yahweh fasse ce qui est bon à ses yeux[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « montrons-nous forts ». La forme hébraïque est réflexive et intensive.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Yahweh fera ce qui est bon à ses yeux. » La forme hébraïque peut avoir ici une valeur soit volitive, soit prédictive.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: Sois fort
  rationale: Impératif qal masculin singulier de חזק. « Sois fort » rend directement l’exhortation à la force et au courage, tout en conservant son lien lexical avec le verbe suivant.
- source_word: וְנִתְחַזְּקָה
  choice: et fortifions-nous
  rationale: Cohortatif hitpael à la première personne du pluriel. La forme pronominale française restitue la nuance réflexive et l’engagement résolu des combattants sans alourdir la phrase.
- source_word: בְּעַד
  choice: pour
  rationale: Dans ce contexte militaire, la préposition exprime l’action menée en faveur de quelqu’un ou pour sa défense. « Pour » est naturel et suffisamment large en français.
- source_word: עַמֵּנוּ
  choice: notre peuple
  rationale: עַם désigne ici le peuple dans son ensemble, et non seulement l’armée.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: les villes de notre Dieu
  rationale: Cette traduction transparente du groupe construit conserve l’idée que ces villes appartiennent à Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: ce qui est bon à ses yeux
  rationale: La formulation conserve l’image hébraïque tout en restant claire en français moderne.
- source_word: יַעֲשֶׂה
  choice: Que … fasse
  rationale: 'Dans la suite des exhortations, l’inaccompli peut recevoir une valeur volitive : Joab confie à Dieu l’issue du combat. La note préserve aussi la lecture prédictive possible.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël. La translittération le distingue d’un simple titre.
- issue: Valeur modale de יַעֲשֶׂה dans la dernière proposition
  choice: Que Yahweh fasse ce qui est bon à ses yeux
  alternative: Yahweh fera ce qui est bon à ses yeux
  rationale: La lecture volitive s’accorde avec les exhortations précédentes et exprime la remise de l’issue à Dieu, sans effacer dans la note la possible valeur prédictive de l’inaccompli.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier de « Sois fort » respecte l’adresse de Joab à Abishaï, tandis que « fortifions-nous » inclut les deux hommes et leurs troupes. La répétition du radical « fort » reflète celle de l’hébreu.
