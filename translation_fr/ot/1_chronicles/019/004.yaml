  text: וַ/יִּקַּ֨ח חָנ֜וּן אֶת עַבְדֵ֤י דָוִיד֙ וַֽ/יְגַלְּחֵ֔/ם וַ/יִּכְרֹ֧ת אֶת מַדְוֵי/הֶ֛ם בַּ/חֵ֖צִי עַד הַ/מִּפְשָׂעָ֑ה וַֽ/יְשַׁלְּחֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/004.yaml
  text: So Hanun took David’s servants[a], shaved them, cut their garments in half up to the hips[b], and sent them away.
translation:
  language: fr
  text: Hanoun prit les serviteurs de David[a], les rasa, coupa leurs vêtements par le milieu jusqu’aux fesses[b], puis les renvoya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le récit parallèle de 2 Samuel 10.4 précise que Hanoun leur rasa la moitié de la barbe. Ici, le livre des Chroniques dit seulement qu’il « les rasa ».
    reason: cross_reference
  - marker: b
    text: Le terme hébreu rare désigne la région des fesses, ou la partie postérieure du corps. La coupe des vêtements était ainsi publiquement humiliante.
    reason: lexical_clarification
lexical_decisions:
- source_word: עַבְדֵי
  choice: serviteurs
  rationale: Le nom peut désigner des serviteurs ou des esclaves. Ici, il s’agit d’hommes au service du roi David, envoyés en mission; « serviteurs » convient au contexte sans préciser indûment leur statut juridique.
- source_word: וַיְגַלְּחֵם
  choice: les rasa
  rationale: Le verbe signifie « raser ». Le texte des Chroniques ne nomme pas la partie rasée; la formulation conserve cette ellipse, sans importer la précision de 2 Samuel 10.4.
- source_word: מַדְוֵיהֶם
  choice: leurs vêtements
  rationale: Le terme désigne des vêtements, éventuellement une tenue officielle. « Vêtements » est naturel, digne et suffisamment large.
- source_word: בַּחֵצִי
  choice: à mi-hauteur
  rationale: Dans cette construction, l’expression indique que les vêtements sont coupés à mi-longueur. Cette formulation française évite l’idée peu naturelle de vêtements divisés longitudinalement en deux.
- source_word: עַד הַמִּפְשָׂעָה
  choice: jusqu’aux fesses
  rationale: Le nom rare désigne la région postérieure, celle des fesses. La traduction explicite la localisation et l’humiliation publique impliquée, sans l’atténuer par « hanches ».
- source_word: וַיְשַׁלְּחֵם
  choice: puis les renvoya
  rationale: Le verbe signifie « envoyer ». Dans le contexte, « renvoyer » exprime naturellement leur départ imposé après l’humiliation.
