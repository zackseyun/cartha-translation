  text: וַ/יִּשְׁמַ֖ע דָּוִ֑יד וַ/יִּשְׁלַח֙ אֶת יוֹאָ֔ב וְ/אֵ֥ת כָּל צָבָ֖א הַ/גִּבּוֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/008.yaml
  text: When David heard, he sent Joab and all the army of the mighty men.
translation:
  language: fr
  text: Lorsque David l’apprit[a], il envoya Joab et toute l’armée des guerriers valeureux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en fut informé » ou « en entendit parler ».'
    reason: lexical_alternative
  - marker: b
    text: Les « guerriers valeureux » peuvent désigner les vaillants combattants de David ou sa troupe d’élite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: l’apprit
  rationale: Dans ce contexte narratif, שׁמע indique que David reçoit la nouvelle. « L’apprit » exprime naturellement ce sens en français, tandis que la note conserve les rendus plus littéraux possibles.
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Équivalent courant et précis de שלח dans un récit militaire, sans ajouter l’idée plus marquée de déploiement.
- source_word: יוֹאָב
  choice: Joab
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: כָּל
  choice: toute
  rationale: כָּל porte ici sur l’ensemble du groupe nominal qui suit ; « toute » en rend directement la totalité.
- source_word: צָבָא
  choice: armée
  rationale: Dans ce contexte militaire, צָבָא désigne une force combattante organisée ; « armée » est clair et naturel.
- source_word: הַגִּבּוֹרִים
  choice: les guerriers valeureux
  rationale: גִּבּוֹרִים peut désigner des hommes puissants ou vaillants et, dans ce contexte, des combattants d’élite. « Guerriers valeureux » préserve à la fois le caractère militaire et la nuance de bravoure.
- source_word: וְאֵת כָּל צָבָא הַגִּבּוֹרִים
  choice: et toute l’armée des guerriers valeureux
  rationale: Ce rendu conserve le lien construit entre « armée » et « guerriers valeureux », ainsi que le second complément direct coordonné à Joab, sans réduire l’expression à « toute son armée ».
