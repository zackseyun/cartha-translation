  text: וַ/יֵּצְאוּ֙ בְּנֵ֣י עַמּ֔וֹן וַ/יַּֽעַרְכ֥וּ מִלְחָמָ֖ה פֶּ֣תַח הָ/עִ֑יר וְ/הַ/מְּלָכִ֣ים אֲשֶׁר בָּ֔אוּ לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/009.yaml
  text: And the sons of Ammon came out and drew up for battle at the entrance of the city[d][c][b][a], while the kings who had come were by themselves in the field.
translation:
  language: fr
  text: Les Ammonites sortirent et se rangèrent en ordre de bataille à l’entrée de la ville[a], tandis que les rois qui étaient venus se tenaient à part dans la campagne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit plus littéralement : « les fils d’Ammon ». Le mot rendu par « entrée » désigne une ouverture ou un accès, et non spécifiquement une porte.'
    reason: lexical_alternative
  - marker: b
    text: Les rois alliés étaient postés séparément des forces ammonites, à l’extérieur de la ville.
    reason: contextual_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: sortirent
  rationale: Le verbe יצא désigne ici la sortie des troupes hors de la ville; le passé simple convient à la narration historique en français.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Littéralement « les fils d’Ammon »; l’ethnonyme « les Ammonites » est la formulation naturelle et non ambiguë en français moderne.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: se rangèrent en ordre de bataille
  rationale: L’expression hébraïque décrit la disposition des troupes en formation de combat, et non le début effectif des hostilités.
- source_word: פֶּתַח הָעִיר
  choice: à l’entrée de la ville
  rationale: פֶּתַח signifie « ouverture, entrée »; cette traduction évite de préciser « porte », terme possible dans le contexte mais non employé ici.
- source_word: וְהַמְּלָכִים אֲשֶׁר בָּאוּ
  choice: tandis que les rois qui étaient venus
  rationale: « Tandis que » exprime naturellement le contraste spatial entre les deux groupes; le plus-que-parfait situe leur arrivée avant leur déploiement.
- source_word: לְבַדָּם
  choice: se tenaient à part
  rationale: Le mot marque leur séparation d’avec les forces ammonites, sans suggérer que chaque roi était isolé ou dépourvu de troupes.
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: שָׂדֶה peut désigner le champ ou l’espace ouvert hors de la ville; « dans la campagne » rend ici le lieu de déploiement sans évoquer nécessairement une parcelle cultivée.
