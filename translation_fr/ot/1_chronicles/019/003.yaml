base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/003.yaml
  text: But the princes of the Ammonites said to Hanun[a], “Is David honoring your father in your sight because he has sent comforters to you? Have not his servants come to you in order to search out, to overthrow[b], and to spy out the land?”
translation:
  language: fr
  text: 'Mais les princes des Ammonites dirent à Hanoun : « Penses-tu que David honore ton père parce qu’il t’a envoyé des personnes chargées de te consoler ? Ses serviteurs ne sont-ils pas venus auprès de toi pour examiner, renverser[a] et espionner le pays ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retourner ». Le verbe hébreu peut signifier retourner ou renverser ; dans ce contexte, il peut évoquer une action hostile ou subversive contre le pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: princes
  rationale: Le terme désigne ici les hauts dignitaires ou chefs politiques ammonites. « Princes » conserve le rang élevé et le cadre de cour.
- source_word: הַמְכַבֵּד ... בְּעֵינֶיךָ
  choice: Penses-tu que ... honore
  rationale: La tournure française rend naturellement l’idiome hébreu « à tes yeux », qui porte sur la perception ou le jugement de Hanoun, sans en faire une affirmation objective.
- source_word: מְנַחֲמִים
  choice: des gens pour te consoler
  rationale: Le participe désigne les personnes envoyées afin d’apporter une consolation après un décès. Cette formulation est plus naturelle en français moderne que « consolateurs ».
- source_word: לַחְקֹר
  choice: explorer
  rationale: Le verbe signifie examiner ou reconnaître minutieusement. « Explorer » convient à la progression vers l’espionnage sans imposer un sens technique.
- source_word: וְלַהֲפֹךְ
  choice: bouleverser
  rationale: Le verbe signifie littéralement retourner ou renverser. « Bouleverser » préserve l’ambiguïté entre inspection intrusive, désorganisation et subversion hostile.
- source_word: וּלְרַגֵּל
  choice: espionner
  rationale: Au piel, le verbe désigne l’activité d’espionnage ou de reconnaissance clandestine.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte politique, אֶרֶץ désigne le territoire ammonite ; « pays » est naturel et clair en français.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans un contexte royal, le mot peut désigner des serviteurs ou des agents du roi. La traduction directe évite de préciser indûment leur fonction.
