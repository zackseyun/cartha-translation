translation_notes:
  register: Français international moderne, digne et narratif. La première question est reformulée idiomatiquement pour exprimer le jugement de Hanoun. « Des gens pour te consoler » évite le terme peu naturel « consolateurs », tandis que « bouleverser » maintient l’étendue sémantique du verbe hébreu.
