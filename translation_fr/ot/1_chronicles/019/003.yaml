  - severity: medium
    issue: « Bouleverser le pays » pour וּלְהַפֹּךְ
    rationale: Cette formulation est sémantiquement vague et idiomatiquement moins heureuse avec « le pays ». « Renverser » reflète plus directement le champ de « retourner/renverser » et son emploi potentiellement subversif dans le contexte.
  - severity: low
    issue: Registre de « des gens » et « chez toi »
    rationale: Ces expressions restent correctes, mais « des personnes chargées de te consoler » et « auprès de toi » conviennent mieux à une mission de cour et au registre narratif soutenu.
