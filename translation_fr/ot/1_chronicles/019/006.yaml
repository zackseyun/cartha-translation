source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י הִֽתְבָּאֲשׁ֖וּ עִם דָּוִ֑יד וַ/יִּשְׁלַ֣ח חָ֠נוּן וּ/בְנֵ֨י עַמּ֜וֹן אֶ֣לֶף כִּכַּר כֶּ֗סֶף לִ/שְׂכֹּ֣ר לָ֠/הֶם מִן אֲרַ֨ם נַהֲרַ֜יִם וּ/מִן אֲרַ֤ם מַעֲכָה֙ וּ/מִ/צּוֹבָ֔ה רֶ֖כֶב וּ/פָרָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/006.yaml
  text: When the Ammonites saw that they had become odious to David[a], Hanun and the Ammonites sent a thousand talents of silver to hire for themselves chariots and horsemen from Aram-naharaim, from Aram-maacah[b], and from Zobah.
translation:
  language: fr
  text: Les Ammonites virent qu’ils s’étaient rendus odieux à David[a]. Hanoun et les Ammonites envoyèrent mille talents d’argent pour engager à leur service des chars et des cavaliers venant d’Aram-Naharaïm[b], d’Aram-Maaka et de Tsoba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque signifie littéralement « ils s’étaient rendus puants auprès de David » : ils s’étaient rendus offensants ou détestables à ses yeux.'
    reason: lexical_alternative
  - marker: b
    text: Aram-Naharaïm est traditionnellement compris comme « Aram des deux fleuves », c’est-à-dire la Mésopotamie.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: virent
  rationale: Le sens premier de ראה est « voir » ; ici, le verbe exprime aussi la prise de conscience de leur situation. « Virent » conserve l’expression hébraïque et demeure naturel en français.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: L’ethnonyme français rend naturellement l’hébreu littéral « fils d’Ammon » lorsqu’il désigne ce peuple.
- source_word: הִתְבָּאֲשׁוּ עִם דָּוִיד
  choice: s’étaient rendus odieux à David
  rationale: Le hitpael de באש signifie littéralement qu’ils s’étaient « rendus puants » auprès de David, image idiomatique indiquant qu’ils étaient devenus détestables ou gravement offensants à ses yeux. La formulation choisie conserve le caractère réfléchi et la force de l’expression sans produire un français artificiel.
- source_word: וַיִּשְׁלַח
  choice: envoyèrent
  rationale: Le verbe שלח porte ici sur les mille talents d’argent envoyés pour payer le recrutement des forces étrangères.
- source_word: אֶלֶף כִּכַּר כֶּסֶף
  choice: mille talents d’argent
  rationale: כִּכָּר désigne une unité ancienne de poids conventionnellement appelée « talent ». Une conversion moderne serait incertaine et effacerait la mesure historique du texte.
- source_word: לִשְׂכֹּר לָהֶם
  choice: afin de louer à leur service
  rationale: שׂכר signifie « louer, engager contre paiement », et לָהֶם marque le bénéfice des Ammonites. Cette tournure exprime qu’ils recrutaient ces forces pour leur propre usage.
- source_word: אֲרַם נַהֲרַיִם
  choice: Aram-Naharaïm
  rationale: La translittération traite l’expression comme un nom géographique tout en laissant à une note l’explication traditionnelle « Aram des deux fleuves ».
- source_word: אֲרַם מַעֲכָה
  choice: Aram-Maaka
  rationale: Cette translittération moderne conserve le caractère de nom régional composé.
- source_word: מִצּוֹבָה
  choice: de Tsoba
  rationale: Tsoba est la forme française translittérée du nom propre צובה.
- source_word: רֶכֶב וּפָרָשִׁים
  choice: des chars et des cavaliers
  rationale: רֶכֶב est ici un collectif militaire désignant les chars, tandis que פָרָשִׁים désigne des troupes montées. Les pluriels français rendent clairement les forces engagées.
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et accessible. Les ethnonymes sont rendus sous leur forme française naturelle, tandis que les noms géographiques sont translittérés. La phrase conserve les deux sujets coordonnés, Hanoun et les Ammonites, ainsi que l’idée que les forces étrangères furent recrutées pour leur service.
