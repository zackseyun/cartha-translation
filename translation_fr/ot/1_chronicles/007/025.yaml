  text: Rephah his son[a], Resheph, Telah his son, Tahan his son.
translation:
  language: fr
  text: Refah, son fils[a], Réshef, Télah, son fils, et Tahan, son fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les généalogies hébraïques omettent souvent le verbe explicite; il s’agit ici d’une liste de descendants : « Refah, son fils, Réshef, Télah, son fils, et Tahan, son fils. »'
    reason: cultural_note
lexical_decisions:
- source_word: רֶפַח
  choice: Refah
  rationale: Nom propre translittéré sous une forme lisible en français; le ח final est rendu par « h » conformément à l’usage courant pour les noms bibliques.
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le nom בֵּן muni du suffixe masculin singulier signifie littéralement « son fils ». La répétition de la formule généalogique est conservée.
- source_word: רֶשֶׁף
  choice: Réshef
  rationale: Dans cette généalogie, le terme fonctionne comme un nom de personne; il est donc translittéré plutôt que traduit selon ses sens nominaux possibles ailleurs.
- source_word: תֶלַח
  choice: Téla
  rationale: Nom propre translittéré en français; le ח final n’est pas fortement marqué afin de garder une forme naturelle et conforme aux conventions françaises usuelles.
- source_word: תַחַן
  choice: Tahan
  rationale: Nom propre translittéré sous une forme française lisible, avec « h » pour signaler la consonne ח sans recourir à un signe diacritique spécialisé.
- source_word: וְ
  choice: ', / et'
  rationale: La conjonction préfixée relie les membres de la suite généalogique. Des virgules et un « et » final donnent en français une énumération naturelle tout en conservant sa structure.
theological_decisions: []
