  text: וּ/בֶן הֵ֖לֶם אָחִ֑י/ו צוֹפַ֥ח וְ/יִמְנָ֖ע וְ/שֵׁ֥לֶשׁ וְ/עָמָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/035.yaml
  text: 'The son of Helem his brother: Zophah[a], Imna, Shelesh, and Amal.'
translation:
  language: fr
  text: 'Et le fils d’Hélem, son frère : Tsophah[a], Yimna, Shélesh et Amal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi translittérer ce nom « Tsophakh », selon la manière de rendre la dernière lettre hébraïque ח.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: Et le fils de
  rationale: Le nom בֶּן est au singulier et introduit une relation généalogique. La conjonction וּ est conservée par « Et », tandis que l’élision donne naturellement « d’Hélem » dans la phrase complète.
- source_word: הֵלֶם
  choice: Hélem
  rationale: Nom propre translittéré selon un usage français clair, avec accent pour guider la prononciation.
- source_word: אָחִיו
  choice: son frère
  rationale: Le nom de parenté porte un suffixe masculin singulier. Cette formulation préserve la relation et l’ambiguïté de son antécédent sans l’expliciter.
- source_word: צוֹפַח
  choice: Tsophah
  rationale: Translittération française lisible du nom propre, צ étant rendu par « ts ». Le h final représente ח selon une convention courante; une autre convention est signalée en note.
- source_word: וְיִמְנָע
  choice: Yimna
  rationale: Nom propre translittéré directement. La coordination hébraïque est rendue naturellement par la ponctuation de l’énumération française.
- source_word: וְשֵׁלֶשׁ
  choice: Shélesh
  rationale: Nom propre translittéré de façon à distinguer שׁ par « sh » et à faciliter une lecture française.
- source_word: וְעָמָל
  choice: et Amal
  rationale: La conjonction précédant le dernier nom est rendue par « et », conformément à l’usage français dans une énumération.
theological_decisions:
- issue: Le singulier בֶּן devant une liste de quatre noms
  choice: Conserver « le fils » au singulier
  alternative: « les fils » au pluriel
  rationale: Le texte massorétique porte explicitement le singulier. Même si le contexte généalogique et l’énumération pourraient inviter à comprendre un collectif ou à corriger au pluriel, la traduction conserve la tension textuelle sans harmonisation silencieuse.
translation_notes:
  register: Français moderne, sobre et digne, adapté au style généalogique. Les noms sont translittérés de manière cohérente et lisible pour un public francophone international. La formulation conserve le singulier inhabituel du texte hébreu et ne précise pas l’antécédent ambigu de « son frère ».
