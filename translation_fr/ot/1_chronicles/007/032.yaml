- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans une généalogie, le hifil de ילד exprime le fait de devenir père ou d’engendrer. « Engendra » est concis, digne et idiomatique dans ce contexte.
- source_word: יַפְלֵט
  choice: Yafleth
  rationale: Translittération française du nom propre hébreu, avec y pour י et th pour la consonne finale ת.
- source_word: שׁוֹמֵר
  choice: Shomer
  rationale: Translittération directe du nom propre selon la vocalisation du texte massorétique.
- source_word: חוֹתָם
  choice: Hotam
  rationale: Translittération française lisible du nom propre hébreu ; le h initial représente la consonne ח sans imposer une prononciation anglaise.
- source_word: שׁוּעָא
  choice: Shoua
  rationale: Translittération adaptée au français, où « ou » représente naturellement le son /u/.
- source_word: אֲחוֹתָם
  choice: leur sœur
  rationale: 'Le nom « sœur » porte un suffixe masculin pluriel : Shoua est présentée comme la sœur des hommes nommés auparavant.'
