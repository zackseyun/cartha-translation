  text: וּ/בְנֵ֥י אוּלָ֖ם בְּדָ֑ן אֵ֚לֶּה בְּנֵ֣י גִלְעָ֔ד בֶּן מָכִ֖יר בֶּן מְנַשֶּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/017.yaml
  text: 'And the sons of Ulam: Bedan. These were the sons of Gilead son of Machir[a], son of Manasseh.'
translation:
  language: fr
  text: 'Et les fils d’Oulam : Bedân. Ceux-ci étaient les fils de Galaad, fils de Makir[a], fils de Manassé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ceux-ci sont/étaient les fils de Galaad… » Cette proposition peut servir de résumé généalogique, rattachant la lignée d’Oulam à Galaad, puis à Makir et à Manassé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Et les fils de
  rationale: La conjonction ו assure ici une simple liaison dans la généalogie. Le pluriel construit בְנֵי est rendu par la formule généalogique transparente « les fils de », malgré l’unique nom qui suit.
- source_word: אוּלָם
  choice: Oullam
  rationale: Nom propre translittéré selon un usage français courant, avec « ou » pour rendre la voyelle initiale.
- source_word: בְּדָן
  choice: Bedân
  rationale: Nom propre translittéré ; l’accent circonflexe indique la voyelle longue dans une graphie française biblique usuelle.
- source_word: אֵלֶּה
  choice: Ceux-ci étaient
  rationale: Le démonstratif hébreu signifie littéralement « ceux-ci ». Le verbe « étaient », absent de l’hébreu, est suppléé pour produire une phrase française naturelle dans ce cadre généalogique rétrospectif.
- source_word: בְּנֵי גִלְעָד
  choice: les fils de Galaad
  rationale: La traduction conserve l’expression généalogique formelle « fils de » plutôt que de l’expliciter par « descendants de », afin de préserver la formulation et l’ambiguïté de l’hébreu.
- source_word: בֶּן מָכִיר
  choice: fils de Makir
  rationale: Lien généalogique rendu formellement ; le nom propre est translittéré selon l’usage français.
- source_word: בֶּן מְנַשֶּׁה
  choice: fils de Manassé
  rationale: Lien généalogique rendu formellement ; « Manassé » suit la forme française biblique établie.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne, adapté au style condensé d’une liste généalogique. La formulation conserve le pluriel « les fils » devant le seul nom Bedân et maintient l’ambiguïté structurelle de la proposition récapitulative.
