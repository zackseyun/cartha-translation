lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: étaient
  rationale: Dans cette liste généalogique, la forme de היה introduit naturellement les personnes nommées; « étaient » restitue sobrement cette fonction.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le terme peut désigner plus largement des descendants dans une généalogie, mais le contexte immédiat et les noms masculins favorisent ici le sens direct « fils ».
- source_word: שְׁמִידָע
  choice: Shemida
  rationale: Transcription française lisible du nom hébreu, sans en traduire le sens.
- source_word: אַחְיָן
  choice: Ahian
  rationale: Transcription directe et lisible du nom propre hébreu.
- source_word: שֶׁכֶם
  choice: Sichem
  rationale: Forme française traditionnelle et largement reconnue du nom biblique; la syntaxe montre qu'il s'agit ici d'une personne.
- source_word: לִקְחִי
  choice: Likhi
  rationale: La graphie « kh » représente de façon accessible la consonne hébraïque ח tout en distinguant le nom de « Liki ».
- source_word: אֲנִיעָם
  choice: Aniam
  rationale: Transcription directe du nom propre hébreu.
