  text: The sons of Shemida were Ahian[a], Shechem, Likhi, and Aniam.
translation:
  language: fr
  text: Les fils[a] de Shemida étaient Ahian, Sichem, Likhi et Aniam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les généalogies, « fils » peut aussi désigner plus largement des descendants ; ici, le contexte immédiat favorise toutefois le sens de fils.
