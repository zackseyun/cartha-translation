base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/033.yaml
  text: 'The sons of Japhlet: Pasach[a], Bimhal, and Ashvath[b]. These were the sons of Japhlet.'
translation:
  language: fr
  text: 'Les fils de Yaflet : Pasak, Bimhal et Ashvath. Ce sont les fils de Yaflet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי
  choice: les fils de
  rationale: Dans cette liste généalogique, le pluriel construit de בֵּן désigne naturellement les fils immédiats; le terme plus large « descendants » n’est pas nécessaire ici.
- source_word: יַפְלֵט
  choice: Yafleth
  rationale: Le nom propre est translittéré en français; « Yafleth » représente le yod initial et la consonne finale tout en restant lisible.
- source_word: פָּסַךְ
  choice: Pasak
  rationale: La finale כ est représentée par « k » dans cette translittération française du nom propre.
- source_word: וּבִמְהָל
  choice: Bimhal
  rationale: La conjonction préfixée est rendue séparément, et le nom propre est translittéré « Bimhal ».
- source_word: וְעַשְׁוָת
  choice: Ashvath
  rationale: La conjonction est rendue séparément; « Ashvath » offre une translittération française lisible du nom.
- source_word: אֵלֶּה
  choice: Ce sont
  rationale: Le présent reproduit directement la formule récapitulative hébraïque et convient au style généalogique français.
- source_word: בְּנֵי יַפְלֵט
  choice: les fils de Yafleth
  rationale: La répétition intégrale de la formule finale préserve la structure emphatique et récapitulative de l’hébreu.
