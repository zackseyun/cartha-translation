  yaml_path: translation/ot/1_chronicles/007/020.yaml
  text: 'The sons of Ephraim: Shuthelah[a], and Bered his son, and Tahath his son, and Eleadah his son, and Tahath his son.'
translation:
  language: fr
  text: 'Les fils d’Éphraïm : Shoutélah[a], et Béred, son fils, et Tahath, son fils, et Éléada, son fils, et Tahath, son fils.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les généalogies, le mot hébreu traduit par « fils » peut parfois désigner un descendant plus éloigné, mais le texte dit littéralement « son fils » après chacun des noms suivants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶפְרַיִם
  choice: Les fils d’Éphraïm
  rationale: Le pluriel construit de בֵּן introduit la lignée. En français généalogique, la conjonction initiale peut naturellement ne pas être exprimée.
- source_word: שׁוּתָלַח
  choice: Shoutélah
  rationale: Nom propre translittéré selon des conventions françaises lisibles, avec « ou » pour le son /u/.
- source_word: וּבֶרֶד
  choice: puis Béred
  rationale: La conjonction hébraïque relie ici l’étape suivante de la lignée; « puis » rend clairement la succession généalogique sans faire de Béred un second fils direct d’Éphraïm.
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le nom בֵּן avec suffixe masculin singulier signifie littéralement « son fils ». Une éventuelle portée plus large, « descendant », est signalée en note plutôt qu’introduite dans le texte.
- source_word: וְתַחַת
  choice: Tahath
  rationale: Dans ce contexte, תַחַת est un nom propre et non la préposition ou le nom commun signifiant « sous ».
- source_word: וְאֶלְעָדָה
  choice: Éléada
  rationale: Nom propre translittéré dans une forme adaptée à la lecture française.
- source_word: וְתַחַת בְּנוֹ
  choice: et Tahath, son fils
  rationale: La formule généalogique répétée est conservée afin de respecter la structure et le rythme de l’hébreu.
