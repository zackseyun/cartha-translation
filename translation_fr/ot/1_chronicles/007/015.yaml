source:
  edition: WLC
  text: וּ/מָכִ֞יר לָקַ֤ח אִשָּׁה֙ לְ/חֻפִּ֣ים וּ/לְ/שֻׁפִּ֔ים וְ/שֵׁ֤ם אֲחֹת/וֹ֙ מַעֲכָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖י צְלָפְחָ֑ד וַ/תִּהְיֶ֥נָה לִ/צְלָפְחָ֖ד בָּנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/015.yaml
  text: Machir took a wife for Huppim and for Shuppim. The name of his sister was Maacah[a], and the name of the second was Zelophehad; and Zelophehad had daughters.
translation:
  language: fr
  text: Makir prit une femme pour Houppim et pour Shouppim. Sa sœur s’appelait Maaka, et le second[a] s’appelait Tselofhad. Tselofhad eut des filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le deuxième fils s’appelait Tselofhad ». L’hébreu dit simplement « le second », sans préciser le référent.
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח אִשָּׁה
  choice: prit une femme
  rationale: L’expression hébraïque signifie couramment « prendre une femme » ou « se marier ». Ici, les compléments introduits par לְ indiquent que Makir agit en faveur de Houppim et de Shouppim; la formulation française conserve donc cette construction inhabituelle sans faire de Makir l’époux.
- source_word: לְחֻפִּים וּלְשֻׁפִּים
  choice: pour Houppim et pour Shouppim
  rationale: La répétition de la préposition לְ est rendue naturellement par « pour … et pour … ». Le texte paraît évoquer un mariage arrangé par Makir, mais il reste trop elliptique pour expliciter davantage cette interprétation.
- source_word: וְשֵׁם אֲחֹתוֹ מַעֲכָה
  choice: Sa sœur s’appelait Maaka
  rationale: Cette tournure française naturelle rend la formule hébraïque « le nom de sa sœur était Maaka ». Le possessif demeure aussi peu explicite que dans l’hébreu quant à son antécédent.
- source_word: וְשֵׁם הַשֵּׁנִי צְלָפְחָד
  choice: et le second s’appelait Tselofhad
  rationale: L’hébreu dit littéralement « le second » sans nom exprimé. La traduction conserve cette formulation elliptique plutôt que d’ajouter « fils »; une lecture explicative est signalée en note.
- source_word: וַתִּהְיֶנָה לִצְלָפְחָד בָּנוֹת
  choice: Tselofhad eut des filles
  rationale: 'Cette formulation idiomatique rend la construction existentielle de possession et conserve l’information généalogique essentielle: Tselofhad avait des filles.'
theological_decisions:
- issue: Ambiguïté généalogique de הַשֵּׁנִי (« le second »)
  choice: Conserver « le second » dans le texte sans ajouter de nom sous-entendu
  alternative: « le deuxième fils » ou « l’autre »
  rationale: Le texte hébreu est condensé et ne précise pas le référent. Ne pas ajouter « fils » évite de présenter comme certaine une reconstruction généalogique interprétative.
- issue: Antécédent du possessif dans « sa sœur »
  choice: Conserver le possessif non explicité
  alternative: « La sœur de Makir s’appelait Maaka »
  rationale: Même si Makir est un antécédent plausible, l’hébreu ne répète pas son nom. La traduction préserve donc la légère ambiguïté syntaxique au lieu de la résoudre silencieusement.
translation_notes:
  register: Français moderne, sobre et digne. Les noms propres suivent une translittération lisible proche de l’hébreu. La tournure inhabituelle « prit une femme pour » est maintenue parce qu’elle reflète l’ellipse et la difficulté du texte source.
