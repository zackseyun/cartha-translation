  naturalness: Le français est clair, moderne et d’un registre adapté à une liste territoriale biblique. La répétition de « les localités qui en dépendaient » reflète utilement la répétition hébraïque sans lourdeur excessive. « C’est là qu’habitaient » reprend naturellement l’ensemble des lieux mentionnés.
