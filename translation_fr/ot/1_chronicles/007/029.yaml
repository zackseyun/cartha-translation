source:
  edition: WLC
  text: וְ/עַל יְדֵ֣י בְנֵי מְנַשֶּׁ֗ה בֵּית שְׁאָ֤ן וּ/בְנֹתֶ֨י/הָ֙ תַּעְנַ֣ךְ וּ/בְנֹתֶ֔י/הָ מְגִדּ֥וֹ וּ/בְנוֹתֶ֖י/הָ דּ֣וֹר וּ/בְנוֹתֶ֑י/הָ בְּ/אֵ֨לֶּה֙ יָשְׁב֔וּ בְּנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/029.yaml
  text: And along the borders of the sons of Manasseh were Beth-shean and its daughter towns[a], Taanach and its daughter towns, Megiddo and its daughter towns, Dor and its daughter towns[b]. In these lived the sons of Joseph son of Israel.
translation:
  language: fr
  text: Le long du territoire des descendants de Manassé se trouvaient Beth-Shéân et les localités qui en dépendaient[a], Taanak et les localités qui en dépendaient, Meguiddo et les localités qui en dépendaient, ainsi que Dor et les localités qui en dépendaient. C’est là qu’habitaient les descendants de Joseph, fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « ses filles » : cette expression hébraïque désigne les villages ou les localités dépendant d’une ville principale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יְדֵי
  choice: Le long du territoire de
  rationale: Dans cette liste géographique, l’expression situe les villes à côté du territoire de Manassé ou sur sa bordure. Cette formulation française exprime naturellement cette proximité territoriale sans retenir le sens littéral inadapté « sur les mains de ».
- source_word: בְנֵי מְנַשֶּׁה
  choice: les descendants de Manassé
  rationale: Dans un contexte tribal, « fils de Manassé » désigne collectivement ses descendants. « Descendants » est clair en français moderne sans altérer le rapport généalogique.
- source_word: בֵּית שְׁאָן
  choice: Beth-Shéân
  rationale: Transcription française courante du nom de lieu, reflétant la vocalisation massorétique.
- source_word: וּבְנֹתֶיהָ / וּבְנוֹתֶיהָ
  choice: et les localités qui en dépendaient
  rationale: 'Littéralement « et ses filles » : la formule désigne les agglomérations secondaires rattachées à une ville principale. La traduction rend le sens institutionnel et géographique en français naturel, tandis que la note conserve la métaphore hébraïque.'
- source_word: תַּעְנַךְ
  choice: Taanak
  rationale: Transcription française intelligible du nom de lieu hébreu.
- source_word: מְגִדּוֹ
  choice: Meguiddo
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom de lieu.
- source_word: דּוֹר
  choice: Dor
  rationale: Transcription directe et usuelle du nom de lieu.
- source_word: בְאֵלֶּה
  choice: C’est là
  rationale: Le démonstratif reprend l’ensemble des villes et localités qui viennent d’être énumérées. « C’est là » est idiomatique et conserve cette référence collective.
- source_word: יָשְׁבוּ
  choice: habitaient
  rationale: Le verbe exprime ici la résidence dans ces localités. « Habitaient » convient au registre narratif et n’implique pas nécessairement une première installation.
- source_word: בְּנֵי יוֹסֵף
  choice: les descendants de Joseph
  rationale: L’expression généalogique « fils de Joseph » désigne ici les tribus issues de Joseph. « Descendants » évite de faire croire qu’il s’agit uniquement de ses fils immédiats.
- source_word: בֶּן יִשְׂרָאֵל
  choice: fils d’Israël
  rationale: L’apposition identifie Joseph par sa filiation et est conservée sans ajout interprétatif.
theological_decisions: []
