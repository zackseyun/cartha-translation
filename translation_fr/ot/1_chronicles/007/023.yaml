base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/023.yaml
  text: Then he went in to his wife[a], and she conceived and bore a son, and he called his name Beriah[c][b], because disaster had been in his house.
translation:
  language: fr
  text: Puis il s’unit à sa femme. Elle devint enceinte et mit au monde un fils. Il l’appela Beria[a], car le malheur était dans sa maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Beria fait écho au mot hébreu traduit ici par « malheur ».
    reason: wordplay
  - marker: b
    text: 'Littéralement : « car le malheur était dans sa maison » ; « maison » peut ici désigner sa maisonnée ou sa famille.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיָּבֹא אֶל אִשְׁתּוֹ
  choice: il s’unit à sa femme
  rationale: L’expression hébraïque est un euphémisme conventionnel désignant les relations sexuelles. « S’unit à sa femme » en rend clairement et dignement le sens en français moderne.
- source_word: וַתַּהַר
  choice: elle devint enceinte
  rationale: Formulation naturelle en français actuel pour la conception dans un récit de naissance.
- source_word: וַתֵּלֶד בֵּן
  choice: mit au monde un fils
  rationale: Expression française courante et digne, fidèle à la concision du récit.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ בְּרִיעָה
  choice: il l’appela Beria
  rationale: Rend naturellement en français la formule hébraïque d’attribution du nom.
- source_word: בְּרִיעָה
  choice: Beria
  rationale: Transcription française usuelle du nom hébreu, qui fait écho au terme traduit par « malheur ».
- source_word: כִּי
  choice: car
  rationale: Introduit avec naturel la raison donnée au choix du nom.
- source_word: בְרָעָה
  choice: le malheur
  rationale: Dans ce contexte, le mot désigne une calamité ou une situation funeste, et non le mal moral.
- source_word: הָיְתָה בְּבֵיתוֹ
  choice: avait frappé sa maison
  rationale: Cette formulation idiomatique exprime qu’un malheur avait touché la famille d’Éphraïm. La note conserve le sens plus littéral de l’hébreu.
- source_word: בְּבֵיתוֹ
  choice: sa maison
  rationale: « Maison » préserve l’image hébraïque tout en pouvant désigner la maisonnée ou la famille.
theological_decisions:
- issue: Sens de רָעָה dans le contexte
  choice: malheur, calamité ayant touché la maisonnée
  alternative: mal moral
  rationale: Le contexte immédiat évoque la mort violente des fils d’Éphraïm et son deuil ; le terme désigne donc ici l’adversité, sans jugement moral.
translation_notes:
  register: Français international moderne, narratif et digne. Le découpage en trois phrases évite une longue coordination peu naturelle en français. L’euphémisme sexuel reste discret mais compréhensible, et le jeu de mots hébreu est signalé sans lui attribuer une étymologie plus précise que le texte.
