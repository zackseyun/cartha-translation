  text: בְּנֵ֣י אָשֵׁ֗ר יִמְנָ֧ה וְ/יִשְׁוָ֛ה וְ/יִשְׁוִ֥י וּ/בְרִיעָ֖ה וְ/שֶׂ֥רַח אֲחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/030.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah, and Serah their sister.'
translation:
  language: fr
  text: 'Les fils d’Aser : Imna[a], Ishva, Ishvi et Beria, ainsi que leur sœur Sérah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les graphies de ces noms varient selon les traductions : Imna peut aussi être écrit Jimna, Ishva peut apparaître sous la forme Ishoua, et Ishvi sous la forme Ishoui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit signifie littéralement « les fils de ». Le contexte énumère ici les enfants immédiats d’Aser plutôt que ses descendants au sens large.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forme française traditionnelle et actuelle du nom propre hébreu.
- source_word: יִמְנָה
  choice: Imna
  rationale: Translittération française naturelle de la vocalisation massorétique, sans h final non prononcé.
- source_word: יִשְׁוָה
  choice: Ishva
  rationale: Translittération proche de la forme consonantique et de la vocalisation du texte massorétique.
- source_word: יִשְׁוִי
  choice: Ishvi
  rationale: Translittération directe de la vocalisation massorétique.
- source_word: בְרִיעָה
  choice: Beria
  rationale: Forme française naturelle du nom propre hébreu.
- source_word: שֶׂרַח
  choice: Sérah
  rationale: La graphie distingue ce nom de Sara tout en représentant clairement sa prononciation en français.
- source_word: אֲחוֹתָם
  choice: leur sœur
  rationale: Le suffixe masculin pluriel signifie que Sérah est la sœur des fils précédemment énumérés.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et adapté au registre généalogique. « Ainsi que » relie naturellement la sœur aux quatre fils sans laisser entendre qu’elle est elle-même comprise parmi les « fils ».
