  yaml_path: translation/ot/1_chronicles/007/001.yaml
  text: 'The sons of Issachar: Tola[a], Puah, Jashub[b], and Shimron—four.'
translation:
  language: fr
  text: 'Les fils d’Issacar : Tola, Poua[a], Yashoub[b] et Shimron — quatre en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Poua ; des listes généalogiques parallèles portent la forme « Pouva ».'
    reason: alternative_reading
  - marker: b
    text: 'Hébreu : Yashoub ; en Genèse 46.13, la liste parallèle porte « Job ».'
    reason: cross_reference
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: Les fils de
  rationale: La construction introduit la généalogie de la tribu suivante. En français, « Les fils de » constitue un intitulé de liste naturel; la conjonction et la préposition hébraïques n’ont pas besoin d’être rendues séparément.
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Nom propre rendu selon la forme française biblique courante.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Nom propre translittéré sous sa forme française usuelle.
- source_word: וּ/פוּאָה
  choice: Poua
  rationale: Le texte massorétique des Chroniques porte la forme vocalisée Puʾah, rendue naturellement « Poua » en français.
- source_word: ישיב
  choice: Yashoub
  rationale: Le texte consonantique de ce verset correspond à Yashoub; cette forme est conservée plutôt que d’être harmonisée avec le nom parallèle d’Isvi en Genèse 46.13.
- source_word: וְ/שִׁמְרוֹן
  choice: et Shimron
  rationale: Le nom propre et la conjonction finale sont rendus directement.
- source_word: אַרְבָּעָה
  choice: quatre en tout
  rationale: Le nombre récapitule les quatre fils énumérés. « En tout » explicite naturellement en français sa fonction récapitulative sans modifier le sens.
