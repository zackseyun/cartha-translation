source:
  edition: WLC
  text: וּ/בְנֵ֣י בְרִיעָ֔ה חֶ֖בֶר וּ/מַלְכִּיאֵ֑ל ה֖וּא אֲבִ֥י ברזות׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/031.yaml
  text: 'The sons of Beriah: Heber and Malchiel[b][a]; he was the father of Birzaith.'
translation:
  language: fr
  text: 'Fils de Béria : Héber et Malkiel. Celui-ci fut le père[a] de Birzaïth[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ancêtre de » ou « le fondateur de ». Dans les généalogies, « père de » peut désigner le fondateur d’un clan ou d’une localité plutôt que le père biologique direct.
    reason: lexical_alternative
  - marker: b
    text: La lecture et la transcription de ce nom rare sont incertaines ; on trouve aussi des formes correspondant à « Birzoth » ou « Berazoth ».
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בְרִיעָה
  choice: Fils de Béria
  rationale: La construction généalogique introduit les descendants de Béria. En français, « Fils de Béria » convient naturellement à une liste et le contexte permet de ne pas rendre séparément la conjonction initiale.
- source_word: חֶבֶר
  choice: Héber
  rationale: Transcription française traditionnelle du nom propre hébreu.
- source_word: וּמַלְכִּיאֵל
  choice: et Malkiel
  rationale: Le nom propre est transcrit selon un usage français clair, et la conjonction hébraïque est rendue par « et ».
- source_word: הוּא
  choice: Celui-ci
  rationale: Le pronom reprend naturellement en français le dernier homme nommé, Malkiel, tout en conservant la structure de reprise du texte hébreu.
- source_word: אֲבִי
  choice: le père de
  rationale: Cette traduction formelle préserve l’expression généalogique hébraïque sans décider si elle désigne une paternité immédiate, une ascendance ou un rapport de fondation.
- source_word: ברזות
  choice: Birzaïth
  rationale: Le terme rare, probablement un nom de lieu ou de groupe, est conservé comme nom propre dans une transcription française prudente plutôt que remplacé par une interprétation.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et adapté au style d’une généalogie. « Celui-ci » évite la lourdeur d’un second nom tout en indiquant clairement la reprise du dernier antécédent. Les accents et les graphies des noms suivent des conventions françaises lisibles.
