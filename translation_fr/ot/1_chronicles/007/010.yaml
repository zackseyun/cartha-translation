  text: וּ/בְנֵ֥י יְדִיעֲאֵ֖ל בִּלְהָ֑ן וּ/בְנֵ֣י בִלְהָ֗ן יעיש וּ֠/בִנְיָמִן וְ/אֵה֤וּד וּֽ/כְנַעֲנָה֙ וְ/זֵיתָ֔ן וְ/תַרְשִׁ֖ישׁ וַ/אֲחִישָֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/010.yaml
  text: 'And the sons of Jediael: Bilhan. And the sons of Bilhan: Jeush[a], Benjamin, Ehud, Chenaanah, Zethan, Tarshish, and Ahishahar.'
translation:
  language: fr
  text: Les fils de Yediaël furent Bilhan. Les fils de Bilhan furent Yéoush[a], Benjamin, Éhoud, Kenaana, Zétan, Tarsis et Ahishahar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme hébraïque du premier nom est inhabituelle (יעיש). Yéoush correspond à une identification possible avec un nom plus familier; Yaaïsh ou Yaïsh sont aussi possibles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Fils de
  rationale: Dans cette généalogie, בְּנֵי introduit naturellement les fils d’un homme. L’omission de « et les » produit en français une liste généalogique fluide sans perdre le rapport de filiation.
- source_word: יְדִיעֲאֵל
  choice: Yediaël
  rationale: Translittération française moderne du nom hébreu, avec tréma pour distinguer les voyelles.
- source_word: בִּלְהָן
  choice: Bilhan
  rationale: Translittération directe du nom propre.
- source_word: וּבְנֵי בִלְהָן
  choice: 'Fils de Bilhan :'
  rationale: La formule généalogique répétée est conservée, tandis que la coordination hébraïque est omise comme peu naturelle au début d’une nouvelle proposition nominale en français.
- source_word: יעיש
  choice: Yéoush
  rationale: La graphie hébraïque est inhabituelle, mais semble désigner le nom ailleurs vocalisé יְעוּשׁ. « Yéoush » en donne une translittération française plausible, tout en signalant l’incertitude en note.
- source_word: וּבִנְיָמִן
  choice: Benjamin
  rationale: Forme française biblique courante du nom propre.
- source_word: וְאֵהוּד
  choice: Éhoud
  rationale: Forme française qui représente naturellement la prononciation hébraïque du nom.
- source_word: וּכְנַעֲנָה
  choice: Kenaana
  rationale: Translittération du nom propre כְּנַעֲנָה, distincte du nom français « Canaan »; la succession des voyelles reflète les syllabes hébraïques.
- source_word: וְזֵיתָן
  choice: Zétan
  rationale: Translittération française concise du nom propre, où צ est rendu par « z » selon l’usage biblique français fréquent.
- source_word: וְתַרְשִׁישׁ
  choice: Tarsis
  rationale: Forme française traditionnelle de תַּרְשִׁישׁ; le contexte généalogique indique ici un nom de personne.
- source_word: וַאֲחִישָׁחַר
  choice: Ahishahar
  rationale: Translittération assez proche de la forme hébraïque, avec « sh » pour שׁ afin de rendre distinctement les éléments du nom.
theological_decisions: []
translation_notes:
  register: Style généalogique concis, digne et lisible. Les noms suivent des conventions françaises modernes tout en restant proches de l’hébreu. La répétition de « Fils de » préserve la structure de la source; les conjonctions initiales, très naturelles en hébreu, ne sont pas reproduites mécaniquement.
