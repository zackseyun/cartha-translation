base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/002.yaml
  text: 'The sons of Tola: Uzzi[a], Rephaiah, Jeriel, Jahmai, Ibsam, and Samuel, heads of their fathers’ houses belonging to Tola, mighty men of valor according to their generations[c][b]. Their number in the days of David was twenty-two thousand six hundred.'
translation:
  language: fr
  text: 'Les fils de Tola : Ouzzi, Rephaya, Yeriël, Yakhmaï, Yibsam et Samuel ; chefs de leurs maisons ancestrales de Tola, hommes vaillants selon leurs lignées[c][b]. Leur nombre, à l’époque de David, était de vingt-deux mille six cents.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: L’expression peut aussi se traduire par « vaillants guerriers » ou « hommes de valeur ».
    reason: lexical_alternative
  - marker: c
    text: Ou « selon leurs générations » ou « d’après leurs registres généalogiques ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי תוֹלָע
  choice: Fils de Tola
  rationale: Dans cette liste généalogique, בנים désigne naturellement les fils ou descendants directs de Tola. La conjonction initiale n’est pas exprimée afin d’obtenir une ouverture naturelle en français.
- source_word: עֻזִּי וּרְפָיָה וִירִיאֵל וְיַחְמַי וְיִבְשָׂם וּשְׁמוּאֵל
  choice: Ouzzi, Rephaya, Yeriël, Yahmaï, Yibsam et Samuel
  rationale: Translittérations françaises lisibles qui suivent les formes hébraïques vocalisées; « Samuel » conserve la forme française consacrée.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: chefs de leurs familles ancestrales
  rationale: רָאשִׁים désigne les responsables ou chefs; בֵית אָבוֹת est une unité familiale fondée sur l’ascendance. « Familles ancestrales » rend le sens social plus clairement que le calque « maisons de leurs pères ».
- source_word: לְתוֹלָע
  choice: dans la lignée de Tola
  rationale: La préposition rattache ces chefs et leurs groupes familiaux à Tola. « Dans la lignée de » explicite cette affiliation généalogique sans la réduire à une simple relation de possession.
- source_word: גִּבּוֹרֵי חַיִל
  choice: hommes vaillants
  rationale: L’expression peut évoquer à la fois la bravoure, la capacité et la valeur militaire. « Hommes vaillants » conserve cette amplitude sans imposer exclusivement le sens de guerriers.
- source_word: לְתֹלְדוֹתָם
  choice: recensés selon leurs généalogies
  rationale: תּוֹלְדוֹת renvoie ici aux lignées ou registres généalogiques; dans ce contexte de dénombrement, « recensés selon leurs généalogies » relie naturellement la classification familiale au total qui suit.
- source_word: מִסְפָּרָם בִּימֵי דָוִיד עֶשְׂרִים וּשְׁנַיִם אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: À l’époque de David, ils étaient au nombre de vingt-deux mille six cents
  rationale: Rend directement le dénombrement et situe celui-ci pendant le règne ou la période de David, sans préciser davantage ce que l’hébreu ne précise pas.
