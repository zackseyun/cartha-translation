  source_fidelity: 'La traduction rend correctement la liste, l’affiliation à Tola, la qualification de גִּבּוֹרֵי חַיִל et le total. Toutefois, « recensés » n’est pas exprimé par le texte hébreu : לְתֹלְדוֹתָם qualifie les hommes selon leurs lignées/généalogies, tandis que le dénombrement est formulé ensuite. Le nom Yahmaï omet en outre la consonne ח, rendue ici par « kh » dans une translittération proche de l’hébreu.'
