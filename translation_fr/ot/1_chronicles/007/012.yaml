  text: And Shuppim and Huppim were the sons of Ir[b][a]; Hushim was the son of Aher.
translation:
  language: fr
  text: Shouppim et Houppim[a] étaient fils d’Ir ; Houshim était fils d’Aher[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans des passages généalogiques parallèles, ces noms présentent des formes différentes ; Shoupham et Houpham sont notamment possibles.
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu porte littéralement « Houshim, les fils d’Aher » : « fils » y est au pluriel, alors que Houshim est singulier. Aher peut être un nom propre ou signifier « un autre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֻׁפִּם
  choice: Shouppim
  rationale: Nom propre translittéré selon une forme naturelle en français ; la conjonction initiale est rendue par « et » entre les deux premiers noms.
- source_word: וְחֻפִּם
  choice: Houppim
  rationale: Nom propre translittéré ; la graphie française en « Hou- » représente la consonne initiale et la voyelle massorétique sans reprendre mécaniquement l’orthographe anglaise.
- source_word: בְּנֵי עִיר
  choice: étaient fils d’Ir
  rationale: Dans cette liste généalogique sans verbe exprimé, « étaient » fournit une phrase française naturelle. « Fils » conserve le sens généalogique ordinaire de בְּנֵי, et עִיר est traité comme un nom propre.
- source_word: חֻשִׁם
  choice: Houshim
  rationale: Translittération française du nom propre hébreu.
- source_word: בְּנֵי אַחֵר
  choice: était fils d’Aher
  rationale: Le texte porte littéralement le pluriel « fils de » avec le nom singulier Houshim. Le corps du texte adopte une formulation française lisible tout en signalant l’irrégularité dans une note ; אַחֵר est compris comme un nom propre, sans exclure l’autre analyse possible.
theological_decisions:
- issue: Valeur de אַחֵר et discordance entre חֻשִׁם singulier et בְּנֵי pluriel
  choice: « Houshim était fils d’Aher » dans le texte, avec une note exposant la difficulté
  alternative: « Houshim, fils d’un autre » ou, littéralement, « Houshim, fils d’Aher » avec maintien inexpliqué du pluriel hébreu
  rationale: La syntaxe hébraïque est difficile. La lecture de אַחֵר comme nom propre convient à la forme pointée et au cadre généalogique, mais la traduction ne doit pas dissimuler que le mot peut aussi signifier « un autre » et que « fils » est morphologiquement pluriel.
translation_notes:
  register: Français international moderne, sobre et adapté au style condensé d’une généalogie. Les noms sont translittérés selon des conventions françaises lisibles. La formulation principale reste fluide, tandis que les notes préservent les variantes onomastiques et la difficulté syntaxique réelle du texte massorétique.
