  text: וּ/בְנֵ֖י שָׁ֑מֶר אֲחִ֥י ו/רוהגה יחבה וַ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/034.yaml
  text: 'And the sons of Shemer: Ahi[a], Rohgah, Jehubbah[b], and Aram.'
translation:
  language: fr
  text: 'Les fils[a] de Shémer : Ahi, Rohga, Yehoubba[b] et Aram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les généalogies hébraïques, l’expression « fils de » peut désigner des descendants masculins ou des membres d’un clan, et pas seulement des fils immédiats.
    reason: cultural_note
  - marker: b
    text: Le nom hébreu est aussi transcrit « Yehubba » ou, dans certaines traductions, « Hubba » ou « Jehubbah ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן introduit ici une liste généalogique. « Les fils de » est naturel en français et conserve la formulation hébraïque, qui peut aussi désigner plus largement des descendants ou des membres d’un clan.
- source_word: שָׁמֶר
  choice: Shémer
  rationale: Translittération française moderne du nom propre hébreu, avec un accent facilitant la prononciation.
- source_word: אֲחִי
  choice: Ahi
  rationale: Dans cette liste généalogique, le terme fonctionne comme un nom propre. La translittération « Ahi » évite de le traduire comme le nom commun « frère ».
- source_word: וְרוֹהֲגָה
  choice: Rohga
  rationale: Translittération française concise du nom propre; la conjonction préfixée est rendue par la coordination de la liste.
- source_word: יְחֻבָּה
  choice: Yehoubba
  rationale: 'Translittération adaptée au français: « Y » représente le yod initial, « ou » la voyelle /u/, et le double « b » reflète le redoublement consonantique traditionnellement indiqué.'
- source_word: וַאֲרָם
  choice: et Aram
  rationale: Le nom אֲרָם est directement translittéré « Aram »; la conjonction préfixée est rendue par « et ».
