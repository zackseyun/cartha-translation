  text: And Ephraim their father mourned for many days[a], and his brothers came to comfort him.
translation:
  language: fr
  text: Éphraïm, leur père, fut en deuil pendant de nombreux jours, et ses frères vinrent le consoler.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַבֵּל
  choice: porta le deuil
  rationale: Le hitpael de אבל désigne le fait d’entrer dans le deuil ou de mener deuil, ici après la mort rapportée au verset précédent. « Porta le deuil » exprime clairement ce contexte en français naturel.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante.
- source_word: אֲבִיהֶם
  choice: leur père
  rationale: Le nom avec suffixe masculin pluriel identifie Éphraïm comme le père des fils mentionnés dans le contexte immédiat.
- source_word: יָמִים רַבִּים
  choice: pendant de nombreux jours
  rationale: Cette expression hébraïque marque une durée; « pendant » rend explicitement et naturellement cette valeur temporelle.
- source_word: וַיָּבֹאוּ
  choice: vinrent
  rationale: Dans ce récit, בוא décrit l’arrivée des frères auprès d’Éphraïm; « vinrent » est la formulation française la plus directe.
- source_word: אֶחָיו
  choice: ses frères
  rationale: Le sens ordinaire du terme est « frères ». Le contexte ne justifie pas de lui substituer le terme plus large « proches » ou « parents ».
- source_word: לְנַחֲמוֹ
  choice: le consoler
  rationale: Dans ce contexte de deuil, le piel de נחם signifie apporter consolation ou réconfort. « Consoler » est idiomatique et précis en français.
