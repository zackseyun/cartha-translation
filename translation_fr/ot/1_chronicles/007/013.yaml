  text: בְּנֵ֣י נַפְתָּלִ֗י יַחֲצִיאֵ֧ל וְ/גוּנִ֛י וְ/יֵ֥צֶר וְ/שַׁלּ֖וּם בְּנֵ֥י בִלְהָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/013.yaml
  text: 'The sons of Naphtali: Jahziel[a], Guni, Jezer, and Shallum—the sons of Bilhah.'
translation:
  language: fr
  text: 'Fils de Nephtali : Yahtséel[a], Gouni, Yétser et Shalloum — fils de Bilha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En Genèse 46.24, ce nom est écrit « Shillem » ; ici, les Chroniques ont « Shalloum ».
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: Fils de Nephtali
  rationale: Le pluriel construit de בֵּן désigne ici directement les fils de Nephtali, quatre hommes nommés dans cette liste généalogique. « Nephtali » est la forme française traditionnelle du nom.
- source_word: יַחֲצִיאֵל
  choice: Yahtséel
  rationale: Translittération française lisible qui représente les consonnes et la vocalisation du nom hébreu dans les Chroniques.
- source_word: גוּנִי
  choice: Gouni
  rationale: Translittération adaptée aux conventions phonétiques françaises, où « ou » rend la voyelle /u/.
- source_word: יֵצֶר
  choice: Yétser
  rationale: Translittération française du nom, avec « ts » pour צ et un Y initial pour י.
- source_word: שַׁלּוּם
  choice: Shalloum
  rationale: La traduction suit la forme du texte massorétique des Chroniques, Shalloum, sans l'harmoniser avec la forme différente de Genèse 46.24.
- source_word: בְּנֵי בִלְהָה
  choice: fils de Bilha
  rationale: Cette apposition généalogique rattache les hommes nommés à la lignée de Bilha. La formulation brève conserve la structure elliptique de l'hébreu.
