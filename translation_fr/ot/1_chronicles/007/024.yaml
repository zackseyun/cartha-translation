base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/024.yaml
  text: His daughter was Sheerah[a], and she built Lower Beth-horon and Upper Beth-horon[b], and Uzzen-sheerah.
translation:
  language: fr
  text: Sa fille était Shééra[a]. Elle bâtit Beth-Horôn inférieur et Beth-Horôn supérieur[b], et Ouzzen-Shééra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « et sa fille, Shééra ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et le supérieur » ; le nom « Beth-Horôn » est sous-entendu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִתּוֹ
  choice: Sa fille était
  rationale: Littéralement « et sa fille ». Dans cette notice généalogique, la formulation française introduit naturellement le nom en apposition tout en conservant le lien familial.
- source_word: שֶׁאֱרָה
  choice: Shééra
  rationale: Le nom propre est translittéré selon une forme française lisible, sans être traduit.
- source_word: וַתִּבֶן
  choice: Elle bâtit
  rationale: Le verbe בנה signifie normalement « bâtir ». Cette traduction évite de préciser sans preuve s’il s’agit de fonder, de reconstruire ou de fortifier les villes.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: Beth-Horôn-la-Basse
  rationale: Cette forme française distingue clairement la localité basse tout en conservant le toponyme traditionnel.
- source_word: הָעֶלְיוֹן
  choice: Beth-Horôn-la-Haute
  rationale: Le texte hébreu dit seulement « et la haute » ; « Beth-Horôn » est repris en français pour rendre explicite le parallélisme et le référent sous-entendu.
- source_word: אֻזֵּן שֶׁאֱרָה
  choice: Ouzzen-Shééra
  rationale: Le groupe est traité comme un seul nom de lieu composé et translittéré sous une forme adaptée au français.
