source:
  edition: WLC
  text: כָּל אֵ֣לֶּה בְנֵי אָ֠שֵׁר רָאשֵׁ֨י בֵית הָ/אָב֤וֹת בְּרוּרִים֙ גִּבּוֹרֵ֣י חֲיָלִ֔ים רָאשֵׁ֖י הַ/נְּשִׂיאִ֑ים וְ/הִתְיַחְשָׂ֤/ם בַּ/צָּבָא֙ בַּ/מִּלְחָמָ֔ה מִסְפָּרָ֣/ם אֲנָשִׁ֔ים עֶשְׂרִ֥ים וְ/שִׁשָּׁ֖ה אָֽלֶף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/040.yaml
  text: All these were sons of Asher[a], heads of fathers’ houses, select men, mighty warriors, chief leaders; and they were enrolled for service in the army for war. Their number in men was twenty-six thousand.
translation:
  language: fr
  text: Tous ceux-là étaient des fils d’Aser, chefs de maisons ancestrales, hommes choisis, vaillants guerriers et chefs parmi les dirigeants. Ils furent inscrits selon leurs généalogies[a] pour servir dans l’armée en temps de guerre. Ils étaient au nombre de 26 000 hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leur généalogie fut relevée ». Dans les Chroniques, le verbe hébreu désigne souvent un enregistrement généalogique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי בֵית הָאָבוֹת
  choice: chefs de maisons ancestrales
  rationale: Cette expression sociale et généalogique désigne les responsables des groupes familiaux issus d’un ancêtre. « Maisons ancestrales » restitue l’idée sans employer le calque moins naturel « maisons des pères ».
- source_word: בְּרוּרִים
  choice: hommes choisis
  rationale: Le participe passif désigne des hommes sélectionnés, réputés aptes; « choisis » en conserve directement le sens.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: vaillants guerriers
  rationale: L’expression hébraïque associe force, bravoure et capacité militaire. Cette formulation est naturelle et dignifiée en français actuel.
- source_word: רָאשֵׁי הַנְּשִׂיאִים
  choice: chefs parmi les dirigeants
  rationale: La tournure hébraïque est condensée. « Parmi » rend vraisemblablement l’idée de prééminence sans faire de נְשִׂיאִים des « princes » au sens monarchique moderne.
- source_word: וְהִתְיַחְשָׂם
  choice: ils furent inscrits selon leurs généalogies
  rationale: Dans les Chroniques, le verbe יחס au hitpael renvoie couramment à l’enregistrement généalogique. La traduction conserve ici cette nuance administrative explicite.
- source_word: בַּצָּבָא בַּמִּלְחָמָה
  choice: pour servir dans l’armée en temps de guerre
  rationale: La formulation exprime naturellement la fonction militaire de l’inscription tout en maintenant les deux notions, l’armée et la guerre.
- source_word: מִסְפָּרָם אֲנָשִׁים
  choice: Ils étaient au nombre de 26 000 hommes
  rationale: Cette tournure française idiomatique conserve l’indication explicite qu’il s’agit d’un dénombrement d’hommes.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אָלֶף
  choice: 26 000
  rationale: Forme numérique française usuelle de « vingt-six mille ».
