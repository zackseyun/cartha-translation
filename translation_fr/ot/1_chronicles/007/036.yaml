source:
  edition: WLC
  text: בְּנֵ֖י צוֹפָ֑ח ס֧וּחַ וְ/חַרְנֶ֛פֶר וְ/שׁוּעָ֖ל וּ/בֵרִ֥י וְ/יִמְרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/036.yaml
  text: 'The sons of Zophah: Suah[a], Harnepher, Shual, Beri, and Imrah.'
translation:
  language: fr
  text: 'Les fils de Tsophah : Souah[a], Harnépher, Shoual, Béri et Yimra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « descendants de Tsophah ». Dans les listes généalogiques, le mot hébreu traduit par « fils » peut parfois désigner plus largement les membres d’une lignée.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit signifie directement « les fils de ». Dans une généalogie, il peut aussi désigner plus largement des descendants; cette possibilité est conservée en note.
- source_word: צוֹפָח
  choice: Tsophah
  rationale: Nom propre translittéré d’après la forme massorétique, avec « ts » pour צ, selon un usage français clair.
- source_word: סוּחַ
  choice: Souah
  rationale: Translittération française naturelle du nom propre, où « ou » représente la voyelle /u/.
- source_word: חַרְנֶפֶר
  choice: Harnépher
  rationale: Le nom propre est translittéré; « ph » rend ici la spirantisation du פ et l’accent facilite une lecture française conforme à la vocalisation.
- source_word: שׁוּעָל
  choice: Shoual
  rationale: Dans cette liste généalogique, la forme est un nom propre et non le nom commun apparenté; elle est donc translittérée.
- source_word: בֵרִי
  choice: Béri
  rationale: Translittération de la vocalisation massorétique du nom, avec un accent qui indique clairement la voyelle en français.
- source_word: יִמְרָה
  choice: Yimra
  rationale: Translittération française directe du nom propre; le y initial représente le yod, et le h final non prononcé n’est pas ajouté artificiellement.
theological_decisions: []
translation_notes:
  register: Style généalogique sobre, actuel et digne. Les noms suivent une translittération adaptée au français moderne tout en restant proches du texte massorétique; l’ambiguïté possible de בְּנֵי est signalée sans remplacer son sens direct dans le corps du texte.
