source:
  edition: WLC
  text: וְ/הִתְיַחְשָׂ֣/ם לְ/תֹלְדוֹתָ֗/ם רָאשֵׁי֙ בֵּ֣ית אֲבוֹתָ֔/ם גִּבּוֹרֵ֖י חָ֑יִל עֶשְׂרִ֥ים אֶ֖לֶף וּ/מָאתָֽיִם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/009.yaml
  text: 'They were enrolled by genealogy[a], according to their generations, as heads of their fathers’ houses[b], mighty men of valor: twenty thousand two hundred.'
translation:
  language: fr
  text: 'Ils furent inscrits dans les registres généalogiques[a], selon leurs lignées, comme chefs de leurs maisons paternelles[b] et hommes vaillants : vingt mille deux cents.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « recensés d’après leur généalogie ». Le verbe hébreu désigne l’inscription dans un registre généalogique.
    reason: lexical_alternative
  - marker: b
    text: La « maison paternelle » était une unité familiale fondée sur l’ascendance commune, plus large que la famille nucléaire.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְיַחְשָׂם
  choice: Ils furent inscrits dans les registres généalogiques
  rationale: Le verbe התיחשׂ, fréquent dans les Chroniques, évoque l’inscription ou le classement d’une personne d’après sa généalogie. Cette formulation française rend clairement le cadre administratif et généalogique.
- source_word: לְתֹלְדוֹתָם
  choice: selon leurs lignées
  rationale: Dans ce contexte généalogique, תולדות désigne la succession familiale ou la descendance. « Lignées » est plus naturel et plus précis en français moderne que le calque « générations ».
- source_word: רָאשֵׁי בֵּית אֲבוֹתָם
  choice: comme chefs de leurs maisons paternelles
  rationale: La formulation conserve le terme social propre à Israël ancien, où la « maison paternelle » est une unité familiale ancestrale plus large que la famille nucléaire.
- source_word: גִּבּוֹרֵי חָיִל
  choice: hommes vaillants
  rationale: L’expression peut évoquer la force, la bravoure et l’aptitude militaire. « Hommes vaillants » préserve cette amplitude sans la limiter explicitement au métier de guerrier.
- source_word: עֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: vingt mille deux cents
  rationale: Rendu direct du nombre hébreu, écrit en toutes lettres conformément au registre littéraire.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tour administratif « inscrits dans les registres généalogiques » explicite naturellement le verbe hébreu, tandis que « maisons paternelles » conserve la réalité sociale ancienne, expliquée en note.
