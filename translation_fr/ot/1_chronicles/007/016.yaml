  text: וַ/תֵּ֨לֶד מַעֲכָ֤ה אֵֽשֶׁת מָכִיר֙ בֵּ֔ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ פֶּ֔רֶשׁ וְ/שֵׁ֥ם אָחִ֖י/ו שָׁ֑רֶשׁ וּ/בָנָ֖י/ו אוּלָ֥ם וָ/רָֽקֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/016.yaml
  text: Maacah the wife of Machir bore a son[a], and she called his name Peresh; and the name of his brother was Sheresh[b], and his sons were Ulam and Rakem.
translation:
  language: fr
  text: Maaka, femme de Makir, mit au monde un fils et l’appela Péresh. Son frère s’appelait Shéresh, et ses fils étaient Oulam et Rakem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le possessif « ses » renvoie très probablement à Shéresh, l’antécédent immédiat; le texte hébreu ne répète toutefois pas son nom.
    reason: ambiguïté_textuelle
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: mit au monde
  rationale: Dans cette notice généalogique, cette expression rend naturellement le verbe ילד sans alourdir la phrase.
- source_word: אֵשֶׁת מָכִיר
  choice: femme de Makir
  rationale: Le groupe construit identifie Maaka par son lien conjugal avec Makir; la formulation conserve le ton généalogique.
- source_word: בֵּן
  choice: un fils
  rationale: Le nom masculin singulier introduit l’enfant avant que son nom soit donné.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: l’appela
  rationale: Cette tournure française idiomatique rend l’expression hébraïque littérale « elle appela son nom » sans en modifier le sens.
- source_word: פֶּרֶשׁ
  choice: Péresh
  rationale: Nom propre translittéré d’après sa forme hébraïque, avec des accents facilitant la prononciation française.
- source_word: וְשֵׁם אָחִיו שָׁרֶשׁ
  choice: Son frère s’appelait Shéresh
  rationale: La formulation française exprime clairement l’énoncé nominal hébreu tout en conservant la relation fraternelle.
- source_word: וּבָנָיו
  choice: et ses fils étaient
  rationale: Le terme בנים désigne ici des descendants masculins. Le possessif garde l’ambiguïté possible de l’antécédent dans l’hébreu.
- source_word: אוּלָם וָרָקֶם
  choice: Oulam et Rékem
  rationale: Les noms propres sont translittérés; la conjonction hébraïque est rendue naturellement entre les deux noms.
theological_decisions:
- issue: Antécédent du possessif dans וּבָנָיו (« ses fils »)
  choice: Conserver le possessif ambigu « ses fils »
  alternative: Préciser « les fils de Shéresh » ou « les fils de Péresh »
  rationale: L’antécédent le plus proche est Shéresh, mais la forme hébraïque ne nomme pas explicitement le père. La traduction ne tranche donc pas ce que le texte laisse implicite.
translation_notes:
  register: Français moderne, digne et fluide, adapté à une notice généalogique. Les noms suivent une translittération française lisible. La syntaxe hébraïque est légèrement idiomatisée, tandis que l’ambiguïté du dernier possessif est préservée et signalée.
