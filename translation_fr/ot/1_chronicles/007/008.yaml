  text: וּ/בְנֵ֣י בֶ֗כֶר זְמִירָ֡ה וְ/יוֹעָ֡שׁ וֶ֠/אֱלִיעֶזֶר וְ/אֶלְיוֹעֵינַ֤י וְ/עָמְרִי֙ וִ/ירֵמ֣וֹת וַ/אֲבִיָּ֔ה וַ/עֲנָת֖וֹת וְ/עָלָ֑מֶת כָּל אֵ֖לֶּה בְּנֵי בָֽכֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/008.yaml
  text: 'And the sons of Becher: Zemirah[a], Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth. All these were the sons of Becher.'
translation:
  language: fr
  text: 'Et les fils de Béker : Zemira, Joas, Éliézer, Élioénaï, Omri, Yerémoth, Abiya, Anatoth et Alémeth. Tous ceux-là étaient fils de Béker.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי בֶכֶר
  choice: Fils de Béker
  rationale: Dans cette liste généalogique, « fils de » rend précisément le construit pluriel בְנֵי. La conjonction initiale relie le verset à la liste précédente, mais son expression par « et » serait peu naturelle en français après une référence isolée.
- source_word: זְמִירָה
  choice: Zemira
  rationale: Translittération française claire du nom propre, sans ajout d’un h final qui ne se prononce pas en français.
- source_word: יוֹעָשׁ
  choice: Joas
  rationale: Forme française biblique traditionnelle et aisément reconnaissable du nom יוֹעָשׁ.
- source_word: אֱלִיעֶזֶר
  choice: Éliézer
  rationale: Translittération usuelle en français, avec accents facilitant une prononciation naturelle.
- source_word: אֶלְיוֹעֵינַי
  choice: Élioénaï
  rationale: Translittération française proche de la forme hébraïque et distinguant les voyelles finales.
- source_word: עָמְרִי
  choice: Omri
  rationale: Forme française courante de ce nom propre.
- source_word: יְרֵמוֹת
  choice: Yerémoth
  rationale: La graphie avec Y représente directement le yod initial du texte massorétique; le th final signale la consonne ת selon l’usage traditionnel des noms bibliques français.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Translittération transparente de la forme hébraïque, qui conserve l’élément divin final sans imposer la graphie anglaise Abijah.
- source_word: עֲנָתוֹת
  choice: Anatoth
  rationale: Le contexte généalogique indique ici un nom de personne; la forme française traditionnelle est conservée.
- source_word: עָלָמֶת
  choice: Alémeth
  rationale: Translittération française lisible, avec accent indiquant la première voyelle et graphie traditionnelle du ת final.
- source_word: כָּל אֵלֶּה בְּנֵי בָכֶר
  choice: Tous ceux-là étaient fils de Béker
  rationale: « Tous ceux-là » rend la formule récapitulative כָּל אֵלֶּה. L’ajout idiomatique de « étaient » produit une phrase française complète sans modifier la relation généalogique.
