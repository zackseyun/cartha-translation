  yaml_path: translation/ot/1_chronicles/007/038.yaml
  text: 'And the sons of Jether: Jephunneh[a], Pispa, and Ara.'
translation:
  language: fr
  text: 'Et les fils de Jéther : Jephunné, Pispa[a] et Ara.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi transcrire ce nom « Pispah », en représentant plus directement la consonne hébraïque finale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Et les fils de
  rationale: La forme construite plurielle בְּנֵי désigne ici les « fils de » dans une formule généalogique. Le וּ initial est rendu par « Et », conformément à l’enchaînement de la liste.
- source_word: יֶתֶר
  choice: Yéter
  rationale: Nom propre translittéré sous une forme adaptée à la phonétique et à l’orthographe françaises modernes.
- source_word: יְפֻנֶּה
  choice: Yefounné
  rationale: Nom propre translittéré plutôt que traduit ; cette graphie française représente les consonnes et les voyelles du texte hébreu.
- source_word: וּפִסְפָּה
  choice: Pispa
  rationale: Nom propre précédé de la conjonction. La forme « Pispa » traite le ה final comme non prononcé ; la variante plus littérale « Pispah » est signalée en note.
- source_word: וַאְרָא
  choice: et Ara
  rationale: Le mot est compris comme un nom propre précédé de la conjonction, dans une liste généalogique.
theological_decisions: []
translation_notes:
  register: Formulation généalogique concise et digne. Les noms sont translittérés selon des conventions lisibles en français moderne, sans ajouter de verbe absent de l’hébreu.
