  yaml_path: translation/ot/1_chronicles/007/018.yaml
  text: His sister Hammoleketh bore Ishhod[a], Abiezer, and Mahlah.
translation:
  language: fr
  text: Sa sœur Hammoléketh[a] mit au monde Ishhod, Abiézer et Mahla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte Hammoléketh, que l’on pourrait aussi transcrire « Moléketh ». Ce nom est apparenté par sa forme à un mot signifiant « reine » ou « dirigeante », mais le contexte indique ici qu’il s’agit probablement d’un nom propre.
    reason: Signaler à la fois la variante de translittération et l’ambiguïté lexicale réelle de la forme hébraïque.
lexical_decisions:
- source_word: וַאֲחֹתוֹ
  choice: Sa sœur
  rationale: Le nom אֲחוֹת avec le suffixe masculin singulier signifie « sa sœur ». Dans cette brève notice généalogique, la conjonction waw relie la phrase à ce qui précède, mais n’a pas besoin d’être rendue explicitement en français.
- source_word: הַמֹּלֶכֶת
  choice: Hammoléketh
  rationale: Le contexte généalogique indique qu’il s’agit très probablement d’un nom propre. La translittération « Hammoléketh » conserve la forme hébraïque comprenant l’élément initial ha-; l’étymologie liée à l’idée de reine ou de dirigeante reste signalée en note.
- source_word: יָלְדָה
  choice: mit au monde
  rationale: La forme verbale féminine présente explicitement cette femme comme la mère. « Mit au monde » est naturel en français moderne et convient à une notice généalogique.
- source_word: אִישְׁהוֹד
  choice: Ishhod
  rationale: Translittération claire du nom propre hébreu, sans trait d’union inutile en français courant.
- source_word: אֲבִיעֶזֶר
  choice: Abiézer
  rationale: Forme française courante qui reflète fidèlement le nom hébreu.
- source_word: מַחְלָה
  choice: Mahla
  rationale: Translittération directe du nom propre, sans introduire la consonne supplémentaire de certaines formes françaises traditionnelles.
