base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/005.yaml
  text: And their brothers[a], throughout all the families of Issachar, were mighty men of valor, eighty-seven thousand in all[b], enrolled by genealogy.
translation:
  language: fr
  text: 'Leurs frères[a], dans toutes les familles d’Issacar, étaient de vaillants guerriers : quatre-vingt-sept mille en tout, inscrits dans les registres généalogiques[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs proches parents » ou « les membres de leur parenté » ; en hébreu, le mot traduit par « frères » peut désigner des membres du même clan et non seulement des frères au sens strict.
    reason: lexical_alternative
  - marker: b
    text: Ou « recensés selon leur généalogie ». Le verbe hébreu évoque l’inscription dans des registres généalogiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Leurs frères
  rationale: Le sens premier de אָח est « frère », mais le mot peut désigner plus largement des membres de la parenté dans un contexte clanique et généalogique. Le texte conserve l’expression hébraïque, avec une note signalant cette extension possible.
- source_word: לְכֹל מִשְׁפְּחוֹת יִשָׂשכָר
  choice: dans toutes les familles d’Issacar
  rationale: La préposition לְ marque ici le champ concerné. Cette formulation française indique que le dénombrement couvre l’ensemble des familles du clan d’Issacar.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: de vaillants guerriers
  rationale: Cette expression consacrée désigne ici des hommes reconnus pour leur force et leur aptitude au combat. « Vaillants guerriers » rend naturellement sa portée martiale en français moderne.
- source_word: שְׁמוֹנִים וְשִׁבְעָה אֶלֶף
  choice: quatre-vingt-sept mille
  rationale: Rendu direct du nombre cardinal dans le fil de la prose.
- source_word: הִתְיַחְשָׂם
  choice: inscrits dans les registres généalogiques
  rationale: Le hitpael de יחשׂ renvoie au fait d’être recensé ou enregistré selon la généalogie. La formulation explicite la réalité administrative sous-entendue sans changer le sens.
- source_word: לַכֹּל
  choice: en tout
  rationale: L’expression introduit ou précise ici le total général ; « en tout » est idiomatique et clair en français.
