source:
  edition: WLC
  text: וְ/זָבָ֥ד בְּנ֛/וֹ וְ/שׁוּתֶ֥לַח בְּנ֖/וֹ וְ/עֵ֣זֶר וְ/אֶלְעָ֑ד וַ/הֲרָג֗וּ/ם אַנְשֵׁי גַת֙ הַ/נּוֹלָדִ֣ים בָּ/אָ֔רֶץ כִּ֣י יָרְד֔וּ לָ/קַ֖חַת אֶת מִקְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/021.yaml
  text: Zabad his son[a], and Shuthelah his son, and Ezer and Elead; the men of Gath who were born in the land killed them[b], because they had gone down to take their livestock.
translation:
  language: fr
  text: Zabad, son fils, et Shoutélah, son fils, puis Ézer et Élead ; les hommes de Gath nés dans le pays[a] les tuèrent, car ils étaient descendus[b] pour prendre leur bétail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les hommes autochtones de Gath ». L’hébreu dit littéralement : « les hommes de Gath, ceux qui étaient nés dans le pays ».'
    reason: lexical_alternative
  - marker: b
    text: Dans le contexte, « ils » désigne probablement Ézer et Élead, les antécédents pluriels les plus proches.
    reason: referent_ambiguity
lexical_decisions:
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le nom construit avec suffixe masculin singulier est rendu selon l’usage naturel des généalogies françaises ; la répétition est conservée.
- source_word: וְעֵזֶר וְאֶלְעָד
  choice: puis Ézer et Élead
  rationale: Les noms propres sont translittérés ; « puis » rend naturellement la progression de la liste sans effacer sa structure coordonnée.
- source_word: וַהֲרָגוּם
  choice: les tuèrent
  rationale: Le verbe הרג avec suffixe objet pluriel signifie directement « tuer » ; le passé simple convient au registre narratif biblique moderne et digne.
- source_word: אַנְשֵׁי גַת
  choice: les hommes de Gath
  rationale: Cette expression désigne les hommes ou habitants masculins de Gath, sans généraliser à toute la population.
- source_word: הַנּוֹלָדִים בָּאָרֶץ
  choice: nés dans le pays
  rationale: La formulation reste proche du participe passif hébreu et conserve la possibilité qu’il s’agisse des habitants autochtones.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison du meurtre ; « car » relie clairement les deux propositions dans un registre soutenu mais courant.
- source_word: יָרְדוּ
  choice: étaient descendus
  rationale: Le plus-que-parfait marque l’antériorité par rapport au meurtre, tandis que « descendre » préserve l’image spatiale du verbe hébreu.
- source_word: לָקַחַת
  choice: pour prendre
  rationale: « Prendre » garde le sens large du verbe sans imposer l’idée plus interprétative de pillage ou de saisie violente.
- source_word: מִקְנֵיהֶם
  choice: leur bétail
  rationale: מִקְנֶה désigne couramment les animaux domestiques possédés ; « bétail » est naturel et ne limite pas indûment les espèces concernées.
theological_decisions:
- issue: Référent du sujet pluriel de יָרְדוּ (« étaient descendus »)
  choice: Le texte principal conserve le pronom « ils », avec une note indiquant qu’il renvoie probablement à Ézer et Élead.
  alternative: Comprendre « ils » comme les hommes de Gath.
  rationale: La grammaire permet une certaine ambiguïté, mais le contexte narratif et les antécédents pluriels les plus proches favorisent Ézer et Élead ; la note évite de présenter cette identification comme absolument certaine.
translation_notes:
  register: Français international moderne, clair et digne. Le point-virgule sépare la suite généalogique du récit de la mort sans créer de rupture excessive. Le passé simple porte l’événement principal et le plus-que-parfait l’action antérieure.
