source:
  edition: WLC
  text: וַ/עֲלֵי/הֶ֨ם לְ/תֹלְדוֹתָ֜/ם לְ/בֵ֣ית אֲבוֹתָ֗/ם גְּדוּדֵי֙ צְבָ֣א מִלְחָמָ֔ה שְׁלֹשִׁ֥ים וְ/שִׁשָּׁ֖ה אָ֑לֶף כִּֽי הִרְבּ֥וּ נָשִׁ֖ים וּ/בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/004.yaml
  text: And with them, by their generations, according to their fathers' houses, were 36,000 troops for the army of war, for they had many wives and sons.
translation:
  language: fr
  text: Avec eux, selon leurs lignées et leurs maisons paternelles, il y avait 36 000 soldats répartis en unités militaires pour la guerre, car ils avaient beaucoup de femmes[a] et de fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « épouses ». Le mot hébreu peut avoir les deux sens ; dans ce contexte généalogique, il désigne probablement les épouses.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלֵיהֶם
  choice: Avec eux
  rationale: Dans ce contexte de dénombrement, l’expression introduit ceux qui leur étaient associés; « Avec eux » est plus naturel qu’un sens spatial comme « au-dessus d’eux ».
- source_word: לְתֹלְדוֹתָם
  choice: selon leurs généalogies
  rationale: תֹּלְדוֹת désigne ici les lignées ou divisions généalogiques selon lesquelles les hommes sont recensés.
- source_word: לְבֵית אֲבוֹתָם
  choice: leurs maisons ancestrales
  rationale: L’expression hébraïque désigne les groupes familiaux issus d’un même ancêtre paternel; cette formulation conserve la structure sociale sans employer le calque peu naturel « maisons de leurs pères ».
- source_word: גְּדוּדֵי צְבָא מִלְחָמָה
  choice: hommes répartis en unités de combat
  rationale: La formule militaire accumule les idées de troupes organisées, d’armée et de guerre. Cette traduction en restitue le sens dans un français naturel sans reproduire lourdement chaque substantif.
- source_word: שְׁלֹשִׁים וְשִׁשָּׁה אָלֶף
  choice: 36 000
  rationale: Les chiffres arabes et l’espacement typographique français rendent exactement et clairement le nombre hébreu.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée pour expliquer l’effectif important.
- source_word: הִרְבּוּ
  choice: avaient beaucoup de
  rationale: Le hiphil de רבה exprime ici l’abondance; en français, cette tournure est plus idiomatique que « multiplièrent » avec les compléments suivants.
- source_word: נָשִׁים
  choice: femmes
  rationale: Le mot peut signifier « femmes » ou « épouses ». « Femmes » préserve l’ambiguïté lexicale du texte, tandis que le contexte généalogique favorise probablement le sens d’« épouses ».
- source_word: וּבָנִים
  choice: et de fils
  rationale: בָּנִים signifie littéralement « fils »; le conserver convient au contexte généalogique plutôt que de l’élargir à « enfants ».
