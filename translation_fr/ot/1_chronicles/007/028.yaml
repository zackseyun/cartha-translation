  naturalness: La phrase est claire et de registre moderne. « Leurs propriétés et leurs lieux d’habitation » est fidèle, quoique « leurs domaines et leurs lieux d’habitation » serait un peu plus fluide dans une liste territoriale; aucune modification n’est nécessaire sur ce point. La ponctuation énumérative est naturelle.
  terminology: « Béthel », « Guézer » et « Sichem » sont des formes françaises bibliques usuelles. « Naarân » et « Ayya » respectent le texte massorétique. « Localités qui en dépendaient » exprime correctement l’idiome hébreu בְּנוֹתֶיהָ sans imposer une interprétation confessionnelle.
