base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/028.yaml
  text: Their holdings and settlements were Bethel and its daughter towns[a], and to the east Naaran, and to the west Gezer and its daughter towns, and Shechem and its daughter towns[c][b], as far as Ayyah and its daughter towns.
translation:
  language: fr
  text: Leurs propriétés et leurs lieux d’habitation étaient Béthel et les localités qui en dépendaient[a] ; à l’est, Naarân[b] ; à l’ouest, Guézer et les localités qui en dépendaient, ainsi que Sichem et les localités qui en dépendaient, jusqu’à Ayya et aux localités qui en dépendaient[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « ses filles », expression qui désigne les petites villes ou les villages dépendant d’une ville principale. Cette expression s’applique aussi aux occurrences suivantes dans le verset.
    reason: cultural_note
  - marker: b
    text: Certains rendent ce nom par « Naara », d’après une tradition apparentée du nom de lieu attestée ailleurs.
    reason: alternative_reading
  - marker: c
    text: Le texte hébreu massorétique porte « Ayya » ; certains témoins anciens et certaines traductions reflètent plutôt « Gaza ».
    reason: textual_variant
lexical_decisions:
- source_word: אֲחֻזָּתָם
  choice: leurs propriétés
  rationale: Le terme désigne ici des possessions foncières ou territoriales. « Propriétés » convient à la liste géographique sans introduire la notion plus chargée d’« héritage ».
- source_word: מֹשְׁבוֹתָם
  choice: leurs lieux d’habitation
  rationale: Dans ce contexte territorial, le mot désigne les endroits où le groupe habitait. Cette formulation reste naturelle tout en demeurant proche de l’hébreu.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Forme française traditionnelle et largement reconnue du nom de lieu.
- source_word: בְנֹתֶיהָ
  choice: les localités qui en dépendaient
  rationale: Littéralement « ses filles » ; il s’agit d’une expression désignant les petites villes ou villages rattachés à une ville principale. La traduction explicite le sens sans reproduire une métaphore peu naturelle en français courant.
- source_word: לַמִּזְרָח
  choice: à l’est
  rationale: Rend simplement et naturellement l’indication de direction ou d’étendue orientale.
- source_word: נַעֲרָן
  choice: Naarân
  rationale: Translittération française de la forme massorétique présente dans ce verset ; la tradition apparentée « Naara » est signalée en note.
- source_word: לַמַּעֲרָב
  choice: à l’ouest
  rationale: Correspondant directionnel naturel de « à l’est ».
- source_word: גֶּזֶר
  choice: Guézer
  rationale: Forme française traditionnelle du nom de lieu.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Forme française traditionnelle et reconnue du nom de lieu.
- source_word: עַד
  choice: jusqu’à
  rationale: Marque ici la limite ou l’étendue territoriale.
- source_word: עַיָּה
  choice: Ayya
  rationale: Translittération de la lecture du texte massorétique. La variante « Gaza », attestée dans certains témoins anciens et certaines traductions, est conservée en note plutôt qu’introduite dans le texte.
