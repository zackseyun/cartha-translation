translation_notes:
  register: Français moderne, international et digne. La syntaxe semi-énumérative conserve le caractère géographique du verset. Les toponymes suivent les formes françaises bibliques usuelles lorsqu’elles sont bien établies ; « Naarân » et « Ayya » reproduisent de près les formes hébraïques. Les marqueurs de notes sont placés exactement aux éléments concernés.
