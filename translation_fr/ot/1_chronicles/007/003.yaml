  text: וּ/בְנֵ֥י עֻזִּ֖י יִֽזְרַֽחְיָ֑ה וּ/בְנֵ֣י יִֽזְרַֽחְיָ֗ה מִֽיכָאֵ֡ל וְ֠/עֹבַדְיָה וְ/יוֹאֵ֧ל יִשִּׁיָּ֛ה חֲמִשָּׁ֖ה רָאשִׁ֥ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/003.yaml
  text: 'And the sons of Uzzi: Izrahiah. And the sons of Izrahiah: Michael[a], Obadiah, Joel, and Isshiah—five, all of them heads.'
translation:
  language: fr
  text: 'Les fils d’Uzzi : Yizrahia. Les fils de Yizrahia : Mikaël, Obadia, Joël et Yishiya — cinq, tous chefs[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cinq têtes, eux tous ». On peut aussi comprendre : « cinq hommes importants » ou « cinq chefs de famille ». Le total de cinq semble compter Yizrahia avec ses quatre fils, mais l’hébreu ne l’explicite pas.'
    reason: Préciser le sens figuré de רָאשִׁים et préserver l’ambiguïté du décompte.
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Formule généalogique naturelle en français. La conjonction initiale est omise, car son rendu systématique par « et » alourdirait une liste généalogique française sans apporter ici de lien sémantique essentiel.
- source_word: עֻזִּי
  choice: Uzzi
  rationale: Transcription française lisible du nom propre hébreu.
- source_word: יִזְרַחְיָה
  choice: Yizrahia
  rationale: Transcription qui représente le yod initial par « Y » et conserve la même forme aux deux occurrences.
- source_word: מִיכָאֵל
  choice: Mikaël
  rationale: Forme française transparente, proche de l’hébreu, avec le tréma indiquant que les voyelles se prononcent séparément.
- source_word: וְעֹבַדְיָה
  choice: Obadia
  rationale: Forme française courante et lisible du nom propre; la conjonction est rendue par la coordination de la liste.
- source_word: וְיוֹאֵל
  choice: Joël
  rationale: Forme française conventionnelle; le tréma marque la séparation vocalique.
- source_word: יִשִּׁיָּה
  choice: Yishiya
  rationale: Transcription française proche de la forme consonantique hébraïque et distincte des autres noms.
- source_word: חֲמִשָּׁה
  choice: cinq
  rationale: Rendu direct du nombre cardinal. Le texte nomme quatre fils de Yizrahia, puis donne le total de cinq sans préciser explicitement comment il est calculé; la traduction conserve cette tension.
- source_word: רָאשִׁים
  choice: chefs
  rationale: Dans une généalogie, רָאשִׁים désigne des personnes placées à la tête d’un groupe familial. « Chefs » est naturel tout en restant proche de l’image hébraïque de la « tête ».
- source_word: כֻּלָּם
  choice: tous
  rationale: Conserve l’insistance du texte hébreu sur le fait que les cinq avaient tous ce statut.
