base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/007.yaml
  text: 'And the sons of Bela: Ezbon[a], Uzzi, Uzziel, Jerimoth, and Iri—five heads of fathers’ houses, mighty men of valor; and their genealogical enrollment was twenty-two thousand and thirty-four.'
translation:
  language: fr
  text: 'Fils de Béla : Etsbon, Uzzi, Uzziel, Jerimoth et Iri, cinq chefs de familles, de vaillants guerriers. Leur inscription généalogique[a] comptait 22 034 personnes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur généalogie » ou « leur enregistrement selon la généalogie ». Le terme hébreu désigne l’inscription dans des listes généalogiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי בֶלַע
  choice: Fils de Béla
  rationale: Dans cette liste généalogique, בְּנֵי désigne les fils ou descendants masculins de Béla. La formulation nominale française est naturelle après le verset précédent.
- source_word: אֶצְבּוֹן וְעֻזִּי וְעֻזִּיאֵל וִירִימוֹת וְעִירִי
  choice: Esbon, Ouzzi, Ouzziel, Yerimoth et Iri
  rationale: Translittération adaptée aux conventions et à la prononciation françaises, tout en distinguant les formes hébraïques des noms.
- source_word: רָאשֵׁי בֵּית אָבוֹת
  choice: chefs de familles
  rationale: L’expression désigne les responsables d’unités familiales ou lignagères. « Chefs de familles » est clair en français moderne sans reproduire maladroitement l’hébraïsme « maisons de pères ».
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: de vaillants guerriers
  rationale: Dans ce contexte de recensement tribal, l’expression qualifie des hommes capables et valeureux au combat. Cette traduction restitue naturellement sa portée militaire.
- source_word: וְהִתְיַחְשָׂם
  choice: leur recensement généalogique
  rationale: Le Hitpael de יחס, fréquent dans les Chroniques, renvoie à l’inscription ou au classement dans des registres selon la généalogie. Le substantif français convient à la syntaxe suivie d’un nombre.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף וּשְׁלֹשִׁים וְאַרְבָּעָה
  choice: 22 034 hommes
  rationale: Le nombre hébreu est exactement 22 034. L’ajout explicatif « hommes » rend en français l’effectif humain sous-entendu par le contexte, sans modifier le chiffre.
