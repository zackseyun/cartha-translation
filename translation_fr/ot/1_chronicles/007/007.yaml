translation_notes:
  register: Français international moderne, sobre et digne. Les noms sont francisés avec modération. La phrase hébraïque, très condensée, est répartie en trois phrases pour assurer la clarté, tout en maintenant le lien entre les cinq hommes, leur fonction familiale, leur qualité militaire et l’effectif enregistré.
