source:
  edition: WLC
  text: כָּל אֵ֜לֶּה בְּנֵ֤י יְדִֽיעֲאֵל֙ לְ/רָאשֵׁ֣י הָ/אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים שִׁבְעָֽה עָשָׂ֥ר אֶ֨לֶף֙ וּ/מָאתַ֔יִם יֹצְאֵ֥י צָבָ֖א לַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/011.yaml
  text: All these were sons of Jediael[a], according to the heads of the fathers’ houses, mighty men of valor, seventeen thousand two hundred[d][c][b], able to go out in the army for war.
translation:
  language: fr
  text: Tous ceux-là étaient des fils de Jediaël[a]. Selon les chefs des maisons paternelles[b], ces vaillants guerriers[c] étaient au nombre de 17 200 et aptes à partir pour la guerre[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « descendants de Jediaël » ; dans les généalogies, le mot hébreu traduit par « fils » peut avoir un sens plus large.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « selon les chefs des pères » ; cette expression désigne les chefs de clans ou de maisons familiales.
    reason: cultural_note
  - marker: c
    text: Ou « hommes puissants et valeureux ».
    reason: lexical_alternative
  - marker: d
    text: Littéralement « ceux qui sortent pour le service militaire, pour la guerre » ; il s’agit d’une expression désignant des hommes disponibles ou aptes au service militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Tous ceux-là
  rationale: Cette formule récapitulative conserve la brièveté de l’hébreu sans ajouter un nom absent du texte.
- source_word: בְּנֵי יְדִיעֲאֵל
  choice: des fils de Yediaël
  rationale: Le sens premier est « fils de Yediaël »; dans cette généalogie, l’expression peut toutefois désigner plus largement ses descendants, possibilité signalée en note.
- source_word: לְרָאשֵׁי הָאָבוֹת
  choice: Répartis selon les chefs des familles ancestrales
  rationale: La formulation rend le classement du groupe d’après ses unités familiales et leurs chefs. « Familles ancestrales » exprime naturellement en français moderne la structure sociale désignée par אָבוֹת.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: vaillants guerriers
  rationale: L’expression qualifie des hommes reconnus pour leur force et leur capacité militaire; cette traduction est actuelle, claire et digne.
- source_word: שִׁבְעָה עָשָׂר אֶלֶף וּמָאתַיִם
  choice: 17 200
  rationale: Le chiffre reproduit exactement le total du recensement, selon la typographie numérique française.
- source_word: יֹצְאֵי צָבָא לַמִּלְחָמָה
  choice: mobilisables pour la guerre
  rationale: Littéralement, il s’agit de ceux qui « sortent avec l’armée pour la guerre »; dans un contexte de recensement, la formule désigne les hommes disponibles ou aptes au service militaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, au registre narratif digne. La phrase hébraïque très compacte est légèrement articulée en deux phrases pour clarifier le rapport entre la filiation, l’organisation familiale, le total recensé et l’aptitude militaire, sans supprimer les nuances lexicales signalées en notes.
