lexical_decisions:
- source_word: לַעְדָּן
  choice: Ladan
  rationale: Nom propre translittéré d’après la forme hébraïque massorétique. « Ladan » rend naturellement le nom en français sans traduire son éventuelle étymologie.
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le nom בֵּן avec suffixe masculin singulier signifie littéralement « son fils ». Dans cette généalogie, il n’y a pas de raison contextuelle d’élargir le sens à « descendant ».
- source_word: עַמִּיהוּד
  choice: Ammihoud
  rationale: Translittération française usuelle du nom propre hébreu, avec « ou » pour la voyelle longue ū.
- source_word: אֱלִישָׁמָע
  choice: Élishama
  rationale: Translittération française claire du nom propre hébreu, avec accent initial pour guider la prononciation.
