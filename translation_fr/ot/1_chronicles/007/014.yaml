source:
  edition: WLC
  text: בְּנֵ֣י מְנַשֶּׁ֔ה אַשְׂרִיאֵ֖ל אֲשֶׁ֣ר יָלָ֑דָה פִּֽילַגְשׁ/וֹ֙ הָֽ/אֲרַמִּיָּ֔ה יָלְדָ֕ה אֶת מָכִ֖יר אֲבִ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/014.yaml
  text: 'The sons of Manasseh: Asriel[a], whom his Aramean concubine bore[c][b]; she bore Machir the father of Gilead.'
translation:
  language: fr
  text: 'Les fils de Manassé[a] : Asriel, que sa concubine araméenne[b] mit au monde ; elle mit au monde Makir, père de Galaad[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Les descendants de Manassé ». Dans les généalogies, « fils » peut parfois avoir le sens plus large de « descendants ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « l’Araméenne » ; traduction traditionnelle : « la Syrienne ».'
    reason: lexical_alternative
  - marker: c
    text: Dans une généalogie, « père de Galaad » peut aussi signifier « ancêtre de Galaad » ou « fondateur de Galaad ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Les fils de Manassé
  rationale: « Fils » correspond directement au pluriel construit בְּנֵי et conserve le style généalogique. Dans ce type de liste, le terme peut toutefois désigner plus largement des descendants.
- source_word: אַשְׂרִיאֵל
  choice: Asriel
  rationale: Transcription française usuelle du nom propre.
- source_word: אֲשֶׁר יָלָדָה
  choice: que … mit au monde
  rationale: Le verbe au féminin singulier signifie littéralement « qu’elle enfanta ». « Mettre au monde » est naturel en français moderne tout en conservant le sujet féminin explicité ensuite.
- source_word: פִּילַגְשׁוֹ
  choice: sa concubine
  rationale: פִּילֶגֶשׁ désigne une concubine. Le possessif français garde la formulation concise de l’hébreu sans ajouter une identification absente du texte.
- source_word: הָאֲרַמִּיָּה
  choice: araméenne
  rationale: Le terme désigne une femme araméenne. « Araméenne » est historiquement plus précis que l’appellation traditionnelle « syrienne ».
- source_word: יָלְדָה אֶת מָכִיר
  choice: elle mit au monde Makir
  rationale: La répétition de « mit au monde » reproduit la reprise explicite du verbe féminin dans l’hébreu, sans ajouter de conjonction absente du texte.
- source_word: אֲבִי גִלְעָד
  choice: père de Galaad
  rationale: « Père » est l’équivalent direct de אָב. En contexte généalogique, le mot peut aussi désigner un ancêtre ou un fondateur, possibilité signalée en note.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et digne. « Mettre au monde » évite le caractère aujourd’hui soutenu ou archaïsant d’« enfanter », tandis que la répétition du verbe et la ponctuation préservent la structure inhabituelle de l’hébreu. Les noms propres suivent les formes françaises courantes : Manassé, Asriel, Makir et Galaad.'
