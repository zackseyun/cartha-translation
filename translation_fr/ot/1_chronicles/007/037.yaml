translation:
  language: fr
  text: Bétser, Hod, Shamma, Shilsha, Yitrân[a] et Beéra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On trouve aussi « Jéthran », selon une anglicisation traditionnelle du nom.
    reason: lexical_alternative
  - marker: b
    text: On peut aussi écrire « Be’éra », afin de rendre plus explicitement la consonne hébraïque aleph.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּצֶר
  choice: Bétser
  rationale: 'Nom propre translittéré selon les usages français : צ est rendu par « ts », et les voyelles du texte massorétique sont représentées naturellement.'
- source_word: הוֹד
  choice: Hod
  rationale: Dans cette liste généalogique, il s’agit d’un nom propre et non du nom commun pouvant signifier « majesté » ou « splendeur ».
- source_word: שַׁמָּא
  choice: Shamma
  rationale: La forme française suit directement la vocalisation hébraïque ; le h final parfois employé dans d’autres langues n’est pas présent dans cette forme du nom.
- source_word: שִׁלְשָׁה
  choice: Shilsha
  rationale: Translittération lisible en français de la forme hébraïque ; le ה final est ici une lettre maternelle indiquant la voyelle finale et ne justifie pas un h prononcé ou ajouté en français.
- source_word: יִתְרָן
  choice: Yitrân
  rationale: Le yod initial est rendu par « Y » et la voyelle longue finale par « â », ce qui reste proche de l’hébreu tout en étant naturel pour un lectorat francophone.
- source_word: בְאֵרָא
  choice: Beéra
  rationale: La succession des voyelles séparées par l’aleph est rendue lisiblement par « Beéra » ; une apostrophe peut toutefois signaler plus explicitement l’aleph.
