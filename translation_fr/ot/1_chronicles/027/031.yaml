base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/031.yaml
  text: Over the flocks was Jaziz the Hagrite[a]. All these were officers over the property that belonged to King David.
translation:
  language: fr
  text: Jaziz, le Hagrite[a], était responsable des troupeaux. Tous ceux-là étaient responsables des biens qui appartenaient au roi David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Hagarite ». Le gentilé hébreu peut être translittéré de l’une ou l’autre manière.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: était responsable de
  rationale: Dans cette liste administrative, עַל indique la responsabilité ou la supervision. Cette tournure est naturelle en français moderne.
- source_word: הַצֹּאן
  choice: des troupeaux
  rationale: צֹאן peut désigner les moutons ou, plus largement, le petit bétail; « troupeaux » préserve cette portée sans préciser à tort l'espèce.
- source_word: יָזִיז
  choice: Jaziz
  rationale: Nom propre translittéré selon une forme française simple et proche de l'hébreu.
- source_word: הַהַגְרִי
  choice: le Hagrite
  rationale: Gentilé désignant un membre du groupe des Hagrites; cette forme concise convient à la translittération française.
- source_word: כָּל אֵלֶּה
  choice: Tous ceux-là
  rationale: Formule récapitulative qui renvoie aux responsables nommés dans la liste précédente.
- source_word: שָׂרֵי
  choice: les responsables
  rationale: Dans ce contexte, שָׂרֵי désigne des administrateurs chargés des ressources royales plutôt que des princes ou des chefs militaires.
- source_word: הָרְכוּשׁ
  choice: des biens
  rationale: רְכוּשׁ désigne les possessions ou les avoirs; « biens » est clair et conserve le ton administratif.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: qui appartenaient au roi David
  rationale: La proposition relative exprime explicitement l'appartenance des biens au roi David.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La première proposition est réorganisée selon l'ordre français naturel, sans perdre la relation administrative exprimée par l'hébreu.
