  text: for Levi[a], Hashabiah son of Kemuel; for Aaron, Zadok.
translation:
  language: fr
  text: Pour les Lévites, Hashabia, fils de Qemouël ; pour la maison d’Aaron, Tsadoq.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/לֵוִי
  choice: pour Lévi
  rationale: Dans cette liste administrative, la préposition לְ introduit le groupe dont le responsable est ensuite nommé. « Pour Lévi » conserve la désignation ancestrale du texte hébreu sans expliciter « les Lévites ».
- source_word: חֲשַׁבְיָה
  choice: Hashabia
  rationale: Nom propre transcrit sous une forme française claire et courante.
- source_word: בֶן
  choice: fils de
  rationale: Équivalent français naturel de la construction généalogique hébraïque.
- source_word: קְמוּאֵל
  choice: Qemouël
  rationale: Transcription française du nom propre, avec le tréma signalant que les deux voyelles se prononcent séparément.
- source_word: לְ/אַהֲרֹן
  choice: pour Aaron
  rationale: La formulation parallèle à « pour Lévi » préserve le nom ancestral employé par l’hébreu, tout en laissant la note expliquer qu’il désigne vraisemblablement la maison sacerdotale issue d’Aaron.
- source_word: צָדוֹק
  choice: Tsadoq
  rationale: Transcription française du nom propre hébreu.
theological_decisions:
- issue: Faut-il expliciter qu’« Aaron » désigne la maison sacerdotale issue d’Aaron ?
  choice: Conserver « pour Aaron » dans le texte principal.
  alternative: « pour la maison d’Aaron » ou « pour les Aaronides »
  rationale: L’hébreu nomme simplement Aaron. La traduction conserve cette métonymie et son parallélisme avec Lévi, tandis qu’une note fournit l’explication historique probable sans transformer l’interprétation en texte.
translation_notes:
  register: Français moderne, sobre et digne, adapté au caractère elliptique d’une liste administrative. Le point-virgule maintient le parallélisme des deux groupes. Le marqueur de note est placé après « Aaron », auquel la note se rapporte, plutôt qu’après « Lévi » comme dans la couche anglaise fournie.
