  source_fidelity: Le verset appartient à une liste de responsables de groupes. Les syntagmes לְלֵוִי et לְאַהֲרֹן emploient les noms ancestraux par métonymie; dans ce contexte, ils désignent les Lévites et le groupe sacerdotal aaronique, non les personnes individuelles Lévi et Aaron. Le rendu littéral « pour Lévi » est donc susceptible de fausser la fonction administrative de la ligne en français.
  naturalness: « Pour Lévi » est peu naturel et ambigu en français moderne, où il se comprend spontanément comme une référence à l’individu Lévi. « Pour les Lévites » rend clairement le groupe concerné tout en gardant le style concis de la liste. « Pour la maison d’Aaron » est idiomatique et conserve la métonymie collective sans introduire un terme technique inutile.
  terminology: Les transcriptions Hashabia, Qemouël et Tsadoq sont cohérentes avec une translittération française proche de l’hébreu. « Maison d’Aaron » exprime de manière sobre l’appartenance sacerdotale que le contexte administratif implique.
