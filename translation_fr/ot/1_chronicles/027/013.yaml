  text: הָ/עֲשִׂירִי֙ לַ/חֹ֣דֶשׁ הָ/עֲשִׂירִ֔י מַהְרַ֥י הַ/נְּטֽוֹפָתִ֖י לַ/זַּרְחִ֑י וְ/עַל֙ מַֽחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/013.yaml
  text: 'The tenth[a], for the tenth month: Mahrai the Netophathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: fr
  text: Le dixième, pour le dixième mois, était Mahraï, de Netopha, du clan de Zérah. Sa division comptait 24 000 hommes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: Le dixième
  rationale: L’adjectif ordinal est employé substantivement dans cette liste; le commandement ou la division est sous-entendu par le contexte.
- source_word: לַחֹדֶשׁ הָעֲשִׂירִי
  choice: pour le dixième mois
  rationale: Le ל introduit ici le mois auquel correspond le tour de service.
- source_word: מַהְרַי
  choice: Mahraï
  rationale: Transcription française du nom hébreu, avec tréma pour signaler que les voyelles se prononcent séparément.
- source_word: הַנְּטוֹפָתִי
  choice: de Netopha
  rationale: Le gentilé indique l’origine géographique; cette tournure est plus naturelle et immédiatement compréhensible en français que «le Netophatite».
- source_word: לַזַּרְחִי
  choice: du clan de Zérah
  rationale: Le gentilé singulier exprime vraisemblablement l’appartenance au groupe descendant de Zérah.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Sa division comptait
  rationale: Rend naturellement en français la responsabilité exercée sur sa division, tout en reliant l’effectif au corps placé sous ses ordres.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24 000 hommes
  rationale: Le nombre est rendu selon l’usage typographique français; «hommes» explicite l’effectif militaire clairement impliqué par le contexte.
