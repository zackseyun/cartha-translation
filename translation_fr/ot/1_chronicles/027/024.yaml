source:
  edition: WLC
  text: יוֹאָ֨ב בֶּן צְרוּיָ֜ה הֵחֵ֤ל לִ/מְנוֹת֙ וְ/לֹ֣א כִלָּ֔ה וַ/יְהִ֥י בָ/זֹ֛את קֶ֖צֶף עַל יִשְׂרָאֵ֑ל וְ/לֹ֤א עָלָה֙ הַ/מִּסְפָּ֔ר בְּ/מִסְפַּ֥ר דִּבְרֵֽי הַ/יָּמִ֖ים לַ/מֶּ֥לֶךְ דָּוִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/024.yaml
  text: Joab son of Zeruiah began to count[a], but he did not finish; and because of this wrath came upon Israel[b]. And the number was not entered in the account of the chronicles of King David.
translation:
  language: fr
  text: Joab, fils de Tserouya, commença à compter, mais il n’acheva pas le dénombrement. À cause de cela, la colère s’abattit sur Israël. Le total ne fut pas inscrit[a] dans le registre des annales[b] du roi David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « ne monta pas », expression qui signifie ici que le total ne fut pas porté dans un document officiel.
    reason: lexical_alternative
  - marker: b
    text: Les « annales » étaient les archives officielles liées au règne du roi David.
    reason: cultural_note
lexical_decisions:
- source_word: הֵחֵל לִמְנוֹת
  choice: commença à compter
  rationale: La formulation rend directement l’association de « commencer » et « compter », dans un français simple et naturel, sans expliciter davantage qu’il s’agit d’un recensement.
- source_word: וְלֹא כִלָּה
  choice: mais il n’acheva pas le dénombrement
  rationale: Le verbe signifie « achever, mener à terme ». La reprise « le dénombrement » explicite naturellement en français l’objet sous-entendu.
- source_word: וַיְהִי בָזֹאת קֶצֶף עַל יִשְׂרָאֵל
  choice: À cause de cela, la colère s’abattit sur Israël
  rationale: Cette formulation rend la relation exprimée par בָזֹאת et l’idée d’une colère atteignant Israël, tout en laissant son auteur implicite comme en hébreu.
- source_word: הַמִּסְפָּר
  choice: le total
  rationale: Dans ce contexte, le nom désigne le chiffre résultant du dénombrement. « Le total » est plus idiomatique que « le nombre » en français.
- source_word: וְלֹא עָלָה
  choice: ne fut pas inscrit
  rationale: Le verbe signifie littéralement « ne monta pas », mais désigne ici l’inscription dans un document officiel.
- source_word: בְּמִסְפַּר דִּבְרֵי הַיָּמִים
  choice: dans le registre des annales
  rationale: דִּבְרֵי הַיָּמִים désigne des annales, tandis que le premier terme a ici la nuance d’un relevé ou registre. La formulation française évite l’expression peu naturelle « le compte des chroniques ».
- source_word: לַמֶּלֶךְ דָּוִיד
  choice: du roi David
  rationale: Le complément marque ici le rapport ou l’appartenance des annales au règne ou à l’administration de David.
theological_decisions:
- issue: Faut-il identifier explicitement Dieu comme source de la colère ?
  choice: 'Laisser l’auteur de la colère implicite : « la colère s’abattit sur Israël »'
  alternative: « la colère de Dieu s’abattit sur Israël »
  rationale: Le contexte narratif implique fortement une colère divine, mais la proposition hébraïque ne nomme pas Dieu. La traduction préserve cette réserve.
translation_notes:
  register: Français international actuel, digne et accessible. « Tserouya » suit une translittération française courante. Le texte conserve l’agent implicite de la colère et emploie le vocabulaire administratif naturel de « dénombrement », « total », « registre » et « annales ».
