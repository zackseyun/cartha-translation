  terminology: « Tserouya » est une graphie française acceptable pour Zerouïa/Zeruiah. Les termes administratifs sont cohérents avec le contexte. La note a est correctement rattachée à « inscrit », là où l’idiome hébreu doit être expliqué, et la note b éclaire sobrement la nature des annales.
