source:
  edition: WLC
  text: וְ/לֹא נָשָׂ֤א דָוִיד֙ מִסְפָּרָ֔/ם לְ/מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָ֑טָּה כִּ֚י אָמַ֣ר יְהוָ֔ה לְ/הַרְבּ֥וֹת אֶת יִשְׂרָאֵ֖ל כְּ/כוֹכְבֵ֥י הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/023.yaml
  text: But David did not count them from twenty years old and under[b][a], because Yahweh had said he would multiply Israel like the stars of the heavens.
translation:
  language: fr
  text: Mais David ne dénombra pas[a] ceux qui avaient vingt ans ou moins, car Yahweh avait dit qu’il rendrait Israël aussi nombreux que les étoiles du ciel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « ne porta pas leur nombre » ; l’expression peut aussi se traduire par « ne les recensa pas ».
    reason: lexical_alternative
  - marker: b
    text: Cette comparaison rappelle la promesse de Yahweh de rendre Israël extrêmement nombreux, comme les étoiles du ciel.
    reason: cross_reference
lexical_decisions:
- source_word: וְלֹא
  choice: Mais… ne… pas
  rationale: Dans le contexte du recensement, la conjonction introduit ici un contraste avec ce qui précède; « mais » l’exprime naturellement en français.
- source_word: נָשָׂא ... מִסְפָּרָם
  choice: ne dénombra pas ceux
  rationale: L’expression hébraïque, littéralement « ne leva pas leur nombre », est un idiome signifiant compter ou recenser. « Dénombrer » conserve nettement le sens de recensement.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וּלְמָטָּה
  choice: ceux qui avaient vingt ans ou moins
  rationale: Cette formulation française rend clairement et naturellement la tranche d’âge inclusive indiquée par l’hébreu, « depuis l’âge de vingt ans et au-dessous ».
- source_word: כִּי
  choice: car
  rationale: La particule introduit la raison pour laquelle David n’a pas dénombré ce groupe d’âge.
- source_word: אָמַר יְהוָה
  choice: Yahweh avait dit
  rationale: Le plus-que-parfait marque naturellement l’antériorité de la parole divine sur la décision de David, et le nom divin est translittéré « Yahweh ».
- source_word: לְהַרְבּוֹת אֶת יִשְׂרָאֵל
  choice: qu’il rendrait Israël aussi nombreux
  rationale: 'L’infinitif causatif exprime ici le contenu de la parole divine: Yahweh ferait croître le nombre d’Israël. La tournure française s’accorde naturellement avec la comparaison qui suit.'
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: que les étoiles du ciel
  rationale: Avec « aussi nombreux », « que » rend la comparaison de manière idiomatique. « Les étoiles du ciel » préserve l’image biblique traditionnelle sans lourdeur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Rapport entre le refus de recenser et la promesse divine
  choice: La parole de Yahweh est donnée comme la raison de la décision de David
  alternative: Présenter le recensement comme impossible en raison du caractère innombrable d’Israël
  rationale: Le verset dit simplement que David ne dénombra pas ce groupe parce que Yahweh avait annoncé la multiplication d’Israël. La traduction ne précise pas davantage le mécanisme ni la portée théologique de ce lien.
translation_notes:
  register: Français international moderne, digne et accessible. « Dénombrer » maintient le cadre administratif du recensement, tandis que « vingt ans ou moins » et « aussi nombreux que » assurent une lecture naturelle.
