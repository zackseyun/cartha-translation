base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/005.yaml
  text: The commander of the third division for the third month was Benaiah son of Jehoiada the chief[a], and in his division were twenty-four thousand.
translation:
  language: fr
  text: Le commandant de la troisième division du troisième mois était Benaya, fils de Yehoyada le prêtre, qui était chef[a]. Sa division comptait vingt-quatre mille hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Benaya, fils de Yehoyada, le prêtre en chef ». L’hébreu permet de rattacher « chef » soit à Benaya, soit à Yehoyada.'
    reason: ambiguïté syntaxique
lexical_decisions:
- source_word: שַׂר הַצָּבָא
  choice: le commandant de la division
  rationale: שַׂר désigne ici l’officier placé à la tête d’une unité militaire. Le contexte du chapitre permet d’expliciter « division » pour rendre l’ellipse hébraïque.
- source_word: הַשְּׁלִישִׁי לַחֹדֶשׁ הַשְּׁלִישִׁי
  choice: de la troisième division, pour le troisième mois
  rationale: Le premier ordinal situe cette unité dans la série des divisions mensuelles, tandis que le second qualifie le mois.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya, fils de Yehoyada
  rationale: Translittération française moderne des noms propres, avec maintien explicite de la filiation.
- source_word: הַכֹּהֵן רֹאשׁ
  choice: le prêtre en chef
  rationale: Cette lecture rattache les deux termes à Yehoyada et rend leur valeur appositionnelle en français naturel. La syntaxe hébraïque permet toutefois de comprendre רֹאשׁ séparément, d’où la note.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Sa division comptait
  rationale: Dans la formule répétée du chapitre, cette expression introduit l’effectif de l’unité relevant du commandant. Cette formulation est idiomatique sans altérer la relation de commandement.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vingt-quatre mille hommes
  rationale: Le nombre est rendu directement; « hommes » explicite l’unité humaine sous-entendue par le contexte militaire.
theological_decisions:
- issue: Rattachement de הַכֹּהֵן רֹאשׁ
  choice: « Yehoyada, le prêtre en chef »
  alternative: « Benaya, fils de Yehoyada le prêtre, était le chef »
  rationale: L’hébreu permet de rattacher « chef » soit à la désignation sacerdotale de Yehoyada, soit à Benaya. Le texte principal retient une lecture française fluide, tandis que la note conserve l’autre analyse sans trancher une question doctrinale.
