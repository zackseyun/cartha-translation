base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/030.yaml
  text: Over the camels was Obil the Ishmaelite[a], and over the female donkeys was Jehdeiah the Meronothite.
translation:
  language: fr
  text: Obil l’Ismaélite était responsable des chameaux, et Yehdeya de Méronoth, des ânesses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: était responsable de
  rationale: Dans cette liste administrative, עַל exprime la responsabilité ou la surveillance d’un ensemble de biens royaux. Cette tournure est plus naturelle en français actuel que le calque « sur ».
- source_word: הַגְּמַלִּים
  choice: des chameaux
  rationale: Traduction directe du nom défini pluriel. Après « responsable de », le français emploie naturellement l’article contracté « des ».
- source_word: אוֹבִיל
  choice: Obil
  rationale: Nom propre translittéré selon une forme claire et courante en français.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: l’Ismaélite
  rationale: Le gentilé désigne l’appartenance ethnique ou clanique d’Obil; « l’Ismaélite » en conserve la forme concise.
- source_word: הָאֲתֹנוֹת
  choice: des ânesses
  rationale: Le nom אָתוֹן désigne spécifiquement l’âne femelle. « Ânesses » est précis, naturel et concis en français.
- source_word: יֶחְדְּיָהוּ
  choice: Yehdeya
  rationale: Translittération française lisible du nom hébreu, qui conserve notamment sa consonne initiale.
- source_word: הַמֵּרֹנֹתִי
  choice: de Méronoth
  rationale: Le terme est vraisemblablement un gentilé dérivé d’un nom de lieu. En français, « de Méronoth » identifie naturellement l’origine de Yehdeya sans imposer le gentilé peu transparent « Méronotite ».
