source:
  edition: WLC
  text: וְ/עַ֞ל מַחֲלֹ֣קֶת הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֗י דּוֹדַ֤י הָ/אֲחוֹחִי֙ וּ/מַ֣חֲלֻקְתּ֔/וֹ וּ/מִקְל֖וֹת הַ/נָּגִ֑יד וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/004.yaml
  text: Over the division for the second month was Dodai the Ahohite[a], and Mikloth was the leader over his division; and in his division were twenty-four thousand.
translation:
  language: fr
  text: À la tête de la division du deuxième mois se trouvait Dodaï l’Ahohite[a], et Miqloth était le chef de sa division. Sa division comptait 24 000 hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Dodaï l’Ahohite et sa division, avec Miqloth comme chef ». L’enchaînement hébreu est condensé, et l’on ne sait pas avec certitude si Miqloth est le second de Dodaï au sein de la division ou celui qui en a la responsabilité.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַחֲלֹקֶת / מַחֲלֻקְתּוֹ
  choice: division / sa division
  rationale: Dans ce contexte militaire et administratif, le terme désigne l’unité affectée au service mensuel par rotation. « Division » exprime clairement cette organisation et permet de rendre de façon cohérente la forme munie du suffixe.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: le deuxième mois
  rationale: Expression ordinale simple désignant le mois correspondant à cette rotation de service.
- source_word: דּוֹדַי
  choice: Dodaï
  rationale: Translittération française de la forme consonantique propre à ce verset, sans l’assimiler à la forme apparentée Dodo attestée ailleurs.
- source_word: הָאֲחוֹחִי
  choice: l’Ahohite
  rationale: Désignation de clan ou d’origine munie de l’article en hébreu; la forme traditionnelle française reste claire comme gentilé.
- source_word: וּמִקְלוֹת
  choice: Miqloth
  rationale: Translittération du nom propre hébreu.
- source_word: הַנָּגִיד
  choice: le chef
  rationale: Le terme désigne un responsable ou dirigeant. « Chef » convient au cadre militaire et administratif sans préciser indûment son rang exact.
- source_word: וְעַל־מַחֲלֻקְתּוֹ
  choice: de sa division
  rationale: Dans la construction française « le chef de sa division », cette formulation rend naturellement l’autorité exprimée par עַל tout en évitant une répétition lourde.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24 000 hommes
  rationale: Le nombre est rendu selon l’usage typographique français. « Hommes » explicite naturellement les membres de cette unité militaire, sous-entendus dans l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase a été légèrement restructurée pour rendre lisible l’enchaînement administratif très condensé de l’hébreu, tandis que la note conserve l’ambiguïté concernant la fonction exacte de Miqloth.
