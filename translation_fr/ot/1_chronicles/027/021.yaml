base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/021.yaml
  text: 'for the half-tribe of Manasseh in Gilead: Iddo son of Zechariah[a]; for Benjamin: Jaasiel son of Abner.'
translation:
  language: fr
  text: 'pour la demi-tribu de Manassé en Galaad : Iddo, fils de Zacharie ; pour Benjamin : Jaasiel, fils d’Abner.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַ/חֲצִי הַֽ/מְנַשֶּׁה
  choice: pour la demi-tribu de Manassé
  rationale: Dans cette liste administrative, le préfixe ל marque le groupe représenté par le responsable nommé. « tribu » est explicité pour indiquer clairement qu’il s’agit d’une moitié de la tribu de Manassé.
- source_word: גִּלְעָדָ/ה
  choice: en Galaad
  rationale: La forme désigne ici la région transjordanienne à laquelle appartient cette moitié de Manassé. Dans ce contexte de liste, « en Galaad » rend naturellement la valeur géographique.
- source_word: יִדּוֹ
  choice: Iddo
  rationale: Transcription française usuelle de ce nom propre.
- source_word: בֶּן זְכַרְיָהוּ
  choice: fils de Zacharie
  rationale: La formule généalogique בֶּן est rendue par « fils de » ; « Zacharie » est la forme française traditionnelle et immédiatement reconnaissable du nom.
- source_word: לְ/בִנְיָמִן
  choice: pour Benjamin
  rationale: Le préfixe ל marque de nouveau le groupe tribal représenté. La formulation concise convient à la structure répétitive de la liste.
- source_word: יַעֲשִׂיאֵל
  choice: Jaasiel
  rationale: « Jaasiel » représente adéquatement la vocalisation massorétique יַעֲשִׂיאֵל et correspond à une forme française attestée du nom.
- source_word: בֶּן אַבְנֵר
  choice: fils d’Abner
  rationale: Traduction naturelle de la formule généalogique, avec la forme française conventionnelle « Abner ».
