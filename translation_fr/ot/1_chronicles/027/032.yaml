  text: וִֽ/יהוֹנָתָ֤ן דּוֹד דָּוִיד֙ יוֹעֵ֔ץ אִישׁ מֵבִ֥ין וְ/סוֹפֵ֖ר ה֑וּא וִֽ/יחִיאֵ֥ל בֶּן חַכְמוֹנִ֖י עִם בְּנֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/032.yaml
  text: Jonathan[a], David’s uncle, was a counselor, a man of understanding, and a scribe[b]; and Jehiel son of Hachmoni was with the king’s sons.
translation:
  language: fr
  text: Jonathan, l’oncle de David, était conseiller, homme avisé et scribe. Yehiel, fils de Hakmoni, était auprès des fils du roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des princes royaux ». L’hébreu dit littéralement « des fils du roi ». Il précise seulement que Yehiel était auprès d’eux; certains comprennent qu’il les servait ou les encadrait.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד
  choice: l’oncle
  rationale: Dans ce contexte familial et royal, avec David nommé explicitement, le mot désigne très probablement le lien de parenté « oncle », plutôt que « bien-aimé » ou « ami ».
- source_word: יוֹעֵץ
  choice: conseiller
  rationale: Le participe désigne quelqu’un qui donne des conseils, vraisemblablement dans une fonction officielle à la cour.
- source_word: אִישׁ מֵבִין
  choice: homme avisé
  rationale: Cette formulation française naturelle exprime la compréhension et le discernement attribués à Jonathan sans rendre la phrase inutilement lourde.
- source_word: סוֹפֵר
  choice: scribe
  rationale: Le terme peut désigner un lettré exerçant des fonctions d’écriture ou d’administration. « Scribe » conserve cette étendue de sens sans préciser indûment « secrétaire ».
- source_word: עִם
  choice: était auprès de
  rationale: La préposition signifie littéralement « avec ». « Auprès de » reste naturel en français tout en évitant d’imposer une fonction de surveillance que l’hébreu n’énonce pas explicitement.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: les fils du roi
  rationale: L’expression hébraïque dit explicitement « les fils du roi »; cette traduction préserve cette précision, tout en laissant la note signaler le sens contextuel possible de « princes royaux ».
- source_word: יְחִיאֵל
  choice: Yehiel
  rationale: Translittération française claire du nom hébreu.
- source_word: חַכְמוֹנִי
  choice: Hakmoni
  rationale: Translittération française directe du nom propre hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe est légèrement allégée en deux phrases. « Était auprès de » préserve la retenue et l’ambiguïté de l’hébreu concernant le rôle exact de Yehiel.
