source:
  edition: WLC
  text: וְ/עַ֗ל עֹשֵׂי֙ מְלֶ֣אכֶת הַ/שָּׂדֶ֔ה לַ/עֲבֹדַ֖ת הָ/אֲדָמָ֑ה עֶזְרִ֖י בֶּן כְּלֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/026.yaml
  text: And over those who did the work of the field for the cultivation of the ground was Ezri son of Chelub[a][b].
translation:
  language: fr
  text: Ézri, fils de Keloub, était responsable de ceux qui effectuaient les travaux des champs[a] pour cultiver le sol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des ouvriers agricoles ». L’expression participiale hébraïque peut être rendue de manière plus concise.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour travailler la terre ». L’expression désigne le travail agricole du sol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: était responsable de
  rationale: Dans cette liste administrative, עַל indique la responsabilité exercée sur un domaine ou un groupe. La tournure française avec « était responsable de » rend naturellement cette fonction de supervision.
- source_word: עֹשֵׂי מְלֶאכֶת הַשָּׂדֶה
  choice: ceux qui effectuaient les travaux des champs
  rationale: Le participe עֹשֵׂי désigne les personnes qui accomplissent l’activité, tandis que מְלֶאכֶת הַשָּׂדֶה renvoie aux travaux agricoles. Cette formulation reste proche de la structure hébraïque tout en étant claire en français.
- source_word: לַעֲבֹדַת הָאֲדָמָה
  choice: pour cultiver le sol
  rationale: Dans ce contexte agricole, עֲבֹדָה désigne le travail ou la mise en culture, et אֲדָמָה la terre arable ou le sol. « Cultiver le sol » exprime ce sens sans élargir le terme à un territoire.
- source_word: עֶזְרִי בֶּן כְּלוּב
  choice: Ézri, fils de Keloub
  rationale: Les noms sont translittérés à partir de l’hébreu, et בֶּן est rendu par la formule française habituelle « fils de ».
theological_decisions: []
