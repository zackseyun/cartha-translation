  text: לִ/זְבוּלֻ֕ן יִֽשְׁמַֽעְיָ֖הוּ בֶּן עֹבַדְיָ֑הוּ לְ/נַ֨פְתָּלִ֔י יְרִימ֖וֹת בֶּן עַזְרִיאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/019.yaml
  text: for Zebulun, Ishmaiah son of Obadiah; for Naphtali, Jerimoth son of Azriel.
translation:
  language: fr
  text: pour Zabulon, Yishmaïa, fils d'Abdias ; pour Nephtali, Yerimoth, fils d'Azriel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/זְבוּלֻן
  choice: pour Zabulon
  rationale: Le préfixe ל marque ici l'affectation ou la représentation dans la liste des responsables des tribus. « Pour Zabulon » reste concis et naturel.
- source_word: יִשְׁמַעְיָהוּ
  choice: Yishmaïa
  rationale: Le nom propre est translittéré sous une forme française qui distingue la consonne initiale hébraïque et rend la finale théophore de manière lisible.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette formule d'identification, בֶּן exprime la filiation directe.
- source_word: עֹבַדְיָהוּ
  choice: Abdias
  rationale: La forme française biblique usuelle est retenue pour ce nom propre.
- source_word: לְ/נַפְתָּלִי
  choice: pour Nephtali
  rationale: Comme pour Zabulon, le préfixe ל indique la tribu à laquelle le responsable est affecté ou qu'il représente.
- source_word: יְרִימוֹת
  choice: Yerimoth
  rationale: Cette translittération française rend la consonne initiale hébraïque tout en conservant une forme reconnaissable du nom biblique.
- source_word: עַזְרִיאֵל
  choice: Azriel
  rationale: La forme « Azriel » est une translittération française claire et courante du nom hébreu.
