  text: לִ/בְנֵ֣י אֶפְרַ֔יִם הוֹשֵׁ֖עַ בֶּן עֲזַזְיָ֑הוּ לַ/חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יוֹאֵ֖ל בֶּן פְּדָיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/020.yaml
  text: 'For the sons of Ephraim: Hoshea son of Azaziah[a]; for the half-tribe of Manasseh: Joel son of Pedaiah.'
translation:
  language: fr
  text: 'Pour les fils d’Éphraïm : Osée, fils d’Azazia ; pour la demi-tribu de Manassé : Joël, fils de Pedaja.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי
  choice: Pour les fils de
  rationale: Le préfixe ל indique ici le groupe dont le responsable a la charge, dans le cadre de cette liste administrative. « Fils de » conserve la désignation tribale hébraïque traditionnelle.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Forme française usuelle du nom propre de la tribu.
- source_word: הוֹשֵׁעַ
  choice: Osée
  rationale: Forme française biblique usuelle de ce nom hébreu ; le contexte suffit à le distinguer du prophète du même nom.
- source_word: בֶּן
  choice: fils de
  rationale: Expression française naturelle et fidèle pour le lien généalogique indiqué par בֶּן.
- source_word: עֲזַזְיָהוּ
  choice: Azazia
  rationale: Translittération adaptée aux conventions françaises des noms bibliques en -יהו.
- source_word: לַחֲצִי שֵׁבֶט
  choice: pour la demi-tribu
  rationale: Le préfixe ל reprend l’idée d’attribution ou de responsabilité ; « demi-tribu » est l’expression française consacrée et naturelle.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française usuelle du nom de la tribu.
- source_word: יוֹאֵל
  choice: Joël
  rationale: Forme française usuelle de ce nom propre hébreu.
- source_word: פְּדָיָהוּ
  choice: Pedaya
  rationale: Translittération française claire, reflétant le nom hébreu פְּדָיָהוּ.
