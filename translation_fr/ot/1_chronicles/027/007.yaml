base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/007.yaml
  text: The fourth[a], for the fourth month, was Asahel the brother of Joab, and Zebadiah his son after him; and over his division were twenty-four thousand.
translation:
  language: fr
  text: Le quatrième, pour le quatrième mois, était Asaël, frère de Joab ; son fils Zabadia lui succéda. Sa division comptait vingt-quatre mille hommes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרְבִיעִי לַחֹדֶשׁ הָרְבִיעִי
  choice: Le quatrième, pour le quatrième mois
  rationale: L’adjectif ordinal initial est employé substantivement dans la formule de cette liste; l’ellipse est conservée, tandis que le complément indique la rotation mensuelle.
- source_word: עֲשָׂהאֵל אֲחִי יוֹאָב
  choice: Asaël, frère de Joab
  rationale: Transcription française usuelle des noms et rendu direct de la relation exprimée par l’état construit.
- source_word: וּזְבַדְיָה בְנוֹ אַחֲרָיו
  choice: et Zabadia, son fils, après lui
  rationale: Le rendu garde l’expression hébraïque concise « après lui », qui indique ici une succession sans préciser davantage ses circonstances.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Sa division comptait
  rationale: Dans ce contexte administratif et militaire, מַחֲלֻקָה désigne une division. La tournure française exprime naturellement l’effectif rattaché à celle-ci.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24 000 hommes
  rationale: Le nombre est rendu selon l’usage français moderne; « hommes » est explicité d’après le contexte militaire de la liste.
