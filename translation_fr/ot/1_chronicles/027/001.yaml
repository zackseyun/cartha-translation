revisions:
- from: Les fils d’Israël, selon leur nombre — les chefs des maisons paternelles[a], les chefs de milliers et de centaines, ainsi que leurs officiers qui servaient le roi pour tout ce qui concernait les divisions entrant en service et en sortant[b], mois après mois, pendant tous les mois de l’année — formaient des divisions de vingt-quatre mille hommes chacune.
  to: 'Les fils d’Israël, selon leur nombre : les chefs des maisons paternelles[a], les chefs de milliers et de centaines, ainsi que leurs officiers qui servaient le roi pour tout ce qui concernait les divisions entrant en service et en sortant[b], mois après mois, pendant tous les mois de l’année — chaque division comptait vingt-quatre mille hommes.'
  rationale: La révision conserve les choix lexicaux solides du projet, mais rend explicitement la proposition finale comme un effectif propre à chaque division, conformément à l’hébreu. La note sur la rotation est resserrée afin de ne pas présenter comme explicite une modalité seulement implicite.
