  register: Français international moderne, soutenu mais accessible. La longue structure administrative de l’hébreu est conservée à l’aide de tirets, tandis que la proposition finale est intégrée de manière idiomatique. Aucun marqueur temporel tel que « maintenant » n’est ajouté.
