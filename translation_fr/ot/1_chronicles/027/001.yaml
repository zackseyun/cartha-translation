  text: וּ/בְנֵ֣י יִשְׂרָאֵ֣ל לְֽ/מִסְפָּרָ֡/ם רָאשֵׁ֣י הָ/אָב֣וֹת וְ/שָׂרֵ֣י הָֽ/אֲלָפִ֣ים וְ/הַ/מֵּא֡וֹת וְ/שֹׁטְרֵי/הֶם֩ הַ/מְשָׁרְתִ֨ים אֶת הַ/מֶּ֜לֶךְ לְ/כֹ֣ל דְּבַ֣ר הַֽ/מַּחְלְק֗וֹת הַ/בָּאָ֤ה וְ/הַ/יֹּצֵאת֙ חֹ֣דֶשׁ בְּ/חֹ֔דֶשׁ לְ/כֹ֖ל חָדְשֵׁ֣י הַ/שָּׁנָ֑ה הַֽ/מַּחֲלֹ֨קֶת֙ הָֽ/אַחַ֔ת עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׀־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/001.yaml
  text: The sons of Israel according to their number—the heads of fathers’ houses[a], and the commanders of thousands and of hundreds[c][b], and their officers who served the king in every matter of the divisions that came in and went out month by month throughout all the months of the year—each division was twenty-four thousand.
translation:
  language: fr
  text: 'Les fils d’Israël, selon leur nombre : les chefs des maisons paternelles[a], les chefs de milliers et de centaines, ainsi que leurs officiers qui servaient le roi pour tout ce qui concernait les divisions entrant en service et en sortant[b], mois après mois, pendant tous les mois de l’année — chaque division comptait vingt-quatre mille hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne les chefs des groupes familiaux ancestraux.
    reason: cultural_note
  - marker: b
    text: Les divisions se relayaient au service du roi, mois après mois.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Les fils d’Israël
  rationale: Conserve l’expression collective traditionnelle et formelle du texte hébreu, sans introduire un marqueur temporel absent de la source.
- source_word: לְמִסְפָּרָם
  choice: selon leur nombre
  rationale: Reproduit le sens de recensement ou de classement numérique dans ce contexte administratif.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: les chefs des maisons paternelles
  rationale: Rend le terme socio-administratif fondé sur les groupes de parenté, tout en restant intelligible en français.
- source_word: וְשָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: les chefs de milliers et de centaines
  rationale: Conserve les unités numériques de l’organisation militaire et administrative sans préciser davantage que l’hébreu.
- source_word: וְשֹׁטְרֵיהֶם
  choice: leurs officiers
  rationale: Dans ce cadre royal et militaire, « officiers » exprime naturellement la fonction administrative de ces responsables.
- source_word: הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: qui servaient le roi
  rationale: Rend simplement le participe décrivant leur service officiel continu auprès du roi.
- source_word: לְכֹל דְּבַר הַמַּחְלְקוֹת
  choice: pour tout ce qui concernait les divisions
  rationale: Exprime idiomatiquement l’étendue de leurs responsabilités relatives aux divisions.
- source_word: הַבָּאָה וְהַיֹּצֵאת
  choice: entrant en service et en sortant
  rationale: Explicite sobrement le mouvement de relève visé par les deux participes, plutôt qu’un simple déplacement physique.
- source_word: חֹדֶשׁ בְּחֹדֶשׁ
  choice: mois après mois
  rationale: Équivalent français naturel de l’expression distributive hébraïque.
- source_word: לְכֹל חָדְשֵׁי הַשָּׁנָה
  choice: pendant tous les mois de l’année
  rationale: Conserve l’idée d’un cycle couvrant l’année entière.
- source_word: הַמַּחֲלֹקֶת הָאַחַת
  choice: des divisions de vingt-quatre mille hommes chacune
  rationale: La formulation distributive française « chacune » rend le sens contextuel de chaque division prise individuellement.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vingt-quatre mille hommes
  rationale: Rend le nombre directement; « hommes » explicite les personnes comptées dans ces divisions de service royal.
