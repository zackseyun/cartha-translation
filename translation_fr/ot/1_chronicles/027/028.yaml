source:
  edition: WLC
  text: וְ/עַל הַ/זֵּיתִ֤ים וְ/הַ/שִּׁקְמִים֙ אֲשֶׁ֣ר בַּ/שְּׁפֵלָ֔ה בַּ֥עַל חָנָ֖ן הַ/גְּדֵרִ֑י וְ/עַל אֹצְר֥וֹת הַ/שֶּׁ֖מֶן יוֹעָֽשׁ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/028.yaml
  text: Over the olive trees and the sycamore trees in the Shephelah was Baal-hanan the Gederite[b][a]; and over the stores of oil was Joash.
translation:
  language: fr
  text: Baal-Hanân, de Guéder, était responsable des oliviers et des sycomores[a] qui se trouvaient dans la Shéphéla[b] ; Joas était responsable des réserves d’huile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « figuiers-sycomores ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le Bas-Pays ». La Shéphéla est la région de collines basses située entre les montagnes de Juda et la plaine côtière.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: était responsable de
  rationale: Dans cette liste administrative, עַל introduit le domaine confié à un responsable. Cette formulation est naturelle et explicite en français moderne.
- source_word: הַזֵּיתִים
  choice: des oliviers
  rationale: Dans ce contexte de gestion agricole, le pluriel désigne les arbres plutôt que leurs fruits.
- source_word: וְהַשִּׁקְמִים
  choice: et des sycomores
  rationale: Le terme désigne le figuier-sycomore. « Sycomores » est concis et lisible, tandis qu’une note donne le terme botanique plus précis.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: qui se trouvaient dans la Shéphéla
  rationale: שְׁפֵלָה désigne ici vraisemblablement la région géographique de Juda. La translittération conserve ce toponyme, expliqué en note.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanân
  rationale: Le nom propre est translittéré selon des conventions françaises lisibles, en conservant ses deux éléments.
- source_word: הַגְּדֵרִי
  choice: de Guéder
  rationale: Le gentilé hébreu indique l’origine géographique. « De Guéder » est plus immédiatement compréhensible qu’un gentilé français rare.
- source_word: אֹצְרוֹת
  choice: réserves
  rationale: Dans ce contexte, le mot peut désigner les lieux de stockage ou leur contenu. « Réserves » préserve cette souplesse sans imposer l’idée d’un bâtiment.
- source_word: הַשֶּׁמֶן
  choice: d’huile
  rationale: Le groupe construit אֹצְרוֹת הַשֶּׁמֶן se rend naturellement en français par « réserves d’huile ».
- source_word: יוֹעָשׁ
  choice: Joas
  rationale: Forme française biblique usuelle de ce nom propre.
