  text: וְ/אַחֲרֵ֣י אֲחִיתֹ֗פֶל יְהוֹיָדָ֤ע בֶּן בְּנָיָ֨הוּ֙ וְ/אֶבְיָתָ֔ר וְ/שַׂר צָבָ֥א לַ/מֶּ֖לֶךְ יוֹאָֽב־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/034.yaml
  text: After Ahithophel came Jehoiada son of Benaiah and Abiathar[a]; and Joab was commander of the army for the king.
translation:
  language: fr
  text: Après Ahitofel vinrent Yehoyada, fils de Benaya, et Abiatar[a]. Joab était le chef de l’armée du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Après Ahitofel, Yehoyada, fils de Benaya, et Abiatar. » Le verbe est sous-entendu en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי אֲחִיתֹפֶל
  choice: Après Ahitofel vinrent
  rationale: אַחֲרֵי signifie « après ». Dans cette liste de responsables, le verbe de succession, sous-entendu en hébreu, est exprimé en français pour rendre la phrase naturelle, sans masquer l’ellipse du texte source, signalée en note.
- source_word: יְהוֹיָדָע בֶּן בְּנָיָהוּ
  choice: Yehoyada, fils de Benaya
  rationale: Le patronyme hébreu est rendu selon l’usage français courant. Les noms sont translittérés de manière à refléter raisonnablement leur forme hébraïque tout en restant lisibles.
- source_word: וְ/אֶבְיָתָר
  choice: et Abiatar
  rationale: La conjonction rattache Abiatar à Yehoyada parmi ceux qui viennent après Ahitofel.
- source_word: וְ/שַׂר צָבָא ... יוֹאָב
  choice: Joab était le chef de l’armée
  rationale: שַׂר צָבָא désigne le commandant ou chef militaire. Le français ajoute la copule « était », sous-entendue dans la proposition nominale hébraïque.
- source_word: לַ/מֶּלֶךְ
  choice: du roi
  rationale: Le ל marque ici la relation au service du roi. « L’armée du roi » est une formulation française naturelle qui conserve cette relation.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La succession implicite est explicitée dans le texte principal, tandis que la construction nominale plus littérale est conservée en note. Les noms propres suivent une translittération française proche de l’hébreu.
