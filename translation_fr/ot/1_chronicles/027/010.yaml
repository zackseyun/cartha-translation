  text: הַ/שְּׁבִיעִי֙ לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י חֶ֥לֶץ הַ/פְּלוֹנִ֖י מִן בְּנֵ֣י אֶפְרָ֑יִם וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/010.yaml
  text: 'The seventh[a], for the seventh month: Helez the Pelonite, from the sons of Ephraim; and over his division were twenty-four thousand.'
translation:
  language: fr
  text: 'Le septième[a], pour le septième mois : Hélets le Pelonite, issu des fils d’Éphraïm ; sa division était de vingt-quatre mille.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « le Paltite », selon une autre identification traditionnelle du clan de Hélets.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְּׁבִיעִי
  choice: Le septième
  rationale: L’adjectif ordinal est employé elliptiquement dans cette liste pour désigner le septième responsable. La formulation concise conserve la structure du texte sans ajouter de titre absent de l’hébreu.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: pour le septième mois
  rationale: Dans le contexte administratif du chapitre, la préposition ל marque l’affectation au mois indiqué.
- source_word: חֶלֶץ
  choice: Hélets
  rationale: Translittération française courante du nom propre hébreu, avec une finale qui rend la consonne צ.
- source_word: הַפְּלוֹנִי
  choice: le Pelonite
  rationale: Ce gentilé suit le texte consonantique massorétique de ce verset. Une autre identification traditionnelle, « le Paltite », est signalée en note.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: l’un des fils d’Éphraïm
  rationale: Rend l’appartenance tribale exprimée littéralement par « parmi les fils d’Éphraïm » dans un français naturel, tout en conservant l’image généalogique hébraïque.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Sa division comptait
  rationale: מַחֲלֻקָה désigne ici l’unité militaire placée sous l’autorité du responsable. La tournure française exprime naturellement le rapport entre le chef, sa division et l’effectif annoncé.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vingt-quatre mille hommes
  rationale: Le nombre est écrit en toutes lettres. « hommes » explicite l’effectif militaire sous-entendu par le contexte de la liste.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe fragmentaire de la liste hébraïque est légèrement lissée par « était » et « comptait », sans modifier les données du verset. Le marqueur de note est placé immédiatement après l’ordinal auquel il se rapporte.
