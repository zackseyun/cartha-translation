  text: וְ/עַל הַ֨/כְּרָמִ֔ים שִׁמְעִ֖י הָ/רָֽמָתִ֑י וְ/עַ֤ל שֶׁ/בַּ/כְּרָמִים֙ לְ/אֹצְר֣וֹת הַ/יַּ֔יִן זַבְדִּ֖י הַ/שִּׁפְמִֽי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/027.yaml
  text: Over the vineyards was Shimei the Ramathite[b][a]; and over the produce of the vineyards for the wine cellars was Zabdi the Shiphmite.
translation:
  language: fr
  text: 'Responsable des vignes : Shiméï, de Rama ; responsable de la production des vignes destinée aux entrepôts de vin[a] : Zabdi, de Shéfam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ce qui était dans les vignes, pour les entrepôts de vin ». Ou « pour les réserves de vin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Responsable de
  rationale: Dans cette liste administrative, עַל introduit le domaine confié à chaque responsable. Cette formulation est naturelle en français tout en conservant la structure concise du verset.
- source_word: הַכְּרָמִים
  choice: des vignes
  rationale: כֶּרֶם désigne une vigne ou un vignoble. Au pluriel, « les vignes » convient naturellement au domaine agricole placé sous administration.
- source_word: שִׁמְעִי
  choice: Shiméï
  rationale: Transcription française usuelle du nom hébreu.
- source_word: הָרָמָתִי
  choice: de Rama
  rationale: Le gentilé hébreu indique l'origine géographique. En français courant, « de Rama » est plus transparent qu'un gentilé rare.
- source_word: שֶׁבַּכְּרָמִים
  choice: ce que produisaient les vignes
  rationale: Littéralement « ce qui était dans les vignes ». Le contexte de la conservation du vin indique vraisemblablement le produit des vignes, sans réduire explicitement celui-ci aux seuls raisins.
- source_word: לְאֹצְרוֹת הַיַּיִן
  choice: pour les réserves de vin
  rationale: אֹצָר désigne un lieu ou un dépôt de stockage. « Réserves de vin » garde ouverte la nuance entre les locaux de stockage et leur contenu, tandis que לְ exprime ici la destination de la production.
- source_word: זַבְדִּי
  choice: Zabdi
  rationale: Transcription du nom propre hébreu.
- source_word: הַשִּׁפְמִי
  choice: de Shéfam
  rationale: Le gentilé renvoie probablement à un lieu nommé Shéfam. La tournure géographique est claire en français, tout en laissant l'identification exacte du lieu ouverte.
theological_decisions: []
translation_notes:
  register: Style administratif concis et digne. La construction en deux segments parallèles rend clairement la répartition des responsabilités. Les gentilés rares sont exprimés par « de » suivi du lieu d'origine, conformément à un français moderne et accessible.
