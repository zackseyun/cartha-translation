source:
  edition: WLC
  text: הַ/שְּׁנֵ֤ים עָשָׂר֙ לִ/שְׁנֵ֣ים עָשָׂ֣ר הַ/חֹ֔דֶשׁ חֶלְדַּ֥י הַ/נְּטוֹפָתִ֖י לְ/עָתְנִיאֵ֑ל וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/015.yaml
  text: The twelfth[a], for the twelfth month, was Heldai the Netophathite, of Othniel[b]; and over his division were twenty-four thousand.
translation:
  language: fr
  text: Le douzième, affecté au douzième mois, était Heldaï[a], le Netophatite, d’Otniel[b]. Sa division comptait 24 000 hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines traditions parallèles donnent la forme « Héled » plutôt que « Heldaï ».
    reason: cross_reference
  - marker: b
    text: Littéralement « à Otniel »; l’expression indique probablement une appartenance à sa famille ou à son clan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: Le douzième
  rationale: L’ordinal désigne, dans le contexte, le douzième responsable du roulement militaire; le nom sous-entendu n’est pas ajouté afin de rester proche de la formulation hébraïque.
- source_word: לִשְׁנֵים עָשָׂר הַחֹדֶשׁ
  choice: affecté au douzième mois
  rationale: La préposition ל marque ici l’affectation au mois correspondant dans le calendrier des divisions; cette formulation rend clairement la fonction administrative.
- source_word: חֶלְדַּי
  choice: Heldaï
  rationale: Translittération française de la forme du nom propre attestée dans le texte hébreu de ce verset.
- source_word: הַנְּטוֹפָתִי
  choice: le Netophatite
  rationale: Le gentilé indique l’origine géographique liée à Netopha; la forme française traditionnelle est concise et précise.
- source_word: לְעָתְנִיאֵל
  choice: d’Otniel
  rationale: La tournure brève conserve l’ambiguïté de ל, qui peut signaler une appartenance familiale ou clanique, sans suggérer nécessairement un service direct sous Otniel.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Sa division comptait
  rationale: Dans ce chapitre, מַחֲלֻקָה désigne une division ou unité de service. La formulation française exprime naturellement l’effectif introduit par la construction hébraïque.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24 000 hommes
  rationale: Le nombre indique l’effectif de la division. « hommes » explicite en français le personnel militaire sous-entendu par le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase administrative est rendue avec fluidité, tandis que la relation exacte entre Heldaï et Otniel demeure volontairement ouverte dans le texte principal et est précisée en note.
