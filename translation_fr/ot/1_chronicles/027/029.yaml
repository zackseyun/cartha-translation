source:
  edition: WLC
  text: וְ/עַל הַ/בָּקָר֙ הָ/רֹעִ֣ים בַּ/שָּׁר֔וֹן שטרי הַ/שָּׁרוֹנִ֑י וְ/עַל הַ/בָּקָר֙ בָּֽ/עֲמָקִ֔ים שָׁפָ֖ט בֶּן עַדְלָֽי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/029.yaml
  text: Over the herds grazing in Sharon was Shitrai the Sharonite[b][a], and over the herds in the valleys was Shaphat son of Adlai.
translation:
  language: fr
  text: Shitraï, originaire du Sharon, était responsable des troupeaux[a] qui paissaient dans le Sharon[b], et Shaphath, fils d’Adlaï, était responsable des troupeaux dans les vallées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du bétail » au lieu de « des troupeaux ».
    reason: lexical_alternative
  - marker: b
    text: Le Sharon était la plaine côtière d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: était responsable de
  rationale: Dans cette liste administrative, la préposition עַל exprime une fonction de surveillance ou de responsabilité. Cette formulation est plus naturelle en français que le calque « sur ».
- source_word: הַבָּקָר
  choice: les troupeaux
  rationale: בקר désigne ici le bétail bovin envisagé collectivement. « Les troupeaux » convient au contexte pastoral et administratif, tandis qu’une note signale le rendu plus générique « le bétail ».
- source_word: הָרֹעִים
  choice: qui paissaient
  rationale: Le participe de רעה décrit les bêtes en train de se nourrir au pâturage. « Qui paissaient » rend clairement cette valeur en français courant et digne.
- source_word: בַּשָּׁרוֹן
  choice: dans le Sharon
  rationale: Le Sharon est ici un nom géographique. La préposition « dans » rend simplement la localisation des troupeaux dans cette région.
- source_word: שטרי
  choice: Shitraï
  rationale: Nom de personne translittéré en français de manière à refléter la forme hébraïque.
- source_word: הַשָּׁרוֹנִי
  choice: originaire du Sharon
  rationale: Le gentilé hébreu indique l’origine régionale de Shitraï. La formulation explicite est plus immédiatement compréhensible en français moderne que « le Sharonite ».
- source_word: בָּעֲמָקִים
  choice: dans les vallées
  rationale: Le pluriel עֲמָקִים désigne directement des vallées ou dépressions. « Dans les vallées » conserve ce sens sans préciser une région non nommée dans le texte.
- source_word: שָׁפָט
  choice: Shaphath
  rationale: Nom propre translittéré selon une forme française transparente.
- source_word: בֶּן עַדְלָי
  choice: fils d’Adlaï
  rationale: Rendu direct de la construction patronymique hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure administrative répétitive de l’hébreu est conservée par la reprise de « était responsable », tout en employant une syntaxe française naturelle.
