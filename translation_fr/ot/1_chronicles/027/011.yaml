  yaml_path: translation/ot/1_chronicles/027/011.yaml
  text: 'The eighth[a], for the eighth month: Sibbecai the Hushathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: fr
  text: Le huitième, pour le huitième mois, était Sibbecaï le Hushathite, du clan des Zérahites[a] ; sa division comptait 24 000 hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du Zérahite » ; l’expression désigne vraisemblablement ici l’appartenance au clan des Zérahites.'
    reason: alternative lexicale et ambiguïté de la construction hébraïque
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: Le huitième
  rationale: L’ordinal ouvre de manière elliptique une entrée de la liste. Le contexte indique qu’il s’agit du huitième responsable ou corps de service, sans qu’il soit nécessaire de l’expliciter dans le texte.
- source_word: לַחֹדֶשׁ הַשְּׁמִינִי
  choice: pour le huitième mois
  rationale: Dans cette liste administrative, la préposition ל indique l’affectation au mois de service concerné.
- source_word: סִבְּכַי
  choice: Sibbecaï
  rationale: Cette graphie suit une forme française traditionnelle et reconnaissable du nom hébreu.
- source_word: הַחֻשָׁתִי
  choice: le Hushathite
  rationale: Le gentilé identifie Sibbecaï par son origine géographique ou clanique ; la translittération conserve cette désignation.
- source_word: לַזַּרְחִי
  choice: du clan des Zérahites
  rationale: Dans ce contexte généalogique et militaire, le ל préfixé exprime vraisemblablement l’appartenance. La formulation française rend clairement cette affiliation collective tout en signalant en note la lecture plus littérale du gentilé singulier.
- source_word: מַחֲלֻקְתּוֹ
  choice: sa division
  rationale: Dans le contexte militaire de 1 Chroniques 27, מַחֲלֻקָה désigne une unité organisée affectée à une période de service.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24 000 hommes
  rationale: Le nombre est rendu selon l’usage typographique français. « hommes » explicite naturellement les membres de cette division militaire, déjà indiqués par le contexte.
