  text: And Ahithophel was counselor to the king[a], and Hushai the Archite was the king’s friend.
translation:
  language: fr
  text: Ahitofel était conseiller du roi, et Houshaï, l’Arkien, était l’ami du roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « compagnon » ou « associé » ; le terme hébreu peut désigner un ami au sens général et, dans un contexte royal, peut aussi évoquer un compagnon de cour jouissant de la confiance du roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Nom propre transcrit en français moderne au plus près de la forme hébraïque.
- source_word: יוֹעֵץ
  choice: conseiller
  rationale: Le terme désigne celui qui donne des conseils; « conseiller » convient naturellement au contexte de la cour royale.
- source_word: לַמֶּלֶךְ
  choice: du roi
  rationale: La préposition marque ici la relation ou le service auprès du roi; le complément français « du roi » exprime idiomatiquement cette fonction.
- source_word: חוּשַׁי
  choice: Houshaï
  rationale: Nom propre transcrit selon une forme française lisible qui représente les consonnes et la terminaison hébraïques.
- source_word: הָאַרְכִּי
  choice: l’Arkite
  rationale: Gentilé ou désignation d’origine rattachant Houshaï à un clan ou à un lieu; la translittération conserve cette identification sans la préciser davantage.
- source_word: רֵעַ
  choice: ami
  rationale: Le nom peut désigner un ami, un compagnon ou un proche. « Ami » en conserve le sens ordinaire tout en permettant, dans ce contexte royal, l’idée d’un confident ou d’un titre de cour.
- source_word: הַמֶּלֶךְ
  choice: du roi
  rationale: Le rapport au roi est rendu par la tournure française naturelle « l’ami du roi ».
- source_word: וַ / וְ
  choice: et
  rationale: Les conjonctions coordonnent cette notice avec son contexte et ses deux propositions; « et » rend ce lien simplement.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne, avec une syntaxe simple adaptée à une liste de responsables de la cour. La répétition de « du roi » préserve le parallélisme hébreu. Le marqueur de section massorétique final n’est pas traduit.
