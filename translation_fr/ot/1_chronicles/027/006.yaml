  text: ה֧וּא בְנָיָ֛הוּ גִּבּ֥וֹר הַ/שְּׁלֹשִׁ֖ים וְ/עַל הַ/שְּׁלֹשִׁ֑ים וּ/מַ֣חֲלֻקְתּ֔/וֹ עַמִּיזָבָ֖ד בְּנֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/006.yaml
  text: This was Benaiah[a], a mighty man of the Thirty and over the Thirty; and his division was under Ammizabad his son.
translation:
  language: fr
  text: C’était Benaya, vaillant guerrier parmi les Trente et chef des Trente. Sa division était sous les ordres de son fils Ammizabad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא בְנָיָהוּ
  choice: C’était Benaya
  rationale: Le pronom הוּא reprend avec insistance l’officier nommé au verset précédent. « C’était Benaya » rend naturellement cette reprise en français.
- source_word: גִּבּוֹר הַשְּׁלֹשִׁים
  choice: vaillant guerrier parmi les Trente
  rationale: גִּבּוֹר désigne ici un combattant valeureux. Le génitif peut exprimer son appartenance au corps d’élite connu comme « les Trente ».
- source_word: וְעַל הַשְּׁלֹשִׁים
  choice: et chef des Trente
  rationale: Dans ce contexte, עַל indique une autorité exercée sur le groupe. « Chef des Trente » est plus idiomatique que le calque « sur les Trente », sans préciser indûment un grade militaire.
- source_word: מַחֲלֻקְתּוֹ
  choice: Sa division
  rationale: Dans le contexte de 1 Chroniques 27, מַחֲלֻקָה désigne l’une des unités militaires servant à tour de rôle.
- source_word: עַמִּיזָבָד בְּנוֹ
  choice: son fils Ammizabad
  rationale: L’ordre français naturel place la relation familiale avant le nom propre, tout en conservant exactement l’identification hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation militaire est explicite sans ajouter de grade technique absent de l’hébreu. « Les Trente » reçoit une majuscule pour signaler le corps d’élite reconnu.
