base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/008.yaml
  text: The fifth[a], for the fifth month, was the commander Shamhuth the Izrahite; and over his division were twenty-four thousand.
translation:
  language: fr
  text: Le cinquième, pour le cinquième mois, était le commandant Shamhout, l’Izrahite[a] ; sa division comptait vingt-quatre mille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Zérahite ». Certaines traductions rendent traditionnellement ainsi le gentilé hébreu employé ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: Le cinquième
  rationale: L’ordinal est employé comme substantif dans cette liste militaire et désigne le cinquième groupe de service ; en français, le nom peut rester sous-entendu.
- source_word: לַחֹדֶשׁ הַחֲמִישִׁי
  choice: pour le cinquième mois
  rationale: La préposition ל marque ici l’affectation mensuelle de chaque division ; cette formulation rend naturellement l’organisation administrative du chapitre.
- source_word: הַשַּׂר
  choice: le commandant
  rationale: שַׂר désigne un responsable ou chef ; dans ce contexte militaire, « commandant » est précis, actuel et non archaïque.
- source_word: שַׁמְהוּת
  choice: Shamhout
  rationale: Transcription française du nom hébreu selon sa vocalisation massorétique.
- source_word: הַיִּזְרָח
  choice: l’Izrahite
  rationale: Le gentilé est transcrit au plus près de la forme consonantique et vocalisée du texte massorétique ; l’identification traditionnelle avec « Zérahite » demeure possible et est signalée en note.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: sa division comptait
  rationale: מַחֲלֻקָה désigne ici une division militaire. La tournure française exprime naturellement l’effectif placé sous son autorité.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vingt-quatre mille hommes
  rationale: Rendu français normal du nombre ; « hommes », implicite dans cette liste d’effectifs militaires, explicite clairement ce qui est compté.
