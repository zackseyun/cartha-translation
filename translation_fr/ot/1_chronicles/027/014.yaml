base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/014.yaml
  text: For the twelfth month[a], Benaiah the Pirathonite, from the sons of Ephraim; and over his division were twenty-four thousand.
translation:
  language: fr
  text: Le onzième, pour le onzième mois, était Benaya, le Pirathonite, des fils d’Éphraïm[a]. Sa division comptait 24 000 hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils d’Éphraïm ». L’expression désigne vraisemblablement son appartenance à la tribu d’Éphraïm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר לְעַשְׁתֵּי עָשָׂר הַחֹדֶשׁ
  choice: Le onzième, pour le onzième mois
  rationale: 'עַשְׁתֵּי עָשָׂר désigne ici le nombre ordinal onze dans la formule récurrente du chapitre : il s’agit du onzième chef affecté au onzième mois. La répétition de l’hébreu est conservée.'
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Translittération française courante du nom hébreu.
- source_word: הַפִּרְעָתוֹנִי
  choice: le Pirathonite
  rationale: Le gentilé hébreu indique l’origine géographique liée à Pirathon ; la forme traditionnelle française la rend avec concision.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: l’un des descendants d’Éphraïm
  rationale: Littéralement « parmi les fils d’Éphraïm » ; dans ce contexte, l’expression marque l’appartenance tribale plutôt qu’une filiation immédiate.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Sa division comptait
  rationale: Dans la formule administrative du chapitre, מַחֲלֻקָה désigne l’unité militaire placée sous l’autorité du chef nommé. Cette formulation est naturelle en français.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24 000 hommes
  rationale: Le nombre est rendu selon la typographie française. « hommes » explicite naturellement les membres de la division militaire, implicites dans le contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et administratif, en accord avec la liste militaire du chapitre. Le texte source indique le onzième mois, contrairement à la couche de consultation anglaise qui donne « twelfth month ». Le marqueur de note est placé après « Éphraïm », là où porte réellement l’explication.
