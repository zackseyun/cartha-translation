base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/009.yaml
  text: 'The sixth, for the sixth month: Ira son of Ikkesh the Tekoite; and over his division were twenty-four thousand.'
translation:
  language: fr
  text: 'Le sixième, pour le sixième mois : Ira, fils d’Ikkesh, de Tekoa ; sa division comptait 24 000.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: Le sixième
  rationale: L’ordinal est employé de manière elliptique dans cette liste et désigne le sixième responsable militaire. Le français conserve cette concision sans expliciter un rôle que le contexte fournit.
- source_word: לַחֹדֶשׁ הַשִּׁשִּׁי
  choice: pour le sixième mois
  rationale: Dans ce contexte administratif, la préposition ל indique l’affectation au mois de service correspondant.
- source_word: עִירָא בֶן עִקֵּשׁ
  choice: Ira, fils d’Ikesh
  rationale: Translittération moderne des noms et rendu direct de la construction filiale.
- source_word: הַתְּקוֹעִי
  choice: de Tekoa
  rationale: Le gentilé hébreu désigne l’origine géographique d’Ira. « de Tekoa » est plus naturel et immédiatement compréhensible en français courant que « le Tekoïte ».
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: sa division comptait
  rationale: מַחֲלֻקָה désigne ici une division militaire affectée à un tour de service. Cette formulation rend naturellement l’effectif placé sous sa responsabilité.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24 000 hommes
  rationale: Le nombre est rendu selon l’usage typographique français. « hommes » explicite le référent humain implicite de l’effectif militaire.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La structure elliptique du début est conservée, tandis que la dernière proposition est formulée naturellement pour rendre clairement l’effectif militaire.
