base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/018.yaml
  text: For Judah[a], Elihu, one of David’s brothers; for Issachar, Omri son of Michael.
translation:
  language: fr
  text: Pour Juda, Élihou[a], l’un des frères de David ; pour Issacar, Omri, fils de Micaël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « Élihou ». Certaines versions anciennes et certains interprètes lisent « Éliab », probablement par harmonisation avec le nom d’un frère de David mentionné ailleurs.
    reason: alternative_reading
lexical_decisions:
- source_word: לִיהוּדָה
  choice: Pour Juda
  rationale: Le préfixe ל introduit ici la tribu dans cette liste administrative. « Pour Juda » conserve naturellement la structure concise de l’énumération.
- source_word: אֱלִיהוּ
  choice: Élihou
  rationale: Le texte massorétique porte clairement אֱלִיהוּ. « Élihou » en est la translittération française usuelle ; la variante ancienne « Éliab » est signalée en note sans remplacer le texte hébreu retenu.
- source_word: מֵאֲחֵי דָוִיד
  choice: l’un des frères de David
  rationale: 'La préposition מִן devant le pluriel a ici une valeur partitive : Élihou appartient au groupe des frères de David.'
- source_word: לְיִשָּׂשכָר
  choice: pour Issacar
  rationale: Comme pour Juda, le préfixe ל introduit le représentant de la tribu dans la liste.
- source_word: עָמְרִי
  choice: Omri
  rationale: Translittération française traditionnelle de ce nom propre hébreu.
- source_word: בֶּן מִיכָאֵל
  choice: fils de Mikaël
  rationale: Cette construction patronymique hébraïque se rend naturellement ainsi en français. La graphie « Mikaël » distingue directement le nom hébreu מִיכָאֵל.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe elliptique et parallèle de la liste administrative est conservée, avec une ponctuation qui en facilite la lecture. Le marqueur de note est placé après « Élihou », le nom concerné par la variante.
