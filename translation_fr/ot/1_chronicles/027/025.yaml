id: 1CH.27.25
reference: 1 Chronicles 27:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַל֙ אֹצְר֣וֹת הַ/מֶּ֔לֶךְ עַזְמָ֖וֶת בֶּן עֲדִיאֵ֑ל וְ/עַ֣ל הָֽ/אֹצָר֡וֹת בַּ/שָּׂדֶ֞ה בֶּ/עָרִ֤ים וּ/בַ/כְּפָרִים֙ וּ/בַ/מִּגְדָּל֔וֹת יְהוֹנָתָ֖ן בֶּן עֻזִּיָּֽהוּ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/025.yaml
  text: Over the king’s treasuries was Azmaveth son of Adiel[a], and over the treasuries in the countryside, in the cities, in the villages, and in the towers[b], was Jehonathan son of Uzziah.
translation:
  language: fr
  text: Azmaveth, fils d’Adiel, était responsable des trésors du roi. Yehonatan, fils d’Ozias, était responsable des trésors qui se trouvaient dans la campagne[a], dans les villes, dans les villages et dans les tours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans le champ »; le singulier hébreu a probablement ici un sens collectif et désigne les zones rurales.
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu emploie ici la forme complète du nom, « Yehonatan »; certaines traductions utilisent la forme plus courte « Jonathan ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: était responsable de
  rationale: Dans cette liste administrative, עַל exprime une autorité ou une responsabilité confiée. Cette formulation est naturelle en français moderne.
- source_word: אֹצְרוֹת / הָאֹצָרוֹת
  choice: trésors
  rationale: אֹצָר peut désigner des richesses, des réserves ou le lieu où elles sont conservées. « Trésors » maintient l’ambivalence entre les biens entreposés et les dépôts royaux, tout en convenant au contexte administratif.
- source_word: הַמֶּלֶךְ
  choice: du roi
  rationale: Rend directement et naturellement le rapport de possession dans אֹצְרוֹת הַמֶּלֶךְ.
- source_word: עַזְמָוֶת
  choice: Azmaveth
  rationale: Translittération française reconnaissable du nom hébreu.
- source_word: בֶּן עֲדִיאֵל
  choice: fils d’Adiel
  rationale: Rendu généalogique direct et idiomatique.
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: Le singulier hébreu « champ » semble avoir ici un sens collectif et désigner les zones rurales, distinguées des villes, villages et tours.
- source_word: בֶּעָרִים
  choice: dans les villes
  rationale: Rendu locatif direct au sein de l’énumération géographique.
- source_word: וּבַכְּפָרִים
  choice: dans les villages
  rationale: כְּפָרִים désigne de petites localités rurales; « villages » est clair et courant.
- source_word: וּבַמִּגְדָּלוֹת
  choice: dans les tours
  rationale: Le texte dit simplement « tours » sans préciser s’il s’agit de tours de guet ou d’ouvrages fortifiés.
- source_word: יְהוֹנָתָן
  choice: Yehonatan
  rationale: Cette forme conserve le nom hébreu complet présent dans le texte, plutôt que sa forme abrégée Yonatan.
- source_word: בֶּן עֻזִּיָּהוּ
  choice: fils d’Ozias
  rationale: « Ozias » est la forme française biblique traditionnelle et largement reconnue de עֻזִּיָּהוּ.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « était responsable des trésors » explicite la structure administrative hébraïque tout en préservant le parallélisme. Les catégories géographiques restent non interprétées au-delà de ce qu’indique le texte.
