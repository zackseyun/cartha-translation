  yaml_path: translation/ot/1_chronicles/027/012.yaml
  text: 'The ninth, for the ninth month: Abiezer the Anathothite, from Benjamin; and over his division were twenty-four thousand.'
translation:
  language: fr
  text: Le neuvième chef, pour le neuvième mois, était Abiézer, d’Anatoth, de Benjamin ; et sa division comptait 24 000 hommes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעַנְּתֹתִי
  choice: d’Anatoth
  rationale: Le gentilé désigne l’origine géographique d’Abiézer; cette tournure est naturelle en français moderne.
- source_word: ל/בנימיני
  choice: de Benjamin
  rationale: Le texte massorétique présente une forme écrite difficile, traditionnellement comprise comme indiquant l’appartenance à Benjamin. « De Benjamin » conserve cette indication sans imposer le substantif « Benjaminite ».
- source_word: מַחֲלֻקְתּוֹ
  choice: sa division
  rationale: Dans le contexte de l’organisation militaire mensuelle, le terme désigne l’unité placée sous son commandement.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24 000 hommes
  rationale: Le nombre compte ici les membres de la division militaire; « hommes » explicite naturellement le référent implicite en français.
