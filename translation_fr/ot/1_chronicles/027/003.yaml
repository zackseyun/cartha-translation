  text: מִן בְּנֵי פֶ֗רֶץ הָ/רֹ֛אשׁ לְ/כָל שָׂרֵ֥י הַ/צְּבָא֖וֹת לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/003.yaml
  text: From the sons of Perez[b][a], the chief over all the commanders of the divisions for the first month.
translation:
  language: fr
  text: Il était de la lignée de Pérets[a] et était le chef de tous les commandants des troupes[b] pour le premier mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « des fils de Pérets » ; dans un contexte généalogique, cette expression peut désigner une lignée plus large.
    reason: lexical_alternative
  - marker: b
    text: Ou « des armées » ou « des forces militaires ». Dans ce chapitre, il s’agit des troupes organisées pour un service mensuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: Il appartenait à
  rationale: La préposition indique ici l’origine familiale ou l’appartenance à la lignée de Pérets. Cette formulation est naturelle en français et évite de réduire artificiellement le sens à une filiation immédiate.
- source_word: בְּנֵי פֶרֶץ
  choice: aux fils de Pérets
  rationale: La traduction conserve l’expression généalogique hébraïque « fils de Pérets », qui peut désigner plus largement ses descendants.
- source_word: הָרֹאשׁ
  choice: le chef
  rationale: Dans ce contexte militaire et administratif, רֹאשׁ désigne celui qui exerce l’autorité principale.
- source_word: לְכָל
  choice: de tous
  rationale: Avec « le chef », cette tournure française exprime naturellement l’étendue de son autorité sur l’ensemble des commandants concernés.
- source_word: שָׂרֵי הַצְּבָאוֹת
  choice: les commandants des troupes
  rationale: צְבָאוֹת désigne des forces militaires ou des armées. « Troupes » conserve ce sens général tout en convenant à l’organisation mensuelle décrite dans le chapitre.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: pour le premier mois
  rationale: L’expression situe cette responsabilité dans la rotation militaire correspondant au premier mois.
