base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/002.yaml
  text: Over the first division for the first month was Jashobeam son of Zabdiel[a], and in his division were twenty-four thousand.
translation:
  language: fr
  text: À la tête de la première division, pour le premier mois, se trouvait Yashobéam, fils de Zabdiel. Sa division comptait vingt-quatre mille hommes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל הַמַּחֲלֹקֶת
  choice: À la tête de la division
  rationale: Dans cette liste administrative et militaire, עַל désigne la personne placée à la tête d’une unité; cette tournure exprime naturellement l’autorité en français.
- source_word: הַמַּחֲלֹקֶת
  choice: division
  rationale: Dans les Chroniques, מַחֲלֹקֶת désigne ici une unité organisée assurant un service par rotation; « division » convient au contexte militaire.
- source_word: הָרִאשׁוֹנָה לַחֹדֶשׁ הָרִאשׁוֹן
  choice: la première division, pour le premier mois
  rationale: Les adjectifs indiquent l’ordre dans la série annuelle, et לַ marque l’affectation de cette division au premier mois.
- source_word: יָשָׁבְעָם
  choice: Yashobéam
  rationale: Translittération française claire du nom hébreu, avec une graphie qui en facilite la prononciation.
- source_word: בֶּן זַבְדִּיאֵל
  choice: fils de Zabdiel
  rationale: בֶּן a ici son sens généalogique ordinaire.
- source_word: וְעַל מַחֲלֻקְתּוֹ עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: Sa division comptait vingt-quatre mille hommes
  rationale: L’hébreu est elliptique et donne littéralement « et sur sa division, vingt-quatre mille ». Le verbe « comptait » explicite naturellement l’effectif implicite, et « hommes » correspond au contexte militaire.
