  text: וְ/עַל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לָ/רֽאוּבֵנִ֣י נָגִ֔יד אֱלִיעֶ֖זֶר בֶּן זִכְרִ֑י לַ/שִּׁ֨מְעוֹנִ֔י שְׁפַטְיָ֖הוּ בֶּֽן מַעֲכָֽה־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/016.yaml
  text: 'And over the tribes of Israel: for the Reubenites[a], Eliezer son of Zichri was leader; for the Simeonites, Shephatiah son of Maacah.'
translation:
  language: fr
  text: 'À la tête des tribus d’Israël : pour les Rubénites, Éliézer, fils de Zikri, était chef[a] ; pour les Siméonites, Shephatia, fils de Maaka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dirigeant », « prince » ou « gouverneur » ; hébreu נָגִיד.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: À la tête de
  rationale: Dans cette liste administrative, la préposition עַל exprime l’autorité exercée sur un groupe. « À la tête de » rend naturellement cette idée en français, tandis que la ponctuation maintient le lien avec le contexte précédent.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: des tribus d’Israël
  rationale: Cette formulation rend directement la chaîne construite hébraïque dans un français courant et digne.
- source_word: לָרְאוּבֵנִי
  choice: pour les Rubénites
  rationale: La forme gentilice désigne les membres de la tribu de Ruben, et non le patriarche lui-même. « Pour » convient à l’énumération des responsables affectés aux différentes tribus.
- source_word: נָגִיד
  choice: chef
  rationale: Le terme désigne une personne placée en position d’autorité. « Chef » est clair et concis dans ce contexte administratif, sans imposer les connotations monarchiques possibles de « prince ».
- source_word: אֱלִיעֶזֶר בֶּן זִכְרִי
  choice: Éliézer, fils de Zikri
  rationale: Les noms sont transcrits selon un usage français accessible, et la relation patronymique est explicitement conservée.
- source_word: לַשִּׁמְעוֹנִי
  choice: pour les Siméonites
  rationale: La forme gentilice renvoie au groupe tribal. Le choix maintient le parallélisme avec « pour les Rubénites ».
- source_word: שְׁפַטְיָהוּ בֶּן מַעֲכָה
  choice: Shephatia, fils de Maaka
  rationale: La transcription préserve les noms propres et traduit littéralement la construction patronymique. Le texte ne précise pas davantage l’identité ou le sexe de Maaka.
theological_decisions: []
translation_notes:
  register: Français international moderne, avec une tournure administrative sobre. Les virgules autour de « fils de… » facilitent la lecture des patronymes. La seconde proposition conserve l’ellipse du titre présente dans l’hébreu, sans ajouter artificiellement un second « chef ».
