lexical_decisions:
- source_word: תְּפִלָּה
  choice: Prière
  rationale: Le nom désigne une prière, éventuellement chantée. Dans un titre français, l’absence d’article est naturelle et conserve la concision de l’hébreu.
- source_word: לַחֲבַקּוּק
  choice: du prophète Habacuc
  rationale: Dans une suscription, le préfixe ל marque couramment l’auteur ou l’association. La tournure française « du prophète Habacuc » exprime naturellement cette relation.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Le titre en apposition précise la fonction d’Habacuc et reste explicitement défini, comme dans l’hébreu.
- source_word: עַל
  choice: sur
  rationale: Dans une indication musicale ou liturgique, la préposition peut signaler un air, un style ou un mode d’exécution. « Sur » maintient cette relation sans la préciser abusivement.
- source_word: שִׁגְיֹנוֹת
  choice: les Shigyonoth
  rationale: Ce terme rare, au pluriel, est de sens incertain et paraît être une indication musicale ou liturgique apparentée au singulier de Psaume 7. La translittération évite une précision conjecturale.
