  text: His brightness was like the light; rays were from his hand[a], and there his power was hidden.
translation:
  language: fr
  text: Son éclat était comme la lumière ; des rayons venaient de sa main[a], et là était cachée sa puissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des cornes [venaient] de sa main ». Dans cette image poétique, les « cornes » peuvent désigner des rayons ou des faisceaux de lumière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגַהּ
  choice: éclat
  rationale: Le nom désigne une clarté rayonnante. « Éclat » convient au registre poétique et s’associe naturellement à la comparaison avec la lumière.
- source_word: כָּאוֹר
  choice: comme la lumière
  rationale: Le préfixe כְּ marque explicitement la comparaison, et אוֹר signifie « lumière ».
- source_word: תִּהְיֶה
  choice: était
  rationale: Bien que la forme soit un inaccompli, le contexte de la vision théophanique permet une description au passé, naturelle en français.
- source_word: קַרְנַיִם
  choice: des rayons
  rationale: Le duel signifie littéralement « deux cornes » ou « des cornes », mais évoque ici des projections lumineuses. « Rayons » communique clairement l’image, tandis que le sens littéral est signalé en note.
- source_word: מִיָּדוֹ
  choice: de sa main
  rationale: יָד signifie normalement « main » et מִן indique ici l’origine. L’image corporelle du texte est conservée.
- source_word: לוֹ
  choice: ses / sa
  rationale: Le pronom renvoie au personnage divin. Sa fonction exacte est difficile ; la traduction française l’intègre idiomatiquement dans les possessifs « son », « sa ».
- source_word: וְשָׁם
  choice: et là
  rationale: Cette formulation conserve à la fois la conjonction et l’adverbe, ainsi que la progression poétique du visible vers le caché.
- source_word: חֶבְיוֹן
  choice: se cachait
  rationale: Le nom exprime le fait ou le lieu de se cacher. Une tournure verbale restitue naturellement en français l’expression nominale hébraïque sans trancher davantage.
- source_word: עֻזֹּה
  choice: sa puissance
  rationale: עֹז désigne la force ou la puissance. « Puissance » convient au contexte théophanique et à l’idée d’une force divine dissimulée.
theological_decisions:
- issue: Image anthropomorphique dans la théophanie
  choice: Conserver « sa main » comme origine des rayons.
  alternative: Employer une expression plus abstraite telle que « à ses côtés ».
  rationale: Le texte hébreu emploie une image corporelle. La conserver respecte sa poésie et son ambiguïté sans l’atténuer pour des raisons doctrinales.
- issue: Rapport entre les rayons et la puissance cachée
  choice: 'Maintenir la juxtaposition : les rayons sortent de la main, et « là » se cache la puissance.'
  alternative: Expliquer que la puissance est cachée dans les rayons ou dans la main.
  rationale: Le référent précis de שָׁם, « là », demeure ouvert. La traduction ne précise donc pas ce que l’hébreu laisse implicite.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme poétique est conservé par deux propositions coordonnées. « Jaillissaient » rend idiomatiquement en français la provenance exprimée sans ajouter l’idée plus précise d’un scintillement.
