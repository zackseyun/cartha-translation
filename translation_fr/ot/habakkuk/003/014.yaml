  text: נָקַ֤בְתָּ בְ/מַטָּי/ו֙ רֹ֣אשׁ פרז/ו יִסְעֲר֖וּ לַ/הֲפִיצֵ֑/נִי עֲלִ֣יצֻתָ֔/ם כְּמוֹ לֶ/אֱכֹ֥ל עָנִ֖י בַּ/מִּסְתָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/014.yaml
  text: You pierced the head of his warriors with his own staffs; they stormed out to scatter me[a], their exultation like one about to devour the poor in secret.
translation:
  language: fr
  text: Tu as transpercé la tête de ses guerriers[a] avec ses propres bâtons ; ils se sont rués pour me disperser. Ils exultaient comme s’ils allaient dévorer le pauvre en secret.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tête de ses villages » ou « la tête de ses hordes » ; le terme hébreu est difficile, et beaucoup y voient plus généralement les bandes ou les chefs de l’ennemi.
    reason: alternative_reading
lexical_decisions:
- source_word: נָקַבְתָּ
  choice: tu as transpercé
  rationale: Le qal de נקב exprime couramment l’action de percer ou de traverser. « Transpercé » conserve ici la violence de l’image guerrière.
- source_word: בְמַטָּיו
  choice: avec ses propres bâtons
  rationale: מַטֶּה désigne normalement un bâton ou une verge. Le contexte permet d’y voir des armes, mais « bâtons » garde le sens lexical de base, tandis que « propres » explicite le suffixe masculin singulier et souligne l’ironie de la défaite de l’ennemi par ses propres instruments.
- source_word: רֹאשׁ
  choice: la tête
  rationale: רֹאשׁ peut désigner littéralement la tête ou, au figuré, un chef ou la partie de tête. « La tête » préserve l’image hébraïque sans trancher entre le sens corporel et le sens représentatif.
- source_word: פְּרָזָיו
  choice: ses guerriers
  rationale: La forme est difficile et discutée. Dans cette scène d’assaut, un groupe de combattants convient bien au contexte immédiat ; les autres lectures importantes sont signalées en note.
- source_word: יִסְעֲרוּ
  choice: ils se sont rués
  rationale: Le verbe סער évoque un mouvement impétueux, comparable à une tempête. « Se sont rués » rend ce mouvement violent en français naturel.
- source_word: לַהֲפִיצֵנִי
  choice: pour me disperser
  rationale: Le hiphil de פוץ signifie disperser ou éparpiller. « Me disperser » traduit directement le verbe et son suffixe de première personne.
- source_word: עֲלִיצֻתָם
  choice: leur exultation
  rationale: Le nom désigne une joie débordante ou triomphante. « Exultation » conserve le caractère intense et arrogant de la joie des assaillants.
- source_word: כְּמוֹ לֶאֱכֹל
  choice: celle de gens sur le point de dévorer
  rationale: La tournure comparative présente les assaillants comme animés par l’imminence d’une prédation. Cette formulation rend le mouvement prospectif de l’infinitif tout en restant idiomatique.
- source_word: עָנִי
  choice: le pauvre
  rationale: עָנִי peut désigner une personne pauvre, humble ou affligée. « Le pauvre » convient à l’image d’oppression sociale sans exclure l’affliction.
- source_word: בַּמִּסְתָּר
  choice: en secret
  rationale: Le terme évoque un lieu caché ou une action dissimulée. « En secret » exprime naturellement la prédation clandestine.
theological_decisions:
- issue: Interprétation du nom difficile פְּרָזָיו dans le contexte guerrier
  choice: ses guerriers
  alternative: ses villages / ses hordes
  rationale: L’assaut décrit dans le verset favorise un référent militaire, mais l’hébreu demeure incertain. La traduction principale suit le contexte immédiat, tandis que la note conserve les principales autres possibilités sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international actuel, poétique et digne. La syntaxe reste accessible, tout en conservant les images martiales, la singularité de « la tête » et l’ambiguïté du terme hébreu difficile.
