  text: דָּרַ֥כְתָּ בַ/יָּ֖ם סוּסֶ֑י/ךָ חֹ֖מֶר מַ֥יִם רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/015.yaml
  text: You marched through the sea with your horses[a], through the heap of mighty waters.
translation:
  language: fr
  text: Tu as foulé la mer avec tes chevaux, à travers l’amas des grandes eaux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la masse tumultueuse des grandes eaux ». Le sens du mot hébreu traduit par « amas » est incertain ; il peut désigner une masse d’eaux amoncelée ou agitée.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרַכְתָּ
  choice: tu as marché
  rationale: Le verbe signifie littéralement « fouler » ou « marcher ». « Tu as marché » conserve l’image d’une avancée divine résolue tout en restant naturel en français actuel.
- source_word: בַיָּם
  choice: à travers la mer
  rationale: La préposition signifie ordinairement « dans », mais, avec un verbe de mouvement, elle peut exprimer un parcours à travers un espace. Cette formulation rend clairement la traversée évoquée ici.
- source_word: סוּסֶיךָ
  choice: avec tes chevaux
  rationale: Le texte dit littéralement « tes chevaux ». L’ajout de « avec » explicite en français le rapport syntaxique avec le verbe sans modifier l’image.
- source_word: חֹמֶר
  choice: l’amas
  rationale: Le terme est difficile dans ce contexte. Il peut désigner une masse amoncelée ou tumultueuse. « Amas » reste proche de son sens concret sans préciser indûment si les eaux sont entassées ou agitées.
- source_word: מַיִם רַבִּים
  choice: des eaux immenses
  rationale: L’expression signifie littéralement « de nombreuses eaux » ou « de grandes eaux ». « Eaux immenses » rend de façon poétique leur étendue et leur puissance en français moderne.
theological_decisions:
- issue: L’image de Dieu comme guerrier dans une théophanie poétique
  choice: Conserver l’image concrète de Dieu avançant à travers la mer avec ses chevaux.
  alternative: Interpréter les chevaux comme des nuages ou des êtres célestes, ou remplacer l’image par une affirmation générale de la puissance divine.
  rationale: Le texte présente une scène poétique de victoire divine. La traduction garde ses éléments concrets sans les allégoriser ni réduire leur tension théologique.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « à travers » reproduit le mouvement du vers et relie les deux membres. Le tutoiement correspond à l’adresse directe à Dieu dans le poème.
