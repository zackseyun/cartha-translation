revisions:
- from: Tu as marché à travers la mer avec tes chevaux, à travers l’amas des eaux immenses[a].
  to: Tu as foulé la mer avec tes chevaux, à travers l’amas des grandes eaux[a].
  rationale: La révision rapproche le premier verbe de la force concrète de דרכת, remplace l’explicitation « à travers la mer » par la formulation plus fidèle « fouler la mer », et rend מים רבים par « grandes eaux ». Elle maintient « amas » et une note prudente afin de préserver l’ambiguïté lexicale de חֹמר sans résoudre l’image poétique.
