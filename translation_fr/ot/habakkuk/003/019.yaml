base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/019.yaml
  text: 'The LORD, my Lord, is my strength; he makes my feet like the deer’s, and he causes me to tread on my heights.


    For the choir director: with my stringed instruments.'
translation:
  language: fr
  text: 'Le SEIGNEUR, mon Seigneur, est ma force ; il rend mes pieds pareils à ceux des biches et me fait marcher sur mes hauteurs.


    Au chef de chœur. Avec mes instruments à cordes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָהּ אֲדֹנָי
  choice: Le SEIGNEUR, mon Seigneur
  rationale: Conserve la succession du nom divin et du titre אֲדֹנָי, ainsi que leur distinction, selon l’usage français qui rend le tétragramme par « le SEIGNEUR ».
- source_word: חֵילִי
  choice: est ma force
  rationale: Rend directement le nom חַיִל dans son sens contextuel de force ou puissance.
- source_word: כָּאַיָּלוֹת
  choice: pareils à ceux des biches
  rationale: Le pluriel féminin אַיָּלוֹת désigne des biches ; « ceux » reprend naturellement « pieds » en français.
- source_word: בָּמוֹתַי
  choice: mes hauteurs
  rationale: Préserve le suffixe de première personne et l’image volontairement ouverte des lieux élevés, sans préciser s’il s’agit de sommets, de hauteurs conquises ou d’un terrain sûr.
- source_word: יַדְרִכֵנִי
  choice: me fait marcher
  rationale: Exprime la forme causative du verbe « marcher/fouler » dans un français naturel.
- source_word: לַמְנַצֵּחַ בִּנְגִינוֹתָי
  choice: Au chef de chœur. Avec mes instruments à cordes.
  rationale: Rend la rubrique musicale finale en conservant le possessif inhabituel « mes », attesté par le texte hébreu.
theological_decisions:
- issue: Rapport entre le nom divin et le titre אֲדֹנָי
  choice: Le SEIGNEUR, mon Seigneur
  alternative: Le Seigneur DIEU / Le Souverain SEIGNEUR
  rationale: La formulation retenue maintient les deux désignations distinctes sans fusionner le nom propre et le titre, ni ajouter une interprétation théologique.
- issue: Sens de « mes hauteurs »
  choice: mes hauteurs
  alternative: les hauteurs / mes lieux élevés / les sommets
  rationale: Le possessif est explicite dans l’hébreu. La traduction littérale préserve l’ambiguïté poétique et théologique de l’image.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme poétique est conservé, tandis que la rubrique liturgico-musicale est séparée du corps du verset.
