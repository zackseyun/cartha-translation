source:
  edition: WLC
  text: עֶרְיָ֤ה תֵעוֹר֙ קַשְׁתֶּ֔/ךָ שְׁבֻע֥וֹת מַטּ֖וֹת אֹ֣מֶר סֶ֑לָה נְהָר֖וֹת תְּבַקַּע אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/009.yaml
  text: Your bow is laid bare[a]; the rods are sworn by command. Selah[b]. You split the earth with rivers.
translation:
  language: fr
  text: 'Ton arc est entièrement mis à nu.


    Les verges sont liées par des serments, selon la parole[a].


    Sélah[b].


    Tu fends la terre avec des fleuves.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de cette ligne est difficile et très condensé. Il évoque des « serments », des « verges/bâtons » — terme qui peut aussi signifier « tribus » — et une « parole ». On peut aussi comprendre : « Des serments aux tribus ont été prononcés », ou de manière semblable.'
    reason: alternative_reading
  - marker: b
    text: Terme hébreu dont le sens précis est incertain, probablement une indication musicale ou liturgique.
    reason: textual_or_liturgical_term
lexical_decisions:
- source_word: עֶרְיָה תֵעוֹר
  choice: est entièrement découvert
  rationale: La construction intensive associe l’idée de mise à nu au verbe « découvrir ». En français, « entièrement découvert » exprime naturellement que l’arc est sorti de son étui et prêt à servir.
- source_word: קַשְׁתֶּךָ
  choice: ton arc
  rationale: Traduction directe qui conserve l’image guerrière et l’adresse à Dieu.
- source_word: שְׁבֻעוֹת
  choice: sont jurés
  rationale: Le terme désigne normalement des serments. La formulation verbale respecte l’ellipse poétique sans effacer l’idée de serment.
- source_word: מַטּוֹת
  choice: tes traits
  rationale: Le mot signifie littéralement « bâtons, verges » et peut aussi désigner des « tribus ». « Traits » maintient ici la cohérence de l’imagerie guerrière, mais l’ambiguïté lexicale est signalée en note.
- source_word: אֹמֶר
  choice: par ta parole
  rationale: Le substantif signifie « parole, déclaration ». « Par ta parole » reste proche de l’hébreu et évite de préciser indûment s’il s’agit d’un ordre, d’une promesse ou d’une déclaration.
- source_word: סֶלָה
  choice: Sélah
  rationale: Translittération traditionnelle, puisque la fonction précise du terme demeure incertaine.
- source_word: נְהָרוֹת תְּבַקַּע אָרֶץ
  choice: Tu fends la terre pour en faire jaillir des fleuves
  rationale: Cette formulation comprend « fleuves » comme résultat de l’action de fendre la terre. Elle rend une lecture syntaxique possible et produit une image naturelle en français, tout en signalant en note l’autre relation possible.
theological_decisions:
- issue: Interprétation de שְׁבֻעוֹת מַטּוֹת אֹמֶר
  choice: Tes traits sont jurés par ta parole
  alternative: Des serments aux tribus ont été prononcés
  rationale: La proposition hébraïque est extrêmement condensée. Le texte principal conserve les notions de traits/verges, de serment et de parole sans leur attribuer un contenu théologique plus précis; la note maintient l’autre lecture importante.
- issue: Relation syntaxique de נְהָרוֹת avec תְּבַקַּע אָרֶץ
  choice: les fleuves résultent de la terre fendue
  alternative: Tu fends la terre avec des fleuves
  rationale: L’hébreu poétique permet de comprendre « fleuves » soit comme résultat, soit comme moyen. Le texte principal privilégie une expression française naturelle, tandis que la note préserve l’ambiguïté.
translation_notes:
  register: Français moderne, international et dignifié; parallélisme poétique conservé. Le vocabulaire reste concret et martial, tandis que les notes rendent visibles les principales ambiguïtés de l’hébreu.
