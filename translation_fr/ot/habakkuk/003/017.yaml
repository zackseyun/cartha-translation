revisions:
- from: Même si le figuier ne fleurit pas[a], qu’il n’y a aucun fruit sur les vignes, que la récolte de l’olivier manque, que les champs ne produisent aucune nourriture, que le petit bétail disparaît de l’enclos et qu’il n’y a aucun bovin dans les étables,
  to: Même si le figuier ne fleurit pas[a], s’il n’y a aucun fruit sur les vignes, si la production de l’olivier fait défaut[b], si les champs ne produisent aucune nourriture, si le troupeau est retranché de l’enclos et s’il n’y a aucun bovin dans les étables,
  rationale: La révision conserve la lecture concessive et le rythme de la série qui se poursuit au verset 18. Elle restitue plus exactement la défaillance du produit de l’olivier et le retranchement du troupeau, tout en employant un français international moderne. La note b explicite l’idiome hébreu et rétablit la décision lexicale présente dans la piste d’audit anglaise.
