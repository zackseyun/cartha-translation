source:
  edition: WLC
  text: כִּֽי תְאֵנָ֣ה לֹֽא תִפְרָ֗ח וְ/אֵ֤ין יְבוּל֙ בַּ/גְּפָנִ֔ים כִּחֵשׁ֙ מַעֲשֵׂה זַ֔יִת וּ/שְׁדֵמ֖וֹת לֹא עָ֣שָׂה אֹ֑כֶל גָּזַ֤ר מִ/מִּכְלָה֙ צֹ֔אן וְ/אֵ֥ין בָּקָ֖ר בָּ/רְפָתִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/017.yaml
  text: Though the fig tree does not blossom[a], and there is no produce on the vines; the yield of the olive fails, and the fields produce no food; the flock is cut off from the fold, and there is no herd in the stalls[b],
translation:
  language: fr
  text: Même si le figuier ne fleurit pas[a], s’il n’y a aucun fruit sur les vignes, si la production de l’olivier fait défaut[b], si les champs ne produisent aucune nourriture, si le troupeau est retranché de l’enclos et s’il n’y a aucun bovin dans les étables,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car le figuier ne fleurit pas… » La particule hébraïque initiale peut avoir un sens causal (« car ») ou concessif (« même si »). Le sens concessif s’accorde bien avec la déclaration de joie du verset suivant.'
    reason: alternative_reading
  - marker: b
    text: Littéralement, « le produit de l’olivier déçoit » ; l’expression indique que la production de l’olivier fait défaut.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Même si
  rationale: La particule peut être causale ou concessive. Ici, l’emploi concessif prépare naturellement la déclaration de joie du verset 18, sans exclure l’autre analyse, signalée en note.
- source_word: תְאֵנָה לֹא תִפְרָח
  choice: le figuier ne fleurit pas
  rationale: Le nom désigne le figuier, et le verbe exprime le fait de bourgeonner ou fleurir. La formulation conserve l’image agricole avec un français naturel.
- source_word: וְאֵין יְבוּל בַּגְּפָנִים
  choice: il n’y a aucun fruit sur les vignes
  rationale: יְבוּל désigne ici ce que les vignes produisent. « Fruit » est concret, clair et évite une formulation technique.
- source_word: כִּחֵשׁ מַעֲשֵׂה זַיִת
  choice: la récolte de l’olivier manque
  rationale: L’expression signifie littéralement que le produit de l’olivier « trompe » ou « déçoit ». En contexte agricole, elle indique que la récolte attendue fait défaut.
- source_word: וּשְׁדֵמוֹת לֹא עָשָׂה אֹכֶל
  choice: les champs ne produisent aucune nourriture
  rationale: Le pluriel שְׁדֵמוֹת renvoie aux terres cultivées; « produire de la nourriture » rend naturellement l’expression littérale « faire de la nourriture ».
- source_word: גָּזַר מִמִּכְלָה צֹאן
  choice: le petit bétail disparaît de l’enclos
  rationale: צֹאן est un collectif pouvant comprendre moutons et chèvres. « Petit bétail » en préserve l’étendue; « disparaît » exprime idiomatiquement le fait d’être retranché ou absent de l’enclos.
- source_word: וְאֵין בָּקָר בָּרְפָתִים
  choice: il n’y a aucun bovin dans les étables
  rationale: בָּקָר désigne collectivement les bovins, tandis que רְפָתִים désigne leurs stalles ou étables. Le choix reste précis sans supposer uniquement des bœufs de trait.
theological_decisions:
- issue: Valeur de la particule initiale כִּי
  choice: 'Lecture concessive : « Même si »'
  alternative: 'Lecture causale : « Car »'
  rationale: Le lien avec le verset 18 favorise une série de circonstances contraires malgré lesquelles le prophète se réjouit. La valeur causale reste grammaticalement possible et est donc conservée en note.
translation_notes:
  register: Français international moderne, poétique mais accessible. La longue série de propositions parallèles et la virgule finale maintiennent l’élan syntaxique vers le verset 18. « Petit bétail » et « bovin » préservent la portée des collectifs hébreux.
