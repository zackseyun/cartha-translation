  text: יָצָ֨אתָ֙ לְ/יֵ֣שַׁע עַמֶּ֔/ךָ לְ/יֵ֖שַׁע אֶת מְשִׁיחֶ֑/ךָ מָחַ֤צְתָּ רֹּאשׁ֙ מִ/בֵּ֣ית רָשָׁ֔ע עָר֛וֹת יְס֥וֹד עַד צַוָּ֖אר סֶֽלָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/013.yaml
  text: You went out for the salvation of your people[a], for the salvation of your anointed one; you crushed the head of the house of the wicked, laying bare the foundation up to the neck[c][b]. Selah
translation:
  language: fr
  text: Tu es sorti pour le salut de ton peuple, pour le salut de ton oint[a] ; tu as écrasé la tête de la maison du méchant, mettant à nu les fondations jusqu’au cou[b]. Sélah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu signifie « ton oint ». Il peut s’agir du roi davidique, du peuple représenté collectivement ou, dans une lecture typologique, du Messie ; l’hébreu ne tranche pas ici entre ces possibilités.
    reason: alternative_reading
  - marker: b
    text: 'L’image hébraïque est difficile : elle semble associer la démolition d’une maison à la mise à nu d’un corps. Autre traduction possible : « découvrant les fondations jusqu’au cou ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָאתָ
  choice: Tu es sorti
  rationale: Le qal accompli, 2e personne masculine singulière, décrit la sortie décisive de Dieu pour intervenir. Cette traduction directe évite d’ajouter explicitement l’idée d’une marche militaire.
- source_word: לְיֵשַׁע
  choice: pour le salut
  rationale: Le nom יֵשַׁע désigne le salut ou la délivrance. La répétition de la formule est conservée afin de respecter le parallélisme hébreu.
- source_word: עַמֶּךָ
  choice: ton peuple
  rationale: Traduction directe du nom muni du suffixe de la 2e personne ; elle préserve sa portée collective et relationnelle.
- source_word: לְיֵשַׁע אֶת מְשִׁיחֶךָ
  choice: pour le salut de celui que tu as consacré par l’onction
  rationale: La seconde occurrence de « pour le salut » est maintenue. La périphrase française exprime le sens descriptif de מָשִׁיחַ sans imposer ici le titre déterminé « Messie ».
- source_word: מָחַצְתָּ רֹאשׁ
  choice: tu as écrasé la tête
  rationale: מחץ évoque un coup qui écrase ou fracasse. « La tête » conserve l’image concrète, qui peut être personnelle ou architecturale.
- source_word: מִבֵּית רָשָׁע
  choice: de la maison du méchant
  rationale: 'Cette construction suit l’enchaînement hébreu et laisse ouverte l’identité de la « tête » : chef d’une maison ou sommet d’un édifice. Le singulier רָשָׁע est conservé sans identifier davantage son référent.'
- source_word: עָרוֹת יְסוֹד
  choice: mettant à nu les fondations
  rationale: ערה signifie découvrir ou mettre à nu. Le pluriel français « les fondations » est l’expression idiomatique courante pour la base d’un bâtiment, là où l’hébreu emploie un collectif singulier.
- source_word: עַד צַוָּאר
  choice: jusqu’au cou
  rationale: La traduction littérale maintient l’image abrupte et difficile du texte, sans tenter d’en harmoniser les éléments corporels et architecturaux.
- source_word: סֶלָה
  choice: Sélah
  rationale: La translittération traditionnelle est conservée, puisque la fonction exacte du terme demeure incertaine.
theological_decisions:
- issue: Référent de מְשִׁיחֶךָ
  choice: celui que tu as consacré par l’onction
  alternative: ton oint ; ton Messie ; le roi davidique ; le peuple représenté collectivement
  rationale: Le mot porte une résonance royale et peut recevoir une lecture messianique, mais le contexte immédiat n’impose pas un référent unique. La formulation descriptive préserve cette ouverture sans transformer le terme en titre propre.
- issue: Identité du « méchant » et sens de la « tête »
  choice: la tête de la maison du méchant
  alternative: le chef de la maison du méchant ; le sommet de la maison du méchant ; la tête du méchant dans sa maison
  rationale: La syntaxe et l’imagerie permettent plusieurs associations. La traduction conserve la tension entre la défaite d’un ennemi et la démolition figurée de sa maison.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement s’adresse à Dieu conformément à l’usage biblique français courant. La répétition « pour le salut » et les images inhabituelles du texte hébreu sont volontairement conservées.
