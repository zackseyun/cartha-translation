id: HAB.3.2
reference: Habakkuk 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֗ה שָׁמַ֣עְתִּי שִׁמְעֲ/ךָ֮ יָרֵאתִי֒ יְהוָ֗ה פָּֽעָלְ/ךָ֙ בְּ/קֶ֤רֶב שָׁנִים֙ חַיֵּ֔י/הוּ בְּ/קֶ֥רֶב שָׁנִ֖ים תּוֹדִ֑יעַ בְּ/רֹ֖גֶז רַחֵ֥ם תִּזְכּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/002.yaml
  text: Yahweh[a], I have heard the report of you; I stand in awe. Yahweh, revive your work in the midst of the years; in the midst of the years make it known[e][d][c][b]; in wrath remember mercy.
translation:
  language: fr
  text: Yahvé, j’ai entendu ce qu’on rapporte à ton sujet[a] ; je suis saisi de crainte[b]. Yahvé, au milieu des années, fais revivre ton œuvre[c] ; au milieu des années, fais-la connaître. Dans la colère[d], souviens-toi d’avoir compassion[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta renommée » ou « ce qu’on entend dire de toi ». L’expression hébraïque désigne ce qui a été entendu au sujet de Yahvé.
    reason: lexical_alternative
  - marker: b
    text: Ou « j’ai eu peur ». Le verbe hébreu peut exprimer la peur comme la crainte révérencielle.
    reason: lexical_alternative
  - marker: c
    text: 'Ou « garde-la en vie » ou « renouvelle-la ». Littéralement : « fais-la vivre ».'
    reason: lexical_alternative
  - marker: d
    text: Ou « dans l’agitation », « dans le bouleversement » ou « dans la fureur ».
    reason: lexical_alternative
  - marker: e
    text: 'Littéralement : « souviens-toi d’avoir compassion » ; autre traduction possible : « souviens-toi de la compassion ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle rend explicitement le nom divin plutôt que de le remplacer par un titre.
- source_word: שָׁמַעְתִּי שִׁמְעֲךָ
  choice: j’ai entendu ce qu’on rapporte à ton sujet
  rationale: Cette formulation naturelle conserve l’idée d’un message ou d’une renommée entendue au sujet de Yahvé, sans réduire le nom שֵׁמַע à la seule réputation.
- source_word: יָרֵאתִי
  choice: je suis saisi de crainte
  rationale: Le verbe exprime la peur aussi bien que la crainte révérencielle. Cette traduction conserve cette tension mieux que « je suis émerveillé ».
- source_word: פָּעָלְךָ
  choice: ton œuvre
  rationale: Le terme peut désigner une œuvre, une action ou un acte. « Ton œuvre » reste assez large pour évoquer les interventions de Dieu dans l’histoire.
- source_word: בְּקֶרֶב שָׁנִים
  choice: au milieu des années
  rationale: La traduction garde l’expression poétique et énigmatique de l’hébreu ainsi que sa répétition, sans l’interpréter comme « de notre vivant ».
- source_word: חַיֵּהוּ
  choice: fais revivre
  rationale: L’impératif piel de חיה, avec un suffixe masculin singulier renvoyant vraisemblablement à « ton œuvre », signifie littéralement « fais-la vivre » et peut exprimer son renouvellement.
- source_word: תּוֹדִיעַ
  choice: fais-la connaître
  rationale: Le hiphil de ידע signifie directement « faire connaître ». Le pronom féminin reprend naturellement « œuvre » en français.
- source_word: בְּרֹגֶז
  choice: dans la colère
  rationale: רֹגֶז peut désigner la colère, l’agitation ou le bouleversement. La demande de compassion favorise ici « colère », sans effacer les autres possibilités.
- source_word: רַחֵם תִּזְכּוֹר
  choice: souviens-toi d’avoir compassion
  rationale: Cette tournure conserve la valeur verbale de רַחֵם (« avoir compassion ») tout en restant idiomatique en français.
theological_decisions:
- issue: Nature de la réaction du prophète à ce qu’il a entendu au sujet de Yahvé
  choice: une crainte pouvant inclure à la fois peur et révérence
  alternative: une pure admiration révérencielle, ou une terreur sans dimension cultuelle
  rationale: Le contexte de prière comporte à la fois révérence, appréhension devant l’action divine et appel à la compassion. « Saisi de crainte » préserve cette tension.
- issue: Objet de la demande « fais revivre »
  choice: l’œuvre de Dieu
  alternative: préserver cette œuvre en vie, ou renouveler une œuvre particulière du prophète
  rationale: Le suffixe de חַיֵּהוּ renvoie le plus naturellement à פָּעָלְךָ, « ton œuvre ». La traduction ne précise pas quels actes divins sont visés.
- issue: Sujet implicite de la colère
  choice: la colère associée à l’intervention divine, sans ajout explicite de « ta »
  alternative: « dans ta colère », qui identifie explicitement la colère comme celle de Dieu
  rationale: L’hébreu dit simplement « dans la colère ». Ne pas ajouter le possessif conserve la formulation et sa légère ambiguïté.
translation_notes:
  register: Français international actuel, digne et accessible. La structure poétique, l’adresse répétée à Yahvé et la répétition de « au milieu des années » sont conservées. Le texte évite de transformer la crainte en simple admiration et maintient l’ambiguïté de « dans la colère ».
