id: HAB.3.16
reference: Habakkuk 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָׁמַ֣עְתִּי וַ/תִּרְגַּ֣ז בִּטְנִ֗/י לְ/קוֹל֙ צָלֲל֣וּ שְׂפָתַ֔/י יָב֥וֹא רָקָ֛ב בַּ/עֲצָמַ֖/י וְ/תַחְתַּ֣/י אֶרְגָּ֑ז אֲשֶׁ֤ר אָנ֨וּחַ֙ לְ/י֣וֹם צָרָ֔ה לַ/עֲל֖וֹת לְ/עַ֥ם יְגוּדֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/016.yaml
  text: I heard[a], and my inward parts trembled; at the sound my lips quivered. Rot enters into my bones, and beneath me I tremble, as I wait quietly for the day of distress[b], for the coming up of the people who will invade us.
translation:
  language: fr
  text: 'J’ai entendu, et mes entrailles ont tremblé ;

    au bruit, mes lèvres ont frémi.


    La pourriture pénètre mes os,

    et je tremble là où je me tiens.


    J’attends en silence[a] le jour de la détresse,

    qui vient contre le peuple qui nous envahit[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin que je trouve du repos au jour de la détresse ». Le verbe hébreu peut signifier « se reposer », « s’établir » ou « rester tranquille ».'
    reason: alternative_reading
  - marker: b
    text: 'La fin du verset est difficile. On peut aussi comprendre : « dans l’attente du peuple qui monte pour attaquer » ; le rattachement de « qui monte » et le référent du pronom final sont discutés.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: J’ai entendu
  rationale: Le parfait à la première personne introduit la réaction du prophète à ce qu’il vient d’entendre. Le passé composé est naturel en français moderne tout en gardant le lien avec son état présent.
- source_word: וַתִּרְגַּז בִּטְנִי
  choice: mes entrailles ont tremblé
  rationale: בטן désigne littéralement le ventre, mais évoque ici le siège viscéral des émotions. « Mes entrailles » conserve cette image corporelle forte dans un registre digne.
- source_word: לְקוֹל
  choice: au bruit
  rationale: קול peut signifier « voix », « bruit » ou « son ». « Au bruit » reste assez large et convient à la réaction auditive décrite.
- source_word: צָלֲלוּ שְׂפָתַי
  choice: mes lèvres ont frémi
  rationale: Le verbe décrit ici un mouvement involontaire des lèvres sous l’effet de la peur. « Frémir » rend ce tremblement avec naturel en français.
- source_word: יָבוֹא רָקָב בַּעֲצָמַי
  choice: La pourriture pénètre mes os
  rationale: רקב exprime la pourriture ou la décomposition. La traduction maintient la métaphore saisissante d’un effondrement physique intérieur.
- source_word: וְתַחְתַּי אֶרְגָּז
  choice: et je tremble là où je me tiens
  rationale: תַחְתַּי signifie littéralement « sous moi » et peut évoquer l’instabilité de l’endroit où se tient le prophète. La formulation française exprime cette défaillance sans ajouter explicitement des jambes absentes de l’hébreu.
- source_word: אֲשֶׁר אָנֻוּחַ
  choice: Pourtant, j’attends dans le calme
  rationale: נוח peut signifier se reposer, s’établir ou demeurer tranquille. Dans ce contexte d’effroi et d’attente, « attendre dans le calme » préserve la tension entre la peur présente et l’attente confiante.
- source_word: לְיוֹם צָרָה
  choice: le jour de la détresse
  rationale: צרה désigne une situation de détresse, de malheur ou d’adversité. « Détresse » conserve la gravité du terme sans préciser indûment la forme de l’épreuve.
- source_word: לַעֲלוֹת לְעַם
  choice: quand elle s’abattra sur le peuple
  rationale: עלה signifie fondamentalement monter, mais avec la préposition ל il peut décrire le fait de marcher ou de venir contre quelqu’un. Ici, la formulation fait du jour ou de la détresse ce qui vient contre le peuple, lecture syntaxique largement reconnue et cohérente avec l’ordre des mots.
- source_word: יְגוּדֶנּוּ
  choice: qui nous attaque
  rationale: 'La racine גדד renvoie à l’attaque en bande ou au raid. « Attaque » est clair en français courant, tandis que le suffixe est rendu à la première personne du pluriel : « nous ».'
theological_decisions:
- issue: Sens de אֲשֶׁר אָנֻוּחַ dans le contexte
  choice: Le prophète attend dans le calme le jour annoncé, malgré son effroi physique.
  alternative: « afin que je trouve du repos au jour de la détresse » ou « je me reposerai au jour de la détresse »
  rationale: Le verbe נוח permet les deux nuances. Le contexte immédiat associe terreur et attente fidèle ; la traduction choisie conserve cette tension sans transformer le verset en promesse explicite de soulagement.
- issue: Référent de לַעֲלוֹת לְעַם
  choice: La détresse s’abattra sur le peuple qui attaque le prophète et les siens.
  alternative: Le peuple envahisseur monte contre « nous ».
  rationale: La syntaxe hébraïque permet une hésitation sur le sujet implicite de l’infinitif. La proximité de « jour de détresse » et la construction עלה ל־ soutiennent la lecture d’une détresse venant sur le peuple agresseur, mais l’autre compréhension est signalée en note afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme en lignes brèves conserve l’accumulation des réactions corporelles. Les images concrètes des entrailles, des lèvres, des os et du tremblement sont maintenues sans archaïsmes. « Pourtant » explicite légèrement le contraste contextuel entre l’effroi et l’attente calme.
