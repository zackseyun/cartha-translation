  text: עָמַ֣ד וַ/יְמֹ֣דֶד אֶ֗רֶץ רָאָה֙ וַ/יַּתֵּ֣ר גּוֹיִ֔ם וַ/יִּתְפֹּֽצְצוּ֙ הַרְרֵי עַ֔ד שַׁח֖וּ גִּבְע֣וֹת עוֹלָ֑ם הֲלִיכ֥וֹת עוֹלָ֖ם לֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/006.yaml
  text: He stood and measured the earth[a]; he looked and made nations tremble. The ancient mountains were shattered; the everlasting hills sank low[b]. His ways are everlasting.
translation:
  language: fr
  text: 'Il se tient debout et mesure la terre ;

    il regarde et fait trembler les nations[a].


    Les montagnes antiques volent en éclats,

    les collines éternelles s’affaissent.


    Ses démarches sont éternelles[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mit les nations en émoi », voire « dispersa les nations ». Le verbe hébreu est difficile et sa nuance exacte fait débat.
    reason: lexical_alternative
  - marker: b
    text: Ou « Ses voies sont de toujours » ou « Ses chemins sont éternels ». Le terme peut désigner ses démarches, ses marches, ses déplacements ou ses voies.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמַד
  choice: Il se tint debout
  rationale: Rend le sens fondamental de « se tenir debout » sans ajouter une interprétation militaire ou cosmologique.
- source_word: וַיְמֹדֶד אֶרֶץ
  choice: et mesura la terre
  rationale: Suit le sens le plus direct de מדד, « mesurer » ; les traductions telles que « ébranler » relèvent d’une interprétation contextuelle moins directement appuyée par le texte consonantique.
- source_word: רָאָה
  choice: il regarda
  rationale: « Regarder » convient à la succession vive des actions divines dans cette poésie théophanique.
- source_word: וַיַּתֵּר גּוֹיִם
  choice: et fit trembler les nations
  rationale: Le verbe est difficile. Dans ce contexte, il exprime vraisemblablement l’agitation ou l’effroi provoqué parmi les nations ; les autres possibilités sont conservées en note.
- source_word: וַיִּתְפֹּצְצוּ
  choice: volèrent en éclats
  rationale: Expression française naturelle et énergique qui rend la désagrégation violente exprimée par la forme verbale.
- source_word: הַרְרֵי עַד
  choice: les montagnes immémoriales
  rationale: « Immémoriales » exprime l’antiquité et la permanence attribuées aux montagnes, tout en restant naturel dans un registre poétique.
- source_word: שַׁחוּ
  choice: s’affaissèrent
  rationale: Préserve l’image physique de collines qui s’abaissent, tout en laissant percevoir leur soumission devant Dieu.
- source_word: גִּבְעוֹת עוֹלָם
  choice: les collines éternelles
  rationale: Rend l’idée de permanence séculaire ou perpétuelle et maintient le parallélisme avec les montagnes immémoriales.
- source_word: הֲלִיכוֹת עוֹלָם לוֹ
  choice: Ses voies sont de toujours
  rationale: Formulation française digne et concise qui garde à la fois l’idée de manière d’agir et celle de parcours ou de mouvements durables. La nuance plus concrète de « marches » est signalée en note.
theological_decisions:
- issue: Langage anthropomorphique et théophanie cosmique
  choice: Conserver la description poétique de Dieu qui se tient debout, regarde et agit sur les nations comme sur la création.
  alternative: Réduire toutes les actions à une métaphore politique, ou les transformer en description cosmologique strictement littérale.
  rationale: Habacuc 3 emploie une poésie théophanique élevée. La traduction maintient la grandeur et la tension du tableau sans imposer un système interprétatif plus étroit.
- issue: Portée de הֲלִיכוֹת עוֹלָם לוֹ
  choice: Ses voies sont de toujours
  alternative: Ses marches sont éternelles
  rationale: Le substantif peut évoquer les déplacements, la marche ou les voies de Dieu. Le texte principal préserve une portée large, tandis que la note garde la lecture plus concrète liée au mouvement théophanique.
translation_notes:
  register: Français international moderne, digne et poétique. Les images cosmiques restent vigoureuses, avec des verbes concrets et un rythme en lignes parallèles. Les ambiguïtés lexicales significatives sont conservées dans les notes plutôt que résolues silencieusement.
