  text: שֶׁ֥מֶשׁ יָרֵ֖חַ עָ֣מַד זְבֻ֑לָ/ה לְ/א֤וֹר חִצֶּ֨י/ךָ֙ יְהַלֵּ֔כוּ לְ/נֹ֖גַהּ בְּרַ֥ק חֲנִיתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/011.yaml
  text: Sun and moon stood in their lofty place[a]; at the light of your arrows they went[c][b], at the brightness of the flash of your spear.
translation:
  language: fr
  text: Le soleil et la lune se tiennent immobiles dans leur demeure élevée[a] ; à la lumière de tes flèches, ils avancent[b], à la clarté de l’éclair de ta lance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans leur séjour élevé ». Le mot hébreu désigne une demeure haute ou un lieu élevé.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est très condensé : « ils avancent » peut renvoyer au soleil et à la lune, ou, plus vraisemblablement, aux flèches divines.'
    reason: alternative_reading
  - marker: c
    text: Ou « à l’éclat de ta lance » ou « à la foudre de ta lance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶשׁ יָרֵחַ
  choice: le soleil et la lune
  rationale: Les deux astres sont nommés distinctement. Les articles sont naturels en français moderne et ne diminuent pas la force poétique.
- source_word: עָמַד
  choice: se sont arrêtés
  rationale: Le qal de עמד peut signifier « se tenir » ou « s’arrêter ». Dans cette théophanie, « se sont arrêtés » exprime clairement l’immobilisation des astres sans en préciser le mécanisme.
- source_word: זְבֻלָה
  choice: dans leur haute demeure
  rationale: זְבוּל désigne une demeure élevée ou un séjour sublime. Le possessif pluriel s’accorde naturellement avec le couple « le soleil et la lune », sans imposer une cosmologie technique.
- source_word: לְאוֹר חִצֶּיךָ
  choice: à la lumière de tes flèches
  rationale: La formulation conserve l’image martiale et la valeur circonstancielle de לְ, tout en restant poétique et intelligible.
- source_word: יְהַלֵּכוּ
  choice: ils avancent
  rationale: Le piel de הלך exprime ici le mouvement. « Avancent » garde cette dynamique sans préciser davantage sa nature ; l’identité du sujet demeure signalée comme ambiguë en note.
- source_word: לְנֹגַהּ
  choice: à la clarté de
  rationale: נֹגַהּ évoque une vive lumière ou un rayonnement. « À la clarté de » maintient le parallélisme avec « à la lumière de ».
- source_word: בְּרַק חֲנִיתֶךָ
  choice: l’éclair de ta lance
  rationale: בָּרָק peut désigner l’éclair ou l’éclat fulgurant. « L’éclair de ta lance » préserve à la fois la vigueur visuelle et la métaphore guerrière ; חֲנִית est rendu par le terme courant « lance ».
theological_decisions:
- issue: Référent du verbe יְהַלֵּכוּ (« ils avancent »)
  choice: Conserver le pronom pluriel sans remplacer explicitement son référent par « les flèches » ou « les astres »
  alternative: Traduire explicitement « tes flèches avancent » ou comprendre que le soleil et la lune se déplacent
  rationale: La syntaxe poétique hébraïque est condensée. Le sujet grammatical le plus immédiatement accessible est « le soleil et la lune », mais le mouvement peut aussi évoquer les projectiles divins. Une note expose cette tension au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, poétique et digne. Le passé composé rend l’arrêt initial avec naturel, tandis que le présent « avancent » conserve le changement d’aspect du texte hébreu et donne de la vivacité à la scène. Les images célestes et guerrières restent concrètes, et l’ambiguïté du second membre est explicitement préservée.
