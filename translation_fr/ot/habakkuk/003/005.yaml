source:
  edition: WLC
  text: לְ/פָנָ֖י/ו יֵ֣לֶךְ דָּ֑בֶר וְ/יֵצֵ֥א רֶ֖שֶׁף לְ/רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/005.yaml
  text: Before him goes pestilence[b][a], and plague comes out at his feet.
translation:
  language: fr
  text: 'Devant lui marche la peste,

    et la fièvre[a] sort à ses pieds[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le fléau brûlant », « la peste »; peut-être aussi « Resheph », nom d’une divinité associée aux fléaux, auquel l’image poétique pourrait faire allusion.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à ses pieds »; l’expression peut aussi évoquer ce qui vient derrière lui ou à sa suite.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: Devant lui
  rationale: L’expression désigne ce qui se trouve en avant de quelqu’un et conserve ici l’image de forces précédant le guerrier divin.
- source_word: יֵלֶךְ
  choice: marche
  rationale: Le verbe décrit vivement le mouvement de la peste personnifiée; « marche » convient au contexte poétique d’une avancée divine.
- source_word: דָּבֶר
  choice: la peste
  rationale: Le nom désigne couramment une épidémie meurtrière ou une pestilence, notamment dans des contextes de jugement.
- source_word: וְיֵצֵא
  choice: et … sort
  rationale: Cette traduction directe préserve l’idée d’une force qui sort ou se met en mouvement depuis la proximité des pieds du personnage divin.
- source_word: רֶשֶׁף
  choice: la fièvre
  rationale: Le terme peut évoquer une chaleur brûlante, une fièvre ou un fléau. « Fièvre » maintient le parallélisme avec « peste » sans confondre entièrement les deux termes; les autres possibilités sont signalées en note.
- source_word: לְרַגְלָיו
  choice: à ses pieds
  rationale: La formulation conserve l’image concrète de l’hébreu; dans cette scène de marche, elle peut aussi suggérer ce qui suit le personnage ou accompagne ses pas.
theological_decisions:
- issue: Possible arrière-plan mythologique de רֶשֶׁף
  choice: Traduire le mot comme un nom commun, « la fièvre », dans le texte principal.
  alternative: Le traiter comme le nom propre « Resheph ».
  rationale: Le contexte poétique peut faire écho à des images du Proche-Orient ancien, mais le parallélisme avec דָּבֶר favorise ici une force destructrice personnifiée. La note préserve l’identification possible sans l’imposer.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme et la personnification des forces destructrices sont conservés, ainsi que l’image concrète du déplacement.
