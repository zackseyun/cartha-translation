source:
  edition: WLC
  text: רָא֤וּ/ךָ יָחִ֨ילוּ֙ הָרִ֔ים זֶ֥רֶם מַ֖יִם עָבָ֑ר נָתַ֤ן תְּהוֹם֙ קוֹל֔/וֹ ר֖וֹם יָדֵ֥י/הוּ נָשָֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/010.yaml
  text: The mountains saw you and writhed[a]; a torrent of waters swept by. The deep gave its voice[c][b]; it lifted its hands on high.
translation:
  language: fr
  text: Les montagnes t’ont vu et se sont tordues[a] ; un torrent d’eaux a déferlé[b]. L’abîme a fait entendre sa voix ; il a levé ses mains bien haut[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont tremblé », « ont été saisies de douleur » ou « ont frémi ». Le verbe hébreu peut évoquer un tremblement ou des convulsions semblables à celles de l’enfantement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « est passé ». Le verbe hébreu est le terme courant pour passer ou traverser ; « a déferlé » fait ressortir la violence du torrent.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « il a levé ses mains bien haut ». Certains comprennent les « mains » comme une image des vagues qui se soulèvent.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: t’ont vu
  rationale: Le qal accompli de ראה avec suffixe de deuxième personne du masculin singulier signifie directement « t’ont vu ». Le passé composé s’intègre naturellement au récit poétique de la manifestation divine.
- source_word: יָחִילוּ
  choice: se sont tordues
  rationale: Le verbe חול/חיל peut évoquer le tremblement, les convulsions ou les douleurs de l’enfantement. « Se sont tordues » conserve ici la personnification vigoureuse des montagnes et l’idée d’un mouvement convulsif.
- source_word: הָרִים
  choice: les montagnes
  rationale: Traduction directe du nom pluriel déterminé.
- source_word: זֶרֶם מַיִם
  choice: un torrent d’eaux
  rationale: זֶרֶם désigne un flot violent, une crue ou un torrent. Cette formulation garde l’image hébraïque des eaux impétueuses.
- source_word: עָבָר
  choice: a déferlé
  rationale: עבר signifie fondamentalement « passer ». Avec « un torrent d’eaux » pour sujet, « a déferlé » exprime naturellement en français le passage puissant du flot, tandis que la note conserve le sens plus littéral.
- source_word: נָתַן תְּהוֹם קוֹלוֹ
  choice: L’abîme a fait entendre sa voix
  rationale: Littéralement, « l’abîme a donné sa voix ». La tournure française choisie reste proche de l’image tout en étant naturelle et préserve la personnification.
- source_word: תְּהוֹם
  choice: l’abîme
  rationale: Dans la poésie hébraïque, תְּהוֹם désigne les eaux profondes ou la masse des eaux cosmiques. « L’abîme » est concis et convient à cette image sans lui imposer le sens d’un lieu de châtiment.
- source_word: רוֹם
  choice: vers les hauteurs
  rationale: רוֹם exprime ici la hauteur et fonctionne adverbialement avec le geste de lever les mains. « Vers les hauteurs » conserve le relief poétique.
- source_word: יָדֵיהוּ נָשָׂא
  choice: il a levé ses mains
  rationale: La traduction garde l’anthropomorphisme explicite de l’hébreu au lieu de remplacer interprétativement les « mains » par des vagues.
theological_decisions:
- issue: Personnification du monde créé dans une théophanie
  choice: Conserver les montagnes qui se tordent et l’abîme qui parle et lève les mains.
  alternative: 'Transformer les images en description météorologique : les montagnes tremblent et les vagues se soulèvent.'
  rationale: Le passage relève de la poésie théophanique. La personnification exprime la réaction de la création à la présence de Dieu ; la conserver respecte la tension et la force imagée du texte hébreu.
translation_notes:
  register: Français international moderne, poétique et digne. Les temps du passé suivent la perspective narrative de la strophe, tandis que les images corporelles appliquées à la création sont conservées. Les notes signalent les principaux sens lexicaux possibles et l’interprétation métaphorique des « mains ».
