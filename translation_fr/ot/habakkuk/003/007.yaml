  yaml_path: translation/ot/habakkuk/003/007.yaml
  text: I saw the tents of Cushan under affliction; the tent curtains of the land of Midian were trembling.
translation:
  language: fr
  text: J’ai vu les tentes de Koushân dans la détresse ; les tentures du pays de Madian tremblaient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת אָוֶן
  choice: sous la détresse
  rationale: תַּחַת signifie ici « sous », tandis que אָוֶן peut désigner le malheur, la peine ou la détresse. « Sous la détresse » conserve la construction inhabituelle et son ambiguïté sans préciser indûment la cause.
- source_word: אָהֳלֵי כוּשָׁן
  choice: les tentes de Koushân
  rationale: Traduction directe de אָהֳלֵי et translittération du nom propre כוּשָׁן, distinct de כּוּשׁ.
- source_word: יְרִיעוֹת
  choice: les tentures
  rationale: Le terme désigne des étoffes ou pans servant à former ou couvrir une tente ; « tentures » convient au cadre nomade et reste naturel en français.
- source_word: יִרְגְּזוּן
  choice: tremblaient
  rationale: Le verbe רגז exprime le tremblement ou l’agitation. L’imparfait s’accorde avec la vision décrite par « j’ai vu » et présente la scène en cours.
theological_decisions:
- issue: Rapport entre « sous la détresse » et les tentes de Koushân
  choice: Maintenir l’expression « les tentes de Koushân sous la détresse »
  alternative: « Dans la détresse, j’ai vu les tentes de Koushân »
  rationale: L’ordre et la syntaxe hébraïques permettent plusieurs rattachements. La formulation retenue suit le texte massorétique et l’audit anglais sans transformer la détresse en simple circonstance du regard du prophète.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme entre Koushân et Madian est conservé, ainsi que le passage de la vision au tremblement des tentures.
