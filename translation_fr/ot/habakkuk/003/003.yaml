source:
  edition: WLC
  text: אֱל֨וֹהַ֙ מִ/תֵּימָ֣ן יָב֔וֹא וְ/קָד֥וֹשׁ מֵֽ/הַר פָּארָ֖ן סֶ֑לָה כִּסָּ֤ה שָׁמַ֨יִם֙ הוֹד֔/וֹ וּ/תְהִלָּת֖/וֹ מָלְאָ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/003.yaml
  text: God comes from Teman[a], and the Holy One from Mount Paran. Selah. His splendor covers the heavens[d][c][b], and his praise fills the earth.
translation:
  language: fr
  text: 'Dieu vient de Témân[a],

    et le Saint, du mont Parân.

    Sélah[b].


    Sa splendeur couvre les cieux[c],

    et sa louange remplit la terre[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Témân peut aussi être compris plus généralement comme « le sud » ; ici, il s’agit probablement du nom de lieu, en parallèle avec le mont Parân.
    reason: lexical_alternative
  - marker: b
    text: Sélah est un terme liturgique ou musical au sens incertain, traditionnellement laissé sans traduction.
    reason: cultural_note
  - marker: c
    text: 'Ou : « sa majesté couvre les cieux » ou « sa gloire couvre les cieux ».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « sa louange a rempli la terre ». Dans ce contexte poétique, la forme verbale hébraïque peut aussi être rendue au passé ou au futur.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלוֹהַ
  choice: Dieu
  rationale: Le nom singulier désigne simplement Dieu; « Dieu » est l’équivalent français naturel, sans ajout de nuance.
- source_word: מִתֵּימָן
  choice: de Témân
  rationale: Témân peut aussi désigner le sud, mais le parallélisme avec le mont Parân favorise ici le nom de lieu.
- source_word: יָבוֹא
  choice: vient
  rationale: Dans cette théophanie poétique, l’imparfait hébreu peut être rendu par un présent de vision qui conserve l’immédiateté liturgique sans imposer exclusivement le passé ou l’avenir.
- source_word: וְקָדוֹשׁ
  choice: et le Saint
  rationale: L’adjectif substantivé est un titre divin, parallèle à « Dieu ».
- source_word: מֵהַר פָּארָן
  choice: du mont Parân
  rationale: Cette formulation géographique est directe et naturelle en français.
- source_word: סֶלָה
  choice: Séla
  rationale: Le sens exact de ce terme liturgique ou musical reste incertain; sa transcription évite une interprétation excessive.
- source_word: כִּסָּה
  choice: couvre
  rationale: Le présent prolonge le présent de vision de la scène poétique.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: « Les cieux » restitue le pluriel hébreu et convient au registre poétique élevé.
- source_word: הוֹדוֹ
  choice: sa splendeur
  rationale: הוֹד peut exprimer la splendeur, la majesté ou la gloire; « splendeur » s’accorde particulièrement avec l’image visuelle qui emplit les cieux.
- source_word: וּתְהִלָּתוֹ
  choice: et sa louange
  rationale: « Sa louange » conserve l’ambiguïté entre la louange adressée à Dieu, celle qui lui est due et son renom digne de louange.
- source_word: מָלְאָה הָאָרֶץ
  choice: remplit la terre
  rationale: La portée cosmique, en parallèle avec « les cieux », favorise « la terre » plutôt que « le pays »; le présent maintient l’unité temporelle de la vision.
theological_decisions:
- issue: Temporalité de la théophanie
  choice: 'Présent de vision : « vient », « couvre », « remplit »'
  alternative: Récit au passé (« est venu », « a couvert », « a rempli ») ou attente au futur (« viendra », « couvrira », « remplira »)
  rationale: Le poème rappelle et rend présente l’apparition de Dieu. Le présent français préserve cette immédiateté sans réduire la scène à un seul horizon temporel.
- issue: Référent du « Saint »
  choice: Titre divin désignant le même référent que « Dieu »
  alternative: Un autre être saint distinct
  rationale: Le parallélisme des deux membres identifie fortement « le Saint » à Dieu, sans justifier l’introduction d’une figure séparée.
translation_notes:
  register: Français international moderne, naturel et digne, avec une disposition en lignes qui fait ressortir le parallélisme poétique. Les noms Témân et Parân portent des accents pour guider la prononciation; « Séla » est conservé comme terme technique non interprété.
