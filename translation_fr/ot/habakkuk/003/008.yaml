source:
  edition: WLC
  text: הֲ/בִ/נְהָרִים֙ חָרָ֣ה יְהוָ֔ה אִ֤ם בַּ/נְּהָרִים֙ אַפֶּ֔/ךָ אִם בַּ/יָּ֖ם עֶבְרָתֶ֑/ךָ כִּ֤י תִרְכַּב֙ עַל סוּסֶ֔י/ךָ מַרְכְּבֹתֶ֖י/ךָ יְשׁוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/008.yaml
  text: Was your anger against the rivers[a], Yahweh? Was your wrath against the rivers, or your fury against the sea, that you rode on your horses, on your chariots of salvation?
translation:
  language: fr
  text: 'Yahweh,

    t’es-tu enflammé contre les fleuves ?

    Ta colère était-elle contre les fleuves,

    ou ta fureur contre la mer,

    car tu chevauchais sur tes chevaux,

    sur tes chars de salut[a] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « car tu chevauchais sur tes chevaux, sur tes chars victorieux » ou « sur tes chars de délivrance ». Dans ce contexte, le mot hébreu יְשׁוּעָה peut évoquer le salut, la délivrance ou la victoire.'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: הֲבִנְהָרִים חָרָה יְהוָה
  choice: Est-ce contre les fleuves que tu t’es enflammé de colère, Yahweh ?
  rationale: La tournure interrogative et la préposition בְּ désignent les fleuves comme objet supposé de la colère. « S’enflammer de colère » conserve l’image du verbe חרה tout en restant idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אַפֶּךָ
  choice: ta colère
  rationale: אַף signifie littéralement « nez », mais désigne idiomatiquement la colère. Ce choix est naturel et maintient le parallélisme.
- source_word: עֶבְרָתֶךָ
  choice: ta fureur
  rationale: « Fureur » rend l’intensité d’une colère débordante et distingue ce terme de אַף dans le vers parallèle.
- source_word: כִּי תִרְכַּב עַל סוּסֶיךָ
  choice: quand tu chevauchais sur tes chevaux
  rationale: Dans cette évocation poétique d’une intervention divine, כִּי peut introduire la circonstance qui accompagne la question. L’imparfait français présente la scène sans imposer une relation de but.
- source_word: מַרְכְּבֹתֶיךָ יְשׁוּעָה
  choice: sur tes chars de salut
  rationale: La juxtaposition hébraïque est conservée sous une forme poétique concise. « Salut » garde la portée large de יְשׁוּעָה, qui peut inclure délivrance et victoire.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom propre divin ; sa translittération préserve cette distinction.
- issue: Nuance de יְשׁוּעָה dans une théophanie guerrière
  choice: salut
  alternative: victoire ou délivrance
  rationale: « Salut » préserve la notion générale de secours divin sans la réduire à la seule réussite militaire ; une note signale les nuances contextuelles possibles.
- issue: Valeur de כִּי devant l’image des chevaux et des chars
  choice: quand
  alternative: car / parce que
  rationale: « Quand » rend naturellement la valeur circonstancielle possible dans ce contexte, sans trancher les questions rhétoriques par une explication causale trop appuyée.
translation_notes:
  register: Français moderne, soutenu et poétique. La disposition en vers fait ressortir le parallélisme des questions et l’image finale. « S’enflammer de colère » conserve l’image hébraïque sans devenir obscure.
