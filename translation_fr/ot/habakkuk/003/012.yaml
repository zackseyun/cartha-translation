id: HAB.3.12
reference: Habakkuk 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/זַ֖עַם תִּצְעַד אָ֑רֶץ בְּ/אַ֖ף תָּד֥וּשׁ גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/012.yaml
  text: In wrath you marched through the earth[b][a]; in anger you threshed the nations.
translation:
  language: fr
  text: Dans ta fureur, tu marches à travers la terre[a] ; dans ta colère, tu foules les nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays » ; le mot hébreu peut désigner soit la terre en général, soit un territoire particulier.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu bats les nations comme le grain » ; le verbe hébreu désigne le battage, souvent effectué en foulant aux pieds.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזַעַם
  choice: Dans ta fureur
  rationale: La préposition בְּ introduit ici la manière ou la disposition accompagnant l’action. « Dans ta fureur » rend avec force זַעַם et forme un parallélisme naturel avec « dans ta colère ».
- source_word: תִּצְעַד
  choice: tu marches à travers
  rationale: צעד exprime une progression faite de pas, ici dans une scène théophanique. « Marches à travers » garde l’image d’une avancée volontaire et puissante sans la réduire à un simple déplacement.
- source_word: אָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner la terre entière ou un territoire particulier. La portée cosmique de l’hymne et le parallèle avec « les nations » favorisent ici « la terre », tout en laissant « le pays » comme possibilité en note.
- source_word: בְּאַף
  choice: dans ta colère
  rationale: אַף signifie littéralement « nez », mais désigne idiomatiquement la colère. La traduction française naturelle « dans ta colère » préserve le parallélisme du vers.
- source_word: תָּדוּשׁ
  choice: tu foules
  rationale: דושׁ désigne le battage des céréales, souvent effectué par foulage. « Tu foules » conserve à la fois l’idée de piétinement et l’arrière-plan agricole, explicité en note.
- source_word: גּוֹיִם
  choice: les nations
  rationale: גּוֹיִם désigne ici les peuples soumis au jugement divin. « Les nations » est direct et n’introduit pas la nuance plus tardive que pourrait suggérer « les païens ».
theological_decisions:
- issue: Portée de אָרֶץ dans cette scène de jugement théophanique
  choice: la terre
  alternative: le pays
  rationale: Le tableau poétique présente l’intervention divine à vaste échelle et met la terre en parallèle avec les nations. « La terre » convient donc mieux au contexte, sans exclure lexicalement le sens plus local signalé en note.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme « dans ta fureur / dans ta colère » est maintenu, de même que le mouvement énergique et l’image agricole du texte hébreu.
