source:
  edition: WLC
  text: כִּי אֶ֖בֶן מִ/קִּ֣יר תִּזְעָ֑ק וְ/כָפִ֖יס מֵ/עֵ֥ץ יַעֲנֶֽ/נָּה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/011.yaml
  text: For a stone will cry out from the wall, and a beam from the woodwork will answer it.
translation:
  language: fr
  text: Car une pierre criera du mur, et une poutre de la charpente lui répondra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶבֶן מִקִּיר
  choice: la pierre… du milieu du mur
  rationale: מִן indique ici le lieu d’où part le cri; «du milieu du mur» est naturel en français et conserve l’image de la pierre incorporée au mur.
- source_word: כָפִיס מֵעֵץ
  choice: la poutre, du milieu de la charpente
  rationale: כָפִיס désigne une pièce de bois de construction, probablement une poutre ou traverse. מֵעֵץ signifie littéralement «du bois», mais, dans le parallèle architectural avec le mur, «du milieu de la charpente» exprime clairement le bois mis en œuvre sans surspécifier le type précis de pièce.
- source_word: יַעֲנֶנָּה
  choice: lui répondra
  rationale: Le suffixe féminin singulier renvoie naturellement à אֶבֶן, «la pierre»; la personnification et le parallélisme sont maintenus.
theological_decisions:
- issue: Témoignage figuré des matériaux de la maison
  choice: Conserver littéralement le cri de la pierre et la réponse de la poutre
  alternative: Expliciter que la maison témoigne contre son bâtisseur
  rationale: Le texte personnifie les matériaux sans énoncer directement l’interprétation. La traduction préserve cette image et sa force judiciaire implicite sans résoudre la métaphore.
translation_notes:
  register: Français moderne, digne et accessible. La reprise «du milieu de» rend le parallélisme hébreu; la virgule autour du second complément allège la répétition verbale implicite. Aucun marqueur de note n’est requis.
