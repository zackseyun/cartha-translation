revisions:
- from: Tu t’es rassasié de honte plutôt que de gloire. Bois, toi aussi, et montre ton incirconcision ! La coupe de la main droite du SEIGNEUR fera le tour jusqu’à toi, et une honte extrême couvrira ta gloire.
  to: Tu t’es rassasié de honte au lieu de gloire. Bois, toi aussi, et montre ton incirconcision ! La coupe de la droite du SEIGNEUR fera le tour jusqu’à toi, et une honte extrême viendra sur ta gloire.
  rationale: Révision limitée afin d’éviter l’ajout du verbe « couvrir », tout en préservant l’image volontairement condensée et l’ambiguïté de la préposition עַל. « Au lieu de » rend plus directement le contraste מִן, et « la droite du SEIGNEUR » suit une formulation biblique française naturelle sans changement de sens.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:53:23Z'
review_pass:
  verdict: revise
  source_fidelity: La première proposition rend correctement le contraste de מִכָּבוֹד (« au lieu de gloire »). « montre ton incirconcision » restitue de manière recevable l’impératif קשה וְהֵעָרֵל, sans résoudre indûment sa difficulté textuelle. L’image de la coupe qui « fait le tour » rend bien תִּסּוֹב. En revanche, « couvrira ta gloire » ajoute une action explicite de couverture absente de עַל, qui signifie plus sobrement « sur/contre ta gloire » dans cette construction.
  naturalness: Le français est globalement moderne et solennel. « La coupe de la main droite du SEIGNEUR » est compréhensible, mais « la coupe de la droite du SEIGNEUR » est plus idiomatique dans un registre biblique et conserve la concision imagée de l’hébreu. « viendra sur ta gloire » est naturel et évite l’ajout interprétatif de « couvrira ».
  terminology: « SEIGNEUR » convient pour יהוה. « Incirconcision » préserve le terme corporel et polémique du texte sans euphémisme. Pour קִיקָלוֹן, « honte extrême » communique l’intensif; il convient de ne pas imposer une interprétation plus précise du terme rare.
  issues:
  - severity: medium
    issue: Ajout interprétatif dans « une honte extrême couvrira ta gloire »
    rationale: Le texte porte littéralement « et [un] qîqālôn sur ta gloire ». Le verbe « couvrir » n’est pas exprimé et fixe une relation spatiale/métaphorique plus déterminée que l’hébreu. « viendra sur » conserve l’ambiguïté et le parallélisme avec la coupe qui arrive sur le destinataire.
  - severity: low
    issue: « de la main droite du SEIGNEUR » est plus explicatif que nécessaire
    rationale: יְמִין peut se rendre directement par « la droite ». Cette formulation française biblique naturelle garde l’image concise de la « coupe de la droite du SEIGNEUR ».
  revised_text: Tu t’es rassasié de honte au lieu de gloire. Bois, toi aussi, et montre ton incirconcision ! La coupe de la droite du SEIGNEUR fera le tour jusqu’à toi, et une honte extrême viendra sur ta gloire.
