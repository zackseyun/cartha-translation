  text: שָׂבַ֤עְתָּ קָלוֹן֙ מִ/כָּב֔וֹד שְׁתֵ֥ה גַם אַ֖תָּה וְ/הֵֽעָרֵ֑ל תִּסּ֣וֹב עָלֶ֗י/ךָ כּ֚וֹס יְמִ֣ין יְהוָ֔ה וְ/קִיקָל֖וֹן עַל כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/016.yaml
  text: You have had your fill of shame instead of glory. Drink, you also, and show your uncircumcision! The cup from the LORD’s right hand will come around to you, and utter disgrace will be upon your glory.
translation:
  language: fr
  text: Tu t’es rassasié de honte au lieu de gloire. Bois, toi aussi, et montre ton incirconcision ! La coupe de la droite du SEIGNEUR fera le tour jusqu’à toi, et une honte extrême viendra sur ta gloire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂבַעְתָּ קָלוֹן מִכָּבוֹד
  choice: Tu t’es rassasié de honte plutôt que de gloire
  rationale: Conserve l’image de satiété exprimée par שׂבע et rend naturellement le contraste introduit par מִן.
- source_word: וְהֵעָרֵל
  choice: et montre ton incirconcision
  rationale: Le verbe est textuellement difficile, mais la tradition massorétique et le parallélisme d’exposition honteuse soutiennent cette formulation sans en atténuer la crudité.
- source_word: תִּסּוֹב עָלֶיךָ כּוֹס יְמִין יְהוָה
  choice: La coupe de la main droite du SEIGNEUR fera le tour jusqu’à toi
  rationale: Préserve l’image de la coupe qui passe d’un buveur à l’autre et rattache explicitement יְמִין à la main droite du SEIGNEUR.
- source_word: קִיקָלוֹן
  choice: une honte extrême
  rationale: Ce terme rare et intensif désigne une ignominie particulièrement profonde; «honte extrême» en transmet la force sans recourir à une conjecture scatologique.
- source_word: עַל כְּבוֹדֶךָ
  choice: couvrira ta gloire
  rationale: Dans ce contexte, עַל indique que la honte vient sur la gloire et la recouvre; le choix donne en français une image claire tout en maintenant le renversement ironique.
theological_decisions:
- issue: Désignation divine יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: La forme en petites capitales suit l’usage biblique français courant pour le tétragramme sans ajouter une vocalisation discutée.
- issue: Nature du jugement figuré par la coupe
  choice: conserver l’image sans l’expliciter
  alternative: paraphraser comme «le jugement du SEIGNEUR t’atteindra»
  rationale: Le texte présente le jugement sous l’image théologique traditionnelle de la coupe; l’expliciter supprimerait une partie de sa richesse et de sa tension poétique.
translation_notes:
  register: Français moderne, direct et solennel. Le tutoiement correspond à l’adresse singulière accusatrice. Les images concrètes de la satiété, de l’incirconcision et de la coupe sont maintenues.
