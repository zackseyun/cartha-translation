source:
  edition: WLC
  text: הֲ/ל֣וֹא הִנֵּ֔ה מֵ/אֵ֖ת יְהוָ֣ה צְבָא֑וֹת וְ/יִֽיגְע֤וּ עַמִּים֙ בְּ/דֵי אֵ֔שׁ וּ/לְאֻמִּ֖ים בְּ/דֵי רִ֥יק יִעָֽפוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/013.yaml
  text: Is it not indeed from Yahweh of hosts that peoples labor for fire[b][a], and nations weary themselves for emptiness?
translation:
  language: fr
  text: N’est-ce pas de la part de Yahweh des armées que les peuples peinent pour le feu[a], et que les nations s’épuisent pour rien[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour le feu » ; c’est-à-dire, selon une compréhension possible, pour ce qui est destiné à être consumé par le feu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour le vide », « pour ce qui est vain ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא הִנֵּה
  choice: Cela ne… pas, en effet
  rationale: Préserve la question rhétorique qui appelle une réponse affirmative ainsi que la valeur emphatique de הִנֵּה, dans un français actuel.
- source_word: מֵאֵת
  choice: vient de
  rationale: Exprime naturellement la provenance ou l’origine indiquée par la préposition composée.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Transcrit le nom divin et rend צְבָאוֹת sans limiter explicitement les armées à un seul domaine.
- source_word: וְיִיגְעוּ עַמִּים
  choice: Les peuples peinent
  rationale: Rend l’effort pénible du verbe יגע et conserve la distinction entre עַמִּים, « peuples », et לְאֻמִּים, « nations ».
- source_word: בְּדֵי אֵשׁ
  choice: pour ce qui sera livré au feu
  rationale: 'Explicite avec mesure l’idiome difficile : le fruit du travail est destiné à être consumé par le feu, tout en conservant l’image.'
- source_word: וּלְאֻמִּים בְּדֵי רִיק יִעָפוּ
  choice: et les nations s’épuisent pour le néant
  rationale: Reproduit le parallélisme, la fatigue résultant de l’effort et l’idée de vacuité ou de futilité portée par רִיק.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu porte directement le Tétragramme ; sa transcription préserve le caractère propre du nom sans le remplacer par un titre.
- issue: Portée de la provenance exprimée par מֵאֵת
  choice: La destruction et la futilité de l’œuvre des peuples viennent de Yahweh dans le cadre du jugement.
  alternative: Yahweh serait l’auteur moral de leurs entreprises mauvaises ; ou il ne ferait qu’en avoir connaissance.
  rationale: La formulation conserve l’affirmation forte de la souveraineté divine sur l’issue sans attribuer explicitement à Dieu l’intention mauvaise des nations.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique et le parallélisme poétique sont conservés. « Yahweh des armées » maintient le titre hébreu sans tournure archaïque ; les notes signalent les principales possibilités lexicales des deux expressions avec בְּדֵי.
