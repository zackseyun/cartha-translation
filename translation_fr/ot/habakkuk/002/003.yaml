  text: כִּ֣י ע֤וֹד חָזוֹן֙ לַ/מּוֹעֵ֔ד וְ/יָפֵ֥חַ לַ/קֵּ֖ץ וְ/לֹ֣א יְכַזֵּ֑ב אִם יִתְמַהְמָהּ֙ חַכֵּה ל֔/וֹ כִּֽי בֹ֥א יָבֹ֖א לֹ֥א יְאַחֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/003.yaml
  text: For the vision is still for the appointed time[a]; it hastens toward the end and will not lie. If it delays, wait for it, for it will surely come[b]; it will not be late.
translation:
  language: fr
  text: Car la vision est encore destinée au temps fixé ; elle se hâte vers la fin[a] et ne mentira pas. Si elle tarde, attends-la[b], car elle viendra, oui, elle viendra ; elle ne sera pas en retard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « elle souffle vers la fin », « elle halète vers la fin » ou « elle parle de la fin ». Le verbe hébreu est difficile ; le texte principal exprime l’idée probable d’un mouvement pressant vers l’accomplissement fixé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « S’il tarde, attends-le. » Le pronom hébreu est masculin et peut être compris personnellement, bien qu’il renvoie le plus naturellement ici à la « vision », nom masculin en hébreu. Hébreux 10.37 reprend cette parole dans un sens personnel.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָזוֹן
  choice: vision
  rationale: Terme courant pour une révélation prophétique reçue en vision ; il convient au contexte immédiat, où Habacuc doit la mettre par écrit et en attendre l’accomplissement.
- source_word: לַמּוֹעֵד
  choice: pour le temps fixé
  rationale: מוֹעֵד désigne un moment déterminé ou assigné. « Le temps fixé » exprime clairement cette échéance sans préciser explicitement qui l’a fixée.
- source_word: וְיָפֵחַ
  choice: elle se hâte
  rationale: Le verbe est difficile et peut évoquer le souffle ou l’essoufflement, d’où l’image d’un mouvement pressant vers l’accomplissement. « Se hâte » donne en français moderne le sens probable tout en signalant les autres possibilités en note.
- source_word: לַקֵּץ
  choice: vers la fin
  rationale: קֵץ désigne ici le terme où la vision s’accomplira. « Vers » s’accorde naturellement avec le mouvement exprimé par « se hâte ».
- source_word: וְלֹא יְכַזֵּב
  choice: et ne mentira pas
  rationale: Le verbe signifie mentir ou se révéler trompeur. La formulation directe conserve la personnification de la vision.
- source_word: אִם יִתְמַהְמָהּ
  choice: Si elle tarde
  rationale: Le verbe exprime le fait de tarder ou de s’attarder. Cette formulation concise préserve l’apparence d’un délai avant l’accomplissement.
- source_word: חַכֵּה לוֹ
  choice: attends-la
  rationale: Le suffixe hébreu est masculin singulier parce que חָזוֹן est masculin ; en français, le pronom féminin reprend naturellement « la vision ». La lecture personnelle est conservée en note.
- source_word: כִּי בֹא יָבֹא
  choice: car elle viendra, oui, elle viendra
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie la certitude. La reprise française avec « oui » rend cette insistance sans lourdeur excessive.
- source_word: לֹא יְאַחֵר
  choice: elle ne sera pas en retard
  rationale: Le verbe signifie être en retard ou tarder. Cette traduction maintient la tension voulue entre le délai apparent et l’accomplissement au moment exact.
theological_decisions:
- issue: Référent des formes pronominales dans la seconde moitié du verset
  choice: 'Elles renvoient principalement à la vision et à son accomplissement : « elle » et « la ».'
  alternative: 'Une lecture personnelle est possible : « s’il tarde, attends-le », notamment dans l’histoire de la réception et dans l’application d’Hébreux 10.37.'
  rationale: Dans le contexte hébreu, l’antécédent le plus proche est חָזוֹן, nom masculin signifiant « vision ». Le français exige ici le féminin grammatical. La lecture personnelle ne doit pas être introduite dans le texte principal, mais elle mérite d’être signalée pour préserver l’ambiguïté et la réception ancienne.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « elle viendra, oui, elle viendra » reproduit l’insistance hébraïque. La tension entre « si elle tarde » et « elle ne sera pas en retard » est volontairement maintenue.
