source:
  edition: WLC
  text: מָֽה הוֹעִ֣יל פֶּ֗סֶל כִּ֤י פְסָל/וֹ֙ יֹֽצְר֔/וֹ מַסֵּכָ֖ה וּ/מ֣וֹרֶה שָּׁ֑קֶר כִּ֣י בָטַ֞ח יֹצֵ֤ר יִצְר/וֹ֙ עָלָ֔י/ו לַ/עֲשׂ֖וֹת אֱלִילִ֥ים אִלְּמִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/018.yaml
  text: What profit is an idol when its maker has carved it— a cast image and a teacher of lies? For the one who formed it trusts in it[d][c][b][a], making mute idols.
translation:
  language: fr
  text: À quoi sert une idole[a], puisque son artisan l’a sculptée — une image de métal coulé[b] qui enseigne le mensonge[c] ? Car celui qui l’a façonnée met sa confiance en elle, pour fabriquer des idoles[d] muettes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une image sculptée ». Ici, « idole » explicite que l’objet sculpté sert à un faux culte.
    reason: lexical_alternative
  - marker: b
    text: Ou « une image fondue » ou « une statue coulée ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement « un maître de mensonge » : l’idole est probablement personnifiée comme quelque chose qui égare ceux qui lui rendent un culte.'
    reason: lexical_alternative
  - marker: d
    text: Le mot hébreu peut aussi évoquer des idoles « sans valeur » ou des « néants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הוֹעִיל
  choice: À quoi sert
  rationale: La tournure interrogative exprime l’absence totale d’utilité ou de bénéfice. « À quoi sert » est idiomatique en français moderne et conserve la force rhétorique.
- source_word: פֶּסֶל
  choice: une idole
  rationale: Le terme désigne une représentation sculptée employée comme objet de culte. « Idole » rend clairement sa fonction dans ce contexte, tandis que le verbe suivant explicite qu’elle a été sculptée.
- source_word: כִּי פְסָלוֹ יֹצְרוֹ
  choice: puisque son artisan l’a sculptée
  rationale: 'כִּי introduit ici l’explication ironique de l’inutilité de l’idole : elle dépend entièrement de l’être humain qui l’a produite. « Artisan » désigne naturellement celui qui la façonne.'
- source_word: מַסֵּכָה
  choice: une image en métal coulé
  rationale: Le mot désigne habituellement une représentation obtenue par la fonte ou la coulée du métal. Cette formulation est précise et naturelle en français contemporain.
- source_word: וּמוֹרֶה שָּׁקֶר
  choice: qui enseigne le mensonge
  rationale: La formulation conserve la personnification de l’image comme source d’un enseignement trompeur, tout en évitant le peu naturel « une enseignante de mensonge ».
- source_word: כִּי בָטַח
  choice: Car ... met sa confiance
  rationale: Le second כִּי introduit le motif de la dénonciation. « Car » maintient ce lien explicatif, et « mettre sa confiance en » rend l’emploi de בטח avec עַל.
- source_word: יֹצֵר יִצְרוֹ עָלָיו
  choice: celui qui l’a façonnée met sa confiance en elle
  rationale: 'Le français reprend directement l’ironie du texte : le fabricant place sa confiance dans l’objet qu’il a lui-même façonné, sans élargir « elle » à une notion plus générale d’œuvre humaine.'
- source_word: לַעֲשׂוֹת
  choice: en fabriquant
  rationale: Le gérondif rend naturellement le lien circonstanciel de l’infinitif avec l’action du fabricant, sans trancher trop rigidement entre but et résultat.
- source_word: אֱלִילִים
  choice: des idoles
  rationale: « Idoles » est clair dans le texte principal. La nuance péjorative possible de « choses sans valeur » ou « néants » est signalée en note.
- source_word: אִלְּמִים
  choice: muettes
  rationale: L’adjectif signifie incapables de parler. « Muettes » est exact, courant et souligne l’impuissance des idoles.
theological_decisions:
- issue: Identité de ce qui « enseigne le mensonge »
  choice: L’image est personnifiée comme enseignant le mensonge par sa fonction religieuse trompeuse.
  alternative: Le « maître de mensonge » pourrait désigner l’artisan ou un faux prophète plutôt que l’image elle-même.
  rationale: La syntaxe associe le plus naturellement מַסֵּכָה et מוֹרֶה שָּׁקֶר comme deux descriptions de l’idole. La traduction conserve cette personnification sans développer de conclusion doctrinale étrangère au verset.
- issue: Valeur de לַעֲשׂוֹת
  choice: Le lien avec l’action du fabricant est rendu de manière souple par « en fabriquant ».
  alternative: On peut comprendre plus précisément « afin de fabriquer » comme une expression de but.
  rationale: L’infinitif hébreu permet une nuance de but ou de résultat/circonstance. Le gérondif français préserve cette relative ouverture.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique et l’ironie prophétique sont conservées. Le tiret met en relief l’apposition décrivant l’idole, et la personnification est rendue de façon compréhensible sans aplanir la tension du texte.
