source:
  edition: WLC
  text: ה֣וֹי אֹמֵ֤ר לָ/עֵץ֙ הָקִ֔יצָ/ה ע֖וּרִי לְ/אֶ֣בֶן דּוּמָ֑ם ה֣וּא יוֹרֶ֔ה הִנֵּה ה֗וּא תָּפוּשׂ֙ זָהָ֣ב וָ/כֶ֔סֶף וְ/כָל ר֖וּחַ אֵ֥ין בְּ/קִרְבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/019.yaml
  text: Woe to the one who says to wood[a], “Wake up!” and to silent stone, “Arise!” Can it teach? Look— it is overlaid with gold and silver, yet there is no breath at all within it.
translation:
  language: fr
  text: 'Malheur à celui qui dit au bois : « Réveille-toi ! » et à la pierre silencieuse : « Lève-toi ! » Cet objet peut-il enseigner ? Voici, il est recouvert d’or et d’argent, mais il n’y a en lui aucun souffle[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esprit ». Le mot hébreu peut signifier « souffle », « vent » ou « esprit ». Ici, il souligne que l’idole n’a aucune vie.
    reason: Alternative lexicale et préservation de la polysémie de רוּחַ.
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Cette formule conserve la force de dénonciation et de jugement de l’interjection prophétique.
- source_word: אֹמֵר
  choice: celui qui dit
  rationale: Le participe substantivé désigne au singulier la personne caractérisée par ces paroles ; cette tournure est naturelle en français moderne.
- source_word: לָעֵץ
  choice: au bois
  rationale: Le nom désigne ici le matériau de l’idole et forme un parallèle concis avec la pierre.
- source_word: הָקִיצָה
  choice: Réveille-toi !
  rationale: L’impératif adressé au bois fait ressortir l’ironie d’appeler un objet inanimé comme s’il dormait.
- source_word: עוּרִי
  choice: Lève-toi !
  rationale: Cette traduction garde la variation poétique entre les deux impératifs hébreux sans effacer leur parallélisme.
- source_word: לְאֶבֶן דּוּמָם
  choice: à la pierre silencieuse
  rationale: « Silencieuse » exprime clairement l’incapacité de l’idole à parler ou à répondre, tout en restant digne et naturel.
- source_word: הוּא יוֹרֶה
  choice: Peut-elle enseigner ?
  rationale: Dans ce contexte polémique, la proposition se comprend naturellement comme une question rhétorique dénonçant l’absurdité d’attendre un enseignement d’une idole.
- source_word: הִנֵּה
  choice: 'Regarde :'
  rationale: L’impératif attire directement l’attention sur le contraste visible qui suit, dans un français actuel.
- source_word: תָּפוּשׂ זָהָב וָכֶסֶף
  choice: elle est recouverte d’or et d’argent
  rationale: La formulation rend l’idée d’une idole revêtue de métaux précieux sans préciser indûment la technique artisanale employée.
- source_word: וְכָל רוּחַ אֵין בְּקִרְבּוֹ
  choice: mais il n’y a en elle aucun souffle
  rationale: « Souffle » exprime ici l’absence totale de vie ; « aucun » rend l’emphase de כָל, tandis que « mais » explicite le contraste porté par le contexte.
theological_decisions:
- issue: Sens de רוּחַ dans la proposition finale
  choice: souffle
  alternative: esprit
  rationale: Dans cette dénonciation de l’idolâtrie, le propos immédiat est que l’idole est dépourvue de vie. « Souffle » rend ce sens sans imposer une thèse métaphysique, tandis qu’une note conserve la polysémie réelle du terme hébreu.
- issue: Valeur de הוּא יוֹרֶה
  choice: 'question rhétorique : « Peut-elle enseigner ? »'
  alternative: 'affirmation ou question orientée vers l’avenir : « Elle enseignera ? »'
  rationale: La question de capacité s’intègre le mieux à l’ironie du passage, mais la forme hébraïque ne comporte pas de marque interrogative explicite ; la ponctuation relève donc de l’interprétation contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme prophétique est maintenu par les impératifs brefs, la question rhétorique et l’appel « Regarde ». Le féminin des pronoms renvoie naturellement à « la pierre », sujet le plus proche et image de l’idole décrite.
