  terminology: « Malheur », « bois », « pierre silencieuse », « enseigner », « recouvert d’or et d’argent » et « souffle » conviennent. La note préserve adéquatement l’alternative « esprit » pour רוּחַ, sans imposer une interprétation doctrinale.
