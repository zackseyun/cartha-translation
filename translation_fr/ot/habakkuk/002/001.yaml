  text: עַל מִשְׁמַרְתִּ֣/י אֶעֱמֹ֔דָה וְ/אֶֽתְיַצְּבָ֖ה עַל מָצ֑וֹר וַ/אֲצַפֶּ֗ה לִ/רְאוֹת֙ מַה יְדַבֶּר בִּ֔/י וּ/מָ֥ה אָשִׁ֖יב עַל תּוֹכַחְתִּֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/001.yaml
  text: I will stand at my guard post and station myself on the rampart[a]; I will keep watch to see what he will speak in me[b], and what I should answer concerning my complaint.
translation:
  language: fr
  text: Je me tiendrai à mon poste de garde et prendrai position sur le rempart. Je guetterai pour voir ce qu’il dira en moi[a] et ce que je répondrai au sujet de ma plainte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qu’il me dira ». L’hébreu peut aussi évoquer une parole prophétique prononcée intérieurement.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « au sujet de ma réprimande »; autres possibilités : « de mon objection » ou « de mon argument ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמַרְתִּי
  choice: mon poste de garde
  rationale: Le nom peut désigner la fonction de guet ou l’endroit où elle s’exerce. Ici, l’image concrète d’une sentinelle favorise « poste de garde ».
- source_word: אֶעֱמֹדָה
  choice: Je me tiendrai
  rationale: La forme exprime ici la résolution du prophète à demeurer à son poste dans l’attente.
- source_word: וְאֶתְיַצְּבָה
  choice: et prendrai position
  rationale: Le hitpael évoque le fait de se placer fermement; cette formulation naturelle conserve l’idée sans répéter « me tiendrai ».
- source_word: מָצוֹר
  choice: le rempart
  rationale: Dans cette scène de veille, le terme désigne vraisemblablement un ouvrage fortifié servant de point d’observation, même si « forteresse » ou « ouvrage de siège » restent lexicalement possibles.
- source_word: וַאֲצַפֶּה
  choice: Je guetterai
  rationale: Le verbe exprime une observation attentive et soutenue, marquée par l’attente.
- source_word: מַה יְדַבֶּר בִּי
  choice: ce qu’il dira en moi
  rationale: La traduction conserve le sens ordinaire de la préposition בְּ et la possibilité d’une parole prophétique intérieure, sans exclure que la parole soit adressée au prophète.
- source_word: וּמָה אָשִׁיב
  choice: et ce que je répondrai
  rationale: Le hiphil de שוב peut ici exprimer le fait de donner une réponse. Le futur français conserve l’ambiguïté entre réponse attendue et délibération sur ce qu’il conviendra de répondre.
- source_word: עַל תּוֹכַחְתִּי
  choice: au sujet du reproche qui m’est adressé
  rationale: Le suffixe de première personne peut être compris objectivement, comme le reproche reçu par le prophète. Cette lecture s’accorde avec son attente d’une parole divine, tandis que « ma plainte » ou « mon argument » demeure possible.
theological_decisions:
- issue: Sens de בִּי dans מַה יְדַבֶּר בִּי
  choice: « en moi », parole intérieure ou prophétique
  alternative: « à moi », parole adressée au prophète
  rationale: La préposition signifie naturellement « en », et cette lecture préserve l’image possible d’une communication prophétique intérieure. Le contexte autorise toutefois le sens relationnel « à moi »; l’alternative est donc signalée en note.
- issue: Référent de תּוֹכַחְתִּי
  choice: le reproche adressé au prophète
  alternative: la plainte, l’objection ou l’argument formulé par le prophète
  rationale: Le nom peut désigner aussi bien une réprimande qu’une contestation ou un débat, et le suffixe permet plusieurs rapports sémantiques. Le texte principal retient une lecture grammaticalement possible sans effacer l’autre, donnée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le rythme en deux phrases rend clairement la posture de veille puis l’attente d’une parole. Les notes maintiennent les ambiguïtés réelles de בִּי et תּוֹכַחְתִּי.
