  text: ה֛וֹי בֹּנֶ֥ה עִ֖יר בְּ/דָמִ֑ים וְ/כוֹנֵ֥ן קִרְיָ֖ה בְּ/עַוְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/012.yaml
  text: Woe to him who builds a city with bloodshed and establishes a town by injustice[a][b].
translation:
  language: fr
  text: Malheur à celui qui bâtit une ville par le sang versé[a] et qui établit une cité par l’injustice[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par des sangs » ; ce pluriel hébreu peut désigner le sang versé, les meurtres ou la culpabilité liée au sang versé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « fonde une cité par l’injustice ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Cette formule conserve la force de l’oracle prophétique de condamnation, tout en étant naturelle et solennelle en français moderne.
- source_word: בֹּנֶה
  choice: celui qui bâtit
  rationale: Le participe qal décrit la personne qui bâtit; cette tournure restitue clairement sa valeur substantivée.
- source_word: עִיר
  choice: ville
  rationale: Équivalent courant du terme hébreu, approprié à une agglomération organisée.
- source_word: בְּדָמִים
  choice: dans le sang
  rationale: Le pluriel hébreu « sangs » évoque les meurtres, la violence sanglante ou la culpabilité qui en découle. La formule française garde l’image forte du texte sans la réduire à une seule nuance.
- source_word: וְכוֹנֵן
  choice: et fonde
  rationale: Le piel exprime ici l’action d’établir solidement. « Fonde » convient au contexte urbain et au parallélisme avec « bâtit ».
- source_word: קִרְיָה
  choice: cité
  rationale: Ce quasi-synonyme de עִיר est rendu par un terme distinct afin de préserver la variation poétique hébraïque.
- source_word: בְּעַוְלָה
  choice: sur l’injustice
  rationale: La préposition marque ici le fondement ou le moyen; « sur l’injustice » forme un parallèle naturel avec « dans le sang » et exprime le caractère injuste de l’entreprise.
theological_decisions:
- issue: Portée de la dénonciation
  choice: Un oracle de malheur contre celui qui édifie une puissance urbaine par la violence et l’injustice
  alternative: Une lamentation générale sur la corruption civique
  rationale: הוֹי introduit ici une dénonciation prophétique. La formulation conserve la portée morale et politique du verset sans l’assujettir à une interprétation doctrinale particulière.
translation_notes:
  register: Français international moderne, à la fois digne et direct. Le parallélisme « bâtit une ville / fonde une cité » reflète la poésie hébraïque, tandis que les prépositions françaises rendent naturellement les rapports exprimés par בְּ.
