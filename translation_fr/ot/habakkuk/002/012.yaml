review_pass:
  verdict: revise
  source_fidelity: 'La structure et les termes principaux sont bien rendus, mais « dans le sang » exprime plus naturellement un cadre ou une atmosphère en français, tandis que בְּדָמִים indique ici le moyen fautif : le sang versé / la violence meurtrière. « Par le sang versé » restitue plus exactement cette valeur instrumentale. De même, « par l’injustice » est plus directement parallèle à l’hébreu que « sur l’injustice ».'
  naturalness: « Malheur à celui qui… » est une formulation française moderne, digne et adaptée à l’oracle prophétique. « Bâtit une ville / établit une cité » conserve un parallélisme naturel et la variation des quasi-synonymes hébreux.
  terminology: « Sang versé » rend sans surinterprétation le pluriel דָּמִים, qui peut évoquer des effusions de sang et la culpabilité qui y est attachée. « Injustice » rend précisément עַוְלָה. « Établit » correspond bien à כּוֹנֵן; « fonde » peut être signalé comme autre possibilité.
  issues:
  - severity: medium
    issue: Valeur de la préposition dans « bâtit une ville dans le sang »
    rationale: Le syntagme hébreu בְּדָמִים est instrumental et renvoie à l’édification obtenue par le sang versé. En français, « dans le sang » peut décrire les circonstances plutôt que le moyen; « par le sang versé » est plus fidèle et idiomatique.
  - severity: low
    issue: Valeur de la préposition dans « fonde une cité sur l’injustice »
    rationale: Bien que « sur » puisse suggérer un fondement, le parallélisme hébreu emploie la même préposition instrumentale dans les deux membres. « Par l’injustice » conserve ce parallélisme plus clairement.
  revised_text: Malheur à celui qui bâtit une ville par le sang versé[a] et qui établit une cité par l’injustice[b] !
