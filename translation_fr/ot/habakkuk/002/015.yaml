source:
  edition: WLC
  text: ה֚וֹי מַשְׁקֵ֣ה רֵעֵ֔/הוּ מְסַפֵּ֥חַ חֲמָתְ/ךָ֖ וְ/אַ֣ף שַׁכֵּ֑ר לְמַ֥עַן הַבִּ֖יט עַל מְעוֹרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/015.yaml
  text: Woe to him who makes his neighbor drink[a], pouring out your wrath and even making him drunk[c][b], in order to look on their nakedness.
translation:
  language: fr
  text: Malheur à celui qui fait boire son prochain, en y mêlant ta fureur[a] et même en l’enivrant[b], afin de contempler leur nudité[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en y mêlant ton venin ». Le mot hébreu traduit par « fureur » peut aussi évoquer la chaleur ou le venin ; l’ensemble de l’expression hébraïque est difficile.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu est difficile. D’autres comprennent cette proposition comme « en ajoutant ton outre » ou harmonisent le changement de personne en traduisant « sa fureur ».
    reason: alternative_reading
  - marker: c
    text: Ou « leurs parties intimes ». Le mot hébreu désigne ici une nudité exposée de manière honteuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Interjection prophétique de dénonciation annonçant le jugement; « Malheur à » est naturel et solennel en français.
- source_word: מַשְׁקֵה
  choice: qui fait boire
  rationale: Le participe au hifil de שׁקה exprime la causation et peut suggérer ici la contrainte.
- source_word: רֵעֵהוּ
  choice: son prochain
  rationale: רֵעַ désigne un proche, un compagnon ou une autre personne; « prochain » convient au registre éthique du passage.
- source_word: מְסַפֵּחַ
  choice: en y mêlant
  rationale: La forme est difficile; dans l’image de la boisson, « mêler » rend de façon intelligible l’idée d’ajouter quelque chose au breuvage sans dissimuler l’incertitude, signalée en note.
- source_word: חֲמָתְךָ
  choice: ta fureur
  rationale: חֵמָה désigne couramment la fureur ou la colère, mais peut aussi évoquer le venin; le suffixe de deuxième personne est conservé.
- source_word: וְאַף
  choice: et ... même
  rationale: L’adverbe marque ici une intensification; la tournure française exprime cette progression.
- source_word: שַׁכֵּר
  choice: en l’enivrant
  rationale: Le verbe signifie rendre ivre; cette formulation est directe et suit le mouvement de la proposition précédente.
- source_word: לְמַעַן
  choice: afin de
  rationale: La locution marque explicitement le but poursuivi.
- source_word: הַבִּיט
  choice: contempler
  rationale: Le verbe exprime le fait de regarder; « contempler » conserve l’idée d’un regard soutenu et moralement chargé par le contexte.
- source_word: מְעוֹרֵיהֶם
  choice: leur nudité
  rationale: Le terme évoque une nudité exposée et honteuse, possiblement les parties intimes; « nudité » reste digne tout en préservant la force du texte.
theological_decisions:
- issue: Passage de la troisième à la deuxième personne dans חֲמָתְךָ
  choice: Conserver « ta fureur » dans le texte principal.
  alternative: Harmoniser la personne grammaticale (« sa fureur ») ou comprendre autrement le mot difficile précédent, par exemple comme une référence à une outre.
  rationale: Le texte massorétique présente ce changement abrupt de personne. Le conserver respecte sa forme et sa vigueur rhétorique plutôt que de résoudre silencieusement la difficulté.
- issue: Image d’exposition sexuelle et de honte
  choice: Traduire par « afin de contempler leur nudité ».
  alternative: « afin de regarder leurs parties intimes » ou « afin de contempler leur honte ».
  rationale: Le texte condamne l’enivrement volontaire visant l’exposition humiliante. « Nudité » transmet cette idée sans ajouter de précisions absentes de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le brusque passage à la deuxième personne et l’ambiguïté lexicale du texte hébreu, avec des notes explicatives plutôt qu’une harmonisation silencieuse.
