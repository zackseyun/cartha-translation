source:
  edition: WLC
  text: כִּ֣י חֲמַ֤ס לְבָנוֹן֙ יְכַסֶּ֔/ךָּ וְ/שֹׁ֥ד בְּהֵמ֖וֹת יְחִיתַ֑/ן מִ/דְּמֵ֤י אָדָם֙ וַ/חֲמַס אֶ֔רֶץ קִרְיָ֖ה וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/017.yaml
  text: For the violence done to Lebanon will cover you[a], and the destruction of beasts will terrify you, because of the blood of man and the violence done to the land, to the city[b], and to all who dwell in it.
translation:
  language: fr
  text: Car la violence faite au Liban te couvrira, et la dévastation infligée aux bêtes les terrifiera[a], à cause du sang humain versé et de la violence faite au pays, à la ville et à tous ceux qui l’habitent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu dit « les terrifiera », sans préciser clairement qui est visé. Certaines traductions comprennent « te terrifiera », en rapport avec le « te » de la proposition précédente.
    reason: textual_or_referential_ambiguity
lexical_decisions:
- source_word: חֲמַס לְבָנוֹן
  choice: la violence faite au Liban
  rationale: חָמָס désigne ici la violence ou l’injustice brutale dont le Liban est victime. La tournure française explicite naturellement cette relation sans atténuer le terme.
- source_word: יְכַסֶּךָּ
  choice: te couvrira
  rationale: Le verbe כסה signifie littéralement « couvrir ». L’image prophétique d’une violence qui revient envelopper son auteur est conservée plutôt que remplacée par une interprétation comme « t’accablera ».
- source_word: שֹׁד בְּהֵמוֹת
  choice: la dévastation infligée aux bêtes
  rationale: שֹׁד évoque une dévastation violente. Le génitif peut désigner les bêtes qui la subissent; « infligée aux » rend cette relation probable et évite de suggérer que les bêtes dévastent elles-mêmes.
- source_word: יְחִיתַן
  choice: les terrifiera
  rationale: La forme issue de חתת exprime l’effroi ou l’abattement et porte, dans le texte massorétique, un suffixe objet de troisième personne du pluriel. Le pronom « les » respecte cette forme, malgré son référent implicite.
- source_word: מִדְּמֵי אָדָם
  choice: à cause du sang humain versé
  rationale: מִן a ici une valeur causale. Le pluriel דָּמִים évoque le sang répandu, donc le meurtre; אָדָם a une portée représentative. Cette formulation est idiomatique en français tout en conservant l’idée concrète du sang.
- source_word: וַחֲמַס אֶרֶץ
  choice: et de la violence faite au pays
  rationale: La répétition de חָמָס reprend la violence infligée, tandis que אֶרֶץ désigne ici le territoire ou pays victime de cette violence.
- source_word: קִרְיָה
  choice: à la ville
  rationale: קִרְיָה signifie « ville » ou « cité ». L’article défini convient au contexte immédiat de la ville bâtie dans le sang (v. 12), sans préciser davantage son identité.
- source_word: וְכָל יֹשְׁבֵי בָהּ
  choice: et à tous ceux qui l’habitent
  rationale: La formulation rend naturellement le participe « ceux qui habitent » et rattache le pronom féminin à la ville, son antécédent immédiat.
theological_decisions:
- issue: Portée représentative de אָדָם
  choice: sang humain versé
  alternative: sang de l’homme
  rationale: אָדָם au singulier peut représenter l’être humain en général. En français moderne, « sang humain versé » transmet cette portée collective et le sens de sang répandu sans limiter indûment la référence aux hommes de sexe masculin.
- issue: Objet de יְחִיתַן
  choice: les terrifiera
  alternative: te terrifiera
  rationale: Le texte massorétique porte un suffixe de troisième personne du pluriel, dont le référent demeure implicite, alors que plusieurs traductions comprennent le destinataire singulier par harmonisation avec « te couvrira ». La traduction principale conserve la difficulté du texte reçu et la note signale l’autre compréhension.
translation_notes:
  register: Français international moderne, digne et prophétique. La répétition de « violence faite » maintient le parallélisme hébreu; l’image inhabituelle de la violence qui « couvre » son auteur et l’ambiguïté du pronom pluriel sont volontairement préservées.
