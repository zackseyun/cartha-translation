id: HAB.2.14
reference: Habakkuk 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֚י תִּמָּלֵ֣א הָ/אָ֔רֶץ לָ/דַ֖עַת אֶת כְּב֣וֹד יְהוָ֑ה כַּ/מַּ֖יִם יְכַסּ֥וּ עַל יָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/014.yaml
  text: For the earth will be filled with the knowledge of the glory of Yahweh[a], as the waters cover the sea.
translation:
  language: fr
  text: Car la terre sera remplie de la connaissance de la gloire de Yahweh[a], comme les eaux recouvrent la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays », si le terme est compris dans un sens plus localisé; « la terre » est retenu ici parce que la portée du verset paraît universelle.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qui fonde le contexte précédent; « Car » conserve naturellement la valeur connective et causale.
- source_word: תִּמָּלֵא
  choice: sera remplie
  rationale: Le niphal inaccompli de מלא exprime ici un résultat futur à la voix passive.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Même si אֶרֶץ peut désigner un pays, l’image englobante des eaux qui recouvrent la mer favorise ici une portée universelle.
- source_word: לָדַעַת אֶת כְּבוֹד
  choice: de la connaissance de la gloire
  rationale: Après « sera remplie », l’infinitif construit avec ל se rend naturellement par un complément de contenu; « gloire » conserve le sens usuel de כָּבוֹד appliqué à Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: כַּמַּיִם יְכַסּוּ עַל יָם
  choice: comme les eaux recouvrent la mer
  rationale: « Comme » marque la comparaison; le présent français convient à cette image générale, et « recouvrent la mer » exprime naturellement יְכַסּוּ עַל יָם.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: la terre, au sens universel
  alternative: le pays, dans un sens localisé
  rationale: Le contexte imagé et l’ampleur de l’énoncé favorisent une portée universelle, sans rendre lexicalement impossible le sens plus local de אֶרֶץ.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure hébraïque tout en employant l’expression française naturelle « recouvrent la mer ».
