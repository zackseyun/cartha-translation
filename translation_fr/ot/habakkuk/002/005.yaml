source:
  edition: WLC
  text: וְ/אַף֙ כִּֽי הַ/יַּ֣יִן בּוֹגֵ֔ד גֶּ֥בֶר יָהִ֖יר וְ/לֹ֣א יִנְוֶ֑ה אֲשֶׁר֩ הִרְחִ֨יב כִּ/שְׁא֜וֹל נַפְשׁ֗/וֹ וְ/ה֤וּא כַ/מָּ֨וֶת֙ וְ/לֹ֣א יִשְׂבָּ֔ע וַ/יֶּאֱסֹ֤ף אֵלָי/ו֙ כָּל הַ/גּוֹיִ֔ם וַ/יִּקְבֹּ֥ץ אֵלָ֖י/ו כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/005.yaml
  text: Moreover[a], wine betrays; an arrogant man does not remain at rest. He enlarges his appetite like Sheol, and he is like death and is never satisfied[c][b]. He gathers to himself all the nations and collects to himself all the peoples.
translation:
  language: fr
  text: De plus, le vin trahit[a] ; l’homme arrogant ne trouve pas de repos[b]. Il élargit son appétit comme le séjour des morts[c] ; semblable à la mort, il n’est jamais rassasié. Il rassemble à lui toutes les nations, il réunit à lui tous les peuples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vin est traître » ou « le vin trompe ». L’hébreu est concis et difficile ; certains comprennent aussi cette ligne plus largement comme une évocation de l’arrogance enivrée du conquérant.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne reste pas chez lui » ou « ne demeure pas ». Le verbe hébreu est difficile ; le texte traduit l’idée d’une agitation insatiable suggérée par le contexte.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement « le shéol », c’est-à-dire le domaine des morts ; autre traduction possible : « la tombe ».'
    reason: cultural_note
lexical_decisions:
- source_word: וְאַף כִּי
  choice: De plus
  rationale: Cette tournure concise a ici une valeur de transition et de renforcement. « De plus » restitue naturellement sa force additive sans lui imposer une nuance causale.
- source_word: הַיַּיִן בּוֹגֵד
  choice: le vin trahit
  rationale: Le texte hébreu nomme explicitement le vin et emploie un participe exprimant la perfidie ou la tromperie. La personnification concise est conservée.
- source_word: גֶּבֶר יָהִיר
  choice: l’homme arrogant
  rationale: גֶּבֶר désigne ici l’homme sous le rapport de sa vigueur, tandis que יָהִיר exprime une fierté insolente. « L’homme arrogant » est clair et actuel.
- source_word: וְלֹא יִנְוֶה
  choice: ne reste pas en repos
  rationale: Le verbe est difficile et peut évoquer le fait de demeurer, de rester chez soi ou de trouver le repos. Cette formulation conserve l’idée contextuelle d’une instabilité avide sans retenir trop étroitement une seule analyse.
- source_word: הִרְחִיב ... נַפְשׁוֹ
  choice: Il élargit son appétit
  rationale: Le hiphil de רחב signifie « rendre large », et נֶפֶשׁ désigne ici le désir vorace de l’homme. « Appétit » rend ce sens contextuel tout en maintenant l’image d’un désir que l’on agrandit.
- source_word: כִּשְׁאוֹל
  choice: comme le séjour des morts
  rationale: שְׁאוֹל désigne le domaine des morts, réputé insatiable. L’expression française est intelligible sans réduire l’image à la seule tombe.
- source_word: וְהוּא כַמָּוֶת וְלֹא יִשְׂבָּע
  choice: semblable à la mort, il n’est jamais rassasié
  rationale: La comparaison avec la mort et l’idée continue d’insatiabilité sont préservées dans une syntaxe française naturelle.
- source_word: וַיֶּאֱסֹף ... וַיִּקְבֹּץ
  choice: Il rassemble ... il réunit
  rationale: Les deux verbes hébreux quasi parallèles sont rendus par deux verbes français distincts afin de conserver le parallélisme sans lourdeur.
theological_decisions:
- issue: Sens de שְׁאוֹל
  choice: le séjour des morts
  alternative: le shéol ; la tombe
  rationale: « Le séjour des morts » conserve la référence au domaine des défunts et son image d’insatiabilité, sans limiter le terme au lieu physique de l’inhumation. La translittération « shéol » serait plus formelle mais moins immédiatement accessible.
- issue: Rapport entre le vin et l’homme arrogant
  choice: Deux propositions étroitement juxtaposées
  alternative: Comprendre toute la ligne comme une description de l’arrogance enivrée du conquérant
  rationale: L’hébreu est concis et son articulation demeure incertaine. La traduction garde « le vin » comme sujet explicite de « trahit », puis présente l’homme arrogant, sans expliquer davantage le lien entre les deux.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique et les images d’insatiabilité sont maintenus. La ponctuation clarifie la progression sans résoudre les ambiguïtés réelles de la première ligne.
