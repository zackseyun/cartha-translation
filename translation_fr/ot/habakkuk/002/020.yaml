id: HAB.2.20
reference: Habakkuk 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יהוָ֖ה בְּ/הֵיכַ֣ל קָדְשׁ֑/וֹ הַ֥ס מִ/פָּנָ֖י/ו כָּל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/020.yaml
  text: But Yahweh is in his holy temple[c][b][a]; let all the earth be silent before him.
translation:
  language: fr
  text: Mais Yahweh est dans son saint temple. Que toute la terre fasse silence devant lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout le pays ». L’hébreu peut avoir ici une portée universelle ou, selon le contexte, géographique plus restreinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Mais Yahweh
  rationale: La conjonction וַ prend ici naturellement une valeur adversative, en contraste avec les idoles sans vie du verset précédent. Le nom divin יהוה est translittéré « Yahweh ».
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: est dans son saint temple
  rationale: הֵיכָל peut désigner un temple, un palais ou un sanctuaire. « Temple » convient au contexte cultuel tout en laissant ouverte la question d'un lieu céleste ou terrestre. La copule absente en hébreu est ajoutée naturellement en français.
- source_word: הַס
  choice: fasse silence
  rationale: L'interjection commande un silence solennel et révérencieux. « Faire silence » restitue cette force dans un français actuel et digne.
- source_word: מִפָּנָיו
  choice: devant lui
  rationale: Cette formulation idiomatique exprime la présence ou la face de Dieu sans littéralisme maladroit.
- source_word: כָּל הָאָרֶץ
  choice: toute la terre
  rationale: אֶרֶץ peut signifier « terre » ou « pays ». La portée universelle convient au caractère culminant de l'appel, tandis qu'une note conserve le sens contextuel plus étroit possible.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom d'alliance plutôt que de le remplacer par un titre.
- issue: Sens de הֵיכָל comme lieu de présence divine
  choice: temple
  alternative: palais ; sanctuaire
  rationale: « Temple » maintient à la fois la dimension cultuelle et la tension entre le sanctuaire terrestre et la demeure céleste, sans trancher entre les deux.
- issue: Portée de כָּל הָאָרֶץ
  choice: toute la terre
  alternative: tout le pays
  rationale: Le sens global est probable dans cette injonction solennelle, mais le nom hébreu permet aussi une portée géographique plus restreinte, signalée en note.
translation_notes:
  register: Français international moderne, solennel et accessible. La phrase brève conserve le contraste avec les idoles du verset précédent et la force liturgique de l'appel au silence.
