source:
  edition: WLC
  text: יָעַ֥צְתָּ בֹּ֖שֶׁת לְ/בֵיתֶ֑/ךָ קְצוֹת עַמִּ֥ים רַבִּ֖ים וְ/חוֹטֵ֥א נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/010.yaml
  text: You have devised shame for your house by cutting off many peoples[a], and have sinned against your own life.
translation:
  language: fr
  text: Tu as préparé la honte pour ta maison en retranchant de nombreux peuples, et tu as péché contre ta propre vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre ton âme » ou « contre toi-même ».
    reason: Alternative lexicale pour נַפְשֶׁךָ, qui peut désigner la vie, l’âme ou la personne elle-même.
lexical_decisions:
- source_word: יָעַצְתָּ
  choice: tu as préparé
  rationale: Le qal accompli de יעץ exprime ici un dessein délibéré. « Préparer » rend naturellement en français l'idée d'avoir conçu et amené un résultat, ici la honte.
- source_word: בֹּשֶׁת
  choice: la honte
  rationale: Le terme désigne la honte ou le déshonneur, avec une dimension morale et publique; « honte » reste direct et courant.
- source_word: לְבֵיתֶךָ
  choice: pour ta maison
  rationale: בַּיִת peut désigner la maison, la maisonnée ou la lignée. « Maison » préserve cette amplitude sans préciser indûment.
- source_word: קְצוֹת
  choice: en retranchant
  rationale: La forme exprime l'action de supprimer, exterminer ou faire disparaître. « Retrancher » conserve la force de l'image tout en convenant au registre prophétique.
- source_word: עַמִּים רַבִּים
  choice: de nombreux peuples
  rationale: « Peuples » rend le pluriel collectif sans évoquer nécessairement les États-nations modernes.
- source_word: וְחוֹטֵא
  choice: et tu as péché
  rationale: Le participe coordonné prolonge l'accusation et peut être rendu naturellement en français par un second verbe à l'accompli.
- source_word: נַפְשֶׁךָ
  choice: ta propre vie
  rationale: נֶפֶשׁ peut signifier vie, être, personne ou âme. Dans ce contexte de jugement où les actes du coupable se retournent contre lui, « ta propre vie » est concret sans imposer une anthropologie dualiste.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans ce contexte de jugement prophétique
  choice: ta propre vie
  alternative: ton âme; toi-même
  rationale: « Vie » exprime le caractère autodestructeur de la conduite dénoncée. Les sens « âme » et « toi-même » restent lexicalement possibles et sont signalés en note afin de préserver l'ambiguïté.
- issue: Rapport entre le dessein et la honte de la maison
  choice: tu as préparé la honte pour ta maison
  alternative: tu as conseillé la honte à ta maison; tu as projeté la honte contre ta maison
  rationale: 'La formulation maintient l''ironie judiciaire: le dessein dirigé contre les peuples produit en réalité la honte de la propre maison du coupable, sans préciser davantage la nuance du לְ.'
translation_notes:
  register: Français international moderne, direct et digne, avec tutoiement singulier correspondant aux formes hébraïques de deuxième personne masculine singulière. « Retranchant » conserve une tonalité prophétique sans devenir archaïque; la syntaxe demeure claire pour une lecture publique.
