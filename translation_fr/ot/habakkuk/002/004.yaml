    issue: Le sujet de « gonflé d’orgueil » est déplacé de l’âme vers la personne.
    rationale: Dans l’hébreu, עֻפְּלָה et לֹא יָשְׁרָה sont coordonnés autour de « son âme ». Le français proposé peut se comprendre, mais il obscurcit cette construction et atténue le contraste interne du verset.
  revised_text: 'Voici : son âme est gonflée d’orgueil ; elle n’est pas droite en lui. Mais le juste vivra par sa fidélité[a].'
  revised_footnotes:
