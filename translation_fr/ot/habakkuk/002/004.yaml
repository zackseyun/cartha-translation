  rationale: La correction, limitée à la première proposition, fait de « son âme » le sujet des deux prédicats, conformément à la structure hébraïque. Elle conserve l’opposition entre l’être intérieur non droit et la vie du juste, ainsi que l’ambiguïté de אֱמוּנָה signalée en note.
