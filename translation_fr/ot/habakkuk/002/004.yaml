source:
  edition: WLC
  text: הִנֵּ֣ה עֻפְּלָ֔ה לֹא יָשְׁרָ֥ה נַפְשׁ֖/וֹ בּ֑/וֹ וְ/צַדִּ֖יק בֶּ/אֱמוּנָת֥/וֹ יִחְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/004.yaml
  text: 'Look: his soul is puffed up; it is not upright within him, but the righteous will live by his faithfulness.'
translation:
  language: fr
  text: 'Voici : son âme est gonflée d’orgueil ; elle n’est pas droite en lui. Mais le juste vivra par sa fidélité[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par sa foi » ; le mot hébreu peut évoquer la foi, la fermeté ou la fidélité.'
    reason: Préserver l’étendue sémantique de אֱמוּנָה et l’ambiguïté théologiquement significative de l’expression.
lexical_decisions:
- source_word: עֻפְּלָה
  choice: gonflé d’orgueil
  rationale: Le terme décrit une élévation ou un enflement intérieur; cette formulation française naturelle conserve sa connotation négative sans préciser davantage que l’hébreu la nature de l’arrogance.
- source_word: נַפְשׁוֹ
  choice: son âme
  rationale: Rend explicitement le terme hébreu désignant ici l’être intérieur, tout en maintenant le contraste avec la droiture.
- source_word: בֶּאֱמוּנָתוֹ
  choice: par sa fidélité
  rationale: אֱמוּנָה exprime la fermeté, la fiabilité ou la fidélité. « Fidélité » convient au contexte de persévérance du juste et laisse la note signaler l’autre traduction traditionnelle possible.
- source_word: יִחְיֶה
  choice: vivra
  rationale: Le futur français traduit naturellement l’inaccompli hébreu dans cet énoncé à portée générale et prospective.
theological_decisions:
- issue: Sens de אֱמוּנָה et rapport entre foi et fidélité
  choice: fidélité
  alternative: foi
  rationale: Le champ sémantique hébreu met fortement en avant la constance et la fiabilité, mais « foi » demeure possible et devient importante dans les citations néotestamentaires. La note préserve cette tension sans faire dépendre la traduction d’une lecture confessionnelle.
- issue: Référent du suffixe dans « sa fidélité »
  choice: Le suffixe est laissé tel quel et se rapporte naturellement au juste dans la lecture suivie
  alternative: La fidélité de Dieu
  rationale: La syntaxe immédiate favorise la fidélité du juste; le texte hébreu ne nomme toutefois pas Dieu dans cette expression. La traduction ne remplace donc pas le pronom par une interprétation explicite.
translation_notes:
  register: Français international moderne, sobre et digne. « Le voici » rend l’appel à l’attention de הִנֵּה de façon idiomatique; la structure antithétique et l’image de l’âme non droite sont conservées.
