review_pass:
  verdict: revise
  source_fidelity: La première proposition du brouillon attribue directement l’état de gonflement à la personne (« Le voici, gonflé »), alors que le texte hébreu qualifie plus immédiatement « son âme » (נַפְשׁוֹ). La révision rétablit ce sujet tout en conservant l’image d’un gonflement intérieur. « Par sa fidélité » rend bien בֶּאֱמוּנָתוֹ; la note maintient à juste titre l’éventail sémantique sans trancher confessionnellement.
  naturalness: « Son âme est gonflée d’orgueil » est idiomatique dans un registre biblique moderne et plus cohérent que la dissociation entre « il est gonflé » et « son âme ». La reprise pronominale « elle n’est pas droite en lui » rend la syntaxe plus lisible tout en gardant la formulation imagée du texte.
  terminology: « Le juste », « vivra » et « fidélité » sont appropriés. « Gonflée d’orgueil » explicite naturellement la valeur négative de עֻפְּלָה sans introduire une interprétation doctrinale. La note sur « foi », « fermeté » et « fidélité » est utile et correctement ancrée.
  issues:
