source:
  edition: WLC
  text: וַ/יַּעֲנֵ֤/נִי יְהוָה֙ וַ/יֹּ֔אמֶר כְּת֣וֹב חָז֔וֹן וּ/בָאֵ֖ר עַל הַ/לֻּח֑וֹת לְמַ֥עַן יָר֖וּץ ק֥וֹרֵא בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/002.yaml
  text: 'Then Yahweh answered me and said: “Write the vision; make it plain on tablets[a], so that one who reads it may run.”'
translation:
  language: fr
  text: 'Alors Yahweh me répondit : « Écris la vision et rends-la claire sur des tablettes, afin que celui qui la lit puisse courir[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin que celui qui la lit puisse courir avec elle », ou « afin qu’on puisse la lire rapidement, en courant ». L’expression hébraïque est concise et admet plusieurs interprétations plausibles.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲנֵנִי
  choice: me répondit
  rationale: Le verbe ענה signifie naturellement « répondre » dans ce contexte; le suffixe de première personne est explicitement rendu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: וַיֹּאמֶר
  choice: et dit
  rationale: Cette formulation conserve la succession narrative hébraïque sans alourdir la phrase.
- source_word: כְּתוֹב חָזוֹן
  choice: Écris la vision
  rationale: כתב est un impératif direct, et חזון désigne ici la vision prophétique précise reçue par Habacuc.
- source_word: וּבָאֵר
  choice: grave-la clairement
  rationale: Le piel de באר demande de rendre le contenu clair ou distinct. Avec des tablettes comme support, « grave-la clairement » exprime naturellement une inscription nettement lisible sans ajouter la matière des tablettes.
- source_word: עַל הַלֻּחוֹת
  choice: sur des tablettes
  rationale: לֻחוֹת désigne des tablettes servant de support à l'écriture; le français indéfini est naturel ici, et le matériau n'est pas précisé dans l'hébreu.
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but ou le résultat; « afin que » convient au registre biblique moderne et digne.
- source_word: יָרוּץ קוֹרֵא בוֹ
  choice: que celui qui la lit puisse courir
  rationale: Cette traduction prend le lecteur comme sujet de « courir », suit l'ordre conceptuel de l'hébreu et maintient son image vive sans fournir un complément absent.
theological_decisions:
- issue: Interprétation de לְמַעַן יָרוּץ קוֹרֵא בוֹ
  choice: afin que celui qui la lit puisse courir
  alternative: afin que celui qui la lit puisse courir avec elle; ou afin qu'on puisse la lire rapidement, même en courant
  rationale: La construction hébraïque est concise et réellement ambiguë. Le texte principal retient la lecture syntaxiquement directe où le lecteur est le sujet de « courir », tandis que la note conserve les autres sens plausibles sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination « répondit et dit » conserve la forme hébraïque. Le marqueur [a] est placé après « tablettes », comme dans la couche anglaise de consultation, tout en portant sur l’ambiguïté de la proposition finale.
