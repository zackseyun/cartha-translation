source:
  edition: WLC
  text: ה֗וֹי בֹּצֵ֛עַ בֶּ֥צַע רָ֖ע לְ/בֵית֑/וֹ לָ/שׂ֤וּם בַּ/מָּרוֹם֙ קִנּ֔/וֹ לְ/הִנָּצֵ֖ל מִ/כַּף רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/009.yaml
  text: Woe to him who gains evil profit for his house, to set his nest on high, to escape from the grasp of harm.
translation:
  language: fr
  text: Malheur à celui qui amasse pour sa maison un gain malhonnête, afin de placer son nid bien haut et d’échapper à l’emprise du malheur !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּצֵעַ בֶּצַע רָע
  choice: amasse […] un gain malhonnête
  rationale: L’expression associe le fait d’acquérir avidement un profit à sa qualification comme mauvais. « Gain malhonnête » exprime naturellement en français sa nature injuste sans préciser indûment le moyen employé.
- source_word: לְבֵיתוֹ
  choice: pour sa maison
  rationale: « Maison » conserve l’ambivalence de בַּיִת, qui peut désigner le foyer, la maisonnée ou la dynastie.
- source_word: לָשׂוּם בַּמָּרוֹם קִנּוֹ
  choice: afin de placer son nid bien haut
  rationale: La métaphore du nid élevé est conservée; « bien haut » rend l’idée locative de בַּמָּרוֹם dans un français naturel.
- source_word: מִכַּף רָע
  choice: à l’emprise du malheur
  rationale: כַּף signifie littéralement « paume/main » et, dans ce contexte, évoque le pouvoir ou l’emprise. רָע peut désigner le mal, le tort ou le malheur; « malheur » convient ici au danger dont le personnage cherche à se mettre à l’abri.
theological_decisions:
- issue: Portée de « sa maison »
  choice: Maintenir « maison » sans l’expliciter
  alternative: « famille » ou « dynastie »
  rationale: Le texte peut viser aussi bien le foyer que la lignée ou la puissance familiale; une explicitation réduirait cette polysémie.
- issue: Sens de רָע dans la proposition finale
  choice: « malheur »
  alternative: « mal », « danger » ou « désastre »
  rationale: Le contexte décrit une tentative d’échapper à une menace. « Malheur » garde le lien lexical avec le mal tout en évitant de limiter le terme à une catastrophe déterminée.
translation_notes:
  register: Français moderne, clair et solennel. La répétition volontaire de « maison » et de la métaphore du « nid » conserve l’image prophétique; la phrase reste compacte et accusatrice.
