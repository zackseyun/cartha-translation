    « Malheur à celui qui amasse ce qui ne lui appartient pas — jusqu’à quand ? — et qui se charge de biens pris en gage[a] ! »'
  rationale: La révision clarifie le parallélisme entre le taunt et la formulation énigmatique, en gardant le ton satirique de l’oracle. Elle conserve le choix contextuel « biens pris en gage » pour עַבְטִיט et maintient en note l’alternative traditionnelle sans lui ajouter d’élément interprétatif.
