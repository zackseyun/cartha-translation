source:
  edition: WLC
  text: הֲ/לוֹא אֵ֣לֶּה כֻלָּ֗/ם עָלָי/ו֙ מָשָׁ֣ל יִשָּׂ֔אוּ וּ/מְלִיצָ֖ה חִיד֣וֹת ל֑/וֹ וְ/יֹאמַ֗ר ה֚וֹי הַ/מַּרְבֶּ֣ה לֹּא ל֔/וֹ עַד מָתַ֕י וּ/מַכְבִּ֥יד עָלָ֖י/ו עַבְטִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/006.yaml
  text: Will not all of these take up a taunt against him[a], with mockery and riddles about him, and say, “Woe to him who heaps up what is not his—how long?—and loads himself with pledged goods!”
translation:
  language: fr
  text: 'Tous ceux-là n’entonneront-ils pas contre lui une parole moqueuse, une satire en énigmes à son sujet ? Ils diront :


    « Malheur à celui qui amasse ce qui ne lui appartient pas — jusqu’à quand ? — et qui se charge de biens pris en gage[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’argile épaisse ». Le terme hébreu est rare et peut jouer à la fois sur des biens pris en gage pour dette et sur une masse pesante qui accable celui qui l’accumule.
    reason: Alternative lexicale pour un terme hébreu rare, avec possible jeu de mots.
lexical_decisions:
- source_word: מָשָׁל
  choice: parole moqueuse
  rationale: Dans ce contexte de jugement prophétique, le mot désigne une formule proverbiale tournée en dérision contre l’oppresseur, plutôt qu’un simple proverbe de sagesse.
- source_word: יִשָּׂאוּ
  choice: lanceront
  rationale: Avec מָשָׁל, le verbe signifie ici prononcer ou entonner une formule contre quelqu’un. « Lancer une parole » rend naturellement en français son mouvement accusateur.
- source_word: מְלִיצָה חִידוֹת
  choice: des railleries énigmatiques
  rationale: Les deux termes évoquent ensemble un discours railleur formulé en paroles obscures, incisives ou à double sens. Cette expression conserve à la fois la dérision et le caractère énigmatique.
- source_word: הוֹי
  choice: Malheur à
  rationale: Formule française consacrée qui garde la double valeur de lamentation et de dénonciation propre aux oracles prophétiques.
- source_word: הַמַּרְבֶּה לֹּא לוֹ
  choice: celui qui amasse ce qui ne lui appartient pas
  rationale: « Amasse » exprime l’accumulation avide, tandis que la proposition relative explicite naturellement en français l’idée d’un bien appartenant à autrui.
- source_word: עַד מָתַי
  choice: jusqu’à quand ?
  rationale: La question brusque interrompt la dénonciation et conserve la force de protestation de l’hébreu.
- source_word: וּמַכְבִּיד עָלָיו
  choice: qui se charge
  rationale: Cette formulation préserve l’image d’un homme qui fait peser sur lui-même le poids de ce qu’il accumule.
- source_word: עַבְטִיט
  choice: biens pris en gage
  rationale: Le terme rare est compris dans son contexte économique comme désignant des gages ou des biens saisis en garantie. La formulation rend cette idée intelligible sans éliminer l’autre analyse lexicale possible.
theological_decisions:
- issue: Sens du terme rare עַבְטִיט
  choice: 'image économique : « biens pris en gage »'
  alternative: « épaisse couche d’argile » ou « boue épaisse »
  rationale: Le contexte condamne l’enrichissement prédateur et les exactions de l’oppresseur ; le sens économique s’y intègre donc le mieux. L’analyse traditionnelle évoquant l’argile demeure possible et peut produire un jeu de mots sur le poids de l’accumulation, d’où son maintien en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme interrogatif et l’incise « jusqu’à quand ? » conservent la vigueur de la satire prophétique. « Parole moqueuse » et « railleries énigmatiques » évitent un registre trop technique tout en maintenant le parallélisme et l’ambiguïté du texte.
