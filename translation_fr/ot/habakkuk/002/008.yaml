source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה שַׁלּ֨וֹתָ֙ גּוֹיִ֣ם רַבִּ֔ים יְשָׁלּ֖וּ/ךָ כָּל יֶ֣תֶר עַמִּ֑ים מִ/דְּמֵ֤י אָדָם֙ וַ/חֲמַס אֶ֔רֶץ קִרְיָ֖ה וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/008.yaml
  text: Because you have plundered many nations[a], all the remnant of the peoples will plunder you—because of human blood and violence done to the land, to the city, and to all who dwell in it.
translation:
  language: fr
  text: Parce que tu as pillé de nombreuses nations, tout le reste des peuples te pillera, à cause du sang humain versé[a] et de la violence faite au pays, à la ville et à tous ceux qui y habitent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à cause du sang de l’être humain » ; le pluriel hébreu est idiomatique et évoque le sang répandu, c’est-à-dire les meurtres commis.'
    reason: La forme plurielle hébraïque דְּמֵי est idiomatique et peut être rendue par « sang versé » ou « meurtres ».
lexical_decisions:
- source_word: שַׁלּוֹתָ / יְשָׁלּוּךָ
  choice: tu as pillé / te pillera
  rationale: '« Piller » exprime clairement la prise violente de butin et préserve le retournement lexical : celui qui a pillé sera pillé.'
- source_word: גּוֹיִם רַבִּים
  choice: de nombreuses nations
  rationale: Le terme désigne ici des nations dans le cadre politique et impérial de l’oracle.
- source_word: כָּל יֶתֶר עַמִּים
  choice: tout le reste des peuples
  rationale: יֶתֶר désigne ce qui reste. « Le reste » conserve cette idée sans donner nécessairement au mot le sens théologique plus marqué de « reste fidèle »; « peuples » reflète le passage de גּוֹיִם à עַמִּים.
- source_word: מִדְּמֵי אָדָם
  choice: à cause du sang humain versé
  rationale: La préposition est causale. Le pluriel דְּמֵי évoque le sang répandu ou le meurtre; l’ajout de « versé » rend cette valeur idiomatiquement en français, tandis que « humain » traduit le sens collectif de אָדָם.
- source_word: וַחֲמַס
  choice: et de la violence faite à
  rationale: חָמָס désigne la violence ou l’injustice brutale. La formulation explicite naturellement en français le rapport elliptique avec les objets qui suivent.
- source_word: אֶרֶץ
  choice: le pays
  rationale: Dans ce contexte de ravages impériaux, « pays » désigne naturellement le territoire touché, sans élargir le sens à la terre entière.
- source_word: קִרְיָה
  choice: la ville
  rationale: Traduction française courante de la cité ou agglomération visée.
- source_word: וְכָל יֹשְׁבֵי בָהּ
  choice: et à tous ceux qui y habitent
  rationale: Cette formulation naturelle conserve la force verbale du participe « ceux qui habitent » et le référent pronominal potentiellement ambigu.
theological_decisions:
- issue: Valeur collective de אָדָם dans דְּמֵי אָדָם
  choice: sang humain versé
  alternative: sang de l’homme
  rationale: אָדָם est générique et vise les êtres humains, non les hommes de sexe masculin. « Sang humain » le rend clairement et naturellement en français sans introduire de lecture confessionnelle.
- issue: Référent de « en elle » dans וְכָל יֹשְׁבֵי בָהּ
  choice: tous ceux qui y habitent
  alternative: tous ses habitants
  rationale: Le pronom hébreu féminin peut grammaticalement renvoyer au pays ou à la ville. « Y » maintient cette souplesse au lieu de fixer silencieusement le référent.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « piller » conserve l’effet de rétribution du texte hébreu. La ponctuation suit le mouvement causal du verset sans résoudre l’ambiguïté du dernier pronom.
