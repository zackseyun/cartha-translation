source:
  edition: WLC
  text: הֲ/ל֣וֹא פֶ֗תַע יָק֨וּמוּ֙ נֹשְׁכֶ֔י/ךָ וְ/יִקְצ֖וּ מְזַעְזְעֶ֑י/ךָ וְ/הָיִ֥יתָ לִ/מְשִׁסּ֖וֹת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/007.yaml
  text: Will not your creditors suddenly rise[a], and those who make you tremble awake? Then you will become plunder for them.
translation:
  language: fr
  text: Tes créanciers ne se lèveront-ils pas soudain[a] ? Ceux qui te font trembler ne se réveilleront-ils pas ? Alors tu deviendras leur butin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « ceux qui te mordent ». L’expression peut évoquer à la fois des assaillants qui mordent et des créanciers qui exigent un paiement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: ne… pas ?
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative, tout en s’accordant avec la séquence verbale au futur.
- source_word: פֶתַע
  choice: soudain
  rationale: Rend de façon concise et naturelle l’idée d’une irruption brusque.
- source_word: יָקוּמוּ
  choice: se lèveront
  rationale: Conserve le sens courant de קום et suggère ici le mouvement hostile contre l’oppresseur.
- source_word: נֹשְׁכֶיךָ
  choice: tes créanciers
  rationale: Le participe issu de נשׁך signifie littéralement « ceux qui mordent », mais peut évoquer ceux qui exigent un paiement ou un intérêt. « Créanciers » exprime clairement le renversement économique du contexte, tandis que l’image de la morsure est signalée en note.
- source_word: וְיִקְצוּ
  choice: ne se réveilleront-ils pas
  rationale: Rend probablement le verbe יקץ, « se réveiller », et maintient le parallélisme poétique avec « se lèveront ».
- source_word: מְזַעְזְעֶיךָ
  choice: ceux qui te font trembler
  rationale: Préserve la force causative et l’image vive d’agitation ou de terreur sans préciser excessivement l’identité des assaillants.
- source_word: וְהָיִיתָ
  choice: Alors tu deviendras
  rationale: « Alors » explicite naturellement la conséquence, et « deviendras » rend bien le passage à une nouvelle condition.
- source_word: לִמְשִׁסּוֹת
  choice: butin
  rationale: Désigne ce qui est saisi comme dépouille. « Butin » est idiomatique en français et convient au thème du renversement.
- source_word: לָמוֹ
  choice: leur
  rationale: Le pronom renvoie aux assaillants et s’intègre naturellement à l’expression « leur butin ».
