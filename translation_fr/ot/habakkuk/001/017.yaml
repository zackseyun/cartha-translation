  text: הַ֥/עַל כֵּ֖ן יָרִ֣יק חֶרְמ֑/וֹ וְ/תָמִ֛יד לַ/הֲרֹ֥ג גּוֹיִ֖ם לֹ֥א יַחְמֽוֹל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/017.yaml
  text: Will he therefore keep emptying his net and continually slaughtering nations without mercy?[a][b]
translation:
  language: fr
  text: Va-t-il donc continuer à vider son filet[a] et à massacrer sans cesse des nations sans pitié[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa senne ». Le mot hébreu désigne un filet de pêche, probablement un grand filet que l’on traîne.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sans les épargner ». Le verbe hébreu peut signifier « épargner » ou « avoir pitié ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל כֵּן
  choice: Va-t-il donc
  rationale: La particule interrogative introduit une question rhétorique, tandis que עַל־כֵּן marque la conséquence; « donc » restitue naturellement ce lien en français.
- source_word: יָרִיק
  choice: continuer à vider
  rationale: Le hiphil de ריק signifie ici « vider ». Dans l’image du pêcheur, l’imparfait évoque une action répétée ou poursuivie; « continuer à » rend cette nuance sans abandonner la métaphore.
- source_word: חֶרְמוֹ
  choice: son filet
  rationale: חֵרֶם désigne ici un engin de pêche, probablement une senne. « Filet » est clair et naturel en français moderne; le terme plus précis est signalé en note.
- source_word: וְתָמִיד
  choice: et … sans cesse
  rationale: תָמִיד exprime la continuité ou la répétition constante. « Sans cesse » souligne le caractère implacable de l’action.
- source_word: לַהֲרֹג
  choice: à massacrer
  rationale: Dans ce contexte de destruction répétée de nations, « massacrer » communique mieux que « tuer » l’ampleur et la brutalité de l’acte.
- source_word: גּוֹיִם
  choice: des nations
  rationale: Le mot désigne ici les peuples ou entités nationales soumis par le conquérant; « nations » convient au contexte politique et militaire.
- source_word: לֹא יַחְמֹל
  choice: sans pitié
  rationale: חמל peut signifier « épargner » ou « avoir pitié ». La tournure adverbiale « sans pitié » est idiomatique et conserve l’idée d’une violence dépourvue de compassion.
theological_decisions:
- issue: Référent du pronom masculin singulier
  choice: Conserver « il » sans expliciter son référent
  alternative: Nommer le conquérant chaldéen
  rationale: Le texte hébreu maintient le pronom et renvoie au personnage décrit dans le contexte; l’expliciter dans le verset ajouterait une interprétation absente de la formulation source.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique et la métaphore de la pêche sont conservées; « continuer à » et « sans cesse » rendent l’aspect répétitif de la violence.
