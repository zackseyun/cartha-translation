id: HAB.1.7
reference: Habakkuk 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָיֹ֥ם וְ/נוֹרָ֖א ה֑וּא מִמֶּ֕/נּוּ מִשְׁפָּט֥/וֹ וּ/שְׂאֵת֖/וֹ יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/007.yaml
  text: It is dreadful and fearsome; its justice and authority[a] come from itself.
translation:
  language: fr
  text: Il est redoutable et terrifiant ; de lui-même viennent son droit et son autorité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son jugement et sa dignité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָיֹם
  choice: redoutable
  rationale: Exprime ce qui inspire l’effroi dans le contexte menaçant des Chaldéens, dans un français naturel et digne.
- source_word: וְנוֹרָא
  choice: terrifiant
  rationale: Renforce אָיֹם et conserve clairement l’idée de terreur suscitée.
- source_word: הוּא
  choice: il est
  rationale: Le pronom masculin singulier reprend le peuple chaldéen, présenté collectivement au singulier.
- source_word: מִמֶּנּוּ
  choice: de lui-même
  rationale: 'La préposition indique la source : ce peuple tire de lui-même ses normes et ses prérogatives.'
- source_word: מִשְׁפָּטוֹ
  choice: son droit
  rationale: מִשְׁפָּט peut désigner le jugement, la justice ou le droit. Ici, « droit » évoque à la fois l’ordre juridique et les décisions que ce peuple impose.
- source_word: וּשְׂאֵתוֹ
  choice: son autorité
  rationale: Dans ce parallélisme politique, le terme désigne vraisemblablement le rang élevé ou l’autorité que ce peuple s’attribue ; « dignité » reste possible.
- source_word: יֵצֵא
  choice: viennent
  rationale: Le singulier hébreu porte sur l’ensemble coordonné ; en français, le pluriel s’accorde naturellement avec « son droit et son autorité » tout en conservant l’idée de provenance.
theological_decisions:
- issue: Nature du pouvoir que le peuple tire de lui-même
  choice: Ne pas préciser si ce droit et cette autorité sont légitimes ; traduire seulement leur origine auto-déterminée.
  alternative: Rendre explicitement l’idée d’usurpation ou d’arbitraire.
  rationale: Le verset affirme que son droit et son élévation viennent de lui-même, mais laisse au contexte le jugement moral sur cette prétention.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. « Il » reprend collectivement le peuple chaldéen. La construction avec antéposition (« de lui-même viennent… ») met en relief la source interne du droit et de l’autorité, comme en hébreu.
