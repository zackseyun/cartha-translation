id: HAB.1.4
reference: Habakkuk 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל כֵּן֙ תָּפ֣וּג תּוֹרָ֔ה וְ/לֹֽא יֵצֵ֥א לָ/נֶ֖צַח מִשְׁפָּ֑ט כִּ֤י רָשָׁע֙ מַכְתִּ֣יר אֶת הַ/צַּדִּ֔יק עַל כֵּ֛ן יֵצֵ֥א מִשְׁפָּ֖ט מְעֻקָּֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/004.yaml
  text: Therefore the law grows numb, and justice never goes forth. For the wicked surrounds the righteous; therefore justice goes forth twisted.
translation:
  language: fr
  text: 'C’est pourquoi la loi perd toute force,

    et la justice ne se fait jamais.


    Car le méchant cerne le juste ;

    c’est pourquoi un jugement déformé est rendu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּפוּג
  choice: perd toute force
  rationale: Le verbe décrit ce qui s’engourdit, s’affaiblit ou devient inopérant. Cette formulation naturelle conserve ici l’idée d’une loi paralysée plutôt que simplement abolie.
- source_word: תּוֹרָה
  choice: la loi
  rationale: Dans ce contexte judiciaire et social, « la loi » rend naturellement l’instruction normative, sans imposer une référence plus étroite.
- source_word: לֹא יֵצֵא לָנֶצַח מִשְׁפָּט
  choice: la justice ne triomphe jamais
  rationale: Littéralement, le droit ou le jugement « ne sort jamais ». En contexte, il ne parvient pas à s’imposer ni à produire son effet ; « ne triomphe jamais » exprime cette défaillance durable en français courant.
- source_word: מַכְתִּיר
  choice: cerne
  rationale: Le sens premier est entourer ou encercler. « Cerne » préserve l’image du méchant qui prend le juste de toutes parts.
- source_word: מִשְׁפָּט מְעֻקָּל
  choice: la justice ressort faussée
  rationale: מְעֻקָּל signifie tordu ou déformé. « Faussée » rend le résultat d’un processus judiciaire perverti, tandis que « ressort » fait écho au verbe יֵצֵא, « sortir ».
theological_decisions:
- issue: Portée de תּוֹרָה
  choice: la loi
  alternative: l’enseignement
  rationale: Le contexte de violence, de procès et de justice favorise « la loi », tout en laissant ouverte la portée exacte de la Torah visée.
- issue: Identité du méchant et du juste
  choice: conserver les désignations générales « le méchant » et « le juste »
  alternative: les identifier à des groupes historiques précis
  rationale: Le verset ne nomme pas explicitement les acteurs ; la traduction préserve cette indétermination.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé en quatre lignes, avec la répétition de « C’est pourquoi ». Aucun marqueur de note n’est requis.
