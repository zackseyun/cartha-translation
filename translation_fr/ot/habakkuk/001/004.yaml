  source_fidelity: 'Révision recommandée : « ne triomphe jamais » interprète le non-aboutissement du droit comme une victoire, alors que le texte dit plus directement que le jugement/la justice ne « sort » jamais. « Ressort faussée » est également moins naturel en français et atténue la construction finale, où un jugement tordu est produit ou rendu.'
  naturalness: Le rythme en quatre lignes et « le méchant cerne le juste » sont naturels et conservent bien l’image du texte. « La justice ne se fait jamais » est idiomatique en français moderne pour l’absence durable de justice, et « un jugement déformé est rendu » est clair dans un cadre judiciaire.
