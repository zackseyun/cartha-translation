  terminology: « Yahweh » respecte le choix éditorial de transcrire le tétragramme. « Mon Saint » rend fidèlement le substantif hébreu possessivé; « Rocher » maintient l’image-titre צוּר. « Désigné » convient mieux à שַׂמְתּוֹ dans le contexte d’une mission confiée, tandis que « établi » rend bien יְסַדְתּוֹ.
