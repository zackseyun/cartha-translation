  text: הֲ/ל֧וֹא אַתָּ֣ה מִ/קֶּ֗דֶם יְהוָ֧ה אֱלֹהַ֛/י קְדֹשִׁ֖/י לֹ֣א נָמ֑וּת יְהוָה֙ לְ/מִשְׁפָּ֣ט שַׂמְתּ֔/וֹ וְ/צ֖וּר לְ/הוֹכִ֥יחַ יְסַדְתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/012.yaml
  text: Are you not from of old, O Yahweh my God, my Holy One? We will not die.[a] O Yahweh, you have appointed him for judgment, and you, O Rock, have established him for reproof.
translation:
  language: fr
  text: N’es-tu pas, Yahweh, mon Dieu, mon Saint, depuis les temps anciens ? Nous ne mourrons pas.[a] Yahweh, tu l’as désigné pour le jugement ; toi, Rocher, tu l’as établi pour corriger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre lecture conservée dans certaines traditions : « Tu ne meurs pas. » Le texte hébreu massorétique porte : « Nous ne mourrons pas. »'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹוא
  choice: N’es-tu pas
  rationale: Conserve la forme de question rhétorique, qui appelle une réponse affirmative.
- source_word: מִקֶּדֶם
  choice: depuis les temps anciens
  rationale: Exprime l’ancienneté primordiale sans rendre explicitement le terme par « de toute éternité », formulation théologiquement plus déterminée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Rend directement le possessif de première personne et l’adresse personnelle.
- source_word: קְדֹשִׁי
  choice: mon Saint
  rationale: Rend l’adjectif substantivé avec suffixe possessif et préserve sa fonction de titre divin.
- source_word: לֹא נָמוּת
  choice: Nous ne mourrons pas
  rationale: Suit la vocalisation et la morphologie du texte massorétique, à la première personne du pluriel.
- source_word: לְמִשְׁפָּט
  choice: pour exercer le jugement
  rationale: Fait ressortir le but judiciaire de l’établissement de l’agent dans un français naturel.
- source_word: שַׂמְתּוֹ
  choice: tu l’as établi
  rationale: Exprime l’affectation intentionnelle de cet agent par Dieu tout en restant proche du sens de « placer, établir ».
- source_word: צוּר
  choice: Rocher
  rationale: Conserve l’image et le titre divins, qui évoquent solidité et stabilité.
- source_word: לְהוֹכִיחַ
  choice: à corriger
  rationale: Préserve la nuance à la fois disciplinaire et judiciaire du verbe sans la réduire à la seule punition.
- source_word: יְסַדְתּוֹ
  choice: tu l’as destiné
  rationale: Dans le parallélisme, exprime l’établissement ferme de l’agent en vue d’une fonction déterminée, sans le maladroit « fondé » appliqué à une personne.
theological_decisions:
- issue: Sujet et sens de לֹא נָמוּת
  choice: Nous ne mourrons pas
  alternative: Tu ne meurs pas
  rationale: Le texte massorétique vocalisé porte la première personne du pluriel. Cette lecture maintient la confiance exprimée au cœur même du jugement. L’autre lecture, attestée dans certaines traditions et mettant en avant l’immortalité divine, est signalée sans remplacer le texte massorétique.
- issue: Portée temporelle de מִקֶּדֶם
  choice: depuis les temps anciens
  alternative: depuis toujours / de toute éternité
  rationale: La formulation choisie garde la profondeur temporelle de l’hébreu sans transformer implicitement l’expression en affirmation métaphysique plus précise.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe conserve l’adresse directe et le parallélisme poétique. « Yahweh » maintient le nom divin ; « mon Saint » et « Rocher » sont conservés comme titres, malgré leur caractère marqué, afin de respecter les images du texte source.
