id: HAB.1.14
reference: Habakkuk 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תַּעֲשֶׂ֥ה אָדָ֖ם כִּ/דְגֵ֣י הַ/יָּ֑ם כְּ/רֶ֖מֶשׂ לֹא מֹשֵׁ֥ל בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/014.yaml
  text: You make man like the fish of the sea[a], like creeping things that have no ruler over them.
translation:
  language: fr
  text: Tu rends l’être humain[a] semblable aux poissons de la mer, aux animaux qui rampent et qui n’ont personne pour les gouverner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’homme ». Le mot hébreu est au singulier, mais il peut désigner collectivement l’humanité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲשֶׂה
  choice: Tu rends
  rationale: Le verbe עשה, suivi ici d’une comparaison, exprime le fait de placer ou de présenter quelqu’un dans un certain état. « Tu rends … semblable » restitue naturellement en français l’accusation directe adressée à Dieu; le waw est laissé implicite, conformément au style français.
- source_word: אָדָם
  choice: l’être humain
  rationale: Le nom est au singulier mais possède ici une valeur collective et représente l’humanité. « L’être humain » conserve le singulier représentatif tout en exprimant clairement la portée générique.
- source_word: כִּדְגֵי הַיָּם
  choice: semblable aux poissons de la mer
  rationale: Cette formulation garde l’image et la construction poétique de la comparaison hébraïque dans un français naturel.
- source_word: כְּרֶמֶשׂ
  choice: aux animaux qui rampent
  rationale: רֶמֶשׂ désigne collectivement des créatures qui se déplacent en rampant. « Animaux qui rampent » est clair, courant et ne précise pas excessivement leur catégorie.
- source_word: לֹא מֹשֵׁל בּוֹ
  choice: qui n’ont personne pour les gouverner
  rationale: מֹשֵׁל désigne celui qui exerce l’autorité. La tournure française exprime cette absence d’autorité sans imposer le titre plus spécifique de « roi »; l’accord pluriel suit naturellement les créatures collectives de la comparaison.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: l’être humain
  alternative: l’homme; les humains; l’humanité
  rationale: Le singulier hébreu représente collectivement l’humanité. « L’être humain » préserve ce singulier représentatif sans restreindre le référent aux hommes de sexe masculin.
- issue: Référent du singulier בּוֹ
  choice: accord pluriel avec les créatures comparées
  alternative: sans personne pour le gouverner, avec référence explicite à l’être humain
  rationale: Le suffixe hébreu est singulier, en accord avec le collectif רֶמֶשׂ ou avec אָדָם, et laisse une certaine souplesse de rattachement. Le pluriel français est idiomatique avec « poissons » et « animaux » et maintient l’image d’êtres dépourvus d’autorité qui les dirige.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve l’adresse directe à Dieu et le ton accusateur de la plainte prophétique, tout en évitant des termes zoologiques ou politiques trop techniques.
