  yaml_path: translation/ot/habakkuk/001/009.yaml
  text: All of them come for violence[a]; the set of their faces is forward[c][b], and they gather captives like sand.
translation:
  language: fr
  text: Ils viennent tous pour la violence ; leurs visages sont tournés vers l’avant[a], et ils rassemblent[b] des captifs[c] comme le sable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « l’orientation de leurs visages est vers l’est ». L’expression hébraïque est difficile : קָדִימָה peut signifier « vers l’avant » ou « vers l’est », et מְגַמַּת peut désigner l’orientation, le but ou l’intention.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici un verbe au singulier, considérant la force d’invasion comme une unité collective.
    reason: lexical_alternative
  - marker: c
    text: Ou « ils rassemblent la captivité comme le sable », si שֶׁבִי est compris au sens abstrait plutôt que comme désignant les captifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלֹּה
  choice: Ils… tous
  rationale: Le suffixe masculin singulier renvoie collectivement à l’ensemble de la force d’invasion. Le pluriel français rend naturellement ce sens collectif.
- source_word: לְחָמָס
  choice: pour la violence
  rationale: חָמָס désigne ici la violence brutale et le tort imposé par la force ; לְ exprime le but ou l’orientation de leur venue.
- source_word: יָבוֹא
  choice: viennent
  rationale: Le verbe בוא signifie directement « venir ». Le pluriel s’accorde en français avec la formulation collective « ils… tous ».
- source_word: מְגַמַּת פְּנֵיהֶם
  choice: leur visage est résolument tourné
  rationale: L’expression rare décrit l’orientation fixe ou l’élan déterminé de leurs visages. Cette formulation française conserve l’image corporelle tout en exprimant la détermination impliquée.
- source_word: קָדִימָה
  choice: vers l’avant
  rationale: Dans ce contexte d’avancée militaire, le terme peut indiquer la direction en avant, tout en gardant comme possibilité lexicale « vers l’est », signalée en note.
- source_word: וַיֶּאֱסֹף
  choice: ils amassent
  rationale: Le verbe hébreu est au singulier et envisage l’armée comme une unité collective. Le pluriel est toutefois requis par la construction française du verset ; une note conserve le trait grammatical de l’hébreu.
- source_word: כַּחוֹל
  choice: comme le sable
  rationale: La comparaison évoque une quantité innombrable ; « comme le sable » est à la fois fidèle et idiomatique.
- source_word: שֶׁבִי
  choice: des captifs
  rationale: Le nom peut désigner soit les personnes emmenées, soit abstraitement la captivité. Avec « amasser », le sens personnel est naturel, sans effacer l’autre possibilité, donnée en note.
