source:
  edition: WLC
  text: עַד אָ֧נָה יְהוָ֛ה שִׁוַּ֖עְתִּי וְ/לֹ֣א תִשְׁמָ֑ע אֶזְעַ֥ק אֵלֶ֛י/ךָ חָמָ֖ס וְ/לֹ֥א תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/002.yaml
  text: How long, O LORD, have I cried for help and you do not hear? I cry out to you, “Violence!” and you do not save.
translation:
  language: fr
  text: 'Jusqu’à quand, Éternel, appellerai-je au secours sans que tu écoutes ? Je crie vers toi : « Violence ! » mais tu ne sauves pas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Éternel
  rationale: Rend le tétragramme par l’appellation française traditionnelle, distincte du titre « Seigneur », dans un registre digne et naturel.
- source_word: שִׁוַּעְתִּי
  choice: appellerai-je au secours
  rationale: Le verbe exprime un appel pressant à l’aide. Après עַד־אָנָה, le français emploie naturellement le futur pour une plainte qui dure et reste sans réponse.
- source_word: תִשְׁמָע
  choice: tu écoutes
  rationale: Dans ce contexte de prière, « écouter » préserve mieux que « entendre » l’idée d’attention et de réponse attendue, sans affirmer que Dieu serait incapable de percevoir le cri.
- source_word: חָמָס
  choice: Violence !
  rationale: Le nom désigne ici la violence ou l’injustice violente et fonctionne comme le contenu du cri d’alarme.
- source_word: תוֹשִׁיעַ
  choice: tu ne sauves pas
  rationale: Traduction directe qui conserve la tension théologique de l’accusation adressée à Dieu.
theological_decisions:
- issue: La plainte semble reprocher à Dieu de ne pas écouter ni sauver.
  choice: Conserver l’adresse directe et les négations sans les atténuer.
  alternative: Expliciter « tu ne réponds pas » ou ajouter une qualification protégeant l’impassibilité divine.
  rationale: Le texte met intentionnellement dans la bouche du prophète une plainte audacieuse; la traduction ne doit ni la résoudre ni la corriger.
- issue: Valeur temporelle de שִׁוַּעְתִּי après « jusqu’à quand ».
  choice: « appellerai-je »
  alternative: « ai-je appelé » / « faut-il que j’appelle »
  rationale: La forme hébraïque présente un cri déjà prolongé, tandis que l’expression idiomatique française « jusqu’à quand… ? » envisage sa poursuite. Le futur rend naturellement cette plainte continue, même si le passé composé est grammaticalement possible.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le rythme interrogatif et l’exclamation isolée « Violence ! » préservent l’intensité de la lamentation. Aucun marqueur de note n’est nécessaire.
