base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/008.yaml
  text: His horses are swifter than leopards and fiercer than wolves at dusk[a]. His horsemen spread out; his horsemen come from far away. They fly like an eagle hurrying to devour.
translation:
  language: fr
  text: Ses chevaux sont plus rapides que les léopards et plus féroces que les loups du soir. Ses cavaliers se déploient ; ses cavaliers viennent de loin. Ils volent comme un aigle[a] qui se hâte de dévorer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un vautour ». Le mot hébreu נֶשֶׁר peut désigner plus largement un grand rapace ou un oiseau charognard, et pas nécessairement l’aigle au sens zoologique moderne.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלּוּ מִנְּמֵרִים
  choice: plus rapides que les léopards
  rationale: Le verbe קלל exprime ici la rapidité ou la légèreté. Dans cette comparaison animale, « plus rapides » restitue naturellement le sens, tandis que נמרים désigne couramment des léopards ou panthères.
- source_word: וְחַדּוּ מִזְּאֵבֵי עֶרֶב
  choice: plus féroces que les loups du crépuscule
  rationale: Le verbe exprime littéralement l’idée d’être plus aigu ou acéré, employée ici pour la violence prédatrice. « Féroces » convient au contexte, et « loups du crépuscule » conserve l’image temporelle de l’hébreu.
- source_word: וּפָשׁוּ
  choice: se déploient
  rationale: Le verbe décrit vraisemblablement des cavaliers qui se répandent ou s’étendent sur le terrain. « Se déploient » convient au mouvement militaire sans préciser abusivement sa forme exacte.
- source_word: פָּרָשָׁיו
  choice: ses cavaliers
  rationale: פָּרָשׁ désigne un cavalier ou un membre de la cavalerie. Le nom est répété dans l’hébreu, répétition conservée dans le texte français.
- source_word: מֵרָחוֹק יָבֹאוּ
  choice: viennent de loin
  rationale: Traduction directe et naturelle de l’indication spatiale.
- source_word: יָעֻפוּ
  choice: Ils volent
  rationale: Le verbe signifie voler. La traduction garde la comparaison directe, sans transformer le mouvement en piqué ou en attaque, nuances que le contexte peut suggérer sans les imposer.
- source_word: כְּנֶשֶׁר
  choice: comme un aigle
  rationale: נֶשֶׁר peut désigner l’aigle ou, plus largement, un grand rapace, notamment un vautour. « Aigle » reste une identification traditionnelle et plausible ; l’autre possibilité est signalée en note.
- source_word: חָשׁ לֶאֱכוֹל
  choice: qui se hâte de dévorer
  rationale: La construction exprime l’empressement à manger. « Se hâte de dévorer » rend l’urgence et la violence de l’image prédatrice dans un français digne et naturel.
theological_decisions: []
translation_notes:
