source:
  edition: WLC
  text: וְ/הוּא֙ בַּ/מְּלָכִ֣ים יִתְקַלָּ֔ס וְ/רֹזְנִ֖ים מִשְׂחָ֣ק ל֑/וֹ ה֚וּא לְ/כָל מִבְצָ֣ר יִשְׂחָ֔ק וַ/יִּצְבֹּ֥ר עָפָ֖ר וַֽ/יִּלְכְּדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/010.yaml
  text: He mocks kings[a], and rulers are a laughingstock to him. He laughs at every fortress; he heaps up earth and captures it.
translation:
  language: fr
  text: Il se moque des rois, et les dirigeants sont pour lui un objet de risée. Il rit de toute forteresse ; il amoncelle de la terre[a] et la capture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il amoncelle de la poussière ou de la terre » ; l’image est celle d’une rampe de siège en terre élevée pour prendre un lieu fortifié.'
    reason: cultural_note
lexical_decisions:
- source_word: יִתְקַלָּס
  choice: se moque
  rationale: Le hitpael exprime ici une raillerie méprisante. « Se moque » est naturel en français moderne et correspond au parallèle avec l’objet de risée.
- source_word: רֹזְנִים
  choice: les dirigeants
  rationale: Le terme désigne des hauts responsables ou des détenteurs du pouvoir. « Dirigeants » reste large, clair et actuel.
- source_word: מִשְׂחָק לוֹ
  choice: sont pour lui un objet de risée
  rationale: Le nom désigne ce qui provoque le rire ou la dérision. Cette formulation conserve la force méprisante sans registre familier.
- source_word: מִבְצָר
  choice: forteresse
  rationale: Le mot désigne un lieu fortifié. « Forteresse » maintient nettement le contexte militaire.
- source_word: יִשְׂחָק
  choice: rit de
  rationale: Le qal de שׂחק évoque ici un rire de dérision. La traduction conserve l’image du texte hébreu.
- source_word: וַיִּצְבֹּר עָפָר
  choice: il amoncelle de la terre
  rationale: L’expression évoque l’édification d’une rampe de siège. La traduction garde l’image littérale et en explique le contexte en note.
- source_word: וַיִּלְכְּדָהּ
  choice: s’en empare
  rationale: Le verbe signifie prendre ou capturer. Le pronom « en » renvoie naturellement en français à la forteresse déjà mentionnée.
- source_word: הוּא
  choice: Il
  rationale: Le pronom renvoie à l’envahisseur collectif singulier décrit dans le contexte ; le masculin singulier préserve la présentation personnifiée de l’hébreu.
