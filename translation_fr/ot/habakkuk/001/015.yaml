- from: Il les fait tous remonter avec un hameçon[a] ; il le traîne dans son filet et le recueille dans sa senne[b]. C’est pourquoi il se réjouit et exulte.
  to: Il les remonte tous à l’hameçon[a] ; il le tire avec son filet et le recueille dans sa senne[b]. C’est pourquoi il se réjouit et exulte.
  rationale: La révision corrige la valeur instrumentale de « avec son filet » tout en maintenant, dans la proposition suivante, « dans sa senne », qui exprime naturellement en français le rassemblement de la prise dans le filet enveloppant. Elle conserve le changement collectif-singulier attesté par l’hébreu et les deux ancres de notes.
