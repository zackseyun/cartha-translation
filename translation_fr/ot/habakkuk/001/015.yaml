  text: כֻּלֹּ/ה֙ בְּ/חַכָּ֣ה הֵֽעֲלָ֔ה יְגֹרֵ֣/הוּ בְ/חֶרְמ֔/וֹ וְ/יַאַסְפֵ֖/הוּ בְּ/מִכְמַרְתּ֑/וֹ עַל כֵּ֖ן יִשְׂמַ֥ח וְ/יָגִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/015.yaml
  text: He brings all of them up with a hook[a]; he drags him away with his net, and gathers him in with his dragnet[b]. Therefore he rejoices and exults.
translation:
  language: fr
  text: Il les remonte tous à l’hameçon[a] ; il le tire avec son filet et le recueille dans sa senne[b]. C’est pourquoi il se réjouit et exulte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu passe ici d’une désignation collective de toutes les prises à des pronoms au singulier dans les deux propositions suivantes.
    reason: ambiguïté_grammaticale
  - marker: b
    text: L’hébreu emploie deux mots différents pour les filets de pêche, rendus ici par « filet » et « senne ».
    reason: alternative_lexicale
lexical_decisions:
- source_word: כֻּלֹּה
  choice: les… tous
  rationale: Cette expression à forme singulière a ici un sens collectif et désigne l’ensemble des êtres capturés. Le pluriel français rend naturellement ce sens dans le contexte.
- source_word: בְּחַכָּה
  choice: avec un hameçon
  rationale: חַכָּה désigne un crochet servant à prendre des poissons ; « hameçon » exprime clairement et naturellement l’image de la pêche.
- source_word: הֵעֲלָה
  choice: fait… remonter
  rationale: La forme causative de עלה décrit ici le fait de faire sortir la prise de l’eau ; « faire remonter » conserve cette nuance.
- source_word: יְגֹרֵהוּ
  choice: il le traîne
  rationale: Le verbe évoque l’action de tirer ou de traîner la prise. Le pronom singulier respecte le suffixe masculin singulier de l’hébreu et son passage de l’ensemble collectif à une prise représentative.
- source_word: בְחֶרְמוֹ
  choice: dans son filet
  rationale: חֵרֶם désigne ici un filet de pêche. « Filet » est le terme français courant et permet de le distinguer du terme suivant.
- source_word: וְיַאַסְפֵהוּ
  choice: et le recueille
  rationale: אָסַף signifie rassembler ou recueillir. Le singulier maintient la forme du suffixe hébreu, tandis que « recueillir » convient à la prise rassemblée dans le filet.
- source_word: בְּמִכְמַרְתּוֹ
  choice: dans sa senne
  rationale: מִכְמֶרֶת désigne un filet de pêche, probablement un filet encerclant ou traînant. « Senne » préserve la distinction avec חֵרֶם sans alourdir le vers.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: La locution introduit la conséquence du succès de la capture et établit clairement le lien logique.
- source_word: יִשְׂמַח וְיָגִיל
  choice: il se réjouit et exulte
  rationale: Les deux verbes expriment la joie, le second avec une intensité jubilante. Deux verbes distincts préservent la progression poétique.
theological_decisions:
- issue: Référent de l’image de la pêche
  choice: Conserver l’image du conquérant qui capture collectivement des êtres humains comme des poissons, sans l’expliciter dans le corps du verset.
  alternative: Lire la scène comme une description littérale de la pêche.
  rationale: Le contexte immédiat d’Habacuc 1.14-17 applique cette image à la violence impériale. La traduction conserve la métaphore et sa force sans introduire une interprétation confessionnelle.
- issue: Passage d’un objet collectif au singulier
  choice: Employer d’abord « les… tous », puis les pronoms singuliers « le ».
  alternative: Uniformiser tous les pronoms au pluriel pour obtenir un français plus fluide.
  rationale: Les suffixes de יְגֹרֵהוּ et וְיַאַסְפֵהוּ sont explicitement au masculin singulier. Garder ce changement préserve une particularité réelle et potentiellement signifiante du texte hébreu.
translation_notes:
  register: Français international moderne, poétique et digne. « Senne » est un terme précis mais accessible dans ce contexte ; la légère rupture entre « les… tous » et « le » est volontaire et signalée en note afin de préserver le mouvement grammatical de l’hébreu.
