  source_fidelity: Le texte conserve correctement l’image de pêche, le collectif initial (« les… tous ») suivi des suffixes singuliers hébreux, ainsi que la conséquence finale. Toutefois, בְחֶרְמוֹ est instrumental (« avec son filet »), non locatif (« dans son filet »).
  naturalness: « Il les remonte tous à l’hameçon » est plus idiomatique et plus concis que « Il les fait tous remonter avec un hameçon ». « Il le tire avec son filet » rend naturellement l’action sans transformer le filet en simple lieu.
  terminology: « Hameçon », « filet » et « senne » conviennent au français international moderne. La distinction entre les deux termes hébreux pour les filets est conservée. « Se réjouit et exulte » préserve bien l’intensification poétique.
