  text: רְא֤וּ בַ/גּוֹיִם֙ וְֽ/הַבִּ֔יטוּ וְ/הִֽתַּמְּה֖וּ תְּמָ֑הוּ כִּי פֹ֨עַל֙ פֹּעֵ֣ל בִּֽ/ימֵי/כֶ֔ם לֹ֥א תַאֲמִ֖ינוּ כִּ֥י יְסֻפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/005.yaml
  text: Look among the nations and see[a]; be astonished, be astounded[b]. For I am doing a work in your days that you would not believe if it were told.
translation:
  language: fr
  text: Regardez parmi les nations et observez[a] ; soyez stupéfaits, frappés de stupeur. Car je vais accomplir, de votre vivant, une œuvre que vous ne croiriez pas si on vous la racontait[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Regardez les nations et voyez. »'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « Car une œuvre s’accomplit de votre vivant, que vous ne croiriez pas si elle vous était racontée. »'
    reason: alternative_reading
lexical_decisions:
- source_word: רְאוּ בַגּוֹיִם
  choice: Regardez parmi les nations
  rationale: L’impératif pluriel appelle les auditeurs à porter leur regard dans la sphère des nations. « Parmi les nations » conserve le sens spatial probable de la préposition sans réduire גּוֹיִם à une catégorie religieuse.
- source_word: וְהַבִּיטוּ
  choice: et observez
  rationale: הביט exprime un regard attentif. « Observez » distingue naturellement ce verbe du précédent tout en conservant la paire d’impératifs.
- source_word: וְהִתַּמְּהוּ תְּמָהוּ
  choice: soyez stupéfaits, frappés de stupeur
  rationale: Les deux formes apparentées produisent une forte insistance. Cette formulation française garde leur parallélisme et leur intensité sans être artificiellement identique.
- source_word: פֹעַל פֹּעֵל
  choice: je vais accomplir […] une œuvre
  rationale: La construction associant nom et participe insiste sur l’action en cours ou imminente. Le sujet divin à la première personne est fourni par le contexte discursif ; « vais accomplir » convient à l’annonce d’un acte prochain.
- source_word: בִּימֵיכֶם
  choice: de votre vivant
  rationale: Cette expression française naturelle rend l’idée de « dans vos jours », c’est-à-dire pendant la vie des destinataires.
- source_word: לֹא תַאֲמִינוּ כִּי יְסֻפָּר
  choice: que vous ne croiriez pas si on vous la racontait
  rationale: Le conditionnel français exprime naturellement le caractère incroyable de l’œuvre même si elle faisait l’objet d’un récit. Le passif hébreu est rendu par le pronom indéfini « on ».
theological_decisions:
- issue: Sujet implicite de פֹעַל פֹּעֵל
  choice: je vais accomplir […] une œuvre
  alternative: une œuvre s’accomplit
  rationale: L’hébreu n’énonce pas ici de pronom sujet, mais la suite du discours identifie le locuteur comme Dieu. La première personne rend ce cadre sans introduire de précision confessionnelle supplémentaire.
- issue: Valeur temporelle de l’action annoncée
  choice: je vais accomplir
  alternative: j’accomplis
  rationale: Le participe peut présenter l’action comme en cours ou imminente. Dans ce contexte d’annonce, le futur proche français préserve l’imminence sans imposer un futur lointain.
- issue: Intensification par répétition de la racine תמה
  choice: soyez stupéfaits, frappés de stupeur
  alternative: soyez stupéfaits, stupéfaits
  rationale: La formulation retenue conserve l’insistance et l’écho lexical tout en restant digne et idiomatique en français moderne.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le rythme des impératifs et l’intensité de l’étonnement sont préservés ; les deux principales ambiguïtés, portant sur la préposition devant « nations » et sur le sujet de l’œuvre, sont signalées en notes.
