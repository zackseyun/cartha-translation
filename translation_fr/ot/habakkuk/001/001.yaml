source:
  edition: WLC
  text: הַ/מַּשָׂא֙ אֲשֶׁ֣ר חָזָ֔ה חֲבַקּ֖וּק הַ/נָּבִֽיא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/001.yaml
  text: The oracle that Habakkuk the prophet saw:[a]
translation:
  language: fr
  text: 'Oracle[a] que le prophète Habacuc a vu :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « proclamation » ou « fardeau ». L’hébreu massaʾ est employé dans les titres prophétiques pour désigner un message solennel, souvent grave.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשָׂא
  choice: Proclamation
  rationale: Dans un titre prophétique, מַשָּׂא désigne un message solennel reçu de Dieu. « Proclamation » reste naturel en français actuel sans suggérer nécessairement que le message est uniquement un jugement.
- source_word: אֲשֶׁר
  choice: qu’
  rationale: Le pronom relatif relie naturellement le titre à la proposition verbale en français.
- source_word: חָזָה
  choice: a reçue en vision
  rationale: Le verbe signifie littéralement « voir », mais, dans ce contexte prophétique, il désigne une révélation perçue en vision. Cette formulation française explicite l’emploi idiomatique sans préciser davantage le mode de la révélation.
- source_word: חֲבַקּוּק
  choice: Habacuc
  rationale: Forme française traditionnelle et largement reconnue du nom du prophète.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Rend directement le titre et la fonction d’Habacuc.
theological_decisions:
- issue: Sens du titre prophétique מַשָּׂא
  choice: Proclamation
  alternative: Sentence, oracle ou fardeau
  rationale: Le mot présente le contenu comme un message prophétique solennel, sans affirmer à lui seul qu’il s’agit exclusivement d’un jugement ni d’un poids intérieur éprouvé par le prophète.
- issue: Portée de חָזָה
  choice: a reçue en vision
  alternative: a vue
  rationale: Le français « voir une proclamation » serait peu naturel. La formulation retenue conserve le caractère visionnaire de la révélation sans en résoudre davantage les modalités.
translation_notes:
  register: Titre bref, solennel et accessible en français international moderne. Les deux-points marquent sa fonction d’introduction à la prophétie qui suit.
source_grounding:
  english_pob_role: consult_only
