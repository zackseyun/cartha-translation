base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/016.yaml
  text: Therefore he sacrifices to his net and burns incense to his dragnet[a], because by them his portion is rich and his food is plentiful.
translation:
  language: fr
  text: 'C’est pourquoi il offre des sacrifices à son filet

    et brûle de l’encens à sa senne,

    car, grâce à eux, sa part est abondante

    et sa nourriture copieuse[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa part est grasse et sa nourriture est grasse (ou de choix) ». En hébreu, l’image de la graisse exprime ici l’abondance et la prospérité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Rend le lien logique et conséquentiel avec la réussite du conquérant décrite dans le contexte précédent.
- source_word: יְזַבֵּחַ
  choice: il offre des sacrifices
  rationale: Le piel de זבח désigne ici l’action cultuelle de sacrifier, et non le simple fait d’abattre.
- source_word: לְחֶרְמוֹ
  choice: à son filet
  rationale: חֵרֶם désigne ici un filet de pêche dans la métaphore développée par le passage.
- source_word: וִיקַטֵּר
  choice: et brûle de l’encens
  rationale: Le piel de קטר exprime l’offrande cultuelle d’encens et maintient l’image explicite d’un culte idolâtre.
- source_word: לְמִכְמַרְתּוֹ
  choice: pour sa senne
  rationale: מִכְמֶרֶת désigne un grand filet enveloppant. « Senne » permet de le distinguer du filet mentionné juste avant.
- source_word: כִּי בָהֵמָּה
  choice: car, grâce à eux
  rationale: 'La préposition בְּ avec le pronom a ici une valeur instrumentale : ces filets sont le moyen de sa prospérité.'
- source_word: שָׁמֵן חֶלְקוֹ
  choice: sa part est abondante
  rationale: שָׁמֵן signifie littéralement « grasse », image hébraïque de l’abondance et de la prospérité. Le texte principal en communique naturellement le sens.
- source_word: וּמַאֲכָלוֹ בְּרִיאָה
  choice: et sa nourriture copieuse
  rationale: בְּרִיאָה évoque ce qui est gras, bien nourri ou de choix ; « copieuse » exprime ici l’abondance de la nourriture sans effacer l’image, signalée en note.
theological_decisions:
- issue: Langage idolâtre appliqué aux instruments de conquête figurés par des filets
  choice: 'Conserver les actes cultuels explicites : offrir des sacrifices au filet et brûler de l’encens pour la senne.'
  alternative: Paraphraser comme une confiance excessive placée dans la puissance militaire.
  rationale: L’hébreu emploie un vocabulaire sacrificiel et cultuel explicite. La traduction doit préserver cette personnification idolâtre, que les actes soient conçus littéralement ou comme une dénonciation figurée de l’autoglorification du conquérant.
translation_notes:
  register: Français international moderne, naturel et digne. La disposition poétique conserve le parallélisme. « Senne » est un terme précis mais compréhensible dans le contexte et maintient la distinction entre les deux types de filets.
