  text: לָ֣/מָּה תַרְאֵ֤/נִי אָ֨וֶן֙ וְ/עָמָ֣ל תַּבִּ֔יט וְ/שֹׁ֥ד וְ/חָמָ֖ס לְ/נֶגְדִּ֑/י וַ/יְהִ֧י רִ֦יב וּ/מָד֖וֹן יִשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/003.yaml
  text: Why do you make me see wrongdoing[a], and why do you look at trouble? Destruction and violence are before me; strife comes to be[c][b], and contention rises up.
translation:
  language: fr
  text: Pourquoi me fais-tu voir l’injustice[a], et pourquoi regardes-tu le malheur ? La dévastation[b] et la violence sont devant moi ; la dispute surgit, et le conflit s’élève[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le mal » ou « l’iniquité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la destruction » ou « le pillage ».
    reason: lexical_alternative
  - marker: c
    text: Ou « la dispute survient, et le conflit s’élève » ou « éclate » ; la formulation hébraïque concise peut évoquer l’apparition ou l’intensification du conflit.
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Interrogatif direct de cause, naturel dans une plainte adressée à Dieu.
- source_word: תַרְאֵנִי
  choice: me fais-tu voir
  rationale: Le hiphil de ראה avec suffixe de première personne a une valeur causative ; cette formulation conserve la force troublante de la plainte.
- source_word: אָוֶן
  choice: l’injustice
  rationale: Le terme désigne ici le mal moral ou l’iniquité ; « injustice » est actuel, clair et adapté au contexte social.
- source_word: עָמָל
  choice: le malheur
  rationale: Dans cette plainte prophétique, le mot évoque la peine, la misère ou le mal causé, plutôt qu’un travail neutre.
- source_word: תַּבִּיט
  choice: regardes-tu
  rationale: Le verbe signifie regarder ou considérer ; la traduction ne précise pas pourquoi Dieu regarde sans intervenir.
- source_word: שֹׁד
  choice: La dévastation
  rationale: Le terme peut désigner les ravages violents, la destruction ou le pillage ; « dévastation » convient bien en parallèle avec « violence ».
- source_word: חָמָס
  choice: la violence
  rationale: Terme prophétique courant pour la violence et l’injustice oppressive.
- source_word: לְנֶגְדִּי
  choice: sont devant moi
  rationale: Rend directement ce qui se trouve constamment sous les yeux du prophète.
- source_word: וַיְהִי רִיב
  choice: les conflits surgissent
  rationale: La tournure exprime l’apparition ou la présence du conflit ; le pluriel français rend naturellement ce phénomène social récurrent.
- source_word: מָדוֹן יִשָּׂא
  choice: la discorde s’élève
  rationale: Conserve l’image de ce qui est soulevé ou monte, tout en distinguant מָדוֹן de רִיב.
theological_decisions:
- issue: La plainte implique-t-elle une culpabilité divine ou seulement une permission divine ?
  choice: 'Conserver l’adresse directe et la valeur causative : « Pourquoi me fais-tu voir… ? Pourquoi regardes-tu… ? »'
  alternative: « Pourquoi me laisses-tu voir… ? Pourquoi tolères-tu… ? »
  rationale: L’hébreu adresse à Dieu une question sans fournir d’explication doctrinale. La traduction préserve donc la tension de la lamentation au lieu de l’atténuer.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement conserve l’adresse directe singulière à Dieu. Les deux questions séparées donnent à la plainte sa force naturelle, tandis que le parallélisme hébreu est maintenu dans la seconde moitié du verset.
