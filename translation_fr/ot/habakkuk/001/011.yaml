  text: אָ֣ז חָלַ֥ף ר֛וּחַ וַֽ/יַּעֲבֹ֖ר וְ/אָשֵׁ֑ם ז֥וּ כֹח֖/וֹ לֵ/אלֹהֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/011.yaml
  text: Then he sweeps by like the wind and passes on—he becomes guilty[b][a]; this strength of his is his god.
translation:
  language: fr
  text: 'Alors il passe comme le vent et poursuit sa route — il se rend coupable[a] : sa force, voilà son dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « il se rend coupable en attribuant cette force à son dieu » ou « sa force appartient à son dieu ». La dernière proposition hébraïque est très concise et peut être comprise de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque l’étape suivante de la description dans un français naturel et soutenu.
- source_word: חָלַף
  choice: il passe
  rationale: Dans l’image liée à רוּחַ, le verbe évoque le passage rapide et irrésistible de l’envahisseur.
- source_word: רוּחַ
  choice: comme le vent
  rationale: Le mot peut signifier « vent » ou « esprit » ; ici, le mouvement rapide et puissant favorise « vent ». La comparaison est explicitée pour rendre la syntaxe hébraïque condensée intelligible en français.
- source_word: וַיַּעֲבֹר
  choice: et poursuit sa route
  rationale: Prolonge l’image d’une avancée qui ne s’arrête pas, tout en évitant la répétition immédiate de « passe ».
- source_word: וְאָשֵׁם
  choice: mais il se rend coupable
  rationale: Le verbe exprime le fait d’encourir la culpabilité. « Mais » rend ici le contraste implicite entre la réussite militaire et le jugement moral, sans supprimer la tension syntaxique.
- source_word: זוּ
  choice: voilà
  rationale: Cette tournure démonstrative met en relief la force mentionnée et convient à la formulation nominale très brève de l’hébreu.
- source_word: כֹחוֹ
  choice: sa force
  rationale: Désigne la puissance militaire décrite dans le contexte ; « force » reste concret et direct.
- source_word: לֵאלֹהוֹ
  choice: son dieu
  rationale: La construction avec ל est très concise. Dans cette lecture, la force de l’envahisseur tient lieu de dieu, ce qui lie naturellement la proposition à sa culpabilité.
theological_decisions:
- issue: Interprétation de la proposition finale זוּ כֹחוֹ לֵאלֹהוֹ
  choice: L’envahisseur est coupable parce que sa propre force est son dieu.
  alternative: « il se rend coupable en attribuant cette force à son dieu » ou « sa force appartient à son dieu »
  rationale: L’hébreu condensé permet plusieurs analyses. Dans le contexte de la violence impériale arrogante, comprendre que sa propre puissance lui tient lieu de dieu explique bien la déclaration de culpabilité. Les autres lectures plausibles sont conservées en note.
translation_notes:
  register: Français international moderne, naturel et digne. La cadence brève conserve l’élan de l’image, tandis que le tiret marque le retournement vers le jugement moral. L’ambiguïté réelle de la dernière proposition est signalée en note.
