source:
  edition: WLC
  text: כִּֽי הִנְ/נִ֤י מֵקִים֙ אֶת הַ/כַּשְׂדִּ֔ים הַ/גּ֖וֹי הַ/מַּ֣ר וְ/הַ/נִּמְהָ֑ר הַֽ/הוֹלֵךְ֙ לְ/מֶרְחֲבֵי אֶ֔רֶץ לָ/רֶ֖שֶׁת מִשְׁכָּנ֥וֹת לֹּא לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/006.yaml
  text: For behold[a], I am raising up the Chaldeans, that bitter and hasty nation[b], which marches through the broad places of the earth to seize dwelling places not its own.
translation:
  language: fr
  text: 'Car voici[a] : je fais surgir les Chaldéens[b], ce peuple cruel et impétueux, qui parcourt les vastes étendues de la terre pour s’emparer de demeures qui ne lui appartiennent pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque met fortement en relief le locuteur et l’action qu’il annonce : « voici, je… »'
    reason: Nuance discursive et emphatique de הִנְנִי.
  - marker: b
    text: C’est-à-dire les Babyloniens, le peuple associé à la puissance néo-babylonienne.
    reason: Équivalent historique susceptible d’aider les lecteurs modernes.
lexical_decisions:
- source_word: כִּי הִנְנִי
  choice: 'Car voici : je'
  rationale: 'כִּי introduit l’explication de la réponse divine, tandis que הִנְנִי attire fortement l’attention sur l’action imminente de Dieu. « Car voici : je » conserve ces deux fonctions dans un français prophétique digne et actuel.'
- source_word: מֵקִים
  choice: fais surgir
  rationale: Le hiphil de קום exprime ici le fait de faire se lever ou d’amener sur la scène. « Fais surgir » maintient explicitement l’action divine sans préciser davantage son mode.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Le texte porte l’ethnonyme historique « Chaldéens ». Le terme contextuel « Babyloniens » est signalé en note plutôt que substitué au nom source.
- source_word: הַגּוֹי
  choice: ce peuple
  rationale: Dans ce contexte, גּוֹי désigne une collectivité ethnique et politique. « Peuple » évite la tournure moins naturelle « cette nation… qui » tout en préservant le sens collectif singulier.
- source_word: הַמַּר
  choice: cruel
  rationale: Littéralement « amer », l’adjectif caractérise ici la dureté redoutable de ce peuple. En français, « peuple amer » évoquerait surtout le ressentiment; « cruel » restitue clairement la valeur contextuelle.
- source_word: וְהַנִּמְהָר
  choice: impétueux
  rationale: Le mot évoque la précipitation, la rapidité et l’élan irréfléchi. « Impétueux » conserve mieux cette combinaison que le seul « rapide ».
- source_word: הַהוֹלֵךְ
  choice: qui parcourt
  rationale: Le participe décrit le déplacement caractéristique du peuple. « Parcourt » reste proche de « va » tout en convenant à son avancée conquérante, sans ajouter explicitement une marche militaire.
- source_word: לְמֶרְחֲבֵי אֶרֶץ
  choice: les vastes étendues de la terre
  rationale: La construction désigne les espaces larges ou l’étendue du pays/de la terre. Cette formulation conserve l’image spatiale et l’ampleur de la progression.
- source_word: לָרֶשֶׁת
  choice: pour s’emparer de
  rationale: ירשׁ peut signifier prendre possession, souvent au moyen d’une conquête. « S’emparer de » exprime ici naturellement cette acquisition hostile.
- source_word: מִשְׁכָּנוֹת לֹא לוֹ
  choice: demeures qui ne lui appartiennent pas
  rationale: La traduction conserve le sens concret de lieux habités et l’illégitimité de leur appropriation. Le singulier « lui » correspond au peuple pris collectivement.
theological_decisions:
- issue: L’action divine dans la montée des Chaldéens
  choice: je fais surgir les Chaldéens
  alternative: je mets en mouvement les Chaldéens
  rationale: Le texte attribue directement à Dieu leur irruption historique. La traduction maintient cette affirmation et sa tension théologique, sans expliquer ni atténuer la nature de cette causalité.
translation_notes:
  register: Français international moderne, clair et digne, avec une légère élévation prophétique. Les adjectifs sont rendus selon leur force contextuelle, et la syntaxe conserve l’accent sur l’initiative divine ainsi que sur l’expansion conquérante du peuple.
