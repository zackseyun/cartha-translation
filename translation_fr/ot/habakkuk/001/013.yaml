source:
  edition: WLC
  text: טְה֤וֹר עֵינַ֨יִם֙ מֵ/רְא֣וֹת רָ֔ע וְ/הַבִּ֥יט אֶל עָמָ֖ל לֹ֣א תוּכָ֑ל לָ֤/מָּה תַבִּיט֙ בּֽוֹגְדִ֔ים תַּחֲרִ֕ישׁ בְּ/בַלַּ֥ע רָשָׁ֖ע צַדִּ֥יק מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/013.yaml
  text: Your eyes are too pure to look on evil[a], and you cannot gaze at wrongdoing[c][b]. Why then do you look on the treacherous and keep silent when the wicked swallows up one more righteous than he?
translation:
  language: fr
  text: Tes yeux sont trop purs pour regarder le mal[a], et tu ne peux contempler l’injustice[b]. Pourquoi donc regardes-tu les perfides et gardes-tu le silence quand le méchant engloutit quelqu’un de plus juste que lui[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pur d’yeux pour voir le mal » ; l’expression poétique peut aussi se traduire par « trop purs pour voir le mal ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner le malheur, la peine, les méfaits ou l’oppression.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu établit une comparaison : la personne engloutie est plus juste que le méchant, sans être nécessairement présentée comme absolument juste.'
    reason: clarification
lexical_decisions:
- source_word: טְהוֹר עֵינַיִם מֵרְאוֹת רָע
  choice: Tes yeux sont trop purs pour regarder le mal
  rationale: La formulation conserve l’image hébraïque des yeux purs et le rapport exprimé par מִן avec l’infinitif. Elle rend l’affirmation poétique sans la transformer en explication doctrinale.
- source_word: וְהַבִּיט אֶל עָמָל לֹא תוּכָל
  choice: et tu ne peux contempler l’injustice
  rationale: « Contempler » reflète la nuance de regard soutenu de נבט. Dans cette plainte contre le mal moral, « injustice » exprime bien עָמָל, tout en signalant en note ses autres valeurs possibles.
- source_word: בּוֹגְדִים
  choice: les perfides
  rationale: Le participe désigne ceux qui agissent avec déloyauté ou traîtrise. « Les perfides » est concis, actuel et suffisamment large.
- source_word: תַּחֲרִישׁ
  choice: gardes-tu le silence
  rationale: Cette expression naturelle rend l’idée d’un silence qui se prolonge et, dans la plainte du prophète, d’une absence apparente d’intervention.
- source_word: בְּבַלַּע רָשָׁע
  choice: quand le méchant engloutit
  rationale: La proposition temporelle rend clairement la construction avec l’infinitif, tandis que « engloutit » préserve l’image vive de la prédation.
- source_word: צַדִּיק מִמֶּנּוּ
  choice: quelqu’un de plus juste que lui
  rationale: Le comparatif מִן indique une justice relative. Cette traduction évite de présenter la victime comme absolument juste ou sans péché.
theological_decisions:
- issue: Le rapport de Dieu au mal dans la première affirmation
  choice: Conserver l’affirmation rhétorique selon laquelle les yeux de Dieu sont trop purs pour regarder le mal.
  alternative: Expliciter par « tu ne peux tolérer le mal » ou comprendre que Dieu ne voit jamais le mal en aucun sens.
  rationale: 'Le verset juxtapose volontairement la pureté divine et la question du prophète : pourquoi Dieu regarde-t-il les perfides ? La traduction maintient cette tension poétique sans nier l’omniscience divine ni remplacer l’image par une interprétation.'
- issue: La justice de la victime
  choice: 'Traduire explicitement le comparatif : « quelqu’un de plus juste que lui ».'
  alternative: Dire simplement « le juste », ce qui pourrait suggérer une justice absolue.
  rationale: L’hébreu établit une comparaison avec le méchant. Il convient de préserver cette précision et de ne pas imposer une affirmation théologique plus forte.
translation_notes:
  register: Français international moderne, digne et poétique sans archaïsmes. Le tutoiement convient à l’adresse directe à Dieu dans la poésie biblique. Les répétitions liées au regard sont conservées afin de maintenir le contraste rhétorique du texte hébreu.
