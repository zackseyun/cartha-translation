  text: וַ/יֹּ֣אמֶר מִיכָ֔ה עַתָּ֣ה יָדַ֔עְתִּי כִּֽי יֵיטִ֥יב יְהוָ֖ה לִ֑/י כִּ֧י הָיָה לִ֛/י הַ/לֵּוִ֖י לְ/כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/013.yaml
  text: Then Micah said[a], “Now I know that Yahweh will do good to me, because I have a Levite as priest.”
translation:
  language: fr
  text: 'Alors Mica dit : « Maintenant, je sais que Yahweh me fera du bien, puisque j’ai le Lévite pour prêtre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit ; « Alors » exprime naturellement cette progression en français.
- source_word: מִיכָה
  choice: Michée
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: עַתָּה יָדַעְתִּי
  choice: Maintenant, je sais
  rationale: Le parfait יָדַעְתִּי décrit ici un état présent résultant d’une prise de conscience ; cette formulation conserve directement l’adverbe temporel.
- source_word: יֵיטִיב יְהוָה לִי
  choice: Yahweh me fera du bien
  rationale: Le hiphil de יטב signifie « faire du bien » ou « bien agir envers » ; la formulation évite de réduire le sens à la seule prospérité matérielle.
- source_word: כִּי
  choice: puisque
  rationale: Le second כִּי introduit le motif sur lequel Michée fonde sa certitude ; « puisque » rend bien une raison tenue pour acquise par le locuteur.
- source_word: הָיָה לִי
  choice: j’ai
  rationale: Littéralement « il est devenu/il est à moi », cette tournure hébraïque exprime ici la possession ou la disponibilité au service de Michée.
- source_word: הַלֵּוִי
  choice: le Lévite
  rationale: L’article hébreu est conservé naturellement en français, où « le Lévite » renvoie sans difficulté au personnage précis déjà présenté.
- source_word: לְכֹהֵן
  choice: pour prêtre
  rationale: Le ל marque la fonction attribuée au Lévite ; « avoir quelqu’un pour prêtre » est idiomatique et fidèle au rôle exprimé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; sa translittération préserve le nom personnel sans lui substituer un titre.
- issue: Portée de la déclaration de Michée
  choice: Conserver « me fera du bien » sans approbation explicite
  alternative: me bénira / me fera prospérer
  rationale: Le verset rapporte la conviction de Michée dans un contexte religieux problématique. Une traduction neutre conserve la tension narrative et n’implique ni approbation divine ni promesse certaine de prospérité.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste simple et orale dans le discours direct. « Le Lévite » respecte l’article du texte hébreu et sonne naturellement en français, contrairement à l’ajustement idiomatique nécessaire en anglais.
