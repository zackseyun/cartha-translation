  text: וַ/יּ֥וֹאֶל הַ/לֵּוִ֖י לָ/שֶׁ֣בֶת אֶת הָ/אִ֑ישׁ וַ/יְהִ֤י הַ/נַּ֨עַר֙ ל֔/וֹ כְּ/אַחַ֖ד מִ/בָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/011.yaml
  text: So the Levite agreed to stay with the man[b][a], and the young man became like one of his sons to him.
translation:
  language: fr
  text: Le Lévite accepta donc de rester chez cet homme[a], et le jeune homme devint pour lui comme l’un de ses fils[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « consentit à demeurer auprès de cet homme ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le jeune homme fut pour lui comme l’un de ses fils ». Cette expression décrit la place familiale que le Lévite occupait dans sa maison.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: accepta
  rationale: Le verbe יאל au hiphil exprime ici le consentement ou la volonté. « Accepta » rend naturellement en français la réponse favorable du Lévite à la proposition reçue.
- source_word: הַלֵּוִי
  choice: le Lévite
  rationale: Le nom défini renvoie au Lévite déjà présenté dans le récit; « Lévite » est le terme français précis et usuel.
- source_word: לָשֶׁבֶת אֶת הָאִישׁ
  choice: de rester chez cet homme
  rationale: ישׁב peut signifier s’asseoir, habiter, demeurer ou rester. Dans ce contexte d’accueil au sein d’une maison, « rester chez cet homme » exprime clairement et naturellement la résidence auprès de lui.
- source_word: וַיְהִי
  choice: devint
  rationale: Le verbe היה peut décrire ici l’établissement d’une nouvelle situation. « Devint » fait ressortir ce résultat, tout en signalant en note la traduction plus statique « fut ».
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: נַעַר désigne selon le contexte un garçon, un jeune homme ou un serviteur. Le Lévite agit ici de façon autonome; « jeune homme » convient donc le mieux.
- source_word: כְּאַחַד מִבָּנָיו
  choice: comme l’un de ses fils
  rationale: La préposition comparative כְּ conserve explicitement la comparaison et décrit une place analogue à celle d’un fils dans la maison, sans affirmer une filiation réelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Chez cet homme » est idiomatique dans un contexte de résidence, tandis que « devint pour lui comme » conserve la relation exprimée par l’hébreu sans transformer implicitement la comparaison en adoption formelle.
