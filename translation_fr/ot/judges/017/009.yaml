translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à un échange direct entre deux hommes dans ce récit. La répétition hébraïque de « il lui dit » est légèrement variée en « demanda » puis « répondit » pour une lecture fluide, sans modifier le contenu du dialogue.
