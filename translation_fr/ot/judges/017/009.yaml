  text: וַ/יֹּאמֶר ל֥/וֹ מִיכָ֖ה מֵ/אַ֣יִן תָּב֑וֹא וַ/יֹּ֨אמֶר אֵלָ֜י/ו לֵוִ֣י אָנֹ֗כִי מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה וְ/אָנֹכִ֣י הֹלֵ֔ךְ לָ/ג֖וּר בַּ/אֲשֶׁ֥ר אֶמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/009.yaml
  text: Micah said to him[a], “Where do you come from?” And he said to him, “I am a Levite from Bethlehem in Judah, and I am going to sojourn wherever I may find a place.”
translation:
  language: fr
  text: 'Michée lui demanda : « D’où viens-tu ? » Il lui répondit : « Je suis un Lévite de Bethléem, en Juda, et je vais séjourner là où je trouverai une place[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « là où je trouverai ». Le verbe traduit par « séjourner » peut désigner le fait de résider temporairement, souvent comme personne extérieure ou dépendante.'
    reason: L’objet de « trouver » est implicite en hébreu, et le verbe גור comporte une nuance sociale et temporaire difficile à rendre entièrement dans le texte principal.
lexical_decisions:
- source_word: מֵאַיִן
  choice: D’où viens-tu ?
  rationale: L’interrogatif porte sur l’origine ou le point de départ. Cette formulation est naturelle en français moderne et conserve le mouvement exprimé par le verbe hébreu.
- source_word: לֵוִי
  choice: un Lévite
  rationale: Le terme désigne l’appartenance au groupe de Lévi. L’article indéfini convient à cette déclaration d’identité en français.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: de Bethléem, en Juda
  rationale: La précision « en Juda » distingue cette Bethléem géographiquement, dans une formulation française claire et courante.
- source_word: הֹלֵךְ
  choice: je vais
  rationale: Le participe décrit une action en cours ou un projet immédiat. « Je vais » en restitue naturellement la valeur sans préciser indûment le mode de déplacement.
- source_word: לָגוּר
  choice: séjourner
  rationale: Le verbe גור évoque le fait de demeurer, souvent temporairement et comme personne extérieure ou dépendante. « Séjourner » conserve cette nuance mieux que le simple « habiter », sans alourdir le texte.
- source_word: בַּאֲשֶׁר אֶמְצָא
  choice: là où je trouverai une place
  rationale: L’hébreu signifie littéralement « là où je trouverai » et laisse l’objet sous-entendu. L’ajout de « une place » rend l’ellipse intelligible en français tout en maintenant le caractère indéterminé de la destination.
