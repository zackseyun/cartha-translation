source:
  edition: WLC
  text: וַֽ/יְהִי אִ֥ישׁ מֵֽ/הַר אֶפְרָ֖יִם וּ/שְׁמ֥/וֹ מִיכָֽיְהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/001.yaml
  text: There was a man from the hill country of Ephraim[a], and his name was Mikayhu.
translation:
  language: fr
  text: Il y avait un homme de la région montagneuse d’Éphraïm, qui s’appelait Mikayhou[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionnellement rendu par « Michée ». La forme hébraïque employée ici est Mikayhou.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Il y avait
  rationale: Cette forme introduit ici un nouveau personnage dans le récit. « Il y avait » est naturel en français et n’ajoute pas un marqueur temporel absent de l’hébreu.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom désigne simplement un individu de sexe masculin; « un certain homme » ajouterait une nuance qui n’est pas explicite.
- source_word: מֵהַר אֶפְרָיִם
  choice: de la région montagneuse d’Éphraïm
  rationale: L’expression désigne la zone de hauts reliefs associée à Éphraïm, et non une montagne isolée.
- source_word: וּשְׁמוֹ
  choice: qui s’appelait
  rationale: Cette tournure française rend naturellement l’indication du nom, tout en conservant son lien étroit avec la présentation du personnage.
- source_word: מִיכָיְהוּ
  choice: Mikayhou
  rationale: Cette translittération française reflète la forme hébraïque particulière employée dans ce verset, plutôt que de lui substituer d’emblée la forme traditionnelle « Mika ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase introductive reste simple; « région montagneuse » évite de faire croire qu’il s’agit d’un sommet unique, et la forme du nom hébreu est conservée avec une note donnant l’équivalent traditionnel.
