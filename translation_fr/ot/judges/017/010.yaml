base_translation:
  language: en
  yaml_path: translation/ot/judges/017/010.yaml
  text: Micah said to him[a], “Stay with me, and be a father and a priest to me, and I will give you ten pieces of silver a year, a set of clothes[c][b], and your living.” So the Levite went in.
translation:
  language: fr
  text: 'Michée lui dit : « Reste avec moi et sois pour moi un père et un prêtre. Moi, je te donnerai dix pièces d’argent[a] par an, un ensemble de vêtements[b] et de quoi vivre. » Alors le Lévite alla[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dix d’argent »; l’unité n’est pas précisée. On traduit souvent « dix sicles d’argent ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une allocation pour les vêtements ».
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu signifie simplement « alla »; dans ce contexte, il peut sous-entendre que le Lévite entra chez Michée.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה עִמָּדִי
  choice: Reste avec moi
  rationale: L’impératif de ישׁב invite le Lévite à demeurer chez Michée. « Reste avec moi » est naturel en français moderne et exprime cette résidence sans ajout.
- source_word: לְאָב וּלְכֹהֵן
  choice: un père et un prêtre
  rationale: Le texte emploie explicitement la métaphore familiale « père » comme titre d’honneur ou fonction d’autorité religieuse; elle est conservée, parallèlement à « prêtre ».
- source_word: עֲשֶׂרֶת כֶּסֶף
  choice: dix pièces d’argent
  rationale: L’hébreu dit littéralement « dix d’argent » sans préciser l’unité. « Pièces » rend la somme compréhensible tout en évitant d’imposer le sicle.
- source_word: לַיָּמִים
  choice: par an
  rationale: Cette expression idiomatique désigne ici une rémunération annuelle.
- source_word: וְעֵרֶךְ בְּגָדִים
  choice: un ensemble de vêtements
  rationale: La tournure désigne une provision ou dotation vestimentaire. « Un ensemble de vêtements » reste concret et accessible, tout en signalant en note l’autre compréhension possible.
- source_word: וּמִחְיָתֶךָ
  choice: et de quoi vivre
  rationale: מִחְיָה couvre les moyens de subsistance. Cette formulation française naturelle conserve un sens plus large que la seule nourriture.
- source_word: וַיֵּלֶךְ הַלֵּוִי
  choice: Alors le Lévite alla
  rationale: Le verbe signifie simplement « aller ». La formulation conserve cette sobriété et n’ajoute ni destination ni accord explicite, même si le contexte peut suggérer qu’il entra chez Michée.
theological_decisions:
- issue: Emploi honorifique de « père » dans le cadre d’un sanctuaire irrégulier
  choice: Conserver littéralement « père »
  alternative: conseiller; protecteur; père spirituel
  rationale: La métaphore familiale appartient au texte et caractérise le rôle social et religieux proposé au Lévite. La remplacer expliquerait ou normaliserait indûment cette situation cultuelle.
- issue: Unité monétaire non précisée
  choice: Ne pas introduire « sicles » dans le texte principal
  alternative: dix sicles d’argent
  rationale: Le texte source ne nomme aucune unité. La traduction évite donc de transformer une interprétation traditionnelle en précision explicite.
- issue: Portée de וַיֵּלֶךְ à la fin du verset
  choice: 'Conserver le simple mouvement : « alla »'
  alternative: entra; accepta et entra chez Michée
  rationale: Le contexte peut impliquer l’entrée dans la maison ou l’acceptation de l’offre, mais le verbe hébreu ne l’explicite pas. La traduction maintient cette ambiguïté narrative.
translation_notes:
  register: Français international actuel, digne et directement compréhensible. La syntaxe garde la solennité du discours sans archaïsmes. Les trois marqueurs de note figurent dans le texte principal et correspondent aux ambiguïtés lexicales réelles.
