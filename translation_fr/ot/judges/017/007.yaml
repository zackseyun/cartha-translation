  text: וַ/יְהִי נַ֗עַר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה מִ/מִּשְׁפַּ֖חַת יְהוּדָ֑ה וְ/ה֥וּא לֵוִ֖י וְ/ה֥וּא גָֽר שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/007.yaml
  text: There was a young man from Bethlehem in Judah[a], from the clan of Judah; and he was a Levite[b], and he was sojourning there.
translation:
  language: fr
  text: Il y avait un jeune homme de Bethléhem, en Juda, du clan de Juda ; il était lévite et séjournait là[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « résidait là comme étranger ». Le verbe hébreu peut désigner le fait d’habiter dans un lieu où l’on n’est pas pleinement établi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Il y avait
  rationale: La forme narrative introduit un nouveau personnage et pose la scène. « Il y avait » est naturel en français sans ajouter un marqueur temporel explicite.
- source_word: נַעַר
  choice: un jeune homme
  rationale: Dans ce contexte, le terme désigne l’âge ou le statut général du personnage, sans indiquer une fonction de serviteur.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: de Bethléhem, en Juda
  rationale: « En Juda » précise la région et distingue cette ville d’autres lieux portant le même nom.
- source_word: מִמִּשְׁפַּחַת יְהוּדָה
  choice: du clan de Juda
  rationale: מִשְׁפָּחָה désigne généralement un groupe familial ou clanique. « Clan » est ici plus précis que « famille » et moins large que « tribu ».
- source_word: לֵוִי
  choice: lévite
  rationale: Le nom identifie directement le jeune homme comme lévite, tout en conservant la tension avec la mention précédente du clan de Juda.
- source_word: גָר שָׁם
  choice: séjournait là
  rationale: Le verbe גור évoque le fait de résider en un lieu sans y être pleinement établi. « Séjournait » conserve cette nuance dans un français digne et intelligible.
theological_decisions:
- issue: Tension apparente entre l’appartenance au clan de Juda et l’identité lévitique
  choice: Maintenir côte à côte « du clan de Juda » et « il était lévite » sans harmonisation.
  alternative: Comprendre la mention de Juda comme purement géographique ou sociale, ou reformuler pour éliminer la tension.
  rationale: L’hébreu présente les deux indications sans les expliquer. La traduction conserve donc cette ambiguïté narrative plutôt que de la résoudre.
translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque est légèrement allégée pour une lecture naturelle, sans supprimer les deux affirmations identitaires. Le marqueur de note [a] est placé après l’expression qu’il éclaire.
