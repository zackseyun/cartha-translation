base_translation:
  language: en
  yaml_path: translation/ot/judges/017/004.yaml
  text: So he returned the silver to his mother[a], and his mother took two hundred pieces of silver and gave it to the silversmith, and he made it into a carved image and a cast image[c][b], and it was in the house of Micah.
translation:
  language: fr
  text: Il rendit l’argent à sa mère. Sa mère prit deux cents pièces d’argent[a] et les donna à l’orfèvre, qui en fit une image sculptée et une image en métal fondu[b]. Cela se trouva dans la maison de Michée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « deux cents d’argent ». L’unité, probablement le sicle d’après le contexte, n’est pas précisée dans ce verset.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une image taillée et une image de fonte ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu emploie ici un verbe au singulier après « une image sculptée et une image en métal fondu », considérant apparemment l’objet fabriqué, ou l’ensemble, comme une unité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב אֶת הַכֶּסֶף
  choice: Il rendit donc l’argent
  rationale: Le hiphil de שוב exprime ici le retour du bien à sa propriétaire. « Rendre » est naturel en français et conserve l’idée de restitution. כֶּסֶף peut désigner l’argent comme métal ou comme moyen de paiement; le contexte monétaire puis artisanal permet au français « argent » de garder cette double portée.
- source_word: מָאתַיִם כֶּסֶף
  choice: deux cents pièces d’argent
  rationale: L’hébreu indique le nombre et l’argent sans nommer explicitement l’unité. « Pièces d’argent » donne une formulation française idiomatique sans introduire avec certitude les sicles; une note conserve cette imprécision.
- source_word: לַצּוֹרֵף
  choice: à l’orfèvre
  rationale: צֹרֵף désigne un artisan ou affineur de métal. Puisqu’il travaille ici l’argent, « orfèvre » est le terme français courant le plus naturel, sans impliquer que le matériau soit de l’or.
- source_word: וַיַּעֲשֵׂהוּ
  choice: qui en fit
  rationale: Le verbe masculin singulier renvoie naturellement à l’orfèvre. Le pronom suffixe désigne l’argent remis; « en fit » exprime sobrement sa transformation.
- source_word: פֶּסֶל
  choice: une statue sculptée
  rationale: פֶּסֶל désigne une représentation taillée ou sculptée, souvent cultuelle. « Statue sculptée » décrit l’objet sans ajouter directement le jugement interprétatif contenu dans « idole ».
- source_word: וּמַסֵּכָה
  choice: et une statue en métal fondu
  rationale: מַסֵּכָה désigne une représentation produite par fonte ou moulage. Cette formulation moderne explicite le procédé et évite l’expression vieillie « image de fonte ».
- source_word: וַיְהִי בְּבֵית מִיכָיְהוּ
  choice: Elle fut placée dans la maison de Michée
  rationale: Le verbe hébreu est au singulier malgré les deux désignations précédentes, ce qui peut présenter l’objet fabriqué ou l’ensemble comme une unité. Le singulier féminin français maintient cette donnée, tandis que « fut placée » rend naturellement l’aboutissement narratif.
- source_word: מִיכָיְהוּ
  choice: Michée
  rationale: « Michée » est la forme française biblique courante du nom de ce personnage dans le livre des Juges.
theological_decisions:
- issue: Faut-il rendre פֶּסֶל וּמַסֵּכָה par un vocabulaire explicitement condamnatoire?
  choice: une statue sculptée et une statue en métal fondu
  alternative: une idole sculptée et une idole en métal fondu
  rationale: Le contexte plus large condamne clairement le culte concerné, mais les termes sont traduits descriptivement afin de ne pas renforcer dans ce verset seul la qualification théologique. Leur portée cultuelle demeure perceptible.
- issue: Les deux expressions désignent-elles un seul objet ou deux objets?
  choice: Conserver les deux groupes nominaux, puis le singulier « Elle »
  alternative: 'les traiter explicitement comme deux objets: « Elles furent placées »'
  rationale: L’hébreu coordonne deux noms, mais poursuit avec un verbe singulier. La traduction garde cette tension au lieu de décider que deux objets distincts sont nécessairement en vue.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition explicite de « sa mère » suit l’hébreu. « Orfèvre » est courant et précis dans le contexte. La formulation évite à la fois l’archaïsme et une paraphrase théologique excessive; les notes signalent l’unité monétaire implicite, les équivalents traditionnels et l’accord singulier remarquable.
