source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ הָ/אִ֜ישׁ מֵ/הָ/עִ֗יר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה לָ/ג֖וּר בַּ/אֲשֶׁ֣ר יִמְצָ֑א וַ/יָּבֹ֧א הַר אֶפְרַ֛יִם עַד בֵּ֥ית מִיכָ֖ה לַ/עֲשׂ֥וֹת דַּרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/008.yaml
  text: And the man went from the city[a], from Bethlehem of Judah, to sojourn wherever he might find a place. And he came to the hill country of Ephraim, as far as the house of Micah, to continue his journey.
translation:
  language: fr
  text: L’homme partit de la ville, de Bethléhem de Juda, pour séjourner là où il trouverait une place. Il arriva dans la région montagneuse d’Éphraïm, jusqu’à la maison de Mica, en poursuivant son chemin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour continuer son chemin » ou « pendant son voyage ». L’expression hébraïque signifie littéralement « faire son chemin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: partit
  rationale: Le verbe הלך fait avancer le récit; « partit » exprime naturellement le départ depuis Bethléhem.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Le texte porte simplement « l’homme », même si le contexte précédent l’identifie comme un jeune Lévite.
- source_word: מֵהָעִיר
  choice: de la ville
  rationale: עיר peut désigner une ville ou une localité; « ville » maintient une correspondance lexicale directe sans spéculer sur la taille de Bethléhem.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: de Bethléhem de Juda
  rationale: Cette formulation conserve le qualificatif géographique qui distingue cette Bethléhem d’autres localités du même nom.
- source_word: לָגוּר
  choice: pour séjourner
  rationale: גור évoque le fait de résider, souvent temporairement ou en qualité d’étranger; « séjourner » garde cette nuance mieux que « vivre ».
- source_word: בַּאֲשֶׁר יִמְצָא
  choice: là où il trouverait une place
  rationale: L’objet de « trouver » reste implicite en hébreu. L’ajout naturel de « une place » rend en français l’idée de chercher un lieu où séjourner.
- source_word: וַיָּבֹא
  choice: il arriva
  rationale: בוא indique ici l’arrivée dans la région montagneuse d’Éphraïm.
- source_word: הַר אֶפְרַיִם
  choice: la région montagneuse d’Éphraïm
  rationale: L’expression désigne habituellement une région de collines ou de montagnes, non un sommet isolé.
- source_word: עַד בֵּית מִיכָה
  choice: jusqu’à la maison de Mica
  rationale: עד marque l’étendue ou le point atteint au cours du déplacement.
- source_word: לַעֲשׂוֹת דַּרְכּוֹ
  choice: en poursuivant son chemin
  rationale: Littéralement « faire son chemin », l’expression peut décrire la poursuite du voyage; la tournure française garde le lien avec son déplacement sans surinterpréter sa destination.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Séjourner » conserve la nuance d’une résidence non permanente, tandis que « région montagneuse » rend la valeur géographique de הַר. Le marqueur de note est placé après l’expression à laquelle la note se rapporte.
