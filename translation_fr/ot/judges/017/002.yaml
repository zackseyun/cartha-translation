    rationale: « Que tu as même formulée devant moi » rattache grammaticalement la seconde action à « malédiction » et répète l’idée de prononcer/formuler. « Et dont tu m’as aussi parlé » rend les deux verbes coordonnés et l’idiome « en ma présence/à mes oreilles » de façon naturelle.
