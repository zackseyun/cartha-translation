  text: וַ/יֹּ֣אמֶר לְ/אִמּ֡/וֹ אֶלֶף֩ וּ/מֵאָ֨ה הַ/כֶּ֜סֶף אֲשֶׁ֣ר לֻֽקַּֽח לָ֗/ךְ ו/אתי אָלִית֙ וְ/גַם֙ אָמַ֣רְתְּ בְּ/אָזְנַ֔/י הִנֵּֽה הַ/כֶּ֥סֶף אִתִּ֖/י אֲנִ֣י לְקַחְתִּ֑י/ו וַ/תֹּ֣אמֶר אִמּ֔/וֹ בָּר֥וּךְ בְּנִ֖/י לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/002.yaml
  text: And he said to his mother[a], “The eleven hundred pieces of silver that were taken from you, about which you uttered a curse and also spoke in my hearing—look, the silver is with me; I took it.” And his mother said[b], “Blessed be my son by Yahweh.”
translation:
  language: fr
  text: 'Il dit à sa mère : « Les mille cent pièces d’argent qui t’ont été prises, au sujet desquelles tu as prononcé une malédiction[a] et dont tu m’as aussi parlé — voici, cet argent est avec moi ; c’est moi qui l’ai pris. » Sa mère dit : « Béni soit mon fils par Yahweh[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi évoquer un serment ; ici, le contexte favorise une malédiction.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Béni soit mon fils pour/par Yahweh » ; il s’agit d’une formule concise de bénédiction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: les mille cent pièces d’argent
  rationale: Le texte indique la quantité d’argent sans nommer explicitement une unité de poids; « pièces d’argent » reste naturel sans préciser indûment « sicles ».
- source_word: לֻקַּח לָךְ
  choice: qui t’ont été prises
  rationale: Le passif de לקח exprime le fait de prendre; le contexte implique un vol, mais la traduction conserve la formulation moins explicite de l’hébreu.
- source_word: וְאַתִּי אָלִית
  choice: au sujet desquelles tu as prononcé une malédiction
  rationale: Le verbe אָלָה peut évoquer un serment ou une malédiction. Le contexte favorise la malédiction, tout en signalant l’autre possibilité en note.
- source_word: וְגַם אָמַרְתְּ בְּאָזְנַי
  choice: que tu as même formulée devant moi
  rationale: L’expression littérale « à mes oreilles » signifie que le fils l’a entendue. « Devant moi » rend naturellement cette idée en français.
- source_word: הִנֵּה
  choice: eh bien
  rationale: Dans cette confession, הִנֵּה attire l’attention sur la révélation qui suit. « Eh bien » restitue sa fonction discursive en français courant.
- source_word: הַכֶּסֶף אִתִּי
  choice: cet argent est en ma possession
  rationale: Cette formulation rend clairement l’hébreu littéral « l’argent est avec moi » dans un français naturel.
- source_word: אֲנִי לְקַחְתִּיו
  choice: c’est moi qui l’ai pris
  rationale: La construction clivée restitue l’accent porté par le pronom explicite אֲנִי et la force de l’aveu.
- source_word: בָּרוּךְ בְּנִי לַיהוָה
  choice: Que mon fils soit béni par Yahweh
  rationale: Cette formule optative française exprime naturellement la bénédiction compacte de l’hébreu; la relation exacte indiquée par ל reste légèrement ambiguë et fait l’objet d’une note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par le titre « le Seigneur ».
theological_decisions:
- issue: Sens de אָלָה dans la déclaration de la mère
  choice: prononcer une malédiction
  alternative: prêter ou imposer un serment
  rationale: Le contexte de l’argent disparu et la bénédiction prononcée après l’aveu favorisent l’idée d’une malédiction, sans éliminer le sens possible de serment.
- issue: Relation exprimée par ל dans בָּרוּךְ בְּנִי לַיהוָה
  choice: béni par Yahweh
  alternative: béni pour/devant Yahweh
  rationale: L’agence divine convient à une formule française de bénédiction, mais l’hébreu est compact et permet une nuance relationnelle; la note préserve cette tension.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération conserve le nom personnel présent dans le texte source sans lui substituer un titre.
translation_notes:
  register: Français international moderne, narratif et digne. Les tournures « eh bien » et « c’est moi qui » donnent à l’aveu son relief oral sans familiarité excessive. Les deux marqueurs de note [a] et [b] figurent dans le texte.
