- from: 'Il dit à sa mère : « Les mille cent pièces d’argent qui t’ont été prises, et au sujet desquelles tu as prononcé une malédiction[a], que tu as même formulée devant moi — eh bien, cet argent est en ma possession : c’est moi qui l’ai pris. » Sa mère dit : « Que mon fils soit béni par Yahweh[b] ! »'
  to: 'Il dit à sa mère : « Les mille cent pièces d’argent qui t’ont été prises, au sujet desquelles tu as prononcé une malédiction[a] et dont tu m’as aussi parlé — voici, cet argent est avec moi ; c’est moi qui l’ai pris. » Sa mère dit : « Béni soit mon fils par Yahweh[b] ! »'
  rationale: La révision clarifie les deux verbes coordonnés décrivant la réaction antérieure de la mère, sans interpréter davantage leur contenu. Elle allège aussi la diction tout en gardant l’emphase de l’aveu (« c’est moi »), la valeur présentative de הִנֵּה (« voici »), ainsi que les deux ancres et leurs notes.
