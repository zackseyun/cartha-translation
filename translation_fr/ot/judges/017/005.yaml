base_translation:
  language: en
  yaml_path: translation/ot/judges/017/005.yaml
  text: The man Micah had a house of God[a], and he made an ephod and household idols, and he ordained one of his sons[b], and he became his priest.
translation:
  language: fr
  text: Mika avait un sanctuaire[a]. Il fit un éphod et des idoles domestiques, puis il établit l’un de ses fils comme prêtre[b], et celui-ci devint son prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une maison de dieu » ou « une maison de dieux »; l’expression peut désigner ici un sanctuaire privé.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « il remplit la main de l’un de ses fils », expression qui signifie l’installer ou le consacrer au service sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית אֱלֹהִים
  choice: un sanctuaire
  rationale: Dans ce contexte de culte privé irrégulier, l’expression désigne naturellement un lieu de culte. « Sanctuaire » évite de trancher artificiellement entre le singulier « Dieu » et le pluriel contextuel « dieux »; une note conserve l’expression littérale et son ambiguïté.
- source_word: אֵפוֹד
  choice: un éphod
  rationale: Cet objet cultuel ancien n’a pas d’équivalent français simple; la translittération maintient la spécificité du terme.
- source_word: תְרָפִים
  choice: des idoles domestiques
  rationale: Le terme désigne des images cultuelles liées au foyer; cette formulation est claire en français moderne et convient au contexte.
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: il consacra
  rationale: L’idiome signifie littéralement « remplir la main » et désigne ici l’installation dans une fonction sacerdotale. « Consacra » exprime ce sens sans employer le terme plus confessionnel « ordonna ».
- source_word: אַחַד מִבָּנָיו
  choice: l’un de ses fils
  rationale: La formulation conserve exactement la construction partitive et la référence masculine de l’hébreu.
- source_word: וַיְהִי לוֹ לְכֹהֵן
  choice: qui devint son prêtre
  rationale: Cette tournure rend la conséquence de la consécration et identifie Mika comme celui au service duquel le fils devient prêtre.
- source_word: וְהָאִישׁ מִיכָה
  choice: Cet homme, Mika
  rationale: L’article et le nom peuvent reprendre Mika comme thème du récit. « Cet homme, Mika » garde cette texture discursive dans un français naturel, sans ajouter un marqueur temporel absent de l’hébreu.
theological_decisions:
- issue: L’expression בֵּית אֱלֹהִים peut-elle suggérer un culte légitime rendu à Dieu ?
  choice: un sanctuaire
  alternative: une maison de Dieu / une maison de dieux
  rationale: Le contexte associe ce lieu à un éphod, aux téraphim et à la nomination privée d’un fils comme prêtre. « Sanctuaire » décrit le lieu sans déclarer ce culte légitime ni imposer à אֱלֹהִים une lecture singulière ou plurielle; la note expose les possibilités.
translation_notes:
  register: Français international moderne, naturel et digne. Le vocabulaire cultuel précis est conservé (« éphod », « prêtre »), tandis que les idiomes hébreux opaques sont rendus clairement et documentés en notes.
