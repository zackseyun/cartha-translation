  text: וַ/יְמַלֵּ֤א מִיכָה֙ אֶת יַ֣ד הַ/לֵּוִ֔י וַ/יְהִי ל֥/וֹ הַ/נַּ֖עַר לְ/כֹהֵ֑ן וַ/יְהִ֖י בְּ/בֵ֥ית מִיכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/012.yaml
  text: So Micah ordained the Levite[a], and the young man became his priest and was in Micah’s house.
translation:
  language: fr
  text: Michée installa donc le Lévite comme prêtre[a]. Le jeune homme devint son prêtre et demeura dans la maison de Michée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « remplit la main du Lévite », expression qui signifie installer quelqu’un dans une fonction sacerdotale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֶת־יַד הַלֵּוִי
  choice: Michée investit donc le Lévite dans sa fonction
  rationale: L’expression idiomatique « remplir la main » désigne l’installation de quelqu’un dans une fonction sacerdotale. « Investir dans sa fonction » en communique le sens sans suggérer que cette installation irrégulière avait reçu l’approbation divine; le sens littéral est conservé en note.
- source_word: הַלֵּוִי
  choice: le Lévite
  rationale: Le terme désigne l’homme par son appartenance lévitique; « le Lévite » est la formulation française naturelle.
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: נַעַר peut désigner un garçon, un jeune homme ou un serviteur. Ici, puisqu’il agit de manière autonome et remplit une fonction cultuelle, « le jeune homme » convient au contexte.
- source_word: וַיְהִי לוֹ לְכֹהֵן
  choice: devint son prêtre
  rationale: La construction exprime l’entrée du jeune homme dans la fonction de prêtre au service de Michée. Cette formulation française rend à la fois la transition et la relation personnelle indiquée par לוֹ.
- source_word: וַיְהִי בְּבֵית מִיכָה
  choice: demeura dans la maison de Michée
  rationale: Dans ce contexte narratif, וַיְהִי suivi d’un lieu indique qu’il se trouvait ou résidait là. « Demeura » donne un français naturel et exprime sa présence établie dans la maison de Michée.
theological_decisions:
- issue: Décrire une installation sacerdotale privée sans en affirmer la légitimité
  choice: Michée investit donc le Lévite dans sa fonction
  alternative: Michée consacra le Lévite / Michée remplit la main du Lévite
  rationale: Le texte rapporte l’acte accompli par Michée sans déclarer que Dieu l’approuve. « Investit dans sa fonction » décrit l’installation sacerdotale tout en évitant la connotation potentiellement légitimante de « consacra ». La note préserve l’idiome hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste narrative et neutre quant à la légitimité du culte privé de Michée.
