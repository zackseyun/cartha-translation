  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/006.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: fr
  text: En ce temps-là, il n’y avait pas de roi en Israël ; chacun[a] faisait ce qui était juste à ses propres yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie le singulier masculin « un homme » dans un sens représentatif et distributif : « chacun ».'
    reason: Précision sur la forme grammaticale et la portée générale de אִישׁ.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: En ce temps-là
  rationale: Cette formule narrative situe rétrospectivement les événements. « En ce temps-là » est naturel en français moderne et conserve la valeur temporelle de l’hébreu.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: il n’y avait pas de roi en Israël
  rationale: La particule existentielle אֵין exprime ici l’absence d’un roi. Cette formulation française en rend directement le sens sans préciser si la remarque est seulement historique ou aussi critique.
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier masculin אִישׁ a ici une valeur distributive et représentative. « Chacun » exprime naturellement cette portée générale en français sans restreindre artificiellement l’énoncé aux seuls hommes.
- source_word: הַיָּשָׁר
  choice: ce qui était juste
  rationale: L’adjectif יָשָׁר désigne ce qui est droit, juste ou conforme à ce qui devrait être. « Ce qui était juste » conserve la portée évaluative de l’expression.
- source_word: בְּעֵינָיו
  choice: à ses propres yeux
  rationale: La locution hébraïque présente le jugement personnel comme critère. « À ses propres yeux » garde l’image du texte et sa dimension subjective.
- source_word: יַעֲשֶׂה
  choice: faisait
  rationale: Bien qu’il s’agisse morphologiquement d’un inaccompli, le contexte résume une conduite habituelle passée. L’imparfait français rend naturellement cette valeur coutumière.
theological_decisions:
- issue: Portée évaluative de l’absence de roi et de la conduite individuelle en Israël
  choice: Conserver la formulation descriptive et la critique implicite portée par « ce qui était juste à ses propres yeux ».
  alternative: Présenter le verset soit comme une simple indication politique neutre, soit comme une affirmation explicite que la monarchie constitue nécessairement le remède.
  rationale: Le refrain du livre des Juges évoque le désordre social et religieux, mais le verset n’énonce pas à lui seul une doctrine générale de la monarchie. La traduction préserve cette tension sans la résoudre.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « à ses propres yeux » conserve l’image hébraïque et sa force critique, tandis que l’imparfait exprime une pratique habituelle.
