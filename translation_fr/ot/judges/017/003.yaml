  text: וַ/יָּ֛שֶׁב אֶת אֶֽלֶף וּ/מֵאָ֥ה הַ/כֶּ֖סֶף לְ/אִמּ֑/וֹ וַ/תֹּ֣אמֶר אִמּ֡/וֹ הַקְדֵּ֣שׁ הִקְדַּ֣שְׁתִּי אֶת הַ/כֶּסֶף֩ לַ/יהוָ֨ה מִ/יָּדִ֜/י לִ/בְנִ֗/י לַֽ/עֲשׂוֹת֙ פֶּ֣סֶל וּ/מַסֵּכָ֔ה וְ/עַתָּ֖ה אֲשִׁיבֶ֥/נּוּ לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/003.yaml
  text: So he returned the eleven hundred pieces of silver to his mother[a], and his mother said, “I had solemnly dedicated the silver to Yahweh from my hand for my son, to make a carved image and a cast image[b]; so now I return it to you.”
translation:
  language: fr
  text: 'Il rendit les mille cent pièces d’argent à sa mère. Sa mère dit : « J’avais solennellement consacré cet argent à Yahweh, de ma main[a], pour mon fils, afin d’en faire une image sculptée et une image en métal fondu[b]. Maintenant, je te le rends. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « de ma main »; l’expression peut évoquer ce qui appartenait personnellement à la mère, ce qui provenait d’elle ou l’action accomplie par elle-même.
    reason: cultural_note
  - marker: b
    text: Ou « une image coulée ». L’hébreu coordonne « image sculptée » et « image en métal fondu » sans préciser clairement s’il s’agit de deux objets distincts ou de deux aspects d’un même objet.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: Il rendit
  rationale: Le hiphil de שוב exprime ici l’action de faire revenir, donc de rendre ce qui avait été pris. Le passé simple convient au registre narratif biblique en français.
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: les mille cent pièces d’argent
  rationale: L’unité n’étant pas explicitement nommée dans ce verset, « pièces d’argent » reste idiomatique sans ajouter trop sûrement « sicles ».
- source_word: הַקְדֵּשׁ הִקְדַּשְׁתִּי
  choice: J’avais solennellement consacré
  rationale: L’infinitif absolu joint au verbe conjugué renforce l’affirmation. « Solennellement consacré » conserve à la fois l’intensité et la portée cultuelle.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le nom divin יהוה est rendu directement par « Yahweh », conformément à sa fonction de nom propre dans le texte source.
- source_word: מִיָּדִי
  choice: de ma main
  rationale: Cette traduction proche de l’hébreu préserve l’ambiguïté entre provenance ou possession personnelle et intervention directe de la mère; une note explicite l’idiome.
- source_word: לִבְנִי
  choice: pour mon fils
  rationale: La préposition ל indique naturellement ici le bénéficiaire ou la personne en faveur de laquelle l’argent est consacré.
- source_word: פֶּסֶל
  choice: une image sculptée
  rationale: Cette expression concrète et moderne rend le caractère façonné ou taillé de l’objet sans introduire dans le terme lui-même le jugement explicite porté par « idole ».
- source_word: וּמַסֵּכָה
  choice: et une image en métal fondu
  rationale: מסכה désigne couramment un objet obtenu par fonte. La formulation française précise naturellement le procédé et la matière généralement impliquée.
- source_word: אֲשִׁיבֶנּוּ לָךְ
  choice: je te le rends
  rationale: L’imparfait hébreu peut exprimer l’action présente ou imminente. Le présent français rend ici la déclaration immédiate de la mère.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le Tétragramme. La translittération conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Consécration à Yahweh en vue de fabriquer des images
  choice: Conserver sans atténuation « consacré cet argent à Yahweh […] afin d’en faire une image sculptée et une image en métal fondu »
  alternative: Reformuler pour dissocier Yahweh de la fabrication des images ou qualifier explicitement celles-ci d’idoles
  rationale: L’hébreu juxtapose délibérément un langage de consécration et la fabrication d’images. La traduction préserve cette tension théologique sans la résoudre ni la justifier.
- issue: Rapport entre פֶּסֶל et מַסֵּכָה
  choice: une image sculptée et une image en métal fondu
  alternative: une image sculptée, c’est-à-dire une image en métal fondu
  rationale: La conjonction hébraïque permet de comprendre deux objets ou deux désignations étroitement associées. Le texte principal conserve la coordination formelle sans imposer qu’il s’agisse d’un seul objet.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient le registre narratif; le discours direct reste naturel. Les termes « image sculptée » et « image en métal fondu » décrivent les objets sans ajouter un jugement absent des mots eux-mêmes. Les marqueurs de notes ont été placés auprès des expressions hébraïques qu’ils expliquent.
