  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֹבְרִ֨ים אֲנַ֜חְנוּ מִ/בֵּֽית לֶ֣חֶם יְהוּדָה֮ עַד יַרְכְּתֵ֣י הַר אֶפְרַיִם֒ מִ/שָּׁ֣ם אָנֹ֔כִי וָ/אֵלֵ֕ךְ עַד בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וְ/אֶת בֵּ֤ית יְהוָה֙ אֲנִ֣י הֹלֵ֔ךְ וְ/אֵ֣ין אִ֔ישׁ מְאַסֵּ֥ף אוֹתִ֖/י הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/018.yaml
  text: He said to him[a], “We are passing through from Bethlehem in Judah to the remote parts of the hill country of Ephraim. I am from there, and I went to Bethlehem in Judah, and I am going to the house of Yahweh, but no man is taking me into his house.”
translation:
  language: fr
  text: 'Il lui dit : « Nous voyageons de Bethléem en Juda jusqu’aux confins de la région montagneuse d’Éphraïm. Je suis originaire de là. Je suis allé à Bethléem en Juda, et je vais à la maison de Yahweh[a] ; mais personne ne me reçoit dans sa maison. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je rentre chez moi » ou « je vais chez moi ». Certains comprennent ainsi l’hébreu de manière idiomatique ou supposent une autre lecture, car « la maison de Yahweh » paraît inattendu dans ce contexte.'
    reason: La lecture littérale du texte massorétique est contextuellement difficile, tandis qu’une interprétation ou une lecture alternative est largement envisagée.
lexical_decisions:
- source_word: עֹבְרִים אֲנַחְנוּ
  choice: Nous voyageons
  rationale: Le participe accompagné du pronom exprime un déplacement en cours. « Nous voyageons » est naturel en français et conserve l’idée de transit sans préciser indûment qu’ils ne font que traverser Bethléem.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: de Bethléem en Juda
  rationale: Cette formulation française naturelle distingue cette ville de toute autre Bethléem tout en conservant l’indication géographique.
- source_word: יַרְכְּתֵי הַר אֶפְרַיִם
  choice: aux confins de la région montagneuse d’Éphraïm
  rationale: יַרְכְּתֵי désigne les extrémités ou les parties reculées ; « aux confins » rend cette nuance avec concision. הַר אֶפְרַיִם désigne ici la région montagneuse d’Éphraïm.
- source_word: מִשָּׁם אָנֹכִי
  choice: Je suis originaire de là
  rationale: Cette expression idiomatique française communique clairement que le voyageur vient de cet endroit.
- source_word: וָאֵלֵךְ עַד בֵּית לֶחֶם יְהוּדָה
  choice: Je suis allé à Bethléem en Juda
  rationale: La forme narrative de הלך est rendue au passé, sans harmoniser la chronologie pourtant concise et quelque peu difficile du discours.
- source_word: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: et maintenant je vais à la maison de Yahweh
  rationale: Le texte massorétique porte explicitement « la maison de Yahweh ». « Maintenant » explicite légèrement la reprise du trajet sans modifier sa destination ; la difficulté contextuelle est conservée et signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme un nom propre plutôt que remplacé par un titre.
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה
  choice: mais personne ne m’accueille chez lui
  rationale: Dans ce contexte d’hospitalité, אסף signifie recevoir ou héberger. « Personne » est l’équivalent négatif naturel de אֵין אִישׁ en français, tandis que « chez lui » conserve l’idée d’une maison appartenant à l’hôte.
theological_decisions:
- issue: Sens de וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: je vais à la maison de Yahweh
  alternative: je rentre chez moi / je vais chez moi
  rationale: Le texte consonantique massorétique nomme explicitement « la maison de Yahweh ». Malgré la difficulté de cette destination dans le contexte, elle est maintenue dans le texte principal ; l’interprétation idiomatique ou la lecture différente est donnée en note afin de ne pas résoudre silencieusement l’ambiguïté.
- issue: Genre de אִישׁ dans la tournure négative
  choice: personne
  alternative: aucun homme
  rationale: Dans אֵין אִישׁ, אִישׁ participe à une tournure française naturellement rendue par « personne ». « Aucun homme » donnerait ici au sexe de l’hôte une saillance que la construction hébraïque n’exige pas nécessairement ; le masculin reste perceptible dans « chez lui ».
translation_notes:
  register: Français international moderne, clair et digne. Le discours reste direct et naturel. « Aux confins » garde une légère élévation de registre appropriée au récit biblique sans devenir archaïque.
