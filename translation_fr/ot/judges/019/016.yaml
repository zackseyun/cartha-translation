  text: וְ/הִנֵּ֣ה אִ֣ישׁ זָקֵ֗ן בָּ֣א מִֽן מַעֲשֵׂ֤/הוּ מִן הַ/שָּׂדֶה֙ בָּ/עֶ֔רֶב וְ/הָ/אִישׁ֙ מֵ/הַ֣ר אֶפְרַ֔יִם וְ/הוּא גָ֖ר בַּ/גִּבְעָ֑ה וְ/אַנְשֵׁ֥י הַ/מָּק֖וֹם בְּנֵ֥י יְמִינִֽי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/016.yaml
  text: And behold[a], an old man was coming in from his work in the field at evening. The man was from the hill country of Ephraim, and he was staying in Gibeah[b], but the men of the place were Benjaminites.
translation:
  language: fr
  text: Or voici qu’un vieil homme venait, le soir, de son travail aux champs. Cet homme était originaire de la région montagneuse d’Éphraïm et séjournait à Guibéa[a] ; les habitants de l’endroit, eux, étaient des Benjaminites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi se traduire par « résidait », « habitait » ou « vivait comme étranger ». Il peut suggérer qu’il n’était pas originaire de Guibéa, sans préciser son statut exact.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Or voici
  rationale: Conserve le marqueur narratif qui attire l’attention sur l’arrivée d’un nouveau personnage, dans une formulation française digne et naturelle.
- source_word: אִישׁ זָקֵן
  choice: un homme âgé
  rationale: Rend directement le nom et l’adjectif, avec une expression moderne et respectueuse.
- source_word: בָּא
  choice: revenait
  rationale: Dans ce contexte, le mouvement depuis son travail aux champs vers la ville implique naturellement un retour ; l’imparfait présente l’action en cours au moment où la scène s’ouvre.
- source_word: מִן מַעֲשֵׂהוּ מִן הַשָּׂדֶה
  choice: de son travail dans les champs
  rationale: Reproduit le double complément sans la répétition peu naturelle de « de », tout en conservant le travail et son cadre rural.
- source_word: בָּעֶרֶב
  choice: le soir
  rationale: Équivalent temporel courant et précis de l’expression hébraïque.
- source_word: מֵהַר אֶפְרַיִם
  choice: originaire de la région montagneuse d’Éphraïm
  rationale: Le syntagme est un nom géographique régional plutôt qu’une référence nécessairement limitée à une montagne précise.
- source_word: גָר בַּגִּבְעָה
  choice: résidait comme étranger à Guibéa
  rationale: Le verbe גור indique qu’il habitait là sans être originaire du lieu et peut évoquer le statut d’étranger résident ; cette formulation préserve mieux cette nuance que le simple « habitait ».
- source_word: וְאַנְשֵׁי הַמָּקוֹם
  choice: les habitants de l’endroit, eux
  rationale: Le pronom détaché exprime naturellement en français le contraste implicite entre l’origine de l’homme et celle de la population locale.
- source_word: בְּנֵי יְמִינִי
  choice: étaient des Benjaminites
  rationale: Rend idiomatiquement l’appartenance tribale exprimée en hébreu.
