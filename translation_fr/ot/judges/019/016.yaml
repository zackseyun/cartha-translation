revisions:
- from: Or voici qu’un homme âgé revenait, le soir, de son travail dans les champs. Cet homme était originaire de la région montagneuse d’Éphraïm et résidait comme étranger à Guibéa[a] ; les habitants de l’endroit, eux, étaient des Benjaminites.
  to: Or voici qu’un vieil homme venait, le soir, de son travail aux champs. Cet homme était originaire de la région montagneuse d’Éphraïm et séjournait à Guibéa[a] ; les habitants de l’endroit, eux, étaient des Benjaminites.
  rationale: Les révisions retirent deux précisions non explicites dans l’hébreu (« revenait » et le statut affirmé d’étranger résident), tout en conservant la nuance de séjour portée par גּוּר et le contraste entre cet homme originaire d’Éphraïm et les habitants benjaminites de Guibéa.
  reviewer_model: gpt-5.6-terra
