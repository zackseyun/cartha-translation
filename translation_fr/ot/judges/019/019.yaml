source:
  edition: WLC
  text: וְ/גַם תֶּ֤בֶן גַּם מִסְפּוֹא֙ יֵ֣שׁ לַ/חֲמוֹרֵ֔י/נוּ וְ֠/גַם לֶ֣חֶם וָ/יַ֤יִן יֶשׁ לִ/י֙ וְ/לַֽ/אֲמָתֶ֔/ךָ וְ/לַ/נַּ֖עַר עִם עֲבָדֶ֑י/ךָ אֵ֥ין מַחְס֖וֹר כָּל דָּבָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/019.yaml
  text: Yet there is both straw and fodder for our donkeys[a], and there is bread and wine for me, for your female servant, and for the young man with your servants[c][b]; there is no lack of anything.
translation:
  language: fr
  text: Il y a aussi de la paille et du fourrage pour nos ânes, ainsi que du pain et du vin pour moi, pour ta servante[a] et pour le jeune homme qui est avec tes serviteurs[b]. Il ne manque rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ta servante » est une manière déférente de désigner la femme qui voyage avec lui.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « avec tes serviteurs ». L''identification précise de ces serviteurs n''est pas explicitée dans cette formulation.'
    reason: textual_clarity
lexical_decisions:
- source_word: וְגַם ... גַּם ... וְגַם
  choice: aussi ... et ... ainsi que
  rationale: La répétition hébraïque de « aussi » ajoute avec insistance les diverses provisions. Le français varie légèrement les connecteurs pour rester naturel tout en conservant cette accumulation.
- source_word: תֶּבֶן
  choice: paille
  rationale: Désigne ici de la paille destinée aux animaux, traduction concrète et courante.
- source_word: מִסְפּוֹא
  choice: fourrage
  rationale: Désigne la nourriture destinée aux animaux et forme un couple naturel avec « paille ».
- source_word: לַחֲמוֹרֵינוּ
  choice: pour nos ânes
  rationale: Conserve le référent animal et le suffixe possessif de première personne du pluriel.
- source_word: לֶחֶם וָיַיִן
  choice: du pain et du vin
  rationale: Conserve les deux provisions concrètement nommées dans le texte.
- source_word: יֶשׁ לִי
  choice: il y a ... pour moi
  rationale: Reproduit la construction existentielle hébraïque plutôt que de la transformer en simple possession.
- source_word: אֲמָתֶךָ
  choice: ta servante
  rationale: Expression déférente par laquelle le voyageur désigne la femme qui l'accompagne en s'adressant à son hôte; « servante » est naturel et conserve le genre grammatical.
- source_word: לַנַּעַר
  choice: pour le jeune homme
  rationale: נַעַר peut désigner un jeune homme qui sert d'accompagnateur; cette traduction conserve la portée assez large du terme.
- source_word: עִם עֲבָדֶיךָ
  choice: qui est avec tes serviteurs
  rationale: Conserve littéralement le suffixe de deuxième personne et rattache naturellement le groupe prépositionnel au jeune homme, sans corriger la formulation inhabituelle du texte transmis.
- source_word: אֵין מַחְסוֹר כָּל דָּבָר
  choice: Il ne manque rien
  rationale: Rend de façon idiomatique l'affirmation hébraïque de suffisance totale.
