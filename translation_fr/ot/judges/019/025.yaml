source:
  edition: WLC
  text: וְ/לֹֽא אָב֤וּ הָ/אֲנָשִׁים֙ לִ/שְׁמֹ֣עַֽ ל֔/וֹ וַ/יַּחֲזֵ֤ק הָ/אִישׁ֙ בְּ/פִ֣ילַגְשׁ֔/וֹ וַ/יֹּצֵ֥א אֲלֵי/הֶ֖ם הַ/ח֑וּץ וַ/יֵּדְע֣וּ א֠וֹתָ/הּ וַ/יִּֽתְעַלְּלוּ בָ֤/הּ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וַֽ/יְשַׁלְּח֖וּ/הָ ב/עלות הַ/שָּֽׁחַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/025.yaml
  text: But the men were not willing to listen to him[a], so the man seized his concubine and brought her out to them. And they knew her and abused her all night until morning, and they let her go at the dawn.
translation:
  language: fr
  text: Mais ces hommes ne voulurent pas l’écouter. Alors l’homme saisit sa concubine et la fit sortir vers eux. Ils eurent des relations sexuelles avec elle[a] et la maltraitèrent toute la nuit jusqu’au matin. Puis ils la laissèrent partir au lever de l’aurore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans ce contexte, ces relations sexuelles lui sont imposées : ces hommes la violent collectivement.'
    reason: L’expression hébraïque emploie littéralement le verbe « connaître » comme euphémisme sexuel; la note explicite la violence coercitive du passage.
lexical_decisions:
- source_word: אָבוּ
  choice: ne voulurent pas
  rationale: Le verbe exprime ici le refus de consentir; cette tournure conserve la nuance de volonté sans ajouter de motif.
- source_word: לִשְׁמֹעַ לוֹ
  choice: l’écouter
  rationale: שׁמע avec ל peut signifier entendre, écouter ou obéir; dans ce contexte, « écouter » rend naturellement le rejet de sa demande.
- source_word: וַיַּחֲזֵק
  choice: saisit
  rationale: Le verbe indique une prise énergique ou contraignante; « saisit » en communique la force.
- source_word: פִּילַגְשׁוֹ
  choice: sa concubine
  rationale: « Concubine » est le terme français usuel correspondant à cette catégorie sociale biblique.
- source_word: וַיֹּצֵא אֲלֵיהֶם הַחוּץ
  choice: la fit sortir vers eux
  rationale: Le hiphil de יצא signifie « faire sortir ». La formulation française exprime le mouvement hors de la maison vers les hommes sans redondance maladroite.
- source_word: וַיֵּדְעוּ אוֹתָהּ
  choice: ils eurent des relations sexuelles avec elle
  rationale: Le sens sexuel de ידע est explicité en français moderne; le contexte coercitif est précisé en note afin de ne pas laisser entendre un consentement absent du récit.
- source_word: וַיִּתְעַלְּלוּ בָהּ
  choice: la maltraitèrent
  rationale: Le verbe désigne des sévices humiliants et violents; « maltraitèrent » garde son étendue sémantique sans atténuer les faits.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: toute la nuit jusqu’au matin
  rationale: Cette formulation naturelle conserve exactement la durée indiquée.
- source_word: וַיְשַׁלְּחוּהָ
  choice: ils la laissèrent partir
  rationale: שלח peut signifier renvoyer ou relâcher; ici, « laissèrent partir » convient à la cessation des violences et au renvoi de la femme.
- source_word: בַּעֲלוֹת הַשָּׁחַר
  choice: au lever de l’aurore
  rationale: La tournure conserve l’image littérale de l’aurore qui se lève dans une langue française digne et naturelle.
theological_decisions:
- issue: Caractère contraint de l’acte désigné par וַיֵּדְעוּ אוֹתָהּ
  choice: Formulation sexuelle explicite dans le texte, avec une note indiquant le viol collectif
  alternative: « Ils la connurent » ou directement « ils la violèrent »
  rationale: Le calque « connurent » serait aujourd’hui obscur et pourrait masquer la violence. « Ils eurent des relations sexuelles » traduit le sens lexical, tandis que la note rend explicite la contrainte incontestable du contexte sans substituer entièrement une interprétation juridique moderne à l’euphémisme hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe narrative reste directe. Le vocabulaire ne cherche ni à voiler la violence du texte ni à l’amplifier au-delà de ce qu’indiquent les verbes hébreux.
