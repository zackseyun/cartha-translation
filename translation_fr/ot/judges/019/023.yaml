base_translation:
  language: en
  yaml_path: translation/ot/judges/019/023.yaml
  text: Then the man[a], the master of the house, went out to them and said to them, “No, my brothers, please do not act wickedly. Since this man has come into my house, do not do this disgraceful thing.”
translation:
  language: fr
  text: 'Alors l’homme, le maître de la maison, sortit les trouver et leur dit : « Non, mes frères ! Je vous en prie, ne faites pas le mal. Puisque cet homme est entré dans ma maison, ne commettez pas cette infamie[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette chose honteuse » ou « cet acte révoltant ». Le terme hébreu désigne un acte honteux et moralement scandaleux.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבַּיִת
  choice: le maître de la maison
  rationale: L’expression désigne l’homme qui exerce l’autorité sur la maison. Cette formulation conserve l’idée de responsabilité et d’autorité domestiques sans réduire le sens à la seule propriété.
- source_word: אַחַי
  choice: mes frères
  rationale: Traduction directe de l’expression masculine hébraïque. Dans le contexte, l’homme s’adresse ainsi aux hommes de la ville comme à des membres de sa communauté.
- source_word: תָּרֵעוּ
  choice: n’agissez pas avec méchanceté
  rationale: Le verbe exprime ici une conduite moralement mauvaise. Cette tournure restitue la force éthique de la réprimande dans un français naturel.
- source_word: נָא
  choice: je vous en prie
  rationale: La particule marque une supplication pressante. « Je vous en prie » exprime mieux cette insistance que le seul « s’il vous plaît » dans ce contexte solennel.
- source_word: אַחֲרֵי אֲשֶׁר בָּא ... אֶל־בֵּיתִי
  choice: Puisque cet homme est entré dans ma maison
  rationale: La construction présente l’entrée de cet homme dans la maison comme la circonstance qui rend l’acte projeté d’autant plus inadmissible. « Puisque » rend naturellement cette valeur contextuelle, tandis que « est entré » exprime le mouvement vers l’intérieur.
- source_word: הַנְּבָלָה הַזֹּאת
  choice: cette infamie
  rationale: נְבָלָה désigne un acte honteux et moralement révoltant. « Infamie » en restitue la gravité avec concision; une note conserve d’autres nuances possibles.
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: sortit vers eux
  rationale: Cette traduction suit directement le mouvement exprimé par יצא et le complément directionnel, sans ajouter que l’homme les aurait rejoints.
