    issue: 'La note a donne une littéralité inexacte : « fils de vauriennerie ».'
    rationale: בְנֵי בְלִיַּעַל est traditionnellement analysé et rendu « fils de Bélial »; dans tous les cas, « vauriennerie » n’est pas une représentation exacte ni idiomatique de l’hébreu. La note doit éviter de présenter cette paraphrase comme littérale.
  - severity: low
    issue: « Se mirent à frapper » introduit une nuance de commencement qui n'est pas explicitement portée par le participe מִתְדַּפְּקִים.
    rationale: Le participe décrit les hommes en train de frapper répétitivement à la porte. « Tout en frappant violemment » ou « et frappaient violemment » respecte mieux cette concomitance.
