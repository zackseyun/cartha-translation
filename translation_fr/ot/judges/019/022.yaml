base_translation:
  language: en
  yaml_path: translation/ot/judges/019/022.yaml
  text: While they were making their hearts merry[a], behold, the men of the city, worthless men, surrounded the house, pounding on the door. They said to the old man, the master of the house, “Bring out the man who came into your house[b], so that we may know him.”
translation:
  language: fr
  text: 'Pendant qu’ils se réjouissaient, voici que les hommes de la ville, des vauriens[a], encerclèrent la maison, tout en frappant violemment à la porte. Ils dirent au vieil homme, le maître de la maison : « Fais sortir l’homme qui est entré chez toi, afin que nous le connaissions[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « des hommes, fils de Bélial » ; expression désignant des hommes pervers ou sans foi ni loi.
    reason: lexical_alternative
  - marker: b
    text: 'Ici, « connaître » est un euphémisme sexuel : ces hommes projetaient de lui faire subir une agression sexuelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיטִיבִים אֶת לִבָּם
  choice: se réjouissaient
  rationale: L’expression signifie littéralement qu’ils « rendaient leur cœur bon » et décrit ici leur plaisir festif. « Se réjouissaient » rend naturellement l’idiome en français moderne sans ajouter un élément absent du texte.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Ce marqueur attire l’attention sur le brusque retournement de la scène. « Voici que » en conserve la force narrative dans un registre digne.
- source_word: אַנְשֵׁי הָעִיר
  choice: les hommes de la ville
  rationale: Rendu direct du groupe nominal hébreu, naturel et précis en français.
- source_word: אַנְשֵׁי בְנֵי בְלִיַּעַל
  choice: des hommes sans foi ni loi
  rationale: L’expression idiomatique désigne des hommes moralement corrompus et rebelles à toute règle. Ce choix communique clairement leur caractère, tandis que la formulation hébraïque plus littérale est signalée en note.
- source_word: נָסַבּוּ אֶת הַבַּיִת
  choice: encerclèrent la maison
  rationale: Le verbe indique qu’ils se placèrent tout autour de la maison. « Encerclèrent » est concis et restitue la menace collective.
- source_word: מִתְדַּפְּקִים עַל הַדָּלֶת
  choice: se mirent à frapper violemment à la porte
  rationale: La forme participiale évoque des coups répétés et agressifs. Cette formulation est claire en français international et maintient l’intensité de l’action.
- source_word: בַּעַל הַבַּיִת
  choice: le maître de la maison
  rationale: L’expression désigne celui qui dirige la maisonnée et reçoit les hôtes. Ce rendu conserve son autorité sociale sans la réduire au seul statut juridique de propriétaire.
- source_word: הַזָּקֵן
  choice: le vieil homme
  rationale: Dans ce contexte, le terme décrit l’âge de l’hôte plutôt qu’une fonction officielle d’ancien.
- source_word: הוֹצֵא
  choice: Fais sortir
  rationale: L’impératif exige que l’hôte fasse sortir son invité. « Fais sortir » est direct et naturel.
- source_word: וְנֵדָעֶנּוּ
  choice: afin que nous le connaissions
  rationale: Le verbe « connaître » est ici un euphémisme sexuel, avec un écho littéraire à Genèse 19. L’idiome est conservé dans le texte et son intention violente est explicitée en note.
theological_decisions:
- issue: Rendu de l’euphémisme sexuel וְנֵדָעֶנּוּ
  choice: Conserver « afin que nous le connaissions » dans le texte et expliquer en note qu’il s’agit d’une agression sexuelle projetée.
  alternative: « afin que nous ayons des relations sexuelles avec lui » ou « afin que nous le violions »
  rationale: Le texte hébreu emploie intentionnellement le verbe « connaître » comme euphémisme et fait écho à Genèse 19. Le maintien de cette formulation respecte sa texture littéraire, tandis que la note empêche une lecture innocente et rend explicite la violence de l’intention.
translation_notes:
  register: Français international moderne, narratif et digne. Le texte privilégie des formulations immédiatement compréhensibles tout en conservant le marqueur dramatique « voici que » et l’euphémisme littéraire « connaître », clarifié par une note.
