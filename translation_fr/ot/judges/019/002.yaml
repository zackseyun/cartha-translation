  text: וַ/תִּזְנֶ֤ה עָלָי/ו֙ פִּֽילַגְשׁ֔/וֹ וַ/תֵּ֤לֶךְ מֵֽ/אִתּ/וֹ֙ אֶל בֵּ֣ית אָבִ֔י/הָ אֶל בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/תְּהִי שָׁ֕ם יָמִ֖ים אַרְבָּעָ֥ה חֳדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/002.yaml
  text: But his concubine was unfaithful to him[a], and she went away from him to her father's house, to Bethlehem in Judah, and was there for four months.
translation:
  language: fr
  text: Mais sa concubine lui fut infidèle[a]. Elle le quitta pour aller chez son père, à Bethléem de Juda, où elle resta quatre mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « se prostitua contre lui ». Certains interprètes anciens ont compris autrement cette proposition, par exemple : « elle se mit en colère contre lui » ou « elle se querella avec lui ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶה עָלָיו
  choice: lui fut infidèle
  rationale: Le verbe זנה désigne normalement l’inconduite sexuelle ou l’infidélité. Avec עָלָיו, « lui fut infidèle » exprime naturellement en français une faute commise envers l’homme sans introduire l’idée plus précise de prostitution commerciale.
- source_word: פִּילַגְשׁוֹ
  choice: sa concubine
  rationale: « Concubine » est le terme français traditionnel et concis pour une femme liée à un homme par une union reconnue, mais de statut inférieur à celui d’une épouse principale.
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: Elle le quitta
  rationale: Cette formulation rend à la fois le déplacement et la séparation exprimés par le verbe הלך avec מֵאִתּוֹ, dans un français narratif naturel.
- source_word: אֶל בֵּית אָבִיהָ
  choice: retourna chez son père
  rationale: L’hébreu dit littéralement qu’elle alla « à la maison de son père ». Dans le contexte d’un départ de chez l’homme, « retourna chez son père » en restitue naturellement le mouvement et la destination familiale.
- source_word: אֶל בֵּית לֶחֶם יְהוּדָה
  choice: à Bethléem en Juda
  rationale: Cette tournure identifie clairement la ville comme Bethléem située dans le territoire de Juda.
- source_word: וַתְּהִי שָׁם
  choice: où elle resta
  rationale: La formulation traduit idiomatiquement « elle fut là » en exprimant la permanence sur place impliquée par la durée qui suit.
- source_word: יָמִים אַרְבָּעָה חֳדָשִׁים
  choice: quatre mois
  rationale: L’expression hébraïque, littéralement « des jours, quatre mois », indique idiomatiquement une durée de quatre mois.
theological_decisions:
- issue: Sens de וַתִּזְנֶה dans ce récit moralement chargé
  choice: 'infidélité sexuelle : « lui fut infidèle »'
  alternative: « se prostitua contre lui » ; selon une ancienne tradition d’interprétation, « se mit en colère contre lui » ou « se querella avec lui »
  rationale: La vocalisation massorétique et l’emploi habituel de זנה favorisent le sens d’infidélité sexuelle. L’ancienne lecture moins accusatrice est néanmoins signalée en note afin de préserver la tension textuelle et interprétative sans l’imposer au texte principal.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe narrative est fluide tout en conservant les données essentielles de l’hébreu. Le terme « concubine » maintient la distinction sociale du texte source, et la note préserve l’ancienne lecture divergente de la première proposition.
