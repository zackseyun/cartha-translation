  text: וַ/יִּשָּׂ֣א עֵינָ֗י/ו וַ/יַּ֛רְא אֶת הָ/אִ֥ישׁ הָ/אֹרֵ֖חַ בִּ/רְחֹ֣ב הָ/עִ֑יר וַ/יֹּ֨אמֶר הָ/אִ֧ישׁ הַ/זָּקֵ֛ן אָ֥נָה תֵלֵ֖ךְ וּ/מֵ/אַ֥יִן תָּבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/017.yaml
  text: He looked up and saw the traveler in the open square of the city[a], and the old man said, “Where are you going[b], and where do you come from?”
translation:
  language: fr
  text: 'Il leva les yeux et vit le voyageur[a] sur la place de la ville[b]. Le vieil homme dit : « Où vas-tu et d’où viens-tu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme de passage ». Le terme hébreu désigne une personne en voyage et peut, dans un contexte d’hospitalité, en venir à désigner un invité.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la rue de la ville ». Le mot hébreu désigne plus précisément un large espace public, généralement une place.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Il leva les yeux
  rationale: Cette expression française conserve l’image de l’idiome hébreu tout en restant naturelle dans un récit.
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe exprime ici simplement la perception visuelle; « vit » est direct et non interprétatif.
- source_word: הָאִישׁ הָאֹרֵחַ
  choice: le voyageur
  rationale: אֹרֵחַ désigne ici un homme en déplacement. « Le voyageur » est clair et actuel, sans lui attribuer prématurément le statut d’invité.
- source_word: בִּרְחֹב הָעִיר
  choice: sur la place publique de la ville
  rationale: רְחוֹב désigne généralement un vaste espace public, une place, plutôt qu’une rue étroite. La préposition « sur » est idiomatique en français avec « place ».
- source_word: הָאִישׁ הַזָּקֵן
  choice: le vieil homme
  rationale: Cette formulation rend directement l’âge de l’homme et convient au registre narratif, sans la tonalité familière que pourrait avoir « le vieux ».
- source_word: אָנָה תֵלֵךְ
  choice: Où vas-tu
  rationale: La question porte sur la destination immédiate. Le présent français traduit naturellement l’imparfait hébreu dans ce dialogue.
- source_word: וּמֵאַיִן תָּבוֹא
  choice: et d’où viens-tu
  rationale: La tournure française exprime clairement le lieu d’origine et préserve le contraste entre destination et provenance.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement reflète l’adresse à une seule personne sans ajouter une nuance de politesse absente de l’hébreu. Les marqueurs de notes ont été placés auprès des expressions qu’ils expliquent.
