  text: So he brought him into his house and fed the donkeys[b][a]. Then they washed their feet and ate and drank.
translation:
  language: fr
  text: Il le fit entrer dans sa maison et prépara du fourrage pour les ânes[a]. Puis ils se lavèrent les pieds[b], mangèrent et burent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mélangea [du fourrage] pour les ânes ».'
    reason: lexical_alternative
  - marker: b
    text: Dans le Proche-Orient ancien, se laver les pieds faisait habituellement partie de l’accueil offert aux voyageurs.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִיאֵהוּ
  choice: Il le fit entrer
  rationale: Le hiphil de בוא exprime ici le fait de faire entrer ou d’amener quelqu’un. « Le fit entrer » rend naturellement le mouvement jusque dans la maison.
- source_word: לְבֵיתוֹ
  choice: dans sa maison
  rationale: Après un verbe de mouvement, לְ peut indiquer l’entrée dans un lieu. Cette formulation exprime clairement que l’homme accueille le Lévite à l’intérieur de sa demeure.
- source_word: וַיָּבָול
  choice: prépara du fourrage
  rationale: Le verbe בלל signifie littéralement « mélanger » et désigne ici la préparation de la nourriture des animaux. « Prépara du fourrage » conserve cette nuance tout en restant naturel en français.
- source_word: לַחֲמוֹרִים
  choice: pour les ânes
  rationale: חֲמוֹרִים désigne des ânes. La préposition לְ marque ici les animaux auxquels le fourrage est destiné.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: ils se lavèrent les pieds
  rationale: La formulation française rend directement l’action d’hospitalité exprimée par le pluriel hébreu, sans préciser davantage l’identité des personnes concernées.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: mangèrent et burent
  rationale: Cette traduction conserve la brièveté et la succession simple des actions dans le récit hébreu.
