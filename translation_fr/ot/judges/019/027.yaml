  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֨קָם אֲדֹנֶ֜י/הָ בַּ/בֹּ֗קֶר וַ/יִּפְתַּח֙ דַּלְת֣וֹת הַ/בַּ֔יִת וַ/יֵּצֵ֖א לָ/לֶ֣כֶת לְ/דַרְכּ֑/וֹ וְ/הִנֵּ֧ה הָ/אִשָּׁ֣ה פִֽילַגְשׁ֗/וֹ נֹפֶ֨לֶת֙ פֶּ֣תַח הַ/בַּ֔יִת וְ/יָדֶ֖י/הָ עַל הַ/סַּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/027.yaml
  text: Her master got up in the morning and opened the doors of the house and went out to go on his way[a], and behold, the woman, his concubine, was lying at the entrance of the house, with her hands on the threshold.
translation:
  language: fr
  text: Son maître se leva le matin, ouvrit les portes de la maison et sortit pour reprendre son chemin. Or voici que la femme, sa concubine, gisait[a] à l’entrée de la maison, les mains sur le seuil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « était tombée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֶיהָ
  choice: son maître
  rationale: Le nom אֲדוֹן avec le suffixe féminin singulier signifie « son maître » ou « son seigneur ». « Son maître » conserve ici l’asymétrie sociale exprimée par l’hébreu sans introduire le sens plus réciproque de « mari ».
- source_word: בַּבֹּקֶר
  choice: le matin
  rationale: Expression temporelle directe et naturelle en français moderne.
- source_word: דַּלְתוֹת הַבַּיִת
  choice: les portes de la maison
  rationale: Le pluriel hébreu דַּלְתוֹת est maintenu, ainsi que le cadre concret de la maison.
- source_word: וַיֵּצֵא לָלֶכֶת לְדַרְכּוֹ
  choice: sortit pour reprendre son chemin
  rationale: La tournure avec infinitif exprime le but. Cette formulation française conserve cette valeur tout en rendant naturellement l’idée de poursuivre sa route.
- source_word: וְהִנֵּה
  choice: or voici que
  rationale: הִנֵּה attire brusquement l’attention sur la scène découverte. « Voici que » en garde la force présentative, tandis que « or » assure l’enchaînement narratif.
- source_word: הָאִשָּׁה פִילַגְשׁוֹ
  choice: la femme, sa concubine
  rationale: La structure appositionnelle est conservée. « Concubine » est le terme français précis et usuel pour פִילֶגֶשׁ.
- source_word: נֹפֶלֶת
  choice: gisait
  rationale: Le participe décrit ici l’état ou la posture de la femme à l’entrée. « Gisait » rend cette image sans décider si elle était déjà morte; la valeur plus littérale de « tombée » est signalée en note.
- source_word: פֶּתַח הַבַּיִת
  choice: à l’entrée de la maison
  rationale: פֶּתַח désigne l’entrée ou l’ouverture; « à l’entrée de la maison » est clair et fidèle au lieu décrit.
- source_word: וְיָדֶיהָ עַל הַסַּף
  choice: les mains sur le seuil
  rationale: Cette proposition nominale est rendue par une construction détachée naturelle en français, tout en préservant l’image saisissante et le sens précis de סַף.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la syntaxe et des images hébraïques sans raideur inutile. Le texte ne précise ni ici l’état vital de la femme ni la nature conjugale exacte de la relation au-delà du terme « concubine ».
