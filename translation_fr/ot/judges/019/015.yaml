  yaml_path: translation/ot/judges/019/015.yaml
  text: They turned aside there to go in and spend the night at Gibeah[a]. He went in and sat down in the open square of the city[b], and there was no man gathering them into his house to spend the night.
translation:
  language: fr
  text: Ils se détournèrent de leur route pour entrer dans Guibéa et y passer la nuit. Il entra et s’assit sur la place de la ville[a], mais personne[b] ne les accueillit chez lui pour la nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la rue de la ville » ; le terme hébreu peut désigner une rue large ou une place publique.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « il n’y avait pas d’homme » : aucun habitant ne leur offrait l’hospitalité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֻרוּ
  choice: Ils se détournèrent donc de leur route
  rationale: Le verbe סור exprime ici le fait de quitter l’itinéraire suivi. Cette formulation française rend clairement le mouvement sans le réduire à un simple arrêt.
- source_word: לָבוֹא לָלוּן
  choice: pour entrer … et y passer la nuit
  rationale: בוא indique l’entrée dans la ville et לון le fait d’y rester pendant la nuit. La reprise par « y » donne une phrase naturelle en français.
- source_word: בַּגִּבְעָה
  choice: à Guibéa
  rationale: Le nom propre est rendu selon sa forme française courante; « à » convient naturellement à l’entrée dans une localité.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: Il entra et s’assit
  rationale: Le passage soudain du pluriel au singulier est conservé, le voyageur principal représentant le groupe.
- source_word: בִּרְחוֹב הָעִיר
  choice: sur la place de la ville
  rationale: רְחוֹב désigne ici vraisemblablement un large espace public, la place de la ville, tout en pouvant aussi signifier une rue.
- source_word: וְאֵין אִישׁ
  choice: mais personne
  rationale: Littéralement « et il n’y avait pas d’homme ». Dans ce contexte, le sens est qu’aucun habitant ne leur offrait l’hospitalité; « personne » est le tour français naturel, sans effacer la formulation littérale signalée en note.
- source_word: מְאַסֵּף אוֹתָם הַבַּיְתָה
  choice: ne les accueillit chez lui
  rationale: אָסַף signifie littéralement rassembler ou faire entrer. Dans ce contexte d’hospitalité, « accueillir chez lui » exprime naturellement le fait de faire entrer les voyageurs dans sa maison.
