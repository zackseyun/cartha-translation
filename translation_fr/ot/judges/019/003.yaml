base_translation:
  language: en
  yaml_path: translation/ot/judges/019/003.yaml
  text: Then her husband arose and went after her to speak to her heart and bring her back[a]. His young servant was with him, along with a pair of donkeys. She brought him into her father’s house, and when the young woman’s father saw him[b], he rejoiced to meet him.
translation:
  language: fr
  text: Alors son mari se leva et partit à sa suite pour parler à son cœur[a] et la ramener[b]. Il avait avec lui son jeune serviteur et une paire d’ânes. Elle le fit entrer dans la maison de son père. Quand le père de la jeune femme le vit, il se réjouit de le rencontrer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parler à son cœur » ; cette expression hébraïque désigne des paroles tendres, rassurantes ou persuasives.'
    reason: lexical_alternative
  - marker: b
    text: Le texte consonantique porte un suffixe masculin, « le ramener », mais le contexte indique qu’il voulait ramener la femme.
    reason: textual_variant
lexical_decisions:
- source_word: אִישָׁהּ
  choice: son mari
  rationale: Littéralement « son homme » ; dans cette relation conjugale, le français naturel et contextuellement juste est « son mari ».
- source_word: אַחֲרֶיהָ
  choice: à sa suite
  rationale: Exprime le mouvement de celui qui part après elle, dans un français narratif naturel.
- source_word: לְדַבֵּר עַל־לִבָּהּ
  choice: parler à son cœur
  rationale: Conserve l’image hébraïque, qui évoque des paroles tendres, rassurantes ou persuasives, sans trancher entre ces nuances.
- source_word: לַהֲשִׁיבוֹ
  choice: la ramener
  rationale: Le contexte indique que la femme est la personne qu’il veut faire revenir, malgré la difficulté du suffixe masculin dans le texte consonantique.
- source_word: נַעֲרוֹ
  choice: son jeune serviteur
  rationale: נַעַר peut désigner un jeune homme ou un serviteur ; ici, l’accompagnateur du voyageur remplit vraisemblablement la fonction de serviteur.
- source_word: צֶמֶד חֲמֹרִים
  choice: une paire d’ânes
  rationale: צֶמֶד désigne une paire, sans qu’il soit nécessaire d’affirmer explicitement que les ânes étaient attelés ensemble.
- source_word: וַתְּבִיאֵהוּ
  choice: elle le fit entrer
  rationale: Le verbe féminin a la jeune femme pour sujet ; dans le contexte d’une maison, « fit entrer » rend naturellement le mouvement vers l’intérieur.
- source_word: הַנַּעֲרָה
  choice: la jeune femme
  rationale: Rend le terme désignant une jeune femme sans employer le mot vieilli « jeune fille » au sens de « demoiselle » ni atténuer son statut d’adulte.
- source_word: וַיִּשְׂמַח לִקְרָאתוֹ
  choice: il se réjouit de venir à sa rencontre
  rationale: Rend à la fois la joie exprimée par וַיִּשְׂמַח et l’idée de mouvement à la rencontre de quelqu’un portée par לִקְרָאתוֹ.
