base_translation:
  language: en
  yaml_path: translation/ot/judges/019/005.yaml
  text: On the fourth day[a], they rose early in the morning, and he got up to go. But the young woman’s father said to his son-in-law, “Refresh your heart with a morsel of bread[b], and afterward you may go.”
translation:
  language: fr
  text: 'Le quatrième jour, ils se levèrent de bon matin, et il se leva pour partir. Mais le père de la jeune femme dit à son gendre : « Prends des forces[a] avec un morceau de pain ; après cela, vous pourrez partir[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Fortifie ton cœur avec un morceau de pain. » Cette expression signifie ici reprendre des forces en mangeant.'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe hébreu est au pluriel : le père s’adresse directement à son gendre, mais inclut vraisemblablement tout le groupe qui doit partir.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: Le quatrième jour
  rationale: Expression temporelle directe qui préserve la progression du récit sans ajouter « du séjour », absent de l’hébreu.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: ils se levèrent de bon matin
  rationale: Le verbe au pluriel désigne naturellement les personnes qui se préparent au départ ; « de bon matin » rend idiomatiquement l’idée de se lever tôt.
- source_word: וַיָּקָם לָלֶכֶת
  choice: et il se leva pour partir
  rationale: Le singulier recentre le récit sur le Lévite, et l’infinitif exprime le but de son action.
- source_word: אֲבִי הַנַּעֲרָה
  choice: le père de la jeune femme
  rationale: « Jeune femme » rend נַעֲרָה dans un français moderne sans suggérer indûment une enfant.
- source_word: חֲתָנוֹ
  choice: son gendre
  rationale: Dans ce contexte familial, le terme désigne clairement le Lévite par rapport au père de la jeune femme.
- source_word: סְעָד לִבְּךָ
  choice: Prends des forces
  rationale: L’expression hébraïque signifie littéralement soutenir ou fortifier le cœur ; dans ce contexte, elle invite à se restaurer avant le voyage. La formulation française en communique naturellement le sens, tandis que la note conserve l’image originale.
- source_word: פַּת לֶחֶם
  choice: avec un morceau de pain
  rationale: Cette traduction garde l’image concrète du pain et le ton d’hospitalité de la parole.
- source_word: וְאַחַר תֵּלֵכוּ
  choice: après cela, vous pourrez partir
  rationale: Le verbe hébreu est au pluriel et vise probablement l’ensemble des voyageurs. Le passage de « ton » à « vous » permet au français d’en refléter le nombre.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue reste naturel tout en préservant le contraste entre l’adresse individuelle (« ton » sous-entendu dans l’expression hébraïque) et le départ collectif (« vous »).
