  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲדֹנָ֔י/ו לֹ֤א נָסוּר֙ אֶל עִ֣יר נָכְרִ֔י אֲשֶׁ֛ר לֹֽא מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל הֵ֑נָּה וְ/עָבַ֖רְנוּ עַד גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/012.yaml
  text: But his master said to him[a], “We will not turn aside into a foreign city, which is not of the sons of Israel; rather, we will go on as far as Gibeah.”
translation:
  language: fr
  text: 'Mais son maître lui répondit : « Nous ne nous détournerons pas pour aller dans une ville étrangère, où ne vivent pas des Israélites[a]. Nous continuerons jusqu’à Guibéa. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils d’Israël ». « Des Israélites » est une formulation plus courante en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָיו
  choice: son maître
  rationale: Dans ce contexte narratif, le terme désigne le supérieur humain du serviteur, et non Dieu. « Maître » exprime naturellement cette relation sociale.
- source_word: נָסוּר
  choice: nous ne nous détournerons pas vers
  rationale: Le verbe סור signifie ici quitter l’itinéraire afin d’entrer dans une ville. Cette formulation conserve l’image directionnelle tout en restant naturelle en français.
- source_word: עִיר נָכְרִי
  choice: une ville étrangère
  rationale: נָכְרִי qualifie ce qui appartient à des étrangers ou à des non-Israélites. « Ville étrangère » est concis et idiomatique.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵנָּה
  choice: qui n’est pas de celles des fils d’Israël
  rationale: La formulation garde la référence grammaticale à la ville et préserve l’expression ethnique hébraïque « fils d’Israël », sans expliciter les habitants au-delà du texte source.
- source_word: וְעָבַרְנוּ
  choice: nous poursuivrons plutôt notre route
  rationale: עבר indique ici qu’ils continueront leur trajet au lieu de s’arrêter dans cette ville. « Poursuivre notre route » rend clairement ce sens en français courant.
- source_word: עַד גִּבְעָה
  choice: jusqu’à Guibéa
  rationale: עַד indique le terme du déplacement. « Jusqu’à Guibéa » en donne l’équivalent français naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. La syntaxe demeure proche de l’hébreu tout en évitant les tournures inutilement lourdes. Le nom propre גִּבְעָה est rendu selon la forme française biblique usuelle « Guibéa ».
