    text: 'Littéralement : « des fils d’Israël ». « Des Israélites » est une formulation plus courante en français.'
    reason: lexical_alternative
  revision_rationale: La révision remplace une construction française opaque par une relative locative qui correspond au sens contextuel de la clause hébraïque, tout en maintenant la note sur l’ethnonyme littéral. « Nous continuerons jusqu’à » rend directement la poursuite du voyage jusqu’à Guibéa, sans ajouter une opposition rhétorique inutile.
