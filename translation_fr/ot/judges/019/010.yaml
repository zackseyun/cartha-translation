base_translation:
  language: en
  yaml_path: translation/ot/judges/019/010.yaml
  text: But the man was not willing to spend the night. He rose and went and came opposite Jebus (that is[a], Jerusalem), and with him were a pair of saddled donkeys and his concubine.
translation:
  language: fr
  text: Mais l’homme ne consentit pas à passer la nuit. Il se leva, partit et arriva en face de Jébus (c’est-à-dire[a] Jérusalem). Il avait avec lui deux ânes sellés et sa concubine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « aux environs de Jébus » ou « jusqu’à un point situé devant Jébus ». L’expression hébraïque indique un lieu en face de la ville ou devant elle, sans préciser clairement qu’ils y étaient déjà entrés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: ne consentit pas
  rationale: Le verbe exprime la volonté ou le consentement. « Ne consentit pas » rend la décision délibérée sans lui prêter une hostilité que le texte n’énonce pas.
- source_word: לָלוּן
  choice: passer la nuit
  rationale: L’infinitif désigne précisément le fait de demeurer quelque part pour la nuit; cette formulation est naturelle en français moderne.
- source_word: וַיָּקָם וַיֵּלֶךְ וַיָּבֹא
  choice: Il se leva, partit et arriva
  rationale: La succession des trois verbes est conservée afin de respecter le rythme narratif, tout en employant des verbes idiomatiques en français.
- source_word: עַד נֹכַח
  choice: jusqu’en face de
  rationale: La locution situe l’arrivée devant ou vis-à-vis de Jébus, sans affirmer que l’homme est déjà entré dans la ville.
- source_word: יְבוּס הִיא יְרוּשָׁלָם
  choice: Jébus (c’est-à-dire Jérusalem)
  rationale: L’apposition identifie l’ancien nom Jébus à Jérusalem; les parenthèses rendent clairement cette précision narrative.
- source_word: צֶמֶד חֲמוֹרִים
  choice: deux ânes
  rationale: צֶמֶד désigne ici une paire d’animaux. « Deux ânes » est plus direct et naturel que « une paire d’ânes » en français courant.
- source_word: חֲבוּשִׁים
  choice: sellés
  rationale: Dans ce contexte de voyage, le participe désigne vraisemblablement des ânes équipés ou sellés; « sellés » constitue le rendu concis le plus naturel.
- source_word: פִּילַגְשׁוֹ
  choice: sa concubine
  rationale: Le terme hébreu désigne spécifiquement une concubine; le terme français établi préserve cette distinction sociale sans paraphrase interprétative.
