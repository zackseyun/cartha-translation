language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מֶ֖לֶךְ אֵ֣ין בְּ/יִשְׂרָאֵ֑ל וַ/יְהִ֣י אִ֣ישׁ לֵוִ֗י גָּ֚ר בְּ/יַרְכְּתֵ֣י הַר אֶפְרַ֔יִם וַ/יִּֽקַּֽח ל/וֹ֙ אִשָּׁ֣ה פִילֶ֔גֶשׁ מִ/בֵּ֥ית לֶ֖חֶם יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/001.yaml
  text: And it happened in those days[a], when there was no king in Israel, that a Levite man was dwelling in the remote parts of the hill country of Ephraim, and he took for himself a woman, a concubine[b], from Bethlehem in Judah.
translation:
  language: fr
  text: En ces jours-là, alors qu’il n’y avait pas de roi en Israël[a], un Lévite séjournait dans une partie reculée de la région montagneuse d’Éphraïm. Il prit pour lui une femme, une concubine[b], venant de Bethléem en Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et il n’y avait pas de roi en Israël ». En hébreu, la proposition est coordonnée et peut être comprise soit comme une affirmation distincte, soit comme l’arrière-plan temporel du récit.'
    reason: alternative_reading
  - marker: b
    text: « Concubine » désigne une femme engagée dans une union reconnue, mais dont le statut était distinct de celui d’une épouse ; il ne s’agit pas simplement d’une partenaire occasionnelle.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: En ces jours-là
  rationale: La formule ouvre un nouvel épisode et situe le récit. En français, « En ces jours-là » conserve le caractère littéraire du refrain sans reproduire lourdement la formule hébraïque וַיְהִי.
- source_word: וּמֶלֶךְ אֵין בְּיִשְׂרָאֵל
  choice: alors qu’il n’y avait pas de roi en Israël
  rationale: La proposition coordonnée fournit ici naturellement l’arrière-plan temporel et sociopolitique. Cette formulation reste neutre quant à l’évaluation de la monarchie.
- source_word: אִישׁ לֵוִי
  choice: un homme lévite
  rationale: Le choix conserve les deux éléments du texte hébreu, אִישׁ et לֵוִי, dans une expression française claire.
- source_word: גָּר
  choice: séjournait
  rationale: גור peut désigner le fait de résider comme étranger ou résident non pleinement établi. « Séjournait » garde cette nuance possible mieux que le simple « habitait », sans la préciser excessivement.
- source_word: בְּיַרְכְּתֵי הַר אֶפְרַיִם
  choice: dans une région reculée des montagnes d’Éphraïm
  rationale: יַרְכְּתֵי évoque les confins ou parties éloignées, tandis que הַר אֶפְרַיִם désigne la région montagneuse d’Éphraïm plutôt qu’un sommet unique.
- source_word: וַיִּקַּח לוֹ
  choice: Il prit pour lui
  rationale: La formulation conserve le pronom réfléchi לוֹ et le langage sobre de la prise en union, sans ajouter une catégorie juridique absente du verbe lui-même.
- source_word: אִשָּׁה פִילֶגֶשׁ
  choice: une femme, une concubine
  rationale: Les deux substantifs sont maintenus. Le second précise le statut social particulier de cette femme sans effacer le premier.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: originaire de Bethléem en Juda
  rationale: La préposition מִן indique ici son lieu d’origine. « Bethléem en Juda » distingue clairement cette ville d’autres lieux portant le même nom.
theological_decisions:
- issue: Le refrain des Juges sur l’absence de roi
  choice: alors qu’il n’y avait pas de roi en Israël
  alternative: et il n’y avait pas de roi en Israël
  rationale: La traduction présente la proposition comme arrière-plan circonstanciel tout en signalant en note sa coordination formelle. Elle n’en déduit ni approbation ni condamnation de la monarchie.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est fluide sans archaïsme. « Séjournait » préserve la possible situation de résident non établi ; « montagnes d’Éphraïm » rend la région géographique. Tous les marqueurs de notes figurent dans le texte.
