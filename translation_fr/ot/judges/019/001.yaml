    text: 'Ou : « et il n’y avait pas de roi en Israël ». En hébreu, la proposition est coordonnée et peut être comprise soit comme une affirmation distincte, soit comme l’arrière-plan temporel du récit.'
    reason: alternative_reading
  - marker: b
    text: « Concubine » désigne une femme engagée dans une union reconnue, mais dont le statut était distinct de celui d’une épouse ; il ne s’agit pas simplement d’une partenaire occasionnelle.
    reason: cultural_note
