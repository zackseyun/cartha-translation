revisions:
- from: En ces jours-là, alors qu’il n’y avait pas de roi en Israël[a], un homme lévite séjournait dans une région reculée des montagnes d’Éphraïm. Il prit pour lui une femme, une concubine[b], originaire de Bethléem en Juda.
  to: En ces jours-là, alors qu’il n’y avait pas de roi en Israël[a], un Lévite séjournait dans une partie reculée de la région montagneuse d’Éphraïm. Il prit pour lui une femme, une concubine[b], venant de Bethléem en Juda.
  rationale: Les révisions resserrent la fidélité à la géographie et à la préposition hébraïque, tout en conservant une formulation française moderne. Elles maintiennent l’ambiguïté syntaxique de la proposition sur l’absence de roi grâce à la note et décrivent פילגש sans imposer une reconstruction sociale ou juridique trop précise.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:41:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens de base est bien rendu : l’absence de roi, le Lévite résidant dans les parties éloignées de la région montagneuse d’Éphraïm, et la femme désignée comme concubine provenant de Bethléem de Juda. Toutefois, « originaire de » explicite une notion d’origine durable que la préposition מן n’impose pas ; « venant de » reste plus proche et plus neutre.'
  naturalness: Le français est globalement fluide et de registre narratif moderne. « Une partie reculée de la région montagneuse » est plus idiomatique et géographiquement précis que « une région reculée des montagnes ». « Un Lévite » est naturel en français et rend adéquatement איש לוי sans le calque un peu lourd « un homme lévite ».
  terminology: « Lévite », « région montagneuse d’Éphraïm », « Bethléem en Juda » et « concubine » conviennent. La note sur « concubine » doit éviter de présenter comme entièrement définies et uniformes les réalités sociales anciennes ; elle peut décrire sobrement le terme comme un statut distinct de celui d’une épouse, sans réduire la relation à un partenariat occasionnel.
  issues:
  - severity: low
    issue: « originaire de Bethléem en Juda » dépasse légèrement la portée de מן.
    rationale: Le texte dit littéralement qu’elle est « de/depuis » Bethléem de Juda. Dans ce contexte, cela peut indiquer sa provenance, mais n’exige pas l’affirmation plus précise d’une origine personnelle ; « venant de » préserve l’ouverture.
  - severity: low
    issue: La formulation géographique peut être affinée.
    rationale: הר אפרים désigne une région montagneuse, et ירכתי ses parties extrêmes ou reculées. « Une partie reculée de la région montagneuse d’Éphraïm » rend les deux éléments sans suggérer une région distincte.
  - severity: low
    issue: La note b formule le statut social de manière trop catégorique.
    rationale: פילגש désigne bien une concubine, distincte d’une épouse, mais les modalités sociales et juridiques variaient. Une note plus sobre informe sans surdéfinir une institution ancienne.
  revised_text: En ces jours-là, alors qu’il n’y avait pas de roi en Israël[a], un Lévite séjournait dans une partie reculée de la région montagneuse d’Éphraïm. Il prit pour lui une femme, une concubine[b], venant de Bethléem en Juda.
  revised_footnotes:
