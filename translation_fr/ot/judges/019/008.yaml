base_translation:
  language: en
  yaml_path: translation/ot/judges/019/008.yaml
  text: He got up early in the morning on the fifth day to go[a], but the young woman's father said, “Please strengthen your heart with a morsel of food, and wait until the day declines.” So the two of them ate.
translation:
  language: fr
  text: 'Le cinquième jour, il se leva de bon matin pour partir. Mais le père de la jeune femme lui dit : « Je t’en prie, reprends des forces[a], et attardez-vous jusqu’à ce que le jour décline. » Alors ils mangèrent tous les deux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Soutiens (ou fortifie) ton cœur. » Dans ce contexte, cette expression signifie prendre de la nourriture pour reprendre des forces.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: il se leva de bon matin
  rationale: La tournure rend à la fois l’idée de se lever tôt portée par שׁכם et l’indication temporelle בַּבֹּקֶר, dans un français narratif naturel.
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: Le cinquième jour
  rationale: Expression temporelle directe et idiomatique en français.
- source_word: לָלֶכֶת
  choice: pour partir
  rationale: הלך signifie littéralement « aller », mais l’infinitif exprime ici clairement l’intention de quitter les lieux; « partir » rend naturellement ce sens contextuel.
- source_word: אֲבִי הַנַּעֲרָה
  choice: le père de la jeune femme
  rationale: נַעֲרָה désigne ici une jeune femme; ce choix convient au contexte conjugal et évite le caractère diminutif de « jeune fille ».
- source_word: סְעָד נָא לְבָבְךָ
  choice: Reprends donc des forces[a]
  rationale: L’expression hébraïque dit littéralement de soutenir ou fortifier le cœur. Dans ce contexte de repas avant le voyage, elle signifie reprendre des forces en mangeant. La traduction rend l’idiome en français courant, tandis que la note conserve son image originale.
- source_word: וְהִתְמַהְמְהוּ
  choice: et attardez-vous
  rationale: Le hitpael de מהה exprime le fait de tarder ou de rester plus longtemps. Le pluriel de l’impératif hébreu est conservé, malgré le singulier de l’injonction précédente.
- source_word: עַד נְטוֹת הַיּוֹם
  choice: jusqu’à ce que le jour baisse
  rationale: La formule décrit le jour qui décline. « Le jour baisse » conserve cette image temporelle dans un français clair.
- source_word: וַיֹּאכְלוּ שְׁנֵיהֶם
  choice: Alors ils mangèrent tous les deux
  rationale: שְׁנֵיהֶם souligne explicitement les deux personnes. « Alors » exprime naturellement la suite narrative sans préciser davantage leur identité.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passage du singulier (« Reprends ») au pluriel (« attardez-vous ») reflète le changement de nombre présent dans l’hébreu au lieu de l’uniformiser.
