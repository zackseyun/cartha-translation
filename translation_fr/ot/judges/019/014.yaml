base_translation:
  language: en
  yaml_path: translation/ot/judges/019/014.yaml
  text: So they passed on and went their way[a], and the sun set on them near Gibeah, which belongs to Benjamin.
translation:
  language: fr
  text: Ils passèrent outre et poursuivirent leur route. Le soleil se coucha alors qu’ils étaient près de Guibéa, qui appartient à Benjamin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui se trouvait dans le territoire de Benjamin ». L’expression hébraïque rattache Guibéa à la tribu ou au territoire de Benjamin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: ils passèrent plus loin
  rationale: Dans cette suite narrative, le verbe עבר indique qu’ils dépassent l’endroit envisagé précédemment et continuent leur voyage. « Passèrent plus loin » exprime ce mouvement sans le réduire à un simple déplacement.
- source_word: וַיֵּלֵכוּ
  choice: poursuivirent leur route
  rationale: Le verbe הלך signifie couramment « aller » ou « marcher ». Cette formulation naturelle conserve le second verbe de mouvement du texte hébreu.
- source_word: וַתָּבֹא לָהֶם הַשֶּׁמֶשׁ
  choice: le soleil se coucha sur eux
  rationale: Littéralement, le soleil « vint pour eux » ; dans ce contexte de voyage, l’expression décrit le coucher du soleil qui les surprend en chemin.
- source_word: אֵצֶל
  choice: près de
  rationale: La préposition marque ici la proximité géographique ; « près de » est clair et idiomatique en français moderne.
- source_word: הַגִּבְעָה
  choice: Guibéa
  rationale: Bien que le nom commun puisse signifier « colline », le contexte et la précision qui suit montrent qu’il s’agit ici du nom de lieu Guibéa.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: qui appartient à Benjamin
  rationale: La tournure hébraïque exprime l’association de Guibéa avec Benjamin, probablement la tribu ou son territoire. La traduction principale conserve cette relation d’appartenance, tandis que la note signale la lecture géographique possible.
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Forme française traditionnelle et courante du nom propre désignant ici la tribu ou son territoire.
