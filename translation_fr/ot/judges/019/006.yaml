  yaml_path: translation/ot/judges/019/006.yaml
  text: So the two of them sat down together and ate and drank. Then the young woman's father said to the man[a], "Please, be willing to stay the night, and let your heart be glad."
translation:
  language: fr
  text: 'Ils s’assirent donc tous les deux, puis mangèrent et burent ensemble. Alors le père de la jeune femme dit à l’homme : « Je t’en prie, accepte de passer la nuit, et réjouis ton cœur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Ils s’assirent
  rationale: Dans l’enchaînement narratif qui introduit le repas, le verbe ישׁב désigne naturellement le fait de s’asseoir.
- source_word: וַיֹּאכְלוּ ... וַיִּשְׁתּוּ
  choice: puis mangèrent et burent
  rationale: Traduction directe des deux verbes de la chaîne narrative, sans ajouter de complément absent de l’hébreu.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: tous les deux ... ensemble
  rationale: Conserve l’insistance de la double expression hébraïque, tout en restant naturelle en français.
- source_word: אֲבִי הַנַּעֲרָה
  choice: le père de la jeune femme
  rationale: « Jeune femme » rend נַעֲרָה de manière actuelle et digne dans ce contexte.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Le contexte précise son identité, mais le texte hébreu emploie ici le terme général « l’homme ».
- source_word: הוֹאֶל נָא
  choice: Je t’en prie, accepte
  rationale: יאל exprime ici le consentement ou la bonne volonté, tandis que נָא marque une demande courtoise et insistante.
- source_word: וְלִין
  choice: de passer la nuit ici
  rationale: לון signifie loger ou demeurer pour la nuit. « Passer la nuit ici » est clair et idiomatique; « ici » explicite seulement la destination impliquée par l’invitation.
- source_word: וְיִטַב לִבֶּךָ
  choice: et que ton cœur soit dans la joie
  rationale: Cette formulation conserve l’image hébraïque du cœur et rend l’idée de bien-être et de réjouissance liée à l’hospitalité.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation préserve le langage concret du cœur sans employer l’expression vieillie « que ton cœur soit en liesse ». Aucun marqueur de note n’est nécessaire.
