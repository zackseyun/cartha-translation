revisions:
- from: 'Quand l’homme se leva pour partir avec sa concubine et son serviteur, son beau-père, le père de la jeune femme, lui dit : « Regarde, le jour décline, le soir approche. Je t’en prie, passez la nuit ici. Regarde, le jour touche à sa fin[a]. Passe la nuit ici et réjouis ton cœur. Demain, vous vous lèverez de bonne heure pour reprendre votre route[b], et tu rentreras chez toi[c]. »'
  to: 'L’homme se leva pour partir avec sa concubine et son serviteur, mais son beau-père, le père de la jeune femme, lui dit : « Regarde, le jour décline vers le soir. Je vous en prie, passez la nuit ici. Regarde, le jour touche à sa fin[a]. Passe la nuit ici, et que ton cœur se réjouisse. Demain, levez-vous de bonne heure pour votre voyage[b], et tu rentreras chez toi[c]. »'
  rationale: La révision corrige l’incohérence structurelle entre « t’ » et « passez » en faisant porter l’invitation sur le groupe, comme l’exige l’impératif pluriel hébreu. Elle conserve ensuite le singulier de « Passe la nuit » et de la destination finale, explicitement adressés à l’homme. Les autres ajustements améliorent la restitution de la valeur exhortative et de l’image du cœur sans modifier le sens.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:41:33Z'
review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement les principaux éléments du verset, y compris « concubine », le serviteur, le beau-père, le pluriel de לִינוּ, le singulier final et l’expression idiomatique « aller à sa tente ». Toutefois, « Je t’en prie, passez » mélange sans nécessité un pronom singulier avec un impératif pluriel. Il convient d’adresser cette invitation au groupe au pluriel, conformément à l’hébreu.
  naturalness: La formulation est globalement naturelle en français moderne. « Passez donc la nuit ici », puis « Passe la nuit ici », rend de manière claire l’alternance voulue entre le groupe et l’homme. L’impératif « levez-vous » est plus direct et idiomatique que le futur « vous vous lèverez » dans cette exhortation hospitalière.
  terminology: « Concubine », « serviteur », « beau-père » et « jeune femme » sont appropriés. « Rentreras chez toi » restitue naturellement l’expression conventionnelle « aller à sa tente », avec une note adéquate. « Que ton cœur se réjouisse » conserve l’image du cœur et exprime mieux la tournure jussive que « réjouis ton cœur ».
  issues:
  - severity: medium
    issue: Incohérence d’adresse dans « Je t’en prie, passez la nuit ici »
    rationale: לִינוּ נָא est un impératif pluriel, adressé au groupe des voyageurs. Le pronom singulier « t’ » n’est pas porté par le texte à cet endroit et produit une discordance grammaticale en français.
  - severity: low
    issue: « Vous vous lèverez » affaiblit la valeur exhortative de la proposition
    rationale: וְהִשְׁכַּמְתֶּם a une forme plurielle employée dans l’invitation du beau-père. L’impératif français « levez-vous » rend plus nettement cette fonction, tout en préservant le pluriel.
  - severity: low
    issue: « Réjouis ton cœur » est moins fidèle à la tournure hébraïque
    rationale: וְיִיטַב לְבָבֶךָ exprime le souhait que le cœur soit dans la joie ou le bien-être. « Que ton cœur se réjouisse » préserve mieux cette nuance et l’image hébraïque.
