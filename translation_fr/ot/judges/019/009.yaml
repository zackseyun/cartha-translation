  text: וַ/יָּ֤קָם הָ/אִישׁ֙ לָ/לֶ֔כֶת ה֥וּא וּ/פִילַגְשׁ֖/וֹ וְ/נַעֲר֑/וֹ וַ/יֹּ֣אמֶר ל֣/וֹ חֹתְנ֣/וֹ אֲבִ֣י הַֽ/נַּעֲרָ֡ה הִנֵּ֣ה נָא֩ רָפָ֨ה הַ/יּ֜וֹם לַ/עֲרֹ֗ב לִֽינוּ נָ֞א הִנֵּ֨ה חֲנ֤וֹת הַ/יּוֹם֙ לִ֥ין פֹּה֙ וְ/יִיטַ֣ב לְבָבֶ֔/ךָ וְ/הִשְׁכַּמְתֶּ֤ם מָחָר֙ לְ/דַרְכְּ/כֶ֔ם וְ/הָלַכְתָּ֖ לְ/אֹהָלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/009.yaml
  text: When the man rose to leave with his concubine and his attendant, his father-in-law, the young woman’s father, said to him, “Look, the day is waning toward evening. Please stay the night. Look, the day is nearly over[a]. Spend the night here and let your heart be glad. Then rise early tomorrow for your journey[b], and go home[c].”
translation:
  language: fr
  text: 'L’homme se leva pour partir avec sa concubine et son serviteur, mais son beau-père, le père de la jeune femme, lui dit : « Regarde, le jour décline vers le soir. Je vous en prie, passez la nuit ici. Regarde, le jour touche à sa fin[a]. Passe la nuit ici, et que ton cœur se réjouisse. Demain, levez-vous de bonne heure pour votre voyage[b], et tu rentreras chez toi[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le jour campe », image du jour qui s’installe ou arrive à son terme.'
    reason: source_image
  - marker: b
    text: « Levez-vous » est au pluriel et s’adresse au groupe de voyageurs ; « tu rentreras » est au singulier et s’adresse à l’homme.
    reason: grammar
  - marker: c
    text: 'Littéralement : « tu iras à ta tente », expression qui signifie ici rentrer chez soi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Le terme ordinaire אִישׁ désigne ici le personnage masculin sans préciser davantage son statut relationnel.
- source_word: פִילַגְשׁוֹ
  choice: sa concubine
  rationale: « Concubine » conserve la catégorie sociale et relationnelle propre au récit, sans l’atténuer en « femme ».
- source_word: נַעֲרוֹ
  choice: son serviteur
  rationale: Dans ce contexte de voyage, נַעַר désigne le jeune homme attaché à son service; « serviteur » exprime naturellement sa fonction en français.
- source_word: חֹתְנוֹ אֲבִי הַנַּעֲרָה
  choice: son beau-père, le père de la jeune femme
  rationale: L’apposition confirme que חֹתֵן désigne ici le beau-père; « jeune femme » convient mieux que « jeune fille » à ce contexte.
- source_word: רָפָה הַיּוֹם לַעֲרֹב
  choice: le jour décline, le soir approche
  rationale: Cette formulation française naturelle rend l’affaiblissement de la lumière du jour et son mouvement vers le soir.
- source_word: לִינוּ נָא
  choice: Je t’en prie, passez la nuit ici
  rationale: Le verbe est au pluriel et s’adresse au groupe de voyageurs, tandis que la particule נָא exprime l’insistance courtoise. Le passage au vouvoiement pluriel est signalé par le contraste entre « t’ » et « passez ».
- source_word: חֲנוֹת הַיּוֹם
  choice: le jour touche à sa fin
  rationale: La ligne principale communique le sens temporel de cette image inhabituelle; l’image littérale du jour qui campe est conservée en note.
- source_word: וְיִיטַב לְבָבֶךָ
  choice: réjouis ton cœur
  rationale: Cette expression conserve l’image hébraïque du cœur tout en restant claire et digne en français moderne.
- source_word: וְהִשְׁכַּמְתֶּם מָחָר
  choice: Demain, vous vous lèverez de bonne heure
  rationale: Le pluriel s’adresse à l’ensemble des voyageurs; le futur français a ici la valeur d’une proposition ou invitation dans le discours du beau-père.
- source_word: וְהָלַכְתָּ לְאֹהָלֶךָ
  choice: tu rentreras chez toi
  rationale: « Aller à sa tente » est ici une expression conventionnelle pour rentrer chez soi; une traduction littérale risquerait de faire croire que la destination réelle est une tente.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement correspond à l’échange familial. Le contraste grammatical entre le singulier adressé à l’homme et le pluriel adressé au groupe est conservé, malgré l’alternance volontaire « t’/passez ».
