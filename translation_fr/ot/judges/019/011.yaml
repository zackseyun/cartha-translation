  text: הֵ֣ם עִם יְב֔וּס וְ/הַ/יּ֖וֹם רַ֣ד מְאֹ֑ד וַ/יֹּ֨אמֶר הַ/נַּ֜עַר אֶל אֲדֹנָ֗י/ו לְכָ/ה נָּ֛א וְ/נָס֛וּרָה אֶל עִֽיר הַ/יְבוּסִ֥י הַ/זֹּ֖את וְ/נָלִ֥ין בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/011.yaml
  text: When they were near Jebus[a], and the day was far spent, the young man said to his master, “Please come[c][b], let us turn aside to this city of the Jebusites and spend the night in it.”
translation:
  language: fr
  text: 'Ils étaient près de Jebus[a], et le jour avait déjà bien décliné[b]. Le jeune homme[c] dit à son maître : « Viens, je t’en prie, faisons un détour vers cette ville des Jébusites et passons-y la nuit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jebus est l’ancien nom de Jérusalem.
    reason: cross_reference
  - marker: b
    text: 'Ou : « il se faisait très tard ».'
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu peut aussi désigner ici un serviteur ou un assistant.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם יְבוּס
  choice: Ils étaient près de Jebus
  rationale: Dans ce contexte de voyage, עִם suivi d’un nom de lieu exprime idiomatiquement la proximité. « Près de Jebus » rend naturellement ce sens.
- source_word: יְבוּס
  choice: Jebus
  rationale: Le texte hébreu emploie l’ancien nom de la ville; il est conservé plutôt que remplacé dans le corps du texte par « Jérusalem ».
- source_word: וְהַיּוֹם רַד מְאֹד
  choice: et le jour avait beaucoup baissé
  rationale: Cette formulation garde l’image hébraïque du jour qui décline tout en restant compréhensible en français moderne.
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: נַעַר peut désigner un garçon, un jeune homme ou, selon le contexte, un serviteur. La traduction retient le sens lexical non réducteur, tandis que la relation à son maître indique sa fonction.
- source_word: אֲדֹנָיו
  choice: son maître
  rationale: Dans cette relation sociale, אֲדוֹן désigne le supérieur auquel le jeune homme est attaché; « maître » convient mieux que « seigneur ».
- source_word: לְכָה נָּא
  choice: Allons, je t’en prie
  rationale: L’impératif de mouvement accompagné de נָא exprime une invitation pressante mais polie. Cette tournure française s’accorde naturellement avec la proposition à la première personne du pluriel qui suit.
- source_word: וְנָסוּרָה
  choice: faisons un détour
  rationale: Le cohortatif de סוּר invite à quitter l’itinéraire pour entrer dans la ville; « faisons un détour » en exprime clairement la force dans ce contexte.
- source_word: עִיר הַיְבוּסִי הַזֹּאת
  choice: cette ville des Jébusites
  rationale: Le gentilé singulier a ici une valeur collective. « Des Jébusites » désigne clairement le peuple auquel appartient la ville et conserve le démonstratif.
- source_word: וְנָלִין בָּהּ
  choice: et passons-y la nuit
  rationale: Le verbe לוּן signifie demeurer ou loger pour la nuit. « Passons-y la nuit » est précis et idiomatique.
theological_decisions: []
