  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ ק֥וּמִי וְ/נֵלֵ֖כָה וְ/אֵ֣ין עֹנֶ֑ה וַ/יִּקָּחֶ֨/הָ֙ עַֽל הַ/חֲמ֔וֹר וַ/יָּ֣קָם הָ/אִ֔ישׁ וַ/יֵּ֖לֶךְ לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/028.yaml
  text: He said to her[a], “Get up, and let us go.” But there was no answer. Then he put her on the donkey[c][b], and the man rose and went to his place.
translation:
  language: fr
  text: 'Il lui dit : « Lève-toi, et partons. » Mais personne ne répondit[a]. Alors il la plaça sur l’âne[b]. Puis l’homme se leva et s’en alla chez lui[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’y avait personne qui répondait » ou « il n’y avait pas de répondant ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il la prit sur l’âne ». Le verbe hébreu signifie littéralement « prendre » ; il a ici le sens de la placer ou de la soulever sur l’animal.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « s’en alla vers son lieu ». L’hébreu porte littéralement : « vers son lieu » ; dans ce contexte, il s’agit vraisemblablement de chez lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Il lui dit
  rationale: Rend naturellement la séquence narrative au passé simple, sans reprendre mécaniquement le ו initial.
- source_word: קוּמִי
  choice: Lève-toi
  rationale: Impératif féminin singulier de קום, adressé à la femme ; formulation courante qui conserve le lien lexical avec « se leva » plus loin dans le verset.
- source_word: וְנֵלֵכָה
  choice: et partons
  rationale: Le cohortatif à la première personne du pluriel exprime ici une exhortation commune ; « partons » est naturel et concis.
- source_word: וְאֵין עֹנֶה
  choice: Mais personne ne répondit
  rationale: L’expression signifie littéralement qu’il n’y avait personne répondant. La conjonction adversative rend le contraste contextuel sans modifier le sens.
- source_word: וַיִּקָּחֶהָ עַל הַחֲמוֹר
  choice: Alors il la plaça sur l’âne
  rationale: לקח signifie fondamentalement « prendre », mais la construction avec « sur l’âne » décrit ici l’action de mettre ou de soulever la femme sur l’animal.
- source_word: וַיָּקָם הָאִישׁ
  choice: Puis l’homme se leva
  rationale: Conserve distinctement l’action de se lever avant celle de partir, ainsi que la reprise de la racine קום employée dans l’ordre « Lève-toi ».
- source_word: וַיֵּלֶךְ לִמְקֹמוֹ
  choice: et s’en alla chez lui
  rationale: Dans ce contexte, « son lieu » désigne vraisemblablement le lieu où il demeure. « Chez lui » est idiomatique en français, tandis qu’une note conserve la formulation plus littérale.
