base_translation:
  language: en
  yaml_path: translation/ot/judges/019/013.yaml
  text: He said to his young man[a], “Come, and let us draw near to one of these places[b], and spend the night in Gibeah or in Ramah.”
translation:
  language: fr
  text: 'Il dit à son jeune homme[a] : « Allons, approchons-nous de l’un de ces endroits et passons la nuit à Guibéa ou à Rama. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son serviteur » ou « son assistant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ
  choice: à son jeune serviteur
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un assistant. Dans ce contexte, il s’agit de l’homme qui accompagne et sert le lévite ; « jeune serviteur » conserve à la fois l’idée de jeunesse et sa fonction.
- source_word: לְךָ
  choice: Allons
  rationale: L’impératif de הלך signifie littéralement « va », mais, suivi du cohortatif pluriel, il invite ici le compagnon à poursuivre la route avec le locuteur. « Allons » rend naturellement cette exhortation commune en français.
- source_word: וְנִקְרְבָה
  choice: approchons-nous
  rationale: Le cohortatif exprime une proposition ou une résolution commune. « Approchons-nous » conserve le sens de mouvement vers un lieu.
- source_word: בְּאַחַד הַמְּקֹמוֹת
  choice: de l’une de ces villes
  rationale: מָקוֹם signifie littéralement « lieu », mais Guibéa et Rama sont les localités envisagées. « Villes » explicite naturellement le référent dans ce contexte, tandis que « l’une de ces » rend le choix entre les destinations proches.
- source_word: וְלַנּוּ
  choice: et passons la nuit
  rationale: Le verbe לון désigne le fait de loger ou de passer la nuit. Cette formulation est claire et courante en français moderne.
- source_word: בַגִּבְעָה
  choice: à Guibéa
  rationale: Le nom de lieu est translittéré selon l’usage biblique français courant ; « à » est la préposition naturelle devant un nom de ville.
- source_word: בָרָמָה
  choice: à Rama
  rationale: Le nom de lieu est translittéré selon l’usage biblique français courant, parallèlement à Guibéa.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’exhortation « Allons » évite un littéralisme maladroit de לְךָ, et la coordination conserve le rythme direct du discours.
