base_translation:
  language: en
  yaml_path: translation/ot/judges/019/026.yaml
  text: The woman came as morning was dawning and fell at the entrance of the house of the man where her master was[b][a], until it was light.
translation:
  language: fr
  text: À l’approche du matin, la femme vint et tomba à l’entrée de la maison de l’homme où se trouvait son maître[a], jusqu’à ce qu’il fasse jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son seigneur ». L’hébreu emploie un terme d’autorité et ne dit pas explicitement « son mari ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: revint
  rationale: Le verbe signifie fondamentalement « venir », mais le contexte immédiat indique qu’elle revient vers la maison d’où elle avait été livrée. « Revint » exprime naturellement en français ce mouvement contextuel sans modifier l’identité du lieu.
- source_word: לִפְנוֹת הַבֹּקֶר
  choice: à l’approche du matin
  rationale: L’expression idiomatique évoque le moment où le matin commence à poindre. Cette formulation naturelle conserve l’idée de transition sans réduire le sens au seul instant de l’aube.
- source_word: וַתִּפֹּל
  choice: tomba
  rationale: « Tomba » rend directement נפל et préserve la sobriété brutale du récit. « S’effondra » préciserait davantage que ne le fait le verbe hébreu.
- source_word: פֶּתַח בֵּית
  choice: à l’entrée de la maison
  rationale: פֶּתַח désigne l’ouverture ou l’entrée. Cette tournure est claire et idiomatique en français moderne.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Le texte hébreu emploie le nom ordinaire אִישׁ. Le désigner plus précisément comme le propriétaire ou le vieillard ajouterait une information tirée du contexte.
- source_word: אֲשֶׁר אֲדוֹנֶיהָ שָּׁם
  choice: chez qui se trouvait son maître
  rationale: La relative locative est rendue naturellement en français. « Son maître » conserve le rapport d’autorité exprimé par אָדוֹן sans transformer explicitement celui-ci en relation conjugale.
- source_word: עַד הָאוֹר
  choice: jusqu’au lever du jour
  rationale: L’expression indique la durée jusqu’à l’arrivée de la lumière du jour. « Lever du jour » est une formulation française naturelle qui garde la valeur temporelle.
theological_decisions:
- issue: Nature de la relation exprimée par אֲדוֹנֶיהָ
  choice: son maître
  alternative: son mari / son seigneur
  rationale: Le mot hébreu exprime ici l’autorité du Lévite sur la femme, sans le qualifier explicitement de mari. « Maître » préserve cette tension sociale et narrative; « seigneur » serait archaïsant et « mari » interpréterait davantage le rapport.
translation_notes:
  register: Français moderne, sobre et narratif. La formulation évite l’archaïsme tout en conservant la dureté et l’ambiguïté relationnelle du texte hébreu.
