  text: הִנֵּה֩ בִתִּ֨/י הַ/בְּתוּלָ֜ה וּ/פִֽילַגְשֵׁ֗/הוּ אוֹצִֽיאָה נָּ֤א אוֹתָ/ם֙ וְ/עַנּ֣וּ אוֹתָ֔/ם וַ/עֲשׂ֣וּ לָ/הֶ֔ם הַ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם וְ/לָ/אִ֤ישׁ הַ/זֶּה֙ לֹ֣א תַעֲשׂ֔וּ דְּבַ֖ר הַ/נְּבָלָ֥ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/024.yaml
  text: Look[a], here are my virgin daughter and his concubine. Please let me bring them out. Violate them and do to them what is good in your eyes[c][b]. But to this man do not do this outrageous thing.
translation:
  language: fr
  text: « Voici ma fille vierge et sa concubine. Laissez-moi, je vous prie, les faire sortir. Violez-les[a] et faites-leur ce qui est bon à vos yeux[b]. Mais ne commettez pas contre cet homme une telle infamie[c]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Humiliez-les ». Le verbe hébreu peut désigner, dans ce contexte, une humiliation infligée par violence sexuelle.
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque signifiant « ce qui vous semblera bon » ou « ce qui vous plaira ».
    reason: cultural_note
  - marker: c
    text: Ou « cet acte odieux » ou « cette action honteuse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Interjection déictique qui attire immédiatement l’attention; « Voici » est naturel, direct et digne en français moderne.
- source_word: בִתִּי הַבְּתוּלָה
  choice: ma fille, qui est vierge
  rationale: Rend explicitement la qualification בְּתוּלָה sans la réduire au seul statut social de femme non mariée.
- source_word: וּפִילַגְשֵׁהוּ
  choice: et sa concubine
  rationale: « Concubine » est le terme français conventionnel et précis pour פִּילֶגֶשׁ dans ce cadre social ancien.
- source_word: אוֹצִיאָה נָּא אוֹתָם
  choice: Laissez-moi, je vous prie, les faire sortir
  rationale: Le cohortatif accompagné de נָא exprime à la fois la volonté du locuteur et une supplication pressante.
- source_word: וְעַנּוּ אוֹתָם
  choice: Violentez-les
  rationale: Au piel, ענה peut désigner ici une humiliation infligée par violence sexuelle. « Violentez-les » conserve cette force sans imposer dans le corps du texte une précision supérieure à celle du verbe pris isolément.
- source_word: וַעֲשׂוּ לָהֶם הַטּוֹב בְּעֵינֵיכֶם
  choice: faites-leur ce qui est bon à vos yeux
  rationale: 'Conserve l’image hébraïque des yeux et son sens idiomatique: faire ce qui paraît bon ou plaît aux interlocuteurs.'
- source_word: וְלָאִישׁ הַזֶּה לֹא תַעֲשׂוּ
  choice: Mais ne commettez pas envers cet homme
  rationale: La mise en tête du complément marque un contraste choquant avec les deux femmes proposées; « envers » restitue naturellement la relation exprimée par לְ.
- source_word: דְּבַר הַנְּבָלָה הַזֹּאת
  choice: un acte aussi infâme
  rationale: נְבָלָה désigne ici une conduite honteuse et moralement abjecte, non une simple sottise. « Acte infâme » communique clairement cette condamnation.
theological_decisions:
- issue: Degré d’explicitation de la violence sexuelle
  choice: Employer « Violentez-les » dans le texte et signaler « Violez-les » en note
  alternative: Violez-les; humiliez-les; maltraitez-les
  rationale: Le contexte rend la violence sexuelle manifeste, mais le verbe ענה porte aussi l’idée d’humiliation et d’oppression. Cette solution ne dissimule pas l’horreur du propos tout en préservant l’étendue sémantique du terme.
- issue: Contraste moral entre le traitement proposé pour les femmes et celui refusé pour l’homme
  choice: Conserver sans commentaire correctif le contraste formulé par le personnage
  alternative: Reformuler pour condamner explicitement toute l’offre
  rationale: Le récit rapporte une proposition atroce sans que le traducteur doive la justifier ni réécrire le jugement du personnage. Maintenir la tension permet au lecteur de percevoir toute l’horreur narrative.
- issue: Valeur morale de נְבָלָה
  choice: un acte aussi infâme
  alternative: cette infamie; cet acte odieux; cette folie
  rationale: Le terme exprime une transgression grave et honteuse des normes morales et communautaires; « folie » serait trop faible ou ambigu en français contemporain.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe reste proche de l’hébreu lorsque son étrangeté sert la tension du récit, notamment dans « ce qui est bon à vos yeux ». Le vocabulaire ne cherche ni à atténuer la violence sexuelle ni à ajouter une condamnation éditoriale absente de la parole rapportée.
