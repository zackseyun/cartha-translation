review_pass:
  verdict: revise
  source_fidelity: 'La structure et les référents du texte hébreu sont globalement bien rendus : la fille vierge, la concubine de l’homme, la supplique cohortative, l’idiome « bon à vos yeux » et la défense finale sont conservés. Toutefois, « un acte aussi infâme » introduit en français une comparaison sans terme de référence et rend moins précisément le démonstratif hébreu « cette ... infamie ». Dans ce contexte narratif, ענה suivi de « faites-leur ce qui est bon à vos yeux » désigne clairement une violence sexuelle ; « Violez-les » est plus net et plus idiomatique que « Violentez-les ».'
  naturalness: Le registre est moderne et digne. « Voici ma fille, qui est vierge » est correct, mais « ma fille vierge » est plus direct et naturel dans cette énumération. « Violentez-les » est possible au sens de brutaliser, mais demeure inhabituel et moins précis en français actuel. La formulation finale révisée est idiomatique et ne comporte plus la comparaison maladroite de « aussi infâme ».
  terminology: « Concubine » est le terme établi et approprié. « Violez-les » rend sans euphémisme injustifié la violence sexuelle que le contexte impose, sans faire appel à une qualification juridique moderne. « Infamie » rend bien נְבָלָה, qui qualifie une action gravement honteuse et abjecte.
  issues:
  - severity: medium
    issue: « Violentez-les » est trop large et peu idiomatique dans ce contexte.
    rationale: Le verbe français peut désigner toute brutalisation. Le contexte immédiat de l’offre des femmes à une foule hostile établit le sens de violence sexuelle de ענה ; « Violez-les » le rend clairement en français moderne.
  - severity: medium
    issue: « un acte aussi infâme » est sémantiquement et stylistiquement défectueux.
    rationale: « Aussi » appelle normalement un comparant exprimé ou implicite. L’hébreu emploie le démonstratif « cette » ; « une telle infamie » conserve cette valeur sans ajouter de comparaison.
