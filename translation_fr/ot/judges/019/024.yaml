revisions:
- from: « Voici ma fille, qui est vierge, et sa concubine. Laissez-moi, je vous prie, les faire sortir. Violentez-les[a] et faites-leur ce qui est bon à vos yeux[b]. Mais ne commettez pas envers cet homme un acte aussi infâme[c]. »
  to: « Voici ma fille vierge et sa concubine. Laissez-moi, je vous prie, les faire sortir. Violez-les[a] et faites-leur ce qui est bon à vos yeux[b]. Mais ne commettez pas contre cet homme une telle infamie[c]. »
  rationale: La révision remplace un verbe français trop général par le terme qui communique clairement le sens contextuel de la proposition, tout en conservant en note l’alternative plus littérale. Elle corrige aussi la finale pour rendre le démonstratif et la condamnation morale de l’hébreu dans un français naturel, sans modifier l’horreur ni la tension morale de la parole rapportée.
