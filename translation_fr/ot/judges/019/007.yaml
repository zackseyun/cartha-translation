base_translation:
  language: en
  yaml_path: translation/ot/judges/019/007.yaml
  text: Then the man got up to go[a], but his father-in-law urged him, so he turned back and spent the night there.
translation:
  language: fr
  text: Alors l’homme se leva pour partir, mais son beau-père le pressa[a] ; il revint et passa la nuit là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « insista vivement auprès de lui » ; le verbe hébreu évoque une insistance persistante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le qal narratif de קום décrit le fait de se lever en vue d’agir; « se leva » restitue directement cette étape préparatoire.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: אִישׁ désigne ici le Lévite, mais le texte emploie le terme narratif général « l’homme » plutôt qu’un titre relationnel.
- source_word: לָלֶכֶת
  choice: pour partir
  rationale: L’infinitif de הלך après קום exprime le but. Dans ce contexte, « partir » est plus naturel en français que « aller » tout en conservant l’idée de départ.
- source_word: וַיִּפְצַר בּוֹ
  choice: insista auprès de lui
  rationale: פצר ב exprime une sollicitation pressante et persistante. Cette tournure française en communique la force sans préciser explicitement ce que le beau-père lui demandait.
- source_word: חֹתְנוֹ
  choice: son beau-père
  rationale: Dans le contexte, חֹתֵן désigne clairement le père de la femme par rapport à l’homme; « beau-père » est l’équivalent français courant et précis.
- source_word: וַיָּשָׁב
  choice: il revint donc
  rationale: שׁוב signifie revenir ou retourner. « Revint » maintient le mouvement de retour exprimé par l’hébreu; « donc » rend naturellement le lien consécutif de la narration.
- source_word: וַיָּלֶן שָׁם
  choice: passa la nuit là
  rationale: לון signifie loger ou passer la nuit. La formulation retenue est claire, actuelle et conserve le sens temporel.
