base_translation:
  language: en
  yaml_path: translation/ot/judges/019/004.yaml
  text: And his father-in-law[a], the young woman's father, urged him to stay, and he remained with him three days; and they ate and drank, and spent the nights there.
translation:
  language: fr
  text: Son beau-père[a], le père de la jeune femme, insista pour qu’il reste, et il resta avec lui trois jours ; ils mangèrent et burent, et y passèrent les nuits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « eut le dessus sur lui », « le pressa » ou « le retint ». L’expression hébraïque dit littéralement que son beau-père « fut fort avec ou contre lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק בּוֹ
  choice: insista pour qu’il reste
  rationale: L’expression חזק ב décrit une forte insistance exercée sur quelqu’un. Le contexte immédiat indique que le père voulait le faire rester ; cette formulation rend cette implication sans aller jusqu’à suggérer une contrainte physique.
- source_word: חֹתְנוֹ
  choice: son beau-père
  rationale: Le terme désigne ici le père de la femme par rapport au Lévite ; « beau-père » est le terme de parenté naturel en français.
- source_word: אֲבִי הַנַּעֲרָה
  choice: le père de la jeune femme
  rationale: L’apposition précise l’identité du beau-père. « Jeune femme » convient au contexte matrimonial et rend נַעֲרָה sans lui donner une connotation enfantine.
- source_word: וַיֵּשֶׁב אִתּוֹ
  choice: Il resta donc chez lui
  rationale: ישב signifie ici demeurer ou rester. « Chez lui » rend naturellement אִתּוֹ dans ce contexte d’hospitalité, et « donc » explicite le lien narratif résultant de l’insistance.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: pendant trois jours
  rationale: Expression temporelle directe ; la préposition « pendant » est idiomatique en français.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: ils mangèrent et burent
  rationale: Les deux verbes simples sont conservés plutôt que résumés de façon interprétative par « ils festoyèrent ».
- source_word: וַיָּלִינוּ שָׁם
  choice: y passèrent les nuits
  rationale: לון désigne le fait de passer la nuit. Le pluriel « les nuits » restitue naturellement la répétition sur la période de trois jours.
