  text: וַ/יֹּ֨אמֶר הָ/אִ֤ישׁ הַ/זָּקֵן֙ שָׁל֣וֹם לָ֔/ךְ רַ֥ק כָּל מַחְסוֹרְ/ךָ֖ עָלָ֑/י רַ֥ק בָּ/רְח֖וֹב אַל תָּלַֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/020.yaml
  text: The old man said[a], “Peace be to you. Only let all your needs be my responsibility; only do not spend the night in the open square.”
translation:
  language: fr
  text: 'Le vieil homme lui dit : « La paix soit avec toi ! Que tous tes besoins soient à ma charge ; mais ne passe pas la nuit sur la place publique[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la rue ». Le terme hébreu désigne plus précisément un espace public ouvert, comme une place, à l’intérieur de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ הַזָּקֵן
  choice: Le vieil homme
  rationale: Cette formulation est naturelle dans un récit français et rend à la fois le nom אִישׁ et l’adjectif זָקֵן.
- source_word: שָׁלוֹם לָךְ
  choice: La paix soit avec toi !
  rationale: Cette formule française actuelle et digne conserve le contenu de שָׁלוֹם ainsi que la valeur de salutation et de réassurance, sans la réduire à « Ne t’inquiète pas ».
- source_word: רַק
  choice: Tout… Seulement
  rationale: Le premier רַק introduit la condition restrictive selon laquelle l’hôte prendra les besoins du voyageur à sa charge ; sa force est rendue par la construction globale. Le second est explicitement traduit par « Seulement », qui introduit l’unique interdiction.
- source_word: כָּל מַחְסוֹרְךָ
  choice: Tout ce dont tu as besoin
  rationale: Cette tournure naturelle exprime l’ensemble des manques ou besoins du voyageur.
- source_word: עָלָי
  choice: sera à ma charge
  rationale: L’expression française rend directement l’idée de responsabilité personnelle portée par l’hébreu « sur moi ».
- source_word: בָּרְחוֹב
  choice: sur la place publique
  rationale: רְחוֹב désigne ici l’espace public ouvert de la ville, plutôt qu’une simple voie de circulation.
- source_word: אַל תָּלַן
  choice: ne passe pas la nuit
  rationale: Cette interdiction rend clairement et naturellement le sens de לון, passer la nuit ou loger.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement correspond aux formes hébraïques masculines singulières. La ponctuation répartit l’offre d’hospitalité et l’interdiction en deux phrases pour une lecture naturelle, sans modifier leur relation logique.
