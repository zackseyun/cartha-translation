  text: וְ/הָיָ֣ה כָל הָ/רֹאֶ֗ה וְ/אָמַר֙ לֹֽא נִהְיְתָ֤ה וְ/לֹֽא נִרְאֲתָה֙ כָּ/זֹ֔את לְ/מִ/יּ֞וֹם עֲל֤וֹת בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה שִֽׂימוּ לָ/כֶ֥ם עָלֶ֖י/הָ עֻ֥צוּ וְ/דַבֵּֽרוּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/030.yaml
  text: And everyone who saw it said[a], “Nothing like this has happened or been seen from the day the sons of Israel came up from the land of Egypt until this day. Consider it, take counsel, and speak.”
translation:
  language: fr
  text: 'Tous ceux qui virent cela dirent : « Jamais rien de pareil n’est arrivé ni n’a été vu depuis le jour où les fils d’Israël[a] sont montés du pays d’Égypte jusqu’à aujourd’hui. Réfléchissez-y, consultez-vous et parlez ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ».
    reason: Alternative lexicale pour l’ethnonyme בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וְהָיָה כָל הָרֹאֶה וְאָמַר
  choice: Tous ceux qui virent cela dirent
  rationale: La tournure présente la réaction générale qui en résulta. Le passé simple convient au récit soutenu en français, tandis que « tous ceux » conserve la portée universelle du participe substantivé avec כָל.
- source_word: לֹא נִהְיְתָה וְלֹא נִרְאֲתָה כָּזֹאת
  choice: Jamais rien de pareil n’est arrivé ni n’a été vu
  rationale: Cette formulation naturelle conserve les deux verbes hébreux ainsi que l’insistance sur le caractère absolument inédit de l’événement.
- source_word: לְמִיּוֹם עֲלוֹת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: depuis le jour où les fils d’Israël sont montés du pays d’Égypte
  rationale: « Monter du pays d’Égypte » rend de près la formule de l’exode. « Les fils d’Israël » préserve la forme lexicale de בְּנֵי יִשְׂרָאֵל, avec une formulation ethnonymique plus courante signalée en note.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à aujourd’hui
  rationale: Expression temporelle française naturelle qui marque la continuité jusqu’au présent du narrateur.
- source_word: שִׂימוּ לָכֶם עָלֶיהָ
  choice: Réfléchissez-y
  rationale: L’expression idiomatique appelle les destinataires à fixer leur attention sur l’affaire et à la considérer sérieusement.
- source_word: עֻצוּ
  choice: consultez-vous
  rationale: L’impératif invite à une délibération collective. Le pronominal « consultez-vous » exprime naturellement l’idée de prendre conseil ensemble.
- source_word: וְדַבֵּרוּ
  choice: et parlez
  rationale: La brièveté énergique de l’impératif hébreu est conservée sans ajouter d’objet ni préciser abusivement ce qui doit être dit.
theological_decisions:
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix principal conserve la forme masculine et la métaphore généalogique du texte hébreu. Comme l’expression fonctionne aussi comme ethnonyme collectif, la formulation française plus courante est donnée en note sans imposer une interprétation supplémentaire.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple maintient le registre narratif biblique sans archaïsme lexical. La série finale de trois impératifs reste concise et solennelle, conformément au rythme hébreu.
