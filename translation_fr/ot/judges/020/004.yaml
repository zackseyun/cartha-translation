  text: וַ/יַּ֜עַן הָ/אִ֣ישׁ הַ/לֵּוִ֗י אִ֛ישׁ הָ/אִשָּׁ֥ה הַ/נִּרְצָחָ֖ה וַ/יֹּאמַ֑ר הַ/גִּבְעָ֨תָ/ה֙ אֲשֶׁ֣ר לְ/בִנְיָמִ֔ן בָּ֛אתִי אֲנִ֥י וּ/פִֽילַגְשִׁ֖/י לָ/לֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/004.yaml
  text: Then the Levite[a], the husband of the woman who had been murdered, answered and said, “I came to Gibeah, which belongs to Benjamin, I and my concubine, to spend the night.
translation:
  language: fr
  text: 'Alors le Lévite, le mari de la femme qui avait été assassinée, répondit : « Ma concubine et moi, nous sommes venus à Guibéa, qui appartient à Benjamin[a], pour y passer la nuit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui se trouve en Benjamin ».
    reason: La préposition לְ peut exprimer ici l’appartenance de Guibéa à Benjamin ou sa situation dans le territoire de Benjamin.
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Rend l’emploi narratif courant de ענה qui introduit une prise de parole, même si aucune question précise n’est formulée dans ce verset.
- source_word: הָאִישׁ הַלֵּוִי
  choice: le Lévite
  rationale: Expression française naturelle qui désigne l’homme par son appartenance lévitique.
- source_word: אִישׁ הָאִשָּׁה
  choice: le mari de la femme
  rationale: Le syntagme signifie littéralement « l’homme de la femme » et indique ici son partenaire masculin; « mari » est la formulation française idiomatique, malgré le fait qu’elle soit ensuite appelée sa concubine.
- source_word: הַנִּרְצָחָה
  choice: qui avait été assassinée
  rationale: Le participe passif de רצח exprime une mise à mort criminelle; le plus-que-parfait situe naturellement le meurtre avant cette déclaration.
- source_word: הַגִּבְעָתָה
  choice: à Guibéa
  rationale: Le hé directionnel marque le mouvement vers la ville; « à Guibéa » est l’équivalent français naturel.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: qui appartient à Benjamin
  rationale: La formule rattache Guibéa à Benjamin, probablement à son territoire tribal, sans réduire Benjamin à un simple nom géographique.
- source_word: וּפִילַגְשִׁי
  choice: avec ma concubine
  rationale: « Concubine » est l’équivalent établi de פִּילֶגֶשׁ et conserve la réalité sociale particulière exprimée par le texte.
- source_word: לָלוּן
  choice: pour y passer la nuit
  rationale: L’infinitif de לון désigne le fait de loger pour la nuit; cette formulation est claire et actuelle en français.
