source:
  edition: WLC
  text: וּ֠/פִינְחָס בֶּן אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן עֹמֵ֣ד לְ/פָנָ֗י/ו בַּ/יָּמִ֣ים הָ/הֵם֮ לֵ/אמֹר֒ הַ/אוֹסִ֨ף ע֜וֹד לָ/צֵ֧את לַ/מִּלְחָמָ֛ה עִם בְּנֵֽי בִנְיָמִ֥ן אָחִ֖/י אִם אֶחְדָּ֑ל וַ/יֹּ֤אמֶר יְהוָה֙ עֲל֔וּ כִּ֥י מָחָ֖ר אֶתְּנֶ֥/נּוּ בְ/יָדֶֽ/ךָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/028.yaml
  text: And Phinehas the son of Eleazar[a], son of Aaron, stood before him in those days, saying, “Shall I yet again go out to battle against the sons of Benjamin my brother, or shall I stop?” And Yahweh said, “Go up[c][b], for tomorrow I will give him into your hand.”
translation:
  language: fr
  text: 'Phinéas, fils d’Éléazar, fils d’Aaron, se tenait alors devant l’arche[a]. Il demanda : « Dois-je encore aller combattre contre les fils de Benjamin, mon frère[b], ou dois-je renoncer ? » Yahvé répondit : « Montez, car demain je le livrerai entre tes mains[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devant Yahvé ». Le pronom hébreu est masculin et peut renvoyer soit à Yahvé, soit à l’arche de l’alliance mentionnée au verset précédent, car le mot hébreu traduit par « arche » est masculin.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « les fils de Benjamin, mon frère » ; le singulier souligne la parenté qui subsiste malgré la guerre civile.'
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « je le donnerai dans ta main ». Le singulier présente probablement Benjamin comme un groupe collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס
  choice: Phinéas
  rationale: La conjonction hébraïque s’intègre naturellement à la continuité du récit français sans qu’il soit nécessaire de la rendre par « et »; la forme française traditionnelle du nom est conservée.
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן
  choice: fils d’Éléazar, fils d’Aaron
  rationale: La double filiation est maintenue, car elle souligne l’ascendance sacerdotale de Phinéas.
- source_word: עֹמֵד לְפָנָיו
  choice: se tenait alors devant lui
  rationale: « Se tenir devant » respecte le sens concret et éventuellement cultuel du participe. Le pronom masculin français reproduit la forme hébraïque sans trancher explicitement entre Yahvé et l’arche comme référent contextuel.
- source_word: בַּיָּמִים הָהֵם
  choice: alors
  rationale: Expression temporelle naturelle en français narratif pour « en ces jours-là », sans archaïsme inutile.
- source_word: לֵאמֹר
  choice: Il demanda
  rationale: L’infinitif introducteur de discours est rendu idiomatiquement; la parole qui suit est clairement une question adressée à Dieu.
- source_word: הַאוֹסִף עוֹד לָצֵאת לַמִּלְחָמָה
  choice: Dois-je encore aller combattre
  rationale: La tournure exprime une nouvelle tentative militaire; cette formulation est proche du sens et naturelle en français moderne.
- source_word: עִם בְּנֵי בִנְיָמִן אָחִי
  choice: les fils de Benjamin, mon frère
  rationale: Le contexte militaire donne à עִם le sens d’un affrontement. La formulation collective et le langage de parenté sont préservés.
- source_word: אִם אֶחְדָּל
  choice: ou dois-je renoncer ?
  rationale: חדל signifie cesser ou s’abstenir; « renoncer » exprime ici l’arrêt envisagé de la campagne.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Yahvé répondit
  rationale: « Répondit » convient à l’échange en contexte, et le tétragramme est rendu par « Yahvé » conformément à la ligne éditoriale fournie.
- source_word: עֲלוּ
  choice: Montez
  rationale: L’impératif pluriel est conservé. « Monter » maintient l’image spatiale et l’usage militaire du verbe עלה.
- source_word: כִּי מָחָר אֶתְּנֶנּוּ בְיָדֶךָ
  choice: car demain je le livrerai entre tes mains
  rationale: Le singulier collectif « le » représente Benjamin; l’expression française « livrer entre les mains » restitue l’idiome de la remise au pouvoir de quelqu’un.
theological_decisions:
- issue: Référent du suffixe dans לְפָנָיו
  choice: « devant lui », en conservant un pronom masculin ambigu
  alternative: « devant elle », si le référent est explicitement l’arche mentionnée au verset précédent
  rationale: Le suffixe hébreu est masculin singulier. Il peut viser Dieu ou, grammaticalement, l’arche, puisque אֲרוֹן est masculin en hébreu. Le français oblige autrement à choisir un genre; « lui » respecte la forme source et laisse ouverte la référence à Yahvé, tandis qu’une note signale l’autre compréhension contextuelle.
- issue: Nombre dans « fils de Benjamin, mon frère »
  choice: Conserver le singulier « mon frère »
  alternative: « leurs frères » ou « nos frères benjaminites »
  rationale: Le texte fait parler Israël collectivement au singulier et présente Benjamin comme son frère; cette tension de parenté au cœur de la guerre civile doit rester visible.
- issue: Singulier collectif dans אֶתְּנֶנּוּ
  choice: « je le livrerai »
  alternative: « je les livrerai »
  rationale: Le suffixe objet hébreu est singulier et traite vraisemblablement Benjamin comme une unité collective. Le conserver évite de normaliser silencieusement le nombre.
- issue: Nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: La translittération rend directement le nom propre divin selon la convention éditoriale indiquée, sans introduire une substitution par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe du discours est rendue plus naturelle sans effacer les singularités importantes de l’hébreu, notamment les expressions de parenté, l’impératif pluriel suivi d’un suffixe singulier et le traitement collectif de Benjamin.
