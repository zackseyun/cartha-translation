  text: וַֽ/יִּפְּלוּ֙ מִ/בִּנְיָמִ֔ן שְׁמֹנָֽה עָשָׂ֥ר אֶ֖לֶף אִ֑ישׁ אֶת כָּל אֵ֖לֶּה אַנְשֵׁי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/044.yaml
  text: And eighteen thousand men from Benjamin fell[a]; all these were valiant warriors.
translation:
  language: fr
  text: Dix-huit mille hommes de Benjamin tombèrent ; tous ces hommes étaient de vaillants guerriers[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « hommes de valeur ».
    reason: Alternative lexicale pour אַנְשֵׁי חַיִל.
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: tombèrent
  rationale: Le verbe נפל signifie littéralement « tomber » et, dans ce contexte de bataille, indique la mort au combat. « Tombèrent » conserve l’image et le ton militaire de l’hébreu.
- source_word: מִבִּנְיָמִן
  choice: de Benjamin
  rationale: 'La préposition מִן marque ici l’appartenance ou la provenance : les hommes tombés appartenaient à la tribu de Benjamin. « De Benjamin » est naturel et précis en français.'
- source_word: שְׁמֹנָה עָשָׂר אֶלֶף אִישׁ
  choice: dix-huit mille hommes
  rationale: Le texte hébreu emploie explicitement אִישׁ, « homme », après le nombre. Cette formulation le représente sans ajouter l’interprétation « soldats ».
- source_word: אֶת כָּל אֵלֶּה
  choice: tous
  rationale: L’expression reprend collectivement les dix-huit mille hommes déjà mentionnés. En français, « tous » rend cette apposition sans lourdeur ni ajout.
- source_word: אַנְשֵׁי חָיִל
  choice: de vaillants guerriers
  rationale: Dans ce contexte militaire, l’expression désigne des hommes courageux et aptes au combat. « De vaillants guerriers » communique clairement les deux nuances en français moderne.
