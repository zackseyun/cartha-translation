  yaml_path: translation/ot/judges/020/030.yaml
  text: Then the sons of Israel went up against the sons of Benjamin on the third day[a], and they drew up against Gibeah as before.
translation:
  language: fr
  text: Le troisième jour, les fils d’Israël montèrent contre les fils de Benjamin et se rangèrent en ordre de bataille face à Guibéa, comme les fois précédentes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « les Israélites montèrent contre les Benjaminites ». L’hébreu dit plus littéralement : « les fils d’Israël » et « les fils de Benjamin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: Le verbe עלה signifie couramment « monter » et peut, dans un récit militaire, évoquer une avancée. « Montèrent » conserve l’image hébraïque sans la préciser davantage.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction formelle préserve l’expression de parenté et son parallélisme délibéré avec « les fils de Benjamin ».
- source_word: אֶל בְּנֵי בִנְיָמִן
  choice: contre les fils de Benjamin
  rationale: Dans ce contexte de combat, אֶל indique le mouvement hostile en direction de l’adversaire ; « contre » est naturel en français.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Le troisième jour
  rationale: Rendu temporel français direct et idiomatique.
- source_word: וַיַּעַרְכוּ
  choice: se rangèrent en ordre de bataille
  rationale: Dans un contexte militaire, ערך désigne la disposition organisée des troupes. Cette formulation explicite naturellement le sens en français.
- source_word: אֶל הַגִּבְעָה
  choice: face à Guibéa
  rationale: Avec le verbe militaire précédent, l’expression indique que les troupes prennent position en vue d’affronter la ville. « Face à » conserve à la fois la dimension spatiale et militaire sans faire de la ville elle-même un combattant.
- source_word: כְּפַעַם בְּפָעַם
  choice: comme les fois précédentes
  rationale: L’expression idiomatique renvoie aux occasions antérieures ; ce rendu est clair et naturel tout en reflétant leur pluralité dans le récit.
