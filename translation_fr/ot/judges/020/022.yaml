  to: Mais le peuple, les hommes d’Israël, reprit courage[a] et ils se rangèrent de nouveau en ordre de bataille à l’endroit où ils s’étaient rangés le premier jour.
  rationale: La révision rétablit la relative locative et temporelle du texte hébreu, tout en gardant un français narratif naturel. Elle conserve le singulier collectif du premier verbe et le pluriel du second, conformément à l’alternance présente dans l’hébreu.
