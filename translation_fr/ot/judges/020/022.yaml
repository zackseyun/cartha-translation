    issue: La proposition « au même endroit que le premier jour » ne rend pas explicitement la relative « où ils s’étaient rangés le premier jour ».
    rationale: Le texte source ne compare pas seulement le lieu à « le premier jour » ; il identifie ce lieu comme celui de leur précédente mise en ordre de bataille. La relative doit être conservée pour une équivalence optimale.
  revised_text: Mais le peuple, les hommes d’Israël, reprit courage[a] et ils se rangèrent de nouveau en ordre de bataille à l’endroit où ils s’étaient rangés le premier jour.
