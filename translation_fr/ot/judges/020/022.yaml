  text: וַ/יִּתְחַזֵּ֥ק הָ/עָ֖ם אִ֣ישׁ יִשְׂרָאֵ֑ל וַ/יֹּסִ֨פוּ֙ לַ/עֲרֹ֣ךְ מִלְחָמָ֔ה בַּ/מָּק֕וֹם אֲשֶׁר עָ֥רְכוּ שָׁ֖ם בַּ/יּ֥וֹם הָ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/022.yaml
  text: But the people[a], the men of Israel, strengthened themselves and again drew up for battle in the place where they had drawn up on the first day.
translation:
  language: fr
  text: Mais le peuple, les hommes d’Israël, reprit courage[a] et ils se rangèrent de nouveau en ordre de bataille à l’endroit où ils s’étaient rangés le premier jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reprit des forces ». L’hébreu peut désigner un regain de force ou de résolution après une défaite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: reprit courage
  rationale: Le hitpael de חזק exprime ici le fait de retrouver force et résolution après la défaite. « Reprit courage » rend naturellement cette reprise sans suggérer une augmentation de force physique.
- source_word: הָעָם אִישׁ יִשְׂרָאֵל
  choice: le peuple, les hommes d’Israël
  rationale: La formulation conserve l’apposition entre le collectif « le peuple » et les combattants désignés comme « les hommes d’Israël », sans introduire le terme plus interprétatif « armée ».
- source_word: וַיֹּסִפוּ
  choice: de nouveau
  rationale: Avec l’infinitif qui suit, יסף marque la répétition ou la reprise de l’action.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: se rangea en ordre de bataille
  rationale: ערך avec מלחמה désigne la mise en formation pour le combat. Cette expression française garde la valeur militaire précise tout en restant naturelle.
- source_word: בַּמָּקוֹם אֲשֶׁר עָרְכוּ שָׁם בַּיּוֹם הָרִאשׁוֹן
  choice: au même endroit que le premier jour
  rationale: Cette formulation française exprime clairement qu’ils reprennent leur formation à l’endroit où ils s’étaient rangés le premier jour, sans reproduire la redondance locative de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le singulier « se rangea » accorde le verbe avec le collectif « le peuple », tandis que l’apposition précise qu’il s’agit des hommes d’Israël.
