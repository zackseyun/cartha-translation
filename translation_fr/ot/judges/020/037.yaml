  text: Then the men in ambush quickly rushed against Gibeah[a], and the ambush advanced and struck the whole city with the edge of the sword.
translation:
  language: fr
  text: Alors les hommes embusqués se précipitèrent contre Guibéa, et l’embuscade s’étendit[a] et frappa toute la ville au fil de l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’embuscade tira ». Le verbe peut évoquer une extension ou un déploiement de la troupe embusquée, ou sa progression dans la ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרֵב
  choice: les hommes embusqués / ils
  rationale: Le singulier morphologique désigne collectivement la troupe placée en embuscade. Cette formulation personnelle est naturelle en français et l’emploi du pronom évite une répétition pesante.
- source_word: הֵחִישׁוּ
  choice: se précipitèrent
  rationale: Le verbe exprime la hâte; « se précipitèrent » rend à la fois la rapidité et le mouvement militaire soudain.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: contre
  rationale: Dans ce récit de bataille, le verbe avec אֶל décrit vraisemblablement une sortie ou une attaque rapide dirigée contre Guibéa. « Se précipitèrent contre » restitue ce mouvement offensif sans surcharger la phrase.
- source_word: הַגִּבְעָה
  choice: Guibéa
  rationale: Transcription française courante du nom propre biblique.
- source_word: וַיִּמְשֹׁךְ
  choice: progressèrent en se déployant
  rationale: Le verbe signifie littéralement « tirer, étendre » et décrit ici probablement la troupe qui s’avance en étendant son dispositif. La traduction conserve à la fois l’idée de progression et celle d’extension, tout en signalant l’incertitude en note.
- source_word: וַיַּךְ אֶת כָּל הָעִיר
  choice: passèrent toute la ville
  rationale: Avec la formule suivante, « passer toute la ville au fil de l’épée » est une tournure française idiomatique qui exprime l’attaque meurtrière tout en conservant la désignation globale de la ville.
- source_word: לְפִי חָרֶב
  choice: au fil de l’épée
  rationale: Équivalent français traditionnel et intelligible de l’expression hébraïque, littéralement « à la bouche de l’épée ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique. La formulation maintient le caractère collectif de הָאֹרֵב et conserve, dans le texte et la note, l’ambiguïté du mouvement exprimé par וַיִּמְשֹׁךְ.
