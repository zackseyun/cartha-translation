  text: וַ/יֵּֽאָסֵ֞ף כָּל אִ֤ישׁ יִשְׂרָאֵל֙ אֶל הָ/עִ֔יר כְּ/אִ֥ישׁ אֶחָ֖ד חֲבֵרִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/011.yaml
  text: So all the men of Israel gathered to the city[a], united as one man.
translation:
  language: fr
  text: Ainsi, tous les hommes d’Israël se rassemblèrent en direction de la ville, unis comme un seul homme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme un seul homme, joints ensemble »; cette expression souligne leur parfaite unité d’action.'
    reason: La note rend visible la formulation hébraïque resserrée et l’apport distinct de חֲבֵרִים, que « unis » exprime naturellement dans le texte.
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: se rassemblèrent
  rationale: Le niphal de אסף exprime ici le rassemblement collectif des hommes d’Israël. Le verbe pronominal français est naturel et conserve cette valeur sans imposer un passif artificiel.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: tous les hommes d’Israël
  rationale: La tournure distributive désigne ici les hommes d’Israël réunis dans un contexte de mobilisation militaire; le masculin concret du texte est donc conservé.
- source_word: אֶל הָעִיר
  choice: vers la ville
  rationale: אֶל marque d’abord la direction. « Vers la ville » respecte cette valeur tout en laissant le contexte militaire suggérer, sans l’inscrire explicitement dans la préposition, qu’ils se réunissent contre Guibéa.
- source_word: כְּאִישׁ אֶחָד
  choice: comme un seul homme
  rationale: Cette expression idiomatique décrit une action parfaitement concertée. Son équivalent français courant conserve à la fois l’image et le sens.
- source_word: חֲבֵרִים
  choice: unis
  rationale: Le terme issu de חבר ajoute l’idée qu’ils sont joints et solidaires. « Unis » transmet naturellement cette nuance en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation garde l’image hébraïque de l’unité collective et évite de préciser davantage que le texte la relation militaire exprimée par אֶל.
