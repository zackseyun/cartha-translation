  text: כִּתְּר֤וּ אֶת בִּנְיָמִן֙ הִרְדִיפֻ֔/הוּ מְנוּחָ֖ה הִדְרִיכֻ֑/הוּ עַ֛ד נֹ֥כַח הַ/גִּבְעָ֖ה מִ/מִּזְרַח שָֽׁמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/043.yaml
  text: They surrounded Benjamin[a], pursued him relentlessly, and trampled him down as far as opposite Gibeah[c][b], toward the east of the sun.
translation:
  language: fr
  text: Ils encerclèrent Benjamin, le poursuivirent sans relâche[a] et le piétinèrent[b] jusqu’en face de Guibéa, du côté du soleil levant[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le poursuivirent depuis Menouha », si מְנוּחָה est le nom d’un lieu plutôt qu’une indication adverbiale.
    reason: alternative_reading
  - marker: b
    text: Ou « le firent avancer de force »; dans ce contexte, le verbe hébreu peut évoquer soit le fait de fouler aux pieds, soit celui de contraindre quelqu’un à avancer.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « depuis l’est du soleil », expression qui désigne le côté est ou la direction de l’est.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּתְּרוּ
  choice: encerclèrent
  rationale: Le verbe exprime l’action d’enfermer ou de cerner une force ennemie. « Encerclèrent » est naturel et conserve la portée militaire.
- source_word: אֶת בִּנְיָמִן
  choice: Benjamin
  rationale: Le nom de la tribu désigne ici collectivement ses combattants. Le garder au singulier respecte les suffixes singuliers du texte hébreu.
- source_word: הִרְדִיפֻהוּ
  choice: le poursuivirent
  rationale: רדף désigne couramment la poursuite d’un ennemi dans un contexte militaire; le pronom singulier maintient Benjamin comme collectif.
- source_word: מְנוּחָה
  choice: sans relâche
  rationale: Le mot signifie normalement « repos » ou « lieu de repos ». Dans cette construction difficile, l’emploi adverbial peut indiquer une poursuite qui ne laisse aucun repos; une note préserve la possibilité d’un nom de lieu.
- source_word: הִדְרִיכֻהוּ
  choice: le piétinèrent
  rationale: Le hifil de דרך peut exprimer le fait de fouler aux pieds ou de faire avancer. Dans la succession d’actions guerrières, « piétinèrent » rend bien la force hostile du verbe, tandis que l’autre possibilité est signalée en note.
- source_word: עַד נֹכַח הַגִּבְעָה
  choice: jusqu’en face de Guibéa
  rationale: נֹכַח indique une position en face de, devant ou vis-à-vis de quelque chose. La formulation française est concise et spatialement claire.
- source_word: מִמִּזְרַח שָׁמֶשׁ
  choice: du côté du soleil levant
  rationale: L’expression hébraïque associe l’est au lever du soleil. Cette formulation conserve l’image tout en indiquant naturellement le côté oriental.
theological_decisions: []
