  text: Then the sons of Israel rose in the morning and camped against Gibeah[a].
translation:
  language: fr
  text: Les Israélites se levèrent le matin et établirent leur camp face à Guibéa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּק֥וּמוּ
  choice: se levèrent
  rationale: Le verbe קום au wayyiqtol marque l’action suivante du récit. « Se levèrent » conserve son sens simple sans préciser indûment qu’ils partirent.
- source_word: בְנֵֽי יִשְׂרָאֵ֖ל
  choice: les Israélites
  rationale: Cette expression idiomatique désigne collectivement le peuple d’Israël. « Les Israélites » est naturel, exact et inclusif en français moderne.
- source_word: בַּבֹּ֑קֶר
  choice: le matin
  rationale: La préposition avec le nom défini exprime ici le moment. « Le matin » est l’équivalent français courant.
- source_word: וַיַּֽחֲנ֖וּ
  choice: établirent leur camp
  rationale: Le verbe חנה signifie camper ou dresser son camp. Cette formulation française indique clairement l’installation militaire sans archaïsme.
- source_word: עַל
  choice: face à
  rationale: Dans ce contexte militaire, עַל indique une position dirigée contre la ville. « Face à » préserve l’orientation hostile tout en restant naturel.
- source_word: הַגִּבְעָֽה
  choice: Guibéa
  rationale: Il s’agit du nom de lieu traditionnellement transcrit « Guibéa » en français; l’article hébreu n’est pas rendu séparément.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le gentilé naturel « Israélites » évite le calque peu idiomatique « fils d’Israël ». « Face à Guibéa » exprime la disposition militaire sans renforcer artificiellement le texte par « contre ».
