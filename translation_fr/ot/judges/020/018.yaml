base_translation:
  language: en
  yaml_path: translation/ot/judges/020/018.yaml
  text: Then they arose and went up to Bethel[a], and they inquired of God. The sons of Israel said, “Who will go up first for us to the battle against the sons of Benjamin?” And Yahweh said[c][b], “Judah first.”
translation:
  language: fr
  text: 'Puis ils se levèrent et montèrent à Béthel, où ils consultèrent Dieu. Les fils d’Israël demandèrent : « Qui montera le premier pour nous au combat contre les fils de Benjamin ? » Yahvé répondit : « Juda, le premier. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ וַיַּעֲלוּ
  choice: ils se levèrent et montèrent
  rationale: Conserve la succession narrative et le mouvement ascendant exprimé par קום et עלה, dans un français naturel et digne.
- source_word: בֵית אֵל
  choice: Béthel
  rationale: Translittération française traditionnelle et immédiatement reconnaissable du nom de lieu.
- source_word: וַיִּשְׁאֲלוּ בֵאלֹהִים
  choice: ils consultèrent Dieu
  rationale: שׁאל avec ב désigne ici la recherche d’une réponse ou d’une direction divine; « consulter Dieu » exprime mieux cet acte que le simple verbe « demander ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Reproduit l’expression de parenté collective du texte hébreu sans la remplacer par l’ethnonyme plus général « Israélites ».
- source_word: מִי יַעֲלֶה לָּנוּ בַתְּחִלָּה
  choice: Qui de nous montera le premier
  rationale: « De nous » rend idiomatiquement le datif לָנוּ dans la question portant sur le groupe qui prendra l’initiative; « montera » maintient le verbe עלה et « le premier » l’ordre exprimé par בַתְּחִלָּה.
- source_word: לַמִּלְחָמָה עִם בְּנֵי בִנְיָמִן
  choice: au combat contre les fils de Benjamin
  rationale: Dans ce contexte militaire, עִם marque les adversaires engagés dans le combat; « contre » évite l’ambiguïté trompeuse de « avec ».
- source_word: יְהוּדָה בַתְּחִלָּה
  choice: Juda le premier
  rationale: Préserve la réponse hébraïque brève et elliptique, dont le verbe est sous-entendu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » rend le nom propre dans une forme française établie, sans le remplacer par un titre; « le SEIGNEUR » demeure une convention possible.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix principal conserve l’image généalogique et la forme masculine collective de l’hébreu; l’alternative est plus idiomatique mais moins transparente.
- issue: Valeur de עִם dans un contexte de guerre
  choice: contre les fils de Benjamin
  alternative: avec les fils de Benjamin
  rationale: La préposition signifie ordinairement « avec », mais l’affrontement décrit impose ici le sens relationnel d’opposition, sans modifier la réalité théologique ou narrative du conflit.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la structure hébraïque tout en évitant les tours inutilement archaïques. La brièveté de la réponse divine est conservée.
