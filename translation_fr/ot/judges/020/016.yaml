base_translation:
  language: en
  yaml_path: translation/ot/judges/020/016.yaml
  text: From all this people[a], seven hundred chosen men were left-handed; every one of these could sling a stone at a hair and not miss.
translation:
  language: fr
  text: Parmi tout ce peuple, sept cents hommes d’élite étaient gauchers[a] ; chacun d’eux pouvait lancer une pierre à la fronde sur un cheveu sans le manquer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit plus littéralement : « avaient la main droite entravée » ou « gênée ». Dans ce contexte, l’expression désigne vraisemblablement des combattants gauchers.'
    reason: Préserver la formulation inhabituelle et la nuance lexicale de l’expression hébraïque אִטֵּר יַד יְמִינוֹ.
lexical_decisions:
- source_word: מִכֹּל הָעָם הַזֶּה
  choice: Parmi tout ce peuple
  rationale: La préposition מִן exprime ici la valeur partitive. « Peuple » conserve le terme hébreu sans préciser davantage « troupes », bien que le contexte soit militaire.
- source_word: שְׁבַע מֵאוֹת אִישׁ בָּחוּר
  choice: sept cents hommes d’élite
  rationale: אִישׁ sert à compter les hommes adultes, tandis que בָּחוּר les présente comme des hommes choisis ou de premier choix. « Hommes d’élite » est naturel en français dans ce contexte militaire.
- source_word: אִטֵּר יַד יְמִינוֹ
  choice: étaient gauchers[a]
  rationale: L’expression décrit littéralement une restriction ou une gêne de la main droite. Dans ce contexte de combat, « gauchers » en communique naturellement le sens probable, tandis que la note préserve la formulation et l’ambiguïté de l’hébreu.
- source_word: כָּל זֶה
  choice: chacun d’eux
  rationale: La tournure a une valeur distributive et souligne l’habileté individuelle de chacun des sept cents hommes.
- source_word: קֹלֵעַ בָּאֶבֶן
  choice: pouvait viser… avec une pierre lancée à la fronde
  rationale: Le participe décrit une aptitude habituelle. La formulation française explicite naturellement l’emploi de la fronde tout en conservant la pierre mentionnée dans le texte.
- source_word: אֶל הַשַּׂעֲרָה
  choice: viser un cheveu
  rationale: Le singulier « un cheveu » maintient l’image concrète d’une cible minuscule et donc d’une précision extrême.
- source_word: וְלֹא יַחֲטִא
  choice: sans manquer sa cible
  rationale: Dans ce contexte, חטא signifie concrètement « manquer » une cible, et non « pécher ». La formulation évite toute ambiguïté morale en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. La phrase conserve l’image concrète du cheveu tout en exprimant naturellement l’habileté militaire. Le point-virgule distingue la composition du groupe de la précision sur son adresse.
