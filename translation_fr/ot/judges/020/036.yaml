  register: Français international moderne, narratif et digne. La formulation reste proche de l’hébreu tout en explicitant naturellement la manœuvre militaire. Les ambiguïtés lexicales de l’idiome « donner de la place » et du terme אֹרֵב sont conservées dans les notes.
