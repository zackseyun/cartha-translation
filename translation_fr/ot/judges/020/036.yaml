  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּרְא֥וּ בְנֵֽי בִנְיָמִ֖ן כִּ֣י נִגָּ֑פוּ וַ/יִּתְּנ֨וּ אִֽישׁ יִשְׂרָאֵ֤ל מָקוֹם֙ לְ/בִנְיָמִ֔ן כִּ֤י בָֽטְחוּ֙ אֶל הָ֣/אֹרֵ֔ב אֲשֶׁר שָׂ֖מוּ אֶל הַ/גִּבְעָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/036.yaml
  text: So the sons of Benjamin saw that they were defeated[a]. Now the men of Israel had given place to Benjamin[b], because they trusted in the ambush that they had set against Gibeah.
translation:
  language: fr
  text: Les fils de Benjamin virent alors qu’ils étaient battus. Les hommes d’Israël avaient cédé du terrain devant Benjamin[a], parce qu’ils comptaient sur l’embuscade[b] qu’ils avaient placée contre Guibéa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avaient donné de la place à Benjamin ». Il s’agissait d’un recul volontaire destiné à attirer les Benjaminites.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sur les hommes embusqués qu’ils avaient postés près de Guibéa ». Le mot hébreu peut désigner soit l’embuscade, soit ceux qui se tiennent en embuscade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: virent alors
  rationale: Le sens premier de ראה est « voir ». Le contexte implique qu’ils constatèrent leur défaite, sans qu’il soit nécessaire de remplacer le verbe concret par « comprirent ».
- source_word: בְנֵי בִנְיָמִן
  choice: les fils de Benjamin
  rationale: Cette formulation conserve l’expression de parenté hébraïque tout en restant claire en français biblique moderne.
- source_word: כִּי נִגָּפוּ
  choice: qu’ils étaient battus
  rationale: Au niphal, נגף décrit ici la défaite au combat. « Étaient battus » est naturel et maintient le point de vue narratif au moment où les Benjaminites le constatent.
- source_word: וַיִּתְּנוּ ... מָקוֹם
  choice: avaient cédé du terrain
  rationale: L’expression signifie littéralement « donner de la place » et désigne ici un recul tactique volontaire. Le plus-que-parfait marque que cette manœuvre explique la situation constatée.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: les hommes d’Israël
  rationale: Le singulier אִישׁ a ici une valeur collective. « Les hommes d’Israël » convient au contexte militaire.
- source_word: לְבִנְיָמִן
  choice: devant Benjamin
  rationale: Avec « céder du terrain », « devant Benjamin » exprime naturellement que les Israélites reculaient face aux forces benjaminites.
- source_word: כִּי בָטְחוּ
  choice: parce qu’ils comptaient sur
  rationale: בטח exprime la confiance ou l’assurance fondée sur quelqu’un ou quelque chose. « Compter sur » est idiomatique en français dans ce contexte tactique.
- source_word: אֶל הָאֹרֵב
  choice: sur l’embuscade
  rationale: אֹרֵב peut désigner l’embuscade elle-même ou les hommes embusqués. Le texte principal retient le dispositif tactique, tandis qu’une note conserve l’autre possibilité.
- source_word: אֲשֶׁר שָׂמוּ
  choice: qu’ils avaient placée
  rationale: שׂים signifie « mettre, placer ». Le plus-que-parfait rend l’antériorité de la mise en place de l’embuscade.
- source_word: אֶל הַגִּבְעָה
  choice: contre Guibéa
  rationale: Dans ce contexte militaire, אֶל indique l’orientation de l’embuscade vers la ville; « contre Guibéa » en exprime la visée hostile.
theological_decisions: []
