base_translation:
  language: en
  yaml_path: translation/ot/judges/020/025.yaml
  text: Benjamin came out from Gibeah to meet them on the second day[a], and they struck down another eighteen thousand men of Israel to the ground[b]; all these were drawing the sword.
translation:
  language: fr
  text: Le deuxième jour, Benjamin sortit de Guibéa à leur rencontre[a]. Ils abattirent encore dix-huit mille hommes parmi les Israélites[b] et les abattirent à terre ; tous ceux-là tiraient l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour les affronter » ; l’expression hébraïque peut désigner une rencontre hostile dans un contexte militaire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « parmi les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא בִנְיָמִן
  choice: Benjamin sortit
  rationale: Le verbe יצא signifie ici « sortir ». « Benjamin » désigne collectivement la tribu, conformément à l’hébreu.
- source_word: לִקְרָאתָם
  choice: à leur rencontre
  rationale: Cette expression signifie aller à la rencontre de quelqu’un et peut, dans un contexte militaire, impliquer un affrontement hostile. Le contexte rend l’hostilité explicite sans qu’il soit nécessaire de la renforcer dans le texte.
- source_word: מִן הַגִּבְעָה
  choice: de Guibéa
  rationale: Rendu locatif direct du point de départ ; le nom du lieu est translittéré selon l’usage français.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Le deuxième jour
  rationale: Reproduit explicitement l’ordinal hébreu tout en donnant une ouverture naturelle à la phrase française.
- source_word: וַיַּשְׁחִיתוּ
  choice: Ils abattirent
  rationale: Le hiphil de שׁחת exprime ici une destruction mortelle dans une bataille. « Abattirent » communique clairement le fait de tuer sans effacer l’image militaire.
- source_word: בִבְנֵי יִשְׂרָאֵל
  choice: parmi les Israélites
  rationale: La préposition ב marque ici le groupe touché par les pertes. « Parmi les Israélites » est naturel en français ; la formulation littérale « parmi les fils d’Israël » est signalée en note.
- source_word: עוֹד
  choice: encore
  rationale: Indique des pertes supplémentaires après celles du jour précédent.
- source_word: שְׁמֹנַת עָשָׂר אֶלֶף אִישׁ
  choice: dix-huit mille hommes
  rationale: Rendu direct du nombre suivi de אִישׁ ; le contexte militaire ne justifie pas de remplacer explicitement « hommes » par « soldats ».
- source_word: אָרְצָה
  choice: les jetant à terre
  rationale: La forme directionnelle signifie « vers la terre, à terre » et décrit idiomatiquement ceux qui tombent sous les coups.
- source_word: כָּל אֵלֶּה שֹׁלְפֵי חָרֶב
  choice: tous ceux-là tiraient l’épée
  rationale: Conserve l’expression participiale imagée « ceux qui tirent l’épée », plutôt que de la réduire à « soldats » ou « guerriers ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passage du collectif singulier « Benjamin » au verbe pluriel « ils abattirent », présent dans l’hébreu, est conservé de manière intelligible. La ponctuation en deux phrases évite une période trop chargée sans modifier la progression du récit.
