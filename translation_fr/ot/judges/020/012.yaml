  text: וַֽ/יִּשְׁלְח֞וּ שִׁבְטֵ֤י יִשְׂרָאֵל֙ אֲנָשִׁ֔ים בְּ/כָל שִׁבְטֵ֥י בִנְיָמִ֖ן לֵ/אמֹ֑ר מָ֚ה הָ/רָעָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר נִהְיְתָ֖ה בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/012.yaml
  text: So the tribes of Israel sent men through all the tribes of Benjamin[a], saying[b], “What is this evil that has happened among you?”
translation:
  language: fr
  text: 'Les tribus d’Israël envoyèrent des hommes dans toutes les tribus de Benjamin[a] pour leur dire : « Quel est ce mal[b] qui s’est produit parmi vous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à toutes les tribus de Benjamin ». La préposition hébraïque peut marquer une répartition parmi les groupes concernés.
    reason: lexical_alternative
  - marker: b
    text: Ou « cette méchanceté » ou « ce forfait ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: envoyèrent
  rationale: Le verbe שׁלח désigne simplement l’action d’envoyer; le passé simple convient au registre narratif biblique soutenu sans être archaïque.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: les tribus d’Israël
  rationale: Cette traduction directe du syntagme construit conserve le sujet collectif pluriel.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Le texte dit littéralement « des hommes » sans les qualifier explicitement de messagers ou de représentants.
- source_word: בְּכָל שִׁבְטֵי בִנְיָמִן
  choice: dans toutes les tribus de Benjamin
  rationale: Le ב peut exprimer une répartition à travers les subdivisions benjaminites. La formulation conserve le pluriel inhabituel שִׁבְטֵי du texte hébreu au lieu de le remplacer silencieusement par « clans ».
- source_word: לֵאמֹר
  choice: pour leur dire
  rationale: L’infinitif introduit les paroles adressées aux Benjaminites. Cette tournure est plus naturelle en français actuel que le calque « en disant »; le pronom destinataire est explicité par le contexte.
- source_word: מָה
  choice: Quel est
  rationale: L’interrogatif demande ici de caractériser ou d’identifier le mal commis, plutôt que d’en demander directement la cause.
- source_word: הָרָעָה הַזֹּאת
  choice: ce mal
  rationale: רָעָה désigne ici un acte moralement mauvais ou un forfait. « Mal » garde cette force morale sans préciser davantage que l’hébreu.
- source_word: אֲשֶׁר נִהְיְתָה
  choice: qui s’est produit
  rationale: Le nifal de היה exprime ici un événement qui a eu lieu; « s’est produit » est idiomatique et précis.
- source_word: בָּכֶם
  choice: parmi vous
  rationale: Dans ce contexte, la préposition situe le mal au sein de la communauté benjaminite.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le registre narratif écrit. Le pluriel inhabituel « tribus de Benjamin » est conservé afin de ne pas effacer une particularité du texte hébreu; la note signale l’ambiguïté de la préposition.
