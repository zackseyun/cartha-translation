  text: וַ/יַּהֲפֹ֥ךְ אִֽישׁ יִשְׂרָאֵ֖ל בַּ/מִּלְחָמָ֑ה וּ/בִנְיָמִ֡ן הֵחֵל֩ לְ/הַכּ֨וֹת חֲלָלִ֤ים בְּ/אִֽישׁ יִשְׂרָאֵל֙ כִּ/שְׁלֹשִׁ֣ים אִ֔ישׁ כִּ֣י אָמְר֔וּ אַךְ֩ נִגּ֨וֹף נִגָּ֥ף הוּא֙ לְ/פָנֵ֔י/נוּ כַּ/מִּלְחָמָ֖ה הָ/רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/039.yaml
  text: Then the men of Israel turned in the battle[a], and Benjamin began to strike down the slain among the men of Israel, about thirty men, for they said, “Surely he is utterly defeated before us[b], as in the first battle.”
translation:
  language: fr
  text: 'Alors les hommes d’Israël firent volte-face dans le combat, et Benjamin commença à faire des victimes parmi les hommes d’Israël, environ trente hommes[a]. Car les Benjaminites se disaient : « Assurément, Israël est bel et bien battu devant nous[b], comme lors du premier combat. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Benjamin commença à abattre parmi les hommes d’Israël une trentaine d’hommes ». L’expression hébraïque comportant le mot « tués » est concise et propre au langage du combat.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement « il est bel et bien battu », avec Israël envisagé comme une collectivité. On pourrait aussi comprendre : « ils sont bel et bien battus devant nous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: firent volte-face
  rationale: Dans ce contexte militaire, le verbe décrit le retournement des Israélites dans le combat. « Faire volte-face » exprime naturellement ce mouvement sans préciser s’il s’agit seulement d’un demi-tour ou du renversement de la situation.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: les hommes d’Israël
  rationale: Le singulier hébreu fonctionne ici collectivement et désigne les combattants israélites.
- source_word: בַּמִּלְחָמָה
  choice: dans la bataille
  rationale: La formulation situe le retournement au sein du combat en cours et conserve l’article défini de l’hébreu.
- source_word: וּבִנְיָמִן
  choice: Benjamin / les Benjaminites
  rationale: Le nom de la tribu désigne par métonymie ses combattants. « Benjamin » est conservé dans la proposition narrative, puis explicité par « les Benjaminites » devant le verbe pluriel « se disaient ».
- source_word: הֵחֵל לְהַכּוֹת חֲלָלִים
  choice: avait commencé à faire des victimes
  rationale: 'L’expression hébraïque, littéralement proche de « commencer à frapper des tués », est concise et idiomatique dans un récit de guerre. « Faire des victimes » en restitue naturellement le sens létal. Le plus-que-parfait rend l’arrière-plan narratif : ces pertes avaient commencé avant la volte-face d’Israël.'
- source_word: בְּאִישׁ יִשְׂרָאֵל
  choice: parmi eux
  rationale: La préposition indique le groupe au sein duquel Benjamin infligeait des pertes. Le pronom évite la répétition lourde de « parmi les hommes d’Israël » tout en gardant un référent clair.
- source_word: כִּשְׁלֹשִׁים אִישׁ
  choice: une trentaine d’hommes
  rationale: Le préfixe כ marque l’approximation. Cette tournure est courante et précise en français moderne.
- source_word: אַךְ נִגּוֹף נִגָּף הוּא
  choice: Oui, Israël est bel et bien battu
  rationale: La construction infinitif absolu plus verbe conjugué intensifie l’affirmation. « Bel et bien » rend cette insistance, tandis que « Israël » explicite le référent du pronom masculin singulier hébreu sans convertir silencieusement celui-ci au pluriel.
- source_word: כַּמִּלְחָמָה הָרִאשֹׁנָה
  choice: comme lors du premier combat
  rationale: Cette formulation idiomatique renvoie clairement au premier affrontement mentionné dans le récit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple porte l’action principale, tandis que le plus-que-parfait marque l’action déjà commencée par Benjamin. La formulation évite une traduction littérale obscure de חֲלָלִים tout en en signalant la structure dans une note.
