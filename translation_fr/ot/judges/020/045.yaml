base_translation:
  language: en
  yaml_path: translation/ot/judges/020/045.yaml
  text: Then they turned and fled toward the wilderness[a], to the rock of Rimmon. And they cut down five thousand men of them on the highways, and pursued them as far as Gidom[b], and struck down two thousand men of them.
translation:
  language: fr
  text: Ils se détournèrent et s’enfuirent vers le désert, en direction du rocher de Rimmon. Ils en abattirent cinq mille sur les routes[a], les poursuivirent jusqu’à Gidom et en abattirent deux mille[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « ils le glanèrent », image évoquant ici les fuyards abattus un à un, comme ce qui reste après une récolte.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie des suffixes au singulier (« après lui », « de lui ») pour désigner collectivement le groupe des Benjaminites en fuite.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: ils se détournèrent
  rationale: Le verbe פנה signale ici un changement de direction. « Se détournèrent » exprime ce mouvement sans préciser qu’ils seraient revenus sur leurs pas.
- source_word: וַיָּנֻסוּ הַמִּדְבָּרָה
  choice: s’enfuirent vers le désert
  rationale: נוס désigne la fuite, tandis que la terminaison directive de הַמִּדְבָּרָה indique un mouvement vers le désert.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: en direction du rocher de Rimmôn
  rationale: סֶלַע signifie « rocher » ou « escarpement ». La formulation française rend la direction du mouvement sans affirmer plus que le texte quant à l’arrivée au lieu.
- source_word: וַיְעֹלְלֻהוּ
  choice: furent abattus
  rationale: Dans ce contexte militaire, עלל évoque l’élimination des fuyards, avec l’image littérale du glanage. La tournure passive évite en français de donner l’impression que les fuyards s’abattent eux-mêmes, tout en conservant le sens contextuel.
- source_word: בַּמְסִלּוֹת
  choice: sur les routes
  rationale: מְסִלּוֹת désigne des voies aménagées ou des grandes routes. « Routes » est naturel en français moderne et suffisamment précis dans ce récit de poursuite.
- source_word: חֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: cinq mille d’entre eux
  rationale: Le nombre concerne les hommes du groupe en fuite. La formulation partitive française rend clairement cette relation sans ajouter « soldats », absent de l’hébreu.
- source_word: וַיַּדְבִּיקוּ אַחֲרָיו
  choice: on les poursuivit
  rationale: Le hifil de דבק décrit ici une poursuite serrée. « Poursuivit » restitue naturellement l’action sans ajouter un adverbe d’intensité non exprimé séparément dans le texte.
- source_word: עַד גִּדְעֹם
  choice: jusqu’à Guidom
  rationale: עַד marque la limite géographique de la poursuite. « Guidom » transcrit le nom hébreu גִּדְעֹם.
- source_word: וַיַּכּוּ מִמֶּנּוּ אַלְפַּיִם אִישׁ
  choice: on en frappa deux mille
  rationale: נכה signifie couramment « frapper » ou « abattre » dans un contexte de bataille. « En » conserve la valeur partitive de מִמֶּנּוּ, dont le suffixe singulier renvoie collectivement au groupe.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La voix passive puis le pronom indéfini « on » clarifient le changement d’acteur que l’hébreu laisse au contexte, sans nommer explicitement les poursuivants. Les métaphores et particularités grammaticales difficiles sont conservées en notes.
