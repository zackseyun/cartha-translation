  naturalness: Une formulation active avec « ils » et « en » est plus fluide en français narratif moderne et permet de suivre naturellement l’alternance entre les Benjaminites en fuite et leurs poursuivants.
  terminology: « Rimmon » et « Gidom » sont des translittérations françaises simples et internationalement lisibles. « Abattre » convient au contexte de combat; la note conserve l’image lexicale de « glaner ».
