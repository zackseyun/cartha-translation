  text: וַ/יְהִי֩ כָל הַ/נֹּ֨פְלִ֜ים מִ/בִּנְיָמִ֗ן עֶשְׂרִים֩ וַ/חֲמִשָּׁ֨ה אֶ֥לֶף אִ֛ישׁ שֹׁ֥לֵֽף חֶ֖רֶב בַּ/יּ֣וֹם הַ/ה֑וּא אֶֽת כָּל אֵ֖לֶּה אַנְשֵׁי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/046.yaml
  text: So all who fell from Benjamin that day were twenty-five thousand men who drew the sword[a]; all these were men of valor.
translation:
  language: fr
  text: Ainsi, tous ceux de Benjamin qui tombèrent ce jour-là furent au nombre de vingt-cinq mille hommes maniant l’épée ; tous ceux-là étaient des hommes de valeur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ainsi, … furent au nombre de
  rationale: La forme narrative introduit ici un bilan du combat. Cette tournure française marque naturellement la conséquence et porte l’idée d’un total sans reproduire l’hébraïsme « et il arriva ».
- source_word: כָל הַנֹּפְלִים מִבִּנְיָמִן
  choice: tous ceux de Benjamin qui tombèrent
  rationale: Le participe substantivé de נפל désigne ceux qui sont tombés au combat. « Ceux de Benjamin » exprime naturellement leur appartenance à la tribu tout en conservant la valeur de la préposition מן.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף אִישׁ
  choice: vingt-cinq mille hommes
  rationale: Rendu direct de l’expression numérique, sans ajouter ici une qualification militaire déjà indiquée par la suite du verset.
- source_word: שֹׁלֵף חֶרֶב
  choice: hommes maniant l’épée
  rationale: L’expression désigne idiomatiquement des combattants armés de l’épée. « Maniant l’épée » conserve l’image hébraïque et reste naturel en français dans ce contexte militaire.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Rendu temporel direct et idiomatique.
- source_word: אֶת כָּל אֵלֶּה
  choice: tous ceux-là
  rationale: La reprise démonstrative souligne que la qualification finale s’applique à la totalité des hommes qui viennent d’être comptés.
- source_word: אַנְשֵׁי חָיִל
  choice: des hommes de valeur
  rationale: La locution peut évoquer la vaillance, la capacité et la force, particulièrement au combat. « Hommes de valeur » préserve cette amplitude sans réduire explicitement le sens à « guerriers ».
