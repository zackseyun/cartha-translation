  text: וַ/יִּקְרְב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶל בְּנֵ֥י בִנְיָמִ֖ן בַּ/יּ֥וֹם הַ/שֵּׁנִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/024.yaml
  text: And the sons of Israel came near to the sons of Benjamin on the second day[a][b].
translation:
  language: fr
  text: Le deuxième jour, les fils d’Israël s’approchèrent des fils de Benjamin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avancèrent contre les fils de Benjamin ». L’hébreu dit littéralement « les fils d’Israël » et « les fils de Benjamin »; on peut aussi traduire « les Israélites » et « les Benjaminites ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: s’approchèrent
  rationale: Le qal de קרב exprime le fait de s’approcher. Dans ce contexte de bataille, « avancèrent contre » est possible, mais « s’approchèrent » conserve le mouvement exprimé sans rendre l’attaque plus explicite que ne le fait l’hébreu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction garde l’expression tribale et familiale littérale de l’hébreu, qui désigne ici collectivement les combattants d’Israël.
- source_word: אֶל
  choice: des
  rationale: Avec le verbe pronominal français « s’approcher », la préposition naturelle est « de ». Le contexte indique l’orientation vers les Benjaminites sans qu’il soit nécessaire d’ajouter explicitement « contre ».
- source_word: בְנֵי בִנְיָמִן
  choice: les fils de Benjamin
  rationale: La formulation conserve la désignation tribale familiale de l’hébreu et le parallélisme avec « les fils d’Israël ».
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Le deuxième jour
  rationale: L’hébreu emploie explicitement l’ordinal « deuxième »; cette traduction le préserve plutôt que de paraphraser par « le lendemain ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. L’ordre initial met en relief le repère temporel de façon naturelle. Les désignations « fils d’Israël » et « fils de Benjamin » conservent la couleur tribale de l’hébreu, tandis que la note signale les équivalents français plus idiomatiques.
