  text: וְ/הַ/מַּשְׂאֵ֗ת הֵחֵ֛לָּה לַ/עֲל֥וֹת מִן הָ/עִ֖יר עַמּ֣וּד עָשָׁ֑ן וַ/יִּ֤פֶן בִּנְיָמִן֙ אַחֲרָ֔י/ו וְ/הִנֵּ֛ה עָלָ֥ה כְלִיל הָ/עִ֖יר הַ/שָּׁמָֽיְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/040.yaml
  text: But the signal began to rise from the city as a pillar of smoke[a], and Benjamin turned behind him, and behold[c][b], the whole city was going up to the heavens.
translation:
  language: fr
  text: Le signal commença à s’élever de la ville sous la forme d’une colonne de fumée[a]. Benjamin se retourna[b], et voici que la ville tout entière montait vers le ciel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le brasier commença à s’élever de la ville en colonne de fumée ». Le terme hébreu peut désigner ce qui est élevé ; ici, il renvoie probablement au signal de bataille convenu à l’avance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « Benjamin se tourna derrière lui ». Cela peut signifier qu’il fit demi-tour ou qu’il regarda derrière lui.
    reason: lexical_alternative
  - marker: c
    text: Ou « la ville tout entière monta jusqu’au ciel », c’est-à-dire en flammes et en fumée.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂאֵת
  choice: le signal
  rationale: Dans le contexte de l’embuscade, le nom désigne vraisemblablement le signal convenu donné depuis la ville. « Signal » exprime clairement cette fonction sans préciser au-delà du texte sa nature exacte.
- source_word: הֵחֵלָּה לַעֲלוֹת
  choice: commença à s’élever
  rationale: La construction exprime le début d’un mouvement ascendant. Cette formulation est naturelle en français avec une colonne de fumée.
- source_word: עַמּוּד עָשָׁן
  choice: en colonne de fumée
  rationale: « Colonne de fumée » rend naturellement l’image d’une fumée verticale et conserve la métaphore hébraïque.
- source_word: וַיִּפֶן בִּנְיָמִן אַחֲרָיו
  choice: Benjamin se retourna
  rationale: Le verbe indique l’action de se tourner, et l’expression qui suit oriente ce mouvement vers l’arrière. « Se retourna » est idiomatique tout en laissant ouverte la question de savoir s’il s’est retourné physiquement ou a regardé derrière lui.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette tournure conserve l’effet de découverte soudaine et la vivacité narrative du marqueur hébreu.
- source_word: כְלִיל הָעִיר
  choice: la ville tout entière
  rationale: Cette expression rend l’idée de totalité de façon naturelle et soutenue en français.
- source_word: עָלָה ... הַשָּׁמָיְמָה
  choice: montait vers le ciel
  rationale: Le verbe et la terminaison directionnelle décrivent un mouvement ascendant. L’imparfait présente la scène en cours que Benjamin découvre, tandis que « vers le ciel » est l’expression française naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve le singulier collectif « Benjamin », l’effet dramatique de וְהִנֵּה et l’image volontairement condensée de la ville montant vers le ciel. Les ambiguïtés lexicales principales sont signalées en notes.
