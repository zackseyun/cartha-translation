source:
  edition: WLC
  text: וַ/יֵּצֵא֙ אִ֣ישׁ יִשְׂרָאֵ֔ל לַ/מִּלְחָמָ֖ה עִם בִּנְיָמִ֑ן וַ/יַּעַרְכ֨וּ אִתָּ֧/ם אִֽישׁ יִשְׂרָאֵ֛ל מִלְחָמָ֖ה אֶל הַ/גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/020.yaml
  text: The men of Israel went out to battle against Benjamin[a], and the men of Israel drew up for battle against them at Gibeah.
translation:
  language: fr
  text: Les hommes d’Israël sortirent pour combattre Benjamin, et ils se rangèrent en ordre de bataille face à eux, à Guibéa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers Guibéa ».'
    reason: La préposition hébraïque peut conserver une nuance directionnelle, bien que le contexte de déploiement favorise « à Guibéa ».
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortirent
  rationale: Dans ce récit militaire, יצא exprime le mouvement des combattants qui sortent pour engager le combat; « sortirent » reste proche de l’hébreu et naturel en français.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: les hommes d’Israël
  rationale: Le singulier morphologique אִישׁ a ici une valeur collective et désigne les hommes constituant la force combattante d’Israël.
- source_word: לַמִּלְחָמָה עִם בִּנְיָמִן
  choice: pour combattre Benjamin
  rationale: La construction indique l’engagement guerrier contre Benjamin; cette formulation française rend clairement le rapport hostile sans lourdeur.
- source_word: וַיַּעַרְכוּ ... מִלְחָמָה
  choice: se rangèrent en ordre de bataille
  rationale: ערך associé à מִלְחָמָה décrit la disposition organisée des troupes pour le combat.
- source_word: אִתָּם
  choice: face à eux
  rationale: La préposition marque littéralement une relation « avec eux », mais le contexte est celui de deux forces opposées; « face à eux » conserve la relation entre les lignes sans suggérer une alliance.
- source_word: אֶל הַגִּבְעָה
  choice: près de Guibéa
  rationale: אֶל exprime ici vraisemblablement l’orientation ou la position des troupes par rapport à Guibéa; « près de » fournit une localisation naturelle sans imposer le sens plus agressif « contre ».
theological_decisions:
- issue: Valeur collective et genrée de אִישׁ יִשְׂרָאֵל
  choice: les hommes d’Israël
  alternative: les Israélites; l’armée d’Israël
  rationale: Le texte désigne collectivement les combattants masculins. La traduction conserve cette précision plutôt que de la remplacer par une désignation abstraite ou neutre.
- issue: Rapport exprimé par אִתָּם dans un contexte de bataille
  choice: face à eux
  alternative: avec eux; contre eux
  rationale: « Avec eux » serait plus littéral mais pourrait évoquer une action commune en français; « contre eux » explicite davantage l’hostilité. « Face à eux » maintient le contexte adversarial tout en évitant de surdéterminer la préposition.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition hébraïque de « les hommes d’Israël » dans la seconde proposition est remplacée par « ils » pour une lecture naturelle, sans ambiguïté référentielle. « Guibéa » suit la forme française biblique usuelle du toponyme.
