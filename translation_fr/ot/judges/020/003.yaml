  text: וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י בִנְיָמִ֔ן כִּֽי עָל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑ה וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל דַּבְּר֕וּ אֵיכָ֥ה נִהְיְתָ֖ה הָ/רָעָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/003.yaml
  text: The sons of Benjamin heard that the sons of Israel had gone up to Mizpah[a]. And the sons of Israel said, “Tell us[b], how did this evil happen?”
translation:
  language: fr
  text: 'Les fils de Benjamin[a] apprirent que les fils d’Israël étaient montés à Mitspa. Les fils d’Israël dirent : « Dites-nous comment ce mal[b] s’est produit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « les Benjaminites » et « les Israélites ». L’hébreu répète « les fils de Benjamin » et « les fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: « Ce mal » pourrait aussi être rendu par « cette méchanceté » ou « ce forfait ». Le terme hébreu possède ici une forte portée morale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: apprirent
  rationale: Dans ce contexte narratif, שׁמע désigne la réception d’une nouvelle. « Apprirent » est naturel en français et évite de suggérer qu’ils ont directement entendu les paroles concernées.
- source_word: בְּנֵי בִנְיָמִן / בְּנֵי יִשְׂרָאֵל
  choice: les fils de Benjamin / les fils d’Israël
  rationale: Cette traduction conserve la construction hébraïque répétée et le parallélisme entre les deux groupes tribaux, tout en signalant en note les équivalents collectifs plus courants.
- source_word: כִּי עָלוּ
  choice: que … étaient montés
  rationale: Le verbe עלה signifie couramment « monter ». Le plus-que-parfait rend la montée antérieure à la nouvelle reçue par les fils de Benjamin.
- source_word: הַמִּצְפָּה
  choice: à Mitspa
  rationale: Mitspa est la forme française usuelle de ce nom de lieu. L’article hébreu n’est pas reproduit devant le toponyme en français.
- source_word: וַיֹּאמְרוּ
  choice: dirent alors
  rationale: « Dirent » traduit directement אמר. « Alors » intègre naturellement la valeur d’enchaînement du waw narratif sans introduire un marqueur temporel initial absent du lexème.
- source_word: דַּבְּרוּ
  choice: Dites-nous
  rationale: L’impératif « parlez » introduit ici une demande de récit. « Dites-nous » exprime naturellement en français le destinataire implicite sans préciser le contenu de la réponse.
- source_word: אֵיכָה נִהְיְתָה
  choice: comment … est arrivé
  rationale: La tournure rend de façon idiomatique la question sur la manière dont l’événement s’est produit.
- source_word: הָרָעָה הַזֹּאת
  choice: ce mal
  rationale: Dans le contexte de l’atrocité commise à Guibéa, רָעָה possède une forte portée morale. « Ce mal » la préserve sans réduire le terme à une simple catastrophe.
