  text: הִנֵּ֥ה כֻלְּ/כֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל הָב֥וּ לָ/כֶ֛ם דָּבָ֥ר וְ/עֵצָ֖ה הֲלֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/007.yaml
  text: Look, all of you sons of Israel, give your word and counsel here.
translation:
  language: fr
  text: 'Voici, vous tous, fils d’Israël : donnez ici votre avis et votre conseil.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Maintenant
  rationale: Dans cette prise de parole, l’interjection attire l’attention et introduit l’appel adressé à l’assemblée. « Maintenant » rend naturellement cette fonction en français, sans imposer le sens visuel de « voici ».
- source_word: כֻּלְכֶם בְּנֵי יִשְׂרָאֵל
  choice: Vous êtes tous des fils d’Israël
  rationale: Conserve l’appellation collective et traditionnelle « fils d’Israël », tout en produisant une phrase française naturelle.
- source_word: דָּבָר
  choice: avis
  rationale: Dans le couple « parole et conseil », le terme désigne ici ce que chacun a à dire sur l’affaire, donc son avis. « Donnez votre parole » serait ambigu en français moderne et pourrait évoquer une promesse.
- source_word: עֵצָה
  choice: conseil
  rationale: Correspond au sens courant de recommandation ou de délibération dans cette invitation à décider collectivement.
- source_word: הֲלֹם
  choice: ici
  rationale: Rend directement l’adverbe de lieu, qui renvoie à l’assemblée présente.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. L’adresse collective garde « fils d’Israël », formulation historique propre au récit, tandis que l’impératif est rendu idiomatiquement. Aucun marqueur de note n’est requis.
