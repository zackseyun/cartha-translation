  yaml_path: translation/ot/judges/020/008.yaml
  text: Then all the people rose up as one man, saying, “Not one of us will go to his tent, and not one of us will turn aside to his house.”
translation:
  language: fr
  text: 'Alors tout le peuple se leva comme un seul homme et déclara : « Aucun de nous n’ira à sa tente, aucun de nous ne se détournera pour rentrer chez lui. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Rend directement le verbe קום dans ce contexte d’action collective, en français naturel.
- source_word: כְּאִישׁ אֶחָד
  choice: comme un seul homme
  rationale: Conserve l’image hébraïque exprimant l’unanimité et l’unité d’action.
- source_word: לֹא נֵלֵךְ אִישׁ לְאָהֳלוֹ
  choice: Aucun de nous n’ira à sa tente
  rationale: Le distributif אִישׁ est rendu idiomatiquement par « aucun de nous », sans affaiblir la négation collective.
- source_word: וְלֹא נָסוּר אִישׁ לְבֵיתוֹ
  choice: aucun de nous ne retournera chez lui
  rationale: Dans ce mouvement vers le domicile, סור a le sens de se détourner ou de se retirer; « retournera » exprime naturellement l’idée en français, tandis que « chez lui » rend לְבֵיתוֹ sans lourdeur.
