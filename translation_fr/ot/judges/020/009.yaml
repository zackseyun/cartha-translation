  text: 'But now this is what we will do to Gibeah: against it by lot[a].'
translation:
  language: fr
  text: 'Mais maintenant, voici ce que nous ferons à Guibéa : nous agirons contre elle par tirage au sort[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous procéderons contre elle en tirant au sort ». L’hébreu est concis et peut vouloir dire que l’action de l’armée contre Guibéa sera organisée ou répartie par tirage au sort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Marque la transition vers la décision qui suit, avec une légère nuance adversative et temporelle.
- source_word: זֶה הַדָּבָר אֲשֶׁר
  choice: voici ce que
  rationale: Tour français naturel qui introduit un projet précis sans reproduire lourdement la construction hébraïque.
- source_word: נַעֲשֶׂה
  choice: nous ferons
  rationale: L'imparfait qal à la première personne du pluriel exprime ici une action future décidée.
- source_word: לַגִּבְעָה
  choice: à Guibéa
  rationale: Le ל désigne Guibéa comme cible de l'action; la tournure est ensuite précisée par « contre elle ».
- source_word: עָלֶיהָ
  choice: contre elle
  rationale: Dans ce contexte militaire, עַל exprime une action hostile dirigée contre la ville; le féminin reprend naturellement « Guibéa » en tant que ville.
- source_word: בְּגוֹרָל
  choice: par tirage au sort
  rationale: Rend clairement en français moderne le moyen par lequel l'action doit être organisée ou attribuée.
- source_word: עָלֶיהָ בְּגוֹרָל
  choice: nous agirons contre elle par tirage au sort
  rationale: Explicite sobrement la proposition hébraïque très elliptique, sans ajouter un verbe de mouvement ou préciser qu'il s'agit nécessairement de l'attaque elle-même.
