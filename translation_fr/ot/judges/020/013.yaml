base_translation:
  language: en
  yaml_path: translation/ot/judges/020/013.yaml
  text: Hand over the men[a], the sons of worthlessness, who are in Gibeah, so that we may put them to death and purge evil from Israel. But Benjamin was not willing to listen to the voice of their brothers[c][b], the sons of Israel.
translation:
  language: fr
  text: Livrez les hommes, ces vauriens qui sont à Guibéa, afin que nous les mettions à mort et que nous extirpions le mal d’Israël. Mais les Benjaminites ne voulurent pas écouter la voix de leurs frères, les Israélites[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Littéralement : « ne voulurent pas écouter la voix de leurs frères, les fils d’Israël » ; l’expression peut aussi signifier « ne pas prêter attention à » ou « ne pas obéir à ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: Livrez-nous
  rationale: Dans ce contexte judiciaire, l’impératif demande que les coupables soient remis à l’assemblée en vue de leur châtiment. Le complément « nous » est implicite dans la situation et rend la demande naturelle en français.
- source_word: בְּנֵי בְלִיַּעַל
  choice: ces vauriens
  rationale: L’expression idiomatique caractérise ces hommes comme moralement vils. « Vauriens » évite de faire de Bélial un nom propre tout en restant intelligible; la traduction plus littérale figure en note.
- source_word: וּנְמִיתֵם
  choice: afin que nous les mettions à mort
  rationale: Le cohortatif exprime le but de leur remise. « Mettre à mort » convient à la dimension judiciaire mieux que « tuer ».
- source_word: וּנְבַעֲרָה רָעָה מִיִּשְׂרָאֵל
  choice: et que nous extirpions le mal d’Israël
  rationale: La formule juridique et communautaire exprime l’élimination du mal au sein d’Israël. « Extirper » conserve cette force sans suggérer une combustion littérale.
- source_word: בִּנְיָמִן
  choice: les Benjaminites
  rationale: Le nom tribal singulier désigne collectivement les membres de la tribu. Le pluriel français est naturel et s’accorde avec « leurs frères ».
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: écouter
  rationale: Dans cet idiome, écouter la voix de quelqu’un implique prêter attention et se conformer à sa demande. Le français « écouter » conserve cette nuance sans alourdir la phrase.
- source_word: אֲחֵיהֶם בְּנֵי יִשְׂרָאֵל
  choice: leurs frères, les Israélites
  rationale: « Leurs frères » préserve le langage de parenté; « les Israélites » rend naturellement l’apposition « fils d’Israël ».
theological_decisions:
- issue: Sens de בְּנֵי בְלִיַּעַל
  choice: vauriens
  alternative: fils de perversité; fils de Bélial
  rationale: Dans ce contexte, l’expression constitue une qualification morale plutôt qu’une référence nécessaire à un être démoniaque nommé Bélial. La note préserve toutefois la forme hébraïque.
- issue: Portée judiciaire des cohortatifs
  choice: afin que nous les mettions à mort et que nous extirpions le mal d’Israël
  alternative: nous les tuerons et nous ôterons le mal d’Israël
  rationale: Cette formulation exprime le but judiciaire et la purification communautaire sans ajouter de précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, sobre et narratif. « Vauriens » est courant sans être familier à l’excès; « extirper le mal » maintient la solennité de la formule judiciaire. Le nom collectif Benjamin est rendu par « les Benjaminites » pour une syntaxe française claire.
