    rationale: L’impératif תְּנוּ demande de remettre les hommes, mais ne porte pas de pronom objet indirect correspondant à « nous ». Le contexte permet de l’inférer, mais il n’est pas nécessaire en français et son omission est plus fidèle.
  - severity: medium
    issue: La note « fils de perversité » ne rend pas correctement l’expression בְּנֵי בְלִיַּעַל.
    rationale: La valeur lexicale est celle de la non-valeur, de l’indignité ou de la bassesse. « Perversité » resserre et modifie la caractérisation. Une note doit soit signaler « fils de Bélial » comme forme traditionnelle, soit expliciter « fils de non-valeur ».
