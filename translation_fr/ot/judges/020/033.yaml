base_translation:
  language: en
  yaml_path: translation/ot/judges/020/033.yaml
  text: Then all the men of Israel rose from their place and drew up in battle formation at Baal-tamar[a], while the men lying in ambush of Israel rushed out from their place, from Maareh-geba.
translation:
  language: fr
  text: Alors tous les hommes d’Israël se levèrent de leur place et se rangèrent en ordre de bataille à Baal-Tamar, tandis que les hommes d’Israël placés en embuscade surgirent de leur position, depuis Maaré-Guéba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu Maaré-Guéba peut être compris comme un nom de lieu, ainsi qu’il est rendu ici. Il peut aussi se lire de manière descriptive : « l’espace découvert de Guéba » ou « la prairie de Guéba ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: tous les hommes d’Israël
  rationale: Avec כֹל, le singulier אִישׁ a ici une valeur distributive et collective. Dans ce contexte militaire, « tous les hommes d’Israël » est naturel et fidèle.
- source_word: קָמוּ מִמְּקוֹמוֹ
  choice: quittèrent leur position
  rationale: Le verbe pluriel se rapporte au sujet collectif, tandis que le suffixe singulier de « lieu » a une valeur distributive. « Quittèrent leur position » exprime naturellement le mouvement des troupes sans suggérer qu’elles étaient simplement assises.
- source_word: וַיַּעַרְכוּ
  choice: se rangèrent en ordre de bataille
  rationale: Dans un récit militaire, ערך désigne la mise en ordre des troupes pour le combat. Cette formulation rend explicitement ce sens contextuel.
- source_word: בְּבַעַל תָּמָר
  choice: à Baal-Tamar
  rationale: L’expression désigne vraisemblablement un lieu; le nom propre est donc translittéré plutôt que traduit.
- source_word: אֹרֵב יִשְׂרָאֵל
  choice: les hommes d’Israël placés en embuscade
  rationale: Le participe désigne celui ou ceux qui se tiennent en embuscade. La formulation française identifie clairement cette troupe comme l’embuscade israélite, sans laisser entendre qu’Israël en serait la cible.
- source_word: מֵגִיחַ
  choice: surgirent
  rationale: Le participe exprime une sortie soudaine depuis un endroit dissimulé; « surgirent » conserve la vivacité de la scène.
- source_word: מִמְּקוֹמוֹ
  choice: de leur position
  rationale: Le suffixe singulier est compris distributivement avec la troupe collective; le pluriel possessif est idiomatique en français.
- source_word: מִמַּעֲרֵה גָבַע
  choice: depuis Maaré-Guéba
  rationale: L’expression est difficile et peut conserver un nom de lieu. La translittération dans le texte principal préserve cette possibilité, tandis que les lectures descriptives figurent en note.
