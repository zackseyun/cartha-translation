translation_notes:
  register: Français international moderne, sobre et digne. La traduction privilégie une syntaxe claire tout en conservant l’image du combat qui « rattrape » les fuyards et l’ellipse difficile de la dernière proposition. Les termes plus explicites « fuir », « massacrer » et « sortir des embuscades » ont été évités dans le corps du texte afin de ne pas résoudre au-delà de l’hébreu les ambiguïtés tactiques du verset.
