  text: So they turned before the men of Israel toward the way of the wilderness[a], but the battle overtook them[c][b]; and those from the cities were destroying them in their midst.
translation:
  language: fr
  text: Ils se replièrent devant les hommes d’Israël, vers le chemin du désert[a], mais le combat les rattrapa[b] ; et ceux qui venaient des villes les détruisaient au milieu d’eux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant les hommes d’Israël ». Dans ce contexte, l’expression peut indiquer qu’ils se retiraient de devant eux, c’est-à-dire qu’ils battaient en retraite.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la bataille les rejoignit » ; l’expression décrit le combat qui les rattrape dans leur retraite.'
    reason: lexical_alternative
  - marker: c
    text: La dernière proposition est concise et difficile en hébreu. Elle peut désigner des forces israélites venues des villes — ou sorties de positions d’embuscade — qui frappaient les Benjaminites au milieu de leurs rangs.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְנוּ לִפְנֵי אִישׁ יִשְׂרָאֵל
  choice: Ils se détournèrent des hommes d’Israël
  rationale: Le verbe פנה signifie fondamentalement « tourner, se détourner ». Dans ce contexte militaire, le mouvement est une retraite. La formulation française exprime ce mouvement sans aller jusqu’au verbe plus interprétatif « fuir ». אִישׁ יִשְׂרָאֵל désigne ici les combattants d’Israël, d’où « les hommes d’Israël ».
- source_word: אֶל דֶּרֶךְ הַמִּדְבָּר
  choice: en direction du chemin du désert
  rationale: דֶּרֶךְ désigne un chemin ou une route. « Le chemin du désert » conserve la relation construite de l’hébreu, tandis que « en direction de » rend naturellement le mouvement introduit par אֶל.
- source_word: וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ
  choice: mais le combat les rattrapa
  rationale: Le hifil de דבק exprime ici l’idée de rejoindre ou de rattraper. Le singulier collectif hébreu renvoie à la troupe de Benjamin et se rend naturellement par le pluriel « les » en français. « Mais » explicite l’opposition contextuelle portée par la coordination.
- source_word: וַאֲשֶׁר מֵהֶעָרִים
  choice: et ceux qui venaient des villes
  rationale: 'La construction relative est elliptique : littéralement, « et ceux des villes ». L’ajout minimal de « venaient » produit un français intelligible tout en maintenant l’incertitude sur l’identité et le point de départ exacts de ces combattants.'
- source_word: מַשְׁחִיתִים אֹתוֹ
  choice: les détruisaient
  rationale: Le participe de שׁחת décrit une action destructrice continue dans le combat. Le pronom singulier hébreu vise collectivement Benjamin ou son armée ; le pluriel français évite de suggérer un individu isolé.
- source_word: בְּתוֹכוֹ
  choice: en leur sein
  rationale: L’expression signifie littéralement « en son milieu », avec un suffixe singulier à valeur collective. « En leur sein » conserve cette image et l’ambiguïté quant au groupe précis au milieu duquel se déroule l’action.
