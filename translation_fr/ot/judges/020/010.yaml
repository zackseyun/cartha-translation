source:
  edition: WLC
  text: וְ/לָקַ֣חְנוּ עֲשָׂרָה֩ אֲנָשִׁ֨ים לַ/מֵּאָ֜ה לְ/כֹ֣ל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וּ/מֵאָ֤ה לָ/אֶ֨לֶף֙ וְ/אֶ֣לֶף לָ/רְבָבָ֔ה לָ/קַ֥חַת צֵדָ֖ה לָ/עָ֑ם לַ/עֲשׂ֗וֹת לְ/בוֹאָ/ם֙ לְ/גֶ֣בַע בִּנְיָמִ֔ן כְּ/כָל הַ֨/נְּבָלָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה בְּ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/010.yaml
  text: And we will take ten men out of a hundred from all the tribes of Israel[a], and a hundred out of a thousand, and a thousand out of ten thousand, to get provisions for the people, so that when they come to Gibeah of Benjamin[b], they may do according to all the outrage that it committed in Israel.
translation:
  language: fr
  text: Nous prendrons, dans toutes les tribus d’Israël, dix hommes sur cent, cent sur mille et mille sur dix mille, afin de se procurer des provisions pour le peuple. À leur arrivée à Guibéa de Benjamin[b], ils agiront contre elle à la mesure de toute l’infamie[a] qu’elle a commise en Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « acte ignoble » ou « acte scandaleux ». Le mot hébreu désigne un acte révoltant et profondément déshonorant.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « pour faire, à leur arrivée à Guibéa de Benjamin ». La tournure est condensée et l’objet de « faire » reste implicite. La fin du verset peut aussi se comprendre : « selon toute l’infamie qui a été commise en Israël ».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְלָקַחְנוּ
  choice: Nous prendrons
  rationale: 'Le parfait qal à la première personne du pluriel, dans cette délibération collective, a une valeur prospective : l’assemblée expose son plan.'
- source_word: עֲשָׂרָה אֲנָשִׁים לַמֵּאָה ... וּמֵאָה לָאֶלֶף וְאֶלֶף לָרְבָבָה
  choice: dix hommes sur cent, cent sur mille et mille sur dix mille
  rationale: La formulation conserve clairement la sélection proportionnelle indiquée par l’hébreu.
- source_word: לְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: dans toutes les tribus d’Israël
  rationale: « Dans » exprime naturellement en français que les hommes sont prélevés au sein de l’ensemble des tribus.
- source_word: לָקַחַת צֵדָה
  choice: pour prendre des provisions
  rationale: צֵדָה désigne les vivres ou fournitures nécessaires à un déplacement ou à une campagne ; « provisions » reste assez large sans surinterpréter.
- source_word: לָעָם
  choice: pour le peuple
  rationale: La traduction garde le terme général de l’hébreu, même si le contexte vise ici la force assemblée pour combattre.
- source_word: לַעֲשׂוֹת לְבוֹאָם
  choice: Ainsi, quand ils arriveront ... ils agiront
  rationale: La chaîne d’infinitifs est fortement condensée. Cette formulation française en explicite le rapport temporel et final sans préciser indûment la forme de l’action.
- source_word: לְגֶבַע בִּנְיָמִן
  choice: à Guibéa de Benjamin
  rationale: La préposition indique la direction. Le contexte hostile est porté par la suite de la phrase plutôt qu’ajouté au nom du lieu.
- source_word: כְּכָל הַנְּבָלָה
  choice: en réponse à toute l’infamie
  rationale: נְבָלָה désigne ici un acte scandaleux et moralement honteux. « Infamie » en rend la forte condamnation ; « en réponse à » donne un français intelligible à la construction כְּכָל sans définir précisément la sanction.
- source_word: אֲשֶׁר עָשָׂה בְּיִשְׂרָאֵל
  choice: qu’elle a commise en Israël
  rationale: Le verbe hébreu est actif et au masculin singulier. Dans le contexte, le sujet peut être compris de manière corporative comme Guibéa ; le féminin français reprend naturellement le nom de la ville tout en laissant la note signaler la difficulté.
theological_decisions:
- issue: Force morale de נְבָלָה sans ajout d’une catégorie doctrinale
  choice: infamie
  alternative: acte ignoble ; acte scandaleux ; folie
  rationale: « Infamie » exprime la gravité morale et publique du crime sans importer de terminologie théologique étrangère au texte.
- issue: Nature de l’action envisagée contre Guibéa
  choice: ils agiront en réponse à
  alternative: ils lui feront subir une peine à la mesure de ; ils agiront contre elle conformément à
  rationale: L’hébreu demeure comprimé et ne nomme pas précisément la peine. La traduction conserve donc une certaine indétermination plutôt que de préciser qu’il s’agit d’une exécution judiciaire ou d’une vengeance.
- issue: Sujet singulier de אֲשֶׁר עָשָׂה
  choice: 'Guibéa comprise comme responsable collective : « qu’elle a commise »'
  alternative: « qui a été commise » ; « qu’il a commise »
  rationale: Le contexte attribue le forfait à Guibéa de façon corporative, mais la syntaxe hébraïque est délicate. Une note conserve l’autre lecture possible sans effacer cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Les nombres et le mouvement syntaxique du texte hébreu sont conservés, tandis que la chaîne d’infinitifs est légèrement explicitée pour être naturelle. Les marqueurs de notes sont placés sur les expressions qu’ils commentent.
