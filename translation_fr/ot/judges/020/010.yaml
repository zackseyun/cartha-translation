revisions:
- from: Nous prendrons, dans toutes les tribus d’Israël, dix hommes sur cent, cent sur mille et mille sur dix mille, pour prendre des provisions pour le peuple. Ainsi, quand ils arriveront à Guibéa de Benjamin[b], ils agiront en réponse à toute l’infamie[a] qu’elle a commise en Israël.
  to: Nous prendrons, dans toutes les tribus d’Israël, dix hommes sur cent, cent sur mille et mille sur dix mille, afin de se procurer des provisions pour le peuple. À leur arrivée à Guibéa de Benjamin[b], ils agiront contre elle à la mesure de toute l’infamie[a] qu’elle a commise en Israël.
  rationale: La révision remplace la formulation vague « en réponse à » par « à la mesure de », qui rend mieux la valeur de כְּכָל sans expliciter quelle sanction doit être appliquée. « Contre elle » rend explicite, de façon contextuellement justifiée, que l’action vise Guibéa, tout en conservant l’ambiguïté de l’action elle-même. La note b signale la compression syntaxique et l’alternative passive pour le dernier relatif.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:52:54Z'
review_pass:
  verdict: revise
  source_fidelity: La sélection proportionnelle, les provisions et la valeur prospective de « Nous prendrons » sont bien rendues. En revanche, « agiront en réponse à toute l’infamie » affaiblit la fonction de כְּכָל (« selon / à la mesure de ») et ne rend pas clairement que l’action est dirigée contre Guibéa à l’arrivée.
  naturalness: Le français est globalement fluide. « pour prendre des provisions » est toutefois lourd et répétitif après « Nous prendrons » ; « se procurer des provisions » est plus idiomatique. « Agir contre elle à la mesure de » est naturel dans ce contexte tout en restant non spécifique sur la mesure envisagée.
  terminology: « Guibéa », « provisions », « peuple » et « infamie » conviennent à un français international moderne. « Infamie » restitue bien la force morale de נְבָלָה sans introduire de catégorie doctrinale. Les notes sont conservées avec des ancres sur les expressions pertinentes.
  issues:
  - severity: medium
    issue: La relation exprimée par כְּכָל est rendue par « en réponse à ».
    rationale: La préposition appelle plutôt l’idée d’une action réglée sur, ou proportionnée à, l’infamie commise. « En réponse à » n’est pas impossible contextuellement, mais perd cette nuance et laisse moins percevoir la construction hébraïque.
  - severity: low
    issue: « pour prendre des provisions » répète inutilement le verbe « prendre ».
    rationale: Le sens de לָקַחַת צֵדָה est bien celui de se procurer ou prendre des provisions, mais « afin de se procurer » est plus naturel en français sans modifier le sens.
  revised_text: Nous prendrons, dans toutes les tribus d’Israël, dix hommes sur cent, cent sur mille et mille sur dix mille, afin de se procurer des provisions pour le peuple. À leur arrivée à Guibéa de Benjamin[b], ils agiront contre elle à la mesure de toute l’infamie[a] qu’elle a commise en Israël.
  revised_footnotes:
