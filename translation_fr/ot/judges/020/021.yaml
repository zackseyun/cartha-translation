  text: וַ/יֵּצְא֥וּ בְנֵֽי בִנְיָמִ֖ן מִן הַ/גִּבְעָ֑ה וַ/יַּשְׁחִ֨יתוּ בְ/יִשְׂרָאֵ֜ל בַּ/יּ֣וֹם הַ/ה֗וּא שְׁנַ֨יִם וְ/עֶשְׂרִ֥ים אֶ֛לֶף אִ֖ישׁ אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/021.yaml
  text: Then the sons of Benjamin came out from Gibeah and struck down twenty-two thousand men of Israel that day[a].
translation:
  language: fr
  text: Alors les fils de Benjamin sortirent de Guibéa et, ce jour-là, abattirent vingt-deux mille hommes d’Israël, les faisant tomber à terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sortirent de Guibéa et tuèrent ce jour-là vingt-deux mille hommes d’Israël. »'
    reason: Alternative lexicale pour le verbe de sortie et pour le verbe décrivant les pertes, conformément à la note de l’audit anglais.
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: sortirent
  rationale: Le verbe יצא indique la sortie des combattants hors de la ville dans la progression du récit; « sortirent de Guibéa » est naturel et conserve le point de départ.
- source_word: בְנֵי בִנְיָמִן
  choice: les fils de Benjamin
  rationale: Cette formulation préserve l’expression de parenté et l’identité tribale de l’hébreu, tout en restant compréhensible en français biblique moderne.
- source_word: מִן הַגִּבְעָה
  choice: de Guibéa
  rationale: La préposition מן marque ici l’origine, et l’article fait partie de la forme hébraïque du nom de la ville; « de Guibéa » est l’expression française idiomatique.
- source_word: וַיַּשְׁחִיתוּ
  choice: abattirent
  rationale: Dans ce contexte militaire assorti d’un bilan humain, le hiphil de שׁחת désigne une destruction mortelle. « Abattirent » exprime clairement la mise à mort au combat sans le caractère trop général de « détruisirent ».
- source_word: בְיִשְׂרָאֵל
  choice: hommes d’Israël
  rationale: Avec le nombre de victimes et אִישׁ, la construction désigne des hommes appartenant à Israël; cette formulation est fluide en français.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Équivalent français naturel et précis de l’indication temporelle hébraïque.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף
  choice: vingt-deux mille
  rationale: Rendu numérique standard en français moderne.
- source_word: אִישׁ
  choice: hommes
  rationale: Après le nombre, le singulier collectif hébreu se rend naturellement au pluriel en français. Le contexte militaire permet de comprendre qu’il s’agit de combattants sans devoir ajouter « soldats ».
- source_word: אָרְצָה
  choice: les jetant à terre
  rationale: La forme directive de אֶרֶץ signifie littéralement « vers la terre ». Cette tournure conserve l’image explicite du texte hébreu tout en évitant une coordination française maladroite.
theological_decisions: []
