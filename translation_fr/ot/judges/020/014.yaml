  text: וַ/יֵּאָסְפ֧וּ בְנֵֽי בִנְיָמִ֛ן מִן הֶ/עָרִ֖ים הַ/גִּבְעָ֑תָ/ה לָ/צֵ֥את לַ/מִּלְחָמָ֖ה עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/014.yaml
  text: And the sons of Benjamin gathered from the cities to Gibeah to go out to battle against the sons of Israel[a][b].
translation:
  language: fr
  text: Les Benjaminites, venus des villes, se rassemblèrent à Guibéa pour partir au combat contre les Israélites[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec les fils d’Israël ». Dans ce contexte de combat, « avec » a le sens adversatif de « contre » ; on peut aussi traduire les désignations tribales par « les fils de Benjamin » et « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: se rassemblèrent
  rationale: Le niphal de אסף exprime ici le fait de se réunir; la tournure pronominale est naturelle en français et conserve cette nuance.
- source_word: בְנֵי בִנְיָמִן
  choice: les Benjaminites
  rationale: En français moderne, le gentilé exprime clairement et dignement l’appartenance tribale, sans la lourdeur ni l’ambiguïté possible de « fils de Benjamin ».
- source_word: מִן הֶעָרִים
  choice: venant des villes
  rationale: La préposition מִן marque l’origine. Cette formulation rattache clairement le groupe à son point de départ tout en évitant une séquence française maladroite.
- source_word: הַגִּבְעָתָה
  choice: à Guibéa
  rationale: Le hé directionnel indique un mouvement vers Guibéa; « à Guibéa » est ici l’expression française naturelle de la destination après « se rassembler ».
- source_word: לָצֵאת
  choice: pour partir
  rationale: L’infinitif יצא signifie littéralement « sortir ». Dans ce contexte militaire, « partir » rend naturellement le mouvement en vue du combat sans ajouter explicitement l’idée de marcher.
- source_word: לַמִּלְחָמָה
  choice: au combat
  rationale: Dans l’expression לצאת למלחמה, מִלְחָמָה désigne l’action de combattre. « Partir au combat » est idiomatique et plus précis ici que « partir à la guerre ».
- source_word: עִם בְּנֵי יִשְׂרָאֵל
  choice: contre les Israélites
  rationale: Bien que עִם signifie ordinairement « avec », il prend dans un contexte de combat un sens adversatif. « Israélites » rend naturellement en français l’expression collective « fils d’Israël ».
theological_decisions: []
