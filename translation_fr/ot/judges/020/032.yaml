  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י בִנְיָמִ֔ן נִגָּפִ֥ים הֵ֛ם לְ/פָנֵ֖י/נוּ כְּ/בָ/רִאשֹׁנָ֑ה וּ/בְנֵ֧י יִשְׂרָאֵ֣ל אָמְר֗וּ נָנ֨וּסָה֙ וּֽ/נְתַקְּנֻ֔/הוּ מִן הָ/עִ֖יר אֶל הַֽ/מְסִלּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/032.yaml
  text: And the sons of Benjamin said[a], “They are being struck down before us as at the first.” But the sons of Israel said[c][b], “Let us flee and draw them away from the city to the highways.”
translation:
  language: fr
  text: 'Les fils de Benjamin dirent : « Ils sont battus devant nous comme la première fois[a]. » Mais les fils d’Israël dirent : « Fuyons et entraînons-les loin de la ville, vers les grandes routes[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme au commencement » ou « comme la première fois » ; il s’agit des affrontements précédents racontés dans ce chapitre.'
    reason: cross_reference
  - marker: b
    text: L’hébreu porte un complément singulier, « entraînons-le », probablement employé collectivement pour Benjamin ou son armée. On peut aussi traduire « vers les routes » ou « vers les voies principales ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגָּפִים
  choice: battus
  rationale: Dans ce contexte militaire, le participe passif indique qu’ils subissent des coups et paraissent vaincus. « Battus » conserve la force martiale tout en étant naturel en français.
- source_word: לְפָנֵינוּ
  choice: devant nous
  rationale: Rend directement l’idiome spatial et militaire hébreu, ici dans la bouche des Benjaminites.
- source_word: כְּבָרִאשֹׁנָה
  choice: comme la première fois
  rationale: Préserve le renvoi comparatif au premier affrontement sans ajouter explicitement le mot « bataille ».
- source_word: נָנוּסָה
  choice: Fuyons
  rationale: Le cohortatif à la première personne du pluriel exprime une résolution commune; « Fuyons » en restitue clairement la valeur volitive.
- source_word: וּנְתַקְּנֻהוּ
  choice: et entraînons-les loin
  rationale: Le verbe signifie tirer ou détacher en éloignant. Le pronom pluriel français reprend naturellement les combattants de Benjamin, tandis qu’une note signale le suffixe singulier collectif de l’hébreu.
- source_word: הָעִיר
  choice: la ville
  rationale: Équivalent courant de עִיר; le contexte désigne Guibéa.
- source_word: הַמְסִלּוֹת
  choice: les grandes routes
  rationale: מְסִלּוֹת désigne ici des voies aménagées ou principales. « Grandes routes » évite l’association moderne de « autoroutes » tout en étant plus précis que le seul mot « routes ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Les fils de Benjamin/Israël » conserve la formulation généalogique du texte. Le plus-que-parfait « s’étaient dit » rend le plan israélite antérieur à son exécution et clarifie le contraste narratif sans modifier son contenu.
