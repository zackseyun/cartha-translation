  text: וְ/אִ֤ישׁ יִשְׂרָאֵל֙ הָפַ֔ךְ וַ/יִּבָּהֵ֖ל אִ֣ישׁ בִּנְיָמִ֑ן כִּ֣י רָאָ֔ה כִּֽי נָגְעָ֥ה עָלָ֖י/ו הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/041.yaml
  text: Then the men of Israel turned[a], and the men of Benjamin were terrified, because they saw that disaster had come upon them.
translation:
  language: fr
  text: Alors les hommes d’Israël se retournèrent[a], et les hommes de Benjamin furent terrifiés, car ils virent que le désastre les avait atteints.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici plusieurs formes au singulier (« l’homme d’Israël », « l’homme de Benjamin », « il vit », « sur lui ») avec un sens collectif pour désigner les deux forces en présence ; le français les rend au pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: Alors les hommes d’Israël
  rationale: Le singulier אִישׁ a ici une valeur collective et désigne les combattants d’Israël. « Alors » marque naturellement la progression du récit.
- source_word: הָפַךְ
  choice: firent volte-face
  rationale: Dans ce contexte militaire, le verbe décrit un retournement tactique. « Firent volte-face » exprime clairement ce mouvement sans préciser davantage que l’hébreu.
- source_word: וַ/יִּבָּהֵל אִישׁ בִּנְיָמִן
  choice: les hommes de Benjamin furent terrifiés
  rationale: בּהל exprime une frayeur soudaine et intense. Le singulier « homme de Benjamin » est collectif et se rend naturellement au pluriel en français.
- source_word: כִּי רָאָה כִּי
  choice: car ils virent que
  rationale: Le premier כִּי introduit la cause, tandis que le second introduit le contenu de ce qu’ils constatent. Le verbe singulier est compris collectivement.
- source_word: נָגְעָה עָלָיו הָרָעָה
  choice: le désastre les avait atteints
  rationale: רָעָה désigne ici la calamité militaire plutôt que le mal moral. « Avait atteints » reste proche de l’image de נגע et le pronom pluriel restitue le sens collectif.
