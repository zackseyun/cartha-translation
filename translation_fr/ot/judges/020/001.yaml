    issue: 'Coordination géographique non parallèle : « depuis Dan jusqu’à Bersabée, ainsi que du pays de Galaad ».'
    rationale: L’hébreu ajoute « le pays de Galaad » à l’étendue des régions représentées. En français, « ainsi que du » après « depuis ... jusqu’à » est grammaticalement et stylistiquement heurté. « et depuis le pays de Galaad » rend explicitement et naturellement la seconde provenance.
  - severity: low
    issue: « auprès de Yahweh à Mitspa » est moins idiomatique et brouille légèrement la relation directionnelle/présentielle de la syntaxe hébraïque.
    rationale: Dans ce contexte de rassemblement, « devant Yahweh, à Mitspa » est la formulation française biblique la plus naturelle. La note maintient l’autre lecture, plus littérale, « vers Yahweh, à Mitspa », sans prétendre trancher la construction.
