source:
  edition: WLC
  text: וַ/יֵּצְאוּ֮ כָּל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/תִּקָּהֵ֨ל הָ/עֵדָ֜ה כְּ/אִ֣ישׁ אֶחָ֗ד לְ/מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וְ/אֶ֖רֶץ הַ/גִּלְעָ֑ד אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/001.yaml
  text: Then all the sons of Israel came out[a], and the congregation assembled as one man, from Dan to Beer-sheba, and from the land of Gilead[c][b], to Yahweh at Mizpah.
translation:
  language: fr
  text: Alors tous les fils d’Israël sortirent[a], et la communauté se rassembla comme un seul homme[b], depuis Dan jusqu’à Bersabée et depuis le pays de Galaad, devant Yahweh, à Mitspa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque traduite par « fils d’Israël » désigne ici collectivement le peuple et les tribus d’Israël, et non seulement les hommes.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « comme un seul homme » : idiome exprimant l’unité d’accord et d’action.'
    reason: lexical_alternative
  - marker: c
    text: 'On peut aussi comprendre : « vers Yahweh, à Mitspa ». La formulation hébraïque présente le rassemblement comme ayant lieu à Mitspa en relation avec Yahweh, ou dans sa présence.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: sortirent
  rationale: Le verbe יָצָא signifie couramment « sortir » ou « partir ». « Sortirent » conserve ici l’image du texte sans imposer un point de vue directionnel absent de l’hébreu.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: tous les fils d’Israël
  rationale: Cette traduction conserve l’expression hébraïque masculine et corporative. Dans ce contexte, elle désigne collectivement le peuple et les tribus d’Israël, et non uniquement des individus de sexe masculin.
- source_word: וַתִּקָּהֵל הָעֵדָה
  choice: la communauté se rassembla
  rationale: Le verbe exprime le rassemblement, et עֵדָה désigne ici le corps constitué de la communauté d’Israël. « Communauté » est naturel en français et n’ajoute pas une nuance exclusivement cultuelle.
- source_word: כְּאִישׁ אֶחָד
  choice: comme un seul homme
  rationale: La formulation conserve l’idiome hébreu, qui exprime l’unité d’accord et d’action.
- source_word: לְמִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: depuis Dan jusqu’à Bersabée
  rationale: Cette formule géographique désigne l’étendue du territoire israélite d’une extrémité à l’autre. Les formes françaises traditionnelles des toponymes sont employées.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: ainsi que du pays de Galaad
  rationale: Galaad ajoute à l’ensemble géographique le territoire situé à l’est du Jourdain. « Ainsi que du » rend explicite en français le lien avec la provenance des participants sans changer la portée du passage.
- source_word: אֶל יְהוָה
  choice: auprès de Yahweh
  rationale: אֶל signifie fondamentalement « vers, auprès de ». Dans ce contexte, la communauté se rassemble en relation avec Yahweh; « auprès de » préserve cette orientation tout en permettant la compréhension « en présence de ».
- source_word: הַמִּצְפָּה
  choice: à Mitspa
  rationale: Le nom de lieu est rendu sous sa forme française usuelle. « À Mitspa » indique naturellement le lieu où la communauté se rassemble auprès de Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le traite comme le nom propre divin et évite de le remplacer silencieusement par un titre.
- issue: Langage masculin à portée collective
  choice: Conserver « fils d’Israël » et « comme un seul homme »
  alternative: « Israélites » et « comme une seule personne »
  rationale: Les expressions masculines appartiennent à la forme et à l’imagerie du texte source. Une note précise la portée collective de la première et la valeur idiomatique de la seconde, sans les neutraliser dans le texte.
- issue: Rapport entre Yahweh et Mitspa dans אֶל יְהוָה הַמִּצְפָּה
  choice: « auprès de Yahweh à Mitspa »
  alternative: « devant Yahweh, à Mitspa » ou « vers Yahweh, à Mitspa »
  rationale: La syntaxe hébraïque associe l’orientation vers Yahweh au lieu de rassemblement, Mitspa. Le choix principal reste proche de cette formulation, tandis que la note conserve l’interprétation possible d’un rassemblement dans la présence de Yahweh.
translation_notes:
  register: 'Français international moderne, sobre et digne. Le passé simple convient au récit biblique écrit. Les toponymes suivent les formes françaises usuelles : Bersabée, Galaad et Mitspa. Les expressions hébraïques marquées sont conservées lorsqu’elles restent intelligibles, avec clarification en notes.'
