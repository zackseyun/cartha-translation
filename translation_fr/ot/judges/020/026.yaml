  naturalness: Le français est clair, moderne et d’un registre narratif digne. Le passé simple convient. « Montèrent et arrivèrent à Béthel » est à la fois plus exact et naturel dans ce contexte.
  terminology: « Yahweh », « fils d’Israël », « holocaustes » et « sacrifices de paix » sont des rendus recevables et cohérents avec l’hébreu. La note sur « sacrifices de communion » conserve utilement une alternative usuelle pour שְׁלָמִים.
