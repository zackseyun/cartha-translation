source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ כָל בְּנֵי֩ יִשְׂרָאֵ֨ל וְ/כָל הָ/עָ֜ם וַ/יָּבֹ֣אוּ בֵֽית אֵ֗ל וַ/יִּבְכּוּ֙ וַ/יֵּ֤שְׁבוּ שָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּצ֥וּמוּ בַ/יּוֹם הַ/ה֖וּא עַד הָ/עָ֑רֶב וַֽ/יַּעֲל֛וּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/026.yaml
  text: Then all the sons of Israel and all the people went up and came to Bethel[a], and they wept and sat there before Yahweh and fasted that day until evening[b]. Then they offered up burnt offerings and peace offerings before Yahweh.
translation:
  language: fr
  text: Alors, tous les fils d’Israël[a] et tout le peuple montèrent et arrivèrent à Béthel. Ils pleurèrent et s’assirent là devant Yahweh. Ce jour-là, ils jeûnèrent jusqu’au soir, puis ils offrirent devant Yahweh des holocaustes et des sacrifices de paix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous les Israélites ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sacrifices de communion ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: Le verbe עלה exprime un mouvement vers le haut. « Montèrent » conserve cette nuance directionnelle dans le récit de déplacement.
- source_word: כָל בְּנֵי יִשְׂרָאֵל וְכָל הָעָם
  choice: tous les fils d’Israël et tout le peuple
  rationale: « Fils d’Israël » préserve l’expression familiale et nationale de l’hébreu, tandis que « tout le peuple » maintient la seconde désignation emphatique sans la fondre dans la première.
- source_word: בֵית אֵל
  choice: Béthel
  rationale: Forme française usuelle du nom de lieu hébreu, plutôt qu’une traduction littérale comme « maison de Dieu ».
- source_word: וַיִּבְכּוּ
  choice: ils pleurèrent
  rationale: Le verbe בכה désigne ici les pleurs de lamentation après la défaite; « pleurèrent » est précis, naturel et digne.
- source_word: וַיֵּשְׁבוּ שָׁם לִפְנֵי יְהוָה
  choice: ils s’assirent là devant Yahweh
  rationale: ישב peut signifier s’asseoir, demeurer ou rester. Le sens concret « s’assirent » convient au contexte de lamentation et conserve l’image du texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » rend le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: וַיָּצוּמוּ
  choice: ils jeûnèrent
  rationale: Le verbe צום signifie s’abstenir de nourriture dans un contexte de deuil ou de dévotion; « jeûnèrent » en est l’équivalent français direct.
- source_word: בַיּוֹם הַהוּא עַד הָעָרֶב
  choice: ce jour-là, jusqu’au soir
  rationale: Cette formulation française naturelle conserve exactement la durée indiquée par l’hébreu.
- source_word: וַיַּעֲלוּ עֹלוֹת
  choice: ils offrirent des holocaustes
  rationale: Dans cette construction sacrificielle, la forme causative de עלה signifie « offrir »; עֹלוֹת désigne les sacrifices entièrement consumés, traditionnellement appelés « holocaustes » en français biblique.
- source_word: שְׁלָמִים
  choice: sacrifices de paix
  rationale: « Sacrifices de paix » rend de manière formelle le terme שְׁלָמִים, tout en laissant en note l’autre traduction courante qui souligne le repas partagé et la communion.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Désignation nationale בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix principal conserve la forme familiale masculine collective de l’hébreu. La note donne l’équivalent national plus idiomatique sans imposer une interprétation différente de l’étendue du groupe.
- issue: Sens sacrificiel de שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion
  rationale: Le terme peut évoquer la paix, l’intégrité et la communion liée au sacrifice. Le texte principal retient le rendu formel traditionnel, tandis que la note signale l’autre nuance reconnue.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsmes excessifs. Les répétitions et les gestes concrets du texte hébreu sont conservés; la ponctuation française clarifie la succession des actions sans résoudre l’emphase potentiellement appositionnelle de « tous les fils d’Israël et tout le peuple ».
