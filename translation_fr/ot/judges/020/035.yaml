source:
  edition: WLC
  text: וַ/יִּגֹּ֨ף יְהוָ֥ה אֶֽת בִּנְיָמִן֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּשְׁחִיתוּ֩ בְנֵ֨י יִשְׂרָאֵ֤ל בְּ/בִנְיָמִן֙ בַּ/יּ֣וֹם הַ/ה֔וּא עֶשְׂרִ֨ים וַ/חֲמִשָּׁ֥ה אֶ֛לֶף וּ/מֵאָ֖ה אִ֑ישׁ כָּל אֵ֖לֶּה שֹׁ֥לֵף חָֽרֶב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/035.yaml
  text: And Yahweh struck Benjamin down before Israel[a], and the sons of Israel destroyed twenty-five thousand one hundred men of Benjamin that day[b], all these drawing the sword.
translation:
  language: fr
  text: Yahvé battit Benjamin devant Israël[a]. Ce jour-là, les fils d’Israël détruisirent vingt-cinq mille cent hommes de Benjamin, tous tirant l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vainquit Benjamin face à Israël ».'
    reason: Alternative lexicale et idiomatique pour וַיִּגֹּף et לִפְנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: battit
  rationale: Dans ce contexte militaire, נָגַף exprime une défaite infligée. « Battit » est naturel en français et garde clairement Yahvé comme sujet, sans imposer que chaque membre de Benjamin ait été tué.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » translittère le nom divin plutôt que de lui substituer un titre.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: devant Israël
  rationale: Cette formulation conserve l’image et l’ambiguïté de l’expression hébraïque, qui peut désigner une défaite face à Israël.
- source_word: וַיַּשְׁחִיתוּ
  choice: tuèrent
  rationale: Le hiphil de שׁחת signifie détruire ou faire périr. Puisque l’objet est un nombre précis d’hommes tombés au combat, « tuèrent » rend naturellement ici la portée létale du verbe.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction formelle convient au contexte de combattants masculins et maintient la désignation hébraïque traditionnelle.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף וּמֵאָה אִישׁ
  choice: vingt-cinq mille cent hommes
  rationale: Rendu direct et idiomatique du nombre et du substantif אִישׁ.
- source_word: כָּל אֵלֶּה שֹׁלֵף חָרֶב
  choice: tous hommes tirant l’épée
  rationale: La tournure resserrée rattache le participe singulier collectif aux hommes dénombrés et préserve l’image hébraïque de l’épée tirée.
theological_decisions:
- issue: Articulation de l’action divine et de l’action humaine
  choice: 'Conserver deux propositions distinctes : Yahvé bat Benjamin, puis les fils d’Israël tuent ses hommes.'
  alternative: Réduire le résultat soit à la seule intervention divine, soit à la seule victoire militaire humaine.
  rationale: L’hébreu juxtapose explicitement l’action de Yahvé et celle des Israélites sans expliquer leur rapport causal; la traduction maintient cette tension.
translation_notes:
  register: Français international moderne, sobre et narratif. « Yahvé » conserve le nom propre divin; « les fils d’Israël » garde la forme du texte source dans ce contexte militaire. La répétition de « hommes » dans la dernière proposition reflète la valeur collective de l’expression hébraïque tout en restant intelligible.
