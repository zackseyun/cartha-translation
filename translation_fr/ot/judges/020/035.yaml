- from: Yahvé battit Benjamin devant Israël[a]. Ce jour-là, les fils d’Israël tuèrent vingt-cinq mille cent hommes de Benjamin, tous hommes tirant l’épée.
  to: Yahvé battit Benjamin devant Israël[a]. Ce jour-là, les fils d’Israël détruisirent vingt-cinq mille cent hommes de Benjamin, tous tirant l’épée.
  rationale: La révision corrige la construction française finale tout en conservant l’image de combattants « tirant l’épée ». Elle remplace « tuèrent » par « détruisirent » afin de refléter plus directement שׁחת, sans modifier le sens du bilan militaire ni la tension entre l’action divine et l’action humaine.
