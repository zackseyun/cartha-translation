    text: 'Ou : « vainquit Benjamin face à Israël ».'
    reason: Alternative lexicale et idiomatique pour וַיִּגֹּף et לִפְנֵי יִשְׂרָאֵל.
  revision_rationale: La révision corrige la construction française finale tout en conservant l’image de combattants « tirant l’épée ». Elle remplace « tuèrent » par « détruisirent » afin de refléter plus directement שׁחת, sans modifier le sens du bilan militaire ni la tension entre l’action divine et l’action humaine.
