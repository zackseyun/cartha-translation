  text: So Israel set men in ambush around Gibeah[a].
translation:
  language: fr
  text: Israël plaça des hommes en embuscade tout autour de Guibéa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut se rendre littéralement : « plaça des hommes en embuscade vers Guibéa, tout autour ». L’expression décrit le positionnement d’une troupe embusquée autour de la ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: plaça
  rationale: Le verbe שׂוּם signifie ici « mettre, placer ». « Plaça » exprime concrètement le déploiement de la troupe sans surinterpréter l'action.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom désigne collectivement les forces israélites.
- source_word: אֹרְבִים
  choice: des hommes en embuscade
  rationale: Le participe de ארב désigne des personnes qui se tiennent à l'affût, et non seulement l'embuscade comme dispositif abstrait.
- source_word: אֶל … סָבִיב
  choice: tout autour de
  rationale: Dans ce contexte militaire, l'association de אֶל et סָבִיב décrit la position des hommes par rapport à Guibéa. « Tout autour de » rend naturellement cette disposition, tout en signalant dans la note la nuance directionnelle possible de אֶל.
- source_word: הַגִּבְעָה
  choice: Guibéa
  rationale: Il s'agit du nom de lieu traditionnellement transcrit « Guibéa » en français ; l'article hébreu n'est pas reproduit devant le toponyme.
theological_decisions: []
