  text: וַ/יִּשְׁאֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּֽ/יהוָ֑ה וְ/שָׁ֗ם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים בַּ/יָּמִ֖ים הָ/הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/027.yaml
  text: And the sons of Israel inquired of Yahweh—for the ark of the covenant of God was there in those days—[a][b]
translation:
  language: fr
  text: Les fils d’Israël consultèrent Yahweh — l’arche de l’alliance de Dieu se trouvait là en ces jours-là —[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les Israélites consultèrent Yahweh. » L’hébreu dit littéralement « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: La proposition « l’arche de l’alliance de Dieu se trouvait là en ces jours-là » précise le cadre dans lequel ils consultèrent Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: consultèrent
  rationale: Avec la préposition ב et le nom divin, le verbe שׁאל désigne ici le fait de consulter Dieu pour recevoir sa réponse, et non une simple demande d’information.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression hébraïque formelle tout en restant intelligible en français; dans le contexte, elle désigne collectivement le peuple d’Israël.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: 'Après שׁאל, la préposition ב introduit celui que l’on consulte; le français exprime naturellement cet idiome sans préposition: « consulter Yahweh ».'
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וְשָׁם
  choice: — … se trouvait là
  rationale: La proposition apporte une précision explicative sur le cadre de la consultation. Les tirets rendent clairement sa valeur parenthétique sans surtraduire la conjonction.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: l’arche de l’alliance de Dieu
  rationale: Cette formulation française conserve la chaîne de compléments du texte hébreu et son association explicite de l’alliance avec Dieu.
- source_word: בַּיָּמִים הָהֵם
  choice: en ces jours-là
  rationale: Rendu proche de l’idiome hébreu, naturel dans un registre narratif biblique digne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom propre divin. « Yahweh » le représente directement; « le SEIGNEUR » constitue la substitution traditionnelle par un titre.
- issue: Nature de l’acte exprimé par שׁאל ביהוה
  choice: consultèrent Yahweh
  alternative: interrogèrent Yahweh
  rationale: « Consultèrent » indique une recherche de direction divine ou de réponse oraculaire sans préciser davantage le procédé, ce qui préserve la portée religieuse de l’idiome.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe parenthétique respecte la fonction explicative de la seconde proposition, tandis que « en ces jours-là » conserve la couleur narrative de l’hébreu.
