revisions:
- from: Les hommes d’Israël se retournèrent contre les Benjaminites et les passèrent au fil de l’épée. Dans chaque ville, ils tuèrent toute la population, ainsi que le bétail et tout ce qui s’y trouvait.[a] Ils incendièrent aussi toutes les villes qu’ils rencontrèrent.
  to: 'Les hommes d’Israël revinrent contre les Benjaminites et les frappèrent du tranchant de l’épée : dans chaque ville, les habitants, jusqu’au bétail, et jusqu’à tout ce qui s’y trouvait.[a] Ils mirent aussi le feu à toutes les villes qu’ils trouvèrent.'
  rationale: La révision relie la liste des personnes, du bétail et de tout ce qui était trouvé au verbe principal « frappèrent », conformément à la syntaxe du verset. Elle maintient une traduction contextuelle prudente de la locution hébraïque difficile et conserve une note explicitant l’incertitude, sans imposer une interprétation doctrinale ou une précision absente du texte.
