base_translation:
  language: en
  yaml_path: translation/ot/judges/020/048.yaml
  text: And the men of Israel turned back against the sons of Benjamin and struck them with the edge of the sword[a], from each city, men to livestock, even all that was found[c][b]. Also all the cities that were found they set on fire.
translation:
  language: fr
  text: 'Les hommes d’Israël revinrent contre les Benjaminites et les frappèrent du tranchant de l’épée : dans chaque ville, les habitants, jusqu’au bétail, et jusqu’à tout ce qui s’y trouvait.[a] Ils mirent aussi le feu à toutes les villes qu’ils trouvèrent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque rendue par « dans chaque ville, les habitants » est difficile. Elle semble désigner l’anéantissement complet des habitants des villes, avec le bétail et tout ce qui s’y trouvait.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: Les hommes d’Israël
  rationale: Le singulier אִישׁ a ici une valeur collective devant le verbe pluriel. Le contexte militaire favorise « les hommes d’Israël » plutôt que le terme plus général « le peuple d’Israël ».
- source_word: שָׁבוּ אֶל בְּנֵי בִנְיָמִן
  choice: se retournèrent contre les Benjaminites
  rationale: שׁוב exprime ici un retour offensif, et le verbe qui suit donne à אֶל une valeur hostile. « Les Benjaminites » rend naturellement l’expression généalogique « les fils de Benjamin » en français courant.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: les passèrent au fil de l’épée
  rationale: Cette tournure française établie conserve l’image concrète de la « bouche » ou du tranchant de l’épée et indique, dans ce contexte, une mise à mort.
- source_word: מֵעִיר מְתֹם
  choice: Dans chaque ville, ils tuèrent toute la population
  rationale: La construction hébraïque est difficile. מְתֹם paraît exprimer la totalité; dans le contexte, il s’agit vraisemblablement de l’extermination complète des habitants des villes. La traduction explicite ce sens probable, tandis que la note signale l’incertitude.
- source_word: עַד בְּהֵמָה עַד כָּל הַנִּמְצָא
  choice: ainsi que le bétail et tout ce qui s’y trouvait
  rationale: Les deux emplois de עַד étendent progressivement la portée de la destruction. « Ainsi que » et « tout » rendent cette progression totalisante dans un français naturel.
- source_word: גַּם כָּל הֶעָרִים הַנִּמְצָאוֹת
  choice: aussi toutes les villes qu’ils rencontrèrent
  rationale: Le participe de מצא désigne probablement les villes trouvées sur leur passage. « Qu’ils rencontrèrent » est plus idiomatique que « qui furent trouvées » sans supprimer l’idée de découverte.
- source_word: שִׁלְּחוּ בָאֵשׁ
  choice: Ils incendièrent
  rationale: L’expression signifie littéralement « envoyer dans le feu ». « Incendier » en donne clairement et sobrement le sens en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La violence du texte est exprimée directement, sans l’atténuer ni l’amplifier. La formulation privilégie la clarté tout en signalant en note l’obscurité de מֵעִיר מְתֹם.
