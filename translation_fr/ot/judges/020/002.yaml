  text: וַ/יִּֽתְיַצְּב֞וּ פִּנּ֣וֹת כָּל הָ/עָ֗ם כֹּ֚ל שִׁבְטֵ֣י יִשְׂרָאֵ֔ל בִּ/קְהַ֖ל עַ֣ם הָ/אֱלֹהִ֑ים אַרְבַּ֨ע מֵא֥וֹת אֶ֛לֶף אִ֥ישׁ רַגְלִ֖י שֹׁ֥לֵֽף חָֽרֶב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/002.yaml
  text: And the chiefs of all the people[a], of all the tribes of Israel, took their stand in the assembly of the people of God—four hundred thousand foot soldiers drawing the sword.
translation:
  language: fr
  text: 'Les chefs de tout le peuple[a] — de toutes les tribus d’Israël — se tinrent dans l’assemblée du peuple de Dieu : quatre cent mille hommes de pied tirant l’épée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les angles de tout le peuple » ; expression imagée désignant ses chefs ou ses principaux responsables.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: prirent place
  rationale: Le hitpael de יצב exprime le fait de se présenter et de prendre position. « Prirent place » convient à l’assemblée tout en laissant percevoir le rassemblement organisé.
- source_word: פִּנּוֹת
  choice: les chefs
  rationale: Le terme signifie littéralement « les angles », métaphore désignant ici les hommes qui soutiennent et dirigent le peuple. Une note conserve l’image hébraïque.
- source_word: כָּל הָעָם
  choice: de tout le peuple
  rationale: Rendu collectif naturel qui maintient l’idée d’ensemble.
- source_word: כֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: de toutes les tribus d’Israël
  rationale: L’apposition précise l’étendue du peuple réuni. « C’est-à-dire » explicite naturellement cette relation en français sans changer le référent.
- source_word: בִּקְהַל
  choice: dans l’assemblée
  rationale: קהל désigne une communauté effectivement rassemblée. « Assemblée » est actuel et évite la coloration ecclésiastique possible de « congrégation ».
- source_word: עַם הָאֱלֹהִים
  choice: du peuple de Dieu
  rationale: Traduction transparente du groupe construit, qui conserve sa portée théologique et sa solennité.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף
  choice: quatre cent mille
  rationale: Traduction directe du nombre ; « cent » reste invariable puisqu’il est suivi de « mille ».
- source_word: אִישׁ רַגְלִי
  choice: fantassins
  rationale: L’expression désigne des hommes combattant à pied. « Fantassins » est l’équivalent militaire français naturel et concis.
- source_word: שֹׁלֵף חָרֶב
  choice: tirant l’épée
  rationale: Le participe singulier a une valeur distributive après le nombre. La formulation conserve l’image vive et l’expression française traditionnelle sans ajouter explicitement « chacun ».
theological_decisions:
- issue: Traduction de עַם הָאֱלֹהִים
  choice: le peuple de Dieu
  alternative: le peuple qui appartient à Dieu
  rationale: La formulation retenue respecte directement la construction hébraïque et l’identification théologique d’Israël, sans développer davantage la nature de cette relation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la solennité du rassemblement tout en clarifiant l’apposition entre « tout le peuple » et « toutes les tribus d’Israël ». Le deux-points introduit naturellement l’effectif militaire.
