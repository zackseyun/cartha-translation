base_translation:
  language: en
  yaml_path: translation/ot/judges/020/034.yaml
  text: Then ten thousand chosen men from all Israel came against Gibeah[a], and the battle was fierce; but they did not know that disaster was closing in on them.
translation:
  language: fr
  text: Alors dix mille hommes d’élite, venus de tout Israël, arrivèrent en face de Guibéa, et le combat fut acharné. Mais les Benjaminites[a] ne savaient pas que le malheur était sur le point de les atteindre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils ». Dans le contexte, il s’agit des Benjaminites.'
    reason: referent_clarification
  - marker: b
    text: 'Littéralement : « que le malheur les touchait » ou « les atteignait ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד לַגִּבְעָה
  choice: en face de Guibéa
  rationale: מִנֶּגֶד désigne d’abord une position en face ou vis-à-vis de Guibéa. Le contexte militaire rend l’hostilité évidente sans qu’il soit nécessaire de remplacer cette indication spatiale par « contre ».
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ בָּחוּר
  choice: dix mille hommes d’élite
  rationale: בָּחוּר qualifie ici des combattants sélectionnés ou de premier choix. « Hommes d’élite » est naturel en français militaire et évite de réduire le terme au seul sens de « jeunes hommes ».
- source_word: מִכָּל יִשְׂרָאֵל
  choice: venus de tout Israël
  rationale: La préposition מִן indique que ces hommes avaient été tirés de l’ensemble d’Israël. L’ajout idiomatique de « venus » exprime clairement cette provenance.
- source_word: וְהַמִּלְחָמָה כָּבֵדָה
  choice: et le combat fut acharné
  rationale: כָּבֵד décrit ici la dureté et l’intensité des affrontements, non un poids physique. « Combat acharné » rend cette force dans un français actuel.
- source_word: וְהֵם לֹא יָדְעוּ
  choice: Mais les Benjaminites ne savaient pas
  rationale: Le pronom « ils » renvoie, dans le contexte, aux Benjaminites. Le nom explicite le référent en français et la conjonction adversative « mais » fait ressortir le contraste narratif.
- source_word: כִּי נֹגַעַת עֲלֵיהֶם הָרָעָה
  choice: que le malheur les atteignait déjà
  rationale: נגע signifie toucher ou atteindre, tandis que הָרָעָה désigne ici une calamité plutôt qu’un mal moral. « Les atteignait déjà » conserve l’image d’un désastre parvenu jusqu’à eux et son caractère imminent, sans lui substituer l’idée plus spécifique d’une poursuite.
