  yaml_path: translation/ot/judges/020/038.yaml
  text: The appointed sign between the men of Israel and the ambush was that they should make a great cloud of smoke rise from the city[a][b][c].
translation:
  language: fr
  text: Le signal convenu entre les hommes d’Israël et ceux qui étaient en embuscade[a] était qu’ils fassent monter de la ville une grande colonne de fumée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour les hommes d’Israël avec celui qui était en embuscade » ; il s’agit des deux parties liées par cet accord.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une grande masse de fumée ». L’expression hébraïque désigne une fumée abondante et bien visible s’élevant de la ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמּוֹעֵד
  choice: le signal convenu
  rationale: מוֹעֵד désigne habituellement un moment ou rendez-vous fixé, mais, dans ce contexte militaire, il s’agit de l’arrangement préalable servant de signal. « Signal convenu » exprime naturellement ces deux aspects.
- source_word: לְאִישׁ יִשְׂרָאֵל עִם הָאֹרֵב
  choice: entre les hommes d’Israël et ceux qui étaient en embuscade
  rationale: La construction associe les deux parties à l’accord. אֹרֵב est un participe collectif désignant les hommes placés en embuscade; cette formulation évite de présenter l’embuscade abstraite elle-même comme partie à l’accord.
- source_word: הֶרֶב לְהַעֲלוֹתָם
  choice: de faire monter … une épaisse colonne
  rationale: Le hifil de עלה exprime l’action de faire monter, tandis que l’infinitif absolu הֶרֶב intensifie cette action ou son résultat. « Épaisse » rend idiomatiquement le caractère important et visible de la fumée.
- source_word: מַשְׂאַת הֶעָשָׁן
  choice: une épaisse colonne de fumée
  rationale: מַשְׂאַת évoque ici une masse ou élévation de fumée. « Colonne de fumée » est une expression française naturelle pour un panache montant et visible servant de signal.
- source_word: מִן הָעִיר
  choice: de la ville
  rationale: La préposition מן indique simplement le point d’origine de la fumée.
