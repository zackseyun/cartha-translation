base_translation:
  language: en
  yaml_path: translation/ot/judges/020/047.yaml
  text: But six hundred men turned and fled toward the wilderness[a], to the rock of Rimmon[b], and stayed at the rock of Rimmon four months.
translation:
  language: fr
  text: Mais six cents hommes firent demi-tour et s’enfuirent vers le désert[a], au rocher de Rimmon[b]. Ils restèrent au rocher de Rimmon pendant quatre mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le désert ». La forme directionnelle hébraïque peut indiquer un mouvement vers le désert ou à l’intérieur de cette région.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « le rocher de Rimmon » ; ce nom de lieu peut aussi être rendu par « Rocher de Rimmon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: firent demi-tour
  rationale: Le verbe exprime ici un changement de direction dans le contexte de la fuite. « Firent demi-tour » rend ce mouvement plus clairement que le seul « se tournèrent ».
- source_word: וַיָּנֻסוּ
  choice: s’enfuirent
  rationale: נוּס désigne couramment la fuite, avec l’urgence propre au contexte militaire.
- source_word: הַמִּדְבָּרָה
  choice: vers le désert
  rationale: La forme directionnelle indique un mouvement vers le désert, éventuellement jusque dans cette région, sans permettre de trancher précisément; cette ambiguïté est signalée en note.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: jusqu’au rocher de Rimmôn
  rationale: « Jusqu’à » marque la destination précise après l’orientation générale « vers le désert ». « Le rocher de Rimmôn » conserve la construction transparente de l’hébreu.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: six cents hommes
  rationale: אִישׁ après le nombre désigne ici des hommes adultes dans un récit militaire.
- source_word: וַיֵּשְׁבוּ
  choice: restèrent
  rationale: Dans ce refuge temporaire, « restèrent » rend naturellement le maintien sur place sans suggérer une installation permanente.
- source_word: בְּסֶלַע רִמּוֹן
  choice: au rocher de Rimmôn
  rationale: La préposition בְּ indique ici la localisation auprès ou au sein de ce site rocheux; « au » reste naturel et ne précise pas indûment sa configuration.
- source_word: אַרְבָּעָה חֳדָשִׁים
  choice: pendant quatre mois
  rationale: La préposition française « pendant » explicite naturellement la durée exprimée par l’hébreu.
- source_word: וַ
  choice: Mais
  rationale: Le waw narratif relie le verset au contexte; « Mais » fait ressortir naturellement le contraste entre ces survivants et la destruction racontée auparavant.
