  text: וַ/יָּקֻ֤מוּ עָלַ/י֙ בַּעֲלֵ֣י הַ/גִּבְעָ֔ה וַ/יָּסֹ֧בּוּ עָלַ֛/י אֶת הַ/בַּ֖יִת לָ֑יְלָה אוֹתִ/י֙ דִּמּ֣וּ לַ/הֲרֹ֔ג וְ/אֶת פִּילַגְשִׁ֥/י עִנּ֖וּ וַ/תָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/005.yaml
  text: Then the men of Gibeah rose up against me and surrounded the house at night[a]. They intended to kill me, and they violated my concubine[b], and she died.
translation:
  language: fr
  text: Alors les hommes de Guibéa se sont dressés contre moi et ont encerclé la maison pendant la nuit. Ils avaient l’intention de me tuer ; ils ont violé ma concubine[a], et elle est morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ont humilié ma concubine ». Le verbe hébreu peut désigner une humiliation ou une grave violation ; dans ce contexte, il s’agit d’une agression sexuelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי הַגִּבְעָה
  choice: les hommes de Guibéa
  rationale: Le pluriel construit désigne ici idiomatiquement les habitants masculins, ou les notables, de la ville, sans impliquer un titre de noblesse.
- source_word: וַיָּקֻמוּ עָלַי
  choice: se sont dressés contre moi
  rationale: Cette expression conserve l’image de קום et exprime naturellement une action hostile en français.
- source_word: וַיָּסֹבּוּ עָלַי אֶת הַבַּיִת
  choice: ont encerclé la maison
  rationale: Le verbe סבב avec « la maison » comme complément indique qu’ils l’ont entourée ; le pronom hébreu renvoie à l’hostilité dirigée contre le locuteur et n’a pas besoin d’être répété lourdement.
- source_word: לָיְלָה
  choice: pendant la nuit
  rationale: Rend clairement la valeur temporelle de l’hébreu dans un français moderne et naturel.
- source_word: דִּמּוּ לַהֲרֹג
  choice: avaient l’intention de me tuer
  rationale: Dans ce contexte, דמה exprime un dessein ou une intention. L’imparfait restitue l’intention concomitante aux actions racontées.
- source_word: פִּילַגְשִׁי
  choice: ma concubine
  rationale: « Concubine » est le terme français historique usuel et précis pour פילגש.
- source_word: עִנּוּ
  choice: ont violé
  rationale: Le piel de ענה peut signifier humilier ou maltraiter, mais le contexte immédiat de Juges 19–20 indique sans ambiguïté une agression sexuelle ; « violer » en donne ici le sens contextuel exact.
- source_word: וַתָּמֹת
  choice: et elle est morte
  rationale: La coordination préserve la progression narrative hébraïque sans expliciter une relation causale plus forte que celle formulée dans le texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le récit à la première personne est rendu au passé composé, avec un imparfait pour l’intention concomitante. Le vocabulaire direct ne masque pas la violence sexuelle du contexte, tout en signalant en note l’étendue sémantique du verbe hébreu.
