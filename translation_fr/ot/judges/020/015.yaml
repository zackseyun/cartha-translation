base_translation:
  language: en
  yaml_path: translation/ot/judges/020/015.yaml
  text: 'And on that day the sons of Benjamin were mustered from the cities: twenty-six thousand men drawing the sword[a], besides the inhabitants of Gibeah[b], who were mustered as seven hundred chosen men.'
translation:
  language: fr
  text: 'Ce jour-là, les fils de Benjamin furent recensés : des villes, vingt-six mille hommes tirant l’épée[a], sans compter les habitants de Guibéa, qui furent recensés au nombre de sept cents hommes d’élite[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « maniant l’épée » ; l’expression hébraïque décrit des hommes armés pour le combat.
    reason: lexical_alternative
  - marker: b
    text: Ou « jeunes hommes » ; le terme hébreu peut évoquer la jeunesse, mais, dans ce contexte militaire, il désigne probablement des hommes choisis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקְדוּ / הִתְפָּקְדוּ
  choice: furent recensés
  rationale: Le hitpael de פקד désigne ici le recensement ou l’enrôlement en vue du service militaire. « Furent recensés » conserve l’idée de dénombrement, et sa répétition reflète celle de l’hébreu.
- source_word: בְנֵי בִנְיָמִן
  choice: les fils de Benjamin
  rationale: Cette formulation préserve l’expression tribale et familiale de l’hébreu tout en restant claire en français biblique moderne.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Expression temporelle française naturelle qui maintient la valeur démonstrative de l’hébreu.
- source_word: מֵהֶעָרִים
  choice: dans les villes
  rationale: La préposition מן peut indiquer le groupe ou le lieu d’où provient le dénombrement. En français, « recensés dans les villes » rend naturellement la répartition locale sans ajouter le possessif absent de l’hébreu.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אֶלֶף אִישׁ
  choice: vingt-six mille hommes
  rationale: Traduction directe du nombre et de אִישׁ; le caractère militaire est précisé par l’expression suivante.
- source_word: שֹׁלֵף חָרֶב
  choice: tirant l’épée
  rationale: Rendu concret et proche de l’idiome hébreu désignant des hommes aptes au combat, sans le remplacer par le terme plus général « soldats ».
- source_word: לְבַד
  choice: sans compter
  rationale: Marque clairement que les habitants de Guibéa constituent un contingent distinct, ajouté aux vingt-six mille précédents.
- source_word: מִיֹּשְׁבֵי הַגִּבְעָה
  choice: les habitants de Guibéa
  rationale: Rendu naturel du participe substantivé, avec la forme française traditionnelle du nom de lieu.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: sept cents hommes
  rationale: Traduction numérique directe qui conserve אִישׁ comme « hommes ».
- source_word: בָּחוּר
  choice: d’élite
  rationale: Dans ce contexte militaire, le mot qualifie vraisemblablement des combattants sélectionnés ou de choix; « d’élite » exprime cette fonction sans insister indûment sur leur âge.
