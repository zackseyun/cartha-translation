  text: וַ/יֵּצְא֤וּ בְנֵֽי בִנְיָמִן֙ לִ/קְרַ֣את הָ/עָ֔ם הָנְתְּק֖וּ מִן הָ/עִ֑יר וַ/יָּחֵ֡לּוּ לְ/הַכּוֹת֩ מֵ/הָ/עָ֨ם חֲלָלִ֜ים כְּ/פַ֣עַם בְּ/פַ֗עַם בַּֽ/מְסִלּוֹת֙ אֲשֶׁ֨ר אַחַ֜ת עֹלָ֣ה בֵֽית אֵ֗ל וְ/אַחַ֤ת גִּבְעָ֨תָ/ה֙ בַּ/שָּׂדֶ֔ה כִּ/שְׁלֹשִׁ֥ים אִ֖ישׁ בְּ/יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/031.yaml
  text: And the sons of Benjamin came out to meet the people[a], and were drawn away from the city; and they began to strike down some of the people, as at other times, on the highways, one of which goes up to Bethel and one to Gibeah in the open country[d][c][b], about thirty men of Israel.
translation:
  language: fr
  text: Les fils de Benjamin sortirent à la rencontre du peuple[a] et furent entraînés loin de la ville. Ils commencèrent, comme les fois précédentes[c], à abattre des hommes du peuple sur les routes — l’une monte vers Béthel et l’autre vers Guibéa, en rase campagne[d] —, soit environ trente hommes d’Israël.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Benjaminites ». L’hébreu dit littéralement « les fils de Benjamin ».
    reason: lexical_alternative
  - marker: b
    text: La construction hébraïque présente « environ trente hommes d’Israël » comme les victimes abattues lors de cette attaque.
    reason: syntax_clarification
  - marker: c
    text: Ou « comme auparavant ». L’expression hébraïque renvoie aux combats précédents.
    reason: lexical_alternative
  - marker: d
    text: Littéralement « dans la campagne » ou « dans le champ »; l’expression semble situer la route en terrain découvert.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: sortirent
  rationale: Verbe narratif simple exprimant le mouvement hors de la ville; le passé simple convient au registre narratif biblique moderne.
- source_word: בְנֵי בִנְיָמִן
  choice: les fils de Benjamin
  rationale: Conserve l’expression de parenté et l’identité tribale de l’hébreu; « les Benjaminites » est signalé en note comme équivalent naturel.
- source_word: לִקְרַאת הָעָם
  choice: à la rencontre du peuple
  rationale: Rend directement עָם sans expliciter en « armée », bien que le contexte désigne les forces israélites.
- source_word: הָנְתְּקוּ מִן הָעִיר
  choice: se laissèrent entraîner loin de la ville
  rationale: Exprime la séparation tactique d’avec la ville et sa protection, tout en conservant la nuance contextuelle d’un éloignement provoqué.
- source_word: וַיָּחֵלּוּ לְהַכּוֹת
  choice: ils commencèrent … à abattre
  rationale: Rend la valeur ingressive de חלל au hiphil et le caractère ici mortel de נכה, confirmé par חֲלָלִים.
- source_word: מֵהָעָם חֲלָלִים
  choice: des hommes du peuple … et tuèrent
  rationale: Le מן partitif est rendu par « des hommes du peuple »; la notion de victimes tuées portée par חֲלָלִים est exprimée naturellement avec le total final.
- source_word: כְּפַעַם בְּפַעַם
  choice: comme les fois précédentes
  rationale: Rend l’idiome qui compare cette attaque aux affrontements antérieurs du récit.
- source_word: בַּמְסִלּוֹת
  choice: sur les routes
  rationale: « Routes » est naturel en français et convient à מסלות, des voies aménagées ou principales.
- source_word: אַחַת עֹלָה בֵית אֵל
  choice: l’une monte vers Béthel
  rationale: Conserve le langage topographique courant de עלה et la structure concise de l’hébreu.
- source_word: וְאַחַת גִּבְעָתָה בַּשָּׂדֶה
  choice: l’autre vers Guibéa, en rase campagne
  rationale: Rend le ה directionnel de גבעתה et comprend בַשָּׂדֶה comme une indication topographique de terrain découvert.
- source_word: כִּשְׁלֹשִׁים אִישׁ בְּיִשְׂרָאֵל
  choice: environ trente hommes d’Israël
  rationale: Traduction directe du nombre approximatif et de l’appartenance des victimes à Israël.
