  text: וַ/יַּעֲל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יִּבְכּ֣וּ לִ/פְנֵֽי יְהוָה֮ עַד הָ/עֶרֶב֒ וַ/יִּשְׁאֲל֤וּ בַֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אוֹסִ֗יף לָ/גֶ֨שֶׁת֙ לַ/מִּלְחָמָ֔ה עִם בְּנֵ֥י בִנְיָמִ֖ן אָחִ֑/י וַ/יֹּ֥אמֶר יְהוָ֖ה עֲל֥וּ אֵלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/023.yaml
  text: Then the sons of Israel went up and wept before Yahweh until evening[a], and they inquired of Yahweh, saying, “Shall I continue to go near for battle with the sons of Benjamin, my brother?” And Yahweh said, “Go up against him.”
translation:
  language: fr
  text: 'Les fils d’Israël montèrent et pleurèrent devant Yahweh jusqu’au soir. Ils consultèrent Yahweh en disant : « Dois-je continuer à m’avancer au combat contre les fils de Benjamin, mon frère[a] ? » Yahweh répondit : « Montez contre lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Dois-je de nouveau m’avancer au combat contre les fils de Benjamin, mon frère ? » Le verbe hébreu peut exprimer soit la poursuite, soit la répétition de l’attaque. La préposition rendue par « contre » signifie habituellement « avec », mais peut avoir ici un sens adversatif dans le contexte du combat.'
    reason: La note préserve les deux nuances possibles de הַאוֹסִיף et signale sans la trancher indûment la valeur contextuellement hostile possible de עִם.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: Le verbe עלה exprime un mouvement ascendant, probablement vers le lieu où Yahweh était consulté, sans que la destination soit explicitée.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’image familiale et l’identité collective exprimées par l’hébreu.
- source_word: וַיִּבְכּוּ
  choice: pleurèrent
  rationale: Le verbe בכה désigne ici les pleurs de détresse et de deuil devant Dieu.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » rend directement לִפְנֵי, tandis que le nom divin est transcrit « Yahweh ».
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: ils consultèrent Yahweh
  rationale: Dans ce contexte, שאל avec ב désigne une demande adressée à Dieu afin de connaître sa volonté; « consulter » exprime naturellement cette démarche oraculaire.
- source_word: הַאוֹסִיף
  choice: Dois-je continuer
  rationale: La forme à la première personne du singulier représente Israël comme une entité collective. Le hiphil de יסף peut indiquer la poursuite ou la répétition de l’action; l’autre possibilité est signalée en note.
- source_word: לָגֶשֶׁת לַמִּלְחָמָה
  choice: à m’avancer au combat
  rationale: Cette expression conserve l’idée d’approcher ou de s’avancer tout en donnant à la phrase une tournure française naturelle dans le contexte militaire.
- source_word: עִם בְּנֵי בִנְיָמִן
  choice: contre les fils de Benjamin
  rationale: Bien que עִם signifie ordinairement « avec », le contexte d’un affrontement militaire lui donne ici une valeur adversative.
- source_word: אָחִי
  choice: mon frère
  rationale: Le singulier et le suffixe de première personne sont conservés; Israël parle comme une personne collective et reconnaît Benjamin comme son frère.
- source_word: עֲלוּ אֵלָיו
  choice: Montez contre lui
  rationale: L’impératif est pluriel. « Montez » garde le mouvement exprimé par עלה, et « contre lui » rend la direction hostile imposée par le contexte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; sa transcription préserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Alternance entre le groupe pluriel et le locuteur singulier
  choice: « Ils consultèrent » puis « Dois-je… mon frère ? »
  alternative: « Devons-nous… notre frère ? »
  rationale: Le texte hébreu passe intentionnellement du pluriel narratif à la première personne du singulier dans la question, présentant Israël comme une personne collective. Cette tension grammaticale et théologique est conservée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple convient au récit biblique suivi. La formulation conserve les traits marqués de l’hébreu, notamment « les fils d’Israël », la première personne du singulier dans la parole collective et « mon frère », tout en rendant naturellement le contexte militaire.
