source:
  edition: WLC
  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֜ל הִתְפָּֽקְד֗וּ לְ/בַד֙ מִ/בִּנְיָמִ֔ן אַרְבַּ֨ע מֵא֥וֹת אֶ֛לֶף אִ֖ישׁ שֹׁ֣לֵֽף חָ֑רֶב כָּל זֶ֖ה אִ֥ישׁ מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/017.yaml
  text: And the men of Israel[a], apart from Benjamin, were mustered at four hundred thousand men drawing the sword[c][b]; all these were men of war.
translation:
  language: fr
  text: 'Les hommes d’Israël, à l’exclusion de Benjamin[a], furent recensés[b] : ils étaient quatre cent mille hommes tirant l’épée[c]. Tous étaient des hommes de guerre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mis à part Benjamin ». Benjamin n’est pas compris dans le total indiqué.
    reason: lexical_alternative
  - marker: b
    text: Ou « furent mobilisés ». Le verbe hébreu peut évoquer aussi bien le dénombrement que le rassemblement d’hommes pour le service militaire.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « tirant l’épée », expression hébraïque désignant des combattants armés.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: Les hommes d’Israël
  rationale: Le singulier אִישׁ a ici un sens collectif, comme le confirme le verbe au pluriel. « Les hommes d’Israël » conserve la portée masculine et militaire du groupe concerné.
- source_word: הִתְפָּקְדוּ
  choice: furent recensés
  rationale: Dans ce contexte militaire, le hitpael de פקד peut désigner le fait d’être compté, recensé ou mobilisé. « Furent recensés » rend clairement l’opération de dénombrement tout en laissant la note signaler sa nuance militaire.
- source_word: לְבַד מִבִּנְיָמִן
  choice: à l’exclusion de Benjamin
  rationale: La locution sépare Benjamin du total indiqué. Cette formulation française exprime sans ambiguïté que la tribu de Benjamin n’est pas comprise dans le nombre.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ
  choice: quatre cent mille hommes
  rationale: Le texte hébreu emploie explicitement אִישׁ après le nombre. « Hommes » maintient cette précision sans ajouter le terme interprétatif « soldats ».
- source_word: שֹׁלֵף חָרֶב
  choice: tirant l’épée
  rationale: La traduction conserve l’image concrète de l’hébreu, qui sert d’expression militaire pour désigner des combattants armés.
- source_word: כָּל זֶה
  choice: Tous
  rationale: Littéralement « tout ceci », l’expression reprend collectivement les quatre cent mille hommes. « Tous » est naturel en français et rend correctement ce référent collectif.
- source_word: אִישׁ מִלְחָמָה
  choice: des hommes de guerre
  rationale: Cette expression formelle et intelligible conserve de près l’expression militaire hébraïque ainsi que sa désignation masculine.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement restructurée après les deux-points pour éviter la tournure lourde « recensés au nombre de », tout en conservant le dénombrement militaire, l’image de l’épée et l’expression « hommes de guerre ».
