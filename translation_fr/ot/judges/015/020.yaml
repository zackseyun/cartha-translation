  text: וַ/יִּשְׁפֹּ֧ט אֶת יִשְׂרָאֵ֛ל בִּ/ימֵ֥י פְלִשְׁתִּ֖ים עֶשְׂרִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/020.yaml
  text: And he judged Israel in the days of the Philistines twenty years[a].
translation:
  language: fr
  text: Il jugea Israël à l’époque des Philistins pendant vingt ans[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dirigea Israël pendant vingt ans » ; le verbe hébreu peut désigner une activité de gouvernement plus large que le seul exercice de la justice.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: Il jugea
  rationale: Dans le livre des Juges, שׁפט désigne l’exercice de la fonction de juge, qui comprend une direction plus large que le seul prononcé de décisions judiciaires. « Jugea » maintient le terme récurrent et le lien littéraire avec le titre du livre.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte porte le nom propre « Israël » comme complément direct. Cette formulation est fidèle à l’hébreu et naturelle en français biblique actuel.
- source_word: בִּימֵי פְלִשְׁתִּים
  choice: à l’époque des Philistins
  rationale: Littéralement « aux jours des Philistins ». « À l’époque des Philistins » restitue naturellement l’idée temporelle en français moderne sans préciser davantage la nature de leur domination.
- source_word: עֶשְׂרִים שָׁנָה
  choice: pendant vingt ans
  rationale: L’ajout idiomatique de « pendant » indique clairement que les vingt ans constituent la durée de son activité de juge.
theological_decisions:
- issue: Portée de la fonction exprimée par שׁפט
  choice: Conserver « jugea »
  alternative: « dirigea Israël » ou « gouverna Israël »
  rationale: « Jugea » préserve la terminologie structurante du livre sans réduire la fonction à une activité judiciaire moderne ni lui attribuer explicitement une souveraineté politique que le verset ne formule pas.
translation_notes:
  register: Français international moderne, sobre et digne. « À l’époque de » évite l’archaïsme de « aux jours de », tandis que « jugea » conserve le terme clé du livre. Le pronom « il » reprend Samson dans le contexte immédiat.
