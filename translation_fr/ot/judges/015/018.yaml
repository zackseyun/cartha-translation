  text: וַ/יִּצְמָא֮ מְאֹד֒ וַ/יִּקְרָ֤א אֶל יְהוָה֙ וַ/יֹּאמַ֔ר אַתָּה֙ נָתַ֣תָּ בְ/יַֽד עַבְדְּ/ךָ֔ אֶת הַ/תְּשׁוּעָ֥ה הַ/גְּדֹלָ֖ה הַ/זֹּ֑את וְ/עַתָּה֙ אָמ֣וּת בַּ/צָּמָ֔א וְ/נָפַלְתִּ֖י בְּ/יַ֥ד הָ/עֲרֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/018.yaml
  text: And he became very thirsty[a], and he called to Yahweh and said, “You have given this great deliverance by the hand of your servant[c][b], and now shall I die from thirst and fall into the hand of the uncircumcised?”
translation:
  language: fr
  text: 'Il eut très soif, alors il invoqua Yahweh et dit : « C’est toi qui as accordé, par la main de ton serviteur, cette grande délivrance[a]. Et maintenant, vais-je mourir de soif et tomber entre les mains des incirconcis[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette grande victoire » ou « ce grand salut ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « les incirconcis » désigne les ennemis d’Israël, en particulier les Philistins, au moyen d’un terme chargé d’une connotation liée à l’alliance.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּצְמָא מְאֹד
  choice: Il eut très soif
  rationale: Le verbe צמא exprime ici le fait d’éprouver une soif intense. Cette formulation est naturelle en français moderne et convient à la succession narrative.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: il invoqua Yahweh
  rationale: קרא אל désigne un appel adressé à quelqu’un, ici dans la prière. « Invoqua » rend clairement cet appel à Dieu sans ajouter nécessairement la nuance plus intense de « cria vers ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אַתָּה נָתַתָּ
  choice: C’est toi qui as accordé
  rationale: La tournure emphatique rend le pronom אַתָּה placé en tête et souligne que Yahweh est l’auteur de la délivrance. Le passé composé convient à l’action tout juste accomplie et encore pertinente.
- source_word: בְיַד עַבְדְּךָ
  choice: par la main de ton serviteur
  rationale: Cette formulation conserve l’image hébraïque de la main comme moyen d’action, tout en restant intelligible dans ce registre de prière.
- source_word: הַתְּשׁוּעָה הַגְּדֹלָה הַזֹּאת
  choice: cette grande délivrance
  rationale: תשועה peut désigner une délivrance, un salut ou une victoire. « Délivrance » maintient à la fois le sens militaire immédiat et l’idée que Dieu a sauvé son serviteur.
- source_word: אָמ֣וּת בַּצָּמָא
  choice: vais-je mourir de soif
  rationale: Bien qu’aucune particule interrogative ne soit présente, le contexte donne à la phrase la force naturelle d’une question rhétorique. « Mourir de soif » est l’expression française idiomatique.
- source_word: וְנָפַלְתִּי בְּיַד
  choice: et tomber entre les mains de
  rationale: נפל ביד signifie tomber au pouvoir de quelqu’un. L’expression française « tomber entre les mains de » conserve l’image tout en exprimant clairement cette idée.
- source_word: הָעֲרֵלִים
  choice: les incirconcis
  rationale: Le terme hébreu désigne littéralement les incirconcis et porte ici une charge liée au signe de l’alliance. Le conserver évite de réduire le propos à la seule désignation ethnique « les Philistins ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom divin lui-même. « Yahweh » le préserve au lieu de le remplacer par un titre.
- issue: Portée de הָעֲרֵלִים
  choice: les incirconcis
  alternative: les Philistins
  rationale: Dans le contexte, il s’agit particulièrement des Philistins, mais la désignation choisie par Samson souligne leur absence du signe de l’alliance. La traduction littérale conserve cette tension théologique et rhétorique.
- issue: Valeur de תְּשׁוּעָה
  choice: délivrance
  alternative: victoire / salut
  rationale: La scène concerne une victoire concrète accordée par Dieu, mais le mot dépasse la seule réussite militaire. « Délivrance » préserve ces deux dimensions sans imposer un sens doctrinal plus étroit.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple soutient le registre narratif biblique sans archaïsme marqué; le passé composé dans la prière exprime une action récente dont l’effet demeure. Les images de la « main » et des « incirconcis » sont conservées pour respecter la rhétorique du texte source.
