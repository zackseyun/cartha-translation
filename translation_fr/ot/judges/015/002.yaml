base_translation:
  language: en
  yaml_path: translation/ot/judges/015/002.yaml
  text: And her father said[a], “I really thought that you utterly hated her, so I gave her to your companion. Is not her younger sister better than she? Please let her be yours instead of her.”
translation:
  language: fr
  text: 'Son père lui dit : « J’étais vraiment persuadé que tu la détestais profondément ; je l’ai donc donnée à ton compagnon[a]. Sa sœur cadette ne vaut-elle pas mieux qu’elle ? Je t’en prie, prends-la à sa place. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ton ami ». Le terme hébreu peut désigner de manière générale un proche, un associé ou un compagnon ; dans ce contexte de mariage, certains y voient l’homme qui avait servi de compagnon à Samson pendant les noces.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמֹר אָמַרְתִּי
  choice: J’étais vraiment persuadé
  rationale: L’infinitif absolu suivi du parfait renforce l’affirmation. Cette formulation rend naturellement l’intensité de la conviction du père sans reproduire littéralement la répétition hébraïque.
- source_word: שָׂנֹא שְׂנֵאתָהּ
  choice: tu la détestais profondément
  rationale: La construction intensive appelle davantage qu’un simple « tu la détestais ». « Profondément » conserve l’emphase tout en restant idiomatique en français.
- source_word: וָאֶתְּנֶנָּה
  choice: je l’ai donc donnée
  rationale: Dans ce contexte, le waw introduit la conséquence tirée par le père de sa supposition ; « donc » explicite cette relation logique sans la surinterpréter.
- source_word: לְמֵרֵעֶךָ
  choice: à ton compagnon
  rationale: Le terme désigne largement un proche, un associé ou un compagnon. « Compagnon » convient au contexte tout en évitant de préciser une fonction nuptiale que le mot seul n’impose pas.
- source_word: אֲחֹתָהּ הַקְּטַנָּה
  choice: sa sœur cadette
  rationale: Dans une relation entre sœurs, קְטַנָּה désigne naturellement la plus jeune ; « sœur cadette » est précis et idiomatique.
- source_word: טוֹבָה מִמֶּנָּה
  choice: ne vaut-elle pas mieux qu’elle ?
  rationale: טוֹבָה exprime ici une supériorité générale. « Vaut mieux » maintient cette largeur de sens sans réduire la comparaison à la beauté physique.
- source_word: תְּהִי נָא לְךָ
  choice: Je t’en prie, prends-la
  rationale: Le jussif avec נָא exprime une demande pressante mais polie. En français, « prends-la » rend naturellement la proposition qu’elle devienne la femme de Samson, sans ajouter explicitement le verbe « épouser ».
- source_word: תַּחְתֶּיהָ
  choice: à sa place
  rationale: Cette expression rend clairement et sobrement l’idée de substitution.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue conserve les deux intensifications hébraïques et la question rhétorique, sans préciser indûment que la sœur cadette serait physiquement plus belle ni attribuer au compagnon une fonction nuptiale déterminée.
