  text: וַ/יֵּרְד֡וּ שְׁלֹשֶׁת֩ אֲלָפִ֨ים אִ֜ישׁ מִֽ/יהוּדָ֗ה אֶל סְעִיף֮ סֶ֣לַע עֵיטָם֒ וַ/יֹּאמְר֣וּ לְ/שִׁמְשׁ֗וֹן הֲ/לֹ֤א יָדַ֨עְתָּ֙ כִּֽי מֹשְׁלִ֥ים בָּ֨/נוּ֙ פְּלִשְׁתִּ֔ים וּ/מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ וַ/יֹּ֣אמֶר לָ/הֶ֔ם כַּ/אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י כֵּ֖ן עָשִׂ֥יתִי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/011.yaml
  text: Then three thousand men of Judah went down to the cleft of the rock of Etam and said to Samson[a], “Do you not know that the Philistines are ruling over us? What then is this that you have done to us?” And he said to them, “As they did to me, so I have done to them.”
translation:
  language: fr
  text: 'Alors, trois mille hommes de Juda descendirent jusqu’à la fente du rocher d’Étam[a] et dirent à Samson : « Ne sais-tu pas que les Philistins nous dominent ? Qu’est-ce donc que tu nous as fait ? » Il leur répondit : « Ce qu’ils m’ont fait, je le leur ai fait. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la fissure du rocher d’Étam » ; le terme hébreu peut désigner une fente, une fissure ou un renfoncement rocheux.'
    reason: Alternative lexicale concernant le relief désigné par סְעִיף.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: descendirent
  rationale: Le verbe ירד exprime un déplacement vers le bas. « Descendirent » en conserve nettement le sens directionnel dans un récit au passé.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ מִיהוּדָה
  choice: trois mille hommes de Juda
  rationale: La formule désigne un groupe compté d’hommes appartenant à Juda. Cette tournure est concise et naturelle en français.
- source_word: אֶל סְעִיף סֶלַע עֵיטָם
  choice: jusqu’à la fente du rocher d’Étam
  rationale: Dans ce contexte topographique, סְעִיף désigne vraisemblablement une fente ou fissure rocheuse. « Fente » est clair pour le lecteur moderne, tandis que סֶלַע est rendu par « rocher » et עֵיטָם par le nom propre « Étam ».
- source_word: הֲלֹא יָדַעְתָּ
  choice: Ne sais-tu pas
  rationale: L’interrogation négative a une force rhétorique et invoque un fait tenu pour évident. Le présent convient au caractère toujours actuel de la domination philistine.
- source_word: כִּי מֹשְׁלִים בָּנוּ פְּלִשְׁתִּים
  choice: que les Philistins nous dominent
  rationale: Le participe מֹשְׁלִים décrit une domination continue. « Nous dominent » est plus idiomatique en français actuel que « dominent sur nous » tout en conservant le rapport de pouvoir.
- source_word: וּמַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: Qu’est-ce donc que tu nous as fait là ?
  rationale: La formulation maintient la question hébraïque (« qu’est-ce que… ? ») sans la transformer en « pourquoi ». « Donc » marque le lien avec la question précédente, et « là » rend naturellement la nuance démonstrative de זֹאת.
- source_word: כַּאֲשֶׁר עָשׂוּ לִי כֵּן עָשִׂיתִי לָהֶם
  choice: Ce qu’ils m’ont fait, je le leur ai fait
  rationale: Cette formulation française naturelle conserve exactement l’idée de réciprocité et le jeu entre « à moi » et « à eux », sans ajouter d’évaluation morale.
theological_decisions:
- issue: Tonalité de la réponse de Samson comme réciprocité punitive
  choice: 'Présenter sa réponse comme un simple constat de réciprocité : « Ce qu’ils m’ont fait, je le leur ai fait. »'
  alternative: Qualifier son acte de vengeance légitime ou, au contraire, de revanche personnelle condamnable.
  rationale: Le verset rapporte la justification de Samson sans porter explicitement de jugement moral. La traduction préserve cette tension et n’impose aucune appréciation doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit sans être archaïque. Les dialogues restent directs et naturels. Le marqueur de note [a] est placé immédiatement après l’expression qu’il précise.
