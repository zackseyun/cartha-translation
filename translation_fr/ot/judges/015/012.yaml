  source_fidelity: 'Le sens fondamental est bien rendu : les hommes de Juda descendent pour lier Samson et le remettre au pouvoir des Philistins. Toutefois, « ligoter » ajoute une nuance concrète et familière que le verbe hébreu « lier » n’impose pas. Pour פגע ב, « attaquer » restitue sobrement l’idée contextuelle de s’en prendre à lui, conformément aussi à l’audit anglais.'
