base_translation:
  language: en
  yaml_path: translation/ot/judges/015/012.yaml
  text: They said to him, “We have come down to bind you, to hand you over into the hand of the Philistines.” Samson said to them, “Swear to me that you yourselves will not attack me.”
translation:
  language: fr
  text: 'Ils lui dirent : « Nous sommes descendus pour t’attacher et te livrer aux Philistins. » Samson leur dit : « Jurez-moi que vous-mêmes, vous ne m’attaquerez pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶאֱסָרְךָ
  choice: te ligoter
  rationale: Exprime concrètement l’action d’attacher Samson, dans un français naturel et adapté au contexte narratif.
- source_word: לְתִתְּךָ בְּיַד פְּלִשְׁתִּים
  choice: te livrer aux Philistins
  rationale: La tournure hébraïque littérale « donner dans la main de » signifie remettre au pouvoir de quelqu’un ; « livrer aux » en restitue clairement le sens idiomatique.
- source_word: תִּפְגְּעוּן בִּי
  choice: vous jeter sur moi
  rationale: Dans ce contexte hostile, פגע ב peut désigner le fait de s’en prendre physiquement à quelqu’un. « Se jeter sur » conserve l’image d’une attaque directe sans préciser indûment sa gravité.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le redoublement emphatique אַתֶּם est rendu par « vous-mêmes », qui souligne que Samson exige de ne pas être attaqué par les hommes de Juda eux-mêmes.
