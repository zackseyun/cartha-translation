  text: וַ/יַּבְעֶר אֵשׁ֙ בַּ/לַּפִּידִ֔ים וַ/יְשַׁלַּ֖ח בְּ/קָמ֣וֹת פְּלִשְׁתִּ֑ים וַ/יַּבְעֵ֛ר מִ/גָּדִ֥ישׁ וְ/עַד קָמָ֖ה וְ/עַד כֶּ֥רֶם זָֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/005.yaml
  text: He set fire to the torches and let them go into the standing grain of the Philistines[a], and burned up the shocks and the standing grain[b], and even the olive groves.
translation:
  language: fr
  text: Il mit le feu aux torches et lâcha les animaux dans les céréales sur pied des Philistins. Il brûla aussi bien les tas de céréales que les céréales sur pied, et même les oliveraies.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis le tas de céréales jusqu’aux céréales sur pied, et jusqu’à l’oliveraie » ; la traduction exprime cette étendue sous la forme d’une liste de ce qui fut brûlé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְעֶר אֵשׁ בַּלַּפִּידִים
  choice: Il mit le feu aux torches
  rationale: La tournure française naturelle « mettre le feu à » rend le hiphil de בער avec אֵשׁ. « Torches » exprime clairement לַפִּידִים dans le contexte des objets inflammables attachés au verset précédent.
- source_word: וַיְשַׁלַּח
  choice: lâcha les animaux
  rationale: Le verbe signifie envoyer ou lâcher. Le complément implicite renvoie aux animaux du verset précédent; l’explicitation minimale évite que « les » soit compris comme désignant les torches.
- source_word: בְּקָמוֹת פְּלִשְׁתִּים
  choice: dans les céréales sur pied des Philistins
  rationale: קָמָה désigne la récolte encore enracinée. « Céréales sur pied » conserve cette précision agricole et distingue celles-ci des récoltes déjà entassées.
- source_word: מִגָּדִישׁ
  choice: les tas de céréales
  rationale: גָּדִישׁ désigne un amas ou une meule de récolte engrangée. « Tas de céréales » est immédiatement compréhensible en français moderne sans recourir à un terme agricole rare.
- source_word: מִגָּדִישׁ וְעַד קָמָה וְעַד כֶּרֶם זָיִת
  choice: aussi bien les tas de céréales que les céréales sur pied, et même les oliveraies
  rationale: La construction מן…ועד…ועד décrit l’étendue du sinistre. La formulation idiomatique française énumère ce qui fut brûlé tout en conservant la progression culminant avec les plantations d’oliviers.
- source_word: כֶּרֶם זָיִת
  choice: les oliveraies
  rationale: כֶּרֶם désigne ici une plantation cultivée et זַיִת l’olivier. « Oliveraies » est le terme français naturel pour des plantations d’oliviers.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’explicitation « les animaux » dépend du contexte immédiat sans ajouter leur espèce dans ce verset. La répétition de « céréales » préserve la distinction entre la récolte entassée et celle encore sur pied.
