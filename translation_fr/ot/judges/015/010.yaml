  text: וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ יְהוּדָ֔ה לָ/מָ֖ה עֲלִיתֶ֣ם עָלֵ֑י/נוּ וַ/יֹּאמְר֗וּ לֶ/אֱס֤וֹר אֶת שִׁמְשׁוֹן֙ עָלִ֔ינוּ לַ/עֲשׂ֣וֹת ל֔/וֹ כַּ/אֲשֶׁ֖ר עָ֥שָׂה לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/010.yaml
  text: And the men of Judah said, “Why have you come up against us?” And they said, “We have come up to bind Samson, to do to him just as he did to us.”
translation:
  language: fr
  text: 'Les hommes de Juda dirent : « Pourquoi êtes-vous montés contre nous ? » Ils répondirent : « Nous sommes montés pour attacher Samson et lui faire ce qu’il nous a fait. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ יְהוּדָה
  choice: les hommes de Juda
  rationale: אִישׁ est au singulier morphologique, mais a ici un sens collectif, comme le confirme le verbe pluriel וַיֹּאמְרוּ. « Les hommes de Juda » conserve cette forme collective genrée dans un français naturel.
- source_word: לָמָה
  choice: Pourquoi
  rationale: Équivalent interrogatif direct et courant de לָמָה.
- source_word: עֲלִיתֶם עָלֵינוּ
  choice: êtes-vous montés contre nous
  rationale: עלה avec עַל exprime ici un mouvement hostile contre quelqu’un. « Monter contre » préserve à la fois l’image directionnelle et la valeur adversative sans expliciter une attaque.
- source_word: לֶאֱסוֹר
  choice: pour attacher
  rationale: אָסַר signifie lier ou attacher. Dans ce récit, « attacher » est naturel en français et décrit directement la capture physique de Samson.
- source_word: עָלִינוּ
  choice: Nous sommes montés
  rationale: La réponse reprend le verbe עלה de la question. La répétition de « monter » maintient ce lien lexical.
- source_word: לַעֲשׂוֹת לוֹ
  choice: lui faire
  rationale: Dans le contexte de représailles, עשה + ל signifie faire quelque chose à quelqu’un. La construction française « lui faire ce que… » exprime naturellement ce sens.
- source_word: כַּאֲשֶׁר עָשָׂה לָנוּ
  choice: ce qu’il nous a fait
  rationale: Cette formulation française restitue la comparaison et la réciprocité des représailles. Elle est plus naturelle que « faire à lui comme il a fait à nous », tout en conservant le sens.
- source_word: שִׁמְשׁוֹן
  choice: Samson
  rationale: Forme française traditionnelle et standard du nom propre.
theological_decisions: []
