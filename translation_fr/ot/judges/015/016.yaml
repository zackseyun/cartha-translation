  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֔וֹן בִּ/לְחִ֣י הַ/חֲמ֔וֹר חֲמ֖וֹר חֲמֹרָתָ֑יִם בִּ/לְחִ֣י הַ/חֲמ֔וֹר הִכֵּ֖יתִי אֶ֥לֶף אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/016.yaml
  text: Then Samson said[a], “With the jawbone of a donkey, a heap, two heaps; with the jawbone of a donkey I have struck down a thousand men.”
translation:
  language: fr
  text: 'Alors Samson dit[a] : « Avec une mâchoire d’âne, un tas, deux tas ! Avec une mâchoire d’âne, j’ai abattu mille hommes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En hébreu, il y a un jeu de mots : « âne » et le mot rendu par « tas » reposent sur les mêmes consonnes, avec une forme et une vocalisation différentes.'
    reason: Le jeu sonore hébreu ne peut pas être reproduit naturellement en français.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le wayyiqtol fait progresser le récit ; « Alors » exprime naturellement la succession en français.
- source_word: שִׁמְשׁוֹן
  choice: Samson
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: בִּלְחִי הַחֲמוֹר
  choice: Avec une mâchoire d’âne
  rationale: לְחִי désigne ici la mâchoire utilisée comme arme, et בְּ marque l’instrument. L’indéfini convient à l’idiome français dans cette exclamation poétique.
- source_word: חֲמוֹר חֲמֹרָתָיִם
  choice: un tas, deux tas
  rationale: Cette formulation assez littérale conserve la structure frappante de l’hébreu et évoque les corps amoncelés, tandis qu’une note explique le jeu sonore avec « âne ».
- source_word: הִכֵּיתִי
  choice: j’ai abattu
  rationale: Dans ce contexte guerrier, נכה indique que Samson a frappé ses adversaires jusqu’à les faire tomber ; « abattu » rend le résultat sans employer directement « tué ».
- source_word: אֶלֶף אִישׁ
  choice: mille hommes
  rationale: אִישׁ est ici un singulier collectif masculin dans un contexte de combat.
theological_decisions: []
