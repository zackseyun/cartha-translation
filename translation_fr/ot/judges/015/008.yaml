  text: And he struck them hip and thigh with a great slaughter[a], and he went down and stayed in the cleft of the rock of Etam.
translation:
  language: fr
  text: Il les frappa, jambe sur cuisse, d’un coup terrible[a]. Puis il descendit et resta dans la fente du rocher d’Étam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formule hébraïque, littéralement « jambe sur cuisse », est probablement une expression évoquant une défaite dévastatrice ou totale, mais son sens exact est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Il les frappa
  rationale: Le verbe נכה signifie ici « frapper » dans un contexte violent. Cette formulation reste proche de l’hébreu sans préciser que chaque adversaire fut tué.
- source_word: שׁוֹק עַל יָרֵךְ
  choice: hanche sur cuisse
  rationale: L’expression hébraïque est obscure et probablement idiomatique. La traduction conserve son image concrète et son étrangeté plutôt que d’en imposer une interprétation unique.
- source_word: מַכָּה גְדוֹלָה
  choice: leur infligea une lourde défaite
  rationale: Dans un contexte de combat, מַכָּה peut désigner le coup porté ou la défaite qui en résulte. « Lourde défaite » rend naturellement la portée militaire de l’expression sans affirmer explicitement un massacre.
- source_word: וַיֵּרֶד
  choice: il descendit
  rationale: Rend directement le mouvement vers le bas exprimé par le verbe hébreu.
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: ישב peut signifier s’asseoir, demeurer ou séjourner. Ici, « resta » convient naturellement au refuge temporaire de Samson.
- source_word: בִּסְעִיף
  choice: dans la fente
  rationale: Le terme évoque une division, une fissure ou une anfractuosité servant de refuge.
- source_word: סֶלַע
  choice: du rocher
  rationale: סֶלַע désigne une formation rocheuse ou un escarpement; « rocher » est précis et naturel en français.
- source_word: עֵיטָם
  choice: Étam
  rationale: Le nom de lieu est translittéré selon l’usage français.
