    rationale: 'Le mot ajoute l’idée de « seulement », qui n’est pas exprimée par לֹא כִּי. La construction sert à nier puis à corriger : « Non, mais nous t’attacherons… ».'
  - severity: low
    issue: « donc » dans la narration
    rationale: Le waw narratif introduit simplement l’action suivante; « donc » ajoute une relation logique explicite non marquée dans le texte source.
  - severity: low
    issue: Formulation « ne te ferons certainement pas mourir »
    rationale: Elle est compréhensible mais peu naturelle en français moderne. « Ne te mettrons certainement pas à mort » est plus idiomatique et exprime clairement l’assurance solennelle du texte.
