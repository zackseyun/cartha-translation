base_translation:
  language: en
  yaml_path: translation/ot/judges/015/013.yaml
  text: They said to him[a], “No, but we will surely bind you and hand you over into their hand[b]; yet we will certainly not put you to death.” So they bound him with two new ropes and brought him up from the rock.
translation:
  language: fr
  text: 'Ils lui répondirent : « Non, mais nous t’attacherons solidement et nous te livrerons en leur pouvoir[a] ; nous ne te mettrons certainement pas à mort. » Ils l’attachèrent avec deux cordes neuves et le firent remonter du rocher[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te livrer entre leurs mains ». L’hébreu dit littéralement « te donner dans leur main ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’escarpement rocheux ». Le mot hébreu peut désigner un rocher, une hauteur rocheuse ou une falaise.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: Non ! … seulement
  rationale: La tournure nie l’idée précédente puis précise ce qu’ils feront. En français naturel, « Non ! » suivi de « seulement » exprime clairement cette correction.
- source_word: אָסֹר נֶאֱסָרְךָ
  choice: nous allons seulement t’attacher solidement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. « Attacher solidement » restitue cette insistance sans lourdeur.
- source_word: וּנְתַנּוּךָ בְיָדָם
  choice: te livrer entre leurs mains
  rationale: Cette expression conserve l’image hébraïque de la main comme pouvoir ou maîtrise, tout en étant idiomatique en français.
- source_word: וְהָמֵת לֹא נְמִיתֶךָ
  choice: nous ne te ferons certainement pas mourir
  rationale: La construction intensive et la négation expriment une assurance ferme. La formulation conserve aussi la valeur causative de la forme verbale.
- source_word: וַיַּאַסְרֻהוּ
  choice: ils l’attachèrent
  rationale: La reprise du même verbe français maintient la cohérence lexicale avec leur promesse.
- source_word: בִּשְׁנַיִם עֲבֹתִים חֲדָשִׁים
  choice: avec deux cordes neuves
  rationale: « Cordes » rend clairement les liens épais désignés par עֲבֹתִים, et « neuves » préserve un détail narratif important.
- source_word: וַיַּעֲלֻהוּ מִן הַסָּלַע
  choice: le firent remonter du rocher
  rationale: « Firent remonter » rend la valeur causative de עלה et le mouvement depuis le lieu rocheux; « rocher » reste proche du terme hébreu tout en laissant une note signaler son étendue sémantique.
