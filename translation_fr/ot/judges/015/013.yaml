revisions:
- from: 'Ils lui répondirent : « Non ! Nous allons seulement t’attacher solidement et te livrer entre leurs mains[a], mais nous ne te ferons certainement pas mourir. » Ils l’attachèrent donc avec deux cordes neuves et le firent remonter du rocher[b].'
  to: 'Ils lui répondirent : « Non, mais nous t’attacherons solidement et nous te livrerons en leur pouvoir[a] ; nous ne te mettrons certainement pas à mort. » Ils l’attachèrent avec deux cordes neuves et le firent remonter du rocher[b].'
  rationale: La révision rétablit le contraste adversatif de לֹא כִּי sans ajouter la limitation « seulement », conserve l’insistance des deux constructions infinitif absolu + verbe fini par « solidement » et « certainement », et emploie une formulation française plus idiomatique pour l’assurance qu’ils ne le mettront pas à mort. Elle supprime aussi « donc », ajout narratif non requis par le texte.
