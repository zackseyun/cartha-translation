  yaml_path: translation/ot/judges/015/007.yaml
  text: And Samson said to them, “If this is what you do, then I swear I will take vengeance on you, and after that I will stop.”
translation:
  language: fr
  text: 'Samson leur dit : « Si c’est ainsi que vous agissez, je me vengerai assurément de vous, et après cela, je cesserai. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם תַּעֲשׂוּן כָּזֹאת
  choice: Si c’est ainsi que vous agissez
  rationale: Conserve la forme conditionnelle de l’hébreu tout en exprimant naturellement en français la réaction de Samson à leur conduite.
- source_word: כִּי אִם נִקַּמְתִּי בָכֶם
  choice: je me vengerai de vous
  rationale: Le verbe נקם désigne explicitement l’action de se venger. La tournure emphatique כִּי אִם renforce la résolution de Samson, rendue ici par l’affirmation catégorique sans ajouter une formule explicite de serment absente du texte.
- source_word: וְאַחַר אֶחְדָּל
  choice: après quoi, j’arrêterai
  rationale: 'Reproduit l’ordre temporel explicite : Samson annonce d’abord sa vengeance, puis la cessation de son action.'
theological_decisions:
- issue: Valeur de la tournure emphatique כִּי אִם
  choice: Affirmation résolue sans formule de serment explicite
  alternative: « je jure que je me vengerai de vous »
  rationale: La tournure peut avoir une force solennelle ou emphatique, mais aucun verbe signifiant « jurer » n’apparaît. La traduction évite donc de transformer l’insistance en serment explicite.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe reste proche du mouvement de l’hébreu, tout en évitant une formulation artificielle.
