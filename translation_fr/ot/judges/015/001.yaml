source:
  edition: WLC
  text: וַ/יְהִ֨י מִ/יָּמִ֜ים בִּ/ימֵ֣י קְצִיר חִטִּ֗ים וַ/יִּפְקֹ֨ד שִׁמְשׁ֤וֹן אֶת אִשְׁתּ/וֹ֙ בִּ/גְדִ֣י עִזִּ֔ים וַ/יֹּ֕אמֶר אָבֹ֥אָה אֶל אִשְׁתִּ֖/י הֶ/חָ֑דְרָ/ה וְ/לֹֽא נְתָנ֥/וֹ אָבִ֖י/הָ לָ/בֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/001.yaml
  text: And after some days[a], in the days of the wheat harvest, Samson visited his wife with a young goat. He said, “Let me go in to my wife, into the inner room.” But her father would not allow him to go in.
translation:
  language: fr
  text: 'Quelque temps plus tard, à l’époque de la moisson des blés, Samson alla voir sa femme en lui apportant un chevreau. Il dit : « Je veux entrer auprès de ma femme, dans la chambre[a]. » Mais le père de celle-ci ne le laissa pas entrer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la pièce intérieure ». Dans ce contexte, il s’agit vraisemblablement de la chambre privée du couple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: Quelque temps plus tard
  rationale: L’expression indique qu’un certain temps s’est écoulé. Cette formulation est naturelle en français et conserve la progression temporelle du récit.
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: à l’époque de la moisson des blés
  rationale: La formulation rend le repère saisonnier précis et le pluriel hébreu חִטִּים, couramment exprimé par « blés » en français dans ce contexte.
- source_word: וַיִּפְקֹד
  choice: alla voir
  rationale: Dans ce contexte, פקד signifie rendre visite ou aller trouver quelqu’un, et non recenser, établir ou punir.
- source_word: אֶת אִשְׁתּוֹ
  choice: sa femme
  rationale: Le texte hébreu continue à désigner cette femme comme l’épouse de Samson malgré la rupture relationnelle racontée dans le contexte.
- source_word: בִּגְדִי עִזִּים
  choice: en lui apportant un chevreau
  rationale: Le chevreau accompagne la visite et paraît destiné à la femme. « Chevreau » est précis, courant et naturel en français.
- source_word: אָבֹאָה אֶל אִשְׁתִּי
  choice: Je veux entrer auprès de ma femme
  rationale: Le cohortatif exprime ici la volonté de Samson. « Entrer auprès de » préserve l’expression indirecte pouvant impliquer les relations conjugales sans les expliciter davantage que l’hébreu.
- source_word: הֶחָדְרָה
  choice: dans la chambre
  rationale: La forme directive désigne l’entrée dans une pièce intérieure ou chambre. Le contexte lui confère une dimension conjugale, mais « chambre » évite de préciser indûment « chambre à coucher ».
- source_word: וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא
  choice: Mais le père de celle-ci ne le laissa pas entrer
  rationale: La phrase exprime le refus actif du père de donner accès à Samson. La répétition d’« entrer » maintient la cohésion avec les paroles précédentes.
theological_decisions:
- issue: Portée conjugale de l’expression « entrer auprès de ma femme »
  choice: Conserver une formulation indirecte
  alternative: 'Expliciter : « avoir des relations avec ma femme »'
  rationale: L’hébreu associe l’entrée auprès de la femme et la chambre sans énoncer directement l’acte sexuel. La traduction préserve cette retenue et l’ambiguïté contextuelle.
translation_notes:
  register: Français international moderne, narratif et digne. Les tournures volontairement indirectes de l’hébreu sont conservées sans archaïsme ni explicitation excessive.
