  text: וַ/יִּמְצָ֥א לְחִֽי חֲמ֖וֹר טְרִיָּ֑ה וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יִּקָּחֶ֔/הָ וַ/יַּךְ בָּ֖/הּ אֶ֥לֶף אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/015.yaml
  text: And he found a fresh jawbone of a donkey[a], and he reached out his hand and took it, and with it he struck down a thousand men.
translation:
  language: fr
  text: Il trouva une mâchoire d’âne encore fraîche[a]. Il tendit la main, la prit et, avec elle, abattit mille hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une mâchoire d’âne neuve ». L’adjectif hébreu peut désigner ce qui est frais ou nouvellement disponible.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: Il trouva
  rationale: Le wayyiqtol de מצא rapporte ici un événement passé simple; « trouva » est direct et naturel en français narratif.
- source_word: לְחִי חֲמוֹר
  choice: une mâchoire d’âne
  rationale: לְחִי désigne la mâchoire ou l’os de la mâchoire. En français, « mâchoire d’âne » évoque naturellement l’os employé comme arme sans alourdir le texte.
- source_word: טְרִיָּה
  choice: encore fraîche
  rationale: L’adjectif indique que la mâchoire était fraîche, non desséchée; « encore fraîche » exprime clairement ce contraste tout en conservant la possibilité d’une trouvaille récente.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: Il tendit la main
  rationale: Cette formulation garde l’image concrète de l’idiome hébreu et demeure naturelle en français moderne.
- source_word: וַיִּקָּחֶהָ
  choice: la prit
  rationale: Le pronom féminin renvoie à « mâchoire »; « prit » rend simplement לקח sans ajouter l’idée plus forte de saisir violemment.
- source_word: וַיַּךְ בָּהּ
  choice: avec elle, abattit
  rationale: נכה signifie frapper et, dans ce contexte guerrier, implique la mise à mort. « Abattit » communique l’issue létale sans traduire explicitement par « tua ».
- source_word: אֶלֶף אִישׁ
  choice: mille hommes
  rationale: Dans ce contexte de combat, אִישׁ désigne des hommes; le français emploie naturellement « mille hommes ».
