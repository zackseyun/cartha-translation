base_translation:
  language: en
  yaml_path: translation/ot/judges/015/017.yaml
  text: And when he had finished speaking[a], he threw the jawbone from his hand, and he called that place Ramath-lehi.
translation:
  language: fr
  text: Quand il eut fini de parler, il jeta la mâchoire qu’il tenait à la main et appela cet endroit Ramath-Léhi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ramath-Léhi signifie probablement « colline de la mâchoire » ou « hauteur de la mâchoire » ; ce nom reprend le mot hébreu léhi, « mâchoire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: Quand il eut fini de parler
  rationale: La préposition כְּ avec l’infinitif construit de כלה et לְדַבֵּר exprime ici le moment où l’action de parler s’achève. Le passé antérieur marque naturellement en français l’antériorité immédiate par rapport aux actions suivantes.
- source_word: וַיַּשְׁלֵךְ
  choice: il jeta
  rationale: Le verbe indique l’action de jeter ou de se défaire de l’objet. « Jeta » est direct, courant et n’ajoute pas une violence que le texte ne précise pas.
- source_word: הַלְּחִי
  choice: la mâchoire
  rationale: Dans le contexte, il s’agit de la mâchoire d’âne utilisée comme arme. « Mâchoire » est le terme français naturel et maintient le lien lexical avec le nom du lieu.
- source_word: מִיָּדוֹ
  choice: qu’il tenait à la main
  rationale: L’hébreu dit littéralement « de sa main ». Cette formulation française explicite sobrement la relation physique et évite la tournure moins naturelle « jeta la mâchoire de sa main ».
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: appela cet endroit
  rationale: קרא dans une construction de dénomination signifie appeler ou nommer. « Appela cet endroit » reste proche de l’hébreu et demeure idiomatique.
- source_word: רָמַת לֶחִי
  choice: Ramath-Léhi
  rationale: Le toponyme est translittéré dans le texte principal. Une note en explique le sens probable et le jeu de mots avec לֶחִי, « mâchoire ».
