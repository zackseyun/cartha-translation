  text: הוּא בָ֣א עַד לֶ֔חִי וּ/פִלְשִׁתִּ֖ים הֵרִ֣יעוּ לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַ/תִּהְיֶ֨ינָה הָ/עֲבֹתִ֜ים אֲשֶׁ֣ר עַל זְרוֹעוֹתָ֗י/ו כַּ/פִּשְׁתִּים֙ אֲשֶׁ֣ר בָּעֲר֣וּ בָ/אֵ֔שׁ וַ/יִּמַּ֥סּוּ אֱסוּרָ֖י/ו מֵ/עַ֥ל יָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/014.yaml
  text: When he came as far as Lehi[a], the Philistines shouted as they came to meet him. Then the Spirit of Yahweh rushed upon him, and the ropes that were on his arms became like flax that has been burned in the fire, and his bonds melted off his hands.
translation:
  language: fr
  text: 'Lorsqu’il arriva à Léhi[a], les Philistins poussèrent des cris en venant à sa rencontre. Alors l’Esprit de Yahweh fondit sur lui : les cordes qu’il avait aux bras devinrent comme du lin brûlé au feu, et ses liens fondirent et se détachèrent de ses mains.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Léhi est un nom de lieu. Le mot hébreu est aussi lié au sens de « mâchoire », un motif important dans la suite du récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחִי
  choice: Léhi
  rationale: Le contexte indique un nom de lieu. La forme française « Léhi » conserve le toponyme, tandis que la note signale son rapport lexical avec la mâchoire, motif important du récit.
- source_word: הֵרִיעוּ לִקְרָאתוֹ
  choice: poussèrent des cris en venant à sa rencontre
  rationale: Cette formulation rend à la fois le cri collectif, potentiellement guerrier, et le mouvement des Philistins vers Samson, sans préciser davantage que l’hébreu la nature du cri.
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: l’esprit de Yahweh fondit sur lui
  rationale: Le verbe צלח exprime ici l’irruption soudaine et puissante de l’esprit divin. « Fondit sur lui » garde cette vigueur narrative sans développer une théologie étrangère au verset.
- source_word: הָעֲבֹתִים
  choice: les cordes
  rationale: Le terme désigne les cordes servant à l’attacher. « Cordes » est précis, naturel et ne suggère pas des entraves métalliques.
- source_word: זְרוֹעוֹתָיו
  choice: ses bras
  rationale: זְרוֹעַ désigne le bras sans imposer la précision anatomique « avant-bras ».
- source_word: כַּפִּשְׁתִּים אֲשֶׁר בָּעֲרוּ בָאֵשׁ
  choice: comme du lin brûlé au feu
  rationale: La comparaison évoque le lin consumé et devenu sans résistance. La formulation française est concise et préserve l’image concrète.
- source_word: וַיִּמַּסּוּ אֱסוּרָיו מֵעַל יָדָיו
  choice: ses liens se liquéfièrent et tombèrent de ses mains
  rationale: « Se liquéfièrent » conserve la métaphore forte de מסס, tandis que « tombèrent » explicite naturellement le résultat de la séparation indiquée par מֵעַל, sans remplacer « mains » par l’interprétation plus précise « poignets ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Nature de l’action de l’esprit de Yahweh sur Samson
  choice: l’esprit de Yahweh fondit sur lui
  alternative: l’esprit de Yahweh vint avec puissance sur lui
  rationale: Le choix préserve la soudaineté et la force de l’idiome hébreu, tout en restant au niveau narratif du texte et sans importer de catégories théologiques ultérieures.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste accessible, conserve le mouvement énergique de l’hébreu et maintient ses images concrètes. La minuscule à « esprit » évite d’imposer au récit une précision doctrinale que la grammaire hébraïque ne tranche pas à elle seule.
