revisions:
- from: 'Lorsqu’il arriva à Léhi[a], les Philistins poussèrent des cris en venant à sa rencontre. Alors l’esprit de Yahweh fondit sur lui : les cordes qu’il avait aux bras devinrent comme du lin brûlé au feu, et ses liens se liquéfièrent et tombèrent de ses mains.'
  to: 'Lorsqu’il arriva à Léhi[a], les Philistins poussèrent des cris en venant à sa rencontre. Alors l’Esprit de Yahweh fondit sur lui : les cordes qu’il avait aux bras devinrent comme du lin brûlé au feu, et ses liens fondirent et se détachèrent de ses mains.'
  rationale: La révision maintient les choix fidèles du projet tout en supprimant l’explicitation excessive de « tombèrent ». Elle améliore aussi la cohérence typographique de « l’Esprit de Yahweh » et nuance la note afin de signaler le rapport lexical sans identifier de manière simpliste le toponyme à son sens commun.
