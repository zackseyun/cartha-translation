  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן נִקֵּ֥יתִי הַ/פַּ֖עַם מִ/פְּלִשְׁתִּ֑ים כִּֽי עֹשֶׂ֥ה אֲנִ֛י עִמָּ֖/ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/003.yaml
  text: And Samson said to them[b][a], “This time I am blameless with respect to the Philistines when I do them harm.”
translation:
  language: fr
  text: 'Samson leur dit : « Cette fois, je ne serai pas coupable envers les Philistins[a] quand je leur ferai du mal[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je serai innocent à l’égard des Philistins ». L’expression hébraïque signifie que Samson se considère libre de toute culpabilité à leur égard.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je leur fais du mal ». Le participe hébreu peut désigner l’action imminente que Samson envisage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le passé simple fait progresser naturellement le récit en français et rend le wayyiqtol sans surcharger la relation temporelle.
- source_word: לָהֶם
  choice: leur
  rationale: Rend directement la préposition לְ avec le suffixe masculin pluriel, dont l’antécédent est fourni par le contexte.
- source_word: שִׁמְשׁוֹן
  choice: Samson
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: נִקֵּיתִי
  choice: je serai innocent
  rationale: Le verbe נקה exprime ici l’absence de culpabilité ou de responsabilité. Le futur français convient à la déclaration de Samson au sujet de l’acte de représailles qu’il s’apprête à commettre.
- source_word: הַפַּעַם
  choice: Cette fois
  rationale: Expression temporelle idiomatique qui marque une nouvelle étape dans le conflit.
- source_word: מִפְּלִשְׁתִּים
  choice: à l’égard des Philistins
  rationale: Après נקה, מִן indique ici la personne par rapport à laquelle Samson se déclare dégagé de toute culpabilité. Cette formulation conserve cette relation sans faire des Philistins la norme morale du jugement.
- source_word: כִּי
  choice: si
  rationale: Dans ce contexte, la conjonction introduit la circonstance dans laquelle Samson estime ne pas être coupable. « Si » produit en français une formulation naturelle tout en gardant le lien logique légèrement ouvert.
- source_word: עֹשֶׂה אֲנִי
  choice: je leur fais
  rationale: Le participe qal accompagné du pronom explicite peut désigner une action imminente ou envisagée. Avec « si », le présent français exprime naturellement cette action projetée.
- source_word: עִמָּם
  choice: leur
  rationale: Avec עשה, la construction signifie faire quelque chose à leur encontre ; le pronom indirect est idiomatique devant « faire du mal ».
- source_word: רָעָה
  choice: du mal
  rationale: Dans ce contexte de représailles, l’expression désigne un tort ou un dommage infligé. « Du mal » conserve aussi la coloration morale possible de רָעָה sans la réduire au seul dommage matériel.
theological_decisions:
- issue: Portée de la déclaration d’innocence de Samson
  choice: La traduction présente cette innocence comme la revendication de Samson à l’égard des Philistins.
  alternative: Formuler le verset comme une affirmation objective qu’il est moralement justifié.
  rationale: Le texte rapporte les paroles de Samson sans confirmer explicitement son jugement moral ; la traduction ne doit donc ni approuver ni condamner implicitement sa justification.
- issue: Relation exprimée par כִּי entre l’innocence revendiquée et le mal projeté
  choice: « si » introduit la circonstance envisagée.
  alternative: « car je vais leur faire du mal » ou « quand je leur ferai du mal ».
  rationale: כִּי permet plusieurs nuances contextuelles. « Si » préserve la logique de la revendication sans imposer une causalité théologique ni effacer entièrement la nuance conditionnelle traditionnellement reconnue dans ce passage.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et accessible. « À l’égard de » précise la relation juridique ou morale exprimée par נקה avec מִן, tandis que « faire du mal » demeure naturel et conserve la tension entre dommage concret et mal moral.
