  text: וַ/יַּעֲל֣וּ פְלִשְׁתִּ֔ים וַֽ/יַּחֲנ֖וּ בִּ/יהוּדָ֑ה וַ/יִּנָּטְשׁ֖וּ בַּ/לֶּֽחִי׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/009.yaml
  text: Then the Philistines went up and camped in Judah[a], and spread out at Lehi.
translation:
  language: fr
  text: Alors les Philistins montèrent, établirent leur camp en Juda et se déployèrent à Léhi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’étendirent à Léhi ». Le verbe hébreu peut désigner des troupes qui s’étendent sur une zone ou s’y déploient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: Le verbe עלה exprime ici un déplacement vers le haut, géographique ou militaire. « Montèrent » conserve ce sens directionnel sans préciser davantage l’itinéraire.
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation ethnique habituelle et naturelle en français.
- source_word: וַיַּחֲנוּ
  choice: établirent leur camp
  rationale: Le verbe חנה signifie installer ou tenir un camp. Cette formulation est claire, actuelle et légèrement plus naturelle ici que « campèrent ».
- source_word: בִּיהוּדָה
  choice: en Juda
  rationale: La préposition ב indique vraisemblablement le lieu. « En Juda » conserve cette valeur géographique sans transformer implicitement la préposition en « contre ».
- source_word: וַיִּנָּטְשׁוּ
  choice: se déployèrent
  rationale: Dans ce contexte militaire, נטשׁ évoque des troupes qui s’étendent ou prennent position sur une zone. « Se déployèrent » restitue cette nuance avec concision.
- source_word: בַּלֶּחִי
  choice: à Léhi
  rationale: Léhi est ici un nom de lieu; « à » convient naturellement pour indiquer la position des troupes.
