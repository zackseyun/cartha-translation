  source_fidelity: 'Révision nécessaire : le texte hébreu exprime explicitement que les Philistins brûlèrent la femme et son père « avec/par le feu » ; cette précision ne devrait pas être reléguée à une note. De plus, dans le contexte immédiat de Juges 14:20, le « compagnon » est celui de Samson, et non naturellement celui du Timnite, ce que la formulation française actuelle peut laisser entendre.'
  naturalness: Le français est globalement naturel. « Ils répondirent » rend plus directement le second verbe de parole que l’impersonnel « On leur répondit ». La formulation révisée conserve un style narratif moderne et clair.
