base_translation:
  language: en
  yaml_path: translation/ot/judges/015/006.yaml
  text: Then the Philistines said[a], “Who did this?” And they said, “Samson, the Timnite’s son-in-law[b], because he took his wife and gave her to his companion.” So the Philistines went up and burned her and her father with fire.
translation:
  language: fr
  text: 'Les Philistins demandèrent : « Qui a fait cela ? » Ils répondirent : « Samson, le gendre du Timnite, parce que le Timnite lui a pris sa femme et l’a donnée au compagnon de Samson[a]. » Alors les Philistins montèrent et la brûlèrent, elle et son père, avec le feu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’ami de Samson ». Le terme hébreu peut désigner un compagnon ou un ami ; dans le contexte du mariage, certains le comprennent plus précisément comme le compagnon d’honneur du marié.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Ethnonyme français usuel, précédé naturellement de l’article défini pour désigner ce peuple déjà connu dans le récit.
- source_word: מִי עָשָׂה זֹאת
  choice: Qui a fait cela ?
  rationale: Le passé composé convient à une question portant sur un acte récent et reste naturel en français moderne.
- source_word: חֲתַן הַתִּמְנִי
  choice: le gendre du Timnite
  rationale: חָתָן peut désigner un époux ou un gendre. Ici, le lien est exprimé du point de vue du père timnite, dont Samson a épousé la fille.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit la raison pour laquelle Samson a commis cet acte.
- source_word: לָקַח אֶת אִשְׁתּוֹ
  choice: le Timnite lui a pris sa femme
  rationale: La répétition explicite du sujet évite en français une confusion pronominale, tandis que « lui a pris » rend le fait que la femme de Samson lui a été retirée.
- source_word: וַיִּתְּנָהּ לְמֵרֵעֵהוּ
  choice: et l’a donnée à son compagnon
  rationale: « Compagnon » conserve la portée générale de מֵרֵעַ sans imposer le rôle plus précis de témoin ou de garçon d’honneur.
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: Rend directement le verbe de mouvement ascendant tout en restant idiomatique dans le récit.
- source_word: וַיִּשְׂרְפוּ אוֹתָהּ וְאֶת אָבִיהָ בָּאֵשׁ
  choice: brûlèrent la femme et son père
  rationale: Formulation française claire qui exprime l’action sans ajouter explicitement « à mort »; la mention hébraïque emphatique du feu est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les deux occurrences hébraïques de « dirent » sont rendues par « demandèrent » puis « on leur répondit » afin d’exprimer naturellement la fonction de chaque réplique. « Le Timnite » est répété dans l’explication pour lever une ambiguïté syntaxique qui serait artificielle en français, sans modifier l’identité du sujet implicite.
