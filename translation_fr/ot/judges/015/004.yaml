  text: וַ/יֵּ֣לֶךְ שִׁמְשׁ֔וֹן וַ/יִּלְכֹּ֖ד שְׁלֹשׁ מֵא֣וֹת שׁוּעָלִ֑ים וַ/יִּקַּ֣ח לַפִּדִ֗ים וַ/יֶּ֤פֶן זָנָב֙ אֶל זָנָ֔ב וַ/יָּ֨שֶׂם לַפִּ֥יד אֶחָ֛ד בֵּין שְׁנֵ֥י הַ/זְּנָב֖וֹת בַּ/תָּֽוֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/004.yaml
  text: So Shimshon went and caught three hundred foxes[a], and he took torches and turned them tail to tail, and put one torch between each pair of tails, in the middle.
translation:
  language: fr
  text: Shimshon partit, captura trois cents renards[a] et prit des torches. Il disposa les animaux queue contre queue et plaça une torche entre les deux queues de chaque paire, au milieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chacals ». Le mot hébreu שׁוּעָלִים peut désigner des renards ou des canidés proches ; « renards » est retenu dans le texte en raison de son sens courant et de la tradition du récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: partit donc
  rationale: Rend naturellement l’ouverture de la séquence narrative par wayyiqtol, וַ marquant ici la continuation ou la conséquence.
- source_word: שִׁמְשׁוֹן
  choice: Shimshon
  rationale: Translittération directe du nom hébreu plutôt que recours à la forme française traditionnelle « Samson ».
- source_word: וַיִּלְכֹּד
  choice: captura
  rationale: לכד désigne ici la prise d’animaux vivants; « captura » est précis et naturel dans ce récit.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: trois cents
  rationale: Traduction directe de la construction numérale.
- source_word: שׁוּעָלִים
  choice: renards
  rationale: « Renards » est le sens courant et traditionnel; l’autre identification possible, « chacals », est conservée en note.
- source_word: לַפִּדִים / לַפִּיד
  choice: torches / une torche
  rationale: Le terme désigne des objets enflammés; « torches » est clair en français moderne et convient au contexte.
- source_word: וַיֶּפֶן זָנָב אֶל זָנָב
  choice: Il disposa les animaux queue contre queue
  rationale: פנה signifie littéralement « tourner »; « disposa » exprime ici l’agencement sans ajouter explicitement qu’il les attacha, détail que le verset ne formule pas.
- source_word: בֵּין שְׁנֵי הַזְּנָבוֹת
  choice: entre les deux queues de chaque paire
  rationale: Le sens littéral est « entre les deux queues »; l’ajout idiomatique « de chaque paire » explicite que l’opération est répétée pour l’ensemble des animaux.
- source_word: בַּתָּוֶךְ
  choice: au milieu
  rationale: Rend directement la précision finale concernant l’emplacement de la torche.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement déployée en deux phrases pour éviter une accumulation lourde. « Queue contre queue » préserve l’image hébraïque, tandis que « disposa » évite d’introduire l’idée d’attacher, qui n’est pas explicitement exprimée dans ce verset.
