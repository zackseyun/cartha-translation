source:
  edition: WLC
  text: וַ/יִּבְקַ֨ע אֱלֹהִ֜ים אֶת הַ/מַּכְתֵּ֣שׁ אֲשֶׁר בַּ/לֶּ֗חִי וַ/יֵּצְא֨וּ מִמֶּ֤/נּוּ מַ֨יִם֙ וַ/יֵּ֔שְׁתְּ וַ/תָּ֥שָׁב רוּח֖/וֹ וַ/יֶּ֑חִי עַל כֵּ֣ן קָרָ֣א שְׁמָ֗/הּ עֵ֤ין הַקּוֹרֵא֙ אֲשֶׁ֣ר בַּ/לֶּ֔חִי עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/019.yaml
  text: Then God split open the hollow place that is at Lehi[a], and water came out from it. When he drank, his spirit returned and he revived. Therefore he called its name En-hakkore[b], which is at Lehi to this day.
translation:
  language: fr
  text: Alors Dieu fendit la cavité qui se trouve à Léhi[a], et de l’eau en sortit. Samson but ; son souffle lui revint et il reprit vie. C’est pourquoi il donna à cette source le nom d’En-Hakkoré[b]. Elle se trouve à Léhi jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre lecture de la scène : « Dieu fendit la cavité de la mâchoire, et de l’eau en sortit. » Le mot « Léhi » signifie aussi « mâchoire ».'
    reason: alternative_reading
  - marker: b
    text: En-Hakkoré signifie probablement « Source de celui qui appelle » ou « Source de celui qui a appelé », en référence à l’appel de Samson adressé à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקַע
  choice: fendit
  rationale: Le verbe exprime l’action énergique de fendre ou d’ouvrir par une brèche. « Fendit » conserve cette image concrète dans un français digne et naturel.
- source_word: הַמַּכְתֵּשׁ
  choice: la cavité
  rationale: Le nom désigne habituellement un mortier, mais peut évoquer par sa forme une dépression ou cavité. Dans ce contexte topographique, « la cavité » évite d’imposer l’image d’un objet domestique.
- source_word: בַּלֶּחִי
  choice: à Léhi
  rationale: La fin du verset et le contexte immédiat favorisent l’interprétation de Léhi comme nom de lieu. La lecture « dans la mâchoire » reste signalée en note.
- source_word: וַיֵּצְאוּ מִמֶּנּוּ מַיִם
  choice: de l’eau en sortit
  rationale: Cette formulation française naturelle rend le mouvement de l’eau hors de la cavité sans ajouter l’idée d’un écoulement continu.
- source_word: וַתָּשָׁב רוּחוֹ
  choice: son souffle lui revint
  rationale: רוּחַ peut désigner le souffle, l’esprit ou la vitalité. Dans cette scène d’épuisement physique, « souffle » est idiomatique tout en gardant le lien avec le retour de la vie.
- source_word: וַיֶּחִי
  choice: il reprit vie
  rationale: Le verbe décrit ici le rétablissement de Samson après un épuisement extrême, non une résurrection. « Reprit vie » exprime ce retour à la vitalité.
- source_word: קָרָא שְׁמָהּ
  choice: il donna à cette source le nom de
  rationale: La formulation explicite en français le référent féminin du suffixe hébreu et rend naturellement la formule de dénomination.
- source_word: עֵין הַקּוֹרֵא
  choice: En-Hakkoré
  rationale: Le nom propre est translittéré dans le texte, tandis que sa signification narrative est donnée en note.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Formule française consacrée qui reproduit fidèlement l’indication temporelle hébraïque.
theological_decisions:
- issue: Référent de בַּלֶּחִי et emplacement de la source d’eau
  choice: Comprendre Léhi comme un nom de lieu dans le texte principal.
  alternative: Comprendre que Dieu fend la cavité située dans la mâchoire dont Samson s’était servi.
  rationale: L’emploi répété de Léhi comme lieu et la clause finale « à Léhi jusqu’à ce jour » soutiennent fortement la lecture géographique. La polysémie de לֶחִי, « mâchoire » ou nom de lieu, permet néanmoins une autre représentation de la scène, conservée en note.
- issue: Sens de רוּחוֹ dans le rétablissement de Samson
  choice: son souffle lui revint
  alternative: son esprit lui revint
  rationale: Le terme peut désigner le souffle, l’esprit ou la force vitale. Le contexte de soif et d’épuisement favorise « souffle », sans réduire le mot à la seule force physique.
translation_notes:
  register: Français international moderne, narratif et digne. Le nom de Samson est explicité afin d’éviter une succession ambiguë de pronoms. Les tournures restent accessibles sans effacer la polysémie de רוּחַ ni celle de לֶחִי.
