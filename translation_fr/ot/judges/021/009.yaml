  text: וַ/יִּתְפָּקֵ֖ד הָ/עָ֑ם וְ/הִנֵּ֤ה אֵֽין שָׁם֙ אִ֔ישׁ מִ/יּוֹשְׁבֵ֖י יָבֵ֥שׁ גִּלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/009.yaml
  text: And the people were mustered[a], and behold, there was not a man there from the inhabitants of Jabesh-gilead.
translation:
  language: fr
  text: On fit le recensement du peuple, et voici qu’il n’y avait là aucun homme parmi les habitants de Yabesh-Galaad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְפָּקֵד
  choice: On fit le recensement
  rationale: Le hitpael de פקד désigne ici le dénombrement ou la revue du peuple assemblé. Cette formulation française rend naturellement le sens passif ou impersonnel du contexte sans imposer l’idée qu’ils se seraient assemblés eux-mêmes.
- source_word: הָעָם
  choice: du peuple
  rationale: עָם désigne le peuple, ici le corps israélite assemblé; « peuple » conserve le terme général sans le restreindre explicitement à l’armée.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette tournure conserve la fonction de הִנֵּה, qui attire vivement l’attention sur la constatation qui suit, tout en restant naturelle en français narratif.
- source_word: אֵין שָׁם אִישׁ
  choice: il n’y avait là aucun homme
  rationale: La traduction maintient le substantif masculin singulier אִישׁ et l’accent porté sur l’absence totale, sans neutraliser le texte en « personne ».
- source_word: מִיּוֹשְׁבֵי
  choice: parmi les habitants de
  rationale: 'Le participe substantivé de ישב désigne les personnes qui résident dans un lieu. La préposition מן a ici une valeur partitive: aucun homme appartenant aux habitants de la ville.'
- source_word: יָבֵשׁ גִּלְעָד
  choice: Yabesh-Galaad
  rationale: Translittération française moderne du nom de lieu, avec « Galaad », forme française biblique courante pour גִּלְעָד.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « On fit le recensement » est plus idiomatique que « le peuple fut recensé », tandis que « et voici que » préserve la vivacité narrative. Le masculin explicite « aucun homme » est conservé en raison du libellé hébreu et du contexte représentatif ou militaire.
