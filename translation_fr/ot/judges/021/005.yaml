revisions:
- from: 'Les fils d’Israël dirent[a] : « Parmi toutes les tribus d’Israël, qui n’est pas monté vers Yahweh[b] lors de l’assemblée ? » En effet, le serment solennel avait été prononcé contre quiconque ne monterait pas vers Yahweh à Mitspa, en ces termes : « Il sera certainement mis à mort. »'
  to: 'Les fils d’Israël dirent[a] : « Parmi toutes les tribus d’Israël, qui n’est pas monté vers Yahweh dans l’assemblée ? » Car un grand serment avait été prononcé contre quiconque n’était pas monté vers Yahweh à Mitspa, en ces termes : « Il sera certainement mis à mort. »'
  rationale: La révision corrige le décalage temporel dans la proposition relative du serment et remplace une explicitation interprétative par le rendu direct de « grand ». Elle conserve les ancres de notes et ne modifie pas le sens du passage.
