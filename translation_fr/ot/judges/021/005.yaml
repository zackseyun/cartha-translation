review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : « ne monterait pas » introduit un futur qui ne correspond pas au parfait hébreu (« qui n’était pas monté »). « Grand serment » rend plus directement הַשְּׁבוּעָה הַגְּדוֹלָה que « serment solennel », sans exclure sa portée solennelle dans le contexte.'
  naturalness: Le français révisé reste soutenu, moderne et naturel. « Dans l’assemblée » conserve explicitement le cadre exprimé par בַּקָּהָל, tandis que l’ordre de la phrase interrogative demeure fluide.
  terminology: « Les fils d’Israël », « Yahweh », « Mitspa » et « mis à mort » sont conservés. « Mis à mort » rend adéquatement la forme passive et l’intensification de מוֹת יוּמָת.
  issues:
  - severity: medium
    issue: Temps de « ne monterait pas »
    rationale: L’imparfait du conditionnel présente la non-participation comme future ou hypothétique. Le texte hébreu vise ceux qui n’étaient pas montés à l’assemblée ; le plus-que-parfait français conserve ce repère antérieur.
  - severity: low
    issue: « serment solennel » pour « grand serment »
    rationale: « Solennel » est possible en contexte, mais explicite une nuance que l’adjectif גדול n’énonce pas directement. « Grand serment » est à la fois fidèle et recevable en français.
  revised_text: 'Les fils d’Israël dirent[a] : « Parmi toutes les tribus d’Israël, qui n’est pas monté vers Yahweh dans l’assemblée ? » Car un grand serment avait été prononcé contre quiconque n’était pas monté vers Yahweh à Mitspa, en ces termes : « Il sera certainement mis à mort. »'
  revised_footnotes:
