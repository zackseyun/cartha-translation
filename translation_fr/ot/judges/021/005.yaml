source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֠י אֲשֶׁ֨ר לֹא עָלָ֧ה בַ/קָּהָ֛ל מִ/כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּי֩ הַ/שְּׁבוּעָ֨ה הַ/גְּדוֹלָ֜ה הָיְתָ֗ה לַ֠/אֲשֶׁר לֹא עָלָ֨ה אֶל יְהוָ֧ה הַ/מִּצְפָּ֛ה לֵ/אמֹ֖ר מ֥וֹת יוּמָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/005.yaml
  text: And the sons of Israel said[a], “Who is there from all the tribes of Israel who did not come up to Yahweh in the assembly?” For the great oath had been made concerning whoever did not come up to Yahweh at Mizpah, saying[b], “He shall surely be put to death.”
translation:
  language: fr
  text: 'Les fils d’Israël dirent[a] : « Parmi toutes les tribus d’Israël, qui n’est pas monté vers Yahweh dans l’assemblée ? » Car un grand serment avait été prononcé contre quiconque n’était pas monté vers Yahweh à Mitspa, en ces termes : « Il sera certainement mis à mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Les Israélites dirent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve l’expression collective masculine de l’hébreu, tout en signalant en note l’équivalent français plus courant « les Israélites ».
- source_word: מִי אֲשֶׁר ... מִכָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: Parmi toutes les tribus d’Israël, qui… ?
  rationale: Transpose naturellement en français la construction interrogative et relative, sans changer la portée de la question.
- source_word: לֹא עָלָה
  choice: n’est pas monté
  rationale: Préserve le verbe de mouvement עָלָה, qui signifie monter ou se rendre en un lieu considéré comme élevé.
- source_word: בַקָּהָל
  choice: lors de l’assemblée
  rationale: Exprime le cadre du rassemblement indiqué par קָהָל et la préposition בְּ. Cette formulation française évite de faire de l’assemblée la destination du verbe « monter ».
- source_word: אֶל יְהוָה
  choice: vers Yahweh
  rationale: Rend directement la préposition אֶל et conserve le nom divin personnel.
- source_word: הַשְּׁבוּעָה הַגְּדוֹלָה
  choice: le serment solennel
  rationale: « Solennel » exprime idiomatiquement en français la force de l’adjectif « grand » appliqué à un serment, sans en modifier le caractère contraignant.
- source_word: הָיְתָה לַאֲשֶׁר
  choice: avait été prononcé contre quiconque
  rationale: Rend la portée du serment à l’égard de la personne qui n’était pas montée, dans une formulation juridique naturelle.
- source_word: הַמִּצְפָּה
  choice: à Mitspa
  rationale: Adopte la forme française traditionnelle du nom de lieu et rend la destination indiquée dans le contexte.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Introduit naturellement en français le contenu explicite du serment.
- source_word: מוֹת יוּמָת
  choice: Il sera certainement mis à mort
  rationale: La combinaison de l’infinitif absolu et de la forme verbale passive intensifie la certitude de l’exécution.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le Tétragramme, nom personnel divin. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Expression collective masculine בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le corps du texte conserve la forme masculine explicite de l’hébreu, tandis que la note fournit l’équivalent collectif courant sans prétendre que seuls les hommes sont nécessairement visés.
- issue: Force de מוֹת יוּמָת
  choice: Il sera certainement mis à mort
  alternative: Il mourra certainement
  rationale: La formulation retenue préserve à la fois l’intensification hébraïque et la valeur passive, qui convient au caractère judiciaire du serment.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste proche de l’hébreu lorsque cela demeure naturel; « serment solennel » et « en ces termes » évitent toutefois des calques lourds. Les guillemets français et les espaces typographiques suivent l’usage éditorial français.
