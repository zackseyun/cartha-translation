  text: וַ/יָּ֤שָׁב בִּנְיָמִן֙ בָּ/עֵ֣ת הַ/הִ֔יא וַ/יִּתְּנ֤וּ לָ/הֶם֙ הַ/נָּשִׁ֔ים אֲשֶׁ֣ר חִיּ֔וּ מִ/נְּשֵׁ֖י יָבֵ֣שׁ גִּלְעָ֑ד וְ/לֹֽא מָצְא֥וּ לָ/הֶ֖ם כֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/014.yaml
  text: So Benjamin returned at that time[a], and they gave them the women whom they had kept alive from the women of Jabesh-gilead; but they did not find enough for them that way.
translation:
  language: fr
  text: À ce moment-là, Benjamin revint, et ils leur donnèrent les femmes de Yabesh en Galaad qu’ils avaient laissées en vie. Mais ils n’en trouvèrent pas assez pour eux de cette manière[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « mais ils ne trouvèrent pas ainsi pour eux ». L’expression hébraïque est elliptique ; dans le contexte, elle signifie que ce moyen ne procura pas assez de femmes pour tous.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: revint
  rationale: Le verbe שׁוב au wayyiqtol exprime ici naturellement le retour de Benjamin dans la suite du récit.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Le nom singulier désigne collectivement la tribu, tout en conservant la forme de l’hébreu.
- source_word: בָּעֵת הַהִיא
  choice: À ce moment-là
  rationale: Cette expression temporelle courante marque naturellement l’étape narrative en français moderne.
- source_word: וַיִּתְּנוּ לָהֶם
  choice: ils leur donnèrent
  rationale: Le verbe נתן signifie simplement « donner »; comme en hébreu, le sujet reste implicite et se déduit du contexte.
- source_word: הַנָּשִׁים אֲשֶׁר חִיּוּ
  choice: les femmes … qu’ils avaient laissées en vie
  rationale: Le piel de חיה indique ici que ces femmes avaient été épargnées lors du massacre; « laissées en vie » rend cette nuance avec naturel.
- source_word: מִנְּשֵׁי יָבֵשׁ גִּלְעָד
  choice: les femmes de Yabesh en Galaad
  rationale: Le מן indique leur provenance. La formulation française est réordonnée pour éviter la lourdeur de « parmi les femmes de… » sans changer le référent.
- source_word: וְלֹא מָצְאוּ לָהֶם כֵּן
  choice: Mais, de cette manière, ils n’en trouvèrent pas assez pour eux
  rationale: L’expression hébraïque est elliptique. Le pronom « en » reprend les femmes, et « pas assez » explicite sobrement l’insuffisance impliquée par le contexte, tandis que « de cette manière » rend כֵּן.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le nom collectif « Benjamin » et le sujet implicite « ils » sont maintenus conformément à l’hébreu. Le marqueur de note est placé sur l’expression elliptique qu’il explique.
