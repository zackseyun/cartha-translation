  text: וַ/יֹּ֣אמְר֔וּ מִ֗י אֶחָד֙ מִ/שִּׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר לֹֽא עָלָ֥ה אֶל יְהוָ֖ה הַ/מִּצְפָּ֑ה וְ֠/הִנֵּה לֹ֣א בָא אִ֧ישׁ אֶל הַֽ/מַּחֲנֶ֛ה מִ/יָּבֵ֥ישׁ גִּלְעָ֖ד אֶל הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/008.yaml
  text: And they said[a], “Which one of the tribes of Israel did not go up to Yahweh at Mizpah?” And behold, not a man from Jabesh-gilead had come to the camp[b], to the assembly.
translation:
  language: fr
  text: 'Ils dirent : « Laquelle des tribus d’Israël n’est pas montée vers Yahweh à Mitspa[a] ? » Et voici : pas un seul homme de Yabesh de Galaad n’était venu au camp, à l’assemblée[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’est pas montée devant Yahweh à Mitspa ». L’hébreu peut désigner le fait de paraître devant Yahweh au lieu du rassemblement.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « pas un homme ». Le masculin singulier souligne qu’aucun individu de Yabesh de Galaad n’était présent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils dirent
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif français et n’ajoute pas de rapport temporel absent de l’hébreu.
- source_word: מִי אֶחָד מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: Laquelle des tribus d’Israël
  rationale: La tournure française identifie une seule tribu au sein de l’ensemble d’Israël, tout en conservant la focalisation singulière de מִי אֶחָד.
- source_word: לֹא עָלָה
  choice: n’est pas montée
  rationale: « Monter » conserve l’expression hébraïque usuelle pour se rendre à un lieu de rassemblement ou à un site sacré. L’accord féminin se fait naturellement avec « tribu ».
- source_word: אֶל יְהוָה הַמִּצְפָּה
  choice: vers Yahweh à Mitspa
  rationale: « Vers Yahweh » rend directement אֶל יְהוָה, tandis que « à Mitspa » indique naturellement en français le lieu du rassemblement sans créer deux destinations concurrentes.
- source_word: וְהִנֵּה
  choice: Or, voici que
  rationale: Cette formulation signale une découverte remarquable et préserve la fonction discursive de וְהִנֵּה dans un français digne et intelligible.
- source_word: לֹא בָא אִישׁ
  choice: pas un seul homme n’était venu
  rationale: 'Cette expression française restitue la valeur distributive et emphatique du singulier אִישׁ sous la négation : aucun individu masculin n’était présent.'
- source_word: מִיָּבֵישׁ גִּלְעָד
  choice: de Yabesh en Galaad
  rationale: La préposition מִן marque l’origine. « Yabesh en Galaad » est une forme française claire du toponyme, qui distingue la ville de sa région.
- source_word: אֶל הַמַּחֲנֶה ... אֶל הַקָּהָל
  choice: au camp, à l’assemblée
  rationale: Les deux compléments sont maintenus selon leur juxtaposition hébraïque, le second précisant le rassemblement communautaire représenté par le camp.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » conserve le nom divin personnel sans le remplacer par un titre.
- issue: Rapport exprimé par אֶל יְהוָה
  choice: vers Yahweh
  alternative: devant Yahweh
  rationale: Le sens directionnel de אֶל est retenu dans le texte principal. Toutefois, le contexte d’une convocation peut permettre de comprendre qu’il s’agit de paraître devant Yahweh; cette possibilité est signalée en note afin de préserver l’ambiguïté.
translation_notes:
  register: 'Français international moderne, narratif et digne. Le passé simple est employé pour l’action principale, le plus-que-parfait pour la constatation rétrospective. Les noms propres suivent des formes françaises transparentes : Yahweh, Mitspa, Yabesh en Galaad.'
