base_translation:
  language: en
  yaml_path: translation/ot/judges/021/010.yaml
  text: So the assembly sent there twelve thousand men from the sons of valor, and they commanded them, saying, “Go and strike the inhabitants of Jabesh-gilead with the edge of the sword, including the women and the little ones.”
translation:
  language: fr
  text: 'L’assemblée y envoya donc douze mille hommes parmi les vaillants et leur donna cet ordre : « Allez frapper du tranchant de l’épée les habitants de Yabesh en Galaad, y compris les femmes et les enfants. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: l’assemblée
  rationale: Désigne ici la communauté d’Israël réunie; « assemblée » est naturel et précis dans ce contexte délibératif.
- source_word: מִבְּנֵי הֶחָיִל
  choice: parmi les vaillants
  rationale: L’expression désigne des hommes aptes et courageux au combat. Cette formulation française évite le calque peu naturel « fils de vaillance » sans ajouter un statut militaire absent du texte.
- source_word: לְפִי חֶרֶב
  choice: du tranchant de l’épée
  rationale: Rend l’expression idiomatique hébraïque associée à la mise à mort par l’épée tout en conservant son image concrète.
- source_word: יָבֵשׁ גִּלְעָד
  choice: Yabesh en Galaad
  rationale: Forme française claire qui distingue la ville de Yabesh et sa région, Galaad; elle évite le composé anglais « Jabesh-gilead ».
- source_word: הַטָּף
  choice: les enfants
  rationale: Dans cette énumération, le terme désigne les jeunes dépendants. « Enfants » est plus naturel en français moderne que « petits » et ne précise pas indûment leur âge.
theological_decisions:
- issue: Portée de l’ordre envers les femmes et les enfants
  choice: « y compris les femmes et les enfants » les inclut explicitement parmi les habitants visés
  alternative: « ainsi que les femmes et les enfants »
  rationale: La syntaxe hébraïque coordonne ces groupes à l’objet de l’ordre. La traduction conserve la dureté du récit sans l’atténuer ni ajouter de justification théologique.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste narrative et directe, sans archaïsmes inutiles; elle préserve la violence explicite du texte source.
