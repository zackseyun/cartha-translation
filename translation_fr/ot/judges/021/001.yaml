  text: וְ/אִ֣ישׁ יִשְׂרָאֵ֔ל נִשְׁבַּ֥ע בַּ/מִּצְפָּ֖ה לֵ/אמֹ֑ר אִ֣ישׁ מִמֶּ֔/נּוּ לֹא יִתֵּ֥ן בִּתּ֛/וֹ לְ/בִנְיָמִ֖ן לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/001.yaml
  text: The men of Israel had sworn at Mizpah[a], saying, “No man among us shall give his daughter to Benjamin as a wife.”
translation:
  language: fr
  text: 'Les hommes d’Israël avaient juré à Mitspa : « Aucun homme parmi nous ne donnera sa fille en mariage à un Benjaminite[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « à Benjamin » ; peut désigner la tribu de Benjamin ou un Benjaminite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: Les hommes d’Israël
  rationale: Le singulier אִישׁ a ici une valeur collective et désigne les hommes d’Israël comme groupe. En tête de chapitre, le waw assure la continuité narrative sans exiger un connecteur français explicite.
- source_word: נִשְׁבַּע
  choice: avaient juré
  rationale: Le nifal de שׁבע signifie « jurer, prêter serment ». Le plus-que-parfait indique naturellement que ce serment précède les événements racontés ensuite.
- source_word: בַּמִּצְפָּה
  choice: à Mitspa
  rationale: La préposition indique le lieu où le serment a été prononcé; « à » est la tournure française naturelle avec ce nom de lieu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le quotatif hébreu est rendu naturellement en français par les deux-points introduisant les paroles, sans ajouter le lourd « en disant ».
- source_word: אִישׁ מִמֶּנּוּ
  choice: Aucun de nous
  rationale: Dans le contexte du serment, l’expression distributive signifie qu’aucun homme du groupe ne doit agir ainsi; le français emploie naturellement « aucun de nous ».
- source_word: לֹא יִתֵּן
  choice: ne donnera
  rationale: L’imparfait hébreu nié exprime ici l’engagement contraignant portant sur l’avenir. Le futur français convient au contenu solennel du serment.
- source_word: בִּתּוֹ
  choice: sa fille
  rationale: Rendu direct du nom singulier avec suffixe possessif.
- source_word: לְבִנְיָמִן
  choice: à un Benjaminite
  rationale: Benjamin désigne ici, par métonymie, un membre de la tribu. Puisqu’une fille est donnée en mariage à une personne plutôt qu’à une entité tribale, « un Benjaminite » explicite naturellement le référent implicite.
- source_word: לְאִשָּׁה
  choice: en mariage
  rationale: Cette construction idiomatique signifie donner une femme afin qu’elle devienne épouse; « donner sa fille en mariage » est la formulation française courante et digne.
