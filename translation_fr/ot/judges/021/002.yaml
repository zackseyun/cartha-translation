source:
  edition: WLC
  text: וַ/יָּבֹ֤א הָ/עָם֙ בֵּֽית אֵ֔ל וַ/יֵּ֤שְׁבוּ שָׁם֙ עַד הָ/עֶ֔רֶב לִ/פְנֵ֖י הָ/אֱלֹהִ֑ים וַ/יִּשְׂא֣וּ קוֹלָ֔/ם וַ/יִּבְכּ֖וּ בְּכִ֥י גָדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/002.yaml
  text: Then the people came to Bethel and sat there before God until evening[a], and they raised their voices and wept with great weeping.
translation:
  language: fr
  text: Puis le peuple se rendit à Béthel. Ils restèrent là, devant Dieu, jusqu’au soir. Ils élevèrent la voix et pleurèrent à grands sanglots.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: se rendit
  rationale: Le verbe בוא décrit ici l’arrivée du peuple à un lieu nommé. « Se rendit à » exprime naturellement ce déplacement en français narratif sans suggérer nécessairement l’entrée dans un bâtiment.
- source_word: הָעָם
  choice: le peuple
  rationale: עם désigne collectivement les Israélites rassemblés, sans les réduire à une armée.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Il s’agit ici du nom de lieu, rendu selon sa forme française usuelle.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: Ils restèrent là
  rationale: ישב peut signifier s’asseoir, demeurer ou rester. Dans ce contexte duratif, « restèrent là » est naturel et conserve l’idée de leur présence prolongée jusqu’au soir.
- source_word: עַד הָעֶרֶב
  choice: jusqu’au soir
  rationale: Rendu temporel direct et idiomatique en français.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: devant Dieu
  rationale: La formule de présence est conservée de manière concise, et אֱלֹהִים est traduit par « Dieu » sans substitution du nom divin.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: Ils élevèrent la voix
  rationale: Cette expression française actuelle et digne reflète directement l’idiome hébreu signifiant qu’ils se mirent à crier ou à se lamenter à haute voix.
- source_word: וַיִּבְכּוּ בְּכִי גָדוֹל
  choice: pleurèrent à grands sanglots
  rationale: La construction avec le nom apparenté intensifie les pleurs. « À grands sanglots » transmet naturellement en français leur caractère profond et manifeste sans imposer la nuance particulière de l’amertume.
theological_decisions:
- issue: Traduction de הָאֱלֹהִים dans un contexte cultuel
  choice: Dieu
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte הָאֱלֹהִים et non le tétragramme YHWH. La traduction maintient donc « Dieu » plutôt que d’harmoniser avec d’autres passages.
translation_notes:
  register: Français international moderne, narratif et digne. La division en trois phrases allège la longue coordination hébraïque. Le singulier collectif « le peuple se rendit » est suivi du pluriel sémantique « ils », usage naturel qui fait ressortir les membres du groupe dans leurs actions. Aucun appel de note n’est nécessaire.
