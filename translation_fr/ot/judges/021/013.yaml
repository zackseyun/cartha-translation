  text: Then the whole congregation sent word and spoke to the sons of Benjamin who were at the rock of Rimmon[a], and proclaimed peace to them.
translation:
  language: fr
  text: Alors toute l’assemblée envoya leur parler aux fils de Benjamin qui se trouvaient au rocher de Rimmon[a], et leur proclama la paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Séla-Rimmon » ; l’hébreu peut désigner soit « le rocher de Rimmon », soit un nom de lieu plus fixe.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: envoya des émissaires
  rationale: Le verbe signifie simplement « envoyer », mais la proposition suivante précise que les personnes envoyées doivent parler aux Benjaminites. Le français exige plus naturellement un complément explicite; « des émissaires » exprime la mission sans en préciser indûment le statut.
- source_word: כָּל הָעֵדָה
  choice: toute l’assemblée
  rationale: עֵדָה désigne ici la communauté d’Israël réunie; « assemblée » est naturel, collectif et digne, tandis que « toute » rend כָּל.
- source_word: וַיְדַבְּרוּ אֶל
  choice: parler aux
  rationale: דבר אל est l’expression courante pour « parler à ». L’infinitif se rattache naturellement en français à l’envoi des émissaires.
- source_word: בְּנֵי בִנְיָמִן
  choice: les fils de Benjamin
  rationale: Cette traduction conserve l’expression tribale et familiale littérale de l’hébreu, sans la généraliser en « Benjaminites ».
- source_word: אֲשֶׁר בְּסֶלַע רִמּוֹן
  choice: qui se trouvaient au rocher de Rimmôn
  rationale: סֶלַע signifie « rocher » ou « escarpement ». La construction peut être comprise comme une description, « le rocher de Rimmôn », tout en laissant possible l’analyse comme nom de lieu fixe, signalée en note.
- source_word: וַיִּקְרְאוּ לָהֶם שָׁלוֹם
  choice: ils leur proclamèrent la paix
  rationale: קרא avec שָׁלוֹם exprime ici une déclaration publique de paix ou de réconciliation. « Proclamèrent la paix » garde cette force déclarative sans réduire le sens à une simple salutation.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: Dans ce contexte, שָׁלוֹם désigne le rétablissement de relations pacifiques plutôt que le seul bien-être.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe explicite les personnes envoyées, implicites dans l’hébreu mais nécessaires à une formulation française fluide. L’accent circonflexe de « Rimmôn » signale la voyelle longue de la translittération sans alourdir la lecture.
