  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ לָ/מָ֗ה יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָ֥יְתָה זֹּ֖את בְּ/יִשְׂרָאֵ֑ל לְ/הִפָּקֵ֥ד הַ/יּ֛וֹם מִ/יִּשְׂרָאֵ֖ל שֵׁ֥בֶט אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/003.yaml
  text: And they said[a], “Why, O Yahweh, God of Israel, has this happened in Israel[b], that today one tribe should be lacking from Israel?”
translation:
  language: fr
  text: 'Ils dirent : « Pourquoi, Yahweh, Dieu d’Israël, cela est-il arrivé en Israël[a], au point qu’il manque aujourd’hui une tribu à Israël[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cela a-t-il été en Israël » ; il s’agit d’une tournure hébraïque signifiant « cela est-il arrivé en Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « pour qu’aujourd’hui une tribu soit absente d’Israël » ; l’hébreu peut exprimer ici le but ou le résultat.'
    reason: ambiguity
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils dirent
  rationale: Le wayyiqtol poursuit la séquence narrative. Le passé simple convient au registre narratif biblique tout en restant clair en français.
- source_word: לָמָה
  choice: Pourquoi
  rationale: Rend directement l’interrogation plaintive sans ajouter d’explication causale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Dieu d’Israël
  rationale: Rend naturellement et précisément la chaîne construite hébraïque.
- source_word: הָיְתָה זֹּאת
  choice: cela est-il arrivé
  rationale: Littéralement « cela a-t-il été » ; en contexte, le français idiomatique exprime un événement qui s’est produit.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: Préserve à la fois la portée nationale et le cadre collectif de l’événement.
- source_word: לְהִפָּקֵד
  choice: au point qu’il manque
  rationale: Le niphal de פקד indique ici l’absence d’un élément au sein de l’ensemble. « Au point que » exprime naturellement la conséquence tout en signalant en note l’ambiguïté possible de לְ.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent français direct qui conserve l’accent temporel.
- source_word: מִיִּשְׂרָאֵל
  choice: à Israël
  rationale: Avec le verbe français « manquer », la construction « manquer à » exprime idiomatiquement l’absence d’une tribu au sein d’Israël, là où l’hébreu emploie littéralement « d’Israël ».
- source_word: שֵׁבֶט אֶחָד
  choice: une tribu
  rationale: Le numéral אֶחָד souligne qu’une seule unité tribale fait défaut ; en français, l’article indéfini suffit naturellement dans ce contexte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » conserve le caractère personnel du nom sans le remplacer par un titre.
- issue: Valeur de לְ devant הִפָּקֵד
  choice: 'conséquence : « au point que »'
  alternative: 'but ou résultat envisagé : « pour qu’… soit absente »'
  rationale: Dans cette plainte, la disparition d’une tribu est présentée naturellement comme le résultat tragique de ce qui est arrivé. La forme hébraïque permet toutefois une nuance de but ou de résultat, conservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple maintient le ton narratif. L’interpellation directe « Yahweh, Dieu d’Israël » est conservée sans ajout de « ô », jugé inutilement archaïsant. Les notes rendent visibles l’idiome de הָיְתָה זֹּאת et l’ambiguïté de לְהִפָּקֵד.
