  to: 'Guettez bien : lorsque les filles de Silo sortiront pour se livrer à des danses, sortez des vignes, et que chacun de vous saisisse[a] pour lui-même une épouse parmi les filles de Silo ; puis allez dans le territoire de Benjamin.'
