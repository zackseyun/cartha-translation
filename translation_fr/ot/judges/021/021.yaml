  naturalness: 'Le texte est globalement clair et de registre approprié. « Saisissez chacun pour vous une femme » reste cependant peu idiomatique : « que chacun de vous saisisse pour lui-même une épouse » est plus naturel tout en conservant la distribution individuelle et l’idée matrimoniale de אִשְׁתּוֹ.'
  terminology: '« Silo », « territoire de Benjamin » et « saisissez » conviennent. « Épouse » rend ici plus précisément אִשְׁתּוֹ que « femme », sans prétendre que les jeunes femmes sont déjà mariées : le contexte et la construction indiquent celle que chacun prendra comme épouse. La note sur la prise forcée est bien ancrée et adéquate.'
