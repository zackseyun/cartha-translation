  text: וּ/רְאִיתֶ֗ם וְ֠/הִנֵּה אִם יֵ֨צְא֥וּ בְנוֹת שִׁילוֹ֮ לָ/ח֣וּל בַּ/מְּחֹלוֹת֒ וִֽ/יצָאתֶם֙ מִן הַ/כְּרָמִ֔ים וַ/חֲטַפְתֶּ֥ם לָ/כֶ֛ם אִ֥ישׁ אִשְׁתּ֖/וֹ מִ/בְּנ֣וֹת שִׁיל֑וֹ וַ/הֲלַכְתֶּ֖ם אֶ֥רֶץ בִּנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/021.yaml
  text: Watch[a], and behold, when the daughters of Shiloh come out to dance in the dances, then come out from the vineyards and seize for yourselves, each man his wife from the daughters of Shiloh, and go to the land of Benjamin.
translation:
  language: fr
  text: 'Guettez bien : lorsque les filles de Silo sortiront pour se livrer à des danses, sortez des vignes, et que chacun de vous saisisse[a] pour lui-même une épouse parmi les filles de Silo ; puis allez dans le territoire de Benjamin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enlevez » ou « emportez de force » ; le verbe hébreu désigne une prise brusque et violente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Tenez-vous aux aguets
  rationale: Dans cette suite d’instructions, le verbe « voir » a valeur d’injonction et demande une observation attentive; cette formulation convient au contexte d’une embuscade.
- source_word: וְהִנֵּה אִם
  choice: et, lorsque
  rationale: הִנֵּה attire l’attention sur le moment attendu, tandis que אִם introduit formellement une éventualité. En français, « lorsque » exprime naturellement le scénario prévu sans alourdir la phrase par un littéral « voici, si ».
- source_word: בְנוֹת שִׁילוֹ
  choice: les filles de Silo
  rationale: Cette formulation conserve l’expression sociale et géographique de l’hébreu sans préciser un âge que le texte ne donne pas.
- source_word: לָחוּל בַּמְּחֹלוֹת
  choice: pour prendre part aux danses
  rationale: Le verbe et le nom apparentés évoquent l’action de danser et les danses; la formulation française évite la répétition peu naturelle « danser les danses » tout en préservant le pluriel.
- source_word: וִיצָאתֶם מִן הַכְּרָמִים
  choice: sortez des vignes
  rationale: L’ordre demande aux hommes de surgir de l’endroit où ils sont cachés, au milieu des vignes.
- source_word: וַחֲטַפְתֶּם
  choice: saisissez
  rationale: Le verbe désigne une prise brusque et forcée. « Saisissez » en conserve la violence sans introduire dans le texte principal une qualification juridique moderne.
- source_word: לָכֶם אִישׁ אִשְׁתּוֹ
  choice: chacun pour vous une femme
  rationale: 'La tournure rend la valeur distributive: chaque homme doit prendre une femme pour lui-même. En français moderne, elle est plus naturelle que le calque « chacun sa femme », qui pourrait laisser croire qu’il s’agit déjà de son épouse.'
- source_word: אֶרֶץ בִּנְיָמִן
  choice: le territoire de Benjamin
  rationale: אֶרֶץ désigne ici la région tribale de Benjamin; « territoire » est précis et idiomatique.
theological_decisions:
- issue: Caractère violent de l’action
  choice: saisissez
  alternative: enlevez / emportez de force
  rationale: Le passage ordonne une prise forcée de femmes. La traduction ne doit ni atténuer cette violence ni ajouter une catégorie juridique absente du lexème; une note signale donc des équivalents plus explicites.
- issue: Valeur distributive et statut matrimonial
  choice: chacun pour vous une femme
  alternative: chacun sa femme
  rationale: L’hébreu est masculin et distributif, mais אִשְׁתּוֹ exprime ici la femme destinée à devenir l’épouse de chacun. La formulation choisie évite de suggérer qu’elles étaient déjà leurs femmes.
- issue: Condition ou moment attendu
  choice: lorsque
  alternative: si
  rationale: אִם est formellement conditionnel, mais le contexte présente la sortie des filles comme l’occasion attendue. « Lorsque » rend mieux cette valeur temporelle en français, sans transformer l’épisode en certitude théologique.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe reste proche de la progression de l’hébreu, tout en évitant les calques opaques. Le marqueur d’attention וְהִנֵּה est intégré à l’instruction d’affût plutôt que rendu par l’archaïsant « voici ».
