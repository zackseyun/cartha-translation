  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יַּשְׁכִּ֣ימוּ הָ/עָ֔ם וַ/יִּבְנוּ שָׁ֖ם מִזְבֵּ֑חַ וַ/יַּעֲל֥וּ עֹל֖וֹת וּ/שְׁלָמִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/004.yaml
  text: And the next day the people rose early[a], built an altar there, and offered burnt offerings and peace offerings.
translation:
  language: fr
  text: Le lendemain, le peuple se leva de bon matin, bâtit là un autel et offrit des holocaustes et des sacrifices de paix[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion » ou « sacrifices de bien-être ». Le terme hébreu désigne une catégorie de sacrifices liée à la paix, à l’intégrité et à un repas partagé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Le lendemain
  rationale: La formule narrative וַיְהִי est naturellement absorbée en français, tandis que מִמָּחֳרָת est rendu avec précision par « le lendemain ».
- source_word: וַיַּשְׁכִּימוּ
  choice: se leva de bon matin
  rationale: Le verbe exprime le fait de se lever tôt; cette tournure française est naturelle, digne et conserve l’accent temporel.
- source_word: הָעָם
  choice: le peuple
  rationale: Le terme hébreu désigne simplement « le peuple ». Le contexte permet de l’identifier à Israël, mais le texte ne le précise pas ici.
- source_word: וַיִּבְנוּ שָׁם מִזְבֵּחַ
  choice: bâtit là un autel
  rationale: Le singulier collectif français reprend naturellement « le peuple », et « là » conserve l’adverbe explicite שָׁם.
- source_word: וַיַּעֲלוּ
  choice: offrit
  rationale: Dans ce contexte cultuel, le verbe signifie présenter des sacrifices; « offrir » rend clairement l’idiome hébreu.
- source_word: עֹלוֹת
  choice: des holocaustes
  rationale: « Holocaustes » est le terme biblique français établi pour les sacrifices entièrement consumés, sans exiger une périphrase lourde.
- source_word: וּשְׁלָמִים
  choice: des sacrifices de paix
  rationale: Cette traduction conserve le lien lexical avec la paix et reste compréhensible; une note signale les dimensions de communion et de bien-être comprises dans le terme.
theological_decisions:
- issue: Traduction des catégories sacrificielles
  choice: des holocaustes et des sacrifices de paix
  alternative: des sacrifices entièrement brûlés et des sacrifices de communion / de bien-être
  rationale: Le verset nomme des catégories cultuelles reconnues sans les expliquer. Les termes retenus sont concis et établis, tandis que la note préserve l’étendue sémantique de שְׁלָמִים sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide tout en conservant la succession narrative des actions et le vocabulaire sacrificiel du texte hébreu.
