  text: וְ/הָיָ֡ה כִּֽי יָבֹ֣אוּ אֲבוֹתָ/ם֩ א֨וֹ אֲחֵי/הֶ֜ם ל/רוב אֵלֵ֗י/נוּ וְ/אָמַ֤רְנוּ אֲלֵי/הֶם֙ חָנּ֣וּ/נוּ אוֹתָ֔/ם כִּ֣י לֹ֥א לָקַ֛חְנוּ אִ֥ישׁ אִשְׁתּ֖/וֹ בַּ/מִּלְחָמָ֑ה כִּ֣י לֹ֥א אַתֶּ֛ם נְתַתֶּ֥ם לָ/הֶ֖ם כָּ/עֵ֥ת תֶּאְשָֽׁמוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/022.yaml
  text: And it shall be[a], when their fathers or their brothers come to contend with us, that we will say to them, ‘Show us favor concerning them, because we did not take for each man his wife in the battle; for you did not give them to them[e][d][c][b], at this time, so that you should incur guilt.’
translation:
  language: fr
  text: 'Quand leurs pères ou leurs frères viendront nous demander des comptes[a], nous leur dirons : « Faites-nous grâce à leur sujet[b], car nous n’avons pas pris au combat une femme pour chacun d’eux[c]. En effet, ce n’est pas vous qui les leur avez données[d] ; autrement, vous seriez maintenant coupables[e]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « viendront se plaindre auprès de nous » ou « viendront nous chercher querelle ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Faites-nous grâce à leur sujet. » La construction hébraïque est condensée et peut aussi se comprendre : « Accordez-les-nous par faveur. »'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit de façon concise : « nous n’avons pas pris au combat chacun sa femme ». Il s’agit probablement du fait que les femmes obtenues lors de la guerre n’avaient pas été assez nombreuses pour tous les hommes de Benjamin.'
    reason: cultural_note
  - marker: d
    text: « Les » désigne les femmes, et « leur » les hommes de Benjamin.
    reason: clarity_note
  - marker: e
    text: 'La dernière proposition est difficile. Littéralement, elle peut se rendre : « car ce n’est pas vous qui les leur avez données ; maintenant vous seriez coupables ». Dans le contexte, le sens paraît être que les familles ne violaient pas leur serment, puisque les femmes n’avaient pas été données volontairement.'
    reason: textual_difficulty
lexical_decisions:
- source_word: לָרִיב אֵלֵינוּ
  choice: viendront nous demander des comptes
  rationale: ריב exprime ici une contestation ou un grief adressé aux responsables. « Demander des comptes » garde la dimension conflictuelle sans imposer une procédure judiciaire formelle.
- source_word: חָנּוּנוּ אוֹתָם
  choice: Accordez-nous cette faveur à leur sujet
  rationale: L’impératif de חנן avec le suffixe de première personne du pluriel signifie littéralement « faites-nous grâce ». Le pronom « eux/elles » rattache la demande aux Benjaminites ou aux femmes ; cette formulation conserve la faveur demandée aux familles sans trancher excessivement la construction condensée.
- source_word: לֹא לָקַחְנוּ אִישׁ אִשְׁתּוֹ בַּמִּלְחָמָה
  choice: nous n’avons pas pris au combat une femme pour chacun d’eux
  rationale: 'La tournure hébraïque est compacte. La traduction française naturelle rend le sens contextuel : les femmes obtenues lors du combat n’avaient pas suffi pour donner une épouse à chaque Benjaminite.'
- source_word: לֹא אַתֶּם נְתַתֶּם לָהֶם
  choice: ce n’est pas vous qui les leur avez données
  rationale: 'La construction emphatique oppose le don formel des femmes par leurs familles à leur enlèvement. Les deux pronoms sont conservés en français : « les » désigne les femmes et « leur » les Benjaminites.'
- source_word: כָּעֵת תֶּאְשָׁמוּ
  choice: autrement, vous seriez maintenant coupables
  rationale: La fin du verset est difficile et elliptique. Dans le contexte du serment de 21.18, elle indique vraisemblablement que les familles auraient été coupables si elles avaient elles-mêmes donné leurs filles. « Autrement » explicite le rapport implicite tout en signalant l’incertitude en note.
theological_decisions:
- issue: Culpabilité liée au serment d’Israël
  choice: La culpabilité évoquée est celle que les familles auraient encourue en donnant formellement les femmes aux Benjaminites.
  alternative: La phrase pourrait être comprise plus strictement comme « maintenant vous seriez coupables », sans expliciter la condition contraire.
  rationale: Le contexte immédiat de Juges 21.18 porte sur le serment interdisant de donner une fille en mariage à Benjamin. La traduction rend ce lien contextuel, mais la note conserve la difficulté syntaxique de l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. « Demander des comptes » est courant sans être familier ; « au combat » et « coupables » maintiennent la gravité du contexte. Les formulations trop littérales et opaques sont reléguées dans les notes afin de préserver à la fois la lisibilité et l’ambiguïté réelle de l’hébreu.
