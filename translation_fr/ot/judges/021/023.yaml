id: JDG.21.23
reference: Judges 21:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י בִנְיָמִ֔ן וַ/יִּשְׂא֤וּ נָשִׁים֙ לְ/מִסְפָּרָ֔/ם מִן הַ/מְּחֹלְל֖וֹת אֲשֶׁ֣ר גָּזָ֑לוּ וַ/יֵּלְכ֗וּ וַ/יָּשׁ֨וּבוּ֙ אֶל נַ֣חֲלָתָ֔/ם וַ/יִּבְנוּ֙ אֶת הֶ֣/עָרִ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/023.yaml
  text: So the sons of Benjamin did so[a], and took wives according to their number from the dancers whom they had seized. Then they went and returned to their inheritance, rebuilt the cities[c][b], and lived in them.
translation:
  language: fr
  text: 'Les fils de Benjamin firent ainsi : ils prirent pour femmes, selon leur nombre, des danseuses[a] qu’ils avaient enlevées de force[b]. Puis ils partirent et retournèrent dans le territoire reçu en héritage. Ils rebâtirent[c] les villes et y habitèrent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les femmes qui dansaient ». Le participe hébreu est au féminin pluriel.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu désigne une prise par la force; on pourrait aussi traduire « arrachées » ou « emportées de force ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « bâtirent ». « Rebâtirent » tient compte des villes de Benjamin dévastées plus tôt dans le récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: firent ainsi
  rationale: Rend directement la formule narrative indiquant qu’ils exécutèrent le plan exposé auparavant.
- source_word: בְּנֵי בִנְיָמִן
  choice: les fils de Benjamin
  rationale: Conserve l’expression familiale et tribale de l’hébreu, qui désigne ici les hommes de la tribu.
- source_word: וַיִּשְׂאוּ נָשִׁים
  choice: ils prirent pour femmes
  rationale: Reproduit l’idiome hébreu du mariage sans laisser entendre que les femmes étaient déjà mariées.
- source_word: לְמִסְפָּרָם
  choice: selon leur nombre
  rationale: 'Préserve la formulation concise de l’hébreu : le nombre de femmes prises correspondait au nombre des hommes concernés.'
- source_word: מִן הַמְּחֹלְלוֹת
  choice: des danseuses
  rationale: Le participe est féminin pluriel et désigne les femmes qui dansaient lors de la fête.
- source_word: אֲשֶׁר גָּזָלוּ
  choice: qu’ils avaient enlevées de force
  rationale: גזל exprime une prise violente ou injuste. Cette formulation claire ne dissimule pas la contrainte présente dans le récit.
- source_word: וַיֵּלְכוּ וַיָּשׁוּבוּ
  choice: Puis ils partirent et retournèrent
  rationale: 'Maintient les deux verbes hébreux : ils quittèrent le lieu de la fête, puis regagnèrent leur territoire.'
- source_word: אֶל נַחֲלָתָם
  choice: dans le territoire reçu en héritage
  rationale: Exprime naturellement en français le lot territorial tribal tout en conservant la notion d’héritage portée par נחלה.
- source_word: וַיִּבְנוּ אֶת הֶעָרִים
  choice: Ils rebâtirent les villes
  rationale: Le verbe signifie littéralement « bâtirent », mais le contexte indique la reconstruction des villes de Benjamin détruites au cours de la guerre.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: et y habitèrent
  rationale: Formulation française naturelle exprimant leur installation durable dans ces villes.
theological_decisions:
- issue: Portée morale du verbe גָּזָלוּ
  choice: qu’ils avaient enlevées de force
  alternative: qu’ils avaient prises / emmenées
  rationale: La traduction conserve explicitement la contrainte et ne transforme pas la narration en approbation morale de l’acte.
- issue: Terminologie tribale et territoriale
  choice: les fils de Benjamin ; le territoire reçu en héritage
  alternative: les Benjaminites ; leur territoire
  rationale: Ces choix préservent la texture familiale et la notion de lot héréditaire de l’hébreu, tout en restant compréhensibles en français moderne.
- issue: Valeur contextuelle de וַיִּבְנוּ
  choice: rebâtirent
  alternative: bâtirent
  rationale: « Rebâtirent » explicite la situation narrative des villes précédemment dévastées, tandis qu’une note signale la formulation littérale afin de ne pas masquer l’interprétation contextuelle.
translation_notes:
  register: Français international moderne, narratif et digne. Le texte conserve les expressions tribales et la gravité morale de l’enlèvement, sans archaïsmes inutiles. Les reprises verbales de l’hébreu sont maintenues lorsqu’elles structurent le déplacement.
