id: JDG.21.11
reference: Judges 21:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּל זָכָ֗ר וְ/כָל אִשָּׁ֛ה יֹדַ֥עַת מִשְׁכַּב זָכָ֖ר תַּחֲרִֽימוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/011.yaml
  text: 'And this is what you shall do: every male[a], and every woman who has known the bed of a male[b], you shall devote to destruction.'
translation:
  language: fr
  text: 'Et voici ce que vous ferez : tout mâle et toute femme qui a eu des relations sexuelles avec un homme[a], vous les vouerez à l’extermination[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui connaît la couche d’un mâle ». Il s’agit d’un euphémisme hébraïque désignant les relations sexuelles avec un homme.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu désigne ici le fait de mettre quelqu’un sous interdit en le vouant à la destruction, et non une simple mise à mort ordinaire.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה
  choice: Et voici
  rationale: Conserve le lien narratif marqué par la conjonction et introduit naturellement l’instruction en français.
- source_word: הַ/דָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: ce que vous ferez
  rationale: Rend idiomatiquement la tournure hébraïque « la chose que vous ferez » tout en conservant la valeur directive du futur.
- source_word: כָּל זָכָר
  choice: tout mâle
  rationale: זָכָר désigne le sexe masculin sans se limiter aux hommes adultes. Cette formulation conserve donc l’étendue du terme source.
- source_word: וְ/כָל אִשָּׁה
  choice: et toute femme
  rationale: אִשָּׁה désigne ici une femme, ensuite caractérisée selon son expérience sexuelle ; « épouse » serait trop restrictif.
- source_word: יֹדַעַת מִשְׁכַּב זָכָר
  choice: qui a eu des relations sexuelles avec un homme
  rationale: Exprime clairement en français moderne l’euphémisme hébraïque littéralement lié au fait de « connaître la couche d’un mâle », sans en modifier le sens.
- source_word: תַּחֲרִימוּ
  choice: vous les vouerez à l’extermination
  rationale: Le hiphil de חרם désigne la mise sous interdit en vue de la destruction ; cette traduction conserve cette portée technique et ne réduit pas l’action à une simple mise à mort.
theological_decisions:
- issue: Rendu de חרם dans un contexte de guerre et de jugement
  choice: vouer à l’extermination
  alternative: mettre sous interdit ; exterminer entièrement
  rationale: Le verbe évoque une mise sous interdit vouant les personnes à la destruction. Le choix retenu préserve cette dimension religieuse et juridique sans employer une expression excessivement obscure.
translation_notes:
  register: Français international moderne, clair et digne. La reprise pronominale « vous les vouerez » respecte la mise en relief des objets placés avant le verbe en hébreu. « Tout mâle » est conservé pour ne pas limiter indûment le texte aux adultes, malgré sa tonalité plus formelle en français.
