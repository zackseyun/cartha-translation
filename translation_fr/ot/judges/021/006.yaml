source:
  edition: WLC
  text: וַ/יִּנָּֽחֲמוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל בִּנְיָמִ֖ן אָחִ֑י/ו וַ/יֹּ֣אמְר֔וּ נִגְדַּ֥ע הַ/יּ֛וֹם שֵׁ֥בֶט אֶחָ֖ד מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/006.yaml
  text: And the sons of Israel grieved over Benjamin their brother[a], and they said, “Today one tribe has been cut off from Israel.”
translation:
  language: fr
  text: 'Les fils d’Israël éprouvèrent de la peine pour Benjamin, leur frère[a], et dirent : « Aujourd’hui, une tribu a été retranchée d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « eurent compassion de Benjamin, leur frère » ou « regrettèrent ce qui était arrivé à Benjamin, leur frère ». Le verbe hébreu peut exprimer la peine, la compassion ou le regret selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֲמוּ
  choice: éprouvèrent de la peine pour
  rationale: Le nifal de נחם peut exprimer ici la peine, la compassion ou le regret devant la quasi-disparition de Benjamin. Cette formulation française reste naturelle sans réduire le sens à une seule nuance.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression familiale et collective de l’hébreu, importante dans un verset qui appelle Benjamin « leur frère ».
- source_word: אֶל בִּנְיָמִן
  choice: pour Benjamin
  rationale: Avec נחם, la préposition אֶל désigne ici l’objet de la peine ou de la compassion ; « pour » convient naturellement en français.
- source_word: בִּנְיָמִן אָחִיו
  choice: Benjamin, leur frère
  rationale: Le suffixe singulier de « son frère » se rapporte collectivement aux fils d’Israël. Le pluriel français explicite naturellement cette relation collective.
- source_word: נִגְדַּע
  choice: a été retranchée
  rationale: Le verbe גדע évoque littéralement l’action de couper ou d’abattre. « Retranchée » préserve l’image et l’idée d’exclusion du corps d’Israël sans imposer celle d’un anéantissement absolument total.
- source_word: הַיּוֹם
  choice: Aujourd’hui
  rationale: Équivalent français actuel et direct, qui garde l’immédiateté de la lamentation.
- source_word: שֵׁבֶט אֶחָד
  choice: une tribu
  rationale: En contexte, l’indéfini français exprime naturellement qu’une des tribus constituant Israël vient d’être retranchée ; le numéral hébreu souligne l’unité tribale concernée.
- source_word: מִיִּשְׂרָאֵל
  choice: d’Israël
  rationale: 'La préposition מן est séparative : la tribu est présentée comme retranchée de l’ensemble national.'
theological_decisions: []
