  variant: modern international French
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/025.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: fr
  text: En ce temps-là, il n’y avait pas de roi en Israël ; chacun[a] faisait ce qui était juste à ses propres yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici le masculin singulier « un homme », avec un sens distributif : « chacun » ou « chaque homme ».'
    reason: Précision sur la forme grammaticale et sa portée distributive.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: En ce temps-là
  rationale: Formule temporelle narrative naturelle en français, qui conserve le regard rétrospectif de l’hébreu.
- source_word: אֵין מֶלֶךְ
  choice: il n’y avait pas de roi
  rationale: Rend naturellement la proposition existentielle négative et situe l’absence de roi dans le cadre passé du récit.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: Rendu direct de l’expression locative désignant le cadre national.
- source_word: אִישׁ
  choice: chacun
  rationale: Le nom masculin singulier est employé distributivement. « Chacun » restitue ce sens en français courant sans limiter indûment l’énoncé aux seuls hommes adultes.
- source_word: הַיָּשָׁר
  choice: ce qui était juste
  rationale: L’adjectif substantivé désigne ce qui est tenu pour droit ou juste ; cette formulation en conserve la portée évaluative.
- source_word: בְּעֵינָיו
  choice: à ses propres yeux
  rationale: Conserve l’image hébraïque des « yeux » ainsi que l’idée d’un jugement subjectif personnel.
- source_word: יַעֲשֶׂה
  choice: faisait
  rationale: L’imparfait français exprime naturellement l’action habituelle résumée dans ce cadre narratif passé.
theological_decisions:
- issue: Portée du masculin singulier אִישׁ
  choice: chacun
  alternative: chaque homme
  rationale: Le singulier masculin hébreu a ici une valeur distributive. « Chacun » préserve cette structure distributive tout en communiquant correctement la portée générale de l’énoncé.
- issue: Évaluation implicite du refrain
  choice: Maintenir la formulation « ce qui était juste à ses propres yeux » sans commentaire ajouté
  alternative: chacun faisait tout ce qui lui plaisait
  rationale: Le contexte peut donner au refrain une valeur critique, mais le texte dit littéralement que chacun faisait ce qui était juste à ses yeux. La traduction n’accentue donc pas cette évaluation au-delà de l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation met en relief les deux membres du refrain, tandis que « à ses propres yeux » conserve l’image et la tension morale du texte hébreu.
