  text: וַ/יֹּ֣אמְר֔וּ יְרֻשַּׁ֥ת פְּלֵיטָ֖ה לְ/בִנְיָמִ֑ן וְ/לֹֽא יִמָּחֶ֥ה שֵׁ֖בֶט מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/017.yaml
  text: And they said[a], “There must be an inheritance for the survivors of Benjamin, so that a tribe may not be blotted out from Israel.”
translation:
  language: fr
  text: 'Ils dirent : « Il faut un héritage pour les survivants de Benjamin[a], afin qu’aucune tribu ne soit effacée d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un héritage pour le reste de Benjamin » ou « un héritage pour les rescapés de Benjamin ». L’hébreu juxtapose de façon concise « héritage » et « survivants/reste » ; le rapport exact entre ces termes peut être exprimé de plusieurs manières en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils dirent
  rationale: Le wayyiqtol de אמר poursuit simplement le récit et introduit la parole du groupe. Le passé simple convient au registre narratif français.
- source_word: יְרֻשַּׁת
  choice: un héritage
  rationale: Le nom dérivé de ירש désigne un héritage ou une possession héréditaire. « Héritage » convient au contexte de la continuité territoriale et familiale de la tribu.
- source_word: פְּלֵיטָה
  choice: les survivants
  rationale: Le terme désigne ceux qui ont échappé au désastre. Dans ce contexte, « les survivants » est clair, naturel et moins susceptible de recevoir une portée théologique ajoutée que « le reste ».
- source_word: לְבִנְיָמִן
  choice: de Benjamin
  rationale: Avec « survivants », le français exprime naturellement par « de » leur appartenance à la tribu de Benjamin, tandis que l’ensemble de la proposition garde l’idée d’un héritage destiné à ceux-ci.
- source_word: וְלֹא יִמָּחֶה
  choice: afin que… ne soit effacée
  rationale: Le niphal de מחה évoque le fait d’être effacé ou supprimé. « Afin que » rend la valeur finale suggérée par le contexte sans affaiblir l’image du verbe.
- source_word: שֵׁבֶט
  choice: aucune tribu
  rationale: Sous la négation, « aucune tribu ne soit… » est la formulation française naturelle correspondant à l’hébreu « une tribu ne soit pas… », et souligne qu’une composante tribale d’Israël ne doit pas disparaître.
- source_word: מִיִּשְׂרָאֵל
  choice: d’Israël
  rationale: 'La préposition מן est séparative : la tribu ne doit pas être retranchée de l’ensemble d’Israël.'
