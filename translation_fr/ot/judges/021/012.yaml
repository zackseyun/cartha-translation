source:
  edition: WLC
  text: וַֽ/יִּמְצְא֞וּ מִ/יּוֹשְׁבֵ֣י יָבֵ֣ישׁ גִּלְעָ֗ד אַרְבַּ֤ע מֵאוֹת֙ נַעֲרָ֣ה בְתוּלָ֔ה אֲשֶׁ֧ר לֹֽא יָדְעָ֛ה אִ֖ישׁ לְ/מִשְׁכַּ֣ב זָכָ֑ר וַ/יָּבִ֨יאוּ אוֹתָ֤/ם אֶל הַֽ/מַּחֲנֶה֙ שִׁלֹ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ כְּנָֽעַן׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/012.yaml
  text: And from the inhabitants of Jabesh-gilead they found four hundred young women, virgins, who had not known a man by lying with a male; and they brought them to the camp at Shiloh, which is in the land of Canaan.
translation:
  language: fr
  text: Parmi les habitants de Yabesh en Galaad, ils trouvèrent quatre cents jeunes femmes vierges qui n’avaient jamais eu de relations avec un homme. Ils les amenèrent au camp, à Silo, dans le pays de Canaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיּוֹשְׁבֵי יָבֵישׁ גִּלְעָד
  choice: Parmi les habitants de Yabesh en Galaad
  rationale: Le מִן partitif indique qu’elles furent trouvées parmi la population de la ville. « Yabesh en Galaad » est naturel en français tout en conservant la localisation du nom hébreu.
- source_word: נַעֲרָה בְתוּלָה
  choice: jeunes femmes vierges
  rationale: נַעֲרָה désigne ici de jeunes femmes, tandis que בְתוּלָה précise leur virginité; la traduction garde les deux éléments sans les confondre.
- source_word: אֲשֶׁר לֹא יָדְעָה אִישׁ לְמִשְׁכַּב זָכָר
  choice: qui n’avaient jamais eu de relations avec un homme
  rationale: L’expression hébraïque dit littéralement qu’elles n’avaient pas « connu » d’homme quant au fait de coucher avec un mâle. La formulation française exprime clairement et dignement le sens sexuel, sans lourdeur ni atténuation.
- source_word: שִׁלֹה
  choice: Silo
  rationale: Forme française traditionnelle et largement intelligible du toponyme biblique.
- source_word: אֶרֶץ כְּנָעַן
  choice: le pays de Canaan
  rationale: Rend directement l’expression géographique hébraïque.
theological_decisions:
- issue: La qualification des jeunes femmes et l’affirmation de leur virginité
  choice: Conserver à la fois « jeunes femmes » et « vierges », puis expliciter l’absence de relations sexuelles
  alternative: Réduire à « jeunes vierges » ou traduire littéralement « n’avaient pas connu d’homme en couchant avec un mâle »
  rationale: Le texte insiste doublement sur leur statut. La version retenue préserve cette insistance narrative sans introduire d’interprétation doctrinale ni reproduire une tournure artificielle en français.
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans être archaïque. La formulation reste directe face à la violence du contexte et n’ajoute aucune appréciation morale absente de ce verset.
