  text: וְ/הָ/עָ֥ם נִחָ֖ם לְ/בִנְיָמִ֑ן כִּֽי עָשָׂ֧ה יְהוָ֛ה פֶּ֖רֶץ בְּ/שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/015.yaml
  text: And the people grieved for Benjamin, because the LORD had made a breach among the tribes of Israel.
translation:
  language: fr
  text: Le peuple eut de la compassion pour Benjamin, car le SEIGNEUR[a] avait fait une brèche parmi les tribus d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, nom propre du Dieu d’Israël, traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler le nom divin présent dans le texte source tout en employant une convention française traditionnelle.
lexical_decisions:
- source_word: נִחָם
  choice: éprouvait du chagrin
  rationale: Le nifal exprime ici l’affliction ou le regret ressenti par le peuple au sujet de Benjamin. Cette formulation naturelle conserve l’idée de peine sans réduire le terme à la seule compassion.
- source_word: פֶּרֶץ
  choice: une brèche
  rationale: L’image concrète d’une rupture dans l’ensemble d’Israël est conservée; «ouvrir une brèche» est idiomatique en français.
- source_word: בְּשִׁבְטֵי יִשְׂרָאֵל
  choice: parmi les tribus d’Israël
  rationale: Rend le pluriel hébreu et situe la rupture au sein de la communauté des tribus.
theological_decisions:
- issue: Attribution de la brèche à YHWH
  choice: le SEIGNEUR avait ouvert une brèche
  alternative: une brèche s’était ouverte
  rationale: Le texte hébreu attribue explicitement l’action à YHWH. La traduction maintient cette tension théologique sans l’atténuer ni l’expliquer.
translation_notes:
  register: Français moderne, clair et digne. « Éprouvait du chagrin » communique une douleur durable; « avait ouvert une brèche » préserve l’image hébraïque et l’action divine explicite.
