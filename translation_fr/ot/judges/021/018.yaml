  text: וַ/אֲנַ֗חְנוּ לֹ֥א נוּכַ֛ל לָ/תֵת לָ/הֶ֥ם נָשִׁ֖ים מִ/בְּנוֹתֵ֑י/נוּ כִּֽי נִשְׁבְּע֤וּ בְנֵֽי יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אָר֕וּר נֹתֵ֥ן אִשָּׁ֖ה לְ/בִנְיָמִֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/018.yaml
  text: But we cannot give them wives from our daughters[a], because the sons of Israel have sworn, saying, ‘Cursed is the one who gives a wife to Benjamin.’
translation:
  language: fr
  text: 'Mais nous ne pouvons pas leur donner pour femmes certaines de nos filles, car les fils d’Israël ont prêté serment en disant : « Maudit soit celui qui donne une femme à Benjamin[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus explicitement, « à la tribu de Benjamin » ou « à un Benjaminite » ; l’hébreu emploie directement le nom tribal « Benjamin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Mais nous
  rationale: La conjonction et le pronom indépendant marquent ici un contraste dans le raisonnement, tout en mettant le sujet en relief.
- source_word: לֹא נוּכַל
  choice: nous ne pouvons pas
  rationale: יכל exprime l’aptitude ou la possibilité. Le contexte lie cette impossibilité au serment, sans que le texte ajoute explicitement une notion comme « légalement ».
- source_word: לָתֵת לָהֶם נָשִׁים מִבְּנוֹתֵינוּ
  choice: leur donner pour femmes certaines de nos filles
  rationale: Cette formulation française naturelle conserve l’idée de donner des filles en mariage et rend la valeur partitive de מן sans suggérer que toutes leurs filles seraient concernées.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’impossibilité qui vient d’être affirmée.
- source_word: נִשְׁבְּעוּ
  choice: ont prêté serment
  rationale: Le nifal de שׁבע désigne l’action de jurer ou de s’engager par serment; cette expression est claire et idiomatique en français.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve la forme masculine explicite et traditionnelle de l’hébreu plutôt que de la généraliser en « Israélites ».
- source_word: לֵאמֹר
  choice: en disant
  rationale: L’infinitif introduit directement le contenu du serment.
- source_word: אָרוּר
  choice: Maudit soit
  rationale: Cette tournure française restitue naturellement la formule de malédiction judiciaire ou conventionnelle.
- source_word: נֹתֵן אִשָּׁה
  choice: celui qui donne une femme
  rationale: Le participe a une portée générique; « une femme » convient au contexte matrimonial sans ajouter une formule absente du texte.
- source_word: לְבִנְיָמִן
  choice: à Benjamin
  rationale: L’hébreu emploie directement le nom tribal. La traduction maintient cette formulation compacte et son caractère collectif implicite.
