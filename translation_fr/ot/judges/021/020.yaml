  text: And they commanded the sons of Benjamin[a], saying[b], “Go and lie in wait in the vineyards.”
translation:
  language: fr
  text: 'On ordonna aux fils de Benjamin : « Allez vous embusquer dans les vignes. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַוּ
  choice: Ils donnèrent cet ordre
  rationale: Le verbe צוה signifie « ordonner, donner des instructions ». La forme est au pluriel. Cette tournure française restitue naturellement l’acte de commander et permet d’introduire directement les paroles qui suivent.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: aux fils de Benjamin
  rationale: Traduction directe de l’expression hébraïque de parenté. Elle reste intelligible en français et conserve la manière dont le texte désigne les membres de la tribu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif quotatif hébreu introduit les paroles rapportées. En français actuel, les deux-points remplissent naturellement cette fonction sans l’expression lourde « en disant ».
- source_word: לְכוּ
  choice: Allez
  rationale: Impératif pluriel direct du verbe הלך.
- source_word: וַאֲרַבְתֶּם
  choice: vous mettre en embuscade
  rationale: Le verbe ארב exprime l’action de se cacher ou de se poster pour attendre quelqu’un. Après « Allez », cette formulation rend naturellement la valeur injonctive de la forme hébraïque.
- source_word: בַּכְּרָמִים
  choice: dans les vignes
  rationale: Le pluriel כְּרָמִים désigne des vignes ou vignobles. « Dans les vignes » rend directement la préposition et convient naturellement à la scène.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe française évite le calque « commandèrent… en disant », tout en conservant le pluriel du sujet et l’expression hébraïque « fils de Benjamin ».
