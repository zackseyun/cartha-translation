  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּאמְר֡וּ הִנֵּה֩ חַג יְהוָ֨ה בְּ/שִׁל֜וֹ מִ/יָּמִ֣ים יָמִ֗ימָ/ה אֲשֶׁ֞ר מִ/צְּפ֤וֹנָ/ה לְ/בֵֽית אֵל֙ מִזְרְחָ֣/ה הַ/שֶּׁ֔מֶשׁ לִ/מְסִלָּ֔ה הָ/עֹלָ֥ה מִ/בֵּֽית אֵ֖ל שְׁכֶ֑מָ/ה וּ/מִ/נֶּ֖גֶב לִ/לְבוֹנָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/019.yaml
  text: And they said[a], "Look, there is a feast of Yahweh in Shiloh from year to year, which is north of Bethel, east of the highway that goes up from Bethel to Shechem[b], and south of Lebonah."
translation:
  language: fr
  text: 'Ils dirent : « Voici, il y a chaque année[a] une fête de Yahweh à Silo, au nord de Béthel, à l’est de la route qui monte de Béthel à Sichem, et au sud de Lebona. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de jours en jours », expression qui indique ici une célébration annuelle.'
    reason: Précision sur l’idiome hébreu rendu par « chaque année ».
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils dirent
  rationale: Le passé simple convient au registre narratif biblique en français tout en restant clair et digne.
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la fonction déictique et emphatique du terme hébreu dans une formulation française naturelle.
- source_word: חַג יְהוָה
  choice: une fête de Yahweh
  rationale: חַג désigne une fête religieuse, souvent liée à un pèlerinage. L’absence d’article défini favorise « une fête », sans exclure qu’il s’agisse d’une célébration bien connue des interlocuteurs.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בְּשִׁלוֹ
  choice: à Silo
  rationale: Forme française traditionnelle et intelligible du nom de lieu, avec la préposition locative naturelle.
- source_word: מִיָּמִים יָמִימָה
  choice: chaque année
  rationale: Rend naturellement l’idée de récurrence annuelle exprimée par l’idiome hébreu.
- source_word: מִצְּפוֹנָה לְבֵית אֵל
  choice: au nord de Béthel
  rationale: Expression géographique directe correspondant au rapport spatial de l’hébreu.
- source_word: מִזְרְחָה הַשֶּׁמֶשׁ לִמְסִלָּה
  choice: à l’est de la route
  rationale: מִזְרְחָה הַשֶּׁמֶשׁ signifie littéralement « du côté du lever du soleil », soit « à l’est » dans ce contexte; מְסִלָּה désigne ici une voie importante.
- source_word: הָעֹלָה מִבֵּית אֵל שְׁכֶמָה
  choice: qui monte de Béthel à Sichem
  rationale: Préserve l’image topographique de la montée et rend le suffixe directionnel de שְׁכֶמָה par la destination « à Sichem ».
- source_word: וּמִנֶּגֶב לִלְבוֹנָה
  choice: et au sud de Lebona
  rationale: Complète naturellement en français la localisation géographique donnée par l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre du Dieu d’Israël dans un contexte narratif non contesté; sa transcription préserve cette valeur de nom personnel.
translation_notes:
  register: 'Français international moderne, clair et digne. Le passé simple maintient le ton narratif; « Voici » conserve l’appel d’attention de l’hébreu. Les toponymes suivent leurs formes françaises usuelles : Silo, Béthel, Sichem et Lebona.'
