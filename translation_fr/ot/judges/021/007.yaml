source:
  edition: WLC
  text: מַה נַּעֲשֶׂ֥ה לָ/הֶ֛ם לַ/נּוֹתָרִ֖ים לְ/נָשִׁ֑ים וַ/אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ בַֽ/יהוָ֔ה לְ/בִלְתִּ֛י תֵּת לָ/הֶ֥ם מִ/בְּנוֹתֵ֖י/נוּ לְ/נָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/007.yaml
  text: What shall we do for them—for those who remain—to get wives? For we have sworn by Yahweh not to give them any of our daughters as wives.
translation:
  language: fr
  text: Que ferons-nous pour ceux qui restent, afin qu’ils aient des femmes[a] ? En effet, nous avons juré par Yahweh de ne leur donner aucune de nos filles pour femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour des femmes ».'
    reason: L’hébreu emploie une tournure elliptique dont le sens implicite est explicité dans le texte.
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה
  choice: Que ferons-nous
  rationale: L’interrogatif מַה avec l’imparfait à la première personne du pluriel exprime ici une délibération sur la conduite à suivre.
- source_word: לָהֶם לַנּוֹתָרִים
  choice: pour ceux qui restent
  rationale: Le pronom « pour eux » est repris et précisé par « ceux qui restent ». En français, la fusion évite une apposition lourde tout en conservant l’idée d’une action entreprise en leur faveur.
- source_word: לְנָשִׁים
  choice: afin qu’ils aient des femmes
  rationale: L’hébreu elliptique signifie littéralement « pour des femmes ». Le français explicite le but implicite sans préciser par quel moyen ces femmes leur seraient procurées.
- source_word: וַאֲנַחְנוּ נִשְׁבַּעְנוּ
  choice: En effet, nous avons juré
  rationale: La conjonction introduit la raison du dilemme, et le passé composé exprime un serment antérieur qui demeure contraignant.
- source_word: בַיהוָה
  choice: par Yahweh
  rationale: La préposition ב appartient à la formule de serment, et le tétragramme est transcrit comme nom divin.
- source_word: לְבִלְתִּי תֵּת לָהֶם מִבְּנוֹתֵינוּ לְנָשִׁים
  choice: de ne leur donner aucune de nos filles pour femme
  rationale: « Aucune de nos filles » rend naturellement la valeur partitive de מִן ; « pour femme » exprime l’entrée en mariage et convient au fait qu’une fille serait donnée à chacun des hommes concernés.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre dans une formule de serment. « Yahweh » le représente directement sans le remplacer par un titre.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve le ton délibératif du conseil et explicite seulement l’ellipse nécessaire à une lecture française naturelle.
