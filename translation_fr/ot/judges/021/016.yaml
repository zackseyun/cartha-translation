source:
  edition: WLC
  text: וַ/יֹּֽאמְר֨וּ זִקְנֵ֣י הָ/עֵדָ֔ה מַה נַּעֲשֶׂ֥ה לַ/נּוֹתָרִ֖ים לְ/נָשִׁ֑ים כִּֽי נִשְׁמְדָ֥ה מִ/בִּנְיָמִ֖ן אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/016.yaml
  text: Then the elders of the congregation said[a], “What shall we do for wives for those who remain, since the women of Benjamin have been destroyed?”
translation:
  language: fr
  text: 'Alors les anciens de l’assemblée dirent : « Que ferons-nous pour procurer des femmes à ceux qui restent, puisque les femmes de Benjamin ont été exterminées[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « puisqu’une femme de Benjamin a été exterminée » ; le singulier « femme » désigne collectivement les femmes de Benjamin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעֵדָה
  choice: les anciens de l’assemblée
  rationale: Le construit pluriel זִקְנֵי signifie « les anciens de », et הָעֵדָה désigne ici la communauté réunie. « Assemblée » rend naturellement cette dimension collective en français moderne.
- source_word: מַה נַּעֲשֶׂה
  choice: Que ferons-nous
  rationale: L’interrogatif suivi de l’imparfait à la première personne du pluriel exprime une délibération sur la conduite à adopter.
- source_word: לַנּוֹתָרִים
  choice: à ceux qui restent
  rationale: Le participe renvoie aux Benjaminites demeurés en vie après le massacre. Cette formulation reste proche de l’hébreu sans expliciter davantage que le texte.
- source_word: לְנָשִׁים
  choice: pour procurer des femmes
  rationale: Dans ce contexte, נָשִׁים désigne des femmes destinées à devenir les épouses des survivants. Le verbe « procurer », fourni par le contexte de la question, permet une formulation française idiomatique sans masquer la logique matrimoniale du passage.
- source_word: כִּי
  choice: puisque
  rationale: La conjonction introduit la raison qui motive la question des anciens.
- source_word: נִשְׁמְדָה
  choice: ont été exterminées
  rationale: Le niphal de שׁמד exprime une destruction totale ou une élimination violente. « Exterminées » conserve la gravité du terme et s’accorde avec le référent collectif rendu au pluriel.
- source_word: מִבִּנְיָמִן אִשָּׁה
  choice: les femmes de Benjamin
  rationale: L’hébreu emploie littéralement le singulier « une femme de Benjamin » dans un sens collectif. Le pluriel français exprime clairement le sens contextuel, tandis qu’une note conserve la particularité formelle de l’original.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Assemblée » préserve le caractère communautaire de הָעֵדָה. La formulation maintient la violence du constat sans l’atténuer et signale en note le singulier collectif de l’hébreu.
