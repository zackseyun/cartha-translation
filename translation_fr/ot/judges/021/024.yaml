  text: וַ/יִּתְהַלְּכ֨וּ מִ/שָּׁ֤ם בְּנֵֽי יִשְׂרָאֵל֙ בָּ/עֵ֣ת הַ/הִ֔יא אִ֥ישׁ לְ/שִׁבְט֖/וֹ וּ/לְ/מִשְׁפַּחְתּ֑/וֹ וַ/יֵּצְא֣וּ מִ/שָּׁ֔ם אִ֖ישׁ לְ/נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/024.yaml
  text: Then the sons of Israel departed from there at that time[a], each man to his tribe and to his family, and they went out from there[b], each man to his inheritance.
translation:
  language: fr
  text: À ce moment-là, les Israélites partirent de là, chacun vers sa tribu et son clan[a]. Ils quittèrent de là, chacun vers son héritage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa famille » ; le terme hébreu peut désigner un groupe de parenté plus large que la famille immédiate.
    reason: lexical_alternative
  - marker: b
    text: Ou « son territoire attribué en héritage » ; « héritage » désigne ici la possession territoriale héréditaire de chacun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: se dispersèrent
  rationale: La forme hitpael de הלך décrit ici le départ des Israélites chacun de son côté, plutôt que la simple action de marcher. « Se dispersèrent » exprime naturellement ce mouvement distributif.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation française courante rend naturellement l’expression hébraïque « fils d’Israël » sans donner à penser qu’il s’agit seulement des fils immédiats du patriarche.
- source_word: בָּעֵת הַהִיא
  choice: à ce moment-là
  rationale: Cette formulation rend directement le repère temporel hébreu dans un français moderne et narratif.
- source_word: אִישׁ
  choice: chacun
  rationale: Dans ses deux emplois, אִישׁ a une valeur distributive. « Chacun » la restitue clairement sans alourdir la phrase par « chaque homme ».
- source_word: לְשִׁבְטוֹ
  choice: vers sa tribu
  rationale: « Tribu » est le terme français précis et traditionnel pour cette unité de l’organisation d’Israël.
- source_word: וּלְמִשְׁפַּחְתּוֹ
  choice: et son clan
  rationale: מִשְׁפָּחָה désigne souvent une unité de parenté plus large que la famille immédiate. « Clan » convient particulièrement à la structure sociale évoquée ici.
- source_word: וַיֵּצְאוּ
  choice: ils partirent
  rationale: Le verbe יצא signifie littéralement « sortir ». Dans ce contexte de dispersion après l’assemblée, « partirent » est plus idiomatique en français tout en conservant le mouvement de départ.
- source_word: לְנַחֲלָתוֹ
  choice: vers le territoire reçu en héritage
  rationale: נַחֲלָה désigne ici la possession territoriale héréditaire attribuée à chacun. Cette formulation explicite le sens foncier sans effacer la notion d’héritage.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La répétition de « de là », présente dans l’hébreu, est conservée. « Les Israélites » est préféré au calque « les fils d’Israël » pour une lecture naturelle, tandis que « chacun » maintient la valeur distributive de אִישׁ.
