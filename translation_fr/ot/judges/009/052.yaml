  text: Abimelech came up to the tower and fought against it, and he came near to the entrance of the tower to burn it with fire.
translation:
  language: fr
  text: Abimélek s’avança jusqu’à la tour et l’attaqua. Il s’approcha de l’entrée de la tour pour y mettre le feu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... עַד
  choice: s’avança jusqu’à
  rationale: Exprime naturellement le mouvement d’Abimélek jusqu’à la tour sans imposer une montée que le verbe hébreu ne précise pas explicitement.
- source_word: וַיִּלָּחֶם בּוֹ
  choice: l’attaqua
  rationale: Dans ce contexte militaire, rend idiomatiquement l’idée de combattre contre la tour, prise comme position fortifiée.
- source_word: לְשָׂרְפוֹ בָאֵשׁ
  choice: pour y mettre le feu
  rationale: Formulation française naturelle qui conserve le but d’incendier la tour; la mention hébraïque du feu est intégrée sans redondance maladroite.
