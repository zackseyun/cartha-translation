  text: Then Abimelech went to Thebez[a], camped against Thebez, and captured it.
translation:
  language: fr
  text: Puis Abimélec se rendit à Tébets, campa contre Tébets[a] et s’en empara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « campa à Tébets ». La préposition hébraïque peut être rendue plus littéralement ainsi ; dans ce contexte militaire, « campa contre Tébets » exprime vraisemblablement la position d’un assiégeant.'
    reason: alternative lexical rendering of the Hebrew preposition בְּ with חנה
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: se rendit
  rationale: Dans cette séquence narrative, הלך indique simplement le déplacement. « Se rendit » est naturel en français et n’ajoute pas la nuance militaire explicite de « marcha ».
- source_word: אֲבִימֶלֶךְ
  choice: Abimélek
  rationale: Transcription française usuelle du nom propre hébreu.
- source_word: אֶל תֵּבֵץ
  choice: à Tébets
  rationale: אֶל marque ici le mouvement en direction de la ville. La préposition « à » rend naturellement cette destination sans anticiper l’hostilité exprimée par le contexte.
- source_word: תֵּבֵץ
  choice: Tébets
  rationale: Transcription française courante du nom de lieu, avec accents facilitant une prononciation proche de l’hébreu.
- source_word: וַיִּחַן בְּתֵבֵץ
  choice: campa contre la ville
  rationale: חנה signifie camper. Avec בְּ devant une ville dans ce contexte militaire, « camper contre » exprime naturellement la position d’un assiégeant. « La ville » évite une répétition lourde tout en gardant Tébets comme référent clair.
- source_word: וַיִּלְכְּדָהּ
  choice: s’en empara
  rationale: לכד désigne la prise d’une ville. « S’en empara » est une tournure française claire et idiomatique; le pronom reprend Tébets envisagée comme ville.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation conserve la progression concise du récit hébreu. Aucune note n’est nécessaire dans le texte français, car « campa contre la ville » rend directement le sens militaire probable de בְּ sans créer d’ambiguïté artificielle.
