  text: Then the trees said to the fig tree, ‘You come, reign over us.’
translation:
  language: fr
  text: 'Alors les arbres dirent au figuier : « Viens, toi, règne sur nous ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Alors ... dirent
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement cette succession, et « dirent » rend le sens ordinaire de אמר.
- source_word: הָעֵצִים
  choice: les arbres
  rationale: Dans le contexte de cette fable, le pluriel עֵצִים désigne clairement les arbres personnifiés qui parlent.
- source_word: לַתְּאֵנָה
  choice: au figuier
  rationale: תְּאֵנָה désigne ici l'arbre, non son fruit, et la préposition ל introduit le destinataire des paroles.
- source_word: לְכִי אַתְּ
  choice: Viens, toi
  rationale: L'impératif féminin singulier suivi du pronom indépendant אַתְּ met nettement en relief la destinataire. « Viens, toi » conserve cette insistance sans alourdir excessivement le français.
- source_word: מָלְכִי
  choice: règne
  rationale: L'impératif féminin singulier du verbe מלך exprime l'exercice de la royauté. « Règne » en garde la force verbale et convient à l'image des arbres cherchant un souverain.
- source_word: עָלֵינוּ
  choice: sur nous
  rationale: Avec מלך, la préposition על indique les personnes soumises au règne; « sur nous » est l'expression française naturelle.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. L'adresse « Viens, toi » préserve l'insistance du pronom hébreu explicite; l'impératif « règne » maintient la personnification du figuier et le parallélisme de la fable.
