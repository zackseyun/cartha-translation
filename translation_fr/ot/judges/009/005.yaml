source:
  edition: WLC
  text: וַ/יָּבֹ֤א בֵית אָבִי/ו֙ עָפְרָ֔תָ/ה וַֽ/יַּהֲרֹ֞ג אֶת אֶחָ֧י/ו בְּנֵֽי יְרֻבַּ֛עַל שִׁבְּעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/יִּוָּתֵ֞ר יוֹתָ֧ם בֶּן יְרֻבַּ֛עַל הַ/קָּטֹ֖ן כִּ֥י נֶחְבָּֽא־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/005.yaml
  text: Then he went to his father’s house at Ophrah and killed his brothers[a], the sons of Jerubbaal—seventy men—on one stone. But Jotham, the youngest son of Jerubbaal, was left[c][b], because he hid himself.
translation:
  language: fr
  text: 'Puis il se rendit à la maison de son père, à Ophra, et tua ses frères, les fils de Jerubbaal : soixante-dix hommes sur une seule pierre[a]. Mais Yotam, le plus jeune fils de Jerubbaal, resta en vie[b], parce qu’il s’était caché.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « sur une seule pierre » peut désigner une pierre unique où les exécutions eurent lieu. Le texte ne précise pas davantage la manière dont elles se déroulèrent.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « resta » ou « fut laissé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא בֵית אָבִיו עָפְרָתָה
  choice: Puis il se rendit à la maison de son père, à Ofra
  rationale: La forme narrative fait progresser le récit et la désinence directive de עָפְרָתָה indique un déplacement vers Ofra. « Se rendit » exprime naturellement ce mouvement, tandis que « maison » conserve ici le sens concret favorisé par le nom de lieu.
- source_word: וַיַּהֲרֹג
  choice: tua
  rationale: Rend le sens courant du verbe sans ajouter explicitement une qualification juridique telle que « assassina ».
- source_word: אֶת אֶחָיו בְּנֵי יְרֻבַּעַל
  choice: ses frères, les fils de Yeroubbaal
  rationale: Conserve l’apposition hébraïque, qui identifie les frères tout en maintenant les deux désignations.
- source_word: שִׁבְעִים אִישׁ
  choice: soixante-dix hommes
  rationale: אִישׁ après le nombre désigne ici des hommes, les fils de Yeroubbaal.
- source_word: עַל אֶבֶן אֶחָת
  choice: sur une même pierre
  rationale: Préserve l’image frappante et l’unicité de la pierre sans préciser au-delà du texte la manière exacte dont elle servit aux mises à mort.
- source_word: וַיִּוָּתֵר
  choice: resta en vie
  rationale: Le niphal indique qu’il resta, ou fut laissé, après le massacre. « Resta en vie » explicite dans un français naturel ce que le contexte implique directement.
- source_word: הַקָּטֹן
  choice: le plus jeune
  rationale: Dans ce contexte familial, le qualificatif désigne naturellement le plus jeune fils.
- source_word: כִּי נֶחְבָּא
  choice: parce qu’il s’était caché
  rationale: La proposition indique la raison de sa survie. Le plus-que-parfait marque naturellement en français que le fait de se cacher a précédé et permis cette survie.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. Les noms propres suivent une translittération française proche de l’hébreu : Ofra, Yeroubbaal et Yotam. La syntaxe reste claire tout en conservant l’image volontairement brutale de la pierre unique.'
