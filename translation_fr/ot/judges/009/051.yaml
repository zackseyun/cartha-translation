base_translation:
  language: en
  yaml_path: translation/ot/judges/009/051.yaml
  text: But there was a strong tower in the middle of the city[a], and all the men and women and all the leaders of the city fled there and shut themselves in[b], and they went up onto the roof of the tower.
translation:
  language: fr
  text: Mais il y avait, au milieu de la ville, une tour fortifiée[a]. Tous les hommes et toutes les femmes, ainsi que tous les notables de la ville[b], s’y enfuirent et s’y enfermèrent, puis ils montèrent sur le toit de la tour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « une tour de force », c’est-à-dire une tour caractérisée par sa force ; ou « une tour forte ». L’expression hébraïque souligne son caractère défensif.
    reason: lexical_alternative
  - marker: b
    text: Ou « tous les principaux personnages de la ville ». L’expression hébraïque signifie littéralement « les maîtres de la ville » et désigne ici ses notables, sans nécessairement inclure tous ses habitants.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: une tour fortifiée
  rationale: L’expression associe « tour » à « force » et souligne la fonction défensive de l’édifice. « Tour fortifiée » est naturel en français et évite qu’une formulation littérale soit comprise comme une métaphore.
- source_word: בְּתוֹךְ הָעִיר
  choice: au milieu de la ville
  rationale: Rend directement le sens spatial de בְּתוֹךְ, « au milieu de, au sein de ».
- source_word: וַיָּנֻסוּ שָׁמָּה
  choice: s’y enfuirent
  rationale: Le verbe נוּס signifie « fuir » ; le pronom adverbial « y » exprime naturellement en français la destination indiquée par שָׁמָּה.
- source_word: כָּל הָאֲנָשִׁים וְהַנָּשִׁים
  choice: Tous les hommes et toutes les femmes
  rationale: La formulation conserve la distinction explicite entre hommes et femmes et la portée de כָּל.
- source_word: וְכֹל בַּעֲלֵי הָעִיר
  choice: ainsi que tous les notables de la ville
  rationale: Dans ce contexte civique, בַּעֲלֵי הָעִיר désigne vraisemblablement les principaux personnages ou responsables de la ville. « Notables » conserve cette nuance sans suggérer nécessairement une fonction officielle précise.
- source_word: וַיִּסְגְּרוּ בַעֲדָם
  choice: s’y enfermèrent
  rationale: Rend idiomatiquement l’idée qu’ils fermèrent derrière eux et se retranchèrent à l’intérieur, sans ajouter un objet tel que « la porte », absent de l’hébreu.
- source_word: וַיַּעֲלוּ עַל גַּג הַמִּגְדָּל
  choice: ils montèrent sur le toit de la tour
  rationale: עָלָה exprime la montée et גַּג désigne précisément le toit, plutôt que le sommet en général.
