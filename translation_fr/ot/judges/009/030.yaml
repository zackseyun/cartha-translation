  text: וַ/יִּשְׁמַ֗ע זְבֻל֙ שַׂר הָ/עִ֔יר אֶת דִּבְרֵ֖י גַּ֣עַל בֶּן עָ֑בֶד וַ/יִּ֖חַר אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/030.yaml
  text: When Zebul[a], the ruler of the city, heard the words of Gaal son of Ebed, his anger burned.
translation:
  language: fr
  text: Quand Zéboul, le chef de la ville, entendit les paroles de Gaal, fils d’Ébed, sa colère s’enflamma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: entendit
  rationale: Le verbe שׁמע exprime ici le fait de prendre connaissance des paroles de Gaal. La construction « Quand… entendit » rend naturellement en français l’enchaînement narratif introduit par le waw consécutif.
- source_word: זְבֻל
  choice: Zéboul
  rationale: Translittération française usuelle du nom hébreu, avec accents facilitant sa prononciation.
- source_word: שַׂר הָעִיר
  choice: le chef de la ville
  rationale: שַׂר désigne un dirigeant ou un haut responsable. « Chef » rend son autorité civique sans lui attribuer une fonction administrative moderne trop précise.
- source_word: אֶת דִּבְרֵי
  choice: les paroles de
  rationale: Cette formulation conserve l’expression concrète דִּבְרֵי tout en restant naturelle et digne en français.
- source_word: גַּעַל בֶּן עָבֶד
  choice: Gaal, fils d’Ébed
  rationale: Les noms sont translittérés et le patronyme hébreu est rendu par la tournure française concise « fils de ».
- source_word: וַיִּחַר אַפּוֹ
  choice: sa colère s’enflamma
  rationale: L’expression hébraïque associe littéralement la brûlure au nez ou à la colère. « Sa colère s’enflamma » conserve l’image et exprime clairement l’accès de colère en français.
