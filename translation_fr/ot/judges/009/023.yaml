  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אֱלֹהִים֙ ר֣וּחַ רָעָ֔ה בֵּ֣ין אֲבִימֶ֔לֶךְ וּ/בֵ֖ין בַּעֲלֵ֣י שְׁכֶ֑ם וַ/יִּבְגְּד֥וּ בַעֲלֵי שְׁכֶ֖ם בַּ/אֲבִימֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/023.yaml
  text: Then God sent an evil spirit between Abimelech and the leaders of Shechem[c][b][a], and the leaders of Shechem dealt treacherously with Abimelech.
translation:
  language: fr
  text: Alors Dieu envoya un esprit mauvais[a] entre Abimélek et les dirigeants de Sichem[b], et les dirigeants de Sichem agirent avec perfidie envers Abimélek[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit nuisible ». L’hébreu peut souligner soit le caractère mauvais, soit l’effet néfaste.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les maîtres de Sichem » ; il s’agit probablement des notables ou des responsables civiques de la ville.
    reason: lexical_alternative
  - marker: c
    text: Ou « trahirent Abimélek » ou « agirent en traîtres contre Abimélek ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le verbe שׁלח, dans cette forme narrative, signifie directement « envoyer ». Ce choix conserve sans l’atténuer l’action attribuée à Dieu.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte narratif, אֱלֹהִים désigne Dieu comme auteur du jugement.
- source_word: רוּחַ רָעָה
  choice: un esprit mauvais
  rationale: Cette expression peut désigner un esprit caractérisé par le mal ou par ses effets nuisibles. « Un esprit mauvais » est direct et naturel, tandis que l’autre nuance est signalée en note.
- source_word: בֵּין ... וּבֵין
  choice: entre ... et
  rationale: La construction corrélative marque ici la division ou l’hostilité suscitée entre les deux parties.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: les dirigeants de Sichem
  rationale: Le terme signifie littéralement « maîtres de Sichem », mais désigne probablement ici les notables ou détenteurs du pouvoir civique de la ville. « Dirigeants » transmet clairement cette fonction en français moderne.
- source_word: וַיִּבְגְּדוּ
  choice: agirent avec perfidie
  rationale: Le verbe בגד exprime une conduite déloyale ou traîtresse. Cette formulation conserve sa portée morale sans la réduire au seul acte ponctuel de trahir.
- source_word: בַּאֲבִימֶלֶךְ
  choice: envers Abimélek
  rationale: Avec בגד, la préposition ב introduit la personne lésée par cette conduite perfide. « Envers » est idiomatique en français avec la formulation retenue.
theological_decisions:
- issue: L’action divine dans l’envoi de l’esprit mauvais
  choice: « Dieu envoya un esprit mauvais »
  alternative: « Dieu permit qu’un esprit mauvais intervienne » ou « Dieu laissa venir un esprit de discorde »
  rationale: Le verbe et la syntaxe hébraïques attribuent explicitement l’envoi à Dieu. La traduction conserve cette tension théologique et n’en fait pas une simple permission, ce qui ajouterait une interprétation absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste proche de la structure hébraïque tout en employant des termes immédiatement compréhensibles. Le nom propre est rendu « Abimélek », et « Sichem » suit l’usage biblique français courant.
