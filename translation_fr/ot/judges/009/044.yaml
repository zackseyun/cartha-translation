base_translation:
  language: en
  yaml_path: translation/ot/judges/009/044.yaml
  text: And Abimelech and the leaders who were with him rushed forward and took their stand at the entrance of the city gate[a], while the two other companies rushed against everyone who was in the field and struck them down.
translation:
  language: fr
  text: Abimélek et les chefs qui étaient avec lui s’élancèrent et prirent position à l’entrée de la porte de la ville, tandis que les deux autres corps de troupe[a] s’élancèrent contre tous ceux qui étaient dans les champs et les frappèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu, littéralement : « les deux chefs ». D’après le contexte, il s’agit probablement des deux autres corps de troupe parmi les trois mentionnés au verset précédent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשְׁטוּ
  choice: s’élancèrent
  rationale: Dans ce contexte militaire, le verbe exprime un mouvement offensif rapide. « S’élancèrent » convient aux deux actions coordonnées sans se limiter au sens littéral de « se répandre ».
- source_word: הָרָאשִׁים
  choice: les chefs
  rationale: Le terme signifie littéralement « les têtes » et désigne ici des responsables militaires. « Chefs » est direct, naturel et conserve cette valeur personnelle.
- source_word: וַיַּעַמְדוּ
  choice: prirent position
  rationale: Le verbe signifie « se tenir, se placer » ; dans la scène tactique, « prirent position » rend le placement délibéré sans ajouter l’idée d’un combat défensif.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: à l’entrée de la porte de la ville
  rationale: Cette formulation garde les deux éléments concrets du syntagme hébreu, l’ouverture ou l’entrée et la porte de la ville.
- source_word: וּשְׁנֵי הָרָאשִׁים
  choice: les deux autres corps de troupe
  rationale: Le texte massorétique dit littéralement « les deux chefs », mais le verset précédent présente trois corps de troupe. La traduction contextuelle désigne donc les deux unités restantes, tout en signalant le littéral en note.
- source_word: עַל כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: contre tous ceux qui étaient dans les champs
  rationale: Le pronom suffixe pluriel du verbe suivant indique des personnes. Le pluriel français « les champs » rend naturellement l’espace cultivé ou découvert visé par le singulier collectif hébreu.
- source_word: וַיַּכּוּם
  choice: les frappèrent
  rationale: נכה peut signifier frapper, abattre ou tuer. « Les frappèrent » préserve ici l’étendue sémantique du verbe sans affirmer explicitement que chacun fut tué.
theological_decisions: []
