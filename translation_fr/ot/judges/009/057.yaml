  text: וְ/אֵ֗ת כָּל רָעַת֙ אַנְשֵׁ֣י שְׁכֶ֔ם הֵשִׁ֥יב אֱלֹהִ֖ים בְּ/רֹאשָׁ֑/ם וַ/תָּבֹ֣א אֲלֵי/הֶ֔ם קִֽלֲלַ֖ת יוֹתָ֥ם בֶּן יְרֻבָּֽעַל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/057.yaml
  text: And God repaid all the evil of the men of Shechem on their own heads, and the curse of Jotham son of Jerubbaal came upon them.
translation:
  language: fr
  text: Dieu fit retomber sur la tête des hommes de Sichem tout le mal qu’ils avaient commis, et la malédiction de Yotam, fils de Yeroubbaal, vint sur eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵשִׁיב
  choice: fit retomber
  rationale: 'Le hiphil de שוב, avec le mal pour objet et « sur leur tête » comme complément, exprime ici la rétribution : Dieu fait revenir sur les auteurs le mal qu’ils ont commis. « Fit retomber » conserve ce mouvement et son caractère judiciaire.'
- source_word: רָעַת
  choice: le mal qu’ils avaient commis
  rationale: רעה désigne ici le mal moral imputable aux hommes de Sichem. L’ajout explicatif « qu’ils avaient commis » rend naturellement en français la logique de rétribution sans réduire le terme à un simple malheur subi.
- source_word: בְּרֹאשָׁם
  choice: sur la tête des hommes de Sichem
  rationale: Cette image hébraïque signifie que les conséquences reviennent sur les coupables eux-mêmes. La répétition du groupe nominal évite une succession de pronoms ambiguë et préserve l’image de la tête.
- source_word: קִלֲלַת
  choice: la malédiction
  rationale: Le nom renvoie aux paroles de malédiction prononcées auparavant par Yotam. « Malédiction » est le terme français direct et naturel.
- source_word: וַתָּבֹא אֲלֵיהֶם
  choice: s’accomplit contre eux
  rationale: L’expression indique que la malédiction atteignit ses destinataires et prit effet. « S’accomplit contre eux » rend clairement cette réalisation en français actuel, tout en conservant l’orientation hostile marquée par אֲלֵיהֶם dans ce contexte.
- source_word: אַנְשֵׁי שְׁכֶם
  choice: les hommes de Sichem
  rationale: La formulation suit précisément le masculin pluriel hébreu et l’identification narrative du groupe.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom désigne ici le Dieu d’Israël, présenté comme l’auteur singulier du jugement.
- source_word: יוֹתָם בֶּן יְרֻבָּעַל
  choice: Yotam, fils de Yeroubbaal
  rationale: Les noms sont translittérés sous une forme adaptée au français moderne, et la filiation est conservée directement.
theological_decisions:
- issue: Action divine dans la rétribution
  choice: Dieu fit activement retomber leur mal sur eux
  alternative: Dieu permit que leur mal retombe sur eux
  rationale: Dieu est explicitement le sujet grammatical de הֵשִׁיב. La traduction conserve donc son action directe dans le jugement au lieu de l’atténuer en simple permission.
- issue: Réalisation de la malédiction de Yotam
  choice: la malédiction s’accomplit contre eux
  alternative: la malédiction vint sur eux
  rationale: Le contexte montre que les paroles de Yotam prennent effet dans les événements. La formulation choisie exprime cette réalisation sans préciser davantage le mécanisme théologique.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en préservant l’image hébraïque de la faute qui retombe sur la tête de ses auteurs et l’agence divine explicite.
