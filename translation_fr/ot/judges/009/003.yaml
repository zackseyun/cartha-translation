base_translation:
  language: en
  yaml_path: translation/ot/judges/009/003.yaml
  text: And his mother’s brothers spoke all these words about him in the hearing of all the leaders of Shechem[a], and their hearts turned after Abimelech, for they said[b], “He is our brother.”
translation:
  language: fr
  text: 'Les frères de sa mère dirent toutes ces paroles à son sujet devant tous les dirigeants de Sichem[a]. Leur cœur se tourna vers Abimélek, car ils disaient : « Il est notre frère. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les maîtres de Sichem » ou « tous les notables de Sichem ». L’expression hébraïque désigne les hommes influents de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: rapportèrent
  rationale: Le piel de דבר avec « toutes ces paroles » décrit ici la transmission aux notables de la proposition formulée au verset précédent. « Rapportèrent » rend naturellement cette action en français.
- source_word: אֲחֵי אִמּוֹ
  choice: les frères de sa mère
  rationale: La construction désigne précisément les frères masculins de la mère d’Abimélek; cette formulation est claire et exacte.
- source_word: עָלָיו
  choice: à son sujet
  rationale: Cette expression conserve le sens de discours concernant Abimélek sans imposer la nuance plus interprétative « en sa faveur ».
- source_word: בְּאָזְנֵי
  choice: aux oreilles de
  rationale: La formulation préserve l’image idiomatique hébraïque tout en restant intelligible et digne en français.
- source_word: כָּל בַּעֲלֵי שְׁכֶם
  choice: tous les dirigeants de Sichem
  rationale: Dans ce contexte politique, בעלי désigne vraisemblablement les hommes influents ou détenteurs de l’autorité dans la ville, et non l’ensemble des habitants.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: דברים peut signifier « paroles », « choses » ou « affaires »; ici, l’expression renvoie à la proposition verbale du verset précédent.
- source_word: וַיֵּט לִבָּם
  choice: Le cœur de ceux-ci se tourna
  rationale: Le texte hébreu emploie « leur cœur » au singulier collectif. Le conserver respecte l’image de leur disposition commune sans introduire de sujet causatif absent.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: vers Abimélek
  rationale: En français, « se tourner vers » exprime naturellement l’adhésion et l’allégeance indiquées par l’hébreu, tout en conservant sa métaphore directionnelle.
- source_word: כִּי אָמְרוּ
  choice: car ils se disaient
  rationale: כי introduit le motif de leur ralliement. L’imparfait « se disaient » rend naturellement la motivation collective qui sous-tend leur décision.
- source_word: אָחִינוּ הוּא
  choice: Il est notre frère
  rationale: La traduction directe préserve l’appel rhétorique à la solidarité familiale avec Abimélek par sa mère originaire de Sichem.
