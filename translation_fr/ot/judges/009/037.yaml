base_translation:
  language: en
  yaml_path: translation/ot/judges/009/037.yaml
  text: Gaal spoke again and said[a], “Look, people are coming down from the center of the land[b], and one company is coming by the way of the Oak of the Soothsayers.”
translation:
  language: fr
  text: 'Gaal reprit la parole et dit : « Voici, des gens descendent du centre du pays[a], et un groupe arrive par le chemin du Chêne des Devins[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du nombril du pays », image désignant sa partie centrale.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « du Térébinthe des Devins » ; peut-être aussi un nom de lieu : « du Chêne de Meonenim ». Le sens exact du dernier terme est incertain.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד גַּעַל לְדַבֵּר
  choice: Gaal reprit la parole
  rationale: La construction idiomatique « ajouter encore à parler » indique que Gaal parle de nouveau. « Reprit la parole » est naturel en français et conserve cette valeur narrative.
- source_word: הִנֵּה
  choice: Regardez !
  rationale: Cette particule attire vivement l’attention sur ce que Gaal aperçoit. L’impératif pluriel convient puisqu’il s’adresse aux personnes présentes.
- source_word: עָם
  choice: des gens
  rationale: Le nom désigne ici des personnes aperçues à distance. « Des gens » reste général et n’explicite pas indûment qu’il s’agit de soldats.
- source_word: יֹרְדִים
  choice: descendent
  rationale: Le participe décrit une action en cours, visible depuis le point d’observation de Gaal.
- source_word: מֵעִם טַבּוּר הָאָרֶץ
  choice: du centre du pays
  rationale: טַבּוּר signifie littéralement « nombril », mais désigne métaphoriquement la partie centrale d’un territoire. « Pays » rend ici naturellement הָאָרֶץ dans ce contexte géographique.
- source_word: וְרֹאשׁ אֶחָד
  choice: et un groupe
  rationale: רֹאשׁ signifie littéralement « tête », mais désigne ici une section ou un groupe distinct de la force en mouvement. « Groupe » préserve cette idée sans imposer une organisation militaire précise.
- source_word: בָּא
  choice: arrive
  rationale: Le contexte présente le groupe en train d’approcher. Le présent français exprime naturellement cette observation immédiate.
- source_word: מִדֶּרֶךְ
  choice: par le chemin de
  rationale: La préposition et le nom indiquent la voie ou l’itinéraire emprunté.
- source_word: אֵלוֹן מְעוֹנְנִים
  choice: Chêne des Devins
  rationale: אֵלוֹן désigne un grand arbre, souvent un chêne ou un térébinthe. מְעוֹנְנִים paraît lié à la divination, tout en pouvant fonctionner comme élément d’un nom de lieu. La majuscule signale ici un toponyme.
