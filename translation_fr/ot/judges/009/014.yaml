  text: וַ/יֹּאמְר֥וּ כָל הָ/עֵצִ֖ים אֶל הָ/אָטָ֑ד לֵ֥ךְ אַתָּ֖ה מְלָךְ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/014.yaml
  text: Then all the trees said to the bramble[a], ‘You come, reign over us.’
translation:
  language: fr
  text: 'Alors tous les arbres dirent au buisson épineux[a] : « Viens, toi, règne sur nous ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « buisson d’épines ». Le mot hébreu אָטָד désigne un arbuste épineux dont l’espèce précise demeure incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Alors … dirent
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: כָל הָעֵצִים
  choice: tous les arbres
  rationale: Traduction directe du sujet collectif défini.
- source_word: אֶל הָאָטָד
  choice: au buisson épineux
  rationale: אָטָד désigne un arbuste épineux sans permettre d’identifier sûrement une espèce précise ; cette formulation naturelle évite une précision botanique injustifiée.
- source_word: לֵךְ אַתָּה
  choice: Viens, toi
  rationale: Devant un autre impératif, לֵךְ fonctionne ici comme une invitation pressante à agir. « Viens » convient au dialogue, tandis que « toi » conserve l’emphase du pronom אַתָּה.
- source_word: מְלָךְ עָלֵינוּ
  choice: règne sur nous
  rationale: Le verbe מָלַךְ exprime l’exercice de la royauté ; « régner sur » en préserve clairement la nuance royale.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le tour « Viens, toi » conserve l’appel emphatique de l’hébreu, et « buisson épineux » reste intelligible sans surdéterminer l’identification botanique.
