  text: וַ/יָּ֧שַׂר אֲבִימֶ֛לֶךְ עַל יִשְׂרָאֵ֖ל שָׁלֹ֥שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/022.yaml
  text: Abimelech ruled over Israel for three years.
translation:
  language: fr
  text: Abimélek régna sur Israël pendant trois ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשַׂר
  choice: régna
  rationale: Le verbe שׂרר exprime ici l’exercice de l’autorité ou de la domination. « Régna » est naturel en français dans ce récit politique, sans conférer nécessairement à Abimélek une légitimité royale que le texte ne précise pas.
- source_word: אֲבִימֶלֶךְ
  choice: Abimélek
  rationale: Transcription française courante du nom hébreu, avec accent pour guider la prononciation.
- source_word: עַל
  choice: sur
  rationale: Avec un verbe d’autorité, עַל désigne ceux sur qui cette autorité s’exerce; « sur Israël » conserve directement cette relation.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française traditionnelle et actuelle du nom national.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: pendant trois ans
  rationale: Cette formulation française idiomatique exprime clairement la durée indiquée par l’hébreu.
theological_decisions:
- issue: Nature et légitimité du pouvoir d’Abimélek
  choice: « régna sur » décrit l’exercice effectif du pouvoir
  alternative: « gouverna » ou « exerça sa domination sur »
  rationale: Le texte affirme qu’Abimélek exerça l’autorité, sans qualifier explicitement ce pouvoir de légitime. « Régna » rend le sens politique du verbe, tandis que le contexte narratif demeure libre d’en donner l’évaluation.
translation_notes:
  register: Phrase brève, naturelle et digne, conforme à la concision de l’hébreu. Le passé simple convient au registre narratif biblique moderne sans être archaïque.
