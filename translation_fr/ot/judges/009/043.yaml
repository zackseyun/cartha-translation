source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת הָ/עָ֗ם וַֽ/יֶּחֱצֵ/ם֙ לִ/שְׁלֹשָׁ֣ה רָאשִׁ֔ים וַ/יֶּאֱרֹ֖ב בַּ/שָּׂדֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הָ/עָם֙ יֹצֵ֣א מִן הָ/עִ֔יר וַ/יָּ֥קָם עֲלֵי/הֶ֖ם וַ/יַּכֵּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/043.yaml
  text: He took the people[a], divided them into three companies, and lay in wait in the field. When he saw that the people were coming out of the city, he rose up against them and struck them down.
translation:
  language: fr
  text: Il prit ses hommes, les répartit en trois groupes[a] et se mit en embuscade dans la campagne. Quand il vit les gens sortir de la ville, il se dressa contre eux et les frappa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « en trois têtes », expression hébraïque désignant trois corps ou détachements.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח אֶת־הָעָם
  choice: Il prit ses hommes
  rationale: עָם signifie littéralement « peuple », mais désigne ici, dans le cadre militaire, les hommes placés sous le commandement d’Abimélek. « Ses hommes » rend naturellement le référent en français sans en faire formellement une armée.
- source_word: וַיֶּחֱצֵם לִשְׁלֹשָׁה רָאשִׁים
  choice: les répartit en trois groupes
  rationale: חצה exprime l’action de diviser ou répartir, tandis que רָאשִׁים, littéralement « têtes », désigne idiomatiquement des corps ou groupes distincts.
- source_word: וַיֶּאֱרֹב בַּשָּׂדֶה
  choice: et se mit en embuscade dans la campagne
  rationale: ארב désigne le fait de guetter en embuscade. בַּשָּׂדֶה peut désigner le terrain découvert ou la campagne entourant la ville ; « dans la campagne » est ici naturel et évite l’image trop étroite d’un champ cultivé.
- source_word: וַיַּרְא וְהִנֵּה
  choice: Quand il vit
  rationale: La construction narrative suivie de הִנֵּה introduit vivement ce qu’Abimélek aperçoit. « Quand il vit » restitue clairement la relation temporelle sans le calque lourd « voici ».
- source_word: הָעָם יֹצֵא מִן־הָעִיר
  choice: les gens sortir de la ville
  rationale: Le participe יֹצֵא présente l’action en cours au moment où elle est aperçue. Après « vit », l’infinitif français exprime naturellement cette perception directe. « Les gens » distingue les habitants qui sortent de la ville des hommes d’Abimélek.
- source_word: וַיָּקָם עֲלֵיהֶם
  choice: il se dressa contre eux
  rationale: קום על signifie littéralement se lever ou se dresser contre quelqu’un et, dans ce contexte, implique l’attaque. La formulation conserve l’image hébraïque sans réduire l’expression à une simple paraphrase.
- source_word: וַיַּכֵּם
  choice: et les frappa
  rationale: נכה couvre l’idée de frapper, abattre ou mettre en déroute. « Les frappa » préserve l’étendue lexicale du verbe sans affirmer que chacun fut tué.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le texte distingue naturellement les hommes d’Abimélek (« ses hommes ») des habitants de la ville (« les gens »), tout en conservant l’image de se dresser contre eux et sans surinterpréter נכה comme une mise à mort explicite.
