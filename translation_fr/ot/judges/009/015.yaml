    rationale: משׁח signifie « oindre ». « Consacrer » interprète plus largement l’acte et perd une donnée lexicale importante du texte. « Oindre » demeure intelligible dans ce registre littéraire et biblique.
  - severity: low
    issue: « De bonne foi » est légèrement trop marqué par l’usage juridique moderne.
    rationale: L’hébreu באמת exprime ici la sincérité ou le caractère véritable de l’acte. « En toute sincérité » restitue plus directement cette nuance.
