base_translation:
  language: en
  yaml_path: translation/ot/judges/009/015.yaml
  text: Then the bramble said to the trees[a], ‘If you are truly anointing me as king over you, come, take refuge in my shade; but if not[c][b], let fire come out from the bramble and consume the cedars of Lebanon.’
translation:
  language: fr
  text: 'Alors le buisson épineux dit aux arbres[a] : « Si c’est en toute sincérité que vous m’oignez pour être roi sur vous, venez vous réfugier à mon ombre[b]. Sinon, qu’un feu sorte du buisson épineux[c] et dévore les cèdres du Liban ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le buisson d’épines ». Le mot hébreu désigne un arbuste épineux, sans permettre une identification botanique certaine.
    reason: lexical_alternative
  - marker: b
    text: L’invitation peut avoir une portée ironique, car un buisson épineux offre peu d’ombre et de protection véritables.
    reason: literary_clarification
  - marker: c
    text: 'On peut aussi traduire : « un feu sortira du buisson épineux ». La forme hébraïque peut exprimer soit un souhait menaçant, soit une prédiction.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הָאָטָד
  choice: le buisson épineux
  rationale: Le nom hébreu désigne un arbuste épineux. « Buisson épineux » est clair en français moderne et maintient le contraste de la fable avec les arbres majestueux, sans imposer une identification botanique incertaine.
- source_word: אִם בֶּאֱמֶת
  choice: Si c’est vraiment de bonne foi
  rationale: L’expression porte sur la réalité et la sincérité de l’acte. Cette formulation française rend naturellement la mise à l’épreuve implicite.
- source_word: מֹשְׁחִים אֹתִי לְמֶלֶךְ
  choice: vous me consacrez comme roi
  rationale: Le verbe hébreu signifie littéralement « oindre ». Dans ce contexte royal, « consacrer comme roi » conserve l’idée d’une investiture par onction tout en restant immédiatement compréhensible.
- source_word: עֲלֵיכֶם
  choice: sur vous
  rationale: Dans le contexte de la royauté, la préposition exprime l’autorité exercée sur des sujets.
- source_word: בֹּאוּ חֲסוּ בְצִלִּי
  choice: venez vous réfugier à mon ombre
  rationale: Le verbe חָסָה exprime la recherche d’un refuge ou d’une protection. « À mon ombre » est idiomatique en français et préserve l’ironie d’un buisson qui offre peu d’ombre.
- source_word: וְאִם אַיִן
  choice: Sinon
  rationale: Cette tournure concise restitue clairement l’issue contraire à la condition précédente.
- source_word: תֵּצֵא אֵשׁ מִן הָאָטָד
  choice: qu’un feu sorte du buisson épineux
  rationale: La forme verbale peut avoir ici une valeur volitive ou imprécatoire. « Qu’un feu sorte » maintient cette force sans la réduire à une simple prédiction.
- source_word: וְתֹאכַל
  choice: et dévore
  rationale: Avec le feu pour sujet, le verbe « manger » décrit une destruction complète. « Dévorer » conserve l’image vive de l’hébreu et convient au registre narratif.
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: les cèdres du Liban
  rationale: Cette expression traditionnelle et naturelle en français évoque les arbres majestueux renommés du Liban.
theological_decisions:
- issue: Valeur modale de תֵּצֵא dans la menace finale
  choice: 'Valeur volitive ou imprécatoire : « qu’un feu sorte »'
  alternative: 'Valeur prédictive : « un feu sortira »'
  rationale: La morphologie et le contexte de malédiction permettent les deux lectures. Le texte principal retient la valeur volitive, tandis qu’une note conserve explicitement l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe directe conserve le ton de la fable et sa menace finale. « Consacrer comme roi » évite l’expression moins naturelle « oindre comme roi » dans le corps du texte tout en préservant le sens politique et rituel du verbe hébreu.
