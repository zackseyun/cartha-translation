  text: וְ/עַתָּ֗ה אִם בֶּ/אֱמֶ֤ת וּ/בְ/תָמִים֙ עֲשִׂיתֶ֔ם וַ/תַּמְלִ֖יכוּ אֶת אֲבִימֶ֑לֶךְ וְ/אִם טוֹבָ֤ה עֲשִׂיתֶם֙ עִם יְרֻבַּ֣עַל וְ/עִם בֵּית֔/וֹ וְ/אִם כִּ/גְמ֥וּל יָדָ֖י/ו עֲשִׂ֥יתֶם לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/016.yaml
  text: Now therefore[a], if you have acted in truth and integrity when you made Abimelech king, and if you have dealt well with Jerubbaal and with his house, and if you have dealt with him according to the recompense of his hands,
translation:
  language: fr
  text: Maintenant donc, si c’est avec loyauté et intégrité que vous avez agi en faisant d’Abimélek roi, si vous avez bien agi envers Yeroubbaal et sa maison, et si vous l’avez traité selon ce que ses actes méritaient[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon la rétribution de ses mains ». Cette expression hébraïque désigne ce que les actes d’une personne lui ont acquis ou mérité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Cette formule marque à la fois la transition du discours et la conséquence que Yotam tire de sa fable.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: avec vérité et intégrité
  rationale: 'Les deux termes évaluent moralement la conduite des Sichémites : אֱמֶת évoque la vérité et la loyauté, tandis que תָמִים exprime une conduite entière, intègre.'
- source_word: וַתַּמְלִיכוּ אֶת אֲבִימֶלֶךְ
  choice: en faisant d’Abimélek votre roi
  rationale: Le hifil de מלך signifie « faire régner, établir comme roi ». Le possessif « votre » rend naturelle en français l’idée de l’avoir établi roi sur eux sans ajouter une distinction théologique.
- source_word: טוֹבָה עֲשִׂיתֶם עִם
  choice: vous avez bien agi envers
  rationale: Cette formulation française rend naturellement l’expression hébraïque « faire du bien avec/envers » tout en gardant l’évaluation morale de l’acte.
- source_word: יְרֻבַּעַל
  choice: Yeroubbaal
  rationale: Le texte emploie ici le nom Yeroubbaal, et non Gédéon ; sa forme est translittérée selon l’usage français.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: « Maison » conserve l’étendue familiale et dynastique possible du terme hébreu, plutôt que de le réduire au seul foyer domestique.
- source_word: כִּגְמוּל יָדָיו עֲשִׂיתֶם לוֹ
  choice: vous l’avez traité selon ce que ses actes méritaient
  rationale: L’expression désigne un traitement correspondant à ce que les actions de Yeroubbaal avaient acquis ou mérité. La formulation principale en explicite le sens, tandis que la note conserve l’image concrète des mains.
theological_decisions: []
translation_notes:
  register: 'Français international actuel, soutenu mais accessible. La série des propositions conditionnelles reste ouverte par une virgule finale, puisque la phrase et l’argument de Yotam se poursuivent au verset suivant. Les noms propres suivent des formes françaises transparentes : Abimélek et Yeroubbaal.'
