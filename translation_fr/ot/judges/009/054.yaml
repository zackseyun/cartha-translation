base_translation:
  language: en
  yaml_path: translation/ot/judges/009/054.yaml
  text: Then he quickly called to the young man who carried his weapons and said to him[a], “Draw your sword and kill me, lest they say of me, ‘A woman killed him.’” So his young man pierced him through, and he died.
translation:
  language: fr
  text: 'Alors il appela rapidement le jeune homme qui portait ses armes et lui dit[a] : « Tire ton épée et tue-moi, de peur qu’on ne dise de moi : “Une femme l’a tué.” » Le jeune homme le transperça, et il mourut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « son écuyer », pour « le jeune homme qui portait ses armes » et « le jeune homme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מְהֵרָה
  choice: Alors il appela vite
  rationale: Le wayyiqtol fait progresser le récit, tandis que מְהֵרָה exprime l’urgence. « Alors » et « vite » donnent une narration française naturelle sans ajouter d’idée.
- source_word: הַנַּעַר נֹשֵׂא כֵלָיו
  choice: le jeune homme qui portait ses armes
  rationale: Cette formulation conserve le sens lexical de נַעַר et rend explicitement la fonction décrite par נֹשֵׂא כֵלָיו, sans substituer d’emblée le titre interprétatif « écuyer ».
- source_word: שְׁלֹף חַרְבְּךָ
  choice: Tire ton épée
  rationale: שׁלף désigne le geste de tirer l’épée, implicitement hors de son fourreau. L’expression est concise et naturelle en français.
- source_word: וּמוֹתְתֵנִי
  choice: et donne-moi la mort
  rationale: La forme exprime ici le fait de causer la mort du locuteur. « Donne-moi la mort » reste direct tout en convenant au registre narratif digne.
- source_word: פֶּן יֹאמְרוּ לִי
  choice: de peur qu’on ne dise à mon sujet
  rationale: 'פֶּן introduit une conséquence redoutée. Le לִי est contextuellement relationnel : il s’agit de ce que les gens diront au sujet d’Abimélek, non de paroles qui lui seraient adressées.'
- source_word: אִשָּׁה הֲרָגָתְהוּ
  choice: C’est une femme qui l’a tué
  rationale: La tournure clivée française met « une femme » en relief, comme l’ordre hébreu, et préserve l’enjeu d’honneur attaché à cette déclaration.
- source_word: וַיִּדְקְרֵהוּ
  choice: le transperça
  rationale: Le verbe דקר évoque un coup pénétrant porté avec une arme. « Transperça » en conserve la précision violente sans ajouter « de part en part », absent du texte.
- source_word: נַעֲרוֹ
  choice: Son jeune homme
  rationale: La répétition maintient la correspondance avec הַנַּעַר plus haut. Une note fournit l’équivalent fonctionnel français plus idiomatique.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. La traduction privilégie une équivalence optimale : elle garde la désignation littérale « jeune homme » dans le texte, tout en donnant « écuyer » en note comme équivalent fonctionnel. La parole directe conserve la mise en relief de la femme dans l’hébreu.'
