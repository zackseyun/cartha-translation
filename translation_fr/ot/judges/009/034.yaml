  text: וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר עִמּ֖/וֹ לָ֑יְלָה וַ/יֶּאֶרְב֣וּ עַל שְׁכֶ֔ם אַרְבָּעָ֖ה רָאשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/034.yaml
  text: So Abimelech and all the people who were with him got up by night[a], and they lay in ambush against Shechem in four companies.
translation:
  language: fr
  text: Abimélek se leva pendant la nuit avec tout le peuple qui était avec lui, et ils se mirent en embuscade contre Sichem, en quatre groupes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quatre têtes », expression qui désigne quatre groupes ou divisions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le verbe קום décrit ici le fait de se lever pour passer à l’action; « se leva » reste concret et naturel sans préciser à tort qu’il partit aussitôt.
- source_word: לָיְלָה
  choice: pendant la nuit
  rationale: L’accusatif adverbial situe l’action de nuit; cette formulation française est claire sans suggérer nécessairement qu’elle dura toute la nuit.
- source_word: וַיֶּאֶרְבוּ
  choice: ils se mirent en embuscade
  rationale: Le verbe ארב exprime l’action de guetter secrètement en vue d’une attaque; la tournure rend naturellement l’entrée en position d’embuscade.
- source_word: עַל שְׁכֶם
  choice: contre Sichem
  rationale: Avec le verbe d’embuscade, עַל désigne ici vraisemblablement la cible hostile plutôt qu’un simple emplacement à proximité.
- source_word: אַרְבָּעָה רָאשִׁים
  choice: en quatre groupes
  rationale: Littéralement « quatre têtes », l’expression désigne quatre unités distinctes. « Groupes » est clair, courant et évite d’imposer une organisation militaire trop précise.
- source_word: הָעָם אֲשֶׁר עִמּוֹ
  choice: tout le peuple qui était avec lui
  rationale: Cette formulation conserve la portée générale de עָם sans le préciser en « hommes » ou « troupes », même si le contexte est militaire.
