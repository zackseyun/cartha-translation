  text: וַ/יֵּ֨לֶךְ אֲבִימֶ֤לֶךְ בֶּן יְרֻבַּ֨עַל֙ שְׁכֶ֔מָ/ה אֶל אֲחֵ֖י אִמּ֑/וֹ וַ/יְדַבֵּ֣ר אֲלֵי/הֶ֔ם וְ/אֶל כָּל מִשְׁפַּ֛חַת בֵּית אֲבִ֥י אִמּ֖/וֹ לֵ/אמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/001.yaml
  text: Abimelech son of Jerubbaal went to Shechem[a], to his mother's brothers, and spoke to them and to the whole clan of his mother's father's house, saying,
translation:
  language: fr
  text: 'Abimélek, fils de Yeroubbaal, se rendit à Sichem auprès des frères de sa mère. Il leur parla, ainsi qu’à tout le clan de la maison du père de sa mère[a], en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la maison du père de sa mère ». La « maison » désigne ici la maisonnée ou la lignée familiale du côté maternel.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: se rendit
  rationale: Le verbe הלך exprime ici le déplacement d’Abimélek vers Sichem. Le passé simple convient à la progression narrative, sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: אֲבִימֶלֶךְ
  choice: Abimélek
  rationale: Translittération française moderne du nom propre hébreu.
- source_word: בֶּן יְרֻבַּעַל
  choice: fils de Yeroubbaal
  rationale: Rend directement la relation filiale et translittère le nom propre selon l’usage français.
- source_word: שְׁכֶמָה
  choice: à Sichem
  rationale: Le ה directionnel indique un mouvement vers la ville ; « à Sichem » est l’équivalent idiomatique en français.
- source_word: אֶל אֲחֵי אִמּוֹ
  choice: auprès des frères de sa mère
  rationale: אֲחֵי signifie littéralement « frères de ». Cette formulation conserve le lien de parenté explicite plutôt que de l’interpréter simplement comme « oncles ».
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: Il leur parla
  rationale: דבר signifie « parler ». Une nouvelle phrase allège la longue coordination hébraïque tout en maintenant la progression du récit.
- source_word: וְאֶל כָּל מִשְׁפַּחַת
  choice: ainsi qu’à tout le clan
  rationale: מִשְׁפָּחָה désigne ici un groupe de parenté plus large que la famille nucléaire ; « clan » restitue cette réalité sociale.
- source_word: בֵּית אֲבִי אִמּוֹ
  choice: de la maison paternelle de sa mère
  rationale: L’expression désigne la maison, la maisonnée ou la lignée du père de sa mère. « Maison paternelle de sa mère » reste proche de l’idiome hébreu tout en étant lisible en français.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: L’infinitif introduit les paroles directes du verset suivant. Cette formule française remplit naturellement cette fonction.
theological_decisions: []
