source:
  edition: WLC
  text: וַ/יִּרְא֥וּ אִֽישׁ יִשְׂרָאֵ֖ל כִּ֣י מֵ֣ת אֲבִימֶ֑לֶךְ וַ/יֵּלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/055.yaml
  text: When the men of Israel saw that Abimelech was dead[a], each went to his own place.
translation:
  language: fr
  text: Quand les hommes d’Israël virent qu’Abimélek était mort, chacun s’en alla chez lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chacun à son lieu ».'
    reason: La note signale que « chez lui » rend idiomatiquement l’expression hébraïque sans affirmer plus précisément qu’il s’agissait de sa maison.
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: virent
  rationale: Le sens courant de ראה dans ce récit est la perception qui conduit au constat. « Virent » conserve simplement la formulation hébraïque.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: les hommes d’Israël
  rationale: Le nom singulier אִישׁ a ici une valeur collective, comme l’indiquent les verbes au pluriel. Cette traduction conserve aussi la référence masculine explicite du texte.
- source_word: כִּי
  choice: que
  rationale: 'כִּי introduit ici le contenu de ce que les hommes constatent : Abimélek est mort.'
- source_word: מֵת
  choice: était mort
  rationale: Le terme décrit l’état d’Abimélek au moment du constat, plutôt que l’événement de sa mort.
- source_word: אֲבִימֶלֶךְ
  choice: Abimélek
  rationale: Translittération française claire du nom propre hébreu, avec k pour rendre la consonne finale כ.
- source_word: וַיֵּלְכוּ
  choice: s’en alla
  rationale: Le verbe הלך signifie simplement « aller ». Avec le sujet distributif « chacun », le singulier français est requis; « s’en alla » exprime naturellement la dispersion sans imposer l’idée d’un retour.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: chacun s’en alla chez lui
  rationale: Le singulier distributif אִישׁ est rendu par « chacun ». Dans ce contexte de dispersion, « chez lui » exprime naturellement לִמְקֹמוֹ, littéralement « à son lieu ».
