  text: וַ/יָּשִׂ֣ימוּ ל/וֹ֩ בַעֲלֵ֨י שְׁכֶ֜ם מְאָרְבִ֗ים עַ֚ל רָאשֵׁ֣י הֶ/הָרִ֔ים וַ/יִּגְזְל֗וּ אֵ֛ת כָּל אֲשֶׁר יַעֲבֹ֥ר עֲלֵי/הֶ֖ם בַּ/דָּ֑רֶךְ וַ/יֻּגַּ֖ד לַ/אֲבִימֶֽלֶךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/025.yaml
  text: Then the leaders of Shechem set men in ambush for him on the tops of the mountains[a], and they robbed everyone who passed by them on the road; and it was reported to Abimelech.
translation:
  language: fr
  text: Les notables de Sichem[a] placèrent contre lui des hommes en embuscade sur les sommets des montagnes. Ils dévalisèrent tous ceux qui passaient près d’eux sur la route, et cela fut rapporté à Abimélek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les habitants de Sichem » ou « les maîtres de Sichem ». L’expression hébraïque peut désigner les principaux personnages ou les détenteurs du pouvoir dans la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַעֲלֵי שְׁכֶם
  choice: les notables de Sichem
  rationale: L’expression désigne littéralement les « maîtres » ou détenteurs de pouvoir de Sichem. « Les notables » rend naturellement leur statut civique et politique sans introduire une idée de seigneurie féodale.
- source_word: וַיָּשִׂימוּ לוֹ מְאָרְבִים
  choice: placèrent contre lui des hommes en embuscade
  rationale: Cette formulation exprime l’action de poster des personnes pour tendre une embuscade et rend la valeur hostile de לוֹ dans ce contexte.
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: sur les sommets des montagnes
  rationale: Rend de près l’image hébraïque des « têtes » des montagnes tout en restant naturel en français.
- source_word: וַיִּגְזְלוּ
  choice: ils dévalisèrent
  rationale: Le verbe exprime le fait de dépouiller ou voler par la force; « dévaliser » convient particulièrement à l’attaque de voyageurs.
- source_word: אֵת כָּל אֲשֶׁר יַעֲבֹר עֲלֵיהֶם בַּדָּרֶךְ
  choice: tous ceux qui passaient près d’eux sur la route
  rationale: Le singulier distributif après כָּל est rendu par « tous ceux qui »; « près d’eux » restitue le passage à leur hauteur sans suggérer qu’on passait physiquement sur eux.
- source_word: וַיֻּגַּד לַאֲבִימֶלֶךְ
  choice: cela fut rapporté à Abimélek
  rationale: Le passif impersonnel conserve l’absence d’un informateur identifié dans le texte source.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique; le vocabulaire reste accessible. La répétition du pronom « ils » préserve la continuité — et la légère ambiguïté — du sujet hébreu.
