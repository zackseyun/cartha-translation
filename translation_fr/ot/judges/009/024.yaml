source:
  edition: WLC
  text: לָ/ב֕וֹא חֲמַ֖ס שִׁבְעִ֣ים בְּנֵֽי יְרֻבָּ֑עַל וְ/דָמָ֗/ם לָ/שׂ֞וּם עַל אֲבִימֶ֤לֶךְ אֲחִי/הֶם֙ אֲשֶׁ֣ר הָרַ֣ג אוֹתָ֔/ם וְ/עַל֙ בַּעֲלֵ֣י שְׁכֶ֔ם אֲשֶׁר חִזְּק֥וּ אֶת יָדָ֖י/ו לַ/הֲרֹ֥ג אֶת אֶחָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/024.yaml
  text: so that the violence done to the seventy sons of Jerubbaal might come[a], and their blood be laid on Abimelech their brother, who killed them, and on the leaders of Shechem[c][b], who strengthened his hands to kill his brothers.
translation:
  language: fr
  text: afin que la violence commise contre les soixante-dix fils de Yeroubbaal retombe[a] sur Abimélek, leur frère, qui les avait tués, ainsi que sur les notables de Sichem[b], qui lui avaient prêté main-forte[c] pour tuer ses frères, et que leur sang soit mis à leur charge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vienne ». La tournure indique ici que la violence commise vient sur ceux qui en portent la responsabilité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « maîtres de Sichem » ; l’hébreu désigne les hommes influents ou les détenteurs du pouvoir dans la ville.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « avaient fortifié ses mains », c’est-à-dire qu’ils l’avaient soutenu activement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבוֹא חֲמַס
  choice: afin que la violence commise… retombe
  rationale: L’infinitif précédé de ל exprime ici le but ou le résultat. « Retombe sur » rend naturellement en français l’idée d’un crime qui revient sur ses responsables, tout en conservant le mouvement exprimé par « venir ».
- source_word: שִׁבְעִים בְּנֵי יְרֻבָּעַל
  choice: les soixante-dix fils de Yeroubbaal
  rationale: Rend directement la chaîne construite et translittère le nom propre selon un usage français transparent.
- source_word: וְדָמָם לָשׂוּם עַל
  choice: que leur sang soit mis à sa charge ainsi qu’à celle de
  rationale: Conserve l’image hébraïque du sang tout en rendant explicite, par une locution française courante, l’attribution de la responsabilité du meurtre.
- source_word: אֲבִימֶלֶךְ אֲחִיהֶם
  choice: Abimélek, leur frère
  rationale: L’apposition souligne que l’auteur du massacre appartenait lui-même à la fratrie.
- source_word: אֲשֶׁר הָרַג אוֹתָם
  choice: qui les avait tués
  rationale: Le plus-que-parfait clarifie l’antériorité de l’acte par rapport au jugement évoqué, sans renforcer le verbe courant הרג en lui imposant une qualification juridique.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: les notables de Sichem
  rationale: Dans ce contexte, בעלי désigne les hommes influents ou détenteurs du pouvoir dans la ville, plutôt que l’ensemble de ses habitants.
- source_word: חִזְּקוּ אֶת יָדָיו
  choice: lui avaient prêté main-forte
  rationale: Cette expression idiomatique française conserve l’image de la main et communique clairement l’idée de soutien actif.
- source_word: לַהֲרֹג אֶת אֶחָיו
  choice: pour tuer ses frères
  rationale: Rend directement l’infinitif de but et maintient le terme familial précis.
theological_decisions:
- issue: Image du sang et responsabilité pour le meurtre
  choice: « que leur sang soit mis à sa charge »
  alternative: « que la responsabilité de leur mort lui soit imputée »
  rationale: La formulation retenue préserve l’image biblique du sang versé et sa portée judiciaire, sans réduire le texte à une abstraction juridique.
- issue: Rapport entre la violence et ses responsables
  choice: « la violence commise… retombe sur »
  alternative: « la violence… vienne sur »
  rationale: « Retombe sur » exprime en français naturel le retour judiciaire de la violence contre ses auteurs et complices, sans préciser davantage le mécanisme de la rétribution.
translation_notes:
  register: Français international moderne, digne et lisible. Les noms sont rendus sous les formes « Yeroubbaal », « Abimélek » et « Sichem ». La syntaxe rétablit explicitement le complément de « retombe » afin de refléter l’ensemble de la construction hébraïque, où la violence et le sang sont imputés à Abimélek et aux dirigeants de Sichem.
