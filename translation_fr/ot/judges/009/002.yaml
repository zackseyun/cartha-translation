id: JDG.9.2
reference: Judges 9:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דַּבְּרוּ נָ֞א בְּ/אָזְנֵ֨י כָל בַּעֲלֵ֣י שְׁכֶם֮ מַה טּ֣וֹב לָ/כֶם֒ הַ/מְשֹׁ֨ל בָּ/כֶ֜ם שִׁבְעִ֣ים אִ֗ישׁ כֹּ֚ל בְּנֵ֣י יְרֻבַּ֔עַל אִם מְשֹׁ֥ל בָּ/כֶ֖ם אִ֣ישׁ אֶחָ֑ד וּ/זְכַרְתֶּ֕ם כִּֽי עַצְמֵ/כֶם וּ/בְשַׂרְ/כֶ֖ם אָנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/002.yaml
  text: 'Please speak in the hearing of all the leaders of Shechem: Which is better for you—that seventy men[a], all the sons of Jerubbaal, rule over you, or that one man rule over you? And remember that I am your bone and your flesh.'
translation:
  language: fr
  text: 'Dites, je vous prie, à tous les notables de Sichem : « Qu’est-ce qui vaut mieux pour vous : que soixante-dix hommes, tous les fils de Jerubbaal, règnent sur vous, ou qu’un seul homme règne sur vous ? Et souvenez-vous que je suis de vos os et de votre chair[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expression de parenté : « de vos os et de votre chair » signifie « de votre famille, de votre sang ».'
    reason: L’idiome hébreu concret est conservé dans le texte et son sens de parenté est explicité sans le réduire dans la traduction principale.
lexical_decisions:
- source_word: דַּבְּרוּ נָא
  choice: Dites, je vous prie
  rationale: L’impératif pluriel accompagné de נָא exprime une demande pressante mais courtoise. Cette formulation est naturelle et digne en français.
- source_word: בְּאָזְנֵי
  choice: à
  rationale: L’expression signifie littéralement « aux oreilles de », mais introduit ici les destinataires auxquels il faut transmettre publiquement les paroles. Le simple « à » restitue naturellement ce sens en français.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: les notables de Sichem
  rationale: בַּעֲלֵי peut désigner les maîtres, propriétaires ou hommes influents d’une ville. Dans ce contexte civique, « notables » rend leur statut dirigeant sans leur attribuer un titre politique trop précis.
- source_word: מַה טּוֹב לָכֶם
  choice: Qu’est-ce qui vaut mieux pour vous
  rationale: Les deux possibilités qui suivent donnent à טוֹב une valeur comparative. Cette formulation conserve la question rhétorique sans la rendre artificielle.
- source_word: הַמְשֹׁל בָּכֶם ... מְשֹׁל בָּכֶם
  choice: règnent sur vous ... règne sur vous
  rationale: Dans ce contexte de prétention au pouvoir, משל désigne l’exercice de l’autorité. « Régner sur » conserve la répétition et la portée politique du propos.
- source_word: שִׁבְעִים אִישׁ כֹּל בְּנֵי יְרֻבַּעַל
  choice: soixante-dix hommes, tous les fils de Yeroubbaal
  rationale: אִישׁ désigne ici explicitement les fils masculins de Yeroubbaal. La formulation française conserve le nombre et l’apposition hébraïque.
- source_word: אִם
  choice: ou
  rationale: Dans la question disjonctive, אִם introduit la seconde possibilité et se rend naturellement par « ou ».
- source_word: אִישׁ אֶחָד
  choice: un seul homme
  rationale: « Un seul homme » fait ressortir l’opposition rhétorique avec les soixante-dix hommes et respecte la référence masculine.
- source_word: וּזְכַרְתֶּם
  choice: Souvenez-vous aussi
  rationale: Dans ce contexte, la forme a la force d’une exhortation. « Aussi » marque le lien avec l’argument précédent sans affaiblir l’impératif.
- source_word: עַצְמֵכֶם וּבְשַׂרְכֶם
  choice: votre os et votre chair
  rationale: La traduction conserve l’image concrète et les singuliers de l’idiome hébreu, tandis que la note en explicite le sens familial.
- source_word: אָנִי
  choice: je suis
  rationale: Le pronom indépendant met Abimélek en relief. En français, le contraste avec les autres prétendants et l’ordre de la proposition suffisent à porter cette insistance.
theological_decisions:
- issue: Portée de l’expression de parenté
  choice: Conserver « je suis votre os et votre chair » dans le texte
  alternative: « je suis de votre sang » ou « je suis votre proche parent »
  rationale: L’image hébraïque affirme une solidarité familiale concrète. La conserver évite de réduire le propos à une paraphrase et laisse apparaître la force de l’appel d’Abimélek à la parenté.
- issue: Langage genré pour les fils de Yeroubbaal et Abimélek
  choice: Employer « soixante-dix hommes » et « un seul homme »
  alternative: « soixante-dix personnes » et « une seule personne »
  rationale: Le contexte et le substantif אִישׁ visent des hommes, à savoir les fils de Yeroubbaal et Abimélek. La traduction conserve cette précision du texte.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le discours direct garde sa force persuasive. Le nom יְרֻבַּעַל est translittéré « Yeroubbaal », et שְׁכֶם selon la forme française traditionnelle « Sichem ».
