  yaml_path: translation/ot/judges/009/053.yaml
  text: But a certain woman threw an upper millstone on Abimelech’s head and crushed his skull[a].
translation:
  language: fr
  text: Mais une femme lança un morceau de meule supérieure sur la tête d’Abimélek et lui fracassa le crâne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une meule supérieure » ; l’expression hébraïque peut désigner la pierre supérieure elle-même ou mettre l’accent sur un morceau de celle-ci.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלֵךְ
  choice: lança
  rationale: Le verbe שׁלך exprime ici l’action de jeter ou de lancer; « lança » garde la force active du récit et convient au geste effectué depuis la tour.
- source_word: אִשָּׁה אַחַת
  choice: une femme
  rationale: Littéralement « une femme »; dans ce contexte narratif, le français indéfini est naturel tout en conservant l’identité anonyme de l’actrice.
- source_word: פֶּלַח רֶכֶב
  choice: un morceau de meule supérieure
  rationale: רֶכֶב désigne la meule mobile, c’est-à-dire la pierre supérieure, tandis que פֶּלַח peut désigner une section ou un morceau. Cette traduction rend les deux éléments sans supposer que la pierre était entière.
- source_word: עַל רֹאשׁ אֲבִימֶלֶךְ
  choice: sur la tête d’Abimélek
  rationale: Rend directement l’expression spatiale hébraïque et adopte une translittération française usuelle du nom.
- source_word: וַתָּרִץ
  choice: lui fracassa
  rationale: Le verbe רצץ signifie écraser ou fracasser. « Fracassa » exprime naturellement en français la violence précise du coup porté au crâne.
- source_word: גֻּלְגָּלְתּוֹ
  choice: le crâne
  rationale: Le nom désigne précisément le crâne plutôt que la tête en général; le pronom objet « lui » restitue la possession en français naturel.
