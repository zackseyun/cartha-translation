  naturalness: Le français est naturel, clair et de registre narratif moderne. Le déplacement de « en secret » avant le complément direct rend la phrase légèrement plus fluide, sans modifier le sens.
  terminology: Les formes Abimélek, Ébed, Gaal et Sichem sont cohérentes et appropriées en français. « Messagers », « fils de » et « frères » conservent les termes source. Les notes révisées préservent les alternatives lexicales pertinentes sans surinterprétation.
