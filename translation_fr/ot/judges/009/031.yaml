base_translation:
  language: en
  yaml_path: translation/ot/judges/009/031.yaml
  text: And he sent messengers to Abimelek secretly[a], saying, “Look, Gaal son of Ebed and his brothers have come to Shechem, and look, they are besieging the city against you.”
translation:
  language: fr
  text: 'Il envoya secrètement[a] des messagers à Abimélek pour lui dire : « Voici que Gaal, fils d’Ébed, et ses frères sont arrivés à Sichem, et voilà qu’ils soulèvent[b] la ville contre toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec ruse » ou « de façon trompeuse ». Le terme hébreu est difficile.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu est difficile. Il peut aussi évoquer le fait de presser ou d’assiéger la ville contre toi ; dans le contexte, il peut désigner l’action de la pousser à se retourner contre Abimélek.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: Il envoya des messagers
  rationale: Le wayyiqtol poursuit le récit au passé simple. Dans ce contexte politique, מַלְאָכִים désigne des messagers humains.
- source_word: בְּתָרְמָה
  choice: en secret
  rationale: Le terme exprime ici le caractère clandestin, voire trompeur, de l’envoi. « En secret » reste naturel sans imposer une qualification morale plus forte.
- source_word: הִנֵּה
  choice: Voici que
  rationale: Cette tournure attire l’attention sur la nouvelle rapportée tout en gardant un registre narratif digne et actuel.
- source_word: גַעַל בֶּן עֶבֶד וְאֶחָיו
  choice: Gaal, fils d’Ébed, et ses frères
  rationale: La filiation et le terme explicite « frères » sont conservés sans les généraliser en alliés ou partisans.
- source_word: בָּאִים שְׁכֶמָה
  choice: sont arrivés à Sichem
  rationale: Le participe désigne une arrivée dont les effets sont présents dans la situation rapportée.
- source_word: וְהִנָּם
  choice: et voilà qu’ils
  rationale: La reprise de la particule présentative hébraïque est conservée pour rendre l’insistance du rapport.
- source_word: צָרִים אֶת הָעִיר עָלֶיךָ
  choice: ils soulèvent la ville contre toi
  rationale: Le verbe est difficile. Dans le contexte de la révolte politique et avec « contre toi », cette formulation exprime le fait d’inciter la ville à l’hostilité, tout en signalant en note le sens plus littéral possible de siège.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. Les noms sont rendus selon les formes françaises usuelles : Abimélek, Ébed et Sichem. L’ambiguïté de בְּתָרְמָה est explicitement préservée en note; la difficulté de צָרִים est rendue contextuellement par « soulèvent ».'
