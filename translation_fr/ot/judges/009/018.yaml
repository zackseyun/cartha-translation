  terminology: « Maison de mon père », « fils », « servante », « notables de Sichem » et « frère » sont appropriés. « Notables » rend naturellement בעלי dans ce contexte civique. La note doit éviter « son esclave », qui ne marque pas clairement en français qu'il s'agit d'une femme.
