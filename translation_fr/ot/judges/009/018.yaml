  text: וְ/אַתֶּ֞ם קַמְתֶּ֨ם עַל בֵּ֤ית אָבִ/י֙ הַ/יּ֔וֹם וַ/תַּהַרְג֧וּ אֶת בָּנָ֛י/ו שִׁבְעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/תַּמְלִ֜יכוּ אֶת אֲבִימֶ֤לֶךְ בֶּן אֲמָת/וֹ֙ עַל בַּעֲלֵ֣י שְׁכֶ֔ם כִּ֥י אֲחִי/כֶ֖ם הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/018.yaml
  text: But you have risen up against my father's house today[a], and you killed his sons, seventy men, on one stone, and you made Abimelek, the son of his female servant, king over the leaders of Shechem, because he is your brother.
translation:
  language: fr
  text: 'Mais aujourd’hui, vous vous êtes dressés contre la maison de mon père : vous avez tué ses fils, soixante-dix hommes, sur une seule pierre, et vous avez fait d’Abimélek, le fils de sa servante[a], le roi des notables de Sichem, parce qu’il est votre frère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le fils de son esclave (femme) ». Selon le contexte, on peut aussi comprendre : « le fils de sa concubine ». L’hébreu dit littéralement : « le fils de sa servante ».'
    reason: Préserver les nuances possibles du statut social exprimé par אֲמָתוֹ sans imposer « concubine » dans le texte principal.
lexical_decisions:
- source_word: קַמְתֶּם עַל
  choice: vous vous êtes dressés contre
  rationale: Cette tournure conserve l’image hébraïque du fait de se lever contre quelqu’un tout en exprimant clairement l’opposition hostile.
- source_word: בֵּית אָבִי
  choice: la maison de mon père
  rationale: « Maison » préserve la métaphore familiale et dynastique de l’hébreu ; dans ce contexte, elle désigne la famille et la lignée, non un bâtiment.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Le terme souligne que l’accusation porte sur les actes commis en cette occasion présente.
- source_word: וַתַּהַרְגוּ
  choice: vous avez tué
  rationale: Le verbe énonce le fait de tuer. « Assassiné » ajouterait une qualification juridique qui n’est pas explicitement portée par le verbe.
- source_word: בָּנָיו שִׁבְעִים אִישׁ
  choice: ses fils, soixante-dix hommes
  rationale: Le suffixe renvoie naturellement au père de Yotam. La formulation conserve aussi l’apposition hébraïque « soixante-dix hommes ».
- source_word: עַל אֶבֶן אֶחָת
  choice: sur une seule pierre
  rationale: Le rendu direct maintient l’image concrète et sinistre du lieu ou support de l’exécution collective.
- source_word: וַתַּמְלִיכוּ
  choice: vous avez établi comme roi
  rationale: La forme causative signifie faire de quelqu’un un roi ; cette expression est naturelle en français et en conserve la force.
- source_word: בֶּן אֲמָתוֹ
  choice: le fils de sa servante
  rationale: אָמָה désigne une servante, avec une possible condition servile. « Servante » rend le sens lexical sans imposer dans le texte principal le statut plus précis de concubine.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: les dirigeants de Sichem
  rationale: Dans ce cadre politique, l’expression désigne les notables ou détenteurs de l’autorité civique de Sichem. « Dirigeants » communique ce sens sans archaïsme.
- source_word: כִּי אֲחִיכֶם הוּא
  choice: parce qu’il est votre frère
  rationale: La conjonction introduit ici la raison de leur choix et conserve la pointe ironique de l’accusation de Yotam.
theological_decisions:
- issue: Statut social exprimé par אֲמָתוֹ dans la désignation de la mère d’Abimélek
  choice: sa servante
  alternative: son esclave ; sa concubine
  rationale: Le nom hébreu désigne lexicalement une servante, éventuellement une femme en condition servile. Dans le discours, cette désignation souligne de manière polémique le rang maternel inférieur d’Abimélek. « Concubine » peut correspondre au contexte narratif, mais précise davantage le statut relationnel que ne le fait ce mot dans ce verset.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme accusatoire de l’hébreu est conservé par une phrase continue et une ponctuation forte. Les images de la « maison » et de la « seule pierre » sont maintenues plutôt qu’explicitées.
