  source_fidelity: 'Le texte rend fidèlement les principaux éléments hébreux : l''opposition hostile à la maison du père, le meurtre des soixante-dix fils sur une même pierre, l''intronisation d''Abimélek et le motif ironique de la fraternité. « Sa servante » conserve sans surinterprétation le terme polémique אֲמָתוֹ.'
