  source_fidelity: 'Le texte rend fidèlement וַיֻּגַּד par « On informa », en conservant l’agent non précisé. « Tous les notables » est une bonne équivalence contextuelle de כָּל־בַּעֲלֵי : le terme désigne les hommes influents ou responsables liés à la tour, sans introduire une interprétation institutionnelle trop précise. « La tour de Sichem » respecte la construction hébraïque et l’ambiguïté exacte de ce lieu/édifice. Le plus-que-parfait « s’étaient rassemblés » exprime correctement l’antériorité du rassemblement par rapport à l’annonce.'
