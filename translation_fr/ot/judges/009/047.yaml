lexical_decisions:
- source_word: וַיֻּגַּד
  choice: On informa
  rationale: Le passif impersonnel hébreu est rendu par une tournure française naturelle qui conserve l’agent indéterminé.
- source_word: בַּעֲלֵי
  choice: notables
  rationale: Dans ce contexte, le terme désigne les hommes influents ou dirigeants associés à la tour de Sichem; « notables » évite le littéral ambigu « maîtres » tout en restant distinct de « habitants ».
- source_word: מִגְדַּל שְׁכֶם
  choice: la tour de Sichem
  rationale: Rendu formel du nom de lieu ou de l’édifice fortifié, sans préciser davantage ce que le contexte laisse ouvert.
- source_word: הִתְקַבְּצוּ
  choice: s’étaient rassemblés
  rationale: Le plus-que-parfait exprime naturellement en français que le rassemblement précédait l’information transmise à Abimélek.
