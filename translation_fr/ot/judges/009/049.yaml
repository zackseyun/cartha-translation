  text: וַ/יִּכְרְת֨וּ גַם כָּל הָ/עָ֜ם אִ֣ישׁ שׂוֹכֹ֗/ה וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י אֲבִימֶ֨לֶךְ֙ וַ/יָּשִׂ֣ימוּ עַֽל הַ/צְּרִ֔יחַ וַ/יַּצִּ֧יתוּ עֲלֵי/הֶ֛ם אֶֽת הַ/צְּרִ֖יחַ בָּ/אֵ֑שׁ וַ/יָּמֻ֜תוּ גַּ֣ם כָּל אַנְשֵׁ֧י מִֽגְדַּל שְׁכֶ֛ם כְּ/אֶ֖לֶף אִ֥ישׁ וְ/אִשָּֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/049.yaml
  text: So all the people also cut down a branch each[a], and they went after Abimelech and piled them against the inner chamber, and set the inner chamber on fire over them, so that all the people of the tower of Shechem also died[b], about a thousand men and women.
translation:
  language: fr
  text: Alors tout le peuple coupa aussi une branche chacun. Ils suivirent Abimélek, entassèrent les branches contre le refuge fortifié[a] et y mirent le feu, au-dessus d’eux. Ainsi moururent aussi tous les gens de la tour de Sichem, environ mille hommes et femmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est rare et peut aussi être traduit par « réduit », « chambre intérieure » ou « forteresse ». Il semble désigner ici le refuge clos situé dans la tour.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ
  choice: coupa
  rationale: Dans ce contexte, כרת désigne l’action de couper des branches; « coupa » est direct et naturel.
- source_word: אִישׁ שׂוֹכֹה
  choice: une branche chacun
  rationale: Cette formulation rend la valeur distributive de l’expression littérale « chacun sa branche » tout en restant idiomatique en français moderne.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֲבִימֶלֶךְ
  choice: Ils suivirent Abimélek
  rationale: L’expression signifie ici que le peuple marcha à la suite d’Abimélek et imita son action.
- source_word: הַצְּרִיחַ
  choice: le refuge fortifié
  rationale: Le terme rare semble désigner l’espace clos et protégé où les gens de la tour s’étaient réfugiés, plutôt que la tour entière; « refuge fortifié » maintient cette distinction.
- source_word: וַיָּשִׂימוּ עַל הַצְּרִיחַ
  choice: entassèrent les branches contre le refuge fortifié
  rationale: Dans le contexte d’un incendie de siège, « contre » exprime naturellement la disposition des branches au contact de la structure; « entassèrent » rend l’action collective suggérée par le contexte.
- source_word: וַיַּצִּיתוּ עֲלֵיהֶם אֶת הַצְּרִיחַ בָּאֵשׁ
  choice: y mirent le feu au-dessus d’eux
  rationale: Cette traduction conserve la relation spatiale exprimée par עֲלֵיהֶם sans préciser davantage la configuration incertaine du refuge.
- source_word: אַנְשֵׁי מִגְדַּל שְׁכֶם
  choice: tous les gens de la tour de Sichem
  rationale: Ici, אַנְשֵׁי désigne collectivement les personnes associées à la tour; « gens » s’accorde avec la précision finale selon laquelle hommes et femmes périrent.
- source_word: כְּאֶלֶף
  choice: environ mille
  rationale: Le préfixe כ־ marque ici l’approximation.
- source_word: אִישׁ וְאִשָּׁה
  choice: hommes et femmes
  rationale: Cette expression française naturelle conserve l’inclusion explicite des deux sexes.
theological_decisions: []
