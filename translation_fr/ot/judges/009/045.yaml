  text: וַ/אֲבִימֶ֜לֶךְ נִלְחָ֣ם בָּ/עִ֗יר כֹּ֚ל הַ/יּ֣וֹם הַ/ה֔וּא וַ/יִּלְכֹּד֙ אֶת הָ/עִ֔יר וְ/אֶת הָ/עָ֥ם אֲשֶׁר בָּ֖/הּ הָרָ֑ג וַ/יִּתֹּץ֙ אֶת הָ/עִ֔יר וַ/יִּזְרָעֶ֖/הָ מֶֽלַח־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/045.yaml
  text: And Abimelech fought against the city all that day[a], and he captured the city and killed the people who were in it[b]. Then he tore down the city and sowed it with salt.
translation:
  language: fr
  text: Abimélek combattit contre la ville pendant toute cette journée[a]. Il s’empara de la ville et tua les gens qui s’y trouvaient. Puis il rasa la ville et y sema du sel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « attaqua la ville ». Le verbe hébreu signifie littéralement « combattre » et, avec la préposition employée ici, désigne probablement une action militaire menée contre la ville.
    reason: lexical_alternative
  - marker: b
    text: Semer du sel sur le site était un geste symbolique de dévastation et de malédiction, marquant la ruine de la ville.
    reason: cultural_note
lexical_decisions:
- source_word: נִלְחָם בָּעִיר
  choice: combattit contre la ville
  rationale: Le verbe לחם construit avec ב peut désigner une action militaire dirigée contre un adversaire. La prise et la destruction qui suivent confirment ici ce sens hostile; « combattit » reste plus proche du lexème hébreu que « attaqua ».
- source_word: כֹּל הַיּוֹם הַהוּא
  choice: pendant toute cette journée
  rationale: Cette formulation française naturelle conserve l’idée de durée sur l’ensemble du jour en question.
- source_word: וַיִּלְכֹּד
  choice: il s’empara de
  rationale: Dans un contexte militaire, לכד signifie prendre ou capturer une ville. « S’empara de la ville » est idiomatique en français.
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: les gens qui s’y trouvaient
  rationale: עָם désigne ici la population présente dans la ville. Cette traduction préserve la relative sans imposer le terme plus spécifique « habitants ».
- source_word: הָרָג
  choice: tua
  rationale: Le verbe signifie directement mettre à mort; « tua » est clair, sobre et moderne.
- source_word: וַיִּתֹּץ
  choice: il rasa
  rationale: נתץ exprime la démolition. Pour une ville, « raser » rend naturellement l’idée d’une destruction complète ou systématique sans lourdeur technique.
- source_word: וַיִּזְרָעֶהָ מֶלַח
  choice: y sema du sel
  rationale: La formulation conserve l’image concrète et délibérée du texte hébreu, qui emploie littéralement le verbe « semer » avec le sel.
