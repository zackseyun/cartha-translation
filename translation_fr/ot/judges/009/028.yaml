  text: וַ/יֹּ֣אמֶר גַּ֣עַל בֶּן עֶ֗בֶד מִֽי אֲבִימֶ֤לֶךְ וּ/מִֽי שְׁכֶם֙ כִּ֣י נַעַבְדֶ֔/נּוּ הֲ/לֹ֥א בֶן יְרֻבַּ֖עַל וּ/זְבֻ֣ל פְּקִיד֑/וֹ עִבְד֗וּ אֶת אַנְשֵׁ֤י חֲמוֹר֙ אֲבִ֣י שְׁכֶ֔ם וּ/מַדּ֖וּעַ נַעַבְדֶ֥/נּוּ אֲנָֽחְנוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/028.yaml
  text: And Gaal son of Ebed said[a], “Who is Abimelek, and who is Shechem, that we should serve him? Is he not the son of Jerubbaal, and Zebul his officer? Serve the men of Hamor[c][b], the father of Shechem! But why should we serve him?”
translation:
  language: fr
  text: 'Gaäl, fils d’Ébed, dit : « Qui est Abimélek, et qui est Sichem[a], pour que nous le servions ? N’est-il pas le fils de Yeroubbaal, et Zéboul son administrateur[b] ? Servez les hommes de Hamor[c], père de Sichem ! Mais nous, pourquoi le servirions-nous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi comprendre : « et qu’est-ce que Sichem ? » Le texte hébreu nomme directement Sichem, probablement pour désigner par métonymie la ville ou sa communauté dirigeante.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « son délégué », « son fonctionnaire ». Le terme hébreu désigne un responsable nommé.'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire les hommes issus de Hamor ou liés à lui. Hamor est présenté comme le père de Sichem ; voir Genèse 34.
    reason: cross_reference
lexical_decisions:
- source_word: מִי אֲבִימֶלֶךְ וּמִי שְׁכֶם
  choice: Qui est Abimélek, et qui est Sichem
  rationale: Le pronom interrogatif מִי conteste avec mépris le rang et la légitimité. Le nom « Sichem » est conservé tel quel, comme dans l’hébreu, tout en laissant ouverte sa valeur métonymique possible pour la ville ou sa communauté dirigeante.
- source_word: כִּי נַעַבְדֶנּוּ
  choice: pour que nous le servions
  rationale: Dans ce contexte, עבד exprime le service politique ou la sujétion. Le singulier « le » est maintenu, conformément au suffixe hébreu, et renvoie le plus naturellement à Abimélek.
- source_word: הֲלֹא בֶן יְרֻבַּעַל
  choice: N’est-il pas le fils de Yeroubbaal
  rationale: La question rhétorique attend une réponse affirmative et insiste sur l’ascendance d’Abimélek.
- source_word: פְּקִידוֹ
  choice: son administrateur
  rationale: פָּקִיד désigne un responsable nommé ou un agent subordonné. « Administrateur » convient au rôle politique de Zéboul sans préciser excessivement sa charge.
- source_word: עִבְדוּ
  choice: Servez
  rationale: L’impératif masculin pluriel est rendu directement afin de conserver la vigueur provocatrice du discours.
- source_word: אַנְשֵׁי חֲמוֹר
  choice: les hommes de Hamor
  rationale: La formulation reste proche de l’hébreu et peut désigner les hommes, les descendants ou le groupe associé à Hamor.
- source_word: וּמַדּוּעַ נַעַבְדֶנּוּ אֲנָחְנוּ
  choice: Mais nous, pourquoi le servirions-nous ?
  rationale: « Mais » fait ressortir le défi final, tandis que la dislocation « nous » rend l’accent porté par le pronom hébreu explicite אֲנָחְנוּ.
theological_decisions: []
