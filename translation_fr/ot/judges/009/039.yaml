  yaml_path: translation/ot/judges/009/039.yaml
  text: So Gaal went out before the leaders of Shechem and fought against Abimelech[a].
translation:
  language: fr
  text: Alors Gaal sortit devant les dirigeants de Sichem[a] et combattit Abimélek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la tête des dirigeants de Sichem ». Littéralement : « devant les dirigeants de Sichem »; l’expression peut indiquer que Gaal marchait devant eux ou qu’il les conduisait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le qal narratif de יצא signifie couramment « sortir ». Le passé simple convient au registre narratif biblique en français moderne et soutenu.
- source_word: גַעַל
  choice: Gaal
  rationale: Le nom propre est translittéré selon sa forme hébraïque usuelle.
- source_word: לִפְנֵי
  choice: à la tête de
  rationale: Littéralement « devant », l’expression décrit ici vraisemblablement la position de Gaal en tête des dirigeants de Sichem dans une sortie militaire. La traduction idiomatique exprime ce rôle sans exclure l’image spatiale, signalée en note.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: les dirigeants de Sichem
  rationale: בעלים désigne ici les notables ou détenteurs de l’autorité civique de Sichem, plutôt que l’ensemble indifférencié de ses habitants.
- source_word: וַיִּלָּחֶם
  choice: combattit
  rationale: Le niphal de לחם a ici le sens de livrer combat. « Combattit » est concis, naturel et adapté au récit.
- source_word: בַּאֲבִימֶלֶךְ
  choice: Abimélek
  rationale: Après « combattre », le complément direct français désigne naturellement l’adversaire; il rend la valeur adversative de ב dans cette construction. Le nom est translittéré de façon lisible en français.
