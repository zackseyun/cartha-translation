source:
  edition: WLC
  text: וַ/יָּ֣שֶׁב אֱלֹהִ֔ים אֵ֖ת רָעַ֣ת אֲבִימֶ֑לֶךְ אֲשֶׁ֤ר עָשָׂה֙ לְ/אָבִ֔י/ו לַ/הֲרֹ֖ג אֶת שִׁבְעִ֥ים אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/056.yaml
  text: Thus God repaid Abimelech for the evil that he had done to his father by killing his seventy brothers[a].
translation:
  language: fr
  text: Ainsi, Dieu fit retomber sur Abimélek le mal qu’il avait fait à son père en tuant ses soixante-dix frères.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rendit à Abimélek le mal qu’il avait fait ». L’expression hébraïque évoque le mal que Dieu fait revenir sur son auteur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: fit retomber sur
  rationale: Le hifil de שוב exprime ici le fait que Dieu fait revenir sur Abimélek le mal qu’il a commis. « Fit retomber sur » restitue naturellement en français l’image et la valeur causative de l’expression hébraïque.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom désigne ici le Dieu unique et commande un verbe au singulier.
- source_word: רָעַת
  choice: le mal
  rationale: Dans ce contexte, רָעָה qualifie moralement le crime d’Abimélek, et non seulement ses conséquences dommageables.
- source_word: אֲבִימֶלֶךְ
  choice: Abimélek
  rationale: Translittération française courante du nom propre, avec accent pour guider la prononciation.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il avait fait
  rationale: Le plus-que-parfait convient au bilan narratif d’un acte antérieur et conserve la relative hébraïque.
- source_word: לְאָבִיו
  choice: à son père
  rationale: La préposition ל désigne ici la personne envers laquelle le mal a été commis; la suite précise en quoi consistait ce mal.
- source_word: לַהֲרֹג
  choice: en tuant
  rationale: L’infinitif avec ל explicite le contenu ou la manière du mal fait au père. « En tuant » maintient ce lien sans surinterprétation.
- source_word: שִׁבְעִים אֶחָיו
  choice: ses soixante-dix frères
  rationale: Rendu direct de l’expression, qui préserve le nombre et le lien familial au cœur du crime.
- source_word: וַ
  choice: Ainsi
  rationale: Dans cette conclusion narrative, « Ainsi » rend la valeur récapitulative et consécutive de la coordination.
theological_decisions:
- issue: Action divine dans le jugement
  choice: Dieu fait activement retomber sur Abimélek le mal qu’il a commis.
  alternative: Dieu permet simplement que les conséquences du mal atteignent Abimélek.
  rationale: Le texte hébreu présente explicitement Dieu comme sujet du verbe causatif. La traduction conserve cette action judiciaire directe sans l’atténuer.
translation_notes:
  register: Français international moderne, naturel et digne. « Fit retomber sur » conserve l’image judiciaire de l’hébreu tout en restant accessible; la note signale l’équivalent plus explicite « rendit ».
