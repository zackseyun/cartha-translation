  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הַ/גֶּ֔פֶן הֶ/חֳדַ֨לְתִּי֙ אֶת תִּ֣ירוֹשִׁ֔/י הַֽ/מְשַׂמֵּ֥חַ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/013.yaml
  text: But the vine said to them[a], ‘Should I stop producing my new wine, which gladdens gods and men, and go to sway over the trees?’
translation:
  language: fr
  text: 'Mais la vigne leur répondit : « Renoncerais-je à produire mon vin nouveau, qui réjouit les dieux[a] et les humains, pour aller m’agiter au-dessus des arbres ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu » et les humains.'
    reason: Lecture alternative de אֱלֹהִים, qui peut désigner le Dieu d’Israël malgré sa forme plurielle.
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: la vigne
  rationale: Désigne la plante qui parle dans la fable de Yotam ; « la vigne » est le terme français naturel et littéraire.
- source_word: הֶחֳדַלְתִּי
  choice: Renoncerais-je à produire
  rationale: Le parfait à la première personne a ici une valeur interrogative et délibérative. « Produire » explicite en français le rapport naturel entre la vigne et son vin sans modifier le sens.
- source_word: תִּירוֹשִׁי
  choice: mon vin nouveau
  rationale: תִּירוֹשׁ désigne couramment le vin nouveau ou frais ; cette formulation préserve la nuance agricole du terme.
- source_word: הַמְשַׂמֵּחַ
  choice: qui réjouit
  rationale: 'Rend avec concision le participe causatif : le vin procure de la joie.'
- source_word: אֱלֹהִים וַאֲנָשִׁים
  choice: les dieux et les humains
  rationale: La forme אֱלֹהִים est morphologiquement plurielle et le cadre de la fable permet cette lecture. « Les humains » rend אֲנָשִׁים dans un français actuel et inclusif.
- source_word: וְהָלַכְתִּי
  choice: pour aller
  rationale: Dans la question rhétorique, le français exprime naturellement la conséquence envisagée par « pour aller ».
- source_word: לָנוּעַ
  choice: me balancer
  rationale: Préserve l'image concrète du mouvement de la vigne au-dessus des arbres, tout en laissant le contexte royal suggérer l'autorité sans remplacer l'image par « régner ».
- source_word: עַל הָעֵצִים
  choice: au-dessus des arbres
  rationale: Rend la position surplombante exprimée par עַל et convient à l'image physique de la fable.
theological_decisions:
- issue: Sens de אֱלֹהִים dans l'expression « qui réjouit אֱלֹהִים et les humains »
  choice: les dieux
  alternative: Dieu
  rationale: Le pluriel morphologique et le langage conventionnel de cette fable favorisent « les dieux ». La lecture traditionnelle au singulier demeure possible et est signalée en note afin de préserver l'ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est conservée ; l’image végétale de נוע n’est pas aplatie en un simple verbe de domination.
