  text: וַ/יַּרְא גַּעַל֮ אֶת הָ/עָם֒ וַ/יֹּ֣אמֶר אֶל זְבֻ֔ל הִנֵּה עָ֣ם יוֹרֵ֔ד מֵ/רָאשֵׁ֖י הֶ/הָרִ֑ים וַ/יֹּ֤אמֶר אֵלָי/ו֙ זְבֻ֔ל אֵ֣ת צֵ֧ל הֶ/הָרִ֛ים אַתָּ֥ה רֹאֶ֖ה כָּ/אֲנָשִֽׁים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/036.yaml
  text: When Gaal saw the people[a], he said to Zebul, “Look, people are coming down from the tops of the mountains.” But Zebul said to him, “You are seeing the shadow of the mountains as men.”
translation:
  language: fr
  text: 'Quand Gaal vit les gens, il dit à Zeboul : « Regarde ! Des gens descendent des sommets des montagnes. » Zeboul lui répondit : « C’est l’ombre des montagnes que tu prends pour des hommes[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu vois l’ombre des montagnes comme si c’étaient des hommes. »'
    reason: La construction comparative hébraïque exprime que Gaal prend l’ombre des montagnes pour des hommes ; cette variante le rend explicitement en français.
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le qal narratif de ראה exprime ici une perception visuelle directe ; « vit » convient au récit.
- source_word: הָעָם / עָם
  choice: les gens / des gens
  rationale: עָם désigne ici un groupe humain. « Gens » préserve cette généralité sans préciser explicitement qu’il s’agit d’une armée ou de soldats.
- source_word: הִנֵּה
  choice: Regarde !
  rationale: L’interjection attire vivement l’attention de Zeboul ; « Regarde ! » est naturel en français moderne.
- source_word: יוֹרֵד
  choice: descendent
  rationale: Bien que le participe hébreu soit au singulier avec le nom collectif עָם, le français demande naturellement le pluriel avec « des gens ».
- source_word: מֵרָאשֵׁי הֶהָרִים
  choice: des sommets des montagnes
  rationale: Le pluriel construit רָאשֵׁי désigne les sommets ou les hauteurs dominantes des montagnes.
- source_word: צֵל הֶהָרִים
  choice: l’ombre des montagnes
  rationale: צֵל signifie « ombre » ou « zone ombragée » ; « ombre » correspond à la méprise visuelle alléguée par Zeboul.
- source_word: אַתָּה רֹאֶה כָּאֲנָשִׁים
  choice: que tu prends pour des hommes
  rationale: Cette formulation française naturelle exprime la perception erronée suggérée par la comparaison hébraïque, tout en signalant en note sa forme plus littérale.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Le nom masculin pluriel évoque ici des silhouettes humaines masculines dans un contexte de combat ; « hommes » conserve cette précision.
theological_decisions: []
