base_translation:
  language: en
  yaml_path: translation/ot/judges/009/026.yaml
  text: Then Gaal son of Ebed came with his brothers and crossed into Shechem[c][b][a], and the leaders of Shechem put their trust in him.
translation:
  language: fr
  text: Alors Gaal, fils d’Ébed, vint avec ses frères[a]. Ils passèrent par Sichem[b], et les notables de Sichem[c] mirent leur confiance en lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et ses frères ». Dans ce contexte, la conjonction hébraïque peut naturellement exprimer l’accompagnement.'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « ils traversèrent Sichem » ou « ils entrèrent dans Sichem ». Le verbe hébreu évoque le fait de passer ou de franchir, mais le mouvement exact reste incertain ici.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « les maîtres de Sichem ». L’expression peut désigner les principaux citoyens, les détenteurs du pouvoir ou les notables de la ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Alors … vint
  rationale: Le wayyiqtol fait progresser le récit. « Alors » rend naturellement cette succession narrative, et le singulier du verbe est conservé en faisant de Gaal le sujet explicite.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: Gaal, fils d’Ébed
  rationale: Les noms propres sont translittérés et le patronyme hébreu est rendu par la tournure française habituelle « fils de ».
- source_word: וְאֶחָיו
  choice: avec ses frères
  rationale: Après « vint », la coordination hébraïque exprime naturellement l’accompagnement en français. Une note signale la formulation plus littérale.
- source_word: וַיַּעַבְרוּ בִּשְׁכֶם
  choice: Ils passèrent à Sichem
  rationale: Le verbe עבר exprime un passage ou une traversée. La formulation française préserve l’idée de mouvement sans préciser indûment s’il s’agit d’entrer dans la ville ou de la traverser.
- source_word: וַיִּבְטְחוּ בוֹ
  choice: mirent leur confiance en lui
  rationale: בטח construit avec בְּ exprime ici la confiance placée en une personne. Cette tournure conserve la force relationnelle de l’expression.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: les notables de Sichem
  rationale: Dans ce contexte civique, בעלי désigne les hommes qui détiennent une position ou un pouvoir dans la ville. « Notables » est naturel en français moderne tout en évitant de les identifier avec certitude à l’ensemble des habitants ou à des dirigeants officiellement constitués.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans être archaïque. La répétition de « Sichem » suit le texte hébreu et maintient clairement le lien entre la ville et ses notables.
