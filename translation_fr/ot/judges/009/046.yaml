source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֔וּ כָּֽל בַּעֲלֵ֖י מִֽגְדַּל שְׁכֶ֑ם וַ/יָּבֹ֣אוּ אֶל צְרִ֔יחַ בֵּ֖ית אֵ֥ל בְּרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/046.yaml
  text: When all the leaders of the tower of Shechem heard it[c][b][a], they went into the inner chamber of the house of El-berith.
translation:
  language: fr
  text: Lorsque tous les notables de la tour de Sichem[a] l’apprirent, ils entrèrent dans la chambre intérieure[b] de la maison d’El-Berith[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Migdal-Sichem », si l’expression est un nom de lieu plutôt que « la tour de Sichem ».
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu peut aussi désigner une chambre forte, une salle fortifiée ou un caveau intérieur.
    reason: lexical_alternative
  - marker: c
    text: El-Berith peut signifier « Dieu de l’alliance ». Voir le nom apparenté Baal-Berith ailleurs dans ce chapitre.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: l’apprirent
  rationale: Le verbe signifie « entendre ». Le pronom « l’ » reprend naturellement en français les événements rapportés juste auparavant, sans en préciser davantage la nature.
- source_word: בַּעֲלֵי
  choice: notables
  rationale: Littéralement « maîtres » ou « seigneurs de » ; dans ce contexte civique, le terme désigne les principaux habitants ou dirigeants du lieu. « Notables » exprime ce statut sans suggérer nécessairement une fonction officielle précise.
- source_word: מִגְדַּל שְׁכֶם
  choice: la tour de Sichem
  rationale: מִגְדַּל signifie « tour ». La traduction transparente est retenue dans le texte, tandis que la possibilité d’un nom de lieu composé est signalée en note.
- source_word: וַיָּבֹאוּ אֶל
  choice: ils entrèrent dans
  rationale: La construction exprime ici un déplacement vers l’espace protégé mentionné ensuite ; « entrèrent dans » rend ce mouvement de façon naturelle en français.
- source_word: צְרִיחַ
  choice: la chambre intérieure
  rationale: Le terme désigne un espace intérieur protégé, mais sa forme architecturale exacte demeure incertaine. Cette formulation évite de trancher entre chambre forte, salle fortifiée et caveau.
- source_word: בֵּית אֵל בְּרִית
  choice: le temple d’El-Berith
  rationale: בֵּית signifie littéralement « maison », mais désigne couramment le sanctuaire d’une divinité. « Temple » rend clairement cette fonction cultuelle, tandis que la translittération El-Berith préserve l’ambiguïté du nom ou titre.
theological_decisions:
- issue: Interprétation du nom ou titre אֵל בְּרִית
  choice: El-Berith
  alternative: Dieu de l’alliance ; Baal-Berith par harmonisation avec le contexte proche
  rationale: La translittération respecte la possibilité que l’expression fonctionne comme un nom divin et évite de l’harmoniser avec Baal-Berith ou d’imposer sa traduction comme seule lecture.
translation_notes:
  register: Français international moderne, sobre et narratif. « Notables » reste accessible tout en exprimant le rang civique ; « temple » explicite l’emploi cultuel de « maison ». Les notes conservent les incertitudes toponymique, architecturale et théonymique.
