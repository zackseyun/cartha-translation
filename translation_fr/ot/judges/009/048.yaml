  text: וַ/יַּ֨עַל אֲבִימֶ֜לֶךְ הַר צַלְמ֗וֹן הוּא֮ וְ/כָל הָ/עָ֣ם אֲשֶׁר אִתּ/וֹ֒ וַ/יִּקַּח֩ אֲבִימֶ֨לֶךְ אֶת הַ/קַּרְדֻּמּ֜וֹת בְּ/יָד֗/וֹ וַ/יִּכְרֹת֙ שׂוֹכַ֣ת עֵצִ֔ים וַ/יִּ֨שָּׂאֶ֔/הָ וַ/יָּ֖שֶׂם עַל שִׁכְמ֑/וֹ וַ/יֹּ֜אמֶר אֶל הָ/עָ֣ם אֲשֶׁר עִמּ֗/וֹ מָ֤ה רְאִיתֶם֙ עָשִׂ֔יתִי מַהֲר֖וּ עֲשׂ֥וּ כָמֽוֹ/נִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/048.yaml
  text: Then Abimelek went up Mount Zalmon[a], he and all the people who were with him. Abimelek took the axes in his hand, cut down a bundle of branches, lifted it, and put it on his shoulder. Then he said to the people who were with him, “What you have seen me do, hurry and do as I have done.”
translation:
  language: fr
  text: 'Abimélek monta sur le mont Tsalmon, avec tout le peuple qui l’accompagnait. Il prit les haches en main, coupa une brassée de branches[a], la souleva et la mit sur son épaule. Puis il dit au peuple qui l’accompagnait : « Vous avez vu ce que j’ai fait ; dépêchez-vous de faire comme moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grosse branche », « un amas de branchages » ou « une brassée de broussailles ». Le terme hébreu est rare et désigne une masse de branches ou de broussailles.
    reason: Variante lexicale due à la rareté et à l’étendue sémantique de שׂוֹכָה.
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה exprime ici le mouvement ascendant vers la montagne ; « monta » est direct et naturel dans le récit.
- source_word: הַר צַלְמוֹן
  choice: le mont Tsalmon
  rationale: La construction désigne une montagne portant le nom propre Tsalmon. La translittération avec « Ts » représente naturellement le צ en français.
- source_word: הוּא וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: avec tout le peuple qui l’accompagnait
  rationale: עָם reste rendu par « peuple », sans préciser qu’il s’agit de soldats ou d’hommes, ce que l’hébreu ne dit pas explicitement.
- source_word: הַקַּרְדֻּמּוֹת בְּיָדוֹ
  choice: des haches en main
  rationale: Le pluriel morphologique est conservé. « En main » rend idiomatiquement la possession immédiate de ces outils, sans suggérer nécessairement qu’une seule main tient plusieurs haches à la fois.
- source_word: וַיִּכְרֹת שׂוֹכַת עֵצִים
  choice: coupa une brassée de branches
  rationale: Le terme rare שׂוֹכָה évoque une masse de branches, un branchage ou des broussailles. Le contexte exige quelque chose qu’Abimélek peut porter sur l’épaule ; « une brassée de branches » garde cette image sans imposer une identification trop précise.
- source_word: וַיִּשָּׂאֶהָ וַיָּשֶׂם עַל שִׁכְמוֹ
  choice: la souleva et la mit sur son épaule
  rationale: 'Le féminin singulier du pronom reprend שׂוֹכָה. La succession des gestes est conservée : lever, puis placer sur l’épaule.'
- source_word: מָה רְאִיתֶם עָשִׂיתִי
  choice: Vous avez vu ce que j’ai fait
  rationale: La formulation hébraïque est condensée. Cette syntaxe française naturelle conserve l’appel à imiter l’action observée.
- source_word: מַהֲרוּ עֲשׂוּ כָמוֹנִי
  choice: dépêchez-vous de faire comme moi
  rationale: Les deux impératifs pluriels expriment l’urgence et l’imitation. Cette formulation française est claire, vive et fidèle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le nom propre est rendu « Abimélek » et la montagne « Tsalmon ». La répétition hébraïque de « Abimélek » est allégée par « Il » dans la deuxième phrase pour une lecture française fluide, tandis que les éléments narratifs et l’urgence de l’ordre restent explicites.
