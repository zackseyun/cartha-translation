  terminology: Les formes Yotam, Béer et Abimélek sont cohérentes avec une translittération proche de l’hébreu. « Béer » rend de façon défendable le nom de lieu, en comprenant le ה final comme directionnel; aucune note n’est nécessaire en français tant que cette analyse est retenue.
