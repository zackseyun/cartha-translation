  source_fidelity: Le texte hébreu enchaîne deux verbes de fuite (וינס, ויברח), puis « alla à Béer » (בארה, vraisemblablement avec ה directionnel) et « demeura là, loin de/devant Abimélek, son frère ». La traduction doit conserver ce redoublement et le lien explicite entre « frère » et Abimélek.
