  yaml_path: translation/ot/judges/009/021.yaml
  text: Then Jotham fled and escaped and went to Beer[a], and he lived there away from Abimelech his brother.
translation:
  language: fr
  text: Alors Yotam s’enfuit et s’échappa; il alla à Béer et y demeura, loin d’Abimélek, son frère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּנָס
  choice: s’enfuit
  rationale: Le verbe נוס exprime la fuite devant un danger ; « s’enfuit » est naturel et précis dans un récit.
- source_word: וַיִּבְרַח
  choice: se sauva
  rationale: Le verbe ברח renforce l’idée de fuite. Une formulation distincte conserve le redoublement hébreu sans répéter exactement le même verbe en français.
- source_word: בְּאֵרָה
  choice: à Béer
  rationale: La forme s’analyse comme le nom de lieu בְּאֵר, « Béer », suivi du ה directionnel, d’où « à Béer ». Le ה final n’appartient donc pas au nom propre.
- source_word: וַיֵּשֶׁב שָׁם
  choice: Il y resta
  rationale: Dans ce contexte, ישב indique que Yotam demeure sur place. « Il y resta » est idiomatique et n’impose pas l’idée d’une installation permanente.
- source_word: מִפְּנֵי
  choice: loin de
  rationale: L’expression signifie littéralement « loin de la présence de » et indique ici que Yotam demeure hors de portée d’Abimélek.
- source_word: אָחִיו
  choice: son frère
  rationale: Le lien familial est explicitement conservé, car il accentue la tension du récit.
