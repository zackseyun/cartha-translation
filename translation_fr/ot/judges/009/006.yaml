base_translation:
  language: en
  yaml_path: translation/ot/judges/009/006.yaml
  text: Then all the leaders of Shechem and all Beth-millo gathered together[b][a], and they went and made Abimelech king beside the oak pillar that was in Shechem.
translation:
  language: fr
  text: Alors tous les notables de Sichem et tous ceux de Beth-Millo[a] se rassemblèrent. Ils allèrent établir Abimélek roi près du chêne de la stèle[b], à Sichem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beth-Millo peut signifier « la maison de Millo », mais l’expression désigne probablement un lieu ou un groupe; son référent exact est incertain.
    reason: cultural_note
  - marker: b
    text: Ou « près du chêne du monument » ou « près du chêne de la pierre dressée ». L’expression hébraïque est difficile, et le sens exact de מֻצָּב est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי שְׁכֶם
  choice: les notables de Sichem
  rationale: Le terme désigne littéralement les maîtres ou détenteurs d’autorité de Sichem. « Notables » exprime naturellement leur statut civique et politique sans en faire des seigneurs féodaux ni englober nécessairement toute la population.
- source_word: בֵּית מִלּוֹא
  choice: la maison de Millo
  rationale: L’expression peut désigner un groupe, un clan ou un lieu portant ce nom. La traduction garde le sens formel de בֵּית tout en conservant « Millo » comme nom propre; une note signale l’incertitude du référent.
- source_word: וַיַּמְלִיכוּ אֶת אֲבִימֶלֶךְ לְמֶלֶךְ
  choice: établir Abimélek comme roi
  rationale: Le hifil de מלך signifie faire régner ou instituer comme roi. « Établir ... comme roi » rend l’acte sans ajouter un couronnement ou une proclamation que le texte ne précise pas.
- source_word: עִם
  choice: près de
  rationale: Dans ce contexte local, la préposition indique la proximité du lieu où Abimélek est fait roi par rapport au repère mentionné.
- source_word: אֵלוֹן
  choice: chêne
  rationale: Le mot désigne un grand arbre, traditionnellement identifié comme un chêne ou un térébinthe. « Chêne » est une formulation conventionnelle et lisible, sans prétendre régler avec certitude l’espèce botanique.
- source_word: מֻצָּב
  choice: stèle
  rationale: Le mot évoque quelque chose de dressé ou mis en place. « Stèle » convient à un repère vertical ou commémoratif, mais le sens exact et le rapport syntaxique avec l’arbre restent incertains; cette difficulté est conservée dans une note.
- source_word: וַיֵּאָסְפוּ
  choice: se rassemblèrent
  rationale: Cette formulation française naturelle rend directement l’action collective exprimée par le verbe.
