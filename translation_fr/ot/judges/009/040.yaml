  text: וַ/יִּרְדְּפֵ֣/הוּ אֲבִימֶ֔לֶךְ וַ/יָּ֖נָס מִ/פָּנָ֑י/ו וַֽ/יִּפְּל֛וּ חֲלָלִ֥ים רַבִּ֖ים עַד פֶּ֥תַח הַ/שָּֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/040.yaml
  text: Abimelech pursued him[a], and he fled before him; and many slain fell as far as the entrance of the gate.
translation:
  language: fr
  text: Abimélek le poursuivit, et Gaal[a] s’enfuit devant lui. Beaucoup d’hommes tombèrent, frappés à mort, jusqu’à l’entrée de la porte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il s’enfuit ». Il s’agit de Gaal, mentionné au verset précédent.'
    reason: clarification_du_référent
lexical_decisions:
- source_word: וַיִּרְדְּפֵהוּ
  choice: le poursuivit
  rationale: Le verbe רדף désigne couramment la poursuite d’un ennemi; « le poursuivit » conserve directement le pronom objet masculin.
- source_word: וַיָּנָס מִפָּנָיו
  choice: Gaal s’enfuit devant lui
  rationale: נוס signifie « fuir », et מִפָּנָיו exprime ici la fuite devant le poursuivant. Le nom « Gaal », repris du verset précédent, lève en français une ambiguïté pronominale gênante sans changer le référent.
- source_word: וַיִּפְּלוּ חֲלָלִים רַבִּים
  choice: Beaucoup d’hommes tombèrent, frappés à mort
  rationale: La formulation conserve l’image vive de נפל, « tomber », tout en rendant חֲלָלִים, les hommes transpercés ou tués au combat. « Hommes » est implicite dans le substantif pluriel humain et produit un français naturel.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: jusqu’à l’entrée de la porte de la ville
  rationale: La traduction suit les éléments « jusqu’à », « entrée/ouverture » et « porte ». L’ajout « de la ville » explicite le sens contextuel de la porte urbaine, plutôt qu’une porte ordinaire.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La tournure « tombèrent, frappés à mort » préserve l’image guerrière hébraïque sans employer le calque peu naturel « beaucoup de tués tombèrent ». Le nom Abimélek suit une translittération française courante.
