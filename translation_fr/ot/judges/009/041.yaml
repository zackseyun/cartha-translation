  text: וַ/יֵּ֥שֶׁב אֲבִימֶ֖לֶךְ בָּ/ארוּמָ֑ה וַ/יְגָ֧רֶשׁ זְבֻ֛ל אֶת גַּ֥עַל וְ/אֶת אֶחָ֖י/ו מִ/שֶּׁ֥בֶת בִּ/שְׁכֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/041.yaml
  text: And Abimelech stayed in Arumah[a], and Zebul drove Gaal and his brothers out from dwelling in Shechem.
translation:
  language: fr
  text: Abimélek resta à Arouma, et Zéboul chassa Gaal et ses frères, les empêchant ainsi d’habiter à Sichem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: Dans ce contexte narratif, « resta » rend naturellement le fait qu’Abimélek demeure ou prend position à Arouma, sans suggérer nécessairement une résidence durable.
- source_word: בָּארוּמָה
  choice: à Arouma
  rationale: Le nom de lieu est translittéré selon l’usage français; « à » est la préposition idiomatique devant un nom de ville.
- source_word: וַיְגָרֶשׁ
  choice: chassa
  rationale: Le verbe גרשׁ exprime une expulsion énergique. « Chassa » est naturel et conserve cette force sans évoquer une sentence juridique formelle.
- source_word: זְבֻל
  choice: Zéboul
  rationale: Translittération française usuelle du nom propre, avec accents facilitant la prononciation.
- source_word: גַּעַל
  choice: Gaal
  rationale: Translittération simple et lisible du nom propre; le français courant n’emploie pas nécessairement de signe pour représenter l’ayin.
- source_word: אֶחָיו
  choice: ses frères
  rationale: Le terme désigne normalement les frères. Rien dans le contexte n’impose le sens élargi de parents ou de compagnons.
- source_word: מִשֶּׁבֶת
  choice: les empêchant ainsi d’habiter
  rationale: La construction מן avec l’infinitif de ישׁב exprime ici l’exclusion ou l’empêchement de résider. Cette formulation française explicite naturellement le rapport entre l’expulsion et l’impossibilité d’habiter à Sichem.
- source_word: בִּשְׁכֶם
  choice: à Sichem
  rationale: « Sichem » est la forme française traditionnelle du nom de lieu; « à » convient idiomatiquement à une ville.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La phrase conserve l’enchaînement du texte hébreu tout en rendant explicitement, sans surinterprétation, la valeur d’exclusion portée par מִשֶּׁבֶת.
