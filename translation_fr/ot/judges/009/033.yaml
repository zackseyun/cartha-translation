  text: וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ כִּ/זְרֹ֣חַ הַ/שֶּׁ֔מֶשׁ תַּשְׁכִּ֖ים וּ/פָשַׁטְתָּ֣ עַל הָ/עִ֑יר וְ/הִנֵּה ה֞וּא וְ/הָ/עָ֤ם אֲשֶׁר אִתּ/וֹ֙ יֹצְאִ֣ים אֵלֶ֔י/ךָ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֖ר תִּמְצָ֥א יָדֶֽ/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/033.yaml
  text: Then in the morning[a], as soon as the sun rises, you must get up early and spread out against the city. And look, when he and the people who are with him come out to you, you shall do to him as your hand finds.
translation:
  language: fr
  text: Alors, au matin, dès que le soleil se lèvera, tu te lèveras de bonne heure et tu te déploieras contre la ville. Voici que lui et les gens qui sont avec lui sortiront vers toi ; tu lui feras ce que ta main trouvera à faire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon ce que ta main trouvera » ; expression signifiant : selon ce que tu auras la capacité ou l’occasion de faire.'
    reason: L’image idiomatique hébraïque est conservée dans le texte et explicitée pour le lecteur moderne.
lexical_decisions:
- source_word: וְהָיָה בַבֹּקֶר
  choice: Alors, au matin
  rationale: La tournure וְהָיָה fait progresser les instructions. « Alors » exprime naturellement cette succession, tandis que « au matin » rend l’indication temporelle.
- source_word: כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: dès que le soleil se lèvera
  rationale: La construction infinitive avec כ marque le moment de l’action. « Dès que » convient à l’urgence du plan sans modifier son contenu.
- source_word: תַּשְׁכִּים
  choice: tu te lèveras de bonne heure
  rationale: Le hiphil de שׁכם désigne le fait de se lever ou de se mettre en route tôt. Le futur français prend ici une valeur injonctive adaptée aux instructions.
- source_word: וּפָשַׁטְתָּ עַל הָעִיר
  choice: tu te déploieras contre la ville
  rationale: Dans un contexte militaire, פשט peut évoquer le déploiement, l’incursion ou l’assaut. « Se déployer contre » conserve l’image et évite de préciser indûment la forme exacte de l’attaque.
- source_word: וְהִנֵּה
  choice: Voici que
  rationale: Cette expression attire l’attention sur le développement annoncé et conserve la force présentative de l’hébreu dans un registre français digne.
- source_word: הוּא וְהָעָם אֲשֶׁר אִתּוֹ
  choice: lui et les gens qui sont avec lui
  rationale: עָם désigne ici le groupe qui accompagne le chef. « Les gens » reste assez large pour ne pas imposer « soldats » ou « troupes ».
- source_word: יֹצְאִים אֵלֶיךָ
  choice: sortiront vers toi
  rationale: אֵלֶיךָ indique littéralement une direction vers l’interlocuteur. Le contexte peut être hostile, mais « vers toi » préserve la formulation directionnelle sans expliciter davantage.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: tu lui feras
  rationale: Le suffixe masculin singulier est conservé. Il vise d’abord le chef, même s’il peut éventuellement le représenter avec son groupe.
- source_word: כַּאֲשֶׁר תִּמְצָא יָדֶךָ
  choice: ce que ta main trouvera à faire
  rationale: Cette formulation maintient l’image hébraïque de la main tout en ajoutant « à faire », nécessaire à l’intelligibilité en français. L’expression concerne ce que permettent la capacité ou l’occasion.
theological_decisions: []
translation_notes:
  register: Français international actuel, sobre et narratif. Le futur a valeur d’instruction. La répétition temporelle (« au matin », « dès que le soleil se lèvera », « de bonne heure ») est maintenue parce qu’elle reflète l’insistance du texte hébreu. L’expression idiomatique finale et le singulier « lui » sont conservés afin de ne pas effacer les particularités ni l’éventuelle portée représentative de l’original.
