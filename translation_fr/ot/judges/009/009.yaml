source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ הַ/זַּ֔יִת הֶ/חֳדַ֨לְתִּי֙ אֶת דִּשְׁנִ֔/י אֲשֶׁר בִּ֛/י יְכַבְּד֥וּ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/009.yaml
  text: But the olive tree said to them[a], ‘Should I stop producing my oil, by which gods and men are honored[b], and go to sway over the trees?’
translation:
  language: fr
  text: 'Mais l’olivier leur répondit : « Renoncerais-je à ma richesse[b], grâce à laquelle les dieux et les hommes sont honorés[a], pour aller me balancer au-dessus des arbres ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu et les hommes ». L’hébreu emploie une forme plurielle, mais celle-ci peut aussi être comprise ici comme désignant Dieu.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « ma graisse », image évoquant la production riche de l’olivier, en particulier son huile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזַּיִת
  choice: l’olivier
  rationale: Dans cette fable, le nom désigne l’arbre personnifié; « l’olivier » est l’expression française naturelle.
- source_word: הֶחֳדַלְתִּי
  choice: Renoncerais-je à
  rationale: Le parfait a ici une valeur interrogative et rhétorique après l’invitation des arbres. Le conditionnel français restitue naturellement cette objection.
- source_word: דִּשְׁנִי
  choice: ma richesse
  rationale: Le nom signifie littéralement « graisse, abondance, richesse » et évoque ici le produit généreux de l’olivier, notamment son huile, sans nommer explicitement celle-ci.
- source_word: אֲשֶׁר בִּי
  choice: grâce à laquelle
  rationale: Cette formulation exprime la valeur instrumentale de la proposition relative dans un français fluide.
- source_word: יְכַבְּדוּ
  choice: sont honorés
  rationale: Le verbe hébreu est actif avec un sujet non exprimé. Le passif français maintient ce sujet indéterminé et met l’accent sur l’honneur rendu.
- source_word: אֱלֹהִים
  choice: les dieux
  rationale: La forme nominale est plurielle et s’inscrit ici dans une construction associant les dieux et les humains. La lecture « Dieu » demeure possible et est signalée en note.
- source_word: וַאֲנָשִׁים
  choice: et les hommes
  rationale: Dans le couple proverbial « dieux et hommes », « les hommes » rend naturellement le pluriel humain générique.
- source_word: וְהָלַכְתִּי לָנוּעַ
  choice: pour aller me balancer
  rationale: La tournure conserve le mouvement d’oscillation de l’arbre tout en laissant entendre avec ironie la position dominante qu’on lui propose.
- source_word: עַל הָעֵצִים
  choice: au-dessus des arbres
  rationale: Cette traduction conserve à la fois l’image spatiale de la fable et sa portée royale implicite.
theological_decisions:
- issue: Référent de אֱלֹהִים
  choice: les dieux
  alternative: Dieu
  rationale: La forme plurielle et son association avec « les hommes » favorisent « les dieux ». Une tradition ancienne comprend toutefois le vrai Dieu, notamment en raison de l’emploi de l’huile d’olive dans le culte; cette ambiguïté est conservée en note.
translation_notes:
  register: Français international actuel, naturel et digne. Le discours direct garde le ton rhétorique de la fable. « Me balancer au-dessus » préserve le jeu d’image entre le mouvement des branches et la domination proposée.
