base_translation:
  language: en
  yaml_path: translation/ot/judges/009/011.yaml
  text: But the fig tree said to them[a], ‘Should I stop producing my sweetness and my good fruit, and go to sway over the trees?’
translation:
  language: fr
  text: 'Mais le figuier leur répondit : « Devrais-je cesser de produire ma douceur et mon bon fruit et aller me balancer au-dessus des arbres[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « régner sur les arbres ». Le verbe hébreu signifie littéralement se mouvoir ou se balancer ; dans le contexte de la fable, il peut aussi suggérer l’exercice de la royauté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Mais ... répondit
  rationale: Le waw fait progresser le récit; « mais » rend le contraste de ce nouveau refus, tandis que « répondit » est naturel dans ce dialogue fabuleux.
- source_word: הַתְּאֵנָה
  choice: le figuier
  rationale: Le nom désigne ici le figuier personnifié, personnage qui prend la parole.
- source_word: הֶחֳדַלְתִּי
  choice: Devrais-je renoncer à
  rationale: Dans cette question rhétorique, la forme accomplie a une valeur délibérative. « Renoncer à » exprime naturellement l'idée de cesser ou d'abandonner ce qui caractérise le figuier.
- source_word: מָתְקִי
  choice: ma douceur
  rationale: Cette traduction conserve le substantif abstrait et la personnification, sans le réduire à « mes fruits sucrés ».
- source_word: תְּנוּבָתִי הַטּוֹבָה
  choice: mon bon fruit
  rationale: תְּנוּבָה désigne le produit ou le fruit; au singulier collectif, « mon bon fruit » convient naturellement au figuier.
- source_word: וְהָלַכְתִּי
  choice: pour aller
  rationale: La tournure française relie naturellement la seconde action à la question délibérative et en fait la conséquence du renoncement envisagé.
- source_word: לָנוּעַ
  choice: régner
  rationale: Dans le contexte de la fable royale, le verbe évoque l'exercice de l'autorité. « Régner » rend clairement cette implication en français; la note conserve le sens concret inhabituel de mouvement ou de balancement.
- source_word: עַל הָעֵצִים
  choice: sur les arbres
  rationale: La préposition exprime ici une position d'autorité; « régner sur » est l'expression française idiomatique.
theological_decisions:
- issue: Portée royale de לָנוּעַ dans la fable
  choice: régner sur les arbres
  alternative: se balancer au-dessus des arbres
  rationale: Le contexte porte sur l'établissement d'un roi, mais le choix lexical hébreu maintient un jeu d'image arboricole. Le texte français privilégie l'intelligibilité de la fonction royale, et la note signale l'image littérale afin de préserver la tension.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La question rhétorique et la personnification du figuier sont conservées. « Mon bon fruit » garde le singulier collectif de l'hébreu; la note restitue le jeu de mots difficilement reproductible entre mouvement de l'arbre et domination royale.
