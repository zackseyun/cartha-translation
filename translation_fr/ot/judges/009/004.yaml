base_translation:
  language: en
  yaml_path: translation/ot/judges/009/004.yaml
  text: And they gave him seventy pieces of silver from the house of Baal-berith[a], and with them Abimelek hired worthless and reckless men[c][b], and they followed him.
translation:
  language: fr
  text: Ils lui donnèrent soixante-dix pièces d’argent[a] de la maison de Baal-Berith[b]. Avec cet argent, Abimélek engagea des hommes sans valeur et téméraires[c], qui le suivirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soixante-dix sicles d’argent ». L’hébreu dit littéralement « soixante-dix d’argent »; la somme était vraisemblablement exprimée selon un poids.
    reason: lexical_alternative
  - marker: b
    text: Ou « du temple de Baal-Berith ». L’hébreu dit « de la maison de Baal-Berith »; dans un contexte cultuel, « maison » peut désigner un sanctuaire ou un temple.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « des hommes vides et téméraires »; ou « des hommes sans valeur et irréfléchis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים כֶּסֶף
  choice: soixante-dix pièces d’argent
  rationale: L’hébreu dit littéralement « soixante-dix d’argent » et désigne une somme évaluée au poids. « Pièces d’argent » exprime naturellement la valeur monétaire sans préciser à tort une unité absente du texte.
- source_word: מִבֵּית בַּעַל בְּרִית
  choice: prises dans le temple de Baal-Berith
  rationale: בַּיִת signifie littéralement « maison », mais peut désigner un temple dans un contexte cultuel. Ici, « temple » rend clairement la fonction du bâtiment; une note conserve le sens littéral.
- source_word: וַיִּשְׂכֹּר בָּהֶם
  choice: Avec cet argent, Abimélek engagea
  rationale: La préposition בְּ indique que l’argent est le moyen de paiement. La reprise au singulier collectif « cet argent » est idiomatique en français.
- source_word: אֲנָשִׁים רֵיקִים
  choice: des hommes sans valeur
  rationale: רֵיקִים signifie littéralement « vides », mais qualifie ici des hommes dépourvus de valeur morale ou sociale. « Sans valeur » garde cette appréciation dépréciative sans introduire une catégorie juridique.
- source_word: וּפֹחֲזִים
  choice: et téméraires
  rationale: Le terme évoque des hommes indisciplinés, irréfléchis et instables. « Téméraires » rend leur propension à agir sans prudence, tout en laissant en note l’alternative « irréfléchis ».
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: qui le suivirent
  rationale: L’expression signifie littéralement « ils allèrent derrière lui » et indique ici qu’ils se rallièrent à Abimélek. La relative produit une phrase française naturelle sans changer le rapport logique.
