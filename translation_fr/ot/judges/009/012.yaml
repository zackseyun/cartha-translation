  text: וַ/יֹּאמְר֥וּ הָ/עֵצִ֖ים לַ/גָּ֑פֶן לְכִי אַ֖תְּ מלוכי עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/012.yaml
  text: Then the trees said to the vine[a], ‘Come, reign over us.’
translation:
  language: fr
  text: 'Alors les arbres dirent à la vigne : « Viens, règne sur nous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Alors ... dirent
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession en français, tandis que le passé simple conserve un registre narratif digne.
- source_word: הָעֵצִים
  choice: les arbres
  rationale: Dans le contexte de la fable de Yotam, le pluriel עֵצִים désigne les arbres, non le bois comme matériau.
- source_word: לַגָּפֶן
  choice: à la vigne
  rationale: גֶּפֶן désigne la vigne; ce terme français est précis, courant et convient à sa personnification.
- source_word: לְכִי
  choice: Viens
  rationale: Bien que הלך signifie littéralement « aller » ou « marcher », l’impératif suivi d’un autre impératif fonctionne ici comme une invitation à agir. « Viens » est l’expression française naturelle.
- source_word: אַתְּ
  choice: implicite dans l’impératif « règne »
  rationale: Le pronom féminin singulier souligne en hébreu l’adresse à la vigne. En français, le sujet « tu » est normalement omis à l’impératif, sans perte de sens.
- source_word: מְלֹכִי
  choice: règne
  rationale: L’impératif féminin singulier de מלך exprime l’exercice de la royauté. « Règne » rend directement cette valeur verbale et s’accorde naturellement avec « sur nous ».
- source_word: עָלֵינוּ
  choice: sur nous
  rationale: Avec מלך, עַל indique ceux sur qui s’exerce le règne; « régner sur » est la tournure française habituelle.
