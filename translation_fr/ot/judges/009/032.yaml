id: JDG.9.32
reference: Judges 9:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּה֙ ק֣וּם לַ֔יְלָה אַתָּ֖ה וְ/הָ/עָ֣ם אֲשֶׁר אִתָּ֑/ךְ וֶ/אֱרֹ֖ב בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/032.yaml
  text: Now then[a], arise by night, you and the people who are with you[b], and lie in wait in the field.
translation:
  language: fr
  text: Maintenant donc, lève-toi de nuit[a], toi et le peuple qui est avec toi, et poste-toi en embuscade[b] dans la campagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pendant la nuit ». L’expression hébraïque indique une action nocturne sans préciser nécessairement « cette nuit ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tiens-toi à l’affût ». Le verbe hébreu signifie se tenir caché dans l’attente de quelqu’un, souvent en vue d’une embuscade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Marque la transition vers une instruction immédiate tout en conservant la force de וְ et de עַתָּה dans un français naturel.
- source_word: קוּם
  choice: lève-toi
  rationale: Rend directement l’impératif de קום et convient au ton d’un ordre tactique.
- source_word: לַיְלָה
  choice: de nuit
  rationale: Rend l’emploi adverbial indiquant que l’action doit se faire pendant la nuit, sans imposer nécessairement le sens plus précis de « cette nuit ».
- source_word: אַתָּה
  choice: toi
  rationale: Conserve le pronom explicite et emphatique de l’hébreu, en distinguant l’interlocuteur du groupe qui l’accompagne.
- source_word: וְהָעָם אֲשֶׁר אִתָּךְ
  choice: et le peuple qui est avec toi
  rationale: Traduction directe qui n’interprète pas עָם comme « troupes » ou « hommes », même si le contexte est militaire.
- source_word: וֶאֱרֹב
  choice: et poste-toi en embuscade
  rationale: Exprime l’action de prendre position pour guetter, plutôt que l’attaque elle-même, et restitue naturellement l’impératif coordonné en français.
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: Dans ce contexte tactique, שָׂדֶה désigne vraisemblablement l’espace découvert hors de la ville ; « la campagne » est plus idiomatique ici que « le champ » sans complément.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le ton direct d’un ordre militaire, conserve l’accent porté par le pronom « toi » et évite de préciser davantage que l’hébreu l’identité du groupe accompagnateur.
