source:
  edition: WLC
  text: הָל֤וֹךְ הָֽלְכוּ֙ הָ/עֵצִ֔ים לִ/מְשֹׁ֥חַ עֲלֵי/הֶ֖ם מֶ֑לֶךְ וַ/יֹּאמְר֥וּ לַ/זַּ֖יִת מלוכ/ה עָלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/008.yaml
  text: The trees once went to anoint a king over themselves[a], and they said to the olive tree, ‘Reign over us.’
translation:
  language: fr
  text: 'Les arbres se mirent en route pour oindre un roi qui régnerait sur eux[a]. Ils dirent à l’olivier : « Règne sur nous ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une tournure intensive, littéralement « allant, ils allèrent ». On pourrait aussi traduire : « Les arbres allèrent résolument oindre un roi qui régnerait sur eux. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ הָלְכוּ
  choice: se mirent en route
  rationale: L’infinitif absolu suivi du verbe conjugué souligne l’action d’aller. « Se mirent en route » rend naturellement en français cette tournure marquée et l’idée d’une démarche entreprise, sans reproduire artificiellement la répétition hébraïque.
- source_word: הָעֵצִים
  choice: les arbres
  rationale: Dans la fable de Yotam, le pluriel désigne clairement les arbres personnifiés.
- source_word: לִמְשֹׁחַ
  choice: pour oindre
  rationale: Le verbe משׁח évoque l’onction qui installe quelqu’un dans la fonction royale. « Oindre » conserve cette image concrète et sa portée politico-religieuse.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: un roi qui régnerait sur eux
  rationale: La préposition עַל exprime ici la domination exercée sur les arbres. Cette formulation française évite l’expression peu naturelle « oindre un roi sur eux » tout en conservant explicitement le rapport d’autorité.
- source_word: לַזַּיִת
  choice: à l’olivier
  rationale: זַיִת peut désigner l’olive ou l’olivier ; ici, l’interlocuteur personnifié est l’arbre.
- source_word: מְלֹכָה עָלֵינוּ
  choice: Règne sur nous !
  rationale: L’impératif de מלך appelle l’olivier à exercer la royauté ; avec עַל, « régner sur » rend précisément la domination demandée.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Oindre » est maintenu malgré son registre légèrement soutenu, car il préserve l’image institutionnelle centrale du texte. La syntaxe explicite la relation de règne impliquée par l’hébreu sans en modifier le sens.
