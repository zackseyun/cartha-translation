revisions:
- from: 'Ah ! si seulement ce peuple était sous mon pouvoir[a] ! Je me débarrasserais alors d’Abimélek. Puis il lança à Abimélek[b] : « Renforce ton armée et viens m’affronter ! »'
  to: 'Si seulement[a] ce peuple était entre mes mains ! Alors j’écarterais Abimélek. Et il dit à Abimélek[b] : « Augmente ton armée et sors ! »'
  rationale: La révision maintient l’optatif et la menace volontairement indéterminée, restitue la métaphore de la main, et évite d’ajouter au dernier impératif l’idée explicite d’un combat contre le locuteur. Les deux ancres de note sont conservées et leurs contenus correspondent à la formulation révisée.
