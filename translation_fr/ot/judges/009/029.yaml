  text: וּ/מִ֨י יִתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/אָסִ֖ירָה אֶת אֲבִימֶ֑לֶךְ וַ/יֹּ֨אמֶר֙ לַ/אֲבִימֶ֔לֶךְ רַבֶּ֥ה צְבָאֲ/ךָ֖ וָ/צֵֽאָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/029.yaml
  text: If only this people were in my hand[a], then I would remove Abimelek. And he said to Abimelek[b], “Increase your army and come out!”
translation:
  language: fr
  text: 'Si seulement[a] ce peuple était entre mes mains ! Alors j’écarterais Abimélek. Et il dit à Abimélek[b] : « Augmente ton armée et sors ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Qui donnera ce peuple entre mes mains ? » L’hébreu emploie cette question comme une expression de souhait.'
    reason: lexical_alternative
  - marker: b
    text: Le défi est adressé à Abimélek, peut-être comme une apostrophe provocatrice plutôt que directement en sa présence.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִי יִתֵּן
  choice: Ah ! si seulement
  rationale: L’expression idiomatique introduit un souhait vif plutôt qu’une véritable question. Cette tournure française naturelle en conserve la force optative.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Le nom collectif singulier désigne ici l’ensemble des gens concernés, sans le réduire à une armée.
- source_word: בְּיָדִי
  choice: sous mon pouvoir
  rationale: Littéralement « dans ma main » ; l’expression désigne le contrôle ou l’autorité. La formulation française transmet clairement le sens de la métaphore.
- source_word: וְאָסִירָה
  choice: Je me débarrasserais
  rationale: Le hifil de סוּר signifie écarter ou enlever. Cette traduction rend la menace sans préciser indûment s’il s’agit de destituer, chasser ou tuer Abimélek.
- source_word: וַיֹּאמֶר לַאֲבִימֶלֶךְ
  choice: Puis il lança à Abimélek
  rationale: La préposition ל marque naturellement le destinataire. « Lança » convient au ton de défi, tout en laissant la note signaler qu’il peut s’agir d’une apostrophe rhétorique.
- source_word: רַבֶּה צְבָאֲךָ
  choice: Renforce ton armée
  rationale: L’impératif de רבה invite Abimélek à rendre ses forces plus nombreuses ou plus puissantes. « Renforce » est idiomatique en français et couvre ces deux nuances.
- source_word: וָצֵאָה
  choice: viens m’affronter
  rationale: Le verbe signifie littéralement « sors ». Dans ce défi militaire, « viens m’affronter » explicite naturellement la portée pragmatique sans changer l’action appelée.
theological_decisions:
- issue: Nature de l’élimination annoncée contre Abimélek
  choice: Je me débarrasserais alors d’Abimélek
  alternative: J’écarterais Abimélek
  rationale: Le texte ne précise pas si Gaal envisage la mort, l’expulsion ou la destitution. La traduction conserve cette indétermination.
- issue: Destinataire du défi
  choice: à Abimélek
  alternative: au sujet d’Abimélek
  rationale: La construction hébraïque favorise l’adresse à Abimélek, mais le contexte permet qu’elle soit rhétorique plutôt que prononcée directement devant lui ; cette nuance est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Les exclamations rendent la bravade de Gaal. « Sous mon pouvoir » évite le calque peu naturel « dans ma main », tandis que la note préserve la forme hébraïque. Les noms suivent la graphie française Abimélek.
