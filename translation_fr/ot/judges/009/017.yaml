source:
  edition: WLC
  text: אֲשֶׁר נִלְחַ֥ם אָבִ֖/י עֲלֵי/כֶ֑ם וַ/יַּשְׁלֵ֤ךְ אֶת נַפְשׁ/וֹ֙ מִ/נֶּ֔גֶד וַ/יַּצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/017.yaml
  text: because my father fought for you[a], cast his life in front of him[b], and delivered you from the hand of Midian.
translation:
  language: fr
  text: car mon père a combattu pour vous, a risqué sa vie[a] et vous a délivrés du pouvoir de Madian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « a jeté sa vie devant lui », expression signifiant qu’il s’est exposé à un danger mortel.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de la main de Madian ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: car
  rationale: Dans le contexte, le relatif introduit le motif qui fonde le reproche de Yotam; « car » rend clairement cette valeur causale.
- source_word: נִלְחַם ... עֲלֵיכֶם
  choice: a combattu pour vous
  rationale: Le nifal de לחם désigne le combat, et עַל exprime ici l’avantage ou l’intérêt des destinataires, comme le confirme leur délivrance de Madian.
- source_word: וַיַּשְׁלֵךְ אֶת נַפְשׁוֹ מִנֶּגֶד
  choice: a risqué sa vie
  rationale: L’expression hébraïque, littéralement proche de « jeter sa vie devant/loin de soi », signifie s’exposer à un danger mortel; l’expression française restitue naturellement cet idiome.
- source_word: וַיַּצֵּל
  choice: a délivrés
  rationale: Le hifil de נצל signifie arracher au danger, secourir ou délivrer; « délivrés » convient au contexte militaire.
- source_word: מִיַּד מִדְיָן
  choice: du pouvoir de Madian
  rationale: La « main » représente ici la puissance ou la domination. La formulation idiomatique française rend le sens sans obscurité.
