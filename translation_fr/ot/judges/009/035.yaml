  text: וַ/יֵּצֵא֙ גַּ֣עַל בֶּן עֶ֔בֶד וַ/יַּעֲמֹ֕ד פֶּ֖תַח שַׁ֣עַר הָ/עִ֑יר וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ מִן הַ/מַּאְרָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/035.yaml
  text: Then Gaal son of Ebed went out and stood at the entrance of the city gate[b][a], and Abimelech and the people who were with him rose from the ambush.
translation:
  language: fr
  text: Gaal, fils d’Ébed, sortit et se tint à l’entrée de la porte de la ville. Alors Abimélek et les gens qui étaient avec lui se levèrent de l’embuscade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de leur position d’embuscade ». Le mot hébreu peut désigner soit l’embuscade elle-même, soit l’endroit où les hommes se tiennent cachés pour la tendre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe יצא exprime un mouvement vers l’extérieur. « Sortit » est naturel en français et ne précise pas davantage le point de départ.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: Gaal, fils d’Ébed
  rationale: Les noms sont translittérés selon l’usage français; la construction patronymique hébraïque est rendue directement par « fils de ».
- source_word: וַיַּעֲמֹד
  choice: se tint
  rationale: עמד signifie ici se tenir ou prendre position. « Se tint » conserve la sobriété du récit sans ajouter une nuance militaire explicite.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: à l’entrée de la porte de la ville
  rationale: Cette formulation conserve la relation entre « entrée/ouverture » et « porte de la ville », malgré une légère redondance naturelle au cadre architectural ancien.
- source_word: וַיָּקָם
  choice: surgirent
  rationale: Dans ce contexte tactique, קום décrit le passage soudain à l’action depuis une position cachée. « Surgirent » rend naturellement cette force narrative en français.
- source_word: וְהָעָם אֲשֶׁר אִתּוֹ
  choice: et les gens qui étaient avec lui
  rationale: עם désigne littéralement le peuple ou les gens. La formulation reste proche de l’hébreu sans imposer « soldats » ou « troupes ».
- source_word: מִן הַמַּאְרָב
  choice: de l’embuscade
  rationale: מַאְרָב peut désigner l’embuscade ou la position depuis laquelle elle est tendue. Le texte principal retient l’expression française la plus naturelle, et la note préserve l’autre possibilité.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le rythme narratif est direct. « Les gens » conserve le sens large de עם, tandis que « surgirent » rend idiomatiquement l’action soudaine indiquée par le contexte.
