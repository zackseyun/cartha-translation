base_translation:
  language: en
  yaml_path: translation/ot/judges/009/027.yaml
  text: And they went out into the field and gathered the grapes from their vineyards and trod them[a], and they held a festival[b]. Then they went into the house of their god and ate and drank and cursed Abimelek.
translation:
  language: fr
  text: Ils sortirent dans la campagne, vendangèrent leurs vignes, foulèrent le raisin et firent la fête[a]. Puis ils entrèrent dans la maison de leur dieu[b], mangèrent, burent et maudirent Abimélek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « célébrèrent une fête des vendanges » ou « se livrèrent aux réjouissances ». Le terme hébreu désigne une célébration festive, probablement liée aux vendanges.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la maison de leurs dieux ». La forme hébraïque peut se lire au pluriel, bien qu’elle désigne probablement ici une seule divinité, celle qui était honorée dans ce sanctuaire.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ הַשָּׂדֶה
  choice: Ils sortirent dans les champs
  rationale: La forme directive exprime un mouvement vers l’espace cultivé hors de la ville. Le pluriel français « les champs » est naturel tout en conservant cette idée.
- source_word: וַיִּבְצְרוּ אֶת כַּרְמֵיהֶם
  choice: vendangèrent leurs vignes
  rationale: בצר désigne précisément la récolte du raisin. « Vendanger leurs vignes » rend cette action avec concision et naturel en français.
- source_word: וַיִּדְרְכוּ
  choice: foulèrent le raisin
  rationale: Dans ce contexte, דרך désigne le foulage des raisins. L’objet implicite est explicité en français afin que l’action soit immédiatement compréhensible.
- source_word: וַיַּעֲשׂוּ הִלּוּלִים
  choice: firent la fête
  rationale: הִלּוּלִים évoque ici des réjouissances festives, vraisemblablement liées aux vendanges. Cette formulation naturelle préserve le caractère général du terme sans préciser un rite non explicite.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: la maison de leur dieu
  rationale: « Maison » reste proche de בֵּית sans imposer le sens plus interprétatif de « temple ». אֱלֹהֵיהֶם peut être pluriel dans sa forme, mais désigne vraisemblablement ici la divinité particulière honorée dans ce sanctuaire.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: mangèrent, burent
  rationale: La traduction directe conserve la succession sobre des actions sans ajouter l’idée explicite de banquet.
- source_word: וַיְקַלְלוּ אֶת אֲבִימֶלֶךְ
  choice: maudirent Abimélek
  rationale: Au piel, קלל signifie couramment « maudire » ; ce choix garde la force de l’acte dirigé contre Abimélek.
theological_decisions:
- issue: Nombre de אֱלֹהֵיהֶם dans un contexte de culte païen
  choice: leur dieu
  alternative: leurs dieux
  rationale: La forme hébraïque permet morphologiquement une lecture plurielle, mais le contexte immédiat paraît viser la divinité particulière du sanctuaire. Une note conserve l’autre lecture sans imposer une conclusion théologique.
translation_notes:
  register: Français international moderne, narratif et digne. « Vendangèrent » et « foulèrent le raisin » conservent le cadre concret de la récolte tout en restant aisément compréhensibles. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
