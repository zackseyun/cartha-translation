base_translation:
  language: en
  yaml_path: translation/ot/judges/009/038.yaml
  text: Then Zebul said to him[a], “Where is your mouth now, you who said, ‘Who is Abimelech, that we should serve him?’ Is this not the people whom you despised? Go out now and fight against them.”
translation:
  language: fr
  text: 'Alors Zeboul lui dit : « Où est donc ta bouche[a], toi qui disais : “Qui est Abimélek, pour que nous le servions ?” N’est-ce pas ce peuple que tu méprisais ? Sors donc maintenant et combats-le ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Où est donc ta bouche ? » Cette expression raille ses paroles pleines d’assurance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה אֵפוֹא פִיךָ
  choice: Où est donc ta bouche
  rationale: 'La formulation conserve l’image vive et moqueuse de l’hébreu : Zeboul renvoie Gaal à ses paroles arrogantes. Une note en explicite la valeur idiomatique.'
- source_word: אֲשֶׁר תֹּאמַר
  choice: toi qui disais
  rationale: Le relatif désigne directement l’interlocuteur comme l’auteur des propos antérieurs ; l’imparfait convient au rappel de cette déclaration.
- source_word: מִי אֲבִימֶלֶךְ כִּי נַעַבְדֶנּוּ
  choice: Qui est Abimélek, pour que nous le servions ?
  rationale: Cette traduction garde la question rhétorique et le mépris exprimé envers l’autorité d’Abimélek.
- source_word: הֲלֹא זֶה הָעָם
  choice: N’est-ce pas là le peuple
  rationale: La tournure interrogative conserve la force provocatrice de הֲלֹא et « le peuple » rend directement le collectif hébreu.
- source_word: מָאַסְתָּה בּוֹ
  choice: que tu méprisais
  rationale: Le verbe exprime ici le rejet teinté de mépris, en accord avec la raillerie de Zeboul.
- source_word: צֵא נָא עַתָּה
  choice: Sors donc maintenant
  rationale: L’impératif commande à Gaal de sortir de la ville pour livrer bataille ; « donc » rend ici la nuance pressante et provocatrice de נָא sans suggérer une demande polie.
- source_word: וְהִלָּחֶם בּוֹ
  choice: et combats-le
  rationale: Le suffixe hébreu est grammaticalement singulier et reprend le nom collectif « le peuple » ; le pronom français singulier maintient cette concordance.
