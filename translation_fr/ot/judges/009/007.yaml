base_translation:
  language: en
  yaml_path: translation/ot/judges/009/007.yaml
  text: And they told Jotham[a], and he went and stood on the top of Mount Gerizim, and he lifted up his voice and called out and said to them, “Listen to me, leaders of Shechem[b], that God may listen to you.”
translation:
  language: fr
  text: 'On en informa Yotam. Il alla se placer au sommet du mont Garizim, puis il éleva la voix et leur lança cet appel : « Écoutez-moi, dirigeants de Sichem[a], afin que Dieu vous écoute[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « maîtres de Sichem ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et que Dieu vous écoute » ; autre possibilité : « et puisse Dieu vous écouter ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּדוּ לְיוֹתָם
  choice: On en informa Yotam
  rationale: Le hiphil de נגד signifie « informer, rapporter ». Le sujet pluriel indéfini se rend naturellement en français par « on » ; « en » reprend les événements précédents sans ajouter d’objet absent du verset.
- source_word: וַיֵּלֶךְ וַיַּעֲמֹד
  choice: Il alla se placer
  rationale: Cette formulation française naturelle conserve le déplacement suivi de la prise de position exprimés par les deux verbes hébreux.
- source_word: בְּרֹאשׁ הַר גְּרִזִים
  choice: au sommet du mont Garizim
  rationale: רֹאשׁ a ici son sens topographique de « sommet ». « Mont Garizim » est la forme française courante du toponyme.
- source_word: וַיִּשָּׂא קוֹלוֹ וַיִּקְרָא וַיֹּאמֶר
  choice: puis il éleva la voix et leur lança cet appel
  rationale: « Éleva la voix » restitue l’idiome hébreu, tandis que « lança cet appel » exprime l’appel public à haute voix sans reproduire lourdement les trois verbes coordonnés.
- source_word: שִׁמְעוּ אֵלַי
  choice: Écoutez-moi
  rationale: Traduction directe et idiomatique de l’impératif de שמע avec אֶל.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: dirigeants de Sichem
  rationale: Dans ce contexte, בְּעָלִים désigne les détenteurs de l’autorité à Sichem. « Dirigeants » est clair en français moderne ; la note conserve la valeur plus littérale de « maîtres ».
- source_word: וְיִשְׁמַע אֲלֵיכֶם אֱלֹהִים
  choice: afin que Dieu vous écoute
  rationale: Le waw suivi de l’imparfait peut exprimer ici le but ou le résultat après l’impératif. La répétition d’« écouter » reflète celle de שמע dans les deux membres.
theological_decisions:
- issue: Valeur de la proposition finale de Yotam
  choice: afin que Dieu vous écoute
  alternative: et que Dieu vous écoute / et puisse Dieu vous écouter
  rationale: L’hébreu permet soit une relation de but ou de résultat, soit un souhait coordonné. Le texte principal retient la première lecture, qui rend bien la réciprocité rhétorique, tandis que la note signale l’autre possibilité sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. La parataxe hébraïque est légèrement fluidifiée, sans perte d’information. Les deux marqueurs de note [a] et [b] figurent dans le texte principal.
