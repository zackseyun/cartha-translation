  yaml_path: translation/ot/judges/009/042.yaml
  text: And it happened on the next day that the people went out into the field[a], and it was reported to Abimelek.
translation:
  language: fr
  text: Le lendemain, le peuple sortit dans les champs, et on en informa Abimélek.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Le lendemain
  rationale: La formule narrative situe simplement l’événement au jour suivant. En français moderne, « Le lendemain » rend naturellement l’ensemble sans reproduire lourdement l’hébraïsme « et il arriva ».
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe יצא exprime ici le mouvement hors de la ville; le passé simple convient au récit suivi.
- source_word: הָעָם
  choice: le peuple
  rationale: Le nom collectif עם désigne la population comme groupe, sans limiter le référent aux hommes.
- source_word: הַשָּׂדֶה
  choice: dans les champs
  rationale: שׂדה désigne ici l’espace ouvert ou cultivé hors de la ville. Le pluriel idiomatique français « dans les champs » exprime naturellement ce cadre, malgré le singulier hébreu collectif.
- source_word: וַיַּגִּדוּ
  choice: on l’annonça
  rationale: Le pluriel hébreu a un sujet indéfini, littéralement « ils annoncèrent ». Le pronom indéfini « on » conserve cette indétermination en français; « l’ » reprend le fait que le peuple était sorti.
- source_word: לַאֲבִימֶלֶךְ
  choice: à Abimélek
  rationale: Le nom propre est translittéré sous la forme française courante « Abimélek ».
