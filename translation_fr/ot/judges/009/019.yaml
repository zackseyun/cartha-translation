  text: וְ/אִם בֶּ/אֱמֶ֨ת וּ/בְ/תָמִ֧ים עֲשִׂיתֶ֛ם עִם יְרֻבַּ֥עַל וְ/עִם בֵּית֖/וֹ הַ/יּ֣וֹם הַ/זֶּ֑ה שִׂמְחוּ֙ בַּ/אֲבִימֶ֔לֶךְ וְ/יִשְׂמַ֥ח גַּם ה֖וּא בָּ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/019.yaml
  text: And if today you have acted in truth and integrity toward Jerubbaal and toward his house[a], rejoice in Abimelech[c][b], and let him also rejoice in you.
translation:
  language: fr
  text: Et si, aujourd’hui[a], vous avez agi[b] en toute vérité et avec intégrité envers Yeroubbaal et sa maison[c], réjouissez-vous d’Abimélek, et que lui aussi se réjouisse de vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en ce jour ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vous avez traité Yeroubbaal et sa maison avec fidélité et intégrité ».'
    reason: lexical_alternative
  - marker: c
    text: Ici, « maison » peut désigner la maisonnée, la famille ou la dynastie.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Et si
  rationale: Conserve la conjonction et la condition, qui prolongent le raisonnement conditionnel du discours de Yotam.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: avec vérité et intégrité
  rationale: Reproduit les deux qualités morales du texte hébreu sans réduire אֱמֶת à la seule sincérité ni תָמִים à l’absence de faute.
- source_word: עֲשִׂיתֶם עִם
  choice: vous avez agi envers
  rationale: Rend naturellement l’idiome signifiant agir à l’égard de quelqu’un ou le traiter d’une certaine manière.
- source_word: יְרֻבַּעַל
  choice: Yeroubbaal
  rationale: Translittération française claire du nom hébreu.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: Préserve l’étendue possible du terme hébreu, qui peut désigner la maisonnée, la famille ou la dynastie.
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: Expression française actuelle correspondant naturellement à l’hébreu littéral « en ce jour ».
- source_word: שִׂמְחוּ בַּאֲבִימֶלֶךְ
  choice: réjouissez-vous d’Abimélek
  rationale: Conserve l’impératif et la réciprocité ironique ou rhétorique du passage, tout en rendant la préposition ב par la construction française habituelle avec « se réjouir ».
- source_word: וְיִשְׂמַח גַּם הוּא בָּכֶם
  choice: et que lui aussi se réjouisse de vous
  rationale: Le subjonctif introduit par « que » rend la valeur jussive du verbe et maintient le parallélisme avec l’impératif précédent.
