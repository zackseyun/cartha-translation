  text: וְ/אִם אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מֵ/אֲבִימֶ֔לֶךְ וְ/תֹאכַ֛ל אֶת בַּעֲלֵ֥י שְׁכֶ֖ם וְ/אֶת בֵּ֣ית מִלּ֑וֹא וְ/תֵצֵ֨א אֵ֜שׁ מִ/בַּעֲלֵ֤י שְׁכֶם֙ וּ/מִ/בֵּ֣ית מִלּ֔וֹא וְ/תֹאכַ֖ל אֶת אֲבִימֶֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/020.yaml
  text: But if not[a], let fire come out from Abimelech and consume the leaders of Shechem and Beth-millo[b]; and let fire come out from the leaders of Shechem and from Beth-millo and consume Abimelech.
translation:
  language: fr
  text: Mais s’il n’en est pas ainsi, qu’un feu sorte d’Abimélek et dévore les dirigeants de Sichem[a] et Beth-Millo[b] ; et qu’un feu sorte des dirigeants de Sichem et de Beth-Millo, et dévore Abimélek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les maîtres de Sichem ». L’expression hébraïque désigne les hommes qui détenaient l’autorité dans la ville, ou ses notables.
    reason: lexical_alternative
  - marker: b
    text: Beth-Millo peut aussi être rendu par « la maison de Millo » ; il s’agissait probablement d’un lieu ou d’un groupe dirigeant associé à Sichem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם אַיִן
  choice: Mais s’il n’en est pas ainsi
  rationale: Cette tournure française naturelle reprend la condition du verset précédent et conserve la valeur adversative et négative de l’hébreu.
- source_word: תֵּצֵא אֵשׁ
  choice: qu’un feu sorte
  rationale: Le yiqtol a ici une valeur jussive dans une imprécation. La formulation avec « que » rend cette malédiction ou ce souhait sans la réduire à une simple prédiction.
- source_word: מֵאֲבִימֶלֶךְ
  choice: d’Abimélek
  rationale: La préposition marque l’origine du feu et préserve l’image d’une force destructrice provenant d’Abimélek.
- source_word: וְתֹאכַל
  choice: et dévore
  rationale: Employé avec le feu, אכל signifie « dévorer » ou « consumer ». « Dévorer » conserve avec naturel la vigueur concrète de l’image hébraïque.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: les dirigeants de Sichem
  rationale: Dans ce contexte, le terme désigne les hommes influents ou détenteurs de l’autorité dans la ville, plutôt que l’ensemble de ses habitants.
- source_word: בֵּית מִלּוֹא
  choice: Beth-Millo
  rationale: La translittération traite l’expression comme le nom établi d’un lieu ou d’un groupe, tout en signalant en note l’alternative littérale.
- source_word: וְתֵצֵא אֵשׁ מִבַּעֲלֵי שְׁכֶם וּמִבֵּית מִלּוֹא
  choice: et qu’un feu sorte des dirigeants de Sichem et de Beth-Millo
  rationale: La construction parallèle à la première proposition préserve la structure de destruction réciproque de l’imprécation.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: Abimélek
  rationale: Le nom est conservé sans explicitation comme objet direct final, ce qui maintient la symétrie du verset.
theological_decisions:
- issue: Nature de l’image du feu
  choice: Conserver le « feu » comme image lexicale concrète dans une imprécation, sans préciser dans le texte principal s’il est littéral ou figuré.
  alternative: Interpréter explicitement le feu comme un conflit violent ou comme un feu directement envoyé par Dieu.
  rationale: L’hébreu emploie l’image concrète du feu et laisse ouverte sa réalisation. La traduction préserve cette tension ainsi que l’annonce d’une destruction mutuelle, sans imposer une interprétation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe jussive et le parallélisme ont été conservés afin de rendre la solennité de la malédiction et sa structure réciproque.
