  source_fidelity: 'La structure et les principaux sens du texte hébreu sont bien rendus : mort du juge, rechute, corruption aggravée par rapport aux pères, suivi d’autres dieux, service, prosternation et refus d’abandonner les pratiques et la conduite obstinée. Toutefois, « dans leurs anciennes voies » explicite un élément que le verbe יָשׁוּבוּ (« ils revenaient / retombaient ») ne formule pas directement.'
  naturalness: Le français est généralement clair et adapté à un registre narratif moderne. « Ils retombaient » est naturel sans le complément ajouté; « ne renonçaient ni à … ni à … » est plus idiomatique et symétrique que « n’abandonnaient rien de … ni de … ».
  terminology: « Le juge », « d’autres dieux », « les servir », « se prosterner devant eux » et « conduite obstinée » sont appropriés. « Pères » conserve le terme du texte et sa référence aux générations antérieures.
