    rationale: « Aucune de leurs actions ni leur voie dure » ne reproduit pas très naturellement la double construction avec מִן (« de leurs pratiques et de leur voie dure »). Une note plus fluide peut signaler l’image de « laisser tomber » tout en distinguant la formulation idiomatique du texte.
