base_translation:
  language: en
  yaml_path: translation/ot/judges/002/019.yaml
  text: And when the judge died[a], they turned back and acted more corruptly than their fathers, going after other gods to serve them and to bow down to them. They did not drop any of their deeds or their stubborn way.
translation:
  language: fr
  text: 'Quand le juge mourait, ils retombaient et se corrompaient plus que leurs pères : ils allaient après d’autres dieux pour les servir et se prosterner devant eux. Ils ne renonçaient ni à leurs pratiques ni à leur conduite obstinée.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ils ne laissaient tomber ni leurs pratiques ni leur voie dure. »'
    reason: La note signale l’image concrète du verbe hébreu (« laisser tomber ») et la formulation littérale de « voie dure », rendues idiomatiquement dans le texte par « ne renonçaient » et « conduite obstinée ».
lexical_decisions:
- source_word: וְהָיָה בְּמוֹת הַשּׁוֹפֵט
  choice: Quand le juge mourait
  rationale: La construction narrative introduit ici une circonstance temporelle récurrente dans le cycle décrit par le contexte. L’imparfait français exprime naturellement cette répétition.
- source_word: יָשֻׁבוּ
  choice: ils retombaient dans leurs anciennes voies
  rationale: Le verbe שׁוב marque une rechute après l’amélioration temporaire survenue du vivant du juge. Cette formulation française explicite naturellement l’idée de retour au comportement antérieur sans réduire le verbe à un simple déplacement.
- source_word: וְהִשְׁחִיתוּ מֵאֲבוֹתָם
  choice: se corrompaient plus encore que leurs pères
  rationale: Le hifil de שׁחת décrit ici une conduite corrompue, tandis que מִן introduit la comparaison. « Leurs pères » conserve le lien direct avec les générations précédentes.
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: ils allaient après d’autres dieux
  rationale: Cette traduction garde la métaphore hébraïque de la marche à la suite de divinités autres que le SEIGNEUR et exprime l’allégeance qui leur est accordée.
- source_word: לְעָבְדָם
  choice: pour les servir
  rationale: « Servir » est l’équivalent direct de עבד et conserve sa nuance cultuelle sans faire disparaître le geste distinct exprimé par le verbe suivant.
- source_word: וּלְהִשְׁתַּחֲוֺת לָהֶם
  choice: et se prosterner devant eux
  rationale: Le verbe désigne l’inclination profonde ou la prosternation en signe d’hommage. « Se prosterner devant » en préserve à la fois la dimension physique et cultuelle.
- source_word: לֹא הִפִּילוּ מִמַּעַלְלֵיהֶם
  choice: Ils n’abandonnaient rien de leurs pratiques
  rationale: Littéralement, le hifil de נפל avec מִן évoque le fait de laisser tomber. En français courant, « ne rien abandonner de » restitue clairement l’idée qu’ils ne renonçaient à aucune de leurs pratiques.
- source_word: וּמִדַּרְכָּם הַקָּשָׁה
  choice: ni de leur conduite obstinée
  rationale: דֶּרֶךְ désigne métaphoriquement la manière de vivre, et קָשֶׁה sa dureté morale. « Conduite obstinée » rend ce sens avec naturel et dignité.
theological_decisions:
- issue: Sens de אֱלֹהִים אֲחֵרִים dans le contexte de l’apostasie d’Israël
  choice: d’autres dieux
  alternative: des dieux étrangers
  rationale: « D’autres dieux » conserve l’opposition d’allégeance avec le SEIGNEUR sans ajouter une nuance ethnique ou géographique que l’hébreu n’impose pas.
- issue: Valeur temporelle de la mort du juge et des réactions d’Israël
  choice: 'imparfait itératif : « Quand le juge mourait, ils… »'
  alternative: 'passé simple ponctuel : « Quand le juge mourut, ils… »'
  rationale: Le contexte immédiat résume le cycle récurrent de la période des juges. L’imparfait français exprime ce caractère habituel tout en restant compatible avec la syntaxe hébraïque.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait souligne le cycle récurrent décrit dans le contexte. « Pères » garde la couleur biblique sans être obscur; « pratiques » et « conduite obstinée » rendent l’expression morale dans une langue immédiatement compréhensible.
