language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּעַזְב֞וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבוֹתָ֗/ם הַ/מּוֹצִ֣יא אוֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַ/יֵּלְכ֞וּ אַחֲרֵ֣י אֱלֹהִ֣ים אֲחֵרִ֗ים מֵ/אֱלֹהֵ֤י הָֽ/עַמִּים֙ אֲשֶׁר֙ סְבִיב֣וֹתֵי/הֶ֔ם וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם וַ/יַּכְעִ֖סוּ אֶת יְהוָֽה־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/012.yaml
  text: And they abandoned Yahweh[a], the God of their fathers, who had brought them out from the land of Egypt, and went after other gods from among the gods of the peoples who were around them, and they bowed down to them and provoked Yahweh to anger.
translation:
  language: fr
  text: Ils abandonnèrent Yahweh, le Dieu de leurs pères, qui les avait fait sortir du pays d’Égypte, et suivirent d’autres dieux[a], d’entre les dieux des peuples qui les entouraient ; ils se prosternèrent devant eux et provoquèrent la colère de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les dieux des peuples environnants ». L’expression hébraïque peut aussi désigner plus généralement les dieux adorés par les peuples qui entouraient Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: abandonnèrent
  rationale: Le verbe עזב exprime ici une désertion relationnelle et cultuelle, et non un simple départ physique. « Abandonnèrent » en conserve la force en français actuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que par un titre de substitution.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: le Dieu de leurs pères
  rationale: Cette formulation conserve l’expression masculine plurielle et sa portée historique et relationnelle.
- source_word: הַמּוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: qui les avait fait sortir du pays d’Égypte
  rationale: Le participe déterminé identifie Yahweh par l’acte de l’exode. Le plus-que-parfait convient à la séquence narrative française.
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: suivirent
  rationale: L’expression idiomatique indique ici l’adhésion et l’allégeance. « Suivirent » est naturel et fidèle en français.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: L’adjectif signifie directement « autres » ; « étrangers » ajouterait une nuance interprétative.
- source_word: מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבוֹתֵיהֶם
  choice: pris parmi les dieux des peuples qui les entouraient
  rationale: Le מִן est compris dans son sens partitif. « Pris parmi » rend clairement cette relation sans présenter les divinités comme réelles au-delà du point de vue du récit.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: se prosternèrent devant eux
  rationale: Le verbe désigne concrètement la prosternation et implique ici le culte idolâtre. La traduction conserve l’image plutôt que de la remplacer par son interprétation.
- source_word: וַיַּכְעִסוּ אֶת יְהוָה
  choice: provoquèrent la colère de Yahweh
  rationale: Cette tournure rend la valeur causative du hifil de כעס en français idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie directement le tétragramme. La translittération préserve le nom personnel sans lui substituer un titre.
- issue: Portée religieuse de l’abandon d’Israël
  choice: Conserver les actes explicites du texte sans ajouter « rompre l’alliance »
  alternative: Expliciter dans le corps du texte une rupture d’alliance
  rationale: L’abandon de Yahweh, l’adhésion à d’autres dieux, la prosternation et la colère provoquée portent déjà le poids théologique du passage ; aucune explication doctrinale supplémentaire n’est nécessaire.
- issue: Statut des « dieux » des peuples
  choice: Garder « dieux » sans guillemets ni paraphrase
  alternative: idoles / prétendus dieux
  rationale: Le texte les appelle אֱלֹהִים. Les remplacer par « idoles » ou « prétendus dieux » résoudrait une tension que le verset laisse intacte.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire tout en restant clair. Les propositions ont été réparties en deux phrases pour éviter une période excessivement longue, sans modifier leur enchaînement logique.
