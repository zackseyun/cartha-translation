  to: Ils abandonnèrent Yahweh, le Dieu de leurs pères, qui les avait fait sortir du pays d’Égypte, et suivirent d’autres dieux[a], d’entre les dieux des peuples qui les entouraient ; ils se prosternèrent devant eux et provoquèrent la colère de Yahweh.
