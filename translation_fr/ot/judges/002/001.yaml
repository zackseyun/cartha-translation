source:
  edition: WLC
  text: וַ/יַּ֧עַל מַלְאַךְ יְהוָ֛ה מִן הַ/גִּלְגָּ֖ל אֶל הַ/בֹּכִ֑ים וַ/יֹּאמֶר֩ אַעֲלֶ֨ה אֶתְ/כֶ֜ם מִ/מִּצְרַ֗יִם וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נִשְׁבַּ֨עְתִּי֙ לַ/אֲבֹ֣תֵי/כֶ֔ם וָ/אֹמַ֕ר לֹֽא אָפֵ֧ר בְּרִיתִ֛/י אִתְּ/כֶ֖ם לְ/עוֹלָֽם־־־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/001.yaml
  text: Then the angel of Yahweh went up from Gilgal to Bochim and said[a], “I brought you up from Egypt and brought you into the land that I swore to your fathers, and I said[b], ‘I will never break my covenant with you.’”
translation:
  language: fr
  text: 'L’ange de Yahweh[a] monta de Guilgal à Bokim[b] et dit : « Je vous ai fait monter d’Égypte[c] et je vous ai amenés dans le pays que j’avais promis par serment à vos pères, et j’ai dit : “Je ne romprai jamais mon alliance avec vous.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: Bokim signifie probablement « ceux qui pleurent » ou désigne un lieu de pleurs.
    reason: cultural_note
  - marker: c
    text: 'L’hébreu porte formellement : « Je vous ferai monter d’Égypte » ; dans le contexte, l’action passée de la sortie d’Égypte est rappelée.'
    reason: textual_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager ou un ange. « Ange » est le terme conventionnel et naturel dans ce récit, tandis qu’une note conserve l’autre possibilité. Le nom divin יְהוָה est translittéré « Yahweh ».
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה exprime un mouvement vers le haut. « Monta » en garde la valeur directionnelle et convient au déplacement entre les deux lieux.
- source_word: הַגִּלְגָּל
  choice: Guilgal
  rationale: Translittération française usuelle du nom de lieu.
- source_word: הַבֹּכִים
  choice: Bokim
  rationale: Le nom de lieu est conservé sous une forme adaptée au français; son lien avec les pleurs est indiqué en note.
- source_word: אַעֲלֶה אֶתְכֶם מִמִּצְרַיִם
  choice: Je vous ai fait sortir d’Égypte
  rationale: Bien que la forme hébraïque soit formellement un inaccompli (« je vous ferai monter »), le contexte est rétrospectif et le verbe suivant relate clairement une action passée. « Faire sortir » est l’expression française naturelle pour la délivrance d’Égypte; une note signale la forme du texte hébreu.
- source_word: וָאָבִיא אֶתְכֶם
  choice: et je vous ai conduits
  rationale: Le hiphil de בוא signifie faire venir ou faire entrer. « Conduire dans le pays » rend naturellement l’action et sa destination.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte territorial, « le pays » est naturel en français tout en conservant le thème biblique du pays promis.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתֵיכֶם
  choice: que j’avais juré de donner à vos pères
  rationale: Le complément implicite de la promesse est explicité minimalement en français afin d’éviter la tournure peu naturelle « le pays que j’avais juré à vos pères ». « Vos pères » conserve le masculin explicite et le contexte patriarcal.
- source_word: וָאֹמַר
  choice: J’avais déclaré
  rationale: Le plus-que-parfait situe cette déclaration divine par rapport aux actes passés qui viennent d’être rappelés, sans modifier son contenu.
- source_word: לֹא אָפֵר בְּרִיתִי אִתְּכֶם לְעוֹלָם
  choice: Jamais je ne romprai mon alliance avec vous
  rationale: הפר signifie rompre, annuler ou violer une alliance. La tournure avec « jamais » exprime naturellement la négation durable de לְעוֹלָם.
theological_decisions:
- issue: Identité de מַלְאַךְ יְהוָה
  choice: « L’ange de Yahweh », sans préciser sa nature
  alternative: « Le messager de Yahweh », compris soit comme un ange créé, soit comme une manifestation de Yahweh
  rationale: Le personnage est nommé ange ou messager de Yahweh, mais parle ensuite à la première personne comme Dieu. La traduction maintient cette tension sans trancher son identité.
- issue: Portée de la promesse d’alliance
  choice: Conserver l’affirmation absolue « Jamais je ne romprai mon alliance avec vous »
  alternative: Nuancer la promesse en fonction de l’infidélité d’Israël mentionnée dans les versets suivants
  rationale: Le verset formule la déclaration divine sans nuance. La traduction ne résout pas à l’avance la tension entre cette promesse et le reproche qui suit.
translation_notes:
  register: Français international moderne, clair et digne. La narration reste concise; les temps verbaux français rendent la rétrospective du discours. Les noms de lieux suivent des formes françaises courantes, et les notes préservent les ambiguïtés lexicales et verbales importantes.
