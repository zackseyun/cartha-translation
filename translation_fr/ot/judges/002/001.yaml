revisions:
- from: 'L’ange de Yahweh[a] monta de Guilgal à Bokim[b] et dit : « Je vous ai fait sortir d’Égypte[c] et je vous ai conduits dans le pays que j’avais juré de donner à vos pères. J’avais déclaré : “Jamais je ne romprai mon alliance avec vous.” »'
  to: 'L’ange de Yahweh[a] monta de Guilgal à Bokim[b] et dit : « Je vous ai fait monter d’Égypte[c] et je vous ai amenés dans le pays que j’avais promis par serment à vos pères, et j’ai dit : “Je ne romprai jamais mon alliance avec vous.” »'
  rationale: La révision conserve les choix lexicaux et les notes utiles du projet, mais rétablit la coordination narrative de « et j’ai dit ». Elle rend explicitement la montée hors d’Égypte et reformule le serment relatif au pays dans un français idiomatique, sans imposer d’interprétation théologique.
