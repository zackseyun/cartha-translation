  text: וַ/יַּעַזְב֖וּ אֶת יְהוָ֑ה וַ/יַּעַבְד֥וּ לַ/בַּ֖עַל וְ/לָ/עַשְׁתָּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/013.yaml
  text: They abandoned Yahweh and served Baal and the Ashtoreths[a][b][c].
translation:
  language: fr
  text: Ils abandonnèrent Yahweh et servirent Baal et les Astartés[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rendirent un culte à Baal et aux Astartés » ou « adorèrent Baal et les Astartés ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici un pluriel, « les Astartés » ; celui-ci peut désigner plusieurs manifestations ou représentations de la déesse également appelée Ashtoreth ou Astarté.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: abandonnèrent
  rationale: Le verbe עזב signifie « quitter, délaisser, abandonner ». « Abandonnèrent » est naturel en français moderne et exprime clairement la déloyauté envers Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיַּעַבְדוּ
  choice: servirent
  rationale: עבד peut signifier « servir » et, dans un contexte cultuel, « rendre un culte ». « Servirent » conserve l'étendue sémantique du verbe hébreu.
- source_word: לַבַּעַל
  choice: Baal
  rationale: Bien que l'hébreu comporte l'article, le nom de cette divinité se rend naturellement par « Baal » en français.
- source_word: וְלָעַשְׁתָּרוֹת
  choice: les Astartés
  rationale: Le pluriel français « les Astartés » représente la forme hébraïque plurielle עַשְׁתָּרוֹת et emploie le nom usuel Astarté, sans réduire le texte à une divinité singulière.
theological_decisions:
- issue: Valeur du pluriel עַשְׁתָּרוֹת
  choice: les Astartés
  alternative: Astarté
  rationale: La forme hébraïque est plurielle. Le texte principal maintient cette pluralité, qui peut désigner plusieurs manifestations, représentations ou figures cultuelles associées à la déesse.
- issue: Nuance cultuelle du verbe עבד
  choice: servirent
  alternative: rendirent un culte à
  rationale: « Servirent » conserve la largeur de sens du verbe source, tandis que le contexte rend manifeste sa portée religieuse.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Le nom divin est translittéré « Yahweh ». La formulation conserve le parallélisme des deux verbes hébreux et la pluralité du dernier nom.
