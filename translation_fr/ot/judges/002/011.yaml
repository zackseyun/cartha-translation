  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יַּעַבְד֖וּ אֶת הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/011.yaml
  text: And the sons of Israel did what was evil in the sight of Yahweh[b][a], and they served the Baals.
translation:
  language: fr
  text: Les fils d’Israël firent ce qui est mal aux yeux de Yahweh et servirent les Baals.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: firent
  rationale: Le verbe עשה signifie couramment « faire ». Avec « ce qui est mal », « firent » rend naturellement l’idiome hébreu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression familiale littérale de l’hébreu; « les Israélites » serait une formulation française plus idiomatique, mais moins formelle.
- source_word: אֶת־הָרַע
  choice: ce qui est mal
  rationale: Cette tournure française naturelle restitue l’idiome hébreu littéralement proche de « faire le mal » sans en affaiblir la portée morale.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La formulation conserve la métaphore hébraïque de l’évaluation divine et demeure claire en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַיַּעַבְדוּ
  choice: servirent
  rationale: Le verbe עבד peut désigner le service, y compris le culte rendu à une divinité. « Servirent » en préserve l’étendue sémantique et le contraste d’allégeance.
- source_word: הַבְּעָלִים
  choice: les Baals
  rationale: Le pluriel français conserve le pluriel hébreu, qui renvoie aux diverses manifestations locales ou représentations de Baal.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom propre יהוה. « Yahweh » le représente directement et évite de le remplacer par un titre.
- issue: Sens cultuel du verbe עבד
  choice: servirent
  alternative: adorèrent; rendirent un culte à
  rationale: Le contexte implique un culte idolâtre, mais « servirent » reste au plus près du verbe hébreu et maintient le thème plus large de l’allégeance à une divinité.
translation_notes:
  register: Français moderne, digne et direct. La structure coordonnée du verset et les métaphores hébraïques sont conservées sans produire une syntaxe artificielle.
