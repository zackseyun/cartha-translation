  text: וַ/יְהִ֗י כְּ/דַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/004.yaml
  text: And when the angel of Yahweh spoke these words to all the sons of Israel[b][a], the people raised their voices and wept.
translation:
  language: fr
  text: Lorsque l’ange de Yahweh[a] eut adressé ces paroles à tous les Israélites[b], le peuple éleva la voix et pleura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le messager de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à tous les fils d’Israël ».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: Quand … eut adressé
  rationale: La construction avec וַיְהִי et l’infinitif construit introduit ici une proposition temporelle. Le passé antérieur exprime naturellement, dans un récit soutenu, que la prise de parole précède immédiatement la réaction du peuple.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager humain ou céleste. Dans cette expression biblique consacrée, « ange » est naturel, tandis qu’une note conserve l’autre sens possible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin plutôt que par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: Dans ce contexte, דְּבָרִים renvoie au discours qui vient d’être prononcé; « paroles » en garde clairement la dimension verbale.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: à tous les Israélites
  rationale: « Israélites » rend naturellement en français la désignation collective בְּנֵי יִשְׂרָאֵל. La formulation littérale « fils d’Israël » est signalée en note.
- source_word: וַיִּשְׂאוּ הָעָם אֶת קוֹלָם וַיִּבְכּוּ
  choice: le peuple se mit à pleurer à haute voix
  rationale: Cette formulation française restitue conjointement l’idiome « élever la voix » et le verbe « pleurer », sans suggérer à tort que le peuple prend simplement la parole ou hausse le ton.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Nature du מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Le mot מַלְאַךְ demeure lexicalement ambigu entre « ange » et « messager ». Le contexte et l’usage biblique français favorisent « ange » dans le corps du texte, mais la note maintient l’alternative sans trancher davantage l’identité du personnage.
translation_notes:
  register: Français international moderne, sobre et digne. La réaction finale est formulée idiomatiquement pour conserver à la fois l’élévation de la voix et les pleurs, sans lourdeur hébraïsante.
