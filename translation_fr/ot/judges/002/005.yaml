  text: וַֽ/יִּקְרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בֹּכִ֑ים וַ/יִּזְבְּחוּ שָׁ֖ם לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/005.yaml
  text: So they called the name of that place Bochim[a], and they sacrificed there to Yahweh.
translation:
  language: fr
  text: Ils donnèrent à ce lieu le nom de Bokim[a], et ils y offrirent des sacrifices à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bokim signifie en hébreu « ceux qui pleurent » ou « les pleureurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם הַמָּקוֹם הַהוּא
  choice: Ils appelèrent donc cet endroit
  rationale: La tournure hébraïque signifie littéralement « ils appelèrent le nom de ce lieu-là ». En français moderne, « appeler cet endroit » restitue naturellement l’acte de nommer; « donc » rend la relation narrative du וַ initial avec les pleurs du verset précédent.
- source_word: בֹּכִים
  choice: Bokim
  rationale: Le mot fonctionne ici comme un nom de lieu. Il est donc translittéré plutôt que traduit, tandis que son lien avec le verbe « pleurer » est signalé en note.
- source_word: וַיִּזְבְּחוּ
  choice: ils offrirent des sacrifices
  rationale: Le verbe זבח désigne l’action de sacrifier. Cette formulation est naturelle en français et évite l’éventuelle lecture intransitive de « ils sacrifièrent ».
- source_word: שָׁם
  choice: y
  rationale: Le pronom adverbial français renvoie naturellement à l’endroit qui vient d’être nommé.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque ici le destinataire des sacrifices, et le nom divin יהוה est rendu par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme, traité ici comme le nom propre de Dieu. « Yahweh » le distingue d’un simple titre tout en évitant d’introduire une paraphrase confessionnelle.
- issue: Traduction ou translittération de בֹּכִים
  choice: Bokim
  alternative: Ceux qui pleurent; les pleureurs
  rationale: Puisque בֹּכִים est employé comme toponyme, le corps du texte conserve le nom propre; sa valeur lexicale reste accessible grâce à la note.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au registre dignifié du récit biblique. La syntaxe est idiomatique sans effacer le toponyme hébreu ni son jeu de sens.
