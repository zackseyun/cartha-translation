id: JDG.2.22
reference: Judges 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְמַ֛עַן נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל הֲ/שֹׁמְרִ֣ים הֵם֩ אֶת דֶּ֨רֶךְ יְהוָ֜ה לָ/לֶ֣כֶת בָּ֗/ם כַּ/אֲשֶׁ֛ר שָׁמְר֥וּ אֲבוֹתָ֖/ם אִם לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/022.yaml
  text: in order to test Israel by them[a], whether they would keep the way of Yahweh by walking in it, as their fathers kept it, or not.
translation:
  language: fr
  text: afin de mettre Israël à l’épreuve par elles[a], pour savoir si les Israélites garderaient la voie de Yahweh en y marchant, comme leurs pères l’avaient gardée, ou non.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par leur moyen ». Le pronom hébreu renvoie aux nations laissées dans le pays (voir le contexte précédent).'
    reason: Signaler une autre formulation possible de la valeur instrumentale de בָּם et expliciter son antécédent.
lexical_decisions:
- source_word: לְמַעַן
  choice: afin de
  rationale: Introduit naturellement en français le but exprimé par la locution hébraïque.
- source_word: נַסּוֹת
  choice: mettre à l’épreuve
  rationale: Rend clairement l’idée de tester ou d’éprouver la fidélité d’Israël.
- source_word: בָּם
  choice: par elles
  rationale: Conserve le sens instrumental et renvoie aux nations laissées dans le pays, nom féminin pluriel en français.
- source_word: הֲשֹׁמְרִים הֵם
  choice: pour savoir si les Israélites garderaient
  rationale: Exprime le contenu de l’épreuve dans un français naturel tout en respectant le pluriel hébreu; la répétition d’« Israël » sous la forme « les Israélites » évite un pronom pluriel sans antécédent grammatical clair.
- source_word: דֶּרֶךְ יְהוָה
  choice: la voie de Yahweh
  rationale: Préserve l’image biblique d’une conduite prescrite par Yahweh et rend directement le nom divin.
- source_word: לָלֶכֶת בָּם
  choice: en y marchant
  rationale: Conserve la métaphore hébraïque de la marche; « y » reprend naturellement « la voie » en français.
- source_word: שָׁמְרוּ אֲבוֹתָם
  choice: leurs pères l’avaient gardée
  rationale: Maintient la répétition du verbe שמר et le terme ancestral masculin explicite; le plus-que-parfait situe naturellement leur conduite antérieure.
- source_word: אִם לֹא
  choice: ou non
  rationale: Achève idiomatiquement l’interrogation indirecte alternative.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » conserve le nom propre plutôt que de lui substituer un titre.
- issue: Terme ancestral אֲבוֹתָם
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: Le substantif hébreu est masculin pluriel et désigne ici les pères d’Israël; la formulation retenue en préserve la précision.
- issue: Valeur de l’épreuve divine
  choice: mettre Israël à l’épreuve
  alternative: tenter Israël
  rationale: « Mettre à l’épreuve » traduit נסה sans suggérer que Yahweh inciterait Israël au mal; il s’agit de révéler ou vérifier sa fidélité.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste un segment dépendant du verset précédent, conformément à la syntaxe du contexte. La métaphore « garder la voie » et « y marcher » est conservée pour maintenir le parallélisme et l’imagerie de l’hébreu.
