  text: גַּם אֲנִי֙ לֹ֣א אוֹסִ֔יף לְ/הוֹרִ֥ישׁ אִ֖ישׁ מִ/פְּנֵי/הֶ֑ם מִן הַ/גּוֹיִ֛ם אֲשֶׁר עָזַ֥ב יְהוֹשֻׁ֖עַ וַ/יָּמֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/021.yaml
  text: I also will no longer continue to drive out before them any of the nations that Joshua left when he died[a].
translation:
  language: fr
  text: Moi non plus, je ne continuerai plus à chasser de devant eux aucune des nations que Josué avait laissées lorsqu’il mourut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « que Josué avait laissées, et il mourut ». L’hébreu coordonne « et il mourut »; « lorsqu’il mourut » en exprime naturellement le rapport temporel en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Moi non plus
  rationale: Dans la portée de la négation qui suit, cette tournure française exprime naturellement l’emphase portée sur le sujet divin et la continuité avec la déclaration précédente.
- source_word: לֹא אוֹסִיף לְהוֹרִישׁ
  choice: je ne continuerai pas à chasser
  rationale: La construction négative avec יסף suivi de l’infinitif marque la cessation d’une action jusque-là poursuivie; « ne continuerai pas à » en conserve explicitement la valeur.
- source_word: אִישׁ מִן הַגּוֹיִם
  choice: une seule des nations
  rationale: אִישׁ a ici une valeur distributive et intensive, « pas même une »; cette formulation française rend clairement le partitif et l’insistance.
- source_word: מִפְּנֵיהֶם
  choice: devant eux
  rationale: Cette expression conserve l’image hébraïque de l’expulsion hors de leur présence tout en restant idiomatique en français.
- source_word: אֲשֶׁר עָזַב יְהוֹשֻׁעַ
  choice: que Josué avait laissées
  rationale: Le plus-que-parfait situe naturellement les nations demeurées dans le pays avant la mort de Josué; l’accord féminin reprend « nations ».
- source_word: וַיָּמֹת
  choice: à sa mort
  rationale: Cette expression rend avec fluidité le rapport temporel suggéré par la coordination hébraïque, sans changer l’identité du sujet.
theological_decisions:
- issue: Identification du locuteur divin
  choice: Maintenir la première personne sans ajouter « le SEIGNEUR »
  alternative: Expliciter « le SEIGNEUR » comme sujet
  rationale: L’hébreu emploie ici le pronom de première personne et le contexte identifie déjà le locuteur; ajouter le nom divin introduirait des mots absents du verset.
- issue: Relation de la mort de Josué avec les nations laissées
  choice: Rendre וַיָּמֹת par la relation temporelle « à sa mort »
  alternative: Traduire formellement « et il mourut »
  rationale: La coordination hébraïque demeure susceptible d’une traduction plus formelle; le texte principal explicite avec naturel la circonstance temporelle sans affirmer que Josué aurait volontairement épargné ces nations.
translation_notes:
  register: Français international moderne, digne et accessible. « Chasser » est plus courant que « déposséder » dans ce contexte; « une seule » préserve l’insistance distributive de l’hébreu. Le marqueur [a] figure dans le texte principal.
