revisions:
- from: Moi non plus, je ne continuerai pas à chasser devant eux une seule des nations que Josué avait laissées à sa mort[a].
  to: Moi non plus, je ne continuerai plus à chasser de devant eux aucune des nations que Josué avait laissées lorsqu’il mourut[a].
  rationale: La révision conserve le choix de rendre la valeur continue de יסף, mais ajoute « plus », indispensable pour exprimer la cessation. Elle remplace aussi « à sa mort » par « lorsqu’il mourut », plus clair quant au sujet et plus proche de la coordination hébraïque, puis corrige la note en conséquence.
