source:
  edition: WLC
  text: וַ/יְשַׁלַּ֥ח יְהוֹשֻׁ֖עַ אֶת הָ/עָ֑ם וַ/יֵּלְכ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אִ֥ישׁ לְ/נַחֲלָת֖/וֹ לָ/רֶ֥שֶׁת אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/006.yaml
  text: Then Joshua sent the people away[a], and the sons of Israel went, each man to his inheritance, to take possession of the land.
translation:
  language: fr
  text: Puis Josué renvoya le peuple, et les fils d’Israël[a] partirent, chacun vers son héritage, pour prendre possession du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ». Littéralement « les fils d’Israël ».
    reason: Alternative lexicale permettant de comprendre l’expression hébraïque collective tout en conservant sa forme dans le texte principal.
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: renvoya
  rationale: Dans ce contexte, שׁלח signifie congédier ou laisser repartir un groupe. « Renvoya » exprime naturellement cette idée en français sans ajouter de destination.
- source_word: הָעָם
  choice: le peuple
  rationale: L’hébreu dit simplement « le peuple ». La traduction conserve cette désignation sans expliciter « d’Israël », déjà clair dans le contexte.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression hébraïque masculine et sa portée collective. Une note signale l’équivalent français plus idiomatique « les Israélites ».
- source_word: אִישׁ
  choice: chacun
  rationale: Employé distributivement, אִישׁ indique que chaque membre ou groupe se rend à son propre héritage. « Chacun » restitue cette fonction avec naturel en français, sans imposer une répétition lourde de « chaque homme ».
- source_word: לְנַחֲלָתוֹ
  choice: vers son héritage
  rationale: נחלה désigne ici la part de territoire attribuée en héritage. « Héritage » préserve la résonance foncière et liée à l’alliance, tandis que « vers » convient au mouvement exprimé par le verbe partir.
- source_word: לָרֶשֶׁת
  choice: pour prendre possession de
  rationale: L’infinitif exprime le but du départ. « Prendre possession de » rend le sens actif de ירשׁ plus clairement que le seul verbe « posséder ».
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans le contexte de l’installation en Canaan, אֶרֶץ désigne le pays promis et attribué à Israël. « Le pays » est ici naturel en français et garde la référence territoriale précise.
theological_decisions:
- issue: Désignation collective d’Israël marquée au masculin
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal maintient la forme de l’expression hébraïque et son caractère corporatif, tandis que la note fournit l’équivalent idiomatique sans effacer la formulation source.
- issue: Terminologie de l’attribution du pays
  choice: héritage
  alternative: part attribuée
  rationale: « Héritage » conserve la portée théologique et liée à l’alliance de נחלה, sans réduire le territoire à une simple propriété.
translation_notes:
  register: Français international moderne, clair et digne. La coordination narrative est conservée par « Puis… et », et le vocabulaire foncier reste accessible tout en maintenant les résonances du texte hébreu.
