  text: וְ/גַ֣ם אָמַ֔רְתִּי לֹֽא אֲגָרֵ֥שׁ אוֹתָ֖/ם מִ/פְּנֵי/כֶ֑ם וְ/הָי֤וּ לָ/כֶם֙ לְ/צִדִּ֔ים וֵ/אלֹ֣הֵי/הֶ֔ם יִהְי֥וּ לָ/כֶ֖ם לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/003.yaml
  text: So I also said[a], ‘I will not drive them out from before you; they will become adversaries to you, and their gods will become a snare to you.’
translation:
  language: fr
  text: 'Alors, moi aussi, j’ai dit : « Je ne les chasserai pas devant vous. Ils deviendront pour vous des adversaires[a], et leurs dieux seront pour vous un piège. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « des côtés ». Certaines versions anciennes et des passages parallèles lisent ou comprennent : « des épines dans vos flancs ».'
    reason: Signaler la difficulté du texte massorétique et une variante ou interprétation ancienne largement attestée.
lexical_decisions:
- source_word: וְגַם אָמַרְתִּי
  choice: Alors, moi aussi, j’ai dit
  rationale: « Alors » relie la déclaration au reproche précédent, tandis que « moi aussi » conserve la valeur additive et emphatique de וְגַם sans transformer explicitement le lien en causalité.
- source_word: לֹא אֲגָרֵשׁ אוֹתָם
  choice: Je ne les chasserai pas
  rationale: Le verbe גרש exprime ici l’action de chasser ou d’expulser les peuples; cette formulation est courante et naturelle dans le contexte de la conquête.
- source_word: מִפְּנֵיכֶם
  choice: devant vous
  rationale: Cette expression garde l’image spatiale de l’hébreu tout en étant idiomatique en français.
- source_word: וְהָיוּ לָכֶם לְצִדִּים
  choice: Ils deviendront pour vous des adversaires
  rationale: Le mot לְצִדִּים signifie littéralement « pour des côtés », lecture difficile dans ce contexte. « Des adversaires » exprime naturellement l’hostilité impliquée sans introduire dans le texte principal le mot « épines », absent du texte massorétique fourni.
- source_word: וֵאלֹהֵיהֶם
  choice: et leurs dieux
  rationale: Traduction directe et habituelle du nom אלהים muni du suffixe possessif pluriel dans un contexte d’idolâtrie.
- source_word: יִהְיוּ לָכֶם לְמוֹקֵשׁ
  choice: seront pour vous un piège
  rationale: מוֹקֵשׁ désigne un piège ou un collet, souvent au sens figuré d’un danger qui entraîne à la faute. « Piège » conserve l’image dans un français actuel.
theological_decisions:
- issue: La lecture difficile לְצִדִּים dans le texte massorétique
  choice: des adversaires
  alternative: des épines dans vos flancs
  rationale: Le texte hébreu fourni porte littéralement « côtés » et non « épines ». Le corps du verset rend le sens hostile probable par « adversaires », tandis que la note signale avec transparence la formulation hébraïque et l’interprétation traditionnelle attestée par des versions anciennes et des passages parallèles.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct conserve la solennité du jugement sans archaïsmes. La répétition « pour vous » reflète la structure hébraïque et souligne les deux conséquences annoncées.
