  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּתְּנֵ/ם֙ בְּ/יַד שֹׁסִ֔ים וַ/יָּשֹׁ֖סּוּ אוֹתָ֑/ם וַֽ/יִּמְכְּרֵ֞/ם בְּ/יַ֤ד אֽוֹיְבֵי/הֶם֙ מִ/סָּבִ֔יב וְ/לֹֽא יָכְל֣וּ ע֔וֹד לַ/עֲמֹ֖ד לִ/פְנֵ֥י אוֹיְבֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/014.yaml
  text: Then the anger of Yahweh burned against Israel[a], and he gave them into the hand of plunderers, who plundered them. He sold them into the hand of their enemies all around[c][b], so that they could no longer stand before their enemies.
translation:
  language: fr
  text: Alors la colère de Yahweh s’enflamma contre Israël[a]. Il les livra au pouvoir de pillards, qui les pillèrent, et il les vendit au pouvoir des ennemis qui les entouraient[b]. Ils ne purent plus tenir devant leurs ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « la colère de Yahweh brûla contre Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans la main de leurs ennemis tout autour » ; « dans la main de » signifie ici « au pouvoir de ».'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: la colère ... s’enflamma
  rationale: Cette formulation française conserve l’image hébraïque d’une colère qui brûle tout en restant naturelle et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: il les livra au pouvoir de
  rationale: L’expression hébraïque « donner dans la main de » signifie placer sous le pouvoir de quelqu’un. La formulation retenue en donne clairement le sens en français moderne.
- source_word: שֹׁסִים ... וַיָּשֹׁסּוּ
  choice: des pillards, qui les pillèrent
  rationale: Le nom et le verbe apparentés reproduisent le lien lexical insistant de l’hébreu.
- source_word: וַיִּמְכְּרֵם
  choice: il les vendit
  rationale: Le sens concret de « vendre » est maintenu afin de préserver la force de l’image du jugement.
- source_word: אֹיְבֵיהֶם מִסָּבִיב
  choice: les ennemis qui les entouraient
  rationale: Cette tournure exprime naturellement que leurs ennemis se trouvaient tout autour d’eux, sans décider s’il s’agit d’un encerclement ponctuel ou d’ennemis établis de tous côtés.
- source_word: וְלֹא יָכְלוּ עוֹד לַעֲמֹד לִפְנֵי
  choice: ils ne purent plus tenir devant
  rationale: « Tenir devant » conserve l’image spatiale du texte et signifie ici résister ou maintenir sa position face à l’ennemi.
theological_decisions:
- issue: Langage anthropopathique décrivant la colère divine
  choice: la colère de Yahweh s’enflamma contre Israël
  alternative: Yahweh se mit en colère contre Israël
  rationale: Le choix conserve l’image vive de l’hébreu sans ajouter d’explication spéculative sur la nature de la colère divine.
- issue: Image de la vente comme acte de jugement
  choice: il les vendit au pouvoir des ennemis
  alternative: il les livra aux ennemis
  rationale: Le verbe « vendit » respecte la métaphore forte du texte et évite d’en atténuer la portée.
translation_notes:
  register: Français international moderne, narratif et digne. Les images hébraïques de la colère qui brûle et de la vente sont préservées, tandis que l’idiome « dans la main de » est rendu par son sens naturel en français.
