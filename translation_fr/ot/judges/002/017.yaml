id: JDG.2.17
reference: Judges 2:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/גַ֤ם אֶל שֹֽׁפְטֵי/הֶם֙ לֹ֣א שָׁמֵ֔עוּ כִּ֣י זָנ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֜רֶךְ אֲשֶׁ֨ר הָלְכ֧וּ אֲבוֹתָ֛/ם לִ/שְׁמֹ֥עַ מִצְוֺת יְהוָ֖ה לֹא עָ֥שׂוּ כֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/017.yaml
  text: Yet they did not listen even to their judges[a], for they prostituted themselves after other gods and bowed down to them. They quickly turned aside from the way in which their fathers had walked in obeying the commandments of Yahweh; they did not do so.
translation:
  language: fr
  text: Pourtant, ils n’écoutèrent même pas leurs juges, car ils se prostituèrent[a] à la suite d’autres dieux et se prosternèrent devant eux. Ils se détournèrent bien vite de la voie qu’avaient suivie leurs pères en obéissant aux commandements de Yahweh ; ils n’agirent pas comme eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici la métaphore de la prostitution pour évoquer l’idolâtrie et l’infidélité à l’alliance.
    reason: Préciser la portée figurée et théologique d’une expression volontairement forte.
lexical_decisions:
- source_word: וְגַם
  choice: Pourtant… même
  rationale: Cette formulation exprime à la fois le léger contraste avec le contexte précédent et l’insistance portée par la combinaison hébraïque.
- source_word: אֶל שֹׁפְטֵיהֶם לֹא שָׁמֵעוּ
  choice: ils n’écoutèrent même pas leurs juges
  rationale: « Écouter » conserve l’image hébraïque tout en impliquant clairement, dans ce contexte, le refus d’obéir.
- source_word: זָנוּ אַחֲרֵי
  choice: ils se prostituèrent en suivant
  rationale: Le verbe garde la métaphore forte de l’infidélité sexuelle appliquée à l’idolâtrie, tandis que « en suivant » rend naturellement l’idée de poursuivre d’autres dieux.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: et se prosternèrent devant eux
  rationale: La traduction préserve le geste corporel de prosternation qui, ici, constitue un acte d’adoration.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: Ils se détournèrent bien vite de la voie
  rationale: Cette formulation conserve la métaphore du chemin ainsi que l’idée de rapidité.
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם
  choice: qu’avaient suivie leurs pères
  rationale: « Suivre une voie » est naturel en français et restitue l’image de la marche sans lourdeur.
- source_word: לִשְׁמֹעַ מִצְוֺת יְהוָה
  choice: en obéissant aux commandements de Yahweh
  rationale: Avec « commandements », שׁמע signifie concrètement obéir. Le syntagme se rattache à la conduite des pères sur cette voie.
- source_word: לֹא עָשׂוּ כֵן
  choice: ils n’agirent pas comme eux
  rationale: 'Le pronom explicite naturellement en français la comparaison implicite : contrairement à leurs pères, ils n’obéirent pas aux commandements.'
theological_decisions:
- issue: Métaphore de l’infidélité d’alliance dans זָנוּ
  choice: Conserver la métaphore avec « ils se prostituèrent »
  alternative: « ils furent infidèles »
  rationale: L’hébreu emploie délibérément une image sexuelle forte pour qualifier l’idolâtrie et la rupture de fidélité envers Yahweh ; l’atténuer ferait perdre une dimension théologique du texte.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: La translittération conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- issue: Référent de לֹא עָשׂוּ כֵן
  choice: « ils n’agirent pas comme eux », en référence aux pères obéissants
  alternative: « ils ne firent pas ainsi »
  rationale: Le français explicite légèrement la comparaison requise par le contexte sans ajouter une conclusion doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit. Les images de la prostitution, de la prosternation et de la voie sont conservées, tout en évitant une syntaxe calquée sur l’hébreu.
