source:
  edition: WLC
  text: וְ/אַתֶּ֗ם לֹֽא תִכְרְת֤וּ בְרִית֙ לְ/יֽוֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִזְבְּחוֹתֵי/הֶ֖ם תִּתֹּצ֑וּ/ן וְ/לֹֽא שְׁמַעְתֶּ֥ם בְּ/קֹלִ֖/י מַה זֹּ֥את עֲשִׂיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/002.yaml
  text: And you were not to make a covenant with the inhabitants of this land; you were to tear down their altars[a]. But you have not listened to my voice. What is this you have done?
translation:
  language: fr
  text: Et vous, vous ne deviez pas conclure d’alliance avec les habitants de cette terre ; vous deviez démolir leurs autels. Mais vous n’avez pas écouté ma voix. Qu’est-ce donc que vous avez fait ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִכְרְתוּ בְרִית
  choice: conclure d’alliance
  rationale: L’expression française naturelle « conclure une alliance » rend l’idiome hébreu littéral « couper une alliance » tout en conservant la portée relationnelle et solennelle de בְּרִית.
- source_word: לְיֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: avec les habitants de ce pays
  rationale: « Habitants » rend clairement le participe substantivé יֹשְׁבֵי. Dans ce contexte territorial, « ce pays » exprime naturellement הָאָרֶץ הַזֹּאת.
- source_word: מִזְבְּחוֹתֵיהֶם תִּתֹּצוּן
  choice: vous deviez démolir leurs autels
  rationale: « Démolir » exprime le renversement destructeur indiqué par נתץ et convient idiomatiquement à des autels. L’imparfait d’obligation rappelle ici un commandement antérieur.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלִי
  choice: Mais vous n’avez pas écouté ma voix
  rationale: La formulation conserve l’image hébraïque de la voix et laisse le contexte faire ressortir l’idée d’obéissance impliquée par שמע בְּקוֹל. « Mais » marque naturellement le contraste avec le commandement rappelé.
- source_word: מַה זֹּאת עֲשִׂיתֶם
  choice: Qu’est-ce que vous avez fait là ?
  rationale: Cette tournure française restitue la surprise indignée de l’expression hébraïque sans la transformer en question sur le motif, comme le ferait « Pourquoi avez-vous fait cela ? ».
- source_word: וְאַתֶּם לֹא ... תִּכְרְתוּ ... תִּתֹּצוּן
  choice: Quant à vous, vous ne deviez pas… vous deviez…
  rationale: « Quant à vous » met en relief le pronom אַתֶּם. Les formes « ne deviez pas » et « deviez » présentent les imparfaits comme le rappel rétrospectif d’ordres divins, en accord avec le reproche qui suit.
theological_decisions:
- issue: Terminologie de בְּרִית pour la relation interdite avec les populations du pays
  choice: alliance
  alternative: traité
  rationale: « Alliance » préserve la catégorie biblique plus large de בְּרִית et n’en réduit pas le sens à un accord strictement diplomatique.
translation_notes:
  register: 'Français international moderne, digne et accessible. La syntaxe conserve la solennité du reproche tout en restant naturelle. Aucune note n’est nécessaire : contrairement à l’anglais fourni, le marqueur [a] ne correspond pas à une note pertinente pour « autels » et semble avoir été placé par erreur ; l’idiome « couper une alliance » ne gagne pas à être signalé dans une édition destinée au grand public.'
