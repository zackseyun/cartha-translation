  text: וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/008.yaml
  text: And Joshua son of Nun[a], the servant of Yahweh, died at the age of one hundred and ten years.
translation:
  language: fr
  text: Josué, fils de Noun, serviteur[a] de Yahweh, mourut à l’âge de cent dix ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclave ». Le mot hébreu peut avoir les deux sens ; ici, il sert de titre honorifique à Josué.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le wayyiqtol qal de מות poursuit la narration. En français, le passé simple « mourut » convient au registre narratif biblique actuel sans qu’il soit nécessaire de rendre mécaniquement וַ par « et ».
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française usuelle du nom propre hébreu.
- source_word: בִּן נוּן
  choice: fils de Noun
  rationale: La chaîne construite indique la filiation; « fils de Noun » est la formulation française naturelle et transparente.
- source_word: עֶבֶד יְהוָה
  choice: serviteur de Yahweh
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Ici, le terme constitue un titre honorifique marquant la relation de Josué à Yahweh; « serviteur » en restitue au mieux la valeur contextuelle, tandis qu’une note conserve l’autre possibilité lexicale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: à l’âge de cent dix ans
  rationale: Cette formulation idiomatique rend naturellement l’expression hébraïque de l’âge, littéralement construite avec « fils de », tout en conservant exactement le nombre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre et correspond à une vocalisation largement reçue, sans le remplacer par un titre.
- issue: Valeur de עֶבֶד dans le titre de Josué
  choice: serviteur
  alternative: esclave
  rationale: La polysémie du terme est réelle, mais son emploi ici est honorifique. « Serviteur » préserve cette fonction sans effacer l’alternative lexicale, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient la tenue narrative du passage; les noms sont donnés sous leurs formes françaises usuelles, à l’exception du nom divin translittéré « Yahweh ».
