  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּעַבְד֤וּ הָ/עָם֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשׁ֔וּעַ אֲשֶׁ֣ר רָא֗וּ אֵ֣ת כָּל מַעֲשֵׂ֤ה יְהוָה֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/007.yaml
  text: And the people served Yahweh all the days of Joshua[a], and all the days of the elders who lived on after Joshua, who had seen all the great work of Yahweh that he had done for Israel.
translation:
  language: fr
  text: Le peuple servit Yahweh pendant toute la vie de Josué et pendant toute la vie des anciens qui vécurent encore après Josué, eux qui avaient vu toute la grande œuvre[a] que Yahweh avait accomplie pour Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu « la grande œuvre » peut aussi se traduire par « le grand acte » ou « la grande action ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: servit
  rationale: Avec Yahweh comme complément, עבד exprime le service fidèle envers Dieu, notion plus large que le seul culte.
- source_word: הָעָם
  choice: le peuple
  rationale: עם désigne ici collectivement la communauté d’Israël.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte hébreu.
- source_word: כֹּל יְמֵי
  choice: pendant toute la vie de
  rationale: Dans ce contexte, l’expression idiomatique indique toute la durée de la vie des personnes mentionnées; cette formulation est naturelle en français moderne.
- source_word: הַזְּקֵנִים
  choice: les anciens
  rationale: Le terme désigne les hommes âgés reconnus comme responsables au sein d’Israël; « les anciens » conserve le sens social et lexical.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי
  choice: qui vécurent encore après
  rationale: L’expression signifie littéralement qu’ils prolongèrent leurs jours après Josué, c’est-à-dire qu’ils continuèrent à vivre après lui.
- source_word: רָאוּ
  choice: avaient vu
  rationale: Le plus-que-parfait marque naturellement l’expérience antérieure de ces anciens.
- source_word: כָּל מַעֲשֵׂה יְהוָה הַגָּדוֹל
  choice: toute la grande œuvre de Yahweh
  rationale: Le singulier collectif מַעֲשֶׂה désigne l’ensemble de ce que Yahweh a accompli; « œuvre » en préserve l’unité, tandis que « grande » traduit directement הַגָּדוֹל.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: avait accomplie pour Israël
  rationale: 'La préposition לְ a ici une valeur bénéficiaire: l’action a été accomplie en faveur d’Israël.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » le rend comme nom propre sans lui substituer un titre.
- issue: Portée du verbe עבד appliqué à Yahweh
  choice: servit
  alternative: adora
  rationale: « Servir » conserve la portée générale de fidélité et d’obéissance envers Yahweh, qui comprend le culte sans s’y limiter.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « pendant toute la vie » reflète la structure hébraïque tout en explicitant l’idiome « tous les jours de ». Le pronom renforcé « eux qui » rattache sans ambiguïté la dernière proposition aux anciens.
