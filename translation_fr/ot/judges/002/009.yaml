  yaml_path: translation/ot/judges/002/009.yaml
  text: And they buried him within the territory of his inheritance[a], in Timnath-heres, in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: fr
  text: On l’enterra dans le territoire qui lui avait été attribué, à Timnath-Hérès[a], dans la région montagneuse d’Éphraïm, au nord du mont Gaash.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Josué 24.30 donne « Timnath-Sérah » au lieu de « Timnath-Hérès ». Cette différence entre les noms de lieu est conservée dans ces deux récits parallèles de l’ensevelissement.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: On l’enterra
  rationale: Le wayyiqtol fait progresser le récit par un événement passé. Le pronom indéfini « on » rend naturellement en français le sujet pluriel non précisé, et « l’ » représente explicitement le complément masculin singulier.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: dans le territoire qui lui avait été attribué
  rationale: גְּבוּל désigne ici le territoire plutôt que sa seule frontière, et נַחֲלָה renvoie à la part foncière reçue en partage. Cette formulation française claire conserve l’idée d’un héritage territorial attribué sans suggérer nécessairement une succession familiale.
- source_word: בְּתִמְנַת חֶרֶס
  choice: à Timnath-Hérès
  rationale: Le nom de lieu est translittéré; « à » est la préposition française naturelle devant le nom d’une localité.
- source_word: בְּהַר אֶפְרָיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: Dans cette expression géographique, הַר désigne une région de montagnes ou de collines, non une montagne isolée.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: au nord du mont Gaash
  rationale: La construction situe Timnath-Hérès par rapport au mont Gaash. « Au nord de » est précis et idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste concise; les termes géographiques sont explicités seulement lorsque l’usage hébreu l’exige. L’accentuation des noms translittérés facilite la lecture française, tandis que « Gaash » conserve la graphie courante sans tréma ajouté.
