  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֗אמֶר יַעַן֩ אֲשֶׁ֨ר עָבְר֜וּ הַ/גּ֣וֹי הַ/זֶּ֗ה אֶת בְּרִיתִ/י֙ אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבוֹתָ֔/ם וְ/לֹ֥א שָׁמְע֖וּ לְ/קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/020.yaml
  text: So the anger of Yahweh burned against Israel[a], and he said, “Because this nation has transgressed my covenant that I commanded their fathers[b], and they have not listened to my voice,”
translation:
  language: fr
  text: 'Alors la colère de Yahweh s’enflamma contre Israël, et il dit : « Puisque cette nation a violé mon alliance, celle que j’avais prescrite à ses ancêtres, et qu’ils n’ont pas écouté ma voix… »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase se poursuit au verset 21; les points de suspension signalent que la déclaration de Yahweh n’est pas achevée ici.
    reason: discourse_structure
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: la colère … s’enflamma
  rationale: Cette formulation conserve la métaphore hébraïque de la colère qui devient brûlante tout en restant naturelle et digne en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּיִשְׂרָאֵל
  choice: contre Israël
  rationale: Avec un verbe de colère, la préposition désigne ici l’objet de cette colère.
- source_word: יַעַן אֲשֶׁר
  choice: Puisque
  rationale: Le groupe introduit la cause de la déclaration qui suit; « puisque » convient naturellement à une parole annonçant les conséquences de faits déjà établis.
- source_word: עָבְרוּ
  choice: a violé
  rationale: Avec « alliance » comme complément, le verbe עבר exprime le franchissement d’une limite et donc la violation de l’alliance. Le singulier s’accorde avec le nom collectif « nation ».
- source_word: הַגּוֹי הַזֶּה
  choice: cette nation
  rationale: « Nation » préserve le choix marqué de גוי pour désigner ici Israël, sans l’aplanir en « peuple ».
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: « Alliance » est le terme français usuel et précis pour ברית dans le cadre de la relation entre Yahweh et Israël.
- source_word: אֲשֶׁר צִוִּיתִי אֶת אֲבוֹתָם
  choice: celle que j’avais prescrite à ses ancêtres
  rationale: Le relatif explicite naturellement en français que l’alliance est ce que Yahweh avait imposé comme commandement aux générations antérieures. « Ancêtres » rend ici le sens collectif sans restriction au père immédiat.
- source_word: וְלֹא שָׁמְעוּ לְקוֹלִי
  choice: et qu’ils n’ont pas écouté ma voix
  rationale: Cette traduction conserve l’image auditive de l’hébreu tout en laissant entendre, sans l’expliciter excessivement, le refus d’obéir.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel et évite de le remplacer par un titre.
- issue: Langage de la violation de l’alliance
  choice: a violé mon alliance
  alternative: a rompu mon alliance; a transgressé mon alliance
  rationale: « Violer une alliance » exprime clairement l’emploi covenantal de עבר sans réduire la faute à une désobéissance générale. « Transgresser une alliance » serait plus formel mais moins idiomatique en français courant.
- issue: Portée de l’expression שמע בקול
  choice: n’ont pas écouté ma voix
  alternative: n’ont pas obéi à ma voix; ne m’ont pas obéi
  rationale: Le choix principal maintient la métaphore du texte source et sa tension entre écoute et obéissance, sans imposer une paraphrase exclusivement juridique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve la solennité de la parole divine sans archaïsmes. Le passage du collectif singulier « cette nation a violé » au pluriel « ils n’ont pas écouté » reflète l’accord selon le sens présent en hébreu. Le marqueur [a] figure dans le texte après les points de suspension.
