source:
  edition: WLC
  text: בְּ/כֹ֣ל אֲשֶׁ֣ר יָצְא֗וּ יַד יְהוָה֙ הָיְתָה בָּ֣/ם לְ/רָעָ֔ה כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וְ/כַ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶ֑ם וַ/יֵּ֥צֶר לָ/הֶ֖ם מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/015.yaml
  text: Wherever they went out[a], the hand of Yahweh was against them for harm, just as Yahweh had spoken and just as Yahweh had sworn to them[b], and they were greatly distressed.
translation:
  language: fr
  text: Chaque fois qu’ils partaient[a], la main de Yahweh était contre eux pour leur malheur[b], comme Yahweh l’avait déclaré et comme Yahweh le leur avait juré. Ils furent dans une très grande détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Partout où ils allaient » ; l’expression peut viser plus particulièrement leurs sorties au combat ou leurs campagnes militaires.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour leur faire du mal » ou « pour leur désastre » ; ici, le mot hébreu désigne le malheur ou la calamité, sans nécessairement évoquer le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹל אֲשֶׁר יָצְאוּ
  choice: Chaque fois qu’ils partaient
  rationale: La tournure embrasse toutes leurs sorties ou entreprises. « Chaque fois » rend naturellement la valeur circonstancielle sans limiter explicitement le propos aux campagnes militaires.
- source_word: יַד יְהוָה
  choice: la main de Yahweh
  rationale: Le maintien de la métaphore hébraïque exprime l’action et la puissance personnelles de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: הָיְתָה בָם לְרָעָה
  choice: était contre eux pour leur malheur
  rationale: Cette formulation conserve l’action divine adverse et rend רָעָה comme une calamité subie, sans lui donner ici le sens de mal moral.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: comme Yahweh l’avait déclaré
  rationale: Le plus-que-parfait renvoie aux avertissements antérieurs de Yahweh ; « déclaré » restitue clairement l’acte de parole solennel.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: et comme Yahweh le leur avait juré
  rationale: Le pronom « le » est naturel en français et renvoie au jugement annoncé, tandis que « leur » conserve le destinataire de l’engagement sous serment.
- source_word: וַיֵּצֶר לָהֶם מְאֹד
  choice: Ils furent ainsi plongés dans une très grande détresse
  rationale: Cette formulation idiomatique rend l’intensité de מְאֹד et la situation d’oppression sévère exprimée par le verbe.
theological_decisions:
- issue: L’opposition divine dans le jugement de l’alliance
  choice: la main de Yahweh était contre eux pour leur malheur
  alternative: la main de Yahweh était contre eux pour leur faire du mal
  rationale: Le choix affirme sans l’atténuer que Yahweh agit contre Israël en jugement, tout en indiquant par « malheur » qu’il s’agit de calamité et non de mal moral.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore biblique de la « main » est conservée, de même que le nom divin Yahweh. La phrase finale est légèrement restructurée pour éviter une coordination lourde et exprimer clairement le résultat.
