  text: וְ/גַם֙ כָּל הַ/דּ֣וֹר הַ/ה֔וּא נֶאֶסְפ֖וּ אֶל אֲבוֹתָ֑י/ו וַ/יָּקָם֩ דּ֨וֹר אַחֵ֜ר אַחֲרֵי/הֶ֗ם אֲשֶׁ֤ר לֹא יָֽדְעוּ֙ אֶת יְהוָ֔ה וְ/גַם֙ אֶת הַֽ/מַּעֲשֶׂ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/010.yaml
  text: And all that generation also were gathered to their fathers[a], and another generation arose after them who did not know Yahweh[b], or even the work that he had done for Israel.
translation:
  language: fr
  text: Toute cette génération fut, elle aussi, réunie à ses ancêtres[a]. Après elle se leva une autre génération, qui ne connaissait pas Yahweh[b], ni même l’œuvre qu’il avait accomplie pour Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « fut réunie à ses pères » : expression hébraïque évoquant la mort et le fait de rejoindre ses ancêtres.'
    reason: cultural_note
  - marker: b
    text: Ou « ne reconnaissait pas Yahweh »; le verbe hébreu peut désigner une connaissance relationnelle ou liée à l’alliance, et pas seulement la connaissance de faits.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּל הַדּוֹר הַהוּא
  choice: Toute cette génération fut, elle aussi
  rationale: « Toute cette génération » rend explicitement כָּל et le démonstratif; « elle aussi » conserve la valeur additive et emphatique de וְגַם en français naturel.
- source_word: נֶאֶסְפוּ אֶל אֲבוֹתָיו
  choice: fut réunie à ses ancêtres
  rationale: Conserve l’image de l’expression hébraïque tout en employant « ancêtres », plus naturel et non ambigu en français contemporain; l’accord au singulier suit le collectif « génération ».
- source_word: וַיָּקָם דּוֹר אַחֵר אַחֲרֵיהֶם
  choice: Après elle se leva une autre génération
  rationale: « Se leva » garde la métaphore narrative de קום; « après elle » exprime la succession temporelle en adaptant le pronom collectif au français.
- source_word: לֹא יָדְעוּ אֶת יְהוָה
  choice: qui ne connaissait pas Yahweh
  rationale: « Connaître » préserve l’amplitude de ידע, qui peut viser la connaissance factuelle, vécue, relationnelle ou liée à l’alliance, sans trancher entre elles.
- source_word: וְגַם אֶת הַמַּעֲשֶׂה
  choice: ni même l’œuvre
  rationale: Après la négation, « ni même » restitue naturellement la force additive de וְגַם; « œuvre » convient au singulier collectif désignant l’action de Dieu.
- source_word: אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל
  choice: qu’il avait accomplie pour Israël
  rationale: Le plus-que-parfait marque l’antériorité de l’action divine, et « pour Israël » rend la valeur bénéficiaire probable de ל dans ce contexte.
theological_decisions:
- issue: Sens de « ne connaissait pas Yahweh »
  choice: Maintenir une formulation large pouvant inclure une absence de connaissance vécue, relationnelle ou liée à l’alliance
  alternative: « ne reconnaissait pas Yahweh » ou « ne savait rien de Yahweh »
  rationale: ידע et le parallélisme avec l’ignorance de l’œuvre divine permettent plusieurs nuances. La traduction ne réduit donc le propos ni à un manque d’information ni à une infidélité explicitement formulée.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: La translittération « Yahweh » distingue le nom propre divin et suit l’orientation du projet sans substituer un titre au tétragramme.
- issue: Portée de l’action divine envers Israël
  choice: « pour Israël », avec une valeur bénéficiaire
  alternative: « envers Israël » ou « à Israël »
  rationale: Le contexte évoque les actes accomplis en faveur d’Israël; « pour » communique ce sens sans suggérer une action hostile.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la métaphore intergénérationnelle et la tension théologique de « connaître », tout en privilégiant une syntaxe française fluide.
