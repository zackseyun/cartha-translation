  text: וַ/יַּנַּ֤ח יְהוָה֙ אֶת הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה לְ/בִלְתִּ֥י הוֹרִישָׁ֖/ם מַהֵ֑ר וְ/לֹ֥א נְתָנָ֖/ם בְּ/יַד יְהוֹשֻֽׁעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/023.yaml
  text: So Yahweh left these nations[a], not driving them out quickly, and he did not give them into the hand of Joshua.
translation:
  language: fr
  text: Ainsi, Yahweh laissa subsister ces nations[a] sans les chasser rapidement, et il ne les livra pas entre les mains de Josué.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ces peuples ». Le verbe hébreu peut signifier « permettre de rester » ou « laisser en place ».
    reason: Alternative lexicale pour גּוֹיִם et précision sur la nuance de וַיַּנַּח.
lexical_decisions:
- source_word: וַיַּנַּח
  choice: laissa subsister
  rationale: Le hifil de נוח exprime ici le fait de laisser demeurer ou de permettre de rester. « Laissa subsister » rend ce sens clairement sans ajouter une indication de lieu absente de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin יהוה, qui préserve dans le texte français le nom personnel employé par l’hébreu.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ces nations
  rationale: גּוֹיִם désigne ici les groupes nationaux demeurés en Canaan. « Nations » est naturel et conserve la portée collective du terme.
- source_word: לְבִלְתִּי הוֹרִישָׁם
  choice: sans les chasser
  rationale: La construction négative avec l’infinitif causatif de ירשׁ indique que Yahweh ne les a pas expulsés du pays. « Sans les chasser » restitue naturellement le rapport avec le verbe principal tout en laissant ouverte la nuance de résultat ou de dessein.
- source_word: מַהֵר
  choice: rapidement
  rationale: L’adverbe signifie « vite, rapidement »; « rapidement » convient au registre narratif moderne.
- source_word: וְלֹא נְתָנָם
  choice: et il ne les livra pas
  rationale: Avec « entre les mains de », נתן exprime la remise au pouvoir de quelqu’un. « Livra » rend clairement cet idiome dans un contexte de conquête.
- source_word: בְּיַד יְהוֹשֻׁעַ
  choice: entre les mains de Josué
  rationale: Cette expression française conserve l’image hébraïque de la main comme pouvoir ou maîtrise, tout en étant idiomatique.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le Tétragramme comme nom propre. « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Nuance de לְבִלְתִּי avec l’infinitif
  choice: sans les chasser rapidement
  alternative: afin de ne pas les chasser rapidement
  rationale: La construction peut comporter une nuance de résultat ou de dessein. « Sans » évite de trancher explicitement en faveur d’une intention, tout en exprimant fidèlement que ces nations ne furent pas expulsées rapidement.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit; « laissa subsister » et « livra entre les mains » préservent les nuances et l’imagerie de l’hébreu sans lourdeur excessive.
