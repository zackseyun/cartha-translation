id: JDG.2.18
reference: Judges 2:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִֽי הֵקִ֨ים יְהוָ֥ה לָ/הֶם֮ שֹֽׁפְטִים֒ וְ/הָיָ֤ה יְהוָה֙ עִם הַ/שֹּׁפֵ֔ט וְ/הֽוֹשִׁיעָ/ם֙ מִ/יַּ֣ד אֹֽיְבֵי/הֶ֔ם כֹּ֖ל יְמֵ֣י הַ/שּׁוֹפֵ֑ט כִּֽי יִנָּחֵ֤ם יְהוָה֙ מִ/נַּֽאֲקָתָ֔/ם מִ/פְּנֵ֥י לֹחֲצֵי/הֶ֖ם וְ/דֹחֲקֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/018.yaml
  text: Whenever Yahweh raised up judges for them[a], Yahweh was with the judge and saved them from the hand of their enemies all the days of the judge, for Yahweh was moved to pity by their groaning because of those who oppressed and afflicted them.
translation:
  language: fr
  text: Chaque fois que Yahweh suscitait pour eux des juges, Yahweh était avec le juge et les sauvait de la main de leurs ennemis tant que le juge vivait, car Yahweh éprouvait de la compassion[a] à cause de leurs gémissements, provoqués par ceux qui les opprimaient et les accablaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se laissait fléchir » ou « avait compassion ». Le verbe hébreu peut exprimer un changement de disposition ou une réaction compatissante.'
    reason: alternative lexicale
lexical_decisions:
- source_word: וְכִי
  choice: Chaque fois que
  rationale: Dans ce résumé décrivant un cycle récurrent, la locution introduit naturellement une action répétée plutôt qu’un événement unique.
- source_word: הֵקִים
  choice: suscitait
  rationale: Ce verbe conserve l’idée de l’initiative divine par laquelle Yahweh faisait surgir des dirigeants pour Israël.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé directement par le tétragramme.
- source_word: שֹׁפְטִים
  choice: juges
  rationale: « Juges » est le terme consacré et exact dans le contexte du livre, tandis que leur rôle de sauveurs est exprimé par le verbe suivant.
- source_word: וְהָיָה יְהוָה עִם הַשֹּׁפֵט
  choice: Yahweh était avec le juge
  rationale: Cette formulation directe exprime la présence et le soutien divins sans les expliciter davantage.
- source_word: וְהוֹשִׁיעָם
  choice: les sauvait
  rationale: Le hifil de ישׁע désigne ici le fait de secourir ou délivrer; le complément précise qu’il s’agit du pouvoir des ennemis.
- source_word: מִיַּד אֹיְבֵיהֶם
  choice: de la main de leurs ennemis
  rationale: L’image hébraïque de la « main » reste claire en français et représente concrètement le pouvoir exercé par les ennemis.
- source_word: כֹּל יְמֵי הַשּׁוֹפֵט
  choice: tant que le juge vivait
  rationale: Cette expression idiomatique transmet naturellement la durée indiquée par « tous les jours du juge » dans ce contexte.
- source_word: יִנָּחֵם
  choice: s’apitoyait
  rationale: Le nifal de נחם décrit ici la réaction compatissante de Yahweh aux souffrances d’Israël, tout en admettant d’autres nuances signalées en note.
- source_word: מִנַּאֲקָתָם
  choice: à cause de leurs gémissements
  rationale: La préposition présente les gémissements comme l’occasion ou la cause de la réaction compatissante de Yahweh.
- source_word: מִפְּנֵי לֹחֲצֵיהֶם וְדֹחֲקֵיהֶם
  choice: devant ceux qui les opprimaient et les accablaient
  rationale: Les deux participes désignent les personnes qui exerçaient activement une oppression et une contrainte pénible sur Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le nom divin; « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Langage anthropopathique dans יִנָּחֵם יְהוָה
  choice: Yahweh s’apitoyait
  alternative: Yahweh se laissait fléchir; Yahweh avait compassion
  rationale: « S’apitoyait » conserve la force affective de la réaction divine sans réduire le verbe à une seule nuance; la note maintient son amplitude sémantique et la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait rend le caractère habituel du cycle décrit. Les images hébraïques intelligibles, notamment « de la main de leurs ennemis », sont conservées.
