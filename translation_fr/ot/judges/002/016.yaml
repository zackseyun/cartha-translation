id: JDG.2.16
reference: Judges 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֥קֶם יְהוָ֖ה שֹֽׁפְטִ֑ים וַ/יּ֣וֹשִׁיע֔וּ/ם מִ/יַּ֖ד שֹׁסֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/016.yaml
  text: Then Yahweh raised up judges[a], and they saved them from the hand of those who plundered them.
translation:
  language: fr
  text: Alors Yahweh suscita des juges, qui les sauvèrent[a] de la main de ceux qui les pillaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les délivrèrent ».
    reason: Alternative lexicale pour וַיּוֹשִׁיעוּם, qui peut exprimer le salut, le secours ou la délivrance.
lexical_decisions:
- source_word: וַיָּקֶם
  choice: suscita
  rationale: Le hiphil de קום exprime ici l’initiative de Yahweh, qui fait apparaître des dirigeants pour Israël. « Suscita » est naturel, digne et conserve l’idée d’une intervention divine dans l’histoire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: שֹׁפְטִים
  choice: juges
  rationale: « Juges » rend directement le terme hébreu et maintient la terminologie propre au livre, sans réduire ces personnages à leur seule fonction militaire ou salvatrice.
- source_word: וַיּוֹשִׁיעוּם
  choice: ils les sauvèrent
  rationale: Le verbe ישׁע désigne le fait de secourir ou de délivrer. « Sauvèrent » est clair en français moderne, tandis que « délivrèrent » demeure une possibilité lexicale signalée en note.
- source_word: מִיַּד
  choice: de la main de
  rationale: Cette formulation conserve la métaphore hébraïque de la main comme puissance ou emprise, tout en restant intelligible en français.
- source_word: שֹׁסֵיהֶם
  choice: ceux qui les pillaient
  rationale: Le terme évoque ceux qui dépouillent ou pillent violemment. Cette traduction garde la nuance prédatrice, que le terme plus général « oppresseurs » atténuerait.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Fonction des שֹׁפְטִים
  choice: Conserver « juges » et exprimer leur action salvatrice par « ils les sauvèrent »
  alternative: Traduire שֹׁפְטִים par « libérateurs »
  rationale: 'Le texte distingue leur désignation de leur action : ils sont appelés « juges », puis décrits comme sauvant Israël. Garder les deux éléments évite de réduire leur rôle à une seule fonction.'
translation_notes:
  register: Français international moderne, clair et digne. « Suscita » conserve une tonalité biblique accessible. La métaphore « de la main de » est maintenue parce qu’elle reste compréhensible et reflète étroitement l’hébreu.
