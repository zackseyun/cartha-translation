base_translation:
  language: en
  yaml_path: translation/ot/judges/014/003.yaml
  text: But his father and his mother said to him[a], “Is there not a woman among the daughters of your brothers or among all my people, that you are going to take a wife from the uncircumcised Philistines?” But Samson said to his father, “Get her for me[b], for she is right in my eyes.”
translation:
  language: fr
  text: 'Son père et sa mère lui dirent : « N’y a-t-il pas de femme parmi les filles de tes frères[a] ou parmi tout mon peuple, pour que tu ailles prendre femme chez les Philistins incirconcis ? » Samson dit à son père : « Va la chercher pour moi, car elle me plaît[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « les filles de tes frères » désigne probablement, au sens large, les femmes de la parenté ou du peuple de Samson, et non seulement les filles de ses frères immédiats.
    reason: cultural_note
  - marker: b
    text: 'Litt. : « car elle est droite à mes yeux ». L’expression hébraïque peut indiquer l’approbation personnelle, l’attrait ou la convenance. Cette formulation littérale fait écho à un thème récurrent du livre des Juges, concernant ce qui est droit aux yeux de quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵין
  choice: N’y a-t-il pas
  rationale: Rend naturellement en français la question rhétorique introduite par l’interrogation et la négation.
- source_word: בִּבְנוֹת אַחֶיךָ
  choice: parmi les filles de tes frères
  rationale: Conserve l’expression familiale concrète de l’hébreu; sa portée probablement plus large est signalée en note.
- source_word: וּבְכָל עַמִּי
  choice: ou dans tout mon peuple
  rationale: Maintient le suffixe hébreu de première personne du singulier, malgré la présence des deux parents comme locuteurs.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Dans les deux occurrences, le contexte matrimonial est clair; « femme » reste naturel en français et évite une lourde répétition de « épouse ».
- source_word: הוֹלֵךְ לָקַחַת
  choice: tu ailles prendre
  rationale: Reproduit la construction verbale et le langage matrimonial du texte sans la réduire au seul verbe « épouser ».
- source_word: מִפְּלִשְׁתִּים הָעֲרֵלִים
  choice: parmi les Philistins incirconcis
  rationale: Préserve la désignation ethnique et l’épithète à forte portée identitaire et religieuse, sans l’atténuer.
- source_word: אוֹתָהּ קַח לִי
  choice: Prends-la pour moi
  rationale: Conserve l’impératif et le rôle demandé au père dans l’organisation du mariage, dans un français compréhensible.
- source_word: יָשְׁרָה בְעֵינַי
  choice: elle est juste à mes yeux
  rationale: Préserve à la fois le terme évaluatif « juste » et l’image « à mes yeux », importante dans la trame verbale du livre des Juges.
theological_decisions:
- issue: Résonance narrative de יָשְׁרָה בְעֵינַי dans le livre des Juges
  choice: elle est juste à mes yeux
  alternative: elle me plaît; elle me semble convenir
  rationale: L’expression peut marquer l’attrait personnel ou l’approbation. La formulation retenue maintient l’ambiguïté et l’écho au motif récurrent de ce qui est juste aux yeux de chacun, sans imposer un jugement moral explicite au narrateur.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve la force de la question parentale et la réponse abrupte de Samson. La tournure volontairement marquée « juste à mes yeux » maintient un écho littéraire essentiel, expliqué en note.
