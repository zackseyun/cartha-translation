    issue: « elle est juste à mes yeux »
    rationale: En français moderne, appliqué à une personne, « juste » évoque surtout l’équité ou la droiture morale; il ne rend pas spontanément l’approbation, l’attrait ou la convenance que porte l’idiome hébreu dans ce contexte.
  - severity: low
    issue: « tu ailles prendre une femme parmi les Philistins »
    rationale: La tournure est moins naturelle que « aller prendre femme chez les Philistins » et la répétition de « femme » peut être allégée sans perte de sens.
  - severity: low
    issue: « Prends-la pour moi »
    rationale: La formulation est littérale mais peut faire entendre en français que le père la prend lui-même. « Va la chercher pour moi » rend mieux la demande de Samson dans le cadre d’un mariage arrangé.
