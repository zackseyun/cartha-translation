  to: 'Son père et sa mère lui dirent : « N’y a-t-il pas de femme parmi les filles de tes frères[a] ou parmi tout mon peuple, pour que tu ailles prendre femme chez les Philistins incirconcis ? » Samson dit à son père : « Va la chercher pour moi, car elle me plaît[b]. »'
  rationale: La révision améliore l’idiomaticité du français tout en maintenant le sens matrimonial, la désignation identitaire des Philistins et le caractère personnel de l’évaluation de Samson. L’écho lexical de « droit à ses yeux » est conservé explicitement en note, où il ne crée pas l’ambiguïté sémantique de « juste à mes yeux » dans le texte courant.
