  text: וְ/אָבִ֨י/ו וְ/אִמּ֜/וֹ לֹ֣א יָדְע֗וּ כִּ֤י מֵ/יְהוָה֙ הִ֔יא כִּי תֹאֲנָ֥ה הֽוּא מְבַקֵּ֖שׁ מִ/פְּלִשְׁתִּ֑ים וּ/בָ/עֵ֣ת הַ/הִ֔יא פְּלִשְׁתִּ֖ים מֹשְׁלִ֥ים בְּ/יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/004.yaml
  text: But his father and mother did not know that it was from Yahweh[a], for he was seeking an occasion from the Philistines[b]. At that time the Philistines were ruling over Israel.
translation:
  language: fr
  text: 'Mais son père et sa mère ne savaient pas que cela venait de Yahvé[a] : il cherchait en effet une occasion d’agir contre les Philistins[b]. À cette époque, les Philistins dominaient Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car lui, Yahvé, cherchait une occasion d’agir contre les Philistins ». L’hébreu permet de comprendre ainsi le sujet de « cherchait », mais le contexte désigne plus probablement Samson.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « une occasion venant des Philistins ». Le terme peut aussi signifier « un prétexte » ou « une occasion favorable » d’agir contre eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיְהוָה
  choice: venait de Yahvé
  rationale: Rend directement la provenance exprimée par מִן et conserve le nom divin personnel sous une forme française établie.
- source_word: הִיא
  choice: cela
  rationale: Le pronom féminin renvoie à l’affaire en question plutôt qu’à un nom féminin précis; « cela » est naturel en français et garde une référence assez ouverte.
- source_word: תֹאֲנָה
  choice: une occasion d’agir
  rationale: Le nom désigne une occasion, une ouverture ou éventuellement un prétexte. L’ajout sobre « d’agir » explicite la valeur contextuelle sans imposer l’idée d’un prétexte insincère.
- source_word: מְבַקֵּשׁ
  choice: il cherchait
  rationale: Le participe exprime une action en cours; l’imparfait français convient au cadre narratif.
- source_word: מִפְּלִשְׁתִּים
  choice: contre les Philistins
  rationale: Bien que la préposition signifie littéralement « de, venant de », la construction et le contexte indiquent une occasion dirigée contre les Philistins; cette nuance est signalée en note.
- source_word: וּבָעֵת הַהִיא
  choice: À cette époque
  rationale: Transition temporelle idiomatique qui situe l’état politique décrit.
- source_word: מֹשְׁלִים בְּיִשְׂרָאֵל
  choice: dominaient sur Israël
  rationale: Le participe décrit une domination continue. « Dominaient sur » exprime ici plus clairement l’assujettissement qu’un simple « gouvernaient ».
- source_word: וְאָבִיו וְאִמּוֹ לֹא יָדְעוּ
  choice: son père et sa mère ne savaient pas
  rationale: Traduction directe, naturelle et fidèle de la coordination et du verbe ידע.
theological_decisions:
- issue: Articulation entre l’action divine et l’intention de Samson
  choice: Le texte affirme que l’affaire venait de Yahvé tout en présentant Samson comme celui qui cherchait une occasion contre les Philistins.
  alternative: Comprendre que Yahvé est lui-même le sujet de « cherchait ».
  rationale: Le contexte narratif favorise Samson comme sujet, mais l’hébreu ne nomme pas explicitement le sujet de מְבַקֵּשׁ. La traduction principale suit le contexte et la note conserve l’autre possibilité, sans résoudre la tension entre providence divine et action humaine.
- issue: Référent du pronom « il »
  choice: « Il » désigne Samson.
  alternative: « Il » désigne Yahvé.
  rationale: Samson poursuit le mariage qui fournit l’occasion du conflit; il constitue donc le référent contextuel le plus probable. La proximité de Yahvé dans la proposition précédente rend néanmoins l’autre analyse grammaticalement possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le choix « Yahvé » suit la couche de consultation fournie et distingue clairement le nom personnel divin. La formulation maintient l’ambiguïté du sujet hébreu au moyen d’une note et évite de préciser davantage la causalité divine.
