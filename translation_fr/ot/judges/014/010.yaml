  text: וַ/יֵּ֥רֶד אָבִ֖י/הוּ אֶל הָ/אִשָּׁ֑ה וַ/יַּ֨עַשׂ שָׁ֤ם שִׁמְשׁוֹן֙ מִשְׁתֶּ֔ה כִּ֛י כֵּ֥ן יַעֲשׂ֖וּ הַ/בַּחוּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/010.yaml
  text: So his father went down to the woman[a], and Samson made a feast there, for that is what the young men did.
translation:
  language: fr
  text: Son père descendit vers la femme, et Samson y donna un festin[a], car c’est ainsi que les jeunes gens faisaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un banquet » ou « un festin accompagné de boissons ». Le mot hébreu מִשְׁתֶּה désigne souvent un repas de fête où l’on boit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Le verbe יָרַד exprime un déplacement vers le bas. « Descendit » conserve cette indication spatiale caractéristique du récit hébreu.
- source_word: אָבִיהוּ
  choice: son père
  rationale: Le suffixe masculin singulier renvoie à Samson dans le contexte.
- source_word: אֶל הָאִשָּׁה
  choice: chez la femme
  rationale: L’hébreu dit simplement « la femme ». « Chez » exprime naturellement en français le déplacement vers la personne ou le lieu où elle se trouve, sans préciser davantage son statut.
- source_word: וַיַּעַשׂ שָׁם
  choice: y donna
  rationale: Avec מִשְׁתֶּה, le verbe général עָשָׂה signifie ici organiser ou donner un festin. « Y » reprend naturellement le lieu indiqué par שָׁם.
- source_word: מִשְׁתֶּה
  choice: un festin
  rationale: Le nom désigne un repas festif, souvent accompagné de boissons. « Festin » est clair et digne, tandis que la note conserve la nuance liée à la boisson.
- source_word: כִּי כֵּן יַעֲשׂוּ
  choice: car c’était ainsi que faisaient
  rationale: Cette formulation rend la valeur explicative de כִּי et l’usage habituel exprimé par l’imparfait hébreu, sans transformer la phrase en prescription.
- source_word: הַבַּחוּרִים
  choice: les jeunes gens
  rationale: בָּחוּר désigne couramment de jeunes hommes dans la force de l’âge. « Jeunes gens » convient au registre narratif et au contexte nuptial.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La tournure « c’était ainsi que faisaient » conserve le caractère coutumier de la pratique, et « la femme » maintient la désignation non précisée du texte hébreu.
