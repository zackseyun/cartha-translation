- from: Son père descendit donc chez la femme, et Samson y donna un festin[a], car c’était ainsi que faisaient les jeunes gens.
  to: Son père descendit vers la femme, et Samson y donna un festin[a], car c’est ainsi que les jeunes gens faisaient.
  rationale: La révision retire l’inférence ajoutée par « donc », évite de localiser indûment la femme à son domicile, et conserve une expression française naturelle de la coutume évoquée par l’imparfait hébreu. La note est rendue plus neutre tout en préservant l’information lexicale.
