  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אַנְשֵׁ֨י הָ/עִ֜יר בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י בְּ/טֶ֨רֶם֙ יָבֹ֣א הַ/חַ֔רְסָ/ה מַה מָּת֣וֹק מִ/דְּבַ֔שׁ וּ/מֶ֥ה עַ֖ז מֵ/אֲרִ֑י וַ/יֹּ֣אמֶר לָ/הֶ֔ם לוּלֵא֙ חֲרַשְׁתֶּ֣ם בְּ/עֶגְלָתִ֔/י לֹ֥א מְצָאתֶ֖ם חִידָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/018.yaml
  text: And the men of the city said to him on the seventh day[a], before the sun went down, “What is sweeter than honey, and what is stronger than a lion?” And he said to them, “If you had not plowed with my heifer[b], you would not have found out my riddle.”
translation:
  language: fr
  text: 'Les hommes de la ville lui dirent, le septième jour, avant que le soleil se couche[a] : « Qu’y a-t-il de plus doux que le miel, et qu’y a-t-il de plus fort qu’un lion ? » Il leur répondit : « Si vous n’aviez pas labouré avec ma génisse[b], vous n’auriez pas résolu mon énigme. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avant que le soleil entre », expression qui désigne le coucher du soleil.'
    reason: lexical_alternative
  - marker: b
    text: Samson parle littéralement de « labourer avec [sa] génisse ». Par cette métaphore insultante, il les accuse de s’être servis de sa femme pour résoudre l’énigme.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: les hommes de la ville
  rationale: Rend explicitement le pluriel masculin et reste proche de l’hébreu, dans un français clair.
- source_word: בְּטֶרֶם יָבֹא הַחַרְסָה
  choice: avant que le soleil se couche
  rationale: Exprime naturellement en français le sens de l’idiome hébreu, tout en signalant sa formulation littérale en note.
- source_word: מַה מָּתוֹק מִדְּבַשׁ
  choice: Qu’y a-t-il de plus doux que le miel ?
  rationale: Le מִן a ici une valeur comparative; cette formulation conserve la structure énigmatique et sonne naturellement en français.
- source_word: וּמֶה עַז מֵאֲרִי
  choice: et qu’y a-t-il de plus fort qu’un lion ?
  rationale: « Fort » rend ici עַז dans le parallélisme comparatif avec la douceur du miel.
- source_word: חֲרַשְׁתֶּם בְּעֶגְלָתִי
  choice: vous n’aviez pas labouré avec ma génisse
  rationale: Conserve sans l’aplanir la métaphore agricole mordante employée par Samson.
- source_word: לֹא מְצָאתֶם חִידָתִי
  choice: vous n’auriez pas résolu mon énigme
  rationale: Dans le contexte d’une énigme, מָצָא signifie parvenir à la solution; « résolu » est l’expression française naturelle.
