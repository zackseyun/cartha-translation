    rationale: La note porte sur עַז, traduit par « fort », et doit donc être attachée directement à ce terme.
  - severity: medium
    issue: « Donner la réponse à l’énigme » interprète le verbe « dire / faire connaître » comme la fourniture d’une solution.
    rationale: Cette lecture est vraisemblable dans le contexte, mais « expliquer l’énigme » reste plus proche du champ sémantique explicite tout en étant idiomatique en français.
