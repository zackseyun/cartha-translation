  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ם מֵ/הָֽ/אֹכֵל֙ יָצָ֣א מַאֲכָ֔ל וּ/מֵ/עַ֖ז יָצָ֣א מָת֑וֹק וְ/לֹ֥א יָכְל֛וּ לְ/הַגִּ֥יד הַ/חִידָ֖ה שְׁלֹ֥שֶׁת יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/014.yaml
  text: And he said to them[a], “Out of the eater came food[b], and out of the strong came sweetness.” But they could not tell the riddle for three days.
translation:
  language: fr
  text: 'Il leur dit : « Du mangeur est sortie de la nourriture, et du fort[a] est sortie de la douceur. » Mais, pendant trois jours, ils ne purent pas expliquer l’énigme[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du féroce ». Le mot hébreu peut signifier « fort », « puissant » ou « féroce ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dire l’énigme »; ou « donner la réponse à l’énigme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Il leur dit
  rationale: Le wayyiqtol fait avancer le récit. Le français n’a pas besoin d’un « et » initial pour préserver cette progression narrative.
- source_word: מֵהָאֹכֵל
  choice: De celui qui mange
  rationale: Le participe qal substantivé désigne littéralement « celui qui mange ». Cette formulation naturelle conserve l’image énigmatique sans identifier explicitement le lion.
- source_word: יָצָא מַאֲכָל
  choice: est sortie de la nourriture
  rationale: Le verbe יָצָא exprime la sortie ou la provenance, et מַאֲכָל désigne de la nourriture. L’ordre inversé maintient la forme ramassée et le parallélisme de l’énigme.
- source_word: וּמֵעַז
  choice: et du fort
  rationale: עַז peut signifier « fort », « puissant » ou « féroce ». « Du fort » préserve la brièveté et l’ambiguïté de l’hébreu, sans imposer la référence au lion.
- source_word: יָצָא מָתוֹק
  choice: est sortie de la douceur
  rationale: מָתוֹק, adjectif substantivé, désigne ici ce qui est doux ou la douceur. « La douceur » reproduit le parallélisme abstrait et poétique du texte.
- source_word: וְלֹא יָכְלוּ
  choice: Mais … ils ne réussirent pas
  rationale: Cette tournure exprime naturellement en français l’incapacité constatée durant la période indiquée; « mais » rend le contraste narratif.
- source_word: לְהַגִּיד הַחִידָה
  choice: à donner la réponse à l’énigme
  rationale: נגד signifie dire, annoncer ou faire connaître. Dans le contexte d’une énigme, il s’agit d’en fournir la solution; la formulation française explicite seulement l’usage idiomatique impliqué, avec une note signalant le rendu plus littéral.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: pendant trois jours
  rationale: La durée est rendue idiomatiquement, sans préciser davantage les limites temporelles que ne le fait l’hébreu.
