- from: 'Il leur dit : « De celui qui mange est sortie de la nourriture, et du fort est sortie de la douceur[a]. » Mais pendant trois jours, ils ne réussirent pas à donner la réponse à l’énigme[b].'
  to: 'Il leur dit : « Du mangeur est sortie de la nourriture, et du fort[a] est sortie de la douceur. » Mais, pendant trois jours, ils ne purent pas expliquer l’énigme[b].'
  rationale: La révision emploie « mangeur », forme substantivée naturelle qui conserve l’énigme et son parallélisme. Elle rattache la note lexicale à « fort », le mot concerné. « Expliquer l’énigme » évite de présenter comme explicite une « réponse » que le texte hébreu exprime par le verbe plus large « dire / faire connaître », tout en restant naturel dans ce contexte.
