base_translation:
  language: en
  yaml_path: translation/ot/judges/014/015.yaml
  text: And on the seventh day they said to Samson’s wife[a], “Entice your husband so that he may tell us the riddle, lest we burn you and your father’s household with fire[b]. Did you invite us to dispossess us? Is that not so?”
translation:
  language: fr
  text: 'Le septième jour, ils dirent à la femme de Samson : « Amadoue ton mari pour qu’il nous donne la réponse à l’énigme. Sinon, nous te brûlerons, toi et la maison de ton père[a]. Est-ce pour nous dépouiller[b] que vous nous avez invités ? N’est-ce pas ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut désigner la maison de son père, mais aussi sa maisonnée ou sa famille.
    reason: lexical_alternative
  - marker: b
    text: Ou « nous déposséder » ou « prendre ce qui nous appartient ». Le verbe hébreu peut exprimer la prise de possession des biens d’autrui.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתִּי
  choice: Amadoue
  rationale: Le piel de פתה exprime ici une persuasion calculée ou manipulatrice. « Amadoue » garde cette nuance sans suggérer principalement une séduction sexuelle, comme pourrait le faire « séduis » en français moderne.
- source_word: אִישֵׁךְ
  choice: ton mari
  rationale: Dans ce contexte matrimonial, אִישׁ désigne naturellement le mari de la femme.
- source_word: וְיַגֶּד לָנוּ אֶת הַחִידָה
  choice: pour qu’il nous donne la réponse à l’énigme
  rationale: La construction exprime le but recherché. Dans le contexte, « dire l’énigme » signifie en communiquer la solution; cette formulation est naturelle en français tout en restant contextuellement précise.
- source_word: פֶּן נִשְׂרֹף אוֹתָךְ וְאֶת בֵּית אָבִיךְ בָּאֵשׁ
  choice: Sinon, nous te brûlerons, toi et la maison de ton père
  rationale: פֶּן introduit ici une menace. Le français « sinon » en rend directement la force. « Brûler » conserve la violence explicite de la formulation hébraïque, tandis que « maison » maintient l’ambiguïté entre bâtiment et maisonnée.
- source_word: הֲלְיָרְשֵׁנוּ
  choice: Est-ce pour nous dépouiller
  rationale: ירשׁ peut ici signifier prendre possession des biens d’autrui ou le déposséder. « Dépouiller » convient au risque de perdre les biens engagés dans le pari et demeure naturel dans l’accusation.
- source_word: קְרָאתֶם לָנוּ
  choice: que vous nous avez invités
  rationale: קרא avec ל peut signifier inviter. Le pluriel « vous » respecte la forme hébraïque קְרָאתֶם, même si les hommes parlent directement à la femme de Samson.
- source_word: הֲלֹא
  choice: N’est-ce pas ?
  rationale: Cette question brève conserve la particule rhétorique finale, qui attend l’assentiment et renforce le ton accusateur.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct reste menaçant et accusateur. « Amadoue » rend la manipulation sans connotation inutilement sexuelle; « maison de ton père » conserve une ambiguïté réelle de l’hébreu, explicitée en note.
