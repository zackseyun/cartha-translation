source:
  edition: WLC
  text: וַ/יֵּ֥רֶד שִׁמְשׁ֖וֹן תִּמְנָ֑תָ/ה וַ/יַּ֥רְא אִשָּׁ֛ה בְּ/תִמְנָ֖תָ/ה מִ/בְּנ֥וֹת פְּלִשְׁתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/001.yaml
  text: Then Samson went down to Timnah[a], and at Timnah he saw a woman from the daughters of the Philistines.
translation:
  language: fr
  text: Samson descendit à Timna ; il y vit une femme d’entre les Philistines.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Le verbe ירד signifie « descendre ». Le français conserve naturellement cette indication topographique sans lourdeur.
- source_word: שִׁמְשׁוֹן
  choice: Samson
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: תִּמְנָתָה
  choice: à Timna
  rationale: Le hé directionnel indique un mouvement vers le lieu ; « à Timna » est la formulation française naturelle.
- source_word: וַיַּרְא
  choice: il vit
  rationale: Traduction directe de ראה, sans ajouter l'idée qu'il la remarqua particulièrement.
- source_word: אִשָּׁה
  choice: une femme
  rationale: אשה peut désigner une femme ou une épouse ; ici, elle n'est pas encore l'épouse de Samson, de sorte que « une femme » préserve le sens contextuel.
- source_word: בְּתִמְנָתָה
  choice: Là
  rationale: Le pronom adverbial reprend naturellement Timna en français et évite une répétition pesante tout en conservant la localisation.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: parmi les Philistines
  rationale: Littéralement « parmi les filles des Philistins ». Dans ce contexte, l'hébreu identifie une femme appartenant au peuple philistin ; cette formulation est claire et idiomatique, sans laisser entendre qu'elle était la fille de l'ensemble des Philistins.
