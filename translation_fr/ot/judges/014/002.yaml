base_translation:
  language: en
  yaml_path: translation/ot/judges/014/002.yaml
  text: Then he went up and told his father and mother[a], and he said, “I saw a woman in Timnah from the daughters of the Philistines. So now, get her for me as a wife.”
translation:
  language: fr
  text: 'Puis il remonta et en informa son père et sa mère. Il leur dit : « À Timna, j’ai vu une femme d’entre les filles des Philistins[a]. Maintenant, prenez-la pour moi comme épouse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une femme philistine ». Littéralement : « d’entre les filles des Philistins ».'
    reason: L’expression hébraïque emploie une formulation partitive et familiale; l’alternative idiomatique indique l’appartenance philistine.
lexical_decisions:
- source_word: וַיַּעַל
  choice: Puis il remonta
  rationale: Le verbe עלה exprime une montée ou un déplacement vers un lieu situé plus haut. « Remonta » conserve ici cette nuance dans un récit où Samson revient de Timna.
- source_word: וַיַּגֵּד לְאָבִיו וּלְאִמּוֹ
  choice: en informa son père et sa mère
  rationale: Le hifil de נגד signifie faire savoir, raconter ou informer. « En informa » rend naturellement l’annonce faite aux deux parents sans ajouter de contenu.
- source_word: אִשָּׁה
  choice: une femme
  rationale: אִשָּׁה peut désigner une femme ou une épouse. Comme le mariage n’est demandé qu’ensuite, « une femme » convient au déroulement du discours.
- source_word: בְתִמְנָתָה
  choice: À Timna
  rationale: La forme désigne ici le lieu où Samson l’a vue. La mise en tête de phrase est naturelle en français.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: parmi les filles des Philistins
  rationale: Cette formulation conserve le sens partitif de מִן ainsi que l’expression familiale hébraïque « filles des Philistins ».
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Le terme marque le passage du constat à la demande immédiate.
- source_word: קְחוּ אוֹתָהּ לִּי לְאִשָּׁה
  choice: prenez-la pour moi comme femme
  rationale: L’impératif pluriel s’adresse aux deux parents. Dans ce contexte matrimonial, לקח évoque leur rôle dans l’obtention ou l’organisation du mariage, tandis que « pour moi comme femme » préserve les deux compléments hébreux.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le vouvoiement impératif pluriel « prenez » reflète l’adresse simultanée au père et à la mère. La tournure conserve la demande directe et abrupte de Samson sans l’atténuer.
