  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן אָחֽוּדָה נָּ֥א לָ/כֶ֖ם חִידָ֑ה אִם הַגֵּ֣ד תַּגִּידוּ֩ אוֹתָ֨/הּ לִ֜/י שִׁבְעַ֨ת יְמֵ֤י הַ/מִּשְׁתֶּה֙ וּ/מְצָאתֶ֔ם וְ/נָתַתִּ֤י לָ/כֶם֙ שְׁלֹשִׁ֣ים סְדִינִ֔ים וּ/שְׁלֹשִׁ֖ים חֲלִפֹ֥ת בְּגָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/012.yaml
  text: And Samson said to them[a], “Please let me put a riddle to you. If you indeed tell it to me within the seven days of the feast and solve it[c][b], then I will give you thirty linen garments and thirty changes of clothes.”
translation:
  language: fr
  text: 'Samson leur dit : « Permettez-moi de vous poser une énigme. Si vous me l’expliquez bel et bien au cours des sept jours du festin[a] et si vous en trouvez la solution[b], je vous donnerai trente vêtements de lin[c] et trente tenues de rechange. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pendant les sept jours du banquet ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « et si vous la trouvez », c’est-à-dire si vous résolvez l’énigme.
    reason: lexical_alternative
  - marker: c
    text: La forme exacte de ces vêtements est incertaine. L’hébreu mentionne des vêtements de lin, puis des ensembles de vêtements.
    reason: cultural_note
lexical_decisions:
- source_word: אָחֽוּדָה נָּ֥א לָכֶ֖ם חִידָ֑ה
  choice: Laissez-moi, je vous prie, vous proposer une énigme
  rationale: Le cohortatif de חוד accompagné de נָא exprime une proposition polie. Cette formulation française en conserve la nuance volitive sans raideur.
- source_word: אִם הַגֵּ֣ד תַּגִּידוּ֩ אוֹתָ֨הּ לִ֜י
  choice: Si vous me l’expliquez bel et bien
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. « Bel et bien » rend cette insistance, tandis que « expliquer » convient à la communication de la réponse d’une énigme.
- source_word: שִׁבְעַ֨ת יְמֵ֤י הַמִּשְׁתֶּה֙
  choice: au cours des sept jours du festin
  rationale: מִשְׁתֶּה désigne un festin ou banquet, ici les festivités nuptiales; la formule garde la période de sept jours sans préciser plus que l’hébreu la limite exacte.
- source_word: וּמְצָאתֶ֔ם
  choice: et si vous en trouvez la solution
  rationale: Le sens littéral est « trouver ». Dans le contexte d’une énigme, il s’agit d’en découvrir la solution; la note conserve le lien avec l’image hébraïque.
- source_word: שְׁלֹשִׁ֣ים סְדִינִ֔ים
  choice: trente vêtements de lin
  rationale: סְדִינִים désigne des pièces vestimentaires en lin, mais leur forme précise est incertaine. Le choix reste donc volontairement général.
- source_word: שְׁלֹשִׁ֖ים חֲלִפֹ֥ת בְּגָדִֽים
  choice: trente tenues de rechange
  rationale: L’expression désigne des ensembles ou changes de vêtements. « Tenues de rechange » est naturel en français et communique l’idée d’ensembles vestimentaires distincts.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct demeure naturel; « bel et bien » restitue l’emphase hébraïque sans introduire une notion explicite de capacité. Les désignations vestimentaires restent générales en raison de l’incertitude historique.
