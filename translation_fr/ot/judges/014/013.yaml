base_translation:
  language: en
  yaml_path: translation/ot/judges/014/013.yaml
  text: But if you cannot tell me[a], then you must give me thirty linen garments and thirty changes of clothes.” And they said to him, “Tell your riddle, and let us hear it.”
translation:
  language: fr
  text: 'Mais si vous ne pouvez pas me donner la réponse, vous me donnerez trente vêtements de lin[a] et trente vêtements de rechange. » Ils lui dirent : « Propose ton énigme, que nous l’entendions. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trente pièces de lin ». Le terme hébreu peut désigner des articles de fin lin; dans ce contexte, il s’agit probablement de vêtements.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוּכְלוּ
  choice: vous ne pouvez pas
  rationale: Le verbe יכל exprime la capacité. Dans cette condition, le présent français rend naturellement l’éventualité sans la transformer en refus volontaire.
- source_word: לְהַגִּיד לִי
  choice: me donner la réponse
  rationale: Le hiphil de נגד signifie « dire, annoncer ». Ici, l’objet implicite est la solution de l’énigme; cette formulation naturelle en français explicite seulement ce que le contexte exige.
- source_word: וּנְתַתֶּם אַתֶּם לִי
  choice: vous me donnerez
  rationale: Le parfait avec waw énonce la conséquence contraignante de la condition. Le futur français convient au cadre d’un pari, sans ajouter explicitement un verbe d’obligation absent de l’hébreu.
- source_word: סְדִינִים
  choice: vêtements de lin
  rationale: Le terme désigne des pièces de fin lin, probablement portées comme vêtements dans ce contexte où elles sont mises en parallèle avec des habits de rechange.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: vêtements de rechange
  rationale: L’expression désigne des tenues ou habits de remplacement; cette formulation est claire et idiomatique en français moderne.
- source_word: חוּדָה חִידָתְךָ
  choice: Propose ton énigme
  rationale: L’impératif de חוד signifie ici soumettre ou poser une énigme. « Propose » restitue précisément l’acte demandé et reste naturel dans le dialogue.
- source_word: וְנִשְׁמָעֶנָּה
  choice: que nous l’entendions
  rationale: Cette tournure rend la valeur volitive du cohortatif pluriel et conserve le suffixe féminin renvoyant à l’énigme.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement est conservé dans le dialogue direct singulier, tandis que le pluriel « vous » désigne les interlocuteurs de Samson. La formulation maintient la structure conditionnelle du pari.
