source:
  edition: WLC
  text: וַ/יֵּ֧רֶד שִׁמְשׁ֛וֹן וְ/אָבִ֥י/ו וְ/אִמּ֖/וֹ תִּמְנָ֑תָ/ה וַ/יָּבֹ֨אוּ֙ עַד כַּרְמֵ֣י תִמְנָ֔תָ/ה וְ/הִנֵּה֙ כְּפִ֣יר אֲרָי֔וֹת שֹׁאֵ֖ג לִ/קְרָאתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/005.yaml
  text: Then Samson went down with his father and his mother to Timnah[a], and they came as far as the vineyards of Timnah. And behold[c][b], a young lion was roaring as it came toward him.
translation:
  language: fr
  text: Alors Samson descendit à Timna avec son père et sa mère. Ils arrivèrent jusqu’aux vignobles de Timna, et voici qu’un jeune lion[a] rugissait en venant à sa rencontre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « un jeune lion de lions », tournure idiomatique désignant un jeune lion.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « rugissait en s’avançant vers lui » ; l’expression hébraïque peut signifier « à sa rencontre » ou « vers lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Le verbe ירד exprime une descente. « Descendit » conserve ici la nuance géographique du trajet vers Timna tout en restant naturel en français.
- source_word: תִּמְנָתָה
  choice: à Timna
  rationale: Le hé directionnel indique un mouvement vers Timna ; en français courant, la destination s’exprime naturellement par « à Timna ».
- source_word: וַיָּבֹאוּ עַד
  choice: ils arrivèrent jusqu’aux
  rationale: La combinaison de בוא et עַד marque l’arrivée à une étape précise du trajet. « Arrivèrent jusqu’aux » en conserve la portée.
- source_word: כַּרְמֵי תִמְנָתָה
  choice: les vignobles de Timna
  rationale: Le construit désigne littéralement les vignobles rattachés à Timna, sans exiger qu’on précise s’ils se trouvent dans la ville ou à proximité.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette formule attire vivement l’attention sur un événement soudain. « Et voici que » garde cet effet narratif dans un registre français digne mais actuel.
- source_word: כְּפִיר אֲרָיוֹת
  choice: un jeune lion
  rationale: כְּפִיר désigne un jeune lion plutôt qu’un tout petit lionceau. L’expression complète, littéralement « un jeune lion de lions », est idiomatique et se rend naturellement par « un jeune lion ».
- source_word: שֹׁאֵג
  choice: rugissait
  rationale: Le participe hébreu présente le rugissement comme une action en cours. L’imparfait français restitue cet aspect dans le récit.
- source_word: לִקְרָאתוֹ
  choice: en venant à sa rencontre
  rationale: לִקְרַאת peut signifier « à la rencontre de » ou « vers ». La formulation retenue conserve le mouvement hostile vers Samson sans ajouter explicitement l’idée d’une attaque.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au premier plan du récit, tandis que l’imparfait rend l’action en cours exprimée par le participe hébreu. « Voici que » préserve la vivacité de הִנֵּה sans recourir à une tournure archaïque.
