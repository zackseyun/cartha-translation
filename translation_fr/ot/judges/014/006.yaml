  text: וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַֽ/יְשַׁסְּעֵ֨/הוּ֙ כְּ/שַׁסַּ֣ע הַ/גְּדִ֔י וּ/מְא֖וּמָה אֵ֣ין בְּ/יָד֑/וֹ וְ/לֹ֤א הִגִּיד֙ לְ/אָבִ֣י/ו וּ/לְ/אִמּ֔/וֹ אֵ֖ת אֲשֶׁ֥ר עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/006.yaml
  text: Then the Spirit of Yahweh rushed upon him[a], and he tore it apart as one tears apart a young goat, though he had nothing in his hand[b]. But he did not tell his father or his mother what he had done.
translation:
  language: fr
  text: Alors l’Esprit de Yahweh fondit sur lui[a], et il le déchira comme on déchire un chevreau[b], alors qu’il n’avait rien dans la main. Mais il ne raconta ni à son père ni à sa mère ce qu’il avait fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vint sur lui avec puissance » ; autre traduction possible : « le saisit avec puissance ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu désigne un chevreau, c’est-à-dire le petit d’une chèvre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו
  choice: fondit sur lui
  rationale: Dans les récits des Juges, צלח avec עַל décrit la venue soudaine et puissante de l’Esprit sur une personne. « Fondit sur lui » conserve cette force et cette vivacité, sans ajouter une explication absente de l’hébreu.
- source_word: רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  rationale: רוּחַ désigne ici l’Esprit de Dieu qui communique une puissance extraordinaire, et non un simple vent ou une disposition intérieure. Le nom divin est conservé sous la forme « Yahweh ».
- source_word: וַיְשַׁסְּעֵהוּ
  choice: il le déchira
  rationale: Le verbe שׁסע exprime l’action violente de fendre ou de déchirer. Le pronom masculin renvoie au lion mentionné dans le contexte immédiat; le français « le » respecte cette reprise sans répéter inutilement le nom.
- source_word: כְּשַׁסַּע הַגְּדִי
  choice: comme on déchire un chevreau
  rationale: La tournure comparative décrit la manière ou la facilité de l’action. « Chevreau » est le terme français courant et précis pour גְּדִי.
- source_word: וּמְאוּמָה אֵין בְּיָדוֹ
  choice: alors qu’il n’avait rien à la main
  rationale: 'La formulation française fait ressortir naturellement le contraste: Samson accomplit l’exploit sans objet ni arme dans la main, tout en restant proche du sens littéral.'
- source_word: וְלֹא הִגִּיד לְאָבִיו וּלְאִמּוֹ
  choice: Mais il ne raconta ni à son père ni à sa mère
  rationale: « Mais » rend le léger contraste narratif, et la construction « ni… ni… » exprime clairement qu’aucun des deux parents n’a été informé.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: ce qu’il avait fait
  rationale: Le plus-que-parfait français situe naturellement l’acte avant le silence de Samson dans la succession narrative.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom divin personnel plutôt que de le remplacer par un titre.
- issue: Nature de רוּחַ dans le récit
  choice: l’Esprit
  alternative: le souffle
  rationale: Le contexte décrit une puissance personnelle venant de Yahweh et rendant Samson capable d’un exploit extraordinaire. La traduction « l’Esprit » correspond à cet emploi récurrent dans le livre des Juges sans préciser davantage le mode de cette action.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve la vigueur de l’hébreu, emploie « chevreau » plutôt que le terme moins précis « petit », et évite de développer explicitement l’idée d’une arme, seulement suggérée par l’absence de tout objet à la main.
