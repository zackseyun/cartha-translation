  text: And Samson’s wife became the wife of his companion[a], who had been his friend.
translation:
  language: fr
  text: La femme de Samson devint celle de son compagnon[a], qui avait été son ami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La femme de Samson devint celle de son ami, qui l’avait accompagné. » L’hébreu emploie deux termes apparentés de la famille רעה, qui évoquent ici une relation d’association, d’amitié ou d’accompagnement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: devint
  rationale: Le wayyiqtol de היה exprime ici le résultat narratif et un changement de situation; « devint » rend mieux cette transition que le statique « fut ».
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: La femme de Samson
  rationale: La chaîne construite désigne directement la relation conjugale; cette formulation est naturelle et fidèle en français.
- source_word: לְמֵרֵעֵהוּ
  choice: celle de son compagnon
  rationale: Avec היה, la préposition ל marque ici l'appartenance ou le transfert de relation. « Celle de » évite la répétition lourde de « la femme » tout en indiquant qu'elle devint la femme du compagnon. Le nom désigne un associé ou compagnon, particulièrement approprié au contexte des noces.
- source_word: אֲשֶׁר רֵעָה לוֹ
  choice: qui avait été son ami
  rationale: Le verbe apparenté au groupe רעה exprime ici une relation d'association ou d'amitié, non l'action de faire paître. Le plus-que-parfait situe naturellement cette relation avant le dénouement raconté.
