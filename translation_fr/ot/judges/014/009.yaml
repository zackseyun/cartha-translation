base_translation:
  language: en
  yaml_path: translation/ot/judges/014/009.yaml
  text: He scraped it into his hands and went on[a], eating as he went. Then he went to his father and mother and gave some to them, and they ate. But he did not tell them that he had scraped the honey from the carcass of the lion.
translation:
  language: fr
  text: Il retira le miel de la carcasse et le prit dans le creux de ses mains ; il poursuivit son chemin en mangeant. Puis il alla vers son père et sa mère, leur en donna, et ils en mangèrent. Mais il ne leur dit pas qu’il avait retiré le miel de la carcasse du lion.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prélevé » ou « recueilli » ; le verbe hébreu évoque ici le fait de retirer à la main le miel qui se trouvait dans la carcasse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֵּהוּ
  choice: Il le recueillit
  rationale: Le verbe רדה désigne ici l’action de retirer le miel de l’intérieur de la carcasse. « Recueillir » rend naturellement le prélèvement du miel sans préciser plus que l’hébreu la manière exacte de le détacher.
- source_word: אֶל כַּפָּיו
  choice: dans le creux de ses mains
  rationale: כַּף désigne la paume ou le creux de la main. Cette expression française concrète et idiomatique conserve l’image du texte.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְאָכֹל
  choice: poursuivit son chemin en mangeant
  rationale: 'La construction avec infinitifs absolus présente deux actions qui se prolongent simultanément : il avance tout en mangeant.'
- source_word: וַיֵּלֶךְ אֶל אָבִיו וְאֶל אִמּוֹ
  choice: Puis il alla vers son père et sa mère
  rationale: הלך signifie simplement « aller »; « puis » marque naturellement la progression narrative.
- source_word: וַיִּתֵּן לָהֶם
  choice: leur en donna
  rationale: Le pronom « en » reprend le miel et exprime naturellement en français la quantité non précisée donnée aux parents.
- source_word: וַיֹּאכֵלוּ
  choice: ils en mangèrent
  rationale: « En » reprend explicitement le miel sans alourdir la phrase.
- source_word: וְלֹא הִגִּיד לָהֶם
  choice: Mais il ne leur dit pas
  rationale: « Mais » restitue le contraste contextuel, tandis que « dire » est l’équivalent narratif courant de הגיד.
- source_word: מִגְּוִיַּת הָאַרְיֵה
  choice: dans la carcasse du lion
  rationale: גְּוִיָּה désigne ici le corps mort d’un animal; « carcasse » en garde la force concrète. Avec le verbe français « recueillir », « dans » indique naturellement le lieu d’où le miel a été retiré.
- source_word: רָדָה הַדְּבָשׁ
  choice: avait recueilli le miel
  rationale: La répétition de רדה est rendue par le même verbe, et le plus-que-parfait convient à l’explication rétrospective introduite par כִּי.
