  to: Il retira le miel de la carcasse et le prit dans le creux de ses mains ; il poursuivit son chemin en mangeant. Puis il alla vers son père et sa mère, leur en donna, et ils en mangèrent. Mais il ne leur dit pas qu’il avait retiré le miel de la carcasse du lion.[a]
  rationale: La révision remplace « recueillir » par « retirer » aux deux occurrences de רדה afin d’exprimer sans ambiguïté que le miel est enlevé de la carcasse. Elle maintient l’image des mains, le déroulement continu de la marche et de la consommation, ainsi que la part non précisée donnée aux parents.
