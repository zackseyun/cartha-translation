  yaml_path: translation/ot/judges/014/008.yaml
  text: After some days he returned to take her, and he turned aside to see the carcass of the lion, and behold, a swarm of bees was in the body of the lion, and honey.
translation:
  language: fr
  text: Après quelque temps, il revint pour l’épouser. Il se détourna pour voir la carcasse du lion, et voici qu’il y avait dans le corps du lion un essaim d’abeilles et du miel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיָּמִים
  choice: Quelques jours plus tard
  rationale: L’expression indique qu’un certain temps s’est écoulé; cette formulation française naturelle conserve l’indétermination de l’hébreu.
- source_word: לְקַחְתָּהּ
  choice: pour la prendre
  rationale: Le choix garde la formulation sobre et l’ambiguïté relative du verbe לקח dans le contexte matrimonial, sans ajouter «pour femme», absent de ce verset.
- source_word: וַיָּסַר
  choice: Il fit un détour
  rationale: Le verbe exprime ici le fait de quitter son chemin pour aller voir quelque chose; «faire un détour» rend naturellement ce mouvement.
- source_word: מַפֶּלֶת הָאַרְיֵה
  choice: la carcasse du lion
  rationale: מַפֶּלֶת désigne ici le lion tombé, donc son cadavre; «carcasse» convient au corps d’un animal mort.
- source_word: עֲדַת דְּבוֹרִים
  choice: un essaim d’abeilles
  rationale: Bien que עֵדָה signifie littéralement un groupe ou une assemblée, «essaim» est le terme idiomatique français pour un groupe d’abeilles.
- source_word: בִּגְוִיַּת הָאַרְיֵה
  choice: dans le corps du lion
  rationale: «Corps» traduit גְּוִיָּה sans répéter «carcasse» et suit directement la représentation du texte.
- source_word: וּדְבָשׁ
  choice: et du miel
  rationale: La proposition nominale très brève de l’hébreu est conservée autant que le permet le français; «il y avait» posé plus tôt régit aussi ce dernier élément.
