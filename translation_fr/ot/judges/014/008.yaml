review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend fidèlement la progression du récit et les principaux termes hébreux : retour après un laps de temps indéterminé, écart du chemin, dépouille du lion, essaim et miel. Toutefois, dans ce contexte matrimonial explicite (cf. 14.2-3, 7), לְקַחְתָּהּ signifie « pour l’épouser » ; « pour la prendre » ne communique pas naturellement ce sens en français moderne et introduit une ambiguïté indue.'
  naturalness: La phrase est globalement fluide. « Après quelque temps » est plus idiomatique et aussi indéterminé que מִיָּמִים. « Il se détourna » rend directement וַיָּסַר et évite l’idée potentiellement plus marquée d’un détour planifié.
  terminology: « Carcasse », « essaim d’abeilles », « corps du lion » et « miel » sont justes et conviennent au registre narratif. Aucun terme théologique ni nom propre ne requiert d’ajustement.
  issues:
  - severity: medium
    issue: « pour la prendre »
    rationale: Dans le français international actuel, cette expression est peu naturelle pour un projet de mariage et peut évoquer une prise de possession ou un enlèvement. Le contexte narratif établit que Samson revient pour épouser la femme ; « pour l’épouser » exprime le sens contextuel de לקח sans ajout doctrinal.
  - severity: low
    issue: « Quelques jours plus tard »
    rationale: מִיָּמִים signifie littéralement « après des jours », expression idiomatique pour un délai non précisé. « Après quelque temps » conserve mieux cette indétermination.
  revised_text: Après quelque temps, il revint pour l’épouser. Il se détourna pour voir la carcasse du lion, et voici qu’il y avait dans le corps du lion un essaim d’abeilles et du miel.
