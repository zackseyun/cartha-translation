  text: וַ/יֵּ֖רֶד וַ/יְדַבֵּ֣ר לָ/אִשָּׁ֑ה וַ/תִּישַׁ֖ר בְּ/עֵינֵ֥י שִׁמְשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/007.yaml
  text: Then he went down and spoke to the woman[a], and she was pleasing in Samson’s eyes.
translation:
  language: fr
  text: Puis il descendit et parla à la femme. Elle était agréable aux yeux de Samson[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autrement dit : « elle plut à Samson » ou « elle lui parut convenable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Puis il descendit
  rationale: Le verbe ירד exprime une descente, ici vers Timna. « Puis » rend naturellement la progression narrative portée par le waw consécutif.
- source_word: וַיְדַבֵּר לָאִשָּׁה
  choice: et parla à la femme
  rationale: דבר avec ל signifie parler à quelqu’un. אִשָּׁה désigne ici la femme que Samson souhaite épouser, sans qu’elle soit encore sa femme.
- source_word: וַתִּישַׁר
  choice: Elle parut juste
  rationale: La forme issue de ישר exprime ici une appréciation favorable ou une convenance. Cette formulation conserve le lien lexical avec l’idée de ce qui est « juste » sans imposer le sens plus affectif de « plaire ».
- source_word: בְּעֵינֵי שִׁמְשׁוֹן
  choice: aux yeux de Samson
  rationale: Le maintien de l’image hébraïque préserve le point de vue subjectif de Samson et l’éventuel écho au motif de ce qui paraît juste aux yeux de chacun dans le livre des Juges.
theological_decisions:
- issue: Éventuel écho au motif de ce qui est juste aux yeux de quelqu’un dans le livre des Juges
  choice: « Elle parut juste aux yeux de Samson »
  alternative: « Elle plut à Samson »
  rationale: La traduction conserve l’ambiguïté entre agrément, convenance et jugement subjectif, ainsi que la possible résonance littéraire, sans déclarer explicitement que le choix de Samson était moralement juste.
translation_notes:
  register: Français international moderne, sobre et narratif. La tournure « aux yeux de Samson » est volontairement conservée pour respecter l’image et la tension littéraire de l’hébreu.
