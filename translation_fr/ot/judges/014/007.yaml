  naturalness: « Elle était agréable aux yeux de Samson » est clair en français moderne soutenu et narratif. Il conserve l’image évaluative « aux yeux de Samson » sans la confusion créée par « parut juste ».
  terminology: '« La femme » convient : elle n’est pas encore l’épouse de Samson. « Agréable » rend de façon suffisamment large l’idée qu’elle lui plaisait ou lui semblait convenable, sans réduire le propos à l’attirance ni affirmer une approbation morale.'
