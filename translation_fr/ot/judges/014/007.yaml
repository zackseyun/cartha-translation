revisions:
- from: Puis il descendit et parla à la femme[a]. Elle parut juste aux yeux de Samson.
  to: Puis il descendit et parla à la femme. Elle était agréable aux yeux de Samson[a].
  rationale: La révision remplace « parut juste », qui introduit en français un sens d’équité ou de rectitude absent du contexte, par « était agréable aux yeux de Samson ». Cette formulation conserve l’évaluation favorable, l’aspect descriptif de l’hébreu et l’expression « aux yeux de Samson », tout en laissant ouverte la nuance entre plaisir et convenance. La note est déplacée vers l’expression qui comporte l’alternative idiomatique pertinente.
