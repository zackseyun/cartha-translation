- from: Elle pleura auprès de lui pendant les sept jours que dura le festin[a]. Le septième jour, il lui donna la réponse, parce qu’elle le pressait sans relâche. Puis elle communiqua l’énigme aux hommes de son peuple[b].
  to: Elle pleura devant lui[a] pendant les sept jours que dura le festin. Le septième jour, il lui révéla la réponse, parce qu’elle le pressait sans relâche. Puis elle fit connaître l’énigme aux hommes de son peuple[b].
  rationale: 'Révision limitée visant à mieux rendre l’orientation des pleurs et leur fonction de pression, à rattacher précisément la note lexicale à son expression source, et à employer des verbes français narratifs qui conservent l’idée de divulgation. La référence contextuelle de « la réponse » ne modifie pas le sens: il s’agit de la solution de l’énigme que Samson finit par révéler.'
