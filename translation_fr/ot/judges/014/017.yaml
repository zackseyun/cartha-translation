  yaml_path: translation/ot/judges/014/017.yaml
  text: She wept before him the seven days that they had the feast[a]. And on the seventh day he told her, because she pressed him hard[b]; then she told the riddle to the sons of her people.
translation:
  language: fr
  text: Elle pleura devant lui[a] pendant les sept jours que dura le festin. Le septième jour, il lui révéla la réponse, parce qu’elle le pressait sans relâche. Puis elle fit connaître l’énigme aux hommes de son peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque signifie littéralement qu’elle « pleura sur lui » : ses pleurs étaient dirigés vers lui et exerçaient sur lui une pression persistante.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « aux fils de son peuple »; il s’agit vraisemblablement des hommes de son peuple, c’est-à-dire des Philistins mentionnés dans le contexte immédiat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ עָלָיו
  choice: Elle pleura auprès de lui
  rationale: בכה signifie « pleurer » et עַל avec le suffixe indique ici que ses pleurs sont dirigés vers Samson et exercent une pression sur lui. « Auprès de lui » reste naturel en français tout en évitant de transformer implicitement les pleurs en paroles.
- source_word: שִׁבְעַת הַיָּמִים אֲשֶׁר הָיָה לָהֶם הַמִּשְׁתֶּה
  choice: pendant les sept jours que dura le festin
  rationale: La formulation conserve la durée complète et rend naturellement la relative hébraïque. מִשְׁתֶּה désigne un festin ou banquet, souvent accompagné de boisson, sans qu’il soit nécessaire de surspécifier.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Le septième jour
  rationale: La formule narrative introduit ici le moment de l’action; cette tournure française concise en restitue la progression.
- source_word: וַיַּגֶּד לָהּ
  choice: il lui donna la réponse
  rationale: נגד signifie « faire connaître, dire ». Comme l’objet implicite est la solution de l’énigme, « donna la réponse » rend clairement le sens en français sans ajouter de contenu étranger au contexte.
- source_word: כִּי הֱצִיקַתְהוּ
  choice: parce qu’elle le pressait sans relâche
  rationale: Le hiphil de צוק exprime une pression forte et persistante. Cette formulation transmet à la fois l’insistance et la contrainte émotionnelle.
- source_word: וַתַּגֵּד הַחִידָה
  choice: elle communiqua l’énigme
  rationale: Le verbe נגד est repris, mais « communiqua » est naturel puisque la femme transmet aux siens l’explication ou la solution de l’énigme. Le français peut employer « l’énigme » par métonymie comme l’hébreu.
- source_word: לִבְנֵי עַמָּהּ
  choice: aux hommes de son peuple
  rationale: Littéralement « aux fils de son peuple »; dans le contexte, l’expression vise les hommes philistins de son propre peuple. « Hommes » conserve la référence masculine sans produire le calque peu naturel « fils de son peuple ».
