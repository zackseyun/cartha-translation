  text: וַ/תֵּבְךְּ֩ אֵ֨שֶׁת שִׁמְשׁ֜וֹן עָלָ֗י/ו וַ/תֹּ֨אמֶר֙ רַק שְׂנֵאתַ֨/נִי֙ וְ/לֹ֣א אֲהַבְתָּ֔/נִי הַֽ/חִידָ֥ה חַ֨דְתָּ֙ לִ/בְנֵ֣י עַמִּ֔/י וְ/לִ֖/י לֹ֣א הִגַּ֑דְתָּה וַ/יֹּ֣אמֶר לָ֗/הּ הִנֵּ֨ה לְ/אָבִ֧/י וּ/לְ/אִמִּ֛/י לֹ֥א הִגַּ֖דְתִּי וְ/לָ֥/ךְ אַגִּֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/016.yaml
  text: Then Samson’s wife wept before him and said[a], “You only hate me; you do not love me. You have posed the riddle to the sons of my people, but you have not told me.” And he said to her, “Look, I have not told my father or my mother, so should I tell you?”
translation:
  language: fr
  text: 'La femme de Samson pleura devant lui et dit : « Tu ne fais que me haïr, tu ne m’aimes pas ! Tu as proposé une énigme aux fils de mon peuple[a], mais à moi, tu ne l’as pas fait connaître. » Il lui répondit : « Écoute, je ne l’ai fait connaître ni à mon père ni à ma mère ; et je te la ferais connaître, à toi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils de mon peuple ». Dans ce contexte, l’expression désigne probablement les hommes de son peuple auxquels Samson avait proposé l’énigme.'
    reason: L’hébreu emploie une expression masculine concrète dont la portée contextuelle mérite d’être explicitée sans l’effacer dans le texte.
lexical_decisions:
- source_word: וַתֵּבְךְּ ... עָלָיו
  choice: pleura auprès de lui
  rationale: בכה signifie « pleurer ». Avec עַל devant une personne, l’expression indique ici qu’elle pleure auprès de Samson, en sa présence et à son adresse. Cette formulation reste naturelle sans préciser excessivement la posture physique ni expliciter la pression émotionnelle.
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: la femme de Samson
  rationale: Le groupe construit désigne simplement l’épouse de Samson. « La femme de Samson » est naturel en français narratif moderne.
- source_word: רַק שְׂנֵאתַנִי
  choice: Tu ne fais que me haïr
  rationale: רַק renforce l’accusation. « Ne faire que » restitue l’idée de « seulement » de façon idiomatique, tout en conservant directement le verbe « haïr ».
- source_word: שְׂנֵאתַנִי ... וְלֹא אֲהַבְתָּנִי
  choice: Tu ne fais que me haïr, tu ne m’aimes pas
  rationale: Le contraste explicite entre « haïr » et « aimer » est préservé, sans atténuer le caractère accusateur et affectif des paroles.
- source_word: הַחִידָה חַדְתָּ
  choice: Tu as proposé une énigme
  rationale: חִידָה désigne l’énigme du récit, et le verbe חוד signifie ici la proposer ou la soumettre. « Proposer une énigme » est précis et courant.
- source_word: לִבְנֵי עַמִּי
  choice: aux fils de mon peuple
  rationale: La traduction conserve le masculin explicite et l’expression concrète de l’hébreu, tout en signalant en note son sens contextuel probable.
- source_word: וְלִי לֹא הִגַּדְתָּה
  choice: mais à moi, tu ne l’as pas expliquée
  rationale: Le hiphil de נגד signifie « faire connaître, déclarer, expliquer ». Puisqu’il s’agit de révéler la solution d’une énigme, « expliquer » rend clairement le sens contextuel ; « à moi » est mis en relief comme en hébreu.
- source_word: הִנֵּה
  choice: Écoute
  rationale: הִנֵּה attire avec insistance l’attention de l’interlocutrice. Dans ce dialogue, « Écoute » en restitue naturellement la fonction discursive sans archaïsme.
- source_word: לְאָבִי וּלְאִמִּי לֹא הִגַּדְתִּי
  choice: je ne l’ai expliquée ni à mon père ni à ma mère
  rationale: La coordination négative française « ni… ni… » exprime naturellement l’hébreu et maintient la mention distincte des deux parents.
- source_word: וְלָךְ אַגִּיד
  choice: et je te l’expliquerais, à toi ?
  rationale: L’imparfait hébreu a ici une force interrogative rhétorique. Le conditionnel français rend l’incrédulité implicite, et la reprise « à toi » conserve l’emphase portée par לָךְ.
