translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue reste vif et émotionnel. Les formulations archaïques comme « voici » ou « déclarer » ont été évitées, tandis que la répétition accusatrice et l’emphase de l’hébreu ont été conservées.
