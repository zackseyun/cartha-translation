  to: 'La femme de Samson pleura devant lui et dit : « Tu ne fais que me haïr, tu ne m’aimes pas ! Tu as proposé une énigme aux fils de mon peuple[a], mais à moi, tu ne l’as pas fait connaître. » Il lui répondit : « Écoute, je ne l’ai fait connaître ni à mon père ni à ma mère ; et je te la ferais connaître, à toi ? »'
  rationale: La révision corrige la localisation de ses pleurs en « devant lui » et remplace « expliquer » par « faire connaître », formulation qui respecte mieux la portée sémantique non spécifiée de נגד. Le reste du texte et la note sont conservés, car ils sont fidèles, naturels et structurellement valides.
