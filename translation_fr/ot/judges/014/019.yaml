base_translation:
  language: en
  yaml_path: translation/ot/judges/014/019.yaml
  text: And the Spirit of Yahweh rushed upon him[a], and he went down to Ashkelon and struck down thirty men from among them, and took their spoil garments and gave the changes of clothes to those who had explained the riddle. And his anger burned, and he went up to his father's house.
translation:
  language: fr
  text: L’Esprit de Yahweh le saisit avec puissance. Il descendit à Ashkelon, tua trente hommes parmi eux, prit leurs vêtements[a] et donna les habits de rechange à ceux qui avaient donné la réponse à l’énigme. Sa colère s’enflamma, et il remonta chez son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les vêtements qu’il leur avait retirés ». Le terme hébreu peut désigner plus précisément les vêtements enlevés aux hommes tués et pris comme butin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: L’Esprit de Yahweh le saisit avec puissance
  rationale: Dans les récits des Juges, צלח avec רוּחַ יְהוָה décrit la venue soudaine et puissante de l’Esprit sur une personne. « Le saisit avec puissance » restitue cette force en français naturel, sans suggérer que Dieu approuve moralement chaque acte qui suit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve ici le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַיֵּרֶד אַשְׁקְלוֹן
  choice: Il descendit à Ashkelon
  rationale: Le verbe ירד signifie « descendre » et la tournure française conserve le mouvement indiqué par le récit.
- source_word: וַיַּךְ מֵהֶם שְׁלֹשִׁים אִישׁ
  choice: tua trente hommes parmi eux
  rationale: Dans ce contexte, נכה désigne un coup mortel. « Parmi eux » rend la valeur partitive de מֵהֶם sans alourdir la phrase.
- source_word: חֲלִיצוֹתָם
  choice: leurs vêtements[a]
  rationale: Le terme désigne des vêtements, probablement retirés aux hommes tués et pris comme butin. Le texte principal reste sobre, tandis que la note signale cette nuance contextuelle.
- source_word: הַחֲלִיפוֹת
  choice: les habits de rechange
  rationale: חליפות désigne ici les tenues promises dans le pari. « Habits de rechange » est une expression française courante et distincte du simple mot « vêtements ».
- source_word: לְמַגִּידֵי הַחִידָה
  choice: à ceux qui avaient donné la réponse à l’énigme
  rationale: Le participe de נגד désigne ceux qui ont fait connaître la solution. Cette formulation explicite naturellement leur rôle dans le contexte immédiat.
- source_word: וַיִּחַר אַפּוֹ
  choice: Sa colère s’enflamma
  rationale: La formulation conserve la métaphore hébraïque de la colère qui brûle tout en restant idiomatique en français.
- source_word: וַיַּעַל בֵּית אָבִיהוּ
  choice: il remonta chez son père
  rationale: « Remonta » conserve le mouvement exprimé par עלה, et « chez son père » est la manière naturelle de rendre בֵּית אָבִיהוּ dans ce contexte.
theological_decisions:
- issue: Langage décrivant l’action puissante de l’Esprit
  choice: L’Esprit de Yahweh le saisit avec puissance
  alternative: L’Esprit de Yahweh fondit sur lui
  rationale: La traduction affirme l’intervention divine directe et puissante rapportée par le texte, sans conclure que cette intervention constitue une approbation morale explicite de tous les actes de Samson.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases coordonnées de l’hébreu sont légèrement structurées pour une lecture naturelle, tout en conservant la succession rapide des actions et la tension théologique du récit.
