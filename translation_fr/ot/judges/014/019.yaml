  source_fidelity: 'Le texte rend fidèlement la succession narrative hébraïque : l’Esprit de Yahweh agit avec force sur Samson, celui-ci descend à Ashkelon, y tue trente hommes, prend leurs vêtements, remet les habits de rechange aux personnes qui ont fait connaître la solution, puis repart en colère vers la maison de son père. « Parmi eux » conserve de façon recevable la valeur de מֵהֶם sans prétendre identifier plus précisément le référent collectif.'
  naturalness: Le français est moderne, clair et narratif. « Le saisit avec puissance », « avait donné la réponse à l’énigme », « Sa colère s’enflamma » et « remonta chez son père » sont idiomatiques tout en gardant la vigueur du récit.
  terminology: « Yahweh » suit le choix de translittérer le tétragramme. La distinction entre « vêtements » (חֲלִיצוֹתָם) et « habits de rechange » (הַחֲלִיפוֹת) est bien maintenue. La note présente prudemment la nuance possible de vêtements retirés aux victimes et pris comme butin, sans l’imposer au texte principal.
