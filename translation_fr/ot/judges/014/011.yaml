  text: And when they saw him[a], they took thirty companions, and they were with him.
translation:
  language: fr
  text: Quand ils le virent, ils choisirent trente compagnons[a], et ceux-ci furent avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « amis » ; peut-être, plus précisément, des compagnons de noces.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹתָם אֹתוֹ
  choice: Quand ils le virent
  rationale: La construction avec כ suivi de l’infinitif construit exprime ici le temps. Le וַיְהִי introduit la circonstance narrative et n’a pas besoin d’être rendu séparément en français.
- source_word: וַיִּקְחוּ
  choice: ils choisirent
  rationale: לקח signifie fondamentalement « prendre », mais dans ce contexte il s’agit vraisemblablement de désigner ou de mettre auprès de Samson trente hommes. « Choisirent » est naturel en français tout en évitant l’étrange « prirent trente compagnons ».
- source_word: שְׁלֹשִׁים מֵרֵעִים
  choice: trente compagnons[a]
  rationale: מֵרֵעִים désigne des associés ou compagnons. Le contexte nuptial peut suggérer des compagnons de noces, mais le texte ne précise pas formellement leur fonction.
- source_word: וַיִּהְיוּ אִתּוֹ
  choice: qui restèrent avec lui
  rationale: Littéralement, « et ils furent avec lui ». « Restèrent avec lui » exprime naturellement en français leur présence auprès de Samson sans préciser davantage leur rôle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve l’indétermination du rôle exact des trente hommes tout en évitant un calque peu naturel.
