    issue: « depuis Harosheth-des-Nations jusqu’au torrent »
    rationale: Le couple « depuis ... jusqu’à » suggère plus volontiers une extension spatiale; le texte décrit l’appel des forces de Harosheth-haggoyim vers le nahr Kishon. « De ... jusqu’au ... » exprime mieux l’origine et la destination.
  - severity: low
    issue: Toponyme hybride « Harosheth-des-Nations »
    rationale: Le texte hébreu emploie un nom de lieu. Une translittération complète, Harosheth-Haggoïm, est plus cohérente et plus naturelle qu’une composition partiellement traduite.
