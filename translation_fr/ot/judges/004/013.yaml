  text: וַ/יַּזְעֵ֨ק סִֽיסְרָ֜א אֶת כָּל רִכְבּ֗/וֹ תְּשַׁ֤ע מֵאוֹת֙ רֶ֣כֶב בַּרְזֶ֔ל וְ/אֶת כָּל הָ/עָ֖ם אֲשֶׁ֣ר אִתּ֑/וֹ מֵ/חֲרֹ֥שֶׁת הַגּוֹיִ֖ם אֶל נַ֥חַל קִישֽׁוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/013.yaml
  text: Then Sisera called together all his chariots[a], nine hundred iron chariots, and all the people who were with him, from Harosheth-haggoyim to the Wadi Kishon.
translation:
  language: fr
  text: Alors Sisera rassembla tous ses chars — neuf cents chars de fer — ainsi que tout le peuple qui était avec lui, de Harosheth-Haggoïm jusqu’au torrent du Kishôn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’au cours d’eau du Kishôn » ou « jusqu’à l’oued du Kishôn » ; le mot hébreu naḥal peut désigner un cours d’eau, le lit d’un torrent ou une vallée parcourue par un torrent saisonnier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: rassembla
  rationale: Dans ce contexte militaire, le verbe désigne la mobilisation ou le rassemblement des forces; « rassembla » est naturel et conserve la valeur causative.
- source_word: רִכְבּוֹ
  choice: tous ses chars
  rationale: Le nom peut désigner collectivement les chars de guerre; l’apposition « neuf cents chars de fer » favorise ici le concret « chars ».
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: neuf cents chars de fer
  rationale: Traduction directe de l’expression, sans préciser de quelle manière le fer entrait dans leur fabrication ou leur équipement.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: tout le peuple qui était avec lui
  rationale: « Peuple » reste proche de עָם et laisse le contexte indiquer qu’il s’agit des hommes constituant ses forces, sans réduire explicitement le terme à « troupes ».
- source_word: מֵחֲרֹשֶׁת הַגּוֹיִם
  choice: depuis Harosheth-des-Nations
  rationale: Le toponyme est conservé sous une forme française transparente; la préposition מִן est rendue par « depuis », qui convient au déplacement jusqu’au Kishôn.
- source_word: נַחַל קִישׁוֹן
  choice: le torrent du Kishôn
  rationale: נַחַל peut désigner un cours d’eau, un torrent saisonnier ou son lit; « torrent » convient au relief concerné sans suggérer nécessairement un grand fleuve permanent.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. Les tirets mettent clairement « neuf cents chars de fer » en apposition. « Kishôn » suit une translittération française usuelle; « Harosheth-des-Nations » rend le toponyme intelligible sans développer son sens dans le corps du verset.
