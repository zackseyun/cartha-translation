base_translation:
  language: en
  yaml_path: translation/ot/judges/004/024.yaml
  text: And the hand of the sons of Israel went on[a], growing stronger against Jabin king of Canaan[c][b], until they cut off Jabin king of Canaan.
translation:
  language: fr
  text: La puissance des Israélites[a] ne cessa de s’accroître contre Yabîn, roi de Canaan, jusqu’à ce qu’ils détruisent Yabîn, roi de Canaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la main des fils d’Israël allait, devenant toujours plus forte » ; la « main » représente ici la puissance.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le verbe signifie « retrancher » ou « couper ». Il indique ici qu’ils détruisirent ou éliminèrent Yabîn de façon décisive.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ יַד
  choice: La puissance … ne cessa de s’accroître
  rationale: Littéralement, « la main … alla ». En hébreu, « main » désigne ici la puissance ou l’emprise, et la construction progressive qui suit exprime une intensification continue. Une traduction idiomatique est nécessaire en français courant.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression hébraïque signifie littéralement « les fils d’Israël », mais désigne collectivement le peuple d’Israël. « Les Israélites » est naturel, précis et inclusif dans ce contexte national.
- source_word: הָלוֹךְ וְקָשָׁה
  choice: ne cessa de s’accroître
  rationale: 'La combinaison de l’infinitif absolu הָלוֹךְ et de וְקָשָׁה marque une progression continue : la pression ou la puissance d’Israël devenait toujours plus forte contre Yabîn.'
- source_word: עַל
  choice: contre
  rationale: Dans ce contexte de conflit, la préposition exprime une action hostile dirigée contre Yabîn.
- source_word: הִכְרִיתוּ אֵת יָבִין
  choice: ils l’anéantissent
  rationale: Le hiphil de כרת signifie ici faire disparaître, éliminer ou détruire. Le pronom évite en français la répétition pesante du nom et conserve clairement Yabîn comme objet.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore hébraïque de la « main » est explicitée dans la note plutôt que reproduite dans le corps du verset, où elle serait peu naturelle. Le nom יָבִין est transcrit « Yabîn » selon sa prononciation hébraïque.
