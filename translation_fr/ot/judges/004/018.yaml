  naturalness: « Faire un détour par chez moi » et « faire un détour par chez elle » sont lourds et peu naturels dans un récit biblique français moderne. « Entre, mon seigneur, entre chez moi » est idiomatique dans ce contexte, tout en signalant en note le sens spatial littéral du verbe.
  terminology: « Yaël », « Sisera », « mon seigneur » et « couverture » conviennent. La note doit porter sur le mot traduit « Entre » plutôt que sur « lui dit », afin que son ancrage soit précis.
