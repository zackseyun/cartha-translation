  to: 'Yaël sortit à la rencontre de Sisera et lui dit : « Entre[a], mon seigneur, entre chez moi. N’aie pas peur. » Il se rendit donc auprès d’elle, dans la tente, et elle le couvrit d’une couverture[b].'
  rationale: La révision remplace une tournure française maladroite par l’invitation contextuelle naturelle « Entre », tout en préservant par une note la valeur littérale et l’ambiguïté lexicale de l’hébreu. Elle maintient la répétition de l’invitation, le ton de déférence et les deux notes lexicales, avec une ancre a déplacée sur le mot qu’elle explique.
