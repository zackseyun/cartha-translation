  text: וַ/תֵּצֵ֣א יָעֵל֮ לִ/קְרַ֣את סִֽיסְרָא֒ וַ/תֹּ֣אמֶר אֵלָ֗י/ו סוּרָ֧/ה אֲדֹנִ֛/י סוּרָ֥/ה אֵלַ֖/י אַל תִּירָ֑א וַ/יָּ֤סַר אֵלֶ֨י/הָ֙ הָ/אֹ֔הֱלָ/ה וַ/תְּכַסֵּ֖/הוּ בַּ/שְּׂמִיכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/018.yaml
  text: Jael went out to meet Sisera and said to him[a], “Turn aside, my lord, turn aside to me; do not be afraid.” So he turned aside to her into the tent[b], and she covered him with a blanket.
translation:
  language: fr
  text: 'Yaël sortit à la rencontre de Sisera et lui dit : « Entre[a], mon seigneur, entre chez moi. N’aie pas peur. » Il se rendit donc auprès d’elle, dans la tente, et elle le couvrit d’une couverture[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Détourne-toi, mon seigneur, détourne-toi vers moi. » Le verbe hébreu signifie littéralement « se détourner » ou « s’écarter »; dans ce contexte, il invite Sisera à quitter sa route pour entrer dans un abri.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner un tapis ou une autre étoffe servant à couvrir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: sortit
  rationale: Le verbe יצא exprime un mouvement vers l’extérieur ; « sortit » indique naturellement que Yaël quitte sa tente pour aller vers Sisera.
- source_word: לִקְרַאת
  choice: à la rencontre de
  rationale: Cette expression marque un déplacement intentionnel vers une personne ; « à la rencontre de » convient au récit et au registre.
- source_word: סוּרָה
  choice: Fais un détour par ici / fais un détour par chez moi
  rationale: סור signifie fondamentalement s’écarter ou se détourner de sa route. Cette formulation conserve l’image spatiale et la répétition, tout en restant intelligible en français.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: L’expression est une formule de déférence adressée à un homme de rang supérieur ; la minuscule évite d’en faire un titre divin.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Traduction française naturelle de la défense exprimée par ירא, sans atténuer la réassurance.
- source_word: וַיָּסַר
  choice: Il fit donc un détour
  rationale: La reprise du même champ lexical que l’impératif de Yaël montre explicitement que Sisera répond à son invitation.
- source_word: הָאֹהֱלָה
  choice: entra dans la tente
  rationale: Le suffixe directionnel indique un mouvement vers la tente ; le contexte implique l’entrée, rendue explicitement pour un français naturel.
- source_word: וַתְּכַסֵּהוּ
  choice: elle le couvrit
  rationale: כסה signifie directement « couvrir » ; cette traduction évite d’ajouter l’idée possible, mais non explicite, de dissimulation.
- source_word: בַּשְּׂמִיכָה
  choice: d’une couverture
  rationale: שׂמיכה désigne une étoffe servant à couvrir, peut-être une couverture ou un tapis ; « couverture » est ici le terme courant le plus adapté.
