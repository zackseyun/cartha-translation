  terminology: « Qénite », « Qénites », « Héber », « Hobab », « Moïse », « Tsaânannim » et « Qédesh » sont cohérents. « grand arbre » préserve utilement l’incertitude botanique de אֵלוֹן ; les possibilités « chêne » et « térébinthe » sont correctement documentées en note.
