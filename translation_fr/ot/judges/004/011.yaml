  text: וְ/חֶ֤בֶר הַ/קֵּינִי֙ נִפְרָ֣ד מִ/קַּ֔יִן מִ/בְּנֵ֥י חֹבָ֖ב חֹתֵ֣ן מֹשֶׁ֑ה וַ/יֵּ֣ט אָהֳל֔/וֹ עַד אֵל֥וֹן ב/צענים אֲשֶׁ֥ר אֶת קֶֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/011.yaml
  text: Heber the Kenite had separated from the Kenites[a], from the sons of Hobab, the father-in-law of Moses, and had pitched his tent as far as the oak in Zaannannim[b], which is near Kedesh.
translation:
  language: fr
  text: Héber le Qénite s’était séparé des Qénites, des descendants de Hobab, un parent par alliance de Moïse[a], et avait dressé sa tente jusqu’au grand arbre de Tsaânannim[b], qui est près de Qédesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « beau-père de Moïse ». Le terme hébreu peut désigner plus largement un parent masculin par alliance.
    reason: alternative_reading
  - marker: b
    text: Ou « au chêne de Tsaânannim » ou « au térébinthe de Tsaânannim ». L’espèce de l’arbre n’est pas certaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְרָד
  choice: s’était séparé
  rationale: Le nifal de פרד exprime ici la séparation d’avec un groupe; le plus-que-parfait convient à cette information d’arrière-plan.
- source_word: הַקֵּינִי / מִקַּיִן
  choice: le Qénite / des Qénites
  rationale: Dans ce contexte, les deux formes renvoient au groupe qénite, et non au personnage de Caïn.
- source_word: מִבְּנֵי חֹבָב
  choice: des descendants de Hobab
  rationale: Littéralement «des fils de Hobab»; le sens clanique et généalogique est rendu naturellement par «descendants».
- source_word: חֹתֵן מֹשֶׁה
  choice: parent par alliance de Moïse
  rationale: Le terme désigne une relation masculine créée par mariage sans imposer nécessairement le sens précis de «beau-père»; cette traduction préserve son amplitude.
- source_word: וַיֵּט אָהֳלוֹ
  choice: Il avait dressé sa tente
  rationale: L’expression idiomatique signifie dresser ou déployer une tente; le plus-que-parfait maintient la fonction rétrospective du verset.
- source_word: עַד
  choice: jusqu’au
  rationale: La préposition marque l’étendue jusqu’à un point géographique.
- source_word: אֵלוֹן
  choice: grand arbre
  rationale: Le nom peut désigner un chêne ou un térébinthe; «grand arbre» conserve l’indétermination botanique du terme.
- source_word: בצענים
  choice: de Tsaânannim
  rationale: Le toponyme est translittéré selon une forme française claire; le préfixe ב est compris comme locatif.
- source_word: אֲשֶׁר אֶת קֶדֶשׁ
  choice: près de Qédesh
  rationale: La construction situe le lieu à proximité de Qédesh.
theological_decisions:
- issue: Sens de חֹתֵן dans le lien entre Hobab et Moïse
  choice: parent par alliance de Moïse
  alternative: beau-père de Moïse
  rationale: Le terme hébreu peut désigner plus largement un parent masculin par alliance. Le texte principal conserve cette ambiguïté, tandis que la lecture traditionnelle plus précise figure en note.
translation_notes:
  register: Français international moderne, naturel et digne. Les plus-que-parfaits signalent l’arrière-plan narratif. «Qénite», «Tsaânannim» et «Qédesh» suivent des formes francisées; l’ambiguïté du lien de parenté et celle de l’espèce de l’arbre sont préservées.
