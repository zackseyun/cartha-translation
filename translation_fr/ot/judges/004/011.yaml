  source_fidelity: 'Le sens général est fidèle : Héber est présenté comme séparé des Qénites issus de Hobab, et son installation est située jusqu’au grand arbre de Tsaânannim, près de Qédesh. Le rendu prudent de חֹתֵן est justifié. La relation finale doit toutefois rester explicitement rattachée au lieu/arbre, comme dans l’hébreu.'
