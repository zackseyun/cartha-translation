id: JDG.4.1
reference: Judges 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/אֵה֖וּד מֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh after Ehud died[a].
translation:
  language: fr
  text: Les Israélites recommencèrent à faire ce qui est mal aux yeux de Yahweh après la mort d’Éhoud.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסִפוּ ... לַעֲשׂוֹת
  choice: recommencèrent à faire
  rationale: La construction יסף suivie de l’infinitif exprime ici la répétition. « Recommencèrent à faire » restitue naturellement en français la rechute qui structure le récit des Juges.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression signifie littéralement « les fils d’Israël », mais fonctionne comme une désignation collective du peuple. « Les Israélites » est précis, inclusif dans ce contexte collectif et naturel en français moderne.
- source_word: הָרַע
  choice: ce qui est mal
  rationale: L’adjectif substantivé désigne ce que Yahweh juge mauvais. Cette formulation conserve l’évaluation morale tout en étant idiomatique.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette traduction préserve l’image hébraïque tout en constituant une expression française claire et courante.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre.
- source_word: וְאֵהוּד מֵת
  choice: après la mort d’Éhoud
  rationale: La proposition coordonnée fournit ici le cadre temporel de la rechute. La tournure nominale française exprime clairement cette relation sans surdéterminer l’aspect verbal.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin; sa translittération préserve cette valeur de nom propre au lieu de lui substituer un titre.
- issue: Portée du collectif בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Dans cette formule narrative, le masculin pluriel hébreu désigne collectivement le peuple. Le français « les Israélites » en conserve la référence sans suggérer que seuls les hommes sont concernés.
- issue: Relation temporelle de וְאֵהוּד מֵת
  choice: après la mort d’Éhoud
  alternative: et Éhoud mourut
  rationale: Dans le contexte narratif, la mort d’Éhoud marque le moment après lequel Israël retombe dans le mal; le rendu temporel explicite cette relation contextuelle sans ajouter de causalité.
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation reste digne et accessible; elle conserve l’image « aux yeux de » et évite le littéralisme peu naturel « les fils d’Israël ».
