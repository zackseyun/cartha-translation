  text: וּ/מָשַׁכְתִּ֨י אֵלֶ֜י/ךָ אֶל נַ֣חַל קִישׁ֗וֹן אֶת סִֽיסְרָא֙ שַׂר צְבָ֣א יָבִ֔ין וְ/אֶת רִכְבּ֖/וֹ וְ/אֶת הֲמוֹנ֑/וֹ וּ/נְתַתִּ֖י/הוּ בְּ/יָדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/007.yaml
  text: And I will draw Sisera[a], the commander of Jabin’s army, along with his chariots and his multitude, to you at the Wadi Kishon[b], and I will give him into your hand.
translation:
  language: fr
  text: J’attirerai vers toi, au torrent du Qishôn[a], Sisera, le chef de l’armée de Yabîn, avec ses chars et sa multitude[b], et je le livrerai entre tes mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au cours d’eau du Qishôn », « dans le lit du Qishôn » ou « dans la vallée du Qishôn » ; le terme hébreu peut désigner un cours d’eau, souvent saisonnier, son lit ou la vallée qu’il traverse.
    reason: lexical_alternative
  - marker: b
    text: Le terme peut désigner une multitude ; dans ce contexte, il peut aussi désigner ses hommes, ses troupes ou son armée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁכְתִּי
  choice: J’attirerai
  rationale: Le verbe משׁך exprime ici le fait d’amener Sisera vers un lieu déterminé. « Attirerai » conserve cette image sans ajouter l’idée plus précise d’un piège impliquée par « appâterai ».
- source_word: אֵלֶיךָ
  choice: vers toi
  rationale: La préposition avec suffixe masculin singulier indique un mouvement en direction de Barak; « vers toi » est naturel dans cette construction.
- source_word: אֶל נַחַל קִישׁוֹן
  choice: au torrent du Qishôn
  rationale: נחל peut désigner un cours d’eau, souvent saisonnier, ainsi que son lit ou sa vallée. « Torrent » rend bien le relief concerné tout en restant courant en français; la note préserve l’étendue sémantique.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Transcription française usuelle du nom propre.
- source_word: שַׂר צְבָא יָבִין
  choice: le chef de l’armée de Yabîn
  rationale: שׂר צבא désigne le responsable militaire. « Chef de l’armée » est clair, moderne et fidèle sans préciser un grade non indiqué.
- source_word: רִכְבּוֹ
  choice: ses chars
  rationale: רכב peut désigner collectivement les chars de guerre; le pluriel concret est naturel et clair en français.
- source_word: הֲמוֹנוֹ
  choice: toute sa troupe
  rationale: המון désigne une multitude ou une masse. Dans ce contexte militaire, « toute sa troupe » est idiomatique, tandis que la note signale le sens plus large du terme hébreu.
- source_word: וּנְתַתִּיהוּ
  choice: je le livrerai
  rationale: Avec « entre tes mains », נתן exprime la remise de quelqu’un au pouvoir d’un autre. « Livrerai » rend naturellement cet idiome en français.
- source_word: בְּיָדֶךָ
  choice: entre tes mains
  rationale: Cette expression française conserve l’image de l’idiome hébreu tout en exprimant clairement la mise au pouvoir de Barak.
theological_decisions: []
