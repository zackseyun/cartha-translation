  register: Français international moderne, digne et accessible. Les noms sont transcrits selon un usage français reconnaissable. La formulation conserve l’initiative divine, l’image de l’attraction et l’idiome des « mains », sans expliciter un stratagème que le verbe hébreu ne précise pas.
