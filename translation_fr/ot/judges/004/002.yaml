  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּמְכְּרֵ֣/ם יְהוָ֗ה בְּ/יַד֙ יָבִ֣ין מֶֽלֶךְ כְּנַ֔עַן אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חָצ֑וֹר וְ/שַׂר צְבָא/וֹ֙ סִֽיסְרָ֔א וְ/ה֥וּא יוֹשֵׁ֖ב בַּ/חֲרֹ֥שֶׁת הַגּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/002.yaml
  text: So Yahweh sold them into the hand of Jabin king of Canaan[a], who reigned in Hazor; and the commander of his army was Sisera[b], who lived in Harosheth-haggoyim.
translation:
  language: fr
  text: Alors Yahweh les vendit entre les mains de Yabîn, roi de Canaan[a], qui régnait à Hatsor. Le chef de son armée était Sisera, qui habitait à Harosheth-Ha-Goyim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les vendit dans la main de ». Cette expression de jugement signifie qu’il les livra au pouvoir de Yabîn.'
    reason: lexical_alternative
  - marker: b
    text: Harosheth-Ha-Goyim signifie probablement « Harosheth des Nations ».
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְכְּרֵם
  choice: les vendit
  rationale: Le verbe מָכַר signifie littéralement « vendre ». Dans le livre des Juges, cette image récurrente exprime le jugement par lequel Israël est livré à la domination d’un oppresseur. La conserver maintient la force du texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, plutôt que remplacement par un titre.
- source_word: בְּיַד
  choice: aux mains de
  rationale: L’expression hébraïque désigne le fait d’être placé sous le pouvoir de quelqu’un. Le français conserve ici l’image de la main tout en restant intelligible.
- source_word: יָבִין מֶלֶךְ כְּנַעַן
  choice: Yabîn, roi de Canaan
  rationale: Rend directement le nom et le titre en apposition, selon les conventions françaises de translittération biblique.
- source_word: אֲשֶׁר מָלַךְ בְּחָצוֹר
  choice: qui régnait à Hatsor
  rationale: מָלַךְ exprime le fait de régner ou d’être roi ; l’imparfait convient à l’arrière-plan narratif.
- source_word: וְשַׂר צְבָאוֹ
  choice: Le chef de son armée était
  rationale: שַׂר צָבָא désigne le responsable militaire suprême. « Chef de son armée » est clair et naturel en français moderne.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Translittération française courante du nom propre.
- source_word: וְהוּא יוֹשֵׁב
  choice: qui habitait
  rationale: La proposition se rapporte le plus naturellement à Sisera. L’imparfait restitue simplement la construction participiale hébraïque.
- source_word: בַּחֲרֹשֶׁת הַגּוֹיִם
  choice: à Harosheth-Ha-Goyim
  rationale: Le toponyme est translittéré afin de ne pas imposer dans le corps du texte une interprétation de son second élément, qui signifie littéralement « les nations ».
theological_decisions:
- issue: Action divine dans l’oppression d’Israël
  choice: Yahweh les vendit
  alternative: Yahweh permit qu’ils tombent au pouvoir de Yabîn
  rationale: L’hébreu attribue directement l’action à Yahweh dans le cadre du jugement. La traduction ne l’atténue pas en simple permission.
translation_notes:
  register: Français international moderne, narratif et digne. La métaphore forte de la vente et l’image des mains sont conservées ; les noms propres suivent des formes françaises aisément reconnaissables.
