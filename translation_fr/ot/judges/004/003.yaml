base_translation:
  language: en
  yaml_path: translation/ot/judges/004/003.yaml
  text: Then the sons of Israel cried out to the LORD, because he had nine hundred iron chariots, and he oppressed the sons of Israel harshly for twenty years.
translation:
  language: fr
  text: Alors les Israélites crièrent vers le SEIGNEUR, car il avait neuf cents chars de fer et opprimait durement les Israélites pendant vingt ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Expression française naturelle et exacte pour désigner collectivement les membres du peuple d’Israël.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française courante pour représenter le tétragramme tout en le distinguant d’un simple titre.
- source_word: רֶכֶב בַּרְזֶל
  choice: chars de fer
  rationale: Rendu formel qui préserve l’expression hébraïque sans préciser de façon conjecturale si le fer désigne le blindage, les garnitures ou certaines pièces des chars.
- source_word: לָחַץ ... בְּחָזְקָה
  choice: opprimait durement
  rationale: לָחַץ exprime l’oppression ou la contrainte, et בְחָזְקָה en souligne la rudesse et la puissance.
- source_word: עֶשְׂרִים שָׁנָה
  choice: depuis vingt ans
  rationale: Avec l’imparfait français, « depuis » exprime naturellement une oppression qui durait alors depuis vingt ans.
theological_decisions:
- issue: Référent du pronom masculin singulier dans « il avait » et « il opprimait »
  choice: Yabîn
  alternative: laisser les deux verbes avec le pronom « il »
  rationale: Le contexte immédiat de Juges 4.2 désigne Yabîn comme antécédent grammatical principal. Répéter son nom en français évite une ambiguïté artificielle, tout en n’effaçant pas le rôle militaire de Sisera exposé dans le récit.
translation_notes:
  register: Français international moderne, narratif et digne. L’inversion « crièrent » conserve une cadence biblique lisible; « les Israélites » évite le calque moins naturel « les fils d’Israël ».
