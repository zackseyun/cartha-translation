base_translation:
  language: en
  yaml_path: translation/ot/judges/004/019.yaml
  text: And he said to her[a], “Please give me a little water to drink, for I am thirsty.” So she opened the skin of milk and gave him a drink and covered him.
translation:
  language: fr
  text: 'Il lui dit : « Donne-moi, s’il te plaît, un peu d’eau à boire, car j’ai soif. » Elle ouvrit l’outre de lait[a], lui donna à boire et le recouvrit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Une outre est un récipient en peau destiné à contenir des liquides.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁקִי/נִי נָא
  choice: Donne-moi, s’il te plaît, … à boire
  rationale: L’impératif hiphil de שׁקה avec suffixe de première personne signifie « donner à boire », tandis que נָא adoucit la demande. Cette formulation est naturelle et respecte la valeur causative et polie de l’hébreu.
- source_word: מְעַט מַיִם
  choice: un peu d’eau
  rationale: מְעַט indique une petite quantité ; « un peu d’eau » rend directement et naturellement l’expression.
- source_word: כִּי צָמֵאתִי
  choice: car j’ai soif
  rationale: La proposition donne le motif de la demande. « J’ai soif » est l’expression idiomatique française correspondant à l’état exprimé par le verbe hébreu.
- source_word: נֹאוד הֶחָלָב
  choice: l’outre de lait
  rationale: נֹאוד désigne un récipient fait de peau. « Outre » conserve avec concision le cadre matériel ancien, et le complément indique que cette outre contient du lait.
- source_word: וַתַּשְׁקֵהוּ
  choice: lui donna à boire
  rationale: Le hiphil de שׁקה exprime le fait de donner à boire. Le lait étant nommé juste avant, il n’est pas nécessaire de le répéter.
- source_word: וַתְּכַסֵּהוּ
  choice: le recouvrit
  rationale: כסה signifie ici couvrir ou dissimuler. « Le recouvrit » maintient l’objet servant à le couvrir implicite, comme en hébreu, et fait écho à l’action précédente du récit.
