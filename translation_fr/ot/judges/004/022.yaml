translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions structurantes de הִנֵּה sont conservées, tout en évitant l’archaïsme « voici » employé isolément comme interjection. Aucun ajout doctrinal ni atténuation de la violence du récit.
