base_translation:
  language: en
  yaml_path: translation/ot/judges/004/022.yaml
  text: And look, Barak was pursuing Sisera. Jael went out to meet him and said to him, “Come, and I will show you the man whom you are seeking.” So he went in to her, and look, Sisera was lying there dead, with the tent peg in his temple.
translation:
  language: fr
  text: 'Et voici que Barak poursuivait Sisera. Yaël sortit à sa rencontre et lui dit : « Viens, je vais te montrer l’homme que tu cherches. » Il entra donc chez elle, et voici que Sisera gisait, mort, le piquet de tente dans la tempe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה / וְהִנֵּה
  choice: Or voici que / et voici que
  rationale: Le double הִנֵּה attire l’attention sur l’arrivée de Barak puis sur la découverte de Sisera. « Voici que » en conserve la fonction narrative dans un français digne et naturel.
- source_word: רֹדֵף
  choice: poursuivait
  rationale: Le participe décrit l’action en cours au moment où Barak arrive.
- source_word: לִקְרָאתוֹ
  choice: à sa rencontre
  rationale: Expression française idiomatique correspondant au mouvement de Yaël vers Barak pour l’accueillir.
- source_word: לֵךְ
  choice: Viens
  rationale: Dans ce contexte, l’impératif invite Barak à accompagner Yaël; le français « viens » exprime naturellement cette valeur contextuelle de הלך.
- source_word: וְאַרְאֶךָּ
  choice: je vais te montrer
  rationale: Rend l’intention immédiate exprimée par la forme hébraïque sans raideur.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: Il entra donc chez elle
  rationale: Le mouvement est vers Yaël dans sa tente; « chez elle » transmet naturellement cette relation spatiale, et « entra » est exigé par le contexte.
- source_word: נֹפֵל מֵת
  choice: gisait là, mort
  rationale: Le participe נֹפֵל décrit ici Sisera étendu ou gisant, tandis que מֵת affirme explicitement sa mort. « Là » rend la scène de découverte sans suggérer qu’il était encore en train de tomber.
- source_word: וְהַיָּתֵד בְּרַקָּתוֹ
  choice: le piquet de tente planté dans la tempe
  rationale: Le texte dit littéralement que le piquet est dans sa tempe; « planté » explicite naturellement l’état résultant déjà raconté au verset 21.
