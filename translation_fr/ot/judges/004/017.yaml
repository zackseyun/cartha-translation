source:
  edition: WLC
  text: וְ/סִֽיסְרָא֙ נָ֣ס בְּ/רַגְלָ֔י/ו אֶל אֹ֣הֶל יָעֵ֔ל אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י כִּ֣י שָׁל֗וֹם בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/017.yaml
  text: But Sisera fled on foot to the tent of Jael[a], the wife of Heber the Kenite[b], because there was peace between Jabin king of Hazor and the house of Heber the Kenite.
translation:
  language: fr
  text: Mais Sisera s’enfuit à pied à la tente de Yaël[a], la femme de Héber le Qénite, car il y avait la paix entre Yabîn, roi de Hatsor, et la maison de Héber le Qénite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et Sisera s’enfuit à pied. » La conjonction hébraïque peut se traduire simplement par « et » ; « mais » fait ressortir le contraste narratif dans ce contexte.'
    reason: alternative_reading
  - marker: b
    text: Ici, « la maison de Héber » désigne sa maisonnée ou son clan.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/סִֽיסְרָא֙
  choice: Mais Sisera
  rationale: La conjonction ו peut se traduire par « et », mais le contexte narratif marque ici un contraste avec la défaite de l’armée et l’abandon du char. « Mais » rend naturellement ce mouvement du récit.
- source_word: נָ֣ס
  choice: s’enfuit
  rationale: Le qal de נוס signifie couramment « fuir ». Le passé simple convient au récit suivi en français.
- source_word: בְּ/רַגְלָ֔י/ו
  choice: à pied
  rationale: Littéralement « par ses pieds » ; « à pied » est l’expression française idiomatique et indique qu’il fuit sans son char.
- source_word: אֶל אֹ֣הֶל יָעֵ֔ל
  choice: vers la tente de Yaël
  rationale: « Vers » convient au verbe de mouvement et « la tente de Yaël » reproduit clairement le syntagme construit hébreu.
- source_word: אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י
  choice: femme de Héber le Qénite
  rationale: Cette apposition identifie Yaël. En français biblique actuel, « femme de » exprime naturellement le lien matrimonial sans alourdir la phrase.
- source_word: כִּ֣י
  choice: car
  rationale: כִּי introduit ici la raison expliquant le choix de cette destination. « Car » maintient avec naturel le lien explicatif dans une phrase narrative autonome.
- source_word: שָׁל֗וֹם
  choice: la paix
  rationale: שָׁלוֹם désigne ici des relations pacifiques. « La paix » conserve l’étendue du terme sans préciser indûment s’il s’agissait d’une alliance formelle.
- source_word: בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין
  choice: entre Yabîn, roi de Hatsor, et
  rationale: La formulation rend directement la relation entre les deux parties ; les virgules signalent clairement l’apposition « roi de Hatsor ».
- source_word: בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי
  choice: la maison de Héber le Qénite
  rationale: « Maison » est l’équivalent formel de בֵּית et peut désigner ici la maisonnée ou le clan de Héber. Le terme est conservé, avec une note explicative.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. Les noms propres suivent une translittération française cohérente : Yaël, Héber, Qénite, Yabîn et Hatsor. Le passé simple est retenu pour la narration historique. Les deux notes préservent respectivement l’ambiguïté discursive de ו et la portée sociale de בֵּית.'
