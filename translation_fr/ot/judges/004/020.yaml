  yaml_path: translation/ot/judges/004/020.yaml
  text: And he said to her[a], “Stand at the entrance of the tent, and if anyone comes and asks you, saying, ‘Is there a man here?’ you shall say, ‘No.’”
translation:
  language: fr
  text: 'Il lui dit : « Tiens-toi à l’entrée de la tente. Si un homme vient et te demande : “Y a-t-il un homme ici ?”, tu répondras : “Non.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲמֹד
  choice: Tiens-toi
  rationale: L’impératif de עמד commande ici de prendre ou de garder une position. « Tiens-toi » exprime naturellement cette consigne en français.
- source_word: פֶּתַח הָאֹהֶל
  choice: à l’entrée de la tente
  rationale: פֶּתַח désigne l’ouverture ou l’entrée. « À l’entrée de la tente » convient au cadre matériel et reste idiomatique.
- source_word: וְהָיָה אִם
  choice: Si
  rationale: La tournure hébraïque introduit une éventualité conditionnelle. Le simple « Si » en restitue clairement la fonction sans calquer l’idiome hébreu.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom signifie ici « homme » et apparaît deux fois dans le texte hébreu. Sa répétition est conservée afin de ne pas neutraliser sans nécessité la formulation de la source.
- source_word: וּשְׁאֵלֵךְ וְאָמַר
  choice: te questionne et demande
  rationale: La coordination hébraïque enchaîne l’action d’interroger et les paroles prononcées. Cette formulation française reste naturelle tout en conservant les deux verbes.
- source_word: הֲיֵשׁ פֹּה אִישׁ
  choice: Y a-t-il un homme ici ?
  rationale: La question porte sur la présence d’un homme. Cette formulation rend explicitement יֵשׁ, פֹּה et אִישׁ.
- source_word: וְאָמַרְתְּ אָיִן
  choice: 'tu répondras : « Non. »'
  rationale: Le verbe hébreu signifie littéralement « tu diras », mais « tu répondras » explicite naturellement sa fonction dans cet échange. « Non » préserve la brièveté de אָיִן.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. La répétition de « un homme » suit celle de אִישׁ dans les deux propositions. La parataxe hébraïque est légèrement structurée en deux phrases pour assurer une lecture naturelle sans modifier le contenu.
