  text: וַ/תֹּ֜אמֶר הָלֹ֧ךְ אֵלֵ֣ךְ עִמָּ֗/ךְ אֶ֚פֶס כִּי֩ לֹ֨א תִֽהְיֶ֜ה תִּֽפְאַרְתְּ/ךָ֗ עַל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אַתָּ֣ה הוֹלֵ֔ךְ כִּ֣י בְֽ/יַד אִשָּׁ֔ה יִמְכֹּ֥ר יְהוָ֖ה אֶת סִֽיסְרָ֑א וַ/תָּ֧קָם דְּבוֹרָ֛ה וַ/תֵּ֥לֶך עִם בָּרָ֖ק קֶֽדְשָׁ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/009.yaml
  text: And she said[a], “I will surely go with you. Nevertheless, the honor will not be yours on the way that you are going, for Yahweh will sell Sisera into the hand of a woman.” Then Deborah arose and went with Barak to Kedesh.
translation:
  language: fr
  text: 'Elle répondit : « Je viendrai certainement avec toi. Cependant, ta gloire ne sera pas pour toi sur le chemin que tu prends, car Yahweh livrera Sisera entre les mains d’une femme[a]. » Puis Débora se leva et alla avec Barak à Qédesh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vendra Sisera entre les mains d’une femme ». Le verbe hébreu signifie proprement « vendre » et, dans ce contexte, évoque le fait de livrer quelqu’un au pouvoir d’un autre.'
    reason: Le texte principal rend idiomatiquement le sens contextuel de יִמְכֹּר (« livrera »), tandis que la note préserve sa valeur lexicale première (« vendra »).
lexical_decisions:
- source_word: הָלֹךְ אֵלֵךְ
  choice: Oui, j’irai
  rationale: La construction infinitif absolu + imparfait renforce l’affirmation. « Oui, j’irai » restitue naturellement cette insistance en français moderne.
- source_word: אֶפֶס
  choice: Cependant
  rationale: La particule introduit une restriction à l’accord de Débora ; « cependant » en exprime clairement la valeur adversative.
- source_word: תִּפְאַרְתְּךָ
  choice: tu ne retireras aucun honneur
  rationale: Dans ce contexte militaire, le terme désigne l’honneur ou le prestige attaché à la victoire, plutôt qu’une splendeur visuelle.
- source_word: עַל הַדֶּרֶךְ אֲשֶׁר אַתָּה הוֹלֵךְ
  choice: de la voie dans laquelle tu t’engages
  rationale: Cette formulation conserve l’image hébraïque de la voie tout en indiquant naturellement en français la démarche entreprise par Barak.
- source_word: בְיַד אִשָּׁה
  choice: aux mains d’une femme
  rationale: L’expression française conserve l’image de la main comme pouvoir ou domination, tout en restant idiomatique.
- source_word: יִמְכֹּר
  choice: livrera
  rationale: Le sens lexical premier est « vendre », mais dans ce contexte de guerre le verbe signifie remettre l’ennemi au pouvoir de quelqu’un. « Livrera » communique ce sens en français ; la note conserve la métaphore littérale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu qui emploie le tétragramme.
- source_word: וַתָּקָם
  choice: se leva
  rationale: Rendu direct qui préserve la succession narrative et le registre digne du récit.
- source_word: קֶדְשָׁה
  choice: à Qédesh
  rationale: Le nom de lieu est translittéré selon l’usage français, et le suffixe directionnel est rendu par « à ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom personnel divin ; sa translittération évite de le remplacer silencieusement par un titre.
- issue: Identité de la femme annoncée
  choice: une femme
  alternative: Débora ou Yaël explicitement nommée
  rationale: Le verset ne précise pas ici l’identité de la femme. La traduction maintient cette indétermination, que la suite du récit éclaire, sans l’interpréter prématurément.
translation_notes:
  register: Français international actuel, clair et digne. Le discours direct reste ferme sans archaïsme ; l’image de la « voie » et celle des « mains » sont conservées, tandis que l’idiome militaire est rendu intelligiblement.
