source:
  edition: WLC
  text: וַ/יָּ֣הָם יְ֠הוָה אֶת סִֽיסְרָ֨א וְ/אֶת כָּל הָ/רֶ֧כֶב וְ/אֶת כָּל הַֽ/מַּחֲנֶ֛ה לְ/פִי חֶ֖רֶב לִ/פְנֵ֣י בָרָ֑ק וַ/יֵּ֧רֶד סִֽיסְרָ֛א מֵ/עַ֥ל הַ/מֶּרְכָּבָ֖ה וַ/יָּ֥נָס בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/015.yaml
  text: And Yahweh threw Sisera[a], all his chariots, and all his army into confusion before Barak by the sword[c][b]. Then Sisera got down from his chariot and fled on foot.
translation:
  language: fr
  text: Yahweh plongea dans la confusion Sisera[a], tous ses chars et toute son armée devant Barak, au fil de l’épée[b]. Alors Sisera descendit de son char et s’enfuit à pied.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mit en déroute » ; le verbe hébreu peut évoquer la panique ou la confusion provoquée au combat.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « par la bouche de l’épée » ; expression désignant le fil ou le tranchant de l’épée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּהָם
  choice: jeta dans la confusion
  rationale: Le verbe המם exprime ici l’action de semer la panique et le désordre dans une force ennemie. Cette formulation conserve la valeur causative sans anticiper toute l’issue du combat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin יהוה, afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶת סִיסְרָא וְאֶת כָּל הָרֶכֶב וְאֶת כָּל הַמַּחֲנֶה
  choice: Sisera, tous ses chars et toute son armée
  rationale: La série des compléments désigne Sisera, l’ensemble de ses chars ou de ses troupes montées, puis toute sa force combattante. Les possessifs sont naturels en français et explicites dans le contexte.
- source_word: הָרֶכֶב
  choice: tous ses chars
  rationale: רֶכֶב peut désigner collectivement les chars ou les troupes de chars. « Tous ses chars » est clair et naturel dans ce récit.
- source_word: הַמַּחֲנֶה
  choice: toute son armée
  rationale: מַחֲנֶה signifie littéralement le camp, mais peut désigner l’armée qui y est rassemblée. Dans ce contexte de bataille, « armée » communique clairement le référent.
- source_word: לְפִי חֶרֶב
  choice: par le tranchant de l’épée
  rationale: L’expression signifie littéralement « par la bouche de l’épée ». « Par le tranchant de l’épée » conserve l’image hébraïque sous une forme française intelligible.
- source_word: לִפְנֵי בָרָק
  choice: devant Barak
  rationale: לִפְנֵי indique que la confusion et la défaite se produisent devant Barak, c’est-à-dire face à son avancée.
- source_word: וַיֵּרֶד מֵעַל הַמֶּרְכָּבָה
  choice: descendit de son char
  rationale: Le verbe décrit Sisera quittant son véhicule. Le possessif est idiomatique en français, bien que l’hébreu dise littéralement « le char ».
- source_word: וַיָּנָס בְּרַגְלָיו
  choice: s’enfuit à pied
  rationale: L’expression idiomatique souligne que Sisera fuit sans son char; « à pied » rend naturellement ce contraste.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom divin propre. « Yahweh » le représente directement, sans remplacer le nom par un titre.
- issue: Agent de la déroute et moyen militaire
  choice: Yahweh jette les forces dans la confusion devant Barak, par le tranchant de l’épée
  alternative: Barak met lui-même l’armée en déroute
  rationale: La syntaxe présente Yahweh comme l’agent du verbe וַיָּהָם, tout en associant la défaite au combat mené devant Barak et à l’épée. La traduction maintient cette articulation sans en préciser davantage le mécanisme.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle. « Jeta dans la confusion » préserve la nuance causative; « par le tranchant de l’épée » maintient l’image de l’idiome hébreu. Tous les marqueurs de notes figurent dans le texte.
