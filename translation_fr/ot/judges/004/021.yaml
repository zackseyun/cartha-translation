  text: וַ/תִּקַּ֣ח יָעֵ֣ל אֵֽשֶׁת חֶ֠בֶר אֶת יְתַ֨ד הָ/אֹ֜הֶל וַ/תָּ֧שֶׂם אֶת הַ/מַּקֶּ֣בֶת בְּ/יָדָ֗/הּ וַ/תָּב֤וֹא אֵלָי/ו֙ בַּ/לָּ֔אט וַ/תִּתְקַ֤ע אֶת הַ/יָּתֵד֙ בְּ/רַקָּת֔/וֹ וַ/תִּצְנַ֖ח בָּ/אָ֑רֶץ וְ/הֽוּא נִרְדָּ֥ם וַ/יָּ֖עַף וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/021.yaml
  text: Then Jael[a], the wife of Heber, took a tent peg and put a hammer in her hand, and she went to him quietly and drove the peg into his temple, and it went down into the ground. Now he was fast asleep and exhausted[b], and he died.
translation:
  language: fr
  text: Alors Yaël, femme d’Héber, prit un piquet de tente et un marteau en main. Elle s’approcha de lui sans bruit[a], enfonça le piquet dans sa tempe, et le piquet s’enfonça dans le sol[b]. Il dormait profondément, épuisé, et il mourut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furtivement ». L’hébreu souligne qu’elle s’approche silencieusement, sans attirer l’attention.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « et elle s’enfonça dans le sol ». Le verbe est au féminin et son sujet sous-entendu renvoie très probablement au piquet.
    reason: referent_clarification
lexical_decisions:
- source_word: יְתַד / הַיָּתֵד
  choice: piquet de tente / le piquet
  rationale: Le terme désigne ici un piquet servant à fixer une tente. « Piquet de tente » est précis, concret et naturel en français moderne.
- source_word: הַמַּקֶּבֶת
  choice: marteau
  rationale: Le mot désigne l’outil avec lequel Yaël frappe le piquet. « Marteau » est le terme français courant et suffisamment précis.
- source_word: בְּיָדָהּ
  choice: saisit un marteau
  rationale: Cette formulation naturelle exprime le fait qu’elle prend le marteau en main, sans reproduire littéralement la tournure hébraïque peu idiomatique en français.
- source_word: בַּלָּאט
  choice: sans bruit
  rationale: La locution décrit une approche silencieuse et discrète sans préciser davantage son intention.
- source_word: וַתִּתְקַע
  choice: enfonça
  rationale: Avec un piquet et un marteau, le verbe décrit l’action de faire pénétrer le piquet avec force. « Enfonça » est idiomatique et fidèle au contexte.
- source_word: בְּרַקָּתוֹ
  choice: dans sa tempe
  rationale: רַקָּה désigne la tempe ou le côté de la tête. « Dans sa tempe » conserve l’image anatomique sans imposer que le piquet l’ait entièrement traversée.
- source_word: וַתִּצְנַח בָּאָרֶץ
  choice: et le piquet s’enfonça dans le sol
  rationale: Le verbe au féminin renvoie très probablement au piquet, nom féminin en hébreu. La répétition explicite évite une ambiguïté de référent en français et respecte la succession des actions.
- source_word: נִרְדָּם
  choice: dormait profondément
  rationale: Le participe décrit un état de sommeil profond. Cette formulation est naturelle et rend l’intensité narrative.
- source_word: וַיָּעַף
  choice: épuisé
  rationale: Le terme décrit l’état de grande fatigue de Sisera. « Épuisé » est clair et actuel.
- source_word: וַיָּמֹת
  choice: et il mourut
  rationale: La coordination simple conserve la conclusion brève et brutale du récit.
- source_word: אֵשֶׁת חֶבֶר
  choice: femme de Héber
  rationale: Cette apposition reste proche de l’hébreu tout en étant naturelle dans un récit biblique français.
