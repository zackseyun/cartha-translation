  text: וַ/יַּגִּ֖דוּ לְ/סִֽיסְרָ֑א כִּ֥י עָלָ֛ה בָּרָ֥ק בֶּן אֲבִינֹ֖עַם הַר תָּבֽוֹר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/012.yaml
  text: And they told Sisera that Barak son of Abinoam had gone up to Mount Tabor.
translation:
  language: fr
  text: On informa Sisera que Barak, fils d’Abinoam, était monté au mont Tabor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: On informa
  rationale: Le hifil de נגד signifie ici « informer, rapporter ». Le sujet pluriel n’étant pas précisé, le pronom indéfini « on » rend naturellement cette indétermination en français.
- source_word: לְסִיסְרָא
  choice: Sisera
  rationale: La préposition לְ introduit le destinataire de l’information ; en français, le verbe « informer » prend directement la personne comme complément.
- source_word: כִּי
  choice: que
  rationale: Après un verbe d’information, כִּי introduit ici le contenu rapporté, et non une cause.
- source_word: עָלָה
  choice: était monté
  rationale: עלה exprime le mouvement vers le haut. Le plus-que-parfait situe naturellement la montée de Barak avant le moment où Sisera en est informé, sans attribuer à la forme hébraïque une valeur aspectuelle plus précise qu’elle n’en porte.
- source_word: בָּרָק
  choice: Barak
  rationale: Transcription française usuelle du nom propre.
- source_word: בֶּן אֲבִינֹעַם
  choice: fils d’Abinoam
  rationale: La construction patronymique hébraïque est rendue directement et naturellement en français.
- source_word: הַר תָּבוֹר
  choice: au mont Tabor
  rationale: הַר désigne ici la montagne nommée Tabor ; « mont Tabor » est la désignation géographique française conventionnelle. La préposition « au » exprime naturellement la destination de la montée.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La tournure impersonnelle « on informa » conserve le caractère non identifié des personnes qui transmettent la nouvelle, tout en évitant une formulation passive plus lourde.
