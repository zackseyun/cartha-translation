  text: וַ/תִּשְׁלַ֗ח וַ/תִּקְרָא֙ לְ/בָרָ֣ק בֶּן אֲבִינֹ֔עַם מִ/קֶּ֖דֶשׁ נַפְתָּלִ֑י וַ/תֹּ֨אמֶר אֵלָ֜י/ו הֲ/לֹ֥א צִוָּ֣ה יְהוָ֣ה אֱלֹהֵֽי יִשְׂרָאֵ֗ל לֵ֤ךְ וּ/מָֽשַׁכְתָּ֙ בְּ/הַ֣ר תָּב֔וֹר וְ/לָקַחְתָּ֣ עִמְּ/ךָ֗ עֲשֶׂ֤רֶת אֲלָפִים֙ אִ֔ישׁ מִ/בְּנֵ֥י נַפְתָּלִ֖י וּ/מִ/בְּנֵ֥י זְבֻלֽוּן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/006.yaml
  text: 'She sent and summoned Barak son of Abinoam from Kedesh-naphtali, and said to him, “Has not the LORD, the God of Israel, commanded: ‘Go, draw up to Mount Tabor, and take with you ten thousand men from the sons of Naphtali and from the sons of Zebulun’?”'
translation:
  language: fr
  text: 'Elle envoya chercher Barak, fils d’Abinoam, à Qédesh de Nephtali, et lui dit : « Le SEIGNEUR, le Dieu d’Israël, ne t’a-t-il pas donné cet ordre : “Va, dirige-toi vers le mont Tabor et prends avec toi dix mille hommes parmi les descendants de Nephtali et de Zabulon” ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: Elle envoya chercher
  rationale: Les deux verbes décrivent l’envoi d’un messager et la convocation de Barak. Cette tournure française naturelle conserve l’idée de faire venir quelqu’un sans produire le lourd « elle envoya et appela ».
- source_word: מִקֶּדֶשׁ נַפְתָּלִי
  choice: à Qédesh de Nephtali
  rationale: La préposition מִן indique ici le lieu d’où Barak est appelé. « Qédesh de Nephtali » distingue cette ville des autres localités du même nom.
- source_word: הֲלֹא צִוָּה
  choice: ne t’a-t-il pas donné cet ordre
  rationale: La particule interrogative négative appelle une réponse affirmative. Le complément « t’ » est implicite dans le contexte et naturel en français avant la citation de l’ordre.
- source_word: וּמָשַׁכְתָּ בְּהַר תָּבוֹר
  choice: dirige-toi vers le mont Tabor
  rationale: משך peut évoquer le fait de tirer, d’entraîner ou de se mettre en mouvement. Dans ce contexte militaire sans complément exprimé, cette formulation garde l’idée du déplacement vers le Tabor sans ajouter explicitement une troupe absente de la proposition hébraïque.
- source_word: מִבְּנֵי נַפְתָּלִי וּמִבְּנֵי זְבֻלוּן
  choice: parmi les descendants de Nephtali et de Zabulon
  rationale: בני désigne ici les membres des deux tribus. « Descendants » reste proche de l’expression généalogique hébraïque tout en étant clair en français.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé / l’Éternel
  rationale: « Le SEIGNEUR » en petites capitales conventionnelles est une représentation française largement intelligible du tétragramme, sans imposer une vocalisation reconstruite ni remplacer le nom par une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La question rhétorique et la citation imbriquée sont conservées. Aucun marqueur de note n’est requis puisqu’aucune note de bas de page n’est proposée.
