source:
  edition: WLC
  text: וּ/דְבוֹרָה֙ אִשָּׁ֣ה נְבִיאָ֔ה אֵ֖שֶׁת לַפִּיד֑וֹת הִ֛יא שֹׁפְטָ֥ה אֶת יִשְׂרָאֵ֖ל בָּ/עֵ֥ת הַ/הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/004.yaml
  text: Deborah, a woman, a prophetess, the wife of Lappidoth, was judging Israel at that time.
translation:
  language: fr
  text: Débora, une femme, une prophétesse, épouse de Lappidoth, jugeait Israël en ce temps-là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה נְבִיאָה
  choice: une femme, une prophétesse
  rationale: Conserve les deux éléments explicites du texte hébreu et leur apposition, sans absorber אִשָּׁה dans le seul titre « prophétesse ».
- source_word: אֵשֶׁת לַפִּידוֹת
  choice: épouse de Lappidoth
  rationale: Rend naturellement le sens relationnel de אֵשֶׁת et distingue cette expression du précédent « une femme ».
- source_word: שֹׁפְטָה אֶת־יִשְׂרָאֵל
  choice: exerçait la fonction de juge en Israël
  rationale: Exprime l’activité continue et la fonction de gouvernance judiciaire portée par le participe, tout en évitant que « jugeait Israël » soit compris comme une simple appréciation morale de la nation.
- source_word: בָּעֵת הַהִיא
  choice: alors
  rationale: Restitue idiomatiquement l’indication temporelle « en ce temps-là » dans une phrase française fluide.
theological_decisions:
- issue: Mention explicite du sexe de Débora en plus de son titre prophétique
  choice: Conserver « une femme, une prophétesse »
  alternative: « Débora, la prophétesse »
  rationale: L’hébreu comporte explicitement אִשָּׁה avant נְבִיאָה; l’omettre réduirait une donnée du texte et pourrait atténuer son insistance.
- issue: Portée de la fonction de juge
  choice: « en Israël »
  alternative: « jugeait Israël »
  rationale: La formulation choisie indique sa fonction publique sans trancher plus précisément entre activité judiciaire, gouvernement et direction, nuances que שפט peut réunir dans le livre des Juges.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition appositionnelle « une femme, une prophétesse » est volontairement maintenue malgré son caractère légèrement marqué, car elle reflète la formulation hébraïque. Aucun marqueur de note n’est requis.
