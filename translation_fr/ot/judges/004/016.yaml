base_translation:
  language: en
  yaml_path: translation/ot/judges/004/016.yaml
  text: And Barak pursued the chariots and the army as far as Harosheth of the nations[a], and all Sisera’s army fell by the edge of the sword[b]; not even one was left.
translation:
  language: fr
  text: Barak poursuivit les chars[a] et l’armée jusqu’à Harosheth des Nations[b]. Toute l’armée de Sisera tomba sous le tranchant de l’épée ; il n’en resta pas un seul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le corps de chars », si le mot « chars » est pris comme un terme militaire collectif.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « Harosheth des nations » ; traditionnellement « Harosheth-Haggoïm ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָדַף אַחֲרֵי
  choice: poursuivit
  rationale: Le verbe suivi de la préposition exprime une poursuite active dans un contexte militaire. « Poursuivit » est naturel et précis.
- source_word: הָרֶכֶב
  choice: les chars
  rationale: Le nom a ici un sens collectif. « Les chars » conserve l’image concrète de l’hébreu, tandis qu’une note signale le sens possible de corps de chars.
- source_word: הַמַּחֲנֶה
  choice: l’armée
  rationale: Dans ce récit de bataille, le terme désigne la force militaire plutôt que son seul campement.
- source_word: עַד חֲרֹשֶׁת הַגּוֹיִם
  choice: jusqu’à Harosheth-des-Nations
  rationale: « Jusqu’à » marque l’étendue de la poursuite. La forme française conserve à la fois le nom du lieu et le sens transparent de הַגּוֹיִם, « les nations ».
- source_word: וַיִּפֹּל כָּל מַחֲנֵה סִיסְרָא
  choice: Toute l’armée de Sisera tomba
  rationale: Le sujet collectif désigne l’ensemble des troupes. « Tomba » préserve l’idiome guerrier hébreu sans expliciter davantage la manière dont elles furent abattues.
- source_word: לְפִי חֶרֶב
  choice: sous le tranchant de l’épée
  rationale: Cette expression rend naturellement en français l’idiome hébreu littéralement lié à la « bouche » de l’épée, tout en conservant son image.
- source_word: לֹא נִשְׁאַר עַד אֶחָד
  choice: il n’en resta pas un seul
  rationale: La formulation française restitue clairement l’insistance hébraïque sur l’anéantissement total de la force.
