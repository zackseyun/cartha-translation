  text: וַ/יַּזְעֵ֨ק בָּרָ֜ק אֶת זְבוּלֻ֤ן וְ/אֶת נַפְתָּלִי֙ קֶ֔דְשָׁ/ה וַ/יַּ֣עַל בְּ/רַגְלָ֔י/ו עֲשֶׂ֥רֶת אַלְפֵ֖י אִ֑ישׁ וַ/תַּ֥עַל עִמּ֖/וֹ דְּבוֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/010.yaml
  text: Then Barak summoned Zebulun and Naphtali to Kedesh[a], and ten thousand men went up following him, and Deborah went up with him.
translation:
  language: fr
  text: Barak convoqua Zabulon et Nephtali à Qédesh. Dix mille hommes montèrent à sa suite[a], et Débora monta avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à ses pieds », expression qui signifie ici qu’ils le suivaient ou marchaient sous sa conduite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: convoqua
  rationale: Au hifil, זעק peut désigner l’action de faire venir ou de rassembler. « Convoqua » convient au contexte militaire sans suggérer nécessairement une conscription officielle.
- source_word: אֶת זְבוּלֻן וְאֶת נַפְתָּלִי
  choice: Zabulon et Nephtali
  rationale: Les noms des deux tribus restent les objets directs de l’appel de Barak, sans ajout explicatif dans le texte.
- source_word: קֶדְשָׁה
  choice: à Qédesh
  rationale: Le ה directionnel exprime un mouvement vers Qédesh ; la préposition française « à » le rend naturellement avec un nom de ville.
- source_word: וַיַּעַל
  choice: montèrent / monta
  rationale: La répétition du verbe עלה est conservée. « Monter » peut évoquer à la fois le déplacement géographique et la progression militaire, sans trancher entre ces nuances.
- source_word: בְּרַגְלָיו
  choice: à sa suite
  rationale: L’expression signifie littéralement « à ses pieds », mais désigne ici les hommes qui suivent Barak ou marchent sous sa conduite. « À sa suite » restitue naturellement ce sens tout en laissant la formulation littérale en note.
- source_word: עֲשֶׂרֶת אַלְפֵי אִישׁ
  choice: dix mille hommes
  rationale: Rendu direct de l’expression numérique hébraïque dans ce contexte de mobilisation militaire.
- source_word: וַתַּעַל עִמּוֹ דְּבוֹרָה
  choice: et Débora monta avec lui
  rationale: Cette formulation conserve le verbe répété et affirme simplement que Débora accompagne Barak.
