  source_fidelity: Le texte rend correctement l’impératif קוּם, la valeur motivante de כִּי, l’accompli prophétique de נָתַן, la question rhétorique introduite par הֲלֹא et la descente de Barak depuis le mont Tabor. « A livré Sisera entre tes mains » exprime naturellement en français l’idiome hébreu « donner dans ta main », tout en conservant son sens de remise au pouvoir de Barak. « Est sorti devant toi » maintient volontairement l’image verbale de יָצָא sans ajouter « marcher » ou une explicitation militaire absente du verbe lui-même.
