  text: וַ/תֹּאמֶר֩ דְּבֹרָ֨ה אֶל בָּרָ֜ק ק֗וּם כִּ֣י זֶ֤ה הַ/יּוֹם֙ אֲשֶׁר֩ נָתַ֨ן יְהוָ֤ה אֶת סִֽיסְרָא֙ בְּ/יָדֶ֔/ךָ הֲ/לֹ֥א יְהוָ֖ה יָצָ֣א לְ/פָנֶ֑י/ךָ וַ/יֵּ֤רֶד בָּרָק֙ מֵ/הַ֣ר תָּב֔וֹר וַ/עֲשֶׂ֧רֶת אֲלָפִ֛ים אִ֖ישׁ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/014.yaml
  text: Then Deborah said to Barak[a], “Arise, for this is the day on which Yahweh has given Sisera into your hand. Has not Yahweh gone out before you?” So Barak went down from Mount Tabor[b], with ten thousand men following him.
translation:
  language: fr
  text: 'Alors Débora dit à Barak : « Lève-toi, car voici le jour où Yahweh a livré Sisera entre tes mains[a]. Yahweh n’est-il pas sorti devant toi[b] ? » Barak descendit donc du mont Tabor, suivi de dix mille hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « a donné Sisera dans ta main ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Yahweh n’est-il pas allé devant toi ? »
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: Lève-toi
  rationale: L’impératif appelle Barak à agir immédiatement. « Lève-toi » est direct, naturel et soutenu sans être archaïque.
- source_word: כִּי זֶה הַיּוֹם אֲשֶׁר
  choice: car voici le jour où
  rationale: Cette formulation conserve la force démonstrative de « ce jour » tout en donnant une tournure française naturelle à l’exhortation.
- source_word: נָתַן ... בְּיָדֶךָ
  choice: a livré ... entre tes mains
  rationale: L’expression signifie que Sisera est placé au pouvoir de Barak. Le passé composé rend l’accompli hébreu et la certitude de la victoire annoncée; « entre tes mains » conserve l’image idiomatique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre.
- source_word: הֲלֹא
  choice: n’est-il pas
  rationale: Cette tournure garde la question rhétorique qui appelle une réponse affirmative, sans la transformer en simple affirmation.
- source_word: יָצָא לְפָנֶיךָ
  choice: est sorti devant toi
  rationale: La traduction préserve le verbe général « sortir » et l’image de Yahweh précédant Barak, sans expliciter davantage la nuance militaire suggérée par le contexte.
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Le passé simple convient au récit suivi et exprime clairement le mouvement depuis la montagne.
- source_word: מֵהַר תָּבוֹר
  choice: du mont Tabor
  rationale: Forme géographique française usuelle du nom propre.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אִישׁ אַחֲרָיו
  choice: suivi de dix mille hommes
  rationale: La formulation rend naturellement l’accompagnement et le mouvement des combattants derrière Barak, tout en conservant la référence masculine explicite.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le Tétragramme. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Valeur de l’accompli נָתַן dans l’annonce de la victoire
  choice: a livré
  alternative: livrera
  rationale: L’accompli présente la remise de Sisera au pouvoir de Barak comme déjà certaine. Le passé composé conserve cette tension entre l’annonce divine accomplie et sa réalisation historique imminente.
translation_notes:
  register: Français international moderne, digne et narratif. Le discours de Débora reste énergique; le passé simple marque la reprise du récit. Les images hébraïques importantes sont conservées lorsqu’elles demeurent intelligibles en français.
