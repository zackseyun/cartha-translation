  text: וְ֠/הִיא יוֹשֶׁ֨בֶת תַּֽחַת תֹּ֜מֶר דְּבוֹרָ֗ה בֵּ֧ין הָ/רָמָ֛ה וּ/בֵ֥ין בֵּֽית אֵ֖ל בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יַּעֲל֥וּ אֵלֶ֛י/הָ בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/005.yaml
  text: She used to sit under the palm of Deborah[a], between Ramah and Bethel in the hill country of Ephraim[b], and the sons of Israel went up to her for judgment.
translation:
  language: fr
  text: Elle siégeait habituellement sous le palmier de Débora, entre Rama et Béthel, dans la région montagneuse d’Éphraïm. Les fils d’Israël[a] montaient vers elle pour obtenir un jugement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ». L’hébreu dit littéralement « les fils d’Israël », expression collective courante qui désigne le peuple d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour obtenir justice » ou « pour qu’une décision juridique soit rendue ». Le terme hébreu peut désigner une décision judiciaire ou l’administration de la justice.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֶׁבֶת
  choice: siégeait habituellement
  rationale: Le participe, dans ce cadre narratif, décrit l’activité coutumière de Débora à cet endroit. « Siégeait » convient à sa fonction judiciaire, et « habituellement » explicite l’aspect itératif sans suggérer une seule séance.
- source_word: תַּחַת
  choice: sous
  rationale: La préposition indique simplement la position sous le palmier ; « sous » est l’équivalent français naturel.
- source_word: תֹּמֶר דְּבוֹרָה
  choice: le palmier de Débora
  rationale: Le groupe construit désigne le palmier associé à Débora, vraisemblablement un repère connu. La minuscule évite d’en faire inutilement un nom propre officiel.
- source_word: בֵּין הָרָמָה וּבֵין בֵּית אֵל
  choice: entre Rama et Béthel
  rationale: Les deux noms de lieux sont rendus selon leurs formes françaises usuelles.
- source_word: בְּהַר אֶפְרָיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: Le singulier hébreu peut désigner l’ensemble du territoire montagneux d’Éphraïm plutôt qu’une montagne isolée.
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: montaient vers elle
  rationale: Le verbe עלה conserve l’idée de montée, appropriée au relief montagneux, tandis que l’imparfait français s’accorde avec la situation habituelle décrite.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction préserve l’expression collective masculine de l’hébreu. Une note précise qu’elle désigne ici le peuple d’Israël, et non exclusivement les hommes.
- source_word: לַמִּשְׁפָּט
  choice: pour obtenir un jugement
  rationale: Dans ce contexte, מִשְׁפָּט renvoie à une décision judiciaire ou à l’exercice de la justice. « Obtenir un jugement » exprime naturellement le but du déplacement sans déterminer plus précisément la nuance.
theological_decisions:
- issue: Expression collective genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation hébraïque est conservée, tout en indiquant en note qu’il s’agit d’une expression collective traditionnelle visant le peuple d’Israël.
- issue: Portée judiciaire de מִשְׁפָּט
  choice: pour obtenir un jugement
  alternative: pour obtenir justice
  rationale: « Jugement » maintient la dimension de décision judiciaire sans réduire le terme à l’issue favorable suggérée parfois par « obtenir justice » ; la note conserve les nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. « Siégeait habituellement » évoque à la fois l’action coutumière et la fonction judiciaire de Débora. Les marqueurs de notes ont été placés après les expressions qu’ils expliquent.
