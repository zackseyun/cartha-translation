source:
  edition: WLC
  text: וַ/יַּכְנַ֤ע אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֵ֖ת יָבִ֣ין מֶֽלֶךְ כְּנָ֑עַן לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/023.yaml
  text: So on that day God subdued Jabin king of Canaan before the sons of Israel[a].
translation:
  language: fr
  text: Ce jour-là, Dieu soumit Yabîn, roi de Canaan, devant les fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: soumit
  rationale: Le hifil de כנע indique ici que Dieu fait plier un adversaire et le réduit à la soumission. « Soumit » exprime naturellement la défaite politico-militaire sans suggérer seulement une humiliation intérieure.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom désigne clairement ici le Dieu d’Israël, sujet direct de l’action.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Cette tournure française courante conserve le repère temporel précis du récit.
- source_word: אֵת יָבִין
  choice: Yabîn
  rationale: אֵת marque le complément d’objet direct défini; le nom propre est translittéré en français d’après sa forme hébraïque.
- source_word: מֶלֶךְ כְּנָעַן
  choice: roi de Canaan
  rationale: La chaîne construite signifie directement « roi de Canaan »; l’apposition à Yabîn ne requiert pas d’article.
- source_word: לִפְנֵי
  choice: devant
  rationale: Le terme marque ici la relation dans laquelle Yabîn est soumis face au peuple d’Israël. « Devant » préserve la formulation concise et sa légère ouverture sémantique.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression hébraïque genrée et traditionnelle sans la neutraliser dans le texte principal; une note donne l’équivalent collectif naturel.
theological_decisions:
- issue: L’action divine dans la victoire d’Israël
  choice: Dieu est le sujet direct qui soumet Yabîn.
  alternative: Présenter principalement l’événement comme une victoire militaire d’Israël.
  rationale: L’hébreu nomme explicitement אֱלֹהִים comme sujet du verbe; la traduction maintient donc l’action directe de Dieu.
- issue: Expression genrée désignant le peuple de l’alliance
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: Le texte source emploie le masculin pluriel בְּנֵי יִשְׂרָאֵל. La traduction principale en conserve la forme, tandis que la note en éclaire le sens collectif.
translation_notes:
  register: Français international moderne, sobre et digne. « Ainsi » rend la continuité narrative de וַ־; « Yabîn » suit une translittération française proche de l’hébreu. La syntaxe reste concise et conserve l’ambiguïté relationnelle de לִפְנֵי.
