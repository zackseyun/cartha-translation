base_translation:
  language: en
  yaml_path: translation/ot/judges/004/008.yaml
  text: Barak said to her[a], “If you will go with me, I will go; but if you will not go with me, I will not go.”
translation:
  language: fr
  text: 'Barak lui dit : « Si tu viens avec moi, j’irai ; mais si tu ne viens pas avec moi, je n’irai pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: lui dit
  rationale: Le verbe אמר suivi de אֶל avec suffixe féminin introduit naturellement le discours direct par « lui dit » en français narratif.
- source_word: בָּרָק
  choice: Barak
  rationale: Le nom propre est translittéré sous sa forme française courante.
- source_word: אִם
  choice: si
  rationale: La conjonction introduit directement la condition.
- source_word: תֵּלְכִי עִמִּי
  choice: tu viens avec moi
  rationale: הלך signifie littéralement « aller », mais depuis le point de vue de Barak, le français idiomatique emploie « venir avec moi » pour exprimer l’accompagnement. La deuxième personne féminine singulière est rendue par « tu », Barak s’adressant à Débora.
- source_word: וְהָלָכְתִּי
  choice: j’irai
  rationale: Le parfait après la proposition conditionnelle exprime ici la conséquence ; le futur français la rend clairement.
- source_word: וְאִם לֹא תֵלְכִי עִמִּי
  choice: mais si tu ne viens pas avec moi
  rationale: Le וְ introduit une condition opposée, naturellement rendue par « mais » ; la négation et la répétition du verbe sont conservées.
- source_word: לֹא אֵלֵךְ
  choice: je n’irai pas
  rationale: L’imparfait hébreu nié exprime le refus de Barak dans cette éventualité ; le futur français est direct et naturel.
