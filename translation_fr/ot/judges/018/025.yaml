  text: וַ/יֹּאמְר֤וּ אֵלָי/ו֙ בְּנֵי דָ֔ן אַל תַּשְׁמַ֥ע קוֹלְ/ךָ֖ עִמָּ֑/נוּ פֶּֽן יִפְגְּע֣וּ בָ/כֶ֗ם אֲנָשִׁים֙ מָ֣רֵי נֶ֔פֶשׁ וְ/אָסַפְתָּ֥ה נַפְשְׁ/ךָ֖ וְ/נֶ֥פֶשׁ בֵּיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/025.yaml
  text: And the sons of Dan said to him[a], “Do not let your voice be heard among us, lest men bitter of soul fall upon you[b], and you lose your life and the lives of your household.”
translation:
  language: fr
  text: 'Les fils de Dan lui dirent : « Ne fais pas entendre ta voix parmi nous[a], de peur que des hommes aigris[b] ne s’en prennent à vous et que toi et les gens de ta maison perdiez la vie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ne laisse pas ta voix être entendue parmi nous. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des hommes amers d’âme » ; autres traductions possibles : « des hommes féroces » ou « des hommes désespérés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי דָן
  choice: les fils de Dan
  rationale: Cette formulation conserve l’expression hébraïque de filiation tribale tout en restant claire en français; « les Danites » serait également possible.
- source_word: אַל תַּשְׁמַע קוֹלְךָ עִמָּנוּ
  choice: Ne fais pas entendre ta voix parmi nous
  rationale: La traduction garde l’image hébraïque de la voix entendue et exprime la sommation de ne plus protester, sans la réduire à une paraphrase comme « ne discute pas avec nous ».
- source_word: פֶּן
  choice: de peur que
  rationale: Cette locution rend naturellement la valeur d’avertissement menaçant de la conjonction hébraïque.
- source_word: יִפְגְּעוּ בָכֶם
  choice: ne s’en prennent à vous
  rationale: Dans ce contexte hostile, le verbe désigne une attaque. Cette tournure française exprime clairement la menace tout en laissant ouverte la forme précise de la violence.
- source_word: אֲנָשִׁים מָרֵי נֶפֶשׁ
  choice: des hommes aigris
  rationale: L’expression hébraïque décrit des hommes intérieurement amers, donc dangereux ou prêts à des actes violents. « Aigris » en donne le sens idiomatique sans préciser indûment s’ils sont féroces ou désespérés.
- source_word: וְאָסַפְתָּה נַפְשְׁךָ
  choice: et que tu perdes la vie
  rationale: Dans ce contexte, l’expression avec אסף et נפש signifie perdre la vie plutôt que la « recueillir » au sens littéral.
- source_word: וְנֶפֶשׁ בֵּיתֶךָ
  choice: toi et les gens de ta maison
  rationale: Le singulier hébraïque נפש a ici une portée collective. La formulation française indique naturellement que les membres de la maisonnée risquent eux aussi de mourir.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et digne. La menace demeure directe, et le passage du « tu » au « vous » présent dans l’hébreu est conservé : l’homme est d’abord interpellé seul, puis la menace vise le groupe qui l’accompagne.'
