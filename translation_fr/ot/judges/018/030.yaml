  text: וַ/יָּקִ֧ימוּ לָ/הֶ֛ם בְּנֵי דָ֖ן אֶת הַ/פָּ֑סֶל וִ֠/יהוֹנָתָן בֶּן גֵּרְשֹׁ֨ם בֶּן מְ ה֣וּא וּ/בָנָ֗י/ו הָי֤וּ כֹהֲנִים֙ לְ/שֵׁ֣בֶט הַ/דָּנִ֔י עַד י֖וֹם גְּל֥וֹת הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/030.yaml
  text: Then the sons of Dan set up for themselves the carved image, and Jonathan the son of Gershom, son of Moses,[a] he and his sons were priests for the tribe of the Danites until the day of the exile of the land.
translation:
  language: fr
  text: Les fils de Dan dressèrent pour eux-mêmes l’image sculptée. Jonathan, fils de Guershom, fils de Moïse,[a] lui et ses fils furent prêtres pour la tribu des Danites jusqu’au jour de l’exil du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Moïse » ; la tradition massorétique comporte une lettre suspendue, qui donne la lecture traditionnelle « Manassé ».'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקִימוּ
  choice: dressèrent
  rationale: Le hifil de קום signifie ici faire tenir debout, donc ériger ou installer. « Dressèrent » est naturel et convient à l’installation d’une statue cultuelle.
- source_word: לָהֶם
  choice: pour eux-mêmes
  rationale: Le datif indique que les Danites agirent pour leur propre usage; la forme réfléchie explicite cette valeur.
- source_word: בְּנֵי דָן
  choice: les fils de Dan
  rationale: Cette traduction conserve l’expression généalogique hébraïque tout en la distinguant de la désignation tribale employée plus loin.
- source_word: הַפָּסֶל
  choice: la statue sculptée
  rationale: פֶּסֶל désigne une représentation façonnée par la taille. « Statue sculptée » en garde le sens concret sans recourir à une formulation archaïque ni ajouter explicitement le jugement contenu dans « idole ».
- source_word: בֶּן גֵּרְשֹׁם בֶּן מְהוּא
  choice: fils de Guershom, fils de Moïse
  rationale: La construction généalogique est rendue directement. Le texte consonantique correspond à « Moïse », tandis que la tradition massorétique signale « Manassé » au moyen d’une lettre suspendue; cette variante est conservée en note.
- source_word: וּבָנָיו הָיוּ כֹהֲנִים
  choice: et ses fils furent prêtres
  rationale: Jonathan demeure naturellement inclus comme sujet à la suite de son nom, et la coordination avec ses fils est claire en français.
- source_word: לְשֵׁבֶט הַדָּנִי
  choice: pour la tribu des Danites
  rationale: La formulation exprime le service sacerdotal exercé pour le groupe tribal et conserve la valeur gentilice de הַדָּנִי.
- source_word: עַד יוֹם גְּלוֹת הָאָרֶץ
  choice: jusqu’au jour où le pays fut emmené en exil
  rationale: La tournure française reste proche de l’expression hébraïque inhabituelle, où הָאָרֶץ est grammaticalement lié à l’exil, sans préciser de quel événement historique il s’agit.
theological_decisions:
- issue: Identification de l’ancêtre de Jonathan
  choice: fils de Moïse
  alternative: fils de Manassé
  rationale: Le texte consonantique et la lettre de base donnent « Moïse », tandis qu’un noun suspendu dans la tradition massorétique produit la lecture traditionnelle « Manassé ». Le texte principal suit la forme de base et la note préserve la tension textuelle et théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’expression « fils de Dan », évite le terme interprétatif « idole » et maintient sans la préciser l’ambiguïté historique de l’exil du pays.
