source:
  edition: WLC
  text: וַ/יִּסְע֤וּ מִ/שָּׁם֙ מִ/מִּשְׁפַּ֣חַת הַ/דָּנִ֔י מִ/צָּרְעָ֖ה וּ/מֵ/אֶשְׁתָּאֹ֑ל שֵֽׁשׁ מֵא֣וֹת אִ֔ישׁ חָג֖וּר כְּלֵ֥י מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/011.yaml
  text: So six hundred men from the clan of the Danites set out from there[a], from Zorah and from Eshtaol[b], armed with weapons of war.
translation:
  language: fr
  text: Alors, six cents hommes du clan des Danites[a] partirent de là, de Tsorea et d’Eshtaol, équipés d’armes de guerre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la famille des Danites » ; le terme hébreu désigne ici un groupe de parenté au sein de la tribu, d’où « clan ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceints d’armes de guerre ».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partirent
  rationale: Le verbe נסע indique ici qu’ils lèvent le camp et se mettent en route. « Partirent » est naturel en français moderne et convient au mouvement narratif.
- source_word: מִשָּׁם
  choice: de là
  rationale: Cette expression locative rend directement et sobrement l’hébreu.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: du clan des Danites
  rationale: מִשְׁפָּחָה désigne ici un groupe de parenté à l’intérieur de la tribu, plus précisément qu’une tribu entière. « Clan » exprime bien ce niveau social.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: de Tsorea et d’Eshtaol
  rationale: Les noms de lieux sont translittérés dans des formes françaises modernes proches de l’hébreu. La répétition de la préposition rend clairement leur point de départ.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: six cents hommes
  rationale: Avec le nombre, אִישׁ désigne idiomatiquement six cents hommes adultes, ce que confirme le contexte militaire.
- source_word: חָגוּר
  choice: équipés
  rationale: Le mot signifie littéralement « ceints », mais, associé au matériel de guerre, il décrit des hommes munis de leur équipement militaire. « Équipés » transmet naturellement ce sens en français.
- source_word: כְּלֵי מִלְחָמָה
  choice: d’armes de guerre
  rationale: כְּלִי peut désigner un objet, un instrument ou une pièce d’équipement ; dans ce contexte militaire, il s’agit d’armes ou de matériel de combat. « Armes de guerre » conserve la force de l’expression hébraïque.
