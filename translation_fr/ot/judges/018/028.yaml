source:
  edition: WLC
  text: וְ/אֵ֨ין מַצִּ֜יל כִּ֧י רְֽחוֹקָה הִ֣יא מִ/צִּיד֗וֹן וְ/דָבָ֤ר אֵין לָ/הֶם֙ עִם אָדָ֔ם וְ/הִ֕יא בָּ/עֵ֖מֶק אֲשֶׁ֣ר לְ/בֵית רְח֑וֹב וַ/יִּבְנ֥וּ אֶת הָ/עִ֖יר וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/028.yaml
  text: And there was no one to deliver them[a], because it was far from Sidon, and they had no dealings with anyone; and it was in the valley that belongs to Beth-rehob. Then they rebuilt the city and lived in it.
translation:
  language: fr
  text: Il n’y avait personne pour les délivrer, car la ville était loin de Sidon et ses habitants n’avaient de relations avec personne. Elle se trouvait dans la vallée qui appartenait à Beth-Rehob[a]. Ils rebâtirent la ville et s’y installèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la vallée proche de Beth-Rehob ». L’expression hébraïque est elliptique, et la préposition peut indiquer la proximité plutôt que l’appartenance.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: personne pour les délivrer
  rationale: Le participe hiphil de נצל désigne quelqu’un qui arrache ou délivre d’un danger. « Délivrer » convient au contexte militaire; le complément « les » est fourni par le contexte.
- source_word: רְחוֹקָה הִיא מִצִּידוֹן
  choice: la ville était loin de Sidon
  rationale: Le pronom féminin renvoie à la ville. La répétition explicite de « la ville » rend la référence claire et naturelle en français.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: ses habitants n’avaient de relations avec personne
  rationale: L’expression littérale, « il n’y avait pour eux aucune affaire avec un humain », décrit ici leur isolement social ou politique. « Relations » conserve une certaine largeur de sens sans préciser indûment leur nature.
- source_word: בָּעֵמֶק
  choice: dans la vallée
  rationale: עֵמֶק désigne couramment une vallée ou une basse plaine; « vallée » est ici le terme français le plus direct.
- source_word: אֲשֶׁר לְבֵית רְחוֹב
  choice: qui appartenait à Beth-Rehob
  rationale: La préposition ל peut marquer l’appartenance ou le rattachement territorial. La formulation reste naturelle, tandis que la possibilité d’une indication de proximité est signalée en note.
- source_word: וַיִּבְנוּ אֶת הָעִיר
  choice: Ils rebâtirent la ville
  rationale: Le verbe signifie formellement « bâtir », mais le verset précédent précise que la ville avait été incendiée; « rebâtir » exprime donc l’implication contextuelle.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: s’y installèrent
  rationale: ישב peut signifier habiter ou s’établir. « S’y installèrent » convient à la prise de possession durable qui conclut le récit.
- source_word: רְחוֹב
  choice: Beth-Rehob
  rationale: Nom de lieu translittéré selon l’usage biblique français, avec trait d’union dans le composé.
