  yaml_path: translation/ot/judges/018/013.yaml
  text: From there they passed through the hill country of Ephraim and came as far as Micah’s house[a][b].
translation:
  language: fr
  text: De là, ils traversèrent la région montagneuse d’Éphraïm et arrivèrent jusqu’à la maison de Mica[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chez Mica ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: ils traversèrent
  rationale: Le verbe עבר exprime ici le déplacement à travers une région; « traversèrent » est naturel et précis en français.
- source_word: מִשָּׁם
  choice: De là
  rationale: Cette expression déictique indique simplement le point de départ depuis le lieu mentionné auparavant.
- source_word: הַר אֶפְרָיִם
  choice: la région montagneuse d’Éphraïm
  rationale: L’expression désigne la zone de relief associée à Éphraïm plutôt qu’un sommet unique; cette formulation évite l’ambiguïté de « mont Éphraïm ».
- source_word: וַיָּבֹאוּ
  choice: et arrivèrent
  rationale: Dans cette séquence de voyage, בוא indique qu’ils atteignent le lieu visé; « arrivèrent » convient naturellement avec « jusqu’à ».
- source_word: עַד
  choice: jusqu’à
  rationale: La préposition marque la limite atteinte par leur déplacement.
- source_word: בֵּית מִיכָה
  choice: la maison de Mica
  rationale: Le syntagme construit signifie littéralement « maison de Mica »; cette formulation française naturelle conserve aussi la possible nuance de maisonnée ou d’établissement.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Région montagneuse » rend le nom géographique sans suggérer une montagne isolée. Le nom מִיכָה est rendu « Mica », forme française usuelle dans le livre des Juges.
