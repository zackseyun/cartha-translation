  text: וַֽ/יִּקְרְאוּ֙ אֶל בְּנֵי דָ֔ן וַ/יַּסֵּ֖בּוּ פְּנֵי/הֶ֑ם וַ/יֹּאמְר֣וּ לְ/מִיכָ֔ה מַה לְּ/ךָ֖ כִּ֥י נִזְעָֽקְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/023.yaml
  text: They called out to the sons of Dan[a], and they turned around and said to Micah, “What is the matter with you[b], that you have called out?”
translation:
  language: fr
  text: 'Ils interpellèrent les fils de Dan. Ceux-ci se retournèrent et dirent à Michée : « Qu’as-tu donc à crier ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: Ils appelèrent
  rationale: קרא désigne ici le fait d’interpeller à voix haute; « appelèrent » reste naturel sans ajouter une nuance de détresse.
- source_word: אֶל בְּנֵי דָן
  choice: les fils de Dan
  rationale: Conserve l’expression de parenté hébraïque, claire en français biblique moderne; le sens est « les Danites ».
- source_word: וַיַּסֵּבּוּ פְּנֵיהֶם
  choice: qui se retournèrent
  rationale: Rend naturellement l’expression littérale « ils tournèrent leur visage » et le lien narratif avec l’appel précédent.
- source_word: לְמִיכָה
  choice: à Michée
  rationale: Transcription française traditionnelle du nom propre מִיכָה dans ce contexte.
- source_word: מַה לְּךָ
  choice: Qu’est-ce qui t’arrive
  rationale: Expression française courante qui restitue l’idiome demandant ce qui pousse ou trouble l’interlocuteur.
- source_word: כִּי
  choice: pour que
  rationale: Dans cette question, כִּי relie l’état de Michée à sa réaction; « pour que » exprime naturellement ce rapport sans imposer une stricte valeur causale.
- source_word: נִזְעָקְתָּ
  choice: tu pousses ainsi des cris
  rationale: Le niphal de זעק évoque le fait de crier ou de donner l’alarme. Cette formulation rend l’intensité perceptible dans le contexte de la protestation de Michée.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit. « Fils de Dan » maintient la forme hébraïque, tandis que la tournure interrogative demeure idiomatique.
