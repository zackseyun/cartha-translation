  - severity: low
    issue: « Ils appelèrent les fils de Dan » peut se lire comme l’acte de les nommer plutôt que de les appeler à voix haute.
    rationale: « Interpellèrent les fils de Dan » exprime sans ambiguïté l’action narrative de crier/appeler vers eux.
