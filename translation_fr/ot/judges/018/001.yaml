  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל וּ/בַ/יָּמִ֣ים הָ/הֵ֗ם שֵׁ֣בֶט הַ/דָּנִ֞י מְבַקֶּשׁ ל֤/וֹ נַֽחֲלָה֙ לָ/שֶׁ֔בֶת כִּי֩ לֹֽא נָ֨פְלָה לּ֜/וֹ עַד הַ/יּ֥וֹם הַ/ה֛וּא בְּ/תוֹךְ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל בְּ/נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/001.yaml
  text: In those days there was no king in Israel[a]. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in[b], because up to that day no inheritance had fallen to it among the tribes of Israel.
translation:
  language: fr
  text: En ce temps-là, il n’y avait pas de roi en Israël. En ce temps-là, la tribu des Danites cherchait pour elle-même une terre où s’établir, car, jusqu’à ce jour-là, aucune terre ne lui était échue en héritage[a] parmi les tribus d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aucune part d’héritage ne lui était tombée » ; l’expression désigne l’attribution d’un territoire à une tribu, notamment par le sort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: En ce temps-là
  rationale: Expression narrative française naturelle qui conserve le cadre temporel rétrospectif de l’hébreu; sa répétition dans le verset est maintenue.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: il n’y avait pas de roi en Israël
  rationale: Rend directement la négation existentielle et l’indication politique, sans ajouter d’évaluation de la monarchie.
- source_word: שֵׁבֶט הַדָּנִי
  choice: la tribu des Danites
  rationale: Désigne naturellement en français le groupe tribal issu de Dan, tout en conservant le singulier collectif de שֵׁבֶט.
- source_word: מְבַקֶּשׁ לוֹ
  choice: cherchait pour elle-même
  rationale: L’imparfait traduit la valeur durative du participe; «pour elle-même» rend le pronom réfléchi singulier renvoyant à la tribu.
- source_word: נַחֲלָה לָשֶׁבֶת
  choice: une terre où s’établir
  rationale: Dans ce contexte tribal, נַחֲלָה désigne un territoire reçu en possession héréditaire; cette formulation reste claire et naturelle, tandis que la notion d’héritage est explicitée dans la proposition suivante.
- source_word: כִּי לֹא נָפְלָה לוֹ ... בְּנַחֲלָה
  choice: car ... aucune terre ne lui était échue en héritage
  rationale: «Échoir en héritage» exprime en français l’attribution d’un territoire tout en gardant une trace de l’image hébraïque du lot qui «tombe» à son bénéficiaire.
- source_word: עַד הַיּוֹם הַהוּא
  choice: jusqu’à ce jour-là
  rationale: Conserve le point de vue rétrospectif du narrateur et la référence à un jour déterminé.
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: parmi les tribus d’Israël
  rationale: Rendu idiomatique du rapport de Dan avec l’ensemble des tribus lors de la répartition territoriale.
theological_decisions:
- issue: Portée de la formule «il n’y avait pas de roi en Israël»
  choice: La conserver comme constat narratif et politique sans commentaire ajouté.
  alternative: La traduire ou la développer de manière à en faire soit une condamnation explicite de la période des juges, soit une approbation explicite de la monarchie.
  rationale: L’hébreu énonce le fait et laisse son appréciation émerger du contexte plus large. La traduction ne doit pas résoudre cette tension théologique et politique.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La répétition de «En ce temps-là» reproduit l’insistance narrative du texte. «Terre» est plus immédiatement compréhensible que «héritage» employé seul pour un territoire, tandis que «échue en héritage» préserve la dimension d’attribution héréditaire.
