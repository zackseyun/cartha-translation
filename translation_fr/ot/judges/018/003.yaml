source:
  edition: WLC
  text: הֵ֚מָּה עִם בֵּ֣ית מִיכָ֔ה וְ/הֵ֣מָּה הִכִּ֔ירוּ אֶת ק֥וֹל הַ/נַּ֖עַר הַ/לֵּוִ֑י וַ/יָּס֣וּרוּ שָׁ֗ם וַ/יֹּ֤אמְרוּ ל/וֹ֙ מִֽי הֱבִיאֲ/ךָ֣ הֲלֹ֔ם וּ/מָֽה אַתָּ֥ה עֹשֶׂ֛ה בָּ/זֶ֖ה וּ/מַה לְּ/ךָ֥ פֹֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/003.yaml
  text: While they were near Micah’s house[a], they recognized the voice of the young Levite. So they turned aside there and said to him[b], “Who brought you here? What are you doing in this place? And what do you have here?”
translation:
  language: fr
  text: 'Alors qu’ils étaient près de la maison de Michée, ils reconnurent la voix du jeune Lévite. Ils firent donc un détour jusque-là et lui demandèrent : « Qui t’a amené ici ? Que fais-tu dans cet endroit[a] ? Et qu’as-tu ici[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Que fais-tu dans ceci ? » On peut aussi comprendre : « Que fais-tu ici ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Et qu’as-tu à faire ici ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה עִם בֵּית מִיכָה
  choice: Alors qu’ils étaient près de la maison de Michée
  rationale: עִם exprime ici la proximité avec la maison plutôt qu’un accompagnement. La tournure circonstancielle française restitue naturellement la situation narrative.
- source_word: הִכִּירוּ אֶת קוֹל הַנַּעַר הַלֵּוִי
  choice: ils reconnurent la voix du jeune Lévite
  rationale: Le hiphil de נכר signifie ici « reconnaître », et קוֹל désigne la voix. נַעַר qualifie le Lévite comme un jeune homme.
- source_word: וַיָּסוּרוּ שָׁם
  choice: Ils firent donc un détour jusque-là
  rationale: סור décrit le fait de quitter son trajet pour se diriger vers un lieu. « Faire un détour » rend ce mouvement en français courant sans préciser au-delà du texte où ils entrèrent.
- source_word: מִי הֱבִיאֲךָ הֲלֹם
  choice: Qui t’a amené ici ?
  rationale: Le hiphil de בוא est causatif (« amener »), et הֲלֹם signifie « ici, jusqu’ici ».
- source_word: וּמָה אַתָּה עֹשֶׂה בָּזֶה
  choice: Que fais-tu dans cet endroit ?
  rationale: בָּזֶה signifie littéralement « dans ceci » et reste elliptique. Le contexte favorise un sens locatif, rendu clairement sans effacer la formulation inhabituelle, signalée en note.
- source_word: וּמַה לְּךָ פֹה
  choice: Et qu’as-tu ici ?
  rationale: L’expression peut interroger ce que la personne possède, ce qui l’attache au lieu ou l’affaire qui l’y occupe. La formulation retenue conserve son caractère concret et son ambiguïté.
