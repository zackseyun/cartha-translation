base_translation:
  language: en
  yaml_path: translation/ot/judges/018/017.yaml
  text: Then the five men who had gone to spy out the land went up[a], came there, and took the carved image, the ephod, the household gods, and the cast image[b], while the priest was standing at the entrance of the gate with the six hundred men armed with weapons of war.
translation:
  language: fr
  text: Alors les cinq hommes qui étaient allés espionner le pays montèrent, arrivèrent là et prirent l’image sculptée, l’éphod, les dieux domestiques[a] et l’image en métal coulé[b]. Pendant ce temps, le prêtre se tenait à l’entrée de la porte avec les six cents hommes armés pour le combat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les téraphim ». Le terme hébreu désigne des objets cultuels ou des divinités domestiques.
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « l’image de métal fondu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: Le verbe עלה signifie normalement « monter ». Le conserver respecte le mouvement exprimé en hébreu sans alourdir le récit.
- source_word: הַהֹלְכִים לְרַגֵּל אֶת־הָאָרֶץ
  choice: qui étaient allés espionner le pays
  rationale: Le participe désigne les cinq hommes par leur mission antérieure. « Espionner » convient au contexte de reconnaissance stratégique, et le plus-que-parfait marque clairement l’antériorité.
- source_word: בָּאוּ שָׁמָּה
  choice: arrivèrent là
  rationale: Cette formulation rend simplement la venue à cet endroit sans préciser abusivement qu’ils entrèrent dans un bâtiment.
- source_word: לָקְחוּ
  choice: prirent
  rationale: לקח est le verbe courant pour « prendre » ; le contexte suffit à faire comprendre qu’il s’agit d’une appropriation illégitime.
- source_word: הַפֶּסֶל
  choice: la statue sculptée
  rationale: פסל désigne une représentation façonnée par sculpture. « Statue sculptée » reste concret et évite d’introduire directement le jugement contenu dans « idole ».
- source_word: הָאֵפוֹד
  choice: l’éphod
  rationale: Ce terme culturel et cultuel n’a pas d’équivalent français simple ; sa translittération est consacrée et n’ajoute aucune précision absente de l’hébreu.
- source_word: הַתְּרָפִים
  choice: les dieux domestiques
  rationale: Le terme désigne des objets cultuels ou divinités liés au foyer. La formulation est intelligible en français moderne, tandis que « téraphim » est conservé en note.
- source_word: הַמַּסֵּכָה
  choice: la statue en métal coulé
  rationale: מסכה désigne ici une représentation fabriquée par coulée, généralement en métal. Cette expression est plus naturelle aujourd’hui que la tournure traditionnelle « statue en métal fondu ».
- source_word: וְהַכֹּהֵן נִצָּב
  choice: Pendant ce temps, le prêtre se tenait
  rationale: La proposition décrit une circonstance simultanée à la prise des objets. « Pendant ce temps » rend clairement cette relation narrative.
- source_word: פֶּתַח הַשַּׁעַר
  choice: à l’entrée du portail
  rationale: La formulation conserve l’idée d’une ouverture ou entrée associée à une porte, tout en restant idiomatique en français.
- source_word: וְשֵׁשׁ מֵאוֹת הָאִישׁ
  choice: avec les six cents hommes
  rationale: Le groupe est compris comme accompagnant le prêtre à cet endroit. « Avec » explicite naturellement en français cette relation circonstancielle probable.
- source_word: הֶחָגוּר כְּלֵי הַמִּלְחָמָה
  choice: armés pour le combat
  rationale: L’expression hébraïque évoque des hommes ceints ou équipés d’armes. La traduction française rend le sens militaire sans l’archaïsme de « ceints d’armes de guerre ».
