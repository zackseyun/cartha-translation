  to: Alors les cinq hommes qui étaient allés espionner le pays montèrent, arrivèrent là et prirent l’image sculptée, l’éphod, les dieux domestiques[a] et l’image en métal coulé[b]. Pendant ce temps, le prêtre se tenait à l’entrée de la porte avec les six cents hommes armés pour le combat.
