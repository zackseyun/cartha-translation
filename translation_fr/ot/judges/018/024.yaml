source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר אֶת אֱלֹהַ/י֩ אֲשֶׁר עָשִׂ֨יתִי לְקַחְתֶּ֧ם וְֽ/אֶת הַ/כֹּהֵ֛ן וַ/תֵּלְכ֖וּ וּ/מַה לִּ֣/י ע֑וֹד וּ/מַה זֶּ֛ה תֹּאמְר֥וּ אֵלַ֖/י מַה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/024.yaml
  text: He said[a], “You have taken my gods that I made, and the priest, and you have gone away. What do I have left now? So how can you say to me, ‘What is the matter with you?’”
translation:
  language: fr
  text: 'Il dit[a] : « Vous avez pris les dieux que j’ai fabriqués, ainsi que le prêtre, et vous êtes partis. Que me reste-t-il maintenant ? Alors, comment pouvez-vous me dire : “Qu’as-tu donc ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon dieu » ou « mes représentations divines ». Le terme hébreu peut être singulier ou pluriel selon le contexte, mais ici l’ensemble du récit favorise « mes dieux ».
    reason: Signaler l’ambiguïté grammaticale et lexicale de אֱלֹהַי tout en expliquant le choix contextuel du pluriel.
lexical_decisions:
- source_word: אֱלֹהַי
  choice: mes dieux
  rationale: Le contexte des objets cultuels de Mika favorise le pluriel. Cette traduction conserve le terme hébreu « dieux » et l’ironie de divinités fabriquées par un homme, sans l’aplanir en « idoles ».
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: que j’ai fabriqués
  rationale: Le verbe עשה signifie « faire ». « Fabriqués » est naturel pour des objets cultuels matériels et met en évidence, sans ajout doctrinal, le contraste voulu entre des dieux et leur fabricant humain.
- source_word: לְקַחְתֶּם
  choice: vous avez pris
  rationale: 'Le passé composé exprime l’acte accompli dont la conséquence demeure : Mika en est maintenant privé.'
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: L’article défini est conservé ; il s’agit du prêtre connu dans le récit.
- source_word: וַתֵּלְכוּ
  choice: vous êtes partis
  rationale: La deuxième personne du pluriel est explicitement conservée et le passé composé rend naturellement le départ accompli.
- source_word: וּמַה לִּי עוֹד
  choice: Que me reste-t-il maintenant ?
  rationale: Cette formulation française exprime naturellement la privation et la plainte contenues dans l’idiome hébreu.
- source_word: וּמַה זֶּה תֹּאמְרוּ אֵלַי
  choice: Alors, comment pouvez-vous me dire
  rationale: La tournure restitue l’indignation de Mika et le lien logique avec sa perte, tout en gardant la force interrogative de l’expression hébraïque.
- source_word: מַה לָּךְ
  choice: Qu’est-ce qui t’arrive ?
  rationale: Expression française actuelle et directe correspondant à l’idiome hébreu. Le singulier « t’ » respecte la forme singulière לָךְ, les Danites s’adressant à Mika.
theological_decisions:
- issue: Sens de אֱלֹהַי dans le contexte des objets cultuels domestiques
  choice: mes dieux
  alternative: mon dieu / mes représentations divines / mes idoles
  rationale: Le contexte favorise plusieurs objets cultuels, mais le mot hébreu peut, selon le contexte, être singulier ou pluriel. « Mes dieux » préserve ici le sens lexical et la tension narrative de dieux fabriqués, tandis qu’une note signale l’ambiguïté réelle sans imposer une lecture confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct conserve le ton indigné de Mika. Le tutoiement dans la citation finale reproduit le singulier hébreu, tandis que « vous » rend les formes plururielles adressées au groupe des Danites.
