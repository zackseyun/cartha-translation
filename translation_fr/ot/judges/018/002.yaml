  text: וַ/יִּשְׁלְח֣וּ בְנֵי דָ֣ן מִֽ/מִּשְׁפַּחְתָּ֡/ם חֲמִשָּׁ֣ה אֲנָשִׁ֣ים מִ/קְצוֹתָ/ם֩ אֲנָשִׁ֨ים בְּנֵי חַ֜יִל מִ/צָּרְעָ֣ה וּ/מֵֽ/אֶשְׁתָּאֹ֗ל לְ/רַגֵּ֤ל אֶת הָ/אָ֨רֶץ֙ וּ/לְ/חָקְרָ֔/הּ וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם לְכ֖וּ חִקְר֣וּ אֶת הָ/אָ֑רֶץ וַ/יָּבֹ֤אוּ הַר אֶפְרַ֨יִם֙ עַד בֵּ֣ית מִיכָ֔ה וַ/יָּלִ֖ינוּ שָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/002.yaml
  text: So the sons of Dan sent five men from their clan[a], from among their whole number, valiant men from Zorah and from Eshtaol, to spy out the land and to explore it. And they said to them, “Go, explore the land.” So they came to the hill country of Ephraim, as far as the house of Micah[c][b], and spent the night there.
translation:
  language: fr
  text: 'Les fils de Dan envoyèrent cinq hommes de leur clan, pris parmi eux : des hommes capables[a], originaires de Tsorea et d’Eshtaol, pour reconnaître le pays et l’examiner[b]. Ils leur dirent : « Allez examiner le pays. » Les cinq hommes arrivèrent dans la région montagneuse d’Éphraïm, jusqu’à la maison de Mika[c], et ils y passèrent la nuit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hommes vaillants » ou « des hommes de valeur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’explorer » ou « de mener une enquête sur lui ».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit littéralement « la maison de Mika » ; l’expression peut désigner son habitation ou l’ensemble de son domaine familial.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי דָן
  choice: les fils de Dan
  rationale: Conserve l’expression tribale et familiale de l’hébreu tout en restant claire en français.
- source_word: מִמִּשְׁפַּחְתָּם
  choice: de leur clan
  rationale: מִשְׁפָּחָה désigne ici un groupe de parenté à l’intérieur de la tribu ; « clan » convient mieux que « famille » ou « tribu ».
- source_word: מִקְצוֹתָם
  choice: pris parmi eux
  rationale: Rend naturellement le sens partitif de l’expression sans introduire l’idée non nécessaire de totalité ni traduire littéralement « depuis leurs extrémités ».
- source_word: אֲנָשִׁים בְּנֵי חַיִל
  choice: des hommes capables
  rationale: Dans cette mission de reconnaissance, l’expression souligne leur aptitude, leur force et leur valeur ; « capables » garde une portée assez large sans imposer un sens exclusivement militaire.
- source_word: לְרַגֵּל
  choice: reconnaître
  rationale: Exprime une reconnaissance organisée du territoire ; le français « espionner le pays » serait moins naturel dans ce contexte.
- source_word: וּלְחָקְרָהּ / חִקְרוּ
  choice: l’examiner / examinez le pays
  rationale: Le verbe חקר évoque un examen attentif ou une enquête. La répétition française maintient celle de la racine hébraïque.
- source_word: הַר אֶפְרַיִם
  choice: la région montagneuse d’Éphraïm
  rationale: L’expression désigne les hautes terres d’Éphraïm, non une montagne isolée.
- source_word: עַד בֵּית מִיכָה
  choice: jusqu’à la maison de Mika
  rationale: « Jusqu’à » conserve la valeur d’étendue de עַד ; « maison » maintient l’ambiguïté entre l’habitation et l’ensemble domestique.
- source_word: וַיָּלִינוּ שָׁם
  choice: ils y passèrent la nuit
  rationale: Rend clairement et naturellement le sens de séjourner quelque part pour la nuit.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. Les noms sont translittérés directement de l’hébreu : Tsorea, Eshtaol, Éphraïm et Mika. La syntaxe a été légèrement répartie en phrases courtes pour la lisibilité, sans effacer les répétitions significatives du texte source.'
