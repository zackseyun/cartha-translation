revisions:
- from: 'Les fils de Dan envoyèrent cinq hommes de leur clan, pris parmi eux : des hommes capables[a], originaires de Tsorea et d’Eshtaol. Ils les chargèrent de reconnaître le pays et de l’examiner[b]. Ils leur dirent : « Allez examiner le pays. » Les cinq hommes arrivèrent dans la région montagneuse d’Éphraïm, jusqu’à la maison de Mika[c], et ils y passèrent la nuit.'
  to: 'Les fils de Dan envoyèrent cinq hommes de leur clan, pris parmi eux : des hommes capables[a], originaires de Tsorea et d’Eshtaol, pour reconnaître le pays et l’examiner[b]. Ils leur dirent : « Allez examiner le pays. » Les cinq hommes arrivèrent dans la région montagneuse d’Éphraïm, jusqu’à la maison de Mika[c], et ils y passèrent la nuit.'
  rationale: La révision retire uniquement l’explicitation non nécessaire « Ils les chargèrent » et rattache directement le double infinitif de but au verbe « envoyèrent », conformément à la syntaxe et au sens du texte hébreu. Le reste du texte et les notes sont conservés.
