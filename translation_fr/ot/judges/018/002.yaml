    issue: Ajout de « Ils les chargèrent »
    rationale: 'Le texte source dit qu’ils les envoyèrent « pour reconnaître le pays et l’examiner », puis rapporte leur parole : « Allez, examinez le pays. » Dire qu’ils les ont « chargés » de cette mission explicite une relation qui peut être inférée, mais qui n’est pas exprimée comme telle et produit une redondance avant l’ordre direct.'
