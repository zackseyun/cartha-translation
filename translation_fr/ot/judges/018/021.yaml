  text: So they turned and went on[a], and put the little children, the livestock[b], and the valuables before them.
translation:
  language: fr
  text: Ils firent demi-tour et repartirent, et placèrent les jeunes enfants, le bétail et leurs biens[a] devant eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs bagages », « leurs possessions » ou « leurs objets de valeur ». Le terme hébreu désigne ici les biens transportables du groupe, et non sa « gloire ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en avant d’eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: ils firent demi-tour
  rationale: Le verbe פנה exprime ici l’idée de se tourner ou de faire demi-tour; cette formulation rend clairement le mouvement dans un français naturel.
- source_word: וַיֵּלֵכוּ
  choice: repartirent
  rationale: Après « firent demi-tour », ce choix traduit la reprise du déplacement exprimée par הלך sans alourdir la narration.
- source_word: וַיָּשִׂימוּ
  choice: placèrent
  rationale: שׂים signifie mettre ou placer; « placèrent » convient au déplacement délibéré des personnes et des possessions.
- source_word: הַטַּף
  choice: les jeunes enfants
  rationale: טף désigne les petits ou les enfants non combattants. « Jeunes enfants » évite l’ambiguïté de « petits-enfants », qui peut désigner les descendants de la deuxième génération.
- source_word: הַמִּקְנֶה
  choice: le bétail
  rationale: מקנה désigne collectivement les animaux domestiques possédés par le groupe; « bétail » est le terme français courant et suffisamment large.
- source_word: הַכְּבוּדָּה
  choice: leurs biens
  rationale: Dans ce contexte de déplacement, כבודה désigne les possessions transportables ou les richesses du groupe, et non la gloire. Le possessif rend naturellement en français le rapport implicite avec le groupe.
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: Cette expression conserve le sens spatial littéral de « devant eux » ou « en avant d’eux » sans préciser davantage la raison de cette disposition.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Jeunes enfants » évite le faux sens familial possible de « petits-enfants ». La coordination proche de l’hébreu est conservée, tandis que « repartirent » assure une progression naturelle en français.
