base_translation:
  language: en
  yaml_path: translation/ot/judges/018/015.yaml
  text: They turned aside there and came to the house of the young Levite[a], to the house of Micah, and asked him about his welfare.
translation:
  language: fr
  text: Ils se détournèrent vers cet endroit et arrivèrent à la maison du jeune Lévite, la maison de Mica. Ils s’enquirent de son bien-être.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils le saluèrent » ou « ils lui demandèrent si tout allait bien ». L’expression hébraïque signifie littéralement qu’ils s’enquirent de sa paix, c’est-à-dire de son bien-être.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסוּרוּ שָׁמָּה
  choice: Ils firent un détour par là
  rationale: סוּר indique ici qu’ils quittent leur route pour se rendre à cet endroit; cette formulation française conserve le mouvement sans suggérer un simple arrêt.
- source_word: וַיָּבֹאוּ אֶל
  choice: et arrivèrent à
  rationale: בוא avec אֶל exprime l’arrivée à un lieu, sans imposer l’idée qu’ils entrèrent dans la maison.
- source_word: בֵּית הַנַּעַר הַלֵּוִי
  choice: à la maison du jeune Lévite
  rationale: La traduction rend à la fois נַעַר, « jeune homme », et l’identification הַלֵּוִי, « le Lévite », dans une expression française naturelle.
- source_word: בֵּית מִיכָה
  choice: c’est-à-dire à la maison de Mika
  rationale: La seconde désignation est apposée à la première pour préciser que la maison où demeure le jeune Lévite est celle de Mika; « c’est-à-dire » rend clairement ce rapport sans supprimer la répétition.
- source_word: וַיִּשְׁאֲלוּ לוֹ לְשָׁלוֹם
  choice: Ils lui demandèrent si tout allait bien
  rationale: L’expression idiomatique signifie s’enquérir de la paix ou du bien-être de quelqu’un. Cette formulation moderne préserve l’idée d’une demande, tout en restant naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit. La répétition des deux désignations de la maison est conservée, mais leur relation est explicitée pour éviter une lecture maladroite.
