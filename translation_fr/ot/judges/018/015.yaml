revisions:
- from: Ils firent un détour par là et arrivèrent à la maison du jeune Lévite, c’est-à-dire à la maison de Mika. Ils lui demandèrent si tout allait bien.[a]
  to: Ils se détournèrent vers cet endroit et arrivèrent à la maison du jeune Lévite, la maison de Mica. Ils s’enquirent de son bien-être.[a]
  rationale: La révision conserve le mouvement de détour et l’arrivée sans présumer qu’ils entrèrent dans la maison. Elle maintient l’apposition répétée des deux désignations de la maison sans l’interpréter par « c’est-à-dire », emploie la forme française biblique « Mica » et rend l’idiome שׁאל לו לשלום par une formulation narrative naturelle, explicitée par la note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:40:48Z'
review_pass:
  verdict: revise
  source_fidelity: La séquence narrative et les référents sont globalement bien rendus. Toutefois, « c’est-à-dire » explicite de façon interprétative une apposition que l’hébreu répète simplement (« la maison du jeune Lévite, la maison de Mica »). « Mika » ne correspond pas à la forme française biblique usuelle du nom מִיכָה, « Mica ».
  naturalness: Le français est fluide dans l’ensemble. « Ils se détournèrent vers cet endroit » rend plus directement le mouvement de סוּר + adverbe directionnel que « firent un détour par là », où « par là » peut suggérer un simple lieu de passage.
  terminology: « Lévite » est approprié. Le nom doit être normalisé en « Mica ». « S’enquirent de son bien-être » est une formulation moderne, narrative et fidèle à l’idiome hébreu בלי réduire celui-ci à une simple salutation.
  issues:
  - severity: medium
    issue: Ajout explicatif « c’est-à-dire »
    rationale: La répétition de « maison » est appositionnelle dans le texte source; « c’est-à-dire » impose une relation explicative absente de l’hébreu. Il convient de préserver la juxtaposition.
  - severity: medium
    issue: Nom propre « Mika »
    rationale: Pour le personnage biblique מִיכָה dans les Juges, la forme française établie est « Mica »; « Mika » évoque plutôt un prénom moderne distinct.
  - severity: low
    issue: « firent un détour par là »
    rationale: Cette expression est possible, mais « par là » peut décrire un itinéraire plutôt que le déplacement vers le lieu désigné par שָׁמָּה. Une formulation avec « vers cet endroit » est plus précise.
  revised_text: Ils se détournèrent vers cet endroit et arrivèrent à la maison du jeune Lévite, la maison de Mica. Ils s’enquirent de son bien-être.[a]
  revised_footnotes:
