  text: וַֽ/יַּעֲל֗וּ וַֽ/יַּחֲנ֛וּ בְּ/קִרְיַ֥ת יְעָרִ֖ים בִּֽ/יהוּדָ֑ה עַל כֵּ֡ן קָרְאוּ֩ לַ/מָּק֨וֹם הַ/ה֜וּא מַחֲנֵה דָ֗ן עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה הִנֵּ֕ה אַחֲרֵ֖י קִרְיַ֥ת יְעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/012.yaml
  text: They went up and camped at Kiriath-jearim in Judah. Therefore that place has been called Mahaneh-dan to this day; behold, it is west of Kiriath-jearim.
translation:
  language: fr
  text: Ils montèrent et établirent leur camp à Qiryath-Yéarim, en Juda. C’est pourquoi on appelle ce lieu Mahané-Dan jusqu’à ce jour ; il se trouve derrière Qiryath-Yéarim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à l’ouest de Qiryath-Yéarim ».'
    reason: La préposition spatiale אַחֲרֵי signifie littéralement « derrière » ; dans un système d’orientation tourné vers l’est, elle peut désigner l’ouest.
lexical_decisions:
- source_word: קִרְיַת יְעָרִים
  choice: Qiryath-Yéarim
  rationale: Translittération du nom propre hébreu, avec une graphie française qui en indique la prononciation sans traduire le toponyme.
- source_word: מַחֲנֵה דָן
  choice: Mahané-Dan
  rationale: Translittération du toponyme (« camp de Dan »), afin de conserver son statut de nom propre tout en laissant perceptible son lien avec le campement mentionné.
- source_word: אַחֲרֵי
  choice: derrière
  rationale: Le sens spatial premier est « derrière ». Une orientation comme « à l’ouest de » est possible selon la manière hébraïque de se repérer face à l’est, mais elle explicite une donnée que le texte ne formule pas directement.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Établirent leur camp » rend l’action de camper avec fluidité. « Jusqu’à ce jour » conserve la formule narrative traditionnelle du texte hébreu. L’interjection הִנֵּה n’est pas rendue par un littéral « voici », peu naturel ici ; sa valeur présentative est intégrée dans « il se trouve ».
