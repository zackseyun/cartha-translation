base_translation:
  language: en
  yaml_path: translation/ot/judges/018/009.yaml
  text: And they said, “Rise up, and let us go up against them, for we have seen the land, and behold, it is very good. And you are keeping silent—do not be sluggish to go, to enter, to take possession of the land.”
translation:
  language: fr
  text: 'Ils dirent : « Levez-vous ! Montons contre eux, car nous avons vu le pays : il est très bon. Et vous, vous gardez le silence ! Ne tardez pas à partir, à entrer dans le pays et à en prendre possession. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוּמָה
  choice: Debout !
  rationale: Rend naturellement l’impératif exhortatif hébreu dans le contexte d’un appel collectif à l’action.
- source_word: וְנַעֲלֶה עֲלֵיהֶם
  choice: Montons contre eux
  rationale: Conserve le mouvement exprimé par עלה ainsi que la valeur hostile de עֲלֵיהֶם.
- source_word: וְהִנֵּה טוֹבָה מְאֹד
  choice: il est vraiment très bon
  rationale: « Vraiment » restitue la force présentative de הִנֵּה sans imposer le calque peu naturel « voici ».
- source_word: מַחְשִׁים
  choice: vous restez sans rien faire
  rationale: Dans ce contexte, le silence reproché est une inaction; cette formulation française exprime clairement l’implication pragmatique du verbe.
- source_word: אַל תֵּעָצְלוּ
  choice: Ne tardez pas
  rationale: Rend l’interdiction de se montrer lent, négligent ou hésitant, dans un français courant et direct.
- source_word: לָלֶכֶת לָבֹא לָרֶשֶׁת
  choice: à partir, à entrer dans le pays et à en prendre possession
  rationale: Préserve la progression des trois infinitifs hébreux tout en évitant une suite française maladroite.
theological_decisions:
- issue: Nature de l’exhortation à conquérir le pays
  choice: Traduction directe du discours des espions, sans commentaire moral ajouté
  alternative: Atténuer ou légitimer explicitement l’appel à l’action militaire
  rationale: Le verset rapporte les paroles des personnages; la traduction ne doit ni les approuver ni les condamner au-delà du texte.
translation_notes:
  register: Français international moderne, direct et digne. Le rythme exhortatif est conservé par des phrases brèves et des impératifs. Aucun archaïsme ni terme confessionnel n’est introduit.
