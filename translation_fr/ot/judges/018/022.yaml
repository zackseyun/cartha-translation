  text: הֵ֥מָּה הִרְחִ֖יקוּ מִ/בֵּ֣ית מִיכָ֑ה וְ/הָ/אֲנָשִׁ֗ים אֲשֶׁ֤ר בַּ/בָּתִּים֙ אֲשֶׁר֙ עִם בֵּ֣ית מִיכָ֔ה נִֽזְעֲק֔וּ וַ/יַּדְבִּ֖יקוּ אֶת בְּנֵי דָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/022.yaml
  text: When they had gone some distance from Micah’s house[a], the men who were in the houses near Micah’s house were called together, and they overtook the sons of Dan.
translation:
  language: fr
  text: Quand ils se furent éloignés de la maison de Michée, les hommes qui se trouvaient dans les maisons proches de celle de Michée se rassemblèrent[a] et rattrapèrent les fils de Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « donnèrent l’alarme ». Le verbe hébreu peut évoquer soit un cri d’alarme, soit le rassemblement qui en résulte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה הִרְחִיקוּ מִבֵּית מִיכָה
  choice: Quand ils se furent éloignés de la maison de Michée
  rationale: Le pronom reprend les Danites, et le verbe exprime leur éloignement. Le passé antérieur marque naturellement l'antériorité par rapport au rassemblement et à la poursuite.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le nom hébreu désigne explicitement des hommes.
- source_word: אֲשֶׁר בַּבָּתִּים אֲשֶׁר עִם בֵּית מִיכָה
  choice: qui se trouvaient dans les maisons proches de celle de Michée
  rationale: La formulation hébraïque est littéralement difficile; עִם indique ici vraisemblablement la proximité ou l'association. Cette traduction conserve la mention des maisons voisines dans un français clair.
- source_word: נִזְעֲקוּ
  choice: se rassemblèrent
  rationale: Le niphal de זעק peut évoquer une mobilisation collective, possiblement provoquée par un cri d'alarme. Le contexte de la poursuite favorise le rassemblement sans exclure l'autre nuance, signalée en note.
- source_word: וַיַּדְבִּיקוּ
  choice: et rattrapèrent
  rationale: Le verbe indique qu'ils rejoignent ceux qui les précèdent; « rattrapèrent » est naturel et précis dans ce récit.
- source_word: אֶת בְּנֵי דָן
  choice: les fils de Dan
  rationale: La tournure de parenté de l'hébreu est conservée, plutôt que remplacée par « les Danites ».
