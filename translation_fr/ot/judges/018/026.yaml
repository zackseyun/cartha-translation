  text: וַ/יֵּלְכ֥וּ בְנֵי דָ֖ן לְ/דַרְכָּ֑/ם וַ/יַּ֣רְא מִיכָ֗ה כִּי חֲזָקִ֥ים הֵ֨מָּה֙ מִמֶּ֔/נּוּ וַ/יִּ֖פֶן וַ/יָּ֥שָׁב אֶל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/026.yaml
  text: Then the sons of Dan went on their way, and Micah saw that they were stronger than he was, so he turned and went back to his house.
translation:
  language: fr
  text: Puis les fils de Dan poursuivirent leur chemin. Michée vit qu’ils étaient plus forts que lui ; il fit donc demi-tour et rentra chez lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי דָן
  choice: les fils de Dan
  rationale: Cette expression familiale employée au sens tribal reproduit directement l’hébreu tout en restant compréhensible en français biblique moderne.
- source_word: לְדַרְכָּם
  choice: poursuivirent leur chemin
  rationale: Dans la construction avec le verbe « aller », l’expression indique qu’ils continuent leur route ; cette formulation est naturelle et respecte le mouvement du texte.
- source_word: חֲזָקִים הֵמָּה מִמֶּנּוּ
  choice: ils étaient plus forts que lui
  rationale: Le comparatif formé avec מִן est rendu sans ajouter l’interprétation légèrement plus forte « trop forts pour lui ».
- source_word: וַיִּפֶן
  choice: il fit demi-tour
  rationale: Le verbe exprime ici le fait de se retourner ; « fit demi-tour » rend clairement ce mouvement avant son retour chez lui.
- source_word: וַיָּשָׁב אֶל בֵּיתוֹ
  choice: rentra chez lui
  rationale: Cette expression française courante traduit naturellement le retour vers sa propre maison, sans lourdeur ni ambiguïté.
- source_word: בֵּיתוֹ
  choice: chez lui
  rationale: Bien que בַּיִת désigne littéralement la maison, « chez lui » est ici l’équivalent idiomatique français de la destination « sa maison », comprise comme son domicile.
