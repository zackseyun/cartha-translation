  variant: modern international French
source:
  edition: WLC
  text: כְּ/בֹאֲ/כֶ֞ם תָּבֹ֣אוּ אֶל עַ֣ם בֹּטֵ֗חַ וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם כִּֽי נְתָנָ֥/הּ אֱלֹהִ֖ים בְּ/יֶדְ/כֶ֑ם מָקוֹם֙ אֲשֶׁ֣ר אֵֽין שָׁ֣ם מַחְס֔וֹר כָּל דָּבָ֖ר אֲשֶׁ֥ר בָּ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/010.yaml
  text: When you go[a], you will come to a secure people, and the land is broad; for God has given it into your hand[b], a place where there is no lack of anything that is in the land.
translation:
  language: fr
  text: Quand vous y arriverez, vous trouverez un peuple qui vit en sécurité[a]. Le pays est vaste[b], car Dieu l’a livré entre vos mains. C’est un lieu où rien de ce qui se trouve dans le pays ne fait défaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un peuple qui se croit en sécurité » ou « un peuple sans méfiance ». L’hébreu décrit un peuple vivant avec un sentiment de sécurité.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « large de mains », expression hébraïque désignant un pays spacieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם ... תָּבֹאוּ
  choice: Quand vous y arriverez, vous trouverez
  rationale: La construction associe « à votre venue » à un verbe conjugué de même racine. Une répétition littérale serait lourde en français ; cette formulation exprime naturellement l’arrivée et la découverte annoncée.
- source_word: עַם בֹּטֵחַ
  choice: un peuple qui vit en sécurité
  rationale: בֹּטֵחַ décrit ici la sécurité ressentie par ce peuple. La formulation conserve ce sens sans imposer l’interprétation plus contextuelle de « sans méfiance ».
- source_word: וְהָאָרֶץ רַחֲבַת יָדַיִם
  choice: Le pays est vaste
  rationale: L’expression idiomatique, littéralement « large de mains », désigne un territoire spacieux ou de grande étendue.
- source_word: כִּי נְתָנָהּ אֱלֹהִים בְּיֶדְכֶם
  choice: car Dieu l’a livré entre vos mains
  rationale: Le parfait présente l’action comme acquise dans les paroles des espions. « Livré entre vos mains » rend naturellement l’idiome hébreu dans ce contexte de conquête.
- source_word: מָקוֹם אֲשֶׁר אֵין שָׁם מַחְסוֹר
  choice: C’est un lieu où rien ne manque
  rationale: Cette formulation française directe restitue l’idée d’absence de pénurie ou de défaut.
- source_word: כָּל דָּבָר אֲשֶׁר בָּאָרֶץ
  choice: de tout ce qui se trouve dans le pays
  rationale: Dans le contexte immédiat, הָאָרֶץ désigne le territoire décrit plutôt que la terre entière.
theological_decisions:
- issue: Sens de אֱלֹהִים dans les paroles des espions
  choice: Dieu
  alternative: des dieux / un dieu
  rationale: Le nom est accompagné d’un verbe au singulier et désigne ici Dieu comme celui qui livre le pays aux Danites. Le pluriel français ne correspondrait pas à la syntaxe.
- issue: Aspect de נְתָנָהּ et assurance de la conquête
  choice: l’a livré
  alternative: va le livrer
  rationale: Le parfait hébreu présente le don du pays comme déjà assuré du point de vue des locuteurs, sans qu’il soit nécessaire d’expliquer ou d’approuver théologiquement leur affirmation.
translation_notes:
  register: Français international moderne, clair et digne. Le texte évite une répétition peu naturelle du verbe « venir », tout en conservant la progression de l’arrivée vers la découverte. Les notes maintiennent l’ambiguïté de בֹּטֵחַ et expliquent l’image idiomatique de רַחֲבַת יָדַיִם.
