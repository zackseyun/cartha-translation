  text: וְ/אֵ֗לֶּה בָּ֚אוּ בֵּ֣ית מִיכָ֔ה וַ/יִּקְחוּ֙ אֶת פֶּ֣סֶל הָ/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/כֹּהֵ֔ן מָ֥ה אַתֶּ֖ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/018.yaml
  text: These men went into Micah’s house and took the carved image[a], the ephod, the household idols, and the cast image. Then the priest said to them, “What are you doing?”
translation:
  language: fr
  text: 'Ces hommes entrèrent dans la maison de Mica et prirent la statue sculptée, l’éphod, les idoles domestiques[a] et la statue en métal fondu. Alors le prêtre leur dit : « Qu’est-ce que vous faites ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les terafim », objets cultuels ou idoles associés à la maison.'
    reason: Précise le terme culturel hébreu sous-jacent tout en conservant un texte principal immédiatement compréhensible.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ces hommes
  rationale: Le démonstratif renvoie aux cinq hommes mentionnés dans le contexte immédiat. « Ces hommes » explicite naturellement le référent en français sans ajouter de contenu.
- source_word: בָּאוּ בֵּית מִיכָה
  choice: entrèrent dans la maison de Mika
  rationale: Le verbe signifie littéralement « vinrent/allèrent », mais, devant « maison de Mika » et dans ce mouvement narratif, il exprime ici l’entrée.
- source_word: וַיִּקְחוּ
  choice: prirent
  rationale: Rendu simple du verbe narratif, sans renforcer indûment l’idée de saisie violente.
- source_word: פֶּסֶל
  choice: statue sculptée
  rationale: Le terme désigne une représentation façonnée par sculpture. Ce choix conserve son caractère concret sans recourir à une formulation archaïque.
- source_word: הָאֵפוֹד
  choice: l’éphod
  rationale: Objet cultuel particulier sans équivalent français exact ; la translittération traditionnelle évite d’en préciser abusivement la forme ou la fonction dans ce contexte.
- source_word: הַתְּרָפִים
  choice: les idoles domestiques
  rationale: Les terafim sont des objets cultuels associés à la maison. Cette formulation en communique le sens aux lecteurs modernes, tandis qu’une note conserve le terme hébreu traditionnel.
- source_word: הַמַּסֵּכָה
  choice: la statue en métal fondu
  rationale: Le nom désigne une représentation obtenue par la fonte ou le coulage du métal. Cette expression française claire préserve la distinction avec la statue sculptée.
- source_word: וַיֹּאמֶר אֲלֵיהֶם הַכֹּהֵן
  choice: Alors le prêtre leur dit
  rationale: « Alors » rend naturellement la progression du récit portée par le waw narratif.
- source_word: מָה אַתֶּם עֹשִׂים
  choice: Qu’est-ce que vous faites ?
  rationale: Traduction directe et idiomatique de la question, sans ajouter un complément de lieu absent de l’hébreu.
theological_decisions:
- issue: Désignation des objets cultuels dans un contexte idolâtre
  choice: 'Conserver quatre désignations distinctes : statue sculptée, éphod, idoles domestiques et statue en métal fondu.'
  alternative: Uniformiser ces objets sous le terme générique « idoles ».
  rationale: L’hébreu énumère des objets cultuels distincts. Maintenir ces différences respecte le texte et évite d’imposer une interprétation qui les confondrait.
translation_notes:
  register: Français international actuel, naturel et digne. La syntaxe narrative reste simple, et les objets cultuels sont nommés concrètement sans archaïsme ni commentaire confessionnel.
