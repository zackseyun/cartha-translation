base_translation:
  language: en
  yaml_path: translation/ot/judges/018/006.yaml
  text: And the priest said to them[a], “Go in peace. The journey on which you are going is before Yahweh.”
translation:
  language: fr
  text: 'Le prêtre leur dit : « Allez en paix. Le chemin que vous allez emprunter est devant Yahvé[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « votre chemin est devant Yahvé » ; il est en sa présence ou sous son regard. Cette expression ne signifie pas nécessairement qu’il approuve explicitement leur projet.'
    reason: Préciser la portée possible de נֹכַח יְהוָה sans renforcer la déclaration en promesse d’approbation ou de réussite.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le passé simple fait avancer naturellement le récit en français et rend le wayyiqtol sans préciser davantage la relation temporelle.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Le nom défini désigne le prêtre déjà présent dans le contexte.
- source_word: לְכוּ לְשָׁלוֹם
  choice: Allez en paix
  rationale: Cette formule française naturelle conserve à la fois l’impératif et la valeur de souhait ou de bénédiction de l’expression hébraïque.
- source_word: נֹכַח
  choice: devant
  rationale: Ce choix proche de l’hébreu préserve l’idée que le chemin se trouve en présence de Yahvé ou sous son regard, sans transformer la phrase en approbation explicite.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La transcription française usuelle du nom divin conserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: דַּרְכְּכֶם אֲשֶׁר תֵּלְכוּ בָהּ
  choice: Le chemin que vous suivez
  rationale: « Chemin » maintient l’image hébraïque, tandis que « que vous suivez » exprime naturellement en français l’action d’aller sur ce chemin.
theological_decisions:
- issue: Portée de la déclaration du prêtre concernant Yahvé et le déplacement des Danites
  choice: Le chemin que vous suivez est devant Yahvé
  alternative: Yahvé approuve votre voyage / Votre voyage est sous la protection de Yahvé
  rationale: L’expression hébraïque affirme directement que leur chemin est devant Yahvé, donc en sa présence ou sous son regard. Elle ne déclare pas explicitement qu’il l’approuve, le bénit ou en garantit la réussite; la formulation retenue préserve cette tension.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « est devant Yahvé », légèrement marquée mais claire, est conservée afin de respecter l’image hébraïque et son ambiguïté théologique.
