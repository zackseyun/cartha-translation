  text: וַ/יֵּלְכוּ֙ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֔ים וַ/יָּבֹ֖אוּ לָ֑יְשָׁ/ה וַ/יִּרְא֣וּ אֶת הָ/עָ֣ם אֲשֶׁר בְּ/קִרְבָּ֣/הּ יוֹשֶֽׁבֶת לָ֠/בֶטַח כְּ/מִשְׁפַּ֨ט צִדֹנִ֜ים שֹׁקֵ֣ט וּ/בֹטֵ֗חַ וְ/אֵין מַכְלִ֨ים דָּבָ֤ר בָּ/אָ֨רֶץ֙ יוֹרֵ֣שׁ עֶ֔צֶר וּ/רְחֹקִ֥ים הֵ֨מָּה֙ מִ/צִּ֣דֹנִ֔ים וְ/דָבָ֥ר אֵין לָ/הֶ֖ם עִם אָדָֽם־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/007.yaml
  text: Then the five men went and came to Laish[a], and they saw the people who were in it, dwelling securely, according to the custom of the Sidonians, quiet and secure. And there was no one in the land to humiliate them in anything, possessing authority; and they were far from the Sidonians[c][b], and they had no dealings with anyone.
translation:
  language: fr
  text: 'Les cinq hommes partirent et arrivèrent à Laïsh. Ils virent le peuple qui y habitait : il vivait en sécurité, à la manière des Sidoniens, dans le calme et la sécurité. Il n’y avait dans le pays personne qui les humiliât en quoi que ce soit et qui détenait l’autorité.[a] Ils étaient loin des Sidoniens et n’avaient de relations avec personne.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de cette proposition est difficile. Littéralement, on lit approximativement : « il n’y avait personne qui fasse honte à quoi que ce soit dans le pays, possédant l’autorité ». Le dernier membre peut qualifier la personne dont l’absence est affirmée; le sens peut être qu’il n’y avait ni dirigeant ni oppresseur capable de les dominer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « n’avaient d’alliance avec personne » ou « n’avaient affaire à personne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָיְשָׁה
  choice: Laïsh
  rationale: Nom propre du lieu, translittéré d’après la forme hébraïque employée ici; la ville sera ensuite renommée Dan.
- source_word: יוֹשֶׁבֶת לָבֶטַח
  choice: vivaient en sécurité
  rationale: Rend naturellement en français l’idée d’une population établie sans crainte immédiate.
- source_word: כְּמִשְׁפַּט צִדֹנִים
  choice: à la manière des Sidoniens
  rationale: Dans ce contexte, מִשְׁפָּט désigne vraisemblablement une manière de vivre ou une coutume, plutôt qu’un jugement juridique.
- source_word: שֹׁקֵט וּבֹטֵחַ
  choice: tranquilles et confiants
  rationale: Préserve les deux qualificatifs et leur insistance cumulative sur le calme et le sentiment de sécurité.
- source_word: מַכְלִים דָּבָר
  choice: ne les humiliait en quoi que ce soit
  rationale: Le hifil de כלם exprime le fait de couvrir de honte ou d’humilier; le complément indéfini est rendu sans en préciser artificiellement la nature.
- source_word: יוֹרֵשׁ עֶצֶר
  choice: n’exerçait d’autorité sur eux
  rationale: L’expression hébraïque est obscure. La formulation française exprime prudemment l’idée contextuelle d’un détenteur d’autorité ou d’un dominateur, sans prétendre résoudre entièrement la difficulté.
- source_word: וּרְחֹקִים הֵמָּה מִצִּדֹנִים
  choice: Ils étaient loin des Sidoniens
  rationale: Rend directement l’éloignement géographique qui explique leur isolement.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: n’avaient de relations avec personne
  rationale: L’expression idiomatique indique l’absence de rapports ou d’affaires avec d’autres personnes; « personne » rend ici la valeur générique de אָדָם.
