review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : ils demandent au prêtre de consulter Dieu afin de savoir si leur démarche réussira. Toutefois, « le chemin que nous suivons réussira » est un calque peu idiomatique en français. Le possessif de דַּרְכֵּנוּ mérite aussi d’être maintenu dans la note littérale.'
  naturalness: « Consulte donc Dieu » est possible, mais « donc » ne rend pas avec précision la politesse de נָא et peut suggérer une conséquence. « Nous t’en prions, consulte Dieu » est à la fois naturel, digne et explicitement suppliant. « Notre expédition sera couronnée de succès » rend naturellement le prédicat hébreu appliqué à leur “chemin”, compris ici comme l’entreprise en cours.
  terminology: « Dieu » au singulier est contextuellement justifié. « Expédition » convient au déplacement entrepris par les Danites et évite de faire “réussir” un chemin en français. La note conserve l’image littérale du chemin ainsi que la possibilité de comprendre le terme comme une entreprise.
  issues:
  - severity: medium
    issue: Calque syntaxico-sémantique dans « le chemin que nous suivons réussira »
    rationale: En français moderne, un chemin ne “réussit” pas naturellement. La formulation gêne la lecture sans préserver davantage le sens que ne le fait une expression idiomatique accompagnée d’une note littérale.
  - severity: low
    issue: « donc » pour נָא
    rationale: Le mot peut fonctionner comme particule discursive, mais il exprime moins clairement la requête polie du texte que « nous t’en prions ».
  revised_text: 'Ils lui dirent : « Nous t’en prions, consulte Dieu afin que nous sachions si notre expédition sera couronnée de succès[a]. »'
