  to: 'Ils lui dirent : « Nous t’en prions, consulte Dieu afin que nous sachions si notre expédition sera couronnée de succès[a]. »'
  rationale: La révision remplace un calque français peu naturel par une formulation idiomatique qui transmet l’idée de succès de l’entreprise, tout en conservant dans une note l’image littérale du « chemin » et son ambiguïté. Elle rend aussi plus explicitement la valeur de requête polie de נָא.
