  text: וַ/יֹּ֥אמְרוּ ל֖/וֹ שְׁאַל נָ֣א בֵ/אלֹהִ֑ים וְ/נֵ֣דְעָ֔ה הֲ/תַצְלִ֣יחַ דַּרְכֵּ֔/נוּ אֲשֶׁ֥ר אֲנַ֖חְנוּ הֹלְכִ֥ים עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/005.yaml
  text: And they said to him[a], “Please inquire of God, so that we may know whether the journey on which we are going will succeed.”
translation:
  language: fr
  text: 'Ils lui dirent : « Nous t’en prions, consulte Dieu afin que nous sachions si notre expédition sera couronnée de succès[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si notre chemin prospérera » ou « réussira ». Le mot peut désigner le chemin parcouru ou, par extension, l’entreprise en cours.'
    reason: Préserve l’image et le possessif de l’hébreu tout en expliquant la traduction idiomatique de l’expression.
lexical_decisions:
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Ils lui dirent
  rationale: Le wayyiqtol poursuit simplement le récit. Le passé simple convient au registre narratif français sans ajouter une relation temporelle plus précise.
- source_word: שְׁאַל נָא
  choice: Consulte donc
  rationale: שׁאל avec נָא formule ici une demande atténuée visant à obtenir une réponse divine. « Consulte donc » est naturel en français dans ce contexte et rend la nuance de sollicitation sans lourdeur.
- source_word: בֵאלֹהִים
  choice: Dieu
  rationale: Avec שׁאל, la préposition ב introduit celui que l’on consulte. Dans ce contexte, אֱלֹהִים s’entend le plus naturellement au singulier.
- source_word: וְנֵדְעָה
  choice: pour que nous sachions
  rationale: La forme cohortative exprime le but de la demande; cette tournure rend clairement ce rapport en français.
- source_word: הֲתַצְלִיחַ
  choice: réussira
  rationale: Le hiphil de צלח signifie ici connaître le succès ou aboutir. « Réussira » conserve l’idée sans lui donner une connotation principalement matérielle.
- source_word: דַּרְכֵּנוּ
  choice: le chemin
  rationale: Le mot signifie littéralement « notre chemin ». En français, « le chemin que nous suivons » exprime naturellement le parcours ou l’entreprise en question tout en préservant l’image hébraïque; la variante plus explicite figure en note.
- source_word: אֲשֶׁר אֲנַחְנוּ הֹלְכִים עָלֶיהָ
  choice: que nous suivons
  rationale: L’hébreu parle du chemin sur lequel ils vont. « Que nous suivons » conserve cette image dans une syntaxe française idiomatique.
theological_decisions:
- issue: Sens de אֱלֹהִים
  choice: Dieu, au singulier
  alternative: les dieux
  rationale: Bien que la forme puisse être morphologiquement plurielle, le contexte immédiat présente une consultation divine par l’intermédiaire du prêtre et favorise le référent singulier, sans ajout doctrinal.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit; le dialogue reste clair et courant. L’image du chemin est maintenue dans le texte, sans explicitation doctrinale.
