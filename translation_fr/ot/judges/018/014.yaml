base_translation:
  language: en
  yaml_path: translation/ot/judges/018/014.yaml
  text: Then the five men who had gone to spy out the land of Laish answered and said to their brothers[a], “Do you know that in these houses there are an ephod, teraphim, a carved image, and a cast image? So now[b], know what you will do.”
translation:
  language: fr
  text: 'Alors les cinq hommes qui étaient allés explorer le territoire de Laïsh prirent la parole et dirent à leurs frères : « Savez-vous que, dans ces maisons, il y a un éphod, des téraphim[a], une image sculptée et une image coulée[b] ? Voyez donc ce que vous allez faire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les téraphim étaient des objets ou des représentations liés au culte domestique; le terme hébreu peut aussi être rendu par « idoles domestiques » ou « dieux du foyer ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne une image fabriquée par coulée; les traductions traditionnelles disent souvent « image en métal fondu ».
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: prirent la parole
  rationale: Dans ce récit, ענה sert de formule d’introduction à une prise de parole, même sans propos antérieur explicitement cité. « Prirent la parole » est naturel en français et évite le peu idiomatique « répondirent et dirent ».
- source_word: הַהֹלְכִים לְרַגֵּל אֶת הָאָרֶץ לַיִשׁ
  choice: qui étaient allés explorer le territoire de Laïsh
  rationale: Le plus-que-parfait situe cette mission avant la scène présente. « Explorer » convient à une mission de reconnaissance, et « territoire » exprime ici la région rattachée à Laïsh.
- source_word: אֶל־אֲחֵיהֶם
  choice: à leurs frères
  rationale: Le terme signifie littéralement « leurs frères » et désigne ici les autres hommes de leur groupe danite.
- source_word: בַּבָּתִּים הָאֵלֶּה
  choice: dans ces maisons
  rationale: La traduction conserve le sens concret et pluriel de בָּתִּים sans préciser davantage la nature des bâtiments.
- source_word: אֵפוֹד
  choice: un éphod
  rationale: Ce terme cultuel spécifique n’a pas d’équivalent français simple; sa translittération préserve sa particularité sans imposer une identification trop étroite.
- source_word: תְרָפִים
  choice: des téraphim
  rationale: La translittération maintient le terme cultuel distinct et évite de trancher dans le texte entre images domestiques, idoles et divinités du foyer.
- source_word: פֶּסֶל
  choice: une statue sculptée
  rationale: Le mot désigne une représentation façonnée par sculpture. « Statue sculptée » est concret et distingue cet objet de celui qui est coulé.
- source_word: מַסֵּכָה
  choice: une statue en métal fondu
  rationale: Le terme désigne une représentation fabriquée par fonte ou moulage, généralement en métal. Cette formulation est claire en français moderne.
- source_word: וְעַתָּה דְּעוּ מַה־תַּעֲשׂוּן
  choice: Maintenant, voyez ce que vous avez à faire
  rationale: Littéralement, l’expression appelle les auditeurs à « savoir » ce qu’ils feront; en contexte, il s’agit d’une invitation pressante à considérer puis décider leur action. La formulation française conserve cette retenue sans expliciter un ordre de s’emparer des objets.
theological_decisions:
- issue: Désignation des objets cultuels du sanctuaire de Mika
  choice: 'Conserver quatre termes distincts : « un éphod, des téraphim, une statue sculptée et une statue en métal fondu »'
  alternative: « un vêtement sacerdotal, des idoles domestiques, une idole sculptée et une idole de métal »
  rationale: L’hébreu énumère des objets distincts. Les conserver séparément évite de les réduire à une seule catégorie et de préciser plus que le texte leur fonction ou leur statut.
- issue: Portée de l’exhortation finale
  choice: « voyez ce que vous avez à faire »
  alternative: « décidez ce que vous allez faire » ou « vous savez maintenant ce qu’il vous reste à faire »
  rationale: Le texte invite à envisager une action sans la nommer explicitement. La traduction ne doit pas transformer cette insinuation en ordre explicite ni supposer que la décision est déjà prise.
- issue: Terme de parenté אֲחֵיהֶם
  choice: « leurs frères »
  alternative: « leurs compagnons » ou « les autres Danites »
  rationale: Le sens littéral et contextuel convient ici à un groupe masculin et préserve l’expression de solidarité clanique ou tribale.
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « prirent la parole et dirent » rend naturellement la formule hébraïque. Les termes cultuels restent concrets et distincts; les notes expliquent les mots moins familiers sans alourdir le verset.
