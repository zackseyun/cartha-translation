review_pass:
  verdict: revise
  source_fidelity: Le verset rend correctement la structure narrative, la mission de reconnaissance, « leurs frères », les maisons et la liste de quatre objets cultuels. Toutefois, « statue sculptée » restreint פֶּסֶל à une statue, et « statue en métal fondu » ajoute à la formulation principale une précision matérielle qui n’est pas explicitement formulée par le terme hébreu. La finale « ce que vous avez à faire » introduit plus nettement une obligation que l’hébreu, qui laisse ouverte la décision sur ce qu’ils feront.
  naturalness: Le français est globalement fluide et de registre narratif approprié. « Image sculptée » et « image coulée » sont naturels dans un contexte biblique moderne et permettent de conserver la distinction lexicale sans la redoubler par « statue ». « Voyez donc ce que vous allez faire » est idiomatique et garde l’exhortation délibérative.
  terminology: « Éphod » et « téraphim » sont bien conservés comme termes techniques distincts. Le remplacement de « statue » par « image » évite de surspécifier les deux termes. La note sur les téraphim peut conserver les possibilités interprétatives; celle sur la massékha doit éviter de présenter le métal fondu comme le sens littéral strict.
  issues:
  - severity: medium
    issue: « une statue sculptée et une statue en métal fondu » surspécifie les deux termes d’images.
    rationale: פֶּסֶל désigne une image taillée/sculptée, sans exiger qu’il s’agisse d’une statue; מַסֵּכָה désigne une image coulée. La mention du métal est plausible, mais elle dépasse la formulation minimale du texte hébreu.
  - severity: low
    issue: « ce que vous avez à faire » accentue une obligation.
    rationale: דְּעוּ מַה־תַּעֲשׂוּ appelle les destinataires à considérer ou déterminer ce qu’ils feront. Une tournure au futur conserve mieux l’ouverture de l’expression.
  - severity: low
    issue: La note b qualifie « métal fondu » de littéral.
    rationale: Le sens de fabrication par coulée est au cœur du terme; la précision « métal » est une explicitation contextuellement probable, non le libellé littéral minimal.
