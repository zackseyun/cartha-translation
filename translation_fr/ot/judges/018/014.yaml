- from: 'Alors les cinq hommes qui étaient allés explorer le territoire de Laïsh prirent la parole et dirent à leurs frères : « Savez-vous que, dans ces maisons, il y a un éphod, des téraphim[a], une statue sculptée et une statue en métal fondu[b] ? Maintenant, voyez ce que vous avez à faire. »'
  to: 'Alors les cinq hommes qui étaient allés explorer le territoire de Laïsh prirent la parole et dirent à leurs frères : « Savez-vous que, dans ces maisons, il y a un éphod, des téraphim[a], une image sculptée et une image coulée[b] ? Voyez donc ce que vous allez faire. »'
  rationale: La révision préserve les quatre objets cultuels comme catégories distinctes, sans imposer que chacun soit une statue ni expliciter le métal dans le texte principal. Elle rend aussi la dernière exhortation de façon délibérative et non excessivement prescriptive. Les ancres de notes restent directement attachées aux termes qu’elles expliquent.
