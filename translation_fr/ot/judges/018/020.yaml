base_translation:
  language: en
  yaml_path: translation/ot/judges/018/020.yaml
  text: And the priest’s heart was glad[a], and he took the ephod, the household idols, and the carved image[b], and went into the midst of the people.
translation:
  language: fr
  text: Le prêtre fut heureux, et il prit l’éphod, les idoles domestiques[a] et l’image sculptée[b], puis il entra au milieu du peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les téraphim ». Le terme désigne des objets cultuels domestiques ou des dieux de la maisonnée.'
    reason: lexical_alternative
  - marker: b
    text: Ou « l’idole » ou « l’image taillée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב לֵב הַכֹּהֵן
  choice: Le cœur du prêtre se réjouit
  rationale: Cette formulation conserve l’image idiomatique hébraïque, littéralement « le cœur du prêtre fut heureux/bon », tout en restant naturelle et claire en français moderne.
- source_word: הָאֵפוֹד
  choice: l’éphod
  rationale: Terme cultuel technique établi en français, préférable à une paraphrase qui risquerait de préciser indûment la forme ou la fonction de l’objet.
- source_word: הַתְּרָפִים
  choice: les idoles domestiques
  rationale: Le terme désigne des objets cultuels ou divinités liés à la maisonnée. Cette traduction en communique clairement le sens général, tandis qu’une note conserve le terme hébreu traditionnel.
- source_word: הַפָּסֶל
  choice: la statue sculptée
  rationale: Le nom désigne une représentation fabriquée par taille ou sculpture. « Statue sculptée » rend le caractère concret de l’objet sans employer le terme vieilli « image taillée » comme seule possibilité.
- source_word: בְּקֶרֶב הָעָם
  choice: au milieu du peuple
  rationale: Cette expression conserve à la fois l’idée de déplacement et la nuance spatiale de l’hébreu, plutôt que de réduire le sens à « parmi le peuple ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La tournure « Le cœur du prêtre se réjouit » préserve l’image hébraïque sans paraître archaïque. Les termes cultuels sont rendus avec clarté, tout en signalant les principales solutions lexicales dans les notes.
