    issue: Incohérence de temps dans la proposition initiale
    rationale: « Se réjouit » est au présent, alors que les waw-consécutifs hébreux relèvent ici de la narration passée et que la suite française est au passé simple (« prit », « entra »).
  - severity: low
    issue: « Statue sculptée » est inutilement redondant et plus étroit que le terme source
    rationale: פסל désigne une image/idole façonnée, sans exiger qu’il s’agisse spécifiquement d’une statue ; « image sculptée » est plus exact.
  revised_text: Le prêtre fut heureux, et il prit l’éphod, les idoles domestiques[a] et l’image sculptée[b], puis il entra au milieu du peuple.
