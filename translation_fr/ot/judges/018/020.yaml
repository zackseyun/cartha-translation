    reason: lexical_alternative
  revision_rationale: La révision harmonise les temps du récit avec l’hébreu narratif et avec le passé simple français déjà employé. Elle remplace « statue sculptée » par « image sculptée », expression à la fois naturelle et plus fidèle à l’étendue sémantique de פסל. Les notes et leurs ancres restent appropriées.
