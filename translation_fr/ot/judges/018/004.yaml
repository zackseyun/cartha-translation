  yaml_path: translation/ot/judges/018/004.yaml
  text: He said to them[a], “Thus and so Micah did for me, and he hired me, and I became his priest.”
translation:
  language: fr
  text: 'Il leur répondit[a] : « Michée a fait telle et telle chose pour moi, il m’a engagé, et je suis devenu son prêtre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Il leur dit ». L’expression « telle et telle chose » rend un idiome hébreu qui résume sans les répéter des faits déjà mentionnés.'
    reason: Précision lexicale et idiomatique
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Il leur répondit
  rationale: Dans ce dialogue, אמר introduit la réponse du lévite. « Répondit » est naturel en français et explicite la fonction contextuelle sans ajouter de contenu.
- source_word: כָּזֹה וְכָזֶה
  choice: ceci et cela
  rationale: Cette locution récapitule des faits déjà exposés sans les répéter. « Ceci et cela » en conserve le caractère indéfini dans un français courant.
- source_word: עָשָׂה לִי
  choice: a fait ... pour moi
  rationale: עשה avec ל indique ici ce que Michée a fait pour le lévite ou à son égard. La formulation retenue préserve la construction et convient aux arrangements décrits dans le contexte.
- source_word: מִיכָה
  choice: Michée
  rationale: Forme française traditionnelle et largement reconnue du nom propre biblique.
- source_word: וַיִּשְׂכְּרֵנִי
  choice: il m’a engagé
  rationale: Le verbe שׂכר signifie embaucher contre rémunération. « Engagé » est direct et naturel dans ce contexte.
- source_word: וָאֱהִי לוֹ לְכֹהֵן
  choice: et je suis devenu son prêtre
  rationale: Dans la séquence narrative, היה marque vraisemblablement l’entrée dans une nouvelle fonction. « Son prêtre » exprime le service personnel auprès de Michée sans légitimer cette situation cultuelle.
theological_decisions:
- issue: Nature de la fonction sacerdotale dans un cadre cultuel irrégulier
  choice: son prêtre
  alternative: prêtre pour lui
  rationale: L’association de לוֹ et לְכֹהֵן rattache la fonction sacerdotale à Michée. « Son prêtre » rend naturellement ce lien personnel, sans porter de jugement sur la légitimité de l’arrangement.
translation_notes:
  register: Français international moderne, simple et digne. La locution « ceci et cela » conserve le résumé indéfini de l’hébreu, tandis que « son prêtre » maintient la tension théologique du récit sans valider ni condamner explicitement cette fonction.
