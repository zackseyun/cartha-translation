  text: וְ/שֵׁשׁ מֵא֣וֹת אִ֗ישׁ חֲגוּרִים֙ כְּלֵ֣י מִלְחַמְתָּ֔/ם נִצָּבִ֖ים פֶּ֣תַח הַ/שָּׁ֑עַר אֲשֶׁ֖ר מִ/בְּנֵי דָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/016.yaml
  text: And six hundred men[a], armed with their weapons of war, were standing at the entrance of the gate; these were from the sons of Dan.
translation:
  language: fr
  text: Et six cents hommes, équipés de leurs armes de guerre, se tenaient à l’entrée de la porte ; ils étaient des fils de Dan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/שֵׁשׁ מֵאוֹת אִישׁ
  choice: Et les six cents hommes
  rationale: La conjonction וְ poursuit naturellement le récit par « Et ». Après le nombre, אִישׁ a un sens collectif, rendu idiomatiquement par le pluriel « hommes ».
- source_word: חֲגוּרִים
  choice: munis
  rationale: Le participe signifie littéralement « ceints »; associé à l’équipement militaire, « munis » exprime clairement et sans archaïsme que ces hommes portent leurs armes.
- source_word: כְּלֵי מִלְחַמְתָּם
  choice: de leurs armes de guerre
  rationale: כְּלִי désigne un objet, un équipement ou une arme; dans ce contexte militaire, « armes de guerre » conserve l’expression appuyée de l’hébreu sans préciser indûment le type d’armement.
- source_word: נִצָּבִים
  choice: se tenaient
  rationale: Le participe décrit leur position dans la scène. « Se tenaient » restitue naturellement cette valeur durative en français narratif.
- source_word: פֶּתַח הַשָּׁעַר
  choice: à l’entrée de la porte
  rationale: פֶּתַח désigne l’ouverture ou l’entrée. Cette formulation conserve les deux noms de l’hébreu tout en restant claire.
- source_word: אֲשֶׁר מִבְּנֵי דָן
  choice: issus des fils de Dan
  rationale: La proposition relative identifie les six cents hommes. « Issus des fils de Dan » conserve l’expression de parenté hébraïque tout en l’intégrant naturellement à la phrase française.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe a été légèrement réordonnée pour éviter une reprise lourde en fin de phrase, sans modifier les relations du texte hébreu. L’expression « fils de Dan » est maintenue dans le texte principal, tandis que l’équivalent ethnonymique « Danites » est signalé en note.
