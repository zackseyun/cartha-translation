  yaml_path: translation/ot/judges/018/008.yaml
  text: Then they came to their brothers at Zorah and Eshtaol[a], and their brothers said to them[b], “What is with you?”
translation:
  language: fr
  text: 'Puis ils arrivèrent auprès de leurs frères, à Tsorea et à Eshtaol[a]. Leurs frères leur demandèrent : « Qu’avez-vous à dire ? »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « auprès des membres de leur clan ». En hébreu, « frères » peut désigner des membres de la même parenté, du même clan ou de la même tribu, et pas seulement des frères au sens propre.
    reason: lexical_alternative
  - marker: b
    text: 'La question hébraïque est très brève et elliptique, littéralement : « Quoi, vous ? » Dans ce contexte, elle peut demander quel est leur rapport ou ce qui leur est arrivé, sans préciser davantage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Puis ils revinrent
  rationale: Le wayyiqtol fait avancer le récit. Dans le contexte du retour des éclaireurs auprès de ceux qui les avaient envoyés, « revinrent » explicite naturellement le mouvement sans en modifier le sens.
- source_word: אֶל אֲחֵיהֶם
  choice: auprès de leurs frères
  rationale: אָח peut désigner des frères au sens propre ou, comme probablement ici, des parents du même clan ou de la même tribu. Le texte principal conserve « frères » et la note signale l’acception plus large.
- source_word: צָרְעָה וְאֶשְׁתָּאֹל
  choice: Tsora et Eshtaol
  rationale: Les noms de lieux sont translittérés selon des formes françaises usuelles.
- source_word: וַיֹּאמְרוּ לָהֶם אֲחֵיהֶם
  choice: Leurs frères leur demandèrent
  rationale: Le verbe אָמַר introduit ici une question; « demandèrent » est idiomatique en français tout en conservant le sujet explicite.
- source_word: מָה אַתֶּם
  choice: Qu’avez-vous à nous dire ?
  rationale: La formule hébraïque est extrêmement brève et elliptique, littéralement « Quoi, vous ? ». Dans ce contexte, elle sollicite vraisemblablement le rapport des éclaireurs. La traduction reste ouverte quant au contenu précis de leur réponse, tandis que la note préserve l’ellipse.
