revisions:
- from: Ils prirent donc ce que Mika avait fabriqué, ainsi que le prêtre qui était à son service, puis ils marchèrent contre Laïsh, contre un peuple paisible et confiant. Ils les frappèrent du tranchant de l’épée[a] et livrèrent la ville aux flammes.
  to: Ils prirent donc ce que Mica avait fabriqué, ainsi que le prêtre qui était à son service, puis ils s’avancèrent contre Laïsh, contre un peuple paisible et en sécurité. Ils les frappèrent du tranchant de l’épée[a] et brûlèrent la ville par le feu.
  rationale: La révision normalise le nom propre selon l’usage biblique français, rend plus précisément la sécurité exprimée par le texte hébreu et explicite l’incendie de la ville sans modifier le sens ni l’ambiguïté du passage. Le marqueur et le contenu de la note sont conservés.
