base_translation:
  language: en
  yaml_path: translation/ot/judges/018/027.yaml
  text: So they took what Micah had made[a], along with the priest who belonged to him, and came against Laish, against a people quiet and secure. They struck them with the edge of the sword and burned the city with fire.
translation:
  language: fr
  text: Ils prirent donc ce que Mica avait fabriqué, ainsi que le prêtre qui était à son service, puis ils s’avancèrent contre Laïsh, contre un peuple paisible et en sécurité. Ils les frappèrent du tranchant de l’épée[a] et brûlèrent la ville par le feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la bouche de l’épée », expression hébraïque désignant le tranchant de l’épée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה לָקְחוּ
  choice: Ils prirent donc
  rationale: Le pronom indépendant met le sujet en relief et assure la continuité du récit. « donc » rend naturellement cette progression sans alourdir la phrase.
- source_word: אֵת אֲשֶׁר עָשָׂה מִיכָה
  choice: ce que Mika avait fabriqué
  rationale: La relative désigne les objets cultuels mentionnés dans le contexte. Le plus-que-parfait marque leur fabrication antérieure, et « fabriqué » convient à des objets matériels sans les préciser au-delà du texte.
- source_word: וְאֶת הַכֹּהֵן אֲשֶׁר הָיָה לוֹ
  choice: ainsi que le prêtre qui était à son service
  rationale: Littéralement, le prêtre « était à lui/pour lui ». « À son service » exprime son rattachement à Mika et à son sanctuaire sans suggérer qu’il était sa propriété.
- source_word: וַיָּבֹאוּ עַל לַיִשׁ
  choice: puis ils marchèrent contre Laïsh
  rationale: Avec עַל dans ce contexte militaire, בוא décrit un mouvement hostile. « Marchèrent contre » conserve ce mouvement et sa visée sans fondre la proposition dans le récit de l’attaque.
- source_word: עַל עַם שֹׁקֵט וּבֹטֵחַ
  choice: contre un peuple paisible et confiant
  rationale: שֹׁקֵט évoque la tranquillité ou la paix, et בֹטֵחַ le sentiment de sécurité ou de confiance. Cette formulation préserve les deux nuances sans introduire explicitement l’idée d’insouciance.
- source_word: וַיַּכּוּ אוֹתָם
  choice: Ils les frappèrent
  rationale: נכה peut signifier frapper, abattre ou tuer selon le contexte. « Frappèrent » reste proche du verbe hébreu, tandis que la mention de l’épée précise la violence de l’action.
- source_word: לְפִי חָרֶב
  choice: du tranchant de l’épée
  rationale: L’expression signifie littéralement « à la bouche de l’épée ». « Du tranchant de l’épée » en restitue le sens idiomatique tout en conservant l’image concrète.
- source_word: וְאֶת הָעִיר שָׂרְפוּ בָאֵשׁ
  choice: et livrèrent la ville aux flammes
  rationale: Cette tournure française naturelle rend à la fois le verbe « brûler » et la mention explicite du feu, sans la répétition peu idiomatique de « brûlèrent par le feu ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le nom לַיִשׁ est transcrit « Laïsh » pour indiquer les deux voyelles. La formulation maintient le contraste du texte entre la tranquillité du peuple et la violence de l’assaut. Le marqueur de note est placé après l’expression qu’il explique.
