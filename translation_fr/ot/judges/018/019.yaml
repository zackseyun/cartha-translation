  text: וַ/יֹּאמְרוּ֩ ל֨/וֹ הַחֲרֵ֜שׁ שִֽׂים יָדְ/ךָ֤ עַל פִּ֨י/ךָ֙ וְ/לֵ֣ךְ עִמָּ֔/נוּ וֶֽ/הְיֵה לָ֖/נוּ לְ/אָ֣ב וּ/לְ/כֹהֵ֑ן הֲ/ט֣וֹב הֱיוֹתְ/ךָ֣ כֹהֵ֗ן לְ/בֵית֙ אִ֣ישׁ אֶחָ֔ד א֚וֹ הֱיוֹתְ/ךָ֣ כֹהֵ֔ן לְ/שֵׁ֥בֶט וּ/לְ/מִשְׁפָּחָ֖ה בְּ/יִשְׂרָאֵֽל־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/019.yaml
  text: They said to him[a], “Be quiet; put your hand over your mouth, and come with us, and be to us a father and a priest. Is it better for you to be priest to the house of one man[c][b], or to be priest to a tribe and a clan in Israel?”
translation:
  language: fr
  text: 'Ils lui dirent : « Tais-toi[a], mets ta main sur ta bouche et viens avec nous. Sois pour nous un père[b] et un prêtre. Vaut-il mieux pour toi être prêtre de la maison d’un seul homme, ou être prêtre d’une tribu et d’un clan[c] en Israël ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Garde le silence. »'
    reason: Alternative lexicale pour l’impératif hébreu הַחֲרֵשׁ.
  - marker: b
    text: Ici, « père » est un titre exprimant une fonction d’autorité ou de direction sociale et religieuse, et non un lien biologique.
    reason: Note culturelle nécessaire pour éviter une lecture familiale littérale.
  - marker: c
    text: 'Ou : « famille ». Le terme hébreu désigne ici un groupe de parenté au sein d’une tribu.'
    reason: Alternative lexicale et précision sur l’organisation sociale.
lexical_decisions:
- source_word: הַחֲרֵשׁ
  choice: Tais-toi
  rationale: L’impératif commande de garder le silence. « Tais-toi » est direct, naturel et conserve la force de l’hébreu.
- source_word: שִׂים יָדְךָ עַל־פִּיךָ
  choice: mets la main sur ta bouche
  rationale: Cette formulation conserve l’image physique et l’expression gestuelle de silence ou de retenue.
- source_word: וְהְיֵה לָנוּ לְאָב וּלְכֹהֵן
  choice: Sois pour nous un père et un prêtre
  rationale: La traduction maintient les deux rôles et préserve « père » comme titre socioreligieux sans le réduire à une fonction plus précise.
- source_word: הֲטוֹב
  choice: Vaut-il mieux pour toi
  rationale: La question oppose deux situations et appelle donc naturellement une formulation comparative en français.
- source_word: לְבֵית אִישׁ אֶחָד
  choice: être prêtre de la maison d’un seul homme
  rationale: « Maison » préserve le sens de maisonnée ou groupe familial tout en restant proche de la construction hébraïque.
- source_word: לְשֵׁבֶט וּלְמִשְׁפָּחָה בְּיִשְׂרָאֵל
  choice: d’une tribu et d’un clan en Israël
  rationale: « Tribu » et « clan » distinguent deux niveaux de parenté collective; « clan » rend ici le groupe de parenté désigné par מִשְׁפָּחָה.
theological_decisions:
- issue: Sens de « père » comme titre
  choice: Conserver le titre littéral « père »
  alternative: conseiller, protecteur ou chef
  rationale: Le terme hébreu porte une valeur sociale et religieuse sans définir précisément la fonction. Le conserver évite d’imposer une interprétation institutionnelle étroite.
- issue: Rendu du groupe de parenté מִשְׁפָּחָה
  choice: clan
  alternative: famille
  rationale: « Clan » marque mieux le groupe de parenté collectif associé à une tribu et maintient le contraste avec la maison d’un seul homme.
translation_notes:
  register: Français international moderne, direct et digne. Le dialogue conserve le ton pressant des hommes de Dan. La syntaxe reste proche de l’hébreu tout en étant naturelle en français; les titres et catégories sociales potentiellement ambigus sont maintenus et expliqués en notes.
