source:
  edition: WLC
  text: וַ/יָּשִׂ֣ימוּ לָ/הֶ֔ם אֶת פֶּ֥סֶל מִיכָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כָּל יְמֵ֛י הֱי֥וֹת בֵּית הָ/אֱלֹהִ֖ים בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/031.yaml
  text: So they set up for themselves Micah’s carved image that he had made[a], all the days that the house of God was in Shiloh.
translation:
  language: fr
  text: Ils installèrent pour eux-mêmes l’image sculptée[a] que Michée avait faite, aussi longtemps que la maison de Dieu fut à Silo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’idole ». Le mot hébreu désigne une image cultuelle sculptée ; « image sculptée » en conserve le sens concret, tandis qu’« idole » en explicite davantage la fonction.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: Ils installèrent donc pour eux
  rationale: Le verbe שׂים signifie mettre ou placer. Dans ce contexte cultuel, « installèrent » exprime naturellement la mise en place durable de l’image, tandis que « pour eux » conserve la nuance de לָהֶם. « Donc » rend la valeur narrative de וַ.
- source_word: פֶּסֶל
  choice: statue sculptée
  rationale: Le terme désigne une représentation façonnée destinée au culte. « Statue sculptée » en conserve le caractère concret sans employer d’emblée le terme plus interprétatif « idole ».
- source_word: מִיכָה
  choice: Michée
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: אֲשֶׁר עָשָׂה
  choice: que Michée avait faite
  rationale: Le plus-que-parfait marque naturellement que la fabrication précède l’installation. La répétition explicite de « Michée » évite en français l’ambiguïté possible du pronom.
- source_word: כָּל יְמֵי הֱיוֹת
  choice: pendant tout le temps où … fut
  rationale: Cette formulation française naturelle restitue la durée exprimée par l’hébreu, littéralement « tous les jours où ».
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Traduction directe qui préserve le contraste implicite entre le culte danite et le lieu de culte établi à Silo, sans ajouter d’explication doctrinale.
- source_word: בְּשִׁלֹה
  choice: à Silo
  rationale: Forme française usuelle du toponyme; la préposition « à » convient naturellement à un nom de ville.
theological_decisions:
- issue: Désignation du lieu de culte central par בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  alternative: le sanctuaire de Dieu
  rationale: « Maison de Dieu » reste au plus près de l’expression hébraïque et maintient la tension narrative avec l’image cultuelle installée par les Danites. « Sanctuaire » expliciterait la fonction du lieu, mais serait moins formellement proche.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression narrative, la durée de l’installation et le contraste théologique implicite, sans vocabulaire archaïque ni ajout confessionnel.
