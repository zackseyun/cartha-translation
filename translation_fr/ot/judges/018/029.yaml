source:
  edition: WLC
  text: וַ/יִּקְרְא֤וּ שֵׁם הָ/עִיר֙ דָּ֔ן בְּ/שֵׁם֙ דָּ֣ן אֲבִי/הֶ֔ם אֲשֶׁ֥ר יוּלַּ֖ד לְ/יִשְׂרָאֵ֑ל וְ/אוּלָ֛ם לַ֥יִשׁ שֵׁם הָ/עִ֖יר לָ/רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/029.yaml
  text: And they called the name of the city Dan[a], after the name of Dan their father, who was born to Israel; however, the name of the city formerly was Laish.
translation:
  language: fr
  text: Ils appelèrent la ville Dan, du nom de Dan, leur père[a], qui était né d’Israël. Auparavant, la ville s’appelait Laïsh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « leur ancêtre » : en hébreu, le mot traduit par « père » peut aussi désigner un ancêtre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם הָעִיר דָּן
  choice: Ils appelèrent la ville Dan
  rationale: En français naturel, « appeler la ville Dan » exprime l’acte de nommer sans reproduire lourdement l’idiome hébreu « appeler le nom de la ville ».
- source_word: בְּשֵׁם דָּן
  choice: du nom de Dan
  rationale: Cette tournure indique que la ville reçut son nom en référence à Dan.
- source_word: אֲבִיהֶם
  choice: leur père
  rationale: Le sens lexical direct est « père », tout en pouvant désigner ici un ancêtre; cette portée plus large est signalée en note.
- source_word: אֲשֶׁר יוּלַּד לְיִשְׂרָאֵל
  choice: qui était né d’Israël
  rationale: La formulation conserve le nom « Israël » du texte source et rend naturellement le passif de ילד avec ל.
- source_word: וְאוּלָם ... לָרִאשֹׁנָה
  choice: Auparavant
  rationale: Dans ce contexte, l’ensemble introduit le contraste avec le nouveau nom et situe l’ancien nom dans le passé.
- source_word: לַיִשׁ
  choice: Laïsh
  rationale: Translittération française courante du nom propre hébreu לַיִשׁ.
theological_decisions:
- issue: Portée généalogique de אֲבִיהֶם
  choice: leur père
  alternative: leur ancêtre
  rationale: Le texte principal conserve l’image familiale hébraïque sans décider silencieusement que le terme désigne seulement un père immédiat; la note précise son emploi possible pour un ancêtre.
translation_notes:
  register: Français moderne, international et digne. La syntaxe est légèrement lissée pour éviter le calque « ils appelèrent le nom de la ville », tout en conservant tous les éléments de sens du texte hébreu.
