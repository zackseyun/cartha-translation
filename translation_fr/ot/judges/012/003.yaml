source:
  edition: WLC
  text: וָֽ/אֶרְאֶ֞ה כִּֽי אֵינְ/ךָ֣ מוֹשִׁ֗יע וָ/אָשִׂ֨ימָ/ה נַפְשִׁ֤/י בְ/כַפִּ/י֙ וָֽ/אֶעְבְּרָ/ה֙ אֶל בְּנֵ֣י עַמּ֔וֹן וַ/יִּתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדִ֑/י וְ/לָ/מָ֞ה עֲלִיתֶ֥ם אֵלַ֛/י הַ/יּ֥וֹם הַ/זֶּ֖ה לְ/הִלָּ֥חֶם בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/003.yaml
  text: When I saw that you were not delivering us[a], I put my life in my hand and crossed over against the Ammonites, and Yahweh gave them into my hand. So why have you come up against me today to fight against me?
translation:
  language: fr
  text: Quand j’ai vu que tu ne venais pas nous délivrer, j’ai risqué ma vie[a] et je me suis avancé contre les Ammonites. Yahweh les a livrés entre mes mains. Alors pourquoi êtes-vous montés aujourd’hui contre moi pour me combattre ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « j’ai placé ma vie dans ma paume », expression qui signifie s’exposer à perdre la vie.'
    reason: Note culturelle et idiomatique préservant l’image concrète de l’hébreu.
lexical_decisions:
- source_word: וָאֶרְאֶה כִּי אֵינְךָ מוֹשִׁיעַ
  choice: Quand j’ai vu que tu ne venais pas nous délivrer
  rationale: La tournure temporelle rend l’enchaînement qui motive l’action de Jephté. Le singulier « tu » conserve l’adresse hébraïque, et « nous » explicite l’objet sous-entendu de מוֹשִׁיעַ dans ce contexte de secours militaire.
- source_word: וָאָשִׂימָה נַפְשִׁי בְכַפִּי
  choice: j’ai risqué ma vie[a]
  rationale: L’expression hébraïque, littéralement « j’ai placé ma vie dans ma paume », signifie s’exposer volontairement à un danger mortel. La traduction idiomatique évite en français le contresens possible de « prendre sa vie en main »; l’image originale est conservée en note.
- source_word: וָאֶעְבְּרָה אֶל בְּנֵי עַמּוֹן
  choice: je me suis avancé contre les Ammonites
  rationale: עבר avec אֶל décrit ici le mouvement vers un adversaire. « Je me suis avancé contre » garde à la fois l’idée de déplacement et l’orientation hostile sans ajouter un lieu de traversée absent du texte.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: C’est l’ethnonyme français courant correspondant à l’expression hébraïque « fils d’Ammon ».
- source_word: וַיִּתְּנֵם יְהוָה בְּיָדִי
  choice: Yahweh les a livrés entre mes mains
  rationale: Cette formule de victoire attribue explicitement l’issue du combat à Yahweh. « Entre mes mains » conserve l’image hébraïque de la remise au pouvoir de quelqu’un.
- source_word: וְלָמָה עֲלִיתֶם אֵלַי הַיּוֹם הַזֶּה
  choice: Alors pourquoi êtes-vous montés aujourd’hui contre moi
  rationale: Le pluriel de עֲלִיתֶם est rendu par « êtes-vous montés », en contraste avec le singulier précédent. Dans ce contexte militaire, « contre moi » exprime la valeur hostile confirmée par la proposition finale.
- source_word: לְהִלָּחֶם בִּי
  choice: pour me combattre
  rationale: Cette formulation naturelle en français rend clairement le but hostile du déplacement sans alourdir la répétition de « contre moi ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Passage du singulier au pluriel dans l’interpellation
  choice: « tu » puis « vous êtes montés »
  alternative: Uniformiser toute l’adresse au pluriel
  rationale: L’hébreu passe réellement du singulier אֵינְךָ à la deuxième personne plurielle עֲלִיתֶם. La traduction conserve cette variation, qui peut viser d’abord un représentant puis l’ensemble de son groupe, sans trancher davantage.
translation_notes:
  register: Français international moderne, naturel et digne. Le récit reste direct et martial. Le contraste entre le « tu » singulier et le « vous » pluriel est volontairement maintenu, de même que l’attribution de la victoire à Yahweh.
