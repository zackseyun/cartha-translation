base_translation:
  language: en
  yaml_path: translation/ot/judges/012/012.yaml
  text: Then Elon the Zebulunite died[a], and he was buried in Aijalon, in the land of Zebulun.
translation:
  language: fr
  text: Puis Élon, le Zabulonite, mourut et fut enterré à Ayalon, dans le pays de Zabulon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le territoire de Zabulon ».
    reason: Alternative lexicale pour אֶרֶץ, qui peut désigner un pays, une terre ou un territoire.
lexical_decisions:
- source_word: וַיָּמָת
  choice: Puis … mourut
  rationale: Le wayyiqtol de מות fait progresser le récit vers l’événement suivant. « Puis … mourut » restitue naturellement cette succession en français.
- source_word: אֵלוֹן
  choice: Élon
  rationale: Le nom propre est translittéré selon l’usage français.
- source_word: הַזְּבוּלֹנִי
  choice: le Zabulonite
  rationale: Le gentilé avec article indique l’appartenance tribale ou régionale d’Élon ; « le Zabulonite » est une formulation française concise et traditionnelle.
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: 'Le nifal de קבר exprime ici le passif : Élon « fut enterré ».'
- source_word: בְּאַיָּלוֹן
  choice: à Ayalon
  rationale: La préposition בְּ marque le lieu de l’ensevelissement ; devant un nom de localité, « à » est idiomatique en français.
- source_word: בְּאֶרֶץ זְבוּלֻן
  choice: dans le pays de Zabulon
  rationale: אֶרֶץ désigne ici le pays ou territoire associé à Zabulon. « Pays » reste proche de la formulation hébraïque tout en étant naturel en français.
