  text: וַ/יִּשְׁפֹּ֥ט יִפְתָּ֛ח אֶת יִשְׂרָאֵ֖ל שֵׁ֣שׁ שָׁנִ֑ים וַ/יָּ֗מָת יִפְתָּח֙ הַ/גִּלְעָדִ֔י וַ/יִּקָּבֵ֖ר בְּ/עָרֵ֥י גִלְעָֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/007.yaml
  text: Jephthah judged Israel six years[a]. Then Jephthah the Gileadite died and was buried in the cities of Gilead.
translation:
  language: fr
  text: Jephté jugea Israël pendant six ans. Puis Jephté, le Galaadite, mourut et fut enterré dans les villes de Galaad.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans les villes de Galaad ». Ce pluriel peut être une tournure idiomatique désignant une ville non précisée de la région.'
    reason: ambiguïté textuelle et possibilité d’un emploi idiomatique du pluriel
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: jugea
  rationale: Dans le livre des Juges, שׁפט désigne régulièrement l’action exercée par un juge-libérateur sur Israël. « Jugea » conserve ce terme récurrent sans réduire sa fonction au commandement militaire ou au gouvernement civil.
- source_word: שֵׁשׁ שָׁנִים
  choice: pendant six ans
  rationale: Expression simple de durée ; « pendant » rend naturellement en français la durée indiquée par l’hébreu.
- source_word: הַגִּלְעָדִי
  choice: le Galaadite
  rationale: La forme gentilique identifie Jephté par son appartenance régionale. « Le Galaadite » est concis et conserve la forme du texte hébreu.
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: Le passif français correspond à la forme verbale hébraïque et convient à une notice funéraire.
- source_word: בְּעָרֵי גִלְעָד
  choice: dans les villes de Galaad
  rationale: Cette traduction conserve le pluriel explicite du texte massorétique, même s’il paraît inhabituel pour l’ensevelissement d’une seule personne. La note signale le sens idiomatique possible sans l’imposer dans le texte.
