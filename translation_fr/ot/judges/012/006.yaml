  register: Français international moderne, narratif et digne. Les translittérations « Shibboleth » et « Sibboleth » rendent immédiatement perceptible le contraste phonétique. L’imparfait dans la scène du contrôle traduit la valeur itérative possible des formes narratives (« ils lui disaient… il disait… ils l’égorgeaient »), tandis que le passé simple clôt le bilan global.
