  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אֱמָר נָ֨א שִׁבֹּ֜לֶת וַ/יֹּ֣אמֶר סִבֹּ֗לֶת וְ/לֹ֤א יָכִין֙ לְ/דַבֵּ֣ר כֵּ֔ן וַ/יֹּאחֲז֣וּ אוֹת֔/וֹ וַ/יִּשְׁחָט֖וּ/הוּ אֶל מַעְבְּר֣וֹת הַ/יַּרְדֵּ֑ן וַ/יִּפֹּ֞ל בָּ/עֵ֤ת הַ/הִיא֙ מֵֽ/אֶפְרַ֔יִם אַרְבָּעִ֥ים וּ/שְׁנַ֖יִם אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/006.yaml
  text: Then they said to him[a], “Please say ‘Shibboleth.’” But he said, “Sibboleth,” because he could not say it that way. So they seized him and slaughtered him at the fords of the Jordan. At that time forty-two thousand from Ephraim fell.
translation:
  language: fr
  text: 'Alors ils lui dirent[a] : « Dis, je te prie : “Shibboleth”. » Mais il dit : « Sibboleth », car il ne pouvait pas le prononcer ainsi. Alors ils le saisirent et l’égorgèrent aux gués du Jourdain. En ce temps-là, quarante-deux mille Éphraïmites tombèrent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu shibboleth peut signifier « épi » ou « cours d’eau » ; il sert ici de mot-test pour distinguer une prononciation d’une autre.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  choice: Dis donc
  rationale: L’impératif accompagné de נָא exprime ici une demande insistante mais non brutale; « Dis donc » est naturel dans ce contexte de contrôle oral sans alourdir la phrase.
- source_word: שִׁבֹּלֶת
  choice: Shibboleth
  rationale: Le mot sert de test de prononciation; la translittération conserve le contraste phonétique essentiel au récit, tandis que ses sens lexicaux sont indiqués en note.
- source_word: סִבֹּלֶת
  choice: Sibboleth
  rationale: La translittération fait entendre en français l’opposition entre le son initial « sh » demandé et le « s » effectivement prononcé.
- source_word: וְלֹא יָכִין לְדַבֵּר כֵּן
  choice: car il n’arrivait pas à le prononcer ainsi
  rationale: La tournure hébraïque indique qu’il ne parvenait pas à produire cette manière de parler; le contexte exige une référence claire à la prononciation sans suggérer une faute morale ou intellectuelle.
- source_word: וַיֹּאחֲזוּ אוֹתוֹ
  choice: Ils le saisissaient alors
  rationale: « Saisir » restitue la prise physique exprimée par אחז; « alors » marque naturellement la conséquence du test échoué.
- source_word: וַיִּשְׁחָטוּהוּ
  choice: l’égorgeaient
  rationale: שׁחט désigne proprement l’action de trancher la gorge ou d’abattre; « égorger » préserve ici la violence précise du terme mieux que le générique « tuer ».
- source_word: אֶל מַעְבְּרוֹת הַיַּרְדֵּן
  choice: aux gués du Jourdain
  rationale: מַעְבְּרוֹת désigne les lieux de passage du fleuve; « gués » est concis, idiomatique et géographiquement précis.
- source_word: וַיִּפֹּל ... מֵאֶפְרַיִם
  choice: des hommes d’Éphraïm tombèrent
  rationale: Dans ce contexte de conflit, נפל signifie mourir violemment. « Tombèrent » conserve l’image hébraïque, et « hommes d’Éphraïm » explicite naturellement les membres du groupe visé.
- source_word: אַרְבָּעִים וּשְׁנַיִם אָלֶף
  choice: quarante-deux mille
  rationale: Le nombre cardinal est rendu directement et sans modification.
