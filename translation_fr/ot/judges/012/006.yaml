  - severity: medium
    issue: « Dis donc »
    rationale: Cette expression ajoute une coloration orale d’insistance, voire d’impatience, absente de l’impératif avec נָא, qui porte une nuance de demande. « Dis, je te prie » conserve cette nuance sans familiarité déplacée.
  - severity: low
    issue: « hommes d’Éphraïm »
    rationale: Le texte dit littéralement « d’Éphraïm »; « Éphraïmites » est plus direct et évite l’ajout explicatif de « hommes ».
