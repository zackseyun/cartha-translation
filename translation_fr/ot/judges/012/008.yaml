  text: וַ/יִּשְׁפֹּ֤ט אַֽחֲרָי/ו֙ אֶת יִשְׂרָאֵ֔ל אִבְצָ֖ן מִ/בֵּ֥ית לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/008.yaml
  text: After him[a], Ibzan from Bethlehem judged Israel.
translation:
  language: fr
  text: Après lui, Ibtsân, de Bethléhem[a], jugea Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « originaire de Bethléhem ». La préposition hébraïque peut indiquer l’origine ou l’association.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: jugea
  rationale: Dans le livre des Juges, le verbe שׁפט désigne régulièrement l’activité du juge qui exerce son autorité sur Israël. « Jugea » conserve cette terminologie récurrente sans la réduire à « gouverna » ou « dirigea ».
- source_word: אַחֲרָיו
  choice: Après lui
  rationale: La préposition avec suffixe pronominal marque ici la succession par rapport au juge précédent. L’antécédent étant clair dans le contexte, il n’est pas nécessaire d’ajouter son nom.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: אֶת marque le complément d’objet direct en hébreu et ne se traduit pas séparément en français ; Israël est l’objet de l’activité judiciaire d’Ibtsân.
- source_word: אִבְצָן
  choice: Ibtsân
  rationale: Transcription française usuelle du nom propre hébreu, avec l’accent circonflexe indiquant la voyelle longue de la dernière syllabe.
- source_word: מִבֵּית לָחֶם
  choice: de Bethléhem
  rationale: La préposition מִן peut indiquer l’origine ou une association. La tournure française « de Bethléhem » reste naturelle et préserve cette latitude sémantique.
theological_decisions: []
