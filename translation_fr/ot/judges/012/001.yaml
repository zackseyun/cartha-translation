  to: 'Les hommes d’Éphraïm furent rassemblés[a]. Ils passèrent à Tsaphôn[b] et dirent à Jephté : « Pourquoi es-tu passé combattre les Ammonites sans nous appeler à aller avec toi ? Nous allons mettre le feu à ta maison au-dessus de toi[c] ! »'
  rationale: La révision conserve le choix contextuellement plausible de Tsaphôn et toutes les ambiguïtés signalées, mais retire de la traduction principale l’explicitation « te brûler avec elle ». Elle maintient l’image hébraïque de la maison incendiée au-dessus de Jephté et réserve l’inférence concernant sa présence dans la maison à la note.
