  text: וַ/יִּצָּעֵק֙ אִ֣ישׁ אֶפְרַ֔יִם וַֽ/יַּעֲבֹ֖ר צָפ֑וֹנָ/ה וַ/יֹּאמְר֨וּ לְ/יִפְתָּ֜ח מַדּ֣וּעַ עָבַ֣רְתָּ לְ/הִלָּחֵ֣ם בִּ/בְנֵי עַמּ֗וֹן וְ/לָ֨/נוּ֙ לֹ֤א קָרָ֨אתָ֙ לָ/לֶ֣כֶת עִמָּ֔/ךְ בֵּיתְ/ךָ֕ נִשְׂרֹ֥ף עָלֶ֖י/ךָ בָּ/אֵֽשׁ׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/001.yaml
  text: Then the men of Ephraim were called together[a], and they crossed over to Zaphon and said to Jephthah[c][b], “Why did you cross over to fight against the Ammonites and not call us to go with you? We will burn your house down over you with fire.”
translation:
  language: fr
  text: 'Les hommes d’Éphraïm furent rassemblés[a]. Ils passèrent à Tsaphôn[b] et dirent à Jephté : « Pourquoi es-tu passé combattre les Ammonites sans nous appeler à aller avec toi ? Nous allons mettre le feu à ta maison au-dessus de toi[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « l’homme d’Éphraïm », mais l’expression a ici un sens collectif, comme l’indique ensuite le verbe au pluriel : « ils dirent ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « vers le nord », si צָפוֹנָה est compris comme une indication de direction plutôt que comme le nom du lieu Tsaphôn.
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « Nous brûlerons ta maison sur toi par le feu. » La menace implique probablement qu’ils incendieront la maison alors que Jephté s’y trouve.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק אִישׁ אֶפְרַיִם
  choice: Les hommes d’Éphraïm furent rassemblés
  rationale: Le verbe exprime ici le rassemblement ou la mobilisation. אִישׁ est au singulier morphologique, mais désigne collectivement les Éphraïmites, comme le confirme le verbe pluriel וַיֹּאמְרוּ (« ils dirent »).
- source_word: וַיַּעֲבֹר
  choice: Ils passèrent
  rationale: Bien que la forme hébraïque soit au singulier, son sujet collectif est repris par un pluriel en français afin d’assurer une lecture naturelle et cohérente avec « ils dirent ».
- source_word: צָפוֹנָה
  choice: à Tsaphôn
  rationale: Le terme est compris en premier lieu comme le nom du lieu, Tsaphôn. L’analyse adverbiale « vers le nord » demeure possible et est signalée en note.
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: combattre les Ammonites
  rationale: « Les Ammonites » rend naturellement l’expression hébraïque « les fils d’Ammon »; le verbe français « combattre » exprime clairement l’action militaire.
- source_word: וְלָנוּ לֹא קָרָאתָ לָלֶכֶת עִמָּךְ
  choice: sans nous appeler à partir avec toi
  rationale: קרא désigne ici l’appel à participer à la campagne. La tournure française conserve à la fois l’absence d’appel et l’idée de partir aux côtés de Jephté.
- source_word: בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ
  choice: Nous allons mettre le feu à ta maison et te brûler avec elle
  rationale: 'La formulation rend explicitement la menace suggérée par עָלֶיךָ : incendier la maison alors que Jephté s’y trouve. Elle évite le calque peu naturel « brûler ta maison sur toi », tandis qu’une note conserve le caractère interprétatif de cette explicitation.'
