    issue: La menace finale est rendue de manière trop explicite.
    rationale: « Te brûler avec elle » interprète l’expression « brûler ta maison sur toi par le feu » comme l’affirmation directe que Jephté sera brûlé dans la maison. Cette implication est probable, mais la formulation imagée du texte mérite d’être conservée dans le corps du texte; l’explication peut rester en note.
  - severity: low
    issue: « à partir avec toi » est légèrement moins fidèle et moins idiomatique.
    rationale: לָלֶכֶת עִמָּךְ signifie « aller avec toi ». « Partir » restreint inutilement l’action au départ plutôt qu’à la participation à l’expédition.
