  text: After him, Abdon son of Hillel the Pirathonite judged Israel.
translation:
  language: fr
  text: Après lui, Abdon, fils de Hillel, le Pirathonite, jugea Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: jugea
  rationale: Dans le livre des Juges, le verbe שׁפט désigne régulièrement l’activité des juges d’Israël. « Jugea » conserve ce terme récurrent sans réduire ici sa portée possible à la seule administration de la justice.
- source_word: אַחֲרָיו
  choice: Après lui
  rationale: La préposition avec suffixe pronominal marque la succession par rapport au juge précédent. « Après lui » est direct et naturel.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: אֶת marque le complément d’objet direct et n’a pas d’équivalent à traduire en français ; Israël désigne ici le peuple sur lequel Abdôn exerça sa fonction.
- source_word: עַבְדּוֹן
  choice: Abdôn
  rationale: Le nom propre est translittéré selon une forme française qui représente la voyelle longue finale.
- source_word: בֶּן־הִלֵּל
  choice: fils de Hillel
  rationale: La construction nominal identifie simplement la filiation d’Abdôn.
- source_word: הַפִּרְעָתוֹנִי
  choice: de Piratôn
  rationale: Le gentilé désigne un homme originaire de Piratôn. En français courant, « de Piratôn » est plus immédiatement compréhensible que « le Piratonite » tout en conservant l’information géographique.
