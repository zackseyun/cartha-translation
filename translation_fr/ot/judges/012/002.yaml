base_translation:
  language: en
  yaml_path: translation/ot/judges/012/002.yaml
  text: Jephthah said to them[a], “I and my people were in a bitter conflict with the Ammonites, and I called out to you, but you did not save me from their hand.”
translation:
  language: fr
  text: 'Jephté leur dit[a] : « Mon peuple et moi étions engagés dans un violent conflit avec les Ammonites. J’ai fait appel à vous, mais vous ne m’avez pas sauvé de leur main. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Moi et mon peuple, nous étions dans un très grand conflit avec les fils d’Ammon. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ רִיב … מְאֹד
  choice: engagés dans un violent conflit
  rationale: L’expression littérale « homme de conflit » fonctionne ici avec le verbe être pour décrire la situation de Jephté et de son peuple. « Engagés dans un violent conflit » rend naturellement cette valeur prédicative et l’intensité de מְאֹד.
- source_word: וְעַמִּי
  choice: mon peuple et moi
  rationale: עַם désigne normalement le peuple. L’ordre français naturel place ici « mon peuple » avant « moi », sans réduire le groupe à une armée.
- source_word: וּבְנֵי עַמּוֹן
  choice: les Ammonites
  rationale: « Les Ammonites » est la désignation française courante de l’ethnonyme littéralement rendu par « les fils d’Ammon ».
- source_word: וָאֶזְעַק אֶתְכֶם
  choice: je vous ai appelés au secours
  rationale: זעק exprime couramment un appel à l’aide. L’ajout idiomatique « au secours » explicite la nature de l’appel dans ce contexte militaire sans en modifier le sens.
- source_word: וְלֹא הוֹשַׁעְתֶּם אֹתִי
  choice: vous ne m’avez pas sauvé
  rationale: Le hiphil de ישׁע signifie sauver ou délivrer. « Sauver » reste direct et convient au contexte militaire sans lui imposer une portée exclusivement théologique.
- source_word: מִיָּדָם
  choice: de leur main
  rationale: Cette formulation conserve l’image hébraïque de la main comme expression du pouvoir ou de la domination; elle demeure intelligible en français biblique moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation principale privilégie une expression idiomatique du conflit, tandis que la note conserve la structure inhabituelle et l’ambiguïté de l’hébreu.
