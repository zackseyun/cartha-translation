  text: He had forty sons and thirty grandsons, riding on seventy donkeys, and he judged Israel eight years.
translation:
  language: fr
  text: Il avait quarante fils et trente petits-fils, qui montaient soixante-dix ânons. Il jugea Israël pendant huit ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי בָנִים
  choice: petits-fils
  rationale: Littéralement « fils de fils » ; en français courant, « petits-fils » exprime naturellement cette relation de descendance masculine.
- source_word: רֹכְבִים עַל שִׁבְעִים עֲיָרִם
  choice: qui montaient soixante-dix ânes
  rationale: Le participe décrit les quarante fils et trente petits-fils comme cavaliers ; « monter un âne » est idiomatique et conserve l'association entre les soixante-dix descendants et les soixante-dix montures.
- source_word: וַיִּשְׁפֹּט
  choice: Il jugea
  rationale: Conserve le verbe récurrent du livre et sa portée de gouvernement ou de direction sans la réduire à une simple fonction judiciaire.
theological_decisions:
- issue: Portée du verbe « juger » dans le livre des Juges
  choice: Il jugea Israël
  alternative: Il gouverna Israël
  rationale: « Jugea » maintient le vocabulaire structurant du texte hébreu et laisse subsister l'étendue exacte de la fonction exercée.
translation_notes:
  register: Français international moderne, sobre et narratif. La relative « qui montaient » évite l'ambiguïté d'un participe détaché et rattache clairement les soixante-dix ânes aux soixante-dix descendants.
