base_translation:
  language: en
  yaml_path: translation/ot/judges/012/005.yaml
  text: And Gilead captured the fords of the Jordan against Ephraim. And whenever the fugitives of Ephraim said[a], “Let me cross over,” the men of Gilead would say to him, “Are you an Ephraimite?” If he said, “No,”
translation:
  language: fr
  text: 'Galaad s’empara des gués[a] du Jourdain face à Éphraïm. Chaque fois qu’un fuyard d’Éphraïm disait : « Laissez-moi traverser », les hommes de Galaad lui demandaient : « Es-tu Éphraïmite ? » S’il répondait : « Non »,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « points de passage ». L’hébreu désigne les endroits peu profonds où l’on pouvait traverser le Jourdain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: s’empara de
  rationale: Le verbe לכד exprime ici la prise militaire et le contrôle de points stratégiques. « S’empara de » est naturel en français et conserve cette force.
- source_word: מַעְבְּרוֹת
  choice: gués
  rationale: Le terme désigne les endroits peu profonds permettant de traverser le fleuve. « Gués » est le terme français précis et concis.
- source_word: לְאֶפְרָיִם
  choice: pour barrer le passage à Éphraïm
  rationale: Dans ce contexte hostile, la préposition indique que les gués sont pris contre Éphraïm. Cette formulation explicite naturellement en français la fonction du contrôle des gués sans identifier Galaad à un territoire distinct des hommes qui agissent.
- source_word: וְהָיָה כִּי
  choice: Chaque fois que
  rationale: L’expression introduit une procédure répétée; « Chaque fois que » rend clairement cette valeur itérative.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: un fuyard d’Éphraïm
  rationale: פּליט désigne celui qui s’échappe d’une défaite. Bien que l’hébreu emploie le pluriel collectif, la scène décrit ensuite le traitement de chaque individu; le singulier distributif est naturel en français.
- source_word: אֶעֱבֹרָה
  choice: Laissez-moi traverser
  rationale: Le cohortatif exprime ici une demande de permission. Cette tournure en restitue la valeur avec naturel.
- source_word: הַאֶפְרָתִי
  choice: Éphraïmite
  rationale: Le gentilé porte sur l’appartenance tribale. « Es-tu Éphraïmite ? » est la formulation idiomatique française.
- source_word: וַיֹּאמְרוּ לוֹ ... אַתָּה
  choice: 'lui demandaient : « Es-tu Éphraïmite ? »'
  rationale: Le verbe hébreu signifie littéralement « disaient », mais introduit une question directe. « Demandaient » rend naturellement la fonction de la parole, et l’imparfait maintient son caractère répété.
- source_word: וַיֹּאמֶר לֹא
  choice: 'S’il répondait : « Non »'
  rationale: Dans cette séquence procédurale répétée, la proposition a une valeur conditionnelle. « Répondait » convient mieux qu’un simple « disait » après une question.
