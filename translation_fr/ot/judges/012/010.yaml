  text: Then Ibzan died and was buried in Bethlehem.
translation:
  language: fr
  text: Puis Ibtsân mourut et fut enterré à Bethléem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Puis … mourut
  rationale: Le waw consécutif fait progresser le récit. « Puis » exprime naturellement la succession narrative en français, tandis que « mourut » rend directement le verbe.
- source_word: אִבְצָן
  choice: Ibtsân
  rationale: Le nom propre est translittéré selon une forme française qui reflète les consonnes hébraïques et signale la voyelle finale longue.
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: La forme nifal a ici un sens passif. « Fut enterré » est une formulation claire, courante et adaptée au registre narratif.
- source_word: בְּבֵית לָחֶם
  choice: à Bethléem
  rationale: La préposition ב indique le lieu; avec un nom de ville, le français emploie naturellement « à ». « Bethléem » est la forme française consacrée du toponyme.
