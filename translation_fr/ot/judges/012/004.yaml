source:
  edition: WLC
  text: וַ/יִּקְבֹּ֤ץ יִפְתָּח֙ אֶת כָּל אַנְשֵׁ֣י גִלְעָ֔ד וַ/יִּלָּ֖חֶם אֶת אֶפְרָ֑יִם וַ/יַּכּוּ֩ אַנְשֵׁ֨י גִלְעָ֜ד אֶת אֶפְרַ֗יִם כִּ֤י אָמְרוּ֙ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אַתֶּ֔ם גִּלְעָ֕ד בְּ/ת֥וֹךְ אֶפְרַ֖יִם בְּ/ת֥וֹךְ מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/004.yaml
  text: Then Jephthah gathered all the men of Gilead and fought with Ephraim. And the men of Gilead struck Ephraim down[a], because they had said, “You Gileadites are fugitives of Ephraim, in the midst of Ephraim and in the midst of Manasseh.”
translation:
  language: fr
  text: 'Alors Jephté rassembla tous les hommes de Galaad et combattit Éphraïm. Les hommes de Galaad frappèrent Éphraïm, parce que les Éphraïmites avaient dit : « Vous, Galaadites, vous êtes des fugitifs d’Éphraïm, au milieu d’Éphraïm et au milieu de Manassé. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de l’accusation finale est difficile. Autre traduction possible : « Vous êtes des fugitifs d’Éphraïm, ô Galaad, parmi Éphraïm et parmi Manassé. »'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: rassembla
  rationale: Le verbe קבץ signifie réunir ou rassembler. Dans ce contexte militaire, « rassembla » reste proche de l’hébreu sans préciser à tort qu’il s’agissait d’une levée formelle.
- source_word: כָּל אַנְשֵׁי גִלְעָד
  choice: tous les hommes de Galaad
  rationale: La formulation reproduit le sens direct de l’hébreu et désigne ici les hommes mobilisés pour le combat, sans remplacer le terme par l’interprétation plus étroite « guerriers ».
- source_word: וַיִּלָּחֶם אֶת אֶפְרָיִם
  choice: combattit Éphraïm
  rationale: Le nifal de לחם exprime l’action de combattre. En français, « combattre Éphraïm » est naturel, concis et marque clairement l’affrontement.
- source_word: וַיַּכּוּ
  choice: battirent
  rationale: נכה peut signifier frapper ou défaire dans un contexte militaire. « Battirent » conserve ici à la fois l’idée d’affrontement violent et celle de victoire, sans affirmer que tous furent tués.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit la raison donnée pour l’affrontement ou la défaite. « Parce que » l’exprime clairement en français moderne.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: des fugitifs d’Éphraïm
  rationale: פְּלִיטִים désigne des personnes qui se sont enfuies ou échappées. « Fugitifs » préserve la valeur lexicale et la force méprisante de l’insulte.
- source_word: אַתֶּם גִּלְעָד
  choice: Vous, Galaadites
  rationale: Le nom géographique Galaad désigne collectivement ses habitants. « Galaadites » rend cette métonymie de façon idiomatique, tandis que le pronom détaché conserve l’insistance de אַתֶּם.
- source_word: בְּתוֹךְ אֶפְרַיִם בְּתוֹךְ מְנַשֶּׁה
  choice: au milieu d’Éphraïm et au milieu de Manassé
  rationale: בְּתוֹךְ signifie « au milieu de » ou « parmi ». La répétition est conservée comme dans l’hébreu; « entre » résoudrait trop fortement une relation géographique incertaine.
theological_decisions:
- issue: Syntaxe difficile de l’insulte finale
  choice: « Vous, Galaadites, vous êtes des fugitifs d’Éphraïm, au milieu d’Éphraïm et au milieu de Manassé. »
  alternative: « Vous êtes des fugitifs d’Éphraïm, ô Galaad, parmi Éphraïm et parmi Manassé. »
  rationale: L’hébreu est comprimé et syntaxiquement difficile. Le texte principal préserve la parole directe, le sens de פְּלִיטֵי et la répétition de בְּתוֹךְ, sans transformer l’insulte en explication historique. La note signale une autre construction possible.
translation_notes:
  register: 'Français international moderne, narratif et digne. Les noms propres suivent les formes françaises bibliques usuelles : Jephté, Galaad, Éphraïm et Manassé. La syntaxe de l’insulte reste volontairement proche et légèrement heurtée afin de ne pas effacer l’ambiguïté de l’hébreu.'
