  text: After him, Elon the Zebulunite judged Israel ten years.
translation:
  language: fr
  text: Après lui, Élôn le Zabulonite jugea Israël. Il jugea Israël pendant dix ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: jugea
  rationale: Le verbe « juger » conserve le terme récurrent qui caractérise la fonction des juges dans le livre, sans la réduire à une activité militaire ou administrative.
- source_word: אַחֲרָיו
  choice: Après lui
  rationale: Cette traduction garde la référence pronominale au juge précédent sans expliciter son nom, absent de ce verset.
- source_word: אֵילוֹן
  choice: Élôn
  rationale: Translittération française du nom propre hébreu, avec accent circonflexe pour signaler la voyelle longue.
- source_word: הַזְּבוּלֹנִי
  choice: le Zabulonite
  rationale: Le gentilé hébreu indique l’appartenance tribale d’Élôn; « le Zabulonite » la rend directement et dans un registre biblique clair.
- source_word: עֶשֶׂר שָׁנִים
  choice: pendant dix ans
  rationale: Formulation française naturelle pour exprimer la durée de son activité.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל ... וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: jugea Israël. Il jugea Israël
  rationale: La répétition du verbe et de son complément reproduit la structure du texte hébreu, d’abord pour présenter Élôn, puis pour préciser la durée de son activité.
