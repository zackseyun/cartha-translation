base_translation:
  language: en
  yaml_path: translation/ot/judges/012/015.yaml
  text: And Abdon son of Hillel the Pirathonite died[a], and he was buried in Pirathon, in the land of Ephraim, in the hill country of the Amalekites.
translation:
  language: fr
  text: Abdon, fils de Hillel, le Pirathonite, mourut. Il fut enterré à Pirathon, dans le pays d’Éphraïm, dans la région montagneuse des Amalécites[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « dans la montagne de l’Amalécite ». En hébreu, le gentilé est au singulier, probablement avec un sens collectif ou territorial.'
    reason: Préserver la forme singulière et l’ambiguïté géographique de l’expression hébraïque.
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le verbe מות désigne directement la mort. « Mourut » est sobre, clair et sans euphémisme.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Transcription française traditionnelle du nom propre.
- source_word: בֶּן הִלֵּל
  choice: fils de Hillel
  rationale: Rend directement la relation de filiation exprimée par la construction hébraïque.
- source_word: הַפִּרְעָתוֹנִי
  choice: le Pirathonite
  rationale: Le gentilé défini désigne Abdon d’après son lieu d’origine; cette forme concise est naturelle dans le registre biblique français.
- source_word: וַיִּקָּבֵר
  choice: Il fut enterré
  rationale: Le nifal de קבר exprime ici le passif. Une nouvelle phrase allège l’enchaînement tout en conservant la succession narrative.
- source_word: בְּפִרְעָתוֹן
  choice: à Pirathon
  rationale: En français, la préposition « à » convient naturellement à un nom de ville.
- source_word: בְּאֶרֶץ אֶפְרַיִם
  choice: dans le pays d’Éphraïm
  rationale: Conserve le nom אֶרֶץ et son sens géographique sans réduire l’expression au seul nom tribal.
- source_word: בְּהַר הָעֲמָלֵקִי
  choice: dans la région montagneuse des Amalécites
  rationale: Dans une indication régionale, הַר peut désigner une zone montagneuse. Le gentilé singulier peut avoir une valeur collective ou territoriale, rendue naturellement au pluriel en français.
