base_translation:
  language: en
  yaml_path: translation/ot/judges/012/009.yaml
  text: He had thirty sons[a], and thirty daughters he sent away, and he brought in thirty daughters from outside for his sons. And he judged Israel seven years.
translation:
  language: fr
  text: Il avait trente fils et trente filles. Il envoya ses trente filles à l’extérieur[a] et fit venir de l’extérieur trente jeunes femmes pour ses fils. Il jugea Israël pendant sept ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il envoya dehors ses trente filles ». Le contexte évoque vraisemblablement leur mariage hors de sa famille ou de son clan. L’hébreu emploie le mot « filles » dans les deux propositions.'
    reason: Préserve le sens littéral de « envoyer dehors » dans le texte principal tout en signalant le contexte matrimonial probable et l’emploi répété de « filles » en hébreu.
lexical_decisions:
- source_word: וַיְהִי לוֹ שְׁלֹשִׁים בָּנִים
  choice: Il eut trente fils
  rationale: L’expression היה + ל marque la possession. « Il eut » est naturel dans un récit et rend fidèlement l’hébreu.
- source_word: וּשְׁלֹשִׁים בָּנוֹת שִׁלַּח הַחוּצָה
  choice: Il maria ses trente filles à l’extérieur
  rationale: Littéralement, le texte dit qu’il « envoya dehors » trente filles. En parallèle avec les femmes amenées pour ses fils, il s’agit manifestement d’alliances matrimoniales; la note conserve la formulation littérale et l’ambiguïté sur ce que désigne précisément « l’extérieur ».
- source_word: וּשְׁלֹשִׁים בָּנוֹת הֵבִיא לְבָנָיו מִן הַחוּץ
  choice: et fit venir de l’extérieur trente jeunes femmes pour ses fils
  rationale: בָּנוֹת signifie littéralement « filles », mais désigne ici naturellement de jeunes femmes destinées aux fils. « Pour ses fils » préserve l’implicite matrimonial sans ajouter le terme « épouses », absent du texte.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: Il jugea Israël
  rationale: « Juger » conserve le terme récurrent du livre pour la fonction exercée par les juges, plutôt que de le réduire à « diriger » ou « gouverner ».
- source_word: שֶׁבַע שָׁנִים
  choice: pendant sept ans
  rationale: La préposition « pendant » exprime naturellement en français la durée indiquée par l’hébreu.
theological_decisions:
- issue: Nature de « l’extérieur » dans les alliances matrimoniales
  choice: Conserver « à/de l’extérieur » sans préciser davantage
  alternative: « hors de son clan » ou « hors de sa famille »
  rationale: Le contexte suggère des mariages au-delà du groupe familial ou clanique, mais הַחוּץ ne nomme pas explicitement ce groupe. La traduction évite donc une précision incertaine.
translation_notes:
  register: Français international moderne, narratif et digne. Le parallélisme matrimonial est rendu clairement, tout en maintenant en note la lettre de l’hébreu et son imprécision géographique ou sociale.
