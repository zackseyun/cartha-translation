base_translation:
  language: en
  yaml_path: translation/ot/judges/006/033.yaml
  text: Then all Midian and Amalek and the people of the East gathered together[a], crossed over, and camped in the Valley of Jezreel.
translation:
  language: fr
  text: Alors tout Madian, Amalec et les peuples de l’Orient[a] se rassemblèrent, passèrent et établirent leur camp dans la vallée de Jizréel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de l’Orient », expression désignant les peuples vivant à l’est.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מִדְיָן
  choice: tout Madian
  rationale: L’hébreu emploie le nom « Madian » collectivement. « Tout Madian » conserve cette forme et reste intelligible en français narratif.
- source_word: וַ/עֲמָלֵק
  choice: Amalec
  rationale: Le nom ethnique fonctionne collectivement en hébreu. Le maintien d’« Amalec » évite d’expliciter davantage que le texte source.
- source_word: וּ/בְנֵי קֶדֶם
  choice: les peuples de l’Orient
  rationale: Littéralement « les fils de l’Orient », expression hébraïque désignant les populations ou tribus vivant à l’est. Cette formulation est naturelle en français moderne.
- source_word: נֶאֶסְפוּ יַחְדָּו
  choice: se rassemblèrent
  rationale: Le nifal de אסף accompagné de יחדו exprime ici un rassemblement commun. Le verbe pronominal français restitue naturellement cette idée sans redondance.
- source_word: וַ/יַּעַבְרוּ
  choice: Ils traversèrent
  rationale: עבר signifie « traverser, passer de l’autre côté ». Comme en hébreu, ce qui est traversé demeure implicite.
- source_word: וַֽ/יַּחֲנוּ
  choice: établirent leur camp
  rationale: חנה désigne l’installation d’un camp, notamment dans un contexte militaire. Cette tournure est claire et digne en français courant.
- source_word: בְּ/עֵמֶק יִזְרְעֶאל
  choice: dans la vallée de Jizréel
  rationale: עמק désigne une vallée ou une plaine encaissée. « Vallée de Jizréel » est la désignation géographique française usuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les ethnonymes « Madian » et « Amalec » sont conservés comme collectifs, conformément à l’hébreu. Une nouvelle phrase avant le déplacement militaire améliore la lisibilité sans modifier la succession des actions.
