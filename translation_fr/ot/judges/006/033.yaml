  rationale: La seule révision remplace « traversèrent » par « passèrent » et réunit les actions coordonnées dans une même phrase. Elle améliore l’idiomaticité française sans ajouter d’objet au verbe ni modifier le sens, l’ambiguïté ou la progression du texte hébreu.
