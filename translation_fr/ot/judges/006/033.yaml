    issue: « Ils traversèrent » est employé sans complément.
    rationale: En français moderne, « traverser » appelle normalement un objet (« traverser un fleuve », « traverser la région »). L’hébreu ne précise pas ce qui est franchi ; « passèrent » conserve cette absence de précision tout en étant idiomatique.
  revised_text: Alors tout Madian, Amalec et les peuples de l’Orient[a] se rassemblèrent, passèrent et établirent leur camp dans la vallée de Jizréel.
