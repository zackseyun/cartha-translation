  text: הִנֵּ֣ה אָנֹכִ֗י מַצִּ֛יג אֶת גִּזַּ֥ת הַ/צֶּ֖מֶר בַּ/גֹּ֑רֶן אִ֡ם טַל֩ יִהְיֶ֨ה עַֽל הַ/גִּזָּ֜ה לְ/בַדָּ֗/הּ וְ/עַל כָּל הָ/אָ֨רֶץ֙ חֹ֔רֶב וְ/יָדַעְתִּ֗י כִּֽי תוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/037.yaml
  text: Look[a], I am placing a fleece of wool on the threshing floor. If there is dew on the fleece alone, and dryness on all the ground, then I will know that you will save Israel by my hand, just as you have spoken.
translation:
  language: fr
  text: Voici, je place une toison de laine sur l’aire de battage. S’il y a de la rosée sur la toison seule et que tout le sol reste sec[a], alors je saurai que tu sauveras Israël par ma main, comme tu l’as dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la terre reste sèche » ou « tout le pays reste sec ». Le mot hébreu peut désigner le sol à proximité, le pays ou la terre au sens large ; ici, il s’agit probablement du sol environnant dans le cadre du signe.
    reason: alternative lexicale
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la force déictique qui attire l’attention, dans un registre biblique encore naturel en français moderne.
- source_word: מַצִּיג
  choice: je place
  rationale: Le participe accompagné du pronom אָנֹכִי présente une action actuelle ou imminente; « je place » est concret et idiomatique.
- source_word: גִּזַּת הַצֶּמֶר
  choice: une toison de laine
  rationale: Rend explicitement le groupe construit hébreu tout en employant l’expression française naturelle.
- source_word: בַּגֹּרֶן
  choice: sur l’aire de battage
  rationale: Désigne la surface préparée où l’on battait les céréales; la préposition « sur » convient à l’objet qu’on y dépose.
- source_word: טַל יִהְיֶה
  choice: il y a de la rosée
  rationale: Reproduit la construction existentielle sans préciser indûment que la rosée tombe.
- source_word: עַל הַגִּזָּה לְבַדָּהּ
  choice: sur la toison seule
  rationale: Préserve l’insistance de לְבַדָּהּ sur l’exclusivité du signe.
- source_word: וְעַל כָּל הָאָרֶץ חֹרֶב
  choice: tandis que tout le sol reste sec
  rationale: « Sol » convient au cadre local de l’aire; la formulation française exprime naturellement le contraste et l’état de sécheresse.
- source_word: וְיָדַעְתִּי
  choice: je saurai alors
  rationale: Le futur français et « alors » rendent la conséquence attendue de la condition.
- source_word: כִּי תוֹשִׁיעַ
  choice: que tu sauveras
  rationale: Le hiphil de יָשַׁע exprime ici l’action de sauver ou délivrer; « sauver » reste direct et concordant avec le contexte.
- source_word: בְּיָדִי
  choice: par ma main
  rationale: Maintient l’image hébraïque de la main comme moyen ou agent, compréhensible en français biblique.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: comme tu l’as dit
  rationale: Rend le verbe « parler/dire » sans renforcer le texte en « promettre ».
theological_decisions:
- issue: Portée de הָאָרֶץ dans le signe demandé par Gédéon
  choice: le sol
  alternative: le pays ou la terre
  rationale: Le contraste immédiat oppose la toison à la surface environnante. « Le sol » respecte ce cadre local sans imposer une portée universelle ou nationale, tandis qu’une note conserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » et « par ma main » conservent la couleur du texte biblique sans archaïsme excessif; la syntaxe reste fluide à l’oral comme à l’écrit.
