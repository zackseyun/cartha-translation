  text: כִּ֡י הֵם֩ וּ/מִקְנֵי/הֶ֨ם יַעֲל֜וּ וְ/אָהֳלֵי/הֶ֗ם יבאו כְ/דֵֽי אַרְבֶּה֙ לָ/רֹ֔ב וְ/לָ/הֶ֥ם וְ/לִ/גְמַלֵּי/הֶ֖ם אֵ֣ין מִסְפָּ֑ר וַ/יָּבֹ֥אוּ בָ/אָ֖רֶץ לְ/שַׁחֲתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/005.yaml
  text: For they and their livestock would come up[a], and their tents would come like locusts in multitude; both they and their camels were without number[c][b], and they came into the land to destroy it.
translation:
  language: fr
  text: Car ils montaient avec leurs troupeaux et leurs tentes, aussi nombreux que des sauterelles[a]. Eux et leurs chameaux étaient innombrables. Ils entraient dans le pays pour le ravager[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «comme des nuées de sauterelles».
    reason: lexical_alternative
  - marker: b
    text: Ou «pour le détruire».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’appauvrissement d’Israël décrit au verset précédent.
- source_word: הֵם וּמִקְנֵיהֶם יַעֲלוּ
  choice: ils montaient avec leurs troupeaux
  rationale: L’imparfait français rend l’action répétée dans le passé; la tournure avec «avec» exprime naturellement le déplacement conjoint des envahisseurs et de leur bétail.
- source_word: וְאָהֳלֵיהֶם יָבֹאוּ
  choice: et leurs tentes
  rationale: La coordination avec la proposition précédente conserve les tentes dans l’énumération tout en évitant en français l’expression peu naturelle «leurs tentes venaient»; les tentes représentent le campement mobile.
- source_word: כְדֵי אַרְבֶּה לָרֹב
  choice: aussi nombreux que des sauterelles
  rationale: Rend clairement la comparaison quantitative exprimée par l’hébreu; le référent englobe les envahisseurs, leurs troupeaux et leurs campements.
- source_word: וְלָהֶם וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: Eux et leurs chameaux étaient innombrables
  rationale: Préserve l’accent mis sur le nombre incalculable des hommes comme des chameaux, dans une formulation française naturelle.
- source_word: וַיָּבֹאוּ בָאָרֶץ
  choice: Ils entraient dans le pays
  rationale: L’imparfait maintient ici la valeur répétitive de la scène décrite, tandis que «entrer dans» rend naturellement le mouvement vers l’intérieur du territoire.
- source_word: לְשַׁחֲתָהּ
  choice: pour le ravager
  rationale: Dans ce contexte d’incursions qui détruisent les ressources du pays, «ravager» exprime précisément l’effet visé sans nécessairement impliquer l’anéantissement absolu.
