  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל יוֹאָ֔שׁ הוֹצֵ֥א אֶת בִּנְ/ךָ֖ וְ/יָמֹ֑ת כִּ֤י נָתַץ֙ אֶת מִזְבַּ֣ח הַ/בַּ֔עַל וְ/כִ֥י כָרַ֖ת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/030.yaml
  text: Then the men of the city said to Joash[a], “Bring out your son, that he may die, because he has torn down the altar of Baal and cut down the Asherah that was beside it.”
translation:
  language: fr
  text: 'Les hommes de la ville dirent à Joas : « Fais sortir ton fils, et qu’il meure, car il a démoli l’autel de Baal et abattu l’ashéra[a] qui se trouvait à côté de l’autel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le poteau d’Ashéra ». Le terme hébreu peut désigner l’objet cultuel associé à la déesse Ashéra ; ici, le contexte indique qu’il s’agit de l’objet plutôt que de la déesse elle-même.
    reason: Alternative lexicale préservant l’ambiguïté du terme hébreu.
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: les hommes de la ville
  rationale: La formulation conserve le masculin explicite de l’hébreu et désigne vraisemblablement les hommes de la communauté urbaine.
- source_word: הוֹצֵא
  choice: Fais sortir
  rationale: L’impératif causatif de יצא demande à Joas de faire venir son fils au-dehors; cette formulation est naturelle et précise en français.
- source_word: וְיָמֹת
  choice: et qu’il meure
  rationale: Le waw suivi du jussif exprime le résultat exigé après l’impératif, sans préciser davantage le mode d’exécution.
- source_word: נָתַץ
  choice: a démoli
  rationale: נתץ décrit la destruction d’une construction; « démolir » convient naturellement à un autel.
- source_word: מִזְבַּח הַבַּעַל
  choice: l’autel de Baal
  rationale: Cette formulation rend directement la relation construite de l’hébreu.
- source_word: כָרַת
  choice: abattu
  rationale: Le verbe כרת signifie ici couper et faire tomber un objet cultuel en bois; « abattre » convient sans imposer sa forme exacte.
- source_word: הָאֲשֵׁרָה
  choice: l’ashéra
  rationale: La translittération préserve le terme hébreu, qui peut désigner l’objet cultuel associé à Ashéra, sans le réduire nécessairement à un simple poteau ni l’identifier à la déesse elle-même.
- source_word: אֲשֶׁר עָלָיו
  choice: qui se trouvait à côté de l’autel
  rationale: Dans ce contexte, על indique probablement la proximité ou l’association spatiale. La répétition de « l’autel » évite une ambiguïté pronominale peu naturelle en français.
theological_decisions:
- issue: Sens de אֲשֵׁרָה dans ce contexte cultuel
  choice: l’ashéra
  alternative: le poteau d’Ashéra; la déesse Ashéra
  rationale: Le verbe « abattre » indique qu’il s’agit ici d’un objet cultuel, mais le terme hébreu ne précise pas exactement sa forme. La translittération conserve cette tension, et une note présente l’interprétation courante.
- issue: Force de וְיָמֹת
  choice: et qu’il meure
  alternative: afin qu’il meure; qu’il soit mis à mort
  rationale: Cette tournure conserve l’enchaînement impératif-jussif et la demande de mort, sans introduire une procédure judiciaire que l’hébreu n’énonce pas explicitement.
translation_notes:
  register: Français international moderne, digne et accessible. « Joas » et « Baal » suivent les formes françaises bibliques usuelles. La syntaxe directe conserve la vigueur de la demande des hommes de la ville.
