  text: וַ/יֹּ֤אמֶר גִּדְעוֹן֙ אֶל הָ֣/אֱלֹהִ֔ים אַל יִ֤חַר אַפְּ/ךָ֙ בִּ֔/י וַ/אֲדַבְּרָ֖ה אַ֣ךְ הַ/פָּ֑עַם אֲנַסֶּ֤ה נָּא רַק הַ/פַּ֨עַם֙ בַּ/גִּזָּ֔ה יְהִי נָ֨א חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ יִֽהְיֶה טָּֽל־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/039.yaml
  text: 'Then Gideon said to God[a], “Do not let your anger burn against me, and let me speak just this once. Please let me test just this once with the fleece: let there be dryness on the fleece alone[c][b], and on all the ground let there be dew.”'
translation:
  language: fr
  text: 'Alors Gédéon dit à Dieu : « Que ta colère ne s’enflamme pas contre moi ; laisse-moi parler encore une seule fois. Je t’en prie, laisse-moi faire cette seule épreuve avec la toison : que seule la toison soit sèche[a], et qu’il y ait de la rosée sur tout le sol[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’il y ait de la sécheresse sur la toison seule ».'
    reason: La note signale la formulation concrète du texte hébreu, rendue plus naturellement dans le corps du verset.
  - marker: b
    text: Le mot hébreu peut aussi signifier « terre » ou « pays » ; ici, il désigne le sol autour de la toison.
    reason: La note préserve l’étendue sémantique de הָאָרֶץ tout en justifiant son sens local dans ce contexte.
lexical_decisions:
- source_word: אַל יִחַר אַפְּךָ בִּי
  choice: Que ta colère ne s’enflamme pas contre moi
  rationale: Conserve l’image hébraïque de la colère qui brûle tout en employant une tournure française naturelle et digne.
- source_word: וַאֲדַבְּרָה אַךְ הַפָּעַם
  choice: et laisse-moi parler encore cette fois seulement
  rationale: Le cohortatif est rendu comme une demande respectueuse, tandis que la restriction אַךְ הַפָּעַם souligne qu’il s’agit d’une ultime prise de parole.
- source_word: אֲנַסֶּה נָּא רַק הַפַּעַם בַּגִּזָּה
  choice: Je t’en prie, permets-moi de faire une épreuve encore cette fois avec la toison
  rationale: נסה exprime bien l’idée de mettre à l’épreuve ou d’essayer. « Faire une épreuve » garde la tension du texte sans préciser abusivement si Gédéon éprouve Dieu ou vérifie le signe au moyen de la toison.
- source_word: יְהִי נָא חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: que seule la toison reste sèche
  rationale: Cette formulation idiomatique exprime clairement que la sécheresse doit se limiter à la toison. Le verbe « reste » convient à l’opposition implicite avec la rosée environnante sans transformer חֹרֶב en sécheresse climatique.
- source_word: וְעַל כָּל הָאָרֶץ יִהְיֶה טָּל
  choice: et qu’il y ait de la rosée sur tout le sol
  rationale: Dans le contraste local avec la toison, הָאָרֶץ désigne le sol environnant plutôt que la terre entière.
theological_decisions:
- issue: La demande répétée de Gédéon et la mise à l’épreuve
  choice: Présenter une demande prudente pour une dernière épreuve au moyen de la toison, sans porter de jugement explicite.
  alternative: Accentuer soit la présomption de Gédéon mettant Dieu à l’épreuve, soit son humble recherche d’une confirmation.
  rationale: Le texte associe la crainte de la colère divine à une nouvelle demande d’épreuve. La traduction conserve cette tension et n’ajoute ni approbation ni condamnation.
translation_notes:
  register: Français international moderne, courant et digne. La répétition « encore cette fois » est maintenue afin de refléter l’insistance de l’hébreu. Le tutoiement correspond à l’adresse directe à Dieu et à l’usage biblique français courant.
