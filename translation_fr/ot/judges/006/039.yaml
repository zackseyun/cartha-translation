    rationale: La séquence répétée « encore cette fois seulement » est maladroite en français et ne restitue pas avec fluidité l’insistance des deux expressions hébraïques de limitation.
  - severity: low
    issue: Nuance aspectuelle de « reste sèche »
    rationale: Le jussif hébreu demande qu’il y ait de la sécheresse sur la toison ; « reste » peut impliquer qu’elle était déjà sèche. « Soit sèche » est plus neutre et plus proche du texte.
