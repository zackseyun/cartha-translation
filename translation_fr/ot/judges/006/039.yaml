- from: 'Alors Gédéon dit à Dieu : « Que ta colère ne s’enflamme pas contre moi, et laisse-moi parler encore cette fois seulement. Je t’en prie, permets-moi de faire une épreuve encore cette fois avec la toison : que seule la toison reste sèche[a], et qu’il y ait de la rosée sur tout le sol[b]. »'
  to: 'Alors Gédéon dit à Dieu : « Que ta colère ne s’enflamme pas contre moi ; laisse-moi parler encore une seule fois. Je t’en prie, laisse-moi faire cette seule épreuve avec la toison : que seule la toison soit sèche[a], et qu’il y ait de la rosée sur tout le sol[b]. »'
  rationale: La révision améliore la fluidité et rend plus clairement, par deux formulations parallèles (« encore une seule fois » / « cette seule épreuve »), la répétition restrictive de l’hébreu. Elle évite aussi l’implication aspectuelle non nécessaire de « reste sèche », tout en conservant les ancres et le contenu des notes.
