  text: וַ/יְהִי כֵ֕ן וַ/יַּשְׁכֵּם֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֖זַר אֶת הַ/גִּזָּ֑ה וַ/יִּ֤מֶץ טַל֙ מִן הַ/גִּזָּ֔ה מְל֥וֹא הַ/סֵּ֖פֶל מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/038.yaml
  text: And it was so. He rose early the next day and squeezed the fleece[a], wringing dew from the fleece—a bowlful of water.
translation:
  language: fr
  text: 'Et il en fut ainsi. Le lendemain, Gédéon se leva de bon matin. Il pressa la toison[a] et en exprima la rosée : de quoi remplir un bol d’eau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « essora la toison ». L’hébreu emploie deux verbes successifs pour décrire la pression exercée sur la toison et l’extraction de la rosée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֵן
  choice: Et il en fut ainsi
  rationale: Formule narrative naturelle et digne qui confirme que le signe demandé s’est produit, tout en restant proche de l’hébreu.
- source_word: וַיַּשְׁכֵּם מִמָּחֳרָת
  choice: Le lendemain, Gédéon se leva de bon matin
  rationale: « Se leva de bon matin » rend l’idée de se lever tôt, tandis que « le lendemain » traduit clairement le jour suivant. Le nom explicite le sujet implicite en français pour la clarté narrative.
- source_word: וַיָּזַר אֶת־הַגִּזָּה
  choice: Il pressa la toison
  rationale: « Presser » exprime la compression de la toison sans anticiper entièrement l’extraction du liquide décrite par le verbe suivant.
- source_word: וַיִּמֶץ טַל מִן־הַגִּזָּה
  choice: et en exprima la rosée
  rationale: « Exprimer » signifie faire sortir un liquide par pression et permet de rendre distinctement le second verbe hébreu; le pronom « en » reprend naturellement la toison.
- source_word: מְלֹא הַסֵּפֶל מָיִם
  choice: de quoi remplir un bol d’eau
  rationale: Cette tournure française idiomatique conserve la valeur quantitative de l’expression hébraïque, c’est-à-dire une quantité d’eau suffisante pour remplir le récipient.
- source_word: הַסֵּפֶל
  choice: bol
  rationale: « Bol » est un terme courant et neutre pour ce récipient; « coupe » suggérerait un contenant plus petit et « bassin » risquerait d’en exagérer la taille.
