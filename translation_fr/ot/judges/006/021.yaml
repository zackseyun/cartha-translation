revisions:
- from: Alors l’ange de Yahweh[a] tendit l’extrémité du bâton qu’il tenait à la main et toucha la viande[b] et les pains sans levain. Un feu jaillit du rocher et consuma la viande et les pains sans levain. Puis l’ange de Yahweh disparut à ses yeux[c].
  to: Alors l’ange de Yahweh[a] tendit l’extrémité du bâton qu’il tenait à la main et toucha la viande[b] et les pains sans levain. Le feu monta du rocher et consuma la viande et les pains sans levain. Puis l’ange de Yahweh s’éloigna de sa vue[c].
  rationale: La révision conserve les choix lexicaux solides du projet tout en évitant de surinterpréter le départ de l’ange. Elle rend aussi le mouvement du feu par un équivalent plus proche du verbe hébreu et met la note c en conformité avec le littéral.
