base_translation:
  language: en
  yaml_path: translation/ot/judges/006/021.yaml
  text: Then the angel of Yahweh reached out the tip of the staff that was in his hand and touched the meat and the unleavened bread[a]. And fire went up from the rock and consumed the meat and the unleavened bread[c][b]. Then the angel of Yahweh went away from his sight.
translation:
  language: fr
  text: Alors l’ange de Yahweh[a] tendit l’extrémité du bâton qu’il tenait à la main et toucha la viande[b] et les pains sans levain. Le feu monta du rocher et consuma la viande et les pains sans levain. Puis l’ange de Yahweh s’éloigna de sa vue[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la chair » ; il s’agit ici de la viande préparée pour l’offrande.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « s’en alla de ses yeux », c’est-à-dire qu’il ne fut plus visible pour Gédéon.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut désigner un messager ou un ange. Le caractère surnaturel de la scène favorise « ange », tandis que la construction hébraïque avec le nom divin est conservée.
- source_word: קְצֵה הַמִּשְׁעֶנֶת
  choice: l’extrémité du bâton
  rationale: קָצֶה désigne l’extrémité, et מִשְׁעֶנֶת un bâton servant d’appui. Cette formulation reste concrète et naturelle en français.
- source_word: וַיִּשְׁלַח
  choice: tendit
  rationale: Avec « l’extrémité du bâton » comme complément, le verbe décrit le geste d’étendre le bâton, non l’idée de l’envoyer.
- source_word: בָּשָׂר
  choice: la viande
  rationale: Bien que le mot puisse signifier « chair », il désigne ici la viande préparée par Gédéon.
- source_word: מַצּוֹת
  choice: les pains sans levain
  rationale: Le pluriel hébreu désigne les aliments préparés sans levain. « Pains sans levain » est clair et courant.
- source_word: וַתַּעַל הָאֵשׁ מִן הַצּוּר
  choice: Un feu jaillit du rocher
  rationale: Le feu monte depuis le rocher. « Jaillit » exprime naturellement cette apparition ascendante en français sans préciser une cause absente du texte.
- source_word: וַתֹּאכַל
  choice: consuma
  rationale: Le sens littéral est « mangea », mais « consumer » est l’expression française normale pour l’action du feu.
- source_word: הָלַךְ מֵעֵינָיו
  choice: disparut à ses yeux
  rationale: L’expression signifie littéralement qu’il « alla loin de ses yeux », c’est-à-dire qu’il cessa d’être visible. La note conserve le tour concret de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Identité et fonction de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: « Ange » convient au caractère surnaturel du personnage dans cette scène, mais la note maintient l’ambivalence lexicale de מַלְאָךְ sans trancher davantage son identité théologique.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsmes marqués. Les gestes et la succession rapide des événements restent nets, et les notes préservent les principales nuances lexicales de l’hébreu.
