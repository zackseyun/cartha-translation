  text: אַל נָ֨א תָמֻ֤שׁ מִ/זֶּה֙ עַד בֹּאִ֣/י אֵלֶ֔י/ךָ וְ/הֹֽצֵאתִי֙ אֶת מִנְחָתִ֔/י וְ/הִנַּחְתִּ֖י לְ/פָנֶ֑י/ךָ וַ/יֹּאמַ֕ר אָנֹכִ֥י אֵשֵׁ֖ב עַ֥ד שׁוּבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/018.yaml
  text: Please do not depart from here until I come to you and bring out my offering and set it before you." And he said[a], "I will stay until you return.
translation:
  language: fr
  text: '« Je t’en prie, ne pars pas d’ici jusqu’à ce que je revienne auprès de toi, que j’apporte mon offrande[a] et que je la dépose devant toi. » Il répondit : « Je resterai jusqu’à ton retour. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon présent » ou « mon tribut » ; le terme hébreu peut désigner de manière générale un don présenté à quelqu’un et, dans certains contextes, une offrande.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמֻשׁ מִזֶּה
  choice: ne pars pas d’ici
  rationale: Le verbe מוש exprime ici le fait de quitter l’endroit. « Ne pars pas d’ici » est naturel en français moderne et rend clairement la demande faite au visiteur de rester sur place.
- source_word: נָא
  choice: Je t’en prie
  rationale: La particule marque une supplication polie. « Je t’en prie » conserve cette nuance dans un registre courant et digne.
- source_word: עַד בֹּאִי אֵלֶיךָ
  choice: avant que je revienne auprès de toi
  rationale: La construction signifie littéralement « jusqu’à ce que je vienne vers toi ». Puisque Gédéon s’apprête à s’absenter, « revienne auprès de toi » explicite naturellement le mouvement impliqué par le contexte sans en modifier le sens.
- source_word: וְהוֹצֵאתִי
  choice: que j’apporte
  rationale: Le hiphil de יצא désigne ici le fait de faire sortir puis d’apporter ce que Gédéon va préparer. « Apporter » est idiomatique dans ce contexte.
- source_word: מִנְחָתִי
  choice: mon offrande
  rationale: מִנְחָה peut désigner un présent, un tribut ou une offrande. « Offrande » conserve la résonance religieuse que prend la scène sans réduire le terme à une offrande céréalière formelle.
- source_word: וְהִנַּחְתִּי לְפָנֶיךָ
  choice: que je la dépose devant toi
  rationale: Cette formulation rend directement l’action de placer la chose en présence du destinataire, dans un français naturel et solennel sans archaïsme.
- source_word: אָנֹכִי אֵשֵׁב
  choice: Je resterai
  rationale: Bien que ישב puisse littéralement signifier « s’asseoir », il exprime ici le fait de demeurer sur place. « Je resterai » communique clairement ce sens.
- source_word: עַד שׁוּבֶךָ
  choice: jusqu’à ton retour
  rationale: L’infinitif construit avec suffixe est rendu naturellement en français par le groupe nominal « ton retour ».
theological_decisions:
- issue: Sens de מִנְחָה dans ce que Gédéon présente
  choice: offrande
  alternative: présent ; tribut ; offrande de céréales
  rationale: Le terme hébreu désigne largement ce qui est présenté à quelqu’un. Le récit lui donne une portée religieuse, mais ne justifie pas encore de préciser qu’il s’agit d’une catégorie sacrificielle particulière. « Offrande » préserve cette tension, tandis que la note signale les autres sens possibles.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond aux formes hébraïques singulières. La syntaxe coordonnée conserve la progression de la demande de Gédéon, tandis que la ponctuation distingue nettement les deux locuteurs.
