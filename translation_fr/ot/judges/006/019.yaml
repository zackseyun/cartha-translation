  text: וְ/גִדְע֣וֹן בָּ֗א וַ/יַּ֤עַשׂ גְּדִֽי עִזִּים֙ וְ/אֵיפַת קֶ֣מַח מַצּ֔וֹת הַ/בָּשָׂר֙ שָׂ֣ם בַּ/סַּ֔ל וְ/הַ/מָּרַ֖ק שָׂ֣ם בַּ/פָּר֑וּר וַ/יּוֹצֵ֥א אֵלָ֛י/ו אֶל תַּ֥חַת הָ/אֵלָ֖ה וַ/יַּגַּֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/019.yaml
  text: Then Gideon went in and prepared a young goat and unleavened bread from an ephah of flour[a]. He put the meat in a basket and the broth in a pot[b], and brought them out to him under the terebinth and presented them.
translation:
  language: fr
  text: Gédéon rentra et prépara un chevreau ainsi que des pains sans levain avec un épha de farine[a]. Il mit la viande dans un panier et le bouillon dans un pot, puis apporta le tout à l’homme sous le térébinthe[b] et le lui présenta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un épha était une ancienne mesure de capacité pour les matières sèches, d’environ vingt litres ; sa valeur exacte est incertaine.
    reason: historical_measure
  - marker: b
    text: Ou « sous le chêne ». Le mot hébreu désigne probablement un térébinthe, mais il est traditionnellement rendu par « chêne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: rentra
  rationale: Dans le contexte, Gédéon quitte son visiteur pour aller préparer le repas. « Rentra » exprime naturellement ce mouvement vers son habitation ou son lieu de préparation.
- source_word: וַיַּעַשׂ
  choice: prépara
  rationale: Dans un contexte culinaire, « prépara » rend le sens idiomatique du verbe sans le limiter davantage.
- source_word: גְּדִי עִזִּים
  choice: un chevreau
  rationale: Le syntagme désigne le petit d’une chèvre ; « chevreau » est précis et naturel en français moderne.
- source_word: אֵיפַת קֶמַח
  choice: un épha de farine
  rationale: Le texte nomme une mesure déterminée. Le terme « épha » conserve cette précision historique, avec une note explicative pour le lecteur moderne.
- source_word: מַצּוֹת
  choice: des pains sans levain
  rationale: Cette expression courante indique clairement qu’il s’agit de pains préparés sans levain, sans imposer une forme précise aux pains.
- source_word: הַבָּשָׂר
  choice: la viande
  rationale: Dans ce contexte alimentaire, « viande » est l’équivalent français naturel de בָּשָׂר.
- source_word: סַּל
  choice: un panier
  rationale: « Panier » est le sens courant et adéquat du récipient mentionné.
- source_word: הַמָּרַק
  choice: le bouillon
  rationale: Le mot désigne le liquide de cuisson ; « bouillon » convient mieux ici que « soupe » ou « jus ».
- source_word: פָּרוּר
  choice: un pot
  rationale: Le terme désigne un récipient pouvant contenir le bouillon. « Pot » reste simple et proche de la formulation hébraïque.
- source_word: וַיּוֹצֵא אֵלָיו
  choice: apporta le tout à l’homme
  rationale: Le verbe hébreu est au singulier et son objet n’est pas exprimé. « Le tout » reprend collectivement la viande et le bouillon, tandis que « à l’homme » clarifie naturellement le référent du pronom masculin.
- source_word: תַּחַת הָאֵלָה
  choice: sous le térébinthe
  rationale: אֵלָה désigne vraisemblablement un térébinthe, même si « chêne » appartient à une tradition de traduction ancienne.
- source_word: וַיַּגַּשׁ
  choice: le lui présenta
  rationale: Le verbe signifie faire approcher ou présenter. Cette formulation convient au geste d’hospitalité sans en faire explicitement un sacrifice.
theological_decisions:
- issue: Éventuelle portée sacrificielle du geste de Gédéon
  choice: Employer le langage de l’hospitalité et de la présentation
  alternative: « l’offrit en sacrifice »
  rationale: Le verset décrit la préparation du repas, son transport et sa présentation. Les versets suivants donnent à la scène une portée sacrificielle, mais celle-ci n’est pas formulée explicitement ici ; la traduction préserve donc la progression et la tension du récit.
translation_notes:
  register: Français international moderne, naturel et digne. Le récit reste concret et accessible. « Rentra », « prépara » et « apporta le tout » évitent une littéralité maladroite tout en suivant étroitement la séquence hébraïque. Les notes expliquent la mesure ancienne et conservent l’incertitude botanique.
