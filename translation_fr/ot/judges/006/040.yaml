base_translation:
  language: en
  yaml_path: translation/ot/judges/006/040.yaml
  text: And God did so that night[a], and there was dryness on the fleece alone, and on all the ground there was dew.
translation:
  language: fr
  text: Dieu fit ainsi cette nuit-là. Seule la toison était sèche, tandis qu’il y avait de la rosée sur tout le sol[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur toute la terre ». Le mot hébreu אֶרֶץ peut désigner le sol, un territoire ou la terre ; ici, « sol » convient le mieux à la scène immédiate du signe demandé par Gédéon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אֱלֹהִים כֵּן
  choice: Dieu fit ainsi
  rationale: Cette formulation reprend avec concision la demande de Gédéon exprimée au verset précédent et conserve la tournure narrative du texte hébreu.
- source_word: בַּלַּיְלָה הַהוּא
  choice: cette nuit-là
  rationale: Équivalent français naturel qui garde la précision temporelle de l’hébreu.
- source_word: חֹרֶב אֶל־הַגִּזָּה לְבַדָּהּ
  choice: Seule la toison était sèche
  rationale: Cette formulation française naturelle exprime que la sécheresse était limitée à la toison, tout en conservant le contraste central du signe.
- source_word: וְעַל כָּל־הָאָרֶץ הָיָה טָל
  choice: tandis qu’il y avait de la rosée sur tout le sol
  rationale: « Tandis que » rend clairement le contraste avec la toison sèche. Dans cette scène locale, « sol » est le sens contextuel le plus probable de אֶרֶץ, sans exclure son sens plus large signalé en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La phrase est divisée en deux pour éviter une coordination lourde, et « tandis que » met naturellement en relief le contraste explicite entre la toison sèche et le sol couvert de rosée.
