source:
  edition: WLC
  text: וַ/יָּבֹ֞א מַלְאַ֣ךְ יְהוָ֗ה וַ/יֵּ֨שֶׁב֙ תַּ֤חַת הָֽ/אֵלָה֙ אֲשֶׁ֣ר בְּ/עָפְרָ֔ה אֲשֶׁ֥ר לְ/יוֹאָ֖שׁ אֲבִ֣י הָֽעֶזְרִ֑י וְ/גִדְע֣וֹן בְּנ֗/וֹ חֹבֵ֤ט חִטִּים֙ בַּ/גַּ֔ת לְ/הָנִ֖יס מִ/פְּנֵ֥י מִדְיָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/011.yaml
  text: Then the angel of Yahweh came and sat under the oak that was in Ophrah[a], which belonged to Joash the Abiezrite[c][b], while Gideon his son was beating out wheat in the winepress to hide it from Midian.
translation:
  language: fr
  text: Alors l’ange de Yahweh vint s’asseoir sous le térébinthe qui se trouvait à Ophra et qui appartenait à Joas, l’Abiézerite. Son fils Gédéon battait du blé dans le pressoir afin de le mettre à l’abri de Madian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager ou un ange. Dans cette scène de Juges, le contexte indique un messager céleste, sans préciser davantage son identité.
- source_word: הָאֵלָה
  choice: le térébinthe
  rationale: אֵלָה désigne vraisemblablement un térébinthe ou un grand arbre apparenté. « Térébinthe » est précis et bien établi dans le registre biblique français.
- source_word: אֲשֶׁר לְיוֹאָשׁ
  choice: qui appartenait à Joas
  rationale: Cette formulation naturelle conserve le rapport de possession exprimé par l’hébreu.
- source_word: אֲבִי הָעֶזְרִי
  choice: l’Abiézerite
  rationale: Le gentilé hébreu indique l’appartenance de Joas au clan d’Abiézer; « Abiézerite » rend clairement cette affiliation en français.
- source_word: חֹבֵט חִטִּים
  choice: battait du blé
  rationale: חבט décrit concrètement l’action de battre le grain pour en détacher les épis, ce qui convient mieux que le terme plus général « dépiquait » dans ce lieu inhabituel.
- source_word: בַּגַּת
  choice: dans le pressoir
  rationale: Le pressoir est ici un pressoir à raisin; en français, « dans le pressoir » suffit dans ce contexte et conserve la préposition hébraïque.
- source_word: לְהָנִיס מִפְּנֵי מִדְיָן
  choice: afin de le mettre à l’abri de Madian
  rationale: Le hiphil de נוס exprime littéralement l’idée de faire fuir ou d’éloigner. Appliqué au blé menacé, il signifie le soustraire à Madian; cette traduction garde cette nuance sans ajouter explicitement l’idée de dissimulation.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Yahvé
  rationale: La translittération « Yahweh » préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- issue: Portée de מַלְאַךְ dans l’expression מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Le récit présente un envoyé céleste; « ange » est donc naturel en français. La traduction ne tranche pas pour autant la question théologique de son identité précise.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent les formes françaises bibliques courantes (Ophra, Joas, Gédéon, Madian). La coordination hébraïque est légèrement restructurée en deux phrases pour éviter une longue proposition ambiguë et rendre clairement que « son fils » désigne le fils de Joas.
