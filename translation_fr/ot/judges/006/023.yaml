  text: וַ/יֹּ֨אמֶר ל֧/וֹ יְהוָ֛ה שָׁל֥וֹם לְ/ךָ֖ אַל תִּירָ֑א לֹ֖א תָּמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/023.yaml
  text: But Yahweh said to him[a], “Peace be to you. Do not fear; you shall not die.”
translation:
  language: fr
  text: 'Yahweh lui dit : « Paix à toi ! N’aie pas peur, tu ne mourras pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol de אמר est la formule narrative habituelle et se rend naturellement par « dit » en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: שָׁלוֹם לְךָ
  choice: Paix à toi !
  rationale: La formule exprime ici une assurance de paix et de sécurité. La traduction brève conserve l’image hébraïque tout en restant naturelle dans ce contexte solennel.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Cette tournure française courante et digne restitue directement la formule hébraïque de réconfort.
- source_word: לֹא תָּמוּת
  choice: tu ne mourras pas
  rationale: Le futur simple exprime clairement l’assurance donnée par Yahweh sans ajouter de nuance absente de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » en préserve la fonction de nom personnel sans le remplacer par un titre.
- issue: Portée de שָׁלוֹם לְךָ
  choice: Paix à toi !
  alternative: Tout va bien pour toi ; Sois en paix
  rationale: Dans le contexte, la formule rassure Gédéon sur sa sécurité. La traduction retenue maintient toutefois la richesse de שָׁלוֹם sans réduire son sens à une seule paraphrase.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond aux formes masculines singulières לְךָ et תִּירָא et à l’adresse directe de Yahweh à Gédéon. La ponctuation fait entendre la parole comme une assurance immédiate, sans ajouter d’explication au texte.
