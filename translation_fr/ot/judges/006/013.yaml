id: JDG.6.13
reference: Judges 6:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו גִּדְעוֹן֙ בִּ֣י אֲדֹנִ֔/י וְ/יֵ֤שׁ יְהוָה֙ עִמָּ֔/נוּ וְ/לָ֥/מָּה מְצָאַ֖תְ/נוּ כָּל זֹ֑את וְ/אַיֵּ֣ה כָֽל נִפְלְאֹתָ֡י/ו אֲשֶׁר֩ סִפְּרוּ לָ֨/נוּ אֲבוֹתֵ֜י/נוּ לֵ/אמֹ֗ר הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ הֶעֱלָ֣/נוּ יְהוָ֔ה וְ/עַתָּה֙ נְטָשָׁ֣/נוּ יְהוָ֔ה וַֽ/יִּתְּנֵ֖/נוּ בְּ/כַף מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/013.yaml
  text: Gideon said to him[a], “Please, my lord, if Yahweh is with us, why then has all this happened to us? And where are all his wonders that our fathers told us about, saying[c][b], ‘Did not Yahweh bring us up from Egypt?’ But now Yahweh has abandoned us and given us into the hand of Midian.”
translation:
  language: fr
  text: 'Gédéon lui répondit : « Pardon, mon seigneur[a], mais si Yahweh est avec nous, pourquoi tout cela nous est-il arrivé ? Où sont donc tous ses prodiges[b] que nos pères nous ont racontés en disant : “Yahweh ne nous a-t-il pas fait sortir d’Égypte ?” Mais maintenant, Yahweh nous a abandonnés et nous a livrés au pouvoir de Madian[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je vous en prie, mon seigneur. » L’hébreu emploie une formule d’adresse polie.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ses actes merveilleux » ou « ses miracles ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « dans la main de Madian », expression signifiant « au pouvoir de Madian ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Pardon, mon seigneur
  rationale: בִּי est ici une interjection polie exprimant une demande de permission ou une objection respectueuse. « Mon seigneur » conserve la déférence envers l’interlocuteur sans imposer ici un titre divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: וְיֵשׁ יְהוָה עִמָּנוּ
  choice: mais si Yahweh est avec nous
  rationale: Dans cette question rhétorique, la proposition pose naturellement une condition mise en doute par l’expérience présente. « Mais » relie l’objection à la salutation précédente et rend le contraste implicite.
- source_word: לָמָּה מְצָאַתְנוּ כָּל זֹאת
  choice: pourquoi tout cela nous est-il arrivé ?
  rationale: Avec un malheur pour sujet, מצא peut désigner ce qui atteint ou survient à quelqu’un. Cette formulation est naturelle en français moderne.
- source_word: נִפְלְאֹתָיו
  choice: ses prodiges
  rationale: Le terme désigne les actes extraordinaires et merveilleux de Dieu. « Prodiges » convient au registre biblique actuel sans préciser indûment leur mécanisme.
- source_word: סִפְּרוּ לָנוּ אֲבוֹתֵינוּ
  choice: que nos pères nous ont racontés
  rationale: La formulation conserve la référence aux pères transmettant la mémoire d’Israël, tout en restant idiomatique en français.
- source_word: הֲלֹא מִמִּצְרַיִם הֶעֱלָנוּ יְהוָה
  choice: Yahweh ne nous a-t-il pas fait sortir d’Égypte ?
  rationale: La particule interrogative attend une réponse affirmative. « Faire sortir d’Égypte » exprime naturellement en français l’idiome de l’Exode.
- source_word: נְטָשָׁנוּ
  choice: nous a abandonnés
  rationale: Le verbe exprime l’idée de délaisser ou d’abandonner et porte ici toute la force de la plainte de Gédéon.
- source_word: וַיִּתְּנֵנוּ בְּכַף מִדְיָן
  choice: nous a livrés au pouvoir de Madian
  rationale: Littéralement « nous a donnés dans la paume/main de Madian » ; l’expression signifie être livré à sa domination. Le sens est rendu clairement, tandis que l’image hébraïque est signalée en note.
- source_word: מִדְיָן
  choice: Madian
  rationale: Forme française traditionnelle et largement reconnue du nom propre biblique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » le préserve sans lui substituer un titre.
- issue: Valeur de אֲדֹנִי dans l’adresse de Gédéon
  choice: mon seigneur, comme formule honorifique respectueuse
  alternative: Seigneur, comme titre explicitement divin
  rationale: À ce stade du récit, la formule peut être comprise comme une adresse déférente au messager. La minuscule évite de trancher prématurément son identité théologique.
- issue: Force de וְיֵשׁ dans la plainte de Gédéon
  choice: si Yahweh est avec nous
  alternative: et Yahweh est avec nous / puisque Yahweh est avec nous
  rationale: Le contexte rhétorique présente la présence de Yahweh comme la prémisse que Gédéon confronte à la souffrance d’Israël. Le conditionnel rend cette tension sans nier directement la présence divine.
translation_notes:
  register: Français international moderne, naturel et digne. La plainte de Gédéon demeure directe et rhétorique. Le nom divin est conservé sous la forme « Yahweh » ; « mon seigneur » reste en minuscule afin de ne pas résoudre par la typographie l’identité de l’interlocuteur à ce point du récit.
