source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֡שׁ לְ/כֹל֩ אֲשֶׁר עָמְד֨וּ עָלָ֜י/ו הַ/אַתֶּ֣ם תְּרִיב֣וּ/ן לַ/בַּ֗עַל אִם אַתֶּם֙ תּוֹשִׁיע֣וּ/ן אוֹת֔/וֹ אֲשֶׁ֨ר יָרִ֥יב ל֛/וֹ יוּמַ֖ת עַד הַ/בֹּ֑קֶר אִם אֱלֹהִ֥ים הוּא֙ יָ֣רֶב ל֔/וֹ כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/031.yaml
  text: But Joash said to all who stood against him[a], “Will you contend for Baal? Will you save him? Whoever contends for him shall be put to death by morning. If he is a god, let him contend for himself, because his altar has been torn down.”
translation:
  language: fr
  text: 'Mais Joas dit à tous ceux qui se dressaient contre lui : « Est-ce à vous de défendre la cause de Baal ? Est-ce à vous de le sauver ? Quiconque défendra sa cause sera mis à mort d’ici demain matin. S’il est un dieu, qu’il défende lui-même sa cause, puisque son autel a été démoli[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « puisqu’il a démoli son autel », le sujet sous-entendu étant Gédéon.'
    reason: La forme hébraïque est active, à la troisième personne masculine du singulier, mais son sujet n’est pas exprimé.
lexical_decisions:
- source_word: עָמְדוּ עָלָיו
  choice: se dressaient contre lui
  rationale: Dans ce contexte d’accusation et de confrontation, l’expression a une valeur hostile plutôt que simplement spatiale. « Se dresser contre » est naturel en français et conserve cette opposition.
- source_word: תְּרִיבוּן / יָרִיב / יָרֶב
  choice: défendre la cause / défendra sa cause / qu’il défende lui-même sa cause
  rationale: La répétition de la racine ריב structure la réplique. « Défendre la cause » maintient cette répétition tout en rendant sa nuance à la fois judiciaire et conflictuelle.
- source_word: תּוֹשִׁיעוּן
  choice: sauver
  rationale: 'Ce verbe rend directement le causatif de ישׁע et conserve l’ironie de la question : les hommes devraient-ils sauver leur dieu ?'
- source_word: אֲשֶׁר יָרִיב לוֹ
  choice: Quiconque défendra sa cause
  rationale: La relative indéfinie énonce une règle générale. « Quiconque » en restitue clairement la portée.
- source_word: יוּמַת
  choice: sera mis à mort
  rationale: La forme causative passive exige une exécution, non la simple affirmation que la personne mourra.
- source_word: עַד הַבֹּקֶר
  choice: d’ici demain matin
  rationale: Dans cette menace, l’expression fixe une échéance au matin qui vient. Cette formulation est claire et idiomatique en français moderne.
- source_word: אֱלֹהִים הוּא
  choice: S’il est un dieu
  rationale: אֱלֹהִים désigne ici Baal en tant que divinité supposée, et non le Dieu d’Israël. L’article indéfini exprime correctement cette valeur prédicative.
- source_word: כִּי נָתַץ אֶת מִזְבְּחוֹ
  choice: puisque son autel a été démoli
  rationale: Le verbe hébreu actif à la troisième personne masculine du singulier n’explicite pas son sujet. La tournure passive française conserve le fait central sans ajouter explicitement Gédéon comme sujet; une note signale la construction active possible.
- source_word: וַיֹּאמֶר
  choice: Mais Joas dit
  rationale: Dans le contexte, la conjonction introduit la réponse opposée de Joas aux accusateurs; « Mais » rend naturellement ce tournant narratif.
theological_decisions:
- issue: Référence de אֱלֹהִים à Baal
  choice: « un dieu »
  alternative: « Dieu »
  rationale: Joas met à l’épreuve la prétention de Baal à être une divinité; il n’identifie pas Baal au Dieu d’Israël. La minuscule et l’article indéfini évitent de transformer cette formulation conditionnelle en affirmation théologique.
- issue: Sujet implicite de נָתַץ
  choice: 'Ne pas nommer le sujet dans le texte principal : « son autel a été démoli »'
  alternative: « il a démoli son autel », avec Gédéon comme sujet compris
  rationale: Le contexte permet de comprendre Gédéon comme sujet, mais l’hébreu ne le nomme pas dans cette proposition. La traduction principale préserve cette sous-détermination, et la note présente l’autre construction.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions parallèles et la triple reprise de ריב sont conservées par « défendre la cause ». Le discours garde son ironie envers l’impuissance supposée de Baal sans ajouter d’explication confessionnelle.
