base_translation:
  language: en
  yaml_path: translation/ot/judges/006/004.yaml
  text: They would encamp against them and destroy the produce of the land as far as Gaza[a], and they would leave no sustenance in Israel, nor sheep, ox[b], or donkey.
translation:
  language: fr
  text: Ils campaient contre eux et détruisaient les produits du pays jusqu’aux abords de Gaza[a]. Ils ne laissaient en Israël aucun moyen de subsistance[b], ni mouton, ni bœuf, ni âne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à ton arrivée à Gaza » ; tournure hébraïque désignant l’étendue atteinte en direction de Gaza.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aucune subsistance » ou « aucun moyen de vivre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ עֲלֵיהֶם
  choice: Ils campaient contre eux
  rationale: Le verbe חנה signifie « camper ». Dans le contexte des incursions répétées des versets 3 à 5, l’imparfait exprime naturellement l’action habituelle. La préposition עַל a ici une valeur hostile, rendue par « contre eux ».
- source_word: וַיַּשְׁחִיתוּ
  choice: détruisaient
  rationale: Le hifil de שׁחת désigne l’action de détruire, ruiner ou dévaster. « Détruisaient » restitue directement la gravité des dommages agricoles.
- source_word: יְבוּל הָאָרֶץ
  choice: les produits du pays
  rationale: יְבוּל désigne ce que la terre produit, son rendement ou sa récolte. « Les produits du pays » conserve cette portée assez large sans limiter le sens aux seules céréales.
- source_word: עַד בּוֹאֲךָ עַזָּה
  choice: jusqu’aux abords de Gaza
  rationale: L’expression signifie littéralement « jusqu’à ton arrivée vers Gaza ». « Jusqu’aux abords de Gaza » restitue l’idée de la zone d’approche tout en restant idiomatique en français.
- source_word: וְלֹא יַשְׁאִירוּ מִחְיָה בְּיִשְׂרָאֵל
  choice: Ils ne laissaient en Israël aucun moyen de subsistance
  rationale: שׁאר au hifil signifie « laisser », et l’imparfait français maintient la valeur habituelle. מִחְיָה peut désigner la nourriture, la subsistance ou les moyens permettant de vivre ; « moyen de subsistance » en préserve l’ampleur économique et vitale.
- source_word: וְשֶׂה וָשׁוֹר וַחֲמוֹר
  choice: ni mouton, ni bœuf, ni âne
  rationale: Les noms singuliers ont ici une valeur collective ou représentative. La répétition de « ni » donne une énumération naturelle en français et conserve les trois catégories de bétail.
