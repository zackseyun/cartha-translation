  yaml_path: translation/ot/judges/006/036.yaml
  text: Then Gideon said to God, “If you will save Israel by my hand, as you have spoken,”
translation:
  language: fr
  text: 'Gédéon dit alors à Dieu : « Si tu sauves Israël par ma main, comme tu l’as dit… »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw narratif fait progresser le récit. « dit alors » en restitue naturellement la succession en français moderne.
- source_word: אֶל הָאֱלֹהִים
  choice: à Dieu
  rationale: Dans ce contexte, Gédéon s’adresse au Dieu d’Israël ; le français emploie naturellement « Dieu » sans article.
- source_word: אִם
  choice: si
  rationale: Introduit la proposition conditionnelle qui reste en suspens et se poursuit au verset suivant.
- source_word: יֶשְׁךָ מוֹשִׁיעַ
  choice: tu veux sauver
  rationale: La construction יֵשׁ avec suffixe pronominal et participe exprime ici une action envisagée ou projetée. « tu veux sauver » garde cette orientation prospective sans transformer la condition en simple prédiction.
- source_word: בְּיָדִי
  choice: par ma main
  rationale: Cette formulation conserve l’image hébraïque concrète de la main comme moyen d’action, tout en restant intelligible en français.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: La marque de l’objet direct אֵת ne se traduit pas ; Israël est l’objet du salut annoncé.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: comme tu l’as déclaré
  rationale: « déclaré » rend la parole antérieure explicite et solennelle de Dieu, tandis que le pronom « l’ » donne une tournure française naturelle.
theological_decisions:
- issue: Désignation de אֱלֹהִים dans l’adresse de Gédéon
  choice: Dieu
  alternative: le dieu
  rationale: Le contexte identifie le destinataire comme le Dieu d’Israël. La majuscule et l’absence d’article suivent l’usage français sans ajouter de précision doctrinale.
- issue: Valeur de יֶשְׁךָ מוֹשִׁיעַ
  choice: si tu veux sauver
  alternative: si tu vas sauver / si tu sauveras
  rationale: Le choix préserve l’idée d’intention ou d’action projetée et la forme conditionnelle de la demande de Gédéon. Il n’implique pas que Gédéon nie catégoriquement la promesse.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure volontairement inachevée, avec des points de suspension, puisque la condition introduite ici se poursuit au verset 37.
