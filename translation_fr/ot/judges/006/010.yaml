base_translation:
  language: en
  yaml_path: translation/ot/judges/006/010.yaml
  text: And I said to you[a], ‘I am Yahweh your God; do not fear the gods of the Amorites, in whose land you dwell[b]. But you have not listened to my voice.’
translation:
  language: fr
  text: 'Et je vous ai dit : « Je suis Yahweh, votre Dieu. Ne craignez pas[a] les dieux des Amorites, dont vous habitez le pays. Mais vous n’avez pas écouté ma voix[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Vous ne craindrez pas. » L’hébreu exprime ici une interdiction.'
    reason: lexical_alternative
  - marker: b
    text: « Écouté ma voix » peut aussi se comprendre au sens de « m’obéir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לָכֶם
  choice: Et je vous ai dit
  rationale: Le wayyiqtol de אמר poursuit le récit et rappelle une parole antérieure. « Je vous ai dit » rend naturellement en français la première personne et le complément pluriel לָכֶם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Bien que אֱלֹהִים ait une forme plurielle, il désigne ici au singulier le Dieu d’Israël; le suffixe de deuxième personne du pluriel est rendu par « votre ».
- source_word: לֹא תִירְאוּ
  choice: Ne craignez pas
  rationale: L’imparfait précédé de לֹא a ici une valeur prohibitive. L’impératif négatif français en restitue directement et naturellement la force.
- source_word: אֱלֹהֵי הָאֱמֹרִי
  choice: les dieux des Amorites
  rationale: Le singulier collectif hébreu désigne le peuple amorite; le pluriel français « Amorites » est idiomatique. אֱלֹהֵי désigne les divinités de ce peuple.
- source_word: אֲשֶׁר אַתֶּם יוֹשְׁבִים בְּאַרְצָם
  choice: dont vous habitez le pays
  rationale: Cette formulation française naturelle conserve le lien relatif avec les Amorites et le sens de résidence stable porté par ישׁב.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלִי
  choice: Mais vous n’avez pas écouté ma voix
  rationale: La traduction conserve l’image hébraïque de l’écoute de la voix, tout en laissant entendre, sans l’expliciter dans le corps du texte, la notion d’obéissance. « Mais » exprime naturellement le contraste contextuel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Portée de שׁמע בקול
  choice: vous n’avez pas écouté ma voix
  alternative: vous ne m’avez pas obéi
  rationale: L’expression peut signifier écouter avec l’idée de se conformer à ce qui est dit. La formulation retenue préserve l’idiome et son image, tandis qu’une note signale le sens d’obéissance.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu sans calque pesant; les guillemets français distinguent la parole divine. Les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
