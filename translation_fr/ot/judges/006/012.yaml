source:
  edition: WLC
  text: וַ/יֵּרָ֥א אֵלָ֖י/ו מַלְּאַ֣ךְ יְהוָ֑ה וַ/יֹּ֣אמֶר אֵלָ֔י/ו יְהוָ֥ה עִמְּ/ךָ֖ גִּבּ֥וֹר הֶ/חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/012.yaml
  text: Then the angel of Yahweh appeared to him and said to him[a], “Yahweh is with you[b], mighty warrior.”
translation:
  language: fr
  text: 'Alors l’ange de Yahweh lui apparut et lui dit : « Yahweh est avec toi, vaillant guerrier[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « homme fort et vaillant » ; traditionnellement : « vaillant héros ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apparut
  rationale: Le nifal de ראה exprime ici une manifestation visible. « Apparut » est l’équivalent narratif naturel en français.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut désigner un messager humain ou céleste ; dans cette scène de manifestation, « ange » convient le mieux, sans préciser davantage son identité théologique.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: et lui dit
  rationale: Cette formulation respecte le pronom hébreu sans ajouter explicitement le nom de Gédéon.
- source_word: יְהוָה עִמְּךָ
  choice: Yahweh est avec toi
  rationale: La proposition nominale est comprise naturellement comme une déclaration présente plutôt que comme un souhait.
- source_word: גִּבּוֹר הֶחָיִל
  choice: vaillant guerrier
  rationale: L’expression désigne un homme fort, courageux et apte au combat. « Vaillant guerrier » en restitue le sens martial dans un français actuel et digne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: La translittération conserve le nom divin présent dans le texte hébreu au lieu de lui substituer un titre.
- issue: Identité de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Le texte est traduit lexicalement sans identifier doctrinalement l’ange à une personne divine particulière.
- issue: Valeur de יְהוָה עִמְּךָ
  choice: 'déclaration : « Yahweh est avec toi »'
  alternative: 'souhait ou salutation : « Que Yahweh soit avec toi »'
  rationale: Dans le contexte, la proposition sans verbe se lit le plus naturellement comme l’affirmation de la présence de Yahweh, tout en reconnaissant qu’une formule de salutation est grammaticalement possible.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans être archaïque. « Vaillant guerrier » garde la portée martiale de l’hébreu. Le point d’exclamation rend l’interpellation directe sans transformer la proposition précédente en exclamation.
