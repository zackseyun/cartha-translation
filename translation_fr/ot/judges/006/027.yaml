source:
  edition: WLC
  text: וַ/יִּקַּ֨ח גִּדְע֜וֹן עֲשָׂרָ֤ה אֲנָשִׁים֙ מֵֽ/עֲבָדָ֔י/ו וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֵלָ֖י/ו יְהוָ֑ה וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר יָרֵא֩ אֶת בֵּ֨ית אָבִ֜י/ו וְ/אֶת אַנְשֵׁ֥י הָ/עִ֛יר מֵ/עֲשׂ֥וֹת יוֹמָ֖ם וַ/יַּ֥עַשׂ לָֽיְלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/027.yaml
  text: So Gideon took ten men from among his servants and did as Yahweh had spoken to him. But because he feared his father's household and the men of the city too much to do it by day[a], he did it at night.
translation:
  language: fr
  text: Gédéon prit alors dix hommes parmi ses serviteurs et fit ce que Yahweh lui avait dit. Mais comme il craignait trop la maison de son père et les hommes de la ville pour le faire de jour[a], il le fit de nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « de faire [cela] de jour » ; le sens est que sa peur l’en empêchait.'
    reason: La construction hébraïque avec מִן et l’infinitif exprime de manière concise que la crainte empêcha Gédéon d’agir de jour.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe narratif לקח signifie couramment « prendre » ; le passé simple convient au récit français.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: dix hommes
  rationale: L’hébreu emploie explicitement le nom masculin אֲנָשִׁים.
- source_word: מֵעֲבָדָיו
  choice: parmi ses serviteurs
  rationale: Le מִן est partitif. עֶבֶד peut désigner un serviteur ou un esclave ; ici, « serviteurs » convient au personnel de la maison sans préciser un statut servile que le contexte n’établit pas.
- source_word: וַיַּעַשׂ כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה
  choice: fit ce que Yahweh lui avait dit
  rationale: Cette formulation française naturelle exprime fidèlement la conformité de l’acte de Gédéon à la parole divine antérieure.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Mais comme
  rationale: La tournure introduit naturellement en français la circonstance explicative et le contraste narratif, sans reproduire lourdement l’idiome « et il arriva que ».
- source_word: יָרֵא
  choice: craignait
  rationale: Le verbe ירא exprime ici la peur éprouvée envers des personnes.
- source_word: בֵּית אָבִיו
  choice: la maison de son père
  rationale: « Maison » conserve l’étendue sémantique de בַּיִת, qui peut viser ici la maisonnée ou le groupe familial, sans réduire explicitement le référent à la famille.
- source_word: אַנְשֵׁי הָעִיר
  choice: les hommes de la ville
  rationale: La traduction conserve la désignation masculine précise du texte hébreu.
- source_word: מֵעֲשׂוֹת יוֹמָם
  choice: trop … pour le faire pendant la journée
  rationale: 'Après le verbe de crainte, מִן avec l’infinitif exprime ici l’empêchement : sa peur l’a retenu d’agir de jour. La formulation explicite ce rapport de façon idiomatique.'
- source_word: וַיַּעַשׂ לָיְלָה
  choice: il le fit de nuit
  rationale: « De nuit » est une expression française naturelle qui maintient le contraste direct avec l’action pendant la journée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le Tétragramme. « Yahweh » préserve le nom personnel et correspond à sa vocalisation savante courante, sans le remplacer par un titre.
- issue: Référent de בֵּית אָבִיו
  choice: la maison de son père
  alternative: la maisonnée de son père ; la famille de son père
  rationale: Le calque français demeure intelligible et préserve l’ambiguïté entre la maisonnée au sens social et la lignée familiale, pertinente dans le cadre patriarcal du récit.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple soutient le registre biblique sans archaïsme marqué. « Maison de son père » conserve une ambiguïté réelle de l’hébreu ; « maisonnée » serait plus explicite, mais plus interprétatif.
