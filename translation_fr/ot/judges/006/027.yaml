revisions:
- from: Gédéon prit donc dix hommes parmi ses serviteurs et fit ce que Yahweh lui avait dit. Mais comme il craignait trop la maison de son père et les hommes de la ville pour le faire pendant la journée[a], il le fit de nuit.
  to: Gédéon prit alors dix hommes parmi ses serviteurs et fit ce que Yahweh lui avait dit. Mais comme il craignait trop la maison de son père et les hommes de la ville pour le faire de jour[a], il le fit de nuit.
  rationale: La révision retire l'inférence non marquée par « donc » et harmonise le contraste temporel en français (« de jour » / « de nuit »), sans modifier le sens ni lever l'ambiguïté de « la maison de son père ».
