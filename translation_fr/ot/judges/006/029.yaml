source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מִ֥י עָשָׂ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/יִּדְרְשׁוּ֙ וַ/יְבַקְשׁ֔וּ וַ/יֹּ֣אמְר֔וּ גִּדְעוֹן֙ בֶּן יוֹאָ֔שׁ עָשָׂ֖ה הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/029.yaml
  text: And each man said to his neighbor[a], “Who has done this thing?” And they inquired and searched, and they said[b], “Gideon son of Joash has done this thing.”
translation:
  language: fr
  text: 'Ils se dirent les uns aux autres : « Qui a fait cela ? » Ils se renseignèrent et menèrent des recherches, puis ils dirent : « C’est Gédéon, fils de Joas, qui a fait cela. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: les uns aux autres
  rationale: Cette tournure française naturelle exprime la discussion réciproque entre les hommes de la ville sans imposer le sens plus intime de « prochain » ou « ami ».
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif demande directement l’identité de l’auteur de l’acte.
- source_word: עָשָׂה
  choice: a fait
  rationale: Le passé composé convient à une action accomplie dont les conséquences viennent d’être constatées.
- source_word: הַדָּבָר הַזֶּה
  choice: cela
  rationale: Dans ce contexte, דָּבָר désigne l’acte découvert. « Cela » est idiomatique en français et reste aussi peu interprétatif que possible.
- source_word: וַיִּדְרְשׁוּ
  choice: ils se renseignèrent
  rationale: Le verbe exprime ici une démarche d’enquête ou d’interrogation; cette formulation le distingue du verbe suivant.
- source_word: וַיְבַקְשׁוּ
  choice: menèrent des recherches
  rationale: Cette expression rend l’idée de chercher activement à découvrir le responsable tout en formant une progression naturelle après « se renseignèrent ».
- source_word: גִּדְעוֹן בֶּן־יוֹאָשׁ
  choice: Gédéon, fils de Joas
  rationale: Les formes françaises traditionnelles et largement reconnues des noms sont employées; le patronyme hébreu est rendu directement.
- source_word: וַיֹּאמְרוּ
  choice: ils dirent
  rationale: Le verbe reste rendu sans préciser s’il s’agit d’une conclusion ou d’une réponse, puisque l’hébreu ne le précise pas.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple porte la succession narrative, tandis que le passé composé dans les paroles situe l’acte accompli par rapport à sa découverte. La construction clivée « C’est Gédéon… qui » est naturelle en français et met en relief l’identité révélée sans ajouter de contenu.
