  text: וַ/יַּ֣רְא גִּדְע֔וֹן כִּֽי מַלְאַ֥ךְ יְהוָ֖ה ה֑וּא וַ/יֹּ֣אמֶר גִּדְע֗וֹן אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה כִּֽי עַל כֵּ֤ן רָאִ֨יתִי֙ מַלְאַ֣ךְ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/022.yaml
  text: Then Gideon saw that he was the angel of Yahweh[a], and Gideon said, “Ah, Lord GOD! For I have seen the angel of Yahweh face to face.”
translation:
  language: fr
  text: 'Alors Gédéon comprit que c’était l’ange de Yahweh[a]. Gédéon dit : « Ah ! Seigneur Yahweh ! Car j’ai vu l’ange de Yahweh face à face ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ». Le mot hébreu peut désigner un ange ou un messager.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Alors Gédéon comprit
  rationale: Le verbe signifie littéralement « voir », mais la proposition introduite par כִּי exprime ici une prise de conscience. « comprit » rend naturellement ce sens contextuel en français.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut désigner un messager humain ou céleste. Dans ce récit, le contexte indique un envoyé surnaturel ; « ange » convient au texte principal, tandis qu’une note conserve l’autre possibilité lexicale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du nom divin conserve le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: אֲהָהּ
  choice: Ah !
  rationale: Cette interjection exprime l’effroi et la consternation de Gédéon dans un registre à la fois naturel et digne.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: Cette formulation rend distinctement le titre אֲדֹנָי et le nom divin יְהוָה, sans les fondre l’un dans l’autre.
- source_word: כִּי עַל כֵּן
  choice: donc
  rationale: Dans ce cri, la locution relie la détresse de Gédéon au fait qu’il a vu l’ange de Yahweh. « donc » exprime de façon concise cette conséquence perçue.
- source_word: רָאִיתִי
  choice: J’ai vu
  rationale: Le passé composé convient à une expérience qui vient de se produire et dont les conséquences présentes motivent la réaction de Gédéon.
- source_word: פָּנִים אֶל פָּנִים
  choice: face à face
  rationale: Cette expression française correspond directement à l’idiome hébreu d’une rencontre immédiate et personnelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le tétragramme. « Yahweh » conserve explicitement le nom divin et évite de le remplacer par un titre.
- issue: Identité et désignation de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Le contexte présente un envoyé surnaturel, ce qui justifie « ange », mais la note signale l’étendue sémantique du terme sans imposer une identification théologique allant au-delà du verset.
- issue: Force de la perception exprimée par וַיַּרְא ... כִּי
  choice: comprit que
  alternative: vit que
  rationale: La scène décrit une reconnaissance de l’identité de l’interlocuteur. « comprit » rend cette valeur sans préciser davantage la nature théologique de l’apparition.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct conserve l’intensité de l’effroi de Gédéon. Le nom « Yahweh » est maintenu dans les deux occurrences, et la ponctuation française rend le caractère exclamatif de sa réaction.
