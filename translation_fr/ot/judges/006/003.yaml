  text: וְ/הָיָ֖ה אִם זָרַ֣ע יִשְׂרָאֵ֑ל וְ/עָלָ֨ה מִדְיָ֧ן וַֽ/עֲמָלֵ֛ק וּ/בְנֵי קֶ֖דֶם וְ/עָל֥וּ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/003.yaml
  text: And whenever Israel sowed[a], Midian and Amalek and the people of the East would come up against them.
translation:
  language: fr
  text: Chaque fois qu’Israël semait, Madian montait avec Amalec et les peuples de l’Orient, et ils montaient contre lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit « contre lui » : le pronom masculin singulier renvoie collectivement à Israël. On pourrait aussi traduire « contre eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Chaque fois que
  rationale: La construction introduit ici une situation habituelle et répétée dans le passé, plutôt qu’une condition ponctuelle.
- source_word: זָרַע
  choice: semait
  rationale: Le verbe désigne directement l’action agricole de semer; l’imparfait français exprime naturellement la répétition.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre désigne collectivement le peuple d’Israël.
- source_word: וְעָלָה / וְעָלוּ
  choice: montaient
  rationale: Le verbe עלה évoque une montée ou une avancée vers le territoire israélite; l’imparfait rend le caractère habituel de ces incursions.
- source_word: מִדְיָן
  choice: Madian
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: וַעֲמָלֵק
  choice: Amalec
  rationale: Le texte hébreu emploie le nom propre, qui désigne ici collectivement le peuple amalécite.
- source_word: וּבְנֵי קֶדֶם
  choice: les peuples de l’Orient
  rationale: Littéralement « les fils de l’Orient »; cette formulation naturelle conserve le sens collectif et régional.
- source_word: עָלָיו
  choice: contre lui
  rationale: Le suffixe hébreu est au masculin singulier et renvoie collectivement à Israël; le français permet de conserver cette concordance.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. L’imparfait rend la répétition narrative. Le singulier collectif « lui » est maintenu afin de préserver la forme de l’hébreu, avec une note signalant l’alternative naturelle au pluriel.
