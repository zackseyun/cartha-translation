  text: וַ/יִּדַּ֧ל יִשְׂרָאֵ֛ל מְאֹ֖ד מִ/פְּנֵ֣י מִדְיָ֑ן וַ/יִּזְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/006.yaml
  text: So Israel became very poor because of Midian[c][b][a], and the sons of Israel cried out to Yahweh.
translation:
  language: fr
  text: Israël fut très affaibli à cause de Madian[a], et les fils d’Israël[b] crièrent vers Yahvé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut abaissé très bas » ou « fut considérablement appauvri ». Le verbe hébreu peut évoquer l’affaiblissement, l’abaissement ou l’appauvrissement causé par l’oppression.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les fils d’Israël », expression collective courante désignant le peuple d’Israël.
    reason: lexical_alternative
  - marker: c
    text: Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּדַּל
  choice: fut profondément affaibli
  rationale: Le verbe דל exprime ici le fait d’être diminué, abaissé ou appauvri sous l’oppression. « Fut profondément affaibli » garde cette portée générale sans la limiter à la seule pauvreté matérielle.
- source_word: מְאֹד
  choice: profondément
  rationale: Cet adverbe intensifie fortement l’état d’Israël. Avec « affaibli », « profondément » est naturel en français moderne.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: Dans ce contexte, la préposition indique la cause de l’affaiblissement d’Israël.
- source_word: מִדְיָן
  choice: Madian
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וַיִּזְעֲקוּ
  choice: crièrent
  rationale: Le verbe זעק désigne un cri poussé dans la détresse, souvent comme appel au secours. « Crièrent vers » conserve l’urgence sans expliciter davantage l’objet de l’appel.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rend formellement l’expression hébraïque tout en signalant par une note son emploi collectif pour le peuple d’Israël.
- source_word: אֶל יְהוָה
  choice: vers Yahvé
  rationale: « Vers » rend naturellement la direction de l’appel exprimée par אֶל, et « Yahvé » représente directement le nom divin יהוה.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël. « Yahvé » le représente directement; une note indique le rendu traditionnel.
- issue: Portée de בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation hébraïque est conservée, sans nier son sens collectif désignant ici l’ensemble du peuple.
- issue: Nuance de דל
  choice: affaibli
  alternative: appauvri / réduit à une extrême misère
  rationale: Le contexte inclut la dévastation économique, mais le verbe peut plus largement signifier être diminué ou abaissé. Le texte principal préserve cette largeur sémantique et la note présente les autres nuances.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la structure narrative concise de l’hébreu. « Profondément affaibli » évite de réduire l’effet de l’oppression à la pauvreté économique, tandis que la note maintient les nuances possibles.
