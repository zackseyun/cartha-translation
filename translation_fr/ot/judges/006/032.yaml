  text: וַ/יִּקְרָא ל֥/וֹ בַ/יּוֹם הַ/ה֖וּא יְרֻבַּ֣עַל לֵ/אמֹ֑ר יָ֤רֶב בּ/וֹ֙ הַ/בַּ֔עַל כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/032.yaml
  text: So on that day he called him Jerubbaal[a], saying, “Let Baal contend against him[b], because he tore down his altar.”
translation:
  language: fr
  text: 'Ce jour-là, il l’appela Yeroubbaal[a], en disant : « Que Baal plaide contre lui[b], parce qu’il a démoli son autel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le nom « Yeroubbaal » fait écho au verbe hébreu traduit ici par « plaider contre » ; l’explication donnée est : « Que Baal plaide contre lui. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Puisse Baal plaider contre lui. » Le verbe hébreu peut exprimer un souhait. On peut aussi comprendre : « Baal plaidera contre lui. »'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: il l’appela
  rationale: קרא avec ל et un suffixe désigne ici l’action d’appeler ou de donner un nom. Le singulier « il » respecte la forme hébraïque sans préciser davantage son antécédent.
- source_word: בַיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression temporelle directe et naturelle en français moderne.
- source_word: יְרֻבַּעַל
  choice: Yeroubbaal
  rationale: Le nom propre est translittéré selon une forme française transparente. Son jeu de mots avec le verbe ריב est signalé en note et repris dans l’explication qui suit.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Formule narrative introduisant les paroles qui expliquent le nom.
- source_word: יָרֶב בּוֹ הַבַּעַל
  choice: Que Baal lui cherche querelle
  rationale: Le yiqtol peut avoir ici une valeur jussive. « Chercher querelle à quelqu’un » rend naturellement ריב ב en français tout en conservant le sens d’affrontement juridique ou conflictuel.
- source_word: כִּי
  choice: puisque
  rationale: Introduit le motif sur lequel repose le défi lancé à Baal ; « puisque » convient bien à cette justification argumentative.
- source_word: נָתַץ
  choice: a démoli
  rationale: נתץ exprime la destruction ou le renversement d’un ouvrage, notamment d’un autel. « Démolir » est précis et idiomatique.
- source_word: אֶת מִזְבְּחוֹ
  choice: son autel
  rationale: Le suffixe masculin singulier renvoie naturellement à Baal, immédiatement mentionné, tout en conservant le pronom de l’hébreu.
theological_decisions:
- issue: Valeur de בַּעַל dans ce contexte polémique
  choice: Baal
  alternative: le maître / le seigneur
  rationale: Le mot désigne ici la divinité cananéenne et fonctionne comme un nom propre. « Baal » évite toute confusion avec le Seigneur, Dieu d’Israël.
- issue: Modalité de יָרֶב
  choice: Que Baal lui cherche querelle
  alternative: Baal lui cherchera querelle
  rationale: La valeur jussive s’accorde au défi formulé au verset précédent, mais la forme hébraïque peut aussi être comprise comme une affirmation au futur ; cette ambiguïté est signalée en note.
translation_notes:
  register: Français moderne, courant et digne. « C’est pourquoi » explicite la conséquence narrative portée par le waw dans le contexte immédiat. La tournure « chercher querelle » conserve la force polémique et le jeu étymologique sans devenir archaïque.
