- from: 'C’est pourquoi, ce jour-là, il l’appela Yeroubbaal[a], en disant : « Que Baal lui cherche querelle[b], puisqu’il a démoli son autel ! »'
  to: 'Ce jour-là, il l’appela Yeroubbaal[a], en disant : « Que Baal plaide contre lui[b], parce qu’il a démoli son autel. »'
  rationale: La révision supprime l’inférence causale ajoutée par « C’est pourquoi », retire une ponctuation expressive non imposée et rend ריב par « plaider contre », qui préserve la dimension de conflit et la possible nuance judiciaire. La modalité disputée du verbe demeure explicitement signalée en note.
