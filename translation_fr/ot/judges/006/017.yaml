  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/עָשִׂ֤יתָ לִּ/י֙ א֔וֹת שָׁ/אַתָּ֖ה מְדַבֵּ֥ר עִמִּֽ/י־׃
base_translation:
