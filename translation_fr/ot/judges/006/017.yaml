  yaml_path: translation/ot/judges/006/017.yaml
  text: And he said to him, “If now I have found favor in your eyes, then give me a sign that you are the one speaking with me.”
translation:
  language: fr
  text: 'Il lui dit : « Si j’ai trouvé grâce à tes yeux, donne-moi donc un signe que c’est bien toi qui me parles. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: j’ai trouvé grâce à tes yeux
  rationale: Conserve l’expression hébraïque traditionnelle et intelligible, qui évoque l’accueil favorable accordé par l’interlocuteur.
- source_word: וְעָשִׂיתָ לִּי אוֹת
  choice: donne-moi donc un signe
  rationale: Rend naturellement l’idée de produire ou d’accorder un signe en faveur de Gédéon; « donc » exprime ici la conséquence de la condition et la nuance de requête portée par נָא.
- source_word: שָׁאַתָּה מְדַבֵּר עִמִּי
  choice: que c’est bien toi qui me parles
  rationale: La tournure emphatique « c’est bien toi » restitue le pronom explicite אַתָּה et l’identification demandée, sans préciser au-delà du texte la nature du signe.
theological_decisions:
- issue: Identification de l’interlocuteur
  choice: c’est bien toi qui me parles
  alternative: que tu me parles
  rationale: Le pronom hébreu explicite souligne l’identité de celui qui parle. La traduction préserve cette emphase sans déterminer ici s’il faut le désigner comme l’ange de l’Éternel ou comme l’Éternel lui-même.
translation_notes:
  register: Français moderne, naturel et digne. Le tutoiement correspond au singulier hébreu et au contexte du dialogue. La formule « trouver grâce à tes yeux » garde la couleur biblique tout en restant largement compréhensible.
