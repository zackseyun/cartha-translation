  text: וַ/יִּ֤פֶן אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֗אמֶר לֵ֚ךְ בְּ/כֹחֲ/ךָ֣ זֶ֔ה וְ/הוֹשַׁעְתָּ֥ אֶת יִשְׂרָאֵ֖ל מִ/כַּ֣ף מִדְיָ֑ן הֲ/לֹ֖א שְׁלַחְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/014.yaml
  text: Then Yahweh turned to him and said[a], “Go in this strength of yours and save Israel from the hand of Midian[b]. Have I not sent you?”
translation:
  language: fr
  text: 'Alors Yahweh se tourna vers lui et dit : « Va avec cette force qui est la tienne[a] et sauve Israël de la main de Madian[b]. Ne t’ai-je pas envoyé ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Va dans cette force qui est la tienne ». La préposition hébraïque peut exprimer le moyen ou la situation, et « cette » met la force en relief.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de la main de Madian », expression hébraïque désignant son pouvoir ou sa domination.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin donné dans le texte hébreu, conformément à l’usage du projet.
- source_word: וַיִּפֶן אֵלָיו
  choice: se tourna vers lui
  rationale: Reproduit naturellement en français le mouvement exprimé par פנה et la direction marquée par אֵלָיו.
- source_word: לֵךְ
  choice: Va
  rationale: Rend directement l’impératif et sa force d’envoi.
- source_word: בְּכֹחֲךָ זֶה
  choice: avec cette force qui est en toi
  rationale: Conserve le démonstratif emphatique « cette » et exprime en français courant la force qui appartient à Gédéon, sans trancher excessivement entre valeur instrumentale et circonstancielle.
- source_word: וְהוֹשַׁעְתָּ
  choice: et sauve
  rationale: Après l’impératif « Va », la forme poursuit naturellement l’ordre donné; « sauve » rend le sens causatif de ישׁע dans ce contexte.
- source_word: מִכַּף מִדְיָן
  choice: du pouvoir de Madian
  rationale: Rend clairement l’idiome hébreu « de la main de Madian » comme une domination ou une emprise, tout en signalant l’image littérale en note.
- source_word: הֲלֹא שְׁלַחְתִּיךָ
  choice: N’est-ce pas moi qui t’envoie ?
  rationale: Préserve la question rhétorique attendant une réponse affirmative. Le présent français rend l’envoi que Yahweh accomplit par cette parole de commission.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; sa translittération conserve le nom propre sans le remplacer par un titre.
- issue: Rapport entre la force de Gédéon et l’envoi divin
  choice: Maintien des deux affirmations sans explication ajoutée
  alternative: Préciser que la force vient exclusivement de Dieu
  rationale: Le verset associe « cette force qui est en toi » à l’envoi de Yahweh sans expliciter leur rapport. La traduction préserve cette tension théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct demeure énergique. « N’est-ce pas moi qui t’envoie ? » est plus idiomatique que le calque au passé et souligne la commission prononcée au moment même, sans modifier sa portée.
