    issue: « de la maison des esclaves »
    rationale: Bien que proche de la forme littérale, ce syntagme n’exprime pas naturellement en français le sens de « house of slavery/bondage » et peut être compris comme une maison possédée ou habitée par des esclaves. « Maison de l’esclavage » rend le sens idiomatique tout en préservant l’image de la maison.
