base_translation:
  language: en
  yaml_path: translation/ot/judges/006/008.yaml
  text: 'Then Yahweh sent a man[a], a prophet, to the sons of Israel, and he said to them, “Thus says Yahweh, the God of Israel: I brought you up from Egypt[b], and I brought you out from the house of slavery.”'
translation:
  language: fr
  text: 'Alors Yahweh envoya un homme, un prophète, aux Israélites[a]. Il leur dit : « Ainsi parle Yahweh, le Dieu d’Israël : C’est moi qui vous ai fait monter d’Égypte et qui vous ai fait sortir de la maison de l’esclavage[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « aux fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de la maison des esclaves ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Alors … envoya
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: אִישׁ נָבִיא
  choice: un homme, un prophète
  rationale: Les deux noms hébreux sont maintenus en apposition, sans réduire l’expression au seul mot « prophète ».
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: aux Israélites
  rationale: Cette formulation française naturelle désigne clairement l’ensemble du peuple ; le tour hébreu littéral est signalé en note.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule française consacrée et digne pour la déclaration du messager prophétique ; le présent restitue la force actuelle de l’oracle cité.
- source_word: אָנֹכִי הֶעֱלֵיתִי
  choice: C’est moi qui vous ai fait monter
  rationale: « C’est moi qui » rend l’insistance du pronom indépendant אָנֹכִי, tandis que « fait monter » conserve le verbe causatif et l’image hébraïque de la montée depuis l’Égypte.
- source_word: וָאֹצִיא
  choice: et qui vous ai fait sortir
  rationale: Le causatif de יצא est rendu directement et la coordination avec la proposition précédente demeure naturelle en français.
- source_word: מִבֵּית עֲבָדִים
  choice: de la maison des esclaves
  rationale: Cette traduction conserve l’image concrète de l’hébreu, qui emploie le pluriel « esclaves », tout en restant intelligible en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin ; le conserver évite de remplacer silencieusement ce nom par un titre.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Dans ce contexte, l’expression conventionnelle désigne collectivement le peuple. « Les Israélites » transmet cette portée sans laisser entendre que seuls les hommes sont concernés, tandis que la forme littérale est conservée en note.
- issue: Force emphatique de אָנֹכִי
  choice: C’est moi qui
  alternative: Je
  rationale: Le pronom hébreu indépendant met le sujet divin en relief ; la tournure française choisie préserve cette insistance sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe prophétique reste solennelle sans archaïsmes ; les images concrètes de l’hébreu sont conservées lorsqu’elles demeurent compréhensibles.
