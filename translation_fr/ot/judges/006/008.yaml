  to: 'Alors Yahweh envoya un homme, un prophète, aux Israélites[a]. Il leur dit : « Ainsi parle Yahweh, le Dieu d’Israël : C’est moi qui vous ai fait monter d’Égypte et qui vous ai fait sortir de la maison de l’esclavage[b]. »'
