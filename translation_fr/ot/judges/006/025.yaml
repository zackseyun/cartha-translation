base_translation:
  language: en
  yaml_path: translation/ot/judges/006/025.yaml
  text: And it happened that night that Yahweh said to him[a], “Take your father’s bull and the second bull, seven years old, and tear down the altar of Baal that belongs to your father[b], and cut down the Asherah that is upon it.”
translation:
  language: fr
  text: 'Cette nuit-là, Yahvé lui dit : « Prends le taureau de ton père et le second taureau, âgé de sept ans. Démolis l’autel de Baal qui appartient à ton père et abats l’ashéra[a] qui se trouve sur cet autel[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner un objet cultuel associé à Ashéra, parfois appelé « poteau sacré » ou « poteau d’Ashéra ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qui est sur lui ». L’expression peut indiquer que l’ashéra était sur l’autel, au-dessus de lui ou étroitement associée à celui-ci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Cette nuit-là
  rationale: Formulation narrative naturelle en français moderne, qui rend le repère temporel et la transition du récit sans employer l’archaïsme « il arriva que ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, distincte du titre « le Seigneur ».
- source_word: קַח
  choice: Prends
  rationale: Rend directement l’impératif hébreu.
- source_word: פַּר הַשּׁוֹר אֲשֶׁר לְאָבִיךָ
  choice: le taureau de ton père
  rationale: Expression française concise qui rend la relation possessive; פַּר désigne un taureau, souvent un jeune taureau.
- source_word: וּפַר הַשֵּׁנִי שֶׁבַע שָׁנִים
  choice: et le second taureau, âgé de sept ans
  rationale: Conserve la conjonction et présente le second taureau comme un animal distinct, tout en rattachant clairement l’âge à celui-ci.
- source_word: וְהָרַסְתָּ
  choice: Démolis
  rationale: Verbe naturel et énergique pour la destruction d’un autel.
- source_word: מִזְבַּח הַבַּעַל
  choice: l’autel de Baal
  rationale: Rend directement la construction hébraïque et garde le nom de la divinité.
- source_word: הָאֲשֵׁרָה
  choice: l’ashéra
  rationale: La translittération conserve l’ambiguïté entre un objet cultuel, un symbole sacré et un objet associé à la déesse Ashéra, sans imposer « poteau » dans le texte.
- source_word: אֲשֶׁר עָלָיו
  choice: qui se trouve sur cet autel
  rationale: Rend le sens spatial premier de עַל et explicite l’antécédent du pronom pour éviter une ambiguïté maladroite en français.
- source_word: תִּכְרֹת
  choice: abats
  rationale: Verbe idiomatique pour couper et faire tomber un objet de bois dressé.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le nom propre est conservé plutôt que remplacé par un titre, conformément au texte hébreu.
- issue: Nature de הָאֲשֵׁרָה
  choice: l’ashéra
  alternative: le poteau sacré / le poteau d’Ashéra
  rationale: Le terme hébreu ne permet pas de définir avec certitude la forme et la fonction précises de l’objet; la translittération préserve cette tension historique et religieuse.
- issue: Relation spatiale exprimée par אֲשֶׁר עָלָיו
  choice: sur cet autel
  alternative: au-dessus de lui / auprès de lui
  rationale: Le sens le plus direct de עַל est retenu dans le texte, tandis que la note signale que la configuration matérielle exacte demeure incertaine.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs restent directs. La phrase d’ouverture privilégie une narration naturelle plutôt qu’une formule archaïque, tandis que les notes conservent les ambiguïtés cultuelle et spatiale du texte hébreu.
