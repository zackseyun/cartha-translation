- from: Il envoya des messagers dans tout le territoire de Manassé, et Manassé fut lui aussi mobilisé à sa suite. Il envoya également des messagers dans les territoires d’Aser, de Zabulon et de Nephtali, et leurs hommes montèrent à leur rencontre[a].
  to: Il envoya des messagers dans tout Manassé, et Manassé fut lui aussi mobilisé à sa suite. Il envoya également des messagers dans les territoires d’Aser, de Zabulon et de Nephtali, et ils montèrent à leur rencontre[a].
  rationale: La révision supprime l’ajout interprétatif « leurs hommes » et maintient le sujet pluriel implicite par « ils », tout en conservant le pluriel du complément. La note est reformulée afin de signaler l’ambiguïté du référent sans imposer une lecture.
