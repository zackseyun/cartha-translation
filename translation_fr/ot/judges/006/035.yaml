source:
  edition: WLC
  text: וּ/מַלְאָכִים֙ שָׁלַ֣ח בְּ/כָל מְנַשֶּׁ֔ה וַ/יִזָּעֵ֥ק גַּם ה֖וּא אַחֲרָ֑י/ו וּ/מַלְאָכִ֣ים שָׁלַ֗ח בְּ/אָשֵׁ֤ר וּ/בִ/זְבֻלוּן֙ וּ/בְ/נַפְתָּלִ֔י וַֽ/יַּעֲל֖וּ לִ/קְרָאתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/035.yaml
  text: And he sent messengers throughout all Manasseh[a], and it too was called out after him. He also sent messengers through Asher, Zebulun, and Naphtali, and they went up to meet them.
translation:
  language: fr
  text: Il envoya des messagers dans tout Manassé, et Manassé fut lui aussi mobilisé à sa suite. Il envoya également des messagers dans les territoires d’Aser, de Zabulon et de Nephtali, et ils montèrent à leur rencontre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom hébreu est au pluriel, mais son antécédent n’est pas précisé. Il peut désigner les forces ennemies ou Gédéon avec les hommes déjà rassemblés autour de lui.
    reason: Le suffixe pluriel de לִקְרָאתָם permet plus d’une identification contextuelle; la note conserve cette ambiguïté.
lexical_decisions:
- source_word: מַלְאָכִים
  choice: messagers
  rationale: Dans ce contexte de mobilisation militaire, le terme désigne des agents humains chargés de transmettre l’appel, et non des anges.
- source_word: שָׁלַח
  choice: envoya
  rationale: Rendu narratif direct et naturel du verbe, sans ajouter la nuance plus marquée de « dépêcha ».
- source_word: בְּכָל מְנַשֶּׁה
  choice: dans tout le territoire de Manassé
  rationale: La préposition et le contexte indiquent que les messagers parcourent l’ensemble du territoire ou du groupe tribal; l’explicitation « territoire » évite de faire de Manassé un simple individu.
- source_word: וַיִּזָּעֵק גַּם הוּא
  choice: Manassé fut lui aussi mobilisé
  rationale: Le niphal exprime ici la convocation ou le rassemblement militaire. La répétition de « Manassé » identifie clairement le référent du pronom masculin singulier hébreu.
- source_word: אַחֲרָיו
  choice: à sa suite
  rationale: L’expression indique que Manassé se rallie derrière Gédéon; « à sa suite » est naturel en français tout en conservant cette image.
- source_word: בְּאָשֵׁר וּבִזְבֻלוּן וּבְנַפְתָּלִי
  choice: dans les territoires d’Aser, de Zabulon et de Nephtali
  rationale: La préposition répétée situe l’envoi des messagers au sein de ces territoires tribaux; ce choix reste cohérent avec la première proposition.
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: Conserve le sens concret du verbe hébreu et son emploi narratif dans le déplacement militaire.
- source_word: לִקְרָאתָם
  choice: à leur rencontre
  rationale: Le suffixe hébreu est pluriel. Le français préserve ce pluriel sans préciser dans le corps du texte qui en est l’antécédent.
theological_decisions:
- issue: Référent du suffixe pluriel dans לִקְרָאתָם
  choice: Les hommes des tribus convoquées montent à la rencontre des forces ennemies.
  alternative: Ils montent à la rencontre de Gédéon et des forces déjà rassemblées autour de lui.
  rationale: Le suffixe est explicitement pluriel, mais son antécédent n’est pas nommé. Le contexte militaire favorise les forces ennemies; l’autre compréhension demeure possible et est signalée sans modifier le pluriel du texte hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. « Mobilisé » rend clairement l’appel militaire sans archaïsme; « leurs hommes » explicite naturellement que les sujets du verbe sont les membres des trois tribus, tout en évitant de traiter les territoires eux-mêmes comme des personnes.
