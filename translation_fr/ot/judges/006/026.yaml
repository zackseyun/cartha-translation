    reason: 'Alternative lexicale : la nature exacte de l’objet désigné par אֲשֵׁרָה est incertaine.'
  revision_rationale: La révision allège une expression française peu naturelle, aligne la relative sur la forme instructionnelle de l’hébreu et harmonise la note avec la construction « avec le bois de ». Elle ne tranche ni la fonction exacte de בַּמַּעֲרָכָה ni la forme physique de l’Ashéra.
