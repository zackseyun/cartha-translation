  text: וּ/בָנִ֨יתָ מִזְבֵּ֜חַ לַ/יהוָ֣ה אֱלֹהֶ֗י/ךָ עַ֣ל רֹ֧אשׁ הַ/מָּע֛וֹז הַ/זֶּ֖ה בַּ/מַּֽעֲרָכָ֑ה וְ/לָֽקַחְתָּ֙ אֶת הַ/פָּ֣ר הַ/שֵּׁנִ֔י וְ/הַעֲלִ֣יתָ עוֹלָ֔ה בַּ/עֲצֵ֥י הָ/אֲשֵׁרָ֖ה אֲשֶׁ֥ר תִּכְרֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/026.yaml
  text: Then build an altar to Yahweh your God on the top of this stronghold[a], in orderly arrangement, and take the second bull and offer it up as a burnt offering with the wood of the Asherah that you cut down.
translation:
  language: fr
  text: Puis construis un autel pour Yahweh, ton Dieu, au sommet de ce lieu fortifié, en bon ordre. Prends le deuxième taureau et offre-le en holocauste avec le bois de l’Ashéra[a] que tu abattras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le bois du poteau sacré d’Ashéra ». Le terme hébreu peut désigner un objet cultuel en bois associé à Ashéra.'
    reason: 'Alternative lexicale : la nature exacte de l’objet désigné par אֲשֵׁרָה est incertaine.'
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: Puis tu bâtiras
  rationale: Le parfait qal à valeur consécutive poursuit la série d’instructions. Le futur français exprime naturellement cet ordre, tandis que « puis » marque l’enchaînement.
- source_word: מִזְבֵּחַ
  choice: un autel
  rationale: Équivalent français courant et précis du terme désignant une structure sacrificielle.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: à Yahweh, ton Dieu
  rationale: La préposition marque ici la dédicace de l’autel. Le nom divin est translittéré, et « ton Dieu » est conservé explicitement.
- source_word: עַל רֹאשׁ הַמָּעוֹז הַזֶּה
  choice: au sommet de ce lieu fortifié
  rationale: רֹאשׁ signifie ici « sommet ». מָעוֹז désigne un lieu fort ou protégé ; « lieu fortifié » préserve cette portée sans imposer l’image plus précise d’une forteresse militaire.
- source_word: בַּמַּעֲרָכָה
  choice: selon une disposition ordonnée
  rationale: Le nom évoque une mise en ordre ou une disposition organisée. Cette formulation conserve son caractère concret tout en évitant de préciser sans preuve s’il s’agit des pierres, du bois ou de l’ensemble de l’autel.
- source_word: וְלָקַחְתָּ אֶת־הַפָּר הַשֵּׁנִי
  choice: Tu prendras le deuxième taureau
  rationale: Le futur poursuit l’instruction. « Deuxième » est maintenu, car il distingue cet animal de celui mentionné dans le contexte immédiat.
- source_word: וְהַעֲלִיתָ עוֹלָה
  choice: tu l’offriras en holocauste
  rationale: Cette expression rend l’idiome sacrificiel formé par le hifil de עלה et עֹלָה, sans reproduire artificiellement l’idée littérale de faire monter.
- source_word: בַּעֲצֵי הָאֲשֵׁרָה
  choice: avec le bois de l’Ashéra
  rationale: Le texte présente l’objet comme une source de bois. « Ashéra » garde le terme cultuel sans trancher la nature physique exacte de l’objet.
- source_word: אֲשֶׁר תִּכְרֹת
  choice: que tu auras abattue
  rationale: La proposition relative renvoie à l’Ashéra qui doit être coupée selon l’ordre précédent. Le futur antérieur indique naturellement que son abattage précède son emploi comme combustible.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Identification de אֲשֵׁרָה
  choice: Ashéra
  alternative: poteau sacré d’Ashéra ; objet en bois consacré à Ashéra
  rationale: Le mot peut désigner un objet cultuel associé à la déesse Ashéra, mais sa forme précise demeure discutée. La translittération dans le texte principal préserve cette ambiguïté, expliquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur injonctif rend la suite des ordres sans raideur. La formulation « selon une disposition ordonnée » maintient l’indétermination de בַּמַּעֲרָכָה, et la note est placée sur « Ashéra », terme qu’elle explique.
