revisions:
- from: Puis tu bâtiras un autel à Yahweh, ton Dieu, au sommet de ce lieu fortifié, selon une disposition ordonnée. Tu prendras le deuxième taureau et tu l’offriras en holocauste avec le bois de l’Ashéra[a] que tu auras abattue.
  to: Puis construis un autel pour Yahweh, ton Dieu, au sommet de ce lieu fortifié, en bon ordre. Prends le deuxième taureau et offre-le en holocauste avec le bois de l’Ashéra[a] que tu abattras.
  rationale: La révision allège une expression française peu naturelle, aligne la relative sur la forme instructionnelle de l’hébreu et harmonise la note avec la construction « avec le bois de ». Elle ne tranche ni la fonction exacte de בַּמַּעֲרָכָה ni la forme physique de l’Ashéra.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:14:07Z'
review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement la suite d’ordres, l’autel destiné à Yahweh, le deuxième taureau, l’holocauste et l’emploi du bois de l’Ashéra. La valeur de מָעוֹז comme lieu de force/protection et l’ambiguïté matérielle d’אֲשֵׁרָה sont conservées. La relative hébraïque au futur instructionnel est plus directement rendue par « que tu abattras » que par le futur antérieur.
  naturalness: « Selon une disposition ordonnée » est compréhensible mais lourd et peu idiomatique en français actuel. « En bon ordre » conserve l’indétermination de בַּמַּעֲרָכָה tout en étant naturel. Les impératifs rendent avec netteté la séquence d’instructions.
  terminology: « Yahweh », « autel », « holocauste » et « Ashéra » sont appropriés. La note doit présenter « poteau sacré » comme une possibilité pour l’objet, sans faire de cette identification une certitude.
  issues:
  - severity: low
    issue: Formulation lourde de בַּמַּעֲרָכָה
    rationale: « selon une disposition ordonnée » est redondant et raide. « en bon ordre » est plus naturel et ne précise pas indûment la nature de l’arrangement.
  - severity: low
    issue: Temps de la relative
    rationale: « que tu auras abattue » introduit une antériorité explicitée que le texte hébreu ne marque pas grammaticalement. « que tu abattras » garde la formulation instructionnelle et laisse l’ordre logique du récit faire comprendre la succession.
  revised_text: Puis construis un autel pour Yahweh, ton Dieu, au sommet de ce lieu fortifié, en bon ordre. Prends le deuxième taureau et offre-le en holocauste avec le bois de l’Ashéra[a] que tu abattras.
  revised_footnotes:
