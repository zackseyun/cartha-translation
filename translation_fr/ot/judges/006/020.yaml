  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים קַ֣ח אֶת הַ/בָּשָׂ֤ר וְ/אֶת הַ/מַּצּוֹת֙ וְ/הַנַּח֙ אֶל הַ/סֶּ֣לַע הַלָּ֔ז וְ/אֶת הַ/מָּרַ֖ק שְׁפ֑וֹךְ וַ/יַּ֖עַשׂ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/020.yaml
  text: Then the angel of God said to him[a], “Take the meat and the unleavened bread, and set them on this rock, and pour out the broth.” And he did so.
translation:
  language: fr
  text: 'Alors l’ange de Dieu lui dit[a] : « Prends la viande et les pains sans levain, dépose-les sur ce rocher et verse le bouillon. » Et il fit ainsi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Dieu ». Le mot hébreu peut désigner un messager humain ou céleste ; ici, le contexte favorise un envoyé surnaturel.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: l’ange de Dieu
  rationale: מַלְאַךְ peut désigner un messager humain ou céleste. Dans ce récit, le contexte favorise un envoyé surnaturel; « ange de Dieu » est donc naturel, tout en signalant l’autre possibilité en note.
- source_word: קַח
  choice: Prends
  rationale: L’impératif de לקח signifie directement « prendre », sans ajouter l’idée de déplacement que pourrait suggérer « apporte ».
- source_word: הַבָּשָׂר
  choice: la viande
  rationale: Bien que בָּשָׂר puisse littéralement signifier « chair », le contexte alimentaire appelle le français naturel « viande ».
- source_word: הַמַּצּוֹת
  choice: les pains sans levain
  rationale: מַצּוֹת désigne ici des aliments cuits sans levain. Le pluriel « pains sans levain » reste clair et rend explicitement le nombre hébreu.
- source_word: וְהַנַּח
  choice: dépose-les
  rationale: Le hiphil impératif de נוח exprime l’action de poser ou déposer. Le pronom pluriel reprend naturellement la viande et les pains.
- source_word: אֶל־הַסֶּלַע הַלָּז
  choice: sur ce rocher
  rationale: Avec le verbe « déposer », la préposition אֶל indique ici la destination; « sur » est idiomatique en français. סֶלַע est rendu par « rocher » et הַלָּז par « ce ».
- source_word: הַמָּרַק
  choice: le bouillon
  rationale: מָרָק désigne un bouillon ou liquide de cuisson; « bouillon » convient précisément au contexte.
- source_word: שְׁפֹוךְ
  choice: verses-y
  rationale: L’impératif de שפך signifie « verser, répandre ». Le pronom « y » explicite naturellement en français que le bouillon doit être versé sur le rocher, destination donnée par la proposition précédente.
- source_word: וַיַּעַשׂ כֵּן
  choice: Et il fit ainsi
  rationale: Cette formule concise rapporte l’exécution de l’ordre. « Il fit ainsi » conserve la brièveté et le registre narratif de l’hébreu.
theological_decisions:
- issue: Désignation de l’envoyé divin dans un contexte théophanique
  choice: l’ange de Dieu
  alternative: le messager de Dieu
  rationale: Le mot hébreu permet les deux sens. Le contexte de Juges 6 présente toutefois un envoyé surnaturel; « ange » convient au récit sans résoudre davantage la relation complexe entre cet envoyé et Dieu.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et accessible. « Rocher », « bouillon » et « pains sans levain » sont courants et précis; « fit ainsi » garde une légère solennité biblique sans archaïsme marqué.
