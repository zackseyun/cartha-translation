  text: וַ/יְהִ֕י כִּֽי זָעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה עַ֖ל אֹד֥וֹת מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/007.yaml
  text: And it happened that[a], when the sons of Israel cried out to Yahweh because of Midian[b],
translation:
  language: fr
  text: Lorsque les Israélites crièrent à Yahvé à cause de Madian,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Lorsque
  rationale: La construction introduit ici une circonstance temporelle liée à la suite du récit. En français moderne, « Lorsque » rend naturellement cette fonction sans reproduire lourdement la formule hébraïque.
- source_word: זָעֲקוּ
  choice: crièrent
  rationale: Le verbe exprime un cri pressant lancé dans la détresse, ici comme appel au secours adressé à Dieu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression hébraïque signifie littéralement « les fils d’Israël », mais désigne collectivement le peuple; « les Israélites » est précis, inclusif et naturel en français.
- source_word: אֶל יְהוָה
  choice: à Yahvé
  rationale: La préposition marque le destinataire de l’appel, et « Yahvé » représente directement le nom divin יהוה selon l’usage français courant.
- source_word: עַל אֹדוֹת
  choice: à cause de
  rationale: La locution indique ici le motif de leur cri, à savoir l’oppression liée à Madian.
- source_word: מִדְיָן
  choice: Madian
  rationale: Forme française traditionnelle et standard du nom propre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahvé » conserve le caractère propre du nom divin sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste suspendue par une virgule, puisque ce verset constitue la proposition circonstancielle dont la principale apparaît au verset suivant.
