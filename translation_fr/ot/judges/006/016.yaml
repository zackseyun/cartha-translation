  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה כִּ֥י אֶהְיֶ֖ה עִמָּ֑/ךְ וְ/הִכִּיתָ֥ אֶת מִדְיָ֖ן כְּ/אִ֥ישׁ אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/016.yaml
  text: And Yahweh said to him[a], “Surely I will be with you, and you will strike Midian as one man.”
translation:
  language: fr
  text: 'Yahweh lui dit : « Oui, je serai avec toi, et tu frapperas Madian comme un seul homme[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme s’il s’agissait d’un seul homme » ou « comme un homme unique ». L’expression hébraïque compare la manière de frapper Madian à celle de frapper un seul homme.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel employé dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: lui dit
  rationale: Cette formulation française naturelle rend la progression narrative du waw consécutif et le complément « à lui » sans alourdir la phrase par un « et » initial.
- source_word: כִּי
  choice: Oui
  rationale: Dans cette réponse directe, כִּי a une valeur d’assurance ou d’insistance. « Oui » exprime naturellement cette force, tout en évitant d’imposer une relation causale qui n’est pas certaine.
- source_word: אֶהְיֶה עִמָּךְ
  choice: je serai avec toi
  rationale: L’imparfait hébreu a ici une valeur future dans le cadre d’une promesse; la formule conserve l’assurance de la présence divine.
- source_word: וְהִכִּיתָ
  choice: et tu frapperas
  rationale: Le parfait avec waw prend une valeur future consécutive à la promesse. « Frapper » reste proche de נכה sans expliciter le résultat par « vaincre ».
- source_word: אֶת מִדְיָן
  choice: Madian
  rationale: Le texte nomme Madian au singulier comme entité collective; le français permet également cet emploi.
- source_word: כְּאִישׁ אֶחָד
  choice: comme un seul homme
  rationale: Cette traduction directe conserve l’image masculine singulière et l’ambiguïté de l’expression hébraïque, qui présente Madian comme pouvant être frappé à la manière d’un seul adversaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom propre sans lui substituer un titre.
- issue: Portée de l’expression כְּאִישׁ אֶחָד
  choice: comme un seul homme
  alternative: comme s’il ne s’agissait que d’un seul homme; comme un homme seulement
  rationale: Le rendu retenu préserve l’image et sa concision sans préciser excessivement si l’accent porte sur l’unité de Madian, sur la totalité de sa défaite ou sur la facilité avec laquelle il sera frappé.
translation_notes:
  register: Français international moderne, sobre et digne. Le discours direct reste fluide; « frapperas » maintient la proximité lexicale avec l’hébreu, tandis que la note éclaire l’idiome sans en supprimer l’ambiguïté.
