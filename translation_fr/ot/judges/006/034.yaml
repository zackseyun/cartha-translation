source:
  edition: WLC
  text: וְ/ר֣וּחַ יְהוָ֔ה לָבְשָׁ֖ה אֶת גִּדְע֑וֹן וַ/יִּתְקַע֙ בַּ/שּׁוֹפָ֔ר וַ/יִזָּעֵ֥ק אֲבִיעֶ֖זֶר אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/034.yaml
  text: Then the Spirit of Yahweh clothed Gideon[a], and he blew the trumpet[c][b], and Abiezer was summoned after him.
translation:
  language: fr
  text: Alors l’Esprit de Yahweh revêtit Gédéon[a]. Celui-ci sonna du cor[b], et les Abiézerites se rallièrent à lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Esprit de Yahweh vint sur Gédéon »; littéralement, « l’Esprit de Yahweh revêtit Gédéon ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu shofar : cor servant notamment à donner un signal.'
    reason: cultural_note
  - marker: c
    text: Ou « les Abiézerites furent convoqués à sa suite ». L’hébreu peut évoquer leur convocation ou leur ralliement derrière Gédéon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  rationale: Dans ce contexte où Gédéon reçoit une puissance divine, רוּחַ désigne clairement l’Esprit plutôt que le vent ou le souffle. Le nom divin יְהוָה est rendu par « Yahweh ».
- source_word: לָבְשָׁה אֶת גִּדְעוֹן
  choice: revêtit Gédéon
  rationale: Le verbe לבשׁ évoque littéralement l’action de revêtir quelqu’un ou quelque chose. « Revêtit Gédéon » conserve l’image hébraïque frappante selon laquelle l’Esprit prend Gédéon comme vêtement ou l’enveloppe, sans la réduire à la formule plus interprétative « vint sur ».
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: Celui-ci sonna du cor
  rationale: Le sujet sous-entendu est Gédéon. שׁוֹפָר désigne un cor utilisé notamment pour transmettre un signal; « cor » est précis, naturel en français et évite l’image moderne que pourrait suggérer « trompette ».
- source_word: וַיִּזָּעֵק אֲבִיעֶזֶר
  choice: les Abiézerites se rallièrent
  rationale: Le niphal de זעק peut exprimer ici la convocation ou le rassemblement en réponse au signal. אֲבִיעֶזֶר désigne collectivement le clan d’Abiézer; nommer « les Abiézerites » rend ce sens collectif clairement en français.
- source_word: אַחֲרָיו
  choice: à lui
  rationale: Après un verbe de ralliement, « à lui » exprime naturellement l’idée de se ranger derrière Gédéon, tout en conservant la nuance d’adhésion et de soutien.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le caractère personnel du nom divin sans le remplacer par un titre.
- issue: Image de l’action de l’Esprit sur Gédéon
  choice: l’Esprit de Yahweh revêtit Gédéon
  alternative: l’Esprit de Yahweh vint sur Gédéon
  rationale: Le rendu principal conserve la métaphore inhabituelle et théologiquement suggestive du texte hébreu, tandis que la note fournit l’expression française traditionnelle sans imposer une seule compréhension de l’image.
translation_notes:
  register: Français international moderne, digne et accessible. La segmentation en deux phrases clarifie que Gédéon est le sujet de la sonnerie du cor. « Abiézerites » explicite la valeur collective du nom de clan, tandis que les notes préservent le passif possible et l’image littérale du texte hébreu.
