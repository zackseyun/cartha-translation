  text: וָ/אַצִּ֤ל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּ֖ד כָּל לֹחֲצֵי/כֶ֑ם וָ/אֲגָרֵ֤שׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם וָ/אֶתְּנָ֥/ה לָ/כֶ֖ם אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/009.yaml
  text: And I delivered you from the hand of Egypt and from the hand of all your oppressors, and I drove them out from before you and gave you their land.
translation:
  language: fr
  text: Je vous ai délivrés du pouvoir de l’Égypte et du pouvoir de tous ceux qui vous opprimaient. Je les ai chassés de devant vous et je vous ai donné leur pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַצִּל
  choice: Je vous ai délivrés
  rationale: Le verbe נצל exprime ici l’action d’arracher ou de délivrer quelqu’un d’un pouvoir hostile. « Délivrés » convient au registre biblique tout en restant clair en français moderne.
- source_word: מִיַּד
  choice: du pouvoir de
  rationale: Littéralement « de la main de ». En français actuel, « du pouvoir de » restitue naturellement l’idée d’emprise ou de domination portée par l’image hébraïque.
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Forme française usuelle du nom du pays, qui désigne aussi ici la puissance égyptienne.
- source_word: כָּל לֹחֲצֵיכֶם
  choice: tous ceux qui vous opprimaient
  rationale: Le participe de לחץ désigne ceux qui exerçaient une pression oppressive sur Israël. Cette formulation est plus naturelle que le substantif abstrait « oppresseurs » et conserve l’aspect verbal du terme.
- source_word: וָאֲגָרֵשׁ אוֹתָם
  choice: Je les ai chassés
  rationale: גרש signifie chasser ou expulser. « Chassés » exprime clairement leur éviction du territoire.
- source_word: מִפְּנֵיכֶם
  choice: devant vous
  rationale: La locution signifie littéralement « de devant votre face ». « Devant vous » conserve l’image spatiale sans lourdeur, le verbe « chasser » portant déjà l’idée d’éloignement.
- source_word: וָאֶתְּנָה לָכֶם אֶת אַרְצָם
  choice: et je vous ai donné leur pays
  rationale: Rendu direct de נתן avec Israël comme bénéficiaire et le territoire des peuples chassés comme objet. « Pays » désigne ici naturellement le territoire habité et évite de réduire אֶרֶץ au seul sol.
theological_decisions:
- issue: Action divine dans la délivrance d’Israël et la possession du pays
  choice: 'Dieu demeure explicitement le sujet des trois actions : délivrer, chasser et donner.'
  alternative: Atténuer l’action directe de Dieu en formulant certains actes de manière impersonnelle ou indirecte.
  rationale: Les verbes hébreux à la première personne soulignent l’action directe du Seigneur. La traduction maintient cette insistance sans ajouter d’explication sur les moyens humains employés.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « Je » est maintenue pour faire ressortir l’insistance du texte hébreu sur l’action divine. Aucun archaïsme ni note n’est nécessaire.
