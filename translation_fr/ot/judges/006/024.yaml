base_translation:
  language: en
  yaml_path: translation/ot/judges/006/024.yaml
  text: Then Gideon built an altar there to Yahweh and called it[a], “Yahweh Is Peace.” It remains there to this day in Ophrah of the Abiezrites.
translation:
  language: fr
  text: Alors Gédéon bâtit là un autel pour Yahweh et l’appela[a] « Yahweh est paix ». Il se trouve encore aujourd’hui à Ophra des Abiézérites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH shalom » ; traditionnellement translittéré « Yahweh-Shalom ».'
    reason: Signaler la forme hébraïque du nom donné à l’autel et sa translittération traditionnelle.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: bâtit
  rationale: Rend naturellement le verbe בנה dans un récit décrivant l’érection d’un autel.
- source_word: מִזְבֵּחַ
  choice: un autel
  rationale: Terme cultuel français courant et précis.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל indique ici la destination ou la dédicace de l’autel; le nom divin est translittéré.
- source_word: וַיִּקְרָא לוֹ
  choice: l’appela
  rationale: Dans ce contexte de dénomination, קרא + ל signifie donner un nom; le pronom renvoie à l’autel.
- source_word: יְהוָה שָׁלוֹם
  choice: Yahweh est paix
  rationale: La formulation conserve le nom commémoratif et rend en français la proposition nominale hébraïque sans en élargir le sens.
- source_word: שָׁלוֹם
  choice: paix
  rationale: « Paix » est le rendu concis le plus naturel dans ce nom, tout en laissant résonner les nuances de bien-être et d’intégrité.
- source_word: עַד הַיּוֹם הַזֶּה עוֹדֶנּוּ
  choice: Il se trouve encore aujourd’hui
  rationale: Expression française actuelle qui restitue la présence continue de l’autel jusqu’au temps du narrateur.
- source_word: בְּעָפְרָת
  choice: à Ofra
  rationale: La préposition française « à » convient à un nom de localité; עָפְרָה est translittéré selon l’usage français.
- source_word: אֲבִי הָעֶזְרִי
  choice: des Abiézerites
  rationale: Le gentilé désigne ici le clan auquel cette localité d’Ofra est rattachée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans la dédicace et dans le nom de l’autel
  choice: Yahweh / Yahweh est paix
  alternative: le SEIGNEUR / Le SEIGNEUR donne la paix
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le caractère personnel du nom. Le second membre reste une proposition nominale, sans transformer « paix » en action divine.
- issue: Nature de l’expression יְהוָה שָׁלוֹם
  choice: Yahweh est paix
  alternative: Yahweh donne la paix / Yahweh-Paix
  rationale: L’hébreu ne contient aucun verbe signifiant « donner ». L’ajout français de « est » rend sobrement la proposition nominale tout en préservant sa tension théologique.
translation_notes:
  register: Français international moderne, simple et digne. « Bâtit » conserve une tonalité narrative biblique sans être archaïque. La formulation évite de résoudre la proposition nominale en « donne la paix » et maintient le lien explicite avec le nom de l’autel.
