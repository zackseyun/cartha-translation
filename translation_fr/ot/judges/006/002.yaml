  yaml_path: translation/ot/judges/006/002.yaml
  text: And the hand of Midian prevailed against Israel[a]. Because of Midian, the sons of Israel made for themselves the dens that are in the mountains, and the caves[b], and the strongholds.
translation:
  language: fr
  text: Madian prit le dessus sur Israël[a]. À cause de Madian, les Israélites[b] se firent des abris dans les montagnes[c], ainsi que des grottes et des places fortes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « La main de Madian se fit forte contre Israël. » La « main » représente ici la puissance exercée.'
    reason: source_imagery
  - marker: b
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu est rare ; il peut désigner des trous, des retraites ou des abris.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּעָז יַד מִדְיָן עַל יִשְׂרָאֵל
  choice: Madian prit le dessus sur Israël
  rationale: Cette formulation française naturelle exprime la supériorité oppressive de Madian. Une note conserve l’image hébraïque de la « main », qui représente ici la puissance exercée.
- source_word: מִפְּנֵי מִדְיָן
  choice: À cause de Madian
  rationale: La locution indique que la menace exercée par Madian pousse les Israélites à chercher des refuges.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Le collectif français désigne naturellement l’ensemble du peuple, tandis qu’une note signale la forme littérale de l’hébreu.
- source_word: עָשׂוּ לָהֶם
  choice: se firent
  rationale: Le tour pronominal rend de façon concise le verbe « faire » accompagné du pronom d’intérêt « pour eux-mêmes ».
- source_word: הַמִּנְהָרוֹת אֲשֶׁר בֶּהָרִים
  choice: dans les montagnes, des abris
  rationale: Le nom hébreu rare semble désigner des trous, retraites ou abris. « Abris » préserve cette relative indétermination et évite de faire double emploi avec les grottes mentionnées ensuite; le complément locatif explicite leur emplacement.
- source_word: הַמְּעָרוֹת
  choice: des grottes
  rationale: Équivalent français courant et précis du terme hébreu désignant des cavités naturelles.
- source_word: הַמְּצָדוֹת
  choice: des places fortes
  rationale: L’expression désigne des lieux défendables ou fortifiés sans imposer l’idée de grandes forteresses construites.
