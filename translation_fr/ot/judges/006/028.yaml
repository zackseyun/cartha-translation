source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֜ימוּ אַנְשֵׁ֤י הָ/עִיר֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֤ה נֻתַּץ֙ מִזְבַּ֣ח הַ/בַּ֔עַל וְ/הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו כֹּרָ֑תָה וְ/אֵת֙ הַ/פָּ֣ר הַ/שֵּׁנִ֔י הֹֽעֲלָ֔ה עַל הַ/מִּזְבֵּ֖חַ הַ/בָּנֽוּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/028.yaml
  text: When the men of the city rose early in the morning[a], behold, the altar of Baal had been torn down, and the Asherah that was on it had been cut down[b], and the second bull had been offered up on the altar that had been built.
translation:
  language: fr
  text: Quand les hommes de la ville se levèrent de bon matin, voici que l’autel de Baal avait été démoli, l’Ashéra[a] qui se trouvait dessus avait été abattue, et le deuxième taureau avait été offert sur l’autel qui avait été construit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le poteau sacré d’Ashéra » ; hébreu : « l’Ashéra ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ
  choice: se levèrent de bon matin
  rationale: Le hiphil de שׁכם exprime le fait de se lever tôt ; cette tournure française naturelle conserve l’insistance temporelle.
- source_word: אַנְשֵׁי הָעִיר
  choice: les hommes de la ville
  rationale: Reproduit le masculin explicite du texte hébreu sans le neutraliser.
- source_word: וְהִנֵּה
  choice: voici
  rationale: Conserve l’effet de découverte soudaine et la vivacité narrative de הִנֵּה.
- source_word: נֻתַּץ
  choice: avait été démoli
  rationale: Le passif de נתץ désigne la destruction d’une construction telle qu’un autel ; le plus-que-parfait convient à ce que les hommes découvrent.
- source_word: מִזְבַּח הַבַּעַל
  choice: l’autel de Baal
  rationale: Rend directement la relation construite en hébreu.
- source_word: הָאֲשֵׁרָה
  choice: l’Ashéra
  rationale: La translittération évite de préciser indûment la forme exacte de cet objet cultuel associé à la déesse Ashéra.
- source_word: אֲשֶׁר עָלָיו
  choice: qui était dessus
  rationale: עַל signifie normalement « sur » ; « dessus » préserve cette relation spatiale tout en laissant ouverte sa configuration précise.
- source_word: כֹּרָתָה
  choice: avait été abattue
  rationale: Le passif de כרת indique ici qu’un objet cultuel en bois a été coupé ou abattu.
- source_word: הַפָּר הַשֵּׁנִי
  choice: le deuxième taureau
  rationale: Rend simplement פַּר et le rang exprimé par הַשֵּׁנִי, en lien avec le contexte précédent.
- source_word: הֹעֲלָה
  choice: avait été offert
  rationale: Le hophal de עלה a ici un sens sacrificiel ; « offert » le rend sans ajouter explicitement « holocauste ».
- source_word: הַמִּזְבֵּחַ הַבָּנוּי
  choice: l’autel qui avait été construit
  rationale: La proposition relative rend naturellement en français le participe passif défini.
theological_decisions:
- issue: Identification de הָאֲשֵׁרָה
  choice: l’Ashéra
  alternative: le poteau sacré d’Ashéra
  rationale: Le terme peut désigner la déesse, son symbole ou l’objet cultuel qui lui est associé. La translittération maintient cette ambiguïté, tandis que la note présente l’interprétation matérielle courante.
- issue: Rapport spatial exprimé par עָלָיו
  choice: qui était dessus
  alternative: qui était à côté de lui
  rationale: Le sens ordinaire de עַל est « sur ». Le texte ne contraint pas à remplacer cette formulation par la reconstruction contextuelle « à côté » ; la traduction conserve donc le rapport spatial littéral sans tenter d’en expliquer la disposition.
- issue: Valeur sacrificielle de הֹעֲלָה
  choice: avait été offert
  alternative: avait été offert en holocauste
  rationale: Le contexte évoque un holocauste, mais le verbe seul n’emploie pas ici le nom technique de l’holocauste. La formulation retenue préserve cette retenue lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. Le plus-que-parfait présente les actes accomplis que les hommes constatent au matin. « Voici » maintient la vivacité du récit biblique sans recourir à une tournure excessivement archaïque.
