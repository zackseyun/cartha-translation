id: JDG.6.1
reference: Judges 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד מִדְיָ֖ן שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/001.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and Yahweh gave them into the hand of Midian for seven years.
translation:
  language: fr
  text: Les fils d’Israël firent ce qui est mal aux yeux de Yahweh, et Yahweh les livra au pouvoir de Madian pendant sept ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rend littéralement la désignation collective masculine de l’hébreu et conserve la formule récurrente du livre des Juges.
- source_word: הָרַע
  choice: ce qui est mal
  rationale: Avec עשה, l’expression désigne une conduite moralement mauvaise; cette formulation est naturelle en français tout en gardant sa force évaluative.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Conserve l’image de l’idiome hébreu exprimant le jugement ou l’évaluation de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַיִּתְּנֵם
  choice: les livra
  rationale: Avec בְּיַד, נתן signifie ici remettre des personnes sous la domination d’un autre; « livra » exprime naturellement cette idée en français.
- source_word: בְּיַד מִדְיָן
  choice: au pouvoir de Madian
  rationale: Rend le sens de l’idiome hébreu littéralement « dans la main de Madian », où la main représente le pouvoir ou la domination.
- source_word: מִדְיָן
  choice: Madian
  rationale: Emploie la forme française conventionnelle de ce nom propre biblique.
- source_word: שֶׁבַע שָׁנִים
  choice: pendant sept ans
  rationale: Exprime naturellement en français la durée indiquée par le groupe nominal hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel au lieu de le remplacer par un titre.
- issue: Désignation collective בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix conserve la forme masculine plurielle et l’expression généalogique du texte, sans effacer son caractère collectif.
- issue: Image de la remise « dans la main » de Madian
  choice: au pouvoir de Madian
  alternative: entre les mains de Madian
  rationale: Le français explicite ici l’idée de domination portée par l’idiome, sans modifier l’affirmation théologique selon laquelle Yahweh soumet Israël à Madian.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de la formule hébraïque, tandis que « les livra au pouvoir de Madian » rend l’idiome de façon immédiatement intelligible.
