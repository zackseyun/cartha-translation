base_translation:
  language: en
  yaml_path: translation/ot/judges/006/015.yaml
  text: But he said to him[a], “Please, my lord, how can I save Israel? Look, my clan is the weakest in Manasseh[c][b], and I am the youngest in my father’s house.”
translation:
  language: fr
  text: 'Mais il lui répondit : « Pardon, mon seigneur, comment pourrais-je sauver Israël ? Ma famille est la plus faible de Manassé[a], et moi, je suis le plus jeune de la maison de mon père[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon clan est le plus pauvre » ou « le moins important de Manassé ». Le terme traduit par « famille » peut désigner une subdivision clanique; « faible » peut aussi évoquer la pauvreté ou un rang inférieur.
    reason: lexical_alternative
  - marker: b
    text: Ou « je suis le moins important dans la maison de mon père ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Pardon
  rationale: Cette particule introduit ici une demande respectueuse. « Pardon » rend naturellement la déférence de Gédéon en français moderne.
- source_word: אֲדֹנָי
  choice: mon seigneur
  rationale: Il s’agit d’une adresse respectueuse qui n’identifie pas nécessairement encore l’interlocuteur comme Dieu. La minuscule préserve l’ambiguïté narrative.
- source_word: בַּמָּה
  choice: comment pourrais-je
  rationale: L’expression demande par quel moyen Gédéon pourrait accomplir cette mission. Le conditionnel exprime naturellement son sentiment d’incapacité sans modifier le sens.
- source_word: אוֹשִׁיעַ
  choice: sauver
  rationale: Le hiphil de יָשַׁע signifie sauver ou délivrer. « Sauver » est clair, large et conforme au contexte.
- source_word: הִנֵּה
  choice: omis comme marqueur lexical autonome
  rationale: La particule attire l’attention sur l’explication qui suit. En français, cet effet est porté naturellement par l’enchaînement direct « Ma famille… », sans l’artificiel « Voici ».
- source_word: אַלְפִּי
  choice: ma famille
  rationale: Dans ce contexte sociotribal, אֶלֶף désigne une subdivision familiale ou clanique, et non littéralement mille personnes. « Famille » est immédiatement compréhensible; « clan » reste une autre possibilité.
- source_word: הַדַּל
  choice: la plus faible
  rationale: דַּל peut indiquer la faiblesse, la pauvreté ou l’insignifiance. « La plus faible » convient au contexte de capacité et de rang tout en laissant une note signaler les autres nuances.
- source_word: בִּמְנַשֶּׁה
  choice: de Manassé
  rationale: En français, « la plus faible de Manassé » exprime naturellement l’appartenance au groupe tribal.
- source_word: הַצָּעִיר
  choice: le plus jeune
  rationale: Dans le cadre de la maison paternelle, le sens lié à l’âge est naturel, même si le mot peut aussi évoquer le moindre rang.
- source_word: בְּבֵית אָבִי
  choice: de la maison de mon père
  rationale: Cette expression conserve l’image hébraïque traditionnelle de la maison paternelle tout en restant intelligible en français moderne.
theological_decisions:
- issue: Valeur de אֲדֹנָי dans l’adresse de Gédéon
  choice: « mon seigneur », en minuscules, comme formule respectueuse
  alternative: « Seigneur », comme titre divin
  rationale: À ce point du récit, l’identité de l’interlocuteur n’est pas encore pleinement explicitée du point de vue de Gédéon. La minuscule conserve cette tension narrative au lieu de la trancher.
