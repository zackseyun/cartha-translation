  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֗וֹן תָּמ֣וֹת נַפְשִׁ/י֮ עִם פְּלִשְׁתִּים֒ וַ/יֵּ֣ט בְּ/כֹ֔חַ וַ/יִּפֹּ֤ל הַ/בַּ֨יִת֙ עַל הַ/סְּרָנִ֔ים וְ/עַל כָּל הָ/עָ֖ם אֲשֶׁר בּ֑/וֹ וַ/יִּהְי֤וּ הַ/מֵּתִים֙ אֲשֶׁ֣ר הֵמִ֣ית בְּ/מוֹת֔/וֹ רַבִּ֕ים מֵ/אֲשֶׁ֥ר הֵמִ֖ית בְּ/חַיָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/030.yaml
  text: And Samson said[a], “Let me die with the Philistines.” Then he bent with all his strength, and the house fell on the rulers and on all the people who were in it[c][b]. So the dead whom he killed at his death were more than those whom he had killed during his life.
translation:
  language: fr
  text: 'Samson dit : « Que je meure[a] avec les Philistins ! » Puis il se pencha de toute sa force, et la maison[b] s’effondra sur les dirigeants[c] et sur tout le peuple qui s’y trouvait. Ceux qu’il fit mourir en mourant furent plus nombreux que ceux qu’il avait fait mourir durant sa vie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Que mon âme meure avec les Philistins. » Le mot hébreu traditionnellement rendu par « âme » désigne ici Samson lui-même.'
    reason: lexical_alternative
  - marker: b
    text: Ou « le bâtiment ». L’hébreu emploie le mot ordinaire signifiant « maison ».
    reason: lexical_alternative
  - marker: c
    text: Ou « les seigneurs » des Philistins.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמוֹת נַפְשִׁי
  choice: Que je meure
  rationale: Littéralement, « que ma personne/mon être meure ». Ici, נֶפֶשׁ désigne idiomatiquement Samson lui-même. « Que je meure » restitue naturellement la valeur volitive sans introduire une distinction métaphysique entre Samson et son âme.
- source_word: עִם פְּלִשְׁתִּים
  choice: avec les Philistins
  rationale: עִם signifie simplement « avec » et exprime ici la volonté de Samson de mourir en même temps que les Philistins.
- source_word: וַיֵּט בְּכֹחַ
  choice: il se pencha de toute sa force
  rationale: נטה peut signifier « incliner, pencher, étendre ». Dans la scène des colonnes, la formulation décrit le mouvement corporel soutenu par un effort intense; « de toute sa force » rend idiomatiquement בְּכֹחַ dans ce contexte.
- source_word: הַבַּיִת
  choice: la maison
  rationale: בַּיִת est le terme hébreu ordinaire pour une maison ou un bâtiment. Le choix formel « maison » évite d’expliciter « temple », que seul le contexte permettrait d’inférer.
- source_word: הַסְּרָנִים
  choice: les dirigeants
  rationale: Le terme désigne les chefs politiques philistins. « Dirigeants » est clair en français moderne et évite les connotations féodales que pourrait porter « seigneurs ».
- source_word: כָּל הָעָם אֲשֶׁר בּוֹ
  choice: tout le peuple qui s’y trouvait
  rationale: Cette formulation conserve la totalité exprimée par כָּל et rend naturellement la proposition relative indiquant la présence des gens dans l’édifice.
- source_word: אֲשֶׁר הֵמִית בְּמוֹתוֹ
  choice: qu’il fit mourir en mourant
  rationale: La tournure française conserve le lien étroit entre les morts causées par Samson et sa propre mort, tout en restant naturelle et concise.
- source_word: רַבִּים מֵאֲשֶׁר
  choice: furent plus nombreux que ceux que
  rationale: La construction comparative indique que le nombre de personnes tuées lors de sa mort dépassa celui des personnes tuées auparavant, sans exiger l’ajout emphatique de « beaucoup ».
- source_word: בְּחַיָּיו
  choice: durant sa vie
  rationale: Cette expression temporelle rend clairement le contraste avec les morts causées au moment où Samson meurt.
theological_decisions:
- issue: Traduire la dernière parole de Samson sans importer une doctrine particulière de l’âme
  choice: Que je meure avec les Philistins
  alternative: Que mon âme meure avec les Philistins
  rationale: Dans ce passage, נֶפֶשׁ fonctionne idiomatiquement comme une désignation de la personne elle-même. La traduction retenue communique le sens narratif sans transformer la phrase en affirmation anthropologique sur une âme distincte du corps.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible, tandis que « fit mourir » maintient le contraste littéraire entre la mort de Samson et les morts qu’il provoque. Les notes signalent les principaux équivalents plus littéraux sans alourdir le texte.
