base_translation:
  language: en
  yaml_path: translation/ot/judges/016/002.yaml
  text: The Gazites were told[a], saying, “Samson has come here.” So they surrounded him and lay in wait for him all night at the city gate. They kept quiet all night, saying, “Until the light of morning[c][b], then we will kill him.”
translation:
  language: fr
  text: 'On fit savoir aux habitants de Gaza[a] : « Samson est arrivé ici. » Alors ils se déployèrent autour et lui tendirent une embuscade toute la nuit, à la porte de la ville. Ils gardèrent le silence[c] toute la nuit, en se disant : « Dès les premières lueurs du matin, nous le tuerons[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux habitants de Gaza, disant ». L''hébreu emploie une formule elliptique de discours rapporté, rendue en français par « On fit savoir ».'
    reason: ambiguïté syntaxique
  - marker: c
    text: 'Ou : « ils restèrent silencieux » ou « ils se tinrent tranquilles » ; l''expression évoque leur discrétion pendant l''embuscade.'
    reason: alternative lexicale
  - marker: d
    text: 'Littéralement : « jusqu''à la lumière du matin, et nous le tuerons ».'
    reason: forme littérale
lexical_decisions:
- source_word: לַעַזָּתִים
  choice: les habitants de Gaza
  rationale: Le gentilé pluriel désigne la population de Gaza. Cette formulation est naturelle en français international et évite le rare « Gazaouites ».
- source_word: לֵאמֹר
  choice: 'On informa … :'
  rationale: Le texte hébreu dit littéralement « aux habitants de Gaza, en disant », sans verbe principal exprimé. Le français supplée naturellement l'idée qu'une information leur parvient.
- source_word: בָּא שִׁמְשׁוֹן הֵנָּה
  choice: Samson est arrivé ici
  rationale: L'accompli présente l'arrivée de Samson comme un fait désormais pertinent. Le passé composé convient à ce constat en français.
- source_word: וַיָּסֹבּוּ
  choice: ils encerclèrent les lieux
  rationale: Le verbe exprime l'action de faire le tour ou d'encercler, mais aucun complément d'objet n'est formulé dans l'hébreu. « les lieux » explicite sobrement la portée locale de l'action sans affirmer que Samson lui-même fut physiquement encerclé.
- source_word: וַיֶּאֶרְבוּ לוֹ
  choice: lui tendirent une embuscade
  rationale: Rend idiomatiquement l'attente hostile et dissimulée exprimée par ארב avec ל.
- source_word: בְּשַׁעַר הָעִיר
  choice: à la porte de la ville
  rationale: Désigne la zone de la porte, point stratégique par lequel Samson devait sortir.
- source_word: וַיִּתְחָרְשׁוּ
  choice: gardèrent le silence
  rationale: Dans le contexte de l'embuscade, la forme exprime une attente silencieuse et discrète; elle peut aussi suggérer qu'ils restèrent sans agir.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: Attendons les premières lueurs du matin
  rationale: Littéralement « jusqu'à la lumière du matin ». La formulation française rend la limite temporelle implicite du projet et conserve l'image de la lumière naissante.
- source_word: וַהֲרְגְנֻהוּ
  choice: alors nous le tuerons
  rationale: La forme signifie « et nous le tuerons ». « alors » explicite en français la succession temporelle déjà donnée par la proposition précédente.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le récit reste vif et accessible. La répétition de « toute la nuit », présente deux fois dans l'hébreu, est conservée. Les ajouts nécessaires à l'idiome français sont signalés lorsqu'ils touchent une construction elliptique ou ambiguë.
