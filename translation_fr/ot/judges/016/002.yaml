  naturalness: Le français est globalement clair et d'un registre approprié. « Ils se déployèrent autour » évite l'ajout de « les lieux » tout en restant idiomatique dans le contexte d'une embuscade. « Dès les premières lueurs du matin » rend naturellement la séquence temporelle.
