base_translation:
  language: en
  yaml_path: translation/ot/judges/016/014.yaml
  text: Then she fastened it with the pin and said to him[a], “The Philistines are upon you[c][b], Samson!” And he awoke from his sleep and pulled away the pin of the loom and the web.
translation:
  language: fr
  text: 'Puis elle fixa le tout avec la cheville[a] et lui dit : « Les Philistins sont sur toi, Samson ! » Il se réveilla et arracha[b] la cheville du métier à tisser ainsi que l’étoffe[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le piquet ». Le mot hébreu peut désigner un piquet ou une cheville.
    reason: lexical_alternative
  - marker: b
    text: Ou « retira d’un coup ». Le verbe hébreu peut exprimer un enlèvement énergique.
    reason: lexical_alternative
  - marker: c
    text: Ou « le tissu ». Le terme hébreu désigne ici la matière tissée sur le métier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְקַע
  choice: elle fixa le tout
  rationale: Le verbe תקע exprime ici l’action d’enfoncer ou d’assujettir. « Fixa » rend naturellement le résultat dans le contexte du tissage; « le tout » reprend explicitement, sans en préciser davantage le mécanisme, l’agencement décrit au verset précédent.
- source_word: בַּיָּתֵד
  choice: avec la cheville
  rationale: יָתֵד peut désigner un piquet ou une cheville. Dans le cadre d’un métier à tisser, « cheville » évoque plus naturellement une pièce servant à maintenir l’ensemble.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Les Philistins sont sur toi
  rationale: Cette formulation conserve l’image et l’urgence de la formule d’alarme hébraïque répétée dans le récit, tout en restant compréhensible en français.
- source_word: וַיִּיקַץ מִשְּׁנָתוֹ
  choice: Il se réveilla
  rationale: Le verbe français suffit à exprimer le réveil après le sommeil; répéter « de son sommeil » serait naturel mais redondant en français moderne.
- source_word: וַיִּסַּע
  choice: arracha
  rationale: Dans ce contexte, נסע indique l’enlèvement énergique des éléments du métier retenus par les cheveux de Samson. « Arracha » restitue cette force sans évoquer le sens de déplacement que le verbe peut avoir ailleurs.
- source_word: הַיְתַד הָאֶרֶג
  choice: la cheville du métier à tisser
  rationale: Cette expression relie clairement la cheville au dispositif de tissage. L’ajout de « à tisser » évite que « métier » soit compris au sens de profession.
- source_word: הַמַּסָּכֶת
  choice: l’étoffe
  rationale: מַסָּכֶת désigne ici la matière tissée sur le métier. « Étoffe » est courant et digne, tout en évitant le terme technique et potentiellement trop précis « chaîne ».
theological_decisions: []
