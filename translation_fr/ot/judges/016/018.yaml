  text: וַ/תֵּ֣רֶא דְלִילָ֗ה כִּֽי הִגִּ֣יד לָ/הּ֮ אֶת כָּל לִבּ/וֹ֒ וַ/תִּשְׁלַ֡ח וַ/תִּקְרָא֩ לְ/סַרְנֵ֨י פְלִשְׁתִּ֤ים לֵ/אמֹר֙ עֲל֣וּ הַ/פַּ֔עַם כִּֽי הִגִּ֥יד ל/ה אֶת כָּל לִבּ֑/וֹ וְ/עָל֤וּ אֵלֶ֨י/הָ֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים וַ/יַּעֲל֥וּ הַ/כֶּ֖סֶף בְּ/יָדָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/018.yaml
  text: When Delilah saw that he had told her all his heart[a], she sent and called for the Philistine rulers, saying, “Come up this time[c][b], for he has told her all his heart.” Then the Philistine rulers came up to her and brought the silver in their hands.
translation:
  language: fr
  text: 'Quand Dalila vit qu’il lui avait confié tout ce qu’il avait dans le cœur, elle envoya appeler les chefs des Philistins[a] et leur dit : « Montez cette fois-ci, car il lui a confié tout ce qu’il avait dans le cœur[b]. » Les chefs des Philistins montèrent chez elle, l’argent en main[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les gouverneurs philistins » ; traditionnellement : « les seigneurs des Philistins ».'
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu reçu dit littéralement « il lui a raconté tout son cœur ». Dans ce discours direct, on pourrait s’attendre à « il m’a confié tout ce qu’il avait dans le cœur », mais la traduction conserve la troisième personne du texte hébreu.
    reason: textual_variant
  - marker: c
    text: 'Littéralement : « l’argent dans leur main » ; il s’agit de la somme promise à Dalila.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Quand Dalila vit
  rationale: Le verbe ראה garde son sens concret de « voir », tandis que « quand » rend naturellement la progression temporelle du récit sans introduire l’interprétation plus forte « comprit ».
- source_word: הִגִּיד לָהּ אֶת־כָּל לִבּוֹ
  choice: il lui avait ouvert tout son cœur
  rationale: Cette formulation française naturelle conserve l’image du cœur et exprime la révélation complète impliquée par נגד au hifil. Le plus-que-parfait situe cette confidence avant la réaction de Dalila.
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: elle envoya appeler
  rationale: La tournure idiomatique française rend les deux actions liées, l’envoi d’un message et la convocation, sans lourdeur.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: les chefs des Philistins
  rationale: סרן désigne les hauts responsables propres à l’organisation philistine. « Chefs » est clair en français moderne et évite les connotations féodales de « seigneurs ».
- source_word: עֲלוּ הַפַּעַם
  choice: Montez cette fois-ci
  rationale: « Montez » préserve le mouvement exprimé par עלה vers le lieu où se trouve Dalila, et « cette fois-ci » traduit הַפַּעַם en signalant que l’occasion est désormais réelle.
- source_word: כִּי הִגִּיד לָהּ אֶת־כָּל לִבּוֹ
  choice: car il lui a ouvert tout son cœur
  rationale: Le texte hébreu reçu emploie le pronom féminin de troisième personne, « lui », même dans le discours direct. La traduction le conserve plutôt que de corriger silencieusement en « m’ ».
- source_word: וְעָלוּ אֵלֶיהָ
  choice: montèrent donc chez elle
  rationale: « Montèrent » maintient le verbe עלה et « chez elle » rend naturellement la destination personnelle אֵלֶיהָ dans ce contexte.
- source_word: וַיַּעֲלוּ הַכֶּסֶף בְּיָדָם
  choice: l’argent en main
  rationale: La formule concise conserve l’idée qu’ils apportaient effectivement le paiement avec eux. « Argent » rend ici הַכֶּסֶף, qui peut désigner le métal précieux ou la somme versée.
