  text: וַ/יַּעֲלוּ לָ֞/הּ סַרְנֵ֣י פְלִשְׁתִּ֗ים שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וַ/תַּאַסְרֵ֖/הוּ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/008.yaml
  text: So the Philistine rulers brought up to her seven fresh bowstrings that had not been dried[a], and she bound him with them.
translation:
  language: fr
  text: Les chefs des Philistins[a] lui apportèrent sept cordes d’arc encore humides, qui n’avaient pas séché, et elle l’attacha avec elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les seigneurs des Philistins ». Le terme hébreu désigne les principaux dirigeants philistins.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: lui apportèrent
  rationale: Le hiphil de עלה signifie littéralement « faire monter » ou « apporter ». Dans ce contexte, les chefs fournissent à Dalila les liens demandés ; « lui apportèrent » rend naturellement l’action en français.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: les chefs philistins
  rationale: סַרְנֵי désigne les principaux dirigeants politiques des Philistins. « Chefs philistins » est clair, actuel et suffisamment digne, sans connotation féodale.
- source_word: יְתָרִים
  choice: cordes d’arc
  rationale: Le terme désigne ici vraisemblablement des cordes servant aux arcs plutôt que des cordes génériques. « Cordes d’arc » conserve cette précision lexicale.
- source_word: לַחִים
  choice: encore fraîches
  rationale: L’adjectif exprime l’état humide ou frais d’une matière qui n’a pas séché. « Encore fraîches » s’accorde naturellement avec la proposition explicative qui suit.
- source_word: אֲשֶׁר לֹא חֹרָבוּ
  choice: qui n’avaient pas été séchées
  rationale: 'Cette formulation préserve la valeur passive ou résultative du texte hébreu : les cordes n’avaient pas subi le séchage.'
- source_word: וַתַּאַסְרֵהוּ
  choice: elle l’attacha
  rationale: אסר signifie attacher ou lier. « Elle l’attacha » est naturel en français narratif et exprime clairement l’action sans ajouter l’idée d’emprisonnement.
- source_word: בָּהֶם
  choice: avec elles
  rationale: La préposition indique le moyen employé ; « avec elles » est la formulation française la plus directe, avec un pronom accordé à « cordes ».
