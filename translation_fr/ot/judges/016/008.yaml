revisions:
- from: Les chefs philistins[a] lui apportèrent donc sept cordes d’arc encore fraîches, qui n’avaient pas été séchées, et elle l’attacha avec elles.
  to: Les chefs des Philistins[a] lui apportèrent sept cordes d’arc encore humides, qui n’avaient pas séché, et elle l’attacha avec elles.
  rationale: La révision améliore l’idiomaticité française et évite de suggérer un séchage délibéré, tout en préservant la précision du texte source sur l’état humide et non sec des cordes. Aucun enjeu théologique ou ambiguïté textuelle supplémentaire n’est introduit.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:40:02Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : les dirigeants philistins fournissent à Dalila sept liens associés à des arcs, encore dans un état non sec, puis elle attache Samson avec eux. « Qui n’avaient pas été séchées » peut toutefois suggérer un séchage intentionnel subi, alors que l’hébreu décrit plus simplement des cordes qui n’avaient pas séché.'
  naturalness: « Encore fraîches » appliqué à des cordes est compréhensible, mais peu idiomatique en français moderne. « Encore humides, qui n’avaient pas séché » est naturel et conserve les deux éléments descriptifs du texte. « Les chefs des Philistins » est également plus fluide que l’adjectif ethnique postposé dans ce groupe nominal.
  terminology: « Cordes d’arc » rend de façon défendable יְתָרִים dans ce contexte. La note est ajustée afin de donner l’alternative traditionnelle et lexicalement proche « seigneurs », sans présenter « gouverneurs » comme une équivalence trop administrative.
  issues:
  - severity: low
    issue: « encore fraîches » pour des cordes
    rationale: Cette expression est moins naturelle en français que « encore humides » et peut évoquer la nouveauté plutôt que l’humidité.
  - severity: low
    issue: « n’avaient pas été séchées »
    rationale: La tournure passive peut impliquer une action de séchage volontaire qui n’est pas explicitée par l’hébreu ; « n’avaient pas séché » rend l’état résultant sans ajout.
  - severity: low
    issue: Formulation de la note
    rationale: « Seigneurs des Philistins » est une alternative plus directement liée à la valeur titulaire traditionnelle de סַרְנֵי que « gouverneurs ».
  revised_text: Les chefs des Philistins[a] lui apportèrent sept cordes d’arc encore humides, qui n’avaient pas séché, et elle l’attacha avec elles.
  revised_footnotes:
  - marker: a
    text: Ou « les seigneurs des Philistins ». Le terme hébreu désigne les principaux dirigeants philistins.
    reason: lexical_alternative
  revision_rationale: La révision améliore l’idiomaticité française et évite de suggérer un séchage délibéré, tout en préservant la précision du texte source sur l’état humide et non sec des cordes. Aucun enjeu théologique ou ambiguïté textuelle supplémentaire n’est introduit.
