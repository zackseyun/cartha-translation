  text: וַ/יַּעֲל֨וּ אֵלֶ֜י/הָ סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֨אמְרוּ לָ֜/הּ פַּתִּ֣י אוֹת֗/וֹ וּ/רְאִי֙ בַּ/מֶּה֙ כֹּח֣/וֹ גָד֔וֹל וּ/בַ/מֶּה֙ נ֣וּכַל ל֔/וֹ וַ/אֲסַרְנֻ֖/הוּ לְ/עַנֹּת֑/וֹ וַ/אֲנַ֨חְנוּ֙ נִתַּן לָ֔/ךְ אִ֕ישׁ אֶ֥לֶף וּ/מֵאָ֖ה כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/005.yaml
  text: Then the lords of the Philistines came up to her and said to her[a], “Entice him, and see in what his great strength lies, and by what means we may prevail against him, so that we may bind him to afflict him; and we will each give you eleven hundred pieces of silver.”
translation:
  language: fr
  text: 'Alors les chefs des Philistins vinrent auprès d’elle et lui dirent : « Séduis-le et découvre d’où lui vient sa grande force, et comment nous pourrons l’emporter sur lui, afin de le ligoter et de l’affliger. Chacun de nous te donnera mille cent pièces d’argent[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mille cent d’argent ». Il s’agit probablement de pièces ou de sicles d’argent donnés par chacun des chefs philistins.'
    reason: L’unité monétaire est sous-entendue en hébreu, et non explicitement nommée.
lexical_decisions:
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: montèrent vers elle
  rationale: Le verbe עלה exprime littéralement une montée ou un déplacement vers elle. Cette formulation conserve la nuance directionnelle sans préciser un point de vue absent de l’hébreu.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: les chefs des Philistins
  rationale: סרן désigne les dirigeants des cités philistines. « Chefs » est naturel en français moderne et évite la connotation féodale de « seigneurs ».
- source_word: פַּתִּי אוֹתוֹ
  choice: Attire-le dans un piège
  rationale: Le piel de פתה implique ici une séduction ou persuasion trompeuse destinée à obtenir un secret. La traduction explicite la manœuvre sans lui donner nécessairement un caractère sexuel.
- source_word: וּרְאִי בַּמֶּה כֹּחוֹ גָדוֹל
  choice: et découvre d’où lui vient sa grande force
  rationale: במה interroge ici le fondement ou la source de sa force. « Découvre d’où lui vient » rend naturellement cette recherche en français tout en gardant « grande force » explicite.
- source_word: וּבַמֶּה נוּכַל לוֹ
  choice: et comment nous pourrons l’emporter sur lui
  rationale: L’expression יכל ל signifie avoir le dessus sur quelqu’un ou l’emporter sur lui. « Comment » rend naturellement le second במה dans ce contexte.
- source_word: וַאֲסַרְנֻהוּ
  choice: afin de le ligoter
  rationale: אסר signifie attacher ou lier. Le lien de finalité avec la proposition précédente est naturel ici; « ligoter » convient à une capture physique.
- source_word: לְעַנֹּתוֹ
  choice: et de le réduire à l’impuissance
  rationale: Le piel de ענה peut signifier affliger, humilier, maltraiter ou soumettre. Dans ce contexte de neutralisation, cette traduction conserve l’idée de domination pénible sans imposer celle de torture.
- source_word: וַאֲנַחְנוּ נִתַּן לָךְ אִישׁ אֶלֶף וּמֵאָה כָּסֶף
  choice: Chacun de nous te donnera mille cent pièces d’argent
  rationale: 'איש a une valeur distributive: chacun des chefs. L’hébreu dit littéralement « mille cent argent »; « pièces d’argent » complète naturellement l’expression sans inscrire « sicles » dans le texte.'
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les paroles restent directes et menaçantes, sans archaïsmes. La répétition hébraïque de במה est rendue par deux formulations françaises complémentaires afin de distinguer la source de la force du moyen de vaincre Samson.
