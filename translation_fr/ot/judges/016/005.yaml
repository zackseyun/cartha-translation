review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement les chefs philistins, la recherche de la source de la force de Samson, le moyen de triompher de lui et la contribution distributive de chacun. Toutefois, « le réduire à l’impuissance » restreint indûment לְעַנֹּתוֹ à la neutralisation : le verbe hébreu exprime plus largement l’affliction, le mauvais traitement ou l’humiliation infligés après la capture.'
  naturalness: Le français est globalement naturel et de registre narratif moderne. « Vinrent auprès d’elle » est plus idiomatique que « montèrent vers elle » en français tout en conservant l’idée d’un mouvement vers elle. « Le séduire » rend de façon concise la persuasion trompeuse demandée, sans affirmer que la séduction serait sexuelle.
  terminology: « Chefs des Philistins », « grande force », « ligoter » et « pièces d’argent » conviennent. La note maintient à juste titre l’incertitude sur l’unité monétaire et la valeur distributive de « chacun ».
  issues:
  - severity: medium
    issue: « de le réduire à l’impuissance » pour לְעַנֹּתוֹ
    rationale: Cette expression interprète le but comme une simple mise hors d’état de nuire, alors que le piel de ענה vise l’affliction ou le mauvais traitement. « Pour l’affliger » conserve la portée large et hostile du terme.
  - severity: low
    issue: « montèrent vers elle »
    rationale: Le calque de עלה est possible, mais il est peu naturel ici en français. « Vinrent auprès d’elle » rend idiomatiquement le déplacement vers elle sans ajouter de précision géographique.
