revisions:
- from: 'Alors les chefs des Philistins montèrent vers elle et lui dirent : « Attire-le dans un piège et découvre d’où lui vient sa grande force, et comment nous pourrons l’emporter sur lui, afin de le ligoter et de le réduire à l’impuissance. Chacun de nous te donnera mille cent pièces d’argent[a]. »'
  to: 'Alors les chefs des Philistins vinrent auprès d’elle et lui dirent : « Séduis-le et découvre d’où lui vient sa grande force, et comment nous pourrons l’emporter sur lui, afin de le ligoter et de l’affliger. Chacun de nous te donnera mille cent pièces d’argent[a]. »'
  rationale: La révision remplace une interprétation réductrice de l’affliction prévue contre Samson par un terme français qui en préserve l’ampleur. Elle améliore aussi légèrement l’idiomaticité du verbe de mouvement. Le reste, y compris l’ambiguïté de l’unité d’argent, est conservé.
