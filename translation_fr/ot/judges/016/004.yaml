  text: וַֽ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יֶּאֱהַ֥ב אִשָּׁ֖ה בְּ/נַ֣חַל שֹׂרֵ֑ק וּ/שְׁמָ֖/הּ דְּלִילָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/004.yaml
  text: After this[a], he loved a woman in the Valley of Sorek, and her name was Delilah.
translation:
  language: fr
  text: Après cela, il aima une femme dans la vallée de Soreq[a]. Elle s’appelait Dalila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « près de l’oued de Soreq ». Le mot hébreu נַחַל peut désigner une vallée, le lit d’un cours d’eau ou un cours d’eau saisonnier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette formulation rend naturellement en français la succession temporelle exprimée par la formule narrative hébraïque, sans conserver inutilement le tour littéral « Et il arriva après cela ».
- source_word: וַיֶּאֱהַב
  choice: il aima
  rationale: Le verbe אָהַב signifie directement « aimer ». « Il aima » respecte cette simplicité sans ajouter la nuance plus précise de « tomber amoureux ».
- source_word: אִשָּׁה
  choice: une femme
  rationale: Le nom peut désigner une femme ou une épouse selon le contexte. Aucun mariage n’étant indiqué ici, « une femme » est le choix le plus neutre.
- source_word: בְּנַחַל שֹׂרֵק
  choice: dans la vallée de Soreq
  rationale: נַחַל peut désigner une vallée, le lit d’un cours d’eau ou un cours d’eau saisonnier. « Vallée » est clair et naturel dans le corps du texte; la note préserve l’autre possibilité géographique.
- source_word: וּשְׁמָהּ
  choice: Elle s’appelait
  rationale: Cette tournure française actuelle et naturelle communique fidèlement l’introduction explicite du nom, littéralement « et son nom était ».
- source_word: דְּלִילָה
  choice: Dalila
  rationale: La forme française traditionnelle et largement reconnue du nom personnel est conservée.
