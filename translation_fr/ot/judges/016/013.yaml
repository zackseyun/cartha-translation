  source_fidelity: La traduction rend correctement l’accusation de tromperie, l’injonction et les « sept mèches ». Toutefois, « la chaîne du métier à tisser » fixe de façon trop précise le sens de הַמַּסָּכֶת, terme technique dont le référent exact demeure discuté. Une formulation plus générale, accompagnée d’une note, préserve mieux l’ambiguïté du texte source.
  naturalness: Le français est globalement naturel et de registre narratif approprié. « Avec quoi tu pourrais être attaché » rend plus directement le passif potentiel hébreu que l’impersonnel « avec quoi on peut t’attacher ».
  terminology: Les noms Dalila et Samson, ainsi que « mèches », sont appropriés. « Toile » offre ici un équivalent français naturel et suffisamment non technique pour le terme de tissage incertain; la note explicite les possibilités sans imposer « chaîne ».
