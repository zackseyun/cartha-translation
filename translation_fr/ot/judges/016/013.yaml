base_translation:
  language: en
  yaml_path: translation/ot/judges/016/013.yaml
  text: Then Delilah said to Samson[a], “Until now you have mocked me and told me lies. Tell me what you may be bound with.” And he said to her, “If you weave the seven locks of my head with the web.”
translation:
  language: fr
  text: 'Alors Dalila dit à Samson : « Jusqu’ici, tu t’es joué de moi et tu m’as raconté des mensonges. Dis-moi avec quoi tu pourrais être attaché. » Il lui répondit : « Si tu tisses les sept mèches de mes cheveux avec la toile[a]… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est un terme technique de tissage dont le sens précis est incertain. Il peut désigner la toile ou le tissu en cours de tissage, et peut-être un élément du métier à tisser.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתַלְתָּ בִּי
  choice: tu t’es joué de moi
  rationale: Cette expression rend l’idée de traiter quelqu’un comme un jouet, de le tromper et de se moquer de lui, sans répéter inutilement la notion explicite de mensonge qui suit.
- source_word: כְּזָבִים
  choice: des mensonges
  rationale: Équivalent français courant et direct du pluriel hébreu.
- source_word: הַגִּידָה לִּי
  choice: Dis-moi
  rationale: Impératif naturel en français moderne, fidèle au sens courant du verbe נגד dans ce contexte.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: avec quoi on peut t’attacher
  rationale: La formulation conserve la valeur instrumentale de בַּמֶּה (« avec quoi ») et rend naturellement en français le passif hébreu.
- source_word: תַּאַרְגִי
  choice: tu tisses
  rationale: Le verbe ארג désigne proprement l’action de tisser; ce choix préserve l’image du métier à tisser.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשִׁי
  choice: les sept mèches de mes cheveux
  rationale: « Mèches » laisse ouverte la question de savoir s’il s’agit de tresses ou de touffes, tandis que « cheveux » exprime naturellement en français ce que l’hébreu formule littéralement par « de ma tête ».
- source_word: עִם הַמַּסָּכֶת
  choice: avec la chaîne du métier à tisser
  rationale: Dans cette scène de tissage, מַסֶּכֶת est un terme technique probablement lié à la chaîne ou à l’étoffe montée sur le métier. La traduction retenue rend l’action compréhensible tout en signalant l’incertitude en note.
