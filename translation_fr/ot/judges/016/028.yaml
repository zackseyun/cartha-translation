  text: וַ/יִּקְרָ֥א שִׁמְשׁ֛וֹן אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהֹוִ֡ה זָכְרֵ֣/נִי נָא֩ וְ/חַזְּקֵ֨/נִי נָ֜א אַ֣ךְ הַ/פַּ֤עַם הַ/זֶּה֙ הָ/אֱלֹהִ֔ים וְ/אִנָּקְמָ֧ה נְקַם אַחַ֛ת מִ/שְּׁתֵ֥י עֵינַ֖/י מִ/פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/028.yaml
  text: Then Samson called to Yahweh and said[a], “Lord GOD, please remember me, and please strengthen me just this once, O God, so that I may take vengeance on the Philistines for my two eyes with one act of vengeance.”
translation:
  language: fr
  text: 'Alors Samson invoqua Yahvé et dit : « Seigneur Yahvé, souviens-toi de moi, je t’en prie ! Donne-moi de la force, je t’en prie, rien que cette fois, ô Dieu, afin que je tire des Philistins une seule vengeance pour mes deux yeux[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin que je tire des Philistins une vengeance, une, pour mes deux yeux ». Le mot « une » qualifie « vengeance », non « yeux »; l’expression renvoie à l’aveuglement de Samson par les Philistins.'
    reason: La note rend compte de la construction à cognat et prévient l’interprétation selon laquelle Samson ne demanderait vengeance que pour un seul de ses yeux.
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל־יְהוָה
  choice: invoqua Yahvé
  rationale: Avec אֶל et Dieu pour complément, קרא signifie appeler Dieu ou faire appel à lui. « Invoqua » convient naturellement au contexte de prière et « Yahvé » représente le nom divin.
- source_word: אֲדֹנָי יֱהֹוִה
  choice: Seigneur Yahvé
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom divin écrit יהוה, sans les confondre en un seul terme générique.
- source_word: זָכְרֵנִי נָא
  choice: souviens-toi de moi, je t’en prie
  rationale: L’impératif et la particule נָא expriment une supplication pressante mais respectueuse.
- source_word: וְחַזְּקֵנִי נָא
  choice: Donne-moi de la force, je t’en prie
  rationale: Le piel de חזק demande à Dieu de communiquer la force. Cette tournure est plus naturelle en français courant que « fortifie-moi » tout en restant précise.
- source_word: אַךְ הַפַּעַם הַזֶּה
  choice: rien que cette fois
  rationale: La formule limite explicitement la demande à cette seule occasion.
- source_word: וְאִנָּקְמָה ... מִפְּלִשְׁתִּים
  choice: afin que je me venge des Philistins
  rationale: La forme cohortative exprime ici le but recherché et la volonté de Samson; « se venger de » est la construction française idiomatique.
- source_word: נְקַם אַחַת מִשְּׁתֵי עֵינַי
  choice: ne serait-ce que pour l’un de mes deux yeux
  rationale: אַחַת, féminin, s’accorde naturellement avec l’idée elliptique d’un seul des deux yeux plutôt qu’avec נְקַם, généralement masculin. La formulation restitue la limitation frappante de la demande sans l’aplanir.
theological_decisions:
- issue: Noms et titres divins dans la prière de Samson
  choice: « Yahvé » pour יהוה et « Seigneur Yahvé » pour אֲדֹנָי יהוה
  alternative: « l’Éternel » et « Seigneur DIEU »
  rationale: Le choix conserve le nom personnel divin ainsi que le titre distinct qui le précède dans la seconde invocation.
- issue: Portée de la vengeance demandée
  choice: « pour l’un de mes deux yeux »
  alternative: « pour mes deux yeux, par un seul acte de vengeance »
  rationale: L’accord féminin de אַחַת favorise son rattachement elliptique à « œil »; la traduction conserve ainsi la formulation paradoxale selon laquelle Samson ne réclame vengeance que pour un seul de ses deux yeux.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « je t’en prie » est maintenue parce que נָא apparaît deux fois et souligne l’intensité de la supplication.
