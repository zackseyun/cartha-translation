revisions:
- from: 'Alors Dalila prit des cordes neuves[a], l’en attacha et lui dit : « Les Philistins sont sur toi, Samson ! » L’homme qui se tenait en embuscade[b] était assis dans la chambre intérieure[c]. Mais Samson arracha les cordes de ses bras comme si elles n’étaient qu’un fil.'
  to: 'Alors Dalila prit des cordes neuves[a] et l’attacha avec elles. Puis elle lui dit : « Les Philistins sont sur toi, Samson ! » L’homme embusqué[b] était assis dans la chambre intérieure[c]. Alors Samson les arracha de ses bras comme un fil.'
  rationale: La révision corrige la construction fautive du verbe « attacher », conserve la valeur instrumentale des cordes, et rend la comparaison finale de manière directe. Le singulier hébreu pour le guetteur est maintenu dans le texte, tandis que son éventuelle valeur collective reste signalée en note.
