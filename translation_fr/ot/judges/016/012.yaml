  text: וַ/תִּקַּ֣ח דְּלִילָה֩ עֲבֹתִ֨ים חֲדָשִׁ֜ים וַ/תַּאַסְרֵ֣/הוּ בָ/הֶ֗ם וַ/תֹּ֤אמֶר אֵלָי/ו֙ פְּלִשְׁתִּ֤ים עָלֶ֨י/ךָ֙ שִׁמְשׁ֔וֹן וְ/הָ/אֹרֵ֖ב יֹשֵׁ֣ב בֶּ/חָ֑דֶר וַֽ/יְנַתְּקֵ֛/ם מֵ/עַ֥ל זְרֹעֹתָ֖י/ו כַּ/חֽוּט׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/012.yaml
  text: Then Delilah took new ropes and bound him with them[a], and said to him, “The Philistines are upon you, Samson!” Now the ambush was sitting in the inner room[c][b], but he snapped them from off his arms like a thread.
translation:
  language: fr
  text: 'Alors Dalila prit des cordes neuves[a] et l’attacha avec elles. Puis elle lui dit : « Les Philistins sont sur toi, Samson ! » L’homme embusqué[b] était assis dans la chambre intérieure[c]. Alors Samson les arracha de ses bras comme un fil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « liens neufs » ou « cordes nouvelles ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les hommes embusqués ». L’hébreu emploie un participe singulier, qui peut désigner un guetteur ou, collectivement, le groupe embusqué.
    reason: lexical_alternative
  - marker: c
    text: Ou « dans la pièce retirée » ou « dans la chambre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹתִים
  choice: cordes
  rationale: Le terme désigne des liens épais servant à attacher. « Cordes » est naturel en français et maintient le contraste avec le « fil » final.
- source_word: חֲדָשִׁים
  choice: neuves
  rationale: L’adjectif indique que les cordes n’avaient pas encore servi; « neuves » convient idiomatiquement à des objets fabriqués.
- source_word: וַתַּאַסְרֵהוּ
  choice: l’en attacha
  rationale: Cette formulation rend l’action de lier Samson avec les cordes déjà mentionnées, sans lourdeur.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Les Philistins sont sur toi
  rationale: La tournure conserve l’idiome hébreu, son urgence et l’idée d’un danger tout proche.
- source_word: וְהָאֹרֵב
  choice: L’homme qui se tenait en embuscade
  rationale: Le participe hébreu est singulier et désigne celui qui guette. La traduction garde ce singulier plutôt que de le collectiviser silencieusement.
- source_word: יֹשֵׁב
  choice: était assis
  rationale: Le sens concret du participe est conservé, même si le contexte implique que l’homme attendait caché.
- source_word: בֶּחָדֶר
  choice: dans la chambre intérieure
  rationale: חֶדֶר peut désigner une pièce retirée ou intérieure, ce qui convient au lieu où l’homme est dissimulé.
- source_word: וַיְנַתְּקֵם
  choice: arracha les cordes
  rationale: Le verbe exprime une rupture ou un arrachement énergique. « Arracha » est idiomatique avec le complément « de ses bras ».
- source_word: מֵעַל זְרֹעֹתָיו
  choice: de ses bras
  rationale: La formulation française exprime naturellement que les liens ont été arrachés de dessus ses bras.
- source_word: כַּחוּט
  choice: comme si elles n’étaient qu’un fil
  rationale: Cette comparaison naturelle en français restitue l’image de liens rompus avec la facilité d’un simple fil.
