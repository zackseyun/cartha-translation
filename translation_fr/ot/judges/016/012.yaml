review_pass:
  verdict: revise
  source_fidelity: 'Le sens narratif est globalement fidèle : Dalila emploie des cordes neuves, lance le cri d’alerte, un guetteur est caché dans une pièce intérieure, et Samson se libère des liens. Toutefois, « l’en attacha » ne rend pas correctement וַתַּאַסְרֵהוּ בָהֶם (« elle l’attacha avec elles »). La comparaison finale doit rester directement liée à la facilité avec laquelle il détache les cordes, sans l’explicitation interprétative « comme si elles n’étaient qu’un fil ».'
  naturalness: Le registre est convenable et moderne. La correction de « l’en attacha » est indispensable en français. « L’homme qui se tenait en embuscade était assis » est compréhensible, mais « l’homme embusqué était assis » est plus fluide tout en conservant le singulier du participe hébreu.
  terminology: « Dalila », « Philistins », « cordes neuves », « chambre intérieure » et « fil » conviennent. La note sur le singulier potentiellement collectif de הָאֹרֵב préserve utilement l’ambiguïté du texte hébreu.
  issues:
  - severity: high
    issue: « l’en attacha »
    rationale: Cette construction est fautive ou, au minimum, ne signifie pas clairement qu’elle l’a attaché au moyen des cordes. Le pronom instrumental exigé ici est « avec elles ».
  - severity: medium
    issue: « comme si elles n’étaient qu’un fil »
    rationale: La formulation transforme la comparaison hébraïque (« comme un fil ») en une explicitation hypothétique sur la nature des cordes. Une comparaison directe conserve mieux l’image et la concision de la source.
