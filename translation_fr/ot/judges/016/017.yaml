review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, y compris la condition passive (« Si l’on me rase »), la perte future de force et la comparaison avec les autres hommes. Toutefois, « consacré à Dieu comme naziréen » réorganise et explicite le syntagme technique נְזִיר אֱלֹהִים; « un naziréen de Dieu » le rend plus directement tout en conservant le terme institutionnel.
  naturalness: « Il lui ouvrit tout son cœur » est compréhensible, mais moins idiomatique en français moderne que « il lui confia tout ce qu’il avait sur le cœur ». « Dès le ventre de ma mère » est une formulation naturelle qui conserve l’image et le sens temporel.
  terminology: « Naziréen » est maintenu comme terme technique. La note le définit sans prétendre expliquer le mécanisme de la force de Samson ni imposer une lecture théologique.
