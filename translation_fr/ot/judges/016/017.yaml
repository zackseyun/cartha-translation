  text: וַ/יַּגֶּד לָ֣/הּ אֶת כָּל לִבּ֗/וֹ וַ/יֹּ֤אמֶר לָ/הּ֙ מוֹרָה֙ לֹֽא עָלָ֣ה עַל רֹאשִׁ֔/י כִּֽי נְזִ֧יר אֱלֹהִ֛ים אֲנִ֖י מִ/בֶּ֣טֶן אִמִּ֑/י אִם גֻּלַּ֨חְתִּי֙ וְ/סָ֣ר מִמֶּ֣/נִּי כֹחִ֔/י וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/כָל הָ/אָדָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/017.yaml
  text: So he told her all his heart and said to her[a], “A razor has never come upon my head, for I have been a Nazirite of God from my mother’s womb. If I am shaved, then my strength will leave me[c][b], and I will become weak and be like every other man.”
translation:
  language: fr
  text: 'Alors il lui confia tout ce qu’il avait sur le cœur et lui dit : « Un rasoir n’est jamais passé sur ma tête, car je suis un naziréen de Dieu[a] dès le ventre de ma mère. Si l’on me rase, ma force me quittera ; je deviendrai faible et je serai comme n’importe quel autre homme. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un naziréen était une personne spécialement consacrée à Dieu ; cette consécration impliquait notamment qu’aucun rasoir ne passe sur sa tête.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגֶּד ... אֶת כָּל לִבּוֹ
  choice: il lui ouvrit tout son cœur
  rationale: Cette expression française naturelle conserve la métaphore hébraïque du cœur tout en exprimant la révélation complète de ce qu’il cachait.
- source_word: מוֹרָה לֹא עָלָה עַל רֹאשִׁי
  choice: Jamais un rasoir n’est passé sur ma tête
  rationale: « Rasoir » rend précisément מוֹרָה, et « est passé sur ma tête » reproduit de manière intelligible l’image du verbe hébreu.
- source_word: נְזִיר אֱלֹהִים
  choice: consacré à Dieu comme naziréen
  rationale: Le terme technique « naziréen » maintient le lien avec l’institution biblique, tandis que « consacré à Dieu » en rend le sens accessible au lecteur moderne.
- source_word: מִבֶּטֶן אִמִּי
  choice: depuis le ventre de ma mère
  rationale: Formulation directe et naturelle qui préserve l’image corporelle de l’hébreu et indique une consécration antérieure à la naissance.
- source_word: אִם גֻּלַּחְתִּי
  choice: Si l’on me rase
  rationale: 'La tournure française rend clairement la forme passive hébraïque : Samson subirait l’action de quelqu’un d’autre.'
- source_word: וְסָר מִמֶּנִּי כֹחִי
  choice: ma force me quittera
  rationale: Cette formulation moderne restitue fidèlement l’idée que sa force se détournera ou s’éloignera de lui.
- source_word: וְחָלִיתִי
  choice: je deviendrai faible
  rationale: Dans ce contexte, le verbe décrit la perte de vigueur plutôt qu’une maladie.
- source_word: כְּכָל הָאָדָם
  choice: comme n’importe quel autre homme
  rationale: La formulation exprime naturellement le contraste entre la force extraordinaire de Samson et celle d’un homme ordinaire, sans universaliser abstraitement le terme.
theological_decisions:
- issue: Rendu de נְזִיר dans la consécration de Samson
  choice: consacré à Dieu comme naziréen
  alternative: naziréen de Dieu
  rationale: Le choix conserve le terme technique et son lien canonique avec le naziréat, tout en explicitant brièvement sa portée pour les lecteurs qui ne le connaissent pas.
- issue: Nature du lien entre la chevelure et la force de Samson
  choice: traduire simplement l’affirmation de Samson sans expliquer le mécanisme
  alternative: indiquer que les cheveux sont eux-mêmes la source de sa force
  rationale: Le verset rapporte les paroles de Samson et associe le rasage à la perte de force, mais ne formule pas ici une théorie selon laquelle les cheveux posséderaient intrinsèquement cette force.
- issue: Portée de הָאָדָם dans la comparaison finale
  choice: n’importe quel autre homme
  alternative: n’importe quelle autre personne
  rationale: Le contexte narratif compare Samson à un homme ordinaire ; ce rendu respecte le référent masculin tout en exprimant clairement la comparaison.
translation_notes:
  register: Français international moderne, narratif et digne. La métaphore du cœur est conservée sous une forme idiomatique. Le terme biblique « naziréen » est maintenu mais immédiatement éclairé dans le texte et précisé en note.
