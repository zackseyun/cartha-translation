  text: וַ/יִּלְפֹּ֨ת שִׁמְשׁ֜וֹן אֶת שְׁנֵ֣י עַמּוּדֵ֣י הַ/תָּ֗וֶךְ אֲשֶׁ֤ר הַ/בַּ֨יִת֙ נָכ֣וֹן עֲלֵי/הֶ֔ם וַ/יִּסָּמֵ֖ךְ עֲלֵי/הֶ֑ם אֶחָ֥ד בִּ/ימִינ֖/וֹ וְ/אֶחָ֥ד בִּ/שְׂמֹאלֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/029.yaml
  text: Then Samson grasped the two middle pillars on which the house stood[a], and he braced himself against them[b], one with his right hand and one with his left.
translation:
  language: fr
  text: Alors Samson saisit les deux piliers centraux sur lesquels reposait la maison, et il prit appui contre eux[a], l’un avec sa main droite, l’autre avec sa main gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il s’appuya contre eux ». Le verbe hébreu peut exprimer le fait de s’appuyer ou de se soutenir sur quelque chose.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְפֹּת
  choice: saisit
  rationale: Le verbe exprime l’action de prendre fermement; « saisit » est naturel, précis et laisse entendre un geste énergique sans le surinterpréter.
- source_word: שְׁנֵי עַמּוּדֵי הַתָּוֶךְ
  choice: les deux piliers centraux
  rationale: הַתָּוֶךְ désigne ici le milieu ou la partie centrale; « piliers centraux » rend clairement la fonction architecturale de ces deux piliers.
- source_word: אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: sur lesquels reposait la maison
  rationale: נָכוֹן indique ici que l’édifice était établi ou soutenu sur ces piliers. « Reposait » exprime naturellement cette dépendance structurelle.
- source_word: וַיִּסָּמֵךְ עֲלֵיהֶם
  choice: il prit appui contre eux
  rationale: סמך peut signifier s’appuyer, se soutenir ou prendre appui. Cette formulation française préserve l’ambiguïté du geste tout en convenant à l’action physique décrite.
- source_word: אֶחָד בִּימִינוֹ וְאֶחָד בִּשְׂמֹאלוֹ
  choice: l’un de la main droite et l’autre de la main gauche
  rationale: La construction distributive associe un pilier à chaque côté de Samson. La mention des mains rend le geste naturel et explicite en français, conformément au contexte.
- source_word: הַבַּיִת
  choice: la maison
  rationale: « Maison » conserve le terme hébreu courant, qui peut désigner un édifice, y compris le bâtiment cultuel évoqué dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant « la maison », terme concret de l’hébreu, et l’ambiguïté physique de סמך au moyen d’une note.
