  text: וַ/תֹּ֤אמֶר דְּלִילָה֙ אֶל שִׁמְשׁ֔וֹן הַגִּֽידָ/ה נָּ֣א לִ֔/י בַּ/מֶּ֖ה כֹּחֲ/ךָ֣ גָד֑וֹל וּ/בַ/מֶּ֥ה תֵאָסֵ֖ר לְ/עַנּוֹתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/006.yaml
  text: Then Delilah said to Samson[a], “Please tell me where your great strength lies, and how you could be bound to afflict you.”
translation:
  language: fr
  text: 'Dalila dit alors à Samson : « Dis-moi, je t’en prie, en quoi consiste ta grande force et comment tu pourrais être attaché pour t’affliger[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour t’humilier » ou, dans ce contexte, « pour te maîtriser ». Le verbe hébreu peut signifier « affliger », « humilier » ou « maltraiter »; selon le contexte, il peut aussi évoquer l’idée de réduire quelqu’un à l’impuissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait avancer le récit; « alors » marque naturellement la succession en français.
- source_word: דְּלִילָה אֶל שִׁמְשׁוֹן
  choice: Dalila dit ... à Samson
  rationale: Les noms suivent leur forme française traditionnelle, et אֶל introduit le destinataire de la parole.
- source_word: הַגִּידָה נָּא לִי
  choice: S’il te plaît, dis-moi
  rationale: הגיד signifie « dire, faire savoir » et נא donne à la demande une nuance de prière ou d’insistance polie.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: d’où vient ta grande force
  rationale: Littéralement « en quoi [réside] ta grande force »; cette formulation française naturelle exprime la source ou le fondement recherché sans préciser indûment sa nature.
- source_word: וּבַמֶּה תֵאָסֵר
  choice: et comment on pourrait te ligoter
  rationale: Le niphal de אסר signifie « être lié ». La tournure impersonnelle restitue naturellement l’interrogation sur le moyen et « ligoter » convient à une personne physiquement attachée.
- source_word: לְעַנּוֹתֶךָ
  choice: pour te maîtriser
  rationale: Le piel de ענה peut signifier « affliger, humilier, maltraiter »; dans ce contexte, le but recherché est de réduire Samson à l’impuissance. « Maîtriser » rend ce sens contextuel tout en signalant les autres possibilités en note.
