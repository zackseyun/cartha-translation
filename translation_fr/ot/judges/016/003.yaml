  text: וַ/יִּשְׁכַּ֣ב שִׁמְשׁוֹן֮ עַד חֲצִ֣י הַ/לַּיְלָה֒ וַ/יָּ֣קָם בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַ/יֶּאֱחֹ֞ז בְּ/דַלְת֤וֹת שַֽׁעַר הָ/עִיר֙ וּ/בִ/שְׁתֵּ֣י הַ/מְּזוּז֔וֹת וַ/יִּסָּעֵ/ם֙ עִֽם הַ/בְּרִ֔יחַ וַ/יָּ֖שֶׂם עַל כְּתֵפָ֑י/ו וַֽ/יַּעֲלֵ/ם֙ אֶל רֹ֣אשׁ הָ/הָ֔ר אֲשֶׁ֖ר עַל פְּנֵ֥י חֶבְרֽוֹן־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/003.yaml
  text: And Samson lay until midnight[a]. Then he arose at midnight and seized the doors of the city gate and the two doorposts, and pulled them up with the bar[b]; he put them on his shoulders and carried them up to the top of the hill that is opposite Hebron.
translation:
  language: fr
  text: Samson resta couché jusqu’à minuit. À minuit, il se leva, saisit les battants de la porte de la ville ainsi que les deux montants et les arracha avec la barre[a]. Il les mit sur ses épaules et les porta jusqu’au sommet de la colline située en face d’Hébron[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les déracina avec la barre ». Le verbe hébreu évoque le fait de retirer ou d’arracher quelque chose de son emplacement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui fait face à Hébron ». L’expression hébraïque signifie littéralement « sur la face d’Hébron ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: resta couché
  rationale: שׁכב exprime ici le fait d’être couché sans préciser nécessairement que Samson dormait. « Resta couché » rend naturellement la durée marquée par עַד.
- source_word: עַד חֲצִי הַלַּיְלָה / בַּחֲצִי הַלַּיְלָה
  choice: jusqu’à minuit / à minuit
  rationale: Littéralement « jusqu’au milieu de la nuit / au milieu de la nuit » ; « minuit » est l’équivalent français courant et maintient la répétition narrative.
- source_word: וַיֶּאֱחֹז
  choice: saisit
  rationale: Ce verbe vigoureux convient à l’action énergique décrite par le contexte.
- source_word: דַּלְתוֹת שַׁעַר הָעִיר
  choice: les battants de la porte de la ville
  rationale: דְּלָתוֹת désigne les deux éléments mobiles de la grande porte ; « battants » est architecturalement précis et idiomatique en français.
- source_word: וּבִשְׁתֵּי הַמְּזוּזוֹת
  choice: ainsi que les deux montants
  rationale: מְזוּזוֹת désigne les poteaux ou jambages latéraux de la porte. « Montants » est clair en français moderne.
- source_word: וַיִּסָּעֵם עִם הַבְּרִיחַ
  choice: les arracha avec la barre
  rationale: Dans ce contexte, נסע décrit l’enlèvement des éléments de la porte hors de leur emplacement. עִם indique que la barre de fermeture fut emportée avec eux ; le français « avec la barre » conserve cette relation sans la transformer en instrument de l’action.
- source_word: וַיָּשֶׂם עַל כְּתֵפָיו
  choice: Il les mit sur ses épaules
  rationale: Rendu direct et naturel de l’expression hébraïque.
- source_word: וַיַּעֲלֵם
  choice: les porta jusqu’au sommet
  rationale: Le contexte précise qu’ils sont sur ses épaules ; « porta » explicite naturellement le déplacement ascendant impliqué par עלה.
- source_word: אֶל רֹאשׁ הָהָר
  choice: jusqu’au sommet de la colline
  rationale: רֹאשׁ désigne le sommet et הַר peut désigner une montagne ou une hauteur. « Colline » convient au relief local sans exagérer sa taille.
- source_word: אֲשֶׁר עַל פְּנֵי חֶבְרוֹן
  choice: située en face d’Hébron
  rationale: L’expression עַל־פְּנֵי indique une position en face de, ou orientée vers, Hébron, sans préciser davantage la relation géographique.
