source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם אָס֤וֹר יַאַסְר֨וּ/נִי֙ בַּ/עֲבֹתִ֣ים חֲדָשִׁ֔ים אֲשֶׁ֛ר לֹֽא נַעֲשָׂ֥ה בָ/הֶ֖ם מְלָאכָ֑ה וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/011.yaml
  text: He said to her[a], “If they bind me with new ropes that have never been used for work[b], then I will become weak and be like one of the men.”
translation:
  language: fr
  text: 'Il lui dit : « Si l’on m’attache solidement avec des cordes neuves qui n’ont encore servi à aucun travail[a], je deviendrai faible et je serai comme n’importe quel homme[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec lesquelles aucun travail n’a été fait ».'
    reason: Alternative plus formelle qui reproduit la construction passive de l’hébreu.
  - marker: b
    text: 'Ou : « comme un homme parmi les autres », c’est-à-dire sans force exceptionnelle.'
    reason: L’expression hébraïque peut être rendue de façon plus littérale, tandis que le texte principal en exprime le sens idiomatique.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Il lui dit
  rationale: Le wayyiqtol poursuit le récit et introduit la réponse de Samson. En français, « Il lui dit » est naturel sans qu’il soit nécessaire de rendre systématiquement la conjonction initiale.
- source_word: אִם אָסוֹר יַאַסְרוּנִי
  choice: Si l’on m’attache solidement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action d’attacher. « solidement » exprime cette valeur emphatique sans reproduire artificiellement le verbe.
- source_word: בַּעֲבֹתִים חֲדָשִׁים
  choice: avec des cordes neuves
  rationale: עֲבֹתִים désigne des cordes ou liens épais; « cordes » est ici le terme moderne le plus clair. חֲדָשִׁים signifie « neuves » dans le contexte d’objets encore inutilisés.
- source_word: אֲשֶׁר לֹא נַעֲשָׂה בָהֶם מְלָאכָה
  choice: qui n’ont encore servi à aucun travail
  rationale: Cette formulation française naturelle conserve l’idée littérale qu’aucun travail n’a été accompli avec ces cordes, donc qu’elles n’ont jamais servi.
- source_word: וְחָלִיתִי
  choice: je deviendrai faible
  rationale: חלה signifie ici devenir faible ou perdre sa force, et non tomber malade au sens courant.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: et je serai comme n’importe quel homme
  rationale: La comparaison oppose la force extraordinaire de Samson à celle d’un homme ordinaire. « n’importe quel homme » rend idiomatiquement la portée de l’expression tout en conservant la référence masculine du contexte.
theological_decisions:
- issue: Portée de הָאָדָם dans כְּאַחַד הָאָדָם
  choice: comme n’importe quel homme
  alternative: comme un homme parmi les autres
  rationale: Le texte ne développe aucune doctrine de l’humanité en général; il affirme que Samson serait semblable à un homme ordinaire, sans sa force exceptionnelle. La traduction garde cette opposition sans préciser davantage sa nature.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste simple et oral sans devenir familier. Les marqueurs de notes sont placés après les expressions auxquelles les variantes se rapportent.
