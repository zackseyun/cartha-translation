  - severity: low
    issue: Formulation française de l’action de raser
    rationale: « Raser les mèches de sa tête » est moins naturel que « lui raser les mèches de cheveux ». La révision améliore l’idiome tout en conservant Dalila comme sujet grammatical, conformément au verbe féminin singulier hébreu.
