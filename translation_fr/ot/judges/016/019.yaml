base_translation:
  language: en
  yaml_path: translation/ot/judges/016/019.yaml
  text: So she made him sleep on her knees[a], and she called for a man, and she shaved off the seven locks of his head. Then she began to afflict him[c][b], and his strength left him.
translation:
  language: fr
  text: Elle l’endormit sur ses genoux[a], puis appela l’homme[b] et lui rasa les sept mèches de cheveux[c]. Elle commença alors à le maltraiter, et sa force le quitta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur ses cuisses » ou « dans son giron »; littéralement « sur ses genoux ».
    reason: lexical_alternative
  - marker: b
    text: Ou, selon le contexte, « appela un homme » ou « fit venir un homme ». L’hébreu porte littéralement « l’homme ».
    reason: alternative_reading
  - marker: c
    text: Ou « les sept tresses de ses cheveux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּיַשְּׁנֵהוּ
  choice: Elle l’endormit
  rationale: 'Le hifil de ישׁן a ici une valeur causative : elle fait en sorte qu’il dorme. « Elle l’endormit » est naturel en français et ne précise pas indûment le moyen employé.'
- source_word: עַל בִּרְכֶּיהָ
  choice: sur ses genoux
  rationale: Le texte dit littéralement « sur ses genoux ». Cette formulation reste naturelle en français, tout en permettant de comprendre qu’il repose sur ses cuisses ou dans son giron.
- source_word: וַתִּקְרָא לָאִישׁ
  choice: appela un homme
  rationale: אִישׁ est sans article. « Appela un homme » conserve cette indétermination et peut signifier qu’elle fit venir l’homme chargé de la tâche.
- source_word: וַתְּגַלַּח
  choice: rasa
  rationale: Le verbe est au féminin singulier et reprend Dalila comme sujet grammatical. Le français peut garder ce sujet, qu’elle accomplisse l’action elle-même ou la fasse exécuter par l’homme appelé.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ
  choice: les sept mèches de sa tête
  rationale: מַחְלְפוֹת désigne des mèches ou tresses de cheveux. « Mèches » est courant et ne tranche pas abusivement en faveur de cheveux nécessairement tressés.
- source_word: וַתָּחֶל לְעַנּוֹתוֹ
  choice: Elle commença alors à le maltraiter
  rationale: וַתָּחֶל marque le commencement de l’action, tandis que le piel de ענה peut exprimer le fait d’affliger, de maltraiter ou d’humilier. « Maltraiter » est compréhensible et conserve une portée assez large.
- source_word: וַיָּסַר כֹּחוֹ מֵעָלָיו
  choice: sa force le quitta
  rationale: Cette tournure française rend naturellement l’idée idiomatique que sa force se retira ou disparut.
theological_decisions:
- issue: Nature de la force perdue par Samson
  choice: « sa force le quitta », sans mention explicite du Seigneur
  alternative: « la force que le Seigneur lui donnait le quitta »
  rationale: Le verset affirme seulement que sa force le quitta. Le contexte plus large relie cette force au Seigneur et au statut de Samson, mais l’expliciter ici ajouterait un élément absent de cette phrase.
- issue: Agent de la coupe des cheveux
  choice: Conserver Dalila comme sujet grammatical de « rasa »
  alternative: « il rasa » ou « elle lui fit raser »
  rationale: Le verbe hébreu est féminin singulier. La présence de l’homme appelé peut laisser entendre une action exécutée par intermédiaire, mais le texte pointé attribue grammaticalement l’action à Dalila; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, narratif et digne. « L’endormit », « maltraiter » et « sa force le quitta » sont courants sans être familiers. Les marqueurs [a] et [b] figurent dans le texte principal.
