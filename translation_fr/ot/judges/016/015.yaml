  text: וַ/תֹּ֣אמֶר אֵלָ֗י/ו אֵ֚יךְ תֹּאמַ֣ר אֲהַבְתִּ֔י/ךְ וְ/לִבְּ/ךָ֖ אֵ֣ין אִתִּ֑/י זֶ֣ה שָׁלֹ֤שׁ פְּעָמִים֙ הֵתַ֣לְתָּ בִּ֔/י וְ/לֹא הִגַּ֣דְתָּ לִּ֔/י בַּ/מֶּ֖ה כֹּחֲ/ךָ֥ גָדֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/015.yaml
  text: Then she said to him[a], “How can you say, ‘I love you,’ when your heart is not with me? These three times you have mocked me and have not told me in what your great strength lies.”
translation:
  language: fr
  text: 'Elle lui dit : « Comment peux-tu dire : “Je t’aime”, alors que ton cœur n’est pas avec moi ? Voilà trois fois que tu te moques de moi[a] sans me révéler en quoi consiste ta grande force. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu joues avec moi », « tu me trompes » ou « tu me tournes en ridicule ». Le verbe hébreu évoque le fait de se jouer de quelqu’un par une tromperie moqueuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Comment peux-tu
  rationale: Cette formulation rend naturellement en français la force rhétorique et incrédule de la question de Dalila.
- source_word: אֲהַבְתִּיךְ
  choice: Je t’aime
  rationale: Dans ce discours direct, l’accompli hébreu exprime l’amour que Samson prétend éprouver de manière actuelle.
- source_word: לִבְּךָ אֵין אִתִּי
  choice: ton cœur n’est pas avec moi
  rationale: La traduction conserve l’image hébraïque du cœur comme siège de l’engagement intérieur et de la loyauté, sans en préciser excessivement le sens.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: Voilà trois fois que
  rationale: Tour français naturel qui souligne la répétition des trois épisodes précédents.
- source_word: הֵתַלְתָּ בִּי
  choice: tu te moques de moi
  rationale: Le verbe évoque le fait de jouer avec quelqu’un ou de le tourner en dérision par la tromperie. Ce choix exprime clairement l’affront personnel tout en laissant les nuances voisines en note.
- source_word: הִגַּדְתָּ לִּי
  choice: sans me révéler
  rationale: Dans ce contexte, révéler rend l’idée de faire connaître un secret. La coordination négative hébraïque est naturellement exprimée en français par « sans ».
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: en quoi consiste ta grande force
  rationale: Cette expression garde l’interrogation sur la nature ou le fondement de la force extraordinaire de Samson, sans la réduire à une simple localisation.
theological_decisions: []
