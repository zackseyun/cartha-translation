base_translation:
  language: en
  yaml_path: translation/ot/judges/016/024.yaml
  text: When the people saw him, they praised their god, for they said, “Our god has given into our hand our enemy, the devastator of our land, the one who multiplied our slain.”
translation:
  language: fr
  text: 'Quand le peuple le vit, il loua son dieu, car il disait : « Notre dieu a livré entre nos mains notre ennemi, le dévastateur de notre pays, celui qui a multiplié nos tués. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהַלְלוּ
  choice: ils louèrent
  rationale: Rend directement l’action de célébrer ou louer la divinité, dans un français naturel.
- source_word: נָתַן ... בְיָדֵנוּ
  choice: a livré entre nos mains
  rationale: Conserve l’image hébraïque de la remise au pouvoir des vainqueurs, tout en restant idiomatique.
- source_word: מַחֲרִיב אַרְצֵנוּ
  choice: celui qui dévastait notre pays
  rationale: Le participe désigne Samson par son action destructrice; l’imparfait exprime ici une activité caractéristique ou répétée.
- source_word: הִרְבָּה אֶת חֲלָלֵינוּ
  choice: qui multipliait nos morts
  rationale: Préserve l’expression forte et concise du texte hébreu, où les חֲלָלִים sont les tués, particulièrement ceux tombés sous les coups de l’ennemi.
theological_decisions:
- issue: Désignation du dieu des Philistins
  choice: leur dieu / notre dieu, avec une minuscule
  alternative: leur Dieu / notre Dieu
  rationale: Le contexte parle de la divinité philistine célébrée par ses adorateurs; la minuscule distingue naturellement cette divinité du Dieu d’Israël sans ajouter de commentaire polémique.
- issue: Rapport entre la victoire revendiquée et la réalité théologique du récit
  choice: Conserver sans qualification la déclaration des Philistins
  alternative: Ajouter une marque indiquant qu’il ne s’agit que de leur interprétation
  rationale: Le verset rapporte leur parole; il ne revient pas à la traduction d’en confirmer ou d’en réfuter explicitement la théologie.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise par « ils » après le collectif singulier « le peuple » suit le sens pluriel du référent et évite une tournure artificielle. Le parallélisme des deux relatives est maintenu.
