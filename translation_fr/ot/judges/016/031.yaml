base_translation:
  language: en
  yaml_path: translation/ot/judges/016/031.yaml
  text: Then his brothers and all his father’s household came down[a], carried him away, brought him up, and buried him between Zorah and Eshtaol, in the tomb of Manoah his father. And he judged Israel twenty years.
translation:
  language: fr
  text: Alors ses frères et toute la famille de son père descendirent, emportèrent son corps, le remontèrent et l’enterrèrent entre Tsorea et Eshtaol, dans le tombeau de Manoah, son père. Il jugea Israël pendant vingt ans.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il avait jugé Israël pendant vingt ans. » L’hébreu peut présenter cette phrase comme un résumé rétrospectif.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: descendirent
  rationale: Le verbe ירד exprime un déplacement vers le bas. Le passé simple conserve la progression narrative et « descendirent » préserve directement l’indication topographique.
- source_word: אֶחָיו
  choice: ses frères
  rationale: אָח désigne normalement les frères au sens familial direct ; rien dans le contexte n’impose le sens élargi de « proches » ou « membres du clan ».
- source_word: כָּל בֵּית אָבִיהוּ
  choice: toute la famille de son père
  rationale: L’expression « maison de son père » désigne ici le groupe familial paternel. « Famille » restitue naturellement cet idiome social en français moderne.
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: emportèrent son corps
  rationale: Dans ce contexte funéraire, נשא signifie prendre et transporter le défunt. La mention du « corps » rend le référent du pronom explicite en français sans modifier le sens.
- source_word: וַיַּעֲלוּ
  choice: le remontèrent
  rationale: עלה indique un déplacement vers le haut et reprend implicitement Samson comme objet. « Le remontèrent » maintient à la fois cette direction et la continuité du transport.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: l’enterrèrent
  rationale: Équivalent direct, courant et digne du verbe קבר dans un récit d’ensevelissement.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: entre Tsorea et Eshtaol
  rationale: La tournure française rend directement la localisation entre les deux villes, avec leurs formes françaises usuelles.
- source_word: בְּקֶבֶר מָנוֹחַ אָבִיו
  choice: dans le tombeau de Manoah, son père
  rationale: קֶבֶר peut désigner une tombe ou un tombeau ; « tombeau » convient à un lieu d’ensevelissement familial. La virgule marque naturellement l’apposition « son père ».
- source_word: וְהוּא שָׁפַט אֶת־יִשְׂרָאֵל
  choice: Il jugea Israël
  rationale: שפט est le terme récurrent du livre pour l’action et la fonction des juges. La traduction conserve ce vocabulaire caractéristique sans le réduire à « gouverner ».
- source_word: עֶשְׂרִים שָׁנָה
  choice: pendant vingt ans
  rationale: La préposition « pendant » exprime naturellement en français la durée indiquée par le groupe nominal hébreu.
theological_decisions:
- issue: Valeur temporelle du résumé final sur la période de Samson comme juge
  choice: Il jugea Israël pendant vingt ans.
  alternative: Il avait jugé Israël pendant vingt ans.
  rationale: La construction hébraïque peut se lire comme la formule conclusive habituelle du livre au passé simple ou, après le récit de l’ensevelissement, comme un retour rétrospectif appelant le plus-que-parfait en français. Le texte principal garde la formule simple et la note préserve explicitement l’autre valeur temporelle.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme lexical. Les mouvements opposés « descendirent » et « remontèrent » préservent la topographie du récit ; « famille de son père » explicite naturellement l’idiome familial hébreu.
