base_translation:
  language: en
  yaml_path: translation/ot/judges/016/016.yaml
  text: And it happened that[a], when she pressed him with her words all the days and urged him on, his soul grew short to the point of death.
translation:
  language: fr
  text: Or, comme elle le harcelait jour après jour par ses paroles et le pressait, il fut à bout, à en mourir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son âme devint courte jusqu’à mourir ». En hébreu, « âme » peut désigner l’être intérieur ou la personne ; l’expression évoque un état extrême de détresse, d’exaspération ou d’épuisement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: À force de
  rationale: La construction introduit ici la circonstance qui conduit au résultat. En français moderne, « À force de » exprime naturellement l’action répétée et son effet, sans la lourdeur de « Et il arriva que, lorsque ».
- source_word: הֵצִיקָה לוֹ בִדְבָרֶיהָ
  choice: le harceler … par ses paroles
  rationale: Le verbe décrit une pression qui cause de la détresse; « harceler » convient au caractère verbal, insistant et répété de l’action. « Par ses paroles » conserve explicitement le moyen indiqué par l’hébreu.
- source_word: כָּל הַיָּמִים
  choice: jour après jour
  rationale: Cette expression française naturelle rend la répétition persistante de l’hébreu, plus clairement que le calque « tous les jours » dans cette phrase.
- source_word: וַתְּאַלֲצֵהוּ
  choice: d’insister auprès de lui
  rationale: Le verbe renforce l’idée de contrainte pressante. Cette formulation évite de répéter « harceler » ou « presser » tout en maintenant l’accumulation des actions.
- source_word: וַתִּקְצַר נַפְשׁוֹ לָמוּת
  choice: elle finit par l’exaspérer à en mourir
  rationale: L’expression idiomatique dit littéralement que son « âme devint courte jusqu’à mourir ». « L’exaspérer à en mourir » restitue l’extrême détresse, l’épuisement ou l’impatience sans imposer l’idée qu’il souhaitait explicitement mourir; la note conserve l’image hébraïque.
theological_decisions:
- issue: Portée de לָמוּת
  choice: à en mourir
  alternative: au point de vouloir mourir
  rationale: Le texte décrit un état intérieur poussé à l’extrême, mais n’affirme pas sans ambiguïté un désir suicidaire. La traduction retenue préserve cette réserve.
translation_notes:
  register: 'Français international moderne, narratif et digne. La formulation privilégie une équivalence optimale : elle évite un calque obscur dans le corps du texte, tout en préservant dans la note l’image concrète et l’ambiguïté de l’expression hébraïque.'
