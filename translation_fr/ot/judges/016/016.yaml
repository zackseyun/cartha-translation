  naturalness: « À force de » est naturel, mais efface la transition narrative וַיְהִי כִּי. « Or, comme » est fluide en français narratif moderne. « Il fut à bout, à en mourir » est idiomatique, expressif et plus englobant que « l’exaspérer à en mourir », qui privilégie l’agacement.
  terminology: « Harceler » et « presser » restituent de façon claire les deux verbes successifs de pression. La note doit expliquer que « âme » désigne ici l’être intérieur / la personne et que l’idiome ne requiert pas l’idée d’un désir explicite de mourir.
