  text: וַֽ/יְהִי֙ כי טוב לִבָּ֔/ם וַ/יֹּ֣אמְר֔וּ קִרְא֥וּ לְ/שִׁמְשׁ֖וֹן וִ/ישַֽׂחֶק לָ֑/נוּ וַ/יִּקְרְא֨וּ לְ/שִׁמְשׁ֜וֹן מִ/בֵּ֣ית ה/אסירים וַ/יְצַחֵק֙ לִ/פְנֵי/הֶ֔ם וַ/יַּעֲמִ֥ידוּ אוֹת֖/וֹ בֵּ֥ין הָ/עַמּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/025.yaml
  text: And when their hearts were merry[a], they said, “Call for Samson, so that he may entertain us.” So they called for Samson from the prison house, and he entertained them[b]. And they made him stand between the pillars.
translation:
  language: fr
  text: 'Quand ils eurent le cœur en joie, ils dirent : « Faites venir Samson, pour qu’il nous divertisse[a] ! » Ils firent donc venir Samson de la prison[b], et il les divertit devant eux. Puis ils le placèrent entre les colonnes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour qu’il nous amuse » ou « pour qu’il nous donne un spectacle ». Le verbe hébreu peut évoquer l’amusement, la moquerie ou une exhibition publique.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de la maison des prisonniers ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי טוֹב לִבָּם
  choice: quand ils eurent le cœur en joie
  rationale: L’expression hébraïque dit littéralement que leur cœur était « bon ». Cette formulation française conserve l’image du cœur tout en exprimant naturellement leur humeur joyeuse, probablement liée au festin évoqué par le contexte.
- source_word: קִרְאוּ לְשִׁמְשׁוֹן
  choice: Faites venir Samson
  rationale: Avec la préposition ל, le verbe קרא exprime ici l’action de convoquer quelqu’un. « Faites venir » est naturel en français et convient à l’ordre donné.
- source_word: וִישַׂחֶק לָנוּ
  choice: pour qu’il nous divertisse
  rationale: Le verbe שׂחק peut évoquer le rire, l’amusement, la moquerie ou un spectacle. « Divertisse » rend clairement la fonction imposée à Samson sans préciser à tort la forme exacte de cette exhibition.
- source_word: מִבֵּית הָאֲסִירִים
  choice: de la prison
  rationale: Littéralement, l’expression signifie « de la maison des prisonniers ». « De la prison » en donne le sens exact dans un français actuel et fluide.
- source_word: וַיְצַחֵק לִפְנֵיהֶם
  choice: et il les divertit
  rationale: Le verbe צחק, apparenté à celui de la demande précédente, indique que Samson fournit l’amusement attendu devant eux. La répétition de « divertir » maintient ce lien lexical, tandis que la note signale la dimension possible de spectacle et de dérision.
- source_word: וַיַּעֲמִידוּ אוֹתוֹ בֵּין הָעַמּוּדִים
  choice: Puis on le plaça entre les colonnes
  rationale: Le hiphil de עמד signifie faire tenir debout ou placer. « On le plaça » exprime naturellement la contrainte exercée sur Samson et sa mise en position entre les colonnes.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le rendu conserve l’image hébraïque du cœur en joie, tout en privilégiant des formulations courantes. La note sur « divertir » préserve l’ambiguïté entre amusement, spectacle et dérision sans transformer explicitement Samson en artiste volontaire.
