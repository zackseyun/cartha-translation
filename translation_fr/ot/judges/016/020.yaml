base_translation:
  language: en
  yaml_path: translation/ot/judges/016/020.yaml
  text: And she said[a], “The Philistines are upon you, Samson!” And he awoke from his sleep and said, “I will go out as at other times and shake myself free.” But he did not know that Yahweh had departed from him.
translation:
  language: fr
  text: 'Elle dit : « Les Philistins sont sur toi, Samson ! » Il se réveilla et dit : « Je sortirai comme les autres fois et je me dégagerai[a]. » Mais il ne savait pas que Yahvé s’était retiré de lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et je me secouerai », probablement avec le sens de se dégager ou de se libérer.'
    reason: Variante lexicale conservant plus littéralement l’image du verbe hébreu נער.
lexical_decisions:
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Les Philistins sont sur toi
  rationale: 'Cette formulation conserve l’image vive de la préposition עַל employée avec un sujet hostile : les Philistins sont sur le point d’attaquer ou de saisir Samson, sans préciser davantage que l’hébreu.'
- source_word: וַיִּקַץ מִשְּׁנָתוֹ
  choice: Il se réveilla
  rationale: En français, « se réveiller » exprime naturellement l’idée complète de sortir du sommeil ; traduire aussi מִשְּׁנָתוֹ par « de son sommeil » serait possible, mais plus lourd.
- source_word: אֵצֵא
  choice: Je sortirai
  rationale: Le verbe יצא signifie simplement « sortir ». La traduction n’explicite pas que Samson irait affronter ses agresseurs, même si le contexte le suggère.
- source_word: כְּפַעַם בְּפַעַם
  choice: comme les autres fois
  rationale: L’expression renvoie à plusieurs occasions antérieures. Cette formulation restitue naturellement en français l’idée d’une situation qui s’est répétée.
- source_word: וְאִנָּעֵר
  choice: et je me dégagerai
  rationale: Le niphal de נער évoque ici le fait de se secouer pour se libérer. « Me dégagerai » communique le résultat implicite de façon naturelle, tandis que la note conserve l’image littérale.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme, préférable ici à la substitution par un titre comme « le Seigneur ».
- source_word: סָר מֵעָלָיו
  choice: s’était retiré de lui
  rationale: Le verbe סור avec מֵעַל exprime un retrait ou un départ. Cette formulation garde la gravité de l’affirmation sans expliquer la nature ni la durée de ce retrait.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin. La forme française « Yahvé » préserve ce nom au lieu de lui substituer un titre.
- issue: Nature du retrait divin
  choice: Yahvé s’était retiré de lui
  alternative: la puissance de Yahvé l’avait quitté
  rationale: Le verset affirme le retrait de Yahvé sans préciser s’il s’agit uniquement de sa puissance, de sa faveur ou d’un autre aspect de sa présence. La traduction conserve cette tension.
- issue: Paroles intérieures ou prononcées de Samson
  choice: se dit
  alternative: dit
  rationale: L’hébreu emploie le verbe « dire » sans destinataire exprimé. Dans ce contexte, le français « se dit » rend naturellement une parole que Samson s’adresse à lui-même, sans modifier son contenu.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit ; le vocabulaire reste courant. L’ordre des propositions et la brusque alerte de Dalila sont préservés.
