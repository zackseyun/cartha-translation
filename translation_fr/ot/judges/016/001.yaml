id: JDG.16.1
reference: Judges 16:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ שִׁמְשׁ֖וֹן עַזָּ֑תָ/ה וַ/יַּרְא שָׁם֙ אִשָּׁ֣ה זוֹנָ֔ה וַ/יָּבֹ֖א אֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/001.yaml
  text: Samson went to Gaza[a], and there he saw a prostitute, and he went in to her.
translation:
  language: fr
  text: Samson alla à Gaza. Là, il vit une prostituée et entra chez elle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « eut des relations sexuelles avec elle ». Littéralement, l’hébreu dit : « entra vers elle », expression employée ici comme euphémisme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: alla
  rationale: Dans cette séquence narrative, הלך est le verbe ordinaire de déplacement. Le passé simple convient au registre narratif français et n’ajoute aucune nuance absente de l’hébreu.
- source_word: שִׁמְשׁוֹן
  choice: Samson
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: עַזָּתָה
  choice: à Gaza
  rationale: Le hé directionnel indique un mouvement vers la ville; « à Gaza » l’exprime naturellement en français après « aller ».
- source_word: וַיַּרְא שָׁם
  choice: Là, il vit
  rationale: שָׁם signifie « là ». Cette place en tête de proposition est naturelle en français et conserve le repère spatial.
- source_word: אִשָּׁה זוֹנָה
  choice: une prostituée
  rationale: זוֹנָה désigne ici une prostituée. Ce terme moderne est précis, tandis que « courtisane » atténuerait le sens et que « femme de mauvaise vie » serait archaïque et périphrastique.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: entra chez elle
  rationale: בוא אל peut constituer dans ce contexte un euphémisme sexuel. « Entra chez elle » préserve en français le sens concret et l’implicite du texte sans rendre l’acte sexuel pleinement explicite dans le corps du verset.
theological_decisions:
- issue: Faut-il expliciter le sens sexuel de וַיָּבֹא אֵלֶיהָ ou préserver l’euphémisme hébreu ?
  choice: Préserver l’euphémisme par « entra chez elle » et signaler le sens contextuel en note.
  alternative: « eut des relations sexuelles avec elle » ou « coucha avec elle »
  rationale: Le contexte suggère fortement une relation sexuelle, mais l’hébreu emploie une tournure indirecte. Le texte principal conserve ce degré d’implicite, tandis que la note évite que le lecteur moderne manque le sens probable.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient une narration biblique soutenue sans archaïsme lexical. La ponctuation divise la chaîne hébraïque en deux phrases pour une lecture fluide.
