id: JDG.16.23
reference: Judges 16:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/סַרְנֵ֣י פְלִשְׁתִּ֗ים נֶֽאֱסְפוּ֙ לִ/זְבֹּ֧חַ זֶֽבַח גָּד֛וֹל לְ/דָג֥וֹן אֱלֹהֵי/הֶ֖ם וּ/לְ/שִׂמְחָ֑ה וַ/יֹּ֣אמְר֔וּ נָתַ֤ן אֱלֹהֵ֨י/נוּ֙ בְּ/יָדֵ֔/נוּ אֵ֖ת שִׁמְשׁ֥וֹן אוֹיְבֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/023.yaml
  text: The rulers of the Philistines gathered to offer a great sacrifice to Dagon their god and to celebrate[a], and they said[b], “Our god has given Samson our enemy into our hand.”
translation:
  language: fr
  text: 'Les dirigeants[a] des Philistins se rassemblèrent pour offrir un grand sacrifice à Dagon, leur dieu, et pour se réjouir. Ils dirent : « Notre dieu a livré Samson, notre ennemi, entre nos mains[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les chefs » des Philistins.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans notre main », expression qui signifie « en notre pouvoir ».'
    reason: idiom_explanation
lexical_decisions:
- source_word: סַרְנֵי
  choice: dirigeants
  rationale: Le terme désigne les principaux responsables des cités philistines. « Dirigeants » est clair, actuel et rend leur autorité politique sans connotation féodale.
- source_word: נֶאֱסְפוּ
  choice: se rassemblèrent
  rationale: Le niphal de אסף indique ici que les responsables philistins se réunissent en groupe.
- source_word: לִזְבֹּחַ זֶבַח גָּדוֹל
  choice: offrir un grand sacrifice
  rationale: Cette formulation française naturelle restitue l’infinitif accompagné d’un nom de même racine, sans conserver une répétition maladroite.
- source_word: לְדָגוֹן אֱלֹהֵיהֶם
  choice: à Dagon, leur dieu
  rationale: Dagon est présenté comme la divinité destinataire du sacrifice; l’apposition explicite cette identification sans ajout interprétatif.
- source_word: וּלְשִׂמְחָה
  choice: et pour se réjouir
  rationale: שִׂמְחָה exprime ici la joie festive liée à la victoire. « Se réjouir » reste naturel et digne, sans préciser au-delà du texte la forme des festivités.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: a livré ... entre nos mains
  rationale: L’expression signifie remettre quelqu’un au pouvoir d’un autre. « Livrer entre les mains » conserve l’image hébraïque tout en étant idiomatique en français.
- source_word: אֵת שִׁמְשׁוֹן
  choice: Samson
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: אוֹיְבֵינוּ
  choice: notre ennemi
  rationale: Malgré sa morphologie plurielle, le terme renvoie ici au seul Samson; le singulier français correspond donc au référent contextuel.
theological_decisions:
- issue: Traduction de אֱלֹהֵיהֶם et אֱלֹהֵינוּ dans un contexte païen
  choice: leur dieu / Notre dieu
  alternative: leurs dieux / Nos dieux
  rationale: Les deux occurrences renvoient dans ce verset à Dagon, divinité nommée au singulier. Le singulier respecte la syntaxe immédiate sans introduire une pluralité absente de cette scène.
translation_notes:
  register: Français international moderne, clair et digne. Le récit emploie le passé simple, conformément au registre narratif biblique courant. La formulation conserve l’image de la main et ne tranche pas au-delà du texte les implications théologiques de la déclaration philistine.
