base_translation:
  language: en
  yaml_path: translation/ot/judges/016/026.yaml
  text: Then Samson said to the young man who was holding his hand, “Let me rest, and guide me to the pillars on which the house stands, so that I may lean against them.”
translation:
  language: fr
  text: 'Alors Samson dit au jeune homme qui le tenait par la main : « Laisse-moi toucher les colonnes sur lesquelles repose le bâtiment, afin que je m’y appuie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנִּיחָה אוֹתִי
  choice: Laisse-moi me reposer
  rationale: Le verbe נוח à la forme causative signifie ici permettre à Samson de se reposer; cette traduction suit le sens du texte massorétique sans le remplacer par une idée de toucher.
- source_word: ו/הימש/ני
  choice: et conduis-moi jusqu’aux
  rationale: Cette forme textuellement difficile est comprise dans le contexte comme une demande d’être guidé vers les colonnes; « conduis-moi jusqu’aux » est naturel en français et respecte la situation de Samson aveugle.
- source_word: הַבַּיִת
  choice: le bâtiment
  rationale: Dans ce contexte, בַּיִת désigne l’édifice où les Philistins sont rassemblés. « Bâtiment » évite l’impression moderne d’une habitation privée que pourrait produire « maison ».
- source_word: נָכוֹן עֲלֵיהֶם
  choice: repose
  rationale: נכון exprime ici le fait que l’édifice est établi ou soutenu sur les colonnes. « Repose » rend clairement ce rapport structurel.
- source_word: וְאֶשָּׁעֵן עֲלֵיהֶם
  choice: afin que je puisse m’y appuyer
  rationale: Le verbe שׁען signifie s’appuyer ou prendre appui; la modalité française explicite naturellement le but de la demande.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste accessible, sans expliciter à ce stade l’intention de Samson ni atténuer la tension dramatique du récit.
