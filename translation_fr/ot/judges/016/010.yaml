  text: וַ/תֹּ֤אמֶר דְּלִילָה֙ אֶל שִׁמְשׁ֔וֹן הִנֵּה֙ הֵתַ֣לְתָּ בִּ֔/י וַ/תְּדַבֵּ֥ר אֵלַ֖/י כְּזָבִ֑ים עַתָּה֙ הַגִּֽידָ/ה נָּ֣א לִ֔/י בַּ/מֶּ֖ה תֵּאָסֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/010.yaml
  text: Then Delilah said to Samson[a], “Look, you have mocked me and spoken lies to me. Now please tell me what you may be bound with.”
translation:
  language: fr
  text: 'Alors Dalila dit à Samson : « Eh bien, tu t’es joué de moi[a] et tu m’as dit des mensonges. Maintenant, s’il te plaît, dis-moi avec quoi tu pourrais être attaché. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu t’es moqué de moi » ; le verbe hébreu peut désigner le fait de tourner quelqu’un en dérision ou de le traiter à la légère en le trompant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: הִנֵּה
  choice: Tu t’es moqué de moi
  rationale: Dans cette accusation, הִנֵּה attire l’attention sur le fait reproché. Une interjection comme « Regarde » serait peu naturelle ici en français ; l’effet est porté directement par l’énoncé accusateur.
- source_word: הֵתַלְתָּ בִּי
  choice: tu t’es moqué de moi
  rationale: Le verbe התל évoque le fait de tourner quelqu’un en dérision ou de se jouer de lui par tromperie. Cette formulation préserve l’insulte sans se confondre avec la mention suivante des mensonges.
- source_word: וַתְּדַבֵּר אֵלַי כְּזָבִים
  choice: et tu m’as dit des mensonges
  rationale: Rend de façon idiomatique le verbe « parler/dire », le destinataire « à moi » et le nom pluriel כְּזָבִים.
- source_word: עַתָּה
  choice: Maintenant
  rationale: Marque le passage du reproche à la nouvelle demande.
- source_word: הַגִּידָה נָּא לִי
  choice: s’il te plaît, dis-moi
  rationale: L’impératif accompagné de נָא exprime ici une requête insistante plutôt qu’un ordre abrupt.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: avec quoi on peut t’attacher
  rationale: « Avec quoi » conserve la valeur instrumentale de בַּמֶּה. La tournure impersonnelle française avec « on peut » restitue naturellement le passif et la possibilité contextuelle de תֵּאָסֵר.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue demeure direct ; « attacher » convient mieux au contexte concret que le plus soutenu « lier ».
