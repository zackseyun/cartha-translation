  - severity: low
    issue: Le marqueur attentionnel הִנֵּה n’est pas représenté dans le texte courant.
    rationale: Il peut être rendu naturellement dans cette réplique accusatrice par « Eh bien », sans recourir à un « Voici » plus littéral et moins spontané.
