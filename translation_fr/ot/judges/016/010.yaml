  verdict: revise
  source_fidelity: La tournure impersonnelle « avec quoi on peut t’attacher » atténue le passif à la deuxième personne de תֵּאָסֵר et introduit un agent indéfini qui n’est pas exprimé. « avec quoi tu pourrais être attaché » conserve l’instrument, la personne visée, le passif et la potentialité contextuelle. L’élément discursif הִנֵּה est mieux représenté par « Eh bien » que laissé entièrement implicite.
  naturalness: Le texte révisé demeure naturel en français international moderne. « Te jouer de quelqu’un » exprime avec plus de justesse la tromperie moqueuse que le seul « se moquer de quelqu’un », tandis que « dire des mensonges » reste clair et correspond au pluriel hébreu.
  terminology: Les noms propres « Dalila » et « Samson » sont usuels en français. « Attaché » convient au contexte matériel et rend sans surcharge le verbe אסר. Aucune question théologique particulière n’est en jeu.
