  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ שִׁמְשׁ֔וֹן אִם יַאַסְרֻ֗/נִי בְּ/שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/007.yaml
  text: And Samson said to her[a], “If they bind me with seven fresh bowstrings that have not dried, then I will become weak and be like one of the men.”
translation:
  language: fr
  text: 'Samson lui dit : « Si on m’attache avec sept cordes d’arc fraîches, qui n’ont pas encore séché, je perdrai ma force et je serai comme n’importe quel autre homme. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ שִׁמְשׁוֹן
  choice: Samson lui dit
  rationale: Le wayyiqtol poursuit simplement le récit. En français, l’enchaînement est naturel sans ajouter systématiquement « et ».
- source_word: יַאַסְרֻנִי
  choice: on m’attache
  rationale: La troisième personne du pluriel a ici une valeur indéfinie ; le pronom « on » rend naturellement cette valeur en français.
- source_word: יְתָרִים
  choice: cordes d’arc
  rationale: Dans ce contexte, le terme désigne des cordes employées pour les arcs plutôt que des liens génériques.
- source_word: לַחִים אֲשֶׁר לֹא חֹרָבוּ
  choice: neuves qui n’ont pas encore séché
  rationale: לַחִים évoque des cordes fraîches ou encore humides ; « neuves » est idiomatique en français, tandis que la proposition suivante conserve explicitement l’idée qu’elles n’ont pas séché.
- source_word: וְחָלִיתִי
  choice: je perdrai ma force
  rationale: Dans ce contexte, חלה décrit l’affaiblissement de Samson. Cette formulation française exprime clairement le passage de sa force extraordinaire à la faiblesse.
- source_word: כְּאַחַד הָאָדָם
  choice: comme n’importe quel autre homme
  rationale: L’expression compare Samson à un homme ordinaire. Cette formulation rend naturellement l’idiome hébreu sans suggérer un groupe précis d’hommes.
theological_decisions:
- issue: Portée de אָדָם dans l’expression comparative
  choice: comme n’importe quel autre homme
  alternative: comme l’un des hommes
  rationale: אָדָם a ici une portée humaine générique dans une comparaison avec Samson. Le contexte vise un homme ordinaire privé de force exceptionnelle ; la traduction choisie rend cette valeur idiomatique sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste simple et orale, adaptée à une parole de dialogue, tout en conservant les sept cordes d’arc et leur état non séché.
