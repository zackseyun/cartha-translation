base_translation:
  language: en
  yaml_path: translation/ot/judges/016/009.yaml
  text: The ambush was waiting for her in the inner room, and she said to him, “Philistines are upon you, Samson!” But he snapped the cords as a thread of tow snaps when it smells fire, and his strength was not discovered.
translation:
  language: fr
  text: 'Des hommes étaient postés en embuscade chez elle, dans la chambre intérieure. Elle lui dit : « Les Philistins sont sur toi, Samson ! » Mais il rompit les cordes comme se rompt un fil d’étoupe dès qu’il sent le feu. Sa force ne fut pas connue.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֹרֵב
  choice: des hommes se tenaient en embuscade
  rationale: Le singulier hébreu désigne ici collectivement les hommes placés en embuscade. Cette formulation est plus naturelle en français que « l’embuscade attendait ».
- source_word: לָהּ
  choice: pour elle
  rationale: Conserve la valeur du pronom hébreu, qui peut indiquer que les hommes embusqués étaient là à son intention ou à son service.
- source_word: בַּחֶדֶר
  choice: dans la chambre intérieure
  rationale: « Chambre intérieure » exprime le lieu retiré ou caché suggéré par le contexte, sans préciser davantage sa configuration.
- source_word: הַיְתָרִים
  choice: les cordes
  rationale: Le terme peut désigner des cordes ou cordes d’arc; « cordes » maintient ici la continuité immédiate avec les liens employés pour attacher Samson sans surspécifier leur usage.
- source_word: פְּתִיל הַנְּעֹרֶת
  choice: un fil d’étoupe
  rationale: Rend l’image concrète d’une fibre de lin préparée, qui se consume et se rompt très facilement au feu.
- source_word: בַּהֲרִיחוֹ אֵשׁ
  choice: dès qu’il sent le feu
  rationale: Préserve la personnification et l’expression imagée littérale de l’hébreu plutôt que de la réduire à « au contact du feu ».
- source_word: וְלֹא נוֹדַע כֹּחוֹ
  choice: le secret de sa force ne fut pas découvert
  rationale: Le verbe passif signifie que sa force ne fut pas connue ou découverte; l’ajout idiomatique de « secret » explicite naturellement en français que sa source demeura inconnue, conformément au fil narratif.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le cri de Dalila reste vif et direct. Le passif final conserve l’accent du texte sur le fait que la source de la force de Samson demeure inconnue.
