revisions:
- from: 'Des hommes se tenaient en embuscade pour elle dans la chambre intérieure. Elle lui dit : « Les Philistins sont sur toi, Samson ! » Mais il rompit les cordes comme se rompt un fil d’étoupe dès qu’il sent le feu. Ainsi, le secret de sa force ne fut pas découvert.'
  to: 'Des hommes étaient postés en embuscade chez elle, dans la chambre intérieure. Elle lui dit : « Les Philistins sont sur toi, Samson ! » Mais il rompit les cordes comme se rompt un fil d’étoupe dès qu’il sent le feu. Sa force ne fut pas connue.'
  rationale: La révision retire les ajouts interprétatifs « Ainsi » et « le secret de », tout en conservant le passif final et l’ambiguïté du texte quant à ce qui, de la force ou de son origine, n’était pas connu. Elle améliore aussi la formulation française de la présence de l’embuscade sans modifier la scène.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:41:12Z'
review_pass:
  verdict: revise
  source_fidelity: La scène et l’image des liens qui cèdent au feu sont bien rendues. Cependant, « le secret de sa force » ajoute « secret », absent de וְלֹא נוֹדַע כֹּחוֹ (« sa force ne fut pas connue/découverte »), et « Ainsi » ajoute une liaison inférentielle non exprimée.
  naturalness: Le français est globalement naturel et narratif. « Des hommes étaient postés en embuscade chez elle, dans la chambre intérieure » rend plus idiomatiquement la situation que « se tenaient en embuscade pour elle » tout en conservant le collectif contextuel et la valeur de לָהּ.
  terminology: « Philistins », « Samson », « cordes » et « étoupe » conviennent. « Chambre intérieure » est une possibilité acceptable pour הַחֶדֶר, sans exagérer la précision du terme.
  issues:
  - severity: medium
    issue: Ajout de « le secret de » à la dernière proposition.
    rationale: Le texte hébreu dit littéralement que sa force ne fut pas connue. Même si le contexte porte sur l’origine de cette force, « secret » explicite une notion qui n’est pas formulée dans le verset.
  - severity: low
    issue: Ajout de « Ainsi » au début de la dernière phrase.
    rationale: Le waw hébreu coordonne simplement la proposition finale; « Ainsi » impose une relation argumentative plus marquée.
  - severity: low
    issue: Formulation « pour elle » peu naturelle dans ce contexte.
    rationale: Le datif לָהּ peut être rendu contextuellement par « chez elle » ici, conformément à la présence des hommes embusqués dans la pièce où se déroule l’épisode.
  revised_text: 'Des hommes étaient postés en embuscade chez elle, dans la chambre intérieure. Elle lui dit : « Les Philistins sont sur toi, Samson ! » Mais il rompit les cordes comme se rompt un fil d’étoupe dès qu’il sent le feu. Sa force ne fut pas connue.'
  revised_footnotes: []
  revision_rationale: La révision retire les ajouts interprétatifs « Ainsi » et « le secret de », tout en conservant le passif final et l’ambiguïté du texte quant à ce qui, de la force ou de son origine, n’était pas connu. Elle améliore aussi la formulation française de la présence de l’embuscade sans modifier la scène.
