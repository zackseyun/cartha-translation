  text: But the hair of his head began to grow again after it had been shaved[a][b].
translation:
  language: fr
  text: Mais les cheveux de sa tête commencèrent à repousser après avoir été rasés[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « commencèrent à pousser ». Le verbe hébreu ne signifie pas explicitement « de nouveau » ; cette idée découle du contexte du rasage précédent.
    reason: lexical_alternative
  - marker: b
    text: Ou « lorsqu’ils eurent été rasés », ou encore « après qu’il eut été rasé ». L’hébreu permet de nuancer différemment le rapport temporel et le référent implicite du verbe.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: commencèrent
  rationale: Le verbe exprime ici le commencement d’une action. Le pluriel français s’accorde naturellement avec « les cheveux », qui rend le singulier collectif hébreu.
- source_word: שְׂעַר רֹאשׁוֹ
  choice: les cheveux de sa tête
  rationale: Cette formulation conserve l’expression hébraïque complète et l’accent narratif porté sur les cheveux de la tête de Samson.
- source_word: לְצַמֵּחַ
  choice: à repousser
  rationale: צמח signifie « pousser » ou « germer ». Puisque les cheveux viennent d’être coupés, « repousser » exprime naturellement en français la reprise de leur croissance, sans que l’idée de répétition soit explicitement portée par le verbe hébreu.
- source_word: כַּאֲשֶׁר
  choice: après avoir été
  rationale: Dans ce contexte, la conjonction introduit la circonstance temporelle liée au rasage. « Après » rend clairement la succession narrative, tout en signalant en note la possibilité de comprendre « lorsque ».
- source_word: גֻּלָּח
  choice: rasés
  rationale: Le passif de גלח signifie « être rasé ». En français, l’accord avec « cheveux » donne une phrase naturelle, tandis qu’une note conserve la possibilité de rapporter implicitement le rasage à Samson lui-même.
