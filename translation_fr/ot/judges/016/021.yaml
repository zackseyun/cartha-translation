source:
  edition: WLC
  text: וַ/יֹּאחֲז֣וּ/הוּ פְלִשְׁתִּ֔ים וַֽ/יְנַקְּר֖וּ אֶת עֵינָ֑י/ו וַ/יּוֹרִ֨ידוּ אוֹת֜/וֹ עַזָּ֗תָ/ה וַ/יַּאַסְר֨וּ/הוּ֙ בַּֽ/נְחֻשְׁתַּ֔יִם וַ/יְהִ֥י טוֹחֵ֖ן בְּ/בֵ֥ית ה/אסירים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/021.yaml
  text: Then the Philistines seized him[a], gouged out his eyes, brought him down to Gaza, bound him with bronze shackles[b], and he was grinding in the prison house.
translation:
  language: fr
  text: Alors les Philistins le saisirent, lui crevèrent les yeux[a], le firent descendre à Gaza et l’attachèrent avec des entraves de bronze. Il tournait la meule dans la prison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui arrachèrent les yeux ». Le verbe hébreu désigne concrètement la mutilation des yeux.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans la maison des prisonniers ».
    reason: literal_rendering
lexical_decisions:
- source_word: וַיֹּאחֲזוּהוּ
  choice: le saisirent
  rationale: Le verbe אחז exprime l’action de prendre fermement; « saisirent » est naturel, concis et adapté à la violence du contexte.
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Forme française courante du nom de ce peuple.
- source_word: וַיְנַקְּרוּ אֶת־עֵינָיו
  choice: lui crevèrent les yeux
  rationale: נקר désigne ici une mutilation concrète des yeux. Cette formulation française garde le caractère violent de l’acte sans le réduire au seul résultat, « le rendirent aveugle ».
- source_word: וַיּוֹרִידוּ אוֹתוֹ עַזָּתָה
  choice: le firent descendre à Gaza
  rationale: Le hifil de ירד signifie « faire descendre » ou « emmener en bas », et le hé directionnel de עַזָּתָה indique le mouvement vers Gaza.
- source_word: וַיַּאַסְרוּהוּ בַּנְחֻשְׁתַּיִם
  choice: l’attachèrent avec des entraves de bronze
  rationale: אסר signifie attacher ou lier, tandis que נְחֻשְׁתַּיִם désigne des entraves métalliques, probablement une paire. « Entraves de bronze » est précis et idiomatique.
- source_word: וַיְהִי טוֹחֵן
  choice: Il tournait la meule
  rationale: Le participe טוֹחֵן décrit une activité continue de mouture. En français, « tournait la meule » évoque clairement ce travail forcé sans ajouter explicitement le grain, absent du texte hébreu.
- source_word: בְּבֵית הָאֲסִירִים
  choice: dans la prison
  rationale: Littéralement « dans la maison des prisonniers ». « Dans la prison » en donne le sens naturel en français moderne, tandis que la forme littérale est conservée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La succession rapide des actions est conservée, avec une formulation explicite pour la mutilation et naturelle pour le travail imposé en prison.
