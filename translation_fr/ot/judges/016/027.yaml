  - severity: low
    issue: La formulation de la note « les jeux de Samson » est peu idiomatique et peut évoquer des jeux au sens d’activités ludiques.
    rationale: La note peut mieux rendre l’éventail du verbe שׂחק en indiquant « Samson jouer » comme alternative formelle et en explicitant les sens de rire, jouer, s’amuser ou donner un spectacle.
