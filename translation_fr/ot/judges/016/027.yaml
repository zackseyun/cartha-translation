  text: וְ/הַ/בַּ֗יִת מָלֵ֤א הָֽ/אֲנָשִׁים֙ וְ/הַ/נָּשִׁ֔ים וְ/שָׁ֕מָּ/ה כֹּ֖ל סַרְנֵ֣י פְלִשְׁתִּ֑ים וְ/עַל הַ/גָּ֗ג כִּ/שְׁלֹ֤שֶׁת אֲלָפִים֙ אִ֣ישׁ וְ/אִשָּׁ֔ה הָ/רֹאִ֖ים בִּ/שְׂח֥וֹק שִׁמְשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/027.yaml
  text: The house was full of men and women[a], and all the lords of the Philistines were there. And on the roof were about three thousand men and women watching Samson as he performed.
translation:
  language: fr
  text: Le bâtiment était plein d’hommes et de femmes, et tous les princes des Philistins étaient là. Sur le toit se trouvaient environ trois mille hommes et femmes qui regardaient Samson se produire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui regardaient Samson jouer ». Le terme hébreu peut évoquer le rire, le jeu, l’amusement ou le fait de donner un spectacle.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: l’édifice
  rationale: Le mot désigne une maison ou un bâtiment. Dans ce contexte public et cultuel, « l’édifice » est naturel en français sans préciser qu’il s’agit du temple, précision absente de ce verset.
- source_word: מָלֵא
  choice: était plein de
  rationale: Rend directement l’état exprimé par le prédicat hébreu et reste idiomatique en français moderne.
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים
  choice: d’hommes et de femmes
  rationale: Préserve la mention explicite des deux sexes avec une formulation française naturelle.
- source_word: וְשָׁמָּה כֹּל סַרְנֵי פְלִשְׁתִּים
  choice: et tous les princes des Philistins étaient là
  rationale: « Princes » rend le titre particulier des hauts dirigeants philistins et « étaient là » conserve l’indication de présence.
- source_word: וְעַל הַגָּג
  choice: Sur le toit se trouvaient
  rationale: Conserve la mise en relief initiale du lieu tout en donnant une syntaxe française fluide.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים
  choice: environ trois mille
  rationale: Le préfixe כ marque ici l’approximation.
- source_word: אִישׁ וְאִשָּׁה
  choice: hommes et femmes
  rationale: Les singuliers hébreux ont ici une valeur collective ou distributive; le pluriel français en transmet naturellement le sens.
- source_word: הָרֹאִים
  choice: qui regardaient
  rationale: Le participe décrit l’action continue des personnes rassemblées sur le toit.
- source_word: בִּשְׂחוֹק שִׁמְשׁוֹן
  choice: Samson se produire
  rationale: Cette formulation lisible présente Samson comme le spectacle observé sans ajouter de complément absent de l’hébreu. Une note conserve l’éventail sémantique difficile de שׂחק.
