  source_fidelity: 'Le sens général est fidèle : le bâtiment est rempli, tous les dirigeants philistins sont présents, et environ trois mille hommes et femmes observent Samson. « Se produire » rend de façon recevable l’ambiguïté de בִּשְׂחוֹק, sans ajouter explicitement un destinataire de son divertissement. En revanche, « édifice » est plus soutenu et plus institutionnel que le terme hébreu courant בַּיִת (« maison / bâtiment »).'
