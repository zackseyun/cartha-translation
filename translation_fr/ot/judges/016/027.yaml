  terminology: « Princes des Philistins » est un rendu approprié de סַרְנֵי פְלִשְׁתִּים. « Toit », « environ trois mille » et « hommes et femmes » sont exacts. La note doit présenter « jeux de Samson » comme une possibilité formelle, mais l’alternative la plus claire est « Samson jouer / se divertir », avec l’avertissement que le terme peut aussi désigner une prestation ou un divertissement.
  issues:
