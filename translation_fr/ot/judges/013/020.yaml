  text: וַ/יְהִי֩ בַ/עֲל֨וֹת הַ/לַּ֜הַב מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ הַ/שָּׁמַ֔יְמָ/ה וַ/יַּ֥עַל מַלְאַךְ יְהוָ֖ה בְּ/לַ֣הַב הַ/מִּזְבֵּ֑חַ וּ/מָנ֤וֹחַ וְ/אִשְׁתּ/וֹ֙ רֹאִ֔ים וַ/יִּפְּל֥וּ עַל פְּנֵי/הֶ֖ם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/020.yaml
  text: And when the flame went up from the altar toward heaven[a], the angel of Yahweh went up in the flame of the altar, while Manoah and his wife were watching[b]; and they fell on their faces to the ground.
translation:
  language: fr
  text: Lorsque la flamme monta de l’autel vers le ciel, l’ange de Yahweh[a] monta dans la flamme de l’autel sous les yeux de Manoah et de sa femme. Alors ils tombèrent face contre terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ». Le mot hébreu peut désigner un ange ou un messager.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּעֲלוֹת
  choice: Lorsque … monta
  rationale: La construction introduit une circonstance temporelle. « Lorsque » restitue naturellement la progression narrative sans reproduire lourdement l’idiome « il arriva que ».
- source_word: הַלַּהַב
  choice: la flamme
  rationale: לַהַב désigne une flamme ou un feu ardent ; « la flamme » est ici précis, concret et naturel.
- source_word: מֵעַל הַמִּזְבֵּחַ הַשָּׁמַיְמָה
  choice: de l’autel vers le ciel
  rationale: מֵעַל exprime le point de départ situé au-dessus de l’autel, tandis que la finale directionnelle de הַשָּׁמַיְמָה indique le mouvement vers le ciel.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut signifier « ange » ou « messager ». Dans ce contexte surnaturel, « ange » convient au texte principal, tandis qu’une note conserve l’autre possibilité lexicale.
- source_word: בְּלַהַב הַמִּזְבֵּחַ
  choice: dans la flamme de l’autel
  rationale: La préposition בְּ est rendue de façon locative, ce qui préserve l’image visible sans préciser davantage le mécanisme de l’ascension.
- source_word: וּמָנוֹחַ וְאִשְׁתּוֹ רֹאִים
  choice: sous les yeux de Manoah et de sa femme
  rationale: Le participe רֹאִים marque leur observation continue pendant l’événement. Cette tournure française exprime clairement la simultanéité.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם אָרְצָה
  choice: ils tombèrent face contre terre
  rationale: Cette expression française actuelle restitue idiomatiquement la posture littérale « sur leurs faces, à terre », avec sa valeur de crainte et de prosternation.
theological_decisions:
- issue: Identité de מַלְאַךְ יְהוָה
  choice: « l’ange de Yahweh », sans préciser davantage son identité
  alternative: « le messager de Yahweh » ou interprétation explicite comme manifestation divine
  rationale: Le texte désigne le personnage comme l’ange ou le messager de Yahweh, mais ne demande pas au traducteur de trancher la question théologique de son identité. La formulation conserve cette tension.
translation_notes:
  register: Français international moderne, narratif et digne. « Face contre terre » rend naturellement l’idiome hébreu ; aucune note n’est nécessaire pour cette expression. Le nom divin est translittéré « Yahweh » conformément à la couche de consultation fournie.
