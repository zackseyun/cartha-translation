  text: וַ/יֵּרָ֥א מַלְאַךְ יְהוָ֖ה אֶל הָ/אִשָּׁ֑ה וַ/יֹּ֣אמֶר אֵלֶ֗י/הָ הִנֵּה נָ֤א אַתְּ עֲקָרָה֙ וְ/לֹ֣א יָלַ֔דְתְּ וְ/הָרִ֖ית וְ/יָלַ֥דְתְּ בֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/003.yaml
  text: And the angel of the LORD appeared to the woman and said to her, “Look, please—you are barren and have not borne children, but you will conceive and bear a son.”
translation:
  language: fr
  text: 'L’ange du SEIGNEUR apparut à la femme et lui dit : « Vois donc : tu es stérile et tu n’as pas eu d’enfant, mais tu concevras et tu mettras au monde un fils. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange du SEIGNEUR
  rationale: « Ange » rend מַלְאַךְ dans ce contexte d’apparition divine, et « le SEIGNEUR » suit la convention française courante pour le tétragramme יהוה.
- source_word: הִנֵּה נָא
  choice: Écoute
  rationale: Cette interpellation naturelle en français rend la fonction d’appel à l’attention de הִנֵּה, tandis que נָא en adoucit ou en souligne l’énoncé. Une traduction mot à mot comme « Voici, je te prie » serait obscure et peu idiomatique ici.
- source_word: עֲקָרָה
  choice: stérile
  rationale: Le terme désigne directement une femme qui ne peut avoir d’enfant, sans atténuer la dureté de la situation décrite.
- source_word: וְלֹא יָלַדְתְּ
  choice: tu n’as jamais eu d’enfant
  rationale: Cette formulation française idiomatique exprime le fait qu’elle n’a pas enfanté jusqu’alors, sans suggérer qu’elle aurait seulement cessé d’en avoir.
- source_word: וְהָרִית וְיָלַדְתְּ בֵּן
  choice: mais tu vas devenir enceinte et mettre au monde un fils
  rationale: Le français explicite naturellement le contraste entre la stérilité présente et la promesse qui suit. « Mettre au monde » rend ילד de façon claire et actuelle.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: « Le SEIGNEUR » est une convention française largement intelligible qui distingue le nom divin par les capitales, sans imposer une vocalisation reconstruite.
- issue: Identification de « l’ange du SEIGNEUR »
  choice: Conserver simplement le titre du texte
  alternative: L’identifier explicitement à Dieu ou à une figure divine particulière
  rationale: Le verset nomme le personnage sans résoudre ici toutes les questions relatives à son identité; la traduction préserve cette tension narrative et théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste naturel, tandis que le contraste entre la stérilité passée et la naissance promise est conservé avec netteté.
