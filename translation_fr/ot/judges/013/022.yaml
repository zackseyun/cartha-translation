id: JDG.13.22
reference: Judges 13:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל אִשְׁתּ֖/וֹ מ֣וֹת נָמ֑וּת כִּ֥י אֱלֹהִ֖ים רָאִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/022.yaml
  text: And Manoah said to his wife[a], “We will surely die, because we have seen God.”
translation:
  language: fr
  text: 'Manoah dit à sa femme : « Nous allons mourir, c’est certain, car nous avons vu Dieu[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un dieu » ou « un être divin ». Dans certains contextes, le mot hébreu אֱלֹהִים peut désigner plus largement un être divin, mais ici le contexte favorise « Dieu ».
    reason: Alternative lexicale permettant de préserver l’étendue sémantique du terme hébreu.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol poursuit le récit au passé. En français, le passé simple rend naturellement cette progression sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: מָנוֹחַ
  choice: Manoah
  rationale: Translittération française usuelle du nom propre.
- source_word: אֶל אִשְׁתּוֹ
  choice: à sa femme
  rationale: Expression relationnelle idiomatique et exacte dans ce contexte.
- source_word: מוֹת נָמוּת
  choice: Nous allons mourir, c’est certain
  rationale: L’infinitif absolu suivi de l’imparfait du même verbe renforce fortement l’affirmation. Cette formulation française actuelle exprime clairement la certitude de Manoah sans lourdeur littérale.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de la crainte de Manoah. « Car » convient au registre narratif digne et reste naturel.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, Manoah comprend la rencontre comme une vision de Dieu. Le mot hébreu peut cependant désigner plus largement un dieu ou un être divin, possibilité signalée en note afin de préserver l’ambiguïté lexicale.
- source_word: רָאִינוּ
  choice: nous avons vu
  rationale: Le parfait à la première personne du pluriel décrit une rencontre accomplie dont Manoah tire une conséquence immédiate. Le passé composé est naturel en français.
theological_decisions:
- issue: Sens de אֱלֹהִים dans l’exclamation de Manoah après l’apparition du messager de l’Éternel
  choice: Dieu
  alternative: un dieu ; un être divin
  rationale: Le contexte immédiat présente l’apparition comme une rencontre avec Dieu et explique ainsi la peur de mourir. La traduction principale garde cette force théologique, tandis que la note conserve l’étendue sémantique du terme sans trancher davantage le mystère narratif de l’identité du messager.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Nous allons mourir, c’est certain » restitue avec naturel l’intensification hébraïque. Le point d’exclamation rend la vive crainte exprimée par Manoah. Le marqueur de note est placé après « Dieu », le mot auquel la note se rapporte.
