source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מָנ֜וֹחַ אֶת גְּדִ֤י הָ/עִזִּים֙ וְ/אֶת הַ/מִּנְחָ֔ה וַ/יַּ֥עַל עַל הַ/צּ֖וּר לַֽ/יהוָ֑ה וּ/מַפְלִ֣א לַ/עֲשׂ֔וֹת וּ/מָנ֥וֹחַ וְ/אִשְׁתּ֖/וֹ רֹאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/019.yaml
  text: So Manoah took the young goat and the grain offering[a], and offered them on the rock to Yahweh, and he did a wondrous thing while Manoah and his wife were watching.
translation:
  language: fr
  text: Manoah prit le chevreau et l’offrande de céréales, et les offrit sur le rocher à Yahvé, tandis qu’il accomplissait quelque chose de merveilleux sous les yeux de Manoah et de sa femme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’ange de Yahvé accomplissait quelque chose de merveilleux ». L’hébreu est elliptique et ne répète pas explicitement le sujet, mais le contexte indique qu’il s’agit du messager de Yahvé.'
    reason: alternative_reading
lexical_decisions:
- source_word: גְּדִי הָעִזִּים
  choice: le chevreau
  rationale: Expression française naturelle désignant un jeune de la chèvre, adaptée au contexte sacrificiel.
- source_word: הַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans ce contexte cultuel, מִנְחָה désigne vraisemblablement l’offrande végétale qui accompagne l’animal; cette formulation reste claire en français courant.
- source_word: וַיַּעַל עַל הַצּוּר לַיהוָה
  choice: les offrit sur le rocher à Yahvé
  rationale: Le verbe עלה prend ici son sens sacrificiel d’offrir ou de faire monter en offrande. Le pluriel français reprend naturellement le chevreau et l’offrande.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: La transcription du nom divin rend directement le tétragramme יהוה et concorde avec la couche anglaise POB fournie.
- source_word: וּמַפְלִא לַעֲשׂוֹת
  choice: il accomplit une chose merveilleuse
  rationale: La tournure restitue l’action extraordinaire exprimée par פלא, tout en conservant le sujet masculin implicite sans l’identifier explicitement dans le texte principal.
- source_word: רֹאִים
  choice: sous les yeux de
  rationale: 'Cette expression française idiomatique rend la valeur durative du participe: Manoah et sa femme assistent à l’action en train de se produire.'
theological_decisions:
- issue: Sujet implicite de וּמַפְלִא לַעֲשׂוֹת
  choice: Conserver le pronom « il » sans nommer son référent dans le texte principal.
  alternative: « l’ange de Yahvé accomplit une chose merveilleuse » ou une formulation impersonnelle telle que « quelque chose de merveilleux se produisit ».
  rationale: L’hébreu ne répète pas explicitement le sujet. Le contexte oriente vers le messager de Yahvé, mais l’expliciter dans le corps du verset résoudrait une ellipse réelle du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe a été légèrement réorganisée pour éviter une succession lourde de coordinations, sans supprimer l’ambiguïté du sujet de la dernière action.
