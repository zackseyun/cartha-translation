revisions:
- from: Manoah prit donc le chevreau et l’offrande de céréales, et les offrit sur le rocher à Yahvé. Alors, sous les yeux de Manoah et de sa femme, il accomplit une chose merveilleuse[a].
  to: Manoah prit le chevreau et l’offrande de céréales, et les offrit sur le rocher à Yahvé, tandis qu’il accomplissait quelque chose de merveilleux sous les yeux de Manoah et de sa femme[a].
  rationale: La révision retire des connecteurs interprétatifs, conserve l’ellipse du sujet masculin et rend la dernière scène comme une action extraordinaire accomplie pendant que Manoah et sa femme regardent. Elle maintient les termes cultuels et le nom divin retenus dans le projet.
