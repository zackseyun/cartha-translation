source:
  edition: WLC
  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֧ד מִ/צָּרְעָ֛ה מִ/מִּשְׁפַּ֥חַת הַ/דָּנִ֖י וּ/שְׁמ֣/וֹ מָנ֑וֹחַ וְ/אִשְׁתּ֥/וֹ עֲקָרָ֖ה וְ/לֹ֥א יָלָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/002.yaml
  text: There was a certain man from Zorah[a], from the clan of the Danites, and his name was Manoah. His wife was barren and had not borne children.
translation:
  language: fr
  text: Il y avait un homme de Tsorea, du clan des Danites, qui s’appelait Manoah. Sa femme était stérile et n’avait pas eu d’enfant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Il y avait
  rationale: Cette forme narrative de היה introduit une nouvelle scène. « Il y avait » restitue naturellement cette fonction sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: אִישׁ אֶחָד
  choice: un homme
  rationale: אֶחָד individualise ici le personnage qui va être nommé. En français actuel, « un homme » suffit naturellement dans cette formule d’introduction; « un certain homme » serait possible, mais plus marqué.
- source_word: מִצָּרְעָה
  choice: de Tsorea
  rationale: La préposition מִן indique la provenance. « De Tsorea » est idiomatique en français et conserve le nom du lieu par translittération.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: du clan des Danites
  rationale: מִשְׁפָּחָה désigne ici un groupe de parenté au sein de la structure tribale; « clan » est donc plus précis que « tribu » ou, dans ce contexte, « famille ».
- source_word: וּשְׁמוֹ מָנוֹחַ
  choice: qui s’appelait Manoah
  rationale: Cette tournure française restitue naturellement la formule hébraïque « et son nom était Manoah » sans alourdir la phrase.
- source_word: וְאִשְׁתּוֹ
  choice: Sa femme
  rationale: Le possessif traduit le nom avec suffixe pronominal. Une nouvelle phrase rend la progression naturelle en français, tandis que le lien avec Manoah reste explicite.
- source_word: עֲקָרָה
  choice: était stérile
  rationale: « Stérile » est le terme français courant et concis pour l’incapacité d’avoir des enfants dans ce récit d’annonce de naissance.
- source_word: וְלֹא יָלָדָה
  choice: et n’avait pas eu d’enfant
  rationale: Le verbe ילד avec un sujet féminin signifie enfanter ou mettre au monde. Cette formulation française reste naturelle et ne transforme pas en pluriel un objet que l’hébreu n’exprime pas.
