source:
  edition: WLC
  text: מִ/כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/גֶּ֨פֶן הַ/יַּ֜יִן לֹ֣א תֹאכַ֗ל וְ/יַ֤יִן וְ/שֵׁכָר֙ אַל תֵּ֔שְׁתְּ וְ/כָל טֻמְאָ֖ה אַל תֹּאכַ֑ל כֹּ֥ל אֲשֶׁר צִוִּיתִ֖י/הָ תִּשְׁמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/014.yaml
  text: She must not eat anything that comes from the grapevine[a], and she must not drink wine or strong drink, and she must not eat anything unclean. She must keep all that I commanded her.
translation:
  language: fr
  text: Elle ne mangera rien de ce qui provient de la vigne[a] ; elle ne boira ni vin ni boisson alcoolisée et ne mangera rien d’impur. Elle observera tout ce que je lui ai ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « de tout ce qui sort de la vigne du vin », c’est-à-dire tout produit de la vigne.'
    reason: La note conserve la forme imagée et inhabituelle de l’expression hébraïque derrière la formulation française naturelle.
lexical_decisions:
- source_word: מִכֹּל אֲשֶׁר יֵצֵא מִגֶּפֶן הַיַּיִן
  choice: rien de ce qui provient de la vigne
  rationale: Cette formulation naturelle conserve la portée globale de l’hébreu et la valeur verbale de יֵצֵא, sans reproduire littéralement l’expression peu idiomatique « vigne du vin ».
- source_word: לֹא תֹאכַל / אַל תֵּשְׁתְּ / אַל תֹּאכַל
  choice: elle ne mangera pas / elle ne boira pas
  rationale: Le futur français exprime ici avec dignité et naturel la valeur prescriptive des interdictions hébraïques.
- source_word: יַיִן
  choice: vin
  rationale: Équivalent français usuel et précis.
- source_word: שֵׁכָר
  choice: boisson alcoolisée
  rationale: Terme générique moderne pour une boisson alcoolique autre que le vin ; il évite de limiter indûment le sens à la bière et sonne plus naturel aujourd’hui que « boisson forte ».
- source_word: כָל טֻמְאָה
  choice: rien d’impur
  rationale: Rend l’expression générale sans préciser la nature de l’aliment ; « impur » conserve le registre biblique et rituel.
- source_word: כֹּל אֲשֶׁר צִוִּיתִיהָ תִּשְׁמֹר
  choice: elle observera tout ce que je lui ai ordonné
  rationale: « Observer » rend clairement שׁמר lorsqu’il s’agit de respecter des prescriptions ; le passé composé situe naturellement en français l’ordre déjà donné.
theological_decisions:
- issue: Étendue de l’interdiction concernant la vigne
  choice: Comprendre l’expression comme englobant tout ce qui provient de la vigne.
  alternative: La limiter aux raisins ou aux seuls produits de la vigne qui se mangent.
  rationale: La tournure hébraïque est délibérément globale. La traduction en maintient l’étendue sans introduire dans le texte principal une terminologie technique nazaréenne.
- issue: Sens de טֻמְאָה
  choice: Employer « impur » dans son sens biblique et rituel.
  alternative: Employer « souillé » ou expliciter « rituellement impur ».
  rationale: « Impur » préserve les liens avec les catégories de pureté de la Torah tout en laissant au contexte le soin d’en préciser la portée.
translation_notes:
  register: Français international moderne, clair et digne. Les propositions coordonnées suivent le rythme cumulatif de l’hébreu ; le point-virgule évite une phrase trop lourde. Le féminin explicite reprend la femme à qui les prescriptions s’appliquent dans le contexte.
