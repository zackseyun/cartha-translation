  text: וְ/עַתָּה֙ הִשָּׁ֣מְרִי נָ֔א וְ/אַל תִּשְׁתִּ֖י יַ֣יִן וְ/שֵׁכָ֑ר וְ/אַל תֹּאכְלִ֖י כָּל טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/004.yaml
  text: Now please be careful[a], and do not drink wine or strong drink[c][b], and do not eat anything unclean.
translation:
  language: fr
  text: 'Maintenant, je t’en prie, prends bien garde[a] : ne bois ni vin ni boisson enivrante[b], et ne mange rien d’impur[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « veille attentivement sur toi-même » ou « sois sur tes gardes ».
    reason: lexical_alternative
  - marker: b
    text: La « boisson enivrante » désigne ici des boissons alcoolisées autres que le vin.
    reason: cultural_note
  - marker: c
    text: Ou « ne mange aucune chose impure ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque la transition vers les instructions qui suivent. « Maintenant » est naturel en français moderne ; la coordination initiale peut rester implicite.
- source_word: הִשָּׁמְרִי נָא
  choice: je t’en prie, prends garde à toi
  rationale: L’impératif féminin du nifal de שׁמר exprime ici la vigilance envers soi-même. « Je t’en prie » rend la particule d’insistance ou de sollicitation נָא sans affaiblir l’ordre.
- source_word: וְאַל תִּשְׁתִּי
  choice: ne bois
  rationale: Prohibition adressée directement à la femme ; l’impératif négatif français en restitue naturellement la force.
- source_word: יַיִן
  choice: vin
  rationale: Équivalent lexical direct.
- source_word: וְשֵׁכָר
  choice: boisson enivrante
  rationale: שֵׁכָר désigne une boisson alcoolisée distincte du vin, sans se limiter nécessairement à la bière. Cette formulation est plus claire aujourd’hui que « boisson forte ».
- source_word: וְאַל תֹּאכְלִי
  choice: et ne mange
  rationale: La conjonction est conservée afin de rendre l’enchaînement des deux interdictions.
- source_word: כָּל טָמֵא
  choice: rien d’impur
  rationale: L’adjectif substantivé avec כָּל désigne toute chose ou tout aliment rituellement impur. « Rien d’impur » est idiomatique sans restreindre explicitement le référent aux seuls aliments.
theological_decisions:
- issue: Sens de טָמֵא dans ce contexte
  choice: impur
  alternative: souillé ; rituellement impur
  rationale: Le mot renvoie à la catégorie cultuelle définie dans la Torah. « Impur » préserve cette portée sans la réduire à l’hygiène ou à une faute morale ; l’explicitation « rituellement » serait interprétative dans le corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe au singulier. La formulation conserve la sollicitation exprimée par נָא, les deux interdictions coordonnées et la portée rituelle de טָמֵא.
