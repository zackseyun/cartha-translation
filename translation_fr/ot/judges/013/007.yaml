    issue: Ajout de « Car » en tête du verset
    rationale: Le texte hébreu commence par la forme narrative « il m’a dit » et ne comporte pas de conjonction causale. Le contexte peut suggérer une explication, mais le français peut la laisser implicite.
  - severity: medium
    issue: Formulation littérale inexacte dans la note
    rationale: 'La note traduit וְיֹלַדְתְּ par un participe présent (« mettant au monde »), alors que, dans cette annonce, la forme se rend naturellement par un futur : « tu enfanteras / tu mettras au monde ».'
  - severity: low
    issue: « Boisson alcoolisée » recouvre également le vin
    rationale: Bien que compréhensible, cette expression brouille légèrement l’opposition lexicale entre יַיִן (« vin ») et שֵׁכָר. « Boisson enivrante » reste moderne et plus distinctif.
