  to: 'Il m’a dit[a] : « Tu concevras et mettras au monde un fils. À présent, ne bois ni vin ni boisson enivrante, et ne mange rien d’impur, car le garçon sera naziréen de Dieu dès le ventre maternel jusqu’au jour de sa mort. »'
  rationale: La révision supprime l’inférence causale ajoutée en tête de phrase, corrige la note pour refléter la valeur verbale du texte hébreu et affine la distinction entre le vin et le שֵׁכָר. Le terme technique « naziréen » et l’ambiguïté formelle de l’annonce sont conservés.
