base_translation:
  language: en
  yaml_path: translation/ot/judges/013/007.yaml
  text: For he said to me[a], ‘Look, you will conceive and bear a son. So now, do not drink wine or strong drink, and do not eat anything unclean[b], for the boy will be a Nazirite of God from the womb until the day of his death.’
translation:
  language: fr
  text: 'Il m’a dit[a] : « Tu concevras et mettras au monde un fils. À présent, ne bois ni vin ni boisson enivrante, et ne mange rien d’impur, car le garçon sera naziréen de Dieu dès le ventre maternel jusqu’au jour de sa mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Voici, tu es enceinte et tu enfanteras un fils » ; dans ce contexte, la formulation exprime naturellement une annonce : « Tu concevras et mettras au monde un fils. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Car il m’a dit
  rationale: Dans le récit rapporté par la femme de Manoah, « car » exprime naturellement en français le lien explicatif avec ce qui précède, même si l’hébreu emploie simplement la conjonction narrative.
- source_word: הִנָּךְ הָרָה
  choice: Tu vas être enceinte
  rationale: La forme hébraïque peut se comprendre littéralement comme « te voici enceinte », mais le contexte d’annonce permet une valeur prospective. La note conserve l’ambiguïté formelle.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: et mettre au monde un fils
  rationale: Expression française naturelle et précise pour l’acte d’enfanter, avec maintien de la référence masculine explicite.
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Rend à la fois la transition temporelle et le lien logique entre l’annonce et les consignes.
- source_word: יַיִן וְשֵׁכָר
  choice: vin ni boisson alcoolisée
  rationale: שֵׁכָר désigne une boisson enivrante autre que le vin. « Boisson alcoolisée » est actuel, clair et évite de préciser indûment un type de boisson.
- source_word: כָּל טֻמְאָה
  choice: rien d’impur
  rationale: Formulation idiomatique qui conserve la catégorie rituelle de l’impureté sans la réduire à une simple insalubrité.
- source_word: נְזִיר אֱלֹהִים
  choice: naziréen de Dieu
  rationale: Le terme technique « naziréen » préserve le statut particulier de consécration exprimé par נָזִיר; « de Dieu » rend directement le rapport génitif sans l’expliciter davantage.
- source_word: הַנַּעַר
  choice: le garçon
  rationale: Ce choix garde la référence masculine déjà donnée par « fils » et convient au contexte de l’enfance.
- source_word: מִן הַבֶּטֶן
  choice: dès le ventre maternel
  rationale: Conserve l’image et le point de départ prénatal de l’hébreu, dans une formulation française claire.
- source_word: עַד יוֹם מוֹתוֹ
  choice: jusqu’au jour de sa mort
  rationale: Traduction directe qui préserve la formulation temporelle solennelle de l’hébreu.
theological_decisions:
- issue: Désignation du naziréen
  choice: naziréen de Dieu
  alternative: consacré à Dieu
  rationale: Le texte emploie un terme technique lié au naziréat. Le conserver évite d’aplatir ce statut en une consécration générique ou d’ajouter une interprétation doctrinale.
- issue: Valeur temporelle de l’annonce de la grossesse
  choice: Tu vas être enceinte et mettre au monde un fils
  alternative: Te voici enceinte, et tu mettras au monde un fils
  rationale: Le contexte favorise une annonce prospective, tandis que la forme hébraïque peut sembler décrire un état présent. La traduction principale privilégie le sens contextuel et la note signale la formulation plus littérale.
translation_notes:
  register: Français international moderne, naturel et digne. Le vocabulaire technique « naziréen » est conservé; les tournures archaïques comme « voici que tu concevras » sont évitées. La ponctuation distingue clairement les paroles rapportées.
