  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד פְּלִשְׁתִּ֖ים אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[b][a], and Yahweh gave them into the hand of the Philistines for forty years.
translation:
  language: fr
  text: Les Israélites[a] recommencèrent à faire ce qui est mal aux yeux de Yahweh. Alors Yahweh les livra aux mains des Philistins pendant quarante ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les fils d’Israël » ; cette expression désigne collectivement le peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: recommencèrent à faire
  rationale: Avec l’infinitif, יסף exprime ici la répétition. « Recommencèrent à faire » rend naturellement la reprise du mal dans le cycle narratif des Juges.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites[a]
  rationale: Littéralement « les fils d’Israël », cette expression désigne collectivement le peuple d’Israël. « Les Israélites » est naturel, exact quant à la portée collective et n’exclut pas implicitement les femmes.
- source_word: לַעֲשׂוֹת הָרַע
  choice: faire ce qui est mal
  rationale: Cette formulation française courante conserve la valeur qualitative de l’expression hébraïque et la formule récurrente du livre.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La traduction conserve l’image hébraïque tout en exprimant clairement qu’il s’agit de l’évaluation de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
- source_word: וַיִּתְּנֵם
  choice: les livra
  rationale: Dans la construction « donner dans la main de », נתן signifie remettre des personnes au pouvoir d’un adversaire. « Livra » rend cet idiome avec naturel.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: aux mains des Philistins
  rationale: « Aux mains de » est un idiome français transparent qui conserve l’image de la main comme symbole de pouvoir. Le pluriel est plus idiomatique en français que le singulier hébreu collectif.
- source_word: אַרְבָּעִים שָׁנָה
  choice: pendant quarante ans
  rationale: « Pendant » explicite naturellement en français la durée exprimée par l’hébreu.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre sans lui substituer un titre.
- issue: Portée de la désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël ; le peuple d’Israël
  rationale: L’expression hébraïque est masculine dans sa forme, mais désigne ici toute la collectivité nationale. « Les Israélites » en restitue la portée sans suggérer que seuls les hommes sont concernés.
translation_notes:
  register: Français international moderne, narratif et digne. La coordination est rendue par « Alors » pour marquer naturellement la conséquence narrative. L’image « aux yeux de » est conservée, tandis que « aux mains de » transpose l’idiome hébreu dans une expression française courante.
