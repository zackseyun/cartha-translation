source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל מַלְאַ֥ךְ יְהוָ֖ה מִ֣י שְׁמֶ֑/ךָ כִּֽי יָבֹ֥א דברי/ך וְ/כִבַּדְנֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/017.yaml
  text: Then Manoah said to the angel of Yahweh[a], “What is your name, so that when your words come to pass, we may honor you?”
translation:
  language: fr
  text: 'Manoah dit alors à l’ange de Yahweh[a] : « Quel est ton nom, afin que nous puissions t’honorer lorsque tes paroles s’accompliront ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au messager de Yahweh ».'
    reason: 'Alternative lexicale : מַלְאָךְ peut signifier « ange » ou « messager ».'
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager ou un ange. Dans ce récit, le personnage est présenté comme un être surnaturel ; « ange » est donc naturel, tandis que la note conserve l’autre sens lexical possible. Le nom divin יְהוָה est rendu par « Yahweh ».
- source_word: מִי שְׁמֶךָ
  choice: Quel est ton nom ?
  rationale: L’expression hébraïque demande directement le nom de l’interlocuteur. Cette formulation est naturelle et digne en français.
- source_word: כִּי
  choice: Ainsi
  rationale: 'Dans le contexte, כִּי relie la demande de Manoah à l’objectif envisagé : connaître le nom permettra d’honorer l’interlocuteur lorsque ses paroles s’accompliront. « Ainsi » exprime ce rapport sans surdéterminer la valeur exacte de la conjonction.'
- source_word: יָבֹא דְבָרֶיךָ
  choice: lorsque tes paroles se réaliseront
  rationale: Le pluriel דְבָרֶיךָ est conservé par « tes paroles ». Le verbe בוא, littéralement « venir », forme ici une expression indiquant que les paroles annoncées deviennent réalité.
- source_word: וְכִבַּדְנוּךָ
  choice: nous pourrons t’honorer
  rationale: Le piel de כבד signifie ici « honorer ». « Pourrons » rend naturellement l’action envisagée à la suite de l’accomplissement, sans introduire la connotation théologique plus forte de « glorifier ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » le traite comme le nom propre divin et évite de le remplacer par un titre.
- issue: Nature de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Le contexte narratif favorise « ange », mais le terme hébreu signifie aussi « messager ». La variante est donc signalée sans trancher davantage l’identité théologique du personnage.
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement correspond au singulier hébreu adressé directement à l’ange. La ponctuation clarifie le lien entre la question et le but recherché.
