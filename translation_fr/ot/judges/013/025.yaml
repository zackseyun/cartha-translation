source:
  edition: WLC
  text: וַ/תָּ֨חֶל֙ ר֣וּחַ יְהוָ֔ה לְ/פַעֲמ֖/וֹ בְּ/מַחֲנֵה דָ֑ן בֵּ֥ין צָרְעָ֖ה וּ/בֵ֥ין אֶשְׁתָּאֹֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/025.yaml
  text: And the Spirit of Yahweh began to stir him in Mahaneh-dan[b][a], between Zorah and Eshtaol.
translation:
  language: fr
  text: L’Esprit de Yahweh commença à le pousser[a] à Mahané-Dan[b], entre Tsorea et Eshtaol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’animer » ou « à le mettre en mouvement ».
    reason: lexical_alternative
  - marker: b
    text: Mahané-Dan signifie « camp de Dan »; l’expression est ici employée comme nom de lieu.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּחֶל
  choice: commença
  rationale: Le hifil wayyiqtol de חלל exprime ici le commencement d’une action; « commença » restitue naturellement cette valeur ingressive dans le récit.
- source_word: רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  rationale: Dans le cycle de Samson, l’expression désigne la présence divine qui le met en action. « Esprit » convient mieux au contexte que « vent » ou « souffle », sans ajouter de développement doctrinal ultérieur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin du texte hébreu et suit l’usage du projet.
- source_word: לְפַעֲמוֹ
  choice: à le pousser
  rationale: Le verbe פעם peut évoquer une impulsion, une mise en mouvement ou une agitation. « Le pousser » exprime l’impulsion divine sans préciser indûment sa forme; une note conserve d’autres nuances possibles.
- source_word: בְּמַחֲנֵה דָן
  choice: à Mahané-Dan
  rationale: L’expression, littéralement « camp de Dan », fonctionne ici comme un nom de lieu. La translittération préserve cette fonction toponymique.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: entre Tsorea et Eshtaol
  rationale: Traduction directe de l’indication géographique, avec des formes françaises claires des noms de lieux.
theological_decisions:
- issue: Nature de רוּחַ יְהוָה dans ce contexte
  choice: l’Esprit de Yahweh comme présence divine qui pousse Samson à agir
  alternative: le vent de Yahweh ou le souffle de Yahweh
  rationale: Dans le récit de Samson, l’expression décrit l’action divine qui commence à se manifester en lui, et non un phénomène météorologique. La formulation reste sobre et ne précise pas davantage le mode de cette action.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ou Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre divin conformément à l’orientation du projet.
translation_notes:
  register: Français international moderne, simple et digne. La phrase suit l’ordre narratif de l’hébreu sans lourdeur. « Pousser » demeure volontairement assez large pour conserver l’ambiguïté du verbe hébreu, tandis que la note présente ses principales nuances.
