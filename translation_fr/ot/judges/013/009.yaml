source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע הָ/אֱלֹהִ֖ים בְּ/ק֣וֹל מָנ֑וֹחַ וַ/יָּבֹ֣א מַלְאַךְ֩ הָ/אֱלֹהִ֨ים ע֜וֹד אֶל הָ/אִשָּׁ֗ה וְ/הִיא֙ יוֹשֶׁ֣בֶת בַּ/שָּׂדֶ֔ה וּ/מָנ֥וֹחַ אִישָׁ֖/הּ אֵ֥ין עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/009.yaml
  text: And God listened to the voice of Manoah, and the angel of God came again to the woman while she was sitting in the field, and Manoah her husband was not with her.
translation:
  language: fr
  text: Dieu écouta la voix de Manoah, et l’ange de Dieu revint vers la femme pendant qu’elle était assise dans le champ. Manoah, son mari, n’était pas avec elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: écouta
  rationale: Le verbe שׁמע peut signifier « entendre » ou « écouter ». Ici, Dieu donne suite à la prière de Manoah au verset précédent ; « écouta » exprime cette attention favorable sans ajouter explicitement l’idée d’exaucement.
- source_word: בְּקוֹל מָנוֹחַ
  choice: la voix de Manoah
  rationale: La tournure conserve l’expression hébraïque שׁמע בקול, intelligible et digne en français, plutôt que de la remplacer par l’interprétation « la demande de Manoah ».
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: l’ange de Dieu
  rationale: מַלְאָךְ désigne un messager et, dans ce récit, un messager céleste ; « ange » est donc le terme français naturel et contextuellement précis.
- source_word: עוֹד
  choice: revint
  rationale: עוֹד marque ici la répétition de la venue. Le préfixe verbal indiquant le mouvement vers la femme, « revint vers » rend naturellement en français l’idée de « vint de nouveau vers ».
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Le substantif est rendu directement et maintient la manière dont le personnage est désigné dans le récit, sans le remplacer ici par « l’épouse ».
- source_word: וְהִיא יוֹשֶׁבֶת
  choice: pendant qu’elle était assise
  rationale: Le participe décrit l’action d’arrière-plan au moment de la venue de l’ange ; cette formulation est naturelle en français.
- source_word: בַּשָּׂדֶה
  choice: dans le champ
  rationale: Rendu locatif direct de la préposition et du nom, sans précision absente du texte.
- source_word: אִישָׁהּ
  choice: son mari
  rationale: Dans ce contexte conjugal, אִישׁ muni du suffixe féminin signifie idiomatiquement « son mari ».
- source_word: אֵין עִמָּהּ
  choice: n’était pas avec elle
  rationale: La construction existentielle négative avec עִם exprime l’absence auprès de quelqu’un ; ce rendu est à la fois fidèle et idiomatique.
theological_decisions:
- issue: Sens de הָאֱלֹהִים dans ce verset
  choice: Dieu
  alternative: les dieux
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים désigne ici le Dieu d’Israël et s’inscrit dans une syntaxe et un contexte au singulier.
translation_notes:
  register: Français international moderne, clair et digne. La première coordination hébraïque est conservée, puis la dernière proposition devient une phrase distincte afin d’éviter une accumulation lourde. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
