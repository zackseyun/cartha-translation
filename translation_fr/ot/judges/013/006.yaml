base_translation:
  language: en
  yaml_path: translation/ot/judges/013/006.yaml
  text: Then the woman came and said to her husband[a], “A man of God came to me, and his appearance was like the appearance of an angel of God, very fearsome. I did not ask him where he was from[b], and he did not tell me his name.”
translation:
  language: fr
  text: 'La femme vint et dit à son mari : « Un homme de Dieu est venu vers moi. Son aspect était comme celui de l’ange de Dieu[a], et il inspirait une très grande crainte[b]. Je ne lui ai pas demandé d’où il venait, et il ne m’a pas dit son nom. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « ange » signifie aussi « messager ». Dans cette expression définie, il peut désigner un messager de Dieu sans que ce verset précise davantage son identité.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « très redoutable », « terrifiant » ou « profondément impressionnant ». Le terme hébreu exprime une crainte intense mêlée de saisissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: L’article défini et le contexte désignent la femme de Manoah, déjà présente dans le récit. « La femme » conserve la formulation hébraïque, tandis que « son mari » précise leur relation.
- source_word: לְאִישָׁהּ
  choice: à son mari
  rationale: Dans ce contexte conjugal, אִישׁ avec le suffixe féminin signifie naturellement « son mari ».
- source_word: אִישׁ הָאֱלֹהִים
  choice: un homme de Dieu
  rationale: Cette expression est un titre hébreu courant. L’indéfini convient au premier récit que la femme fait de cette rencontre.
- source_word: וּמַרְאֵהוּ כְּמַרְאֵה
  choice: son aspect était semblable à celui de
  rationale: « Aspect » rend מַרְאֶה dans un français naturel. « Celui de » évite une répétition lourde tout en maintenant explicitement la comparaison visuelle.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: un ange de Dieu
  rationale: מַלְאָךְ peut désigner un messager, mais le contexte évoque un être surnaturel. L’indéfini préserve ici la manière comparative dont la femme décrit le visiteur sans anticiper pleinement son identification ultérieure.
- source_word: נוֹרָא מְאֹד
  choice: très redoutable
  rationale: נוֹרָא exprime une apparence qui suscite fortement crainte et saisissement. « Redoutable » garde cette intensité sans le sens familier moderne que peut prendre « impressionnant ».
- source_word: אֵי מִזֶּה הוּא
  choice: d’où il venait
  rationale: L’expression demande l’origine ou la provenance de l’homme ; cette formulation est idiomatique en français.
- source_word: וְאֶת שְׁמוֹ לֹא הִגִּיד לִי
  choice: et il ne m’a pas dit son nom
  rationale: Cette tournure naturelle rend directement l’idée de déclarer ou faire connaître son nom.
theological_decisions:
- issue: Identification de מַלְאַךְ הָאֱלֹהִים dans un récit qui révélera ensuite plus précisément l’identité du visiteur
  choice: un ange de Dieu
  alternative: l’ange de Dieu ; un messager de Dieu
  rationale: « Un ange de Dieu » conserve la description comparative donnée à ce stade par la femme et évite de résoudre par avance la progression narrative. Une note signale la possibilité définie de la chaîne construite hébraïque.
- issue: Portée de נוֹרָא מְאֹד
  choice: il était très redoutable
  alternative: son aspect était très redoutable ; il inspirait une crainte profonde
  rationale: La formulation conserve la force mêlée de crainte et de saisissement sans préciser excessivement si la qualité porte grammaticalement sur l’homme ou sur son aspect.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et orale dans le discours rapporté. « Alla dire » rend naturellement le mouvement suivi de la parole, tandis que « son aspect était semblable à celui de » préserve la comparaison sans calque pesant.
