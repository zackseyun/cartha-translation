  text: וַ/יֹּ֛אמֶר מַלְאַ֥ךְ יְהוָ֖ה אֶל מָנ֑וֹחַ מִ/כֹּ֛ל אֲשֶׁר אָמַ֥רְתִּי אֶל הָ/אִשָּׁ֖ה תִּשָּׁמֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/013.yaml
  text: And the angel of Yahweh said to Manoah[a], “The woman must be careful to do everything that I said to her.”
translation:
  language: fr
  text: 'L’ange de Yahweh dit à Manoah[a] : « Que la femme se conforme à tout ce que je lui ai dit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le messager de Yahweh ». Le mot hébreu peut signifier « ange » ou « messager ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol poursuit la narration. En français, la simple succession des verbes au passé suffit naturellement, sans qu’il soit nécessaire d’ajouter « et » ou « alors ».
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager humain ou céleste. Dans ce récit, « ange » est le terme conventionnel et contextuellement naturel, tandis qu’une note conserve l’autre possibilité lexicale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par le titre « le Seigneur », afin de rendre le tétragramme présent dans le texte hébreu.
- source_word: אֶל מָנוֹחַ
  choice: à Manoah
  rationale: Rendu direct et idiomatique de la préposition אֶל suivie du nom propre.
- source_word: מִכֹּל אֲשֶׁר אָמַרְתִּי אֶל הָאִשָּׁה
  choice: tout ce que je lui ai dit
  rationale: Cette formulation française exprime naturellement la totalité des instructions données à la femme. Le pronom « lui » reprend sans ambiguïté « la femme ».
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Le texte porte explicitement le groupe nominal défini « la femme », et non « ta femme ».
- source_word: תִּשָּׁמֵר
  choice: qu’elle veille à respecter
  rationale: Le nifal de שׁמר exprime ici le fait de se tenir sur ses gardes et d’observer soigneusement les instructions. « Veiller à respecter » restitue cette vigilance appliquée aux prescriptions sans ajouter un objet absent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La transcription maintient le nom personnel présent dans l’hébreu au lieu de lui substituer un titre.
- issue: Portée de מַלְאַךְ dans מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Le contexte présente un envoyé céleste, ce qui justifie le rendu courant « ange », mais le terme hébreu signifie fondamentalement « messager »; la note préserve cette nuance sans trancher davantage la question de son identité.
translation_notes:
  register: Français international moderne, digne et accessible. L’injonction est rendue par « Que… » afin de conserver la valeur directive du yiqtol; « veille à respecter » associe vigilance et observance de manière naturelle.
