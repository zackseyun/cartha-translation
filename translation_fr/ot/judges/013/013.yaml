  source_fidelity: 'La formule hébraïque מִכֹּל ... תִּשָּׁמֵר emploie le nifal réflexif de שמר avec מן : la femme est appelée à se garder soigneusement à l’égard de tout ce qui lui a été prescrit. « Veille à respecter » transmet globalement l’idée d’observance, mais efface la construction réflexive et la nuance de vigilance personnelle. « Se conformer à » rend fidèlement l’observance de l’ensemble des directives sans transformer le texte en une liste explicite d’interdictions.'
