base_translation:
  language: en
  yaml_path: translation/ot/judges/013/023.yaml
  text: But his wife said to him, “If the LORD had intended to kill us, he would not have accepted from our hand a burnt offering and a grain offering, or shown us all these things, or now announced to us such a thing as this.”
translation:
  language: fr
  text: 'Mais sa femme lui dit : « Si le SEIGNEUR avait voulu nous faire mourir, il n’aurait pas accepté de notre main un holocauste et une offrande, il ne nous aurait pas montré tout cela et, maintenant, il ne nous aurait pas fait connaître une chose pareille. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָפֵץ
  choice: avait voulu
  rationale: Exprime ici l’intention ou le dessein supposé du SEIGNEUR dans une tournure conditionnelle naturelle en français.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française courante en petites capitales typographiques simulées par des capitales.
- source_word: לָקַח
  choice: accepté
  rationale: 'Dans le contexte sacrificiel, le sens ne se limite pas à « prendre » : la femme de Manoah déduit de l’accueil du sacrifice que Dieu ne veut pas les tuer.'
- source_word: עֹלָה
  choice: un holocauste
  rationale: Terme français traditionnel et précis pour l’offrande entièrement consumée.
- source_word: מִנְחָה
  choice: une offrande
  rationale: Le terme peut désigner une offrande, souvent végétale dans le système cultuel; le contexte immédiat de Juges 13 ne justifie pas de préciser davantage dans le texte.
- source_word: הִשְׁמִיעָנוּ
  choice: nous aurait pas fait entendre
  rationale: Préserve la valeur causative de la forme hébraïque et l’idée d’une communication reçue, sans imposer le seul verbe « annoncer ».
- source_word: כָזֹאת
  choice: une chose pareille
  rationale: Rend naturellement la référence à la promesse extraordinaire qui vient d’être communiquée.
theological_decisions:
- issue: Lien entre l’acceptation du sacrifice et la survie du couple
  choice: Conserver le raisonnement conditionnel de la femme sans commentaire interprétatif
  alternative: Expliciter que l’acceptation prouve la faveur divine
  rationale: Le verset rapporte son raisonnement; il ne formule pas directement une doctrine générale sur les sacrifices ou la faveur divine.
- issue: Nature de מִנְחָה
  choice: « offrande » sans qualification
  alternative: « offrande de grain » ou « offrande végétale »
  rationale: Bien que le terme ait souvent un sens technique cultuel, l’épisode parle de ce qui a été présenté avec le chevreau; la formulation générale préserve l’étendue lexicale et évite une précision potentiellement trompeuse.
translation_notes:
  register: Français moderne, digne et oralement fluide. Le parallélisme hébreu est conservé par la triple négation coordonnée. « En ce moment même » rend כָעֵת avec son relief temporel.
