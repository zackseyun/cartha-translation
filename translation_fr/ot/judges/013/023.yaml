  source_fidelity: Le raisonnement conditionnel, les trois propositions négatives et les termes sacrificiels correspondent bien à l’hébreu. « Accepter de notre main » rend de manière contextuelle לָקַח מִיָּדֵנוּ. Toutefois, הִשְׁמִיעָנוּ signifie ici « nous faire savoir / nous faire connaître » plutôt que spécifiquement « nous faire entendre » ; cette dernière formulation peut indûment limiter la communication à l’audition.
  naturalness: Le texte est globalement fluide et de registre biblique moderne. « Nous aurait fait connaître une chose pareille » est plus idiomatique et plus exact dans ce contexte que « nous aurait pas fait entendre une chose pareille ».
  terminology: « le SEIGNEUR », « holocauste » et « offrande » sont des rendus recevables. « Offrande » maintient utilement l’absence de spécification explicite de מִנְחָה dans le texte.
