  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹא יָ֤סַף עוֹד֙ מַלְאַ֣ךְ יְהוָ֔ה לְ/הֵרָאֹ֖ה אֶל מָנ֣וֹחַ וְ/אֶל אִשְׁתּ֑/וֹ אָ֚ז יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/021.yaml
  text: And the angel of Yahweh did not appear again to Manoah and to his wife[a]. Then Manoah knew that he was the angel of Yahweh.
translation:
  language: fr
  text: L’ange de Yahweh n’apparut plus à Manoah ni à sa femme[a]. Alors Manoah comprit que c’était l’ange de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ». Le mot hébreu peut signifier « messager » ou « ange »; dans ce contexte, il désigne une figure surnaturelle.
    reason: Alternative lexicale
lexical_decisions:
- source_word: יָסַף עוֹד
  choice: n’apparut plus
  rationale: La construction idiomatique יָסַף avec עוֹד et l’infinitif exprime la cessation de toute nouvelle apparition. « N’apparut plus » est naturel et précis en français.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager humain ou céleste; ici, le contexte surnaturel justifie « ange », tandis que le nom divin est rendu directement par « Yahweh ».
- source_word: לְהֵרָאֹה
  choice: apparut
  rationale: Le niphal de ראה signifie ici « apparaître » ou « être vu »; « apparut » convient naturellement au récit.
- source_word: אֶל מָנוֹחַ וְאֶל אִשְׁתּוֹ
  choice: à Manoah ni à sa femme
  rationale: Après la négation, « ni… ni… » exprime idiomatiquement en français la coordination hébraïque répétant אֶל, sans modifier le sens.
- source_word: אָז יָדַע
  choice: Alors Manoah comprit
  rationale: Dans ce contexte, יָדַע décrit une prise de conscience. « Comprit » rend plus naturellement cette valeur que le littéral « sut ».
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: que c’était l’ange de Yahweh
  rationale: La proposition identifie rétrospectivement le personnage rencontré. Le présentatif impersonnel « c’était » est naturel en français et ne précise pas davantage son identité.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom divin plutôt que de lui substituer un titre.
- issue: Désignation de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Le contexte présente une figure surnaturelle, ce qui favorise « ange ». La traduction ne précise toutefois pas davantage la relation entre cette figure et Yahweh, préservant ainsi la tension du récit.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit; « comprit » explicite naturellement la prise de conscience sans ajouter d’interprétation théologique.
