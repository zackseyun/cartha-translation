source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לּ/וֹ֙ מַלְאַ֣ךְ יְהוָ֔ה לָ֥/מָּה זֶּ֖ה תִּשְׁאַ֣ל לִ/שְׁמִ֑/י וְ/הוּא פֶ֛לִאי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/018.yaml
  text: And the angel of Yahweh said to him[a], “Why do you ask my name, seeing it is wonderful?”
translation:
  language: fr
  text: 'L’ange de Yahvé lui dit : « Pourquoi demandes-tu mon nom, puisqu’il est merveilleux[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « insondable », « incompréhensible » ou, peut-être, « secret ». Le mot hébreu désigne quelque chose d’extraordinaire ou de trop prodigieux pour être pleinement saisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahvé
  rationale: מַלְאַךְ peut désigner un messager ou un ange. Dans ce récit, il s’agit d’un envoyé surnaturel ; « ange » est donc le terme français le plus naturel. Le nom divin יְהוָה est rendu par « Yahvé ».
- source_word: לָמָּה זֶּה
  choice: pourquoi
  rationale: Cette tournure introduit ici une question rhétorique ; « pourquoi » en restitue directement et naturellement la force.
- source_word: תִּשְׁאַל לִשְׁמִי
  choice: demandes-tu mon nom
  rationale: Le verbe שׁאל construit avec ל et « nom » exprime le fait de demander ou de chercher à connaître le nom de quelqu’un. Cette formulation est claire et idiomatique en français.
- source_word: וְהוּא
  choice: puisqu’il est
  rationale: La conjonction introduit vraisemblablement l’explication de la question rhétorique. « Puisque » rend cette relation avec naturel, sans alourdir la phrase.
- source_word: פֶלִאי
  choice: merveilleux
  rationale: L’adjectif qualifie ce qui est extraordinaire, prodigieux ou trop merveilleux pour être pleinement saisi. « Merveilleux » en donne le sens central tout en conservant la possible résonance intertextuelle et sans expliciter excessivement le texte.
theological_decisions:
- issue: Portée potentiellement théophanique ou christologique de פֶלִאי
  choice: Traduire simplement l’adjectif par « merveilleux », sans faire de cette formulation un titre ni préciser l’identité de l’ange.
  alternative: Employer une formulation plus interprétative telle que « insondable » ou « au-delà de toute compréhension ».
  rationale: Le passage peut inviter à une réflexion théologique sur l’identité de l’ange de Yahvé, mais l’hébreu ne tranche pas explicitement cette question. Une traduction lexicale sobre préserve cette tension.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement convient au dialogue direct dans le cadre narratif biblique. La formulation conserve la brièveté et la tension du texte hébreu.
