  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל מָנ֗וֹחַ אִם תַּעְצְרֵ֨/נִי֙ לֹא אֹכַ֣ל בְּ/לַחְמֶ֔/ךָ וְ/אִם תַּעֲשֶׂ֣ה עֹלָ֔ה לַ/יהוָ֖ה תַּעֲלֶ֑/נָּה כִּ֚י לֹא יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/016.yaml
  text: And the angel of Yahweh said to Manoah[a], “If you detain me, I will not eat your food. But if you prepare a burnt offering[b], offer it up to Yahweh.” For Manoah did not know that he was the angel of Yahweh.
translation:
  language: fr
  text: 'L’ange de Yahweh dit à Manoah : « Si tu me retiens, je ne mangerai pas de ta nourriture[a]. Mais si tu prépares un holocauste[b], offre-le à Yahweh. » En effet, Manoah ne savait pas que c’était l’ange de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « je ne mangerai pas de ton pain ». Ici, « pain » désigne probablement la nourriture ou le repas en général.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « si tu fais un holocauste, offre-le à Yahweh ». L’hébreu emploie un premier verbe pour faire ou préparer l’offrande, puis un autre pour la faire monter, c’est-à-dire l’offrir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager ou un ange. Dans ce récit, l’envoyé est un être surnaturel ; « ange » convient donc au contexte, tandis que le nom divin יְהוָה est translittéré « Yahweh ».
- source_word: תַּעְצְרֵנִי
  choice: tu me retiens
  rationale: Le verbe עצר peut signifier retenir, empêcher de partir ou garder sur place. « Retenir » reste proche de l’hébreu et convient à la demande de Manoah de faire rester son visiteur.
- source_word: לֹא אֹכַל בְּלַחְמֶךָ
  choice: je ne mangerai pas de ta nourriture
  rationale: לֶחֶם signifie littéralement « pain », mais peut désigner plus largement la nourriture ou un repas. Le contexte porte sur le repas que Manoah veut préparer.
- source_word: תַּעֲשֶׂה עֹלָה
  choice: tu prépares un holocauste
  rationale: Avec un objet sacrificiel, עשה peut exprimer la préparation de l’offrande. « Prépares » permet de distinguer cette action du verbe suivant, qui ordonne de faire monter l’offrande.
- source_word: עֹלָה
  choice: un holocauste
  rationale: « Holocauste » est le terme sacrificiel français usuel pour l’offrande entièrement consumée, dont la fumée monte.
- source_word: לַיהוָה תַּעֲלֶנָּה
  choice: offre-le à Yahweh
  rationale: La forme causative de עלה signifie ici faire monter l’holocauste, donc l’offrir. « Offre-le » exprime naturellement l’instruction et conserve le pronom objet.
- source_word: כִּי לֹא יָדַע מָנוֹחַ
  choice: En effet, Manoah ne savait pas
  rationale: כִּי introduit ici l’explication narrative du comportement de Manoah. « En effet » établit naturellement ce rapport en français.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: que c’était l’ange de Yahweh
  rationale: Cette proposition précise ce que Manoah ignorait. Le présentatif « c’était » est naturel en français tout en laissant intacte l’identité narrative du visiteur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le représente directement sans lui substituer un titre.
- issue: Identité de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Le récit présente cet envoyé comme surnaturel, ce qui justifie « ange ». La traduction ne précise pas davantage son rapport ontologique à Yahweh et préserve ainsi la tension du récit.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe directe conserve la progression du dialogue et l’explication du narrateur. « Holocauste » est maintenu comme terme sacrificiel courant, et « Yahweh » rend uniformément le nom divin.
