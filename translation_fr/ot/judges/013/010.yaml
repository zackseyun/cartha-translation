base_translation:
  language: en
  yaml_path: translation/ot/judges/013/010.yaml
  text: So the woman hurried and ran and told her husband[a], and said to him, “Look, the man who came to me that day has appeared to me.”
translation:
  language: fr
  text: 'La femme se dépêcha, courut annoncer cela à son mari et lui dit : « Regarde ! L’homme qui était venu me voir l’autre jour[a] m’est apparu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce jour-là ». L’expression hébraïque signifie littéralement « le jour » et renvoie à la visite précédente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: se dépêcha
  rationale: Le verbe מהר exprime la hâte. « Se dépêcha » est naturel en français moderne et demeure distinct du verbe suivant.
- source_word: וַתָּרָץ
  choice: courut
  rationale: Le verbe רוץ désigne ici le fait de courir. La traduction conserve les deux verbes successifs qui soulignent l’empressement de la femme.
- source_word: וַתַּגֵּד
  choice: annoncer la nouvelle
  rationale: Le hiphil de נגד signifie « annoncer, raconter, informer ». Cette formulation s’intègre naturellement après « courut » tout en conservant l’idée d’une communication immédiate.
- source_word: לְאִישָׁהּ
  choice: à son mari
  rationale: Dans ce contexte conjugal, אִישׁ avec le suffixe féminin signifie idiomatiquement « son mari ».
- source_word: הִנֵּה
  choice: Regarde !
  rationale: La particule attire vivement l’attention de l’interlocuteur. « Regarde ! » restitue cette immédiateté dans un registre moderne.
- source_word: נִרְאָה אֵלַי
  choice: m’est apparu
  rationale: Le niphal de ראה a ici le sens de « apparaître à ». Le passé composé convient à l’annonce d’un événement qui vient de se produire.
- source_word: הָאִישׁ
  choice: L’homme
  rationale: La femme désigne le personnage selon son apparence, sans expliciter dans ses paroles son identité d’ange du SEIGNEUR.
- source_word: אֲשֶׁר בָּא בַיּוֹם אֵלַי
  choice: qui était venu vers moi l’autre jour
  rationale: Littéralement, l’expression évoque « le jour » déjà connu par le contexte et renvoie à la visite précédente. « L’autre jour » est idiomatique en français; une note signale la forme plus littérale.
theological_decisions:
- issue: Identité de הָאִישׁ dans les paroles de la femme
  choice: L’homme
  alternative: l’ange ; le messager de Dieu
  rationale: Même si le contexte plus large identifie le personnage comme l’ange du SEIGNEUR, la femme l’appelle ici simplement « l’homme ». La traduction préserve son point de vue immédiat sans anticiper l’identification théologique.
translation_notes:
  register: Français international moderne, narratif et digne. Les deux verbes de mouvement sont conservés pour rendre l’urgence. La parole directe reste vive sans recourir à l’archaïsant « Voici ! ».
