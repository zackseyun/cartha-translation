  text: וַ/יֹּ֣אמֶר מָנ֔וֹחַ עַתָּ֖ה יָבֹ֣א דְבָרֶ֑י/ךָ מַה יִּֽהְיֶ֥ה מִשְׁפַּט הַ/נַּ֖עַר וּ/מַעֲשֵֽׂ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/012.yaml
  text: Then Manoah said[a], “Now let your words come true[c][b]. What will be the rule for the boy and for his work?”
translation:
  language: fr
  text: 'Alors Manoah dit : « Maintenant, que tes paroles s’accomplissent[a] ! Quelle sera la règle[b] concernant le garçon et son activité[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand tes paroles s’accompliront… » La proposition hébraïque peut exprimer soit un souhait, soit une circonstance temporelle introduisant la question qui suit.'
    reason: alternative_reading
  - marker: b
    text: Le mot traduit par « règle » peut aussi désigner la coutume, la prescription ou la manière de vivre prévue pour le garçon.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « et son œuvre ». Le terme peut désigner ce qu’il devra faire, sa conduite, son travail ou sa tâche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit ; « Alors » en rend naturellement la progression en français moderne.
- source_word: מָנוֹחַ
  choice: Manoah
  rationale: Le nom propre est transcrit selon sa forme française traditionnelle.
- source_word: עַתָּה
  choice: Maintenant
  rationale: Le terme marque ici l’attente immédiate de l’accomplissement annoncé, tout en pouvant avoir une nuance discursive.
- source_word: יָבֹא דְבָרֶיךָ
  choice: que tes paroles s’accomplissent
  rationale: Littéralement, les paroles « viennent » ou « arrivent ». Cette formulation française exprime clairement leur réalisation tout en conservant la valeur possible de souhait.
- source_word: מַה יִּהְיֶה
  choice: Quelle … s’appliquera … et quelle sera
  rationale: La tournure interrogative porte sur la situation future ; elle est répartie entre les deux éléments coordonnés pour produire une phrase française claire.
- source_word: מִשְׁפַּט
  choice: règle
  rationale: Dans ce contexte, le mot désigne vraisemblablement une prescription ou une norme à observer concernant l’enfant, plutôt qu’un jugement judiciaire.
- source_word: הַנַּעַר
  choice: le garçon
  rationale: Le terme désigne l’enfant mâle annoncé, bien qu’il ne soit pas encore né ; « garçon » conserve cette précision.
- source_word: וּמַעֲשֵׂהוּ
  choice: et quelle sera son activité
  rationale: Le nom peut désigner un acte, une œuvre, un travail ou une activité. « Activité » reste suffisamment large et évite de préciser indûment une vocation particulière.
theological_decisions:
- issue: Valeur de יָבֹא dans יָבֹא דְבָרֶיךָ
  choice: 'Lecture optative : « que tes paroles s’accomplissent »'
  alternative: 'Lecture temporelle : « quand tes paroles s’accompliront »'
  rationale: La forme hébraïque permet d’entendre soit un souhait, soit l’hypothèse temporelle qui introduit la question suivante. Le texte principal retient le souhait, et la note maintient l’autre lecture sans trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe au messager. La formulation conserve l’ambiguïté entre souhait et proposition temporelle dans une note, ainsi que l’étendue sémantique de מִשְׁפָּט et מַעֲשֶׂה.
