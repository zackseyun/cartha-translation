base_translation:
  language: en
  yaml_path: translation/ot/judges/013/011.yaml
  text: So Manoah arose and went after his wife[a], and came to the man and said to him, “Are you the man who spoke to the woman?” And he said[c][b], “I am.”
translation:
  language: fr
  text: 'Manoah se leva et suivit sa femme.[a] Il arriva auprès de l’homme et lui dit : « Est-ce toi, l’homme qui a parlé à la femme[b] ? » Il répondit : « C’est moi.[c] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « alla après sa femme » ou « alla derrière sa femme ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « la femme », et non « ma femme ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « Moi » ; autre traduction possible : « Oui, c’est moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le qal narratif de קום signifie ici « se lever ». Cette tournure garde la cadence du récit tout en restant naturelle en français moderne.
- source_word: וַיֵּלֶךְ
  choice: suivit
  rationale: Avec אַחֲרֵי אִשְׁתּוֹ, le mouvement est naturellement rendu en français par « suivit sa femme » ; traduire séparément par « alla après » serait moins idiomatique.
- source_word: אַחֲרֵי אִשְׁתּוֹ
  choice: suivit sa femme
  rationale: אַחֲרֵי signifie littéralement « après, derrière ». Dans ce contexte de déplacement, « suivre » exprime clairement la relation spatiale sans ajouter une idée de poursuite.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: Il arriva auprès de l’homme
  rationale: בוא אֶל indique qu’il parvient jusqu’à l’homme. « Arriva auprès de » est naturel et distingue ce mouvement du fait qu’il suivait sa femme.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Le texte présente encore le visiteur comme אִישׁ, « homme ». Cette désignation préserve la progression narrative sans anticiper son identification comme messager de l’Éternel.
- source_word: הַאַתָּה
  choice: Est-ce toi
  rationale: Cette formulation française rend directement la question portant sur l’identité de l’interlocuteur, sans emphase supplémentaire.
- source_word: אֲשֶׁר דִּבַּרְתָּ אֶל הָאִשָּׁה
  choice: qui a parlé à la femme
  rationale: Le passé composé convient au discours direct moderne, et « parler à » correspond à אֶל. Le syntagme « la femme » est conservé tel quel.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Bien qu’il s’agisse de l’épouse de Manoah, l’hébreu dit explicitement « la femme ». La traduction conserve cette formulation inhabituelle plutôt que de l’assimiler silencieusement à « ma femme ».
- source_word: אָנִי
  choice: C’est moi
  rationale: La réponse hébraïque est le seul pronom אָנִי, littéralement « moi/je ». Dans ce dialogue d’identification, « C’est moi » en est l’équivalent français le plus naturel.
theological_decisions:
- issue: Identité du visiteur
  choice: Traduire הָאִישׁ par « l’homme »
  alternative: « l’ange » ou « le messager »
  rationale: Même si le contexte plus large révèle qu’il s’agit du messager de l’Éternel, ce verset emploie le nom ordinaire אִישׁ. « L’homme » respecte le point de vue immédiat et la révélation progressive du récit.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre biblique courant sans archaïsme marqué ; le dialogue emploie des formulations actuelles. Les désignations littérales « l’homme » et « la femme » sont maintenues afin de préserver le point de vue et les particularités de l’hébreu.
