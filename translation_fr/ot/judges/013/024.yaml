  text: וַ/תֵּ֤לֶד הָֽ/אִשָּׁה֙ בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שִׁמְשׁ֑וֹן וַ/יִּגְדַּ֣ל הַ/נַּ֔עַר וַֽ/יְבָרְכֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/024.yaml
  text: And the woman bore a son and called his name Samson. And the boy grew, and Yahweh blessed him.
translation:
  language: fr
  text: La femme mit au monde un fils et l’appela Samson. Le garçon grandit, et Yahweh le bénit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: mit au monde
  rationale: Le qal wayyiqtol de ילד désigne ici l’accouchement. « Mit au monde » est naturel en français moderne et convient au récit de naissance.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: L’hébreu dit explicitement « la femme » et renvoie ainsi à la femme de Manoah sans ajouter dans ce verset une précision absente du texte.
- source_word: בֵּן
  choice: un fils
  rationale: Dans ce contexte de naissance, בן désigne naturellement un enfant de sexe masculin; « un fils » est la formulation française usuelle.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: l’appela
  rationale: La formule hébraïque signifie littéralement « elle appela son nom ». En français actuel, « elle l’appela » rend clairement et dignement l’acte de nommer sans reproduire un calque peu naturel.
- source_word: שִׁמְשׁוֹן
  choice: Samson
  rationale: La forme traditionnelle française du nom propre hébreu est conservée.
- source_word: וַיִּגְדַּל
  choice: grandit
  rationale: גדל décrit ici le développement de l’enfant. « Grandit » évite d’introduire l’idée distincte qu’il serait devenu grand ou important.
- source_word: הַנַּעַר
  choice: le garçon
  rationale: נער peut désigner un enfant, un garçon ou un jeune homme. Après le récit de sa naissance, « le garçon » exprime naturellement son âge encore jeune tout en préservant la progression narrative.
- source_word: וַיְבָרְכֵהוּ
  choice: le bénit
  rationale: ברך est le verbe ordinaire pour bénir; cette traduction conserve sa portée théologique sans la réduire à la faveur ou à la réussite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel et évite de le remplacer par le titre « le Seigneur ».
translation_notes:
  register: Français international moderne, simple et digne. La coordination narrative est conservée, mais la formule hébraïque de nomination est rendue idiomatiquement par « l’appela Samson ». Aucun marqueur de note n’est requis.
