  text: כִּי֩ הִנָּ֨/ךְ הָרָ֜ה וְ/יֹלַ֣דְתְּ בֵּ֗ן וּ/מוֹרָה֙ לֹא יַעֲלֶ֣ה עַל רֹאשׁ֔/וֹ כִּֽי נְזִ֧יר אֱלֹהִ֛ים יִהְיֶ֥ה הַ/נַּ֖עַר מִן הַ/בָּ֑טֶן וְ/ה֗וּא יָחֵ֛ל לְ/הוֹשִׁ֥יעַ אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/005.yaml
  text: For behold[a], you are pregnant and will bear a son. No razor shall come upon his head, for the boy shall be a Nazirite of God from the womb, and he will begin to save Israel from the hand of the Philistines.
translation:
  language: fr
  text: Car te voici enceinte, et tu mettras au monde un fils. Aucun rasoir ne passera sur sa tête, car le garçon sera un nazir de Dieu dès le sein maternel. C’est lui qui commencera à sauver[a] Israël de la main des Philistins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à délivrer ». Le verbe hébreu peut signifier « sauver » ou « délivrer » selon le contexte.
    reason: alternative lexicale
lexical_decisions:
- source_word: הִנָּךְ הָרָה
  choice: te voici enceinte
  rationale: הָרָה est ici un adjectif prédicatif décrivant l’état présent de la femme, et non un verbe annonçant une conception future. « Te voici » restitue naturellement la force déictique de הִנָּךְ.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: et tu mettras au monde un fils
  rationale: Le contexte d’annonce donne à la forme une valeur future. « Mettre au monde » est idiomatique en français moderne et exprime clairement l’accouchement.
- source_word: מוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: Aucun rasoir ne passera sur sa tête
  rationale: « Rasoir » désigne précisément l’instrument interdit dans le contexte du naziréat. « Ne passera sur sa tête » conserve l’image de l’hébreu sans produire une tournure artificielle.
- source_word: נְזִיר אֱלֹהִים
  choice: un nazir de Dieu
  rationale: « Nazir » conserve le terme technique désignant une personne spécialement consacrée, tandis que « de Dieu » rend explicitement le complément hébreu sans le réduire à une paraphrase générale.
- source_word: מִן הַבָּטֶן
  choice: dès le sein maternel
  rationale: Cette expression française naturelle conserve l’idée explicite d’une consécration remontant à la vie prénatale, contrairement à « dès la naissance ».
- source_word: יָחֵל
  choice: commencera
  rationale: Le verbe marque le commencement de l’action. Ce détail narratif indique que le garçon inaugurera la délivrance sans affirmer qu’il l’achèvera.
- source_word: לְהוֹשִׁיעַ
  choice: à sauver
  rationale: Le verbe peut signifier « sauver » ou « délivrer ». « Sauver » maintient sa portée large, et l’autre possibilité contextuelle est signalée en note.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: de la main des Philistins
  rationale: La formulation conserve l’image hébraïque de la main comme puissance ou domination hostile; elle reste intelligible dans un registre biblique français digne.
theological_decisions:
- issue: Nature de la consécration de Samson
  choice: un nazir de Dieu dès le sein maternel
  alternative: consacré à Dieu dès le sein maternel
  rationale: Le texte emploie le terme technique נְזִיר. Le conserver évite de généraliser la consécration et maintient l’accent sur son commencement prénatal, sans ajouter de précision doctrinale étrangère au verset.
- issue: Étendue du rôle de Samson dans le salut d’Israël
  choice: commencera à sauver Israël
  alternative: sauvera Israël
  rationale: יָחֵל exprime explicitement le début de l’action. Omettre « commencera » exagérerait la portée attribuée ici à Samson et effacerait une tension narrative réelle.
translation_notes:
  register: Français international moderne, clair et digne. « Nazir » conserve le terme institutionnel précis malgré son caractère moins courant; le contexte en indique la consécration particulière. L’image « de la main des Philistins » est maintenue comme tournure biblique encore compréhensible.
