  text: וַ/יֹּ֥אמֶר מָנ֖וֹחַ אֶל מַלְאַ֣ךְ יְהוָ֑ה נַעְצְרָה נָּ֣א אוֹתָ֔/ךְ וְ/נַעֲשֶׂ֥ה לְ/פָנֶ֖י/ךָ גְּדִ֥י עִזִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/015.yaml
  text: Then Manoah said to the angel of the LORD, “Please let us detain you, and we will prepare a young goat for you.”
translation:
  language: fr
  text: 'Alors Manoah dit à l’ange du SEIGNEUR : « Permets-nous, s’il te plaît, de te retenir, afin que nous préparions pour toi un chevreau. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange du SEIGNEUR
  rationale: Rend directement l’expression hébraïque tout en suivant la convention française courante qui représente le tétragramme par « le SEIGNEUR ».
- source_word: נַעְצְרָה נָּא אוֹתָךְ
  choice: Permets-nous, s’il te plaît, de te retenir
  rationale: Le cohortatif exprime une demande adressée avec déférence; « retenir » conserve l’idée de faire rester le visiteur sans suggérer ici une détention coercitive.
- source_word: וְנַעֲשֶׂה לְפָנֶיךָ
  choice: et de préparer pour toi
  rationale: Dans ce contexte d’hospitalité, עשה désigne la préparation du chevreau; לְפָנֶיךָ signifie littéralement « devant toi », mais idiomatiquement « pour toi ».
- source_word: גְּדִי עִזִּים
  choice: un chevreau
  rationale: L’expression désigne un jeune de chèvre; « chevreau » est précis, naturel et suffit sans le pléonasme « chevreau de chèvres ».
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: « le SEIGNEUR » respecte une convention biblique française largement intelligible sans imposer une vocalisation reconstruite du tétragramme.
translation_notes:
  register: Français international moderne, digne et naturel. La formulation conserve la politesse de נָא et l’hospitalité de la scène, sans alourdir la phrase par le littéralisme « devant toi ».
