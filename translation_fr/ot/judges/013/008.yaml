source:
  edition: WLC
  text: וַ/יֶּעְתַּ֥ר מָנ֛וֹחַ אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר בִּ֣י אֲדוֹנָ֔/י אִ֣ישׁ הָ/אֱלֹהִ֞ים אֲשֶׁ֣ר שָׁלַ֗חְתָּ יָבוֹא נָ֥א עוֹד֙ אֵלֵ֔י/נוּ וְ/יוֹרֵ֕/נוּ מַֽה נַּעֲשֶׂ֖ה לַ/נַּ֥עַר הַ/יּוּלָּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/008.yaml
  text: Then Manoah entreated Yahweh and said[a], “Please, Lord[c][b], let the man of God whom you sent come again to us and teach us what we should do for the boy who is to be born.”
translation:
  language: fr
  text: 'Alors Manoah supplia[a] Yahweh et dit : « Je t’en prie, Seigneur, que l’homme de Dieu[b] que tu as envoyé revienne vers nous et qu’il nous enseigne ce que nous devons faire pour le garçon qui va naître[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pria instamment Yahweh » ; le verbe hébreu exprime une supplication fervente.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « l’homme de Dieu » ; Manoah parle selon ce qu’il comprend alors, sans identifier encore plus précisément le visiteur.
    reason: alternative_reading
  - marker: c
    text: Ou « pour l’enfant qui va naître » ; le terme hébreu est masculin et signifie ici « garçon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּעְתַּר
  choice: supplia
  rationale: Le verbe עתר exprime ici une prière instante adressée à Dieu. « Supplia » conserve cette intensité mieux qu’un simple « pria » ou « demanda ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. La translittération « Yahweh » préserve le nom propre plutôt que de le remplacer par un titre.
- source_word: בִּי אֲדֹנָי
  choice: Je t’en prie, Seigneur
  rationale: בִּי fonctionne comme une formule déférente de supplication, tandis que אֲדֹנָי est une adresse révérencieuse à Dieu. Cette formulation est naturelle en français moderne.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: La traduction littérale et consacrée préserve le point de vue actuel de Manoah sans identifier plus précisément le visiteur.
- source_word: יָבוֹא נָא עוֹד אֵלֵינוּ
  choice: revienne vers nous
  rationale: Le jussif accompagné de נָא exprime une requête polie, et עוֹד indique le retour ou la répétition. Le contexte français de la supplication rend inutile un second « s’il te plaît ».
- source_word: וְיוֹרֵנוּ
  choice: et qu’il nous enseigne
  rationale: Le hiphil de ירה signifie instruire ou enseigner. « Enseigne » est clair et courant tout en gardant la portée pratique de la demande.
- source_word: מַה נַּעֲשֶׂה
  choice: ce que nous devons faire
  rationale: Cette tournure restitue naturellement la valeur délibérative de la question indirecte.
- source_word: לַנַּעַר הַיּוּלָּד
  choice: pour le garçon qui va naître
  rationale: נַעַר désigne ici le futur enfant mâle, et le participe passif הַיּוּלָּד exprime sa naissance à venir.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset emploie directement le Tétragramme. Garder « Yahweh » distingue le nom divin du titre אֲדֹנָי, également présent dans la phrase.
- issue: Identification de אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  alternative: le messager de Dieu
  rationale: Même si le récit apporte ensuite davantage d’éléments sur l’identité du visiteur, Manoah parle ici de « l’homme de Dieu ». Cette traduction conserve la perspective narrative et sa tension.
- issue: Genre de לַנַּעַר
  choice: pour le garçon
  alternative: pour l’enfant
  rationale: Le nom hébreu est masculin et désigne dans le contexte le fils promis. « Garçon » garde cette précision sans neutralisation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de la prière sans tournures archaïques. « Je t’en prie » rend la déférence de בִּי, et la distinction entre « Yahweh » et « Seigneur » reflète celle entre יהוה et אֲדֹנָי.
