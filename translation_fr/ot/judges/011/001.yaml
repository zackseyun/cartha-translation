base_translation:
  language: en
  yaml_path: translation/ot/judges/011/001.yaml
  text: Jephthah the Gileadite was a mighty warrior[a], and he was the son of a prostitute[c][b]; and Gilead fathered Jephthah.
translation:
  language: fr
  text: Jephté, le Galaadite, était un vaillant guerrier[a]. Il était fils d’une prostituée[b], et Galaad[c] fut le père de Jephté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « un homme puissant et valeureux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le fils d’une femme prostituée ».'
    reason: lexical_alternative
  - marker: c
    text: Ici, Galaad est le nom du père de Jephté, et non une simple désignation de la région.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָדִי
  choice: le Galaadite
  rationale: Le gentilé identifie Jephté par son appartenance régionale à Galaad; « le Galaadite » est précis et naturel en français biblique moderne.
- source_word: גִּבּוֹר חַיִל
  choice: un vaillant guerrier
  rationale: Dans ce contexte narratif, l’expression désigne un homme reconnu pour sa force et sa valeur guerrière. Cette formulation garde le sens militaire sans l’archaïsme de « vaillant homme ».
- source_word: בֶּן אִשָּׁה זוֹנָה
  choice: fils d’une prostituée
  rationale: זוֹנָה désigne ici de manière directe une prostituée; le français choisi est actuel, clair et non euphémistique.
- source_word: וַיּוֹלֶד
  choice: était son père
  rationale: Le hiphil de ילד exprime ici la paternité biologique. « Était son père » est plus idiomatique en français courant que « engendra » ou « avait donné naissance » tout en conservant le rapport généalogique.
- source_word: גִּלְעָד
  choice: Galaad
  rationale: Le nom est ici le sujet personnel du verbe de procréation et désigne donc le père de Jephté, non seulement la région.
- source_word: וְ
  choice: ponctuation et enchaînement syntaxique
  rationale: Les conjonctions hébraïques structurent la présentation du personnage; le français les rend naturellement par la juxtaposition de deux phrases et par « et », sans ajouter un marqueur temporel absent du texte.
