base_translation:
  language: en
  yaml_path: translation/ot/judges/011/030.yaml
  text: And Jephthah made a vow to Yahweh and said[a], “If you indeed give the Ammonites into my hand,”
translation:
  language: fr
  text: 'Jephté fit un vœu à Yahweh et dit : « Si vraiment tu livres les Ammonites entre mes mains[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si tu livres bel et bien les Ammonites entre mes mains ». L’hébreu emploie un infinitif absolu avec un verbe conjugué pour renforcer l’expression.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר יִפְתָּח נֶדֶר
  choice: Jephté fit un vœu
  rationale: Cette tournure française naturelle conserve le nom explicite נֶדֶר et le sens du verbe apparenté נדר.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque ici le destinataire du vœu, et le nom divin יהוה est translittéré « Yahweh ».
- source_word: וַיֹּאמַר
  choice: et dit
  rationale: Rend simplement la succession narrative hébraïque et introduit les paroles du vœu.
- source_word: אִם נָתוֹן תִּתֵּן
  choice: Si vraiment tu livres
  rationale: « Si » introduit la condition; l’infinitif absolu נָתוֹן associé au verbe conjugué תִּתֵּן renforce l’action. « Vraiment » exprime cette insistance sans alourdir la phrase.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Équivalent français idiomatique de l’ethnonyme littéralement formulé « fils d’Ammon ».
- source_word: בְּיָדִי
  choice: entre mes mains
  rationale: L’expression signifie livrer quelqu’un au pouvoir d’un autre. Le pluriel idiomatique français « entre mes mains » restitue naturellement l’image hébraïque au singulier.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère personnel du nom divin sans le remplacer par un titre.
- issue: Force de נָתוֹן תִּתֵּן dans la condition
  choice: Si vraiment tu livres
  alternative: Si tu livres bel et bien; Si tu livres
  rationale: La construction infinitif absolu + verbe conjugué ajoute une insistance réelle, mais sa nuance exacte peut être rendue de plusieurs manières. Le texte principal garde cette emphase sans transformer la condition en affirmation.
translation_notes:
  register: Français international moderne, clair et digne. La proposition reste volontairement inachevée, puisque la conséquence du vœu vient au verset suivant. « Entre mes mains » est plus naturel en français que le calque « dans ma main ».
