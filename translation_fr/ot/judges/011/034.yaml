language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבֹ֨א יִפְתָּ֣ח הַ/מִּצְפָּה֮ אֶל בֵּית/וֹ֒ וְ/הִנֵּ֤ה בִתּ/וֹ֙ יֹצֵ֣את לִ/קְרָאת֔/וֹ בְ/תֻפִּ֖ים וּ/בִ/מְחֹל֑וֹת וְ/רַק֙ הִ֣יא יְחִידָ֔ה אֵֽין ל֥/וֹ מִמֶּ֛/נּוּ בֵּ֖ן אוֹ בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/034.yaml
  text: Then Jephthah came to Mizpah[a], to his house, and behold, his daughter was coming out to meet him with tambourines and with dances. Now she was his only child[b]; besides her he had neither son nor daughter.
translation:
  language: fr
  text: 'Puis Jephté arriva à Mitspa, chez lui. Et voici que sa fille sortait à sa rencontre avec des tambourins et des danses. Or elle était son enfant unique[a] : à part elle, il n’avait ni fils ni fille.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « son unique » ; c’est-à-dire son unique enfant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Puis … arriva
  rationale: Le waw consécutif fait progresser le récit. « Puis » marque naturellement la succession narrative, tandis qu’« arriva » exprime ici le mouvement vers Mitspa et la maison de Jephté.
- source_word: הַמִּצְפָּה
  choice: à Mitspa
  rationale: Bien que le nom porte l’article en hébreu, il s’agit d’un toponyme. « Mitspa » est une translittération française courante.
- source_word: אֶל בֵּיתוֹ
  choice: chez lui
  rationale: Dans ce contexte, le français idiomatique « chez lui » rend le mouvement vers sa propre maison sans changer le référent concret.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette tournure conserve l’effet de surprise dramatique de la particule hébraïque tout en restant naturelle dans un registre narratif digne.
- source_word: יֹצֵאת לִקְרָאתוֹ
  choice: sortait à sa rencontre
  rationale: Le participe présente l’action en cours au moment de l’arrivée de Jephté. L’imparfait français en restitue la vivacité.
- source_word: בְתֻפִּים וּבִמְחֹלוֹת
  choice: avec des tambourins et des danses
  rationale: La formulation maintient les deux noms au pluriel et évoque clairement une célébration musicale et dansée, sans préciser davantage qui joue ou danse.
- source_word: וְרַק הִיא יְחִידָה
  choice: Or elle était son enfant unique
  rationale: Dans ce contexte, יְחִידָה désigne l’unique enfant, comme le confirme la proposition suivante. « Or » introduit sobrement l’information narrative décisive.
- source_word: אֵין לוֹ מִמֶּנּוּ בֵּן אוֹ בַת
  choice: à part elle, il n’avait ni fils ni fille
  rationale: La proposition explicite qu’aucun autre enfant n’existait. Cette formulation française rend clairement la négation totale et le rapport avec la fille déjà mentionnée.
theological_decisions:
- issue: Statut et sort de la fille de Jephté
  choice: Décrire seulement sa venue festive et le fait qu’elle était l’enfant unique de Jephté.
  alternative: Lire dès ce verset une indication décisive soit d’un sacrifice littéral ultérieur, soit d’une consécration impliquant une virginité perpétuelle.
  rationale: Le verset ne tranche pas le débat suscité par la suite du récit. La traduction préserve donc la tension narrative sans importer une conclusion théologique.
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici que » conserve la soudaineté du texte hébreu ; « chez lui » évite une lourdeur littérale, et « enfant unique » explicite naturellement le sens contextuel sans anticiper l’interprétation de la suite du récit.
