  yaml_path: translation/ot/judges/011/004.yaml
  text: After some time[a], the Ammonites fought against Israel.
translation:
  language: fr
  text: Quelque temps plus tard[a], les Ammonites firent la guerre à Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « Et il arriva après des jours », expression indiquant qu’un certain temps s’était écoulé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: Quelque temps plus tard
  rationale: La tournure hébraïque introduit l’écoulement d’un laps de temps. Cette formulation naturelle en français moderne en conserve la valeur temporelle sans reproduire littéralement l’idiome.
- source_word: וַיִּלָּחֲמוּ
  choice: firent la guerre
  rationale: La forme issue de לחם désigne ici l’engagement dans un conflit armé. « Firent la guerre » convient au contexte et au complément introduit par « à ».
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: L’expression désigne le peuple d’Ammon. « Les Ammonites » est l’ethnonyme français courant et naturel.
- source_word: עִם יִשְׂרָאֵל
  choice: à Israël
  rationale: Bien que עִם signifie ordinairement « avec », associé au verbe combattre il indique la partie adverse. Dans la locution française « faire la guerre à », « à Israël » exprime clairement ce rapport d’opposition.
