base_translation:
  language: en
  yaml_path: translation/ot/judges/011/036.yaml
  text: And she said to him[a], “My father, you have opened your mouth to Yahweh; do to me according to what has gone out from your mouth, since Yahweh has taken vengeance for you on your enemies[b], on the sons of Ammon.”
translation:
  language: fr
  text: 'Elle lui dit : « Mon père, tu as ouvert ta bouche à Yahvé[a] ; fais à mon égard ce qui est sorti de ta bouche, puisque Yahvé a exercé sa vengeance pour toi sur tes ennemis, les Ammonites. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ouvrir sa bouche à Yahvé » est une expression hébraïque qui désigne le fait de prononcer solennellement un vœu.
    reason: cultural_note
lexical_decisions:
- source_word: פָּצִיתָה אֶת־פִּיךָ
  choice: tu as ouvert la bouche
  rationale: Conserve l’image concrète de l’idiome hébreu et sa solennité dans le contexte d’un vœu, sans remplacer d’emblée l’expression par son interprétation.
- source_word: אֶל יְהוָה
  choice: devant Yahvé
  rationale: Dans le contexte d’un engagement solennel adressé à Dieu, « devant Yahvé » est naturel en français et exprime que la parole engage son auteur envers lui.
- source_word: עֲשֵׂה לִי
  choice: fais-moi
  rationale: Reproduit directement la construction hébraïque et la soumission de la fille de Jephté à l’accomplissement des paroles prononcées.
- source_word: כַּאֲשֶׁר יָצָא מִפִּיךָ
  choice: selon ce qui est sorti de ta bouche
  rationale: Maintient le lien verbal avec l’ouverture de la bouche et souligne la force contraignante de la parole prononcée.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: puisque
  rationale: La locution introduit ici le motif de sa réponse plutôt qu’une simple succession chronologique.
- source_word: עָשָׂה לְךָ יְהוָה נְקָמוֹת
  choice: Yahvé t’a vengé
  rationale: Formulation française concise et idiomatique qui rend l’idée que Yahvé a accompli des actes de vengeance en faveur de Jephté.
- source_word: מֵאֹיְבֶיךָ מִבְּנֵי עַמּוֹן
  choice: de tes ennemis, les Ammonites
  rationale: « Les Ammonites » identifie naturellement en français les « fils d’Ammon » comme les ennemis visés, sans alourdir la phrase.
theological_decisions:
- issue: Nature du vœu de Jephté dans la réponse de sa fille
  choice: Rendre sa soumission aux paroles prononcées sans préciser la forme de leur accomplissement.
  alternative: Interpréter explicitement le vœu soit comme un sacrifice humain, soit comme une consécration perpétuelle dans la virginité.
  rationale: Ce verset ne précise pas lui-même comment le vœu sera exécuté. La formulation conserve donc l’ambiguïté narrative et la tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme concret autour de la bouche est conservé, tandis que « les Ammonites » rend naturellement l’ethnonyme. Le nom divin est translittéré « Yahvé ».
