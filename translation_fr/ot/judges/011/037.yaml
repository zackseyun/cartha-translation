base_translation:
  language: en
  yaml_path: translation/ot/judges/011/037.yaml
  text: 'And she said to her father[a], “Let this thing be done for me: leave me alone for two months, that I may go and wander on the mountains and weep over my virginity[b], I and my companions.”'
translation:
  language: fr
  text: 'Elle dit à son père : « Que ceci soit fait pour moi : accorde-moi un délai de deux mois[a], afin que je puisse aller et descendre dans les montagnes, et pleurer sur ma virginité[b], moi et mes compagnes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « laisse-moi libre pendant deux mois » ou « laisse-moi partir pendant deux mois ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pleurer sur ma virginité ». Le texte souligne qu’elle n’est pas mariée et n’a pas d’enfant, sans trancher ici la question plus large de son destin dans le récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Que ceci soit fait pour moi
  rationale: Conserve la tournure passive à valeur de souhait du nifal de עשה ainsi que le démonstratif, sans transformer explicitement la parole en « requête ».
- source_word: הַרְפֵּה מִמֶּנִּי
  choice: laisse-moi seule
  rationale: 'Rend idiomatiquement l’impératif de רפה avec מן : elle demande à son père de lui laisser la liberté et le temps de s’éloigner. Le féminin « seule » s’accorde avec la locutrice sans nier la présence ultérieure de ses compagnes.'
- source_word: שְׁנַיִם חֳדָשִׁים
  choice: pendant deux mois
  rationale: Expression temporelle directe, avec la préposition requise par le français courant.
- source_word: וְאֵלְכָה וְיָרַדְתִּי
  choice: afin que je puisse partir, descendre
  rationale: Maintient les deux verbes coordonnés du texte hébreu. « Partir, descendre » est plus naturel en français que la répétition « aller et descendre », tout en préservant le mouvement exprimé.
- source_word: עַל הֶהָרִים
  choice: dans les montagnes
  rationale: En contexte de déplacement et de séjour, « dans les montagnes » est l’expression française naturelle pour על, plutôt que le calque peu idiomatique « sur les montagnes ».
- source_word: וְאֶבְכֶּה עַל בְּתוּלַי
  choice: et pleurer sur ma virginité
  rationale: Préserve explicitement l’objet de la lamentation, בתולים, et la construction בכה על, sans introduire la mort ni une consécration perpétuelle dans ce verset.
- source_word: אָנֹכִי וְרֵעוֹתָי
  choice: moi et mes compagnes
  rationale: Le pluriel féminin suffixé désigne ses amies ou compagnes; « compagnes » garde cette précision et convient au registre narratif.
theological_decisions:
- issue: Portée de la lamentation sur la virginité de la fille de Jephté
  choice: Le texte dit qu’elle pleure sur sa virginité, sans préciser ici si cette lamentation concerne une mort prochaine, l’absence de descendance, une virginité perpétuelle, ou plusieurs de ces dimensions.
  alternative: Expliciter soit une mort et une absence de descendance imminentes, soit une consécration à vie dans la virginité.
  rationale: Le verset nomme expressément la virginité mais non la mort. La traduction conserve donc la tension du récit et n’impose aucune résolution confessionnelle ou interprétative.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe conserve la demande solennelle et les deux verbes de déplacement, tout en évitant des calques inutilement obscurs. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
