    issue: « laisse-moi seule »
    rationale: L’impératif הַרְפֵּה avec מן signifie ici accorder congé, laisser libre ou relâcher quelqu’un pour un temps. « Seule » introduit l’idée d’isolement, que le texte ne dit pas et que la présence de ses compagnes rend particulièrement malencontreuse.
  - severity: low
    issue: Coordination des verbes de mouvement atténuée
    rationale: « partir, descendre » conserve les deux infinitifs mais les présente comme une simple apposition. « aller et descendre » reflète plus clairement les deux verbes coordonnés וְאֵלְכָה וְיָרַדְתִּי, sans être un calque incompréhensible.
