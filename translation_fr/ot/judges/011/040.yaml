base_translation:
  language: en
  yaml_path: translation/ot/judges/011/040.yaml
  text: From year to year the daughters of Israel would go to commemorate the daughter of Jephthah the Gileadite four days in the year[a].
translation:
  language: fr
  text: D’année en année, les filles d’Israël allaient commémorer la fille de Jephté, le Galaadite, pendant quatre jours par an[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se lamenter sur la fille de Jephté » ou « raconter son histoire ». Le verbe hébreu est rare et son sens est discuté.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיָּמִים יָמִימָה
  choice: D’année en année
  rationale: L’expression idiomatique indique une répétition annuelle; cette formulation conserve la tournure hébraïque tout en étant naturelle en français.
- source_word: תֵּלַכְנָה
  choice: allaient
  rationale: L’imparfait hébreu exprime ici une action coutumière; l’imparfait français rend naturellement cette pratique répétée.
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: les filles d’Israël
  rationale: Cette traduction formellement proche préserve l’expression hébraïque sans préciser indûment l’âge ou la situation matrimoniale.
- source_word: לְתַנּוֹת
  choice: célébrer la mémoire de
  rationale: Le verbe rare et discuté peut désigner une commémoration ou le fait de raconter; dans ce contexte, « célébrer la mémoire de » exprime l’observance annuelle sans imposer l’idée plus précise de lamentation.
- source_word: לְבַת יִפְתָּח
  choice: de la fille de Jephté
  rationale: La construction désigne directement la fille de Jephté comme objet de cette observance annuelle.
- source_word: הַגִּלְעָדִי
  choice: le Galaadite
  rationale: Le gentilé français traditionnel rend directement l’hébreu et qualifie Jephté.
- source_word: אַרְבַּעַת יָמִים בַּשָּׁנָה
  choice: quatre jours par an
  rationale: Formulation française naturelle qui indique la durée annuelle de la pratique.
theological_decisions:
- issue: Nature de l’observance annuelle concernant la fille de Jephté
  choice: Traduire par « célébrer la mémoire de » dans le texte principal tout en signalant les autres sens possibles.
  alternative: se lamenter sur elle; raconter son histoire
  rationale: Le verbe hébreu est rare et son sens débattu. La traduction principale exprime la commémoration sans trancher la question du sort de la fille de Jephté; la note conserve les autres lectures lexicalement possibles.
translation_notes:
  register: Français international moderne, digne et accessible. « Jephté » et « Galaadite » suivent les formes françaises bibliques établies; la syntaxe demeure proche de l’hébreu sans être artificielle.
