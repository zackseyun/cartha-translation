revisions:
- from: Jephté partit donc avec les anciens de Galaad, et le peuple l’établit à sa tête comme chef et commandant[a]. Puis Jephté prononça toutes ses paroles devant Yahweh, à Mitspa[b].
  to: Jephté alla avec les anciens de Galaad, et le peuple le plaça à leur tête comme chef et commandant[a]. Puis Jephté prononça toutes ses paroles devant Yahweh, à Mitspa[b].
  rationale: La révision retire l’inférence explicite introduite par « donc » et rend plus exactement la construction d’installation « le plaça à leur tête ». Elle conserve l’ambiguïté des « paroles » de Jephté, le nom divin Yahweh et les deux notes, dont les ancres correspondent aux segments expliqués.
