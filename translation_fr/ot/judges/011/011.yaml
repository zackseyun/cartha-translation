    reason: lexical_alternative
  - marker: b
    text: Ou, selon le contexte, « Jephté répéta toutes ses conditions devant Yahweh à Mitspa ». L’hébreu dit littéralement qu’il « prononça toutes ses paroles ».
    reason: alternative_reading
  revision_rationale: La révision retire l’inférence explicite introduite par « donc » et rend plus exactement la construction d’installation « le plaça à leur tête ». Elle conserve l’ambiguïté des « paroles » de Jephté, le nom divin Yahweh et les deux notes, dont les ancres correspondent aux segments expliqués.
