base_translation:
  language: en
  yaml_path: translation/ot/judges/011/011.yaml
  text: So Jephthah went with the elders of Gilead[a], and the people made him head and commander over them[b]. And Jephthah spoke all his words before Yahweh at Mizpah.
translation:
  language: fr
  text: Jephté alla avec les anciens de Galaad, et le peuple le plaça à leur tête comme chef et commandant[a]. Puis Jephté prononça toutes ses paroles devant Yahweh, à Mitspa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le peuple le désigna comme son chef et son dirigeant ». Le terme hébreu traduit par « commandant » peut aussi désigner un dirigeant ou un capitaine.
    reason: lexical_alternative
  - marker: b
    text: Ou, selon le contexte, « Jephté répéta toutes ses conditions devant Yahweh à Mitspa ». L’hébreu dit littéralement qu’il « prononça toutes ses paroles ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ יִפְתָּח עִם זִקְנֵי גִלְעָד
  choice: Jephté partit donc avec les anciens de Galaad
  rationale: Le verbe הלך poursuit simplement le récit. « Partit avec » exprime naturellement en français le déplacement accompagné, tandis que « donc » marque la conséquence du dialogue précédent sans surcharger la phrase.
- source_word: וַיָּשִׂימוּ הָעָם אוֹתוֹ עֲלֵיהֶם
  choice: le peuple l’établit à sa tête
  rationale: La construction שׂים avec עַל exprime ici l’installation de Jephté dans une fonction d’autorité. « L’établit à sa tête » est idiomatique et conserve l’image de la tête présente dans la suite hébraïque.
- source_word: לְרֹאשׁ וּלְקָצִין
  choice: comme chef et commandant
  rationale: רֹאשׁ désigne le dirigeant principal; קָצִין peut désigner un chef, un gouvernant ou un commandant. Le contexte de guerre imminente favorise « commandant », sans réduire la première fonction à sa seule dimension militaire.
- source_word: וַיְדַבֵּר ... אֶת כָּל דְּבָרָיו
  choice: prononça toutes ses paroles
  rationale: Cette formulation conserve l’expression large de l’hébreu et évite de décider s’il s’agit précisément de conditions répétées, d’un engagement solennel, d’une prière ou d’un compte rendu.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » préserve l’idée d’une parole prononcée en présence de Dieu, possiblement dans un cadre solennel, cultuel ou judiciaire.
- source_word: בַּמִּצְפָּה
  choice: à Mitspa
  rationale: Le nom du lieu est translittéré sous la forme française courante « Mitspa »; la préposition « à » convient naturellement à un lieu de rassemblement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » rend le nom propre divin plutôt qu’un titre et suit la convention du projet.
- issue: Nature des paroles de Jephté devant Yahweh
  choice: prononça toutes ses paroles
  alternative: répéta toutes ses conditions
  rationale: Le contexte peut évoquer la ratification solennelle de l’accord conclu avec les anciens, mais l’hébreu ne précise ni « conditions » ni la nature exacte de l’acte. Le texte principal conserve donc cette indétermination.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste fluide tout en conservant l’image d’autorité liée à la « tête » et l’ambiguïté de l’expression « toutes ses paroles ». Les marqueurs de notes sont placés exactement après les segments qu’ils expliquent.
