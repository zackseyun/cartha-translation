  text: וַ/יֹּ֨אמֶר יִפְתָּ֜ח אֶל זִקְנֵ֣י גִלְעָ֗ד אִם מְשִׁיבִ֨ים אַתֶּ֤ם אוֹתִ/י֙ לְ/הִלָּחֵם֙ בִּ/בְנֵ֣י עַמּ֔וֹן וְ/נָתַ֧ן יְהוָ֛ה אוֹתָ֖/ם לְ/פָנָ֑/י אָנֹכִ֕י אֶהְיֶ֥ה לָ/כֶ֖ם לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/009.yaml
  text: Jephthah said to the elders of Gilead[a], “If you bring me back to fight against the Ammonites, and Yahweh gives them before me[b], I will be your head.”
translation:
  language: fr
  text: 'Jephté dit aux anciens de Galaad : « Si vous me ramenez pour combattre les Ammonites et que Yahweh me les livre[a], je serai votre chef[b][c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les donne devant moi »; l’expression évoque leur remise au pouvoir de Jephté.'
    reason: idiome_source
  - marker: b
    text: 'Littéralement : « tête »; c’est-à-dire chef ou dirigeant.'
    reason: lexical_alternative
  - marker: c
    text: 'On peut aussi comprendre la dernière proposition comme une question : « serai-je alors votre chef ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשִׁיבִים
  choice: vous me ramenez
  rationale: Le hifil de שׁוב exprime ici l’action de faire revenir Jephté, précédemment chassé. « Me ramenez » est naturel en français et conserve cette valeur causative.
- source_word: לְהִלָּחֵם
  choice: pour combattre
  rationale: L’infinitif nifal de לחם désigne l’engagement dans le combat. « Combattre » convient au contexte militaire sans explicitation superflue.
- source_word: בִּבְנֵי עַמּוֹן
  choice: les Ammonites
  rationale: L’expression signifie littéralement « les fils d’Ammon »; l’ethnonyme français courant désigne clairement ce peuple.
- source_word: וְנָתַן יְהוָה אוֹתָם לְפָנַי
  choice: et que Yahweh me les livre
  rationale: La tournure française exprime naturellement l’idée de נתן avec לפני dans ce contexte de victoire, sans ajouter l’image d’une « main », absente de l’hébreu. Une note conserve la formulation spatiale littérale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
- source_word: לְרֹאשׁ
  choice: chef
  rationale: ראש signifie littéralement « tête » et, par métaphore, « chef » ou « dirigeant ». « Chef » communique clairement la fonction politique demandée, tandis que la note préserve la métaphore hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom personnel divin sans lui substituer un titre.
- issue: Valeur énonciative de אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ
  choice: 'déclaration : « je serai votre chef »'
  alternative: 'question : « serai-je alors votre chef ? »'
  rationale: La proposition hébraïque ne comporte aucune particule interrogative et se lit formellement comme une déclaration. Le contexte de négociation permet toutefois de l’entendre comme une demande de confirmation; cette possibilité est signalée en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conditionnelle reste proche de l’hébreu. « Galaad », « Jephté » et « Ammonites » suivent les formes françaises bibliques usuelles; les notes rendent visibles l’image de la « tête », l’idiome de la victoire et l’ambiguïté discursive finale.
