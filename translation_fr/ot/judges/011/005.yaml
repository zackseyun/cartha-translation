  text: וַ/יְהִ֕י כַּ/אֲשֶׁר נִלְחֲמ֥וּ בְנֵֽי עַמּ֖וֹן עִם יִשְׂרָאֵ֑ל וַ/יֵּֽלְכוּ֙ זִקְנֵ֣י גִלְעָ֔ד לָ/קַ֥חַת אֶת יִפְתָּ֖ח מֵ/אֶ֥רֶץ טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/005.yaml
  text: And when the Ammonites fought against Israel[a], the elders of Gilead went to bring Jephthah from the land of Tob.
translation:
  language: fr
  text: Or, lorsque les Ammonites combattirent Israël, les anciens de Galaad allèrent chercher[a] Jephté au pays de Tob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « prendre ». Ici, il s’agit d’aller auprès de Jephté pour le faire venir avec eux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Or, lorsque
  rationale: La formule narrative introduit l’événement suivant tout en marquant sa circonstance temporelle. « Or, lorsque » est naturel en français narratif et conserve cette progression.
- source_word: נִלְחֲמוּ
  choice: combattirent
  rationale: Le nifal de לחם désigne ici le fait d’engager le combat. Le passé simple convient au récit et présente l’action comme un événement de la séquence narrative.
- source_word: בְנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Il s’agit de la désignation ethnique habituelle des descendants ou du peuple d’Ammon; « les Ammonites » est la forme française consacrée.
- source_word: עִם יִשְׂרָאֵל
  choice: Israël
  rationale: Avec le verbe « combattre », la préposition עִם désigne la partie adverse. En français, « combattre Israël » exprime clairement ce rapport sans préposition supplémentaire.
- source_word: זִקְנֵי גִלְעָד
  choice: les anciens de Galaad
  rationale: Le syntagme construit désigne les chefs reconnus de Galaad; cette formulation est exacte et traditionnelle sans être obscure.
- source_word: לָקַחַת
  choice: aller chercher
  rationale: Bien que לקח signifie souvent « prendre », le contexte décrit les anciens qui se rendent auprès de Jephté afin de le faire venir avec eux. L’expression française « aller chercher » rend naturellement ce mouvement sans supposer qu’ils ignoraient où il se trouvait.
- source_word: אֶת יִפְתָּח
  choice: Jephté
  rationale: Le marqueur d’objet direct introduit le nom propre, rendu selon sa forme française usuelle.
- source_word: מֵאֶרֶץ טוֹב
  choice: au pays de Tob
  rationale: Après « aller chercher », le français indique idiomatiquement le lieu où se trouve la personne avec « au ». אֶרֶץ désigne ici le pays ou territoire de Tob.
theological_decisions: []
