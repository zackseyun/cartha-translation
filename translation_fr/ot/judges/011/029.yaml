  text: וַ/תְּהִ֤י עַל יִפְתָּח֙ ר֣וּחַ יְהוָ֔ה וַ/יַּעֲבֹ֥ר אֶת הַ/גִּלְעָ֖ד וְ/אֶת מְנַשֶּׁ֑ה וַֽ/יַּעֲבֹר֙ אֶת מִצְפֵּ֣ה גִלְעָ֔ד וּ/מִ/מִּצְפֵּ֣ה גִלְעָ֔ד עָבַ֖ר בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/029.yaml
  text: Then the Spirit of Yahweh came upon Jephthah[a], and he passed through Gilead and Manasseh. He passed through Mizpah of Gilead, and from Mizpah of Gilead he passed on to the Ammonites.
translation:
  language: fr
  text: Alors l’Esprit de Yahweh vint sur Jephté. Il traversa le Galaad et Manassé, puis passa par Mitspa de Galaad. De Mitspa de Galaad, il avança vers les Ammonites[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il passa du côté des Ammonites ». Le verbe hébreu peut signifier passer, traverser ou avancer, selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עַל יִפְתָּח רוּחַ יְהוָה
  choice: l’Esprit de Yahweh vint sur Jephté
  rationale: Dans le récit des Juges, רוּחַ יְהוָה désigne l’Esprit divin qui investit et rend capable un chef. « Vint sur » restitue le caractère événementiel de la proposition sans expliciter davantage la nature de cette action.
- source_word: יִפְתָּח
  choice: Jephté
  rationale: Forme française traditionnelle et couramment reconnue du nom propre.
- source_word: וַיַּעֲבֹר אֶת הַגִּלְעָד וְאֶת מְנַשֶּׁה
  choice: Il traversa le Galaad et Manassé
  rationale: Avec des territoires comme compléments directs, עבר exprime ici le déplacement à travers ces régions. « Traverser » est précis et naturel en français.
- source_word: מִצְפֵּה גִלְעָד
  choice: Mitspa de Galaad
  rationale: Il s’agit d’un nom de lieu. La translittération « Mitspa » évite de traduire à tort le toponyme comme un simple nom commun signifiant « poste d’observation ».
- source_word: וַיַּעֲבֹר אֶת מִצְפֵּה גִלְעָד
  choice: puis passa par Mitspa de Galaad
  rationale: La tournure « passer par » exprime naturellement en français le mouvement de Jephté à travers cette localité, tandis que « puis » marque la progression narrative.
- source_word: עָבַר בְּנֵי עַמּוֹן
  choice: il avança vers les Ammonites
  rationale: עבר décrit ici un déplacement en direction des בני עמון. « Avança vers » rend la progression sans affirmer qu’une attaque a déjà commencé; une note conserve une traduction plus littérale du verbe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; l’Éternel
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le représente comme nom propre plutôt que de le remplacer par un titre.
- issue: Nature de רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  alternative: le souffle de Yahweh; le vent de Yahweh
  rationale: Dans ce contexte narratif des Juges, l’expression indique l’action divine qui investit Jephté. La traduction garde cette portée tout en s’abstenant de préciser ce que le verset ne développe pas.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « Mitspa de Galaad » est maintenue parce qu’elle structure explicitement l’itinéraire dans l’hébreu. « Ammonites » rend naturellement בני עמון comme désignation du peuple.
