  text: וַ/יֹּאמֶר֩ מֶ֨לֶךְ בְּנֵי עַמּ֜וֹן אֶל מַלְאֲכֵ֣י יִפְתָּ֗ח כִּֽי לָקַ֨ח יִשְׂרָאֵ֤ל אֶת אַרְצִ/י֙ בַּ/עֲלוֹת֣/וֹ מִ/מִּצְרַ֔יִם מֵ/אַרְנ֥וֹן וְ/עַד הַ/יַּבֹּ֖ק וְ/עַד הַ/יַּרְדֵּ֑ן וְ/עַתָּ֕ה הָשִׁ֥יבָ/ה אֶתְ/הֶ֖ן בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/013.yaml
  text: And the king of the Ammonites said to Jephthah’s messengers, “Because Israel took my land when it came up from Egypt, from the Arnon as far as the Jabbok and as far as the Jordan, now restore them peacefully.”
translation:
  language: fr
  text: 'Le roi des Ammonites dit aux messagers de Jephté : « Parce qu’Israël a pris mon pays lorsqu’il est monté d’Égypte, de l’Arnon jusqu’au Jabbok et jusqu’au Jourdain, rends-moi maintenant ces terres en paix[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom hébreu est féminin pluriel (« les ») ; il renvoie vraisemblablement aux terres ou régions revendiquées.
    reason: Conserve l’ambiguïté de l’antécédent tout en expliquant l’explicitation française « ces terres ».
lexical_decisions:
- source_word: כִּי
  choice: C’est parce que
  rationale: Rend la réponse causale du roi à la question posée au verset précédent, sans réduire la conjonction à une simple introduction de discours.
- source_word: אַרְצִי
  choice: mon pays
  rationale: Exprime naturellement la revendication territoriale du roi; « pays » convient mieux ici que « terre » pour une étendue politique délimitée.
- source_word: בַּעֲלוֹתוֹ מִמִּצְרַיִם
  choice: lorsqu’il est monté d’Égypte
  rationale: Conserve l’image spatiale et le singulier collectif appliqué à Israël.
- source_word: אֶתְהֶן
  choice: ces territoires
  rationale: Le pronom féminin pluriel renvoie vraisemblablement aux terres ou régions revendiquées; l’explicitation est nécessaire en français naturel puisque « pays » est singulier.
- source_word: בְּשָׁלוֹם
  choice: pacifiquement
  rationale: Préserve l’idée d’une restitution sans hostilités, tout en laissant ouverte la nuance possible de bonne entente.
theological_decisions:
- issue: Statut de la revendication territoriale ammonite
  choice: Présenter les paroles comme l’affirmation du roi, sans les valider narrativement
  alternative: Reformuler de manière à indiquer que cette terre appartenait réellement aux Ammonites
  rationale: Le verset rapporte une revendication diplomatique qui sera contestée par Jephté; la traduction ne doit pas anticiper le jugement du récit.
- issue: Valeur de כִּי en tête de réponse
  choice: 'Lecture causale : « C’est parce que »'
  alternative: 'Lecture déclarative : « Israël a pris… »'
  rationale: Le contexte immédiat favorise une réponse à « Quel différend y a-t-il entre toi et moi ? », tout en reconnaissant que la particule peut aussi introduire le contenu de la réponse.
translation_notes:
  register: Français international moderne, narratif et digne. « Jephté », « Arnon », « Jabbok » et « Jourdain » suivent les formes françaises usuelles. La demande directe emploie le tutoiement, conforme au dialogue biblique entre dirigeants.
