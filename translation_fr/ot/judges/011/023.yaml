source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הוֹרִישׁ֙ אֶת הָ֣/אֱמֹרִ֔י מִ/פְּנֵ֖י עַמּ֣/וֹ יִשְׂרָאֵ֑ל וְ/אַתָּ֖ה תִּירָשֶֽׁ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/023.yaml
  text: And now Yahweh[a], the God of Israel, has dispossessed the Amorites from before his people Israel; and are you to possess it?
translation:
  language: fr
  text: Et maintenant, Yahvé, le Dieu d’Israël, a dépossédé les Amorites au profit de son peuple Israël. Et toi, tu en prendrais possession[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu en hériterais ». Le verbe hébreu peut désigner le fait de recevoir un territoire en héritage ou d’en prendre possession.
    reason: Alternative lexicale préservant l’étendue de sens du verbe ירש.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec l’argument précédent et la transition vers sa conclusion.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin en employant sa forme française courante, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la construction qui identifie Yahvé comme le Dieu d’Israël.
- source_word: הוֹרִישׁ
  choice: a dépossédé
  rationale: Le hiphil de ירש exprime ici le fait de faire perdre à un peuple la possession de son territoire; « déposséder » préserve ce sens foncier.
- source_word: הָאֱמֹרִי
  choice: les Amorites
  rationale: Le singulier ethnique hébreu a une valeur collective; le pluriel est naturel en français.
- source_word: מִפְּנֵי
  choice: devant
  rationale: Maintient l’image spatiale de l’hébreu sans expliciter davantage la manière dont les Amorites ont été écartés.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: son peuple Israël
  rationale: Préserve le possessif renvoyant à Yahvé et l’identification appositionnelle du peuple.
- source_word: וְאַתָּה
  choice: Et toi, tu
  rationale: Le pronom détaché rend l’emphase confrontante du pronom indépendant hébreu.
- source_word: תִּירָשֶׁנּוּ
  choice: tu en prendrais possession
  rationale: Rend le sens territorial de ירש et la valeur rhétorique de la question. Le pronom « en » laisse le territoire implicite, comme dans le contexte hébreu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa transcription française le distingue du titre « Seigneur » sans ajouter d’interprétation confessionnelle.
- issue: Objet implicite de תִּירָשֶׁנּוּ
  choice: en prendre possession
  alternative: les posséder
  rationale: Dans l’argument territorial, le verbe vise naturellement le pays ou territoire auparavant détenu par les Amorites. La formulation française garde néanmoins cet objet implicite plutôt que d’ajouter « le pays » dans le texte.
translation_notes:
  register: Français international moderne, sobre et digne. La reprise « Et toi, tu » marque l’opposition rhétorique. « Devant son peuple Israël » conserve volontairement l’image hébraïque, légèrement solennelle, tandis que la ponctuation française clarifie les deux mouvements du verset.
