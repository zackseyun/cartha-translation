  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֔/וֹ כֹּ֖ה אָמַ֣ר יִפְתָּ֑ח לֹֽא לָקַ֤ח יִשְׂרָאֵל֙ אֶת אֶ֣רֶץ מוֹאָ֔ב וְ/אֶת אֶ֖רֶץ בְּנֵ֥י עַמּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/015.yaml
  text: 'And he said to him[a], “Thus says Jephthah: Israel did not take the land of Moab or the land of the sons of Ammon.”'
translation:
  language: fr
  text: 'Il lui dit : « Voici ce que dit Jephté : Israël n’a pris ni le territoire de Moab ni celui des Ammonites[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils d’Ammon »; c’est-à-dire des Ammonites.'
    reason: Préserve la forme de l’ethnonyme hébreu בְּנֵי עַמּוֹן derrière son rendu idiomatique français.
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Il lui dit
  rationale: Rend naturellement la succession narrative introduite par le waw et conserve le destinataire masculin singulier explicite.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule française actuelle et digne qui restitue l’introduction solennelle du message sans donner artificiellement au verbe une valeur passée.
- source_word: יִפְתָּח
  choice: Jephté
  rationale: Forme française traditionnelle et couramment reconnue du nom propre.
- source_word: לֹא לָקַח
  choice: n’a pris ni… ni…
  rationale: Le verbe « prendre » garde l’étendue sémantique de לקח sans imposer la nuance plus violente de « s’emparer de »; la coordination négative française rend clairement les deux objets du verbe.
- source_word: אֶרֶץ
  choice: territoire
  rationale: Dans cet échange diplomatique portant sur une revendication territoriale, « territoire » est naturel et précis; « celui » évite une répétition lourde tout en reflétant le second אֶרֶץ.
- source_word: מוֹאָב
  choice: Moab
  rationale: Forme française standard du nom géographique.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Cette expression hébraïque est un ethnonyme; « les Ammonites » en donne le sens naturel en français, tandis que la forme littérale est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formule diplomatique reste solennelle sans archaïsme. La répétition hébraïque de « territoire » est allégée par le pronom « celui », et l’ethnonyme est rendu idiomatiquement avec sa forme littérale en note.
