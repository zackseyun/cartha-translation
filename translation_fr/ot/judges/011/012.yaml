  text: וַ/יִּשְׁלַ֤ח יִפְתָּח֙ מַלְאָכִ֔ים אֶל מֶ֥לֶךְ בְּנֵֽי עַמּ֖וֹן לֵ/אמֹ֑ר מַה לִּ֣/י וָ/לָ֔/ךְ כִּֽי בָ֥אתָ אֵלַ֖/י לְ/הִלָּחֵ֥ם בְּ/אַרְצִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/012.yaml
  text: Then Jephthah sent messengers to the king of the Ammonites[a], saying, “What is there between me and you, that you have come against me to fight in my land?”
translation:
  language: fr
  text: 'Alors Jephthé envoya des messagers au roi des Ammonites pour lui dire : « Qu’y a-t-il entre toi et moi[a], puisque tu es venu faire la guerre dans mon pays ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’ai-je à faire avec toi ? » L’expression hébraïque indique ici un différend ou une hostilité entre les deux parties.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Alors … envoya
  rationale: Le waw consécutif fait progresser le récit. « Alors » marque naturellement la succession des événements en français.
- source_word: יִפְתָּח
  choice: Jephthé
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte diplomatique, le terme désigne des représentants humains et non des êtres célestes. « Messagers » reste clair et moins spécialisé qu’« émissaires ».
- source_word: אֶל מֶלֶךְ בְּנֵי עַמּוֹן
  choice: au roi des Ammonites
  rationale: « Fils d’Ammon » est ici une désignation ethnique; « les Ammonites » est son équivalent français naturel.
- source_word: לֵאמֹר
  choice: pour lui dire
  rationale: Cette tournure introduit naturellement le discours direct en français et explicite que les messagers transmettent les paroles de Jephthé au roi.
- source_word: מַה לִּי וָלָךְ
  choice: Qu’y a-t-il entre toi et moi ?
  rationale: La formulation reste proche de l’idiome hébreu tout en étant compréhensible en français. L’ordre « toi et moi » est plus naturel en français; le sens conflictuel est précisé en note.
- source_word: כִּי
  choice: pour que
  rationale: Dans cette question, « pour que » relie naturellement le différend évoqué à l’action hostile qui le manifeste, sans imposer un simple rapport causal.
- source_word: בָאתָ אֵלַי
  choice: tu sois venu me faire la guerre
  rationale: Le verbe signifie littéralement « tu es venu vers moi », mais le contexte hostile et l’infinitif suivant justifient une formulation adversative naturelle.
- source_word: לְהִלָּחֵם
  choice: faire la guerre
  rationale: Le verbe désigne l’engagement dans un combat. « Faire la guerre » convient au conflit entre peuples et conserve la force de l’expression.
- source_word: בְּאַרְצִי
  choice: dans mon pays
  rationale: La préposition signifie ici « dans ». « Pays » rend אַרְצִי de façon concrète et naturelle, sans réduire nécessairement le sens à un territoire administratif.
