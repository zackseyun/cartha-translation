  text: וַ/יּ֥וֹסֶף ע֖וֹד יִפְתָּ֑ח וַ/יִּשְׁלַח֙ מַלְאָכִ֔ים אֶל מֶ֖לֶךְ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/014.yaml
  text: Then Jephthah again sent messengers to the king of the Ammonites[a].
translation:
  language: fr
  text: Puis Jephté envoya de nouveau des messagers au roi des Ammonites[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le roi des fils d’Ammon », expression hébraïque qui désigne le peuple ammonite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד
  choice: Puis ... de nouveau
  rationale: L’expression idiomatique indique la répétition ou la poursuite de l’action. « De nouveau » en restitue naturellement le sens, tandis que « Puis » rend la progression narrative du waw.
- source_word: יִפְתָּח
  choice: Jephté
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Équivalent français standard et naturel de שׁלח dans ce contexte narratif.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte diplomatique, le terme désigne des émissaires humains, et non des anges. « Messagers » reste clair et proche du terme source.
- source_word: אֶל
  choice: au
  rationale: La préposition directionnelle est naturellement intégrée à la contraction française « au roi ».
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: au roi des Ammonites
  rationale: בְּנֵי עַמּוֹן est l’expression ethnogéographique usuelle désignant le peuple ammonite. « Les Ammonites » en donne le référent naturel en français.
