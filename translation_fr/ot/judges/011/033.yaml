source:
  edition: WLC
  text: וַ/יַּכֵּ֡/ם מֵ/עֲרוֹעֵר֩ וְ/עַד בּוֹאֲ/ךָ֨ מִנִּ֜ית עֶשְׂרִ֣ים עִ֗יר וְ/עַד֙ אָבֵ֣ל כְּרָמִ֔ים מַכָּ֖ה גְּדוֹלָ֣ה מְאֹ֑ד וַ/יִּכָּֽנְעוּ֙ בְּנֵ֣י עַמּ֔וֹן מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/033.yaml
  text: And he struck them from Aroer as far as the entrance to Minnith[a], twenty cities, and as far as Abel-keramim, with a very great slaughter[d][c][b]. So the sons of Ammon were subdued before the sons of Israel.
translation:
  language: fr
  text: Il les battit depuis Aroër jusqu’aux abords de Minnith[a] — vingt villes — et jusqu’à Abel-Keramim[b], leur infligeant une très lourde défaite[c]. Ainsi, les Ammonites furent soumis aux Israélites[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à Minnith » ou « jusqu’à l’entrée de Minnith ». L’expression hébraïque peut désigner les abords de la ville, son entrée, ou simplement la ville elle-même.
    reason: alternative_reading
  - marker: b
    text: Abel-Keramim est un nom de lieu. Ses éléments peuvent signifier « prairie des vignes » ou « pré des vignobles ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « d’un coup très grand ». Dans un contexte militaire, l’expression peut désigner une défaite dévastatrice ou un grand carnage.
    reason: lexical_alternative
  - marker: d
    text: Littéralement « les fils d’Ammon furent soumis devant les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: Il les battit
  rationale: Le verbe נכה désigne ici l’action de frapper ou de vaincre dans un contexte militaire. « Battit » est naturel en français et n’implique pas à lui seul que tous furent tués.
- source_word: מֵעֲרוֹעֵר
  choice: depuis Aroër
  rationale: Nom de lieu translittéré ; מִן marque le point de départ de l’étendue géographique.
- source_word: וְעַד בּוֹאֲךָ מִנִּית
  choice: jusqu’aux abords de Minnith
  rationale: L’expression בּוֹאֲךָ est difficile et peut viser l’approche ou l’entrée d’une ville. « Aux abords de » conserve ce sens géographique sans imposer l’idée d’une porte précise.
- source_word: עֶשְׂרִים עִיר
  choice: vingt villes
  rationale: Rendu direct du nombre et du nom עִיר ; l’incise est conservée pour refléter la syntaxe du relevé géographique.
- source_word: וְעַד אָבֵל כְּרָמִים
  choice: et jusqu’à Abel-Keramim
  rationale: Le syntagme fonctionne comme un nom de lieu et est donc translittéré plutôt que traduit.
- source_word: מַכָּה גְּדוֹלָה מְאֹד
  choice: une très lourde défaite
  rationale: Dans ce contexte militaire, מַכָּה désigne un coup dévastateur, une défaite ou un carnage. « Très lourde défaite » exprime la gravité sans affirmer plus précisément que l’hébreu l’ampleur des morts.
- source_word: וַיִּכָּנְעוּ
  choice: furent soumis
  rationale: Le niphal de כנע exprime ici la soumission résultant d’une défaite militaire et politique.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Équivalent français courant de l’expression généalogique littérale « les fils d’Ammon ».
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: aux Israélites
  rationale: Dans cette construction avec כנע, מִפְּנֵי indique ceux devant qui ou face auxquels les Ammonites sont soumis. La formulation française idiomatique est « soumis aux Israélites ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les gentilés « Ammonites » et « Israélites » rendent naturellement les expressions hébraïques fondées sur la filiation, tandis qu’une note en conserve la forme littérale. Les tirets isolent clairement « vingt villes » comme précision sur l’étendue de la campagne.
