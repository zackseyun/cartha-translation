  text: וְ/הָיָ֣ה הַ/יּוֹצֵ֗א אֲשֶׁ֨ר יֵצֵ֜א מִ/דַּלְתֵ֤י בֵיתִ/י֙ לִ/קְרָאתִ֔/י בְּ/שׁוּבִ֥/י בְ/שָׁל֖וֹם מִ/בְּנֵ֣י עַמּ֑וֹן וְ/הָיָה֙ לַֽ/יהוָ֔ה וְ/הַעֲלִיתִ֖/הוּ עוֹלָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/031.yaml
  text: then whatever comes out from the doors of my house to meet me when I return in peace from the Ammonites shall be Yahweh’s[a], and I will offer it up as a burnt offering.
translation:
  language: fr
  text: alors ce qui sortira des portes de ma maison à ma rencontre, quand je reviendrai sain et sauf des Ammonites, appartiendra à l’Éternel[a], et je l’offrirai en holocauste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « appartiendra à l’Éternel, ou je l’offrirai en holocauste ». Certains comprennent ici la conjonction hébraïque dans un sens disjonctif, ce qui donnerait deux issues possibles selon ce qui sortirait à la rencontre de Jephté.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַיּוֹצֵא אֲשֶׁר יֵצֵא
  choice: celui qui sortira
  rationale: La tournure hébraïque, littéralement « le sortant qui sortira », est au masculin singulier et peut désigner une personne ou un animal. « Celui qui » conserve cette indétermination référentielle mieux qu’un terme explicitement humain ou animal.
- source_word: מִדַּלְתֵי בֵיתִי
  choice: des portes de ma maison
  rationale: Le pluriel hébreu דַּלְתֵי est conservé dans une formulation française naturelle et proche du texte source.
- source_word: לִקְרָאתִי
  choice: à ma rencontre
  rationale: Cette expression rend naturellement le mouvement en vue d’une rencontre, sans ajouter l’idée plus précise d’un salut ou d’un accueil.
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  choice: quand je reviendrai sain et sauf
  rationale: Dans ce contexte militaire, שָׁלוֹם exprime le retour indemne et en sécurité. La locution française est plus naturelle ici que « en paix », tout en gardant le sens contextuel.
- source_word: מִבְּנֵי עַמּוֹן
  choice: de chez les Ammonites
  rationale: בְּנֵי עַמּוֹן désigne le peuple ammonite. Avec le verbe revenir, « de chez les Ammonites » exprime naturellement le point de retour après le conflit.
- source_word: וְהָיָה לַיהוָה
  choice: appartiendra à l’Éternel
  rationale: La clause marque la consécration ou l’appartenance à YHWH. « Appartiendra à » est clair en français et ne précise pas encore le mode de consécration.
- source_word: לַיהוָה
  choice: à l’Éternel
  rationale: Le tétragramme YHWH est rendu dans le corps du texte par « l’Éternel », forme française traditionnelle et intelligible, sans employer une vocalisation conjecturale du nom.
- source_word: וְהַעֲלִיתִהוּ עוֹלָה
  choice: et je l’offrirai en holocauste
  rationale: Le hifil de עלה avec עוֹלָה constitue l’expression sacrificielle usuelle. Le pronom français « l’ » maintient ouverte l’identité humaine ou animale de l’antécédent.
theological_decisions:
- issue: Le וְ reliant la consécration à l’Éternel et l’offrande en holocauste exprime-t-il une addition ou une alternative ?
  choice: Une seule issue, avec la conjonction « et » dans le texte principal.
  alternative: « appartiendra à l’Éternel, ou je l’offrirai en holocauste », ce qui ferait dépendre l’issue de ce qui sortira.
  rationale: La valeur ordinaire de וְ est additive, « et », et la syntaxe se lit le plus naturellement comme un vœu unique. La lecture disjonctive, défendue par certains, est signalée en note afin de préserver le débat sans résoudre la tension pour des raisons doctrinales.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’ambiguïté sur l’identité de ce qui sortira et maintient dans le texte principal la coordination hébraïque ordinaire, tandis que la lecture alternative est documentée en note.
