  text: הֲ/לֹ֞א אֵ֣ת אֲשֶׁ֧ר יוֹרִֽישְׁ/ךָ֛ כְּמ֥וֹשׁ אֱלֹהֶ֖י/ךָ אוֹת֥/וֹ תִירָ֑שׁ וְ/אֵת֩ כָּל אֲשֶׁ֨ר הוֹרִ֜ישׁ יְהוָ֧ה אֱלֹהֵ֛י/נוּ מִ/פָּנֵ֖י/נוּ אוֹת֥/וֹ נִירָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/024.yaml
  text: Will you not possess what Chemosh your god causes you to possess? And all that Yahweh our God has dispossessed before us[b][a], that we will possess.
translation:
  language: fr
  text: Ne prendras-tu pas possession de ce que Kemosh, ton dieu, te donne à posséder ? Et tout ce que Yahweh, notre Dieu, a dépossédé devant nous, nous le posséderons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le même verbe hébreu est employé à plusieurs reprises dans ce verset. Selon la forme et le contexte, il peut signifier « prendre possession », « donner à posséder » ou « déposséder ». Dans la seconde proposition, « tout ce que » ne précise pas explicitement son référent.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Ne prendras-tu pas
  rationale: Introduit une question rhétorique qui attend une réponse affirmative et convient à l'argument adressé directement au roi ammonite.
- source_word: יוֹרִישְׁךָ
  choice: te donne en possession
  rationale: Le hiphil de ירשׁ exprime ici le fait de faire accéder quelqu'un à la possession, avec en arrière-plan la dépossession d'autres occupants. Cette formulation française rend naturellement le résultat causatif sans effacer le lien avec les autres occurrences du même verbe.
- source_word: כְּמוֹשׁ אֱלֹהֶיךָ
  choice: Kemosh, ton dieu
  rationale: Le nom divin est translittéré sous une forme lisible en français, et l'apposition est conservée sans ajouter de prise de distance interprétative.
- source_word: תִירָשׁ
  choice: prendras possession
  rationale: Dans ce contexte territorial et militaire, ירשׁ désigne l'acquisition ou la détention d'un territoire plutôt qu'un héritage familial.
- source_word: הוֹרִישׁ
  choice: a dépossédé
  rationale: Le hiphil met en avant l'action par laquelle Yahweh retire leur possession aux occupants antérieurs; « déposséder » conserve précisément cette valeur causative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom personnel divin est translittéré plutôt que remplacé par un titre.
- source_word: מִפָּנֵינוּ
  choice: devant nous
  rationale: Conserve l'image spatiale de l'hébreu, qui évoque les peuples écartés de la route ou de la présence d'Israël.
- source_word: נִירָשׁ
  choice: nous en prendrons possession
  rationale: Reprend le sens territorial de ירשׁ et maintient la cohérence lexicale avec la première proposition dans un français naturel.
theological_decisions:
- issue: La mention de Kemosh comme « ton dieu » dans le discours de Jephté
  choice: Traduire directement la formulation diplomatique et rhétorique
  alternative: Ajouter des guillemets, une réserve ou une paraphrase ironique pour nier explicitement la divinité ou l'action de Kemosh
  rationale: Le texte rapporte l'argument de Jephté en adoptant le point de vue revendiqué par son interlocuteur, sans que le narrateur affirme pour autant la réalité divine ou la puissance de Kemosh. Une qualification ajoutée résoudrait une tension que l'hébreu laisse intacte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « possession » est volontaire afin de refléter le jeu sur la racine ירשׁ. « Kemosh » suit une translittération adaptée à la lecture française; « Yahweh » conserve le nom personnel divin.
