- from: Ne prendras-tu pas possession de ce que Kemosh, ton dieu, te donne en possession ? Et tout ce dont Yahweh, notre Dieu, a dépossédé les peuples devant nous, nous en prendrons possession.[a]
  to: Ne prendras-tu pas possession de ce que Kemosh, ton dieu, te donne à posséder ? Et tout ce que Yahweh, notre Dieu, a dépossédé devant nous, nous le posséderons.[a]
  rationale: La révision supprime l’ajout interprétatif « les peuples », préserve ainsi l’ambiguïté du collectif hébreu, et remplace une tournure lourde par « donne à posséder ». La note est ajustée pour expliquer les valeurs du verbe sans introduire un référent absent du texte.
