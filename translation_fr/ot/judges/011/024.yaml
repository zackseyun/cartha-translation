    issue: Ajout de « les peuples » dans la seconde proposition.
    rationale: L’hébreu dit littéralement « tout ce que Yahweh notre Dieu a dépossédé devant nous »; il ne nomme pas explicitement les peuples. Même si le contexte peut viser des occupants, la traduction ne doit pas fixer ce référent implicite.
  - severity: low
    issue: Formulation « te donne en possession ».
    rationale: Elle est grammaticalement possible, mais « te donne à posséder » est plus naturel en français international moderne et exprime toujours le causatif.
