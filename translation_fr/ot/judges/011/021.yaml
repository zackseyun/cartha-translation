source:
  edition: WLC
  text: וַ֠/יִּתֵּן יְהוָ֨ה אֱלֹהֵֽי יִשְׂרָאֵ֜ל אֶת סִיח֧וֹן וְ/אֶת כָּל עַמּ֛/וֹ בְּ/יַ֥ד יִשְׂרָאֵ֖ל וַ/יַּכּ֑וּ/ם וַ/יִּירַשׁ֙ יִשְׂרָאֵ֔ל אֵ֚ת כָּל אֶ֣רֶץ הָ/אֱמֹרִ֔י יוֹשֵׁ֖ב הָ/אָ֥רֶץ הַ/הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/021.yaml
  text: And Yahweh[a], the God of Israel, gave Sihon and all his people into the hand of Israel, and they struck them down. So Israel took possession of all the land of the Amorites who lived in that land.
translation:
  language: fr
  text: Yahweh, le Dieu d’Israël, livra Sihôn et tout son peuple au pouvoir d’Israël, et Israël les battit. Ainsi, Israël prit possession de tout le pays des Amorites qui habitaient ce pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: livra ... au pouvoir d’Israël
  rationale: L’expression hébraïque « donner dans la main de » signifie placer sous le pouvoir de quelqu’un. Cette formulation française en rend naturellement le sens militaire sans conserver un calque peu idiomatique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle en français moderne du nom divin יהוה, plutôt que substitution par un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la chaîne construite qui identifie Yahweh comme le Dieu d’Israël.
- source_word: סִיחוֹן
  choice: Sihôn
  rationale: Forme française traditionnelle et reconnaissable du nom propre.
- source_word: כָּל עַמּוֹ
  choice: tout son peuple
  rationale: עַם désigne directement le peuple de Sihôn; le contexte militaire n’exige pas de le réduire explicitement à son armée.
- source_word: וַיַּכּוּם
  choice: qui les battit
  rationale: Le verbe נכה décrit ici la défaite infligée au combat. Le singulier « Israël » comme sujet collectif est naturel en français, tandis que « les » reprend Sihôn et son peuple.
- source_word: וַיִּירַשׁ
  choice: prit possession de
  rationale: Dans ce contexte de conquête territoriale, ירש indique qu’Israël s’empare du territoire et l’occupe.
- source_word: כָּל אֶרֶץ הָאֱמֹרִי
  choice: tout le pays des Amorites
  rationale: Le singulier collectif hébreu « l’Amorite » se rend naturellement en français par le pluriel ethnonymique « les Amorites ».
- source_word: יוֹשֵׁב הָאָרֶץ הַהִיא
  choice: qui habitaient ce pays
  rationale: Le participe singulier s’accorde sémantiquement avec le nom collectif; le pluriel français reprend naturellement « les Amorites ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de le remplacer par un titre, sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et fluide. L’idiome hébreu de la « main » est explicité dans le corps du texte par « au pouvoir de ». Aucun appel de note n’est nécessaire.
