source:
  edition: WLC
  text: כִּ֖י בַּ/עֲלוֹתָ֣/ם מִ/מִּצְרָ֑יִם וַ/יֵּ֨לֶךְ יִשְׂרָאֵ֤ל בַּ/מִּדְבָּר֙ עַד יַם ס֔וּף וַ/יָּבֹ֖א קָדֵֽשָׁ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/016.yaml
  text: For when they came up from Egypt[a], Israel went through the wilderness as far as the Red Sea and came to Kadesh.
translation:
  language: fr
  text: Car, lorsqu’ils sont montés d’Égypte, Israël a marché dans le désert jusqu’à la mer Rouge[a], puis est arrivé à Qadesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mer des Roseaux ».
    reason: Le nom hébreu יַם סוּף peut être rendu littéralement par « mer des Roseaux », tandis que « mer Rouge » est son équivalent traditionnel.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’arrière-plan explicatif de l’argument historique de Jephté; « Car » conserve ce lien discursif.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: lorsqu’ils sont montés d’Égypte
  rationale: La préposition avec l’infinitif construit et le suffixe a une valeur temporelle. « Monter d’Égypte » reste proche de l’image hébraïque, sans remplacer le verbe par le plus interprétatif « sortir ».
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: Israël a marché dans le désert
  rationale: Le verbe הלך exprime le déplacement; « a marché dans » rend naturellement le trajet tout en évitant de préciser davantage que l’hébreu si Israël a traversé tout le désert.
- source_word: עַד יַם סוּף
  choice: jusqu’à la mer Rouge
  rationale: עַד marque la limite atteinte. « Mer Rouge » est l’appellation française traditionnelle et immédiatement reconnaissable; la traduction lexicale possible « mer des Roseaux » est signalée en note.
- source_word: וַיָּבֹא קָדֵשָׁה
  choice: puis est arrivé à Qadesh
  rationale: בוא peut signifier venir ou arriver, et le hé directionnel indique un mouvement vers Qadesh. « Puis » exprime naturellement la succession portée par la forme narrative sans ajouter de rapport causal.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le nom collectif « Israël » est conservé comme dans l’hébreu; la reprise par « est arrivé » reste au singulier. La graphie « Qadesh » représente directement la consonne initiale hébraïque.
