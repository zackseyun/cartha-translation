source:
  edition: WLC
  text: וְ/לֹ֣א שָׁמַ֔ע מֶ֖לֶךְ בְּנֵ֣י עַמּ֑וֹן אֶל דִּבְרֵ֣י יִפְתָּ֔ח אֲשֶׁ֥ר שָׁלַ֖ח אֵלָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/028.yaml
  text: But the king of the Ammonites did not listen to the words of Jephthah that he sent to him.
translation:
  language: fr
  text: Mais le roi des Ammonites n’écouta pas les paroles de Jephté qu’il lui avait envoyées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: Mais … n’écouta pas
  rationale: Dans ce contexte, וְ marque le contraste avec le message précédent. « Écouter » conserve le sens possible de prêter attention et d’obéir.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: le roi des Ammonites
  rationale: Formulation française naturelle pour l’hébreu littéral « le roi des fils d’Ammon ».
- source_word: אֶל דִּבְרֵי יִפְתָּח
  choice: les paroles … de Jephté
  rationale: אֶל avec שׁמע désigne ce qui est écouté; les paroles sont attribuées à Jephté.
- source_word: אֲשֶׁר שָׁלַח אֵלָיו
  choice: que Jephté lui avait fait transmettre
  rationale: Le sujet sous-entendu de שָׁלַח est Jephté. Le plus-que-parfait exprime l’antériorité du message, et « faire transmettre » rend le fait qu’il avait envoyé ses paroles par des messagers.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le nom יפתח est rendu selon sa forme française usuelle « Jephté ». La formulation évite l’ambiguïté maladroite d’un pronom relatif dont l’antécédent pourrait sembler être « les paroles ».
