  text: וְ/לֹא הֶאֱמִ֨ין סִיח֤וֹן אֶת יִשְׂרָאֵל֙ עֲבֹ֣ר בִּ/גְבֻל֔/וֹ וַ/יֶּאֱסֹ֤ף סִיחוֹן֙ אֶת כָּל עַמּ֔/וֹ וַֽ/יַּחֲנ֖וּ בְּ/יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם עִם יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/020.yaml
  text: But Sihon did not trust Israel to pass through his territory[a]. So Sihon gathered all his people, and they camped at Jahaz[c][b], and he fought against Israel.
translation:
  language: fr
  text: Mais Sihôn ne fit pas confiance à Israël pour le laisser traverser son territoire[a]. Alors Sihôn rassembla tout son peuple[b]. Ils établirent leur camp à Yahats, et Sihôn combattit Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne crut pas Israël »; le sens peut aussi être développé ainsi : « ne fit pas suffisamment confiance à Israël pour le laisser traverser ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « tout son peuple », sans employer explicitement le mot « armée », bien que le contexte soit militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִין
  choice: ne fit pas confiance à
  rationale: Le hiphil de אמן exprime ici la confiance accordée à quelqu’un. Cette traduction conserve le motif du refus sans réduire le verbe au simple résultat « ne permit pas ».
- source_word: עֲבֹר בִּגְבֻלוֹ
  choice: pour le laisser traverser son territoire
  rationale: L’infinitif עבר avec גבול désigne le passage à travers le pays placé sous l’autorité de Sihôn. En français, « traverser son territoire » est plus naturel que « passer dans sa frontière »; « le laisser » explicite la construction française impliquée par la confiance accordée en vue du passage.
- source_word: וַיֶּאֱסֹף
  choice: rassembla
  rationale: Le verbe décrit le rassemblement du peuple en vue du combat sans introduire explicitement la notion d’armée.
- source_word: כָּל עַמּוֹ
  choice: tout son peuple
  rationale: La traduction garde la formulation large de l’hébreu, même si le contexte indique un rassemblement militaire.
- source_word: וַיַּחֲנוּ
  choice: Ils établirent leur camp
  rationale: Le pluriel renvoie au peuple rassemblé. Cette formulation française exprime clairement l’installation du camp.
- source_word: בְּיָהְצָה
  choice: à Yahats
  rationale: Translittération française courante du toponyme יָהְצָה; la préposition « à » convient à un lieu de campement.
- source_word: וַיִּלָּחֶם עִם יִשְׂרָאֵל
  choice: Sihôn combattit Israël
  rationale: Le verbe singulier ramène Sihôn comme sujet. En contexte hostile, « combattre Israël » rend naturellement l’expression hébraïque littéralement construite avec « avec », sans suggérer qu’il combattait à ses côtés.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique. La répétition de « Sihôn » dans la dernière proposition clarifie le changement du sujet grammatical pluriel au singulier.
