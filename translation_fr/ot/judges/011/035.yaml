    issue: La préposition « devant » dans l’expression « J’ai ouvert la bouche devant Yahvé » ne rend pas exactement אֶל (« à, vers »).
    rationale: Le texte hébreu présente l’ouverture de la bouche comme étant adressée à Yahvé. « Devant » peut évoquer sa présence, mais affaiblit l’orientation relationnelle de l’expression et n’est pas le correspondant le plus direct.
