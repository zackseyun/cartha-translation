  source_fidelity: 'Le sens général est fidèlement rendu : la détresse de Jephté, le geste de deuil, l’intensification de « tu m’as accablé », le trouble causé et l’impossibilité de se rétracter sont conservés. Toutefois, אֶל־יְהוָה signifie « à Yahvé / vers Yahvé », non simplement « devant Yahvé ».'
  naturalness: Le français est moderne, fluide et conserve un registre soutenu approprié au discours direct. « J’ai ouvert ma bouche à Yahvé » est un calque volontairement transparent, correctement explicité par la note.
  terminology: « Yahvé » est une forme française établie pour le Tétragramme. La note maintient avec justesse l’ambiguïté formelle de l’idiome tout en indiquant le sens contextuel du vœu.
