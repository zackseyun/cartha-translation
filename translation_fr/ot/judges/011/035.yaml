base_translation:
  language: en
  yaml_path: translation/ot/judges/011/035.yaml
  text: And when he saw her[a], he tore his clothes and said, “Alas, my daughter! You have brought me very low, and you have become the cause of my trouble. For I have opened my mouth to Yahweh, and I cannot turn back.”
translation:
  language: fr
  text: 'Quand il la vit, il déchira ses vêtements et dit : « Hélas, ma fille ! Tu m’as profondément abattu, et te voilà devenue la cause de mon malheur ! J’ai ouvert ma bouche à Yahvé[a], et je ne peux pas revenir en arrière. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « J’ai fait un vœu à Yahvé. » L’hébreu dit littéralement : « J’ai ouvert ma bouche à Yahvé. »'
    reason: Préciser le sens contextuel de l’idiome hébreu tout en conservant son image dans le texte principal.
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹתוֹ אוֹתָהּ
  choice: Quand il la vit
  rationale: La formule narrative וַיְהִי suivie de la proposition temporelle se rend naturellement en français par « Quand il la vit », sans le calque lourd « Il arriva que ».
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: il déchira ses vêtements
  rationale: Expression habituelle du deuil ou d’une profonde détresse ; « vêtements » est courant et conserve précisément le geste.
- source_word: אֲהָהּ בִּתִּי
  choice: Hélas, ma fille !
  rationale: « Hélas » restitue l’exclamation de douleur dans un registre digne, tandis que « ma fille » rend directement le vocatif.
- source_word: הַכְרֵעַ הִכְרַעְתִּנִי
  choice: Tu m’as profondément abattu
  rationale: L’infinitif absolu joint au verbe renforce l’idée d’abaissement. « Profondément abattu » exprime cette intensité en français naturel sans exagérer jusqu’à « tu m’as détruit ».
- source_word: וְאַתְּ הָיִיתְ בְּעֹכְרָי
  choice: et te voilà devenue la cause de mon malheur
  rationale: עכר évoque le fait d’attirer le trouble ou le malheur. Cette formulation française conserve la relation causale et l’irruption dramatique exprimée par le changement de situation.
- source_word: וְאָנֹכִי פָצִיתִי פִי אֶל־יְהוָה
  choice: J’ai ouvert la bouche devant Yahvé
  rationale: Le texte dit littéralement que Jephté a « ouvert [sa] bouche » à l’égard de Yahvé, idiome désignant ici son engagement solennel. L’image hébraïque est conservée, et son sens est précisé en note.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » représente le nom divin plutôt que de le remplacer par un titre.
- source_word: וְלֹא אוּכַל לָשׁוּב
  choice: et je ne peux pas revenir en arrière
  rationale: שוב signifie ici revenir sur la parole prononcée. « Revenir en arrière » garde l’image du texte tout en indiquant naturellement l’impossibilité de se rétracter.
theological_decisions:
- issue: Faut-il expliciter dans le corps du texte que Jephté parle de son vœu ?
  choice: Conserver l’expression « J’ai ouvert la bouche devant Yahvé » et préciser son sens en note.
  alternative: « J’ai fait un vœu à Yahvé » ou « J’ai donné ma parole à Yahvé ».
  rationale: Le contexte identifie clairement l’engagement comme un vœu, mais l’hébreu emploie une image solennelle. La conserver évite de remplacer inutilement la formulation du texte par son interprétation explicite.
- issue: Jusqu’où faire porter à la fille de Jephté la responsabilité de sa détresse ?
  choice: « Tu m’as profondément abattu » et « la cause de mon malheur ».
  alternative: « Tu m’as anéanti » ou « tu es devenue ma destructrice ».
  rationale: L’hébreu exprime une détresse extrême et présente la fille comme source de trouble pour son père, mais il ne faut pas renforcer cette parole jusqu’à en faire une condamnation morale explicite.
translation_notes:
  register: Français international actuel, digne et accessible. Le discours direct conserve la forte charge émotionnelle du verset sans archaïsmes inutiles. L’idiome hébreu central est maintenu dans le texte et éclairé par une note.
