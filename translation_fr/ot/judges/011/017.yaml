revisions:
- from: 'Alors Israël envoya des messagers au roi d’Édom pour lui dire : « Laisse-moi, je te prie, traverser ton pays[a]. » Mais le roi d’Édom ne l’écouta pas. Israël envoya aussi des messagers au roi de Moab, mais celui-ci ne voulut pas les laisser passer. Israël resta donc à Qadesh.'
  to: 'Alors Israël envoya des messagers au roi d’Édom pour lui dire : « Permets-moi, je te prie, de traverser ton pays[a]. » Mais le roi d’Édom ne l’écouta pas. Israël envoya aussi des messagers au roi de Moab, mais celui-ci n’y consentit pas. Israël resta donc à Qadesh.'
  rationale: La révision conserve le singulier collectif de la demande, signalé par la note, et remplace l’explicitation non exprimée du refus moabite par « n’y consentit pas », qui renvoie à la demande précédente sans ajouter les messagers comme objet grammatical. Elle améliore aussi légèrement l’idiome de la requête en français.
