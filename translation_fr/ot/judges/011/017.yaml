  text: וַ/יִּשְׁלַ֣ח יִשְׂרָאֵ֣ל מַלְאָכִ֣ים אֶל מֶלֶךְ֩ אֱד֨וֹם לֵ/אמֹ֜ר אֶעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ וְ/לֹ֤א שָׁמַע֙ מֶ֣לֶךְ אֱד֔וֹם וְ/גַ֨ם אֶל מֶ֧לֶךְ מוֹאָ֛ב שָׁלַ֖ח וְ/לֹ֣א אָבָ֑ה וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בְּ/קָדֵֽשׁ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/017.yaml
  text: Then Israel sent messengers to the king of Edom[a], saying, ‘Please let us pass through your land,’ but the king of Edom did not listen. And he also sent to the king of Moab, but he was unwilling[b], so Israel remained at Kadesh.
translation:
  language: fr
  text: 'Alors Israël envoya des messagers au roi d’Édom pour lui dire : « Permets-moi, je te prie, de traverser ton pays[a]. » Mais le roi d’Édom ne l’écouta pas. Israël envoya aussi des messagers au roi de Moab, mais celui-ci n’y consentit pas. Israël resta donc à Qadesh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie le singulier (« permets-moi »), car Israël parle ici collectivement comme une seule personne. On pourrait aussi traduire selon le sens : « Permets-nous de traverser ton pays. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le passé simple convient au récit historique et rend naturellement le wayyiqtol de שׁלח.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Le contexte diplomatique désigne des envoyés humains, et non des anges.
- source_word: לֵאמֹר
  choice: pour lui dire
  rationale: Cette formulation introduit naturellement le discours direct en français tout en rendant la fonction de l’infinitif hébreu.
- source_word: אֶעְבְּרָה נָּא
  choice: Laisse-moi, je te prie, traverser
  rationale: Le singulier conserve la représentation collective d’Israël comme une seule personne; « je te prie » exprime la nuance polie du cohortatif accompagné de נָא.
- source_word: בְאַרְצֶךָ
  choice: traverser ton pays
  rationale: Avec עבר dans un contexte de déplacement, le français exprime naturellement le passage par le verbe « traverser ».
- source_word: וְלֹא שָׁמַע
  choice: ne l’écouta pas
  rationale: שׁמע signifie ici écouter favorablement ou donner suite, plutôt que simplement percevoir un son.
- source_word: וְגַם אֶל מֶלֶךְ מוֹאָב שָׁלַח
  choice: Israël envoya aussi des messagers au roi de Moab
  rationale: La répétition explicite du sujet et de l’objet évite en français que le pronom soit compris comme renvoyant au roi d’Édom; ces éléments sont clairement repris du contexte.
- source_word: וְלֹא אָבָה
  choice: mais celui-ci ne voulut pas les laisser passer
  rationale: אָבָה exprime l’absence de volonté ou de consentement. Le complément explicité en français découle de la demande précédente sans durcir le verbe en « refusa ».
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: Dans ce récit de voyage, « resta » indique le maintien sur place sans suggérer une installation permanente.
- source_word: בְּקָדֵשׁ
  choice: à Qadesh
  rationale: « À » est la préposition française naturelle devant ce lieu; la graphie « Qadesh » distingue la consonne hébraïque qof.
