  text: וַ/יֹּאמְרוּ֩ זִקְנֵ֨י גִלְעָ֜ד אֶל יִפְתָּ֗ח לָ/כֵן֙ עַתָּה֙ שַׁ֣בְנוּ אֵלֶ֔י/ךָ וְ/הָלַכְתָּ֣ עִמָּ֔/נוּ וְ/נִלְחַמְתָּ֖ בִּ/בְנֵ֣י עַמּ֑וֹן וְ/הָיִ֤יתָ לָּ֨/נוּ֙ לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/008.yaml
  text: And the elders of Gilead said to Jephthah[a], “That is why we have now come back to you, so that you may go with us and fight against the Ammonites[b], and you will be head over all the inhabitants of Gilead.”
translation:
  language: fr
  text: 'Les anciens de Galaad dirent à Jephté : « C’est pour cela que nous sommes maintenant revenus vers toi : tu iras avec nous, tu combattras les Ammonites[a] et tu seras notre chef, à la tête de tous les habitants de Galaad. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Ammon »; c’est-à-dire les Ammonites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי גִלְעָד
  choice: les anciens de Galaad
  rationale: « Anciens » conserve le titre social et politique des responsables reconnus de la communauté.
- source_word: לָכֵן עַתָּה
  choice: C’est justement pour cela que ... maintenant
  rationale: Cette formulation naturelle exprime à la fois le lien logique avec l’objection précédente de Jephté et l’immédiateté de la démarche.
- source_word: שַׁבְנוּ אֵלֶיךָ
  choice: nous sommes maintenant revenus vers toi
  rationale: Le verbe שׁוב signifie normalement « revenir »; la traduction préserve ici l’idée d’un retour auprès de Jephté après son exclusion.
- source_word: וְהָלַכְתָּ עִמָּנוּ
  choice: tu iras avec nous
  rationale: Le futur français rend naturellement la forme verbale coordonnée et reste proche du sens de הלך, « aller ».
- source_word: וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן
  choice: tu combattras les Ammonites
  rationale: « Ammonites » est l’ethnonyme français courant correspondant à l’expression hébraïque littérale « fils d’Ammon ».
- source_word: וְהָיִיתָ לָּנוּ לְרֹאשׁ
  choice: tu seras notre chef
  rationale: רֹאשׁ, littéralement « tête », désigne ici l’autorité dirigeante; « chef » restitue clairement cette fonction en français actuel.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: celui de tous les habitants de Galaad
  rationale: La reprise « celui de » rattache sans ambiguïté l’autorité de Jephté à l’ensemble de la population de Galaad.
theological_decisions:
- issue: Étendue de l’autorité promise à Jephté
  choice: Les anciens lui promettent une autorité sur tous les habitants de Galaad, et non seulement le commandement pendant la bataille.
  alternative: La promesse ne concernerait qu’un commandement militaire temporaire.
  rationale: La proposition « tu seras notre chef, celui de tous les habitants de Galaad » élargit explicitement la fonction au-delà du combat immédiat, sans lui attribuer une catégorie institutionnelle ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe coordonnée de l’hébreu est conservée sans lourdeur; « chef » rend naturellement la métaphore hébraïque de la « tête ».
