  text: וַ/יֹּאמְר֣וּ לְ/יִפְתָּ֔ח לְכָ֕/ה וְ/הָיִ֥יתָה לָּ֖/נוּ לְ/קָצִ֑ין וְ/נִֽלָּחֲמָ֖ה בִּ/בְנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/006.yaml
  text: And they said to Jephthah[a], “Come and be our commander, and let us fight against the Ammonites.”
translation:
  language: fr
  text: 'Ils dirent à Jephté : « Viens, sois notre commandant, et combattons les Ammonites[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Ammon », désignation habituelle des Ammonites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils dirent
  rationale: Le wayyiqtol de אמר poursuit la séquence narrative. Le passé simple convient au registre narratif biblique tout en restant clair en français moderne.
- source_word: לְיִפְתָּח
  choice: à Jephté
  rationale: Le nom propre יִפְתָּח est rendu selon sa forme française traditionnelle et largement reconnue, « Jephté ».
- source_word: לְכָה
  choice: Viens
  rationale: Dans cette interpellation, l’impératif de הלך constitue une invitation pressante à rejoindre ceux qui parlent ; « Viens » en rend naturellement la valeur.
- source_word: וְהָיִיתָה לָּנוּ
  choice: sois notre
  rationale: Littéralement « sois pour nous » ; la tournure possessive est l’équivalent idiomatique français sans perte de sens.
- source_word: לְקָצִין
  choice: commandant
  rationale: קָצִין désigne ici un chef investi d’un rôle militaire, comme l’indique le combat immédiatement évoqué. « Commandant » exprime cette fonction sans lui attribuer un titre politique plus large.
- source_word: וְנִלָּחֲמָה
  choice: et combattons
  rationale: La forme cohortative à la première personne du pluriel appelle à l’action commune. « Et combattons » conserve directement cette force sans transformer explicitement la coordination en proposition de but.
- source_word: בִּבְנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Avec לחם, la préposition ב marque l’adversaire. « Les Ammonites » est la désignation ethnique française naturelle correspondant à l’expression littérale « les fils d’Ammon ».
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. La coordination de l’hébreu et la valeur exhortative du cohortatif sont conservées. Le marqueur de note est placé après « Ammonites », terme auquel la note se rapporte.
