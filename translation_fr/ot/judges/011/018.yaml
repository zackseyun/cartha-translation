  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ בַּ/מִּדְבָּ֗ר וַ/יָּ֜סָב אֶת אֶ֤רֶץ אֱדוֹם֙ וְ/אֶת אֶ֣רֶץ מוֹאָ֔ב וַ/יָּבֹ֤א מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ לְ/אֶ֣רֶץ מוֹאָ֔ב וַֽ/יַּחֲנ֖וּ/ן בְּ/עֵ֣בֶר אַרְנ֑וֹן וְ/לֹא בָ֨אוּ֙ בִּ/גְב֣וּל מוֹאָ֔ב כִּ֥י אַרְנ֖וֹן גְּב֥וּל מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/018.yaml
  text: Then he went through the wilderness and went around the land of Edom and the land of Moab[a], and came to the east side of the land of Moab, and they camped beyond the Arnon; but they did not enter the territory of Moab[b], for the Arnon was the border of Moab.
translation:
  language: fr
  text: Puis il traversa le désert, contourna le pays d’Édom et le pays de Moab, et arriva à l’est du pays de Moab[a]. Ils campèrent au-delà de l’Arnon[b], mais ils n’entrèrent pas sur le territoire de Moab, car l’Arnon était la frontière de Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « arriva depuis le levant du soleil au pays de Moab »; cette expression indique ici qu’il aborda Moab par l’est.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de l’autre côté de l’Arnon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בַּמִּדְבָּר
  choice: il traversa le désert
  rationale: Le verbe הלך signifie fondamentalement « aller, marcher ». Avec בַּמִּדְבָּר dans ce récit d’itinéraire, « traversa le désert » exprime naturellement le déplacement sans préciser indûment la nature du terrain.
- source_word: וַיָּסָב
  choice: contourna
  rationale: Le verbe סבב décrit ici un itinéraire qui passe autour des territoires d’Édom et de Moab plutôt que de les traverser. « Contourna » est précis et naturel en français actuel.
- source_word: אֶרֶץ אֱדוֹם / אֶרֶץ מוֹאָב
  choice: le pays d’Édom / le pays de Moab
  rationale: אֶרֶץ peut désigner un pays, une terre ou un territoire. « Pays » convient à ces entités géographiques et politiques, tandis que « territoire » est retenu plus loin pour le sens contextuel de גְּבוּל.
- source_word: וַיָּבֹא מִמִּזְרַח שֶׁמֶשׁ לְאֶרֶץ מוֹאָב
  choice: arriva à l’est du pays de Moab
  rationale: L’expression « depuis le levant du soleil » situe l’approche du côté oriental. La formulation française rend clairement cette donnée géographique tout en signalant la tournure littérale en note.
- source_word: וַיַּחֲנוּן
  choice: ils campèrent
  rationale: חנה signifie « camper ». Le pluriel hébreu marque un passage du collectif singulier à la pluralité des Israélites; ce changement est conservé.
- source_word: בְּעֵבֶר אַרְנוֹן
  choice: au-delà de l’Arnon
  rationale: עֵבֶר désigne le côté opposé ou l’autre côté d’un repère. « Au-delà de l’Arnon » préserve la perspective relative sans imposer une orientation géographique plus précise.
- source_word: וְלֹא בָאוּ בִּגְבוּל מוֹאָב
  choice: ils n’entrèrent pas sur le territoire de Moab
  rationale: Dans cette construction, גְּבוּל ne désigne pas seulement la ligne frontalière, mais l’espace délimité. « Entrer sur le territoire » restitue le sens concret en français idiomatique.
- source_word: כִּי אַרְנוֹן גְּבוּל מוֹאָב
  choice: car l’Arnon était la frontière de Moab
  rationale: La proposition nominale explique pourquoi Israël ne pénétra pas en Moab. « Frontière » convient ici à l’Arnon comme limite géographique.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le changement du singulier « il », qui représente collectivement Israël, au pluriel « ils » est conservé conformément à l’hébreu. Les répétitions géographiques sont maintenues pour préserver la logique de l’itinéraire.
