  text: וַ/יַּעֲבֹ֥ר יִפְתָּ֛ח אֶל בְּנֵ֥י עַמּ֖וֹן לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/032.yaml
  text: So Jephthah crossed over to the Ammonites to fight against them[a], and Yahweh gave them into his hand.
translation:
  language: fr
  text: Alors Jephté se rendit auprès des Ammonites pour les combattre, et Yahweh les livra entre ses mains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: passa
  rationale: Le verbe עבר exprime le fait de passer ou de traverser. « Passa » conserve ce mouvement sans ajouter l’idée plus interprétative d’une avancée militaire.
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: chez les Ammonites
  rationale: אֶל indique le mouvement vers eux, et בְּנֵי עַמּוֹן est l’appellation ethnique idiomatiquement rendue par « les Ammonites ». « Chez » exprime naturellement en français le déplacement vers leur territoire ou leur position.
- source_word: לְהִלָּחֶם בָּם
  choice: pour les combattre
  rationale: Le niphal de לחם suivi de ב exprime l’engagement dans le combat contre quelqu’un. Cette formulation est naturelle et fidèle au contexte militaire.
- source_word: וַיִּתְּנֵם
  choice: les livra
  rationale: Dans la construction נתן avec « entre les mains », « livrer » rend clairement l’idée de remettre l’ennemi au pouvoir du vainqueur, sans devoir reproduire le peu naturel « donna ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: בְּיָדוֹ
  choice: entre ses mains
  rationale: L’expression française « livrer entre les mains de quelqu’un » conserve l’image sémitique tout en étant idiomatique. Le singulier hébreu peut naturellement être rendu par le pluriel lexicalisé français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » en préserve le statut de nom propre sans lui substituer un titre.
- issue: Agent de la victoire
  choice: Yahweh les livra entre ses mains
  alternative: Jephté les vainquit
  rationale: 'La formulation maintient l’affirmation théologique explicite du texte : l’issue du combat est attribuée à Yahweh, et non seulement à l’action militaire de Jephté.'
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve le mouvement concret de Jephté et l’image biblique de l’ennemi livré entre les mains du vainqueur, tout en évitant un calque peu naturel.
