  text: וְ/עַתָּ֗ה הֲ/ט֥וֹב טוֹב֙ אַתָּ֔ה מִ/בָּלָ֥ק בֶּן צִפּ֖וֹר מֶ֣לֶךְ מוֹאָ֑ב הֲ/ר֥וֹב רָב֙ עִם יִשְׂרָאֵ֔ל אִם נִלְחֹ֥ם נִלְחַ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/025.yaml
  text: And now[a], are you really better than Balak son of Zippor, king of Moab? Did he ever contend with Israel[b], or did he ever fight against them?
translation:
  language: fr
  text: Et maintenant, es-tu vraiment meilleur que Balak, fils de Tsippor, roi de Moab ? A-t-il jamais eu un différend avec Israël[a] ou lui a-t-il jamais fait la guerre ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « A-t-il jamais contesté Israël ou l’a-t-il jamais combattu ? » Le premier verbe peut désigner un différend, une contestation ou une querelle, tandis que le second désigne le combat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec l’argument précédent et la transition vers le défi rhétorique de Jephté.
- source_word: הֲטוֹב טוֹב אַתָּה
  choice: es-tu vraiment meilleur
  rationale: L’adverbe « vraiment » rend naturellement l’intensification produite en hébreu par la répétition de טוֹב dans cette question rhétorique.
- source_word: מִבָּלָק בֶּן־צִפּוֹר מֶלֶךְ מוֹאָב
  choice: que Balak, fils de Tsippor, roi de Moab
  rationale: Rend directement la comparaison et la chaîne de titres, avec une translittération française usuelle du nom צִפּוֹר.
- source_word: הֲרֹב רָב עִם יִשְׂרָאֵל
  choice: A-t-il jamais engagé une querelle avec Israël
  rationale: « Engager une querelle » préserve la portée large de ריב, qui peut désigner une contestation, un différend ou une querelle, sans le réduire d’emblée au combat militaire exprimé ensuite.
- source_word: אִם
  choice: ou
  rationale: Dans cette double interrogation rhétorique, אִם introduit le second terme de l’alternative.
- source_word: נִלְחֹם נִלְחַם בָּם
  choice: ou lui a-t-il jamais fait la guerre
  rationale: « Faire la guerre » distingue clairement לחם de la contestation plus large exprimée par ריב. Le singulier « lui » reprend naturellement le collectif Israël en français.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La formulation conserve le ton incisif des questions rhétoriques et distingue la contestation de la guerre. Le marqueur [a] figure dans le texte principal.
