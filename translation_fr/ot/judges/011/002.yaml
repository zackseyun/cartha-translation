base_translation:
  language: en
  yaml_path: translation/ot/judges/011/002.yaml
  text: And Gilead’s wife bore him sons. When the sons of the wife grew up, they drove Jephthah out and said to him, “You will not have an inheritance in our father’s house, for you are the son of another woman.”
translation:
  language: fr
  text: 'La femme de Galaad lui donna des fils. Quand les fils de cette femme eurent grandi, ils chassèrent Jephté et lui dirent : « Tu n’auras pas d’héritage dans la maison de notre père, car tu es le fils d’une autre femme. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת גִּלְעָד
  choice: la femme de Galaad
  rationale: Rend formellement le statut de l’épouse, en contraste avec « une autre femme » à la fin du verset.
- source_word: בְנֵי הָאִשָּׁה
  choice: les fils de cette femme
  rationale: Préserve l’expression marquée « les fils de la femme » tout en employant un démonstratif naturel en français pour renvoyer à la femme de Galaad qui vient d’être mentionnée.
- source_word: לֹא תִנְחַל
  choice: tu n’auras pas de part d’héritage
  rationale: Exprime clairement l’exclusion de Jephté de l’héritage familial sans réduire le verbe à une simple action ponctuelle.
- source_word: בְּבֵית אָבִינוּ
  choice: dans la maison de notre père
  rationale: Conserve l’image de la « maison » au sens de maisonnée ou lignée familiale, pertinente dans le contexte de l’héritage.
theological_decisions:
- issue: Statut de la mère de Jephté et légitimité de son exclusion
  choice: Conserver le contraste entre « la femme de Galaad » et « une autre femme » sans préciser davantage le statut juridique ou matrimonial de cette dernière.
  alternative: Traduire ou expliciter « une femme étrangère », « une concubine » ou « une prostituée ».
  rationale: Le verset dit seulement אִשָּׁה אַחֶרֶת, « une autre femme ». Une précision supplémentaire résoudrait une ambiguïté que le texte ne tranche pas ici.
translation_notes:
  register: Français moderne, narratif et digne. « Donner des fils » est retenu comme tournure française naturelle pour l’hébreu « enfanter pour lui ». « Furent devenus grands » rend la maturité atteinte avant l’expulsion, et « part d’héritage » clarifie le contexte successoral.
