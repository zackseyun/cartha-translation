base_translation:
  language: en
  yaml_path: translation/ot/judges/011/038.yaml
  text: And he said[a], “Go.” So he sent her away for two months, and she went, she and her companions, and wept over her virginity on the mountains.
translation:
  language: fr
  text: 'Il dit : « Va. » Puis il la laissa partir pour deux mois. Elle s’en alla, elle et ses compagnes, et pleura sur sa virginité[a] dans les montagnes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause de sa virginité » ou « au sujet de sa virginité ». L’hébreu précise que sa virginité est l’objet de sa lamentation, sans résoudre à lui seul le sens du récit plus large.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵכִי
  choice: Va
  rationale: Impératif féminin singulier de הלך ; la forme brève et directe correspond naturellement au français.
- source_word: וַיִּשְׁלַח אוֹתָהּ
  choice: Il la laissa donc partir
  rationale: Dans ce contexte, שׁלח avec un complément direct exprime l’autorisation donnée de partir ; cette formulation évite de suggérer un rejet.
- source_word: שְׁנֵי חֳדָשִׁים
  choice: pour deux mois
  rationale: Le groupe nominal indique la durée de l’absence accordée.
- source_word: וַתֵּלֶךְ הִיא וְרֵעוֹתֶיהָ
  choice: Elle s’en alla avec ses compagnes
  rationale: Cette tournure française naturelle rend le départ de la jeune femme en compagnie de ses associées, sans lourdeur artificielle.
- source_word: רֵעוֹתֶיהָ
  choice: ses compagnes
  rationale: Le féminin pluriel désigne les femmes qui l’accompagnent ; « compagnes » convient au registre narratif sans présumer le degré exact d’amitié.
- source_word: וַתֵּבְךְּ
  choice: pleura
  rationale: בכה désigne l’action de pleurer ; le passé simple maintient le ton narratif et solennel.
- source_word: עַל בְּתוּלֶיהָ
  choice: pleura sa virginité
  rationale: Le premier עַל introduit l’objet de sa lamentation. Cette formulation française conserve l’accent explicite du texte sur sa virginité sans trancher le débat interprétatif plus large.
- source_word: עַל הֶהָרִים
  choice: dans les montagnes
  rationale: Le second עַל situe la scène sur le relief montagneux ; « dans les montagnes » est plus idiomatique en français courant tout en conservant le cadre spatial.
theological_decisions:
- issue: Sens de la lamentation de la fille de Jephté sur sa virginité
  choice: Le texte principal maintient que sa lamentation porte sur sa virginité, sans préciser davantage les conséquences du vœu.
  alternative: Préciser qu’elle pleure soit sa mort prochaine comme victime sacrifiée, soit une vie de virginité et de privation de descendance.
  rationale: Le verset nomme explicitement sa virginité comme objet de lamentation, mais ne résout pas à lui seul le débat concernant un sacrifice humain, une virginité perpétuelle ou le rapport entre les deux. La traduction préserve donc cette tension.
translation_notes:
  register: 'Français international moderne, naturel et digne. Le passé simple convient à la narration biblique écrite sans employer un vocabulaire archaïque. Aucune note n’est nécessaire ici : « pleura sa virginité » rend directement l’expression hébraïque et ses principales nuances françaises ne constituent pas des variantes textuelles.'
