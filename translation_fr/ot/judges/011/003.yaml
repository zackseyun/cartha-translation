  text: וַ/יִּבְרַ֤ח יִפְתָּח֙ מִ/פְּנֵ֣י אֶחָ֔י/ו וַ/יֵּ֖שֶׁב בְּ/אֶ֣רֶץ ט֑וֹב וַ/יִּֽתְלַקְּט֤וּ אֶל יִפְתָּח֙ אֲנָשִׁ֣ים רֵיקִ֔ים וַ/יֵּצְא֖וּ עִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/003.yaml
  text: So Jephthah fled from his brothers and lived in the land of Tob[a], and worthless men gathered around Jephthah and went out with him.
translation:
  language: fr
  text: Jephté s’enfuit loin de ses frères et habita dans le pays de Tob. Des hommes de rien[a] se rassemblèrent auprès de lui et sortirent avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « des hommes vides » : cette expression hébraïque désigne des hommes méprisés, de basse condition ou de réputation douteuse, et non simplement des hommes sans biens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: s’enfuit
  rationale: Le verbe exprime la fuite devant une hostilité ou un danger; « s’enfuit » convient naturellement au récit.
- source_word: מִפְּנֵי אֶחָיו
  choice: loin de ses frères
  rationale: La locution marque ici l’éloignement causé par l’hostilité de ses frères. « Loin de » rend ce mouvement sans reproduire littéralement « de devant ».
- source_word: וַיֵּשֶׁב
  choice: habita
  rationale: Dans ce contexte, le verbe désigne le fait de résider dans un lieu, sans qu’il soit nécessaire d’affirmer une installation définitive.
- source_word: בְּאֶרֶץ טוֹב
  choice: dans le pays de Tob
  rationale: « Pays » rend naturellement אֶרֶץ, et Tob est conservé comme nom de lieu.
- source_word: וַיִּתְלַקְּטוּ אֶל יִפְתָּח
  choice: se rassemblèrent auprès de lui
  rationale: La forme verbale indique que ces hommes se réunissent eux-mêmes et entrent dans l’entourage de Jephté; « auprès de lui » reste proche de la préposition sans préciser davantage leur organisation.
- source_word: אֲנָשִׁים רֵיקִים
  choice: des hommes de rien
  rationale: L’expression française conserve l’image idiomatique de « vide » tout en évoquant des hommes méprisés, de basse condition ou de réputation douteuse, sans les qualifier explicitement de criminels.
- source_word: וַיֵּצְאוּ עִמּוֹ
  choice: sortirent avec lui
  rationale: Cette traduction garde l’indétermination de l’hébreu sur la nature et le but de leurs sorties, sans introduire l’idée non explicite de raids ou d’expéditions.
theological_decisions: []
translation_notes:
  register: Français international actuel, au registre narratif digne. « Hommes de rien » est volontairement conservé comme expression imagée et expliqué en note; « sortirent avec lui » préserve l’ambiguïté du texte quant à leurs activités.
