  register: Français international moderne, clair et digne. La longue proposition hébraïque est répartie en deux phrases pour préserver la force de la question rhétorique sans alourdir la syntaxe. Les noms Heshbon, Aroër et Arnon sont conservés sous des formes françaises reconnaissables.
