  text: בְּ/שֶׁ֣בֶת יִ֠שְׂרָאֵל בְּ/חֶשְׁבּ֨וֹן וּ/בִ/בְנוֹתֶ֜י/הָ וּ/בְ/עַרְע֣וֹר וּ/בִ/בְנוֹתֶ֗י/הָ וּ/בְ/כָל הֶֽ/עָרִים֙ אֲשֶׁר֙ עַל יְדֵ֣י אַרְנ֔וֹן שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וּ/מַדּ֥וּעַ לֹֽא הִצַּלְתֶּ֖ם בָּ/עֵ֥ת הַ/הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/026.yaml
  text: While Israel has lived in Heshbon and its daughter towns[a], and in Aroer and its daughter towns, and in all the cities that are along the Arnon, for three hundred years[b], why did you not recover them during that time?
translation:
  language: fr
  text: 'Voilà trois cents ans qu’Israël habite à Hesbon et dans les localités qui en dépendent[a], à Aroër et dans les localités qui en dépendent, ainsi que dans toutes les villes situées le long de l’Arnon : pourquoi ne les avez-vous pas reprises[b] pendant tout ce temps ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « ses filles » : les petites localités rattachées à une ville principale.'
    reason: cultural_note
  - marker: b
    text: Ou « délivrées » ou « arrachées » ; dans ce contexte, il s’agit de reprendre le territoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁבֶת יִשְׂרָאֵל ... שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: Cela fait trois cents ans qu’Israël habite
  rationale: La préposition ב avec l’infinitif construit de ישׁב introduit une circonstance temporelle, tandis que « trois cents ans » en précise la durée. Cette tournure française rend naturellement l’occupation prolongée qui fonde la question rhétorique.
- source_word: בְּנוֹתֶיהָ
  choice: les localités qui en dépendent
  rationale: Le mot signifie littéralement « ses filles » et désigne ici les petites localités rattachées à une ville principale. La formulation retenue exprime clairement cette relation en français courant, tandis que la note conserve l’image hébraïque.
- source_word: עַרְעוֹר
  choice: Aroër
  rationale: Transcription française usuelle du nom de lieu, avec tréma pour marquer la séparation des voyelles.
- source_word: עַל יְדֵי אַרְנוֹן
  choice: le long de l’Arnon
  rationale: L’expression signifie « à côté de, auprès de » ; dans le cas de plusieurs villes, « le long de l’Arnon » est précis et naturel.
- source_word: הִצַּלְתֶּם
  choice: ne les avez-vous pas reprises
  rationale: Le hiphil de נצל signifie normalement « délivrer, arracher, sauver ». Dans cette contestation territoriale, il s’agit de reprendre les villes ou le territoire revendiqués. Le pronom « les » reprend naturellement les villes mentionnées.
- source_word: בָּעֵת הַהִיא
  choice: pendant tout ce temps
  rationale: L’expression renvoie ici à la période de trois cents ans. « Pendant tout ce temps » rend ce rapport temporel de façon idiomatique et souligne la longue absence de revendication.
theological_decisions: []
