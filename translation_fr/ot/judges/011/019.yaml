revisions:
- from: 'Alors Israël envoya des messagers[b] à Sihôn, roi des Amorites, roi de Heshbon. Israël lui dit : « Permets-nous, s’il te plaît, de traverser ton pays pour aller jusqu’à mon territoire[a]. »'
  to: 'Alors Israël envoya des messagers[b] à Sihôn, roi des Amorites, roi de Heshbôn. Israël lui dit : « Permets-nous, s’il te plaît, de traverser ton pays jusqu’à mon lieu[a]. »'
  rationale: La révision rend מְקוֹמִי par « mon lieu », afin de ne pas imposer le sens plus spécifique de « territoire », et remplace une note textuellement imprécise par une explication grammaticale sobre du singulier collectif. La graphie de Heshbôn est également harmonisée avec celle de Sihôn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:39:00Z'
review_pass:
  verdict: revise
  source_fidelity: Le texte hébreu dit explicitement « jusqu’à mon lieu » (עַד־מְקוֹמִי), avec un possessif singulier après le cohortatif pluriel « passons / laisse-nous passer ». « Mon territoire » interprète trop étroitement מָקוֹם, qui signifie d’abord « lieu, endroit ». La répétition d’Israël et les deux titres de Sihôn sont bien conservés.
  naturalness: La formulation est globalement naturelle et de registre narratif soutenu. « Jusqu’à mon lieu » est un peu littéraire, mais reste compréhensible et permet de conserver sans paraphrase le singulier surprenant du texte. Les noms sont harmonisés selon une translittération française avec accent circonflexe.
  terminology: « Messagers », « roi des Amorites », « pays » et « traverser » conviennent au contexte diplomatique. La note doit décrire le singulier comme un effet de la personnification collective d’Israël, sans évoquer de manière imprécise de supposés témoins pluriels.
  issues:
  - severity: medium
    issue: « mon territoire » pour מְקוֹמִי
    rationale: « Territoire » restreint le sens de « lieu/endroit » et peut suggérer une désignation géopolitique absente du mot hébreu. Une traduction plus littérale préserve mieux l’ambiguïté.
  - severity: medium
    issue: 'Note a : mention de « certains témoins » et d’un pluriel'
    rationale: La note introduit une affirmation textuelle imprécise et inutile. Le texte massorétique porte le singulier; le pluriel relève d’une explicitation interprétative, non d’une ambiguïté textuelle à attribuer vaguement à des témoins.
  - severity: low
    issue: Graphie non harmonisée de Heshbon
    rationale: Si la translittération française « Sihôn » est retenue, « Heshbôn » assure une présentation cohérente des noms.
