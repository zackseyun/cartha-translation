source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיח֥וֹן מֶֽלֶךְ הָ/אֱמֹרִ֖י מֶ֣לֶךְ חֶשְׁבּ֑וֹן וַ/יֹּ֤אמֶר ל/וֹ֙ יִשְׂרָאֵ֔ל נַעְבְּרָה נָּ֥א בְ/אַרְצְ/ךָ֖ עַד מְקוֹמִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/019.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], king of Heshbon, and Israel said to him[b], “Please let us pass through your land to our place.”
translation:
  language: fr
  text: 'Alors Israël envoya des messagers[b] à Sihôn, roi des Amorites, roi de Heshbôn. Israël lui dit : « Permets-nous, s’il te plaît, de traverser ton pays jusqu’à mon lieu[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « jusqu’à mon lieu ». Bien que la demande soit formulée au pluriel (« Permets-nous »), Israël parle ici comme une collectivité au singulier. Voir la demande parallèle en Nombres 21.22.
    reason: grammatical_clarification_and_cross_reference
  - marker: b
    text: Ou « des envoyés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le wayyiqtol de שׁלח fait progresser le récit; « envoya » est l’équivalent narratif français naturel.
- source_word: מַלְאָכִים
  choice: messagers
  rationale: Dans ce contexte diplomatique, le terme désigne des représentants humains; « messagers » reste clair et fidèle, tandis que « envoyés » est également possible.
- source_word: סִיחוֹן
  choice: Sihôn
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: roi des Amorites
  rationale: Cette formulation conserve explicitement la désignation ethnique du texte hébreu.
- source_word: מֶלֶךְ חֶשְׁבּוֹן
  choice: roi de Heshbon
  rationale: Le second titre apposé est conservé afin d’identifier le royaume de Sihôn.
- source_word: וַיֹּאמֶר לוֹ יִשְׂרָאֵל
  choice: Israël lui dit
  rationale: Le nom « Israël », répété explicitement en hébreu, est maintenu plutôt que remplacé par un simple pronom.
- source_word: נַעְבְּרָה נָּא
  choice: Permets-nous, s’il te plaît, de traverser
  rationale: Le cohortatif accompagné de נָא exprime une demande polie; cette tournure française en rend naturellement la force.
- source_word: בְאַרְצְךָ
  choice: ton pays
  rationale: Avec le verbe « traverser », « ton pays » exprime naturellement le passage à travers le territoire de Sihôn.
- source_word: עַד מְקוֹמִי
  choice: pour aller jusqu’à mon territoire
  rationale: Le suffixe hébreu est bien à la première personne du singulier (« mon »). « Territoire » exprime ici le lieu ou domaine de destination sans harmoniser le singulier avec le « nous » précédent.
theological_decisions:
- issue: Alternance entre le pluriel de la demande et le singulier possessif final
  choice: Conserver « nous » puis « mon territoire »
  alternative: « notre territoire »
  rationale: Le texte hébreu passe du cohortatif pluriel נַעְבְּרָה au suffixe singulier de מְקוֹמִי. La traduction préserve cette tension grammaticale, Israël pouvant parler comme une collectivité personnifiée.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition d’« Israël » ainsi que les deux titres de Sihôn sont conservés. La ponctuation française clarifie l’apposition sans alléger le contenu de l’hébreu.
