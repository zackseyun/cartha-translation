source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ לֹֽא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֞ה עֹשֶׂ֥ה אִתִּ֛/י רָעָ֖ה לְ/הִלָּ֣חֶם בִּ֑/י יִשְׁפֹּ֨ט יְהוָ֤ה הַ/שֹּׁפֵט֙ הַ/יּ֔וֹם בֵּ֚ין בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בֵ֖ין בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/027.yaml
  text: I have not sinned against you[a], but you are doing me wrong by making war against me. May Yahweh, the Judge, judge today between the sons of Israel and the sons of Ammon.
translation:
  language: fr
  text: Je n’ai pas péché contre toi, mais toi, tu me fais du tort en me faisant la guerre. Que Yahweh, le Juge, juge aujourd’hui entre les fils d’Israël et les fils d’Ammon[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « entre les Israélites et les Ammonites ». Littéralement : « entre les fils d’Israël et les fils d’Ammon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: je n’ai pas péché
  rationale: Le verbe חטא signifie couramment « pécher » ou « commettre une faute ». Dans ce contexte diplomatique et judiciaire, « péché » conserve la portée morale de l’hébreu, tandis que la proposition suivante exprime explicitement le tort commis.
- source_word: לָךְ
  choice: contre toi
  rationale: Avec חטא, la préposition ל marque ici la personne envers laquelle la faute aurait été commise ; « pécher contre » est idiomatique en français.
- source_word: עֹשֶׂה אִתִּי רָעָה
  choice: tu me fais du tort
  rationale: Cette formulation naturelle restitue l’idée de faire du mal à quelqu’un et convient au cadre d’un grief juridique, sans affaiblir l’accusation.
- source_word: לְהִלָּחֶם בִּי
  choice: en me faisant la guerre
  rationale: L’infinitif précise la manière dont le tort est commis. « Faire la guerre à » correspond au conflit entre les deux peuples et reprend naturellement le pronom par « me ».
- source_word: יִשְׁפֹּט ... הַשֹּׁפֵט
  choice: Que ... le Juge, juge
  rationale: La répétition de la racine שׁפט est conservée. La tournure « Que ... juge » rend la valeur d’appel ou de souhait du verbe, et « le Juge » maintient le titre participial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de rendre directement le tétragramme plutôt que de lui substituer un titre.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent français actuel et direct, qui garde l’immédiateté de l’appel au jugement.
- source_word: בֵּין בְּנֵי יִשְׂרָאֵל וּבֵין בְּנֵי עַמּוֹן
  choice: entre les fils d’Israël et les fils d’Ammon
  rationale: La traduction conserve l’expression collective littérale « fils de », ainsi que le parallélisme entre Israël et Ammon ; une formulation ethnique plus naturelle est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le préserve comme nom propre sans le remplacer par un titre.
- issue: Expression collective masculine בְּנֵי
  choice: les fils d’Israël ... les fils d’Ammon
  alternative: les Israélites ... les Ammonites ; le peuple d’Israël ... le peuple d’Ammon
  rationale: Le texte hébreu emploie deux expressions collectives parallèles signifiant littéralement « fils de ». Le corps du texte garde cette forme, tandis que la note indique l’équivalent ethnique naturel.
translation_notes:
  register: Français international moderne, digne et accessible. Le contraste emphatique entre « moi » et « toi » est rendu par « mais toi ». La répétition « le Juge, juge » est volontaire, car elle reproduit un effet rhétorique de l’hébreu.
