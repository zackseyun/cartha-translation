  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ לְ/זִקְנֵ֣י גִלְעָ֔ד הֲ/לֹ֤א אַתֶּם֙ שְׂנֵאתֶ֣ם אוֹתִ֔/י וַ/תְּגָרְשׁ֖וּ/נִי מִ/בֵּ֣ית אָבִ֑/י וּ/מַדּ֜וּעַ בָּאתֶ֤ם אֵלַ/י֙ עַ֔תָּה כַּ/אֲשֶׁ֖ר צַ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/007.yaml
  text: Jephthah said to the elders of Gilead[a], “Did you not hate me and drive me out from my father’s house? So why have you come to me now, when you are in distress?”
translation:
  language: fr
  text: 'Jephté dit aux anciens de Galaad : « N’est-ce pas vous qui m’avez haï et m’avez chassé de la maison de mon père ? Alors pourquoi venez-vous à moi maintenant que vous êtes dans la détresse[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « maintenant que vous êtes en difficulté ». L’expression hébraïque évoque une situation pénible ou pressante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol narratif de אמר appelle ici le verbe français simple et naturel « dit ».
- source_word: זִקְנֵי גִלְעָד
  choice: les anciens de Galaad
  rationale: Le pluriel construit désigne les responsables reconnus de la communauté, et non simplement des hommes âgés.
- source_word: הֲלֹא
  choice: N’est-ce pas vous qui
  rationale: Cette tournure rend naturellement en français la question rhétorique qui attend une réponse affirmative, tout en mettant l’accent sur « vous ».
- source_word: שְׂנֵאתֶם
  choice: m’avez haï
  rationale: Le verbe שׂנא signifie directement « haïr » ; cette traduction conserve la force de l’hostilité exprimée.
- source_word: וַתְּגָרְשׁוּנִי
  choice: chassé
  rationale: גרשׁ indique une expulsion forcée ; « chasser » est courant, vigoureux et adapté au contexte familial.
- source_word: מִבֵּית אָבִי
  choice: de la maison de mon père
  rationale: La formulation préserve l’image de la maison paternelle ainsi que sa portée familiale et sociale, sans la réduire au seul bâtiment.
- source_word: וּמַדּוּעַ
  choice: Alors pourquoi
  rationale: « Alors » rend le lien logique entre le reproche précédent et la question qui en découle.
- source_word: בָּאתֶם אֵלַי עַתָּה
  choice: venez-vous à moi maintenant
  rationale: Le présent français convient à une venue dont le résultat est actuel dans le dialogue, tandis que « maintenant » maintient l’insistance temporelle de עַתָּה.
- source_word: כַּאֲשֶׁר צַר לָכֶם
  choice: maintenant que vous êtes dans la détresse
  rationale: La proposition décrit la situation pressante qui motive leur venue. « Dans la détresse » conserve l’idée d’être à l’étroit ou en difficulté sans préciser excessivement la nature du danger.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique conserve son accusation directe ; le vocabulaire reste accessible sans atténuer la force de « haï » et « chassé ».
