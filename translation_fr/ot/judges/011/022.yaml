  text: וַ/יִּ֣ירְשׁ֔וּ אֵ֖ת כָּל גְּב֣וּל הָ/אֱמֹרִ֑י מֵֽ/אַרְנוֹן֙ וְ/עַד הַ/יַּבֹּ֔ק וּ/מִן הַ/מִּדְבָּ֖ר וְ/עַד הַ/יַּרְדֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/022.yaml
  text: So they took possession of all the territory of the Amorites[a], from the Arnon as far as the Jabbok[c][b], and from the wilderness as far as the Jordan.
translation:
  language: fr
  text: Ils prirent possession de tout le territoire des Amorites[a], depuis l’Arnon jusqu’au Yabboq, et depuis le désert jusqu’au Jourdain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils occupèrent » ou « ils héritèrent ». Le verbe hébreu peut avoir ces sens ; ici, il évoque la prise de contrôle d’un territoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: Ils prirent ainsi possession de
  rationale: Dans ce contexte de conquête territoriale, ירשׁ désigne l’action de prendre possession d’un pays. « Ainsi » rend la valeur consécutive du וַ־ narratif sans alourdir la phrase.
- source_word: כָּל גְּבוּל
  choice: tout le territoire
  rationale: כָּל conserve sa portée globale, tandis que גְּבוּל désigne ici l’étendue comprise entre les limites géographiques indiquées, plutôt que la seule frontière.
- source_word: הָאֱמֹרִי
  choice: des Amorites
  rationale: Le singulier hébreu est collectif et désigne ici le peuple amorite; le pluriel est naturel en français.
- source_word: מֵאַרְנוֹן וְעַד הַיַּבֹּק
  choice: depuis l’Arnon jusqu’au Yabboq
  rationale: La construction « depuis… jusqu’à… » exprime clairement les deux limites territoriales. Les noms traditionnels français des cours d’eau sont conservés.
- source_word: וּמִן הַמִּדְבָּר
  choice: et depuis le désert
  rationale: מִדְבָּר désigne une région aride ou inhabitée; « désert » est ici une formulation géographique concise et courante en français biblique moderne.
- source_word: וְעַד הַיַּרְדֵּן
  choice: jusqu’au Jourdain
  rationale: Cette formulation complète naturellement la seconde paire de limites; « le Jourdain » est la forme française établie.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure parallèle des deux paires de limites est préservée. Une seule note signale la nuance réelle du verbe ירשׁ; le singulier collectif « l’Amorite » et le sens territorial de גְּבוּל sont rendus directement de façon idiomatique dans le texte.
