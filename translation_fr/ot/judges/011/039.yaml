  text: וַ/יְהִ֞י מִ/קֵּ֣ץ שְׁנַ֣יִם חֳדָשִׁ֗ים וַ/תָּ֨שָׁב֙ אֶל אָבִ֔י/הָ וַ/יַּ֣עַשׂ לָ֔/הּ אֶת נִדְר֖/וֹ אֲשֶׁ֣ר נָדָ֑ר וְ/הִיא֙ לֹא יָדְעָ֣ה אִ֔ישׁ וַ/תְּהִי חֹ֖ק בְּ/יִשְׂרָאֵֽל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/039.yaml
  text: 'And at the end of two months she returned to her father[a], and he did to her according to his vow that he had vowed. Now she had not known a man[b]. And it became a statute in Israel:'
translation:
  language: fr
  text: 'Au bout de deux mois, elle revint auprès de son père, et il accomplit envers elle le vœu qu’il avait fait[a]. Or, elle n’avait pas connu d’homme[b]. Cela devint une coutume en Israël :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il fit envers elle son vœu qu’il avait voué ». Les interprètes divergent : certains comprennent que Jephté l’a offerte en sacrifice, d’autres qu’il l’a vouée à une virginité perpétuelle. Ici, la formulation hébraïque ne tranche pas explicitement la question.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « elle n’avait pas connu d’homme », expression hébraïque signifiant qu’elle n’avait pas eu de relations sexuelles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שְׁנַיִם חֳדָשִׁים
  choice: Au bout de deux mois
  rationale: Cette tournure française marque naturellement l’achèvement de la période exprimé par מִקֵּץ.
- source_word: וַתָּשָׁב אֶל אָבִיהָ
  choice: elle revint auprès de son père
  rationale: « Revint » rend directement שׁוּב, tandis que « auprès de son père » conserve la destination relationnelle explicitement indiquée.
- source_word: וַיַּעַשׂ לָהּ אֶת נִדְרוֹ אֲשֶׁר נָדָר
  choice: il accomplit envers elle le vœu qu’il avait fait
  rationale: La formulation conserve le rapport direct entre l’action, la jeune femme et le vœu, ainsi que la répétition de la racine נדר, tout en restant idiomatique en français.
- source_word: וְהִיא לֹא יָדְעָה אִישׁ
  choice: Or, elle n’avait pas connu d’homme
  rationale: Cette traduction préserve l’euphémisme hébreu et sa portée narrative, sans le remplacer dans le texte par l’explication « elle était vierge ».
- source_word: חֹק
  choice: coutume
  rationale: Dans cette conclusion narrative, le terme introduit la pratique communautaire annuelle précisée au verset suivant plutôt qu’une loi formellement promulguée.
- source_word: וַתְּהִי חֹק בְּיִשְׂרָאֵל
  choice: Cela devint une coutume en Israël
  rationale: « Devint » rend le développement narratif de וַתְּהִי, et « coutume » convient à l’usage collectif qui s’établit en Israël.
theological_decisions:
- issue: Nature de l’accomplissement du vœu de Jephté
  choice: 'La traduction maintient la formulation non explicite de l’hébreu : « il accomplit envers elle le vœu qu’il avait fait ».'
  alternative: Comprendre soit qu’il l’offrit en holocauste, soit qu’il la consacra à une virginité perpétuelle ou à un service particulier.
  rationale: Le verset ne précise pas par un verbe distinct ce que Jephté fit concrètement. La traduction ne tranche donc pas une controverse ancienne que le libellé hébreu, pris isolément, laisse ouverte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de la concision narrative hébraïque, tout en évitant un calque artificiel. « Coutume » anticipe naturellement l’observance annuelle décrite au verset suivant.
