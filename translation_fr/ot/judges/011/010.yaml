  text: וַ/יֹּאמְר֥וּ זִקְנֵֽי גִלְעָ֖ד אֶל יִפְתָּ֑ח יְהוָ֗ה יִהְיֶ֤ה שֹׁמֵ֨עַ֙ בֵּֽינוֹתֵ֔י/נוּ אִם לֹ֥א כִ/דְבָרְ/ךָ֖ כֵּ֥ן נַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/010.yaml
  text: Then the elders of Gilead said to Jephthah[a], “Yahweh will be witness between us if we do not do according to your word.”
translation:
  language: fr
  text: 'Alors les anciens de Galaad dirent à Jephté : « Yahweh sera témoin entre nous[a] si nous n’agissons pas comme tu l’as dit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Yahweh écoutera entre nous », c’est-à-dire qu’il entendra l’affaire en qualité de témoin ou de juge entre les deux parties.'
    reason: Préserver l’image littérale de l’hébreu et sa possible nuance judiciaire.
lexical_decisions:
- source_word: וַיֹּאמְרוּ זִקְנֵי גִלְעָד אֶל יִפְתָּח
  choice: Alors les anciens de Galaad dirent à Jephté
  rationale: « Alors » rend naturellement la progression narrative du waw consécutif. Le groupe construit désigne les dirigeants reconnus de Galaad.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La forme conserve le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: יִהְיֶה שֹׁמֵעַ בֵּינוֹתֵינוּ
  choice: sera témoin entre nous
  rationale: Littéralement, Yahweh « sera écoutant entre nous ». Dans ce serment, entendre entre les parties implique d’être témoin, avec une possible nuance judiciaire. La formulation française exprime cette valeur contextuelle sans préciser indûment qu’il prononcera un jugement.
- source_word: אִם לֹא
  choice: si nous ne
  rationale: La locution introduit ici la condition négative associée au serment.
- source_word: כִדְבָרְךָ כֵּן נַעֲשֶׂה
  choice: nous n’agissons pas comme tu l’as dit
  rationale: Cette formulation rend idiomatiquement l’idée de faire conformément à la parole ou aux conditions énoncées par Jephté, tout en gardant le verbe général « agir ».
theological_decisions:
- issue: Valeur de יִהְיֶה שֹׁמֵעַ dans la formule de serment
  choice: Yahweh sera témoin entre nous
  alternative: Que Yahweh entende entre nous
  rationale: La construction peut conserver une couleur littérale d’écoute ou exprimer la fonction de témoin et de juge. Le texte principal retient la valeur contextuelle de témoignage, tandis que la note préserve l’image hébraïque et sa nuance judiciaire.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin; sa translittération préserve ce fait sans remplacer le nom par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. « Galaad » et « Jephté » suivent les formes françaises bibliques usuelles. La syntaxe du serment reste concise et conserve la tension de la condition négative.
