  yaml_path: translation/ot/judges/001/026.yaml
  text: And the man went to the land of the Hittites and built a city and called its name Luz[a]; that is its name to this day.
translation:
  language: fr
  text: L’homme se rendit au pays des Hittites. Il bâtit une ville et l’appela Louz[a]. C’est encore son nom aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « appela son nom Louz ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: se rendit
  rationale: Le qal wayyiqtol de הלך exprime ici le déplacement vers une destination; « se rendit » est naturel en français narratif et évite la lourdeur de « alla dans ».
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Le syntagme défini renvoie à l’homme mentionné au verset précédent et conserve la référence masculine singulière.
- source_word: אֶרֶץ הַחִתִּים
  choice: au pays des Hittites
  rationale: Cette traduction respecte le rapport construit tout en donnant une désignation géographique naturelle, sans préciser davantage le statut politique du territoire.
- source_word: וַיִּבֶן עִיר
  choice: Il bâtit une ville
  rationale: בנה avec עִיר signifie directement « bâtir une ville »; « fonda » ajouterait une nuance qui n’est pas explicitement formulée.
- source_word: וַיִּקְרָא שְׁמָהּ לוּז
  choice: et l’appela Louz
  rationale: Littéralement, l’hébreu dit « il appela son nom Louz ». Le français idiomatique « l’appela Louz » en conserve le sens sans calquer une tournure peu naturelle.
- source_word: לוּז
  choice: Louz
  rationale: Le nom de lieu est translittéré selon sa forme française biblique usuelle.
- source_word: הוּא שְׁמָהּ
  choice: C’est encore son nom
  rationale: La proposition nominale affirme que Louz demeure le nom de la ville; « encore » se lit naturellement avec l’indication temporelle qui suit.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: Avec « encore », cette formulation rend idiomatiquement l’expression hébraïque « jusqu’à ce jour ».
