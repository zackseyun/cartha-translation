source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת יְהוֹשֻׁ֔עַ וַֽ/יִּשְׁאֲלוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/יהוָ֖ה לֵ/אמֹ֑ר מִ֣י יַעֲלֶה לָּ֧/נוּ אֶל הַֽ/כְּנַעֲנִ֛י בַּ/תְּחִלָּ֖ה לְ/הִלָּ֥חֶם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/001.yaml
  text: And it happened after the death of Joshua that the sons of Israel asked Yahweh[a], saying[b], “Who will go up for us first against the Canaanites to fight against them?”
translation:
  language: fr
  text: 'Après la mort de Josué, les fils d’Israël[a] consultèrent Yahweh en ces termes : « Qui montera le premier pour nous contre les Cananéens[b], afin de les combattre ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël » ; on peut aussi traduire : « les Israélites ».'
    reason: L’expression hébraïque désigne collectivement les descendants d’Israël, tout en employant explicitement le nom « fils ».
  - marker: b
    text: En hébreu, « le Cananéen » est au singulier, mais il a ici un sens collectif.
    reason: La note préserve la particularité grammaticale de la source, rendue naturellement par un pluriel en français.
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת יְהוֹשֻׁעַ
  choice: Après la mort de Josué
  rationale: La formule narrative וַיְהִי ouvre un nouvel épisode. En français, « Après la mort de Josué » restitue naturellement la transition temporelle sans calque lourd comme « Et il arriva ».
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: consultèrent Yahweh
  rationale: Dans ce contexte, שׁאל avec בְּ indique une recherche de direction divine, probablement par un moyen reconnu de consultation. « Consultèrent » exprime mieux cette démarche que le simple « demandèrent à ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Ce rendu conserve la forme masculine plurielle et l’expression généalogique de l’hébreu. Une note signale l’équivalent collectif plus idiomatique « les Israélites ».
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif quotatif introduit le discours direct. « En ces termes » remplit cette fonction avec naturel et dignité, sans le calque pesant « en disant ».
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: Qui montera … pour nous
  rationale: עלה évoque ici l’avancée militaire. « Montera » préserve cette image, tandis que « pour nous » rend directement le datif לָנוּ sans préciser davantage sa nuance.
- source_word: בַּתְּחִלָּה
  choice: le premier
  rationale: Dans la question portant sur l’ordre d’engagement des tribus, « le premier » est l’équivalent français le plus clair et naturel.
- source_word: אֶל הַכְּנַעֲנִי
  choice: contre les Cananéens
  rationale: La forme hébraïque est singulière mais possède ici un sens collectif. Le pluriel français convient au peuple visé, et « contre » explicite la relation hostile imposée par le contexte militaire.
- source_word: לְהִלָּחֶם בּוֹ
  choice: afin de les combattre
  rationale: Le verbe לחם signifie combattre ou faire la guerre. Le pronom pluriel français s’accorde naturellement avec « les Cananéens », qui explicite le collectif hébreu singulier.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme, nom d’alliance divin. « Yahweh » le représente comme nom propre plutôt que de le remplacer par un titre, sans adopter la forme plus tardive « Jéhovah ».
translation_notes:
  register: Français international moderne, lisible et digne. La phrase évite les tournures archaïques telles que « il advint » et les calques peu naturels, tout en conservant l’expression « fils d’Israël », le mouvement militaire « montera » et le nom divin Yahweh.
