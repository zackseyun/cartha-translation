  text: אָשֵׁ֗ר לֹ֤א הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י עַכּ֔וֹ וְ/אֶת יוֹשְׁבֵ֖י צִיד֑וֹן וְ/אֶת אַחְלָ֤ב וְ/אֶת אַכְזִיב֙ וְ/אֶת חֶלְבָּ֔ה וְ/אֶת אֲפִ֖יק וְ/אֶת רְחֹֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/031.yaml
  text: Asher did not drive out the inhabitants of Acco[a], or the inhabitants of Sidon, or Ahlab, or Achzib, or Helbah, or Aphek[b], or Rehob.
translation:
  language: fr
  text: Asher ne chassa pas les habitants d’Akko[b], ni ceux de Sidon, d’Ahlab, d’Akzib, de Helba, d’Afek et de Rehob[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne déposséda pas » ou « n’expulsa pas ». Le verbe hébreu évoque ici le fait de retirer aux occupants la possession du territoire.
    reason: lexical_alternative
  - marker: b
    text: Akko est l’ancienne ville côtière appelée plus tard Acre.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: ne chassa pas / ne chassa ni
  rationale: Au hifil, ירש désigne ici le fait de retirer aux occupants antérieurs la possession du territoire, donc de les chasser ou de les déposséder. « Chasser » est naturel en français et convient au motif récurrent de Juges 1.
- source_word: יֹשְׁבֵי
  choice: les habitants de / ceux de
  rationale: Le participe de ישב désigne collectivement les personnes qui habitent un lieu. La reprise par « ceux de » évite une répétition lourde sans modifier le sens.
- source_word: עַכּוֹ
  choice: Akko
  rationale: Translittération du nom ancien de la ville côtière; « Acre » est une forme historique plus tardive.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Forme française courante du nom de lieu.
- source_word: אַחְלָב
  choice: Ahlab
  rationale: Translittération du nom propre hébreu.
- source_word: אַכְזִיב
  choice: Akzib
  rationale: Translittération française lisible du nom propre hébreu, avec « k » pour la consonne כ.
- source_word: חֶלְבָּה
  choice: Helba
  rationale: Translittération de la forme consonantique et vocalisée présente dans ce verset, sans ajouter un h final non prononcé en français.
- source_word: אֲפִיק
  choice: Afek
  rationale: Translittération adaptée au français du nom propre hébreu.
- source_word: רְחֹב
  choice: Rehob
  rationale: Translittération du nom propre, avec « h » pour signaler la consonne hébraïque ח sans imposer une prononciation savante.
- source_word: וְ/אֶת ... וְ/אֶת
  choice: ni ... ni ... ou
  rationale: Après un verbe nié, « ni » rend naturellement la coordination distributive des objets en français. Dans la dernière série abrégée de toponymes, « ou » clôt la liste avec fluidité tout en restant sous la portée de la négation.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La construction « ne… ni… » restitue naturellement la liste sous la portée de la négation. Les toponymes sont translittérés dans des formes lisibles pour un public francophone, sans remplacer Akko par le nom plus tardif Acre.
