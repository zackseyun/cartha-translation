  text: זְבוּלֻ֗ן לֹ֤א הוֹרִישׁ֙ אֶת יוֹשְׁבֵ֣י קִטְר֔וֹן וְ/אֶת יוֹשְׁבֵ֖י נַהֲלֹ֑ל וַ/יֵּ֤שֶׁב הַֽ/כְּנַעֲנִי֙ בְּ/קִרְבּ֔/וֹ וַ/יִּֽהְי֖וּ לָ/מַֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/030.yaml
  text: Zebulun did not drive out the inhabitants of Kitron or the inhabitants of Nahalol[b][a], so the Canaanites lived among them and became forced laborers.
translation:
  language: fr
  text: Zabulon ne chassa pas les habitants de Kitron ni ceux de Nahalol[a] ; les Cananéens habitèrent donc au milieu de Zabulon[b] et furent astreints au travail forcé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Nahalal » ; cette forme du nom de lieu se rencontre dans certaines traditions et dans des passages apparentés.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement, l’hébreu dit : « le Cananéen habita en son sein » ; « le Cananéen » désigne collectivement le peuple, et « son » renvoie probablement à Zabulon considéré comme une tribu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: chassa
  rationale: Dans ce contexte de conquête et d’établissement, le hiphil de ירש désigne l’expulsion des habitants antérieurs. « Chasser » est naturel en français courant et conserve la portée concrète du verbe.
- source_word: יוֹשְׁבֵי
  choice: les habitants de
  rationale: Le participe de ישב désigne les personnes qui résident dans un lieu. « Les habitants de » est précis et idiomatique.
- source_word: קִטְרוֹן
  choice: Kitron
  rationale: Nom de lieu translittéré plutôt que traduit.
- source_word: נַהֲלֹל
  choice: Nahalol
  rationale: Cette forme suit la vocalisation massorétique du verset; la variante « Nahalal » est signalée en note.
- source_word: וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ
  choice: Les Cananéens continuèrent donc d’habiter au milieu de la tribu
  rationale: Le singulier hébreu « le Cananéen » a une valeur collective, et le suffixe singulier renvoie vraisemblablement à Zabulon considéré comme une tribu. Le pluriel français exprime naturellement ce sens collectif. « Continuèrent d’habiter » rend ici la persistance de leur présence après l’échec de l’expulsion.
- source_word: וַיִּהְיוּ לָמַס
  choice: furent astreints au travail forcé
  rationale: מַס désigne ici une prestation de travail imposée à une population soumise, et non un simple tribut monétaire. Cette formulation française exprime clairement la contrainte sans faire des personnes elles-mêmes un « travail ».
theological_decisions:
- issue: Singulier collectif הַכְּנַעֲנִי et suffixe singulier בְּקִרְבּוֹ
  choice: Rendre le peuple au pluriel et expliciter le référent collectif par « au milieu de la tribu »
  alternative: « le Cananéen habita en son sein » ou « les Cananéens habitèrent au milieu d’eux »
  rationale: L’hébreu traite couramment un peuple et une tribu comme des entités collectives au singulier. La formulation retenue reste fidèle à ce fonctionnement tout en évitant en français un pronom masculin ambigu pouvant sembler renvoyer à un individu.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est divisée en deux pour alléger la syntaxe. « Travail forcé » est préféré au terme technique « corvée », moins transparent pour certains lecteurs.
