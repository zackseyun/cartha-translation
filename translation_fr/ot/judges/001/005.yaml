  text: וַֽ֠/יִּמְצְאוּ אֶת אֲדֹנִ֥י בֶ֨זֶק֙ בְּ/בֶ֔זֶק וַ/יִּֽלָּחֲמ֖וּ בּ֑/וֹ וַ/יַּכּ֕וּ אֶת הַֽ/כְּנַעֲנִ֖י וְ/אֶת הַ/פְּרִזִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/005.yaml
  text: They found Adoni-bezek in Bezek[a], and they fought against him and struck down the Canaanites and the Perizzites.
translation:
  language: fr
  text: Ils trouvèrent Adoni-Bézek à Bézek[a], lui livrèrent bataille et frappèrent les Cananéens et les Perizzites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Adoni-Bézek peut aussi se comprendre, d’après son étymologie, comme « seigneur de Bézek »; il est rendu ici comme un nom propre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: ils trouvèrent
  rationale: Le verbe מצא signifie couramment « trouver » ou « rencontrer » dans le récit. « Ils trouvèrent » rend directement la séquence narrative.
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Bézek
  rationale: L’expression est traitée ici comme un nom propre, conformément à son emploi narratif, tout en conservant par translittération sa forme potentiellement titulaire.
- source_word: בְּבֶזֶק
  choice: à Bézek
  rationale: La préposition ב marque ici le lieu. En français, « à » est la tournure naturelle devant un nom de ville ou de localité.
- source_word: וַיִּלָּחֲמוּ בּוֹ
  choice: lui livrèrent bataille
  rationale: Le niphal de לחם suivi de ב exprime l'action de combattre un adversaire. Cette formulation française est naturelle et conserve clairement le sens hostile.
- source_word: וַיַּכּוּ
  choice: frappèrent
  rationale: נכה couvre les sens de frapper, abattre ou vaincre. « Frappèrent » préserve l'image verbale et évite de préciser au-delà du texte s'il s'agit d'une mise à mort exhaustive ou d'une défaite militaire.
- source_word: הַכְּנַעֲנִי
  choice: les Cananéens
  rationale: Le gentilé singulier en hébreu a ici une valeur collective; le pluriel français exprime naturellement le groupe engagé dans la bataille.
- source_word: הַפְּרִזִּי
  choice: les Perizzites
  rationale: Comme le gentilé précédent, le singulier hébreu est collectif; le pluriel convient en français.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient à la narration biblique écrite sans être archaïque. « Lui livrèrent bataille » évite la lourdeur de « combattirent contre lui », tandis que « frappèrent » maintient l'étendue sémantique du verbe hébreu.
