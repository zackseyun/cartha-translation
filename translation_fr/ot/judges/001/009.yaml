  yaml_path: translation/ot/judges/001/009.yaml
  text: Afterward[a], the sons of Judah went down to fight against the Canaanites living in the hill country, the Negev, and the lowland.
translation:
  language: fr
  text: Ensuite, les fils de Juda descendirent combattre les Cananéens qui habitaient la région montagneuse, le Néguev et le Bas-Pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la Shéphéla », région de collines basses située entre la région montagneuse de Juda et la plaine côtière.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Ensuite
  rationale: Marque la succession des événements sans préciser la durée de l’intervalle.
- source_word: יָרְדוּ
  choice: descendirent
  rationale: Conserve le mouvement topographique exprimé par ירד dans un style narratif naturel.
- source_word: בְּנֵי יְהוּדָה
  choice: les fils de Juda
  rationale: Rend formellement l’expression hébraïque tout en désignant collectivement les membres de la tribu.
- source_word: לְהִלָּחֵם בַּכְּנַעֲנִי
  choice: combattre les Cananéens
  rationale: Exprime clairement l’action hostile; le singulier collectif hébreu est rendu par un pluriel français naturel.
- source_word: יוֹשֵׁב
  choice: qui habitaient
  rationale: Le participe décrit la résidence durable des Cananéens dans les trois régions.
- source_word: הָהָר
  choice: la région montagneuse
  rationale: Dans cette énumération géographique, le terme désigne les hautes terres plutôt qu’une montagne isolée.
- source_word: הַנֶּגֶב
  choice: le Néguev
  rationale: Conserve le nom géographique précis de la région méridionale.
- source_word: הַשְּׁפֵלָה
  choice: le Bas-Pays
  rationale: Traduction accessible du nom géographique désignant la zone de collines basses entre les hautes terres de Juda et la plaine côtière.
