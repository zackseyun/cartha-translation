id: JDG.1.35
reference: Judges 1:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יּ֤וֹאֶל הָֽ/אֱמֹרִי֙ לָ/שֶׁ֣בֶת בְּ/הַר חֶ֔רֶס בְּ/אַיָּל֖וֹן וּ/בְ/שַֽׁעַלְבִ֑ים וַ/תִּכְבַּד֙ יַ֣ד בֵּית יוֹסֵ֔ף וַ/יִּהְי֖וּ לָ/מַֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/035.yaml
  text: But the Amorites persisted in dwelling in Mount Heres[a], in Aijalon, and in Shaalbim; then the hand of the house of Joseph grew heavy[b], and they became subject to forced labor.
translation:
  language: fr
  text: Mais les Amorites s’obstinèrent à habiter au mont Hérès, à Ayalôn et à Shaalbim. Puis la main de la maison de Joseph s’appesantit sur eux[a], et ils furent astreints aux travaux forcés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la maison de Joseph prit le dessus ». Littéralement : « la main de la maison de Joseph devint lourde ». Cette expression hébraïque peut évoquer une puissance croissante ou un pouvoir oppressif.'
    reason: lexical_alternative
  - marker: b
    text: Ou « ils furent soumis à la corvée » ou « ils devinrent des travailleurs tributaires ». Le terme hébreu désigne un service de travail obligatoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: s’obstinèrent
  rationale: Avec l’infinitif « habiter » et dans ce contexte de résistance amorite, le verbe exprime ici une volonté ferme et persistante plutôt qu’un simple commencement ou consentement.
- source_word: הָאֱמֹרִי
  choice: les Amorites
  rationale: Le singulier hébreu désigne collectivement le peuple amorite; le pluriel français est naturel et correspond au verbe pluriel de la dernière proposition.
- source_word: לָשֶׁבֶת
  choice: à habiter
  rationale: L’infinitif complète directement « s’obstinèrent » et exprime le maintien de leur implantation dans ces lieux.
- source_word: בְּהַר חֶרֶס
  choice: au mont Hérès
  rationale: « Mont » rend הַר sans décider s’il s’agit précisément d’un sommet ou d’une zone montagneuse; le toponyme est conservé.
- source_word: בְּאַיָּלוֹן
  choice: à Ayalôn
  rationale: Translittération française claire du nom de lieu.
- source_word: וּבְשַׁעַלְבִים
  choice: et à Shaalbim
  rationale: Le nom de lieu est translittéré et la conjonction hébraïque est conservée.
- source_word: וַתִּכְבַּד יַד
  choice: la main … s’appesantit sur eux
  rationale: Cette formulation préserve l’image hébraïque de la main devenue lourde tout en rendant explicite en français son exercice oppressif sur les Amorites.
- source_word: בֵּית יוֹסֵף
  choice: la maison de Joseph
  rationale: L’expression familiale et politique traditionnelle est maintenue sans la réduire explicitement à une seule tribu.
- source_word: וַיִּהְיוּ לָמַס
  choice: ils furent astreints aux travaux forcés
  rationale: מַס désigne ici un service de travail obligatoire ou une corvée; cette formulation est claire en français moderne et évite de suggérer un simple tribut monétaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le verset conserve l’image concrète de la « main » devenue lourde, tandis que « travaux forcés » communique clairement la nature du מַס. Les toponymes suivent une translittération française lisible.
