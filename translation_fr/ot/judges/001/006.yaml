  yaml_path: translation/ot/judges/001/006.yaml
  text: But Adoni-bezek fled[a], and they pursued him, seized him, and cut off his thumbs and big toes.
translation:
  language: fr
  text: Mais Adoni-Bézeq prit la fuite. Ils le poursuivirent, le saisirent et lui coupèrent les pouces et les gros orteils.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « les pouces de ses mains et de ses pieds », c’est-à-dire ses pouces et ses gros orteils.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: prit la fuite
  rationale: Le verbe נוּס exprime ici la fuite, non une évasion réussie, puisqu’il est aussitôt capturé. « Prit la fuite » est naturel et conserve la force narrative.
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Bézeq
  rationale: L’expression fonctionne ici comme un nom propre ou nom-titre. Elle est donc transcrite plutôt que traduite par « seigneur de Bézeq ».
- source_word: וַיִּרְדְּפוּ אַחֲרָיו
  choice: Ils le poursuivirent
  rationale: רדף suivi de אַחַר signifie poursuivre quelqu’un. Cette formulation est concise et convient au registre narratif.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: le saisirent
  rationale: אחז désigne l’action de saisir ou d’agripper. Dans ce contexte, la formulation exprime clairement sa capture.
- source_word: וַיְקַצְּצוּ
  choice: lui coupèrent
  rationale: קצץ signifie ici retrancher des parties du corps. La construction française avec le pronom indirect est naturelle et précise.
- source_word: בְּהֹנוֹת יָדָיו וְרַגְלָיו
  choice: les pouces et les gros orteils
  rationale: בֹּהֶן désigne le pouce lorsqu’il s’agit de la main et le gros orteil lorsqu’il s’agit du pied. Le français doit expliciter cette distinction pour rendre exactement le sens de l’hébreu.
