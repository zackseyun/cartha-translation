base_translation:
  language: en
  yaml_path: translation/ot/judges/001/029.yaml
  text: And Ephraim did not drive out the Canaanites who lived in Gezer[a], and the Canaanites lived among them in Gezer.
translation:
  language: fr
  text: Éphraïm ne chassa pas les Cananéens qui habitaient à Guézer, et les Cananéens habitèrent parmi eux[a], à Guézer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « au milieu de lui » ; le pronom singulier renvoie à Éphraïm considéré comme une entité tribale.
    reason: clarification grammaticale
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: chassa
  rationale: Au hiphil, ירשׁ exprime ici l’action de faire perdre aux habitants leur possession du territoire ou de les en évincer. « Chasser » est naturel en français moderne et convient au contexte.
- source_word: הַכְּנַעֲנִי
  choice: les Cananéens
  rationale: Le nom est morphologiquement singulier en hébreu, mais il désigne collectivement le groupe ethnique; le pluriel est naturel en français.
- source_word: הַיּוֹשֵׁב
  choice: qui habitaient
  rationale: Le participe de ישׁב décrit une résidence établie et continue. L’imparfait français rend naturellement cet état dans le récit.
- source_word: בְּגָזֶר
  choice: à Guézer
  rationale: La préposition ב indique le lieu. En français, « à » est la préposition habituelle devant le nom d’une ville.
- source_word: וַיֵּשֶׁב
  choice: continuèrent d’habiter
  rationale: Le verbe indique que les Cananéens demeurèrent sur place après l’échec à les chasser. « Continuèrent d’habiter » explicite naturellement la persistance impliquée par la séquence narrative sans transformer la simple coordination en lien causal explicite.
- source_word: בְּקִרְבּוֹ
  choice: au milieu de lui
  rationale: Cette formulation conserve le suffixe masculin singulier qui renvoie à Éphraïm envisagé comme une unité tribale, plutôt que de le convertir silencieusement en pluriel collectif.
