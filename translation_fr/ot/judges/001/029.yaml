    rationale: Le texte hébreu emploie simplement וַיֵּשֶׁב, « habita/demeura » dans la suite narrative. La persistance est contextuellement plausible, mais ne doit pas être renforcée inutilement.
  - severity: medium
    issue: « au milieu de lui » est une restitution trop littérale et peu idiomatique du collectif tribal.
    rationale: Le suffixe hébreu est bien singulier, mais son antécédent est Éphraïm en tant que tribu. En français moderne, « parmi eux » communique ce sens collectif ; une note signale la littéralité du singulier.
  revised_text: Éphraïm ne chassa pas les Cananéens qui habitaient à Guézer, et les Cananéens habitèrent parmi eux[a], à Guézer.
  revised_footnotes:
