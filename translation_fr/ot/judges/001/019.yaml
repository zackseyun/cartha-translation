source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶתּ יְהוּדָ֔ה וַ/יֹּ֖רֶשׁ אֶת הָ/הָ֑ר כִּ֣י לֹ֤א לְ/הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י הָ/עֵ֔מֶק כִּי רֶ֥כֶב בַּרְזֶ֖ל לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/019.yaml
  text: And Yahweh was with Judah[a], and he took possession of the hill country; but he could not drive out the inhabitants of the valley, because they had iron chariots.
translation:
  language: fr
  text: Yahvé était avec Juda, et celui-ci prit possession de la région montagneuse. Mais il ne put en chasser les habitants de la vallée[a], parce qu’ils avaient des chars de fer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la plaine » ou « des basses terres » ; le terme hébreu peut désigner une vaste région basse.
    reason: Alternative lexicale et géographique pour עֵמֶק.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française traditionnelle et reconnaissable du nom divin YHWH, adaptée au français moderne.
- source_word: אֶתּ יְהוּדָה
  choice: avec Juda
  rationale: La préposition אֵת exprime ici l’accompagnement. « Juda » désigne par métonymie la tribu, sans qu’il soit nécessaire de l’expliciter dans le texte.
- source_word: וַיֹּרֶשׁ
  choice: prit possession de
  rationale: Avec la région montagneuse comme complément, le hiphil de ירש exprime ici la prise de possession plutôt que l’expulsion, laquelle est formulée explicitement dans la proposition suivante.
- source_word: הָהָר
  choice: la région montagneuse
  rationale: Dans ce contexte géographique, le terme désigne les hautes terres dans leur ensemble, non une montagne particulière.
- source_word: כִּי לֹא לְהוֹרִישׁ
  choice: Mais il ne put en chasser
  rationale: La construction hébraïque est elliptique. Le contexte et la proposition causale suivante indiquent un échec ou une incapacité; la formulation française restitue naturellement ce sens tout en marquant le contraste.
- source_word: יֹשְׁבֵי הָעֵמֶק
  choice: les habitants de la vallée
  rationale: Rendu naturel du participe substantivé; עֵמֶק désigne une vallée, éventuellement une vaste plaine basse.
- source_word: רֶכֶב בַּרְזֶל לָהֶם
  choice: parce qu’ils avaient des chars de fer
  rationale: Formulation française claire qui conserve à la fois le rapport causal et l’expression hébraïque de possession.
theological_decisions:
- issue: Sujet et portée de l’incapacité à expulser les habitants de la vallée
  choice: 'Rapporter l’incapacité à Juda : « Mais il ne put en chasser les habitants »'
  alternative: 'Traduire plus littéralement et obscurément : « car non pour chasser les habitants », ou reformuler afin de ne pas laisser entendre une incapacité alors que Yahvé était avec Juda'
  rationale: La syntaxe est condensée, mais le contexte attribue naturellement l’échec à Juda et l’explique par les chars de fer. Cette traduction préserve sans l’atténuer la tension entre la présence de Yahvé et l’échec militaire rapporté.
translation_notes:
  register: Français international moderne, digne et accessible. « Celui-ci » lève naturellement l’ambiguïté référentielle après « Yahvé était avec Juda », tandis que le singulier conserve la personnification collective de la tribu. Le marqueur de note est placé après « vallée », le mot auquel la note se rapporte.
