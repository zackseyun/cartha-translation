  text: וַֽ/יְהִי֙ כִּֽי חָזַ֣ק יִשְׂרָאֵ֔ל וַ/יָּ֥שֶׂם אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖ישׁ לֹ֥א הוֹרִישֽׁ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/028.yaml
  text: And when Israel became strong[a], they put the Canaanites to forced labor[b], but they did not drive them out completely.
translation:
  language: fr
  text: Quand Israël devint puissant, il soumit les Cananéens aux travaux forcés, mais il ne les chassa pas complètement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Quand
  rationale: La formule narrative introduit ici une proposition temporelle. En français, « Quand » rend naturellement le rapport temporel sans reproduire lourdement l’idiome « et il arriva que ».
- source_word: חָזַק
  choice: devint puissant
  rationale: Le verbe marque l’accession d’Israël à une position de force ou de domination; « devint puissant » conserve cette valeur ingressive.
- source_word: וַיָּשֶׂם אֶת הַכְּנַעֲנִי לָמַס
  choice: il soumit les Cananéens aux travaux forcés
  rationale: La construction avec מַס désigne une prestation obligatoire imposée par le pouvoir dominant. « Soumit… aux travaux forcés » exprime clairement la contrainte et forme une phrase française naturelle.
- source_word: הַכְּנַעֲנִי
  choice: les Cananéens
  rationale: Le singulier morphologique a ici une valeur collective; le pluriel français en restitue naturellement le sens.
- source_word: וְהוֹרֵישׁ לֹא הוֹרִישׁוֹ
  choice: mais il ne les chassa pas complètement
  rationale: L’infinitif absolu associé au verbe conjugué met en relief la non-expulsion effective. « Pas complètement » rend cette insistance sans surcharger le français; le pronom pluriel reprend le collectif cananéen.
theological_decisions:
- issue: Le traitement des Cananéens par Israël
  choice: Israël leur impose des travaux forcés au lieu de les expulser complètement.
  alternative: Comprendre מַס comme un simple tribut financier.
  rationale: Dans ce contexte, מַס évoque une prestation obligatoire au bénéfice d’une puissance dominante. La traduction conserve donc la dimension coercitive du texte sans l’atténuer.
translation_notes:
  register: Français international moderne, sobre et digne. Le sujet collectif « Israël » est repris par le singulier « il ». « Travaux forcés » est immédiatement compréhensible et évite le terme technique « corvée », tout en préservant la coercition du texte hébreu.
