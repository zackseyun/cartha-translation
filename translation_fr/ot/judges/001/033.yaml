source:
  edition: WLC
  text: נַפְתָּלִ֗י לֹֽא הוֹרִ֞ישׁ אֶת יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וְ/אֶת יֹשְׁבֵ֣י בֵית עֲנָ֔ת וַ/יֵּ֕שֶׁב בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ וְ/יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וּ/בֵ֣ית עֲנָ֔ת הָי֥וּ לָ/הֶ֖ם לָ/מַֽס־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/033.yaml
  text: Naphtali did not drive out the inhabitants of Beth-shemesh or the inhabitants of Beth-anath[a], so he lived among the Canaanites, the inhabitants of the land. And the inhabitants of Beth-shemesh and Beth-anath became forced labor for them.
translation:
  language: fr
  text: Nephtali ne chassa pas les habitants de Beth-Shémesh ni ceux de Beth-Anath. Il habita donc au milieu des Cananéens, les habitants du pays. Quant aux habitants de Beth-Shémesh et de Beth-Anath, ils furent assujettis à la corvée à leur service.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent soumis à des travaux forcés pour eux ». Le terme hébreu désigne un service de travail obligatoire, et non simplement le paiement d’un tribut. Le pronom « eux » renvoie vraisemblablement aux membres de la tribu de Nephtali.
    reason: Précision lexicale sur מַס et indication prudente du référent probable du pronom pluriel להם.
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: chassa
  rationale: Dans ce contexte, le hiphil de ירש désigne l’expulsion des habitants précédents. « Chasser » exprime naturellement en français l’action d’évincer une population du territoire.
- source_word: יֹשְׁבֵי
  choice: les habitants
  rationale: Le participe de ישב désigne les personnes qui demeurent dans un lieu. « Habitants » convient à la formule répétée du chapitre.
- source_word: בֵית שֶׁמֶשׁ
  choice: Beth-Shémesh
  rationale: Le nom de lieu est translittéré selon l’usage biblique français, avec des accents facilitant une prononciation française.
- source_word: בֵית עֲנָת
  choice: Beth-Anath
  rationale: Le nom propre est translittéré plutôt que traduit.
- source_word: וַיֵּשֶׁב בְּקֶרֶב
  choice: Il habita donc au milieu de
  rationale: Le verbe singulier traite Nephtali comme une entité tribale collective. « Au milieu de » rend explicitement בְּקֶרֶב, tandis que « donc » fait ressortir la conséquence narrative sans modifier le sens.
- source_word: הַכְּנַעֲנִי
  choice: des Cananéens
  rationale: Le singulier ethnique hébreu a ici une valeur collective; le pluriel est naturel en français.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: les habitants du pays
  rationale: L’apposition présente dans l’hébreu est conservée; elle identifie les Cananéens comme la population établie dans le pays.
- source_word: הָיוּ לָהֶם לָמַס
  choice: ils furent astreints à la corvée au profit des siens
  rationale: מַס désigne ici un service obligatoire, non un simple tribut financier. « Furent astreints à la corvée » rend ce statut avec précision. « Au profit des siens » conserve la référence plurielle de לָהֶם aux membres de la tribu personnifiée par Nephtali.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La personnification de la tribu par le nom « Nephtali » et le pronom singulier est maintenue; « les siens » permet ensuite de rendre le pluriel hébreu visant les membres de la tribu. Les noms de lieux suivent une translittération française lisible.
