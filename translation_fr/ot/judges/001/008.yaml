  text: Then the sons of Judah fought against Jerusalem and captured it[a], and struck it with the edge of the sword[b], and they set the city on fire.
translation:
  language: fr
  text: Les fils de Juda combattirent contre Jérusalem[a], s’en emparèrent et la passèrent au fil de l’épée ; ils mirent aussi le feu à la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « combattirent dans Jérusalem ». Toutefois, le contexte favorise le sens : « combattirent contre Jérusalem ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ בְנֵי יְהוּדָה בִּירוּשָׁלִַם
  choice: Les fils de Juda combattirent Jérusalem
  rationale: Le nifal de לחם suivi de ב désigne ici une action militaire dirigée contre Jérusalem, comme le confirme sa prise dans la proposition suivante. En français, « combattre Jérusalem » est naturel et conserve la concision du récit.
- source_word: בְנֵי יְהוּדָה
  choice: les fils de Juda
  rationale: La traduction formelle garde l’expression familiale hébraïque, qui désigne collectivement les membres de la tribu de Juda.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: s’en emparèrent
  rationale: לכד exprime la prise militaire d’une ville. « S’emparer de » est idiomatique en français et le pronom « en » reprend clairement Jérusalem.
- source_word: וַיַּכּוּהָ לְפִי חָרֶב
  choice: la passèrent au fil de l’épée
  rationale: Cette tournure française traditionnelle et intelligible rend l’idiome hébreu « frapper à la bouche de l’épée » sans donner l’impression que la ville matérielle elle-même est frappée.
- source_word: וְאֶת הָעִיר שִׁלְּחוּ בָאֵשׁ
  choice: Puis ils mirent le feu à la ville
  rationale: שלח באש signifie ici livrer ou vouer au feu. « Mettre le feu à » exprime naturellement l’incendie volontaire en français moderne; « puis » marque la progression narrative portée par ו.
