source:
  edition: WLC
  text: וַ/יַּ֣עַל יְהוּדָ֔ה וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת הַ/כְּנַעֲנִ֥י וְ/הַ/פְּרִזִּ֖י בְּ/יָדָ֑/ם וַ/יַּכּ֣וּ/ם בְּ/בֶ֔זֶק עֲשֶׂ֥רֶת אֲלָפִ֖ים אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/004.yaml
  text: Then Judah went up[a], and Yahweh gave the Canaanites and the Perizzites into their hand[b], and they struck down ten thousand men at Bezek.
translation:
  language: fr
  text: Juda monta. Yahvé livra les Cananéens et les Perizzites[a] entre leurs mains[b], et ils battirent dix mille hommes à Bézeq.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le Cananéen et le Perizzite »; les formes au singulier désignent collectivement ces peuples.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans leur main », expression qui signifie « en leur pouvoir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה signifie couramment « monter ». Dans ce récit militaire, « monta » conserve l’expression hébraïque sans préciser indûment s’il s’agit d’une ascension géographique ou d’une simple avancée.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Le nom désigne ici collectivement la tribu et ses combattants. Le français biblique courant emploie « Juda ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française usuelle translittère le nom divin au lieu de le remplacer par un titre.
- source_word: הַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: les Cananéens et les Perizzites
  rationale: Les gentilés hébreux sont morphologiquement au singulier, mais ont ici un sens collectif. Le pluriel est naturel et rend compte des reprises pronominales plurielles.
- source_word: בְּיָדָם
  choice: entre leurs mains
  rationale: L’expression נתן ביד signifie livrer quelqu’un au pouvoir d’un autre. « Entre leurs mains » conserve l’image hébraïque sous une forme idiomatique en français.
- source_word: וַיַּכּוּם
  choice: ils battirent
  rationale: נכה peut signifier frapper, abattre ou vaincre. « Battirent » convient au contexte militaire tout en évitant d’affirmer plus précisément que le verbe lui-même que chacun fut tué.
- source_word: בְּבֶזֶק
  choice: à Bézeq
  rationale: La préposition ב marque ici le lieu de la bataille; « à » est la tournure française naturelle avec ce nom de lieu.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: dix mille hommes
  rationale: Cette expression désigne littéralement dix mille hommes; le contexte les présente comme les combattants ennemis, sans que le terme hébreu signifie explicitement « soldats ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le nom personnel est conservé sous sa forme française usuelle plutôt que remplacé par un titre.
- issue: Articulation entre l’action divine et l’action humaine
  choice: Yahvé livre les ennemis; les hommes de Juda les battent
  alternative: Uniformiser le sujet en attribuant toute l’action soit à Juda, soit à Yahvé
  rationale: L’hébreu distingue l’action souveraine de Yahvé, qui accorde la victoire, de celle des forces de Juda, qui mènent le combat. Le passage du singulier collectif « Juda » au pluriel « ils » est donc maintenu.
translation_notes:
  register: Français international moderne, sobre et narratif. « Juda monta » garde la concision du récit hébreu; « livra entre leurs mains » reste intelligible tout en préservant son image. La graphie « Bézeq » représente le qoph final et distingue le nom de la forme francisée plus traditionnelle « Bézek ».
