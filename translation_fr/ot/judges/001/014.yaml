base_translation:
  language: en
  yaml_path: translation/ot/judges/001/014.yaml
  text: And when she came[a], she urged him to ask her father for the field. Then she dismounted from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: fr
  text: 'Lorsqu’elle arriva, elle le poussa[a] à demander à son père le champ. Puis elle descendit[b] de l’âne, et Caleb lui demanda : « Que veux-tu ? »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’incita » ou « le persuada ». Le verbe hébreu peut exprimer l’idée de pousser, d’inciter ou de persuader quelqu’un ; dans ce contexte, il ne précise pas la force ni la tonalité de cette influence.
    reason: lexical_alternative
  - marker: b
    text: Ou « descendit de l’âne » ou « se laissa glisser de l’âne ». Le verbe hébreu désigne une descente et peut suggérer un mouvement soudain.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu emploie un idiome qui peut aussi se rendre par « Qu’as-tu ? » ou « Qu’est-ce qui ne va pas ? » ; dans ce contexte, il porte sur sa demande ou son besoin.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: À son arrivée
  rationale: L’infinitif construit précédé de בְּ et muni du suffixe féminin exprime ici le moment de sa venue. « À son arrivée » rend naturellement cette proposition temporelle.
- source_word: וַתְּסִיתֵהוּ
  choice: elle l’incita
  rationale: Le verbe סות peut signifier pousser, inciter ou persuader quelqu’un. « Incita » conserve cette idée d’influence sans préciser si elle a simplement encouragé son mari ou a dû le convaincre.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ הַשָּׂדֶה
  choice: à demander le champ à son père
  rationale: Cette formulation française exprime clairement que le père est la personne sollicitée et que le champ déterminé est l’objet de la demande.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: elle descendit de l’âne
  rationale: Le verbe צנח décrit ici un mouvement vers le bas depuis l’âne. « Descendit » est clair et naturel, tout en évitant d’imposer l’idée d’une chute accidentelle.
- source_word: מַה לָּךְ
  choice: Que veux-tu ?
  rationale: L’expression signifie littéralement « Qu’y a-t-il pour toi ? » Dans ce contexte de requête, « Que veux-tu ? » en restitue bien la portée pragmatique, tout en signalant en note l’autre lecture possible.
- source_word: כָּלֵב
  choice: Caleb
  rationale: La forme française traditionnelle et largement reconnue du nom hébreu כָּלֵב est conservée.
