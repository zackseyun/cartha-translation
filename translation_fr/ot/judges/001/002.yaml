  text: 'Le SEIGNEUR dit : « Juda montera. Voici, j’ai livré le pays dans sa main. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le nom divin selon la convention française courante en petites capitales, sans introduire une vocalisation discutée dans le corps du texte.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Conserve la désignation collective de la tribu sous la forme traditionnelle française.
- source_word: יַעֲלֶה
  choice: montera
  rationale: Reproduit simplement l’idée de monter, ici dans le contexte d’une expédition militaire, sans expliciter davantage que l’hébreu.
- source_word: הִנֵּה
  choice: Voici
  rationale: Maintient la particule qui attire l’attention sur la déclaration divine, dans un registre digne et naturel.
- source_word: נָתַתִּי אֶת־הָאָרֶץ בְּיָדוֹ
  choice: j’ai livré le pays entre ses mains
  rationale: « Livré » exprime la remise effective en pouvoir, tandis que l’expression française « entre ses mains » conserve l’image hébraïque de la main.
theological_decisions:
- issue: Valeur de l’accompli נָתַתִּי pour une conquête encore à réaliser
  choice: j’ai livré
  alternative: je livrerai
  rationale: Le passé composé préserve la forme accomplie de l’hébreu et la certitude de l’acte divin, sans la convertir silencieusement en simple futur.
translation_notes:
  register: Français moderne, sobre et digne. « Répondit » tient compte de la question posée au verset précédent. La formulation conserve la brièveté et la tension entre le commandement de monter et le don déjà déclaré comme accompli.
