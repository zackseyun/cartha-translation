  text: They gave Hebron to Caleb[a], as Moses had said, and he drove out from there the three sons of Anak.
translation:
  language: fr
  text: On donna Hébron à Caleb, comme Moïse l’avait dit, et Caleb en chassa les trois fils d’Anak[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les trois descendants d’Anak » ou « les trois Anakites ». L’hébreu dit « fils d’Anak », expression qui peut désigner des membres de sa lignée plutôt que ses fils immédiats.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לְכָלֵב אֶת חֶבְרוֹן
  choice: On donna Hébron à Caleb
  rationale: Le verbe au pluriel a un sujet non exprimé. Le pronom indéfini « on » est naturel en français et évite d’introduire un référent absent du verset, tout en conservant l’action de donner Hébron à Caleb.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: comme Moïse l’avait dit
  rationale: « Comme » rend la comparaison introduite par כַּאֲשֶׁר, et le plus-que-parfait situe naturellement la parole de Moïse avant l’attribution d’Hébron. « Dit » n’ajoute pas l’idée plus forte de promesse.
- source_word: וַיּוֹרֶשׁ
  choice: et Caleb en chassa
  rationale: Le hiphil de ירש signifie ici faire partir ou déposséder les habitants. « Chassa » est clair et idiomatique. La répétition de « Caleb » lève l’ambiguïté que créerait le simple pronom « il » après « Moïse ».
- source_word: מִשָּׁם
  choice: en
  rationale: Le pronom adverbial « en » renvoie naturellement à Hébron et exprime l’origine indiquée par מִשָּׁם (« de là »), sans lourdeur.
- source_word: אֶת שְׁלֹשָׁה בְּנֵי הָעֲנָק
  choice: les trois fils d’Anak
  rationale: Cette formulation conserve le sens littéral de בְּנֵי. Comme « fils » peut désigner des descendants ou des membres d’un clan, cette possibilité est signalée en note.
