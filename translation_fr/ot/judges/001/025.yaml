base_translation:
  language: en
  yaml_path: translation/ot/judges/001/025.yaml
  text: So he showed them the entrance to the city[a], and they struck the city with the edge of the sword[b]; but they let the man and all his family go.
translation:
  language: fr
  text: Il leur montra l’entrée de la ville, et ils passèrent la ville au fil de l’épée[a], mais laissèrent partir l’homme et toute sa famille[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la bouche de l’épée » ; expression hébraïque signifiant « au fil de l’épée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « toute sa maisonnée » ou « tout son clan ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְאֵם
  choice: Il leur montra
  rationale: 'La forme de ראה a ici une valeur causative : l’homme leur fait voir ou leur indique l’accès à la ville. « Il leur montra » est naturel et précis.'
- source_word: מְבוֹא הָעִיר
  choice: l’entrée de la ville
  rationale: מָבוֹא désigne l’entrée, l’accès ou le chemin permettant d’entrer. « L’entrée de la ville » convient au contexte militaire sans préciser indûment sa nature.
- source_word: וַיַּכּוּ אֶת הָעִיר לְפִי חָרֶב
  choice: Ils passèrent la ville au fil de l’épée
  rationale: נכה exprime l’action de frapper, tandis que לְפִי חָרֶב est l’expression idiomatique « à la bouche de l’épée ». La tournure française « passer au fil de l’épée » restitue naturellement l’action meurtrière visant la ville, comprise ici par métonymie comme ses habitants.
- source_word: שִׁלֵּחוּ
  choice: laissèrent partir
  rationale: Dans ce contexte, le verbe signifie que les assaillants épargnèrent l’homme et les siens et leur permirent de partir.
- source_word: כָּל מִשְׁפַּחְתּוֹ
  choice: toute sa famille
  rationale: מִשְׁפָּחָה peut désigner la famille, la maisonnée ou le clan. « Toute sa famille » est clair et conserve une portée suffisamment large.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Le syntagme défini renvoie directement à l’homme mentionné au verset précédent.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Passer au fil de l’épée » conserve l’image hébraïque sous une forme idiomatique française. Le contraste marqué par וְ est rendu par « mais ». Les deux appels de note figurent dans le texte et correspondent aux ambiguïtés lexicales réelles.
