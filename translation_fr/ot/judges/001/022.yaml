source:
  edition: WLC
  text: וַ/יַּעֲל֧וּ בֵית יוֹסֵ֛ף גַּם הֵ֖ם בֵּֽית אֵ֑ל וַֽ/יהוָ֖ה עִמָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/022.yaml
  text: The house of Joseph also went up against Bethel[a], and Yahweh was with them.
translation:
  language: fr
  text: La maison de Joseph monta, elle aussi, contre Béthel[a], et Yahweh était avec eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « monta à Béthel ». Le verbe hébreu signifie littéralement « monter » ; dans ce contexte militaire, il désigne probablement une avancée contre la ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: monta contre
  rationale: Le verbe עלה signifie littéralement « monter ». Dans ce contexte de campagne militaire, « monter contre » conserve l’image hébraïque tout en indiquant le mouvement hostile vers la ville.
- source_word: בֵית יוֹסֵף
  choice: la maison de Joseph
  rationale: Cette formulation conserve la désignation collective et tribale de l’hébreu sans la réduire explicitement aux seuls descendants.
- source_word: גַּם הֵם
  choice: elle aussi
  rationale: L’expression rattache l’action de la maison de Joseph aux campagnes précédentes. En français, l’accord au féminin singulier avec « maison » rend naturellement le sens collectif.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Forme française traditionnelle et intelligible du nom de lieu hébreu בֵּית־אֵל.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Transcription usuelle en français moderne du nom divin יהוה, qui préserve sa fonction de nom propre.
- source_word: עִמָּם
  choice: était avec eux
  rationale: Rendu direct qui maintient à la fois l’idée de présence et celle de soutien divin, sans préciser davantage ce que l’hébreu laisse implicite.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- issue: Portée de la présence divine
  choice: était avec eux
  alternative: les soutenait
  rationale: La traduction littérale préserve la tension entre présence et faveur sans réduire l’expression à une seule forme d’assistance.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « la maison de Joseph » garde la désignation tribale formelle, tandis que « monta contre » conserve l’idiome militaire hébreu avec une note signalant l’autre lecture possible.
