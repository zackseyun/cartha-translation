base_translation:
  language: en
  yaml_path: translation/ot/judges/001/015.yaml
  text: She said to him[a], “Please give me a blessing, because you have given me the land of the Negev[b]; give me also springs of water.” So Caleb gave her the upper springs and the lower springs.
translation:
  language: fr
  text: 'Elle lui dit : « Je t’en prie, accorde-moi une bénédiction. Puisque tu m’as donné une terre du Néguev[a], donne-moi aussi des sources d’eau[b]. » Caleb lui donna donc les sources d’en haut et les sources d’en bas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une terre du Sud » ou « une terre aride ». Le mot hébreu néguev peut désigner la région méridionale appelée le Néguev, le sud en général ou, par association, une terre sèche.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque peut désigner des sources, des bassins ou d’autres réserves d’eau ; « sources » convient bien au contexte d’une région aride ayant besoin d’un approvisionnement fiable en eau.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה לִּי בְרָכָה
  choice: Je t’en prie, accorde-moi une bénédiction
  rationale: הָבָה introduit ici une demande pressante; « Je t’en prie » en restitue naturellement la nuance. « Bénédiction » conserve le sens premier de בְרָכָה, tout en pouvant désigner dans ce contexte un bienfait concret accordé par le père.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: une terre dans le Néguev
  rationale: נֶגֶב peut être le nom de la région méridionale aride ou une désignation du pays du sud. « Dans le Néguev » est géographiquement clair en français sans effacer l’autre possibilité, signalée en note.
- source_word: גֻּלֹּת מָיִם
  choice: des sources d’eau
  rationale: L’expression désigne des points ou réserves d’eau, dont la nature exacte est incertaine. « Sources d’eau » convient bien à la demande de ressources hydriques dans une région aride.
- source_word: גֻּלֹּת עִלִּית
  choice: les sources d’en haut
  rationale: עִלִּית signifie « supérieure, d’en haut ». Cette formulation conserve le contraste topographique avec les sources d’en bas et reste naturelle.
- source_word: גֻּלֹּת תַּחְתִּית
  choice: les sources d’en bas
  rationale: תַּחְתִּית signifie « inférieure, d’en bas ». La traduction forme avec « d’en haut » la paire contrastée du texte hébreu.
- source_word: וַיִּתֶּן לָהּ כָּלֵב
  choice: Caleb lui donna donc
  rationale: La forme narrative fait avancer le récit et présente le don comme la réponse à sa demande; « donc » rend ce lien de manière fluide.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement correspond à la demande adressée par une fille à son père dans le contexte immédiat. La syntaxe garde le terme concret « bénédiction » et le parallélisme entre les sources d’en haut et celles d’en bas, tout en signalant en notes les ambiguïtés géographique et hydrologique.
