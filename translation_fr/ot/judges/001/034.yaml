  text: וַ/יִּלְחֲצ֧וּ הָ/אֱמֹרִ֛י אֶת בְּנֵי דָ֖ן הָ/הָ֑רָ/ה כִּי לֹ֥א נְתָנ֖/וֹ לָ/רֶ֥דֶת לָ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/034.yaml
  text: And the Amorites pressed the sons of Dan back into the hill country[a], because they did not allow them to go down into the valley.
translation:
  language: fr
  text: Les Amorites repoussèrent les descendants de Dan vers la région montagneuse[a], car ils ne les laissèrent pas descendre dans la vallée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « L’Amorite repoussa les descendants de Dan vers la région montagneuse, car il ne le laissa pas descendre dans la vallée. » L’hébreu emploie le singulier collectif pour désigner ces groupes, tandis que le contexte appelle un sens pluriel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחֲצוּ
  choice: repoussèrent
  rationale: Le verbe exprime une pression hostile qui contraint l’adversaire. « Repoussèrent » rend naturellement ici le mouvement forcé vers la région montagneuse.
- source_word: הָאֱמֹרִי
  choice: les Amorites
  rationale: Bien que l’ethnonyme soit morphologiquement au singulier, il a un sens collectif; le pluriel est naturel en français.
- source_word: בְּנֵי דָן
  choice: les descendants de Dan
  rationale: Cette formulation conserve l’image généalogique et tribale de l’hébreu tout en étant plus naturelle en français moderne que « les fils de Dan » dans ce contexte.
- source_word: הָהָרָה
  choice: vers la région montagneuse
  rationale: La forme directionnelle marque un mouvement vers la zone montagneuse; « région montagneuse » convient au contraste topographique avec la vallée.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la situation décrite; « car » garde un ton narratif digne et clair.
- source_word: לֹא נְתָנוֹ
  choice: ils ne les laissèrent pas
  rationale: L’hébreu emploie des formes collectives au singulier, mais les deux groupes sont rendus au pluriel en français pour exprimer clairement le sens contextuel.
- source_word: לָרֶדֶת
  choice: descendre
  rationale: Le verbe conserve explicitement le mouvement topographique depuis les hauteurs.
- source_word: לָעֵמֶק
  choice: dans la vallée
  rationale: « Vallée » est l’équivalent direct et forme un contraste clair avec la région montagneuse.
