  text: וּ/גְבוּל֙ הָ/אֱמֹרִ֔י מִֽ/מַּעֲלֵ֖ה עַקְרַבִּ֑ים מֵ/הַ/סֶּ֖לַע וָ/מָֽעְלָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/036.yaml
  text: And the border of the Amorites was from the Ascent of Akrabbim[b][a], from Sela and upward.
translation:
  language: fr
  text: La frontière des Amorites allait de la montée d’Akrabbim[a], depuis Séla[b], vers le haut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Akrabbim signifie « scorpions » ; autre traduction possible : « la montée des Scorpions ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le rocher », si l’hébreu est compris comme un nom commun plutôt que comme le nom de lieu Séla.'
    reason: alternative_reading
lexical_decisions:
- source_word: גְבוּל
  choice: frontière
  rationale: Le nom désigne ici la ligne délimitant un territoire, plutôt que le territoire lui-même.
- source_word: הָאֱמֹרִי
  choice: des Amorites
  rationale: Bien que l’ethnonyme soit morphologiquement au singulier, il a ici un sens collectif; le pluriel est naturel en français.
- source_word: מִמַּעֲלֵה עַקְרַבִּים
  choice: de la montée d’Akrabbim
  rationale: מַעֲלֵה désigne une montée ou un passage ascendant, et עַקְרַבִּים fait partie d’un toponyme connu. La translittération conserve le nom propre, tandis que son sens littéral est signalé en note.
- source_word: מֵהַסֶּלַע
  choice: depuis Séla
  rationale: Dans cette indication géographique, le mot est vraisemblablement un toponyme. La possibilité de comprendre le nom commun « le rocher » est conservée en note.
- source_word: וָמָעְלָה
  choice: vers les hauteurs
  rationale: L’expression indique une continuation dans une direction ascendante ou au-delà vers le haut; cette formulation est naturelle en français tout en préservant le sens spatial.
- source_word: וּ
  choice: La
  rationale: La coordination hébraïque relie cette notice au contexte précédent. En français, aucune conjonction initiale n’est nécessaire pour reproduire naturellement ce lien narratif.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et géographique. « Allait de… depuis… vers les hauteurs » garde les deux indications introduites par מִן et le mouvement ascendant final sans imposer une reconstruction topographique plus précise que l’hébreu.
