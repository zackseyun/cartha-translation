source:
  edition: WLC
  text: וַ/יֵּ֤לֶךְ יְהוּדָה֙ אֶת שִׁמְע֣וֹן אָחִ֔י/ו וַ/יַּכּ֕וּ אֶת הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב צְפַ֑ת וַ/יַּחֲרִ֣ימוּ אוֹתָ֔/הּ וַ/יִּקְרָ֥א אֶת שֵׁם הָ/עִ֖יר חָרְמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/017.yaml
  text: Then Judah went with Simeon his brother[a], and they struck down the Canaanites living in Zephath and devoted it to destruction[c][b]; so they called the name of the city Hormah.
translation:
  language: fr
  text: Juda partit avec son frère Siméon. Ils battirent les Cananéens qui habitaient Tsephath et vouèrent la ville à la destruction[a]. Puis il donna à la ville le nom de Horma[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « détruisirent entièrement la ville » ou « la frappèrent d’interdit ». Le verbe hébreu désigne le fait de vouer quelque chose de manière irrévocable, souvent par sa destruction.
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu emploie ici le singulier : « il donna ». Celui-ci renvoie probablement à Juda, considéré comme un groupe ou représenté par son chef. On pourrait aussi traduire, en harmonisant avec les verbes précédents : « ils donnèrent ».'
    reason: alternative_reading
  - marker: c
    text: Le nom Horma rappelle en hébreu le mot ḥerem, qui désigne ce qui est voué à la destruction; ce jeu de mots explique le nom de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶת שִׁמְעוֹן אָחִיו
  choice: Juda partit avec son frère Siméon
  rationale: Le verbe הלך signifie « aller, partir » et אֶת introduit ici l’accompagnement. Cette formulation française rend clairement l’association de Juda et de Siméon sans transformer implicitement le déplacement en marche militaire.
- source_word: וַיַּכּוּ אֶת הַכְּנַעֲנִי
  choice: Ils battirent les Cananéens
  rationale: Dans un récit militaire, נכה exprime une attaque victorieuse ou une défaite infligée. « Battirent » est naturel en français et évite de préciser indûment que chaque personne fut tuée. Le singulier hébreu « le Cananéen » a ici un sens collectif, rendu au pluriel.
- source_word: יוֹשֵׁב צְפַת
  choice: qui habitaient Tsephath
  rationale: Le participe ישב désigne ceux qui résident dans un lieu. La relative est idiomatique en français et conserve le rapport avec la population cananéenne.
- source_word: וַיַּחֲרִימוּ אוֹתָהּ
  choice: vouèrent la ville à la destruction
  rationale: Le verbe חרם associe l’idée d’une mise à part irrévocable à celle de la destruction. Cette traduction maintient les deux dimensions. « La ville » explicite sobrement le référent féminin de אוֹתָהּ, à savoir Tsephath.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: il donna à la ville le nom de
  rationale: Le verbe est morphologiquement au singulier. « Donner à la ville le nom de » rend naturellement en français la formule hébraïque littérale « appeler le nom de la ville ».
- source_word: חָרְמָה
  choice: Horma
  rationale: Le nom propre est translittéré selon l’usage français. Son lien sonore et étymologique avec חרם est signalé en note plutôt que développé dans le texte.
theological_decisions:
- issue: Sens de חרם dans le contexte de la guerre
  choice: vouèrent la ville à la destruction
  alternative: détruisirent entièrement la ville / frappèrent la ville d’anathème
  rationale: 'L’hébreu ne désigne pas seulement une destruction militaire : il implique une affectation irrévocable, généralement réalisée par la destruction. La formulation retenue préserve cette tension sans employer le terme confessionnellement chargé et moins transparent « anathème ».'
- issue: Sujet singulier de וַיִּקְרָא après des verbes pluriels
  choice: il donna à la ville le nom de
  alternative: ils donnèrent à la ville le nom de
  rationale: Le texte massorétique porte un verbe singulier, qui peut renvoyer à Juda envisagé comme sujet collectif ou représentatif. Le texte principal conserve cette forme au lieu de l’harmoniser silencieusement avec les verbes pluriels précédents.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent une translittération française accessible. Le texte conserve le passage du pluriel (« ils battirent », « vouèrent ») au singulier (« il donna »), tout en l’expliquant en note.
