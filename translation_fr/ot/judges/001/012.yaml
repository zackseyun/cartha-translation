  yaml_path: translation/ot/judges/001/012.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him my daughter Achsah as a wife.”
translation:
  language: fr
  text: 'Caleb dit[a] : « Celui qui attaquera Qiryath-Sépher et s’en emparera, je lui donnerai ma fille Aksa pour femme. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quiconque attaquera Qiryath-Sépher et s’en emparera, je lui donnerai ma fille Aksa pour femme. »'
    reason: Alternative française idiomatique pour la relative indéfinie introduite par אֲשֶׁר.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit; le passé simple convient au registre narratif français sans surcharger la nuance temporelle.
- source_word: כָּלֵב
  choice: Caleb
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: אֲשֶׁר
  choice: celui qui
  rationale: La proposition relative est indéfinie et lance un défi ouvert. « Celui qui » reste naturel et permet de signaler en note l’autre analyse syntaxique possible.
- source_word: יַכֶּה
  choice: attaquera
  rationale: Le hiphil de נכה désigne ici une action militaire dirigée contre la ville. « Attaquer » est plus naturel en français moderne que le littéral « frapper » dans ce contexte.
- source_word: קִרְיַת סֵפֶר
  choice: Qiryath-Sépher
  rationale: Translittération française du toponyme, avec trait d’union pour refléter son unité composée.
- source_word: וּלְכָדָהּ
  choice: et s’en emparera
  rationale: לכד exprime la prise militaire de la ville; le pronom « en » reprend naturellement le lieu en français.
- source_word: וְנָתַתִּי לוֹ
  choice: je lui donnerai
  rationale: Rend directement la promesse de Caleb, conditionnée par la conquête exprimée dans la proposition précédente.
- source_word: עַכְסָה
  choice: Aksa
  rationale: Translittération française claire du nom hébreu, sans conserver une graphie anglaise.
- source_word: בִתִּי
  choice: ma fille
  rationale: Préserve explicitement le lien familial qui est essentiel à la proposition de Caleb.
- source_word: לְאִשָּׁה
  choice: pour femme
  rationale: Expression française concise et traditionnelle qui rend l’idiome hébreu du don en mariage.
