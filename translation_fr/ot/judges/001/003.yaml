  text: וַ/יֹּ֣אמֶר יְהוּדָה֩ לְ/שִׁמְע֨וֹן אָחִ֜י/ו עֲלֵ֧ה אִתִּ֣/י בְ/גוֹרָלִ֗/י וְ/נִֽלָּחֲמָה֙ בַּֽ/כְּנַעֲנִ֔י וְ/הָלַכְתִּ֧י גַם אֲנִ֛י אִתְּ/ךָ֖ בְּ/גוֹרָלֶ֑/ךָ וַ/יֵּ֥לֶךְ אִתּ֖/וֹ שִׁמְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/003.yaml
  text: And Judah said to Simeon his brother[a], “Come up with me into my allotted territory, and let us fight against the Canaanites; and I too will go with you into your allotted territory.” So Simeon went with him.
translation:
  language: fr
  text: 'Juda dit à son frère Siméon : « Monte avec moi dans le territoire qui m’est attribué[a], et combattons les Cananéens. Moi aussi, j’irai avec toi dans le territoire qui t’est attribué. » Alors Siméon alla avec lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mon lot » et, plus loin, « ton lot » ; il s’agit du territoire attribué par tirage au sort.'
    reason: Préciser le sens littéral et la métonymie territoriale de גּוֹרָל.
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוּדָה
  choice: Juda dit
  rationale: Le wayyiqtol poursuit le récit. En français, le passé simple exprime naturellement cette succession sans qu’il soit nécessaire d’ajouter systématiquement une conjonction.
- source_word: לְשִׁמְעוֹן אָחִיו
  choice: à son frère Siméon
  rationale: Conserve explicitement le lien fraternel, qui convient aussi à la représentation des tribus issues des deux frères.
- source_word: עֲלֵה אִתִּי
  choice: Monte avec moi
  rationale: Le verbe עלה garde ici son sens de montée ou de progression vers le territoire concerné; l’impératif français est direct et naturel.
- source_word: בְּגוֹרָלִי / בְּגוֹרָלֶךָ
  choice: dans le territoire qui m’est attribué / qui t’est attribué
  rationale: גּוֹרָל désigne littéralement le « lot », mais, par métonymie dans ce contexte, le territoire attribué par tirage au sort. La formulation rend clairement le référent géographique tout en signalant l’attribution.
- source_word: וְנִלָּחֲמָה
  choice: et combattons
  rationale: La forme cohortative invite à une action commune; « combattons » en restitue la force exhortative.
- source_word: בַּכְּנַעֲנִי
  choice: les Cananéens
  rationale: Le singulier hébreu est collectif et désigne ici le peuple cananéen; le pluriel est idiomatique en français.
- source_word: וְהָלַכְתִּי גַם אֲנִי אִתְּךָ
  choice: À mon tour, j’irai avec toi
  rationale: Cette formulation rend l’insistance de גַם אֲנִי et le caractère réciproque de l’engagement.
- source_word: וַיֵּלֶךְ אִתּוֹ שִׁמְעוֹן
  choice: Alors Siméon alla avec lui
  rationale: Le passé simple maintient le registre narratif, tandis que « Alors » marque sobrement la suite et l’acceptation de la proposition.
theological_decisions:
- issue: Portée de אָחִיו
  choice: son frère
  alternative: son parent / son allié
  rationale: Le texte emploie explicitement le vocabulaire de la fraternité. Le contexte tribal ne justifie pas d’en atténuer l’image généalogique.
- issue: Sens de גּוֹרָל dans le partage du pays
  choice: territoire qui m’est attribué
  alternative: mon lot
  rationale: Le mot conserve l’idée d’une attribution par le sort, mais désigne concrètement ici la zone territoriale dans laquelle doit se dérouler le combat. La note préserve le sens littéral.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit sans rendre la phrase archaïque. Les paroles directes restent concises et énergiques.
