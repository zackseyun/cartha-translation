  text: וַ/יֵּ֣לֶךְ יְהוּדָ֗ה אֶל הַֽ/כְּנַעֲנִי֙ הַ/יּוֹשֵׁ֣ב בְּ/חֶבְר֔וֹן וְ/שֵׁם חֶבְר֥וֹן לְ/פָנִ֖ים קִרְיַ֣ת אַרְבַּ֑ע וַ/יַּכּ֛וּ אֶת שֵׁשַׁ֥י וְ/אֶת אֲחִימַ֖ן וְ/אֶת תַּלְמָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/010.yaml
  text: Then Judah went against the Canaanites living in Hebron (Hebron’s former name was Kiriath-arba)[a], and they struck down Sheshai, Ahiman[c][b], and Talmai.
translation:
  language: fr
  text: Puis Juda marcha contre les Cananéens qui habitaient à Hébron — autrefois, Hébron s’appelait Qiryath-Arba[a] — et ils battirent Shéshaï, Ahimân et Talmaï[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le nom d’Hébron était autrefois Qiryath-Arba ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « frappèrent » ou « abattirent ». Dans ce contexte militaire, le verbe hébreu peut exprimer le fait de vaincre ou de tuer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: marcha contre
  rationale: Le verbe signifie littéralement « aller », mais אֶל devant un adversaire, dans ce récit militaire, indique une avancée hostile. « Marcha contre » conserve l’idée de déplacement tout en rendant clairement le contexte.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Le nom singulier désigne collectivement la tribu. Garder « Juda » suit la forme hébraïque, tandis que le verbe pluriel « ils battirent » laisse percevoir cette valeur collective.
- source_word: הַכְּנַעֲנִי
  choice: les Cananéens
  rationale: Bien que la forme hébraïque soit au singulier, elle fonctionne vraisemblablement ici comme un collectif désignant ce peuple.
- source_word: הַיּוֹשֵׁב בְּחֶבְרוֹן
  choice: qui habitaient à Hébron
  rationale: Le participe exprime une résidence établie. Cette tournure est naturelle en français moderne et s’accorde avec le collectif rendu au pluriel.
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים קִרְיַת אַרְבַּע
  choice: autrefois, Hébron s’appelait Qiryath-Arba
  rationale: La formulation rend idiomatiquement l’indication de l’ancien nom de la ville, sans modifier son sens.
- source_word: וַיַּכּוּ
  choice: ils battirent
  rationale: Dans un contexte militaire, נכה peut désigner le fait de frapper, vaincre ou abattre. « Battirent » exprime une défaite militaire décisive sans imposer que chacun ait nécessairement été tué.
- source_word: שֵׁשַׁי וְאֶת אֲחִימַן וְאֶת תַּלְמָי
  choice: Shéshaï, Ahimân et Talmaï
  rationale: Ces noms propres sont translittérés selon des conventions françaises lisibles.
theological_decisions: []
