source:
  edition: WLC
  text: וְ/לֹא הוֹרִ֣ישׁ מְנַשֶּׁ֗ה אֶת בֵּית שְׁאָ֣ן וְ/אֶת בְּנוֹתֶי/הָ֮ וְ/אֶת תַּעְנַ֣ךְ וְ/אֶת בְּנֹתֶי/הָ֒ וְ/אֶת ישב ד֜וֹר וְ/אֶת בְּנוֹתֶ֗י/הָ וְ/אֶת יוֹשְׁבֵ֤י יִבְלְעָם֙ וְ/אֶת בְּנֹתֶ֔י/הָ וְ/אֶת יוֹשְׁבֵ֥י מְגִדּ֖וֹ וְ/אֶת בְּנוֹתֶ֑י/הָ וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/027.yaml
  text: But Manasseh did not dispossess Beth-shean and its daughter towns[a], or Taanach and its daughter towns, or the inhabitants of Dor and its daughter towns, or the inhabitants of Ibleam and its daughter towns, or the inhabitants of Megiddo and its daughter towns[b]; and the Canaanites persisted in dwelling in this land.
translation:
  language: fr
  text: Mais Manassé ne déposséda pas les habitants de Beth-Shéân et de ses localités dépendantes[a], ni les habitants de Taanak et de ses localités dépendantes, ni les habitants de Dor et de ses localités dépendantes, ni les habitants de Yibléam et de ses localités dépendantes, ni les habitants de Meguiddo et de ses localités dépendantes. Les Cananéens étaient déterminés à habiter dans ce pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « ses filles » : les petites villes ou implantations qui dépendaient de la ville principale.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « Les Cananéens consentirent à habiter dans ce pays. » Le verbe hébreu peut exprimer le consentement, la volonté ou la détermination.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: ne déposséda pas
  rationale: Le hifil de ירשׁ signifie ici faire perdre à quelqu’un la possession d’un territoire. « Déposséder » conserve cette valeur causative, sans réduire l’action à une simple expulsion militaire.
- source_word: בְּנוֹתֶיהָ
  choice: les localités qui en dépendaient
  rationale: 'Littéralement « ses filles » : idiome désignant les petites villes ou implantations rattachées à une ville principale. La formulation française explicite naturellement le rapport de dépendance, tandis que la note signale la métaphore hébraïque.'
- source_word: ישב דּוֹר / יוֹשְׁבֵי יִבְלְעָם / יוֹשְׁבֵי מְגִדּוֹ
  choice: les habitants de Dor… de Yibléam… de Meguiddo
  rationale: Les formes participiales de ישׁב désignent collectivement les personnes établies dans ces villes. « Habitants » est précis et naturel en français.
- source_word: וַיּוֹאֶל
  choice: persistèrent
  rationale: Le verbe יאל peut exprimer le consentement, la volonté ou la détermination. Dans ce contexte, « persistèrent » rend idiomatiquement leur volonté durable de rester, sans effacer les autres nuances possibles, indiquées en note.
- source_word: הַכְּנַעֲנִי
  choice: les Cananéens
  rationale: Bien que le terme hébreu soit morphologiquement singulier, il a ici une valeur collective. Le pluriel est la tournure française naturelle.
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: à habiter dans ce pays
  rationale: L’infinitif avec ל précise l’action voulue ou poursuivie. « Ce pays » conserve la valeur démonstrative de הַזֹּאת et convient ici mieux que « cette terre ».
- source_word: בֵּית שְׁאָן / תַּעְנַךְ / דּוֹר / יִבְלְעָם / מְגִדּוֹ
  choice: Beth-Shéân, Taanak, Dor, Yibléam, Meguiddo
  rationale: Les toponymes sont translittérés selon des formes françaises lisibles et largement reconnaissables, tout en restant proches de l’hébreu.
theological_decisions:
- issue: Nuance de la volonté cananéenne dans וַיּוֹאֶל
  choice: Les Cananéens persistèrent à habiter dans ce pays
  alternative: Le Cananéen fut déterminé à habiter dans ce pays
  rationale: Le texte décrit une volonté ou une détermination à demeurer. Le choix principal exprime le résultat durable dans un français naturel; la note préserve la lecture plus formelle centrée sur la détermination.
translation_notes:
  register: Français international moderne, digne et accessible. La longue énumération hébraïque est conservée, avec « ni » pour en clarifier la syntaxe. « Localités qui en dépendaient » évite l’expression peu naturelle « villes-filles » dans le corps du texte, tout en conservant l’image littérale dans la note.
