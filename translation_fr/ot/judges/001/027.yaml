  to: Mais Manassé ne déposséda pas les habitants de Beth-Shéân et de ses localités dépendantes[a], ni les habitants de Taanak et de ses localités dépendantes, ni les habitants de Dor et de ses localités dépendantes, ni les habitants de Yibléam et de ses localités dépendantes, ni les habitants de Meguiddo et de ses localités dépendantes. Les Cananéens étaient déterminés à habiter dans ce pays[b].
