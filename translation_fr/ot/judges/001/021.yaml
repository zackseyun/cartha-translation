id: JDG.1.21
reference: Judges 1:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת הַ/יְבוּסִי֙ יֹשֵׁ֣ב יְרֽוּשָׁלִַ֔ם לֹ֥א הוֹרִ֖ישׁוּ בְּנֵ֣י בִנְיָמִ֑ן וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י בִנְיָמִן֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/021.yaml
  text: But the sons of Benjamin did not drive out the Jebusites who were living in Jerusalem[a], so the Jebusites have lived with the sons of Benjamin in Jerusalem to this day.
translation:
  language: fr
  text: Mais les descendants de Benjamin ne chassèrent pas les Jébusiens[a] qui habitaient Jérusalem. Les Jébusiens ont donc habité avec les descendants de Benjamin à Jérusalem jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement le singulier collectif « le Jébusien » pour désigner ici le peuple jébusien.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: les Jébusiens
  rationale: L’hébreu emploie un singulier collectif pour désigner l’ensemble du peuple jébusien. Le pluriel est la tournure naturelle en français.
- source_word: יֹשֵׁב יְרוּשָׁלַם
  choice: qui habitaient Jérusalem
  rationale: Le participe exprime une résidence durable. En français, « habiter » se construit naturellement sans préposition devant un nom de ville.
- source_word: הוֹרִישׁוּ
  choice: ne chassèrent pas
  rationale: Dans le contexte de la prise et de l’occupation du pays, le verbe signifie expulser ou déposséder les habitants. « Chasser » est clair et idiomatique.
- source_word: בְּנֵי בִנְיָמִן
  choice: les descendants de Benjamin
  rationale: Cette formulation conserve la dimension généalogique de l’expression hébraïque tout en étant plus naturelle en français moderne que « les fils de Benjamin » pour désigner la tribu.
- source_word: וַיֵּשֶׁב
  choice: ont donc habité
  rationale: Le passé composé, joint à « jusqu’à ce jour », présente une situation commencée dans le passé et prolongée jusqu’au temps du narrateur. « Donc » explicite sobrement la conséquence contextuelle de l’échec à les chasser.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: avec les descendants de Benjamin
  rationale: 'אֶת a ici une valeur d’accompagnement : les deux groupes résident ensemble à Jérusalem.'
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Formule française consacrée qui correspond à l’indication hébraïque d’une situation se prolongeant jusqu’à l’époque du narrateur.
- source_word: וְ
  choice: Mais
  rationale: Dans le contexte, la conjonction introduit un contraste avec les récits de conquête précédents.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Descendants de Benjamin » garde la coloration tribale et généalogique sans l’ambiguïté possible de « fils » en français courant. Le singulier collectif hébreu est rendu naturellement au pluriel.
