source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ הַ/שֹּׁ֣מְרִ֔ים אִ֖ישׁ יוֹצֵ֣א מִן הָ/עִ֑יר וַ/יֹּ֣אמְרוּ ל֗/וֹ הַרְאֵ֤/נוּ נָא֙ אֶת מְב֣וֹא הָ/עִ֔יר וְ/עָשִׂ֥ינוּ עִמְּ/ךָ֖ חָֽסֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/024.yaml
  text: The watchers saw a man coming out of the city[a], and they said to him, “Please show us the entrance to the city[b], and we will deal kindly with you.”
translation:
  language: fr
  text: 'Les hommes qui surveillaient virent un homme sortir de la ville. Ils lui dirent : « Montre-nous, s’il te plaît, l’accès[a] à la ville, et nous te traiterons avec bonté[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par où entrer dans la ville » ; ou : « l’entrée de la ville ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : ḥèsèd, terme qui peut aussi exprimer la fidélité, la loyauté ou l’amour constant, selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  choice: les hommes qui surveillaient
  rationale: Le participe de שׁמר désigne ceux qui observaient ou montaient la garde. Cette formulation conserve le sens verbal sans leur attribuer un rang militaire précis ni les confondre avec les défenseurs de la ville.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom singulier désigne ici simplement un individu de sexe masculin.
- source_word: יוֹצֵא
  choice: sortir
  rationale: Le participe de יצא décrit l’homme en train de quitter la ville. L’infinitif après « virent » donne une formulation française naturelle.
- source_word: מְבוֹא
  choice: l’accès
  rationale: מְבוֹא peut désigner l’entrée ou le moyen d’entrer. « L’accès » convient au contexte militaire tout en laissant ouverte la question de savoir s’il s’agit d’une entrée visible ou d’un passage permettant de pénétrer dans la ville.
- source_word: נָא
  choice: s’il te plaît
  rationale: La particule adoucit l’impératif ; cette expression en donne un équivalent courant et naturel en français moderne.
- source_word: וְעָשִׂינוּ עִמְּךָ חָסֶד
  choice: nous agirons avec bonté envers toi
  rationale: Dans cette négociation, חֶסֶד exprime surtout un traitement favorable ou bienveillant promis en échange d’un renseignement. La formulation conserve la dimension relationnelle sans imposer ici un sens explicitement alliance ou théologique.
theological_decisions:
- issue: Sens de חֶסֶד dans cette promesse
  choice: bonté ou traitement favorable
  alternative: fidélité, loyauté ou amour constant
  rationale: Bien que חֶסֶד puisse évoquer la fidélité et l’amour loyal dans d’autres contextes, il désigne ici le geste bienveillant promis à l’homme. Une formulation plus chargée sur le plan de l’alliance irait au-delà de ce qu’exige la scène.
translation_notes:
  register: Français international moderne, naturel et digne. « Les hommes qui surveillaient » évite l’ambiguïté de « gardes », qui pourrait faire penser aux défenseurs de la ville. Le dialogue reste direct, sans archaïsme.
