  text: וַֽ/יִּלְכְּדָ/הּ֙ עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֣ן מִמֶּ֑/נּוּ וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/013.yaml
  text: Othniel son of Kenaz[a], Caleb’s younger brother, captured it, and he gave him his daughter Achsah as a wife.
translation:
  language: fr
  text: Otniel, fils de Kenaz et frère cadet de Caleb, s’empara de la ville. Caleb lui donna sa fille Acsa comme épouse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « un parent plus jeune de Caleb ». L’hébreu se lit le plus naturellement « le frère de Caleb, plus jeune que lui », mais certains comprennent ici le terme traduit par « frère » dans un sens plus large.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: s’empara de la ville
  rationale: Le verbe לכד exprime ici la prise militaire de la ville mentionnée au verset précédent. Le complément féminin singulier est explicité par « la ville » afin d’éviter en français un pronom sans antécédent dans le verset isolé.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Translittération française usuelle du nom hébreu.
- source_word: בֶּן קְנַז
  choice: fils de Qenaz
  rationale: Rend directement la construction généalogique hébraïque; « Qenaz » reflète la consonne initiale hébraïque qoph.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: le frère cadet de Caleb
  rationale: Le sens syntaxique le plus naturel est « frère de Caleb, plus jeune que lui ». La possibilité d’un terme de parenté plus large est conservée en note.
- source_word: וַיִּתֶּן לוֹ
  choice: Caleb lui donna alors
  rationale: Le sujet implicite est Caleb d’après le contexte. Son nom est explicité pour lever l’ambiguïté que produirait en français une succession de pronoms masculins.
- source_word: עַכְסָה
  choice: Aksa
  rationale: Translittération française claire et proche de la forme hébraïque.
- source_word: בִתּוֹ
  choice: sa fille
  rationale: Le possessif renvoie à Caleb, sujet explicité dans la proposition.
- source_word: לְאִשָּׁה
  choice: pour femme
  rationale: Expression française naturelle et digne correspondant à l’idiome hébreu du don en mariage.
theological_decisions:
- issue: Lien de parenté entre Otniel et Caleb
  choice: Otniel est présenté dans le texte principal comme le frère cadet de Caleb.
  alternative: Otniel peut être compris comme un parent plus jeune de Caleb, éventuellement son neveu.
  rationale: L’hébreu se lit le plus naturellement « frère de Caleb, plus jeune que lui », mais le nom de parenté peut parfois recevoir un sens plus large. Le texte principal suit la syntaxe la plus directe et la note préserve l’autre compréhension sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms suivent des translittérations françaises lisibles. Le second « Caleb » est explicité pour assurer la clarté des référents sans modifier le sens du récit.
