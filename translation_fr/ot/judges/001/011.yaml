source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ מִ/שָּׁ֔ם אֶל יוֹשְׁבֵ֖י דְּבִ֑יר וְ/שֵׁם דְּבִ֥יר לְ/פָנִ֖ים קִרְיַת סֵֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/011.yaml
  text: From there he went against the inhabitants of Debir[b][a]. (The former name of Debir was Kiriath-sepher.)
translation:
  language: fr
  text: De là, il marcha contre les habitants de Debir[a]. (Debir s’appelait autrefois Qiryath-Sépher[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers les habitants de Debir ». La préposition hébraïque signifie plus littéralement « vers », mais elle décrit ici un mouvement hostile dans un récit de conquête.
    reason: lexical_alternative
  - marker: b
    text: Qiryath-Sépher est l’ancien nom de Debir. Ce nom pourrait signifier « Ville du Livre » ou « Ville du ou des scribes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: il marcha
  rationale: Le verbe signifie fondamentalement « aller ». Dans ce récit de conquête, « marcha » exprime naturellement un déplacement militaire sans préciser indûment la forme de l’attaque.
- source_word: מִשָּׁם
  choice: De là
  rationale: Rend directement l’indication du point de départ et s’insère naturellement dans le récit.
- source_word: אֶל
  choice: contre
  rationale: La préposition signifie littéralement « vers » ou « à ». Ici, le contexte de conquête indique un mouvement hostile, que le français rend naturellement par « contre ».
- source_word: יוֹשְׁבֵי
  choice: les habitants de
  rationale: Le participe substantivé désigne les personnes qui résident dans le lieu; cette formulation est claire et digne en français moderne.
- source_word: דְּבִיר
  choice: Debir
  rationale: Nom de lieu conservé par translittération.
- source_word: וְשֵׁם דְּבִיר לְפָנִים
  choice: Debir s’appelait autrefois
  rationale: Formulation française naturelle qui conserve le sens temporel de לְפָנִים et la relation entre les deux noms.
- source_word: קִרְיַת סֵפֶר
  choice: Qiryath-Sépher
  rationale: Le toponyme est translittéré plutôt que traduit; sa signification étymologique reste incertaine et est signalée en note.
theological_decisions: []
