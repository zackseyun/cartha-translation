  variant: modern international French
source:
  edition: WLC
  text: וּ/בְנֵ֣י קֵינִי֩ חֹתֵ֨ן מֹשֶׁ֜ה עָל֨וּ מֵ/עִ֤יר הַ/תְּמָרִים֙ אֶת בְּנֵ֣י יְהוּדָ֔ה מִדְבַּ֣ר יְהוּדָ֔ה אֲשֶׁ֖ר בְּ/נֶ֣גֶב עֲרָ֑ד וַ/יֵּ֖לֶךְ וַ/יֵּ֥שֶׁב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/016.yaml
  text: And the descendants of the Kenite[a], Moses’ father-in-law, went up from the City of Palms with the descendants of Judah into the wilderness of Judah, which is in the Negev of Arad[d][c][b]; then he went and settled with the people.
translation:
  language: fr
  text: Les descendants du Qénien[a], beau-père de Moïse, montèrent de la Ville des Palmiers[b] avec les descendants de Juda vers le désert de Juda, qui se trouve dans le Néguev d’Arad. Puis il partit et s’établit avec le peuple.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le parent par alliance de Moïse »; le terme hébreu peut avoir un sens plus large que « beau-père », bien que ce dernier sens soit le plus courant ici.
    reason: lexical_alternative
  - marker: b
    text: La « Ville des Palmiers » désigne généralement Jéricho.
    reason: cross_reference
  - marker: c
    text: 'L’hébreu passe ici au singulier : « il partit et s’établit ». Il peut s’agir du clan qénien considéré collectivement; certains comprennent néanmoins la phrase au pluriel.'
    reason: grammatical_ambiguity
  - marker: d
    text: Ou « parmi le peuple ». Certains témoins anciens portent « avec Amalec » au lieu de « avec le peuple ».
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי קֵינִי
  choice: Les descendants du Qénien
  rationale: בְּנֵי désigne ici les descendants ou membres du clan; « Qénien » est la forme française biblique usuelle du gentilé.
- source_word: חֹתֵן מֹשֶׁה
  choice: beau-père de Moïse
  rationale: חֹתֵן signifie le plus souvent « beau-père », tout en pouvant désigner plus largement un parent par alliance; cette nuance est signalée en note.
- source_word: עָלוּ מֵעִיר הַתְּמָרִים
  choice: montèrent de la Ville des Palmiers
  rationale: La formulation conserve le verbe de montée et traduit littéralement le toponyme descriptif plutôt que de le remplacer par son identification probable, Jéricho.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: avec les descendants de Juda
  rationale: אֶת a ici une valeur associative, et בְּנֵי désigne le groupe issu de Juda.
- source_word: מִדְבַּר יְהוּדָה
  choice: vers le désert de Juda
  rationale: Le syntagme indique la destination; « vers » est naturel en français sans exagérer l’idée d’entrée, absente de toute préposition explicite dans l’hébreu.
- source_word: אֲשֶׁר בְּנֶגֶב עֲרָד
  choice: qui se trouve dans le Néguev d’Arad
  rationale: נֶגֶב peut désigner le Néguev comme région ou la zone méridionale; la formulation géographique conserve cette ouverture.
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: Puis il alla s’établir
  rationale: Les verbes sont morphologiquement au singulier. La traduction maintient ce changement de nombre et rend idiomatiquement la succession narrative ainsi que l’établissement durable.
- source_word: אֶת הָעָם
  choice: avec le peuple
  rationale: Le texte massorétique porte « avec le peuple »; l’identité de ce peuple demeure implicite, et la variante ancienne « avec Amalec » est réservée à la note.
theological_decisions:
- issue: Identification du sujet singulier dans וַיֵּלֶךְ וַיֵּשֶׁב
  choice: Maintenir « il » sans identifier davantage le sujet
  alternative: 'Harmoniser au pluriel: « ils allèrent s’établir »'
  rationale: Le texte hébreu passe réellement du pluriel au singulier. Il peut s’agir du Qénien envisagé collectivement, mais la traduction ne doit pas résoudre silencieusement cette difficulté.
- issue: Identification de הָעָם
  choice: Conserver « le peuple »
  alternative: Préciser « le peuple de Juda » ou adopter « Amalec »
  rationale: Le référent reste implicite dans le texte massorétique; préciser Juda serait interprétatif, tandis qu’« Amalec » relève de témoins anciens divergents.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms propres suivent l’usage biblique français courant. Le changement inattendu du pluriel au singulier et l’ambiguïté du dernier groupe prépositionnel sont conservés plutôt qu’harmonisés.
