  text: וַ/יָּתִ֥ירוּ בֵית יוֹסֵ֖ף בְּ/בֵֽית אֵ֑ל וְ/שֵׁם הָ/עִ֥יר לְ/פָנִ֖ים לֽוּז־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/023.yaml
  text: And the house of Joseph spied out Bethel[a]; formerly the name of the city was Luz.
translation:
  language: fr
  text: La maison de Joseph fit une reconnaissance de Béthel[a]. Autrefois, la ville s’appelait Louz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « explora Béthel » ou « repéra Béthel ». Le verbe hébreu évoque ici l’exploration ou la reconnaissance d’un lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּתִירוּ
  choice: fit une reconnaissance de
  rationale: Le verbe désigne ici l’action d’examiner ou de repérer un lieu, vraisemblablement dans un contexte militaire. « Faire une reconnaissance de » est naturel en français et conserve cette nuance sans préciser explicitement l’envoi d’espions.
- source_word: בֵית יוֹסֵף
  choice: la maison de Joseph
  rationale: Cette formulation conserve la désignation collective et tribale de l’hébreu sans en fixer plus précisément la portée sociale.
- source_word: בְּבֵית אֵל
  choice: de Béthel
  rationale: Avec « faire une reconnaissance », le français demande naturellement « de » pour introduire le lieu examiné.
- source_word: וְשֵׁם הָעִיר לְפָנִים לוּז
  choice: Autrefois, la ville s’appelait Louz
  rationale: Cette tournure idiomatique restitue exactement l’information selon laquelle Louz était auparavant le nom de la ville, tout en évitant une structure inutilement lourde.
- source_word: לוּז
  choice: Louz
  rationale: Le nom propre est translittéré sous sa forme française traditionnelle.
