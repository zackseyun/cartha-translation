  text: וַ/יִּלְכֹּ֤ד יְהוּדָה֙ אֶת עַזָּ֣ה וְ/אֶת גְּבוּלָ֔/הּ וְ/אֶֽת אַשְׁקְל֖וֹן וְ/אֶת גְּבוּלָ֑/הּ וְ/אֶת עֶקְר֖וֹן וְ/אֶת גְּבוּלָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/018.yaml
  text: Judah captured Gaza and its territory[a], Ashkelon and its territory, and Ekron and its territory.
translation:
  language: fr
  text: Juda s’empara de Gaza et de son territoire[a], d’Ascalon et de son territoire, ainsi que d’Ékron et de son territoire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sa frontière », ici et dans les deux autres occurrences de « son territoire » ; le terme hébreu peut désigner une limite ou le territoire qu’elle délimite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: s’empara de
  rationale: Le verbe לכד désigne ici la prise d’une ville par la force. « S’empara de » est naturel en français moderne et conserve la portée militaire du contexte.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Le nom propre désigne collectivement la tribu. Le rendre simplement par « Juda » respecte la formulation hébraïque sans ajouter une explicitation absente du texte.
- source_word: גְּבוּלָהּ
  choice: son territoire
  rationale: גְּבוּל peut désigner une frontière, une limite ou le territoire qu’elle délimite. Dans cette liste de villes conquises avec leurs dépendances, « son territoire » est le rendu français le plus naturel, tout en signalant l’autre sens possible en note.
- source_word: עַזָּה
  choice: Gaza
  rationale: Forme française usuelle du nom de lieu.
- source_word: אַשְׁקְלוֹן
  choice: Ascalon
  rationale: Forme française biblique et géographique usuelle du nom de lieu.
- source_word: עֶקְרוֹן
  choice: Ékron
  rationale: Translittération française usuelle du nom de lieu, avec l’accent initial facilitant la prononciation.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La coordination a été légèrement variée avec « ainsi que » pour une lecture naturelle, sans modifier la structure de l’énumération. Le pronom possessif renvoie chaque fois à la ville immédiatement nommée.
