  text: וַ/יֹּ֣אמֶר אֲדֹֽנִי בֶ֗זֶק שִׁבְעִ֣ים מְלָכִ֡ים בְּֽהֹנוֹת֩ יְדֵי/הֶ֨ם וְ/רַגְלֵי/הֶ֜ם מְקֻצָּצִ֗ים הָי֤וּ מְלַקְּטִים֙ תַּ֣חַת שֻׁלְחָנִ֔/י כַּ/אֲשֶׁ֣ר עָשִׂ֔יתִי כֵּ֥ן שִׁלַּם לִ֖/י אֱלֹהִ֑ים וַ/יְבִיאֻ֥/הוּ יְרוּשָׁלִַ֖ם וַ/יָּ֥מָת שָֽׁם־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/007.yaml
  text: And Adoni-bezek said[a], “Seventy kings, with the thumbs of their hands and their feet cut off, used to gather scraps under my table. As I have done, so God has repaid me.” And they brought him to Jerusalem[b], and he died there.
translation:
  language: fr
  text: 'Adoni-Bézek dit : « Soixante-dix rois, à qui l’on avait coupé les pouces et les gros orteils[a], ramassaient des restes sous ma table. Ce que j’ai fait, Dieu[b] me l’a rendu. » Puis on l’emmena à Jérusalem, où il mourut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les pouces de leurs mains et de leurs pieds » ; le même mot hébreu désigne le pouce ou le gros orteil selon le membre concerné.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu אֱלֹהִים a une forme plurielle, mais il commande ici un verbe au singulier ; il signifie donc « Dieu » plutôt que « les dieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Bézek
  rationale: L’expression fonctionne ici comme le nom ou la désignation propre du personnage. Elle est donc translittérée plutôt que traduite par « seigneur de Bézek ».
- source_word: שִׁבְעִים מְלָכִים
  choice: Soixante-dix rois
  rationale: La construction numérique est rendue directement.
- source_word: בְּהֹנוֹת יְדֵיהֶם וְרַגְלֵיהֶם מְקֻצָּצִים
  choice: à qui l’on avait coupé les pouces et les gros orteils
  rationale: בֹּהֶן désigne le pouce lorsqu’il s’agit de la main et le gros orteil lorsqu’il s’agit du pied. Cette formulation exprime naturellement en français les deux précisions anatomiques de l’hébreu.
- source_word: הָיוּ מְלַקְּטִים
  choice: ramassaient des restes
  rationale: La tournure périphrastique décrit une action habituelle dans le passé. « Des restes » explicite sobrement ce qui pouvait être ramassé sous la table sans ajouter de détail absent du contexte.
- source_word: תַּחַת שֻׁלְחָנִי
  choice: sous ma table
  rationale: L’expression spatiale est traduite littéralement et naturellement.
- source_word: כַּאֲשֶׁר עָשִׂיתִי כֵּן שִׁלַּם לִי אֱלֹהִים
  choice: Ce que j’ai fait, Dieu me l’a rendu
  rationale: La formulation française conserve la correspondance entre l’acte commis et la rétribution, tout en rendant le piel de שׁלם par l’expression idiomatique « rendre ».
- source_word: וַיְבִיאֻהוּ יְרוּשָׁלִַם וַיָּמָת שָׁם
  choice: Puis on l’emmena à Jérusalem, où il mourut
  rationale: Le sujet pluriel indéfini se rend naturellement par « on » en français. La proposition relative avec « où » conserve le fait que sa mort eut lieu à Jérusalem.
theological_decisions:
- issue: Référence de אֱלֹהִים dans la déclaration d’Adoni-Bézek
  choice: Dieu
  alternative: les dieux
  rationale: Bien que אֱלֹהִים soit morphologiquement pluriel, le verbe שִׁלַּם est au singulier, ce qui soutient nettement ici le sens singulier « Dieu ». La traduction ne précise pas davantage la portée de la confession du personnage.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct reste incisif sans archaïsme. Le passé simple est conservé pour les actions principales du récit, tandis que l’imparfait exprime l’action habituelle des rois.
