id: JDG.1.32
reference: Judges 1:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּ֨שֶׁב֙ הָ/אָ֣שֵׁרִ֔י בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּ֖י לֹ֥א הוֹרִישֽׁ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/032.yaml
  text: So the Asherites lived among the Canaanites[a], the inhabitants of the land, because they did not drive them out.
translation:
  language: fr
  text: Les gens d’Aser habitèrent donc au milieu des Cananéens[a], les habitants du pays, parce qu’ils ne les avaient pas chassés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie littéralement des formes collectives au singulier : « l’Asérite… le Cananéen… il ne l’a pas dépossédé ». Le français les rend au pluriel selon leur sens dans ce contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: habitèrent
  rationale: Le verbe ישׁב exprime ici le fait de demeurer ou d’habiter durablement. « Habitèrent » convient au registre narratif et restitue naturellement le sens.
- source_word: הָאָשֵׁרִי
  choice: les gens d’Aser
  rationale: Le gentilé singulier avec article a une valeur collective et désigne les membres de la tribu d’Aser. « Les gens d’Aser » est clair en français moderne sans confondre le groupe avec l’ancêtre éponyme.
- source_word: בְּקֶרֶב
  choice: au milieu de
  rationale: L’expression indique une résidence à l’intérieur d’un autre groupe. « Au milieu de » conserve cette nuance spatiale et sociale.
- source_word: הַכְּנַעֲנִי
  choice: les Cananéens
  rationale: Le singulier morphologique est collectif; le participe pluriel qui suit confirme qu’il s’agit des habitants cananéens pris comme groupe.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: les habitants du pays
  rationale: Cette apposition identifie les Cananéens comme ceux qui résident dans le territoire. « Pays » rend ici אֶרֶץ naturellement, sans imposer une nuance politique moderne.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit la cause de la cohabitation décrite dans la première proposition.
- source_word: לֹא הוֹרִישׁוֹ
  choice: ils ne les avaient pas chassés
  rationale: Le hifil de ירשׁ signifie ici déposséder ou expulser les habitants. Le plus-que-parfait explicite naturellement l’antériorité logique de cet échec par rapport à la situation de cohabitation, tandis que les pluriels rendent les collectifs hébreux.
theological_decisions:
- issue: Singuliers collectifs désignant la tribu d’Aser et les Cananéens
  choice: 'Employer des pluriels collectifs en français : « les gens d’Aser », « les Cananéens », « ils ne les avaient pas chassés »'
  alternative: 'Conserver formellement les singuliers : « l’Asérite… le Cananéen… il ne l’avait pas dépossédé »'
  rationale: Les formes hébraïques au singulier représentent des collectivités. Des singuliers stricts en français suggéreraient à tort deux individus, alors que le contexte concerne une tribu et une population.
translation_notes:
  register: 'Français international moderne, narratif et digne. Le terme « gens d’Aser » est immédiatement compréhensible; « au milieu de » préserve l’accent du texte sur le renversement de la situation attendue : Aser demeure parmi les Cananéens plutôt que l’inverse.'
