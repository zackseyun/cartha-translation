id: JDG.5.9
reference: Judges 5:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִבִּ/י֙ לְ/חוֹקְקֵ֣י יִשְׂרָאֵ֔ל הַ/מִּֽתְנַדְּבִ֖ים בָּ/עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/009.yaml
  text: My heart is with the leaders of Israel[a], who volunteered among the people. Bless Yahweh!
translation:
  language: fr
  text: Mon cœur est avec les chefs d’Israël[a], qui se sont portés volontaires parmi le peuple. Bénissez Yahweh !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mon cœur est avec les législateurs d’Israël, ceux qui se sont offerts volontairement parmi le peuple. »'
    reason: Alternative lexicale préservant l’association de חקק avec l’action de décréter et rendant plus explicitement la nuance réflexive de נדב.
lexical_decisions:
- source_word: לִבִּי
  choice: Mon cœur
  rationale: Le nom avec suffixe de première personne exprime ici l’adhésion et l’estime de Débora. L’expression conserve l’image hébraïque naturelle en français.
- source_word: לְחוֹקְקֵי
  choice: est avec les chefs
  rationale: Le terme issu de חקק peut désigner ceux qui décrètent ou exercent l’autorité. Dans le contexte du cantique, « chefs » exprime clairement la responsabilité dirigeante sans limiter le sens à la législation.
- source_word: יִשְׂרָאֵל
  choice: d’Israël
  rationale: Génitif naturel en français, identifiant ces chefs comme appartenant à Israël.
- source_word: הַמִּתְנַדְּבִים
  choice: qui se sont portés volontaires
  rationale: Le participe hitpael de נדב exprime un engagement librement consenti. Cette tournure française courante préserve l’idée d’offrande volontaire de soi.
- source_word: בָּעָם
  choice: parmi le peuple
  rationale: עם signifie normalement « peuple ». Cette traduction conserve le sens collectif large sans préciser indûment « troupes ».
- source_word: בָּרֲכוּ
  choice: Bénissez
  rationale: L’impératif masculin pluriel de ברך appelle les auditeurs à bénir Yahweh. Le pluriel est rendu explicitement en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel tout en suivant une translittération largement reconnue.
- issue: Identité et fonction des חֹקְקֵי ישראל
  choice: les chefs d’Israël
  alternative: les législateurs d’Israël
  rationale: Le mot peut évoquer ceux qui décrètent, mais le contexte n’impose pas une fonction législative au sens moderne. « Chefs » garde une portée plus générale, tandis que l’autre possibilité est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe poétique reste concise ; l’image du cœur et l’exhortation finale sont conservées. Le masculin « chefs » suit la forme grammaticale hébraïque sans ajouter de précision absente du texte.
