base_translation:
  language: en
  yaml_path: translation/ot/judges/005/008.yaml
  text: They chose new gods[a]; then war was at the gates[b]. Was a shield or spear to be seen among forty thousand in Israel?
translation:
  language: fr
  text: Ils choisirent de nouveaux dieux[a] ; alors la guerre atteignit les portes[b]. Voyait-on un bouclier ou une lance parmi quarante mille en Israël ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Il choisit » ou « On choisit de nouveaux dieux. » Le verbe hébreu est au singulier, mais il est généralement compris ici dans un sens indéfini ou collectif, en référence à Israël.'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu de cette proposition est difficile ; autres traductions possibles : « alors il y eut des combats aux portes » ou une formulation semblable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחַר
  choice: Ils choisirent
  rationale: Le verbe hébreu est morphologiquement au singulier, mais son sujet est vraisemblablement indéfini ou collectif dans ce contexte. Le pluriel français exprime naturellement l’action du peuple d’Israël, tout en signalant la forme singulière dans une note.
- source_word: אֱלֹהִים חֲדָשִׁים
  choice: de nouveaux dieux
  rationale: Dans ce contexte polémique, l’expression désigne des divinités étrangères nouvellement adoptées par Israël.
- source_word: אָז לָחֶם שְׁעָרִים
  choice: alors la guerre atteignit les portes
  rationale: L’hébreu est condensé et difficile. Cette formulation conserve l’idée d’un conflit parvenu aux portes des villes, sans donner au texte une précision absente de l’original.
- source_word: מָגֵן
  choice: bouclier
  rationale: Équivalent français courant du terme militaire.
- source_word: אִם יֵרָאֶה
  choice: Voyait-on
  rationale: La tournure interrogative rend naturellement la question rhétorique qui souligne l’absence apparente d’armes.
- source_word: וָרֹמַח
  choice: ou une lance
  rationale: « Lance » est un équivalent moderne et clair de cette arme d’hast.
- source_word: בְּאַרְבָּעִים אֶלֶף בְּיִשְׂרָאֵל
  choice: parmi quarante mille hommes en Israël
  rationale: « Parmi » exprime le groupe au sein duquel aucune arme n’était visible. « Hommes » est explicité en français pour rendre intelligible le dénombrement implicite de combattants ou de membres du peuple.
theological_decisions:
- issue: Sujet du verbe initial
  choice: 'Le peuple d’Israël, collectivement : « Ils choisirent de nouveaux dieux »'
  alternative: « Il choisit de nouveaux dieux » ou « On choisit de nouveaux dieux »
  rationale: Le contexte accuse Israël d’avoir adopté d’autres dieux. Prendre Dieu comme sujet produirait ici un sens très improbable. La note préserve néanmoins la singularité grammaticale du verbe hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre poétique et narratif du cantique. La question finale reste rhétorique, et les notes maintiennent visibles les ambiguïtés grammaticales et lexicales de l’hébreu.
