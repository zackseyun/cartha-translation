translation:
  language: fr
  text: Quand des chefs prennent la tête en Israël[a], quand le peuple se porte volontaire, bénissez le SEIGNEUR !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est difficile et son sens exact est incertain. Elle peut évoquer des chefs prenant l’initiative; littéralement, elle est aussi comprise comme parlant de chevelures dénouées ou flottantes. D’autres y voient l’idée que le peuple s’est affranchi de toute contrainte.
    reason: Conserver l’ambiguïté réelle de בִּפְרֹעַ פְּרָעוֹת tout en signalant la lecture contextuelle adoptée.
lexical_decisions:
- source_word: בִּפְרֹעַ פְּרָעוֹת
  choice: Quand des chefs ont pris la tête
  rationale: Cette expression poétique est difficile. Dans le contexte du chant, elle paraît évoquer ceux qui se mettent à la tête du peuple; la formulation française conserve la répétition expressive de la racine proposée par cette interprétation.
- source_word: בְּהִתְנַדֵּב עָם
  choice: quand le peuple s’est porté volontaire
  rationale: La forme réfléchie de נדב exprime ici un engagement libre et volontaire du peuple.
- source_word: בָּרֲכוּ
  choice: bénissez
  rationale: Impératif masculin pluriel, rendu directement comme une exhortation adressée aux auditeurs.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française courante pour représenter le tétragramme tout en le distinguant du titre ordinaire « Seigneur ».
theological_decisions:
- issue: Identification des personnes évoquées par בִּפְרֹעַ פְּרָעוֹת
  choice: des chefs ont pris la tête
  alternative: les chevelures ont été dénouées / le peuple s’est déchaîné
  rationale: Le parallélisme avec l’engagement volontaire du peuple et le contexte de mobilisation en Israël favorisent l’idée de chefs prenant l’initiative, mais l’hébreu reste incertain; une note signale donc les autres lectures possibles.
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: Cette convention respecte l’usage biblique français largement reconnu sans imposer une vocalisation reconstruite du nom.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé par la répétition de « quand », et « ont pris la tête » rend l’élan de la mobilisation sans vocabulaire archaïque.
