  variant: modern international French
source:
  edition: WLC
  text: שִׁמְע֣וּ מְלָכִ֔ים הַאֲזִ֖ינוּ רֹֽזְנִ֑ים אָֽנֹכִ֗י לַֽ/יהוָה֙ אָנֹכִ֣י אָשִׁ֔ירָה אֲזַמֵּ֕ר לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/003.yaml
  text: Hear[a], O kings; give ear, O rulers. I, to Yahweh[b], I will sing; I will make music to Yahweh, the God of Israel.
translation:
  language: fr
  text: 'Écoutez, ô rois ! Prêtez l’oreille, ô dirigeants ![a]


    Moi, c’est pour Yahweh que je chanterai ;

    je ferai de la musique pour Yahweh, le Dieu d’Israël.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu juxtapose deux impératifs presque synonymes, « écoutez » et « prêtez l’oreille », pour renforcer solennellement l’appel.
    reason: lexical_alternative
  - marker: b
    text: Le second verbe peut aussi se traduire par « je chanterai les louanges de Yahweh » ; il désigne le fait de chanter ou de faire de la musique.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: Impératif pluriel de שׁמע. « Écoutez » constitue en français moderne une sommation directe et naturelle.
- source_word: מְלָכִים
  choice: rois
  rationale: Le nom pluriel désigne littéralement des rois ; rien dans le contexte ne justifie une généralisation.
- source_word: הַאֲזִינוּ
  choice: Prêtez l’oreille
  rationale: Cette expression poétique distingue le second impératif du premier tout en conservant leur parallélisme et l’idée d’une écoute attentive.
- source_word: רֹזְנִים
  choice: dirigeants
  rationale: Le terme désigne des personnages investis d’autorité, des dignitaires ou gouvernants. « Dirigeants » est clair, actuel et suffisamment large.
- source_word: אָנֹכִי ... אָנֹכִי
  choice: Moi ... moi, je
  rationale: La répétition du pronom indépendant est emphatique. La formulation française conserve cette insistance inhabituelle sans l’effacer.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: Avec les verbes de chant et de musique, la préposition ל peut marquer le destinataire ou la dédicace. « Pour Yahweh » exprime naturellement les deux nuances en français.
- source_word: יהוה
  choice: Yahweh
  rationale: Transcription du nom divin exprimé directement dans le texte hébreu, conformément à la convention du projet.
- source_word: אָשִׁירָה
  choice: je chanterai
  rationale: La forme exprime ici la volonté résolue de chanter. Le futur français rend cette détermination avec naturel.
- source_word: אֲזַמֵּר
  choice: je ferai de la musique
  rationale: Le verbe זמר évoque l’exécution musicale ou le chant de louange. Cette traduction préserve sa distinction par rapport à « chanterai » sans imposer un instrument absent du texte.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction transparente de la construction qui identifie Yahweh comme le Dieu d’Israël.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » conserve le caractère de nom propre et suit la convention doctrinale fournie, sans remplacer celui-ci par un titre.
- issue: Nuance des deux verbes אָשִׁירָה et אֲזַמֵּר
  choice: je chanterai ; je ferai de la musique
  alternative: je chanterai ; je célébrerai par mes chants
  rationale: Le choix retenu maintient deux actions apparentées mais distinctes et évite de rendre explicite une notion de louange qui, bien que possible pour זמר, n’est pas seule imposée par le verbe.
translation_notes:
  register: Poésie solennelle mais accessible. Les exclamations rendent l’adresse directe aux souverains ; les retours à la ligne mettent en valeur le parallélisme. La répétition marquée « Moi, pour Yahweh, moi, je » est conservée afin de reproduire l’emphase de l’hébreu, malgré son caractère volontairement saillant en français.
