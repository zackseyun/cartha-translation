  text: א֣וֹרוּ מֵר֗וֹז אָמַר֙ מַלְאַ֣ךְ יְהוָ֔ה אֹ֥רוּ אָר֖וֹר יֹשְׁבֶ֑י/הָ כִּ֤י לֹֽא בָ֨אוּ֙ לְ/עֶזְרַ֣ת יְהוָ֔ה לְ/עֶזְרַ֥ת יְהוָ֖ה בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/023.yaml
  text: Curse Meroz[a], said the angel of Yahweh; curse, utterly curse its inhabitants, because they did not come to the help of Yahweh[b], to the help of Yahweh against the mighty.
translation:
  language: fr
  text: « Maudissez Méroz, dit l’ange de Yahweh ; maudissez, maudissez sévèrement ses habitants, car ils ne sont pas venus au secours de Yahweh, au secours de Yahweh contre les guerriers puissants[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « parmi les puissants ». Dans le contexte, on peut aussi comprendre « contre les puissants » ou « avec les vaillants guerriers ».
    reason: alternative_reading
lexical_decisions:
- source_word: א֣וֹרוּ / אֹ֥רוּ אָר֖וֹר
  choice: Maudissez / Maudissez, maudissez sévèrement
  rationale: Le verbe ארר exprime une malédiction solennelle. La répétition accompagnée de l’infinitif absolu intensifie le second impératif; la reprise française rend cette insistance sans l’atténuer.
- source_word: מֵר֗וֹז
  choice: Méroz
  rationale: Nom propre, probablement celui d’un lieu; il est translittéré sans préciser davantage son référent.
- source_word: מַלְאַ֣ךְ יְהוָ֔ה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut désigner un ange ou un messager. Dans cette expression biblique, « l’ange de Yahweh » est naturel et conserve la portée littéraire et théologique de la formule sans déterminer l’identité exacte du personnage.
- source_word: יֹשְׁבֶ֑י/הָ
  choice: ses habitants
  rationale: Le participe substantivé avec suffixe féminin singulier désigne ceux qui habitent Méroz; « ses habitants » est concis et idiomatique.
- source_word: כִּ֤י לֹֽא בָ֨אוּ֙
  choice: car ils ne sont pas venus
  rationale: כִּי introduit ici la raison de la malédiction. « Car » convient au registre poétique et solennel du cantique.
- source_word: לְ/עֶזְרַ֣ת יְהוָ֔ה
  choice: au secours de Yahweh
  rationale: Cette formulation conserve la construction nominale et sa répétition rhétorique tout en restant naturelle en français.
- source_word: בַּ/גִּבּוֹרִֽים
  choice: contre les guerriers puissants
  rationale: Dans le contexte de la bataille, « contre » donne un sens cohérent à la préposition ב, tandis que גִּבּוֹרִים désigne vraisemblablement de puissants combattants. La difficulté syntaxique et les autres lectures possibles sont signalées en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre divin est conservé sous la forme « Yahweh », sans le remplacer par un titre.
- issue: Identité de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: « Ange » traduit naturellement la formule biblique, mais ne tranche pas la question de savoir s’il s’agit d’un être céleste, d’un envoyé humain ou d’une manifestation particulière de Yahweh.
- issue: Rapport exprimé par בַּגִּבּוֹרִים
  choice: contre les guerriers puissants
  alternative: parmi les puissants / avec les vaillants guerriers
  rationale: Le contexte guerrier favorise une lecture adversative, mais l’hébreu demeure ambigu; les autres rapports possibles sont donc explicitement préservés dans la note.
translation_notes:
  register: Français moderne, digne et rythmé, adapté au caractère poétique du cantique. La répétition de « au secours de Yahweh » et l’intensification de la malédiction sont conservées. Le discours direct est ponctué pour clarifier que les paroles sont attribuées à l’ange de Yahweh.
