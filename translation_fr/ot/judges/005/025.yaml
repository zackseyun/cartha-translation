  text: He asked for water[a]; she gave milk[b]. In a bowl fit for nobles she brought him curds.
translation:
  language: fr
  text: Il demanda de l’eau ; elle lui donna du lait. Dans un bol digne des nobles[a], elle lui présenta du lait caillé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans un bol de nobles » ; on peut aussi comprendre : « dans le bol d’un noble » ou « dans un bol majestueux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de la crème » ou « du beurre ». Le mot hébreu désigne un produit laitier riche dont la nature exacte est incertaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  choice: de l’eau
  rationale: Le sens ordinaire est « eau » ; le terme constitue l’objet de la demande de Sisera et contraste avec le lait offert.
- source_word: שָׁאַל
  choice: demanda
  rationale: Le qal parfait à la 3e personne du masculin singulier signifie « demander ». Cette formulation est naturelle et directe en français.
- source_word: חָלָב
  choice: du lait
  rationale: Le sens lexical courant est « lait », donné ici à la place de l’eau demandée.
- source_word: נָתָנָה
  choice: elle lui donna
  rationale: Le qal parfait féminin singulier renvoie à Yaël. Le pronom « lui », implicite en hébreu, rend clairement le destinataire en français sans modifier le sens.
- source_word: בְּסֵפֶל
  choice: dans une coupe
  rationale: סֵפֶל désigne un récipient tel qu’une coupe, un bol ou une vasque. « Coupe » convient au contexte d’hospitalité et au registre poétique.
- source_word: אַדִּירִים
  choice: digne des nobles
  rationale: Le pluriel peut désigner des nobles, des puissants ou des personnages majestueux. Cette tournure exprime naturellement l’association du récipient à des personnes de haut rang tout en signalant dans une note la construction littérale.
- source_word: הִקְרִיבָה
  choice: elle lui présenta
  rationale: Le hiphil de קרב signifie littéralement « faire approcher ». Dans ce contexte d’hospitalité, « présenta » conserve davantage que « apporta » l’idée de mettre le mets devant quelqu’un, sans connotation cultuelle nécessaire.
- source_word: חֶמְאָה
  choice: du lait caillé
  rationale: 'Le terme désigne un produit laitier riche, dont l’identification précise reste incertaine : lait caillé, crème ou beurre. « Lait caillé » est intelligible et cohérent avec le cadre ancien, tandis que les autres possibilités sont conservées en note.'
