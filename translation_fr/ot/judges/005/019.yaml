  text: בָּ֤אוּ מְלָכִים֙ נִלְחָ֔מוּ אָ֤ז נִלְחֲמוּ֙ מַלְכֵ֣י כְנַ֔עַן בְּ/תַעְנַ֖ךְ עַל מֵ֣י מְגִדּ֑וֹ בֶּ֥צַע כֶּ֖סֶף לֹ֥א לָקָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/019.yaml
  text: Kings came; they fought. Then the kings of Canaan fought at Taanach[a], by the waters of Megiddo; they took no plunder of silver.
translation:
  language: fr
  text: Des rois sont venus, ils ont combattu. Alors les rois de Canaan ont combattu à Taanak, près des eaux de Meguiddo ; ils n’ont pris aucun butin d’argent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucun gain d’argent » ou « aucun profit d’argent ». L’expression hébraïque peut désigner plus généralement un avantage matériel, mais, dans ce contexte de bataille, « butin d’argent » convient le mieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ מְלָכִים
  choice: Des rois sont venus
  rationale: L’absence d’article et l’ouverture poétique favorisent « des rois » plutôt que « les rois ». Le passé composé rend naturellement l’arrivée sur la scène tout en gardant la brièveté de l’hébreu.
- source_word: נִלְחָמוּ
  choice: ils ont combattu
  rationale: Le niphal de לחם signifie couramment « combattre ». Cette formulation concise conserve le parallélisme poétique.
- source_word: אָז
  choice: Alors
  rationale: « Alors » marque la progression du chant sans préciser davantage la relation temporelle.
- source_word: מַלְכֵי כְנַעַן
  choice: les rois de Canaan
  rationale: Cette formulation reproduit clairement la relation du construit hébreu et évite de réduire Canaan à une simple qualification ethnique.
- source_word: בְּתַעְנַךְ
  choice: à Taanak
  rationale: La préposition ב situe ici le combat. « À » est naturel en français pour un lieu de bataille.
- source_word: עַל מֵי מְגִדּוֹ
  choice: près des eaux de Meguiddo
  rationale: Dans ce contexte géographique, עַל indique vraisemblablement la proximité. « Près des eaux » est idiomatique et conserve la mention topographique.
- source_word: בֶּצַע כֶּסֶף
  choice: butin d’argent
  rationale: בצע peut désigner un gain, un profit ou un butin. Le contexte militaire favorise « butin », tandis que « d’argent » maintient explicitement כסף.
- source_word: לֹא לָקָחוּ
  choice: ils n’ont emporté aucun
  rationale: Le verbe לקח signifie prendre ou emporter. Avec « butin », « emporter » est naturel et exprime clairement l’absence totale de prise.
