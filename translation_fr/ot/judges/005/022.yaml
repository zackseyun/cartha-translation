  text: Then the horses’ hoofs pounded from the galloping[a], the galloping of his mighty steeds.
translation:
  language: fr
  text: 'Alors les sabots des chevaux martelèrent le sol,

    à cause du galop, du galop de ses puissants[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Héb. « ses puissants ». L’expression peut désigner de puissants coursiers ou les guerriers qui leur sont associés.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Adverbe temporel qui fait progresser la scène avec vivacité dans le chant.
- source_word: הָלְמוּ
  choice: martelèrent le sol
  rationale: Le verbe exprime des coups violents et répétés. L'ajout idiomatique « le sol » rend l'image naturelle en français sans modifier son sens.
- source_word: עִקְּבֵי סוּס
  choice: les sabots des chevaux
  rationale: Bien que עִקְּבֵי signifie littéralement « talons », le contexte équin appelle naturellement « sabots »; le singulier collectif סוּס est rendu au pluriel.
- source_word: מִדַּהֲרוֹת דַּהֲרוֹת
  choice: sous le galop, le galop
  rationale: « Sous » exprime ici la cause ou l'effet produit par le galop. La répétition hébraïque est conservée pour son intensité poétique.
- source_word: אַבִּירָיו
  choice: ses puissants coursiers
  rationale: Dans le contexte immédiat des chevaux et du galop, le terme désigne naturellement des bêtes puissantes; « coursiers » convient au registre poétique. Une note signale l'autre référent possible, les guerriers.
theological_decisions:
- issue: Référent de אַבִּירָיו et du suffixe masculin singulier
  choice: « ses puissants coursiers » dans le texte, avec ambiguïté signalée en note
  alternative: « ses puissants guerriers » ou, plus littéralement, « ses puissants »
  rationale: Le contexte équin favorise les chevaux puissants, mais le mot peut aussi désigner les guerriers qui leur sont associés. La note préserve cette ambiguïté réelle sans imposer une identification du possesseur.
translation_notes:
  register: Français international moderne, poétique et sonore. La disposition en deux lignes et la répétition de « galop » conservent l'élan du cantique; « puissants coursiers » maintient un ton digne sans archaïsme excessif.
