  text: יָדָ/הּ֙ לַ/יָּתֵ֣ד תִּשְׁלַ֔חְנָה וִֽ/ימִינָ֖/הּ לְ/הַלְמ֣וּת עֲמֵלִ֑ים וְ/הָלְמָ֤ה סִֽיסְרָא֙ מָחֲקָ֣ה רֹאשׁ֔/וֹ וּ/מָחֲצָ֥ה וְ/חָלְפָ֖ה רַקָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/026.yaml
  text: She reached out her hand for the tent peg[a], her right hand for the workmen’s hammer; then she struck Sisera, she shattered his head[c][b], she smashed and pierced his temple.
translation:
  language: fr
  text: 'Elle tend la main vers le piquet de tente,

    sa main droite vers le marteau des ouvriers[a] ;

    elle frappe Sisera, lui fracasse la tête[b],

    lui broie la tempe et la transperce[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le maillet des travailleurs ». L’expression hébraïque est rare, et la nuance exacte du nom de l’outil reste incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « lui écrase la tête ». Le texte accumule plusieurs verbes vigoureux pour intensifier poétiquement la violence du coup.
    reason: lexical_alternative
  - marker: c
    text: Ou « lui traverse la tempe ». Le dernier verbe a pour sens fondamental « passer, traverser » et évoque ici vraisemblablement un objet qui pénètre la tempe.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָהּ ... תִּשְׁלַחְנָה
  choice: Elle tend la main
  rationale: Le verbe exprime l’action d’étendre ou d’avancer la main. « Tend la main » est naturel en français et conserve l’image concrète ainsi que le parallélisme avec « sa main droite ».
- source_word: לַיָּתֵד
  choice: vers le piquet de tente
  rationale: Dans le contexte du récit de Yaël, il s’agit d’un piquet servant à fixer une tente. La précision « de tente » identifie naturellement le référent sans modifier la scène.
- source_word: וִימִינָהּ
  choice: sa main droite
  rationale: Traduction directe qui préserve le parallélisme poétique avec la première proposition.
- source_word: לְהַלְמוּת עֲמֵלִים
  choice: vers le marteau des ouvriers
  rationale: L’expression rare désigne un instrument servant à frapper. « Marteau des ouvriers » conserve la construction hébraïque tout en restant intelligible; l’incertitude lexicale est signalée en note.
- source_word: וְהָלְמָה
  choice: elle frappe
  rationale: Le verbe signifie frapper ou asséner un coup. « Frappe » rend sobrement l’action et laisse les verbes suivants en intensifier la violence.
- source_word: מָחֲקָה רֹאשׁוֹ
  choice: lui fracasse la tête
  rationale: Le verbe rare évoque un écrasement violent. « Fracasse » convient au registre poétique et distingue ce geste du verbe suivant.
- source_word: וּמָחֲצָה ... רַקָּתוֹ
  choice: lui broie la tempe
  rationale: « Broyer » restitue la force du second verbe et conserve l’accumulation de verbes violents du texte hébreu.
- source_word: וְחָלְפָה רַקָּתוֹ
  choice: et la transperce
  rationale: Le verbe signifie fondamentalement passer ou traverser; dans ce contexte, « transperce » exprime naturellement le passage de l’instrument à travers la tempe, sans préciser davantage le mécanisme.
