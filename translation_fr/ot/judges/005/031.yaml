source:
  edition: WLC
  text: כֵּ֠ן יֹאבְד֤וּ כָל אוֹיְבֶ֨י/ךָ֙ יְהוָ֔ה וְ/אֹ֣הֲבָ֔י/ו כְּ/צֵ֥את הַ/שֶּׁ֖מֶשׁ בִּ/גְבֻרָת֑/וֹ וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/031.yaml
  text: So may all your enemies perish[a], O Yahweh, but may those who love him be like the rising of the sun in its strength[b]. And the land had rest forty years.
translation:
  language: fr
  text: Qu’ainsi périssent tous tes ennemis, Yahweh ! Mais que ceux qui l’aiment soient comme le soleil lorsqu’il se lève dans toute sa force[a] ! Puis le pays connut le repos pendant quarante ans.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ceux qui l’aiment [sont] comme la sortie du soleil dans sa force ».'
    reason: La proposition hébraïque est nominale et peut être rendue plus littéralement sans le souhait explicite « que… soient ».
  - marker: b
    text: 'Littéralement : « le pays fut tranquille ». Dans le livre des Juges, cette expression désigne habituellement une période de paix ou de repos après un conflit.'
    reason: La note conserve le sens lexical plus direct de שׁקט et explique la valeur contextuelle de la formule.
lexical_decisions:
- source_word: כֵּן יֹאבְדוּ
  choice: Qu’ainsi périssent
  rationale: כֵּן tire la conclusion du chant, tandis que l’imparfait יֹאבְדוּ a ici une valeur de souhait. La formulation française conserve à la fois le lien conclusif et la force imprécatoire.
- source_word: כָל אוֹיְבֶיךָ
  choice: tous tes ennemis
  rationale: Rend directement le syntagme hébreu et maintient l’adresse à Yahweh à la deuxième personne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de le remplacer par un titre.
- source_word: וְאֹהֲבָיו
  choice: Mais que ceux qui l’aiment
  rationale: Le waw exprime ici un contraste naturel avec les ennemis. Le pronom de troisième personne est conservé, sans harmoniser le passage avec l’adresse précédente à la deuxième personne.
- source_word: כְּצֵאת הַשֶּׁמֶשׁ
  choice: comme le soleil lorsqu’il se lève
  rationale: Avec le soleil comme sujet, יצא décrit sa sortie, c’est-à-dire son lever. Cette tournure française est naturelle tout en préservant l’image.
- source_word: בִּגְבֻרָתוֹ
  choice: dans toute sa force
  rationale: Exprime la puissance éclatante du soleil. « Toute » rend idiomatiquement l’idée d’une force pleinement déployée sans ajouter une interprétation doctrinale.
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  choice: Puis le pays connut le repos
  rationale: Dans la formule récurrente du livre des Juges, שׁקט désigne l’apaisement du pays après le conflit. « Conn ut le repos » évite le sens seulement sonore de « fut silencieux ».
- source_word: אַרְבָּעִים שָׁנָה
  choice: pendant quarante ans
  rationale: Rend clairement la durée exprimée en hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le conserve comme nom propre au lieu de lui substituer un titre.
- issue: Changement de personne dans וְאֹהֲבָיו
  choice: « ceux qui l’aiment », avec un pronom à la troisième personne
  alternative: « ceux qui t’aiment »
  rationale: L’hébreu passe de « tes ennemis », dans l’adresse à Yahweh, à « ceux qui l’aiment ». La traduction garde cette tension grammaticale au lieu de la lisser.
- issue: Valeur modale de la comparaison concernant ceux qui aiment Yahweh
  choice: « que ceux qui l’aiment soient »
  alternative: « ceux qui l’aiment sont »
  rationale: Le second membre prolonge naturellement le souhait imprécatoire du premier. La traduction explicite cette valeur en français, tout en signalant en note la formulation plus littérale de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme poétique et les exclamations conviennent à la conclusion du cantique, tandis que la dernière phrase reprend le ton narratif. Le passage de la deuxième à la troisième personne est volontairement préservé.
