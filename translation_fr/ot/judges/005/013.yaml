id: JDG.5.13
reference: Judges 5:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֚ז יְרַ֣ד שָׂרִ֔יד לְ/אַדִּירִ֖ים עָ֑ם יְהוָ֕ה יְרַד לִ֖/י בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/013.yaml
  text: Then the remnant came down against the nobles[b][a]; the people of Yahweh came down for me against the mighty.
translation:
  language: fr
  text: Alors, les survivants descendirent contre les nobles[a] ; le peuple de Yahweh descendit pour moi[b] contre les guerriers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Alors, un survivant descendit vers les nobles. » L’hébreu de ce vers poétique est difficile, et les prépositions peuvent avoir un sens non hostile : « vers », « pour », « parmi » ou « avec ».'
    reason: alternative_reading
  - marker: b
    text: Littéralement « pour moi » ; il s’agit probablement d’une référence poétique de Débora à elle-même.
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Adverbe temporel qui introduit une nouvelle étape du chant ; « Alors » est bref et naturel dans un récit poétique.
- source_word: יְרַד / יְרַד
  choice: descendirent / descendit
  rationale: Le verbe ירד signifie « descendre ». La répétition est conservée ; l’accord français varie parce que שָׂרִיד est rendu collectivement par « les survivants », tandis que עָם est singulier.
- source_word: שָׂרִיד
  choice: les survivants
  rationale: Le singulier hébreu peut désigner collectivement ce qui subsiste. « Les survivants » est plus naturel en français courant que « un reste » dans cette scène de mobilisation militaire, sans effacer l’autre lecture possible signalée en note.
- source_word: לְאַדִּירִים
  choice: contre les nobles
  rationale: אַדִּירִים désigne des personnages puissants ou éminents. Dans le contexte guerrier, לְ est compris dans un sens hostile ; « nobles » distingue ce groupe des גִּבּוֹרִים du second membre.
- source_word: עָם יְהוָה
  choice: le peuple de Yahweh
  rationale: Cette formulation exprime clairement l’appartenance du peuple à Yahweh et conserve le nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre.
- source_word: לִי
  choice: pour moi
  rationale: Traduction directe du pronom de première personne, probablement une référence poétique de Débora à elle-même ; la formulation conserve néanmoins la brièveté et l’ambiguïté du texte.
- source_word: בַּגִּבּוֹרִים
  choice: contre les guerriers
  rationale: גִּבּוֹרִים désigne ici des hommes forts engagés dans le combat. « Guerriers » convient au contexte militaire, tandis que בְּ est compris dans un sens hostile.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le nom divin ; « Yahweh » le conserve comme nom propre sans lui substituer un titre.
- issue: Valeur syntaxique des prépositions dans les deux membres poétiques
  choice: 'sens hostile : « contre les nobles » et « contre les guerriers »'
  alternative: 'sens directionnel, bénéficiaire ou associatif : « vers/pour les nobles » et « parmi/avec les guerriers »'
  rationale: Le contexte martial et le parallélisme favorisent le sens hostile, mais l’hébreu poétique reste difficile ; les autres possibilités sont donc explicitement conservées en note.
- issue: Identité de la première personne dans לִי
  choice: référence probable à Débora, sans l’expliciter dans le corps du verset
  alternative: référence non identifiée ou autre fonction poétique du suffixe
  rationale: Débora est la voix principale du chant, mais remplacer « moi » par son nom résoudrait une question que l’hébreu laisse implicite.
translation_notes:
  register: Français international moderne, sobre et poétique. La répétition de « descendit/descendirent » reproduit celle de l’hébreu. « Les survivants » rend naturellement la valeur collective probable du singulier שָׂרִיד ; la lecture strictement singulière et l’incertitude des prépositions sont maintenues en note.
