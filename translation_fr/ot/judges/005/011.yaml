source:
  edition: WLC
  text: מִ/קּ֣וֹל מְחַֽצְצִ֗ים בֵּ֚ין מַשְׁאַבִּ֔ים שָׁ֤ם יְתַנּוּ֙ צִדְק֣וֹת יְהוָ֔ה צִדְקֹ֥ת פִּרְזֹנ֖/וֹ בְּ/יִשְׂרָאֵ֑ל אָ֛ז יָרְד֥וּ לַ/שְּׁעָרִ֖ים עַם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/011.yaml
  text: From the sound of archers among the watering places[a], there they recount the righteous acts of Yahweh, the righteous acts of his villagers in Israel[c][b]. Then the people of Yahweh went down to the gates.
translation:
  language: fr
  text: Au bruit des archers, parmi les points d’eau[a], là, on raconte les actes de justice de Yahweh, les actes de justice de ses villageois en Israël[b]. Alors le peuple de Yahweh descendit aux portes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « À la voix des archers, près des lieux où l’on puise l’eau ». Le début du vers est difficile : il peut situer la récitation par rapport au bruit entendu, ou évoquer un éloignement de ce bruit.'
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu traduit par « villageois » est difficile. Il peut aussi désigner la population rurale ou les localités non fortifiées ; certains comprennent ici les actes accomplis en leur faveur. La traduction « chefs » est moins probable.
    reason: lexical_alternative
  - marker: c
    text: Dans l’ancien Israël, les portes d’une ville étaient des lieux de rassemblement public, associés à la vie civique, à la justice et à la sécurité.
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל מְחַצְצִים
  choice: Au bruit des archers
  rationale: 'מְחַצְצִים est compris, dans ce contexte poétique, comme désignant des archers. La valeur exacte de מִן devant קוֹל reste difficile : « au bruit » donne une relation idiomatique en français sans imposer l’idée plus interprétative d’un éloignement.'
- source_word: בֵּין מַשְׁאַבִּים
  choice: parmi les points d’eau
  rationale: מַשְׁאַבִּים désigne des endroits où l’on puise de l’eau. « Parmi » exprime naturellement la présence au milieu de plusieurs points d’eau, tandis que « entre » demeure possible.
- source_word: יְתַנּוּ
  choice: on raconte
  rationale: Le piel exprime ici le fait de redire ou de proclamer publiquement. Le pronom indéfini « on » convient à l’absence d’un sujet explicite immédiatement identifiable et n’impose pas que la récitation soit chantée.
- source_word: צִדְקוֹת יְהוָה
  choice: les actes de justice de Yahweh
  rationale: Le pluriel צִדְקוֹת renvoie ici à des interventions concrètes manifestant la justice plutôt qu’à une qualité abstraite. « Actes de justice » conserve cette portée sans réduire le sens aux seules victoires ou délivrances.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est translittéré comme un nom propre plutôt que remplacé par un titre.
- source_word: צִדְקֹת פִּרְזֹנוֹ
  choice: les actes de justice de ses villageois
  rationale: Le terme rare פִּרְזוֹן est rapproché du vocabulaire de la vie villageoise en Juges 5.7. Le suffixe est rendu par « ses », mais le sens précis du groupe reste débattu et les autres possibilités sont signalées en note.
- source_word: אָז יָרְדוּ לַשְּׁעָרִים
  choice: Alors … est descendu vers les portes
  rationale: אָז marque la suite temporelle, et ירד garde son sens courant de descendre. Le singulier collectif « le peuple » commande naturellement le singulier en français.
- source_word: עַם יְהוָה
  choice: le peuple de Yahweh
  rationale: Cette formulation conserve directement le rapport d’appartenance exprimé par l’état construit hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie le tétragramme comme nom personnel. « Yahweh » le conserve sans lui substituer un titre.
- issue: Sens de צִדְקוֹת dans le chant de victoire
  choice: actes de justice
  alternative: actes sauveurs ; victoires
  rationale: Le terme peut désigner des actions qui manifestent la justice de Yahweh et qui, dans ce contexte, délivrent Israël. Le choix retenu préserve l’étendue sémantique du mot sans expliciter un seul aspect.
- issue: Rapport entre צִדְקוֹת et פִּרְזֹנוֹ
  choice: les actes de justice de ses villageois
  alternative: les actes de justice envers sa population rurale ; ses actes de justice dans les villages
  rationale: La construction hébraïque permet plusieurs compréhensions, et le mot פִּרְזוֹן est lui-même incertain. Le texte principal suit la lecture génitive la plus directe, tandis que la note maintient l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La syntaxe poétique est conservée sans archaïsmes. « Points d’eau » est courant et suffisamment large pour couvrir puits, abreuvoirs ou lieux de puisage. Les incertitudes majeures du premier membre et de פִּרְזוֹן sont maintenues dans les notes.
