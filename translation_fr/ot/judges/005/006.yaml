  text: בִּ/ימֵ֞י שַׁמְגַּ֤ר בֶּן עֲנָת֙ בִּ/ימֵ֣י יָעֵ֔ל חָדְל֖וּ אֳרָח֑וֹת וְ/הֹלְכֵ֣י נְתִיב֔וֹת יֵלְכ֕וּ אֳרָח֖וֹת עֲקַלְקַלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/006.yaml
  text: In the days of Shamgar son of Anath[a], in the days of Jael, the highways were deserted[b], and travelers went by roundabout paths.
translation:
  language: fr
  text: Aux jours de Shamgar, fils d’Anath, aux jours de Yaël, les routes n’étaient plus fréquentées[a], et ceux qui empruntaient les sentiers passaient par des chemins détournés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les routes cessèrent »; autrement dit, les routes habituelles avaient cessé d’être utilisées normalement.'
    reason: lexical_alternative
  - marker: b
    text: Le texte évoque des voies tortueuses ou indirectes, vraisemblablement des itinéraires secondaires empruntés pour éviter les routes ordinaires, et non une conduite moralement mauvaise.
    reason: cultural_note
lexical_decisions:
- source_word: בִּימֵי
  choice: aux jours de
  rationale: Rend l’idiome temporel hébreu dans une formulation française biblique, claire et encore naturelle.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: Shamgar, fils d’Anath
  rationale: Translittération française usuelle du nom propre et traduction directe de בֶּן.
- source_word: יָעֵל
  choice: Yaël
  rationale: Forme française courante du nom hébreu, avec tréma pour indiquer la séparation des voyelles.
- source_word: חָדְלוּ אֳרָחוֹת
  choice: les routes n’étaient plus fréquentées
  rationale: חָדַל signifie littéralement « cesser »; avec « routes » pour sujet, la tournure française exprime naturellement l’arrêt de la circulation normale sans ajouter explicitement une cause.
- source_word: הֹלְכֵי נְתִיבוֹת
  choice: les voyageurs
  rationale: Le syntagme désigne littéralement « ceux qui vont par les sentiers ». « Les voyageurs » en restitue le référent humain sans alourdir le vers poétique; la distinction entre types de voies est portée par la suite et explicitée en note.
- source_word: יֵלְכוּ
  choice: empruntaient
  rationale: L’imparfait hébreu décrit ici une pratique habituelle dans le passé; l’imparfait français convient au cadre temporel du chant.
- source_word: אֳרָחוֹת עֲקַלְקַלּוֹת
  choice: des chemins détournés
  rationale: עֲקַלְקַלּוֹת évoque des voies tortueuses, sinueuses ou indirectes. « Détournés » exprime ici l’itinéraire indirect sans suggérer nécessairement une faute morale.
