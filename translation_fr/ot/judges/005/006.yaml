translation_notes:
  register: Français moderne, digne et accessible, avec une légère coloration poétique adaptée au cantique de Débora. La répétition « aux jours de » conserve le parallélisme hébreu. La formulation évite d’attribuer au texte une cause précise de l’abandon des routes.
