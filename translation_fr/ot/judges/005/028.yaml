base_translation:
  language: en
  yaml_path: translation/ot/judges/005/028.yaml
  text: 'Through the window Sisera’s mother looked out and wailed through the lattice: “Why is his chariot so late in coming? Why do the hoofbeats of his chariots delay?”[a][b]'
translation:
  language: fr
  text: 'Par la fenêtre, la mère de Sisera regarda au-dehors et se lamenta à travers le treillis[a] :


    « Pourquoi son char tarde-t-il tant à venir ?


    Pourquoi tardent les pas de ses chars[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poussa des cris » ; le verbe hébreu est rare et désigne probablement une plainte ou un cri.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les pas de ses chars », expression qui peut évoquer leur bruit ou leur mouvement.
    reason: lexical_clarification
lexical_decisions:
- source_word: בְּעַד הַחַלּוֹן
  choice: Par la fenêtre
  rationale: La préposition indique ici que le regard passe par une ouverture. « Par la fenêtre » est naturel en français et évite de suggérer une vitre moderne.
- source_word: נִשְׁקְפָה
  choice: regarda au-dehors
  rationale: Le verbe décrit le fait de regarder depuis une ouverture vers l’extérieur, souvent depuis un point élevé.
- source_word: וַתְּיַבֵּב
  choice: se lamenta
  rationale: Ce verbe rare désigne vraisemblablement une plainte ou un cri chargé d’émotion. « Se lamenta » rend l’angoisse sans préciser indûment la nature exacte du son.
- source_word: אֵם סִיסְרָא
  choice: la mère de Sisera
  rationale: Le groupe construit est rendu directement et naturellement en français.
- source_word: בְּעַד הָאֶשְׁנָב
  choice: derrière le treillis
  rationale: Le nom désigne une ouverture munie d’un treillis. Dans ce second membre, « derrière » situe naturellement la mère par rapport à celui-ci, tout en maintenant le parallélisme avec la fenêtre.
- source_word: בֹּשֵׁשׁ רִכְבּוֹ לָבוֹא
  choice: son char tarde-t-il tant à venir
  rationale: Cette formulation française exprime clairement le retard anxieusement constaté et conserve le singulier « son char ».
- source_word: אֶחֱרוּ פַּעֲמֵי מַרְכְּבוֹתָיו
  choice: tardent les pas de ses chars
  rationale: « Pas » conserve l’image littérale et poétique de פַּעֲמֵי ainsi que le pluriel, sans introduire explicitement des sabots ou des roues absents du texte.
