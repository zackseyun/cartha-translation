  text: תְּבֹרַךְ֙ מִ/נָּשִׁ֔ים יָעֵ֕ל אֵ֖שֶׁת חֶ֣בֶר הַ/קֵּינִ֑י מִ/נָּשִׁ֥ים בָּ/אֹ֖הֶל תְּבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/024.yaml
  text: Most blessed among women is Jael[a], the wife of Heber the Kenite; among women in the tent[b], most blessed is she.
translation:
  language: fr
  text: Bénie entre les femmes soit Jaël[a], la femme de Héber le Qénite ! Entre les femmes dans la tente[b], qu’elle soit bénie !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Plus que les femmes, Jaël est bénie… plus que les femmes dans la tente. » La construction comparative hébraïque peut se comprendre au sens de « parmi/entre » ou de « plus que », donc « au-dessus de ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans la tente ». L’expression peut évoquer les femmes qui vivent dans une tente, mais l’hébreu emploie le singulier.'
    reason: cultural_note
lexical_decisions:
- source_word: תְּבֹרַךְ
  choice: Bénie … soit
  rationale: Le poual inaccompli à valeur poétique peut exprimer une proclamation ou un souhait de bénédiction. Avec מִן, la formule prend une valeur comparative ou superlative.
- source_word: מִנָּשִׁים
  choice: entre les femmes
  rationale: La préposition מִן marque ici la comparaison. « Entre les femmes » est une tournure française naturelle qui conserve la possibilité d’un sens superlatif, sans exclure le sens « plus que les femmes ».
- source_word: יָעֵל
  choice: Jaël
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: אֵשֶׁת חֶבֶר הַקֵּינִי
  choice: femme de Héber le Quénien
  rationale: Cette formulation restitue la chaîne construite qui identifie Jaël par son mariage et l’appartenance clanique de Héber.
- source_word: בָּאֹהֶל
  choice: sous la tente
  rationale: Littéralement « dans la tente ». En français, « sous la tente » désigne naturellement le fait de vivre ou de se trouver dans une tente, tout en maintenant le singulier hébreu et sans expliciter davantage l’allusion culturelle.
- source_word: תְּבֹרָךְ
  choice: qu’elle soit bénie
  rationale: La reprise du verbe hébreu est conservée afin de reproduire l’insistance et l’encadrement poétiques du vers.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. L’inversion « Bénie… soit » et la reprise « qu’elle soit bénie » rendent le parallélisme emphatique du chant sans alourdir la phrase. « Quénien » suit l’usage biblique français courant.
