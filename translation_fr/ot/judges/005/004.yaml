  text: יְהוָ֗ה בְּ/צֵאתְ/ךָ֤ מִ/שֵּׂעִיר֙ בְּ/צַעְדְּ/ךָ֙ מִ/שְּׂדֵ֣ה אֱד֔וֹם אֶ֣רֶץ רָעָ֔שָׁה גַּם שָׁמַ֖יִם נָטָ֑פוּ גַּם עָבִ֖ים נָ֥טְפוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/004.yaml
  text: O Yahweh[a], when you went out from Seir, when you marched from the field of Edom, the earth trembled; the heavens also dripped[b], the clouds also dripped water.
translation:
  language: fr
  text: 'Yahweh, quand tu es sorti de Séir,

    quand tu as marché depuis la campagne d’Édom[a],

    la terre a tremblé[b] ;

    les cieux aussi ont laissé tomber des gouttes,

    les nuages aussi ont laissé tomber de l’eau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis le pays d’Édom ». L’hébreu dit littéralement « depuis le champ d’Édom ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le pays a tremblé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de rendre explicitement le tétragramme et de préserver l’adresse directe du poème.
- source_word: בְּצֵאתְךָ
  choice: quand tu es sorti
  rationale: La préposition בְּ avec l’infinitif construit exprime ici le temps ; cette formulation naturelle conserve la deuxième personne du masculin singulier.
- source_word: מִשֵּׂעִיר
  choice: de Séir
  rationale: Séir est un nom de lieu ; la préposition מִן marque le point de départ.
- source_word: בְּצַעְדְּךָ
  choice: quand tu as marché
  rationale: Le verbe צעד évoque l’action d’avancer à grands pas ou de marcher. « Marché » exprime l’avancée divine sans ajouter une nuance militaire obligatoire.
- source_word: מִשְּׂדֵה אֱדוֹם
  choice: depuis la campagne d’Édom
  rationale: שָׂדֶה peut désigner un champ ou une étendue de pleine campagne. « La campagne d’Édom » garde l’image spatiale tout en étant plus naturelle en français que « le champ d’Édom ».
- source_word: אֶרֶץ רָעָשָׁה
  choice: la terre a tremblé
  rationale: Dans le parallélisme avec les cieux et les nuages, אֶרֶץ est compris au sens cosmique de « terre ». רָעַשׁ décrit une violente agitation, un tremblement ou une secousse.
- source_word: גַּם שָׁמַיִם נָטָפוּ
  choice: les cieux aussi ont laissé tomber leurs gouttes
  rationale: Cette formulation conserve la valeur additive de גַּם et l’image concrète de נָטַף, « dégoutter, laisser tomber des gouttes », sans employer le peu naturel « les cieux ont dégoutté ».
- source_word: גַּם עָבִים נָטְפוּ מָיִם
  choice: les nuages aussi ont laissé tomber de l’eau
  rationale: La répétition de « ont laissé tomber » reproduit celle du verbe נָטַף, tandis que « de l’eau » rend l’objet explicite מָיִם.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Portée de אֶרֶץ dans la scène théophanique
  choice: la terre
  alternative: le pays
  rationale: Le parallélisme avec les cieux et les nuages favorise une scène cosmique, mais le sens local « pays » demeure lexicalement possible et est signalé en note.
translation_notes:
  register: Poésie élevée mais accessible, avec des lignes brèves qui font ressortir le parallélisme. La répétition de « aussi » et de « ont laissé tomber » reflète la structure hébraïque. Les marqueurs de notes ont été placés auprès des expressions qu’ils expliquent.
