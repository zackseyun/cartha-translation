source:
  edition: WLC
  text: מִנִּ֣י אֶפְרַ֗יִם שָׁרְשָׁ/ם֙ בַּ/עֲמָלֵ֔ק אַחֲרֶ֥י/ךָ בִנְיָמִ֖ין בַּֽ/עֲמָמֶ֑י/ךָ מִנִּ֣י מָכִ֗יר יָֽרְדוּ֙ מְחֹ֣קְקִ֔ים וּ/מִ֨/זְּבוּלֻ֔ן מֹשְׁכִ֖ים בְּ/שֵׁ֥בֶט סֹפֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/014.yaml
  text: From Ephraim those whose root was in Amalek[a]; after you, Benjamin, among your peoples. From Machir commanders came down[e][d][c][b], and from Zebulun those who wield the staff of the scribe.
translation:
  language: fr
  text: D’Éphraïm vinrent ceux dont la racine était en Amalec[a] ; à ta suite, Benjamin, parmi tes peuples[b]. De Makir descendirent des chefs[c][d], et de Zabulon ceux qui maniaient le bâton du scribe[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dont la racine était contre Amalec », ou encore « dont la racine était dans la région montagneuse d’Amalec ». Le vers hébreu est difficile et semble employer un langage poétique et géographique.
    reason: alternative_reading
  - marker: b
    text: Ou « Benjamin te suivit parmi tes clans » ou « parmi les tiens ». « Parmi tes peuples » traduit de près une expression hébraïque inhabituelle.
    reason: lexical_alternative
  - marker: c
    text: Makir est le principal clan de Manassé ; certaines traductions emploient ici le nom plus général « Manassé ».
    reason: cultural_note
  - marker: d
    text: Ou « des législateurs » ou « des dirigeants ». Le terme hébreu peut désigner ceux qui décrètent ou qui exercent l’autorité.
    reason: lexical_alternative
  - marker: e
    text: Ou « ceux qui tiraient avec le bâton du scribe » ou « ceux qui portaient le bâton du recruteur ». Cette expression rare peut évoquer la mobilisation des troupes ou leur recensement.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּי אֶפְרַיִם
  choice: D’Éphraïm
  rationale: La préposition indique la provenance. Cette formulation conserve l’énumération poétique des tribus.
- source_word: שָׁרְשָׁם
  choice: ceux dont la racine était
  rationale: Le nom signifie littéralement « racine ». La métaphore est conservée sans la réduire à l’idée de descendance.
- source_word: בַּעֲמָלֵק
  choice: en Amalec
  rationale: La valeur locative de la préposition est la plus naturelle, mais le caractère difficile de l’expression justifie une note présentant les autres lectures possibles.
- source_word: אַחֲרֶיךָ בִנְיָמִין
  choice: à ta suite, Benjamin
  rationale: Cette tournure garde la brièveté de l’hébreu et n’ajoute pas de verbe explicite absent du texte source.
- source_word: בַּעֲמָמֶיךָ
  choice: parmi tes peuples
  rationale: Traduction proche de l’expression hébraïque inhabituelle, dont le sens peut viser les clans ou les groupes associés à Benjamin.
- source_word: מִנִּי מָכִיר
  choice: De Makir
  rationale: Le texte nomme directement Makir, clan majeur de Manassé ; le nom propre est donc conservé.
- source_word: יָרְדוּ
  choice: descendirent
  rationale: Le verbe exprime littéralement un mouvement vers le bas. « Descendirent » convient au registre poétique et ne fixe pas artificiellement le point de vue par « vinrent » ou « allèrent ».
- source_word: מְחֹקְקִים
  choice: des chefs
  rationale: Le terme peut désigner ceux qui décrètent ou exercent l’autorité. Dans ce contexte de mobilisation tribale, « chefs » est naturel tout en laissant en note l’alternative « législateurs ».
- source_word: וּמִזְּבוּלֻן
  choice: et de Zabulon
  rationale: Rend simplement la provenance et poursuit l’énumération des tribus.
- source_word: מֹשְׁכִים
  choice: ceux qui maniaient
  rationale: Le participe signifie littéralement « tirer » ou « entraîner ». Avec un bâton comme complément, « manier » rend naturellement l’action sans déterminer sa fonction exacte.
- source_word: בְּשֵׁבֶט סֹפֵר
  choice: le bâton du scribe
  rationale: Cette traduction conserve les deux éléments concrets, « bâton » et « scribe », ainsi que l’ambiguïté d’une expression rare qui pourrait évoquer le recensement ou la mobilisation militaire.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, poétique et digne. La syntaxe elliptique du chant est légèrement explicitée par « vinrent » dans la première proposition, tandis que les images difficiles de la « racine » et du « bâton du scribe » sont conservées. Les noms propres suivent les formes françaises bibliques courantes : Éphraïm, Amalec, Makir et Zabulon.'
