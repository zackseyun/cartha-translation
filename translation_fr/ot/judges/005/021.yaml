  text: נַ֤חַל קִישׁוֹן֙ גְּרָפָ֔/ם נַ֥חַל קְדוּמִ֖ים נַ֣חַל קִישׁ֑וֹן תִּדְרְכִ֥י נַפְשִׁ֖/י עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/021.yaml
  text: The torrent of Kishon swept them away— the ancient torrent[a], the torrent of Kishon. March on, my soul[b], with strength!
translation:
  language: fr
  text: 'Le torrent du Qishôn les a balayés,

    l’antique torrent[a], le torrent du Qishôn.

    Avance, mon âme[b], avec force !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le torrent d’autrefois » ou « le torrent primordial ». Le mot hébreu קְדוּמִים peut évoquer l’antiquité ; certains y entendent une intensification poétique plutôt qu’une simple indication chronologique.
    reason: lexical_alternative
  - marker: b
    text: Ou « Marche, mon âme, avec force » ou « Piétine, mon âme, avec puissance ». L’hébreu est concis et poétique, et le verbe peut évoquer l’action de fouler ou de piétiner aussi bien que celle d’avancer.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל
  choice: torrent
  rationale: Dans ce contexte de bataille, נַחַל désigne le cours d’eau en crue dont les eaux emportent l’ennemi. « Torrent » exprime naturellement en français cette violence, mieux que « rivière » ou « ruisseau ».
- source_word: קִישׁוֹן
  choice: Qishôn
  rationale: Nom propre du cours d’eau, translittéré de manière à refléter la consonne initiale hébraïque et la voyelle longue finale.
- source_word: גְּרָפָם
  choice: les a balayés
  rationale: Le verbe גרף signifie emporter ou balayer, notamment par les eaux. « Les a balayés » conserve l’image violente de la crue et le suffixe masculin pluriel.
- source_word: נַחַל קְדוּמִים
  choice: le torrent antique
  rationale: קְדוּמִים évoque les temps anciens ou l’antiquité. « Le torrent antique » convient à l’apposition poétique sans imposer une interprétation mythologique.
- source_word: תִּדְרְכִי
  choice: Avance
  rationale: La forme féminine singulière de דרך s’adresse à « mon âme » et peut signifier fouler, marcher ou avancer. « Avance » rend clairement l’exhortation triomphante tout en laissant en note les images plus littérales de marche et de piétinement.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Dans cette apostrophe poétique à soi-même, « mon âme » préserve la personnification et la force rhétorique de נַפְשִׁי.
- source_word: עֹז
  choice: avec force
  rationale: עֹז signifie force ou puissance. La syntaxe poétique est condensée ; « avec force » en donne une lecture adverbiale naturelle sans effacer entièrement cette concision.
theological_decisions: []
translation_notes:
  register: Poésie élevée mais accessible, avec trois segments rythmiques. « Qishôn » suit une translittération française proche de l’hébreu. Les deux notes conservent l’ambiguïté lexicale de קְדוּמִים et de דרך ; tous leurs marqueurs figurent dans le texte.
