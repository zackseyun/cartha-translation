revisions:
- from: 'Les princes d’Issacar étaient avec Débora[a],

    et Issacar, de même, avec Barak.

    Dans la vallée, il fut envoyé sur ses pas[b].

    Parmi les divisions de Ruben,

    grandes furent les délibérations du cœur[c].'
  to: 'Les princes d’Issacar étaient avec Débora[a],

    et Issacar se tenait lui aussi aux côtés de Barak.

    Dans la vallée, il fut envoyé à sa suite[b].


    Parmi les divisions de Ruben,

    grandes furent les délibérations du cœur[c].'
  rationale: La révision clarifie la relation d’Issacar à Barak sans supprimer l’ellipse ni le singulier collectif du texte hébreu. Elle rend l’idiome militaire par « à sa suite », soutenu par une note littérale, et retire de la note a une analyse possessive incertaine. Les autres ambiguïtés poétiques sont conservées.
