base_translation:
  language: en
  yaml_path: translation/ot/judges/005/015.yaml
  text: And the princes of Issachar were with Deborah[a]; and Issachar was likewise with Barak; into the valley they were sent at his feet[c][b]. Among the divisions of Reuben there were great searchings of heart.
translation:
  language: fr
  text: 'Les princes d’Issacar étaient avec Débora[a],

    et Issacar se tenait lui aussi aux côtés de Barak.

    Dans la vallée, il fut envoyé à sa suite[b].


    Parmi les divisions de Ruben,

    grandes furent les délibérations du cœur[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les chefs d’Issacar » ou « les dirigeants d’Issacar ». L’expression hébraïque est poétique et peut avoir une valeur idiomatique.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à ses pieds », c’est-à-dire en le suivant de près.
    reason: lexical_alternative
  - marker: c
    text: Ou « les grandes résolutions du cœur » ou « les grandes décisions du cœur ». L’expression hébraïque est difficile et évoque les débats intérieurs de Ruben plutôt qu’un passage immédiat à l’action.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַי בְּיִשָּׂשכָר
  choice: les princes d’Issacar
  rationale: Dans ce passage poétique, שָׂרַי peut être compris idiomatiquement comme désignant les princes ou chefs d’Issacar. « Princes » conserve le registre élevé du cantique, tandis qu’une note signale la forme littérale avec suffixe de première personne.
- source_word: עִם
  choice: avec
  rationale: La préposition exprime ici l’accompagnement et l’engagement aux côtés de Débora.
- source_word: וְיִשָּׂשכָר כֵּן בָּרָק
  choice: et Issacar, de même, avec Barak
  rationale: La proposition hébraïque est elliptique; « de même » rend כֵּן et le verbe « était » reste sous-entendu en français, ce qui préserve le parallélisme poétique.
- source_word: בָּעֵמֶק
  choice: dans la vallée
  rationale: Le contexte indique un déploiement vers la vallée. En français, « dans la vallée » convient avec « fut envoyé » sans imposer plus précisément le point de départ du mouvement.
- source_word: שֻׁלַּח
  choice: il fut envoyé
  rationale: Le singulier morphologique est conservé et renvoie à Issacar envisagé collectivement. La voix passive de l’hébreu est également maintenue.
- source_word: בְּרַגְלָיו
  choice: sur ses pas
  rationale: L’expression signifie littéralement « à ses pieds » et décrit Issacar suivant Barak de près. « Sur ses pas » transmet naturellement cet idiome en français; le sens littéral est donné en note.
- source_word: בִּפְלַגּוֹת רְאוּבֵן
  choice: parmi les divisions de Ruben
  rationale: « Divisions » conserve le sens assez large de פְּלַגּוֹת, qui peut désigner les sections, groupes ou factions internes de la tribu, sans préciser indûment « clans ».
- source_word: גְּדֹלִים חִקְקֵי לֵב
  choice: grandes furent les délibérations du cœur
  rationale: La tournure inversée garde la force poétique de גְּדֹלִים. Le nom difficile חִקְקֵי évoque ici des réflexions, résolutions ou décisions intérieures; « délibérations » rend l’hésitation intérieure suggérée par le contexte sans la réduire à une simple émotion.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, digne et poétique. Le parallélisme du cantique est conservé, ainsi que l’ellipse de la deuxième proposition. Les formulations obscures de l’hébreu ne sont pas nivelées: le singulier collectif d’Issacar, l’image des « pas » et l’ambiguïté des délibérations de Ruben restent perceptibles, avec des notes explicatives sobres.'
