  text: הָרִ֥ים נָזְל֖וּ מִ/פְּנֵ֣י יְהוָ֑ה זֶ֣ה סִינַ֔י מִ/פְּנֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/005.yaml
  text: The mountains quaked before Yahweh[a], this Sinai before Yahweh[b], the God of Israel.
translation:
  language: fr
  text: Les montagnes ruisselèrent[a] devant Yahweh — ce Sinaï — devant Yahweh, le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fondirent ». Le verbe hébreu évoque littéralement ce qui coule ou ruisselle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: les montagnes
  rationale: L’article défini est exprimé en hébreu, et « montagnes » convient à l’évocation théophanique du Sinaï.
- source_word: נָזְלוּ
  choice: ruisselèrent
  rationale: Le verbe נזל désigne fondamentalement l’écoulement ou le ruissellement. « Ruisselèrent » conserve cette image poétique, tandis que « fondirent » l’interprète davantage et que « tremblèrent » s’éloigne du sens lexical.
- source_word: מִפְּנֵי
  choice: devant
  rationale: Cette formulation française naturelle rend l’idée de se trouver face à la présence de Yahweh sans alourdir le vers.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: זֶה סִינַי
  choice: ce Sinaï
  rationale: La tournure abrupte préserve le démonstratif hébreu et l’intensité déictique de la poésie, sans ajouter « mont ».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette expression française naturelle conserve l’identification appositive et relationnelle de Yahweh comme Dieu d’Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Image théophanique du verbe נָזְלוּ
  choice: les montagnes ruisselèrent
  alternative: les montagnes fondirent; les montagnes tremblèrent
  rationale: Le choix maintient l’image concrète d’un écoulement devant la présence divine et évite de trancher silencieusement en faveur d’une interprétation traditionnelle ou contextuelle.
translation_notes:
  register: Français international moderne, poétique et digne. Les tirets isolent l’expression abrupte « ce Sinaï » afin de conserver sa force tout en rendant la syntaxe intelligible. Le nom « Yahweh » est répété comme en hébreu.
