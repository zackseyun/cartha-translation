  yaml_path: translation/ot/judges/005/010.yaml
  text: You who ride on white donkeys[a], you who sit on carpets[b], and you who walk on the road—speak!
translation:
  language: fr
  text: 'Vous qui montez des ânesses blanches,


    vous qui êtes assis sur des tapis[a],


    et vous qui marchez sur la route,


    parlez[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur des couvertures de selle » ou « sur des nattes » ; le terme hébreu est rare et son sens est incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « racontez » ou « méditez » ; le verbe hébreu peut désigner le fait de parler, de raconter ou de méditer.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְבֵי
  choice: vous qui montez
  rationale: Le participe qal pluriel construit a ici une valeur vocative, en parallèle avec les participes suivants. « Vous qui montez » rend naturellement l’adresse directe et l’action de chevaucher une monture.
- source_word: אֲתֹנוֹת
  choice: ânesses
  rationale: Le nom hébreu désigne spécifiquement des ânesses. Cette précision reste naturelle en français et conserve l’image sociale de montures de distinction.
- source_word: צְחֹרוֹת
  choice: blanches
  rationale: L’adjectif exprime probablement la blancheur ou une couleur claire et éclatante. « Blanches » est le sens le plus direct et traditionnel.
- source_word: יֹשְׁבֵי
  choice: vous qui êtes assis
  rationale: Le participe est compris comme une nouvelle adresse vocative. Le sens concret « être assis » convient à la construction avec עַל et au parallélisme du vers.
- source_word: מִדִּין
  choice: tapis
  rationale: Ce terme rare est de sens incertain. Dans ce contexte de cavaliers et de voyageurs, il désigne probablement des étoffes, tapis ou couvertures servant de siège; l’incertitude est signalée en note.
- source_word: וְהֹלְכֵי
  choice: et vous qui marchez
  rationale: Le troisième participe vocatif complète la série. « Marchez » conserve l’image concrète tout en pouvant désigner les voyageurs.
- source_word: דֶּרֶךְ
  choice: la route
  rationale: Le nom courant signifie route, chemin ou voie. « La route » convient au cadre concret du déplacement.
- source_word: שִׂיחוּ
  choice: parlez-en
  rationale: L’impératif de שיח peut signifier parler, raconter ou méditer. Dans le chant de victoire, « parlez-en » garde une certaine largeur sémantique tout en suggérant que les destinataires doivent évoquer les actes célébrés.
