base_translation:
  language: en
  yaml_path: translation/ot/judges/005/016.yaml
  text: Why did you sit among the sheepfolds[a], to hear the whistling for the flocks? For the divisions of Reuben there were great searchings of heart.
translation:
  language: fr
  text: Pourquoi es-tu resté assis entre les enclos, à écouter les appels sifflés aux troupeaux ? Dans les divisions de Ruben[a], il y eut de grandes réflexions du cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Près des cours d’eau de Ruben ». Le terme hébreu peut désigner des divisions, mais aussi des cours d’eau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Rend directement l’interrogation qui reproche à Ruben son inaction.
- source_word: יָשַׁבְתָּ
  choice: es-tu resté assis
  rationale: Conserve l’image concrète du verbe « s’asseoir » tout en exprimant naturellement la permanence dans cette position.
- source_word: בֵּין הַמִּשְׁפְּתַיִם
  choice: entre les enclos
  rationale: Le contexte pastoral favorise le sens d’enclos pour le bétail; « entre » préserve la préposition hébraïque et l’image spatiale.
- source_word: לִשְׁמֹעַ
  choice: à écouter
  rationale: Dans la question, cette tournure française exprime naturellement l’activité à laquelle Ruben demeure occupé.
- source_word: שְׁרִקוֹת עֲדָרִים
  choice: les sifflements destinés aux troupeaux
  rationale: Le nom évoque vraisemblablement les appels sifflés des bergers; « destinés aux » explicite seulement la relation contextuelle avec les troupeaux.
- source_word: לִפְלַגּוֹת רְאוּבֵן
  choice: Parmi les groupes de Ruben
  rationale: « Groupes » rend le sens de divisions ou sections sans suggérer nécessairement une discorde interne; l’autre sens possible, « cours d’eau », est conservé en note.
- source_word: גְּדוֹלִים חִקְרֵי לֵב
  choice: grandes furent les réflexions du cœur
  rationale: Préserve l’intensification, l’inversion poétique et la métaphore hébraïque du cœur comme siège de la délibération intérieure.
