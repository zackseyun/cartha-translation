  text: זְבֻל֗וּן עַ֣ם חֵרֵ֥ף נַפְשׁ֛/וֹ לָ/מ֖וּת וְ/נַפְתָּלִ֑י עַ֖ל מְרוֹמֵ֥י שָׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/018.yaml
  text: Zebulun was a people that risked its life to the death[a], and Naphtali also[b], on the heights of the field.
translation:
  language: fr
  text: Zabulon est un peuple qui a risqué sa vie jusqu’à la mort[a], et Nephtali aussi, sur les hauteurs de la campagne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui a méprisé sa vie jusqu’à la mort » ; autrement dit, qui l’a risquée même au péril de la mort. L’hébreu présente Zabulon comme un collectif singulier et emploie un verbe exprimant le mépris ou le peu de cas que l’on fait de quelque chose.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sur les hauteurs du terrain découvert ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבֻלוּן
  choice: Zabulon
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: עַם
  choice: un peuple
  rationale: Conserve le nom collectif singulier employé en apposition à Zabulon.
- source_word: חֵרֵף נַפְשׁוֹ
  choice: a risqué sa vie
  rationale: Dans ce contexte guerrier, l’expression indique que le peuple a tenu sa vie pour négligeable et l’a exposée au danger; la note conserve la nuance littérale de mépris.
- source_word: לָמוּת
  choice: jusqu’à la mort
  rationale: Exprime naturellement en français l’extension extrême du péril, sans affirmer nécessairement que tous sont morts.
- source_word: וְנַפְתָּלִי
  choice: et Nephtali aussi
  rationale: 'Le mot « aussi » explicite le parallélisme elliptique: Nephtali partage l’éloge adressé à Zabulon.'
- source_word: עַל מְרוֹמֵי שָׂדֶה
  choice: sur les hauteurs de la campagne
  rationale: « Hauteurs » rend le relief; « campagne » exprime ici le terrain découvert sans imposer l’interprétation plus précise de « champ de bataille ».
