  text: חָדְל֧וּ פְרָז֛וֹן בְּ/יִשְׂרָאֵ֖ל חָדֵ֑לּוּ עַ֤ד שַׁ/קַּ֨מְתִּי֙ דְּבוֹרָ֔ה שַׁ/קַּ֥מְתִּי אֵ֖ם בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/007.yaml
  text: Village life ceased in Israel; it ceased until I[a], Deborah, arose—until I arose as a mother in Israel.
translation:
  language: fr
  text: La vie dans les villages[a] avait cessé en Israël, elle avait cessé, jusqu’à ce que je me lève, moi, Déborah, jusqu’à ce que je me lève, mère en Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les villageois avaient cessé en Israël » ou « la population rurale avait cessé ». Le terme hébreu est difficile et peut désigner les habitants des villages ou, plus largement, la vie dans les villages.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: חָדְלוּ / חָדֵלּוּ
  choice: avait cessé / elle avait cessé
  rationale: Le verbe חדל, répété, exprime la cessation. Le plus-que-parfait présente naturellement en français la situation qui durait avant l’intervention de Déborah, tout en conservant la répétition poétique.
- source_word: פְרָזוֹן
  choice: la vie dans les villages
  rationale: Ce nom difficile peut désigner les habitants des localités non fortifiées, la population rurale ou, plus largement, la vie villageoise. Cette formulation rend le sens social probable sans masquer l’incertitude, signalée en note.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La préposition ב est ici naturellement locative; « en Israël » convient au cadre national du chant.
- source_word: עַד
  choice: jusqu’à ce que
  rationale: La conjonction marque le tournant entre l’effondrement antérieur de la vie rurale et l’intervention de Déborah.
- source_word: שַׁקַּמְתִּי
  choice: je me lève
  rationale: Le verbe קום évoque le fait de se lever pour agir. Le présent après « jusqu’à ce que » est naturel en français dans ce discours poétique et maintient le relief de la première personne ainsi que la répétition.
- source_word: דְּבוֹרָה
  choice: Déborah
  rationale: Forme française traditionnelle et transparente du nom propre.
- source_word: אֵם
  choice: une mère
  rationale: Le nom présente Déborah comme une figure maternelle en Israël, vraisemblablement dans une fonction de protection et de direction, sans en faire explicitement « la mère d’Israël ».
theological_decisions:
- issue: Portée métaphorique de l’autodésignation אֵם בְּיִשְׂרָאֵל
  choice: « comme une mère en Israël »
  alternative: « mère d’Israël » ou « une mère en Israël » sans marque comparative
  rationale: L’hébreu dit littéralement « mère en Israël », non « mère d’Israël ». « Comme une mère » fait entendre l’emploi figuré naturel en français tout en gardant « en Israël » et sans définir plus précisément la nature de son autorité.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « avait cessé » et de « jusqu’à ce que je me lève » reproduit la structure insistante de l’hébreu. La principale ambiguïté lexicale de פְרָזוֹן est rendue par une expression large dans le texte; aucune note supplémentaire non marquée n’est ajoutée.
