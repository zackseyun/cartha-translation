  - severity: low
    issue: Ancre [a] placée après « navires »
    rationale: La note [a] porte sur le verbe יָגוּר et devrait être rattachée à « séjourne-t-il » plutôt qu’au nom « navires ».
  - severity: low
    issue: Singulier « mer » pour יַמִּים
    rationale: Le singulier français est possible idiomatiquement, mais « mers » permet de préserver sans lourdeur le pluriel poétique de l’hébreu.
