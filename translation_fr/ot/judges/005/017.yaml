base_translation:
  language: en
  yaml_path: translation/ot/judges/005/017.yaml
  text: Gilead stayed beyond the Jordan[b][a]; and Dan—why did he sojourn by the ships? Asher sat by the seashore and stayed by his harbors.
translation:
  language: fr
  text: Galaad est resté au-delà du Jourdain. Et Dan, pourquoi séjourne-t-il[a] auprès des navires ? Aser demeurait au bord des mers et il est resté près de ses criques[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pourquoi demeure-t-il près des navires ? » Le verbe hébreu peut signifier « résider » ou « séjourner ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « près de ses baies » ou « près de ses ports ». Le mot hébreu évoque des ouvertures ou des découpures du littoral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְעָד
  choice: Galaad
  rationale: Le nom traditionnel français est conservé; dans ce contexte, il désigne par métonymie la population ou l’entité tribale située à l’est du Jourdain.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: au-delà du Jourdain
  rationale: Expression géographique française concise qui conserve le point de vue spatial de l’hébreu.
- source_word: שָׁכֵן
  choice: est resté
  rationale: Le verbe exprime le fait de demeurer sur place; « est resté » fait aussi entendre, sans l’expliciter excessivement, le reproche d’inaction.
- source_word: וְדָן
  choice: Et Dan
  rationale: Nom tribal rendu selon sa forme française habituelle.
- source_word: לָמָּה
  choice: pourquoi
  rationale: L’interrogation directe et sa force rhétorique sont maintenues.
- source_word: יָגוּר
  choice: séjourne-t-il
  rationale: Le verbe גור peut signifier résider ou séjourner, souvent comme étranger. « Séjourne-t-il » préserve cette valeur sans imposer l’idée plus interprétative de « s’attarder ».
- source_word: אֳנִיּוֹת
  choice: des navires
  rationale: Le pluriel désigne des embarcations maritimes; « navires » convient au registre poétique et au cadre côtier.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forme française traditionnelle du nom tribal.
- source_word: יָשַׁב
  choice: s’est tenu
  rationale: Le verbe signifie littéralement s’asseoir ou demeurer. « S’est tenu » reste naturel en français et conserve l’image d’une présence immobile sans suggérer nécessairement une posture physique.
- source_word: לְחוֹף יַמִּים
  choice: sur le rivage de la mer
  rationale: Rendu idiomatique du cadre côtier. Le pluriel hébreu « mers » peut fonctionner ici de façon géographique ou poétique et n’exige pas un pluriel français.
- source_word: מִפְרָצָיו
  choice: ses criques
  rationale: Le terme désigne des ouvertures ou découpures du littoral; « criques » préserve mieux cette image que l’interprétation fonctionnelle « ports ».
- source_word: יִשְׁכּוֹן
  choice: il est resté
  rationale: Le verbe de demeure reprend le thème de l’inaction; le passé composé s’accorde naturellement avec la narration poétique française.
