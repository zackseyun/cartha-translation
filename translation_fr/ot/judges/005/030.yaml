  text: הֲ/לֹ֨א יִמְצְא֜וּ יְחַלְּק֣וּ שָׁלָ֗ל רַ֤חַם רַחֲמָתַ֨יִם֙ לְ/רֹ֣אשׁ גֶּ֔בֶר שְׁלַ֤ל צְבָעִים֙ לְ/סִ֣יסְרָ֔א שְׁלַ֥ל צְבָעִ֖ים רִקְמָ֑ה צֶ֥בַע רִקְמָתַ֖יִם לְ/צַוְּארֵ֥י שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/030.yaml
  text: ‘Are they not finding and dividing the spoil? A womb[a], two wombs for each man; spoil of dyed cloths for Sisera, spoil of dyed cloths, embroidered cloth, dyed cloth[b], two embroideries for the necks of the spoil.’
translation:
  language: fr
  text: « Ne trouvent-ils pas et ne se partagent-ils pas le butin ? Un utérus[a], deux utérus pour chaque homme ; pour Sisera, un butin d’étoffes teintes, un butin d’étoffes teintes, une étoffe brodée — une étoffe teinte, deux broderies pour les cous du butin[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « un utérus, deux utérus » : métonymie brutale désignant des femmes capturées comme butin sexuel.'
    reason: lexical_alternative
  - marker: b
    text: Ou « pour les cous des captives », c’est-à-dire de personnes prises comme butin. La fin du verset est difficile en hébreu et peut évoquer des étoffes brodées portées au cou par des femmes capturées.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: Ne sont-ils pas
  rationale: Introduit la question rhétorique formulée par la mère de Sisera et ses dames, qui cherchent à expliquer son retard.
- source_word: יִמְצְאוּ יְחַלְּקוּ
  choice: en train de trouver et de partager
  rationale: Rend les deux verbes successifs et donne à l’attente imaginée un caractère actuel et vivant. « Partager » exprime ici la répartition du butin.
- source_word: שָׁלָל
  choice: butin
  rationale: Terme militaire courant et naturel pour ce qui est pris à l’ennemi après le combat.
- source_word: רַחַם רַחֲמָתַיִם
  choice: un utérus, deux utérus
  rationale: Conserve la métaphore corporelle brutale du texte hébreu ainsi que son duel numérique, sans l’atténuer en « une femme ou deux ».
- source_word: לְרֹאשׁ גֶּבֶר
  choice: pour chaque homme
  rationale: Littéralement « pour la tête d’un homme » ; l’expression a ici un sens distributif que le français rend naturellement par « chaque homme ».
- source_word: צְבָעִים
  choice: étoffes teintes
  rationale: Désigne vraisemblablement des textiles colorés ou teints faisant partie du butin ; « étoffes » convient à la mention parallèle de la broderie.
- source_word: רִקְמָה
  choice: une étoffe brodée
  rationale: Explicite en français la nature textile du terme tout en conservant l’image de la broderie.
- source_word: צֶבַע רִקְמָתַיִם
  choice: une étoffe teinte, deux broderies
  rationale: Suit l’enchaînement très condensé de l’hébreu et maintient le duel « deux », sans imposer une reconstruction syntaxique incertaine.
- source_word: לְצַוְּארֵי שָׁלָל
  choice: pour les cous du butin
  rationale: Traduction volontairement proche d’une expression hébraïque difficile ; une interprétation plus fluide est signalée en note plutôt que placée d’autorité dans le texte.
theological_decisions:
- issue: Faut-il atténuer la désignation sexualisée des femmes captives par רַחַם רַחֲמָתַיִם ?
  choice: Conserver la métaphore littérale « un utérus, deux utérus ».
  alternative: « Une femme, deux femmes » ou « une jeune fille ou deux ».
  rationale: Ces paroles expriment l’attente cruelle de la maison de Sisera et non une approbation du narrateur. La formulation déshumanisante fait partie de la force morale et poétique du chant.
- issue: Comment rendre la formule obscure לְצַוְּארֵי שָׁלָל ?
  choice: Maintenir dans le texte une formulation proche de l’hébreu et expliquer l’autre lecture en note.
  alternative: « Pour le cou des captives » ou « sur le cou des femmes prises comme butin ».
  rationale: La syntaxe hébraïque est comprimée et son référent demeure discuté ; choisir directement « captives » résoudrait une ambiguïté réelle que le texte ne tranche pas clairement.
translation_notes:
  register: Français international actuel, soutenu sans archaïsme. Le rythme accumulatif et les répétitions du chant sont conservés. La crudité de « utérus » est intentionnelle et reflète celle de la métaphore hébraïque ; la dernière expression reste délibérément étrange en raison de l’obscurité du texte source.
