  revision_rationale: La révision retire le superlatif non marqué et la tournure partitive, tout en conservant « princesses », le parallélisme du verset, l’insistance de אַף הִיא et l’orientation réflexive indiquée par לָהּ. La note est légèrement resserrée pour correspondre au texte révisé.
