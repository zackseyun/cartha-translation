  text: חַכְמ֥וֹת שָׂרוֹתֶ֖י/הָ תַּעֲנֶ֑ינָּה אַף הִ֕יא תָּשִׁ֥יב אֲמָרֶ֖י/הָ לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/029.yaml
  text: 'Her wisest princesses answer her; indeed, she herself repeats her words to herself:'
translation:
  language: fr
  text: 'Ses princesses les plus sages lui répondent ; elle aussi se répète à elle-même ses paroles[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle se répond à elle-même » ; littéralement : « elle fait revenir ses paroles vers elle-même ».'
    reason: Signaler l’ambiguïté réelle de תָּשִׁיב אֲמָרֶיהָ לָהּ entre le fait de répéter ses paroles et celui de se donner une réponse.
lexical_decisions:
- source_word: חַכְמוֹת שָׂרוֹתֶיהָ
  choice: Les plus sages de ses princesses
  rationale: Le féminin pluriel חַכְמוֹת qualifie les femmes de haut rang désignées par שָׂרוֹתֶיהָ. La tournure française exprime naturellement le superlatif implicite dans ce groupe nominal.
- source_word: תַּעֲנֶינָּה
  choice: lui répondent
  rationale: Le verbe ענה signifie ici « répondre » ; le pronom suffixe renvoie à la mère de Sisera.
- source_word: אַף הִיא
  choice: elle-même aussi
  rationale: Cette formulation conserve à la fois l’insistance portée par הִיא et la valeur additive ou emphatique de אַף.
- source_word: תָּשִׁיב אֲמָרֶיהָ לָהּ
  choice: se répète ses propres paroles
  rationale: Littéralement, elle « fait revenir » ses paroles vers elle-même. Dans le contexte, la mère reprend à son compte les réponses rassurantes de ses princesses ; « se répète » rend ce mouvement réflexif sans alourdir le français.
theological_decisions:
- issue: Ambiguïté entre répétition et réponse à soi-même
  choice: se répète ses propres paroles
  alternative: se répond à elle-même
  rationale: Le texte peut décrire soit une répétition intérieure, soit une réponse que la mère se formule elle-même. Le texte principal suit le sens contextuel de répétition, tandis que la note conserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, fluide et digne. « Princesses » maintient le rang élevé des femmes de la cour, et la structure parallèle du vers hébreu est conservée.
