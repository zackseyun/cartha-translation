  yaml_path: translation/ot/judges/005/012.yaml
  text: Awake[a], awake, Deborah! Awake, awake, sing a song! Rise up, Barak, and take captive your captives[b], son of Abinoam.
translation:
  language: fr
  text: Réveille-toi, réveille-toi, Débora ! Réveille-toi, réveille-toi, entonne un chant[a] ! Lève-toi, Barak, et emmène tes captifs[b], fils d’Abinoam !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parle un chant ». Le verbe hébreu signifie proprement « parler » plutôt que « chanter ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, l’hébreu répète la racine de « captif/captivité » : « emmène captif tes captifs ». Le nom peut désigner les captifs collectivement ou la captivité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: Réveille-toi
  rationale: L’impératif féminin singulier, répété quatre fois, adresse à Débora un appel pressant. « Réveille-toi » conserve l’image et la vigueur poétique.
- source_word: דְּבוֹרָה
  choice: Débora
  rationale: Forme française usuelle du nom propre biblique.
- source_word: דַּבְּרִי שִׁיר
  choice: entonne un chant
  rationale: Littéralement « parle un chant ». En français, « entonne un chant » exprime naturellement l’acte demandé tout en gardant le caractère solennel et poétique de la formule.
- source_word: קוּם
  choice: Debout !
  rationale: L’impératif masculin singulier adressé à Barak appelle à l’action. La formulation brève restitue l’énergie martiale du vers.
- source_word: בָּרָק
  choice: Barak
  rationale: Translittération française usuelle du nom propre.
- source_word: וּשֲׁבֵה שֶׁבְיְךָ
  choice: Emmène tes captifs en captivité
  rationale: La formulation conserve la répétition étymologique hébraïque entre le verbe « emmener captif » et le nom « captifs/captivité », sans réduire le sens à une simple victoire.
- source_word: בֶּן אֲבִינֹעַם
  choice: fils d’Abinoam
  rationale: La formule patronymique est conservée selon l’usage biblique français.
