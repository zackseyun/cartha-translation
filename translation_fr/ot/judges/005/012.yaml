review_pass:
  verdict: revise
  source_fidelity: Les appels répétés à Débora et à Barak, les genres des impératifs et le patronyme sont bien rendus. Toutefois, « Emmène tes captifs en captivité » ajoute une notion absente du texte et produit une formulation française incohérente. Le syntagme hébreu וּשֲׁבֵה שֶׁבְיְךָ conserve une répétition de racine et peut désigner les captifs collectivement; « emmène tes captifs » le traduit sans ajout, avec une note qui signale l'idiome.
  naturalness: « Réveille-toi » et « entonne un chant » sont naturels dans un registre poétique moderne. « Lève-toi » rend plus directement קוּם que l'ellipse « Debout ! ». « Emmène tes captifs » est idiomatique, contrairement à « emmène tes captifs en captivité ».
  terminology: Débora, Barak et Abinoam sont des formes françaises bibliques recevables. « Captifs » convient au contexte militaire et maintient l'ambiguïté collective de שֶׁבְיְךָ. La note sur « parle un chant » préserve la particularité du verbe דבר sans imposer une interprétation confessionnelle.
  issues:
  - severity: high
    issue: « Emmène tes captifs en captivité » ajoute « en captivité » et déforme la construction.
    rationale: Le texte hébreu ne comporte pas de complément équivalent à « en captivité ». Il emploie un verbe de prise/transport en captivité suivi de « tes captifs/ta captivité », avec répétition de racine. La formulation française actuelle est à la fois redondante et sémantiquement fautive.
  - severity: low
    issue: La note b donne un prétendu littéral au singulier (« ton captif ») et ne reflète pas clairement la valeur collective ou ambiguë du nom hébreu.
    rationale: שֶׁבְיְךָ peut être compris comme « tes captifs » ou « ta captivité ». La note doit signaler la répétition verbale sans présenter une analyse singulière restrictive.
  - severity: low
    issue: « Debout ! » est possible mais moins directement verbal que קוּם.
    rationale: « Lève-toi » conserve explicitement l'impératif et l'élan de l'appel.
