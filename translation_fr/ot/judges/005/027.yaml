  text: Between her feet he sank[a], he fell, he lay; between her feet he sank, he fell; where he sank[c][b], there he fell—destroyed.
translation:
  language: fr
  text: Entre ses pieds[a], il s’affaissa, il tomba, il resta étendu ; entre ses pieds, il s’affaissa, il tomba[b] ; là où il s’affaissa, là il tomba, anéanti[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ses pieds », formulation moins littérale que « entre ses pieds ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu répète cette suite de verbes très courts pour produire un effet poétique d’insistance.
    reason: cultural_note
  - marker: c
    text: Ou « détruit » ; le mot hébreu peut désigner quelqu’un de ravagé, dépouillé ou entièrement défait.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין רַגְלֶיהָ
  choice: entre ses pieds
  rationale: Rend directement l’expression spatiale hébraïque et en conserve la répétition. « Entre ses jambes » serait anatomiquement plus explicite, tandis que « à ses pieds » atténuerait l’image.
- source_word: כָּרַע
  choice: il s’affaissa
  rationale: Dans cette scène de mort, le verbe décrit le mouvement du corps qui ploie et s’effondre, sans suggérer une révérence volontaire comme le ferait « se prosterner ».
- source_word: נָפַל
  choice: il tomba
  rationale: Équivalent direct, répété sans variation afin de préserver le rythme et l’intensification du poème.
- source_word: שָׁכָב
  choice: il resta étendu
  rationale: Exprime ici la position immobile qui suit la chute. Cette formulation est plus naturelle en français que le simple « il se coucha », qui pourrait suggérer un geste volontaire.
- source_word: בַּאֲשֶׁר ... שָׁם
  choice: là où ... là
  rationale: Conserve la corrélation spatiale et l’insistance du texte hébreu.
- source_word: שָׁדוּד
  choice: abattu
  rationale: Dans le contexte de la mort de Sisera, ce participe présente l’homme comme entièrement défait et tué. « Abattu » est naturel pour une personne tombée sous les coups, tout en restant plus proche de l’image que le simple « mort ».
