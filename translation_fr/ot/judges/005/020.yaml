id: JDG.5.20
reference: Judges 5:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִן שָׁמַ֖יִם נִלְחָ֑מוּ הַ/כּֽוֹכָבִים֙ מִ/מְּסִלּוֹתָ֔/ם נִלְחֲמ֖וּ עִם סִיסְרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/020.yaml
  text: From heaven the stars fought[b][a]; from their courses they fought against Sisera.
translation:
  language: fr
  text: Du ciel, les étoiles ont combattu ; depuis leurs trajectoires[a], elles ont combattu contre Sisera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis leurs chemins » ou « depuis leurs pistes » ; le terme hébreu peut désigner des routes ou des voies, ici probablement les parcours assignés aux étoiles dans le ciel.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « avec Sisera » ; dans un contexte de bataille, cette tournure signifie couramment « contre Sisera ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן שָׁמַיִם
  choice: Du ciel
  rationale: Rend naturellement en français la provenance exprimée par מִן avec שָׁמַיִם, sans forcer le pluriel morphologique hébreu.
- source_word: נִלְחָמוּ
  choice: ont combattu
  rationale: Exprime directement le sens guerrier du nifal de לחם et conserve la répétition poétique du verbe.
- source_word: הַכּוֹכָבִים
  choice: les étoiles
  rationale: Correspond au sens ordinaire du nom avec son article défini et préserve l’image poétique sans l’interpréter.
- source_word: מִמְּסִלּוֹתָם
  choice: depuis leurs trajectoires
  rationale: Dans ce contexte céleste, « trajectoires » évoque les voies suivies par les étoiles tout en gardant la métaphore spatiale du terme hébreu.
- source_word: עִם סִיסְרָא
  choice: contre Sisera
  rationale: Avec un verbe de combat, עִם désigne ici naturellement l’adversaire ; « contre » communique clairement cette valeur en français.
theological_decisions:
- issue: Nature de la participation des étoiles au combat
  choice: Conserver l’affirmation poétique selon laquelle les étoiles ont combattu, sans en préciser le mécanisme.
  alternative: Y voir explicitement une intervention cosmique littérale, l’armée angélique ou une métaphore des forces naturelles gouvernées par Dieu.
  rationale: Le cantique présente les étoiles comme combattantes sans expliquer de quelle manière. La formulation maintient donc l’image et son ambiguïté théologique.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « ont combattu » reproduit la structure hébraïque ; « trajectoires » reste accessible tout en convenant à l’imagerie céleste.
