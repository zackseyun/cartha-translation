  text: 'Then Deborah and Barak son of Abinoam sang on that day[a], saying:'
translation:
  language: fr
  text: 'Ce jour-là, Déborah et Barak, fils d’Abinoam, chantèrent[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En hébreu, le verbe est au singulier : « Déborah chanta », puis Barak est ajouté. Dans le contexte, Déborah et Barak chantent ensemble.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשַׁר
  choice: chantèrent
  rationale: Le verbe שׁיר signifie « chanter ». Bien que l’hébreu emploie un verbe féminin singulier accordé avec Déborah, premier sujet nommé, le français courant met le verbe au pluriel avec le sujet composé « Déborah et Barak ». Aucun complément tel que « ce chant » n’est ajouté.
- source_word: דְּבוֹרָה
  choice: Déborah
  rationale: Forme française usuelle du nom propre.
- source_word: וּבָרָק
  choice: et Barak
  rationale: La conjonction et le nom propre sont rendus directement.
- source_word: בֶּן אֲבִינֹעַם
  choice: fils d’Abinoam
  rationale: Rendu français naturel de la construction patronymique hébraïque, en apposition à Barak.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Expression temporelle naturelle en français qui conserve la référence au jour précis de la victoire.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le participe quotatif hébreu introduit les paroles du chant. En français moderne, les deux-points remplissent naturellement cette fonction sans la tournure lourde « en disant ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit biblique et « chantèrent » évite d’ajouter un objet absent de l’hébreu. Le marqueur [a] est placé immédiatement après le verbe concerné.
