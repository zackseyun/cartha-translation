  text: וַ/יַּעַשׂ֩ ל֨/וֹ אֵה֜וּד חֶ֗רֶב וְ/לָ֛/הּ שְׁנֵ֥י פֵי֖וֹת גֹּ֣מֶד אָרְכָּ֑/הּ וַ/יַּחְגֹּ֤ר אוֹתָ/הּ֙ מִ/תַּ֣חַת לְ/מַדָּ֔י/ו עַ֖ל יֶ֥רֶךְ יְמִינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/016.yaml
  text: Ehud made himself a sword with two edges[a], a cubit in length[b], and strapped it on under his clothes on his right thigh.
translation:
  language: fr
  text: Éhoud se fabriqua une épée à deux tranchants[a], longue d’un gomed[b], et l’attacha sous ses vêtements, sur sa cuisse droite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une épée, et elle avait deux bouches »; cette expression désigne une lame à deux tranchants.'
    reason: lexical_alternative
  - marker: b
    text: Le gomed est une ancienne unité de longueur rarement mentionnée, dont la valeur exacte est incertaine. On l’estime souvent à environ une coudée, soit la longueur d’un avant-bras.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: se fabriqua
  rationale: La construction avec לוֹ indique qu’Éhoud fabriqua l’arme pour son propre usage. « Se fabriqua » exprime naturellement cette nuance en français.
- source_word: חֶרֶב
  choice: épée
  rationale: חֶרֶב est le terme courant pour une épée. Même si sa longueur peut évoquer une arme courte, traduire par « poignard » préciserait davantage que le texte hébreu.
- source_word: וְלָהּ שְׁנֵי פֵיוֹת
  choice: à deux tranchants
  rationale: L’expression signifie littéralement que l’épée avait « deux bouches », image hébraïque désignant deux tranchants. La formulation retenue est claire et fidèle.
- source_word: גֹּמֶד אָרְכָּהּ
  choice: longue d’un gomed
  rationale: גֹּמֶד est une unité de longueur rare dont la valeur exacte demeure incertaine. Conserver son nom dans le texte évite de transformer une approximation en mesure certaine; la note fournit l’explication nécessaire.
- source_word: וַיַּחְגֹּר אוֹתָהּ
  choice: l’attacha
  rationale: חגר décrit le fait de ceindre ou de fixer une arme sur soi. « L’attacha » convient au geste sans supposer la présence explicite d’une ceinture.
- source_word: מִתַּחַת לְמַדָּיו
  choice: sous ses vêtements
  rationale: מַד peut désigner un vêtement ou l’habillement. Le pluriel français est naturel et n’impose pas un type précis de vêtement.
- source_word: עַל יֶרֶךְ יְמִינוֹ
  choice: sur sa cuisse droite
  rationale: יָרֵךְ désigne la cuisse ou la région de la hanche. « Sur sa cuisse droite » rend directement l’emplacement indiqué.
