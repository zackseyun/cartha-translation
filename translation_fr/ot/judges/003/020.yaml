base_translation:
  language: en
  yaml_path: translation/ot/judges/003/020.yaml
  text: Then Ehud came to him while he was sitting alone in his cool roof chamber[a], and Ehud said[c][b], “I have a word from God for you.” So he rose from his seat.
translation:
  language: fr
  text: 'Éhoud vint auprès de lui, alors qu’il était assis dans la pièce haute et fraîche qu’il avait pour lui seul[a]. Éhoud lui dit : « J’ai une parole de Dieu pour toi. » Alors il se leva de son siège[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la chambre haute fraîche » ; le sens précis du terme hébreu décrivant cette pièce est incertain.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner une chaise ou un trône.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: vint auprès de lui
  rationale: Le verbe exprime l’arrivée d’Éhoud auprès d’Églon, sans préciser davantage la manière dont il s’approche.
- source_word: יֹשֵׁב
  choice: était assis
  rationale: Le participe hébreu décrit l’action en cours qui forme l’arrière-plan de la scène.
- source_word: עֲלִיַּת הַמְּקֵרָה
  choice: la pièce fraîche à l’étage
  rationale: עֲלִיָּה désigne une pièce haute ou aménagée sur le toit, et מְקֵרָה semble caractériser un lieu frais ou rafraîchi. Cette formulation restitue les deux éléments en français naturel sans préciser un dispositif inconnu.
- source_word: אֲשֶׁר לוֹ לְבַדּוֹ
  choice: seul
  rationale: L’expression souligne qu’Églon avait cette pièce pour lui seul et met surtout en relief son isolement au moment de l’action.
- source_word: דְּבַר אֱלֹהִים
  choice: une parole de Dieu
  rationale: La traduction conserve le terme concret « parole » et l’indétermination du nom hébreu, tout en laissant entendre qu’il s’agit d’un message adressé à Églon.
- source_word: וַיָּקָם
  choice: il se leva
  rationale: Rendu direct et naturel du verbe hébreu dans ce contexte narratif.
- source_word: מֵעַל הַכִּסֵּא
  choice: de son siège
  rationale: כִּסֵּא peut désigner un siège, une chaise ou un trône. « Siège » préserve cette latitude dans le cadre privé de la scène.
theological_decisions:
- issue: Sens de אֱלֹהִים dans la déclaration d’Éhoud
  choice: Dieu
  alternative: les dieux / une divinité
  rationale: Bien que la forme soit morphologiquement plurielle, אֱלֹהִים désigne très couramment Dieu au singulier. Dans דְּבַר אֱלֹהִים, « une parole de Dieu » est la lecture contextuelle la plus naturelle. La traduction rapporte la déclaration d’Éhoud sans trancher explicitement la question de son intention.
translation_notes:
  register: Français international moderne, narratif et digne. « Pièce fraîche à l’étage » reste accessible tout en conservant les données architecturales et climatiques probables du texte. Le tutoiement correspond à l’adresse directe au singulier dans cette scène privée.
