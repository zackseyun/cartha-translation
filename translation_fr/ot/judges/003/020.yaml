    text: Ou « dans la chambre haute fraîche » ; le sens précis du terme hébreu décrivant cette pièce est incertain.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner une chaise ou un trône.
    reason: lexical_alternative
