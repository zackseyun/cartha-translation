  text: וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יָשְׁב֖וּ בְּ/קֶ֣רֶב הַֽ/כְּנַעֲנִ֑י הַ/חִתִּ֤י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/005.yaml
  text: And the sons of Israel lived among the Canaanites[a], the Hittites, the Amorites, the Perizzites, the Hivites, and the Jebusites.
translation:
  language: fr
  text: Les fils d’Israël habitaient parmi les Cananéens[a], les Hittites, les Amorites, les Perizzites, les Hivites et les Jébusites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « les Israélites ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Les fils d’Israël
  rationale: Rend formellement le masculin pluriel בְּנֵי (« fils de ») et conserve l’expression familiale de l’hébreu. En français courant, « les Israélites » serait plus idiomatique, mais moins proche de la forme du texte source.
- source_word: יָשְׁבוּ
  choice: habitaient
  rationale: Le verbe ישׁב désigne ici une résidence durable. « Habitaient » est naturel, actuel et moins susceptible que « s’établirent » de suggérer uniquement le début de l’installation.
- source_word: בְּקֶרֶב
  choice: parmi
  rationale: Dans cette construction, le terme exprime la présence au milieu d’autres peuples. « Parmi » en donne une traduction française concise et naturelle.
- source_word: הַכְּנַעֲנִי
  choice: les Cananéens
  rationale: L’ethnonyme hébreu est morphologiquement singulier mais possède ici un sens collectif; le pluriel est idiomatique en français.
- source_word: הַחִתִּי
  choice: les Hittites
  rationale: Le singulier collectif hébreu est rendu par le pluriel français usuel pour désigner ce peuple.
- source_word: הָאֱמֹרִי
  choice: les Amorites
  rationale: Le singulier collectif hébreu est rendu par le pluriel français usuel dans cette liste de peuples.
- source_word: הַפְּרִזִּי
  choice: les Perizzites
  rationale: Le singulier collectif hébreu est rendu au pluriel. La forme « Perizzites » maintient une translittération française claire du nom du peuple.
- source_word: הַחִוִּי
  choice: les Hivites
  rationale: Le singulier collectif hébreu est rendu par le pluriel français idiomatique.
- source_word: הַיְבוּסִי
  choice: les Jébusites
  rationale: Le singulier collectif hébreu est rendu par le pluriel français idiomatique, avec l’orthographe française courante.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu sans archaïsme. Les ethnonymes collectifs sont naturellement mis au pluriel; la tournure plus formelle « les fils d’Israël » est conservée et expliquée en note.
