  yaml_path: translation/ot/judges/003/011.yaml
  text: So the land had rest for forty years. Then Othniel son of Kenaz died.
translation:
  language: fr
  text: Le pays connut le repos pendant quarante ans. Puis Otniel, fils de Qenaz, mourut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: connut le repos
  rationale: Le verbe שׁקט évoque le calme et l'absence de troubles. Dans ce contexte de délivrance, « connut le repos » exprime naturellement une période sans oppression, sans ajouter l'idée d'une prospérité totale.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans le contexte des Juges, אֶרֶץ désigne le territoire habité par Israël, et non la terre entière. « Le pays » est ici naturel et précis en français moderne.
- source_word: אַרְבָּעִים שָׁנָה
  choice: pendant quarante ans
  rationale: L'accusatif marque une durée. « Pendant quarante ans » explicite cette valeur temporelle en français courant.
- source_word: וַיָּמָת
  choice: Puis … mourut
  rationale: Le wayyiqtol fait progresser le récit. « Puis » rend clairement la succession narrative sans reproduire mécaniquement la conjonction hébraïque.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Cette forme francisée courante reste proche de la translittération du nom hébreu.
- source_word: בֶּן קְנַז
  choice: fils de Qenaz
  rationale: La construction génitivale identifie Otniel par sa filiation. « Fils de Qenaz » est clair et direct; la graphie Qenaz distingue le qof initial.
