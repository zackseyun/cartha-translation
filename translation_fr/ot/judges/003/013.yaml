  text: וַ/יֶּאֱסֹ֣ף אֵלָ֔י/ו אֶת בְּנֵ֥י עַמּ֖וֹן וַ/עֲמָלֵ֑ק וַ/יֵּ֗לֶךְ וַ/יַּךְ֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽירְשׁ֖וּ אֶת עִ֥יר הַ/תְּמָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/013.yaml
  text: He gathered to himself the Ammonites and Amalek[a], and he went and struck Israel[b], and they took possession of the City of Palms.
translation:
  language: fr
  text: Il rassembla auprès de lui les Ammonites et les Amalécites. Puis il alla frapper Israël, et ils prirent possession de la Ville des Palmiers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit probablement de Jéricho ; voir Deutéronome 34.3 et 2 Chroniques 28.15.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֶּאֱסֹף אֵלָיו
  choice: Il rassembla auprès de lui
  rationale: La tournure avec אֵלָיו exprime le rassemblement d’alliés autour du roi; « auprès de lui » conserve cette nuance sans alourdir le français.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: C’est l’ethnonyme français naturel pour « les fils d’Ammon » dans ce contexte narratif.
- source_word: עֲמָלֵק
  choice: les Amalécites
  rationale: Le nom propre collectif désigne ici le peuple; l’ethnonyme français rend clairement ce sens collectif.
- source_word: וַיֵּלֶךְ
  choice: puis il marcha contre
  rationale: Dans la séquence militaire, « marcha contre » exprime naturellement le déplacement hostile vers Israël, sans aller jusqu’à traduire le verbe par « attaqua ».
- source_word: וַיַּךְ אֶת יִשְׂרָאֵל
  choice: et le frappa
  rationale: נכה signifie littéralement « frapper » et peut avoir un sens militaire. Le pronom reprend Israël comme entité collective et évite de préciser davantage l’issue du combat.
- source_word: וַיִּירְשׁוּ
  choice: Ils prirent possession de
  rationale: La forme verbale est au pluriel et renvoie au roi avec ses forces alliées. « Prendre possession de » rend le résultat de la conquête sans effacer ce pluriel.
- source_word: עִיר הַתְּמָרִים
  choice: la Ville des Palmiers
  rationale: La désignation descriptive est conservée comme nom de lieu plutôt que remplacée dans le texte par l’identification probable à Jéricho.
theological_decisions:
- issue: Identification de עִיר הַתְּמָרִים
  choice: Conserver « la Ville des Palmiers » dans le texte principal.
  alternative: Traduire directement par « Jéricho ».
  rationale: L’hébreu emploie une désignation descriptive, non le nom explicite de Jéricho. La traduction préserve cette forme et place l’identification probable en note.
translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque est légèrement structurée par « puis » et par une nouvelle phrase afin d’assurer une lecture naturelle, tout en maintenant la succession des actions et le changement du sujet singulier au sujet pluriel.
