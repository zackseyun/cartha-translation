  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּכּ֨וּ אֶת מוֹאָ֜ב בָּ/עֵ֣ת הַ/הִ֗יא כַּ/עֲשֶׂ֤רֶת אֲלָפִים֙ אִ֔ישׁ כָּל שָׁמֵ֖ן וְ/כָל אִ֣ישׁ חָ֑יִל וְ/לֹ֥א נִמְלַ֖ט אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/029.yaml
  text: And at that time they struck down about ten thousand men of Moab[a], every stout man and every man of valor[c][b]; not a man escaped.
translation:
  language: fr
  text: En ce temps-là, ils abattirent environ dix mille hommes de Moab, tous robustes[a] et tous vaillants[b]. Aucun n’échappa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « tous les gras » ; l’expression désigne probablement ici des hommes bien nourris, solides ou vigoureux.
    reason: lexical_alternative
  - marker: b
    text: Ou « tous les hommes de valeur », « tous les hommes capables » ; l’expression hébraïque peut désigner des guerriers valeureux ou puissants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: ils abattirent
  rationale: Dans ce contexte militaire, נכה désigne le fait de frapper mortellement ou de tuer au combat. « Abattirent » exprime l’issue violente sans ajouter de précision étrangère au texte.
- source_word: אֶת מוֹאָב
  choice: hommes de Moab
  rationale: L’hébreu porte littéralement « Moab », mais l’apposition « environ dix mille hommes » montre qu’il s’agit ici d’hommes moabites. Cette formulation rend le référent explicite en français.
- source_word: בָּעֵת הַהִיא
  choice: En ce temps-là
  rationale: Expression temporelle française naturelle et proche de l’hébreu.
- source_word: כַּעֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: environ dix mille hommes
  rationale: Le préfixe כ marque ici l’approximation ; « environ » restitue clairement cette nuance.
- source_word: כָּל שָׁמֵן
  choice: tous robustes
  rationale: שָׁמֵן signifie littéralement « gras », mais, dans ce cadre guerrier, évoque vraisemblablement des hommes bien nourris, solides ou vigoureux. « Robustes » communique cette valeur sans réduire l’expression à la corpulence.
- source_word: וְכָל אִישׁ חָיִל
  choice: et tous vaillants
  rationale: אִישׁ חַיִל peut désigner un homme valeureux, puissant ou apte au combat. « Vaillants » convient au contexte militaire et reste naturel.
- source_word: וְלֹא נִמְלַט אִישׁ
  choice: Aucun n’échappa
  rationale: 'La tournure rend avec concision l’idée distributive et absolue de l’hébreu : pas un seul homme ne parvint à s’échapper.'
