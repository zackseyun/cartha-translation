source:
  edition: WLC
  text: וְ/אַחֲרָ֤י/ו הָיָה֙ שַׁמְגַּ֣ר בֶּן עֲנָ֔ת וַ/יַּ֤ךְ אֶת פְּלִשְׁתִּים֙ שֵֽׁשׁ מֵא֣וֹת אִ֔ישׁ בְּ/מַלְמַ֖ד הַ/בָּקָ֑ר וַ/יֹּ֥שַׁע גַּם ה֖וּא אֶת יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/031.yaml
  text: After him was Shamgar son of Anath[a], and he struck down six hundred Philistines with an ox goad[b]; he too saved Israel.
translation:
  language: fr
  text: Après lui, il y eut Shamgar, fils d’Anath[a]. Il abattit six cents Philistins avec un aiguillon à bœufs[b] ; lui aussi sauva[c] Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « fils d’Anath » peut indiquer une filiation ou être une épithète ; son sens précis est incertain.
    reason: ambiguïté historique et onomastique
  - marker: b
    text: Un aiguillon à bœufs était un bâton, généralement muni d’une pointe, utilisé pour faire avancer les bovins.
    reason: note culturelle
  - marker: c
    text: Ou « délivra ». Le verbe hébreu peut désigner un secours ou une délivrance militaire.
    reason: variante lexicale
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Après lui
  rationale: Rend littéralement le lien avec le personnage précédent sans ajouter explicitement le nom d’Éhoud.
- source_word: הָיָה
  choice: vint
  rationale: Dans cette présentation successive d’un nouveau personnage, « vint » donne en français une tournure narrative naturelle sans préciser davantage son statut.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: Shamgar, fils d’Anath
  rationale: Conserve le nom et la désignation hébraïque, dont la nature exacte — filiation ou épithète — reste incertaine.
- source_word: וַיַּךְ
  choice: abattit
  rationale: Le verbe désigne ici des coups violents dans un contexte de combat, vraisemblablement mortels ; « abattit » exprime cela sans réduire le sens à une simple victoire.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: six cents Philistins
  rationale: Le nom אִישׁ accompagne le nombre, mais le français exprime naturellement l’ensemble compté par « six cents Philistins ».
- source_word: בְּמַלְמַד הַבָּקָר
  choice: avec un aiguillon à bœufs
  rationale: Désigne un bâton pointu servant à faire avancer les bovins ; cette expression conserve l’image agricole du texte.
- source_word: וַיֹּשַׁע
  choice: sauva
  rationale: Le verbe ישׁע exprime le fait de secourir ou de délivrer, notamment dans un contexte militaire. « Sauva » reste clair et reprend le vocabulaire thématique du livre.
- source_word: גַּם הוּא
  choice: lui aussi
  rationale: Préserve l’accent additif qui présente Shamgar comme un autre sauveur d’Israël.
theological_decisions:
- issue: Nature du salut accompli par Shamgar
  choice: lui aussi sauva Israël
  alternative: lui aussi délivra Israël
  rationale: Le texte attribue à Shamgar un véritable secours libérateur sans en définir l’étendue ni la durée. « Sauva » conserve la portée du verbe tout en laissant le contexte militaire guider son interprétation.
translation_notes:
  register: Français international moderne, narratif et digne. « Aiguillon à bœufs » conserve la réalité ancienne sans employer le moderne « aiguillon électrique ». La ponctuation en deux phrases allège la longue coordination hébraïque tout en maintenant la progression du récit.
