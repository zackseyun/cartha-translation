base_translation:
  language: en
  yaml_path: translation/ot/judges/003/024.yaml
  text: When he had gone out[a], his servants came and looked, and behold, the doors of the upper room were locked. So they said, “Surely he is relieving himself in the cool inner room.”
translation:
  language: fr
  text: 'Quand il fut sorti, ses serviteurs vinrent et virent que les portes de la chambre haute étaient verrouillées. Ils dirent : « Il est sûrement en train de se soulager[a] dans la pièce fraîche. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il couvre ses pieds », euphémisme hébreu signifiant se soulager.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יָצָא
  choice: Quand il fut sorti
  rationale: La proposition renvoie à la sortie d’Éhoud et situe l’arrivée des serviteurs dans le temps. Le pronom de l’hébreu est conservé sans expliciter le nom.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans ce contexte de maison royale, le terme désigne naturellement les serviteurs ou gens de service du roi, sans que leur statut juridique soit précisé.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: vinrent et virent que
  rationale: Cette formulation française restitue l’arrivée suivie du constat, tandis qu’une reproduction littérale de « voici » serait moins naturelle ici.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: les portes de la chambre haute
  rationale: עֲלִיָּה désigne une pièce située à l’étage ou en hauteur; « chambre haute » reste clair et respecte la donnée architecturale.
- source_word: נְעֻלוֹת
  choice: étaient verrouillées
  rationale: Le participe indique que les portes avaient été fermées au verrou; « verrouillées » est précis et idiomatique.
- source_word: אַךְ
  choice: sûrement
  rationale: La particule exprime ici l’assurance avec laquelle les serviteurs tirent leur conclusion.
- source_word: מֵסִיךְ הוּא אֶת רַגְלָיו
  choice: Il est sûrement en train de se soulager
  rationale: L’expression hébraïque, littéralement « couvrir ses pieds », est un euphémisme corporel. Le sens est donné clairement dans le texte, et l’image originale est conservée en note.
- source_word: בַּחֲדַר הַמְּקֵרָה
  choice: dans la pièce fraîche
  rationale: L’expression désigne une pièce ou chambre associée à la fraîcheur. « Pièce fraîche » conserve ce sens sans ajouter avec certitude qu’elle était intérieure ou ventilée.
