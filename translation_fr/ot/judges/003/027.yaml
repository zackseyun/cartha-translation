base_translation:
  language: en
  yaml_path: translation/ot/judges/003/027.yaml
  text: And when he arrived[a], he blew the trumpet in the hill country of Ephraim, and the sons of Israel went down with him from the hill country[b], and he was before them.
translation:
  language: fr
  text: Lorsqu’il arriva, il sonna de la trompe dans la région montagneuse d’Éphraïm. Les Israélites descendirent avec lui de la région montagneuse, et il était à leur tête.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאוֹ
  choice: Lorsqu’il arriva
  rationale: La construction introduit une transition temporelle. Cette formulation française restitue naturellement la succession narrative sans reproduire lourdement « il arriva que ».
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: il sonna de la trompe
  rationale: Le שׁוֹפָר est une trompe faite d’une corne et servant ici à donner un signal. « Sonner de la trompe » est précis, naturel et adapté au contexte militaire.
- source_word: בְּהַר אֶפְרָיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: Dans cette désignation géographique, הַר renvoie aux hauteurs ou au territoire montagneux d’Éphraïm plutôt qu’à un sommet unique.
- source_word: וַיֵּרְדוּ עִמּוֹ בְנֵי יִשְׂרָאֵל
  choice: Les Israélites descendirent avec lui
  rationale: בְנֵי יִשְׂרָאֵל désigne ici collectivement les membres du peuple d’Israël qui répondent au signal. « Les Israélites » est le rendu moderne le plus naturel, sans exclure que le groupe soit constitué de combattants.
- source_word: מִן הָהָר
  choice: de la montagne
  rationale: L’expression reprend la zone élevée déjà mentionnée. Le singulier collectif français « la montagne » conserve la forme du texte tout en évitant une répétition pesante de « région montagneuse ».
- source_word: וְהוּא לִפְנֵיהֶם
  choice: et il était à leur tête
  rationale: Littéralement, Éhoud était « devant eux ». L’expression française « à leur tête » conserve à la fois sa position en avant du groupe et l’implication contextuelle de conduite, sans transformer explicitement l’énoncé en « il les commandait ».
theological_decisions:
- issue: Portée du collectif masculin בְנֵי יִשְׂרָאֵל
  choice: Les Israélites
  alternative: les fils d’Israël
  rationale: La locution hébraïque est un nom collectif conventionnel désignant les membres du peuple d’Israël. Dans ce contexte, elle vise vraisemblablement la troupe mobilisée, mais le texte ne dit pas explicitement « les hommes » ni « les soldats » ; le rendu collectif naturel préserve donc cette réserve.
- issue: Valeur de וְהוּא לִפְנֵיהֶם
  choice: il était à leur tête
  alternative: il marchait devant eux
  rationale: Le texte exprime directement la position d’Éhoud devant les Israélites, avec une implication de direction. « À leur tête » maintient cette tension entre position spatiale et rôle de chef.
translation_notes:
  register: Français international moderne, narratif et digne. Les temps du récit sont au passé simple. La formulation privilégie la clarté géographique et conserve le caractère sobre de l’hébreu sans calques artificiels.
