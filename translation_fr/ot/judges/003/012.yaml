id: JDG.3.12
reference: Judges 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְחַזֵּ֨ק יְהוָ֜ה אֶת עֶגְל֤וֹן מֶֽלֶךְ מוֹאָב֙ עַל יִשְׂרָאֵ֔ל עַ֛ל כִּֽי עָשׂ֥וּ אֶת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/012.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and Yahweh strengthened Eglon king of Moab against Israel, because they had done what was evil in the eyes of Yahweh.
translation:
  language: fr
  text: Les Israélites[a] firent de nouveau ce qui est mal aux yeux de Yahweh. Alors Yahweh fortifia Églôn, roi de Moab, contre Israël, parce qu’ils avaient fait ce qui est mal aux yeux de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël »; c’est-à-dire le peuple d’Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: firent de nouveau
  rationale: L’expression יסף suivie de l’infinitif indique ici la répétition. « Firent de nouveau » rend naturellement le retour au mal dans le cycle narratif des Juges.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Littéralement « les fils d’Israël ». En français moderne, « les Israélites » exprime clairement et dignement l’ensemble du peuple sans donner à tort l’impression qu’il ne s’agit que des hommes.
- source_word: לַעֲשׂוֹת הָרַע
  choice: firent ce qui est mal
  rationale: Cette formulation française naturelle conserve la valeur morale et évaluative de הָרַע, plutôt que de rendre mécaniquement l’article hébreu.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La traduction conserve la métaphore hébraïque, qui demeure courante et intelligible en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַיְחַזֵּק
  choice: fortifia
  rationale: Le piel de חזק attribue directement à Yahweh l’action de rendre Églôn fort. « Fortifia » préserve cette causalité sans l’atténuer en simple permission.
- source_word: אֶת עֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: Églôn, roi de Moab
  rationale: L’apposition est rendue de façon concise et naturelle; l’accent graphique aide à guider la prononciation française du nom.
- source_word: עַל יִשְׂרָאֵל
  choice: contre Israël
  rationale: Dans ce contexte d’hostilité, עַל marque l’action dirigée contre Israël plutôt qu’une simple position ou domination.
- source_word: עַל כִּי
  choice: parce que
  rationale: Les particules introduisent explicitement la raison de l’action divine; « parce que » en est l’équivalent français clair.
- source_word: עָשׂוּ אֶת הָרַע
  choice: ils avaient fait ce qui est mal
  rationale: Le plus-que-parfait français présente naturellement la conduite antérieure d’Israël comme le motif du jugement, sans modifier le rapport logique du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin. « Yahweh » le conserve au lieu de le remplacer par un titre traditionnel.
- issue: Agentivité divine dans וַיְחַזֵּק יְהוָה אֶת עֶגְלוֹן
  choice: Yahweh fortifia Églôn
  alternative: Yahweh permit à Églôn de devenir puissant
  rationale: La forme verbale présente Yahweh comme l’agent qui rend Églôn fort. La traduction maintient cette tension théologique et n’introduit pas la notion de simple permission.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination initiale hébraïque est rendue par deux phrases, avec « Alors » pour maintenir la progression narrative. Le métalangage biblique « aux yeux de Yahweh » est conservé parce qu’il reste transparent en français.
