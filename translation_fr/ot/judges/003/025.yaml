  text: וַ/יָּחִ֣ילוּ עַד בּ֔וֹשׁ וְ/הְנֵּ֛ה אֵינֶ֥/נּוּ פֹתֵ֖חַ דַּלְת֣וֹת הָֽ/עֲלִיָּ֑ה וַ/יִּקְח֤וּ אֶת הַ/מַּפְתֵּ֨חַ֙ וַ/יִּפְתָּ֔חוּ וְ/הִנֵּה֙ אֲדֹ֣נֵי/הֶ֔ם נֹפֵ֥ל אַ֖רְצָ/ה מֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/025.yaml
  text: And they waited until they were embarrassed[a], and behold, he still was not opening the doors of the upper room. So they took the key and opened them, and behold, their master had fallen to the floor[c][b], dead.
translation:
  language: fr
  text: Ils attendirent jusqu’à en être gênés[a], et voici qu’il n’ouvrait pas les portes de la chambre haute[b]. Alors ils prirent la clé et ouvrirent les portes. Et voici que leur maître[c] gisait à terre, mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à en avoir honte ». L’expression hébraïque peut désigner la honte ou la gêne ; ici, elle évoque probablement l’embarras croissant des serviteurs tandis qu’ils continuaient d’attendre.
    reason: lexical_alternative
  - marker: b
    text: Ou « pièce à l’étage ».
    reason: lexical_alternative
  - marker: c
    text: Ou « leur seigneur ». Le mot désigne ici leur supérieur humain, Églôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחִילוּ
  choice: ils attendirent
  rationale: Dans ce contexte, le verbe décrit l’attente prolongée des serviteurs devant les portes ; « attendirent » est naturel et précis.
- source_word: עַד בּוֹשׁ
  choice: jusqu’à en être gênés
  rationale: L’expression évoque ici la honte ou, plus probablement dans la scène, la gêne sociale croissante causée par une attente anormalement longue.
- source_word: וְהִנֵּה
  choice: mais voici / et voici
  rationale: La particule introduit deux constats soudains. « Voici » en conserve la vivacité narrative ; « mais » explicite sobrement le contraste lors de la première occurrence.
- source_word: אֵינֶנּוּ פֹתֵחַ
  choice: il n’ouvrait pas
  rationale: La construction présente l’absence d’ouverture en cours au moment où les serviteurs attendent. L’imparfait français rend cet aspect sans ajouter explicitement « encore ».
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: les portes de la chambre haute
  rationale: « Chambre haute » rend עֲלִיָּה et conserve le pluriel hébreu de « portes ».
- source_word: הַמַּפְתֵּחַ
  choice: la clé
  rationale: Équivalent français direct et naturel.
- source_word: וַיִּפְתָּחוּ
  choice: ouvrirent
  rationale: L’objet, les portes, est évident dans le contexte ; le français permet de le laisser implicite comme l’hébreu.
- source_word: אֲדֹנֵיהֶם
  choice: leur maître
  rationale: Le terme désigne Églôn en tant que supérieur humain de ses serviteurs, sans titre divin.
- source_word: נֹפֵל אַרְצָה
  choice: gisait à terre
  rationale: Le participe décrit l’état dans lequel le corps est découvert. « Gisait à terre » est idiomatique et respecte mieux la valeur stative que « était tombé ».
- source_word: מֵת
  choice: mort
  rationale: Adjectif prédicatif décrivant sans ambiguïté l’état d’Églôn.
