  text: וַ/יָּבֹ֨א גַֽם הַ/נִּצָּ֜ב אַחַ֣ר הַ/לַּ֗הַב וַ/יִּסְגֹּ֤ר הַ/חֵ֨לֶב֙ בְּעַ֣ד הַ/לַּ֔הַב כִּ֣י לֹ֥א שָׁלַ֛ף הַ/חֶ֖רֶב מִ/בִּטְנ֑/וֹ וַ/יֵּצֵ֖א הַֽ/פַּרְשְׁדֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/022.yaml
  text: The hilt also went in after the blade[a], and the fat closed over the blade, because he did not pull the sword out of his belly[b]; and the dung came out.
translation:
  language: fr
  text: La poignée[a] entra elle aussi à la suite de la lame, et la graisse se referma autour de la lame, car Éhoud ne retira pas l’épée de son ventre ; et les excréments sortirent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi désigner la garde ou le manche de l’arme.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « excréments » est très rare et pourrait désigner plus largement les matières fécales ou le contenu des intestins.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּב
  choice: la poignée
  rationale: Dans le contexte d’une épée, le nom désigne vraisemblablement la partie tenue en main qui suit la lame dans le corps. « Poignée » est clair et naturel en français, tandis que « garde » serait plus précis mais peut désigner seulement la pièce protectrice.
- source_word: הַלַּהַב
  choice: la lame
  rationale: Bien que le nom puisse signifier « flamme » ailleurs, le contexte de l’arme impose ici le sens de « lame ».
- source_word: וַיִּסְגֹּר … בְּעַד
  choice: se referma autour de
  rationale: Cette formulation rend l’idée concrète que la graisse enveloppa la lame, dans un français naturel sans atténuer la scène.
- source_word: הַחֵלֶב
  choice: la graisse
  rationale: Le terme désigne explicitement la graisse corporelle ; le choix conserve le caractère cru et concret du récit.
- source_word: שָׁלַף
  choice: retira
  rationale: Puisque l’épée se trouve déjà dans le corps, « retirer » exprime naturellement l’action de la faire ressortir.
- source_word: מִבִּטְנוֹ
  choice: de son ventre
  rationale: « Ventre » garde le registre concret du texte hébreu et évite le ton clinique d’« abdomen ».
- source_word: הַפַּרְשְׁדֹנָה
  choice: les excréments
  rationale: Le mot hébreu, très rare, est traditionnellement compris comme désignant des excréments ou une évacuation intestinale. « Excréments » est explicite et digne, et son incertitude est signalée en note.
- source_word: וַיֵּצֵא
  choice: sortirent
  rationale: Le verbe exprime simplement une sortie ; cette traduction reste proche du texte sans préciser indûment la manière de l’écoulement.
- source_word: גַם
  choice: elle aussi
  rationale: L’expression souligne que non seulement la lame, mais également la poignée pénétra dans le corps.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve sans euphémisme excessif les détails corporels et violents de l’hébreu. Le nom « Éhoud », implicite dans la forme verbale hébraïque mais explicité par le contexte immédiat, est ajouté pour éviter en français une ambiguïté sur l’auteur de l’action.
