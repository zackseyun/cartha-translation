  text: וַ/יַּקְרֵב֙ אֶת הַ/מִּנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֣לֶךְ מוֹאָ֑ב וְ/עֶגְל֕וֹן אִ֥ישׁ בָּרִ֖יא מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/017.yaml
  text: He presented the tribute to Eglon king of Moab[a]. Now Eglon was a very fat man.
translation:
  language: fr
  text: Il présenta le tribut à Églon, roi de Moab[a]. Or Églon était un homme très gros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cadeau » ou « présent ». Le mot hébreu minḥah peut désigner une offrande ou un don, mais il s’agit probablement ici du tribut versé à un souverain par un peuple soumis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Il présenta
  rationale: Le hiphil de קרב exprime ici l’action d’apporter quelque chose devant un supérieur. « Présenta » convient au contexte de cour tout en restant proche du sens hébreu.
- source_word: הַמִּנְחָה
  choice: le tribut
  rationale: Dans le contexte de la domination de Moab sur Israël, מִנְחָה désigne vraisemblablement un paiement imposé à un peuple soumis. « Tribut » rend mieux cette dimension politique que « cadeau » ou « présent ».
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: à Églon, roi de Moab
  rationale: La mise en apposition avec virgule est naturelle en français. Le nom propre est translittéré et le titre traduit.
- source_word: וְעֶגְלוֹן
  choice: Or Églon
  rationale: Le waw introduit ici une remarque descriptive en arrière-plan. « Or » marque naturellement cette transition narrative en français.
- source_word: אִישׁ
  choice: un homme
  rationale: Le terme masculin singulier désigne précisément Églon; « homme » en conserve le sens explicite.
- source_word: בָּרִיא
  choice: gros
  rationale: L’adjectif décrit ici la corpulence physique d’Églon, pertinente pour la suite du récit. « Gros » est direct, courant et moins clinique que « corpulent ».
- source_word: מְאֹד
  choice: très
  rationale: « Très » est l’intensif français naturel correspondant à מְאֹד.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Tribut » conserve le cadre politique de la scène; « très gros » rend sans euphémisme la description corporelle qui prépare la suite du récit.
