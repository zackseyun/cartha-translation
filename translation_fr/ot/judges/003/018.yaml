base_translation:
  language: en
  yaml_path: translation/ot/judges/003/018.yaml
  text: And when he had finished presenting the tribute[a], he sent away the people who were carrying the tribute.
translation:
  language: fr
  text: Quand il eut fini de présenter le tribut[a], il renvoya les gens qui portaient le tribut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le présent » ou « l’offrande ». Ici, le terme hébreu désigne probablement un tribut remis à un souverain plutôt qu’une offrande sacrificielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quand
  rationale: La formule narrative introduit la circonstance temporelle. En français moderne, « Quand » rend naturellement la transition sans reproduire lourdement « et il arriva que ».
- source_word: כִּלָּה
  choice: il eut fini
  rationale: Le verbe exprime l’achèvement. Le passé antérieur marque clairement que la présentation du tribut précède le renvoi des porteurs et convient au registre narratif.
- source_word: לְהַקְרִיב
  choice: de présenter
  rationale: Le hiphil de קרב signifie ici faire approcher, apporter ou présenter. « Présenter » convient au contexte politique et évite la coloration exclusivement cultuelle de « offrir ».
- source_word: הַמִּנְחָה
  choice: le tribut
  rationale: Dans le contexte, il s’agit vraisemblablement d’un présent imposé au peuple soumis et remis au roi Églon. « Tribut » exprime le mieux cette dimension politique, tandis que la note conserve les autres sens possibles.
- source_word: וַיְשַׁלַּח
  choice: il renvoya
  rationale: Le verbe signifie envoyer ou laisser partir. « Renvoya » est idiomatique et indique qu’Éhoud fit repartir ses accompagnateurs.
- source_word: הָעָם
  choice: les gens
  rationale: Le nom désigne ici le groupe qui accompagnait Éhoud. « Les gens » reste fidèle sans préciser leur sexe ni suggérer tout le peuple.
- source_word: נֹשְׂאֵי הַמִּנְחָה
  choice: qui l’avaient porté
  rationale: La proposition relative rend naturellement le participe hébreu. Le pronom reprend « le tribut » sans répétition pesante, et le plus-que-parfait situe le port du tribut avant leur renvoi.
theological_decisions:
- issue: Sens de מִנְחָה dans ce contexte
  choice: tribut
  alternative: présent ; offrande
  rationale: Le cadre est celui d’une remise à un souverain oppresseur, ce qui favorise le sens politique de « tribut ». La polysémie du terme hébreu est néanmoins signalée en note afin de ne pas effacer son emploi possible pour un don ou une offrande.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative est concise; « tribut » préserve le contexte politique, tandis que la note rend compte de l’ambiguïté lexicale.
