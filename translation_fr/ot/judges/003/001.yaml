id: JDG.3.1
reference: Judges 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִנִּ֣יחַ יְהוָ֔ה לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל אֵ֚ת כָּל אֲשֶׁ֣ר לֹֽא יָדְע֔וּ אֵ֖ת כָּל מִלְחֲמ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/001.yaml
  text: 'These are the nations that Yahweh left to test Israel by them[a], that is, all who had not known any of the wars of Canaan:'
translation:
  language: fr
  text: 'Voici les nations que Yahweh laissa subsister afin de mettre Israël à l’épreuve par elles, c’est-à-dire tous ceux qui n’avaient connu[a] aucune des guerres de Canaan :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’avaient fait l’expérience d’aucune des guerres de Canaan ».
    reason: 'Alternative lexicale : יָדְעוּ peut désigner ici une connaissance acquise par l’expérience directe.'
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Introduit naturellement en français une nouvelle liste tout en assurant la continuité du récit, sans ajouter un adverbe temporel absent de l’hébreu.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Désigne ici les groupes ethniques et politiques demeurés dans le pays ; « nations » est précis et courant dans ce contexte.
- source_word: הִנִּיחַ
  choice: laissa subsister
  rationale: Le hifil exprime ici le fait de laisser ces nations en place. « Laissa subsister » rend ce sens contextuel plus clairement que le simple « laissa » en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin יהוה au lieu de lui substituer un titre.
- source_word: לְנַסּוֹת
  choice: afin de mettre … à l’épreuve
  rationale: Rend la finalité exprimée par לְ et le sens de נסה, sans introduire l’idée de tenter au mal.
- source_word: בָּם
  choice: par elles
  rationale: Le pronom renvoie aux nations et indique le moyen par lequel Israël est mis à l’épreuve.
- source_word: אֵת כָּל אֲשֶׁר לֹא יָדְעוּ
  choice: c’est-à-dire tous ceux qui n’avaient connu
  rationale: Explicite en français la valeur appositionnelle de la proposition tout en conservant le verbe « connaître » et la portée rétrospective de l’accompli.
- source_word: אֵת כָּל מִלְחֲמוֹת כְּנָעַן
  choice: aucune des guerres de Canaan
  rationale: Sous la négation, « aucune des » exprime idiomatiquement le fait de n’avoir connu aucune de l’ensemble des guerres associées à Canaan.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin ; sa transcription préserve cette donnée au lieu de la remplacer par un titre.
- issue: Finalité de la présence des nations restantes
  choice: afin de mettre par elles Israël à l’épreuve
  alternative: pour éprouver Israël au moyen d’elles
  rationale: La formulation maintient sans l’atténuer l’affirmation selon laquelle Yahweh a laissé ces nations dans le but de mettre Israël à l’épreuve.
- issue: Nature de la connaissance des guerres
  choice: n’avaient connu aucune des guerres
  alternative: n’avaient fait l’expérience d’aucune des guerres
  rationale: Le texte principal conserve le lexème « connaître », tandis que la note signale son probable sens expérientiel sans éliminer l’expression hébraïque.
translation_notes:
  register: Français international moderne, naturel et digne. « Voici » convient à l’ouverture d’une liste ; « laissa subsister » évite l’ambiguïté française de « laissa » seul. Le deux-points final conserve le lien syntaxique avec la suite du passage.
