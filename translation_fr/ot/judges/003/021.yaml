  text: Then Ehud reached with his left hand[a], took the sword from his right thigh[b], and thrust it into his belly.
translation:
  language: fr
  text: Alors Éhoud étendit sa main gauche, prit l’épée qui était sur sa cuisse droite et la lui enfonça dans le ventre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: étendit
  rationale: Dans ce contexte d’action physique, שׁלח avec « main » décrit le geste d’étendre la main pour saisir quelque chose. « Étendit » reste proche de l’image hébraïque et demeure naturel en français.
- source_word: יַד שְׂמֹאלוֹ
  choice: la main gauche
  rationale: Le texte nomme explicitement la main et souligne que le geste est accompli de la gauche.
- source_word: וַיִּקַּח
  choice: prit
  rationale: Équivalent simple et naturel de לקח dans la succession narrative.
- source_word: הַחֶרֶב
  choice: l’épée
  rationale: חֶרֶב est le terme général pour une épée. Même si le contexte indique une arme courte, « épée » respecte le choix lexical du texte source sans le préciser indûment.
- source_word: מֵעַל יֶרֶךְ יְמִינוֹ
  choice: fixée à sa cuisse droite
  rationale: מֵעַל indique que l’arme se trouvait sur sa cuisse droite. « Fixée à » explicite sobrement la position portée par le contexte et produit une formulation française naturelle.
- source_word: וַיִּתְקָעֶהָ
  choice: la lui enfonça
  rationale: תקע exprime ici l’action de faire pénétrer l’arme avec force. Le pronom « la » reprend l’épée, et « lui » indique naturellement en français que le ventre est celui d’Églôn.
- source_word: בְּבִטְנוֹ
  choice: dans le ventre
  rationale: בֶּטֶן désigne le ventre ou l’abdomen. « Ventre » est direct, concret et non clinique.
