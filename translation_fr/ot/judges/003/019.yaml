    rationale: En français, « depuis » marque normalement un point de départ temporel ou spatial dans une perspective statique; il ne rend pas naturellement le mouvement de retour exprimé par מִן. « Revint des images sculptées » est à la fois fidèle et idiomatique.
  - severity: low
