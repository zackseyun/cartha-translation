  text: וְ/ה֣וּא שָׁ֗ב מִן הַ/פְּסִילִים֙ אֲשֶׁ֣ר אֶת הַ/גִּלְגָּ֔ל וַ/יֹּ֕אמֶר דְּבַר סֵ֥תֶר לִ֛/י אֵלֶ֖י/ךָ הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר הָ֔ס וַ/יֵּֽצְאוּ֙ מֵֽ/עָלָ֔י/ו כָּל הָ/עֹמְדִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/019.yaml
  text: But he himself turned back from the carved images that were near Gilgal and said[a], “I have a secret message for you, O king.” And he said[c][b], “Silence.” Then all who were standing by him went out from his presence.
translation:
  language: fr
  text: 'Mais lui, il revint des images sculptées[a] qui se trouvaient près de Guilgal[b] et dit : « J’ai un message secret[c] pour toi, ô roi. » Le roi dit : « Silence ! » Alors tous ceux qui se tenaient auprès de lui se retirèrent d’auprès de lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les idoles ». Le terme hébreu désigne souvent des images cultuelles.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui se trouvaient à Guilgal ». L’expression hébraïque de lieu est elliptique et peut indiquer la proximité ou la position à Guilgal.
    reason: lexical_alternative
  - marker: c
    text: Ou « une parole secrète » ou « une affaire confidentielle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: revint
  rationale: Le verbe exprime un retour ou un changement de direction. « Revint » rend naturellement le mouvement d’Éhoud qui rebrousse chemin après s’être éloigné.
- source_word: הַפְּסִילִים
  choice: les images sculptées
  rationale: Le terme désigne concrètement des représentations taillées, souvent cultuelles. Cette formulation conserve le sens lexical sans imposer d’emblée « idoles ».
- source_word: אֲשֶׁר אֶת־הַגִּלְגָּל
  choice: qui se trouvaient près de Guilgal
  rationale: La construction locative est elliptique. « Près de Guilgal » exprime clairement la proximité tout en maintenant l’incertitude sur leur position exacte.
- source_word: דְּבַר סֵתֶר
  choice: un message secret
  rationale: דבר peut désigner une parole, une affaire ou un message, et סתר ce qui est caché. Dans cette scène d’audience, « message secret » est naturel et garde l’ambiguïté sur son contenu.
- source_word: לִי אֵלֶיךָ
  choice: J’ai … pour toi
  rationale: L’expression hébraïque associe possession et destination. La tournure française restitue idiomatiquement l’idée d’un message qu’Éhoud doit communiquer au roi.
- source_word: הַמֶּלֶךְ
  choice: ô roi
  rationale: L’article accompagne ici un vocatif. « Ô roi » conserve la solennité de l’adresse directe, quoique légèrement soutenue en français actuel.
- source_word: הָס
  choice: Silence !
  rationale: L’interjection constitue un ordre bref de se taire. « Silence ! » en préserve la force et peut naturellement viser les personnes présentes.
- source_word: כָּל הָעֹמְדִים עָלָיו
  choice: tous ceux qui se tenaient auprès de lui
  rationale: Le participe décrit les personnes présentes au service ou aux côtés du roi. La traduction reste proche de l’image hébraïque tout en étant naturelle.
- source_word: מֵעָלָיו
  choice: de sa présence
  rationale: Littéralement, l’expression signifie partir d’auprès de lui. Dans le cadre de la cour, « sortirent de sa présence » rend clairement leur retrait.
