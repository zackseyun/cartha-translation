  source_fidelity: La construction מן est mieux rendue par « revint des images sculptées » que par « revint depuis les images sculptées ». Le retrait des personnes présentes est plus directement rendu par « se retirèrent d’auprès de lui », correspondant à מֵעָלָיו, sans suggérer nécessairement une sortie formelle de la pièce.
  naturalness: « Revint depuis » n’est pas idiomatique dans ce contexte en français moderne. La révision conserve une narration concise et un registre digne, tout en employant une formulation naturelle.
  terminology: « Images sculptées » rend היטב הַפְּסִילִים sans imposer « idoles » dans le texte. « Message secret » conserve l’ambiguïté de דְּבַר סֵתֶר. Les variantes lexicales et locatives sont placées à des ancres correspondant à leurs éléments respectifs.
