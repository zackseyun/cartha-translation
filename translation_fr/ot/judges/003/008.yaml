id: JDG.3.8
reference: Judges 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּמְכְּרֵ֗/ם בְּ/יַד֙ כּוּשַׁ֣ן רִשְׁעָתַ֔יִם מֶ֖לֶךְ אֲרַ֣ם נַהֲרָ֑יִם וַ/יַּעַבְד֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/008.yaml
  text: So the anger of Yahweh burned against Israel[a], and he sold them into the hand of Cushan-rishathaim king of Aram-naharaim[b]. And the sons of Israel served Cushan-rishathaim eight years.
translation:
  language: fr
  text: Alors la colère de Yahweh s’enflamma contre Israël, et il les vendit entre les mains de Koushan-Rishataïm, roi d’Aram-Naharaïm[a]. Les fils d’Israël[b] servirent Koushan-Rishataïm pendant huit ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mésopotamie »; l’hébreu porte « Aram-Naharaïm », traditionnellement compris comme « Aram des deux fleuves ».
    reason: alternative_reading
  - marker: b
    text: Littéralement « les fils d’Israël »; cette expression hébraïque désigne collectivement les Israélites.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: la colère … s’enflamma
  rationale: Cette formulation conserve l’image hébraïque de la colère qui brûle, tout en étant idiomatique et digne en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַיִּמְכְּרֵם
  choice: il les vendit
  rationale: Le verbe מָכַר signifie normalement « vendre ». Cette traduction préserve la métaphore forte du jugement, sans l’atténuer en « livra ».
- source_word: בְּיַד
  choice: aux mains de
  rationale: L’expression française communique naturellement l’idée d’être placé sous le pouvoir de quelqu’un tout en conservant l’image de la main.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: Koushan-Rishataïm
  rationale: Le nom est translittéré et adapté aux conventions orthographiques françaises; le trait d’union en manifeste l’unité.
- source_word: אֲרַם נַהֲרָיִם
  choice: Aram-Naharaïm
  rationale: La forme hébraïque du toponyme est conservée par translittération; une note donne les équivalents interprétatifs usuels.
- source_word: וַיַּעַבְדוּ
  choice: servirent
  rationale: Le verbe עָבַד signifie « servir » et désigne ici une sujétion politique. Le choix direct conserve la portée du terme sans l’amplifier en « furent esclaves ».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette expression reproduit la désignation collective hébraïque traditionnelle et maintient son image de filiation.
- source_word: שְׁמֹנֶה שָׁנִים
  choice: pendant huit ans
  rationale: L’ajout idiomatique de « pendant » exprime naturellement en français la durée indiquée par l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le représente directement au lieu de le remplacer par un titre.
- issue: Métaphore du jugement dans וַיִּמְכְּרֵם
  choice: il les vendit
  alternative: il les livra
  rationale: La formulation conserve la métaphore de la vente employée par le narrateur pour décrire le jugement divin, sans en préciser davantage le mécanisme.
- issue: Portée collective de בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix maintient la formulation masculine de filiation qui désigne collectivement le peuple de l’alliance; la note explicite sa valeur collective afin d’éviter une lecture limitée aux seuls hommes.
translation_notes:
  register: Français international moderne, clair et digne. Le récit reste concis; les images hébraïques de la colère qui brûle, de la vente et de la filiation sont conservées, tandis que les notes éclairent les deux expressions susceptibles d’être mal comprises.
