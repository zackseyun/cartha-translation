  yaml_path: translation/ot/judges/003/014.yaml
  text: And the sons of Israel served Eglon king of Moab for eighteen years[a].
translation:
  language: fr
  text: Les fils d’Israël servirent Églôn, roi de Moab, pendant dix-huit ans[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « Les Israélites furent soumis à Églôn, roi de Moab, pendant dix-huit ans. »'
    reason: Alternative lexicale explicitant le sens politique de עבד dans ce contexte.
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: servirent
  rationale: Le verbe עבד désigne ici le service imposé ou l’assujettissement politique à un souverain étranger, non le culte. « Servirent » conserve la formulation hébraïque et sa portée, tandis qu’une formulation plus explicite est donnée en note.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette expression rend directement l’idiome hébreu et préserve la forme collective masculine du texte source. « Les Israélites » serait plus idiomatique, mais moins formellement proche.
- source_word: אֶת עֶגְלוֹן
  choice: Églôn
  rationale: אֶת marque le complément d’objet direct et ne se traduit pas séparément. Le nom propre est translittéré sous sa forme française traditionnelle avec accent circonflexe indiquant la voyelle longue.
- source_word: מֶלֶךְ מוֹאָב
  choice: roi de Moab
  rationale: La chaîne construite hébraïque est rendue naturellement en apposition par « Églôn, roi de Moab ».
- source_word: שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: pendant dix-huit ans
  rationale: L’accusatif hébreu de durée est exprimé naturellement en français par « pendant dix-huit ans ».
