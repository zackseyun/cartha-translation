  text: וַ/יַּעֲשׂ֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וַ/יַּעַבְד֥וּ אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/אֲשֵׁרֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/007.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and they forgot Yahweh their God and served the Baals and the Asherahs.
translation:
  language: fr
  text: Les Israélites[a] firent ce qui est mal aux yeux de Yahweh[b] ; ils oublièrent Yahweh, leur Dieu, et servirent les Baals et les Ashéras[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « mal aux yeux de Yahweh » désigne ce que Yahweh juge mauvais.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les poteaux sacrés d’Ashéra ». Le terme hébreu peut désigner des objets cultuels associés à Ashéra ou, plus largement, son culte sous diverses formes.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression hébraïque signifie littéralement « les fils d’Israël », mais désigne collectivement le peuple d’Israël. « Les Israélites » en donne le sens naturel en français moderne sans suggérer que seuls les hommes sont visés.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: ce qui est mal aux yeux de Yahweh
  rationale: 'Cette formulation conserve l’image et la portée évaluative de l’expression hébraïque : il s’agit de ce que Yahweh juge mauvais.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַיִּשְׁכְּחוּ
  choice: ils oublièrent
  rationale: Le verbe שׁכח signifie fondamentalement « oublier ». Dans ce contexte d’infidélité, il implique un abandon pratique, mais la traduction directe préserve la force propre du texte.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Yahweh est le référent ; le nom se comprend donc ici au singulier.
- source_word: וַיַּעַבְדוּ
  choice: servirent
  rationale: Dans un contexte cultuel, עבד peut désigner à la fois le service religieux et l’adoration. « Servirent » maintient cette étendue de sens.
- source_word: הַבְּעָלִים
  choice: les Baals
  rationale: Le pluriel hébreu peut évoquer diverses manifestations locales ou représentations de Baal. La forme française conserve ce pluriel.
- source_word: הָאֲשֵׁרוֹת
  choice: les Ashéras
  rationale: Le pluriel hébreu peut renvoyer à des manifestations d’Ashéra ou à des objets cultuels qui lui sont associés. La translittération au pluriel préserve cette ambiguïté.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel de l’alliance au lieu de le remplacer par un titre.
- issue: Identification précise de הָאֲשֵׁרוֹת
  choice: les Ashéras
  alternative: les poteaux sacrés d’Ashéra
  rationale: Le terme peut désigner Ashéra sous des formes localisées ou les objets cultuels associés à son culte. Le texte principal évite de trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Le point-virgule maintient l’enchaînement serré des propositions hébraïques. Les noms « Baals » et « Ashéras » conservent les pluriels du texte source.
