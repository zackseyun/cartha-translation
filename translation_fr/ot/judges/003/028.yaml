  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רִדְפ֣וּ אַחֲרַ֔/י כִּֽי נָתַ֨ן יְהוָ֧ה אֶת אֹיְבֵי/כֶ֛ם אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶ֑ם וַ/יֵּרְד֣וּ אַחֲרָ֗י/ו וַֽ/יִּלְכְּד֞וּ אֶת מַעְבְּר֤וֹת הַ/יַּרְדֵּן֙ לְ/מוֹאָ֔ב וְ/לֹֽא נָתְנ֥וּ אִ֖ישׁ לַ/עֲבֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/028.yaml
  text: And he said to them[a], “Follow after me, for Yahweh has given your enemies, Moab, into your hand.” So they went down after him and captured the fords of the Jordan against Moab[c][b], and they did not allow anyone to cross over.
translation:
  language: fr
  text: 'Il leur dit : « Suivez-moi[a], car Yahweh a livré entre vos mains vos ennemis, à savoir Moab[b]. » Ils descendirent donc à sa suite, s’emparèrent des gués du Jourdain en direction de Moab[c] et ne laissèrent passer personne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Poursuivez à ma suite. » Littéralement : « Poursuivez derrière moi. »'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu place « Moab » en apposition à « vos ennemis ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les points de passage du Jourdain vers Moab » ; la relation exacte exprimée par la préposition peut aussi se comprendre dans le contexte comme « contre Moab ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִדְפוּ אַחֲרַי
  choice: Suivez-moi
  rationale: Le verbe רדף évoque normalement la poursuite. Ici, Éhoud appelle ses hommes à avancer à sa suite contre l’ennemi ; « Suivez-moi » est naturel en français tout en laissant la nuance militaire explicite dans la note.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: a livré entre vos mains
  rationale: Cette formulation conserve l’image hébraïque de la remise au pouvoir de quelqu’un et exprime l’action comme déjà accomplie, fondement de l’assurance d’Éhoud.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֹיְבֵיכֶם אֶת מוֹאָב
  choice: vos ennemis, à savoir Moab
  rationale: « À savoir » rend clairement l’apposition qui identifie Moab aux ennemis, sans remplacer le nom de la nation par l’ethnonyme interprétatif « les Moabites ».
- source_word: וַיֵּרְדוּ אַחֲרָיו
  choice: Ils descendirent donc à sa suite
  rationale: « Descendirent » conserve le mouvement géographique vers la vallée du Jourdain ; « à sa suite » reprend le rôle directeur d’Éhoud.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: les gués du Jourdain
  rationale: Dans ce contexte militaire, מַעְבְּרוֹת désigne les endroits où l’on peut traverser le fleuve ; « gués » est précis et idiomatique.
- source_word: לְמוֹאָב
  choice: en direction de Moab
  rationale: La préposition לְ peut exprimer ici la direction ou l’association. Cette traduction préserve le sens directionnel probable sans préciser indûment de quel côté du fleuve se trouvaient les passages.
- source_word: וְלֹא נָתְנוּ אִישׁ לַעֲבֹר
  choice: ne laissèrent passer personne
  rationale: Cette tournure française naturelle rend l’idiome hébreu littéralement formulé comme « ils ne donnèrent à aucun homme de passer » et conserve l’interdiction absolue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Moab comme entité nationale collective
  choice: Moab
  alternative: les Moabites
  rationale: L’hébreu nomme la nation elle-même en apposition à « vos ennemis ». Garder « Moab » préserve cette personnification collective et évite d’ajouter un ethnonyme absent.
- issue: Valeur de לְמוֹאָב
  choice: en direction de Moab
  alternative: contre Moab
  rationale: La préposition autorise plusieurs nuances contextuelles. Le rendu directionnel reste proche de sa valeur ordinaire, tandis que « contre Moab » expliciterait une relation hostile déjà évidente mais non marquée avec certitude par la seule préposition.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre du récit biblique écrit. La syntaxe reste accessible ; les expressions « entre vos mains », « à sa suite » et « les gués du Jourdain » conservent la couleur du texte sans archaïsme excessif.
