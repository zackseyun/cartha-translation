  text: וַ/יִּזְעֲק֣וּ בְנֵֽי יִשְׂרָאֵל֮ אֶל יְהוָה֒ וַ/יָּקֶם֩ יְהוָ֨ה לָ/הֶ֜ם מוֹשִׁ֗יעַ אֶת אֵה֤וּד בֶּן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אִ֥ישׁ אִטֵּ֖ר יַד יְמִינ֑/וֹ וַ/יִּשְׁלְח֨וּ בְנֵי יִשְׂרָאֵ֤ל בְּ/יָד/וֹ֙ מִנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֥לֶךְ מוֹאָֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/015.yaml
  text: Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up for them a deliverer, Ehud son of Gera, a Benjaminite, a man hindered in his right hand. And the sons of Israel sent tribute by his hand to Eglon king of Moab.
translation:
  language: fr
  text: 'Alors les fils d’Israël crièrent à Yahweh, et Yahweh suscita pour eux un libérateur : Éhoud, fils de Guéra, un Benjaminite limité dans l’usage de sa main droite[a]. Les fils d’Israël envoyèrent par son intermédiaire un tribut à Églon, roi de Moab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon l’interprétation traditionnelle : « qui était gaucher ». L’hébreu emploie une expression inhabituelle indiquant qu’Éhoud était limité dans l’usage de sa main droite.'
    reason: L’expression hébraïque אִישׁ אִטֵּר יַד־יְמִינוֹ ne précise pas la nature de la limitation ; la note conserve l’interprétation traditionnelle sans l’imposer au texte.
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: crièrent vers
  rationale: Le verbe exprime un cri de détresse et un appel pressant. « Crièrent vers » conserve à la fois l’urgence et le destinataire explicitement introduit par אֶל.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation préserve l’expression hébraïque et demeure intelligible dans un registre biblique moderne et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: וַיָּקֶם ... מוֹשִׁיעַ
  choice: suscita pour eux un libérateur
  rationale: « Suscita » rend naturellement l’action par laquelle Dieu fait surgir ou établit un agent de délivrance; « libérateur » convient au rôle historique du juge sans surcharger le terme d’autres connotations.
- source_word: אֵהוּד בֶּן גֵּרָא
  choice: Éhoud, fils de Guéra
  rationale: Les noms sont transcrits selon les conventions françaises usuelles, et la filiation est conservée.
- source_word: בֶּן הַיְמִינִי
  choice: un Benjaminite
  rationale: L’expression fonctionne ici comme un gentilé indiquant l’appartenance tribale.
- source_word: אִישׁ אִטֵּר יַד יְמִינוֹ
  choice: qui avait la main droite entravée
  rationale: Cette traduction garde l’image inhabituelle et l’ambiguïté de l’hébreu, qui décrit une restriction de la main droite plutôt que d’affirmer directement qu’Éhoud était gaucher.
- source_word: וַיִּשְׁלְחוּ ... בְּיָדוֹ
  choice: envoyèrent par son intermédiaire
  rationale: 'L’expression בְּיָדוֹ marque ici l’agence : Éhoud est chargé d’acheminer le tribut. La formulation française exprime ce sens naturellement.'
- source_word: מִנְחָה
  choice: un tribut
  rationale: Dans le contexte de la domination moabite, il s’agit d’un paiement politique versé au souverain, et non d’une offrande cultuelle.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: à Églon, roi de Moab
  rationale: La structure appositive est rendue de façon naturelle en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le tétragramme comme nom propre; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée de מוֹשִׁיעַ appliqué à Éhoud
  choice: libérateur
  alternative: sauveur
  rationale: Dans ce récit, le mot désigne l’agent humain par lequel Israël est délivré de l’oppression. « Libérateur » maintient ce sens historique sans exclure l’initiative divine explicitement affirmée.
translation_notes:
  register: Français international moderne, naturel et digne. Le registre conserve quelques tournures bibliques transparentes (« fils d’Israël », « suscita »), tandis que « par son intermédiaire » évite un calque peu naturel de « par sa main ». Le marqueur de note est placé sur l’expression qu’il explique.
