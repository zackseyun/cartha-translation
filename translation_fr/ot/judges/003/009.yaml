id: JDG.3.9
reference: Judges 3:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּזְעֲק֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל יְהוָ֔ה וַ/יָּ֨קֶם יְהוָ֥ה מוֹשִׁ֛יעַ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל וַ/יּֽוֹשִׁיעֵ֑/ם אֵ֚ת עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֥ן מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/009.yaml
  text: 'Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up a deliverer for the sons of Israel, who delivered them: Othniel son of Kenaz[c][b], Caleb’s younger brother.'
translation:
  language: fr
  text: 'Alors les Israélites[a] crièrent vers Yahweh, et Yahweh suscita pour les Israélites un libérateur[b], qui les délivra : Otniel, fils de Kenaz, le frère cadet de Caleb[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un sauveur » ou « un secoureur ». Il s’agit ici d’un homme suscité par Dieu pour délivrer Israël de l’oppression.'
    reason: lexical_alternative
  - marker: c
    text: 'La phrase hébraïque peut se rendre plus littéralement : « le frère de Caleb, plus jeune que lui ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: crièrent vers
  rationale: Le verbe זעק exprime ici un cri pressant adressé à Dieu, dans une situation de détresse. « Crièrent vers » conserve cette intensité et la direction du cri.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Littéralement « les fils d’Israël ». En français actuel, « les Israélites » désigne naturellement l’ensemble du peuple sans donner à penser que seuls les hommes sont concernés; la forme littérale est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est translittéré comme un nom propre plutôt que remplacé par un titre.
- source_word: וַיָּקֶם
  choice: suscita
  rationale: Le hiphil de קום signifie ici que Yahweh fait surgir ou établit une personne pour accomplir une mission. « Suscita » est idiomatique dans ce contexte narratif.
- source_word: מוֹשִׁיעַ
  choice: un libérateur
  rationale: Le participe de ישׁע désigne ici un agent humain qui délivre Israël de l’oppression. « Libérateur » convient au contexte politique et militaire du livre des Juges.
- source_word: וַיּוֹשִׁיעֵם
  choice: qui les délivra
  rationale: Le verbe ישׁע décrit la délivrance concrète des Israélites. La relative relie naturellement l’action au libérateur ensuite identifié comme Otniel.
- source_word: אֵת עָתְנִיאֵל בֶּן קְנַז
  choice: Otniel, fils de Kenaz
  rationale: La séquence nomme, en apposition différée, le libérateur que Yahweh a suscité. Les formes « Otniel » et « Kenaz » suivent l’usage français.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: le frère cadet de Caleb
  rationale: La lecture syntaxique la plus naturelle présente Otniel comme le frère de Caleb et comme plus jeune que lui. « Cadet » exprime la comparaison sans affirmer qu’il était le plus jeune de toute la fratrie.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie le tétragramme comme nom divin. « Yahweh » le conserve comme nom propre au lieu de lui substituer un titre.
- issue: Sens de מוֹשִׁיעַ dans le contexte des Juges
  choice: un libérateur
  alternative: un sauveur; un secoureur
  rationale: Il s’agit d’un agent humain suscité par Dieu pour délivrer Israël. « Libérateur » exprime ce rôle sans effacer le lien lexical avec la délivrance ni imposer une lecture christologique anachronique.
- issue: Sujet implicite de וַיּוֹשִׁיעֵם
  choice: le libérateur, Otniel
  alternative: Yahweh
  rationale: La continuité avec מוֹשִׁיעַ et l’identification différée d’Otniel favorisent la lecture selon laquelle Otniel délivre Israël. Yahweh demeure explicitement celui qui suscite le libérateur; l’alternative grammaticale est signalée en note.
- issue: Relation exprimée par אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: Otniel est le frère cadet de Caleb
  alternative: Otniel est un proche parent plus jeune de Caleb
  rationale: Le sens ordinaire de אָח est « frère », et הַקָּטֹן מִמֶּנּוּ indique qu’il est plus jeune que Caleb. La formulation évite de transformer le comparatif en superlatif.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit. « Israélites » est plus naturel et inclusif que le calque « fils d’Israël », tandis que la note préserve la forme hébraïque. La répétition de « pour les Israélites » maintient la structure et l’insistance du texte source.
