  text: חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים וְ/כָל הַֽ/כְּנַעֲנִי֙ וְ/הַ/צִּ֣ידֹנִ֔י וְ/הַ֣/חִוִּ֔י יֹשֵׁ֖ב הַ֣ר הַ/לְּבָנ֑וֹן מֵ/הַר֙ בַּ֣עַל חֶרְמ֔וֹן עַ֖ד לְב֥וֹא חֲמָֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/003.yaml
  text: the five rulers of the Philistines[a], and all the Canaanites, and the Sidonians, and the Hivites who lived in the hill country of Lebanon, from Mount Baal-hermon as far as Lebo-hamath.
translation:
  language: fr
  text: les cinq chefs des Philistins, tous les Cananéens, les Sidoniens et les Hivites qui habitaient la région montagneuse du Liban, depuis le mont Baal-Hermon jusqu’à Lebo-Hamath[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à l’entrée de Hamath ». L’expression hébraïque peut être comprise soit comme un nom de lieu, Lebo-Hamath, soit dans un sens descriptif.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים
  choice: les cinq chefs des Philistins
  rationale: Le construit חֲמֵשֶׁת introduit le groupe nominal suivant. « Chefs » désigne clairement les dirigeants politiques propres aux Philistins, sans la connotation féodale possible de « seigneurs ».
- source_word: וְכָל הַכְּנַעֲנִי
  choice: tous les Cananéens
  rationale: Le singulier ethnique hébreu a ici une valeur collective ; le pluriel français exprime naturellement le peuple concerné.
- source_word: וְהַצִּידֹנִי
  choice: les Sidoniens
  rationale: Le singulier ethnique collectif est rendu par le gentilé français usuel au pluriel.
- source_word: וְהַחִוִּי
  choice: les Hivites
  rationale: Le singulier ethnique collectif est rendu au pluriel, conformément à l’usage français pour ce peuple.
- source_word: יֹשֵׁב
  choice: qui habitaient
  rationale: Le participe décrit les Hivites dans le cadre du récit passé ; une proposition relative à l’imparfait est naturelle en français.
- source_word: הַר הַלְּבָנוֹן
  choice: la région montagneuse du Liban
  rationale: L’expression désigne ici le territoire montagneux du Liban plutôt qu’un sommet isolé ; cette formulation restitue clairement la portée géographique.
- source_word: מֵהַר בַּעַל חֶרְמוֹן
  choice: depuis le mont Baal-Hermon
  rationale: Le nom géographique est translittéré, avec un trait d’union pour en marquer l’unité.
- source_word: עַד לְבוֹא חֲמָת
  choice: jusqu’à Lebo-Hamath
  rationale: L’expression peut fonctionner comme un toponyme biblique. La translittération préserve ce nom de lieu sans exclure l’analyse descriptive signalée en note.
