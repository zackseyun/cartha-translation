  text: וַ/תְּהִ֨י עָלָ֥י/ו רֽוּחַ יְהוָה֮ וַ/יִּשְׁפֹּ֣ט אֶת יִשְׂרָאֵל֒ וַ/יֵּצֵא֙ לַ/מִּלְחָמָ֔ה וַ/יִּתֵּ֤ן יְהוָה֙ בְּ/יָד֔/וֹ אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם מֶ֣לֶךְ אֲרָ֑ם וַ/תָּ֣עָז יָד֔/וֹ עַ֖ל כּוּשַׁ֥ן רִשְׁעָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/010.yaml
  text: The Spirit of Yahweh came upon him[a], and he judged Israel. He went out to battle, and Yahweh gave Cushan-rishathaim king of Aram into his hand[b], and his hand prevailed over Cushan-rishathaim.
translation:
  language: fr
  text: L’Esprit de Yahweh vint sur lui[a], et il jugea Israël. Il partit au combat, et Yahweh livra entre ses mains Koushan-Rishataïm, roi d’Aram[b]. Il l’emporta sur Koushan-Rishataïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’Esprit de Yahweh était sur lui. » L’expression hébraïque peut décrire plus statiquement sa présence sur lui, bien que le contexte narratif favorise « vint sur lui ».'
    reason: lexical_alternative
  - marker: b
    text: Aram est le nom hébreu du territoire souvent appelé « Syrie » dans les traductions anciennes.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּהִי עָלָיו רוּחַ יְהוָה
  choice: L’Esprit de Yahweh vint sur lui
  rationale: L’expression היה על avec רוּחַ peut décrire la venue ou la présence de l’Esprit sur une personne en vue de l’habiliter. « vint sur lui » convient au déclenchement narratif, tandis qu’une note conserve la lecture plus statique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme conserve ici le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: et il jugea Israël
  rationale: Le verbe שׁפט désigne ici l’activité du juge, qui comprend aussi direction et délivrance. Le rendu littéral préserve le vocabulaire caractéristique du livre.
- source_word: וַיֵּצֵא לַמִּלְחָמָה
  choice: Il partit au combat
  rationale: Cette formulation française naturelle rend l’expression militaire sans alourdir le récit.
- source_word: וַיִּתֵּן יְהוָה בְּיָדוֹ
  choice: Yahweh livra entre ses mains
  rationale: L’expression נתן ביד signifie placer quelqu’un au pouvoir d’un autre. « livra entre ses mains » conserve l’image hébraïque tout en étant idiomatique en français.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: Koushan-Rishataïm
  rationale: Le nom propre est translittéré selon des conventions françaises lisibles; le trait d’union en fait ressortir la forme composée.
- source_word: מֶלֶךְ אֲרָם
  choice: roi d’Aram
  rationale: « Aram » reproduit le toponyme hébreu sans employer l’appellation traditionnelle et potentiellement anachronique « Syrie ».
- source_word: וַתָּעָז יָדוֹ עַל
  choice: Sa main l’emporta sur
  rationale: Le rendu maintient la métaphore hébraïque de la main tout en exprimant clairement la supériorité acquise sur l’adversaire.
theological_decisions:
- issue: Expression relative à l’Esprit divin
  choice: L’Esprit de Yahweh vint sur lui
  alternative: L’Esprit de Yahweh fut sur lui
  rationale: La formulation dynamique convient à l’entrée en fonction d’Otniel dans le récit, sans ajouter d’élaboration doctrinale; la possibilité d’un sens plus statique est conservée en note.
- issue: Désignation géographique אֲרָם
  choice: Aram
  alternative: Syrie
  rationale: Le toponyme source est conservé afin d’éviter une substitution issue de la tradition de traduction.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans être archaïque. Les images hébraïques de la main sont conservées lorsqu’elles restent intelligibles en français.
