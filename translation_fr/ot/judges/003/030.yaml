  variant: modern international French
source:
  edition: WLC
  text: וַ/תִּכָּנַ֤ע מוֹאָב֙ בַּ/יּ֣וֹם הַ/ה֔וּא תַּ֖חַת יַ֣ד יִשְׂרָאֵ֑ל וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ שְׁמוֹנִ֥ים שָׁנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/030.yaml
  text: So Moab was subdued under the hand of Israel that day[c][b][a], and the land had rest for eighty years.
translation:
  language: fr
  text: Ainsi, ce jour-là, Moab fut soumis au pouvoir d’Israël, et le pays connut le repos pendant quatre-vingts ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכָּנַע
  choice: fut soumis
  rationale: Le nifal de כנע exprime ici le fait d’être abaissé ou assujetti. « Fut soumis » rend naturellement en français la portée militaire et politique du verbe sans suggérer l’anéantissement.
- source_word: מוֹאָב
  choice: Moab
  rationale: Forme française traditionnelle et standard du nom du peuple et du territoire.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression temporelle française naturelle qui conserve la valeur démonstrative de l’hébreu.
- source_word: תַּחַת יַד יִשְׂרָאֵל
  choice: au pouvoir d’Israël
  rationale: Littéralement « sous la main d’Israël » ; dans ce contexte, l’expression idiomatique indique la domination ou l’autorité. « Au pouvoir d’Israël » en communique clairement le sens en français moderne.
- source_word: וַתִּשְׁקֹט
  choice: connut le repos
  rationale: Le verbe שקט désigne le calme et l’absence de troubles. Dans le cycle narratif des Juges, « le pays connut le repos » exprime naturellement la cessation des conflits.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire concerné. « Le pays » est idiomatique en français et évite l’ambiguïté possible de « la terre ».
- source_word: שְׁמוֹנִים שָׁנָה
  choice: pendant quatre-vingts ans
  rationale: La préposition « pendant » explicite naturellement en français la durée exprimée par l’hébreu.
theological_decisions:
- issue: Nature de la domination d’Israël sur Moab
  choice: Une soumission militaire et politique
  alternative: Une simple humiliation symbolique ou un anéantissement total
  rationale: Le texte rapporte l’assujettissement de Moab, suivi du repos du pays. La formulation ne doit ni réduire cet événement à une humiliation intérieure, ni l’amplifier jusqu’à l’extermination.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore hébraïque « sous la main » est rendue par son sens idiomatique afin d’assurer une compréhension immédiate, tandis que « connut le repos » conserve le motif littéraire récurrent du livre des Juges.
