base_translation:
  language: en
  yaml_path: translation/ot/judges/003/023.yaml
  text: Then Ehud went out into the vestibule and shut the doors of the upper room behind him and locked them[a].
translation:
  language: fr
  text: Puis Éhoud sortit dans le vestibule[a] ; il ferma derrière lui les portes de la chambre haute et les verrouilla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le porche », « dans l’antichambre » ou « dans la colonnade » ; le terme hébreu est rare et désigne un espace architectural attenant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le qal narratif de יצא exprime la sortie; « sortit » rend naturellement le déplacement d’Éhoud hors de la chambre haute.
- source_word: הַמִּסְדְּרוֹנָה
  choice: dans le vestibule
  rationale: מִסְדְּרוֹן est un terme architectural rare désignant vraisemblablement un espace attenant. « Vestibule » reste naturel sans préciser excessivement la configuration; le hé directionnel marque le mouvement vers cet espace.
- source_word: וַיִּסְגֹּר
  choice: ferma
  rationale: סגר signifie couramment fermer; « ferma » convient au récit et à son complément « les portes ».
- source_word: דַּלְתוֹת
  choice: les portes
  rationale: Le pluriel peut désigner les deux battants; « les portes » conserve la forme du texte tout en restant idiomatique.
- source_word: הָעֲלִיָּה
  choice: la chambre haute
  rationale: עֲלִיָּה désigne une pièce aménagée à l’étage ou sur le toit. « Chambre haute » en garde le caractère architectural sans imposer une reconstruction précise.
- source_word: בַּעֲדוֹ
  choice: derrière lui
  rationale: Avec un verbe de fermeture, בעד indique ici que les portes furent fermées après le passage d’Éhoud, derrière lui.
- source_word: וְנָעָל
  choice: et les verrouilla
  rationale: Dans ce contexte, נעל signifie assujettir ou verrouiller une porte. « Verrouilla » décrit l’action sans supposer un mécanisme moderne à clé; le pronom reprend les portes.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Deux phrases allègent la succession des actions tout en conservant leur ordre. La note maintient l’incertitude réelle du rare terme architectural.
