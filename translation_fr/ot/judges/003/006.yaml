review_pass:
  verdict: revise
  source_fidelity: 'Le texte hébreu décrit deux alliances matrimoniales réciproques, avec un changement de référent des suffixes possessifs : les Israélites prirent les filles des peuples environnants, puis donnèrent leurs propres filles aux fils de ces peuples. La formulation française actuelle ne rend pas ce changement de référent de manière intelligible.'
  naturalness: « Ils prirent leurs filles pour femmes, donnèrent leurs filles à leurs fils » suggère en français que le même groupe donne ses filles à ses propres fils, ce qui est à la fois ambigu et fortement trompeur. Une explicitation contextuelle est nécessaire et reste fidèle au sens du texte.
  terminology: « Servirent leurs dieux » rend bien עבד dans son sens d’allégeance religieuse, tout en restant proche du vocabulaire hébreu. La note proposant « rendirent un culte à leurs dieux » est une alternative lexicale recevable.
  issues:
  - severity: high
    issue: Les possessifs français masquent le changement de référent entre les deux propositions matrimoniales.
    rationale: En hébreu, le contexte établit que « leurs filles » désigne d’abord les filles des peuples cananéens, tandis que, dans la seconde proposition, il s’agit des filles d’Israël données aux fils de ces peuples. En français, la répétition non explicitée fait normalement comprendre « leurs propres filles à leurs propres fils », contresens grave.
  revised_text: Ils prirent pour femmes les filles de ces peuples, donnèrent leurs propres filles aux fils de ces peuples et servirent leurs dieux[a].
  revised_footnotes:
  - marker: a
    text: Ou « rendirent un culte à leurs dieux ».
    reason: Alternative lexicale valable pour וַיַּעַבְדוּ dans un contexte religieux.
  revision_rationale: L’explicitation de « ces peuples » dans les deux membres de la phrase rend le contraste des référents, indispensable en français, sans ajouter d’information étrangère au contexte immédiat (Jg 3.5). « Leurs propres filles » marque le retour du référent à Israël dans la seconde proposition. Le rendu de עבד et sa note sont conservés.
