base_translation:
  language: en
  yaml_path: translation/ot/judges/003/006.yaml
  text: They took their daughters for themselves as wives[a], and they gave their daughters to their sons, and they served their gods.
translation:
  language: fr
  text: Ils prirent pour femmes les filles de ces peuples, donnèrent leurs propres filles aux fils de ces peuples et servirent leurs dieux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rendirent un culte à leurs dieux ».
    reason: Alternative lexicale valable pour וַיַּעַבְדוּ dans un contexte religieux.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Ils prirent
  rationale: Le verbe לקח signifie littéralement « prendre » et, dans ce contexte, désigne le fait de prendre une femme pour épouse. La suite « pour femmes » explicite naturellement le sens matrimonial.
- source_word: בְּנוֹתֵיהֶם
  choice: leurs filles
  rationale: Le suffixe masculin pluriel renvoie, dans la première proposition, aux peuples environnants. Le pronom français conserve la formulation concise de l’hébreu et son renvoi contextuel.
- source_word: לָהֶם לְנָשִׁים
  choice: pour femmes
  rationale: Cette tournure française idiomatique exprime le résultat matrimonial de la double construction prépositionnelle hébraïque sans l’alourdir par « pour eux-mêmes », déjà impliqué par le sujet.
- source_word: וְאֶת־בְּנוֹתֵיהֶם נָתְנוּ לִבְנֵיהֶם
  choice: donnèrent leurs filles à leurs fils
  rationale: La traduction garde le verbe concret נתן, « donner », ainsi que les pronoms de l’hébreu. Le contexte matrimonial permet de comprendre qu’il s’agit de les donner en mariage, sans devoir l’ajouter explicitement.
- source_word: וַיַּעַבְדוּ
  choice: servirent
  rationale: עבד appliqué à des dieux peut signifier « servir » ou « rendre un culte ». « Servirent » reste proche du terme hébreu et conserve l’idée plus large d’allégeance religieuse.
- source_word: אֱלֹהֵיהֶם
  choice: leurs dieux
  rationale: Cette expression française courante rend directement le pluriel hébreu avec suffixe et désigne les dieux des peuples environnants.
theological_decisions:
- issue: L’allégeance religieuse exprimée par עבד à propos de dieux étrangers
  choice: servirent leurs dieux
  alternative: rendirent un culte à leurs dieux
  rationale: « Servir » préserve à la fois la dimension cultuelle et celle de l’allégeance, tandis que « rendre un culte » met plus exclusivement l’accent sur les actes religieux.
- issue: Identification des référents des suffixes possessifs dans les alliances matrimoniales
  choice: conserver « leurs filles » et « leurs fils »
  alternative: expliciter « les filles de ces peuples » et « leurs propres filles aux fils de ces peuples »
  rationale: Les référents se déduisent du contexte, mais les suffixes hébreux eux-mêmes restent formellement identiques. La traduction évite de résoudre dans le corps du texte ce que la syntaxe exprime par le contexte.
translation_notes:
  register: Français moderne, sobre et digne. La coordination resserrée reproduit le mouvement narratif de l’hébreu. Les possessifs sont maintenus afin de ne pas sur-expliciter leurs référents, même si leur enchaînement exige de suivre attentivement le contexte.
