- from: Ils prirent leurs filles pour femmes, donnèrent leurs filles à leurs fils et servirent leurs dieux[a].
  to: Ils prirent pour femmes les filles de ces peuples, donnèrent leurs propres filles aux fils de ces peuples et servirent leurs dieux[a].
  rationale: L’explicitation de « ces peuples » dans les deux membres de la phrase rend le contraste des référents, indispensable en français, sans ajouter d’information étrangère au contexte immédiat (Jg 3.5). « Leurs propres filles » marque le retour du référent à Israël dans la seconde proposition. Le rendu de עבד et sa note sont conservés.
