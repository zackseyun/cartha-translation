  text: וְ/אֵה֥וּד נִמְלַ֖ט עַ֣ד הִֽתְמַהְמְהָ֑/ם וְ/הוּא֙ עָבַ֣ר אֶת הַ/פְּסִילִ֔ים וַ/יִּמָּלֵ֖ט הַ/שְּׂעִירָֽתָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/026.yaml
  text: But Ehud escaped while they delayed[b][a], and he passed beyond the carved images and escaped to Seirah.
translation:
  language: fr
  text: Mais Éhoud s’échappa pendant qu’ils tardaient ; il dépassa les images sculptées[a] et s’échappa vers Seïra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les idoles » ou « les images taillées ».
    reason: lexical_alternative
  - marker: b
    text: Le nom de ce lieu peut aussi être transcrit « Seïrath ».
    reason: alternative_reading
lexical_decisions:
- source_word: נִמְלַט / וַיִּמָּלֵט
  choice: s’échappa / s’enfuit
  rationale: 'Le niphal de מלט exprime ici une fuite réussie. Deux verbes français naturels rendent la répétition hébraïque sans lourdeur : le premier désigne le départ d’Éhoud, le second sa fuite vers un lieu sûr.'
- source_word: עַד הִתְמַהְמְהָם
  choice: pendant qu’ils tardaient
  rationale: La construction situe la fuite d’Éhoud dans le temps où les serviteurs hésitaient et prolongeaient leur attente. « Pendant qu’ils tardaient » est clair et ne précise pas indûment la cause de leur retard.
- source_word: עָבַר אֶת הַפְּסִילִים
  choice: dépassa les statues sculptées
  rationale: Dans ce contexte de déplacement, עבר avec le complément direct indique qu’Éhoud franchit ce repère et le laissa derrière lui.
- source_word: הַפְּסִילִים
  choice: les statues sculptées
  rationale: פסילים désigne des objets taillés ou sculptés, vraisemblablement cultuels. Cette formulation conserve le sens concret sans imposer dans le corps du texte l’interprétation « idoles ».
- source_word: הַשְּׂעִירָתָה
  choice: vers Seïra
  rationale: Le suffixe directionnel hébreu indique un mouvement vers le lieu nommé. « Seïra » est une translittération lisible en français.
- source_word: וְ
  choice: Mais
  rationale: La conjonction introduit un contraste narratif avec les serviteurs qui attendent dans la scène précédente.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste brève pour conserver le rythme de l’hébreu. Les deux occurrences de מלט sont rendues par des verbes proches mais distincts afin d’éviter une répétition française maladroite, tandis que les notes préservent les principales possibilités lexicales et de translittération.
