  source_fidelity: La structure temporelle (« pendant qu’ils tardaient »), le déplacement au-delà des פסילים et la direction vers Seïra sont bien rendus. Toutefois, le même verbe hébreu נמלט est employé deux fois ; rendre la seconde occurrence par « s’enfuit » atténue la reprise lexicale et peut ne décrire que le départ plutôt que l’évasion réussie.
  naturalness: Le français est clair et narratif. « Images sculptées » est plus précis et moins redondant que « statues sculptées », puisque פסילים peut désigner des représentations taillées sans exiger qu’il s’agisse de statues.
  terminology: « Éhoud » et « Seïra » sont des formes françaises lisibles. « Images sculptées » rend le sens concret de פסילים sans imposer « idoles ». Les notes proposées conservent utilement les alternatives.
