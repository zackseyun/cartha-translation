  yaml_path: translation/ot/judges/003/002.yaml
  text: only so that the generations of the sons of Israel might know[b][a], to teach them war—only those who formerly had not known it.
translation:
  language: fr
  text: seulement afin que les générations des fils d’Israël connaissent[a] la guerre, afin de la leur enseigner — seulement celles qui, auparavant, ne la connaissaient pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les générations des Israélites ». Littéralement : « les générations des fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « n’en avaient pas fait l’expérience ».'
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: seulement
  rationale: La particule restreint le but exprimé et sa répétition dans le verset est conservée.
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette locution rend naturellement la valeur finale de l’expression hébraïque.
- source_word: דַּעַת
  choice: connaissent
  rationale: L’infinitif de ידע exprime ici le but; « connaissent » maintient le lien lexical avec le même verbe repris à la fin du verset.
- source_word: דֹּרוֹת בְּנֵי יִשְׂרָאֵל
  choice: les générations des fils d’Israël
  rationale: La relation construite est rendue directement, sans ajouter « futures », qui est implicite dans le contexte mais absent du texte.
- source_word: לְלַמְּדָם מִלְחָמָה
  choice: pour la leur enseigner
  rationale: Le piel de למד signifie « enseigner »; le pronom féminin singulier reprend naturellement « la guerre » en français.
- source_word: מִלְחָמָה
  choice: la guerre
  rationale: Le substantif abstrait singulier désigne la guerre ou l’art de la guerre; « la guerre » reste simple et proche de l’hébreu.
- source_word: אֲשֶׁר לְפָנִים
  choice: ceux qui, auparavant
  rationale: La tournure marque un temps antérieur; « auparavant » rend clairement ce contraste temporel.
- source_word: לֹא יְדָעוּם
  choice: ne l’avaient pas connue
  rationale: Le verbe ידע est conservé par « connaître » et le pronom reprend « la guerre »; le plus-que-parfait exprime l’antériorité.
theological_decisions:
- issue: Expression collective genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation littérale est conservée tout en signalant l’équivalent ethnonymique courant; l’expression désigne collectivement le peuple d’Israël.
- issue: Sens de « connaître la guerre »
  choice: connaissent / ne l’avaient pas connue
  alternative: fassent l’expérience de la guerre / ne l’avaient pas vécue
  rationale: Le texte emploie deux fois ידע, « connaître ». Maintenir ce verbe préserve à la fois la répétition et l’ambiguïté entre connaissance, apprentissage et expérience effective de la guerre.
- issue: Rapport syntaxique entre « connaître » et « enseigner »
  choice: connaissent la guerre, pour la leur enseigner
  alternative: connaissent, afin de leur enseigner la guerre
  rationale: La ponctuation et la reprise pronominale donnent en français une phrase intelligible sans trancher excessivement la relation syntaxique quelque peu heurtée de l’hébreu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « seulement » et celle du verbe « connaître » sont maintenues pour refléter la structure et la tension sémantique de l’hébreu.
