review_pass:
  verdict: revise
  source_fidelity: La répétition de רַק, la finalité de לְמַעַן et la répétition de ידע sont globalement bien conservées. Toutefois, « seulement ceux qui » ne peut pas reprendre grammaticalement « les générations » et brouille le référent du membre restrictif final. « Connaissent la guerre » est une explicitation recevable, soutenue par le contexte et la reprise finale, à condition que la syntaxe de l’enseignement ne fasse pas des générations le sujet implicite de l’infinitif.
  naturalness: 'La formulation révisée est plus cohérente en français moderne : « celles qui » s’accorde avec « générations », et la reprise « la leur enseigner » indique clairement que la guerre est enseignée aux générations. La phrase demeure volontairement un peu resserrée, conformément à la syntaxe dense de l’hébreu.'
  terminology: '« Fils d’Israël », « guerre » et « connaître » sont appropriés et préservent respectivement la désignation collective, le terme militaire abstrait et la répétition lexicale du texte source. La note sur « Israélites » doit être simplifiée : l’alternative porte sur l’ethnonyme, non sur une proposition complète.'
  issues:
  - severity: medium
    issue: Discordance de référent et de genre dans « seulement ceux qui ».
    rationale: Le groupe nominal antécédent est « les générations », féminin pluriel. Le relatif restrictif final doit donc être rendu par « seulement celles qui », sans quoi le français suggère à tort que « ceux » reprend « les fils d’Israël » plutôt que les générations.
  - severity: low
    issue: Ancrage syntaxique insuffisamment net de « pour la leur enseigner ».
    rationale: Après « les générations ... connaissent », « pour » peut laisser entendre que les générations enseignent la guerre à elles-mêmes. « afin de la leur enseigner » rend plus naturellement la finalité dont le sujet est implicite dans le contexte.
  - severity: low
    issue: Note a formulée comme une phrase complète et commentant inutilement le texte principal.
    rationale: La note lexicale doit donner l’équivalent alternatif de « fils d’Israël » de manière directe.
  revised_text: seulement afin que les générations des fils d’Israël connaissent[a] la guerre, afin de la leur enseigner — seulement celles qui, auparavant, ne la connaissaient pas[b].
