  to: seulement afin que les générations des fils d’Israël connaissent[a] la guerre, afin de la leur enseigner — seulement celles qui, auparavant, ne la connaissaient pas[b].
  rationale: La révision corrige la discordance structurelle du dernier membre, clarifie sans ajout doctrinal la finalité de l’enseignement et normalise la note lexicale. Elle conserve les deux occurrences de « seulement », la répétition de « connaître » et l’ambiguïté entre connaissance et expérience de la guerre.
