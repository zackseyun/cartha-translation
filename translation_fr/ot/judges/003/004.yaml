source:
  edition: WLC
  text: וַֽ/יִּהְי֕וּ לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל לָ/דַ֗עַת הֲ/יִשְׁמְעוּ֙ אֶת מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁר צִוָּ֥ה אֶת אֲבוֹתָ֖/ם בְּ/יַד מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/004.yaml
  text: And they were there to test Israel[a], to know whether they would listen to the commandments of Yahweh[c][b], which he commanded their fathers through Moses.
translation:
  language: fr
  text: Ces nations étaient là pour que, par elles[a], Israël soit mis à l’épreuve, afin de savoir[b] si les Israélites obéiraient[c] aux commandements de Yahweh, qu’il avait donnés à leurs pères[d] par l’intermédiaire de Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu précise « par elles » : les nations laissées dans le pays sont le moyen par lequel Israël est mis à l’épreuve.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu ne précise pas explicitement qui doit ainsi « savoir »; le contexte rattache cette mise à l’épreuve à l’action de Yahweh.
    reason: theological_ambiguity
  - marker: c
    text: Littéralement « écouteraient ». Dans ce contexte, écouter les commandements signifie en tenir compte et leur obéir.
    reason: lexical_alternative
  - marker: d
    text: Ici, « leurs pères » désigne leurs ancêtres, les générations antérieures d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Ces nations étaient là
  rationale: Le pronom pluriel reprend les nations mentionnées dans le contexte immédiat. « Étaient là » exprime en français naturel leur présence maintenue en vue d’un but.
- source_word: לְנַסּוֹת בָּם אֶת יִשְׂרָאֵל
  choice: pour que, par elles, Israël soit mis à l’épreuve
  rationale: נסה désigne ici une mise à l’épreuve, non une incitation au mal. Le complément בם indique explicitement que les nations en sont le moyen; la tournure passive permet de l’exprimer clairement sans leur attribuer elles-mêmes l’intention de l’épreuve.
- source_word: לָדַעַת
  choice: afin de savoir
  rationale: La formulation conserve le sens direct de ידע et la finalité exprimée par l’infinitif, sans remplacer la connaissance par une simple observation historique.
- source_word: הֲיִשְׁמְעוּ
  choice: si les Israélites obéiraient
  rationale: Avec des commandements pour complément, שמע signifie écouter de manière à tenir compte de ce qui est dit, donc obéir. Le nom « les Israélites » explicite en français le sujet du verbe, renvoyant à Israël.
- source_word: מִצְוֺת יְהוָה
  choice: aux commandements de Yahweh
  rationale: « Commandements » rend le pluriel מצות dans son contexte d’alliance, et « Yahweh » transcrit le nom divin יהוה au lieu de lui substituer un titre.
- source_word: אֲבוֹתָם
  choice: leurs pères
  rationale: La traduction conserve l’expression masculine plurielle de l’hébreu, qui désigne ici les générations antérieures d’Israël.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: L’expression idiomatique « par la main de Moïse » marque l’agence ou la médiation; la formulation choisie en communique naturellement le sens en français moderne.
theological_decisions:
- issue: Finalité de la présence des nations
  choice: Les nations restées dans le pays sont présentées comme le moyen par lequel Israël est mis à l’épreuve quant à son obéissance.
  alternative: Comprendre leur présence comme un simple fait historique, sans finalité théologique.
  rationale: Les infinitifs לְנַסּוֹת et לָדַעַת expriment explicitement un but. La traduction maintient cette finalité sans développer une doctrine de la tentation étrangère au verset.
- issue: Sujet implicite de « savoir »
  choice: Ne pas nommer dans le texte principal celui qui sait.
  alternative: Expliciter « afin que Yahweh sache » ou reformuler « afin de faire apparaître ».
  rationale: L’infinitif לָדַעַת ne porte pas de sujet exprimé. Le contexte suggère Yahweh, mais l’expliciter dans le corps du texte supprimerait une indétermination grammaticale réelle et soulèverait une question théologique que le verset ne développe pas.
- issue: Nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription préserve le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La structure finale reste fluide tout en conservant la finalité de l’épreuve, le rôle instrumental des nations et l’indétermination du sujet de « savoir ».
