  source_fidelity: Le texte rend fidèlement la structure, l’accumulation des divinités et le contraste volontaire entre « servirent » les dieux et le refus de servir Yahweh. Toutefois, « ne le servirent plus » explicite une notion de cessation (« plus ») qui n’est pas exprimée par la simple négation hébraïque ולא עבדוהו.
