source:
  edition: WLC
  text: וַ/יֹּסִ֣פוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לַ/עֲשׂ֣וֹת הָ/רַע֮ בְּ/עֵינֵ֣י יְהוָה֒ וַ/יַּעַבְד֣וּ אֶת הַ/בְּעָלִ֣ים וְ/אֶת הָ/עַשְׁתָּר֡וֹת וְ/אֶת אֱלֹהֵ֣י אֲרָם֩ וְ/אֶת אֱלֹהֵ֨י צִיד֜וֹן וְ/אֵ֣ת אֱלֹהֵ֣י מוֹאָ֗ב וְ/אֵת֙ אֱלֹהֵ֣י בְנֵי עַמּ֔וֹן וְ/אֵ֖ת אֱלֹהֵ֣י פְלִשְׁתִּ֑ים וַ/יַּעַזְב֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א עֲבָדֽוּ/הוּ׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/006.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and they served the Baals and the Ashtoreths, and the gods of Aram, the gods of Sidon, the gods of Moab, the gods of the sons of Ammon, and the gods of the Philistines[b]. They forsook Yahweh and did not serve him.
translation:
  language: fr
  text: Les Israélites recommencèrent à faire ce qui est mal aux yeux de Yahweh[a]. Ils servirent les Baals et les Astartés, les dieux d’Aram, les dieux de Sidon, les dieux de Moab, les dieux des Ammonites[b] et les dieux des Philistins. Ils abandonnèrent Yahweh et ne le servirent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « continuèrent à faire ce qui est mal aux yeux de Yahweh ». Le verbe hébreu peut exprimer la répétition ou la continuation.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les dieux des fils d’Ammon », c’est-à-dire les dieux adorés par les Ammonites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: recommencèrent à faire
  rationale: Avec l’infinitif, יסף peut exprimer la répétition ou la continuation. « Recommencèrent à faire » rend naturellement le caractère cyclique du récit tout en laissant l’autre possibilité en note.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: En français moderne, « les Israélites » désigne clairement les membres du peuple d’Israël et évite le calque moins naturel « les fils d’Israël ».
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: faire ce qui est mal aux yeux de Yahweh
  rationale: Cette formulation française naturelle conserve la métaphore évaluative hébraïque « aux yeux de ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיַּעַבְדוּ / עֲבָדוּהוּ
  choice: servirent / ne le servirent plus
  rationale: « Servir » préserve le même verbe dans les deux propositions et souligne le contraste d’allégeance. Dans la dernière proposition, « ne… plus » exprime naturellement la cessation qui suit l’abandon.
- source_word: הַבְּעָלִים
  choice: les Baals
  rationale: Le pluriel français conserve les diverses manifestations locales ou figures cultuelles de Baal.
- source_word: הָעַשְׁתָּרוֹת
  choice: les Astartés
  rationale: « Astarté » est la forme française courante du nom cultuel; le pluriel reflète le pluriel hébreu.
- source_word: אֱלֹהֵי אֲרָם
  choice: les dieux d’Aram
  rationale: « Aram » conserve le nom propre historique de la région sans le remplacer par le terme géopolitique ultérieur « Syrie ».
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: les dieux des Ammonites
  rationale: Cette expression rend idiomatiquement en français les dieux du peuple appelé littéralement « les fils d’Ammon ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le tétragramme comme nom personnel. « Yahweh » le conserve sans substituer un titre ni privilégier la vocalisation tardive « Jéhovah ».
- issue: Sens cultuel et relationnel du verbe עבד
  choice: servir
  alternative: adorer
  rationale: « Servir » conserve le lien lexical entre le service des divinités et le refus de servir Yahweh; le contexte inclut l’adoration sans réduire le terme au seul rite cultuel.
- issue: Portée de וַיֹּסִפוּ avec infinitif
  choice: recommencèrent
  alternative: continuèrent
  rationale: La construction peut signaler répétition ou continuation. Le corps du texte retient la répétition, adaptée au cycle narratif des Juges, tandis que la note préserve explicitement l’autre lecture.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de la cadence narrative hébraïque, mais les désignations ethniques sont rendues idiomatiquement. Les répétitions de « les dieux de » sont conservées pour refléter l’accumulation emphatique de l’original.
