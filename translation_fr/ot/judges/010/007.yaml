id: JDG.10.7
reference: Judges 10:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּמְכְּרֵ/ם֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/בְ/יַ֖ד בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/007.yaml
  text: So Yahweh’s anger burned against Israel[c][b][a], and he sold them into the hand of the Philistines and into the hand of the Ammonites.
translation:
  language: fr
  text: Alors la colère de Yahweh s’enflamma contre Israël, et il les vendit au pouvoir des Philistins et des Ammonites.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la main des Philistins et dans la main des fils d’Ammon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: la colère de Yahweh s’enflamma
  rationale: L’expression idiomatique hébraïque associe la colère à un feu qui s’allume. « S’enflamma » conserve cette image tout en restant naturel et digne en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH; « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- source_word: בְּיִשְׂרָאֵל
  choice: contre Israël
  rationale: Avec l’expression de la colère, la préposition בְּ indique ici la personne ou le peuple contre qui elle est dirigée.
- source_word: וַיִּמְכְּרֵם
  choice: il les vendit
  rationale: Le verbe מָכַר signifie « vendre ». Cette traduction préserve la métaphore récurrente du livre des Juges, où Dieu livre Israël à la domination ennemie en jugement.
- source_word: בְּיַד
  choice: au pouvoir de
  rationale: Littéralement « dans la main de », l’expression désigne le fait de tomber sous l’autorité ou la domination de quelqu’un. « Au pouvoir de » transmet clairement cet idiome en français courant.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Ethnonyme français usuel.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: « Les Ammonites » est l’ethnonyme français naturel correspondant à l’expression littérale « les fils d’Ammon ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le verset emploie directement le tétragramme. La translittération « Yahweh » préserve sa fonction de nom personnel sans le remplacer par un titre.
- issue: Représentation du jugement divin dans וַיִּמְכְּרֵם
  choice: il les vendit
  alternative: il les livra; il les abandonna
  rationale: Le texte attribue explicitement à Yahweh l’action de soumettre Israël à ses ennemis. « Vendit » conserve sans l’atténuer la métaphore sévère et récurrente des Juges.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique. La métaphore de la colère qui s’enflamme et celle de la vente sont conservées; l’idiome de la « main » est rendu naturellement par « pouvoir », avec sa forme littérale signalée en note.
