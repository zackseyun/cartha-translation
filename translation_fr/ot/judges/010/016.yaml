  text: וַ/יָּסִ֜ירוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ מִ/קִּרְבָּ֔/ם וַ/יַּעַבְד֖וּ אֶת יְהוָ֑ה וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ בַּ/עֲמַ֥ל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/016.yaml
  text: So they removed the foreign gods from among them and served Yahweh[a], and he became impatient over the misery of Israel.
translation:
  language: fr
  text: Alors ils retirèrent de leur milieu les dieux étrangers et servirent Yahweh. Et il ne put plus supporter la détresse d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son âme se raccourcit à cause de la détresse d’Israël ». L’expression est un idiome qui peut exprimer l’impatience ou l’incapacité de supporter davantage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: ils retirèrent
  rationale: Le hifil de סור exprime ici l’action de faire disparaître ou d’écarter. « Retirèrent » est concret et naturel en français.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: les dieux étrangers
  rationale: Cette expression désigne les divinités non israélites; « dieux étrangers » est clair, courant et fidèle.
- source_word: מִקִּרְבָּם
  choice: du milieu d’eux
  rationale: Rend le sens communautaire de l’expression hébraïque, littéralement « de leur milieu ».
- source_word: וַיַּעַבְדוּ אֶת יְהוָה
  choice: servirent Yahweh
  rationale: « Servir » conserve la portée large de עבד, qui comprend le culte, la fidélité et l’allégeance, sans la réduire au seul acte d’adoration.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin dans le cadre du projet.
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: il ne put supporter plus longtemps
  rationale: Littéralement, « son être devint court »; l’expression idiomatique indique que Yahweh ne supportait plus la situation. Cette formulation française naturelle conserve l’idée de la limite atteinte sans introduire une impatience potentiellement ambiguë.
- source_word: בַּעֲמַל יִשְׂרָאֵל
  choice: la détresse d’Israël
  rationale: עָמָל peut désigner peine, malheur ou souffrance. Dans ce contexte d’oppression, « détresse » exprime précisément l’affliction vécue par Israël.
theological_decisions:
- issue: Description anthropopathique de Yahweh dans וַתִּקְצַר נַפְשׁוֹ
  choice: Il ne put supporter plus longtemps la détresse d’Israël
  alternative: Il s’impatienta à cause de la détresse d’Israël
  rationale: L’hébreu présente Yahweh comme personnellement affecté par la détresse d’Israël. La traduction garde cette réaction vive sans décider si l’idiome met surtout l’accent sur l’impatience, la compassion ou l’impossibilité de tolérer davantage la souffrance.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif biblique écrit. La formulation principale privilégie une équivalence naturelle tout en signalant en note l’image hébraïque et son autre interprétation possible.
