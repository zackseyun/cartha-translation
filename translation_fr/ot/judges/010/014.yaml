source:
  edition: WLC
  text: לְכ֗וּ וְ/זַֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֥ר בְּחַרְתֶּ֖ם בָּ֑/ם הֵ֛מָּה יוֹשִׁ֥יעוּ לָ/כֶ֖ם בְּ/עֵ֥ת צָרַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/014.yaml
  text: Go and cry out to the gods whom you have chosen[a]; let them save you in the time of your distress.
translation:
  language: fr
  text: Allez donc, criez vers les dieux que vous avez choisis ; qu’ils vous sauvent[a] au temps de votre détresse !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils vous sauveront ». La forme hébraïque peut se traduire par un futur simple, mais, dans ce contexte, elle exprime un défi ironique.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: Allez donc
  rationale: L’impératif pluriel exprime ici un renvoi cinglant. « Allez donc » garde la simplicité du verbe tout en rendant naturellement la force de la réplique.
- source_word: וְזַעֲקוּ
  choice: crier vers
  rationale: זעק désigne un cri pressant lancé pour obtenir du secours. « Crier vers » conserve à la fois l’urgence et l’appel adressé à une divinité.
- source_word: אֶל הָאֱלֹהִים
  choice: vers les dieux
  rationale: Le contexte des divinités étrangères choisies par Israël, ainsi que le pronom et le verbe au pluriel qui suivent, imposent ici le pluriel « les dieux ».
- source_word: אֲשֶׁר בְּחַרְתֶּם בָּם
  choice: que vous avez choisis
  rationale: Le verbe בחר construit avec ב signifie choisir parmi ou prendre pour choix. En français courant, « que vous avez choisis » en exprime clairement le sens.
- source_word: הֵמָּה
  choice: qu’ils
  rationale: 'Le pronom indépendant est emphatique : ce sont précisément ces dieux qui sont mis au défi d’intervenir. Le sujet explicite « ils » porte naturellement cette opposition en français.'
- source_word: יוֹשִׁיעוּ
  choice: qu’ils vous sauvent
  rationale: Le hifil de ישׁע signifie sauver ou délivrer. Dans ce reproche, la forme a la valeur pragmatique d’un défi ironique plutôt que d’une promesse.
- source_word: בְּעֵת
  choice: au temps de
  rationale: Cette expression temporelle nominale signifie « au moment/au temps de ». « Au temps de » reste naturel et proche de la forme hébraïque.
- source_word: צָרַתְכֶם
  choice: votre détresse
  rationale: צָרָה évoque une situation critique de détresse ou d’adversité. « Détresse » s’accorde avec le cri de secours et la nécessité d’être sauvé.
theological_decisions:
- issue: Valeur de יוֹשִׁיעוּ dans le contexte
  choice: 'Défi ironique à valeur jussive : « qu’ils vous sauvent »'
  alternative: 'Futur simple : « ils vous sauveront »'
  rationale: Le Seigneur reproche à Israël d’avoir choisi d’autres dieux et le met au défi de chercher auprès d’eux son secours. Le subjonctif indépendant rend cette force rhétorique sans transformer l’énoncé en prédiction, tandis que la note préserve l’ambiguïté formelle de l’hébreu.
translation_notes:
  register: Français international moderne, direct et digne. Le point-virgule articule l’ordre de se tourner vers les dieux choisis et le défi ironique qui suit ; le point d’exclamation fait ressortir le ton incisif sans ajouter de contenu.
