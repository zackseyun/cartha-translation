id: JDG.10.9
reference: Judges 10:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּעַבְר֤וּ בְנֵֽי עַמּוֹן֙ אֶת הַ/יַּרְדֵּ֔ן לְ/הִלָּחֵ֛ם גַּם בִּ/יהוּדָ֥ה וּ/בְ/בִנְיָמִ֖ין וּ/בְ/בֵ֣ית אֶפְרָ֑יִם וַ/תֵּ֥צֶר לְ/יִשְׂרָאֵ֖ל מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/009.yaml
  text: Then the Ammonites crossed the Jordan to fight also against Judah[a], Benjamin, and the house of Ephraim, and Israel was greatly distressed.
translation:
  language: fr
  text: Les Ammonites traversèrent alors le Jourdain pour combattre aussi Juda, Benjamin et la maison d’Éphraïm. Israël se trouva dans une très grande détresse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « La situation devint extrêmement difficile pour Israël. »'
    reason: La construction impersonnelle וַתֵּצֶר לְיִשְׂרָאֵל peut être rendue soit en faisant d’Israël le sujet affecté, soit en décrivant la situation qui lui advient.
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: traversèrent
  rationale: Avec « le Jourdain » comme complément, le verbe עבר désigne concrètement le franchissement du fleuve. « Traversèrent » est précis et naturel en français.
- source_word: בְנֵי עַמּוֹן
  choice: les Ammonites
  rationale: L’ethnonyme français courant rend naturellement l’expression hébraïque littérale « les fils d’Ammon » dans ce récit.
- source_word: אֶת הַיַּרְדֵּן
  choice: le Jourdain
  rationale: « Le Jourdain » est la désignation française usuelle; il n’est pas nécessaire d’ajouter « fleuve ».
- source_word: לְהִלָּחֵם
  choice: pour combattre
  rationale: L’infinitif exprime le but du franchissement et l’engagement dans les hostilités. « Pour combattre » conserve cette relation sans préciser davantage la forme de guerre.
- source_word: גַּם
  choice: aussi
  rationale: L’adverbe étend les hostilités aux territoires situés à l’ouest du Jourdain, en plus de l’oppression déjà évoquée dans le contexte.
- source_word: בִּיהוּדָה וּבְבִנְיָמִין וּבְבֵית אֶפְרָיִם
  choice: Juda, Benjamin et la maison d’Éphraïm
  rationale: Après « combattre », les noms désignent naturellement les cibles des hostilités. « Maison d’Éphraïm » conserve explicitement בֵּית et sa portée collective possible.
- source_word: וַתֵּצֶר לְיִשְׂרָאֵל מְאֹד
  choice: Israël se trouva dans une très grande détresse
  rationale: La tournure hébraïque impersonnelle indique qu’Israël fut placé dans une situation extrêmement pénible. Cette formulation française garde l’intensité de מְאֹד sans attribuer au verbe un agent non exprimé.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au déroulement du récit. « Maison d’Éphraïm » maintient la formulation collective de l’hébreu plutôt que de la réduire simplement à « Éphraïm ».
