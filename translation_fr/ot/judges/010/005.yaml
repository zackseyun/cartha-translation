  text: Jaïr mourut et fut enterré à Kamon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le verbe מות désigne directement la mort. Le passé simple convient au récit historique bref et garde la sobriété de l’hébreu.
- source_word: יָאִיר
  choice: Yaïr
  rationale: Translittération française usuelle du nom propre hébreu, avec tréma pour signaler que les deux voyelles se prononcent séparément.
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: Le nifal de קבר a ici un sens passif. « Fut enterré » est naturel en français narratif et reproduit directement cette valeur.
- source_word: בְּקָמוֹן
  choice: à Qamôn
  rationale: La préposition ב marque ici le lieu. En français, « à » est la préposition idiomatique devant le nom d’une localité; « Qamôn » translittère le nom hébreu sans l’identifier conjecturalement à un autre lieu.
