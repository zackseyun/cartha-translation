  text: וַ/יָּ֣קָם אַחֲרָ֔י/ו יָאִ֖יר הַ/גִּלְעָדִ֑י וַ/יִּשְׁפֹּט֙ אֶת יִשְׂרָאֵ֔ל עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/003.yaml
  text: After him arose Jair the Gileadite[a], and he judged Israel twenty-two years.
translation:
  language: fr
  text: Après lui se leva Yaïr, le Galaadite[a], qui jugea Israël pendant vingt-deux ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire le début du verset : « Après lui vint Yaïr, le Galaadite. »'
    reason: Cette variante rend la formule de succession de manière plus explicite, tandis que le texte principal conserve l’image littérale du verbe « se lever ».
lexical_decisions:
- source_word: וַיָּקָם אַחֲרָיו
  choice: Après lui se leva
  rationale: Cette formulation conserve la succession personnelle marquée par אַחֲרָיו et l’image narrative de קום, tout en restant naturelle dans un récit français soutenu.
- source_word: יָאִיר
  choice: Yaïr
  rationale: Translittération française courante du nom hébreu, avec tréma pour signaler la séparation des voyelles.
- source_word: הַגִּלְעָדִי
  choice: le Galaadite
  rationale: Le gentilé hébreu indique l’origine ou l’appartenance régionale de Yaïr. « Galaadite » en préserve la forme adjectivale traditionnelle et demeure compréhensible.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: qui jugea Israël
  rationale: « Juger » maintient le vocabulaire récurrent du livre des Juges et laisse au contexte la portée plus large de gouverner ou diriger. La proposition relative évite en français une succession pesante de verbes coordonnés sans modifier le sens.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: pendant vingt-deux ans
  rationale: Rendu idiomatique moderne de la durée exprimée en hébreu.
