  text: וַ֥/יֹּאמֶר יְהוָ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ וּ/מִן הָ֣/אֱמֹרִ֔י וּ/מִן בְּנֵ֥י עַמּ֖וֹן וּ/מִן פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/011.yaml
  text: And Yahweh said to the sons of Israel[a], “Was it not from Egypt, and from the Amorites, and from the Ammonites, and from the Philistines[b], that I delivered you?"
translation:
  language: fr
  text: 'Yahweh dit aux fils d’Israël[a] : « Ne vous ai-je pas délivrés d’Égypte, des Amorites, des Ammonites et des Philistins[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël » ; cette expression désigne les Israélites.'
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu de ce verset est elliptique ; « je vous ai délivrés » est explicité d’après le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol de אמר introduit normalement un discours direct dans le récit ; « dit » est l’équivalent français naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression familiale hébraïque et sa forme masculine, tout en restant compréhensible en français.
- source_word: הֲלֹא
  choice: N’est-ce pas… que
  rationale: Cette tournure française exprime naturellement la question rhétorique négative et permet de conserver l’énumération placée avant le verbe sous-entendu.
- source_word: מִמִּצְרַיִם
  choice: de l’Égypte
  rationale: La préposition מן marque ici l’origine ou la puissance dont Israël a été délivré ; « de » s’intègre à la structure parallèle de la liste.
- source_word: הָאֱמֹרִי
  choice: les Amorites
  rationale: Le singulier collectif hébreu désigne le peuple amorite ; le pluriel ethnique est idiomatique en français.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: « Ammonites » est le nom ethnique français courant pour les descendants d’Ammon.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Il s’agit de la désignation française usuelle de ce peuple.
- source_word: '[verbe sous-entendu d’après le contexte]'
  choice: que je vous ai délivrés
  rationale: Le texte hébreu du verset est elliptique. Le contexte immédiat permet d’expliciter l’action de délivrer, nécessaire à une phrase française autonome ; « délivrer » convient au motif des interventions historiques de Dieu dans les Juges.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: « Yahweh » préserve le caractère de nom propre du tétragramme sans le remplacer par un titre.
- issue: Rendu de l’expression בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix retient l’image familiale explicite du texte hébreu ; une note donne l’équivalent ethnique plus idiomatique.
- issue: Explicitation du verbe absent dans la proposition elliptique
  choice: que je vous ai délivrés
  alternative: laisser l’énumération sans verbe jusqu’à la suite du discours
  rationale: Pour que le verset soit intelligible isolément en français, le verbe impliqué par le contexte est fourni, sans ajouter de portée spirituelle étrangère à la délivrance historique évoquée.
translation_notes:
  register: Français international moderne, narratif et digne. La question rhétorique reste marquée, l’énumération est allégée conformément à l’usage français, et l’ellipse hébraïque est signalée en note.
