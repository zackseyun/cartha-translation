  text: וְ/צִידוֹנִ֤ים וַֽ/עֲמָלֵק֙ וּ/מָע֔וֹן לָחֲצ֖וּ אֶתְ/כֶ֑ם וַ/תִּצְעֲק֣וּ אֵלַ֔/י וָ/אוֹשִׁ֥יעָ/ה אֶתְ/כֶ֖ם מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/012.yaml
  text: The Sidonians[a], Amalek, and Maon oppressed you, and you cried out to me[b], and I saved you from their hand.
translation:
  language: fr
  text: Les Sidoniens, Amalec[a] et Maôn[b] vous ont opprimés. Vous avez crié vers moi, et je vous ai sauvés de leur main.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Amalécites ». L’hébreu porte « Amalec », nom qui peut désigner le peuple dans son ensemble.
    reason: lexical_alternative
  - marker: b
    text: Ou « les Maonites ». L’hébreu porte « Maôn », qui désigne probablement ici un groupe ethnique associé à Maôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידוֹנִים
  choice: les Sidoniens
  rationale: Nom ethnique pluriel désignant les habitants de Sidon; « les Sidoniens » est la forme française usuelle et concise.
- source_word: עֲמָלֵק
  choice: Amalec
  rationale: L’hébreu porte le nom propre collectif « Amalec », qui peut désigner le peuple dans son ensemble. La translittération française traditionnelle respecte cette forme sans expliciter le référent.
- source_word: מָעוֹן
  choice: Maôn
  rationale: Le texte consonantique porte le nom propre « Maôn ». La translittération conserve la formulation hébraïque, tandis qu’une note signale l’interprétation collective probable.
- source_word: לָחֲצוּ
  choice: vous ont opprimés
  rationale: Le verbe exprime une pression hostile ou une oppression. Cette formulation est naturelle en français moderne et convient à la domination exercée par des peuples ennemis.
- source_word: וַתִּצְעֲקוּ אֵלַי
  choice: Vous avez crié vers moi
  rationale: L’expression décrit un appel pressant adressé à Dieu. « Crier vers » en conserve à la fois l’intensité et l’orientation.
- source_word: וָאוֹשִׁיעָה
  choice: je vous ai sauvés
  rationale: Le verbe ישׁע signifie sauver ou délivrer. « Sauver » est direct, clair et maintient le vocabulaire biblique du salut.
- source_word: מִיָּדָם
  choice: de leur main
  rationale: L’image hébraïque de la main représente ici le pouvoir ou la domination. Elle reste compréhensible en français et préserve l’expression concrète du texte source.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les noms propres collectifs de l’hébreu sont conservés dans le texte, avec leurs explicitations possibles en notes. L’idiome « de leur main » est maintenu parce qu’il demeure intelligible et restitue l’image du texte source.
