  text: Then the Ammonites were summoned and camped in Gilead[a], and the sons of Israel gathered together and camped at Mizpah.
translation:
  language: fr
  text: Alors les Ammonites poussèrent des cris[a] et campèrent en Galaad. Les Israélites se rassemblèrent et campèrent à Mitspa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent convoqués ». Le verbe hébreu signifie habituellement « crier »; dans ce contexte militaire, certains y voient l’idée d’une mobilisation en vue du combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֲקוּ
  choice: furent convoqués
  rationale: Le verbe צעק signifie habituellement « crier », mais, dans ce contexte militaire immédiatement suivi de l’établissement du camp, il peut évoquer la convocation des combattants. La formulation principale retient ce sens contextuel, tandis que le sens lexical courant est conservé en note.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: La désignation française usuelle du peuple rend naturellement l’expression littérale « fils d’Ammon ».
- source_word: וַיַּחֲנוּ
  choice: établirent leur camp
  rationale: Cette expression française actuelle rend clairement le fait de camper, avec la nuance d’installation collective ou militaire portée par חנה.
- source_word: בַּגִּלְעָד
  choice: en Galaad
  rationale: Galaad désigne ici une région; la préposition française « en » convient à cet emploi géographique.
- source_word: וַיֵּאָסְפוּ
  choice: se rassemblèrent
  rationale: La forme verbale exprime le rassemblement collectif des Israélites, ici dans un contexte de mobilisation.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation moderne et naturelle rend sans ambiguïté l’expression hébraïque « fils d’Israël » lorsqu’elle désigne le peuple.
- source_word: בַּמִּצְפָּה
  choice: à Mitspa
  rationale: Pour ce lieu précis où le groupe campe, « à » est la préposition française idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Établirent leur camp » est préféré à « campèrent » pour rendre explicitement l’installation du camp tout en conservant le parallélisme des deux groupes. Le marqueur [a] figure dans le texte principal.
