  text: He judged Israel twenty-three years. Then he died and was buried in Shamir.
translation:
  language: fr
  text: Il jugea Israël pendant vingt-trois ans. Puis il mourut et fut enterré à Shamir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: Il jugea
  rationale: Dans le livre des Juges, le verbe שׁפט désigne l’exercice de la fonction de juge et de dirigeant en Israël. « Jugea » conserve le vocabulaire récurrent du livre sans préciser davantage la nature de cette autorité.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: Le marqueur de l’objet direct אֶת n’est pas traduit; le nom propre désigne ici le peuple d’Israël.
- source_word: עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: pendant vingt-trois ans
  rationale: La durée exacte est exprimée selon l’usage naturel du français moderne; « pendant » rend clairement la portée temporelle du complément.
- source_word: וַיָּמָת
  choice: Puis il mourut
  rationale: Le wayyiqtol fait progresser le récit. « Puis » marque naturellement la succession des événements sans introduire de contraste.
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: La forme nifal est passive. « Fut enterré » préserve ce passif et ne fournit aucun agent absent du texte hébreu.
- source_word: בְּשָׁמִיר
  choice: à Shamir
  rationale: La préposition בְּ est ici locative. Devant un nom de localité, le français emploie naturellement « à »; le toponyme est translittéré.
