  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתֶּם֙ עֲזַבְתֶּ֣ם אוֹתִ֔/י וַ/תַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים לָ/כֵ֥ן לֹֽא אוֹסִ֖יף לְ/הוֹשִׁ֥יעַ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/013.yaml
  text: But you have forsaken me and served other gods[a]; therefore I will no longer save you.
translation:
  language: fr
  text: Mais vous, vous m’avez abandonné et vous avez servi d’autres dieux. C’est pourquoi je ne vous sauverai plus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « délivrer » ou « secourir ». Le verbe hébreu peut désigner la délivrance face à des ennemis aussi bien que le fait de sauver dans un sens plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Mais vous, vous
  rationale: La conjonction et le pronom explicite marquent ici un contraste appuyé avec ce qui précède. La reprise « vous, vous » rend cette emphase naturellement en français.
- source_word: עֲזַבְתֶּם
  choice: m’avez abandonné
  rationale: Le verbe עזב exprime l’abandon et porte ici une forte dimension relationnelle; « abandonné » est actuel, clair et plus naturel que « délaissé ».
- source_word: וַ/תַּעַבְדוּ
  choice: et vous avez servi
  rationale: Avec des dieux pour complément, עבד désigne le service religieux et l’allégeance cultuelle. « Servi » conserve cette étendue de sens sans la réduire au seul acte d’adoration.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Cette expression oppose directement le Dieu d’Israël aux autres divinités; « d’autres dieux » en est le rendu français le plus simple et exact.
- source_word: לָ/כֵן
  choice: C’est pourquoi
  rationale: Le terme introduit la conséquence judiciaire de l’abandon mentionné auparavant. « C’est pourquoi » exprime clairement ce lien causal dans un français naturel.
- source_word: לֹא אוֹסִיף לְ/הוֹשִׁיעַ
  choice: je ne vous sauverai plus
  rationale: Avec la négation, יסף suivi de l’infinitif indique la cessation ou la non-répétition. « Ne… plus » rend idiomatiquement cette idée, tandis que « sauver » préserve l’étendue sémantique de ישע.
theological_decisions:
- issue: Sens de ישע dans le contexte des juges et de l’oppression ennemie
  choice: sauver
  alternative: délivrer; secourir
  rationale: Le contexte immédiat concerne la délivrance face aux oppresseurs, mais le verbe hébreu peut désigner plus largement l’action de sauver. Le texte retient « sauver » afin de préserver cette amplitude biblique, et la note signale les nuances contextuelles possibles sans spiritualiser indûment le passage.
translation_notes:
  register: Français international moderne, digne et accessible. L’emphase du pronom hébreu est conservée par « Mais vous, vous », et la phrase reste directe, conformément au ton de la réprimande divine.
