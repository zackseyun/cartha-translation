  text: וַ/יֹּאמְר֨וּ הָ/עָ֜ם שָׂרֵ֤י גִלְעָד֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מִ֣י הָ/אִ֔ישׁ אֲשֶׁ֣ר יָחֵ֔ל לְ/הִלָּחֵ֖ם בִּ/בְנֵ֣י עַמּ֑וֹן יִֽהְיֶ֣ה לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/018.yaml
  text: And the people[a], the leaders of Gilead, said to one another, “Who is the man who will begin to fight against the sons of Ammon? He shall become head over all the inhabitants of Gilead.”
translation:
  language: fr
  text: 'Le peuple, c’est-à-dire les chefs de Galaad, se dirent les uns aux autres[a] : « Quel est l’homme qui commencera à combattre les fils d’Ammon ? Il deviendra le chef de tous les habitants de Galaad. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un homme à son compagnon ».'
    reason: La note signale la tournure distributive concrète de l’hébreu derrière l’expression française réciproque.
lexical_decisions:
- source_word: הָעָם שָׂרֵי גִלְעָד
  choice: Le peuple, c’est-à-dire les chefs de Galaad
  rationale: 'Les deux groupes nominaux sont juxtaposés sans conjonction. La formulation les comprend en apposition : dans ce contexte, le peuple qui prend la parole est représenté par les chefs de Galaad. Elle conserve ainsi les deux éléments de l’hébreu tout en rendant leur rapport explicite en français.'
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: l’un à l’autre
  rationale: Cette expression distributive signifie littéralement « un homme à son compagnon » et exprime ici une parole échangée au sein du groupe. « L’un à l’autre » est idiomatique et proche de la forme hébraïque.
- source_word: מִי הָאִישׁ
  choice: Quel est l’homme
  rationale: La traduction maintient le nom explicite אִישׁ, « homme », dans ce contexte de désignation d’un chef militaire. « Quel est l’homme qui… ? » exprime naturellement la recherche de celui qui remplira la condition annoncée.
- source_word: יָחֵל לְהִלָּחֵם
  choice: commencera à combattre
  rationale: Le hifil de חלל signifie ici « commencer », suivi de l’infinitif « combattre ». Le futur convient à la recherche prospective d’un meneur.
- source_word: בִּבְנֵי עַמּוֹן
  choice: les fils d’Ammon
  rationale: La traduction conserve l’ethnonyme hébreu sous sa forme littérale et traditionnelle, au lieu de le remplacer par « les Ammonites ».
- source_word: יִהְיֶה לְרֹאשׁ
  choice: Il deviendra le chef
  rationale: רֹאשׁ signifie littéralement « tête » et désigne ici celui qui exerce l’autorité. « Chef » restitue clairement la fonction politique en français, tandis que « deviendra » exprime le résultat promis à celui qui prendra l’initiative du combat.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: de tous les habitants de Galaad
  rationale: Le participe יֹשְׁבֵי désigne ceux qui résident dans le territoire. « Tous les habitants » rend clairement l’étendue entière de l’autorité envisagée.
theological_decisions:
- issue: Maintien du masculin explicite dans le choix du chef militaire
  choice: « Quel est l’homme »
  alternative: « Qui sera celui qui » ou « Quelle personne »
  rationale: Le texte hébreu emploie explicitement אִישׁ dans un contexte de direction militaire. Le conserver respecte la forme du texte sans introduire une généralisation absente de la source.
translation_notes:
  register: Français international moderne, clair et digne. La phrase explicite sobrement l’apposition inhabituelle entre « le peuple » et « les chefs de Galaad », conserve « les fils d’Ammon » et emploie « chef » plutôt que la métaphore peu naturelle « tête ».
