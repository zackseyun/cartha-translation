base_translation:
  language: en
  yaml_path: translation/ot/judges/010/008.yaml
  text: And they shattered and crushed the sons of Israel in that year[a]; for eighteen years they oppressed all the sons of Israel who were beyond the Jordan in the land of the Amorites[b], which is in Gilead.
translation:
  language: fr
  text: Cette année-là, ils brisèrent et écrasèrent les Israélites[a]. Pendant dix-huit ans, ils opprimèrent[b] tous les Israélites qui vivaient au-delà du Jourdain, dans le pays des Amoréens, qui est en Galaad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils maltraitèrent et opprimèrent les Israélites ». L’hébreu emploie deux verbes énergiques, presque synonymes, pour souligner la violence de leurs souffrances.
    reason: lexical_alternative
  - marker: b
    text: Le verbe « opprimèrent » clarifie la construction en français. L’hébreu enchaîne la durée « dix-huit ans » avec la séquence verbale précédente, puis répète « tous les Israélites ».
    reason: source_syntax
lexical_decisions:
- source_word: וַיִּרְעֲצוּ וַיְרֹצְצוּ
  choice: ils brisèrent et écrasèrent
  rationale: Les deux verbes hébreux, énergiques et presque synonymes, sont rendus séparément afin de conserver leur parallélisme intensif et l’image d’un peuple violemment accablé.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation naturelle en français moderne exprime correctement l’idiome hébreu « fils d’Israël » sans suggérer qu’il ne s’agit que des hommes.
- source_word: בַּשָּׁנָה הַהִיא
  choice: Cette année-là
  rationale: La tournure française reproduit clairement le repère temporel hébreu.
- source_word: שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: Pendant dix-huit ans
  rationale: « Pendant » marque naturellement la durée en français et distingue celle-ci du repère initial « cette année-là ».
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: au-delà du Jourdain
  rationale: Cette expression reste proche de l’idiome géographique hébreu sans préciser artificiellement une orientation.
- source_word: בְּאֶרֶץ הָאֱמֹרִי
  choice: dans le pays des Amoréens
  rationale: Le singulier collectif hébreu désigne ici le territoire amoréen; le pluriel est l’expression française habituelle.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: en Galaad
  rationale: La formulation concise rattache naturellement le territoire amoréen à la région de Galaad.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Israélites » est préféré au calque « fils d’Israël »; les deux verbes imagés sont toutefois conservés pour rendre l’intensité de l’hébreu. La seconde phrase explicite le verbe sous-entendu afin d’éviter une construction obscure en français.
