  verdict: revise
  source_fidelity: 'Le sens général est fidèle : trente fils, trente ânons, trente villes, et le nom donné aux villes jusqu’au temps du narrateur. Toutefois, חַוֹּת יָאִיר fonctionne ici comme un toponyme établi (« Havvoth-Yaïr ») plutôt que comme une appellation à traduire directement dans le corps du texte. La relation finale porte sur les villes, d’où « elles se trouvent ».'
  naturalness: La révision conserve un français narratif moderne et fluide. « Possédaient trente villes » rend clairement l’idée de possession sans l’ambiguïté de « ils avaient », et « jusqu’à ce jour » est naturel dans ce registre biblique.
  terminology: « Ânons » rend correctement עֲיָרִים, de jeunes ânes. « Havvoth-Yaïr » conserve le nom propre hébreu ; son sens probable est donné en note sans prétendre résoudre toutes les nuances lexicales de חַוֹּת. « Galaad » est la forme française usuelle.
