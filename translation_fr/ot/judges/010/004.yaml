base_translation:
  language: en
  yaml_path: translation/ot/judges/010/004.yaml
  text: He had thirty sons, riding on thirty donkeys, and they had thirty towns. To this day they are called Havvoth-jair, which are in the land of Gilead.
translation:
  language: fr
  text: Il avait trente fils, qui montaient trente ânons et possédaient trente villes. On les appelle jusqu’à ce jour Havvoth-Yaïr[a] ; elles se trouvent dans le pays de Galaad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Hawwoth-Yaïr, probablement « les villages de Yaïr ».'
    reason: Conserve dans le texte le toponyme hébreu tout en indiquant son sens probable.
lexical_decisions:
- source_word: עֲיָרִים
  choice: ânons
  rationale: Le terme désigne de jeunes ânes. « Ânons » conserve le jeu sonore hébreu avec עָרִים (« villes »), autant que le français le permet, et évoque ici des montures associées au rang social.
- source_word: חַוֺּת יָאִיר
  choice: les bourgs de Yaïr
  rationale: חַוּוֹת désigne des campements ou petites agglomérations rurales. « Bourgs » est naturel et distingue l’expression traditionnelle des « villes » mentionnées juste avant.
- source_word: הַגִּלְעָד
  choice: Galaad
  rationale: Forme française biblique établie du toponyme Gilead.
theological_decisions:
- issue: Référent du pluriel dans לָהֶם יִקְרְאוּ
  choice: « on les appelle », avec les villes/bourgs comme référent
  alternative: « ils les appellent » ou « on appelle celles-ci »
  rationale: Le pluriel renvoie naturellement aux trente villes. La tournure impersonnelle française rend l’usage du nom sans introduire un sujet absent de l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve la répétition de « trente » et le parallélisme entre les fils, les montures et les villes. « Jusqu’à aujourd’hui » garde la perspective temporelle du narrateur.
