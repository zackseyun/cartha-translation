source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶל יְהוָה֙ חָטָ֔אנוּ עֲשֵׂה אַתָּ֣ה לָ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ אַ֛ךְ הַצִּילֵ֥/נוּ נָ֖א הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/015.yaml
  text: And the sons of Israel said to Yahweh[a], “We have sinned. Do to us according to all that is good in your eyes[c][b]. Only please deliver us this day.”
translation:
  language: fr
  text: 'Les fils d’Israël dirent à Yahweh : « Nous avons péché. Traite-nous selon tout ce qui est bon à tes yeux. Seulement, délivre-nous, nous t’en prions, aujourd’hui. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: dirent
  rationale: Le wayyiqtol fait progresser le récit; le passé simple convient au registre narratif français.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression hébraïque masculine et ethnique, tout en restant intelligible en français biblique moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: חָטָאנוּ
  choice: Nous avons péché
  rationale: Le passé composé exprime naturellement en français la confession d’un acte accompli dont la portée demeure présente.
- source_word: עֲשֵׂה אַתָּה לָנוּ
  choice: Fais-nous
  rationale: La tournure directe garde la force de l’impératif et la soumission sans réserve des Israélites.
- source_word: כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: tout ce qui est bon à tes yeux
  rationale: Cette formulation conserve l’image hébraïque des yeux ainsi que l’idée englobante portée par כְּכָל, dans un français naturel.
- source_word: אַךְ
  choice: Seulement
  rationale: L’adverbe introduit la seule demande formulée après l’acceptation de ce que Yahweh jugera bon de faire.
- source_word: הַצִּילֵנוּ
  choice: délivre-nous
  rationale: Le verbe restitue le sens causatif de נצל, sauver ou arracher à un danger, avec un registre approprié au contexte biblique.
- source_word: נָא
  choice: s’il te plaît
  rationale: Cette expression marque explicitement la supplication de façon naturelle en français actuel.
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: « Aujourd’hui » rend idiomatiquement l’immédiateté de l’expression hébraïque sans archaïsme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel et évite de le remplacer par un titre.
- issue: Représentation de בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: Le choix maintient la forme masculine et l’expression généalogique de l’hébreu sans exclure artificiellement la valeur collective du groupe.
- issue: Portée de la soumission suivie de la demande introduite par אַךְ
  choice: « Fais-nous tout ce qui est bon à tes yeux. Seulement, délivre-nous… »
  alternative: « Traite-nous comme bon te semblera, mais sauve-nous… »
  rationale: La formulation préserve la tension du texte entre l’acceptation du jugement divin et l’appel pressant à la délivrance, sans chercher à les harmoniser.
translation_notes:
  register: Français international moderne, digne et direct. Le passé simple est maintenu pour la narration, tandis que le discours emploie des formes courantes. L’image « bon à tes yeux » est conservée parce qu’elle reste claire et reflète étroitement l’hébreu.
