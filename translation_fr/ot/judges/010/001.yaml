source:
  edition: WLC
  text: וַ/יָּקָם֩ אַחֲרֵ֨י אֲבִימֶ֜לֶךְ לְ/הוֹשִׁ֣יעַ אֶת יִשְׂרָאֵ֗ל תּוֹלָ֧ע בֶּן פּוּאָ֛ה בֶּן דּוֹד֖וֹ אִ֣ישׁ יִשָּׂשכָ֑ר וְ/הֽוּא יֹשֵׁ֥ב בְּ/שָׁמִ֖יר בְּ/הַ֥ר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/001.yaml
  text: After Abimelech[a], Tola son of Puah, son of Dodo, a man of Issachar, arose to save Israel; and he lived in Shamir in the hill country of Ephraim.
translation:
  language: fr
  text: Après Abimélek, Tola, fils de Poua, fils de Dodo[a], un homme d’Issacar, se leva pour sauver Israël. Il habitait à Shamir, dans la région montagneuse d’Éphraïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fils de son oncle ». L’hébreu בֶּן־דּוֹדוֹ peut être compris avec Dodo comme nom propre, ou comme une expression désignant son oncle.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Dans ce contexte narratif, קום signale l’apparition d’un nouveau chef. « Se leva » conserve cette image sans supposer une nomination officielle.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: Après Abimélek
  rationale: Rend directement la succession temporelle exprimée par l’hébreu.
- source_word: לְהוֹשִׁיעַ אֶת־יִשְׂרָאֵל
  choice: pour sauver Israël
  rationale: Le hiphil de ישׁע exprime l’action de sauver ou de délivrer. « Sauver » reste naturel et ne limite pas nécessairement l’action à une délivrance militaire.
- source_word: תּוֹלָע בֶּן־פּוּאָה
  choice: Tola, fils de Poua
  rationale: Les noms propres sont translittérés et la relation généalogique est rendue explicitement.
- source_word: בֶּן־דּוֹדוֹ
  choice: fils de Dodo
  rationale: La vocalisation massorétique permet de comprendre Dodo comme un nom propre dans cette généalogie. L’autre lecture possible est conservée en note.
- source_word: אִישׁ יִשָּׂשכָר
  choice: un homme d’Issacar
  rationale: Cette formulation proche de l’hébreu indique clairement l’appartenance tribale.
- source_word: וְהוּא יֹשֵׁב
  choice: Il habitait
  rationale: Le participe décrit le lieu de résidence de Tola; l’imparfait est idiomatique en français narratif.
- source_word: בְּשָׁמִיר
  choice: à Shamir
  rationale: Le nom de lieu est translittéré; « à » est la préposition française naturelle devant une localité.
- source_word: בְּהַר אֶפְרָיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: הַר désigne ici la zone de relief associée à Éphraïm plutôt qu’une montagne isolée.
theological_decisions: []
