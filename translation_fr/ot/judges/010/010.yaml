  text: וַֽ/יִּזְעֲקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל יְהוָ֖ה לֵ/אמֹ֑ר חָטָ֣אנוּ לָ֔/ךְ וְ/כִ֤י עָזַ֨בְנוּ֙ אֶת אֱלֹהֵ֔י/נוּ וַֽ/נַּעֲבֹ֖ד אֶת הַ/בְּעָלִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/010.yaml
  text: Then the sons of Israel cried out to the LORD, saying, “We have sinned against you, because we have forsaken our God and have served the Baals.”
translation:
  language: fr
  text: 'Alors les Israélites crièrent à l’Éternel : « Nous avons péché contre toi, car nous avons abandonné notre Dieu et servi les Baals. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Expression française naturelle et exacte pour désigner collectivement les « fils d’Israël ».
- source_word: וַיִּזְעֲקוּ
  choice: crièrent vers
  rationale: Conserve l’idée d’un appel pressant adressé à Dieu, tout en restant idiomatique en français.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et reconnaissable du nom divin YHWH, distinct du titre « Seigneur ».
- source_word: וְכִי
  choice: car
  rationale: Introduit ici la raison ou l’explication de la confession précédente sans alourdir la phrase.
- source_word: הַבְּעָלִים
  choice: les Baals
  rationale: Le pluriel hébreu désigne les diverses manifestations ou divinités locales portant le nom de Baal; le pluriel est donc conservé.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: l’Éternel
  alternative: YHWH / le SEIGNEUR
  rationale: « L’Éternel » permet au lecteur français d’identifier un nom divin propre plutôt qu’un simple titre, sans imposer une vocalisation reconstruite.
- issue: Lien entre le péché et l’abandon de Dieu
  choice: car nous avons abandonné notre Dieu
  alternative: et même nous avons abandonné notre Dieu
  rationale: Dans ce contexte confessionnel, וְכִי explique en quoi consiste le péché; « car » préserve ce lien causal sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation évite le calque « fils d’Israël » au profit de « Israélites », et garde le pluriel théologiquement significatif « les Baals ».
