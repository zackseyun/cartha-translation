    issue: « jusqu’à l’extrémité des hommes armés » est maladroit
    rationale: En français, « extrémité » appliqué directement à des personnes ou à un groupe sonne peu naturel. « À la périphérie des hommes armés » garde l’ambiguïté spatiale de קְצֵה sans ajouter l’idée d’un poste ou d’une formation déterminée.
  - severity: low
    issue: « son jeune serviteur » est une combinaison peu naturelle
    rationale: נער peut désigner un jeune homme, un serviteur ou un attendant. Dans ce contexte, « son serviteur » est plus idiomatique ; la note préserve explicitement les autres possibilités.
