  text: וְ/שָֽׁמַעְתָּ֙ מַה יְדַבֵּ֔רוּ וְ/אַחַר֙ תֶּחֱזַ֣קְנָה יָדֶ֔י/ךָ וְ/יָרַדְתָּ֖ בַּֽ/מַּחֲנֶ֑ה וַ/יֵּ֤רֶד הוּא֙ וּ/פֻרָ֣ה נַעֲר֔/וֹ אֶל קְצֵ֥ה הַ/חֲמֻשִׁ֖ים אֲשֶׁ֥ר בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/011.yaml
  text: and you will hear what they are saying[a], and afterward your hands will be strengthened[b], and you will go down into the camp.” So he went down with Purah his servant to the edge of the armed men who were in the camp.
translation:
  language: fr
  text: « Tu entendras ce qu’ils diront, et après cela tes mains seront fortifiées[a]. Alors tu descendras dans le camp. » Gédéon descendit donc avec Poura, son serviteur[b], jusqu’à la périphérie des hommes armés qui se trouvaient dans le camp[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tes mains deviendront fortes » ; cette expression évoque le courage et la force d’agir.'
    reason: idiom_clarification
  - marker: b
    text: 'Ou : « son jeune homme » ou « son assistant ». Le terme hébreu peut désigner un jeune homme au service de quelqu’un.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « jusqu’aux abords des troupes équipées pour le combat ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ מַה יְדַבֵּרוּ
  choice: Tu entendras ce qu’ils diront
  rationale: Le parfait avec waw prend ici une valeur future dans le discours direct, tandis que l’imparfait de דבר désigne les paroles que Gédéon va surprendre.
- source_word: וְאַחַר
  choice: et après cela
  rationale: Cette expression temporelle marque clairement la succession entre l’écoute et l’affermissement de Gédéon.
- source_word: תֶּחֱזַקְנָה יָדֶיךָ
  choice: tes mains seront fortifiées
  rationale: La formulation conserve l’image hébraïque des mains fortifiées, qui évoque le courage et la capacité d’agir, sans la réduire à une simple paraphrase.
- source_word: וְיָרַדְתָּ בַּמַּחֲנֶה
  choice: Alors tu descendras dans le camp
  rationale: ירד signifie concrètement « descendre »; la préposition ב convient ici à l’entrée ou à l’avancée dans le camp. « Alors » rend naturellement la progression du discours.
- source_word: וַיֵּרֶד הוּא
  choice: Gédéon descendit donc
  rationale: Le wayyiqtol fait progresser le récit. Le pronom hébreu renvoie à Gédéon; reprendre son nom en français évite une ambiguïté avec Poura.
- source_word: נַעֲרוֹ
  choice: son jeune serviteur
  rationale: נַעַר peut désigner un jeune homme ou un serviteur attaché à quelqu’un. « Jeune serviteur » conserve à la fois la nuance d’âge et la fonction contextuelle, sans imposer un statut plus précis.
- source_word: אֶל קְצֵה
  choice: jusqu’à l’extrémité de
  rationale: קצה désigne l’extrémité ou la limite. Cette traduction laisse ouverte la question de savoir s’il s’agit du bord du groupe ou de sa position périphérique.
- source_word: הַחֲמֻשִׁים
  choice: les hommes armés
  rationale: Le terme désigne ici des hommes équipés pour le combat; « hommes armés » est précis, naturel et adapté au contexte militaire.
- source_word: אֲשֶׁר בַּמַּחֲנֶה
  choice: qui se trouvaient dans le camp
  rationale: La relative identifie les hommes armés présents ou postés dans le camp.
theological_decisions:
- issue: Image de l’affermissement des mains
  choice: Conserver « tes mains seront fortifiées »
  alternative: « tu reprendras courage »
  rationale: L’image corporelle du texte hébreu porte à la fois l’idée de courage et celle de capacité à agir. La conserver évite de réduire sa portée.
- issue: Valeur de la descente dans le camp
  choice: « tu descendras dans le camp »
  alternative: « tu descendras contre le camp »
  rationale: La construction peut être comprise dans le cadre d’une avancée contre l’ennemi, mais le sens spatial demeure réel; la traduction retenue préserve ce mouvement sans anticiper l’attaque.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant les images hébraïques significatives. Le nom « Gédéon » est explicité dans la seconde phrase pour assurer la clarté référentielle.
