  yaml_path: translation/ot/judges/007/006.yaml
  text: And the number of those lapping with their hand to their mouth was three hundred men[a], but all the rest of the people knelt on their knees to drink water.
translation:
  language: fr
  text: Le nombre de ceux qui lapèrent l’eau en la portant de la main à la bouche fut de trois cents hommes[a] ; tout le reste du peuple se mit à genoux pour boire de l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui lapèrent de leur main vers leur bouche ». L’hébreu souligne qu’ils portaient l’eau à leur bouche avec la main, au lieu de s’agenouiller pour boire directement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: Le nombre de
  rationale: Rend directement le nom quantitatif et introduit naturellement le décompte du groupe.
- source_word: הַמֲלַקְקִים
  choice: ceux qui lapèrent l’eau
  rationale: Le verbe « laper » conserve l’image concrète de לקק. Le passé simple convient au registre narratif biblique français sans être archaïque.
- source_word: בְּיָדָם אֶל־פִּיהֶם
  choice: en la portant de la main à la bouche
  rationale: Cette formulation naturelle explicite le mouvement indiqué par אֶל et préserve le contraste avec ceux qui s’agenouillent pour boire directement.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: trois cents hommes
  rationale: « Hommes » convient au contexte militaire et rend normalement אִישׁ après le nombre.
- source_word: וְכֹל יֶתֶר הָעָם
  choice: tout le reste du peuple
  rationale: Le point-virgule fait ressortir le contraste contextuel sans devoir surtraduire ו par « mais ».
- source_word: כָּרְעוּ עַל בִּרְכֵיהֶם
  choice: se mit à genoux
  rationale: Expression française idiomatique qui rend à la fois le geste de כרע et la mention des genoux.
- source_word: לִשְׁתּוֹת מָיִם
  choice: pour boire de l’eau
  rationale: Rend la valeur finale de l’infinitif et conserve la mention explicite de l’eau.
