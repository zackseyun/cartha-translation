  variant: modern international French
source:
  edition: WLC
  text: וּ/מִדְיָ֨ן וַ/עֲמָלֵ֤ק וְ/כָל בְּנֵי קֶ֨דֶם֙ נֹפְלִ֣ים בָּ/עֵ֔מֶק כָּ/אַרְבֶּ֖ה לָ/רֹ֑ב וְ/לִ/גְמַלֵּי/הֶם֙ אֵ֣ין מִסְפָּ֔ר כַּ/ח֛וֹל שֶׁ/עַל שְׂפַ֥ת הַ/יָּ֖ם לָ/רֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/012.yaml
  text: Midian and Amalek and all the people of the East were lying in the valley as numerous as locusts[a], and their camels were without number[b], as the sand on the seashore in abundance.
translation:
  language: fr
  text: Madian, Amalec et tous les peuples de l’Orient[a] étaient étendus dans la vallée[b], aussi nombreux que des criquets. Leurs chameaux étaient innombrables, aussi nombreux que les grains de sable au bord de la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les fils de l’Orient ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu signifie littéralement « tombant » ou « tombés » ; ici, il décrit vraisemblablement une armée étendue, installée ou déployée dans la vallée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדְיָן וַעֲמָלֵק וְכָל בְּנֵי קֶדֶם
  choice: Madian, Amalec et tous les peuples de l’Orient
  rationale: Le français conserve l’enchaînement des trois groupes. « Peuples de l’Orient » rend naturellement l’expression ethnogéographique בְּנֵי קֶדֶם, littéralement « fils de l’Orient », sans lui donner un sens filial absent du contexte.
- source_word: נֹפְלִים
  choice: étaient étendus
  rationale: Le participe de נפל évoque littéralement le fait d’être tombé ou étendu. Dans ce contexte militaire, il décrit les troupes installées et déployées dans la vallée. « Étaient étendus » conserve l’image hébraïque, tandis qu’une note explicite l’emploi contextuel.
- source_word: בָּעֵמֶק
  choice: dans la vallée
  rationale: Traduction directe et usuelle de עֵמֶק.
- source_word: כָּאַרְבֶּה לָרֹב
  choice: aussi nombreux que des criquets
  rationale: La formulation française exprime clairement la comparaison portant sur l’immense nombre des combattants, tout en conservant l’image des criquets.
- source_word: וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: Leurs chameaux étaient innombrables
  rationale: « Innombrables » rend idiomatiquement אֵין מִסְפָּר, littéralement « il n’y a pas de nombre », avec sa force hyperbolique.
- source_word: כַּחוֹל שֶׁעַל שְׂפַת הַיָּם לָרֹב
  choice: aussi nombreux que les grains de sable au bord de la mer
  rationale: L’ajout idiomatique de « grains » rend naturelle en français la comparaison numérique avec le sable. « Aussi nombreux » restitue la valeur de לָרֹב et l’insistance finale sur la multitude.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les noms propres suivent les formes françaises traditionnelles « Madian » et « Amalec ». La répétition hébraïque liée à l’immensité du nombre est conservée par « nombreux » puis « innombrables, aussi nombreux », sans ajouter d’explication théologique.
