  text: וְ/אִם יָרֵ֥א אַתָּ֖ה לָ/רֶ֑דֶת רֵ֥ד אַתָּ֛ה וּ/פֻרָ֥ה נַעַרְ/ךָ֖ אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/010.yaml
  text: But if you are afraid to go down[a], go down to the camp with Purah your servant.
translation:
  language: fr
  text: Mais si tu as peur de descendre, descends vers le camp avec Poura, ton serviteur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton jeune homme » ou « ton assistant ». Selon le contexte, le mot hébreu naʿar peut désigner un jeune homme, un serviteur ou un assistant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit une condition qui nuance l’ordre précédent; « Mais si » rend naturellement ce léger contraste.
- source_word: יָרֵא אַתָּה
  choice: tu as peur
  rationale: Expression idiomatique en français moderne pour décrire l’état de Gédéon.
- source_word: לָרֶדֶת / רֵד
  choice: descendre / descends
  rationale: Conserve la répétition du même verbe hébreu et le relief rhétorique de l’infinitif suivi de l’impératif.
- source_word: וּפֻרָה
  choice: avec Poura
  rationale: La conjonction marque ici l’accompagnement; « avec » exprime clairement la relation syntaxique en français.
- source_word: נַעַרְךָ
  choice: ton serviteur
  rationale: Dans ce contexte militaire et personnel, נַעַר désigne vraisemblablement un subordonné ou assistant; « serviteur » est naturel, tandis que l’ambiguïté lexicale est signalée en note.
- source_word: אֶל הַמַּחֲנֶה
  choice: vers le camp
  rationale: אֶל indique le mouvement en direction du camp sans imposer explicitement l’idée d’y pénétrer.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au discours direct adressé à Gédéon. La répétition « descendre, descends » reproduit volontairement celle de l’hébreu.
