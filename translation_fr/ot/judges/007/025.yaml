source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֡וּ שְׁנֵֽי שָׂרֵ֨י מִדְיָ֜ן אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֗ב וַ/יַּהַרְג֨וּ אֶת עוֹרֵ֤ב בְּ/צוּר עוֹרֵב֙ וְ/אֶת זְאֵב֙ הָרְג֣וּ בְ/יֶֽקֶב זְאֵ֔ב וַֽ/יִּרְדְּפ֖וּ אֶל מִדְיָ֑ן וְ/רֹאשׁ עֹרֵ֣ב וּ/זְאֵ֔ב הֵבִ֨יאוּ֙ אֶל גִּדְע֔וֹן מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/025.yaml
  text: And they captured the two princes of Midian[a], Oreb and Zeeb. They killed Oreb at the rock of Oreb, and they killed Zeeb at the winepress of Zeeb. Then they pursued Midian[b], and they brought the heads of Oreb and Zeeb to Gideon from across the Jordan.
translation:
  language: fr
  text: Ils capturèrent les deux chefs de Madian[a], Oreb et Zeeb. Ils tuèrent Oreb au rocher d’Oreb et Zeeb au pressoir de Zeeb. Puis ils poursuivirent Madian et apportèrent les têtes d’Oreb et de Zeeb à Gédéon, depuis l’autre côté du Jourdain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms Oreb et Zeeb sont apparentés aux mots hébreux signifiant respectivement « corbeau » et « loup ». Ils sont toutefois rendus ici comme des noms de personnes.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « d’au-delà du Jourdain ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: chefs
  rationale: Le nom שַׂר désigne des dirigeants de haut rang, ici dans un cadre politico-militaire. « Chefs » est naturel en français moderne et évite les connotations monarchiques plus étroites de « princes ».
- source_word: וַיִּלְכְּדוּ
  choice: capturèrent
  rationale: לכד exprime ici la capture de dirigeants ennemis dans un contexte militaire.
- source_word: עֹרֵב / זְאֵב
  choice: Oreb / Zeeb
  rationale: Ces termes sont ici des noms de personnes; ils sont donc translittérés, bien qu’ils correspondent lexicalement à « corbeau » et « loup ».
- source_word: בְּצוּר עוֹרֵב
  choice: au rocher d’Oreb
  rationale: צוּר signifie « rocher » ou « escarpement »; la formulation conserve le lien étiologique entre le lieu et le nom d’Oreb.
- source_word: בְיֶקֶב זְאֵב
  choice: au pressoir de Zeeb
  rationale: יֶקֶב désigne un pressoir ou une cuve à vin. « Au pressoir » convient à un lieu nommé sans préciser indûment si la mise à mort eut lieu dedans ou à proximité.
- source_word: וַיִּרְדְּפוּ אֶל מִדְיָן
  choice: Puis ils poursuivirent Madian
  rationale: La construction décrit la poursuite qui se prolonge contre Madian; « puis » rend naturellement la progression narrative du waw consécutif.
- source_word: וְרֹאשׁ עֹרֵב וּזְאֵב
  choice: les têtes d’Oreb et de Zeeb
  rationale: Bien que רֹאשׁ soit morphologiquement au singulier, les deux noms coordonnés appellent un sens distributif, rendu naturellement au pluriel en français.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: depuis l’autre côté du Jourdain
  rationale: La locution signifie « depuis au-delà/de l’autre côté du Jourdain » et conserve une ambiguïté de perspective géographique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique écrit. « Chefs » communique clairement le rang politico-militaire sans surinterprétation monarchique. La dernière expression maintient la perspective spatiale du texte hébreu sans déterminer quel côté du Jourdain est visé.
