source:
  edition: WLC
  text: וַֽ֠/יִּתְקְעוּ שְׁלֹ֨שֶׁת הָ/רָאשִׁ֥ים בַּ/שּֽׁוֹפָרוֹת֮ וַ/יִּשְׁבְּר֣וּ הַ/כַּדִּים֒ וַ/יַּחֲזִ֤יקוּ בְ/יַד שְׂמאוֹלָ/ם֙ בַּ/לַּפִּדִ֔ים וּ/בְ/יַ֨ד יְמִינָ֔/ם הַ/שּׁוֹפָר֖וֹת לִ/תְק֑וֹעַ וַֽ/יִּקְרְא֔וּ חֶ֥רֶב לַֽ/יהוָ֖ה וּ/לְ/גִדְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/020.yaml
  text: Then the three companies blew the trumpets and shattered the jars. They held the torches in their left hands and the trumpets in their right hands to blow[a], and they cried out, “A sword for Yahweh and for Gideon!”
translation:
  language: fr
  text: 'Alors les trois groupes sonnèrent de la trompe et brisèrent les cruches. Ils tenaient les torches dans leur main gauche et les trompes dans leur main droite, afin d’en jouer. Ils crièrent : « Une épée pour Yahweh et pour Gédéon ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’épée de Yahweh et de Gédéon ! »'
    reason: La construction hébraïque est elliptique et peut aussi se comprendre comme désignant l’épée appartenant à Yahweh et à Gédéon.
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָרָאשִׁים
  choice: les trois groupes
  rationale: Dans ce récit militaire, רָאשִׁים désigne les trois unités entre lesquelles Gédéon a réparti ses hommes (7.16), et non des « têtes » au sens littéral. « Groupes » est naturel et clair en français courant.
- source_word: שׁוֹפָרוֹת
  choice: trompes
  rationale: שׁוֹפָר désigne un instrument à vent, originellement une corne, utilisé ici pour donner un signal. « Trompes » évite d'évoquer la trompette moderne tout en traduisant l'instrument plutôt qu'en le translittérant.
- source_word: הַכַּדִּים
  choice: les cruches
  rationale: כַּד désigne un récipient de terre pouvant être brisé. « Cruches » est concret, naturel et cohérent avec le contexte.
- source_word: וַיַּחֲזִיקוּ
  choice: Ils tenaient
  rationale: Le hiphil de חזק décrit ici le fait de tenir les objets en main. « Tenaient » rend l'action sans ajouter une force que le contexte n'exige pas.
- source_word: בְיַד שְׂמאוֹלָם ... וּבְיַד יְמִינָם
  choice: de la main gauche ... de la main droite
  rationale: 'L''hébreu emploie le singulier distributif : chaque homme tient une torche d''une main et une trompe de l''autre. Le singulier français conserve naturellement cette distribution.'
- source_word: לַפִּדִים
  choice: les torches
  rationale: לַפִּיד désigne un objet produisant une flamme. « Torches » est le terme moderne le plus clair dans cette scène.
- source_word: לִתְקֹעַ
  choice: dont ils sonnaient
  rationale: L'infinitif indique ici l'usage des trompes. Cette formulation française exprime clairement qu'ils les tenaient de la main droite tout en en sonnant, sans lourdeur.
- source_word: וַיִּקְרְאוּ
  choice: Ils crièrent
  rationale: קרא introduit ici un cri de guerre collectif et sonore. « Crièrent » restitue sa vigueur.
- source_word: חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: Une épée pour Yahweh et pour Gédéon !
  rationale: La formule hébraïque est nominale, elliptique et abrupte. « Une épée pour » conserve directement la préposition לְ et la force du cri sans fournir le verbe absent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle « Yahweh », plutôt que remplacé par un titre.
theological_decisions:
- issue: Interprétation du cri חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: Une épée pour Yahweh et pour Gédéon !
  alternative: L’épée de Yahweh et de Gédéon !
  rationale: L'hébreu est une phrase nominale comprimée et permet plusieurs explicitations. Le texte principal préserve la préposition לְ (« pour, à ») et le caractère abrupt du cri de guerre. La lecture traditionnelle avec « de » demeure plausible et figure donc en note.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple porte les actions ponctuelles; l'imparfait décrit la disposition des objets dans les mains. « Trompes » distingue ces instruments de signalisation des trompettes modernes. Le marqueur [a] est placé immédiatement après le cri auquel se rapporte la variante.
