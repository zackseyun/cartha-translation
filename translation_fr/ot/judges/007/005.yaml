  text: וַ/יּ֥וֹרֶד אֶת הָ/עָ֖ם אֶל הַ/מָּ֑יִם וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן כֹּ֣ל אֲשֶׁר יָלֹק֩ בִּ/לְשׁוֹנ֨/וֹ מִן הַ/מַּ֜יִם כַּ/אֲשֶׁ֧ר יָלֹ֣ק הַ/כֶּ֗לֶב תַּצִּ֤יג אוֹת/וֹ֙ לְ/בָ֔ד וְ/כֹ֛ל אֲשֶׁר יִכְרַ֥ע עַל בִּרְכָּ֖י/ו לִ/שְׁתּֽוֹת־־ס־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/005.yaml
  text: So he brought the people down to the water[a], and Yahweh said to Gideon, “Everyone who laps the water with his tongue, as a dog laps, you shall set apart by himself; likewise everyone who kneels on his knees to drink.”
translation:
  language: fr
  text: 'Il fit descendre le peuple vers l’eau, et Yahweh dit à Gédéon : « Tous ceux qui laperont l’eau avec leur langue, comme un chien lape, tu les mettras à part ; tu feras de même pour tous ceux qui se mettront à genoux pour boire. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹרֶד
  choice: Il fit donc descendre
  rationale: Le hifil de ירד est causatif. « Fit descendre » conserve explicitement cette valeur tout en restant naturel en français.
- source_word: הָעָם
  choice: le peuple
  rationale: עם désigne collectivement le peuple ou les gens. Bien que le contexte soit militaire, le terme hébreu reste général.
- source_word: אֶל הַמָּיִם
  choice: jusqu’à l’eau
  rationale: La préposition אֶל marque le mouvement vers l’eau; « jusqu’à l’eau » exprime naturellement en français l’arrivée au point d’eau.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כֹּל אֲשֶׁר יָלֹק בִּלְשׁוֹנוֹ מִן הַמַּיִם
  choice: Tous ceux qui laperont l’eau avec leur langue
  rationale: « Laper » restitue l’image concrète du verbe לקק. Le pluriel français inclusif et distributif évite la lourdeur de répétitions au singulier.
- source_word: כַּאֲשֶׁר יָלֹק הַכֶּלֶב
  choice: comme le fait un chien
  rationale: Cette formulation évite de répéter « laper » tout en conservant la comparaison explicite; l’article indéfini exprime naturellement la valeur générique.
- source_word: תַּצִּיג אוֹתוֹ לְבָד
  choice: tu les mettras à part
  rationale: Le hifil de יצג indique l’action de placer ou de faire tenir séparément. « Mettre à part » rend clairement le tri demandé, sans lui donner nécessairement une portée cultuelle.
- source_word: וְכֹל אֲשֶׁר יִכְרַע עַל בִּרְכָּיו לִשְׁתּוֹת
  choice: tu feras de même pour tous ceux qui se mettront à genoux pour boire
  rationale: La seconde proposition nomme l’autre catégorie, tandis que l’action de la placer séparément est comprise par parallélisme. « Se mettre à genoux » rend כרע על ברכיו de façon idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: « Yahweh » rend directement le tétragramme comme nom propre et n’ajoute aucune interprétation doctrinale.
- issue: Action implicite concernant le second groupe
  choice: tu feras de même
  alternative: simple coordination sans répétition de l’ordre
  rationale: L’hébreu laisse l’action verbale sous-entendue dans la seconde proposition. La formulation française explicite seulement le parallélisme grammatical nécessaire à la compréhension, sans préciser le sort ultérieur de l’un ou l’autre groupe.
translation_notes:
  register: Français international moderne, clair et digne. Le futur de commandement conserve le ton direct de l’instruction divine. « Laper » et « se mettre à genoux » maintiennent le contraste visuel du texte source.
