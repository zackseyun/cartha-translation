  to: 'Alors le SEIGNEUR dit à Gédéon : « Le peuple est encore trop nombreux. Fais-le descendre vers l’eau, et là je le mettrai à l’épreuve pour toi. Il arrivera que celui dont je te dirai : “Celui-ci ira avec toi”, ira avec toi ; mais tous ceux dont je te dirai : “Celui-ci n’ira pas avec toi”, n’iront pas. »'
