  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן עוֹד֮ הָ/עָ֣ם רָב֒ הוֹרֵ֤ד אוֹתָ/ם֙ אֶל הַ/מַּ֔יִם וְ/אֶצְרְפֶ֥/נּוּ לְ/ךָ֖ שָׁ֑ם וְ/הָיָ֡ה אֲשֶׁר֩ אֹמַ֨ר אֵלֶ֜י/ךָ זֶ֣ה יֵלֵ֣ךְ אִתָּ֗/ךְ ה֚וּא יֵלֵ֣ךְ אִתָּ֔/ךְ וְ/כֹ֨ל אֲשֶׁר אֹמַ֜ר אֵלֶ֗י/ךָ זֶ֚ה לֹא יֵלֵ֣ךְ עִמָּ֔/ךְ ה֖וּא לֹ֥א יֵלֵֽךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/004.yaml
  text: 'Then the LORD said to Gideon, “The people are still too many. Bring them down to the water, and there I will test them for you. And this is what will happen: anyone of whom I say to you, ‘This one shall go with you,’ he shall go with you; but anyone of whom I say to you, ‘This one shall not go with you,’ he shall not go.”'
translation:
  language: fr
  text: 'Alors le SEIGNEUR dit à Gédéon : « Le peuple est encore trop nombreux. Fais-le descendre vers l’eau, et là je le mettrai à l’épreuve pour toi. Il arrivera que celui dont je te dirai : “Celui-ci ira avec toi”, ira avec toi ; mais tous ceux dont je te dirai : “Celui-ci n’ira pas avec toi”, n’iront pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le nom divin selon la convention française courante en petites capitales, sans importer une vocalisation incertaine dans le corps du texte.
- source_word: הוֹרֵד אוֹתָם אֶל־הַמַּיִם
  choice: Fais-le descendre au bord de l’eau
  rationale: Le pronom collectif renvoie naturellement au peuple en français ; « au bord de l’eau » exprime ici la destination sans suggérer nécessairement une immersion.
- source_word: וְאֶצְרְפֶנּוּ
  choice: je le mettrai à l’épreuve
  rationale: Le verbe צרף évoque l’action d’éprouver ou d’affiner ; dans ce contexte de sélection, « mettre à l’épreuve » est naturel et conserve l’image implicite du tri.
- source_word: לְךָ
  choice: pour toi
  rationale: Conserve explicitement le complément hébreu et l’idée que Dieu effectuera la sélection au bénéfice de Gédéon.
- source_word: זֶה יֵלֵךְ אִתָּךְ
  choice: Que celui-ci aille avec toi
  rationale: Le subjonctif français rend la parole directive de Dieu tout en restant proche de la construction hébraïque.
theological_decisions:
- issue: Représentation du tétragramme
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: Suit une convention biblique française largement intelligible et non confessionnelle, tout en distinguant le nom divin d’un simple titre.
- issue: Agent de la sélection
  choice: Dieu met le peuple à l’épreuve et indique directement à Gédéon qui doit l’accompagner
  alternative: Gédéon décide lui-même en observant les hommes
  rationale: La formulation maintient l’initiative divine explicite du texte hébreu sans anticiper les modalités décrites aux versets suivants.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La répétition « ira avec toi / n’ira pas » est conservée pour respecter l’insistance et la structure antithétique de l’hébreu.
