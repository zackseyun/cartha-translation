source:
  edition: WLC
  text: וַ/יַּֽעַמְדוּ֙ אִ֣ישׁ תַּחְתָּ֔י/ו סָבִ֖יב לַֽ/מַּחֲנֶ֑ה וַ/יָּ֧רָץ כָּל הַֽ/מַּחֲנֶ֛ה וַ/יָּרִ֖יעוּ ו/יניסו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/021.yaml
  text: And each man stood in his place around the camp[a], and the whole camp ran, and they shouted and fled.
translation:
  language: fr
  text: Chacun resta à son poste autour du camp. Alors tout le camp se mit à courir; ils poussèrent des cris[a] et prirent la fuite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils poussèrent un cri de guerre et prirent la fuite ». Le verbe peut désigner un grand cri lancé au combat ou sous l’effet de la panique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: resta
  rationale: Le verbe עמד exprime ici le fait de demeurer debout ou de tenir sa position; « resta » s’accorde naturellement avec « à son poste » dans ce contexte.
- source_word: אִישׁ תַּחְתָּיו
  choice: chacun à son poste
  rationale: L’expression idiomatique signifie que chaque homme demeure à sa propre place; « chacun à son poste » conserve la valeur distributive et convient à une scène militaire.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: autour du camp
  rationale: Traduction directe et naturelle de la position occupée tout autour du camp.
- source_word: וַיָּרָץ כָּל הַמַּחֲנֶה
  choice: tout le camp se mit à courir
  rationale: רץ signifie normalement « courir ». La tournure française exprime le déclenchement soudain de la course sans préciser davantage la nature chaotique du mouvement.
- source_word: וַיָּרִיעוּ
  choice: ils poussèrent des cris
  rationale: Le verbe peut désigner un grand cri, notamment un cri de guerre ou d’alarme; cette formulation préserve l’ambiguïté.
- source_word: ויניסו
  choice: prirent la fuite
  rationale: Cette leçon est comprise comme une forme de נוס, « fuir »; « prirent la fuite » est idiomatique et rend clairement le mouvement de fuite.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « À son poste » donne naturellement le sens de l’idiome hébreu dans le cadre militaire, tandis que « poussèrent des cris » maintient l’ambiguïté entre cri de guerre et cri de panique.
