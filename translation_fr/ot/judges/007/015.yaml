source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ גִּדְע֜וֹן אֶת מִסְפַּ֧ר הַ/חֲל֛וֹם וְ/אֶת שִׁבְר֖/וֹ וַ/יִּשְׁתָּ֑חוּ וַ/יָּ֨שָׁב֙ אֶל מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר ק֔וּמוּ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יֶדְ/כֶ֖ם אֶת מַחֲנֵ֥ה מִדְיָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/015.yaml
  text: And when Gideon heard the telling of the dream and its interpretation, he bowed down in worship. Then he returned to the camp of Israel and said, “Get up, for the LORD has given the camp of Midian into your hand.”
translation:
  language: fr
  text: 'Lorsque Gédéon entendit le récit du rêve et son interprétation, il se prosterna. Puis il retourna au camp d’Israël et dit : « Levez-vous, car le SEIGNEUR a livré le camp de Madian entre vos mains. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפַּר הַחֲלוֹם
  choice: le récit du rêve
  rationale: מִסְפָּר désigne ici l’action de raconter ou le récit entendu, plutôt qu’un simple dénombrement.
- source_word: שִׁבְרוֹ
  choice: son interprétation
  rationale: Dans ce contexte, שֵׁבֶר désigne l’explication ou l’interprétation du rêve.
- source_word: וַיִּשְׁתָּחוּ
  choice: il se prosterna
  rationale: Le verbe indique une prosternation; le texte hébreu ne précise pas explicitement un complément tel que « devant le SEIGNEUR » ou « en adoration ».
- source_word: ק֔וּמוּ
  choice: Levez-vous
  rationale: Impératif pluriel naturel et digne, adressé aux hommes du camp d’Israël.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française courante pour représenter le tétragramme divin sans imposer une vocalisation reconstruite.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: a livré ... entre vos mains
  rationale: Cette tournure française restitue l’idiome hébreu de remise au pouvoir de quelqu’un et conserve l’image des « mains ».
theological_decisions:
- issue: Sens cultuel de la prosternation
  choice: il se prosterna
  alternative: il se prosterna en adoration
  rationale: La scène suggère fortement l’adoration, mais le verbe seul exprime d’abord le geste; la traduction évite d’expliciter davantage que l’hébreu.
- issue: Aspect de la victoire annoncée
  choice: a livré
  alternative: livrera
  rationale: Le parfait נָתַן présente la victoire comme déjà accordée et certaine, bien que le combat reste à venir.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant l’image idiomatique « entre vos mains » et l’ambiguïté formelle de la prosternation.
