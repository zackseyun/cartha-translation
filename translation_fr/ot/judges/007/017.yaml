- from: 'Il leur dit : « Regardez-moi[a] et faites comme moi. Lorsque j’arriverai à la lisière du camp, vous ferez exactement ce que je ferai. »'
  to: 'Il leur dit : « Observez-moi[a] et faites de même. Voici : lorsque j’arriverai au bord du camp, vous ferez comme je ferai. »'
  rationale: La révision rétablit le marqueur d’attention וְהִנֵּה par « Voici », évite l’intensification introduite par « exactement » et emploie une expression spatiale plus naturelle. Elle conserve la structure directive et l’idée d’imitation du texte hébreu.
