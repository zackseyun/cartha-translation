  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מִמֶּ֥/נִּי תִרְא֖וּ וְ/כֵ֣ן תַּעֲשׂ֑וּ וְ/הִנֵּ֨ה אָנֹכִ֥י בָא֙ בִּ/קְצֵ֣ה הַֽ/מַּחֲנֶ֔ה וְ/הָיָ֥ה כַ/אֲשֶׁר אֶעֱשֶׂ֖ה כֵּ֥ן תַּעֲשֽׂוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/017.yaml
  text: And he said to them[a], “Watch me, and do likewise. Behold, when I come to the edge of the camp, then as I do, so you shall do.”
translation:
  language: fr
  text: 'Il leur dit : « Observez-moi[a] et faites de même. Voici : lorsque j’arriverai au bord du camp, vous ferez comme je ferai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Regardez-moi. »'
    reason: Alternative lexicale possible pour l’ordre d’observer Gédéon afin d’imiter son action.
lexical_decisions:
- source_word: מִמֶּנִּי תִרְאוּ
  choice: Regardez-moi
  rationale: Dans cette consigne, ראה avec מן invite les hommes à observer Gédéon comme modèle. « Regardez-moi » est naturel en français et prépare clairement l’ordre de l’imiter.
- source_word: וְכֵן תַּעֲשׂוּ
  choice: et faites comme moi
  rationale: כֵן exprime ici la manière. La formulation française rend explicitement l’imitation déjà indiquée par מִמֶּנִּי, sans changer le sens.
- source_word: וְהִנֵּה
  choice: Lorsque
  rationale: Dans ce contexte directif, וְהִנֵּה attire l’attention sur l’action imminente. Son relief discursif est intégré naturellement à la proposition temporelle plutôt que rendu par l’archaïsant « voici ».
- source_word: אָנֹכִי בָא
  choice: j’arriverai
  rationale: Le participe בָא présente une action imminente. Avec la lisière comme destination, « j’arriverai » est idiomatique et restitue clairement la séquence prévue.
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: à la lisière du camp
  rationale: קָצֶה désigne l’extrémité ou le bord. « La lisière du camp » est une expression française naturelle pour sa limite extérieure.
- source_word: כַאֲשֶׁר אֶעֱשֶׂה כֵּן תַּעֲשׂוּן
  choice: vous ferez exactement ce que je ferai
  rationale: Cette tournure restitue clairement la formule hébraïque de correspondance (« comme… ainsi… ») et conserve la force directive de l’imparfait final.
