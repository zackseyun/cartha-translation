base_translation:
  language: en
  yaml_path: translation/ot/judges/007/014.yaml
  text: His companion answered and said[a], “This is nothing other than the sword of Gideon son of Joash, a man of Israel[b]. God has given Midian and the whole camp into his hand.”
translation:
  language: fr
  text: 'Son compagnon lui répondit : « Ce n’est rien d’autre que l’épée de Gédéon, fils de Joas, un homme d’Israël. Dieu a livré Madian et tout le camp entre ses mains[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans sa main », expression qui signifie « en son pouvoir » ou « sous son contrôle ».'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן רֵעֵהוּ וַיֹּאמֶר
  choice: Son compagnon lui répondit
  rationale: La formule narrative hébraïque associe littéralement « répondit » et « dit ». En français actuel, « lui répondit » restitue naturellement l’ensemble sans lourdeur, tandis que « compagnon » convient au contexte militaire.
- source_word: אֵין זֹאת בִּלְתִּי אִם
  choice: Ce n’est rien d’autre que
  rationale: Cette tournure conserve la forte valeur exclusive de l’expression hébraïque et l’identification catégorique du sens du rêve.
- source_word: חֶרֶב גִּדְעוֹן
  choice: l’épée de Gédéon
  rationale: L’image désigne l’instrument de la défaite annoncée. L’article défini est naturel en français dans cette identification symbolique.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: Gédéon, fils de Joas
  rationale: Forme française concise et usuelle du patronyme hébreu.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: un homme d’Israël
  rationale: Cette traduction garde le nom masculin singulier אִישׁ et l’appartenance à Israël, sans réduire l’expression au seul adjectif « Israélite ».
- source_word: נָתַן הָאֱלֹהִים
  choice: Dieu a livré
  rationale: Dans un contexte où des adversaires sont remis au pouvoir d’un vainqueur, « livrer » exprime idiomatiquement le sens de נָתַן avec בְּיָד. Le passé composé rend la déclaration comme un fait déjà assuré.
- source_word: אֶת מִדְיָן וְאֶת כָּל הַמַּחֲנֶה
  choice: Madian et tout le camp
  rationale: « Madian » désigne ici le peuple ennemi, et « tout le camp » conserve la totalité exprimée par כָּל ainsi que l’image du campement militaire.
- source_word: בְּיָדוֹ
  choice: entre ses mains
  rationale: Cette expression française naturelle communique l’idée de remise au pouvoir ou au contrôle de Gédéon, tout en gardant l’image corporelle de l’idiome hébreu.
theological_decisions:
- issue: Portée de אִישׁ יִשְׂרָאֵל
  choice: un homme d’Israël
  alternative: un Israélite
  rationale: Le texte précise אִישׁ, « homme », au masculin singulier. La formulation retenue préserve ce trait explicite sans lui ajouter de portée doctrinale.
- issue: Valeur du parfait נָתַן dans l’interprétation du rêve
  choice: Dieu a livré
  alternative: Dieu livrera
  rationale: Le parfait présente la victoire comme déjà arrêtée ou certaine du point de vue du locuteur. Le passé composé respecte cette perspective, tandis qu’un futur explicite atténuerait l’aspect accompli de l’énoncé.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe du dialogue est allégée selon l’usage français, sans reproduire mécaniquement le doublet hébreu « répondit et dit ». L’expression exclusive et l’image de l’épée sont conservées, ainsi que l’idiome de la main, expliqué en note.
