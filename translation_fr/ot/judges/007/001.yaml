source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם יְרֻבַּ֜עַל ה֣וּא גִדְע֗וֹן וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַֽ/יַּחֲנ֖וּ עַל עֵ֣ין חֲרֹ֑ד וּ/מַחֲנֵ֤ה מִדְיָן֙ הָיָה ל֣/וֹ מִ/צָּפ֔וֹן מִ/גִּבְעַ֥ת הַ/מּוֹרֶ֖ה בָּ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/001.yaml
  text: Then Jerubbaal (that is[a], Gideon) and all the people who were with him rose early and camped by the spring of Harod. The camp of Midian was north of him, by the hill of Moreh in the valley.
translation:
  language: fr
  text: Puis Yeroubbaal — c’est-à-dire Gédéon — et tout le peuple qui était avec lui se levèrent de bon matin et campèrent près de la source de Harod[a]. Le camp de Madian était au nord de lui, du côté de la colline de Moré, dans la vallée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « près d’En-Harod ». En hébreu, le nom comprend littéralement le mot « source ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: se levèrent de bon matin
  rationale: Le hiphil de שׁכם exprime le fait de se lever tôt. Avec le sujet composé et le verbe hébreu au pluriel, « se levèrent de bon matin » restitue naturellement la nuance temporelle.
- source_word: יְרֻבַּעַל הוּא גִדְעוֹן
  choice: Yeroubbaal — c’est-à-dire Gédéon —
  rationale: Le pronom appositionnel הוּא identifie Yeroubbaal à Gédéon. L’incise conserve les deux noms et rend clairement cette identification.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: et tout le peuple qui était avec lui
  rationale: עָם signifie largement « peuple ». Bien que le contexte soit militaire, le texte n’emploie pas ici un terme désignant explicitement des soldats ou des troupes.
- source_word: וַיַּחֲנוּ
  choice: campèrent
  rationale: Le verbe חנה signifie établir son camp ou camper. « Campèrent » est direct, naturel et fidèle au registre narratif.
- source_word: עַל עֵין חֲרֹד
  choice: près de la source de Harod[a]
  rationale: עֵין désigne une source et peut aussi faire partie d’un nom de lieu. La traduction du sens rend la topographie immédiatement compréhensible; la note conserve l’autre possibilité, « En-Harod ».
- source_word: וּמַחֲנֵה מִדְיָן
  choice: Le camp de Madian
  rationale: Cette formulation rend directement la construction hébraïque sans transformer explicitement Madian en adjectif ethnique.
- source_word: הָיָה לוֹ מִצָּפוֹן
  choice: était au nord de lui
  rationale: Le suffixe de לוֹ est singulier et renvoie naturellement à Gédéon comme point de repère. La traduction conserve ce singulier au lieu de l’harmoniser avec l’ensemble du groupe.
- source_word: מִגִּבְעַת הַמּוֹרֶה
  choice: du côté de la colline de Moré
  rationale: Dans cette indication topographique, מן est compris comme locatif. « Du côté de » exprime la position relative sans imposer l’idée d’un déplacement depuis la colline.
- source_word: בָּעֵמֶק
  choice: dans la vallée
  rationale: עֵמֶק désigne couramment une vallée; cette traduction est simple et précise.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les formes traditionnelles françaises « Gédéon », « Madian » et « Moré » sont conservées; « Yeroubbaal » suit de près la forme hébraïque. L’incise explicative évite une parenthèse lourde, tandis que la syntaxe narrative reste accessible.
