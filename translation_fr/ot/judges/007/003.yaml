base_translation:
  language: en
  yaml_path: translation/ot/judges/007/003.yaml
  text: Please proclaim in the hearing of the people[a], saying, ‘Whoever is fearful and trembling, let him return and depart from Mount Gilead.’ Then twenty-two thousand of the people returned[b], and ten thousand remained.
translation:
  language: fr
  text: 'Et maintenant, proclame donc au peuple : « Que celui qui a peur et tremble s’en retourne et se retire[a] du mont Galaad[b]. » Vingt-deux mille parmi le peuple s’en retournèrent, et il en resta dix mille.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu traduit par « se retire » est rare et son sens est discuté ; il pourrait évoquer un départ matinal, rapide ou discret.
    reason: lexical_alternative
  - marker: b
    text: "« Mont Galaad » traduit directement l’hébreu, mais cette indication géographique est difficile dans ce contexte. Certains comprennent plus largement « la région montagneuse de Galaad ».\x1F"
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: La locution hébraïque contient explicitement וְ (« et ») et עַתָּה (« maintenant »). Le français conserve cette transition narrative naturelle.
- source_word: קְרָא נָא בְּאָזְנֵי הָעָם
  choice: proclame donc devant tout le peuple
  rationale: קרא désigne ici une annonce publique; נָא adoucit ou presse l’impératif, rendu naturellement par « donc ». L’expression idiomatique « aux oreilles du peuple » signifie que l’annonce doit être faite publiquement, de manière audible.
- source_word: מִי יָרֵא וְחָרֵד
  choice: celui qui a peur et tremble
  rationale: 'Cette formulation française simple conserve les deux éléments hébreux : la peur et sa manifestation physique, le tremblement.'
- source_word: יָשֹׁב
  choice: s’en retourne
  rationale: Le jussif autorise ou ordonne à l’homme craintif de repartir. « S’en retourne » convient au contexte d’un rassemblement militaire sans préciser une destination absente de l’hébreu.
- source_word: וְיִצְפֹּר
  choice: et se retire
  rationale: Ce verbe rare et discuté indique en contexte le retrait du rassemblement. « Se retire » en exprime la portée générale sans imposer la nuance incertaine d’un départ matinal ou précipité.
- source_word: מֵהַר הַגִּלְעָד
  choice: du mont Galaad
  rationale: Le singulier הַר suivi du nom propre se traduit directement par « mont Galaad », tout en signalant en note la difficulté géographique.
- source_word: וַיָּשָׁב מִן הָעָם עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: Vingt-deux mille parmi le peuple s’en retournèrent
  rationale: La construction collective hébraïque devient un sujet pluriel naturel en français. « Parmi le peuple » rend מִן sans ajouter explicitement « hommes ».
- source_word: וַעֲשֶׂרֶת אֲלָפִים נִשְׁאָרוּ
  choice: et il en resta dix mille
  rationale: Cette tournure idiomatique française rend clairement le nombre de ceux qui demeurèrent sur place.
