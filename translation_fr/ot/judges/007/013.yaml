- from: 'Quand Gédéon arriva, voici qu’un homme racontait un rêve à son compagnon. Il disait : « Écoute, j’ai fait un rêve : voici qu’une galette ronde de pain d’orge[a] roulait dans le camp de Madian. Elle arriva jusqu’à la tente et la frappa, si bien qu’elle tomba. Elle la retourna sens dessus dessous, et la tente s’écroula. »'
  to: 'Quand Gédéon arriva, voici qu’un homme racontait un rêve à son compagnon. Il disait : « Écoute, j’ai fait un rêve : voici qu’un pain d’orge rond[a] roulait dans le camp de Madian. Il arriva jusqu’à la tente et la frappa, si bien que la tente tomba. Le pain la retourna, et la tente tomba. »'
