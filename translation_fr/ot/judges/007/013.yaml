base_translation:
  language: en
  yaml_path: translation/ot/judges/007/013.yaml
  text: 'When Gideon came[a], behold, a man was telling a dream to his companion. He said, “Look, I dreamed a dream: behold, a round loaf of barley bread was rolling around in the camp of Midian, and it came up to the tent and struck it so that it fell, He turned it upside down, and the tent collapsed.”'
translation:
  language: fr
  text: 'Quand Gédéon arriva, voici qu’un homme racontait un rêve à son compagnon. Il disait : « Écoute, j’ai fait un rêve : voici qu’un pain d’orge rond[a] roulait dans le camp de Madian. Il arriva jusqu’à la tente et la frappa, si bien que la tente tomba. Le pain la retourna, et la tente tomba. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une galette d’orge » ou « un pain rond d’orge ». Le mot hébreu est rare et désigne probablement une galette ou un pain de forme ronde.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Quand Gédéon arriva
  rationale: Le wayyiqtol fait progresser le récit tout en situant l’action que Gédéon surprend; la subordination temporelle est naturelle en français.
- source_word: וְהִנֵּה
  choice: voici que / voici
  rationale: La particule attire vivement l’attention. « Voici que » convient au récit, tandis que « voici » conserve cet effet dans le discours direct.
- source_word: מְסַפֵּר לְרֵעֵהוּ חֲלוֹם
  choice: racontait un rêve à son compagnon
  rationale: Le participe exprime une action en cours; « compagnon » convient au contexte militaire sans supposer une amitié intime.
- source_word: הִנֵּה חֲלוֹם חָלַמְתִּי
  choice: Écoute, j’ai fait un rêve
  rationale: « Écoute » rend naturellement l’appel à l’attention dans le dialogue. L’expression française « faire un rêve » traduit idiomatiquement la construction intensive verbe-nom.
- source_word: צלול לֶחֶם שְׂעֹרִים
  choice: une galette ronde de pain d’orge
  rationale: צלול est rare et semble désigner un pain ou une galette de forme ronde; la formulation garde explicites la forme probable et la matière.
- source_word: מִתְהַפֵּךְ
  choice: roulait
  rationale: Le hitpael décrit un mouvement de retournement sur soi-même; « roulait » exprime clairement l’image en français.
- source_word: בְּמַחֲנֵה מִדְיָן
  choice: dans le camp de Madian
  rationale: La préposition ב est rendue directement par « dans » sans imposer le sens directionnel « jusque dans ».
- source_word: עַד הָאֹהֶל
  choice: jusqu’à la tente
  rationale: עַד indique le point atteint par le mouvement.
- source_word: וַיַּכֵּהוּ
  choice: la frappa
  rationale: Le suffixe masculin hébreu renvoie à אֹהֶל, mais le français exige le féminin selon « tente ».
- source_word: וַיַּהַפְכֵהוּ לְמַעְלָה
  choice: Elle la retourna sens dessus dessous
  rationale: Le sujet grammatical demeure naturellement la galette; « sens dessus dessous » rend l’idée du renversement vers le haut.
- source_word: וְנָפַל הָאֹהֶל
  choice: et la tente s’écroula
  rationale: « S’écroula » rend idiomatiquement la chute destructive de la tente et évite une répétition française pesante.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le présentatif « voici » conserve la vivacité de l’hébreu sans archaïsme excessif. Les pronoms féminins suivent le genre grammatical français de « galette » et « tente »; le contexte permet d’identifier leurs référents.
