  text: וַ/יָּבֹ֣א גִ֠דְעוֹן וּ/מֵאָה אִ֨ישׁ אֲשֶׁר אִתּ֜/וֹ בִּ/קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה רֹ֚אשׁ הָ/אַשְׁמֹ֣רֶת הַ/תִּֽיכוֹנָ֔ה אַ֛ךְ הָקֵ֥ם הֵקִ֖ימוּ אֶת הַ/שֹּֽׁמְרִ֑ים וַֽ/יִּתְקְעוּ֙ בַּ/שּׁ֣וֹפָר֔וֹת וְ/נָפ֥וֹץ הַ/כַּדִּ֖ים אֲשֶׁ֥ר בְּ/יָדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/019.yaml
  text: So Gideon and the hundred men who were with him came to the edge of the camp at the beginning of the middle watch[a], just as they had posted the watchmen[c][b]; and they blew the trumpets and smashed the jars that were in their hands.
translation:
  language: fr
  text: Gédéon et les cent hommes qui étaient avec lui arrivèrent à la lisière du camp, au début de la veille du milieu[a], au moment même où l’on venait de poster les gardes[b]. Ils sonnèrent des cors[c] et brisèrent les cruches qu’ils tenaient dans leurs mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la veille médiane » ou « la deuxième veille ». L’hébreu désigne l’une des périodes entre lesquelles la nuit était divisée.
    reason: lexical_alternative
  - marker: b
    text: Ou « alors qu’on venait tout juste de placer les gardes » ou « alors qu’on venait de mettre les sentinelles en poste ». La construction hébraïque souligne que cette mise en poste venait d’avoir lieu.
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : shofarot, pluriel de shofar, des cors servant notamment à donner des signaux.'
    reason: cultural_note
lexical_decisions:
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: à la lisière du camp
  rationale: קָצֶה désigne l’extrémité ou le bord. « À la lisière du camp » exprime naturellement en français l’arrivée à sa limite extérieure.
- source_word: רֹאשׁ הָאַשְׁמֹרֶת הַתִּיכוֹנָה
  choice: au début de la veille du milieu
  rationale: רֹאשׁ a ici le sens temporel de « début », et אַשְׁמֹרֶת désigne une période de garde nocturne. « Veille du milieu » conserve la désignation hébraïque sans imposer un système précis de découpage de la nuit.
- source_word: אַךְ הָקֵם הֵקִימוּ אֶת־הַשֹּׁמְרִים
  choice: juste après la relève des gardes
  rationale: Le contexte situe l’arrivée au moment où les gardes viennent d’être mis en place. La construction infinitif absolu + verbe fini souligne l’action; dans ce cadre nocturne, « relève des gardes » rend clairement et idiomatiquement le changement de poste, sans alourdir la phrase.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: Ils sonnèrent alors du cor
  rationale: שׁוֹפָר désigne un cor utilisé notamment pour donner des signaux. « Sonner du cor » est plus précis que « sonner de la trompette » et reste naturel en français.
- source_word: וְנָפוֹץ הַכַּדִּים
  choice: et brisèrent les cruches
  rationale: נפץ exprime une rupture violente; « brisèrent » convient au registre narratif. כַּד désigne un récipient de type cruche ou jarre; « cruches » est clair et cohérent avec l’objet tenu en main.
- source_word: אֲשֶׁר בְּיָדָם
  choice: qu’ils tenaient à la main
  rationale: Cette formulation française naturelle rend la relation possessive et concrète de l’hébreu, littéralement « qui étaient dans leur main ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le verset privilégie une syntaxe fluide tout en conservant la désignation ambiguë de la veille nocturne. Le singulier collectif « du cor » traduit naturellement l’action de plusieurs hommes sonnant chacun de son instrument.
