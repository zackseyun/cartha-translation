  source_fidelity: La mention de la mise en poste des gardes doit être conservée. « La relève des gardes » décrit un changement de garde, qui n’est pas exprimé par l’hébreu ; la construction intensifiée indique plutôt qu’ils venaient tout juste de poster les gardes. Le pluriel de שופרות est également mieux rendu par « des cors ».
  naturalness: Le texte révisé reste fluide et narratif en français international moderne. « Au moment même où l’on venait de poster les gardes » exprime naturellement la concomitance et l’insistance du texte source.
  terminology: « Veille du milieu » préserve l’ambiguïté du découpage nocturne. « Cors » rend le pluriel de shofarot sans assimiler inutilement ces instruments à des trompettes modernes. « Cruches » convient à כַּד dans ce contexte.
