revisions:
- from: Gédéon et les cent hommes qui étaient avec lui arrivèrent à la lisière du camp au début de la veille du milieu[a], juste après la relève des gardes. Ils sonnèrent alors du cor[b] et brisèrent les cruches qu’ils tenaient à la main.
  to: Gédéon et les cent hommes qui étaient avec lui arrivèrent à la lisière du camp, au début de la veille du milieu[a], au moment même où l’on venait de poster les gardes[b]. Ils sonnèrent des cors[c] et brisèrent les cruches qu’ils tenaient dans leurs mains.
  rationale: La correction remplace l’idée non attestée de relève par la mise en poste récente des gardes, conformément à l’hébreu et à la note de l’audit anglais. Elle rend aussi explicitement le pluriel des cors et ajoute l’ancre de note nécessaire pour l’alternative lexicale relative aux gardes.
