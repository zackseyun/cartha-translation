    issue: « juste après la relève des gardes »
    rationale: Cette formulation introduit l’idée d’une relève ou d’un changement de poste. L’hébreu dit que les gardes venaient d’être postés/mis en place, avec une construction qui souligne l’immédiateté de cette action.
  - severity: low
    issue: « du cor » au singulier collectif
    rationale: Le singulier collectif est possible en français, mais le pluriel « des cors » reflète plus directement le pluriel hébreu שופרות et la pluralité des hommes concernés.
