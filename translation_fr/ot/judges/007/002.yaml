id: JDG.7.2
reference: Judges 7:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל גִּדְע֔וֹן רַ֗ב הָ/עָם֙ אֲשֶׁ֣ר אִתָּ֔/ךְ מִ/תִּתִּ֥/י אֶת מִדְיָ֖ן בְּ/יָדָ֑/ם פֶּן יִתְפָּאֵ֨ר עָלַ֤/י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יָדִ֖/י הוֹשִׁ֥יעָה לִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/002.yaml
  text: And Yahweh said to Gideon[a], “The people who are with you are too many for me to give Midian into their hand, lest Israel boast against me, saying[b], ‘My own hand has saved me.’”
translation:
  language: fr
  text: 'Yahvé dit à Gédéon : « Le peuple qui est avec toi est trop nombreux pour que je livre Madian entre leurs mains[a]. Autrement, Israël pourrait se vanter à mes dépens en disant : “Ma propre main m’a sauvé[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans leur main »; en hébreu, la « main » peut désigner le pouvoir ou la domination.
    reason: lexical_alternative
  - marker: b
    text: Ou « m’a délivré ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Translittération française courante du nom divin, qui préserve le nom personnel plutôt que de le remplacer par un titre.
- source_word: רַב הָעָם אֲשֶׁר אִתָּךְ
  choice: Le peuple qui est avec toi est trop nombreux
  rationale: Le sens contextuel de רַב est ici celui d’un nombre excessif, comme le montre la proposition suivante.
- source_word: מִתִּתִּי אֶת־מִדְיָן בְּיָדָם
  choice: pour que je livre Madian entre leurs mains
  rationale: « Livrer entre les mains » rend naturellement l’idée de remettre quelqu’un au pouvoir d’un autre, tout en conservant l’image hébraïque de la main.
- source_word: פֶּן
  choice: Autrement, ... pourrait
  rationale: Cette formulation française naturelle exprime le résultat indésirable envisagé par la particule négative פֶּן.
- source_word: יִתְפָּאֵר עָלַי
  choice: se vanter à mes dépens
  rationale: Le verbe exprime l’autoglorification; עָלַי indique ici que cette prétention se ferait aux dépens de Yahvé ou contre lui.
- source_word: יָדִי הוֹשִׁיעָה לִּי
  choice: Ma propre main m’a sauvé
  rationale: La formulation conserve l’image de la main comme puissance personnelle et l’affirmation emphatique d’Israël selon laquelle il se serait sauvé lui-même.
theological_decisions:
- issue: Rendu du nom divin
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre יהוה; le conserver évite de lui substituer un titre.
- issue: Israël comme collectif singulier
  choice: Israël ... « Ma propre main m’a sauvé »
  alternative: les Israélites ... « Nos propres mains nous ont sauvés »
  rationale: L’hébreu présente Israël comme une entité collective au singulier; ce trait et la tension théologique de la prétention sont conservés.
- issue: Sens de la vantardise envers Dieu
  choice: se vanter à mes dépens
  alternative: se vanter contre moi
  rationale: Le choix garde l’idée que l’autoglorification d’Israël porterait atteinte à la gloire due à Yahvé, sans durcir artificiellement la tournure française.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe collective de « le peuple ... leurs mains » suit le passage du collectif aux membres du groupe présent dans l’hébreu. Les images de la main et du salut sont maintenues.
