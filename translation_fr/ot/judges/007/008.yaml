base_translation:
  language: en
  yaml_path: translation/ot/judges/007/008.yaml
  text: So they took the provisions of the people in their hands[a], along with their trumpets. And he sent every man of Israel, each to his tent, but retained the three hundred men. And the camp of Midian was below him in the valley.
translation:
  language: fr
  text: Ils prirent les provisions du peuple dans leurs mains, ainsi que leurs trompettes[a]. Gédéon renvoya tous les hommes d’Israël, chacun à sa tente, mais il garda les trois cents hommes. Le camp de Madian se trouvait plus bas que lui, dans la vallée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cors » ou « cornes de bélier » ; le terme hébreu désigne une corne utilisée comme instrument de signalisation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Ils prirent
  rationale: Le wayyiqtol narratif de לקח appelle un passé simple dans ce récit; le sujet pluriel désigne naturellement les hommes retenus.
- source_word: צֵדָה הָעָם בְּיָדָם
  choice: en main les provisions du peuple
  rationale: « Provisions » garde le sens large de vivres ou fournitures destinés à l’expédition; « en main » restitue naturellement l’image concrète de בְּיָדָם.
- source_word: שׁוֹפְרֹתֵיהֶם
  choice: leurs cors
  rationale: Le שׁוֹפָר est un instrument de signalisation fait d’une corne; « cors » est ici plus précis que « trompettes » sans imposer que chaque instrument soit explicitement une corne de bélier.
- source_word: שִׁלַּח
  choice: Gédéon renvoya
  rationale: Le verbe singulier a Gédéon pour sujet implicite. Dans le contexte, « renvoya » exprime naturellement l’envoi des soldats à leurs tentes tout en conservant le sens de שׁלח.
- source_word: כָּל אִישׁ יִשְׂרָאֵל ... אִישׁ לְאֹהָלָיו
  choice: tous les hommes d’Israël, chacun à sa tente
  rationale: Cette formulation conserve la distribution individuelle et le masculin explicite du texte, qui concerne des combattants.
- source_word: וּבִשְׁלֹשׁ מֵאוֹת הָאִישׁ הֶחֱזִיק
  choice: mais il garda les trois cents hommes
  rationale: « Garda » rend clairement l’idée de retenir ce groupe, tandis que « mais » explicite le contraste porté par le contexte entre les hommes renvoyés et ceux conservés.
- source_word: מַחֲנֵה מִדְיָן
  choice: Le camp de Madian
  rationale: Rendu direct de la chaîne construite; « Madian » est la forme française biblique courante du nom.
- source_word: מִתַּחַת בָּעֵמֶק
  choice: plus bas que lui, dans la vallée
  rationale: La tournure restitue la position relative exprimée par לֹו מִתַּחַת et la précision topographique de בָּעֵמֶק dans un français naturel.
