translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans être archaïque. Le nom « Gédéon » est explicité pour éviter l’ambiguïté momentanée du pronom singulier après le sujet pluriel de la première phrase.
