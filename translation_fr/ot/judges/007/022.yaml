source:
  edition: WLC
  text: וַֽ/יִּתְקְעוּ֮ שְׁלֹשׁ מֵא֣וֹת הַ/שּׁוֹפָרוֹת֒ וַ/יָּ֣שֶׂם יְהוָ֗ה אֵ֣ת חֶ֥רֶב אִ֛ישׁ בְּ/רֵעֵ֖/הוּ וּ/בְ/כָל הַֽ/מַּחֲנֶ֑ה וַ/יָּ֨נָס הַֽ/מַּחֲנֶ֜ה עַד בֵּ֤ית הַשִּׁטָּה֙ צְֽרֵרָ֔תָ/ה עַ֛ד שְׂפַת אָבֵ֥ל מְחוֹלָ֖ה עַל טַבָּֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/022.yaml
  text: When the three hundred trumpets were blown[a], Yahweh set every man's sword against his companion and against the whole camp, and the camp fled as far as Beth-shittah toward Zererah, as far as the edge of Abel-meholah[d][c][b], by Tabbath.
translation:
  language: fr
  text: Quand les trois cents cors retentirent[a], Yahweh fit se retourner l’épée de chacun contre son compagnon, dans tout le camp[b]. Le camp s’enfuit jusqu’à Beth-Shitta, en direction de Tseréra, jusqu’aux abords[d] d’Abel-Mehola[c], près de Tabbath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quand on sonna les trois cents cors de bélier ». Le mot hébreu désigne des instruments à vent faits d’une corne, souvent d’une corne de bélier.
    reason: lexical_alternative
  - marker: b
    text: Ou « contre tout le camp ». L’hébreu peut évoquer soit les épées se retournant les unes contre les autres partout dans le camp, soit leur action dirigée contre l’ensemble du camp.
    reason: alternative_reading
  - marker: c
    text: Beth-Shitta, Tseréra, Abel-Mehola et Tabbath sont des noms de lieux qui jalonnent l’itinéraire de l’armée en fuite.
    reason: cultural_note
  - marker: d
    text: Ou « la rive » ou « la limite » d’Abel-Mehola.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקְעוּ ... הַשּׁוֹפָרוֹת
  choice: Quand les trois cents cors retentirent
  rationale: Le sujet grammatical du verbe est sous-entendu (« ils sonnèrent »), tandis que הַשּׁוֹפָרוֹת est son complément. La formulation française met naturellement l’accent sur le signal sonore sans introduire de sujet explicite absent du segment. « Cors » rend l’instrument à corne plus précisément que le terme générique « trompettes ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
- source_word: וַיָּשֶׂם ... אֵת חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: fit que l’épée de chacun se tourna contre son compagnon
  rationale: Cette formulation conserve l’image concrète de l’épée dirigée contre un proche ou compagnon d’armes, ainsi que l’action causative attribuée à Yahweh, sans réduire l’expression à une simple paraphrase de combat.
- source_word: וּבְכָל הַמַּחֲנֶה
  choice: dans tout le camp
  rationale: La préposition בְּ peut ici indiquer l’étendue du phénomène dans l’ensemble du camp. Cette lecture est naturelle en français et évite de faire du camp lui-même un objet supplémentaire de l’épée; l’autre possibilité est signalée en note.
- source_word: וַיָּנָס הַמַּחֲנֶה
  choice: Le camp s’enfuit
  rationale: מַחֲנֶה désigne à la fois le campement et la troupe qui l’occupe. « Le camp » préserve le terme hébreu tout en permettant la métonymie naturelle d’une armée en fuite.
- source_word: עַד בֵּית הַשִּׁטָּה
  choice: jusqu’à Beth-Shitta
  rationale: Le toponyme est translittéré et la préposition עַד est rendue par sa valeur d’aboutissement spatial.
- source_word: צְרֵרָתָה
  choice: en direction de Tseréra
  rationale: La terminaison directionnelle -ה exprime un mouvement vers le lieu. « En direction de » conserve cette nuance sans affirmer nécessairement que l’armée l’a atteint.
- source_word: שְׂפַת אָבֵל מְחוֹלָה
  choice: aux abords d’Abel-Mehola
  rationale: שָׂפָה signifie littéralement « lèvre », puis « bord, rive, limite ». « Abords » reste géographiquement ouvert et naturel, sans imposer la présence d’un cours d’eau.
- source_word: עַל טַבָּת
  choice: près de Tabbath
  rationale: Avec un nom de lieu, עַל peut exprimer ici la proximité. « Près de » est idiomatique et maintient la réserve du texte sur le rapport géographique exact.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » en préserve la fonction de nom personnel plutôt que de lui substituer un titre.
- issue: Nature de l’intervention divine dans la panique du camp
  choice: Yahweh fit que l’épée de chacun se tourna contre son compagnon
  alternative: Yahweh mit l’épée de chacun contre son compagnon
  rationale: Le français causatif exprime clairement que Yahweh provoque la confusion meurtrière, tout en conservant la métaphore hébraïque de l’épée tournée contre le compagnon et sans préciser le mécanisme de l’intervention.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases restent accessibles, tandis que les toponymes sont translittérés de manière cohérente. « Compagnon » garde la relation interne au camp; « abords » préserve l’imprécision géographique du substantif hébreu.
