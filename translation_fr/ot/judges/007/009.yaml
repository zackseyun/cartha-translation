  text: וַֽ/יְהִי֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה ק֖וּם רֵ֣ד בַּֽ/מַּחֲנֶ֑ה כִּ֥י נְתַתִּ֖י/ו בְּ/יָדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/009.yaml
  text: And it happened that night that Yahweh said to him[a], “Arise, go down into the camp, for I have given it into your hand.”
translation:
  language: fr
  text: 'Cette nuit-là, Yahweh lui dit : « Lève-toi, descends dans le camp, car je l’ai livré entre tes mains[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans ta main » ; expression hébraïque signifiant « sous ton pouvoir » ou « sous ton contrôle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Cette nuit-là
  rationale: La formule narrative introduit une nouvelle scène. En français moderne, « Cette nuit-là » exprime naturellement le repère temporel sans reproduire lourdement « il arriva ».
- source_word: וַיֹּאמֶר אֵלָיו
  choice: lui dit
  rationale: Rendu direct et idiomatique du verbe courant אָמַר avec son complément.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française courante du nom divin, qui préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: קוּם
  choice: Lève-toi
  rationale: Impératif naturel en français, exprimant l’appel à agir immédiatement.
- source_word: רֵד בַּמַּחֲנֶה
  choice: descends dans le camp
  rationale: « Descends » conserve le mouvement topographique de ירד, et « dans le camp » rend la direction marquée par ב sans ajouter l’idée d’une attaque.
- source_word: כִּי
  choice: car
  rationale: Introduit avec concision la raison du commandement.
- source_word: נְתַתִּיו
  choice: je l’ai livré
  rationale: Le suffixe masculin singulier renvoie au camp, par métonymie à la force ennemie. « Livrer » rend ici la valeur contextuelle de נתן, tandis que le passé composé exprime une action divine tenue pour accomplie.
- source_word: בְּיָדֶךָ
  choice: entre tes mains
  rationale: Expression française naturelle qui conserve l’image de la main tout en évoquant la remise au pouvoir de Gédéon.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » conserve le nom personnel sans le remplacer par un titre.
- issue: Valeur accomplie de נְתַתִּיו
  choice: je l’ai livré
  alternative: je le livre
  rationale: Le parfait présente la victoire comme déjà accordée du point de vue de la parole divine, sans préciser par une formulation doctrinale le rapport exact entre décret et réalisation historique.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est fluide sans archaïsme ; l’image sémitique de la main est conservée sous une forme française compréhensible et expliquée en note.
