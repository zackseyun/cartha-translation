source:
  edition: WLC
  text: וַ/יַּ֛חַץ אֶת שְׁלֹשׁ מֵא֥וֹת הָ/אִ֖ישׁ שְׁלֹשָׁ֣ה רָאשִׁ֑ים וַ/יִּתֵּ֨ן שׁוֹפָר֤וֹת בְּ/יַד כֻּלָּ/ם֙ וְ/כַדִּ֣ים רֵקִ֔ים וְ/לַפִּדִ֖ים בְּ/ת֥וֹךְ הַ/כַּדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/016.yaml
  text: Then he divided the three hundred men into three companies[a], and put trumpets into the hands of all of them, and empty jars[c][b], with torches inside the jars.
translation:
  language: fr
  text: Puis il répartit les trois cents hommes en trois groupes[a]. Il mit entre les mains de chacun une trompe[b] et une cruche vide[c], avec une torche à l’intérieur de la cruche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en trois têtes », expression qui désigne ici trois groupes ou corps de troupe.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une corne de bélier ». Le mot hébreu désigne une corne utilisée comme instrument de signal.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « une jarre vide ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַץ
  choice: répartit
  rationale: Le verbe חצה décrit ici la division organisée de la troupe. « Répartit » est naturel en français et convient au contexte militaire sans préciser davantage la méthode.
- source_word: שְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: les trois cents hommes
  rationale: אִישׁ signifie littéralement « homme ». Le contexte montre qu’il s’agit des combattants de Gédéon, mais « hommes » reste fidèle sans ajouter l’interprétation « soldats ».
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: trois groupes
  rationale: L’expression signifie littéralement « trois têtes » ; רָאשִׁים désigne ici les corps ou groupes dans lesquels la troupe est organisée. « Groupes » est clair et actuel.
- source_word: וַיִּתֵּן ... בְּיַד כֻּלָּם
  choice: Il mit entre les mains de chacun
  rationale: נתן signifie couramment « donner » ou « mettre ». Cette formulation conserve l’image concrète des objets placés dans les mains et rend explicitement la valeur distributive de כֻּלָּם.
- source_word: שׁוֹפָרוֹת
  choice: trompe
  rationale: Le שׁוֹפָר est une corne utilisée comme instrument de signal. « Trompe » rend sa fonction sans l’assimiler à la trompette métallique moderne ; la note indique la nature possible de l’instrument.
- source_word: כַדִּים רֵקִים
  choice: une cruche vide
  rationale: כַּד désigne un récipient de terre, cruche ou jarre. « Cruche » est courant et concret ; le singulier distributif français exprime que chaque homme en reçoit une.
- source_word: לַפִּדִים
  choice: une torche
  rationale: לַפִּיד désigne une torche ou un brandon. « Torche » est l’équivalent français le plus clair.
- source_word: בְּתוֹךְ הַכַּדִּים
  choice: à l’intérieur de la cruche
  rationale: La locution indique que les torches se trouvent dans les récipients. Le singulier distributif s’accorde avec « chacun » et rend naturellement la scène en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le récit est formulé au passé simple, registre narratif biblique naturel. Le singulier distributif (« chacun », « une trompe », « une cruche », « une torche ») rend sans ambiguïté le fait que chaque homme reçoit ces objets. Tous les marqueurs de notes figurent dans le texte principal.
