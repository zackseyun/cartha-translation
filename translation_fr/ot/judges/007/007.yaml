  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן בִּ/שְׁלֹשׁ֩ מֵא֨וֹת הָ/אִ֤ישׁ הַֽ/מֲלַקְקִים֙ אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וְ/נָתַתִּ֥י אֶת מִדְיָ֖ן בְּ/יָדֶ֑/ךָ וְ/כָל הָ/עָ֔ם יֵלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/007.yaml
  text: And Yahweh said to Gideon[a], “With the three hundred men who lapped, I will save you and give Midian into your hand. And let all the people go, each man to his place.”
translation:
  language: fr
  text: 'Yahweh dit à Gédéon : « Avec les trois cents hommes qui ont lapé[a], je vous sauverai et je livrerai Madian entre tes mains. Que tout le peuple s’en aille, chacun à sa place. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par les trois cents hommes qui ont lapé » ; la préposition peut marquer plus explicitement le moyen par lequel Yahweh accordera la délivrance.'
    reason: alternative lexicale
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, au lieu de le remplacer par un titre.
- source_word: בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: Avec les trois cents hommes
  rationale: Le ב est instrumental. « Avec » reste naturel en français tout en présentant ces hommes comme le moyen choisi pour la délivrance.
- source_word: הַמֲלַקְקִים
  choice: qui ont lapé
  rationale: Conserve l’action concrète qui identifie les hommes, sans répéter « l’eau », absent de ce verset mais explicite dans le contexte précédent.
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: je vous sauverai
  rationale: Le hifil de ישׁע exprime ici la délivrance dans un contexte militaire. Le pronom hébreu est pluriel, rendu sans ambiguïté par « vous » en contraste avec le singulier « tes » qui suit.
- source_word: וְנָתַתִּי אֶת מִדְיָן בְּיָדֶךָ
  choice: et je livrerai Madian entre tes mains
  rationale: Rend de façon idiomatique l’image hébraïque d’un ennemi placé sous le pouvoir de quelqu’un, tout en conservant la métaphore de la main.
- source_word: וְכָל הָעָם
  choice: tout le peuple
  rationale: Suit le terme collectif hébreu, même si le contexte désigne les hommes assemblés pour combattre.
- source_word: יֵלְכוּ
  choice: Que … s’en aille
  rationale: 'Le yiqtol a ici une valeur jussive : il exprime l’ordre ou l’autorisation de partir plutôt qu’une simple prédiction.'
- source_word: אִישׁ לִמְקֹמוֹ
  choice: chacun à sa place
  rationale: Conserve la construction distributive et le terme général « place », sans préciser « chez lui », idée plausible mais non explicitée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » rend le nom propre et le distingue d’un titre tel que « le Seigneur ».
- issue: Alternance entre le destinataire pluriel du salut et le destinataire singulier de la remise de Madian
  choice: « je vous sauverai » puis « entre tes mains »
  alternative: Uniformiser les deux pronoms au singulier ou au pluriel
  rationale: L’hébreu passe intentionnellement du pluriel אֶתְכֶם, qui englobe Gédéon et les siens, au suffixe singulier יָדֶךָ adressé à Gédéon. La traduction préserve cette tension grammaticale et théologique.
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve l’image militaire hébraïque « entre tes mains », le collectif « tout le peuple » et le contraste entre « vous » pluriel et « tes » singulier. « Laper » reprend précisément l’action distinctive du contexte sans ajout explicatif dans le corps du verset.
