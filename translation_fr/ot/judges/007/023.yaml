base_translation:
  language: en
  yaml_path: translation/ot/judges/007/023.yaml
  text: And the men of Israel were called out from Naphtali[a], from Asher, and from all Manasseh[c][b], and they pursued Midian.
translation:
  language: fr
  text: Les hommes d’Israël[b] furent mobilisés[a], ceux de Nephtali, d’Aser et de tout Manassé, et ils poursuivirent Madian[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent appelés au combat » ou « furent rassemblés ». Le verbe hébreu est difficile ici; son radical est habituellement associé au cri, mais le contexte évoque un rassemblement en vue de la poursuite.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « l’homme d’Israël », expression collective désignant ici les hommes d’Israël.
    reason: lexical_alternative
  - marker: c
    text: « Madian » désigne ici les forces madianites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק
  choice: furent mobilisés
  rationale: Le niphal de צעק est difficile ici. Dans ce contexte militaire, il exprime vraisemblablement le rassemblement des Israélites pour la poursuite. « Furent mobilisés » rend naturellement cette valeur passive sans adopter le sens actif habituel « crièrent ».
- source_word: אִישׁ יִשְׂרָאֵל
  choice: les hommes d’Israël
  rationale: Le singulier hébreu est collectif; le verbe pluriel qui suit confirme qu’il désigne plusieurs hommes. Cette formulation conserve la référence masculine du texte tout en étant idiomatique en français.
- source_word: מִנַּפְתָּלִי וּמִן אָשֵׁר וּמִן כָּל מְנַשֶּׁה
  choice: ceux de Nephtali, d’Aser et de tout Manassé
  rationale: La préposition מן indique l’origine tribale des hommes rassemblés. « Ceux de » évite en français l’enchaînement peu naturel « les hommes furent mobilisés de… », tandis que « tout Manassé » préserve la portée de כָּל.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי מִדְיָן
  choice: ils poursuivirent Madian
  rationale: Avec רדף, אַחֲרֵי introduit idiomatiquement l’objet de la poursuite. « Madian » est conservé comme métonymie des forces madianites.
