source:
  edition: WLC
  text: וּ/מַלְאָכִ֡ים שָׁלַ֣ח גִּדְעוֹן֩ בְּ/כָל הַ֨ר אֶפְרַ֜יִם לֵ/אמֹ֗ר רְד֞וּ לִ/קְרַ֤את מִדְיָן֙ וְ/לִכְד֤וּ לָ/הֶם֙ אֶת הַ/מַּ֔יִם עַ֛ד בֵּ֥ית בָּרָ֖ה וְ/אֶת הַ/יַּרְדֵּ֑ן וַ/יִּצָּעֵ֞ק כָּל אִ֤ישׁ אֶפְרַ֨יִם֙ וַ/יִּלְכְּד֣וּ אֶת הַ/מַּ֔יִם עַ֛ד בֵּ֥ית בָּרָ֖ה וְ/אֶת הַ/יַּרְדֵּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/024.yaml
  text: And Gideon sent messengers throughout all the hill country of Ephraim[a], saying, “Come down against Midian, and seize the waters as far as Beth-barah, and the Jordan.” So every man of Ephraim was called out, and they seized the waters as far as Beth-barah[c][b], and the Jordan.
translation:
  language: fr
  text: 'Gédéon envoya des messagers dans toute la région montagneuse d’Éphraïm, avec cet ordre : « Descendez à la rencontre de Madian et emparez-vous des eaux[a] jusqu’à Beth-Bara, ainsi que du Jourdain. » Alors tous les hommes d’Éphraïm[b] furent convoqués[c] ; ils s’emparèrent des eaux jusqu’à Beth-Bara, ainsi que du Jourdain.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des cours d’eau » ou « des gués ». L’hébreu dit littéralement « les eaux » ; dans ce contexte, il s’agit probablement de points de passage stratégiques.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tout homme d’Éphraïm ». Ce singulier collectif désigne vraisemblablement les hommes d’Éphraïm aptes au combat, considérés comme un groupe.
    reason: lexical_alternative
  - marker: c
    text: La forme verbale hébraïque est difficile. On pourrait la comprendre plus littéralement au sens de « poussa un cri », mais le contexte favorise ici « furent convoqués » ou « furent mobilisés ».
    reason: alternative_reading
lexical_decisions:
- source_word: וּמַלְאָכִים
  choice: des messagers
  rationale: Dans ce récit, le terme désigne des envoyés humains chargés de transmettre un ordre, et non des êtres célestes.
- source_word: בְּכָל הַר אֶפְרַיִם
  choice: dans toute la région montagneuse d’Éphraïm
  rationale: הַר désigne ici la zone de hautes terres d’Éphraïm plutôt qu’un sommet isolé. Cette formulation est géographiquement précise et naturelle en français.
- source_word: לֵאמֹר
  choice: avec cet ordre
  rationale: Dans ce contexte militaire, la formule introduit le contenu du message impératif. « Avec cet ordre » évite le calque pesant « en disant » tout en conservant sa fonction narrative.
- source_word: רְדוּ לִקְרַאת מִדְיָן
  choice: Descendez à la rencontre de Madian
  rationale: « Descendez » préserve le mouvement topographique depuis les hautes terres. « À la rencontre de » maintient l’expression hébraïque et laisse le contexte militaire indiquer qu’il s’agit d’intercepter ou d’affronter Madian.
- source_word: וְלִכְדוּ לָהֶם
  choice: et emparez-vous
  rationale: Le verbe לכד signifie saisir ou prendre. Le pronom datif est difficile à reproduire sans surinterprétation en français ; le commandement central est donc rendu directement.
- source_word: אֶת הַמַּיִם
  choice: des eaux
  rationale: La traduction conserve l’expression générale et littérale de l’hébreu. Le contexte peut viser les cours d’eau, les gués ou d’autres points de passage stratégiques, ce qui est signalé en note.
- source_word: עַד בֵּית בָּרָה
  choice: jusqu’à Beth-Bara
  rationale: עַד indique ici l’étendue spatiale. Le nom du lieu est translittéré sous une forme française claire.
- source_word: וְאֶת הַיַּרְדֵּן
  choice: ainsi que du Jourdain
  rationale: « Le Jourdain » est la forme française établie. « Ainsi que » rend lisible la coordination avec « des eaux » sans préciser indûment la relation géographique exacte.
- source_word: וַיִּצָּעֵק כָּל אִישׁ אֶפְרַיִם
  choice: Alors tous les hommes d’Éphraïm furent convoqués
  rationale: Dans la suite de l’envoi des messagers, le contexte favorise l’idée d’une convocation ou mobilisation. Le pluriel naturel en français exprime le singulier collectif hébreu, tandis qu’une note conserve la difficulté verbale.
- source_word: וַיִּלְכְּדוּ
  choice: ils s’emparèrent
  rationale: Cette reprise du même verbe que dans l’ordre de Gédéon maintient la cohérence lexicale et montre l’exécution du commandement.
