  text: וְ/תָקַעְתִּי֙ בַּ/שּׁוֹפָ֔ר אָנֹכִ֖י וְ/כָל אֲשֶׁ֣ר אִתִּ֑/י וּ/תְקַעְתֶּ֨ם בַּ/שּׁוֹפָר֜וֹת גַּם אַתֶּ֗ם סְבִיבוֹת֙ כָּל הַֽ/מַּחֲנֶ֔ה וַ/אֲמַרְתֶּ֖ם לַ/יהוָ֥ה וּ/לְ/גִדְעֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/018.yaml
  text: When I and all who are with me blow the ram’s horn[a], then you also must blow the horns all around the whole camp, and say[b], ‘For Yahweh and for Gideon!’
translation:
  language: fr
  text: 'Quand tous ceux qui sont avec moi et moi sonnerons du cor[a], vous aussi, sonnez du cor tout autour du camp, et dites : « Pour Yahweh et pour Gédéon ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne un cor fait d’une corne animale, souvent d’une corne de bélier, et non une trompette métallique.
    reason: cultural_note
  - marker: b
    text: 'Certaines traductions donnent ici : « L’épée de Yahweh et de Gédéon ! », sous l’influence de Juges 7.20. Dans ce verset, l’hébreu dit simplement : « Pour Yahweh et pour Gédéon ! »'
    reason: alternative_reading
lexical_decisions:
- source_word: תָקַעְתִּי / תְקַעְתֶּם
  choice: sonnerai / sonnerez
  rationale: Avec שׁוֹפָר, le verbe תקע désigne l’action de souffler dans un cor pour le faire retentir. « Sonner du cor » est l’expression française naturelle qui conserve cette action concrète.
- source_word: שׁוֹפָר / שׁוֹפָרוֹת
  choice: cor / cors
  rationale: Le שׁוֹפָר est un instrument fait d’une corne animale, souvent d’une corne de bélier, et non une trompette métallique. « Cor » est clair en français courant et permet de conserver le singulier puis le pluriel de l’hébreu.
- source_word: אָנֹכִי וְכָל אֲשֶׁר אִתִּי
  choice: moi et tous ceux qui sont avec moi
  rationale: La formulation désigne Gédéon et les hommes qui l’accompagnent. Elle reste proche de l’hébreu tout en étant naturelle en français.
- source_word: גַּם אַתֶּם
  choice: vous … aussi
  rationale: גם inclut les destinataires dans l’action et leur donne un certain relief. La tournure française conserve cette valeur sans ajouter d’emphase excessive.
- source_word: סְבִיבוֹת כָּל הַמַּחֲנֶה
  choice: tout autour du camp
  rationale: Cette expression rend l’idée d’un encerclement complet. En français, « tout autour du camp » exprime naturellement à la fois סביבות et la totalité indiquée par כל.
- source_word: וַאֲמַרְתֶּם
  choice: vous direz
  rationale: אמר est le verbe ordinaire « dire ». Le contexte peut impliquer un cri puissant, mais le texte ne précise pas « crier » ; « direz » évite donc d’ajouter une intensité absente de l’hébreu.
- source_word: לַיהוָה וּלְגִדְעוֹן
  choice: Pour Yahweh et pour Gédéon
  rationale: La préposition ל est répétée devant les deux noms. Dans ce cri de guerre, « pour » exprime naturellement l’allégeance ou le ralliement et préserve le parallélisme hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le nom divin יהוה. « Yahweh » le représente comme nom propre au lieu de le remplacer par un titre.
- issue: Forme du cri לַיהוָה וּלְגִדְעוֹן
  choice: Pour Yahweh et pour Gédéon !
  alternative: L’épée de Yahweh et de Gédéon !
  rationale: Dans ce verset, le texte hébreu ne contient pas le mot « épée ». La traduction conserve donc la formule brève et sa tension propre, sans lui importer les mots du verset 20.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe temporelle introduite par « Quand » rend naturellement l’enchaînement des actions. Le vocabulaire reste concret, sans archaïsme ni amplification militaire absente du texte.
