  text: וַ/יֹּ֨אמֶר֙ שָׂרֵ֣י סֻכּ֔וֹת הֲ֠/כַף זֶ֧בַח וְ/צַלְמֻנָּ֛ע עַתָּ֖ה בְּ/יָדֶ֑/ךָ כִּֽי נִתֵּ֥ן לִֽ/צְבָאֲ/ךָ֖ לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/006.yaml
  text: Then the leaders of Succoth said, “Are the hands of Zebah and Zalmunna already in your hand, that we should give bread to your army?”
translation:
  language: fr
  text: 'Les chefs de Soukkoth répondirent : « As-tu déjà Zébah et Tsalmounna en ton pouvoir, pour que nous donnions du pain à ton armée ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי סֻכּוֹת
  choice: les chefs de Soukkoth
  rationale: שָׂרֵי désigne ici les dirigeants de la ville; « chefs » est naturel et conserve leur rôle collectif.
- source_word: הֲכַף זֶבַח וְצַלְמֻנָּע
  choice: Tiens-tu déjà Zébah et Tsalmounna entre tes mains
  rationale: L’hébreu dit littéralement « la paume/main de Zébah et de Tsalmounna », métonymie probable pour leur personne ou leur pouvoir. La formulation française exprime l’idée de les avoir capturés sans reproduire une tournure obscure.
- source_word: עַתָּה
  choice: déjà
  rationale: Dans cette question sarcastique, עַתָּה (« maintenant ») implique qu’ils ne sont pas encore capturés; « déjà » restitue naturellement cette nuance.
- source_word: לִצְבָאֲךָ
  choice: à ton armée
  rationale: צָבָא peut désigner une troupe ou une armée; « armée » convient au groupe militaire de Gédéon et reste accessible.
theological_decisions:
- issue: Sens de l’expression « la main de Zébah et de Tsalmounna »
  choice: 'Rendre l’expression comme la capture des deux rois : « Tiens-tu… Zébah et Tsalmounna entre tes mains »'
  alternative: « La main de Zébah et de Tsalmounna est-elle déjà en ton pouvoir ? »
  rationale: Le contexte présente le refus des chefs de Soukkoth d’aider Gédéon avant la capture des rois. La traduction conserve l’image de la main tout en évitant de suggérer que seules leurs mains physiques seraient en jeu.
translation_notes:
  register: 'Français international moderne, direct et digne. La question garde son ton sceptique et provocateur. Les noms propres suivent des translittérations françaises usuelles : Soukkoth, Zébah, Tsalmounna.'
