    rationale: « Tel est l’homme, telle est sa force » est littéral et possible, mais il peut sembler elliptique ou obscur en français. Une formulation indiquant que la force est « à la mesure de l’homme » conserve l’ambiguïté entre force, stature et valeur, tout en étant plus intelligible.
