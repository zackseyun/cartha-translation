  text: וַ/יֹּ֜אמֶר זֶ֣בַח וְ/צַלְמֻנָּ֗ע ק֤וּם אַתָּה֙ וּ/פְגַע בָּ֔/נוּ כִּ֥י כָ/אִ֖ישׁ גְּבוּרָת֑/וֹ וַ/יָּ֣קָם גִּדְע֗וֹן וַֽ/יַּהֲרֹג֙ אֶת זֶ֣בַח וְ/אֶת צַלְמֻנָּ֔ע וַ/יִּקַּח֙ אֶת הַ/שַּׂ֣הֲרֹנִ֔ים אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/021.yaml
  text: Then Zebah and Zalmunna said[a], “Rise yourself and strike us down, for as the man is, so is his strength.” So Gideon rose and killed Zebah and Zalmunna[c][b], and he took the crescent ornaments that were on the necks of their camels.
translation:
  language: fr
  text: 'Alors Zébah et Tsalmunna dirent : « Lève-toi toi-même et frappe-nous[a] ! Car la force d’un homme est à la mesure de l’homme. » Gédéon se leva donc, tua Zébah et Tsalmunna, puis prit les ornements en forme de croissant[b] qui étaient au cou de leurs chameaux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et tue-nous ». Dans ce contexte, le verbe désigne un coup mortel.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les croissants » ; il s’agit d’ornements en forme de croissant de lune.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר זֶבַח וְצַלְמֻנָּע
  choice: Alors Zébah et Tsalmunna dirent
  rationale: Le verbe hébreu au singulier devant un sujet composé relève d’un usage narratif idiomatique ; le français exige ici le pluriel. « Alors » rend naturellement la progression marquée par le waw narratif.
- source_word: קוּם אַתָּה
  choice: Lève-toi, toi
  rationale: 'Le pronom explicite אַתָּה renforce l’impératif : les deux rois demandent que Gédéon lui-même exécute la sentence. La dislocation française conserve cette insistance.'
- source_word: וּפְגַע בָּנוּ
  choice: et frappe-nous
  rationale: פגע peut signifier rencontrer, attaquer ou frapper. Dans ce contexte d’exécution, le coup est manifestement mortel, mais « frappe-nous » préserve la formulation du texte sans rendre implicitement le verbe par « tuer » ; cette lecture est signalée en note.
- source_word: כִּי כָאִישׁ גְּבוּרָתוֹ
  choice: Car tel est l’homme, telle est sa force
  rationale: Cette formulation française conserve le parallélisme concis et proverbial de l’hébreu. Elle laisse ouverte la nuance exacte de גְּבוּרָה, qui peut évoquer la force ou la vaillance.
- source_word: וַיָּקָם גִּדְעוֹן
  choice: Gédéon se leva donc
  rationale: La reprise de « se leva » fait écho à l’impératif précédent, tandis que « donc » exprime la réponse de Gédéon dans le fil narratif.
- source_word: וַיַּהֲרֹג
  choice: tua
  rationale: Traduction directe, claire et actuelle du verbe courant הרג.
- source_word: הַשַּׂהֲרֹנִים
  choice: les ornements en forme de croissant
  rationale: Le nom désigne des objets en forme de croissant, vraisemblablement des pendentifs. « Ornements » explicite leur fonction d’après le contexte immédiat sans les identifier plus précisément que le texte.
- source_word: אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: qui étaient au cou de leurs chameaux
  rationale: Rendu idiomatique et exact de la proposition relative indiquant où se trouvaient les ornements.
theological_decisions:
- issue: Expression proverbiale masculine כָאִישׁ
  choice: tel est l’homme, telle est sa force
  alternative: telle est la personne, telle est sa force
  rationale: Le contexte concerne explicitement la capacité d’un guerrier masculin à donner la mort. Conserver « l’homme » respecte à la fois la forme masculine du texte et la portée contextuelle du proverbe, sans la généraliser ni la neutraliser.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe proverbiale est volontairement concise. La répétition de « se lever » conserve l’écho verbal de l’hébreu, et les marques d’insistance restent naturelles à l’oral comme à l’écrit.
