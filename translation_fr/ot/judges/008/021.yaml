  source_fidelity: 'Le sens narratif et les principaux termes hébreux sont fidèlement rendus : l’impératif emphatique, l’exécution par Gédéon et les ornements en croissant au cou des chameaux sont tous conservés. La sentence proverbiale doit toutefois être formulée plus clairement en français afin d’exprimer que la force est à la mesure de l’homme, sans lui attribuer une portée théologique ou interprétative supplémentaire.'
  naturalness: « Lève-toi, toi » est compréhensible, mais la dislocation est raide en français international moderne. « Lève-toi toi-même » conserve l’insistance du pronom אַתָּה avec une formulation plus idiomatique. « La force d’un homme est à la mesure de l’homme » rend le parallélisme proverbial de manière claire et naturelle.
  terminology: Les noms « Zébah », « Tsalmunna » et « Gédéon » sont cohérents. « Ornements en forme de croissant » est exact et évite de préciser indûment la nature des objets. La note sur פגע signale utilement l’alternative explicitement létale.
