  rationale: La révision conserve les choix français solides du projet, tout en retirant deux explicitations non nécessaires. Elle maintient le référent pluriel tel que le laisse la formulation hébraïque, ensuite caractérisé comme ismaélite, et rend directement « un anneau de son butin ».
