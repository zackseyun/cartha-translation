base_translation:
  language: en
  yaml_path: translation/ot/judges/008/024.yaml
  text: 'Then Gideon said to them, “Let me ask one request of you: each man, give me an earring from his spoil.” For they had gold earrings, because they were Ishmaelites.'
translation:
  language: fr
  text: 'Gédéon leur dit : « J’ai une demande à vous faire : que chacun de vous me donne un anneau de son butin. » Car ils avaient des anneaux d’or, car ils étaient Ismaélites.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה
  choice: J’ai une demande à vous faire
  rationale: Cette tournure française naturelle rend l’expression hébraïque emphatique « je veux vous demander une demande » sans lourdeur artificielle.
- source_word: אִישׁ
  choice: chacun de vous
  rationale: Dans cette construction distributive, אִישׁ signifie que chaque homme doit donner un objet; « chacun de vous » exprime clairement cette valeur.
- source_word: נֶזֶם
  choice: anneau
  rationale: Le terme désigne un anneau porté comme bijou, à l’oreille ou au nez selon le contexte. L’hébreu ne précisant pas ici l’emplacement, « anneau » préserve cette ambiguïté.
- source_word: שְׁלָלוֹ
  choice: son butin
  rationale: 'Le suffixe singulier distributif est conservé : chacun donne un anneau provenant de la part de butin qu’il a prise.'
- source_word: לָהֶם
  choice: les ennemis avaient
  rationale: Le pronom renvoie vraisemblablement aux adversaires dépouillés plutôt qu’aux interlocuteurs de Gédéon. L’explicitation évite en français une référence pronominale trompeuse.
- source_word: יִשְׁמְעֵאלִים
  choice: Ismaélites
  rationale: Translittération française traditionnelle du nom ethnique; dans ce récit, le terme caractérise les adversaires madianites sans qu’il faille harmoniser ou effacer cette désignation.
theological_decisions:
- issue: Rapport entre les Madianites du récit et l’appellation « Ismaélites »
  choice: Conserver « Ismaélites » tel quel
  alternative: Remplacer par « Madianites » ou expliquer qu’il s’agit d’un terme général
  rationale: Le texte source emploie explicitement יִשְׁמְעֵאלִים. La traduction ne doit ni harmoniser les ethnonymes ni imposer une théorie sur leur rapport.
translation_notes:
  register: Français international moderne, narratif et digne. La demande directe reste concise. « Anneau » est préféré à « boucle d’oreille » afin de ne pas préciser au-delà de l’hébreu.
