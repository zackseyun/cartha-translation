base_translation:
  language: en
  yaml_path: translation/ot/judges/008/005.yaml
  text: And he said to the men of Succoth[a], “Please give loaves of bread to the people who are with me, for they are weary, and I am pursuing Zebah and Zalmunna, the kings of Midian.”
translation:
  language: fr
  text: 'Il dit aux hommes de Soukkoth : « Donnez, je vous prie, des miches de pain aux gens qui m’accompagnent[a], car ils sont fatigués. Quant à moi, je poursuis Zébah et Tsalmunna, les rois de Madian. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le peuple qui est à mes pieds », expression désignant ceux qui l’accompagnent ou le suivent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַנְשֵׁי סֻכּוֹת
  choice: aux hommes de Soukkoth
  rationale: אַנְשֵׁי désigne ici les hommes de la ville, probablement ses représentants masculins. « Soukkoth » suit une translittération française courante du nom hébreu.
- source_word: תְּנוּ נָא
  choice: Donnez, je vous prie
  rationale: L’impératif accompagné de נָא exprime une demande pressante mais courtoise ; cette tournure conserve les deux nuances dans un français digne et naturel.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: des miches de pain
  rationale: כִּכָּר désigne ici un pain formé, traditionnellement rond. « Miches de pain » est concret et idiomatique sans imposer inutilement sa forme.
- source_word: לָעָם אֲשֶׁר בְּרַגְלָי
  choice: aux gens qui m’accompagnent[a]
  rationale: L’expression signifie littéralement « le peuple qui est à mes pieds » et désigne ceux qui marchent avec Gédéon ou à sa suite. Le sens idiomatique figure dans le texte, tandis que l’image hébraïque est signalée en note.
- source_word: עֲיֵפִים
  choice: fatigués
  rationale: Le terme exprime la fatigue causée par l’effort. « Fatigués » reste exact et n’accentue pas le texte jusqu’à suggérer nécessairement l’épuisement total.
- source_word: וְאָנֹכִי רֹדֵף אַחֲרֵי
  choice: Quant à moi, je poursuis
  rationale: Le pronom אָנֹכִי est explicite et légèrement emphatique ; « quant à moi » le fait entendre. Le participe רֹדֵף exprime une poursuite en cours.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Zébah et Tsalmunna
  rationale: Les noms propres sont translittérés selon des formes françaises bibliques claires, avec une représentation distincte des consonnes initiales hébraïques.
- source_word: מַלְכֵי מִדְיָן
  choice: les rois de Madian
  rationale: Cette formulation rend directement la construction hébraïque et emploie la forme française traditionnelle et largement reconnue « Madian ».
