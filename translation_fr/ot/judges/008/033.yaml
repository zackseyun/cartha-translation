  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר֙ מֵ֣ת גִּדְע֔וֹן וַ/יָּשׁ֨וּבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּזְנ֖וּ אַחֲרֵ֣י הַ/בְּעָלִ֑ים וַ/יָּשִׂ֧ימוּ לָ/הֶ֛ם בַּ֥עַל בְּרִ֖ית לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/033.yaml
  text: And it happened that[a], when Gideon died, the sons of Israel turned back and prostituted themselves after the Baals[b], and they made Baal-berith their god.
translation:
  language: fr
  text: Après la mort de Gédéon, les Israélites recommencèrent à se prostituer en suivant les Baals[a] et se donnèrent Baal-Berith pour dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici une image sexuelle pour parler de l’infidélité idolâtre d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Baal-Berith signifie probablement « Baal de l’alliance » ou « Seigneur de l’alliance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר מֵת גִּדְעוֹן
  choice: Après la mort de Gédéon
  rationale: La formule narrative introduit une transition temporelle. Cette tournure française naturelle conserve clairement le rapport temporel sans reproduire lourdement l’hébraïsme « il arriva que, lorsque ».
- source_word: וַיָּשׁוּבוּ
  choice: recommencèrent
  rationale: Le verbe שׁוב signale ici une rechute dans l’idolâtrie antérieure. « Recommencèrent » exprime ce retour au comportement passé.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression désigne collectivement le peuple d’Israël. « Les Israélites » est idiomatique, inclusif dans ce contexte collectif et immédiatement compréhensible en français moderne.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: à se prostituer en suivant
  rationale: Le verbe זנה emploie délibérément une image sexuelle pour dénoncer l’infidélité idolâtre. « Se prostituer » en préserve la force, tandis que « en suivant » rend naturellement אַחֲרֵי.
- source_word: הַבְּעָלִים
  choice: les Baals
  rationale: Le pluriel renvoie aux diverses manifestations locales du culte de Baal. La forme « les Baals » est concise et transparente.
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: se donnèrent
  rationale: La construction exprime l’adoption ou la désignation d’une divinité pour eux-mêmes. « Se donnèrent » restitue à la fois l’acte de choisir et la valeur réfléchie de לָהֶם.
- source_word: בַּעַל בְּרִית
  choice: Baal-Berith
  rationale: Il s’agit d’un nom cultuel propre. Sa translittération évite de trancher dans le texte entre les sens possibles de ses éléments, lesquels sont indiqués en note.
- source_word: לֵאלֹהִים
  choice: pour dieu
  rationale: Le ל marque ici la désignation de Baal-Berith comme divinité. La minuscule distingue naturellement en français ce faux dieu du Dieu d’Israël.
theological_decisions:
- issue: Maintien de la métaphore sexuelle de l’idolâtrie
  choice: se prostituer en suivant les Baals
  alternative: être infidèles en suivant les Baals
  rationale: L’hébreu emploie explicitement זנה. Conserver cette image maintient la gravité de l’apostasie et la dimension d’infidélité implicite, sans l’expliciter au-delà du texte.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Dans ce passage, l’expression vise le peuple dans son ensemble, non uniquement des hommes. La formulation idiomatique française transmet ce référent collectif sans imposer un calque susceptible d’être mal compris.
- issue: Statut de Baal-Berith
  choice: se donnèrent Baal-Berith pour dieu
  alternative: établirent Baal-Berith comme leur dieu
  rationale: La formulation retenue rend l’adoption volontaire de cette divinité tout en évitant d’ajouter une précision institutionnelle absente de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La métaphore forte de l’hébreu est conservée, et le nom cultuel est translittéré puis expliqué en note.
