source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לְ/יֶ֣תֶר בְּכוֹר֔/וֹ ק֖וּם הֲרֹ֣ג אוֹתָ֑/ם וְ/לֹא שָׁלַ֨ף הַ/נַּ֤עַר חַרְבּ/וֹ֙ כִּ֣י יָרֵ֔א כִּ֥י עוֹדֶ֖/נּוּ נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/020.yaml
  text: Then he said to Jether his firstborn[a], “Get up, kill them.” But the young man did not draw his sword, because he was afraid, for he was still a young man.
translation:
  language: fr
  text: 'Puis il dit à Yéter, son premier-né : « Lève-toi, tue-les. » Mais le jeune homme[a] ne tira pas son épée, car il avait peur : il était encore jeune.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi se traduire par « garçon » ou « adolescent » ; il couvre une période allant de l’enfance à l’âge de jeune adulte. Ici, « jeune homme » convient au fait que Yéter porte une épée et est jugé capable de mettre à mort des prisonniers.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis il dit
  rationale: Le waw consécutif fait progresser le récit ; « Puis » exprime naturellement cette succession en français.
- source_word: לְיֶתֶר
  choice: à Yéter
  rationale: Le nom propre est translittéré selon sa forme hébraïque, avec une graphie adaptée au français.
- source_word: בְּכוֹרוֹ
  choice: son premier-né
  rationale: Cette expression conserve la notion précise de rang de naissance portée par בְּכוֹר, plutôt que de la réduire à « son fils aîné ».
- source_word: קוּם
  choice: Lève-toi
  rationale: Impératif direct, idiomatique et digne en français contemporain.
- source_word: הֲרֹג אוֹתָם
  choice: tue-les
  rationale: הרג est le verbe ordinaire signifiant tuer ; cette traduction directe évite une formulation archaïque ou euphémique.
- source_word: וְלֹא שָׁלַף
  choice: Mais … ne tira pas
  rationale: « Mais » rend le contraste entre l'ordre donné et l'inaction de Yéter ; « tirer son épée » est l'expression française naturelle correspondante.
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: נַעַר peut désigner un garçon, un adolescent ou un jeune homme. Le contexte — il porte une épée et reçoit l'ordre d'exécuter des captifs — favorise ici « jeune homme » sans fixer précisément son âge.
- source_word: חַרְבּוֹ
  choice: son épée
  rationale: Correspondance directe du nom avec suffixe possessif.
- source_word: כִּי יָרֵא
  choice: car il avait peur
  rationale: כִּי introduit ici la cause de son refus d'agir ; « car » conserve clairement ce rapport explicatif.
- source_word: כִּי עוֹדֶנּוּ נָעַר
  choice: il était encore jeune
  rationale: עוֹדֶנּוּ marque la continuité (« encore »). Cette formulation française naturelle reprend l'idée de נַעַר sans suggérer un âge plus précis que l'hébreu.
theological_decisions: []
translation_notes:
  register: Français international contemporain, narratif et digne. Les impératifs restent directs, et la violence explicite du texte n’est ni atténuée ni amplifiée. Les deux propositions causales finales sont reliées par deux-points afin de préserver leur enchaînement tout en évitant une répétition lourde de « car ».
