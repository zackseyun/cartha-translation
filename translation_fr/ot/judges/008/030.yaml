base_translation:
  language: en
  yaml_path: translation/ot/judges/008/030.yaml
  text: Gideon had seventy sons[a], his own offspring, because he had many wives.
translation:
  language: fr
  text: Gédéon eut soixante-dix fils[a], issus de lui, car il avait de nombreuses épouses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sortis de sa cuisse », expression qui désigne ses descendants biologiques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגִדְעוֹן הָיוּ
  choice: Gédéon eut
  rationale: La construction היה avec ל exprime ici la possession. En français narratif, « Gédéon eut » rend naturellement cette tournure, sans ajouter un marqueur temporel absent du texte.
- source_word: שִׁבְעִים בָּנִים
  choice: soixante-dix fils
  rationale: בָּנִים désigne ici des fils, et non des enfants au sens générique.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: issus de lui
  rationale: L’expression hébraïque signifie littéralement « sortis de sa cuisse » et désigne ses descendants biologiques directs. « Issus de lui » en conserve le sens dans un français naturel et digne.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison du grand nombre de fils. « Car » convient au registre narratif et garde le lien explicatif.
- source_word: נָשִׁים רַבּוֹת הָיוּ לוֹ
  choice: il avait beaucoup de femmes
  rationale: Dans ce contexte familial, נָשִׁים désigne les femmes de Gédéon, c’est-à-dire ses épouses. En français biblique courant, « avoir beaucoup de femmes » exprime cette relation matrimoniale sans lourdeur ni commentaire moral.
theological_decisions:
- issue: Description d’un foyer polygame
  choice: Traduire de façon descriptive par « il avait beaucoup de femmes », sans commentaire moral.
  alternative: Employer « de nombreuses épouses » ou ajouter une appréciation morale.
  rationale: Le verset rapporte la situation familiale de Gédéon sans l’approuver ni la condamner explicitement. La traduction ne doit ni masquer le sens matrimonial ni importer un jugement absent du texte.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste accessible tout en conservant en note l’image corporelle de l’idiome hébreu.
