source:
  edition: WLC
  text: וַ/יָּ֛מָת גִּדְע֥וֹן בֶּן יוֹאָ֖שׁ בְּ/שֵׂיבָ֣ה טוֹבָ֑ה וַ/יִּקָּבֵ֗ר בְּ/קֶ֨בֶר֙ יוֹאָ֣שׁ אָבִ֔י/ו בְּ/עָפְרָ֖ה אֲבִ֥י הָֽעֶזְרִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/032.yaml
  text: And Gideon son of Joash died at a good old age and was buried in the tomb of Joash his father[b][a], in Ophrah of the Abiezrites.
translation:
  language: fr
  text: Gédéon, fils de Joas, mourut dans une heureuse vieillesse. Il fut enterré dans le tombeau[a] de Joas, son père, à Ofra des Abiézerites[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la tombe ». Le mot hébreu קֶבֶר peut désigner une tombe, un tombeau ou un lieu de sépulture.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à Ofra de l’Abiézerite », c’est-à-dire l’Ofra appartenant au clan d’Abiézer.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le verbe מות signifie directement « mourir ». Le passé simple convient au registre narratif français sans atténuer l’énoncé.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: Gédéon, fils de Joas
  rationale: Forme française traditionnelle et largement reconnue des noms, avec une apposition naturelle qui rend la filiation.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: dans une heureuse vieillesse
  rationale: שֵׂיבָה désigne la vieillesse et טוֹבָה la qualifie positivement. Cette formulation conserve cette appréciation sans ajouter l’idée absente d’une vie « comblée de jours ».
- source_word: וַיִּקָּבֵר
  choice: Il fut enterré
  rationale: Le nifal de קבר a ici un sens passif. Une nouvelle phrase allège l’enchaînement en français tout en conservant la progression narrative.
- source_word: בְּקֶבֶר
  choice: dans le tombeau
  rationale: קֶבֶר peut désigner une tombe, un tombeau ou un lieu de sépulture. « Tombeau » convient bien à une sépulture familiale, tout en laissant l’autre possibilité en note.
- source_word: יוֹאָשׁ אָבִיו
  choice: de Joas, son père
  rationale: Cette tournure naturelle conserve l’identification explicite de Joas comme père de Gédéon.
- source_word: בְּעָפְרָה
  choice: à Ofra
  rationale: Transcription française usuelle du nom de lieu, précédée de la préposition idiomatique pour une localité.
- source_word: אֲבִי הָעֶזְרִי
  choice: des Abiézerites
  rationale: Le gentilé singulier hébreu rattache Ofra au groupe clanique d’Abiézer. Le pluriel français exprime naturellement cette appartenance collective.
theological_decisions: []
translation_notes:
  register: Français narratif moderne, simple et digne. Le passé simple maintient le registre du récit biblique sans archaïsme marqué. La ponctuation répartit les deux actions principales en deux phrases pour une lecture fluide.
