  rationale: La révision remplace un calque syntaxique peu idiomatique par une formulation française naturelle, tout en conservant le sens de la relation de subjugation. Elle modernise aussi légèrement l’expression temporelle. L’idiome central est maintenu et sa gamme de sens reste signalée en note.
