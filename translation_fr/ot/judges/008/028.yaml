    rationale: Bien que « devant » reproduise formellement לִפְנֵי, la tournure française usuelle pour une subjugation militaire est « être soumis par ». Elle conserve le sens relationnel et l’agent implicite dans l’idiome hébreu.
  - severity: low
    issue: « Aux jours de Gédéon » est légèrement littéraire ou calqué.
    rationale: « Du temps de Gédéon » est plus naturel en français international contemporain, sans réduire l’expression à la seule durée de vie de Gédéon.
  revised_text: Ainsi, Madian fut soumis par les Israélites, et ils ne relevèrent plus la tête[a]. Le pays connut le repos pendant quarante ans, du temps de Gédéon.
