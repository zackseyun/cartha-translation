source:
  edition: WLC
  text: וַ/יִּכָּנַ֣ע מִדְיָ֗ן לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לֹ֥א יָסְפ֖וּ לָ/שֵׂ֣את רֹאשָׁ֑/ם וַ/תִּשְׁקֹ֥ט הָ/אָ֛רֶץ אַרְבָּעִ֥ים שָׁנָ֖ה בִּ/ימֵ֥י גִדְעֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/028.yaml
  text: So Midian was subdued before the sons of Israel[a], and they did not again lift up their head. And the land had rest forty years in the days of Gideon.
translation:
  language: fr
  text: Ainsi, Madian fut soumis par les Israélites, et ils ne relevèrent plus la tête[a]. Le pays connut le repos pendant quarante ans, du temps de Gédéon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ne retrouvèrent plus leur force » ou « ne levèrent plus la tête ».

      '
    reason: L’expression hébraïque peut désigner le retour de la force, de l’assurance ou de la capacité à s’affirmer.
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: fut soumis
  rationale: Le nifal de כנע exprime ici l’assujettissement de Madian dans un contexte militaire. « Fut soumis » conserve la valeur passive et reste naturel en français.
- source_word: לִפְנֵי
  choice: devant
  rationale: « Devant » reproduit sobrement l’idiome hébreu qui présente Madian comme soumis face à Israël, sans expliciter davantage l’agentivité.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Dans ce contexte, l’expression désigne conventionnellement le peuple d’Israël. « Les Israélites » est la formulation française moderne, claire et naturelle, sans modifier la portée ethnique du syntagme.
- source_word: וְלֹא יָסְפוּ
  choice: ne… plus
  rationale: Avec l’infinitif, יסף indique la répétition ou la reprise d’une action. La tournure « ne… plus » exprime naturellement qu’ils ne renouvelèrent pas leur puissance ou leur hardiesse.
- source_word: לָשֵׂאת רֹאשָׁם
  choice: relevèrent… la tête
  rationale: Cette traduction conserve l’image concrète de l’hébreu, qui peut évoquer le retour de l’assurance, de la puissance ou de la capacité d’agir.
- source_word: וַתִּשְׁקֹט
  choice: connut le repos
  rationale: Dans les résumés du livre des Juges, le verbe décrit une période d’accalmie et d’absence de guerre. « Connût le repos » serait archaïsant; « connut le repos » est actuel et digne.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Le terme renvoie ici au territoire habité par Israël. « Le pays » est idiomatique en français et convient au cadre national du récit.
- source_word: אַרְבָּעִים שָׁנָה
  choice: pendant quarante ans
  rationale: Le complément de durée est rendu explicitement et naturellement en français.
- source_word: בִּימֵי גִדְעוֹן
  choice: aux jours de Gédéon
  rationale: Cette expression conserve la forme temporelle hébraïque et évite de préciser indûment qu’il s’agit exactement de toute la durée de sa vie.
theological_decisions:
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Le syntagme est ici une désignation nationale conventionnelle. « Les Israélites » communique naturellement cette fonction en français moderne, tandis que « les fils d’Israël » pourrait être compris comme une référence littérale aux descendants immédiats de Jacob.
- issue: Préservation de l’idiome לָשֵׂאת רֹאשָׁם
  choice: relever la tête
  alternative: retrouver leur force
  rationale: L’image hébraïque est maintenue dans le texte afin de préserver sa richesse et son ambiguïté entre puissance, assurance et capacité de résistance; la note en précise les principales nuances sans en imposer une seule.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le parallélisme narratif du verset. L’idiome de la tête est préservé, tandis que la note expose ses nuances possibles.
