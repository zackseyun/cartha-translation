  text: וַ/יַּ֤עַל מִ/שָּׁם֙ פְּנוּאֵ֔ל וַ/יְדַבֵּ֥ר אֲלֵי/הֶ֖ם כָּ/זֹ֑את וַ/יַּעֲנ֤וּ אוֹת/וֹ֙ אַנְשֵׁ֣י פְנוּאֵ֔ל כַּ/אֲשֶׁ֥ר עָנ֖וּ אַנְשֵׁ֥י סֻכּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/008.yaml
  text: From there he went up to Penuel and spoke to them in the same way[b][a], and the men of Penuel answered him just as the men of Succoth had answered.
translation:
  language: fr
  text: De là, il monta à Penouel[a] et leur parla de la même manière[b]. Les hommes de Penouel lui répondirent comme les hommes de Souccoth lui avaient répondu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Penouel est aussi appelé « Peniel » dans d’autres passages.
    reason: alternative_reading
  - marker: b
    text: 'Plus littéralement : « et leur parla ainsi ». L’hébreu renvoie à la requête formulée au verset précédent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: il monta
  rationale: Le verbe עלה exprime un déplacement vers le haut. « Il monta » conserve cette nuance directionnelle dans un français naturel et concis.
- source_word: מִשָּׁם
  choice: De là
  rationale: Cette expression renvoie directement au lieu précédent et se rend naturellement par « De là ».
- source_word: פְּנוּאֵל
  choice: Penouel
  rationale: Translittération française courante de la forme consonantique présente dans ce verset.
- source_word: וַיְדַבֵּר אֲלֵיהֶם כָּזֹאת
  choice: et leur parla de la même manière
  rationale: L’expression signifie littéralement « leur parla ainsi ». Ici, elle renvoie au discours ou à la requête du verset précédent; cette formulation restitue clairement cette valeur anaphorique.
- source_word: וַיַּעֲנוּ אוֹתוֹ
  choice: lui répondirent
  rationale: ענה avec un complément direct signifie couramment « répondre à quelqu’un »; la tournure française avec complément indirect est idiomatique.
- source_word: אַנְשֵׁי פְנוּאֵל
  choice: Les hommes de Penouel
  rationale: אַנְשֵׁי désigne littéralement les « hommes de » la ville; le rendu conserve cette désignation masculine du texte hébreu.
- source_word: כַּאֲשֶׁר עָנוּ אַנְשֵׁי סֻכּוֹת
  choice: comme l’avaient fait ceux de Souccoth
  rationale: כַּאֲשֶׁר introduit la comparaison. « L’avaient fait » évite une répétition lourde de « répondre » tout en indiquant que la réponse de Souccoth était antérieure.
- source_word: סֻכּוֹת
  choice: Souccoth
  rationale: Forme française traditionnelle et reconnaissable du nom de lieu hébreu.
