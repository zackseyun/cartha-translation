base_translation:
  language: en
  yaml_path: translation/ot/judges/008/025.yaml
  text: And they said[a], “We will surely give them.” Then they spread out the cloak[c][b], and each man threw there an earring from his spoil.
translation:
  language: fr
  text: 'Ils répondirent[a] : « Nous les donnerons assurément. » Puis ils étendirent le manteau[b], et chacun y jeta un anneau[c] de son butin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu renforce le verbe « donner » par une construction emphatique : littéralement, « donner, nous donnerons ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « le vêtement » : il fut étendu pour recueillir les anneaux.'
    reason: cultural_note
  - marker: c
    text: Le terme hébreu peut désigner un anneau porté à l’oreille ou au nez.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן נִתֵּן
  choice: Oui, nous les donnerons
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. « Oui » rend cette insistance en français naturel sans introduire explicitement l’idée de joie ou d’empressement. Le pronom « les » reprend les anneaux demandés au verset précédent.
- source_word: הַשִּׂמְלָה
  choice: le manteau
  rationale: שִׂמְלָה désigne un vêtement, souvent un vêtement extérieur. « Manteau » donne ici une image concrète du vêtement étendu pour recueillir les objets.
- source_word: וַיִּפְרְשׂוּ
  choice: ils étendirent
  rationale: Le verbe פרשׂ signifie déployer ou étendre. « Étendirent » convient naturellement à un manteau ouvert pour servir de réceptacle.
- source_word: וַיַּשְׁלִיכוּ שָׁמָּה
  choice: y jeta
  rationale: שלך exprime l’action de jeter plutôt que simplement poser. Le français « y » reprend naturellement le manteau et rend שָׁמָּה sans la lourdeur de « jeta là ».
- source_word: אִישׁ
  choice: chacun
  rationale: אִישׁ a ici une valeur distributive. « Chacun » est idiomatique et maintient l’accord singulier avec l’action et le butin individuels.
- source_word: נֶזֶם
  choice: un anneau
  rationale: נֶזֶם peut désigner un anneau porté à l’oreille ou au nez. « Anneau » préserve cette ambiguïté lexicale dans le texte principal.
- source_word: שְׁלָלוֹ
  choice: pris dans son butin
  rationale: שָׁלָל désigne le butin de guerre. L’ajout idiomatique de « pris dans » explicite la relation exprimée par le suffixe possessif sans modifier le sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit. La formulation conserve l’emphase de la réponse et l’ambiguïté de נֶזֶם sans rendre la phrase artificielle.
