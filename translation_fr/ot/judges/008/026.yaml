source:
  edition: WLC
  text: וַ/יְהִ֗י מִשְׁקַ֞ל נִזְמֵ֤י הַ/זָּהָב֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶ֥לֶף וּ/שְׁבַע מֵא֖וֹת זָהָ֑ב לְ֠/בַד מִן הַ/שַּׂהֲרֹנִ֨ים וְ/הַ/נְּטִפ֜וֹת וּ/בִגְדֵ֣י הָ/אַרְגָּמָ֗ן שֶׁ/עַל֙ מַלְכֵ֣י מִדְיָ֔ן וּ/לְ/בַד֙ מִן הָ֣/עֲנָק֔וֹת אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/026.yaml
  text: And the weight of the gold rings that he requested was 1,700 shekels of gold[a], besides the crescent ornaments and the pendants and the purple garments that were on the kings of Midian[b], and besides the necklaces that were on the necks of their camels.
translation:
  language: fr
  text: Le poids des anneaux d’or qu’il avait demandés fut de 1 700 sicles d’or[a], sans compter les ornements en forme de croissant, les pendentifs et les vêtements de pourpre que portaient les rois de Madian, ni les colliers qui étaient au cou de leurs chameaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « 1 700 d’or »; « sicles » est ajouté comme unité de poids sous-entendue dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקַל
  choice: Le poids
  rationale: Le nom désigne une mesure de poids, et non une simple quantité.
- source_word: נִזְמֵי הַזָּהָב
  choice: des anneaux d’or
  rationale: נזם peut désigner un anneau porté à l’oreille ou au nez. « Anneaux » préserve cette indétermination.
- source_word: אֲשֶׁר שָׁאָל
  choice: qu’il avait demandés
  rationale: Le plus-que-parfait situe naturellement la demande avant la pesée rapportée ici.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת זָהָב
  choice: 1 700 sicles d’or
  rationale: L’hébreu dit littéralement « 1 700 d’or »; le sicle est l’unité de poids sous-entendue par le contexte.
- source_word: לְבַד מִן
  choice: sans compter … ni
  rationale: Cette tournure indique clairement que les objets suivants étaient exclus du poids précédent.
- source_word: הַשַּׂהֲרֹנִים
  choice: les ornements en forme de croissant
  rationale: Le terme désigne des ornements ayant vraisemblablement la forme d’un croissant.
- source_word: הַנְּטִפוֹת
  choice: les pendentifs
  rationale: Le mot évoque des ornements pendants; « pendentifs » reste précis sans surinterpréter leur usage.
- source_word: בִגְדֵי הָאַרְגָּמָן
  choice: les vêtements de pourpre
  rationale: Expression française naturelle pour des habits faits d’une étoffe teinte en pourpre.
- source_word: שֶׁעַל מַלְכֵי מִדְיָן
  choice: que portaient les rois de Madian
  rationale: Avec des vêtements, עַל exprime concrètement ce qui se trouvait sur les rois; « portaient » rend ce sens idiomatiquement.
- source_word: הָעֲנָקוֹת
  choice: les colliers
  rationale: Le terme désigne des ornements de cou, ici placés au cou des chameaux.
- source_word: בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: qui étaient au cou de leurs chameaux
  rationale: Rend directement et naturellement l’emplacement indiqué par l’hébreu.
theological_decisions: []
