  source_fidelity: 'Le sens de la menace est fidèlement rendu : לָכֵן garde sa valeur consécutive, בְּתֵת est correctement compris comme temporel et prospectif, et « Yahweh aura livré ... entre mes mains » rend bien l’idiome de remise au pouvoir de Gédéon. « Je battrai votre chair » conserve, autant que le permet le français, l’image violente du verbe דושׁ. La seconde catégorie de végétaux est cependant définie en hébreu (הַבַּרְקֳנִים), comme la première ; le français doit donc employer « les ronces » plutôt que « des ronces ».'
