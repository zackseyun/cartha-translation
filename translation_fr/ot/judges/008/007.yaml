base_translation:
  language: en
  yaml_path: translation/ot/judges/008/007.yaml
  text: And Gideon said[a], “Therefore, when Yahweh gives Zebah and Zalmunna into my hand, I will thresh your flesh with the thorns of the wilderness and with briers.”
translation:
  language: fr
  text: 'Gédéon dit : « C’est pourquoi, quand Yahweh aura livré Zéba et Tsalmunna entre mes mains, je battrai votre chair avec les épines du désert et avec les ronces[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des chardons » ; le terme hébreu désigne une plante épineuse, mais son espèce précise est incertaine.
    reason: Alternative lexicale due à l’incertitude botanique du terme הַבַּרְקֳנִים.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conséquence directe du refus des hommes de Soukkoth au verset précédent et conserve la force logique de la menace.
- source_word: בְּתֵת
  choice: quand … aura livré
  rationale: La préposition ב suivie de l’infinitif construit a ici une valeur temporelle. Le futur antérieur exprime naturellement en français l’action qui précédera le châtiment annoncé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: בְּיָדִי
  choice: entre mes mains
  rationale: Rend naturellement l’expression hébraïque signifiant livrer quelqu’un au pouvoir d’un autre, tout en conservant l’image concrète de la main.
- source_word: וְדַשְׁתִּי
  choice: je battrai
  rationale: Le verbe דושׁ désigne littéralement l’action de battre ou fouler le grain. « Battrai » conserve en français à la fois la métaphore agricole et la violence de la menace.
- source_word: בְּשַׂרְכֶם
  choice: votre chair
  rationale: Équivalent direct qui préserve le caractère cru et brutal de la menace.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: les épines du désert
  rationale: Conserve l’image végétale et le cadre géographique sans préciser indûment l’espèce.
- source_word: הַבַּרְקֳנִים
  choice: des ronces
  rationale: Le mot désigne vraisemblablement une végétation épineuse, mais l’espèce exacte est incertaine. « Ronces » est naturel et maintient l’idée d’une plante propre à blesser.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. La transcription « Yahweh » distingue le nom divin d’un titre et ne résout pas autrement la portée théologique du nom.
translation_notes:
  register: Français international moderne, digne et direct. La phrase garde la violence explicite du texte et sa métaphore agricole sans l’atténuer. Les noms זֶבַח et צַלְמֻנָּע sont transcrits « Zéba » et « Tsalmunna » selon une forme française lisible.
