  text: וַ/יָּבֹא֙ אֶל אַנְשֵׁ֣י סֻכּ֔וֹת וַ/יֹּ֕אמֶר הִנֵּ֖ה זֶ֣בַח וְ/צַלְמֻנָּ֑ע אֲשֶׁר֩ חֵרַפְתֶּ֨ם אוֹתִ֜/י לֵ/אמֹ֗ר הֲ֠/כַף זֶ֣בַח וְ/צַלְמֻנָּ֤ע עַתָּה֙ בְּ/יָדֶ֔/ךָ כִּ֥י נִתֵּ֛ן לַ/אֲנָשֶׁ֥י/ךָ הַ/יְּעֵפִ֖ים לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/015.yaml
  text: Then he came to the men of Succoth and said[a], “Here are Zebah and Zalmunna, about whom you taunted me, saying, ‘Are Zebah and Zalmunna already in your hand[b], that we should give bread to your weary men?’”
translation:
  language: fr
  text: 'Puis il se rendit auprès des hommes de Soukkoth et leur dit : « Voici Zébah et Tsalmunna, au sujet desquels vous vous êtes moqués de moi[a] en disant : “Zébah et Tsalmunna sont-ils déjà en ton pouvoir[b], pour que nous donnions du pain à tes hommes épuisés ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous m’avez couvert de mépris » ou « vous m’avez insulté ». Le verbe hébreu exprime un reproche empreint de mépris.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « La paume de Zébah et de Tsalmunna est-elle maintenant dans ta main ? » Cette expression signifie : « Les as-tu déjà capturés ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: les hommes de Soukkoth
  rationale: La formulation conserve le sens littéral de אַנְשֵׁי et désigne les habitants masculins ou responsables auxquels Gédéon s’adresse.
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » rend naturellement la valeur déictique du terme, Gédéon présentant les deux rois capturés devant ses interlocuteurs.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Zébah et Tsalmunna
  rationale: Translittération française usuelle et transparente des deux noms propres.
- source_word: אֲשֶׁר חֵרַפְתֶּם אוֹתִי
  choice: au sujet desquels vous m’avez insulté
  rationale: חרף exprime ici un affront méprisant adressé à Gédéon à propos de ces rois. « Insulté » garde cette force sans ajouter une forme précise de moquerie.
- source_word: הֲכַף ... בְּיָדֶךָ
  choice: sont-ils déjà en ton pouvoir
  rationale: La formulation rend en français naturel l’image idiomatique de la main, qui exprime la capture et la domination, tandis que « déjà » restitue עַתָּה dans cette question sarcastique.
- source_word: כִּי נִתֵּן
  choice: pour que nous donnions
  rationale: 'Dans la question rhétorique, la proposition exprime la conséquence refusée : ils ne veulent pas nourrir les hommes de Gédéon tant que les rois ne sont pas capturés.'
- source_word: לַאֲנָשֶׁיךָ הַיְּעֵפִים
  choice: à tes hommes épuisés
  rationale: יְעֵפִים décrit une grande fatigue due à la poursuite ; « épuisés » en communique clairement l’intensité.
- source_word: לָחֶם
  choice: du pain
  rationale: Le sens lexical direct est conservé, même si le pain peut représenter plus largement la nourriture.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct garde le tutoiement singulier adressé à Gédéon. « Soukkoth », « Zébah » et « Tsalmunna » suivent une translittération française lisible ; la syntaxe idiomatique évite de reproduire obscurément l’expression hébraïque de la main, qui est toutefois signalée en note.
