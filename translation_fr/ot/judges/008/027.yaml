  text: וַ/יַּעַשׂ֩ אוֹת֨/וֹ גִדְע֜וֹן לְ/אֵפ֗וֹד וַ/יַּצֵּ֨ג אוֹת֤/וֹ בְ/עִיר/וֹ֙ בְּ/עָפְרָ֔ה וַ/יִּזְנ֧וּ כָֽל יִשְׂרָאֵ֛ל אַחֲרָ֖י/ו שָׁ֑ם וַ/יְהִ֛י לְ/גִדְע֥וֹן וּ/לְ/בֵית֖/וֹ לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/027.yaml
  text: Gideon made it into an ephod and set it up in his city[a], in Ophrah. And all Israel prostituted themselves after it there[b], and it became a snare to Gideon and to his house.
translation:
  language: fr
  text: Gédéon en fit un éphod et l’installa dans sa ville, à Ophra. Là, tout Israël se prostitua en suivant cet éphod[a], qui devint un piège pour Gédéon et pour sa maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un « éphod » était un objet cultuel associé au service sacerdotal. Ici, le texte ne précise pas exactement sa forme ni sa fonction.
    reason: cultural_note
  - marker: b
    text: Ici, « maison » peut désigner la famille, la maisonnée ou la lignée de Gédéon.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵפוֹד
  choice: en fit un éphod
  rationale: 'La construction avec עשה et ל est comprise comme résultative : Gédéon transforma l’or en un éphod. Le terme « éphod » conserve l’indétermination du texte quant à la forme et à la fonction exactes de l’objet.'
- source_word: וַיַּצֵּג
  choice: l’installa
  rationale: Le verbe exprime le fait de faire tenir ou de mettre en place. « L’installa » convient à la mise en place publique de l’objet sans préciser abusivement qu’il s’agissait d’une exposition décorative.
- source_word: בְעִירוֹ בְעָפְרָה
  choice: dans sa ville, à Ophra
  rationale: Cette formulation conserve la relation explicative entre « sa ville » et le nom du lieu, tout en restant naturelle en français.
- source_word: וַיִּזְנוּ ... אַחֲרָיו
  choice: se prostitua en suivant cet éphod
  rationale: « Se prostituer » maintient l’image sexuelle forte de זנה appliquée à l’infidélité cultuelle. « En suivant cet éphod » rend l’expression אַחֲרָיו de façon idiomatique et explicite clairement l’antécédent du pronom.
- source_word: שָׁם
  choice: Là
  rationale: Le repère est conservé en tête de phrase afin de souligner que cette infidélité eut lieu à Ophra.
- source_word: לְמוֹקֵשׁ
  choice: un piège
  rationale: « Piège » restitue clairement la métaphore de מוֹקֵשׁ dans un français moderne et courant.
- source_word: וּלְבֵיתוֹ
  choice: pour sa maison
  rationale: « Maison » préserve l’étendue sémantique de בַּיִת, qui peut désigner la famille, la maisonnée ou la lignée de Gédéon.
theological_decisions:
- issue: Métaphore décrivant la réaction idolâtre d’Israël
  choice: se prostitua en suivant cet éphod
  alternative: lui fut infidèle ; se détourna pour le suivre
  rationale: Le choix conserve l’imagerie explicite de l’infidélité sexuelle employée par l’hébreu pour qualifier l’infidélité cultuelle, sans la réduire à une désobéissance générique.
- issue: Nature de l’éphod fabriqué par Gédéon
  choice: éphod
  alternative: vêtement sacerdotal ; idole ; objet divinatoire
  rationale: Le texte nomme l’objet sans en définir précisément la forme ni la fonction. La translittération évite de trancher une question historique et théologique que le verset laisse ouverte.
- issue: Portée de « maison »
  choice: sa maison
  alternative: sa famille ; sa maisonnée ; sa dynastie
  rationale: La formulation littérale préserve la possible portée familiale et dynastique du terme hébreu sans imposer une seule interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. L’image forte de la prostitution cultuelle est maintenue. « L’installa » et « un piège » privilégient la clarté courante, tandis que « éphod » et « maison » préservent les ambiguïtés réelles du texte hébreu.
