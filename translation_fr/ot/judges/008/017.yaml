lexical_decisions:
- source_word: מִגְדַּל
  choice: tour
  rationale: Le nom désigne couramment une tour ou un ouvrage fortifié élevé. « Tour » est ici le rendu français le plus direct et naturel.
- source_word: פְּנוּאֵל
  choice: Penouel
  rationale: Cette translittération française suit la forme consonantique du texte hébreu et l’usage courant des noms bibliques en français.
- source_word: נָתָץ
  choice: démolit
  rationale: Le verbe signifie abattre ou démolir une construction. « Démolit » exprime clairement et sobrement la destruction de la tour.
- source_word: וַיַּהֲרֹג
  choice: tua
  rationale: Le verbe signifie directement « tuer ». Le passé simple convient au registre narratif biblique, tout en restant clair en français moderne.
- source_word: אַנְשֵׁי הָעִיר
  choice: les hommes de la ville
  rationale: L’expression signifie littéralement « les hommes de la ville ». Dans ce contexte de châtiment militaire, le masculin explicite est conservé plutôt que généralisé à l’ensemble des habitants.
