id: JDG.8.4
reference: Judges 8:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבֹ֥א גִדְע֖וֹן הַ/יַּרְדֵּ֑נָ/ה עֹבֵ֣ר ה֗וּא וּ/שְׁלֹשׁ מֵא֤וֹת הָ/אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ עֲיֵפִ֖ים וְ/רֹדְפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/004.yaml
  text: Then Gideon came to the Jordan and crossed over[a], he and the three hundred men who were with him, exhausted yet pursuing.
translation:
  language: fr
  text: Gédéon arriva au Jourdain et le traversa, lui et les trois cents hommes qui l’accompagnaient. Ils étaient épuisés, mais[a] continuaient la poursuite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et continuaient la poursuite ». La conjonction hébraïque peut exprimer une simple coordination plutôt qu’un contraste explicite.'
    reason: ambiguïté_syntaxique
lexical_decisions:
- source_word: וַיָּבֹא
  choice: arriva
  rationale: Le verbe בוא peut signifier venir, entrer ou arriver. Avec la destination indiquée, « arriva » exprime naturellement le mouvement narratif en français.
- source_word: הַיַּרְדֵּנָה
  choice: au Jourdain
  rationale: Le ה directionnel marque le mouvement vers le Jourdain. Le nom du fleuve suffit en français sans ajouter « fleuve ».
- source_word: עֹבֵר הוּא
  choice: et le traversa, lui
  rationale: Le participe עֹבֵר décrit la traversée de manière vive, tandis que le pronom הוּא met Gédéon en relief. La formulation française conserve l’action et l’insistance portée par « lui ».
- source_word: וּשְׁלֹשׁ מֵאוֹת הָאִישׁ אֲשֶׁר אִתּוֹ
  choice: et les trois cents hommes qui l’accompagnaient
  rationale: Cette expression identifie le groupe qui traverse avec Gédéon. « Hommes » convient au contexte militaire et correspond à הָאִישׁ.
- source_word: עֲיֵפִים
  choice: épuisés
  rationale: Le terme désigne une grande fatigue physique. « Épuisés » est clair, actuel et adapté à la situation.
- source_word: וְרֹדְפִים
  choice: mais continuaient la poursuite
  rationale: Le participe רֹדְפִים indique que la poursuite se prolonge. « Continuaient la poursuite » est idiomatique sans ajouter explicitement un objet absent de l’hébreu; « mais » rend le contraste contextuel avec leur épuisement.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase est divisée en deux pour éviter une accumulation lourde, tout en conservant l’insistance sur Gédéon et les trois cents hommes ainsi que la tension entre leur épuisement et la poursuite.
