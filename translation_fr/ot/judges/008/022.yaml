source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ אִֽישׁ יִשְׂרָאֵל֙ אֶל גִּדְע֔וֹן מְשָׁל בָּ֨/נוּ֙ גַּם אַתָּ֔ה גַּם בִּנְ/ךָ֖ גַּ֣ם בֶּן בְּנֶ֑/ךָ כִּ֥י הוֹשַׁעְתָּ֖/נוּ מִ/יַּ֥ד מִדְיָֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/022.yaml
  text: Then the men of Israel said to Gideon[a], “Rule over us—you, your son, and your grandson as well—for you have saved us from the hand of Midian.”
translation:
  language: fr
  text: 'Alors les hommes d’Israël dirent à Gédéon : « Règne sur nous, toi, ton fils, et aussi le fils de ton fils, car tu nous as sauvés de la main de Madian. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Alors … dirent
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession en français.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: les hommes d’Israël
  rationale: Le nom singulier a ici un sens collectif, comme le confirme le verbe au pluriel. Cette formulation conserve aussi la référence explicite aux hommes.
- source_word: מְשָׁל בָּנוּ
  choice: Règne sur nous
  rationale: L’impératif de משל demande l’exercice d’un pouvoir politique. « Règne » est direct et convient à la proposition de succession héréditaire, sans introduire explicitement le titre de roi.
- source_word: גַּם אַתָּה גַּם בִּנְךָ גַּם בֶּן בְּנֶךָ
  choice: toi, ton fils, et aussi le fils de ton fils
  rationale: La formulation garde les générations successives explicitement nommées dans l’hébreu. « Aussi » restitue la valeur additive de גַּם sans alourdir excessivement la phrase française.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée à cette demande.
- source_word: הוֹשַׁעְתָּנוּ
  choice: tu nous as sauvés
  rationale: Le verbe ישׁע désigne ici la délivrance militaire. « Sauvés » conserve son champ lexical biblique tout en restant naturel dans le contexte.
- source_word: מִיַּד מִדְיָן
  choice: de la main de Madian
  rationale: La métaphore de la main évoque la puissance ou l’emprise. Elle demeure intelligible en français et conserve la texture de l’expression hébraïque.
theological_decisions:
- issue: Nature du pouvoir proposé à Gédéon
  choice: 'Présenter la demande comme celle d’un règne dynastique : « Règne sur nous, toi, ton fils, et aussi le fils de ton fils »'
  alternative: Comprendre la demande comme une simple fonction de direction, sans implication dynastique
  rationale: L’impératif משל, suivi de la succession explicite de Gédéon, de son fils et du fils de son fils, indique un pouvoir politique héréditaire. La traduction préserve cette portée sans ajouter le titre de « roi », absent du texte hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. La syntaxe reste proche de l’hébreu lorsque celle-ci demeure claire en français, notamment pour les générations successives et l’image de « la main de Madian ».
