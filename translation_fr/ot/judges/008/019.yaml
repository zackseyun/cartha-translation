  text: וַ/יֹּאמַ֕ר אַחַ֥/י בְּנֵֽי אִמִּ֖/י הֵ֑ם חַי יְהוָ֗ה ל֚וּ הַחֲיִתֶ֣ם אוֹתָ֔/ם לֹ֥א הָרַ֖גְתִּי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/019.yaml
  text: And he said[a], “They were my brothers, the sons of my mother. As Yahweh lives, if you had let them live[b], I would not have killed you.”
translation:
  language: fr
  text: 'Puis il dit : « C’étaient mes frères, les fils de ma mère. Aussi vrai que Yahweh est vivant, si vous les aviez laissés en vie, je ne vous aurais pas tués. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Puis il dit
  rationale: Le wayyiqtol poursuit le récit et introduit naturellement la réponse de Gédéon.
- source_word: אַחַי בְּנֵי אִמִּי הֵם
  choice: C’étaient mes frères, les fils de ma mère
  rationale: La formulation conserve l’apposition hébraïque, qui précise qu’il s’agit de frères issus de la même mère, sans remplacer le texte par l’interprétation « frères germains ».
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Cette formule française naturelle garde la solennité de la formule de serment et rend explicitement le nom divin.
- source_word: לוּ הַחֲיִתֶם אוֹתָם
  choice: si vous les aviez laissés en vie
  rationale: Le hiphil de חיה exprime ici le fait de maintenir en vie ou d’épargner; le plus-que-parfait marque clairement la condition irréelle passée.
- source_word: לֹא הָרַגְתִּי אֶתְכֶם
  choice: je ne vous aurais pas tués
  rationale: Le conditionnel passé rend naturellement en français l’apodose contrefactuelle portant sur un acte qui n’aurait pas eu lieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans la formule de serment
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie le tétragramme comme nom propre; « Yahweh » le conserve sans lui substituer un titre.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conditionnelle française explicite le contrefactuel passé sans ajouter d’interprétation. Aucun appel de note n’est nécessaire.
