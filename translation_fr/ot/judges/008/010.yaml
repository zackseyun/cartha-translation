base_translation:
  language: en
  yaml_path: translation/ot/judges/008/010.yaml
  text: Zebah and Zalmunna were in Karkor[a], and their camps were with them, about fifteen thousand men, all who were left from all the camp of the sons of the east; and those who had fallen were one hundred twenty thousand men drawing the sword.
translation:
  language: fr
  text: Zébah et Tsalmunna se trouvaient à Qarqor, avec leurs troupes, soit environ quinze mille hommes, tous les survivants de l’ensemble de l’armée des fils de l’Orient[a]. Cent vingt mille hommes qui tiraient l’épée étaient tombés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « de toute l’armée des gens de l’Est ». Hébreu : « des fils de l’Orient ».'
    reason: L’expression בְנֵי קֶדֶם peut être conservée littéralement comme désignation ethnogéographique ou rendue selon son sens courant par « gens de l’Est ».
lexical_decisions:
- source_word: בַּקַּרְקֹר
  choice: à Qarqor
  rationale: La préposition ב indique ici le lieu. « À Qarqor » est la tournure française naturelle avec ce nom de lieu.
- source_word: וּמַחֲנֵיהֶם עִמָּם
  choice: avec leurs troupes
  rationale: מַחֲנֶה peut désigner le camp ou, par extension militaire, les forces qui y campent. Le pluriel suffixé est rendu par « leurs troupes », expression naturelle qui évite l’étrange « leurs camps étaient avec eux » tout en conservant le pluriel.
- source_word: כַּחֲמֵשֶׁת עָשָׂר אֶלֶף
  choice: environ quinze mille hommes
  rationale: Le préfixe כ marque l’approximation, explicitement rendue par « environ » ; « hommes » est fourni par le contexte militaire.
- source_word: כֹּל הַנּוֹתָרִים
  choice: tous ceux qui restaient
  rationale: Le participe niphal de יתר désigne ceux qui demeurent après les pertes ; cette formulation conserve le sens résultatif sans surinterprétation.
- source_word: מִכֹּל מַחֲנֵה בְנֵי קֶדֶם
  choice: de toute l’armée des fils de l’Orient
  rationale: Le מִן a une valeur partitive après « ceux qui restaient ». מַחֲנֶה est compris collectivement comme l’armée, tandis que « fils de l’Orient » conserve l’expression ethnogéographique hébraïque.
- source_word: וְהַנֹּפְלִים
  choice: étaient tombés
  rationale: Dans ce bilan de bataille, le participe de נפל désigne les hommes tués. Le plus-que-parfait français exprime naturellement l’antériorité de ces pertes.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: cent vingt mille
  rationale: Rendu numérique standard en français moderne.
- source_word: אִישׁ שֹׁלֵף חָרֶב
  choice: hommes tirant l’épée
  rationale: « Tirant l’épée » reproduit l’image martiale hébraïque, qui désigne des combattants en armes, sans la réduire à la simple possession d’une épée.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement restructurée pour distinguer clairement les quinze mille survivants des cent vingt mille morts, tout en conservant l’approximation, le rapport partitif et l’image de l’épée.
