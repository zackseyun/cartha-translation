revisions:
- from: 'Zébah et Tsalmunna se trouvaient à Qarqor, avec leurs troupes, soit environ quinze mille hommes : c’étaient tous ceux qui restaient de toute l’armée des fils de l’Orient[a]. Cent vingt mille hommes tirant l’épée étaient tombés.'
  to: Zébah et Tsalmunna se trouvaient à Qarqor, avec leurs troupes, soit environ quinze mille hommes, tous les survivants de l’ensemble de l’armée des fils de l’Orient[a]. Cent vingt mille hommes qui tiraient l’épée étaient tombés.
  rationale: 'La révision est stylistique et syntaxique : elle rend plus nettement le groupe des quinze mille comme l’ensemble des survivants provenant de tout le camp, et rend plus naturel en français l’attribut « tirant l’épée », sans atténuer l’image martiale du texte hébreu ni modifier les chiffres, l’approximation ou les relations narratives.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:13:59Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est correctement rendu : localisation à Qarqor, présence des forces avec les deux rois, approximation de quinze mille survivants, origine dans le camp des fils de l’Orient, et bilan de cent vingt mille combattants tombés. Une légère révision améliore toutefois le lien syntaxique entre le nombre et les survivants, ainsi que la portée descriptive de « tirant l’épée ».'
  naturalness: Le texte est globalement naturel, mais « tous ceux qui restaient de toute l’armée » est moins idiomatique et légèrement ambigu. « Tous les survivants de l’ensemble de l’armée » est plus fluide tout en conservant la totalité du groupe source. « Hommes tirant l’épée » est possible, mais pesant dans cette position ; une relative rend mieux l’attribution martiale.
  terminology: Les noms « Zébah », « Tsalmunna » et « Qarqor » sont cohérents avec une translittération française de l’hébreu. « Fils de l’Orient » préserve utilement l’expression ethnogéographique hébraïque ; la note propose de façon appropriée une alternative plus idiomatique.
  issues:
  - severity: low
    issue: Formulation partitive des survivants
    rationale: « Tous ceux qui restaient de toute l’armée » peut suggérer qu’ils restaient partout dans l’armée plutôt qu’être les survivants issus de son ensemble. « Tous les survivants de l’ensemble de l’armée » explicite naturellement la relation sans modifier le sens.
  - severity: low
    issue: Attribut martial final peu fluide
    rationale: Dans « Cent vingt mille hommes tirant l’épée étaient tombés », le participe présent est grammatical mais lourd et peut évoquer une action simultanée. La relative « qui tiraient l’épée » maintient l’image hébraïque et caractérise les hommes comme combattants.
  revised_text: Zébah et Tsalmunna se trouvaient à Qarqor, avec leurs troupes, soit environ quinze mille hommes, tous les survivants de l’ensemble de l’armée des fils de l’Orient[a]. Cent vingt mille hommes qui tiraient l’épée étaient tombés.
  revised_footnotes:
  - marker: a
    text: 'Ou « de toute l’armée des gens de l’Est ». Hébreu : « des fils de l’Orient ».'
    reason: L’expression בְנֵי קֶדֶם peut être conservée littéralement comme désignation ethnogéographique ou rendue selon son sens courant par « gens de l’Est ».
  revision_rationale: 'La révision est stylistique et syntaxique : elle rend plus nettement le groupe des quinze mille comme l’ensemble des survivants provenant de tout le camp, et rend plus naturel en français l’attribut « tirant l’épée », sans atténuer l’image martiale du texte hébreu ni modifier les chiffres, l’approximation ou les relations narratives.'
