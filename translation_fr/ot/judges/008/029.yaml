  yaml_path: translation/ot/judges/008/029.yaml
  text: Then Jerubbaal son of Joash went and lived in his house[a].
translation:
  language: fr
  text: Puis Jerubbaal, fils de Joas, alla et habita dans sa maison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « alla et s’établit dans sa maison » ou « alla et demeura dans sa maison ». Le verbe hébreu peut désigner le fait d’habiter ou de s’établir, et pas seulement celui de s’asseoir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: partit
  rationale: Dans cette suite narrative, הלך indique que Jerubbaal s'en alla. « Partit » rend naturellement le mouvement sans préciser qu'il serait retourné chez lui, direction que le verbe n'exprime pas explicitement.
- source_word: יְרֻבַּעַל
  choice: Jerubbaal
  rationale: Le texte hébreu emploie ici le nom Jerubbaal; il est donc conservé plutôt que remplacé par l'autre nom du personnage, Gédéon.
- source_word: בֶּן יוֹאָשׁ
  choice: fils de Joas
  rationale: Traduction française directe et naturelle de la construction filiale.
- source_word: וַיֵּשֶׁב
  choice: habiter
  rationale: ישב peut signifier s'asseoir, demeurer ou s'établir. Avec « dans sa maison », le contexte indique la résidence; l'infinitif « habiter », coordonné à « partit », donne une formulation française fluide.
- source_word: בְּבֵיתוֹ
  choice: dans sa maison
  rationale: Cette formulation conserve explicitement la préposition, le nom « maison » et le suffixe possessif du texte hébreu, plutôt que de les condenser en « chez lui ».
- source_word: וַ...וַ
  choice: Puis … partit habiter
  rationale: « Puis » marque la progression narrative des formes à waw consécutif. La construction « partit habiter » exprime naturellement en français la succession étroitement liée des deux actions.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. « Habiter » est courant et clair; « dans sa maison » maintient la formulation concrète de l’hébreu. Le nom propre suit une translittération française usuelle.
