  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ גִּדְע֔וֹן לֹֽא אֶמְשֹׁ֤ל אֲנִי֙ בָּ/כֶ֔ם וְ/לֹֽא יִמְשֹׁ֥ל בְּנִ֖/י בָּ/כֶ֑ם יְהוָ֖ה יִמְשֹׁ֥ל בָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/023.yaml
  text: But Gideon said to them[a], “I will not rule over you, and my son will not rule over you; Yahweh will rule over you.”
translation:
  language: fr
  text: 'Mais Gédéon leur dit[a] : « Ce n’est pas moi qui régnerai sur vous, et ce n’est pas mon fils qui régnera sur vous ; c’est Yahweh qui régnera sur vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et Gédéon leur dit. » La conjonction hébraïque peut simplement marquer la suite du récit, mais « Mais » fait ressortir le contraste avec la demande du peuple au verset précédent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais … dit
  rationale: Le wayyiqtol fait progresser le récit, tandis que « Mais » exprime naturellement le contraste contextuel avec la demande formulée au verset précédent. Le sens narratif plus simple « Et » demeure possible et est signalé en note.
- source_word: לֹא אֶמְשֹׁל אֲנִי בָּכֶם
  choice: Ce n’est pas moi qui régnerai sur vous
  rationale: מָשַׁל désigne ici l’exercice du pouvoir. La tournure clivée rend naturellement en français la présence emphatique du pronom אֲנִי et prépare le contraste avec Yahweh, sans ajouter « moi-même ».
- source_word: וְלֹא יִמְשֹׁל בְּנִי בָּכֶם
  choice: et ce n’est pas mon fils qui régnera sur vous
  rationale: Cette formulation conserve le parallélisme avec la première proposition et le singulier « mon fils », tout en laissant apparaître le refus d’une succession dynastique sans l’expliciter dans le texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver sa qualité de nom propre dans le texte hébreu.
- source_word: יְהוָה יִמְשֹׁל בָּכֶם
  choice: c’est Yahweh qui régnera sur vous
  rationale: La répétition de « régner sur » traduit le même verbe מָשַׁל dans les trois propositions et maintient le contraste rhétorique entre Gédéon, son fils et Yahweh.
theological_decisions:
- issue: Portée du refus de Gédéon
  choice: Gédéon refuse que lui-même et son fils règnent sur Israël, et affirme que Yahweh régnera sur le peuple.
  alternative: Gédéon refuserait seulement le titre officiel de roi tout en conservant un pouvoir royal de fait.
  rationale: Le verset répète מָשַׁל, « régner, gouverner », pour Gédéon, son fils et Yahweh, sans employer le mot « roi ». La traduction conserve donc ce contraste sans préciser davantage la nature institutionnelle du pouvoir ni résoudre la tension avec la suite du récit.
translation_notes:
  register: Français moderne, courant et digne. La structure clivée (« Ce n’est pas… c’est… ») restitue l’insistance et le contraste de l’hébreu avec naturel. « Régner sur » est maintenu dans les trois membres pour préserver la répétition lexicale et la portée politique du verbe.
