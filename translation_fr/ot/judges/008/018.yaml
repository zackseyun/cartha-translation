    issue: Nom propre « Zébah »
    rationale: Dans l’usage biblique français courant, le nom זֶבַח est normalement transcrit « Zébach ». Employer cette forme favorise la reconnaissance et la cohérence onomastique sans affecter le sens.
  - severity: low
    issue: La note b ne présente pas une véritable alternative lexicale substantielle
    rationale: « ressemblait à » reformule seulement « avait l’apparence de » et la proposition entière ne clarifie pas précisément l’alternative pour כְּתֹאַר. Une alternative telle que « avait l’allure » rend plus utilement la nuance de forme ou d’aspect extérieur.
