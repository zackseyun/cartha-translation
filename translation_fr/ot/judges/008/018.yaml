base_translation:
  language: en
  yaml_path: translation/ot/judges/008/018.yaml
  text: Then he said to Zebah and Zalmunna[a], “Where are the men whom you killed at Tabor?” And they said, “As you are, so were they[b]; each one had the appearance of the sons of a king.”
translation:
  language: fr
  text: 'Puis il dit à Zébach et à Tsalmunna : « Où sont les hommes que vous avez tués au Tabor[a] ? » Ils répondirent : « Ils étaient comme toi : chacun avait l’apparence d’un fils de roi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le Tabor désigne le mont Tabor.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction : « chacun avait l’allure d’un fils de roi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיפֹה
  choice: Où sont
  rationale: L’adverbe interrogatif demande le lieu ; en français, la copule sous-entendue doit être exprimée.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Dans ce contexte, le terme désigne des victimes masculines identifiables, comparées ensuite à Gédéon.
- source_word: הֲרַגְתֶּם
  choice: vous avez tués
  rationale: Rend directement le sens courant de « tuer », sans ajouter la qualification juridique ou morale de « assassiner ».
- source_word: בְּתָבוֹר
  choice: au Tabor
  rationale: La préposition ב est rendue naturellement par « au » devant ce nom de lieu ; une note précise qu’il s’agit du mont Tabor.
- source_word: כָּמוֹךָ כְמוֹהֶם
  choice: Ils étaient comme toi
  rationale: La comparaison hébraïque est elliptique. Cette formulation française claire conserve la comparaison directe entre les victimes et Gédéon.
- source_word: אֶחָד
  choice: chacun
  rationale: Le numéral a ici une valeur distributive et renvoie individuellement à tous les hommes mentionnés.
- source_word: כְּתֹאַר
  choice: avait l’apparence de
  rationale: תֹאַר désigne la forme ou l’apparence extérieure ; cette expression est naturelle et n’ajoute pas l’idée plus interprétative de prestance.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: un fils de roi
  rationale: Avec « chacun », le singulier distributif est naturel en français et conserve l’image hébraïque plutôt que de la remplacer par « prince ».
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: Puis il dit ... Ils répondirent
  rationale: « Puis » marque la progression narrative. Dans ce dialogue, « répondirent » rend naturellement le second verbe de parole sans modifier son contenu.
