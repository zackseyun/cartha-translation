base_translation:
  language: en
  yaml_path: translation/ot/judges/008/001.yaml
  text: Then the men of Ephraim said to him[a], “What is this thing you have done to us[b], not calling us when you went to fight against Midian?” And they contended with him strongly.
translation:
  language: fr
  text: 'Les hommes d’Éphraïm[a] lui dirent : « Pourquoi nous as-tu fait cela sans nous appeler lorsque tu es allé combattre Madian ? » Et ils lui cherchèrent vivement querelle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Éphraïmites ». L’hébreu dit littéralement « les hommes d’Éphraïm », expression collective désignant les membres de la tribu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶפְרַיִם
  choice: les hommes d’Éphraïm
  rationale: Le singulier morphologique אִישׁ a ici un sens collectif, confirmé par les verbes au pluriel. Cette formulation conserve l’expression tribale hébraïque; « les Éphraïmites » serait plus concise mais moins transparente.
- source_word: מָה הַדָּבָר הַזֶּה עָשִׂיתָ לָּנוּ
  choice: Pourquoi nous as-tu fait cela ?
  rationale: En français courant, cette question rend naturellement le reproche exprimé par la tournure hébraïque littérale « Qu’est-ce que cette chose que tu nous as faite ? », qui serait maladroite.
- source_word: לְבִלְתִּי קְרֹאות לָנוּ
  choice: Pourquoi ne nous as-tu pas appelés
  rationale: La construction infinitive précise la teneur du reproche. La reprise interrogative explicite naturellement ce lien en français sans ajouter de contenu.
- source_word: כִּי הָלַכְתָּ לְהִלָּחֵם בְּמִדְיָן
  choice: lorsque tu es allé combattre Madian
  rationale: כִּי reçoit ici une valeur temporelle liée au fait de ne pas les avoir appelés. « Combattre Madian » exprime idiomatiquement en français la valeur hostile de בְּ avec le verbe נלחם.
- source_word: וַיְרִיבוּן אִתּוֹ בְּחָזְקָה
  choice: ils lui cherchèrent vivement querelle
  rationale: ריב désigne une vive contestation ou querelle, et בְּחָזְקָה en marque l’intensité. La formulation est naturelle, soutenue sans archaïsme et évite le peu idiomatique « contestèrent fortement avec lui ».
