base_translation:
  language: en
  yaml_path: translation/ot/judges/008/014.yaml
  text: And he captured a young man from the men of Succoth and questioned him[a], and he wrote down for him the officials of Succoth and its elders, seventy-seven men.
translation:
  language: fr
  text: 'Il captura un jeune homme parmi les hommes de Soukkoth et l’interrogea. Celui-ci lui mit par écrit la liste des responsables[a] de Soukkoth et de ses anciens : soixante-dix-sept hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chefs » ou « dirigeants » ; le terme hébreu peut désigner des responsables publics, des chefs ou des gouvernants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכָּד
  choice: captura
  rationale: Le verbe לכד signifie couramment « capturer » ou « saisir ». « Captura » convient au contexte militaire sans préciser davantage les circonstances.
- source_word: נַעַר
  choice: un jeune homme
  rationale: נַעַר peut désigner un garçon, un jeune homme ou parfois un serviteur. Ici, il appartient aux habitants de Soukkoth et connaît les responsables de la ville ; « jeune homme » évite de suggérer qu’il s’agit d’un enfant ou d’un serviteur.
- source_word: מֵאַנְשֵׁי סֻכּוֹת
  choice: parmi les habitants de Soukkoth
  rationale: La préposition מן exprime ici la sélection au sein d’un groupe. « Parmi les habitants » rend naturellement en français son appartenance aux gens de la ville.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: l’interrogea
  rationale: Dans ce contexte militaire, שׁאל désigne une demande ciblée de renseignements. « Interrogea » est idiomatique et plus précis que « lui posa une question », sans ajouter de violence au récit.
- source_word: וַיִּכְתֹּב אֵלָיו
  choice: Le jeune homme lui donna par écrit la liste
  rationale: Le contexte indique que le jeune homme fournit à Gédéon les renseignements par écrit. Cette formulation clarifie le changement implicite de sujet et rend idiomatiquement l’objet énuméré, sans ajouter que le texte hébreu mentionne expressément des noms.
- source_word: שָׂרֵי סֻכּוֹת
  choice: les responsables de Soukkoth
  rationale: שׂרים peut désigner des chefs, des dirigeants ou des responsables publics. « Responsables » convient au cadre civique et évite le sens aristocratique que pourrait suggérer « princes ».
- source_word: זְקֵנֶיהָ
  choice: ses anciens
  rationale: Le suffixe féminin renvoie à la ville de Soukkoth. « Ses anciens » désigne naturellement les membres reconnus de son autorité locale.
- source_word: שִׁבְעִים וְשִׁבְעָה אִישׁ
  choice: soixante-dix-sept hommes
  rationale: Le nombre hébreu est directement rendu par « soixante-dix-sept », et « hommes » conserve le substantif explicite אִישׁ.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition « le jeune homme » lève l’ambiguïté pronominale naturelle en français et indique, conformément au contexte syntaxique, que c’est le captif qui fournit la liste par écrit. Le toponyme est transcrit « Soukkoth ».
