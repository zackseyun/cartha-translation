  text: Gédéon, fils de Joas, revint de la bataille par la montée de Hérès[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « avant le lever du soleil ». L’expression hébraïque est difficile : הֶחָרֶס peut être compris comme un nom de lieu (« Hérès ») ou comme « le soleil ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: revint
  rationale: Le wayyiqtol de שׁוב fait progresser le récit. Le passé simple convient au registre narratif français et exprime clairement le retour.
- source_word: גִּדְעוֹן
  choice: Gédéon
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: בֶּן יוֹאָשׁ
  choice: fils de Joas
  rationale: Traduction directe du patronyme hébreu, avec la forme française usuelle « Joas ».
- source_word: מִן הַמִּלְחָמָה
  choice: de la bataille
  rationale: Dans ce contexte d'affrontement militaire précis, « bataille » convient mieux que le sens plus large de « guerre ».
- source_word: מִלְמַעֲלֵה
  choice: par la montée de
  rationale: « Par » rend naturellement l'idée probable d'itinéraire, tandis que « montée » conserve la valeur topographique de מַעֲלֶה.
- source_word: הֶחָרֶס
  choice: Hérès
  rationale: La translittération comme nom de lieu préserve dans le texte principal l'interprétation topographique probable sans effacer la possibilité lexicale « soleil », signalée en note.
