  yaml_path: translation/ot/judges/008/016.yaml
  text: Then he took the elders of the city[a], and thorns of the wilderness and briers, and with them he disciplined the men of Succoth.
translation:
  language: fr
  text: Puis il prit les anciens de la ville, ainsi que des épines du désert et des chardons, et il s’en servit pour corriger[a] les hommes de Souccoth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est difficile. Le verbe signifie habituellement « faire connaître » ou « instruire »; dans ce contexte, certains comprennent qu’il leur donna ainsi une leçon, d’autres qu’il leur infligea un châtiment violent au moyen de ces plantes épineuses.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעִיר
  choice: les anciens de la ville
  rationale: « Anciens » conserve le titre sociopolitique concret porté par les dirigeants de la ville, sans le remplacer par l’interprétation plus générale « chefs ».
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: des épines du désert
  rationale: Cette formulation rend directement les plantes épineuses et maintient la relation avec le désert exprimée en hébreu.
- source_word: הַבַּרְקֳנִים
  choice: des chardons
  rationale: Le nom désigne une plante piquante sans identification botanique certaine. « Chardons » est naturel en français et distingue ce second terme des « épines » qui précèdent.
- source_word: וַיֹּדַע בָּהֶם
  choice: il s’en servit pour corriger
  rationale: Le hiphil de ידע signifie normalement « faire connaître », mais l’expression inhabituelle décrit ici une punition infligée avec les plantes épineuses. « Corriger » garde à la fois l’idée de leçon et sa force punitive, tandis que la note signale la difficulté de l’hébreu.
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: les hommes de Souccoth
  rationale: Le syntagme hébreu désigne littéralement les « hommes de Souccoth »; cette traduction conserve sa forme masculine et sa référence au groupe civique concerné.
