  text: וְ/לֹֽא עָשׂ֣וּ חֶ֔סֶד עִם בֵּ֥ית יְרֻבַּ֖עַל גִּדְע֑וֹן כְּ/כָל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה עִם יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/035.yaml
  text: And they did not show kindness to the house of Jerubbaal (that is, Gideon), in keeping with all the good that he had done for Israel.
translation:
  language: fr
  text: Ils ne manifestèrent pas de bonté envers la maison de Yeroubbaal, c’est-à-dire Gédéon, à la mesure de tout le bien qu’il avait fait pour Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: bonté
  rationale: Dans ce contexte relationnel, le terme désigne la bonté fidèle ou la loyauté que les Israélites auraient dû manifester envers la famille de Gédéon.
- source_word: בֵּית
  choice: maison
  rationale: « Maison » conserve l’image hébraïque tout en désignant naturellement la famille ou la lignée de Yeroubbaal.
- source_word: כְּכָל הַטּוֹבָה
  choice: en retour de tout le bien
  rationale: Cette formulation rend la correspondance attendue entre le bien accompli par Gédéon et la bonté qui aurait dû être témoignée à sa famille.
- source_word: יְרֻבַּעַל גִּדְעוֹן
  choice: Yeroubbaal, c’est-à-dire Gédéon
  rationale: Les deux noms renvoient au même personnage; l’explicitation française évite de faire comprendre que Gédéon serait un autre membre de la maison.
theological_decisions:
- issue: Portée de חֶסֶד
  choice: bonté
  alternative: fidélité
  rationale: « Bonté » préserve ici la dimension concrète de bienveillance sans imposer une lecture strictement covenantale; la nuance de loyauté demeure portée par le contexte.
translation_notes:
  register: Français moderne, courant et digne. Le passé simple convient au registre narratif biblique. La translittération « Yeroubbaal » suit directement la forme hébraïque et reste lisible en français.
