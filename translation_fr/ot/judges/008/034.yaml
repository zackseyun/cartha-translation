id: JDG.8.34
reference: Judges 8:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹ֤א זָֽכְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת יְהוָ֖ה אֱלֹהֵי/הֶ֑ם הַ/מַּצִּ֥יל אוֹתָ֛/ם מִ/יַּ֥ד כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/034.yaml
  text: And the sons of Israel did not remember Yahweh their God[a], who had delivered them from the hand of all their enemies all around.
translation:
  language: fr
  text: Et les fils d’Israël[a] ne se souvinrent pas de Yahweh, leur Dieu, qui les avait délivrés du pouvoir de tous les ennemis qui les entouraient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les Israélites ». Littéralement : « les fils d’Israël ».'
    reason: Alternative lexicale idiomatique pour la désignation collective hébraïque.
lexical_decisions:
- source_word: וְלֹא
  choice: Et … ne … pas
  rationale: La conjonction poursuit le récit, tandis que la négation porte sur le verbe « se souvenir ».
- source_word: זָכְרוּ
  choice: se souvinrent
  rationale: Le verbe désigne ici non seulement le rappel mental, mais aussi une mémoire qui se manifeste par la fidélité; « se souvenir » conserve cette portée sans l’expliciter excessivement.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve la forme masculine collective de l’hébreu; l’expression française plus idiomatique « les Israélites » est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Bien que la forme hébraïque soit morphologiquement plurielle, elle désigne ici au singulier Yahweh comme le Dieu d’Israël.
- source_word: הַמַּצִּיל
  choice: qui les avait délivrés
  rationale: Le participe avec article caractérise Yahweh par son action salvatrice. Le plus-que-parfait situe naturellement cette délivrance avant l’oubli rapporté dans le récit.
- source_word: מִיַּד
  choice: du pouvoir de
  rationale: Littéralement « de la main de », cette expression hébraïque désigne le pouvoir ou la domination. « Du pouvoir de » communique clairement l’idiome en français moderne.
- source_word: כָּל אֹיְבֵיהֶם מִסָּבִיב
  choice: de tous les ennemis qui les entouraient
  rationale: Cette formulation naturelle exprime à la fois la totalité des ennemis et leur présence de tous côtés.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel et l’enjeu de la relation d’alliance.
- issue: Portée de זָכְרוּ
  choice: ne se souvinrent pas
  alternative: ne restèrent pas fidèles à
  rationale: Dans ce contexte, l’oubli implique probablement une infidélité envers Yahweh, mais la traduction conserve l’image et la tension du verbe hébreu plutôt que d’en imposer une interprétation explicative.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation principale reproduit la désignation masculine collective du texte source, tandis que la note fournit l’équivalent collectif courant.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide tout en conservant le nom divin, la désignation collective et l’idée biblique de « se souvenir ». L’idiome hébraïque « de la main de » est rendu par son sens naturel, « du pouvoir de ».
