  text: וַ/יַּ֣עַל גִּדְע֗וֹן דֶּ֚רֶךְ הַ/שְּׁכוּנֵ֣י בָֽ/אֳהָלִ֔ים מִ/קֶּ֥דֶם לְ/נֹ֖בַח וְ/יָגְבֳּהָ֑ה וַ/יַּךְ֙ אֶת הַֽ/מַּחֲנֶ֔ה וְ/הַֽ/מַּחֲנֶ֖ה הָ֥יָה בֶֽטַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/011.yaml
  text: Then Gideon went up by the route of those who dwell in tents[a], east of Nobah and Jogbehah, and struck the camp while the camp was unsuspecting.
translation:
  language: fr
  text: Gédéon monta par le chemin de ceux qui habitent sous des tentes, à l’est de Nobah et de Yogbeha. Il attaqua le camp, alors que le camp se sentait en sécurité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne se doutait de rien ». Le terme hébreu peut désigner un état de sécurité, de confiance ou de tranquillité ; dans ce contexte, il peut impliquer que le camp ne s’attendait pas à être attaqué.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה signifie couramment « monter ». Le contexte décrit ici le déplacement de Gédéon; « monta » conserve l’idiome narratif hébreu sans ajouter explicitement l’idée d’une offensive.
- source_word: דֶּרֶךְ
  choice: par le chemin de
  rationale: דֶּרֶךְ désigne un chemin, une voie ou un itinéraire. « Par le chemin de » est clair et naturel dans cette indication d’itinéraire.
- source_word: הַשְּׁכוּנֵי בָאֳהָלִים
  choice: ceux qui habitent sous des tentes
  rationale: Cette traduction rend directement le participe et son complément, sans préciser qu’il s’agit de « nomades », interprétation probable mais non explicite.
- source_word: מִקֶּדֶם
  choice: à l’est de
  rationale: Dans ce contexte géographique, l’expression situe l’itinéraire à l’est de Nobah et de Yogbeha.
- source_word: לְנֹבַח וְיָגְבֳּהָה
  choice: Nobah et Yogbeha
  rationale: Les deux noms de lieux sont translittérés d’après l’hébreu, avec une forme lisible en français.
- source_word: וַיַּךְ אֶת־הַמַּחֲנֶה
  choice: Il attaqua le camp
  rationale: נכה signifie littéralement « frapper », mais, avec un camp comme objet dans un récit militaire, « attaquer » exprime naturellement l’action en français sans affirmer à lui seul une défaite complète.
- source_word: הַמַּחֲנֶה
  choice: le camp
  rationale: מַחֲנֶה peut désigner un camp ou les forces qui y campent. « Le camp » garde l’image concrète et la répétition du texte hébreu.
- source_word: בֶּטַח
  choice: sans méfiance
  rationale: בֶּטַח évoque la sécurité ou la confiance. Dans ce contexte d’attaque surprise, « sans méfiance » indique que le camp ne s’attendait pas au danger, tout en laissant en note l’autre nuance possible.
