translation_notes:
  register: Français moderne, courant et digne. La formulation reste proche de la progression narrative hébraïque, tout en employant « attaqua » plutôt que le calque peu naturel « frappa le camp ». Le marqueur de note est placé après l’expression qu’il explique.
