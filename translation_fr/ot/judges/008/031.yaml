  yaml_path: translation/ot/judges/008/031.yaml
  text: And his concubine who was in Shechem also bore him a son[a], and he named him Abimelek.
translation:
  language: fr
  text: Et sa concubine, qui était à Sichem, lui enfanta elle aussi un fils, et il l’appela Abimélek[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abimélek est traditionnellement orthographié « Abimélec » dans de nombreuses versions françaises.
    reason: variante_lexicale
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: Sa concubine
  rationale: פִּילֶגֶשׁ désigne une concubine, terme français direct qui maintient la distinction de statut social. La coordination initiale s’intègre naturellement au fil narratif sans qu’un « et » soit nécessaire en français.
- source_word: אֲשֶׁר בִּשְׁכֶם
  choice: qui était à Sichem
  rationale: La proposition relative identifie la concubine par son lieu. « À Sichem » est l’usage français naturel pour une ville et n’ajoute pas l’idée plus précise qu’elle y habitait durablement.
- source_word: יָלְדָה לּוֹ
  choice: lui donna … un fils
  rationale: L’expression rend idiomatiquement le verbe ילד accompagné du complément indirect לּוֹ. Elle communique qu’elle enfanta un fils pour lui sans reproduire lourdement la syntaxe hébraïque.
- source_word: גַם הִיא
  choice: elle aussi
  rationale: 'Cette tournure conserve l’insistance explicite du groupe hébreu גַם הִיא : cette femme eut également un fils de Gédéon.'
- source_word: בֵּן
  choice: un fils
  rationale: Le nom est indéfini dans ce contexte et se rend naturellement par « un fils ».
- source_word: וַיָּשֶׂם אֶת־שְׁמוֹ
  choice: et il lui donna le nom de
  rationale: Littéralement, l’hébreu dit qu’il « plaça son nom » ; la formule française choisie en exprime naturellement le sens tout en gardant Gédéon comme sujet explicite par le pronom « il ».
- source_word: אֲבִימֶלֶךְ
  choice: Abimélek
  rationale: Cette translittération française reflète la consonne finale hébraïque כ comme k et emploie l’accent aigu pour guider naturellement la prononciation.
