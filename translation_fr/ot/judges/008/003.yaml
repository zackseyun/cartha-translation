  text: בְּ/יֶדְ/כֶם֩ נָתַ֨ן אֱלֹהִ֜ים אֶת שָׂרֵ֤י מִדְיָן֙ אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֔ב וּ/מַה יָּכֹ֖לְתִּי עֲשׂ֣וֹת כָּ/כֶ֑ם אָ֗ז רָפְתָ֤ה רוּחָ/ם֙ מֵֽ/עָלָ֔י/ו בְּ/דַבְּר֖/וֹ הַ/דָּבָ֥ר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/003.yaml
  text: Into your hand God gave the princes of Midian[a], Oreb and Zeeb; and what was I able to do compared with you? Then their spirit relaxed toward him when he spoke this word.
translation:
  language: fr
  text: Dieu a livré entre vos mains les chefs de Madian, Oreb et Zeeb. Qu’ai-je pu faire qui soit comparable à ce que vous avez fait ? À ces paroles, leur colère contre lui s’apaisa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur esprit se relâcha de dessus lui » ; autrement dit, leur hostilité envers lui retomba.'
    reason: Préserver l’image hébraïque sous-jacente à la traduction idiomatique.
lexical_decisions:
- source_word: בְּיֶדְכֶם נָתַן אֱלֹהִים
  choice: Dieu a livré entre vos mains
  rationale: L’expression hébraïque « donner dans la main » signifie remettre au pouvoir de quelqu’un. « Livrer entre vos mains » restitue naturellement cet idiome en français, tandis que le passé composé convient au discours rapportant un fait accompli encore pertinent.
- source_word: שָׂרֵי מִדְיָן
  choice: les chefs de Madian
  rationale: שָׂרִים désigne ici des dirigeants ou commandants madianites. « Chefs » est plus naturel et moins susceptible d’évoquer des fils de roi que « princes ».
- source_word: עֹרֵב וְאֶת זְאֵב
  choice: Oreb et Zeeb
  rationale: Translittération traditionnelle et reconnaissable des deux noms propres en français biblique.
- source_word: וּמַה יָּכֹלְתִּי עֲשׂוֹת כָּכֶם
  choice: Qu’ai-je pu faire qui soit comparable à ce que vous avez fait ?
  rationale: La tournure rend la comparaison et l’autodépréciation par lesquelles Gédéon cherche à apaiser les Éphraïmites, sans réduire la phrase à une simple incapacité.
- source_word: אָז
  choice: Après ces paroles
  rationale: Le séquenceur אָז signifie « alors ». Son articulation avec la proposition finale permet en français une transition naturelle qui met en relief l’effet immédiat des paroles de Gédéon.
- source_word: רָפְתָה רוּחָם מֵעָלָיו
  choice: leur colère contre lui s’apaisa
  rationale: Littéralement, « leur esprit se relâcha de dessus lui ». Dans ce contexte de vive querelle, רוּחַ désigne leur disposition hostile ou leur colère ; la formulation choisie transmet clairement le sens idiomatique.
- source_word: בְּדַבְּרוֹ הַדָּבָר הַזֶּה
  choice: Après ces paroles
  rationale: Littéralement, « lorsqu’il prononça cette parole/chose ». Le pluriel français « ces paroles » désigne naturellement la déclaration qui précède sans modifier son contenu.
