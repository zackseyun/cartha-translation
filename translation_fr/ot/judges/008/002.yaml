source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מֶה עָשִׂ֥יתִי עַתָּ֖ה כָּ/כֶ֑ם הֲ/ל֗וֹא ט֛וֹב עֹלְל֥וֹת אֶפְרַ֖יִם מִ/בְצִ֥יר אֲבִיעֶֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/002.yaml
  text: But he said to them[a], “What have I done now compared to you? Are not the gleanings of Ephraim better than the grape harvest of Abiezer?”
translation:
  language: fr
  text: 'Mais il leur répondit : « Qu’ai-je donc fait en comparaison de vous ? Le grappillage d’Éphraïm ne vaut-il pas mieux que la vendange d’Abiézer[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « grappillage » désigne les raisins qui restent à glaner après la vendange.
    reason: Précise le terme viticole עֹלְלוֹת, moins courant en français moderne, sans ajouter d’interprétation au texte.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Mais il leur répondit
  rationale: Le waw fait progresser le récit, tandis que « Mais » marque ici le contraste avec le reproche formulé au verset précédent. Dans ce contexte dialogué, « répondit » exprime naturellement la fonction de וַיֹּאמֶר.
- source_word: מֶה עָשִׂיתִי עַתָּה כָּכֶם
  choice: Qu’ai-je donc fait en comparaison de vous ?
  rationale: La préposition כ introduit une comparaison. « donc » rend naturellement la nuance contextuelle de עַתָּה sans imposer un sens strictement temporel à « maintenant ».
- source_word: הֲלוֹא
  choice: ne… pas ?
  rationale: Cette tournure introduit une question rhétorique qui attend une réponse affirmative.
- source_word: טוֹב
  choice: valent-elles… mieux
  rationale: Avec le מִן comparatif, l’adjectif « bon » prend le sens de « meilleur ». La tournure verbale française convient au sujet pluriel et reste naturelle.
- source_word: עֹלְלוֹת אֶפְרַיִם
  choice: Les grappes qu’Éphraïm a glanées
  rationale: עֹלְלוֹת désigne les raisins laissés après la vendange pour être glanés. Cette formulation claire conserve à la fois l’image viticole et le contraste avec la vendange principale.
- source_word: מִבְצִיר אֲבִיעֶזֶר
  choice: que la vendange d’Abiézer
  rationale: בְּצִיר désigne proprement la récolte des raisins, c’est-à-dire la vendange ; le מִן préfixé marque la comparaison.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’humilité rhétorique de Gédéon ainsi que l’opposition imagée entre le grappillage d’Éphraïm et la vendange d’Abiézer.
