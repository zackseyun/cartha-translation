revisions:
- from: Zéba et Tsalmounna s’enfuirent. Gédéon se lança à leur poursuite et captura les deux rois de Madian, Zéba et Tsalmounna ; il jeta dans la panique tout le camp.[a]
  to: Zébach et Tsalmouna s’enfuirent. Gédéon les poursuivit et captura les deux rois de Madian, Zébach et Tsalmouna ; il sema la panique dans tout le camp.[a]
  rationale: La révision normalise les noms propres selon l’usage biblique français, supprime une intensification non requise dans la poursuite et emploie une expression française plus idiomatique pour le verbe hébreu causatif החריד. La note conserve les principales possibilités lexicales sans trancher indûment entre panique, terreur et déroute.
  reviewer_model: gpt-5.6-terra
