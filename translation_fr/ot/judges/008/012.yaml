review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : les deux rois fuient, Gédéon les poursuit et les capture, puis le camp est saisi de panique. « Se lança à leur poursuite » ajoute toutefois une nuance dynamique absente de רדף, qui signifie simplement « poursuivit ».'
  naturalness: Le français est globalement naturel et narratif. « Gédéon les poursuivit » est à la fois plus direct, plus idiomatique et plus proche de l’enchaînement verbal hébreu. « Il jeta dans la panique tout le camp » est compréhensible, mais « il sema la panique dans tout le camp » est plus naturel en français moderne tout en conservant la valeur causative.
  terminology: Les formes « Zéba » et « Tsalmounna » ne correspondent pas aux formes françaises bibliques courantes. « Zébach » et « Tsalmouna » assurent une translittération française plus établie et cohérente. « Madian » et « camp » conviennent.
  issues:
  - severity: medium
    issue: Formes des noms propres à normaliser.
    rationale: « Zéba » et particulièrement « Tsalmounna » ne sont pas les formes françaises bibliques usuelles. Employer « Zébach » et « Tsalmouna » améliore la cohérence onomastique sans modifier le sens.
  - severity: low
    issue: Nuance ajoutée dans « se lança à leur poursuite ».
    rationale: L’hébreu וַיִּרְדֹּף אַחֲרֵיהֶם signifie simplement qu’il les poursuivit ; « se lança » introduit une intensité non explicitée.
  revised_text: Zébach et Tsalmouna s’enfuirent. Gédéon les poursuivit et captura les deux rois de Madian, Zébach et Tsalmouna ; il sema la panique dans tout le camp.[a]
  revised_footnotes:
