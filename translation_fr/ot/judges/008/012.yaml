base_translation:
  language: en
  yaml_path: translation/ot/judges/008/012.yaml
  text: Zebah and Zalmunna fled[a], and he pursued them and captured the two kings of Midian, Zebah and Zalmunna; and he threw the whole camp into panic.
translation:
  language: fr
  text: Zébach et Tsalmouna s’enfuirent. Gédéon les poursuivit et captura les deux rois de Madian, Zébach et Tsalmouna ; il sema la panique dans tout le camp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « il terrifia tout le camp » ou « il mit en déroute tout le camp ». Le verbe hébreu peut exprimer le fait de faire trembler ou de semer la panique, avec ici une possible portée militaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנוּסוּ
  choice: s’enfuirent
  rationale: Le qal de נוּס exprime la fuite. « S’enfuirent » est naturel en français et conserve la force narrative du verbe.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Zéba et Tsalmounna
  rationale: Les noms propres sont translittérés selon leur forme française usuelle, sans être traduits.
- source_word: וַיִּרְדֹּף אַחֲרֵיהֶם
  choice: Gédéon se lança à leur poursuite
  rationale: רדף suivi de אחרי signifie poursuivre. Le sujet implicite est rendu par « Gédéon » pour éviter l’ambiguïté que créerait un simple pronom après la mention des deux rois.
- source_word: וַיִּלְכֹּד
  choice: captura
  rationale: Dans un contexte militaire, לכד désigne la capture ou la prise d’un adversaire.
- source_word: שְׁנֵי מַלְכֵי מִדְיָן
  choice: les deux rois de Madian
  rationale: Cette formulation naturelle conserve explicitement la relation construite de l’hébreu.
- source_word: אֶת זֶבַח וְאֶת צַלְמֻנָּע
  choice: Zéba et Tsalmounna
  rationale: La répétition appositive identifiant les deux rois est conservée pour respecter l’emphase du texte.
- source_word: וְכָל הַמַּחֲנֶה
  choice: tout le camp
  rationale: מַחֲנֶה désigne ici le camp militaire, éventuellement par métonymie les troupes qui s’y trouvent.
- source_word: הֶחֱרִיד
  choice: il jeta dans la panique
  rationale: Le hiphil de חרד signifie faire trembler, terrifier ou affoler. Cette formulation exprime la valeur causative et convient au contexte militaire sans imposer l’idée plus précise d’une déroute.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le nom « Gédéon » explicite le sujet implicite afin d’éviter que « il » ne soit compris comme renvoyant à l’un des deux rois. Le point-virgule maintient l’enchaînement serré des actions. Le marqueur [a] est placé après la proposition concernée.
