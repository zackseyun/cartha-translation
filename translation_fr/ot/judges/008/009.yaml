  text: וַ/יֹּ֛אמֶר גַּם לְ/אַנְשֵׁ֥י פְנוּאֵ֖ל לֵ/אמֹ֑ר בְּ/שׁוּבִ֣/י בְ/שָׁל֔וֹם אֶתֹּ֖ץ אֶת הַ/מִּגְדָּ֥ל הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/009.yaml
  text: He also said to the men of Penuel[a], “When I return in peace[c][b], I will tear down this tower.”
translation:
  language: fr
  text: 'Il dit aussi aux hommes de Pénouel[a] : « Quand je reviendrai en paix[b], je démolirai cette tour[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « les hommes de Pénouel » ; elle désigne probablement les responsables ou les représentants masculins de la ville, et non nécessairement tous ses habitants.
    reason: cultural_note
  - marker: b
    text: Ou « sain et sauf », « après avoir remporté la victoire sans dommage » ; littéralement « en paix ».
    reason: lexical_alternative
  - marker: c
    text: Cette « tour » pouvait être une tour fortifiée ou une place forte servant à la défense de Pénouel.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: aussi
  rationale: Marque l’ajout de cette déclaration à celle que Gédéon vient d’adresser aux gens de Soukkoth.
- source_word: לְאַנְשֵׁי פְנוּאֵל
  choice: aux hommes de Pénouel
  rationale: אַנְשֵׁי signifie littéralement « hommes de » ; dans ce contexte civique, il peut s’agir des responsables ou représentants masculins de la ville.
- source_word: בְּשׁוּבִי
  choice: quand je reviendrai
  rationale: L’infinitif construit avec préposition et suffixe de première personne exprime ici naturellement une circonstance temporelle.
- source_word: בְשָׁלוֹם
  choice: en paix
  rationale: 'Conserve l’expression hébraïque et son ambiguïté : elle peut évoquer un retour sain et sauf, victorieux ou sans encombre.'
- source_word: אֶתֹּץ
  choice: je démolirai
  rationale: Le verbe נתץ désigne la destruction ou la démolition d’une construction ; « démolirai » est précis, énergique et naturel en français.
- source_word: הַמִּגְדָּל הַזֶּה
  choice: cette tour
  rationale: מִגְדָּל désigne normalement une tour ; le terme concret est conservé, même si l’édifice avait vraisemblablement une fonction défensive.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe directe conserve la force de la menace de Gédéon. « En paix » maintient volontairement l’étendue de sens de שָׁלוֹם sans décider s’il s’agit surtout de sécurité, de victoire ou d’un retour sans dommage.
