  text: I have spoken once[a], and I will not answer; twice, and I will add nothing more.
translation:
  language: fr
  text: J’ai parlé une fois[a], et je ne répondrai pas ; deux fois, et je n’ajouterai rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’ai parlé une fois, mais je ne répondrai pas ; deux fois, mais je n’irai pas plus loin. » Le verbe hébreu traduit par « ajouter » peut aussi signifier continuer ou recommencer une action.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: une fois
  rationale: Le numéral féminin « un » est employé adverbialement avec « j’ai parlé » ; « une fois » rend naturellement cet idiome.
- source_word: דִּבַּרְתִּי
  choice: J’ai parlé
  rationale: Le parfait à la première personne désigne la parole antérieure de Job tout en gardant sa pertinence dans sa réponse présente.
- source_word: וְלֹא אֶעֱנֶה
  choice: et je ne répondrai pas
  rationale: Le verbe ענה signifie couramment « répondre ». La coordination par « et » préserve la formulation hébraïque sans imposer une nuance adversative.
- source_word: וּשְׁתַּיִם
  choice: deux fois
  rationale: Le numéral « deux » est employé adverbialement, en parallèle avec « une fois ».
- source_word: וְלֹא אוֹסִיף
  choice: et je n’ajouterai rien
  rationale: Le hiphil de יסף peut signifier « ajouter », « continuer » ou « recommencer ». Cette formulation conserve l’image hébraïque tout en laissant entendre que Job ne poursuivra pas son discours.
