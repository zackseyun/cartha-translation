  naturalness: La formulation est idiomatique en français moderne, concise et vigoureuse. « Pose la main sur lui ! Souviens-toi du combat » conserve le caractère direct et solennel de l’adresse. Les deux-points introduisent naturellement la conséquence ou l’avertissement final.
