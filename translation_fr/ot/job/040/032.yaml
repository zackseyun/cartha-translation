  text: שִׂים עָלָ֥י/ו כַּפֶּ֑/ךָ זְכֹ֥ר מִ֝לְחָמָ֗ה אַל תּוֹסַֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/032.yaml
  text: Lay your hand on him[a]; remember the battle—you will not do it again.
translation:
  language: fr
  text: 'Pose la main sur lui ! Souviens-toi du combat : tu ne recommenceras pas[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « n’ajoute pas ». L’expression peut se comprendre comme une défense — « ne recommence pas » — ou comme l’annonce du résultat : « tu ne recommenceras pas ».'
    reason: ambiguïté grammaticale et tournure idiomatique
lexical_decisions:
- source_word: שִׂים
  choice: Pose
  rationale: L’impératif signifie « mettre, poser ». Avec « la main sur lui », « pose » est naturel en français et conserve la force directe de l’ordre.
- source_word: עָלָיו
  choice: sur lui
  rationale: La préposition עַל munie du suffixe masculin singulier signifie ici simplement « sur lui ».
- source_word: כַּפֶּךָ
  choice: la main
  rationale: כַּף peut désigner la paume ou, par extension, la main. « Poser la main sur lui » rend naturellement l’image en français.
- source_word: זְכֹר
  choice: Souviens-toi
  rationale: L’impératif de זכר appelle directement à garder présent à l’esprit le combat et ses conséquences.
- source_word: מִלְחָמָה
  choice: du combat
  rationale: Dans le contexte d’un affrontement avec le Léviathan, « combat » est plus naturel que « guerre » et conserve l’idée d’une confrontation violente.
- source_word: אַל תּוֹסַף
  choice: tu ne recommenceras pas
  rationale: L’expression signifie littéralement « n’ajoute pas ». Dans ce contexte, elle évoque le fait de ne pas renouveler la tentative. Le futur français exprime bien la conséquence menaçante, tandis que la note conserve la valeur possible de défense.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et solennel. Les impératifs brefs rendent le ton provocateur de la première moitié du verset; les deux-points marquent la conséquence. Le tutoiement correspond à l’adresse divine individuelle dans le contexte.
