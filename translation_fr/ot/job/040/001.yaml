  text: וַ/יַּ֖עַן יְהוָ֥ה אֶת אִיּ֗וֹב וַ/יֹּאמַֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/001.yaml
  text: And Yahweh answered Job and said:[a]
translation:
  language: fr
  text: Yahweh répondit à Job et dit :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; également rendu par « Yahweh » ou « Jéhovah ».'
    reason: Signaler la forme hébraïque du nom divin et ses principaux rendus possibles.
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Le verbe ענה, dans cette formule narrative de dialogue, signifie « répondre ». Le passé simple convient au registre narratif français et conserve la structure formelle de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֶת
  choice: '[marqueur de l’objet direct, non traduit]'
  rationale: אֶת introduit « Job » comme complément d’objet direct et n’a pas d’équivalent lexical naturel en français.
- source_word: אִיּוֹב
  choice: Job
  rationale: « Job » est la forme française établie du nom אִיּוֹב.
- source_word: וַיֹּאמַר
  choice: et dit
  rationale: אמר est le verbe courant signifiant « dire ». La traduction garde les deux verbes de parole présents dans l’hébreu, malgré une légère redondance naturelle dans cette formule solennelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en conserve la valeur de nom propre sans le remplacer par le titre « le SEIGNEUR » ; « Jéhovah » est une autre forme traditionnelle.
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple est naturel dans le récit biblique écrit. La formule « répondit… et dit » conserve délibérément la double expression de l’hébreu.
