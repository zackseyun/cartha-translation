  yaml_path: translation/ot/job/040/014.yaml
  text: Then even I will praise you[a], because your right hand can save you.
translation:
  language: fr
  text: Alors, même moi, je te louerai, car ta main droite peut te sauver[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te sauver pour toi-même » ; l’hébreu emploie une préposition pouvant marquer l’avantage personnel (« pour toi »).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Alors, moi aussi
  rationale: L’expression assure la continuité avec le défi qui précède tout en mettant l’accent sur le locuteur; « Alors » rend naturellement la portée conditionnelle du contexte.
- source_word: אֲנִי
  choice: moi
  rationale: Le pronom explicite est conservé sous forme tonique pour souligner que Dieu lui-même parle.
- source_word: אוֹדֶךָ
  choice: je te louerai
  rationale: Le hiphil de ידה signifie ici reconnaître par la louange; dans ce contexte de concession divine, « louer » est plus naturel que « remercier ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la déclaration précédente dans un registre français courant et digne.
- source_word: תוֹשִׁיעַ
  choice: peut te sauver
  rationale: Le hiphil de ישׁע exprime le salut ou la délivrance. Dans le cadre du défi conditionnel, la formulation indique une capacité démontrée plutôt qu’une simple prédiction.
- source_word: לְךָ
  choice: te
  rationale: Le complément avec לְ exprime l’avantage, littéralement « pour toi-même »; « te sauver » est la formulation idiomatique française, tandis que la nuance est signalée en note.
- source_word: יְמִינֶךָ
  choice: ta main droite
  rationale: L’image concrète hébraïque, qui représente la force ou la puissance, est conservée plutôt que remplacée par son interprétation.
theological_decisions:
- issue: Image anthropomorphique de la puissance
  choice: ta main droite peut te sauver
  alternative: ta propre force peut te sauver
  rationale: L’hébreu emploie l’image concrète de la « main droite ». La conserver respecte le texte et évite de réduire l’image à une seule interprétation.
- issue: Nuance du complément לְךָ
  choice: te sauver, avec une note indiquant « sauver pour toi-même »
  alternative: sauver pour toi-même
  rationale: Le français idiomatique appelle le pronom objet « te », mais la préposition hébraïque peut souligner l’avantage personnel; la note préserve cette nuance sans alourdir le texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe garde l’emphase sur « moi aussi » et préserve l’image biblique de la main droite.
