  yaml_path: translation/ot/job/040/031.yaml
  text: Can you fill his hide with harpoons[b][a], or his head with fishing spears?
translation:
  language: fr
  text: Peux-tu cribler sa peau de harpons[a] et sa tête de lances de pêche[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de pointes barbelées » ; le terme hébreu est rare et peut désigner plus généralement des instruments de chasse pointus ou munis de crochets.
    reason: lexical_alternative
  - marker: b
    text: Ou « de harpons de pêche » ; le terme hébreu désigne un instrument servant à prendre des poissons, sans qu’on puisse en déterminer précisément la forme.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְמַלֵּא
  choice: Peux-tu cribler
  rationale: L’interrogatif et le piel inaccompli à la 2e personne introduisent un défi rhétorique. Avec des armes perforantes, « cribler de » exprime naturellement en français l’idée de couvrir ou remplir la peau de pointes.
- source_word: בְשֻׂכּוֹת
  choice: de harpons
  rationale: Ce nom rare désigne vraisemblablement des instruments pointus ou barbelés servant à la chasse ou à la pêche. « Harpons » convient au grand animal évoqué et préserve le parallélisme avec l’instrument de pêche du second membre.
- source_word: עוֹרוֹ
  choice: sa peau
  rationale: Traduction anatomique directe et naturelle en français pour la surface corporelle d’un animal.
- source_word: וּבְצִלְצַל דָּגִים
  choice: de foënes
  rationale: L’expression désigne littéralement un instrument associé aux poissons. La foëne est un harpon à plusieurs pointes employé pour pêcher et correspond bien à l’image d’une arme frappant la tête.
- source_word: רֹאשׁוֹ
  choice: sa tête
  rationale: Traduction directe qui maintient le parallélisme concret avec « sa peau ».
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et soutenu. « Cribler de » restitue idiomatiquement l’image hébraïque de remplir la peau d’armes pointues. « Foëne », terme précis mais moins courant, est éclairé par une note afin de préserver la distinction lexicale et le parallélisme du verset.
