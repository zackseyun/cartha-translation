base_translation:
  language: en
  yaml_path: translation/ot/job/040/002.yaml
  text: Will one who contends with the Almighty correct him? Let the one who argues with God answer it[a][b].
translation:
  language: fr
  text: Celui qui conteste le Tout-Puissant le corrigera-t-il ? Que celui qui argumente avec Dieu réponde à cela[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Celui qui cherche querelle au Tout-Puissant l’instruira-t-il ou le reprendra-t-il ? » L’hébreu associe le langage de la contestation judiciaire à celui de la correction.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qu’il réponde à cette question » ou « qu’il lui réponde ». Le suffixe hébreu peut renvoyer à l’affaire soulevée plutôt que directement à Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב
  choice: Celui qui conteste
  rationale: Le terme vient de ריב, « contester, disputer, plaider ». La tournure française exprime naturellement la personne qui engage une contestation contre Dieu tout en conservant la nuance judiciaire.
- source_word: עִם
  choice: avec
  rationale: La préposition signifie littéralement « avec » et, dans ce contexte de litige, laisse entendre l'opposition sans la rendre plus explicite que l'hébreu.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Traduction française usuelle du titre divin שדי, particulièrement fréquent dans Job.
- source_word: יִסּוֹר
  choice: prétendra-t-il le corriger
  rationale: Le verbe יסר peut signifier instruire, reprendre, corriger ou discipliner. Ici, le sujet humain est présenté comme voulant corriger Dieu. « Prétendra-t-il » rend la force rhétorique de la question sans modifier son contenu essentiel.
- source_word: מוֹכִיחַ
  choice: celui qui argumente
  rationale: Le participe de יכח peut désigner celui qui argumente, reprend ou plaide une cause. « Argumente » demeure accessible et garde la dimension de débat ou de contestation.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Cette forme poétique singulière, courante dans Job, se traduit simplement par « Dieu ».
- source_word: יַעֲנֶנָּה
  choice: réponde à cela
  rationale: Le suffixe féminin singulier renvoie probablement à la question ou à l'affaire soulevée. « À cela » est idiomatique en français, tandis que l'ambiguïté du référent est signalée en note.
theological_decisions:
- issue: 'Le sujet de יִסּוֹר : l''être humain corrige-t-il Dieu, ou reçoit-il une correction de Dieu ?'
  choice: La question rhétorique présente le contestataire humain comme prétendant corriger le Tout-Puissant.
  alternative: Celui qui conteste avec le Tout-Puissant devrait accepter la correction.
  rationale: La syntaxe et le parallélisme avec « celui qui argumente avec Dieu » favorisent le contestataire humain comme sujet du verbe. Cette lecture conserve la vigueur de la réprimande divine sans résoudre artificiellement les nuances lexicales de יסר.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le cadre de contestation judiciaire et la tension entre corriger, instruire et reprendre. Les deux appels de note figurent dans le texte principal.
