  text: בְּ/עֵינָ֥י/ו יִקָּחֶ֑/נּוּ בְּ֝/מֽוֹקְשִׁ֗ים יִנְקָב אָֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/024.yaml
  text: Can one capture him before his eyes? Can one pierce his nose with snares?[a][b]
translation:
  language: fr
  text: Peut-on le capturer sous ses yeux ? Peut-on lui percer le nez avec des pièges ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le prendra-t-on sous ses yeux ? Lui percera-t-on le nez avec des pièges ? » L’hébreu est concis et difficile ; les verbes peuvent être compris de façon moins impersonnelle.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « avec des pièges ». Certaines traductions traditionnelles emploient une image proche de « crochets », mais le nom hébreu désigne plus naturellement des pièges ou des collets.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: sous ses yeux
  rationale: La préposition בְּ avec « yeux » indique ici que l’action se ferait ouvertement, tandis que l’animal regarde. « Sous ses yeux » rend naturellement cette idée en français.
- source_word: יִקָּחֶנּוּ
  choice: peut-on le capturer
  rationale: לקח signifie couramment « prendre »; dans ce contexte de chasse, « capturer » précise le sens. La tournure interrogative fait ressortir le défi rhétorique du contexte.
- source_word: בְּמוֹקְשִׁים
  choice: avec des pièges
  rationale: מוֹקֵשׁ désigne normalement un piège ou un collet, plutôt qu’un crochet. « Pièges » conserve le sens lexical tout en laissant subsister l’image difficile du texte.
- source_word: יִנְקָב
  choice: percer
  rationale: נקב signifie « percer » ou « trouer ». « Percer » est précis, courant et adapté à l’action exercée sur le nez de l’animal.
- source_word: אָף
  choice: nez
  rationale: Ici, אַף désigne nécessairement la partie anatomique. « Nez » est plus direct que « narine » et ne précise pas davantage que l’hébreu.
theological_decisions:
- issue: Sujet implicite et valeur des formes verbales
  choice: Deux questions rhétoriques impersonnelles introduites par « Peut-on »
  alternative: « Le prendra-t-on sous ses yeux ? Lui percera-t-on le nez avec des pièges ? »
  rationale: L’hébreu est elliptique et ne nomme pas le sujet des verbes. La formulation impersonnelle française correspond au défi du contexte sans identifier arbitrairement un agent, tandis que la note conserve une lecture plus littérale des formes verbales.
translation_notes:
  register: Français international moderne, sobre et digne. Les deux questions parallèles gardent la force rhétorique du passage. « Sous ses yeux » est idiomatique; l’expression volontairement difficile « percer le nez avec des pièges » reste proche du lexique hébreu et est explicitée en note.
