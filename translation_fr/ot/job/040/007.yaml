  text: אֱזָר נָ֣א כְ/גֶ֣בֶר חֲלָצֶ֑י/ךָ אֶ֝שְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/007.yaml
  text: Gird up your loins like a man; I will question you[a], and you shall make it known to me.
translation:
  language: fr
  text: Ceins donc tes reins comme un homme[a] ! Je vais t’interroger, et toi, fais-le-moi savoir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme un homme vaillant » ou « comme un guerrier ». Littéralement, l’hébreu dit : « Ceins tes reins comme un homme. »'
    reason: Signaler la connotation possible de vigueur dans גבר et expliquer l’expression hébraïque concrète sans la remplacer dans le texte.
lexical_decisions:
- source_word: אֱזָר נָא
  choice: Ceins donc
  rationale: L’impératif de אזר exprime l’action concrète de se ceindre en vue d’agir. « Donc » rend ici la nuance d’insistance de נָא sans lui donner artificiellement un sens temporel.
- source_word: כְגֶבֶר
  choice: comme un homme
  rationale: גבר désigne un homme avec une possible connotation de vigueur. La traduction conserve le masculin et laisse le contexte communiquer l’idée de courage ou de force.
- source_word: חֲלָצֶיךָ
  choice: tes reins
  rationale: Le terme désigne la région des reins ou de la taille. « Ceindre ses reins » préserve l’image corporelle et l’idiome de préparation.
- source_word: אֶשְׁאָלְךָ
  choice: je vais t’interroger
  rationale: שאל signifie demander ou questionner ; dans ce défi solennel adressé à Job, « interroger » rend bien la portée soutenue et incisive du verbe.
- source_word: וְהוֹדִיעֵנִי
  choice: et toi, fais-moi savoir
  rationale: La forme causative impérative de ידע signifie « faire savoir, informer ». Cette formulation garde l’impératif et le sens causatif, tandis que « et toi » souligne naturellement le changement d’interlocuteur.
theological_decisions:
- issue: Langage masculin dans גבר
  choice: comme un homme
  alternative: comme un homme vaillant / comme un guerrier
  rationale: Le nom masculin singulier vise Job et évoque vraisemblablement la vigueur. Le rendre par « homme » préserve la forme et l’ambiguïté lexicale sans imposer le sens plus précis de « guerrier ».
translation_notes:
  register: Français moderne, direct et solennel. Le tutoiement correspond aux formes hébraïques singulières. L’image traditionnelle « ceindre ses reins » est conservée, avec une note pour les lecteurs qui ne connaissent pas cet idiome.
