  rationale: Traduction directe du nom avec suffixe masculin singulier.
- source_word: כְמוֹ אָרֶז
  choice: comme un cèdre
  rationale: La comparaison évoque la fermeté et la puissance du cèdre ; l’article indéfini est naturel en français.
- source_word: גִּידֵי
  choice: les tendons de
  rationale: גיד désigne des tendons ou des nerfs ; « tendons » est ici précis, concret et compréhensible.
- source_word: פחדו
  choice: ses cuisses
  rationale: Le terme hébreu est rare et incertain. « Cuisses » donne un sens anatomique cohérent sans trancher dans le texte principal en faveur d’une identification plus spécifique.
- source_word: יְשֹׂרָגוּ
  choice: sont entrelacés
  rationale: Le verbe décrit ce qui est tressé ou entrecroisé ; « entrelacés » restitue clairement l’image anatomique.
