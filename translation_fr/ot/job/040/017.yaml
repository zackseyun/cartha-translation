- source_word: יַחְפֹּץ
  choice: raidit
  rationale: Dans cette description physique, le verbe semble exprimer un mouvement ou une mise en tension. « Raidit » convient à la comparaison avec le cèdre tout en restant naturel en français.
- source_word: זְנָבוֹ
