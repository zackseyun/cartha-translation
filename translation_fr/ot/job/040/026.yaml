    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָשִׂים
  choice: Peux-tu lui passer
  rationale: La particule interrogative הֲ introduit une question rhétorique adressée à Job. « Peux-tu » exprime naturellement le défi, et « passer » convient au geste décrit avec une corde.
- source_word: אַגְמוֹן
  choice: une corde
  rationale: Le nom désigne littéralement un jonc ou un roseau, mais évoque ici vraisemblablement une corde fabriquée avec cette matière et servant à maîtriser l’animal. La note conserve le sens littéral.
- source_word: בְּאַפּוֹ
  choice: dans le nez
  rationale: אַף désigne le nez ou la narine. « Passer une corde dans le nez » restitue clairement et naturellement l’image en français.
- source_word: וּבְחוֹחַ
  choice: avec un crochet
  rationale: חוֹחַ peut désigner une épine ou un crochet. Dans cette scène de capture et de maîtrise d’un animal, « crochet » correspond le mieux à la fonction de l’objet.
- source_word: תִּקּוֹב
  choice: percer
  rationale: Le verbe exprime l’action de trouer ou de transpercer. « Percer » est précis, vivant et idiomatique.
- source_word: לֶחֱיוֹ
  choice: la mâchoire
  rationale: לְחִי peut désigner la mâchoire ou la joue. Dans le contexte de la pose d’un crochet, « mâchoire » donne l’image la plus concrète, tandis que l’autre sens est signalé en note.
