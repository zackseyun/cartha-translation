  text: Peux-tu lui passer une corde dans le nez[a] et lui percer la mâchoire[b] avec un crochet ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un jonc dans le nez » ; le terme hébreu peut évoquer ici une corde faite de joncs.'
