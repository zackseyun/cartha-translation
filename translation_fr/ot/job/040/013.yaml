  text: טָמְנֵ֣/ם בֶּ/עָפָ֣ר יָ֑חַד פְּ֝נֵי/הֶ֗ם חֲבֹ֣שׁ בַּ/טָּמֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/013.yaml
  text: Hide them together in the dust[b][a]; bind their faces in the hidden place.
translation:
  language: fr
  text: Cache-les ensemble dans la poussière[a] ; lie leurs visages dans le lieu caché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Enterre-les ensemble dans la poussière. » Le verbe hébreu peut signifier « cacher » et, dans ce contexte, évoquer l’ensevelissement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le secret » ou « dans ce qui est caché ». L’expression hébraïque finale est difficile ; elle renvoie probablement à un lieu caché et fait écho au verbe « cache » du début du verset.'
    reason: alternative_reading
lexical_decisions:
- source_word: טָמְנֵם
  choice: Cache-les
  rationale: Le verbe טמן signifie « cacher, dissimuler ». Avec la poussière, il peut évoquer l’ensevelissement, mais « cache » conserve son sens premier ainsi que l’écho avec בַּטָּמוּן.
- source_word: בֶּעָפָר
  choice: dans la poussière
  rationale: עָפָר désigne couramment la poussière ou la terre meuble ; « poussière » convient au registre poétique et à l’imagerie de la mort.
- source_word: יָחַד
  choice: tous ensemble
  rationale: L’adverbe indique ici une action collective. « Tous ensemble » rend explicitement la totalité impliquée par le pronom pluriel.
- source_word: פְּנֵיהֶם
  choice: leurs visages
  rationale: Traduction concrète et transparente du pluriel hébreu, sans réduire sa possible portée métonymique.
- source_word: חֲבֹשׁ
  choice: lie
  rationale: L’impératif de חבשׁ exprime fondamentalement l’action de lier ; cette formulation maintient l’image sans préciser indûment la manière ou le but.
- source_word: בַּטָּמוּן
  choice: dans le lieu caché
  rationale: La forme difficile semble désigner ce qui est caché ou un lieu caché. Cette traduction préserve l’écho lexical avec טָמְנֵם et évite l’interprétation plus poussée « dans les ténèbres ».
theological_decisions:
- issue: Portée funéraire possible de l’ordre
  choice: Conserver l’image de l’action de cacher dans la poussière
  alternative: « Enterre-les tous ensemble dans la poussière »
  rationale: Le contexte peut suggérer la mort et l’ensevelissement, mais le verbe hébreu n’impose pas à lui seul « enterrer ». L’ambiguïté est donc maintenue dans le texte et signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. L’impératif direct et le parallélisme sont conservés ; les notes maintiennent l’ambiguïté lexicale et la difficulté de la proposition finale.
