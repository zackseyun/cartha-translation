  text: וַ/יַּֽעַן יְהוָ֣ה אֶת אִ֭יּוֹב מנ סערה וַ/יֹּאמַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/006.yaml
  text: Then Yahweh answered Job out of the storm and said:[a]
translation:
  language: fr
  text: Alors Yahweh répondit à Job du sein de la tempête et dit :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du tourbillon ».
    reason: סְעָרָה peut désigner une tempête, une violente tourmente ou un tourbillon; le contexte ne permet pas de trancher avec certitude.
lexical_decisions:
- source_word: וַיַּעַן
  choice: Alors ... répondit
  rationale: Le waw consécutif fait progresser le récit. « Alors » marque naturellement la succession, et ענה signifie ici « répondre ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin, plutôt que par un titre.
- source_word: אֶת אִיּוֹב
  choice: à Job
  rationale: אֵת introduit Job comme objet de la réponse; en français, « répondre à quelqu’un » est la construction idiomatique.
- source_word: מן סערה
  choice: du milieu de la tempête
  rationale: סְעָרָה désigne une tempête, une tourmente ou un tourbillon. La tournure « du milieu de » exprime naturellement en français une voix provenant du phénomène, sans en préciser excessivement la forme.
- source_word: וַיֹּאמַר
  choice: 'et dit :'
  rationale: Cette formule narrative introduit les paroles directes qui suivent; les deux-points signalent leur commencement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte porte directement le nom divin. « Yahweh » le préserve comme nom propre au lieu de lui substituer un titre.
translation_notes:
  register: Français moderne, digne et accessible. « Du milieu de la tempête » est plus naturel que le calque « hors de la tempête », tandis que la répétition « répondit ... et dit » est conservée parce qu’elle reflète la formulation hébraïque.
