base_translation:
  language: en
  yaml_path: translation/ot/job/040/022.yaml
  text: The lotus trees cover him with their shade[b][a]; the willows of the brook surround him.
translation:
  language: fr
  text: Les lotus le couvrent de leur ombre[a] ; les saules du torrent l’entourent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les arbres qui donnent de l’ombre » ; l’identification précise de צֶאֱלִים est incertaine, bien que « lotus » soit la traduction traditionnelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « les peupliers de l’oued ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסֻכֻּהוּ
  choice: le couvrent
  rationale: Le verbe סכך exprime ici l’action de couvrir ou d’abriter. « Le couvrent » rend directement l’image, tandis que la mention de l’ombre en précise l’effet protecteur.
- source_word: צֶאֱלִים
  choice: les lotus
  rationale: Cette désignation botanique incertaine est traditionnellement comprise comme celle de lotus, arbres ou arbustes de milieu humide. Le terme traditionnel est conservé, avec une note signalant l’incertitude.
- source_word: צִלֲלוֹ
  choice: de leur ombre
  rationale: צֵל signifie « ombre ». Cette tournure française est naturelle avec « couvrent » et conserve l’image d’un abri ombragé.
- source_word: יְסֻבּוּהוּ
  choice: l’entourent
  rationale: Le verbe סבב signifie entourer ou encercler. « L’entourent » convient au parallélisme poétique sans ajouter de nuance hostile.
- source_word: עַרְבֵי נָחַל
  choice: les saules du torrent
  rationale: עַרְבֵי peut désigner des saules ou des peupliers riverains, et נַחַל un torrent, un cours d’eau ou son lit. « Les saules du torrent » offre une formulation claire et traditionnelle, tandis que la variante botanique et géographique est indiquée en note.
