id: JOB.40.9
reference: Job 40:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם זְר֖וֹעַ כָּ/אֵ֥ל לָ֑/ךְ וּ֝/בְ/ק֗וֹל כָּמֹ֥/הוּ תַרְעֵֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/009.yaml
  text: Or do you have an arm like God’s[a], and can you thunder with a voice like his?
translation:
  language: fr
  text: Ou bien as-tu un bras comme celui de Dieu[a], et peux-tu tonner d’une voix comme la sienne ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, moins probablement : « comme celui d’un dieu », si אֵל est pris dans un sens plus général ; le contexte favorise nettement « Dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Ou bien as-tu
  rationale: Dans la suite de questions rhétoriques, וְאִם prolonge le défi en proposant une autre comparaison impossible. « Ou bien » en restitue naturellement la force en français.
- source_word: זְרוֹעַ
  choice: un bras
  rationale: Le nom désigne littéralement le bras, image concrète de la puissance qu’il convient de conserver.
- source_word: כָּאֵל
  choice: comme celui de Dieu
  rationale: Le contexte désigne Dieu, qui parle à Job. En français, « celui de Dieu » explicite naturellement l’ellipse portant sur « bras » sans remplacer l’image par une abstraction.
- source_word: לָךְ
  choice: as-tu
  rationale: Le syntagme signifie littéralement « à toi » et exprime ici la possession ; « as-tu » est la tournure française idiomatique.
- source_word: וּבְקוֹל
  choice: et peux-tu… d’une voix
  rationale: La préposition בְּ introduit le moyen ou la manière. Avec le verbe « tonner », « d’une voix » produit une formulation française naturelle et conserve le nom « voix ».
- source_word: כָּמֹהוּ
  choice: comme la sienne
  rationale: Le pronom renvoie à Dieu et la comparaison porte sur sa voix ; le possessif français « la sienne » rend clairement ce rapport.
- source_word: תַרְעֵם
  choice: peux-tu tonner
  rationale: La forme verbale évoque l’action de produire ou de faire entendre le tonnerre. « Tonner » préserve l’imagerie de la manifestation divine, tandis que « peux-tu » fait ressortir le défi portant sur la capacité de Job.
theological_decisions:
- issue: Référence de אֵל dans la comparaison divine
  choice: Dieu
  alternative: un dieu
  rationale: Dans le contexte immédiat, c’est le Dieu d’Israël qui parle et compare sa puissance à celle de Job. « Dieu » est donc la lecture la plus probable, tout en signalant en note la possibilité grammaticale plus générale.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux questions coordonnées, l’image concrète du bras et le verbe « tonner » maintiennent le parallélisme et la puissance poétique de l’hébreu.
