  text: הֵ֤ן יַעֲשֹׁ֣ק נָ֭הָר לֹ֣א יַחְפּ֑וֹז יִבְטַ֓ח כִּֽי יָגִ֖יחַ יַרְדֵּ֣ן אֶל פִּֽי/הוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/023.yaml
  text: Look, if a river rages, he is not alarmed; he is confident even if the Jordan surges against his mouth.
translation:
  language: fr
  text: 'Voici : si le fleuve se déchaîne, il ne s’affole pas ; il reste confiant, même si le Jourdain se précipite jusqu’à sa gueule.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Même si
  rationale: Dans cette construction, la particule attire l’attention sur une situation hypothétique ; le français l’intègre naturellement à la proposition concessive.
- source_word: יַעֲשֹׁק נָהָר
  choice: le fleuve se déchaîne
  rationale: Le verbe peut évoquer une action violente ou accablante ; appliqué à un fleuve, « se déchaîne » transmet la violence de la crue sans imposer le sens littéral inhabituel « opprime ».
- source_word: לֹא יַחְפּוֹז
  choice: il ne s’affole pas
  rationale: Le verbe exprime la précipitation causée par l’alarme ; cette formulation convient au comportement assuré de l’animal.
- source_word: יִבְטַח
  choice: il reste confiant
  rationale: Rend directement l’idée de sécurité et d’assurance dans la situation décrite.
- source_word: יָגִיחַ
  choice: jaillit
  rationale: Le verbe désigne un mouvement impétueux, comme une eau qui fait irruption ou surgit.
- source_word: אֶל־פִּיהוּ
  choice: contre sa gueule
  rationale: « Gueule » est le terme français naturel pour la bouche d’un grand animal et « contre » exprime ici la direction du courant vers elle.
