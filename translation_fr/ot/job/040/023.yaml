  - severity: low
    issue: « Contre sa gueule » est plus conflictuel que le texte source.
    rationale: La préposition אֶל indique la direction vers la gueule ; « jusqu’à sa gueule » conserve cette orientation sans suggérer nécessairement un choc frontal.
