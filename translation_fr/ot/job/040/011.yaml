source:
  edition: WLC
  text: הָ֭פֵץ עֶבְר֣וֹת אַפֶּ֑/ךָ וּ/רְאֵ֥ה כָל גֵּ֝אֶ֗ה וְ/הַשְׁפִּילֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/011.yaml
  text: Pour out the overflowings of your anger[c][b][a], and look on everyone who is proud and bring him low.
translation:
  language: fr
  text: Répands les flots de ta colère[a] ; regarde tout orgueilleux et abaisse-le.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Disperse les débordements de ta fureur. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפֵץ
  choice: Répands
  rationale: L’impératif exprime l’action de lancer ou répandre avec force. « Répands » forme en français une image naturelle avec « les flots de ta colère », tout en gardant l’idée d’une colère libérée au-dehors.
- source_word: עֶבְרוֹת
  choice: les flots
  rationale: Le pluriel évoque les débordements ou transports violents de la fureur. « Les flots » conserve à la fois l’intensité, le pluriel et l’image du débordement.
- source_word: אַפֶּךָ
  choice: ta colère
  rationale: Bien que אַף désigne littéralement le nez, il s’agit ici de l’expression hébraïque courante pour la colère.
- source_word: וּרְאֵה
  choice: regarde
  rationale: L’impératif appelle à porter activement le regard sur les orgueilleux avant de les abaisser.
- source_word: כָל גֵּאֶה
  choice: tout orgueilleux
  rationale: 'L’adjectif substantivé au singulier a une valeur distributive : chaque personne orgueilleuse est visée individuellement.'
- source_word: וְהַשְׁפִּילֵהוּ
  choice: et abaisse-le
  rationale: Le hiphil de שׁפל signifie rendre bas ou abaisser. Le pronom singulier reprend naturellement « tout orgueilleux ».
theological_decisions: []
translation_notes:
  register: Formulation poétique, directe et digne. Le tutoiement correspond à l’adresse de Dieu à Job dans le contexte. Le singulier distributif « tout orgueilleux… abaisse-le » préserve la structure hébraïque sans alourdir le français.
