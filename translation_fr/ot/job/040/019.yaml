  text: He is the first of the works of God[b][a]; only his Maker can bring near his sword.
translation:
  language: fr
  text: Il est le premier parmi les œuvres de Dieu[a] ; que celui qui l’a fait approche son épée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il est le principal des voies de Dieu. »'
    reason: 'Alternative lexicale : רֵאשִׁית peut désigner le premier rang, et דֶּרֶךְ signifie littéralement « voie ».'
  - marker: b
    text: 'La fin du verset est difficile en hébreu. Elle peut aussi signifier : « seul celui qui l’a fait peut s’approcher de lui avec l’épée » ou « celui qui l’a fait lui a fourni son épée ».'
    reason: La syntaxe condensée et le référent du suffixe de « son épée » autorisent plusieurs lectures.
lexical_decisions:
- source_word: רֵאשִׁית
  choice: le premier
  rationale: Dans ce contexte, le terme exprime vraisemblablement la primauté de cette créature, sans exclure entièrement l’idée d’antériorité.
- source_word: דַּרְכֵי אֵל
  choice: parmi les œuvres de Dieu
  rationale: Littéralement « dans les voies de Dieu » ; dans ce contexte de création, « œuvres » rend naturellement l’activité créatrice de Dieu, tandis que « parmi » donne en français une construction idiomatique avec « le premier ».
- source_word: אֵל
  choice: Dieu
  rationale: Le titre divin אֵל se rend ici naturellement par « Dieu ».
- source_word: הָעֹשׂוֹ
  choice: celui qui l’a fait
  rationale: Cette formulation rend directement le participe substantivé accompagné du suffixe objet, sans ajouter un titre absent du texte.
- source_word: יַגֵּשׁ
  choice: peut approcher
  rationale: La forme causative signifie normalement « faire approcher » ou « présenter ». La tournure française conserve l’idée d’approche tout en reflétant la valeur modale probable de la proposition.
- source_word: חַרְבּוֹ
  choice: son épée
  rationale: Le suffixe masculin singulier est conservé par « son » ; le référent exact demeure néanmoins difficile à déterminer dans cette proposition très condensée.
theological_decisions:
- issue: Interprétation de la proposition finale difficile
  choice: seul celui qui l’a fait peut approcher son épée
  alternative: celui qui l’a fait lui a fourni son épée ; ou seul celui qui l’a fait peut s’approcher de lui avec l’épée
  rationale: L’hébreu est syntaxiquement condensé et permet plusieurs analyses. Le texte principal suit une lecture modale proche de la formulation hébraïque, tandis que la note signale les principales autres possibilités sans trancher artificiellement.
translation_notes:
  register: Français international moderne, digne et accessible. « Celui qui l’a fait » reste plus proche de l’hébreu que « son Créateur ». La difficulté réelle de la seconde proposition est conservée et explicitée en note.
