  text: Will he make a covenant with you[b][a], that you would take him as a servant forever?
translation:
  language: fr
  text: Conclura-t-il une alliance avec toi[a] ? Le prendras-tu comme esclave[b] pour toujours ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « coupera-t-il une alliance avec toi ? » En hébreu, « couper une alliance » est l’expression habituelle pour dire « conclure une alliance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme serviteur pour toujours ». Le mot hébreu עֶבֶד peut désigner un serviteur ou un esclave; ici, le contexte souligne une condition permanente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִכְרֹת בְּרִית
  choice: Conclura-t-il une alliance
  rationale: L’expression hébraïque signifie littéralement « couper une alliance », idiome courant pour établir ou conclure une alliance. « Conclure une alliance » est naturel et précis en français, tandis que la forme interrogative rend הֲ.
- source_word: עִמָּךְ
  choice: avec toi
  rationale: Rend directement la préposition et le suffixe de deuxième personne dans le discours adressé à Job.
- source_word: תִּקָּחֶנּוּ
  choice: pour que tu le prennes
  rationale: Le verbe לקח signifie « prendre » et le suffixe désigne l’animal au masculin singulier. « Pour que » exprime naturellement le lien de conséquence ou de finalité avec la première proposition sans le figer excessivement.
- source_word: לְעֶבֶד
  choice: comme esclave
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Dans ce contexte de possession permanente, « esclave » met mieux en relief la condition durable envisagée.
- source_word: עוֹלָם
  choice: pour toujours
  rationale: L’expression indique ici une durée indéfinie ou permanente; « pour toujours » conserve la vigueur de l’hébreu et le caractère rhétorique de la question.
