  text: תַּֽחַת צֶאֱלִ֥ים יִשְׁכָּ֑ב בְּ/סֵ֖תֶר קָנֶ֣ה וּ/בִצָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/021.yaml
  text: Under the lotus trees he lies down[a], in the shelter of the reeds and the marsh.
translation:
  language: fr
  text: Il se couche sous les lotus[a], à l’abri des roseaux et du marais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous les arbres ombrageux ». L’espèce exacte désignée par le terme hébreu est incertaine; « lotus » correspond à une identification contextuelle courante.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: sous
  rationale: Préposition spatiale indiquant que l’animal se trouve au-dessous de la végétation; « sous » est naturel et précis en français.
- source_word: צֶאֱלִים
  choice: les lotus
  rationale: Le terme désigne probablement des lotus ou des arbres procurant de l’ombre dans ce milieu riverain. « Lotus » retient l’identification contextuelle courante, tandis que l’incertitude botanique est signalée en note.
- source_word: יִשְׁכָּב
  choice: il se couche
  rationale: L’imparfait qal décrit ici une action habituelle ou présentée avec vivacité; « se couche » exprime naturellement la posture de repos de l’animal.
- source_word: בְּסֵתֶר
  choice: à l’abri
  rationale: סֵתֶר évoque un lieu caché, couvert ou protecteur. « À l’abri » rend idiomatiquement cette fonction de la végétation.
- source_word: קָנֶה
  choice: des roseaux
  rationale: Le singulier hébreu peut avoir un sens collectif; le pluriel français convient au massif de roseaux évoqué.
- source_word: וּבִצָּה
  choice: et du marais
  rationale: בִּצָּה désigne un terrain marécageux. « Marais » restitue clairement le cadre humide sans préciser excessivement sa nature.
