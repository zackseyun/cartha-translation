  text: עֲדֵ֥ה נָ֣א גָֽא֣וֹן וָ/גֹ֑בַהּ וְ/ה֖וֹד וְ/הָדָ֣ר תִּלְבָּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/010.yaml
  text: Adorn yourself[a], please, with majesty and loftiness, and clothe yourself with splendor and honor.
translation:
  language: fr
  text: 'Pare-toi donc[a] de grandeur et d’élévation,

    revêts-toi de splendeur et de majesté.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pare-toi maintenant d’orgueil et de hauteur ; revêts-toi de gloire et de magnificence. »'
    reason: Alternative lexicale pour נָא, גָאוֹן, גֹּבַהּ, הוֹד et הָדָר, dont les nuances poétiques peuvent être rendues de plusieurs façons.
lexical_decisions:
- source_word: עֲדֵה
  choice: Pare-toi
  rationale: L’impératif exprime l’action de se parer; ce choix français est naturel, poétique et maintient le parallèle avec « revêts-toi ».
- source_word: נָא
  choice: donc
  rationale: La particule marque ici une exhortation insistante dans le défi lancé à Job. « Donc » rend cette force contextuelle plus naturellement que « s’il te plaît », qui risquerait de suggérer une demande polie.
- source_word: גָאוֹן
  choice: grandeur
  rationale: Dans ce contexte, le terme évoque l’élévation majestueuse et souveraine plutôt que l’orgueil moralement condamnable.
- source_word: גֹּבַהּ
  choice: élévation
  rationale: Littéralement lié à la hauteur, le mot désigne ici une grandeur élevée. « Élévation » préserve l’image et l’ambiguïté possible sans imposer la nuance négative d’« arrogance ».
- source_word: הוֹד
  choice: splendeur
  rationale: Le mot désigne une magnificence visible et imposante; « splendeur » convient au registre poétique et royal.
- source_word: הָדָר
  choice: majesté
  rationale: Le terme peut exprimer magnificence, dignité ou beauté imposante. « Majesté » complète naturellement « splendeur » sans effacer la solennité du passage.
- source_word: תִּלְבָּשׁ
  choice: revêts-toi
  rationale: Cette formulation conserve explicitement la métaphore du vêtement et poursuit la valeur exhortative de l’impératif initial.
theological_decisions:
- issue: Faut-il donner à גָאוֹן et גֹּבַהּ une valeur morale négative ou les comprendre comme des attributs de grandeur souveraine ?
  choice: Les rendre par « grandeur et élévation », dans le sens principal de majesté souveraine.
  alternative: « orgueil et hauteur » ou « fierté et dignité »
  rationale: Dieu met Job au défi de se parer des attributs d’autorité et de magnificence nécessaires pour gouverner et juger. Le parallèle avec « splendeur et majesté » favorise ce sens, tout en laissant en note la possibilité lexicale d’une nuance d’orgueil.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe singulière. Le parallélisme hébreu et la métaphore vestimentaire sont conservés.
