  text: Then Job answered Yahweh and said:[a]
translation:
  language: fr
  text: 'Alors Job répondit à Yahweh[a] et dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH », le tétragramme, nom divin. « Yahweh » en est une vocalisation couramment employée ; la prononciation ancienne exacte n’est pas certaine. La tradition emploie aussi « Jéhovah » ou substitue « le SEIGNEUR ».'
    reason: Précise la nature consonantique de YHWH, conserve l’incertitude de vocalisation et distingue les usages traditionnels de traduction.
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Le qal wayyiqtol de ענה introduit la réponse de Job. « Répondit » est naturel, précis et conserve la forme narrative du texte.
- source_word: אִיּוֹב
  choice: Job
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: 'Marqueur de l’objet direct, représenté en français par la construction du verbe avec son complément indirect : « répondit à Yahweh ».'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle en français du tétragramme, qui préserve ici le nom divin plutôt que de lui substituer un titre.
- source_word: וַיֹּאמַר
  choice: et dit
  rationale: Le qal wayyiqtol de אמר complète la formule hébraïque d’introduction du discours. Le maintien des deux verbes, « répondit… et dit », préserve la structure de la source malgré une légère redondance en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: YHWH ; Jéhovah ; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » en donne une vocalisation largement admise tout en conservant le caractère de nom propre ; la note signale l’incertitude de prononciation et les autres usages.
translation_notes:
  register: Français moderne, digne et accessible. La formule hébraïque redondante « répondit… et dit » est volontairement conservée afin de refléter la structure narrative originale.
