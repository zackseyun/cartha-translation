source:
  edition: WLC
  text: הֵ֣ן קַ֭לֹּתִי מָ֣ה אֲשִׁיבֶ֑/ךָּ יָ֝דִ֗/י שַׂ֣מְתִּי לְמוֹ פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/004.yaml
  text: Look[a], I am insignificant; what can I answer you? I put my hand over my mouth.
translation:
  language: fr
  text: Oui, je suis peu de chose[a] ; que pourrais-je te répondre ? J’ai mis ma main sur ma bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je compte pour peu » ; traditionnellement : « je suis vil ».'
    reason: 'Variante lexicale : קַלֹּתִי peut exprimer le peu d’importance ou la petitesse ; la formulation traditionnelle, plus moralement chargée, est signalée sans être retenue comme sens principal.'
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: La particule introduit ici la reconnaissance de Job. « Oui » rend naturellement son acquiescement soudain en français, sans l’archaïsme de « voici ».
- source_word: קַלֹּתִי
  choice: je suis peu de chose
  rationale: Le verbe קלל exprime ici le fait d’être léger, petit ou de peu d’importance. Cette formulation traduit l’abaissement de Job sans lui attribuer explicitement une indignité morale.
- source_word: מָה אֲשִׁיבֶךָּ
  choice: que pourrais-je te répondre ?
  rationale: מָה introduit la question rhétorique, tandis que le hiphil de שוב a ici le sens de répondre. Le conditionnel « pourrais-je » fait ressortir l’incapacité reconnue par Job.
- source_word: יָדִי שַׂמְתִּי לְמוֹ פִי
  choice: Je mets la main sur ma bouche
  rationale: L’expression concrète est conservée. En contexte de discours direct, le présent français rend naturellement le geste par lequel Job signifie qu’il se tait.
theological_decisions:
- issue: La portée morale de la manière dont Job se qualifie
  choice: je suis peu de chose
  alternative: je suis méprisable
  rationale: Le terme hébreu évoque plus directement la petitesse ou le peu d’importance que la corruption morale. La traduction préserve donc l’humilité de Job sans transformer ses paroles en confession explicite de dépravation.
translation_notes:
  register: Français moderne, sobre et digne. Le tutoiement correspond à l’adresse directe à Dieu dans le contexte. La syntaxe reste proche de l’hébreu tout en étant naturelle à l’oral comme à l’écrit.
