source:
  edition: WLC
  text: רְאֵ֣ה כָל גֵּ֭אֶה הַכְנִיעֵ֑/הוּ וַ/הֲדֹ֖ךְ רְשָׁעִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/012.yaml
  text: Look on everyone who is proud[a], and humble him; and tread down the wicked where they stand.
translation:
  language: fr
  text: Regarde tous les orgueilleux et abaisse-les ; écrase les méchants là où ils se trouvent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à leur place » ; littéralement, « sous eux ».
    reason: 'Alternative lexicale pour תַּחְתָּם : l’expression hébraïque est idiomatique et peut désigner le lieu même où ils se trouvent.'
lexical_decisions:
- source_word: רְאֵה
  choice: Regarde
  rationale: L’impératif adresse à Job l’ordre de porter son regard sur les orgueilleux ; « Regarde » est direct, naturel et fidèle.
- source_word: כָל גֵּאֶה
  choice: tout être orgueilleux
  rationale: L’adjectif substantivé désigne distributivement chaque personne orgueilleuse. Cette formulation conserve le singulier repris par le suffixe de הַכְנִיעֵהוּ.
- source_word: הַכְנִיעֵהוּ
  choice: abaisse-le
  rationale: Le hiphil de כנע exprime le fait de faire descendre ou de soumettre l’orgueilleux ; « abaisse-le » maintient nettement le contraste avec son orgueil.
- source_word: וַהֲדֹךְ
  choice: écrase
  rationale: L’impératif exprime une action énergique d’anéantissement ou d’abaissement violent. « Écrase » rend cette force sans ajouter l’image plus précise du piétinement.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Traduction française courante de ce terme désignant une catégorie morale, ici au pluriel.
- source_word: תַּחְתָּם
  choice: sur place
  rationale: Dans ce contexte, תחתם peut désigner l’endroit même où ils se trouvent. « Sur place » est idiomatique et laisse entendre l’immédiateté du jugement.
theological_decisions:
- issue: Nature de l’ordre adressé à Job
  choice: Conserver les impératifs comme éléments du défi divin, sans préciser si Job peut réellement les accomplir.
  alternative: Transformer les ordres en hypothèse explicite ou les présenter comme une délégation effective de l’autorité divine.
  rationale: Le contexte fait de ces actes de jugement un défi lancé à Job. La traduction garde la force grammaticale des impératifs et la tension théologique, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme des deux impératifs est conservé, ainsi que le passage du singulier distributif (« tout être orgueilleux… le ») au pluriel collectif (« les méchants »).
