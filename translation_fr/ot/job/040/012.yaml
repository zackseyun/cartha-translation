review_pass:
  verdict: revise
  source_fidelity: Le sens des impératifs et le contraste entre les orgueilleux et les méchants sont bien rendus. Toutefois, « sur place » ajoute facilement en français l’idée temporelle d’une action immédiate, alors que תחתם désigne plus directement le lieu où les méchants se trouvent (« à leur place », « là où ils sont »).
  naturalness: « Tout être orgueilleux » est grammaticalement possible mais peu idiomatique dans ce registre. « Tous les orgueilleux » est plus naturel et conserve la portée collective et distributive du texte.
  terminology: « Orgueilleux », « abaisse » et « méchants » conviennent au registre biblique moderne. « Écrase » rend de façon acceptable la force du verbe hébreu dans ce contexte de jugement.
  issues:
  - severity: medium
    issue: « sur place » pour תחתם
    rationale: En français moderne, l’expression peut signifier « immédiatement », nuance absente du texte. « Là où ils se trouvent » rend explicitement la valeur locative sans surinterprétation.
  - severity: low
    issue: « tout être orgueilleux »
    rationale: La formulation est lourde et moins naturelle que le substantif collectif « tous les orgueilleux ».
  revised_text: Regarde tous les orgueilleux et abaisse-les ; écrase les méchants là où ils se trouvent.[a]
