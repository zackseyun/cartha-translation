  text: הִנֵּה נָ֣א כֹח֣/וֹ בְ/מָתְנָ֑י/ו וְ֝/אֹנ֗/וֹ בִּ/שְׁרִירֵ֥י בִטְנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/016.yaml
  text: Look now[a], his strength is in his loins[b], and his power in the muscles of his belly.
translation:
  language: fr
  text: 'Vois donc : sa force est dans ses reins, et sa vigueur dans les muscles[a] de son ventre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tendons ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Vois donc
  rationale: הִנֵּה attire vivement l’attention, tandis que נָא renforce l’invitation à observer. « Vois donc » est naturel en français moderne et conserve cette insistance.
- source_word: כֹחוֹ
  choice: sa force
  rationale: כֹחַ désigne ici la force physique de la créature. « Force » est direct et convient au parallélisme corporel du verset.
- source_word: בְמָתְנָיו
  choice: dans ses reins
  rationale: מָתְנַיִם désigne la région des reins, des hanches ou de la taille. « Reins » conserve l’image anatomique large et le registre poétique sans réduire le sens aux seules hanches.
- source_word: וְאֹנוֹ
  choice: et sa vigueur
  rationale: אוֹן exprime la force ou la vigueur. « Vigueur » maintient le chevauchement avec כֹחַ tout en reproduisant la variation du parallélisme hébreu.
- source_word: בִּשְׁרִירֵי
  choice: dans les muscles
  rationale: שְׁרִירִים peut désigner les muscles, les tendons ou les parties fermes du corps. « Muscles » donne l’image anatomique la plus claire en français actuel, tandis que l’autre possibilité est signalée en note.
- source_word: בִטְנוֹ
  choice: de son ventre
  rationale: בֶּטֶן désigne ici le ventre ou l’abdomen. « Ventre » est le terme courant qui convient au langage concret et poétique du passage.
