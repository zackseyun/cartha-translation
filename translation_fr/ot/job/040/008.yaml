id: JOB.40.8
reference: Job 40:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ֭/אַף תָּפֵ֣ר מִשְׁפָּטִ֑/י תַּ֝רְשִׁיעֵ֗/נִי לְמַ֣עַן תִּצְדָּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/008.yaml
  text: Would you even annul my justice? Would you condemn me so that you may be justified?[a]
translation:
  language: fr
  text: Vas-tu jusqu’à annuler ma justice[a] ? Me condamneras-tu afin d’être reconnu juste ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mon jugement ». Le mot hébreu mishpati peut désigner le jugement, la justice ou le droit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאַף
  choice: Vas-tu jusqu’à
  rationale: L’association de la particule interrogative et de אַף renforce la question. « Vas-tu jusqu’à » exprime naturellement en français l’étonnement indigné du texte.
- source_word: תָּפֵר
  choice: annuler
  rationale: Le hifil de פרר signifie rendre nul ou sans effet. « Annuler » conserve ici la force juridique du verbe.
- source_word: מִשְׁפָּטִי
  choice: ma justice
  rationale: מִשְׁפָּט peut désigner le jugement, la justice ou le droit. Dans ce contexte, « ma justice » évoque la juste manière d’agir et de gouverner de Dieu, tout en maintenant la portée judiciaire du terme.
- source_word: תַּרְשִׁיעֵנִי
  choice: Me condamneras-tu
  rationale: Le hifil de רשע a ici le sens judiciaire de déclarer coupable ou de condamner. Cette formulation française préserve nettement le cadre judiciaire.
- source_word: לְמַעַן
  choice: afin de
  rationale: La locution introduit le but recherché. « Afin de » rend clairement cette relation sans l’atténuer.
- source_word: תִּצְדָּק
  choice: être reconnu juste
  rationale: Dans ce contexte judiciaire, le qal de צדק signifie être tenu ou reconnu pour juste. Cette formulation maintient le contraste avec « condamner » et évite le sens courant, potentiellement ambigu, de « se justifier ».
theological_decisions:
- issue: Rendu judiciaire ou moral du verset
  choice: 'Employer un langage judiciaire : « annuler ma justice », « condamner », « être reconnu juste »'
  alternative: 'Employer un langage moral plus général : « nier que je suis juste », « me donner tort pour avoir raison »'
  rationale: Les termes hébreux מִשְׁפָּט, רשע et צדק forment un ensemble fortement judiciaire. Le conserver maintient la tension du reproche divin sans réduire celui-ci à un simple désaccord personnel.
- issue: Sens de מִשְׁפָּטִי
  choice: ma justice
  alternative: mon jugement
  rationale: « Ma justice » convient au contexte plus large de la juste gouvernance divine. « Mon jugement » demeure toutefois une lecture lexicale possible et figure donc en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme des deux questions ainsi que leur vocabulaire judiciaire, sans résoudre l’ambiguïté de מִשְׁפָּטִי.
