  text: תִּמְשֹׁ֣ךְ לִוְיָתָ֣ן בְּ/חַכָּ֑ה וּ֝/בְ/חֶ֗בֶל תַּשְׁקִ֥יעַ לְשֹׁנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/025.yaml
  text: Can you draw out Leviathan with a fishhook[b][a], or press down his tongue with a rope?
translation:
  language: fr
  text: Peux-tu tirer Léviathan avec un hameçon, ou lui faire baisser la langue avec une corde[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « faire descendre sa langue avec une corde ». Ou : « abaisser sa langue avec une corde ». L’image hébraïque est difficile et peut évoquer la maîtrise de la créature par la bouche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשֹׁךְ
  choice: tirer
  rationale: Le qal de משׁך exprime ici l’action de tirer ou de ramener une prise. « Tirer » conserve l’image concrète sans préciser indûment si la créature est ramenée à soi ou sortie de l’eau.
- source_word: לִוְיָתָן
  choice: Léviathan
  rationale: Le terme est conservé comme nom ou désignation propre, conformément à l’absence d’article en hébreu et sans identifier la créature à une espèce particulière.
- source_word: בְּחַכָּה
  choice: avec un hameçon
  rationale: חכה désigne un crochet servant à la pêche ; « hameçon » rend clairement cette image en français courant.
- source_word: וּבְחֶבֶל
  choice: avec une corde
  rationale: חבל peut désigner une corde ou un cordon. « Corde » est naturel et ne réduit pas le terme à une simple ligne de pêche.
- source_word: תַּשְׁקִיעַ
  choice: maintenir … abaissée
  rationale: Le hiphil de שׁקע signifie littéralement faire descendre ou enfoncer. Dans cette image difficile, « maintenir … abaissée » exprime la contrainte exercée sur la langue sans reconstruire une technique de capture non explicitée.
- source_word: לְשֹׁנוֹ
  choice: lui … la langue
  rationale: L’hébreu nomme explicitement la langue. La traduction conserve ce détail plutôt que de le généraliser en « bouche ».
theological_decisions:
- issue: Identité de Léviathan
  choice: Conserver « Léviathan » sans identification zoologique ou mythologique explicite.
  alternative: Traduire ou expliquer dans le texte par « crocodile », « monstre marin » ou une autre identification.
  rationale: Le texte hébreu ne tranche pas ici la nature précise de la créature. La translittération préserve cette ambiguïté et évite d’imposer une interprétation.
translation_notes:
  register: Français moderne, clair et digne. La question rhétorique est conservée. « Ou » rend naturellement en français le parallélisme interrogatif entre les deux moyens de capture, tandis que la note maintient la difficulté de la seconde image.
