  text: הֲ/יַרְבֶּ֣ה אֵ֭לֶי/ךָ תַּחֲנוּנִ֑ים אִם יְדַבֵּ֖ר אֵלֶ֣י/ךָ רַכּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/027.yaml
  text: Will he make many pleas to you[b][a], or will he speak soft words to you?
translation:
  language: fr
  text: Va-t-il t’adresser de nombreuses supplications[a], ou t’adresser des paroles douces[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des demandes pressantes » : le terme hébreu désigne des requêtes insistantes visant à obtenir faveur ou compassion.'
    reason: lexical_alternative
  - marker: b
    text: Ou « des paroles aimables ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַרְבֶּה
  choice: Va-t-il multiplier
  rationale: Le hiphil de רבה exprime ici l’idée de rendre nombreux, donc de multiplier. Cette formulation conserve l’image hébraïque tout en restant naturelle en français.
- source_word: אֵלֶיךָ
  choice: devant toi / t’
  rationale: La préposition אֶל avec suffixe de deuxième personne indique l’orientation vers l’interlocuteur. « Devant toi » s’accorde naturellement avec « multiplier les supplications », tandis que « t’adresser » explicite cette même direction dans le second membre.
- source_word: תַּחֲנוּנִים
  choice: supplications
  rationale: Le nom désigne des demandes pressantes par lesquelles on sollicite faveur ou compassion. « Supplications » en préserve la force et convient au registre digne du passage.
- source_word: אִם
  choice: ou
  rationale: Dans ce parallélisme interrogatif, אִם introduit une seconde question coordonnée plutôt qu’une véritable condition.
- source_word: יְדַבֵּר
  choice: t’adresser
  rationale: Le piel de דבר signifie « parler ». Avec אֵלֶיךָ, « t’adresser » produit une expression française naturelle sans modifier le sens.
- source_word: רַכּוֹת
  choice: des paroles douces
  rationale: L’adjectif féminin pluriel est employé substantivement et désigne des propos doux ou aimables. L’ajout de « paroles » rend cet emploi explicite en français sans suggérer nécessairement la flatterie.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure en deux questions parallèles et la force rhétorique de l’hébreu sont conservées.
