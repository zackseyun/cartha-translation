  text: His bones are tubes of bronze[b][a]; his limbs are like bars of iron.
translation:
  language: fr
  text: Ses os sont des conduits de bronze[a] ; ses os, comme une barre de fer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des canaux de bronze ». Le terme hébreu peut évoquer des canaux ou des conduits plutôt que précisément des tubes.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme une pièce de fer coulée ». Le mot traduit par « os » peut aussi désigner la charpente osseuse, et le terme hébreu rendu par « barre » évoque un objet métallique coulé ou façonné.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָמָיו
  choice: ses os
  rationale: Le nom עֶצֶם désigne couramment les os ; ce sens anatomique direct convient au parallélisme du verset.
- source_word: אֲפִיקֵי
  choice: des tubes de
  rationale: אֲפִיקִים peut évoquer des canaux ou conduits. Dans cette description anatomique, « tubes » conserve l’image concrète de structures cylindriques et puissantes, sans la réduire à une simple comparaison de force.
- source_word: נְחוּשָׁה
  choice: bronze
  rationale: Dans les images poétiques bibliques de solidité, « bronze » est une traduction naturelle de נְחוּשָׁה, qui peut aussi désigner le cuivre.
- source_word: גְּרָמָיו
  choice: ses membres
  rationale: גֶּרֶם peut signifier « os », mais « membres » rend ici la variation poétique et élargit l’image corporelle sans répéter immédiatement « os ».
- source_word: כִּמְטִיל
  choice: comme des barres de
  rationale: מָטִיל désigne quelque chose de coulé ou de formé en métal. « Barres » exprime naturellement la rigidité et la masse suggérées dans ce contexte.
- source_word: בַּרְזֶל
  choice: fer
  rationale: « Fer » est le sens usuel de בַּרְזֶל et forme avec le bronze un parallèle métallique clair.
