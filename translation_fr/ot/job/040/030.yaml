  text: יִכְר֣וּ עָ֭לָי/ו חַבָּרִ֑ים יֶ֝חֱצ֗וּ/הוּ בֵּ֣ין כְּֽנַעֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/030.yaml
  text: Will traders bargain over him? Will they divide him among the merchants?[a][b]
translation:
  language: fr
  text: Des négociants marchanderont-ils à son sujet ? Le partageront-ils entre les marchands[a][b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Des compagnons se régaleront-ils de lui ? » Le premier membre de phrase est difficile en hébreu, et certains comprennent חַבָּרִים dans un sens non commercial.'
    reason: alternative_reading
  - marker: b
    text: 'Hébreu : « Cananéens » ; dans ce contexte, le terme désigne probablement des marchands.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְרוּ
  choice: marchanderont
  rationale: Le sens littéral courant est « creuser », mais, avec des acteurs humains et le parallélisme commercial du second membre, le verbe est vraisemblablement employé dans l’idée de conclure un marché ou de négocier.
- source_word: עָלָיו
  choice: à son sujet
  rationale: Cette expression rend naturellement la négociation portant sur l’animal sans préciser indûment s’il s’agit de son prix ou de sa possession.
- source_word: חַבָּרִים
  choice: négociants
  rationale: Le nom peut signifier « compagnons » ou « associés », mais le parallèle avec les marchands favorise ici un sens commercial. La note conserve l’autre possibilité.
- source_word: יֶחֱצוּהוּ
  choice: le partageront
  rationale: Le verbe signifie partager ou répartir. Cette formulation préserve l’ambiguïté entre répartition comme marchandise et découpage matériel.
- source_word: בֵּין
  choice: entre
  rationale: En français, « entre » convient naturellement devant un groupe pluriel et reste proche de la construction hébraïque.
- source_word: כְּנַעֲנִים
  choice: marchands
  rationale: Bien que le terme désigne littéralement des « Cananéens », il peut, par métonymie, signifier « marchands » ; le contexte commercial appuie ce sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Les deux questions rhétoriques sont conservées, ainsi que le masculin renvoyant à la créature du contexte. « Négociants » puis « marchands » maintient le parallélisme sans répétition stricte.
