source:
  edition: WLC
  text: כִּֽי ב֭וּל הָרִ֣ים יִשְׂאוּ ל֑/וֹ וְֽ/כָל חַיַּ֥ת הַ֝/שָּׂדֶ֗ה יְשַֽׂחֲקוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/020.yaml
  text: For the mountains bear food for him[b][a], and all the wild animals of the field play there.
translation:
  language: fr
  text: Car les montagnes lui fournissent leur produit[a], et tous les animaux sauvages y jouent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lui procurent de la nourriture »; littéralement : « portent pour lui leur produit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication de la manière dont Béhémoth trouve sa nourriture; « Car » rend naturellement cette valeur explicative.
- source_word: בּוּל
  choice: produit
  rationale: Le nom désigne ce que le sol produit, son rendement ou sa récolte. « Leur produit » conserve l’image des montagnes qui fournissent leur production, sans réduire d’emblée le terme à la seule nourriture.
- source_word: הָרִים
  choice: les montagnes
  rationale: C’est l’équivalent direct du pluriel défini et il désigne le milieu montagneux qui pourvoit aux besoins de l’animal.
- source_word: יִשְׂאוּ לוֹ
  choice: lui fournissent
  rationale: Littéralement, le verbe évoque le fait de porter; associé à « produit », il exprime idiomatiquement que les montagnes produisent ou procurent quelque chose pour lui.
- source_word: וְכָל חַיַּת הַשָּׂדֶה
  choice: et tous les animaux sauvages
  rationale: L’expression désigne collectivement les animaux vivant en liberté dans les espaces non cultivés. Cette formulation est actuelle et évite l’archaïsme de « bêtes des champs ».
- source_word: יְשַׂחֲקוּ
  choice: jouent
  rationale: Le piel de שׂחק exprime ici une activité libre et enjouée; « jouent » en est le rendu français le plus simple et naturel.
- source_word: שָׁם
  choice: y
  rationale: Le pronom adverbial reprend naturellement le lieu évoqué par les montagnes et évite la lourdeur de « jouent là ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et dignifié. La tournure « leur produit » maintient l’image agricole et la portée concrète de בּוּל, tandis que la note signale le sens contextuel de nourriture et la formulation plus littérale.
