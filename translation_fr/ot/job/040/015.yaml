  text: הִנֵּה נָ֣א בְ֭הֵמוֹת אֲשֶׁר עָשִׂ֣יתִי עִמָּ֑/ךְ חָ֝צִ֗יר כַּ/בָּקָ֥ר יֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/015.yaml
  text: Look now at Behemoth[a], which I made along with you; he eats grass like an ox.
translation:
  language: fr
  text: Regarde donc Béhémoth[a], que j’ai créé en même temps que toi ; il mange de l’herbe comme le bœuf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la bête ». Beaucoup comprennent « Béhémoth » comme le nom ou la désignation d’une grande créature particulière ; d’autres l’identifient à l’hippopotame ou à un autre grand animal.
    reason: Lecture alternative et identification zoologique incertaine.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Regarde donc
  rationale: הִנֵּה attire l’attention et נָא renforce ici l’invitation immédiate. « Regarde donc » est naturel en français moderne et convient au discours divin sans introduire la politesse de « s’il te plaît ».
- source_word: בְהֵמוֹת
  choice: Béhémoth
  rationale: Dans ce passage, le terme désigne une créature particulière. La translittération traditionnelle préserve sa force littéraire et évite une identification zoologique indûment certaine.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: que j’ai fait
  rationale: Le verbe עשה a ici son sens simple de « faire ». Cette formulation directe reste proche de l’hébreu et naturelle en français.
- source_word: עִמָּךְ
  choice: comme toi
  rationale: Littéralement « avec toi ». Dans ce contexte de création, l’expression rapproche Béhémoth de l’interlocuteur comme autre œuvre de Dieu ; « comme toi » exprime naturellement ce rapport sans suggérer une proximité spatiale.
- source_word: חָצִיר
  choice: de l’herbe
  rationale: Le nom désigne l’herbe ou la végétation servant de nourriture. « De l’herbe » est l’équivalent français le plus clair ici.
- source_word: כַבָּקָר
  choice: comme le bœuf
  rationale: בָּקָר peut désigner les bovins collectivement. Dans cette comparaison au singulier, « comme le bœuf » est idiomatique et conserve l’image concrète sans préciser indûment « taureau ».
- source_word: יֹאכֵל
  choice: il mange
  rationale: Le verbe masculin singulier reprend Béhémoth. Le pronom « il » maintient cette personnification grammaticale.
theological_decisions:
- issue: Identification de בְהֵמוֹת
  choice: Conserver « Béhémoth » comme désignation d’une créature particulière.
  alternative: Traduire par « la bête » ou identifier explicitement l’animal à l’hippopotame ou à une autre grande créature.
  rationale: Le contexte poétique présente une créature remarquable sans en donner une identification zoologique certaine. La translittération préserve cette ambiguïté et n’impose aucune interprétation particulière.
- issue: Sens de עִמָּךְ
  choice: Rendre par « comme toi » pour souligner que Béhémoth est, lui aussi, une créature faite par Dieu.
  alternative: Traduire plus littéralement par « avec toi » ou temporellement par « en même temps que toi ».
  rationale: L’hébreu permet l’idée d’association dans l’acte créateur sans exiger que le verset affirme une création strictement simultanée. « Comme toi » transmet le parallèle théologique tout en évitant cette surinterprétation temporelle.
translation_notes:
  register: Français international moderne, clair et digne. « Regarde donc » garde la vivacité de l’appel hébreu ; « Béhémoth » conserve l’ambiguïté du référent. La ponctuation suit le mouvement poétique de la phrase.
