  yaml_path: translation/ot/job/040/029.yaml
  text: Will you play with him like a bird[b][a], or tie him up for your girls?
translation:
  language: fr
  text: Joueras-tu avec lui comme avec un oiseau, ou l’attacheras-tu pour tes jeunes filles ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתְשַׂחֶק
  choice: Joueras-tu
  rationale: Le qal de שׂחק peut exprimer le fait de jouer ou de s’amuser. « Joueras-tu » est naturel en français actuel et convient à l’image d’un animal traité comme un jouet ou un animal apprivoisé.
- source_word: בּוֹ
  choice: avec lui
  rationale: Le suffixe pronominal est masculin singulier et renvoie au Léviathan. Le masculin français préserve directement cette reprise grammaticale.
- source_word: כַּצִּפּוֹר
  choice: comme avec un oiseau
  rationale: צִפּוֹר désigne couramment un oiseau. La tournure « jouer avec lui comme avec un oiseau » rend explicitement et naturellement la comparaison en français.
- source_word: וְתִקְשְׁרֶנּוּ
  choice: ou l’attacheras-tu
  rationale: קשר signifie attacher ou lier. « Attacher » restitue clairement l’idée de retenir l’animal, sans ajouter la nuance plus forte de « ligoter ».
- source_word: לְנַעֲרוֹתֶיךָ
  choice: pour tes jeunes filles
  rationale: נַעֲרוֹת désigne des filles ou de jeunes femmes. « Jeunes filles » est actuel, digne et conserve l’indication d’âge et de genre sans l’archaïsme de « jeunes filles en âge de se marier » ou « demoiselles ».
