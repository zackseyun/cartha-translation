    issue: Ajout de « Je ne te connaissais que »
    rationale: L’hébreu dit littéralement « je t’avais entendu »; dans le contexte, « entendre parler de toi » est justifié, mais remplacer le verbe par « connaître » et ajouter « ne… que » explicite et renforce le sens au-delà de l’énoncé source.
  - severity: low
    issue: Tournure « par ce que mon oreille avait entendu »
    rationale: La tournure est peu idiomatique et ambiguë en français moderne. Elle ne constitue pas une restitution naturelle de l’idiome hébreu.
