  text: לְ/שֵֽׁמַע אֹ֥זֶן שְׁמַעְתִּ֑י/ךָ וְ֝/עַתָּ֗ה עֵינִ֥/י רָאָֽתְ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/005.yaml
  text: I had heard of you by the hearing of the ear[a], but now my eye has seen you.
translation:
  language: fr
  text: J’avais entendu parler de toi par ouï-dire[a], mais maintenant mon œil t’a vu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par l’écoute de l’oreille »; autre traduction possible : « par ce que l’oreille entend ».'
    reason: L’expression hébraïque évoque l’information reçue indirectement; « par ouï-dire » en rend le sens idiomatique, tandis que la note conserve sa formulation littérale.
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: par ce que mon oreille avait entendu
  rationale: Cette formulation naturelle conserve l’image hébraïque de l’oreille et exprime une connaissance reçue indirectement, sans reproduire en français une tournure littérale peu idiomatique.
- source_word: שְׁמַעְתִּיךָ
  choice: Je ne te connaissais que…
  rationale: Littéralement, le texte dit « je t’avais entendu ». Dans ce contexte, il s’agit d’une connaissance de Dieu acquise par ce qui avait été entendu. « Je ne te connaissais que » rend clairement cette idée et prépare le contraste avec la vision directe, sans faire croire que Job oppose simplement l’audition d’une voix à la vue.
- source_word: וְעַתָּה
  choice: mais maintenant
  rationale: La conjonction introduit ici un contraste marqué entre la connaissance antérieure et l’expérience présente.
- source_word: עֵינִי
  choice: mon œil
  rationale: Le singulier de l’hébreu est conservé afin de respecter la diction poétique et la force personnelle de l’énoncé.
- source_word: רָאָתְךָ
  choice: t’a vu
  rationale: Le passé composé rend en français courant l’action accomplie dont le résultat demeure pertinent au moment où Job parle.
theological_decisions:
- issue: Nature de la « vision » de Dieu par Job
  choice: t’a vu
  alternative: t’a perçu / t’a rencontré directement
  rationale: Le verbe hébreu signifiant « voir » est rendu sans qualification. Le texte oppose l’écoute indirecte à la vision, mais ne précise pas la nature exacte de cette vision; la traduction préserve donc cette tension théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure principale privilégie l’intelligibilité tout en conservant l’image singulière de l’oreille et de l’œil ainsi que le contraste entre connaissance indirecte et rencontre directe.
