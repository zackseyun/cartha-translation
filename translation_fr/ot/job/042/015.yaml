  text: וְ/לֹ֨א נִמְצָ֜א נָשִׁ֥ים יָפ֛וֹת כִּ/בְנ֥וֹת אִיּ֖וֹב בְּ/כָל הָ/אָ֑רֶץ וַ/יִּתֵּ֨ן לָ/הֶ֧ם אֲבִי/הֶ֛ם נַחֲלָ֖ה בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/015.yaml
  text: And nowhere in all the land were women found as beautiful as Job’s daughters[a], and their father gave them an inheritance among their brothers.
translation:
  language: fr
  text: On ne trouvait dans tout le pays[a] aucune femme aussi belle que les filles de Job, et leur père leur donna un héritage parmi leurs frères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur toute la terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְצָא
  choice: on ne trouvait … aucune femme
  rationale: La forme passive exprime ici qu’il ne se trouvait personne de comparable. La tournure française impersonnelle avec « on » est naturelle et conserve ce sens existentiel.
- source_word: נָשִׁים יָפוֹת
  choice: aucune femme aussi belle
  rationale: נָשִׁים désigne des femmes, et יָפוֹת signifie « belles ». Avec la comparaison introduite par כ, « aucune femme aussi belle que » rend clairement la construction hébraïque.
- source_word: כִּבְנוֹת אִיּוֹב
  choice: que les filles de Job
  rationale: Le préfixe כ marque la comparaison ; après « aussi belle », le français demande naturellement « que ».
- source_word: בְּכָל הָאָרֶץ
  choice: dans tout le pays
  rationale: הָאָרֶץ peut désigner le pays ou la terre. Dans ce cadre narratif, « le pays » exprime naturellement l’étendue envisagée sans imposer une portée mondiale.
- source_word: וַיִּתֵּן לָהֶם
  choice: leur donna
  rationale: Cette formulation rend directement le verbe נתן et son complément indirect, dans un français narratif digne et concis.
- source_word: נַחֲלָה
  choice: un héritage
  rationale: נַחֲלָה désigne un héritage ou un bien héréditaire ; « un héritage » est ici la formulation la plus claire.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: parmi leurs frères
  rationale: בְּתוֹךְ signifie « au milieu de, parmi », et אֲחֵיהֶם désigne explicitement leurs frères. La traduction conserve ce détail social notable.
theological_decisions:
- issue: Terme de parenté genré
  choice: parmi leurs frères
  alternative: parmi leurs frères et sœurs
  rationale: L’hébreu emploie explicitement le pluriel masculin « frères ». Le conserver évite de neutraliser le texte et souligne que les filles reçurent un héritage au milieu des héritiers masculins.
- issue: Portée de הָאָרֶץ
  choice: dans tout le pays
  alternative: sur toute la terre
  rationale: Le mot peut signifier « pays » ou « terre ». Le contexte narratif favorise « pays », tout en laissant l’autre possibilité signalée en note.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. La phrase conserve la coordination du récit hébreu et la précision genrée de « frères ».
