source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל אִיּ֑וֹב וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל אֱלִיפַ֣ז הַ/תֵּֽימָנִ֗י חָרָ֨ה אַפִּ֤/י בְ/ךָ֙ וּ/בִ/שְׁנֵ֣י רֵעֶ֔י/ךָ כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/007.yaml
  text: And it happened[a], after Yahweh had spoken these words to Job, that Yahweh said to Eliphaz the Temanite, “My anger burns against you and against your two friends, because you have not spoken rightly of me, as my servant Job has.”
translation:
  language: fr
  text: 'Après que Yahweh eut adressé ces paroles à Job, il dit à Éliphaz le Témanite : « Ma colère brûle contre toi et contre tes deux amis, car vous n’avez pas parlé de moi avec justesse, comme l’a fait mon serviteur Job[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous ne m’avez pas parlé avec justesse, comme l’a fait mon serviteur Job ». La préposition hébraïque signifie littéralement « à moi », mais elle peut ici désigner ce qui est dit au sujet de Dieu.'
    reason: Préserver l’ambiguïté syntaxique et sémantique réelle de אֵלַי נְכוֹנָה sans introduire un complément d’objet absent du texte hébreu.
lexical_decisions:
- source_word: וַיְהִי אַחַר
  choice: Après que
  rationale: Rend naturellement en français moderne la transition narrative et la relation temporelle, sans reproduire lourdement l’idiome hébreu « et il arriva après ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel et suit le choix éditorial fourni, au lieu de le remplacer par un titre.
- source_word: דִּבֶּר ... אֶת־הַדְּבָרִים הָאֵלֶּה אֶל אִיּוֹב
  choice: eut adressé ces paroles à Job
  rationale: « Adresser des paroles à » exprime clairement l’acte de parler à Job; le passé antérieur marque l’action achevée précédant la déclaration à Éliphaz.
- source_word: אֱלִיפַז הַתֵּימָנִי
  choice: Éliphaz le Témanite
  rationale: Formes françaises conventionnelles du nom propre et du gentilé.
- source_word: חָרָה אַפִּי
  choice: Ma colère brûle
  rationale: Conserve l’image vive de l’idiome hébreu tout en restant intelligible et naturel en français.
- source_word: בְךָ וּבִשְׁנֵי רֵעֶיךָ
  choice: contre toi et contre tes deux amis
  rationale: Avec l’expression de la colère, la préposition indique les personnes visées; la répétition de « contre » assure la clarté.
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: vous n’avez pas parlé de moi avec justesse
  rationale: « De moi » rend le sens contextuel probable de אֵלַי, tandis que « avec justesse » laisse ouverte la portée de נְכוֹנָה entre vérité, correction et convenance.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: comme l’a fait mon serviteur Job
  rationale: Explicite en français l’ellipse verbale de la comparaison et préserve le titre significatif « mon serviteur ».
theological_decisions:
- issue: 'Sens de אֵלַי : parole au sujet de Dieu ou parole adressée à Dieu'
  choice: de moi
  alternative: à moi
  rationale: Le contexte immédiat évalue vraisemblablement ce que les amis ont affirmé au sujet de Dieu. Toutefois, la préposition hébraïque signifie littéralement « à moi »; cette possibilité réelle est donc conservée en note plutôt qu’effacée.
- issue: Portée de נְכוֹנָה dans l’évaluation divine
  choice: avec justesse
  alternative: ce qui est juste
  rationale: Cette formulation ne réduit pas le jugement divin à la seule exactitude factuelle et conserve la tension entre vérité, rectitude et convenance du discours.
- issue: Comparaison favorable entre Job et les amis
  choice: comme l’a fait mon serviteur Job
  alternative: comme mon serviteur Job
  rationale: La traduction maintient sans l’expliquer ni l’atténuer l’affirmation théologiquement tendue selon laquelle Job a parlé avec justesse, malgré les reproches que Dieu lui a précédemment adressés.
translation_notes:
  register: Français international moderne, digne et accessible. La transition hébraïque est allégée pour éviter une tournure narrative artificielle. Le nom divin est rendu par « Yahweh ». L’image de la colère qui brûle et l’ambiguïté de la parole « de/à » Dieu sont préservées.
