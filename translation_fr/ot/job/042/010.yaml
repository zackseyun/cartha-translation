  text: וַֽ/יהוָ֗ה שָׁ֚ב אֶת שבית אִיּ֔וֹב בְּ/הִֽתְפַּֽלְל֖/וֹ בְּעַ֣ד רֵעֵ֑/הוּ וַ֧/יֹּסֶף יְהוָ֛ה אֶת כָּל אֲשֶׁ֥ר לְ/אִיּ֖וֹב לְ/מִשְׁנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/010.yaml
  text: And Yahweh restored Job’s fortunes when he prayed for his friends[c][b][a], and Yahweh gave Job twice as much as he had before.
translation:
  language: fr
  text: Et Yahweh rétablit la situation de Job lorsqu’il pria en faveur de ses amis[a], et Yahweh lui rendit le double de tout ce qu’il avait eu auparavant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour ses amis ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ajouta à Job tout ce qui était à lui, au double ».'
    reason: formal_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin propre plutôt que de le remplacer par un titre, conformément à la distinction présente dans l’hébreu.
- source_word: שָׁב אֶת שבית אִיּוֹב
  choice: rétablit la situation de Job
  rationale: L’expression idiomatique désigne ici le renversement de la condition de Job et son rétablissement, sans impliquer nécessairement une captivité littérale.
- source_word: בְּהִתְפַּלְלוֹ
  choice: lorsqu’il pria
  rationale: La préposition avec l’infinitif construit marque naturellement la circonstance temporelle, sans affirmer plus explicitement un lien causal.
- source_word: בְּעַד רֵעֵהוּ
  choice: en faveur de ses amis
  rationale: בְּעַד exprime l’intercession en faveur d’autrui; le singulier collectif רֵעֵהוּ renvoie ici aux compagnons de Job.
- source_word: וַיֹּסֶף ... לְמִשְׁנֶה
  choice: lui rendit le double
  rationale: Dans ce contexte de rétablissement, cette formulation française naturelle exprime l’ajout par lequel Job reçoit deux fois ce qu’il possédait auparavant.
- source_word: אֶת כָּל אֲשֶׁר לְאִיּוֹב
  choice: de tout ce qu’il avait eu auparavant
  rationale: La proposition désigne l’ensemble des biens antérieurement possédés par Job; « auparavant » explicite sobrement la perspective rétrospective du contexte.
theological_decisions:
- issue: Rapport entre la prière de Job et son rétablissement
  choice: Lien temporel rendu par « lorsqu’il pria »
  alternative: « parce qu’il pria »
  rationale: La construction hébraïque relie les deux événements, mais ne requiert pas une causalité explicite; la traduction conserve ainsi la tension sans présenter le rétablissement comme une récompense mécanique.
- issue: Nature du rétablissement de Job
  choice: « rétablit la situation »
  alternative: « mit fin à la captivité »
  rationale: L’idiome peut évoquer un retournement de captivité ou de condition, mais le récit ne décrit pas Job comme un captif au sens littéral.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « Yahweh » est conservée pour refléter l’insistance du texte hébreu; « en faveur de » maintient clairement la portée intercessoire.
