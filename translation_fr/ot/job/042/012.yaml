  text: וַֽ/יהוָ֗ה בֵּרַ֛ךְ אֶת אַחֲרִ֥ית אִיּ֖וֹב מֵ/רֵאשִׁת֑/וֹ וַֽ/יְהִי ל֡/וֹ אַרְבָּעָה֩ עָשָׂ֨ר אֶ֜לֶף צֹ֗אן וְ/שֵׁ֤שֶׁת אֲלָפִים֙ גְּמַלִּ֔ים וְ/אֶֽלֶף צֶ֥מֶד בָּקָ֖ר וְ/אֶ֥לֶף אֲתוֹנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/012.yaml
  text: And Yahweh blessed the latter part of Job more than his beginning[a]. And he had fourteen thousand sheep, six thousand camels, a thousand yoke of oxen[b], and a thousand female donkeys.
translation:
  language: fr
  text: Yahweh bénit la dernière partie de la vie de Job plus que la première[a]. Job eut quatorze mille moutons[b], six mille chameaux, mille paires de bœufs[c] et mille ânesses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la fin de Job plus que son commencement ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut désigner collectivement le petit bétail, notamment les moutons et les chèvres.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « mille attelages de bœufs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément à sa fonction dans le texte hébreu.
- source_word: בֵּרַךְ
  choice: bénit
  rationale: Le verbe exprime la faveur active de Dieu, ici manifestée par la prospérité retrouvée, sans se réduire à celle-ci.
- source_word: אַחֲרִית אִיּוֹב מֵרֵאשִׁתוֹ
  choice: la dernière partie de la vie de Job plus que la première
  rationale: Cette formulation conserve le contraste entre la période ultérieure et la période initiale de la vie de Job, sans limiter אַחֲרִית à ses tout derniers jours.
- source_word: וַיְהִי לוֹ
  choice: Job eut
  rationale: Littéralement « il y eut pour lui » ; « Job eut » est l’expression française naturelle et lève clairement l’ambiguïté du pronom.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף צֹאן
  choice: quatorze mille moutons
  rationale: צֹאן est un collectif désignant le petit bétail, surtout les ovins et les caprins ; « moutons » est ici la désignation traditionnelle et contextuellement probable, avec une note préservant l’étendue du terme.
- source_word: שֵׁשֶׁת אֲלָפִים גְּמַלִּים
  choice: six mille chameaux
  rationale: Rendu direct du nombre et du nom.
- source_word: אֶלֶף צֶמֶד בָּקָר
  choice: mille paires de bœufs
  rationale: צֶמֶד désigne une paire d’animaux réunis pour le travail ; cette traduction conserve à la fois le dénombrement et le contexte agricole.
- source_word: אֶלֶף אֲתוֹנוֹת
  choice: mille ânesses
  rationale: Le nom hébreu est explicitement féminin ; « ânesses » en préserve naturellement la précision.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom divin personnel. « Yahweh » le rend directement au lieu de lui substituer un titre.
- issue: Nature de la bénédiction divine
  choice: bénit
  alternative: fit prospérer
  rationale: « Bénit » maintient la portée théologique du verbe, tandis que la liste des biens qui suit en montre l’effet matériel sans épuiser le sens de la bénédiction.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition initiale de « et » propre au récit hébreu n’est pas reproduite mécaniquement. « La dernière partie de la vie » évite l’expression « fin de vie », qui pourrait suggérer uniquement la période précédant immédiatement la mort.
