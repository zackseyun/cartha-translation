  terminology: « Yahweh » est cohérent avec le choix établi pour le tétragramme. « Malheur » rend bien רָעָה dans son sens de calamité subie. La translittération « qesita » conserve à juste titre l’incertitude relative à cet objet ou unité de valeur; « anneau d’or » maintient l’ambiguïté de נֶזֶם.
