id: JOB.42.11
reference: Job 42:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ אֵ֠לָי/ו כָּל אֶחָ֨י/ו וְ/כָל אחיתי/ו וְ/כָל יֹדְעָ֣י/ו לְ/פָנִ֗ים וַ/יֹּאכְל֨וּ עִמּ֣/וֹ לֶחֶם֮ בְּ/בֵית/וֹ֒ וַ/יָּנֻ֤דוּ ל/וֹ֙ וַ/יְנַחֲמ֣וּ אֹת֔/וֹ עַ֚ל כָּל הָ֣/רָעָ֔ה אֲשֶׁר הֵבִ֥יא יְהוָ֖ה עָלָ֑י/ו וַ/יִּתְּנוּ ל֗/וֹ אִ֚ישׁ קְשִׂיטָ֣ה אֶחָ֔ת וְ/אִ֕ישׁ נֶ֥זֶם זָהָ֖ב אֶחָֽד־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/011.yaml
  text: Then all his brothers[a], all his sisters, and all who had known him before came to him, and they ate bread with him in his house. They showed him sympathy and comforted him for all the calamity that Yahweh had brought upon him[d][c][b]. And each one gave him one qesitah and one gold ring.
translation:
  language: fr
  text: Alors tous ses frères, toutes ses sœurs et tous ceux qui l’avaient connu autrefois[a] vinrent auprès de lui. Ils mangèrent du pain avec lui dans sa maison[b]. Ils lui témoignèrent leur compassion et le consolèrent de tout le malheur que Yahweh avait fait venir sur lui. Chacun lui donna une qesita[c] et un anneau d’or[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes ses anciennes connaissances ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « mangèrent du pain », expression courante pour désigner un repas partagé.
    reason: cultural_note
  - marker: c
    text: La qesita était une ancienne unité ou pièce de valeur dont l’équivalent exact est inconnu.
    reason: cultural_note
  - marker: d
    text: Ou « un anneau de nez en or » ; le mot hébreu peut désigner un anneau porté au nez ou à l’oreille.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֵלָיו
  choice: vinrent auprès de lui
  rationale: Exprime simplement le mouvement vers Job dans un français narratif naturel.
- source_word: כָּל אֶחָיו וְכָל אֲחִיתָיו
  choice: tous ses frères, toutes ses sœurs
  rationale: Reproduit la mention distincte des frères et des sœurs ainsi que la répétition distributive de כָּל.
- source_word: וְכָל יֹדְעָיו לְפָנִים
  choice: et tous ceux qui l’avaient connu autrefois
  rationale: יֹדְעָיו désigne les personnes qui le connaissaient, et לְפָנִים situe cette relation dans le passé; la formulation laisse ouverte la nature exacte de ces relations.
- source_word: וַיֹּאכְלוּ עִמּוֹ לֶחֶם
  choice: Ils mangèrent du pain avec lui
  rationale: Conserve l’image concrète de l’hébreu tout en signalant en note son sens idiomatique de repas partagé.
- source_word: בְּבֵיתוֹ
  choice: dans sa maison
  rationale: Traduction directe de בְּבֵיתוֹ, claire et naturelle.
- source_word: וַיָּנֻדוּ לוֹ
  choice: Ils lui témoignèrent leur compassion
  rationale: Dans ce contexte, נוד exprime une manifestation de sympathie ou de commisération, et non un geste de dérision.
- source_word: וַיְנַחֲמוּ אֹתוֹ
  choice: le consolèrent
  rationale: Rend le sens contextuel usuel de נחם envers une personne éprouvée.
- source_word: עַל כָּל הָרָעָה
  choice: de tout le malheur
  rationale: רָעָה désigne ici le désastre subi plutôt que le mal moral; « malheur » convient au registre narratif et préserve la gravité de l’épreuve.
- source_word: אֲשֶׁר הֵבִיא יְהוָה עָלָיו
  choice: que Yahweh avait fait venir sur lui
  rationale: Suit de près la construction causative hébraïque et maintient explicitement l’attribution de l’épreuve à Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: אִישׁ קְשִׂיטָה אֶחָת
  choice: Chacun lui donna une qesita
  rationale: אִישׁ a ici une valeur distributive (« chacun »). La translittération de קְשִׂיטָה évite de lui attribuer une équivalence monétaire moderne incertaine.
- source_word: וְאִישׁ נֶזֶם זָהָב אֶחָד
  choice: et un anneau d’or
  rationale: נֶזֶם désigne un anneau ornemental, porté au nez ou à l’oreille selon le contexte; « anneau » conserve cette indétermination dans le texte.
theological_decisions:
- issue: Attribution à Yahweh du malheur subi par Job
  choice: que Yahweh avait fait venir sur lui
  alternative: que Yahweh avait permis de venir sur lui
  rationale: Le causatif הֵבִיא attribue explicitement à Yahweh le fait d’avoir fait venir le malheur sur Job. La traduction conserve cette tension théologique au lieu de l’atténuer en parlant seulement de permission.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme familial de l’hébreu est conservé, de même que l’image du pain partagé. Les termes culturellement incertains sont maintenus ou explicités en note sans surinterprétation.
