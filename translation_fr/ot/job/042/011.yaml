  source_fidelity: 'Le texte rend fidèlement les principaux éléments de l’hébreu : l’arrivée des frères, sœurs et anciennes connaissances, le repas dans la maison de Job, les manifestations de compassion et de consolation, l’attribution explicite du malheur à Yahweh, et les deux dons individuels. « Que Yahweh avait fait venir sur lui » préserve correctement la force causative de הֵבִיא sans atténuation théologique.'
