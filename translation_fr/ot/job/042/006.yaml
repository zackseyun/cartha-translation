  text: עַל כֵּ֭ן אֶמְאַ֣ס וְ/נִחַ֑מְתִּי עַל עָפָ֥ר וָ/אֵֽפֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/042/006.yaml
  text: Therefore I despise myself[a], and I repent in dust and ashes.
translation:
  language: fr
  text: C’est pourquoi je me méprise[a] et je me repens dans la poussière et la cendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est pourquoi je me rétracte et je change d’attitude au sujet de la poussière et de la cendre. » L’hébreu est concis et son interprétation discutée, notamment parce que le complément de « mépriser/rejeter » est sous-entendu et que le verbe traduit par « me repens » peut aussi signifier « regretter », « changer d’attitude » ou « être consolé ».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution marque la conclusion que Job tire de sa rencontre avec Dieu et de ce qu’il vient d’affirmer au verset 5.
- source_word: אֶמְאַס
  choice: je me méprise
  rationale: Le verbe signifie couramment « rejeter » ou « mépriser ». Aucun complément n’est exprimé en hébreu; le pronom réfléchi est donc une explicitation contextuelle, non une donnée grammaticale certaine.
- source_word: וְנִחַמְתִּי
  choice: et je me repens
  rationale: Au niphal, נחם peut exprimer le regret, le repentir, le changement d’attitude ou la consolation. Dans ce contexte d’abaissement devant Dieu, « je me repens » offre une lecture naturelle, tout en laissant les autres nuances dans la note.
- source_word: עַל
  choice: dans
  rationale: Avec « poussière et cendre », « dans » rend idiomatiquement en français la posture ou la condition d’humiliation et de deuil, bien que « au sujet de » soit possible selon l’analyse de la phrase.
- source_word: עָפָר וָאֵפֶר
  choice: la poussière et la cendre
  rationale: Cette expression consacrée évoque la mortalité, l’humiliation et le deuil; le singulier « la cendre » est idiomatique en français.
theological_decisions:
- issue: La réponse finale de Job exprime-t-elle le mépris de soi et le repentir, ou la rétractation de ses paroles?
  choice: Job exprime son abaissement personnel et son repentir.
  alternative: Job se rétracte et change d’attitude au sujet de la poussière et de la cendre, ou rejette ses propos antérieurs sans se prendre lui-même pour objet.
  rationale: 'L’hébreu est très concis: l’objet de אֶמְאַס n’est pas exprimé, et וְנִחַמְתִּי possède plusieurs nuances possibles. Le contexte immédiat favorise une réponse pénitentielle, mais les autres lectures restent suffisamment plausibles pour être signalées.'
translation_notes:
  register: Français international moderne, sobre et digne. La formulation principale reste naturelle tout en signalant explicitement, par la note, les ambiguïtés lexicales et syntaxiques du texte hébreu.
