id: JOB.42.2
reference: Job 42:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ידעת כִּי כֹ֣ל תּוּכָ֑ל וְ/לֹא יִבָּצֵ֖ר מִמְּ/ךָ֣ מְזִמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/002.yaml
  text: I know that you can do all things[a], and no purpose of yours can be thwarted.
translation:
  language: fr
  text: Je sais que tu peux tout et qu’aucun de tes projets ne peut être contrecarré.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucun de tes plans ne peut être empêché ». Le nom hébreu peut désigner un projet, un plan ou un dessein, et le verbe peut exprimer l’idée d’empêcher, de retenir ou de contrecarrer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: Je sais
  rationale: Dans le contexte, Job confesse maintenant ce qu’il reconnaît au sujet de Dieu. Le texte reçu de Job 42.2 est traditionnellement lu comme une forme à la première personne (« je sais »), rendue naturellement au présent en français.
- source_word: כִּי
  choice: que
  rationale: Introduit le contenu de la confession de Job après « Je sais ».
- source_word: כֹל
  choice: tout
  rationale: Avec le verbe יכל, exprime sans lourdeur l’étendue totale de la capacité divine.
- source_word: תּוּכָל
  choice: tu peux
  rationale: Le verbe יכל exprime la capacité ou le pouvoir. « Tu peux tout » est idiomatique, direct et fidèle en français.
- source_word: וְלֹא
  choice: et qu’aucun… ne
  rationale: Coordonne la seconde proposition négative avec la première tout en produisant une syntaxe française naturelle.
- source_word: יִבָּצֵר
  choice: ne peut être contrecarré
  rationale: Le nifal de בצר, construit ici avec מן, évoque ce qui est empêché, rendu inaccessible ou frustré. Avec מְזִמָּה, « être contrecarré » exprime clairement qu’un projet divin ne peut être mis en échec.
- source_word: מִמְּךָ
  choice: de tes
  rationale: La relation exprimée par מן est rendue idiomatiquement comme celle d’un projet qui vient de Dieu ou lui appartient.
- source_word: מְזִמָּה
  choice: projets
  rationale: Le nom peut désigner un projet, un plan, un dessein ou une intention. « Projets » reste courant et évite les connotations négatives que « stratagème » aurait en français.
theological_decisions:
- issue: Affirmation de la puissance de Dieu et de l’irréalisabilité de l’échec de ses intentions
  choice: tu peux tout et qu’aucun de tes projets ne peut être contrecarré
  alternative: tu peux tout et qu’aucun de tes desseins ne peut être empêché
  rationale: La formulation affirme la capacité sans limite de Dieu et l’impossibilité de faire échouer ses projets, sans ajouter de développement doctrinal au texte. Elle conserve aussi la portée intentionnelle de מְזִמָּה.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’adresse directe à Dieu. « Tu peux tout » garde la concision et la force de l’hébreu; « contrecarré » préserve l’idée d’un projet qu’on tenterait de mettre en échec.
