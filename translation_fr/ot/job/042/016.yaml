  yaml_path: translation/ot/job/042/016.yaml
  text: After this[a], Job lived one hundred and forty years, and saw his sons and his grandsons, four generations.
translation:
  language: fr
  text: Après cela, Job vécut encore cent quarante ans ; il vit ses fils et les fils de ses fils jusqu’à la quatrième génération.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement : « Il vécut assez longtemps pour voir ses fils et ses petits-fils jusqu’à la quatrième génération. » L’hébreu dit plus littéralement : « les fils de ses fils » et « quatre générations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut encore
  rationale: Le verbe חיה indique ici que Job continua de vivre après les événements précédents; « vécut encore » exprime naturellement cette continuité en français.
- source_word: אַחֲרֵי זֹאת
  choice: Après cela
  rationale: Cette expression situe la suite de la vie de Job après les événements qui viennent d’être racontés.
- source_word: מֵאָה וְאַרְבָּעִים שָׁנָה
  choice: cent quarante ans
  rationale: Rendu direct et idiomatique de la durée indiquée.
- source_word: וַיַּרְא
  choice: Il vit
  rationale: Le verbe ראה signifie littéralement « voir »; le texte principal conserve cette formulation sans expliciter « vécut assez longtemps pour voir ».
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le nom hébreu est ici un pluriel masculin et désigne explicitement les fils de Job.
- source_word: בְּנֵי בָנָיו
  choice: les fils de ses fils
  rationale: Cette formulation conserve la structure et la référence masculine explicite de l’hébreu; « ses petits-fils » serait plus idiomatique, mais légèrement moins précis.
- source_word: אַרְבָּעָה דֹּרוֹת
  choice: sur quatre générations
  rationale: Cette expression française indique naturellement l’étendue générationnelle de la descendance que Job vit.
