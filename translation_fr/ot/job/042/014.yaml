  text: וַ/יִּקְרָ֤א שֵׁם הָֽ/אַחַת֙ יְמִימָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית קְצִיעָ֑ה וְ/שֵׁ֥ם הַ/שְּׁלִישִׁ֖ית קֶ֥רֶן הַפּֽוּךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/014.yaml
  text: He named the first Jemimah[a], the second Keziah, and the third Keren-happuch.
translation:
  language: fr
  text: Il donna à la première le nom de Yemima, à la deuxième celui de Qetsia, et à la troisième celui de Qéren-Happouk[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qéren-Happouk signifie probablement «corne d’antimoine» ou «corne de fard pour les yeux»; il pourrait s’agir d’un récipient à cosmétique ou du pigment lui-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם
  choice: Il donna… le nom de
  rationale: La construction hébraïque signifie attribuer un nom. Cette formulation française est naturelle, explicite et conserve l’action de nommer.
- source_word: הָאַחַת / הַשֵּׁנִית / הַשְּׁלִישִׁית
  choice: à la première / à la deuxième / à la troisième
  rationale: Dans cette énumération des filles, les ordinaux rendent clairement et naturellement l’ordre exprimé par l’hébreu.
- source_word: יְמִימָה
  choice: Yemima
  rationale: Nom propre translittéré selon une forme lisible en français moderne, avec yod initial rendu par Y.
- source_word: קְצִיעָה
  choice: Qetsia
  rationale: Nom propre translittéré; Q rend le qof et «ts» représente l’affriquée suggérée par le tsadé, dans une forme accessible au lectorat francophone.
- source_word: קֶרֶן הַפּוּךְ
  choice: Qéren-Happouk
  rationale: Le nom propre composé est translittéré plutôt que traduit; le trait d’union en conserve la structure, tandis qu’une note en indique le sens probable.
