  text: וַ/יָּ֣מָת אִיּ֔וֹב זָקֵ֖ן וּ/שְׂבַ֥ע יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/017.yaml
  text: And Job died[a], old and full of days.
translation:
  language: fr
  text: Puis Job mourut, âgé et rassasié de jours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ayant eu son plein de jours » ; expression hébraïque désignant une vie arrivée à sa pleine mesure.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Puis … mourut
  rationale: Le wayyiqtol de מוּת fait avancer le récit jusqu’à son dernier événement. « Puis » rend naturellement cette succession en français sans ajouter de lien causal.
- source_word: אִיּוֹב
  choice: Job
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: זָקֵן
  choice: âgé
  rationale: L’adjectif signifie « vieux, âgé ». Dans cet avis de décès, « âgé » est naturel et digne en français moderne.
- source_word: וּשְׂבַע יָמִים
  choice: et rassasié de jours
  rationale: Cette expression hébraïque décrit quelqu’un qui a atteint le terme d’une longue vie. La traduction conserve l’image concrète et la tension poétique de l’hébreu plutôt que de la réduire à une simple paraphrase.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. « Rassasié de jours » est volontairement imagé et légèrement soutenu, conformément à l’expression hébraïque traditionnelle des récits de décès.
