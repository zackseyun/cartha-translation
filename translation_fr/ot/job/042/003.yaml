source:
  edition: WLC
  text: מִ֤י זֶ֨ה מַעְלִ֥ים עֵצָ֗ה בְּֽלִ֫י דָ֥עַת לָ/כֵ֣ן הִ֭גַּדְתִּי וְ/לֹ֣א אָבִ֑ין נִפְלָא֥וֹת מִ֝מֶּ֗/נִּי וְ/לֹ֣א אֵדָֽע׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/003.yaml
  text: ‘Who is this who hides counsel without knowledge?’ Therefore I have spoken, but I did not understand—things too wonderful for me[b][a], which I did not know.
translation:
  language: fr
  text: « Qui est celui qui cache[a] le dessein sans connaissance ? » C’est pourquoi j’ai parlé de ce que je ne comprenais pas, de merveilles qui me dépassent[b] et que je ne connaissais pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation française traditionnelle : « obscurcit le dessein ». En hébreu, le verbe employé ici n’est toutefois pas le même qu’en Job 38.2.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de choses trop merveilleuses pour moi »; autre possibilité : « de merveilles hors de ma portée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Qui est celui
  rationale: Conserve la force interrogative directe de la question citée, dans une formulation française naturelle et digne.
- source_word: מַעְלִים
  choice: cache
  rationale: Le hifil de עלם exprime ici l’action de cacher ou de dissimuler. « Cache » suit le verbe réellement employé en Job 42.3, sans l’harmoniser avec Job 38.2.
- source_word: עֵצָה
  choice: le dessein
  rationale: Dans ce contexte, « dessein » rend l’idée de projet ou de propos relevant de la sagesse divine, tout en évitant le sens courant de « conseil » comme recommandation.
- source_word: בְּלִי דָעַת
  choice: sans connaissance
  rationale: Traduction formellement proche qui maintient le thème de l’ignorance de Job.
- source_word: לָכֵן
  choice: donc
  rationale: Marque naturellement en français le lien logique entre la question citée et l’aveu de Job.
- source_word: הִגַּדְתִּי
  choice: j’ai parlé
  rationale: Dans ce contexte, Job reconnaît ses paroles antérieures. « J’ai parlé » est sobre et naturel, sans donner au verbe une force déclarative excessive.
- source_word: וְלֹא אָבִין
  choice: sans comprendre
  rationale: Exprime clairement que Job a parlé alors qu’il ne comprenait pas. Cette intégration syntaxique est idiomatique en français et ne supprime pas le contraste du texte.
- source_word: נִפְלָאוֹת
  choice: merveilles
  rationale: Le substantif pluriel désigne des réalités extraordinaires qui excèdent la compréhension humaine; « merveilles » conserve cette dimension sans les réduire à de simples « choses ».
- source_word: מִמֶּנִּי
  choice: qui me dépassent
  rationale: Rend l’idiome selon lequel ces merveilles sont hors de la portée intellectuelle de Job.
- source_word: וְלֹא אֵדָע
  choice: et que je ne connaissais pas
  rationale: Le relatif explicite en français le lien avec « merveilles », tandis que « et » conserve la coordination hébraïque.
theological_decisions:
- issue: Rapport entre Job 42.3 et la parole divine de Job 38.2
  choice: Traduire le verbe propre à Job 42.3 par « cache »
  alternative: « obscurcit le dessein sans connaissance »
  rationale: Job reprend ou adapte la réprimande divine, mais le texte hébreu de 42.3 emploie עלם et non חשך. La traduction respecte donc la différence lexicale sans harmonisation, tout en signalant la formulation traditionnelle en note.
- issue: Nature des réalités évoquées par נִפְלָאוֹת מִמֶּנִּי
  choice: « merveilles qui me dépassent »
  alternative: « choses trop merveilleuses pour moi »
  rationale: La formulation retenue maintient à la fois le caractère merveilleux de ces réalités et leur dépassement de la capacité de Job, sans préciser davantage leur nature.
translation_notes:
  register: Français international moderne, clair et digne. La citation garde une tournure solennelle, tandis que l’aveu de Job est formulé simplement. Aucun possessif absent de l’hébreu n’a été ajouté devant « dessein ».
