  text: וַ/יַּ֖עַן אִיּ֥וֹב אֶת יְהוָ֗ה וַ/יֹּאמַֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/001.yaml
  text: Then Job answered Yahweh and said:[a]
translation:
  language: fr
  text: 'Alors Job répondit à Yahweh[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; traditionnellement rendu « le SEIGNEUR ». On trouve aussi les formes « Yahweh » et « Jéhovah ».'
    reason: Signaler les principales manières de rendre le tétragramme hébreu.
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Le verbe ענה, dans cette formule narrative de dialogue, signifie « répondre ». Ce choix conserve la structure de l’échange, même si aucune question directe ne précède immédiatement.
- source_word: אִיּוֹב
  choice: Job
  rationale: Forme française traditionnelle et usuelle du nom propre hébreu אִיּוֹב.
- source_word: אֶת
  choice: '[marque de l’objet direct, non traduite]'
  rationale: Cette particule signale en hébreu un complément d’objet direct défini et n’appelle aucun équivalent autonome en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin rend explicitement le tétragramme du texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיֹּאמַר
  choice: ':'
  rationale: Après « répondit », le français naturel introduit les paroles qui suivent par deux-points. Cela exprime la fonction de la formule hébraïque « et dit » sans la redondance peu idiomatique « répondit… et dit ».
- source_word: וַ
  choice: Alors
  rationale: Le waw narratif fait progresser le récit. « Alors » marque naturellement en français la succession et la réaction de Job aux paroles précédentes.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom divin YHWH. « Yahweh » en conserve le caractère de nom propre; une note signale le rendu traditionnel et une autre forme connue sans imposer une interprétation confessionnelle.
translation_notes:
  register: 'Français moderne, sobre et digne. La formule hébraïque littérale « répondit à Yahweh et dit » est rendue idiomatiquement par « répondit à Yahweh : », les deux-points introduisant la déclaration du verset suivant.'
