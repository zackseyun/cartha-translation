  text: וַ/יֵּלְכוּ֩ אֱלִיפַ֨ז הַ/תֵּֽימָנִ֜י וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֗י צֹפַר֙ הַ/נַּ֣עֲמָתִ֔י וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ם יְהוָ֑ה וַ/יִּשָּׂ֥א יְהוָ֖ה אֶת פְּנֵ֥י אִיּֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/009.yaml
  text: So Eliphaz the Temanite[a], Bildad the Shuhite, and Zophar the Naamathite went and did as Yahweh had spoken to them, and Yahweh accepted Job.
translation:
  language: fr
  text: Éliphaz de Témân, Bildad de Shouah et Tsophar de Naama allèrent et firent comme Yahvé leur avait dit. Et Yahvé accorda sa faveur à Job[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Yahvé releva le visage de Job », expression hébraïque signifiant qu’il lui accorda sa faveur ou l’accepta.'
    reason: La note conserve l’image concrète de l’expression hébraïque et en explicite le sens idiomatique.
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: allèrent
  rationale: Le verbe הלך fait simplement progresser le récit. « Allèrent » conserve cette action sans ajouter l’idée d’un départ définitif.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: de Témân / de Shouah / de Naama
  rationale: Ces gentilés identifient les hommes par leur lieu ou leur clan. En français courant, les tournures avec « de » sont plus naturelles et dignes que des adjectifs translittérés peu familiers.
- source_word: וַיַּעֲשׂוּ
  choice: firent
  rationale: Le sens large de עשה convient à la construction « firent ce que », qui reste proche de l’hébreu sans préciser indûment les actes accomplis.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם
  choice: ce que Yahvé leur avait dit
  rationale: Le plus-que-parfait marque naturellement en français que la parole divine précède leur exécution, tandis que « ce que » exprime clairement la conformité à cette parole.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française établie « Yahvé » rend le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: וַיִּשָּׂא ... אֶת־פְּנֵי אִיּוֹב
  choice: accueillit favorablement Job
  rationale: L’expression idiomatique נשׂא פנים indique ici une réception favorable. Cette formulation française exprime le sens dans le contexte de l’intercession de Job sans supprimer l’image hébraïque, signalée en note.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La traduction retient le nom personnel sous sa forme française usuelle, sans lui substituer un titre.
- issue: Portée de l’accueil favorable accordé à Job
  choice: Yahvé accueillit favorablement Job
  alternative: Yahvé releva le visage de Job
  rationale: L’expression signifie que Dieu reçoit Job avec faveur, particulièrement dans son rôle d’intercesseur. La traduction n’ajoute pas que Job serait accepté sur un fondement doctrinal particulier et conserve le sens idiomatique général.
translation_notes:
  register: Français moderne, international et digne. Les noms propres suivent des formes françaises lisibles. La coordination « allèrent donc et firent » garde la succession narrative de l’hébreu, et la note rend visible son idiome final sans alourdir le verset.
