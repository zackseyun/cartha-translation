revisions:
- from: Éliphaz de Témân, Bildad de Shouah et Tsophar de Naama allèrent donc et firent ce que Yahvé leur avait dit. Et Yahvé accueillit favorablement Job[a].
  to: Éliphaz de Témân, Bildad de Shouah et Tsophar de Naama allèrent et firent comme Yahvé leur avait dit. Et Yahvé accorda sa faveur à Job[a].
  rationale: La révision supprime l’inférence non exprimée par « donc », restitue explicitement la conformité exprimée par כַּאֲשֶׁר au moyen de « comme », et emploie une formulation française plus naturelle pour l’idiome « relever le visage ». Les noms et la forme « Yahvé » sont conservés.
