revisions:
- from: Maintenant, prenez pour vous sept taureaux et sept béliers, allez auprès de mon serviteur Job et offrez un holocauste pour vous-mêmes. Mon serviteur Job priera pour vous, car lui, je l’accueillerai favorablement[a], afin de ne pas vous traiter selon votre folie[b]. En effet, vous n’avez pas parlé correctement à mon sujet[c], comme l’a fait mon serviteur Job.
  to: Maintenant, prenez pour vous sept taureaux et sept béliers, allez auprès de mon serviteur Job et offrez un holocauste pour vous-mêmes. Mon serviteur Job priera pour vous, car lui, je l’accueillerai favorablement[a], afin que je ne vous traite pas avec outrage[b]. En effet, vous n’avez pas parlé correctement à mon sujet[c], comme l’a fait mon serviteur Job.
  rationale: La révision se limite à la clause contenant נְבָלָה. Elle retire l’explicitation « selon votre folie », qui dépasse les termes du texte source et résout une ambiguïté lexicale et syntaxique discutée. « Vous traiter avec outrage » reste lisible en français moderne et laisse ouverte la portée précise de l’expression; la note expose l’alternative plus littérale. La note c est aussi légèrement corrigée pour donner une formulation française exacte de la lecture littérale de אֵלַי.
