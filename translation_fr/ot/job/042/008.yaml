source:
  edition: WLC
  text: וְ/עַתָּ֡ה קְחֽוּ לָ/כֶ֣ם שִׁבְעָֽה פָרִים֩ וְ/שִׁבְעָ֨ה אֵילִ֜ים וּ/לְכ֣וּ אֶל עַבְדִּ֣/י אִיּ֗וֹב וְ/הַעֲלִיתֶ֤ם עוֹלָה֙ בַּֽעַדְ/כֶ֔ם וְ/אִיּ֣וֹב עַבְדִּ֔/י יִתְפַּלֵּ֖ל עֲלֵי/כֶ֑ם כִּ֧י אִם פָּנָ֣י/ו אֶשָּׂ֗א לְ/בִלְתִּ֞י עֲשׂ֤וֹת עִמָּ/כֶם֙ נְבָלָ֔ה כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/008.yaml
  text: Take for yourselves seven bulls and seven rams[a], and go to my servant Job, and offer up a burnt offering for yourselves. And my servant Job will pray for you, for I will accept him, so that I may not deal with you disgracefully. For you have not spoken rightly about me[c][b], as my servant Job has.
translation:
  language: fr
  text: Maintenant, prenez pour vous sept taureaux et sept béliers, allez auprès de mon serviteur Job et offrez un holocauste pour vous-mêmes. Mon serviteur Job priera pour vous, car lui, je l’accueillerai favorablement[a], afin que je ne vous traite pas avec outrage[b]. En effet, vous n’avez pas parlé correctement à mon sujet[c], comme l’a fait mon serviteur Job.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car je relèverai son visage », expression hébraïque qui signifie accueillir quelqu’un avec faveur ou l’agréer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « afin que je ne fasse envers vous une chose infâme ». Le nom hébreu peut désigner une folie coupable, une infamie ou un acte outrageant; la construction est difficile.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou, plus littéralement : « vous ne m’avez pas parlé correctement ». Dans le contexte, ces paroles peuvent être comprises comme ayant été dites au sujet de Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Le texte hébreu comporte explicitement עַתָּה (« maintenant »), précédé de la conjonction וְ. « Maintenant » marque naturellement la transition vers l’ordre divin.
- source_word: קְחוּ לָכֶם
  choice: prenez pour vous
  rationale: L’impératif accompagné du datif לָכֶם exprime l’acquisition des animaux en vue du rite prescrit et conserve la nuance bénéficiaire.
- source_word: שִׁבְעָה פָרִים וְשִׁבְעָה אֵילִים
  choice: sept taureaux et sept béliers
  rationale: פָרִים désigne ici des bovins mâles et אֵילִים des béliers. Rien n’impose d’ajouter « jeunes ».
- source_word: עַבְדִּי אִיּוֹב
  choice: mon serviteur Job
  rationale: Dans ce contexte, עֶבֶד est un titre honorable soulignant le service fidèle envers Dieu, plutôt qu’une insistance sur la condition d’esclave.
- source_word: וְהַעֲלִיתֶם עוֹלָה
  choice: offrez un holocauste
  rationale: La construction formée avec le hifil de עלה et עוֹלָה est l’expression cultuelle habituelle pour l’offrande entièrement consumée.
- source_word: בַּעַדְכֶם
  choice: pour vous-mêmes
  rationale: La préposition exprime ici que le sacrifice est offert en leur faveur; le pronom renforcé rend clairement cette valeur en français.
- source_word: יִתְפַּלֵּל עֲלֵיכֶם
  choice: priera pour vous
  rationale: Le verbe désigne la prière, avec une fonction d’intercession rendue manifeste par le contexte.
- source_word: כִּי אִם פָּנָיו אֶשָּׂא
  choice: car lui, je l’accueillerai favorablement
  rationale: L’expression idiomatique « relever/porter le visage de quelqu’un » signifie l’accueillir avec faveur ou l’agréer. La dislocation « lui, je… » conserve l’accent porté sur Job.
- source_word: לְבִלְתִּי עֲשׂוֹת עִמָּכֶם נְבָלָה
  choice: afin de ne pas vous traiter selon votre folie
  rationale: נְבָלָה peut évoquer la folie coupable, l’infamie ou un acte outrageant. Cette formulation exprime ici la logique judiciaire sans donner à entendre que Dieu agirait lui-même d’une manière moralement infâme; une note conserve l’autre possibilité lexicale.
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: vous n’avez pas parlé correctement à mon sujet
  rationale: אֵלַי signifie formellement « à moi », mais, dans le contexte où Dieu évalue ce que les amis ont affirmé à son propos, le français idiomatique appelle « à mon sujet ». La lecture plus littérale est signalée en note.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: comme l’a fait mon serviteur Job
  rationale: Le français explicite le verbe sous-entendu dans la comparaison hébraïque sans modifier le contraste entre Job et ses amis.
theological_decisions:
- issue: La faveur accordée à Job et son rôle d’intercesseur
  choice: Dieu accueille favorablement Job, dont la prière permet que le jugement ne frappe pas ses amis.
  alternative: Dieu manifeste seulement une faveur personnelle envers Job, sans que la formule souligne son rôle de médiateur.
  rationale: L’enchaînement entre le sacrifice, la prière de Job et l’expression « je relèverai son visage » établit son rôle d’intercesseur, sans qu’il soit nécessaire d’importer des catégories sacerdotales ou doctrinales extérieures au passage.
- issue: Le sens de נְבָלָה appliqué à l’action envisagée par Dieu
  choice: Dieu s’abstient de traiter les amis selon leur folie coupable.
  alternative: Dieu s’abstient de leur faire une chose infâme ou outrageante.
  rationale: Le substantif peut qualifier la folie moralement répréhensible ou un acte honteux. Le rendu principal fait ressortir la justice du traitement envisagé, tandis que la note maintient l’ambiguïté lexicale.
- issue: Le complément de l’acte de parler dans אֵלַי
  choice: Les amis n’ont pas parlé correctement au sujet de Dieu.
  alternative: Les amis n’ont pas parlé correctement à Dieu.
  rationale: La préposition pointe littéralement vers Dieu, mais le contexte porte sur la teneur de leurs discours concernant Dieu. La traduction courante privilégie ce sens contextuel tout en conservant la construction littérale en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en maintenant les répétitions structurantes (« mon serviteur Job », « pour vous »). « Holocauste » est conservé comme terme biblique usuel pour l’offrande entièrement consumée. Les notes préservent les ambiguïtés de l’idiome de la faveur, de נְבָלָה et de la préposition אֵלַי.
