  yaml_path: translation/ot/job/028/003.yaml
  text: He sets an end to darkness[a], and he searches out every limit, the stones of gloom and deep darkness.
translation:
  language: fr
  text: Il met fin aux ténèbres, et il scrute jusqu’aux confins la pierre de l’obscurité et des ténèbres profondes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la traduction traditionnelle : « la pierre de l’obscurité et de l’ombre de la mort ». Le singulier hébreu pour « pierre » peut aussi avoir un sens collectif : « les pierres ».'
    reason: Préserver l’alternative traditionnelle pour צַלְמָוֶת et la possible valeur collective de אֶבֶן.
lexical_decisions:
- source_word: קֵץ שָׂם לַחֹשֶׁךְ
  choice: Il met fin aux ténèbres
  rationale: La tournure française naturelle « mettre fin à » rend directement l’idée de fixer un terme ou une limite à l’obscurité.
- source_word: וּלְכָל תַּכְלִית הוּא חוֹקֵר
  choice: et explore jusqu’aux limites extrêmes
  rationale: חקר exprime une recherche approfondie, tandis que תכלית désigne ici l’extrémité ou la limite ultime. La formulation évoque l’exploration exhaustive du mineur sans introduire l’idée morale de perfection.
- source_word: אֶבֶן
  choice: la pierre
  rationale: Le singulier hébreu est conservé afin de préserver la construction compacte et quelque peu énigmatique du texte, tout en restant intelligible dans le contexte minier.
- source_word: אֹפֶל
  choice: l’obscurité
  rationale: Ce terme désigne une obscurité épaisse. « Obscurité » le distingue de חֹשֶׁךְ, rendu plus tôt par « ténèbres ».
- source_word: וְצַלְמָוֶת
  choice: des profondes ténèbres
  rationale: Dans ce contexte d’exploration souterraine, le mot évoque avant tout une obscurité très profonde; son interprétation traditionnelle liée à la mort est préservée en note.
theological_decisions:
- issue: Sens de צַלְמָוֶת
  choice: profondes ténèbres
  alternative: ombre de la mort
  rationale: Le contexte minier favorise l’idée d’une obscurité souterraine intense, mais la traduction traditionnelle « ombre de la mort » reste lexicalement possible et est donc signalée sans trancher silencieusement.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve la densité poétique et l’ambiguïté de la dernière proposition hébraïque, sans expliciter davantage que le texte source le contexte minier.
