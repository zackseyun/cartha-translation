  text: וְֽ֭/הַ/חָכְמָה מֵ/אַ֣יִן תָּב֑וֹא וְ/אֵ֥י זֶ֝֗ה מְק֣וֹם בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/020.yaml
  text: But wisdom—from where does it come? And where is the place of understanding?[a]
translation:
  language: fr
  text: Mais la sagesse, d’où vient-elle ? Et où se trouve le lieu de l’intelligence ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: Mais la sagesse
  rationale: חָכְמָה signifie « sagesse ». Dans le contexte, la conjonction וְ marque une reprise contrastive de la question centrale ; « Mais » rend naturellement cette nuance en français.
- source_word: מֵאַיִן
  choice: d’où
  rationale: 'L’interrogatif אַיִן précédé de מ־ demande la provenance : « d’où ». Cette formulation française conserve l’accent mis sur l’origine.'
- source_word: תָּבוֹא
  choice: vient-elle
  rationale: L’imparfait qal féminin singulier de בוא, dont « la sagesse » est le sujet, exprime ici une question générale. Le présent français convient mieux qu’un futur.
- source_word: וְאֵי זֶה
  choice: Et où se trouve
  rationale: אֵי זֶה est ici une interrogation locative. Avec מְקוֹם, « où se trouve » donne une tournure française naturelle tout en préservant l’image spatiale.
- source_word: מְקוֹם
  choice: le lieu
  rationale: מְקוֹם signifie « lieu » ou « endroit ». « Le lieu » maintient le registre poétique et la formulation concrète de l’hébreu.
- source_word: בִּינָה
  choice: l’intelligence
  rationale: בִּינָה désigne la faculté de comprendre, le discernement ou l’intelligence. « Intelligence » forme ici un couple naturel avec « sagesse » et conserve le sens abstrait sans le réduire à une application particulière.
theological_decisions: []
translation_notes:
  register: Français moderne, international et dignifié. La construction disloquée « la sagesse, d’où vient-elle ? » restitue l’insistance poétique de l’hébreu sans archaïsme. Le parallélisme entre la provenance de la sagesse et le lieu de l’intelligence est conservé.
