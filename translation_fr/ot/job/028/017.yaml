source:
  edition: WLC
  text: לֹא יַעַרְכֶ֣/נָּה זָ֭הָב וּ/זְכוֹכִ֑ית וּ/תְמ֖וּרָתָ֣/הּ כְּלִי פָֽז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/017.yaml
  text: Gold and glass cannot equal it[b][a], nor can its exchange be an article of fine gold.
translation:
  language: fr
  text: L’or et le verre[a] ne peuvent l’égaler, et on ne peut l’échanger contre un objet en or fin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cristal ». Le terme hébreu זְכוֹכִית peut désigner un matériau transparent de prix ; « verre » est ici retenu comme le sens le plus probable.
    reason: lexical_alternative
  - marker: b
    text: Ou « et aucun récipient en or fin ne peut être donné en échange d’elle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: ne peuvent l’égaler
  rationale: Le verbe ערך évoque ici l’évaluation ou la comparaison. La formulation exprime que l’or et le verre ne sont pas à la hauteur de la sagesse; le suffixe féminin renvoie à celle-ci.
- source_word: זָהָב
  choice: l’or
  rationale: Équivalent français courant et précis du métal précieux.
- source_word: זְכוֹכִית
  choice: le verre
  rationale: Le terme désigne vraisemblablement le verre, matériau transparent et précieux dans l’Antiquité; « cristal » demeure une possibilité.
- source_word: תְמוּרָתָהּ
  choice: on ne peut l’échanger contre
  rationale: תְּמוּרָה exprime l’échange ou la substitution. Cette tournure française naturelle conserve l’image commerciale sans réduire le terme à un simple prix.
- source_word: כְּלִי פָז
  choice: un objet en or fin
  rationale: כְּלִי peut désigner largement un objet, un récipient ou un ustensile; « objet » évite une précision injustifiée. פָּז désigne de l’or fin ou raffiné.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le féminin des pronoms renvoie à la sagesse dans le contexte. La coordination du singulier hébreu est rendue idiomatiquement au pluriel en français.
