  text: מְקוֹם סַפִּ֥יר אֲבָנֶ֑י/הָ וְ/עַפְרֹ֖ת זָהָ֣ב לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/006.yaml
  text: Its stones are the place of sapphire[a], and it has dust of gold.
translation:
  language: fr
  text: Ses pierres recèlent du saphir[a], et elle contient de la poussière d’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « lapis-lazuli » ; l’identification exacte de la pierre désignée par le terme hébreu ancien est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם
  choice: recèlent
  rationale: Le nom signifie littéralement « lieu ». Dans ce contexte minier, la tournure française « ses pierres recèlent » exprime naturellement que les pierres constituent le lieu où se trouve la gemme, sans remplacer l’image par l’idée plus abstraite de « source ».
- source_word: סַפִּיר
  choice: saphir
  rationale: « Saphir » est l’équivalent traditionnel et immédiatement compréhensible, bien que l’identification exacte de la pierre antique reste incertaine; « lapis-lazuli » est donc signalé en note.
- source_word: אֲבָנֶיהָ
  choice: ses pierres
  rationale: Le pluriel avec suffixe féminin singulier renvoie au domaine terrestre évoqué dans le contexte. « Ses pierres » conserve le lien possessif et convient au français poétique.
- source_word: וְעַפְרֹת
  choice: et sa poussière
  rationale: Le terme désigne de la poussière ou de la terre meuble. Le collectif singulier « poussière » est plus naturel en français et préserve l’image concrète sans introduire l’interprétation « minerai ».
- source_word: זָהָב
  choice: or
  rationale: Équivalent français standard du nom du métal précieux.
- source_word: לוֹ
  choice: contient
  rationale: La construction signifie littéralement « à elle/à lui ». Dans cette proposition sans verbe, « contient » rend idiomatiquement l’idée de possession ou de présence, avec pour sujet naturel « sa poussière ».
