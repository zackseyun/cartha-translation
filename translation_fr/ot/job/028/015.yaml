id: JOB.28.15
reference: Job 28:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹא יֻתַּ֣ן סְג֣וֹר תַּחְתֶּ֑י/הָ וְ/לֹ֥א יִ֝שָּׁקֵ֗ל כֶּ֣סֶף מְחִירָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/015.yaml
  text: Fine gold cannot be given in exchange for it[c][b][a], nor can silver be weighed as its price.
translation:
  language: fr
  text: On ne peut donner de l’or fin en échange d’elle[a], ni peser de l’argent pour en payer le prix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « On ne peut offrir de l’or pur en échange d’elle. »'
    reason: lexical_alternative
  - marker: b
    text: L’argent servait de moyen de paiement et était pesé plutôt que compté.
    reason: cultural_note
lexical_decisions:
- source_word: יֻתַּן
  choice: on ne peut donner
  rationale: Le passif, nié par לֹא, exprime ici l’impossibilité de fournir quelque chose comme contrepartie; cette tournure française est naturelle et garde l’or comme objet offert.
- source_word: סְגוֹר
  choice: or fin
  rationale: Dans ce contexte poétique d’évaluation, le terme désigne un or affiné ou de grande qualité, et non simplement l’or en général.
- source_word: תַּחְתֶּיהָ
  choice: en échange d’elle
  rationale: La préposition exprime ici la substitution ou la contrepartie. Le pronom féminin renvoie à la sagesse dans le contexte précédent.
- source_word: יִשָּׁקֵל
  choice: peser
  rationale: Le verbe évoque l’argent pesé pour effectuer un paiement dans le monde ancien.
- source_word: כֶּסֶף
  choice: argent
  rationale: Le mot désigne littéralement le métal argent, employé ici comme moyen de paiement; le français « argent » conserve utilement les deux sens.
- source_word: מְחִירָהּ
  choice: en payer le prix
  rationale: Cette formulation rend explicitement et naturellement l’idée d’argent pesé à titre de prix, sans perdre la métaphore commerciale.
theological_decisions:
- issue: Antécédent du pronom féminin dans תַּחְתֶּיהָ et מְחִירָהּ
  choice: la sagesse, rendue par « elle »
  alternative: répéter explicitement « la sagesse »
  rationale: Le référent est fourni par le contexte, mais le verset hébreu emploie seulement des suffixes pronominaux; conserver « elle » respecte cette cohésion sans ajouter le nom.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme des deux propositions est préservé, ainsi que l’image économique concrète de l’or offert et de l’argent pesé.
