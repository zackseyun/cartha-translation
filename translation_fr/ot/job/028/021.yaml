  text: וְֽ֭/נֶעֶלְמָה מֵ/עֵינֵ֣י כָל חָ֑י וּ/מֵ/ע֖וֹף הַ/שָּׁמַ֣יִם נִסְתָּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/021.yaml
  text: It is hidden from the eyes of every living thing[a], and concealed from the birds of the heavens.
translation:
  language: fr
  text: Elle est dérobée aux yeux de tout être vivant et cachée aux oiseaux du ciel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des cieux ».'
    reason: Le mot hébreu שָׁמַיִם est morphologiquement pluriel, tandis que « du ciel » est la formulation française naturelle dans cette expression.
lexical_decisions:
- source_word: וְנֶעֶלְמָה
  choice: Elle est dérobée
  rationale: 'Le niphal de עלם exprime ici un état résultant : la sagesse, sujet féminin repris du contexte, reste hors d’atteinte. « Dérobée » rend cette idée tout en évitant de répéter « cachée » dans le parallélisme.'
- source_word: מֵעֵינֵי
  choice: aux yeux de
  rationale: Cette tournure conserve l’image concrète de l’hébreu מן + עיניים et demeure naturelle en français.
- source_word: כָל חָי
  choice: tout être vivant
  rationale: L’expression a une portée universelle et ne se limite pas aux humains. « Tout être vivant » est clair, inclusif et adapté au registre poétique.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: et aux oiseaux du ciel
  rationale: עוֹף désigne ici les êtres qui volent, rendus naturellement par « oiseaux ». Le singulier collectif français « du ciel » traduit idiomatiquement l’expression hébraïque au pluriel.
- source_word: נִסְתָּרָה
  choice: cachée
  rationale: Le niphal de סתר exprime que la sagesse est soustraite à leur perception. « Cachée » restitue simplement le sens passif et maintient le parallélisme.
theological_decisions: []
translation_notes:
  register: Français international actuel, poétique et digne. La structure parallèle du vers hébreu est conservée, avec une variation lexicale naturelle entre « dérobée » et « cachée ».
