  terminology: « Puits de mine » est une interprétation contextuellement solide de נחל, à maintenir avec la note d’alternative. « Humains » convient à אֱנוֹשׁ dans un français international moderne. Le marqueur de la note sur la suspension doit être attaché au verbe concerné, non à « humains ».
