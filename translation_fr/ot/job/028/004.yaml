  text: פָּ֤רַץ נַ֨חַל מֵֽ/עִם גָּ֗ר הַֽ/נִּשְׁכָּחִ֥ים מִנִּי רָ֑גֶל דַּ֖לּוּ מֵ/אֱנ֣וֹשׁ נָֽעוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/004.yaml
  text: He breaks open a shaft away from where people dwell[a]; forgotten by the foot, they hang far from men[c][b], they sway.
translation:
  language: fr
  text: Il ouvre un puits de mine loin des lieux habités[a] ; oubliés des passants[b], ils pendent[c] loin des humains et se balancent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il ouvre une brèche dans un ravin, loin de celui qui y séjourne ». L’hébreu est difficile, notamment les mots rendus par « puits de mine » et « lieux habités » ; le contexte minier conduit souvent à comprendre ici une excavation.
    reason: alternative_reading
  - marker: b
    text: Littéralement « oubliés du pied ». Il peut s’agir d’un lieu ou de travailleurs hors de la vue et de la portée de ceux qui marchent à la surface.
    reason: lexical_alternative
  - marker: c
    text: Ou « ils sont abaissés » ou « ils sont suspendus ». Le verbe peut évoquer des travailleurs suspendus à des cordes ou descendus dans la mine.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַץ
  choice: creuse
  rationale: Le verbe exprime l’idée de faire une brèche ou de forcer une ouverture. Avec « un puits », « creuse » rend naturellement l’action d’ouvrir le sol dans ce contexte minier.
- source_word: נַחַל
  choice: puits
  rationale: Le nom désigne habituellement un torrent, un ravin ou son lit, mais l’imagerie minière de Job 28 favorise ici le sens contextuel d’une excavation, probablement un puits de mine. L’incertitude est signalée en note.
- source_word: מֵעִם גָּר
  choice: loin des lieux habités
  rationale: מֵעִם marque l’éloignement, tandis que גָּר peut désigner celui qui séjourne ou habite. Cette formulation française exprime le sens locatif probable sans rendre littéralement une tournure hébraïque difficile.
- source_word: הַנִּשְׁכָּחִים מִנִּי רָגֶל
  choice: oubliés des passants
  rationale: Le texte dit littéralement « oubliés du pied ». « Des passants » conserve l’idée de personnes hors de la vue et de la portée de ceux qui circulent à la surface, tandis que la note préserve l’image originale.
- source_word: דַּלּוּ
  choice: sont suspendus
  rationale: Dans cette scène minière, le verbe peut évoquer des personnes pendues ou descendues au moyen de cordes. « Sont suspendus » garde l’image sans décider s’ils descendent ou restent simplement pendus.
- source_word: מֵאֱנוֹשׁ
  choice: loin des autres humains
  rationale: אֱנוֹשׁ désigne l’être humain mortel. « Les autres humains » indique naturellement que les mineurs sont éloignés de la société humaine sans employer un masculin générique potentiellement ambigu en français actuel.
- source_word: נָעוּ
  choice: se balancent
  rationale: Le verbe décrit un mouvement instable ou de va-et-vient. Appliqué à des mineurs suspendus, « se balancent » est précis et évocateur.
