source:
  edition: WLC
  text: לֹא יָדַ֣ע אֱנ֣וֹשׁ עֶרְכָּ֑/הּ וְ/לֹ֥א תִ֝מָּצֵ֗א בְּ/אֶ֣רֶץ הַֽ/חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/013.yaml
  text: Man does not know its worth[b][a], and it is not found in the land of the living.
translation:
  language: fr
  text: Le mortel ne connaît pas sa valeur[a], et elle ne se trouve pas dans le pays des vivants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son prix » ou « ce qu’elle vaut ». Le terme hébreu évoque l’évaluation ou la valeur.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: le mortel
  rationale: Le nom singulier désigne l’être humain en soulignant sa fragilité ou sa mortalité. « Le mortel » conserve ici la valeur représentative du singulier et le contraste implicite avec la sagesse.
- source_word: יָדַע
  choice: ne connaît pas
  rationale: L’accompli exprime ici une vérité générale; le présent français est donc naturel. Une traduction par « ne peut connaître » ajouterait une idée d’impossibilité qui n’est pas explicitement exprimée.
- source_word: עֶרְכָּהּ
  choice: sa valeur
  rationale: Le terme issu de ערך désigne l’évaluation, la valeur ou le prix. « Valeur » convient au contexte de la sagesse, tout en évitant une nuance exclusivement commerciale.
- source_word: תִּמָּצֵא
  choice: elle ne se trouve pas
  rationale: Le nifal imparfait se rend naturellement par une tournure pronominale passive. « Ne peut être trouvée » introduirait une modalité absente de l’hébreu.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: dans le pays des vivants
  rationale: Cette expression hébraïque traditionnelle désigne le domaine de la vie humaine terrestre. La traduction conserve son caractère imagé et poétique.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et poétique. « Le mortel » restitue la désignation représentative et la nuance de fragilité humaine; le pronom féminin « elle » renvoie à la sagesse dans le contexte.
