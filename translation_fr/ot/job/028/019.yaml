  text: לֹֽא יַ֭עַרְכֶ/נָּה פִּטְדַת כּ֑וּשׁ בְּ/כֶ֥תֶם טָ֝ה֗וֹר לֹ֣א תְסֻלֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/028/019.yaml
  text: The topaz of Cush cannot equal it[a]; it cannot be valued in pure gold.
translation:
  language: fr
  text: La topaze de Koush ne peut l’égaler[a] ; elle ne peut être évaluée en or pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la chrysolite de Koush » ou « le péridot de Koush » ; l’identification exacte de פִּטְדָה est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: ne peut l’égaler
  rationale: Le verbe ערך exprime ici la comparaison en valeur ou en rang. Cette formulation concise conserve l’idée que la sagesse est incomparable ; le pronom féminin renvoie à la sagesse dans le contexte.
- source_word: פִּטְדַת כּוּשׁ
  choice: la topaze de Koush
  rationale: פִּטְדָה désigne une pierre précieuse dont l’identification exacte demeure incertaine. « Topaze » est le terme traditionnel le plus connu, tandis que l’incertitude est signalée en note. כּוּשׁ est translittéré « Koush » selon l’usage français.
- source_word: בְּכֶתֶם טָהוֹר
  choice: en or pur
  rationale: כֶּתֶם désigne de l’or fin ou raffiné, et טָהוֹר en souligne la pureté. La préposition ב s’intègre naturellement en français à l’expression d’une estimation faite en or.
- source_word: תְסֻלֶּה
  choice: on ne peut l’estimer
  rationale: Dans ce contexte de prix et de valeur, le verbe évoque l’évaluation plutôt que la pesée matérielle. La tournure impersonnelle est naturelle en français et maintient le parallèle avec le premier membre.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est préservé, ainsi que l’incertitude relative à l’identification de la pierre précieuse.
