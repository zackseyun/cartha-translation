  text: כִּי ה֭וּא לִ/קְצוֹת הָ/אָ֣רֶץ יַבִּ֑יט תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם יִרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/024.yaml
  text: For he looks to the ends of the earth[b][a]; he sees under all the heavens.
translation:
  language: fr
  text: Car il regarde jusqu’aux extrémités de la terre ; il voit sous tous les cieux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la raison de l’affirmation précédente concernant la connaissance de la sagesse par Dieu.
- source_word: הוּא
  choice: il
  rationale: Le pronom renvoie à Dieu dans le contexte immédiat, sans qu’il soit nécessaire d’expliciter de nouveau le nom.
- source_word: לִקְצוֹת הָאָרֶץ
  choice: jusqu’aux extrémités de la terre
  rationale: Cette formulation naturelle et digne exprime les limites les plus lointaines de la terre et rend la préposition לְ.
- source_word: יַבִּיט
  choice: regarde
  rationale: Le hifil de נבט exprime un regard dirigé ; « regarde » conserve simplement cette nuance.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: tout ce qui est sous les cieux
  rationale: Cette tournure française naturelle conserve l’image spatiale, la portée globale de כָּל et le pluriel hébreu « cieux ».
- source_word: יִרְאֶה
  choice: il voit
  rationale: Le sens courant de ראה est « voir » ; ce choix maintient le parallélisme avec « regarde ».
theological_decisions:
- issue: Référent du pronom הוּא
  choice: Le sujet est Dieu, qui poursuit ici la description de son regard embrassant toute la création.
  alternative: Laisser le référent entièrement indéterminé.
  rationale: Le contexte immédiat de Job 28 identifie clairement comme Dieu celui qui connaît le lieu de la sagesse et voit toute la création ; la traduction conserve néanmoins le simple pronom du texte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite un calque peu naturel de « sous tous les cieux » tout en préservant le pluriel hébreu et la portée universelle du verset.
