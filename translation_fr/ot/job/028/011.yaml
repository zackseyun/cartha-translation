  text: מִ֭/בְּכִי נְהָר֣וֹת חִבֵּ֑שׁ וְ֝/תַעֲלֻמָ֗הּ יֹ֣צִא אֽוֹר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/028/011.yaml
  text: He dams up the sources of the rivers[a], and brings what is hidden out to the light.
translation:
  language: fr
  text: Il arrête les suintements des cours d’eau[a] et met au jour ce qui est caché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il retient les “pleurs” des cours d’eau » ; le terme hébreu est rare et peut évoquer une eau qui pleure, ruisselle ou suinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּכִי
  choice: les suintements
  rationale: Ce terme rare et difficile est apparenté à l’idée de « pleurs ». Dans le contexte des travaux miniers et de la maîtrise des eaux, il désigne vraisemblablement l’eau qui suinte ou ruisselle. « Suintements » conserve cette image concrète sans imposer le sens plus précis de « sources ».
- source_word: נְהָרוֹת
  choice: des cours d’eau
  rationale: Le mot désigne normalement des fleuves, des rivières ou des cours d’eau. Ici, « cours d’eau » convient au contexte souterrain et reste suffisamment général.
- source_word: חִבֵּשׁ
  choice: Il endigue
  rationale: Le verbe signifie fondamentalement « lier », « contenir » ou « arrêter ». « Endiguer » exprime naturellement l’action de maîtriser l’écoulement de l’eau dans ce contexte.
- source_word: תַּעֲלֻמָהּ
  choice: ce qui était caché
  rationale: Le nom désigne une chose cachée ou dissimulée. Cette formulation préserve sa portée générale sans préciser qu’il s’agit nécessairement d’un minerai ou d’un trésor.
- source_word: יֹצִא אוֹר
  choice: met au jour
  rationale: La tournure signifie littéralement « fait sortir à la lumière ». L’expression française « mettre au jour » restitue avec naturel à la fois l’idée de découverte et le contraste avec ce qui était caché.
