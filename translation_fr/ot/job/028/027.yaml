  text: אָ֣ז רָ֭אָ/הּ וַֽ/יְסַפְּרָ֑/הּ הֱ֝כִינָ֗/הּ וְ/גַם חֲקָרָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/027.yaml
  text: Then he saw it and declared it; he established it[a], and also searched it out.
translation:
  language: fr
  text: Alors il la vit et la fit connaître[a] ; il l’établit et l’examina aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la compta », « la raconta » ou « l’énonça ». Le verbe hébreu peut évoquer l’action de compter aussi bien que celle de raconter ou d’exposer.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque la succession dans le développement poétique avec une formulation française naturelle.
- source_word: רָאָהּ
  choice: il la vit
  rationale: Conserve le verbe concret « voir » et le suffixe féminin renvoyant à la sagesse.
- source_word: וַיְסַפְּרָהּ
  choice: il la fit connaître
  rationale: ספר peut exprimer l’action de compter, de raconter ou d’énoncer. « Fit connaître » convient au contexte tout en laissant la polysémie être signalée en note.
- source_word: הֱכִינָהּ
  choice: il l’établit
  rationale: Le hiphil de כון désigne couramment l’action d’affermir, d’établir ou de mettre en place.
- source_word: וְגַם
  choice: et … aussi
  rationale: Rend la valeur cumulative de la locution dans un ordre idiomatique en français.
- source_word: חֲקָרָהּ
  choice: l’examina
  rationale: חקר évoque une investigation approfondie ; « examina » est naturel et conserve cette nuance.
theological_decisions:
- issue: Référent des suffixes féminins
  choice: Les pronoms féminins renvoient à « la sagesse » dans le contexte immédiat.
  alternative: Ils pourraient viser plus abstraitement la mesure ou l’ordonnancement de la sagesse.
  rationale: La sagesse est l’antécédent féminin immédiat et demeure l’objet des quatre verbes ; les pronoms français préservent ce lien sans développer davantage la personnification.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition des pronoms féminins maintient le lien explicite avec « la sagesse ».
