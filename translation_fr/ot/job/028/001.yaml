  text: כִּ֤י יֵ֣שׁ לַ/כֶּ֣סֶף מוֹצָ֑א וּ֝/מָק֗וֹם לַ/זָּהָ֥ב יָזֹֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/001.yaml
  text: Surely there is a mine for silver[b][a], and a place where they refine gold.
translation:
  language: fr
  text: Certes, il y a une mine d’argent[a], et un lieu où l’on affine l’or[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une source d’argent ». Le mot hébreu peut désigner une source ou un lieu d’origine ; « mine » convient ici au contexte de l’extraction des métaux.
    reason: lexical_alternative
  - marker: b
    text: Ou « un lieu où l’on fond l’or ». Le verbe hébreu peut désigner l’affinage ou la fonte d’un métal précieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Oui
  rationale: En ouverture de cette réflexion poétique, la particule a une valeur d’affirmation appuyée plutôt que strictement causale. « Oui » restitue cette force avec naturel en français.
- source_word: יֵשׁ
  choice: il y a
  rationale: Équivalent français courant de la particule existentielle.
- source_word: לַכֶּסֶף מוֹצָא
  choice: une mine pour l’argent
  rationale: מוֹצָא désigne littéralement un lieu de sortie, une origine ou une source. Dans le contexte d’extraction minière de Job 28, « mine » exprime clairement le référent concret, tandis que la note conserve le sens plus général du terme.
- source_word: וּמָקוֹם לַזָּהָב
  choice: et un lieu … l’or
  rationale: « Un lieu » rend simplement מָקוֹם; la tournure française avec « où » rattache naturellement l’or à l’action qui suit.
- source_word: יָזֹקּוּ
  choice: où l’on affine
  rationale: Le verbe זקק peut désigner l’affinage ou la fonte purificatrice d’un métal. Le pronom indéfini « on » rend naturellement le sujet pluriel non précisé de l’hébreu.
