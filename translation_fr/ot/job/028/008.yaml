translation_notes:
  register: Français moderne, poétique et accessible. Le singulier pronominal de l’hébreu est rendu d’abord par « l’ », renvoyant au chemin du contexte, puis idiomatiquement par « là ». Le point-virgule préserve le parallélisme des deux propositions.
