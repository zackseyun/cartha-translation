  yaml_path: translation/ot/job/028/008.yaml
  text: The proud beasts have not trodden it[a]; the lion has not passed over it.
translation:
  language: fr
  text: Les fiers animaux sauvages ne l’ont pas foulé[a] ; le lion ne l’a pas parcouru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de l’orgueil ». L’expression désigne probablement de fiers animaux sauvages, en particulier des prédateurs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדְרִיכֻהוּ
  choice: ne l’ont pas foulé
  rationale: Dans ce contexte de chemin caché, le hiphil de דרך exprime le fait d’emprunter ou de parcourir une voie. « Foulé » conserve l’image concrète du passage sans rendre artificiellement le sens causatif « guider ».
- source_word: בְנֵי שָׁחַץ
  choice: les bêtes orgueilleuses
  rationale: Littéralement « les fils de l’orgueil ». Le parallélisme avec שׁחל, « lion », désigne vraisemblablement de fiers animaux sauvages, notamment des prédateurs. La traduction explicite le référent probable tout en signalant le sens littéral en note.
- source_word: עָדָה עָלָיו
  choice: n’est pas passé par là
  rationale: Le verbe accompagné de על décrit un déplacement par-dessus ou à travers un lieu. En français, « passer par là » convient naturellement au chemin évoqué par le contexte et évite l’expression moins idiomatique « passer sur lui ».
- source_word: שָׁחַל
  choice: le lion
  rationale: Terme poétique désignant le lion, avec une possible nuance de force ou de férocité. « Le lion » est clair, digne et n’ajoute aucun qualificatif absent du texte.
