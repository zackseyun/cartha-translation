  text: Coral and crystal are not worth mentioning, and the price of wisdom is above pearls.
translation:
  language: fr
  text: Ni le corail ni le cristal ne méritent d’être mentionnés, et l’acquisition de la sagesse vaut plus que les perles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le prix de la sagesse dépasse celui des perles ». Les termes hébreux désignant plusieurs matières précieuses dans ce verset sont difficiles à identifier avec certitude.'
    reason: Signaler l’ambiguïté réelle de מֶשֶׁךְ et l’incertitude lexicale entourant les matières précieuses sans alourdir le texte principal.
lexical_decisions:
- source_word: רָאמוֹת
  choice: corail
  rationale: Le terme désigne probablement une matière précieuse, souvent comprise comme du corail; son identification exacte reste toutefois incertaine.
- source_word: גָבִישׁ
  choice: cristal
  rationale: « Cristal » est le sens traditionnel et convient au contexte de matières précieuses, bien que l’identification minéralogique précise soit incertaine.
- source_word: לֹא יִזָּכֵר
  choice: ne méritent d’être mentionnés
  rationale: Littéralement « ne sera pas mentionné »; dans cette comparaison de valeur, l’expression signifie que ces richesses ne comptent même pas face à la sagesse.
- source_word: מֶשֶׁךְ חָכְמָה
  choice: le prix de la sagesse
  rationale: מֶשֶׁךְ est rare et peut évoquer le prix, l’acquisition ou la possession. « Prix » restitue naturellement la comparaison économique du passage sans préciser indûment le mode d’acquisition.
- source_word: פְּנִינִים
  choice: perles
  rationale: Le mot désigne des objets précieux, traditionnellement rendus par « perles »; son référent exact est discuté et peut aussi être compris comme des coraux ou des pierres précieuses.
