  text: בַּ֭רְזֶל מֵ/עָפָ֣ר יֻקָּ֑ח וְ֝/אֶ֗בֶן יָצ֥וּק נְחוּשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/002.yaml
  text: Iron is taken from the dust[a], and copper is smelted from stone.
translation:
  language: fr
  text: Le fer est tiré de la poussière, et le cuivre est fondu à partir de la pierre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : du bronze. Le terme hébreu peut désigner le cuivre ou le bronze ; « cuivre » convient mieux ici, puisque le contexte est celui de l’extraction du métal à partir de la roche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: fer
  rationale: Sens courant du nom hébreu et équivalent français direct.
- source_word: מֵעָפָר
  choice: de la poussière
  rationale: עָפָר peut désigner la poussière, la terre meuble ou le sol. « Poussière » conserve l’image concrète et poétique de l’hébreu.
- source_word: יֻקָּח
  choice: est tiré
  rationale: Le passif de לקח signifie littéralement « est pris ». Dans ce contexte d’extraction minière, « est tiré » reste proche de l’hébreu tout en étant naturel en français.
- source_word: וְאֶבֶן
  choice: et la pierre
  rationale: אֶבֶן signifie « pierre »; ici, il s’agit de la roche contenant le minerai. Le terme concret de l’hébreu est conservé.
- source_word: יָצוּק
  choice: est fondue
  rationale: Dans ce contexte métallurgique, יצק évoque la fusion permettant d’obtenir le métal, plutôt que le simple fait de verser ou de couler une matière.
- source_word: נְחוּשָׁה
  choice: cuivre
  rationale: Le terme peut désigner le cuivre ou le bronze. Le cuivre convient mieux au contexte d’extraction d’un métal à partir de la roche, tandis que le bronze est un alliage fabriqué.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. La formulation « la pierre est fondue pour en tirer » explicite légèrement le rapport métallurgique tout en conservant l’image et la structure passive de l’hébreu.
