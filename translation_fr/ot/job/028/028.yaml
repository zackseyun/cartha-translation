  text: וַ/יֹּ֤אמֶר לָֽ/אָדָ֗ם הֵ֤ן יִרְאַ֣ת אֲ֭דֹנָ/י הִ֣יא חָכְמָ֑ה וְ/ס֖וּר מֵ/רָ֣ע בִּינָֽה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/028/028.yaml
  text: And he said to man[a], ‘Behold, the fear of the Lord—that is wisdom, and to turn away from evil is understanding.’
translation:
  language: fr
  text: 'Et il dit à l’être humain[a] : « Voici : la crainte du Seigneur, c’est la sagesse, et se détourner du mal, c’est l’intelligence. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’homme » ou « à l’humanité ». Le mot hébreu אָדָם est au singulier et représente ici l’ensemble des êtres humains.
    reason: alternative lexicale et clarification de la portée générique
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Et il dit
  rationale: Le wayyiqtol de אמר relie cette déclaration conclusive à ce qui précède. Le pronom « il » conserve la formulation hébraïque sans expliciter davantage son référent.
- source_word: לָאָדָם
  choice: à l’être humain
  rationale: אָדָם, singulier à valeur représentative, désigne ici l’humanité. « L’être humain » rend naturellement en français moderne à la fois le singulier grammatical et la portée universelle.
- source_word: הֵן
  choice: Voici
  rationale: La particule attire solennellement l’attention sur l’énoncé qui suit. « Voici » en conserve la force déictique dans un registre digne.
- source_word: יִרְאַת אֲדֹנָי
  choice: la crainte du Seigneur
  rationale: « Crainte » maintient toute la portée de יִרְאָה, sans la réduire à la seule révérence. אֲדֹנָי est ici le titre divin « Seigneur ».
- source_word: הִיא חָכְמָה
  choice: c’est la sagesse
  rationale: La tournure identificatrice avec le pronom indépendant הִיא est rendue explicitement par « c’est », qui marque l’équation en français naturel.
- source_word: וְסוּר מֵרָע
  choice: et se détourner du mal
  rationale: L’infinitif exprime une conduite délibérée d’éloignement moral. « Se détourner du mal » conserve cette valeur et le parallélisme avec le premier membre.
- source_word: בִּינָה
  choice: l’intelligence
  rationale: Dans la littérature sapientielle, בִּינָה désigne la faculté de comprendre et de discerner. « Intelligence » s’accorde ici naturellement avec « sagesse » tout en conservant la formulation nominale.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: l’être humain
  alternative: l’homme ; l’humanité
  rationale: Le mot hébreu est un singulier représentatif visant tous les humains. « L’être humain » préserve le singulier et évite que le français moderne ne fasse entendre une restriction au sexe masculin ; la note conserve les autres rendus possibles.
- issue: Sens de la crainte du Seigneur
  choice: la crainte du Seigneur
  alternative: le respect du Seigneur ; la révérence envers le Seigneur
  rationale: Le terme hébreu peut inclure respect, révérence et effroi sacré. Garder « crainte » préserve cette amplitude et la tension théologique du texte sans l’atténuer.
translation_notes:
  register: Français international moderne, solennel mais accessible. Les deux occurrences de « c’est » rendent le parallélisme identificatif de l’hébreu. Les deux-points après « Voici » permettent de conserver la particule d’attention sans produire une syntaxe française artificielle.
