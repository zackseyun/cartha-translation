  verdict: revise
  source_fidelity: Le texte identifie correctement Abaddon et la Mort comme locuteurs personnifiés et rend bien le présent poétique de אָמְרוּ. Toutefois, « n’en avons entendu que la rumeur » introduit explicitement la restriction « que », qui n’est pas formulée dans le verset, même si l’idée de connaissance indirecte est cohérente avec le contexte. « De nos oreilles » n’est pas une tournure française naturelle pour rendre בְּאָזְנֵינוּ.
