  yaml_path: translation/ot/job/028/022.yaml
  text: Abaddon and Death say[a], ‘With our ears we have heard a report of it.’
translation:
  language: fr
  text: 'Abaddon et la Mort disent[a] : « Nous avons entendu parler d’elle. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La Destruction et la mort disent : “Nous avons entendu une rumeur à son sujet.” »'
    reason: Alternative lexicale pour אֲבַדּוֹן et שִׁמְעָהּ; elle reflète la possibilité de comprendre les termes de manière moins personnifiée et de rendre le nom par « rumeur ».
lexical_decisions:
- source_word: אֲבַדּוֹן
  choice: Abaddon
  rationale: La translittération conserve le nom-titre poétique et sa personnification en parallèle avec « la Mort », sans réduire le terme au seul sens abstrait de « destruction ».
- source_word: וָמָוֶת
  choice: et la Mort
  rationale: 'La majuscule signale la personnification poétique : la Mort parle avec Abaddon, sans imposer pour autant une interprétation ontologique.'
- source_word: אָמְרוּ
  choice: disent
  rationale: Bien que la forme hébraïque soit un accompli, le présent convient à l’énoncé poétique vif et général dans ce contexte.
- source_word: בְּאָזְנֵינוּ
  choice: de nos oreilles
  rationale: Cette tournure française conserve l’image hébraïque de l’écoute directe tout en restant intelligible.
- source_word: שָׁמַעְנוּ
  choice: nous en avons entendu
  rationale: Le passé composé exprime une audition antérieure dont le résultat demeure pertinent dans le discours.
- source_word: שִׁמְעָהּ
  choice: la rumeur
  rationale: Le nom peut désigner une nouvelle, un écho ou une rumeur. Ici, « la rumeur » souligne que les locuteurs n’ont de la sagesse qu’une connaissance indirecte; le suffixe féminin est rendu par « en » et renvoie à la sagesse.
theological_decisions:
- issue: Personnification d’Abaddon et de la Mort
  choice: Présenter Abaddon et la Mort comme des locuteurs personnifiés
  alternative: Traduire אֲבַדּוֹן par « la destruction » et laisser « mort » sans personnification marquée
  rationale: Le texte leur attribue la parole et l’ouïe. Le nom « Abaddon » et la majuscule à « Mort » rendent cette personnification poétique sans affirmer davantage sur leur nature.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation conserve l’image des oreilles et l’idée d’une connaissance seulement indirecte; « n’en… que » explicite légèrement cette limitation, déjà portée par le contraste contextuel entre connaissance directe et simple rumeur.
