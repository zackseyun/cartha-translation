  text: נָ֭תִיב לֹֽא יְדָ֣ע/וֹ עָ֑יִט וְ/לֹ֥א שְׁ֝זָפַ֗תּ/וּ עֵ֣ין אַיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/007.yaml
  text: A path no bird of prey knows[a], and the eye of the falcon has not seen it.
translation:
  language: fr
  text: Un sentier que l’oiseau de proie ne connaît pas, que l’œil du milan[a] n’a pas aperçu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faucon ». Le mot hébreu désigne un oiseau de proie dont l’espèce exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתִיב
  choice: sentier
  rationale: Le terme désigne un chemin ou une piste. « Sentier » convient au registre poétique et évoque ici une voie cachée.
- source_word: לֹא יְדָעוֹ
  choice: ne connaît pas
  rationale: Le verbe ידע accompagné du suffixe masculin singulier signifie littéralement « ne le connaît pas ». En français, l’antécédent « un sentier » permet de ne pas répéter le pronom complément.
- source_word: עָיִט
  choice: oiseau de proie
  rationale: Le mot est un terme général désignant un rapace, sans imposer une espèce précise.
- source_word: וְלֹא שְׁזָפַתּוּ
  choice: n’a pas aperçu
  rationale: שׁזף exprime ici l’action de voir ou d’apercevoir. « Aperçu » rend naturellement l’idée qu’un lieu échappe même à une vue perçante.
- source_word: עֵין
  choice: l’œil
  rationale: La traduction littérale préserve l’image poétique hébraïque.
- source_word: אַיָּה
  choice: milan
  rationale: Le terme désigne vraisemblablement un rapace de type milan, mais l’identification zoologique exacte reste incertaine; cette incertitude est signalée en note.
