source:
  edition: WLC
  text: בַּ/עֲשֹׂת֣/וֹ לַ/מָּטָ֣ר חֹ֑ק וְ֝/דֶ֗רֶךְ לַ/חֲזִ֥יז קֹלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/026.yaml
  text: when he made a decree for the rain[a], and a path for the thunderbolt of the storms,
translation:
  language: fr
  text: quand il fixa une règle à la pluie et traça un chemin pour l’éclair des tonnerres[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la foudre de l’orage » ; littéralement « pour l’éclair des tonnerres ».
    reason: L’expression חֲזִיז קֹלוֹת associe l’éclair ou la foudre aux « voix/sons », terme qui, dans ce contexte, désigne les tonnerres. Sa relation exacte peut être rendue plus idiomatiquement par « la foudre de l’orage ».
lexical_decisions:
- source_word: בַּעֲשֹׂתוֹ
  choice: quand il fixa
  rationale: La préposition ב avec l’infinitif construit et le suffixe a ici une valeur temporelle. Avec חֹק, « fixer une règle » exprime naturellement en français l’établissement d’un ordre.
- source_word: לַמָּטָר
  choice: à la pluie
  rationale: מָטָר désigne la pluie et porte l’article. « À la pluie » convient à la construction française « fixer une règle à ».
- source_word: חֹק
  choice: une règle
  rationale: חֹק désigne ce qui est prescrit ou fixé. Dans ce contexte cosmologique, « règle » évoque l’ordre assigné à la pluie sans donner au vers une coloration juridique excessive.
- source_word: וְדֶרֶךְ
  choice: et traça un chemin
  rationale: דֶּרֶךְ signifie « chemin, voie ». L’ajout idiomatique du verbe « traça », coordonné à « fixa », rend en français la construction elliptique hébraïque sans modifier son image.
- source_word: לַחֲזִיז
  choice: pour l’éclair
  rationale: חֲזִיז désigne un éclair ou un trait de foudre. « Éclair » est courant et précis dans ce contexte météorologique.
- source_word: קֹלוֹת
  choice: des tonnerres
  rationale: קוֹל signifie normalement « voix, son » et peut désigner le tonnerre dans un contexte d’orage. Le pluriel inhabituel est conservé afin de ne pas effacer l’expression poétique ni trancher sa relation exacte avec חֲזִיז.
theological_decisions:
- issue: L’ordre cosmique établi par Dieu
  choice: Présenter Dieu comme celui qui fixe une règle à la pluie et un chemin à l’éclair.
  alternative: Expliciter une maîtrise providentielle permanente de tous les phénomènes naturels.
  rationale: Le vers décrit poétiquement l’établissement d’un ordre dans la création. La traduction en conserve l’implication théologique sans lui ajouter une formulation doctrinale absente de l’hébreu.
- issue: Rapport entre חֲזִיז et קֹלוֹת
  choice: « l’éclair des tonnerres »
  alternative: « la foudre de l’orage » ou « l’éclair accompagné de tonnerre »
  rationale: La relation génitive de l’hébreu est dense et ambiguë. Une formulation proche de la source préserve cette tension plutôt que d’expliciter le lien comme accompagnement ou provenance.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme est conservé avec « fixa une règle » et « traça un chemin ». La virgule finale signale que le vers appartient à une phrase poétique poursuivie dans le contexte.
