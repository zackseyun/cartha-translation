  yaml_path: translation/ot/job/028/012.yaml
  text: But where can wisdom be found[a], and where is the place of understanding?
translation:
  language: fr
  text: Mais où peut-on trouver la sagesse[a], et où se trouve le lieu de l’intelligence ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’où la sagesse sera-t-elle trouvée ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: Mais la sagesse
  rationale: Le וְ marque ici naturellement le contraste avec l’exposé précédent sur les richesses tirées de la terre; « Mais » rend ce tournant rhétorique, tandis que l’article convient en français devant le nom abstrait.
- source_word: מֵאַיִן תִּמָּצֵא
  choice: d’où peut-elle venir
  rationale: מֵאַיִן interroge littéralement la provenance, et le niphal imperfectif de מצא signifie « être trouvé ». La formulation française retenue exprime naturellement la recherche de l’origine de la sagesse sans en faire une simple prédiction future; une note conserve l’image littérale de ce qui est « trouvé ».
- source_word: וְאֵי זֶה
  choice: Et où se trouve
  rationale: אֵי est l’adverbe interrogatif « où ? ». Dans l’expression אֵי זֶה מְקוֹם, זֶה participe à une tournure idiomatique; « où se trouve » restitue clairement la question en français moderne.
- source_word: מְקוֹם
  choice: le lieu
  rationale: « Lieu » traduit directement מְקוֹם et conserve l’image poétique d’un emplacement propre à l’intelligence.
- source_word: בִּינָה
  choice: l’intelligence
  rationale: בִּינָה désigne la capacité de comprendre et de discerner. « Intelligence » appartient au vocabulaire sapientiel français et maintient le parallélisme avec « sagesse ».
