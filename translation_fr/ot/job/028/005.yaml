    issue: Antécédent et localisation insuffisamment clairs dans « mais par-dessous, elle est bouleversée ».
    rationale: La tournure française laisse entendre que « la terre » entière est bouleversée « par-dessous », alors que le syntagme hébreu désigne ce qui est sous elle / ses profondeurs. Une explicitation spatiale minimale est nécessaire pour une lecture naturelle.
  - severity: low
    issue: La note alternative « elle est retournée comme le feu » reste grammaticalement et sémantiquement maladroite.
    rationale: En français, « comme le feu » ne précise pas clairement le terme de comparaison. Il vaut mieux formuler la variante de façon cohérente et expliquer que la comparaison peut marquer la ressemblance plutôt que le moyen.
