  text: אֶ֗רֶץ מִמֶּ֥/נָּה יֵֽצֵא לָ֑חֶם וְ֝/תַחְתֶּ֗י/הָ נֶהְפַּ֥ךְ כְּמוֹ אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/005.yaml
  text: As for the earth[a], from it bread comes out, but underneath it is turned up as by fire.
translation:
  language: fr
  text: 'La terre : d’elle sort le pain, mais dans ses profondeurs, elle est bouleversée comme par le feu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et dans ses profondeurs, elle est bouleversée comme le feu ». La comparaison hébraïque peut évoquer soit le moyen ou l’effet (« comme par le feu »), soit une simple ressemblance (« comme le feu »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: la terre
  rationale: Le contexte oppose la surface du sol, qui produit la nourriture, à ses profondeurs exploitées par les mineurs ; « la terre » convient mieux qu’un territoire particulier.
- source_word: מִמֶּנָּה
  choice: d’elle
  rationale: Le suffixe féminin renvoie à « la terre » ; le pronom féminin est naturel en français.
- source_word: יֵצֵא
  choice: sort
  rationale: Le verbe exprime concrètement l’idée de sortir ou de provenir, préservée par « sort ».
- source_word: לָחֶם
  choice: le pain
  rationale: Le terme concret « pain » est conservé plutôt que généralisé en « nourriture » ; il représente ici ce que la terre produit pour nourrir.
- source_word: וְתַחְתֶּיהָ
  choice: mais par-dessous
  rationale: « Mais » rend le contraste entre la surface féconde et les profondeurs bouleversées ; « par-dessous » garde la référence spatiale à ce qui se trouve sous la terre.
- source_word: נֶהְפַּךְ
  choice: elle est bouleversée
  rationale: Le niphal de הפך indique que la terre est retournée ou bouleversée ; cette formulation convient au contexte de l’extraction minière sans en préciser excessivement le procédé.
- source_word: כְּמוֹ אֵשׁ
  choice: comme par le feu
  rationale: Cette formulation française naturelle comprend la comparaison comme portant sur la manière ou l’effet du bouleversement, tout en signalant en note l’autre lecture possible.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et imagé. La structure antithétique de l’hébreu est maintenue, ainsi que l’image concrète du pain. La note préserve l’ambiguïté syntaxique et sémantique de la comparaison finale.
