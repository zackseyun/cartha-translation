review_pass:
  verdict: revise
  source_fidelity: 'Le sens de base est bien rendu : la terre produit le pain et ce qui se trouve en dessous est renversé/bouleversé. Cependant, « par-dessous, elle est bouleversée » est syntaxiquement peu clair en français : « elle » semble reprendre toute la terre, alors que l’hébreu vise son dessous / ses profondeurs. La comparaison finale demeure interprétativement discutée et doit rester signalée comme telle.'
  naturalness: '« La terre : d’elle sort le pain » est possible mais assez heurté. « La terre produit le pain » serait plus idiomatique, mais explicite davantage le rapport causatif. La formulation révisée conserve l’image de « sortir » tout en rendant clairement la localisation souterraine.'
  terminology: « Terre », « pain » et « bouleversé » conviennent. « Dans ses profondeurs » rend naturellement וְתַחְתֶּיהָ sans transformer le sens en une description technique de l’exploitation minière. La note évite de présenter « comme par le feu » comme le seul sens possible.
  issues:
