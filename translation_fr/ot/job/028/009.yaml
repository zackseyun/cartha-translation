  yaml_path: translation/ot/job/028/009.yaml
  text: He puts his hand to the flint[b][a]; he overturns mountains from their roots.
translation:
  language: fr
  text: Il porte la main sur le silex[a] ; il bouleverse les montagnes à la racine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre le silex » ou « dans la roche dure ». L’hébreu peut décrire le travail du mineur qui s’attaque à une roche très dure.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « depuis la racine des montagnes ». Le singulier « racine » peut avoir une valeur collective.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחַלָּמִישׁ
  choice: sur le silex
  rationale: חַלָּמִישׁ désigne le silex ou une roche très dure. Avec ב et l’expression שׁלח יד, « sur le silex » évoque naturellement le travail exercé sur la roche, tout en conservant l’image concrète.
- source_word: שָׁלַח יָדוֹ
  choice: Il porte la main
  rationale: L’expression signifie tendre ou porter la main vers quelque chose afin d’agir sur elle. « Porte la main sur » reste proche de l’hébreu et convient au contexte du travail minier.
- source_word: הָפַךְ
  choice: il renverse
  rationale: הפך exprime l’action de retourner ou de bouleverser. « Renverse » rend ici l’ampleur de la transformation produite par l’excavation.
- source_word: מִשֹּׁרֶשׁ
  choice: depuis leurs racines
  rationale: Le singulier hébreu « depuis la racine » a une valeur collective en rapport avec « montagnes ». Le pluriel possessif est idiomatique en français et conserve l’image d’un bouleversement à la base même des montagnes.
- source_word: הָרִים
  choice: les montagnes
  rationale: הָרִים signifie directement « montagnes ». L’article défini français convient à cette affirmation poétique générale.
