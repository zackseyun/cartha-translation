id: JOB.28.16
reference: Job 28:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא תְ֭סֻלֶּה בְּ/כֶ֣תֶם אוֹפִ֑יר בְּ/שֹׁ֖הַם יָקָ֣ר וְ/סַפִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/016.yaml
  text: It cannot be valued with the gold of Ophir[b][a], with precious onyx or sapphire.
translation:
  language: fr
  text: Elle ne peut être mise en balance avec l’or d’Ophir, ni avec l’onyx précieux[a] ou le saphir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « béryl »; l’identification exacte du terme hébreu désignant cette pierre est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou peut-être « lapis-lazuli »; les catégories minéralogiques anciennes ne correspondaient pas nécessairement aux classifications modernes.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְסֻלֶּה
  choice: être mise en balance
  rationale: Le pual exprime ici une estimation comparative par rapport à des matières précieuses. « Être mise en balance avec » conserve l’image possible de la pesée tout en exprimant naturellement l’impossibilité d’égaler la valeur de la sagesse.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: avec l’or d’Ophir
  rationale: כֶּתֶם désigne de l’or fin ou raffiné, et Ophir en indique la provenance renommée. « Avec » convient à la construction française « mettre en balance avec ».
- source_word: שֹׁהַם
  choice: onyx
  rationale: L’identification exacte de cette pierre est incertaine. « Onyx » est la désignation traditionnelle et largement reconnue; « béryl » est signalé en note.
- source_word: יָקָר
  choice: précieux
  rationale: L’adjectif souligne la grande valeur de la pierre et correspond au registre naturel du vocabulaire des gemmes en français.
- source_word: סַפִּיר
  choice: saphir
  rationale: « Saphir » conserve le terme traditionnel, tandis qu’une note indique que la classification minéralogique ancienne pourrait viser le lapis-lazuli.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La tournure « mise en balance » préserve à la fois l’image concrète de la pesée et la comparaison de valeur, sans réduire le vers à une simple estimation monétaire.
