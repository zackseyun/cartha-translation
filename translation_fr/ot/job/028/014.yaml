  text: תְּה֣וֹם אָ֭מַר לֹ֣א בִ/י הִ֑יא וְ/יָ֥ם אָ֝מַ֗ר אֵ֣ין עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/014.yaml
  text: The deep says[a], ‘It is not in me,’ and the sea says, ‘It is not with me.’
translation:
  language: fr
  text: 'L’abîme dit : « Elle n’est pas en moi », et la mer dit : « Elle n’est pas avec moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהוֹם
  choice: l’abîme
  rationale: Le terme désigne la grande profondeur des eaux. « L’abîme » est naturel dans un registre poétique et forme un parallèle net avec « la mer », sans ajouter de précision étrangère au texte.
- source_word: אָמַר
  choice: dit
  rationale: Bien que la forme hébraïque soit un qatal, le présent français convient à cette déclaration poétique vive et à la personnification.
- source_word: לֹא בִי הִיא
  choice: Elle n’est pas en moi
  rationale: Le pronom féminin הִיא renvoie à la sagesse, nom féminin en hébreu comme en français. La traduction conserve donc naturellement le féminin ainsi que le sens direct de בִי, « en moi ».
- source_word: יָם
  choice: la mer
  rationale: C’est le sens ordinaire de יָם et il préserve le parallélisme poétique avec « l’abîme ».
- source_word: אֵין עִמָּדִי
  choice: Elle n’est pas avec moi
  rationale: Cette formulation garde l’image de l’absence auprès de la mer, sans réduire la phrase au sens plus interprétatif « je ne la possède pas ».
theological_decisions:
- issue: Référent du pronom féminin הִיא
  choice: Traduire par « elle » en référence à la sagesse
  alternative: Traduire de manière impersonnelle par « cela »
  rationale: Le contexte de Job 28 présente la sagesse comme l’objet recherché, et le féminin grammatical se transpose naturellement en français puisque « sagesse » est également féminin. Cette correspondance préserve la personnification sans l’accentuer artificiellement.
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme des deux membres est conservé, ainsi que la distinction entre « en moi » et « avec moi ».
