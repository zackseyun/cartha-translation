  text: when he gave the wind its weight and measured the waters by measure[b][a],
translation:
  language: fr
  text: 'quand il donna[a] au vent son poids

    et mesura les eaux avec une mesure.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour donner un poids au vent » ou « en donnant un poids au vent ». L’infinitif hébreu peut être rendu plus formellement ; le texte principal exprime le sens temporel dans le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: quand il donna
  rationale: L’infinitif construit avec ל poursuit, dans le contexte, la description temporelle de l’action divine. « Quand il donna » rend naturellement ce rapport et convient à l’association avec « poids ».
- source_word: לָרוּחַ
  choice: au vent
  rationale: רוּחַ peut désigner le vent, le souffle ou l’esprit, mais son parallélisme avec les eaux et le contexte de l’ordre créé favorisent ici le sens météorologique.
- source_word: מִשְׁקָל
  choice: son poids
  rationale: Le nom désigne le poids ou l’acte de peser. « Son poids » exprime naturellement l’idée que Dieu assigne au vent une juste mesure.
- source_word: וּמַיִם
  choice: les eaux
  rationale: La forme hébraïque est plurielle et « les eaux » conserve cette forme tout en convenant au registre poétique.
- source_word: תִּכֵּן
  choice: mesura
  rationale: Le verbe évoque une détermination précise par mesure ou pesée. « Mesura » maintient le parallélisme avec le poids du premier membre.
- source_word: בְּמִדָּה
  choice: avec une mesure
  rationale: L’expression indique un étalon ou une proportion mesurée. Cette formulation française reste claire tout en conservant l’image concrète du texte hébreu.
theological_decisions:
- issue: Continuité du sujet avec le verset précédent
  choice: Le sujet sous-entendu est Dieu (« il »), dans la continuité du verset 24.
  alternative: 'Conserver un infinitif sans sujet explicite : « pour donner au vent un poids ».'
  rationale: La proposition infinitive dépend du contexte précédent, qui décrit l’action de Dieu. L’ajout de « il » est requis par une formulation française naturelle sans introduire une affirmation étrangère au texte.
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme entre le poids du vent et la mesure des eaux est préservé. Le choix « avec une mesure » privilégie la clarté sans effacer l’image hébraïque.
