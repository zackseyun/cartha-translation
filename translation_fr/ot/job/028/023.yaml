  yaml_path: translation/ot/job/028/023.yaml
  text: God understands its way[a], and he knows its place.
translation:
  language: fr
  text: Dieu comprend son chemin[a], et lui-même connaît sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie des suffixes féminins : « son chemin … sa place », en référence à la sagesse. « Son chemin » peut aussi se comprendre comme le chemin qui mène à elle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom désigne ici le Dieu unique, comme le montrent les verbes au singulier.
- source_word: הֵבִין
  choice: comprend
  rationale: Le hifil de בין exprime ici la compréhension ou le discernement. Le présent convient à cette affirmation générale et durable au sujet de Dieu.
- source_word: דַּרְכָּהּ
  choice: son chemin
  rationale: Le suffixe féminin renvoie à la sagesse. « Son chemin » conserve la métaphore hébraïque et reste naturel en français, sans trancher inutilement entre le chemin propre à la sagesse et le chemin qui mène à elle.
- source_word: וְהוּא
  choice: et lui-même
  rationale: Le pronom indépendant apporte une insistance. « Lui-même » la restitue naturellement sans introduire une majuscule révérentielle.
- source_word: יָדַע
  choice: connaît
  rationale: Le verbe ידע désigne la connaissance. Le présent rend le caractère intemporel de l'affirmation poétique.
- source_word: אֶת מְקוֹמָהּ
  choice: son lieu
  rationale: מקום signifie « lieu » ou « emplacement ». « Son lieu » est concis, fidèle, et le possessif renvoie naturellement à « la sagesse », féminin en français comme en hébreu.
theological_decisions:
- issue: Référent des suffixes féminins dans « son chemin » et « son lieu »
  choice: Les suffixes renvoient à la sagesse, nom féminin et réalité personnifiée dans le contexte.
  alternative: Comprendre « son chemin » comme « le chemin qui mène à elle ».
  rationale: Le contexte de Job 28 indique que la sagesse est le référent. La formulation française garde le féminin de manière naturelle, mais « son chemin » conserve l'ambiguïté réelle quant à la relation exacte entre la sagesse et le chemin.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et poétique. « Lui-même » rend l'insistance portée par le pronom hébreu indépendant, tandis que « son chemin » préserve une ambiguïté du texte source.
