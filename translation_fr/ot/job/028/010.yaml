  yaml_path: translation/ot/job/028/010.yaml
  text: He cuts channels through the rocks[b][a], and his eye sees every precious thing.
translation:
  language: fr
  text: Il taille des canaux dans le roc[a], et son œil voit tout ce qui est précieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des cours d’eau » ou « des galeries ». Le terme hébreu désigne habituellement des cours d’eau ou des canaux; dans le contexte minier, il peut évoquer des canaux ou des passages aménagés dans la roche.
    reason: lexical_alternative
  - marker: b
    text: Ou « toute chose de valeur » ou « tout minerai précieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצּוּרוֹת
  choice: dans le roc
  rationale: 'צוּר désigne une roche dure ou un rocher. Avec le verbe « creuser/fendre », la préposition בְּ a ici une valeur locative : l’ouvrage est pratiqué dans la roche. Le singulier collectif « le roc » convient naturellement au contexte minier.'
- source_word: יְאֹרִים
  choice: galeries
  rationale: יְאֹרִים désigne normalement des cours d’eau ou des canaux. Dans l’imagerie minière du contexte, il s’agit vraisemblablement de passages creusés dans la roche. « Galeries » rend clairement cette scène, tandis qu’une note conserve les sens plus littéraux et l’ambiguïté lexicale.
- source_word: בִּקֵּעַ
  choice: creuse
  rationale: בקע signifie fendre, ouvrir ou pratiquer une brèche. Associé aux passages dans la roche, « creuse » exprime naturellement l’action du mineur sans imposer le terme plus technique « percer ».
- source_word: יְקָר
  choice: tout ce qui est précieux
  rationale: יְקָר désigne ce qui a du prix ou de la valeur sans préciser qu’il s’agit nécessairement de minerai, de métal ou de gemmes. Cette formulation française garde cette portée générale.
- source_word: רָאֲתָה עֵינוֹ
  choice: son œil découvre
  rationale: L’hébreu dit littéralement « son œil a vu ». « Son œil découvre » conserve l’image vive de l’œil et exprime, dans ce tableau descriptif, la mise au jour des richesses cachées.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le vers conserve le parallélisme poétique et l’image singulière de « son œil ». « Galeries » rend le contexte minier avec clarté, tandis que la note signale le sens habituel et l’ambiguïté de יְאֹרִים.
