base_translation:
  language: en
  yaml_path: translation/ot/job/002/002.yaml
  text: And Yahweh said to the Accuser[a], “From where have you come?” And the Accuser answered Yahweh and said, “From roaming about on the earth and from walking around on it.”
translation:
  language: fr
  text: 'Yahweh dit à l’Accusateur[a] : « D’où viens-tu ? » L’Accusateur répondit à Yahweh : « J’ai parcouru la terre et j’y ai marché çà et là. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « le satan » ; il s’agit probablement ici d’un titre signifiant « l’accusateur » ou « l’adversaire », et pas nécessairement d’un nom propre.'
    reason: Lecture alternative et portée du titre hébreu.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel donné dans le texte hébreu, au lieu de lui substituer un titre comme « le Seigneur ».
- source_word: הַשָּׂטָן
  choice: l’Accusateur
  rationale: L’article défini hébreu présente ici שָׂטָן comme un titre ou une fonction. « L’Accusateur » exprime clairement en français sa dimension accusatrice et judiciaire sans en faire nécessairement un nom propre.
- source_word: אֵי מִזֶּה תָּבֹא
  choice: D’où viens-tu ?
  rationale: Cette formulation française naturelle conserve l’idée de provenance exprimée par מִן.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: répondit
  rationale: En français, le seul verbe « répondit », suivi des paroles directes, rend naturellement la formule narrative hébraïque à deux verbes sans lourdeur artificielle.
- source_word: מִשֻּׁט בָּאָרֶץ
  choice: D’avoir parcouru la terre
  rationale: « Parcourir » rend le déplacement étendu ou en tous sens exprimé par שׁוּט. La construction avec « de » maintient le lien formel avec la question portant sur la provenance.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: et de m’y être promené
  rationale: La forme réfléchie et itérative de הלך évoque le fait de circuler ou de marcher çà et là. « S’y promener » reste accessible et évite d’ajouter l’idée plus précise d’une patrouille.
theological_decisions:
- issue: Faut-il comprendre הַשָּׂטָן comme un nom propre (« Satan ») ou comme un titre désignant une fonction ?
  choice: l’Accusateur
  alternative: Satan ; l’adversaire ; le satan
  rationale: L’article défini et le cadre de la cour céleste favorisent ici une désignation fonctionnelle. Ce choix n’impose pas au passage les développements théologiques ultérieurs et conserve la tension du texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue reste direct. La réponse elliptique « D’avoir parcouru… » conserve la structure de provenance de l’hébreu, malgré sa légère étrangeté voulue en français.
