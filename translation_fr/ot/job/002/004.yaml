base_translation:
  language: en
  yaml_path: translation/ot/job/002/004.yaml
  text: Then the Adversary answered Yahweh and said[a], “Skin for skin! Indeed[c][b], all that a man has he will give for his life.”
translation:
  language: fr
  text: 'L’Adversaire[a] répondit à Yahvé et dit : « Peau pour peau ! Tout ce qu’un homme possède, il le donnera pour sa vie[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Satan » ou « l’Accusateur » ; en hébreu, le terme est précédé de l’article et fonctionne ici comme un titre.
    reason: alternative_reading
  - marker: c
    text: Le terme hébreu signifie ici « vie » ; selon le contexte, il peut aussi être rendu par « personne » ou « âme ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: l’Adversaire
  rationale: L’article hébreu indique ici une désignation fonctionnelle plutôt qu’un nom propre. « L’Adversaire » conserve le rôle exprimé dans le prologue de Job sans imposer l’usage plus tardif de « Satan » comme nom propre.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française courante représente explicitement le nom divin plutôt que de le remplacer par un titre.
- source_word: עוֹר בְּעַד עוֹר
  choice: Peau pour peau !
  rationale: La formule hébraïque, brève et proverbiale, est conservée sans en fixer trop précisément le sens dans le corps du texte.
- source_word: וְכֹל אֲשֶׁר לָאִישׁ
  choice: Tout ce qu’un homme possède
  rationale: Cette formulation française naturelle exprime clairement la relation possessive implicite dans l’hébreu tout en gardant le sujet masculin singulier du proverbe.
- source_word: יִתֵּן
  choice: il le donnera
  rationale: L’imparfait hébreu exprime ici ce qu’une personne est disposée à faire de manière générale; le futur français convient au caractère proverbial de l’affirmation.
- source_word: נַפְשׁוֹ
  choice: sa vie
  rationale: Dans ce contexte, נֶפֶשׁ désigne la vie de la personne, menacée de mort, plutôt qu’une âme immatérielle.
- source_word: בְּעַד נַפְשׁוֹ
  choice: pour préserver sa vie
  rationale: La formulation rend en français naturel l’idée d’échange ou de sacrifice consenti afin de conserver sa propre vie.
theological_decisions:
- issue: Valeur de הַשָּׂטָן dans le prologue de Job
  choice: l’Adversaire
  alternative: Satan
  rationale: La présence de l’article et la fonction judiciaire du personnage favorisent un titre de rôle. Ce choix préserve la nuance propre au récit sans exclure les rapprochements canoniques ultérieurs.
- issue: Sens de נֶפֶשׁ
  choice: la vie
  alternative: l’âme / la personne elle-même
  rationale: Le contexte porte sur la disposition d’un homme à tout abandonner pour échapper à la mort. « Vie » rend donc le référent immédiat sans introduire une conception particulière de l’âme.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe directe garde la vigueur de la réplique, tandis que les notes préservent l’ambiguïté du proverbe et les possibilités lexicales du texte hébreu.
