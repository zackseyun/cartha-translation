id: JOB.2.11
reference: Job 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֞וּ שְׁלֹ֣שֶׁת רֵעֵ֣י אִיּ֗וֹב אֵ֣ת כָּל הָ/רָעָ֣ה הַ/זֹּאת֮ הַ/בָּ֣אָה עָלָי/ו֒ וַ/יָּבֹ֨אוּ֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ אֱלִיפַ֤ז הַ/תֵּימָנִי֙ וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֔י וְ/צוֹפַ֖ר הַ/נַּֽעֲמָתִ֑י וַ/יִּוָּעֲד֣וּ יַחְדָּ֔ו לָ/ב֥וֹא לָ/נֽוּד ל֖/וֹ וּֽ/לְ/נַחֲמֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/011.yaml
  text: 'When Job’s three friends heard about all this trouble that had come upon him[a], they came each from his own place: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite[d][c][b]. They agreed together to come to sympathize with him and to comfort him.'
translation:
  language: fr
  text: 'Lorsque les trois amis de Job apprirent tout le malheur qui lui était arrivé[a], ils vinrent chacun de chez lui : Éliphaz de Témân, Bildad de Shouah et Tsophar de Naama. Ils convinrent ensemble[b] de venir lui témoigner leur compassion[c] et le consoler.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute cette calamité qui s’était abattue sur lui ». Le mot hébreu désigne ici un malheur subi, non un mal moral commis par Job.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils se donnèrent rendez-vous ». Le verbe hébreu indique une concertation délibérée.
    reason: lexical_alternative
  - marker: c
    text: Ou « prendre part à son deuil ». Le verbe hébreu peut désigner l’expression de la compassion ou des condoléances, notamment dans le deuil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Lorsque … apprirent
  rationale: Le waw consécutif fait progresser le récit, tandis que la proposition situe l’action dans le temps. « Lorsque » donne un enchaînement naturel en français sans ajouter un marqueur tel que « Or ».
- source_word: שְׁלֹשֶׁת רֵעֵי אִיּוֹב
  choice: les trois amis de Job
  rationale: Rend naturellement la chaîne construite; רֵעַ désigne ici les amis de Job.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: tout le malheur
  rationale: Dans ce contexte, רָעָה désigne le désastre ou l’infortune subis par Job, et non une faute morale. « Malheur » est naturel, digne et conserve la portée générale du terme.
- source_word: הַבָּאָה עָלָיו
  choice: qui lui était arrivé
  rationale: La proposition participiale qualifie le malheur qui a atteint Job. Cette formulation française exprime clairement l’antériorité sans lourdeur.
- source_word: וַיָּבֹאוּ אִישׁ מִמְּקֹמוֹ
  choice: ils vinrent chacun de chez lui
  rationale: אִישׁ a une valeur distributive, « chacun ». « De chez lui » rend idiomatiquement l’idée que chacun partit de son propre lieu.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: de Témân / de Shouah / de Naama
  rationale: Les gentilés hébreux sont rendus par l’origine géographique en français courant, ce qui évite des formes ethniques artificielles tout en préservant les noms propres.
- source_word: וַיִּוָּעֲדוּ יַחְדָּו
  choice: Ils convinrent ensemble
  rationale: Le niphal de יעד exprime ici une concertation ou un rendez-vous délibéré. « Convinrent ensemble » garde cette coordination intentionnelle.
- source_word: לָבוֹא
  choice: de venir
  rationale: L’infinitif exprime le but de leur concertation; « venir » conserve directement le mouvement présenté par le texte hébreu.
- source_word: לָנוּד לוֹ
  choice: lui témoigner leur compassion
  rationale: נוּד peut désigner une manifestation de sympathie ou de condoléances, souvent liée au deuil. Cette expression reste distincte du verbe suivant, « consoler ».
- source_word: וּלְנַחֲמוֹ
  choice: et le consoler
  rationale: Le piel de נחם signifie couramment consoler. « Consoler » est naturel en français et conserve la distinction avec le geste de compassion précédent.
theological_decisions:
- issue: Sens moral ou calamiteux de רָעָה
  choice: « malheur », désignant la calamité subie par Job
  alternative: « mal » pourrait être compris comme une faute morale
  rationale: Le contexte décrit ce qui est arrivé à Job; il ne porte pas ici de jugement moral sur lui.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms sont translittérés selon des formes françaises lisibles; les deux verbes finaux restent distincts afin de préserver les nuances de compassion et de consolation.
