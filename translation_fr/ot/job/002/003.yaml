- from: 'Alors Yahweh dit à l’Accusateur[a] : « As-tu porté ton attention sur mon serviteur Job ? Il n’y a personne comme lui sur la terre : c’est un homme intègre et droit, qui craint Dieu et se détourne du mal. Il tient encore fermement à son intégrité, bien que tu m’aies poussé à agir contre lui pour l’anéantir sans raison[b]. »'
  to: 'Alors Yahweh dit à l’Accusateur[a] : « As-tu remarqué mon serviteur Job ? Il n’y a personne comme lui sur la terre : c’est un homme intègre et droit, qui craint Dieu et se détourne du mal. Il tient encore fermement à son intégrité, bien que tu m’aies incité contre lui pour le détruire sans raison[b]. »'
  rationale: La révision resserre la relation entre l’incitation attribuée à l’Accusateur et la destruction de Job, telle qu’elle est formulée en hébreu. Elle adopte une expression française plus idiomatique pour l’idiome initial et complète les notes aux points où les choix français ne peuvent conserver simultanément l’image littérale et les nuances du texte source.
