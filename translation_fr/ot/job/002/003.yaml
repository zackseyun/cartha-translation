  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הֲ/שַׂ֣מְתָּ לִבְּ/ךָ֮ אֶל עַבְדִּ֣/י אִיּוֹב֒ כִּי֩ אֵ֨ין כָּמֹ֜/הוּ בָּ/אָ֗רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֣ר מֵ/רָ֑ע וְ/עֹדֶ֨/נּוּ֙ מַחֲזִ֣יק בְּ/תֻמָּת֔/וֹ וַ/תְּסִיתֵ֥/נִי ב֖/וֹ לְ/בַלְּע֥/וֹ חִנָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/003.yaml
  text: Then Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is no one like him on the earth, a blameless and upright man, one who fears God and turns away from evil. He still holds fast his integrity[d][c][b], though you incited me against him to destroy him for nothing.”
translation:
  language: fr
  text: 'Alors Yahweh dit à l’Accusateur[a] : « As-tu remarqué mon serviteur Job ? Il n’y a personne comme lui sur la terre : c’est un homme intègre et droit, qui craint Dieu et se détourne du mal. Il tient encore fermement à son intégrité, bien que tu m’aies incité contre lui pour le détruire sans raison[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « As-tu porté ton attention sur mon serviteur Job ? » Littéralement : « As-tu mis ton cœur sur mon serviteur Job ? »'
    reason: lexical_alternative
  - marker: b
    text: « Sans raison » peut aussi signifier « pour rien » ou « gratuitement » et fait probablement écho à Job 1.9, où l’Accusateur demande si Job craint Dieu « pour rien ». « Le détruire » traduit un verbe qui signifie littéralement « l’engloutir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: הַשָּׂטָן
  choice: l’Accusateur
  rationale: Avec l’article, le terme désigne ici une fonction ou un titre. « L’Accusateur » en exprime clairement la dimension judiciaire et hostile.
- source_word: הֲשַׂמְתָּ לִבְּךָ אֶל
  choice: as-tu porté ton attention sur
  rationale: Littéralement, l’expression évoque le fait de « placer son cœur sur ». La formulation retenue transmet naturellement en français l’idée d’une considération attentive sans suggérer le désir impliqué par « jeter son dévolu sur ».
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte, le mot souligne l’appartenance et le service fidèle de Job plutôt que son statut social d’esclave.
- source_word: אֵין כָּמֹהוּ בָּאָרֶץ
  choice: il n’y a personne comme lui sur la terre
  rationale: « Sur la terre » convient à la portée générale et cosmique de la scène, tout en restant naturel en français.
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: un homme intègre et droit
  rationale: תָּם décrit la plénitude morale et l’intégrité, non une perfection absolue sans péché ; יָשָׁר signifie « droit ».
- source_word: יְרֵא אֱלֹהִים
  choice: qui craint Dieu
  rationale: Cette traduction conserve la forme verbale et le poids religieux de la crainte révérencielle.
- source_word: וְסָר מֵרָע
  choice: se détourne du mal
  rationale: La formulation rend le mouvement d’éloignement exprimé par סור et demeure claire en français courant.
- source_word: וְעֹדֶנּוּ מַחֲזִיק בְּתֻמָּתוֹ
  choice: il tient encore fermement à son intégrité
  rationale: « Tenir fermement à » rend la force de מחזיק ; « intégrité » traduit תֻמָּה et maintient son lien avec תָּם dans la même phrase.
- source_word: וַתְּסִיתֵנִי בוֹ
  choice: bien que tu m’aies poussé à agir contre lui
  rationale: La relation concessive convient au contexte, tandis que « poussé à agir contre lui » conserve l’attribution directe de l’action divine sans la durcir artificiellement.
- source_word: לְבַלְּעוֹ
  choice: pour l’anéantir
  rationale: Le verbe signifie littéralement « l’engloutir », mais désigne ici métaphoriquement sa ruine ou sa destruction. « L’anéantir » restitue naturellement la force du terme dans ce contexte.
- source_word: חִנָּם
  choice: sans raison
  rationale: Le terme signifie ici « sans motif » ou « sans cause ». « Sans raison » convient directement à l’absence de faute chez Job, tandis qu’une note signale l’écho possible avec Job 1.9.
theological_decisions:
- issue: Implication divine dans les souffrances de Job
  choice: bien que tu m’aies poussé à agir contre lui
  alternative: bien que tu m’aies poussé à permettre qu’on lui fasse du mal
  rationale: La formulation maintient l’attribution directe et troublante de l’action à Yahweh. Elle ne réduit pas cette tension en transformant l’action en simple permission.
- issue: Identité de הַשָּׂטָן
  choice: l’Accusateur
  alternative: Satan
  rationale: L’article hébreu présente vraisemblablement une fonction dans cette scène. Le titre évite d’imposer au passage une identification personnelle plus tardive.
- issue: Sens de חִנָּם
  choice: sans raison
  alternative: gratuitement / pour rien
  rationale: « Sans raison » met en évidence l’absence de faute justifiant l’épreuve, sans effacer l’écho littéraire avec Job 1.9, signalé en note.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste accessible, tout en conservant la solennité du dialogue céleste et la tension théologique du texte hébreu.
