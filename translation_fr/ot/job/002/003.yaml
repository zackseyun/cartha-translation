    rationale: L’expression hébraïque signifie littéralement « as-tu mis ton cœur sur » et peut aussi se rendre par « As-tu remarqué / considéré ». Une note brève rend compte de cette latitude sans alourdir le texte.
  - severity: low
    issue: La note sur « sans raison » ne signale pas la valeur littérale de לְבַלְּעוֹ.
    rationale: Le verbe signifie littéralement « l’engloutir » et est employé métaphoriquement pour la ruine ou la destruction. Une note explicite préserve cette image et l’ambiguïté lexicale.
