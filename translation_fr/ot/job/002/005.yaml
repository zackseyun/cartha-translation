id: JOB.2.5
reference: Job 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אוּלָם֙ שְֽׁלַֽח נָ֣א יָֽדְ/ךָ֔ וְ/גַ֥ע אֶל עַצְמ֖/וֹ וְ/אֶל בְּשָׂר֑/וֹ אִם לֹ֥א אֶל פָּנֶ֖י/ךָ יְבָרֲכֶֽ/ךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/005.yaml
  text: But stretch out your hand[a], please, and touch his bone and his flesh, and he will surely curse you to your face.
translation:
  language: fr
  text: 'Mais étends donc la main et touche à ses os et à sa chair : à coup sûr, il te maudira[a] en face.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « bénira »; le verbe est compris ici comme une expression euphémique signifiant « maudira ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: Mais
  rationale: Marque naturellement l’opposition par laquelle l’accusateur réplique à Dieu.
- source_word: שְׁלַח נָא יָדְךָ
  choice: étends donc la main
  rationale: L’expression hébraïque évoque une intervention directe. « Donc » rend ici la particule נָא avec une nuance d’exhortation provocatrice, plus naturelle dans ce contexte que « s’il te plaît ».
- source_word: וְגַע
  choice: et touche à
  rationale: Le verbe signifie d’abord « toucher »; la construction française « toucher à » permet aussi de suggérer l’atteinte nuisible sans expliciter davantage que l’hébreu.
- source_word: אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ
  choice: à ses os et à sa chair
  rationale: Cette formulation conserve l’image corporelle concrète de l’hébreu. Le singulier collectif עֶצֶם est rendu naturellement en français par le pluriel « os ».
- source_word: אִם לֹא
  choice: à coup sûr
  rationale: Dans cette formule de serment ou d’affirmation emphatique, les mots ne posent pas une simple condition, mais expriment la certitude provocatrice de l’accusateur.
- source_word: אֶל פָּנֶיךָ
  choice: en face
  rationale: Expression directe et idiomatique indiquant que Job s’adresserait ouvertement à Dieu, sans détour.
- source_word: יְבָרֲכֶךָּ
  choice: il te maudira
  rationale: Bien que ברך signifie normalement « bénir », le contexte exige ici le sens euphémique de « maudire »; ce sens est donné dans le texte, tandis que la forme littérale est signalée en note.
theological_decisions:
- issue: Emploi euphémique de ברך dans le récit de la mise à l’épreuve de Job
  choice: Traduire « il te maudira » dans le texte principal
  alternative: Traduire littéralement « il te bénira » et expliquer le sens d’après le contexte
  rationale: L’accusateur affirme que la souffrance poussera Job à rejeter ouvertement Dieu. « Bénir » induirait le lecteur moderne en erreur; la note préserve toutefois la forme hébraïque et la tension lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « étends donc la main » restitue l’exhortation provocatrice sans raideur, tandis que « ses os et sa chair » conserve l’image hébraïque concrète.
