base_translation:
  language: en
  yaml_path: translation/ot/job/002/001.yaml
  text: Again there was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them to present himself before Yahweh.
translation:
  language: fr
  text: Un jour, les fils de Dieu[a] vinrent de nouveau se présenter devant Yahvé. L’Adversaire[b] vint lui aussi au milieu d’eux se présenter devant Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de Dieu ». L’expression peut désigner des êtres célestes ou des membres du conseil divin.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « Satan » ou « l’Accusateur ». L’hébreu porte l’article défini : « l’adversaire », probablement employé ici comme un titre ou une fonction.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Un jour… de nouveau
  rationale: « Un jour » rend naturellement la formule narrative hébraïque, tandis que « de nouveau » explicite sobrement la reprise de la scène de Job 1.6.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: les fils de Dieu
  rationale: Traduction formellement transparente qui conserve l’expression et son ambiguïté plutôt que de l’interpréter directement comme « êtres célestes ».
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: se présenter devant Yahvé
  rationale: Dans cette scène d’audience, la forme verbale exprime le fait de comparaître ou de prendre place devant un supérieur; cette formulation est naturelle en français et conserve la tonalité de cour.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La transcription usuelle en français moderne représente le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הַשָּׂטָן
  choice: l’Adversaire
  rationale: L’article hébreu indique ici vraisemblablement un titre ou une fonction; « l’Adversaire » en restitue le sens général sans en faire automatiquement un nom propre.
- source_word: בְּתוֹכָם
  choice: au milieu d’eux
  rationale: Expression française naturelle qui maintient l’idée de sa présence au sein du groupe assemblé.
theological_decisions:
- issue: Faut-il comprendre הַשָּׂטָן comme un nom propre ou comme un titre ?
  choice: l’Adversaire
  alternative: Satan ; l’Accusateur
  rationale: La présence de l’article défini favorise ici une désignation de fonction. La traduction retenue conserve ce signal grammatical sans exclure l’identification traditionnelle du personnage.
- issue: Identité des בְּנֵי הָאֱלֹהִים
  choice: les fils de Dieu
  alternative: les êtres célestes ; les membres du conseil divin
  rationale: Le texte ne précise pas davantage leur identité. Garder l’expression hébraïque préserve cette ouverture interprétative.
translation_notes:
  register: Français moderne, international et digne. La syntaxe a été légèrement réorganisée pour éviter une tournure pesante, tout en conservant la répétition intentionnelle de « se présenter devant Yahvé » et le parallélisme de la scène.
