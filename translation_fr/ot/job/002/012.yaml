  text: And when they lifted up their eyes from a distance[a], they did not recognize him. Then they raised their voices and wept[b], and each man tore his robe and threw dust over his head toward the heavens.
translation:
  language: fr
  text: De loin, ils levèrent les yeux, mais ils ne le reconnurent pas. Alors ils élevèrent la voix et pleurèrent. Chacun déchira son manteau, puis ils jetèrent de la poussière sur leurs têtes, vers le ciel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers les cieux » ; ils lançaient la poussière en l’air dans un geste de deuil.'
    reason: Précise la formulation directionnelle hébraïque et explique sobrement le geste culturel sans en modifier le sens.
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: ils levèrent les yeux
  rationale: Conserve l’image idiomatique hébraïque dans une formulation française claire et digne.
- source_word: מֵרָחוֹק
  choice: de loin
  rationale: Rend directement la distance spatiale sans préciser davantage le lien syntaxique, qui demeure légèrement ouvert en hébreu.
- source_word: וְלֹא הִכִּירֻהוּ
  choice: mais ils ne le reconnurent pas
  rationale: Le verbe désigne ici l’incapacité à reconnaître Job; « mais » exprime naturellement le contraste porté par וְ.
- source_word: וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ
  choice: ils élevèrent la voix et pleurèrent
  rationale: Préserve l’idiome de la lamentation tout en restant naturel en français moderne.
- source_word: וַיִּקְרְעוּ אִישׁ מְעִלוֹ
  choice: Chacun déchira son manteau
  rationale: אִישׁ a une valeur distributive, et מְעִיל désigne ici un manteau ou vêtement de dessus.
- source_word: וַיִּזְרְקוּ עָפָר עַל רָאשֵׁיהֶם הַשָּׁמָיְמָה
  choice: ils jetèrent de la poussière au-dessus de leurs têtes, vers le ciel
  rationale: Reproduit le geste de deuil et conserve la direction ascendante indiquée par la terminaison directive de הַשָּׁמָיְמָה.
