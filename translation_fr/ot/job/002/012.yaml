review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : ils voient Job de loin, ne le reconnaissent pas, élèvent la voix, pleurent, déchirent chacun leur vêtement et jettent de la poussière sur leurs têtes en direction du ciel. Toutefois, « au-dessus de leurs têtes » peut décrire seulement l’emplacement de la poussière, tandis que l’hébreu dit explicitement « sur leurs têtes » ; la direction vers les cieux porte sur l’acte de jeter.'
  naturalness: Le français est clair et de registre narratif moderne. « Élevèrent la voix » est recevable mais « élevèrent la voix pour pleurer » rend plus naturellement l’enchaînement idiomatique sans perdre le sens. La construction finale révisée est plus nette.
  terminology: « Reconnaître », « pleurer », « déchirer son manteau » et « poussière » conviennent. « Cieux » dans la note reflète correctement le pluriel hébreu; dans le texte, « ciel » est un équivalent français naturel. Aucun enjeu théologique particulier.
