revisions:
- from: De loin, ils levèrent les yeux, mais ils ne le reconnurent pas. Alors ils élevèrent la voix et pleurèrent. Chacun déchira son manteau, puis ils jetèrent de la poussière au-dessus de leurs têtes, vers le ciel.[a]
  to: De loin, ils levèrent les yeux, mais ils ne le reconnurent pas. Alors ils élevèrent la voix et pleurèrent. Chacun déchira son manteau, puis ils jetèrent de la poussière sur leurs têtes, vers le ciel.[a]
  rationale: La révision remplace « au-dessus de leurs têtes » par « sur leurs têtes » afin de rendre la préposition hébraïque עַל avec exactitude, tout en conservant « vers le ciel » pour la direction ascendante exprimée par הַשָּׁמָיְמָה. Le pluriel collectif « leurs têtes » est approprié après « ils jetèrent », même si l’action précédente est formulée distributivement (« Chacun déchira son manteau »).
