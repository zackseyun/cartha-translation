base_translation:
  language: en
  yaml_path: translation/ot/job/002/010.yaml
  text: But he said to her[a], “You speak as one of the foolish women speaks. Shall we receive the good from God, and shall we not receive the bad?” In all this Job did not sin with his lips.
translation:
  language: fr
  text: 'Mais il lui répondit : « Tu parles comme l’une des femmes insensées. Recevrions-nous de Dieu le bonheur, et ne recevrions-nous pas aussi le malheur[a] ? » En tout cela, Job ne pécha pas par ses lèvres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le mal ». Ici, le terme hébreu désigne ce qui est nuisible ou défavorable, par opposition au bonheur.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר אַחַת הַנְּבָלוֹת תְּדַבֵּרִי
  choice: Tu parles comme parlerait l’une des femmes insensées
  rationale: « Insensées » exprime ici une folie morale et religieuse, et non un simple manque d’intelligence. La tournure comparative reproduit l’effet de l’hébreu dans un français naturel.
- source_word: גַּם אֶת הַטּוֹב נְקַבֵּל מֵאֵת הָאֱלֹהִים
  choice: Recevrions-nous de Dieu le bonheur
  rationale: Le contexte appelle une question rhétorique. « Le bonheur » désigne ici ce qui est favorable et forme en français une opposition naturelle avec « le malheur ».
- source_word: וְאֶת הָרָע לֹא נְקַבֵּל
  choice: et ne recevrions-nous pas aussi le malheur
  rationale: Dans ce contexte de souffrance, רָע désigne ce qui est nuisible ou défavorable plutôt qu’une faute morale. « Malheur » rend ce sens sans attribuer explicitement à Dieu le mal moral. « Aussi » explicite en français l’équilibre de la question rhétorique.
- source_word: בְּכָל זֹאת
  choice: En tout cela
  rationale: Formulation concise et idiomatique qui introduit l’évaluation du narrateur.
- source_word: לֹא חָטָא אִיּוֹב בִּשְׂפָתָיו
  choice: Job ne pécha pas par ses lèvres
  rationale: 'La formulation conserve l’image corporelle de l’hébreu et laisse intacte la précision narrative : le jugement porte expressément sur les paroles de Job.'
theological_decisions:
- issue: Sens de הָרָע en rapport avec Dieu
  choice: le malheur
  alternative: le mal
  rationale: Le contraste porte ici sur les circonstances favorables et défavorables reçues de Dieu. « Le malheur » évite de faire dire au texte, plus explicitement qu’il ne le fait, que Dieu serait l’auteur du mal moral, tandis que la note conserve l’autre rendu lexical possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue reste direct, et l’expression « par ses lèvres » est volontairement conservée pour respecter la portée précise de l’évaluation narrative.
