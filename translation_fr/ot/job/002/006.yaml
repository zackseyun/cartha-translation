  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל הַ/שָּׂטָ֖ן הִנּ֣/וֹ בְ/יָדֶ֑/ךָ אַ֖ךְ אֶת נַפְשׁ֥/וֹ שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/006.yaml
  text: And the LORD said to the Accuser, “Look, he is in your hand; only spare his life.”
translation:
  language: fr
  text: 'Le SEIGNEUR dit à l’Accusateur : « Le voici en ton pouvoir ; seulement, épargne sa vie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française courante, avec les petites capitales représentées ici par des capitales.
- source_word: הַשָּׂטָן
  choice: l’Accusateur
  rationale: Dans le prologue de Job, le terme hébreu avec article désigne une fonction d’accusation ; ce rendu conserve cette valeur plutôt que d’en faire directement un nom propre.
- source_word: הִנּוֹ
  choice: Le voici
  rationale: Expression déictique naturelle en français, qui attire l’attention sur la concession divine.
- source_word: בְיָדֶךָ
  choice: en ton pouvoir
  rationale: Rend naturellement l’idiome hébreu « dans ta main », qui exprime ici l’autorité ou la maîtrise accordée.
- source_word: נַפְשׁוֹ
  choice: sa vie
  rationale: Dans ce contexte, נֶפֶשׁ désigne la vie de Job, et non une « âme » conçue de manière abstraite.
- source_word: שְׁמֹר
  choice: épargne
  rationale: Bien que le verbe signifie littéralement « garde/préserve », l’ordre impose ici de ne pas ôter la vie de Job ; « épargne » l’exprime clairement et dignement.
theological_decisions:
- issue: Statut de הַשָּׂטָן
  choice: l’Accusateur
  alternative: Satan
  rationale: L’article défini et le cadre narratif favorisent le titre fonctionnel, sans trancher au-delà de ce que dit le texte l’identification théologique du personnage.
- issue: Étendue de la permission divine
  choice: « en ton pouvoir ; seulement, épargne sa vie »
  alternative: « dans ta main ; mais garde son être »
  rationale: La traduction maintient ensemble la permission réelle accordée à l’Accusateur et la limite explicite posée par le SEIGNEUR.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise comme l’hébreu. « Le voici » conserve l’effet de הִנּוֹ, tandis que « en ton pouvoir » et « épargne sa vie » rendent naturellement les idiomes hébreux.
