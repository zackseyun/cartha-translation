  text: וַ/יֵּשְׁב֤וּ אִתּ/וֹ֙ לָ/אָ֔רֶץ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת לֵיל֑וֹת וְ/אֵין דֹּבֵ֤ר אֵלָי/ו֙ דָּבָ֔ר כִּ֣י רָא֔וּ כִּֽי גָדַ֥ל הַ/כְּאֵ֖ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/013.yaml
  text: And they sat with him on the ground seven days and seven nights[a], and no one spoke a word to him, because they saw that his pain was very great.
translation:
  language: fr
  text: Ils restèrent assis avec lui par terre pendant sept jours et sept nuits, et personne ne lui adressa la parole, car ils virent que sa douleur était extrêmement grande.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa souffrance était extrêmement grande » ou « son chagrin était extrêmement grand ». Le terme hébreu peut désigner largement la douleur, y compris la souffrance physique et l’angoisse intérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ אִתּוֹ לָאָרֶץ
  choice: Ils restèrent assis avec lui par terre
  rationale: Le verbe ישׁב exprime ici concrètement la position assise, tout en pouvant suggérer sa durée. « Restèrent assis » rend naturellement les deux nuances dans cette scène de deuil; לָאָרֶץ désigne le sol.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת לֵילוֹת
  choice: pendant sept jours et sept nuits
  rationale: La formulation conserve l’expression temporelle complète; « pendant » explicite naturellement la durée en français.
- source_word: וְאֵין דֹּבֵר אֵלָיו דָּבָר
  choice: et personne ne lui adressa la parole
  rationale: Cette tournure française idiomatique exprime le silence absolu envers Job, correspondant à la construction hébraïque « aucun ne lui parlait une parole ».
- source_word: כִּי רָאוּ
  choice: car ils voyaient
  rationale: כִּי introduit ici la raison de leur silence. L’imparfait convient à la perception qui accompagne la scène prolongée.
- source_word: כִּי גָדַל הַכְּאֵב מְאֹד
  choice: que sa douleur était extrêmement grande
  rationale: כְּאֵב désigne largement la douleur ou la souffrance, physique aussi bien qu’intérieure. « Sa » indique naturellement le référent contextuel, et « extrêmement grande » rend la combinaison de גָדַל et מְאֹד sans atténuer son intensité.
