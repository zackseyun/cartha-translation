base_translation:
  language: en
  yaml_path: translation/ot/job/002/009.yaml
  text: Then his wife said to him[a], “Are you still holding fast to your integrity? Bless God and die.”
translation:
  language: fr
  text: 'Alors sa femme lui dit : « Tu restes encore ferme dans ton intégrité ? Bénis[a] Dieu et meurs ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu signifie littéralement « bénis ». Beaucoup y voient ici un euphémisme révérenciel signifiant « maudis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לוֹ אִשְׁתּוֹ
  choice: Alors sa femme lui dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement la succession, tandis que le présent narratif convient au français moderne.
- source_word: עֹדְךָ
  choice: Tu… encore
  rationale: L’adverbe avec suffixe de deuxième personne marque la persistance ; la question directe rend le reproche implicite.
- source_word: מַחֲזִיק
  choice: tiens
  rationale: Le participe de חזק indique ici que Job continue à maintenir fermement quelque chose ; avec « à », « tenir à » rend naturellement cette persévérance.
- source_word: בְּתֻמָּתֶךָ
  choice: à ton intégrité
  rationale: תֻּמָּה peut désigner l’intégrité, l’innocence ou la conduite irréprochable. « Intégrité » préserve la portée morale sans suggérer une perfection absolue.
- source_word: בָּרֵךְ
  choice: Bénis
  rationale: Le verbe hébreu signifie formellement « bénir ». Le texte principal conserve cette forme explicite, tandis que le sens euphémique probable est signalé en note.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom est le titre divin אֱלֹהִים, rendu normalement par « Dieu ».
- source_word: וָמֻת
  choice: et meurs
  rationale: La coordination de deux impératifs est conservée, ainsi que la brièveté brutale de la formule.
theological_decisions:
- issue: Emploi euphémique de « bénir » à propos de Dieu
  choice: Conserver « Bénis Dieu et meurs » dans le texte principal, avec une note indiquant le sens probable « Maudis Dieu et meurs ».
  alternative: 'Traduire directement : « Maudis Dieu et meurs. »'
  rationale: L’hébreu porte explicitement ברך, « bénir », mais le contexte conduit beaucoup à y reconnaître un euphémisme révérenciel pour « maudire ». Maintenir la formulation source dans le texte et expliquer l’autre sens en note préserve la tension lexicale sans la résoudre silencieusement.
translation_notes:
  register: Français international moderne, direct et digne. Le présent narratif donne une lecture naturelle ; la question brève et les impératifs conservent le ton dur de la scène.
