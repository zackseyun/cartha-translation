  text: And he took a potsherd to scrape himself with while he was sitting among the ashes[a][b].
translation:
  language: fr
  text: Il prit un tesson pour se gratter, tandis qu’il était assis au milieu des cendres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « pour se racler » : le verbe hébreu peut aussi évoquer une action de raclement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח לוֹ
  choice: Il prit
  rationale: Le wayyiqtol fait progresser le récit. Le pronom datif לוֹ n’a pas besoin d’être rendu explicitement en français, où « il prit » exprime naturellement l’action sans la tournure pesante « prit pour lui-même ».
- source_word: חֶרֶשׂ
  choice: un morceau de poterie
  rationale: Le nom désigne ici un fragment de terre cuite. « Morceau de poterie » est précis, courant et immédiatement compréhensible en français moderne.
- source_word: לְהִתְגָּרֵד בּוֹ
  choice: pour se gratter avec
  rationale: La forme réfléchie indique que Job exerce l’action sur lui-même, et בּוֹ présente le morceau de poterie comme instrument. « Se gratter » conserve le sens direct du verbe sans préciser indûment la force du geste.
- source_word: וְהוּא יֹשֵׁב
  choice: tandis qu’il était assis
  rationale: La proposition décrit une situation concomitante à l’action principale; cette tournure la rend naturellement en français.
- source_word: בְּתוֹךְ הָאֵפֶר
  choice: au milieu des cendres
  rationale: Cette expression rend directement בְּתוֹךְ, « au milieu de », et conserve l’image du texte sans transformer les cendres en un « tas » que l’hébreu ne nomme pas explicitement.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Morceau de poterie » évite le terme plus rare « tesson », tandis que la note préserve l’ambiguïté du geste exprimé par le verbe hébreu.
