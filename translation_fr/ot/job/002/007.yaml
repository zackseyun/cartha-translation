base_translation:
  language: en
  yaml_path: translation/ot/job/002/007.yaml
  text: So the Adversary went out from the presence of Yahweh and struck Job with painful sores from the sole of his foot to the crown of his head[a][b].
translation:
  language: fr
  text: L’Adversaire sortit donc de la présence de Yahweh et frappa Job de plaies douloureuses, de la plante du pied au sommet de la tête[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : ha-satan, « l’adversaire » ; traditionnellement : « Satan ». Le terme est précédé de l’article et peut fonctionner comme un titre.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « de furoncles douloureux » ou « d’ulcères graves ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: l’Accusateur
  rationale: L’article hébreu indique ici vraisemblablement un titre ou une fonction. « L’Accusateur » restitue ce rôle sans imposer d’emblée l’emploi ultérieur de « Satan » comme nom propre.
- source_word: מֵאֵת פְּנֵי יְהוָה
  choice: de devant Yahweh
  rationale: La tournure hébraïque signifie littéralement sortir de devant la face ou la présence de Yahweh. « De devant Yahweh » reste naturel en français et conserve l’image spatiale du récit.
- source_word: וַיַּךְ
  choice: frappa
  rationale: Le verbe נכה exprime directement l’action de frapper. Ce choix moderne conserve la force du texte sans recourir à une formulation archaïque.
- source_word: בִּשְׁחִין רָע
  choice: d’ulcères douloureux
  rationale: שְׁחִין désigne une affection cutanée inflammatoire, telle que des ulcères ou des furoncles; רָע en souligne ici le caractère pénible ou grave plutôt qu’une qualité morale.
- source_word: מִכַּף רַגְלוֹ
  choice: depuis la plante des pieds
  rationale: כַּף appliqué au pied désigne sa plante. Le pluriel idiomatique français évoque naturellement toute la partie inférieure des pieds, sans modifier la portée du mérisme.
- source_word: עַד קָדְקֳדוֹ
  choice: jusqu’au sommet de la tête
  rationale: קָדְקֹד désigne le sommet ou le haut de la tête. Cette formulation claire conserve l’idée d’une atteinte couvrant tout le corps.
theological_decisions:
- issue: Traduction de הַשָּׂטָן dans le prologue de Job
  choice: l’Accusateur
  alternative: Satan; le Satan
  rationale: La présence de l’article favorise la compréhension d’un titre ou d’une fonction dans ce contexte. La traduction retenue préserve cette nuance, tandis que la forme traditionnelle est signalée en note.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Nature précise de l’affection בִּשְׁחִין רָע
  choice: ulcères douloureux
  alternative: furoncles douloureux; ulcères graves
  rationale: Le terme désigne une affection cutanée sans permettre un diagnostic médical absolument précis. Le texte principal reste intelligible, et la note préserve les principales possibilités lexicales.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la progression narrative directe de l’hébreu. « Se retira de devant » évite une expression française lourde comme « sortit de la présence de », tandis que les notes rendent visibles les ambiguïtés lexicales et théologiques.
