  text: At night my bones are pierced in me[b][a], and my gnawing pains do not lie down.
translation:
  language: fr
  text: La nuit, mes os sont transpercés au-dedans de moi[a], et mes veines[b] ne connaissent aucun repos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu est difficile; littéralement, la dernière expression pourrait se comprendre « de dessus moi » ou « loin de moi ». Certains comprennent plus généralement l’ensemble comme exprimant que quelque chose « me ronge ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu est rare et peut désigner des veines, des tendons, des nerfs ou d’autres cordons ou canaux du corps; certains le comprennent ici, par extension, comme des douleurs qui rongent.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה
  choice: La nuit
  rationale: Rend naturellement en français la valeur temporelle adverbiale du nom.
- source_word: עֲצָמַי
  choice: mes os
  rationale: Conserve l’image corporelle concrète du texte hébreu.
- source_word: נִקַּר
  choice: sont transpercés
  rationale: Le verbe נקר évoque l’action de percer ou de forer; « transpercés » maintient la violence de l’image sans l’atténuer en simple douleur.
- source_word: מֵעָלָי
  choice: en moi
  rationale: La tournure hébraïque, littéralement difficile (« de dessus moi »), décrit ici l’affliction corporelle; « en moi » préserve l’intériorité sans prétendre lever entièrement l’obscurité.
- source_word: וְעֹרְקַי
  choice: mes nerfs
  rationale: Le nom rare semble désigner des cordons ou canaux du corps. « Nerfs » est concret, compréhensible et permet d’éviter de transformer directement le terme anatomique incertain en « douleurs ».
- source_word: לֹא יִשְׁכָּבוּן
  choice: ne connaissent aucun repos
  rationale: Rend idiomatiquement l’expression littérale « ne se couchent pas » tout en conservant l’idée d’une souffrance corporelle incessante.
