  text: תִּשָּׂאֵ֣/נִי אֶל ר֭וּחַ תַּרְכִּיבֵ֑/נִי וּ֝/תְמֹגְגֵ֗/נִי תשוה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/022.yaml
  text: You lift me up to the wind[a]; you make me ride on it[b], and you toss me about in the storm.
translation:
  language: fr
  text: Tu me soulèves dans le vent[a], tu me fais chevaucher le vent, et tu me fais fondre dans la tempête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu me soulèves vers le vent » ou « sur le vent ».'
    reason: La préposition אֶל peut indiquer le mouvement vers le vent; dans ce contexte, elle peut aussi être comprise dans l’image d’être porté sur lui.
  - marker: b
    text: Le dernier mot hébreu est difficile et son sens est incertain. Il peut évoquer une tempête, un fracas violent ou la ruine. Le verbe précédent peut aussi se traduire par « tu me dissous » ou « tu me fais fondre jusqu’à la ruine ».
    reason: La forme תשוה est textuellement et lexicalement incertaine; וּתְמֹגְגֵנִי appartient au champ de « fondre, se dissoudre ».
lexical_decisions:
- source_word: תִּשָּׂאֵנִי
  choice: Tu me soulèves
  rationale: Le verbe נשׂא signifie « lever, porter, emporter ». « Tu me soulèves » conserve l’image concrète et la deuxième personne adressée à Dieu, tout en laissant entendre que Job est arraché et entraîné par une force violente.
- source_word: אֶל רוּחַ
  choice: dans le vent
  rationale: רוּחַ peut désigner le vent, le souffle ou l’esprit. Le contexte de violence météorologique favorise nettement « vent ». « Dans le vent » exprime naturellement en français le mouvement indiqué par אֶל sans trancher trop précisément entre direction et position.
- source_word: תַּרְכִּיבֵנִי
  choice: tu me fais le chevaucher
  rationale: La forme causative de רכב signifie « faire monter » ou « faire chevaucher ». Le pronom « le » reprend explicitement le vent, complément implicite en hébreu, et préserve l’image poétique inhabituelle.
- source_word: וּתְמֹגְגֵנִי
  choice: puis tu me désagrèges
  rationale: מוג exprime l’idée de fondre, se dissoudre, défaillir ou se désagréger. « Tu me désagrèges » rend avec force le sentiment de Job d’être défait sous l’assaut divin, sans remplacer ce verbe par la seule idée d’être ballotté.
- source_word: תשוה
  choice: dans le fracas de la tempête
  rationale: La forme finale du texte massorétique est très difficile. Une compréhension contextuelle la rattache à un fracas destructeur ou à la tempête. Cette formulation maintient l’imagerie du vent tout en signalant l’incertitude dans une note.
theological_decisions:
- issue: Dieu est présenté comme l’agent direct de l’épreuve de Job
  choice: 'Conserver partout la deuxième personne active : « tu me soulèves… tu me fais… tu me désagrèges »'
  alternative: Employer des tournures passives ou présenter seulement la tempête comme agent
  rationale: L’hébreu adresse directement ces actions à Dieu. Atténuer cette accusation supprimerait une tension théologique essentielle du discours de Job.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le tutoiement suit l’adresse directe de Job à Dieu. « Chevaucher le vent » conserve l’image audacieuse de l’hébreu; « désagrèges » rend la dissolution sans tonalité technique excessive dans ce contexte poétique.
