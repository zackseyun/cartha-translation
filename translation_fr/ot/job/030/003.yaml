lexical_decisions:
- source_word: בְּחֶסֶר וּבְכָפָן
  choice: par le dénuement et la faim
  rationale: Les prépositions présentent ici la condition ou la cause de leur état. « Dénuement » exprime un manque extrême, tandis que « faim » convient mieux qu’une famine collective dans ce contexte.
- source_word: גַּלְמוּד
  choice: amaigris
  rationale: Cet adjectif rare peut évoquer un état desséché, décharné ou misérable. « Amaigris » rend naturellement en français l’effet physique du dénuement et de la faim, sans exagérer jusqu’à « squelettiques ».
- source_word: הָעֹרְקִים
  choice: ils rongent
  rationale: La forme est rare et son sens est discuté. Dans le contexte de la recherche désespérée de nourriture, « rongent » conserve l’image dure retenue par de nombreuses interprétations, tout en signalant l’incertitude en note.
- source_word: צִיָּה
  choice: la terre aride
  rationale: Le terme désigne un sol sec ou une région desséchée. « Terre aride » garde l’image concrète et s’accorde avec le verbe « rongent ».
- source_word: אֶמֶשׁ
  choice: la nuit
  rationale: Le mot signifie normalement « hier » ou « la nuit dernière », mais peut être compris ici comme une indication nocturne adaptée à la scène poétique. Une note conserve les autres possibilités.
- source_word: שׁוֹאָה וּמְשֹׁאָה
  choice: dans la désolation et les décombres
  rationale: Les deux substantifs étroitement associés intensifient l’image d’un lieu ravagé et inhabitable. « Désolation » décrit son état général, et « décombres » donne au second terme une expression concrète sans effacer le parallélisme.
