  text: Décharnés par le dénuement et la faim[a], ils rongent le sol aride, dans la nuit de la désolation et de la dévastation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Desséchés par le dénuement et la faim ». Le mot hébreu rendu par « décharnés » est rare et peut évoquer ce qui est desséché, émacié ou abandonné.'
    reason: lexical_alternative
  - marker: b
