  text: תֵּהָפֵ֣ךְ לְ/אַכְזָ֣ר לִ֑/י בְּ/עֹ֖צֶם יָדְ/ךָ֣ תִשְׂטְמֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/021.yaml
  text: You have turned cruel to me[b][a]; with the might of your hand you oppose me.
translation:
  language: fr
  text: Tu es devenu cruel envers moi[a] ; par la force de ta main, tu t’opposes à moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu es devenu impitoyable envers moi. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu m’attaques » ou « tu me persécutes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּהָפֵךְ
  choice: tu es devenu
  rationale: Le niphal de הפך exprime ici un changement d’état. « Tu es devenu » est naturel en français et n’impose pas une nuance réflexive.
- source_word: לְאַכְזָר
  choice: cruel
  rationale: אַכְזָר désigne ce qui est cruel, impitoyable. L’adjectif « cruel » convient directement comme attribut.
- source_word: לִי
  choice: envers moi
  rationale: La préposition marque ici la relation hostile à l’égard de Job ; « envers moi » est idiomatique sans renforcer excessivement le texte.
- source_word: בְּעֹצֶם
  choice: de toute la force de
  rationale: עֹצֶם évoque la force ou la puissance. Cette tournure française exprime clairement l’idée instrumentale et l’intensité.
- source_word: יָדְךָ
  choice: ta main
  rationale: Le maintien de « main » préserve l’image concrète et anthropomorphique de l’hébreu.
- source_word: תִשְׂטְמֵנִי
  choice: tu m’attaques
  rationale: Le verbe שׂטם exprime une hostilité active. « Tu m’attaques » convient au contexte sans suggérer nécessairement une poursuite prolongée, comme pourrait le faire « persécuter ».
theological_decisions:
- issue: Description anthropomorphique de l’action de Dieu
  choice: Conserver l’accusation directe à la deuxième personne et l’image concrète de « ta main ».
  alternative: 'Atténuer l’anthropomorphisme, par exemple : « ta puissance se dresse contre moi ».'
  rationale: La plainte de Job attribue directement à Dieu une action hostile. La traduction doit préserver cette tension théologique sans l’adoucir.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond à l’adresse directe à Dieu. Le parallélisme poétique et la vigueur de l’accusation sont conservés.
