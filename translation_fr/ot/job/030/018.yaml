  source_fidelity: 'Le sens de l’hébreu est globalement bien rendu : le premier verbe est notoirement difficile et l’image finale est celle d’un vêtement qui serre Job comme l’ouverture de sa tunique. « Sous une grande force » ne rend toutefois pas idiomatiquement בְּרָב כֹּחַ en français ; « Sous l’effet d’une grande force » exprime naturellement la circonstance ou le moyen sans imposer un agent.'
  naturalness: 'La formulation révisée est plus naturelle en français moderne et clarifie la relation syntaxique : c’est le vêtement qui enserre Job, à la manière de l’encolure de sa tunique.'
