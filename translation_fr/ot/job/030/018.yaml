  rationale: La révision remplace une préposition non idiomatique par une expression française naturelle qui préserve l’ambiguïté du moyen ou de la circonstance. Elle rend également explicite, par l’ordre des mots, que « il » renvoie au vêtement, tout en conservant le caractère débattu du premier verbe dans la note.
