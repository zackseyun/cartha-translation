  text: בְּ/רָב כֹּ֭חַ יִתְחַפֵּ֣שׂ לְבוּשִׁ֑/י כְּ/פִ֖י כֻתָּנְתִּ֣/י יַֽאַזְרֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/018.yaml
  text: By great force my garment is disfigured[b][a]; like the collar of my tunic it binds me.
translation:
  language: fr
  text: Sous l’effet d’une grande force, mon vêtement est déformé[a] ; il m’enserre comme l’encolure de ma tunique[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se transforme », « est défiguré » ; peut-être aussi « il saisit mon vêtement ». Le verbe hébreu est difficile. La ligne est généralement comprise comme décrivant l’affliction de Job, qui le déforme ou l’enserre comme un vêtement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la bouche », c’est-à-dire l’ouverture, de ma tunique.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָב כֹּחַ
  choice: Sous une grande force
  rationale: La préposition בְּ peut exprimer ici le moyen ou la circonstance. Cette formulation conserve l’idée d’une force intense agissant sur le vêtement sans préciser explicitement son origine.
- source_word: יִתְחַפֵּשׂ
  choice: se déforme
  rationale: Le hitpael de חפשׂ est difficile dans ce passage. « Se déforme » convient à l’image d’un vêtement altéré par l’affliction tout en évitant de trancher en faveur du sens moins assuré « se déguise » ou de la lecture « il saisit ».
- source_word: לְבוּשִׁי
  choice: mon vêtement
  rationale: Le terme désigne de façon générale une pièce d’habillement ; le singulier français correspond au texte hébreu et prépare le parallèle avec la tunique.
- source_word: כְּפִי
  choice: comme l’encolure de
  rationale: פֶּה signifie littéralement « bouche » et, appliqué à un vêtement, son ouverture. « Encolure » rend naturellement cette image en français.
- source_word: כֻתָּנְתִּי
  choice: ma tunique
  rationale: כֻּתֹּנֶת désigne une tunique ou un vêtement analogue ; « tunique » est précis, courant dans le registre biblique et distinct du terme général précédent.
- source_word: יַאַזְרֵנִי
  choice: il m’enserre
  rationale: Le verbe אזר signifie ceindre ou entourer. « Enserre » exprime ici l’action contraignante du vêtement autour de Job sans recourir à l’archaïsme « ceindre ».
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais accessible. L’image vestimentaire et la difficulté du premier verbe sont conservées ; « encolure » explicite naturellement l’expression hébraïque sans supprimer sa formulation littérale, signalée en note.
