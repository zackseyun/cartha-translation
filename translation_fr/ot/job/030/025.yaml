  text: Did I not weep for the one whose day was hard? Was not my soul grieved for the poor?[a]
translation:
  language: fr
  text: N’ai-je pas pleuré pour celui qui vivait un jour difficile ? Mon âme ne s’est-elle pas attristée pour le pauvre ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour celui qui vivait un jour de détresse » ou « pour celui qui était dans le malheur ». L’hébreu emploie littéralement une expression condensée, « dur de jour ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: N’ai-je pas… ? / ne s’est-elle pas… ?
  rationale: Dans ce contexte, la tournure introduit des questions rhétoriques qui appuient la défense de Job.
- source_word: בָכִיתִי
  choice: pleuré
  rationale: « Pleurer » exprime naturellement l’effusion de larmes tout en gardant la force émotive et poétique du verbe.
- source_word: לִקְשֵׁה יוֹם
  choice: sur celui qui connaissait des jours difficiles
  rationale: Cette formulation française rend l’idée d’une personne éprouvée par un temps de détresse, tout en conservant l’image hébraïque du « jour difficile ».
- source_word: עָגְמָה
  choice: s’est attristée
  rationale: Le verbe évoque la peine ou l’affliction et forme un parallèle naturel avec « pleuré ».
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Ce choix conserve l’expression poétique hébraïque désignant l’être intérieur de Job, sans la réduire à une définition anthropologique technique.
- source_word: לָאֶבְיוֹן
  choice: pour le pauvre
  rationale: אֶבְיוֹן désigne une personne pauvre ou indigente; « le pauvre » est concis, générique et idiomatique en français.
theological_decisions:
- issue: Sens anthropologique de נַפְשִׁי
  choice: « Mon âme » comme expression poétique de l’être intérieur de Job
  alternative: « Ne me suis-je pas attristé » ou « mon être intérieur ne s’est-il pas attristé »
  rationale: La formulation préserve la texture du texte source sans imposer une doctrine technique sur la composition de la personne.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme interrogatif et le langage poétique sont conservés; la première proposition est légèrement explicitée pour être naturelle en français.
