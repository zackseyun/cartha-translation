  text: אַ֣ךְ לֹא בְ֭/עִי יִשְׁלַח יָ֑ד אִם בְּ֝/פִיד֗/וֹ לָהֶ֥ן שֽׁוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/024.yaml
  text: Surely one does not stretch out a hand against a ruin[a], if in his calamity there is a cry for help.
translation:
  language: fr
  text: Assurément, on ne porte pas la main contre un tas de ruines[a], s’il y a, dans sa détresse, un appel au secours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Assurément, on ne tend pas la main vers un monceau de ruines ; si, dans son malheur, il y a un appel au secours. » Le texte hébreu de ce verset est difficile, en particulier le mot rendu par « tas de ruines » et le pronom de la seconde proposition, dont le lien précis reste incertain. Une autre compréhension de ce mot est : « celui qui est ruiné ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Mais
  rationale: Dans le contexte de la plainte de Job, la particule marque vraisemblablement une réserve ou un contraste. « Mais » rend ce mouvement sans imposer la valeur assévérative de « assurément », qui reste possible.
- source_word: בְּעִי
  choice: contre un tas de ruines
  rationale: Le terme est rare et le texte difficile. « Tas de ruines » conserve l’image généralement reconnue, tandis que « contre » donne à l’expression « porter la main » son orientation hostile probable.
- source_word: יִשְׁלַח יָד
  choice: on ne porte pas la main
  rationale: L’expression française « porter la main contre » préserve l’image corporelle et suggère une action hostile sans la réduire explicitement à « frapper » ou « attaquer ».
- source_word: אִם
  choice: si
  rationale: La valeur conditionnelle est conservée afin de ne pas résoudre une syntaxe hébraïque notoirement obscure.
- source_word: בְּפִידוֹ
  choice: dans sa détresse
  rationale: פיד désigne le désastre ou la calamité. « Détresse » s’accorde naturellement avec l’appel au secours tout en gardant l’idée d’une situation accablante.
- source_word: לָהֶן
  choice: — sens non exprimé distinctement dans le texte principal
  rationale: La forme pronominale est très difficile à rattacher dans cette proposition. Plutôt que d’ajouter un référent français incertain (« d’eux », « pour eux »), l’obscurité est signalée en note.
- source_word: שׁוּעַ
  choice: un appel au secours
  rationale: Le nom désigne un cri ou appel lancé dans la détresse; cette formulation est claire et idiomatique en français moderne.
theological_decisions:
- issue: Rapport logique entre les deux membres du verset
  choice: 'Une réserve suivie d’une condition : « Mais… s’il… »'
  alternative: 'Une affirmation assévérative : « Assurément… »; ou une question rhétorique'
  rationale: Le texte hébreu est obscur et ne permet pas de trancher sûrement. La traduction conserve le lien conditionnel marqué par אִם et évite d’introduire une interprétation doctrinale de la souffrance ou de l’intervention divine.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde l’image hébraïque et sa syntaxe conditionnelle autant que possible, tout en signalant en note l’incertitude textuelle et syntaxique majeure.
