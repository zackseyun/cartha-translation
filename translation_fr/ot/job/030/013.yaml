  text: נָתְס֗וּ נְֽתִיבָ֫תִ֥/י לְ/הַוָּתִ֥/י יֹעִ֑ילוּ לֹ֖א עֹזֵ֣ר לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/013.yaml
  text: They tear up my path for my ruin[b][a]; they profit from it—there is no helper for them.
translation:
  language: fr
  text: Ils démolissent mon sentier ; ils favorisent ma ruine[a] — personne ne leur vient en aide[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils sont utiles à ma ruine » ou « ils font avancer ma ruine ». Le verbe hébreu peut signifier être utile, favoriser ou faire avancer quelque chose.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils n’ont personne pour les aider ». La proposition hébraïque est très concise et peut aussi évoquer leur action sans assistance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְסוּ
  choice: démolissent
  rationale: Le verbe exprime l’action d’abattre ou de détruire. « Démolissent » convient concrètement à un sentier que les adversaires rendent impraticable.
- source_word: נְתִיבָתִי
  choice: mon sentier
  rationale: נְתִיבָה désigne un sentier ou une piste ; « mon sentier » conserve l’image sans en expliciter excessivement la portée métaphorique.
- source_word: לְהַוָּתִי
  choice: pour précipiter ma ruine
  rationale: הַוָּה désigne la ruine ou le désastre. Avec le verbe suivant, la formulation française exprime naturellement le fait de contribuer activement à cette ruine.
- source_word: יֹעִילוּ
  choice: précipiter
  rationale: Le hiphil de יעל peut signifier être utile, favoriser ou faire avancer. Ici, son objet est vraisemblablement la ruine de Job ; « précipiter ma ruine » rend ce lien tout en signalant l’ambiguïté en note.
- source_word: לֹא עֹזֵר לָמוֹ
  choice: personne ne les aide
  rationale: Cette proposition nominale concise peut indiquer qu’ils agissent sans aide. La formulation française reste brève et naturelle, tandis que la note conserve l’autre analyse possible.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. L’image concrète du sentier détruit est conservée ; la syntaxe est légèrement resserrée pour rendre naturellement le rapport probable entre יֹעִילוּ et la ruine de Job, sans masquer l’ambiguïté grâce aux notes.
