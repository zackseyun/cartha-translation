  yaml_path: translation/ot/job/030/002.yaml
  text: Even the strength of their hands—what is it to me? Their vigor has perished[a].
translation:
  language: fr
  text: Même la force de leurs mains, à quoi me servirait-elle ? Leur vigueur a disparu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur pleine force a disparu » ; le nom hébreu rare peut désigner l’âge mûr ou la force de l’âge.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Même
  rationale: Rend la valeur additive et emphatique du terme dans le propos méprisant de Job.
- source_word: כֹּחַ יְדֵיהֶם
  choice: la force de leurs mains
  rationale: Conserve l’image concrète des mains tout en exprimant leur capacité physique et leur aptitude au travail.
- source_word: לָמָּה לִּי
  choice: à quoi me servirait-elle ?
  rationale: Expression française naturelle qui restitue la question rhétorique portant sur l’utilité pour Job.
- source_word: עָלֵימוֹ אָבַד
  choice: a disparu
  rationale: Exprime la perte complète indiquée par le verbe, avec une formulation française fluide.
- source_word: כָּלַח
  choice: toute leur vigueur
  rationale: Le nom rare semble désigner la pleine force ou la maturité physique; « vigueur » convient au contexte, tandis que « toute » rend la possible nuance de totalité associée à la forme.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La première proposition conserve l’image hébraïque des mains, tandis que la question idiomatique explicite leur utilité pratique sans atténuer le mépris exprimé. La note maintient l’incertitude liée au nom rare כָּלַח.
