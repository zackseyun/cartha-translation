  text: מֵעַ֖/י רֻתְּח֥וּ וְ/לֹא דָ֗מּוּ קִדְּמֻ֥/נִי יְמֵי עֹֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/027.yaml
  text: My inward parts boil and do not rest[a]; days of affliction confront me.
translation:
  language: fr
  text: Mes entrailles bouillonnent sans répit[a] ; les jours de détresse viennent à ma rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mes entrailles bouillonnent et ne s’apaisent pas ; les jours de misère viennent sur moi. »'
    reason: Alternative lexicale préservant les nuances possibles de דמם, עֹנִי et קדם.
lexical_decisions:
- source_word: מֵעַי
  choice: mes entrailles
  rationale: Le terme désigne littéralement les organes internes et, en poésie, le siège du trouble profond. « Mes entrailles » conserve l’image viscérale dans un français digne et intelligible.
- source_word: רֻתְּחוּ
  choice: bouillonnent
  rationale: Le verbe רתח évoque l’ébullition ou le bouillonnement. « Bouillonnent » restitue vivement l’agitation intérieure et convient naturellement à « entrailles ».
- source_word: וְלֹא דָמּוּ
  choice: sans répit
  rationale: דמם peut exprimer l’immobilité, le silence ou la cessation. « Sans répit » rend ici la continuité de l’agitation sans réduire indûment l’ambiguïté à la seule idée de silence.
- source_word: קִדְּמֻנִי
  choice: viennent à ma rencontre
  rationale: Le verbe קדם peut signifier venir au-devant de quelqu’un ou le rencontrer. Cette formulation préserve la personnification des jours de détresse sans renforcer artificiellement leur hostilité.
- source_word: יְמֵי עֹנִי
  choice: les jours de détresse
  rationale: עֹנִי désigne ici l’affliction ou la misère vécue plutôt que la seule pauvreté matérielle. « Détresse » convient au contexte de lamentation.
theological_decisions: []
