  text: כִּ֤י ט֣וֹב קִ֭וִּיתִי וַ/יָּ֣בֹא רָ֑ע וַֽ/אֲיַחֲלָ֥ה לְ֝/א֗וֹר וַ/יָּ֥בֹא אֹֽפֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/026.yaml
  text: For I hoped for good[a], but evil came; I waited for light, but darkness came.
translation:
  language: fr
  text: Car j’espérais le bonheur, mais le malheur[a] est venu ; j’attendais la lumière, mais l’obscurité est venue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le désastre » ; l’hébreu désigne ici vraisemblablement l’adversité plutôt que le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la plainte de Job et conserve la valeur causale du contexte.
- source_word: טוֹב
  choice: le bonheur
  rationale: L’adjectif substantivé désigne ici ce qui est bon et favorable. « Le bonheur » forme en français un contraste naturel avec « le malheur », sans limiter le sens à la prospérité matérielle.
- source_word: קִוִּיתִי
  choice: j’espérais
  rationale: Exprime une attente confiante ou pleine d’espoir.
- source_word: וַיָּבֹא
  choice: est venu
  rationale: La traduction simple préserve la répétition hébraïque et le renversement saisissant entre l’attente et ce qui survient.
- source_word: רָע
  choice: le malheur
  rationale: Dans cette plainte, le terme désigne l’adversité ou le désastre plutôt que le mal moral. « Le malheur » est naturel en français et maintient l’antithèse avec le bonheur.
- source_word: אֲיַחֲלָה
  choice: j’attendais
  rationale: Rend l’idée d’une attente soutenue, teintée d’espoir, tout en évitant de répéter « j’espérais ».
- source_word: לְאוֹר
  choice: la lumière
  rationale: Conserve l’image hébraïque et ses résonances possibles de soulagement et de salut sans les expliciter dans le texte.
- source_word: אֹפֶל
  choice: l’obscurité
  rationale: Préserve le contraste direct avec la lumière et rend dignement le terme fort désignant les ténèbres ou la profonde obscurité.
theological_decisions:
- issue: Sens de רָע dans la plainte de Job
  choice: le malheur
  alternative: le mal
  rationale: Le contexte indique l’adversité subie, non une qualification morale. Ce choix évite de suggérer que le mal moral serait « venu » à Job, tout en conservant l’opposition au bien-être attendu.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme des deux propositions et la répétition de « est venu » reproduisent la structure et l’effet rhétorique de l’hébreu.
