  text: My skin turns black and falls from me[b][a], and my bones burn with heat.
translation:
  language: fr
  text: Ma peau est devenue noire sur mon corps[a], et mes os brûlent de chaleur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ma peau noircit et se détache de moi. » L’expression hébraïque est ambiguë et peut évoquer une peau noircie qui se détache du corps.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mes os brûlent de fièvre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרִי
  choice: ma peau
  rationale: Dans ce contexte humain, עוֹר désigne naturellement la peau.
- source_word: שָׁחַר
  choice: noircit
  rationale: Le verbe exprime ici le fait de devenir sombre ou noir; « noircit » conserve cette image avec concision.
- source_word: מֵעָלָי
  choice: se détache de moi
  rationale: Littéralement « de dessus moi ». Dans le contexte d’une grave affection cutanée, cette formulation rend la lecture probable d’une peau qui se détache, tout en signalant l’ambiguïté en note.
- source_word: וְעַצְמִי
  choice: et mes os
  rationale: Le singulier morphologique עֶצֶם peut avoir un sens collectif; le pluriel est naturel en français.
- source_word: חָרָה
  choice: brûlent
  rationale: Le verbe évoque ce qui brûle ou s’embrase et préserve ici la force de l’image corporelle.
- source_word: מִנִּי חֹרֶב
  choice: de chaleur
  rationale: חֹרֶב désigne la chaleur ou la sécheresse brûlante. « De chaleur » reste plus proche et moins interprétatif que « de fièvre ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et dignifié. Le parallélisme corporel et l’image vive de la brûlure sont conservés; l’ambiguïté de מֵעָלָי et la possibilité d’une fièvre sont indiquées en notes.
