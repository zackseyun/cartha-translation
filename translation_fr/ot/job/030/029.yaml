  yaml_path: translation/ot/job/030/029.yaml
  text: I have become a brother to jackals[a], and a companion to ostriches.
translation:
  language: fr
  text: 'Je suis devenu le frère des chacals,

    et le compagnon des autruches.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des filles de l’autruche », expression hébraïque désignant les autruches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: frère
  rationale: Le nom signifie littéralement « frère » et exprime ici une association étroite avec les animaux des lieux désolés; conserver la métaphore respecte la force poétique du texte.
- source_word: הָיִיתִי
  choice: je suis devenu
  rationale: Le parfait qal à la première personne décrit naturellement l'état présent résultant du profond changement vécu par Job.
- source_word: לְתַנִּים
  choice: des chacals
  rationale: Dans la poésie biblique et les évocations de lieux désolés, תַנִּים désigne très probablement les chacals; « dragons » relève d'une tradition ancienne moins vraisemblable zoologiquement.
- source_word: וְרֵעַ
  choice: et le compagnon
  rationale: רֵעַ peut désigner un ami, un proche ou un compagnon. « Compagnon » convient au parallélisme avec « frère » sans ajouter une nuance affective excessive.
- source_word: לִבְנוֹת יַעֲנָה
  choice: des autruches
  rationale: L'expression hébraïque signifie littéralement « des filles de l'autruche », mais désigne idiomatiquement les autruches; la formulation naturelle est retenue dans le texte et la forme littérale signalée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme « frère… compagnon » est conservé, ainsi que l'image de l'identification de Job aux animaux associés aux lieux désolés.
