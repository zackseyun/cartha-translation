- from: Assombri[a], je vais çà et là, mais non par le soleil[b] ; je me lève dans l’assemblée et j’appelle au secours.
  to: Je marche assombri[a], mais non à cause du soleil[b] ; je me lève dans l’assemblée et je crie au secours.
