  - severity: medium
    issue: « mais non par le soleil » est peu idiomatique
    rationale: La construction est difficilement naturelle en français moderne. « Mais non à cause du soleil » exprime clairement le contraste causal contextuel, tandis que la note conserve le littéral « sans le soleil ».
  - severity: low
    issue: « j’appelle au secours » est moins direct
    rationale: Le piel de שוע désigne un cri pressant pour obtenir du secours ; « je crie au secours » est l’expression française la plus naturelle et fidèle au registre de lamentation.
