  text: קֹדֵ֣ר הִ֭לַּכְתִּי בְּ/לֹ֣א חַמָּ֑ה קַ֖מְתִּי בַ/קָּהָ֣ל אֲשַׁוֵּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/028.yaml
  text: I go about darkened[a], but not by the sun[b]; I stand up in the assembly and cry for help.
translation:
  language: fr
  text: Je marche assombri[a], mais non à cause du soleil[b] ; je me lève dans l’assemblée et je crie au secours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en deuil » ou « noirci » ; le participe hébreu peut évoquer à la fois le chagrin et une apparence assombrie.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sans le soleil ». Le contexte indique que son état assombri n’est pas dû à l’exposition au soleil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֵר
  choice: Assombri
  rationale: Le participe peut exprimer un aspect sombre ou noirci aussi bien que le deuil. « Assombri » conserve cette pluralité sans réduire le terme à l’apparence physique ni au seul chagrin.
- source_word: הִלַּכְתִּי
  choice: je vais çà et là
  rationale: Dans ce discours poétique, le parfait décrit vivement la conduite ou l’état durable de Job. Le présent français et « çà et là » rendent ce mouvement continu avec naturel.
- source_word: בְּלֹא חַמָּה
  choice: mais non par le soleil
  rationale: 'La formulation reste proche de l’expression hébraïque, littéralement « sans/non par le soleil », tout en faisant ressortir le contraste : l’état sombre de Job ne vient pas du soleil.'
- source_word: קַמְתִּי
  choice: je me lève
  rationale: Le verbe introduit l’action publique de Job au milieu du groupe. Le présent convient au caractère vivant de la lamentation.
- source_word: בַקָּהָל
  choice: dans l’assemblée
  rationale: « Assemblée » désigne clairement un groupe réuni sans imposer une connotation ecclésiale ultérieure.
- source_word: אֲשַׁוֵּעַ
  choice: j’appelle au secours
  rationale: Le piel de שׁוע exprime un cri pressant pour obtenir de l’aide. Cette formulation française en rend explicitement la détresse.
