source:
  edition: WLC
  text: אֲשַׁוַּ֣ע אֵ֭לֶי/ךָ וְ/לֹ֣א תַעֲנֵ֑/נִי עָ֝מַ֗דְתִּי וַ/תִּתְבֹּ֥נֶן בִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/020.yaml
  text: I cry out to you[a], but you do not answer me; I stand, and you only look at me.
translation:
  language: fr
  text: Je crie vers toi, mais tu ne me réponds pas ; je me tiens debout[a], et tu me regardes attentivement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je me suis tenu debout, et tu m’as observé attentivement ». Les formes hébraïques peuvent être comprises au passé ; le dernier verbe peut évoquer un regard attentif ou le fait de considérer quelqu’un.'
    reason: Ambiguïté temporelle et nuance lexicale.
lexical_decisions:
- source_word: אֲשַׁוַּע
  choice: Je crie
  rationale: Le piel de שׁוע exprime un cri pressant, souvent un appel au secours. « Je crie » en conserve l’intensité sans préciser au-delà du texte la nature de la demande.
- source_word: אֵלֶיךָ
  choice: vers toi
  rationale: La préposition אֶל indique ici la personne vers laquelle le cri est dirigé. « Vers toi » est naturel en français et garde ce mouvement d’appel.
- source_word: וְלֹא תַעֲנֵנִי
  choice: mais tu ne me réponds pas
  rationale: Le verbe ענה signifie couramment « répondre ». « Mais » rend naturellement le contraste porté par וְ entre le cri de Job et l’absence de réponse.
- source_word: עָמַדְתִּי
  choice: je me tiens debout
  rationale: Bien que la forme soit un accompli, le contexte poétique permet un présent de situation, coordonné à la plainte en cours. « Se tenir debout » rend plus précisément עמד que le simple « rester ».
- source_word: וַתִּתְבֹּנֶן בִּי
  choice: et tu me regardes attentivement
  rationale: התבונן peut désigner le fait d’observer avec attention ou de considérer. Cette formulation conserve la nuance d’un regard soutenu sans ajouter explicitement « seulement », absent de l’hébreu.
theological_decisions:
- issue: Intensité à donner à l’absence de réponse divine
  choice: Exprimer que Dieu ne répond pas et regarde attentivement Job, sans ajouter qu’il l’ignore ou refuse de le sauver
  alternative: « Tu m’ignores » ou « tu ne me sauves pas »
  rationale: L’hébreu affirme l’absence de réponse et le regard de Dieu, mais ne qualifie pas explicitement ce regard d’indifférence ni ne mentionne directement le salut. La traduction maintient ainsi la tension de la plainte.
- issue: Valeur temporelle de עָמַדְתִּי et וַתִּתְבֹּנֶן
  choice: Employer un présent poétique, tout en signalant en note la lecture passée possible
  alternative: « Je me suis tenu debout, et tu m’as observé attentivement »
  rationale: Les formes verbales peuvent recevoir une lecture passée, mais le présent s’intègre naturellement à la plainte actuelle commencée par « Je crie » et « tu ne me réponds pas ». La note préserve l’ambiguïté temporelle réelle.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du parallélisme hébreu, tandis que « tu me regardes attentivement » évite l’ajout interprétatif de « tu ne fais que me regarder ».
