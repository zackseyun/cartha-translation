  text: וְ/עַתָּ֗ה עָ֭לַ/י תִּשְׁתַּפֵּ֣ךְ נַפְשִׁ֑/י יֹ֭אחֲז֣וּ/נִי יְמֵי עֹֽנִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/016.yaml
  text: And now my soul is poured out within me[a]; days of affliction seize me.
translation:
  language: fr
  text: Et maintenant, mon âme se répand sur moi[a] ; les jours de détresse me saisissent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mon âme se répand au-dedans de moi ». La préposition hébraïque signifie littéralement « sur moi », mais l’expression peut décrire un effondrement intérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec ce qui précède et le repère temporel, sans rendre explicitement adversatif un connecteur qui ne l’est pas nécessairement.
- source_word: עָלַי
  choice: sur moi
  rationale: Reproduit la préposition hébraïque עַל de manière formelle et préserve l’image poétique inhabituelle ainsi que son ambiguïté.
- source_word: תִּשְׁתַּפֵּךְ
  choice: se répand
  rationale: Le hitpael de שפך présente l’âme comme se déversant ou s’épuisant elle-même. « Se répand » maintient la métaphore sans la remplacer par une interprétation telle que « défaille ».
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Dans ce contexte poétique, נפש désigne la personne intérieure, le souffle vital ou le moi souffrant. « Mon âme » conserve cette profondeur et s’accorde naturellement avec l’image du déversement.
- source_word: יֹאחֲזוּנִי
  choice: me saisissent
  rationale: Rend directement אחז, « saisir, empoigner », avec la force poétique de jours de souffrance personnifiés.
- source_word: יְמֵי
  choice: les jours de
  rationale: Le construit hébreu est naturellement rendu en français par « les jours de », l’article défini convenant à l’expérience présente qui s’empare de Job.
- source_word: עֹנִי
  choice: détresse
  rationale: עֹנִי peut désigner l’affliction, la misère ou l’abaissement. « Détresse » exprime ici la souffrance profonde sans limiter le sens à la pauvreté matérielle.
