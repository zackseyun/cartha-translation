  yaml_path: translation/ot/job/030/012.yaml
  text: On my right, a brood rises up[a]; they send my feet away[c][b], and they build up against me their paths of disaster.
translation:
  language: fr
  text: À ma droite, une bande se dresse[a] ; ils font reculer mes pieds[b] et aménagent contre moi leurs voies de malheur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une racaille se dresse ». Le mot hébreu פִּרְחַח est rare et désigne un groupe méprisable ou indiscipliné.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils envoient au loin mes pieds ». Le sens peut être qu’ils chassent Job, détournent ses pas ou lui font perdre pied.'
    reason: lexical_alternative
  - marker: c
    text: Ou « ils élèvent contre moi leurs routes de calamité ». L’hébreu conserve ici, dans un sens hostile, l’image de voies que l’on aménage.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָמִין
  choice: À ma droite
  rationale: Expression spatiale qui conserve l’image hébraïque d’adversaires prenant position du côté droit de Job.
- source_word: פִּרְחַח
  choice: une bande
  rationale: Ce terme rare désigne collectivement un groupe méprisable ou indiscipliné. « Une bande » est naturel en français et garde la nuance dépréciative sans préciser indûment l’âge.
- source_word: יָקוּמוּ
  choice: se lève
  rationale: קום évoque ici le fait de se dresser avec hostilité ; le singulier s’accorde naturellement avec le collectif « bande ».
- source_word: רַגְלַי שִׁלֵּחוּ
  choice: ils chassent mes pieds
  rationale: Littéralement, « ils envoient/repoussent mes pieds ». La formulation française préserve l’image inhabituelle et suggère que Job est délogé ou privé de son appui, sans choisir définitivement entre ces nuances.
- source_word: וַיָּסֹלּוּ
  choice: fraient
  rationale: Le verbe סלל désigne l’action d’aménager ou de construire une voie. « Fraient » maintient la métaphore routière dans une formulation française concise.
- source_word: עָלַי
  choice: contre moi
  rationale: Le contexte hostile donne à la préposition une valeur adversative.
- source_word: אָרְחוֹת אֵידָם
  choice: leurs chemins de malheur
  rationale: « Chemins » rend la métaphore de אֹרַח, et « malheur » exprime אֵיד, catastrophe ou ruine. Le possessif traduit le suffixe hébreu de troisième personne du pluriel.
theological_decisions: []
