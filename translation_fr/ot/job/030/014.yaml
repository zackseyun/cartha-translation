  text: כְּ/פֶ֣רֶץ רָחָ֣ב יֶאֱתָ֑יוּ תַּ֥חַת שֹׁ֝אָ֗ה הִתְגַּלְגָּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/014.yaml
  text: Like a wide breach they come[a]; amid the crash they roll on.
translation:
  language: fr
  text: Comme par une large brèche, ils arrivent[a] ; sous l’effondrement, ils roulent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme une large brèche, ils arrivent ; au milieu de la dévastation, ils roulent en avant. »'
    reason: La construction de la comparaison, la portée de תַּחַת et la nuance réflexive ou dynamique du hitpael permettent ces rendus alternatifs sans trancher une syntaxe discutée.
lexical_decisions:
- source_word: כְּ/פֶרֶץ רָחָב
  choice: Comme par une large brèche
  rationale: פֶרֶץ désigne une brèche ou une ouverture produite par une rupture, et רָחָב en souligne l’ampleur. « Comme par » conserve à la fois la comparaison marquée par כְּ et la lecture possible d’une irruption à travers une brèche.
- source_word: יֶאֱתָיוּ
  choice: ils arrivent
  rationale: Le verbe exprime ici leur venue ou leur avancée. « Ils arrivent » reste simple, vif et peu interprétatif.
- source_word: תַּחַת שֹׁאָה
  choice: au milieu du fracas
  rationale: תַּחַת signifie normalement « sous », mais peut situer l’action dans les circonstances du désastre. שֹׁאָה évoque une catastrophe, une dévastation ou un effondrement retentissant ; « fracas » maintient ici le caractère soudain et dynamique de la scène.
- source_word: הִתְגַּלְגָּלוּ
  choice: ils déferlent
  rationale: Le hitpael de גלל décrit littéralement un mouvement de roulement ou de culbute. « Ils déferlent » rend naturellement en français l’élan collectif, roulant et irrésistible, sans imposer l’image maladroite de personnes qui « se roulent ».
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. L’image militaire ou destructrice de la brèche est conservée, tandis que « déferlent » restitue avec naturel le mouvement collectif suggéré par le verbe hébreu.
