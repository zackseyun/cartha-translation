  text: הָהְפַּ֥ךְ עָלַ֗/י בַּלָּ֫ה֥וֹת תִּרְדֹּ֣ף כָּ֭/רוּחַ נְדִבָתִ֑/י וּ֝/כְ/עָ֗ב עָבְרָ֥ה יְשֻׁעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/015.yaml
  text: Terrors are turned upon me[a]; they pursue my nobility like the wind[b], and my salvation passes away like a cloud.
translation:
  language: fr
  text: Des terreurs se sont retournées contre moi ; elles poursuivent mon honneur comme le vent, et mon salut a disparu comme un nuage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Mon honneur » peut aussi se traduire par « ma dignité », « ma noblesse » ou « ma prospérité » ; « mon salut », par « ma délivrance » ou « mon bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהְפַּךְ עָלַי בַּלָּהוֹת
  choice: Des terreurs se sont retournées contre moi
  rationale: Le hofal de הפך exprime ici un retournement subi ou résultant. Le passé composé rend naturellement en français l’état provoqué, tandis que « des terreurs » conserve la force de בלהות.
- source_word: תִּרְדֹּף
  choice: elles pourchassent
  rationale: רדף signifie poursuivre ou pourchasser. Le féminin singulier hébreu peut reprendre collectivement « terreurs » ; le pluriel français donne une reprise naturelle.
- source_word: נְדִבָתִי
  choice: mon honneur
  rationale: Le terme difficile peut désigner noblesse, dignité, honneur ou condition élevée. Dans la plainte de Job sur la perte de son rang, « mon honneur » est idiomatique et garde l’idée de considération honorable sans lui attribuer une noblesse héréditaire.
- source_word: כָּרוּחַ
  choice: comme le vent
  rationale: רוּחַ désigne ici vraisemblablement le vent. La comparaison évoque soit la poursuite, soit la rapide dispersion ; le français conserve cette ambiguïté syntaxique.
- source_word: וּכְעָב עָבְרָה
  choice: s’évanouit comme un nuage
  rationale: עבר peut exprimer le fait de passer ou de disparaître. « S’évanouit » rend la disparition imagée et s’accorde avec la comparaison au nuage.
- source_word: יְשֻׁעָתִי
  choice: mon salut
  rationale: ישועה signifie salut, délivrance ou bien-être. « Mon salut » maintient la correspondance lexicale, tandis que la note empêche une lecture doctrinale trop étroite.
theological_decisions:
- issue: Portée de יְשֻׁעָתִי
  choice: mon salut
  alternative: ma délivrance ; mon bien-être
  rationale: Dans ce contexte, le mot peut viser le secours attendu ou la prospérité de Job plutôt qu’un concept sotériologique ultérieur. Le texte garde « salut » et la note signale l’étendue du sens.
- issue: Sens de נְדִבָתִי
  choice: mon honneur
  alternative: ma dignité ; ma noblesse ; ma prospérité
  rationale: Le terme est rare et son sens précis demeure discuté. « Honneur » convient au contexte de la déchéance sociale de Job, sans exclure les autres nuances, données en note.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le rythme ternaire du verset est préservé, ainsi que les images du vent et du nuage. La ponctuation laisse « comme le vent » susceptible de caractériser la poursuite ou la disparition de l’honneur.
