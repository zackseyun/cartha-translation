source:
  edition: WLC
  text: הֹרָ֥/נִי לַ/חֹ֑מֶר וָ֝/אֶתְמַשֵּׁ֗ל כֶּ/עָפָ֥ר וָ/אֵֽפֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/019.yaml
  text: He has thrown me into the mire[b][a], and I have become like dust and ashes.
translation:
  language: fr
  text: Il m’a jeté dans la boue[a], et je suis devenu[b] semblable à la poussière et à la cendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’argile » ou « dans la glaise ». Le mot hébreu חֹמֶר peut désigner l’argile, la glaise ou la boue; ici, le contexte favorise l’image humiliante de quelqu’un jeté dans la boue.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « j’ai été rendu semblable »; autre possibilité : « je suis comparé à la poussière et à la cendre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֹרָנִי
  choice: Il m’a jeté
  rationale: La forme verbale hiphil avec suffixe de première personne exprime ici l’action énergique de jeter ou précipiter quelqu’un. « Il m’a jeté » est naturel en français et garde la force de l’image; le sujet masculin singulier implicite renvoie à Dieu dans le contexte.
- source_word: לַחֹמֶר
  choice: dans la boue
  rationale: חֹמֶר peut désigner l’argile, la glaise ou la boue. Dans cette plainte, « la boue » rend clairement l’image d’abaissement tout en restant courant en français moderne.
- source_word: וָאֶתְמַשֵּׁל
  choice: je suis devenu semblable
  rationale: La forme exprime un état résultant pouvant se comprendre comme « devenir semblable » ou « être rendu comparable ». Le choix retenu est idiomatique sans effacer la valeur comparative introduite par כְּ.
- source_word: כֶּעָפָר
  choice: semblable à la poussière
  rationale: עָפָר signifie « poussière » et évoque ici l’abaissement, la fragilité et la mortalité. La tournure conserve explicitement la comparaison.
- source_word: וָאֵפֶר
  choice: et à la cendre
  rationale: אֵפֶר désigne la cendre. Le singulier collectif est l’expression française naturelle dans l’association biblique « la poussière et la cendre ».
theological_decisions:
- issue: Sujet implicite du verbe à la troisième personne du masculin singulier
  choice: Employer « Il », qui renvoie à Dieu dans le contexte
  alternative: Adopter une formulation impersonnelle ou passive qui ne nomme pas le sujet, par exemple « On m’a jeté »
  rationale: Le contexte du discours de Job identifie Dieu comme le sujet implicite. Le pronom français rend nécessairement explicite ce que la forme verbale hébraïque et le contexte indiquent, sans ajouter de qualification doctrinale.
- issue: Valeur de וָאֶתְמַשֵּׁל
  choice: « je suis devenu semblable »
  alternative: « j’ai été rendu semblable » ou « je suis comparé »
  rationale: La forme peut recevoir une nuance résultative ou passive. La traduction principale exprime le nouvel état de Job, tandis que la note conserve l’autre analyse possible.
translation_notes:
  register: Français international moderne, sobre et digne. « Boue » est plus courant que « bourbier » et convient au registre de la plainte. La répétition de l’article et de la préposition dans « à la poussière et à la cendre » assure une formulation française naturelle tout en préservant les deux images hébraïques.
