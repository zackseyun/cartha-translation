  text: בְּֽנֵי נָ֭בָל גַּם בְּנֵ֣י בְלִי שֵׁ֑ם נִ֝כְּא֗וּ מִן הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/008.yaml
  text: Sons of fools[a], indeed sons without a name[c][b], they were scourged from the land.
translation:
  language: fr
  text: Fils d’insensés, oui, fils sans nom[a], ils ont été chassés du pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « fils sans nom » : des hommes sans considération ni honneur social.'
    reason: cultural_note
  - marker: b
    text: Le verbe hébreu est rare. Il peut aussi évoquer le fait d’être frappé ou battu; ici, le contexte favorise l’idée d’être chassé du pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נָבָל
  choice: Fils d’insensés
  rationale: « Fils de » conserve l’expression hébraïque d’appartenance à une catégorie. « Insensés » rend la portée morale et sociale de נָבָל, et non un simple manque d’intelligence.
- source_word: גַּם
  choice: oui
  rationale: Dans cette apposition, גַּם renforce la seconde désignation. « Oui » restitue sobrement cette insistance en français courant.
- source_word: בְּנֵי בְלִי שֵׁם
  choice: fils sans nom
  rationale: La formulation garde l’image hébraïque tout en restant intelligible; elle désigne des hommes dépourvus de considération et d’honneur social.
- source_word: נִכְּאוּ
  choice: ils ont été chassés
  rationale: Le verbe rare peut évoquer des coups ou une expulsion. Avec מִן הָאָרֶץ et dans le contexte, l’idée d’avoir été chassés paraît la plus probable, sans dissimuler l’incertitude dans la note.
- source_word: מִן הָאָרֶץ
  choice: du pays
  rationale: Dans ce contexte social, הָאָרֶץ désigne plus naturellement le pays ou territoire habité que la terre au sens cosmique.
theological_decisions: []
