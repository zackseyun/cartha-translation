source:
  edition: WLC
  text: וְ/עַתָּ֤ה שָֽׂחֲק֣וּ עָלַ/י֮ צְעִירִ֥ים מִמֶּ֗/נִּי לְ/יָ֫מִ֥ים אֲשֶׁר מָאַ֥סְתִּי אֲבוֹתָ֑/ם לָ֝/שִׁ֗ית עִם כַּלְבֵ֥י צֹאנִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/001.yaml
  text: But now those younger than I laugh at me[a], whose fathers I refused to set with the dogs of my flock.
translation:
  language: fr
  text: Mais maintenant, ceux qui sont plus jeunes que moi se moquent de moi, eux dont j’ai refusé de mettre les pères avec les chiens de mon troupeau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « avec mes chiens de berger ». Littéralement : « avec les chiens de mon troupeau ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Le contexte oppose vivement l’honneur passé de Job à son humiliation présente; « Mais maintenant » rend naturellement cette valeur adversative.
- source_word: שָׂחֲקוּ עָלַי
  choice: se moquent de moi
  rationale: Le verbe peut signifier rire, mais avec עַל il exprime ici un rire méprisant dirigé contre Job; « se moquent de moi » communique clairement cette nuance.
- source_word: צְעִירִים מִמֶּנִּי לְיָמִים
  choice: ceux qui sont plus jeunes que moi
  rationale: Littéralement, ils sont moins avancés « en jours ». La formulation française rend naturellement l’idée d’âge sans ajouter explicitement « hommes », absent de l’hébreu.
- source_word: אֲשֶׁר מָאַסְתִּי
  choice: eux dont je refusais même
  rationale: מָאַס exprime le rejet ou le dédain. Avec l’infinitif suivant, « refuser de » convient à la syntaxe; « même » fait ressortir l’abaissement social impliqué sans transformer le rejet en simple impossibilité.
- source_word: אֲבוֹתָם
  choice: les pères
  rationale: Le sens ordinaire est « leurs pères »; il s’agit des pères de ceux qui se moquent maintenant de Job.
- source_word: לָשִׁית עִם
  choice: placer ... avec
  rationale: La tournure conserve l’image concrète de mettre ou d’assigner quelqu’un avec un groupe.
- source_word: כַּלְבֵי צֹאנִי
  choice: les chiens de mon troupeau
  rationale: Cette traduction garde la formulation hébraïque, plus large que le terme fonctionnel « chiens de berger ».
