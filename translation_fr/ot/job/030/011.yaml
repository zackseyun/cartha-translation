  yaml_path: translation/ot/job/030/011.yaml
  text: Because he has loosened his cord and afflicted me[b][a], they have cast off restraint before me.
translation:
  language: fr
  text: Car il a détendu sa corde[a] et m’a humilié ; devant moi, ils ont rejeté toute retenue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte écrit hébreu porte « sa corde ». La qeré lit « ma corde ». Le mot peut aussi désigner une « corde d’arc ».
    reason: textual_and_lexical_alternative
  - marker: b
    text: 'Littéralement : « ils ont lâché la bride devant moi », c’est-à-dire qu’ils ont rejeté toute retenue en ma présence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la cause des moqueries et de l’hostilité décrites dans le contexte, avec une tournure française naturelle.
- source_word: יִתְרוֹ
  choice: ma corde
  rationale: Le texte massorétique présente une difficulté de lecture et le terme peut désigner une corde en général ou, plus précisément, une corde d’arc. La première personne (« ma ») suit le ketiv et s’accorde naturellement avec la plainte de Job ; l’autre lecture est signalée en note.
- source_word: פִּתַּח
  choice: a détendu
  rationale: Avec « corde » comme complément, le verbe exprime naturellement l’action de relâcher ou détendre ce qui était tendu.
- source_word: וַיְעַנֵּנִי
  choice: et m’a humilié
  rationale: Le verbe vient ici de ענה au sens d’affliger ou d’humilier, plutôt que du verbe homonyme signifiant répondre. « Humilié » convient particulièrement au renversement social décrit dans le passage.
- source_word: וְרֶסֶן
  choice: toute retenue
  rationale: Le nom désigne littéralement un frein ou une bride, mais l’expression signifie ici que les adversaires ne se maîtrisent plus. La traduction idiomatique conserve le sens, tandis que l’image concrète est indiquée en note.
- source_word: מִפָּנַי
  choice: devant moi
  rationale: Rend directement l’idée d’une conduite sans honte en présence de Job et dirigée contre lui.
- source_word: שִׁלֵּחוּ
  choice: ils ont rejeté
  rationale: Avec l’image du frein, le verbe signifie laisser aller ou ôter ; « rejeter toute retenue » exprime clairement l’idiome en français moderne.
theological_decisions:
- issue: Référent du sujet singulier de פִּתַּח et וַיְעַנֵּנִי
  choice: Conserver le pronom « il » sans identifier explicitement son référent
  alternative: Traduire « Dieu a détendu… »
  rationale: Le contexte peut orienter vers Dieu, mais le verset hébreu ne le nomme pas. Maintenir « il » préserve l’implicite et évite de résoudre une ambiguïté théologique du texte.
translation_notes:
  register: Français international moderne, sobre et poétique. « Détendu ma corde » conserve l’image difficile du texte au lieu de l’expliquer dans le corps du verset ; les variantes textuelle et lexicale sont données en note. Les marqueurs suivent immédiatement les expressions concernées.
