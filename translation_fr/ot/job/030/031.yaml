  yaml_path: translation/ot/job/030/031.yaml
  text: So my lyre has become mourning[b][a], and my pipe the sound of those who weep.
translation:
  language: fr
  text: Ma lyre[a] s’est changée en lamentation, et mon chalumeau[b] en son de ceux qui pleurent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma harpe ». Le terme hébreu peut désigner une lyre ou un instrument à cordes semblable à une harpe.
    reason: lexical_alternative
  - marker: b
    text: Ou « ma flûte ». Le terme hébreu désigne un instrument à vent dont la forme exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: est devenue
  rationale: Le wayyiqtol de היה décrit ici le renversement qui a placé l’instrument dans un nouvel état; le passé composé exprime naturellement en français le résultat présent.
- source_word: לְאֵבֶל
  choice: un instrument de deuil
  rationale: אֵבֶל désigne le deuil ou sa manifestation. Cette formulation conserve l’image poétique tout en rendant explicite en français la fonction désormais funèbre de la lyre.
- source_word: כִּנֹּרִי
  choice: ma lyre
  rationale: כִּנּוֹר désigne un instrument ancien à cordes, proche d’une lyre; « lyre » évite l’image trop précise de la harpe moderne.
- source_word: וְעֻגָבִי
  choice: mon chalumeau
  rationale: עוּגָב désigne un instrument à vent dont la forme exacte reste incertaine. « Chalumeau » évoque en français un ancien instrument à vent sans l’identifier à la flûte traversière moderne.
- source_word: לְקוֹל
  choice: accompagne la voix de
  rationale: La construction elliptique parallèle à « est devenue » associe l’instrument au קוֹל des pleureurs. « Accompagne » rend naturellement cette relation sans affirmer que l’instrument se transforme littéralement en voix.
- source_word: בֹּכִים
  choice: ceux qui pleurent
  rationale: Le participe substantivé désigne les personnes en train de pleurer; cette expression est naturelle et conserve la référence personnelle.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. « Ainsi » marque l’aboutissement de la lamentation. Le parallélisme hébreu est conservé, avec une légère explicitation idiomatique dans « un instrument de deuil » et « accompagne ».
