  text: Among the bushes they bray[b][a]; under the nettles they huddle together.
translation:
  language: fr
  text: Au milieu des buissons, ils braient ; sous les orties, ils se regroupent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils sont rassemblés » ou « ils se serrent les uns contre les autres ». Le verbe hébreu évoque un regroupement compact ; sa nuance exacte est incertaine ici. Le nom de la plante traduit par « orties » peut aussi désigner un buisson épineux ou des ronces.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  choice: au milieu de
  rationale: Avec le pluriel « buissons », cette expression rend naturellement l’idée d’être parmi eux plutôt que strictement entre deux éléments.
- source_word: שִׂיחִים
  choice: buissons
  rationale: Le nom désigne des arbustes ou broussailles basses ; « buissons » est clair, courant et adapté au milieu sauvage décrit.
- source_word: יִנְהָקוּ
  choice: ils braient
  rationale: Le verbe נהק désigne ordinairement le braiment des ânes. Ce choix conserve l’image animale, rude et dégradante du texte.
- source_word: תַּחַת
  choice: sous
  rationale: Équivalent spatial direct et naturel en français.
- source_word: חָרוּל
  choice: orties
  rationale: Le terme désigne une plante sauvage piquante ou nuisible, dont l’identification botanique exacte demeure incertaine. « Orties » correspond à une traduction traditionnelle intelligible.
- source_word: יְסֻפָּחוּ
  choice: ils se blottissent ensemble
  rationale: La forme verbale évoque le fait d’être réunis ou serrés les uns contre les autres. Cette formulation restitue naturellement le regroupement misérable suggéré par le contexte, sans exclure la nuance d’entassement.
