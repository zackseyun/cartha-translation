  yaml_path: translation/ot/job/030/005.yaml
  text: They are driven out from the midst[b][a]; they shout after them as after a thief.
translation:
  language: fr
  text: Ils sont chassés du milieu[a] ; on crie contre eux comme contre un voleur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du milieu » ; le groupe dont ils sont exclus est sous-entendu.'
    reason: implicit_source_element
  - marker: b
    text: 'Le verbe hébreu est à la troisième personne du pluriel, sans identifier ici ceux qui crient. Autre traduction possible : « on crie après eux comme après un voleur ».'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: מִן־גֵּו
  choice: du milieu des gens
  rationale: גֵּו désigne ici le milieu ou le sein d’un groupe, non un ravin (qui correspondrait normalement à גַּיְא/גֵּיא). « Des gens » explicite avec retenue le complément collectif sous-entendu par le contexte.
- source_word: יְגֹרָשׁוּ
  choice: ils sont chassés
  rationale: La forme exprime une expulsion subie et violente ; le passif français conserve la focalisation de l’hébreu sur les exclus.
- source_word: יָרִיעוּ
  choice: on crie
  rationale: Le verbe signifie pousser un cri ou une clameur. Le pronom indéfini « on » rend naturellement le sujet hostile laissé sans antécédent explicite dans ce verset.
- source_word: עָלֵימוֹ
  choice: après eux
  rationale: Avec un verbe de cri hostile et la comparaison au voleur, « crier après eux » exprime idiomatiquement la direction de la clameur, tout en laissant possible la nuance « contre eux ».
- source_word: כַּגַּנָּב
  choice: comme après un voleur
  rationale: La comparaison évoque la clameur lancée à la poursuite ou à l’encontre d’un voleur ; la formulation française reprend l’ellipse de façon intelligible.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. « Crier après quelqu’un » est courant en français international et maintient l’image d’une clameur hostile. La ponctuation relie étroitement l’expulsion et les cris qui l’accompagnent.
