id: JOB.30.23
reference: Job 30:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי יָ֭דַעְתִּי מָ֣וֶת תְּשִׁיבֵ֑/נִי וּ/בֵ֖ית מוֹעֵ֣ד לְ/כָל חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/023.yaml
  text: For I know that you will bring me to death[b][a], and to the house appointed for every living one.
translation:
  language: fr
  text: Car je sais que tu me ramèneras à la mort[a] et à la demeure assignée à tout vivant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu me conduiras à la mort ». Le verbe signifie proprement « faire revenir, ramener ».
    reason: lexical_alternative
  - marker: b
    text: L’expression peut désigner poétiquement la tombe ou le séjour des morts, destination commune à tous les humains.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la justification de la plainte précédente et conserve naturellement la valeur connective de l’hébreu.
- source_word: יָדַעְתִּי
  choice: je sais
  rationale: Le parfait d’un verbe d’état exprime ici une conviction acquise et ferme, rendue naturellement au présent en français.
- source_word: מָוֶת
  choice: la mort
  rationale: Le nom désigne directement la mort, sans nommer explicitement le séjour des morts.
- source_word: תְּשִׁיבֵנִי
  choice: tu me ramèneras
  rationale: Le hiphil de שוב signifie normalement « faire revenir, ramener ». Cette formulation conserve la nuance causative et le mouvement de retour, même si son application à la mort demeure poétiquement tendue.
- source_word: וּבֵית מוֹעֵד
  choice: à la demeure assignée
  rationale: « Demeure » restitue l’image de la maison dans un français poétique naturel; מוֹעֵד évoque ici ce qui est fixé ou assigné. La préposition « à » est reprise de la destination exprimée dans le premier membre.
- source_word: לְכָל חָי
  choice: à tout vivant
  rationale: Conserve le singulier collectif et la portée universelle de l’expression hébraïque.
theological_decisions:
- issue: Identification de la demeure assignée à tout vivant
  choice: Conserver l’image générale de la mort comme destination universelle sans nommer le Shéol.
  alternative: Traduire ou expliquer directement cette demeure comme la tombe ou le Shéol.
  rationale: L’hébreu parle de « mort » et d’une « maison/demeure assignée » sans employer le terme Shéol. La traduction maintient donc l’image et son ouverture théologique.
- issue: Valeur de retour dans תְּשִׁיבֵנִי
  choice: « tu me ramèneras à la mort »
  alternative: « tu me conduiras à la mort » ou « tu me feras retourner à la mort »
  rationale: « Ramener » préserve la valeur causative de שוב sans expliquer pourquoi la mort est présentée comme un lieu de retour; cette tension poétique appartient au texte.
translation_notes:
  register: Français international moderne, sobre et poétique. Le tutoiement convient à l’adresse directe à Dieu dans le contexte. « Demeure » évite la raideur de « maison assignée » tout en conservant la métaphore spatiale.
