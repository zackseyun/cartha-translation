  text: בַּ/עֲר֣וּץ נְחָלִ֣ים לִ/שְׁכֹּ֑ן חֹרֵ֖י עָפָ֣ר וְ/כֵפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/006.yaml
  text: In the gullies of the wadis they dwell[b][a], in holes of the dust and among the rocks.
translation:
  language: fr
  text: Ils habitent dans les ravins des oueds[a], dans des trous de terre et parmi les rochers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les gorges des lits de torrents » ; le mot hébreu נְחָלִים peut désigner des oueds, des lits de torrents ou des vallées selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans des trous de poussière et dans les escarpements rocheux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲרוּץ
  choice: dans les ravins
  rationale: עָרוּץ désigne une entaille, un chenal ou un ravin creusé notamment par les eaux. « Ravins » est naturel en français moderne et conserve l’image topographique.
- source_word: נְחָלִים
  choice: des oueds
  rationale: נַחַל peut désigner une vallée, un torrent ou le lit, souvent saisonnier, d’un cours d’eau. « Oueds » rend avec précision le cadre géographique proche-oriental sans suggérer un cours d’eau permanent.
- source_word: לִשְׁכֹּן
  choice: ils habitent
  rationale: L’infinitif construit exprime ici, après le groupe locatif, le fait d’y demeurer. Une forme verbale finie donne une phrase française naturelle.
- source_word: חֹרֵי
  choice: des trous
  rationale: חוֹר désigne un trou ou une cavité. « Trous » maintient l’image rude et dégradante sans transformer ces abris en véritables grottes.
- source_word: עָפָר
  choice: de terre
  rationale: עָפָר peut signifier poussière, terre meuble ou sol. Dans « trous de terre », « terre » produit une expression française claire et concrète, tandis que « trous de poussière » serait moins idiomatique.
- source_word: וְכֵפִים
  choice: et parmi les rochers
  rationale: כֵּפִים désigne des rochers ou escarpements rocheux. « Parmi les rochers » explicite naturellement en français la valeur locative impliquée et conserve le parallélisme.
