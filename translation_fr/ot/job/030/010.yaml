  yaml_path: translation/ot/job/030/010.yaml
  text: They abhor me; they keep far from me[a], and they do not hold back spitting before my face.
translation:
  language: fr
  text: Ils m’ont en horreur, ils se tiennent loin de moi et ne se retiennent pas de cracher devant moi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils ne retiennent pas le crachat de devant ma face ». L’expression décrit un geste ouvert de mépris devant Job, probablement dirigé contre lui personnellement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: Ils m’ont en horreur
  rationale: Le verbe תעב exprime une forte répulsion. « Avoir en horreur » en conserve l’intensité dans un français naturel et digne.
- source_word: רָחֲקוּ מֶנִּי
  choice: ils se tiennent loin de moi
  rationale: רחק indique l’éloignement. Cette formulation peut évoquer à la fois la distance physique et le rejet social sans trancher entre les deux.
- source_word: וּמִפָּנַי לֹא חָשְׂכוּ רֹק
  choice: ils ne se retiennent pas de me cracher au visage
  rationale: L’hébreu parle littéralement de ne pas retenir le crachat loin de la face de Job. L’expression française « cracher au visage » rend clairement l’acte direct et outrageant, tandis que « ne se retiennent pas » correspond au sens de חשׂך.
