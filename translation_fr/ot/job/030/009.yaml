  text: And now I have become their song[b][a], and I am a byword to them.
translation:
  language: fr
  text: Et maintenant, je suis devenu le sujet de leur chanson[a] ; je suis pour eux un objet de raillerie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur chanson » ; dans ce contexte, il s’agit probablement d’une chanson moqueuse.'
    reason: lexical_alternative
  - marker: b
    text: Ou « un dicton » ou « un proverbe » ; l’hébreu signifie littéralement « une parole » et désigne ici ce que l’on dit de quelqu’un, dans un contexte de mépris.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Marque à la fois la transition temporelle et le contraste entre la dignité passée de Job et son humiliation présente, sans renforcer excessivement la valeur adversative du waw.
- source_word: נְגִינָתָם
  choice: le sujet de leurs chansons
  rationale: Le nom désigne une chanson ou un morceau musical. La tournure explicite naturellement en français que Job est ce dont parlent leurs chansons, tandis que la note conserve la formulation hébraïque plus directe et la nuance probablement moqueuse du contexte.
- source_word: הָיִיתִי
  choice: je suis devenu
  rationale: Le parfait de היה décrit un changement ayant abouti à la situation présente de Job ; le passé composé français exprime naturellement ce résultat actuel.
- source_word: וָאֱהִי
  choice: je suis
  rationale: La forme poursuit la description de l’état humiliant actuel de Job. Le présent évite une répétition pesante tout en maintenant le parallélisme des deux propositions.
- source_word: לָהֶם
  choice: leurs
  rationale: La relation avec ceux qui parlent est rendue idiomatiquement par le possessif français dans « leurs propos ».
- source_word: לְמִלָּה
  choice: l’objet de leurs propos
  rationale: מִלָּה signifie ici une parole, un propos ou une formule appliquée à quelqu’un. Cette traduction reste naturelle et conserve une certaine ambiguïté, sans imposer dans le texte principal l’idée plus précise de proverbe ou de raillerie.
