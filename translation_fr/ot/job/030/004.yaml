  text: who pluck saltwort among the bushes[b][a], and the root of broom shrubs is their food.
translation:
  language: fr
  text: Ils cueillent de l’arroche[a] parmi les buissons, et la racine des genêts est leur nourriture[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une plante des terrains salés » ; l’identification exacte du végétal hébreu est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « leur pain », au sens plus large de nourriture ou de subsistance.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּטְפִים
  choice: Ils cueillent
  rationale: Le participe de קטף décrit l’action de cueillir ou d’arracher des végétaux. « Ils cueillent » est naturel en français et prolonge la description des personnes évoquées au verset précédent.
- source_word: מַלּוּחַ
  choice: de l’arroche
  rationale: Le nom hébreu de la plante demeure incertain. « Arroche » peut désigner une plante sauvage adaptée aux sols salés et offre en français une équivalence plausible sans prétendre lever l’incertitude botanique.
- source_word: עֲלֵי שִׂיחַ
  choice: parmi les buissons
  rationale: Dans ce contexte, על situe vraisemblablement la cueillette dans les broussailles. « Parmi les buissons » restitue naturellement l’image du fourrageage.
- source_word: וְשֹׁרֶשׁ רְתָמִים
  choice: et les racines de genêt
  rationale: רתמים désigne le genêt du désert. Le pluriel français « les racines » rend idiomatiquement la valeur collective du singulier hébreu שֹׁרֶשׁ associé au pluriel des arbustes.
- source_word: לַחְמָם
  choice: sont leur nourriture
  rationale: לֶחֶם signifie littéralement « pain », mais peut désigner plus largement la nourriture ou la subsistance. Ici, « nourriture » convient à ces racines consommées pour survivre.
