source:
  edition: WLC
  text: אַחֲרָ֤י/ו יִשְׁאַג ק֗וֹל יַ֭רְעֵם בְּ/ק֣וֹל גְּאוֹנ֑/וֹ וְ/לֹ֥א יְ֝עַקְּבֵ֗/ם כִּֽי יִשָּׁמַ֥ע קוֹלֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/004.yaml
  text: After it[a], a voice roars; he thunders with his majestic voice[c][b], and he does not hold them back when his voice is heard.
translation:
  language: fr
  text: Après cela[a], une voix rugit ; il tonne de sa voix majestueuse et ne les retient pas[b] quand[c] sa voix se fait entendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ensuite, une voix rugit ». L’hébreu peut être compris de manière adverbiale, mais le contexte renvoie probablement à l’éclair du verset précédent.
    reason: lexical_alternative
  - marker: b
    text: Ou « il ne les retarde pas ». Le pronom « les » désigne probablement les éclairs ou les effets de l’orage qui accompagnent le tonnerre.
    reason: lexical_alternative
  - marker: c
    text: Ou « parce que sa voix se fait entendre ». La conjonction hébraïque peut avoir ici un sens causal aussi bien que temporel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Après lui
  rationale: Le suffixe masculin singulier renvoie très probablement à l’éclair du verset précédent, nom masculin en français comme en hébreu. La formulation conserve ce lien anaphorique sans exclure la lecture adverbiale signalée en note.
- source_word: יִשְׁאַג קוֹל
  choice: une voix rugit
  rationale: Le verbe évoque typiquement le rugissement du lion et donne ici au tonnerre une image vive. L’indéfini respecte l’absence de suffixe possessif dans ce premier syntagme.
- source_word: יַרְעֵם
  choice: il tonne
  rationale: Cette tournure française naturelle exprime l’action causative attribuée à Dieu sans alourdir le texte par « il fait tonner ».
- source_word: בְּקוֹל גְּאוֹנוֹ
  choice: de sa voix majestueuse
  rationale: גָּאוֹן exprime ici la majesté ou la grandeur. « De sa voix majestueuse » est idiomatique, digne et conserve l’idée de la voix divine comme moyen ou manifestation du tonnerre.
- source_word: וְלֹא יְעַקְּבֵם
  choice: et il ne les retient pas
  rationale: Le piel de עקב peut exprimer l’idée de retenir, d’entraver ou de retarder. Le pronom pluriel, dont l’antécédent reste implicite en hébreu, est maintenu tel quel afin de ne pas préciser indûment les éclairs ou les effets de l’orage.
- source_word: כִּי יִשָּׁמַע קוֹלוֹ
  choice: quand sa voix se fait entendre
  rationale: כִּי peut avoir ici une valeur temporelle ou causale. La lecture temporelle s’intègre naturellement à la succession de l’éclair et du tonnerre, tandis que l’alternative causale est conservée en note.
theological_decisions:
- issue: Référent du sujet qui rugit et tonne
  choice: Le sujet personnel sous-entendu est Dieu, dont la voix se manifeste dans le tonnerre.
  alternative: La voix ou l’orage pourrait être compris de manière plus impersonnelle.
  rationale: Le contexte immédiat décrit l’action de Dieu dans l’orage, et « sa voix majestueuse » appuie fortement le référent divin. La traduction garde néanmoins le simple pronom « il », sans ajouter explicitement « Dieu ».
translation_notes:
  register: Français international moderne, clair et soutenu. « Une voix rugit » conserve volontairement l’image poétique forte de l’hébreu ; le pronom pluriel sans antécédent explicite préserve l’ambiguïté du texte source.
