  yaml_path: translation/ot/job/037/021.yaml
  text: And now they do not see the light[a], bright though it is in the skies[b]; but a wind passes by and clears them.
translation:
  language: fr
  text: Et maintenant, on ne voit pas la lumière[a], pourtant éclatante dans les cieux ; mais un vent passe et les rend clairs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « on n’a pas vu la lumière, éclatante dans les cieux ». La formulation hébraïque est concise et peut se comprendre sans nuance concessive.'
    reason: alternative_reading
  - marker: b
    text: 'Le pronom « les » est au pluriel ; il renvoie probablement aux cieux ou aux nuages. On peut aussi comprendre plus généralement : « rend le ciel clair ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la liaison du ו et la valeur temporelle de עַתָּה, dans un français naturel.
- source_word: לֹא רָאוּ
  choice: on ne voit pas
  rationale: Le parfait qal à la 3e personne du pluriel peut exprimer ici une observation présente ou générale. Le pronom indéfini « on » rend cette portée sans introduire un référent absent du contexte immédiat.
- source_word: אוֹר
  choice: la lumière
  rationale: Le terme hébreu désigne simplement la lumière ; « lumière du soleil » serait plus explicite que la source.
- source_word: בָּהִיר הוּא
  choice: pourtant éclatante
  rationale: Le féminin s’accorde avec « lumière ». La tournure concessive exprime naturellement le contraste implicite entre l’existence de cette lumière éclatante et le fait qu’elle demeure invisible, tout en signalant en note la lecture moins concessive.
- source_word: בַּשְּׁחָקִים
  choice: dans les cieux
  rationale: שְׁחָקִים peut évoquer les hauteurs célestes ou les masses nuageuses. « Les cieux » maintient le pluriel, le registre poétique et une certaine amplitude sémantique.
- source_word: וְרוּחַ
  choice: mais un vent
  rationale: רוּחַ est ici météorologique. L’article indéfini convient à l’apparition d’un vent dans la scène, et « mais » rend le contraste contextuel.
- source_word: עָבְרָה
  choice: passe
  rationale: Le présent donne à l’observation sa vivacité et décrit naturellement le mouvement du vent.
- source_word: וַתְּטַהֲרֵם
  choice: et les dégage
  rationale: Le verbe טהר signifie rendre pur, net ou clair. Dans ce contexte météorologique, « dégager » est idiomatique et le pronom pluriel « les » respecte le suffixe hébreu masculin pluriel.
