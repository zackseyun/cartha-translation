  source_fidelity: 'Le sens général est bien rendu : l’observation présente, la lumière brillante dans les hauteurs, puis le passage d’un vent qui produit un effet de clarification. « On ne voit pas » est une manière française recevable d’exprimer le pluriel indéfini hébreu. La concession (« pourtant ») est possible, à condition que l’alternative non concessive reste signalée. En revanche, « les dégage » ne rend pas idiomatiquement l’action de טהר lorsque l’antécédent pluriel peut être les cieux ; « les rend clairs » exprime plus directement l’idée de rendre net/clair tout en gardant le pluriel ambigu du suffixe.'
