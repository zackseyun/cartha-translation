  text: שִׁמְע֤וּ שָׁמ֣וֹעַ בְּ/רֹ֣גֶז קֹל֑/וֹ וְ֝/הֶ֗גֶה מִ/פִּ֥י/ו יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/002.yaml
  text: Listen carefully[a] to the trembling of his voice[b], and the rumbling that comes out from his mouth.
translation:
  language: fr
  text: Écoutez attentivement[a] le frémissement de sa voix[b], le grondement qui sort de sa bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Écoutez, écoutez ». La construction hébraïque renforce l’ordre d’écouter.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’agitation » ou « la fureur de sa voix ». Le terme hébreu peut évoquer le tremblement, l’agitation ou la fureur.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Écoutez attentivement
  rationale: L’impératif suivi de l’infinitif absolu intensifie l’appel à écouter. « Écoutez attentivement » en restitue naturellement l’emphase en français moderne.
- source_word: בְּרֹגֶז
  choice: le frémissement de
  rationale: רֹגֶז peut évoquer le tremblement, l’agitation ou la fureur. Dans l’imagerie de l’orage, « frémissement » conserve l’idée d’une vibration saisissante sans réduire le terme à la colère.
- source_word: קֹלוֹ
  choice: sa voix
  rationale: Avec la mention parallèle de « sa bouche », « voix » préserve la personnification poétique du tonnerre comme parole de Dieu.
- source_word: וְהֶגֶה
  choice: le grondement
  rationale: הֶגֶה désigne un son bas, un murmure ou un gémissement. Dans ce contexte d’orage, « grondement » rend clairement sa qualité sonore.
- source_word: מִפִּיו יֵצֵא
  choice: qui sort de sa bouche
  rationale: Cette formulation conserve l’expression anthropomorphique concrète et rend directement le verbe יצא.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu dans l’imagerie de l’orage
  choice: Conserver « sa voix » et « sa bouche »
  alternative: Dépersonnaliser par « son bruit » ou expliciter « le tonnerre »
  rationale: L’hébreu présente poétiquement l’orage comme l’énonciation même de Dieu. Garder ces images respecte la force littéraire et théologique du texte.
translation_notes:
  register: Français international moderne, poétique et digne. « Frémissement » et « grondement » maintiennent la richesse acoustique du verset, tandis que la syntaxe reste accessible.
