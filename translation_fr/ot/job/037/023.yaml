  text: שַׁדַּ֣י לֹֽא מְ֭צָאנֻ/הוּ שַׂגִּיא כֹ֑חַ וּ/מִשְׁפָּ֥ט וְ/רֹב צְ֝דָקָ֗ה לֹ֣א יְעַנֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/023.yaml
  text: The Almighty—we cannot find him out—great in power[c][b][a]; and justice and abundant righteousness he does not afflict.
translation:
  language: fr
  text: Le Tout-Puissant — nous ne pouvons l’atteindre[a] — est grand en puissance ; il ne viole ni le droit[b] ni l’abondante justice[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous ne pouvons le découvrir », « nous ne pouvons le comprendre pleinement » ou « nous ne le trouvons pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le jugement ».'
    reason: lexical_alternative
  - marker: c
    text: 'La clause finale peut aussi se comprendre ainsi : « riche en droit et en justice, il n’opprime pas » ou « il n’afflige pas ». D’autres comprennent le verbe au sens de « il ne répond pas ».'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Titre divin usuel en français, qui communique le sens traditionnel de שַׁדַּי dans Job sans imposer une translittération obscure.
- source_word: לֹא מְצָאנֻהוּ
  choice: nous ne pouvons l’atteindre
  rationale: מצא signifie littéralement « trouver », mais exprime ici l’impossibilité d’accéder pleinement à Dieu ou de le sonder. « Atteindre » reste proche de l’image tout en étant naturel en français.
- source_word: שַׂגִּיא כֹחַ
  choice: grand en puissance
  rationale: Rend directement la grandeur exprimée par שַׂגִּיא et la puissance de כֹחַ dans une formulation française digne et claire.
- source_word: וּמִשְׁפָּט
  choice: le droit
  rationale: מִשְׁפָּט peut désigner le jugement, le droit ou la justice. « Le droit » convient ici à la qualité morale et judiciaire attribuée à Dieu.
- source_word: וְרֹב צְדָקָה
  choice: l’abondance de la justice
  rationale: רֹב marque l’abondance ou la grandeur, tandis que צְדָקָה désigne ici la justice ou la droiture. Cette formulation conserve distincts מִשְׁפָּט et צְדָקָה.
- source_word: לֹא יְעַנֶּה
  choice: il ne bafoue
  rationale: Dans cette construction, le piel de ענה est compris au sens de maltraiter ou opprimer. Avec « le droit » et « la justice » comme objets coordonnés, « bafouer » produit une syntaxe française cohérente et exprime l’idée qu’il ne leur fait pas violence, sans faire de Dieu l’auteur d’une affliction arbitraire.
theological_decisions:
- issue: Rapport de לֹא יְעַנֶּה avec מִשְׁפָּט et רֹב צְדָקָה
  choice: 'Le verbe gouverne « le droit » et « l’abondance de la justice » : Dieu ne les bafoue pas.'
  alternative: « Il n’opprime pas » ou « il n’afflige pas » ; une autre analyse lexicale donne « il ne répond pas ».
  rationale: L’ordre hébreu permet de lire le droit et l’abondance de justice comme les objets antéposés du verbe. Cette analyse produit une affirmation naturelle de la rectitude divine, tout en signalant en note les autres compréhensions possibles du verbe.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation découpe l’affirmation de la transcendance divine et celle de sa puissance. La dernière proposition privilégie une syntaxe française explicite tout en conservant les ambiguïtés lexicales dans les notes.
