  text: מִן הַ֭/חֶדֶר תָּב֣וֹא סוּפָ֑ה וּֽ/מִ/מְּזָרִ֥ים קָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/009.yaml
  text: From its chamber comes the storm[b][a], and from the scattering winds comes cold.
translation:
  language: fr
  text: De la chambre vient la tempête[a], et des vents qui dispersent vient le froid[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Du sud vient la tempête ». L’hébreu dit littéralement « de la chambre », expression poétique qui peut évoquer une région méridionale ou un dépôt caché.
    reason: alternative_reading
  - marker: b
    text: Ou « du nord vient le froid ». Le terme hébreu est rare et son sens précis reste incertain; il peut aussi évoquer des vents qui dispersent.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַחֶדֶר
  choice: De la chambre
  rationale: חֶדֶר désigne littéralement une chambre ou une pièce intérieure. L’image poétique peut évoquer le lieu caché d’où sort la tempête; « du sud » reste une interprétation contextuelle plutôt que le sens explicite du nom.
- source_word: תָּבוֹא
  choice: vient
  rationale: Le verbe בוא signifie couramment « venir » ou « arriver ». Le présent restitue ici la vivacité de la formulation poétique.
- source_word: סוּפָה
  choice: la tempête
  rationale: סוּפָה désigne une violente tempête, parfois un tourbillon. « Tempête » est naturel et n’impose pas le sens plus étroit de « tourbillon ».
- source_word: וּמִמְּזָרִים
  choice: des vents qui dispersent
  rationale: מְזָרִים est un terme rare et incertain, souvent rapproché de l’idée de dispersion. Cette formulation rend cette possibilité sans transformer dans le texte principal l’inférence traditionnelle « du nord » en certitude lexicale.
- source_word: קָרָה
  choice: le froid
  rationale: קָרָה peut désigner le froid ou la gelée. « Le froid » demeure suffisamment large et convient au parallélisme avec la tempête.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais accessible. La répétition de « vient » explicite dans le second membre le verbe sous-entendu par le parallélisme hébreu. Les notes maintiennent l’incertitude réelle des deux expressions météorologiques.
