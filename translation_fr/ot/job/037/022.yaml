  text: מִ֭/צָּפוֹן זָהָ֣ב יֶֽאֱתֶ֑ה עַל אֱ֝ל֗וֹהַּ נ֣וֹרָא הֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/022.yaml
  text: From the north comes golden splendor; around God is awesome majesty.
translation:
  language: fr
  text: Du nord vient une splendeur dorée ; auprès de Dieu est une majesté redoutable.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצָּפוֹן
  choice: Du nord
  rationale: Rend directement la provenance exprimée par la préposition מִן et le nom « nord ».
- source_word: זָהָב
  choice: une splendeur d’or
  rationale: Le mot signifie littéralement « or ». Dans ce contexte poétique et atmosphérique, il qualifie vraisemblablement un éclat doré ; la formulation conserve l’image de l’or sans réduire le syntagme à l’arrivée littérale du métal.
- source_word: יֶאֱתֶה
  choice: vient
  rationale: Rend simplement le verbe « venir, arriver », avec le présent français adapté à la description poétique.
- source_word: עַל אֱלוֹהַּ
  choice: autour de Dieu
  rationale: La préposition עַל signifie habituellement « sur, au-dessus de, contre » et peut ici décrire ce qui enveloppe ou entoure Dieu. « Autour de » donne un français naturel tout en maintenant l’association spatiale de la majesté avec Dieu.
- source_word: נוֹרָא הוֹד
  choice: se déploie une majesté redoutable
  rationale: הוֹד désigne la majesté, la splendeur ou l’éclat, et נוֹרָא ce qui inspire la crainte révérencielle. « Redoutable » préserve cette force sans suggérer simplement quelque chose d’effrayant ; « se déploie » supplée naturellement la copule absente en hébreu.
theological_decisions:
- issue: Rapport spatial de la majesté à Dieu dans עַל אֱלוֹהַּ
  choice: autour de Dieu
  alternative: sur Dieu / auprès de Dieu
  rationale: Le contexte décrit une manifestation éclatante associée à la venue divine. « Autour de » est idiomatique et évite l’étrangeté théologique et stylistique de « sur Dieu », tout en ne transformant pas la majesté en simple qualité abstraite.
translation_notes:
  register: Style poétique, actuel et digne. Le parallélisme est conservé en deux membres séparés par un point-virgule. « Splendeur d’or » maintient la densité imagée de l’hébreu, tandis que « majesté redoutable » exprime une grandeur qui inspire la crainte révérencielle.
