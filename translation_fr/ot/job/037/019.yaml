source:
  edition: WLC
  text: ה֭וֹדִיעֵ/נוּ מַה נֹּ֣אמַר ל֑/וֹ לֹ֥א נַ֝עֲרֹ֗ךְ מִ/פְּנֵי חֹֽשֶׁךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/019.yaml
  text: Teach us what we should say to him[b][a]; we cannot arrange our words because of darkness.
translation:
  language: fr
  text: Fais-nous savoir ce que nous devons lui dire ; nous ne pouvons pas ordonner nos paroles à cause des ténèbres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous ne pouvons pas exposer notre cause ». Les « ténèbres » peuvent désigner l’ignorance ou l’incapacité humaine, mais un sens plus littéral reste possible.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנוּ
  choice: Fais-nous savoir
  rationale: L’impératif hiphil de ידע signifie littéralement « fais-nous savoir ». Cette formulation française conserve la valeur causative sans exclure l’idée d’instruction.
- source_word: מַה נֹּאמַר לוֹ
  choice: ce que nous devons lui dire
  rationale: La tournure exprime ici ce qu’il convient de dire à Dieu ; « devons » rend naturellement cette nuance délibérative en français.
- source_word: לֹא נַעֲרֹךְ
  choice: nous ne pouvons pas ordonner nos paroles
  rationale: ערך signifie « disposer, mettre en ordre ». Le complément « nos paroles », implicite dans le contexte, produit un français intelligible tout en restant plus proche de l’image hébraïque qu’une explicitation judiciaire comme « présenter notre cause ».
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: à cause des ténèbres
  rationale: מִפְּנֵי exprime ici la cause. « Ténèbres » maintient l’image concise et son ambiguïté entre obscurité littérale, ignorance et incapacité humaine.
theological_decisions:
- issue: Sens des « ténèbres » dans la dernière proposition
  choice: Conserver le terme général « ténèbres » sans en préciser le référent.
  alternative: à cause de notre ignorance / parce qu’il fait sombre
  rationale: L’hébreu ne tranche pas entre une obscurité concrète et une image de la limitation humaine. La traduction ne doit pas résoudre cette tension.
- issue: Portée de ערך
  choice: « ordonner nos paroles », avec explicitation minimale du complément contextuel
  alternative: « présenter notre cause » ou simplement « mettre en ordre »
  rationale: Le contexte peut évoquer la formulation d’un plaidoyer devant Dieu, mais le verbe reste plus général. Le choix retenu préserve l’image de paroles que l’on ne parvient pas à organiser.
translation_notes:
  register: Français international moderne, sobre et poétique. « Fais-nous savoir » conserve la structure causative de l’hébreu ; « ordonner nos paroles » est dignifié et compréhensible, sans surinterpréter la possible métaphore judiciaire.
