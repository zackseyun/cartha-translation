  terminology: « Lumière » maintient avec justesse l’ambiguïté lexicale de אוֹר; la note indique sans imposer l’interprétation « éclair ». « Extrémités de la terre » rend naturellement l’idiome כַּנְפוֹת הָאָרֶץ. Les ancres de notes sont correctement placées.
