  yaml_path: translation/ot/job/037/003.yaml
  text: Under all the heavens he sends it out[b][a], and his lightning to the ends of the earth.
translation:
  language: fr
  text: Sous tous les cieux, il l’envoie, et sa lumière[a] atteint les extrémités de la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son éclair ». Le mot hébreu signifie littéralement « sa lumière » ; dans ce contexte d’orage, il désigne probablement l’éclair.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les ailes de la terre », image hébraïque désignant ses extrémités ou ses confins.
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת
  choice: sous
  rationale: Rend directement la préposition spatiale et conserve l’image poétique.
- source_word: כָּל הַשָּׁמַיִם
  choice: tous les cieux
  rationale: Conserve le pluriel hébreu et le registre poétique, tout en restant naturel en français.
- source_word: יִשְׁרֵהוּ
  choice: il le déploie
  rationale: Le verbe poétique est difficile et peut évoquer l’action d’étendre, de diriger ou de lancer. « Déploie » convient à l’extension du phénomène sous les cieux tout en préservant le pronom objet implicite dans le contexte.
- source_word: וְאוֹרוֹ
  choice: et sa lumière
  rationale: Traduit le sens lexical premier de אוֹר sans imposer « éclair », même si le contexte orageux rend cette interprétation probable.
- source_word: עַל
  choice: jusqu’aux
  rationale: Dans la seconde proposition elliptique, exprime naturellement en français l’étendue atteinte, là où l’hébreu dit littéralement « sur ».
- source_word: כַּנְפוֹת הָאָרֶץ
  choice: les extrémités de la terre
  rationale: Rend clairement le sens de l’image hébraïque littérale « les ailes de la terre », qui désigne ses confins.
