source:
  edition: WLC
  text: אַף בְּ֭/רִי יַטְרִ֣יחַ עָ֑ב יָ֝פִ֗יץ עֲנַ֣ן אוֹרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/011.yaml
  text: Indeed[a], he loads the thick cloud with moisture[b]; he scatters his cloud of light.
translation:
  language: fr
  text: Aussi, il charge l’épais nuage d’humidité[a] ; il disperse le nuage de sa lumière[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il charge l’épais nuage de pluie » ou « d’eau » ; le sens du terme hébreu rendu par « humidité » est incertain.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte d’orage, « sa lumière » peut désigner les éclairs ; on peut donc comprendre « le nuage de ses éclairs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Oui
  rationale: La particule a ici une valeur emphatique et additive. « Oui » rend sobrement cette insistance dans la suite de la description des phénomènes météorologiques.
- source_word: בְּרִי
  choice: d’humidité
  rationale: Le terme est difficile et son sens débattu. Dans ce contexte, avec un nuage que Dieu charge ou alourdit, « d’humidité » exprime naturellement l’idée probable d’eau ou de pluie sans la préciser excessivement.
- source_word: יַטְרִיחַ
  choice: il charge
  rationale: Le hifil de טרח évoque le fait d’imposer une charge ou d’alourdir. « Charge » conserve cette image tout en restant naturel avec un nuage rempli d’humidité.
- source_word: עָב
  choice: l’épais nuage
  rationale: עָב désigne couramment une masse nuageuse dense ou épaisse. Cette formulation préserve l’image météorologique concrète.
- source_word: יָפִיץ
  choice: il disperse
  rationale: Le hifil de פוץ signifie disperser ou répandre. « Disperse » rend directement le mouvement attribué à Dieu.
- source_word: עֲנַן
  choice: le nuage
  rationale: Le mot désigne simplement un nuage. La traduction reste littérale afin de ne pas résoudre d’avance la construction inhabituelle qui suit.
- source_word: אוֹרוֹ
  choice: de sa lumière
  rationale: אוֹר signifie normalement « lumière », avec ici un suffixe possessif. Dans le contexte de l’orage, la foudre est probablement en vue, mais « de sa lumière » préserve la formulation et l’ambiguïté de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le premier membre conserve l’image du nuage chargé d’eau ; le second maintient la construction poétique et ambiguë « le nuage de sa lumière » plutôt que de l’interpréter directement comme un nuage d’éclairs.
