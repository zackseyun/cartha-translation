  text: you whose garments are hot when the earth is still because of the south wind?[a]
translation:
  language: fr
  text: Toi dont les vêtements sont chauds, quand il apaise la terre par le vent du sud[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par le sud ». L’hébreu dit littéralement « depuis le sud » ; le terme peut désigner la région méridionale ou, dans ce contexte météorologique, le vent venant du sud.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: toi dont
  rationale: La particule relative rattache cette description à l’interpellation directe de Job. « Toi dont » restitue naturellement cette construction en français.
- source_word: בְּגָדֶיךָ
  choice: tes vêtements
  rationale: בגד désigne les vêtements ou habits. « Vêtements » est courant, précis et digne.
- source_word: חַמִּים
  choice: deviennent chauds
  rationale: L’adjectif signifie « chauds ». Avec le contexte circonstanciel, « deviennent chauds » exprime naturellement la chaleur ressentie dans les vêtements sans changer le sens essentiel.
- source_word: בְּהַשְׁקִיט
  choice: quand … s’immobilise
  rationale: La forme issue de שׁקט évoque le calme et l’absence de mouvement. Pour une scène météorologique, « s’immobilise » rend de façon naturelle le calme pesant de la terre ou de l’air ambiant.
- source_word: אֶרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner la terre ou le pays. Ici, « la terre » convient à la portée générale de la description météorologique.
- source_word: מִדָּרוֹם
  choice: sous le vent du sud
  rationale: Le texte dit littéralement « du sud ». Dans ce contexte de chaleur, le sud évoque vraisemblablement le vent chaud venant de cette direction. « Sous le vent du sud » explicite sobrement cette valeur météorologique tout en signalant l’alternative littérale en note.
