  text: From the breath of God ice is given[b][a], and the broad expanse of waters is frozen solid.
translation:
  language: fr
  text: Du souffle de Dieu vient la glace[a], et l’étendue des eaux se fige[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Par le souffle de Dieu vient la glace ». La préposition hébraïque peut indiquer le moyen (« par ») ou la source (« de ») ; le verbe signifie littéralement « donne ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la largeur des eaux devient dure ». L’expression hébraïque est poétique et peut évoquer la vaste surface des eaux qui devient solide.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: Par le souffle de
  rationale: נִשְׁמָה désigne le souffle. La préposition מִן peut marquer ici le moyen ou la source; « par » donne une formulation française naturelle tout en conservant l’image concrète.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל est ici le titre divin courant; aucune précision telle que « Tout-Puissant » n’est requise par le contexte.
- source_word: יִתֶּן קָרַח
  choice: la glace se forme
  rationale: Littéralement, « la glace est donnée ». Cette tournure française rend naturellement l’apparition de la glace sans effacer l’action divine exprimée dans le premier membre.
- source_word: וְרֹחַב מַיִם
  choice: et l’étendue des eaux
  rationale: רֹחַב évoque la largeur ou la vaste étendue. « L’étendue des eaux » convient au parallélisme poétique et reste intelligible.
- source_word: בְּמוּצָק
  choice: se solidifie
  rationale: מוּצָק évoque ce qui est coulé, durci ou rendu ferme. Dans ce contexte météorologique, « se solidifie » exprime clairement le gel des eaux tout en conservant l’image de leur durcissement.
