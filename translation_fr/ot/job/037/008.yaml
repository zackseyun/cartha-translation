  text: Then the wild animal enters its lair[a], and remains in its dens.
translation:
  language: fr
  text: Alors l’animal sauvage entre dans son repaire[a] et reste dans ses tanières.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entre dans sa cachette » ; le terme hébreu peut désigner un lieu où l’animal se dissimule ou se tient à l’affût.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Alors ... rentre
  rationale: Le wayyiqtol de בוא fait progresser la description. Le présent de narration convient à cette évocation vive des phénomènes naturels, tandis que « alors » marque la succession.
- source_word: חַיָּה
  choice: l’animal sauvage
  rationale: חַיָּה peut désigner une bête ou, plus généralement, un animal sauvage. Cette formulation moderne conserve la valeur générique sans suggérer une espèce précise.
- source_word: בְמוֹ אָרֶב
  choice: dans son repaire
  rationale: אָרֶב désigne ici un lieu caché où l’animal se tient à l’affût ou se retire. « Repaire » exprime naturellement en français ce refuge dissimulé.
- source_word: וּבִמְעוֹנֹתֶיהָ
  choice: et ... dans ses tanières
  rationale: מְעוֹנוֹת désigne des lieux d’habitation et le pluriel hébreu est conservé. Dans ce contexte animalier, « tanières » est idiomatique; le suffixe féminin singulier renvoie au nom générique חַיָּה.
- source_word: תִשְׁכֹּן
  choice: demeure
  rationale: שכן signifie habiter, séjourner ou rester. « Demeure » conserve l’idée d’un séjour continu dans l’abri, avec un registre digne mais courant.
