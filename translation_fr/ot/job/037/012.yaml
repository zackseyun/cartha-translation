source:
  edition: WLC
  text: וְ/ה֤וּא מְסִבּ֨וֹת מִתְהַפֵּ֣ךְ ב/תחבולת/ו לְ/פָעֳלָ֑/ם כֹּ֖ל אֲשֶׁ֥ר יְצַוֵּ֓/ם עַל פְּנֵ֖י תֵבֵ֣ל אָֽרְצָ/ה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/012.yaml
  text: It turns around and around by his guidance[c][b][a], to accomplish all that he commands them over the face of the inhabited world on the earth.
translation:
  language: fr
  text: Il tourne çà et là[a], sous sa direction[b], afin qu’ils accomplissent tout ce qu’il leur commande à la surface du monde habité, sur la terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « décrit des circuits » ou « tourne sans cesse » ; l’hébreu évoque un mouvement répété, circulaire ou changeant de direction.
    reason: lexical_alternative
  - marker: b
    text: Ou « selon sa conduite » ou « selon ses directives » ; le terme hébreu suggère une direction habile et maîtrisée.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « sur la face du monde habité, vers la terre » ; l’expression hébraïque superpose deux désignations du domaine terrestre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Il
  rationale: Le pronom hébreu est masculin singulier et renvoie à un phénomène météorologique évoqué dans le contexte. Le français conserve le pronom sans préciser davantage son référent.
- source_word: מְסִבּוֹת מִתְהַפֵּךְ
  choice: tournoie en tous sens
  rationale: Cette formulation réunit l’idée de mouvement circulaire ou répété et celle de changements de direction, dans un français naturel.
- source_word: בְּתַחְבֻּלֹתוֹ
  choice: sous sa direction
  rationale: Le nom évoque une conduite habile, un pilotage ou une maîtrise. Ici, il exprime la direction exercée par Dieu sur les phénomènes météorologiques.
- source_word: לְפָעֳלָם
  choice: afin qu’ils accomplissent
  rationale: Le suffixe pluriel désigne les agents météorologiques chargés d’exécuter ce qui leur est ordonné; la tournure finale rend la valeur de but.
- source_word: כֹּל אֲשֶׁר יְצַוֵּם
  choice: tout ce qu’il leur commande
  rationale: La traduction conserve le verbe « commander » et le complément pluriel explicite de l’hébreu.
- source_word: עַל־פְּנֵי תֵבֵל אָרְצָה
  choice: sur toute l’étendue du monde habité, sur la terre
  rationale: « Toute l’étendue » rend naturellement l’expression spatiale עַל־פְּנֵי; « monde habité » préserve la nuance de תֵבֵל, tandis que « sur la terre » maintient l’expression terrestre supplémentaire אָרְצָה sans la fondre dans la précédente.
theological_decisions:
- issue: Référent du pronom singulier et des suffixes pluriels dans le contexte météorologique
  choice: Le singulier « Il » désigne sans plus de précision le phénomène météorologique évoqué, tandis que « ils » renvoie aux agents météorologiques qui exécutent les ordres de Dieu.
  alternative: Comprendre plus précisément le singulier comme un nuage ou une masse nuageuse, et le pluriel comme les nuages, les éclairs ou l’ensemble des phénomènes de l’orage.
  rationale: Le contexte présente les nuages, les éclairs et l’orage comme soumis à Dieu, mais le verset ne permet pas d’identifier avec certitude un phénomène scientifique précis. La traduction préserve le passage du singulier au pluriel présent dans l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. « Tournoie en tous sens » garde l’image dynamique sans imposer une violence absente du texte. Le passage inhabituel du singulier « Il » au pluriel « ils » est volontairement conservé afin de ne pas effacer l’ambiguïté de l’hébreu.
