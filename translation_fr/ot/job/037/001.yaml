  text: At this also my heart trembles and leaps from its place[a][b].
translation:
  language: fr
  text: À cela aussi, mon cœur tremble et bondit hors de sa place[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frémit » au lieu de « tremble » ; le verbe hébreu peut évoquer un tremblement causé par la peur, la stupeur ou l’agitation.
    reason: lexical_alternative
  - marker: b
    text: Ou « saute hors de sa place » ; l’expression hébraïque représente vivement le cœur comme soudainement déplacé.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לְזֹאת
  choice: À cela aussi
  rationale: Cette formulation conserve à la fois le lien avec le phénomène évoqué précédemment et la valeur additive ou intensive de אַף, sans préciser excessivement la relation causale.
- source_word: יֶחֱרַד
  choice: tremble
  rationale: Le verbe חרד exprime un tremblement provoqué par la peur, la stupeur, l’agitation ou la crainte révérencielle. « Tremble » préserve cette amplitude sémantique.
- source_word: לִבִּי
  choice: mon cœur
  rationale: La traduction directe maintient l’image hébraïque du cœur comme siège de la vie intérieure et de l’émotion.
- source_word: וְיִתַּר
  choice: bondit
  rationale: Dans ce contexte, le verbe difficile יתר décrit vraisemblablement un mouvement brusque du cœur. « Bondit » restitue la vigueur de l’image sans l’aplatir en une simple agitation.
- source_word: מִמְּקוֹמוֹ
  choice: hors de sa place
  rationale: Le suffixe renvoie au cœur. « Hors de sa place » exprime naturellement en français l’idée vive d’un cœur soudainement déplacé, tout en restant proche de l’hébreu.
