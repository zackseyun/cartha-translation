source:
  edition: WLC
  text: יַרְעֵ֤ם אֵ֣ל בְּ֭/קוֹל/וֹ נִפְלָא֑וֹת עֹשֶׂ֥ה גְ֝דֹל֗וֹת וְ/לֹ֣א נֵדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/005.yaml
  text: God thunders wondrously with his voice[b][a]; he does great things that we do not know.
translation:
  language: fr
  text: Dieu tonne merveilleusement de sa voix[a] ; il accomplit de grandes choses que nous ne connaissons pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu tonne des merveilles de sa voix » ; le mot hébreu rendu par « merveilleusement » signifie plus littéralement « merveilles » ou « choses merveilleuses », mais il qualifie probablement ici la manière dont Dieu tonne.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de grandes choses qui dépassent notre connaissance » ou « de grandes choses que nous ne pouvons comprendre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְעֵם
  choice: tonne
  rationale: Le hiphil de רעם exprime ici la production du tonnerre. Dans le contexte de l’orage et de la voix divine, « tonne » est naturel et direct en français.
- source_word: אֵל
  choice: Dieu
  rationale: Le titre divin אֵל désigne ici Dieu sans exiger l’ajout d’un qualificatif tel que « Tout-Puissant ».
- source_word: בְּקוֹלוֹ
  choice: de sa voix
  rationale: Avec le verbe « tonner », « de sa voix » rend naturellement la relation instrumentale ou concomitante exprimée par בְּ, tout en conservant l’image de la voix divine.
- source_word: נִפְלָאוֹת
  choice: merveilleusement
  rationale: Bien que la forme soit un pluriel substantival pouvant signifier « merveilles », elle fonctionne probablement ici de manière adverbiale et qualifie la façon dont Dieu tonne.
- source_word: עֹשֶׂה
  choice: accomplit
  rationale: עשה a un sens large, « faire ». « Accomplit » convient aux grandes œuvres de Dieu dans un registre digne sans préciser indûment leur nature.
- source_word: גְדֹלוֹת
  choice: de grandes choses
  rationale: L’adjectif féminin pluriel est employé substantivement. « De grandes choses » en conserve la portée générale.
- source_word: וְלֹא נֵדָע
  choice: que nous ne connaissons pas
  rationale: Cette formulation rattache naturellement la proposition aux « grandes choses » et conserve le sens ordinaire de ידע, « connaître », sans le renforcer en « ne pouvons comprendre ».
theological_decisions:
- issue: Portée de l’ignorance humaine dans la proposition finale
  choice: Les grandes choses accomplies par Dieu sont présentées comme inconnues de nous.
  alternative: Dieu accomplit de grandes choses qui dépassent notre entendement ou que nous ne pouvons comprendre.
  rationale: Le verbe ידע signifie explicitement « connaître ». La traduction évite d’en faire une affirmation plus forte sur une incompréhensibilité absolue, tout en préservant la limite du savoir humain devant l’action divine.
- issue: Fonction de נִפְלָאוֹת
  choice: 'Lecture adverbiale : Dieu tonne « merveilleusement ».'
  alternative: 'Lecture comme complément interne : Dieu « fait tonner des merveilles » ou « tonne des merveilles ».'
  rationale: La morphologie permet de reconnaître le sens concret de « merveilles », mais le contexte et la syntaxe favorisent une valeur adverbiale. Une note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme bref et solennel de la poésie est conservé. « Tonne » maintient l’imagerie de l’orage ; « de sa voix » est plus idiomatique avec ce verbe que « avec sa voix ». Les deux ambiguïtés principales sont signalées sans alourdir le texte.
