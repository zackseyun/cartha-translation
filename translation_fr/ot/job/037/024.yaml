  text: לָ֭/כֵן יְרֵא֣וּ/הוּ אֲנָשִׁ֑ים לֹֽא יִ֝רְאֶ֗ה כָּל חַכְמֵי לֵֽב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/037/024.yaml
  text: Therefore men fear him[a]; he does not regard any who are wise of heart.
translation:
  language: fr
  text: C’est pourquoi les humains le craignent ; il ne considère aucun de ceux qui ont le cœur sage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « il ne voit pas tous ceux qui ont le cœur sage ». Le verbe hébreu peut signifier « voir » ou « considérer » ; la phrase peut souligner que la sagesse humaine ne mérite aucune considération devant Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion tirée de la description précédente de la grandeur de Dieu.
- source_word: יְרֵאוּהוּ
  choice: le craignent
  rationale: Conserve le sens direct de ירא et sa portée théologique, tout en laissant au contexte les nuances de crainte et de révérence.
- source_word: אֲנָשִׁים
  choice: les humains
  rationale: Le pluriel désigne ici les êtres humains en général ; cette formulation moderne rend clairement la portée générique.
- source_word: לֹא יִרְאֶה
  choice: il ne considère
  rationale: ראה signifie littéralement « voir », mais peut exprimer ici l’idée d’accorder de l’attention ou de la considération. Le choix reste idiomatique sans développer excessivement l’interprétation.
- source_word: כָּל
  choice: aucun de ceux
  rationale: Sous la négation, cette tournure française exprime naturellement la valeur distributive de כָּל.
- source_word: חַכְמֵי לֵב
  choice: ceux qui ont le cœur sage
  rationale: Préserve l’image hébraïque du cœur comme siège de la sagesse sans ajouter l’idée non explicite qu’ils seraient sages « à leurs propres yeux ».
theological_decisions:
- issue: Sens du fait que Dieu ne « voit » pas les sages de cœur
  choice: Dieu ne considère aucun de ceux qui ont le cœur sage.
  alternative: Il ne voit aucun de ceux qui ont le cœur sage.
  rationale: Le sujet implicite renvoie très probablement à Dieu. « Considère » rend la portée possible de « voir » au sens d’accorder de l’attention, tandis que la note maintient visible le sens littéral et l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. « Les humains » évite un masculin potentiellement ambigu tout en rendant le référent générique ; « le cœur sage » conserve la métaphore hébraïque.
