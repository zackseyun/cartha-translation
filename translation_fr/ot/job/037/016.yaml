source:
  edition: WLC
  text: הֲ֭/תֵדַע עַל מִפְלְשֵׂי עָ֑ב מִ֝פְלְא֗וֹת תְּמִ֣ים דֵּעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/016.yaml
  text: Do you know about the balancing of the clouds[a], the wonders of one perfect in knowledge?
translation:
  language: fr
  text: Sais-tu comment les nuages se tiennent en équilibre[a], ces merveilles de celui dont la connaissance est parfaite ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comment les nuages se déploient ». Le terme hébreu est rare et son sens précis reste incertain; il évoque probablement la manière dont les nuages sont étendus ou suspendus dans le ciel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: Sais-tu
  rationale: L’interrogation rhétorique adressée à Job est rendue directement et naturellement, sans renforcer ידע en « comprends-tu ».
- source_word: עַל
  choice: comment
  rationale: Avec le phénomène qui suit, le français idiomatique formule l’objet du savoir par « comment » plutôt que par le calque « au sujet de ».
- source_word: מִפְלְשֵׂי עָב
  choice: les nuages se tiennent en équilibre
  rationale: Le terme rare semble désigner la disposition, le déploiement ou la suspension des nuages. Cette formulation exprime naturellement leur maintien dans le ciel, tandis que l’incertitude lexicale est signalée en note.
- source_word: מִפְלְאוֹת
  choice: ces merveilles
  rationale: « Merveilles » rend le nom de façon concise et digne; le démonstratif explicite en français l’apposition avec le phénomène évoqué.
- source_word: תְּמִים דֵּעִים
  choice: celui dont la connaissance est parfaite
  rationale: La tournure exprime la plénitude de la connaissance en français naturel, tout en conservant le référent implicite du texte hébreu.
theological_decisions:
- issue: Référent de « celui dont la connaissance est parfaite »
  choice: Maintenir le référent implicite, naturellement compris comme Dieu dans le contexte
  alternative: Insérer explicitement « Dieu »; y voir une personne sage ou une allusion d’Élihou à lui-même
  rationale: Le contexte de la maîtrise divine des phénomènes météorologiques désigne très probablement Dieu, mais le texte hébreu ne le nomme pas ici. La traduction préserve cette formulation et sa tension.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est conservée; l’image météorologique reste concrète et l’incertitude du terme rare est documentée sans alourdir le verset.
