  text: כִּ֤י לַ/שֶּׁ֨לַג יֹאמַ֗ר הֱוֵ֫א אָ֥רֶץ וְ/גֶ֥שֶׁם מָטָ֑ר וְ֝/גֶ֗שֶׁם מִטְר֥וֹת עֻזּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/006.yaml
  text: For he says to the snow[a], ‘Fall to the earth,’ and to the rain, ‘Become a shower,’ and to the rains[b], ‘Become a downpour of his might.’
translation:
  language: fr
  text: 'Car il dit à la neige[a] : « Tombe sur la terre », à la pluie : « Deviens une averse », et aux pluies[b] : « Devenez des averses de sa puissance. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sois sur la terre », au sens où la neige reçoit l’ordre d’apparaître ou de rester étendue sur le sol.'
    reason: lexical_alternative
  - marker: b
    text: 'La fin du verset, très condensée en hébreu, peut aussi se traduire : « et les fortes pluies de sa puissance » ou « et les puissants torrents de pluie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication poétique de la maîtrise de Dieu sur les phénomènes météorologiques dans le contexte précédent.
- source_word: לַשֶּׁלַג
  choice: à la neige
  rationale: La préposition ל avec אמר désigne naturellement le destinataire de la parole et maintient la personnification.
- source_word: יֹאמַר
  choice: il dit
  rationale: L’imparfait hébreu décrit ici de manière vive et actuelle l’action habituelle de Dieu; le présent convient au français.
- source_word: הֱוֵא אָרֶץ
  choice: Tombe sur la terre
  rationale: L’impératif de היה signifie littéralement « sois »; appliqué à la neige et associé à « terre », il ordonne qu’elle apparaisse ou se dépose au sol. « Tombe » est naturel sans effacer l’alternative littérale, signalée en note.
- source_word: וְגֶשֶׁם מָטָר
  choice: 'à la pluie : « Deviens une averse »'
  rationale: Les deux termes proches, « pluie » et « averse », sont conservés dans une relation prédicative plausible, conformément au parallélisme des ordres divins.
- source_word: וְגֶשֶׁם מִטְרוֹת עֻזּוֹ
  choice: 'et aux pluies : « Devenez une manifestation de sa puissance »'
  rationale: 'La formulation hébraïque est dense : le pluriel מִטְרוֹת intensifie ou multiplie les pluies, tandis que עֻזּוֹ exprime la puissance. Cette traduction conserve le troisième membre et son caractère de commandement, tout en signalant d’autres analyses en note.'
- source_word: עֻזּוֹ
  choice: sa puissance
  rationale: Le suffixe masculin singulier renvoie le plus naturellement à Dieu, sujet implicite de la parole et maître des éléments dans le contexte.
theological_decisions:
- issue: Référent du suffixe dans עֻזּוֹ
  choice: 'Le suffixe renvoie à Dieu : « sa puissance ».'
  alternative: 'Le suffixe peut se rapporter à la pluie : « leur force » ou « sa force ».'
  rationale: Dieu est le locuteur et l’acteur dominant du passage; le rattachement à sa puissance s’accorde donc le mieux au contexte, sans rendre l’autre possibilité grammaticalement impossible.
translation_notes:
  register: Français international moderne, poétique mais accessible. Les impératifs adressés aux éléments naturels préservent la personnification. Les trois mentions successives de la neige, de la pluie et des pluies sont maintenues malgré leur légère redondance, car elle appartient à la structure du texte hébreu.
