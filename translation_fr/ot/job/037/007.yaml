review_pass:
  verdict: revise
  source_fidelity: Le verset rend bien l’image difficile de חתם avec « mettre un sceau sur la main » et conserve, sans la résoudre dans le texte, l’idée probable d’un arrêt de l’activité humaine. « Afin que » exprime correctement la valeur finale de לָדַעַת. Toutefois, « reconnaissent » peut impliquer l’aveu ou la reconnaissance d’une autorité, alors que ידע signifie plus directement « connaître »; ce dernier choix préserve mieux l’ouverture du texte.
  naturalness: La formulation est naturelle et digne en français international moderne. « Mettre un sceau sur la main » est une image inhabituelle, mais cette étrangeté est appropriée ici et est utilement éclairée par la note.
  terminology: « Tout être humain » rend avec justesse le singulier générique כָּל אָדָם. « Son œuvre » convient à מַעֲשֵׂהוּ et laisse le référent pronominal tel que le contexte le fournit, sans ajout doctrinal.
  issues:
  - severity: low
    issue: « reconnaissent son œuvre » est légèrement plus interprétatif que le verbe hébreu.
    rationale: Le verbe ידע vise d’abord le fait de connaître. « Reconnaître » peut suggérer une confession, une acceptation ou une identification déjà déterminée. « Connaissent » est plus directement fidèle tout en restant naturel.
