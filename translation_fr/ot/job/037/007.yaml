source:
  edition: WLC
  text: בְּ/יַד כָּל אָדָ֥ם יַחְתּ֑וֹם לָ֝/דַ֗עַת כָּל אַנְשֵׁ֥י מַעֲשֵֽׂ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/007.yaml
  text: He seals the hand of every man[b][a], so that all men may know his work.
translation:
  language: fr
  text: Il met un sceau sur la main de tout être humain[a], afin que tous connaissent son œuvre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Il scelle la main de tout être humain. » Cette expression signifie probablement que Dieu interrompt les activités humaines ordinaires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: sur la main
  rationale: Avec le verbe « sceller », la préposition בְּ peut ici être rendue naturellement par « sur ». L’expression imagée est conservée sans expliciter dans le texte qu’il s’agit vraisemblablement d’un arrêt du travail.
- source_word: כָּל אָדָם
  choice: tout être humain
  rationale: אָדָם est un singulier générique désignant chaque personne; « tout être humain » en exprime clairement la portée inclusive en français moderne.
- source_word: יַחְתּוֹם
  choice: il met un sceau
  rationale: Le qal de חתם signifie « sceller, apposer un sceau ». « Met un sceau » conserve la métaphore tout en produisant une tournure française plus naturelle que « scelle la main ».
- source_word: לָדַעַת
  choice: afin que … reconnaissent
  rationale: L’infinitif avec לְ exprime ici le but ou le résultat. Dans ce contexte, ידע peut signifier prendre connaissance ou reconnaître; « reconnaissent » rend naturellement l’idée de discerner l’œuvre divine.
- source_word: כָּל אַנְשֵׁי
  choice: tous
  rationale: Le groupe désigne collectivement tous les humains déjà mentionnés. Le pronom « tous » évite une répétition lourde sans restreindre la portée du masculin hébreu.
- source_word: מַעֲשֵׂהוּ
  choice: son œuvre
  rationale: Le nom singulier avec suffixe de troisième personne renvoie, dans le contexte, à l’activité de Dieu. « Son œuvre » garde le singulier collectif et le registre digne.
theological_decisions:
- issue: Référent de « il » et de « son »
  choice: Dieu
  alternative: Un sujet impersonnel, ou la tempête/l’hiver comme agent
  rationale: Dans le discours d’Élihou sur la maîtrise divine des phénomènes météorologiques, Dieu est l’antécédent contextuel le plus cohérent; le texte français conserve néanmoins les pronoms plutôt que d’ajouter explicitement « Dieu ».
- issue: Sens de l’image du sceau sur la main
  choice: Conserver l’image dans le texte et signaler en note son sens probable d’interruption du travail humain
  alternative: 'Paraphraser directement : « il arrête le travail de chacun »'
  rationale: L’hébreu est inhabituel et imagé. Une traduction explicative dans le corps du verset résoudrait une difficulté que le texte source laisse ouverte.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore hébraïque difficile est préservée sous une forme idiomatique; le langage générique est rendu de manière inclusive sans ajouter d’interprétation confessionnelle.
