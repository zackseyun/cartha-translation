  text: הַֽ/יְסֻפַּר ל֭/וֹ כִּ֣י אֲדַבֵּ֑ר אִֽם אָ֥מַר אִ֝֗ישׁ כִּ֣י יְבֻלָּֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/020.yaml
  text: Should it be told to him that I would speak? If a man speaks[c][b][a], surely he would be swallowed up.
translation:
  language: fr
  text: Lui[a] annoncera-t-on que je parlerais ? Si un homme[b] parle, il sera certainement englouti.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom renvoie à Dieu. La majuscule de « Lui » est ici imposée par sa position initiale ; elle ne marque pas une majuscule révérentielle.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un homme » ; le mot peut avoir ici le sens générique de « quelqu’un » ou « quiconque ».
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu de ce verset est difficile. Autre traduction possible : « Lui annoncera-t-on que je parle ? Ou un homme dira-t-il qu’il serait englouti ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיְסֻפַּר
  choice: annoncera-t-on
  rationale: La forme passive de ספר avec l’interrogatif הֲ exprime une question sur le fait de rapporter quelque chose. La tournure française avec « on » rend naturellement ce passif impersonnel.
- source_word: לוֹ
  choice: lui
  rationale: Le pronom renvoie à Dieu dans le contexte, sans que l’hébreu comporte de majuscule révérentielle.
- source_word: כִּי אֲדַבֵּר
  choice: que je veux parler
  rationale: 'כִּי introduit ici le contenu de ce qui serait annoncé, tandis que l’inaccompli אֲדַבֵּר a une nuance modale : il s’agit d’une prise de parole envisagée.'
- source_word: אִם אָמַר אִישׁ
  choice: si un homme parle
  rationale: Cette formulation conserve la construction conditionnelle, le singulier masculin אִישׁ et le caractère laconique de l’hébreu, sans ajouter de complément absent du texte.
- source_word: כִּי יְבֻלָּע
  choice: il sera certainement englouti
  rationale: Le passif de בלע évoque le fait d’être englouti ou dévoré. Ici, כִּי peut renforcer l’affirmation qui découle de l’hypothèse.
theological_decisions:
- issue: Référent du pronom לוֹ
  choice: Employer « lui » dans le texte principal
  alternative: Employer « Lui » pour signaler explicitement Dieu
  rationale: Le contexte indique que Dieu est le référent, mais l’hébreu ne marque pas les pronoms divins par une majuscule. La note rend le référent explicite sans introduire cette convention typographique dans le texte.
- issue: Portée de אִישׁ
  choice: Traduire par « un homme »
  alternative: Traduire par « quelqu’un » ou « quiconque »
  rationale: « Un homme » reproduit directement le nom masculin singulier hébreu, tandis que la note signale sa possible valeur générique dans ce contexte.
- issue: Syntaxe difficile du second membre
  choice: Conserver une proposition conditionnelle suivie de sa conséquence
  alternative: 'Comprendre : « Ou un homme dira-t-il qu’il serait englouti ? »'
  rationale: La syntaxe hébraïque est très condensée et permet plusieurs analyses. Le texte principal suit une lecture cohérente sans dissimuler l’autre construction possible, donnée en note.
translation_notes:
  register: Français international moderne, digne et direct. L’inversion interrogative maintient le ton rhétorique. « Englouti » conserve l’image forte de l’hébreu, et les notes préservent les ambiguïtés référentielles et syntaxiques sans alourdir le texte principal.
