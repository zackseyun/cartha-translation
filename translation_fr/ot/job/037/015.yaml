source:
  edition: WLC
  text: הֲ֭/תֵדַע בְּ/שׂוּם אֱל֣וֹהַּ עֲלֵי/הֶ֑ם וְ֝/הוֹפִ֗יעַ א֣וֹר עֲנָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/015.yaml
  text: Do you know how God lays these upon them[b][a], and causes the light of his cloud to shine?
translation:
  language: fr
  text: Sais-tu comment Dieu impose cela sur eux[a] et fait briller la lumière de sa nuée[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « quand Dieu impose cela sur eux », « quand Dieu les établit » ou « comment Dieu les assigne ». L’expression hébraïque est concise : elle ne précise pas ce qui est ainsi imposé, et le référent de « eux » reste implicite dans le contexte.'
    reason: alternative_reading
  - marker: b
    text: Ou « fait éclater la clarté de sa nuée » ou « fait briller la lumière de son nuage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: Sais-tu
  rationale: Le qal inaccompli à la deuxième personne du masculin singulier introduit une question rhétorique adressée à Job. « Sais-tu » est direct et naturel.
- source_word: בְּשׂוּם
  choice: comment … agit
  rationale: La préposition ב avec l’infinitif construit de שׂום peut exprimer la circonstance (« quand Dieu place ») ou, après « Sais-tu », la manière (« comment Dieu dispose/agit »). Comme l’objet de שׂום n’est pas exprimé, « agit sur eux » conserve cette ellipse sans ajouter « ces choses », absent de l’hébreu.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: אֱלוֹהַּ est la forme poétique singulière courante pour « Dieu » dans Job; aucune expansion n’est justifiée ici.
- source_word: עֲלֵיהֶם
  choice: sur eux
  rationale: La préposition עַל munie du suffixe masculin pluriel signifie « sur eux ». Le référent demeure implicite dans le contexte, comme en hébreu.
- source_word: וְהוֹפִיעַ
  choice: et fait jaillir
  rationale: Le hifil de יפע exprime le fait de faire paraître ou rayonner une clarté. « Fait jaillir » convient à l’apparition vive de la lumière dans la nuée, tout en permettant une lecture liée à l’éclair.
- source_word: אוֹר
  choice: la lumière
  rationale: אוֹר désigne la lumière ou la clarté. « La lumière » rend naturellement la construction avec « sa nuée ».
- source_word: עֲנָנוֹ
  choice: sa nuée
  rationale: Le nom singulier avec suffixe de troisième personne est maintenu au singulier. « Nuée » appartient à un registre poétique digne et reste compréhensible en français moderne.
theological_decisions:
- issue: Objet implicite de שׂום et référent de « eux »
  choice: Conserver l’indétermination par « comment Dieu agit sur eux »
  alternative: « quand Dieu les met en place », « comment Dieu leur donne ses ordres » ou « comment Dieu place ces choses sur eux »
  rationale: 'L’hébreu est compact : aucun objet explicite ne suit שׂום, et le suffixe pluriel renvoie au contexte. La formulation retenue évite d’identifier arbitrairement « eux » aux nuages, aux éclairs ou à d’autres phénomènes météorologiques.'
- issue: Nature de la lumière de la nuée
  choice: « fait jaillir la lumière de sa nuée »
  alternative: « fait briller la lumière de sa nuée » ou « fait éclater la clarté de sa nuée »
  rationale: Le texte peut évoquer une lumière qui rayonne ou un éclair. « Fait jaillir » préserve cette tension imagée sans imposer explicitement le mot « éclair ».
translation_notes:
  register: Français international moderne, naturel et digne. « Nuée » garde la couleur poétique de Job; les notes rendent explicites l’ambiguïté syntaxique et la possibilité d’une lumière fulgurante.
