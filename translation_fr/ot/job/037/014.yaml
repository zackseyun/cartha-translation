source:
  edition: WLC
  text: הַאֲזִ֣ינָ/ה זֹּ֣את אִיּ֑וֹב עֲ֝מֹ֗ד וְ/הִתְבּוֹנֵ֤ן נִפְלְא֬וֹת אֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/014.yaml
  text: Listen to this[a], Job[c][b]; stand still and consider the wonders of God.
translation:
  language: fr
  text: Écoute ceci[a], Job ; arrête-toi[b] et considère les merveilles de Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Prête l’oreille à ceci ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tiens-toi debout » ; on peut aussi comprendre « reste en place ».
    reason: lexical_alternative
  - marker: c
    text: Ou « les œuvres merveilleuses de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Écoute
  rationale: L’impératif appelle Job à une écoute attentive. « Écoute » est direct, naturel en français moderne et conserve la force de l’appel.
- source_word: זֹּאת
  choice: ceci
  rationale: Le démonstratif féminin singulier renvoie naturellement aux paroles auxquelles Élihou demande à Job de prêter attention. « Écoute ceci » est idiomatique et ne précise pas indûment si le renvoi porte sur ce qui précède ou ce qui suit.
- source_word: אִיּוֹב
  choice: Job
  rationale: Forme française traditionnelle et standard du nom propre.
- source_word: עֲמֹד
  choice: arrête-toi
  rationale: Le verbe signifie littéralement « tiens-toi debout » ou « reste en place ». Dans cette suite d’impératifs, il invite Job à s’immobiliser pour réfléchir ; « arrête-toi » exprime naturellement cette valeur contextuelle.
- source_word: וְהִתְבּוֹנֵן
  choice: et considère
  rationale: La forme verbale exprime une observation réfléchie et attentive. « Considère » en garde la concision et la gravité.
- source_word: נִפְלְאוֹת
  choice: les merveilles
  rationale: Le pluriel désigne ce qui est extraordinaire ou merveilleux, notamment les actes étonnants de Dieu. « Les merveilles » préserve l’expression nominale sans limiter explicitement le sens aux seuls actes.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל désigne ici Dieu. « Dieu » est la traduction française sobre et habituelle ; « Dieu puissant » ajouterait une insistance que le contexte immédiat n’exige pas.
theological_decisions:
- issue: Rendu du titre divin אֵל
  choice: Dieu
  alternative: Dieu puissant
  rationale: Le texte attribue les merveilles à Dieu sans mettre explicitement l’accent sur une qualification particulière. Le rendu simple évite de surinterpréter le titre.
- issue: Portée de נִפְלְאוֹת
  choice: les merveilles de Dieu
  alternative: les œuvres merveilleuses de Dieu
  rationale: Le nom peut évoquer les actes extraordinaires de Dieu, mais « merveilles » conserve la formulation plus ouverte de l’hébreu et n’impose pas une explicitation absente du verset.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs restent nets, tandis que les notes signalent les nuances concrètes de עמד et la portée possible de נִפְלְאוֹת.
