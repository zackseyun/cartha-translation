  text: אִם לְ/שֵׁ֥בֶט אִם לְ/אַרְצ֑/וֹ אִם לְ֝/חֶ֗סֶד יַמְצִאֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/013.yaml
  text: Whether for correction[a], or for his land, or for steadfast love[c][b], he causes it to happen.
translation:
  language: fr
  text: Soit pour corriger[a], soit pour sa terre, soit par amour fidèle[b], il le fait survenir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour un bâton », c’est-à-dire pour le châtiment ou la discipline.
    reason: lexical_alternative
  - marker: b
    text: Ou « par bonté » ou « par bienveillance ».
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu peut aussi se traduire par « il le fait venir » ou « il le provoque ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם ... אִם ... אִם
  choice: soit… soit… soit
  rationale: La triple répétition introduit ici plusieurs finalités possibles plutôt qu’une simple condition. Cette construction française restitue clairement la série disjonctive.
- source_word: לְשֵׁבֶט
  choice: pour corriger
  rationale: שֵׁבֶט désigne littéralement une « baguette » ou un « bâton », mais fonctionne ici par métonymie pour la correction, le châtiment ou la discipline. « Pour corriger » conserve cette portée sans réduire le sens à un châtiment exclusivement punitif.
- source_word: לְאַרְצוֹ
  choice: pour sa terre
  rationale: 'אֶרֶץ peut désigner la terre ou un pays. Le suffixe masculin singulier renvoie naturellement à Dieu : le phénomène est dirigé au bénéfice ou en direction de « sa terre ».'
- source_word: לְחֶסֶד
  choice: par amour fidèle
  rationale: חֶסֶד exprime un amour bienveillant, fidèle et durable. « Amour fidèle » en conserve la richesse, tandis que « par » rend idiomatiquement en français la motivation bienveillante de l’action.
- source_word: יַמְצִאֵהוּ
  choice: il le fait arriver
  rationale: La forme causative de מצא indique que Dieu fait parvenir ou survenir le phénomène météorologique évoqué dans le contexte. Le pronom « le » maintient la référence implicite sans ajouter un nom absent de l’hébreu.
theological_decisions:
- issue: Finalité divine des phénomènes météorologiques dans les trois propositions
  choice: 'Le verset présente trois finalités possibles : correction, action en faveur de la terre de Dieu, ou manifestation de son amour fidèle.'
  alternative: Les propositions pourraient indiquer des destinations plutôt que des finalités, et la première pourrait désigner plus précisément un châtiment.
  rationale: La répétition de אִם avec לְ, dans le contexte où Dieu dirige les nuages, favorise une série de finalités ou de résultats. La formulation française maintient ensemble jugement, providence et bienveillance sans privilégier un seul aspect.
translation_notes:
  register: Français international moderne, sobre et soutenu. La triple structure « soit… soit… soit » reproduit le rythme de l’hébreu. Les pronoms restent volontairement implicites comme dans le texte source, tout en demeurant compréhensibles grâce au contexte immédiat.
