id: JOB.37.18
reference: Job 37:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תַּרְקִ֣יעַ עִ֭מּ/וֹ לִ/שְׁחָקִ֑ים חֲ֝זָקִ֗ים כִּ/רְאִ֥י מוּצָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/018.yaml
  text: Can you[a], with him, spread out the skies[c][b], hard as a cast metal mirror?
translation:
  language: fr
  text: Peux-tu, avec lui, étendre[a] les cieux[b], solides comme un miroir de métal coulé[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « marteler les cieux » ou « déployer les cieux ». Le verbe hébreu peut évoquer aussi bien le martelage qui amincit le métal que l’action d’étendre quelque chose.
    reason: lexical_alternative
  - marker: b
    text: Ou « les hauteurs célestes » ou « les nuages ». Le terme hébreu שׁחקים est poétique et peut désigner les cieux ou, selon le contexte, les nuages.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « comme un miroir coulé ». Dans l’Antiquité, les miroirs étaient en métal poli; l’image présente les cieux comme une surface solide et brillante, façonnée par un artisan.'
    reason: cultural_note
lexical_decisions:
- source_word: תַּרְקִיעַ
  choice: étendre
  rationale: Le hiphil de רקע peut désigner l’action d’étendre une matière ou de la marteler pour l’amincir, notamment du métal. « Étendre » est naturel en français tout en laissant la note expliciter l’image métallurgique.
- source_word: עִמּוֹ
  choice: avec lui
  rationale: L’hébreu emploie un pronom dont le référent contextuel est Dieu. Le conserver évite d’expliciter dans le texte principal ce que la formulation source laisse implicite.
- source_word: לִשְׁחָקִים
  choice: les cieux
  rationale: שׁחקים est un terme poétique pouvant désigner les cieux, les hauteurs célestes ou les nuages. Ici, la comparaison avec un miroir métallique favorise l’image de la voûte céleste.
- source_word: חֲזָקִים
  choice: solides
  rationale: Dans cette comparaison métallurgique, « solides » exprime la fermeté attribuée aux cieux plus naturellement que « forts ».
- source_word: כִּרְאִי
  choice: comme un miroir
  rationale: ראי désigne un miroir et le préfixe כ introduit directement la comparaison.
- source_word: מוּצָק
  choice: de métal coulé
  rationale: Le participe évoque une matière versée ou coulée, particulièrement du métal. « De métal coulé » rend l’image sans préciser indûment qu’il s’agirait de bronze.
theological_decisions:
- issue: Référent du pronom עִמּוֹ
  choice: Conserver « avec lui »
  alternative: « avec Dieu »
  rationale: Le contexte identifie Dieu, mais le verset hébreu maintient un pronom; la traduction préserve cette formulation et sa cohésion discursive.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe interrogative reste directe. « Cieux » conserve le registre poétique du terme hébreu, tandis que « miroir de métal coulé » rend l’image ancienne intelligible sans l’aplanir.
