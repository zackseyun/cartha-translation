  variant: modern international French
source:
  edition: WLC
  text: הֵ֣ן עַד יָ֭רֵחַ וְ/לֹ֣א יַאֲהִ֑יל וְ֝/כוֹכָבִ֗ים לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/005.yaml
  text: Behold[a], even the moon does not shine[b], and the stars are not pure in his eyes.
translation:
  language: fr
  text: Même la lune ne brille pas[a], et les étoiles ne sont pas pures[b] à ses yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’est pas éclatante » ou « ne donne pas de lumière ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne sont pas nettes »; peut-être aussi « ne sont pas brillantes » à ses yeux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Même
  rationale: הֵן introduit avec insistance l’observation; en français, sa force se combine naturellement avec עַד dans « Même la lune », sans ajouter un « voici » peu idiomatique ici.
- source_word: עַד יָרֵחַ
  choice: même la lune
  rationale: Dans cette construction, עַד a une valeur intensive plutôt que spatiale ou temporelle.
- source_word: לֹא יַאֲהִיל
  choice: ne brille pas
  rationale: Rend naturellement le sens causatif du verbe dans ce contexte lumineux, tout en conservant l’alternative « ne donne pas de lumière » en note.
- source_word: וְכוֹכָבִים
  choice: et les étoiles
  rationale: Reproduit simplement la coordination et l’image céleste du texte hébreu.
- source_word: לֹא זַכּוּ
  choice: ne sont pas pures
  rationale: Le verbe peut évoquer la pureté, la netteté ou l’éclat. « Pures » convient à l’évaluation exprimée par « à ses yeux » sans supprimer l’ambiguïté lexicale, signalée en note.
- source_word: בְעֵינָיו
  choice: à ses yeux
  rationale: Expression française naturelle qui conserve l’image et le sens évaluatif de l’idiome hébreu.
theological_decisions:
- issue: Référent du suffixe masculin singulier dans בְעֵינָיו
  choice: « ses » renvoie à Dieu
  alternative: Le suffixe pourrait grammaticalement renvoyer à un observateur non précisé.
  rationale: Dans le contexte de Job 25.2–6, Bildad parle de la grandeur de Dieu et de l’impureté des créatures devant lui. Le pronom français conserve toutefois la référence implicite du texte hébreu.
translation_notes:
  register: Français international moderne, sobre et poétique. L’ordre des propositions et le parallélisme céleste sont conservés; l’emphase initiale est intégrée à « Même la lune » pour éviter une tournure artificielle.
