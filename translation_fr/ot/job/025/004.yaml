id: JOB.25.4
reference: Job 25:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מַה יִּצְדַּ֣ק אֱנ֣וֹשׁ עִם אֵ֑ל וּ/מַה יִּ֝זְכֶּ֗ה יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/004.yaml
  text: So how can man be righteous before God? And how can one born of woman be pure?[a][b]
translation:
  language: fr
  text: Comment donc l’être humain pourrait-il être juste devant Dieu ? Et comment celui qui est né d’une femme pourrait-il être pur ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec Dieu » ; l’expression peut désigner la condition d’une personne devant lui.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « être sans tache » ou « être innocent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה
  choice: Comment donc… pourrait-il
  rationale: L’interrogatif מַה introduit ici une question rhétorique; « comment… pourrait-il » en rend naturellement la force, tandis que « donc » exprime le lien avec le contexte.
- source_word: יִצְדַּק
  choice: être juste
  rationale: Le qal de צדק désigne le fait d’être juste ou d’avoir raison. « Être juste » conserve la portée morale et relationnelle sans imposer une nuance strictement forensic de justification.
- source_word: אֱנוֹשׁ
  choice: l’être humain
  rationale: אֱנוֹשׁ désigne l’humain, avec une possible connotation de fragilité mortelle. « L’être humain » rend clairement la valeur générique en français moderne.
- source_word: עִם אֵל
  choice: devant Dieu
  rationale: La formulation est littéralement « avec Dieu », mais elle concerne ici la condition de l’être humain par rapport à Dieu. « Devant Dieu » est idiomatique et laisse percevoir une nuance de comparution ou d’évaluation.
- source_word: יִזְכֶּה
  choice: être pur
  rationale: Le qal de זכה peut signifier être pur, propre ou innocent. « Être pur » s’accorde naturellement avec le parallélisme de « être juste » sans réduire le sens à la seule innocence juridique.
- source_word: יְלוּד אִשָּׁה
  choice: celui qui est né d’une femme
  rationale: Cette expression désigne un humain dans sa condition créée et mortelle. La traduction conserve l’image hébraïque et sa portée générique.
theological_decisions:
- issue: Langage générique sur l’humanité
  choice: l’être humain… celui qui est né d’une femme
  alternative: un mortel… l’enfant d’une femme
  rationale: Le singulier hébreu est représentatif de toute l’humanité. Cette formulation moderne et inclusive maintient le parallélisme sans limiter le propos aux hommes de sexe masculin.
- issue: Condition humaine par rapport à Dieu
  choice: devant Dieu
  alternative: avec Dieu
  rationale: La préposition signifie littéralement « avec », mais le contexte porte sur la justice de l’humain en relation avec Dieu, avec une possible nuance judiciaire. « Devant Dieu » préserve cette tension sans développer une doctrine particulière de la justification.
translation_notes:
  register: Français international moderne, naturel et digne. La structure en deux questions parallèles est conservée; le conditionnel « pourrait-il » rend la force rhétorique de l’imparfait hébreu dans ce contexte.
