  text: Dominion and dread are with him[b][a]; he makes peace in his heights.
translation:
  language: fr
  text: La domination et la crainte sont avec lui[a] ; il fait la paix dans ses hauteurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La domination et la crainte lui appartiennent. »'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « dans ses lieux élevés » ; l’expression désigne probablement le domaine céleste exalté.'
