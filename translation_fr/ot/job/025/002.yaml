lexical_decisions:
- source_word: הַמְשֵׁל
  choice: la domination
  rationale: Le nom désigne l’exercice du pouvoir ou la domination. « La domination » conserve ici le caractère abstrait et le parallélisme nominal de l’hébreu, sans la nuance théologique plus marquée de « souveraineté ».
- source_word: וָפַחַד
  choice: et la crainte
  rationale: פחד peut exprimer la peur, l’effroi ou la terreur. « La crainte » convient au registre poétique et peut évoquer la peur imposée par la majesté divine sans accentuer jusqu’à « terreur ».
- source_word: עִמּוֹ
  choice: sont avec lui
  rationale: La locution signifie littéralement « avec lui ». Le verbe « sont », absent de la proposition nominale hébraïque, est ajouté pour former une phrase française naturelle tout en préservant l’ambiguïté entre présence et appartenance.
- source_word: עֹשֶׂה
  choice: il établit
  rationale: Le participe de עשה décrit ici une action caractéristique. Avec « la paix », « établir » est idiomatique en français et rend l’idée d’une paix produite ou maintenue, sans préciser davantage son mode d’action.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: שלום peut désigner la paix, l’intégrité ou le bien-être. Dans ce cadre cosmique, « la paix » est la formulation française la plus naturelle et conserve la portée ouverte du terme.
- source_word: בִּמְרוֹמָיו
  choice: dans ses hauteurs
  rationale: Le pluriel מרומים avec suffixe signifie littéralement « ses hauteurs ». Cette formulation garde l’image élevée et poétique, sans expliciter en « cieux » ce qui demeure implicite.
theological_decisions:
- issue: Nature de la proposition initiale
  choice: La domination et la crainte sont présentées comme étant avec Dieu.
  alternative: « La domination et la crainte lui appartiennent. »
  rationale: La proposition nominale hébraïque et עִמּוֹ permettent une lecture d’accompagnement ou une paraphrase possessive. Le texte principal conserve la tournure transparente « avec lui » afin de ne pas résoudre cette nuance.
translation_notes:
  register: Français international moderne, digne et poétique. L’ordre des deux noms et la formulation « avec lui » suivent étroitement la proposition nominale hébraïque. « Ses hauteurs » conserve l’image cosmique sans l’expliciter abusivement.
