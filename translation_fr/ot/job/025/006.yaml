  text: אַ֭ף כִּֽי אֱנ֣וֹשׁ רִמָּ֑ה וּ/בֶן אָ֝דָ֗ם תּוֹלֵעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/025/006.yaml
  text: how much less man[a], who is a maggot, and the son of man[b], who is a worm!
translation:
  language: fr
  text: 'Combien moins l’homme[a], qui n’est qu’un asticot,

    et le fils de l’homme[b], qui n’est qu’un ver !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le mortel » ; le mot hébreu met souvent en relief la fragilité humaine.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le fils de l’homme » ; il s’agit ici d’une expression poétique désignant un être humain, et non d’un titre messianique.
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: combien moins
  rationale: 'Dans la suite de l’argument de Bildad, cette locution introduit une conclusion a fortiori : si même les astres ne sont pas purs devant Dieu, l’être humain l’est encore moins.'
- source_word: אֱנוֹשׁ
  choice: l’homme
  rationale: Le nom désigne ici l’être humain dans sa fragilité mortelle. « L’homme » conserve la forme représentative singulière et le parallélisme poétique.
- source_word: רִמָּה
  choice: asticot
  rationale: Le terme désigne notamment une larve associée à la décomposition. « Asticot » maintient son caractère concret et le distingue de תּוֹלֵעָה, rendu par « ver ».
- source_word: בֶן אָדָם
  choice: le fils de l’homme
  rationale: La traduction proche de la forme hébraïque préserve le parallélisme et l’image poétique. Dans ce passage, l’expression désigne simplement un être humain.
- source_word: תּוֹלֵעָה
  choice: ver
  rationale: Ce terme plus général convient au second membre du parallèle et reste distinct de « asticot ».
theological_decisions:
- issue: Valeur de l’expression « fils de l’homme »
  choice: expression poétique non titulaire désignant un être humain
  alternative: titre messianique
  rationale: Dans ce verset, בֶן אָדָם est parallèle à אֱנוֹשׁ et souligne la faiblesse de l’humanité ; rien dans le contexte n’en fait un titre messianique.
translation_notes:
  register: Français moderne, sobre et poétique. « Asticot » conserve la force concrète, voire choquante, de l’image hébraïque, tandis que « ver » rend le terme parallèle plus général. Le verset demeure syntaxiquement lié à l’argument du verset précédent.
