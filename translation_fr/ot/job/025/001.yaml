lexical_decisions:
- source_word: וַיַּעַן
  choice: prit la parole
  rationale: Dans cette formule narrative introduisant une réplique, ענה signale que Bildad répond dans le dialogue. « Prit la parole » est naturel en français moderne et évite la lourdeur de « répondit et dit ».
- source_word: בִּלְדַּד
  choice: Bildad
  rationale: Le nom propre est translittéré selon sa forme française traditionnelle.
- source_word: הַשֻּׁחִי
  choice: le Shuhite
  rationale: Ce gentilé désigne l’origine clanique ou géographique de Bildad. « Shuhite » conserve la forme traditionnellement établie en français.
- source_word: וַיֹּאמַר
  choice: 'prit la parole :'
  rationale: אמר appartient ici à la formule d’introduction du discours. Les deux verbes hébreux sont rendus ensemble par une expression française idiomatique, et les deux-points annoncent directement les paroles qui suivent.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: 'Alors ... prit la parole :'
  rationale: « Alors » marque la progression du dialogue portée par la séquence narrative hébraïque. La formule française restitue sa fonction sans reproduire littéralement le redoublement verbal, peu naturel en français.
