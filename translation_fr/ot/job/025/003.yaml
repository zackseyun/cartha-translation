  text: הֲ/יֵ֣שׁ מִ֭סְפָּר לִ/גְדוּדָ֑י/ו וְ/עַל מִ֝֗י לֹא יָק֥וּם אוֹרֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/003.yaml
  text: Is there any number to his troops? And upon whom does his light not rise?[a][b][c]
translation:
  language: fr
  text: Peut-on compter ses troupes[a] ? Et sur qui sa lumière ne se lève-t-elle pas[b][c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses armées » ou « ses bandes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Et sur qui sa lumière ne surgit-elle pas ? »
    reason: lexical_alternative
  - marker: c
    text: « Sa lumière » peut désigner l’illumination universelle de Dieu, sa splendeur ou sa portée ; l’hébreu ne précise pas davantage.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֵשׁ מִסְפָּר
  choice: Peut-on compter
  rationale: Cette tournure française naturelle exprime la question existentielle et l’idée d’un nombre dénombrable, dans un contexte où la réponse implicite est négative.
- source_word: לִגְדוּדָיו
  choice: ses troupes
  rationale: גְּדוּד désigne une troupe, une bande ou une unité armée. « Troupes » convient au contexte de la souveraineté et de la puissance divines.
- source_word: וְעַל־מִי
  choice: Et sur qui
  rationale: « Sur qui » conserve simplement la métaphore spatiale portée par עַל.
- source_word: לֹא יָקוּם
  choice: ne se lève-t-elle pas
  rationale: קוּם signifie « se lever, surgir ». Avec la lumière comme sujet, « se lever » est idiomatique en français et préserve l’image du texte.
- source_word: אוֹרֵהוּ
  choice: sa lumière
  rationale: אוֹר signifie « lumière » et le suffixe masculin singulier est rendu par « sa ». Ce choix littéral laisse ouverte la portée physique ou métaphorique de l’image.
theological_decisions:
- issue: Référent des suffixes masculins singuliers dans « ses troupes » et « sa lumière »
  choice: Les pronoms renvoient à Dieu dans le discours de Bildad.
  alternative: Ils pourraient, hors contexte, renvoyer plus généralement à un souverain céleste.
  rationale: Le verset précédent parle de la domination et de la crainte qui appartiennent à Dieu. La traduction garde toutefois les possessifs au lieu d’expliciter « de Dieu », restant ainsi proche de l’hébreu.
- issue: Sens de « sa lumière »
  choice: L’expression est conservée comme une image large de la lumière divine dont la portée est universelle.
  alternative: Elle peut désigner plus précisément la lumière solaire, la splendeur divine ou son influence.
  rationale: L’hébreu ne précise pas la nature de cette lumière. Le texte principal maintient donc l’ambiguïté sans imposer une interprétation particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation interrogative garde le parallélisme poétique et la réponse négative implicite, sans préciser au-delà de l’hébreu la nature des troupes ni celle de la lumière.
