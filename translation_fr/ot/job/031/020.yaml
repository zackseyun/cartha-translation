  text: if his loins have not blessed me[b][a], and if he was not warmed by the fleece of my sheep—
translation:
  language: fr
  text: 'si ses reins ne m’ont pas béni[a],

    et s’il ne s’est pas réchauffé avec la toison[b] de mes moutons —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses reins ». Cette expression corporelle désigne ici la personne nécessiteuse, vêtue et réchauffée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avec la laine ». Le nom hébreu peut désigner la toison ou la laine tondue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: si… ne… pas
  rationale: Dans la formule de serment de Job, la construction introduit une condition liée à l’imprécation sous-entendue. La traduction conserve cette forme conditionnelle sans expliciter la conséquence.
- source_word: בֵרֲכוּנִי
  choice: ne m’ont pas béni
  rationale: Le verbe signifie normalement « bénir ». Ici, la bénédiction exprime vraisemblablement la reconnaissance du nécessiteux, mais le maintien de l’image hébraïque préserve sa portée affective et théologique.
- source_word: חֲלָצָיו
  choice: ses reins
  rationale: Le nom désigne la région des reins ou de la taille et représente ici, par métonymie, le corps vêtu et réchauffé. « Ses reins » conserve l’expression corporelle de l’hébreu, éclairée par une note.
- source_word: וּמִגֵּז
  choice: avec la toison
  rationale: גֵּז peut désigner la toison ou la laine tondue. « Avec » rend naturellement la valeur instrumentale de la préposition dans ce contexte.
- source_word: כְּבָשַׂי
  choice: de mes brebis
  rationale: Dans ce contexte de production de laine, « brebis » est plus naturel en français que « agneaux », tout en restant dans le champ sémantique du terme hébreu.
- source_word: יִתְחַמָּם
  choice: ne s’est pas réchauffé
  rationale: Le hitpael exprime ici le fait de devenir ou de se tenir au chaud. La forme pronominale française restitue naturellement ce sens.
