  text: וְ/אֹכַ֣ל פִּתִּ֣/י לְ/בַדִּ֑/י וְ/לֹא אָכַ֖ל יָת֣וֹם מִמֶּֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/017.yaml
  text: if I ate my morsel by myself[a], and the fatherless did not eat from it—
translation:
  language: fr
  text: 'si j’ai mangé ma bouchée seul,

    sans que l’orphelin[a] en mange—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui est privé de père ». L’hébreu désigne littéralement une personne sans père.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹכַל
  choice: si j’ai mangé
  rationale: Dans la série de serments de Job 31, le waw introduit ici une proposition conditionnelle; « si » rend en français la fonction de cette protase.
- source_word: פִּתִּי
  choice: mon morceau de pain
  rationale: פַּת désigne un morceau ou une bouchée, souvent de pain. « Morceau de pain » conserve l’image concrète et sonne plus naturellement ici que « ma bouchée ».
- source_word: לְבַדִּי
  choice: seul
  rationale: Le terme signifie « seul, par moi-même »; « seul » est direct et naturel avec le verbe manger.
- source_word: וְלֹא אָכַל
  choice: sans que … en mange
  rationale: La coordination négative appartient à la même condition. « Sans que » exprime naturellement en français que Job aurait exclu l’orphelin de son repas, sans transformer le sens fondamental.
- source_word: יָתוֹם
  choice: l’orphelin
  rationale: Le mot hébreu désigne précisément une personne privée de père. En français moderne, « l’orphelin » est l’équivalent courant et digne; « celui qui n’a plus de père » serait plus précis mais lourd.
- source_word: מִמֶּנָּה
  choice: en
  rationale: Le suffixe féminin renvoie à פִּתִּי. Le pronom adverbial français « en » rend idiomatiquement « de cela / de ce morceau ».
theological_decisions:
- issue: Portée sociale de יָתוֹם
  choice: l’orphelin
  alternative: celui qui n’a plus de père
  rationale: Le choix conserve la catégorie biblique de la personne vulnérable sans ajouter de précision doctrinale; la nuance lexicale stricte est signalée en note.
translation_notes:
  register: Français moderne, sobre et solennel. La tournure conditionnelle maintient la formule de serment du chapitre. La proposition négative est formulée idiomatiquement, et « lui aussi » fait ressortir le partage implicite sans modifier le référent.
