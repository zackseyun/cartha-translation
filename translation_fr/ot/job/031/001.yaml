  - severity: low
    issue: « jeune fille vierge » est redondant et légèrement surspécifié
    rationale: בְּתוּלָה peut désigner une vierge, souvent jeune, mais le texte n’exige pas l’ajout explicite de « jeune fille ».
  - severity: low
    issue: Alternative de sens de l’interrogatif non signalée
    rationale: וּמָה peut être compris dans le sens de « comment » ou de « pourquoi » ; une note permet de préserver cette possibilité sans alourdir le texte.
