  yaml_path: translation/ot/job/031/001.yaml
  text: I have made a covenant with my eyes[a]; so how could I gaze at a virgin?
translation:
  language: fr
  text: 'J’ai conclu une alliance avec mes yeux : comment pourrais-je donc[a] fixer mon regard sur une vierge ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi donc fixerais-je mon regard sur une vierge ? »'
    reason: L’interrogatif hébreu peut aussi être compris comme une question introduite par « pourquoi ».
lexical_decisions:
- source_word: בְּרִית כָּרַתִּי
  choice: J’avais conclu une alliance
  rationale: L’expression hébraïque signifie littéralement « couper une alliance ». « Conclure une alliance » restitue en français naturel le caractère solennel et contraignant de cet engagement. Le plus-que-parfait convient au rappel d’une décision antérieure dans la défense de Job.
- source_word: לְעֵינָי
  choice: avec mes yeux
  rationale: Cette formulation conserve l’image frappante d’un engagement pris avec ses propres yeux, c’est-à-dire d’une discipline imposée à son regard.
- source_word: וּמָה
  choice: comment donc aurais-je pu
  rationale: L’interrogation découle de l’alliance mentionnée auparavant et exprime ici l’incompatibilité logique entre cet engagement et un regard volontairement appuyé.
- source_word: אֶתְבּוֹנֵן
  choice: arrêter mon regard
  rationale: La forme verbale désigne une observation attentive ou prolongée, davantage qu’un simple coup d’œil. « Arrêter mon regard » rend cette intention délibérée en français courant et digne.
- source_word: עַל בְּתוּלָה
  choice: sur une jeune fille vierge
  rationale: בְּתוּלָה désigne normalement une vierge, souvent une jeune femme non mariée. La formulation explicite en français à la fois l’âge relatif suggéré par le contexte et la précision lexicale du terme.
theological_decisions:
- issue: Nature morale du regard
  choice: Ne pas expliciter « avec convoitise » dans le texte
  alternative: « porter sur une jeune fille vierge un regard de convoitise »
  rationale: Le contexte moral implique vraisemblablement un regard désirant, mais le verset hébreu ne nomme pas explicitement la convoitise. La traduction préserve donc cette implication sans l’ajouter au texte.
translation_notes:
  register: Français international moderne, naturel et digne. L’image de l’alliance avec les yeux est conservée, tandis que l’idiome verbal hébreu est rendu par une expression française courante.
