  - severity: medium
    issue: « son acte d’accusation » sur-spécifie סֵפֶר.
    rationale: Le terme hébreu désigne un document/écrit. Dans ce contexte, il peut être compris comme un écrit contenant des griefs, mais « acte d’accusation » est une explicitation institutionnelle qui réduit l’ambiguïté du texte.
