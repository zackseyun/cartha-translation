source:
  edition: WLC
  text: מִ֤י יִתֶּן לִ֨/י שֹׁ֘מֵ֤עַֽ לִ֗/י הֶן תָּ֭וִ/י שַׁדַּ֣י יַעֲנֵ֑/נִי וְ/סֵ֥פֶר כָּ֝תַ֗ב אִ֣ישׁ רִיבִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/035.yaml
  text: Oh[a], that I had someone to hear me! Here is my signature; let the Almighty answer me[b], and let my accuser write out the indictment.
translation:
  language: fr
  text: 'Si seulement quelqu’un m’écoutait ! Voici ma signature[a] : que le Tout-Puissant me réponde, et que mon adversaire rédige un document[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma marque » ou « mon signe ». Le mot hébreu désigne probablement ici la marque par laquelle Job atteste sa déclaration.
    reason: lexical_alternative
  - marker: b
    text: Ou, plus littéralement, « et le document qu’a écrit l’homme de mon litige ». L’hébreu désigne un écrit de la partie adverse ; dans ce contexte, il peut s’agir d’un document exposant ses griefs contre Job.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֶּן
  choice: Si seulement
  rationale: Cette tournure idiomatique exprime un souhait ardent plutôt qu’une question littérale sur celui qui donnerait quelque chose.
- source_word: שֹׁמֵעַ לִי
  choice: quelqu’un m’écoutait
  rationale: Le participe désigne une personne disposée à entendre Job et sa cause. « Écouter » est naturel en français tout en conservant la portée judiciaire du contexte.
- source_word: הֶן
  choice: Voici
  rationale: L’interjection attire l’attention sur ce que Job présente comme attestation de sa déclaration.
- source_word: תָּוִי
  choice: ma signature
  rationale: Le nom désigne une marque ou un signe, ici apposé pour attester la déclaration de Job. « Signature » en exprime clairement la fonction juridique actuelle, tandis que les sens plus littéraux sont signalés en note.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Rendu français établi du titre divin, sans préciser davantage son étymologie ou sa portée théologique.
- source_word: יַעֲנֵנִי
  choice: me réponde
  rationale: Dans cette scène judiciaire, Job demande au Tout-Puissant de répondre à sa déclaration ou à sa cause.
- source_word: וְסֵפֶר
  choice: son acte d’accusation
  rationale: סֵפֶר désigne un écrit ou document. Le contexte judiciaire permet d’en exprimer la fonction comme un acte d’accusation, sans réduire le terme à son support matériel.
- source_word: כָּתַב
  choice: mette par écrit
  rationale: Bien que la forme soit morphologiquement un accompli, elle peut être comprise dans la suite du souhait comme une demande portant sur la rédaction formelle du document. La note conserve l’autre lecture syntaxique.
- source_word: אִישׁ רִיבִי
  choice: mon accusateur
  rationale: L’expression signifie littéralement « l’homme de mon litige » et désigne ici la partie adverse dans la confrontation judiciaire.
theological_decisions:
- issue: Portée judiciaire de l’appel de Job
  choice: Employer le vocabulaire juridique « signature », « accusateur » et « acte d’accusation ».
  alternative: Traduire plus littéralement par « marque », « homme de mon litige » et « document ».
  rationale: Le contexte présente la déclaration de Job comme une contestation formelle appelant une réponse. Le vocabulaire juridique rend cette fonction intelligible sans ajouter de conclusion doctrinale.
- issue: Valeur de כָּתַב dans la dernière proposition
  choice: 'Comprendre la proposition comme un souhait : « que mon accusateur mette par écrit ».'
  alternative: 'La comprendre comme une proposition relative à l’accompli : « le document qu’a écrit l’homme de mon litige ».'
  rationale: La lecture volitive s’intègre naturellement à la série de souhaits et au défi lancé par Job, mais la morphologie et la syntaxe permettent une lecture plus littérale à l’accompli, conservée en note.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase conserve l’intensité du souhait de Job et la métaphore judiciaire. « Si seulement » et le subjonctif rendent naturellement la force optative ; les notes préservent les principales ambiguïtés lexicales et syntaxiques de l’hébreu.
