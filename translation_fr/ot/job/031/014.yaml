id: JOB.31.14
reference: Job 31:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מָ֣ה אֶֽ֭עֱשֶׂה כִּֽי יָק֣וּם אֵ֑ל וְ/כִֽי יִ֝פְקֹ֗ד מָ֣ה אֲשִׁיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/014.yaml
  text: And what would I do when God rises up? And when he calls me to account[a], what would I answer him?
translation:
  language: fr
  text: Que ferais-je donc quand Dieu se lèvera ? Et quand il me demandera des comptes[a], que lui répondrais-je ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand il me visitera » ou « quand il m’examinera ». Le verbe hébreu peut signifier visiter, inspecter ou demander des comptes ; ici, le contexte favorise l’idée de responsabilité devant un juge.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה
  choice: Que… donc
  rationale: La conjonction וּ relie cette question à l’argument précédent, tandis que מָה introduit l’interrogation. « donc » rend naturellement en français la force connective et argumentative.
- source_word: אֶעֱשֶׂה
  choice: ferais-je
  rationale: L’imparfait hébreu à la première personne exprime ici la réaction envisagée dans une situation future; le conditionnel français convient à cette question rhétorique.
- source_word: כִּי יָקוּם
  choice: quand… se lèvera
  rationale: כִּי a ici une valeur temporelle. Le verbe קום est conservé dans son image concrète de Dieu qui se lève pour agir, sans expliciter davantage le jugement.
- source_word: אֵל
  choice: Dieu
  rationale: Le titre divin אֵל se traduit simplement et naturellement par « Dieu » dans ce contexte.
- source_word: וְכִי יִפְקֹד
  choice: Et quand il me demandera des comptes
  rationale: פקד peut signifier visiter, examiner, intervenir contre quelqu’un ou lui demander des comptes. Le parallélisme avec la réponse que Job devrait donner favorise ici la nuance judiciaire, tout en signalant les autres possibilités en note.
- source_word: מָה אֲשִׁיבֶנּוּ
  choice: que lui répondrais-je
  rationale: Le hiphil de שוב prend idiomatiquement le sens de « répondre »; le suffixe masculin singulier désigne Dieu. Le conditionnel maintient la cohérence de la situation envisagée.
theological_decisions:
- issue: Image de Dieu exerçant un contrôle judiciaire
  choice: Présenter Dieu comme se levant et demandant des comptes à Job, sans identifier cette scène exclusivement au jugement final.
  alternative: Traduire plus généralement par « quand il interviendra », « quand il me visitera » ou « quand il m’examinera ».
  rationale: Le contexte et la question « que lui répondrais-je ? » donnent à פקד une forte nuance de reddition de comptes. Toutefois, le verset ne précise ni le moment ni la forme exacte de cette intervention divine.
translation_notes:
  register: Français international moderne, naturel et digne. L’inversion interrogative soutient le ton solennel de la question rhétorique. L’image littérale de Dieu qui « se lèvera » est préservée, tandis que « demandera des comptes » exprime clairement la nuance judiciaire probable de פקד.
