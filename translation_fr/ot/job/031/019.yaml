revisions:
- from: si j’ai vu quelqu’un dépérir faute de vêtement[a], ou un indigent sans rien pour se couvrir[b]—
  to: si j’ai vu quelqu’un périr faute de vêtements[a], ou un indigent sans de quoi se couvrir[b]—
  rationale: La révision remplace « dépérir » par « périr » pour une fidélité plus directe à אֹבֵד, emploie le pluriel idiomatique « vêtements », et corrige la note b, dont l’étiquette de littéralité était imprécise. Elle conserve la coordination « ou », le registre sobre et la suspension syntaxique vers le verset suivant.
