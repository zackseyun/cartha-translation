  text: אִם אֶרְאֶ֣ה א֭וֹבֵד מִ/בְּלִ֣י לְב֑וּשׁ וְ/אֵ֥ין כְּ֝ס֗וּת לָ/אֶבְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/019.yaml
  text: if I have seen anyone perishing for lack of clothing[b][a], or the needy without covering—
translation:
  language: fr
  text: si j’ai vu quelqu’un périr faute de vêtements[a], ou un indigent sans de quoi se couvrir[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : sans vêtements.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : un pauvre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: si
  rationale: Introduit la proposition conditionnelle du serment d’innocence de Job et en préserve la structure.
- source_word: אֶרְאֶה
  choice: j’ai vu
  rationale: Dans ce contexte rétrospectif, l’imparfait hébreu après אִם se rend naturellement par le passé composé en français.
- source_word: אֹבֵד
  choice: quelqu’un dépérir
  rationale: Le participe décrit une personne en train de dépérir ou de se perdre; « quelqu’un » restitue la valeur indéfinie sans préciser davantage la cause.
- source_word: מִבְּלִי לְבוּשׁ
  choice: faute de vêtement
  rationale: Rend à la fois la privation et sa valeur causale, dans un français naturel.
- source_word: וְאֵין
  choice: ou … sans
  rationale: La coordination hébraïque relie deux formulations parallèles d’une même condition; « ou » est idiomatique en français dans cette protase sans nier le lien étroit entre les deux membres.
- source_word: כְּסוּת
  choice: rien pour se couvrir
  rationale: Exprime concrètement l’absence de couverture ou de vêtement tout en évitant l’ambiguïté française de « couverture », qui pourrait désigner seulement une couverture de lit.
- source_word: לָאֶבְיוֹן
  choice: un indigent
  rationale: Désigne une personne matériellement démunie; « indigent » est précis, digne et convient au registre poétique.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. Le tiret final indique que la proposition conditionnelle se poursuit au verset suivant. La formulation conserve le parallélisme hébreu tout en évitant que « couverture » soit compris uniquement comme une pièce de literie.
