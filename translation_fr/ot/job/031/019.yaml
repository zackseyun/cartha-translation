review_pass:
  verdict: revise
  source_fidelity: Le sens conditionnel, l’indéfini (« quelqu’un »), la privation de vêtements et le second membre concernant la personne nécessiteuse sont bien représentés. Toutefois, « dépérir » évoque plus spécifiquement un affaiblissement progressif, alors que אֹבֵד désigne plus largement quelqu’un qui périt ou est en train de périr. « Périr » rend mieux cette portée sans ajouter de nuance causale ou temporelle.
  naturalness: La phrase est globalement fluide et le tiret final convient à la protase qui se poursuit au verset suivant. « Faute de vêtements » est plus idiomatique que le singulier générique dans ce contexte. « Sans de quoi se couvrir » reste naturel, évite l’ambiguïté de « couverture » et conserve l’idée de כְּסוּת.
  terminology: « Indigent » est acceptable dans un registre poétique soutenu et désigne adéquatement אֶבְיוֹן. La révision maintient une distinction raisonnable entre « vêtements » (לְבוּשׁ) et « de quoi se couvrir » (כְּסוּת), sans prétendre imposer deux termes français artificiellement distincts.
  issues:
  - severity: low
    issue: Nuance de « dépérir »
    rationale: Le verbe français suggère habituellement un dépérissement graduel; « périr » correspond plus directement au participe אֹבֵד et à son sens plus large de ruine ou de mort imminente.
  - severity: low
    issue: Note b présentée comme littérale
    rationale: « Sans couverture » ne constitue pas une littéralité française pleinement adéquate de la construction hébraïque « il n’y a pas de couverture pour le nécessiteux » et peut évoquer une pièce de literie. Il vaut mieux signaler une alternative lexicale pertinente pour אֶבְיוֹן.
