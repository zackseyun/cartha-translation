source:
  edition: WLC
  text: אִם הָלַ֥כְתִּי עִם שָׁ֑וְא וַ/תַּ֖חַשׁ עַל מִרְמָ֣ה רַגְלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/005.yaml
  text: If I have walked with falsehood[b][a], and my foot has hastened to deceit—
translation:
  language: fr
  text: Si j’ai marché avec la fausseté[b], et que mon pied s’est hâté vers la tromperie[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « après la tromperie ». La préposition hébraïque peut indiquer la direction : « vers » ou « après ».'
    reason: lexical_alternative
  - marker: b
    text: Dans l’hébreu biblique, « marcher » peut désigner la conduite ou la manière de vivre.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit la protase de la déclaration conditionnelle par laquelle Job affirme son innocence, sans ajouter d’emphase absente de l’hébreu.
- source_word: הָלַכְתִּי
  choice: j’ai marché
  rationale: Conserve l’image hébraïque de la marche tout en évoquant, dans le contexte, la conduite habituelle.
- source_word: עִם
  choice: avec
  rationale: Rend directement l’idée d’association avec la fausseté.
- source_word: שָׁוְא
  choice: la fausseté
  rationale: Dans son parallélisme avec מִרְמָה, le terme désigne ici probablement ce qui est faux plutôt que la seule vanité ou vacuité.
- source_word: וַתַּחַשׁ
  choice: s’est empressé
  rationale: Exprime le mouvement rapide de חושׁ dans un registre français naturel et digne, tout en gardant le pied comme sujet personnifié.
- source_word: עַל
  choice: vers
  rationale: Avec ce verbe de mouvement, la préposition peut marquer la direction; « vers » préserve cette valeur sans rendre le rapport plus précis que l’hébreu.
- source_word: מִרְמָה
  choice: la tromperie
  rationale: Désigne une conduite mensongère ou frauduleuse et forme un parallèle éthique naturel avec « la fausseté ».
- source_word: רַגְלִי
  choice: mon pied
  rationale: Respecte le singulier hébreu et conserve l’image poétique de la conduite représentée par le mouvement du pied.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « si » explicite naturellement la coordination de deux membres relevant de la même condition; le tiret maintient la phrase ouverte sur la suite de l’argument.
