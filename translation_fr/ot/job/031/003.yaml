source:
  edition: WLC
  text: הֲ/לֹא אֵ֥יד לְ/עַוָּ֑ל וְ֝/נֵ֗כֶר לְ/פֹ֣עֲלֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/003.yaml
  text: Is not disaster for the unrighteous[b][a], and calamity for the workers of iniquity?
translation:
  language: fr
  text: 'Le désastre[a] n’est-il pas pour l’homme injuste,

    et le malheur[b] pour ceux qui font le mal ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la ruine ».'
    reason: lexical_alternative
  - marker: b
    text: Le sens du mot hébreu est incertain; on peut aussi traduire par « la calamité » ou « un sort funeste ».
    reason: textual_or_lexical_uncertainty
lexical_decisions:
- source_word: הֲלֹא
  choice: n’est-il pas
  rationale: Conserve la question rhétorique, qui appelle une réponse affirmative, dans une formulation française naturelle.
- source_word: אֵיד
  choice: désastre
  rationale: Désigne une ruine ou un malheur destructeur. « Désastre » est clair, actuel et adapté au parallélisme poétique.
- source_word: לְעַוָּל
  choice: pour l’homme injuste
  rationale: Le substantif désigne une personne caractérisée par l’injustice. Cette formulation exprime la qualité morale sans substantiver un adjectif de façon trop abstraite.
- source_word: וְנֵכֶר
  choice: et le malheur
  rationale: Dans ce parallélisme, le terme semble désigner une issue funeste ou une calamité. « Malheur » reste distinct de « désastre » tout en préservant le parallélisme; l’incertitude lexicale est signalée en note.
- source_word: לְפֹעֲלֵי
  choice: pour ceux qui font
  rationale: Rend naturellement le participe pluriel et peut évoquer une conduite caractéristique ou répétée.
- source_word: אָוֶן
  choice: le mal
  rationale: Dans ce contexte moral, le mot désigne le mal commis ou l’iniquité. « Le mal » est direct, compréhensible et conserve la portée éthique.
theological_decisions:
- issue: Ordre moral et jugement dans la littérature de sagesse
  choice: Présenter le désastre et le malheur comme destinés aux injustes sans préciser leur mécanisme.
  alternative: Expliciter soit un châtiment directement infligé par Dieu, soit les seules conséquences naturelles du mal.
  rationale: Le verset associe ces malheurs aux injustes, mais ne précise pas ici s’ils constituent une intervention punitive directe ou l’expression plus générale d’un ordre moral. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme des deux membres hébreux est conservé, ainsi que la force de la question rhétorique.
