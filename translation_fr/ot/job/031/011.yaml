source:
  edition: WLC
  text: כִּי הוא זִמָּ֑ה ו/היא עָוֺ֥ן פְּלִילִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/011.yaml
  text: For that is a disgraceful act[a], and it is an iniquity for the judges.
translation:
  language: fr
  text: Car ce serait un acte infâme, une faute qui relève des juges[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une faute que les juges doivent punir ».'
    reason: פְּלִילִים peut désigner les juges ou, plus largement, le jugement judiciaire; cette autre traduction explicite l’idée d’une faute passible d’une sanction judiciaire.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui justifie l’affirmation précédente dans le serment de Job.
- source_word: הוא
  choice: ce serait
  rationale: Renvoie à l’acte évoqué au verset précédent. Le conditionnel s’accorde naturellement avec la construction hypothétique du contexte, sans modifier le sens de l’énoncé.
- source_word: זִמָּה
  choice: un acte infâme
  rationale: Le nom désigne un acte odieux, souvent de nature sexuelle. Cette formulation exprime sa gravité morale dans un français actuel et digne.
- source_word: וְהִיא
  choice: '[rendue par l’apposition]'
  rationale: Le pronom féminin reprend זִמָּה. En français, l’apposition « une faute » évite une répétition lourde tout en maintenant le parallélisme.
- source_word: עָוֺן
  choice: une faute
  rationale: Le terme peut désigner la faute, la culpabilité ou l’iniquité. « Faute » convient ici à la fois au registre moral et au cadre judiciaire.
- source_word: פְּלִילִים
  choice: qui relève des juges
  rationale: Le pluriel évoque les juges ou l’exercice de la justice. La formulation conserve cette référence judiciaire sans préciser au-delà de l’hébreu la peine encourue.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et solennel. « Acte infâme » garde la forte réprobation morale de זִמָּה, tandis que « relève des juges » préserve la concision et la relative ambiguïté de l’expression judiciaire hébraïque.
