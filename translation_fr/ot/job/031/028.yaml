  source_fidelity: Le conditionnel rend correctement la série hypothétique de Job 31. « Cela aussi » correspond à גַּם הוּא, et « j’aurais renié Dieu d’en haut » traduit de manière fidèle כִחַשְׁתִּי לָאֵל מִמָּעַל sans surinterprétation. La portée judiciaire de פְּלִילִי doit toutefois être exprimée plus idiomatiquement en français.
  naturalness: '« Faute passible de jugement » est compréhensible, mais peu naturel : en français juridique courant, une faute est plutôt « passible de sanction » ou « relevant de la justice ». « Une faute relevant de la justice » conserve l’indétermination du terme hébreu tout en étant fluide. L’absence d’article dans « Dieu d’en haut » est plus naturelle et évite de suggérer inutilement une désignation distinctive.'
  terminology: « Faute » convient à עָוֺן dans ce contexte moral et judiciaire. « Relevant de la justice » rend la valeur judiciaire de פְּלִילִי sans trancher entre des juges humains, une affaire judiciaire ou une offense punissable. « Renié » est approprié pour כחש envers Dieu; la note conserve utilement la nuance d’infidélité.
