revisions:
- from: Cela aussi serait une faute passible de jugement[a], car j’aurais renié le Dieu d’en haut.[b]
  to: Cela aussi serait une faute relevant de la justice[a], car j’aurais renié Dieu d’en haut.[b]
  rationale: La révision améliore l’idiomaticité française de la qualification judiciaire et supprime un article qui n’est pas nécessaire, tout en préservant la concision, le conditionnel hypothétique et l’ambiguïté légitime du texte hébreu.
