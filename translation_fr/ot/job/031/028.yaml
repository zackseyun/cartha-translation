  - severity: low
    issue: Article défini devant « Dieu d’en haut »
    rationale: « Le Dieu d’en haut » peut se lire comme un titre distinctif; « Dieu d’en haut » est plus naturel en français et correspond sans ajout à la construction hébraïque.
  revised_text: Cela aussi serait une faute relevant de la justice[a], car j’aurais renié Dieu d’en haut.[b]
