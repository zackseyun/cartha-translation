source:
  edition: WLC
  text: גַּם ה֭וּא עָוֺ֣ן פְּלִילִ֑י כִּֽי כִחַ֖שְׁתִּי לָ/אֵ֣ל מִ/מָּֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/028.yaml
  text: this too would be an iniquity for the judges[b][a], for I would have denied God above.
translation:
  language: fr
  text: Cela aussi serait une faute relevant de la justice[a], car j’aurais renié Dieu d’en haut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une faute relevant des juges », « une faute judiciaire » ou « une faute appelant un jugement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « car j’aurais été infidèle à Dieu d’en haut ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Cela aussi
  rationale: Renvoie naturellement, en français, au geste évoqué dans le verset précédent et l’ajoute aux fautes hypothétiques que Job énumère.
- source_word: עָוֺן
  choice: faute
  rationale: Le mot porte ici une dimension à la fois morale et juridique; « faute » reste clair et digne en français moderne.
- source_word: פְּלִילִי
  choice: passible de jugement
  rationale: Cette formulation conserve la portée judiciaire du terme sans imposer l’interprétation plus précise d’un tribunal humain ou de juges particuliers.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison pour laquelle l’acte constituerait une faute passible de jugement.
- source_word: כִחַשְׁתִּי
  choice: j’aurais renié
  rationale: Dans le contexte d’une vénération des astres, le verbe exprime le reniement ou l’infidélité envers Dieu plutôt qu’un simple mensonge.
- source_word: לָאֵל
  choice: le Dieu
  rationale: Le français construit naturellement « renier » avec un complément direct. L’article permet à « d’en haut » de qualifier clairement Dieu.
- source_word: מִמָּעַל
  choice: d’en haut
  rationale: Rend brièvement l’expression spatiale hébraïque et maintient le contraste contextuel avec les corps célestes, sans ajouter explicitement « dans le ciel ».
theological_decisions:
- issue: Portée judiciaire de פְּלִילִי
  choice: passible de jugement
  alternative: faute relevant des juges
  rationale: L’hébreu évoque une décision ou une juridiction judiciaire, mais ne précise pas sans ambiguïté si le jugement est celui de magistrats humains; la formulation retenue préserve cette ouverture.
- issue: Sens de כִחַשְׁתִּי à l’égard de Dieu
  choice: j’aurais renié
  alternative: j’aurais été infidèle au Dieu d’en haut
  rationale: « Renié » rend avec force la rupture de loyauté impliquée par l’idolâtrie, tandis que la note conserve l’autre nuance authentique du verbe.
- issue: Qualification de Dieu par מִמָּעַל
  choice: le Dieu d’en haut
  alternative: Dieu, là-haut
  rationale: La formulation reste concise et préserve le contraste vertical du texte sans développer « le Dieu qui est au ciel », qui serait plus explicite que l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure conditionnelle s’accorde avec la série d’hypothèses de Job 31. Les deux marqueurs de note figurent dans le texte, placés immédiatement après les expressions concernées.
