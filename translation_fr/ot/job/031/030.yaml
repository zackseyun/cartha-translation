source:
  edition: WLC
  text: וְ/לֹא נָתַ֣תִּי לַ/חֲטֹ֣א חִכִּ֑/י לִ/שְׁאֹ֖ל בְּ/אָלָ֣ה נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/030.yaml
  text: I have not allowed my mouth to sin by asking for his life with a curse[a].
translation:
  language: fr
  text: Je n’ai pas permis à ma bouche de pécher en réclamant sa vie par une malédiction[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par un serment ». Le nom hébreu peut désigner une malédiction (ou imprécation) aussi bien qu’un serment; ici, le contexte d’un souhait de malheur favorise « malédiction ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַתִּי
  choice: je n’ai pas permis
  rationale: La tournure hébraïque « donner » suivie d’un infinitif exprime ici la permission. « Je n’ai pas permis » rend naturellement le refus volontaire de Job.
- source_word: לַחֲטֹא
  choice: de pécher
  rationale: 'L’infinitif conserve son sens moral courant : commettre un péché.'
- source_word: חִכִּי
  choice: ma bouche
  rationale: Le mot désigne littéralement le palais, mais fonctionne ici comme métonymie de la parole. « Ma bouche » est idiomatique en français.
- source_word: לִשְׁאֹל
  choice: en réclamant
  rationale: L’infinitif précise en quoi consisterait le péché de la bouche. « En réclamant » exprime une demande hostile et s’intègre naturellement à la phrase.
- source_word: בְּאָלָה
  choice: par une malédiction
  rationale: אָלָה peut désigner une malédiction ou un serment. Dans le contexte d’un souhait de malheur visant un ennemi, « malédiction » convient le mieux; l’autre sens est conservé en note.
- source_word: נַפְשׁוֹ
  choice: sa vie
  rationale: נפשׁ désigne souvent la vie ou la personne. Ici, « sa vie » exprime précisément ce que Job nie avoir demandé par une malédiction.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image biblique de la bouche qui pèche tout en explicitant l’idiome hébreu de la permission.
