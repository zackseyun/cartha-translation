  text: אִם שַׂ֣מְתִּי זָהָ֣ב כִּסְלִ֑/י וְ֝/לַ/כֶּ֗תֶם אָמַ֥רְתִּי מִבְטַחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/024.yaml
  text: If I have made gold my confidence[a], and said to fine gold[c][b], ‘You are my security,’
translation:
  language: fr
  text: 'Si j’ai placé ma confiance dans l’or

    et dit à l’or fin : « Tu es ma sécurité »,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit la proposition conditionnelle du serment d’innocence de Job, conformément à la structure répétée du chapitre.
- source_word: שַׂמְתִּי
  choice: j’ai placé
  rationale: Le verbe שׂים signifie mettre ou placer. En français, « placer sa confiance dans » rend naturellement l’expression tout en restant proche de l’image hébraïque.
- source_word: זָהָב
  choice: l’or
  rationale: Équivalent direct et courant du terme hébreu.
- source_word: כִּסְלִי
  choice: ma confiance
  rationale: כֶּסֶל peut désigner la confiance ou l’espoir. « Ma confiance » convient au contexte d’une dépendance envers les richesses et conserve une distinction avec מִבְטַחִי.
- source_word: וְלַכֶּתֶם
  choice: et à l’or fin
  rationale: כֶּתֶם désigne de l’or précieux, pur ou affiné. « Or fin » est une expression française naturelle qui maintient la distinction avec זָהָב; la préposition « à » rend le ל de l’objet indirect de « dire ».
- source_word: אָמַרְתִּי
  choice: dit
  rationale: Coordonné à « j’ai placé », le participe passé « dit » dépend naturellement de l’auxiliaire déjà exprimé et rend le parfait hébreu sans lourdeur.
- source_word: מִבְטַחִי
  choice: mon assurance
  rationale: מִבְטָח désigne ce qui donne confiance ou sécurité, l’objet sur lequel on compte. « Mon assurance » exprime ce fondement de sécurité sans répéter « confiance ».
theological_decisions:
- issue: La négation par Job d’une confiance placée dans les richesses
  choice: 'Conserver la forme conditionnelle : « Si j’ai placé ma confiance dans l’or… »'
  alternative: « Si j’ai mis mon espoir dans l’or… »
  rationale: La formulation appartient au serment d’innocence de Job et dénonce implicitement le fait de traiter la richesse comme fondement de confiance. Elle préserve cette portée morale et théologique sans ajouter de catégorie doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure idiomatique « placer sa confiance dans » reste transparente, tandis que « or fin » conserve la variation lexicale de l’hébreu.
