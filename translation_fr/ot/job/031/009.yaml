  text: אִם נִפְתָּ֣ה לִ֭בִּ/י עַל אִשָּׁ֑ה וְ/עַל פֶּ֖תַח רֵעִ֣/י אָרָֽבְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/009.yaml
  text: If my heart has been enticed by a woman[a], and I have lain in wait at my neighbor's door[b],
translation:
  language: fr
  text: Si mon cœur s’est laissé séduire par une femme[a], et si je me suis tenu aux aguets à la porte de mon prochain[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a été trompé », « a été séduit » ou « a été persuadé ». Le verbe hébreu peut exprimer le fait d’être séduit, persuadé ou trompé ; ici, le contexte est celui de la tentation sexuelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « de mon voisin » ou « de mon ami ». Le mot hébreu peut désigner un prochain, un voisin, un ami ou un compagnon.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְתָּה
  choice: s’est laissé séduire
  rationale: Le nifal de פתה peut exprimer le fait d’être attiré, persuadé, trompé ou séduit. Dans ce contexte de tentation sexuelle, « s’est laissé séduire » rend naturellement l’attirance intérieure, sans affirmer que la femme en est nécessairement l’agent actif.
- source_word: לִבִּי
  choice: mon cœur
  rationale: « Cœur » conserve l’image hébraïque de l’être intérieur, siège des désirs, des intentions et des décisions.
- source_word: עַל אִשָּׁה
  choice: par une femme
  rationale: Avec פתה, la préposition עַל désigne ici la personne à propos de laquelle ou sous l’effet de laquelle le cœur est séduit. Cette formulation française exprime clairement la tentation tout en laissant la note signaler la nuance littérale possible.
- source_word: פֶּתַח
  choice: la porte
  rationale: « Porte » est le terme français le plus direct et naturel pour l’entrée de la maison devant laquelle Job aurait attendu clandestinement.
- source_word: רֵעִי
  choice: mon prochain
  rationale: רֵעַ peut désigner un prochain, un voisin, un ami ou un compagnon. « Mon prochain » convient au cadre moral et social du passage sans supposer une amitié intime.
- source_word: אָרָבְתִּי
  choice: je me suis tenu aux aguets
  rationale: ארב décrit le fait de se tenir caché ou aux aguets dans une intention hostile ou illicite. Cette expression restitue la préméditation et la clandestinité sans ajouter explicitement l’adultère que le contexte laisse entendre.
theological_decisions:
- issue: Progression morale entre désir intérieur et conduite clandestine
  choice: Présenter d’abord le cœur séduit, puis l’attente secrète à la porte du prochain.
  alternative: Expliciter une tentative d’adultère ou atténuer le passage en simple attirance amoureuse.
  rationale: L’hébreu associe tentation intérieure et action délibérée, mais ne nomme pas explicitement l’acte sexuel dans ce verset. La traduction préserve donc la gravité morale et la tension du texte sans la préciser au-delà de sa formulation.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conditionnelle répétée reproduit naturellement les deux membres hébreux. « Se tenir aux aguets » conserve l’idée d’une attente furtive; la virgule finale maintient le lien syntaxique avec la conséquence formulée au verset suivant.
