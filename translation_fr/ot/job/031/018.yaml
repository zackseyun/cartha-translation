  terminology: « Car », « jeunesse », « élevé », « comme un père » et « guidée » relèvent d’un registre moderne, digne et accessible. « Ventre de ma mère » est une image corporelle directe mais courante en traduction biblique; elle rend précisément בֶּטֶן sans euphémisation interprétative.
