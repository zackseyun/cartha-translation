  text: for from my youth he raised me like a father[b][a], and from my mother’s womb I guided her.
translation:
  language: fr
  text: Car, depuis ma jeunesse, il m’a élevé comme un père[a], et, depuis le ventre de ma mère, je l’ai guidée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il a grandi auprès de moi comme auprès d’un père », ou « je l’ai élevé comme un père ». L’hébreu de cette proposition est difficile; certains comprennent que Job parle ici des soins qu’il a prodigués à l’orphelin.
    reason: alternative_reading
  - marker: b
    text: Le pronom féminin « l’ » renvoie probablement à la veuve mentionnée au verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui appuie la déclaration de Job dans le contexte immédiat.
- source_word: מִנְּעוּרַי
  choice: depuis ma jeunesse
  rationale: Rend naturellement en français la durée qui commence dans la jeunesse.
- source_word: גְּדֵלַנִי
  choice: il m’a élevé
  rationale: Reproduit la forme verbale avec sujet masculin singulier implicite et complément de première personne, sans corriger la difficulté du texte hébreu.
- source_word: כְאָב
  choice: comme un père
  rationale: Conserve clairement la comparaison marquée par כְּ.
- source_word: וּמִבֶּטֶן אִמִּי
  choice: et, dès le ventre de ma mère
  rationale: Préserve l’image hébraïque et sa valeur temporelle, qui remonte aux tout premiers instants de la vie.
- source_word: אַנְחֶנָּה
  choice: je l’ai guidée
  rationale: Rend le hiphil à la première personne et le suffixe féminin singulier; le pronom féminin permet de conserver le renvoi probable à la veuve du verset précédent.
theological_decisions:
- issue: Sujet et sens de la première proposition
  choice: Conserver « il m’a élevé comme un père »
  alternative: « il a grandi auprès de moi comme auprès d’un père » ou « je l’ai élevé comme un père »
  rationale: L’hébreu transmis est difficile. La traduction principale suit au plus près la morphologie apparente sans résoudre silencieusement l’étrangeté contextuelle; la note signale les autres compréhensions possibles.
- issue: Changement de référent entre les deux propositions
  choice: Maintenir le sujet masculin implicite dans la première et le complément féminin dans la seconde
  alternative: Expliciter dans les deux propositions les soins constants de Job envers l’orphelin et la veuve
  rationale: Les marques grammaticales hébraïques présentent une tension réelle. Le français conserve cette variation plutôt que de l’harmoniser.
translation_notes:
  register: Français moderne, digne et accessible. La formulation volontairement inhabituelle de la première proposition reflète la difficulté du texte hébreu; les virgules structurent les deux indications temporelles sans alourdir la phrase.
