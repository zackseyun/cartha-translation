base_translation:
  language: en
  yaml_path: translation/ot/job/031/002.yaml
  text: And what is the portion from God above[a], and the inheritance from the Almighty from on high?
translation:
  language: fr
  text: Et quelle part vient de Dieu, d’en haut[a], et quel héritage vient du Tout-Puissant, des hauteurs ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelle est la part de Dieu d’en haut, et quel est l’héritage du Tout-Puissant des hauteurs ? » Les expressions hébraïques peuvent qualifier les titres divins plutôt qu’indiquer l’origine de la part et de l’héritage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶה
  choice: Et quelle
  rationale: La conjonction relie cette question rhétorique à l’argument précédent, tandis que « quelle » rend l’interrogatif מָה.
- source_word: חֵלֶק
  choice: part
  rationale: חֵלֶק désigne une part attribuée; « part » est naturel en français et maintient le parallélisme avec « héritage ».
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Cette forme poétique singulière désigne Dieu; la traduction directe évite d’ajouter un titre absent de l’hébreu.
- source_word: מִמָּעַל
  choice: d’en haut
  rationale: L’expression indique une provenance ou une localisation supérieure. Sa position conserve la possibilité de la rattacher soit à Dieu, soit à la part qui vient d’en haut.
- source_word: וְנַחֲלַת
  choice: quel héritage
  rationale: נַחֲלָה évoque un héritage ou un bien attribué. L’ellipse de la seconde conjonction en français donne un parallélisme interrogatif naturel.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: « Le Tout-Puissant » est l’équivalent français courant du titre divin שַׁדַּי dans Job.
- source_word: מִמְּרֹמִים
  choice: depuis les hauteurs
  rationale: Le pluriel מְרוֹמִים signifie « hauteurs » et la préposition מִן marque ici la provenance; « depuis » la rend explicitement sans ajouter « ciel ».
theological_decisions:
- issue: Traduction parallèle des titres divins poétiques
  choice: « Dieu » pour אֱלוֹהַּ et « le Tout-Puissant » pour שַׁדַּי
  alternative: « Dieu… Shaddaï »
  rationale: Traduire les deux désignations rend leur sens accessible et préserve leur parallélisme sans introduire de précision doctrinale étrangère au texte.
- issue: Agent implicite de l’attribution
  choice: Employer le verbe neutre « vient »
  alternative: « Dieu accorde… le Tout-Puissant donne »
  rationale: L’hébreu est une proposition nominale et ne précise aucun verbe. « Vient » exprime la provenance indiquée par מִן sans imposer l’idée plus déterminée d’un don ou d’une attribution.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme des deux membres est conservé, ainsi que la tension entre la localisation des titres divins et la provenance céleste de ce qui vient d’eux.
