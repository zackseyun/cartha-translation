  text: if I have covered my transgressions like Adam[a], by hiding my iniquity in my bosom—
translation:
  language: fr
  text: si j’ai couvert mes transgressions comme un homme[a], en cachant mon iniquité dans mon sein —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme Adam ». Le mot hébreu אָדָם peut désigner un être humain ou être compris ici comme le nom propre Adam.'
    reason: Lecture alternative fondée sur l’ambiguïté lexicale de l’hébreu.
lexical_decisions:
- source_word: אִם
  choice: si
  rationale: Introduit la proposition conditionnelle dans la formule de serment de Job, sans ajouter de nuance interprétative.
- source_word: כִּסִּיתִי
  choice: j’ai couvert
  rationale: Conserve l’image concrète du verbe כסה, qui peut signifier « couvrir » et, par extension, « dissimuler ».
- source_word: כְאָדָם
  choice: comme un homme
  rationale: אָדָם peut être un nom commun désignant un être humain ou le nom propre Adam. Le texte principal retient le sens commun, tandis que la note préserve l’autre lecture.
- source_word: פְּשָׁעָי
  choice: mes transgressions
  rationale: Rend la dimension morale et quasi juridique de פֶּשַׁע, qui évoque une violation ou une rébellion.
- source_word: לִטְמוֹן
  choice: en cachant
  rationale: Exprime naturellement en français le moyen ou la manière indiqués par l’infinitif de טמן.
- source_word: בְּחֻבִּי
  choice: au fond de moi
  rationale: Rend en français courant l’image d’un repli intérieur où quelque chose est tenu caché, sans recourir à l’expression aujourd’hui peu naturelle « dans mon sein ».
- source_word: עֲוֺנִי
  choice: ma faute
  rationale: עָוֹן peut désigner la perversité, la faute ou la culpabilité. « Ma faute » reste naturel et conserve ici le poids moral du terme.
theological_decisions:
- issue: Interprétation de אָדָם dans כְאָדָם
  choice: 'Nom commun : « comme un homme »'
  alternative: 'Nom propre : « comme Adam »'
  rationale: La forme hébraïque permet les deux lectures. Le texte principal conserve le sens générique, tandis que la note signale explicitement l’allusion possible à Adam sans trancher silencieusement l’ambiguïté.
translation_notes:
  register: Français moderne, sobre et digne. La structure conditionnelle inachevée et le tiret final sont conservés parce que le verset appartient à la longue formule de serment de Job. « Au fond de moi » privilégie une formulation idiomatique tout en gardant l’idée d’une dissimulation intérieure.
