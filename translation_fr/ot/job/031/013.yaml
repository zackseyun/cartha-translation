source:
  edition: WLC
  text: אִם אֶמְאַ֗ס מִשְׁפַּ֣ט עַ֭בְדִּ/י וַ/אֲמָתִ֑/י בְּ֝/רִבָ֗/ם עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/013.yaml
  text: If I have rejected the case of my male servant or my female servant when they brought a complaint against me[b][a],
translation:
  language: fr
  text: Si j’ai rejeté la cause[a] de mon esclave ou de ma servante[b] lorsqu’ils portaient plainte contre moi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le droit de mon esclave ou de ma servante ». Le mot hébreu peut désigner la justice, un droit reconnu ou une cause judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Les termes hébreux désignent ici un esclave et une femme esclave ; on peut aussi traduire, plus traditionnellement, « mon serviteur ou ma servante ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit la proposition conditionnelle dans le serment d’innocence de Job.
- source_word: אֶמְאַס
  choice: j’ai rejeté
  rationale: Le verbe peut signifier « rejeter », « mépriser » ou « refuser » ; dans ce contexte juridique, « rejeter » exprime le refus de prendre en considération une cause.
- source_word: מִשְׁפַּט
  choice: la cause
  rationale: Le terme peut désigner la justice, un droit ou une affaire judiciaire. « La cause » conserve ici le cadre juridique sans trancher excessivement entre le droit revendiqué et l’affaire portée devant Job.
- source_word: עַבְדִּי וַאֲמָתִי
  choice: mon esclave ou ma servante
  rationale: Les deux termes désignent respectivement une personne asservie de sexe masculin et une personne asservie de sexe féminin. Cette formulation reste naturelle en français tout en signalant le statut servile au moyen de « esclave » ; une note précise la portée du second terme.
- source_word: בְּרִיבָם
  choice: lorsqu’ils portaient plainte
  rationale: Le mot appartient au vocabulaire du différend et du procès. La tournure verbale française rend clairement l’action juridique exercée par les deux personnes.
- source_word: עִמָּדִי
  choice: contre moi
  rationale: Littéralement « avec moi », mais, dans un contexte de litige, l’expression indique que Job est la partie adverse.
