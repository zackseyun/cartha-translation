  source_fidelity: 'Le texte rend fidèlement la protase du serment : אִם par « Si », le rejet de משפט dans son cadre juridique, les deux personnes asservies, et le différend dirigé contre Job. « Lorsqu’ils portaient plainte contre moi » exprime de façon naturelle le sens litigieux de בְּרִיבָם עִמָּדִי, sans prétendre résoudre davantage la nuance exacte de la procédure.'
