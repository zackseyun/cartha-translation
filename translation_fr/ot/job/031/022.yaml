translation:
  language: fr
  text: 'alors, que mon épaule se détache de l’épaule[a],

    et que mon bras soit brisé, séparé de l’os[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de son articulation ». Le terme hébreu désigne la région de l’épaule ou du haut du dos; l’image évoque probablement une épaule arrachée à son point d’attache.
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’articulation ». Le terme hébreu est rare dans cet emploi et peut désigner l’os ou la structure articulaire du bras.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפִי
  choice: mon épaule
  rationale: כָּתֵף désigne couramment l’épaule ou le côté du corps. « Mon épaule » est ici naturel et forme un parallélisme clair avec « mon bras ».
- source_word: מִשִּׁכְמָה
  choice: hors de son articulation
  rationale: שִׁכְמָה renvoie à la région de l’épaule ou du haut du dos. Dans cette formule de malédiction corporelle, l’expression évoque vraisemblablement l’épaule arrachée à l’endroit où elle est attachée. « Hors de son articulation » rend cette image sans remplacer le verbe « tomber » par un diagnostic médical.
- source_word: תִפּוֹל
  choice: tombe
  rationale: Le verbe נפל signifie littéralement « tomber ». Le tour « tomber hors de son articulation » conserve cette image concrète tout en faisant comprendre la dislocation.
- source_word: וְאֶזְרֹעִי
  choice: et que mon bras
  rationale: זְרוֹעַ désigne normalement le bras; rien dans le contexte n’impose un terme anatomique plus précis.
- source_word: מִקָּנָה
  choice: à l’os
  rationale: קָנֶה est rare dans cet emploi anatomique et peut évoquer l’os ou la structure articulaire du bras. « Se briser à l’os » conserve l’image corporelle et l’indétermination relative du terme.
- source_word: תִשָּׁבֵר
  choice: se brise
  rationale: Le nifal de שׁבר exprime ici le fait d’être brisé. En français, la tournure pronominale « se brise » convient naturellement à cette imprécation.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et concret. La formulation conserve le parallélisme de l’hébreu et son image violente, tout en signalant en notes l’incertitude des deux expressions anatomiques.
