source:
  edition: WLC
  text: אִם הֲנִיפ֣וֹתִי עַל יָת֣וֹם יָדִ֑/י כִּֽי אֶרְאֶ֥ה בַ֝/שַּׁ֗עַר עֶזְרָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/021.yaml
  text: if I have raised my hand against the fatherless because I saw that I had support in the gate—[a][b][c]
translation:
  language: fr
  text: si j’ai levé la main contre l’orphelin[a], parce que je voyais que j’avais de l’appui à la porte[b][c] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne plus précisément un enfant privé de père et donc particulièrement vulnérable.
    reason: lexical_alternative
  - marker: b
    text: La « porte » désigne la porte de la ville, lieu où les anciens rendaient la justice et où se prenaient des décisions publiques.
    reason: cultural_note
  - marker: c
    text: Littéralement « mon aide » ; il s’agit ici d’un appui ou d’un soutien dans un cadre judiciaire ou public.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: si
  rationale: Introduit la proposition conditionnelle du serment d’innocence, dont la conséquence apparaît au verset suivant.
- source_word: הֲנִיפוֹתִי עַל ... יָדִי
  choice: j’ai levé la main contre
  rationale: Rend naturellement le geste hostile exprimé par le hiphil de נוּף avec יָד et la préposition עַל, sans préciser indûment s’il s’agit d’une menace ou d’un coup.
- source_word: יָתוֹם
  choice: l’orphelin
  rationale: Terme français courant et digne pour l’enfant privé de père et, de ce fait, socialement vulnérable; une note en précise la portée hébraïque.
- source_word: כִּי
  choice: parce que
  rationale: 'Conserve la valeur causale: l’appui dont Job aurait disposé aurait motivé l’abus de pouvoir.'
- source_word: אֶרְאֶה
  choice: je me voyais
  rationale: Exprime ici la perception de sa propre situation dans le cadre de l’hypothèse passée, plutôt que la seule vision physique.
- source_word: בַשַּׁעַר
  choice: au tribunal
  rationale: Traduit fonctionnellement la porte de la ville comme lieu où les affaires judiciaires et publiques étaient traitées; l’image source est conservée en note.
- source_word: עֶזְרָתִי
  choice: soutenu
  rationale: Le littéral « mon aide » désigne ici l’appui ou les protections dont Job aurait bénéficié dans une procédure publique.
theological_decisions:
- issue: Nature précise du geste contre l’orphelin
  choice: « levé la main contre »
  alternative: « frappé » ou « menacé »
  rationale: L’hébreu évoque un geste hostile, mais ne permet pas de trancher entre menace, violence effective ou usage abusif d’autorité; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase demeure suspendue par un tiret, comme la proposition conditionnelle hébraïque dont la conséquence vient au verset suivant. « Au tribunal » privilégie l’intelligibilité immédiate, tandis que la note restitue l’image culturelle de la porte.
