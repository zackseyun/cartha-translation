source:
  edition: WLC
  text: אִם אֶ֭שְׂמַח כִּי רַ֣ב חֵילִ֑/י וְ/כִֽי כַ֝בִּ֗יר מָצְאָ֥ה יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/025.yaml
  text: if I rejoiced because my wealth was abundant[a], and because my hand had gained much—
translation:
  language: fr
  text: si je me suis réjoui parce que mes richesses étaient abondantes, et parce que ma main avait acquis beaucoup[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parce que ma main avait trouvé beaucoup ». Il s’agit d’une manière de parler de ce qu’une personne a obtenu par ses propres moyens.'
    reason: Préciser l’image hébraïque et l’autre possibilité de traduction.
lexical_decisions:
- source_word: אִם
  choice: si
  rationale: Introduit la condition dans le serment d’innocence de Job; « si » est l’équivalent français naturel.
- source_word: אֶשְׂמַח
  choice: je me suis réjoui
  rationale: Exprime la joie prise dans la prospérité; le passé composé convient au bilan moral que Job fait de sa conduite.
- source_word: כִּי רַב חֵילִי
  choice: parce que mes richesses étaient abondantes
  rationale: Le premier כִּי est causal, רַב indique l’abondance et חַיִל désigne ici les biens matériels ou la richesse.
- source_word: וְכִי כַבִּיר מָצְאָה יָדִי
  choice: et parce que ma main avait acquis tant de biens
  rationale: Conserve la seconde proposition causale et l’image de la main, qui souligne l’action ou les moyens personnels. « Tant de biens » rend naturellement la grandeur ou l’abondance exprimée par כַבִּיר.
theological_decisions:
- issue: Le verset condamne-t-il la richesse elle-même ou la joie fondée sur son abondance et sur ce que l’on attribue à sa propre main ?
  choice: Job nie avoir fondé sa joie sur l’abondance de ses richesses et sur les biens acquis par sa propre main.
  alternative: Une formulation plus libre pourrait laisser entendre que la simple possession de richesses est condamnée.
  rationale: Les deux כִּי donnent les motifs de la joie, tandis que « ma main » maintient l’accent sur l’acquisition personnelle. La traduction évite donc de transformer le texte en condamnation générale de la richesse.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La répétition de « parce que » préserve le parallélisme causal de l’hébreu; le tiret maintient la phrase ouverte sur la suite du serment.
