  text: אִם אֶ֭שְׂמַח בְּ/פִ֣יד מְשַׂנְאִ֑/י וְ֝/הִתְעֹרַ֗רְתִּי כִּֽי מְצָ֥א/וֹ רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/029.yaml
  text: If I rejoiced at the ruin of the one who hates me[d][c][b][a], and exulted when evil found him—
translation:
  language: fr
  text: Si je me suis réjoui du désastre de celui qui me hait[a], si j’ai exulté quand le malheur l’a frappé[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de mon ennemi ». Littéralement, « de celui qui me hait ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « quand le mal l’a trouvé »; autre traduction : « quand le malheur l’a atteint ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit une proposition conditionnelle dans le serment d’innocence de Job; le français peut reprendre « si » dans le second membre pour rendre clairement le parallélisme.
- source_word: אֶשְׂמַח
  choice: je me suis réjoui
  rationale: Rend naturellement la joie envisagée rétrospectivement dans cette protestation conditionnelle, tout en conservant sa portée morale.
- source_word: בְּפִיד
  choice: du désastre
  rationale: פִיד désigne une catastrophe, un désastre ou une ruine. « Désastre » est naturel et ne suppose pas nécessairement une ruine définitive.
- source_word: מְשַׂנְאִי
  choice: de celui qui me hait
  rationale: Conserve la force verbale du participe hébreu plutôt que de la réduire au substantif interprétatif « mon ennemi ».
- source_word: וְהִתְעֹרַרְתִּי
  choice: si j’ai exulté
  rationale: Dans ce parallélisme, le verbe évoque le fait de se laisser soulever par une vive joie. « Exulter » garde cette intensité sans imposer explicitement la nuance plus accusatrice de « jubiler ».
- source_word: כִּי
  choice: quand
  rationale: Introduit ici naturellement la circonstance temporelle de l’exultation supposée.
- source_word: מְצָאוֹ רָע
  choice: le malheur l’a frappé
  rationale: Littéralement, « le mal l’a trouvé ». Dans ce contexte, רָע désigne l’adversité, et מצא peut exprimer ce qui atteint ou survient à quelqu’un; cette formulation est idiomatique tout en gardant l’image d’une atteinte.
theological_decisions:
- issue: Portée éthique de la réaction de Job au désastre de celui qui le hait
  choice: Décrire une joie intense devant le malheur d’autrui sans employer dans le texte principal un terme qui accuse explicitement Job d’avoir jubilé avec malveillance.
  alternative: « si j’ai jubilé quand le malheur l’a atteint »
  rationale: Le contexte implique qu’une telle joie serait fautive, mais le lexème hébreu n’oblige pas à expliciter toute la nuance de jubilation malveillante. La formulation retenue préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le double « si » clarifie le parallélisme de la protestation conditionnelle. Le tiret final signale que la phrase se poursuit au verset suivant.
