source:
  edition: WLC
  text: כִּ֤י אֵ֣שׁ הִ֭יא עַד אֲבַדּ֣וֹן תֹּאכֵ֑ל וּֽ/בְ/כָל תְּב֖וּאָתִ֣/י תְשָׁרֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/012.yaml
  text: For it is a fire that consumes to destruction[a], and it would root out all my produce.
translation:
  language: fr
  text: Car c’est un feu qui dévore jusqu’à la destruction[a] et qui déracinerait toute ma récolte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à Abaddon ». Le mot hébreu peut désigner la destruction ou, dans certains contextes, le domaine ou la personnification de la destruction.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente dans le serment de Job.
- source_word: אֵשׁ הִיא
  choice: c’est un feu
  rationale: Conserve directement et naturellement la métaphore hébraïque.
- source_word: עַד אֲבַדּוֹן
  choice: jusqu’à la destruction
  rationale: Exprime l’étendue extrême de l’action dévastatrice; le sens commun de אֲבַדּוֹן convient au contexte, sans effacer l’autre possibilité.
- source_word: תֹּאכֵל
  choice: qui dévore
  rationale: Rend le verbe « manger, consumer » par un terme français vivant et idiomatique avec le sujet « feu ».
- source_word: וּבְכָל
  choice: et… toute
  rationale: Rend clairement la portée totale de la destruction, sans reproduire artificiellement la préposition hébraïque.
- source_word: תְּבוּאָתִי
  choice: ma récolte
  rationale: Désigne le produit ou rendement tiré de la terre et s’accorde naturellement avec l’image du déracinement.
- source_word: תְשָׁרֵשׁ
  choice: déracinerait
  rationale: Préserve l’image agricole et l’idée d’une destruction radicale; le conditionnel français tient compte du cadre hypothétique du serment dans les versets précédents.
theological_decisions:
- issue: Sens de אֲבַדּוֹן
  choice: nom commun « destruction »
  alternative: nom propre « Abaddon » ou désignation du séjour de la destruction
  rationale: Dans ce contexte sapientiel, le mot décrit surtout l’aboutissement de la ruine causée par la faute évoquée; une note maintient toutefois l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la métaphore du feu et celle du déracinement, ainsi que la tension entre « destruction » et « Abaddon ».
