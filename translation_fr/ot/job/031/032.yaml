  yaml_path: translation/ot/job/031/032.yaml
  text: The sojourner did not spend the night outside[a]; I opened my doors to the traveler.
translation:
  language: fr
  text: L’étranger ne passait pas la nuit dehors[a] ; j’ouvrais mes portes au voyageur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’immigrant ne logeait pas dehors ; j’ouvrais ma porte à celui qui voyageait. »'
    reason: Alternative lexicale pour גֵּר, יָלִין, דְּלָתַי et לָאֹרַח, tout en préservant le sens d’hospitalité.
lexical_decisions:
- source_word: בַּחוּץ
  choice: dehors
  rationale: Le terme désigne l’extérieur ou le plein air. « Dehors » est direct et naturel en français moderne ; « dans la rue » serait possible selon le contexte, mais moins proche du nom hébreu.
- source_word: יָלִין
  choice: ne passait pas la nuit
  rationale: Le verbe לין désigne le fait de passer la nuit ou de loger pour la nuit. Cette formulation conserve clairement la valeur temporelle.
- source_word: גֵּר
  choice: l’étranger
  rationale: גֵּר désigne une personne non originaire du lieu, établie ou séjournant parmi la population et souvent vulnérable. « L’étranger » est ici plus courant et intelligible que le terme administratif « résident étranger ».
- source_word: דְּלָתַי
  choice: mes portes
  rationale: La forme hébraïque est au pluriel avec un suffixe de première personne du singulier. Le pluriel français respecte cette forme et convient à l’image de l’hospitalité.
- source_word: לָאֹרַח
  choice: au voyageur
  rationale: Dans ce contexte, אֹרַח désigne celui qui voyage, et non la route elle-même. « Voyageur » est naturel et accessible.
- source_word: אֶפְתָּח
  choice: j’ouvrais
  rationale: L’inaccompli peut exprimer ici une conduite habituelle dans le plaidoyer rétrospectif de Job. L’imparfait français rend clairement cette valeur habituelle, plutôt qu’un acte passé unique.
