base_translation:
  language: en
  yaml_path: translation/ot/job/031/027.yaml
  text: and my heart was secretly enticed[a], and my hand kissed my mouth—
translation:
  language: fr
  text: si mon cœur a été séduit en secret[a], et si j’ai porté ma main à ma bouche pour l’embrasser—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement dans ce contexte : « et si j’ai envoyé un baiser de la main ». Il s’agit probablement d’un geste d’hommage associé au culte des astres.'
    reason: Formulation idiomatique alternative du geste et explication culturelle contextuelle, sans rendre explicite dans le texte principal une intention cultuelle que le verset ne formule pas lui-même.
lexical_decisions:
- source_word: וַיִּפְתְּ
  choice: s’est laissé séduire
  rationale: Le verbe פתה exprime ici le fait d’être attiré ou séduit intérieurement. La tournure pronominale rend naturellement en français cette attraction sans la réduire à une simple persuasion.
- source_word: בַּסֵּתֶר
  choice: en secret
  rationale: סתר désigne ce qui est caché ou secret. « En secret » conserve l’idée d’un mouvement intérieur dissimulé.
- source_word: לִבִּי
  choice: mon cœur
  rationale: Le cœur représente ici la vie intérieure, notamment les désirs et la volonté; « mon cœur » préserve l’image hébraïque courante.
- source_word: וַתִּשַּׁק
  choice: a embrassé
  rationale: נשק signifie ordinairement « embrasser ». Le texte principal garde l’action concrète, tandis que la note indique le sens gestuel probable dans ce contexte.
- source_word: יָדִי
  choice: ma main
  rationale: Traduction directe du nom יָד, qui désigne l’instrument du geste d’hommage.
- source_word: לְפִי
  choice: ma bouche
  rationale: Littéralement « à ma bouche ». Après « embrasser », la construction française « embrasser ma bouche » conserve l’image concrète, malgré son caractère inhabituel, sans imposer une reconstruction du geste.
theological_decisions:
- issue: Possible allusion à un geste d’adoration des astres
  choice: Conserver dans le texte principal l’action corporelle concrète sans ajouter explicitement l’idée d’idolâtrie.
  alternative: « et si j’ai envoyé un baiser de la main » ou « et si ma main a envoyé un baiser en signe d’hommage »
  rationale: Le contexte des versets 26 à 28 indique vraisemblablement un geste d’hommage au soleil ou à la lune, mais le présent verset décrit le geste sans en expliciter la portée cultuelle. La note présente donc l’interprétation contextuelle tout en maintenant l’ambiguïté de la formulation hébraïque.
translation_notes:
  register: Français moderne, courant et digne. Le fragment demeure lié à la construction conditionnelle commencée au verset précédent. Le tiret final marque la poursuite de la phrase au verset 28.
