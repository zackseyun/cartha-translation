  source_fidelity: 'La première proposition rend correctement וַיִּפְתְּ בַּסֵּתֶר לִבִּי : le cœur est l’objet d’une séduction cachée. « S’est laissé séduire » ajoute toutefois une nuance de consentement volontaire que la forme hébraïque ne requiert pas. La seconde conserve les éléments concrets « main » et « bouche », mais « ma main a embrassé ma bouche » est en français susceptible d’évoquer un geste différent, voire simplement une main posée sur la bouche, plutôt que le baiser porté à la main.'
