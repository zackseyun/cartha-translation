id: JOB.31.4
reference: Job 31:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/לֹא ה֭וּא יִרְאֶ֣ה דְרָכָ֑/י וְֽ/כָל צְעָדַ֥/י יִסְפּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/004.yaml
  text: Does he not see my ways and count all my steps?[a]
translation:
  language: fr
  text: Ne voit-il pas mes voies et ne compte-t-il pas tous mes pas ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « N’observe-t-il pas ma conduite et ne dénombre-t-il pas tous mes pas ? »
    reason: Alternative lexicale pour דְרָכַי, יִרְאֶה et יִסְפּוֹר.
lexical_decisions:
- source_word: הֲלֹא
  choice: Ne… pas… ?
  rationale: Introduit une question rhétorique appelant une réponse affirmative ; la tournure interrogative négative est naturelle en français et conserve cette force.
- source_word: הוּא
  choice: il
  rationale: Le pronom indépendant porte une légère insistance, mais « il » suffit naturellement dans le contexte sans surtraduire par « lui-même ».
- source_word: יִרְאֶה
  choice: voit
  rationale: Le sens courant de ראה est « voir ». Ce choix conserve l’image concrète du regard divin sans l’expliciter en formulation doctrinale.
- source_word: דְרָכָי
  choice: mes voies
  rationale: « Voies » conserve le pluriel et la métaphore hébraïque, susceptible de désigner à la fois les chemins suivis et la conduite.
- source_word: וְכָל
  choice: et… tous
  rationale: Cette formulation rend la coordination ainsi que la totalité exprimée par כָּל.
- source_word: צְעָדַי
  choice: mes pas
  rationale: « Pas » est naturel en français moderne et préserve l’image des mouvements ou actes individuels.
- source_word: יִסְפּוֹר
  choice: compte
  rationale: ספר signifie ici « compter, dénombrer ». « Compte » est direct et maintient l’image concrète.
theological_decisions:
- issue: La connaissance divine exprimée par des verbes anthropomorphiques
  choice: Conserver la question rhétorique affirmant que Dieu voit les voies de Job et compte ses pas.
  alternative: N’observe-t-il pas ma conduite et ne tient-il pas compte de tous mes actes ?
  rationale: L’hébreu emploie les images concrètes de voir et de compter. Les maintenir préserve leur force théologique sans les remplacer par une paraphrase abstraite sur l’omniscience.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de la négation interrogative clarifie la coordination des deux verbes, tandis que « voies » et « pas » conservent le parallélisme imagé de l’hébreu.
