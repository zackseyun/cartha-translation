id: JOB.31.37
reference: Job 31:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִסְפַּ֣ר צְ֭עָדַ/י אַגִּידֶ֑/נּוּ כְּמוֹ נָ֝גִ֗יד אֲקָרֲבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/037.yaml
  text: I would declare to him the number of my steps[c][b][a]; like a prince I would approach him.
translation:
  language: fr
  text: Je lui déclarerais le nombre de mes pas[a][b] ; tel un prince[c], je m’approcherais de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je lui rendrais compte de mes pas ».'
    reason: lexical_alternative
  - marker: b
    text: « Lui » peut désigner Dieu ou l’accusateur de Job dans le contexte immédiat.
    reason: alternative_reading
  - marker: c
    text: 'Ou : « un dirigeant » ou « un notable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: le nombre de
  rationale: Le nom désigne un nombre ou un compte. L’expression concrète de l’hébreu est conservée, tout en signalant en note le sens possible de compte rendu.
- source_word: צְעָדַי
  choice: mes pas
  rationale: Le terme désigne littéralement les pas ou les enjambées et peut évoquer, sans l’expliciter, la conduite et le parcours de Job.
- source_word: אַגִּידֶנּוּ
  choice: je lui déclarerais
  rationale: Le hifil de נגד signifie annoncer, déclarer ou faire connaître. « Déclarerais » convient au ton solennel et judiciaire du passage, tandis que « lui » laisse le référent du suffixe masculin implicite.
- source_word: כְּמוֹ
  choice: tel
  rationale: La tournure comparative « tel un prince » est naturelle en français soutenu et rend la comparaison sans l’alourdir.
- source_word: נָגִיד
  choice: un prince
  rationale: Le mot désigne un chef, un dirigeant ou un personnage de haut rang. « Prince » exprime ici la dignité et l’assurance, sans imposer nécessairement une fonction politique précise.
- source_word: אֲקָרֲבֶנּוּ
  choice: je m’approcherais de lui
  rationale: La forme de קרב exprime ici l’action de s’approcher. La traduction conserve le complément personnel et l’assurance avec laquelle Job envisage cette rencontre.
theological_decisions:
- issue: Référent des suffixes masculins dans « je lui déclarerais » et « je m’approcherais de lui »
  choice: Conserver le pronom « lui » sans identifier son référent.
  alternative: Expliciter « Dieu » ou « mon accusateur ».
  rationale: Dans le contexte immédiat, Job évoque à la fois Dieu et celui qui l’accuse. L’hébreu ne nomme pas ici explicitement le référent ; la traduction préserve donc cette ambiguïté et la tension du passage.
translation_notes:
  register: Français moderne, digne et légèrement solennel, adapté au cadre judiciaire du discours de Job. La structure parallèle et l’image concrète des « pas » sont conservées, sans résoudre l’ambiguïté des pronoms.
