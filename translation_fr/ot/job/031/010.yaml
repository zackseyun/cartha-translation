  text: then let my wife grind for another man[a], and let other men kneel over her.
translation:
  language: fr
  text: alors, que ma femme tourne la meule pour un autre[a], et que d’autres hommes se courbent sur elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « que ma femme couche avec un autre » ; dans ce contexte, « se courber sur elle » est probablement aussi un euphémisme sexuel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטְחַן
  choice: tourne la meule
  rationale: Le verbe signifie littéralement « moudre ». « Tourner la meule » conserve l’image concrète d’un travail servile tout en étant plus naturel en français que « moudre pour » sans complément exprimé.
- source_word: לְאַחֵר
  choice: pour un autre
  rationale: אַחֵר désigne ici une autre personne, vraisemblablement un autre homme. Le français permet de conserver cette indication implicite par le masculin substantivé.
- source_word: אִשְׁתִּי
  choice: ma femme
  rationale: Dans ce contexte, אִשָּׁה avec le suffixe de première personne signifie normalement « ma femme ».
- source_word: וְעָלֶיהָ
  choice: sur elle
  rationale: La préposition עַל garde ainsi son image spatiale directe, sans atténuer la formulation.
- source_word: יִכְרְעוּן
  choice: s’agenouillent
  rationale: כרע signifie ordinairement « s’agenouiller » ou « se courber ». Le contexte lui donne probablement une valeur sexuelle euphémique, signalée en note.
- source_word: אֲחֵרִין
  choice: d’autres hommes
  rationale: Cette forme masculine plurielle substantivée désigne ici d’autres hommes; l’explicitation est naturelle en français et clarifie le parallélisme.
theological_decisions:
- issue: Faut-il expliciter l’euphémisme sexuel dans le texte principal ?
  choice: Conserver les images concrètes « tourne la meule » et « s’agenouillent sur elle », avec une note signalant le sens sexuel probable.
  alternative: « que ma femme couche avec un autre, et que d’autres hommes aient des rapports avec elle »
  rationale: L’hébreu n’emploie pas directement un verbe signifiant avoir des rapports sexuels. Garder l’expression imagée préserve son ambiguïté et sa dureté, tandis que la note renseigne le lecteur sur sa portée probable.
translation_notes:
  register: Français moderne, international et digne. La syntaxe de malédiction est conservée. « Tourner la meule » rend concrètement le travail de mouture, tandis que la note préserve la probable double portée sexuelle du parallélisme.
