source:
  edition: WLC
  text: אִם אֶ֭מְנַע מֵ/חֵ֣פֶץ דַּלִּ֑ים וְ/עֵינֵ֖י אַלְמָנָ֣ה אֲכַלֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/016.yaml
  text: If I have withheld the poor from their desire[a], or caused the eyes of the widow to fail[b],
translation:
  language: fr
  text: Si j’ai refusé aux pauvres ce qu’ils désiraient[a], si j’ai fait dépérir les yeux de la veuve[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « privé les pauvres de ce qu’ils désiraient » ; dans ce contexte, il peut s’agir de ce dont ils avaient besoin.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « si j’ai fait dépérir les yeux de la veuve ». Cette expression hébraïque évoque une attente prolongée, un désir déçu ou un espoir qui tarde à se réaliser.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit une proposition conditionnelle dans la série de serments imprécatoires de Job 31.
- source_word: אֶמְנַע
  choice: j’ai refusé
  rationale: Le qal de מנע signifie retenir, refuser ou priver. Le passé composé convient à l’examen rétrospectif de la conduite de Job.
- source_word: מֵחֵפֶץ דַּלִּים
  choice: aux pauvres ce qu’ils désiraient
  rationale: חֵפֶץ désigne le désir ou ce qui est désiré; cette formulation naturelle conserve ce sens sans le réduire explicitement au seul besoin matériel.
- source_word: דַּלִּים
  choice: les pauvres
  rationale: דלים peut désigner les pauvres, les faibles ou les démunis; « les pauvres » convient au contexte social.
- source_word: וְ
  choice: si
  rationale: Dans le parallélisme conditionnel français, la répétition de « si » rend clairement la seconde accusation possible, là où l’hébreu emploie une simple coordination.
- source_word: אַלְמָנָה
  choice: la veuve
  rationale: Le singulier hébreu a ici une valeur représentative et désigne la catégorie sociale vulnérable.
- source_word: וְעֵינֵי אַלְמָנָה אֲכַלֶּה
  choice: si j’ai laissé les yeux de la veuve s’épuiser dans l’attente
  rationale: L’expression hébraïque évoque des yeux qui se consument à force d’attendre, image d’une attente prolongée et déçue; la traduction maintient l’image tout en en indiquant le sens.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le verset reste syntaxiquement ouvert, conformément à la série conditionnelle dont la conséquence apparaît plus loin. L’image des yeux est conservée, mais « dans l’attente » explicite sobrement l’idiome.
