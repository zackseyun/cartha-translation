  yaml_path: translation/ot/job/031/023.yaml
  text: For calamity from God was a terror to me[b][a], and because of his majesty I could not endure.
translation:
  language: fr
  text: Car le désastre venant de Dieu était une terreur pour moi[a], et, à cause de sa majesté, je ne pouvais la supporter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le désastre de Dieu était pour moi une terreur ». L’hébreu peut être rendu par « de Dieu »; le sens est probablement celui d’un désastre venant de lui.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à cause de son élévation, je ne pouvais y résister ». Le nom hébreu peut exprimer l’élévation ou la majesté, et le verbe signifie fondamentalement « pouvoir, être capable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la retenue morale évoquée dans le contexte précédent.
- source_word: פַחַד אֵלַי
  choice: était pour moi un sujet d’effroi
  rationale: Conserve la valeur nominale de פַחַד et exprime naturellement en français la terreur personnelle de Job.
- source_word: אֵיד אֵל
  choice: le désastre venant de Dieu
  rationale: אֵיד désigne une catastrophe destructrice; le rapport construit avec אֵל se comprend probablement comme un désastre qui vient de Dieu, tout en laissant signalée en note la formulation plus littérale.
- source_word: וּמִשְּׂאֵתוֹ
  choice: et devant sa majesté
  rationale: שְׂאֵת peut évoquer l’élévation ou la majesté; «devant» rend ici de façon naturelle la réaction de Job face à la grandeur divine, sans exclure une nuance causale.
- source_word: לֹא אוּכָל
  choice: je ne pouvais tenir
  rationale: יכל exprime l’incapacité; «tenir» préserve l’ambiguïté entre être capable de subsister et pouvoir résister.
theological_decisions:
- issue: Sens de אֵל dans אֵיד אֵל
  choice: Dieu
  alternative: le Puissant; El
  rationale: Le contexte parle du jugement et de la majesté divins sans exiger de conserver la forme hébraïque comme nom propre.
- issue: Nature de la motivation de Job
  choice: La crainte du désastre divin et la majesté de Dieu le retenaient
  alternative: Job craignait uniquement le châtiment; Job évoquait seulement l’exaltation abstraite de Dieu
  rationale: La traduction maintient ensemble la peur du désastre et la réaction devant la majesté divine, sans réduire la tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Sujet d’effroi » conserve la force nominale sans archaïsme marqué; « je ne pouvais tenir » maintient l’ouverture sémantique du verbe hébreu.
