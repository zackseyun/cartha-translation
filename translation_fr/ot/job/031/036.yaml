  text: אִם לֹ֣א עַל שִׁ֭כְמִ/י אֶשָּׂאֶ֑/נּוּ אֶֽעֶנְדֶ֖/נּוּ עֲטָר֣וֹת לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/036.yaml
  text: Surely I would carry it on my shoulder[a]; I would bind it on myself like a crown.
translation:
  language: fr
  text: Assurément, je le porterais sur mon épaule ; je l’attacherais sur moi comme une couronne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « couronnes » au pluriel ; il peut s’agir d’un pluriel intensif, d’où « comme une couronne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Oui
  rationale: Dans ce contexte de serment, l’expression introduit une affirmation énergique plutôt qu’une condition. « Oui » en rend naturellement la force asseverative.
- source_word: עַל שִׁכְמִי
  choice: sur mon épaule
  rationale: Traduction spatiale directe qui conserve le singulier hébreu et l’image d’un document porté publiquement.
- source_word: אֶשָּׂאֶנּוּ
  choice: je le porterais
  rationale: Le verbe נשׂא signifie ici porter ou prendre sur soi. Le conditionnel s’accorde naturellement en français avec l’affirmation de ce que Job ferait si l’acte d’accusation lui était présenté.
- source_word: אֶעֶנְדֶנּוּ
  choice: je le ceindrais
  rationale: Le verbe désigne le fait de fixer ou de mettre un ornement. « Ceindre » maintient l’image physique et convient à la couronne sans réduire le geste à une simple parure abstraite.
- source_word: עֲטָרוֹת
  choice: comme une couronne
  rationale: La forme hébraïque est plurielle, mais elle peut avoir une valeur intensive ou désigner une parure en forme de couronne. Le singulier est plus naturel dans cette comparaison française, tandis que le pluriel est signalé en note.
- source_word: לִי
  choice: '[intégré dans « je le ceindrais »]'
  rationale: Le pronom datif indique que Job attacherait ou porterait lui-même l’objet ; cette valeur réfléchie est naturellement implicite dans la construction française.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et lisible. « Ceindre » est légèrement soutenu, mais reste clair et préserve le lien concret entre le fait d’attacher l’objet et l’image de la couronne.
