source:
  edition: WLC
  text: אִם כֹּ֭חָ/הּ אָכַ֣לְתִּי בְלִי כָ֑סֶף וְ/נֶ֖פֶשׁ בְּעָלֶ֣י/הָ הִפָּֽחְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/039.yaml
  text: if I have eaten its produce without payment[a], or caused its owners to lose heart—
translation:
  language: fr
  text: 'si j’en ai mangé le produit sans rien payer,

    ou si j’ai fait dépérir ses propriétaires[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « si j’ai fait expirer la vie de ses propriétaires » ou « si j’ai fait haleter ses propriétaires ». Le verbe hébreu est rare ; la proposition peut évoquer soit une oppression extrême, soit le fait de causer la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּחָהּ
  choice: son produit
  rationale: Littéralement « sa force » ; dans ce contexte agricole, le terme désigne la capacité productive de la terre, donc ce qu’elle produit.
- source_word: אָכַלְתִּי
  choice: j’en ai mangé
  rationale: Le verbe courant signifie « manger ». Le pronom « en » rattache naturellement en français l’action au produit de la terre.
- source_word: בְלִי כָסֶף
  choice: sans rien payer
  rationale: כֶּסֶף signifie littéralement « argent » au sens du métal, mais désigne ici le paiement. Cette formulation exprime clairement l’appropriation sans contrepartie.
- source_word: נֶפֶשׁ בְּעָלֶיהָ
  choice: ses propriétaires
  rationale: נֶפֶשׁ, « vie, personne, souffle », est intégré à la locution difficile formée avec le verbe suivant ; בְּעָלֶיהָ désigne les propriétaires ou détenteurs légitimes de la terre.
- source_word: הִפָּחְתִּי
  choice: j’ai fait dépérir
  rationale: Le hiphil rare de נפח peut évoquer le fait de faire haleter, d’épuiser ou de faire expirer. « Faire dépérir » conserve en français une amplitude entre oppression extrême et mort, tandis que la note expose l’incertitude.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La structure conditionnelle de l’imprécation de Job est maintenue, ainsi que le tiret final qui laisse la conséquence en suspens jusqu’au verset suivant. « Produit » rend l’image agricole sans calquer l’expression littérale « force », et « faire dépérir » préserve l’ambiguïté du verbe rare.
