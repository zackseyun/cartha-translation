  text: אִם אֶרְאֶ֣ה א֖וֹר כִּ֣י יָהֵ֑ל וְ֝/יָרֵ֗חַ יָקָ֥ר הֹלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/026.yaml
  text: if I looked at the light when it shone[a], or at the moon moving in splendor[b],
translation:
  language: fr
  text: si j’ai regardé la lumière quand elle brillait[a], ou la lune qui avançait dans sa splendeur[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le soleil », car « la lumière » désigne probablement ici le soleil, mis en parallèle avec « la lune ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la lune marchant dans la splendeur » ou « dans l’éclat ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: si
  rationale: Introduit une proposition conditionnelle dans le serment d’innocence de Job.
- source_word: אֶרְאֶה
  choice: j’ai regardé
  rationale: Dans ce contexte de serment, l’imparfait hébreu évoque l’acte hypothétique que Job nie avoir commis; le passé composé est naturel en français.
- source_word: אוֹר
  choice: la lumière
  rationale: Conserve le terme hébreu littéral et son ambiguïté, même s’il désigne probablement ici le soleil, en parallèle avec la lune.
- source_word: כִּי
  choice: quand
  rationale: Introduit naturellement la circonstance dans laquelle la lumière est contemplée.
- source_word: יָהֵל
  choice: elle brillait
  rationale: Rend simplement l’idée d’émettre de la lumière, avec un temps qui accompagne naturellement « quand ».
- source_word: וְיָרֵחַ
  choice: ou la lune
  rationale: Le « ou » exprime la valeur disjonctive de la coordination dans cette série conditionnelle.
- source_word: יָקָר
  choice: dans sa splendeur
  rationale: Dans ce contexte, le mot qualifie l’éclat majestueux de la lune plutôt que sa valeur matérielle.
- source_word: הֹלֵךְ
  choice: qui avançait
  rationale: Le participe décrit la progression continue de la lune dans le ciel; « avançait » est naturel et conserve cette image.
theological_decisions:
- issue: Contexte possible de culte astral
  choice: Conserver l’image littérale des astres sans expliciter dans le verset l’idée d’adoration.
  alternative: Traduire אוֹר par « soleil » afin de rendre plus manifeste le contexte d’idolâtrie.
  rationale: Les versets 27-28 éclairent l’allusion au culte des astres, mais le verset 26 nomme littéralement « la lumière » et « la lune ». La traduction laisse le contexte développer l’enjeu théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste ouverte sur le verset suivant, conformément à la structure du serment. Les marqueurs [a] et [b] figurent dans le texte principal.
