id: JOB.31.34
reference: Job 31:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י אֶֽעֱר֨וֹץ הָ֘מ֤וֹן רַבָּ֗ה וּ/בוּז מִשְׁפָּח֥וֹת יְחִתֵּ֑/נִי וָ֝/אֶדֹּ֗ם לֹא אֵ֥צֵא פָֽתַח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/034.yaml
  text: because I feared the great multitude[a], and the contempt of clans terrified me[b], so that I kept silent and did not go out the door—
translation:
  language: fr
  text: 'parce que je redoutais la foule nombreuse

    et que le mépris des clans[a] m’épouvantait,

    au point de garder le silence

    sans franchir le seuil[b] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des familles ». Le mot hébreu peut désigner des familles étendues ou des groupes de parenté plus larges.
    reason: lexical_alternative
  - marker: b
    text: 'Le verset appartient au serment d’innocence de Job. La formulation hébraïque est elliptique : Job évoque l’hypothèse où la peur de l’opinion publique l’aurait réduit au silence et retenu chez lui.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici la raison hypothétique pour laquelle Job aurait gardé le silence. Le contexte du serment d’innocence donne à toute la proposition une portée conditionnelle implicite, sans obliger à traduire כִּי lui-même par « si ».
- source_word: אֶעֱרוֹץ
  choice: je redoutais
  rationale: Le verbe ערץ exprime une peur intense. « Redouter » est naturel, soutenu sans être archaïque, et garde une gradation possible avec יְחִתֵּנִי.
- source_word: הָמוֹן רַבָּה
  choice: la foule nombreuse
  rationale: הָמוֹן désigne une foule ou une multitude, et רַבָּה en souligne le grand nombre. « Foule nombreuse » rend clairement la pression collective dans un français courant.
- source_word: וּבוּז מִשְׁפָּחוֹת
  choice: et que le mépris des clans
  rationale: בּוּז signifie « mépris » ou « dédain ». מִשְׁפָּחוֹת désigne ici des groupes de parenté plus larges que la famille nucléaire moderne; « clans » préserve cette dimension sociale ancienne.
- source_word: יְחִתֵּנִי
  choice: m’épouvantait
  rationale: Le hiphil de חתת exprime le fait d’effrayer, de démoraliser ou d’abattre le courage. « M’épouvantait » conserve la force du terme tout en évitant de répéter « redoutais ».
- source_word: וָאֶדֹּם
  choice: au point de garder le silence
  rationale: דמם signifie rester silencieux ou immobile. La tournure résultative « au point de » explicite naturellement le lien entre la peur évoquée et le silence, sans modifier le scénario hypothétique.
- source_word: לֹא אֵצֵא פָתַח
  choice: sans franchir le seuil
  rationale: L’expression associe « sortir » à l’ouverture ou à l’entrée. « Franchir le seuil » restitue idiomatiquement l’image de Job restant à l’intérieur sous la pression sociale.
theological_decisions:
- issue: Portée conditionnelle du verset dans le serment d’innocence de Job
  choice: Conserver « parce que » dans le texte et signaler que le scénario entier dépend d’une condition implicite
  alternative: Traduire directement « si je redoutais »
  rationale: Le contexte de Job 31 est celui d’un serment conditionnel, mais כִּי signifie naturellement « parce que » dans l’enchaînement interne. Cette solution maintient à la fois la syntaxe locale et l’ellipse rhétorique du passage.
translation_notes:
  register: Français moderne, digne et accessible. Le rythme en quatre lignes conserve le parallélisme poétique et le tiret final marque la suspension de la phrase. « Clans » maintient le cadre social ancien; « franchir le seuil » rend l’image concrète sans lourdeur littérale.
