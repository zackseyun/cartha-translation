  text: יִשְׁקְלֵ֥/נִי בְ/מֹאזְנֵי צֶ֑דֶק וְ/יֵדַ֥ע אֱ֝ל֗וֹהַּ תֻּמָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/006.yaml
  text: Let him weigh me in righteous scales[b][a], and let God know my integrity.
translation:
  language: fr
  text: Qu’il me pèse sur des balances justes[a], et que Dieu connaisse mon intégrité[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans des balances de justice » ; autre traduction : « sur une balance équitable ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mon innocence » ou « mon caractère irréprochable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁקְלֵנִי
  choice: Qu’il me pèse
  rationale: 'L’imparfait qal avec suffixe de première personne a ici une valeur volitive : Job demande à être évalué. Cette formulation conserve aussi l’image de la pesée.'
- source_word: בְמֹאזְנֵי צֶדֶק
  choice: sur une balance juste
  rationale: Le duel מֹאזְנַיִם désigne une balance à plateaux, naturellement exprimée au singulier collectif en français. צֶדֶק qualifie ici une mesure conforme à la justice, donc impartiale.
- source_word: וְיֵדַע
  choice: et que … reconnaisse
  rationale: L’imparfait coordonné prolonge vraisemblablement la valeur volitive. Dans ce contexte d’examen, « reconnaître » exprime non une acquisition d’information par Dieu, mais la constatation ou l’attestation de ce que vaut Job.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Cette forme poétique singulière, fréquente dans Job, signifie simplement « Dieu » dans ce verset.
- source_word: תֻּמָּתִי
  choice: mon intégrité
  rationale: תֻּמָּה évoque l’intégrité, la droiture ou le caractère irréprochable. « Intégrité » maintient la revendication morale de Job sans lui faire nécessairement affirmer une perfection absolue.
theological_decisions:
- issue: Portée de l’affirmation de Job sur lui-même
  choice: mon intégrité
  alternative: mon innocence ; mon caractère irréprochable
  rationale: « Intégrité » préserve la revendication de droiture soumise au jugement équitable de Dieu, sans résoudre la tension en faveur d’une absence absolue de péché.
- issue: Sens de la connaissance attribuée à Dieu
  choice: que Dieu reconnaisse
  alternative: que Dieu connaisse ; alors Dieu connaîtra
  rationale: Le texte peut exprimer la constatation divine issue de la pesée. « Reconnaisse » rend ce sens judiciaire sans suggérer que Dieu ignorait auparavant la condition de Job.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure volitive « Qu’il… et que… » conserve le parallélisme hébreu ; « balance juste » reste naturelle tout en gardant l’image judiciaire et commerciale.
