  text: then let me sow and another eat[a], and let my offspring be uprooted.
translation:
  language: fr
  text: Alors, que je sème et qu’un autre mange, et que mes rejetons soient déracinés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que mes produits soient déracinés » ou « que ma descendance soit arrachée jusqu’aux racines ». Le mot hébreu peut désigner la descendance ou ce qui pousse, les produits.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְרְעָה
  choice: que je sème
  rationale: 'Le cohortatif qal à la première personne s’inscrit dans une imprécation : « que je sème » exprime naturellement en français la conséquence appelée sur soi.'
- source_word: וְאַחֵר
  choice: et qu’un autre
  rationale: « Un autre » conserve avec concision le contraste entre Job, qui sème, et celui qui profite de son travail.
- source_word: יֹאכֵל
  choice: mange
  rationale: Le sens concret de אכל, « manger », convient à l’image agricole et évite d’en atténuer la force par une paraphrase.
- source_word: וְצֶאֱצָאַי
  choice: ceux qui sont issus de moi
  rationale: Cette formulation rend le sens probable de descendance tout en conservant l’idée littérale de ce qui sort ou pousse, présente dans צֶאֱצָא.
- source_word: יְשֹׁרָשׁוּ
  choice: soient déracinés
  rationale: Le passif français exprime clairement l’imprécation et préserve l’image de l’arrachement des racines.
theological_decisions:
- issue: Référent de צֶאֱצָאַי
  choice: ceux qui sont issus de moi
  alternative: ce que ma terre produit
  rationale: Le terme peut désigner la descendance ou ce qui pousse. Le contexte permet les deux lectures; le texte principal retient la lecture familiale probable sans effacer l’ambiguïté, signalée en note.
translation_notes:
  register: Français moderne, digne et direct. La structure répétée « que… » maintient la force solennelle de l’auto-imprécation. L’expression « ceux qui sont issus de moi » garde la résonance familiale tout en faisant écho à l’image végétale de « déracinés ».
