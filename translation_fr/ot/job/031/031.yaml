  text: if the men of my tent have not said[b][a], ‘Who is there that has not been filled with his flesh?’
translation:
  language: fr
  text: 'si ceux de ma tente[a] n’ont pas dit : « Qui ne s’est pas rassasié de sa viande[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les hommes de ma maisonnée » : la « tente » peut désigner ici la maisonnée ou le cercle domestique.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de sa chair » ; il s’agit probablement de la viande, ou plus largement de la nourriture, que Job fournissait à sa table.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: si… n’ont pas
  rationale: Conserve la forme conditionnelle de la protestation sous serment qui structure Job 31, sans transformer implicitement la proposition en affirmation.
- source_word: אָמְרוּ
  choice: n’ont pas dit
  rationale: Le passé composé rend naturellement en français l’accompli hébreu dans cette rétrospective.
- source_word: מְתֵי אָהֳלִי
  choice: les hommes de ma tente
  rationale: Rend concrètement l’expression hébraïque, tout en signalant en note son sens probable de maisonnée ou de personnel domestique.
- source_word: מִי יִתֵּן
  choice: Qui
  rationale: Dans ce contexte, la tournure introduit une question rhétorique (« Qui… ? »), plutôt qu’un souhait au sens habituel de « Qui donnera… ? ».
- source_word: מִבְּשָׂרוֹ
  choice: de sa viande
  rationale: Le nom signifie littéralement « chair », mais désigne ici très probablement la viande fournie par Job à sa table. « Sa viande » préserve le suffixe possessif et le lien lexical sans suggérer directement que l’on mange le corps de Job.
- source_word: לֹא נִשְׂבָּע
  choice: ne s’est pas rassasié
  rationale: Le niphal de שׂבע exprime le fait d’être rassasié; la construction pronominale est idiomatique en français dans un contexte de nourriture.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conditionnelle demeure volontairement suspendue, car le verset appartient à la série de protestations sous serment du chapitre. La question rhétorique est formulée naturellement, tandis que les notes conservent les nuances concrètes de « tente » et de « chair ».
