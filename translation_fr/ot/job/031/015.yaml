  terminology: «Ventre maternel» et «sein maternel» conviennent à בטן et רחם dans ce contexte. «Formés» rend bien le verbe de formation. «Le même» explicite sobrement que «un seul» renvoie au créateur déjà évoqué, sans introduire un titre théologique absent du texte.
