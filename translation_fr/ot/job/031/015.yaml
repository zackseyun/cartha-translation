  yaml_path: translation/ot/job/031/015.yaml
  text: Did not he who made me in the womb make him[a], and form us in one womb?
translation:
  language: fr
  text: Celui qui m’a fait dans le ventre maternel ne l’a-t-il pas fait, lui aussi ? N’est-ce pas le même qui nous a formés dans le sein maternel[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : «Ne nous a-t-il pas formés dans un même sein maternel ?» Littéralement, l’hébreu peut se lire «dans un seul sein maternel». Cette lecture souligne leur commune origine humaine, sans nécessairement affirmer qu’ils avaient la même mère.'
    reason: Ambiguïté syntaxique et nuance lexicale de אֶחָד.
lexical_decisions:
- source_word: הֲלֹא
  choice: ne… pas… ?
  rationale: Cette tournure rend naturellement en français la question rhétorique qui appelle une réponse affirmative.
- source_word: בַבֶּטֶן
  choice: dans le ventre maternel
  rationale: Dans ce contexte de formation prénatale, בטן désigne le ventre de la mère; «ventre maternel» est clair et naturel sans employer deux fois «sein maternel».
- source_word: עֹשֵׂנִי
  choice: celui qui m’a fait
  rationale: Le participe muni du suffixe de première personne fonctionne comme un substantif verbal et conserve ici sa force personnelle, sans le transformer en titre divin explicite.
- source_word: עָשָׂהוּ
  choice: l’a… fait lui aussi
  rationale: Le pronom masculin singulier renvoie au serviteur évoqué dans le contexte immédiat. «Lui aussi» fait ressortir le parallélisme entre Job et lui sans généraliser le référent.
- source_word: וַיְכֻנֶנּוּ
  choice: Et ne nous a-t-il pas formés
  rationale: כון exprime ici la formation dans le sein maternel; le suffixe est compris comme une première personne du pluriel englobant Job et son serviteur.
- source_word: בָּרֶחֶם אֶחָד
  choice: dans un même sein maternel
  rationale: «Un même» restitue idiomatiquement la valeur possible de אֶחָד et souligne une condition humaine commune, tout en évitant de suggérer que Job et son serviteur auraient littéralement la même mère.
theological_decisions:
- issue: Référent du pronom masculin singulier
  choice: Le pronom renvoie au serviteur de Job mentionné aux versets 13-14.
  alternative: Le propos peut être compris plus largement comme concernant tout autre être humain.
  rationale: Le singulier et le contexte immédiat favorisent le serviteur comme référent, tandis que la portée éthique plus générale demeure implicite.
- issue: Analyse de אֶחָד dans la dernière proposition
  choice: 'אֶחָד qualifie רחם : «un même sein maternel».'
  alternative: 'אֶחָד peut être le sujet postposé : «un seul ne nous a-t-il pas formés dans le sein maternel ?»'
  rationale: Les deux analyses sont grammaticalement défendables. Le texte principal suit l’analyse adjectivale et la note conserve l’autre, sans trancher une ambiguïté réelle de l’hébreu.
translation_notes:
  register: Français international actuel, poétique mais accessible. La répétition de «fait» reproduit le parallèle hébreu, tandis que «ventre maternel» puis «sein maternel» évitent une répétition lourde. La formulation garde la question rhétorique et l’égalité de créatures entre Job et son serviteur.
