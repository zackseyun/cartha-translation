  text: אִם עָ֭לַ/י אַדְמָתִ֣/י תִזְעָ֑ק וְ֝/יַ֗חַד תְּלָמֶ֥י/הָ יִבְכָּיֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/038.yaml
  text: If my land cries out against me[a], and its furrows weep together,
translation:
  language: fr
  text: 'Si ma terre crie contre moi,

    et que ses sillons pleurent tous ensemble[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se lamentent » ; le verbe hébreu est le terme courant pour pleurer ou se lamenter, appliqué ici de manière poétique aux sillons.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit la condition dans le serment d’innocence de Job.
- source_word: עָלַי
  choice: contre moi
  rationale: 'Avec le verbe « crier », la préposition porte ici naturellement une valeur hostile ou accusatrice : la terre témoignerait contre Job.'
- source_word: אַדְמָתִי
  choice: ma terre
  rationale: Désigne ici la terre cultivable appartenant à Job ; « ma terre » est naturel et conserve le possessif.
- source_word: תִזְעָק
  choice: crie
  rationale: Le verbe exprime un cri puissant, souvent suscité par la détresse ou l’injustice ; ce choix préserve la personnification et la portée accusatrice.
- source_word: וְיַחַד
  choice: tous ensemble
  rationale: Exprime une action collective ou simultanée ; placé après « pleurent », ce tour est idiomatique en français.
- source_word: תְּלָמֶיהָ
  choice: ses sillons
  rationale: Le terme désigne les sillons tracés par le labour et maintient précisément l’image agricole.
- source_word: יִבְכָּיוּן
  choice: pleurent
  rationale: Le verbe courant בכה signifie « pleurer » ou « se lamenter » ; « pleurent » prolonge vivement la personnification sans confondre ce verbe avec le cri de la première proposition.
theological_decisions: []
