id: JOB.31.7
reference: Job 31:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִ֥ם תִּטֶּ֣ה אַשֻּׁרִ/י֮ מִנִּ֪י הַ֫/דָּ֥רֶךְ וְ/אַחַ֣ר עֵ֭ינַ/י הָלַ֣ךְ לִבִּ֑/י וּ֝/בְ/כַפַּ֗/י דָּ֣בַק מֻאֽוּם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/031/007.yaml
  text: if my step has turned aside from the way[a], and my heart has gone after my eyes, and any stain has clung to my hands[b],
translation:
  language: fr
  text: si mon pas s’est écarté du chemin, si mon cœur a suivi mes yeux[a], et si quelque tache s’est attachée à mes mains[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « est allé après mes yeux ».
    reason: Précision sur l’image et la formulation hébraïques.
  - marker: b
    text: Ou « quelque défaut » ou « quelque souillure ». Le terme hébreu peut désigner une tache, un défaut ou une imperfection.
    reason: Le terme hébreu possède une gamme de sens que « tache » ne restitue pas entièrement.
lexical_decisions:
- source_word: תִּטֶּה
  choice: s’est écarté
  rationale: Le verbe נטה exprime ici une déviation. Dans cette formule conditionnelle de serment, le passé composé rend naturellement en français l’éventualité d’un écart déjà commis.
- source_word: אַשֻּׁרִי
  choice: mon pas
  rationale: Le singulier hébreu désigne le pas ou la démarche. « Mon pas » conserve l’image concrète de la conduite morale.
- source_word: מִנִּי הַדָּרֶךְ
  choice: du chemin
  rationale: Cette formulation préserve la métaphore biblique du chemin comme ligne de conduite sans l’expliciter abusivement.
- source_word: וְאַחַר עֵינַי הָלַךְ לִבִּי
  choice: si mon cœur a suivi mes yeux
  rationale: La tournure française reste proche de l’image hébraïque et fait ressortir le mouvement du désir intérieur à la suite de ce que voient les yeux.
- source_word: לִבִּי
  choice: mon cœur
  rationale: « Cœur » conserve le langage anthropologique hébreu, qui englobe la volonté, les désirs et la pensée.
- source_word: עֵינַי
  choice: mes yeux
  rationale: Le rendu concret maintient le lien littéraire entre la vue et le désir, au lieu de le réduire à « ce que j’ai vu ».
- source_word: וּבְכַפַּי דָּבַק
  choice: s’est attachée à mes mains
  rationale: דבק signifie « s’attacher, adhérer ». « Mes mains » est plus idiomatique que « mes paumes » en français et évoque naturellement les actes accomplis.
- source_word: מֻאוּם
  choice: quelque tache
  rationale: Le mot peut désigner une tache, un défaut ou une souillure. « Quelque tache » garde l’image d’une marque compromettant l’intégrité morale.
theological_decisions:
- issue: Métaphore morale du chemin
  choice: Conserver « du chemin »
  alternative: S’écarter de la bonne conduite
  rationale: Le texte exprime l’intégrité morale par une image de déplacement. La conserver évite de remplacer la métaphore par une interprétation abstraite.
- issue: Rapport entre le cœur et les yeux
  choice: Conserver « mon cœur » et « mes yeux »
  alternative: Mes désirs ont suivi ce que j’ai vu
  rationale: L’hébreu met en scène le cœur suivant les yeux. Le maintien de ces termes préserve sa psychologie morale et sa force poétique sans imposer une analyse doctrinale.
- issue: Nature de la marque attachée aux mains
  choice: Employer l’image ouverte de la « tache »
  alternative: Préciser « culpabilité » ou « faute »
  rationale: Le contexte suggère une souillure morale liée aux actes, mais le terme hébreu reste imagé. Le traduire directement évite de résoudre cette image en une notion théologique unique.
translation_notes:
  register: Français moderne, courant et digne. La syntaxe répétée en « si » rend explicite la portée conditionnelle des trois propositions, naturelle dans la séquence de serment de Job. Les images du pas, du chemin, du cœur, des yeux et des mains sont conservées.
