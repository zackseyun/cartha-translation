  yaml_path: translation/ot/job/031/040.yaml
  text: Instead of wheat[a], let thorns come up, and instead of barley, stinkweed. The words of Job are ended.
translation:
  language: fr
  text: À la place du blé, que poussent des épines, et à la place de l’orge, des herbes puantes. Les paroles de Job prennent fin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת
  choice: à la place de
  rationale: Dans cette imprécation agricole, la préposition exprime la substitution plutôt qu’une position physique.
- source_word: חִטָּה
  choice: blé
  rationale: Désignation française courante de cette céréale, mise en contraste avec une végétation nuisible.
- source_word: יֵצֵא
  choice: que poussent
  rationale: Avec un végétal pour sujet, le verbe évoque ce qui sort du sol; « pousser » est naturel en français et convient à la tournure de souhait ou de malédiction.
- source_word: חוֹחַ
  choice: épines
  rationale: Le terme désigne de manière générale une végétation épineuse et nuisible; « épines » préserve cette généralité.
- source_word: שְׂעֹרָה
  choice: orge
  rationale: Équivalent français usuel de la céréale hébraïque.
- source_word: בָאְשָׁה
  choice: herbes puantes
  rationale: Le mot évoque une végétation mauvaise ou malodorante, sans permettre une identification botanique certaine. Cette expression garde le lien probable avec la puanteur tout en évitant une précision excessive.
- source_word: תַּמּוּ
  choice: Ici prennent fin
  rationale: Formulation concise et digne indiquant l’achèvement des paroles précédentes, avec une valeur proche d’une notice finale.
- source_word: דִּבְרֵי אִיּוֹב
  choice: les paroles de Job
  rationale: Rend directement la construction hébraïque et convient à la conclusion de la section.
