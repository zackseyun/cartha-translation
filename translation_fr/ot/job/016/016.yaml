source:
  edition: WLC
  text: פָּנַ֣/י חמרמרה מִנִּי בֶ֑כִי וְ/עַ֖ל עַפְעַפַּ֣/י צַלְמָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/016.yaml
  text: My face is red from weeping[a], and on my eyelids is deep darkness.
translation:
  language: fr
  text: 'Mon visage est rougi par les pleurs,

    et sur mes paupières repose une profonde obscurité[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ombre de la mort ». Le terme hébreu peut désigner soit une ombre mortelle, soit une obscurité très profonde.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנַי
  choice: mon visage
  rationale: Le pluriel hébreu muni du suffixe de première personne fonctionne ici comme un collectif désignant naturellement le visage.
- source_word: חמרמרה
  choice: est rougi
  rationale: Ce verbe rare décrit une altération visible du visage sous l’effet d’une vive souffrance. « Est rougi » convient bien au contexte des pleurs tout en évitant de préciser à tort une réaction physiologique exacte.
- source_word: מִנִּי בֶכִי
  choice: par les pleurs
  rationale: La préposition indique ici la cause de l’état du visage. Cette tournure française est naturelle et conserve le registre poétique du nom hébreu.
- source_word: וְעַל
  choice: et sur
  rationale: Cette formulation rend directement la conjonction et la préposition qui introduisent le second membre du parallélisme.
- source_word: עַפְעַפַּי
  choice: mes paupières
  rationale: L’hébreu désigne précisément les paupières, et non les yeux au sens large.
- source_word: צַלְמָוֶת
  choice: une profonde obscurité
  rationale: Le terme poétique peut évoquer des ténèbres très épaisses ou l’ombre de la mort. Dans ce contexte visuel, « profonde obscurité » préserve l’intensité sans imposer une référence directe à la mort.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme des deux membres est conservé. « Repose » explicite légèrement la construction nominale hébraïque afin d’obtenir une phrase française naturelle sans atténuer l’image.
