  text: אִֽם אֲ֭דַבְּרָה לֹא יֵחָשֵׂ֣ךְ כְּאֵבִ֑/י וְ֝/אַחְדְּלָ֗ה מַה מִ/נִּ֥י יַהֲלֹֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/006.yaml
  text: If I speak[a], my pain is not eased; and if I refrain, what goes away from me?
translation:
  language: fr
  text: Si je parle, ma douleur ne s’atténue pas ; et si je me tais, qu’est-ce qui s’éloigne de moi ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quelle part de ma douleur me quitte ? » L’hébreu est concis et laisse implicite ce qui s’éloignerait de Job.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֲדַבְּרָה
  choice: Si je parle
  rationale: La proposition conditionnelle est rendue naturellement en français par « si » suivi du présent ; la nuance volitive de la forme verbale n’a pas besoin d’être explicitée ici.
- source_word: לֹא יֵחָשֵׂךְ כְּאֵבִי
  choice: ma douleur ne s’atténue pas
  rationale: Le nifal de חשׂך évoque ce qui est retenu ou diminué. Avec « ma douleur », « ne s’atténue pas » exprime clairement le sens contextuel sans restreindre la douleur au physique ou à l’émotionnel.
- source_word: וְאַחְדְּלָה
  choice: et si je me tais
  rationale: חדל signifie cesser ou s’abstenir. Le parallélisme avec « je parle » indique ici l’abstention de parler ; « je me tais » est idiomatique et concis en français.
- source_word: מַה מִנִּי יַהֲלֹךְ
  choice: qu’est-ce qui s’éloigne de moi ?
  rationale: 'La formulation conserve l’ellipse et la brièveté de l’hébreu : le sujet implicite peut être la douleur de Job, sans qu’il soit nécessaire de l’ajouter dans le corps du texte.'
