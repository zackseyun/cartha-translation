  text: וְ/יוֹכַ֣ח לְ/גֶ֣בֶר עִם אֱל֑וֹהַּ וּֽ/בֶן אָדָ֥ם לְ/רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/021.yaml
  text: that he would arbitrate for a man with God[c][b][a], as a son of man does for his neighbor.
translation:
  language: fr
  text: qu’il plaide[a] pour un homme auprès de Dieu, comme un fils d’homme[b] le fait pour son prochain[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il arbitre » ou « qu’il défende la cause » ; le verbe hébreu peut désigner l’action de trancher, d’arbitrer ou de plaider une cause.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un fils d’homme », expression qui désigne ici un être humain, sans être nécessairement un titre messianique.
    reason: lexical_alternative
  - marker: c
    text: Ou « son ami » ou « son compagnon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹכַח
  choice: qu’il plaide
  rationale: Le hiphil de יכח peut exprimer l’action de trancher, d’arbitrer ou de soutenir une cause. Dans ce contexte judiciaire, « plaider » rend naturellement l’idée de porter la cause d’un homme auprès de Dieu, sans imposer l’image d’un arbitre strictement neutre.
- source_word: לְגֶבֶר
  choice: pour un homme
  rationale: 'גבר désigne ici un homme en tant que partie au litige. La préposition לְ est comprise dans son sens bénéficiaire : l’action est accomplie en sa faveur.'
- source_word: עִם אֱלוֹהַּ
  choice: auprès de Dieu
  rationale: עִם signifie littéralement « avec », mais, avec le verbe juridique « plaider », le français idiomatique dit « plaider auprès de Dieu ». Cette formulation conserve l’idée d’un recours adressé à Dieu sans transformer nécessairement celui qui plaide en arbitre entre deux parties.
- source_word: וּבֶן אָדָם
  choice: comme un fils d’homme
  rationale: בן אדם signifie littéralement « fils d’homme » et désigne ici un être humain. « Comme » explicite la comparaison elliptique du parallélisme poétique, tandis que « le fait » restitue en français le verbe sous-entendu.
- source_word: לְרֵעֵהוּ
  choice: pour son prochain
  rationale: רֵעַ peut désigner le prochain, l’ami ou le compagnon. « Son prochain » garde une portée relationnelle assez large, et « pour » maintient le parallélisme bénéficiaire avec לְגֶבֶר.
theological_decisions:
- issue: Risque de lire « fils d’homme » comme un titre messianique
  choice: Conserver l’expression en minuscules et l’expliquer comme une désignation ordinaire de l’être humain.
  alternative: Traduire « un être humain » ou employer « Fils de l’homme » comme titre.
  rationale: Dans ce verset, בן אדם forme un parallélisme avec גבר et n’exige pas une lecture christologique. Les minuscules préservent l’expression hébraïque sans lui importer un statut de titre.
- issue: Rôle juridique de celui qui plaide
  choice: Présenter son action comme accomplie en faveur de l’homme auprès de Dieu.
  alternative: Le présenter comme un arbitre neutre entre l’homme et Dieu.
  rationale: Le לְ de לְגֶבֶר se prête naturellement à une lecture bénéficiaire, parallèle à לְרֵעֵהוּ. La traduction évite donc de résoudre la scène en médiation impartiale, tout en signalant en note l’étendue sémantique du verbe.
translation_notes:
  register: Français international actuel, sobre et poétique. La tournure « plaider pour… auprès de… » est juridiquement intelligible sans être technique. L’expression « fils d’homme » est conservée pour respecter le parallélisme hébreu, tandis que « le fait » rend explicite l’ellipse verbale nécessaire en français.
