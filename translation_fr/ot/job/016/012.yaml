base_translation:
  language: en
  yaml_path: translation/ot/job/016/012.yaml
  text: I was at ease[a], but he shattered me; he seized me by my neck and dashed me to pieces; he set me up for himself as a target.
translation:
  language: fr
  text: J’étais tranquille, mais il m’a brisé[a] ; il m’a saisi par la nuque et m’a mis en pièces ; il a fait de moi sa cible.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe traduit par « brisé » est rare ; il peut aussi être compris comme « secoué violemment » ou « déchiré ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֵו
  choice: tranquille
  rationale: L’adjectif décrit un état de calme et de sécurité. « Tranquille » est naturel en français moderne et fait ressortir le contraste avec la violence qui suit.
- source_word: וַיְפַרְפְּרֵנִי
  choice: il m’a brisé
  rationale: Ce verbe rare décrit une rupture violente de l’état antérieur de Job. « Brisé » exprime fortement l’effet destructeur sans masquer l’incertitude lexicale, signalée en note.
- source_word: וְאָחַז
  choice: il m’a saisi
  rationale: Le verbe signifie saisir ou empoigner ; « saisi » convient à la force hostile de la scène.
- source_word: בְּעָרְפִּי
  choice: par la nuque
  rationale: Le nom désigne l’arrière du cou. « Par la nuque » conserve précisément l’image et reste idiomatique en français.
- source_word: וַיְפַצְפְּצֵנִי
  choice: m’a mis en pièces
  rationale: La forme intensive de ce verbe rare évoque le fait de fracasser ou de réduire en morceaux. « Mis en pièces » transmet cette violence de manière claire et digne.
- source_word: וַיְקִימֵנִי
  choice: il m’a dressé
  rationale: La forme causative signifie faire tenir debout ou placer. « Dressé » s’accorde naturellement avec l’image d’une cible installée pour être visée.
- source_word: לוֹ
  choice: devant lui
  rationale: Le pronom rattache la cible à l’assaillant. « Devant lui » exprime naturellement la position de Job face à celui qui le vise, sans surcharger la formulation.
- source_word: לְמַטָּרָה
  choice: comme une cible
  rationale: Le nom désigne une cible ou un point de mire. « Comme une cible » conserve clairement la métaphore martiale.
theological_decisions:
- issue: Référent du sujet masculin singulier à la troisième personne
  choice: Maintenir le simple pronom « il » sans identifier explicitement l’assaillant.
  alternative: Identifier explicitement Dieu, ou comprendre un adversaire non précisé.
  rationale: Dans le contexte du discours de Job, Dieu est le référent implicite, mais ce verset n’emploie que des formes verbales et pronominales à la troisième personne. La traduction préserve cette formulation ainsi que sa tension théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La succession de verbes brefs conserve l’intensité de l’hébreu, tandis que le point-virgule structure les images successives sans les atténuer.
