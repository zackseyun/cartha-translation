- from: J’étais tranquille, mais il m’a brisé[a] ; il m’a saisi par la nuque et m’a mis en pièces ; il m’a dressé devant lui comme une cible.
  to: J’étais tranquille, mais il m’a brisé[a] ; il m’a saisi par la nuque et m’a mis en pièces ; il a fait de moi sa cible.
  rationale: La dernière proposition est révisée afin de rendre correctement לוֹ sans ajouter l’idée spatiale de « devant lui ». « Il a fait de moi sa cible » exprime en français naturel le causatif « il m’a établi/placé » et la cible qui lui est destinée, tout en conservant l’ambiguïté quant à l’identité de « il ».
