source:
  edition: WLC
  text: יָ֘סֹ֤בּוּ עָלַ֨/י רַבָּ֗י/ו יְפַלַּ֣ח כִּ֭לְיוֹתַ/י וְ/לֹ֣א יַחְמ֑וֹל יִשְׁפֹּ֥ךְ לָ֝/אָ֗רֶץ מְרֵרָֽתִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/013.yaml
  text: His archers surround me[a]; he splits open my kidneys and does not spare[c][b]; he pours out my gall on the ground.
translation:
  language: fr
  text: Ses archers[a] m’encerclent ; il me transperce les reins[b], sans m’épargner ; il répand ma bile[c] à terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses grands » ou « ses chefs ». La forme hébraïque est difficile ; « ses archers » s’accorde avec l’image d’une attaque dans ce verset et son contexte.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement « mes reins » : dans l’expression hébraïque, ces organes peuvent aussi représenter le plus profond de la personne.'
    reason: cultural_note
  - marker: c
    text: Ou « mon fiel » ; certains comprennent le terme au sens figuré de « mon amertume », mais le sens corporel convient à l’imagerie violente du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסֹבּוּ
  choice: m’encerclent
  rationale: Le qal inaccompli pluriel de סבב décrit ici des assaillants qui se disposent tout autour de Job. « M’encerclent » est naturel en français et conserve l’image hostile.
- source_word: רַבָּיו
  choice: ses archers
  rationale: La forme hébraïque est difficile. Dans ce contexte d’attaque et de blessures, le sens traditionnel « ses archers » offre la meilleure cohérence, sans masquer les autres analyses possibles, signalées en note.
- source_word: יְפַלַּח
  choice: il me fend
  rationale: Le piel de פלח exprime une action violente qui fend ou transperce. « Il me fend » restitue directement la brutalité de l’image et permet de rendre explicitement en français le pronom objet impliqué par « mes reins ».
- source_word: כִּלְיוֹתַי
  choice: les reins
  rationale: Le terme désigne littéralement les reins, organes internes associés aussi, dans l’anthropologie hébraïque, à l’être intérieur. Le français biblique et courant comprend « reins », tandis qu’une note éclaire sa portée.
- source_word: וְלֹא יַחְמוֹל
  choice: sans pitié
  rationale: Cette formulation idiomatique et concise rend l’idée qu’il n’épargne pas Job et ne lui témoigne aucune compassion.
- source_word: יִשְׁפֹּךְ
  choice: il répand
  rationale: Le qal de שפך signifie « verser, répandre ». « Répand » convient au déversement violent d’un liquide corporel sur le sol.
- source_word: מְרֵרָתִי
  choice: ma bile
  rationale: Le substantif peut désigner la bile ou le fiel et évoquer, par association, l’amertume. Le sens anatomique concret s’accorde le mieux avec les reins fendus et la violence physique de la scène.
theological_decisions:
- issue: Imagerie anthropologique dans la poésie de la souffrance
  choice: 'Conserver dans le texte les réalités corporelles concrètes : « reins » et « bile ».'
  alternative: Employer des abstractions interprétatives comme « être intérieur » et « amertume ».
  rationale: Job décrit sa souffrance au moyen d’une imagerie anatomique viscérale. La préserver maintient la force du poème hébreu et évite d’imposer une lecture psychologique ou de l’atténuer.
- issue: Identification des assaillants désignés par רַבָּיו
  choice: Rendre par « ses archers » dans le texte tout en signalant l’incertitude en note.
  alternative: Traduire par « ses grands » ou « ses chefs ».
  rationale: L’image des archers s’intègre à la métaphore d’une attaque meurtrière, mais la difficulté lexicale réelle doit rester visible afin de ne pas présenter cette interprétation comme certaine.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève conserve le rythme violent de la poésie. « M’encerclent », « fend » et « répand » sont immédiatement compréhensibles, tandis que les notes préservent les ambiguïtés lexicales de l’hébreu.
