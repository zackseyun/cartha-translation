source:
  edition: WLC
  text: אֶ֭רֶץ אַל תְּכַסִּ֣י דָמִ֑/י וְֽ/אַל יְהִ֥י מָ֝ק֗וֹם לְ/זַעֲקָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/018.yaml
  text: O earth[a], do not cover my blood[c][b], and let there be no resting place for my cry.
translation:
  language: fr
  text: Ô terre, ne couvre pas mon sang[a][c], et qu’il n’y ait pas de lieu pour mon cri[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mon sang versé ». L’hébreu dit littéralement « mon sang », mais le contexte peut évoquer le sang injustement répandu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ma clameur ». Le terme peut désigner un cri de détresse qui constitue aussi un appel à la justice.'
    reason: lexical_alternative
  - marker: c
    text: Cette image rappelle le sang qui crie depuis la terre pour obtenir justice ; voir Genèse 4.10.
    reason: cross_reference
lexical_decisions:
- source_word: אֶרֶץ
  choice: Ô terre
  rationale: Le contexte et le verbe à la deuxième personne du féminin singulier indiquent une adresse directe. « Terre » convient mieux que « pays » à la portée poétique de l’appel, et « Ô » en marque naturellement le vocatif.
- source_word: אַל תְּכַסִּי
  choice: ne couvre pas
  rationale: Avec cette forme verbale, אַל exprime une défense ou un souhait négatif pressant. « Ne couvre pas » conserve l’image concrète de ce qui ne doit être ni enfoui ni soustrait au regard.
- source_word: דָמִי
  choice: mon sang
  rationale: Le mot signifie littéralement « mon sang ». Le contexte peut évoquer le sang injustement versé, mais la formulation littérale maintient l’ambiguïté poétique et judiciaire du texte.
- source_word: וְאַל יְהִי
  choice: et qu’il n’y ait
  rationale: La construction exprime un second souhait négatif. Cette tournure française rend naturellement la valeur jussive et existentielle de l’hébreu.
- source_word: מָקוֹם
  choice: lieu de repos
  rationale: מָקוֹם signifie d’abord « lieu ». Dans ce contexte, « lieu de repos » explicite sobrement l’idée d’un endroit où le cri pourrait s’arrêter ou être réduit au silence, tout en préservant l’image.
- source_word: לְזַעֲקָתִי
  choice: pour mon cri
  rationale: זְעָקָה désigne un cri de détresse qui peut aussi constituer un appel à l’aide ou à la justice. « Mon cri » est concis, naturel et laisse subsister cette double portée.
theological_decisions:
- issue: Allusion au sang innocent qui crie pour obtenir justice
  choice: Conserver dans le texte principal les images concrètes « mon sang » et « mon cri ».
  alternative: Employer « le sang que j’ai versé » ou « ma clameur » afin de mettre davantage en avant la portée judiciaire.
  rationale: Le verset semble reprendre le motif biblique du sang qui crie depuis la terre, mais l’hébreu maintient une tension poétique entre le sang versé, la détresse et l’appel à la justice. La traduction ne tranche donc pas cette ambiguïté dans le texte principal.
translation_notes:
  register: Français international moderne, poétique et digne. Le vocatif « Ô terre » garde la force de l’apostrophe, tandis que la syntaxe parallèle préserve les deux souhaits négatifs du verset. Le point d’exclamation rend l’intensité de l’appel sans ajouter de contenu interprétatif.
