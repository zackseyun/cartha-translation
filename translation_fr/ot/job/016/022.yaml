  text: כִּֽי שְׁנ֣וֹת מִסְפָּ֣ר יֶאֱתָ֑יוּ וְ/אֹ֖רַח לֹא אָשׁ֣וּב אֶהֱלֹֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/022.yaml
  text: For a few years will come[b][a], and I will go on the path from which I will not return.
translation:
  language: fr
  text: Car quelques années encore viendront[a], et je prendrai le chemin d’où je ne reviendrai pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des années de nombre »; c’est-à-dire un petit nombre d’années, ou des années limitées.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « j’irai par un chemin sans retour ». Le chemin évoque ici le voyage irréversible vers la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui appuie la déclaration précédente de Job et conserve naturellement le lien causal.
- source_word: שְׁנוֹת מִסְפָּר
  choice: quelques années
  rationale: 'Littéralement « des années de nombre » : une tournure désignant des années peu nombreuses ou comptées.'
- source_word: יֶאֱתָיוּ
  choice: viendront encore
  rationale: Le verbe signifie « venir, arriver ». « Encore » explicite naturellement en français qu’il s’agit du peu d’années restant à venir, sans fixer leur nombre.
- source_word: וְאֹרַח
  choice: puis… le chemin
  rationale: אֹרַח désigne un chemin ou un sentier. La métaphore concrète du parcours vers la mort est conservée; « puis » rend ici la progression portée par la coordination.
- source_word: לֹא אָשׁוּב
  choice: d’où je ne reviendrai pas
  rationale: La négation et le verbe « revenir » sont conservés; « d’où » rattache naturellement en français le non-retour au chemin emprunté.
- source_word: אֶהֱלֹךְ
  choice: je prendrai
  rationale: Le verbe signifie littéralement « j’irai, je marcherai ». Avec « chemin », « je prendrai » forme une expression française naturelle tout en gardant l’idée du départ imminent.
theological_decisions:
- issue: Référence implicite à la mort
  choice: Conserver la métaphore du chemin sans nommer explicitement la mort
  alternative: « je partirai vers la mort »
  rationale: Le contexte indique un voyage irréversible vers la mort, mais l’hébreu l’exprime par une image. L’expliciter dans le texte résoudrait ce que le vers garde métaphorique.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe suit l’enchaînement causal puis temporel du vers, tandis que les notes signalent l’idiome hébreu et la portée de la métaphore sans la surinterpréter.
