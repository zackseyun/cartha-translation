    issue: Développement interprétatif de « consolateurs qui ne font qu’ajouter à la peine »
    rationale: Cette relative transforme le syntagme construct מְנַחֲמֵי עָמָל en une affirmation causale et exclusive (« ne font qu’ajouter ») qui n’est pas formulée dans l’hébreu. Une qualification directe préserve mieux l’ambiguïté.
  - severity: low
    issue: « paroles » restreint l’objet sous-entendu
    rationale: Le féminin pluriel de כְאֵלֶּה רַבּוֹת peut naturellement être rendu par « choses »; « paroles » est défendable dans le contexte, mais « choses » reste plus proche et ne restreint pas inutilement le référent.
