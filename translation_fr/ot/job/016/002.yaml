  text: שָׁמַ֣עְתִּי כְ/אֵ֣לֶּה רַבּ֑וֹת מְנַחֲמֵ֖י עָמָ֣ל כֻּלְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/002.yaml
  text: I have heard many such things[a]; all of you are miserable comforters.
translation:
  language: fr
  text: J’ai entendu bien des choses de ce genre ; vous êtes tous des consolateurs accablants.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « des consolateurs de peine » ou « des consolateurs de malheur ». Le terme peut aussi évoquer des consolateurs pénibles ou accablants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: J’ai entendu
  rationale: Le qatal qal à la première personne du singulier exprime ici l’expérience accumulée de Job, encore pertinente au moment où il parle ; le passé composé est naturel en français moderne.
- source_word: כְאֵלֶּה רַבּוֹת
  choice: bien des paroles de ce genre
  rationale: La tournure comparative כְאֵלֶּה signifie « de ce genre, comme celles-ci », et רַבּוֹת indique le grand nombre. « Paroles » explicite naturellement l’objet sous-entendu par le contexte discursif.
- source_word: מְנַחֲמֵי
  choice: consolateurs
  rationale: 'Le participe de נחם est employé comme nom. « Consolateurs » conserve l’ironie : les amis prétendent consoler Job, mais leurs propos produisent l’effet inverse.'
- source_word: עָמָל
  choice: qui ne font qu’ajouter à la peine
  rationale: עָמָל peut désigner la peine, la souffrance, le malheur ou ce qui accable. Cette formulation française rend la caractérisation négative de ces consolateurs sans figer abusivement le rapport constructif ambigu.
- source_word: כֻּלְּכֶם
  choice: vous êtes tous
  rationale: La formulation maintient l’adresse explicitement plurielle et collective visant l’ensemble des amis.
