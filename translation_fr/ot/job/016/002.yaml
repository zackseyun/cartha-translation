- from: J’ai entendu bien des paroles de ce genre ; vous êtes tous des consolateurs qui ne font qu’ajouter à la peine.[a]
  to: J’ai entendu bien des choses de ce genre ; vous êtes tous des consolateurs accablants.[a]
  rationale: La révision remplace une explicitation causale non exprimée par une qualification directe qui rend l’ironie et la valeur négative du syntagme hébreu tout en laissant ouverte sa relation exacte. « Choses » rend plus sobrement l’objet implicite de « de telles [choses] ».
