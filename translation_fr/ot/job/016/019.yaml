id: JOB.16.19
reference: Job 16:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם עַ֭תָּה הִנֵּה בַ/שָּׁמַ֣יִם עֵדִ֑/י וְ֝/שָׂהֲדִ֗/י בַּ/מְּרוֹמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/019.yaml
  text: Even now[a], behold, my witness is in heaven[b], and he who testifies for me is in the heights.
translation:
  language: fr
  text: 'Même à présent, voici : mon témoin est dans le ciel, et celui qui témoigne en ma faveur[a] est dans les hauteurs[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon témoin ». Le second terme hébreu, de forme aramaïsante, est un quasi-synonyme de « témoin ».
    reason: lexical_alternative
  - marker: b
    text: Ou « là-haut ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Même à présent
  rationale: 'Cette expression rend l’insistance temporelle de la locution hébraïque : jusque dans la situation présente de Job, son affirmation demeure vraie.'
- source_word: הִנֵּה
  choice: voici
  rationale: « Voici » conserve la fonction déictique et emphatique de la particule dans un registre français actuel et digne.
- source_word: בַשָּׁמַיִם
  choice: dans le ciel
  rationale: Le contexte désigne ici le domaine céleste plutôt que le ciel visible ; le singulier est l’expression française naturelle.
- source_word: עֵדִי
  choice: mon témoin
  rationale: Le nom עֵד désigne directement un témoin et maintient l’image judiciaire de l’appel de Job.
- source_word: וְשָׂהֲדִי
  choice: et celui qui témoigne en ma faveur
  rationale: Le terme aramaïsant est un quasi-synonyme de « témoin ». La formulation verbale préserve son sens testimonial tout en évitant une répétition pesante et sans lui attribuer le rôle plus précis d’un avocat.
- source_word: בַּמְּרוֹמִים
  choice: dans les hauteurs
  rationale: Cette traduction conserve l’image spatiale élevée et le parallélisme avec « dans le ciel ».
theological_decisions:
- issue: Identité du témoin céleste de Job
  choice: 'Le désigner seulement par sa fonction : « mon témoin » et « celui qui témoigne en ma faveur ».'
  alternative: L’identifier explicitement à Dieu, à un médiateur angélique ou à une personnification du témoignage de Job.
  rationale: L’hébreu affirme qu’un témoin se trouve au ciel sans préciser son identité. La traduction conserve donc l’image judiciaire et l’ambiguïté théologique du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » garde l’emphase poétique ; la structure parallèle et le vocabulaire judiciaire sont conservés sans préciser l’identité du témoin céleste.
