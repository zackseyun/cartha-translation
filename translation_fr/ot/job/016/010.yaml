source:
  edition: WLC
  text: פָּעֲר֬וּ עָלַ֨/י בְּ/פִי/הֶ֗ם בְּ֭/חֶרְפָּה הִכּ֣וּ לְחָיָ֑/י יַ֝֗חַד עָלַ֥/י יִתְמַלָּאֽוּ/ן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/010.yaml
  text: They have opened their mouths wide against me[a]; with reproach they have struck my cheek; together they gather themselves against me.
translation:
  language: fr
  text: Ils ouvrent grand la bouche contre moi ; ils me frappent à la joue en m’insultant ; tous ensemble, ils se liguent contre moi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils se rassemblent contre moi » ou « ils sont remplis d’hostilité contre moi ». Le dernier verbe hébreu est difficile ; il évoque ici des adversaires qui unissent leurs forces.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּעֲרוּ
  choice: ouvrent grand
  rationale: Le verbe פער décrit ici une bouche grande ouverte, avec une nuance hostile ou moqueuse. « Ouvrent grand » conserve l’image dans un français naturel.
- source_word: עָלַי
  choice: contre moi
  rationale: Dans ce contexte d’hostilité, על exprime l’action dirigée contre Job.
- source_word: בְּפִיהֶם
  choice: la bouche
  rationale: L’hébreu emploie le singulier collectif « leur bouche ». En français, « ils ouvrent grand la bouche » est naturel et garde cette formulation.
- source_word: בְּחֶרְפָּה
  choice: en m’insultant
  rationale: חֶרְפָּה évoque l’insulte, l’opprobre ou le mépris. La tournure verbale rend clairement la manière humiliante dont le coup est porté.
- source_word: הִכּוּ
  choice: frappent
  rationale: נכה désigne couramment l’action de frapper ; le présent poétique français donne de l’immédiateté à la plainte.
- source_word: לְחָיָי
  choice: à la joue
  rationale: לְחִי désigne la joue ou la mâchoire. « À la joue » restitue naturellement l’image d’une agression humiliante.
- source_word: יַחַד
  choice: tous ensemble
  rationale: יַחַד souligne l’action collective et concertée ; « tous ensemble » fait ressortir cette force de coalition.
- source_word: יִתְמַלָּאוּן
  choice: se liguent
  rationale: Cette forme de מלא est idiomatique et difficile dans ce contexte. « Se liguent » exprime le rassemblement concerté de forces hostiles sans retenir le sens littéral peu clair de « se remplir ».
theological_decisions: []
