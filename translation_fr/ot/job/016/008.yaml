  text: וַֽ֭/תִּקְמְטֵ/נִי לְ/עֵ֣ד הָיָ֑ה וַ/יָּ֥קָם בִּ֥/י כַ֝חֲשִׁ֗/י בְּ/פָנַ֥/י יַעֲנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/008.yaml
  text: You have shriveled me up—it has become a witness; my gauntness rises up against me and answers to my face.
translation:
  language: fr
  text: 'Tu m’as desséché : cela est devenu un témoin ; ma maigreur se dresse contre moi et me répond en face.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקְמְטֵנִי
  choice: Tu m’as tout ratatiné
  rationale: Le verbe קמט évoque le fait de se rider, se recroqueviller ou se ratatiner. Cette formulation concrète et naturelle conserve l’image d’un corps desséché ou contracté.
- source_word: לְעֵד הָיָה
  choice: cela sert de témoin
  rationale: La tournure hébraïque signifie littéralement « cela est devenu/était pour témoin ». « Sert de témoin » exprime naturellement que l’état physique de Job constitue une preuve visible.
- source_word: כַחֲשִׁי
  choice: ma maigreur
  rationale: Dans ce contexte corporel, le nom désigne vraisemblablement l’émaciation ou la maigreur, bien qu’il puisse ailleurs être associé au mensonge ou au déni.
- source_word: בְּפָנַי יַעֲנֶה
  choice: m’accuse en face
  rationale: Le verbe ענה signifie « répondre » ou « témoigner » ; avec l’image judiciaire du témoin, « accuse » rend sa fonction contextuelle, tandis que « en face » préserve l’expression concrète.
theological_decisions:
- issue: Identité du sujet qui a ratatiné Job
  choice: Conserver le « tu » sans expliciter Dieu
  alternative: « Dieu m’a ratatiné »
  rationale: Le texte hébreu porte une deuxième personne masculine singulière, mais le verset seul ne nomme pas explicitement son référent ; l’explicitation réduirait cette donnée discursive.
- issue: Valeur judiciaire de la souffrance visible
  choice: Présenter la maigreur comme un témoin qui accuse Job
  alternative: La présenter comme un simple signe de souffrance
  rationale: Les termes « témoin » et « répondre/témoigner » personnifient l’état physique de Job dans une scène à coloration judiciaire, sans trancher la validité de cette accusation.
translation_notes:
  register: Français moderne, direct et digne. « Ratatiné » est expressif et accessible, sans technicité médicale ; « maigreur » demeure plus naturel que « émaciation ». La ponctuation conserve le parallélisme et la progression de l’image judiciaire.
