source:
  edition: WLC
  text: הֲ/קֵ֥ץ לְ/דִבְרֵי ר֑וּחַ א֥וֹ מַה יַּ֝מְרִֽיצְ/ךָ֗ כִּ֣י תַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/003.yaml
  text: Is there no end to windy words? Or what provokes you[a], that you answer this way?
translation:
  language: fr
  text: N’y aura-t-il pas de fin aux paroles en l’air ? Ou qu’est-ce qui te pousse à répondre[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’est-ce qui t’encourage à répondre ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲקֵץ
  choice: N’y aura-t-il pas de fin
  rationale: קֵץ désigne une fin ou une limite. Dans ce contexte, l’interrogation a une force rhétorique et exprime l’exaspération de Job.
- source_word: לְדִבְרֵי רוּחַ
  choice: aux paroles en l’air
  rationale: L’expression signifie littéralement « paroles de vent ». « Paroles en l’air » conserve l’image tout en exprimant naturellement en français l’idée de propos vides et inconsistants.
- source_word: אוֹ
  choice: Ou
  rationale: La conjonction introduit simplement la seconde question rhétorique.
- source_word: מַה
  choice: qu’est-ce qui
  rationale: Le pronom interrogatif porte ici sur ce qui motive ou suscite la réponse de l’interlocuteur.
- source_word: יַמְרִיצְךָ
  choice: te pousse
  rationale: La forme verbale peut évoquer ce qui incite, stimule ou donne de l’audace. « Te pousse » convient au contexte polémique tout en laissant ouverte la nuance précise.
- source_word: כִּי
  choice: à
  rationale: La relation entre l’impulsion et la réponse se rend idiomatiquement en français par la construction « pousser à ».
- source_word: תַעֲנֶה
  choice: répondre ainsi
  rationale: Le verbe signifie « répondre ». « Ainsi » explicite légèrement la portée réprobatrice de la question en renvoyant à la manière dont l’interlocuteur vient de parler.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La métaphore du vent est conservée sous la forme idiomatique « paroles en l’air » ; le tutoiement correspond à l’adresse directe entre Job et ses interlocuteurs.
