  text: אַפּ֤/וֹ טָרַ֨ף וַֽ/יִּשְׂטְמֵ֗/נִי חָרַ֣ק עָלַ֣/י בְּ/שִׁנָּ֑י/ו צָרִ֓/י יִלְט֖וֹשׁ עֵינָ֣י/ו לִֽ/י׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/009.yaml
  text: His anger has torn me and hated me[a]; he gnashes his teeth at me; my adversary sharpens his eyes against me.
translation:
  language: fr
  text: Dans sa colère, il m’a déchiré et m’a pris en haine ; il grince des dents contre moi. Mon adversaire aiguise son regard contre moi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aiguise ses yeux contre moi ». Cette image hébraïque décrit un regard hostile, fixe et pénétrant.'
    reason: La formulation principale rend la métaphore de façon intelligible en français, tandis que la note conserve l’image corporelle exacte de l’hébreu.
lexical_decisions:
- source_word: אַפּוֹ
  choice: Sa colère
  rationale: אַף désigne littéralement le nez, puis, par extension idiomatique, la colère. « Sa colère » restitue ici naturellement le sens figuré sans affaiblir la violence du passage.
- source_word: טָרַף
  choice: m’a déchiré
  rationale: Le verbe évoque l’action d’une bête qui déchire sa proie. Le passé composé exprime en français une action subie dont les effets demeurent présents.
- source_word: וַיִּשְׂטְמֵנִי
  choice: et il m’a pris en haine
  rationale: שׂטם exprime la haine ou une hostilité profonde. « Prendre en haine » conserve le changement grammatical du texte, où « sa colère » précède un verbe dont le sujet est masculin singulier, sans ajouter une attaque non explicitée.
- source_word: חָרַק עָלַי בְּשִׁנָּיו
  choice: il grince des dents contre moi
  rationale: Cette formulation française naturelle conserve le geste de colère et la direction hostile indiquée par עָלַי.
- source_word: צָרִי
  choice: Mon adversaire
  rationale: צַר désigne une personne hostile ou opposée. « Adversaire » laisse ouverte l’identité du référent et n’impose ni un cadre militaire ni un cadre judiciaire.
- source_word: יִלְטוֹשׁ עֵינָיו לִי
  choice: aiguise son regard contre moi
  rationale: לָטַשׁ signifie aiguiser ou affûter. « Aiguise son regard » préserve la métaphore tranchante tout en étant plus intelligible en français que le calque « aiguise ses yeux » ; « contre moi » rend l’orientation hostile de לִי.
theological_decisions:
- issue: Identité du sujet hostile dans la plainte de Job
  choice: Conserver les pronoms masculins singuliers et « mon adversaire » sans nommer le référent.
  alternative: Identifier explicitement le sujet comme Dieu, comme un ennemi humain, ou comme une figure poétique mêlant les deux.
  rationale: Le verset présente une figure hostile au masculin singulier, mais ne la nomme pas explicitement. La traduction maintient donc l’ambiguïté et la tension théologique du texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme en trois mouvements conserve la vigueur de la plainte ; le passé composé rend les actes subis, puis le présent rend la scène immédiatement visible.
