  text: אֲאַמִּצְ/כֶ֥ם בְּמוֹ פִ֑/י וְ/נִ֖יד שְׂפָתַ֣/י יַחְשֹֽׂךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/005.yaml
  text: I could strengthen you with my mouth[b][a], and the moving of my lips could hold back grief.
translation:
  language: fr
  text: Je vous fortifierais par les paroles de ma bouche, et le mouvement de mes lèvres vous soulagerait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et le mouvement de mes lèvres retiendrait ». Le complément du verbe n’est pas exprimé en hébreu. Le mot traduit par « mouvement » peut aussi évoquer un geste ou des paroles de compassion et de réconfort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲאַמִּצְכֶם
  choice: Je vous fortifierais
  rationale: Le piel de אמץ signifie « fortifier, rendre fort ». Le conditionnel prolonge naturellement l’hypothèse du verset précédent, où Job imagine les rôles inversés.
- source_word: בְּמוֹ פִי
  choice: par les paroles de ma bouche
  rationale: La bouche est l’instrument de la parole. Cette formulation conserve l’image concrète de l’hébreu tout en étant plus naturelle en français que « avec ma bouche ».
- source_word: נִיד שְׂפָתַי
  choice: le mouvement de mes lèvres
  rationale: נִיד peut désigner un mouvement ou un geste, notamment associé à la compassion ou à la consolation. La traduction conserve l’image et son ambiguïté plutôt que de la réduire d’emblée à « réconfort ».
- source_word: יַחְשֹׂךְ
  choice: vous soulagerait
  rationale: חשׂך signifie fondamentalement « retenir, épargner ». Comme l’objet n’est pas exprimé, le français explicite avec mesure l’effet consolateur suggéré par le contexte, sans nommer précisément ce qui serait retenu ou diminué.
