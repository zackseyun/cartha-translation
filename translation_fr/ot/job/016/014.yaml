  text: He breaks through me with breach upon breach[b][a]; he rushes at me like a warrior.
translation:
  language: fr
  text: Il me fait brèche après brèche[a] ; il se rue sur moi comme un guerrier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque, littéralement « brèche sur la face d’une brèche », évoque des brèches successives ou accumulées.
    reason: literal_rendering
  - marker: b
    text: 'Ou : « comme un homme puissant » ou « comme un homme vaillant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְרְצֵנִי
  choice: Il ouvre en moi
  rationale: Le qal de פרץ avec le suffixe de première personne décrit une rupture violente infligée à Job. « Ouvre en moi » s’associe naturellement à « brèche » et conserve l’image concrète sans la surcharger.
- source_word: פֶרֶץ עַל־פְּנֵי פָרֶץ
  choice: brèche sur brèche
  rationale: Cette formulation garde la répétition hébraïque et exprime l’accumulation ou la succession des coups dans une langue poétique et compréhensible.
- source_word: יָרֻץ עָלַי
  choice: il se rue sur moi
  rationale: Le verbe רוץ signifie courir ; dans ce mouvement hostile, « se ruer sur » restitue la rapidité et l’agression indiquées par עָלַי.
- source_word: כְגִבּוֹר
  choice: comme un guerrier
  rationale: גִּבּוֹר peut désigner un homme fort, un vaillant ou un guerrier. Le contexte d’un assaut violent favorise « guerrier ».
