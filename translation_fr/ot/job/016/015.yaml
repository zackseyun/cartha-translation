source:
  edition: WLC
  text: שַׂ֣ק תָּ֭פַרְתִּי עֲלֵ֣י גִלְדִּ֑/י וְ/עֹלַ֖לְתִּי בֶ/עָפָ֣ר קַרְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/015.yaml
  text: I have sewn sackcloth over my skin[b][a], and thrust my horn into the dust.
translation:
  language: fr
  text: J’ai cousu une toile de sac à même ma peau, et j’ai plongé ma corne[a] dans la poussière[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « corne » représente ici la force, l’honneur ou l’élévation.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « j’ai abaissé — ou profané — ma corne dans la poussière ». Le sens exact du verbe hébreu est incertain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂק
  choice: une toile de sac
  rationale: Désigne l’étoffe grossière portée en signe de deuil; « toile de sac » est naturel et précis en français moderne.
- source_word: תָּפַרְתִּי
  choice: J’ai cousu
  rationale: Le qal accompli à la première personne décrit une action achevée dont l’effet demeure.
- source_word: עֲלֵי גִלְדִּי
  choice: sur ma peau
  rationale: גֶּלֶד désigne la peau; la préposition exprime ici le fait d’y fixer ou d’y porter l’étoffe.
- source_word: וְעֹלַלְתִּי
  choice: et j’ai enfoncé
  rationale: Le verbe est difficile. « Enfoncé » conserve une action concrète d’abaissement associée à la poussière, sans réduire l’image à une interprétation abstraite.
- source_word: בֶעָפָר
  choice: dans la poussière
  rationale: Rend naturellement la préposition ב avec le mouvement résultant suggéré par « enfoncé ».
- source_word: קַרְנִי
  choice: ma corne
  rationale: La traduction littérale préserve la métaphore hébraïque de la force, de l’honneur ou de l’élévation.
theological_decisions:
- issue: Image métaphorique de la corne
  choice: Conserver « ma corne » dans le texte
  alternative: ma force; ma dignité
  rationale: L’image concrète exprime l’humiliation de Job tout en conservant la texture poétique et la pluralité de ses connotations.
- issue: Sens incertain de וְעֹלַלְתִּי
  choice: j’ai enfoncé
  alternative: j’ai abaissé; j’ai profané; j’ai jeté à terre
  rationale: Le sens précis du verbe est discuté. Une formulation concrète convient au contexte de deuil, tandis qu’une note signale honnêtement les autres possibilités.
translation_notes:
  register: Français international moderne, digne et poétique. L’image hébraïque de la corne est maintenue et l’incertitude lexicale du second verbe est explicitée en note.
