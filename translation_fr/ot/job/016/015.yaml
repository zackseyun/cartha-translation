  naturalness: « J’ai enfoncé ma corne dans la poussière » est compréhensible, mais « enfoncer » évoque plus spontanément un objet rigide ou un coup de corne et alourdit l’image en français. « Plongé ma corne dans la poussière » est plus idiomatique et poétique, tout en gardant l’action concrète et non interprétative. « À même ma peau » exprime naturellement le contact direct de l’étoffe avec la peau.
  terminology: « Toile de sac » rend bien le matériau grossier du deuil sans réduire l’expression à un simple sac-contenant. « Corne » doit être conservé dans le texte; la note culturelle explique adéquatement la métaphore sans l’imposer comme paraphrase.
