  text: יַסְגִּירֵ֣/נִי אֵ֭ל אֶ֣ל עֲוִ֑יל וְ/עַל יְדֵ֖י רְשָׁעִ֣ים יִרְטֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/011.yaml
  text: God hands me over to the ungodly and throws me into the hands of the wicked[a][b].
translation:
  language: fr
  text: Dieu me livre à un impie[a] et me jette entre les mains des méchants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à un homme injuste » ou « à un homme sans Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: Le dernier verbe hébreu est rare et difficile ; il est probablement à comprendre comme « me jette » ou « me précipite ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּירֵנִי
  choice: me livre
  rationale: Le hiphil de סגר exprime ici le fait de livrer quelqu’un au pouvoir d’un autre. « Me livre » est naturel en français et conserve la portée hostile de l’action.
- source_word: אֵל
  choice: Dieu
  rationale: Dans ce contexte, אֵל désigne Dieu, auteur de l’action dont Job se plaint, plutôt qu’un simple « puissant ».
- source_word: אֶל
  choice: à
  rationale: La préposition marque le transfert vers une autre personne et s’intègre naturellement à la construction française « livrer à ».
- source_word: עֲוִיל
  choice: l’homme impie
  rationale: Le nom singulier désigne une personne moralement perverse ou irréligieuse. « L’homme impie » conserve à la fois le singulier et la portée éthique et religieuse du terme.
- source_word: וְעַל יְדֵי
  choice: entre les mains de
  rationale: L’expression évoque le pouvoir ou la domination de ceux auxquels Job est abandonné. L’équivalent idiomatique français est « entre les mains de ».
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Ce terme pluriel désigne ceux qui se caractérisent par leur méchanceté ou leur culpabilité morale. « Les méchants » est concis et usuel.
- source_word: יִרְטֵנִי
  choice: me jette
  rationale: Le verbe rare et difficile semble décrire un mouvement violent, comme jeter ou précipiter. « Me jette » rend cette force sans imposer une image plus précise que le texte ne permet.
theological_decisions:
- issue: Référent de אֵל
  choice: Job affirme que Dieu le livre lui-même à l’homme impie.
  alternative: Comprendre אֵל comme un « puissant » indéterminé.
  rationale: Dans le livre de Job et dans le contexte immédiat de la plainte, אֵל renvoie naturellement à Dieu. Cette lecture préserve la tension théologique du propos de Job sans l’atténuer.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme hébreu est conservé, ainsi que la plainte directe attribuant l’action à Dieu. « L’homme impie » évite de transformer abusivement le singulier hébreu en pluriel, tandis que « entre les mains » restitue l’image de la domination.
