  - severity: low
    issue: La note b contient une formulation alternative maladroite (« toute mon assemblée ») et privilégie une explication domestique trop affirmée.
    rationale: Une note doit présenter les options sans réduire le référent à la famille ou au foyer de Job. Une formulation plus neutre préserve l’éventail sémantique.
