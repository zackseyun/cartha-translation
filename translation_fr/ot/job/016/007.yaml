source:
  edition: WLC
  text: אַךְ עַתָּ֥ה הֶלְאָ֑/נִי הֲ֝שִׁמּ֗וֹתָ כָּל עֲדָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/007.yaml
  text: Surely now he has worn me out[b][a]; you have devastated all my company.
translation:
  language: fr
  text: Mais maintenant, il m’a épuisé[a] ; tu as dévasté tout mon entourage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il m’a accablé de fatigue » ou « il m’a rendu las ».
    reason: lexical_alternative
  - marker: b
    text: Ou « toute mon assemblée », « toute ma communauté » ou « toute ma maisonnée ». L’hébreu désigne un groupe réuni ; dans ce contexte, il peut s’agir du cercle des proches ou des dépendants de Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mais
  rationale: Dans ce tournant de la plainte, אַךְ introduit naturellement un contraste appuyé avec ce qui précède. « Mais » rend ce mouvement en français courant sans imposer le sens restrictif de « seulement ».
- source_word: עַתָּה
  choice: maintenant
  rationale: L’adverbe temporel exprime l’état présent de Job et garde l’immédiateté de sa plainte.
- source_word: הֶלְאָנִי
  choice: il m’a épuisé
  rationale: La forme issue de לאה signifie rendre las ou épuiser. Le sujet masculin singulier demeure implicite ; « il » préserve cette indétermination au lieu de nommer explicitement Dieu.
- source_word: הֲשִׁמּוֹתָ
  choice: tu as dévasté
  rationale: La forme causative de שמם exprime l’action de rendre désert ou désolé. « Dévasté » conserve la force du verbe et la deuxième personne du singulier.
- source_word: כָּל
  choice: toute
  rationale: Le terme totalisant porte sur l’ensemble désigné par עֲדָתִי.
- source_word: עֲדָתִי
  choice: ma maisonnée
  rationale: עֵדָה désigne normalement un groupe réuni, une assemblée ou une communauté. Dans le contexte de Job, « maisonnée » peut englober son cercle familial et domestique, tandis que les sens plus formels restent signalés en note.
theological_decisions:
- issue: Changement de personne grammaticale entre les deux verbes
  choice: 'Conserver le passage de la troisième personne à la deuxième : « il m’a épuisé ; tu as dévasté… »'
  alternative: Harmoniser les deux verbes à la deuxième personne (« tu m’as épuisé… ») ou à la troisième personne.
  rationale: Le texte massorétique présente הֶלְאָנִי à la troisième personne masculine singulière, puis הֲשִׁמּוֹתָ à la deuxième personne masculine singulière. La traduction maintient cette tension et laisse ouverte la possibilité que Job passe d’un discours sur Dieu à une adresse directe.
translation_notes:
  register: Français international moderne, naturel et digne. Le contraste initial, la force de la lamentation et le changement abrupt de personne grammaticale sont conservés. « Maisonnée » évite la coloration cultuelle que « congrégation » aurait en français, tout en gardant l’idée d’un groupe lié à Job.
