  source_fidelity: 'Le changement abrupt de personne est correctement préservé : הֶלְאַנִי est à la troisième personne (« il m’a épuisé »), puis הֲשִׁמּוֹתָ à la deuxième (« tu as dévasté »). « Mais maintenant » rend de façon recevable l’emphase/tournant introduit par אַךְ. En revanche, « maisonnée » restreint indûment עֲדָתִי à la sphère domestique et familiale ; le terme désigne plus largement le groupe, l’assemblée ou l’entourage de Job.'
  naturalness: La phrase est naturelle, sobre et conserve la vigueur de la plainte. « Tout mon entourage » est idiomatique en français international moderne et évite d’attribuer au terme hébreu un sens domestique trop précis.
  terminology: '« Entourage » est ici un rendu contextuel prudent de עֵדָה ; les possibilités plus proches de la forme lexicale (« assemblée », « communauté ») ainsi que la lecture domestique sont maintenues en note. La note b est aussi corrigée : « toute mon assemblée » était grammaticalement possible mais peu naturel et ne correspondait pas au genre de la formulation proposée ; la note reformulée évite cette difficulté.'
