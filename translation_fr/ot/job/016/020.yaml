  text: מְלִיצַ֥/י רֵעָ֑/י אֶל אֱ֝ל֗וֹהַ דָּלְפָ֥ה עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/020.yaml
  text: My friends are my mockers[a]; my eye pours out tears to God.
translation:
  language: fr
  text: Mes amis sont mes moqueurs[a] ; mon œil verse des larmes vers Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mes amis sont mes interprètes » ou « mes médiateurs ». Le terme hébreu peut être compris dans un sens positif, mais « moqueurs » correspond mieux ici à la plainte de Job.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלִיצַי
  choice: mes moqueurs
  rationale: Dans le contexte de la plainte de Job contre ses amis, le sens négatif « moqueurs » convient le mieux. Le terme peut toutefois recevoir un sens plus positif, conservé en note.
- source_word: רֵעָי
  choice: mes amis
  rationale: רֵעַ désigne couramment un ami ou un compagnon. « Mes amis » est naturel en français et souligne l'ironie douloureuse de la plainte.
- source_word: אֶל אֱלוֹהַ
  choice: devant Dieu
  rationale: אֶל exprime ici l'orientation du regard et des pleurs vers Dieu. « Devant Dieu » rend naturellement en français le fait que Job pleure en se tournant vers lui, sans employer le nom hébreu inhabituel Éloah.
- source_word: דָּלְפָה
  choice: verse des larmes
  rationale: Le verbe évoque un liquide qui goutte ou ruisselle. Avec « mon œil » comme sujet, « verse des larmes » restitue clairement et dignement l'image des pleurs.
- source_word: עֵינִי
  choice: mon œil
  rationale: Le singulier hébreu est conservé pour respecter l'image poétique du texte.
theological_decisions:
- issue: Valeur de מְלִיצַי
  choice: mes moqueurs
  alternative: mes interprètes / mes médiateurs
  rationale: La forme est lexicalement discutée. Le contexte immédiat favorise la plainte contre des amis qui tournent Job en dérision, mais la possibilité d'un rôle d'interprète ou de médiateur ne doit pas être éliminée et figure donc en note.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme bref est conservé, ainsi que le singulier expressif « mon œil ». Le point-virgule maintient le lien entre l'hostilité des amis et les pleurs adressés à Dieu.
