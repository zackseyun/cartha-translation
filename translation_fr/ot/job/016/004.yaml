  source_fidelity: 'La structure hypothétique et la réciprocité rhétorique sont bien rendues : Job affirme qu’il pourrait parler de la même manière si ses interlocuteurs étaient dans sa situation. « Aligner des paroles contre vous » rend de façon recevable le verbe hébreu exprimant l’idée d’assembler ou d’enchaîner des paroles. En revanche, « hocher la tête » désigne normalement en français un mouvement d’acquiescement, alors que נוּעַ avec « tête » évoque un mouvement de tête de dérision ou de mépris ; « secouer la tête » est requis.'
