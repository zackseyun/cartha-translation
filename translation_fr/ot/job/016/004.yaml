source:
  edition: WLC
  text: גַּ֤ם אָנֹכִי֮ כָּ/כֶ֪ם אֲדַ֫בֵּ֥רָה ל֤וּ יֵ֪שׁ נַפְשְׁ/כֶ֡ם תַּ֤חַת נַפְשִׁ֗/י אַחְבִּ֣ירָה עֲלֵי/כֶ֣ם בְּ/מִלִּ֑ים וְ/אָנִ֥יעָה עֲ֝לֵי/כֶ֗ם בְּמ֣וֹ רֹאשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/004.yaml
  text: I too could speak like you[a], if your soul were in place of my soul[c][b]; I could heap up words against you and shake my head at you.
translation:
  language: fr
  text: 'Moi aussi, je pourrais parler comme vous,

    si vous étiez à ma place[a] ;

    je pourrais aligner des paroles contre vous

    et secouer la tête devant vous[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si votre personne était à la place de ma personne ». Le nom hébreu peut désigner l’âme, la vie, la personne ou le soi selon le contexte.'
    reason: lexical_alternative
  - marker: b
    text: Secouer la tête est ici un geste de mépris ou de dérision.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אָנֹכִי כָכֶם אֲדַבֵּרָה
  choice: Moi aussi, je pourrais parler comme vous
  rationale: La formulation conserve l’insistance de גַּם אָנֹכִי et rend naturellement la possibilité hypothétique exprimée dans ce contexte.
- source_word: לוּ יֵשׁ נַפְשְׁכֶם תַּחַת נַפְשִׁי
  choice: si vous étiez à ma place
  rationale: Ici, נֶפֶשׁ désigne la personne ou le soi. Cette tournure française exprime clairement l’échange de situation tout en évitant le sens moderne trop étroit de « âme ».
- source_word: אַחְבִּירָה עֲלֵיכֶם בְּמִלִּים
  choice: je pourrais aligner des paroles contre vous
  rationale: Le verbe חָבַר évoque l’action de joindre ou d’assembler. « Aligner des paroles » reste proche de cette image et convient à un discours dirigé contre les interlocuteurs.
- source_word: וְאָנִיעָה עֲלֵיכֶם בְּמוֹ רֹאשִׁי
  choice: et hocher la tête à vos dépens
  rationale: Le geste de la tête exprime ici la dérision. « À vos dépens » restitue la valeur hostile de עֲלֵיכֶם plus naturellement que le calque « sur vous ».
theological_decisions: []
translation_notes:
  register: 'Français international moderne, naturel et digne. Le parallélisme poétique est conservé en quatre lignes. La traduction privilégie une équivalence optimale : elle explicite l’échange de places sans réduire נֶפֶשׁ à l’« âme » au sens courant, et maintient l’image d’un discours assemblé contre les interlocuteurs.'
