source:
  edition: WLC
  text: אָ֭מְנָם כִּ֣י אַתֶּם עָ֑ם וְ֝/עִמָּ/כֶ֗ם תָּמ֥וּת חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/002.yaml
  text: No doubt you are the people[a], and wisdom will die with you.
translation:
  language: fr
  text: Certes, vous êtes le peuple[a], et avec vous mourra la sagesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Certes, vous êtes le peuple, et avec vous périra la sagesse. » La parole est généralement comprise comme une ironie de Job à l’égard de ses amis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם כִּי
  choice: Sans aucun doute
  rationale: Les deux termes renforcent ensemble l’affirmation. Cette tournure française naturelle conserve la concession manifestement ironique de Job.
- source_word: אַתֶּם
  choice: vous
  rationale: Pronom personnel masculin pluriel qui s’adresse directement aux amis de Job; la dislocation « c’est vous » met en relief leur prétention.
- source_word: עָם
  choice: le peuple
  rationale: Rendu littéral qui préserve l’expression sarcastique selon laquelle les interlocuteurs seraient à eux seuls « le peuple », comme s’ils représentaient toute l’humanité qui compte.
- source_word: וְעִמָּכֶם
  choice: et avec vous
  rationale: 'La préposition exprime l’accompagnement: la sagesse disparaîtrait en même temps qu’eux.'
- source_word: תָּמוּת
  choice: mourra
  rationale: Le qal inaccompli à la troisième personne féminine du singulier s’accorde avec « sagesse ». « Mourra » conserve l’image directe et mordante de l’hébreu.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Équivalent français courant du nom hébreu; ici, la sagesse est ironiquement présentée comme monopolisée par les amis de Job.
theological_decisions:
- issue: Portée ironique de l’affirmation
  choice: Conserver une formulation littérale dont l’ironie ressort du contexte et du point d’exclamation
  alternative: 'Expliciter: « vous êtes les seuls à avoir de la sagesse »'
  rationale: L’hébreu ne formule pas explicitement cette paraphrase. La traduction maintient donc l’image et la tension rhétorique sans imposer une interprétation dans le corps du texte.
translation_notes:
  register: Français moderne, international et digne. La tournure emphatique « c’est vous qui » rend le relief du pronom hébreu et soutient l’ironie sans recourir à un vocabulaire familier.
