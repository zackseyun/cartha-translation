  yaml_path: translation/ot/job/012/008.yaml
  text: Or speak to the earth[a], and it will teach you[b]; and the fish of the sea will tell you.
translation:
  language: fr
  text: Ou parle à la terre[a], et elle t’enseignera ; les poissons de la mer te diront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au pays » ; le mot hébreu אֶרֶץ peut signifier « terre » ou « pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: א֤וֹ
  choice: Ou
  rationale: La particule disjonctive poursuit la série d’appels du contexte. « Ou » est le lien français le plus naturel.
- source_word: שִׂ֣יחַ
  choice: parle
  rationale: Avec le complément « à la terre », l’impératif désigne ici le fait de s’adresser à elle, en parallèle avec l’interrogation des animaux au verset précédent.
- source_word: לָ/אָ֣רֶץ
  choice: à la terre
  rationale: אֶרֶץ peut désigner la terre ou le pays. L’énumération cosmique des animaux, des oiseaux et des poissons favorise ici « terre ».
- source_word: וְ/תֹרֶ֑/ךָּ
  choice: et elle t’enseignera
  rationale: Le hiphil de ירה signifie couramment « enseigner ». Le pronom féminin est naturel en français avec « terre » et conserve la personnification de l’hébreu.
- source_word: וִֽ/יסַפְּר֥וּ לְ֝/ךָ֗
  choice: te le raconteront
  rationale: Au piel, ספר peut signifier raconter, rapporter ou déclarer. « Te le raconteront » est idiomatique et rend explicite en français le contenu sous-entendu, sans en préciser la nature.
- source_word: דְּגֵ֣י הַ/יָּֽם
  choice: les poissons de la mer
  rationale: Cette formulation reproduit simplement le groupe construit hébreu et en préserve l’image poétique.
