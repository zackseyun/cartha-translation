  source_fidelity: 'Le sens fondamental est bien rendu : l’adversatif, l’invitation pressante à interroger, les animaux terrestres, les oiseaux, ainsi que les deux verbes de connaissance sont conservés. Toutefois, « ils te le feront savoir » introduit un pronom objet (« le ») qui n’est pas exprimé dans l’hébreu ; même s’il est contextuellement inférable, il n’est pas nécessaire en français.'
  naturalness: 'Le registre est moderne et convenablement poétique. La double construction avec deux-points (« les oiseaux du ciel : ils… ») est toutefois heurtée en français, car le second groupe est coordonné à l’objet du même impératif hébreu, non une nouvelle proposition autonome.'
  terminology: « Les animaux », « t’instruiront » et « les oiseaux du ciel » sont justes et naturels. « Te renseigneront » rend sobrement le hiphil de נגד (« faire savoir, informer »), sans ajouter d’objet absent du texte source.
