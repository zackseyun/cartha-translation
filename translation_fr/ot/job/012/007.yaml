  text: וְֽ/אוּלָ֗ם שְׁאַל נָ֣א בְהֵמ֣וֹת וְ/תֹרֶ֑/ךָּ וְ/ע֥וֹף הַ֝/שָּׁמַ֗יִם וְ/יַגֶּד לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/007.yaml
  text: But ask the animals[a], please, and they will teach you, and the birds of the heavens, and they will tell you.
translation:
  language: fr
  text: 'Mais interroge donc les animaux : ils t’instruiront, et les oiseaux du ciel te renseigneront.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mais
  rationale: Marque le tournant contrastif dans le discours de Job ; « Mais » est naturel, bref et fidèle.
- source_word: שְׁאַל נָא
  choice: interroge donc
  rationale: L’impératif signifie « interroger, demander », et נָא ajoute ici une nuance d’insistance ou d’invitation ; « donc » la rend naturellement sans imposer le sens temporel « maintenant ».
- source_word: בְהֵמוֹת
  choice: les animaux
  rationale: Le terme désigne ici largement les animaux terrestres, en parallèle avec les oiseaux, plutôt que le seul bétail.
- source_word: וְתֹרֶךָּ
  choice: ils t’instruiront
  rationale: Le hiphil de ירה signifie « enseigner, instruire ». Le féminin singulier hébreu s’accorde avec le nom collectif, tandis que le français emploie naturellement le pluriel avec « les animaux ».
- source_word: וְעוֹף הַשָּׁמַיִם
  choice: les oiseaux du ciel
  rationale: « Oiseaux » convient au contexte, et « du ciel » est l’expression française naturelle correspondant à l’hébreu littéral « des cieux ».
- source_word: וְיַגֶּד לָךְ
  choice: ils te le feront savoir
  rationale: Le hiphil de נגד exprime l’action de faire connaître. Le pronom « le » reprend implicitement ce que Job invite son interlocuteur à apprendre et donne une formulation française idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme hébreu est conservé par les deux propositions juxtaposées, avec une légère variation entre « instruiront » et « feront savoir ».
