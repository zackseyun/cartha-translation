  text: A torch is despised in the thought of one who is at ease; it is ready for those whose foot slips.
translation:
  language: fr
  text: Une torche est méprisée aux yeux de celui qui est à l’aise ; elle est prête pour ceux dont le pied glisse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu difficile. Autre analyse possible : « Le malheur est méprisé aux yeux de celui qui est à l’aise ; il est prêt pour ceux dont le pied glisse. »'
    reason: Le sens de עַשְׁתּוּת, la syntaxe des deux membres et, selon cette lecture, le sens de לַפִּיד sont discutés. La note conserve une analyse ancienne possible sans l’imposer au texte principal.
lexical_decisions:
- source_word: לַפִּיד
  choice: une torche
  rationale: Sens courant du nom hébreu ; l’image d’une torche, inutile à celui qui se croit en sécurité mais nécessaire au marcheur menacé de chute, est conservée.
- source_word: בּוּז
  choice: est méprisée
  rationale: Le substantif « mépris » forme ici une proposition nominale ; le français exige naturellement une formulation verbale.
- source_word: לְעַשְׁתּוּת שַׁאֲנָן
  choice: par celui qui vit dans l’insouciance
  rationale: Le syntagme est difficile. שַׁאֲנָן désigne celui qui est tranquille ou à l’aise ; עַשְׁתּוּת, rare et incertain, peut évoquer la pensée ou l’état d’esprit. La formulation française exprime sans lourdeur l’attitude de sécurité insouciante.
- source_word: נָכוֹן
  choice: elle est prête
  rationale: Rend le sens de « préparée, prête » et maintient la torche comme antécédent probable.
- source_word: לְמוֹעֲדֵי רָגֶל
  choice: pour ceux dont le pied chancelle
  rationale: מוֹעֲדֵי est une forme difficile, généralement comprise ici comme liée au vacillement ou au glissement ; le singulier collectif רֶגֶל est conservé par « le pied ».
theological_decisions:
- issue: Rapport entre la torche et le pied qui chancelle
  choice: La torche est présentée comme prête pour celui qui risque de tomber.
  alternative: Comprendre « mépris » comme ce qui attend celui dont le pied chancelle.
  rationale: La syntaxe et l’image permettent plusieurs analyses, mais l’antécédent féminin implicite de « prête » se rattache naturellement à la torche ; cette lecture suit le parallélisme sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français moderne, sobre et poétique. « Insouciance » transmet ici une tranquillité sûre d’elle-même, tandis que « chancelle » conserve l’image concrète du pied menacé de chute.
