  text: מִ֭י לֹא יָדַ֣ע בְּ/כָל אֵ֑לֶּה כִּ֥י יַד יְ֝הוָה עָ֣שְׂתָה זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/009.yaml
  text: Who among all these does not know that the hand of Yahweh has done this?[a]
translation:
  language: fr
  text: Qui, parmi tous ceux-là, ne sait pas que la main de Yahweh a fait cela ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH », traditionnellement rendu par « le Seigneur ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: מִי לֹא יָדַע
  choice: Qui […] ne sait pas
  rationale: La question rhétorique est rendue au présent, forme naturelle en français pour exprimer une connaissance tenue pour générale.
- source_word: בְּ/כָל אֵלֶּה
  choice: parmi tous ceux-là
  rationale: 'La préposition ב est comprise ici dans un sens partitif : « parmi tous ceux-là ». Le démonstratif renvoie aux êtres mentionnés dans le contexte précédent sans ajouter explicitement « créatures ».'
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce qui est su.
- source_word: יַד
  choice: la main
  rationale: L’image anthropomorphique hébraïque est conservée ; elle exprime à la fois l’action et la puissance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: עָשְׂתָה זֹּאת
  choice: a fait cela
  rationale: Le verbe עשה garde son sens large de « faire », et le démonstratif féminin singulier est rendu directement par « cela ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme ; « Yahweh » préserve le caractère de nom propre, tandis que la note signale le rendu traditionnel par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure interrogative conserve la force rhétorique du verset, et « la main » maintient l’image concrète de l’hébreu.
