reference: Job 12:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מַשְׂגִּ֣יא לַ֭/גּוֹיִם וַֽ/יְאַבְּדֵ֑/ם שֹׁטֵ֥חַ לַ֝/גּוֹיִ֗ם וַ/יַּנְחֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/023.yaml
  text: He makes nations great[a], and he destroys them; he enlarges nations, and he leads them away.
translation:
  language: fr
  text: Il fait grandir les nations et les détruit ; il agrandit les nations et les conduit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les emmène ». Le verbe hébreu signifie « conduire » ou « guider » ; dans ce contexte, il peut évoquer le déplacement des nations sans en préciser la destination.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂגִּיא
  choice: fait grandir
  rationale: Le participe causatif de שׂגא exprime le fait de rendre grand ou de faire croître. « Fait grandir » conserve ce sens sans préciser indûment s’il s’agit de puissance, de territoire ou de prospérité.
- source_word: לַגּוֹיִם
  choice: les nations
  rationale: גּוֹיִם désigne ici des peuples constitués en nations, sans opposition particulière entre Israël et les non-Juifs.
- source_word: וַיְאַבְּדֵם
  choice: et les détruit
  rationale: La forme exprime le fait de causer leur perte. « Détruit » est concise et fait ressortir le contraste avec leur croissance.
- source_word: שֹׁטֵחַ
  choice: il étend
  rationale: Le participe évoque l’action d’étaler ou d’étendre. Appliqué aux nations, « étend » reste naturel tout en préservant l’image d’une expansion.
- source_word: וַיַּנְחֵם
  choice: et les conduit
  rationale: נחה signifie normalement conduire ou guider. La traduction garde volontairement le mouvement sans ajouter une destination ni imposer une nuance favorable ou défavorable.
theological_decisions:
- issue: Sens du mouvement des nations dans le second membre
  choice: « les conduit », sans préciser la destination ni la valeur du mouvement
  alternative: « les emmène » ou « les conduit au loin »
  rationale: Le contexte souligne l’autorité de Dieu sur l’essor et la disparition des nations, mais le verbe נחה signifie en lui-même « conduire » ou « guider ». La formulation retenue préserve la tension entre une direction providentielle et un possible déplacement lié au renversement des nations.
translation_notes:
  register: Français moderne, sobre et poétique. Les deux membres parallèles sont conservés, avec des verbes simples et dignes. La répétition de « les nations » reflète la structure hébraïque, tandis que « les conduit » évite de résoudre l’ambiguïté du dernier verbe.
