id: JOB.12.10
reference: Job 12:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲשֶׁ֣ר בְּ֭/יָד/וֹ נֶ֣פֶשׁ כָּל חָ֑י וְ֝/ר֗וּחַ כָּל בְּשַׂר אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/010.yaml
  text: In whose hand is the life of every living thing[a], and the breath of all mankind.
translation:
  language: fr
  text: Lui qui tient dans sa main la vie de tout être vivant[a] et le souffle de tout être humain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’âme de tout être vivant et l’esprit de toute chair humaine ».'
    reason: Alternative lexicale plus littérale pour נֶפֶשׁ, רוּחַ et כָּל בְּשַׂר אִישׁ, qui préserve les sens possibles « âme », « esprit » et « chair ».
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: Lui qui tient dans sa main
  rationale: La tournure relative hébraïque signifie littéralement « dans la main de qui ». Cette formulation française naturelle conserve l’image de la main comme expression de la maîtrise et du pouvoir, sans ajouter explicitement le verbe « appartenir ».
- source_word: נֶפֶשׁ
  choice: la vie
  rationale: Dans ce parallélisme, le mot désigne la vie qui anime les créatures. « Vie » évite de réduire le sens à une conception particulière de l’âme.
- source_word: כָּל חָי
  choice: de tout être vivant
  rationale: Cette formulation conserve la portée universelle de l’expression et se lit naturellement en français.
- source_word: וְרוּחַ
  choice: et le souffle
  rationale: En parallèle avec נֶפֶשׁ et à propos des humains mortels, רוּחַ peut désigner le souffle vital. « Souffle » garde ce sens concret tout en laissant percevoir la profondeur anthropologique du terme.
- source_word: כָּל בְּשַׂר אִישׁ
  choice: de tout être humain
  rationale: L’expression littérale associe « chair » et « homme » pour désigner collectivement les humains dans leur condition corporelle et mortelle. « Tout être humain » rend clairement la portée générique en français moderne.
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ et רוּחַ
  choice: « vie » et « souffle »
  alternative: « âme » et « esprit »
  rationale: Le contexte met en avant la dépendance de toute créature envers Dieu pour sa vie. Les termes concrets évitent d’imposer au parallélisme hébreu un dualisme anthropologique plus précis qu’il ne l’exprime.
- issue: Image de la main divine
  choice: Conserver « dans sa main »
  alternative: Expliciter par « sous son pouvoir »
  rationale: L’image poétique hébraïque exprime la souveraineté de Dieu. La conserver maintient la force du texte sans en réduire la portée à une seule paraphrase.
- issue: Référence humaine générique
  choice: « tout être humain »
  alternative: « toute chair humaine »
  rationale: Le choix principal transmet clairement l’universalité humaine en français courant. La note préserve la formulation plus littérale ainsi que les autres possibilités lexicales.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le parallélisme poétique et l’image de la main, tandis que « tout être humain » évite une formulation genrée ou archaïque.
