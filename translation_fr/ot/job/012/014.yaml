  source_fidelity: 'Le premier membre rend fidèlement הֵן, יַהֲרוֹס et le passif négatif וְלֹא יִבָּנֶה. Dans le second, « nul ne peut lui ouvrir » modifie la construction : « lui » renvoie naturellement à « un homme » et introduit l''idée d''ouvrir à quelqu''un. L''hébreu maintient au contraire un complément implicite pour « être ouvert », en parallèle avec la fermeture.'
  naturalness: « Voici » est une ouverture plus naturelle pour la particule emphatique הֵן dans ce registre que « Oui », qui peut sonner comme une réponse affirmative. « Personne ne peut ouvrir » est concis, idiomatique dans le style poétique, et conserve l'objet sous-entendu.
  terminology: « Démolit / rebâti » conserve l'imagerie de destruction et de construction. « Enferme un homme » rend sobrement סגר על איש sans imposer l'idée d'une prison officielle ni celle d'une délivrance. Le pronom « il » préserve la référence divine contextuelle sans ajouter de titre.
