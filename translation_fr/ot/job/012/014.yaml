  - severity: low
    issue: « Oui » affaiblit légèrement la fonction présentative ou emphatique de הֵן.
    rationale: Dans cette assertion solennelle, « Voici » rend plus directement la particule d'appel à l'attention, tout en restant compréhensible en français moderne.
