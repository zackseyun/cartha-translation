  text: הֵ֣ן יַ֭הֲרוֹס וְ/לֹ֣א יִבָּנֶ֑ה יִסְגֹּ֥ר עַל אִ֝֗ישׁ וְ/לֹ֣א יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/014.yaml
  text: Look[a], if he tears down, it cannot be rebuilt; if he shuts a man in[b], it cannot be opened.
translation:
  language: fr
  text: Voici[a], s’il démolit, rien ne peut être rebâti ; s’il enferme un homme[b], personne ne peut ouvrir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Oui » ou « En effet » pour la particule d’ouverture.
    reason: lexical_alternative
  - marker: b
    text: Ou « s’il tient un homme enfermé » ou « s’il confine un homme ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: La particule introduit ici une affirmation emphatique. « Oui » est naturel en français moderne et conserve cette force, tandis que « Voici » attirerait davantage l’attention sur une scène visible.
- source_word: יַהֲרוֹס
  choice: démolit
  rationale: Le verbe הרס désigne l’action d’abattre ou de démolir. « Démolit » maintient l’image de la construction reprise par « rebâti ».
- source_word: וְלֹא יִבָּנֶה
  choice: rien ne peut être rebâti
  rationale: Le niphal de בנה est passif. Le français explicite naturellement l’objet indéterminé par « rien » et rend l’issue irréversible par « ne peut être rebâti ».
- source_word: יִסְגֹּר עַל אִישׁ
  choice: s’il enferme un homme
  rationale: סגר avec עַל exprime ici l’idée de fermer sur quelqu’un ou de le tenir enfermé. « Enferme un homme » conserve l’image concrète sans préciser indûment une incarcération officielle.
- source_word: וְלֹא יִפָּתֵחַ
  choice: nul ne peut lui ouvrir
  rationale: Le niphal de פתח signifie « être ouvert ». Dans ce contexte, « nul ne peut lui ouvrir » exprime idiomatiquement qu’aucune ouverture ni délivrance n’est possible, tout en gardant le motif de la fermeture.
theological_decisions:
- issue: Référence du sujet divin
  choice: il
  alternative: Dieu / le SEIGNEUR
  rationale: L’hébreu emploie des verbes à la troisième personne du singulier sans nom divin explicite dans ce verset. « Il » respecte le fil du discours et n’ajoute aucun titre absent du texte.
- issue: Force modale des passifs négatifs
  choice: ne peut être rebâti / nul ne peut lui ouvrir
  alternative: ne sera pas rebâti / ne sera pas ouvert
  rationale: Dans ce parallélisme décrivant l’action souveraine et irréversible de Dieu, la formulation modale rend naturellement en français l’impossibilité résultante, sans transformer cette idée en affirmation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme est conservé, avec une syntaxe idiomatique et l’image architecturale « démolit / rebâti ».
