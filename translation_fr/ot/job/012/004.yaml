    issue: « prochain » pour רֵעַ
    rationale: En français moderne, « prochain » évoque volontiers le voisin ou le prochain au sens éthique. Le contexte de Job vise son ami/compagnon; « ami » est à la fois plus naturel et plus proche du lexique hébreu.
  - severity: low
    issue: Imparfaits passés dans la relative
    rationale: « appelais » et « répondait » suggèrent un procès habituel ou en cours dans le passé. Le participe קֹרֵא et la réponse divine peuvent être rendus plus sobrement par le présent français, sans imposer cette nuance aspectuelle.
  - severity: medium
    issue: Note b imprécise et incohérente
    rationale: La note proposée présente « il lui a répondu » comme alternative, alors que c’est précisément la valeur littérale du suffixe objet. Elle doit plutôt expliquer le pronom hébreu et son référent discursif.
