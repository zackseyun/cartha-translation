  yaml_path: translation/ot/job/012/004.yaml
  text: I am a laughingstock to my friend[a], one who called to God and he answered him[b], a laughingstock to the righteous and blameless man.
translation:
  language: fr
  text: Je suis la risée de mon ami[a], moi qui appelle Dieu et à qui il répond[b] — la risée, moi, juste et intègre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de son ami ». Dans le contexte, Job parle de lui-même et de ses compagnons.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « et il lui répond ». Le pronom hébreu est à la troisième personne, mais il renvoie à celui qui appelle, c’est-à-dire Job.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂחֹק
  choice: la risée
  rationale: Le nom désigne une personne exposée aux moqueries; « la risée » est naturel en français et garde la force prédicative de l’hébreu.
- source_word: לְרֵעֵהוּ
  choice: de mon prochain
  rationale: Le suffixe écrit est formellement de troisième personne (« son prochain »), mais le discours à la première personne et les compagnons de Job favorisent ici « mon prochain »; l’ambiguïté est signalée en note.
- source_word: אֶהְיֶה
  choice: je suis
  rationale: Bien que la forme soit un inaccompli, elle décrit ici l’état présent de Job.
- source_word: קֹרֵא לֶאֱלוֹהַּ
  choice: moi qui appelais Dieu
  rationale: Le participe est rendu par une relative; l’imparfait s’accorde naturellement avec la réponse divine évoquée comme expérience passée.
- source_word: וַיַּעֲנֵהוּ
  choice: et à qui il répondait
  rationale: La proposition relative française identifie clairement Job comme destinataire tout en conservant Dieu comme sujet de la réponse; la valeur plus ponctuelle « il lui répondit » demeure possible et figure en note.
- source_word: צַדִּיק
  choice: juste
  rationale: « Juste » rend directement le vocabulaire moral et sapientiel du texte.
- source_word: תָּמִים
  choice: intègre
  rationale: Dans Job, le mot évoque la totalité et la probité morales plutôt qu’une perfection absolue; « intègre » exprime cette nuance sans la surcharger.
theological_decisions:
- issue: La portée de תָּמִים dans l’autodescription de Job
  choice: « intègre », au sens de probité et de cohérence morale
  alternative: « parfait » ou « irréprochable »
  rationale: Le terme affirme l’intégrité de Job sans nécessairement lui attribuer une perfection morale absolue.
- issue: La relation syntaxique de « juste et intègre »
  choice: apposition décrivant Job, reprise par « moi »
  alternative: « la risée du juste, de l’homme intègre », faisant d’un tiers juste la personne qui se moque
  rationale: La séquence poétique reprend vraisemblablement « la risée » et qualifie le locuteur; cette lecture s’accorde avec le contexte et avec l’absence d’une préposition ל devant צדיק. La formulation française conserve l’insistance heurtée de l’hébreu sans faire du juste le moqueur.
translation_notes:
  register: Français moderne, digne et oralement lisible. « La risée » rend la dérision sans registre familier. La reprise « la risée, moi » conserve l’emphase poétique et évite de rattacher artificiellement « juste et intègre » au prochain.
