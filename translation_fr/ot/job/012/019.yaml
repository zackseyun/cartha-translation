source:
  edition: WLC
  text: מוֹלִ֣יךְ כֹּהֲנִ֣ים שׁוֹלָ֑ל וְ/אֵֽתָנִ֣ים יְסַלֵּֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/019.yaml
  text: He leads priests away stripped[b][a], and he overthrows the mighty.
translation:
  language: fr
  text: Il emmène les prêtres dépouillés[a] et renverse les puissants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « emmenés comme butin » ou « privés de leurs biens ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux qui sont solidement établis »; le terme peut aussi évoquer la force ou la stabilité durable.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: emmène
  rationale: Le participe hiphil de הלך exprime ici le fait de faire partir ou d’emmener. « Emmène » évoque naturellement des personnes conduites au loin dans un contexte d’abaissement.
- source_word: כֹּהֲנִים
  choice: les prêtres
  rationale: C’est le sens courant et direct de כֹּהֲנִים; le contexte les présente comme des figures religieuses et sociales éminentes.
- source_word: שׁוֹלָל
  choice: dépouillés
  rationale: Le terme décrit vraisemblablement des hommes privés de leurs biens et de leur dignité, comme des captifs ou des personnes livrées au pillage. « Dépouillés » reste naturel tout en conservant cette image.
- source_word: אֵתָנִים
  choice: les puissants
  rationale: Le mot peut désigner ceux qui sont forts, durables ou solidement établis. Dans cette série de personnages influents abaissés, « les puissants » rend clairement le sens contextuel sans effacer les autres nuances, signalées en note.
- source_word: יְסַלֵּף
  choice: renverse
  rationale: Le piel de סלף signifie fondamentalement tordre ou fausser; appliqué ici à des personnes fortes ou établies, « renverse » exprime naturellement leur déstabilisation et leur chute.
theological_decisions:
- issue: Continuité du sujet divin implicite
  choice: Employer « il » sans ajouter explicitement « Dieu »
  alternative: Répéter « Dieu » comme sujet
  rationale: Le contexte immédiat identifie déjà Dieu comme l’auteur de ces actions. Le pronom conserve la progression poétique de l’hébreu sans introduire une précision absente du verset.
translation_notes:
  register: Français moderne, international et digne. La formulation concise conserve le parallélisme poétique. Les notes maintiennent les ambiguïtés lexicales de שׁוֹלָל et אֵתָנִים sans surcharger le corps du texte.
