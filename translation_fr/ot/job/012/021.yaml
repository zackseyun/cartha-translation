id: JOB.12.21
reference: Job 12:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שׁוֹפֵ֣ךְ בּ֭וּז עַל נְדִיבִ֑ים וּ/מְזִ֖יחַ אֲפִיקִ֣ים רִפָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/021.yaml
  text: He pours contempt on nobles[b][a], and loosens the belt of the strong.
translation:
  language: fr
  text: 'Il déverse le mépris sur les nobles

    et relâche la ceinture des puissants.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image de la ceinture relâchée évoque probablement la perte de force, de préparation ou d’autorité.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹפֵךְ
  choice: déverse
  rationale: Le participe de שׁפך signifie couramment « verser, répandre ». « Déverse » conserve l’image vive et s’emploie naturellement avec « mépris ».
- source_word: בּוּז
  choice: mépris
  rationale: בּוּז désigne le mépris ou le dédain, avec ici une idée d’humiliation publique.
- source_word: נְדִיבִים
  choice: nobles
  rationale: Dans ce contexte de renversement social, le terme désigne des personnes de rang élevé ou des dirigeants. « Nobles » reste large sans préciser indûment un statut royal.
- source_word: מְזִיחַ
  choice: ceinture
  rationale: Le nom désigne vraisemblablement une ceinture ou une bande servant à ceindre les vêtements. Ce choix préserve l’image concrète du texte.
- source_word: אֲפִיקִים
  choice: puissants
  rationale: Dans ce parallélisme avec les nobles, le mot renvoie vraisemblablement aux personnes fortes ou puissantes. « Puissants » rend bien leur position de force sans limiter le sens à la vigueur physique.
- source_word: רִפָּה
  choice: relâche
  rationale: Le verbe רפה signifie rendre lâche, détendre ou relâcher. « Relâche » conserve le geste concret sans expliciter à tort une seule conséquence possible.
theological_decisions:
- issue: Image métaphorique de l’humiliation et de la perte de puissance opérées par Dieu
  choice: 'Conserver l’image : « relâche la ceinture des puissants »'
  alternative: « désarme les puissants » ou « prive les puissants de leur force »
  rationale: L’image peut évoquer la perte de force, de préparation ou d’autorité, mais le texte ne précise pas une seule de ces dimensions. La conserver respecte sa tension poétique et son ampleur.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est conservé sur deux lignes. « Déverse le mépris » maintient la métaphore source; « relâche la ceinture » évite une paraphrase doctrinale ou exclusivement militaire.
