source:
  edition: WLC
  text: יִשְׁלָ֤יוּ אֹֽהָלִ֨ים לְ/שֹׁ֥דְדִ֗ים וּֽ֭/בַטֻּחוֹת לְ/מַרְגִּ֣יזֵי אֵ֑ל לַ/אֲשֶׁ֤ר הֵבִ֖יא אֱל֣וֹהַּ בְּ/יָדֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/006.yaml
  text: The tents of destroyers are at ease[a], and those who provoke God are secure—those whose god brings into their hand.
translation:
  language: fr
  text: 'Les tentes des pillards sont en paix,

    et ceux qui provoquent Dieu vivent en sécurité,

    eux à qui Dieu met [quelque chose] entre les mains.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de la dernière proposition est difficile et l’objet du verbe n’est pas exprimé. Autres analyses possibles : « ceux dont le dieu apporte [quelque chose] dans leur main » ou « ceux que Dieu livre en son pouvoir ». La première peut avoir une portée ironique : le « dieu » des méchants serait leur propre puissance; l’autre comprend « Dieu » comme le vrai Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלָיוּ
  choice: sont tranquilles
  rationale: Le verbe exprime le calme et l’absence de trouble plutôt que la seule prospérité matérielle. Cette formulation conserve l’ironie du contraste moral.
- source_word: אֹהָלִים
  choice: tentes
  rationale: Le terme concret est conservé; dans cette poésie de sagesse, les tentes peuvent aussi représenter les habitations ou les maisonnées.
- source_word: לְשֹׁדְדִים
  choice: des pillards
  rationale: Le participe désigne ceux qui dépouillent avec violence. « Pillards » restitue ce sens sans le réduire au simple vol.
- source_word: וּבַטֻּחוֹת
  choice: vivent en sécurité
  rationale: Le mot, parallèle à « sont tranquilles », exprime une situation sûre. L’ajout verbal naturel en français évite une tournure nominale obscure.
- source_word: לְמַרְגִּיזֵי אֵל
  choice: ceux qui provoquent Dieu
  rationale: Le participe causatif de רגז désigne ici ceux qui irritent ou provoquent Dieu.
- source_word: לַאֲשֶׁר הֵבִיא אֱלוֹהַּ בְּיָדוֹ
  choice: eux qui portent leur dieu dans leur main
  rationale: La construction difficile est comprise comme décrivant ceux qui ont amené ou tiennent leur dieu dans leur main, image possible d’un objet de confiance ou d’une idole. « Portent » donne en français le sens idiomatique du geste sans effacer les autres analyses, signalées en note.
theological_decisions:
- issue: Référent et fonction de אֱלוֹהַּ dans la proposition finale
  choice: « leur dieu », objet porté dans la main
  alternative: '« Dieu » comme sujet: « ceux à qui Dieu met [quelque chose] dans la main »; ou « ceux que Dieu livre en son pouvoir »'
  rationale: La syntaxe hébraïque permet plusieurs analyses. La lecture retenue prolonge le portrait de personnes impies qui placent leur confiance dans un dieu qu’elles peuvent tenir, sans imposer l’idée que le vrai Dieu approuve leur conduite. La note maintient toutefois l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme est conservé sur trois lignes; « pillards », « tranquilles » et « vivent en sécurité » restent immédiatement compréhensibles tout en gardant la dignité du discours de Job.
