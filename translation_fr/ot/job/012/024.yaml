id: JOB.12.24
reference: Job 12:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מֵסִ֗יר לֵ֭ב רָאשֵׁ֣י עַם הָ/אָ֑רֶץ וַ֝/יַּתְעֵ֗/ם בְּ/תֹ֣הוּ לֹא דָֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/024.yaml
  text: He removes understanding from the heads of the people of the land[c][b][a], and makes them wander in a trackless waste.
translation:
  language: fr
  text: Il retire le discernement[b] aux dirigeants du peuple du pays[a] et les fait errer dans un lieu désolé où il n’y a pas de chemin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux dirigeants du peuple de la terre ». Littéralement : « aux têtes du peuple du pays/de la terre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le cœur » ; ici, le mot désigne la faculté de comprendre et de juger.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « dans un lieu désolé, pas de chemin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: retire
  rationale: Le participe hiphil exprime l’action de faire disparaître ou d’enlever. « Retire » est naturel en français et convient à l’énoncé général au présent.
- source_word: לֵב
  choice: discernement
  rationale: Littéralement « cœur », mais le mot désigne ici la faculté de comprendre et de juger. « Discernement » exprime précisément la perte de jugement des dirigeants sans suggérer avant tout les émotions.
- source_word: רָאשֵׁי עַם הָאָרֶץ
  choice: les dirigeants du peuple du pays
  rationale: רָאשֵׁי signifie littéralement « les têtes de » et fonctionne comme un terme désignant les chefs ou dirigeants. עַם הָאָרֶץ peut se comprendre comme « le peuple du pays » ou, dans une portée plus générale, comme « les peuples de la terre » ; le texte principal garde le singulier et la lecture liée au pays, tandis que la note préserve l’autre possibilité.
- source_word: וַיַּתְעֵם
  choice: et les fait errer
  rationale: La forme causative de תעה indique qu’il les amène à errer ou à s’égarer. Cette formulation conserve explicitement cette causalité ainsi que l’image du déplacement sans direction.
- source_word: בְּתֹהוּ
  choice: dans un lieu désolé
  rationale: תֹהוּ évoque ici un espace vide, désolé et sans repères. « Lieu désolé » restitue cette image de façon claire sans lui imposer un sens cosmologique.
- source_word: לֹא דָרֶךְ
  choice: où il n’y a pas de chemin
  rationale: Cette formulation rend directement l’expression hébraïque « pas de chemin » et conserve son caractère concret au lieu de la réduire à un simple adjectif.
theological_decisions:
- issue: Sujet sous-entendu des verbes
  choice: Dieu demeure le sujet implicite, rendu par « il » selon le contexte immédiat.
  alternative: Répéter explicitement « Dieu » dans ce verset.
  rationale: Dans le développement de Job 12, les actions sont attribuées à Dieu, même si son nom n’est pas répété ici. Le pronom respecte la cohésion du passage et évite une explicitation absente de ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image spatiale de l’hébreu et son ambiguïté entre « pays » et « terre » au moyen d’une note, tout en employant « dirigeants » plutôt que le calque moins naturel « têtes ».
