source:
  edition: WLC
  text: בִּֽ/ישִׁישִׁ֥ים חָכְמָ֑ה וְ/אֹ֖רֶךְ יָמִ֣ים תְּבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/012.yaml
  text: With the aged is wisdom[a], and with length of days[b], understanding.
translation:
  language: fr
  text: Chez les personnes âgées se trouve la sagesse[a] ; avec une longue vie, l’intelligence[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Parmi les personnes âgées se trouve la sagesse ». La préposition hébraïque peut exprimer l’association ou le lieu.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « longueur de jours », c’est-à-dire une longue vie ou de nombreux jours.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּישִׁישִׁים
  choice: chez les personnes âgées
  rationale: La préposition ב peut ici marquer l’association ou le lieu figuré. « Chez les personnes âgées » demeure naturel en français, n’impose pas un référent exclusivement masculin et conserve l’idée que la sagesse se trouve auprès ou parmi elles.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Équivalent courant de חָכְמָה dans la littérature sapientiale, en accord avec le parallélisme du verset.
- source_word: וְאֹרֶךְ יָמִים
  choice: avec une longue vie
  rationale: L’expression hébraïque signifie littéralement « longueur de jours ». « Une longue vie » en restitue naturellement le sens en français tout en maintenant le parallèle avec le premier membre.
- source_word: תְּבוּנָה
  choice: l’intelligence
  rationale: תְּבוּנָה désigne la faculté de comprendre et de discerner. « Intelligence » forme un couple naturel avec « sagesse » sans effacer entièrement leur distinction.
theological_decisions:
- issue: Portée de l’affirmation sur l’âge et la sagesse
  choice: Conserver la formulation proverbiale sans la transformer en règle absolue ni en question rhétorique.
  alternative: Expliciter que l’âge produit nécessairement la sagesse, ou lire le verset comme une question.
  rationale: Le texte hébreu présente une proposition nominale concise et laisse au contexte le soin d’en préciser la portée. La traduction ne doit pas résoudre cette tension.
translation_notes:
  register: Français international actuel, sobre et digne. La structure en deux membres conserve le parallélisme poétique. Les verbes « se trouve » et « vient », absents de la proposition nominale hébraïque, sont ajoutés pour obtenir une phrase française naturelle sans présenter l’âge comme la cause mécanique de la sagesse ou de l’intelligence.
