id: JOB.12.25
reference: Job 12:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְמַֽשְׁשׁוּ חֹ֥שֶׁךְ וְ/לֹא א֑וֹר וַ֝/יַּתְעֵ֗/ם כַּ/שִּׁכּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/025.yaml
  text: They grope in darkness[a], without light; he makes them stagger like a drunkard.
translation:
  language: fr
  text: Ils tâtonnent dans les ténèbres, sans lumière ; il les fait tituber comme un homme ivre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il les fait errer ». Le verbe hébreu peut exprimer l’errance ou l’égarement ; la comparaison avec un homme ivre favorise ici « fait tituber ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: יְמַשְׁשׁוּ
  choice: ils tâtonnent
  rationale: Le piel de משׁשׁ décrit le fait de chercher son chemin par le toucher quand on ne voit pas. « Tâtonnent » restitue naturellement cette image en français.
- source_word: חֹשֶׁךְ
  choice: les ténèbres
  rationale: « Les ténèbres » rend le sens concret ou figuré de חֹשֶׁךְ sans préciser outre mesure la nature de l’obscurité.
- source_word: וְלֹא אוֹר
  choice: sans lumière
  rationale: Cette formulation française naturelle conserve le contraste abrupt de l’hébreu, littéralement « et pas de lumière ».
- source_word: וַיַּתְעֵם
  choice: il les fait tituber
  rationale: Le hifil de תעה signifie faire errer ou égarer. La comparaison immédiate avec une personne ivre favorise ici « fait tituber », qui exprime la démarche désorientée tout en laissant l’alternative lexicale en note.
- source_word: ־ם (suffixe de וַיַּתְעֵם)
  choice: les
  rationale: Le suffixe pronominal masculin pluriel renvoie aux personnes évoquées au pluriel dans le contexte.
- source_word: כַּשִּׁכּוֹר
  choice: comme un homme ivre
  rationale: Le terme singulier désigne une personne en état d’ivresse. Cette expression garde le singulier comparatif et convient au registre digne du passage.
theological_decisions:
- issue: Sujet implicite de וַיַּתְעֵם
  choice: il les fait tituber
  alternative: ils titubent
  rationale: La forme verbale est à la troisième personne du masculin singulier et porte un complément pronominal pluriel. Le sujet implicite est donc « il » — Dieu dans le contexte — et non les personnes elles-mêmes. La traduction conserve cette causalité sans ajouter le nom divin.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé, ainsi que le sujet divin implicite du second verbe. Le point-virgule marque les deux propositions sans alourdir le verset.
