  text: עִ֭מּ/וֹ עֹ֣ז וְ/תֽוּשִׁיָּ֑ה ל֝֗/וֹ שֹׁגֵ֥ג וּ/מַשְׁגֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/016.yaml
  text: With him are strength and sound wisdom[a]; the one who goes astray and the one who leads astray belong to him.
translation:
  language: fr
  text: Avec lui se trouvent la force et la sagesse avisée[a] ; celui qui s’égare et celui qui égare lui appartiennent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une interprétation contextuelle : « le trompé et le trompeur ». Le premier participe signifie plus littéralement « celui qui s’égare », tandis que le second désigne « celui qui fait s’égarer ».'
    reason: Alternative lexicale et préservation du contraste entre les formes verbales hébraïques.
lexical_decisions:
- source_word: עִמּוֹ
  choice: Auprès de lui
  rationale: Cette expression conserve l’image hébraïque de réalités qui sont « avec » Dieu, donc en sa possession et à sa disposition, sans l’aplatir en simple affirmation abstraite.
- source_word: עֹז
  choice: la force
  rationale: Le nom désigne couramment la force ou la puissance ; « force » est ici direct, naturel et bien adapté au parallélisme.
- source_word: תּוּשִׁיָּה
  choice: la sagesse efficace
  rationale: Dans les écrits de sagesse, le terme évoque une sagesse solide qui permet d’agir avec discernement. « Sagesse efficace » maintient cette dimension pratique sans réduire le mot au seul succès.
- source_word: לוֹ
  choice: lui appartiennent
  rationale: Le ל avec suffixe exprime ici la possession ou l’appartenance. Cette formulation fait écho à « Auprès de lui » et affirme que les deux personnes relèvent de son domaine.
- source_word: שֹׁגֵג
  choice: celui qui s’égare
  rationale: Le participe qal décrit une personne qui erre ou s’égare. La formulation préserve sa valeur active ou intransitive plutôt que d’imposer le sens passif « trompé ».
- source_word: מַשְׁגֶּה
  choice: celui qui égare
  rationale: Le participe hiphil désigne celui qui fait errer autrui. La répétition du verbe « égarer » rend clairement le contraste morphologique entre celui qui s’égare et celui qui cause l’égarement.
theological_decisions:
- issue: Rapport de Dieu à celui qui s’égare et à celui qui égare
  choice: Les deux lui appartiennent, sans que soit précisée la nature de son action morale à leur égard.
  alternative: Dieu connaît les deux ; Dieu gouverne providentiellement les deux ; Dieu produit directement l’égarement des deux.
  rationale: L’hébreu affirme fortement leur appartenance à Dieu, mais ne dit pas explicitement qu’il est l’auteur moral de leur égarement. La traduction conserve cette tension sans l’expliquer ni l’atténuer.
translation_notes:
  register: Français international moderne, sobre et digne. « Auprès de lui sont » conserve la structure poétique et possessive de l’hébreu ; la paire « celui qui s’égare / celui qui égare » reste claire pour un lectorat général tout en reproduisant le contraste verbal de l’original.
