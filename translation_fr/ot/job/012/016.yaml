revisions:
- from: Auprès de lui sont la force et la sagesse efficace ; celui qui s’égare et celui qui égare lui appartiennent.[a]
  to: Avec lui se trouvent la force et la sagesse avisée[a] ; celui qui s’égare et celui qui égare lui appartiennent.
