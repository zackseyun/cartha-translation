  - severity: low
    issue: « Sagesse efficace » est une collocation un peu lourde.
    rationale: Le sens pratique de תּוּשִׁיָּה est juste, mais « sagesse avisée » est plus naturel en français moderne tout en conservant l’idée de jugement sûr.
