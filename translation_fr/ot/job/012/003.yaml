  text: גַּם לִ֤/י לֵבָ֨ב כְּֽמוֹ/כֶ֗ם לֹא נֹפֵ֣ל אָנֹכִ֣י מִ/כֶּ֑ם וְ/אֶת מִי אֵ֥ין כְּמוֹ אֵֽלֶּה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/003.yaml
  text: I too have a mind like you; I am not inferior to you[a]. And who does not know such things as these?
translation:
  language: fr
  text: Moi aussi, j’ai un esprit comme le vôtre ; je ne vous suis pas inférieur[a]. Et qui ne connaît pas de telles choses ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Moi aussi, j’ai un cœur comme le vôtre. Je ne suis pas au-dessous de vous. » Ici, le « cœur » désigne la faculté de penser et de comprendre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם לִי לֵבָב
  choice: Moi aussi, j’ai de l’intelligence
  rationale: Littéralement, « moi aussi, j’ai un cœur ». Dans l’anthropologie hébraïque, לֵבָב désigne ici la faculté de penser et de comprendre. « Intelligence » exprime naturellement en français la revendication de Job sans réduire le terme à l’organe physique.
- source_word: כְּמוֹכֶם
  choice: comme vous
  rationale: Cette formulation directe conserve la comparaison entre Job et ses interlocuteurs.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: je ne vous suis pas inférieur
  rationale: L’expression formée avec נפל et מן signifie ici ne pas être au-dessous de quelqu’un. La tournure française rend clairement cette comparaison.
- source_word: וְאֶת מִי אֵין כְּמוֹ אֵלֶּה
  choice: Et qui ne sait pas des choses pareilles ?
  rationale: La proposition hébraïque est elliptique et peut se comprendre plus littéralement comme « auprès de qui n’y a-t-il pas de telles choses ? ». Dans le contexte, la question rhétorique présente les idées des amis comme banales et largement connues.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Intelligence » restitue la valeur cognitive de לֵבָב, tandis que la note conserve l’image hébraïque du cœur et l’expression littérale « tomber plus bas ».
