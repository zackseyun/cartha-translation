source:
  edition: WLC
  text: עִ֭מּ/וֹ חָכְמָ֣ה וּ/גְבוּרָ֑ה ל֝֗/וֹ עֵצָ֥ה וּ/תְבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/013.yaml
  text: With him are wisdom and might[a]; to him belong counsel and understanding.
translation:
  language: fr
  text: Avec lui sont la sagesse et la puissance ; à lui appartiennent le conseil et l’intelligence[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « En lui sont la sagesse et la puissance ; siens sont le conseil et l’intelligence. »'
    reason: L’hébreu peut être rendu de manière plus explicitement possessive en français, sans que cette reformulation soit nécessaire dans le texte principal.
lexical_decisions:
- source_word: עִמּוֹ
  choice: Auprès de lui se trouvent
  rationale: עִם avec suffixe signifie d’abord « avec lui » ou « auprès de lui ». Dans cette proposition nominale, l’ajout de « se trouvent » donne une formulation française naturelle sans transformer explicitement la préposition en « en lui ».
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Équivalent courant de חָכְמָה, qui désigne ici la sagesse et la juste compréhension.
- source_word: וּגְבוּרָה
  choice: et la puissance
  rationale: גְבוּרָה peut désigner la force, la puissance ou la vaillance. « Puissance » convient à l’action souveraine de Dieu dans le contexte et maintient le registre poétique.
- source_word: לוֹ
  choice: à lui appartiennent
  rationale: ל avec suffixe exprime ici la possession dans une proposition sans verbe. Cette tournure rend clairement et naturellement cette valeur en français.
- source_word: עֵצָה
  choice: le conseil
  rationale: עֵצָה évoque le conseil, la capacité de concevoir un dessein ou la délibération avisée. « Conseil » préserve l’ampleur du terme et le parallélisme poétique.
- source_word: וּתְבוּנָה
  choice: et l’intelligence
  rationale: תְבוּנָה désigne l’intelligence, la compréhension ou le discernement. « Intelligence » est ici une formulation française digne et accessible.
theological_decisions:
- issue: Référent des suffixes pronominaux
  choice: Conserver « lui », le contexte identifiant Dieu comme référent
  alternative: Remplacer le pronom par « Dieu »
  rationale: L’hébreu emploie des suffixes pronominaux plutôt que le nom divin. Le maintien du pronom respecte la cohésion du discours et évite une explicitation absente du verset.
translation_notes:
  register: Style poétique, sobre et actuel. Le parallélisme des deux membres est conservé, avec une formulation compréhensible en français international.
