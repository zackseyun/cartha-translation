  text: מוֹלִ֣יךְ יוֹעֲצִ֣ים שׁוֹלָ֑ל וְֽ/שֹׁפְטִ֥ים יְהוֹלֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/017.yaml
  text: He leads counselors away stripped[a], and he makes judges foolish.
translation:
  language: fr
  text: Il emmène les conseillers dépouillés[a] et rend les juges insensés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « spoliés » ou « privés de leurs biens » ; le terme peut évoquer leur dépossession et leur humiliation.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: emmène
  rationale: Le participe hiphil de הלך exprime ici un mouvement causé. « Emmène » rend naturellement l’action de conduire au loin, tandis que le contexte de défaite est porté par « dépouillés ».
- source_word: יוֹעֲצִים
  choice: les conseillers
  rationale: Le terme désigne ceux qui donnent des conseils, probablement des personnages influents dans ce contexte de dirigeants humiliés.
- source_word: שׁוֹלָל
  choice: dépouillés
  rationale: Le mot évoque des personnes privées de leurs biens ou de leurs marques de dignité et emmenées dans l’humiliation. « Dépouillés » conserve ce sens général sans imposer le détail possible « pieds nus ».
- source_word: שֹׁפְטִים
  choice: les juges
  rationale: C’est le sens direct du terme issu de שפט; il maintient le parallélisme avec les conseillers parmi les responsables de la société.
- source_word: יְהוֹלֵל
  choice: rend insensés
  rationale: 'Le piel imperfectif de הלל II a un sens causatif: faire devenir ou agir en insensé. « Rend insensés » exprime clairement cette action sans privilégier l’idée plus forte de folie mentale.'
theological_decisions:
- issue: Sujet implicite du verset
  choice: Le sujet divin est rendu par la troisième personne implicite dans les verbes « emmène » et « rend », en continuité avec le contexte.
  alternative: Répéter explicitement « Dieu » ou employer « Il ».
  rationale: Le français permet de maintenir le sujet déjà établi par le contexte immédiat. Ne pas introduire ici le nom « Dieu » évite une explicitation absente de l’hébreu, tout en conservant clairement l’attribution contextuelle.
translation_notes:
  register: Français moderne, sobre et poétique. La coordination simple reproduit le parallélisme hébreu. « Conseillers », « juges » et « insensés » relèvent d’un registre courant mais digne.
