  text: הֵ֤ן יַעְצֹ֣ר בַּ/מַּ֣יִם וְ/יִבָ֑שׁוּ וִֽ֝/ישַׁלְּחֵ֗/ם וְ/יַ֖הַפְכוּ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/015.yaml
  text: Look[a], if he holds back the waters, they dry up; if he sends them out, they overturn the earth.
translation:
  language: fr
  text: 'Voici : s’il retient les eaux, elles tarissent ; s’il les libère, elles bouleversent la terre[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays ». Le mot hébreu אֶרֶץ peut désigner soit la terre, soit un pays ou territoire, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: Cette particule attire l’attention et introduit une affirmation saisissante. « Voici » en conserve la force dans un registre digne et intelligible.
- source_word: יַעְצֹר בַּמַּיִם
  choice: s’il retient les eaux
  rationale: Le verbe עצר exprime ici l’action de retenir ou d’empêcher les eaux de couler. Le pluriel « les eaux » respecte l’idiome hébreu et la portée poétique du verset.
- source_word: וְיִבָשׁוּ
  choice: elles tarissent
  rationale: Le sujet grammatical implicite reprend naturellement « les eaux ». « Tarir » exprime avec concision leur disparition par assèchement, sans préciser un mécanisme absent du texte.
- source_word: וִישַׁלְּחֵם
  choice: s’il les lâche
  rationale: Le suffixe pronominal renvoie naturellement aux eaux. Dans le parallélisme, la proposition peut se comprendre comme la seconde condition opposée à leur rétention ; « lâche » rend l’idée de les laisser se répandre.
- source_word: וְיַהַפְכוּ
  choice: elles bouleversent
  rationale: Le verbe הפך évoque ici un renversement ou un profond bouleversement causé par les eaux. « Bouleversent » garde cette image forte sans réduire le propos à un événement précis.
- source_word: אָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner la terre au sens large ou un territoire. Le contexte poétique consacré à la puissance de Dieu favorise ici « la terre », tout en laissant « le pays » comme possibilité réelle signalée en note.
theological_decisions:
- issue: Portée de אֶרֶץ dans cette affirmation poétique sur la souveraineté divine
  choice: la terre
  alternative: le pays
  rationale: « La terre » correspond à la portée ample du tableau où Dieu maîtrise les eaux. Ce choix n’impose toutefois ni un territoire déterminé ni l’identification à un récit particulier de déluge.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme conditionnel est rendu par deux propositions en « s’il ». « Voici » conserve l’appel à l’attention du texte hébreu sans recourir à une tournure excessivement archaïque.
