id: JOB.12.18
reference: Job 12:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מוּסַ֣ר מְלָכִ֣ים פִּתֵּ֑חַ וַ/יֶּאְסֹ֥ר אֵ֝ז֗וֹר בְּ/מָתְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/018.yaml
  text: He loosens the bonds of kings and binds a belt around their waists[a][b].
translation:
  language: fr
  text: 'Il desserre les liens des rois[a]

    et leur attache une ceinture autour de la taille[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la discipline des rois ». Le nom hébreu peut désigner la discipline, la correction, un lien ou une entrave; « liens » correspond bien au parallèle avec « attache ».
    reason: lexical_alternative
  - marker: b
    text: 'L’image peut évoquer l’humiliation ou la soumission : Dieu dépouille les rois de leur puissance et les attache comme des gens ordinaires ou des captifs. Elle peut aussi être comprise comme l’action de les ceindre pour le service ou l’action.'
    reason: cultural_note
lexical_decisions:
- source_word: מוּסַר
  choice: liens
  rationale: Le nom peut désigner la discipline ou la correction, mais aussi une entrave ou un lien. Avec « desserre » et, en parallèle, « attache », le sens concret « liens » convient bien tout en laissant l’image ouverte.
- source_word: פִּתֵּחַ
  choice: desserre
  rationale: Le verbe signifie ouvrir, délier ou relâcher. « Desserre » conserve ici la métaphore physique sans transformer l’image en explication.
- source_word: מְלָכִים
  choice: rois
  rationale: C’est le sens ordinaire du terme hébreu; « dirigeants » généraliserait inutilement.
- source_word: וַיֶּאְסֹר
  choice: attache
  rationale: Le verbe signifie lier ou attacher. « Attache » s’emploie naturellement avec « ceinture » et maintient le contraste avec « desserre ».
- source_word: אֵזוֹר
  choice: ceinture
  rationale: Le mot désigne une ceinture ou une bande portée autour de la taille. « Ceinture » est clair, moderne et suffisamment neutre pour ne pas trancher la portée de l’image.
- source_word: בְּמָתְנֵיהֶם
  choice: autour de la taille
  rationale: L’expression désigne les reins ou la taille. Cette formulation est naturelle en français moderne et évite l’emploi plus ancien ou équivoque de « reins ».
theological_decisions:
- issue: Portée de l’image de renversement
  choice: Conserver littéralement le contraste entre les liens desserrés et la ceinture attachée, qui présente Dieu comme souverain sur la condition des rois.
  alternative: Comprendre que Dieu libère les rois de leurs entraves puis les équipe pour agir, ou qu’il abolit leur pouvoir contraignant avant de les soumettre eux-mêmes.
  rationale: L’hébreu est bref et métaphorique. Le contraste des verbes suggère un renversement, mais ne précise pas entièrement si la seconde action évoque l’humiliation, la captivité, le service ou la préparation à l’action. Le texte principal ne tranche donc pas.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme concret est préservé sans archaïsme; la mise en deux lignes rend perceptible l’opposition entre les deux actions.
