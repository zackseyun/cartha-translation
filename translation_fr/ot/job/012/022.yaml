  text: מְגַלֶּ֣ה עֲ֭מֻקוֹת מִנִּי חֹ֑שֶׁךְ וַ/יֹּצֵ֖א לָ/א֣וֹר צַלְמָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/022.yaml
  text: He reveals deep things out of darkness[a], and brings the shadow of death to light.
translation:
  language: fr
  text: Il révèle du sein des ténèbres les choses profondes et amène à la lumière l’ombre de la mort[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’obscurité profonde » ou « les ténèbres mortelles » pour « l’ombre de la mort » (hébreu צַלְמָוֶת).
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגַלֶּה
  choice: Il dévoile
  rationale: Le participe de גלה exprime l’action de découvrir ou de rendre manifeste. « Dévoile » conserve l’image de ce qui était caché tout en restant naturel en français.
- source_word: עֲמֻקוֹת
  choice: les profondeurs
  rationale: L’adjectif féminin pluriel substantivé peut désigner des choses ou des lieux profonds et cachés. « Les profondeurs » préserve à la fois la force spatiale et la portée métaphorique.
- source_word: מִנִּי חֹשֶׁךְ
  choice: cachées dans les ténèbres
  rationale: L’hébreu présente les profondeurs comme révélées depuis les ténèbres. Cette formulation française explicite naturellement leur dissimulation sans modifier l’image fondamentale.
- source_word: וַיֹּצֵא
  choice: amène
  rationale: 'Le hiphil de יצא est causatif : il fait sortir ou fait venir. Avec « à la lumière », « amène » rend clairement ce mouvement causé.'
- source_word: לָאוֹר
  choice: à la lumière
  rationale: La préposition marque le mouvement vers la lumière. La locution « amener à la lumière » est idiomatique et conserve cette orientation.
- source_word: צַלְמָוֶת
  choice: l’ombre de la mort
  rationale: Cette traduction traditionnelle reste lexicalement possible et maintient l’intensité poétique ainsi que le lien potentiel avec la mort; l’autre analyse, « ténèbres profondes » ou « ténèbres mortelles », est signalée en note.
theological_decisions:
- issue: Sens de צַלְמָוֶת
  choice: l’ombre de la mort
  alternative: les ténèbres profondes; les ténèbres mortelles
  rationale: L’expression peut être comprise comme une image liée à la mort ou comme un terme désignant une obscurité extrême. Le texte principal conserve la première possibilité, bien établie et poétiquement forte, tandis que la note préserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme entre ténèbres et lumière est conservé, avec une syntaxe accessible.
