  text: מֵסִ֣יר שָׂ֭פָה לְ/נֶאֱמָנִ֑ים וְ/טַ֖עַם זְקֵנִ֣ים יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/020.yaml
  text: He removes speech from the trusted[b][a], and takes away discernment from the elders.
translation:
  language: fr
  text: 'Il prive de parole ceux qui sont dignes de confiance[a]

    et ôte aux anciens leur discernement[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il retire la lèvre aux fidèles » ou « aux personnes fiables ». Il les prive ainsi de parole ou d’éloquence.'
    reason: lexical_alternative
  - marker: b
    text: Ou « leur jugement », « leur bon sens » ou « leur compréhension ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: prive de
  rationale: Le participe hiphil exprime ici l’action de retirer quelque chose à quelqu’un. « Prive de » rend naturellement en français la construction avec שָׂפָה et s’accorde avec le parallèle « enlève ».
- source_word: שָׂפָה
  choice: parole
  rationale: Littéralement « lèvre », le mot désigne ici par métonymie la parole ou la faculté de s’exprimer. « Parole » conserve une formulation sobre et idiomatique.
- source_word: לְנֶאֱמָנִים
  choice: les hommes de confiance
  rationale: Le terme désigne des personnes fidèles, fiables ou reconnues comme dignes de confiance. « Hommes de confiance » rend clairement cette valeur sociale sans réduire le mot à la seule fidélité religieuse.
- source_word: טַעַם
  choice: discernement
  rationale: Au sens figuré, le mot peut désigner le jugement, le bon sens ou la capacité de discerner. « Discernement » convient au contexte sapientiel.
- source_word: זְקֵנִים
  choice: les anciens
  rationale: Le mot peut désigner des hommes âgés ou des anciens jouissant d’expérience et de considération. « Les anciens » préserve ces deux dimensions.
- source_word: יִקָּח
  choice: enlève
  rationale: Le verbe signifie couramment « prendre » ; dans ce parallélisme privatif, « enlève » explicite naturellement le sens contextuel.
theological_decisions: []
