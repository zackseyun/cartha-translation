  text: Does not the ear test words[a], as the palate tastes food?
translation:
  language: fr
  text: L’oreille n’éprouve-t-elle pas les paroles[a], comme le palais goûte les aliments ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’oreille ne discerne-t-elle pas les mots, comme le palais goûte les aliments ? »'
    reason: Alternative lexicale pour מִלִּין (« mots, paroles ») et תִּבְחָן (« discerner, examiner, éprouver »).
lexical_decisions:
- source_word: הֲלֹא
  choice: n’… pas
  rationale: Introduit une question rhétorique qui appelle l’assentiment; cette tournure en conserve naturellement la force en français.
- source_word: אֹזֶן
  choice: l’oreille
  rationale: Conserve l’image concrète de l’hébreu, où l’organe représente aussi la faculté d’écoute et de discernement.
- source_word: מִלִּין
  choice: les paroles
  rationale: Rend le pluriel araméisant de « parole, mot »; « paroles » convient ici au discours entendu et évalué.
- source_word: תִּבְחָן
  choice: éprouve
  rationale: Le verbe exprime l’action d’examiner ou de mettre à l’épreuve. « Éprouver » maintient le parallèle entre l’évaluation des paroles et la dégustation des aliments.
- source_word: חֵךְ
  choice: le palais
  rationale: Désigne précisément le palais, plutôt que la bouche en général, et préserve le parallélisme sensoriel avec l’oreille.
- source_word: אֹכֶל
  choice: les aliments
  rationale: Rendu concret et idiomatique du nom désignant ce qui se mange, la nourriture.
- source_word: יִטְעַם
  choice: goûte
  rationale: Rend directement le verbe « goûter » dans cette comparaison de portée générale.
- source_word: לוֹ
  choice: non exprimé séparément
  rationale: Le pronom datif renvoie idiomatiquement au sujet, avec une nuance comparable à « pour lui-même ». Une traduction explicite alourdirait la phrase française; la nuance est signalée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et proverbial. La structure interrogative et le parallélisme concret de l’hébreu sont conservés; « éprouver les paroles » reste intelligible tout en portant l’idée de discernement.
