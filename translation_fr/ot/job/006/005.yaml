  text: הֲ/יִֽנְהַק פֶּ֥רֶא עֲלֵי דֶ֑שֶׁא אִ֥ם יִגְעֶה שּׁ֝֗וֹר עַל בְּלִילֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/005.yaml
  text: Does a wild donkey bray over grass[b][a], or does an ox low over its fodder?
translation:
  language: fr
  text: L’âne sauvage brait-il quand il a de l’herbe, ou le bœuf mugit-il quand il a du fourrage[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne une nourriture animale mélangée, notamment un mélange de grains ou de fourrage.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִֽנְהַק
  choice: brait-il
  rationale: Le verbe נהק désigne le cri de l’âne; « braire » est l’équivalent français précis et naturel.
- source_word: פֶּרֶא
  choice: l’âne sauvage
  rationale: Le nom désigne l’âne sauvage, ou onagre. « Âne sauvage » est immédiatement compréhensible en français moderne.
- source_word: עֲלֵי דֶשֶׁא
  choice: quand il a de l’herbe
  rationale: L’expression signifie littéralement « sur/devant de l’herbe », mais évoque ici la présence d’une pâture disponible. Cette formulation naturelle explicite la circonstance sans modifier la portée de la question rhétorique.
- source_word: אִם
  choice: ou
  rationale: Dans cette paire de questions rhétoriques, אִם introduit le second terme de l’alternative.
- source_word: יִגְעֶה
  choice: mugit-il
  rationale: Le verbe געה désigne le cri des bovins; « mugir » en est l’équivalent français courant et digne.
- source_word: שּׁוֹר
  choice: le bœuf
  rationale: שׁוֹר désigne ici un bovin au singulier; « bœuf » conserve le parallélisme avec l’âne sauvage.
- source_word: עַל בְּלִילֽ/וֹ
  choice: devant son fourrage
  rationale: בְּלִיל désigne une nourriture animale mélangée, notamment un mélange de grains ou une pâtée. « Fourrage » reste fluide dans le verset, tandis que la note en précise le sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux questions rhétoriques est conservé; la première expression prépositionnelle est rendue selon son sens contextuel, tandis que « devant » maintient l’image dans le second membre.
