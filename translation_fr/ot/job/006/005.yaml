    issue: Incohérence de rendu de la préposition עַל dans les deux membres parallèles
    rationale: Le premier membre paraphrase contextuellement la disponibilité de l’herbe (« quand il a »), tandis que « devant son fourrage » suggère une position physique. Employer la même construction circonstancielle dans les deux membres préserve mieux le parallélisme hébreu et évite une nuance spatiale superflue.
