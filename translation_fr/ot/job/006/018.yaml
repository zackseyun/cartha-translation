  text: יִ֭לָּ֣פְתוּ אָרְח֣וֹת דַּרְכָּ֑/ם יַעֲל֖וּ בַ/תֹּ֣הוּ וְ/יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/018.yaml
  text: The paths of their course wind away[a]; they go up into wasteland and perish.
translation:
  language: fr
  text: Les sentiers de leur parcours se détournent[a] ; ils montent dans une étendue désolée et disparaissent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les pistes des caravanes se détournent ; elles montent dans une étendue désolée et disparaissent. » L’image hébraïque est difficile ; certains comprennent que le verset parle des caravanes plutôt que des sentiers ou des chenaux eux-mêmes.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִלָּפְתוּ
  choice: serpentent au loin
  rationale: Le nifal exprime ici un mouvement sinueux ou un détournement. « Serpentent au loin » conserve l’image concrète de cours d’eau qui dévient, sans imposer l’interprétation des caravanes.
- source_word: אָרְחוֹת
  choice: les sentiers
  rationale: Le terme désigne normalement des sentiers ou des pistes. Le sens métonymique « caravanes » demeure possible et est signalé en note.
- source_word: דַּרְכָּם
  choice: de leur parcours
  rationale: « Parcours » rend דֶּרֶךְ dans le cadre de l’image des chenaux ou cours d’eau et évite la répétition maladroite de « sentiers de leur chemin ».
- source_word: יַעֲלוּ
  choice: ils montent
  rationale: La traduction garde le sens concret habituel du qal de עלה, « monter », malgré l’obscurité de l’image.
- source_word: בַתֹּהוּ
  choice: vers le désert
  rationale: תֹהוּ évoque ici un espace désert, vide et désolé. « Vers le désert » est naturel en français et convient au contexte, tout en conservant l’idée de mouvement.
- source_word: וְיֹאבֵדוּ
  choice: et disparaissent
  rationale: Le qal de אבד peut signifier périr, se perdre ou disparaître. Pour des eaux qui se dissipent dans une région désertique, « disparaissent » restitue clairement l’image sans suggérer artificiellement la mort de sentiers.
