  text: הַ/אִ֬ם אֵ֣ין עֶזְרָתִ֣/י בִ֑/י וְ֝/תֻשִׁיָּ֗ה נִדְּחָ֥ה מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/013.yaml
  text: Is my help not within me[a], and has sound wisdom been driven from me?
translation:
  language: fr
  text: N’ai-je aucun secours en moi-même, et la sagesse pratique n’a-t-elle pas été chassée loin de moi[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la capacité d’agir » ; le terme hébreu peut désigner la sagesse efficace, la compétence ou les ressources permettant d’agir.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאִם אֵין
  choice: N’ai-je donc aucun… ?
  rationale: Cette tournure rend la question rhétorique négative en français naturel. « Donc » marque le lien argumentatif sans transformer la question en affirmation.
- source_word: עֶזְרָתִי בִי
  choice: aucun secours en moi
  rationale: עֶזְרָה désigne l’aide ou le secours, et בִי situe ce secours en Job lui-même. La formulation conserve l’idée de ressources intérieures sans la développer excessivement.
- source_word: וְתֻשִּׁיָּה
  choice: la sagesse pratique
  rationale: תּוּשִׁיָּה peut évoquer une sagesse solide et efficace, la compétence ou les moyens permettant d’agir. « Sagesse pratique » maintient à la fois la dimension sapientielle et l’idée d’efficacité.
- source_word: נִדְּחָה מִמֶּנִּי
  choice: a été chassée loin de moi
  rationale: Le niphal de נדח exprime l’action d’être repoussé ou chassé. Cette traduction préserve le passif et le mouvement d’éloignement indiqué par מִמֶּנִּי.
