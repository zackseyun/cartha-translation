  variant: modern international French
source:
  edition: WLC
  text: וּ֥/תְהִי ע֨וֹד נֶ֘חָ֤מָתִ֗/י וַ/אֲסַלְּדָ֣ה בְ֭/חִילָה לֹ֣א יַחְמ֑וֹל כִּי לֹ֥א כִ֝חַ֗דְתִּי אִמְרֵ֥י קָדֽוֹשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/010.yaml
  text: This would still be my comfort[a], and I would exult in unrelenting pain; for I have not denied the words of the Holy One.
translation:
  language: fr
  text: Ce serait encore ma consolation, et j’exulterais dans une douleur sans répit[a] ; car je n’ai pas renié les paroles du Saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « et je tressaillirais dans la douleur, alors même qu’il ne m’épargnerait pas ». L’hébreu de cette proposition est difficile et très condensé.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶחָמָתִי
  choice: ma consolation
  rationale: Le nom désigne le réconfort ou la consolation. « Ma consolation » convient au registre digne du passage et exprime ce qui resterait à Job comme motif de réconfort.
- source_word: וַאֲסַלְּדָה
  choice: et j’exulterais
  rationale: Le verbe סלד est rare et son sens précis demeure incertain. « J’exulterais » rend la réaction intense et presque paradoxale de Job sans imposer l’image plus conjecturale d’un bond de joie.
- source_word: בְחִילָה
  choice: au milieu d’une douleur
  rationale: חִילָה évoque une douleur aiguë, l’angoisse ou les contorsions causées par la souffrance. Cette formulation française reste naturelle tout en conservant l’intensité du contexte.
- source_word: לֹא יַחְמֹל
  choice: sans répit
  rationale: חמל signifie « épargner » ou « avoir pitié ». Dans cette proposition très comprimée, « sans répit » intègre naturellement l’idée d’une douleur qui n’est pas épargnée ou atténuée ; la formulation plus explicite est signalée en note.
- source_word: כִחַדְתִּי
  choice: je n’ai pas renié
  rationale: Au piel, כחד peut signifier nier, dissimuler ou supprimer. Avec « les paroles du Saint », « renié » exprime naturellement le fait de ne pas les avoir rejetées, sans effacer entièrement la possibilité lexicale de dissimulation.
- source_word: אִמְרֵי
  choice: les paroles du
  rationale: Le pluriel construit d’אמרה désigne des paroles ou des déclarations. « Les paroles du » est idiomatique et suffisamment large.
- source_word: קָדוֹשׁ
  choice: le Saint
  rationale: L’adjectif substantivé désigne ici Dieu. « Le Saint » le rend comme titre divin sans ajouter de précision doctrinale étrangère au texte.
theological_decisions:
- issue: Le titre divin קָדוֹשׁ
  choice: le Saint
  alternative: le saint
  rationale: Le contexte indique que Job parle de Dieu et non d’un homme saint. La majuscule fait apparaître la valeur de titre divin sans développer davantage son contenu.
- issue: La proposition difficile בְחִילָה לֹא יַחְמֹל
  choice: au milieu d’une douleur sans répit
  alternative: dans la douleur, sans qu’il épargne
  rationale: L’hébreu est comprimé, et le sujet implicite de « il n’épargne pas » n’est pas exprimé. Le texte principal communique une souffrance non atténuée dans un français naturel, tandis que la note conserve la construction plus formelle et son ambiguïté.
- issue: Le sens de כחד devant « les paroles du Saint »
  choice: je n’ai pas renié
  alternative: je n’ai pas dissimulé
  rationale: « Renié » convient au rapport entre Job et les paroles divines, mais le verbe peut aussi évoquer le fait de cacher ou de dissimuler. Le choix ne suppose pas une doctrine particulière de la révélation.
translation_notes:
  register: Français international moderne, naturel et digne. Le contraste paradoxal entre consolation, exultation et douleur est conservé. Le point-virgule met en relief la raison donnée par Job, et la note rend transparente l’incertitude syntaxique du milieu du verset.
