  text: בְּ֭/עֵת יְזֹרְב֣וּ נִצְמָ֑תוּ בְּ֝/חֻמּ֗/וֹ נִדְעֲכ֥וּ מִ/מְּקוֹמָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/017.yaml
  text: When they are warmed[a], they vanish; when it is hot[c][b], they dry up from their place.
translation:
  language: fr
  text: Quand ils se réchauffent, ils disparaissent[a] ; sous l’effet de la chaleur[b], ils se dessèchent et disparaissent de leur lieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire les deux verbes décrivant leur disparition par « ils s’éteignent ». L’image hébraïque associe la disparition au fait de s’éteindre.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans sa chaleur » ; on pourrait aussi comprendre : « dans la chaleur ».'
    reason: lexical_alternative
  - marker: c
    text: Dans ce contexte, « leur lieu » peut désigner plus précisément le lit ou le chenal du cours d’eau.
    reason: cultural_note
lexical_decisions:
- source_word: בְּעֵת
  choice: Quand
  rationale: La préposition temporelle suivie du nom introduit ici une proposition circonstancielle ; « Quand » rend ce rapport avec naturel en français moderne.
- source_word: יְזֹרְבוּ
  choice: ils se réchauffent
  rationale: Ce verbe rare exprime le fait de devenir chaud. La forme pronominale française convient aux cours d’eau évoqués dans le contexte sans préciser abusivement la cause du réchauffement.
- source_word: נִצְמָתוּ
  choice: ils disparaissent
  rationale: Le nifal peut évoquer ce qui prend fin, est supprimé ou disparaît. Dans l’image des cours d’eau saisonniers, « disparaissent » restitue clairement l’effet observé.
- source_word: בְּחֻמּוֹ
  choice: sous l’effet de la chaleur
  rationale: Littéralement, l’expression signifie « dans sa chaleur ». La traduction retenue rend naturellement la circonstance thermique tout en signalant en note la formulation et la référence plus ambiguës de l’hébreu.
- source_word: נִדְעֲכוּ
  choice: ils se dessèchent
  rationale: Le verbe peut signifier s’éteindre ou être étouffé. Appliqué ici à des cours d’eau soumis à la chaleur, « se dessèchent » exprime concrètement l’image sans introduire celle du feu.
- source_word: מִמְּקוֹמָם
  choice: quittent leur emplacement
  rationale: L’expression signifie littéralement « de leur lieu ». Cette formulation française conserve l’idée de disparition hors de l’endroit occupé, sans identifier explicitement ce lieu au lit du cours d’eau.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, ainsi que l’image des cours d’eau temporaires qui disparaissent sous l’effet de la chaleur. Les notes maintiennent les ambiguïtés lexicales et référentielles de l’hébreu.
