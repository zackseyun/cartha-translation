  rationale: La révision remplace l’expression artificielle et sémantiquement inexacte « quittent leur emplacement » par une formulation qui maintient le complément « de leur lieu » et l’associe à la disparition des cours d’eau. Elle ne tranche pas dans le texte principal la question contextuelle du lit de torrent, laissée à la note.
