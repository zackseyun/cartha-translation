source:
  edition: WLC
  text: הֲֽ/כִי אָ֭מַרְתִּי הָ֣בוּ לִ֑/י וּ֝/מִ/כֹּחֲ/כֶ֗ם שִׁחֲד֥וּ בַעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/022.yaml
  text: Have I ever said[a], ‘Give to me,’ or, ‘From your strength[b], pay a bribe on my behalf’?”
translation:
  language: fr
  text: 'Vous ai-je jamais dit : « Donnez-moi » ou « Payez, sur vos ressources[a], un pot-de-vin[b] en ma faveur » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sur votre force ». Dans ce contexte, le mot hébreu désigne probablement les moyens ou les biens dont quelqu’un dispose.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu est apparenté au nom qui peut désigner un présent ou un pot-de-vin. Il peut s’agir ici, plus largement, d’un paiement destiné à obtenir une intervention en faveur de Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי אָמַרְתִּי
  choice: Vous ai-je jamais dit
  rationale: La particule interrogative introduit une question rhétorique par laquelle Job nie avoir formulé une telle demande. « Jamais » en exprime naturellement la portée dans ce contexte.
- source_word: הָבוּ לִי
  choice: Donnez-moi
  rationale: L’impératif pluriel suivi du pronom complément est rendu directement, sans préciser ce qui devait être donné puisque l’hébreu ne le fait pas.
- source_word: וּמִכֹּחֲכֶם
  choice: Prenez sur vos ressources
  rationale: כֹּחַ signifie littéralement « force », mais désigne ici vraisemblablement les moyens matériels dont disposent les amis de Job. La tournure française explicite naturellement l’idée de puiser dans ces moyens.
- source_word: שִׁחֲדוּ
  choice: payer un pot-de-vin
  rationale: Le verbe appartient à la famille lexicale du « présent » ou « pot-de-vin » et évoque ici un paiement destiné à obtenir une intervention favorable. La traduction conserve cette nuance transactionnelle sans la réduire à un simple don.
- source_word: בַעֲדִי
  choice: en ma faveur
  rationale: La préposition exprime ici une action accomplie pour Job, afin de soutenir ou de faire avancer sa cause.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est conservée, de même que la répétition de demandes citées. « Pot-de-vin » maintient la force lexicale du verbe, tandis que la note signale la possibilité d’un sens plus large.
