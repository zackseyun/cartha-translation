source:
  edition: WLC
  text: וְ֭/עַתָּה הוֹאִ֣ילוּ פְנוּ בִ֑/י וְ/עַל פְּ֝נֵי/כֶ֗ם אִם אֲכַזֵּֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/028.yaml
  text: But now[a], please turn to me, and before your faces[c][b], would I lie?
translation:
  language: fr
  text: 'Mais maintenant, je vous prie, tournez-vous vers moi[a] : est-ce que je mentirais en face de vous[b][c] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « regardez-moi ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « devant vos faces », c’est-à-dire « en votre présence » ou « en face de vous ».
    reason: lexical_alternative
  - marker: c
    text: Ou « est-ce que je vous tromperais ? » Le verbe hébreu peut signifier « mentir » ou « parler faussement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Dans le contexte, la conjonction introduit un appel immédiat qui contraste avec ce qui précède, tandis que עַתָּה garde son sens temporel.
- source_word: הוֹאִילוּ
  choice: je vous prie
  rationale: Cet impératif exprimant la volonté fonctionne ici comme une demande pressante et polie; cette tournure est naturelle en français.
- source_word: פְנוּ בִי
  choice: tournez-vous vers moi
  rationale: פנה avec ב invite les interlocuteurs à se tourner vers Job ou à porter directement leur attention sur lui. La formulation conserve l'image verbale sans exclure le sens « regardez-moi ».
- source_word: וְעַל פְּנֵיכֶם
  choice: en face de vous
  rationale: Cette expression rend de manière idiomatique l'image concrète des « faces » et souligne que Job parle ouvertement en leur présence.
- source_word: אִם אֲכַזֵּב
  choice: est-ce que je mentirais
  rationale: אִם introduit ici une question rhétorique plutôt qu'une condition ordinaire. Le verbe peut désigner le fait de mentir ou de parler faussement.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La demande polie est exprimée par « je vous prie »; la question finale conserve sa force rhétorique et l’image de la confrontation directe.
