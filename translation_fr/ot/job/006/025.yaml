lexical_decisions:
- source_word: מַה נִּמְרְצוּ
  choice: Comme elles sont puissantes
  rationale: La tournure exclamative exprime le degré. « Puissantes » conserve l’idée de force, tout en laissant ouvertes les nuances de paroles convaincantes ou douloureuses.
- source_word: אִמְרֵי יֹשֶׁר
  choice: les paroles justes
  rationale: « Paroles » rend naturellement le pluriel construit, et « justes » exprime ici la rectitude et la franchise de יֹשֶׁר.
- source_word: וּמַה יּוֹכִיחַ
  choice: Mais que prouve
  rationale: Le waw prend en contexte une valeur contrastive. יכח peut désigner le fait de prouver, de convaincre ou de reprendre ; « prouve » convient à la question rhétorique sans effacer l’ambiguïté, signalée en note.
- source_word: הוֹכֵחַ מִכֶּם
  choice: votre réprimande
  rationale: La formulation française naturelle rend l’acte de reprendre et sa provenance chez les interlocuteurs. « Réprimande » garde une dignité de registre sans être archaïque.
