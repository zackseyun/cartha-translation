  text: Comme les paroles justes sont puissantes ! Mais que prouve votre réprimande ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme les paroles franches sont douloureuses ! Mais que démontre votre argumentation ? » Le premier verbe hébreu peut évoquer la force, le pouvoir de persuasion ou la douleur ; le second membre peut parler d’une argumentation, d’une correction ou d’une réprimande.'
