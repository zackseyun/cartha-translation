  text: מַה כֹּחִ֥/י כִֽי אֲיַחֵ֑ל וּ/מַה קִּ֝צִּ֗/י כִּֽי אַאֲרִ֥יךְ נַפְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/011.yaml
  text: What strength do I have[a], that I should keep hoping? And what is my end, that I should prolong my life?
translation:
  language: fr
  text: Quelle force ai-je pour continuer à espérer ? Et quelle est ma fin pour que je prolonge ma vie[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « que j’allonge mon âme ». L’expression peut aussi signifier : « que je continue à endurer » ou « que je prenne patience ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה כֹּחִי
  choice: Quelle force ai-je
  rationale: La question rhétorique porte sur la force ou la capacité qui resterait à Job. Cette formulation française est naturelle et conserve la concision de l’hébreu sans ajouter explicitement l’idée de « rester ».
- source_word: כִּי אֲיַחֵל
  choice: pour continuer à espérer
  rationale: Le verbe יחל peut exprimer l’attente ou l’espérance. Dans cette plainte, « continuer à espérer » rend naturellement l’idée d’une attente maintenue.
- source_word: וּמַה קִצִּי
  choice: Et quelle est ma fin
  rationale: קֵץ désigne la fin ou la limite. « Ma fin » préserve le parallélisme, la brièveté et la portée existentielle de la question.
- source_word: כִּי אַאֲרִיךְ נַפְשִׁי
  choice: pour que je prolonge ma vie
  rationale: L’expression signifie littéralement « allonger mon âme ». Ici, elle évoque le fait de continuer à vivre ou à tenir plus longtemps; « prolonger ma vie » en donne le sens idiomatique tout en restant proche de l’image temporelle.
theological_decisions:
- issue: Portée de l’expression אַאֲרִיךְ נַפְשִׁי
  choice: prolonger ma vie
  alternative: prendre patience / continuer à endurer
  rationale: Le contexte permet d’entendre soit la prolongation de la vie, soit la persévérance. Le texte principal retient le sens concret le plus naturel, tandis que la note conserve l’autre possibilité sans trancher une tension réelle.
translation_notes:
  register: Français international moderne, sobre et digne. Les deux questions rhétoriques et leur parallélisme sont conservés; le vocabulaire reste accessible sans atténuer le désespoir de Job.
