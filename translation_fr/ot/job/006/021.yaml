  yaml_path: translation/ot/job/006/021.yaml
  text: For now you have become nothing[a]; you see terror[b], and you are afraid.
translation:
  language: fr
  text: Car maintenant, vous n’êtes plus rien[a] ; vous voyez l’épouvante[b], et vous prenez peur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte consonantique hébreu porte littéralement quelque chose comme « vous êtes devenus non/pas », une formulation difficile. La tradition de lecture donne souvent « pour lui » (לו), et certains comprennent alors : « vous êtes devenus comme cela », c’est-à-dire comme les torrents peu fiables des versets précédents. Beaucoup rendent le sens contextuel par « vous n’êtes plus rien » ou « vous ne comptez plus pour rien ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « vous voyez le malheur et vous prenez peur ». Le nom hébreu peut désigner l’épouvante, le désarroi, un effondrement ou une catastrophe accablante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou la conclusion que Job tire de la comparaison avec les torrents saisonniers des versets précédents.
- source_word: עַתָּה
  choice: maintenant
  rationale: Marque la situation présente, en contraste avec ce que Job attendait de ses amis.
- source_word: הֱיִיתֶם
  choice: vous êtes devenus
  rationale: 'Le verbe היה exprime ici vraisemblablement un changement d’état : les amis se sont révélés aussi peu fiables que les torrents évoqués auparavant.'
- source_word: לא
  choice: néant
  rationale: 'Le texte consonantique porte « pas/non », formulation difficile après « vous êtes devenus ». « Néant » conserve autant que possible cette anomalie tout en donnant un sens intelligible dans le contexte : les amis ne sont plus d’aucun secours.'
- source_word: תִּרְאוּ
  choice: vous voyez
  rationale: Rend directement le sens courant de ראה, appliqué ici à la détresse saisissante de Job.
- source_word: חֲתַת
  choice: l’épouvante
  rationale: Le nom peut évoquer la terreur, l’effondrement ou une catastrophe accablante. « Épouvante » préserve la force émotionnelle et le lien avec la peur qui suit.
- source_word: וַתִּירָאוּ
  choice: et vous prenez peur
  rationale: Exprime naturellement en français la réaction immédiate des amis devant ce qu’ils voient, sans imposer une nuance temporelle trop précise.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Devenus néant » garde volontairement l’étrangeté du texte hébreu, expliquée en note. « Prenez peur » est idiomatique et restitue la réaction des amis sans atténuer l’accusation de Job.
