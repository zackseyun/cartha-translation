  source_fidelity: 'Le sens général est bien rendu : Job reproche à ses amis d’être devenus inutiles, puis de voir une réalité effrayante ou calamiteuse et de prendre peur. Toutefois, « vous êtes devenus néant » est une formulation française peu naturelle et le traitement de לא doit signaler plus précisément la difficulté textuelle : le ketiv porte « non/pas », tandis que la lecture traditionnelle לו peut conduire à « pour lui / comme cela » selon l’analyse contextuelle.'
