  text: שֻֽׁבוּ נָ֭א אַל תְּהִ֣י עַוְלָ֑ה ו/שבי ע֝וֹד צִדְקִ/י בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/029.yaml
  text: Turn back[a], please; let there be no injustice. Turn back again; my righteousness is still in it.
translation:
  language: fr
  text: 'Revenez, je vous prie ; qu’il n’y ait pas d’injustice. Revenez encore : mon bon droit demeure dans cette affaire[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ma justice est encore en elle ». L’antécédent du pronom n’est pas exprimé ; « dans cette affaire » l’entend comme le différend en discussion.'
    reason: source_ambiguity
lexical_decisions:
- source_word: שֻׁבוּ
  choice: Revenez sur votre jugement
  rationale: L’impératif pluriel de שוב appelle ici les amis de Job à revenir sur leur appréciation. Cette formulation française rend naturellement l’idée de renversement, tandis que la note conserve la forme plus littérale.
- source_word: נָא
  choice: je vous prie
  rationale: La particule adoucit l’impératif et exprime une demande pressante ; « je vous prie » convient au registre digne du passage sans lui donner un sens temporel.
- source_word: אַל תְּהִי עַוְלָה
  choice: qu’il n’y ait pas d’injustice
  rationale: La tournure impersonnelle conserve l’abstraction de l’hébreu et évite d’ajouter un sujet explicite tel que « vous » ou « votre jugement ».
- source_word: וְשֻׁבוּ עוֹד
  choice: Oui, revenez-y
  rationale: La répétition de l’impératif renforce l’appel. « Oui » marque cette insistance, et « y » renvoie naturellement en français au jugement que les amis doivent réexaminer.
- source_word: צִדְקִי
  choice: mon bon droit
  rationale: Dans ce débat judiciaire et moral, le terme désigne la position juste ou l’intégrité de Job. « Mon bon droit » préserve la nuance forensique sans transformer sa déclaration en prétention explicite à une perfection sans péché.
- source_word: בָהּ
  choice: dans cette affaire
  rationale: Le suffixe féminin renvoie à un antécédent implicite, vraisemblablement l’affaire ou la question débattue. L’explicitation minimale produit un français intelligible, tandis qu’une note signale l’indétermination de l’hébreu.
theological_decisions:
- issue: Portée de la revendication exprimée par צִדְקִי
  choice: Job affirme que son bon droit subsiste dans le différend qui l’oppose à ses amis.
  alternative: Job revendique sa justice ou son intégrité personnelle ; autre possibilité, il affirme que la justice reste en jeu dans cette affaire.
  rationale: Le contexte est celui de l’évaluation portée par les amis de Job. « Mon bon droit » maintient la tension morale et judiciaire du terme sans en faire une affirmation technique d’impeccabilité.
translation_notes:
  register: Français international actuel, digne et direct. La première phrase explicite sobrement le mouvement de retour demandé aux amis ; la seconde conserve l’insistance de la répétition. « Bon droit » exprime la nuance à la fois morale et judiciaire de צדק dans ce contexte.
