revisions:
- from: 'Revenez sur votre jugement[a], je vous prie ; qu’il n’y ait pas d’injustice ! Oui, revenez-y : dans cette affaire, mon bon droit subsiste[b].'
  to: 'Revenez, je vous prie ; qu’il n’y ait pas d’injustice. Revenez encore : mon bon droit demeure dans cette affaire[a].'
  rationale: La révision rend explicitement la répétition de l’impératif et « encore » (עוֹד), sans ajouter au second impératif un pronom renvoyant au jugement des amis. Elle conserve la lecture contextuelle de בָהּ comme l’affaire débattue, mais la signale comme une explicitation dans une note. « Mon bon droit demeure » maintient la portée morale et judiciaire de צִדְקִי sans imposer une interprétation doctrinale.
