  naturalness: Le français du projet est globalement naturel et d’un registre approprié. « Revenez encore » et « mon bon droit demeure dans cette affaire » sont directs, idiomatiques et conservent la gravité du discours de Job.
  terminology: « Injustice » rend bien עַוְלָה. « Mon bon droit » est un choix français défendable pour צִדְקִי dans ce contexte de contestation, tout en évitant de transformer l’énoncé en affirmation de perfection morale. La note explicite que « dans cette affaire » interprète prudemment le pronom hébreu sans prétendre en lever toute l’ambiguïté.
