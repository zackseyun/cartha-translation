  verdict: revise
  source_fidelity: Le projet rend correctement la séquence générale et maintient utilement la différence entre בוש (« avoir honte ») et חפר (« être confondu / humilié »). Toutefois, « restent confondus » ajoute une idée de durée ou de persistance qui n’est pas exprimée par ויחפרו. Le passage du passé composé au présent dans cette même séquence est aussi moins net que nécessaire.
  naturalness: « Arrivés là » est naturel, mais « ils y sont arrivés » restitue plus directement le verbe fini hébreu et évite la construction participiale. « Ils sont confondus » est idiomatique dans un registre biblique sobre sans l’ajout aspectuel de « restent ».
  terminology: « Ont honte » convient pour בוש, et « confondus » conserve pour חפר une nuance de honte et d’abaissement sans réduire le mot à la seule déception. La note sur la forme singulière de בָטָח est pertinente, à condition de préciser qu’il s’agit de la forme grammaticale et non d’imposer un référent individuel.
