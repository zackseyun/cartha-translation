  text: They are ashamed because they trusted[b][a]; they came there and were disappointed.
translation:
  language: fr
  text: Ils ont honte d’avoir eu confiance[a] ; ils y sont arrivés[b] et sont confondus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « car il a eu confiance », avec un verbe au singulier entre des verbes au pluriel. Le français rend le sens collectif au pluriel.
    reason: textual_grammar
  - marker: b
    text: Littéralement « ils sont arrivés jusqu’à elle », c’est-à-dire jusqu’au torrent saisonnier évoqué dans le contexte.
    reason: cross_reference
  - marker: c
    text: Ou « ils sont humiliés » ou « remplis de confusion ». Les deux verbes hébreux du verset appartiennent au champ de la honte et du déshonneur.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּשׁוּ
  choice: ils ont honte
  rationale: Le verbe בוש exprime ici la honte éprouvée ou le fait d’être couvert de honte. Le présent résultatif français rend naturellement l’état produit par leur attente déçue.
- source_word: כִּי
  choice: d’avoir
  rationale: 'La tournure infinitive « d’avoir eu confiance » exprime naturellement en français le rapport causal introduit par כִּי : leur confiance antérieure est la cause de leur honte.'
- source_word: בָטָח
  choice: avoir eu confiance
  rationale: בטח signifie placer sa confiance ou se croire en sécurité. Le français garde ici l’emploi absolu du verbe, sans ajouter un objet absent de l’hébreu. Le pluriel suit le groupe évoqué par les verbes environnants, tandis qu’une note signale la forme singulière du texte hébreu.
- source_word: בָּאוּ
  choice: arrivés
  rationale: Le participe détaché rend avec concision l’arrivée des voyageurs avant leur réaction, tout en conservant la succession des actions.
- source_word: עָדֶיהָ
  choice: là
  rationale: L’adverbe français reprend naturellement le torrent saisonnier visé dans le contexte, sans reproduire artificiellement le suffixe féminin de l’hébreu.
- source_word: וַיֶּחְפָּרוּ
  choice: ils restent confondus
  rationale: חפר décrit ici le fait d’être déconcerté, humilié ou couvert de confusion. « Restent confondus » conserve la nuance de honte et de désarroi sans réduire le terme à une simple déception.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, sobre et poétique. La formulation distingue les deux verbes de honte : « ont honte » pour בוש et « restent confondus » pour חפר. Elle évite d’ajouter explicitement « en lui » ou « en elle », puisque בטח n’a pas ici de complément exprimé.'
