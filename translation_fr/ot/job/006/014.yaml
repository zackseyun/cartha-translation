  text: לַ/מָּ֣ס מֵרֵעֵ֣/הוּ חָ֑סֶד וְ/יִרְאַ֖ת שַׁדַּ֣י יַעֲזֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/014.yaml
  text: Kindness from his friend is due to one who is despairing[b][a], even if he forsakes the fear of the Almighty.
translation:
  language: fr
  text: À celui qui désespère, son ami doit témoigner de la bonté[b][a], même si celui qui désespère abandonne la crainte du Tout-Puissant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Celui qui refuse la bonté à son ami désespéré abandonne la crainte du Tout-Puissant. » La syntaxe hébraïque est condensée et peut se comprendre ainsi.'
    reason: alternative_reading
  - marker: b
    text: Le mot traduit par « bonté » peut aussi évoquer l’amour fidèle, la miséricorde ou la loyauté.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּס
  choice: à celui qui désespère
  rationale: Le terme dérive d’une racine signifiant « fondre, se dissoudre » et décrit ici, de façon imagée, quelqu’un qui s’effondre intérieurement sous la souffrance. Cette formulation naturelle en français conserve l’idée de détresse profonde.
- source_word: מֵרֵעֵהוּ
  choice: son ami
  rationale: La préposition מִן indique ici la source attendue de la bonté, et le suffixe de troisième personne du masculin singulier est rendu par « son ».
- source_word: חָסֶד
  choice: bonté
  rationale: Dans cette relation humaine, חֶסֶד désigne une bonté fidèle qui se manifeste par la compassion. « Bonté » est clair dans le texte principal, tandis que la note conserve les nuances de fidélité, d’amour loyal et de miséricorde.
- source_word: וְיִרְאַת שַׁדַּי
  choice: la crainte du Tout-Puissant
  rationale: Cette expression préserve l’idiome biblique de la crainte révérencielle envers Dieu et son poids théologique.
- source_word: יַעֲזֹב
  choice: il abandonne
  rationale: 'Le verbe עזב signifie « quitter, délaisser, abandonner ». Dans la lecture principale, la proposition est comprise comme concessive : la bonté reste due à celui qui désespère, même s’il abandonne la crainte de Dieu.'
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: C’est le rendu français traditionnel et intelligible du titre divin שַׁדַּי, particulièrement fréquent dans Job.
theological_decisions:
- issue: Rapport syntaxique de la proposition finale
  choice: La bonté de son ami est due à celui qui désespère, même s’il abandonne la crainte du Tout-Puissant.
  alternative: Celui qui refuse la bonté à son ami désespéré abandonne la crainte du Tout-Puissant.
  rationale: L’hébreu est très condensé et permet ces deux analyses. La lecture principale cadre avec le reproche que Job adresse à ses amis et comprend la dernière proposition dans un sens concessif. L’autre lecture, ancienne et substantielle, est conservée en note afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français moderne international, naturel et digne. La tournure « doit témoigner de la bonté » explicite sobrement la relation implicite entre les éléments nominaux de l’hébreu, tandis que les notes préservent sa concision ambiguë et la richesse de חֶסֶד.
