  text: ה֭וֹרוּ/נִי וַ/אֲנִ֣י אַחֲרִ֑ישׁ וּ/מַה שָּׁ֝גִ֗יתִי הָבִ֥ינוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/024.yaml
  text: Teach me[a], and I will be silent; make me understand how I have gone astray.
translation:
  language: fr
  text: Instruisez-moi, et je me tairai ; faites-moi comprendre en quoi je me suis égaré.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרוּנִי
  choice: Instruisez-moi
  rationale: Le hiphil de ירה signifie ici « enseigner, instruire ». « Instruisez-moi » convient à l’appel solennel de Job, qui demande à ses interlocuteurs de lui montrer son erreur.
- source_word: וַאֲנִי אַחֲרִישׁ
  choice: et je me tairai
  rationale: La conjonction et le pronom emphatique sont rendus simplement, tandis que « je me tairai » restitue le sens de חרשׁ et le registre digne de la réplique.
- source_word: וּמַה שָּׁגִיתִי
  choice: en quoi je me suis égaré
  rationale: מַה peut ici demander la nature ou le domaine de l’erreur. « En quoi » est idiomatique en français, et « je me suis égaré » conserve l’image de שׁגה, qui désigne le fait d’errer ou de dévier.
- source_word: הָבִינוּ לִי
  choice: faites-moi comprendre
  rationale: L’impératif hiphil de בין exprime l’idée de faire comprendre ; le complément לִי est naturellement intégré dans « faites-moi comprendre ».
theological_decisions:
- issue: Nature de l’erreur reconnue par Job
  choice: 'Formulation conditionnelle dans son contexte pragmatique : « en quoi je me suis égaré »'
  alternative: « quelle erreur j’ai commise »
  rationale: Le verset ne constitue pas nécessairement un aveu d’une faute précise ; Job demande à ses amis de démontrer ce qu’ils lui reprochent. La traduction préserve cette tension sans présumer sa culpabilité ni son innocence.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif pluriel correspond aux amis auxquels Job s’adresse. Le parallélisme des deux demandes est conservé, sans alourdir la phrase.
