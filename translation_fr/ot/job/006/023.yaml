base_translation:
  language: en
  yaml_path: translation/ot/job/006/023.yaml
  text: or[b][a], ‘Deliver me from the hand of the adversary,’ and ‘Redeem me from the hand of the ruthless’?”
translation:
  language: fr
  text: 'ou : « Délivrez-moi de la main de l’adversaire et rachetez-moi de la main des hommes violents[a] » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des hommes impitoyables » ; autre traduction possible : « des tyrans ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְּטוּנִי
  choice: Délivrez-moi
  rationale: Le hifil impératif de מלט exprime le fait de faire échapper quelqu’un, donc de le délivrer. « Délivrez-moi » est naturel en français et convient à l’appel concret au secours.
- source_word: מִיַּד
  choice: de la main de
  rationale: Cette expression hébraïque désigne le pouvoir ou l’emprise de quelqu’un. L’image de la « main » reste claire et idiomatique en français biblique courant.
- source_word: צָר
  choice: l’adversaire
  rationale: Le singulier צָר désigne une personne hostile. « L’adversaire » conserve le nombre et n’impose pas un contexte militaire précis.
- source_word: עָרִיצִים
  choice: les hommes impitoyables
  rationale: Le pluriel désigne des personnes violentes, brutales ou oppressives. « Les hommes impitoyables » rend explicitement le caractère personnel du substantif et sa forte portée morale, sans le sens politique plus étroit de « tyrans ».
- source_word: תִּפְדּוּנִי
  choice: rachetez-moi
  rationale: Le verbe פדה évoque une libération, parfois obtenue au moyen d’une rançon. « Rachetez-moi » maintient sa distinction avec מלט dans le premier membre et conserve l’image forte du texte.
theological_decisions:
- issue: Sens de פדה dans un contexte non cultuel et non explicitement sotériologique
  choice: rachetez-moi
  alternative: libérez-moi
  rationale: Ici, le verbe concerne une délivrance concrète de personnes violentes. « Rachetez-moi » préserve néanmoins la valeur lexicale particulière de פדה sans transformer le passage en affirmation doctrinale sur la rédemption.
translation_notes:
  register: Français moderne, naturel et digne. La structure interrogative dépend du verset précédent, d’où l’ouverture par « ou ». Le parallélisme hébreu est conservé, ainsi que l’image répétée de « la main ». Le second impératif peut sembler théologiquement marqué en français, mais il est ici à comprendre au sens concret de délivrer de l’emprise d’oppresseurs.
