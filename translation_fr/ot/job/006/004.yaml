source:
  edition: WLC
  text: כִּ֤י חִצֵּ֪י שַׁדַּ֡י עִמָּדִ֗/י אֲשֶׁ֣ר חֲ֭מָתָ/ם שֹׁתָ֣ה רוּחִ֑/י בִּעוּתֵ֖י אֱל֣וֹהַּ יַֽעַרְכֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/004.yaml
  text: For the arrows of the Almighty are in me[a]; my spirit drinks their poison[c][b]; the terrors of God array themselves against me.
translation:
  language: fr
  text: Car les flèches du Tout-Puissant sont avec moi[a] ; mon esprit boit leur poison[b] ; les terreurs de Dieu se rangent contre moi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont en moi ». Littéralement, la préposition signifie « avec moi » ; dans le contexte des flèches et du poison, certains comprennent qu’elles ont atteint Job et demeurent en lui.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur venin » ; le mot peut aussi être compris plus abstraitement au sens de « leur fureur ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement « se mettent en ordre contre moi » : l’expression évoque des forces qui se rangent pour le combat.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication par laquelle Job justifie l’intensité de sa plainte, sans réduire la particule à une valeur exclusivement causale.
- source_word: חִצֵּי שַׁדַּי
  choice: les flèches du Tout-Puissant
  rationale: Conserve l’image guerrière et traduit le titre divin שַׁדַּי par son équivalent français courant.
- source_word: עִמָּדִי
  choice: sont en moi
  rationale: La préposition signifie littéralement « avec moi », mais l’image des flèches et la proposition suivante suggèrent qu’elles ont atteint Job et demeurent en lui. Une note préserve l’autre lecture.
- source_word: חֲמָתָם
  choice: leur poison
  rationale: Dans le contexte immédiat des flèches, le nom désigne naturellement leur substance toxique, tout en pouvant aussi évoquer le venin ou, plus abstraitement, la fureur.
- source_word: שֹׁתָה רוּחִי
  choice: mon esprit boit
  rationale: Rend littéralement et vivement l’absorption intérieure et continue de la souffrance par Job.
- source_word: בִּעוּתֵי אֱלוֹהַּ
  choice: les terreurs de Dieu
  rationale: Préserve l’intensité du pluriel et traduit אֱלוֹהַּ par le terme français usuel « Dieu ».
- source_word: יַעַרְכוּנִי
  choice: se rangent en bataille contre moi
  rationale: Fait entendre l’image militaire du verbe, celle de forces qui prennent position contre Job.
theological_decisions:
- issue: Traduction parallèle de שַׁדַּי et אֱלוֹהַּ
  choice: « le Tout-Puissant » puis « Dieu »
  alternative: Transcrire « Shaddaï » ou employer le même titre dans les deux propositions
  rationale: L’hébreu emploie deux désignations divines distinctes. Les traduire sans les uniformiser conserve cette variation poétique.
- issue: Sens de חֲמָתָם
  choice: Le poison des flèches
  alternative: « leur venin », « leur fureur » ou « sa fureur »
  rationale: L’image concrète de flèches dont l’esprit de Job boit la substance toxique convient le mieux au contexte, sans transformer inutilement le mot en affirmation abstraite sur la colère divine.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La formulation conserve les métaphores des flèches empoisonnées et de forces rangées au combat, ainsi que la tension entre souffrance intérieure et assaut divin.
