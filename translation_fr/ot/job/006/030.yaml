  yaml_path: translation/ot/job/006/030.yaml
  text: Is there injustice on my tongue? Does my palate not discern calamities?[a]
translation:
  language: fr
  text: Y a-t-il de l’injustice sur ma langue ? Mon palais ne discerne-t-il pas les choses funestes[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les choses perverses » ou « les calamités ». Le terme hébreu peut désigner des maux destructeurs ou des malheurs, mais aussi des choses moralement perverties.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֵשׁ
  choice: Y a-t-il
  rationale: Introduit naturellement en français une question rhétorique portant sur l’existence de quelque chose.
- source_word: בִּלְשׁוֹנִי
  choice: sur ma langue
  rationale: Préserve la métaphore corporelle de l’hébreu tout en évoquant clairement les paroles de Job.
- source_word: עַוְלָה
  choice: de l’injustice
  rationale: Rend la dimension morale du terme, qui désigne ce qui est injuste, mauvais ou pervers.
- source_word: אִם
  choice: '[rendu par l’ouverture de la seconde question]'
  rationale: Dans ce parallélisme interrogatif, le français exprime plus naturellement sa fonction en formulant directement la seconde question.
- source_word: חִכִּי
  choice: mon palais
  rationale: Conserve l’image concrète de l’organe du goût, employée ici pour parler du discernement.
- source_word: לֹא יָבִין
  choice: ne sait-il pas discerner
  rationale: Exprime la capacité de perception et d’évaluation suggérée par בין dans l’image du palais.
- source_word: הַוּוֹת
  choice: les choses funestes
  rationale: Formulation assez large pour désigner des réalités destructrices ou calamiteuses sans exclure entièrement une nuance morale.
