  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/לְ/הוֹכַ֣ח מִלִּ֣ים תַּחְשֹׁ֑בוּ וּ֝/לְ/ר֗וּחַ אִמְרֵ֥י נֹאָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/026.yaml
  text: Do you think to reprove words[a], when the words of a despairing man are for the wind?
translation:
  language: fr
  text: Pensez-vous critiquer des paroles[a], alors que les paroles d’un homme désespéré sont du vent ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pensez-vous critiquer de simples paroles et prendre pour du vent les paroles d’un homme désespéré ? » La syntaxe hébraïque permet de comprendre le second membre soit comme une affirmation — les paroles d’un homme désespéré sont du vent —, soit comme la suite de ce que les interlocuteurs cherchent à critiquer.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַ/לְ/הוֹכַח
  choice: reprendre
  rationale: L’infinitif de יכח exprime ici l’action de contester ou de corriger avec reproche. « Reprendre » conserve cette portée évaluative et polémique sans alourdir la phrase.
- source_word: מִלִּים
  choice: des paroles
  rationale: Rendu direct de מִלִּים, qui préserve la concision de la plainte de Job sans ajouter explicitement l’idée de « simples » paroles.
- source_word: תַּחְשֹׁבוּ
  choice: pensez-vous
  rationale: חשב peut signifier penser, estimer ou projeter. Dans cette question rhétorique, « pensez-vous » reste naturel et laisse l’infinitif préciser ce qui est envisagé.
- source_word: וּ/לְ/רוּחַ
  choice: livrés au vent
  rationale: Le syntagme conserve l’image concrète du vent et exprime naturellement en français le caractère fugitif ou vain des propos, tout en évitant de réduire רוּחַ à la seule notion de néant.
- source_word: אִמְרֵי
  choice: les propos
  rationale: Le pluriel construit désigne les paroles prononcées. « Propos » évite une répétition française pesante tout en maintenant le lien avec מִלִּים.
- source_word: נֹאָשׁ
  choice: un homme désespéré
  rationale: Le participe niphal désigne celui qui a perdu espoir. Cette formulation conserve la force personnelle et l’état de désespoir exprimés par l’hébreu.
theological_decisions:
- issue: Rapport syntaxique de וּלְרוּחַ אִמְרֵי נֹאָשׁ
  choice: 'Comprendre le second membre comme une proposition circonstancielle : les propos de l’homme désespéré sont livrés au vent.'
  alternative: 'Rattacher le second membre à l’action envisagée : « et traiter comme du vent les propos d’un homme désespéré ».'
  rationale: L’hébreu, très elliptique, permet les deux analyses. Le texte principal suit la lecture propositionnelle, tandis que la note conserve l’autre possibilité sans trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, sobre et digne. La question rhétorique demeure concise; « reprendre » garde le ton de confrontation, et la note signale l’ambiguïté syntaxique authentique du verset.
