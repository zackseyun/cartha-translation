  source_fidelity: Le premier membre rend correctement la question rhétorique et l’infinitif de יכח. En revanche, « sont livrés au vent » introduit une action absente de l’hébreu et ne rend pas directement la relation elliptique de לְרוּחַ. « Sont du vent » conserve plus fidèlement l’image et l’ellipse. L’ambiguïté syntaxique est à maintenir en note.
  naturalness: « Pensez-vous reprendre des paroles » peut se comprendre comme « répéter des paroles » en français moderne. « Critiquer des paroles » exprime clairement l’idée de contestation ou de reproche. « Les paroles ... sont du vent » est idiomatique et sobre dans ce contexte.
  terminology: « Paroles » dans les deux membres préserve le parallélisme entre מִלִּים et אִמְרֵי. « Homme désespéré » rend naturellement le participe נֹאָשׁ, sans ajout doctrinal ni interprétatif.
