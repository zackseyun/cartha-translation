  text: The caravans of Tema looked[c][b][a]; the travelers of Sheba hoped for them.
translation:
  language: fr
  text: Les caravanes[a] de Téma regardaient ; les voyageurs de Saba espéraient[b] en eux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu rendu par « caravanes » peut désigner littéralement des chemins ou des routes ; ici, il désigne les groupes de voyageurs qui les empruntent.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les attendaient ». Le verbe hébreu peut exprimer soit l’espoir, soit l’attente confiante.'
    reason: lexical_alternative
  - marker: c
    text: Le pronom « eux » renvoie aux torrents saisonniers décrits dans les versets précédents.
    reason: cross_reference
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: regardaient
  rationale: Le verbe נבט signifie regarder ou porter le regard. « Regard(aient) » reste concis et laisse le contexte préciser que les caravanes cherchaient les cours d’eau.
- source_word: אָרְחוֹת
  choice: caravanes
  rationale: Bien que le nom puisse désigner des chemins, le parallélisme avec הֲלִיכֹת et le contexte des voyageurs du désert favorisent ici le sens métonymique de groupes voyageant sur ces routes.
- source_word: תֵּמָא
  choice: Téma
  rationale: Nom géographique translittéré selon l’usage français.
- source_word: הֲלִיכֹת
  choice: voyageurs
  rationale: Le terme, apparenté à l’idée de marche ou de trajet, désigne ici les groupes qui voyagent et forme un parallèle naturel avec les caravanes.
- source_word: שְׁבָא
  choice: Saba
  rationale: Forme française courante du nom géographique biblique.
- source_word: קִוּוּ
  choice: espéraient
  rationale: קוה peut exprimer l’espoir ou l’attente confiante. « Espéraient » rend l’attente pressante des voyageurs sans supprimer l’autre nuance, signalée en note.
- source_word: לָמוֹ
  choice: en eux
  rationale: Le pronom masculin pluriel renvoie vraisemblablement aux torrents saisonniers évoqués auparavant. « En eux » conserve le renvoi pronominal et s’accorde naturellement avec « espéraient ».
