  text: אַף עַל יָת֥וֹם תַּפִּ֑ילוּ וְ֝/תִכְר֗וּ עַל רֵֽיעֲ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/027.yaml
  text: You would even cast lots over the fatherless[b][a], and bargain over your friend.
translation:
  language: fr
  text: Vous iriez jusqu’à tirer au sort l’orphelin[a] et à marchander votre ami[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « faire tomber sur l’orphelin », expression généralement comprise comme une allusion au tirage au sort.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à creuser une fosse pour votre ami ». Le verbe hébreu est difficile ; certains y voient plutôt l’idée de marchander ou d’exploiter quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: jusqu’à
  rationale: Dans « iriez jusqu’à », l’intensification marque l’escalade choquante de l’accusation portée par Job.
- source_word: יָתוֹם
  choice: l’orphelin
  rationale: Le terme désigne une personne privée de père et socialement vulnérable. « L’orphelin » est naturel en français moderne.
- source_word: תַּפִּילוּ
  choice: tirer au sort
  rationale: 'Le hiphil de נפל avec עַל est probablement idiomatique : faire tomber le lot sur quelqu’un, donc tirer au sort à son sujet.'
- source_word: תִכְרוּ
  choice: marchander
  rationale: Le verbe est difficile. Dans ce parallélisme, « marchander » exprime vraisemblablement le fait de traiter un ami comme un objet dont on peut tirer profit, tout en laissant l’autre lecture possible en note.
- source_word: רֵיעֲכֶם
  choice: votre ami
  rationale: « Ami » convient à l’adresse directe de Job à ses compagnons et souligne leur trahison.
- source_word: עַל ... עַל
  choice: au sujet de ... (complément direct en français)
  rationale: La répétition hébraïque structure les deux accusations. Une reproduction mécanique par « sur » serait peu naturelle en français ; le rapport est rendu idiomatiquement dans chaque proposition.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le conditionnel « iriez » rend naturellement la valeur accusatrice du contexte. Les deux difficultés lexicales majeures sont signalées sans trancher au-delà des données.
