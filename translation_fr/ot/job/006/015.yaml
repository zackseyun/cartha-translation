  text: אַ֭חַ/י בָּגְד֣וּ כְמוֹ נָ֑חַל כַּ/אֲפִ֖יק נְחָלִ֣ים יַעֲבֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/015.yaml
  text: My brothers have dealt treacherously like a wadi[a], like the channels of wadis that pass away,
translation:
  language: fr
  text: Mes frères se sont montrés déloyaux comme un oued[a], comme le lit de torrents qui disparaissent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un torrent…, comme le lit de torrents ». Le mot hébreu נחל peut désigner un cours d’eau, une vallée torrentielle ou un cours d’eau saisonnier ; « oued » préserve ici l’image d’un milieu aride.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: mes frères
  rationale: Le terme hébreu signifie littéralement « mes frères » et peut, dans ce contexte, désigner plus largement des proches ou des compagnons. Le sens familial est conservé sans imposer cette extension dans le texte.
- source_word: בָּגְדוּ
  choice: ont été perfides
  rationale: Le verbe exprime la déloyauté ou la perfidie dans une relation. Cette formulation garde sa forte portée morale sans préciser un acte particulier de trahison.
- source_word: כְמוֹ
  choice: comme
  rationale: Équivalent comparatif naturel et direct en français.
- source_word: נָחַל
  choice: un oued
  rationale: Dans ce passage, le mot évoque un cours d’eau intermittent en région aride plutôt qu’un cours d’eau permanent. « Oued » préserve ce cadre géographique et prépare l’image saisonnière des versets suivants.
- source_word: כַאֲפִיק
  choice: comme les lits de
  rationale: אפיק désigne le lit, le chenal ou le cours où s’écoule l’eau. « Lits » est naturel en français dans l’image de cours d’eau temporaires.
- source_word: נְחָלִים
  choice: oueds
  rationale: Le pluriel de נחל est rendu de façon cohérente avec le premier emploi afin de préserver l’image des cours d’eau intermittents du désert.
- source_word: יַעֲבֹרוּ
  choice: qui disparaissent
  rationale: Le verbe signifie fondamentalement « passer ». Dans le contexte des oueds saisonniers, il exprime leur caractère passager et leur disparition; cette valeur contextuelle est rendue naturellement en français.
