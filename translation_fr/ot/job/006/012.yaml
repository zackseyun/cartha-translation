  text: אִם כֹּ֣חַ אֲבָנִ֣ים כֹּחִ֑/י אִֽם בְּשָׂרִ֥/י נָחֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/012.yaml
  text: Is my strength the strength of stones[a], or is my flesh bronze?
translation:
  language: fr
  text: Ma force est-elle la force des pierres ? Ma chair est-elle de bronze ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: est-elle
  rationale: Dans chacun des deux membres, אִם introduit une question rhétorique plutôt qu’une condition; l’inversion exprime naturellement cette valeur interrogative en français.
- source_word: כֹּחַ ... כֹּחִי
  choice: ma force est-elle la force
  rationale: « Force » convient au contexte physique, et sa répétition conserve l’insistance et le parallélisme de l’hébreu.
- source_word: אֲבָנִים
  choice: pierres
  rationale: Le pluriel concret « pierres » rend directement l’image hébraïque sans l’intensifier en « rochers ».
- source_word: בְּשָׂרִי
  choice: ma chair
  rationale: « Ma chair » traduit littéralement l’expression et maintient le contraste entre la fragilité humaine et la dureté du métal.
- source_word: נָחוּשׁ
  choice: bronze
  rationale: Dans cette comparaison portant sur la dureté, « bronze » est une traduction naturelle et traditionnelle du terme, qui peut aussi désigner le cuivre.
theological_decisions: []
translation_notes:
  register: Deux questions rhétoriques brèves, en français moderne et digne. La répétition de « force » et le terme concret « chair » préservent le parallélisme poétique ainsi que l’opposition entre faiblesse humaine, pierre et métal.
