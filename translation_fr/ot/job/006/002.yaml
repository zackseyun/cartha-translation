  text: ל֗וּ שָׁק֣וֹל יִשָּׁקֵ֣ל כַּעְשִׂ֑/י ו/הית/י בְּֽ/מֹאזְנַ֥יִם יִשְׂאוּ יָֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/002.yaml
  text: Oh[a], that my vexation were fully weighed[b], and my calamity lifted together in the balances.
translation:
  language: fr
  text: Ah ! si seulement mon tourment[a] était dûment pesé, et mon malheur placé avec lui dans la balance[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon chagrin », « mon irritation » ou « ma colère ». Le mot hébreu peut désigner une affliction intérieure, la vexation ou la colère.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur les plateaux de la balance ». Le terme hébreu est une forme duelle, employée pour une balance ou ses deux plateaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּ
  choice: Ah ! si seulement
  rationale: Introduit un souhait plaintif et irréalisé ; cette tournure restitue naturellement sa force affective en français.
- source_word: שָׁקוֹל יִשָּׁקֵל
  choice: pouvait être pesée avec exactitude
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’idée de peser ; « avec exactitude » exprime cette insistance sans calque maladroit.
- source_word: כַּעְשִׂי
  choice: mon irritation
  rationale: Le terme peut évoquer l’irritation, le dépit, l’affliction intérieure ou la colère. « Irritation » conserve ici une certaine ambiguïté entre souffrance ressentie et réaction émotionnelle.
- source_word: וְהַוָּתִי
  choice: mon malheur
  rationale: Le nom désigne un désastre, une ruine ou une calamité ; « malheur » est naturel, digne et convient à l’ensemble des épreuves de Job.
- source_word: בְּמֹאזְנַיִם
  choice: sur la balance
  rationale: Le duel hébreu désigne l’instrument de pesée à deux plateaux. En français moderne, « sur la balance » est la formulation idiomatique.
- source_word: יִשְׂאוּ
  choice: placé
  rationale: Le verbe signifie littéralement « soulever, porter ». Dans une scène de pesée, « placé […] sur la balance » rend naturellement l’action implicite sans introduire un sujet indéfini lourd.
- source_word: יָחַד
  choice: avec elle
  rationale: Le mot indique que l’irritation et le malheur sont pesés ensemble. La reprise pronominale explicite en français leur association et évite une fin de phrase ambiguë.
theological_decisions: []
translation_notes:
  register: Poésie plaintive, actuelle et digne. L’exclamation initiale conserve l’intensité du souhait, tandis que l’image concrète de la pesée reste claire pour un lectorat moderne.
