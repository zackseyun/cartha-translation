  text: Can tasteless food be eaten without salt[a], or is there any taste in the slime of mallow?
translation:
  language: fr
  text: Peut-on manger un aliment fade sans sel[a] ? Y a-t-il du goût dans le suc de la mauve ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les termes hébreux de la seconde question sont incertains. « Le suc de la mauve » pourrait aussi se comprendre comme « la substance visqueuse de la mauve » ; selon une interprétation traditionnelle, l’expression désigne « le blanc d’un œuf ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יֵאָכֵל
  choice: Peut-on manger
  rationale: L’interrogatif הֲ avec l’imparfait nifal de אכל forme une question rhétorique. La tournure française active et impersonnelle « Peut-on manger » en restitue naturellement la force.
- source_word: תָּפֵל
  choice: un aliment fade
  rationale: L’adjectif désigne ce qui est insipide ou non assaisonné. « Un aliment fade » explicite le référent comestible sous-entendu sans surinterpréter.
- source_word: מִ/בְּלִי מֶלַח
  choice: sans sel
  rationale: Cette expression indique simplement l’absence de sel; « sans sel » est direct et idiomatique.
- source_word: אִם יֶשׁ
  choice: Y a-t-il
  rationale: אִם introduit ici une seconde question rhétorique parallèle. En français, une nouvelle interrogation directe rend clairement cette structure.
- source_word: טַעַם
  choice: du goût
  rationale: Le nom signifie « goût » ou « saveur ». « Du goût » fait écho à « fade » et convient à la tournure existentielle française.
- source_word: בְּ/רִיר
  choice: dans le suc de
  rationale: Le terme rare et difficile peut désigner un liquide visqueux, une sécrétion ou un jus. « Suc » reste naturel pour une plante tout en laissant l’incertitude lexicale à la note.
- source_word: חַלָּמוּת
  choice: la mauve
  rationale: Le nom, très incertain, est souvent compris comme celui d’une plante, la mauve. Cette identification demeure discutée et est signalée en note.
