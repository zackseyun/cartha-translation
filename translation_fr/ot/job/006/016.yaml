  yaml_path: translation/ot/job/006/016.yaml
  text: which are dark from ice[a], and on them the snow conceals itself.
translation:
  language: fr
  text: qui sont sombres à cause de la glace[a], et sur lesquels la neige se cache.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui deviennent troubles à cause de la glace » ; le participe hébreu signifie d’abord « être sombre » ou « s’assombrir », mais, dans ce contexte, il peut évoquer une eau rendue trouble par les conditions hivernales.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּדְרִים
  choice: qui s’assombrissent
  rationale: Le participe de קדר exprime le fait de devenir sombre ou d’être sombre. « S’assombrissent » restitue ce sens visuel tout en restant naturel dans la description poétique des torrents.
- source_word: מִנִּי
  choice: à cause de
  rationale: La préposition peut indiquer la provenance ou la cause. Ici, elle présente vraisemblablement la glace comme la cause de l’assombrissement.
- source_word: קָרַח
  choice: la glace
  rationale: קָרַח désigne la glace ou le gel. « La glace » convient au parallélisme avec la neige dans cette évocation hivernale.
- source_word: עָלֵימוֹ
  choice: sur lesquels
  rationale: La préposition munie du suffixe masculin pluriel a un sens spatial et renvoie aux torrents évoqués dans le contexte.
- source_word: יִתְעַלֶּם
  choice: se cache
  rationale: La forme hitpael de עלם exprime l’action de se cacher ou de se dissimuler. « Se cache » préserve simplement la nuance réfléchie.
- source_word: שָׁלֶג
  choice: la neige
  rationale: L’article défini est idiomatique en français lorsqu’il est question de la neige comme phénomène naturel dans cette scène.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et sobre. La formulation conserve l’image inhabituelle de la neige qui « se cache » sur les torrents, sans la remplacer par une explication interprétative.
