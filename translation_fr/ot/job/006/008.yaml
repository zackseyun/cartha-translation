  text: מִֽי יִ֭תֵּן תָּב֣וֹא שֶֽׁאֱלָתִ֑/י וְ֝/תִקְוָתִ֗/י יִתֵּ֥ן אֱלֽוֹהַּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/008.yaml
  text: Oh[a], that my request would come, and that God would grant my hope.
translation:
  language: fr
  text: Ah[a] ! que ma demande se réalise, que Dieu réalise mon espoir !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si seulement ma demande se réalisait et si Dieu réalisait mon espoir ! »'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ah ! que
  rationale: Cette tournure idiomatique exprime ici un souhait ardent plutôt qu’une question littérale. « Ah ! que » restitue naturellement le ton de lamentation en français.
- source_word: תָּבוֹא
  choice: aboutisse
  rationale: Le verbe signifie littéralement « venir ». Avec « ma demande » pour sujet, « aboutisse » exprime en français courant le souhait de voir la requête parvenir à son accomplissement, sans préciser davantage la manière dont elle serait réalisée.
- source_word: שֶׁאֱלָתִי
  choice: ma demande
  rationale: Le nom désigne une demande ou une requête. « Ma demande » est clair, direct et adapté au registre de la supplication.
- source_word: וְתִקְוָתִי
  choice: ce que j’espère
  rationale: תִּקְוָה peut désigner l’espoir, l’attente ou l’objet espéré. La tournure « ce que j’espère » s’accorde naturellement avec le verbe « accorder » tout en conservant cette ouverture sémantique.
- source_word: יִתֵּן
  choice: m’accorde
  rationale: Le sens premier est « donner », mais avec l’objet espéré, « accorder » rend idiomatiquement l’idée que Dieu réalise le souhait exprimé.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Le terme singulier désigne Dieu. Rien dans ce mot seul ne justifie l’ajout d’un titre comme « le Tout-Puissant ».
