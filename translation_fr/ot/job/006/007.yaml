  text: My soul refuses to touch them[b][a]; they are like the sickness of my food.
translation:
  language: fr
  text: Mon âme refuse d’y toucher[a] ; ils sont pour moi comme une nourriture répugnante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mon appétit refuse d’y toucher. » Le mot hébreu peut désigner l’âme, la personne ou, dans certains contextes, l’appétit.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression hébraïque est condensée et difficile. On pourrait aussi traduire : « ils sont comme une nourriture maladive » ou, plus littéralement, « ils sont comme la maladie de ma nourriture ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֲנָה
  choice: refuse
  rationale: Le verbe מאן exprime le refus ou le fait de ne pas vouloir. Le présent convient à la plainte poétique dans son contexte.
- source_word: לִנְגּוֹעַ
  choice: d’y toucher
  rationale: נגע signifie couramment « toucher ». Le pronom « y » renvoie naturellement aux choses répugnantes évoquées au verset précédent.
- source_word: נַפְשִׁי
  choice: mon être
  rationale: נפש peut désigner l’âme, la personne elle-même, la gorge ou l’appétit. « Mon être » conserve ici l’idée de la personne entière sans réduire le terme au seul appétit.
- source_word: הֵמָּה
  choice: ce sont
  rationale: Le pronom reprend les choses mentionnées auparavant. La tournure présentative française permet d’introduire naturellement leur caractérisation.
- source_word: כִּדְוֵי
  choice: comme des aliments qui rendent malade
  rationale: La forme liée à דוה, « être malade », produit avec לחמי une expression hébraïque condensée et difficile. Cette formulation française garde l’image alimentaire et la notion de maladie tout en restant compréhensible.
- source_word: לַחְמִי
  choice: des aliments … pour moi
  rationale: לחם signifie littéralement « pain », mais peut désigner plus largement la nourriture. Le suffixe de première personne est rendu idiomatiquement par « pour moi », sans suggérer nécessairement que Job possède ou consomme ces aliments.
