source:
  edition: WLC
  text: כִּֽי עַתָּ֗ה מֵ/ח֣וֹל יַמִּ֣ים יִכְבָּ֑ד עַל כֵּ֝֗ן דְּבָרַ֥/י לָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/003.yaml
  text: For now it would be heavier than the sand of the seas[a]; therefore my words have been rash.
translation:
  language: fr
  text: Car à présent, tout cela pèserait plus lourd que le sable des mers ; voilà pourquoi mes paroles s’égarent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu est difficile. On peut aussi comprendre : « sont irréfléchies », « sont confuses » ou « sont emportées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַתָּה
  choice: Car à présent
  rationale: כִּי introduit l’explication de la plainte précédente, et עַתָּה souligne la réalité actuelle de la situation de Job.
- source_word: מֵחוֹל יַמִּים
  choice: plus lourd que le sable des mers
  rationale: La tournure comparative et le pluriel « mers » sont conservés dans un français naturel.
- source_word: יִכְבָּד
  choice: tout cela pèserait plus lourd
  rationale: Le verbe כבד exprime le poids. « Tout cela » explicite sobrement le sujet sous-entendu — le chagrin et le malheur évoqués au verset précédent — tandis que le conditionnel maintient le lien avec l’hypothèse de leur pesée.
- source_word: עַל־כֵּן
  choice: voilà pourquoi
  rationale: Cette locution marque la conséquence et convient au registre d’une parole personnelle sans perdre la force logique de l’hébreu.
- source_word: דְּבָרַי
  choice: mes paroles
  rationale: Rendu direct du nom pluriel, naturel et digne en français.
- source_word: לָעוּ
  choice: s’égarent
  rationale: Le verbe rare et difficile semble décrire des paroles incontrôlées ou désordonnées. « S’égarent » préserve cette ouverture mieux qu’un jugement univoque comme « sont irréfléchies ».
theological_decisions: []
