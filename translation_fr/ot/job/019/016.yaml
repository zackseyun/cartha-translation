  text: לְ/עַבְדִּ֣/י קָ֭רָאתִי וְ/לֹ֣א יַעֲנֶ֑ה בְּמוֹ פִ֝֗/י אֶתְחַנֶּן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/016.yaml
  text: I call to my servant[a], but he does not answer[b]; I plead with him with my own mouth.
translation:
  language: fr
  text: J’appelle mon serviteur[a], mais il ne répond pas[b] ; de ma propre bouche, je le supplie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon esclave ». Le mot hébreu עֶבֶד peut désigner un serviteur ou un esclave selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « J’ai appelé mon serviteur, mais il ne répond pas ; de ma propre bouche, je le supplie. » Le premier verbe hébreu est au parfait et peut être rendu au passé.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעַבְדִּי
  choice: mon serviteur
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Dans ce contexte domestique, « serviteur » est naturel en français moderne, tandis que « esclave » demeure une possibilité lexicale signalée en note.
- source_word: קָרָאתִי
  choice: J’appelle
  rationale: Le parfait peut, dans le discours poétique, présenter vivement la plainte en cours. Le présent français convient au contexte, sans exclure une lecture passée.
- source_word: וְלֹא יַעֲנֶה
  choice: mais il ne répond pas
  rationale: ענה signifie « répondre ». « Mais » exprime naturellement le contraste, et le présent décrit ici l’absence de réponse dans la situation vécue par Job.
- source_word: בְּמוֹ פִי
  choice: de ma propre bouche
  rationale: La tournure conserve l’insistance de בְּמוֹ et met en relief l’humiliation de Job, contraint d’adresser lui-même sa supplication à son serviteur.
- source_word: אֶתְחַנֶּן לוֹ
  choice: je le supplie
  rationale: Le hitpael de חנן exprime une demande insistante de faveur ou de grâce. « Je le supplie » restitue directement cette idée sans ajouter une modalité d’obligation absente du verbe.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre « de ma propre bouche » conserve l’emphase hébraïque tout en restant idiomatique. Les présents rendent la plainte avec vivacité ; la lecture passée est préservée en note.
