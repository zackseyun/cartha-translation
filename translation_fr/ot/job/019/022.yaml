  text: לָ֭/מָּה תִּרְדְּפֻ֣/נִי כְמוֹ אֵ֑ל וּ֝/מִ/בְּשָׂרִ֗/י לֹ֣א תִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/022.yaml
  text: Why do you pursue me like God[b][a], and are not satisfied with my flesh?
translation:
  language: fr
  text: Pourquoi me poursuivez-vous comme Dieu[a] ? Ne vous rassasiez-vous donc pas de ma chair[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme un dieu ». Le mot hébreu peut aussi désigner un dieu ou, moins probablement ici, un être puissant.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « de ma chair ». L’expression évoque probablement le fait de se repaître de la chair même de Job, image de leur hostilité implacable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi
  rationale: L’adverbe interrogatif introduit la protestation de Job et se rend directement par « Pourquoi ».
- source_word: תִּרְדְּפֻנִי
  choice: me poursuivez-vous
  rationale: Le verbe רדף peut signifier poursuivre, pourchasser ou persécuter. « Poursuivre » conserve ici l’image d’un acharnement hostile sans la préciser excessivement.
- source_word: כְמוֹ אֵל
  choice: comme Dieu
  rationale: La comparaison simple est conservée. Dans ce contexte, אֵל désigne probablement Dieu, mais une note maintient l’autre lecture possible.
- source_word: וּמִבְּשָׂרִי
  choice: de ma chair
  rationale: Avec שבע, la préposition מִן indique ce dont on se rassasie. « Chair » maintient l’image corporelle, concrète et violente de l’hébreu.
- source_word: לֹא תִשְׂבָּעוּ
  choice: sans jamais vous rassasier
  rationale: Le verbe שבע signifie être rassasié ou repu. Cette formulation française naturelle rattache la seconde proposition à la question initiale et exprime l’hostilité insatiable suggérée par l’image.
theological_decisions:
- issue: Référent de אֵל dans כְמוֹ אֵל
  choice: Dieu
  alternative: un dieu ; le Puissant
  rationale: Le contexte favorise une comparaison avec l’action sévère de Dieu envers Job. La note préserve l’ambiguïté lexicale réelle sans introduire la lecture moins probable dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et direct. Le vouvoiement pluriel rend l’adresse de Job à ses compagnons. « Sans jamais » exprime naturellement la négation hébraïque dans la continuité de la question, tout en conservant l’image saisissante de la chair dévorée.
