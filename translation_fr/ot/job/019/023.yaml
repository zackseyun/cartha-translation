source:
  edition: WLC
  text: מִֽי יִתֵּ֣ן אֵ֭פוֹ וְ/יִכָּתְב֣וּ/ן מִלָּ֑/י מִֽי יִתֵּ֖ן בַּ/סֵּ֣פֶר וְ/יֻחָֽקוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/023.yaml
  text: Oh[a], that now my words were written down! Oh[b], that they were inscribed in a book!
translation:
  language: fr
  text: Ah ! si seulement mes paroles étaient écrites ! Ah ! si elles étaient gravées dans un livre[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un rouleau » ou « dans un document écrit ». Le mot hébreu peut désigner divers supports ou formes de texte écrit.
    reason: cultural_note
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ah ! si seulement
  rationale: Cette tournure idiomatique exprime un souhait ardent plutôt qu’une question littérale. « Ah ! si seulement » en restitue naturellement la force optative en français.
- source_word: אֵפוֹ
  choice: seulement (dans la tournure expressive)
  rationale: La particule renforce ici l’intensité et l’immédiateté du souhait. Sa valeur est intégrée à « Ah ! si seulement » plutôt que rendue séparément par un « maintenant » peu naturel.
- source_word: וְיִכָּתְבוּן
  choice: étaient écrites
  rationale: La forme passive s’insère dans le souhait irréel exprimé par « si seulement » ; « écrites » rend directement כתב sans ajouter une notion absente.
- source_word: מִלָּי
  choice: mes paroles
  rationale: « Paroles » désigne naturellement les propos que Job souhaite voir consignés et convient au registre solennel du passage.
- source_word: בַּסֵּפֶר
  choice: dans un livre
  rationale: סֵפֶר peut désigner un livre, un rouleau ou plus largement un document écrit. « Livre » est clair et naturel, tandis que l’étendue sémantique du terme est signalée en note.
- source_word: וְיֻחָקוּ
  choice: étaient gravées
  rationale: חקק évoque l’action d’inciser ou de graver, donc une inscription durable. « Gravées » préserve cette image plus nettement qu’un simple « consignées ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et expressif. La répétition de « Ah ! » conserve le parallélisme émotionnel de l’hébreu ; le second « si seulement » est évité pour garder une formulation française fluide sans affaiblir le souhait.
