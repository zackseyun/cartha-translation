  text: בְּ/עֵט בַּרְזֶ֥ל וְ/עֹפָ֑רֶת לָ֝/עַ֗ד בַּ/צּ֥וּר יֵחָצְבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/024.yaml
  text: with an iron stylus and lead[b][a], may they be engraved in the rock forever!
translation:
  language: fr
  text: avec un burin de fer et du plomb[a], qu’elles soient gravées dans le roc pour toujours ![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le plomb pouvait être employé avec l’outil de fer, peut-être pour remplir les lettres entaillées et les rendre plus visibles, mais le texte ne le précise pas.
    reason: cultural_note
  - marker: b
    text: 'Ou : « qu’elles soient taillées dans le roc pour toujours ! » Le verbe hébreu signifie habituellement « tailler » ou « creuser » ; il désigne ici l’inscription durable de paroles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵט
  choice: avec un burin
  rationale: עֵט désigne un instrument servant à écrire ou à graver. Puisqu’il est ici en fer et employé sur le roc, « burin » exprime naturellement l’outil de gravure visé.
- source_word: בַּרְזֶל
  choice: de fer
  rationale: Le terme désigne sans ambiguïté le fer et précise la matière de l’outil.
- source_word: וְעֹפָרֶת
  choice: et du plomb
  rationale: עֹפָרֶת désigne le plomb. Le texte nomme simplement ce métal sans expliquer son emploi, de sorte que la traduction conserve cette concision.
- source_word: לָעַד
  choice: pour toujours
  rationale: Cette expression rend l’idée de permanence durable et convient au souhait que les paroles subsistent.
- source_word: בַּצּוּר
  choice: dans le roc
  rationale: צוּר signifie « roc » ou « rocher ». « Dans le roc » évoque naturellement des caractères entaillés dans la pierre.
- source_word: יֵחָצְבוּן
  choice: qu’elles soient gravées
  rationale: Le verbe חצב signifie ordinairement « tailler, creuser, extraire ». Dans ce contexte d’inscription permanente, « graver » communique clairement l’action de tailler les paroles dans le roc, tandis que la tournure optative prolonge le souhait du verset précédent.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Burin » est plus immédiatement compréhensible que « stylet » dans un contexte de gravure sur roche. Le pronom « elles » reprend les paroles mentionnées au verset précédent.
