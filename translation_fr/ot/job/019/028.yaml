source:
  edition: WLC
  text: כִּ֣י תֹ֭אמְרוּ מַה נִּרְדָּף ל֑/וֹ וְ/שֹׁ֥רֶשׁ דָּ֝בָ֗ר נִמְצָא בִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/028.yaml
  text: If you say[a], ‘How shall we pursue him, since the root of the matter is found in me?’
translation:
  language: fr
  text: 'Si vous dites[a] : « Comment le poursuivrons-nous, puisque la racine de l’affaire se trouve en moi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile. La dernière proposition peut aussi se comprendre ainsi : « la racine de l’affaire se trouve en lui », selon la manière dont on évalue le texte consonantique et les versions anciennes. Certains donnent aussi à « poursuivre » le sens plus fort de « persécuter ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Dans ce contexte, la particule introduit l’hypothèse exprimant les propos des adversaires de Job, plutôt qu’une cause.
- source_word: תֹאמְרוּ
  choice: vous dites
  rationale: L’imparfait qal à la deuxième personne du pluriel prend naturellement une valeur présente dans cette proposition conditionnelle.
- source_word: מַה
  choice: Comment
  rationale: 'Devant le verbe, מַה a ici une valeur interrogative adverbiale : « de quelle manière ? »'
- source_word: נִּרְדָּף
  choice: le poursuivrons-nous
  rationale: Le verbe רדף signifie poursuivre, pourchasser, voire persécuter. « Poursuivre » conserve l’image et laisse entendre l’hostilité sans en préciser excessivement la force.
- source_word: לוֹ
  choice: le
  rationale: Avec רדף, ל peut signaler l’objet de la poursuite ; le français idiomatique emploie donc un complément d’objet direct.
- source_word: וְשֹׁרֶשׁ
  choice: puisque la racine
  rationale: La conjonction peut relier la seconde proposition comme le motif invoqué pour poursuivre Job. « Puisque » explicite cette relation, tandis que « racine » préserve la métaphore.
- source_word: דָּבָר
  choice: de l’affaire
  rationale: דָּבָר désigne ici la question ou l’affaire en cause, et non nécessairement une parole prononcée.
- source_word: נִמְצָא
  choice: se trouve
  rationale: Cette formulation française rend naturellement le niphal à valeur passive ou résultative sans surinterpréter la métaphore.
- source_word: בִי
  choice: en moi
  rationale: La lecture massorétique vocalisée porte « en moi ». Elle est conservée dans le texte principal malgré la difficulté du passage.
theological_decisions:
- issue: Localisation de la « racine de l’affaire »
  choice: en moi
  alternative: en lui
  rationale: Le texte massorétique vocalisé lit בִי, « en moi ». Une compréhension « en lui » est toutefois soutenue par une autre appréciation du texte consonantique et des versions anciennes ; l’ambiguïté textuelle est donc signalée en note sans être résolue dogmatiquement.
translation_notes:
  register: Français moderne, international et digne. La syntaxe interrogative reste naturelle, la métaphore de la racine est conservée et la difficulté textuelle est explicitement signalée.
