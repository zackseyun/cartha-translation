  text: תִּֽ֭עֲבוּ/נִי כָּל מְתֵ֣י סוֹדִ֑/י וְ/זֶֽה אָ֝הַ֗בְתִּי נֶהְפְּכוּ בִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/019.yaml
  text: All my intimate friends abhor me[a], and those whom I loved have turned against me.
translation:
  language: fr
  text: Tous mes intimes m’ont en horreur[a], et ceux que j’aimais se sont retournés contre moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les hommes de mon cercle confidentiel » ou « de mon conseil secret ». L’expression désigne les proches auxquels Job accordait sa confiance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: m’ont en horreur
  rationale: Le verbe תעב exprime une vive répulsion, bien plus forte qu’une simple antipathie. « Avoir en horreur » en conserve l’intensité dans un français naturel et digne.
- source_word: כָּל
  choice: tous
  rationale: Le quantificateur est inclusif et porte ici sur l’ensemble des proches de Job.
- source_word: מְתֵי סוֹדִי
  choice: mes intimes
  rationale: L’expression désigne littéralement les hommes de son cercle confidentiel, ceux qui partagent ses conseils ou ses secrets. « Mes intimes » rend naturellement cette proximité et cette confiance.
- source_word: וְזֶה אָהַבְתִּי
  choice: et ceux que j’aimais
  rationale: Bien que זֶה soit formellement singulier, le verbe pluriel qui suit et le parallélisme indiquent ici un référent collectif. La formulation française respecte ce sens sans imposer un singulier artificiel.
- source_word: נֶהְפְּכוּ בִי
  choice: se sont retournés contre moi
  rationale: Le niphal de הפך exprime un renversement d’attitude ou d’allégeance, et בִי prend dans ce contexte une valeur hostile. Cette tournure française restitue clairement les deux éléments.
