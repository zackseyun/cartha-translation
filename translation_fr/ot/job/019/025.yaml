source:
  edition: WLC
  text: וַ/אֲנִ֣י יָ֭דַעְתִּי גֹּ֣אֲלִ/י חָ֑י וְ֝/אַחֲר֗וֹן עַל עָפָ֥ר יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/025.yaml
  text: But as for me[a], I know that my Redeemer lives[c][b], and afterward he will rise over the dust.
translation:
  language: fr
  text: Mais moi, je sais que mon rédempteur[a] est vivant et qu’ensuite il se lèvera au-dessus de la poussière[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui me défend ». Le mot hébreu גֹּאֵל peut désigner celui qui intervient pour racheter un proche, défendre sa cause ou faire reconnaître son droit.
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « et à la fin il se tiendra sur la terre » ou « et, comme le dernier, il se tiendra au-dessus de la poussière ». Le texte hébreu de cette proposition est difficile. « Poussière » peut évoquer la mortalité, la tombe ou la terre ; le mot hébreu signifie littéralement « poussière ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction jointe au pronom indépendant marque ici une affirmation personnelle emphatique et contrastive.
- source_word: יָדַעְתִּי
  choice: je sais
  rationale: L’accompli exprime une conviction établie ayant une portée présente; le présent français la rend naturellement.
- source_word: גֹּאֲלִי
  choice: mon rédempteur
  rationale: Le terme désigne celui qui rachète, défend ou fait valoir le droit d’un proche. « Rédempteur » conserve cette ampleur ainsi que la résonance traditionnelle, sans identifier plus précisément la figure.
- source_word: חָי
  choice: est vivant
  rationale: Cette formulation française rend directement et naturellement l’adjectif prédicatif hébreu.
- source_word: וְאַחֲרוֹן
  choice: et qu’en dernier lieu
  rationale: אַחֲרוֹן peut être compris adverbialement (« en dernier lieu », « à la fin ») ou substantivement (« comme le dernier »). Le choix retient la lecture adverbiale tout en laissant ouverte sa portée temporelle exacte.
- source_word: עַל
  choice: au-dessus de
  rationale: La préposition peut signifier « sur », « au-dessus de » ou « contre ». « Au-dessus de » préserve une nuance spatiale possible sans assimiler la poussière à la terre.
- source_word: עָפָר
  choice: la poussière
  rationale: Traduction littérale qui conserve l’image hébraïque et n’impose pas l’interprétation « tombe » ou « terre ».
- source_word: יָקוּם
  choice: il se lèvera
  rationale: קום peut signifier se lever, surgir ou se tenir debout. « Se lèvera » conserve cette dynamique sans imposer exclusivement une scène judiciaire ou une résurrection.
theological_decisions:
- issue: Identité et fonction du גֹּאֵל de Job
  choice: « mon rédempteur », sans préciser s’il s’agit directement de Dieu, d’un témoin céleste ou d’une figure messianique
  alternative: « celui qui me défend » / « mon défenseur »
  rationale: L’hébreu ne nomme pas explicitement cette figure. La traduction garde la résonance théologique du terme tout en évitant de résoudre une ambiguïté réelle.
- issue: Portée eschatologique de וְאַחֲרוֹן ... יָקוּם
  choice: « en dernier lieu il se lèvera au-dessus de la poussière »
  alternative: « à la fin il se tiendra sur la terre » ou « comme le dernier, il se tiendra au-dessus de la poussière »
  rationale: La syntaxe et la portée théologique de la proposition sont disputées. Le texte principal reste proche des éléments hébreux sans transformer la phrase en déclaration explicitement développée sur la résurrection.
translation_notes:
  register: Français international moderne, digne et accessible. « Rédempteur » conserve la portée juridique, familiale et théologique du terme, tandis que la note fournit une formulation plus courante. La proposition finale maintient volontairement l’ambiguïté lexicale, syntaxique et théologique de l’hébreu.
