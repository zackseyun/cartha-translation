source:
  edition: WLC
  text: גּ֤וּרוּ לָ/כֶ֨ם מִ/פְּנֵי חֶ֗רֶב כִּֽי חֵ֭מָה עֲוֺנ֣וֹת חָ֑רֶב לְמַ֖עַן תֵּדְע֣וּ/ן ש/דין׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/019/029.yaml
  text: Be afraid of the sword yourselves[a], for wrath brings the punishments of the sword, so that you may know that there is judgment.
translation:
  language: fr
  text: Quant à vous, redoutez l’épée, car la fureur entraîne les châtiments de l’épée, afin que vous sachiez qu’il y a un jugement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que le Tout-Puissant existe ». L’expression hébraïque finale est difficile ; elle a aussi été comprise comme « qu’il y a des jugements » ou « qu’il y a un juge ».
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּרוּ לָכֶם
  choice: Vous-mêmes, redoutez
  rationale: L’impératif pluriel de גור exprime ici une vive mise en garde. « Redoutez » conserve cette force, tandis que « vous-mêmes » rend l’insistance du pronom datif לָכֶם.
- source_word: מִפְּנֵי חֶרֶב
  choice: l’épée
  rationale: 'Après « redoutez », la locution prépositionnelle se rend naturellement par un complément direct en français : « redoutez l’épée ».'
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’avertissement.
- source_word: חֵמָה
  choice: la fureur
  rationale: Le nom désigne une colère brûlante et intense. « Fureur » garde cette vigueur sans préciser explicitement si elle est humaine ou divine.
- source_word: עֲוֺנוֹת חָרֶב
  choice: les châtiments de l’épée
  rationale: עָוֹן peut désigner la faute, mais aussi sa conséquence punitive. Dans ce contexte de menace et de jugement, « châtiments » donne un sens cohérent à l’expression concise liée à l’épée.
- source_word: לְמַעַן תֵּדְעוּן
  choice: afin que vous sachiez
  rationale: לְמַעַן introduit le but, et l’imparfait pluriel exprime ce que les interlocuteurs doivent être amenés à reconnaître.
- source_word: שדין
  choice: qu’il y a un jugement
  rationale: L’expression finale est difficile. Une lecture centrée sur le jugement correspond bien à l’avertissement immédiat, sans identifier plus précisément le juge ni transformer le terme en titre divin.
theological_decisions:
- issue: Interprétation de l’expression finale difficile שדין
  choice: qu’il y a un jugement
  alternative: que le Tout-Puissant existe ; qu’il y a des jugements ; qu’il y a un juge
  rationale: La forme hébraïque permet plusieurs analyses anciennes ou proposées. Le contexte favorise l’idée d’un jugement auquel les amis de Job pourraient eux-mêmes être exposés, mais les autres lectures restent assez importantes pour être signalées sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Redoutez » et « châtiments » maintiennent la gravité judiciaire du verset ; l’ordre « Vous-mêmes » reproduit l’insistance adressée aux interlocuteurs.
