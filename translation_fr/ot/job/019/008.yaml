id: JOB.19.8
reference: Job 19:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָרְחִ֣/י גָ֭דַר וְ/לֹ֣א אֶעֱב֑וֹר וְ/עַ֥ל נְ֝תִיבוֹתַ֗/י חֹ֣שֶׁךְ יָשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/008.yaml
  text: He has walled up my way so that I cannot pass[a], and he has set darkness upon my paths.
translation:
  language: fr
  text: Il a muré mon chemin, si bien que je ne peux pas passer[a] ; il a étendu les ténèbres sur mes sentiers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet est implicite en hébreu. Dans le contexte, Job parle de Dieu, bien que le verset dise seulement « il ».
    reason: alternative_reading
lexical_decisions:
- source_word: אָרְחִי
  choice: mon chemin
  rationale: Le nom désigne une route, un chemin ou le cours suivi. « Mon chemin » reste concret tout en permettant le sens figuré du cours de la vie de Job.
- source_word: גָדַר
  choice: a muré
  rationale: Le verbe évoque l’action de fermer au moyen d’un mur ou d’une clôture. « A muré » conserve cette image forte d’un passage rendu impraticable.
- source_word: וְלֹא אֶעֱבוֹר
  choice: si bien que je ne peux pas passer
  rationale: Cette formulation naturelle en français exprime le résultat de l’obstruction. « Passer » rend directement le verbe עבר.
- source_word: נְתִיבוֹתַי
  choice: mes sentiers
  rationale: Le pluriel hébreu désigne des pistes ou des sentiers. « Mes sentiers » préserve le pluriel et la variation poétique avec « mon chemin ».
- source_word: חֹשֶׁךְ
  choice: les ténèbres
  rationale: Le nom signifie l’obscurité ou les ténèbres. « Les ténèbres » convient au registre poétique et conserve les dimensions concrète et métaphorique de l’image.
- source_word: יָשִׂים
  choice: a étendu
  rationale: Le verbe signifie littéralement mettre ou placer. Avec « les ténèbres » et « sur mes sentiers », « a étendu » produit une image naturelle en français sans réduire la proposition à « a obscurci ».
theological_decisions:
- issue: Référent du sujet masculin singulier implicite
  choice: Il
  alternative: Dieu / le Seigneur
  rationale: Le sujet n’est pas exprimé en hébreu. Le contexte indique que Job parle de Dieu, mais le verset ne le nomme pas ; le pronom préserve donc l’implicite et le mouvement littéraire.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme entre « mon chemin » et « mes sentiers » est conservé, ainsi que les images concrètes du mur et des ténèbres.
