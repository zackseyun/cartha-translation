- source_word: אִיּוֹב
  choice: Job
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante.
- source_word: וַיֹּאמַר
  choice: ':'
  rationale: Le verbe אמר signifie littéralement « dire », mais la tournure hébraïque « répondit et dit » est peu naturelle en français. Les deux-points introduisent directement les paroles tout en conservant la fonction discursive du verbe.
- source_word: וַ
  choice: Alors
  rationale: Le waw narratif marque ici la progression du dialogue ; « Alors » la rend naturellement sans reproduire mécaniquement « Et ».
