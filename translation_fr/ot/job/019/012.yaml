review_pass:
  verdict: revise
  source_fidelity: Le sens global et l’imagerie militaire sont bien rendus. Toutefois, « elles construisent leur voie » est peu idiomatique en français et ne rend pas avec assez de naturel le verbe סלל, qui évoque le fait de tracer, de préparer ou d’élever une voie d’approche. « Se frayent un chemin » restitue clairement l’avancée hostile tout en laissant la note expliciter la possible image d’une route surélevée ou d’une rampe de siège.
  naturalness: « Ses troupes arrivent toutes ensemble » est plus fluide que l’antéposition « Toutes ensemble, ses troupes arrivent ». « Se frayent un chemin » est une collocation française naturelle dans ce contexte poétique et militaire. Le présent, « campent » et « tout autour de ma tente » conviennent au registre moderne et à la vivacité du verset.
  terminology: « Troupes », « tente » et « contre moi » sont appropriés. Le pronom « ses » conserve correctement l’ambiguïté formelle du référent, sans explicitation théologique indue. La note maintient l’alternative lexicale relative à סלל.
  issues:
  - severity: medium
    issue: 'Collocation peu naturelle : « elles construisent leur voie »'
    rationale: En français moderne, on ne dit guère qu’une armée « construit sa voie ». Cette formulation paraît calquée et affaiblit l’image d’une progression hostile. « Elles se frayent un chemin » est idiomatique et fidèle au mouvement décrit ; la note conserve l’image plus technique de la voie élevée ou de la rampe.
  - severity: low
    issue: 'Ordre des mots légèrement lourd : « Toutes ensemble, ses troupes arrivent »'
    rationale: La place finale de l’adverbe, « Ses troupes arrivent toutes ensemble », est plus naturelle et ne modifie pas le sens de יחד.
