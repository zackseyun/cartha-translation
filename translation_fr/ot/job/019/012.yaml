  text: יַ֤חַד יָ֘בֹ֤אוּ גְדוּדָ֗י/ו וַ/יָּסֹ֣לּוּ עָלַ֣/י דַּרְכָּ֑/ם וַ/יַּחֲנ֖וּ סָבִ֣יב לְ/אָהֳלִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/012.yaml
  text: Together his troops come; they build up their road against me[a], and they camp all around my tent.
translation:
  language: fr
  text: Ses troupes arrivent toutes ensemble ; elles se frayent un chemin contre moi[a] et campent tout autour de ma tente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elles construisent ou élèvent leur route contre moi » ; le verbe hébreu peut évoquer l’aménagement d’une voie surélevée ou d’une rampe de siège.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Toutes ensemble
  rationale: L’adverbe exprime une action collective ou simultanée ; cette tournure souligne naturellement l’assaut coordonné.
- source_word: יָבֹאוּ
  choice: arrivent
  rationale: Le verbe בוא signifie venir ou arriver ; le présent rend ici la vivacité de la description poétique.
- source_word: גְדוּדָיו
  choice: ses troupes
  rationale: גְּדוּד désigne une troupe ou une bande armée. « Troupes » conserve clairement l’image militaire sans préciser indûment leur nature ou leur taille.
- source_word: וַיָּסֹלּוּ
  choice: elles construisent
  rationale: Le verbe סלל évoque l’aménagement ou l’élévation d’une route, voire d’une rampe de siège. « Construisent » est clair dans le texte principal, tandis que la note préserve l’éventail de l’image.
- source_word: עָלַי
  choice: contre moi
  rationale: La préposition signifie littéralement « sur moi », mais le contexte d’attaque lui donne ici une valeur hostile que « contre moi » exprime naturellement.
- source_word: דַּרְכָּם
  choice: leur voie
  rationale: דֶּרֶךְ peut désigner une voie, une route ou un chemin. « Voie » reste concret tout en préservant l’ambiguïté entre une route d’accès et un ouvrage de siège.
- source_word: וַיַּחֲנוּ
  choice: campent
  rationale: Le verbe חנה signifie camper ou établir son camp ; « campent » convient au registre actuel et maintient le cadre militaire.
- source_word: סָבִיב
  choice: tout autour
  rationale: Le mot indique l’encerclement de tous côtés ; « tout autour » en rend naturellement la force.
- source_word: לְאָהֳלִי
  choice: de ma tente
  rationale: אֹהֶל désigne littéralement une tente, qui peut aussi représenter l’habitation ou la maisonnée. Le choix concret conserve l’image hébraïque.
theological_decisions:
- issue: Référent du suffixe masculin singulier dans גְדוּדָיו (« ses troupes »)
  choice: Conserver le pronom « ses », dont le contexte immédiat permet de rapporter le référent à Dieu.
  alternative: Rendre explicitement « les troupes de Dieu » ou comprendre un chef ennemi non précisé dans la métaphore.
  rationale: Job présente dans le contexte l’action de Dieu sous les traits d’un assaut militaire. Maintenir le pronom respecte toutefois la formulation hébraïque sans expliciter davantage que le texte.
translation_notes:
  register: 'Français international moderne, poétique et digne. La syntaxe conserve la progression militaire du verset : arrivée coordonnée, construction d’une voie d’approche, puis encerclement de la tente.'
