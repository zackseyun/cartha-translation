id: JOB.19.13
reference: Job 19:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַ֭חַ/י מֵ/עָלַ֣/י הִרְחִ֑יק וְ֝/יֹדְעַ֗/י אַךְ זָ֥רוּ מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/013.yaml
  text: He has driven my brothers far from me[b][a], and those who know me are wholly estranged from me.
translation:
  language: fr
  text: Il a éloigné mes frères de moi[a], et ceux qui me connaissent me sont devenus tout à fait étrangers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il a tenu mes frères loin de moi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux qui me connaissent sont devenus des étrangers pour moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: mes frères
  rationale: Le masculin pluriel avec suffixe de première personne signifie littéralement « mes frères ». Dans ce contexte, le terme peut s’étendre aux proches parents, mais « mes frères » préserve au mieux la forme et la force sociale de l’hébreu.
- source_word: מֵעָלַי
  choice: de moi
  rationale: Avec הִרְחִיק, la locution exprime l’éloignement hors de la présence ou de la sphère de Job. « Éloigner de moi » est naturel en français.
- source_word: הִרְחִיק
  choice: a éloigné
  rationale: Le hiphil parfait de רחק signifie « faire devenir lointain, éloigner ». Cette formulation conserve la valeur causative sans ajouter une violence que le verbe n’impose pas nécessairement.
- source_word: וְיֹדְעַי
  choice: ceux qui me connaissent
  rationale: L’expression signifie littéralement « ceux qui me connaissent » et désigne les personnes familières de Job. Ce rendu demeure transparent et plus vivant que « mes connaissances ».
- source_word: אַךְ
  choice: tout à fait
  rationale: Ici, la particule renforce le prédicat et souligne le caractère complet de la rupture relationnelle.
- source_word: זָרוּ
  choice: me sont devenus ... étrangers
  rationale: Le parfait exprime ici le fait de devenir ou de se comporter en étrangers. Ce choix garde l’image concrète de l’hébreu et sa valeur résultative.
- source_word: מִמֶּנִּי
  choice: me sont ... étrangers
  rationale: La préposition מן marque la séparation d’avec Job. La construction idiomatique française « être devenu étranger à quelqu’un », avec le pronom « me », rend cette rupture relationnelle sans lourdeur.
theological_decisions:
- issue: Sujet implicite de הִרְחִיק
  choice: Le pronom « Il » conserve le sujet masculin singulier non nommé, que le contexte rapporte à Dieu.
  alternative: 'Nommer explicitement Dieu : « Dieu a éloigné de moi mes frères. »'
  rationale: L’hébreu n’énonce pas le nom du sujet dans ce verset. « Il » respecte cette économie tout en préservant la tension du discours où Job attribue son isolement à l’action divine.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « moi/me » conserve l’insistance personnelle de la plainte. Les deux propositions restent parallèles, tandis que « devenus étrangers » préserve l’image relationnelle forte du texte hébreu.
