  text: עַד אָ֭נָה תּוֹגְי֣וּ/ן נַפְשִׁ֑/י וּֽ/תְדַכְּאוּ/נַ֥נִי בְ/מִלִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/002.yaml
  text: How long will you torment me and crush me with words?[a]
translation:
  language: fr
  text: Jusqu’à quand me tourmenterez-vous et m’écraserez-vous par vos paroles ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jusqu’à quand affligerez-vous mon âme et m’écraserez-vous par vos paroles ? »'
    reason: Alternative lexicale qui conserve explicitement נַפְשִׁי, « mon âme », et rend תּוֹגְיוּן par « affligerez ».
lexical_decisions:
- source_word: עַד אָ֭נָה
  choice: Jusqu’à quand
  rationale: Formule interrogative naturelle en français, qui conserve la force de la plainte temporelle hébraïque.
- source_word: תּוֹגְיוּן
  choice: me tourmenterez-vous
  rationale: Le hifil du verbe יגה exprime ici la souffrance intérieure que les interlocuteurs infligent à Job. « Tourmenter » rend avec force cette détresse prolongée.
- source_word: נַפְשִׁי
  choice: me
  rationale: נֶפֶשׁ désigne ici Job lui-même, particulièrement dans son être intérieur. Le pronom « me » évite une lecture indûment dualiste tout en restant idiomatique.
- source_word: וּתְדַכְּאוּנַנִי
  choice: et m’écraserez-vous
  rationale: Le verbe דכא évoque l’action d’écraser ou d’abattre. « Écraser » préserve l’image violente et le parallélisme du verset.
- source_word: בְמִלִּים
  choice: par vos paroles
  rationale: Le beth indique le moyen employé. « Par vos paroles » précise naturellement en français que les paroles des interlocuteurs sont l’instrument de l’écrasement.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. La formulation garde la question rhétorique, le parallélisme et la violence métaphorique de l’hébreu sans donner à « âme » un sens technique absent du contexte.
