  text: whom I myself will see for myself[a], and my eyes will see, and not another[b]. My kidneys fail within my bosom.
translation:
  language: fr
  text: celui que je verrai moi-même, pour moi[a] ; mes yeux le verront, et non un autre[b]. Mes reins se consument au-dedans de moi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de mon côté ». Le sens de l’expression hébraïque est incertain.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et non un étranger ». Le sens peut être : « je le verrai moi-même, et non quelqu’un d’autre ».'
    reason: lexical_alternative
  - marker: c
    text: Dans la pensée hébraïque, les reins pouvaient représenter l’être intérieur et le siège des émotions profondes.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: celui que
  rationale: Le relatif renvoie à la personne évoquée au verset précédent et fonctionne comme complément direct de « je verrai ».
- source_word: אֲנִי
  choice: moi-même
  rationale: Le pronom indépendant, en plus de la personne déjà marquée par le verbe, souligne que Job le verra personnellement.
- source_word: אֶחֱזֶה
  choice: je verrai
  rationale: חזה exprime le fait de voir ou de contempler, parfois avec une nuance élevée ou visionnaire ; « verrai » reste naturel et ne précise pas indûment la nature de cette vision.
- source_word: לִּי
  choice: pour moi
  rationale: Ce datif difficile peut exprimer l’intérêt personnel ou l’appropriation. La traduction le conserve sans imposer le sens judiciaire « de mon côté ».
- source_word: וְעֵינַי רָאוּ
  choice: mes yeux le verront
  rationale: Le parfait est compris dans le parallélisme avec l’imparfait précédent et rendu au futur ; l’ajout de « le » explicite en français l’objet déjà donné par le relatif.
- source_word: וְלֹא זָר
  choice: et non ceux d’un autre
  rationale: זָר signifie littéralement « étranger », mais peut désigner ici une autre personne. La formulation française relie naturellement le contraste à « mes yeux » tout en maintenant l’idée que Job, et non quelqu’un d’autre, verra.
- source_word: כָּלוּ
  choice: se consument
  rationale: כלה décrit ici l’épuisement ou le dépérissement sous l’effet d’une attente intense ; « se consument » conserve la force poétique et l’aspect inaccompli du désir.
- source_word: כִלְיֹתַי
  choice: mes reins
  rationale: Le terme désigne littéralement les reins, considérés en hébreu comme le siège des émotions profondes ; l’image corporelle est conservée et expliquée en note.
- source_word: בְּחֵקִי
  choice: au-dedans de moi
  rationale: חֵיק signifie littéralement « sein, giron ». Ici, la locution situe l’émotion dans l’intériorité de Job ; cette formulation est plus naturelle en français moderne que « dans mon sein ».
theological_decisions:
- issue: Nature de la vision attendue par Job
  choice: Présenter cette vision comme personnelle et future, sans préciser ses modalités.
  alternative: Y voir explicitement une résurrection corporelle, une justification avant la mort ou une vision de Dieu après la mort.
  rationale: L’hébreu insiste sur le fait que Job lui-même verra la personne évoquée, mais ce verset ne tranche pas à lui seul entre les principales interprétations théologiques.
- issue: Sens du datif לִי
  choice: « pour moi », avec une note signalant l’incertitude.
  alternative: « de mon côté », au sens d’un défenseur favorable à Job.
  rationale: La valeur du datif est débattue. Le rendre sans développement judiciaire préserve l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le texte conserve l’insistance sur l’expérience personnelle de Job et l’image concrète des « reins », tout en évitant l’expression vieillie « dans mon sein ». Les notes maintiennent les ambiguïtés de לִי et de זָר.
