source:
  edition: WLC
  text: דְּֽעוּ אֵ֭פוֹ כִּי אֱל֣וֹהַּ עִוְּתָ֑/נִי וּ֝/מְצוּד֗/וֹ עָלַ֥/י הִקִּֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/006.yaml
  text: Know then that God has wronged me and has surrounded me with his net[a][b].
translation:
  language: fr
  text: Sachez donc que Dieu m’a traité injustement[a] et qu’il m’a entouré de son filet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « m’a fait tort » ou « a faussé le droit à mon détriment ». Le verbe hébreu peut évoquer le fait de tordre ou de fausser ce qui est droit.
    reason: lexical_alternative
  - marker: b
    text: Ou « son piège » ou « son filet de chasse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ
  choice: Sachez
  rationale: 'Impératif pluriel de ידע : Job appelle directement ses interlocuteurs à reconnaître ce qu’il affirme comme un fait.'
- source_word: אֵפוֹ
  choice: donc
  rationale: Particule discursive qui souligne la conclusion ou l’inférence dans l’argumentation.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Titre divin singulier courant dans Job, sans précision supplémentaire telle que « le Tout-Puissant ».
- source_word: עִוְּתָנִי
  choice: m’a fait injustice
  rationale: Le verbe עות évoque l’action de tordre ou de fausser ce qui est droit, d’où l’idée de traiter injustement. Cette formulation française garde la force judiciaire et morale de l’accusation de Job.
- source_word: מְצוּדוֹ
  choice: son filet
  rationale: Le nom désigne un filet ou un piège de chasse. « Filet » conserve clairement l’image concrète.
- source_word: עָלַי הִקִּיף
  choice: m’a encerclé de
  rationale: Le verbe signifie entourer ou encercler. La tournure choisie exprime naturellement en français l’image de Dieu refermant son filet autour de Job.
theological_decisions:
- issue: L’accusation portée par Job contre Dieu
  choice: Conserver l’affirmation directe selon laquelle Dieu lui « a fait injustice ».
  alternative: « Dieu m’a affligé » ou « Dieu s’est retourné contre moi »
  rationale: Le verbe hébreu a une forte portée morale et judiciaire. Il convient de préserver la tension du discours de Job sans atténuer son accusation ni la présenter pour autant comme une conclusion doctrinale du livre.
translation_notes:
  register: Français international moderne, direct et digne. « Sachez donc » garde la vigueur argumentative de l’impératif pluriel. « M’a fait injustice » préserve délibérément la dureté de l’accusation de Job, tandis que « encerclé de son filet » maintient l’image de chasse du texte hébreu.
