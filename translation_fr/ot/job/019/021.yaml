  text: חָנֻּ֬/נִי חָנֻּ֣/נִי אַתֶּ֣ם רֵעָ֑/י כִּ֥י יַד אֱ֝ל֗וֹהַּ נָ֣גְעָה בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/021.yaml
  text: Have pity on me[a], have pity on me, you my friends[b], for the hand of God has struck me.
translation:
  language: fr
  text: Ayez pitié de moi[a], ayez pitié de moi, vous, mes amis, car la main de Dieu m’a frappé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Accordez-moi votre grâce » ou « Faites-moi miséricorde ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « m’a touché ». Dans ce contexte, l’expression évoque une atteinte douloureuse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֻּנִי
  choice: Ayez pitié de moi
  rationale: L’impératif pluriel de חנן s’adresse aux amis de Job. Dans ce contexte, « Ayez pitié de moi » exprime naturellement son appel à la compassion, tout en gardant la force de la supplication.
- source_word: חָנֻּנִי (répété)
  choice: ayez pitié de moi
  rationale: La répétition est conservée afin de rendre l’urgence affective et l’intensification poétique de l’appel de Job.
- source_word: רֵעָי
  choice: vous, mes amis
  rationale: רֵעַ désigne couramment un ami ou un compagnon. La tournure conserve l’adresse directe et souligne que Job fait appel à ceux dont il attend de la compassion.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la supplication. « Car » convient au registre poétique et soutenu tout en restant courant.
- source_word: יַד אֱלוֹהַּ
  choice: la main de Dieu
  rationale: Cette expression hébraïque désigne métaphoriquement l’action ou la puissance divine. La traduction garde l’image au lieu de l’expliciter.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: אֱלוֹהַּ est une forme poétique singulière désignant Dieu, particulièrement fréquente dans Job. Rien ici ne justifie une amplification telle que « le Dieu tout-puissant ».
- source_word: נָגְעָה בִּי
  choice: m’a frappé
  rationale: נגע avec ב peut signifier toucher, atteindre, frapper ou affliger. Dans le contexte des souffrances de Job, « m’a frappé » communique clairement l’atteinte douloureuse tout en restant concret.
theological_decisions:
- issue: L’action de Dieu dans la souffrance de Job
  choice: la main de Dieu m’a frappé
  alternative: la main de Dieu m’a touché / atteint
  rationale: L’hébreu attribue explicitement la souffrance de Job à l’action divine au moyen d’une image. La formulation retenue préserve cette tension théologique sans l’atténuer ni l’expliquer.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition, l’adresse directe aux amis et la métaphore de la main divine sont conservées. Les notes signalent l’étendue sémantique de חנן et le sens littéral de נגע sans affaiblir le texte principal.
