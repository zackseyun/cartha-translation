source:
  edition: WLC
  text: וַ/יַּ֣חַר עָלַ֣/י אַפּ֑/וֹ וַ/יַּחְשְׁבֵ֖/נִי ל֣/וֹ כְ/צָרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/011.yaml
  text: His anger burns against me[a], and he counts me as his enemies.
translation:
  language: fr
  text: Sa colère s’est enflammée contre moi, et il me considère comme l’un de ses ennemis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחַר
  choice: s’est enflammée
  rationale: Avec אַף, le verbe חרה forme une expression évoquant une colère qui s’allume ou s’embrase. Le passé composé respecte la forme narrative hébraïque tout en restant naturel en français moderne.
- source_word: עָלַי
  choice: contre moi
  rationale: Avec un terme exprimant la colère, עַל marque ici l’orientation hostile de celle-ci.
- source_word: אַפּוֹ
  choice: sa colère
  rationale: אַף signifie littéralement « nez », puis, par extension, « colère ». Dans cette expression, le sens figuré est clairement visé.
- source_word: וַיַּחְשְׁבֵנִי
  choice: il me considère
  rationale: חשב signifie ici tenir ou regarder quelqu’un pour quelque chose. « Considère » est courant, précis et digne en français.
- source_word: לוֹ
  choice: ses
  rationale: 'Le pronom datif exprime la relation ou le point de vue : Job est rangé, aux yeux de Dieu, parmi ceux qui sont ses ennemis. Le possessif français rend naturellement cette relation.'
- source_word: כְצָרָיו
  choice: comme l’un de ses ennemis
  rationale: צָר désigne un ennemi ou un adversaire. La formulation française « l’un de ses ennemis » conserve le pluriel du texte source tout en évitant l’expression peu naturelle « me considère comme ses ennemis ».
theological_decisions:
- issue: Référent du sujet à la troisième personne et des suffixes
  choice: Le sujet demeure Dieu, conformément au contexte de la plainte de Job en 19.6-12.
  alternative: Un agent hostile non précisé.
  rationale: Le contexte attribue ces actes à Dieu. La traduction conserve donc sans l’atténuer la vive tension théologique de la plainte de Job.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore de la colère qui s’enflamme est conservée. La syntaxe explicite « l’un de » pour rendre idiomatiquement en français l’attribution d’un individu à un groupe pluriel.
