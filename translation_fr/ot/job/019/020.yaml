  yaml_path: translation/ot/job/019/020.yaml
  text: My bone clings to my skin and to my flesh[b][a], and I have escaped with the skin of my teeth.
translation:
  language: fr
  text: Mes os collent à ma peau et à ma chair[a], et je m’en suis tiré avec la peau de mes dents[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mon os colle ». Le singulier hébreu désigne probablement l’ossature de Job dans son ensemble.'
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque à l’image insolite, qui évoque probablement le fait de s’en tirer de justesse.
    reason: idiom_explanation
lexical_decisions:
- source_word: בְּעוֹרִי וּבִבְשָׂרִי
  choice: à ma peau et à ma chair
  rationale: Avec דבק, la préposition ב est rendue naturellement en français par « à ». « Peau » et « chair » conservent le parallélisme corporel concret de l’hébreu.
- source_word: דָּבְקָה עַצְמִי
  choice: Mes os collent
  rationale: L’hébreu emploie « mon os » au singulier, probablement dans un sens collectif. Le pluriel français exprime clairement l’extrême amaigrissement de Job, tandis qu’une note signale la forme exacte du texte source.
- source_word: וָאֶתְמַלְּטָה
  choice: je m’en suis tiré
  rationale: Le verbe מלט exprime ici le fait d’échapper ou de survivre. « Je m’en suis tiré » est naturel en français et convient à la survie précaire décrite dans le contexte.
- source_word: בְּעוֹר שִׁנָּי
  choice: avec la peau de mes dents
  rationale: La formulation conserve l’image hébraïque frappante et énigmatique. Comme cette expression n’est pas un idiome courant en français, son sens probable est expliqué en note sans être imposé dans le corps du texte.
