  yaml_path: translation/ot/job/019/003.yaml
  text: These ten times you have humiliated me[a]; you are not ashamed to wrong me.
translation:
  language: fr
  text: Voilà dix fois que vous m’humiliez ; vous n’avez pas honte de me traiter en étranger[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de me faire du tort » ou « d’agir durement envers moi ». Le verbe hébreu est difficile et peut évoquer le fait de traiter Job comme un étranger, quelqu’un qu’on ne reconnaît pas.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: Voilà dix fois
  rationale: Cette tournure française naturelle conserve le nombre et la force rhétorique de l’expression hébraïque, où « dix fois » peut désigner un grand nombre de répétitions.
- source_word: תַּכְלִימוּנִי
  choice: vous m’humiliez
  rationale: Le hifil de כלם exprime le fait de couvrir quelqu’un de honte ou de l’humilier ; le présent français convient à l’action répétée dénoncée par Job.
- source_word: לֹא תֵבֹשׁוּ
  choice: vous n’avez pas honte
  rationale: Cette formulation courante et digne rend directement l’absence de honte reprochée aux interlocuteurs.
- source_word: תַּהְכְּרוּ לִי
  choice: me traiter en étranger
  rationale: Le verbe נכר au hifil est difficile ici. Ce choix conserve son image fondamentale d’une conduite envers Job comme s’il était étranger ou méconnu, sans réduire le sens à une simple offense.
theological_decisions: []
