  text: אִם אָ֭מְנָם עָלַ֣/י תַּגְדִּ֑ילוּ וְ/תוֹכִ֥יחוּ עָ֝לַ֗/י חֶרְפָּתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/005.yaml
  text: If indeed you magnify yourselves against me and prove my disgrace against me[b][a],
translation:
  language: fr
  text: Si vraiment vous vous élevez contre moi[a] et faites de mon déshonneur un argument contre moi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous vous faites grands à mes dépens ». Le verbe hébreu peut désigner le fait de se faire grand ou de s’élever face à quelqu’un, à son détriment.
    reason: lexical_alternative
  - marker: b
    text: Ou « établissez ma honte contre moi » ou « faites valoir mon déshonneur contre moi ». Le verbe hébreu peut avoir le sens judiciaire de prouver, d’établir ou de faire valoir un élément dans une accusation.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אָמְנָם
  choice: Si vraiment
  rationale: אִם introduit la condition et אָמְנָם la renforce. « Si vraiment » rend naturellement cette condition appuyée en français moderne.
- source_word: עָלַי
  choice: à mes dépens / contre moi
  rationale: La préposition marque ici une relation hostile. Avec le premier verbe, « à mes dépens » explicite l'idée de supériorité recherchée sur Job; avec le second, « contre moi » convient au contexte de controverse.
- source_word: תַּגְדִּילוּ
  choice: vous vous grandissez
  rationale: Le hiphil de גדל exprime ici le fait de se faire grand ou de s'élever par rapport à quelqu'un. Cette formulation conserve l'image verbale sans imposer le sens plus précis de « vous vanter ».
- source_word: וְתוֹכִיחוּ
  choice: invoquez … contre moi
  rationale: Le hiphil de יכח peut signifier argumenter, établir ou faire valoir dans un cadre quasi judiciaire. « Invoquer … contre moi » rend l'idée d'utiliser le déshonneur de Job comme élément à charge tout en préservant l'ambiguïté du verbe.
- source_word: חֶרְפָּתִי
  choice: mon déshonneur
  rationale: חֶרְפָּה désigne l'opprobre, la honte ou le déshonneur social. « Déshonneur » est actuel et convient à ce qui est retourné contre Job.
