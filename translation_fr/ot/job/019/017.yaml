  text: ר֭וּחִֽ/י זָ֣רָה לְ/אִשְׁתִּ֑/י וְ֝/חַנֹּתִ֗י לִ/בְנֵ֥י בִטְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/017.yaml
  text: My breath is repulsive to my wife[b][a], and I am loathsome to the sons of my own body.
translation:
  language: fr
  text: Mon haleine répugne à ma femme, et je suis odieux aux fils de mes entrailles[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils de mon ventre ». L’expression peut désigner les propres enfants de Job ou, plus généralement, ses proches parents de sang.'
    reason: cultural_note
  - marker: b
    text: 'Autre compréhension possible de l’hébreu difficile : « et ma supplication s’adresse aux fils de mes entrailles » ou « j’implore la faveur des fils de mes entrailles ».'
    reason: alternative_reading
lexical_decisions:
- source_word: רוּחִי
  choice: mon haleine
  rationale: רוּחַ peut désigner le souffle, le vent ou l’esprit. Ici, la réaction de l’épouse et le contexte corporel de la souffrance de Job favorisent le sens concret d’« haleine ».
- source_word: זָרָה
  choice: répugne
  rationale: Le terme exprime littéralement ce qui est étrange ou étranger et, dans ce contexte relationnel, ce qui provoque l’aversion. « Répugne à » rend naturellement cette force en français.
- source_word: לְאִשְׁתִּי
  choice: à ma femme
  rationale: La préposition ל indique ici la personne affectée; « répugner à quelqu’un » est l’expression française naturelle.
- source_word: וְחַנֹּתִי
  choice: et je suis odieux
  rationale: La forme hébraïque est difficile. Cette traduction suit l’interprétation exprimant la répulsion, en parallèle avec le premier membre, tout en signalant en note l’analyse possible comme supplication ou appel à la compassion.
- source_word: לִבְנֵי
  choice: aux fils de
  rationale: בנים signifie littéralement « fils ». Le maintien de ce terme préserve la forme de l’expression hébraïque, dont la portée exacte est expliquée en note.
- source_word: בִטְנִי
  choice: mon propre corps
  rationale: בטן désigne littéralement le ventre ou les entrailles. Dans cette expression de parenté, « mon propre corps » conserve l’image corporelle tout en restant intelligible en français.
theological_decisions:
- issue: Identité des « fils de mon propre corps »
  choice: Conserver l’expression littérale dans le texte et laisser ouverte son identification
  alternative: Traduire directement par « mes enfants » ou « mes proches parents »
  rationale: Le syntagme peut viser les enfants de Job ou, plus largement, ses proches parents de sang. Le texte principal et la note préservent cette ambiguïté réelle.
- issue: Sens de וְחַנֹּתִי
  choice: Lecture exprimant que Job est odieux ou répugnant
  alternative: « ma supplication s’adresse aux fils de mon corps » ou « j’implore la faveur des fils de mon corps »
  rationale: Le parallélisme avec l’aversion de l’épouse soutient la lecture de répulsion, mais l’hébreu est difficile et l’interprétation liée à la supplication demeure plausible; elle est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et direct. « Mon haleine » exprime concrètement le souffle devenu repoussant; « odieux » marque l’aversion relationnelle sans ajouter de précision médicale. Les deux notes sont placées après le segment auquel elles se rapportent.
