  text: וְ/אַחַ֣ר ע֭וֹרִֽ/י נִקְּפוּ זֹ֑את וּ֝/מִ/בְּשָׂרִ֗/י אֶֽחֱזֶ֥ה אֱלֽוֹהַּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/026.yaml
  text: And after my skin has been destroyed[b][a], yet from my flesh I will see God.
translation:
  language: fr
  text: Et après que ma peau aura été détruite[b], de ma chair[a] je verrai Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans ma chair je verrai Dieu »; autre possibilité : « sans ma chair je verrai Dieu ». L’expression hébraïque est difficile et a été comprise de plusieurs manières.'
    reason: alternative_reading
  - marker: b
    text: 'Le membre de phrase « après que ma peau aura été détruite » est difficile sur les plans textuel et lexical; plus littéralement, on pourrait traduire : « après qu’ils auront arraché ma peau, ceci ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  choice: Et après que
  rationale: La conjonction et la préposition marquent la continuité avec le vers précédent et une succession temporelle; cette formulation est naturelle en français.
- source_word: עוֹרִי
  choice: ma peau
  rationale: עוֹר désigne normalement la peau; ce choix conserve l’image corporelle liée aux souffrances de Job.
- source_word: נִקְּפוּ זֹאת
  choice: aura été détruite
  rationale: La construction est difficile. Le passif français exprime clairement la ruine de la peau sans imposer une traduction littérale obscure de זֹאת.
- source_word: וּמִבְּשָׂרִי
  choice: de ma chair
  rationale: מִן signifie le plus naturellement « de, depuis ». La formulation concrète préserve l’ambiguïté du rapport entre la chair de Job et la vision annoncée.
- source_word: אֶחֱזֶה
  choice: je verrai
  rationale: חזה signifie voir ou contempler; « je verrai » est clair, actuel et digne.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: אֱלוֹהַּ est ici le nom ou titre singulier désignant Dieu.
theological_decisions:
- issue: La phrase וּמִבְּשָׂרִי enseigne-t-elle explicitement une résurrection corporelle?
  choice: « de ma chair »
  alternative: « dans ma chair » ou « sans ma chair »
  rationale: La valeur de la préposition et la syntaxe sont discutées. Le texte principal conserve la tension du passage sans trancher entre une vision corporelle et une vision sans le corps.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur antérieur rend l’antériorité de la destruction par rapport à la vision future. Les notes signalent les difficultés sans imposer une lecture doctrinale.
