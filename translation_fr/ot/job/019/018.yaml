  text: Even little children despise me; when I rise[a], they speak against me.
translation:
  language: fr
  text: Même de jeunes garçons[a] me méprisent ; quand je me lève, ils parlent contre moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les insensés », « les insolents » ou « de petits enfants ». Le sens du terme hébreu est incertain ici : il peut désigner des personnes dépourvues de jugement moral, mais, dans ce contexte, beaucoup y voient des garçons jeunes ou immatures qui se moquent de Job.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Même
  rationale: 'Marque à la fois la continuité de la plainte et l’intensification : jusqu’aux jeunes garçons traitent Job avec mépris.'
- source_word: עֲוִילִים
  choice: de jeunes garçons
  rationale: Dans ce contexte d’humiliation sociale, le terme désigne probablement des êtres jeunes ou immatures qui méprisent Job. La formulation reste naturelle en français, tandis que l’incertitude lexicale est signalée en note.
- source_word: מָאֲסוּ בִי
  choice: me méprisent
  rationale: Le verbe exprime un rejet empreint de dédain ; « mépriser » convient au ton de la plainte.
- source_word: אָקוּמָה
  choice: quand je me lève
  rationale: 'La forme est comprise ici comme une proposition temporelle : lorsqu’il se lève, Job devient la cible de leurs paroles.'
- source_word: וַיְדַבְּרוּ בִי
  choice: ils parlent contre moi
  rationale: La préposition ב prend vraisemblablement ici une valeur hostile. Cette traduction conserve le verbe « parler » sans préciser indûment qu’il s’agit nécessairement de moqueries.
