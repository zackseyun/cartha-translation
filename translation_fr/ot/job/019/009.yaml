id: JOB.19.9
reference: Job 19:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כְּ֭בוֹדִ/י מֵ/עָלַ֣/י הִפְשִׁ֑יט וַ֝/יָּ֗סַר עֲטֶ֣רֶת רֹאשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/009.yaml
  text: He has stripped my honor from me and removed the crown from my head[a].
translation:
  language: fr
  text: Il m’a dépouillé de mon honneur[a] et a retiré la couronne de ma tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ma gloire » ou « de ma dignité ».
    reason: 'Alternative lexicale : כְּבוֹדִי couvre les notions d’honneur, de gloire et de dignité ou de rang.'
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: mon honneur
  rationale: כָּבוֹד peut désigner l’honneur, la gloire ou la dignité liée au rang. Dans cette plainte sur l’humiliation et la perte de statut, « mon honneur » rend naturellement le sens concret sans connotation théologique indue.
- source_word: מֵעָלַי
  choice: de mon honneur
  rationale: Littéralement « de dessus moi » ; avec le verbe « dépouiller », la construction française « dépouiller quelqu’un de quelque chose » exprime idiomatiquement cette idée de retrait.
- source_word: הִפְשִׁיט
  choice: m’a dépouillé
  rationale: Le verbe évoque le fait d’ôter un vêtement ou ce qui recouvre. « Dépouillé » conserve l’image vive d’un homme privé de son honneur.
- source_word: וַיָּסַר
  choice: a retiré
  rationale: Le hiphil de סור signifie ici enlever ou écarter. « A retiré » convient au geste imagé consistant à ôter une couronne.
- source_word: עֲטֶרֶת
  choice: la couronne
  rationale: Le nom désigne une couronne ou une parure circulaire, symbole d’honneur et de rang. « Couronne » est clair et conserve la métaphore.
- source_word: רֹאשִׁי
  choice: ma tête
  rationale: La formulation littérale garde l’image centrale de la couronne ôtée de la tête.
theological_decisions:
- issue: Référent du sujet masculin singulier non nommé
  choice: Le pronom « Il » renvoie contextuellement à Dieu, sans que le nom soit ajouté.
  alternative: Un adversaire ou une puissance non précisés.
  rationale: Dans le contexte immédiat, Job attribue son affliction à Dieu. Garder le simple pronom « Il » préserve cependant la concision de l’hébreu et sa tension.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est conservé, avec deux images concrètes de dépossession. La majuscule à « Il » signale le référent divin fourni par le contexte sans introduire explicitement le nom de Dieu.
