source:
  edition: WLC
  text: יִתְּצֵ֣/נִי סָ֭בִיב וָ/אֵלַ֑ךְ וַ/יַּסַּ֥ע כָּ֝/עֵ֗ץ תִּקְוָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/010.yaml
  text: He tears me down on every side[a], and I am gone; he has uprooted my hope like a tree.
translation:
  language: fr
  text: Il me démolit de tous côtés[a], et je disparais ; il déracine mon espérance comme un arbre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et je m’en vais » ou « et je péris ». L’hébreu dit littéralement « et je vais » ; l’expression semble indiquer ici le résultat de la démolition : Job disparaît ou est anéanti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּצֵנִי
  choice: Il me démolit
  rationale: Le verbe נתץ exprime l’action d’abattre ou de démolir. « Il me démolit » conserve la force destructrice de l’hébreu et son complément explicite « me ».
- source_word: סָבִיב
  choice: de tous côtés
  rationale: Cette expression adverbiale indique une destruction qui entoure Job et l’atteint entièrement.
- source_word: וָאֵלַךְ
  choice: et je disparais
  rationale: 'Littéralement « et je vais ». Dans ce contexte, le mouvement exprime vraisemblablement le résultat de la démolition : Job s’en va, disparaît ou périt. La note maintient l’ambiguïté.'
- source_word: וַיַּסַּע
  choice: il déracine
  rationale: נסע peut désigner le fait d’arracher ou d’enlever ce qui est fixé. Avec la comparaison à un arbre, « déracine » rend naturellement l’image.
- source_word: כָּעֵץ
  choice: comme un arbre
  rationale: Traduction directe de la comparaison hébraïque.
- source_word: תִּקְוָתִי
  choice: mon espérance
  rationale: תקוה désigne l’espoir ou l’attente. « Espérance » convient au registre digne de la lamentation sans ajouter de précision doctrinale.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore de la démolition est suivie de celle du déracinement, sans chercher à les harmoniser. Le présent rend la plainte hébraïque avec immédiateté.
