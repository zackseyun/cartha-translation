  source_fidelity: 'Le sens général est bien rendu, mais « hôtes » est ambigu en français moderne : il peut désigner ceux qui reçoivent plutôt que les personnes hébergées. גָּרֵי בֵיתִי désigne plus précisément ceux qui séjournent/résident dans la maison de Job. Le parallélisme זָר / נָכְרִי est mieux préservé par « étranger » dans les deux membres, sans prétendre distinguer artificiellement deux quasi-synonymes.'
