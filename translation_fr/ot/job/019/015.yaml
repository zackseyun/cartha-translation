  yaml_path: translation/ot/job/019/015.yaml
  text: The guests in my house and my female servants count me as a stranger; I have become a foreigner in their eyes.
translation:
  language: fr
  text: Ceux qui séjournent dans ma maison et mes servantes me considèrent comme un étranger ; je suis devenu un étranger à leurs yeux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּרֵי בֵיתִי
  choice: Les hôtes de ma maison
  rationale: גָּר peut désigner un résident étranger ou une personne séjournant chez quelqu’un. Dans ce contexte domestique, « les hôtes de ma maison » est naturel et conserve l’idée de personnes accueillies ou hébergées chez Job.
- source_word: אַמְהֹתַי
  choice: mes servantes
  rationale: Le terme אָמָה désigne ici des femmes au service de la maison ; « servantes » est précis, courant et digne.
- source_word: לְזָר תַּחְשְׁבֻנִי
  choice: me considèrent comme un étranger
  rationale: Cette formulation rend directement le verbe חשׁב, « considérer, tenir pour », et זָר, une personne étrangère au groupe.
- source_word: נָכְרִי הָיִיתִי בְעֵינֵיהֶם
  choice: je suis devenu un inconnu à leurs yeux
  rationale: נָכְרִי désigne celui qui est perçu comme étranger ou non reconnu. « Inconnu » évite une répétition lourde avec זָר tout en exprimant l’aliénation relationnelle, et « à leurs yeux » reproduit l’idiome hébreu.
