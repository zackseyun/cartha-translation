base_translation:
  language: en
  yaml_path: translation/ot/job/019/007.yaml
  text: Look[a], I cry out, “Violence!” but I am not answered; I cry for help[c][b], but there is no justice.
translation:
  language: fr
  text: 'Voyez : je crie « Violence ! »[a], mais on ne me répond pas ; j’appelle au secours[b], mais il n’y a pas de justice[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tort ! » ou « Injustice ! » Le terme hébreu peut désigner la violence, un acte injuste ou le cri indigné de quelqu’un qui porte plainte.
    reason: lexical_alternative
  - marker: b
    text: Ou « je pousse un appel à l’aide ». Le verbe désigne un appel pressant au secours.
    reason: lexical_alternative
  - marker: c
    text: Ou « il n’y a pas de jugement équitable » ou « il n’y a pas de recours juridique ». Le terme hébreu possède ici une forte dimension juridique.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voyez
  rationale: Cette interjection attire l’attention et souligne avec force ce qui suit. « Voyez » en restitue naturellement la valeur déictique et emphatique.
- source_word: אֶצְעַק
  choice: je crie
  rationale: Le verbe צעק désigne un cri poussé avec force, souvent sous l’effet de la détresse. « Je crie » convient au style poétique et exprime l’urgence.
- source_word: חָמָס
  choice: Violence !
  rationale: Le nom peut désigner la violence, le tort ou l’injustice et peut servir de cri d’accusation. « Violence ! » conserve ici la force directe de la plainte.
- source_word: אֵעָנֶה
  choice: on ne me répond pas
  rationale: Le niphal de ענה exprime ici le fait de recevoir une réponse. La tournure impersonnelle française rend naturellement le passif hébreu sans préciser qui devrait répondre.
- source_word: אֲשַׁוַּע
  choice: j’appelle au secours
  rationale: Le verbe שׁוע désigne un appel pressant à l’aide. Cette expression française en communique clairement le sens tout en le distinguant légèrement du premier cri.
- source_word: מִשְׁפָּט
  choice: justice
  rationale: Dans ce contexte de plainte, מִשְׁפָּט évoque la justice, une décision équitable ou un recours judiciaire. « Justice » conserve à la fois la portée juridique et morale.
theological_decisions:
- issue: La portée de la plainte de Job contre Dieu
  choice: 'Présenter sans l’atténuer la plainte de Job : son appel reste sans réponse et il ne trouve aucune justice.'
  alternative: Employer une formulation plus indirecte afin de ne pas laisser entendre que Dieu refuse la justice.
  rationale: L’hébreu formule ouvertement cette accusation dans la bouche de Job. La traduction doit en préserver la tension théologique sans la résoudre ni l’adoucir.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique des deux appels est conservé, tout comme la vigueur de la plainte et son arrière-plan judiciaire.
