source:
  edition: WLC
  text: חָדְל֥וּ קְרוֹבָ֑/י וּֽ/מְיֻדָּעַ֥/י שְׁכֵחֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/014.yaml
  text: My relatives have failed me[a], and my acquaintances have forgotten me.
translation:
  language: fr
  text: Mes proches m’ont fait défaut[a], et mes connaissances m’ont oublié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Mes proches ont cessé » ; autre traduction possible : « Mes proches ne sont plus là » ou « m’ont abandonné ».'
    reason: Le verbe hébreu signifie « cesser », mais son emploi absolu avec des personnes pour sujet demande une formulation idiomatique en français ; le contexte suggère leur retrait sans en préciser exactement la nature.
lexical_decisions:
- source_word: חָדְלוּ
  choice: m’ont fait défaut
  rationale: Le verbe signifie fondamentalement « cesser ». Avec « mes proches » pour sujet, « m’ont fait défaut » exprime naturellement en français leur retrait ou leur absence, sans préciser indûment de quelle aide Job aurait été privé.
- source_word: קְרוֹבָי
  choice: mes proches
  rationale: Le terme désigne littéralement ceux qui sont « près » et peut viser la parenté ou l’entourage proche. « Mes proches » conserve cette étendue de sens mieux que « mes parents », plus restrictif.
- source_word: וּמְיֻדָּעַי
  choice: mes connaissances
  rationale: Le mot désigne les personnes connues de Job. « Mes connaissances » en rend le sens sans leur attribuer nécessairement l’intimité impliquée par « mes amis ».
- source_word: שְׁכֵחוּנִי
  choice: m’ont oublié
  rationale: Traduction directe du verbe « oublier », qui préserve la force simple et douloureuse de la plainte.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme de la plainte est conservé, ainsi que la distinction entre les proches et le cercle plus large des connaissances.
