  text: הֶן אֵ֭ל יַשְׂגִּ֣יב בְּ/כֹח֑/וֹ מִ֖י כָמֹ֣/הוּ מוֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/022.yaml
  text: Behold[a], God is exalted in his power[b]; who is a teacher like him?
translation:
  language: fr
  text: Voici, Dieu est sublime dans sa puissance[a] ; qui enseigne comme lui[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par sa puissance ».
    reason: La préposition ב peut exprimer le domaine ou la sphère (« dans sa puissance »), mais aussi un moyen ou une valeur instrumentale (« par sa puissance »).
  - marker: b
    text: Ou « qui est un maître comparable à lui ? »
    reason: Le participe מוֹרֶה peut être rendu verbalement (« qui enseigne ») ou nominalement (« un maître »), sans changer l’affirmation de l’incomparabilité divine comme enseignant.
lexical_decisions:
- source_word: הֶן
  choice: Voici
  rationale: Cette particule attire solennellement l’attention sur l’affirmation qui suit ; « Voici » convient au registre poétique sans être familier.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל est ici un titre divin courant désignant Dieu.
- source_word: יַשְׂגִּיב
  choice: se montre sublime
  rationale: Le hiphil de שׂגב exprime ici la hauteur ou la grandeur inaccessible. Cette formulation rend sa nuance active sans réduire le sens à la seule puissance d’action.
- source_word: בְּכֹחוֹ
  choice: par sa puissance
  rationale: La préposition ב peut avoir une valeur instrumentale ou décrire le domaine dans lequel cette grandeur se manifeste. « Par sa puissance » est naturel en français, tandis que l’autre nuance est conservée en note.
- source_word: מִי כָמֹהוּ
  choice: qui… comme lui ?
  rationale: La question comparative exprime directement que nul ne lui est comparable.
- source_word: מוֹרֶה
  choice: enseigne
  rationale: Le participe désigne celui qui enseigne. La tournure verbale « qui enseigne comme lui ? » est naturelle en français et conserve la force de la question rhétorique.
theological_decisions:
- issue: Rapport entre l’élévation de Dieu et sa puissance
  choice: Dieu manifeste sa grandeur sublime par sa puissance, sans préciser davantage le mécanisme ou en tirer une affirmation doctrinale plus large.
  alternative: Dieu est sublime dans sa puissance ; Dieu agit avec une grandeur souveraine.
  rationale: Le verbe et la préposition autorisent une nuance active ou descriptive. Le texte principal garde l’idée de grandeur inaccessible liée à la puissance, et la note préserve l’autre construction possible.
- issue: Valeur de מוֹרֶה dans la question finale
  choice: 'Rendre le participe verbalement : « qui enseigne comme lui ? »'
  alternative: « Qui est un maître comparable à lui ? »
  rationale: Les deux formulations expriment l’incomparabilité de Dieu comme enseignant. Le choix principal est plus idiomatique en français et l’alternative nominale maintient la structure possible de l’hébreu.
translation_notes:
  register: Français international moderne, poétique et digne. « Voici » conserve l’appel à l’attention ; « se montre sublime » maintient la hauteur du langage sans archaïsme. La ponctuation met en relief la question rhétorique finale.
