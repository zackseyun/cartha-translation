  text: יְחַלֵּ֣ץ עָנִ֣י בְ/עָנְי֑/וֹ וְ/יִ֖גֶל בַּ/לַּ֣חַץ אָזְנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/015.yaml
  text: He rescues the afflicted by their affliction[b][a], and opens their ears by oppression.
translation:
  language: fr
  text: 'Il délivre les affligés par leur affliction[a]

    et leur ouvre les oreilles par la détresse[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il délivre le pauvre dans son affliction. » Les termes hébreux peuvent évoquer la pauvreté, l’affliction ou l’oppression.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il découvre leurs oreilles ». Cette expression hébraïque signifie rendre quelqu’un attentif ou réceptif à l’instruction. La préposition peut aussi être comprise au sens circonstanciel : « dans la détresse ».'
    reason: cultural_note
lexical_decisions:
- source_word: יְחַלֵּץ
  choice: délivre
  rationale: Le piel de חלץ exprime ici l’action de tirer quelqu’un du danger ou de l’en délivrer. « Délivre » convient au registre digne du passage sans être obscur.
- source_word: עָנִי
  choice: l’affligé
  rationale: עָנִי peut désigner le pauvre, l’humble ou celui qui subit l’affliction. Le parallélisme avec עָנְיוֹ et לַחַץ favorise ici « l’affligé », sans réduire le terme à la pauvreté matérielle.
- source_word: בְעָנְיוֹ
  choice: par son affliction
  rationale: La préposition ב peut être instrumentale ou circonstancielle. « Par son affliction » conserve la lecture instrumentale probable ainsi que le singulier du texte, tout en laissant la note signaler l’autre possibilité.
- source_word: וְיִגֶל ... אָזְנָם
  choice: et leur ouvre l’oreille
  rationale: גלה signifie littéralement découvrir ou mettre à nu. Avec « oreille », l’expression évoque le fait de rendre réceptif à l’instruction. Le singulier collectif « l’oreille » avec le suffixe pluriel « leur » reproduit naturellement אָזְנָם en français.
- source_word: בַּלַּחַץ
  choice: dans la détresse
  rationale: לַחַץ peut exprimer la pression, l’oppression ou la détresse. La préposition peut indiquer le moyen ou les circonstances. « Dans la détresse » préserve cette ambiguïté mieux qu’un instrument exclusivement affirmé.
theological_decisions:
- issue: Le rôle de la souffrance dans la délivrance et l’instruction divines
  choice: Le premier membre conserve la lecture instrumentale (« par son affliction »), tandis que le second garde ouverte la valeur instrumentale ou circonstancielle (« dans la détresse »).
  alternative: « Il délivre le pauvre dans son affliction et leur ouvre l’oreille par l’oppression. »
  rationale: Les deux emplois de ב peuvent être instrumentaux, mais l’hébreu autorise aussi une nuance circonstancielle. La formulation maintient l’affirmation tendue du discours d’Élihou sans enseigner que toute souffrance serait bonne en elle-même, punitive ou directement causée par Dieu.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu est conservé. « L’affligé » reste au singulier générique, tandis que « leur » respecte le suffixe pluriel du texte massorétique. Les marqueurs suivent les propositions auxquelles leurs notes se rapportent.
