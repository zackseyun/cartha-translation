source:
  edition: WLC
  text: עַל כַּפַּ֥יִם כִּסָּה א֑וֹר וַ/יְצַ֖ו עָלֶ֣י/הָ בְ/מַפְגִּֽיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/032.yaml
  text: He covers his hands with lightning[b][a], and commands it to strike the mark.
translation:
  language: fr
  text: Il couvre ses mains de l’éclair[a] et lui ordonne d’atteindre sa cible[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « lumière » ; dans le contexte de l’orage décrit ici, il s’agit probablement de l’éclair.'
    reason: lexical_alternative
  - marker: b
    text: 'La fin du verset est difficile en hébreu. On peut aussi comprendre : « contre celui qu’il frappe » ou « contre l’intercesseur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּפַּיִם
  choice: ses mains
  rationale: Le duel de כַּף désigne ici les paumes ou, plus largement, les mains. « Ses mains » est naturel en français tout en conservant l’image corporelle.
- source_word: כִּסָּה
  choice: couvre
  rationale: Le verbe כסה signifie « couvrir, dissimuler ». « Couvre » préserve l’image concrète sans expliciter davantage la métaphore.
- source_word: אוֹר
  choice: l’éclair
  rationale: אוֹר signifie normalement « lumière », mais le contexte immédiat de l’orage indique probablement l’éclair. Le singulier collectif conserve aussi le lien avec le suffixe féminin singulier de la proposition suivante.
- source_word: וַיְצַו
  choice: ordonne
  rationale: Le verbe צוה exprime l’action de commander ou d’ordonner et maintient l’action personnelle attribuée à Dieu.
- source_word: עָלֶיהָ
  choice: lui
  rationale: Le suffixe féminin singulier renvoie vraisemblablement à la lumière comprise comme l’éclair ou la foudre. En français, « lui » reprend naturellement « l’éclair », malgré le changement de genre grammatical.
- source_word: בְמַפְגִּיעַ
  choice: d’atteindre sa cible
  rationale: La forme issue de פגע est difficile. Dans l’imagerie de l’orage, elle peut évoquer le fait de diriger l’éclair vers le point qu’il doit frapper. « Atteindre sa cible » donne un sens cohérent tout en signalant l’incertitude dans une note.
theological_decisions:
- issue: Sens de בְמַפְגִּיעַ
  choice: d’atteindre sa cible
  alternative: contre celui qu’il frappe ; contre l’intercesseur
  rationale: Le contexte météorologique favorise l’idée d’un éclair dirigé vers sa cible, mais la morphologie permet d’autres analyses, dont un participe désignant celui qui frappe ou celui qui intercède. La note préserve cette ambiguïté sans introduire une interprétation théologique particulière.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le singulier « l’éclair » maintient l’image compacte de l’hébreu et permet une reprise pronominale naturelle. Les deux notes rendent visibles l’extension contextuelle de « lumière » et l’incertitude réelle de la dernière expression.
