  text: הֶן אֵ֣ל שַׂ֭גִּיא וְ/לֹ֣א נֵדָ֑ע מִסְפַּ֖ר שָׁנָ֣י/ו וְ/לֹא חֵֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/026.yaml
  text: Behold[a], God is great, and we do not know him[b]; the number of his years is unsearchable.
translation:
  language: fr
  text: Voici, Dieu est grand, et nous ne le connaissons pas[a] ; le nombre de ses années est insondable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et nous ne connaissons pas ». Le complément « le » est sous-entendu d’après le contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il n’y a pas moyen de sonder le nombre de ses années ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Voici
  rationale: Introduit avec emphase l’affirmation qui suit et conserve la tonalité élevée de la poésie sapientiale.
- source_word: אֵל
  choice: Dieu
  rationale: Désigne ici Dieu dans un registre poétique ; « Dieu » est le rendu français direct et naturel.
- source_word: שַׂגִּיא
  choice: grand
  rationale: Exprime la grandeur ou l’élévation sans préciser indûment s’il s’agit de puissance, de majesté ou d’immensité.
- source_word: וְלֹא נֵדָע
  choice: et nous ne le connaissons pas
  rationale: L’hébreu ne formule aucun complément explicite, mais le contexte immédiat désigne Dieu. Le pronom « le » rend la phrase naturelle en français tout en laissant la note signaler la forme littérale.
- source_word: מִסְפַּר שָׁנָיו
  choice: le nombre de ses années
  rationale: Conserve l’image poétique et anthropomorphique des « années » de Dieu, sans la remplacer par le concept plus interprétatif d’éternité.
- source_word: וְלֹא חֵקֶר
  choice: est insondable
  rationale: Rend idiomatiquement l’expression nominale signifiant qu’il n’existe aucune possibilité d’en faire l’examen ou d’en déterminer la mesure.
theological_decisions:
- issue: Complément implicite de וְלֹא נֵדָע
  choice: 'Fournir le pronom « le » : « nous ne le connaissons pas »'
  alternative: 'Conserver une formulation absolue : « nous ne connaissons pas » ; ou expliciter : « il dépasse notre connaissance »'
  rationale: Dieu est le référent immédiat, mais l’hébreu laisse le complément inexprimé. Le pronom constitue en français le complément contextuel minimal, sans ajouter « pleinement » ni transformer l’énoncé en explication théologique.
- issue: Les « années » de Dieu
  choice: Conserver « ses années »
  alternative: Interpréter par « son éternité » ou « la durée de son existence »
  rationale: La formulation préserve l’image poétique de l’hébreu et sa tension, plutôt que d’y substituer un terme théologique systématique.
translation_notes:
  register: Français international moderne, digne et poétique. « Voici » garde la force présentative de l’hébreu ; le point-virgule met en relief le parallélisme des deux affirmations.
