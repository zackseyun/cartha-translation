  text: כִּֽי חֵ֭מָה פֶּן יְסִֽיתְ/ךָ֣ בְ/סָ֑פֶק וְ/רָב כֹּ֝֗פֶר אַל יַטֶּֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/018.yaml
  text: Because wrath—beware lest it entice you into scoffing[c][b][a], and do not let a great ransom turn you aside.
translation:
  language: fr
  text: Car la colère — prends garde qu’elle ne t’entraîne à la moquerie[a] — ; ne laisse pas non plus une forte rançon te détourner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’elle ne t’entraîne à frapper dans ses mains ». Le terme hébreu est difficile et peut désigner plus concrètement le fait de frapper dans ses mains, peut-être comme geste de dérision.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif de l’avertissement. « Car » conserve la valeur causale tout en convenant au registre sapientiel.
- source_word: חֵמָה
  choice: la colère
  rationale: Le terme désigne une colère ardente ou une fureur. « La colère » reste naturel en français et ne précise pas de qui elle procède, conformément à l’ambiguïté de l’hébreu.
- source_word: פֶּן
  choice: prends garde que… ne
  rationale: La particule exprime la crainte ou la mise en garde devant une conséquence possible. Cette tournure rend clairement sa force admonitive en français.
- source_word: יְסִיתְךָ
  choice: qu’elle ne t’entraîne
  rationale: Le hiphil de סות peut signifier inciter, séduire ou entraîner dans une mauvaise voie. « Entraîner » convient au contexte sans suggérer nécessairement une séduction attirante.
- source_word: בְסָפֶק
  choice: à la moquerie
  rationale: Le mot est difficile. Dans ce contexte, il peut évoquer un geste de dérision, peut-être le fait de frapper ou de battre des mains. « À la moquerie » exprime le sens idiomatique probable, tandis que le sens plus concret est signalé en note.
- source_word: וְרָב כֹּפֶר
  choice: une forte rançon
  rationale: רָב exprime ici l’importance ou l’ampleur, et כֹּפֶר un prix versé pour obtenir délivrance ou compensation. « Une forte rançon » est idiomatique et laisse ouverte la portée exacte de l’expression.
- source_word: אַל יַטֶּךָּ
  choice: ne laisse pas… te détourner
  rationale: Le verbe נטה évoque un écart ou une déviation. Cette formulation conserve l’image d’un détournement tout en rendant naturellement l’interdiction.
theological_decisions:
- issue: Référent de « la colère »
  choice: Ne pas préciser s’il s’agit de la colère de Job, de la colère divine ou de la colère en général.
  alternative: Traduire explicitement par « ta colère » ou « la colère de Dieu ».
  rationale: Le texte hébreu n’indique aucun possesseur. Une explicitation trancherait une ambiguïté réelle et infléchirait l’interprétation théologique.
- issue: Sens de כֹּפֶר
  choice: rançon
  alternative: pot-de-vin ; prix d’expiation
  rationale: « Rançon » rend le sens central d’un prix payé pour écarter une conséquence sans imposer ici une lecture cultuelle ou juridique trop précise.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Les tirets rendent l’avertissement parenthétique et laissent à « colère » son référent indéterminé.
