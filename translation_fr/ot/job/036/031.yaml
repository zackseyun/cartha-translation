  yaml_path: translation/ot/job/036/031.yaml
  text: For by them he judges peoples; he gives food in abundance.
translation:
  language: fr
  text: Car, par eux, il juge les peuples ; il donne de la nourriture en abondance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָם
  choice: par eux
  rationale: Le pronom masculin pluriel renvoie probablement aux phénomènes évoqués dans le contexte, notamment les nuages, les eaux ou les éclairs. « Par eux » conserve ce renvoi sans le préciser abusivement.
- source_word: יָדִין
  choice: il juge
  rationale: Le verbe דין exprime ici l’action de juger ou de gouverner judiciairement ; la traduction directe préserve le lien entre les phénomènes naturels et le jugement divin.
- source_word: עַמִּים
  choice: les peuples
  rationale: Le pluriel désigne des collectivités humaines et se rend naturellement par « les peuples ».
- source_word: יִתֶּן אֹכֶל
  choice: il leur donne de la nourriture
  rationale: אֹכֶל désigne la nourriture. L’ajout du pronom « leur », implicite dans le parallélisme avec « les peuples », rend la phrase idiomatique en français sans modifier le bénéficiaire contextuel.
- source_word: לְמַכְבִּיר
  choice: en abondance
  rationale: L’expression adverbiale indique une grande quantité ; « en abondance » en restitue clairement le sens.
theological_decisions:
- issue: Les mêmes moyens naturels servent au jugement et à la subsistance.
  choice: Conserver le contraste entre « juge » et « donne de la nourriture » sans l’expliquer.
  alternative: Préciser que Dieu châtie par les tempêtes et nourrit par la pluie.
  rationale: Le texte présente une tension poétique et théologique sans identifier explicitement les phénomènes ni détailler leur fonctionnement ; la traduction ne doit pas résoudre cette ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. Le pluriel « eux » est maintenu malgré son référent contextuel peu explicite afin de respecter l’ambiguïté de l’hébreu.
