source:
  edition: WLC
  text: הִ֭שָּׁמֶר אַל תֵּ֣פֶן אֶל אָ֑וֶן כִּֽי עַל זֶ֝֗ה בָּחַ֥רְתָּ מֵ/עֹֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/021.yaml
  text: Take care[a]; do not turn to iniquity[b], for you have chosen this rather than affliction.
translation:
  language: fr
  text: Prends garde ! Ne te tourne pas vers le mal[a], car c’est cela que tu as choisi plutôt que l’affliction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’injustice », « la méchanceté » ou, éventuellement, « le malheur ». Le mot hébreu אָוֶן peut avoir un sens moral ou désigner le malheur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au lieu de l’affliction » ; « plutôt que la misère ». Le sens peut être que tu as préféré le mal à l’affliction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: Prends garde !
  rationale: L’impératif nifal de שׁמר exprime ici un avertissement pressant. « Prends garde ! » est naturel en français actuel et conserve sa force autonome.
- source_word: אַל תֵּפֶן
  choice: Ne te tourne pas
  rationale: La construction prohibitive אַל suivie du verbe פנה appelle une défense directe. « Ne te tourne pas » conserve l’image d’une orientation volontaire.
- source_word: אֶל אָוֶן
  choice: vers le mal
  rationale: אָוֶן peut désigner le mal moral, l’injustice ou le malheur. Dans cette exhortation, « le mal » rend clairement le sens éthique tout en restant assez large pour préserver la gamme du terme hébreu.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’avertissement et se rend naturellement par « car ».
- source_word: עַל זֶה
  choice: c’est cela
  rationale: Le démonstratif renvoie vraisemblablement au mal qui vient d’être mentionné. La tournure française « c’est cela que » restitue le renvoi sans expliciter davantage que l’hébreu.
- source_word: בָּחַרְתָּ
  choice: tu as choisi
  rationale: Le parfait à la deuxième personne du masculin singulier présente un choix accompli ayant une portée actuelle.
- source_word: מֵעֹנִי
  choice: plutôt que l’affliction
  rationale: 'עֹנִי désigne l’affliction, la misère ou la détresse. Le מִן marque ici vraisemblablement la comparaison ou la préférence : choisir le mal plutôt que supporter l’affliction.'
theological_decisions:
- issue: Nature du choix reproché à Job
  choice: Conserver l’affirmation directe selon laquelle il a choisi le mal plutôt que l’affliction.
  alternative: 'Reformuler comme un simple avertissement hypothétique : « ne préfère pas le mal à l’affliction ».'
  rationale: Le parfait בָּחַרְתָּ est affirmatif. Atténuer l’énoncé en hypothèse réduirait la tension de l’accusation formulée par Élihou.
translation_notes:
  register: Français international moderne, direct et digne. L’exclamation après « Prends garde » maintient la force de l’avertissement, tandis que « le mal » évite le caractère plus soutenu ou confessionnel de « l’iniquité ».
