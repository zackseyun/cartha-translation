source:
  edition: WLC
  text: הֵן פָּרַ֣שׂ עָלָ֣י/ו אוֹר֑/וֹ וְ/שָׁרְשֵׁ֖י הַ/יָּ֣ם כִּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/030.yaml
  text: Behold[a], he spreads his light over it[c][b], and he covers the roots of the sea.
translation:
  language: fr
  text: Voici qu’il déploie sa lumière[b] sur lui[a] et couvre les racines de la mer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sur lui ». Le pronom hébreu est masculin singulier, mais son référent n’est pas précisé; dans le contexte, il peut désigner la nuée ou la masse orageuse.
    reason: alternative_reading
  - marker: b
    text: Ou « son éclair » ou « son éclat ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « les racines de la mer »; l’expression peut désigner ses profondeurs ou ses fondements.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voici que
  rationale: Cette particule attire solennellement l’attention sur ce qui suit. « Voici que » garde la force poétique tout en restant naturel en français moderne.
- source_word: פָּרַשׂ
  choice: déploie
  rationale: Le verbe exprime l’action d’étendre ou de déployer. « Déploie » restitue de façon concise l’image d’une lumière qui s’étend.
- source_word: עָלָיו
  choice: au-dessus d’elle
  rationale: Le suffixe hébreu est au masculin singulier, mais son référent n’est pas exprimé dans ce verset. Le féminin français renvoie vraisemblablement à la nuée ou à la masse orageuse du contexte; l’ambiguïté est signalée en note.
- source_word: אוֹרוֹ
  choice: sa lumière
  rationale: Le nom signifie d’abord « lumière ». Dans ce contexte d’orage, il peut évoquer l’éclair ou l’éclat lumineux, possibilité conservée en note.
- source_word: וְשָׁרְשֵׁי
  choice: et … les racines de
  rationale: La traduction littérale « racines » conserve l’image poétique hébraïque, qui peut désigner les parties les plus profondes ou les fondements.
- source_word: הַיָּם
  choice: la mer
  rationale: Le nom désigne directement la mer; « les eaux » serait une généralisation.
- source_word: כִּסָּה
  choice: couvre
  rationale: Le verbe signifie « couvrir ». Le présent convient à la description poétique et reste plus concret que « dissimule ».
theological_decisions:
- issue: Référent du suffixe dans עָלָיו
  choice: Le texte principal le rapporte à la nuée ou à la masse orageuse implicite dans le contexte.
  alternative: « au-dessus de lui » ou « sur lui », avec un référent masculin non précisé.
  rationale: Le référent grammatical est ambigu dans le verset. Le contexte météorologique favorise une réalité impersonnelle, sans permettre de l’identifier avec certitude; la note préserve donc l’autre lecture.
translation_notes:
  register: Français international moderne, poétique et digne. « Voici que » conserve l’appel à l’attention; « déploie » et « racines de la mer » maintiennent les images concrètes de l’hébreu sans les expliciter dans le corps du texte.
