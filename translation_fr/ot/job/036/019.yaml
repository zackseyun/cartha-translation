  text: הֲ/יַעֲרֹ֣ךְ שׁ֭וּעֲ/ךָ לֹ֣א בְ/צָ֑ר וְ֝/כֹ֗ל מַאֲמַצֵּי כֹֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/019.yaml
  text: Will your cry avail when distress comes[b][a], or all the exertions of your strength?
translation:
  language: fr
  text: Ton cri te servira-t-il quand viendra la détresse[a][b], ou tous les efforts de ta force ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre interprétation de cet hébreu difficile : « Ta richesse te servira-t-elle pour que tu ne sois pas dans la détresse, ou toutes les ressources de ta force ? »'
    reason: alternative_reading
  - marker: b
    text: L’hébreu de ce verset est difficile, en particulier les expressions traditionnellement rendues par « ton cri » et « pas dans la détresse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַעֲרֹךְ
  choice: te servira-t-il
  rationale: Le verbe ערך signifie d’abord « disposer, mettre en ordre », mais semble ici avoir le sens contextuel de « être utile, servir ». La question rhétorique porte sur l’efficacité du recours évoqué.
- source_word: שׁוּעֲךָ
  choice: ton cri
  rationale: La vocalisation massorétique rattache la forme à שׁוע, « cri d’appel au secours ». « Ton cri » est naturel et concis ; l’interprétation « ta richesse » est signalée en note en raison de la difficulté du verset.
- source_word: לֹא בְצָר
  choice: quand viendra la détresse
  rationale: La formulation hébraïque est difficile et contient normalement la négation לֹא. Cette traduction rend l’interprétation contextuelle selon laquelle le groupe situe la question au moment de la détresse, sans prétendre que l’hébreu soit univoque.
- source_word: וְכֹל
  choice: ou tous
  rationale: 'Dans cette question rhétorique, la conjonction introduit vraisemblablement une seconde ressource supposée : ni le cri ni l’ensemble des efforts ne seraient efficaces.'
- source_word: מַאֲמַצֵּי כֹחַ
  choice: tous les efforts de ta force
  rationale: Cette formulation conserve les deux idées du groupe hébreu, l’effort intense et la force, ainsi que son caractère poétique. Le possessif est explicité d’après l’adresse directe et le parallélisme.
