  rationale: Le nom propre est translittéré selon sa forme française courante.
- source_word: וַיֹּאמַר
  choice: en disant
  rationale: Après « poursuivit », le gérondif rend naturellement la coordination hébraïque sans produire la tournure lourde « poursuivit et dit ».
