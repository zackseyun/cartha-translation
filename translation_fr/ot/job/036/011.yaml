source:
  edition: WLC
  text: אִֽם יִשְׁמְע֗וּ וְֽ/יַ֫עֲבֹ֥דוּ יְכַלּ֣וּ יְמֵי/הֶ֣ם בַּ/טּ֑וֹב וּ֝/שְׁנֵי/הֶ֗ם בַּ/נְּעִימִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/011.yaml
  text: If they listen and serve[b][a], they will complete their days in prosperity and their years in pleasantness.
translation:
  language: fr
  text: S’ils écoutent et le servent[a], ils passeront leurs jours dans le bien-être et leurs années dans les délices[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « obéissent » ; le verbe hébreu traduit par « écoutent » peut désigner une écoute obéissante.
    reason: lexical_alternative
  - marker: b
    text: Litt. « mèneront à leur terme leurs jours dans le bien et leurs années dans les choses agréables » ; ou « passeront leurs jours dans le bien et leurs années dans les douceurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: S’ils
  rationale: Introduit clairement la condition exprimée par l’hébreu, sans la transformer en certitude temporelle.
- source_word: יִשְׁמְעוּ
  choice: écoutent
  rationale: שׁמע peut signifier entendre, écouter ou obéir. « Écoutent » conserve le sens lexical de base tout en permettant, dans ce contexte, l’idée d’une écoute qui engage.
- source_word: וְיַעֲבֹדוּ
  choice: et servent
  rationale: עבד désigne largement le fait de servir. Ce choix n’impose pas le sens plus étroit de « rendre un culte » et convient à l’idée de servir Dieu avec obéissance.
- source_word: יְכַלּוּ
  choice: ils achèveront
  rationale: Le piel de כלה signifie ici mener à leur terme ou finir. Avec « jours » et « années », « achèveront » conserve la force verbale et évoque une vie menée jusqu’à son terme.
- source_word: יְמֵיהֶם
  choice: leurs jours
  rationale: Rendu littéral et naturel qui préserve le parallélisme poétique avec « leurs années ».
- source_word: בַּטּוֹב
  choice: dans le bonheur
  rationale: טוב substantivé désigne ici une condition favorable, le bien-être ou la prospérité. « Bonheur » est naturel en français et reste assez large pour ne pas réduire le propos à la richesse matérielle.
- source_word: וּשְׁנֵיהֶם
  choice: et leurs années
  rationale: Préserve le parallélisme hébraïque entre les jours et les années.
- source_word: בַּנְּעִימִים
  choice: dans les délices
  rationale: Le pluriel נְעִימִים évoque des choses agréables, des douceurs ou des délices. « Délices » respecte le pluriel poétique sans préciser indûment leur nature.
theological_decisions:
- issue: La déclaration promet-elle une prospérité matérielle comme principe théologique absolu ?
  choice: La condition formulée par Élihou est traduite directement, comme une affirmation de circonstances heureuses dans le cadre de son discours.
  alternative: En faire soit une garantie universelle de prospérité terrestre pour toute personne obéissante, soit une promesse exclusivement spirituelle.
  rationale: Le texte hébreu énonce la thèse d’Élihou dans le langage traditionnel de la sagesse. La traduction ne doit ni l’universaliser au-delà de ce contexte discursif, ni effacer son sens concret en le spiritualisant.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme « leurs jours… leurs années » est conservé. « Bonheur » évite une lecture exclusivement financière de בַּטּוֹב, tandis que « délices » rend le pluriel poétique de בַּנְּעִימִים.
