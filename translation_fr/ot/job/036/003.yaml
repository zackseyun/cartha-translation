  text: אֶשָּׂ֣א דֵ֭עִ/י לְ/מֵ/רָח֑וֹק וּ֝/לְ/פֹעֲלִ֗/י אֶֽתֵּֽן צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/003.yaml
  text: I will bring my knowledge from afar[b][a], and to my Maker I will ascribe righteousness.
translation:
  language: fr
  text: 'Je tirerai mon savoir de loin[a],

    et j’attribuerai la droiture[b] à mon Créateur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je puiserai mon savoir au loin. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « j’attribuerai la justice à mon Créateur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: Je tirerai
  rationale: Le verbe נשׂא signifie fondamentalement « lever, porter ». Avec « mon savoir » et « de loin », « tirer » exprime ici le fait de faire venir ou de puiser un savoir à une source éloignée, tout en conservant l’image du texte hébreu.
- source_word: דֵעִי
  choice: mon savoir
  rationale: Le nom désigne la connaissance ou le savoir. « Mon savoir » est direct, naturel et moins subjectif que « mon opinion ».
- source_word: לְמֵרָחוֹק
  choice: de loin
  rationale: L’expression indique ici la provenance éloignée du savoir. « De loin » conserve la concision et une part de l’ambiguïté imagée de l’hébreu.
- source_word: וּלְפֹעֲלִי
  choice: à mon Créateur
  rationale: Le participe פֹעֵל désigne celui qui fait ou façonne. Avec le suffixe de première personne, il renvoie à celui qui a fait le locuteur; « mon Créateur » est idiomatique, digne et clair en français.
- source_word: אֶתֵּן
  choice: j’attribuerai
  rationale: נתן signifie littéralement « donner ». Avec la droiture comme objet et le Créateur comme destinataire, il prend naturellement le sens d’attribuer ou de reconnaître cette qualité.
- source_word: צֶדֶק
  choice: la droiture
  rationale: צדק recouvre la rectitude morale et la justice. « Droiture » rend ici l’affirmation générale de la rectitude du Créateur, tandis que « justice » demeure une autre traduction importante.
theological_decisions:
- issue: Sens de צֶדֶק appliqué à Dieu
  choice: la droiture
  alternative: la justice
  rationale: Le terme hébreu peut désigner aussi bien la rectitude que la justice. Dans cette déclaration adressée au Créateur, « droiture » garde le sens large de ce qui est droit sans effacer la portée judiciaire, signalée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme poétique est conservé sur deux lignes; « Créateur » maintient la dignité du référent divin sans ajouter de précision confessionnelle.
