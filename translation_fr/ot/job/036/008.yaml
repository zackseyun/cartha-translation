  text: וְ/אִם אֲסוּרִ֥ים בַּ/זִּקִּ֑ים יִ֝לָּכְד֗וּ/ן בְּ/חַבְלֵי עֹֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/008.yaml
  text: And if they are bound in chains[a], caught in cords of affliction[b],
translation:
  language: fr
  text: Et s’ils sont liés par des chaînes[a], pris dans les liens de l’affliction[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enchaînés » ou « retenus dans des fers ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les liens de la misère » ou « dans les liens de la pauvreté » ; le terme hébreu peut désigner l’affliction, la misère ou la pauvreté selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Et s’ils
  rationale: Conserve à la fois la valeur connective de וְ et la condition introduite par אִם, dans une formulation française naturelle.
- source_word: אֲסוּרִים
  choice: sont liés
  rationale: Rend le participe passif du verbe אסר sans le transformer en nom comme « prisonniers ».
- source_word: בַּזִּקִּים
  choice: de chaînes
  rationale: Désigne des entraves ou des fers. La tournure « liés de chaînes » conserve l’image concrète et convient à un registre digne.
- source_word: יִלָּכְדוּן
  choice: pris
  rationale: Rend la forme passive de לכד, « être pris ou capturé », tout en maintenant le parallélisme avec « liés ».
- source_word: בְּחַבְלֵי
  choice: dans les liens de
  rationale: חבל désigne une corde ou un lien. « Liens » préserve ici l’image de l’entrave et évite une formulation française maladroite.
- source_word: עֹנִי
  choice: l’affliction
  rationale: Le terme peut désigner l’affliction, la misère ou la pauvreté. Dans ce contexte de souffrance et de contrainte, « affliction » garde une portée assez large.
theological_decisions:
- issue: Nature de l’image
  choice: Conserver l’image concrète des entraves tout en lui permettant d’évoquer métaphoriquement la souffrance ou la discipline divine.
  alternative: Comprendre le langage comme un emprisonnement strictement littéral, ou au contraire comme une adversité purement métaphorique.
  rationale: Les mots du verset évoquent concrètement chaînes et liens, tandis que le contexte porte sur la manière dont Dieu agit envers ceux qui souffrent. La traduction ne tranche pas entre les dimensions littérale et métaphorique.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre « liés » et « pris » ainsi que l’image des entraves sont conservés.
