id: JOB.36.6
reference: Job 36:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹא יְחַיֶּ֥ה רָשָׁ֑ע וּ/מִשְׁפַּ֖ט עֲנִיִּ֣ים יִתֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/006.yaml
  text: He does not keep the wicked alive[b][a], but gives justice to the afflicted.
translation:
  language: fr
  text: Il ne maintient pas le méchant en vie[a], mais il rend justice aux affligés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne laisse pas vivre le méchant ».
    reason: lexical_alternative
  - marker: b
    text: Ou « aux pauvres ». Le terme hébreu peut désigner des personnes humbles, opprimées, affligées ou matériellement pauvres.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֶּה
  choice: maintient … en vie
  rationale: Le piel de חיה exprime ici la conservation de la vie, et non une résurrection. Cette formulation française conserve le sens d’une préservation continue.
- source_word: רָשָׁע
  choice: le méchant
  rationale: Le singulier hébreu a une valeur générique. Le singulier français garde cette forme représentative sans en restreindre la portée à un individu précis.
- source_word: מִשְׁפָּט
  choice: justice
  rationale: Dans ce contexte, le mot désigne le droit ou l’issue juste accordée aux personnes affligées, plutôt qu’un simple acte judiciaire.
- source_word: עֲנִיִּים
  choice: les affligés
  rationale: Le terme peut désigner les pauvres, les opprimés ou, plus largement, ceux qui sont dans l’abaissement et la détresse. « Les affligés » préserve ici cette étendue de sens.
- source_word: יִתֵּן
  choice: rend
  rationale: Bien que נתן signifie littéralement « donner », l’expression française idiomatique « rendre justice » communique naturellement la construction hébraïque.
- source_word: וּ
  choice: mais
  rationale: La conjonction, littéralement « et », marque ici un contraste entre le sort du méchant et celui des affligés.
theological_decisions:
- issue: 'Le sens de יְחַיֶּה : préservation temporelle ou don de la vie au sens théologique'
  choice: « maintient … en vie », pour exprimer la préservation de la vie
  alternative: « donne la vie à » ou « fait vivre »
  rationale: 'Le parallélisme concerne le gouvernement juste de Dieu : il ne préserve pas le méchant, mais rend justice aux affligés. Une formulation évoquant la résurrection introduirait une idée que ce verset n’exige pas.'
translation_notes:
  register: Français international moderne, digne et direct. « Maintient … en vie » évite une lecture liée à la résurrection, tandis que « rend justice » est l’équivalent idiomatique naturel de la construction hébraïque. Les notes conservent les principales possibilités lexicales.
