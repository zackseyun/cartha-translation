id: JOB.36.10
reference: Job 36:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּ֣גֶל אָ֭זְנָ/ם לַ/מּוּסָ֑ר וַ֝/יֹּ֗אמֶר כִּֽי יְשֻׁב֥וּ/ן מֵ/אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/010.yaml
  text: He opens their ear to discipline[b][a], and says that they should turn back from wickedness.
translation:
  language: fr
  text: Il leur ouvre l’oreille à la discipline[a] et leur dit de se détourner du mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’instruction » ou « à la correction »; littéralement « il découvre leur oreille pour la discipline ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi se traduire par « l’iniquité » et, dans certains contextes, par « le malheur » ou « la peine ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֶל
  choice: ouvre
  rationale: Le verbe גלה signifie littéralement « découvrir »; avec « oreille » comme complément, il forme ici une image exprimant l’ouverture à une écoute réceptive. « Ouvre » conserve l’image tout en étant naturel en français.
- source_word: אָזְנָם
  choice: leur oreille
  rationale: Le texte hébreu emploie le singulier avec un suffixe pluriel. Le singulier distributif français « leur oreille » reflète cette forme et reste intelligible dans cette expression imagée.
- source_word: לַמּוּסָר
  choice: à la discipline
  rationale: מוּסָר recouvre l’instruction, la correction et la discipline. Dans ce contexte où l’épreuve sert d’avertissement correctif, « discipline » maintient ensemble les dimensions pédagogique et corrective.
- source_word: וַיֹּאמֶר
  choice: et leur dit
  rationale: אמר signifie « dire ». L’ajout explicite de « leur » est naturel en français et découle du groupe visé dans les deux propositions, sans modifier le contenu.
- source_word: כִּי
  choice: de
  rationale: כִּי introduit ici le contenu de la parole. Après « dire à quelqu’un », une construction infinitive avec « de » rend naturellement cette valeur en français.
- source_word: יְשֻׁבוּן
  choice: se détourner
  rationale: שוב signifie revenir ou faire demi-tour. Avec un complément introduit par מִן, « se détourner de » exprime clairement l’abandon demandé, sans renforcer indûment la modalité.
- source_word: מֵאָוֶן
  choice: du mal
  rationale: אָוֶן peut désigner le mal, l’iniquité ou le malheur. Ici, l’appel à l’abandonner favorise le sens moral; « mal » est actuel, clair et suffisamment large pour préserver la portée du terme.
theological_decisions:
- issue: Nature de מוּסָר dans le discours d’Élihou
  choice: la discipline comprise comme instruction corrective
  alternative: « l’instruction » avec une nuance surtout pédagogique, ou « la correction » avec une nuance plus punitive
  rationale: Le contexte présente l’épreuve comme un moyen d’avertir et de ramener une personne loin du mal. « Discipline » préserve la tension entre enseignement et correction sans imposer une doctrine particulière de la souffrance.
- issue: Sens moral ou circonstanciel de אָוֶן
  choice: le mal au sens moral
  alternative: le malheur ou la peine
  rationale: La construction avec שוב מן décrit ici l’abandon d’une conduite; le sens moral convient donc mieux, tout en laissant une note signaler l’étendue lexicale du mot.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore de l’oreille est conservée; la seconde proposition adopte une construction infinitive naturelle. Les notes rendent visibles les principales ambiguïtés lexicales sans alourdir le verset.
