id: JOB.36.12
reference: Job 36:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם לֹ֣א יִ֭שְׁמְעוּ בְּ/שֶׁ֣לַח יַעֲבֹ֑רוּ וְ֝/יִגְוְע֗וּ כִּ/בְלִי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/012.yaml
  text: But if they do not listen[a], they will pass away by the sword, and they will die without knowledge.
translation:
  language: fr
  text: Mais s’ils n’écoutent pas, ils périront par l’épée et mourront sans connaissance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « faute de connaissance ».'
    reason: La construction hébraïque peut indiquer soit l’état dans lequel ils meurent, soit la cause de leur mort.
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’ils
  rationale: La conjonction introduit ici une condition en contraste avec le verset précédent; « Mais s’ils » exprime naturellement cette opposition.
- source_word: לֹא יִשְׁמְעוּ
  choice: n’écoutent pas
  rationale: Le verbe שׁמע peut désigner le fait d’entendre, d’écouter ou d’obéir. « Écouter » conserve à la fois l’idée d’audition attentive et celle d’une réponse à l’instruction, sans réduire le sens à la seule obéissance.
- source_word: בְּשֶׁלַח
  choice: par l’épée
  rationale: שׁלח désigne ici une arme destructrice et peut notamment évoquer un projectile. Dans ce contexte de jugement, « par l’épée » est une formulation française claire et idiomatique, tout en représentant l’instrument de mort.
- source_word: יַעֲבֹרוּ
  choice: ils périront
  rationale: עבר signifie littéralement « passer », mais prend ici, dans un contexte de jugement et en parallèle avec « mourront », le sens de disparaître ou périr. « Périront » restitue clairement cet emploi idiomatique.
- source_word: וְיִגְוְעוּ
  choice: et mourront
  rationale: גוע exprime le fait d’expirer ou de mourir. « Mourront » est naturel, direct et convient au parallélisme du verset.
- source_word: כִּבְלִי דָעַת
  choice: sans connaissance
  rationale: La construction peut décrire l’état dans lequel ils meurent ou indiquer la cause de leur mort. « Sans connaissance » suit étroitement la forme hébraïque et maintient l’ambiguïté, tandis que la lecture causale figure en note.
theological_decisions:
- issue: Le verbe שׁמע désigne-t-il une simple audition ou une réponse obéissante ?
  choice: n’écoutent pas
  alternative: n’entendent pas ; n’obéissent pas
  rationale: « Écouter » préserve l’étendue sémantique du verbe hébreu sans ramener le propos à une perception auditive ni expliciter davantage que le texte l’idée d’obéissance.
- issue: כִּבְלִי דָעַת exprime-t-il un état ou une cause ?
  choice: sans connaissance
  alternative: faute de connaissance
  rationale: La formulation principale rend directement la construction hébraïque comme un état, sans exclure la nuance causale plausible, signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme est conservé par « périront » et « mourront ». La note est placée après « sans connaissance », expression à laquelle elle se rapporte.
