base_translation:
  language: en
  yaml_path: translation/ot/job/036/016.yaml
  text: Indeed[a], he lured you out of the mouth of distress into a broad place with no constraint beneath it[c][b], and the setting of your table was full of richness.
translation:
  language: fr
  text: Oui, il t’a attiré hors de la bouche de la détresse, vers un vaste espace, sans aucune étroitesse au-dessous[a] ; et ce qui est disposé sur ta table est plein de mets riches[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile : littéralement, « un vaste espace, sans étroitesse au-dessous ». On peut aussi comprendre « un lieu spacieux, sans aucune contrainte sous lui ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le mot rendu par « ce qui est disposé » est rare et son sens est incertain ; il peut évoquer ce qui est mis sur la table. Littéralement, la suite dit : « plein de graisse », image de nourriture riche et abondante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: Oui
  rationale: Marque ici l’insistance et l’enchaînement du propos. « Oui » est naturel en français et évite de surcharger le vers.
- source_word: הֲסִיתְךָ
  choice: il t’attirait loin
  rationale: Le verbe סות/סית peut signifier inciter, séduire ou attirer. Dans l’image d’une sortie hors de la détresse, « attirer loin de » garde ce mouvement sans imposer une nuance forcément malveillante.
- source_word: מִפִּי צָר
  choice: loin de la gueule de la détresse
  rationale: « Gueule » conserve l’image concrète de la bouche qui menace d’engloutir, tandis que « détresse » rend צַר et prépare le contraste avec l’espace vaste.
- source_word: רַחַב
  choice: vers un espace vaste
  rationale: Rend directement l’idée d’ampleur et conserve la métaphore spatiale opposée à l’étroitesse de la détresse.
- source_word: לֹא מוּצָק תַּחְתֶּיהָ
  choice: où rien ne comprime
  rationale: La construction est difficile. Cette formulation exprime l’absence de contrainte ou d’étroitesse tout en restant intelligible en français moderne.
- source_word: וְנַחַת שֻׁלְחָנְךָ
  choice: et ce qui était servi sur ta table
  rationale: נַחַת est rare et incertain ici. Le contexte de la table favorise le sens de ce qui y est posé ou servi plutôt que celui de repos.
- source_word: מָלֵא דָשֶׁן
  choice: débordait de mets riches
  rationale: Littéralement « était plein de graisse ». Dans le cadre d’une table, l’expression évoque une nourriture riche et abondante ; « débordait » traduit idiomatiquement מָלֵא.
theological_decisions:
- issue: Sujet implicite de הֲסִיתְךָ
  choice: Conserver « il » sans ajouter explicitement « Dieu ».
  alternative: Traduire « Dieu t’attirait ».
  rationale: Le contexte permet d’identifier Dieu comme sujet, mais le texte hébreu ne le nomme pas dans ce verset. Le pronom respecte cette implicitation.
- issue: Valeur potentiellement négative du verbe סית
  choice: Employer « attirait » sans préciser une intention trompeuse.
  alternative: Employer « séduisait », « incitait » ou « conduisait ».
  rationale: Le lexème peut porter une nuance d’incitation ou de séduction, mais le mouvement décrit ici paraît bénéfique. « Attirait » préserve une part de l’ambiguïté sans créer une contradiction artificielle.
- issue: Opposition entre détresse et espace
  choice: Maintenir les images spatiales et corporelles.
  alternative: 'Paraphraser : « il te délivrait de l’affliction pour te donner la liberté ».'
  rationale: La force poétique repose sur le contraste entre une détresse qui engloutit ou resserre et un lieu largement ouvert.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le tutoiement correspond à l’adresse directe au singulier. « Gueule » est retenu dans son emploi figuré et menaçant, tandis que la dernière proposition est légèrement explicitée pour rendre en français le syntagme hébreu rare lié à la table.
