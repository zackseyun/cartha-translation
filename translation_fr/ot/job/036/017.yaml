id: JOB.36.17
reference: Job 36:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/דִין רָשָׁ֥ע מָלֵ֑אתָ דִּ֖ין וּ/מִשְׁפָּ֣ט יִתְמֹֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/017.yaml
  text: But you are full of the judgment of the wicked[b][a]; judgment and justice seize you.
translation:
  language: fr
  text: Mais tu es rempli du jugement du méchant[a] ; le jugement et la justice te saisissent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du jugement réservé au méchant » ou « du jugement propre au méchant ». L’hébreu est condensé et peut désigner soit le jugement que subit le méchant, soit le genre de jugement qui lui est associé.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « le jugement et la justice te soutiennent » ou « tiennent ferme ». Le verbe hébreu peut signifier soutenir, maintenir ou saisir, et aucun objet n’est exprimé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִין
  choice: Mais… du jugement
  rationale: La conjonction est comprise comme adversative dans le contexte. Le premier דִּין est rattaché à l’expression qui suit, conformément à la syntaxe poétique très condensée.
- source_word: רָשָׁע
  choice: du méchant
  rationale: L’adjectif masculin singulier est employé comme substantif. « Le méchant » garde sa portée générique sans ajouter un référent particulier.
- source_word: מָלֵאתָ
  choice: tu es rempli
  rationale: Le parfait à la deuxième personne du masculin singulier décrit l’état présent de Job. Cette formulation conserve l’image hébraïque de la plénitude.
- source_word: דִּין
  choice: le jugement
  rationale: « Jugement » maintient le registre judiciaire et reproduit la répétition rhétorique du nom hébreu.
- source_word: וּמִשְׁפָּט
  choice: et la justice
  rationale: « Justice » rend la notion d’ordre ou de droit judiciaire et évite de confondre entièrement les deux termes parallèles.
- source_word: יִתְמֹכוּ
  choice: te saisissent
  rationale: Le verbe תמך peut signifier soutenir, tenir ou saisir. Dans ce contexte menaçant, « te saisissent » donne un français naturel, tout en signalant en note les autres valeurs possibles et le fait que l’objet reste implicite en hébreu.
theological_decisions:
- issue: Sens de דִּין רָשָׁע
  choice: du jugement du méchant
  alternative: du jugement réservé au méchant ; du jugement propre au méchant
  rationale: 'Le rapport entre les deux noms est laissé ouvert : il peut s’agir du jugement subi par le méchant ou du type de jugement qui lui est associé. La traduction ne tranche pas dans le corps du texte.'
- issue: Interprétation de יִתְמֹכוּ
  choice: le jugement et la justice te saisissent
  alternative: le jugement et la justice te soutiennent ; le jugement et la justice tiennent ferme
  rationale: L’hébreu ne donne aucun objet explicite, et le verbe peut évoquer aussi bien le soutien que la prise. Le contexte favorise ici une valeur contraignante, mais la note conserve l’ambiguïté lexicale et syntaxique.
translation_notes:
  register: Français international moderne, sobre et poétique. La répétition de « jugement » et la métaphore de la plénitude sont conservées. Les deux ambiguïtés majeures de l’hébreu sont rendues visibles par des notes plutôt que résolues silencieusement.
