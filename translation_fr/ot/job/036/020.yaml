  yaml_path: translation/ot/job/036/020.yaml
  text: Do not long for the night[a], when peoples are taken away from their place.
translation:
  language: fr
  text: Ne désire pas la nuit[a], quand des peuples sont enlevés de leur place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Ne désire pas la nuit, pour que des peuples montent sous eux. » L’hébreu est difficile ; « sont enlevés de leur place » reflète une interprétation contextuelle courante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁאַף
  choice: Ne désire pas
  rationale: אַל suivi de l’inaccompli exprime une interdiction. « Ne désire pas » rend naturellement le désir intense que peut évoquer שׁאף sans imposer l’image littérale de l’halètement.
- source_word: הַלָּיְלָה
  choice: la nuit
  rationale: Traduction directe du nom défini, qui conserve aussi la possible portée figurée du terme dans le contexte.
- source_word: לַעֲלוֹת
  choice: où … sont emportés
  rationale: L’infinitif de עלה est difficile ici. La formulation retient l’interprétation contextuelle courante d’un enlèvement soudain, tout en signalant en note le sens plus littéral.
- source_word: עַמִּים
  choice: des peuples
  rationale: Le pluriel désigne des collectivités; « peuples » en maintient la portée collective et le nombre.
- source_word: תַּחְתָּם
  choice: loin de leur place
  rationale: Littéralement « sous eux », l’expression est souvent comprise ici comme un arrachement à leur place ou à leur situation. « Loin de leur place » rend cette compréhension sans la présenter comme certaine.
