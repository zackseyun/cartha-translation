  source_fidelity: 'Le texte rend fidèlement le parallélisme hébreu : כָּל־אָדָם est bien compris collectivement (« Tous les humains »), חָזוּ comme un accompli (« ont vu »), et אֱנוֹשׁ comme un singulier générique pouvant porter une nuance de mortalité (« le mortel »). « l’ » conserve de manière appropriée l’ambiguïté du suffixe masculin singulier בוֹ, dont le contexte favorise l’œuvre de Dieu sans exclure une lecture personnelle. « observe de loin » rend naturellement יַבִּיט מֵרָחוֹק.'
