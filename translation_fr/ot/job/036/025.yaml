id: JOB.36.25
reference: Job 36:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּל אָדָ֥ם חָֽזוּ ב֑/וֹ אֱ֝נ֗וֹשׁ יַבִּ֥יט מֵ/רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/025.yaml
  text: All mankind has looked on it[b][a]; man gazes from afar.
translation:
  language: fr
  text: Tous les humains l’ont vu[a] ; le mortel l’observe de loin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tous les humains l’ont vu, lui. » Le pronom hébreu est masculin singulier et peut désigner Dieu personnellement ; dans le contexte, il peut aussi renvoyer à son œuvre ou à ce qu’il accomplit.'
    reason: alternative_reading
  - marker: b
    text: Les deux expressions hébraïques rendues par « humains » et « mortel » désignent ici l’être humain en général ; la seconde peut souligner sa fragilité et sa condition mortelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָדָם
  choice: Tous les humains
  rationale: כָּל avec אָדָם désigne ici l’ensemble de l’humanité. « Tous les humains » est inclusif, naturel en français moderne et conserve la portée collective de l’hébreu.
- source_word: חָזוּ
  choice: ont vu
  rationale: חזה exprime le fait de voir, parfois avec une nuance contemplative. « Ont vu » rend directement l’accompli hébreu sans introduire une nuance absente ou un registre archaïque.
- source_word: בּוֹ
  choice: l’
  rationale: Le suffixe pronominal hébreu est masculin singulier. Le pronom élidé français « l’ » préserve heureusement l’ambiguïté entre une référence à Dieu et une référence à son œuvre évoquée dans le contexte.
- source_word: אֱנוֹשׁ
  choice: le mortel
  rationale: אֱנוֹשׁ désigne l’être humain et peut souligner sa condition mortelle ou fragile. « Le mortel » maintient cette nuance ainsi que le singulier générique du parallélisme poétique.
- source_word: יַבִּיט
  choice: observe
  rationale: Le hifil de נבט signifie regarder, considérer ou fixer son regard. « Observe » suggère un regard attentif tout en restant actuel et digne.
- source_word: מֵרָחוֹק
  choice: de loin
  rationale: Cette expression indique la distance. « De loin » est la formulation française la plus concise et naturelle.
theological_decisions:
- issue: Référent du pronom בּוֹ
  choice: Conserver l’ambiguïté par « l’ » dans les deux propositions
  alternative: Expliciter « son œuvre » ou traduire personnellement par « lui »
  rationale: Le pronom masculin singulier peut renvoyer personnellement à Dieu, mais le contexte immédiat favorise aussi son œuvre ou ce qu’il accomplit. Le français permet ici de ne pas trancher ce que l’hébreu laisse ouvert.
translation_notes:
  register: Français international moderne, concis et poétique. Le parallélisme des deux propositions est conservé, avec une légère variation lexicale entre « voir » et « observer ». « Le mortel » maintient la dignité du registre et la nuance propre à אֱנוֹשׁ sans employer le générique masculin « l’homme ».
