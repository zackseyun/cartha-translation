  text: For he draws up the drops of water[a]; they distill rain from his mist.
translation:
  language: fr
  text: Car il fait monter les gouttes d’eau[a] ; elles distillent la pluie à partir de sa vapeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, pour le second membre : « elles versent la pluie selon sa vapeur ». Le sens du second membre en hébreu est difficile ; le mot traduit par « vapeur » peut aussi signifier « brume ».'
    reason: Signaler l’alternative plausible pour יָזֹקּוּ et la syntaxe difficile de לְאֵדוֹ, tout en conservant dans le texte principal l’interprétation météorologique et le suffixe singulier.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la grandeur de Dieu dans le contexte ; « Car » rend naturellement la valeur explicative ou causale.
- source_word: יְגָרַע
  choice: il attire
  rationale: Le verbe signifie habituellement « retrancher, retirer, diminuer » ; dans ce contexte météorologique, « attire » exprime sans lourdeur l’idée de retirer ou d’élever les gouttes d’eau.
- source_word: נִטְפֵי מָיִם
  choice: les gouttes d’eau
  rationale: Rend directement et naturellement le syntagme construit hébreu.
- source_word: יָזֹקּוּ
  choice: elles distillent
  rationale: Le verbe peut évoquer le filtrage ou l’affinage ; « distillent » préserve cette image tout en convenant à la formation de la pluie.
- source_word: מָטָר
  choice: la pluie
  rationale: Équivalent français courant et précis du nom hébreu.
- source_word: לְאֵדוֹ
  choice: de sa vapeur
  rationale: אֵד peut désigner une vapeur ou une brume. La préposition לְ est difficile ici ; « de » donne un sens météorologique cohérent tout en laissant l’autre analyse dans la note. Le suffixe masculin singulier est conservé par « sa ».
theological_decisions:
- issue: Référent du suffixe masculin singulier dans לְאֵדוֹ
  choice: 'Le suffixe renvoie à Dieu : « sa vapeur ».'
  alternative: Un sens impersonnel (« de la vapeur » ou « de sa propre vapeur » en parlant de l’eau), ou une modification textuelle donnant un pluriel.
  rationale: Dieu demeure le sujet du passage et celui qui gouverne les phénomènes naturels. Conserver le suffixe masculin singulier respecte le texte massorétique sans effacer son accent sur l’action divine.
translation_notes:
  register: Français international moderne, poétique mais accessible. « Attire » évite l’expression plus technique « fait monter » tout en rendant le mouvement suggéré par le contexte. « Vapeur » est préféré à « brume » dans le texte principal pour la cohérence météorologique ; l’ambiguïté est conservée en note.
