  text: הֶן אֵ֣ל כַּ֭בִּיר וְ/לֹ֣א יִמְאָ֑ס כַּ֝בִּ֗יר כֹּ֣חַֽ לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/005.yaml
  text: Behold[a], God is mighty and does not despise[b]; he is mighty in strength of heart.
translation:
  language: fr
  text: Certes, Dieu est puissant et ne rejette pas[a] ; il est puissant par la force du cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu ne précise pas l’objet. Autres traductions possibles : « ne méprise pas » ou « ne repousse pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la force du cœur » ; cette expression peut évoquer la force d’esprit, l’intelligence ou la fermeté de résolution.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Oui
  rationale: Introduit ici une affirmation emphatique. « Oui » est naturel en français poétique moderne et conserve la force assertive sans l’archaïsme de « Voici ».
- source_word: אֵל
  choice: Dieu
  rationale: אֵל est ici le terme poétique courant désignant Dieu ; aucune expansion en titre particulier n’est nécessaire.
- source_word: כַּבִּיר
  choice: puissant
  rationale: Le mot exprime la grandeur ou la puissance. « Puissant » convient aux deux occurrences et préserve leur répétition.
- source_word: וְלֹא יִמְאָס
  choice: et ne rejette personne
  rationale: מאס peut signifier rejeter, mépriser ou repousser. Le texte hébreu n’exprime pas l’objet ; « personne » explicite avec retenue le sens humain vraisemblablement sous-entendu, tandis qu’une note signale l’ellipse.
- source_word: כֹּחַ לֵב
  choice: la force du cœur
  rationale: 'Cette traduction conserve l’image hébraïque et son ambiguïté : לֵב peut évoquer l’intelligence, la résolution ou les facultés intérieures.'
theological_decisions:
- issue: Objet implicite de « ne rejette pas »
  choice: ne rejette personne
  alternative: ne rejette pas / ne méprise pas
  rationale: L’objet n’est pas formulé en hébreu. « Personne » rend la proposition intelligible en français sans lui attribuer un groupe précis ; la note maintient visible l’indétermination du texte source.
- issue: Sens de « force du cœur »
  choice: par la force du cœur
  alternative: puissant en intelligence / ferme dans ses desseins
  rationale: L’expression hébraïque est concise et polysémique. Garder « cœur » évite de réduire ses connotations à la seule intelligence ou à la seule détermination.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « puissant » reproduit celle de כַּבִּיר. « Oui » porte l’emphase de הֶן sans tournure vieillie ; les notes préservent les ambiguïtés lexicales et syntaxiques.
