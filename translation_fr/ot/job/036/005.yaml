  naturalness: La formulation révisée demeure moderne, digne et poétique. « Il ne rejette pas » est elliptique mais recevable dans ce parallélisme concis; la note explicite cette ellipse. « Par la force du cœur » conserve volontairement la formulation imagée et dense de l’hébreu.
