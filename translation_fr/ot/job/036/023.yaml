  verdict: revise
  source_fidelity: 'Le sens principal est globalement fidèle : les deux questions rhétoriques portent, dans le contexte, sur Dieu, sa voie et l’impossibilité de l’accuser d’iniquité. Toutefois, la note a actuelle (« l’a chargé de suivre sa voie ») modifie la relation syntaxique et le sens : elle fait de Dieu celui qui reçoit une mission de suivre sa propre voie, plutôt que l’objet d’une prescription ou d’une assignation concernant sa voie.'
  naturalness: « Qui lui a prescrit sa voie ? » est plus proche de דַּרְכּוֹ (« sa voie/son chemin ») tout en restant naturel dans un français moderne et soutenu. La formulation conserve la métaphore sans la réduire à la seule conduite morale.
  terminology: « Voie » rend directement דֶּרֶךְ et préserve sa portée de chemin, de ligne d’action ou de manière d’agir. « Injustice » rend bien עַוְלָה; « agir injustement » constitue une alternative française fidèle sans élargir le terme à « le mal » en général.
