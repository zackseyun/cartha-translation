source:
  edition: WLC
  text: מִֽי פָקַ֣ד עָלָ֣י/ו דַּרְכּ֑/וֹ וּ/מִֽי אָ֝מַ֗ר פָּעַ֥לְתָּ עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/023.yaml
  text: Who has appointed his way for him? Or who has said[b][a], ‘You have done wrong’?”
translation:
  language: fr
  text: 'Qui lui a prescrit sa voie[a] ? Qui lui a dit : « Tu as commis une injustice[b] » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui lui a fixé sa voie ? » Le verbe hébreu peut aussi évoquer le fait d’assigner, de prescrire ou de surveiller.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Tu as agi injustement » ou « Tu as commis un tort ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif introduit deux questions rhétoriques et se traduit directement par « Qui ».
- source_word: פָקַד עָלָיו דַּרְכּוֹ
  choice: lui a prescrit sa conduite
  rationale: פָקַד peut exprimer l’idée de confier, fixer, prescrire ou surveiller. Avec דַּרְכּוֹ, « sa conduite » désigne ici la voie ou la manière d’agir de Dieu. « Prescrire » rend naturellement l’idée qu’une autorité extérieure lui imposerait une ligne de conduite.
- source_word: וּמִי אָמַר
  choice: Qui lui a dit
  rationale: La conjonction relie une seconde question rhétorique. En français, la juxtaposition de deux interrogations est plus naturelle que « Et qui » ou « Ou qui », sans altérer leur lien.
- source_word: פָּעַלְתָּ
  choice: Tu as commis
  rationale: Le verbe signifie faire ou accomplir. Avec עַוְלָה, le français idiomatique emploie « commettre une injustice ».
- source_word: עַוְלָה
  choice: une injustice
  rationale: Le nom désigne l’injustice, le tort ou l’iniquité. « Injustice » conserve ici la portée morale et judiciaire du terme.
theological_decisions:
- issue: Référent des suffixes masculins et du verbe à la deuxième personne
  choice: Les pronoms renvoient à Dieu dans le contexte, sans ajout explicatif dans le corps du verset.
  alternative: Comprendre les formes comme visant de manière plus générale un souverain ou un homme puissant.
  rationale: Job 36.22-23 célèbre la grandeur et la justice de Dieu. Le contexte identifie donc naturellement Dieu comme référent, tout en permettant au français de conserver les pronoms ordinaires sans ajouter son nom.
- issue: Portée de la question sur la voie de Dieu
  choice: « lui a prescrit sa conduite » présente l’idée que personne ne peut fixer à Dieu sa manière d’agir.
  alternative: « l’a chargé de suivre cette voie » ou « a surveillé sa voie » mettrait davantage l’accent sur une mission confiée ou une inspection.
  rationale: La construction hébraïque reste lexicalement ouverte. Le texte principal retient le sens contextuellement probable d’une voie prescrite, tandis que la note conserve les autres nuances réelles.
translation_notes:
  register: Français moderne, international et digne. Les questions rhétoriques sont formulées avec simplicité. « Conduite » conserve le sens métaphorique de דֶּרֶךְ tout en évitant la tournure peu naturelle « prescrire son chemin ». Les marqueurs [a] et [b] figurent immédiatement après les expressions concernées.
