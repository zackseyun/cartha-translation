    rationale: « Qui l’a chargé de suivre sa voie ? » introduit l’idée que le référent doit suivre une voie qui lui est assignée. La construction source concerne plutôt quelqu’un qui prescrit, fixe ou assigne sa voie au référent. La note doit exposer l’ambiguïté lexicale sans créer cette reformulation interprétative.
  - severity: low
    issue: « Sa conduite » est plus interprétatif que nécessaire pour דֶּרֶךְ.
    rationale: Le terme peut convenir au contexte, mais « sa voie » conserve plus exactement l’image et l’ouverture sémantique de l’hébreu.
