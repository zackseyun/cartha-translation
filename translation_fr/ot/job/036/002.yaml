    rationale: 'Cette expression suggère normalement : « ne pars pas avant que j’arrive ». Ici, l’appel est à patienter encore un peu pendant qu’Élihou poursuit son argumentation. « Sois encore un peu patient avec moi » conserve le sens sans cette implication étrangère au contexte.'
  revised_text: Sois encore un peu patient avec moi, et je vais t’expliquer, car j’ai encore des paroles à dire en faveur de Dieu.
