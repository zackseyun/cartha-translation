  text: יַגִּ֣יד עָלָ֣י/ו רֵע֑/וֹ מִ֝קְנֶ֗ה אַ֣ף עַל עוֹלֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/033.yaml
  text: Its thunder declares concerning him[a]; the cattle also[b], concerning what is rising.
translation:
  language: fr
  text: 'Son grondement parle de lui[a] ;

    le bétail aussi, de ce qui monte[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu est difficile. Littéralement, on pourrait lire « son compagnon » plutôt que « son grondement » ; beaucoup comprennent toutefois ce mot comme une évocation du bruit de l’orage.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « le bétail aussi parle de l’orage qui monte ». La fin du verset désigne probablement un orage qui approche, mais l’hébreu dit seulement « ce qui monte ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יַגִּיד
  choice: l’annonce
  rationale: Le hiphil de נגד signifie couramment « déclarer, annoncer, faire connaître ». « L’annonce » convient au registre poétique et permet naturellement le pronom complément.
- source_word: עָלָיו
  choice: l’
  rationale: Le syntagme signifie littéralement « à son sujet / à son propos ». Le pronom « l’ » rend cette relation sans identifier plus précisément le référent, qui reste incertain dans ce verset difficile.
- source_word: רֵעוֹ
  choice: son tonnerre
  rationale: La forme consonantique peut se comprendre littéralement comme « son compagnon », mais, dans le contexte météorologique, elle est souvent rattachée au bruit de l’orage. « Son tonnerre » donne un sens cohérent tout en signalant l’autre lecture en note.
- source_word: מִקְנֶה
  choice: le bétail
  rationale: Le nom désigne le plus souvent le bétail, sens particulièrement plausible ici puisque les animaux peuvent manifester l’approche d’un orage.
- source_word: אַף
  choice: aussi
  rationale: La particule ajoute un second témoin ou signe ; « aussi » restitue simplement cette extension.
- source_word: עַל
  choice: au sujet de
  rationale: Cette formulation garde le sens neutre de « concernant » sans imposer une relation plus précise.
- source_word: עוֹלֶה
  choice: ce qui monte
  rationale: Le participe qal de עלה signifie « monter, s’élever ». Comme son référent n’est pas exprimé, « ce qui monte » conserve l’indétermination de l’hébreu plutôt que d’ajouter explicitement « l’orage » ou « la nuée ».
