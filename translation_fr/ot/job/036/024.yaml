source:
  edition: WLC
  text: זְ֭כֹר כִּֽי תַשְׂגִּ֣יא פָעֳל֑/וֹ אֲשֶׁ֖ר שֹׁרְר֣וּ אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/024.yaml
  text: Remember that you should magnify his work[a], of which men have sung.
translation:
  language: fr
  text: Souviens-toi d’exalter son œuvre[a], dont les hommes ont chanté les louanges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que les hommes ont contemplée » ou « que les hommes ont regardée ». Le verbe hébreu שֹׁרְרוּ est difficile ; certains le comprennent au sens de voir plutôt que de chanter.
    reason: Alternative lexicale préservant l’incertitude du verbe hébreu.
lexical_decisions:
- source_word: זְכֹר
  choice: Souviens-toi
  rationale: Impératif masculin singulier de זכר; cette formulation est directe, naturelle et digne en français moderne.
- source_word: כִּי
  choice: d’exalter
  rationale: כִּי introduit ici le contenu de l’exhortation. En français, la construction « se souvenir de + infinitif » exprime naturellement ce lien sans calquer lourdement « souviens-toi que tu dois ».
- source_word: תַשְׂגִּיא
  choice: exalter
  rationale: Le hiphil de שׂגא/שׂגה signifie rendre grand, magnifier ou célébrer la grandeur. « Exalter » conserve la force exhortative et convient à l’œuvre de Dieu.
- source_word: פָעֳלוֹ
  choice: son œuvre
  rationale: פֹּעַל désigne une œuvre, une action ou un acte. « Son œuvre » garde ici la portée générale du terme et le pronom de l’hébreu.
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif rattache la proposition suivante à « son œuvre »; « que » est idiomatique lorsque שֹׁרְרוּ est compris au sens de chanter ou célébrer.
- source_word: שֹׁרְרוּ
  choice: ont chantée
  rationale: La lecture traditionnelle comprend ce verbe poétique au sens de chanter ou célébrer. L’accord avec « œuvre » rend la phrase naturelle; l’autre interprétation, « contempler », est conservée en note.
- source_word: אֲנָשִׁים
  choice: les hommes
  rationale: Le nom masculin pluriel désigne ici les êtres humains dans une formulation représentative. « Les hommes » conserve explicitement la forme masculine de la source.
theological_decisions:
- issue: Référent du suffixe masculin singulier dans פָעֳלוֹ
  choice: « son œuvre », l’œuvre de Dieu selon le contexte
  alternative: Expliciter « l’œuvre de Dieu »
  rationale: Le contexte identifie Dieu comme référent, mais la traduction maintient le pronom de l’hébreu au lieu d’expliciter ce que le texte laisse contextuel.
- issue: Sens du verbe שֹׁרְרוּ
  choice: « ont chantée »
  alternative: « ont contemplée » ou « ont regardée »
  rationale: La compréhension traditionnelle comme chant ou célébration convient au parallélisme poétique, mais la forme hébraïque est difficile et peut être rattachée à un verbe de vision; cette ambiguïté est signalée en note.
- issue: Portée de אֲנָשִׁים
  choice: « les hommes »
  alternative: « les humains » ou « les gens »
  rationale: Le choix conserve le masculin pluriel de la source sans limiter nécessairement l’énoncé à tous les hommes ni exclure les femmes de sa portée représentative.
translation_notes:
  register: Français international moderne, poétique et digne. La tournure concise « Souviens-toi d’exalter » évite un calque pesant tout en maintenant l’exhortation. Le marqueur [a] figure immédiatement après le segment concerné.
