source:
  edition: WLC
  text: לֹֽא יִגְרַ֥ע מִ/צַּדִּ֗יק עֵ֫ינָ֥י/ו וְ/אֶת מְלָכִ֥ים לַ/כִּסֵּ֑א וַ/יֹּשִׁיבֵ֥/ם לָ֝/נֶ֗צַח וַ/יִּגְבָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/007.yaml
  text: He does not withdraw his eyes from the righteous[a], but with kings on the throne he seats them forever[b], and they are exalted.
translation:
  language: fr
  text: Il ne détourne pas les yeux des justes[a], mais il les fait siéger pour toujours avec des rois sur le trône, et ils sont élevés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et les rois sur le trône, il les fait siéger pour toujours ». L’hébreu est très concis ; certains comprennent que cette proposition parle directement des rois, plutôt que des justes siégeant avec eux.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « et il les élève ». Le dernier verbe peut être compris activement, Dieu étant alors le sujet sous-entendu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְרַע
  choice: détourne
  rationale: Le verbe גרע signifie retrancher, diminuer ou retirer. Avec « les yeux », « détourner les yeux de » rend naturellement en français l’idée de cesser de regarder ou de veiller, tout en conservant l’image concrète de l’hébreu.
- source_word: מִצַּדִּיק
  choice: des justes
  rationale: L’adjectif substantivé au singulier a ici une valeur générique ou collective. Le pluriel français « les justes » exprime cette catégorie sans limiter le propos à un seul homme.
- source_word: עֵינָיו
  choice: les yeux
  rationale: La traduction conserve l’anthropomorphisme hébreu plutôt que de l’abstraire en « attention » ou « sollicitude ». Le possessif est naturellement intégré à la construction française « détourner les yeux ».
- source_word: וְאֶת מְלָכִים לַכִּסֵּא
  choice: avec des rois sur le trône
  rationale: La proposition hébraïque est très compacte et elliptique. Cette formulation suit la lecture selon laquelle les justes sont placés dans une position d’honneur avec des rois, sans ajouter un verbe fini absent du texte.
- source_word: וַיֹּשִׁיבֵם
  choice: il les fait siéger
  rationale: Le hiphil de ישׁב signifie « faire asseoir » ou « faire siéger ». « Faire siéger » convient au cadre royal sans aller jusqu’au plus interprétatif « introniser ».
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: Cette expression française courante rend la durée continue exprimée par לָנֶצַח et garde la solennité poétique du passage.
- source_word: וַיִּגְבָּהוּ
  choice: ils sont élevés
  rationale: La forme et la proposition finale sont concises. La tournure résultative « ils sont élevés » exprime leur accès à une haute position sans imposer explicitement Dieu comme sujet grammatical du dernier verbe.
theological_decisions:
- issue: Langage anthropomorphique décrivant l’attention de Dieu
  choice: Conserver l’image « les yeux »
  alternative: Traduire par « son regard », « son attention » ou « sa sollicitude »
  rationale: L’image concrète présente Dieu comme veillant continuellement sur les justes. La préserver respecte la poésie et la tension du texte sans l’expliquer à la place du lecteur.
- issue: Référent de « les » dans la proposition royale
  choice: Comprendre le pronom comme renvoyant aux justes, qui siègent avec des rois
  alternative: Le comprendre comme renvoyant aux rois, que Dieu établit durablement sur le trône
  rationale: Le juste collectif fournit naturellement l’antécédent du pronom pluriel, mais la syntaxe hébraïque reste compacte. Une note signale donc honnêtement l’autre analyse possible.
- issue: Sujet de la dernière proposition
  choice: Employer la formulation résultative « ils sont élevés »
  alternative: 'Traduire activement : « il les élève »'
  rationale: Cette formulation préserve l’idée de leur élévation tout en évitant de trancher silencieusement la concision grammaticale de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. « Faire siéger » conserve le registre royal sans employer le plus interprétatif « introniser ». Le point-virgule clarifie la longue construction poétique, tandis que les notes maintiennent les ambiguïtés syntaxique et verbale du texte hébreu.
