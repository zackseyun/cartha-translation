source:
  edition: WLC
  text: תָּמֹ֣ת בַּ/נֹּ֣עַר נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם בַּ/קְּדֵשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/014.yaml
  text: They die in youth[a], and their life ends among the male cult prostitutes.
translation:
  language: fr
  text: Ils meurent dans leur jeunesse, et leur vie s’achève parmi les prostitués cultuels[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les consacrés ». Le terme hébreu désigne probablement des hommes associés à la prostitution pratiquée dans certains cultes.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּמֹת
  choice: meurent
  rationale: Le qal inaccompli de מות a pour sujet sémantique נַפְשָׁם. Le pluriel français rend naturellement la référence collective portée par le suffixe « leur ».
- source_word: בַּנֹּעַר
  choice: dans leur jeunesse
  rationale: נֹעַר désigne la jeunesse ou le début de la vie. L’ajout du possessif est naturel en français et explicite la relation donnée par le contexte.
- source_word: נַפְשָׁם
  choice: ils
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne. Ici, « ils meurent » rend l’expression idiomatiquement sans suggérer que seule une composante immatérielle meurt.
- source_word: וְחַיָּתָם
  choice: leur vie s’achève
  rationale: Le nom renvoie ici à leur vie ou à leur existence. Le verbe « s’achève », sous-entendu par le parallélisme avec « meurent », permet une phrase française complète sans changer le sens du second membre.
- source_word: בַּקְּדֵשִׁים
  choice: parmi les prostitués des sanctuaires
  rationale: Le pluriel masculin קְדֵשִׁים désigne vraisemblablement ici des hommes associés à des pratiques sexuelles cultuelles. Cette formulation moderne conserve le masculin et le cadre religieux sans employer le terme traditionnel imprécis et chargé « sodomites ».
theological_decisions:
- issue: Sens de קְדֵשִׁים
  choice: les prostitués des sanctuaires
  alternative: les consacrés
  rationale: Dans plusieurs emplois bibliques, קָדֵשׁ désigne probablement un homme lié à une prostitution cultuelle plutôt qu’une personne sainte au sens général. Une note conserve toutefois le sens étymologique possible, car l’identification précise demeure discutée.
- issue: Prédicat du second membre
  choice: leur vie s’achève
  alternative: et leur vie parmi les prostitués des sanctuaires
  rationale: L’hébreu omet un second verbe dans le parallélisme. Le français demande ici de reprendre explicitement l’idée de la mort; « s’achève » le fait sans prétendre traduire un verbe distinct.
translation_notes:
  register: Français international actuel, sobre et digne. « Prostitués des sanctuaires » est plus accessible que « prostitués cultuels » et moins ambigu que « prostitués sacrés »; le marqueur de note est placé sur le terme auquel il se rapporte.
