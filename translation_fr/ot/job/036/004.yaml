  text: כִּֽי אָ֭מְנָם לֹא שֶׁ֣קֶר מִלָּ֑/י תְּמִ֖ים דֵּע֣וֹת עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/004.yaml
  text: For truly[a], my words are not false; one perfect in knowledge is with you.
translation:
  language: fr
  text: Car vraiment, mes paroles ne sont pas fausses ; celui qui est parfait en connaissance est avec toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte peut aussi désigner Dieu, plutôt qu’Élihou lui-même, comme celui qui est parfait en connaissance et qui est avec toi.
    reason: La construction hébraïque ne nomme pas explicitement le référent de « celui qui est parfait en connaissance ».
lexical_decisions:
- source_word: כִּי אָמְנָם
  choice: Car vraiment
  rationale: כִּי relie l’affirmation à ce qui précède, tandis que אָמְנָם la renforce. « Car vraiment » conserve à la fois le lien logique et l’insistance, dans un français actuel.
- source_word: לֹא שֶׁקֶר מִלָּי
  choice: mes paroles ne sont pas fausses
  rationale: La tournure rend directement la négation de la fausseté appliquée aux paroles d’Élihou, sans ajouter l’idée plus précise de tromperie intentionnelle.
- source_word: תְּמִים
  choice: parfaite
  rationale: Le terme exprime ici l’intégrité ou la complétude. « Parfaite » préserve la force rhétorique audacieuse de l’hébreu sans transformer explicitement cette qualité en perfection morale.
- source_word: דֵּעוֹת
  choice: connaissance
  rationale: Le pluriel hébreu peut naturellement désigner la connaissance comme notion abstraite ; le singulier est idiomatique en français.
- source_word: עִמָּךְ
  choice: est avec toi
  rationale: Cette traduction directe conserve la proximité exprimée par la préposition et l’adresse personnelle à Job.
theological_decisions:
- issue: Référent de « celui dont la connaissance est parfaite »
  choice: La formulation principale permet de comprendre qu’Élihou parle de lui-même à la troisième personne.
  alternative: La proposition peut désigner Dieu comme celui dont la connaissance est parfaite et qui est avec Job.
  rationale: Le contexte immédiat, où Élihou défend ses propres paroles, favorise l’autoréférence. Cependant, la construction hébraïque ne nomme pas explicitement le sujet, et une lecture renvoyant à Dieu demeure possible. Le texte et la note conservent donc cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu afin de préserver l’ambiguïté du sujet dans la seconde proposition.
