source:
  edition: WLC
  text: וַ/יַּגֵּ֣ד לָ/הֶ֣ם פָּעֳלָ֑/ם וּ֝/פִשְׁעֵי/הֶ֗ם כִּ֣י יִתְגַּבָּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/009.yaml
  text: then he declares to them their deeds and their transgressions[a], that they have acted arrogantly.
translation:
  language: fr
  text: 'Alors il leur fait connaître leurs actes et leurs transgressions : ils se sont montrés arrogants[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plus littéralement, « ils se sont montrés forts » ou « ils se sont rendus puissants ». Dans ce contexte, le sens est probablement celui de l’auto-exaltation ou de l’arrogance. On peut aussi comprendre כִּי au sens de « parce qu’ils se sont montrés arrogants ».
    reason: La forme verbale peut évoquer la force ou la puissance, tandis que le contexte moral favorise le sens d’arrogance. La conjonction כִּי peut aussi être comprise causalement.
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: Alors il leur révèle
  rationale: Le hiphil de נגד signifie « faire connaître, annoncer, déclarer ». « Révèle » convient ici à l’action de Dieu qui met les fautes au jour; « alors » rend naturellement le waw dans la séquence du contexte.
- source_word: לָהֶם
  choice: leur
  rationale: Le pronom complément indirect rend directement la préposition ל avec son suffixe.
- source_word: פָּעֳלָם
  choice: leurs actes
  rationale: Le nom désigne ce qu’ils ont fait. « Actes » est naturel en français et conserve ici la portée morale sans suggérer un travail professionnel.
- source_word: וּפִשְׁעֵיהֶם
  choice: et leurs révoltes
  rationale: פשע désigne souvent une rupture volontaire avec une autorité légitime, donc une révolte ou une transgression. « Révoltes » préserve cette nuance forte et reste intelligible.
- source_word: כִּי
  choice: ':'
  rationale: כִּי introduit vraisemblablement le contenu de ce que Dieu leur fait connaître. En français, les deux-points expriment cette relation avec naturel sans imposer une lecture causale.
- source_word: יִתְגַּבָּרוּ
  choice: ils se sont élevés avec arrogance
  rationale: Le hitpael de גבר évoque littéralement le fait de se rendre fort ou de prendre le dessus sur soi-même; dans ce cadre moral, il exprime probablement l’orgueilleuse affirmation de soi. La formulation retient à la fois l’image d’élévation et sa nuance éthique.
theological_decisions:
- issue: Nuance morale de יִתְגַּבָּרוּ
  choice: ils se sont élevés avec arrogance
  alternative: ils se sont rendus forts / ils ont prévalu
  rationale: Le parallèle avec « leurs révoltes » favorise une interprétation morale d’auto-exaltation. La traduction ne condamne pas la force en elle-même, mais désigne l’arrogance comme caractère de leur conduite, tout en signalant en note le sens plus littéral.
- issue: Relation syntaxique de כִּי
  choice: contenu de la révélation, rendu par deux-points
  alternative: 'cause : « parce qu’ils… »'
  rationale: Après un verbe de déclaration, כִּי peut introduire ce qui est déclaré. Cette lecture s’intègre bien à la syntaxe, mais la possibilité causale demeure réelle et est préservée dans la note.
translation_notes:
  register: Français international moderne, sobre et digne. « Révoltes » garde la force relationnelle de פשע; la formulation évite un vocabulaire confessionnel spécialisé. Le marqueur [a] figure dans le texte.
