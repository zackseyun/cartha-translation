  text: which the clouds pour down[a]; they drip abundantly on man.
translation:
  language: fr
  text: que les nuages déversent et répandent en abondance sur les humains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « sur l’humain » ou « sur l’homme » ; le singulier אָדָם désigne ici l’humanité en général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif rattache ce verset à ce qui précède et conserve la structure subordonnée de l’hébreu.
- source_word: יִזְּלוּ
  choice: laissent couler
  rationale: Le verbe נזל évoque un écoulement, ici celui des gouttes d’eau descendant des nuages.
- source_word: שְׁחָקִים
  choice: les nuages
  rationale: Dans cette évocation poétique des phénomènes météorologiques, le terme désigne les nuages plutôt que le ciel de manière générale.
- source_word: יִרְעֲפוּ
  choice: ils les font pleuvoir
  rationale: Le verbe רָעַף décrit ce qui tombe en gouttes ou en pluie. Cette formulation française naturelle maintient l’image de la pluie ; le pronom « les » reprend les gouttes mentionnées dans le contexte immédiat.
- source_word: עֲלֵי
  choice: sur
  rationale: La préposition exprime ici la pluie qui descend sur ceux qui se trouvent en dessous.
- source_word: אָדָם
  choice: les humains
  rationale: Le singulier hébreu est employé collectivement pour l’humanité. Le pluriel français exprime naturellement cette valeur générique sans restreindre le référent aux hommes de sexe masculin.
- source_word: רָב
  choice: en abondance
  rationale: L’adjectif est compris adverbialement et indique la quantité abondante de pluie.
theological_decisions:
- issue: Valeur générique de אָדָם
  choice: les humains
  alternative: l’être humain / l’homme
  rationale: Dans ce contexte, אָדָם désigne collectivement l’humanité. « Les humains » rend clairement cette portée en français moderne, tandis que la note signale le singulier de l’original.
- issue: Rapport de רָב avec la proposition
  choice: en abondance
  alternative: sur une multitude d’humains
  rationale: La lecture adverbiale, qui qualifie la chute de la pluie, correspond bien au parallélisme et à l’usage poétique. La construction hébraïque reste toutefois assez concise pour permettre de discuter un rattachement nominal.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le début en « que » conserve le lien syntaxique avec le verset précédent. Le point-virgule reflète les deux membres parallèles du vers hébreu.
