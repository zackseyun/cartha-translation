source:
  edition: WLC
  text: וְֽ/חַנְפֵי לֵ֭ב יָשִׂ֣ימוּ אָ֑ף לֹ֥א יְ֝שַׁוְּע֗וּ כִּ֣י אֲסָרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/013.yaml
  text: But the godless in heart store up anger[b][a]; they do not cry for help when he binds them.
translation:
  language: fr
  text: Mais ceux dont le cœur est impie[b] nourrissent la colère ; ils ne crient pas au secours quand il les lie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parce qu’il les lie ». La conjonction hébraïque peut exprimer la cause plutôt que le temps.
    reason: alternative_reading
  - marker: b
    text: L’expression peut aussi se traduire par « les hypocrites de cœur » ou « ceux dont le cœur est irréligieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנְפֵי לֵב
  choice: ceux dont le cœur est impie
  rationale: חנף peut désigner des personnes impies, irréligieuses ou hypocrites. Dans Job, « impie » exprime mieux l'irrévérence envers Dieu que la seule duplicité sociale ; la tournure avec « cœur » conserve l'accent sur la disposition intérieure tout en restant naturelle en français.
- source_word: יָשִׂימוּ אָף
  choice: nourrissent la colère
  rationale: Littéralement, l'expression signifie « placer la colère ». « Nourrir la colère » rend idiomatiquement l'idée de la garder et de l'entretenir intérieurement, sans décider qu'il s'agit de la colère divine.
- source_word: לֹא יְשַׁוְּעוּ
  choice: ils ne crient pas au secours
  rationale: Au piel, שׁוע signifie couramment crier afin d'obtenir de l'aide. « Crier au secours » est une formulation française naturelle et précise.
- source_word: כִּי
  choice: quand
  rationale: 'Le contexte permet une valeur temporelle : ils ne demandent pas d''aide au moment où ils sont liés ou frappés. La valeur causale « parce que » demeure possible et est signalée en note.'
- source_word: אֲסָרָם
  choice: il les lie
  rationale: אָסַר signifie lier, attacher, enchaîner ou emprisonner. « Il les lie » reste proche du texte et assez large pour évoquer la contrainte par l'épreuve. Le sujet singulier, compris contextuellement comme Dieu, demeure pronominal comme en hébreu.
theological_decisions:
- issue: Référent du sujet singulier dans « il les lie »
  choice: Conserver « il », qui renvoie contextuellement à Dieu.
  alternative: 'Expliciter : « Dieu les lie ».'
  rationale: L'hébreu présente un verbe à la troisième personne du singulier sans nommer ici le sujet. Le contexte permet d'identifier Dieu, mais le pronom préserve la forme et la discrétion du texte source.
- issue: Identité du détenteur de la colère
  choice: Comprendre que les impies nourrissent eux-mêmes la colère, sans ajouter de possessif.
  alternative: Comprendre qu'ils accumulent contre eux la colère divine.
  rationale: Le sujet de יָשִׂימוּ est « ceux dont le cœur est impie », et la construction autorise naturellement l'idée qu'ils entretiennent la colère. L'absence de possessif en français évite toutefois de surdéterminer le rapport exact.
translation_notes:
  register: Français international moderne, digne et accessible. « Ceux dont le cœur est impie » conserve l'image intérieure de לֵב sans reproduire maladroitement l'expression « impies de cœur ». Les deux appels de note figurent dans le texte principal et suivent le terme ou la proposition concernés.
