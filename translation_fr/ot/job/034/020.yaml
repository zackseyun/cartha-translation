  text: רֶ֤גַע יָמֻתוּ֮ וַ/חֲצ֪וֹת לָ֥יְלָה יְגֹעֲשׁ֣וּ עָ֣ם וְ/יַעֲבֹ֑רוּ וְ/יָסִ֥ירוּ אַ֝בִּ֗יר לֹ֣א בְ/יָֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/020.yaml
  text: In a moment they die; at midnight a people are shaken[a], and they pass away; the mighty are removed, not by hand.
translation:
  language: fr
  text: En un instant, ils meurent ; à minuit, un peuple est ébranlé et disparaît ; le puissant est enlevé sans qu’aucune main intervienne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « non par une main » ; l’expression peut signifier « sans intervention humaine ».'
    reason: La note conserve la formulation littérale inhabituelle et indique, sans l’imposer dans le texte, son sens probable concernant l’absence d’agent humain.
lexical_decisions:
- source_word: רֶגַע
  choice: en un instant
  rationale: Le nom désigne un très bref moment. Cette formulation française conserve directement la soudaineté temporelle sans préciser davantage la manière.
- source_word: יָמֻתוּ
  choice: ils meurent
  rationale: Le verbe courant מות signifie « mourir » ; le présent français rend ici l’énoncé général et saisissant du discours.
- source_word: וַחֲצוֹת לָיְלָה
  choice: au milieu de la nuit
  rationale: La locution signifie littéralement « à la moitié de la nuit » et peut désigner minuit. « Au milieu de la nuit » reste naturel tout en conservant la portée descriptive de l’hébreu.
- source_word: יְגֹעֲשׁוּ
  choice: est ébranlé
  rationale: La racine געש exprime une secousse, une agitation ou un bouleversement. « Est ébranlé » convient au collectif singulier עָם et préserve cette amplitude sémantique.
- source_word: עָם
  choice: un peuple
  rationale: Le nom collectif singulier est rendu comme tel, sans le transformer en pluriel ni lui ajouter une détermination absente.
- source_word: וְיַעֲבֹרוּ
  choice: et disparaît
  rationale: עבר signifie d’abord « passer ». Dans ce contexte de mort et de suppression soudaine, « disparaît » exprime naturellement l’aboutissement sans répéter « meurt ».
- source_word: וְיָסִירוּ
  choice: est écarté
  rationale: Le hiphil de סור signifie enlever ou écarter. Bien que la forme hébraïque soit active à sujet pluriel non exprimé, le passif français garde l’agent indéterminé et s’accorde avec « sans l’intervention d’aucune main ».
- source_word: אַבִּיר
  choice: le puissant
  rationale: Le substantif singulier désigne une personne forte ou puissante. Le singulier français respecte la forme hébraïque sans décider s’il s’agit d’un individu représentatif ou d’une catégorie.
- source_word: לֹא בְיָד
  choice: sans l’intervention d’aucune main
  rationale: La formulation conserve l’image hébraïque de la main tout en étant intelligible en français. Elle laisse ouverte dans le texte la question précise de l’agent.
theological_decisions:
- issue: L’agent sous-entendu par « pas par une main »
  choice: Conserver l’image de la main et ne pas nommer explicitement Dieu comme agent.
  alternative: sans intervention humaine
  rationale: Le contexte peut suggérer une action divine indépendante des moyens humains, mais l’hébreu dit seulement « pas par main ». La traduction maintient donc cette tension au lieu d’expliciter une conclusion théologique.
- issue: Nombre et portée de אַבִּיר
  choice: le puissant, au singulier
  alternative: les puissants
  rationale: Le singulier hébreu peut avoir une valeur représentative, mais le rendre au singulier évite de trancher entre un individu déterminé et une catégorie collective.
translation_notes:
  register: Français international moderne, sobre et digne. Le rythme en trois propositions séparées par des points-virgules reflète la progression abrupte du verset. « Ébranlé » et « écarté » gardent la force du jugement sans employer un vocabulaire confessionnel spécialisé.
