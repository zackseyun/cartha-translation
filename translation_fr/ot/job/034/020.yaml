  source_fidelity: La progression temporelle et les principaux termes sont bien rendus. Toutefois, « sans l’intervention d’aucune main » paraphrase déjà l’idiome et alourdit inutilement l’expression. « Enlevé » rend plus directement le hiphil de סור dans ce contexte que « écarté », qui peut évoquer une simple mise à l’écart.
  naturalness: Le français est globalement naturel et le rythme ternaire convient au verset. « À minuit » est plus direct et plus idiomatique que « au milieu de la nuit » pour חֲצוֹת לָיְלָה. « Sans qu’aucune main intervienne » est naturel tout en gardant l’image et l’indétermination de l’hébreu.
  terminology: « Un peuple », « est ébranlé » et « le puissant » respectent utilement le collectif et les singuliers du texte. La formulation révisée sur « main » évite de poser explicitement dans le texte l’interprétation « humaine » ou l’agent divin.
