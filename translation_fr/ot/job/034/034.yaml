  yaml_path: translation/ot/job/034/034.yaml
  text: Men of understanding will say to me[a], and a wise man who hears me,
translation:
  language: fr
  text: Les hommes de discernement[a] me diront, et un homme sage qui m’écoute,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « hommes de cœur », expression hébraïque désignant des personnes douées d’intelligence ou de discernement.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי לֵבָב
  choice: Les hommes de discernement
  rationale: Littéralement « hommes de cœur ». En hébreu, le cœur peut désigner le siège de la pensée et du jugement. « Hommes de discernement » restitue naturellement ici la valeur de l’expression tout en conservant sa forme masculine.
- source_word: יֹאמְרוּ לִי
  choice: me diront
  rationale: 'La forme yiqtol peut avoir ici une valeur future : Élihou annonce ce que reconnaîtront les auditeurs capables de discernement.'
- source_word: וְגֶבֶר חָכָם
  choice: ainsi que tout homme sage
  rationale: גֶבֶר désigne ici un homme, en parallèle avec les « hommes de discernement ». Le singulier indéfini a une portée générale, rendue naturellement en français par « tout homme sage » ; « ainsi que » indique que le verbe « me diront » vaut aussi pour ce second sujet.
- source_word: שֹׁמֵעַ לִי
  choice: qui m’écoute
  rationale: Le participe qualifie l’homme sage. « M’écoute » exprime plus naturellement que « m’entend » l’attention portée aux paroles d’Élihou, sans impliquer nécessairement son approbation.
