source:
  edition: WLC
  text: אֲשֶׁ֣ר עַל כֵּ֭ן סָ֣רוּ מֵֽ/אַחֲרָ֑י/ו וְ/כָל דְּ֝רָכָ֗י/ו לֹ֣א הִשְׂכִּֽילוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/027.yaml
  text: because they turned aside from following him[b][a], and they did not understand any of his ways.
translation:
  language: fr
  text: 'parce qu’ils se sont détournés de lui[a]

    et n’ont prêté attention à aucune de ses voies[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils se sont écartés de derrière lui », expression hébraïque signifiant qu’ils ont cessé de le suivre.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et n’ont compris aucune de ses voies » ; ou encore : « et n’ont tenu compte d’aucune de ses voies ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר עַל כֵּן
  choice: parce que
  rationale: La locution introduit ici la raison du jugement décrit dans le contexte. « Parce que » en restitue naturellement la valeur causale.
- source_word: סָרוּ מֵאַחֲרָיו
  choice: ils se sont détournés de lui
  rationale: Le verbe סור exprime l’action de se détourner ou de s’écarter, et מֵאַחֲרָיו signifie littéralement « de derrière lui », c’est-à-dire cesser de le suivre. La formulation française conserve la nuance relationnelle sans être artificielle.
- source_word: וְכָל דְּרָכָיו
  choice: à aucune de ses voies
  rationale: Sous la portée de la négation, l’hébreu littéral « toutes ses voies » s’exprime naturellement en français par « aucune de ses voies ». « Voies » garde l’image biblique des conduites, exigences ou manières d’agir.
- source_word: לֹא הִשְׂכִּילוּ
  choice: n’ont prêté attention
  rationale: Le hiphil de שׂכל peut signifier comprendre, considérer ou agir avec discernement. Dans ce contexte, la formulation exprime le défaut d’attention réfléchie sans réduire nécessairement le sens à une incapacité intellectuelle.
theological_decisions:
- issue: Référent des suffixes masculins singuliers dans מֵאַחֲרָיו et דְּרָכָיו
  choice: Conserver les pronoms « lui » et « ses » sans expliciter le nom de Dieu
  alternative: Traduire explicitement « de Dieu » et « les voies de Dieu », ou rapporter les suffixes à un dirigeant terrestre
  rationale: Le contexte du discours d’Élihou indique vraisemblablement Dieu, mais l’hébreu emploie seulement des suffixes pronominaux. La traduction préserve cette forme et l’éventuelle tension référentielle.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme poétique est conservé sur deux lignes. « Voies » maintient l’image traditionnelle tout en restant compréhensible ; les pronoms ne sont pas explicités afin de préserver la formulation de l’hébreu.
