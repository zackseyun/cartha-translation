source:
  edition: WLC
  text: וְ/אָרַ֣ח לְ֭/חֶבְרָה עִם פֹּ֣עֲלֵי אָ֑וֶן וְ֝/לָ/לֶ֗כֶת עִם אַנְשֵׁי רֶֽשַׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/008.yaml
  text: and keeps company with workers of wickedness[b][a], and walks with men of evil.
translation:
  language: fr
  text: 'il va en compagnie de ceux qui font le mal[a]

    et marche avec des hommes méchants.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «il s’associe à ceux qui font le mal». L’hébreu peut évoquer le fait de cheminer en compagnie d’autres personnes ou de se joindre à elles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָרַח לְ/חֶבְרָה
  choice: il va en compagnie
  rationale: L’expression associe un verbe pouvant évoquer le fait de cheminer à un terme signifiant la compagnie; ce rendu conserve à la fois l’image du déplacement et l’idée d’association.
- source_word: עִם
  choice: de / avec
  rationale: La préposition marque l’accompagnement; la tournure française «en compagnie de» puis «avec» la rend naturellement dans les deux membres.
- source_word: פֹּעֲלֵי אָוֶן
  choice: ceux qui font le mal
  rationale: Rend le participe «ceux qui font» et la valeur morale de אָוֶן dans un français courant, sans transformer l’expression en simple qualificatif.
- source_word: וְ/לָ/לֶכֶת
  choice: et marche
  rationale: Conserve l’image hébraïque de la marche, qui peut désigner aussi bien le déplacement que la conduite et les fréquentations.
- source_word: אַנְשֵׁי רֶשַׁע
  choice: des hommes méchants
  rationale: Le nom est explicitement masculin pluriel et רֶשַׁע désigne la méchanceté ou le mal; cette formulation est naturelle et fidèle.
theological_decisions:
- issue: Expression masculine dans אַנְשֵׁי רֶשַׁע
  choice: des hommes méchants
  alternative: des gens méchants / les méchants
  rationale: Le texte hébreu emploie explicitement «hommes de méchanceté»; le masculin est donc conservé sans neutralisation.
- issue: Nature de l’association décrite par וְאָרַח לְחֶבְרָה
  choice: il va en compagnie
  alternative: il s’associe
  rationale: Le choix préserve la possible image du cheminement tout en exprimant l’association morale et sociale, sans trancher inutilement entre déplacement concret et fréquentation.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme entre «va en compagnie» et «marche avec» est maintenu, ainsi que la désignation masculine explicite du second groupe.
