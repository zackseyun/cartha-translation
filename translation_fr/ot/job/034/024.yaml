source:
  edition: WLC
  text: יָרֹ֣עַ כַּבִּירִ֣ים לֹא חֵ֑קֶר וַ/יַּעֲמֵ֖ד אֲחֵרִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/024.yaml
  text: He shatters the mighty without investigation[a], and sets others in their place.
translation:
  language: fr
  text: 'Il brise les puissants sans enquête[a]

    et il établit d’autres à leur place.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans examen » ou « sans recherche ». L’expression hébraïque signifie littéralement « pas de recherche ». Dans ce contexte, elle peut indiquer qu’il n’a pas besoin d’une longue enquête avant de renverser les puissants.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹעַ
  choice: Il brise
  rationale: Le hifil de רעע exprime ici l’action énergique de briser ou de ruiner. « Brise » rend la force et le caractère décisif du renversement sans ajouter l’image plus précise d’un objet réduit en éclats.
- source_word: כַּבִּירִים
  choice: les puissants
  rationale: Le terme désigne des personnes importantes par leur puissance, vraisemblablement des dirigeants ou des notables dans ce contexte. « Les puissants » reste naturel et ne précise pas indûment leur fonction.
- source_word: לֹא חֵקֶר
  choice: sans enquête
  rationale: 'Cette formulation concise demeure proche de l’hébreu, littéralement « pas de recherche/examen », et conserve sa tension : Dieu n’a pas besoin de mener une enquête humaine prolongée avant d’agir. La note signale les autres nuances possibles.'
- source_word: וַיַּעֲמֵד
  choice: établit
  rationale: Le hifil de עמד signifie faire tenir, installer ou établir. « Établit » convient au remplacement de personnes puissantes par d’autres.
- source_word: אֲחֵרִים
  choice: d’autres
  rationale: Le pluriel indéfini désigne les personnes qui prennent la place des puissants renversés.
- source_word: תַּחְתָּם
  choice: à leur place
  rationale: 'Bien que la préposition signifie fondamentalement « sous », elle exprime ici idiomatiquement la substitution : les autres sont établis à la place des puissants.'
theological_decisions:
- issue: Sujet implicite des verbes
  choice: Dieu est rendu par « Il ».
  alternative: Laisser le sujet indéterminé ou comprendre une tournure impersonnelle.
  rationale: Dans le discours d’Élihou, le contexte immédiat décrit le jugement de Dieu sur les dirigeants. Le français exige ici un sujet explicite ; « Il » restitue donc le référent contextuel sans ajout doctrinal.
- issue: Sens de « sans enquête »
  choice: Conserver la formule concise et potentiellement tendue dans le texte, avec une note explicative.
  alternative: Traduire directement « sans avoir besoin d’enquêter » ou « sans examen prolongé ».
  rationale: L’hébreu לֹא חֵקֶר est très condensé. La traduction choisie évite de résoudre silencieusement son ambiguïté, tandis que la note indique le sens contextuel probable sans exclure les nuances lexicales.
translation_notes:
  register: 'Français international moderne, sobre et poétique. Le parallélisme du vers est préservé : renversement des puissants, puis établissement de leurs remplaçants. « Sans enquête » garde la concision et l’ambiguïté de l’hébreu, explicitées en note.'
