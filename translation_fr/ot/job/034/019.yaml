source:
  edition: WLC
  text: אֲשֶׁ֤ר לֹֽא נָשָׂ֨א פְּנֵ֥י שָׂרִ֗ים וְ/לֹ֣א נִכַּר שׁ֭וֹעַ לִ/פְנֵי דָ֑ל כִּֽי מַעֲשֵׂ֖ה יָדָ֣י/ו כֻּלָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/019.yaml
  text: who shows no partiality to princes and does not regard the rich above the poor, for all of them are the work of his hands.
translation:
  language: fr
  text: qui ne fait pas preuve de favoritisme envers les princes et ne fait pas passer le riche avant le pauvre, car tous sont l’œuvre de ses mains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא פְּנֵי שָׂרִים
  choice: ne fait pas de favoritisme envers les princes
  rationale: L’expression idiomatique « relever le visage » signifie ici accorder un traitement de faveur; cette formulation française en restitue clairement le sens tout en conservant « princes » pour שָׂרִים.
- source_word: נִכַּר שׁוֹעַ לִפְנֵי דָל
  choice: ne considère pas le riche plus que le pauvre
  rationale: Le nifal נִכַּר exprime ici le fait de reconnaître ou distinguer quelqu’un; לִפְנֵי marque une préférence ou préséance. « Considère… plus que » conserve cette nuance sans ajouter l’idée plus forte de faveur.
- source_word: שׁוֹעַ
  choice: le riche
  rationale: Dans ce contraste social avec דָל, le terme désigne une personne aisée ou notable; « riche » est naturel et correspond au parallélisme.
- source_word: דָל
  choice: le pauvre
  rationale: Le terme désigne celui qui est faible ou de condition modeste; dans l’antithèse avec שׁוֹעַ, « pauvre » convient au contexte.
- source_word: מַעֲשֵׂה יָדָיו
  choice: l’œuvre de ses mains
  rationale: Cette image concrète et théologiquement significative peut être conservée naturellement en français.
theological_decisions:
- issue: Impartialité divine entre les classes sociales
  choice: Conserver l’affirmation symétrique selon laquelle Dieu n’accorde de préséance ni aux princes ni aux riches.
  alternative: Reformuler plus largement comme une affirmation générale d’égalité humaine.
  rationale: Le texte fonde précisément l’impartialité sur le fait que tous sont créés par ses mains; il convient de préserver ce raisonnement sans l’élargir ni le systématiser.
translation_notes:
  register: Français moderne, digne et accessible. La proposition relative est maintenue, puisque le verset dépend syntaxiquement du contexte précédent. Aucun marqueur de note n’est nécessaire.
