  text: כִּֽי אֶל אֵ֭ל הֶ/אָמַ֥ר נָשָׂ֗אתִי לֹ֣א אֶחְבֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/031.yaml
  text: For has anyone said to God[a], ‘I have borne punishment; I will not offend again’?
translation:
  language: fr
  text: 'Car quelqu’un a-t-il dit à Dieu : « J’ai supporté un châtiment[a] ; je ne ferai pas le mal » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « J’ai porté ; je n’agirai pas de manière corrompue. » L’hébreu ne précise pas ce qui a été porté ; il peut s’agir d’un châtiment, d’une correction ou d’une faute assumée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Le terme relie cette question à l’argument précédent en introduisant une explication ou un motif.
- source_word: אֶל אֵל
  choice: à Dieu
  rationale: La préposition אֶל marque ici le destinataire, et אֵל désigne simplement Dieu dans ce contexte.
- source_word: הֶאָמַר
  choice: quelqu’un a-t-il dit
  rationale: La forme est un parfait à la troisième personne du masculin singulier précédé de l’interrogation. Dans cette question rhétorique, « quelqu’un » exprime naturellement en français la portée indéfinie du sujet, sans imposer un référent précis.
- source_word: נָשָׂאתִי
  choice: J’ai supporté mon châtiment
  rationale: נשׂא signifie fondamentalement « porter » ou « supporter ». L’objet n’est pas exprimé en hébreu ; dans ce contexte, un châtiment ou une correction semble sous-entendu. L’ajout est signalé par une note afin de conserver l’ambiguïté de l’original.
- source_word: לֹא אֶחְבֹּל
  choice: je ne ferai plus de mal
  rationale: 'חבל reçoit ici un sens moral : agir de façon mauvaise ou corrompue. « Faire du mal » est clair et naturel ; « plus » traduit la portée contextuelle de l’engagement à ne pas recommencer.'
theological_decisions:
- issue: Objet implicite de « porter »
  choice: Le texte courant explicite « mon châtiment », avec une note.
  alternative: « J’ai supporté » ou « J’ai porté » sans complément.
  rationale: Le contexte favorise l’idée d’une correction ou d’un châtiment subi, mais l’hébreu ne précise pas l’objet. La note empêche de présenter cette interprétation comme certaine.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure interrogative conserve le caractère rhétorique du verset. Le discours direct reste naturel, tandis que la note signale l’ellipse et l’ambiguïté lexicales de l’hébreu.
