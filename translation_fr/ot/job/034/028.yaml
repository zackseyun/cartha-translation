  text: לְ/הָבִ֣יא עָ֭לָי/ו צַֽעֲקַת דָּ֑ל וְ/צַעֲקַ֖ת עֲנִיִּ֣ים יִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/028.yaml
  text: so as to bring before him the cry of the poor[b][a], and he hears the cry of the afflicted.
translation:
  language: fr
  text: afin de faire parvenir jusqu’à lui[a] le cri du pauvre, et il entend le cri des affligés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faire venir sur lui » ou « porter contre lui » ; la préposition hébraïque permet plusieurs compréhensions ici.
    reason: lexical_alternative
  - marker: b
    text: Ou « des pauvres » ou « des opprimés ». Les deux termes hébreux traduits par « pauvre » et « affligés » ont des sens proches, mais non identiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: afin de faire parvenir
  rationale: L’infinitif construit au hiphil précédé de ל exprime ici le but ou le résultat. « Afin de faire parvenir » restitue cette valeur et convient naturellement à un cri qui atteint l’attention de Dieu.
- source_word: עָלָיו
  choice: jusqu’à lui
  rationale: Avec le mouvement exprimé par בוא au causatif, על peut indiquer que le cri parvient jusqu’à Dieu. Cette formulation reste naturelle tout en signalant en note les autres analyses possibles.
- source_word: צַעֲקַת
  choice: le cri
  rationale: צעקה désigne un cri de détresse ou un appel pressant. « Le cri » est direct, digne et conserve la répétition poétique.
- source_word: דָּל
  choice: du pauvre
  rationale: דַּל peut désigner une personne pauvre, faible ou socialement vulnérable. « Le pauvre » est ici la traduction la plus courante sans exclure la faiblesse sociale.
- source_word: וְצַעֲקַת
  choice: et le cri
  rationale: La répétition du nom hébreu est maintenue afin de préserver le parallélisme rhétorique du vers.
- source_word: עֲנִיִּים
  choice: des malheureux
  rationale: עָנִי peut désigner les pauvres, les affligés ou les opprimés. « Les malheureux » exprime leur détresse sans confondre entièrement ce terme avec דָּל.
- source_word: יִשְׁמָע
  choice: il entend
  rationale: 'Dans ce contexte poétique, l’inaccompli peut exprimer une action caractéristique : Dieu entend de tels cris. Le présent français est concis et naturel.'
theological_decisions:
- issue: Référent du pronom עָלָיו et sujet de יִשְׁמָע
  choice: Le cri parvient jusqu’à Dieu, et Dieu entend le cri des malheureux.
  alternative: Le cri est porté contre l’oppresseur tandis que Dieu l’entend ; ou le cri vient sur l’oppresseur et celui-ci l’entend.
  rationale: Dans le contexte immédiat, Élihou évoque l’oppression exercée par les puissants et l’attention judiciaire de Dieu. Le sujet implicite de « il entend » est donc le plus naturellement Dieu. La note préserve néanmoins l’ambiguïté réelle de la préposition.
translation_notes:
  register: Français international moderne, courant et digne. Le parallélisme et la répétition de « cri » sont conservés. Les notes maintiennent l’ambiguïté prépositionnelle et le chevauchement lexical entre les deux désignations des personnes vulnérables.
