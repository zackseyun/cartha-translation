source:
  edition: WLC
  text: כִּ֤י פֹ֣עַל אָ֭דָם יְשַׁלֶּם ל֑/וֹ וּֽ/כְ/אֹ֥רַח אִ֝֗ישׁ יַמְצִאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/011.yaml
  text: For he repays a man according to his deed[a], and he makes him find according to a man's way.
translation:
  language: fr
  text: Car il rend à chacun selon ses actes[a], et il fait rencontrer à chacun ce qui correspond à sa conduite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il rétribue chacun selon ce qu’il a fait ».'
    reason: Cette formulation explicite la nuance de rétribution du verbe hébreu, tandis que « rend » conserve une expression française concise et parallèle.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la justification de l’affirmation précédente d’Élihou et conserve naturellement la valeur explicative de la conjonction.
- source_word: פֹעַל אָדָם
  choice: les actes de chacun
  rationale: פֹעַל désigne ici ce qu’une personne accomplit, avec une portée morale. Le singulier générique אָדָם est rendu par « chacun », formulation française naturelle et inclusive sans changer sa portée représentative.
- source_word: יְשַׁלֶּם לוֹ
  choice: il rend à chacun selon ses actes
  rationale: Le piel de שׁלם exprime la rétribution. « Rendre à chacun selon ses actes » garde la nuance judiciaire tout en restant idiomatique et digne en français.
- source_word: וּכְאֹרַח אִישׁ
  choice: ce qui correspond à sa conduite
  rationale: אֹרַח signifie littéralement « chemin », mais désigne métaphoriquement la manière de vivre. « Conduite » transmet clairement ce sens dans un français moderne.
- source_word: יַמְצִאֶנּוּ
  choice: il fait retomber sur chacun
  rationale: 'Le hiphil de מצא a ici une valeur causative : faire rencontrer ou éprouver à quelqu’un les conséquences de sa conduite. Cette formulation française exprime ce mouvement sans préciser davantage que l’hébreu la nature de ces conséquences.'
theological_decisions:
- issue: La rétribution divine selon la conduite humaine
  choice: Le verset affirme que Dieu rétribue chaque personne en fonction de ses actes et de sa conduite.
  alternative: En faire une déclaration selon laquelle toute souffrance serait toujours la punition exacte d’un péché personnel.
  rationale: La formulation conserve le principe de justice énoncé par Élihou sans résoudre abusivement la tension théologique de l’ensemble du livre de Job.
translation_notes:
  register: Français international moderne, naturel et digne. « Chacun » rend les deux masculins singuliers génériques sans imposer en français une lecture exclusivement masculine. La seconde proposition privilégie une expression idiomatique tout en conservant le sens causatif de l’hébreu.
