source:
  edition: WLC
  text: כִּֽי אָ֭מַר אִיּ֣וֹב צָדַ֑קְתִּי וְ֝/אֵ֗ל הֵסִ֥יר מִשְׁפָּטִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/005.yaml
  text: For Job has said[a], ‘I am in the right, and God has taken away my justice.’
translation:
  language: fr
  text: 'Car Job a dit : « Je suis dans mon droit, et Dieu m’a privé de mon droit[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de justice » ou « de la justice qui m’est due ».'
    reason: Alternative lexicale reflétant l’étendue de sens de מִשְׁפָּטִי, qui peut évoquer le droit personnel, la justice ou la justice due.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la justification donnée par Élihou en rappelant les paroles de Job ; « Car » convient au mouvement argumentatif.
- source_word: אָמַר
  choice: a dit
  rationale: Le qatal rapporte une parole antérieure qui reste pertinente dans l’argumentation présente.
- source_word: אִיּוֹב
  choice: Job
  rationale: Forme française traditionnelle du nom propre.
- source_word: צָדַקְתִּי
  choice: Je suis dans mon droit
  rationale: Rend la portée judiciaire de la racine צדק dans ce contexte sans transformer l’affirmation de Job en revendication générale de perfection morale.
- source_word: וְאֵל
  choice: et Dieu
  rationale: אֵל désigne ici Dieu sans qu’il soit nécessaire d’ajouter un titre ; la conjonction est conservée simplement.
- source_word: הֵסִיר
  choice: m’a privé de
  rationale: Le hiphil de סור exprime l’action d’écarter ou d’enlever ; cette tournure française rend naturellement l’idée que Job estime ne pas avoir reçu ce qui lui revenait.
- source_word: מִשְׁפָּטִי
  choice: justice
  rationale: Le terme peut désigner la justice, le droit reconnu ou la décision judiciaire. « Privé de justice » reste naturel en français et conserve sa portée juridique et morale, tandis que la note signale les principales nuances.
theological_decisions:
- issue: Portée judiciaire de l’affirmation de Job
  choice: Je suis dans mon droit
  alternative: Je suis juste
  rationale: La formulation retenue rattache l’affirmation au litige de Job devant Dieu et évite de lui faire revendiquer sans ambiguïté une perfection morale absolue.
- issue: Sens de מִשְׁפָּטִי
  choice: m’a privé de justice
  alternative: m’a privé de mon droit ; m’a refusé la justice qui m’est due
  rationale: Le choix principal préserve la tension entre justice, droit personnel et décision judiciaire sans réduire le terme à une seule de ces dimensions.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation est naturelle à l’oral comme à l’écrit, tout en conservant le cadre judiciaire du propos.
