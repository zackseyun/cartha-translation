  text: Écoutez mes paroles, vous, les sages ; vous qui savez, prêtez-moi l’oreille.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif pluriel de שׁמע appelle directement les destinataires à écouter ; « Écoutez » est naturel en français moderne et conserve le parallélisme avec le second impératif.
- source_word: חֲכָמִים
  choice: vous les sages
  rationale: L’adjectif masculin pluriel est employé substantivement et comme vocatif. « Vous les sages » exprime clairement l’interpellation sans alourdir la phrase.
- source_word: מִלָּי
  choice: mes paroles
  rationale: Le pluriel muni du suffixe de première personne désigne les paroles ou propos du locuteur. « Mes paroles » en garde le sens concret et le registre digne.
- source_word: וְיֹדְעִים
  choice: vous qui savez
  rationale: Le participe pluriel substantivé désigne ceux qui possèdent le savoir. « Vous qui savez » préserve cette formulation sans préciser indûment l’objet de leur connaissance.
- source_word: הַאֲזִינוּ
  choice: prêtez-moi l’oreille
  rationale: L’impératif de אזן appartient au champ lexical de l’oreille et signifie écouter attentivement. Cette expression française conserve l’image et le parallélisme poétique.
- source_word: לִי
  choice: moi
  rationale: Le complément de première personne est intégré à l’expression idiomatique « prêtez-moi l’oreille ».
