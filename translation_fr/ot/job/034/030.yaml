source:
  edition: WLC
  text: מִ֭/מְּלֹךְ אָדָ֥ם חָנֵ֗ף מִ/מֹּ֥קְשֵׁי עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/030.yaml
  text: so that a godless man should not reign[a], nor be snares to the people.
translation:
  language: fr
  text: 'afin qu’un homme impie ne règne pas[a]

    et ne tende pas de pièges au peuple.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « de peur qu’un homme impie ne règne et que le peuple ne tombe dans des pièges ». L’hébreu est très condensé et peut se comprendre de plusieurs manières proches autour des idées de règne et de pièges.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמְּלֹךְ
  choice: afin que… ne règne pas
  rationale: La préposition מִן devant l’infinitif construit de מלך peut ici exprimer l’empêchement ou le but, dans la continuité du verset précédent. Cette formulation française rend naturellement cette valeur sans transformer l’expression en simple constat.
- source_word: אָדָם
  choice: un homme
  rationale: Le nom désigne ici un individu susceptible d’exercer le pouvoir, et non l’humanité en général.
- source_word: חָנֵף
  choice: impie
  rationale: Dans la littérature sapientiale, חָנֵף qualifie une personne moralement et religieusement pervertie; « impie » conserve cette portée mieux que « hypocrite ».
- source_word: מִמֹּקְשֵׁי
  choice: ne tende pas de pièges
  rationale: Le texte hébreu, très condensé, contient le pluriel de מוֹקֵשׁ, « piège », précédé de מִן. La tournure verbale donne en français un lien intelligible avec le dirigeant impie tout en conservant l’image des pièges.
- source_word: עָם
  choice: au peuple
  rationale: Dans le contexte du gouvernement et de l’oppression, עָם désigne la population soumise au dirigeant.
theological_decisions:
- issue: Syntaxe condensée et rapport entre le règne de l’impie et les pièges
  choice: L’action divine empêche un homme impie de régner et de tendre des pièges au peuple.
  alternative: « de peur qu’un homme impie ne règne, à cause des pièges du peuple » ou « afin qu’un impie ne règne pas et que le peuple ne tombe pas dans des pièges »
  rationale: L’hébreu est elliptique et admet plusieurs agencements. Le choix retenu suit la logique judiciaire du contexte et maintient le dirigeant impie comme sujet, sans prétendre que la syntaxe exclut les autres lectures; l’ambiguïté est signalée en note.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. « Impie » garde la force morale et religieuse du terme hébreu; la construction en deux lignes respecte le parallélisme poétique.
