lexical_decisions:
- source_word: וַיַּעַן
  choice: reprit la parole
  rationale: Dans cette formule narrative, ענה introduit une nouvelle prise de parole en réaction au débat précédent. « Reprit la parole » est naturel en français et n’implique pas nécessairement qu’une question précise ait été posée.
- source_word: אֱלִיהוּא
  choice: Élihou
  rationale: Cette forme française traditionnelle et reconnaissable translittère le nom hébreu אֱלִיהוּא.
- source_word: וַיֹּאמַר
  choice: ':'
  rationale: Le deux-points introduit directement le discours qui suit et rend idiomatiquement la fonction de וַיֹּאמַר sans reproduire la formule hébraïque « répondit et dit », lourde en français moderne.
- source_word: וַ
  choice: enchaînement narratif implicite
  rationale: Le préfixe waw fait progresser le récit. En français, la succession avec le contexte précédent et le passé simple « reprit » suffit à exprimer cette progression sans ajouter « alors ».
