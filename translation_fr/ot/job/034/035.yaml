  text: Job speaks without knowledge[a], and his words are without understanding.
translation:
  language: fr
  text: Job parle sans connaissance, et ses paroles manquent de discernement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְדַעַת
  choice: sans connaissance
  rationale: 'La préposition ב avec le nom abstrait דַּעַת indique ici la manière : Job parle d’une façon caractérisée par l’absence de connaissance. « Sans connaissance » est direct et naturel en français.'
- source_word: יְדַבֵּר
  choice: parle
  rationale: L’imparfait hébreu exprime ici un présent général dans l’appréciation formulée par Élihou, plutôt qu’un futur.
- source_word: דְבָרָיו
  choice: ses paroles
  rationale: Le pluriel דְּבָרִים désigne ici les paroles ou propos de Job. « Ses paroles » conserve la formulation poétique et le parallélisme.
- source_word: בְהַשְׂכֵּיל
  choice: manquent de discernement
  rationale: La forme issue de שׂכל évoque la compréhension avisée, la perspicacité ou le discernement. Cette tournure française exprime naturellement la négation hébraïque tout en distinguant le terme de « connaissance » dans le premier membre.
- source_word: לֹא
  choice: sans / manquent de
  rationale: La négation répétée porte sur la manière ou la qualité du discours. Des formulations idiomatiques légèrement différentes évitent une construction française lourde sans modifier le parallélisme de fond.
