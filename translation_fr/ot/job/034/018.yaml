source:
  edition: WLC
  text: הַ/אֲמֹ֣ר לְ/מֶ֣לֶךְ בְּלִיָּ֑עַל רָ֝שָׁ֗ע אֶל נְדִיבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/018.yaml
  text: who says to a king[a], ‘Worthless one!’ and to nobles[b], ‘Wicked ones!’
translation:
  language: fr
  text: 'Peut-on dire à un roi[a] : « Vaurien ! »,

    et à des nobles[b] : « Méchants ! » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « vaurien » exprime ici la bassesse ou l’absence de valeur; il ne s’agit pas nécessairement du nom propre « Bélial ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « méchants » est au singulier, mais il s’adresse aux « nobles », qui sont au pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמֹר
  choice: Peut-on dire
  rationale: 'La forme introduit vraisemblablement une question rhétorique elliptique : « Est-il [convenable] de dire… ? » « Peut-on dire » restitue naturellement cette force en français sans ajouter explicitement un jugement moral absent du texte.'
- source_word: לְמֶלֶךְ
  choice: à un roi
  rationale: La préposition לְ introduit le destinataire, et le nom sans article a ici une valeur générique.
- source_word: בְּלִיָּעַל
  choice: Vaurien
  rationale: Le terme sert ici d’injure et évoque la bassesse ou l’absence de valeur. « Vaurien » convient à l’apostrophe sans transformer le mot en nom propre « Bélial ».
- source_word: רָשָׁע
  choice: Méchants
  rationale: Bien que le mot hébreu soit morphologiquement au singulier, il qualifie les destinataires pluriels נְדִיבִים. Le pluriel français rend clairement l’apostrophe collective.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit le destinataire de la parole, parallèlement à לְ dans le premier membre.
- source_word: נְדִיבִים
  choice: des nobles
  rationale: Dans ce parallèle avec « roi », le terme désigne des personnages de haut rang; « nobles » conserve cette dimension sociale et politique.
theological_decisions:
- issue: Identification de בְּלִיָּעַל
  choice: 'Nom commun injurieux : « Vaurien »'
  alternative: 'Nom propre : « Bélial »'
  rationale: Dans ce contexte, le mot exprime la bassesse ou l’indignité et ne désigne pas nécessairement l’être personnifié appelé plus tard Bélial.
- issue: Construction de הַאֲמֹר
  choice: 'Question rhétorique : « Peut-on dire… ? »'
  alternative: 'Proposition relative : « celui qui dit… »'
  rationale: Le ה initial s’explique naturellement comme particule interrogative devant la forme verbale. Le contexte porte sur la convenance d’accuser les gouvernants, sans qu’il soit nécessaire d’identifier un nouveau sujet.
translation_notes:
  register: Français international moderne, direct et digne. La formulation interrogative conserve la force rhétorique de l’hébreu; les apostrophes brèves rendent le parallélisme poétique.
