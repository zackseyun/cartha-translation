  text: לָ/כֵ֗ן יַ֭כִּיר מַעְבָּֽדֵי/הֶ֑ם וְ/הָ֥פַךְ לַ֝֗יְלָה וְ/יִדַּכָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/025.yaml
  text: Therefore he recognizes their deeds; he overturns them in the night[a], and they are crushed.
translation:
  language: fr
  text: C’est pourquoi il connaît leurs actes ; il les renverse pendant la nuit[a], et ils sont écrasés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il les renverse de nuit ». En hébreu, le verbe « renverse » n’a pas de complément d’objet explicite, mais le contexte désigne les puissants injustes soumis au jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conséquence logique de l’argument précédent.
- source_word: יַכִּיר
  choice: il connaît
  rationale: Le hiphil de נכר peut ici exprimer le fait de reconnaître ou de prendre connaissance. « Il connaît » est naturel et indique que Dieu discerne pleinement leurs actes, sans ajouter l’idée plus spécifique d’un examen.
- source_word: מַעְבָּדֵיהֶם
  choice: leurs actes
  rationale: Désigne ce qu’ils font. « Actes » est clair, concis et convient au contexte moral et judiciaire.
- source_word: וְהָפַךְ
  choice: il les renverse
  rationale: הפך signifie renverser ou bouleverser. Le pronom « les », absent comme objet explicite en hébreu, reprend selon le contexte les puissants injustes dont il est question.
- source_word: לַיְלָה
  choice: pendant la nuit
  rationale: Rend la valeur temporelle adverbiale et conserve l’image d’un jugement nocturne soudain.
- source_word: וְיִדַּכָּאוּ
  choice: et ils sont écrasés
  rationale: La forme passive de דכא évoque le fait d’être écrasé ou brisé ; « écrasés » conserve la force du jugement décrit.
theological_decisions:
- issue: Sujet implicite et objet non exprimé dans la scène de jugement
  choice: Dieu demeure le sujet, et les personnes injustes sont l’objet sous-entendu de « renverse ».
  alternative: Comprendre littéralement que Dieu « renverse la nuit », ou adopter une construction impersonnelle.
  rationale: Le contexte de Job 34.24-26 présente Dieu comme celui qui connaît et juge les puissants. Le français exige ici un complément plus explicite ; « les » restitue le référent contextuel tout en signalant en note que l’objet n’est pas exprimé dans l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste proche de la structure hébraïque tout en explicitant seulement le complément requis par le français et par le contexte.
