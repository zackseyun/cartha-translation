  text: מִֽי פָקַ֣ד עָלָ֣י/ו אָ֑רְצָ/ה וּ/מִ֥י שָׂ֝֗ם תֵּבֵ֥ל כֻּלָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/013.yaml
  text: Who appointed the earth over him[a], and who set the whole world in place?
translation:
  language: fr
  text: Qui lui a confié la terre[a] ? Qui a placé le monde entier ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui l’a chargé de la terre ? » Le verbe hébreu peut exprimer le fait de confier une charge ou une responsabilité. La seconde question emploie un verbe qui signifie littéralement « mettre » ou « placer ».'
    reason: Ambiguïté lexicale de פקד avec עַל et précision du sens direct de שׂים dans la proposition parallèle.
lexical_decisions:
- source_word: פָקַד עָלָיו
  choice: lui a confié
  rationale: Dans cette construction, פקד avec עַל exprime le fait de charger quelqu’un d’une responsabilité ou de lui confier une administration. « Lui a confié » est naturel en français et maintient l’idée qu’aucune autorité supérieure n’a remis la terre à Dieu.
- source_word: אָרְצָה
  choice: la terre
  rationale: Le parallélisme avec תבל indique ici une portée cosmique plutôt qu’un territoire particulier.
- source_word: שָׂם
  choice: a remis
  rationale: Le sens de base est « mettre, placer ». Dans ce contexte de responsabilité confiée, « remettre » rend naturellement le parallélisme, tandis que le sens plus littéral est signalé en note.
- source_word: תֵּבֵל כֻּלָּהּ
  choice: le monde entier
  rationale: תבל désigne le monde ordonné ou habité, et כֻּלָּהּ en souligne la totalité.
theological_decisions:
- issue: Référent du suffixe masculin singulier dans עָלָיו
  choice: 'Le pronom renvoie à Dieu : « lui »'
  alternative: Une construction plus impersonnelle ou un rattachement différent a parfois été proposé.
  rationale: Dans Job 34.10-15, la question affirme qu’aucune autorité supérieure n’a chargé Dieu de gouverner la terre. Le contexte et le genre masculin du suffixe favorisent nettement ce référent.
- issue: Nature de la seconde proposition
  choice: La comprendre en parallèle comme une responsabilité remise à Dieu
  alternative: « Qui a placé le monde entier ? »
  rationale: Le parallélisme peut prolonger l’idée de mandat confié, mais שׂים signifie littéralement « mettre, placer » ; la note conserve cette possibilité sans imposer une résolution absolue.
translation_notes:
  register: Français moderne, naturel et digne. Les deux questions brèves conservent la force rhétorique du verset. Le pronom « lui » garde Dieu comme référent implicite dans le contexte immédiat.
