  text: all flesh would perish together[a], and man would return to dust.
translation:
  language: fr
  text: Toute chair périrait à la fois, et l’être humain retournerait à la poussière.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִגְוַע
  choice: expirerait
  rationale: Le verbe גוע désigne le fait d’expirer, de mourir. « Expirerait » conserve sa gravité et, avec le conditionnel hérité du verset 14, exprime naturellement l’hypothèse.
- source_word: כָּל בָּשָׂר
  choice: toute chair
  rationale: Cette traduction maintient l’image et la portée collective de l’expression hébraïque, qui désigne les êtres mortels sans la réduire explicitement à la seule humanité.
- source_word: יָחַד
  choice: ensemble
  rationale: L’adverbe souligne que tous subiraient simultanément le même sort; « ensemble » est concis et fidèle.
- source_word: אָדָם
  choice: l’être humain
  rationale: Le singulier hébreu a ici une valeur générique et collective. « L’être humain » préserve le singulier tout en indiquant clairement qu’il s’agit de l’humanité, sans ambiguïté masculine en français moderne.
- source_word: עַל עָפָר
  choice: à la poussière
  rationale: Avec שוב, la préposition עַל s’intègre naturellement en français dans la formule « retourner à la poussière », qui conserve l’image concrète de l’origine terrestre.
- source_word: יָשׁוּב
  choice: retournerait
  rationale: שוב signifie couramment « revenir, retourner ». Le conditionnel français dépend de l’hypothèse formulée au verset précédent.
theological_decisions:
- issue: Valeur générique de אָדָם
  choice: l’être humain
  alternative: l’humanité
  rationale: Le contexte met אָדָם en parallèle avec « toute chair » et vise le genre humain. « L’être humain » garde la forme singulière collective du texte source, tandis que « l’humanité » expliciterait davantage la collectivité.
translation_notes:
  register: Français international moderne, sobre et solennel. La formulation conserve le parallélisme hébreu ainsi que l’idiome biblique « toute chair », tout en rendant clairement le sens collectif de אָדָם.
