id: JOB.34.37
reference: Job 34:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֥י יֹ֘סִ֤יף עַֽל חַטָּאת֣/וֹ פֶ֭שַׁע בֵּינֵ֣י/נוּ יִסְפּ֑וֹק וְ/יֶ֖רֶב אֲמָרָ֣י/ו לָ/אֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/034/037.yaml
  text: For he adds rebellion to his sin[a]; among us he claps his hands[b], and he multiplies his words against God.
translation:
  language: fr
  text: Car il ajoute la révolte à son péché ; au milieu de nous, il bat des mains[a] et multiplie ses paroles contre Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il frappe ses mains l’une contre l’autre ». Le geste exprime probablement le mépris, le défi ou la moquerie.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « adressées à Dieu ». La préposition hébraïque peut simplement indiquer la direction, mais le contexte favorise ici le sens adversatif : « contre Dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison du jugement formulé au verset précédent ; « Car » exprime naturellement ce lien explicatif.
- source_word: יֹסִיף עַל חַטָּאתוֹ פֶשַׁע
  choice: il ajoute la révolte à son péché
  rationale: La construction exprime l’ajout d’une faute à une autre. « Révolte » rend la nuance de défi portée par פֶשַׁע, plus forte qu’une simple faute.
- source_word: בֵּינֵינוּ
  choice: au milieu de nous
  rationale: Littéralement « entre nous », l’expression signifie ici « parmi nous » ou « au milieu de nous » dans le cadre du débat.
- source_word: יִסְפּוֹק
  choice: il bat des mains
  rationale: Le verbe désigne vraisemblablement un geste consistant à frapper les mains, associé dans ce contexte au mépris ou au défi. Le geste concret est conservé, tandis que sa portée reste explicitée en note.
- source_word: וְיֶרֶב אֲמָרָיו
  choice: et multiplie ses paroles
  rationale: La formulation conserve l’image d’une accumulation de paroles et le parallélisme avec l’ajout de la révolte au péché.
- source_word: לָאֵל
  choice: contre Dieu
  rationale: 'La préposition ל indique fondamentalement la direction ou la destination, mais le contexte accusateur permet ici une valeur adversative : les paroles sont dirigées contre Dieu.'
theological_decisions:
- issue: Faut-il comprendre לָאֵל comme « à Dieu » ou « contre Dieu » ?
  choice: contre Dieu
  alternative: à Dieu
  rationale: L’accusation progresse du péché à la révolte, puis aux paroles multipliées en opposition à Dieu. « Contre Dieu » rend cette force contextuelle, tout en signalant en note la lecture directionnelle plus neutre.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la progression rhétorique du verset et ses images concrètes sans atténuer l’accusation d’Élihou.
