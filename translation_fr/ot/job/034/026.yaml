  text: תַּֽחַת רְשָׁעִ֥ים סְפָקָ֗/ם בִּ/מְק֥וֹם רֹאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/026.yaml
  text: He strikes them as wicked people in full view[a].
translation:
  language: fr
  text: Il les frappe comme des méchants, à la vue de tous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il les frappe à cause de leur méchanceté, à la vue de tous. » Le début du verset, difficile en hébreu, peut indiquer la raison de leur châtiment plutôt que le statut sous lequel ils sont frappés.'
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת
  choice: comme
  rationale: Dans cette construction difficile, la préposition peut indiquer le statut sous lequel ils sont frappés. La valeur causale possible est conservée en note.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: L’adjectif pluriel substantivé désigne ici des personnes caractérisées comme méchantes, sans limitation de genre en français générique.
- source_word: סְפָקָם
  choice: Il les frappe
  rationale: Le verbe exprime l’action de frapper; ajouter « à mort » ou « abat » préciserait un résultat que la forme hébraïque n’énonce pas explicitement.
- source_word: בִּמְקוֹם רֹאִים
  choice: au vu de tous
  rationale: Littéralement lié à un « lieu de personnes qui voient », le groupe décrit naturellement une action publique, accomplie sous les regards.
theological_decisions:
- issue: Fondement ou qualification du châtiment
  choice: comme des méchants
  alternative: à cause de leur méchanceté
  rationale: L’hébreu permet difficilement de trancher entre le statut dans lequel ces personnes sont frappées et la cause de leur châtiment; le texte retient la première lecture et la note préserve la seconde.
translation_notes:
  register: Français moderne, sobre et digne. « Au vu de tous » rend de façon naturelle la dimension publique de la scène sans introduire un second lieu distinct.
