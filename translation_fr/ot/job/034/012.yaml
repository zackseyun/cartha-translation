  yaml_path: translation/ot/job/034/012.yaml
  text: Indeed[a], God does not act wickedly, and the Almighty does not pervert justice.
translation:
  language: fr
  text: Assurément, Dieu ne commet pas le mal[a], et le Tout-Puissant ne fausse pas la justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne condamne pas injustement » ; ou : « ne déclare pas coupable ». Le verbe hébreu peut avoir un sens judiciaire dans certains contextes.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אָמְנָם
  choice: Oui, vraiment
  rationale: Cette tournure rend la forte affirmation produite par les deux particules hébraïques, dans un français actuel et naturel.
- source_word: אֵל
  choice: Dieu
  rationale: Dans ce contexte, אֵל désigne le Dieu d’Israël. « Dieu » est la formulation française la plus naturelle et forme un bon parallèle avec « le Tout-Puissant ».
- source_word: יַרְשִׁיעַ
  choice: ne commet pas le mal
  rationale: Le hiphil de רשע peut exprimer soit l’action mauvaise, soit une déclaration judiciaire de culpabilité. Ici, le parallélisme avec la justice favorise une affirmation générale de la rectitude morale de Dieu, sans effacer le sens judiciaire possible, signalé en note.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Cette traduction traditionnelle et intelligible rend le titre divin שַׁדַּי sans recourir à une translittération peu transparente pour le lecteur ordinaire.
- source_word: יְעַוֵּת
  choice: ne fausse pas
  rationale: Le verbe évoque le fait de courber, tordre ou dénaturer. « Fausser la justice » est une expression française naturelle qui conserve la portée judiciaire.
- source_word: מִשְׁפָּט
  choice: la justice
  rationale: Le nom désigne ici la justice ou le juste jugement comme norme. « La justice » convient au parallélisme et reste clair en français moderne.
theological_decisions:
- issue: Sens de יַרְשִׁיעַ appliqué à la conduite de Dieu
  choice: Dieu ne commet pas le mal
  alternative: Dieu ne condamne pas injustement ; Dieu ne déclare pas coupable
  rationale: Le verset affirme l’intégrité morale et judiciaire de Dieu. Le parallélisme soutient le sens général de « commettre le mal », tandis que la note préserve la possibilité d’un emploi judiciaire du verbe sans trancher silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. « Oui, vraiment » conserve l’insistance initiale ; « fausser la justice » maintient le registre judiciaire sans archaïsme.
