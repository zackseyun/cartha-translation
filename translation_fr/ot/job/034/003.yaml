  language: fr
  text: Car l’oreille examine les paroles, comme le palais goûte la nourriture.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’exhortation précédente et conserve naturellement la valeur causale ou explicative.
- source_word: אֹזֶן
  choice: l’oreille
  rationale: Le singulier a une portée générique et proverbiale; l’article défini convient à cet emploi en français.
- source_word: מִלִּין
  choice: les paroles
  rationale: Désigne ici des mots prononcés ou un discours; « paroles » est naturel dans le parallèle avec l’écoute.
- source_word: תִּבְחָן
  choice: examine
  rationale: Le verbe בחן signifie mettre à l’épreuve ou examiner. « Examine » exprime clairement l’évaluation des paroles sans suggérer une expérimentation formelle.
- source_word: חֵךְ
  choice: le palais
  rationale: Désigne précisément l’organe du goût et maintient le parallélisme sensoriel avec l’oreille.
- source_word: יִטְעַם
  choice: goûte
  rationale: Équivalent direct qui préserve l’image proverbiale.
- source_word: לֶאֱכֹל
  choice: la nourriture
  rationale: L’infinitif précédé de ל peut être compris substantivement, « ce qui est à manger », rendu naturellement par « la nourriture ».
