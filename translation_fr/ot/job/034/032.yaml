  text: בִּלְעֲדֵ֣י אֶ֭חֱזֶה אַתָּ֣ה הֹרֵ֑/נִי אִֽם עָ֥וֶל פָּ֝עַ֗לְתִּי לֹ֣א אֹסִֽיף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/032.yaml
  text: What I do not see[a], you teach me; if I have done wrong[b], I will not do it again.
translation:
  language: fr
  text: Apprends-moi ce que je ne vois pas[a] ; si j’ai commis une faute, je ne le ferai plus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « En dehors de ce que je vois, instruis-moi. » L’hébreu est elliptique et peut aussi se comprendre : « Ce que je ne vois pas, montre-le-moi. »'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « je n’ajouterai pas », c’est-à-dire « je ne continuerai pas » ou « je ne le ferai plus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְעֲדֵי אֶחֱזֶה
  choice: Ce que je ne vois pas
  rationale: La tournure hébraïque est elliptique. Cette formulation conserve l’image de la vision tout en exprimant naturellement ce qui échappe au locuteur.
- source_word: אַתָּה הֹרֵנִי
  choice: enseigne-le-moi
  rationale: Le hiphil de ירה signifie couramment « enseigner, instruire ». Le pronom « le » reprend naturellement en français « ce que je ne vois pas ».
- source_word: אִם
  choice: si
  rationale: La conjonction introduit ici le plus naturellement une condition.
- source_word: עָוֶל פָּעַלְתִּי
  choice: j’ai fait le mal
  rationale: עָוֶל désigne le mal commis, l’injustice ou la faute, et פעל l’action accomplie. « Faire le mal » reste large, idiomatique et n’impose pas une catégorie particulière de faute.
- source_word: לֹא אֹסִיף
  choice: je ne recommencerai pas
  rationale: Avec la négation, יסף exprime idiomatiquement le fait de ne pas continuer ou répéter une action. La formulation française explicite sobrement l’objet sous-entendu.
theological_decisions:
- issue: Portée de la déclaration devant Dieu
  choice: Présenter une demande d’instruction suivie de la résolution de ne pas répéter le mal.
  alternative: Employer un vocabulaire doctrinal plus appuyé de confession ou de repentance formelle.
  rationale: L’hébreu exprime l’humilité, la disponibilité à être corrigé et l’engagement de ne pas persister, sans formuler explicitement une doctrine plus développée.
- issue: Ambiguïté de la première proposition
  choice: Retenir « Ce que je ne vois pas » dans le texte et signaler en note la construction plus littérale.
  alternative: Traduire directement « En dehors de ce que je vois » ou « Sans que je le voie ».
  rationale: La syntaxe hébraïque est concise et difficile. Le texte principal donne le sens contextuel le plus naturel, tandis que la note préserve l’ambiguïté formelle.
translation_notes:
  register: Français international moderne, simple et digne. L’image de la vision est conservée ; la seconde proposition emploie une tournure idiomatique sans renforcer indûment le langage pénitentiel.
