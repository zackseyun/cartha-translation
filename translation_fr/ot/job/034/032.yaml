  source_fidelity: 'Le sens général est bien rendu : le locuteur demande à être instruit de ce qu’il ne perçoit pas et promet de ne plus commettre de tort. Toutefois, « enseigne-le-moi » donne au verbe hébreu un objet direct explicite (« le ») que le texte ne formule pas ; une construction française avec « apprendre » rend plus naturellement la relation sans surdéterminer la syntaxe elliptique. « Faute » restitue ici de manière plus idiomatique et suffisamment large עָוֶל, qui peut désigner un tort ou une injustice.'
