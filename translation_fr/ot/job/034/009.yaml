  text: כִּֽי אָ֭מַר לֹ֣א יִסְכָּן גָּ֑בֶר בִּ֝/רְצֹת֗/וֹ עִם אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/009.yaml
  text: For he has said[a], ‘A man gains nothing by delighting himself with God.’
translation:
  language: fr
  text: 'Car il a dit[a] : « Un homme ne gagne rien à prendre plaisir en Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un homme ne gagne rien lorsque Dieu prend plaisir en lui », ou : « Un homme ne gagne rien à rechercher la faveur de Dieu. » La formulation hébraïque est concise et peut se comprendre de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui appuie, dans le contexte, l’accusation formulée par Élihou.
- source_word: אָמַר
  choice: il a dit
  rationale: Le parfait renvoie à une affirmation antérieure attribuée à Job; le passé composé est naturel en français et conserve sa pertinence dans l’argument.
- source_word: לֹא יִסְכָּן
  choice: ne gagne rien
  rationale: Rend idiomatiquement l’idée de ne tirer aucun profit ni avantage.
- source_word: גָּבֶר
  choice: Un homme
  rationale: Conserve le nom masculin singulier hébreu employé ici avec une portée représentative.
- source_word: בִּרְצֹתוֹ
  choice: à prendre plaisir
  rationale: Rend l’infinitif de רצה comme l’action de trouver son plaisir ou son agrément; le sujet humain est la lecture syntaxique principale retenue.
- source_word: עִם אֱלֹהִים
  choice: en Dieu
  rationale: Exprime naturellement en français la relation à Dieu visée par la préposition עִם, sans alourdir la phrase par le calque peu idiomatique « avec Dieu ».
theological_decisions:
- issue: Interprétation de בִּרְצֹתוֹ עִם אֱלֹהִים
  choice: L’homme ne gagne rien à prendre plaisir en Dieu.
  alternative: L’homme ne gagne rien lorsque Dieu prend plaisir en lui; ou l’homme ne gagne rien à rechercher la faveur de Dieu.
  rationale: Le suffixe se comprend le plus directement avec l’homme comme sujet de l’action, ce qui correspond à l’accusation selon laquelle la piété ne procurerait aucun avantage. La construction reste toutefois compacte et susceptible d’autres analyses, signalées en note afin de préserver son ambiguïté réelle.
translation_notes:
  register: Français international moderne, sobre et digne. « Prendre plaisir en Dieu » conserve la portée relationnelle et théologique de l’expression tout en restant compréhensible; la note maintient les autres lectures syntaxiquement possibles.
