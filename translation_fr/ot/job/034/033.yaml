source:
  edition: WLC
  text: הַֽ/מֵ/עִמְּ/ךָ֬ יְשַׁלְמֶ֨/נָּה כִּֽי מָאַ֗סְתָּ כִּי אַתָּ֣ה תִבְחַ֣ר וְ/לֹא אָ֑נִי וּֽ/מַה יָדַ֥עְתָּ דַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/033.yaml
  text: Should he repay according to your judgment because you have rejected it? For you must choose[a], and not I[b]; so declare what you know.
translation:
  language: fr
  text: Est-ce d’après ton jugement[a] qu’il devrait rétribuer, parce que tu as rejeté cela[b] ? Car c’est à toi de choisir, et non à moi ; dis donc ce que tu sais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Est-ce selon toi qu’il devrait rétribuer ? » L’expression hébraïque initiale est idiomatique et difficile ; dans le contexte, elle demande si la rétribution de Dieu doit dépendre de la préférence de Job.'
    reason: lexical_alternative
  - marker: b
    text: « Cela » peut désigner le jugement de Dieu, sa manière de gouverner ou la rétribution dont il est question.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמֵעִמְּךָ
  choice: selon toi
  rationale: L’expression hébraïque, littéralement difficile (« de chez toi / d’avec toi »), demande si la rétribution divine doit dépendre du point de vue ou de la préférence de Job. « Selon toi » reste concis et conserve la tournure interrogative.
- source_word: יְשַׁלְּמֶנָּה
  choice: devrait rétribuer
  rationale: Le piel de שלם exprime ici l’idée de payer en retour ou de rendre selon ce qui est dû. « Rétribuer » convient au contexte de justice sans préciser indûment l’objet du suffixe féminin.
- source_word: כִּי מָאַסְתָּ
  choice: puisque tu as rejeté cela
  rationale: מאס signifie « rejeter, refuser, mépriser ». Le démonstratif « cela » représente l’objet implicite sans trancher entre le jugement de Dieu, sa manière de gouverner ou la rétribution évoquée.
- source_word: כִּי אַתָּה תִבְחַר וְלֹא אָנִי
  choice: Car c’est à toi de choisir, et non à moi
  rationale: La formulation française rend l’opposition emphatique entre « toi » et « moi » et transmet la force contextuelle de l’injonction adressée à Job.
- source_word: וּמַה יָדַעְתָּ דַבֵּר
  choice: dis donc ce que tu sais
  rationale: Cette tournure naturelle conserve l’impératif direct et le défi lancé à Job d’exposer ce qu’il comprend.
theological_decisions:
- issue: Référent de l’objet rejeté
  choice: Le laisser indéterminé par « cela »
  alternative: « sa décision » ou « sa manière de gouverner »
  rationale: L’hébreu ne nomme pas explicitement l’objet de מָאַסְתָּ. Une formulation précise résoudrait une ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La question rhétorique demeure vive, tandis que « cela » et les notes préservent l’ambiguïté de l’objet rejeté.
