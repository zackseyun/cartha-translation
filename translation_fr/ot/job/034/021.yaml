source:
  edition: WLC
  text: כִּי עֵ֭ינָי/ו עַל דַּרְכֵי אִ֑ישׁ וְֽ/כָל צְעָדָ֥י/ו יִרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/021.yaml
  text: For his eyes are on the ways of a man[a], and he sees all his steps.
translation:
  language: fr
  text: Car ses yeux sont tournés vers les voies de l’homme[a], et il voit tous ses pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les voies d’une personne ». L’hébreu dit littéralement « les voies d’un homme », avec un masculin singulier employé dans un sens générique.
    reason: Alternative lexicale et clarification de la portée générique de אִישׁ.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve naturellement la valeur causale ou explicative de la conjonction.
- source_word: עֵינָיו
  choice: ses yeux
  rationale: Rend littéralement le nom pluriel avec suffixe masculin singulier; dans le contexte, le pronom renvoie à Dieu.
- source_word: עַל
  choice: sont sur
  rationale: Conserve l’image hébraïque des yeux posés sur l’objet observé, dans une formulation française intelligible et digne.
- source_word: דַּרְכֵי אִישׁ
  choice: les voies de l’homme
  rationale: «Voies» rend le sens concret et métaphorique de דֶּרֶךְ, notamment la conduite ou le parcours de vie. «L’homme» garde le masculin singulier générique de אִישׁ.
- source_word: וְכָל
  choice: et tous
  rationale: Rend directement la coordination et l’idée de totalité, avec accord sur «pas».
- source_word: צְעָדָיו
  choice: ses pas
  rationale: Préserve l’image concrète des pas, qui peut aussi désigner les actes ou le cours de la vie.
- source_word: יִרְאֶה
  choice: il voit
  rationale: Le présent exprime en français une vérité générale et continue; «voit» demeure proche du sens ordinaire de ראה.
theological_decisions:
- issue: Masculin générique אִישׁ
  choice: l’homme
  alternative: une personne
  rationale: L’hébreu emploie un masculin singulier à portée représentative. La traduction conserve cette forme sans limiter la portée du propos aux seuls hommes; une note explicite la valeur générique.
translation_notes:
  register: 'Français international moderne, sobre et digne. La structure poétique parallèle est conservée: les «voies» correspondent aux «pas», et le regard divin est exprimé d’abord par les «yeux», puis par le verbe «voir».'
