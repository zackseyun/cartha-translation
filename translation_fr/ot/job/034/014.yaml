  source_fidelity: Le conditionnel introduit par אִם est correctement rendu, et les deux actions restent coordonnées dans une protase laissée ouverte, comme en hébreu. « Porter son attention » transmet de façon idiomatique l’expression « placer son cœur », sans réduire le cœur à l’affect. « Esprit » et « souffle » maintiennent utilement la distinction lexicale entre רוּחַ et נְשָׁמָה. « Ramener à lui » rend de manière contextuellement juste l’idée de rassemblement/retrait exprimée par יֶאֱסֹף, que le verset suivant explicite.
