  variant: modern international French
source:
  edition: WLC
  text: אִם יָשִׂ֣ים אֵלָ֣י/ו לִבּ֑/וֹ רוּח֥/וֹ וְ֝/נִשְׁמָת֗/וֹ אֵלָ֥י/ו יֶאֱסֹֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/014.yaml
  text: If he should set his heart on himself[a], and gather to himself his spirit and his breath,
translation:
  language: fr
  text: S’il portait son attention sur lui-même[a], s’il ramenait à lui son esprit et son souffle,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « S’il y portait son attention, s’il ramenait à lui son esprit et son souffle. » L’expression hébraïque « placer son cœur » peut signifier diriger son attention ou sa volonté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָשִׂים
  choice: S’il portait
  rationale: La construction introduit une hypothèse. L’imparfait français convient à la protase et « porter son attention » exprime naturellement l’idiome hébreu sans perdre son caractère intentionnel.
- source_word: אֵלָיו לִבּוֹ
  choice: son attention sur lui-même
  rationale: Littéralement, il est question de « placer son cœur vers lui-même ». Ici, « attention » communique la valeur intérieure du cœur — intention, volonté ou pensée — tandis que « sur lui-même » conserve la lecture réflexive suggérée par le contexte.
- source_word: רוּחוֹ
  choice: son esprit
  rationale: רוּחַ peut désigner l’esprit, le vent ou le souffle. « Esprit », en parallèle avec « souffle », maintient la distinction entre les deux termes hébreux.
- source_word: וְנִשְׁמָתוֹ
  choice: et son souffle
  rationale: נְשָׁמָה désigne fréquemment le souffle vital. « Souffle » est clair et préserve le parallélisme avec « esprit ».
- source_word: אֵלָיו יֶאֱסֹף
  choice: s’il ramenait à lui
  rationale: אָסַף signifie fondamentalement rassembler ou recueillir. Dans ce contexte, il s’agit de reprendre le principe de vie; « ramener à lui » garde l’image du mouvement vers Dieu sans expliciter davantage que le texte.
theological_decisions:
- issue: Référent des pronoms masculins singuliers
  choice: Les pronoms renvoient à Dieu, le sujet implicite des deux verbes.
  alternative: Le premier אֵלָיו peut se comprendre moins nettement comme réfléchi, avec le sens « s’il y appliquait son cœur » ou « s’il y portait son attention ».
  rationale: Le contexte immédiat présente Dieu comme celui qui peut reprendre l’esprit et le souffle. La formulation réflexive est donc retenue dans le texte, mais l’ambiguïté réelle de l’expression hébraïque est signalée en note.
- issue: Rapport entre רוּחַ et נְשָׁמָה
  choice: 'Conserver deux termes distincts : « esprit » et « souffle ».'
  alternative: Traduire les deux comme des expressions presque synonymes du souffle vital.
  rationale: Le parallélisme rapproche les notions sans nécessairement les identifier. La traduction évite d’imposer une distinction doctrinale stricte tout en respectant la diversité lexicale de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. « Porter son attention » rend l’idiome du cœur plus naturellement qu’un calque, tandis que la note préserve sa forme et son ambiguïté. La phrase reste ouverte par une virgule, puisque la conséquence de cette condition apparaît au verset suivant.
