  text: וְ/אִם בִּ֥ינָה שִׁמְעָ/ה זֹּ֑את הַ֝אֲזִ֗ינָ/ה לְ/ק֣וֹל מִלָּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/016.yaml
  text: If you have understanding[a], hear this; listen to the sound of my words.
translation:
  language: fr
  text: Si tu as de l’intelligence, écoute ceci ; prête l’oreille à mes paroles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Si
  rationale: La conjonction suivie de la particule conditionnelle introduit un appel conditionnel. En français moderne, « Si » rend naturellement l’ensemble sans qu’il soit nécessaire de traduire séparément la conjonction initiale.
- source_word: בִּינָה
  choice: de l’intelligence
  rationale: Le nom désigne la faculté de comprendre, le discernement. Dans la tournure conditionnelle française, « avoir de l’intelligence » est clair et naturel, sans préciser indûment la nature de cette compréhension.
- source_word: שִׁמְעָה
  choice: écoute
  rationale: L’impératif de שׁמע appelle directement l’interlocuteur à recevoir ce qui va être dit. « Écoute » convient mieux que « entends » à une exhortation en français courant.
- source_word: זֹּאת
  choice: ceci
  rationale: Le démonstratif renvoie aux propos d’Élihou. « Ceci » conserve sa valeur déictique sans ajouter un nom interprétatif comme « cette affaire ».
- source_word: הַאֲזִינָה
  choice: prête l’oreille
  rationale: Le verbe exprime une écoute attentive. « Prête l’oreille » garde la distinction avec שׁמע et demeure une formule française digne et intelligible.
- source_word: לְקוֹל מִלָּי
  choice: à mes paroles
  rationale: Littéralement, la construction signifie « à la voix/au son de mes paroles ». En français, « prêter l’oreille à mes paroles » transmet naturellement l’appel à l’écoute tout en évitant l’expression peu idiomatique « au son de mes paroles ».
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le parallélisme des deux impératifs est conservé par « écoute » et « prête l’oreille », avec une formulation naturelle pour un lectorat général.
