id: JOB.34.29
reference: Job 34:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/ה֤וּא יַשְׁקִ֨ט וּ/מִ֥י יַרְשִׁ֗עַ וְ/יַסְתֵּ֣ר פָּ֭נִים וּ/מִ֣י יְשׁוּרֶ֑/נּוּ וְ/עַל גּ֖וֹי וְ/עַל אָדָ֣ם יָֽחַד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/029.yaml
  text: If he gives quietness[a], who can condemn? If he hides his face[c][b], who can behold him? This is so for a nation and for a man alike.
translation:
  language: fr
  text: S’il donne le calme, qui peut le déclarer coupable[a] ? S’il cache son visage, qui peut le voir[b] ? Il en est ainsi pour une nation comme pour un homme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui peut le condamner ? » Le verbe hébreu peut désigner le fait de déclarer quelqu’un méchant ou coupable.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui peut le contempler ? » Le verbe hébreu signifie regarder ou voir.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « et sur une nation et sur un homme ensemble ». La préposition peut aussi se traduire par « contre » ou « sur » ; ici, la phrase indique que l’affirmation vaut pour l’une comme pour l’autre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשְׁקִט
  choice: donne le calme
  rationale: 'Le hiphil de שׁקט a une valeur causative : Dieu fait régner le calme ou l’accorde. « Donne le calme » conserve cette valeur sans réduire le terme à la paix au sens strict.'
- source_word: יַרְשִׁעַ
  choice: le déclarer coupable
  rationale: 'Le hiphil de רשע possède couramment un sens judiciaire : déclarer quelqu’un méchant ou coupable, condamner. La formulation explicite cette portée forensique tout en gardant Dieu comme objet du pronom.'
- source_word: יַסְתֵּר פָּנִים
  choice: cache son visage
  rationale: La traduction littérale préserve l’image anthropomorphique et sa portée théologique, sans la réduire à un simple retrait de faveur.
- source_word: יְשׁוּרֶנּוּ
  choice: le voir
  rationale: Le verbe שור signifie regarder ou contempler. « Le voir » est naturel en français moderne, et le suffixe masculin singulier renvoie à Dieu.
- source_word: גּוֹי
  choice: nation
  rationale: Le mot désigne ici une collectivité humaine ou politique, mise en parallèle avec l’individu.
- source_word: אָדָם
  choice: homme
  rationale: Dans le contraste entre la collectivité et l’individu, « un homme » préserve le singulier concret de l’hébreu.
- source_word: יָחַד
  choice: comme
  rationale: Dans cette construction, יחד indique que l’affirmation vaut également pour les deux catégories.
- source_word: וְעַל גּוֹי וְעַל אָדָם יָחַד
  choice: Il en est ainsi pour une nation comme pour un homme
  rationale: Cette formulation française naturelle exprime la portée commune de la déclaration pour la collectivité et l’individu, sans imposer à על une nuance punitive plus précise que le contexte.
theological_decisions:
- issue: L’image du visage divin caché
  choice: Conserver « cache son visage »
  alternative: « se détourne » ou « retire sa faveur »
  rationale: L’expression hébraïque maintient une tension entre invisibilité, retrait et possible défaveur divine. Une paraphrase interprétative en réduirait la portée.
- issue: Portée de la proposition finale
  choice: L’appliquer également à une nation et à un individu
  alternative: 'Comprendre על dans un sens plus adversatif : « contre une nation comme contre un homme »'
  rationale: La proposition finale élargit vraisemblablement les deux affirmations précédentes aux sphères collective et individuelle. Le français choisi conserve cette portée sans surdéterminer la préposition.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme interrogatif est conservé, ainsi que l’image biblique du visage caché. « Déclarer coupable » rend clairement la nuance judiciaire, tandis que « donne le calme » préserve la valeur causative du verbe.
