source:
  edition: WLC
  text: כִּ֤י לֹ֣א עַל אִ֭ישׁ יָשִׂ֣ים ע֑וֹד לַ/הֲלֹ֥ךְ אֶל אֵ֝֗ל בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/023.yaml
  text: For he does not set a time for a man to go before God in judgment[a].
translation:
  language: fr
  text: Car il ne fixe pas à un homme de moment pour aller devant Dieu en jugement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile et condensé. Autre traduction possible : « Car il ne fixe pas de délai supplémentaire à un homme pour aller devant Dieu en jugement. » Le mot rendu par « supplémentaire » peut aussi signifier « encore » ou « davantage », et l’ensemble de la proposition est interprété de diverses manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et convient au mouvement argumentatif du discours d’Élihou.
- source_word: לֹא
  choice: ne… pas
  rationale: Négation française courante et directe.
- source_word: עַל אִישׁ
  choice: à un homme
  rationale: Avec יָשִׂים, עַל désigne ici la personne à qui quelque chose serait fixé ou imposé. « Un homme » conserve le masculin singulier générique de l’hébreu.
- source_word: יָשִׂים
  choice: fixe
  rationale: Le verbe signifie largement « mettre, placer, fixer ». Avec le complément implicite de temps, « fixer » est naturel en français.
- source_word: עוֹד
  choice: de moment
  rationale: Le mot signifie littéralement « encore, davantage, plus longtemps ». La proposition hébraïque étant elliptique, « moment » explicite sobrement le complément temporel implicite; la valeur possible de « supplémentaire » est signalée en note.
- source_word: לַהֲלֹךְ
  choice: pour qu’il aille
  rationale: Rend directement l’infinitif du verbe הלך, « aller », sans remplacer entièrement l’image par le terme interprétatif « comparaître ».
- source_word: אֶל אֵל
  choice: devant lui
  rationale: Littéralement « vers Dieu ». Le contexte judiciaire justifie « devant »; le pronom évite une répétition lourde après l’explicitation de Dieu comme sujet.
- source_word: בַּמִּשְׁפָּט
  choice: en jugement
  rationale: Préserve le champ judiciaire de מִשְׁפָּט, qui peut désigner le jugement, la justice ou une procédure judiciaire.
theological_decisions:
- issue: Interprétation de la proposition elliptique comportant עוֹד et l’objet sous-entendu de יָשִׂים
  choice: Dieu ne fixe pas de moment à un homme pour aller devant lui en jugement.
  alternative: Dieu ne fixe pas de délai supplémentaire à un homme pour aller devant lui en jugement; ou Dieu ne porte pas plus longtemps son attention sur un homme avant que celui-ci aille devant Dieu en jugement.
  rationale: L’hébreu est difficile et condensé. Le contexte souligne que Dieu connaît parfaitement les humains et n’a pas besoin d’une audience supplémentaire ni d’un délai avant de juger. Le texte principal reste toutefois proche de l’ellipse hébraïque, tandis que la note conserve la nuance possible de עוֹד.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure volontairement concise afin de refléter la formulation hébraïque, tout en explicitant Dieu comme sujet d’après le contexte immédiat. Le marqueur de note [a] figure dans le texte.
