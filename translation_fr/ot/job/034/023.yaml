review_pass:
  verdict: revise
  source_fidelity: 'Le texte principal rend bien la lecture adoptée dans la piste d’audit anglaise : Dieu n’a pas à fixer un moment pour qu’un humain aille devant lui en jugement. Toutefois, l’hébreu est elliptique et קשה, et עוֹד (« encore, davantage ») n’est pas représenté dans le texte principal. La note doit signaler cette difficulté sans présenter comme certaine l’explication d’une audience supplémentaire.'
  naturalness: « Fixer un moment à un homme » est compréhensible, mais « fixer à un homme un moment » est plus naturel. L’explicitation de « Dieu » après « aller devant » évite aussi toute ambiguïté référentielle créée par « devant lui ».
  terminology: « Car », « homme », « Dieu » et « en jugement » conviennent au registre moderne international et au cadre judiciaire de l’hébreu. « Aller devant Dieu » conserve l’image du verbe הלך sans imposer « comparaître ».
  issues:
