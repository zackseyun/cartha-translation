  text: עַל מִשְׁפָּטִ֥/י אֲכַזֵּ֑ב אָנ֖וּשׁ חִצִּ֣/י בְלִי פָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/006.yaml
  text: Should I lie concerning my right? My wound is incurable[b][a], though there is no transgression.
translation:
  language: fr
  text: Mentirais-je au sujet de mon droit ?[a] Ma blessure est incurable[b], bien qu’il n’y ait pas de transgression.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Malgré mon bon droit, je passe pour menteur », si l’on comprend la première proposition comme une affirmation plutôt que comme une question rhétorique.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « ma flèche est incurable » ; la « flèche » désigne probablement, par image, la blessure ou l’affliction qui lui a été infligée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: au sujet de
  rationale: Avec אֲכַזֵּב et מִשְׁפָּטִי, la préposition introduit naturellement ce sur quoi porterait le mensonge. « Au sujet de » conserve ce sens sans imposer la valeur adversative également possible.
- source_word: מִשְׁפָּטִי
  choice: mon droit
  rationale: מִשְׁפָּט peut désigner le jugement, la cause juridique ou le droit d’une personne. Ici, « mon droit » préserve la portée judiciaire de la revendication de Job.
- source_word: אֲכַזֵּב
  choice: Mentirais-je
  rationale: Le piel de כזב peut signifier « mentir »; la forme est rendue comme une question rhétorique, lecture cohérente dans cette citation condensée. La lecture déclarative et quasi passive reste signalée en note.
- source_word: אָנ֖וּשׁ
  choice: est incurable
  rationale: L’adjectif exprime ce qui est désespéré, gravement atteint ou incurable. Appliqué à l’affliction de Job, « incurable » restitue directement sa gravité.
- source_word: חִצִּי
  choice: ma blessure
  rationale: Le mot signifie littéralement « ma flèche », mais la flèche représente ici vraisemblablement le coup reçu et, par métonymie, la blessure ou l’affliction. La traduction courante donne le sens, tandis que la note conserve l’image hébraïque.
- source_word: בְלִי
  choice: bien que… aucune
  rationale: בְלִי marque l’absence. Dans le lien logique entre les deux propositions, la tournure concessive française exprime naturellement que la souffrance demeure malgré l’absence de transgression.
- source_word: פָשַׁע
  choice: transgression
  rationale: Le terme désigne une faute grave, souvent comprise comme une rébellion ou une rupture morale. « Transgression » maintient cette force morale et juridique.
theological_decisions:
- issue: Interprétation de la première proposition comme question rhétorique ou comme affirmation
  choice: 'Question rhétorique : « Mentirais-je au sujet de mon droit ? »'
  alternative: 'Affirmation : « Contre mon droit, je passe pour menteur. »'
  rationale: L’hébreu est très condensé et permet les deux analyses. La question rhétorique rend clairement la protestation attribuée à Job sans nier l’autre lecture, conservée en note.
- issue: Rapport entre la souffrance et l’absence de פָשַׁע
  choice: 'Maintenir la protestation : la blessure est incurable bien qu’aucune transgression n’ait été commise'
  alternative: 'Traduire plus littéralement et sans articulation explicite : « ma flèche est incurable, sans transgression »'
  rationale: La formulation française explicite seulement le rapport concessif suggéré par le contexte, tout en préservant la tension théologique entre l’affliction de Job et sa revendication d’innocence.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire juridique de « droit » et la force morale de « transgression » sont conservés, tandis que la métaphore inhabituelle de la flèche est expliquée en note.
