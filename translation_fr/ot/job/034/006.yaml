  source_fidelity: La question rhétorique « Mentirais-je au sujet de mon droit ? » rend de manière recevable la lecture interrogative de עַל־מִשְׁפָּטִי אֲכַזֵּב. « Ma blessure est incurable » communique bien la valeur métaphorique probable de « ma flèche ». En revanche, « bien que je n’aie commis aucune transgression » introduit explicitement Job comme sujet et « commis » comme verbe, alors que בְלִי פָשַׁע exprime plus sobrement l’absence de transgression. Il est préférable de conserver cette absence sans explicitation personnelle indue.
