  text: אֵֽין חֹ֭שֶׁךְ וְ/אֵ֣ין צַלְמָ֑וֶת לְ/הִסָּ֥תֶר שָׁ֝֗ם פֹּ֣עֲלֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/022.yaml
  text: There is no darkness[a], and no deep shadow, where workers of wickedness may hide themselves.
translation:
  language: fr
  text: Il n’y a ni ténèbres ni ombre profonde[a] où puissent se cacher ceux qui font le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ombre de la mort ». Le terme hébreu peut aussi désigner une obscurité très profonde dans les textes poétiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... וְאֵין
  choice: Il n’y a ni… ni…
  rationale: La double négation existentielle hébraïque s’exprime naturellement en français par la construction corrélative « ni… ni… », qui conserve l’insistance du vers.
- source_word: חֹשֶׁךְ
  choice: ténèbres
  rationale: Ce nom désigne l’obscurité, au sens propre ou figuré. « Ténèbres » convient au registre poétique et forme un couple naturel avec « ombre profonde ».
- source_word: צַלְמָוֶת
  choice: ombre profonde
  rationale: Dans la poésie sapientiale, le terme peut évoquer une obscurité extrême sans renvoyer nécessairement à la mort. « Ombre profonde » préserve l’image et l’intensification poétique.
- source_word: לְהִסָּתֶר
  choice: où puissent se cacher
  rationale: L’infinitif avec ל exprime ici la possibilité ou la finalité de se dissimuler. Une proposition relative au subjonctif rend idiomatiquement le lien avec les lieux obscurs niés.
- source_word: שָׁם
  choice: où
  rationale: Littéralement « là », l’adverbe se rattache naturellement en français aux deux noms précédents sous la forme relative « où ».
- source_word: פֹּעֲלֵי אָוֶן
  choice: ceux qui font le mal
  rationale: Cette formulation actuelle et accessible conserve l’idée active de personnes qui accomplissent le mal, sans l’archaïsme possible de « artisans d’iniquité ».
- source_word: אָוֶן
  choice: le mal
  rationale: Dans ce contexte de conduite coupable soumise au regard divin, le terme désigne le mal moral. La traduction reste claire tout en évitant de préciser au-delà du contexte.
theological_decisions:
- issue: Sens de צַלְמָוֶת dans le contexte poétique
  choice: ombre profonde
  alternative: ombre de la mort ; obscurité profonde
  rationale: Le contexte porte sur l’impossibilité de se soustraire au regard de Dieu, non directement sur la mort. Le texte principal privilégie donc l’idée d’obscurité intense, tandis que la note conserve les autres valeurs possibles du terme.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe fluide. La tournure « ni… ni… » restitue la double négation, et « ceux qui font le mal » rend l’expression hébraïque de manière directe et compréhensible.
