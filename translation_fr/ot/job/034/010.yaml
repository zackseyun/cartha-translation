reference: Job 34:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֤ן אַ֥נֲשֵׁ֥י לֵבָ֗ב שִׁמְע֫וּ לִ֥/י חָלִ֖לָ/ה לָ/אֵ֥ל מֵ/רֶ֗שַׁע וְ/שַׁדַּ֥י מֵ/עָֽוֶל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/010.yaml
  text: 'Therefore[a], men of understanding, listen to me: far be it from God to do wickedness[b], and from the Almighty to do wrong.'
translation:
  language: fr
  text: 'C’est pourquoi, hommes de discernement[a], écoutez-moi : loin de Dieu la méchanceté[b], et loin du Tout-Puissant l’injustice !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « hommes de cœur », expression hébraïque désignant des hommes doués de compréhension et de discernement.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « Que Dieu fasse le mal, jamais ! et que le Tout-Puissant commette l’injustice, jamais ! » L’hébreu présente la méchanceté et l’injustice comme absolument inconcevables en Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conséquence tirée de l’argument précédent et conserve le lien logique dans un français naturel.
- source_word: אַנֲשֵׁי לֵבָב
  choice: hommes de discernement
  rationale: Littéralement « hommes de cœur » ; en hébreu, le cœur désigne ici la faculté de comprendre et de juger avec discernement. Le masculin pluriel du texte est conservé.
- source_word: שִׁמְעוּ לִי
  choice: écoutez-moi
  rationale: L’impératif accompagné de לִי appelle à prêter une attention directe au locuteur.
- source_word: חָלִילָה לָאֵל מֵרֶשַׁע
  choice: loin de Dieu la méchanceté
  rationale: חָלִילָה exprime une répudiation énergique ; la tournure nominale française préserve la formulation hébraïque et son idée d’exclusion absolue sans imposer un verbe absent.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Titre divin traduit selon son emploi traditionnel et intelligible en français, plutôt que translittéré.
- source_word: מֵעָוֶל
  choice: l’injustice
  rationale: עָוֶל désigne le tort moral ou l’injustice ; « injustice » convient au registre solennel et maintient le parallélisme avec « méchanceté ».
theological_decisions:
- issue: Portée de חָלִילָה avec les groupes prépositionnels
  choice: loin de Dieu la méchanceté, et loin du Tout-Puissant l’injustice
  alternative: Que Dieu fasse le mal, jamais ! et que le Tout-Puissant commette l’injustice, jamais !
  rationale: La formulation retenue conserve l’ambiguïté grammaticale entre l’exclusion de ces réalités par rapport à Dieu et l’idée implicite que Dieu ne les commet pas.
- issue: Traduction du titre שַׁדַּי
  choice: le Tout-Puissant
  alternative: Shaddaï
  rationale: Le terme fonctionne ici comme un titre divin ; sa traduction rend sa valeur immédiatement accessible sans introduire une lecture confessionnelle particulière.
- issue: Expression masculine אַנֲשֵׁי לֵבָב
  choice: hommes de discernement
  alternative: personnes de discernement
  rationale: Le choix conserve le masculin grammatical explicite de l’hébreu tout en rendant idiomatiquement le sens intellectuel et moral de « cœur ».
translation_notes:
  register: Français moderne, soutenu et oralement naturel. La construction exclamative « loin de… » garde la force solennelle de la répudiation hébraïque et le parallélisme poétique du verset.
