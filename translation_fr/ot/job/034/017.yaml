id: JOB.34.17
reference: Job 34:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/אַ֬ף שׂוֹנֵ֣א מִשְׁפָּ֣ט יַחֲב֑וֹשׁ וְ/אִם צַדִּ֖יק כַּבִּ֣יר תַּרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/017.yaml
  text: Can one who hates justice govern? And will you condemn the righteous Mighty One?[a][b]
translation:
  language: fr
  text: Celui qui déteste la justice pourrait-il gouverner[a] ? Et toi, condamnerais-tu le Juste, le Puissant[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « exercer l’autorité », « maîtriser » ou, plus littéralement, « lier ».
    reason: lexical_alternative
  - marker: b
    text: Ou « condamnerais-tu un puissant qui est juste ? » ou « le grand juste ? » L’expression désigne très probablement Dieu dans ce contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: הַאַף
  choice: pourrait-il
  rationale: La particule interrogative renforcée introduit une question rhétorique. Le conditionnel français exprime naturellement l'invraisemblance mise en relief dans ce contexte.
- source_word: שׂוֹנֵא
  choice: celui qui déteste
  rationale: Le participe substantivé désigne une personne caractérisée par son rejet de la justice.
- source_word: מִשְׁפָּט
  choice: la justice
  rationale: Le contexte concerne l'exercice juste de l'autorité et l'ordre moral, plutôt qu'un jugement particulier.
- source_word: יַחֲבוֹשׁ
  choice: gouverner
  rationale: Le sens premier est « lier », mais le verbe évoque probablement ici l'exercice de l'autorité ou de la maîtrise; « gouverner » convient au contexte judiciaire et politique.
- source_word: וְאִם
  choice: Et toi, ... ?
  rationale: La conjonction relie une seconde question rhétorique à la première. L'ajout explicite de « toi » rend en français la deuxième personne portée par le verbe.
- source_word: צַדִּיק
  choice: le Juste
  rationale: L'adjectif substantivé exprime la rectitude morale. La majuscule signale le référent divin probable sans supprimer l'ambiguïté dans la note.
- source_word: כַּבִּיר
  choice: le Puissant
  rationale: L'adjectif peut signifier « puissant » ou « grand » et fonctionne vraisemblablement ici comme une désignation de Dieu.
- source_word: תַּרְשִׁיעַ
  choice: condamnerais-tu
  rationale: Le hiphil de רשע signifie déclarer coupable ou condamner; le conditionnel s'accorde naturellement avec la force rhétorique du verset.
theological_decisions:
- issue: Référent de צַדִּיק כַּבִּיר
  choice: Dieu, rendu par « le Juste, le Puissant »
  alternative: « un puissant qui est juste » ou « le grand juste »
  rationale: Dans l'argument d'Élihou, la question dénonce l'absurdité de condamner Dieu, souverain parfaitement juste. La syntaxe hébraïque reste toutefois assez compacte pour permettre une autre analyse, conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux questions rhétoriques sont conservées; « Et toi » souligne sans lourdeur la deuxième personne. Les majuscules de « Juste » et « Puissant » indiquent le référent divin probable, tandis que la note préserve l'ambiguïté grammaticale.
