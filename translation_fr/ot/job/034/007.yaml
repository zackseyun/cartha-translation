  yaml_path: translation/ot/job/034/007.yaml
  text: What man is like Job[a], who drinks mockery like water?
translation:
  language: fr
  text: Quel homme est comme Job[a], lui qui boit la moquerie comme de l’eau ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui est un homme comme Job, qui boit la dérision comme de l’eau ? »'
    reason: La construction hébraïque מִי גֶבֶר peut aussi être rendue plus littéralement par « Qui est un homme… ? », et לַּעַג peut signifier « dérision ».
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: Quel homme
  rationale: La combinaison introduit une question rhétorique exprimant l’étonnement. « Quel homme » est naturel en français et conserve la référence masculine singulière à Job.
- source_word: כְּאִיּוֹב
  choice: est comme Job
  rationale: La préposition כְּ marque ici la comparaison. Cette formulation simple préserve directement la tournure hébraïque.
- source_word: יִשְׁתֶּה
  choice: boit
  rationale: Dans cette caractérisation rhétorique, l’imparfait hébreu décrit une conduite caractéristique ; le présent français rend naturellement cette valeur.
- source_word: לַּעַג
  choice: la moquerie
  rationale: Le nom désigne la dérision ou les railleries. « La moquerie » est courant et conserve l’image de paroles méprisantes que Job absorberait.
- source_word: כַּמָּיִם
  choice: comme de l’eau
  rationale: Cette comparaison exprime une consommation facile ou abondante. « Comme de l’eau » est idiomatique en français et garde l’image vive de l’hébreu.
