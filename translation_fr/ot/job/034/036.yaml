  text: אָבִ֗י יִבָּחֵ֣ן אִיּ֣וֹב עַד נֶ֑צַח עַל תְּ֝שֻׁבֹ֗ת בְּ/אַנְשֵׁי אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/036.yaml
  text: My father[a], let Job be tested to the limit[c][b], because of his answers like wicked men.
translation:
  language: fr
  text: Mon père[a], que Job soit éprouvé jusqu’au bout[b], à cause de ses réponses semblables à celles des hommes malfaisants[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ô mon père ! » L’hébreu porte littéralement « mon père », probablement employé comme une adresse, mais l’expression peut être comprise autrement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « jusqu’à perpétuité » ou « pour toujours » ; ici, l’expression peut vouloir dire que l’épreuve doit être menée jusqu’à son terme ou poussée à l’extrême.
    reason: lexical_alternative
  - marker: c
    text: Ou « avec les hommes malfaisants » ou « parmi les hommes malfaisants ». La préposition hébraïque peut exprimer la comparaison, la caractérisation ou l’association.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִי
  choice: Mon père
  rationale: Le syntagme signifie littéralement « mon père » et se comprend le plus naturellement comme un vocatif, même si cette lecture reste discutée.
- source_word: יִבָּחֵן
  choice: que Job soit éprouvé
  rationale: Le nifal imperfectif de בחן signifie « être éprouvé/examiné ». La tournure française au subjonctif rend ici la valeur de souhait.
- source_word: עַד נֶצַח
  choice: jusqu’au bout
  rationale: Littéralement « jusqu’à perpétuité / pour toujours » ; dans ce contexte d’examen, l’expression peut marquer une épreuve poussée à son terme plutôt qu’une durée infinie.
- source_word: עַל
  choice: à cause de
  rationale: La préposition introduit vraisemblablement le motif du souhait formulé au sujet de Job.
- source_word: תְּשֻׁבוֹת
  choice: réponses
  rationale: Le nom désigne les réponses ou répliques de Job dans le débat.
- source_word: בְּאַנְשֵׁי אָוֶן
  choice: dignes des hommes mauvais
  rationale: Cette formulation française exprime la lecture comparative ou caractérisante du beth sans faire de Job un membre explicite d’un groupe ; la possibilité d’une association est signalée en note.
theological_decisions:
- issue: Portée du souhait d’Élihou concernant l’épreuve de Job
  choice: Élihou souhaite que Job soit éprouvé à fond en raison du caractère de ses réponses.
  alternative: Job serait éprouvé pour toujours, ou éprouvé avec/parmi des hommes mauvais.
  rationale: Le texte est syntaxiquement difficile. La traduction conserve la force accusatrice des paroles d’Élihou sans transformer « jusqu’à perpétuité » en affirmation doctrinale d’une épreuve éternelle.
- issue: Rapport entre les réponses de Job et les hommes mauvais
  choice: Les réponses sont caractérisées comme dignes des hommes mauvais.
  alternative: Job répond avec ou parmi des hommes mauvais.
  rationale: Le beth peut exprimer la comparaison, la caractérisation ou l’association. Le texte principal adopte une formulation comparative naturelle, tandis que la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. « Jusqu’au bout » est idiomatique sans effacer le sens littéral conservé en note. « Hommes mauvais » garde la référence humaine explicite de אֲנָשִׁים et évite une terminologie confessionnelle.
