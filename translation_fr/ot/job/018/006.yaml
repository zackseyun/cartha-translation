  text: א֭וֹר חָשַׁ֣ךְ בְּ/אָהֳל֑/וֹ וְ֝/נֵר֗/וֹ עָלָ֥י/ו יִדְעָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/006.yaml
  text: The light in his tent grows dark[a], and his lamp above him is extinguished.
translation:
  language: fr
  text: 'La lumière s’assombrit dans sa tente,

    et sa lampe au-dessus de lui s’éteint.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹר
  choice: la lumière
  rationale: Le sens concret courant convient à l’image poétique de l’éclairage d’une habitation.
- source_word: חָשַׁךְ
  choice: s’assombrit
  rationale: Le verbe exprime le fait de devenir sombre; « s’assombrit » préserve cette valeur dynamique.
- source_word: בְּאָהֳלוֹ
  choice: dans sa tente
  rationale: Le nom désigne littéralement une tente, image poétique de l’habitation ou du foyer; la formulation française conserve cette image.
- source_word: וְנֵרוֹ
  choice: et sa lampe
  rationale: Le terme désigne concrètement une lampe, plutôt que la lumière en général, et maintient le parallélisme du vers.
- source_word: עָלָיו
  choice: au-dessus de lui
  rationale: La préposition peut exprimer une position sur, au-dessus ou par-dessus; ici, « au-dessus de lui » rend naturellement l’image spatiale de la lampe.
- source_word: יִדְעָךְ
  choice: s’éteint
  rationale: Le verbe signifie s’éteindre ou cesser de brûler, notamment à propos d’une lampe; « s’éteint » est naturel, précis et poétique en français.
theological_decisions: []
translation_notes:
