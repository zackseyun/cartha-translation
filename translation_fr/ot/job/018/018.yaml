  yaml_path: translation/ot/job/018/018.yaml
  text: They drive him from light into darkness[b][a], and banish him from the world.
translation:
  language: fr
  text: On le chasse de la lumière vers les ténèbres[a], on le bannit du monde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « On le repousse de la lumière dans les ténèbres. »'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut désigner le monde en général ou, plus précisément, le monde habité.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהְדְּפֻהוּ
  choice: On le chasse
  rationale: Le qal inaccompli à sujet pluriel indéterminé exprime l’action de repousser ou chasser quelqu’un. En français, « on » conserve naturellement ce sujet non précisé, tandis que « chasse » rend le mouvement forcé sans alourdir le vers.
- source_word: מֵאוֹר
  choice: de la lumière
  rationale: La préposition מ marque l’éloignement. Le français demande ici naturellement l’article défini dans l’opposition poétique entre la lumière et les ténèbres.
- source_word: אֶל חֹשֶׁךְ
  choice: vers les ténèbres
  rationale: אֶל indique la direction. « Vers les ténèbres » préserve cette valeur sans imposer l’idée plus précise d’une entrée déjà accomplie, tout en gardant le contraste poétique.
- source_word: וּמִתֵּבֵל
  choice: du monde
  rationale: תֵּבֵל désigne le monde, souvent envisagé comme le monde habité. « Du monde » est concis et naturel; une note conserve la nuance plus spécifique.
- source_word: יְנִדֻּהוּ
  choice: on le bannit
  rationale: Le verbe exprime l’éloignement ou l’exclusion imposée. « Bannir » rend bien cette expulsion et évite de répéter « chasser » dans le parallélisme.
theological_decisions: []
