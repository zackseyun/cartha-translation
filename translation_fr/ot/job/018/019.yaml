  text: לֹ֘א נִ֤ין ל֣/וֹ וְ/לֹא נֶ֣כֶד בְּ/עַמּ֑/וֹ וְ/אֵ֥ין שָׂ֝רִ֗יד בִּ/מְגוּרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/019.yaml
  text: He has neither offspring nor posterity among his people[b][a], and no survivor in the places where he sojourned.
translation:
  language: fr
  text: Il n’a ni descendant ni postérité parmi son peuple[a], et il ne reste aucun survivant dans ses lieux de séjour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ni enfant ni petit-enfant » ; les deux termes hébreux associés expriment la disparition complète de sa lignée.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans ses demeures » ou « dans ses lieux d’habitation » ; le terme hébreu peut désigner aussi bien des lieux de résidence que des lieux de séjour.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִין
  choice: descendant
  rationale: Le terme désigne la progéniture ou un membre de la lignée. « Descendant » est clair en français actuel et n’impose pas le sens plus étroit de « fils ».
- source_word: נֶכֶד
  choice: postérité
  rationale: Dans le binôme נִין וְנֶכֶד, le mot évoque la continuation de la lignée, éventuellement un petit-enfant. « Postérité » rend ici l’idée de l’extinction complète des descendants.
- source_word: בְּעַמּוֹ
  choice: parmi son peuple
  rationale: Cette expression situe l’absence de descendance au sein de la communauté à laquelle l’homme appartient.
- source_word: שָׂרִיד
  choice: survivant
  rationale: Le nom désigne quelqu’un qui subsiste après une disparition ou un désastre. « Survivant » est précis et évite les connotations collectives ou théologiques possibles de « reste ».
- source_word: בִּמְגוּרָיו
  choice: dans ses lieux de séjour
  rationale: Le pluriel מְגוּרָיו peut désigner les endroits où quelqu’un séjourne ou habite. « Lieux de séjour » maintient cette nuance sans trancher en faveur de résidences permanentes.
theological_decisions: []
