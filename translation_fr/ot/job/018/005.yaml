source:
  edition: WLC
  text: גַּ֤ם א֣וֹר רְשָׁעִ֣ים יִדְעָ֑ךְ וְ/לֹֽא יִ֝גַּ֗הּ שְׁבִ֣יב אִשּֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/005.yaml
  text: Indeed[a], the light of the wicked is put out, and the flame of his fire does not shine.
translation:
  language: fr
  text: Oui, la lumière des méchants s’éteint, et la flamme de leur feu ne brille pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’étincelle de leur feu ne brille pas ». Le mot hébreu peut désigner une étincelle aussi bien qu’une flamme.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Oui
  rationale: La particule a ici une valeur emphatique qui introduit l’affirmation de Bildad. « Oui » rend cette force naturellement en français sans lui donner un sens simplement additif.
- source_word: אוֹר
  choice: lumière
  rationale: Le sens concret de « lumière » est conservé afin de préserver l’image poétique, même si elle évoque métaphoriquement la vie ou la prospérité.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Le pluriel désigne les personnes mauvaises comme une catégorie générale. Après « la lumière », le complément « des méchants » est naturel en français.
- source_word: יִדְעָךְ
  choice: s’éteint
  rationale: Le verbe décrit une lumière qui faiblit jusqu’à s’éteindre. La forme pronominale française est idiomatique et n’introduit aucun agent explicite.
- source_word: וְלֹא
  choice: et ... ne ... plus
  rationale: La coordination et la négation sont rendues naturellement. « Ne brille plus » exprime la cessation impliquée par le parallélisme avec « s’éteint ».
- source_word: יִגַּהּ
  choice: brille
  rationale: Le verbe désigne l’émission de lumière; « briller » conserve simplement l’image poétique.
- source_word: שְׁבִיב
  choice: flamme
  rationale: Le terme peut désigner une flamme ou une étincelle. « Flamme » s’accorde bien avec « feu » et le parallélisme lumineux, tandis que l’autre sens est signalé en note.
- source_word: אִשּׁוֹ
  choice: leur feu
  rationale: Le nom signifie « feu ». Le suffixe masculin singulier renvoie distributivement à chacun des méchants; le pluriel français « leur » assure un renvoi naturel à ce collectif sans remplacer l’image par celle d’une lampe.
theological_decisions: []
translation_notes:
  register: Poésie sobre, actuelle et digne. L’image de la lumière et du feu est conservée plutôt qu’explicitée. Le pronom possessif est harmonisé au pluriel collectif « les méchants », usage naturel en français.
