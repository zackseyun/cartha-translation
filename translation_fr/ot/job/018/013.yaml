  text: יֹ֭אכַל בַּדֵּ֣י עוֹר֑/וֹ יֹאכַ֥ל בַּ֝דָּ֗י/ו בְּכ֣וֹר מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/013.yaml
  text: It devours the limbs of his skin[a]; the firstborn of death devours his limbs.
translation:
  language: fr
  text: Il dévore les membres de sa peau[a] ; le premier-né de la mort dévore ses membres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet du premier « dévore » n’est pas exprimé en hébreu. Le « il » est requis en français; il peut renvoyer au « premier-né de la mort » du second membre, ou à un agent destructeur implicite. « Le premier-né de la mort » est une expression poétique qui peut évoquer le fléau le plus meurtrier ou l’agent principal de la mort.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹאכַל
  choice: il dévore
  rationale: Le qal inaccompli, répété dans les deux membres du vers, décrit avec force une action destructrice. Le sujet du premier verbe n’est pas exprimé en hébreu ; le français emploie « il » de façon anticipée, le sujet poétique étant nommé dans le second membre.
- source_word: בַּדֵּי / בַּדָּיו
  choice: les membres de / ses membres
  rationale: Dans cette image corporelle, בדים désigne vraisemblablement les membres ou parties du corps. « Membres » préserve le caractère anatomique et la répétition de l’hébreu.
- source_word: עוֹרוֹ
  choice: sa peau
  rationale: Rendu direct et naturel de עוֹר avec le suffixe possessif de troisième personne.
- source_word: בְּכוֹר מָוֶת
  choice: le premier-né de la mort
  rationale: Cette traduction conserve l’expression poétique frappante et son ambiguïté, sans la réduire à une maladie précise ni à une interprétation particulière.
theological_decisions:
- issue: Sens de בְּכוֹר מָוֶת
  choice: Conserver « le premier-né de la mort » comme agent poétique de destruction.
  alternative: Une maladie mortelle ; la plus terrible des morts ; l’agent principal de la mort.
  rationale: L’expression hébraïque est métaphorique et discutée. La conserver évite d’imposer une explication que le texte ne précise pas.
- issue: Sujet du premier יֹאכַל
  choice: Employer « il » par anticipation, renvoyant au « premier-né de la mort » nommé ensuite.
  alternative: Employer une tournure impersonnelle ou prendre un élément du contexte précédent comme sujet.
  rationale: L’hébreu ne nomme pas explicitement le sujet dans le premier membre. La reprise exacte du verbe et la nomination de l’agent dans le second permettent cette lecture naturelle, tout en signalant l’ambiguïté en note.
translation_notes:
  register: Français moderne, digne et poétique. La répétition de « dévore » et de « membres » reproduit le parallélisme hébreu ; l’image inhabituelle « membres de sa peau » est conservée plutôt que lissée.
