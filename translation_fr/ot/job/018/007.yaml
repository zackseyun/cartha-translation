  yaml_path: translation/ot/job/018/007.yaml
  text: His vigorous steps are constrained[b][a], and his own counsel casts him down.
translation:
  language: fr
  text: Ses pas vigoureux sont à l’étroit[a], et son propre projet le fait tomber[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ses pas pleins de force sont entravés » ; le verbe peut exprimer le resserrement ou la restriction, et אוֹן la force ou la vigueur.
    reason: lexical_alternative
  - marker: b
    text: Ou « son propre dessein le renverse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצְרוּ
  choice: se resserrent
  rationale: Le verbe, au pluriel avec « pas » pour sujet, décrit un mouvement dont l’espace se réduit ou devient entravé. « Se resserrent » conserve l’image poétique sans en préciser excessivement la cause.
- source_word: צַעֲדֵי
  choice: pas
  rationale: Le pluriel construit de צעד désigne les pas ou les enjambées. « Pas » est le terme français le plus direct et naturel ici.
- source_word: אוֹנוֹ
  choice: vigoureux
  rationale: אוֹן peut évoquer la force ou la vigueur. Dans son rapport avec « pas », l’adjectif « vigoureux » exprime naturellement l’idée de pas accomplis avec force, tout en évitant les sens moins probables de richesse ou de malheur.
- source_word: וְתַשְׁלִיכֵהוּ
  choice: le fait tomber
  rationale: La forme hiphil de שלך indique que le sujet féminin singulier, « son projet », provoque sa chute. « Le fait tomber » rend clairement cette valeur causative sans ajouter une violence absente du terme lui-même.
- source_word: עֲצָתוֹ
  choice: son propre projet
  rationale: עֵצָה peut désigner un conseil, un dessein ou un projet. « Son propre projet » rend l’ironie de ses plans qui se retournent contre lui et convient au français courant.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le parallélisme est conservé, ainsi que l’image des pas vigoureux dont l’élan est restreint et l’ironie d’un projet qui provoque la chute de son auteur.
