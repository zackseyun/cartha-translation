  text: כִּֽי שֻׁלַּ֣ח בְּ/רֶ֣שֶׁת בְּ/רַגְלָ֑י/ו וְ/עַל שְׂ֝בָכָ֗ה יִתְהַלָּֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/008.yaml
  text: For he is sent into a net by his own feet, and he walks onto a mesh.
translation:
  language: fr
  text: 'Car ses propres pieds l’envoient dans un filet[a],

    et il marche sur un treillis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Car il est envoyé dans un filet par ses pieds. »'
    reason: Signaler la forme passive de l’hébreu et préserver la possibilité d’une lecture plus formelle.
lexical_decisions:
- source_word: שֻׁלַּח (shullaḥ)
  choice: l’envoient
  rationale: Le pual signifie littéralement « être envoyé ». La tournure active avec « ses propres pieds » comme sujet naturel en français conserve l’idée que sa propre marche le conduit au piège, sans alourdir le vers par un passif peu idiomatique.
- source_word: רֶשֶׁת (reshet)
  choice: filet
  rationale: Terme courant pour un filet servant à capturer; il maintient l’image de piège du contexte.
- source_word: שְׂבָכָה (sevakhah)
  choice: réseau de mailles
  rationale: Le mot désigne un entrelacs ou un treillis. « Réseau de mailles » préserve l’image concrète tout en laissant ouverte la nature précise du dispositif.
- source_word: יִתְהַלָּךְ (yithallakh)
  choice: il marche
  rationale: Le hitpael exprime ici le fait de marcher ou de circuler; la traduction simple convient au parallélisme avec les pieds.
theological_decisions:
- issue: Responsabilité de l’homme pris au piège
  choice: ses propres pieds l’envoient
  alternative: il est envoyé dans un filet par ses pieds
  rationale: La formulation garde l’accent du texte sur ses propres pas comme moyen de son entrée dans le piège, sans préciser au-delà du verset qui l’aurait préparé ou envoyé.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme poétique et les deux images proches du filet et du maillage sont conservés; la première proposition est légèrement restructurée pour être naturelle en français.
