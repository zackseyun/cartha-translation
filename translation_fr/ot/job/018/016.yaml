  yaml_path: translation/ot/job/018/016.yaml
  text: His roots dry up beneath[a], and above, his branch withers.
translation:
  language: fr
  text: En dessous, ses racines se dessèchent ; au-dessus, sa ramure est coupée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa ramure se flétrit ». Le verbe hébreu peut être compris comme exprimant soit le retranchement, soit le flétrissement ; le nom traduit par « ramure » signifie habituellement « moisson » ou ce qui est coupé.
    reason: ambiguïté lexicale
lexical_decisions:
- source_word: מִתַּחַת
  choice: en dessous
  rationale: Rend la localisation sous terre et forme un parallèle naturel en français avec « au-dessus ».
- source_word: שָׁרָשָׁיו
  choice: ses racines
  rationale: Conserve le pluriel hébreu et l’image végétale.
- source_word: יִבָשׁוּ
  choice: se dessèchent
  rationale: Exprime naturellement l’assèchement progressif des racines sans ajouter une cause absente du texte.
- source_word: וּמִמַּעַל
  choice: au-dessus
  rationale: Préserve l’opposition spatiale concise entre la partie souterraine et la partie supérieure de la plante.
- source_word: יִמַּל
  choice: est coupée
  rationale: Retient le sens de retranchement appliqué à la végétation, tout en laissant la note signaler l’autre compréhension possible, « se flétrit ».
- source_word: קְצִירוֹ
  choice: sa ramure
  rationale: Dans le parallélisme avec les racines, le nom désigne vraisemblablement la croissance supérieure de la plante. « Ramure » rend cette réalité de façon collective et poétique sans la limiter à une seule branche.
