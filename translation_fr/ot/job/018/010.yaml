base_translation:
  language: en
  yaml_path: translation/ot/job/018/010.yaml
  text: His rope is hidden in the ground[a], and his trap on the path.
translation:
  language: fr
  text: 'Sa corde est cachée dans le sol[a],

    et son piège sur le sentier.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Son cordon est dissimulé dans la terre, et son piège sur le chemin. »'
    reason: Alternative lexicale reflétant les sens possibles de חבל, אֶרֶץ et נָתִיב.
lexical_decisions:
- source_word: טָמוּן
  choice: est cachée
  rationale: Le participe passif de טמן décrit ce qui a été dissimulé ou enfoui. « Est cachée » conserve cette valeur tout en restant naturel en français moderne.
- source_word: בָּאָרֶץ
  choice: dans le sol
  rationale: Dans le contexte de la pose d’un piège, אֶרֶץ désigne concrètement le sol où la corde est dissimulée, plutôt que le pays ou la terre au sens large.
- source_word: חַבְלוֹ
  choice: sa corde
  rationale: חבל peut désigner une corde ou un cordon. Ici, il s’agit vraisemblablement d’un élément du dispositif de piégeage ; « corde » est concret, courant et fidèle.
- source_word: וּמַלְכֻּדְתּוֹ
  choice: et son piège
  rationale: מַלְכֹּדֶת désigne un piège, un traquenard ou un dispositif de capture. « Piège » est le terme français le plus large et le plus accessible.
- source_word: עֲלֵי נָתִיב
  choice: sur le sentier
  rationale: La préposition עֲלֵי situe le piège sur la voie, et נָתִיב évoque un sentier ou un chemin. « Sur le sentier » restitue clairement l’endroit où passe la victime.
