  text: זִֽכְר/וֹ אָ֭בַד מִנִּי אָ֑רֶץ וְ/לֹא שֵׁ֥ם ל֝֗/וֹ עַל פְּנֵי חֽוּץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/017.yaml
  text: His memory perishes from the earth[a], and he has no name on the face of the street.
translation:
  language: fr
  text: Son souvenir disparaît de la terre[a], et il n’a pas de nom dans la rue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Son souvenir disparaît du pays, et il n’a pas de nom sur la place publique. »
    reason: 'Alternative lexicale : אֶרֶץ peut signifier « terre » ou « pays », et חוּץ peut désigner la rue, l’extérieur ou un espace public.'
lexical_decisions:
- source_word: זִכְרוֹ
  choice: son souvenir
  rationale: Le nom désigne ici le souvenir laissé par la personne dans la mémoire collective. « Son souvenir » est naturel en français et garde cette portée.
- source_word: אָבַד
  choice: disparaît
  rationale: Le verbe peut signifier périr, se perdre ou disparaître. Avec « souvenir » comme sujet, « disparaît » exprime clairement l’effacement évoqué par le vers.
- source_word: מִנִּי אָרֶץ
  choice: de la terre
  rationale: אֶרֶץ peut désigner la terre ou le pays. Le contexte poétique d’un effacement complet favorise « de la terre », tout en laissant l’autre possibilité en note.
- source_word: וְלֹא שֵׁם לוֹ
  choice: et son nom n’est plus connu
  rationale: La tournure hébraïque signifie littéralement qu’il n’a pas de nom. En contexte, le nom représente l’identité, la réputation et la mémoire publique; cette formulation française en explicite naturellement la disparition sans ajouter une idée étrangère.
- source_word: עַל־פְּנֵי חוּץ
  choice: dans la rue
  rationale: חוּץ évoque l’extérieur, la rue ou l’espace public. « Dans la rue » rend idiomatiquement le lieu public où le nom d’une personne serait connu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et poétique. La formulation conserve le parallélisme entre la disparition du souvenir et celle du nom dans l’espace public.
