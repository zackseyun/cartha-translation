  source_fidelity: La première proposition rend correctement l’obscurité syntaxique de l’hébreu et l’image de la dépossession. Toutefois, « n’est plus à lui » introduit une nuance temporelle (« plus ») qui n’est pas exprimée de façon certaine par מִבְּלִי לוֹ. « Ne lui appartient pas » conserve plus exactement l’ellipse et l’ambiguïté, sans exclure le contexte de dépossession.
  naturalness: La formulation proposée est sobre et naturelle en français moderne. « Dans sa tente habite ce qui ne lui appartient pas » maintient l’ordre poétique marqué sans devenir artificiel. « Du soufre est répandu » est idiomatique et évite d’inventer l’agent du verbe hébreu.
  terminology: « Tente », « demeure » et « soufre » sont des choix exacts, cohérents et modernes. La note doit signaler les lectures concurrentes sans présenter l’une d’elles comme certaine.
