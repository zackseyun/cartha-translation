  yaml_path: translation/ot/job/018/015.yaml
  text: In his tent dwells no longer his[b][a]; sulfur is scattered over his dwelling.
translation:
  language: fr
  text: Dans sa tente habite ce qui ne lui appartient pas[a] ; du soufre est répandu sur sa demeure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile. On peut aussi comprendre : « Dans sa tente ne demeure rien qui lui appartienne », ou voir dans le soufre mentionné ensuite le sujet différé de « habite ».'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁכּוֹן
  choice: habite
  rationale: Le verbe שכן signifie « habiter, s’établir ». Sa forme féminine singulière est syntaxiquement difficile ici, faute de sujet féminin explicite placé avant lui ; la traduction conserve donc une formulation ouverte plutôt que d’identifier catégoriquement le sujet.
- source_word: בְּאָהֳלוֹ
  choice: dans sa tente
  rationale: אֹהֶל désigne concrètement la tente. Ce terme préserve l’image du texte, même si la tente représente aussi le foyer.
- source_word: מִבְּלִי לוֹ
  choice: ce qui n’est plus à lui
  rationale: Cette expression elliptique évoque l’absence et la perte de ce qui était en relation avec l’homme. « N’est plus à lui » rend la dépossession sans préciser indûment l’identité de ce qui occupe la tente.
- source_word: יְזֹרֶה
  choice: est répandu
  rationale: Le piel de זרה signifie « disperser, répandre ». Bien que la forme soit active à la troisième personne masculine, elle peut avoir un emploi impersonnel ; le passif français évite d’inventer un agent.
- source_word: עַל נָוֵהוּ
  choice: sur sa demeure
  rationale: נָוֶה peut désigner une habitation ou un pâturage. Le parallélisme avec « sa tente » favorise ici « sa demeure ».
- source_word: גָפְרִית
  choice: soufre
  rationale: גָפְרִית désigne le soufre associé à la destruction et au jugement. « Soufre » est le terme français moderne et naturel.
theological_decisions:
- issue: Sujet du verbe féminin et sens de l’expression elliptique מִבְּלִי לוֹ
  choice: Une présence non identifiée habite désormais la tente dont l’homme est dépossédé.
  alternative: Le soufre, placé à la fin du verset, est le sujet différé de « habite » ; ou bien rien de ce qui appartient à l’homme ne demeure dans sa tente.
  rationale: L’hébreu est fortement condensé et permet plusieurs analyses. Le texte principal exprime la dépossession sans nommer la présence, tandis que la note signale les autres lectures plausibles et préserve la tension du texte.
translation_notes:
  register: Français international moderne, sobre et poétique. L’ordre des deux propositions suit l’hébreu ; « tente » et « demeure » maintiennent le parallélisme concret, et la syntaxe légèrement marquée de la première proposition reflète l’obscurité réelle du texte source.
