  yaml_path: translation/ot/job/018/009.yaml
  text: A trap seizes him by the heel[a]; a snare holds him fast.
translation:
  language: fr
  text: Un piège le saisit au talon[a] ; un lacet le tient fermement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un piège l’attrape par le talon ; un nœud coulant le serre. » Le dernier nom est rare et peut désigner un type particulier de lacet ou de piège.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאחֵז
  choice: saisit
  rationale: Le qal inaccompli de אחז exprime l’action de saisir ou d’attraper. « Saisit » restitue avec force l’image du piège.
- source_word: בְּעָקֵב
  choice: au talon
  rationale: עָקֵב désigne le talon ; avec ב, « au talon » indique naturellement en français l’endroit où la victime est prise.
- source_word: פָּח
  choice: piège
  rationale: פָּח désigne couramment un piège ou un dispositif de capture. « Piège » permet de le distinguer du terme rare du second membre.
- source_word: יַחֲזֵק
  choice: tient fermement
  rationale: Le hiphil inaccompli de חזק exprime ici une prise forte et durable. « Tient fermement » conserve l’intensité et le parallélisme avec « saisit ».
- source_word: עָלָיו
  choice: le
  rationale: Le français exprime idiomatiquement la personne visée par un pronom objet direct avec « tenir » ; la relation hostile ou contraignante portée par על est conservée par le contexte.
- source_word: צַמִּים
  choice: lacet
  rationale: Ce nom rare semble désigner une sorte de piège, probablement un lacet ou un nœud coulant. « Lacet » maintient la distinction lexicale avec פָּח sans imposer une précision excessive.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme des deux membres est préservé, ainsi que l’incertitude entourant le nom rare צַמִּים.
