id: JOB.18.21
reference: Job 18:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַךְ אֵ֭לֶּה מִשְׁכְּנ֣וֹת עַוָּ֑ל וְ֝/זֶ֗ה מְק֣וֹם לֹא יָדַֽע אֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/018/021.yaml
  text: Surely these are the dwellings of the unjust[b][a], and this is the place of one who does not know God.
translation:
  language: fr
  text: Certes, telles sont les demeures de l’injuste[a] ; tel est le lieu de celui qui ne connaît pas Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du méchant » ou « du malfaiteur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Oui
  rationale: La particule a ici une valeur emphatique qui conclut le discours de Bildad. « Oui » exprime naturellement cette affirmation solennelle sans lui donner le sens restrictif de « seulement ».
- source_word: אֵלֶּה
  choice: telles sont
  rationale: Le démonstratif pluriel renvoie au sort décrit dans les versets précédents. La tournure française « telles sont » rend le résumé conclusif de façon naturelle.
- source_word: מִשְׁכְּנוֹת
  choice: les demeures
  rationale: Le nom désigne largement des lieux d’habitation. « Demeures » conserve le pluriel et évite de préciser indûment qu’il s’agit de tentes.
- source_word: עַוָּל
  choice: l’homme injuste
  rationale: Le terme désigne une personne caractérisée par l’injustice ou le mal. « L’homme injuste » conserve sa nuance morale et juridique tout en rendant explicite la référence personnelle impliquée par le singulier hébreu.
- source_word: וְזֶה
  choice: tel est
  rationale: Le second démonstratif introduit un membre parallèle et récapitulatif. « Tel est » reproduit clairement ce parallélisme en français.
- source_word: מְקוֹם
  choice: le lieu
  rationale: « Lieu » est l’équivalent direct et maintient le lien avec les « demeures » du premier membre sans ajouter l’idée plus précise de foyer.
- source_word: לֹא יָדַע אֵל
  choice: celui qui ne connaît pas Dieu
  rationale: 'La formulation garde le verbe « connaître » et son ambiguïté féconde : il peut évoquer plus qu’une simple connaissance intellectuelle, sans que la traduction impose une paraphrase relationnelle ou morale.'
- source_word: אֵל
  choice: Dieu
  rationale: Dans ce contexte du livre de Job, אֵל désigne Dieu. Il n’est pas nécessaire de développer le terme en un titre tel que « Dieu tout-puissant ».
theological_decisions:
- issue: Sens de « ne connaît pas Dieu »
  choice: Conserver littéralement « ne connaît pas Dieu »
  alternative: Expliciter par « ne reconnaît pas Dieu » ou « n’a aucune relation avec Dieu »
  rationale: Le contexte sapientiel peut donner à « connaître » une portée relationnelle et morale, mais le texte ne l’explicite pas. La traduction préserve donc sa tension et sa polysémie plutôt que de choisir une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « telles sont… tel est… » reflète la structure conclusive du verset. Le singulier collectif/personnel עַוָּל est rendu par « l’homme injuste » afin d’éviter le français substantivé moins naturel « l’injuste ».
