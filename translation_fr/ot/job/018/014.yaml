id: JOB.18.14
reference: Job 18:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִנָּתֵ֣ק מֵ֭/אָהֳל/וֹ מִבְטַח֑/וֹ וְ֝/תַצְעִדֵ֗/הוּ לְ/מֶ֣לֶךְ בַּלָּהֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/014.yaml
  text: He is torn from the security of his tent[b][a], and he is marched off to the king of terrors.
translation:
  language: fr
  text: 'Il est arraché à la sécurité de sa tente[a],

    et entraîné vers le roi des terreurs[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il est arraché à sa tente, qui était sa sécurité. » L’hébreu peut présenter la tente soit comme un lieu sûr, soit comme ce en quoi il mettait sa confiance.'
    reason: lexical_alternative
  - marker: b
    text: « Le roi des terreurs » est une expression poétique, souvent comprise comme une personnification de la mort.
    reason: alternative_reading
lexical_decisions:
- source_word: יִנָּתֵק
  choice: est arraché
  rationale: Le nifal de נתק exprime l’action violente d’être détaché, arraché ou déraciné. « Est arraché » restitue clairement cette valeur passive.
- source_word: מֵאָהֳלוֹ
  choice: à … sa tente
  rationale: אֹהֶל désigne littéralement une tente et, par extension, une demeure. « Tente » conserve l’image concrète et poétique du texte.
- source_word: מִבְטַחוֹ
  choice: la sécurité
  rationale: מִבְטָח peut désigner la sécurité, la confiance ou ce qui inspire confiance. « La sécurité de sa tente » rend naturellement la tente comme lieu ou source de sécurité, tout en signalant en note l’autre construction possible.
- source_word: וְתַצְעִדֵהוּ
  choice: et entraîné
  rationale: Le hifil de צעד signifie « faire avancer, conduire ». La forme verbale a un sujet féminin singulier non exprimé ou implicite. La coordination elliptique au passif évite de lui attribuer arbitrairement une identité, tandis que « entraîné » conserve l’idée d’un déplacement imposé.
- source_word: לְמֶלֶךְ
  choice: vers le roi
  rationale: La préposition לְ marque ici la direction. « Vers » exprime le mouvement sans imposer l’idée d’une comparution devant ce roi.
- source_word: בַּלָּהוֹת
  choice: des terreurs
  rationale: Le pluriel בַּלָּהוֹת évoque des terreurs ou des épouvantes. « Le roi des terreurs » garde intacte la métaphore saisissante de l’hébreu.
theological_decisions:
- issue: Identité du « roi des terreurs »
  choice: Conserver l’expression poétique sans identifier explicitement son référent.
  alternative: La mort personnifiée, le séjour des morts ou un souverain démoniaque.
  rationale: Le texte hébreu ne précise pas l’identité de ce « roi ». La traduction préserve donc son ambiguïté poétique et théologique; la note ne mentionne la mort personnifiée que comme compréhension fréquente.
- issue: Sujet implicite de וְתַצְעִדֵהוּ
  choice: 'Employer une construction passive elliptique : « et entraîné ».'
  alternative: « Et elle l’entraîne », « et on le conduit » ou « et il est conduit ».
  rationale: La forme hébraïque est à la troisième personne du féminin singulier, mais son sujet n’est pas explicitement nommé dans le verset. Le passif français préserve cette indétermination sans créer un antécédent artificiel.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme sur deux lignes convient au registre sapientiel. « Arraché » et « entraîné » communiquent la violence subie, tandis que « tente » et « roi des terreurs » conservent les images concrètes de l’hébreu.
