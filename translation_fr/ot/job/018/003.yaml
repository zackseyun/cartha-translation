  text: Why are we regarded as cattle[b][a], and considered unclean in your eyes?
translation:
  language: fr
  text: Pourquoi sommes-nous considérés comme des bêtes[a], tenus pour stupides à vos yeux[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des animaux ». Le mot hébreu désigne largement une bête ou un animal, souvent domestique ; la comparaison est ici méprisante.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu traduit par « tenus pour stupides » est difficile. Il est souvent compris au sens de « stupides » ou « abrutis » ; certains y voient plutôt l’idée d’être impurs ou souillés.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: L’adverbe interrogatif introduit une question rhétorique; « Pourquoi » est direct et naturel en français.
- source_word: נֶחְשַׁבְנוּ
  choice: sommes-nous considérés
  rationale: Le verbe passif exprime la manière dont Bildad et ses compagnons sont jugés ou estimés.
- source_word: כַבְּהֵמָה
  choice: comme des bêtes
  rationale: בְּהֵמָה est un terme large désignant un animal, souvent domestique. « Des bêtes » restitue ici la comparaison méprisante sans la limiter au bétail.
- source_word: נִטְמִינוּ
  choice: tenus pour impurs
  rationale: La forme hébraïque est difficile. Cette traduction suit l’analyse qui y voit l’idée d’impureté et conserve le parallélisme évaluatif avec « considérés ».
- source_word: בְּעֵינֵיכֶם
  choice: à vos yeux
  rationale: Cette expression française naturelle conserve l’image de l’idiome hébreu désignant un jugement ou une perception.
theological_decisions:
- issue: Sens de נִטְמִינוּ
  choice: tenus pour impurs
  alternative: tenus pour stupides / abrutis
  rationale: Le mot est textuellement et lexicalement difficile. Le texte principal retient l’analyse liée à l’impureté, tout en signalant en note que d’autres compréhensions existent, afin de ne pas masquer l’incertitude.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le parallélisme de la question hébraïque, tandis que les notes préservent l’étendue de בְּהֵמָה et l’incertitude réelle entourant נִטְמִינוּ.
