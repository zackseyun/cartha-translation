  source_fidelity: 'Le texte rend fidèlement les deux propositions poétiques : יְהִי רָעֵב אֹנוֹ est bien exprimé par « Sa force est affamée », en conservant la métaphore saisissante de la vigueur réduite à la faim; וְאֵיד נָכוֹן לְצַלְעוֹ est correctement rendu par « et le malheur se tient prêt à son côté ». Le présent descriptif est défendable pour l’imparfait poétique, et « à son côté » respecte la lecture concrète la plus directe de לְצַלְעוֹ.'
