source:
  edition: WLC
  text: יְהִי רָעֵ֥ב אֹנ֑/וֹ וְ֝/אֵ֗יד נָכ֥וֹן לְ/צַלְעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/012.yaml
  text: His strength is famished[a], and calamity is ready at his side.
translation:
  language: fr
  text: 'Sa force est affamée,

    et le malheur se tient prêt à son côté[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prêt pour sa chute ». Le mot hébreu peut désigner le « côté », mais certains le comprennent ici au sens de faux pas ou de chute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: est
  rationale: L’imparfait qal de היה a ici une valeur descriptive dans le discours poétique. Le présent français rend naturellement cet état sans lui donner une valeur volitive.
- source_word: רָעֵב
  choice: affamée
  rationale: L’adjectif exprime la faim; « affamée » conserve l’image forte et inhabituelle d’une vigueur privée de ressources.
- source_word: אֹנוֹ
  choice: sa force
  rationale: אוֹן peut désigner la force, la vigueur ou les ressources. « Sa force » convient au tableau d’un homme dont la puissance dépérit, tout en préservant la métaphore.
- source_word: וְאֵיד
  choice: et le malheur
  rationale: אֵיד désigne une calamité ou un désastre. « Le malheur » est naturel en français tout en gardant la gravité poétique du contexte.
- source_word: נָכוֹן
  choice: se tient prêt
  rationale: Le terme présente le malheur comme préparé, fermement disposé à frapper. « Se tient prêt » restitue cette personnification avec naturel.
- source_word: לְצַלְעוֹ
  choice: à son côté
  rationale: צלע désigne couramment le côté ou la côte. Le singulier concret « à son côté » conserve l’image d’un malheur posté tout près de lui; une compréhension liée au faux pas ou à la chute reste possible et est signalée en note.
theological_decisions: []
translation_notes:
  register: Vers poétique rendu dans un français moderne et digne. L’expression volontairement frappante « sa force est affamée » conserve la métaphore hébraïque, tandis que « se tient prêt » personnifie naturellement le malheur. La mise en vers respecte le parallélisme.
