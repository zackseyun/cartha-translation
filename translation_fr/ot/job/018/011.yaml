  text: סָ֭בִיב בִּֽעֲתֻ֣/הוּ בַלָּה֑וֹת וֶ/הֱפִיצֻ֥/הוּ לְ/רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/011.yaml
  text: Terrors frighten him on every side[a], and scatter him at his feet.
translation:
  language: fr
  text: 'De toutes parts, des terreurs l’épouvantent

    et le font fuir à chacun de ses pas[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « à ses pieds ». Cette expression peut aussi évoquer des terreurs qui le talonnent ou le poussent en avant partout où il va.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָבִיב
  choice: De toutes parts
  rationale: Rend naturellement la valeur adverbiale d’un encerclement venant de toutes les directions.
- source_word: בִּעֲתֻהוּ
  choice: l’épouvantent
  rationale: Le verbe exprime une peur intense ou soudaine; « épouvanter » convient au registre poétique et évite la répétition maladroite « des terreurs le terrifient ».
- source_word: בַלָּהוֹת
  choice: des terreurs
  rationale: Correspond directement au pluriel hébreu désignant des causes d’effroi ou des alarmes terribles.
- source_word: וֶהֱפִיצֻהוּ
  choice: le pourchassent
  rationale: Dans ce contexte, le causatif évoque des terreurs qui dispersent ou chassent l’homme devant elles. « Pourchassent » rend clairement ce mouvement sans conserver le peu naturel « le dispersent » appliqué à une seule personne.
- source_word: לְרַגְלָיו
  choice: pas à pas
  rationale: Littéralement « à ses pieds ». L’expression française « pas à pas » conserve l’image des pieds et exprime naturellement des terreurs qui le suivent ou le poussent partout où il marche.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme est conservé sur deux lignes; la métaphore dynamique du second hémistiche est explicitée avec retenue, tandis que la note signale la formulation littérale et l’ambiguïté spatiale.
