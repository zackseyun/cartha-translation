review_pass:
  verdict: revise
  source_fidelity: Le sens général et l’image de rage autodestructrice sont bien rendus. La seconde personne est justifiée par « pour toi » (לְמַעַנְךָ), malgré l’ouverture formellement à la troisième personne. « Pour toi » correspond plus précisément à לְמַעַן que « à cause de toi », qui peut réduire la nuance à une causalité défavorable.
  naturalness: La reformulation interrogative proposée est plus idiomatique et plus énergique en français moderne. « De sa place » est plus naturel que « de son lieu » pour un rocher, sans perte de sens. La note actuelle contient « déchire son être », formulation peu naturelle et imprécise en français.
  terminology: « Te déchires dans ta colère », « la terre » et « un rocher » conviennent. La note doit rendre compte de נֶפֶשׁ sans imposer le sens théologique étroit d’« âme »; « sa vie / lui-même » signale correctement l’éventail pertinent.
  issues:
  - severity: low
    issue: Nuance de לְמַעַנְךָ
    rationale: « À cause de toi » est possible dans le contexte polémique, mais « pour toi » reproduit plus directement la construction « pour ton intérêt / à ton intention » et laisse à la question rhétorique sa force propre.
  - severity: medium
    issue: Formulation de la note lexicale
    rationale: « Celui qui déchire son être » n’est ni naturel ni une bonne explicitation française de נַפְשׁוֹ dans cette expression. Une note indiquant « sa vie » ou « lui-même » conserve l’ambiguïté lexicale et le décalage de personne.
  revised_text: Toi qui te déchires dans ta colère[a], la terre sera-t-elle abandonnée pour toi, ou un rocher sera-t-il déplacé de sa place ?
