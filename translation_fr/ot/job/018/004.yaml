source:
  edition: WLC
  text: טֹֽרֵ֥ף נַפְשׁ֗/וֹ בְּ/אַ֫פּ֥/וֹ הַ֭/לְמַעַנְ/ךָ תֵּעָ֣זַב אָ֑רֶץ וְ/יֶעְתַּק צ֝֗וּר מִ/מְּקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/004.yaml
  text: You who tear yourself apart in your anger—shall the earth be abandoned for your sake[a], or a rock be moved from its place?
translation:
  language: fr
  text: Toi qui te déchires dans ta colère[a], la terre sera-t-elle abandonnée pour toi, ou un rocher sera-t-il déplacé de sa place ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit formellement : « Celui qui déchire sa vie — ou lui-même — dans sa colère ». Il commence par une expression participiale à la troisième personne, puis passe à l’adresse directe à la deuxième personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֹרֵף נַפְשׁוֹ
  choice: Toi qui te déchires
  rationale: Littéralement, l’expression évoque quelqu’un qui « déchire son être »; en français actuel, « te déchires » rend naturellement la violence autodestructrice de l’image et convient à l’adresse directe qui suit.
- source_word: בְּאַפּוֹ
  choice: dans ta colère
  rationale: אַף signifie littéralement « nez », mais désigne couramment la colère. La deuxième personne harmonise l’expression avec לְמַעַנְךָ, sans masquer le changement grammatical signalé en note.
- source_word: הַלְמַעַנְךָ
  choice: est-ce à cause de toi
  rationale: La tournure exprime ici l’idée que l’ordre du monde devrait être bouleversé en raison de Job. « À cause de toi » restitue clairement la pointe critique de la question.
- source_word: תֵּעָזַב אָרֶץ
  choice: la terre sera abandonnée
  rationale: Dans ce parallélisme à portée proverbiale et cosmique, אָרֶץ désigne vraisemblablement la terre plutôt qu’un territoire particulier; le passif préserve la forme hébraïque.
- source_word: וְיֶעְתַּק צוּר
  choice: un rocher sera déplacé
  rationale: Le verbe עתק exprime ici le déplacement ou le retrait. « Un rocher » conserve l’image concrète sans suggérer un titre divin.
- source_word: מִמְּקֹמוֹ
  choice: de son lieu
  rationale: La formule française, légèrement soutenue mais naturelle, reproduit étroitement l’hébreu et souligne la place assignée au rocher.
theological_decisions:
- issue: Changement de personne grammaticale et portée de la réprimande
  choice: Présenter toute la phrase comme une adresse directe à Job, tout en signalant en note que l’ouverture hébraïque est formellement à la troisième personne.
  alternative: « Lui qui déchire son être dans sa colère, est-ce à cause de toi… ? » ou maintenir la troisième personne dans toute la phrase.
  rationale: Le texte passe d’un participe accompagné de suffixes à la troisième personne à לְמַעַנְךָ, explicitement à la deuxième personne. L’adresse directe rend en français la force discursive de la réprimande, tandis que la note préserve l’irrégularité réelle du texte.
- issue: Portée cosmique de la question rhétorique
  choice: « la terre » et « un rocher » décrivent l’ordre stable du monde que Job ne peut exiger de voir bouleversé pour lui.
  alternative: Comprendre אָרֶץ comme « le pays » ou donner à צוּר une valeur théologique particulière.
  rationale: Le parallélisme avec le déplacement d’un rocher favorise une maxime sur la stabilité du monde. Rien dans ce verset n’impose que צוּר soit un titre divin.
translation_notes:
  register: Français international moderne, digne et direct. L’image énergique de l’hébreu est conservée sans employer le mot « âme », qui risquerait ici de donner à נֶפֶשׁ un sens trop étroitement psychologique. La syntaxe interrogative reste naturelle tout en gardant le parallélisme du verset.
