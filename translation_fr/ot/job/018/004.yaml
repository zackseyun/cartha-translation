revisions:
- from: Toi qui te déchires dans ta colère[a], est-ce à cause de toi que la terre sera abandonnée, ou qu’un rocher sera déplacé de son lieu ?
  to: Toi qui te déchires dans ta colère[a], la terre sera-t-elle abandonnée pour toi, ou un rocher sera-t-il déplacé de sa place ?
  rationale: La révision resserre la fidélité à la valeur de לְמַעַנְךָ, améliore la syntaxe interrogative française et remplace une explicitation de note maladroite par une formulation qui préserve à la fois l’ambiguïté de נֶפֶשׁ et l’alternance grammaticale du texte hébreu.
