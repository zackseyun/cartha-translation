lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Dans cette formule narrative de dialogue, ענה signifie couramment « répondre ». Le passé simple convient au registre narratif français.
- source_word: בִּלְדַּד
  choice: Bildad
  rationale: Le nom propre est translittéré selon sa forme française traditionnelle.
- source_word: הַשֻּׁחִי
  choice: le Shuhite
  rationale: Ce gentilé désigne vraisemblablement l’appartenance clanique ou l’origine géographique de Bildad ; « Shuhite » est la forme française traditionnelle.
- source_word: וַיֹּאמַר
  choice: ':'
  rationale: En français naturel, les deux verbes hébreux « répondit et dit » forment une formule d’introduction à la parole que les deux-points rendent sans lourdeur. La note conserve la formulation plus littérale.
- source_word: וַ
  choice: Alors
  rationale: Le waw initial fait progresser le récit et introduit la réponse de Bildad ; « Alors » en exprime naturellement la succession.
