  source_fidelity: 'Le sens principal est correctement rendu : les « derniers » sont frappés de stupeur à cause de « son jour », et les « premiers » éprouvent un frisson d’effroi. Toutefois, « À son jour » suggère en français un repère temporel (« le jour venu ») plutôt que l’occasion ou l’objet de la consternation introduit par עַל.'
  naturalness: « À son jour » n’est pas naturel dans ce sens en français moderne. « Sont consternés par son jour » rend clairement et sobrement la relation. « Ceux qui les ont précédés » est grammaticalement possible, mais « ceux qui les ont précédés » garde un antécédent pluriel peu net ; la formulation retenue conserve une succession temporelle lisible.
  terminology: « Consternés » rend bien נָשַׁמּוּ, et « saisis d’horreur » transmet naturellement l’idiome אָחֲזוּ שָׂעַר. Les notes maintiennent à la fois l’expression littérale « son jour » et l’alternative géographique pour les deux groupes.
