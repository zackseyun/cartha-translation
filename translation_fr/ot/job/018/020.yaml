  text: עַל י֭וֹמ/וֹ נָשַׁ֣מּוּ אַחֲרֹנִ֑ים וְ֝/קַדְמֹנִ֗ים אָ֣חֲזוּ שָֽׂעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/020.yaml
  text: Those who come after are appalled at his day[c][b][a], and those who went before are seized with horror.
translation:
  language: fr
  text: Ceux qui viennent après sont consternés par son jour[a], et ceux qui les ont précédés sont saisis d’horreur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « son jour », sans doute le jour de son malheur ou de son jugement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « ils saisissent un frisson » : un idiome exprimant l’effroi qui les saisit. Les deux groupes peuvent aussi se comprendre comme « ceux de l’ouest » et « ceux de l’est », plutôt que comme des générations postérieures et antérieures.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל יוֹמוֹ
  choice: À son jour
  rationale: La formulation conserve l’expression concrète de l’hébreu, où עַל introduit ici l’occasion qui provoque la consternation. « Son jour » désigne vraisemblablement le jour de son malheur ou de son jugement, sans l’expliciter dans le texte.
- source_word: נָשַׁמּוּ
  choice: sont consternés
  rationale: Le verbe exprime une stupeur profonde, mêlée d’effroi; « sont consternés » est naturel en français et garde cette intensité.
- source_word: אַחֲרֹנִים
  choice: ceux qui viennent après
  rationale: Le sens temporel « les derniers / ceux d’après » forme le contraste le plus direct avec קַדְמֹנִים, tout en laissant en note la possibilité d’une lecture géographique.
- source_word: וְקַדְמֹנִים
  choice: ceux qui les ont précédés
  rationale: Le terme peut signifier les anciens ou ceux d’avant; cette formulation française exprime clairement le contraste temporel avec ceux qui viennent après.
- source_word: אָחֲזוּ שָׂעַר
  choice: sont saisis d’horreur
  rationale: L’expression hébraïque associe le verbe « saisir » à un nom évoquant le frisson d’effroi. La traduction reproduit naturellement l’idée d’une horreur qui s’empare d’eux.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du parallélisme hébreu, tandis que « consternés » et « saisis d’horreur » rendent les réactions de façon idiomatique. Les ambiguïtés de « son jour » et de la paire temporelle ou géographique sont conservées par les notes.
