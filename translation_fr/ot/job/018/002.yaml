  text: עַד אָ֤נָה תְּשִׂימ֣וּ/ן קִנְצֵ֣י לְ/מִלִּ֑ין תָּ֝בִ֗ינוּ וְ/אַחַ֥ר נְדַבֵּֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/002.yaml
  text: How long will you keep setting traps with words? Understand[b][a], and afterward we will speak.
translation:
  language: fr
  text: Jusqu’à quand tendrez-vous des pièges aux paroles[a] ? Comprenez, puis nous parlerons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jusqu’à quand mettrez-vous des limites aux paroles ? » L’expression hébraïque est difficile ; certains y voient une plainte contre des discours interminables plutôt qu’une accusation de tendre des pièges aux paroles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « puis parlons ». Le dernier verbe peut s’entendre comme une invitation aussi bien que comme un simple futur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Jusqu’à quand
  rationale: Cette tournure interrogative naturelle conserve la plainte temporelle insistante de Bildad.
- source_word: תְּשִׂימוּן
  choice: tendrez-vous
  rationale: Le verbe signifie littéralement « mettre, placer » ; avec l’interprétation métaphorique de קִנְצֵי, « tendre » est le verbe français idiomatique employé pour des pièges.
- source_word: קִנְצֵי לְמִלִּין
  choice: des pièges avec des paroles
  rationale: La construction hébraïque est difficile. Cette traduction exprime l’interprétation métaphorique d’une parole qui cherche à piéger, tout en signalant en note l’autre analyse possible, celle de « limites » ou d’une « fin » imposée aux paroles.
- source_word: תָּבִינוּ
  choice: Comprenez
  rationale: L’impératif pluriel garde l’appel direct à faire preuve d’intelligence ou de discernement, sans préciser davantage l’objet sous-entendu.
- source_word: וְאַחַר
  choice: puis
  rationale: '« Puis » marque naturellement en français la séquence : comprendre d’abord, parler ensuite.'
- source_word: נְדַבֵּר
  choice: nous parlerons
  rationale: Le yiqtol à la première personne du pluriel se lit directement comme un futur, tout en pouvant avoir dans ce contexte une nuance d’invitation, indiquée en note.
