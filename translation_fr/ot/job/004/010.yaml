  text: שַׁאֲגַ֣ת אַ֭רְיֵה וְ/ק֣וֹל שָׁ֑חַל וְ/שִׁנֵּ֖י כְפִירִ֣ים נִתָּֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/010.yaml
  text: The lion’s roar[a], and the voice of the fierce lion, and the teeth of the young lions are broken.
translation:
  language: fr
  text: Le rugissement du lion, la voix du lion féroce et les dents des jeunes lions sont brisés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, à propos des dents : « sont arrachées ». Le verbe hébreu évoque une brisure ou un arrachement violent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲגַת
  choice: rugissement
  rationale: Nom construit désignant le cri puissant du lion ; « rugissement » est le terme français naturel et précis.
- source_word: אַרְיֵה
  choice: lion
  rationale: Terme hébreu courant pour le lion, rendu directement.
- source_word: קוֹל
  choice: voix
  rationale: Le mot peut désigner une voix ou un son. « Voix » maintient le parallélisme poétique avec « rugissement » sans confondre les deux expressions.
- source_word: שָׁחַל
  choice: lion féroce
  rationale: Terme poétique désignant un lion et évoquant sa force redoutable ; cette formulation le distingue de אַרְיֵה sans retenir la traduction incertaine « lion noir ».
- source_word: שִׁנֵּי
  choice: les dents
  rationale: Pluriel construit de « dent », rendu simplement avec son complément.
- source_word: כְפִירִים
  choice: jeunes lions
  rationale: Le terme désigne des lions jeunes mais déjà vigoureux, plutôt que des lionceaux sans défense.
- source_word: נִתָּעוּ
  choice: sont brisés
  rationale: La forme verbale exprime une destruction ou un arrachement violent. « Sont brisés » permet au prédicat de porter naturellement sur les trois éléments coordonnés tout en conservant l’image de la puissance détruite.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. La coordination serrée de l’hébreu est conservée, ainsi que la variété de ses termes pour le lion. Le masculin pluriel « brisés » se rapporte à l’ensemble des éléments coordonnés.
