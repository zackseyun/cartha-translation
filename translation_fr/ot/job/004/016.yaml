source:
  edition: WLC
  text: יַעֲמֹ֤ד וְֽ/לֹא אַכִּ֬יר מַרְאֵ֗/הוּ תְּ֭מוּנָה לְ/נֶ֣גֶד עֵינָ֑/י דְּמָמָ֖ה וָ/ק֣וֹל אֶשְׁמָֽע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/016.yaml
  text: 'It stood still[a], but I could not recognize its appearance; a form was before my eyes; there was silence[b], and I heard a voice:'
translation:
  language: fr
  text: 'Cela s’immobilisa, mais je ne pus en discerner l’apparence[a] ; une forme était devant mes yeux. Il y eut un silence[b], et j’entendis une voix :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « son apparence ». Le suffixe hébreu est masculin singulier, mais son référent demeure une apparition non identifiée ; la formulation française évite de lui attribuer un genre.
    reason: lexical_alternative
  - marker: b
    text: Ou « un calme ». Le terme hébreu peut désigner le silence, le calme ou une immobilité silencieuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: Elle se tenait immobile
  rationale: Le verbe עמד signifie « se tenir debout » ou « rester en place ». Dans cette vision, « se tenait immobile » exprime naturellement la présence fixe de la forme devant le locuteur.
- source_word: וְלֹא אַכִּיר
  choice: mais je ne pouvais reconnaître
  rationale: Le hifil de נכר signifie couramment « reconnaître » ou « identifier ». « Mais » rend le contraste avec la présence visible de la forme, tandis que l’imparfait français convient au récit et à l’incapacité décrite.
- source_word: מַרְאֵהוּ
  choice: son apparence
  rationale: מַרְאֶה désigne l’apparence ou l’aspect visible. Le possessif français « son » ne marque pas ici le genre du référent et préserve donc naturellement l’indétermination de l’apparition.
- source_word: תְּמוּנָה
  choice: une forme
  rationale: תְּמוּנָה peut désigner une forme, une représentation ou une ressemblance. « Une forme » convient au caractère indistinct de la perception.
- source_word: לְנֶגֶד עֵינָי
  choice: était devant mes yeux
  rationale: La formulation conserve l’image concrète de l’hébreu, littéralement « devant mes yeux », tout en restant idiomatique en français.
- source_word: דְּמָמָה
  choice: Il y eut un silence
  rationale: דְּמָמָה peut évoquer le silence, le calme ou l’immobilité silencieuse. La proposition complète restitue la pause saisissante qui précède la voix.
- source_word: וָקוֹל אֶשְׁמָע
  choice: puis j’entendis une voix
  rationale: קוֹל peut signifier « voix » ou « son » ; le discours qui suit favorise « voix ». « Puis » rend clairement la progression narrative sans modifier le contenu essentiel.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, naturel et digne. Le rythme en trois phrases préserve la progression de la scène : immobilité de l’apparition, perception visuelle indistincte, silence suivi de la voix.'
