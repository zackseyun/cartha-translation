  text: הֲ/לֹ֣א יִ֭רְאָתְ/ךָ כִּסְלָתֶ֑/ךָ תִּ֝קְוָתְ/ךָ֗ וְ/תֹ֣ם דְּרָכֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/006.yaml
  text: Is not your fear of God your confidence[c][b][a], and the integrity of your ways your hope?
translation:
  language: fr
  text: 'Ta crainte de Dieu[a] n’est-elle pas ton assurance[b],

    et l’intégrité de ta conduite[c], ton espérance ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ta crainte » ; l’hébreu n’en précise pas l’objet. Dans ce contexte, il s’agit vraisemblablement de Dieu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ta confiance ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « l’irréprochabilité de tes voies ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: n’est-elle pas
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative, tout en restant naturel en français moderne.
- source_word: יִרְאָתְךָ
  choice: ta crainte de Dieu
  rationale: Le texte hébreu dit littéralement « ta crainte » sans en préciser l’objet; dans le contexte sapientiel, Dieu est très probablement l’objet sous-entendu. L’explicitation évite de faire entendre une peur purement psychologique.
- source_word: כִּסְלָתֶךָ
  choice: ton assurance
  rationale: Dans ce contexte, le nom désigne l’assurance ou la confiance plutôt que la sottise. « Assurance » s’accorde bien avec le parallèle formé par « espérance ».
- source_word: תִּקְוָתְךָ
  choice: ton espérance
  rationale: Rend naturellement l’attente confiante exprimée par le terme hébreu et convient au registre poétique et sapientiel.
- source_word: וְתֹם
  choice: et l’intégrité
  rationale: Le nom évoque la plénitude morale, la droiture ou l’irréprochabilité. « Intégrité » conserve le sens éthique sans suggérer nécessairement une perfection absolue.
- source_word: דְּרָכֶיךָ
  choice: de ta conduite
  rationale: Littéralement « de tes voies ». « Conduite » transmet clairement en français actuel la valeur morale de la métaphore dans ce contexte.
theological_decisions:
- issue: Objet implicite de la crainte
  choice: « crainte de Dieu » dans le texte principal
  alternative: « ta crainte » ou « ton respect »
  rationale: L’objet n’est pas exprimé en hébreu, mais le contexte de la littérature de sagesse indique probablement la crainte de Dieu. Une note conserve cette ambiguïté formelle.
- issue: Rapport syntaxique entre les quatre groupes nominaux
  choice: 'Deux propositions nominales parallèles : la crainte est l’assurance, et l’intégrité de la conduite est l’espérance'
  alternative: Une seule proposition où « ton espérance » serait un élément supplémentaire coordonné
  rationale: La disposition équilibrée des quatre groupes nominaux favorise deux membres poétiques parallèles et préserve la tension rhétorique du reproche d’Éliphaz.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est maintenu sur deux lignes. « Conduite » privilégie la clarté actuelle, tandis que la note signale la métaphore hébraïque des « voies » et l’objet implicite de la crainte.
