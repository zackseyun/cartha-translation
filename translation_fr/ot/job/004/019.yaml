source:
  edition: WLC
  text: אַ֤ף שֹׁכְנֵ֬י בָֽתֵּי חֹ֗מֶר אֲשֶׁר בֶּ/עָפָ֥ר יְסוֹדָ֑/ם יְ֝דַכְּא֗וּ/ם לִ/פְנֵי עָֽשׁ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/019.yaml
  text: how much more those who dwell in houses of clay[a], whose foundation is in the dust[b], who are crushed before the moth!
translation:
  language: fr
  text: 'À plus forte raison ceux qui habitent des maisons d’argile[a], dont le fondement est dans la poussière : on les écrase devant une mite[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « même ceux qui habitent des maisons d’argile ». La particule hébraïque peut signifier « même » ou « certes » ; dans ce contexte, elle marque probablement une progression : « à plus forte raison ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « on les écrase plus vite qu’une mite » ou « plus facilement qu’une mite ». L’expression hébraïque, littéralement « devant une mite », peut indiquer la rapidité ou la facilité avec laquelle les humains périssent.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: À plus forte raison
  rationale: 'Dans la suite du v. 18, la particule renforce l’argument : si Dieu ne se fie pas pleinement à ses serviteurs célestes, combien moins aux humains fragiles. Cette tournure rend naturellement la valeur inférentielle en français.'
- source_word: שֹׁכְנֵי
  choice: ceux qui habitent
  rationale: Le participe exprime une habitation continue ; cette formulation est courante et fidèle.
- source_word: בָתֵּי חֹמֶר
  choice: des maisons d’argile
  rationale: L’expression désigne littéralement des demeures faites d’argile et évoque métaphoriquement la fragilité du corps et de l’existence humaine.
- source_word: אֲשֶׁר בֶּעָפָר יְסוֹדָם
  choice: dont les fondations sont dans la poussière
  rationale: Le suffixe de יְסוֹדָם est pluriel (« leur fondation »). Le pluriel français « les fondations » relie naturellement l’image aux maisons sans lever la portée métaphorique ; « poussière » conserve l’écho de la mortalité humaine.
- source_word: יְדַכְּאוּם
  choice: que l’on écrase
  rationale: Le verbe signifie « écraser » et porte un suffixe objet pluriel. Le sujet n’étant pas exprimé dans le texte consonantique, le pronom indéfini français évite de lui attribuer une identité précise.
- source_word: לִפְנֵי עָשׁ
  choice: devant une mite
  rationale: Cette traduction garde le sens spatial littéral de לִפְנֵי ainsi que l’image surprenante et ambiguë de l’hébreu. La note signale les lectures comparatives plausibles.
theological_decisions:
- issue: Référence métaphorique des « maisons d’argile »
  choice: Conserver l’image comme évocation de la fragilité mortelle des humains, sans l’expliciter dans le corps du verset.
  alternative: Comprendre d’abord de véritables maisons en terre crue comme image plus générale de la vulnérabilité humaine.
  rationale: Le contexte oppose les êtres célestes aux humains et souligne la mortalité de ces derniers ; la formulation préserve toutefois l’image concrète.
- issue: Agent de l’écrasement
  choice: Employer « l’on », sans identifier l’agent.
  alternative: 'Traduire passivement : « qui sont écrasés ».'
  rationale: Le texte porte un verbe actif avec objet pluriel, mais son sujet n’est pas exprimé. Il convient de ne pas importer une identification théologique absente du verset.
translation_notes:
  register: Français international moderne, poétique et digne. « À plus forte raison » explicite la logique du contexte ; « maisons d’argile » et « poussière » maintiennent les images traditionnelles. « Mite » est retenu plutôt que « teigne », terme plus transparent pour un lecteur actuel.
