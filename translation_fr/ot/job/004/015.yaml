  text: וְ֭/רוּחַ עַל פָּנַ֣/י יַחֲלֹ֑ף תְּ֝סַמֵּ֗ר שַֽׂעֲרַ֥ת בְּשָׂרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/015.yaml
  text: Then a spirit passed before my face[a]; the hair of my flesh bristled.
translation:
  language: fr
  text: Alors un esprit passa devant mon visage[a] ; les poils de mon corps se hérissèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un vent » ou « un souffle passa devant mon visage ». Le mot hébreu רוּחַ peut signifier « esprit », « vent » ou « souffle » ; ici, le contexte favorise « esprit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: un esprit
  rationale: רוּחַ peut désigner un esprit, le vent ou un souffle. Dans ce contexte de vision nocturne et de présence inquiétante, « un esprit » convient le mieux, tout en conservant l’indétermination de l’hébreu.
- source_word: עַל פָּנַי
  choice: devant mon visage
  rationale: Littéralement « sur mon visage » ; avec יַחֲלֹף, l’expression décrit un mouvement qui passe devant le locuteur. « Devant mon visage » préserve l’image concrète.
- source_word: יַחֲלֹף
  choice: passa
  rationale: Le verbe חלף signifie couramment passer ou passer devant. Le passé simple convient au registre narratif digne et rend l’action ponctuelle.
- source_word: תְּסַמֵּר
  choice: se hérissèrent
  rationale: Le verbe exprime le fait de devenir raide ou dressé. En français, « les poils se hérissèrent » est une formulation naturelle et vive.
- source_word: שַׂעֲרַת בְּשָׂרִי
  choice: les poils de mon corps
  rationale: La formulation hébraïque signifie littéralement « le poil de ma chair ». « Les poils de mon corps » transmet naturellement l’image sans la tournure peu idiomatique « le poil de ma chair ».
theological_decisions:
- issue: Sens de רוּחַ
  choice: un esprit
  alternative: un vent ; un souffle
  rationale: Le contexte favorise une présence spirituelle, mais la polysémie du terme hébreu est réelle et doit être signalée sans être supprimée.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset conserve l’image concrète du passage devant le visage et rend idiomatiquement la réaction physique de frayeur.
