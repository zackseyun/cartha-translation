id: JOB.4.18
reference: Job 4:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵ֣ן בַּ֭/עֲבָדָי/ו לֹ֣א יַאֲמִ֑ין וּ֝/בְ/מַלְאָכָ֗י/ו יָשִׂ֥ים תָּהֳלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/018.yaml
  text: Look[a], he puts no trust in his servants[b], and he charges his messengers with error.
translation:
  language: fr
  text: 'Voici : il ne fait pas confiance à ses serviteurs et il impute l’erreur[b] à ses messagers[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « anges ». Le mot hébreu peut désigner des messagers humains ou célestes ; ici, le contexte évoque probablement des êtres célestes.
    reason: alternative_reading
  - marker: b
    text: Ou « folie », « faute » ou « imperfection ». Le terme hébreu est rare et son sens précis est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: Cette particule attire l’attention et souligne l’affirmation. « Voici » en conserve la force dans un registre français actuel et digne.
- source_word: בַּעֲבָדָיו
  choice: à ses serviteurs
  rationale: Avec le verbe אמן au hiphil, la préposition ב introduit ici l’objet de la confiance. « Serviteurs » exprime leur position subordonnée sans insister indûment sur un statut social d’esclaves.
- source_word: לֹא יַאֲמִין
  choice: il ne fait pas confiance
  rationale: Le hiphil de אמן exprime ici la confiance accordée plutôt qu’une simple adhésion intellectuelle.
- source_word: וּבְמַלְאָכָיו
  choice: à ses messagers
  rationale: מַלְאָךְ peut désigner un messager humain ou céleste. Le contexte évoque probablement des êtres célestes, mais « messagers » préserve l’étendue lexicale du terme hébreu.
- source_word: יָשִׂים
  choice: il impute
  rationale: Avec un nom abstrait, שׂים signifie ici attribuer ou porter quelque chose au compte de quelqu’un. « Impute » rend cette idée sans la réduire au simple fait de constater.
- source_word: תָּהֳלָה
  choice: l’erreur
  rationale: Ce nom rare peut évoquer l’erreur, la folie, la faute ou l’imperfection. « L’erreur » constitue une formulation concise, tandis que la note conserve l’incertitude lexicale.
theological_decisions:
- issue: Faut-il rendre מַלְאָכָיו spécifiquement par « anges » ou plus largement par « messagers » ?
  choice: messagers
  alternative: anges
  rationale: Le mot hébreu signifie fondamentalement « messagers », même s’il désigne probablement ici des êtres célestes. Le texte principal préserve l’ambiguïté lexicale, et la note signale l’interprétation contextuelle vraisemblable.
- issue: Quel défaut Dieu attribue-t-il à ses messagers selon le terme rare תָּהֳלָה ?
  choice: erreur
  alternative: folie, faute ou imperfection
  rationale: Le sens précis du nom est incertain. « Erreur » reste suffisamment large, et la note évite de transformer une difficulté lexicale en affirmation théologique plus précise que l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la structure poétique hébraïque tout en étant naturelle ; les notes préservent les deux principales ambiguïtés du verset.
