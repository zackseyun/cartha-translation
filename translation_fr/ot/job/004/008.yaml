id: JOB.4.8
reference: Job 4:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר רָ֭אִיתִי חֹ֣רְשֵׁי אָ֑וֶן וְ/זֹרְעֵ֖י עָמָ֣ל יִקְצְרֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/008.yaml
  text: As I have seen[b][a], those who plow iniquity and sow trouble reap it.
translation:
  language: fr
  text: D’après ce que j’ai vu, ceux qui labourent le mal[a] et sèment le malheur[b] le moissonnent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’injustice ». Le mot hébreu peut désigner le mal moral et, dans certains contextes, le malheur qui en résulte.
    reason: lexical_alternative
  - marker: b
    text: Ou « la souffrance », « la peine » ou « le tort ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: D’après ce que
  rationale: Dans la tournure « D’après ce que j’ai vu », introduit naturellement en français l’observation tirée de l’expérience d’Éliphaz, sans transformer la comparaison en affirmation absolue.
- source_word: רָאִיתִי
  choice: j’ai vu
  rationale: Le passé composé exprime ici une observation acquise par l’expérience et toujours pertinente dans le discours.
- source_word: חֹרְשֵׁי
  choice: ceux qui labourent
  rationale: Le participe substantivé désigne les personnes qui agissent et conserve l’image agricole.
- source_word: אָוֶן
  choice: le mal
  rationale: Le terme peut désigner le mal moral, l’injustice ou le malheur qui en résulte. « Le mal » garde sa portée morale tout en restant courant et suffisamment large.
- source_word: וְזֹרְעֵי
  choice: et sèment
  rationale: La coordination poursuit l’image agricole; il est naturel en français de ne pas répéter « ceux qui ».
- source_word: עָמָל
  choice: le malheur
  rationale: Le mot évoque la peine, la souffrance ou le tort causé. « Malheur » convient au parallélisme et peut désigner à la fois le mal infligé et ses conséquences pénibles.
- source_word: יִקְצְרֻהוּ
  choice: le moissonnent
  rationale: Le verbe et son suffixe masculin singulier sont rendus explicitement. « Moissonner » maintient la progression labourer–semer–moissonner, tandis que « le » reprend directement « le malheur » sans exclure le résultat global des deux actions.
theological_decisions:
- issue: La causalité morale dans le discours d’Éliphaz
  choice: Présenter sans atténuation le principe qu’Éliphaz affirme avoir observé.
  alternative: En faire soit une doctrine absolue de rétribution, soit une simple tendance assortie d’une réserve explicite.
  rationale: Le verset appartient à l’argument d’Éliphaz. La traduction doit conserver la force proverbiale de ses paroles sans les ériger elle-même en verdict théologique final du livre ni ajouter une nuance absente de l’hébreu.
translation_notes:
  register: 'Français international actuel, clair et digne. La métaphore agricole est conservée dans ses trois étapes : labourer, semer et moissonner. Le vocabulaire évite l’archaïsme « iniquité » tout en gardant la portée morale et l’ambiguïté lexicale du texte hébreu.'
