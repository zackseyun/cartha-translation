  text: כִּ֤י עַתָּ֨ה תָּב֣וֹא אֵלֶ֣י/ךָ וַ/תֵּ֑לֶא תִּגַּ֥ע עָ֝דֶ֗י/ךָ וַ/תִּבָּהֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/005.yaml
  text: But now it comes to you[a], and you are weary; it touches you[b], and you are dismayed.
translation:
  language: fr
  text: Mais maintenant, cela vient jusqu’à toi[a], et tu faiblis ; cela t’atteint[b], et tu es bouleversé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Car maintenant, cela vient jusqu’à toi. » La conjonction hébraïque peut exprimer ici soit la cause, soit le contraste avec les versets précédents.'
    reason: lexical_alternative
  - marker: b
    text: En hébreu, les verbes traduits par « vient » et « atteint » sont au féminin singulier, mais leur sujet n’est pas exprimé. Il peut désigner implicitement le malheur, l’épreuve ou une autre réalité éprouvante.
    reason: source_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: Mais
  rationale: Dans le contexte, la conjonction introduit le contraste entre l’aide autrefois apportée par Job aux éprouvés et sa réaction quand l’épreuve le touche lui-même. « Mais » rend naturellement cette valeur adversative, tout en signalant en note l’autre analyse possible.
- source_word: עַתָּה
  choice: maintenant
  rationale: L’adverbe marque la situation présente, opposée à la conduite passée de Job.
- source_word: תָּבוֹא
  choice: le malheur vient
  rationale: Le verbe est au féminin singulier, sans sujet exprimé. Le français exige ici un référent plus explicite ; « le malheur » rend naturellement l’idée implicite d’une épreuve ou d’une calamité sans préciser indûment sa nature.
- source_word: אֵלֶיךָ
  choice: jusqu’à toi
  rationale: Cette formulation exprime que le malheur parvient désormais personnellement à Job et prépare le parallélisme avec עָדֶיךָ.
- source_word: וַתֵּלֶא
  choice: et tu faiblis
  rationale: Le verbe לאה évoque la fatigue, l’épuisement ou la perte d’endurance. « Tu faiblis » convient au reproche adressé à Job et reste moins pesant que « tu es épuisé ».
- source_word: תִּגַּע
  choice: il atteint
  rationale: Le verbe נגע peut signifier toucher, atteindre ou frapper. « Atteint » est idiomatique en français pour un malheur qui touche personnellement quelqu’un, sans renforcer le sens jusqu’à « frapper ».
- source_word: עָדֶיךָ
  choice: t’
  rationale: Le pronom objet dans « il t’atteint » rend naturellement la locution prépositionnelle signifiant « jusqu’à toi » ou « à toi ».
- source_word: וַתִּבָּהֵל
  choice: et tu es bouleversé
  rationale: בהל exprime l’alarme, l’agitation ou l’effroi. « Bouleversé » restitue la forte perturbation émotionnelle sans imposer la terreur comme seule nuance.
theological_decisions:
- issue: Sujet féminin implicite des verbes תָּבוֹא et תִּגַּע
  choice: Expliciter par « le malheur » dans le texte et signaler l’implicite en note
  alternative: Employer un « cela » impersonnel, ou expliciter « l’épreuve »
  rationale: L’hébreu ne nomme pas le sujet, mais sa forme féminine suggère une réalité comme la calamité ou l’épreuve. « Le malheur » fournit un français clair sans transformer cette suggestion en identification doctrinale certaine ; la note préserve l’ambiguïté du texte source.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme est conservé en deux propositions coordonnées. « Faiblis » et « bouleversé » restent accessibles tout en maintenant la vigueur du reproche d’Éliphaz.
