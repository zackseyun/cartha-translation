  text: בִּ֭/שְׂעִפִּים מֵ/חֶזְיֹנ֣וֹת לָ֑יְלָה בִּ/נְפֹ֥ל תַּ֝רְדֵּמָ֗ה עַל אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/013.yaml
  text: Amid disquieting thoughts from visions of the night[a], when deep sleep falls on men[b],
translation:
  language: fr
  text: Au milieu des pensées troublantes suscitées par des visions nocturnes, quand un profond sommeil tombe sur les humains[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur les hommes » ; le terme hébreu désigne ici les êtres humains en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשְׂעִפִּים
  choice: Au milieu des pensées troublantes
  rationale: Le nom שְׂעִפִּים évoque ici des pensées agitées, divisées ou inquiétantes. « Pensées troublantes » exprime naturellement le trouble intérieur dans ce contexte nocturne.
- source_word: מֵחֶזְיֹנוֹת לָיְלָה
  choice: suscitées par des visions nocturnes
  rationale: חֶזְיֹנוֹת désigne des visions et לָיְלָה les situe dans la nuit. La préposition מִן peut indiquer leur source ou leur cause; « suscitées par » rend clairement le rapport avec les pensées sans exclure cette nuance causale.
- source_word: בִּנְפֹל
  choice: quand ... tombe
  rationale: L’infinitif construit précédé de בְּ introduit une circonstance temporelle, rendue naturellement par « quand ».
- source_word: תַּרְדֵּמָה
  choice: un profond sommeil
  rationale: תַּרְדֵּמָה désigne un sommeil lourd ou profond, et non un simple assoupissement.
- source_word: עַל אֲנָשִׁים
  choice: sur les humains
  rationale: אֲנָשִׁים est morphologiquement masculin, mais possède ici une portée générique. En français moderne, « les humains » conserve sans ambiguïté cette référence à l’ensemble des êtres humains.
theological_decisions:
- issue: Portée générique de אֲנָשִׁים
  choice: les humains
  alternative: les hommes
  rationale: Le contexte ne vise pas exclusivement les personnes de sexe masculin. « Les humains » restitue la valeur générique du pluriel hébreu, tandis que « les hommes » reste une traduction formellement possible mais aujourd’hui plus ambiguë en français.
translation_notes:
  register: Français moderne, digne et poétique. La tournure « tombe sur » conserve l’image hébraïque, tandis que « un profond sommeil » reste immédiatement compréhensible. Le verset demeure syntaxiquement ouvert sur la suite, comme dans le texte source.
