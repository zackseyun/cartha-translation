  text: לַ֭יִשׁ אֹבֵ֣ד מִ/בְּלִי טָ֑רֶף וּ/בְנֵ֥י לָ֝בִ֗יא יִתְפָּרָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/011.yaml
  text: The lion perishes for lack of prey[a], and the cubs of the lion are scattered.
translation:
  language: fr
  text: Le lion périt faute de proie, et les petits du lion[a] se dispersent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la lionne ». Les deux termes hébreux employés dans ce verset pour désigner le lion ont des nuances difficiles à reproduire, et לָבִיא peut désigner un lion ou une lionne.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִשׁ
  choice: le lion
  rationale: Le nom désigne un lion, avec une possible nuance de force ou de maturité qu’il n’est pas nécessaire d’expliciter dans le texte.
- source_word: אֹבֵד
  choice: périt
  rationale: Le participe exprime la perdition ou la ruine; « périt » conserve la vigueur et la tonalité proverbiale du vers.
- source_word: מִבְּלִי
  choice: faute de
  rationale: Cette expression marque la privation; « faute de » rend naturellement en français le lien entre l’absence de proie et la mort.
- source_word: טָרֶף
  choice: proie
  rationale: Le terme évoque précisément la proie d’un prédateur, plutôt qu’une nourriture générique.
- source_word: בְנֵי
  choice: les petits du
  rationale: Littéralement « les fils de », mais, pour des animaux, « les petits » est la formulation française naturelle tout en conservant le rapport de descendance.
- source_word: לָבִיא
  choice: grand fauve
  rationale: Le terme est un autre nom du lion et peut, selon les contextes, désigner un lion ou une lionne. « Grand fauve » maintient la variation lexicale du parallélisme sans imposer le sexe de l’animal.
- source_word: יִתְפָּרָדוּ
  choice: se dispersent
  rationale: La forme exprime le fait de se séparer ou de partir dans différentes directions; « se dispersent » respecte sa valeur réfléchie et l’image de la désagrégation du groupe.
