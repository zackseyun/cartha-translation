  text: הִ֭נֵּה יִסַּ֣רְתָּ רַבִּ֑ים וְ/יָדַ֖יִם רָפ֣וֹת תְּחַזֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/003.yaml
  text: Behold[a], you have instructed many, and you have strengthened weak hands.
translation:
  language: fr
  text: 'Voici : tu as instruit[a] beaucoup de gens, tu as fortifié des mains faibles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « corrigé », « repris » ou « discipliné » ; le verbe hébreu peut désigner une instruction qui passe par la correction.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marqueur discursif qui attire l’attention sur ce qui suit. « Voici » conserve la force emphatique et le registre poétique sans paraître aussi artificiel que « Vois » dans ce contexte.
- source_word: יִסַּרְתָּ
  choice: tu as instruit
  rationale: Le verbe יסר peut désigner l’instruction donnée au moyen de la correction, la réprimande ou la discipline. Ici, Éliphaz évoque positivement l’aide que Job apportait autrefois aux autres ; « instruit » convient au contexte tout en laissant les autres nuances en note.
- source_word: רַבִּים
  choice: beaucoup de gens
  rationale: Le terme signifie « beaucoup » ou « un grand nombre ». L’ajout idiomatique de « gens » rend en français naturel l’emploi substantivé de l’hébreu.
- source_word: יָדַיִם רָפוֹת
  choice: les mains défaillantes
  rationale: L’expression conserve l’image corporelle de mains relâchées ou sans vigueur, qui évoque aussi le découragement. « Défaillantes » est naturel, digne et plus expressif ici que le très général « faibles ».
- source_word: תְּחַזֵּק
  choice: tu as fortifié
  rationale: Le piel de חזק signifie rendre fort ou affermir. L’imparfait hébreu, coordonné à un parfait dans ce tableau rétrospectif, peut décrire l’action habituelle passée de Job ; le passé composé français s’accorde naturellement avec la première proposition.
