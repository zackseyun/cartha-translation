  text: פַּ֣חַד קְ֭רָאַ/נִי וּ/רְעָדָ֑ה וְ/רֹ֖ב עַצְמוֹתַ֣/י הִפְחִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/014.yaml
  text: Fear came upon me[a], and trembling, and it made all my bones shake.
translation:
  language: fr
  text: 'La peur m’a saisi,

    et le tremblement aussi ;

    cela a fait frissonner la multitude de mes os.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « il a effrayé la multitude de mes os ». On peut aussi traduire : « cela a fait trembler mes os ». L’expression « la multitude de mes os » est une image poétique d’une réaction physique intense.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחַד
  choice: la peur
  rationale: Le nom désigne la peur ou l’effroi. « La peur » reste naturel et n’accentue pas indûment l’intensité.
- source_word: קְרָאַנִי
  choice: m’a saisi
  rationale: Le verbe a ici le sens de rencontrer ou survenir. Dans ce contexte, « m’a saisi » exprime naturellement l’irruption soudaine de la peur.
- source_word: וּרְעָדָה
  choice: avec un tremblement
  rationale: Le nom indique la réaction physique qui accompagne la peur; cette formulation conserve son caractère substantival tout en restant idiomatique en français.
- source_word: וְרֹב עַצְמוֹתַי
  choice: tous mes os
  rationale: Littéralement, le groupe évoque « la multitude de mes os ». En français poétique courant, « tous mes os » rend naturellement l’idée d’une réaction corporelle généralisée; la note conserve l’image formelle et son ambiguïté.
- source_word: הִפְחִיד
  choice: elle a fait frissonner
  rationale: La forme causative signifie provoquer la peur. Avec « mes os » comme objet, « faire frissonner » exprime de façon naturelle l’effet physique sans perdre la valeur causative.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme entre la peur et le tremblement est conservé, tandis que l’expression hébraïque inhabituelle concernant les os est rendue naturellement dans le texte et explicitée en note.
