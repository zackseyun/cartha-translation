  text: הֲ/לֹא נִסַּ֣ע יִתְרָ֣/ם בָּ֑/ם יָ֝מ֗וּתוּ וְ/לֹ֣א בְ/חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/021.yaml
  text: Is not their tent-cord pulled up within them? They die[b][a], and not in wisdom.
translation:
  language: fr
  text: La corde de leur tente n’est-elle pas enlevée en eux[a] ? Ils meurent sans sagesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « leur corde leur est-elle enlevée ? » ; traduction traditionnelle : « leur supériorité n’est-elle pas ôtée en eux ? » L’hébreu évoque probablement une tente dont on enlève la corde, image de la vie qui prend fin.'
    reason: lexical_alternative
  - marker: b
    text: Ou « avant d’avoir acquis la sagesse » ; littéralement, « et non dans la sagesse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: n’est-elle pas
  rationale: Rend la question rhétorique qui appelle l’assentiment, sans la transformer en affirmation explicite.
- source_word: נִסַּע
  choice: arrachée
  rationale: Le passif de נסע exprime ici l’enlèvement ou l’arrachement. « Arrachée » convient à l’image de la tente, tout en laissant la note signaler une nuance moins violente possible.
- source_word: יִתְרָם
  choice: la corde de leur tente
  rationale: יתר peut désigner une corde, notamment une corde de tente. Ce sens concret prolonge l’image de l’habitation humaine fragile au verset précédent, tout en reconnaissant en note l’analyse traditionnelle « leur supériorité ».
- source_word: בָּם
  choice: en eux
  rationale: Conserve la préposition hébraïque et son image énigmatique d’une corde vitale arrachée à l’intérieur des humains, plutôt que de la remplacer silencieusement par « loin d’eux ».
- source_word: יָמוּתוּ
  choice: Ils meurent
  rationale: Traduction directe du verbe courant מות, sans ajouter la nuance plus forte de « périr ».
- source_word: וְלֹא בְחָכְמָה
  choice: et non dans la sagesse
  rationale: 'Préserve la formulation brève et l’ambiguïté de l’hébreu : mourir sans sagesse, sans l’avoir acquise, ou d’une manière qui n’est pas sage.'
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe légèrement inhabituelle « en eux » est maintenue afin de préserver l’image condensée et l’ambiguïté du texte hébreu ; les notes donnent les principales autres lectures sans imposer une interprétation théologique.
