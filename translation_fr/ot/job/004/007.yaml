  text: זְכָר נָ֗א מִ֤י ה֣וּא נָקִ֣י אָבָ֑ד וְ֝/אֵיפֹ֗ה יְשָׁרִ֥ים נִכְחָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/007.yaml
  text: 'Please remember: who that was innocent ever perished? Or where were the upright cut off?[a][b]'
translation:
  language: fr
  text: 'Je t''en prie, souviens-toi : quel innocent a jamais péri ? Et où les hommes droits ont-ils été retranchés[a] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « anéantis », « supprimés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: Souviens-toi donc
  rationale: L’impératif זְכָר appelle au souvenir ou à la réflexion, tandis que נָא en module l’injonction. « donc » donne ici une invitation naturelle à considérer le fait invoqué, sans recourir à une formule archaïque.
- source_word: מִי הוּא נָקִי
  choice: quel innocent
  rationale: La tournure interrogative renforcée demande quelle personne innocente pourrait être citée. « quel innocent » est naturel en français et conserve la force rhétorique.
- source_word: אָבָד
  choice: a jamais péri
  rationale: Le qal de אבד exprime le fait de périr ou de disparaître dans la ruine. « péri » convient au registre grave, et « jamais » rend explicite la portée rhétorique suggérée par la question.
- source_word: וְאֵיפֹה
  choice: Où
  rationale: La conjonction introduit la question parallèle. En français, la simple juxtaposition avec « Où » restitue naturellement le parallélisme sans imposer une opposition forte.
- source_word: יְשָׁרִים
  choice: des hommes droits
  rationale: L’adjectif pluriel substantivé désigne des personnes moralement droites. « des hommes droits » est clair en français moderne, « hommes » étant ici générique.
- source_word: נִכְחָדוּ
  choice: ont-ils été anéantis
  rationale: Le niphal de כחד peut exprimer le fait d’être supprimé, effacé ou exterminé. « être anéantis » conserve le passif et le parallélisme avec « périr », tout en laissant une variante moins absolue en note.
theological_decisions:
- issue: L’affirmation rhétorique d’Éliphaz sur le sort des innocents et des hommes droits
  choice: Présenter directement les deux questions rhétoriques comme l’argument d’Éliphaz
  alternative: Ajouter dans la formulation un indice signalant que son affirmation sera contestée par l’ensemble du livre
  rationale: Le verset doit transmettre sans atténuation l’opinion exprimée par Éliphaz, sans pour autant la faire cautionner par le narrateur ni anticiper la tension théologique développée ailleurs dans le livre.
translation_notes:
  register: Français moderne, digne et oralement fluide. Le parallélisme des deux questions est conservé. La formulation évite d’ajouter une approbation narrative à l’argument d’Éliphaz.
