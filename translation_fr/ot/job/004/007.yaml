  source_fidelity: 'Le sens central est bien rendu : l''impératif invite à considérer un précédent, et les deux questions rhétoriques expriment l''affirmation d''Éliphaz sur l''innocent et les hommes droits. Toutefois, « donc » ne rend pas adéquatement נא, particule d''insistance polie, et l''absence de coordination avant la seconde question affaiblit légèrement le וְ d''ouverture.'
  naturalness: La formulation est globalement fluide et de registre moderne. « Hommes droits » est compréhensible, mais « les hommes droits » correspond plus naturellement à l'adjectif substantivé défini du texte et au parallélisme avec « quel innocent ». « Je t'en prie » est une manière moderne et idiomatique de conserver la nuance de נא sans archaïsme.
  terminology: « Innocent », « périr » et « hommes droits » conviennent au champ moral et au ton du passage. « Anéantis » est possible pour נכחדו, mais peut être plus absolu que nécessaire ; « retranchés » est un équivalent plus proche, tout en laissant la nuance d'effacement/destruction en note. Aucune résolution théologique indue n'est introduite.
