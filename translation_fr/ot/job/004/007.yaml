revisions:
- from: 'Souviens-toi donc : quel innocent a jamais péri ? Où des hommes droits ont-ils été anéantis[a] ?'
  to: 'Je t''en prie, souviens-toi : quel innocent a jamais péri ? Et où les hommes droits ont-ils été retranchés[a] ?'
  rationale: La révision remplace « donc » par une expression qui rend la valeur exhortative et polie de נא, restitue la coordination de וְאֵיפֹה, et emploie « les hommes droits » pour une désignation plus naturelle des ישרים. « Retranchés » maintient la portée de נכחדו (être éliminés, effacés) sans renforcer inutilement le degré de destruction ; les variantes sont conservées en note. Le propos reste explicitement celui d'Éliphaz, sans le valider ni le corriger.
