  text: כּ֭וֹשֵׁל יְקִימ֣וּ/ן מִלֶּ֑י/ךָ וּ/בִרְכַּ֖יִם כֹּרְע֣וֹת תְּאַמֵּֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/004.yaml
  text: Your words have raised up the one who stumbles[b][a], and you have strengthened knees that were giving way.
translation:
  language: fr
  text: 'Tes paroles relevaient celui qui trébuchait[a],

    et tu affermissais les genoux qui fléchissaient[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soutenaient » ou « remettaient debout ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « les genoux qui se courbaient » : l’image évoque des genoux qui fléchissent sous l’effet de la faiblesse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹשֵׁל
  choice: celui qui trébuchait
  rationale: Le participe de כשל désigne une personne qui trébuche, chancelle ou défaille. Cette formulation conserve l’image concrète et reste naturelle en français.
- source_word: יְקִימוּן
  choice: relevaient
  rationale: Le hiphil de קום exprime ici l’action de faire tenir debout ou de relever. L’imparfait convient à l’évocation d’une conduite passée habituelle et s’accorde avec le parallèle « affermissais ».
- source_word: מִלֶּיךָ
  choice: Tes paroles
  rationale: Le pluriel de מִלָּה signifie « paroles » ou « propos ». « Tes paroles » est direct, idiomatique et adapté au registre poétique.
- source_word: בִרְכַּיִם
  choice: les genoux
  rationale: Le terme anatomique est rendu littéralement, puisque l’image de genoux affaiblis est transparente en français.
- source_word: כֹּרְעוֹת
  choice: qui fléchissaient
  rationale: Le participe de כרע signifie se courber, plier ou s’affaisser. Appliqué aux genoux, « fléchissaient » exprime naturellement leur défaillance tout en gardant l’image corporelle.
- source_word: תְּאַמֵּץ
  choice: tu affermissais
  rationale: Le piel de אמץ signifie rendre fort ou ferme. « Affermissais » maintient la métaphore physique et le parallélisme avec l’action de relever.
