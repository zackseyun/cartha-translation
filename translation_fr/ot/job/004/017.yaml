reference: Job 4:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַֽ֭/אֱנוֹשׁ מֵ/אֱל֣וֹהַ יִצְדָּ֑ק אִ֥ם מֵ֝/עֹשֵׂ֗/הוּ יִטְהַר גָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/017.yaml
  text: Can mortal man be in the right before God? Can a man be pure before his Maker?[a]
translation:
  language: fr
  text: Un mortel peut-il être juste devant Dieu ? Un homme peut-il être pur devant son Créateur ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Un mortel peut-il être plus juste que Dieu ? Un homme peut-il être plus pur que son Créateur ? »'
    reason: La préposition hébraïque מִן peut ici être comprise comme marquant une comparaison plutôt qu’une relation.
lexical_decisions:
- source_word: הַאֱנוֹשׁ
  choice: l’être humain mortel
  rationale: אֱנוֹשׁ désigne l’être humain avec une nuance de fragilité et de mortalité, particulièrement pertinente dans le contraste avec Dieu.
- source_word: מֵאֱלוֹהַ יִצְדָּק
  choice: être juste devant Dieu
  rationale: Dans cette construction, מִן peut exprimer soit la comparaison, soit la relation. « Devant Dieu » rend naturellement la portée judiciaire et relationnelle de צדק, sans effacer la lecture comparative, signalée en note.
- source_word: אִם
  choice: peut-il
  rationale: Dans le parallélisme poétique, אִם introduit la seconde question. La reprise de « peut-il » restitue clairement sa force interrogative en français.
- source_word: מֵעֹשֵׂהוּ
  choice: devant celui qui l’a fait
  rationale: Le participe avec suffixe signifie littéralement « celui qui l’a fait » ou « son créateur ». Cette formulation courante conserve la relation personnelle exprimée par le suffixe et s’accorde avec la construction du premier vers.
- source_word: יִטְהַר
  choice: être pur
  rationale: טהר exprime la pureté ou l’état de ce qui est net; « être pur » convient ici au parallélisme moral avec « être juste ».
- source_word: גָּבֶר
  choice: un homme
  rationale: גָּבֶר est un nom masculin singulier désignant un homme, parfois avec une nuance de vigueur. Ici, « un homme » préserve simplement le parallélisme avec אֱנוֹשׁ.
theological_decisions:
- issue: La condition humaine par rapport à Dieu
  choice: Le verset demande si un être humain mortel peut être juste ou pur devant Dieu, sans développer une formulation doctrinale ultérieure.
  alternative: « L’être humain mortel peut-il être plus juste que Dieu ? Un homme peut-il être plus pur que celui qui l’a fait ? »
  rationale: La préposition מִן autorise une compréhension relationnelle (« devant ») ou strictement comparative (« plus… que »). Le texte principal privilégie le français naturel et le sens contextuel, tandis que la note conserve explicitement l’autre analyse possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme interrogatif est conservé; « l’être humain mortel » met en valeur la fragilité d’אֱנוֹשׁ, tandis que « un homme » respecte la variation poétique avec גָּבֶר.
