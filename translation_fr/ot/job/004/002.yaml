    rationale: נסה peut désigner une tentative prudente dans ce contexte, mais ne requiert pas l’idée explicite de prendre un risque.
  - severity: low
    issue: Le conditionnel « qui pourrait » n’est pas nécessaire.
    rationale: יוּכָל est un imparfait de capacité dans une question rhétorique ; le présent français « qui peut » le reflète plus directement.
