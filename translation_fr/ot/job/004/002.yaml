source:
  edition: WLC
  text: הֲ/נִסָּ֬ה דָבָ֣ר אֵלֶ֣י/ךָ תִּלְאֶ֑ה וַ/עְצֹ֥ר בְּ֝/מִלִּ֗ין מִ֣י יוּכָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/002.yaml
  text: If one tries a word with you[a], will you be weary? But who can hold back words?
translation:
  language: fr
  text: Si l’on tente de t’adresser une parole[a], en seras-tu lassé ? Mais qui peut retenir ses paroles ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si l’on tente de t’aborder au sujet d’une affaire ».'
    reason: דָבָר peut désigner une « parole » ou une « affaire » ; הֲנִסָּה exprime l’idée de tenter ou d’essayer.
lexical_decisions:
- source_word: הֲנִסָּה
  choice: se risque à
  rationale: Le verbe נסה exprime ici l’idée de tenter ou d’oser quelque chose. Dans ce contexte, Éliphaz introduit prudemment sa prise de parole ; « se risque à » rend cette nuance sans suggérer qu’il met Job à l’épreuve.
- source_word: דָבָר אֵלֶיךָ
  choice: t’adresser une parole
  rationale: דָבָר peut désigner une parole ou une affaire, et אֵלֶיךָ marque la direction vers Job. Cette formulation est idiomatique en français et conserve le sens d’une parole adressée à quelqu’un.
- source_word: תִּלְאֶה
  choice: t’en lasseras-tu
  rationale: לאה signifie devenir las ou épuisé. Ici, la lassitude concerne le fait d’entendre une parole ; « t’en lasseras-tu » reste proche du sens lexical tout en étant naturel.
- source_word: וַעְצֹר
  choice: retenir
  rationale: עצר signifie retenir ou empêcher. « Retenir ses paroles » exprime naturellement l’impossibilité rhétorique de s’abstenir de parler.
- source_word: בְּמִלִּין
  choice: ses paroles
  rationale: מִלִּין est un pluriel aramaïsant signifiant « paroles ». Le possessif, implicité en français dans la tournure rhétorique, désigne les paroles que le locuteur voudrait retenir.
- source_word: מִי יוּכָל
  choice: qui pourrait
  rationale: La formule exprime une question rhétorique portant sur la capacité. Le conditionnel « pourrait » convient au mouvement hypothétique introduit par la première proposition.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et oralement fluide. Le parallélisme entre « une parole » et « ses paroles » est conservé, de même que la prudence d’Éliphaz et la force rhétorique de la seconde question.
