  text: וְ֭/אֵלַ/י דָּבָ֣ר יְגֻנָּ֑ב וַ/תִּקַּ֥ח אָ֝זְנִ֗/י שֵׁ֣מֶץ מֶֽנְ/הֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/012.yaml
  text: A word was secretly brought to me[a], and my ear caught a whisper of it.
translation:
  language: fr
  text: Une parole m’est parvenue en secret, et mon oreille en a perçu un murmure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « mon oreille n’en a perçu qu’un faible écho » ou « en a saisi une bribe ».

      '
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַי
  choice: m’est
  rationale: Le complément « à moi » est rendu naturellement par le pronom « m’ »; la conjonction initiale n’exige pas ici l’ajout d’un marqueur temporel tel que « maintenant ».
- source_word: דָּבָר
  choice: une parole
  rationale: Dans ce récit d’une révélation, « parole » conserve la brièveté et le caractère énigmatique du terme sans préciser excessivement « message ».
- source_word: יְגֻנָּב
  choice: est parvenue en secret
  rationale: La forme passive du verbe « voler » exprime ici une transmission furtive ou secrète; une traduction littérale par « a été volée » serait trompeuse en français.
- source_word: וַתִּקַּח
  choice: a saisi
  rationale: Le verbe signifie littéralement « prendre »; avec « mon oreille » comme sujet, « saisir » préserve l’image concrète tout en restant idiomatique.
- source_word: אָזְנִי
  choice: mon oreille
  rationale: Le singulier et l’image corporelle vive de l’hébreu sont conservés.
- source_word: שֵׁמֶץ
  choice: un murmure
  rationale: Dans ce contexte auditif, le terme désigne une faible trace sonore; « murmure » convient à l’atmosphère feutrée tout en laissant entendre qu’il ne s’agit que d’une perception partielle.
- source_word: מֶנְהוּ
  choice: en
  rationale: Le pronom adverbial renvoie naturellement à « une parole » et rend avec fluidité l’idée de saisir quelque chose provenant d’elle.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde l’atmosphère mystérieuse du témoignage d’Éliphaz, l’image singulière de l’oreille et l’ambiguïté de שֵׁמֶץ entre murmure, faible son et bribe.
