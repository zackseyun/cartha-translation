base_translation:
  language: en
  yaml_path: translation/ot/job/004/009.yaml
  text: By the breath of God they perish[c][b][a], and by the blast of his anger they come to an end.
translation:
  language: fr
  text: Par le souffle de Dieu, ils périssent[a] ; par le vent de sa colère[b], ils prennent fin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Du souffle de Dieu, ils périssent. » La préposition hébraïque peut indiquer la source ou le moyen.'
    reason: lexical_alternative
  - marker: b
    text: « Vent » traduit le mot hébreu rouaḥ, qui peut aussi signifier « souffle », « respiration » ou « esprit ». Dans ce contexte, il évoque une force destructrice associée à sa colère.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ils sont consumés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: Par le souffle de
  rationale: נְשָׁמָה désigne le souffle ou la respiration. La préposition מִן peut exprimer ici la source ou le moyen ; « par » rend naturellement la cause instrumentale tout en maintenant l’image poétique.
- source_word: אֱלוֹהַ
  choice: Dieu
  rationale: אֱלוֹהַ est une forme poétique singulière courante dans Job ; « Dieu » en est l’équivalent direct, sans ajout interprétatif.
- source_word: יֹאבֵדוּ
  choice: ils périssent
  rationale: Le verbe אבד signifie fondamentalement périr ou se perdre. « Ils périssent » conserve sa valeur intransitive et le parallélisme poétique.
- source_word: וּמֵרוּחַ
  choice: sous le vent de
  rationale: רוּחַ peut désigner le vent, le souffle ou l’esprit. Dans ce parallélisme, il évoque un souffle destructeur ; « vent » différencie les deux images sans introduire ici le sens théologique d’« esprit ».
- source_word: אַפּוֹ
  choice: sa colère
  rationale: אַף signifie littéralement nez ou narine, puis, par extension idiomatique, colère. « Sa colère » communique clairement le sens tout en laissant au « vent » la force de l’image corporelle.
- source_word: יִכְלוּ
  choice: ils disparaissent
  rationale: כלה au qal peut signifier parvenir à son terme, être épuisé ou disparaître. « Ils disparaissent » exprime ici l’anéantissement dans un français poétique naturel, sans imposer une image matérielle de combustion.
theological_decisions:
- issue: Expression anthropomorphique de la colère divine
  choice: Rendre אַפּוֹ par « sa colère » tout en conservant l’image du vent ou du souffle.
  alternative: « ses narines » ou « sa fureur »
  rationale: Le sens idiomatique est bien celui de la colère, mais le parallélisme hébreu garde une image d’expiration destructrice. Cette formulation reste intelligible sans effacer entièrement l’anthropomorphisme ni ajouter une précision doctrinale.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme est conservé avec « souffle » puis « vent », et l’ambiguïté de la préposition ainsi que celle du dernier verbe sont signalées en notes.
