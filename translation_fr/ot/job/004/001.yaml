lexical_decisions:
- source_word: וַיַּעַן
  choice: prit la parole
  rationale: Dans cette formule narrative ouvrant une réplique, ענה signifie répondre ou prendre la parole. « Prit la parole » est une tournure française naturelle et digne qui introduit ici la réponse d’Éliphaz sans alourdir la formulation.
- source_word: אֱלִיפַז
  choice: Éliphaz
  rationale: Le nom propre est translittéré selon l’usage français courant.
- source_word: הַתֵּימָנִי
  choice: le Témanite
  rationale: L’adjectif ethnique désigne un homme originaire de Témân. « Le Témanite » conserve l’identification concise de l’hébreu et correspond à l’usage biblique français établi.
- source_word: וַיֹּאמַר
  choice: et dit
  rationale: Cette formule hébraïque standard introduit les paroles qui suivent. « Et dit » en préserve la structure tout en restant idiomatique après « prit la parole ».
- source_word: וַ
  choice: Alors
  rationale: Le premier waw narratif marque la progression du récit. « Alors » exprime naturellement cette succession en français moderne.
