  variant: modern international French
source:
  edition: WLC
  text: מִ/בֹּ֣קֶר לָ/עֶ֣רֶב יֻכַּ֑תּוּ מִ/בְּלִ֥י מֵ֝שִׂ֗ים לָ/נֶ֥צַח יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/020.yaml
  text: From morning to evening they are crushed; without anyone taking notice[a], they perish forever.
translation:
  language: fr
  text: Du matin au soir, ils sont écrasés ; sans que personne y prête attention[a], ils périssent pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans que personne y prenne garde » ; littéralement, l’expression peut évoquer le fait que personne ne le prend à cœur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֹּקֶר לָעֶרֶב
  choice: Du matin au soir
  rationale: Cette expression temporelle couvre l’espace d’une seule journée et souligne la brièveté ainsi que la fragilité de la vie humaine. « Du matin au soir » conserve l’image hébraïque dans un français naturel.
- source_word: יֻכַּתּוּ
  choice: ils sont écrasés
  rationale: La forme hophal exprime l’action subie d’être abattu ou broyé. « Sont écrasés » préserve le passif sans préciser indûment la manière.
- source_word: מִבְּלִי מֵשִׂים
  choice: sans que personne y prête attention
  rationale: 'L’expression, littéralement liée au fait de « placer » ou « mettre », est probablement elliptique : personne n’y applique son cœur ou son esprit. La formulation choisie en rend clairement le sens idiomatique.'
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: Le terme exprime ici la durée irréversible et accentue le caractère définitif de la disparition, sans développer une portée eschatologique absente du contexte immédiat.
- source_word: יֹאבֵדוּ
  choice: ils périssent
  rationale: Le qal de אבד peut signifier périr, disparaître ou aller à sa perte. « Ils périssent » garde cette portée générale sans introduire une nuance théologique plus étroite.
theological_decisions:
- issue: Caractère définitif de la mortalité humaine dans le discours d’Éliphaz
  choice: Le verset décrit la fragilité temporelle des humains et une mort qui passe inaperçue.
  alternative: Comprendre « pour toujours » comme une affirmation explicite de perdition eschatologique définitive.
  rationale: Dans le contexte, Éliphaz insiste sur la fragilité des mortels devant Dieu. La traduction conserve « pour toujours » et sa tension, mais n’élargit pas le propos en une doctrine explicite du jugement final.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme bref et le parallélisme du vers hébreu sont conservés ; « y prête attention » offre une formulation courante tout en maintenant l’ellipse de l’original.
