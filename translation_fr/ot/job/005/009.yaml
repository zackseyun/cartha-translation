lexical_decisions:
- source_word: עֹשֶׂה
  choice: lui qui accomplit
  rationale: Le participe qal décrit Dieu dans le contexte. « Lui qui accomplit » garde cette valeur descriptive et s’insère naturellement dans la continuité syntaxique du passage.
- source_word: גְדֹלוֹת
  choice: des œuvres grandioses
  rationale: L’adjectif pluriel est employé substantivement. « Œuvres grandioses » exprime des actes remarquables sans réduire le sens à une catégorie précise.
- source_word: וְאֵין חֵקֶר
  choice: insondables
  rationale: L’expression signifie littéralement qu’il n’y a pas de possibilité d’exploration ou d’investigation complète. « Insondables » rend ce sens avec concision dans le parallélisme poétique.
- source_word: נִפְלָאוֹת
  choice: des merveilles
  rationale: Le nom désigne des actes extraordinaires qui suscitent l’émerveillement. « Merveilles » est direct, digne et bien adapté au parallélisme.
- source_word: עַד אֵין מִסְפָּר
  choice: innombrables
  rationale: L’idiome exprime l’impossibilité de compter. « Innombrables » est naturel en français et forme un parallèle net avec « insondables ».
