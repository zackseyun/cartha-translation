source:
  edition: WLC
  text: וְֽ֭/יָדַעְתָּ כִּי רַ֣ב זַרְעֶ֑/ךָ וְ֝/צֶאֱצָאֶ֗י/ךָ כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/025.yaml
  text: You will know that your offspring are many[b][a], and your descendants are like the grass of the earth.
translation:
  language: fr
  text: Tu sauras que ta descendance est nombreuse[a], et que tes descendants sont comme l’herbe de la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ta semence » ; le mot hébreu est un terme collectif désignant la postérité.
    reason: lexical_alternative
  - marker: b
    text: Ou « du pays ». Le mot hébreu peut signifier « terre » ou « pays » selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Tu sauras
  rationale: Le qatal qal à la 2e personne masculine singulière, coordonné dans ce contexte poétique, exprime ici une assurance tournée vers l’avenir.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce qui sera su.
- source_word: רַב
  choice: est nombreuse
  rationale: Avec le collectif singulier זֶרַע, l’adjectif exprime l’abondance ou le grand nombre; l’accord au singulier respecte le français.
- source_word: זַרְעֶךָ
  choice: ta descendance
  rationale: Le terme collectif désigne ici la postérité; « descendance » est clair, naturel et conserve sa valeur collective.
- source_word: וְצֶאֱצָאֶיךָ
  choice: et que tes rejetons
  rationale: Le mot désigne ceux qui sont issus de quelqu’un. « Rejetons » préserve l’image organique et distingue ce terme du précédent, malgré un registre légèrement littéraire.
- source_word: כְּעֵשֶׂב
  choice: comme l’herbe
  rationale: Cette formulation conserve directement la comparaison végétale et son évocation d’une grande abondance.
- source_word: הָאָרֶץ
  choice: de la terre
  rationale: אֶרֶץ peut désigner la terre ou le pays; la portée générale de la comparaison favorise ici « terre », sans supprimer l’autre possibilité.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reflète l’adresse hébraïque à la deuxième personne masculine du singulier. « Rejetons » est légèrement littéraire, mais maintient le parallélisme lexical sans répéter « descendance ».
