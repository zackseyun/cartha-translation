base_translation:
  language: en
  yaml_path: translation/ot/job/005/023.yaml
  text: For you will have a covenant with the stones of the field[c][b][a], and the wild animals of the field will be at peace with you.
translation:
  language: fr
  text: Car tu seras en alliance avec les pierres du champ[a], et les animaux sauvages du champ seront en paix avec toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les pierres du champ ». L’expression peut évoquer les pierres qui font obstacle aux travaux agricoles, mais le texte hébreu maintient explicitement cette image.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « a fait la paix avec toi » ou « est en paix avec toi ». L’hébreu décrit des relations pacifiques entre la personne et les animaux sauvages.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici le fondement de l’assurance précédente et conserve naturellement le lien logique en français.
- source_word: עִם אַבְנֵי הַשָּׂדֶה בְרִיתֶךָ
  choice: tu auras une alliance avec les pierres des champs
  rationale: L’hébreu est une proposition nominale sans verbe exprimé. « Tu auras une alliance » explicite sobrement la relation, tandis que « les pierres des champs » préserve l’image poétique.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: et les animaux sauvages
  rationale: Dans cette expression, חַיָּה désigne vraisemblablement les bêtes vivant à l’état sauvage. Cette formulation est claire et actuelle.
- source_word: הָשְׁלְמָה לָךְ
  choice: seront en paix avec toi
  rationale: La forme issue de שׁלם exprime l’établissement ou l’existence de relations pacifiques. Le futur s’accorde avec le contexte de promesse, sans effacer la nuance d’« avoir fait la paix ».
