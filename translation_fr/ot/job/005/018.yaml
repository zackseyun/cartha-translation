source:
  edition: WLC
  text: כִּ֤י ה֣וּא יַכְאִ֣יב וְ/יֶחְבָּ֑שׁ יִ֝מְחַ֗ץ ו/יד/ו תִּרְפֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/018.yaml
  text: For he causes pain[a], but he binds up; he shatters, but his hands heal.
translation:
  language: fr
  text: Car c’est lui qui fait souffrir, mais il panse les blessures ; il brise, mais sa main guérit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En hébreu, « sa main » est au singulier, mais le verbe correspondant est au féminin pluriel : « guérissent ». La traduction emploie le singulier français pour l’accord ; on peut aussi rendre selon le sens : « ses mains guérissent ».'
    reason: Discordance grammaticale et autre traduction possible.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve la valeur causale ou explicative du terme hébreu.
- source_word: הוּא
  choice: c’est lui qui
  rationale: Rend l’insistance portée par le pronom indépendant, dans un français naturel.
- source_word: יַכְאִיב
  choice: fait souffrir
  rationale: Le hiphil de כאב signifie causer de la douleur. « Fait souffrir » exprime directement cette action sans anticiper l’image plus concrète du second hémistiche.
- source_word: וְיֶחְבָּשׁ
  choice: mais il panse les blessures
  rationale: חבש évoque l’action de bander ou panser une blessure. Le complément explicite, implicite en hébreu, rend l’image naturelle en français, tandis que « mais » marque le contraste poétique.
- source_word: יִמְחַץ
  choice: il brise
  rationale: מחץ désigne un coup qui écrase ou fracasse. « Brise » conserve la force de l’image tout en formant un contraste naturel avec la guérison.
- source_word: וְיָדוֹ
  choice: mais sa main
  rationale: Conserve le nom singulier du texte consonantique et vocalisé, sans le transformer silencieusement en pluriel; « mais » exprime le contraste du parallélisme.
- source_word: תִּרְפֶּינָה
  choice: guérit
  rationale: רפא signifie couramment guérir. La traduction française emploie le singulier exigé par « sa main », tandis qu’une note signale la discordance grammaticale présente dans l’hébreu.
theological_decisions:
- issue: Action divine dans la souffrance et dans la restauration
  choice: Attribuer directement à Dieu le fait de faire souffrir, de briser, de panser et de guérir.
  alternative: Atténuer la première action par une formule telle que « permet la souffrance ».
  rationale: L’hébreu présente explicitement Dieu comme sujet des actions douloureuses aussi bien que réparatrices. La traduction préserve cette tension théologique sans l’expliquer ni l’adoucir.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme antithétique est conservé. « Panse les blessures » explicite naturellement l’objet sous-entendu de חבש, et la note maintient visible l’irrégularité entre le sujet singulier et le verbe pluriel.
