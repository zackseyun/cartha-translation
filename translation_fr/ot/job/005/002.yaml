source:
  edition: WLC
  text: כִּֽי לֶֽ֭/אֱוִיל יַהֲרָג כָּ֑עַשׂ וּ֝/פֹתֶ֗ה תָּמִ֥ית קִנְאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/002.yaml
  text: For vexation kills the fool[a], and jealousy puts the simple to death.
translation:
  language: fr
  text: Car l’irritation tue l’insensé, et la jalousie[a] fait mourir l’homme naïf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’envie ». Le terme hébreu peut désigner l’une ou l’autre; ici, il évoque une passion destructrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’affirmation explicative d’Élifaz et assure naturellement le lien argumentatif avec le verset précédent.
- source_word: לֶאֱוִיל
  choice: l’insensé
  rationale: אֱוִיל désigne une personne dépourvue de sagesse sur les plans moral et pratique, et non simplement peu intelligente.
- source_word: יַהֲרָג
  choice: tue
  rationale: L’imparfait qal exprime ici une vérité générale propre au style sapientiel; « tue » conserve la force du verbe dans un français actuel.
- source_word: כָּעַשׂ
  choice: l’irritation
  rationale: כַּעַשׂ peut exprimer la contrariété, l’irritation ou le ressentiment. Ici, le mot désigne une agitation intérieure destructrice parallèle à קִנְאָה.
- source_word: וּפֹתֶה
  choice: l’homme naïf
  rationale: פֹּתֶה désigne, dans la littérature de sagesse, une personne simple et facilement influençable. « L’homme naïf » évite de suggérer une déficience intellectuelle tout en restant naturel.
- source_word: תָּמִית
  choice: fait mourir
  rationale: Le hiphil de מות est causatif; « fait mourir » en préserve la nuance et maintient la variation du parallélisme hébreu.
- source_word: קִנְאָה
  choice: la jalousie
  rationale: Dans ce contexte de passion destructrice, « jalousie » convient bien; « envie » demeure une possibilité lexicale réelle signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme sapientiel est conservé par « tue » et « fait mourir », tandis que les termes choisis décrivent une folie morale et une naïveté vulnérable sans connotation de déficience intellectuelle.
