id: JOB.5.1
reference: Job 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קְֽרָא נָ֭א הֲ/יֵ֣שׁ עוֹנֶ֑/ךָּ וְ/אֶל מִ֖י מִ/קְּדֹשִׁ֣ים תִּפְנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/001.yaml
  text: Call now—is there anyone who will answer you? And to which of the holy ones will you turn?[a]
translation:
  language: fr
  text: Appelle donc ! Y a-t-il quelqu’un qui te réponde ? Vers lequel des êtres saints te tourneras-tu ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « saints ». L’expression hébraïque désigne probablement ici des êtres célestes.
    reason: alternative lexicale et clarification contextuelle
lexical_decisions:
- source_word: קְרָא נָא
  choice: Appelle donc !
  rationale: L’impératif קְרָא lance un défi à Job. La particule נָא apporte ici une nuance d’insistance que « donc » rend naturellement en français, sans la politesse suggérée par « s’il te plaît ».
- source_word: הֲיֵשׁ עוֹנֶךָ
  choice: Y a-t-il quelqu’un qui te réponde ?
  rationale: La tournure existentielle interrogative est conservée. Le participe avec suffixe désigne « quelqu’un qui te répond » ; le subjonctif français convient après la question portant sur l’existence, sans imposer une valeur temporelle absente de l’hébreu.
- source_word: וְאֶל מִי
  choice: Vers lequel
  rationale: מִי désigne ici un membre à choisir au sein du groupe qui suit. « Lequel » reprend naturellement « des êtres saints ».
- source_word: מִקְּדֹשִׁים
  choice: des êtres saints
  rationale: Le pluriel substantivé désigne probablement des êtres célestes. « Êtres saints » reste transparent tout en évitant les associations confessionnelles possibles de « saints » employé seul.
- source_word: תִּפְנֶה
  choice: te tourneras-tu
  rationale: Le verbe פנה signifie littéralement « se tourner » vers quelqu’un. La traduction conserve cette image sans expliciter indûment l’idée d’appel au secours.
theological_decisions:
- issue: Identité des קְדֹשִׁים
  choice: êtres saints, probablement célestes
  alternative: saints ; êtres célestes
  rationale: Le contexte du livre de Job favorise des membres de la cour céleste, mais le texte ne les nomme pas explicitement « anges ». Le corps du texte garde donc une formulation assez large, et la note signale l’interprétation probable ainsi que l’autre rendu possible.
translation_notes:
  register: Français moderne, international et digne. Les deux questions rhétoriques gardent leur vigueur ; « donc » exprime l’insistance du défi, et « êtres saints » évite une lecture confessionnelle trop précise.
