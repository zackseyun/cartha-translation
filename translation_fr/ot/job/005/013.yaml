  text: לֹכֵ֣ד חֲכָמִ֣ים בְּ/עָרְמָ֑/ם וַ/עֲצַ֖ת נִפְתָּלִ֣ים נִמְהָֽרָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/013.yaml
  text: He catches the wise in their craftiness[c][b][a], and the counsel of the twisted is hurried along.
translation:
  language: fr
  text: Il prend les sages dans leur propre ruse[a], et le projet des gens retors[b] est précipité[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par leur propre habileté » ou « dans leur ruse ». Le mot hébreu peut désigner la prudence dans d’autres contextes, mais il a ici une valeur négative.
    reason: lexical_alternative
  - marker: b
    text: Ou « des gens fourbes » ou « des gens tortueux ».
    reason: lexical_alternative
  - marker: c
    text: Ou « est entraîné à la hâte » ou « est brusquement emporté ». L’expression suggère que leur projet est poussé précipitamment vers l’échec, sans que celui-ci soit nommé explicitement.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹכֵד
  choice: prend au piège
  rationale: Le participe qal de לכד exprime ici l’action de saisir ou capturer. « Prend au piège » restitue naturellement en français l’image de ceux qui sont pris par leur propre manœuvre.
- source_word: חֲכָמִים
  choice: les sages
  rationale: 'L’adjectif pluriel est employé comme substantif. « Les sages » conserve l’ironie du texte : ceux qui passent pour sages sont eux-mêmes pris.'
- source_word: בְּעָרְמָם
  choice: de leur propre ruse
  rationale: עָרְמָה peut désigner l’habileté ou la prudence, mais le parallélisme lui donne ici une valeur négative. « Leur propre ruse » rend aussi le fait que leur manœuvre devient le moyen de leur capture.
- source_word: וַעֲצַת
  choice: et le projet
  rationale: עֵצָה peut signifier conseil, dessein ou projet. Dans ce contexte de manœuvres qui échouent, « projet » est naturel et concret en français.
- source_word: נִפְתָּלִים
  choice: des gens retors
  rationale: Le terme issu de פתל évoque ce qui est tordu, tortueux ou fourbe. « Retors » conserve à la fois l’image et la portée morale sans expression artificielle.
- source_word: נִמְהָרָה
  choice: est précipité
  rationale: Le niphal féminin singulier s’accorde avec עֲצַת et exprime une action menée ou entraînée avec précipitation. « Est précipité » préserve la forme passive et l’ambiguïté entre hâte et débâcle rapide.
theological_decisions:
- issue: Sujet implicite du participe לֹכֵד
  choice: « Il », renvoyant à Dieu dans le contexte
  alternative: Un sujet indéfini, comme « celui qui prend »
  rationale: Le verset ne nomme pas explicitement le sujet, mais les versets environnants énumèrent les actions de Dieu. Le pronom français reprend ce sujet contextuel sans l’introduire dans le nom divin.
- issue: Valeur morale de עָרְמָה et נִפְתָּלִים
  choice: 'Sens négatif : « ruse » et « gens retors »'
  alternative: Des termes plus neutres comme « habileté » et « personnes complexes »
  rationale: Le parallélisme décrit des manœuvres que Dieu retourne contre leurs auteurs. Le contexte soutient donc une caractérisation morale négative, tout en conservant la métaphore de la torsion.
- issue: Portée de נִמְהָרָה
  choice: 'Conserver l’image passive et concise : « est précipité »'
  alternative: 'Expliciter l’échec : « tourne rapidement court » ou « est rapidement déjoué »'
  rationale: Le verbe indique directement la précipitation, tandis que l’idée d’échec résulte du contexte. La traduction évite de transformer cette implication en affirmation explicite.
translation_notes:
  register: Français international moderne, sobre et digne. « Gens retors » évite un substantif abstrait ou archaïque, tandis que « est précipité » maintient la concision et la tension du texte hébreu.
