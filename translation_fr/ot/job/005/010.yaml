  text: who gives rain on the face of the earth and sends water on the face of the fields[b][a],
translation:
  language: fr
  text: 'lui qui donne la pluie sur la surface de la terre[a]

    et qui envoie l’eau sur les campagnes[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pays ». Le mot hébreu peut désigner la terre en général ou un territoire.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur les espaces ouverts », voire « sur les rues ». Le terme hébreu désigne, selon le contexte, les lieux extérieurs, les grandes étendues ou les rues.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: lui qui répand
  rationale: Le participe qal substantivé poursuit la description de Dieu au verset précédent. « Lui qui » conserve cette continuité, et « répand la pluie » est une collocation française naturelle pour l’hébreu littéral « donne la pluie ».
- source_word: מָטָר
  choice: la pluie
  rationale: Équivalent français courant et précis du terme hébreu désignant la pluie.
- source_word: עַל־פְּנֵי אָרֶץ
  choice: sur la surface de la terre
  rationale: « Surface » rend naturellement l’image de פְּנֵי sans l’étrangeté possible de « face de la terre » en français; « terre » convient à la portée générale de l’énoncé.
- source_word: וְשֹׁלֵחַ
  choice: et qui envoie
  rationale: Le second participe qal est rendu parallèlement au premier tout en conservant la coordination hébraïque.
- source_word: מַיִם
  choice: l’eau
  rationale: Bien que le mot hébreu ait une forme plurielle, le nom massif singulier est idiomatique en français.
- source_word: עַל־פְּנֵי חוּצוֹת
  choice: sur les campagnes
  rationale: חוּצוֹת peut désigner les espaces extérieurs ou ouverts, mais aussi les rues. Dans ce contexte de pluie et en parallèle avec la terre, « campagnes » exprime naturellement les étendues ouvertes sans imposer le sens urbain.
theological_decisions:
- issue: Portée de אָרֶץ
  choice: terre
  alternative: pays
  rationale: Le propos décrit de façon générale l’action providentielle de Dieu; « terre » préserve cette portée, tout en signalant en note l’autre sens lexical possible.
- issue: Sens contextuel de חוּצוֹת
  choice: campagnes
  alternative: rues / espaces ouverts
  rationale: Le parallélisme avec la pluie répandue sur la terre favorise ici les espaces ouverts ruraux, mais la polysémie réelle du terme hébreu est conservée en note.
translation_notes:
  register: Français moderne, digne et accessible. La disposition en deux lignes fait ressortir le parallélisme poétique. « Sur la surface » conserve l’image hébraïque répétée, tandis que « lui qui » rattache le fragment à la syntaxe du verset précédent.
