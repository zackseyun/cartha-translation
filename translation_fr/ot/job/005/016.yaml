source:
  edition: WLC
  text: וַ/תְּהִ֣י לַ/דַּ֣ל תִּקְוָ֑ה וְ֝/עֹלָ֗תָ/ה קָ֣פְצָה פִּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/016.yaml
  text: So there is hope for the poor[a], and injustice shuts its mouth.
translation:
  language: fr
  text: 'Ainsi, il y a de l’espoir pour le pauvre,

    et l’injustice ferme sa bouche.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le mal ferme sa bouche » ; plus littéralement, « sa bouche se ferme ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: Ainsi, il y a
  rationale: Le wayyiqtol de היה présente ici le résultat de ce qui précède. « Ainsi » marque ce lien, tandis que le présent donne naturellement à l’énoncé sa portée générale.
- source_word: לַדַּל
  choice: pour le pauvre
  rationale: דַּל peut désigner une personne pauvre, faible ou socialement démunie. « Le pauvre » est naturel en français et conserve les dimensions économique et sociale du terme.
- source_word: תִּקְוָה
  choice: de l’espoir
  rationale: תִּקְוָה signifie couramment « espoir » ou « attente ». « De l’espoir » convient à la construction existentielle française et au contraste du verset.
- source_word: וְעֹלָתָה
  choice: et l’injustice
  rationale: עַוְלָה désigne l’injustice, la perversité ou l’action mauvaise. « L’injustice » correspond bien au contexte social sans restreindre indûment le sens.
- source_word: קָפְצָה פִּיהָ
  choice: ferme la bouche
  rationale: L’expression signifie littéralement que sa bouche se ferme. Cette formulation conserve la personnification et l’image vive de l’hébreu tout en restant idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La personnification de l’injustice est conservée, ainsi que le lien de conséquence avec le contexte précédent.
