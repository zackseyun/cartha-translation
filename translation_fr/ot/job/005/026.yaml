  source_fidelity: La première ligne rend correctement le mouvement vers le lieu de sépulture et préserve avec prudence l’ambiguïté de בְּכֶלַח. En revanche, « qu’on dresse » privilégie un sens peu assuré de עֲלוֹת et ne rend pas aussi bien que l’image contextuelle d’une récolte recueillie au temps approprié. « Grain » est plus générique que « blé » et correspond mieux à גדיש.
