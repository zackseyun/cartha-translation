  terminology: « Tombe » convient à קָבֶר. « Pleine maturité » est une solution prudente pour le terme rare כֶּלַח, à condition que la note maintienne explicitement les possibilités d’âge mûr et de vigueur. « Meule de grain » rend גדיש sans le réduire à une gerbe.
