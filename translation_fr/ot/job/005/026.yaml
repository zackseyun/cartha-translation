  yaml_path: translation/ot/job/005/026.yaml
  text: You will come to the grave in full vigor[b][a], like a sheaf gathered up in its season.
translation:
  language: fr
  text: 'Tu parviendras à la tombe en pleine maturité[a],

    comme une meule de grain qu’on rentre en son temps[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à un âge mûr » ou « en pleine vigueur ». Le mot hébreu est rare et son sens précis est incertain.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « comme une meule de grain qu’on élève en son temps ». L’expression hébraïque est discutée : dans cette image agricole, elle peut évoquer la récolte que l’on enlève ou rentre au moment voulu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: tu arriveras
  rationale: Le qal inaccompli de בוא exprime ici l’arrivée future. « Arriver à la tombe » est naturel en français et conserve le mouvement vers le tombeau.
- source_word: בְכֶלַח
  choice: en pleine maturité
  rationale: 'כֶּלַח est un terme rare dont le sens précis est discuté : il peut évoquer l’âge mûr, la vigueur ou le plein développement. « En pleine maturité » garde cette amplitude sans imposer uniquement l’idée d’un âge très avancé.'
- source_word: אֱלֵי קָבֶר
  choice: à la tombe
  rationale: אֱלֵי marque la direction et קֶבֶר désigne ordinairement la tombe ou le lieu de sépulture. La formulation française est directe et idiomatique.
- source_word: כַּעֲלוֹת
  choice: comme … qu’on dresse
  rationale: L’infinitif de עלה évoque ce qu’on fait monter ou s’élever. Dans l’image agricole, « dresser » une meule conserve ce mouvement tout en restant intelligible.
- source_word: גָּדִישׁ
  choice: une meule de blé
  rationale: גָּדִישׁ désigne un amas ou une meule de céréales coupées, plutôt qu’une gerbe isolée. « Meule de blé » restitue précisément l’image agricole.
- source_word: בְּעִתּוֹ
  choice: en sa saison
  rationale: L’expression signifie « au moment qui lui convient ». « En sa saison » maintient à la fois l’idée du temps approprié et la résonance agricole.
