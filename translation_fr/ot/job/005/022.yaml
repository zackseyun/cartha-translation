id: JOB.5.22
reference: Job 5:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ/שֹׁ֣ד וּ/לְ/כָפָ֣ן תִּשְׂחָ֑ק וּֽ/מֵ/חַיַּ֥ת הָ֝/אָ֗רֶץ אַל תִּירָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/022.yaml
  text: At destruction and famine you will laugh[a], and you will not fear the beasts of the earth.
translation:
  language: fr
  text: 'Tu riras de la dévastation et de la famine,

    et tu n’auras pas peur des bêtes sauvages du pays.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et n’aie pas peur des bêtes sauvages du pays ». En hébreu, cette forme peut exprimer une défense, mais elle semble ici fonctionner comme une promesse de sécurité.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁד
  choice: dévastation
  rationale: Le nom désigne une destruction violente ou des ravages. « Dévastation » est naturel en français et forme avec « famine » un couple de calamités.
- source_word: כָּפָן
  choice: famine
  rationale: Le terme désigne la famine ou une faim extrême. « Famine » convient au parallélisme avec la dévastation.
- source_word: תִּשְׂחָק
  choice: tu riras
  rationale: Le verbe signifie rire et peut suggérer ici une assurance qui défie le malheur. La traduction littérale conserve l’image sans préciser indûment s’il s’agit de moquerie.
- source_word: מֵחַיַּת הָאָרֶץ
  choice: des bêtes sauvages du pays
  rationale: חַיָּה désigne souvent les animaux sauvages, et הָאָרֶץ peut signifier la terre ou le pays. Cette formulation est claire, actuelle et adaptée au contexte des dangers terrestres.
- source_word: אַל תִּירָא
  choice: tu n’auras pas peur
  rationale: Bien que אַל suivi de l’inaccompli exprime normalement une défense, la série de promesses du contexte permet de comprendre ici une assurance. La note conserve l’autre lecture grammaticale.
theological_decisions:
- issue: Valeur de אַל תִּירָא dans le contexte
  choice: assurance portant sur l’avenir (« tu n’auras pas peur »)
  alternative: défense ou exhortation (« n’aie pas peur »)
  rationale: Le verset appartient à une suite de protections promises et le parallélisme avec « tu riras » favorise l’assurance. Puisque la construction hébraïque peut néanmoins être prohibitive, l’ambiguïté est signalée en note.
translation_notes:
  register: Poésie sobre et digne, en français international moderne. « Bêtes sauvages » est plus courant que « bêtes de la terre », tandis que « du pays » rend naturellement הָאָרֶץ sans exclure le sens plus large de « terre ».
