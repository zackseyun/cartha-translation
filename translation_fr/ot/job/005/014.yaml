  language: fr
  text: En plein jour, ils rencontrent les ténèbres ; à midi, ils tâtonnent comme dans la nuit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹמָם
  choice: En plein jour
  rationale: L’adverbe indique le temps, « de jour ». « En plein jour » est naturel en français et accentue sans ajouter d’idée étrangère le contraste avec les ténèbres et la nuit.
- source_word: יְפַגְּשׁוּ
  choice: ils rencontrent
  rationale: Le verbe פגשׁ exprime ici le fait de rencontrer ou de trouver sur son chemin. « Rencontrent » conserve directement l’image hébraïque.
- source_word: חֹשֶׁךְ
  choice: les ténèbres
  rationale: « Les ténèbres » rend le sens courant de חֹשֶׁךְ et préserve sa portée à la fois concrète et figurée dans ce contexte sapientiel.
- source_word: וְכַלַּיְלָה
  choice: comme dans la nuit
  rationale: Le préfixe כ־ marque une comparaison. Cette formulation française exprime naturellement qu’à midi ils tâtonnent comme s’ils étaient dans la nuit.
- source_word: יְמַשְׁשׁוּ
  choice: ils tâtonnent
  rationale: משׁשׁ décrit l’action de chercher son chemin au toucher, notamment dans l’obscurité. « Tâtonnent » est précis et idiomatique.
- source_word: בַצָּהֳרָיִם
  choice: à midi
  rationale: Le terme désigne midi, le moment où la lumière est normalement la plus forte, ce qui maintient le contraste saisissant du verset.
