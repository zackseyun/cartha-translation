review_pass:
  verdict: revise
  source_fidelity: La première proposition rend fidèlement la mise en relief de « sa moisson » et le substantif singulier « l’affamé ». La seconde conserve l’image difficile des épines, mais « il vient la prendre » introduit l’idée de mouvement (« vient »), absente de l’hébreu. La dernière proposition suit de manière défendable la lecture usuelle de צַמִּים (« les assoiffés »), tout en conservant l’alternative textuelle en note.
  naturalness: Le français est globalement clair et de registre approprié. « Soupirent après » est plus idiomatique et plus proche de l’image de désir haletant de שָׁאַף que « convoitent avidement », lequel explicite et intensifie quelque peu le sens. « La prennent jusque parmi les épines » est direct et ne rajoute pas de mouvement.
  terminology: « Moisson », « affamé », « épines », « assoiffés » et « richesses » sont des choix justes et cohérents. La note exprime correctement le caractère disputé de la dernière proposition sans imposer l’autre lecture.
  issues:
  - severity: medium
    issue: Ajout de « vient » dans « il vient la prendre ».
    rationale: Le verbe יִקָּחֵהוּ signifie « il la prend / la saisit »; le mouvement exprimé par « vient » n’est pas marqué dans le texte source et n’est pas nécessaire pour rendre la construction difficile.
  - severity: low
    issue: « Convoitent avidement » explicite l’avidité au lieu de conserver l’image de désir haletant.
    rationale: Le verbe שָׁאַף évoque le halètement, l’aspiration avide ou le fait de poursuivre avec avidité. « Soupirent après » demeure naturel en français moderne tout en préservant mieux cette métaphore.
  revised_text: Sa moisson, l’affamé la mange ; il la prend jusque parmi les épines, et les assoiffés soupirent après leurs richesses.[a]
