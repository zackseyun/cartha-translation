revisions:
- from: Sa moisson, l’affamé la mange ; il vient la prendre jusque parmi les épines, et les assoiffés convoitent avidement leurs richesses.[a]
  to: Sa moisson, l’affamé la mange ; il la prend jusque parmi les épines, et les assoiffés soupirent après leurs richesses.[a]
  rationale: La révision retire l’ajout non nécessaire « vient » et choisit « soupirent après » afin de rendre plus littéralement, sans lourdeur, la nuance imagée de שָׁאַף. La formulation conserve la difficulté de la proposition concernant les épines et maintient la note sur l’alternative textuelle.
