  text: אֲשֶׁ֤ר קְצִיר֨/וֹ רָ֘עֵ֤ב יֹאכֵ֗ל וְ/אֶֽל מִ/צִּנִּ֥ים יִקָּחֵ֑/הוּ וְ/שָׁאַ֖ף צַמִּ֣ים חֵילָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/005.yaml
  text: The hungry eat his harvest[a], and take it even from among the thorns, and the thirsty pant after their wealth.
translation:
  language: fr
  text: Sa moisson, l’affamé la mange ; il la prend jusque parmi les épines, et les assoiffés soupirent après leurs richesses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture possible de la dernière proposition : « et un piège engloutit leurs richesses ». Le texte hébreu est difficile ; le texte principal retient la lecture qui met « les assoiffés » en parallèle avec « l’affamé ».'
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִירוֹ
  choice: sa moisson
  rationale: קָצִיר désigne la récolte ou les produits récoltés ; « sa moisson » conserve naturellement le suffixe possessif.
- source_word: רָעֵב
  choice: l’affamé
  rationale: L’adjectif est employé comme substantif. Le singulier générique français correspond au singulier hébreu et désigne celui qui a faim.
- source_word: וְאֶל מִצִּנִּים יִקָּחֵהוּ
  choice: il vient la prendre jusque parmi les épines
  rationale: Cette formulation conserve l’image difficile d’une récolte emportée depuis un lieu épineux, sans préciser si les épines servent de protection.
- source_word: צִנִּים
  choice: épines
  rationale: Le sens courant « épines » convient le mieux à l’image agricole, malgré d’autres analyses possibles.
- source_word: וְשָׁאַף
  choice: convoitent avidement
  rationale: שָׁאַף peut évoquer le halètement, l’avidité ou l’action d’engloutir. Cette expression française transmet l’élan avide sans imposer une ingestion littérale.
- source_word: צַמִּים
  choice: les assoiffés
  rationale: Cette lecture du texte consonantique forme un parallèle naturel avec « l’affamé ». Une autre lecture, liée au piège, est signalée en note.
- source_word: חֵילָם
  choice: leurs richesses
  rationale: חַיִל peut désigner les biens, les ressources ou la richesse ; le pluriel français est naturel dans ce contexte de spoliation.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. L’ordre initial met « sa moisson » en relief, comme en hébreu. Le passage du singulier générique « l’affamé » au pluriel « les assoiffés » suit les formes du texte source ; l’antécédent de « leurs » demeure volontairement non explicité.
