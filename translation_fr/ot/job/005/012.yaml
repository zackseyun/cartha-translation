source:
  edition: WLC
  text: מֵ֭פֵר מַחְשְׁב֣וֹת עֲרוּמִ֑ים וְֽ/לֹא תַעֲשֶׂ֥ינָה יְ֝דֵי/הֶ֗ם תּוּשִׁיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/012.yaml
  text: He frustrates the schemes of the crafty, so that their hands accomplish no success.
translation:
  language: fr
  text: Il déjoue les projets des rusés, et leurs mains ne mènent rien à bonne fin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  choice: déjoue
  rationale: Le participe décrit Dieu comme celui qui fait échouer ou réduit à néant des projets; « déjoue » convient naturellement aux projets rusés.
- source_word: מַחְשְׁבוֹת
  choice: les projets
  rationale: Le terme désigne ici des plans ou desseins conçus par les personnes rusées.
- source_word: עֲרוּמִים
  choice: des gens rusés
  rationale: Dans ce contexte défavorable, le mot renvoie à des personnes habiles et calculatrices; « rusés » conserve cette nuance sans ajouter une qualification doctrinale.
- source_word: יְדֵיהֶם
  choice: leurs mains
  rationale: 'L’image concrète de l’hébreu est conservée: les mains représentent les moyens d’exécuter les projets.'
- source_word: תּוּשִׁיָּה
  choice: mener à bien leur entreprise
  rationale: Ce nom difficile peut évoquer l’efficacité, la réussite ou une action solide. Dans la construction avec « leurs mains », cette formulation exprime idiomatiquement l’impossibilité d’obtenir un résultat effectif.
theological_decisions:
- issue: Portée de l’action divine
  choice: Il déjoue
  alternative: Il anéantit
  rationale: « Déjoue » affirme clairement l’intervention de Dieu contre les projets des rusés sans préciser au-delà du texte la manière ou l’étendue de cette intervention.
- issue: Sens de תּוּשִׁיָּה
  choice: mener à bien leur entreprise
  alternative: accomplir quoi que ce soit de solide / obtenir du succès
  rationale: Le terme possède une gamme sémantique discutée. Le choix retient ici l’idée contextuelle d’une action efficace et réussie, tout en évitant de lui donner une coloration morale ou doctrinale absente du verset.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’image des mains tout en rendant la dernière proposition idiomatique.
