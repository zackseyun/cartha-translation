  text: אֲֽנִי רָ֭אִיתִי אֱוִ֣יל מַשְׁרִ֑ישׁ וָ/אֶקּ֖וֹב נָוֵ֣/הוּ פִתְאֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/003.yaml
  text: I have seen a fool taking root[a], and suddenly I cursed his dwelling.
translation:
  language: fr
  text: Moi, j’ai vu un insensé prendre racine, et soudain j’ai maudit sa demeure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’ai déclaré sa demeure maudite » ou « j’ai annoncé que sa demeure était vouée au malheur ». Le verbe hébreu peut désigner une malédiction directement prononcée ou une déclaration de jugement fondée sur un constat.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Moi, j’ai
  rationale: Le pronom indépendant est rendu par « Moi » pour conserver l’insistance portée sur le sujet, sans alourdir la phrase.
- source_word: רָאִיתִי
  choice: j’ai vu
  rationale: Le passé composé exprime naturellement en français moderne une expérience constatée par le locuteur.
- source_word: אֱוִיל
  choice: un insensé
  rationale: Dans la littérature de sagesse, le terme désigne une catégorie morale et spirituelle, non un simple manque d’intelligence. « Insensé » conserve cette portée dans un registre digne.
- source_word: מַשְׁרִישׁ
  choice: prendre racine
  rationale: Cette expression naturelle maintient la métaphore de l’enracinement et l’idée d’un établissement apparemment solide.
- source_word: וָאֶקּוֹב
  choice: j’ai maudit
  rationale: Le sens lexical direct de נקב dans cet emploi est « maudire ». La traduction conserve la force du propos sans préciser une éventuelle efficacité de la malédiction.
- source_word: נָוֵהוּ
  choice: sa demeure
  rationale: « Demeure » rend le lieu d’habitation de manière assez large, sans le réduire à la seule maison matérielle.
- source_word: פִתְאֹם
  choice: soudain
  rationale: L’adverbe final exprime la soudaineté. Son rattachement à la déclaration de malédiction suit l’ordre logique retenu par le texte de consultation tout en restant naturel en français.
theological_decisions:
- issue: 'Portée de וָאֶקּוֹב : malédiction prononcée ou constat de condamnation'
  choice: Éliphaz dit avoir lui-même maudit la demeure de l’insensé.
  alternative: Éliphaz déclare que cette demeure est maudite ou la reconnaît comme vouée au malheur.
  rationale: Le sens lexical le plus direct favorise l’acte de maudire, mais le contexte sapiential permet aussi de comprendre la parole comme un verdict constatant le sort de la demeure. Cette ambiguïté interprétative est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Insensé » conserve la catégorie morale propre à la littérature de sagesse. La syntaxe garde l’insistance du pronom hébreu et la métaphore de l’enracinement.
