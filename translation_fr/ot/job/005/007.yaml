  yaml_path: translation/ot/job/005/007.yaml
  text: For man is born for trouble[a], and the sons of flame fly upward.
translation:
  language: fr
  text: 'Car l’être humain naît pour la peine,


    et les fils de la flamme[a] s’envolent vers les hauteurs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les étincelles s’élèvent en volant ». L’hébreu dit littéralement « les fils de la flamme » — peut-être « les fils de Resheph » — ; cette expression est souvent comprise comme désignant des étincelles.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qu’Éliphaz rattache à l’affirmation précédente.
- source_word: אָדָם
  choice: l’être humain
  rationale: Le singulier a ici une valeur générique; cette formulation naturelle en français désigne l’humanité sans limiter le propos aux hommes de sexe masculin.
- source_word: לְעָמָל
  choice: pour la peine
  rationale: עָמָל recouvre la peine, le malheur et le labeur pénible. « La peine » conserve cette largeur de sens dans une maxime sur la condition humaine.
- source_word: יוּלָּד
  choice: naît
  rationale: La forme passive exprime ici une vérité générale, rendue naturellement au présent en français.
- source_word: וּבְנֵי רֶשֶׁף
  choice: et les fils de la flamme
  rationale: Cette traduction maintient l’image littérale et l’ambiguïté de רֶשֶׁף, plutôt que de la réduire d’emblée à l’interprétation traditionnelle « étincelles ».
- source_word: יַגְבִּיהוּ עוּף
  choice: s’envolent vers les hauteurs
  rationale: Les deux termes forment ensemble l’image d’un vol ascendant; cette expression la restitue clairement et sans lourdeur.
theological_decisions: []
translation_notes:
  register: Français moderne, proverbial et digne. Le parallélisme est conservé, ainsi que l’image hébraïque inhabituelle; la lecture idiomatique « étincelles » est signalée en note.
