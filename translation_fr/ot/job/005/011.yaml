source:
  edition: WLC
  text: לָ/שׂ֣וּם שְׁפָלִ֣ים לְ/מָר֑וֹם וְ֝/קֹדְרִ֗ים שָׂ֣גְבוּ יֶֽשַׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/011.yaml
  text: to set the lowly on high[b][a], and those who mourn are lifted up to salvation.
translation:
  language: fr
  text: pour placer sur les hauteurs ceux qui sont abaissés, et pour que ceux qui sont dans le deuil soient élevés vers le salut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers la délivrance » ou « vers la sécurité ». L’expression « ceux qui sont dans le deuil » peut aussi se traduire par « ceux qui sont assombris » ; le participe hébreu évoque la douleur par l’image de l’obscurité.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָשׂוּם
  choice: pour placer
  rationale: L’infinitif construit exprime ici le but ou le résultat dans le prolongement du contexte précédent. « Placer » conserve simplement le sens verbal.
- source_word: שְׁפָלִים
  choice: les petits
  rationale: L’adjectif désigne ceux qui sont bas ou de condition modeste. « Les petits » rend cette condition sans imposer une lecture exclusivement morale comme « les humbles ».
- source_word: לְמָרוֹם
  choice: en hauteur
  rationale: מָרוֹם désigne une hauteur ou un lieu élevé. Cette formulation conserve l’image spatiale qui contraste avec la basse condition des petits.
- source_word: וְקֹדְרִים
  choice: ceux qui sont dans le deuil
  rationale: Le participe de קדר peut évoquer l’assombrissement, la tristesse ou le deuil. La formulation choisie exprime naturellement la souffrance tout en laissant la note signaler l’image littérale.
- source_word: שָׂגְבוּ
  choice: soient élevés
  rationale: Le verbe exprime le fait d’être haut, hors d’atteinte ou en sécurité. « Soient élevés » respecte le parallélisme avec « placer… en hauteur » et la valeur résultative de la forme.
- source_word: יֶשַׁע
  choice: salut
  rationale: Le nom peut désigner le salut, la délivrance ou la sécurité. « Salut » préserve son ampleur lexicale sans limiter ici le terme à un sens doctrinal ultérieur.
theological_decisions:
- issue: Sens de יֶשַׁע dans un contexte de sagesse
  choice: salut
  alternative: délivrance ou sécurité
  rationale: Le terme hébreu couvre le secours, la délivrance et la mise en sécurité. « Salut » maintient cette ampleur et sa résonance théologique, tandis que le contexte immédiat évoque concrètement le relèvement de personnes éprouvées.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme d’élévation est conservé, ainsi que l’ambiguïté entre deuil et assombrissement et entre salut, délivrance et sécurité.
