  text: הִנֵּ֤ה אַשְׁרֵ֣י אֱ֭נוֹשׁ יוֹכִחֶ֣/נּֽוּ אֱל֑וֹהַּ וּ/מוּסַ֥ר שַׁ֝דַּ֗י אַל תִּמְאָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/017.yaml
  text: Behold[a], blessed is the man whom God reproves[e][d][c][b]; therefore do not despise the discipline of the Almighty.
translation:
  language: fr
  text: 'Voici[a] : heureux est l’être humain[b] que Dieu reprend[c] ! Ne méprise pas la discipline[d] du Tout-Puissant[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La particule hébraïque attire fortement l’attention sur l’affirmation qui suit; ou « Regardez ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le mortel »; le terme hébreu désigne ici l’être humain de manière générique, avec une possible nuance de fragilité.
    reason: lexical_alternative
  - marker: c
    text: Ou « corrige » ou « réprimande ».
    reason: lexical_alternative
  - marker: d
    text: Ou « instruction », « correction » ou « châtiment formateur ».
    reason: lexical_alternative
  - marker: e
    text: Hébreu « Shaddaï », titre divin traditionnellement rendu par « le Tout-Puissant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Oui
  rationale: Dans cette maxime, la particule attire l’attention et souligne solennellement l’affirmation. « Oui » rend naturellement cette force discursive en français moderne; le sens plus concret « Voici » est signalé en note.
- source_word: אַשְׁרֵי
  choice: heureux
  rationale: La formule de béatitude décrit une condition enviable et favorable, non une simple émotion passagère. « Heureux » est la formulation française consacrée et reste naturelle.
- source_word: אֱנוֹשׁ
  choice: l’être humain
  rationale: Le nom désigne ici un humain mortel de manière générique. « L’être humain » conserve cette portée universelle sans limiter la maxime aux hommes de sexe masculin.
- source_word: יוֹכִיחֶנּוּ
  choice: que Dieu reprend
  rationale: Le hiphil de יכח exprime ici une réprimande à visée corrective. « Reprendre » préserve à la fois la désapprobation et l’intention de corriger.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Équivalent français normal de ce titre divin, particulièrement fréquent dans Job.
- source_word: מוּסַר
  choice: discipline
  rationale: Dans la littérature de sagesse, le terme couvre la formation et la correction. « Discipline » garde ensemble ses dimensions pédagogique et corrective.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Traduction française traditionnelle et intelligible du titre divin Shaddaï.
- source_word: אַל תִּמְאָס
  choice: Ne méprise donc pas
  rationale: Le verbe évoque le rejet dédaigneux. « Ne méprise pas » en conserve la force morale; « donc » explicite le lien logique entre la béatitude affirmée et l’exhortation qui suit.
theological_decisions:
- issue: Portée générique de אֱנוֹשׁ
  choice: l’être humain
  alternative: l’homme; le mortel
  rationale: La maxime concerne tout humain soumis à la correction divine. Cette formulation préserve la portée générique et la nuance d’humanité, tandis que « mortel » mettrait davantage en relief la fragilité.
- issue: Rapport entre la réprimande divine et מוּסַר
  choice: reprend… discipline
  alternative: corrige… instruction; réprimande… correction
  rationale: Le texte présente paradoxalement comme heureux celui qui subit la correction de Dieu. Le choix conserve cette tension et n’impose ni une lecture purement punitive ni une lecture seulement pédagogique.
- issue: Valeur du waw devant מוּסַר
  choice: donc
  alternative: et
  rationale: La coordination hébraïque permet de comprendre la seconde proposition comme la conséquence pratique de la première. « Donc » rend ce rapport naturellement, tandis que la note reconnaît la coordination plus formelle.
translation_notes:
  register: Français moderne, clair et digne, avec la cadence brève d’une maxime de sagesse. La tournure de béatitude « heureux… » est conservée. Le générique « l’être humain » évite l’ambiguïté contemporaine de « l’homme » sans effacer la notion hébraïque d’humanité mortelle.
