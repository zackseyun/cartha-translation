  text: יִרְחֲק֣וּ בָנָ֣י/ו מִ/יֶּ֑שַׁע וְ/יִֽדַּכְּא֥וּ בַ֝/שַּׁ֗עַר וְ/אֵ֣ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/004.yaml
  text: His children are far from safety[a], and they are crushed in the gate[b], with no one to rescue them.
translation:
  language: fr
  text: Ses enfants sont loin de la délivrance[a] ; ils sont écrasés à la porte de la ville[b], sans personne pour les secourir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « loin du salut » ou « loin de la sécurité ».
    reason: lexical_alternative
  - marker: b
    text: La porte de la ville était habituellement le lieu où l’on rendait la justice et prenait les décisions publiques.
    reason: cultural_note
lexical_decisions:
- source_word: יִרְחֲקוּ
  choice: sont loin
  rationale: Le verbe רחק exprime l’éloignement. La tournure française décrit naturellement la situation des enfants par rapport à la délivrance.
- source_word: בָנָיו
  choice: ses enfants
  rationale: בנים peut désigner les fils ou, plus largement, les enfants. Ici, « enfants » convient au propos général sur la descendance sans imposer une précision de sexe.
- source_word: מִיֶּשַׁע
  choice: de toute délivrance
  rationale: יֶשַׁע peut signifier salut, délivrance ou sécurité. Dans ce contexte de détresse concrète, « délivrance » conserve le motif du secours, repris dans la dernière proposition. « Toute » rend idiomatiquement en français l’idée d’une délivrance devenue inaccessible sans ajouter une nouvelle catégorie sémantique.
- source_word: וְיִדַּכְּאוּ
  choice: ils sont écrasés
  rationale: דכא évoque le fait d’être écrasé, brisé ou opprimé. « Sont écrasés » préserve la vigueur et la valeur passive de la forme hébraïque.
- source_word: בַשַּׁעַר
  choice: à la porte de la ville
  rationale: La porte était le lieu habituel des jugements et des décisions publiques. En français, « à la porte de la ville » restitue naturellement le cadre concret, tandis qu’une note en explique la portée institutionnelle.
- source_word: וְאֵין מַצִּיל
  choice: sans personne pour les secourir
  rationale: La construction אֵין avec le participe de נצל signifie qu’il n’existe personne qui délivre. Cette formulation française est naturelle et maintient le lien avec la délivrance évoquée au début du verset.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de l’image hébraïque tout en explicitant « la porte » comme porte de la ville ; la note en précise la fonction judiciaire. Les marqueurs suivent les éléments qu’ils expliquent.
