id: JOB.5.15
reference: Job 5:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣שַׁע מֵ֭/חֶרֶב מִ/פִּי/הֶ֑ם וּ/מִ/יַּ֖ד חָזָ֣ק אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/015.yaml
  text: But he saves the needy from the sword of their mouth[a], and from the hand of the strong.
translation:
  language: fr
  text: Mais il sauve le pauvre de l’épée de leur bouche[a] et de la main du puissant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il délivre le pauvre de l’épée, de leur bouche et de la main du puissant ». La formulation hébraïque est condensée ; on peut rattacher « de leur bouche » à « l’épée » ou le comprendre comme un complément distinct.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּשַׁע
  choice: il sauve
  rationale: Le verbe ישׁע exprime ici la délivrance, avec Dieu comme sujet implicite. Bien que la forme puisse avoir une valeur passée, le présent convient à la portée générale et poétique des paroles d’Éliphaz.
- source_word: מֵחֶרֶב
  choice: de l’épée
  rationale: Le nom חֶרֶב désigne l’épée, et la préposition מִן indique ce dont le pauvre est sauvé. L’article français convient à l’image définie par la suite du syntagme.
- source_word: מִפִּיהֶם
  choice: de leur bouche
  rationale: Littéralement « de leur bouche ». Rattaché à « épée », le syntagme forme l’image condensée de « l’épée de leur bouche », c’est-à-dire une parole destructrice, sans expliciter davantage la métaphore.
- source_word: וּמִיַּד
  choice: et de la main du
  rationale: יָד signifie littéralement « main » et peut évoquer le pouvoir. Garder « main » préserve l’image concrète du texte.
- source_word: חָזָק
  choice: puissant
  rationale: L’adjectif substantivé désigne une personne forte ou puissante. Le singulier « du puissant » suit la forme hébraïque et marque le contraste avec le pauvre.
- source_word: אֶבְיוֹן
  choice: le pauvre
  rationale: אֶבְיוֹן désigne une personne pauvre et démunie. « Le pauvre » est naturel en français biblique moderne et conserve la dimension sociale de la vulnérabilité.
theological_decisions:
- issue: Valeur métaphorique de « l’épée de leur bouche »
  choice: Conserver la métaphore comme image d’une parole destructrice.
  alternative: 'Traduire séparément : « de l’épée, de leur bouche » ou expliciter par « de leurs paroles meurtrières ».'
  rationale: La juxtaposition hébraïque associe vivement l’épée et la bouche. La conserver respecte la force poétique et évite de préciser indûment la nature des paroles.
translation_notes:
  register: Français moderne, naturel et digne. La syntaxe concise et les images concrètes de l’hébreu sont conservées. « Le pauvre » et « le puissant » rendent le contraste social sans ajout confessionnel.
