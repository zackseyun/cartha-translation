source:
  edition: WLC
  text: בְּ/שׁ֣וֹט לָ֭שׁוֹן תֵּחָבֵ֑א וְֽ/לֹא תִירָ֥א מִ֝/שֹּׁ֗ד כִּ֣י יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/021.yaml
  text: You will be hidden from the lash of the tongue[b][a], and you will not fear destruction when it comes.
translation:
  language: fr
  text: 'Tu seras à l’abri du fouet de la langue[a],

    et tu ne craindras pas la destruction[b] quand elle viendra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du fouet de la langue » ; image désignant des paroles blessantes ou calomnieuses.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la dévastation » ou « la ruine ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹט לָשׁוֹן
  choice: du fouet de la langue
  rationale: L’expression conserve l’image hébraïque vive du fouet appliquée à la langue, c’est-à-dire à une parole qui attaque, outrage ou calomnie.
- source_word: תֵּחָבֵא
  choice: tu seras à l’abri
  rationale: Le nifal de חבא signifie littéralement « être caché ». En français, « être à l’abri de » rend naturellement l’idée de protection exigée ici par le contexte, sans préciser indûment comment elle s’exerce.
- source_word: וְלֹא תִירָא
  choice: et tu ne craindras pas
  rationale: Cette formulation garde la valeur d’assurance du verbe hébreu à l’inaccompli avec négation.
- source_word: מִשֹּׁד
  choice: la destruction
  rationale: שֹׁד désigne une destruction violente, une dévastation ou une ruine. « Destruction » reste clair et suffisamment large.
- source_word: כִּי יָבוֹא
  choice: quand elle viendra
  rationale: כִּי est compris ici dans son sens temporel. Le pronom féminin reprend naturellement « la destruction » en français.
theological_decisions: []
