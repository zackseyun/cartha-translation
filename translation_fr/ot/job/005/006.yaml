  text: כִּ֤י לֹא יֵצֵ֣א מֵ/עָפָ֣ר אָ֑וֶן וּ֝/מֵ/אֲדָמָ֗ה לֹא יִצְמַ֥ח עָמָֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/006.yaml
  text: For trouble does not come from the dust[a], nor does toil sprout from the ground.
translation:
  language: fr
  text: Car le malheur ne sort pas de la poussière[a], et la peine ne germe pas du sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car l’iniquité ne sort pas de la poussière, et la misère ne germe pas du sol. » Les termes hébreux peuvent aussi avoir un sens moral ou désigner la calamité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve naturellement le lien argumentatif.
- source_word: יֵצֵא
  choice: ne sort pas
  rationale: Reflète le sens concret de יצא, « sortir », dans l’image d’une chose qui proviendrait de la poussière.
- source_word: מֵעָפָר
  choice: de la poussière
  rationale: עָפָר désigne couramment la poussière; l’article donne ici une formulation française naturelle.
- source_word: אָוֶן
  choice: le malheur
  rationale: Dans ce contexte de souffrance, le mot peut désigner le malheur ou l’adversité, sans exclure ses connotations possibles de mal moral; l’ambiguïté est signalée en note.
- source_word: וּמֵאֲדָמָה
  choice: et ... du sol
  rationale: אֲדָמָה désigne le sol ou la terre; « sol » maintient l’image agricole et le parallélisme avec la poussière.
- source_word: יִצְמַח
  choice: ne germe pas
  rationale: Le verbe צמח évoque la croissance végétale; « germer » préserve nettement la métaphore.
- source_word: עָמָל
  choice: la peine
  rationale: עָמָל peut désigner le labeur pénible, la peine ou la misère. « Peine » convient au parallélisme avec « malheur » tout en gardant l’idée de souffrance éprouvée.
theological_decisions:
- issue: Portée sémantique de אָוֶן et עָמָל dans la déclaration d’Éliphaz
  choice: Le verset évoque le malheur et la peine qui ne naissent pas spontanément de la terre.
  alternative: Le verset pourrait évoquer l’iniquité et la misère, avec une portée morale plus marquée.
  rationale: Le contexte concerne l’affliction humaine. La traduction principale conserve l’image agricole et n’impose pas une doctrine plus précise de la causalité morale que ne le fait le texte; la note préserve les autres valeurs lexicales possibles.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique et la métaphore agricole sont conservés; « et » rend la coordination hébraïque, la négation répétée exprimant naturellement en français la valeur de « ni ».
