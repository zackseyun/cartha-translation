id: JOB.5.8
reference: Job 5:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אוּלָ֗ם אֲ֭נִי אֶדְרֹ֣שׁ אֶל אֵ֑ל וְ/אֶל אֱ֝לֹהִ֗ים אָשִׂ֥ים דִּבְרָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/008.yaml
  text: But as for me[a], I would seek God, and to God I would present my case.
translation:
  language: fr
  text: Mais moi, je chercherais Dieu, et c’est à Dieu que je soumettrais ma cause.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלָם אֲנִי
  choice: Mais moi
  rationale: L’adversatif אוּלָם et le pronom indépendant emphatique אֲנִי marquent ensemble un contraste. « Mais moi » le restitue avec naturel et concision en français.
- source_word: אֶדְרֹשׁ
  choice: je chercherais
  rationale: Dans ce conseil d’Éliphaz, le verbe דרשׁ exprime le fait de se tourner vers Dieu pour le rechercher ou faire appel à lui. Le conditionnel rend la valeur de conseil implicite sans réduire le verbe à une simple demande de renseignements.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל désigne ici Dieu sans qu’il soit nécessaire d’ajouter une qualification telle que « puissant » ou « Tout-Puissant ».
- source_word: וְאֶל אֱלֹהִים
  choice: et c’est à Dieu que
  rationale: La reprise de « Dieu » conserve le parallélisme synonymique entre אֵל et אֱלֹהִים. La tournure clivée rend en français la direction explicitement marquée par אֶל.
- source_word: אָשִׂים
  choice: je soumettrais
  rationale: שׂים signifie littéralement « placer » ou « poser » ; avec דִּבְרָתִי, « soumettre » exprime naturellement l’action de présenter une affaire à Dieu.
- source_word: דִּבְרָתִי
  choice: ma cause
  rationale: Le terme peut désigner une parole, une affaire ou une cause. « Ma cause » préserve ici la nuance de recours ou de plaidoyer sans imposer le sens plus étroit de « plainte ».
theological_decisions:
- issue: Rendu parallèle des désignations divines אֵל et אֱלֹהִים
  choice: Traduire les deux par « Dieu »
  alternative: Distinguer « El » de « Dieu », ou rendre אֵל par « Dieu puissant »
  rationale: Les deux termes ont le même référent dans un parallélisme poétique. Les différencier artificiellement pourrait suggérer une distinction théologique que l’hébreu n’exige pas.
translation_notes:
  register: Français international moderne, digne et accessible. Le conditionnel convient au conseil hypothétique d’Éliphaz. « Soumettre ma cause » garde la coloration judiciaire ou pétitionnaire du second membre sans la suraccentuer.
