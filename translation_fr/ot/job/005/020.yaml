source:
  edition: WLC
  text: בְּ֭/רָעָב פָּֽדְ/ךָ֣ מִ/מָּ֑וֶת וּ֝/בְ/מִלְחָמָ֗ה מִ֣/ידֵי חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/020.yaml
  text: In famine he will redeem you from death[b][a], and in war from the power of the sword.
translation:
  language: fr
  text: Pendant la famine, il te rachètera[a] de la mort, et pendant la guerre, du pouvoir de l’épée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te libérera » ou « te délivrera ». Le verbe hébreu exprime l’idée de rachat, de libération ou de délivrance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « des mains de l’épée », expression qui signifie ici « du pouvoir de l’épée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָעָב
  choice: Pendant la famine
  rationale: רָעָב peut désigner la faim ou la famine. Ici, dans une série de calamités, « famine » exprime le fléau collectif, et בְּ indique la circonstance temporelle.
- source_word: פָּדְךָ
  choice: il te rachètera
  rationale: Le verbe פדה signifie racheter, libérer ou délivrer. « Rachètera » conserve l’idée forte d’une libération obtenue sans imposer ici une interprétation doctrinale plus développée.
- source_word: מִמָּוֶת
  choice: de la mort
  rationale: La préposition מִן exprime l’éloignement ou la délivrance hors d’un danger; le substantif מָוֶת est rendu directement par « la mort ».
- source_word: וּבְמִלְחָמָה
  choice: et pendant la guerre
  rationale: מִלְחָמָה désigne la guerre ou le combat. « Pendant la guerre » forme un parallèle naturel avec « Pendant la famine ».
- source_word: מִידֵי
  choice: du pouvoir de
  rationale: L’expression littérale « des mains de » est un idiome désignant le pouvoir ou l’emprise. Avec « l’épée », « du pouvoir de » rend clairement son sens en français.
- source_word: חָרֶב
  choice: l’épée
  rationale: חָרֶב est le terme courant pour l’épée et représente ici, par métonymie, la violence meurtrière de la guerre.
theological_decisions:
- issue: Sens de פדה dans un contexte sapientiel
  choice: rachètera
  alternative: délivrera; libérera
  rationale: Le verset évoque une délivrance temporelle face à la mort. « Rachètera » préserve la force lexicale de פדה, mais le texte ne précise ni prix de rançon ni doctrine plus complète de la rédemption.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébreu est conservé; l’ellipse verbale du second membre demeure naturelle en français. Les notes maintiennent les principales possibilités lexicales et l’image littérale de l’hébreu.
