  text: בְּ/שֵׁ֣שׁ צָ֭רוֹת יַצִּילֶ֑/ךָּ וּ/בְ/שֶׁ֓בַע לֹא יִגַּ֖ע בְּ/ךָ֣ רָֽע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/019.yaml
  text: In six troubles he will deliver you[a]; even in seven[b], no evil will touch you.
translation:
  language: fr
  text: Il te délivrera de six détresses ; même dans sept, aucun mal ne t’atteindra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formule poétique hébraïque « six… sept » exprime une délivrance répétée ou complète, sans nécessairement fixer une limite littérale à sept détresses. Ou « aucun malheur ne te touchera » ou « aucun désastre ne t’atteindra ».
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: בְּשֵׁשׁ
  choice: Dans six
  rationale: La préposition ב avec le nombre introduit ici les circonstances dénombrées. « Dans six » conserve la forme du parallélisme numérique hébreu.
- source_word: צָרוֹת
  choice: détresses
  rationale: Le terme désigne des situations de détresse, d’adversité ou d’affliction. « Détresses » garde cette portée générale et convient au registre poétique.
- source_word: יַצִּילֶךָּ
  choice: il te délivrera
  rationale: Le hifil de נצל signifie couramment « délivrer, arracher au danger ». « Délivrera » préserve à la fois le sens de secours et la dignité du style.
- source_word: וּבְשֶׁבַע
  choice: même dans sept
  rationale: La tournure « six… sept » forme un parallélisme numérique croissant. « Même dans sept » fait entendre la progression sans effacer les nombres du texte.
- source_word: לֹא יִגַּע בְּךָ
  choice: ne t’atteindra
  rationale: נגע peut signifier « toucher », « atteindre » ou « frapper ». Avec un mal pour sujet, « atteindre » est naturel en français et conserve l’idée qu’il ne parviendra pas jusqu’à la personne.
- source_word: רָע
  choice: aucun mal
  rationale: רָע peut désigner le mal, le dommage ou le malheur. « Aucun mal » en maintient la largeur sémantique, tandis que le contexte évoque surtout ce qui cause du tort.
theological_decisions:
- issue: Référent du sujet implicite de « il te délivrera »
  choice: Maintenir le pronom « il »
  alternative: « Dieu te délivrera »
  rationale: Le contexte identifie Dieu comme référent, mais le verset hébreu ne nomme pas explicitement le sujet. Le pronom respecte cette forme sans ajout interprétatif.
- issue: Sens de la formule numérique « six… sept »
  choice: Conserver les nombres tout en marquant la progression par « même »
  alternative: Comprendre les nombres comme une limite strictement littérale de sept détresses
  rationale: Cette formule poétique exprime une délivrance répétée ou complète. La traduction préserve néanmoins l’image numérique et sa tension poétique.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme numérique et le sujet pronominal de l’hébreu sont conservés, tandis que « ne t’atteindra » offre une formulation française naturelle.
