id: JOB.5.24
reference: Job 5:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְֽ֭/יָדַעְתָּ כִּי שָׁל֣וֹם אָהֳלֶ֑/ךָ וּֽ/פָקַדְתָּ֥ נָ֝וְ/ךָ וְ/לֹ֣א תֶחֱטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/024.yaml
  text: You will know that your tent is at peace[a], and when you inspect your dwelling, you will not miss anything.
translation:
  language: fr
  text: Tu sauras que ta tente est en paix ; tu inspecteras ta demeure et tu ne trouveras rien qui manque.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu ne pécheras pas ». Le verbe hébreu signifie couramment « pécher », mais il peut aussi signifier « manquer » ou « rater » ; dans ce contexte, il évoque probablement le fait de ne rien trouver qui manque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Tu sauras
  rationale: Le parfait qal précédé de la conjonction a ici une valeur future dans la suite des promesses. La conjonction n’a pas besoin d’être rendue explicitement en français.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce qui sera connu.
- source_word: שָׁלוֹם
  choice: en paix
  rationale: Cette expression conserve le sens large de paix, de sécurité et de bien-être porté par שָׁלוֹם sans le réduire à la seule sécurité matérielle.
- source_word: אָהֳלֶךָ
  choice: ta tente
  rationale: La traduction littérale préserve l’image et le cadre ancien, tout en désignant implicitement le foyer.
- source_word: וּפָקַדְתָּ
  choice: tu inspecteras
  rationale: פקד peut signifier visiter, s’occuper de ou examiner. Dans ce contexte, l’examen de la demeure avant le constat que rien ne manque est le sens le plus naturel.
- source_word: נָוְךָ
  choice: ta demeure
  rationale: נָוֶה peut désigner une habitation ou un lieu de séjour, parfois un pâturage. Le parallélisme avec « ta tente » favorise ici « ta demeure ».
- source_word: וְלֹא תֶחֱטָא
  choice: tu ne trouveras rien qui manque
  rationale: חטא signifie couramment « pécher », mais peut aussi exprimer le fait de manquer ou de rater. Après l’inspection de la demeure, cette formulation française rend naturellement le constat que rien n’y manque, tout en signalant l’autre lecture en note.
theological_decisions:
- issue: Sens de וְלֹא תֶחֱטָא dans le contexte
  choice: 'Sens non moral : « tu ne trouveras rien qui manque »'
  alternative: « tu ne pécheras pas »
  rationale: Le verset décrit la paix et l’intégrité du foyer. L’enchaînement avec l’inspection de la demeure favorise l’idée qu’aucun bien ni aucun membre du foyer ne manque. Comme la lecture morale reste lexicalement possible, elle est conservée en note plutôt qu’effacée.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier correspond à la deuxième personne masculine singulière de l’hébreu. Le point-virgule respecte la progression poétique sans surcharger la phrase.
