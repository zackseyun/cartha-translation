  text: הִנֵּה זֹ֭את חֲקַרְנ֥וּ/הָ כֶּֽן הִ֑יא שְׁ֝מָעֶ֗/נָּה וְ/אַתָּ֥ה דַֽע לָֽ/ךְ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/005/027.yaml
  text: Look, this is what we have searched out; it is so. Hear it, and you, know it for yourself.
translation:
  language: fr
  text: 'Voici ce que nous avons examiné : c’est bien ainsi. Écoute cela, et toi, sache-le pour toi-même.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲקַרְנוּהָ
  choice: nous avons examiné
  rationale: Le verbe חקר exprime une recherche ou un examen approfondi. « Examiner » restitue cette idée dans un français naturel sans ajouter un objet absent du texte.
- source_word: כֶּן הִיא
  choice: c’est bien ainsi
  rationale: Cette formulation conserve l’affirmation emphatique selon laquelle le résultat de l’examen est exact.
- source_word: שְׁמָעֶנָּה
  choice: Écoute cela
  rationale: Le verbe שׁמע signifie ici écouter ou prêter attention. « Cela » reprend naturellement en français le contenu qui vient d’être exposé.
- source_word: דַע לָךְ
  choice: sache-le pour toi-même
  rationale: Cette traduction maintient le sens fondamental de ידע, « savoir », ainsi que la nuance personnelle du datif לָךְ, sans la réduire à une simple invitation à comprendre.
theological_decisions:
- issue: Portée de l’affirmation d’Élifaz
  choice: 'Conserver l’assurance catégorique d’Élifaz : « c’est bien ainsi »'
  alternative: Atténuer en « cela semble exact »
  rationale: Le texte hébreu présente la conclusion comme certaine. La traduction préserve cette force tout en laissant le contexte global du livre évaluer les propos d’Élifaz.
translation_notes:
  register: Français moderne, digne et direct. La reprise emphatique « et toi » conserve l’insistance inhabituelle de וְאַתָּה, tandis que « pour toi-même » maintient la nuance personnelle de לָךְ.
