  text: וְ֭/הוֹחַלְתִּי כִּי לֹ֣א יְדַבֵּ֑רוּ כִּ֥י עָ֝מְד֗וּ לֹא עָ֥נוּ עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/016.yaml
  text: And I waited[a], because they did not speak[b], because they stood still and answered no more.
translation:
  language: fr
  text: 'J’ai attendu[a], car ils ne parlaient pas : ils étaient restés là[b], sans plus répondre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « J’ai espéré » : le verbe peut désigner une attente confiante ; ici, le contexte favorise « attendu ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ils se tinrent » ou « ils restèrent debout » ; dans ce contexte, l’expression suggère probablement qu’ils avaient cessé de parler.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹחַלְתִּי
  choice: J’ai attendu
  rationale: 'Le hiphil accompli à la 1re personne du singulier de יחל peut exprimer l’attente accompagnée d’espoir. Ici, Élihou retarde sa prise de parole tandis que les autres se taisent : « attendu » convient le mieux au contexte. La coordination initiale n’a pas besoin d’être explicitée en français après le verset précédent.'
- source_word: כִּי לֹא יְדַבֵּרוּ
  choice: puisqu’ils ne parlaient pas
  rationale: כִּי introduit la raison de l’attente. L’imparfait français rend naturellement l’action en cours dans ce contexte passé.
- source_word: כִּי עָמְדוּ
  choice: puisqu’ils s’étaient arrêtés
  rationale: עָמְדוּ signifie littéralement « ils se sont tenus/ils se sont arrêtés ». Dans ce contexte, il s’agit de leur arrêt dans l’échange; le plus-que-parfait explicite l’état déjà atteint sans ajouter l’idée physique de rester debout.
- source_word: לֹא עָנוּ עוֹד
  choice: et ne répondaient plus
  rationale: ענה avec עוד nié indique la cessation des réponses. « Ne répondaient plus » est naturel en français et conserve cette valeur aspectuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de כִּי est conservée par « puisqu’ils… puisqu’ils… », tandis que les temps verbaux français clarifient la succession contextuelle sans supprimer l’ambiguïté lexicale signalée en notes.
