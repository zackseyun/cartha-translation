source:
  edition: WLC
  text: כִּ֤י לֹ֣א יָדַ֣עְתִּי אֲכַנֶּ֑ה כִּ֝/מְעַ֗ט יִשָּׂאֵ֥/נִי עֹשֵֽׂ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/022.yaml
  text: For I do not know how to flatter[b][a]; otherwise my Maker would soon carry me away.
translation:
  language: fr
  text: Car je ne sais pas flatter[a] ; sinon, mon Créateur m’enlèverait bientôt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « donner des titres flatteurs ». Le verbe hébreu peut désigner le fait de s’adresser à quelqu’un en employant des titres honorifiques de manière flatteuse ou partiale.
    reason: lexical_alternative
  - marker: b
    text: Ou « me retirerait bientôt ». L’hébreu ne dit pas explicitement « me ferait mourir », même si un retrait sous le jugement peut être sous-entendu.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison pour laquelle Élihou refuse, dans le contexte précédent, de faire preuve de partialité.
- source_word: לֹא יָדַעְתִּי
  choice: je ne sais pas
  rationale: Avec le verbe qui suit, l’expression indique ici une incapacité ou l’absence d’une pratique maîtrisée ; le présent convient au contexte.
- source_word: אֲכַנֶּה
  choice: flatter
  rationale: Le verbe peut désigner le fait d’attribuer des titres ou de s’adresser à quelqu’un de manière flatteuse et partiale. « Flatter » exprime naturellement cette valeur négative en français moderne.
- source_word: כִּמְעַט
  choice: bientôt
  rationale: Dans cet avertissement, l’expression marque une conséquence imminente plutôt qu’une simple approximation.
- source_word: יִשָּׂאֵנִי
  choice: m’emporterait
  rationale: נשא peut signifier lever, porter ou emporter. « M’emporterait » conserve l’idée d’un retrait sous le jugement divin sans préciser explicitement qu’il s’agit de la mort.
- source_word: עֹשֵׂנִי
  choice: celui qui m’a fait
  rationale: Rend directement et clairement le participe « celui qui me fait/m’a fait », tout en préservant la relation personnelle entre la créature et son Créateur.
theological_decisions:
- issue: Nature de l’action divine menaçante
  choice: celui qui m’a fait m’emporterait bientôt
  alternative: mon Créateur me ferait bientôt mourir
  rationale: Le verbe נשא n’affirme pas explicitement la mise à mort, même si un jugement pouvant conduire à la mort est possible. La formulation retenue préserve cette indétermination.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « celui qui m’a fait » est plus immédiatement intelligible que « mon Auteur » et plus proche de la forme participiale hébraïque. Les deux marqueurs de note figurent dans le texte au point précis qu’ils éclairent.
