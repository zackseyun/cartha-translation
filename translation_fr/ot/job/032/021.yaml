  text: אַל נָ֭א אֶשָּׂ֣א פְנֵי אִ֑ישׁ וְ/אֶל אָ֝דָ֗ם לֹ֣א אֲכַנֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/021.yaml
  text: Please[a], let me not show partiality to any man[b], nor flatter any person.
translation:
  language: fr
  text: Je vous en prie, que je ne fasse preuve de partialité envers qui que ce soit[a], et que je ne donne à personne de titre flatteur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que je ne relève le visage d’aucun homme », expression hébraïque qui signifie favoriser quelqu’un ou faire preuve de partialité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que je ne flatte personne ». Le verbe hébreu peut évoquer l’emploi de noms ou de titres destinés à honorer ou à flatter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: Que je ne fasse, je vous prie
  rationale: אַל exprime ici une volonté négative ou une demande, tandis que נָא en marque l’insistance courtoise. Cette tournure française conserve le ton pressant d’Élihou sans transformer ses paroles en ordre adressé à autrui.
- source_word: אֶשָּׂא פְנֵי אִישׁ
  choice: faire preuve de partialité envers qui que ce soit
  rationale: L’expression littérale « relever le visage d’un homme » est un idiome hébreu signifiant favoriser quelqu’un ou faire preuve de partialité. « Qui que ce soit » rend naturellement en français la portée générale de l’indéfini אִישׁ.
- source_word: וְאֶל אָדָם
  choice: et ... à personne
  rationale: אָדָם désigne ici un être humain en parallèle avec אִישׁ. « À personne », dans cette phrase négative, en restitue la portée générale sans répétition lourde.
- source_word: לֹא אֲכַנֶּה
  choice: que je ne donne ... de titre flatteur
  rationale: Le piel de כנה peut désigner le fait d’appeler quelqu’un par un nom ou un titre honorifique et flatteur. La formulation retenue conserve cette nuance plus précise au lieu de la réduire simplement à « flatter ».
