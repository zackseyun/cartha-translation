translation_notes:
  register: Français moderne, digne et oralement naturel. La construction volitive maintient le caractère solennel de la déclaration d’Élihou, tandis que « qui que ce soit » et « personne » rendent explicitement la portée humaine générale des deux termes hébreux parallèles.
