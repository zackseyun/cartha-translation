  text: כִּ֭י מָלֵ֣תִי מִלִּ֑ים הֱ֝צִיקַ֗תְ/נִי ר֣וּחַ בִּטְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/018.yaml
  text: For I am full of words[a]; the spirit within me constrains me.
translation:
  language: fr
  text: Car je suis plein de paroles ; l’esprit en moi[a] me presse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’esprit de mon ventre » ; ou, selon le sens de l’expression, « l’esprit dans mes entrailles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication donnée par Élihou pour justifier sa prise de parole et conserve naturellement la valeur causale du terme hébreu.
- source_word: מָלֵתִי מִלִּים
  choice: je suis plein de paroles
  rationale: Rend directement l’état présent exprimé par מלא et conserve l’image de paroles accumulées qui cherchent à sortir.
- source_word: הֱצִיקַתְנִי
  choice: me presse
  rationale: Le verbe צוק évoque une pression ou une contrainte. « Me presse » maintient l’image d’une pression intérieure tout en exprimant l’urgence de parler.
- source_word: רוּחַ
  choice: l’esprit
  rationale: Dans ce contexte, רוּחַ désigne l’élan intérieur ou le principe qui anime Élihou, plutôt que le vent au sens concret.
- source_word: בִּטְנִי
  choice: qui est au-dedans de moi
  rationale: בטן, littéralement le ventre, désigne ici le siège intérieur des pensées et des émotions. Cette formulation est claire en français moderne, tandis que l’image corporelle est signalée en note.
theological_decisions:
- issue: Nature de רוּחַ
  choice: l’esprit
  alternative: le souffle
  rationale: Le contexte permet de comprendre le terme comme l’impulsion intérieure d’Élihou. « L’esprit » préserve toutefois l’ambiguïté anthropologique du mot sans préciser qu’il s’agirait explicitement de l’Esprit de Dieu.
translation_notes:
  register: Français moderne, naturel et digne. La proposition reste concise et conserve le parallélisme ainsi que l’image d’une pression intérieure. Le point-virgule reproduit l’articulation poétique entre l’abondance des paroles et la contrainte ressentie.
