  text: פֶּן תֹּ֣֭אמְרוּ מָצָ֣אנוּ חָכְמָ֑ה אֵ֖ל יִדְּפֶ֣/נּוּ לֹא אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/013.yaml
  text: Lest you say[a], ‘We have found wisdom; God will vanquish him, not man.’
translation:
  language: fr
  text: 'De peur que vous ne disiez : « Nous avons trouvé la sagesse : Dieu le repoussera[a], non un être humain. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dieu lui répondra, non un être humain », ou « Dieu le soumettra, non un être humain ». Le verbe hébreu signifie habituellement « chasser », « repousser » ou « disperser », mais il peut ici évoquer plus largement le fait de vaincre ou de réfuter Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן תֹּאמְרוּ
  choice: Ne dites pas
  rationale: פֶּן introduit ici une mise en garde contre une conclusion possible. L’impératif négatif français exprime naturellement cette valeur sans la tournure plus lourde « de peur que vous ne disiez ».
- source_word: מָצָאנוּ חָכְמָה
  choice: Nous avons trouvé la sagesse
  rationale: Le passé composé rend le parfait comme un résultat dont les interlocuteurs prétendraient disposer ; « sagesse » conserve le terme central sans le paraphraser.
- source_word: אֵל
  choice: Dieu
  rationale: Dans ce contraste avec אִישׁ, le nom désigne clairement Dieu.
- source_word: יִדְּפֶנּוּ
  choice: le mettra en déroute
  rationale: Le verbe נדף évoque le fait de chasser ou disperser. « Mettre en déroute » conserve l’image d’un adversaire repoussé tout en convenant au contexte, où il peut s’agir de vaincre ou réfuter Job.
- source_word: לֹא אִישׁ
  choice: et non un être humain
  rationale: אִישׁ désigne ici l’agent humain générique opposé à Dieu. « Un être humain » évite de limiter indûment le sens à un homme de sexe masculin.
theological_decisions:
- issue: Portée de אֵל יִדְּפֶנּוּ לֹא אִישׁ
  choice: Dieu le mettra en déroute, et non un être humain
  alternative: Dieu lui répondra, et non un être humain ; Dieu le soumettra, et non un être humain
  rationale: Le sens concret du verbe est maintenu dans le texte, sans trancher silencieusement la question de savoir si, dans ce contexte, l’action consiste plus précisément à vaincre, soumettre ou réfuter Job. Les autres lectures plausibles sont signalées en note.
- issue: Sens générique de אִישׁ dans le contraste avec Dieu
  choice: un être humain
  alternative: un homme
  rationale: Le contraste porte sur l’action divine par opposition à l’action humaine, non sur le sexe de l’agent.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation directe « Ne dites pas » rend naturellement la mise en garde ; « mettre en déroute » préserve l’image concrète du verbe hébreu, tandis que la note maintient l’ambiguïté contextuelle.
