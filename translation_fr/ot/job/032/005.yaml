  yaml_path: translation/ot/job/032/005.yaml
  text: When Elihu saw that there was no answer in the mouth of the three men[a], his anger burned.
translation:
  language: fr
  text: Quand Élihou vit que les trois hommes n’avaient aucune réponse à donner[a], sa colère s’enflamma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’y avait pas de réponse dans la bouche des trois hommes » ; cette expression signifie qu’ils n’avaient aucune réponse à donner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Quand … vit
  rationale: Le wayyiqtol fait progresser le récit; avec la réaction qui suit, « Quand » exprime naturellement la relation temporelle en français.
- source_word: אֱלִיהוּא
  choice: Élihou
  rationale: Translittération française usuelle du nom hébreu.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce qu’Élihou constate.
- source_word: אֵין מַעֲנֶה
  choice: n’avaient plus rien à répondre
  rationale: Dans ce contexte narratif et dialogué, cette formulation idiomatique exprime qu’aucune réponse ne leur restait, sans suggérer qu’ils étaient simplement silencieux.
- source_word: בְּפִי שְׁלֹשֶׁת הָאֲנָשִׁים
  choice: les trois hommes n’avaient … à répondre
  rationale: Le français naturel transpose l’image hébraïque « dans la bouche des trois hommes » en une construction personnelle; l’image source est signalée en note.
- source_word: וַיִּחַר אַפּוֹ
  choice: sa colère s’enflamma
  rationale: Cette expression conserve la métaphore hébraïque de la colère qui brûle tout en restant naturelle et digne en français.
