source:
  edition: WLC
  text: חַ֭תּוּ לֹא עָ֣נוּ ע֑וֹד הֶעְתִּ֖יקוּ מֵ/הֶ֣ם מִלִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/015.yaml
  text: They are dismayed[a]; they answer no more[b]; words have departed from them.
translation:
  language: fr
  text: Ils sont consternés[a], ils ne répondent plus ; les mots les ont quittés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ils sont brisés » ou « Ils sont déconcertés » ; le verbe hébreu peut exprimer le fait d’être brisé, terrifié ou consterné.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « les mots se sont éloignés d’eux » : ils n’ont plus rien à dire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַתּוּ
  choice: Ils sont consternés
  rationale: Le verbe חתת peut évoquer le fait d’être brisé, terrifié ou déconcerté. Ici, « consternés » exprime naturellement l’effondrement et le désarroi des amis de Job réduits au silence, sans imposer l’image physique d’une fracture.
- source_word: לֹא עָנוּ עוֹד
  choice: ils ne répondent plus
  rationale: ענה désigne ici la réponse dans le cadre du débat, tandis que לֹא…עוֹד indique qu’une action auparavant possible ou répétée a cessé. « Ne répondent plus » est idiomatique et fidèle.
- source_word: הֶעְתִּיקוּ מֵהֶם מִלִּים
  choice: les mots les ont quittés
  rationale: 'Le hiphil de עתק avec מֵהֶם exprime l’éloignement ou le retrait. La formulation conserve la personnification frappante de l’hébreu : les mots se sont éloignés d’eux, autrement dit ils n’ont plus rien à dire.'
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le parallélisme bref du verset et l’image hébraïque des mots qui abandonnent les interlocuteurs sont conservés.
