  text: הִנֵּֽה בִטְנִ֗/י כְּ/יַ֥יִן לֹא יִפָּתֵ֑חַ כְּ/אֹב֥וֹת חֲ֝דָשִׁ֗ים יִבָּקֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/019.yaml
  text: Look[a], my belly is like wine that has no vent[b]; like new wineskins it is about to burst.
translation:
  language: fr
  text: Voici, mon ventre est comme du vin qui n’a pas d’issue[a] ; comme des outres neuves[b], il est sur le point d’éclater.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui n’est pas ouvert ».'
    reason: lexical_alternative
  - marker: b
    text: Les outres étaient des récipients en peau utilisés pour conserver des liquides, notamment le vin.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Particule qui attire l’attention sur la comparaison vive d’Élihou ; « Voici » conserve cette force dans un registre digne et naturel.
- source_word: בִטְנִי
  choice: mon ventre
  rationale: Le terme désigne concrètement le ventre et, par extension, l’être intérieur. Le choix préserve à la fois l’image corporelle et sa portée métaphorique.
- source_word: כְּיַיִן
  choice: comme du vin
  rationale: Traduction directe de la comparaison, sans ajouter l’idée de fermentation, qui reste implicite dans le contexte.
- source_word: לֹא יִפָּתֵחַ
  choice: qui n’a pas d’issue
  rationale: La forme signifie littéralement « qui n’est pas ouvert ». Dans l’image d’une pression contenue, « qui n’a pas d’issue » en exprime naturellement le sens sans introduire l’idée plus forte d’une impossibilité.
- source_word: כְּאֹבוֹת חֲדָשִׁים
  choice: comme des outres neuves
  rationale: אֹבוֹת désigne ici des récipients en peau, dans le contexte du vin, et חֲדָשִׁים signifie « neufs ». « Outres neuves » est l’expression française usuelle et culturellement précise.
- source_word: יִבָּקֵעַ
  choice: il est sur le point d’éclater
  rationale: Le verbe exprime l’action de se fendre ou d’éclater. La tournure rend la pression imminente suggérée par la comparaison ; le singulier reprend « mon ventre ».
