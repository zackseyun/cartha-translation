  variant: modern international French
source:
  edition: WLC
  text: אָ֭כֵן רֽוּחַ הִ֣יא בֶ/אֱנ֑וֹשׁ וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּבִינֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/008.yaml
  text: But there is a spirit in man[a], and the breath of the Almighty gives them understanding.
translation:
  language: fr
  text: Mais il y a un esprit dans l’être humain[a], et le souffle du Tout-Puissant leur donne l’intelligence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il y a assurément un esprit dans un être humain, et le souffle du Tout-Puissant lui donne l’intelligence. » L’hébreu passe du singulier « être humain » au pluriel « leur »; certaines traductions harmonisent la phrase au singulier.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֵן
  choice: Mais
  rationale: Dans le raisonnement d’Élihou, le terme introduit une correction emphatique à ce qui précède. « Mais » exprime naturellement ce contraste en français.
- source_word: רוּחַ
  choice: un esprit
  rationale: Le mot désigne ici le principe immatériel présent dans l’être humain. « Esprit » le distingue de נְשָׁמָה, rendu par « souffle » dans le membre parallèle.
- source_word: הִיא
  choice: il y a
  rationale: La proposition nominale hébraïque peut être rendue naturellement en français par une tournure existentielle, sans imposer une construction emphatique plus explicite que le texte.
- source_word: בֶאֱנוֹשׁ
  choice: dans l’être humain
  rationale: אֱנוֹשׁ désigne l’être humain mortel de façon générique. Cette formulation moderne et inclusive conserve la portée générale du singulier hébreu.
- source_word: וְנִשְׁמַת
  choice: et le souffle de
  rationale: נְשָׁמָה signifie naturellement « souffle » et évoque ici ce qui vient de Dieu; le choix maintient la distinction poétique avec רוּחַ, « esprit ».
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Cette traduction traditionnelle et intelligible rend le titre divin שַׁדַּי sans le translittérer.
- source_word: תְּבִינֵם
  choice: leur donne l’intelligence
  rationale: La forme causative exprime le fait de donner la compréhension, et le pronom « leur » conserve le suffixe masculin pluriel hébreu malgré le singulier générique qui précède.
theological_decisions:
- issue: Langage anthropologique et passage du singulier au pluriel
  choice: Le texte passe de « l’être humain » au singulier générique à « leur » au pluriel.
  alternative: 'Harmoniser au singulier : « dans un être humain… lui donne l’intelligence ».'
  rationale: L’hébreu emploie d’abord אֱנוֹשׁ au singulier, puis un suffixe pluriel dans תְּבִינֵם. La traduction conserve ce changement de nombre afin de ne pas résoudre silencieusement la tension grammaticale.
translation_notes:
  register: Français international moderne, clair et digne. « L’être humain » évite le sens potentiellement exclusivement masculin de « l’homme » tout en conservant le singulier générique. Le marqueur [a] est placé immédiatement après le groupe concerné.
