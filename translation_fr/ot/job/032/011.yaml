- from: Voici, j’ai attendu vos paroles[a] ; j’ai prêté l’oreille à vos raisonnements[b], tandis que vous cherchiez quoi dire[c].
  to: Voici, j’ai attendu vos paroles[a] ; j’ai prêté l’oreille à vos raisonnements[b], jusqu’à ce que vous recherchiez des mots[c].
