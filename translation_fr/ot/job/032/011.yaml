translation_notes:
  register: Français international moderne, digne et légèrement poétique. Le parallélisme entre l’attente et l’écoute est conservé. « Prêter l’oreille » marque l’attention soutenue, tandis que « chercher quoi dire » rend naturellement la dernière expression hébraïque, dont la compacité et l’ambiguïté sont précisées en note.
