  yaml_path: translation/ot/job/032/011.yaml
  text: Look[a], I waited for your words; I listened to your insights[c][b], until you searched out words.
translation:
  language: fr
  text: Voici, j’ai attendu vos paroles[a] ; j’ai prêté l’oreille à vos raisonnements[b], jusqu’à ce que vous recherchiez des mots[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai espéré entendre vos paroles ». Le verbe hébreu peut exprimer une attente pleine d’espoir.
    reason: lexical_alternative
  - marker: b
    text: Ou « votre intelligence » ou « vos réflexions ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « jusqu’à ce que vous recherchiez des mots ». L’expression hébraïque est concise ; elle peut évoquer la recherche d’une formulation ou d’une réponse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: Particule qui attire l’attention sur la déclaration qui suit ; « Voici » garde une dignité poétique sans être incompréhensible en français moderne.
- source_word: הוֹחַלְתִּי
  choice: j’ai attendu
  rationale: Le verbe יחל peut exprimer l’attente ou l’espérance. Ici, Élihou souligne surtout qu’il s’est retenu de parler pendant qu’il écoutait les autres.
- source_word: לְדִבְרֵיכֶם
  choice: vos paroles
  rationale: Rend directement דְּבָרִים dans ce contexte de discours, avec « attendre » employé transitivement de façon naturelle en français soutenu.
- source_word: אָזִין
  choice: j’ai prêté l’oreille
  rationale: Le hiphil de אזן indique une écoute attentive. Cette expression française conserve cette nuance et convient au registre poétique.
- source_word: תְּבוּנוֹתֵיכֶם
  choice: vos raisonnements
  rationale: Le pluriel תְּבוּנוֹת peut désigner les manifestations de l’intelligence ou du discernement. Dans ce débat, « raisonnements » désigne naturellement la substance intellectuelle des propos.
- source_word: עַד
  choice: tandis que
  rationale: Dans la dernière proposition, la limite temporelle introduite par עַד se rend plus naturellement en français par une action qui se prolonge pendant la recherche des mots ; la valeur littérale « jusqu’à ce que » demeure signalée en note.
- source_word: תַּחְקְרוּן
  choice: vous cherchiez
  rationale: חקר évoque une recherche approfondie. Associé à « mots », le français idiomatique « chercher quoi dire » en conserve ici le mouvement sans produire une formulation obscure.
- source_word: מִלִּין
  choice: quoi dire
  rationale: Le pluriel poétique מִלִּין signifie littéralement « mots ». Dans la locution compacte « rechercher des mots », il désigne les formulations ou la réponse que les interlocuteurs tentaient de trouver.
