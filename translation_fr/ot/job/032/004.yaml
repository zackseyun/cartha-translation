  text: וֶֽ/אֱלִיה֗וּ חִכָּ֣ה אֶת אִ֭יּוֹב בִּ/דְבָרִ֑ים כִּ֤י זְֽקֵנִים הֵ֖מָּה מִמֶּ֣/נּוּ לְ/יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/004.yaml
  text: Elihu had waited to speak to Job[b][a], because they were older than he in days.
translation:
  language: fr
  text: Élihu avait attendu avant de parler à Job[a], parce qu’ils étaient plus âgés que lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Élihu avait attendu Job en paroles » ; le sens est qu’il attendit avant de parler à Job.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils étaient plus vieux que lui quant aux jours » ; autrement dit, ils étaient plus âgés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִיהוּ
  choice: Élihou
  rationale: Le nom est translittéré selon son usage français courant. Le waw assure la continuité du récit, que le français peut laisser implicite ici sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: חִכָּה
  choice: avait attendu
  rationale: Le verbe signifie « attendre ». Le plus-que-parfait présente cette attente comme l’arrière-plan de la prise de parole qui suit.
- source_word: אֶת אִיּוֹב בִּדְבָרִים
  choice: avant de parler à Job
  rationale: La tournure littérale, « attendre Job en paroles », est peu naturelle en français. Dans le contexte, elle indique qu’Élihou a différé le moment de s’adresser à Job.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit clairement la raison de l’attente d’Élihou.
- source_word: זְקֵנִים הֵמָּה מִמֶּנּוּ
  choice: ils étaient plus âgés que lui
  rationale: L’adjectif et la préposition comparative expriment ici une différence d’âge, non la fonction officielle d’« anciens ».
- source_word: לְיָמִים
  choice: plus âgés
  rationale: Littéralement « quant aux jours », cette expression hébraïque précise qu’il est question de l’âge. Son sens est intégré à la formulation française naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation reste proche de l’hébreu tout en explicitant naturellement son tour idiomatique. Le pronom pluriel « ils » conserve la référence contextuelle du texte source sans la remplacer par une désignation interprétative.
