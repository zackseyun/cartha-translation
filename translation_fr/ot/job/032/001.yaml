  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יִּשְׁבְּת֡וּ שְׁלֹ֤שֶׁת הָ/אֲנָשִׁ֣ים הָ֭/אֵלֶּה מֵ/עֲנ֣וֹת אֶת אִיּ֑וֹב כִּ֤י ה֖וּא צַדִּ֣יק בְּ/עֵינָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/032/001.yaml
  text: So these three men stopped answering Job[a], because he was righteous in his own eyes.
translation:
  language: fr
  text: Alors ces trois hommes cessèrent de répondre à Job, parce qu’il se considérait comme juste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Selon une autre tradition textuelle : « parce qu’ils le considéraient comme juste ».'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: cessèrent
  rationale: Le verbe שבת exprime ici la cessation d’une action. « Cessèrent de répondre » est naturel, précis et d’un registre digne.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: ces trois hommes
  rationale: Traduction directe du groupe nominal démonstratif, dont le masculin désigne les trois interlocuteurs de Job.
- source_word: מֵעֲנוֹת אֶת אִיּוֹב
  choice: de répondre à Job
  rationale: ענה signifie ici « répondre » dans le cadre du débat. Le français construit naturellement ce verbe avec « à ».
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit la raison pour laquelle les trois hommes ont cessé de répondre.
- source_word: צַדִּיק
  choice: juste
  rationale: « Juste » conserve la portée morale et judiciaire de צַדִּיק tout en étant idiomatique en français biblique moderne.
- source_word: בְּעֵינָיו
  choice: il se considérait comme
  rationale: Cette formulation idiomatique rend la locution hébraïque « à ses propres yeux » sans suggérer que le narrateur confirme objectivement la justice de Job.
theological_decisions:
- issue: Job est-il déclaré réellement juste ou seulement juste selon sa propre appréciation ?
  choice: « il se considérait comme juste »
  alternative: « il était juste à ses propres yeux »
  rationale: La formulation traduit le suffixe singulier du texte massorétique et maintient la distinction entre l’opinion de Job sur lui-même et un jugement objectif du narrateur.
- issue: Variante portant sur le possesseur des « yeux »
  choice: 'Texte principal au singulier : l’appréciation est celle de Job.'
  alternative: 'Selon une autre tradition textuelle : « ils le considéraient comme juste »'
  rationale: Le texte hébreu fourni porte un suffixe masculin singulier, tandis qu’une autre tradition attestée comprend un pluriel. La variante est signalée sans remplacer la leçon source.
translation_notes:
  register: Français international moderne, clair et digne. « Se considérait comme juste » privilégie une expression française naturelle tout en préservant la tension narrative; la variante textuelle est conservée en note.
