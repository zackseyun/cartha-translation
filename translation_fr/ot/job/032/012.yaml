  text: וְ/עָֽדֵי/כֶ֗ם אֶתְבּ֫וֹנָ֥ן וְ/הִנֵּ֤ה אֵ֣ין לְ/אִיּ֣וֹב מוֹכִ֑יחַ עוֹנֶ֖ה אֲמָרָ֣י/ו מִ/כֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/012.yaml
  text: I paid close attention to you[a], and behold, there was no one among you to refute Job[b], to answer his words.
translation:
  language: fr
  text: 'Je vous ai écoutés attentivement[a], et voici : personne parmi vous n’a réfuté Job[b] ni répondu à ses paroles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je vous ai observés attentivement ». Le verbe hébreu exprime un examen ou une attention soutenue.
    reason: lexical_alternative
  - marker: b
    text: Ou « reprendre Job » ou « corriger Job ». Le terme hébreu peut désigner aussi bien la réfutation dans un débat que la réprimande ou la correction.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָדֵיכֶם אֶתְבּוֹנָן
  choice: Je vous ai écoutés avec attention
  rationale: Le verbe à valeur réfléchie/intensive exprime ici un examen attentif dirigé vers les interlocuteurs. Dans le contexte d’un débat oral, « écouter avec attention » rend naturellement l’idée sans réduire celle-ci à la simple audition.
- source_word: וְהִנֵּה
  choice: mais voici
  rationale: « Voici » conserve la fonction présentative et la force rhétorique du marqueur hébreu. « Mais » explicite naturellement en français le contraste entre l’écoute attentive d’Élihou et son constat négatif.
- source_word: אֵין לְאִיּוֹב מוֹכִיחַ
  choice: aucun de vous n’a su réfuter Job
  rationale: Le participe issu de יכח peut désigner celui qui contredit, reprend ou démontre l’erreur. Dans cette controverse, « réfuter » met au premier plan l’argumentation, tandis que la note conserve l’autre nuance possible.
- source_word: עוֹנֶה אֲמָרָיו
  choice: ni répondre à ses paroles
  rationale: Cette formulation reste proche de la construction hébraïque tout en étant claire et digne en français moderne.
- source_word: מִכֶּם
  choice: aucun de vous
  rationale: La préposition indique qu’aucun membre du groupe des amis n’a accompli l’action. L’intégration dans « aucun de vous » est plus idiomatique que « parmi vous » dans cette phrase.
theological_decisions:
- issue: Portée de מוֹכִיחַ appliqué à Job
  choice: réfuter Job
  alternative: reprendre ou corriger Job
  rationale: 'Le cadre est celui d’une dispute verbale : la réfutation argumentative est donc privilégiée, sans exclure la nuance de réprimande ou de correction, signalée en note.'
translation_notes:
  register: Français international moderne, naturel et digne. « Mais voici » préserve le relief rhétorique sans recourir à l’archaïque « et voici que ». Le passé composé convient à la prise de parole directe d’Élihou.
