  text: And his anger burned against his three friends because they had found no answer[a], yet they had condemned Job.
translation:
  language: fr
  text: Sa colère s’enflamma aussi contre ses trois amis, parce qu’ils n’avaient trouvé aucune réponse et avaient pourtant condamné[a] Job.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déclaré Job coupable » ou « traité Job de méchant ».
    reason: Alternative lexicale reflétant les nuances possibles du hiphil de רשע.
lexical_decisions:
- source_word: וּבִשְׁלֹשֶׁת רֵעָיו
  choice: aussi contre ses trois amis
  rationale: Avec חרה אף, la préposition ב désigne idiomatiquement la personne visée par la colère. « Contre » l’exprime naturellement en français, tandis que « aussi » rattache ce motif de colère à celui du verset précédent.
- source_word: חָרָה אַפּוֹ
  choice: sa colère s’enflamma
  rationale: Cette formulation conserve l’image de la colère qui brûle tout en évitant le littéralisme obscur « son nez brûla ».
- source_word: עַל אֲשֶׁר
  choice: parce que
  rationale: La locution introduit ici la cause de la colère et se rend avec concision par « parce que ».
- source_word: לֹא מָצְאוּ מַעֲנֶה
  choice: ils n’avaient trouvé aucune réponse
  rationale: מַעֲנֶה désigne une réponse dans le cadre du débat. Le plus-que-parfait marque naturellement l’antériorité de ce constat.
- source_word: וַיַּרְשִׁיעוּ
  choice: avaient pourtant condamné
  rationale: Le hiphil de רשע a couramment le sens déclaratif ou judiciaire de « déclarer coupable, condamner ». « Pourtant » explicite sobrement le contraste contextuel entre l’absence de réponse et la condamnation de Job.
- source_word: אֶת אִיּוֹב
  choice: Job
  rationale: Le marqueur de l’objet direct n’est pas traduit; le nom propre reçoit sa forme française usuelle.
theological_decisions:
- issue: Nature de l’action des amis envers Job
  choice: avaient condamné Job
  alternative: avaient déclaré Job coupable; avaient traité Job de méchant
  rationale: Le hiphil de רשע favorise ici un sens déclaratif ou judiciaire. « Condamné » préserve cette portée sans préciser indûment la nature exacte du verdict ni introduire une doctrine particulière.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore hébraïque de la colère qui brûle est conservée; la syntaxe reste claire pour une lecture courante.
