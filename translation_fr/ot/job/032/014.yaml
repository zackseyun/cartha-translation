id: JOB.32.14
reference: Job 32:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹא עָרַ֣ךְ אֵלַ֣/י מִלִּ֑ין וּ֝/בְ/אִמְרֵי/כֶ֗ם לֹ֣א אֲשִׁיבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/014.yaml
  text: He has not directed words against me[b][a], and I will not answer him with your sayings.
translation:
  language: fr
  text: Il n’a pas dirigé ses paroles contre moi[a], et ce n’est pas avec vos propos que je lui répondrai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il n’a pas disposé ses paroles contre moi ». Le verbe hébreu peut signifier mettre en ordre ou déployer des paroles, et ainsi présenter une argumentation.
    reason: lexical_alternative
  - marker: b
    text: Ou « je ne lui répondrai pas avec vos arguments ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרַךְ
  choice: a dirigé
  rationale: Avec « paroles » et אֵלַי, le verbe évoque des paroles ordonnées puis dirigées vers quelqu’un dans le cadre d’un débat. « Dirigé » conserve cette image sans remplacer explicitement les paroles par des arguments.
- source_word: אֵלַי
  choice: contre moi
  rationale: La préposition signifie littéralement « vers moi / à moi », mais le contexte de controverse favorise ici « contre moi », puisque Job n’a pas adressé son argumentation à Élihou personnellement.
- source_word: מִלִּין
  choice: ses paroles
  rationale: Ce pluriel aramaïsant désigne des paroles ou un discours. « Ses paroles » est naturel en français et maintient le terme concret plutôt que d’expliciter « arguments ».
- source_word: אִמְרֵיכֶם
  choice: vos propos
  rationale: « Propos » rend les paroles prononcées par les interlocuteurs et permet de distinguer ce mot de מִלִּין sans créer une différence de sens excessive.
- source_word: אֲשִׁיבֶנּוּ
  choice: je lui répondrai
  rationale: Le hiphil de שוב signifie ici « répondre »; le suffixe masculin singulier renvoie à Job. La tournure française avec complément indirect est idiomatique.
- source_word: וּבְאִמְרֵיכֶם לֹא אֲשִׁיבֶנּוּ
  choice: et ce n’est pas avec vos propos que je lui répondrai
  rationale: 'La construction clivée rend naturellement en français la mise en tête du complément introduit par בְּ et conserve son sens instrumental : Élihou ne répondra pas à Job au moyen des propos déjà tenus par ses amis.'
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le vocabulaire concret des « paroles » et des « propos », tout en laissant les notes signaler la portée argumentative du contexte.
