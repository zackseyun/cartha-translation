source:
  edition: WLC
  text: וַ/יִּ֤חַר אַ֨ף אֱלִיה֣וּא בֶן בַּרַכְאֵ֣ל הַ/בּוּזִי֮ מִ/מִּשְׁפַּ֪חַ֫ת רָ֥ם בְּ֭/אִיּוֹב חָרָ֣ה אַפּ֑/וֹ עַֽל צַדְּק֥/וֹ נַ֝פְשׁ֗/וֹ מֵ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/002.yaml
  text: Then Elihu son of Barakel the Buzite[a], from the family of Ram, burned with anger against Job; his anger burned because he justified himself rather than God.
translation:
  language: fr
  text: Alors Élihou, fils de Barakéel le Bouzite, du clan de Ram, se mit en colère contre Job. Sa colère s’enflamma parce que Job se donnait raison plutôt qu’à Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parce qu’il se considérait comme plus juste que Dieu ».
    reason: Lecture comparative plus explicite de la construction hébraïque.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: se mit en colère
  rationale: L’expression hébraïque évoque littéralement la colère qui s’embrase. Cette formulation française naturelle exprime clairement l’entrée dans la colère, tandis que l’image de la flamme est conservée dans la reprise qui suit.
- source_word: אֱלִיהוּא
  choice: Élihou
  rationale: Translittération française usuelle du nom hébreu.
- source_word: בֶן בַּרַכְאֵל
  choice: fils de Barakéel
  rationale: Rend directement la formule généalogique hébraïque.
- source_word: הַבּוּזִי
  choice: le Bouzite
  rationale: Le gentilé avec article désigne l’appartenance ethnique ou clanique d’Élihou.
- source_word: מִמִּשְׁפַּחַת רָם
  choice: du clan de Ram
  rationale: מִשְׁפָּחָה peut désigner une famille élargie ou un clan. « Clan » distingue utilement ce groupe de la filiation immédiate déjà indiquée.
- source_word: בְּאִיּוֹב
  choice: contre Job
  rationale: Avec un verbe de colère, la préposition בְּ introduit ici la personne contre laquelle celle-ci est dirigée.
- source_word: חָרָה אַפּוֹ
  choice: Sa colère s’enflamma
  rationale: Conserve dans la seconde occurrence l’image hébraïque de la colère qui brûle ainsi que la répétition emphatique du texte.
- source_word: עַל
  choice: parce que
  rationale: La préposition introduit ici le motif de la colère d’Élihou.
- source_word: צַדְּקוֹ נַפְשׁוֹ
  choice: Job se donnait raison à lui-même
  rationale: Le verbe possède ici une nuance déclarative ou judiciaire, et נַפְשׁוֹ a une valeur réfléchie. La formulation française exprime l’autojustification sans transformer « l’âme » en élément distinct.
- source_word: מֵאֱלֹהִים
  choice: plutôt qu’à Dieu
  rationale: 'La préposition מִן porte vraisemblablement une valeur comparative : Job se donne raison aux dépens de la justification de Dieu. Cette formulation préserve le contraste sans affirmer plus explicitement que l’hébreu une supériorité morale abstraite.'
theological_decisions:
- issue: Sens de עַל צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים
  choice: parce que Job se donnait raison à lui-même plutôt qu’à Dieu
  alternative: parce qu’il se considérait comme plus juste que Dieu
  rationale: La construction hébraïque est difficile. Le texte présente vraisemblablement l’autojustification de Job comme se faisant aux dépens de Dieu. Le texte principal maintient ce contraste sans durcir l’énoncé, tandis que la note donne la lecture comparative plus explicite.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition hébraïque relative à la colère est conservée, avec une variation idiomatique qui maintient l’image de l’embrasement. Le marqueur de note est placé après la proposition ambiguë à laquelle il se rapporte.
