  text: I said[a], ‘Days should speak, and many years should make wisdom known.’
translation:
  language: fr
  text: 'Je me disais[a] : « L’âge devrait parler, et le grand nombre des années devrait faire connaître la sagesse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je disais : “Les jours devraient parler, et le grand nombre des années devrait faire connaître la sagesse.” » En hébreu, « les jours » et « le grand nombre des années » désignent par métonymie l’âge avancé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Je me disais
  rationale: Le qal accompli à la première personne signifie littéralement « j’ai dit », mais il introduit ici l’opinion qu’Élihou avait jusque-là en lui-même. « Je me disais » garde le lien avec le verbe « dire » tout en étant naturel en français.
- source_word: יָמִים
  choice: l’âge
  rationale: Le pluriel « jours » désigne ici, par métonymie, l’âge avancé ou les personnes âgées. Le français « c’est à l’âge de parler » restitue clairement cette valeur sans la formulation peu naturelle « les jours parleront ».
- source_word: יְדַבֵּרוּ
  choice: de parler
  rationale: L’imparfait exprime dans le contexte ce qui était attendu ou jugé convenable. La construction « c’est à… de… » rend cette nuance d’attente plutôt qu’une simple prédiction.
- source_word: וְרֹב שָׁנִים
  choice: au grand nombre des années
  rationale: Cette formulation conserve l’image hébraïque d’une abondance d’années et le parallélisme poétique avec « l’âge ».
- source_word: יֹדִיעוּ
  choice: de faire connaître
  rationale: Le hiphil de ידע signifie « faire savoir, faire connaître ». Cette traduction demeure plus proche de la forme causative que « enseigner ».
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Le nom abstrait signifie directement « sagesse » et joue un rôle central dans le contexte du livre.
