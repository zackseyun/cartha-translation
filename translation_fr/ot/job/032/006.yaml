translation_notes:
  register: Français moderne, international et digne. La syntaxe évite les calques « jeune en jours » et « déclarer ma connaissance », peu naturels en français, tout en conservant le contraste d’âge et la double expression de la réticence. Le marqueur [a] figure dans le texte principal.
