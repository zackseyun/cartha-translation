  naturalness: La formulation révisée demeure idiomatique, moderne et digne. « J’ai été intimidé et j’ai eu peur » conserve les deux termes hébreux sans recourir à un calque pesant. La note est corrigée typographiquement et son ancrage est placé sur l’expression qu’elle éclaire.
