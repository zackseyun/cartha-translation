base_translation:
  language: en
  yaml_path: translation/ot/job/032/006.yaml
  text: Then Elihu son of Barakel the Buzite answered and said[a], “I am young in days, and you are aged[b]; therefore I was timid and afraid to declare my knowledge to you.
translation:
  language: fr
  text: 'Alors Élihou, fils de Barakéel, le Bouzite, répondit : « Je suis jeune, et vous êtes avancés en âge ; c’est pourquoi j’ai été intimidé et j’ai eu peur de vous faire connaître ce que je sais.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de vous déclarer ma connaissance » ; on peut aussi traduire : « j’ai reculé et j’ai eu peur de vous dire ce que je sais ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: prit la parole
  rationale: Dans cette introduction à un discours, la tournure française naturelle « prit la parole » rend l’ouverture de la réponse sans laisser entendre qu’une question directe venait d’être posée.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל הַבּוּזִי
  choice: Élihou, fils de Barakéel, le Bouzite
  rationale: Les noms sont translittérés sous des formes françaises usuelles, et le gentilé הַבּוּזִי est conservé comme désignation d’origine ou d’appartenance.
- source_word: צָעִיר אֲנִי לְיָמִים
  choice: Je suis jeune
  rationale: Littéralement « je suis jeune en jours » ; le français courant exprime naturellement cet idiome par « je suis jeune ».
- source_word: יְשִׁישִׁים
  choice: vous êtes avancés en âge
  rationale: Cette formulation digne et respectueuse exprime l’âge avancé sans nuance péjorative.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: La locution marque clairement la conséquence que tire Élihou de la différence d’âge.
- source_word: זָחַלְתִּי
  choice: j’ai hésité
  rationale: Le verbe évoque le fait de reculer avec appréhension ou de se montrer timide ; « hésité » convient naturellement au retard d’Élihou à parler.
- source_word: וָאִירָא
  choice: et j’ai eu peur
  rationale: La traduction maintient le second terme de la double expression hébraïque et son intensification de la réticence.
- source_word: מֵחַוּוֹת
  choice: de vous faire connaître
  rationale: Le verbe signifie déclarer ou faire connaître ; cette formulation est naturelle avec le contenu intellectuel qui suit.
- source_word: דֵּעִי
  choice: ce que je sais
  rationale: Cette expression française idiomatique rend littéralement l’idée de « ma connaissance » sans la réduire à une simple opinion.
- source_word: אֶתְכֶם
  choice: vous
  rationale: Le pronom désigne les destinataires auxquels Élihou hésitait à communiquer son savoir.
