lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conclusion tirée de l’argument précédent, dans un français actuel et soutenu.
- source_word: אָמַרְתִּי
  choice: je dis
  rationale: 'Bien que la forme hébraïque soit un accompli, elle peut avoir ici une valeur performative présente : Élihou annonce sa résolution au moment même où il parle.'
- source_word: שִׁמְעָה לִּי
  choice: Écoute-moi
  rationale: L’impératif singulier appelle l’interlocuteur à prêter attention ; cette formulation est idiomatique en français moderne.
- source_word: אֲחַוֶּה
  choice: je vais exposer
  rationale: Le verbe exprime l’action de faire connaître ou de déclarer. « Exposer » convient au registre argumentatif sans ajouter l’idée plus précise d’une explication.
- source_word: דֵּעִי
  choice: ce que je sais
  rationale: Rend naturellement l’idée de « mon savoir / ma connaissance » et préserve l’affirmation épistémique sans la réduire à une simple opinion.
- source_word: אַף אֲנִי
  choice: moi aussi
  rationale: Conserve l’ajout emphatique par lequel Élihou se joint à ceux qui prennent la parole.
