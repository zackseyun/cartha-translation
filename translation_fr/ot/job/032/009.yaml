  text: לֹֽא רַבִּ֥ים יֶחְכָּ֑מוּ וּ֝/זְקֵנִ֗ים יָבִ֥ינוּ מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/009.yaml
  text: It is not the many who are wise[a], nor the old who understand justice.
translation:
  language: fr
  text: Ce ne sont pas les grands[a] qui sont sages, ni les personnes âgées qui discernent ce qui est juste.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les nombreux ». Le terme hébreu peut désigner des personnes nombreuses ou des personnes grandes/importantes.
    reason: lexical_alternative
  - marker: b
    text: Ou « le jugement » ou « la justice ». Le mot hébreu mishpat peut désigner un jugement, la justice ou ce qui est juste.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא רַבִּים
  choice: Ce ne sont pas les gens nombreux
  rationale: La négation porte sur רַבִּים, employé substantivement. Cette tournure conserve l’insistance de l’hébreu et présente le nombre comme une catégorie, sans donner à רַבִּים le sens moins probable de « grands ».
- source_word: יֶחְכָּמוּ
  choice: qui sont sages
  rationale: Dans cette affirmation générale, le qal de חכם exprime naturellement le fait d’être sage, plutôt qu’un processus explicite consistant à le devenir.
- source_word: וּזְקֵנִים
  choice: ni les personnes âgées
  rationale: Le contexte oppose l’âge à la véritable compréhension. « Personnes âgées » exprime cette idée sans introduire la notion de fonction officielle que pourrait suggérer « anciens ».
- source_word: יָבִינוּ
  choice: qui comprennent
  rationale: בין désigne ici la compréhension ou le discernement; « comprennent » est direct et naturel en français actuel.
- source_word: מִשְׁפָּט
  choice: ce qui est juste
  rationale: מִשְׁפָּט couvre les notions de jugement, de justice et de juste ordre. Dans ce contexte de discernement, « ce qui est juste » est idiomatique et conserve la portée morale et judiciaire du terme.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre la multitude et l’âge est conservé, ainsi que la portée générale de l’énoncé.
