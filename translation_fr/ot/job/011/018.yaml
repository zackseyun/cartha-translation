  yaml_path: translation/ot/job/011/018.yaml
  text: And you will be secure[a], because there is hope; you will look around and lie down in safety.
translation:
  language: fr
  text: Tu seras en sécurité, car il y a de l’espoir ; tu inspecteras les alentours[a] et tu te coucheras en sûreté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu creuseras autour de toi ». Le verbe hébreu désigne littéralement l’action de creuser, mais il peut évoquer ici le fait d’examiner ou de préparer un endroit avant de s’y coucher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָטַחְתָּ
  choice: Tu seras en sécurité
  rationale: Le verbe בטח peut exprimer la confiance ou l’état de sécurité. Ici, la présence de l’espoir motive une assurance stable ; cette formulation française rend naturellement le sens résultatif sans le réduire au seul sentiment subjectif.
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: car il y a de l’espoir
  rationale: תִּקְוָה désigne l’espoir ou l’attente, et כִּי introduit ici la raison de l’assurance annoncée.
- source_word: וְחָפַרְתָּ
  choice: tu inspecteras les alentours[a]
  rationale: חפר évoque littéralement l’action de creuser, mais peut désigner ici l’examen ou la préparation de l’endroit où l’on va se coucher. « Inspecter les alentours » donne un sens cohérent en français tout en signalant l’incertitude lexicale en note.
- source_word: לָבֶטַח
  choice: en sûreté
  rationale: L’expression adverbiale indique que la personne pourra se coucher sans danger et avec assurance.
- source_word: תִּשְׁכָּב
  choice: tu te coucheras
  rationale: שׁכב signifie concrètement « se coucher » ; cette traduction conserve l’image du repos plutôt que de la remplacer par une abstraction.
