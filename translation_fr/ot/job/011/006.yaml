  text: וְ/יַגֶּד לְ/ךָ֨ תַּֽעֲלֻמ֣וֹת חָכְמָה֮ כִּֽי כִפְלַ֪יִם לְֽ/ת֫וּשִׁיָּ֥ה וְ/דַ֡ע כִּֽי יַשֶּׁ֥ה לְ/ךָ֥ אֱ֝ל֗וֹהַ מֵ/עֲוֺנֶֽ/ךָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/006.yaml
  text: and would tell you the hidden things of wisdom[a], for sound wisdom has two sides. Know, then[c][b], that God has overlooked some of your iniquity.
translation:
  language: fr
  text: et qu’il te révèle les secrets de la sagesse[a], car la sagesse véritable a deux aspects[b] ! Sache alors que Dieu ne tient pas compte d’une part de ta faute[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les réalités cachées de la sagesse ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « car elle est double pour la sagesse véritable » ; l’expression indique que la sagesse comporte plus d’un aspect et dépasse les apparences.
    reason: lexical_alternative
  - marker: c
    text: Ou « Dieu exige de toi moins que ne mérite ta faute », ou encore « Dieu oublie une part de ta faute ». Le verbe hébreu est difficile.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַגֶּד לְךָ
  choice: et qu’il te révèle
  rationale: 'Le hiphil de נגד signifie « raconter, déclarer, faire connaître ». Après le souhait formulé au verset précédent, le subjonctif français poursuit naturellement cette construction : « et qu’il te révèle ».'
- source_word: תַּעֲלֻמוֹת חָכְמָה
  choice: les réalités cachées de la sagesse
  rationale: תעלמות désigne des choses cachées ou dissimulées. « Réalités cachées » conserve le pluriel concret et le rapport avec la sagesse sans suggérer nécessairement un enseignement ésotérique.
- source_word: כִפְלַיִם לְתוּשִׁיָּה
  choice: la sagesse véritable a deux faces
  rationale: כפלים exprime littéralement ce qui est double, tandis que תושיה est un terme sapiential difficile pouvant désigner une sagesse solide, efficace ou véritable. « A deux faces » garde l’image de la dualité et indique que cette sagesse dépasse ce qui apparaît d’abord.
- source_word: וְדַע
  choice: Sache alors
  rationale: L’impératif ידע est rendu directement par « Sache » ; « alors » marque naturellement en français la conclusion que Sophar tire de ses propos.
- source_word: יַשֶּׁה לְךָ אֱלוֹהַ מֵעֲוֺנֶךָ
  choice: Dieu ne tient pas compte d’une part de ta faute
  rationale: Le verbe נשׁה est difficile et peut évoquer l’oubli ou la remise. Avec מן devant « ta faute », le contexte favorise l’idée que, selon Sophar, Dieu n’en demande pas pleinement compte. Cette formulation reste compréhensible tout en laissant la difficulté lexicale à la note.
theological_decisions:
- issue: Portée de l’affirmation de Sophar sur la manière dont Dieu traite Job
  choice: Selon les paroles de Sophar, Dieu ne tient pas compte d’une partie de la faute de Job.
  alternative: Dieu exige de Job moins que ne mérite sa faute ; ou Dieu oublie une partie de sa faute.
  rationale: Le contexte appuie l’accusation de Sophar selon laquelle Job subit moins que ce qu’il mérite. La traduction rapporte fidèlement cette accusation sans la présenter comme l’approbation divine de la théologie de Sophar.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au discours direct de Sophar à Job. La syntaxe prolonge le souhait du verset précédent, et les notes conservent les ambiguïtés réelles des deux expressions hébraïques difficiles.
