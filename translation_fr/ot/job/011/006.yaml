    issue: « a deux faces »
    rationale: En français moderne, l’expression suggère fréquemment qu’une personne ou une réalité est double, trompeuse ou hypocrite. Elle introduit donc une nuance négative étrangère à כִפְלַיִם. « a deux aspects » préserve la dualité sans cette implication.
  - severity: low
    issue: « réalités cachées »
    rationale: La formulation est compréhensible, mais moins naturelle et moins précise que « secrets », qui correspond directement au sens de choses cachées de תעלמות et ne requiert pas d’interprétation ésotérique.
