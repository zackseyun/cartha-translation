  yaml_path: translation/ot/job/011/019.yaml
  text: You will lie down[a], and none will make you afraid; many will entreat your favor.
translation:
  language: fr
  text: Tu te coucheras, sans que personne ne t’effraie ; beaucoup rechercheront ta faveur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils imploreront ton visage », expression qui signifie rechercher la faveur de quelqu’un.'
