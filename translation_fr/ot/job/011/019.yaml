lexical_decisions:
- source_word: רָבַצְתָּ
  choice: tu te coucheras
  rationale: Le verbe רָבַץ évoque directement le fait de se coucher ou de s’étendre, ici dans un contexte de sécurité. Cette formulation conserve l’image sans la réduire au sommeil.
- source_word: וְאֵין מַחֲרִיד
  choice: sans que personne te fasse trembler
  rationale: מַחֲרִיד désigne celui qui provoque le tremblement ou l’effroi. « Faire trembler » conserve cette image tout en exprimant naturellement l’absence de menace.
- source_word: וְחִלּוּ פָנֶיךָ
  choice: rechercheront ta faveur
  rationale: L’expression חלה פני signifie solliciter ou rechercher la faveur de quelqu’un. La traduction idiomatique évite le calque obscur « implorer ton visage ».
- source_word: רַבִּים
  choice: beaucoup
  rationale: Le substantif désigne simplement un grand nombre de personnes ; « beaucoup » est direct et naturel en français.
