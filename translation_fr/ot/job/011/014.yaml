  text: אִם אָ֣וֶן בְּ֭/יָדְ/ךָ הַרְחִיקֵ֑/הוּ וְ/אַל תַּשְׁכֵּ֖ן בְּ/אֹהָלֶ֣י/ךָ עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/014.yaml
  text: If iniquity is in your hand[a], put it far away[b], and do not let injustice dwell in your tents.
translation:
  language: fr
  text: Si le mal est dans ta main[a], éloigne-le, et ne laisse pas l’injustice habiter dans tes tentes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si tu as le mal en main ». L’expression peut désigner un mal que l’on commet ou que l’on garde sous son pouvoir.'
    reason: lexical_alternative
  - marker: b
    text: Les « tentes » représentent ici le cadre domestique, y compris la maisonnée.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit simplement la proposition conditionnelle, conformément à la syntaxe hébraïque.
- source_word: אָוֶן
  choice: le mal
  rationale: Dans cette exhortation morale, le mot désigne une conduite mauvaise ou coupable. « Le mal » reste naturel en français tout en conservant l’étendue sémantique du terme hébreu.
- source_word: בְּיָדְךָ
  choice: dans ta main
  rationale: Conserve l’image concrète de l’hébreu, qui peut évoquer un mal commis, détenu ou placé sous le pouvoir de la personne.
- source_word: הַרְחִיקֵהוּ
  choice: éloigne-le
  rationale: L’impératif causatif demande de mettre activement le mal à distance.
- source_word: וְאַל תַּשְׁכֵּן
  choice: et ne laisse pas … habiter
  rationale: Rend l’interdiction et préserve la métaphore de quelque chose que l’on autoriserait à s’installer durablement.
- source_word: בְּאֹהָלֶיךָ
  choice: sous tes tentes
  rationale: Respecte le pluriel et le cadre concret ancien. En français, « sous tes tentes » exprime naturellement l’espace domestique associé aux tentes.
- source_word: עַוְלָה
  choice: l’injustice
  rationale: Désigne ce qui est injuste ou mauvais. Ce choix maintient un terme éthique distinct de אָוֶן sans leur imposer une différence technique.
theological_decisions:
- issue: Terminologie morale dans le parallélisme poétique
  choice: Traduire אָוֶן par « le mal » et עַוְלָה par « l’injustice »
  alternative: Employer le même terme dans les deux membres, ou traduire les deux mots par « le mal »
  rationale: Deux termes français proches mais distincts préservent la variation poétique de l’hébreu sans créer artificiellement deux catégories théologiques précises.
- issue: Portée de l’expression « dans ta main »
  choice: Conserver l’image sans préciser si le mal est commis, possédé ou sous le contrôle de Job
  alternative: Expliciter par « si tu commets le mal » ou « si le mal est en ton pouvoir »
  rationale: L’expression hébraïque admet plusieurs nuances liées à l’action et au pouvoir. La traduction littérale conserve cette ambiguïté réelle.
translation_notes:
  register: Français moderne, sobre et poétique. Le tutoiement correspond à l’adresse directe au singulier. Les images de la main et des tentes sont conservées, avec des notes qui en éclairent la portée sans remplacer le langage concret du texte.
