source:
  edition: WLC
  text: בַּ֭דֶּי/ךָ מְתִ֣ים יַחֲרִ֑ישׁו וַ֝/תִּלְעַ֗ג וְ/אֵ֣ין מַכְלִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/003.yaml
  text: Will your empty talk make men keep silent[a], and when you mock, will no one shame you?
translation:
  language: fr
  text: Tes paroles creuses feront-elles taire les gens ? Te moqueras-tu sans que personne te couvre de honte[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te fasse honte » ou « t’humilie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּיךָ
  choice: tes paroles creuses
  rationale: Le nom peut désigner des propos vides, oiseux, vantards ou faux. « Paroles creuses » conserve le ton dépréciatif sans trancher en faveur du sens plus précis de « mensonges ».
- source_word: מְתִים
  choice: les gens
  rationale: Le pluriel désigne ici des êtres humains de manière générale. « Les gens » est naturel en français moderne et convient à la portée générale de la question.
- source_word: יַחֲרִישׁו
  choice: feront-elles taire
  rationale: Cette formulation rend la valeur causative du hiphil de חרש et préserve la force de la question rhétorique.
- source_word: וַתִּלְעַג
  choice: te moqueras-tu
  rationale: Le verbe לעג signifie se moquer, railler. La coordination est rendue par une seconde question parallèle, naturelle en français et fidèle à la progression poétique.
- source_word: מַכְלִם
  choice: couvre de honte
  rationale: Le participe hiphil de כלם exprime le fait de causer honte ou humiliation. « Couvrir de honte » restitue cette force sans réduire le sens à une simple réprimande.
theological_decisions: []
