  text: וַ֭/תֹּאמֶר זַ֣ךְ לִקְחִ֑/י וּ֝/בַ֗ר הָיִ֥יתִי בְ/עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/004.yaml
  text: For you say[a], ‘My teaching is pure, and I am clean in your eyes.’
translation:
  language: fr
  text: 'Tu dis : « Mon enseignement[a] est pur, et je suis sans tache à tes yeux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon instruction » ou « mon exposé ». Le nom hébreu peut désigner ce que l’on a reçu ou ce que l’on présente comme enseignement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: tu dis
  rationale: Le wayyiqtol peut se traduire au passé, mais le présent rend naturellement l’accusation de Tsophar, qui reprend ici une affirmation actuelle de Job.
- source_word: זַךְ
  choice: pur
  rationale: L’adjectif qualifie le contenu de l’enseignement de Job et signifie « pur », « net » ou « irréprochable ».
- source_word: לִקְחִי
  choice: mon enseignement
  rationale: Le nom לֶקַח peut désigner ce qui est reçu ou communiqué comme enseignement; ici, il renvoie à la position exposée par Job, et non simplement au fait qu’il parle.
- source_word: וּבַר
  choice: sans tache
  rationale: L’adjectif signifie « pur » ou « net ». « Sans tache » conserve l’idée de pureté personnelle tout en évitant de répéter « pur » dans la même phrase.
- source_word: הָיִיתִי
  choice: je suis
  rationale: Bien que la forme hébraïque soit un parfait, elle exprime naturellement ici l’état que Job est accusé de revendiquer; le présent convient en français.
- source_word: בְעֵינֶיךָ
  choice: à tes yeux
  rationale: Cette expression idiomatique conserve l’image hébraïque d’une évaluation portée par une personne et garde le singulier de l’adresse.
theological_decisions:
- issue: Référent du singulier dans « à tes yeux »
  choice: La citation est comprise comme une parole adressée à Dieu, sans l’expliciter dans le texte.
  alternative: Le pronom pourrait être entendu plus généralement comme visant l’interlocuteur de Job.
  rationale: Tsophar résume vraisemblablement la prétention de Job à être pur devant Dieu. La traduction littérale du pronom singulier préserve néanmoins la forme et une éventuelle ambiguïté du discours rapporté.
translation_notes:
  register: Français moderne, sobre et digne. « Car tu dis » assure le lien argumentatif avec le contexte; « sans tache » reste courant et évite une répétition lourde de « pur ».
