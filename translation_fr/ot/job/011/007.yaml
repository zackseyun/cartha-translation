  text: הַ/חֵ֣קֶר אֱל֣וֹהַ תִּמְצָ֑א אִ֤ם עַד תַּכְלִ֖ית שַׁדַּ֣י תִּמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/007.yaml
  text: Can you discover the depths of God? Can you find the limit of the Almighty?[a][b]
translation:
  language: fr
  text: Peux-tu sonder les profondeurs de Dieu[a] ? Peux-tu atteindre la limite du Tout-Puissant[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Peux-tu découvrir les choses profondes de Dieu ? » Le nom hébreu peut désigner la recherche, l’examen approfondi ou ce qui est découvert au terme d’une recherche.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le terme », « la pleine étendue » ou « la perfection » du Tout-Puissant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵקֶר
  choice: sonder les profondeurs
  rationale: חֵקֶר peut désigner l’investigation ou ce que l’on cherche à pénétrer. « Sonder les profondeurs » exprime naturellement en français la recherche poussée de ce qui dépasse l’examen humain, sans réduire le terme à une simple activité d’enquête.
- source_word: אֱלוֹהַ
  choice: Dieu
  rationale: Traduction française courante de ce titre divin singulier dans Job, en parallèle avec שַׁדַּי.
- source_word: תִּמְצָא
  choice: peux-tu sonder
  rationale: מצא signifie fondamentalement « trouver ». Associé à חֵקֶר, le français idiomatique « sonder » rend ici l’idée de parvenir à découvrir par une recherche approfondie.
- source_word: אִם
  choice: peux-tu
  rationale: אִם introduit ici le second membre interrogatif et non une condition. La reprise de « Peux-tu » restitue clairement la question rhétorique et le parallélisme.
- source_word: עַד תַּכְלִית
  choice: atteindre les limites
  rationale: L’expression indique l’extrémité, le terme ou la pleine étendue. « Atteindre les limites » conserve l’image spatiale et convient naturellement avec le verbe « trouver » pris au sens d’atteindre.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Équivalent français traditionnel et intelligible du titre divin Shaddaï, approprié au parallélisme avec « Dieu ».
- source_word: תִּמְצָא
  choice: atteindre
  rationale: La répétition hébraïque de מצא est rendue selon son emploi dans chaque membre. Avec « les limites », « atteindre » exprime naturellement l’idée de parvenir jusqu’à l’extrémité.
theological_decisions:
- issue: Portée de l’impossibilité humaine de connaître Dieu
  choice: Formuler deux questions rhétoriques sur l’incapacité d’épuiser les profondeurs et l’étendue de Dieu
  alternative: Affirmer que Dieu est absolument inconnaissable
  rationale: L’hébreu nie la capacité humaine de parvenir au fond ou au terme de Dieu, mais ne nie pas toute connaissance véritable de Dieu. La traduction préserve cette tension sans ajouter de conclusion doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux interrogations parallèles sont maintenues. « Sonder » et « atteindre » évitent une formulation pesante tout en conservant l’image d’une investigation qui ne parvient ni au fond ni au terme de Dieu.
