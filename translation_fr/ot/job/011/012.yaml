  text: But an empty-headed man will gain understanding when a wild donkey’s colt is born a man[a][b].
translation:
  language: fr
  text: Mais un homme à l’esprit vide acquerra du discernement quand le petit d’un âne sauvage naîtra homme[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « un homme creux recevra un cœur ». Cette expression signifie acquérir du bon sens ou du discernement.'
    reason: lexical_alternative
  - marker: b
    text: 'La phrase est probablement ironique : l’homme dépourvu de bon sens deviendra sage quand le petit d’un âne sauvage naîtra homme. L’hébreu, très elliptique, peut aussi être rendu plus littéralement en coordonnant les deux propositions.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ
  choice: Mais
  rationale: La conjonction prend ici naturellement une valeur adversative dans cette formule ironique.
- source_word: אִישׁ נָבוּב
  choice: un homme à l’esprit vide
  rationale: נָבוּב évoque littéralement ce qui est creux ou vide et qualifie métaphoriquement un homme dépourvu de bon sens.
- source_word: יִלָּבֵב
  choice: acquerra du discernement
  rationale: Le verbe signifie littéralement « recevoir un cœur »; dans l’anthropologie hébraïque, le cœur est notamment le siège de l’intelligence et du jugement.
- source_word: עַיִר פֶּרֶא
  choice: le petit d’un âne sauvage
  rationale: La construction désigne le jeune d’un âne sauvage; « petit » reste clair et naturel sans préciser indûment son sexe.
- source_word: אָדָם יִוָּלֵד
  choice: naîtra homme
  rationale: Cette formulation resserrée conserve l’étrangeté de l’hébreu et son impossible transformation d’un animal en être humain.
theological_decisions:
- issue: Portée ironique de la comparaison
  choice: Formuler la phrase avec « quand », de sorte que l’acquisition du discernement soit liée à l’événement impossible où le petit d’un âne sauvage naîtrait homme.
  alternative: 'Coordonner littéralement les deux propositions : « et le petit d’un âne sauvage naît homme »; ou comprendre le verset comme l’annonce qu’un homme insensé peut devenir sage.'
  rationale: Le texte hébreu est très elliptique et difficile. La lecture ironique rend bien le parallélisme probable, mais elle doit être signalée comme interprétation plutôt que présentée comme incontestable.
translation_notes:
  register: Français international moderne, digne et proverbial. La traduction conserve le masculin explicite de אִישׁ et אָדָם ainsi que l’image volontairement étrange du texte, tout en explicitant l’idiome יִלָּבֵב dans le corps du verset.
