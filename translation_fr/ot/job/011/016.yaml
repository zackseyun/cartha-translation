  text: כִּי אַ֭תָּה עָמָ֣ל תִּשְׁכָּ֑ח כְּ/מַ֖יִם עָבְר֣וּ תִזְכֹּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/016.yaml
  text: For you will forget your misery[a]; you will remember it as waters that have passed by.
translation:
  language: fr
  text: Car tu oublieras ta misère ; tu t’en souviendras comme d’eaux écoulées.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « tu ne t’en souviendras plus que comme d’eaux écoulées ». L’image hébraïque compare la misère passée à des eaux déjà passées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la promesse formulée dans le contexte précédent.
- source_word: אַתָּה
  choice: tu
  rationale: Rend le pronom masculin singulier de deuxième personne ; le français exprime normalement le sujet avec le pronom.
- source_word: עָמָל
  choice: misère
  rationale: Dans ce contexte de souffrance appelée à devenir passée, « misère » rend le malheur éprouvé sans limiter le terme au travail pénible.
- source_word: תִּשְׁכָּח
  choice: oublieras
  rationale: L’imparfait hébreu a ici une valeur future dans la suite des promesses.
- source_word: כְמַיִם
  choice: comme d’une eau
  rationale: La comparaison est conservée ; le singulier collectif « eau » est plus naturel en français moderne que « eaux » dans cette construction.
- source_word: עָבְרוּ
  choice: qui s’est écoulée
  rationale: Le verbe עבר décrit ici une eau déjà passée ; « s’est écoulée » rend naturellement l’image et son aspect accompli.
- source_word: תִזְכֹּר
  choice: tu ne t’en souviendras plus que
  rationale: 'Le verbe signifie littéralement « tu te souviendras ». La tournure restrictive explicite la tension poétique avec « tu oublieras » : le malheur ne subsistera dans la mémoire que comme une eau déjà écoulée.'
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et accessible. La formulation conserve le parallélisme entre oublier la misère et ne plus s’en souvenir que comme d’une eau désormais passée.
