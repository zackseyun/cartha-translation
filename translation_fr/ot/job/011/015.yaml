  text: כִּי אָ֤ז תִּשָּׂ֣א פָנֶ֣י/ךָ מִ/מּ֑וּם וְ/הָיִ֥יתָ מֻ֝צָ֗ק וְ/לֹ֣א תִירָֽא־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/015.yaml
  text: For then you will lift up your face without blemish[b][a]; you will stand firm and will not fear.
translation:
  language: fr
  text: Car alors tu relèveras ton visage, sans tache[a] ; tu seras affermi[b] et tu n’auras pas peur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu garderas la tête haute, sans honte ». L’hébreu dit littéralement « tu relèveras ton visage, sans défaut », image d’une confiance retrouvée et de la délivrance de la honte.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu seras en sécurité » ou « solidement établi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָז
  choice: Car alors
  rationale: 'La combinaison introduit ici la conséquence future des conditions énoncées auparavant : « car alors » garde à la fois la relation logique et la valeur temporelle.'
- source_word: תִּשָּׂא פָנֶיךָ
  choice: tu relèveras le visage
  rationale: Cette formulation conserve l’image hébraïque d’un visage relevé, signe de confiance retrouvée et d’absence de honte, tout en restant naturelle en français.
- source_word: מִמּוּם
  choice: sans tache
  rationale: מוּם désigne proprement un défaut ou une tare. Dans ce contexte métaphorique, « sans tache » préserve l’image d’une absence de souillure ou de défaut sans la réduire explicitement à la honte.
- source_word: וְהָיִיתָ מֻצָק
  choice: tu seras affermi
  rationale: Le participe passif מֻצָק évoque ce qui est rendu ferme, stable ou solidement établi. « Tu seras affermi » respecte cette forme et exprime clairement l’état de stabilité qui en résulte.
- source_word: וְלֹא תִירָא
  choice: et tu n’auras pas peur
  rationale: Traduction directe et idiomatique de la négation future du verbe ירא en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve l’imagerie poétique concrète de l’hébreu tout en signalant en notes ses principales interprétations idiomatiques.
