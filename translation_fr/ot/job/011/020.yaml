    issue: 'Le dernier colon est rendu comme une infinitive : « leur espoir sera de rendre le dernier souffle ».'
    rationale: Le texte hébreu emploie un prédicat nominal difficile (מַפַּח נָפֶשׁ), non un infinitif. La version proposée peut se comprendre comme « ils espéreront mourir », nuance plus interprétative que l’image d’un espoir réduit à une expiration.
  - severity: low
    issue: L’ancre de note est placée après le point final.
    rationale: Puisque la note explique précisément « le dernier souffle », l’ancre doit suivre cette expression, avant la ponctuation finale.
