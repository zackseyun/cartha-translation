base_translation:
  language: en
  yaml_path: translation/ot/job/011/020.yaml
  text: But the eyes of the wicked will fail[a], and refuge will perish from them, and their hope will be the breathing out of life.
translation:
  language: fr
  text: 'Mais les yeux des méchants s’épuiseront,

    tout refuge disparaîtra pour eux,

    et leur espoir ne sera plus qu’un dernier souffle[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est difficile ; littéralement, elle évoque l’expiration du souffle de vie, c’est-à-dire un souffle qui s’éteint.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי רְשָׁעִים
  choice: les yeux des méchants
  rationale: Conserve l’image hébraïque des yeux tout en employant la désignation française courante « les méchants ».
- source_word: תִּכְלֶינָה
  choice: s’épuiseront
  rationale: Avec « les yeux » comme sujet, le verbe exprime l’épuisement ou la défaillance causés par une attente vaine. « S’épuiseront » préserve mieux cette image que le simple « faibliront ».
- source_word: מָנוֹס אָבַד מִנְהֶם
  choice: tout refuge leur sera ôté
  rationale: מָנוֹס peut désigner la fuite, un moyen d’échapper ou un refuge. Cette formulation naturelle exprime la disparition de toute possibilité de salut sans réduire le terme au seul acte de fuir.
- source_word: תִקְוָתָם
  choice: leur espoir
  rationale: Rend directement l’idée d’espoir ou d’attente et maintient le contraste tragique du verset.
- source_word: מַפַּח נָפֶשׁ
  choice: rendre le dernier souffle
  rationale: La locution hébraïque difficile évoque l’expulsion du souffle vital. L’expression française courante conserve clairement l’image de la mort.
theological_decisions:
- issue: Sens de מַפַּח נָפֶשׁ
  choice: leur espoir sera de rendre le dernier souffle
  alternative: leur espoir ne sera qu’un souffle expirant / l’expiration de la vie
  rationale: Le texte associe paradoxalement leur espoir à l’expulsion du souffle vital. La traduction conserve ce lien sans le remplacer par une notion interprétative comme « désespoir ».
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme poétique est conservé sur trois lignes. La formulation maintient les images des yeux épuisés, du refuge disparu et du dernier souffle.
