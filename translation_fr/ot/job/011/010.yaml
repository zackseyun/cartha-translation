  yaml_path: translation/ot/job/011/010.yaml
  text: If he passes by and shuts someone in[a], and calls an assembly[b], then who can turn him back?
translation:
  language: fr
  text: S’il passe, enferme quelqu’un et convoque une assemblée[a], qui peut le faire revenir[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « rassemble » ou « réunit ». Le verbe peut évoquer la convocation d’une assemblée, éventuellement dans un cadre judiciaire.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui peut renverser cela ? » L’hébreu peut se comprendre soit comme le fait de faire revenir celui qui agit (« le »), soit, plus généralement, comme l’annulation de son action.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: S’il
  rationale: La particule introduit ici une hypothèse au sein d’une affirmation rhétorique. « Si » en conserve directement la valeur conditionnelle.
- source_word: יַחֲלֹף
  choice: passe
  rationale: Le verbe חלף évoque le fait de passer ou de traverser. « Passe » reste naturel en français et n’ajoute aucune idée de destruction.
- source_word: וְיַסְגִּיר
  choice: enferme quelqu’un
  rationale: À la forme causative, סגר peut signifier enfermer, emprisonner ou livrer. « Enferme quelqu’un » conserve l’image concrète tout en rendant explicite en français l’objet humain laissé implicite en hébreu.
- source_word: וְיַקְהִיל
  choice: convoque une assemblée
  rationale: La forme causative de קהל signifie rassembler ou réunir. « Convoque une assemblée » exprime cette valeur causative et laisse percevoir une possible scène publique ou judiciaire.
- source_word: וּמִי
  choice: qui
  rationale: La conjonction et l’interrogatif introduisent la conséquence rhétorique. En français, « qui » après la proposition conditionnelle suffit naturellement à porter cette force.
- source_word: יְשִׁיבֶנּוּ
  choice: peut le faire revenir en arrière
  rationale: La forme causative de שוב signifie faire revenir ou ramener. Le pronom masculin singulier est rendu personnellement par « le », tandis que « revenir en arrière » exprime l’idée d’arrêter ou d’inverser son action sans préciser davantage.
theological_decisions:
- issue: Référent des verbes au masculin singulier et du suffixe final
  choice: Dieu est le sujet implicite, et le suffixe final est rendu personnellement par « le ».
  alternative: 'Le suffixe peut être compris de manière plus générale : « qui peut renverser cela ? », c’est-à-dire annuler ce qu’il fait.'
  rationale: Le contexte immédiat porte sur la connaissance et l’action souveraines de Dieu. La lecture personnelle suit le fil du discours, mais l’hébreu permet de comprendre la question comme visant plus largement l’annulation de son action; cette possibilité est donc conservée en note.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La phrase garde la structure conditionnelle et la vigueur de la question rhétorique. L’ajout de « quelqu’un » répond aux exigences idiomatiques du français tout en signalant un objet non précisé.
