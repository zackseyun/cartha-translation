  text: וּֽ֭/מִ/צָּהֳרַיִם יָק֣וּם חָ֑לֶד תָּ֝עֻ֗פָ/ה כַּ/בֹּ֥קֶר תִּהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/017.yaml
  text: And your lifetime will rise brighter than noon[a]; though there is darkness[c][b], it will become like the morning.
translation:
  language: fr
  text: Ta vie se lèvera plus lumineuse que midi[a] ; si l’obscurité est là[b], elle deviendra comme le matin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Ta vie sera plus lumineuse que midi ; l’obscurité sera comme le matin. » L’hébreu emploie des expressions poétiques condensées, surtout dans le second membre du verset.'
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu traduit par « obscurité » est rare et son sens est incertain ; on peut aussi comprendre « ténèbres » ou « pénombre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִצָּהֳרַיִם
  choice: plus lumineuse que midi
  rationale: La préposition מִן peut exprimer ici la comparaison (« plus… que »). La lumière, suggérée par le contraste avec l’obscurité et le matin, est explicitée pour produire en français une image naturelle.
- source_word: יָקוּם
  choice: se lèvera
  rationale: Le verbe קום signifie couramment « se lever, s’élever ». Cette formulation conserve l’image poétique plutôt que de la réduire à « sera ».
- source_word: חָלֶד
  choice: ta vie
  rationale: חֶלֶד peut désigner la durée de la vie ou l’existence terrestre. « Ta vie » est naturel en français et garde une portée suffisamment large.
- source_word: תָּעֻפָה
  choice: obscurité
  rationale: Ce terme rare et incertain est traditionnellement compris comme désignant l’obscurité ou une profonde pénombre, ce qui convient au contraste avec le matin.
- source_word: כַּבֹּקֶר
  choice: comme le matin
  rationale: La préposition כ marque la comparaison, et בֹּקֶר signifie « matin ». La traduction conserve directement la comparaison hébraïque.
- source_word: תִּהְיֶה
  choice: elle deviendra
  rationale: Même si היה signifie souvent « être », « deviendra » rend ici la transformation poétique de l’obscurité en clarté matinale.
