  text: 'Alors Tsophar le Naamatite répondit et dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: prit la parole
  rationale: Dans cette formule narrative introduisant une réplique, ענה signifie « répondre ». En français actuel, « prit la parole » rend naturellement l’ouverture de la réponse, tandis que le contexte dialogique en conserve le sens.
- source_word: צֹפַר
  choice: Tsophar
  rationale: Le nom propre est translittéré selon une forme française établie qui représente le ṣ initial de l’hébreu.
- source_word: הַנַּעֲמָתִי
  choice: le Naamatite
  rationale: L’adjectif gentilé désigne l’origine ou l’association géographique de Tsophar. « Naamatite » est la forme traditionnelle et concise en français.
- source_word: וַיֹּאמַר
  choice: ':'
  rationale: Dans la séquence וַיַּעַן … וַיֹּאמַר, le français idiomatique peut réunir « répondit et dit » en « prit la parole », puis introduire directement le discours par deux-points. Le contenu fonctionnel des deux verbes est ainsi conservé sans lourdeur.
