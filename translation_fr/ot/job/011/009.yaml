  text: אֲרֻכָּ֣ה מֵ/אֶ֣רֶץ מִדָּ֑/הּ וּ֝/רְחָבָ֗ה מִנִּי יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/009.yaml
  text: Its measure is longer than the earth and broader than the sea[a].
translation:
  language: fr
  text: Son étendue dépasse la terre en longueur et la mer en largeur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sa mesure est plus longue que la terre et plus large que la mer. »'
    reason: Formulation plus littérale de מִדָּהּ (« sa mesure ») et des deux adjectifs comparatifs.
lexical_decisions:
- source_word: אֲרֻכָּה
  choice: plus longue
  rationale: L’adjectif féminin singulier s’accorde avec מִדָּהּ (« sa mesure »). Avec מִן comparatif, « plus longue que » est la formulation française naturelle.
- source_word: מֵאֶרֶץ
  choice: que la terre
  rationale: Le préfixe מִן marque ici la comparaison et non la provenance. Dans le parallélisme cosmique avec « la mer », אֶרֶץ se rend le mieux par « la terre ».
- source_word: מִדָּהּ
  choice: sa mesure
  rationale: מִדָּה désigne la mesure, la dimension ou l’étendue. « Sa mesure » conserve l’image concrète et l’ambiguïté du suffixe féminin, dont le référent ressort du contexte précédent.
- source_word: וּרְחָבָה
  choice: et plus large
  rationale: L’adjectif féminin singulier est parallèle à אֲרֻכָּה. Le second מִן étant comparatif, « plus large » exprime clairement le rapport.
- source_word: מִנִּי יָם
  choice: que la mer
  rationale: מִנִּי est une forme poétique de מִן employée pour la comparaison. « La mer » rend directement יָם et préserve le parallélisme avec « la terre ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme hébreu est conservé, ainsi que le féminin singulier de « mesure ».
