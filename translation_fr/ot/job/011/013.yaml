  text: אִם אַ֭תָּ֗ה הֲכִינ֣וֹתָ לִבֶּ֑/ךָ וּ/פָרַשְׂתָּ֖ אֵלָ֣י/ו כַּפֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/013.yaml
  text: If you prepare your heart and stretch out your hands to him,[a]
translation:
  language: fr
  text: Si tu prépares ton cœur et que tu tends les mains vers lui,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu étends ta main vers lui ». L’hébreu emploie un nom singulier signifiant « paume » ou « main », mais l’expression évoque couramment le geste de prière accompli les mains tendues.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit la condition formulée par Tsofar et conserve sa portée sans la renforcer.
- source_word: אַתָּה
  choice: tu
  rationale: Rend le pronom masculin singulier adressé directement à Job; en français, le pronom sujet est grammaticalement nécessaire.
- source_word: הֲכִינוֹתָ
  choice: disposes
  rationale: Le hiphil de כון exprime ici l’idée de rendre ferme, prêt ou bien orienté. « Disposer son cœur » est naturel et digne, tout en évitant de préciser indûment la nature de l’action intérieure.
- source_word: לִבֶּךָ
  choice: ton cœur
  rationale: Conserve le terme anthropologique hébreu, qui englobe la pensée, la volonté et la vie intérieure.
- source_word: וּפָרַשְׂתָּ
  choice: et tends
  rationale: פרשׂ signifie étendre ou déployer; « tendre les mains » exprime naturellement en français le geste de prière évoqué.
- source_word: אֵלָיו
  choice: vers lui
  rationale: La préposition marque une orientation en direction d’un référent masculin singulier. « Vers lui » préserve cette nuance directionnelle.
- source_word: כַּפֶּךָ
  choice: les mains
  rationale: Le nom hébreu est singulier (« ta paume/ta main »), mais peut désigner le geste de prière; le pluriel est l’expression française la plus idiomatique.
theological_decisions:
- issue: Référent du pronom dans אֵלָיו
  choice: Conserver le pronom « lui », dont le contexte indique qu’il renvoie à Dieu.
  alternative: Expliciter « vers Dieu ».
  rationale: Le texte hébreu emploie un pronom et non le nom divin. Le conserver évite d’ajouter une précision absente, tout en laissant le contexte identifier clairement le référent.
translation_notes:
  register: Français international moderne, accessible et digne. « Disposer son cœur » conserve la densité de l’expression hébraïque; « tendre les mains » rend naturellement le geste de supplication. Le verset demeure une proposition conditionnelle inachevée, poursuivie au verset suivant.
