  text: הֲ/רֹ֣ב דְּ֭בָרִים לֹ֣א יֵעָנֶ֑ה וְ/אִם אִ֖ישׁ שְׂפָתַ֣יִם יִצְדָּֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/002.yaml
  text: Should a multitude of words go unanswered[a], and should a man of lips be proved right?
translation:
  language: fr
  text: Un flot de paroles restera-t-il sans réponse ? Et un homme qui parle beaucoup aura-t-il raison[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « un homme de lèvres » : une personne caractérisée par ses paroles, probablement nombreuses ou creuses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב דְּבָרִים
  choice: La multitude des paroles
  rationale: רֹב avec דְּבָרִים exprime une grande quantité de paroles. « La multitude des paroles » conserve l’image et la portée critique de l’hébreu.
- source_word: לֹא יֵעָנֶה
  choice: restera-t-elle sans réponse
  rationale: Le niphal de ענה a ici le sens passif d’« être répondu ». Cette formulation française naturelle maintient la question rhétorique.
- source_word: וְאִם
  choice: Et
  rationale: Dans ce parallélisme poétique, וְאִם introduit la seconde interrogation plutôt qu’une véritable condition. « Et » restitue sobrement l’enchaînement.
- source_word: אִישׁ שְׂפָתַיִם
  choice: un homme de paroles
  rationale: L’expression signifie littéralement « un homme de lèvres » et caractérise quelqu’un par son abondance de paroles. « Homme de paroles » préserve l’image sans imposer les nuances plus précises de « bavard » ou de « beau parleur ».
- source_word: יִצְדָּק
  choice: aura-t-il raison
  rationale: Le qal de צדק exprime ici le fait d’être ou d’apparaître dans son bon droit. « Avoir raison » communique clairement ce sens dans le débat, sans introduire inutilement le vocabulaire théologique de la justification.
theological_decisions:
- issue: Portée de צדק dans le contexte du débat
  choice: aura-t-il raison
  alternative: sera-t-il déclaré juste
  rationale: Le contexte porte sur la validité des propos de Job. La traduction retenue garde la portée évaluative du verbe tout en évitant de résoudre le verset en une déclaration sur la justice morale ou le salut.
translation_notes:
  register: Français moderne, soutenu mais accessible. Le parallélisme interrogatif et l’image hébraïque des paroles sont conservés ; l’idiome inhabituel est éclairé en note.
