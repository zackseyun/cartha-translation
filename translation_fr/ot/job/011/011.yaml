id: JOB.11.11
reference: Job 11:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי ה֭וּא יָדַ֣ע מְתֵי שָׁ֑וְא וַ/יַּרְא אָ֝֗וֶן וְ/לֹ֣א יִתְבּוֹנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/011.yaml
  text: For he knows men of falsehood; when he sees wickedness[a], does he not take notice?
translation:
  language: fr
  text: Car il connaît les gens faux ; quand il voit le mal, n’y prête-t-il pas attention ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et il n’y prête pas attention ». La proposition hébraïque finale peut se lire comme une simple négation, mais le contexte favorise fortement la question rhétorique : « n’y prête-t-il pas attention ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison qui appuie l’affirmation de Tsophar ; « Car » rend naturellement ce lien argumentatif.
- source_word: הוּא
  choice: il
  rationale: Le pronom renvoie à Dieu dans le contexte. La minuscule suit l’usage courant du français moderne.
- source_word: יָדַע
  choice: connaît
  rationale: Le parfait exprime ici une connaissance constante et établie de Dieu ; le présent convient à cette vérité générale.
- source_word: מְתֵי שָׁוְא
  choice: les gens faux
  rationale: מְתֵי désigne des personnes, tandis que שָׁוְא peut évoquer la fausseté, la tromperie, le vide ou l’inanité. « Les gens faux » garde la portée morale de l’expression dans un français naturel, sans la réduire à la seule tromperie explicite.
- source_word: וַיַּרְא
  choice: quand il voit
  rationale: La proposition est rendue comme une circonstance temporelle liée à la question rhétorique qui suit, ce qui restitue naturellement l’enchaînement hébreu.
- source_word: אָוֶן
  choice: le mal
  rationale: Le terme peut désigner l’iniquité, le mal et parfois les conséquences pénibles qu’il produit. « Le mal » conserve cette relative ampleur sémantique sans employer un mot archaïque.
- source_word: וְלֹא יִתְבּוֹנָן
  choice: n’y prête-t-il pas attention ?
  rationale: 'Le verbe exprime l’idée d’examiner, de considérer ou de remarquer attentivement. La question rhétorique convient au raisonnement : Dieu connaît les gens faux et voit le mal, il ne manque donc pas de le remarquer.'
theological_decisions:
- issue: Valeur de la proposition finale וְלֹא יִתְבּוֹנָן
  choice: 'Question rhétorique : « n’y prête-t-il pas attention ? »'
  alternative: 'Négation déclarative : « sans y prêter attention » ou « et il n’y prête pas attention »'
  rationale: 'La syntaxe consonantique permet de comprendre une négation simple, mais le contexte soutient fortement une question rhétorique : Tsophar affirme que Dieu connaît les êtres humains faux et voit leur mal. L’autre lecture, réellement possible, est donc conservée en note plutôt qu’effacée.'
translation_notes:
  register: Français international moderne, naturel et digne. « Les gens faux » évite le tour peu idiomatique « les hommes de fausseté » ; « le mal » reste accessible tout en préservant l’étendue possible de אָוֶן. La ponctuation fait ressortir le mouvement argumentatif et la question rhétorique.
