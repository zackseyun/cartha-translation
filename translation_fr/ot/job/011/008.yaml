id: JOB.11.8
reference: Job 11:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גָּבְהֵ֣י שָׁ֭מַיִם מַה תִּפְעָ֑ל עֲמֻקָּ֥ה מִ֝/שְּׁא֗וֹל מַה תֵּדָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/008.yaml
  text: It is higher than the heavens—what can you do? Deeper than Sheol—what can you know?[a]
translation:
  language: fr
  text: Elle est plus haute que les cieux — que peux-tu faire ? Plus profonde que le Shéol — que peux-tu savoir ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « plus profonde que la tombe » ou « plus profonde que le séjour des morts ». Hébreu : Shéol.'
    reason: Alternative lexicale pour שְׁאוֹל, terme désignant le domaine des morts et non nécessairement la seule tombe physique.
lexical_decisions:
- source_word: גָּבְהֵי שָׁמַיִם
  choice: plus haute que les cieux
  rationale: Le groupe construit évoque les hauteurs des cieux. La formulation comparative, naturelle en français et soutenue par le parallélisme avec le second membre, décrit la sagesse divine évoquée au verset précédent.
- source_word: מַה
  choice: que
  rationale: Le pronom interrogatif introduit dans les deux membres une question rhétorique directe.
- source_word: תִּפְעָל
  choice: peux-tu faire
  rationale: L’imparfait qal de פעל signifie « faire, accomplir » ; dans cette question rhétorique, il exprime la capacité humaine plutôt qu’un simple futur.
- source_word: עֲמֻקָּה
  choice: plus profonde
  rationale: L’adjectif féminin renvoie au sujet implicite hérité du contexte. Le comparatif maintient le parallélisme poétique avec « plus haute ».
- source_word: מִשְּׁאוֹל
  choice: que le Shéol
  rationale: La préposition מִן marque ici la comparaison. « Shéol » conserve le concept hébreu du séjour des morts sans le réduire à la tombe physique.
- source_word: תֵּדָע
  choice: peux-tu savoir
  rationale: L’imparfait qal de ידע signifie « savoir, connaître ». En parallèle avec « peux-tu faire », il souligne par une question rhétorique les limites humaines.
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: le Shéol
  alternative: la tombe ; le séjour des morts
  rationale: La translittération préserve l’étendue du concept hébreu et la tension poétique sans le réduire à une sépulture ni imposer une description plus précise de l’au-delà. Une note donne les principales équivalences possibles.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement singulier reflète les formes verbales hébraïques à la deuxième personne masculine du singulier. Les deux questions parallèles et le sujet féminin implicite issu du contexte sont conservés.
