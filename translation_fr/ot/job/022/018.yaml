source:
  edition: WLC
  text: וְ/ה֤וּא מִלֵּ֣א בָתֵּי/הֶ֣ם ט֑וֹב וַ/עֲצַ֥ת רְ֝שָׁעִ֗ים רָ֣חֲקָה מֶֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/018.yaml
  text: Yet he filled their houses with good things[b][a], but the counsel of the wicked is far from me.
translation:
  language: fr
  text: Pourtant, c’est lui qui a rempli leurs maisons de bonnes choses[a] ; mais le conseil des méchants est loin de moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de bien » ; le terme peut désigner de bonnes choses, des bienfaits ou la prospérité.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « Que le conseil des méchants soit loin de moi ! » L’hébreu se présente plus directement comme une déclaration.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: Pourtant, c’est lui
  rationale: Le pronom explicite met Dieu en relief, tandis que la conjonction marque le contraste avec l’attitude des méchants évoquée au verset précédent.
- source_word: מִלֵּא
  choice: avait rempli
  rationale: Le verbe signifie « remplir ». Le plus-que-parfait situe naturellement cette bienveillance divine avant le rejet décrit dans le contexte immédiat.
- source_word: בָתֵּיהֶם
  choice: leurs maisons
  rationale: La traduction conserve l’image concrète de l’hébreu, qui peut aussi englober leurs foyers et leurs biens.
- source_word: טוֹב
  choice: de biens
  rationale: Le singulier substantivé « bien » désigne ici de bonnes choses ou des bienfaits. « De biens » est idiomatique en français tout en restant proche de l’image hébraïque.
- source_word: וַעֲצַת
  choice: mais le conseil
  rationale: La conjonction prend ici une valeur adversative. « Conseil » préserve la portée de עֵצָה, qui peut désigner un avis, un projet ou une ligne de conduite.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Le pluriel substantivé désigne les personnes moralement mauvaises ; « les méchants » est une formulation française claire et traditionnelle.
- source_word: רָחֲקָה מֶנִּי
  choice: est loin de moi
  rationale: Le qatal exprime ici naturellement un état présent de distance ou de rejet. La formulation conserve la déclaration du locuteur sans la transformer en souhait.
theological_decisions:
- issue: Valeur de la dernière proposition
  choice: 'Déclaration : « le conseil des méchants est loin de moi »'
  alternative: 'Souhait : « que le conseil des méchants soit loin de moi »'
  rationale: L’hébreu emploie un qatal, non un impératif ni un jussif. La traduction principale conserve donc la valeur déclarative tout en signalant l’autre compréhension possible.
- issue: Identité du sujet mis en relief
  choice: « c’est lui », renvoyant à Dieu
  alternative: Simple pronom « il » sans mise en relief
  rationale: 'Le pronom indépendant הוּא est explicitement présent et contraste avec le rejet de Dieu par les méchants : eux le repoussaient, alors que lui remplissait leurs maisons de biens.'
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « c’est lui qui » rend l’emphase du pronom hébreu ; le point-virgule distingue les deux membres poétiques sans durcir artificiellement leur opposition.
