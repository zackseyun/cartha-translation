  terminology: « Le Tout-Puissant » est un rendu français établi et transparent de שַׁדַּי. « Dieu » rend sobrement אֱלוֹהַּ. Les notes proposent une alternative lexicale recevable et expliquent l’idiome sans imposer une lecture doctrinale unique.
