  source_fidelity: Le texte rend correctement כִּי אָז par « Car alors », le titre divin שַׁדַּי par « le Tout-Puissant », et le futur conséquentiel des deux verbes. « Trouveras ta joie dans le Tout-Puissant » exprime fidèlement le sens de תִּתְעַנָּג עַל. « Tu lèveras ton visage vers Dieu » conserve l’image et l’ouverture sémantique de וְתִשָּׂא אֶל־אֱלוֹהַּ פָּנֶיךָ sans la réduire à la prière ou à la faveur divine.
