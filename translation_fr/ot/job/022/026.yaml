id: JOB.22.26
reference: Job 22:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי אָ֭ז עַל שַׁדַּ֣י תִּתְעַנָּ֑ג וְ/תִשָּׂ֖א אֶל אֱל֣וֹהַּ פָּנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/026.yaml
  text: For then you will delight yourself in the Almighty[b][a], and lift up your face to God.
translation:
  language: fr
  text: Car alors tu trouveras ta joie dans le Tout-Puissant[a], et tu lèveras ton visage vers Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu prendras plaisir dans le Tout-Puissant ».'
    reason: lexical_alternative
  - marker: b
    text: « Lever son visage vers Dieu » peut évoquer une approche confiante, une faveur retrouvée ou une prière pleine d’assurance.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אָז
  choice: Car alors
  rationale: כִּי relie ce résultat à l’exhortation précédente, tandis que אָז en marque le moment ou la conséquence. « Car alors » conserve les deux nuances sans alourdir la phrase.
- source_word: עַל שַׁדַּי
  choice: dans le Tout-Puissant
  rationale: Avec תתענג, עַל introduit l’objet de la joie. « Dans » est idiomatique en français. שַׁדַּי est rendu par le titre traditionnel et intelligible « le Tout-Puissant ».
- source_word: תִּתְעַנָּג
  choice: tu trouveras ta joie
  rationale: Le hitpael de ענג exprime le fait d’éprouver personnellement joie et délectation. Cette formulation française naturelle garde cette implication sans suggérer que l’on se réjouit de soi-même.
- source_word: וְתִשָּׂא
  choice: et tu lèveras
  rationale: Le verbe נשׂא signifie ici « lever » dans l’expression concrète « lever son visage ». Le futur convient à la suite des conséquences annoncées.
- source_word: אֶל אֱלוֹהַּ
  choice: vers Dieu
  rationale: אֶל marque la direction, naturellement rendue par « vers » avec le verbe « lever ». אֱלוֹהַּ est le singulier poétique désignant Dieu, sans titre supplémentaire.
- source_word: פָּנֶיךָ
  choice: ton visage
  rationale: 'La traduction littérale préserve l’image hébraïque et son éventail de sens : assurance, faveur restaurée ou prière confiante.'
theological_decisions:
- issue: Sens idiomatique de « lever son visage vers Dieu »
  choice: 'Conserver l’image concrète : « tu lèveras ton visage vers Dieu »'
  alternative: « tu t’approcheras de Dieu avec assurance » ou « tu prieras Dieu avec confiance »
  rationale: L’idiome peut évoquer une approche assurée, la faveur retrouvée ou une prière confiante. Le conserver évite de réduire sa portée théologique à une seule interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. « Trouver sa joie dans » est plus courant que le calque « se délecter dans », tandis que « lever son visage » conserve volontairement la poésie et l’ambiguïté de l’idiome hébreu.
