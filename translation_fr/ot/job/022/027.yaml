source:
  edition: WLC
  text: תַּעְתִּ֣יר אֵ֭לָי/ו וְ/יִשְׁמָעֶ֑/ךָּ וּ/נְדָרֶ֥י/ךָ תְשַׁלֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/027.yaml
  text: You will pray to him[a], and he will hear you, and you will fulfill your vows.
translation:
  language: fr
  text: Tu le prieras, et il t’écoutera ; tu accompliras tes vœux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tu paieras tes vœux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעְתִּיר
  choice: tu prieras
  rationale: Le hiphil de עתר exprime une supplication adressée avec insistance. Dans ce contexte, « prier » est naturel en français moderne et conserve le sens de la demande religieuse.
- source_word: אֵלָיו
  choice: le
  rationale: La préposition אֶל avec le suffixe masculin singulier signifie « vers lui » ou « à lui ». Le pronom « le » renvoie naturellement à Dieu, mentionné dans le contexte, sans répéter son nom.
- source_word: וְיִשְׁמָעֶךָּ
  choice: et il t’écoutera
  rationale: שׁמע signifie « entendre » ou « écouter ». « Il t’écoutera » exprime ici l’attention favorable accordée à la prière sans aller jusqu’à traduire explicitement « il te répondra ».
- source_word: וּנְדָרֶיךָ
  choice: tes vœux
  rationale: נֶדֶר désigne un engagement solennel pris envers Dieu. « Tes vœux » en rend directement le pluriel avec suffixe possessif, sans ajouter l’idée plus précise d’offrandes votives.
- source_word: תְשַׁלֵּם
  choice: tu accompliras
  rationale: Le piel de שלם, avec « vœux » comme complément, signifie s’acquitter de ce qui a été promis. « Accomplir ses vœux » restitue clairement cet idiome en français actuel, tandis que « payer » risquerait d’être compris dans un sens seulement financier.
theological_decisions:
- issue: Faut-il rendre la dernière proposition littéralement par « payer ses vœux » ou idiomatiquement par « accomplir ses vœux » ?
  choice: tu accompliras tes vœux
  alternative: tu paieras tes vœux
  rationale: L’expression hébraïque évoque l’exécution de ce qui a été promis à Dieu. « Accomplir » en communique le sens religieux et moral en français moderne, sans réduire l’obligation à un paiement monétaire.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme des trois propositions au futur est conservé. « Écoutera » préserve mieux que « répondra » la portée du verbe hébreu, et la note maintient l’image littérale de la dernière proposition.
