source:
  edition: WLC
  text: הֲ/לֹ֣א רָעָֽתְ/ךָ֣ רַבָּ֑ה וְ/אֵֽין קֵ֝֗ץ לַ/עֲוֺנֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/005.yaml
  text: Is not your evil abundant[b][a], and there is no end to your iniquities?
translation:
  language: fr
  text: Ta méchanceté n’est-elle pas grande[a], et tes fautes sans fin[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton mal ». Le mot hébreu peut aussi désigner le malheur dans d’autres contextes, mais son parallèle avec « tes fautes » indique ici le mal moral.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et il n’y a pas de fin à tes fautes » ; autre traduction : « tes fautes sont sans limite ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: n’est-elle pas
  rationale: Conserve la forme de la question rhétorique, qui appelle une réponse affirmative et porte l’accusation d’Élifaz.
- source_word: רָעָתְךָ
  choice: ta méchanceté
  rationale: Dans le parallélisme avec « tes fautes », le terme désigne ici le mal moral plutôt que le malheur. « Méchanceté » rend ce sens clairement en français courant.
- source_word: רַבָּה
  choice: grande
  rationale: Rend directement l’idée d’ampleur ou d’abondance et s’emploie naturellement avec « méchanceté ».
- source_word: וְאֵין קֵץ
  choice: et … sans fin
  rationale: Formulation française concise et naturelle qui conserve l’idée littérale d’absence de fin ou de limite.
- source_word: לַעֲוֺנֹתֶיךָ
  choice: tes fautes
  rationale: עָוֹן désigne des actes moralement coupables et peut aussi évoquer la culpabilité qui en résulte. « Fautes » reste clair pour le lecteur moderne tout en gardant le pluriel accusateur.
theological_decisions:
- issue: Accusation morale ou description du malheur dans רָעָתְךָ
  choice: 'Accusation morale : « ta méchanceté »'
  alternative: « ton malheur » ou « tes malheurs »
  rationale: רָעָה peut désigner le malheur dans certains contextes, mais son parallélisme avec « tes fautes » indique ici qu’Élifaz accuse Job de mal agir. La traduction ne transforme donc pas cette accusation en simple description de ses souffrances.
translation_notes:
  register: Français moderne, direct et digne. La question rhétorique et le parallélisme accusateur sont préservés. « Méchanceté » évite l’ambiguïté française de « ton mal », qui pourrait être compris comme la souffrance de Job, tandis que « fautes » est plus courant aujourd’hui qu’« iniquités ».
