reference: Job 22:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲֽ/לֹא אֱ֭לוֹהַּ גֹּ֣בַהּ שָׁמָ֑יִם וּ/רְאֵ֤ה רֹ֖אשׁ כּוֹכָבִ֣ים כִּי רָֽמּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/012.yaml
  text: Is not God in the height of heaven? And see the highest stars[b][a], how lofty they are.
translation:
  language: fr
  text: 'Dieu n’est-il pas dans les hauteurs du ciel[a] ? Regarde les étoiles les plus hautes[b] : combien elles sont hautes !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au plus haut du ciel ». L’hébreu dit littéralement « la hauteur du ciel ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la tête » ou « le sommet des étoiles » ; l’expression désigne ici les étoiles les plus hautes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: n’est-il pas
  rationale: Cette tournure conserve la question rhétorique qui appelle l’assentiment, dans un français naturel et digne.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Équivalent français simple du terme singulier désignant Dieu, sans ajout interprétatif.
- source_word: גֹּבַהּ שָׁמָיִם
  choice: dans les hauteurs du ciel
  rationale: La formulation rend l’image spatiale de la hauteur céleste. Le pluriel français « hauteurs » est idiomatique, tandis que l’hébreu présente littéralement « la hauteur du ciel ».
- source_word: וּרְאֵה
  choice: Regarde
  rationale: L’impératif invite directement l’interlocuteur à observer. En français, l’absence de « et » à l’ouverture de la seconde phrase rend l’enchaînement plus naturel sans modifier sa fonction.
- source_word: רֹאשׁ כּוֹכָבִים
  choice: les étoiles les plus hautes
  rationale: רֹאשׁ signifie littéralement « tête » ou « sommet » et désigne ici, de manière idiomatique, ce qui est au plus haut parmi les étoiles.
- source_word: כִּי
  choice: combien
  rationale: Dans ce contexte, כִּי introduit une observation exclamative sur la hauteur des étoiles; « combien » restitue naturellement cette valeur en français.
- source_word: רָמּוּ
  choice: elles sont hautes
  rationale: Le verbe רום exprime ici l’élévation physique. « Hautes » convient mieux à l’image astronomique que « exaltées », qui pourrait évoquer l’honneur.
theological_decisions:
- issue: La question peut-elle être développée comme une affirmation de l’éloignement ou de la transcendance de Dieu ?
  choice: Conserver la question rhétorique et son image spatiale sans explicitation théologique supplémentaire.
  alternative: Paraphraser en insistant sur l’éloignement de Dieu ou sur une critique implicite de Job.
  rationale: Le verset appartient au discours d’Éliphaz et évoque la position élevée de Dieu ainsi que la hauteur des étoiles. La traduction préserve cette rhétorique sans tirer une conclusion théologique que le texte n’énonce pas encore.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. La ponctuation met en relief l’appel à observer puis l’exclamation, tout en gardant la tension rhétorique du discours d’Éliphaz.
