source:
  edition: WLC
  text: עַל כֵּ֭ן סְבִיבוֹתֶ֣י/ךָ פַחִ֑ים וִֽ֝/יבַהֶלְ/ךָ פַּ֣חַד פִּתְאֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/010.yaml
  text: Therefore snares are all around you[a], and sudden terror terrifies you.
translation:
  language: fr
  text: C’est pourquoi des pièges t’entourent, et une terreur soudaine t’épouvante[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et la terreur t’épouvante soudain ».'
    reason: L’adverbe פִּתְאֹם peut être compris avec le verbe (« soudain ») plutôt qu’avec le nom sous la forme française « une terreur soudaine ».
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution introduit la conséquence que l’orateur tire des accusations précédentes; « C’est pourquoi » en conserve clairement la valeur logique.
- source_word: סְבִיבוֹתֶיךָ פַחִים
  choice: des pièges t’entourent
  rationale: פַחִים désigne des pièges ou des lacets, tandis que סְבִיבוֹתֶיךָ exprime l’idée d’être tout autour de la personne. Cette formulation est naturelle en français et garde l’image de dangers qui encerclent Job.
- source_word: וִיבַהֶלְךָ
  choice: t’épouvante
  rationale: Le verbe בהל exprime le fait d’alarmer, de terrifier ou de jeter dans l’affolement. « T’épouvante » restitue directement son intensité sans atténuation interprétative.
- source_word: פַּחַד
  choice: une terreur
  rationale: Le nom désigne une peur intense, une frayeur ou une terreur. « Terreur » convient au registre poétique et à la force de l’énoncé.
- source_word: פִּתְאֹם
  choice: soudaine
  rationale: L’adverbe signifie « soudain ». Son rendu adjectival avec « terreur » produit un français fluide tout en conservant l’idée d’irruption inattendue; l’autre rattachement possible est signalé en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le tutoiement correspond à l’adresse directe au singulier. La formulation conserve le ton accusateur d’Élifaz sans valider explicitement son raisonnement.
