translation_notes:
  register: Français moderne, clair et digne. L'imparfait inscrit les accusations d'Éliphaz dans une série de comportements reprochés à Job. L'image hébraïque des bras est conservée sans trancher entre atteinte concrète et destruction figurée de la force.
