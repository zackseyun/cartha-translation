  text: אַ֭לְמָנוֹת שִׁלַּ֣חְתָּ רֵיקָ֑ם וּ/זְרֹע֖וֹת יְתֹמִ֣ים יְדֻכָּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/009.yaml
  text: You sent widows away empty[c][b][a], and the arms of orphans were crushed.
translation:
  language: fr
  text: Tu as renvoyé les veuves les mains vides, et les bras des orphelins[a] ont été brisés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des enfants sans père ».
    reason: lexical_alternative
  - marker: b
    text: 'Le mot hébreu rendu par « bras » peut aussi désigner leur force ou leur puissance. Autre traduction : « ont été écrasés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנוֹת
  choice: les veuves
  rationale: Sens usuel du pluriel hébreu; le terme conserve la vulnérabilité sociale et juridique évoquée dans le contexte.
- source_word: שִׁלַּחְתָּ רֵיקָם
  choice: tu renvoyais… les mains vides
  rationale: Le piel de שלח exprime ici le renvoi, et רֵיקָם signifie « sans rien » ou « les mains vides ». Cette formulation est naturelle en français et rend clairement l'accusation.
- source_word: זְרֹעוֹת
  choice: les bras
  rationale: Le sens concret est « bras », avec une possible connotation de force ou de puissance. Garder l'image physique préserve l'ambiguïté poétique de l'hébreu.
- source_word: יְתֹמִים
  choice: des orphelins
  rationale: Le mot désigne des enfants privés de père et donc particulièrement vulnérables. « Orphelins » est le terme français courant, tandis qu'une note précise la nuance sociale possible.
- source_word: יְדֻכָּא
  choice: étaient brisés
  rationale: Le passif de דכא évoque le fait d'être écrasé ou brisé. « Brisés » s'associe naturellement aux « bras » tout en permettant une lecture figurée portant sur la force des orphelins; le pluriel suit l'accord idiomatique français malgré la forme verbale hébraïque singulière.
