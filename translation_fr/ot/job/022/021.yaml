source:
  edition: WLC
  text: הַסְכֶּן נָ֣א עִמּ֑/וֹ וּ/שְׁלם בָּ֝/הֶ֗ם תְּֽבוֹאַתְ/ךָ֥ טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/021.yaml
  text: Come to terms with him, please, and be at peace; by this good will come to you.
translation:
  language: fr
  text: Entends-toi donc avec lui et sois en paix ; par là, du bien te viendra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par eux ». Le pluriel hébreu a un référent incertain.'
    reason: Signaler le pluriel inhabituel de בָּהֶם sans imposer une identification conjecturale de son référent.
lexical_decisions:
- source_word: הַסְכֶּן
  choice: Entends-toi
  rationale: L’impératif appelle à se mettre en bons termes avec quelqu’un. « Entends-toi avec lui » exprime cette idée naturellement sans confondre ce premier appel avec l’impératif suivant, « sois en paix ».
- source_word: נָא
  choice: donc
  rationale: La particule adoucit ou renforce ici l’exhortation. En français, « donc » convient mieux au ton pressant du discours qu’un « s’il te plaît » trop conversationnel.
- source_word: וּשְׁלם
  choice: et sois en paix
  rationale: Rend directement l’impératif fondé sur la racine שׁלם, avec son idée de paix et de relation rétablie.
- source_word: בָּהֶם
  choice: par là
  rationale: Le pronom hébreu est au pluriel, littéralement « par eux/ces moyens », et renvoie vraisemblablement aux exhortations précédentes. « Par là » est idiomatique tout en conservant le lien instrumental.
- source_word: תְּבוֹאַתְךָ טוֹבָה
  choice: du bien te viendra
  rationale: Conserve le mouvement verbal de « venir » et le sens large de טוֹבָה, sans le réduire au bonheur émotionnel ni à la seule prospérité matérielle.
theological_decisions:
- issue: Identification du référent masculin singulier « lui »
  choice: Conserver « lui » sans explicitation
  alternative: Traduire « Dieu »
  rationale: Le contexte identifie probablement Dieu, mais le verset emploie un pronom. Garder le pronom respecte la formulation du texte et évite une explicitation inutile.
- issue: Nature du « bien » promis
  choice: Employer le terme général « du bien »
  alternative: « le bonheur » ou « la prospérité »
  rationale: Le mot hébreu reste large. Une formulation générale préserve la portée et la tension de la promesse d’Élifaz sans lui imposer une lecture matérielle ou psychologique.
translation_notes:
  register: Français international actuel, sobre et digne. L’exhortation demeure directe, tandis que la formulation évite aussi bien l’archaïsme que le langage trop familier.
