id: JOB.22.15
reference: Job 22:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/אֹ֣רַח עוֹלָ֣ם תִּשְׁמֹ֑ר אֲשֶׁ֖ר דָּרְכ֣וּ מְתֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/015.yaml
  text: Will you keep to the ancient path that men of wickedness have trodden?[a][b]
translation:
  language: fr
  text: Veux-tu suivre l’ancien sentier qu’ont foulé les hommes malfaisants ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sentier d’autrefois » ou « le sentier séculaire ». L’expression hébraïque évoque ici un chemin suivi depuis longtemps dans le passé, sans nécessairement signifier qu’il est éternel.
    reason: lexical_alternative
  - marker: b
    text: Ou « les hommes mauvais » ou « les hommes iniques ». L’expression hébraïque signifie littéralement « les hommes de méchanceté »; le dernier mot peut aussi évoquer le mal, l’iniquité ou le malheur.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרַח
  choice: le sentier
  rationale: אֹרַח désigne un sentier ou un chemin, souvent comme image d’une conduite. « Sentier » conserve cette image concrète en français naturel.
- source_word: עוֹלָם
  choice: ancien
  rationale: Ici, עוֹלָם qualifie vraisemblablement un sentier emprunté depuis longtemps, dans le passé, sans nécessairement exprimer l’éternité.
- source_word: תִּשְׁמֹר
  choice: veux-tu suivre
  rationale: Le sens littéral est « garder, observer ». Avec un sentier pour complément, le français idiomatique « suivre » exprime l’idée d’adopter cette voie; la forme interrogative rend l’imparfait hébreu dans ce contexte.
- source_word: אֲשֶׁר
  choice: qu’
  rationale: Le pronom relatif introduit la proposition qui décrit le sentier.
- source_word: דָּרְכוּ
  choice: ont foulé
  rationale: Le verbe דרך signifie marcher sur ou fouler. « Ont foulé » maintient l’image concrète du sentier.
- source_word: מְתֵי אָוֶן
  choice: les hommes malfaisants
  rationale: L’expression désigne littéralement des « hommes de אָוֶן ». Dans ce contexte moral, « malfaisants » rend leur caractère mauvais sans alourdir la phrase.
theological_decisions:
- issue: Portée de עוֹלָם
  choice: ancien
  alternative: éternel
  rationale: Le contexte renvoie à la voie de personnes mauvaises d’autrefois; il n’impose pas une notion théologique d’éternité.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve l’interrogation accusatrice d’Éliphaz ainsi que l’image du sentier foulé, avec une syntaxe accessible.
