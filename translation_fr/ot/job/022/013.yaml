  text: Yet you say[b][a], ‘What does God know? Can he judge through thick darkness?’
translation:
  language: fr
  text: 'Pourtant, tu dis : « Que sait Dieu ? Peut-il juger à travers l’épaisse obscurité[a] ? »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « l’épaisse nuée » ou « les ténèbres » pour ce terme qui évoque une obscurité dense et nuageuse.'
    reason: alternative lexicale
  - marker: b
    text: 'Ou : « Juge-t-il à travers l’épaisse obscurité ? » ou « Jugera-t-il à travers l’épaisse obscurité ? » L’imparfait hébreu peut exprimer une action présente ou future, tandis que le contexte permet aussi de comprendre une question portant sur la capacité.'
    reason: lecture alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Pourtant, tu dis
  rationale: Le waw prend ici naturellement une valeur adversative dans l’accusation d’Élifaz. Le présent français restitue bien la parole attribuée à Job dans le contexte immédiat.
- source_word: מַה
  choice: Que
  rationale: 'Le pronom interrogatif introduit directement l’objet du savoir : « Que sait Dieu ? »'
- source_word: יָדַע
  choice: sait
  rationale: Le verbe exprime ici la connaissance ou la perception. Le présent convient à la question rhétorique.
- source_word: אֵל
  choice: Dieu
  rationale: Le titre divin אֵל se rend naturellement par « Dieu » en français courant, sans nécessiter de translittération.
- source_word: הַבְעַד
  choice: à travers
  rationale: La préposition évoque ici un obstacle interposé. « À travers » conserve l’image selon laquelle l’obscurité ferait écran au jugement divin.
- source_word: עֲרָפֶל
  choice: épaisse obscurité
  rationale: Le nom désigne une obscurité dense, souvent associée à une masse nuageuse sombre. Cette formulation préserve à la fois l’intensité et l’image d’un écran.
- source_word: יִשְׁפּוֹט
  choice: Peut-il juger
  rationale: Dans cette question rhétorique, l’imparfait hébreu peut suggérer une mise en doute de la capacité effective de Dieu à juger. La note conserve les autres valeurs temporelles possibles.
theological_decisions:
- issue: 'Valeur de l’imparfait יִשְׁפּוֹט : capacité, action présente ou action future'
  choice: Peut-il juger à travers l’épaisse obscurité ?
  alternative: Juge-t-il à travers l’épaisse obscurité ? / Jugera-t-il à travers l’épaisse obscurité ?
  rationale: Dans le discours qu’Élifaz attribue à Job, la question semble mettre en doute la possibilité pour Dieu de discerner et de juger malgré ce qui ferait écran. « Peut-il » rend cette force rhétorique sans exclure les lectures plus strictement présentes ou futures, signalées en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au discours direct adressé à Job. La formulation concise conserve la vigueur des deux questions rhétoriques et l’ambiguïté de la forme verbale hébraïque.
