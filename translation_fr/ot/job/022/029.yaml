source:
  edition: WLC
  text: כִּֽי הִ֭שְׁפִּילוּ וַ/תֹּ֣אמֶר גֵּוָ֑ה וְ/שַׁ֖ח עֵינַ֣יִם יוֹשִֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/029.yaml
  text: For when they are brought low[a], you say[b], ‘Lift them up!’ and he saves the one with downcast eyes.
translation:
  language: fr
  text: 'Car, quand ils seront abaissés[a], tu diras : « Il y a relèvement ! » et il sauvera celui qui a le regard baissé[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car, quand ils seront abaissés, tu diras : “Relèvement !” » Le sujet pluriel n’est pas identifié, et la déclaration hébraïque est elliptique ; elle peut aussi se comprendre : « il y a relèvement ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « celui qui est aux yeux baissés » ; l’expression peut désigner une personne humble ou accablée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car, quand
  rationale: La particule introduit ici à la fois le fondement de la promesse précédente et la circonstance dans laquelle elle se réalise.
- source_word: הִשְׁפִּילוּ
  choice: des gens seront abaissés
  rationale: La forme plurielle exprime l’abaissement sans préciser explicitement le complément. « Des gens » rend la référence indéfinie avec naturel, sans suggérer un abaissement volontaire.
- source_word: וַתֹּאמֶר
  choice: tu diras
  rationale: Le verbe s’adresse au destinataire singulier du discours d’Élifaz. Le futur convient à la portée prospective de la phrase.
- source_word: גֵּוָה
  choice: Relèvement !
  rationale: Le nom, employé dans une proposition elliptique difficile, désigne ici vraisemblablement l’élévation opposée à l’abaissement. L’exclamation nominale conserve mieux l’ellipse que l’ajout d’un objet absent de l’hébreu.
- source_word: וְשַׁח עֵינַיִם
  choice: celui qui a le regard baissé
  rationale: Cette formulation conserve l’image littérale des yeux abaissés tout en évoquant naturellement l’humilité ou l’accablement.
- source_word: יוֹשִׁעַ
  choice: il sauvera
  rationale: Le verbe signifie sauver ou délivrer. Le sujet masculin singulier, implicitement Dieu dans le contexte, demeure non explicité comme en hébreu.
theological_decisions:
- issue: Sujet de יוֹשִׁעַ
  choice: 'Le sujet reste implicite et est rendu par « il » : « il sauvera ».'
  alternative: Expliciter « Dieu sauvera », employer un sujet indéfini, ou rattacher le verbe au destinataire (« tu sauveras »).
  rationale: La forme verbale est à la troisième personne masculine du singulier. Le contexte indique vraisemblablement Dieu, mais le nom divin n’apparaît pas dans ce verset ; la traduction préserve cette concision.
- issue: Sens de גֵּוָה dans la proposition elliptique
  choice: « Relèvement ! », comme annonce d’un renversement positif.
  alternative: « Il y aura relèvement ! », « Élève-les ! » ou le sens négatif « orgueil ».
  rationale: Le contraste immédiat avec l’abaissement favorise le sens d’élévation ou de relèvement. La formulation nominale garde l’ambiguïté syntaxique de l’hébreu sans transformer nettement le mot en impératif.
translation_notes:
  register: Français international moderne, sobre et digne. L’exclamation nominale « Relèvement ! » conserve la brièveté et la difficulté du texte hébreu, tandis que « celui qui a le regard baissé » en préserve l’image.
