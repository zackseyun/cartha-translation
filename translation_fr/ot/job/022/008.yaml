source:
  edition: WLC
  text: וְ/אִ֣ישׁ זְ֭רוֹעַ ל֣/וֹ הָ/אָ֑רֶץ וּ/נְשׂ֥וּא פָ֝נִ֗ים יֵ֣שֶׁב בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/008.yaml
  text: But the land belonged to the strong man[b][a], and the favored man lived in it.
translation:
  language: fr
  text: Mais la terre appartenait à l’homme puissant[a], et l’homme favorisé[b] y habitait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « homme de bras », expression désignant un homme fort ou puissant.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’homme honoré », « celui qui jouissait d’une faveur » ou « celui qui était traité avec partialité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Mais l’homme
  rationale: Dans ce contexte accusateur, la conjonction marque le contraste avec le sort des faibles évoqué autour de ce verset.
- source_word: זְרוֹעַ
  choice: puissant
  rationale: Littéralement « bras » ; l’expression « homme de bras » désigne idiomatiquement un homme fort ou puissant.
- source_word: לוֹ הָאָרֶץ
  choice: le pays appartenait à
  rationale: 'La construction avec לְ exprime ici la possession ou la maîtrise : le pays était à lui.'
- source_word: וּנְשׂוּא פָנִים
  choice: l’homme considéré avec faveur
  rationale: L’expression, littéralement liée au fait de « relever le visage », peut évoquer la faveur, l’honneur ou un traitement partial ; cette formulation conserve cette latitude.
- source_word: יֵשֶׁב בָּהּ
  choice: y habitait
  rationale: יָשַׁב signifie couramment habiter, demeurer ou s’établir ; « y habitait » est naturel et reprend clairement le pays.
theological_decisions: []
