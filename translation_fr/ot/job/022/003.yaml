  text: הַ/חֵ֣פֶץ לְ֭/שַׁדַּי כִּ֣י תִצְדָּ֑ק וְ/אִם בֶּ֝֗צַע כִּֽי תַתֵּ֥ם דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/003.yaml
  text: Is it any pleasure to the Almighty that you are righteous[b][a], or any gain that you make your ways blameless?
translation:
  language: fr
  text: Le Tout-Puissant prend-il plaisir à ce que tu sois juste[a], ou tire-t-il quelque profit de ce que tu rendes tes voies irréprochables[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à ce que tu sois dans ton droit » ; le terme peut exprimer la justice morale ou le fait d’avoir raison.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à ce que tu rendes tes voies parfaites ou intègres » ; les « voies » désignent ici la conduite.'
    reason: literal_rendering
lexical_decisions:
- source_word: הַחֵפֶץ לְשַׁדַּי
  choice: Le Tout-Puissant éprouve-t-il quelque plaisir
  rationale: חֵפֶץ peut désigner le plaisir, le contentement ou le désir. Avec לְשַׁדַּי, cette formulation rend naturellement la question de ce qui ferait plaisir au Tout-Puissant.
- source_word: כִּי תִצְדָּק
  choice: à te voir juste
  rationale: Le qal de צדק signifie ici être juste ou être dans son droit. « À te voir juste » s’intègre naturellement après « éprouver du plaisir » sans suggérer une autojustification.
- source_word: וְאִם בֶּצַע
  choice: Gagne-t-il quelque chose
  rationale: בֶּצַע désigne un gain, un profit ou un avantage. Une seconde question explicite conserve le parallélisme rhétorique et l’image du bénéfice.
- source_word: כִּי תַתֵּם דְּרָכֶיךָ
  choice: à te voir mener une vie irréprochable
  rationale: Le hiphil de תמם présente l’action de rendre complet ou intègre, tandis que « tes voies » désigne la conduite. La formulation française exprime clairement le sens moral tout en conservant l’action attribuée à l’interlocuteur.
theological_decisions:
- issue: La justice humaine procure-t-elle intrinsèquement un bénéfice à Dieu ?
  choice: Les deux questions rhétoriques présentent l’affirmation d’Éliphaz selon laquelle la justice de Job ne procure au Tout-Puissant ni plaisir intéressé ni gain.
  alternative: Comprendre la première proposition comme une négation absolue de tout plaisir divin devant la justice humaine.
  rationale: Le contexte argumentatif et le parallélisme entre חֵפֶץ et בֶּצַע portent sur ce que Dieu retirerait de la justice de Job. La traduction laisse cette affirmation dans la bouche d’Éliphaz sans en faire une doctrine générale ni nier les textes où Dieu approuve la justice.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux propositions ont été formulées comme des questions parallèles. « Mener une vie irréprochable » restitue idiomatiquement la métaphore hébraïque des voies et la nuance morale de תמם.
