  yaml_path: translation/ot/job/022/001.yaml
  text: 'Then Eliphaz the Temanite answered and said:'
translation:
  language: fr
  text: 'Éliphaz de Témân répondit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Le verbe ענה, dans cette forme narrative, introduit la réplique d’un interlocuteur. « Répondit » rend naturellement sa valeur dialogique.
- source_word: אֱלִיפַז
  choice: Éliphaz
  rationale: Le nom propre est translittéré selon l’usage français courant.
- source_word: הַתֵּמָנִי
  choice: de Témân
  rationale: Le gentilé désigne ici l’origine géographique d’Éliphaz. « De Témân » est plus naturel en français actuel que « le Témanite », tout en conservant l’information du texte hébreu.
- source_word: וַיֹּאמַר
  choice: ':'
  rationale: Dans la formule hébraïque וַיַּעַן ... וַיֹּאמַר, le second verbe introduit directement le discours. En français moderne, les deux verbes « répondit et dit » seraient redondants ; les deux-points rendent idiomatiquement cette fonction.
- source_word: וַ
  choice: enchaînement narratif implicite
  rationale: Le waw fait progresser le récit. L’enchaînement avec le verset précédent et le passé simple français suffisent à exprimer cette progression, sans ajouter nécessairement « alors ».
theological_decisions: []
translation_notes:
  register: Formulation narrative concise, digne et naturelle en français international moderne. Le passé simple convient au registre littéraire du livre de Job sans être archaïque.
