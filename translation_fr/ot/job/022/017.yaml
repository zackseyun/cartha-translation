source:
  edition: WLC
  text: הָ/אֹמְרִ֣ים לָ֭/אֵל ס֣וּר מִמֶּ֑/נּוּ וּ/מַה יִּפְעַ֖ל שַׁדַּ֣י לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/017.yaml
  text: who said to God, ‘Depart from us,’ and, ‘What can the Almighty do to them?’
translation:
  language: fr
  text: 'eux qui disaient à Dieu : « Éloigne-toi de nous ! » et : « Que peut leur[a] faire le Tout-Puissant ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à eux » ou « pour eux ». Le texte hébreu passe ici de « nous » à « eux ».'
    reason: Signaler le changement de personne inhabituel et l’étendue sémantique de la préposition hébraïque sans corriger le texte.
lexical_decisions:
- source_word: סוּר מִמֶּנּוּ
  choice: Éloigne-toi de nous
  rationale: Rend l’impératif « retire-toi/éloigne-toi » dans un français naturel et digne, sans atténuer le rejet exprimé.
- source_word: יִפְעַל
  choice: faire
  rationale: Le verbe signifie largement « faire, accomplir, agir » ; « faire » conserve ici son caractère ouvert.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Équivalent français traditionnel et intelligible du titre divin Shaddaï.
- source_word: לָמוֹ
  choice: leur
  rationale: Respecte le pronom pluriel de troisième personne du texte massorétique et préserve le passage abrupt de « nous » à « eux ».
theological_decisions:
- issue: Passage de la première personne (« nous ») à la troisième personne (« eux/leur »)
  choice: Conserver « leur »
  alternative: Harmoniser en « nous »
  rationale: Le texte massorétique porte לָמוֹ, « à/pour eux ». L’harmonisation rendrait la citation plus régulière, mais effacerait une tension réelle du texte hébreu.
- issue: Valeur de la préposition ל dans לָמוֹ
  choice: Employer la construction neutre « leur faire »
  alternative: « faire pour eux » ou « faire contre eux »
  rationale: La formulation française retenue évite de décider si l’action envisagée serait favorable ou hostile, nuance que le contexte peut suggérer mais que la préposition ne tranche pas à elle seule.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure relative « eux qui disaient » maintient le lien syntaxique avec le verset précédent ; les deux paroles sont distinguées afin de rendre clairement la formulation hébraïque.
