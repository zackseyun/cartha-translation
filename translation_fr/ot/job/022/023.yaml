id: JOB.22.23
reference: Job 22:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם תָּשׁ֣וּב עַד שַׁ֭דַּי תִּבָּנֶ֑ה תַּרְחִ֥יק עַ֝וְלָ֗ה מֵ/אָהֳלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/023.yaml
  text: If you return to the Almighty[a], you will be restored; if you put unrighteousness far from your tent[b],
translation:
  language: fr
  text: Si tu reviens au Tout-Puissant, tu seras rétabli[a] ; si tu éloignes l’injustice[b] de ta tente,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu seras bâti » ou « tu seras rebâti ». Le verbe hébreu signifie littéralement « être bâti » et s’emploie ici comme image du rétablissement.
    reason: lexical_alternative
  - marker: b
    text: Ou « le mal » ou « ce qui est injuste ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: si
  rationale: Introduit clairement la condition exprimée par la proposition.
- source_word: תָּשׁוּב
  choice: tu reviens
  rationale: Le verbe שׁוב signifie fondamentalement « revenir » ou « retourner ». Ce choix conserve son image concrète sans la réduire d’emblée au sens plus interprétatif de « se repentir ».
- source_word: עַד
  choice: au
  rationale: Avec le verbe « revenir », la préposition indique ici le terme du mouvement, exprimé naturellement en français par « revenir au Tout-Puissant ».
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Traduction française courante et intelligible de ce titre divin, préférable ici à la translittération « Shaddaï ».
- source_word: תִּבָּנֶה
  choice: tu seras rétabli
  rationale: Le niphal de בנה signifie littéralement « être bâti » ou « rebâti ». Dans ce contexte, « être rétabli » rend naturellement la métaphore de la restauration tout en maintenant la voix passive.
- source_word: תַּרְחִיק
  choice: tu éloignes
  rationale: Le hifil de רחק a le sens causatif de « faire en sorte que quelque chose soit loin », d’où « éloigner ».
- source_word: עַוְלָה
  choice: l’injustice
  rationale: Le nom désigne ce qui est injuste, mauvais ou contraire à la droiture. « Injustice » conserve sa portée morale sans ajouter une nuance doctrinale particulière.
- source_word: מֵאָהֳלֶךָ
  choice: de ta tente
  rationale: La traduction littérale préserve l’image concrète et le cadre culturel du texte, même si la tente peut aussi représenter le foyer.
theological_decisions:
- issue: Rendre littéralement ou interpréter la métaphore de la construction
  choice: tu seras rétabli
  alternative: tu seras bâti / tu seras rebâti
  rationale: « Rétabli » communique clairement l’idée contextuelle de restauration, tandis qu’une note conserve l’image littérale de la construction.
- issue: Traduire שׁוב par « revenir » ou par « se repentir »
  choice: tu reviens
  alternative: tu te repens / tu retournes
  rationale: « Revenir » respecte le sens lexical de base et laisse intacte la portée théologique du mouvement vers Dieu sans imposer un terme plus spécialisé.
- issue: Comprendre תַּרְחִיק comme la suite de la condition
  choice: si tu éloignes
  alternative: éloigne
  rationale: Bien que le second verbe puisse prendre une nuance exhortative, le parallélisme et la syntaxe permettent naturellement de poursuivre la condition introduite par אִם. La répétition de « si » rend cette relation claire en français.
translation_notes:
  register: Français moderne, sobre et digne. « Revenir au Tout-Puissant » garde le mouvement concret du texte hébreu ; « tente » en préserve l’image culturelle. La ponctuation finale ouverte tient compte de la continuation de la phrase au verset suivant.
