id: JOB.22.4
reference: Job 22:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲֽ֭/מִ/יִּרְאָ֣תְ/ךָ יֹכִיחֶ֑/ךָ יָב֥וֹא עִ֝מְּ/ךָ֗ בַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/004.yaml
  text: Is it because of your fear of him that he reproves you and enters into judgment with you?[a][b][c]
translation:
  language: fr
  text: Est-ce parce que tu le crains qu’il te reprend et entre en jugement avec toi ?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de ta crainte de Dieu » ; l’hébreu dit littéralement « à cause de ta crainte ».
    reason: lexical_alternative
  - marker: b
    text: Ou « te réprimande » ou « te corrige ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « vient avec toi en jugement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיִּרְאָתְךָ
  choice: parce que tu le crains
  rationale: 'La construction interrogative avec מִן a ici une valeur causale : « est-ce à cause de ta crainte… ? » Le verbe français « craindre » exprime naturellement la crainte révérencielle envers Dieu, dont l’objet est implicite en hébreu mais clair dans le contexte.'
- source_word: יֹכִיחֶךָ
  choice: il te reprend
  rationale: Le hiphil de יכח peut exprimer la réprimande, la correction ou l’action d’établir un grief. « Reprend » conserve la portée morale tout en restant compatible avec le cadre judiciaire du second membre.
- source_word: יָבֹא עִמְּךָ בַּמִּשְׁפָּט
  choice: entre en jugement avec toi
  rationale: Cette formulation française conserve l’image judiciaire et la relation adversative exprimée par עִם, sans transformer explicitement Dieu en celui qui « amène » Job au jugement.
- source_word: מִּשְׁפָּט
  choice: jugement
  rationale: Dans ce contexte, le terme désigne une procédure ou contestation judiciaire. « Jugement » en garde l’ampleur sémantique et convient au parallélisme juridique.
theological_decisions:
- issue: Objet implicite de la crainte de Job
  choice: Rendre explicitement Dieu comme objet par « tu le crains »
  alternative: 'Conserver l’ellipse : « à cause de ta crainte »'
  rationale: Le contexte identifie Dieu comme objet de la crainte. L’explicitation produit un français naturel sans introduire une affirmation théologique étrangère au passage.
- issue: Portée de la question d’Éliphaz
  choice: Conserver une question rhétorique qui appelle une réponse négative
  alternative: Formuler une question neutre
  rationale: La particule interrogative et le contexte argumentatif indiquent qu’Éliphaz nie ironiquement que Dieu poursuive Job en raison de sa crainte révérencielle.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement correspond au discours direct adressé à Job. La formulation conserve le parallélisme, l’ironie de la question et la tension entre réprimande morale et procédure judiciaire.
