  text: וְֽ/תִגְזַר א֭וֹמֶר וְ/יָ֣קָם לָ֑/ךְ וְ/עַל דְּ֝רָכֶ֗י/ךָ נָ֣גַֽהּ אֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/028.yaml
  text: You will decree a matter[a], and it will be established for you, and light will shine on your ways.
translation:
  language: fr
  text: Tu prendras une décision, et elle prendra effet pour toi ; la lumière brillera sur tes chemins.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִגְזַר
  choice: tu décréteras
  rationale: Le verbe גזר peut exprimer une décision ferme ou un décret. « Décréter » conserve ici la force de la déclaration sans ajouter l’idée d’un pouvoir royal.
- source_word: אֹמֶר
  choice: une chose
  rationale: Le nom désigne littéralement une parole ou un propos, mais, avec גזר, il peut viser ce qui est décidé ou prononcé. « Une chose » rend naturellement l’objet de cette décision, tandis que le sens plus littéral est conservé en note.
- source_word: יָקָם
  choice: elle se réalisera
  rationale: Le verbe קום signifie fondamentalement « se lever, tenir » et peut indiquer qu’une parole prend effet. « Se réalisera » exprime ce résultat en français naturel, sans renforcer davantage l’affirmation.
- source_word: לָךְ
  choice: pour toi
  rationale: La préposition ל marque ici la relation ou l’avantage ; « pour toi » en garde la simplicité et l’ambiguïté.
- source_word: דְּרָכֶיךָ
  choice: tes chemins
  rationale: « Chemins » préserve la métaphore de דרך et s’accorde naturellement avec l’image de la lumière.
- source_word: נָגַהּ אֹור
  choice: la lumière brillera
  rationale: Cette formulation directe restitue l’image poétique du verbe נגה avec אוֹר pour sujet.
theological_decisions:
- issue: Nature de la promesse dans le discours d’Élifaz
  choice: Formuler l’issue attendue comme une affirmation assurée d’Élifaz, sans l’amplifier en garantie théologique universelle.
  alternative: Présenter ces paroles soit comme une promesse absolue de réussite, soit comme une simple possibilité.
  rationale: Le verset rapporte l’enseignement d’Élifaz, dont le livre ne valide pas nécessairement toutes les conclusions. La traduction conserve donc la force de son assertion tout en laissant subsister la tension théologique du récit.
translation_notes:
  register: Français international moderne, clair et digne. Le futur conserve l’assurance du propos, tandis que le parallélisme et l’image de la lumière maintiennent le caractère poétique du verset.
