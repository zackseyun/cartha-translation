  yaml_path: translation/ot/job/022/025.yaml
  text: then the Almighty will be your gold[a], and choice silver for you.
translation:
  language: fr
  text: alors le Tout-Puissant sera ton or[a], ton argent le plus précieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « alors le Tout-Puissant sera ton trésor, et tu auras de l’argent en abondance ». Les termes hébreux rendus par « or » et « le plus précieux » sont difficiles et pourraient mettre l’accent sur les richesses accordées par Dieu plutôt que sur Dieu lui-même comme trésor.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: alors ... sera
  rationale: Dans le contexte de l’exhortation d’Éliphaz, le waw suivi de l’accompli exprime naturellement la conséquence future de la condition énoncée auparavant.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Traduction française courante du titre divin Shaddaï dans le livre de Job.
- source_word: בְּצָרֶיךָ
  choice: ton or
  rationale: Le terme rare peut désigner un métal précieux ou un minerai; son parallélisme avec « argent » favorise ici « or », sans exclure « trésor ».
- source_word: וְכֶסֶף
  choice: et ... un argent
  rationale: Le second membre reprend implicitement le verbe « sera » et poursuit le parallélisme des métaux précieux.
- source_word: תּוֹעָפוֹת
  choice: précieux
  rationale: Ce mot rare et difficile semble qualifier l’argent par sa valeur, sa qualité ou son abondance. « Précieux » reste naturel tout en évitant de trancher excessivement.
- source_word: לָךְ
  choice: pour toi
  rationale: Cette formulation rend explicitement la nuance personnelle du datif et convient à la structure de la promesse.
theological_decisions:
- issue: Sens de la promesse formulée par Éliphaz
  choice: Le Tout-Puissant lui-même est présenté comme l’or et l’argent précieux de Job.
  alternative: Le Tout-Puissant procurera à Job de l’or et de l’argent en abondance.
  rationale: La syntaxe poétique permet de comprendre soit que Dieu est lui-même le véritable trésor de Job, soit qu’il lui fournit des richesses. Le texte principal conserve la métaphore la plus directe, tandis que la note maintient l’autre lecture sans résoudre artificiellement la tension.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « sera » clarifie le parallélisme elliptique de l’hébreu; la note préserve l’ambiguïté lexicale et théologique.
