  text: לֹא מַ֭יִם עָיֵ֣ף תַּשְׁקֶ֑ה וּ֝/מֵ/רָעֵ֗ב תִּֽמְנַֽע לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/007.yaml
  text: You gave no water to the weary to drink[a], and from the hungry you withheld bread.
translation:
  language: fr
  text: Tu n’as pas donné d’eau à boire à celui qui était épuisé, et tu as refusé du pain[a] à celui qui avait faim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « pain » peut aussi désigner plus largement la nourriture.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: ne… pas
  rationale: La négation porte sur l’accusation de ne pas avoir donné d’eau ; la seconde proposition exprime parallèlement le refus du pain.
- source_word: מַיִם
  choice: eau
  rationale: Correspond au nom courant désignant l’eau ; le singulier massif est naturel en français.
- source_word: עָיֵף
  choice: celui qui était épuisé
  rationale: L’adjectif substantivé désigne de manière générique une personne lasse ou épuisée ; cette formulation est claire et naturelle en français.
- source_word: תַּשְׁקֶה
  choice: tu donnais… à boire
  rationale: Le hifil de שׁקה signifie « faire boire, donner à boire » ; la tournure française conserve ce sens causatif sans lourdeur.
- source_word: וּמֵרָעֵב
  choice: et… à celui qui avait faim
  rationale: Le syntagme hébreu désigne génériquement la personne affamée. Avec « refuser », le français emploie naturellement « à », là où l’hébreu construit l’idée comme un retrait « de » la personne.
- source_word: תִּמְנַע
  choice: tu refusais
  rationale: Le verbe מנע signifie retenir ou priver de quelque chose. « Refuser du pain à » rend naturellement l’accusation morale dans ce contexte.
- source_word: לָחֶם
  choice: pain
  rationale: Le terme désigne concrètement le pain, tout en pouvant représenter plus largement la nourriture ; le texte principal conserve l’image précise de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. L’imparfait présente les actes reprochés comme une conduite passée, conformément au contexte accusatoire. Le parallélisme entre la personne épuisée et celle qui a faim est maintenu.
