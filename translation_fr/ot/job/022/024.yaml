  text: and lay gold in the dust[a], and the gold of Ophir among the stones of the wadis[c][b],
translation:
  language: fr
  text: Et mets l’or dans la poussière[a], et l’or d’Ophir[b] parmi les pierres des torrents[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mets le minerai d’or sur la poussière. » Le terme hébreu peut désigner un métal précieux ou du minerai, et pas seulement de l’or raffiné.'
    reason: lexical_alternative
  - marker: b
    text: Ophir était un lieu réputé pour son or fin; l’hébreu porte simplement « Ophir ».
    reason: cultural_note
  - marker: c
    text: 'Le terme hébreu peut désigner des torrents saisonniers, leurs vallées ou leurs lits; on pourrait aussi traduire : « des oueds ».'
    reason: cultural_note
lexical_decisions:
- source_word: וְשִׁית
  choice: Mets
  rationale: Le verbe שׁית signifie « mettre, placer ». L’impératif français restitue directement l’exhortation poétique; la coordination peut rester implicite au début du verset en français.
- source_word: עַל עָפָר
  choice: dans la poussière
  rationale: עַל signifie normalement « sur », mais « dans la poussière » est l’expression française naturelle pour évoquer quelque chose déposé ou rejeté à terre, sans perdre l’image concrète.
- source_word: בָּצֶר
  choice: l’or
  rationale: Dans ce parallélisme avec Ophir, le terme désigne vraisemblablement un métal précieux, de l’or ou du minerai d’or. « L’or » est clair, tandis qu’une note conserve l’alternative lexicale.
- source_word: וּבְצוּר נְחָלִים
  choice: parmi les pierres des torrents
  rationale: Littéralement, צוּר évoque le rocher et נְחָלִים des torrents, vallées torrentielles ou oueds. La formulation française rend naturellement l’image des pierres présentes dans leurs lits.
- source_word: אוֹפִיר
  choice: l’or d’Ophir
  rationale: Ophir est un nom de lieu réputé pour son or fin. Le mot « or », implicite dans le parallélisme hébreu, est explicité pour que le référent soit immédiatement compréhensible.
theological_decisions:
- issue: Portée de l’exhortation d’Éliphaz
  choice: Le verset évoque le fait de reléguer ou d’abandonner l’or à la poussière et aux pierres des torrents.
  alternative: Il pourrait être compris comme une consigne visant à déposer l’or dans un lieu naturel sûr.
  rationale: Le contexte des versets 24-25 oppose les richesses terrestres au Tout-Puissant comme véritable trésor. La traduction garde toutefois l’action concrète « mets » plutôt que d’expliciter « rejette », afin de ne pas supprimer l’ambiguïté de l’image.
translation_notes:
  register: Français international moderne, poétique et digne. « Torrents » est plus immédiatement accessible que « oueds », conservé en note. Les marqueurs suivent les expressions qu’ils expliquent et l’ordre alphabétique.
