  text: כִּֽי תַחְבֹּ֣ל אַחֶ֣י/ךָ חִנָּ֑ם וּ/בִגְדֵ֖י עֲרוּמִּ֣ים תַּפְשִֽׁיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/006.yaml
  text: For you took pledges from your brothers for no reason[b][a], and stripped the clothing from the naked.
translation:
  language: fr
  text: Car tu prenais à tes frères des gages sans raison[a], et tu dépouillais de leurs vêtements des gens nus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » peut désigner plus largement les membres de la même communauté, et non seulement les frères biologiques.
    reason: cultural_note
  - marker: b
    text: Ou, selon le contexte, « des gens à peine vêtus ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’accusation d’Éliphaz avec une valeur explicative ou causale, en lien avec ce qui précède.
- source_word: תַחְבֹּל
  choice: tu prenais […] des gages
  rationale: Le verbe חבל désigne ici l’action de prendre un bien en gage pour garantir une dette. L’imparfait français convient à une conduite habituelle alléguée.
- source_word: אַחֶיךָ
  choice: tes frères
  rationale: Rend littéralement le masculin pluriel hébreu, qui peut aussi désigner plus largement les membres de la même communauté.
- source_word: חִנָּם
  choice: sans raison
  rationale: Exprime l’absence de motif légitime et conserve la portée morale de l’accusation.
- source_word: וּבִגְדֵי
  choice: de leurs vêtements
  rationale: בגד désigne les vêtements; l’ajout du possessif est requis naturellement en français avec « dépouiller quelqu’un de ».
- source_word: עֲרוּמִּים
  choice: ceux qui étaient nus
  rationale: Conserve l’image saisissante et paradoxale du texte hébreu, tout en laissant possible le sens de personnes à peine vêtues.
- source_word: תַּפְשִׁיט
  choice: tu dépouillais
  rationale: Le hiphil de פשט signifie ici enlever les vêtements de quelqu’un; « dépouiller de leurs vêtements » est direct et idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve le parallélisme accusateur, ainsi que l’ironie sévère consistant à enlever leurs vêtements à des personnes dites « nues ».
