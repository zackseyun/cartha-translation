  text: יְֽמַלֵּ֥ט אִֽי נָקִ֑י וְ֝/נִמְלַ֗ט בְּ/בֹ֣ר כַּפֶּֽי/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/022/030.yaml
  text: He delivers even one who is not innocent[b][a], and he will be delivered through the cleanness of your hands.
translation:
  language: fr
  text: Il délivrera même celui qui n’est pas innocent[a] ; il sera délivré par la pureté de tes mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il délivrera l’innocent. » Le premier membre du verset est difficile en hébreu et peut être compris autrement.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « par la pureté de tes mains », expression qui évoque l’innocence ou l’intégrité morale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַלֵּט
  choice: il délivrera
  rationale: Le piel de מלט exprime le fait de faire échapper ou de délivrer. Le futur convient à la forme verbale et au contexte immédiat.
- source_word: אִי נָקִי
  choice: même celui qui n’est pas innocent
  rationale: Cette expression hébraïque difficile est comprise ici selon l’interprétation traditionnelle où אִי fonctionne comme un élément négatif. « Même » rend naturellement en français la portée surprenante de l’affirmation.
- source_word: וְנִמְלַט
  choice: celui-ci sera délivré
  rationale: Le niphal de מלט peut signifier « être délivré » ou « échapper ». La formulation passive maintient le parallélisme avec le premier membre et « celui-ci » clarifie le référent sans ajouter d’interprétation.
- source_word: בְּבֹר
  choice: grâce à la pureté
  rationale: בֹּר désigne ici la pureté, tandis que בְּ a une valeur instrumentale. « Grâce à » exprime ce moyen de façon naturelle.
- source_word: כַּפֶּיךָ
  choice: de tes mains
  rationale: Le terme désigne littéralement les paumes, mais « mains » est la formulation idiomatique française. Leur pureté représente l’innocence ou l’intégrité morale.
theological_decisions:
- issue: Sens du premier membre du verset
  choice: Dieu délivrera même une personne qui n’est pas innocente.
  alternative: Il délivrera l’innocent.
  rationale: 'La syntaxe hébraïque est notoirement difficile. Le texte principal retient l’interprétation négative traditionnelle, qui s’accorde avec le second membre : cette personne est délivrée grâce à la pureté des mains de Job. La note conserve l’autre lecture possible sans transformer le verset en formulation doctrinale plus précise sur l’intercession.'
translation_notes:
  register: Français international moderne, sobre et digne. Le point-virgule préserve le parallélisme poétique ; « celui-ci » lève une ambiguïté référentielle propre au français sans résoudre la difficulté textuelle signalée en note.
