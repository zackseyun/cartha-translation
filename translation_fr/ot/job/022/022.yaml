  text: קַח נָ֣א מִ/פִּ֣י/ו תּוֹרָ֑ה וְ/שִׂ֥ים אֲ֝מָרָ֗י/ו בִּ/לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/022.yaml
  text: Please[a], receive instruction from his mouth, and lay up his words in your heart.
translation:
  language: fr
  text: Reçois donc l’enseignement[a] de sa bouche, et garde ses paroles dans ton cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « loi » ou « instruction » (hébreu torah).
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח נָא
  choice: Accepte donc
  rationale: L’impératif de לקח signifie littéralement « prends », mais avec un enseignement pour objet il exprime naturellement l’idée de l’accepter ou de le recevoir. נָא donne ici à l’exhortation une nuance d’insistance que « donc » rend mieux qu’un « s’il te plaît » peu naturel dans ce contexte.
- source_word: מִפִּיו
  choice: qui vient de sa bouche
  rationale: Cette formulation conserve l’image hébraïque explicite de la bouche tout en l’intégrant naturellement à la syntaxe française.
- source_word: תּוֹרָה
  choice: enseignement
  rationale: Dans ce discours de sagesse, תּוֹרָה désigne une instruction autorisée, sans imposer nécessairement le sens particulier de la Loi mosaïque. « Enseignement » est clair et naturel en français moderne.
- source_word: וְשִׂים
  choice: et garde
  rationale: Le sens littéral est « mets/place », mais l’expression « dans ton cœur » appelle en français l’idée de conserver intérieurement. « Garde » maintient cette image sans l’alourdir.
- source_word: אֲמָרָיו
  choice: ses paroles
  rationale: « Paroles » rend naturellement le pluriel hébreu et convient au registre digne du passage.
- source_word: בִּלְבָבֶךָ
  choice: dans ton cœur
  rationale: La formulation conserve l’idiome hébreu du cœur comme siège de la pensée, de la volonté et de l’intériorisation.
theological_decisions:
- issue: Sens de תּוֹרָה dans un discours de sagesse
  choice: enseignement
  alternative: loi; instruction
  rationale: « Enseignement » respecte la portée générale de תּוֹרָה dans ce contexte et évite de préciser sans nécessité qu’il s’agirait de la Loi mosaïque. L’autorité revendiquée par le discours demeure intacte.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier hébreu. La tournure conserve l’image de la bouche et celle des paroles gardées dans le cœur.
