  terminology: « Utile » préserve la répétition de סכן dans les deux membres. « Homme sage » rend clairement le participe מַשְׂכִּיל dans un registre biblique moderne et accessible, sans surcharger « perspicace » d’une nuance principalement intellectuelle.
