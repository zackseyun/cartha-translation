  text: הַ/לְ/אֵ֥ל יִסְכָּן גָּ֑בֶר כִּֽי יִסְכֹּ֖ן עָלֵ֣י/מוֹ מַשְׂכִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/002.yaml
  text: Can a man be of use to God? Surely he who is wise is of use to himself[a].
translation:
  language: fr
  text: Un homme peut-il être utile à Dieu ? Car l’homme sage est utile à lui-même[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un homme peut-il procurer un avantage à Dieu ? Car celui qui a du discernement en retire un avantage pour lui-même. »'
    reason: Alternative lexicale pour סכן et מַשְׂכִּיל; la formulation explicite que l’avantage revient à la personne sans ajouter d’exclusivité au texte principal.
lexical_decisions:
- source_word: הַלְאֵל
  choice: à Dieu ?
  rationale: La particule interrogative הֲ et לְאֵל présentent Dieu comme celui à qui l’homme pourrait être utile; la question rhétorique est conservée.
- source_word: יִסְכָּן
  choice: être utile
  rationale: Le verbe סכן exprime ici l’utilité ou l’avantage. « Être utile » est naturel et évite une coloration excessivement commerciale.
- source_word: גָּבֶר
  choice: un homme
  rationale: גָּבֶר est un masculin singulier employé ici de manière représentative; « un homme » en préserve la forme et convient au registre sapientiel.
- source_word: כִּי
  choice: En réalité
  rationale: כִּי peut introduire ici une explication ou une affirmation emphatique. « En réalité » rend naturellement cette force, sans imposer une relation logique plus précise que le contexte.
- source_word: יִסְכֹּן עָלֵימוֹ
  choice: n’est utile qu’à lui-même
  rationale: Le second emploi de סכן demeure parallèle au premier, tandis que עָלֵימוֹ indique que l’avantage revient au sujet lui-même. « Ne… qu’à » explicite le contraste rhétorique impliqué par le parallélisme.
- source_word: מַשְׂכִּיל
  choice: l’homme perspicace
  rationale: Le participe substantivé de שכל désigne une personne douée de discernement ou agissant avec sagesse. « Perspicace » conserve la nuance d’intelligence avisée.
theological_decisions:
- issue: La possibilité qu’un être humain procure un avantage à Dieu
  choice: La question est formulée comme une interrogation rhétorique, et le second membre indique que l’avantage de la perspicacité revient à l’être humain lui-même.
  alternative: 'On peut traduire plus littéralement le lien entre les deux membres : « Car l’homme perspicace est utile à lui-même », sans rendre explicite l’exclusivité.'
  rationale: Le parallélisme oppose l’utilité supposée pour Dieu à celle qui revient à l’homme. La traduction conserve cette pointe sans l’étendre en affirmation doctrinale générale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la concision de la question rhétorique et le parallélisme sapientiel; la note signale une lecture moins explicitement contrastive.
