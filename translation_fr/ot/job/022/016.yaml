  text: who were snatched away before their time[c][b][a], whose foundation was washed away by a river.
translation:
  language: fr
  text: 'eux qui ont été emportés avant leur temps[a],

    dont le fondement a été emporté par un fleuve[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ont été retranchés avant leur temps ». Le verbe hébreu est difficile et peut évoquer le fait d’être saisi, de se recroqueviller ou d’être soudainement enlevé.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie une image très condensée. La construction peut aussi se comprendre : « dont le fondement a été déversé comme un torrent ». Elle peut évoquer un fondement submergé ou emporté. Le verset fait peut-être allusion à la génération détruite par le déluge ou, plus généralement, à la chute soudaine des méchants.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: eux qui
  rationale: La particule relative reprend les méchants des versets précédents. « Eux qui » assure en français le lien avec le contexte tout en décrivant des personnes.
- source_word: קֻמְּטוּ
  choice: ont été emportés
  rationale: Ce passif difficile évoque ici une disparition soudaine. « Ont été emportés » convient au contexte de mort prématurée et fait écho, sans l'imposer, à l'image des eaux dans le second membre.
- source_word: וְלֹא עֵת
  choice: avant leur temps
  rationale: Cette tournure idiomatique exprime une fin survenue prématurément. Le français est naturel et conserve l'idée temporelle du texte.
- source_word: נָהָר
  choice: un fleuve
  rationale: Le nom désigne normalement un fleuve ou une rivière. « Un fleuve » maintient l'image concrète sans traduire directement par l'interprétation « déluge ».
- source_word: יוּצַק
  choice: ont été balayées
  rationale: Le verbe signifie littéralement « être versé ». Avec les fondations et le fleuve, « ont été balayées » rend naturellement l'effet destructeur des eaux, tandis que le sens littéral est signalé en note.
- source_word: יְסוֹדָם
  choice: leurs fondations
  rationale: Le substantif est morphologiquement au singulier collectif avec un suffixe pluriel. Le pluriel français convient à plusieurs personnes et préserve la métaphore de leur assise détruite.
theological_decisions:
- issue: Portée de l'image du jugement par les eaux
  choice: Conserver l'image d'une disparition prématurée et de fondations détruites par un fleuve, sans identifier explicitement l'événement.
  alternative: Y voir expressément une allusion à la génération détruite par le déluge, ou seulement une métaphore générale de la chute soudaine des méchants.
  rationale: Le contexte et l'image des eaux permettent une allusion au déluge, mais l'hébreu ne l'explicite pas. La traduction préserve donc cette tension plutôt que de trancher.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme poétique est conservé sur deux lignes. « Emportés » et « balayées » rendent clairement la violence soudaine de l'image, tandis que les notes maintiennent les difficultés lexicales et l'ambiguïté historique.
