  text: or darkness[a], so that you cannot see, and an abundance of waters covers you.
translation:
  language: fr
  text: 'ou les ténèbres, si bien que tu ne vois rien,

    et des eaux en abondance te recouvrent.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹ
  choice: ou
  rationale: Le terme introduit avec concision une autre calamité dans l’énumération d’Éliphaz.
- source_word: חֹשֶׁךְ
  choice: les ténèbres
  rationale: Ce nom désigne l’obscurité, au sens propre ou figuré. « Les ténèbres » convient au registre poétique et à l’impossibilité de voir qui suit.
- source_word: לֹא תִרְאֶה
  choice: si bien que tu ne vois rien
  rationale: L’hébreu dit littéralement « tu ne vois pas ». La tournure française explicite avec mesure la valeur résultative suggérée par le contexte, tandis que « rien » rend la phrase naturelle sans ajouter d’objet précis.
- source_word: וְשִׁפְעַת מַיִם
  choice: et une masse d’eaux
  rationale: שִׁפְעָה exprime l’abondance ou le débordement. « Une masse d’eaux » conserve l’image ample sans imposer dans le texte principal l’interprétation plus précise d’un flot ou d’une inondation.
- source_word: תְּכַסֶּךָּ
  choice: te recouvre
  rationale: Le piel de כסה signifie « couvrir, recouvrir ». Ce choix préserve l’image concrète sans l’interpréter d’emblée comme « submerger ».
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et accessible. Le parallélisme et la progression des images sont conservés sur deux lignes, avec tutoiement conformément à l’adresse directe de l’hébreu.
