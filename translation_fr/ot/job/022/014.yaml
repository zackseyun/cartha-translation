id: JOB.22.14
reference: Job 22:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עָבִ֣ים סֵֽתֶר ל֭/וֹ וְ/לֹ֣א יִרְאֶ֑ה וְ/ח֥וּג שָׁ֝מַ֗יִם יִתְהַלָּֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/014.yaml
  text: Clouds are a covering for him[a], so that he does not see; and he walks on the vault of heaven.
translation:
  language: fr
  text: Les nuages lui servent de voile, si bien qu’il ne voit pas ; il parcourt la voûte des cieux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « D’épais nuages lui servent de voile, et il ne voit pas ; il parcourt le cercle des cieux. »'
    reason: Variantes lexicales et syntaxiques possibles pour עָבִים, וְלֹא יִרְאֶה et חוּג.
lexical_decisions:
- source_word: עָבִים
  choice: les nuages
  rationale: Le pluriel désigne des nuages, souvent épais. « Les nuages » est naturel en français, tandis que l’idée d’opacité ressort déjà du voile qui dissimule.
- source_word: סֵתֶר
  choice: voile
  rationale: Le nom exprime ce qui couvre ou dissimule. « Voile » conserve ici l’image concrète d’un écran de nuages empêchant de voir.
- source_word: לוֹ
  choice: lui servent de
  rationale: 'Cette tournure idiomatique rend la relation exprimée par la préposition : les nuages constituent pour lui un moyen de dissimulation.'
- source_word: וְלֹא יִרְאֶה
  choice: si bien qu’il ne voit pas
  rationale: La coordination hébraïque peut exprimer une simple succession (« et il ne voit pas ») ou une conséquence. La formulation retenue rend naturellement le lien logique avec le voile, sans suggérer une incapacité intrinsèque.
- source_word: חוּג
  choice: voûte
  rationale: Le terme évoque un cercle ou une étendue arquée. « Voûte » restitue l’image du ciel comme courbe sans imposer une cosmologie technique.
- source_word: שָׁמַיִם
  choice: des cieux
  rationale: Le pluriel « les cieux » correspond à la forme hébraïque et convient au registre poétique et élevé de ce passage.
- source_word: יִתְהַלָּךְ
  choice: il parcourt
  rationale: La forme verbale évoque le fait de marcher ou de se déplacer çà et là. « Parcourt » est naturel et conserve l’image d’un déplacement sur les hauteurs.
theological_decisions:
- issue: Point de vue du locuteur et antécédent du pronom
  choice: Conserver « il » sans ajouter « Dieu » et présenter le propos comme la continuation de l’accusation qu’Éliphaz attribue à Job.
  alternative: Formuler une affirmation neutre sur la transcendance de Dieu ou expliciter le sujet par « Dieu ».
  rationale: Dans le contexte immédiat de Job 22.13-14, Éliphaz rapporte les paroles qu’il prête à Job. Le pronom maintient l’enchaînement du discours et préserve la tension sans transformer l’accusation rapportée en affirmation du narrateur.
- issue: Rapport entre le voile des nuages et l’absence de vision
  choice: 'Rendre la coordination avec une nuance de conséquence : « si bien qu’il ne voit pas ».'
  alternative: « et il ne voit pas »
  rationale: L’hébreu permet les deux rapports. La conséquence est naturelle dans le contexte, mais l’autre analyse reste signalée en note afin de préserver l’ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, poétique et digne. « Voile », « parcourt » et « voûte des cieux » gardent la force de l’image tout en restant immédiatement compréhensibles.
