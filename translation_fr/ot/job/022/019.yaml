  text: יִרְא֣וּ צַדִּיקִ֣ים וְ/יִשְׂמָ֑חוּ וְ֝/נָקִ֗י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/019.yaml
  text: The righteous see and rejoice[a], and the innocent mock them.
translation:
  language: fr
  text: Les justes voient et se réjouissent, et l’innocent se moque d’eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : rit à leurs dépens ; ou : les tourne en dérision.'
    reason: Alternative lexicale pour יִלְעַג, qui peut évoquer le rire méprisant aussi bien que la moquerie.
lexical_decisions:
- source_word: יִרְאוּ
  choice: voient
  rationale: Le qal inaccompli, 3e personne du pluriel de ראה, exprime ici le fait de percevoir ou d’être témoin de ce qui arrive. « Voient » est direct et naturel, sans ajouter de complément absent de l’hébreu.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: L’adjectif pluriel est employé comme substantif. « Les justes » conserve la catégorie morale du texte dans un français biblique clair et courant.
- source_word: וְיִשְׂמָחוּ
  choice: et se réjouissent
  rationale: Le verbe שׂמח indique la joie éprouvée devant ce qui est vu. « Se réjouissent » en restitue la force sans l’amplifier.
- source_word: וְנָקִי
  choice: et l’innocent
  rationale: L’adjectif singulier est substantivé et peut avoir une portée générique. Le singulier « l’innocent » respecte la forme hébraïque et le parallélisme avec « les justes ».
- source_word: יִלְעַג
  choice: se moque
  rationale: Le qal inaccompli de לעג désigne une réaction de dérision ou de mépris. « Se moque » est naturel en français moderne et conserve cette nuance.
- source_word: לָמוֹ
  choice: d’eux
  rationale: Cette forme pronominale renvoie vraisemblablement aux méchants évoqués dans le contexte. La construction française idiomatique est « se moquer d’eux ».
theological_decisions:
- issue: Référent du pronom לָמוֹ
  choice: Conserver le pronom « eux », compris en contexte comme renvoyant aux méchants dont la chute est décrite.
  alternative: Formuler une affirmation générale sur la joie des justes devant le jugement divin.
  rationale: Le contexte immédiat favorise un renvoi aux méchants, mais les nommer explicitement dans le verset supprimerait le caractère pronominal du texte source et expliciterait inutilement l’interprétation.
- issue: Valeur temporelle des verbes à l’inaccompli
  choice: 'Employer le présent français : « voient », « se réjouissent », « se moque ».'
  alternative: 'Employer le futur : « verront », « se réjouiront », « se moquera ».'
  rationale: L’inaccompli hébreu peut recevoir ici une valeur prospective ou décrire la réaction typique présentée dans le discours. Le présent français reste naturel et préserve cette relative ouverture contextuelle.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe parallèle de l’hébreu est conservée, de même que le contraste entre le pluriel « les justes » et le singulier générique « l’innocent ». Aucun complément implicite n’est ajouté après « voient ».
