source:
  edition: WLC
  text: אִם לֹ֣א נִכְחַ֣ד קִימָ֑/נוּ וְ֝/יִתְרָ֗/ם אָ֣כְלָה אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/020.yaml
  text: Surely our adversaries have been cut off[b][a], and fire has consumed what was left of them.
translation:
  language: fr
  text: Certes, nos adversaires[a] ont été anéantis, et le feu a dévoré ce qui restait d’eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu קִימָנוּ est difficile. Il peut désigner « nos adversaires », comme dans le texte, ou, selon une autre interprétation, « nos biens » ou « ce qui nous appartenait ».
    reason: alternative_reading
  - marker: b
    text: Ou « leur reste ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Oui
  rationale: Dans ce contexte, l’expression a une valeur affirmative et emphatique plutôt que conditionnelle. « Oui » rend cette affirmation avec naturel en français.
- source_word: נִכְחַד
  choice: ont été anéantis
  rationale: Le niphal de כחד exprime ici la disparition ou la destruction subie. « Ont été anéantis » conserve la force passive et résultative sans employer le calque peu naturel « ont été retranchés ».
- source_word: קִימָנוּ
  choice: nos adversaires
  rationale: La forme hébraïque est difficile. Dans le parallélisme, elle désigne vraisemblablement ceux qui se sont dressés contre le groupe parlant, d’où « nos adversaires »; l’incertitude est signalée en note.
- source_word: וְיִתְרָם
  choice: ce qui restait d’eux
  rationale: יתר désigne couramment un reste ou ce qui subsiste. Cette formulation française explicite naturellement le suffixe pronominal tout en conservant l’idée de reste.
- source_word: אָכְלָה אֵשׁ
  choice: le feu a dévoré
  rationale: Le verbe אכל appliqué au feu évoque une destruction qui consume. « Le feu a dévoré » garde cette image vive et demeure idiomatique en français.
theological_decisions:
- issue: Identité du groupe désigné par קִימָנוּ
  choice: nos adversaires
  alternative: nos biens / ce qui nous appartenait
  rationale: Le contexte et le parallélisme favorisent une référence aux opposants, mais le texte hébreu est assez difficile pour que l’autre compréhension soit conservée en note plutôt que tranchée sans réserve.
translation_notes:
  register: Français international moderne, sobre et digne. « Oui » porte l’emphase de l’idiome initial; « anéantis » évite un calque archaïque, tandis que « dévoré » préserve l’image concrète du feu.
