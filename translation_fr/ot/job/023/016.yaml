id: JOB.23.16
reference: Job 23:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֭/אֵל הֵרַ֣ךְ לִבִּ֑/י וְ֝/שַׁדַּ֗י הִבְהִילָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/016.yaml
  text: But God has made my heart faint[a], and the Almighty has terrified me.
translation:
  language: fr
  text: Mais Dieu a fait défaillir mon cœur[a], et le Tout-Puissant m’a terrifié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a rendu mon cœur sans force ». Le verbe hébreu signifie littéralement « rendre mou, tendre » ; ici, il indique probablement que Job a perdu courage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵל
  choice: Mais Dieu
  rationale: 'אֵל désigne ici Dieu. La conjonction וְ peut signifier « et », mais le contexte permet une nuance adversative : Job oppose implicitement la possibilité de tenir devant Dieu au fait que Dieu lui-même lui ôte son courage.'
- source_word: הֵרַךְ
  choice: a fait défaillir
  rationale: Le verbe signifie littéralement « rendre mou, tendre ». Avec « cœur », il exprime ici la perte du courage ou de la force intérieure. « Faire défaillir » restitue ce sens tout en conservant l’image du cœur.
- source_word: לִבִּי
  choice: mon cœur
  rationale: Le terme désigne le cœur comme siège de la vie intérieure, notamment du courage. Le maintien de l’image hébraïque est naturel en français.
- source_word: וְשַׁדַּי
  choice: et le Tout-Puissant
  rationale: שַׁדַּי est un titre divin. « Le Tout-Puissant » en donne le sens traditionnel et intelligible, tout en préservant le parallélisme avec « Dieu ».
- source_word: הִבְהִילָנִי
  choice: m’a terrifié
  rationale: La forme causative de בהל exprime le fait de jeter quelqu’un dans l’effroi ou la consternation. « M’a terrifié » rend clairement l’intensité du propos.
theological_decisions:
- issue: Traduction des désignations divines אֵל et שַׁדַּי
  choice: Dieu… le Tout-Puissant
  alternative: Dieu… Shaddaï
  rationale: Le premier terme est une désignation courante de Dieu et le second un titre divin. Traduire שַׁדַּי communique sa portée au lecteur francophone sans introduire d’interprétation confessionnelle particulière.
- issue: Sens de l’action divine sur le cœur de Job
  choice: Dieu a fait défaillir mon cœur
  alternative: Dieu a rendu mon cœur tendre
  rationale: Le sens concret de « rendre mou/tendre » demeure signalé en note, tandis que le contexte de peur indique probablement une perte de courage. La traduction n’attribue pas ici à Job une transformation morale ou spirituelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé composé convient à l’effet présent de l’action décrite. « Faire défaillir le cœur » conserve l’image hébraïque tout en restant compréhensible.
