id: JOB.23.10
reference: Job 23:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי יָ֭דַע דֶּ֣רֶךְ עִמָּדִ֑/י בְּ֝חָנַ֗/נִי כַּ/זָּהָ֥ב אֵצֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/010.yaml
  text: But he knows the way with me[a]; when he has tested me[b], I will come out like gold.
translation:
  language: fr
  text: Mais lui, il connaît le chemin qui est le mien[a] ; quand il m’aura mis à l’épreuve[b], j’en sortirai comme l’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il connaît mon chemin ». L’hébreu dit plus littéralement « il connaît le chemin avec moi », expression dont le sens précis demeure incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « s’il me met à l’épreuve » ou « après m’avoir mis à l’épreuve ». La construction hébraïque permet plusieurs nuances temporelles.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Mais
  rationale: Dans le contexte, la particule introduit un contraste entre l’incapacité de Job à trouver Dieu et la connaissance que Dieu a de lui. « Mais » rend naturellement cette valeur adversative.
- source_word: יָדַע
  choice: il connaît
  rationale: Le verbe exprime ici la connaissance pleine et actuelle que Dieu possède du parcours de Job.
- source_word: דֶּרֶךְ עִמָּדִי
  choice: le chemin qui est le mien
  rationale: Cette formulation française reste proche de l’expression hébraïque inhabituelle, littéralement « le chemin avec moi », tout en étant intelligible. Elle évite de préciser indûment s’il s’agit du chemin de Job ou du chemin suivi par Dieu à son égard.
- source_word: בְּחָנַנִי
  choice: quand il m’aura mis à l’épreuve
  rationale: בחן signifie examiner ou éprouver, notamment comme on vérifie un métal. Le futur antérieur exprime naturellement en français l’épreuve antérieure au résultat, sans exclure les autres nuances possibles de la construction.
- source_word: כַּזָּהָב
  choice: comme l’or
  rationale: La préposition כְּ marque la comparaison ; « comme l’or » conserve sobrement l’image du métal éprouvé.
- source_word: אֵצֵא
  choice: j’en sortirai
  rationale: Le verbe יצא signifie sortir ou émerger. Le pronom « en » relie naturellement en français l’issue à l’épreuve évoquée, sans ajouter l’idée explicite de purification.
theological_decisions:
- issue: Rapport entre l’épreuve divine et la justification de Job
  choice: Conserver l’image ouverte d’une épreuve dont Job sortira comme l’or.
  alternative: Interpréter explicitement l’image comme une déclaration d’innocence ou comme une purification morale.
  rationale: L’hébreu permet d’entendre soit la manifestation de l’intégrité de Job, soit sa purification, sans trancher explicitement. La traduction préserve cette tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure légèrement marquée « le chemin qui est le mien » conserve l’étrangeté réelle de l’hébreu sans devenir obscure ; le reste du verset suit une syntaxe naturelle et sobre.
