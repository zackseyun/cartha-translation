  variant: modern international French
source:
  edition: WLC
  text: גַּם הַ֭/יּוֹם מְרִ֣י שִׂחִ֑/י יָ֝דִ֗/י כָּבְדָ֥ה עַל אַנְחָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/002.yaml
  text: Even today my complaint is rebellious[b][a]; my hand is heavy because of my groaning.
translation:
  language: fr
  text: Aujourd’hui encore, ma plainte est rebelle[a] ; ma main pèse lourd à cause de mon gémissement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma plainte est amère ». Le terme hébreu signifie plus littéralement la rébellion ou la défiance, mais certains l’interprètent ici, d’après le contexte, au sens d’amertume.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ma main est lourde sur mon gémissement ». Le sens de cette expression est incertain. Certains comprennent « main » de façon idiomatique ; d’autres corrigent le texte pour lire « sa main ».'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם הַיּוֹם
  choice: Aujourd’hui encore
  rationale: 'Cette tournure française naturelle exprime l’insistance temporelle : la situation de Job persiste jusqu’au jour présent.'
- source_word: מְרִי
  choice: rebelle
  rationale: Le nom hébreu désigne normalement la rébellion ou la défiance. L’adjectif français s’accorde naturellement avec « plainte » tout en conservant la force dérangeante du terme.
- source_word: שִׂיחִי
  choice: ma plainte
  rationale: Dans le contexte de Job, le mot peut désigner la parole, la méditation ou la plainte. Le parallèle avec le gémissement favorise ici « plainte ».
- source_word: יָדִי
  choice: ma main
  rationale: Le texte massorétique porte clairement le suffixe de première personne. La traduction le conserve malgré l’obscurité de l’expression.
- source_word: כָּבְדָה
  choice: pèse lourd
  rationale: Cette expression rend l’idée de poids tout en donnant en français une proposition idiomatique avec « main ».
- source_word: עַל
  choice: à cause de
  rationale: La préposition exprime ici le rapport entre la lourdeur de la main et le gémissement. La valeur causale est intelligible dans le contexte, tandis que la note signale la formulation plus littérale.
- source_word: אַנְחָתִי
  choice: mon gémissement
  rationale: Le singulier hébreu désigne le soupir ou le gémissement douloureux de Job ; le singulier est conservé.
theological_decisions:
- issue: Faut-il atténuer la manière dont Job qualifie sa propre plainte afin d’éviter l’idée de défiance ?
  choice: Conserver « ma plainte est rebelle » dans le texte principal.
  alternative: « ma plainte est amère »
  rationale: Le sens lexical le plus direct évoque la rébellion ou la défiance. Cette formulation maintient la tension du passage sans décider à l’avance si les paroles de Job doivent être moralement condamnées.
- issue: Faut-il remplacer « ma main » par « sa main » pour obtenir un sens plus attendu ?
  choice: Conserver « ma main » conformément au texte massorétique.
  alternative: « sa main pèse lourd »
  rationale: L’expression transmise est difficile, mais la corriger dans le texte principal supprimerait une ambiguïté réelle de la tradition hébraïque.
translation_notes:
  register: Français international actuel, sobre et digne. « Aujourd’hui encore » et « pèse lourd » assurent une lecture naturelle, tandis que les notes conservent les difficultés lexicales et textuelles de l’hébreu.
