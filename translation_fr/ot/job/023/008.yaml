  variant: modern international French
source:
  edition: WLC
  text: הֵ֤ן קֶ֣דֶם אֶהֱלֹ֣ךְ וְ/אֵינֶ֑/נּוּ וְ֝/אָח֗וֹר וְֽ/לֹא אָבִ֥ין לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/008.yaml
  text: Look[a], I go east, but he is not there; and west, but I do not perceive him.
translation:
  language: fr
  text: Voici[a], je vais vers l’est, mais il n’y est pas ; vers l’ouest, mais je ne le perçois pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en avant… en arrière ». Les termes hébreux peuvent désigner soit l’est et l’ouest, soit l’avant et l’arrière.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: Particule qui attire l’attention tout en donnant ici une légère force d’insistance. « Oui » reste naturel et digne en français moderne ; « voici » risquerait de suggérer une présentation visuelle absente du contexte.
- source_word: קֶדֶם
  choice: vers l’est
  rationale: Dans le parallélisme avec אָחוֹר, le sens spatial « est » est naturel. La préposition « vers » rend idiomatiquement la direction du déplacement exprimé par אֶהֱלֹךְ.
- source_word: אֶהֱלֹךְ
  choice: je vais
  rationale: Le qal inaccompli à la première personne décrit le déplacement de Job dans sa recherche. « Je vais » est simple et ne précise pas indûment la manière de se déplacer.
- source_word: וְאֵינֶנּוּ
  choice: mais il n’est pas là
  rationale: Le waw prend naturellement une valeur adversative dans le contexte d’une recherche infructueuse. « Là » explicite en français l’absence au lieu recherché sans modifier le sens.
- source_word: אָחוֹר
  choice: vers l’ouest
  rationale: Comme pendant opposé de קֶדֶם, le terme désigne ici naturellement l’ouest. L’ambiguïté possible avec « en arrière » est conservée en note.
- source_word: לֹא אָבִין לוֹ
  choice: je ne le distingue pas
  rationale: בין exprime ici le fait de discerner ou de percevoir. « Distinguer » convient à la recherche de la présence de Dieu et conserve une nuance de discernement sans réduire le verbe à la seule vision.
theological_decisions:
- issue: Référent des pronoms masculins singuliers
  choice: Les pronoms renvoient à Dieu, rendu par « il » et « le ».
  alternative: Un référent masculin singulier laissé non identifié.
  rationale: Le contexte immédiat présente Job cherchant Dieu ; les pronoms français suffisent à reprendre ce référent sans ajouter de désignation théologique.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme directionnel est maintenu, ainsi que le contraste entre la démarche de Job et son incapacité à trouver ou discerner Dieu.
