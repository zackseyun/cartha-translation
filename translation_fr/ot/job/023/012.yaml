  source_fidelity: 'Le texte rend fidèlement les deux propositions hébraïques : Job ne s’est pas écarté du commandement venant des lèvres de Dieu, et il a mis les paroles de sa bouche en réserve comme un bien précieux. « Plus que la part qui m’était attribuée » transmet de façon défendable le sens comparatif adopté pour la difficile expression מֵחֻקִּי, sans réduire indûment cette « part » à la nourriture.'
  naturalness: 'Le français est moderne, clair et de registre sobrement poétique. « Gardé précieusement » est une bonne formulation pour צָפַנְתִּי : elle conserve l’idée de conserver en réserve tout en suggérant la valeur accordée aux paroles.'
