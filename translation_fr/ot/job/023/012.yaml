  variant: modern international French
source:
  edition: WLC
  text: מִצְוַ֣ת שְׂ֭פָתָי/ו וְ/לֹ֣א אָמִ֑ישׁ מֵ֝/חֻקִּ֗/י צָפַ֥נְתִּי אִמְרֵי פִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/012.yaml
  text: I have not turned aside from the command of his lips[a]; I have treasured the words of his mouth more than my allotted portion.
translation:
  language: fr
  text: Je ne me suis pas écarté du commandement de ses lèvres ; j’ai gardé précieusement les paroles de sa bouche plus que la part qui m’était attribuée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une interprétation traditionnelle d’une expression hébraïque difficile : « j’ai gardé précieusement les paroles de sa bouche plus que la nourriture qui m’était nécessaire ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִצְוַת
  choice: du commandement
  rationale: Le nom est au singulier construit. « Commandement » en conserve la force et s’accorde naturellement avec « de ses lèvres ».
- source_word: שְׂפָתָיו
  choice: de ses lèvres
  rationale: La traduction concrète préserve le parallélisme poétique avec « sa bouche » ; le suffixe masculin singulier renvoie à Dieu dans le contexte.
- source_word: לֹא אָמִישׁ
  choice: je ne me suis pas écarté
  rationale: Le hifil de מוש exprime ici l’idée de ne pas s’éloigner ou dévier. Cette formulation est naturelle en français et convient au contexte de fidélité.
- source_word: מֵחֻקִּי
  choice: plus que la part qui m’était attribuée
  rationale: L’expression hébraïque est difficile. Cette traduction comprend מִן dans un sens comparatif et חֹק comme une part assignée, tout en évitant de préciser dans le texte qu’il s’agit nécessairement de nourriture.
- source_word: צָפַנְתִּי
  choice: j’ai gardé précieusement
  rationale: Le verbe signifie cacher ou mettre en réserve et peut, dans la littérature de sagesse, exprimer l’idée de conserver comme un trésor. « Gardé précieusement » rend ces deux nuances.
- source_word: אִמְרֵי
  choice: les paroles
  rationale: Équivalent français direct et naturel de ce pluriel construit.
- source_word: פִיו
  choice: de sa bouche
  rationale: La traduction littérale conserve l’image concrète et le parallélisme avec « ses lèvres ».
theological_decisions:
- issue: Référent des suffixes masculins singuliers dans « ses lèvres » et « sa bouche »
  choice: Ils renvoient à Dieu.
  alternative: Ils pourraient désigner un locuteur non précisé dans une lecture plus générale.
  rationale: Dans Job 23, Job expose sa fidélité devant Dieu et envers sa parole. Le contexte immédiat soutient fortement ce référent sans qu’il soit nécessaire d’ajouter « Dieu » au texte.
- issue: Interprétation de מֵחֻקִּי
  choice: 'Sens comparatif : « plus que la part qui m’était attribuée »'
  alternative: « loin de ma prescription » ou, selon une interprétation traditionnelle, « plus que la nourriture qui m’était nécessaire »
  rationale: 'La forme du texte consonantique assortie du suffixe de première personne est difficile. Le choix principal reste proche de la forme reçue et donne un sens cohérent : Job estime les paroles divines plus que sa propre part. L’interprétation traditionnelle liée à la nourriture est conservée en note.'
translation_notes:
  register: Français international moderne, digne et poétique. Les images parallèles des « lèvres » et de la « bouche » sont conservées, tandis que l’expression hébraïque difficile de la fin du verset reste suffisamment ouverte dans le texte principal et fait l’objet d’une variante en note.
