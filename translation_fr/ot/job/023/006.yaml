revisions:
- from: Est-ce avec toute sa puissance qu’il me ferait un procès ? Non ; il prêterait plutôt attention à moi.[a]
  to: Me ferait-il un procès avec une grande puissance ? Non ; il ferait seulement attention à moi.[a]
  rationale: La révision corrige l’intensité excessive de « toute sa puissance » et rend plus directement la particule אַךְ par « seulement ». Elle conserve une formulation judiciaire naturelle et maintient, en note, l’ambiguïté lexicale réelle du dernier verbe.
