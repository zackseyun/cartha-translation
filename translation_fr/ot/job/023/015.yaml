  yaml_path: translation/ot/job/023/015.yaml
  text: Therefore I am terrified before him[a]; when I consider[b], I am afraid of him.
translation:
  language: fr
  text: C’est pourquoi je suis terrifié devant lui[a] ; quand je réfléchis[b], j’ai peur de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à sa présence », « devant lui » ou « à cause de lui » ; l’hébreu dit littéralement « de devant sa face » et peut désigner sa présence.
    reason: lexical_alternative
  - marker: b
    text: Ou « quand je médite » ou « quand je considère ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution marque la conséquence de ce qui précède et conserve clairement la force déductive de l’hébreu.
- source_word: מִפָּנָיו
  choice: devant lui
  rationale: Cette expression naturelle garde l’idée concrète de se trouver face à sa présence, sans imposer la lecture plus causale « à cause de lui ».
- source_word: אֶבָּהֵל
  choice: je suis terrifié
  rationale: Le niphal de בהל exprime ici un profond bouleversement mêlé d’effroi ; « terrifié » en restitue l’intensité.
- source_word: אֶתְבּוֹנֵן
  choice: quand j’y réfléchis
  rationale: La forme réfléchie de בין désigne un examen attentif ou une réflexion ; « j’y réfléchis » est idiomatique et rattache naturellement la pensée à la situation évoquée.
- source_word: וְאֶפְחַד
  choice: j’ai peur
  rationale: פחד exprime directement la peur ; cette formulation actuelle et naturelle maintient le parallélisme avec « je suis terrifié ».
- source_word: מִמֶּנּוּ
  choice: de lui
  rationale: Avec le verbe exprimant la peur, « avoir peur de lui » rend directement et idiomatiquement la construction hébraïque.
theological_decisions:
- issue: Référent des suffixes masculins de la troisième personne
  choice: Conserver « lui », avec Dieu comme référent contextuel
  alternative: Introduire explicitement « Dieu »
  rationale: L’hébreu emploie des pronoms et le contexte en établit le référent. Les conserver respecte la progression du discours sans ajouter un titre absent du verset.
- issue: Intensité de la réaction de Job devant Dieu
  choice: Employer « terrifié » et « peur »
  alternative: Atténuer par « troublé » ou « saisi de respect »
  rationale: Le texte exprime un effroi réel. La traduction maintient cette tension théologique sans la réduire à une simple révérence.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation conserve les deux mouvements parallèles du verset, et les pronoms préservent la formulation sobre de l’hébreu.
