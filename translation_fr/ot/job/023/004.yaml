source:
  edition: WLC
  text: אֶעֶרְכָ֣ה לְ/פָנָ֣י/ו מִשְׁפָּ֑ט וּ֝/פִ֗/י אֲמַלֵּ֥א תוֹכָחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/004.yaml
  text: I would lay out my case before him[b][a], and fill my mouth with arguments.
translation:
  language: fr
  text: J’exposerais devant lui ma cause[a], et je remplirais ma bouche d’arguments[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’organiserais devant lui ma défense ». Le mot hébreu a ici un sens judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « preuves », « réfutations », « remontrances » ou « contestations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֶרְכָה
  choice: J’exposerais
  rationale: Le verbe ערך exprime l’action de disposer ou de présenter de manière ordonnée. Dans ce cadre judiciaire, « exposerais » rend naturellement l’idée de présenter méthodiquement une cause.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Rend directement l’expression « devant sa face / en sa présence » tout en conservant sa portée relationnelle et judiciaire.
- source_word: מִשְׁפָּט
  choice: ma cause
  rationale: Dans le contexte, משפט désigne l’affaire judiciaire que Job voudrait présenter. Le possessif, implicite dans la situation, produit un français naturel sans effacer le sens juridique.
- source_word: וּפִי
  choice: ma bouche
  rationale: La formulation littérale conserve l’image hébraïque, naturelle avec le verbe « remplir ».
- source_word: אֲמַלֵּא
  choice: je remplirais
  rationale: Le conditionnel prolonge la valeur hypothétique du premier verbe et préserve l’image forte de la bouche remplie de paroles argumentatives.
- source_word: תוֹכָחוֹת
  choice: arguments
  rationale: Le terme peut évoquer des preuves, des réfutations, des remontrances ou des contestations. Ici, le cadre judiciaire favorise « arguments », sans exclure entièrement la tonalité de confrontation.
theological_decisions:
- issue: L’imagerie judiciaire dans les paroles de Job adressées à Dieu
  choice: Employer « exposer ma cause » et « arguments » afin de maintenir la scène judiciaire et l’audace de Job.
  alternative: Employer une formulation plus générale comme « présenter mon affaire » ou « exprimer mes plaintes ».
  rationale: La combinaison de ערך, משפט et תוכחות construit une évocation judiciaire. La traduction ne doit ni atténuer la hardiesse de Job ni lui attribuer une irrévérence plus forte que celle du texte.
translation_notes:
  register: Français moderne, international et digne. Le conditionnel exprime l’hypothèse ouverte au verset précédent. La métaphore de la bouche remplie est conservée, ainsi que le vocabulaire judiciaire.
