  yaml_path: translation/ot/job/023/005.yaml
  text: I would know the words with which he would answer me, and understand what he would say to me.
translation:
  language: fr
  text: Je connaîtrais les paroles par lesquelles il me répondrait, et je comprendrais ce qu’il me dirait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵדְעָה
  choice: Je connaîtrais
  rationale: Le cohortatif de ידע exprime ici le résultat désiré dans la situation hypothétique où Job pourrait comparaître devant Dieu. Le conditionnel français rend naturellement cette valeur sans la réduire à un simple futur.
- source_word: מִלִּים
  choice: les paroles
  rationale: מִלִּים désigne simplement des paroles ou des mots. « Les paroles » convient au registre digne et à la proposition relative qui suit, sans surinterpréter le cadre judiciaire par « arguments ».
- source_word: יַעֲנֵנִי
  choice: il me répondrait
  rationale: ענה signifie ici « répondre ». Le conditionnel maintient le cadre hypothétique établi par le contexte.
- source_word: וְאָבִינָה
  choice: et je comprendrais
  rationale: בין exprime l’action de comprendre ou de discerner. La répétition explicite du sujet et du conditionnel donne une phrase française naturelle et conserve le parallélisme avec « Je connaîtrais ».
- source_word: מַה
  choice: ce que
  rationale: L’interrogatif introduit ici le contenu des paroles divines. En français, « ce que » est la tournure idiomatique dans cette interrogation indirecte.
- source_word: יֹאמַר לִי
  choice: il me dirait
  rationale: אמר est le verbe courant « dire ». « Il me dirait » préserve sa simplicité ainsi que la relation directe exprimée par לִי.
