  text: וְ/ה֣וּא בְ֭/אֶחָד וּ/מִ֣י יְשִׁיבֶ֑/נּוּ וְ/נַפְשׁ֖/וֹ אִוְּתָ֣ה וַ/יָּֽעַשׂ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/013.yaml
  text: But he is one[a], and who can turn him back? What his soul desires[b], that he does.
translation:
  language: fr
  text: Mais lui, il demeure le même[a] ; qui peut le faire changer ? Ce qu’il désire[b], il le fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, l’hébreu dit : « mais lui, dans un ». Le sens est probablement qu’il est d’une seule pensée ou qu’il ne change pas de dessein.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « ce que son âme désire » ; en hébreu, « son âme » peut désigner la personne elle-même, notamment sa volonté ou son désir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא בְאֶחָד
  choice: Mais lui, il demeure le même
  rationale: La tournure hébraïque, littéralement « lui, en un », est difficile. Dans le contexte, elle évoque probablement la constance d’une résolution. « Demeure le même » exprime ce sens tout en évitant d’introduire une affirmation métaphysique plus large.
- source_word: וּמִי יְשִׁיבֶנּוּ
  choice: qui le fera revenir sur sa décision ?
  rationale: Le hiphil de שוב signifie ici faire revenir ou détourner. La mention de la décision explicite naturellement en français l’idée contextuelle, à savoir faire changer Dieu de dessein.
- source_word: וְנַפְשׁוֹ אִוְּתָה
  choice: Ce qu’il désire
  rationale: נפש désigne ici la personne elle-même comme siège de la volonté. Traduire littéralement « ce que son âme désire » serait possible, mais moins naturel en français moderne et risquerait de suggérer une distinction anthropologique étrangère au propos.
- source_word: וַיָּעַשׂ
  choice: il le fait
  rationale: Rend simplement le verbe courant עשה et reprend par « le » l’objet exprimé dans la proposition précédente.
theological_decisions:
- issue: Sens de בְאֶחָד appliqué à Dieu
  choice: il demeure le même
  alternative: il est un ; il n’a qu’une pensée ; il est invariable
  rationale: L’hébreu conserve une réelle ambiguïté. Le contexte met surtout en avant la fermeté du dessein divin et l’impossibilité de le détourner. Le texte principal donne ce sens probable, tandis que la note maintient la formulation littérale.
- issue: Expression anthropomorphique « son âme désire »
  choice: Ce qu’il désire
  alternative: Ce que son âme désire
  rationale: L’expression hébraïque attribue idiomatiquement le désir à la נפש, c’est-à-dire à la personne elle-même. Une note préserve cette forme sans imposer au lecteur une conception particulière de la nature divine.
translation_notes:
  register: Français international moderne, sobre et digne. La dislocation « Mais lui, il… » rend l’insistance du pronom indépendant. Le tiret souligne le contraste entre la résolution divine et l’impossibilité de la faire changer.
