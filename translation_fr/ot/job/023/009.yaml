id: JOB.23.9
reference: Job 23:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שְׂמֹ֣אול בַּ/עֲשֹׂת֣/וֹ וְ/לֹא אָ֑חַז יַעְטֹ֥ף יָ֝מִ֗ין וְ/לֹ֣א אֶרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/009.yaml
  text: On the left[a], when he is at work, I do not perceive him; he turns to the right[b], and I do not see him.
translation:
  language: fr
  text: À gauche[a], quand il agit, je ne peux pas le saisir ; il se dérobe à droite[b], et je ne le vois pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots hébreux traduits par « gauche » et « droite » peuvent aussi correspondre respectivement au nord et au sud ; la traduction conserve ici le contraste spatial du poème.
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement : « il s’enveloppe » ou « il se couvre » à droite, c’est-à-dire qu’il s’y cache ou s’y voile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאול
  choice: à gauche
  rationale: Le nom désigne d’abord la gauche et peut, par extension, évoquer le nord. « À gauche » préserve ici le contraste poétique avec יָמִין, « à droite ».
- source_word: בַּעֲשֹׂתוֹ
  choice: quand il agit
  rationale: 'La préposition ב suivie de l’infinitif construit de עשה et du suffixe de troisième personne exprime naturellement une circonstance temporelle : « quand il agit ».'
- source_word: אָחַז
  choice: je ne peux pas le saisir
  rationale: Le verbe signifie fondamentalement « saisir, empoigner ». En français, « saisir » conserve à la fois l’image concrète et la nuance possible d’une incapacité à percevoir ou à appréhender Dieu.
- source_word: יַעְטֹף
  choice: il se dérobe
  rationale: Le verbe peut évoquer le fait de s’envelopper ou de se couvrir. Dans ce contexte de recherche infructueuse, « se dérobe » rend naturellement l’idée qu’il demeure hors de vue, tandis que le sens plus littéral est signalé en note.
- source_word: יָמִין
  choice: à droite
  rationale: Le sens spatial premier est « droite ». Ce choix maintient le parallélisme gauche-droite plutôt que de le convertir en points cardinaux.
- source_word: אֶרְאֶה
  choice: je ne le vois pas
  rationale: Le verbe ראה signifie directement « voir ». Le pronom objet, implicite en hébreu, est explicité en français d’après le contexte.
theological_decisions:
- issue: Référent des verbes et des pronoms à la troisième personne
  choice: Dieu, sans le nommer explicitement dans ce verset
  alternative: Un sujet masculin non précisé
  rationale: Le verset ne nomme pas Dieu, mais le contexte immédiat de Job 23.8-10 montre que Job parle de sa recherche de Dieu. Les pronoms français conservent l’implicite du texte sans ajouter une précision doctrinale.
- issue: Portée de l’impossibilité exprimée par אָחַז
  choice: Incapacité de saisir Dieu, avec une possible nuance de perception
  alternative: Simple absence de perception visuelle
  rationale: « Saisir » maintient la force concrète du verbe hébreu et son ouverture métaphorique, sans réduire d’emblée le propos au seul fait de voir.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme gauche-droite est conservé, ainsi que la distinction entre « saisir » et « voir ». « Il se dérobe » évite une formulation littérale obscure tout en laissant le sens concret de יַעְטֹף accessible en note.
