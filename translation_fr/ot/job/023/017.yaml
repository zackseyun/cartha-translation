source:
  edition: WLC
  text: כִּֽי לֹ֣א נִ֭צְמַתִּי מִ/פְּנֵי חֹ֑שֶׁךְ וּ֝/מִ/פָּנַ֗/י כִּסָּה אֹֽפֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/017.yaml
  text: For I was not silenced because of the darkness[a], nor because deep gloom covered my face.
translation:
  language: fr
  text: Car je n’ai pas été réduit au silence à cause des ténèbres[a], ni parce que l’obscurité profonde a couvert mon visage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car je n’ai pas été retranché à cause des ténèbres, ni parce que l’obscurité épaisse a couvert mon visage. » L’hébreu de ce verset est difficile, notamment quant au sens de « réduit au silence/retranché » et à la question de savoir si la seconde proposition signifie « a couvert mon visage » ou « a couvert ce qui était devant moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici une explication liée à l’affirmation précédente, sans imposer une nuance de certitude absente du texte.
- source_word: נִצְמַתִּי
  choice: je n’ai pas été réduit au silence
  rationale: Le nifal de צמת peut signifier « être réduit au silence », « être retranché » ou « être anéanti ». Dans le contexte de la plainte persistante de Job, « réduit au silence » convient bien tout en laissant l’autre sens en note.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: à cause des ténèbres
  rationale: מִפְּנֵי exprime vraisemblablement ici la cause plutôt qu’une relation spatiale; « à cause de » est naturel et précis en français.
- source_word: וּמִפָּנַי
  choice: mon visage
  rationale: Le suffixe de première personne sur פָּנִים permet la lecture concrète « mon visage », même si la tournure peut aussi être comprise comme « devant moi ».
- source_word: כִּסָּה
  choice: a couvert
  rationale: Rend directement le sens courant de כסה, « couvrir » ou « dissimuler ».
- source_word: אֹפֶל
  choice: l’obscurité profonde
  rationale: Distingue אֹפֶל, obscurité épaisse ou profonde, de חֹשֶׁךְ, rendu plus tôt par « ténèbres ».
theological_decisions:
- issue: Le lien entre les ténèbres et le fait que Job n’a pas été réduit au silence
  choice: Conserver la négation et la relation causale telles qu’elles apparaissent dans l’hébreu
  alternative: Comprendre que Job aurait souhaité être retranché avant l’arrivée des ténèbres
  rationale: La syntaxe hébraïque est difficile, mais la traduction ne doit pas réorganiser le verset pour résoudre sa tension poétique.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme poétique et la distinction entre חֹשֶׁךְ et אֹפֶל sont préservés; l’ambiguïté majeure est signalée en note.
