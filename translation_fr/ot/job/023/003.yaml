reference: Job 23:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִֽי יִתֵּ֣ן יָ֭דַעְתִּי וְ/אֶמְצָאֵ֑/הוּ אָ֝ב֗וֹא עַד תְּכוּנָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/003.yaml
  text: Oh[a], that I knew where I might find him, that I might come to his dwelling place.
translation:
  language: fr
  text: Si seulement je savais où le trouver ! J’irais jusqu’à sa demeure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son lieu fixe » ; le terme hébreu désigne un endroit établi où quelqu’un se trouve.'
    reason: Alternative lexicale pour תְּכוּנָתוֹ, dont « demeure » exprime le sens en contexte sans épuiser la nuance de lieu fixe.
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Si seulement
  rationale: Cette tournure idiomatique exprime un souhait ardent plutôt qu’une question littérale (« Qui donnera ? »). « Si seulement » est naturel en français moderne et conserve la force optative.
- source_word: יָדַעְתִּי וְאֶמְצָאֵהוּ
  choice: je savais où le trouver
  rationale: Littéralement, la suite peut se comprendre comme « je savais et je le trouvais ». Dans ce contexte de recherche, le français idiomatique explicite le rapport implicite entre savoir et trouver par « où », sans préciser davantage le lieu.
- source_word: אָבוֹא עַד
  choice: J’irais jusqu’à
  rationale: L’imparfait à valeur conditionnelle prolonge le souhait exprimé au début du verset. « Jusqu’à » conserve la notion de mouvement vers une destination portée par עַד.
- source_word: תְּכוּנָתוֹ
  choice: sa demeure
  rationale: Le nom désigne un lieu fixe ou établi. « Demeure » exprime naturellement ici le lieu où Dieu peut être trouvé, tout en évitant d’introduire explicitement l’idée plus interprétative de trône ou de tribunal.
theological_decisions:
- issue: Référent des suffixes masculins singuliers (« le », « sa »)
  choice: Dieu est le référent implicite.
  alternative: Nommer explicitement Dieu dans le verset.
  rationale: Le contexte immédiat montre que Job cherche Dieu afin de lui présenter sa cause. Le texte hébreu ne le nomme toutefois pas dans ce verset ; les pronoms préservent donc cette formulation implicite.
translation_notes:
  register: Français international actuel, sobre et digne. L’exclamation rend l’intensité du souhait de Job ; les deux phrases assurent une lecture naturelle tout en conservant le mouvement du texte hébreu.
