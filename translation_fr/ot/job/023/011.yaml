id: JOB.23.11
reference: Job 23:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ֭/אֲשֻׁר/וֹ אָחֲזָ֣ה רַגְלִ֑/י דַּרְכּ֖/וֹ שָׁמַ֣רְתִּי וְ/לֹא אָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/011.yaml
  text: My foot has held fast to his steps[a]; I have kept his way and have not turned aside.
translation:
  language: fr
  text: Mon pied s’est attaché à ses pas[a] ; j’ai gardé sa voie et ne m’en suis pas écarté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mon pied a fermement saisi son pas » ; l’image hébraïque évoque une adhésion étroite aux pas de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֻׁרוֹ
  choice: à ses pas
  rationale: אֲשׁוּר désigne le pas ou l’empreinte du pas. Le pluriel français s’intègre naturellement à l’image d’une marche suivant de près les pas de Dieu.
- source_word: אָחֲזָה
  choice: s’est attaché
  rationale: Le verbe אחז signifie saisir ou tenir fermement. Avec « mon pied » pour sujet, « s’est attaché » exprime une adhésion ferme sans suggérer une saisie violente.
- source_word: רַגְלִי
  choice: Mon pied
  rationale: Le singulier concret de l’hébreu est conservé et reste naturel en français.
- source_word: דַּרְכּוֹ
  choice: sa voie
  rationale: דֶּרֶךְ désigne une voie, un chemin ou une conduite. « Sa voie » préserve à la fois l’image du chemin et sa portée morale.
- source_word: שָׁמַרְתִּי
  choice: j’ai gardé
  rationale: שׁמר peut signifier garder, observer ou veiller sur. « J’ai gardé sa voie » rend directement l’idée d’une fidélité attentive.
- source_word: וְלֹא אָט
  choice: et ne m’en suis pas écarté
  rationale: Dans ce contexte de marche, אָט exprime le fait de dévier ou de se détourner. Le pronom « en » renvoie naturellement à « sa voie » et conserve l’image directrice.
theological_decisions:
- issue: Référent des suffixes masculins singuliers dans « ses pas » et « sa voie »
  choice: Dieu est le référent implicite.
  alternative: Une voie juste non spécifiée.
  rationale: Dans le contexte immédiat, Job parle de Dieu et de son intégrité devant lui. Les pronoms possessifs préservent cette référence personnelle sans ajouter le nom de Dieu au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image concrète du pied, des pas et de la voie, ainsi que le parallélisme du verset.
