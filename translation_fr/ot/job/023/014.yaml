source:
  edition: WLC
  text: כִּ֭י יַשְׁלִ֣ים חֻקִּ֑/י וְ/כָ/הֵ֖נָּה רַבּ֣וֹת עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/014.yaml
  text: For he will complete what is appointed for me[a], and many such things are with him.
translation:
  language: fr
  text: Car il accomplira ce qui m’est assigné[a], et beaucoup de choses semblables sont auprès de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon décret », « ce qui m’est prescrit » ou « la part qui m’est assignée ». Le terme hébreu peut désigner ce qui est prescrit ou fixé pour Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente avec une valeur causale naturelle en français.
- source_word: יַשְׁלִים
  choice: il accomplira
  rationale: Le hifil de שׁלם exprime ici l’action de mener jusqu’à son terme; « accomplira » convient à ce qui a été fixé ou prescrit.
- source_word: חֻקִּי
  choice: ce qui m’est assigné
  rationale: Dans ce contexte, חֹק désigne vraisemblablement ce qui a été fixé ou attribué à Job. Cette formulation reste idiomatique sans réduire le mot à son seul sens juridique.
- source_word: וְכָהֵנָּה רַבּוֹת
  choice: et bien d’autres choses semblables
  rationale: Rend l’idée de nombreuses réalités du même genre tout en conservant l’indétermination du texte.
- source_word: עִמּוֹ
  choice: sont auprès de lui
  rationale: Reproduit sobrement l’expression hébraïque et laisse ouverte l’idée qu’elles relèvent de son conseil, de sa disposition ou de son pouvoir.
theological_decisions:
- issue: Faut-il donner à חֻקִּי un sens juridique (« mon décret », « mon statut ») ou celui du sort assigné à Job par Dieu ?
  choice: ce qui m’est assigné
  alternative: mon décret, mon statut ou la part qui m’est assignée
  rationale: Le contexte porte sur ce que Dieu a déterminé pour Job. La formulation choisie exprime cette détermination sans imposer un sens juridique trop technique ni préciser davantage la nature de ce qui est fixé.
translation_notes:
  register: Français international moderne, naturel et digne. « Auprès de lui » conserve l’image relationnelle et l’ambiguïté de l’hébreu, tandis que « bien d’autres choses semblables » évite une tournure trop littérale.
