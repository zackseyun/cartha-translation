  variant: modern international French
source:
  edition: WLC
  text: שָׁ֗ם יָ֭שָׁר נוֹכָ֣ח עִמּ֑/וֹ וַ/אֲפַלְּטָ֥ה לָ֝/נֶ֗צַח מִ/שֹּׁפְטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/007.yaml
  text: There an upright man could reason with him[b][a], and I would be delivered forever from my judge.
translation:
  language: fr
  text: Là, un homme intègre pourrait plaider sa cause auprès de lui[a], et je serais délivré pour toujours de mon juge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pourrait discuter avec lui » ou « pourrait plaider avec lui ».
    reason: lexical_alternative
  - marker: b
    text: Ou « et j’échapperais pour toujours à mon juge » ; l’hébreu peut aussi se comprendre comme « à celui qui me juge ».
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Là
  rationale: Adverbe de lieu renvoyant à l’endroit où Job imagine rencontrer Dieu; « Là » est direct et naturel.
- source_word: יָשָׁר
  choice: un homme droit
  rationale: L’adjectif exprime ici la droiture morale ou l’intégrité. L’ajout de « homme », implicite en hébreu, permet une formulation française naturelle.
- source_word: נוֹכָח
  choice: pourrait défendre sa cause
  rationale: Dans ce contexte judiciaire, le terme évoque le fait d’argumenter ou de présenter sa cause. Cette formulation conserve la portée juridique sans réduire le sens à une simple conversation.
- source_word: עִמּוֹ
  choice: devant lui
  rationale: Littéralement « avec lui »; en contexte judiciaire, « devant lui » est idiomatique en français et laisse le pronom renvoyer à Dieu sans explicitation supplémentaire.
- source_word: וַאֲפַלְּטָה
  choice: et je serais délivré
  rationale: Le verbe פלט exprime l’idée d’échapper ou d’être délivré. Le conditionnel convient à la situation envisagée par Job et n’impose pas le sens technique d’un acquittement.
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: Rend la durée permanente ou définitive exprimée par l’hébreu dans un français moderne et courant.
- source_word: מִשֹּׁפְטִי
  choice: de mon juge
  rationale: Traduction concise qui préserve l’image judiciaire ainsi que l’ambiguïté entre « mon juge » et « celui qui me juge ».
theological_decisions:
- issue: Référent et nuance juridique de « mon juge »
  choice: Conserver « mon juge » sans préciser davantage son identité ou son rôle.
  alternative: « celui qui me juge » ou « mon accusateur »
  rationale: Le contexte présente Dieu dans un cadre judiciaire, mais l’hébreu ne contraint pas à transformer le juge en accusateur ni à expliciter le référent. La formulation retenue maintient cette tension.
- issue: Nature de l’échange avec Dieu
  choice: « défendre sa cause devant lui »
  alternative: « discuter avec lui » ou « s’expliquer avec lui »
  rationale: L’imagerie du passage est judiciaire. « Défendre sa cause » exprime cette dimension tout en évitant d’affirmer que Job pourrait juridiquement contraindre Dieu ou se déclarer lui-même acquitté.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire judiciaire du contexte est conservé sans technicité excessive; les pronoms et les ambiguïtés du texte hébreu ne sont pas explicités de manière doctrinale.
