  yaml_path: translation/ot/job/039/026.yaml
  text: Is it by your understanding that the hawk soars[a], spreading its wings toward the south?
translation:
  language: fr
  text: Est-ce grâce à ton intelligence que l’épervier[a] prend son essor et déploie ses ailes vers le sud ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le faucon » ; le mot hébreu נֵץ peut désigner plus généralement un rapace de ce type.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִבִּינָתְךָ
  choice: Est-ce grâce à ton intelligence
  rationale: L’interrogatif הֲ et la préposition מִן présentent l’intelligence de Job comme le moyen supposé de l’action. « Grâce à » rend cette valeur instrumentale en français naturel, tandis qu’« intelligence » traduit directement בִּינָה.
- source_word: יַאֲבֶר
  choice: prend son essor
  rationale: Le hiphil de אבר décrit ici l’envol ou le mouvement ascendant de l’oiseau. « Prend son essor » conserve cette image sans imposer l’idée plus précise d’un vol plané continu.
- source_word: נֵץ
  choice: l’épervier
  rationale: נֵץ désigne un rapace de type épervier ou faucon, sans identification zoologique certaine. « Épervier » est un équivalent français courant et suffisamment large dans ce contexte.
- source_word: יִפְרֹשׂ
  choice: déploie
  rationale: פרשׂ signifie étendre ou déployer. La coordination française avec « et » rend naturellement l’action concomitante sans modifier son rapport au verbe principal.
- source_word: כְּנָפוֹ
  choice: ses ailes
  rationale: Le singulier hébreu peut avoir ici une valeur collective. Le pluriel « ailes » est l’expression idiomatique française pour un oiseau en vol.
- source_word: לְתֵימָן
  choice: vers le sud
  rationale: La préposition לְ marque la direction et תֵימָן désigne le sud. « Vers le sud » restitue simplement l’orientation du mouvement.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La question rhétorique reste directe; le tutoiement correspond à l’adresse de Dieu à Job. Le choix « prend son essor » préserve la nuance de mouvement ascendant sans surdéterminer le mode de vol.
