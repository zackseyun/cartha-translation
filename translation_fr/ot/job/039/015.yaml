  text: and she forgets that a foot may crush them[b][a], and a wild animal may trample them.
translation:
  language: fr
  text: Elle oublie qu’un pied peut les écraser[a] et qu’un animal sauvage[b] peut les piétiner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « peut l’écraser […] peut la piétiner ». Le suffixe féminin singulier renvoie vraisemblablement, dans un sens collectif, aux œufs ou aux petits laissés au sol.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un animal des champs », expression hébraïque désignant ici un animal sauvage vivant en pleine campagne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: Elle oublie
  rationale: Le wayyiqtol qal à la 3e personne du féminin singulier poursuit la description vive de l’autruche ; le présent convient au mouvement poétique du passage.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de l’oubli, plutôt qu’une proposition causale.
- source_word: רֶגֶל
  choice: un pied
  rationale: 'Le singulier a une valeur indéfinie : n’importe quel pied pourrait causer ce dommage. Cette formulation conserve aussi l’image concrète de l’hébreu.'
- source_word: תְּזוּרֶהָ
  choice: peut les écraser
  rationale: Dans ce contexte, le verbe évoque le dommage causé par un pied. « Écraser » exprime naturellement le danger couru par les œufs laissés au sol ; le suffixe féminin singulier est rendu collectivement par « les ».
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: et qu’un animal sauvage
  rationale: L’expression signifie littéralement « animal des champs ». « Animal sauvage » en transmet clairement le sens en français moderne.
- source_word: תְּדוּשֶׁהָ
  choice: peut les piétiner
  rationale: Le verbe דושׁ signifie fouler ou piétiner. « Piétiner » est naturel ici et forme un parallèle net avec « écraser » ; le suffixe est de nouveau compris collectivement.
