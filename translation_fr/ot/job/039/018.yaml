  text: When she lifts herself up on high[b][a], she laughs at the horse and its rider.
translation:
  language: fr
  text: Lorsqu’elle s’élève dans les hauteurs[a], elle se rit du cheval et de son cavalier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « lorsqu’elle déploie ses ailes en hauteur » ou « lorsqu’elle s’élance dans les airs ». Le verbe hébreu évoque probablement un mouvement ascendant, mais sa nuance exacte est discutée.'
    reason: lexical_alternative
  - marker: b
    text: « Se rit de » peut aussi se traduire par « se moque de » ou « méprise ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת
  choice: Quand
  rationale: La locution introduit ici le moment ou la circonstance de l’action; « Quand » est naturel et conserve cette valeur temporelle.
- source_word: בַּמָּרוֹם תַּמְרִיא
  choice: elle se dresse avec force
  rationale: Dans ce contexte, l’expression décrit probablement l’autruche qui s’élance ou se redresse vigoureusement. Cette formulation française évite d’affirmer qu’elle vole, tout en conservant l’idée d’élévation; le détail exact reste signalé en note.
- source_word: תִּשְׂחַק
  choice: elle se rit de
  rationale: Le verbe peut exprimer le rire, la moquerie ou le mépris. « Se rit de » garde l’image vive et sa nuance de défi dans un registre poétique digne.
- source_word: לַסּוּס
  choice: du cheval
  rationale: L’article hébreu présente le cheval comme un type générique; le singulier défini français convient à cette comparaison.
- source_word: וּלְרֹכְבוֹ
  choice: et de son cavalier
  rationale: Le suffixe renvoie naturellement au cheval. « Son cavalier » restitue clairement ce lien en français.
