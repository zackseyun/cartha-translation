  text: כְּנַף רְנָנִ֥ים נֶעֱלָ֑סָה אִם אֶ֝בְרָ֗ה חֲסִידָ֥ה וְ/נֹצָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/013.yaml
  text: The wings of the ostrich flap joyfully—are they the pinions and plumage of the stork?[a]
translation:
  language: fr
  text: Les ailes de l’autruche battent avec allégresse — sont-ce les rémiges et le plumage de la cigogne ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Les ailes de l’autruche battent fièrement, mais sont-elles les rémiges et le plumage de la cigogne ? » Le texte hébreu est difficile et a été compris de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַף
  choice: les ailes
  rationale: Le singulier hébreu a ici une valeur collective; le pluriel est plus naturel en français pour désigner les deux ailes de l’oiseau.
- source_word: רְנָנִים
  choice: de l’autruche
  rationale: Dans le contexte zoologique de Job 39, ce terme rare désigne l’autruche; le singulier générique convient au français courant.
- source_word: נֶעֱלָסָה
  choice: battent avec allégresse
  rationale: Le verbe associe une idée d’exultation à un mouvement vif; appliqué aux ailes, cette formulation rend à la fois le mouvement et la joie.
- source_word: אִם
  choice: sont-ce
  rationale: La particule introduit ici une comparaison interrogative elliptique. « Sont-ce » conserve la force rhétorique sans trancher excessivement la syntaxe difficile.
- source_word: אֶבְרָה
  choice: les rémiges
  rationale: Le mot désigne les grandes plumes servant au vol; « rémiges » est précis tout en restant intelligible dans ce contexte poétique.
- source_word: חֲסִידָה
  choice: de la cigogne
  rationale: Le contexte impose le nom de l’oiseau, et non le sens adjectival apparenté à la loyauté ou à la bonté.
- source_word: וְנֹצָה
  choice: et le plumage
  rationale: Le nom désigne les plumes ou le plumage; « plumage » forme un parallèle poétique naturel avec « rémiges ».
theological_decisions:
- issue: Rapport syntaxique entre les ailes de l’autruche et les plumes de la cigogne
  choice: 'Une question rhétorique établissant une comparaison: « sont-ce…? »'
  alternative: 'Une opposition: « mais est-ce là les rémiges et le plumage de la cigogne? »'
  rationale: L’hébreu est elliptique et difficile. Le texte principal garde l’interrogation et la comparaison sans préciser si celle-ci porte sur l’identité, la ressemblance ou la qualité du plumage; la note signale une autre articulation possible.
translation_notes:
  register: Français international moderne, poétique et digne. « Avec allégresse » conserve la coloration expressive du verbe; « rémiges » apporte la précision anatomique voulue, tandis que la note maintient l’incertitude réelle de l’hébreu.
