  text: Qui a laissé l’âne sauvage en liberté ? Qui a délié les liens de l’onagre ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui a délié les liens de l’âne sauvage ? » Le sens précis du mot hébreu עָרוֹד est incertain ; il désigne probablement un âne sauvage. « Onagre » est une traduction possible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Pronom interrogatif qui introduit chacune des deux questions rhétoriques posées par Dieu.
- source_word: שִׁלַּח
  choice: a laissé… aller
  rationale: Le piel accompli de שלח exprime ici la mise en liberté; avec חָפְשִׁי, « laisser aller libre » rend naturellement l’action et son résultat.
- source_word: פֶּרֶא
  choice: âne sauvage
  rationale: Désigne l’âne vivant à l’état sauvage; cette formulation est claire et courante en français moderne.
- source_word: חָפְשִׁי
  choice: libre
  rationale: Adjectif décrivant l’état de l’animal relâché; « aller libre » conserve sa fonction prédicative.
- source_word: וּמֹסְרוֹת
  choice: les liens
  rationale: Le pluriel désigne des entraves ou attaches; « liens » convient au verbe « délier » sans archaïsme.
- source_word: עָרוֹד
  choice: onagre
  rationale: Terme désignant lui aussi un âne sauvage. « Onagre » maintient la distinction lexicale du parallèle sans lui attribuer une nuance de vitesse que l’hébreu n’établit pas clairement.
- source_word: פִתֵּחַ
  choice: a délié
  rationale: Avec des liens pour complément, le piel signifie les desserrer ou les détacher; « délier » est précis et idiomatique.
