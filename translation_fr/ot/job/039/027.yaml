  text: אִם עַל פִּ֭י/ךָ יַגְבִּ֣יהַּ נָ֑שֶׁר וְ֝/כִ֗י יָרִ֥ים קִנּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/027.yaml
  text: Is it at your command that the eagle flies high and lifts up its nest?[a][b][c]
translation:
  language: fr
  text: Est-ce sur ton ordre[b] que l’aigle[c] s’élève[a] et place son nid en hauteur[d] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prend son essor » ou « monte très haut ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur ta bouche », expression qui signifie « sur ton ordre » ou « selon ta parole ».
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu peut désigner plus largement un grand rapace et, dans certains contextes, peut aussi s’appliquer à un vautour.
    reason: lexical_alternative
  - marker: d
    text: Littéralement « élève son nid » ; il s’agit vraisemblablement de l’établir dans un lieu élevé.
    reason: translation_clarity
lexical_decisions:
- source_word: אִם
  choice: Est-ce… que
  rationale: Dans cette série de questions rhétoriques, אִם introduit une interrogation plutôt qu’une condition.
- source_word: עַל־פִּיךָ
  choice: sur ton ordre
  rationale: Littéralement « sur ta bouche » ; l’expression désigne ce qui se fait selon la parole ou l’ordre de quelqu’un.
- source_word: יַגְבִּיהַּ
  choice: s’élève
  rationale: Le hifil de גבה exprime ici le mouvement vers les hauteurs ; « s’élève » convient naturellement au vol de l’oiseau sans ajouter une manière précise de voler.
- source_word: נָשֶׁר
  choice: aigle
  rationale: Traduction traditionnelle et adaptée à l’image d’un grand rapace nichant en hauteur, tout en signalant en note la portée zoologique possible du terme.
- source_word: וְכִי
  choice: et
  rationale: La combinaison coordonne le second prédicat à la même question rhétorique ; en français, « et » suffit sans alourdir la phrase.
- source_word: יָרִים קִנּוֹ
  choice: place son nid en hauteur
  rationale: Littéralement « élève son nid ». Dans ce contexte, l’expression évoque l’établissement du nid dans un lieu élevé plutôt que le transport physique d’un nid déjà construit.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement conserve l’adresse singulière de Dieu à Job. La formulation maintient la force de la question rhétorique et le parallélisme poétique.
