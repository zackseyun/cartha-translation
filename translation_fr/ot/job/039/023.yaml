  text: עָ֭לָי/ו תִּרְנֶ֣ה אַשְׁפָּ֑ה לַ֖הַב חֲנִ֣ית וְ/כִידֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/023.yaml
  text: Over him the quiver rattles[b][a], the flashing spear and javelin.
translation:
  language: fr
  text: Au-dessus de lui, le carquois résonne[a], l’éclair de la lance et du javelot[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « contre lui » ou « sur lui ». La préposition hébraïque peut exprimer une relation spatiale ou hostile, et le verbe évoque un bruit sonore du carquois.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « la flamme de la lance et du javelot ». L’expression poétique peut évoquer leur éclat brillant; « lame » est également une possibilité selon l’interprétation du terme hébreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: sur lui
  rationale: La préposition עַל avec suffixe masculin singulier situe le bruit des armes par rapport au cheval. « Sur lui » conserve l’image spatiale sans préciser indûment si elles sont au-dessus de lui ou dirigées contre lui.
- source_word: תִּרְנֶה
  choice: résonnent
  rationale: Le verbe poétique évoque ici le son vif des armes. Le pluriel français permet de comprendre la série entière comme produisant ce bruit, tout en gardant le carquois au premier plan.
- source_word: אַשְׁפָּה
  choice: le carquois
  rationale: Équivalent français courant du récipient qui contient les flèches.
- source_word: לַהַב
  choice: la lame étincelante
  rationale: לַהַב signifie littéralement « flamme » et peut désigner l’éclat ou la lame d’une arme. « Lame étincelante » restitue à la fois l’objet et son éclat poétique.
- source_word: חֲנִית
  choice: la lance
  rationale: Terme hébreu courant désignant une arme d’hast; « lance » est ici l’équivalent français naturel.
- source_word: כִידוֹן
  choice: le javelot
  rationale: « Javelot » maintient la distinction lexicale avec חֲנִית et évoque une arme plus légère pouvant être lancée.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. L’inversion légère et le verbe « résonnent » rendent la vigueur sonore du vers; « lame étincelante » conserve l’image de לַהַב sans la réduire à un simple adjectif.
