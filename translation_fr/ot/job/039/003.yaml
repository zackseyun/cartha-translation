  terminology: Les termes de parturition sont cohérents avec le contexte animal immédiat. « Douleurs d’enfantement » rend חֶבֶל dans son sens contextuel de douleurs/angoisses de la naissance. Les ancres de notes sont placées sur les éléments concernés; la note a fournit une alternative lexicale recevable, et la note b explique utilement l’image plus littérale du dernier verbe.
