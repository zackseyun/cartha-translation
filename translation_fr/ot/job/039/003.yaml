lexical_decisions:
- source_word: תִּכְרַעְנָה
  choice: elles s’accroupissent
  rationale: Le verbe כרע exprime ici l’abaissement physique des femelles au moment de mettre bas. « S’accroupissent » est naturel en français et précis dans ce contexte.
- source_word: יַלְדֵיהֶן
  choice: leurs petits
  rationale: Le terme désigne ce qui est mis au monde ; dans ce contexte animal, « leurs petits » est la formulation française la plus idiomatique.
- source_word: תְּפַלַּחְנָה
  choice: mettent bas
  rationale: Dans ce contexte de parturition animale, « mettent bas » rend clairement l’action exprimée et conserve la concision du vers hébreu.
- source_word: חֶבְלֵיהֶם
  choice: leurs douleurs d’enfantement
  rationale: חבל peut désigner les douleurs de l’accouchement. Le contexte exclut ici le sens possible de « cordes ».
- source_word: תְּשַׁלַּחְנָה
  choice: elles se libèrent de
  rationale: שלח signifie fondamentalement envoyer, laisser partir ou relâcher. La tournure pronominale française exprime naturellement la disparition des douleurs après la mise bas, sans durcir l’image en une action trop volontaire.
