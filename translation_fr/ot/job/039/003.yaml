  verdict: approve
  source_fidelity: 'Le texte rend fidèlement les trois mouvements parallèles de l’hébreu : l’abaissement des femelles, la mise bas de leurs petits, puis l’éloignement des douleurs de l’enfantement. « Elles s’accroupissent » correspond bien à תִּכְרַעְנָה dans ce contexte animal; « mettent bas leurs petits » rend naturellement l’expression de la naissance; et « se libèrent de leurs douleurs d’enfantement » exprime de façon idiomatique la valeur contextuelle de תְּשַׁלַּחְנָה חֶבְלֵיהֶם, sans introduire d’interprétation doctrinale.'
