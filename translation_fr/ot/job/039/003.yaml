  text: They crouch down[a], they bring forth their young[b]; they cast off their labor pains.
translation:
  language: fr
  text: Elles s’accroupissent[a] et mettent bas leurs petits ; elles se libèrent de leurs douleurs d’enfantement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elles s’agenouillent ».
    reason: lexical_alternative
