  text: סֶ֣לַע יִ֭שְׁכֹּן וְ/יִתְלֹנָ֑ן עַֽל שֶׁן סֶ֝֗לַע וּ/מְצוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/028.yaml
  text: He dwells on the cliff and spends the night there[c][b][a], on the tooth of the crag and the stronghold.
translation:
  language: fr
  text: Il habite sur le rocher et y passe la nuit, sur la dent du roc[a] et la forteresse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur la dent du roc », image hébraïque désignant une saillie ou une pointe rocheuse.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « le lieu fortifié » ou « la place forte » ; le mot hébreu peut désigner une forteresse ou un refuge inaccessible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סֶלַע
  choice: rocher
  rationale: Le terme désigne ici une hauteur rocheuse escarpée où l’aigle demeure. « Rocher » est naturel en français et conserve l’image concrète.
- source_word: יִשְׁכֹּן
  choice: habite
  rationale: Le verbe exprime le fait de demeurer ou de résider; « habite » est courant, digne et précis.
- source_word: וְיִתְלֹנָן
  choice: et y passe la nuit
  rationale: La forme verbale indique qu’il loge ou demeure pendant la nuit. Le pronom « y » reprend naturellement le lieu déjà mentionné.
- source_word: שֶׁן סֶלַע
  choice: la dent du roc
  rationale: La traduction conserve la métaphore hébraïque vive d’une dent, c’est-à-dire d’une saillie rocheuse aiguë.
- source_word: וּמְצוּדָה
  choice: sa forteresse
  rationale: מְצוּדָה désigne une forteresse ou un lieu fortifié. Dans ce contexte, le rocher sert métaphoriquement de refuge inaccessible; « sa » explicite en français l’apposition fonctionnelle sans modifier l’image.
