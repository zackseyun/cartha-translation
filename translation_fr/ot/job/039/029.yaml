  text: מִ/שָּׁ֥ם חָֽפַר אֹ֑כֶל לְ֝/מֵ/רָח֗וֹק עֵינָ֥י/ו יַבִּֽיטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/029.yaml
  text: From there he spies out food[a]; his eyes look from far away.
translation:
  language: fr
  text: De là, il recherche sa nourriture[a] ; ses yeux observent de loin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu signifie habituellement « creuser » ; ici, il peut évoquer le fait de rechercher ou de repérer sa nourriture.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: De là
  rationale: Rend simplement le point d’observation depuis lequel l’aigle cherche sa nourriture.
- source_word: חָפַר
  choice: recherche
  rationale: Le sens habituel est « creuser », mais, avec « nourriture » dans ce contexte, le verbe décrit la recherche attentive de ce que l’aigle mangera. « Recherche » conserve cette idée sans imposer l’image peu naturelle de creuser.
- source_word: אֹכֶל
  choice: sa nourriture
  rationale: Le nom signifie largement « nourriture ». Le possessif, naturel en français, explicite seulement le rapport contextuel à l’aigle sans réduire le terme à « proie ».
- source_word: לְמֵרָחוֹק
  choice: au loin
  rationale: Expression française naturelle indiquant la grande distance vers laquelle porte le regard.
- source_word: עֵינָיו
  choice: ses yeux
  rationale: Conserve l’image concrète et le pluriel du texte hébreu.
- source_word: יַבִּיטוּ
  choice: regardent
  rationale: Le verbe exprime un regard dirigé ou attentif. « Regardent » reste proche de l’hébreu et s’accorde naturellement avec « ses yeux ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et imagé. La formulation garde la structure en deux propositions et évite de préciser « proie », puisque l’hébreu emploie le terme général « nourriture ».
