source:
  edition: WLC
  text: הֲ/יָדַ֗עְתָּ עֵ֭ת לֶ֣דֶת יַעֲלֵי סָ֑לַע חֹלֵ֖ל אַיָּל֣וֹת תִּשְׁמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/001.yaml
  text: Do you know the time when the mountain goats give birth? Do you watch over the deer in labor?[a][b][c]
translation:
  language: fr
  text: Sais-tu quand les bouquetins[a] mettent bas ? Observes-tu les biches[b] en travail[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les chèvres du rocher » ; il s’agit de caprins sauvages des montagnes, souvent identifiés à des bouquetins.
    reason: lexical_alternative
  - marker: b
    text: Ou « les femelles des cerfs » ; le mot hébreu désigne des cervidés femelles.
    reason: lexical_alternative
  - marker: c
    text: Ou « Veilles-tu sur elles ? » Le verbe peut aussi signifier garder, surveiller ou veiller sur.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Sais-tu
  rationale: La particule interrogative avec le qal accompli de ידע forme ici une question rhétorique ; le présent français en restitue naturellement la portée.
- source_word: עֵת לֶדֶת
  choice: quand … mettent bas
  rationale: Littéralement « le temps de mettre bas » ; une proposition temporelle est plus naturelle en français et conserve le sens.
- source_word: יַעֲלֵי סָלַע
  choice: les bouquetins
  rationale: L’expression désigne littéralement les « chèvres du rocher », c’est-à-dire des caprins sauvages vivant en montagne, probablement des bouquetins.
- source_word: חֹלֵל
  choice: pendant leur travail
  rationale: Le terme évoque les douleurs et les mouvements de la mise bas ; « travail » exprime cet état sans réduire le verbe au seul acte d’enfanter.
- source_word: אַיָּלוֹת
  choice: les biches
  rationale: Le nom désigne ici des cervidés femelles ; « biches » est précis, courant et non archaïque.
- source_word: תִּשְׁמֹר
  choice: Observes-tu
  rationale: שׁמר peut signifier garder, surveiller ou observer. Dans cette question sur la connaissance du moment de la mise bas, « observer » évite d’impliquer nécessairement protection ou soin tout en conservant l’idée d’attention suivie.
theological_decisions:
- issue: Portée de תִּשְׁמֹר
  choice: Observes-tu
  alternative: Veilles-tu sur
  rationale: Le contexte met en relief la connaissance et l’attention divines, mais le verbe n’impose pas à lui seul l’idée de protection. La traduction choisie préserve cette ouverture sans ajouter une nuance providentielle explicite.
translation_notes:
  register: Français international moderne, naturel et digne. « Mettre bas » est l’expression française courante pour la parturition animale ; « pendant leur travail » conserve l’image des douleurs de la mise bas. Les notes maintiennent l’ambiguïté de שׁמר et la précision zoologique incertaine de יעלי סלע.
