  text: יְת֣וּר הָרִ֣ים מִרְעֵ֑/הוּ וְ/אַחַ֖ר כָּל יָר֣וֹק יִדְרֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/008.yaml
  text: He explores the mountains for his pasture[b][a], and he searches after every green thing.
translation:
  language: fr
  text: Il parcourt les montagnes, son pâturage[a] ; il cherche toute verdure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il explore les montagnes, son pâturage ».'
    reason: lexical_alternative
  - marker: b
    text: La « verdure » désigne ici toute végétation fraîche et verte.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְתוּר
  choice: il parcourt
  rationale: Le qal de תור évoque l’exploration ou le déplacement à travers un territoire. « Parcourt » exprime naturellement ici les déplacements libres de l’âne sauvage sans réduire le verbe à une simple recherche statique.
- source_word: הָרִים
  choice: les montagnes
  rationale: Le nom désigne directement les montagnes et porte l’article défini en hébreu.
- source_word: מִרְעֵהוּ
  choice: pour y trouver sa pâture
  rationale: מִרְעֶה désigne une pâture ou un lieu où paître, avec un suffixe masculin singulier. Cette formulation française rattache clairement la pâture aux montagnes tout en conservant le possessif.
- source_word: וְאַחַר
  choice: il recherche
  rationale: Avec דרשׁ, אַחַר marque ce que l’animal poursuit ou cherche. En français, le sens directionnel est naturellement intégré au verbe « rechercher ».
- source_word: כָּל
  choice: toute
  rationale: כָּל a ici une valeur globale ou distributive appliquée à la végétation disponible ; « toute » convient idiomatiquement au nom collectif « verdure ».
- source_word: יָרוֹק
  choice: verdure
  rationale: יָרוֹק désigne ici ce qui est vert, notamment la végétation fraîche. « Verdure » conserve ce sens large et reste plus naturel que « toute chose verte ».
- source_word: יִדְרֹשׁ
  choice: il recherche
  rationale: Le qal de דרשׁ signifie chercher avec attention. « Recherche » rend l’activité de l’animal en quête de nourriture.
