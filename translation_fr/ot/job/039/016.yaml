  text: הִקְשִׁ֣יחַ בָּנֶ֣י/הָ לְּ/לֹא לָ֑/הּ לְ/רִ֖יק יְגִיעָ֣/הּ בְּלִי פָֽחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/016.yaml
  text: She treats her young harshly[a], as if they were not hers; her labor is in vain, without fear.
translation:
  language: fr
  text: Elle traite durement ses petits[a], comme s’ils n’étaient pas à elle ; elle se donne de la peine en vain, sans crainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Elle endurcit ses petits, comme s’ils n’étaient pas à elle. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשִׁיחַ
  choice: traite durement
  rationale: Le hiphil de קשׁח exprime ici l’idée de rendre dur ou de se montrer dur. « Traite durement » est naturel en français tout en conservant la dureté du comportement décrit.
- source_word: בָּנֶיהָ
  choice: ses petits
  rationale: Littéralement « ses fils / ses enfants » ; dans le contexte animal, « ses petits » est l’équivalent français naturel.
- source_word: לְלֹא לָהּ
  choice: comme s’ils n’étaient pas à elle
  rationale: La tournure hébraïque signifie littéralement « comme n’étant pas à elle ». Cette formulation française rend clairement l’apparente absence de lien maternel.
- source_word: לְרִיק
  choice: en vain
  rationale: Expression française concise et usuelle pour une peine ou un effort qui n’aboutit à rien.
- source_word: יְגִיעָהּ
  choice: elle se donne de la peine
  rationale: Le nom désigne sa peine ou son labeur. La tournure verbale est idiomatique en français et évite l’ambiguïté possible de « son travail » dans ce contexte maternel.
- source_word: בְּלִי פָחַד
  choice: sans crainte
  rationale: Traduction directe qui préserve la formulation brève et l’ambiguïté de l’hébreu quant à la portée exacte de cette absence de crainte.
theological_decisions:
- issue: Portée de « sans crainte »
  choice: Conserver « sans crainte » sans explicitation
  alternative: « sans s’en inquiéter »
  rationale: L’hébreu ne précise pas explicitement l’objet de la crainte. Une paraphrase en termes d’inquiétude résoudrait une ambiguïté que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et la concision poétique sont maintenus ; la note conserve la formulation plus littérale et difficile du premier membre.
