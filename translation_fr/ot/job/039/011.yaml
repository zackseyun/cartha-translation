source:
  edition: WLC
  text: הֲֽ/תִבְטַח בּ֭/וֹ כִּי רַ֣ב כֹּח֑/וֹ וְ/תַעֲזֹ֖ב אֵלָ֣י/ו יְגִיעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/011.yaml
  text: Will you trust him because his strength is great[a], and leave your labor to him?
translation:
  language: fr
  text: Te fieras-tu à lui parce que sa force est grande, et lui laisseras-tu ton travail[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le fruit de ton travail ». Le terme hébreu peut désigner aussi bien le travail lui-même que ce qu’il produit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִבְטַח
  choice: Te fieras-tu
  rationale: Le qal inaccompli à la 2e personne masculine singulière, précédé de la particule interrogative, introduit une question rhétorique. « Se fier à » est naturel en français et exprime l’idée de compter avec confiance sur quelqu’un.
- source_word: בּוֹ
  choice: à lui
  rationale: La préposition ב avec suffixe masculin singulier renvoie au bœuf sauvage évoqué dans le contexte. En français, « se fier » se construit avec « à ».
- source_word: כִּי
  choice: parce que
  rationale: 'La conjonction introduit ici le motif éventuel de cette confiance : la grande force de l’animal.'
- source_word: רַב כֹּחוֹ
  choice: sa force est grande
  rationale: Cette formulation conserve la structure et le sens du syntagme hébreu, où רַב qualifie l’importance de la force de l’animal.
- source_word: וְתַעֲזֹב
  choice: et lui laisseras-tu
  rationale: Le verbe עזב signifie fondamentalement « laisser ». La répétition de la forme interrogative en français rend explicite la portée de la question sur le second membre sans transformer le verbe en « confier ».
- source_word: אֵלָיו
  choice: lui
  rationale: La préposition אֶל avec suffixe masculin singulier indique que le travail serait laissé à l’animal. Le pronom indirect « lui » est la tournure idiomatique requise en français.
- source_word: יְגִיעֶךָ
  choice: ton travail
  rationale: יְגִיעַ peut désigner le travail pénible ou le produit obtenu par ce travail. « Ton travail » convient au contexte agricole tout en restant clair et courant; l’autre sens possible est signalé en note.
theological_decisions: []
