  text: ו/אפרח/ו יְעַלְעוּ דָ֑ם וּ/בַ/אֲשֶׁ֥ר חֲ֝לָלִ֗ים שָׁ֣ם הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/039/030.yaml
  text: Its young ones suck up blood[a], and where the slain are[b], there it is.
translation:
  language: fr
  text: Ses petits se gorgent de sang[a] ; là où sont les tués[b], là il est.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lapent du sang ». Le verbe hébreu, très expressif, peut évoquer l’action de sucer, d’avaler avidement ou de laper.
    reason: lexical_alternative
  - marker: b
    text: Ou « les cadavres ». Littéralement « ceux qui ont été tués » ; le terme souligne une mort violente.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרֹחָיו
  choice: ses petits
  rationale: Le nom désigne les petits de l’oiseau évoqué dans le contexte. « Ses petits » est naturel en français et n’impose pas un stade précis de leur développement.
- source_word: יְעַלְעוּ
  choice: se gorgent de
  rationale: Le verbe décrit de façon saisissante l’action d’absorber avidement. « Se gorgent de sang » restitue cette vigueur tout en restant idiomatique en français.
- source_word: דָם
  choice: sang
  rationale: Sens lexical direct, sans raison contextuelle de l’atténuer.
- source_word: וּבַאֲשֶׁר
  choice: là où
  rationale: La construction relative introduit un lieu. « Là où » rend naturellement le tour hébreu et prépare la reprise « là ».
- source_word: חֲלָלִים
  choice: les victimes
  rationale: Le terme désigne des êtres abattus ou tués violemment. « Les victimes » convient à la poésie française, tandis que la note précise la valeur plus littérale.
- source_word: שָׁם הוּא
  choice: là il est
  rationale: Le pronom renvoie à l’oiseau du contexte. Le masculin convient au référent français « aigle » et conserve la reprise locative emphatique de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne, avec une tournure poétique concise. Le parallélisme locatif de l’hébreu est conservé par « là où… là… », et l’image sanglante n’est pas atténuée.
