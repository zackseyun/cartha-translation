source:
  edition: WLC
  text: הֲ/יֹ֣אבֶה רֵּ֣ים עָבְדֶ֑/ךָ אִם יָ֝לִ֗ין עַל אֲבוּסֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/009.yaml
  text: Will the wild ox be willing to serve you? Will he spend the night at your feeding trough?[a][b]
translation:
  language: fr
  text: Le bœuf sauvage[b] acceptera-t-il de te servir ? Passera-t-il la nuit près de ta mangeoire[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « auge ». Le terme hébreu désigne l’endroit où mangent les animaux.
    reason: lexical_alternative
  - marker: b
    text: Ou « taureau sauvage » ou « aurochs » ; l’animal précis désigné par le terme hébreu est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֹאבֶה
  choice: acceptera-t-il
  rationale: Le verbe אבה exprime ici le consentement ou la volonté, et non la simple capacité. « Acceptera-t-il » rend naturellement cette nuance dans une question rhétorique.
- source_word: רֵּים
  choice: bœuf sauvage
  rationale: L’identification zoologique exacte de ראים demeure incertaine. « Bœuf sauvage » est clair, traditionnel sans être archaïque, et évite une précision injustifiée.
- source_word: עָבְדֶךָ
  choice: de te servir
  rationale: Le verbe עבד désigne ici le service ou le travail fourni à un maître humain; « te servir » conserve avec concision le contraste entre animal domestique et animal indomptable.
- source_word: אִם
  choice: Passera-t-il
  rationale: Dans le parallélisme poétique, אִם introduit une seconde interrogation rhétorique. Répéter la forme interrogative est plus naturel en français que traduire mécaniquement par « ou si ».
- source_word: יָלִין
  choice: passera-t-il la nuit
  rationale: לין signifie loger ou demeurer pendant la nuit. Cette formulation courante restitue précisément l’image.
- source_word: עַל
  choice: près de
  rationale: Avec une mangeoire, עַל indique ici la proximité ou la position auprès du lieu où l’animal se nourrit; « près de » est idiomatique et évite l’étrange « sur ta mangeoire ».
- source_word: אֲבוּסֶךָ
  choice: ta mangeoire
  rationale: אֲבוּס désigne une mangeoire ou un lieu où mangent les animaux. « Mangeoire » est concret, actuel et naturel en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Les deux questions rhétoriques et le parallélisme hébreu sont conservés; le tutoiement correspond à l’adresse directe à Job.
