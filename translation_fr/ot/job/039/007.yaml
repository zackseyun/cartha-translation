  text: יִ֭שְׂחַק לַ/הֲמ֣וֹן קִרְיָ֑ה תְּשֻׁא֥וֹת נ֝וֹגֵ֗שׂ לֹ֣א יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/007.yaml
  text: He laughs at the tumult of the city[b][a]; he does not hear the shouts of the driver.
translation:
  language: fr
  text: Il se rit du tumulte de la ville[a] ; il n’entend pas les cris du conducteur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du bruit de la ville ».
    reason: lexical_alternative
  - marker: b
    text: Ou « du contremaître », « du surveillant » ou « de celui qui exige le travail ». Le terme hébreu peut désigner plus largement quelqu’un qui pousse, contraint ou exige du travail.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: il se rit de
  rationale: Le qal inaccompli de שׂחק exprime ici la réaction dédaigneuse de l’âne sauvage. « Se rire de » conserve l’image du rire tout en rendant naturellement en français l’idée d’indifférence moqueuse.
- source_word: לַהֲמוֹן
  choice: du tumulte de
  rationale: הָמוֹן peut désigner le bruit, le grondement ou l’agitation d’une foule. « Tumulte » restitue à la fois le vacarme et l’agitation de la vie urbaine.
- source_word: קִרְיָה
  choice: la ville
  rationale: קִרְיָה désigne une ville ou une cité. L’article défini convient à l’emploi générique opposant la ville à l’espace sauvage.
- source_word: תְּשֻׁאוֹת
  choice: les cris
  rationale: Le pluriel désigne des clameurs ou des cris. « Les cris » est naturel et conserve la valeur concrète du pluriel.
- source_word: נֹגֵשׂ
  choice: celui qui le mène
  rationale: נֹגֵשׂ désigne celui qui presse, contraint, exige ou mène. Dans le contexte animal, cette formulation évoque celui qui conduit ou pousse la bête sans imposer trop étroitement le sens administratif de « contremaître ».
- source_word: לֹא יִשְׁמָע
  choice: il n’entend pas
  rationale: La traduction directe préserve le verbe hébreu « entendre » et laisse au contexte l’idée qu’aucun conducteur ne se fait entendre de l’animal libre.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Il se rit de » garde la force imagée de l’hébreu ; « celui qui le mène » convient au contexte de l’animal tout en laissant en note la gamme plus large du terme נֹגֵשׂ.
