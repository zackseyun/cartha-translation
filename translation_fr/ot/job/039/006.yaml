  text: to whom I have given the desert for his house[a], and the salt land for his dwelling place[c][b],
translation:
  language: fr
  text: à qui j’ai donné le désert[a] pour demeure, et la terre salée[b] pour ses demeures[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la région sauvage » ou « la steppe » pour עֲרָבָה.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’étendue de sel » ou « la terre stérile et salée » pour מְלֵחָה.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu porte « ses demeures », au pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: à qui
  rationale: Le relatif renvoie à l’âne sauvage du verset précédent. « À qui » exprime naturellement en français le bénéficiaire de l’habitat donné.
- source_word: שַׂמְתִּי
  choice: j’ai donné
  rationale: Le verbe signifie fondamentalement « mettre, placer, établir » ; avec les termes désignant l’habitat, « donner » restitue clairement l’idée que Dieu lui assigne ce milieu.
- source_word: עֲרָבָה
  choice: le désert
  rationale: Le mot désigne une région aride, désertique ou steppique. « Le désert » est clair, courant et convient à l’image poétique sans transformer le terme en nom géographique.
- source_word: בֵיתוֹ
  choice: pour demeure
  rationale: Littéralement « sa maison ». « Pour demeure » conserve l’image d’un habitat assigné tout en évitant en français l’expression moins naturelle « pour maison ».
- source_word: וּמִשְׁכְּנוֹתָיו
  choice: et pour lieux d’habitation
  rationale: Le pluriel hébreu est conservé, puisqu’il peut évoquer les différents endroits où l’animal séjourne. La construction parallèle supplée naturellement « pour ».
- source_word: מְלֵחָה
  choice: la terre salée
  rationale: Le terme désigne un terrain imprégné de sel, aride et stérile. « Terre salée » préserve l’image sans la restreindre nécessairement à une étendue plane.
