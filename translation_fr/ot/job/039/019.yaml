  yaml_path: translation/ot/job/039/019.yaml
  text: Do you give the horse its strength? Do you clothe its neck with a mane?[a]
translation:
  language: fr
  text: Est-ce toi qui donnes sa force au cheval ? Est-ce toi qui revêts son cou d’une crinière[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une ancienne tradition d’interprétation : « de tonnerre ». Ici, le mot est traduit par « crinière », car l’image immédiate est celle de la crinière qui couvre le cou du cheval.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִתֵּן
  choice: Est-ce toi qui donnes
  rationale: La particule interrogative suivie de l’imparfait de נתן introduit une question rhétorique adressée à Job. Cette formulation française fait ressortir naturellement le contraste implicite entre Job et Dieu.
- source_word: לַסּוּס
  choice: au cheval
  rationale: L’article hébreu est conservé ; « le cheval » a ici une valeur générique en français.
- source_word: גְּבוּרָה
  choice: sa force
  rationale: גְּבוּרָה désigne la force, la puissance ou la vaillance. « Sa force » exprime clairement ici la vigueur physique dont le cheval est doté.
- source_word: הֲתַלְבִּישׁ
  choice: Est-ce toi qui revêts
  rationale: Le hifil de לבש signifie « vêtir, revêtir ». « Revêts » préserve l’image poétique d’un cou habillé ou paré.
- source_word: צַוָּארוֹ
  choice: son cou
  rationale: Le suffixe masculin singulier renvoie au cheval. En français, le genre grammatical de « cheval » appelle naturellement « son ».
- source_word: רַעְמָה
  choice: une crinière
  rationale: Dans cette description du cou du cheval, « crinière » est le sens contextuel le plus probable. Une ancienne tradition comprend toutefois le terme comme « tonnerre », possibilité signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « Est-ce toi qui » conserve la force des deux questions rhétoriques hébraïques, tandis que « revêts » maintient leur image poétique.
