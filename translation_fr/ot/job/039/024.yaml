  yaml_path: translation/ot/job/039/024.yaml
  text: With fierceness and rage he devours the ground[b][a], and he cannot stand still at the sound of the trumpet.
translation:
  language: fr
  text: Avec fracas et fureur, il dévore le sol[a] ; il ne peut rester en place au son de la trompette[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il avale le sol », image saisissante de la vitesse et de l’ardeur du cheval lancé en avant.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « il ne se retient pas au son de la trompette ». Le verbe est souvent rendu plus littéralement par « croire », mais il semble avoir ici un sens idiomatique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַעַשׁ וְרֹגֶז
  choice: Avec fracas et fureur
  rationale: Les deux noms expriment ensemble l’agitation violente et l’ardeur du cheval. « Fracas » conserve la dimension de tumulte ou d’ébranlement de רַעַשׁ, tandis que « fureur » rend l’intensité de רֹגֶז dans ce contexte guerrier.
- source_word: יְגַמֶּא אָרֶץ
  choice: il dévore le sol
  rationale: Le verbe גמא signifie littéralement « avaler ». Associé au sol, il forme une image vive de la vitesse avec laquelle le cheval parcourt le terrain. « Dévore le sol » conserve cette métaphore en français naturel.
- source_word: וְלֹא יַאֲמִין
  choice: il ne peut rester en place
  rationale: Bien que le hifil de אמן signifie couramment « croire », le contexte du cheval de guerre favorise ici le sens idiomatique de ne pas demeurer ferme ou de ne pas pouvoir se contenir. La traduction retient ce sens sans effacer l’ambiguïté lexicale, signalée en note.
- source_word: כִּי קוֹל שׁוֹפָר
  choice: au son de la trompette
  rationale: Dans ce contexte militaire, שׁוֹפָר désigne l’instrument donnant le signal. La tournure française exprime naturellement la circonstance déclenchant la réaction du cheval.
