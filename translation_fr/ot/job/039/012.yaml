  text: הֲ/תַאֲמִ֣ין בּ֭/וֹ כִּי ישוב זַרְעֶ֑/ךָ וְֽ/גָרְנְ/ךָ֥ יֶאֱסֹֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/012.yaml
  text: Will you trust him that he will bring back your seed and gather it to your threshing floor?[a]
translation:
  language: fr
  text: Peux-tu compter sur lui pour ramener ta semence et la recueillir sur ton aire de battage ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ta semence » ; dans ce contexte, il s’agit probablement des céréales récoltées ou des produits de la récolte ramenés du champ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַאֲמִין בּוֹ
  choice: Peux-tu lui faire confiance
  rationale: Le hiphil de אמן avec ב exprime ici le fait de se fier au bœuf sauvage. La question porte sur la possibilité pratique de compter sur lui.
- source_word: כִּי
  choice: pour que
  rationale: La conjonction introduit ce que l’on attendrait de l’animal si on lui faisait confiance. En français, « pour que » rend naturellement ce rapport dans la construction choisie, sans changer le contenu de la question.
- source_word: יָשׁוּב
  choice: il ramène
  rationale: 'Avec זַרְעֶךָ comme complément, שוב prend ici un sens transitif ou causatif en contexte : faire revenir, ramener du champ.'
- source_word: זַרְעֶךָ
  choice: ta semence
  rationale: Le choix conserve le sens lexical de זֶרַע et son ambiguïté, tout en laissant la note préciser son emploi agricole probablement métonymique.
- source_word: גָרְנְךָ
  choice: ton aire de battage
  rationale: גֹּרֶן désigne précisément l’aire où l’on bat et vanne les céréales, non une grange ni un grenier.
- source_word: יֶאֱסֹף
  choice: la rassemble sur
  rationale: אסף signifie rassembler ou recueillir. Le pronom féminin renvoie à « semence », et « sur » convient à l’aire de battage comme surface de destination.
