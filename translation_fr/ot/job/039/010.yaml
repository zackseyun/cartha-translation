  text: הֲֽ/תִקְשָׁר רֵ֭ים בְּ/תֶ֣לֶם עֲבֹת֑/וֹ אִם יְשַׂדֵּ֖ד עֲמָקִ֣ים אַחֲרֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/010.yaml
  text: Will you bind the wild ox in the furrow with its rope[b][a], or will it harrow the valleys behind you?
translation:
  language: fr
  text: Attacheras-tu le bœuf sauvage[a] au sillon avec sa corde ? Hersera-t-il les vallées derrière toi[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’aurochs » ou « le taureau sauvage ». Le mot hébreu רֵים désigne un puissant bovin sauvage, et non la « licorne » mythique de certaines traductions anciennes.
    reason: lexical_alternative
  - marker: b
    text: Ou « labourera-t-il les vallées derrière toi ? » Le verbe hébreu paraît désigner plus précisément un travail du sol tel que le hersage ou le nivellement.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִקְשָׁר
  choice: Attacheras-tu
  rationale: Le verbe קשׁר signifie « attacher, lier ». « Attacher » est naturel en français et convient à la tentative de maîtriser l’animal pour le travail agricole.
- source_word: רֵים
  choice: le bœuf sauvage
  rationale: רֵים désigne un puissant bovin sauvage. « Bœuf sauvage » est clair pour le lecteur moderne tout en évitant l’ancien rendu erroné « licorne ».
- source_word: בְּתֶלֶם
  choice: au sillon
  rationale: תלם désigne un sillon labouré. La préposition ב peut ici exprimer la position ou l’affectation au sillon; « au sillon » donne une formulation française naturelle.
- source_word: עֲבֹתוֹ
  choice: avec sa corde
  rationale: עבות désigne une corde ou un cordage servant à attacher. Le suffixe masculin singulier renvoie au bœuf sauvage.
- source_word: אִם
  choice: — seconde question parallèle
  rationale: Dans cette interrogation rhétorique, אִם introduit l’autre possibilité. En français, deux questions juxtaposées rendent naturellement ce parallélisme sans imposer une valeur conditionnelle.
- source_word: יְשַׂדֵּד
  choice: Passera-t-il la herse
  rationale: Dans ce contexte agricole, שׂדד évoque le travail ou le nivellement du sol, probablement au moyen d’une herse. Cette tournure française est plus courante que le verbe technique « herser ».
- source_word: עֲמָקִים
  choice: dans les vallées
  rationale: Le sens lexical ordinaire est « vallées » ou « lieux bas ». Le rendu conserve l’image topographique sans la réduire à des champs ou à des sillons.
- source_word: אַחֲרֶיךָ
  choice: derrière toi
  rationale: L’expression décrit l’animal avançant derrière celui qui dirige le travail; « derrière toi » est direct et imagé.
