  text: תִּסְפֹּ֣ר יְרָחִ֣ים תְּמַלֶּ֑אנָה וְ֝/יָדַ֗עְתָּ עֵ֣ת לִדְתָּֽ/נָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/002.yaml
  text: Do you count the months they fulfill[a], and do you know the time when they give birth?
translation:
  language: fr
  text: Comptes-tu les mois jusqu’à leur terme[a] et connais-tu le moment où elles mettent bas ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les mois qu’elles remplissent ». L’hébreu emploie une forme active pour évoquer l’achèvement de la gestation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּסְפֹּר
  choice: Comptes-tu
  rationale: Le qal inaccompli à la 2e personne masculine singulière s’inscrit dans une question rhétorique. Le présent interrogatif français convient au discours divin.
- source_word: יְרָחִים
  choice: les mois
  rationale: Le nom désigne simplement les mois de gestation ; « mois lunaires » serait inutilement explicite.
- source_word: תְּמַלֶּאנָה
  choice: jusqu’à leur terme
  rationale: Le piel inaccompli féminin pluriel de מלא présente littéralement les femelles comme menant les mois à leur pleine mesure. La tournure choisie exprime naturellement en français l’achèvement de la gestation, tandis que la note conserve la forme active de l’hébreu.
- source_word: וְיָדַעְתָּ
  choice: et connais-tu
  rationale: Le qal accompli à la 2e personne masculine singulière, coordonné à la première question, est rendu au présent pour préserver l’enchaînement rhétorique naturel en français.
- source_word: עֵת
  choice: le moment
  rationale: עֵת désigne ici le temps précis de la mise bas. « Le moment » est naturel et n’ajoute pas explicitement l’idée d’un temps fixé.
- source_word: לִדְתָּנָה
  choice: où elles mettent bas
  rationale: L’infinitif construit de ילד avec suffixe féminin pluriel renvoie à l’enfantement des femelles. « Mettre bas » est l’expression française précise et courante pour les animaux.
