  text: כִּֽי תַעֲזֹ֣ב לָ/אָ֣רֶץ בֵּצֶ֑י/הָ וְֽ/עַל עָפָ֥ר תְּחַמֵּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/014.yaml
  text: For she leaves her eggs to the earth and warms them on the dust,[a]
translation:
  language: fr
  text: Car elle laisse ses œufs à terre et les tient au chaud sur la poussière.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « abandonne ses œufs à la terre ». Le verbe hébreu peut avoir un sens plus fort que « laisse », mais la suite évoque surtout des œufs exposés sur le sol plutôt qu’un abandon absolu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la description précédente de l’autruche et conserve la valeur causale du terme hébreu.
- source_word: תַעֲזֹב
  choice: laisse
  rationale: Le verbe peut signifier « laisser » ou, plus fortement, « abandonner ». « Laisse » convient naturellement au contexte sans imposer l’idée d’un délaissement absolu.
- source_word: לָאָרֶץ
  choice: à terre
  rationale: Rend de façon idiomatique le sens concret de « à la terre/au sol » et forme un parallèle naturel avec « sur la poussière ».
- source_word: בֵּצֶיהָ
  choice: ses œufs
  rationale: Rend directement le nom pluriel muni du suffixe féminin singulier, qui renvoie à l’autruche femelle.
- source_word: וְעַל עָפָר
  choice: sur la poussière
  rationale: Conserve l’image poétique et concrète de la poussière, sans la remplacer par un terme plus prosaïque comme « terre battue ».
- source_word: תְּחַמֵּם
  choice: les tient au chaud
  rationale: Exprime naturellement en français l’action de rendre ou maintenir chauds les œufs. Le pronom objet, implicite en hébreu, renvoie clairement aux œufs.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme concret entre « à terre » et « sur la poussière » est préservé, ainsi que l’ambiguïté du verbe עזב au moyen d’une note.
