base_translation:
  language: en
  yaml_path: translation/ot/job/039/025.yaml
  text: At the blast of the trumpet he says[a], ‘Aha!’ From far away he smells the battle[c][b], the thunder of commanders and the war cry.
translation:
  language: fr
  text: 'Au son de la trompette[a], il s’écrie : « Ah ! »[b]. De loin, il flaire la bataille, le tonnerre des chefs et le cri de guerre[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dès que sonne la trompette » ; l’expression hébraïque indique le moment où la trompette retentit.'
    reason: lexical_alternative
  - marker: b
    text: L’interjection exprime l’ardeur et l’excitation du cheval, prêt à se lancer dans la bataille.
    reason: cultural_note
  - marker: c
    text: 'Ou : « le grondement des chefs et la clameur ». Le mot rendu par « tonnerre » est employé comme image d’un bruit puissant, et celui rendu par « cri de guerre » peut désigner une clameur ou une sonnerie de signal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֵי שֹׁפָר
  choice: Au son de la trompette
  rationale: L’expression marque le moment où retentit l’instrument. Cette formulation française est naturelle et conserve la valeur temporelle sans préciser indûment qu’il s’agit matériellement d’une corne de bélier.
- source_word: יֹאמַר
  choice: il s’écrie
  rationale: Le verbe signifie ordinairement « dire », mais l’interjection qui suit appelle en français un verbe d’énonciation plus expressif. « Il s’écrie » rend la personnification vive du cheval sans lui attribuer un discours développé.
- source_word: הֶאָח
  choice: Ah !
  rationale: Cette interjection exprime ici l’excitation empressée du cheval à l’approche du combat. « Ah ! » est idiomatique en français et évite la nuance fréquente de découverte ou de triomphe attachée à « Aha ! ».
- source_word: וּמֵרָחוֹק
  choice: De loin
  rationale: Rendu concis et poétique de l’indication de distance.
- source_word: יָרִיחַ
  choice: il flaire
  rationale: Le verbe évoque concrètement la perception par l’odorat. « Flairer » convient naturellement à un cheval et maintient l’image vive du texte.
- source_word: מִלְחָמָה
  choice: la bataille
  rationale: Dans cette scène militaire immédiate, « bataille » convient mieux que le terme plus général « guerre ».
- source_word: רַעַם
  choice: le tonnerre
  rationale: Le sens littéral est « tonnerre »; le mot est employé métaphoriquement pour le bruit puissant du champ de bataille. Conserver la métaphore respecte la poésie hébraïque.
- source_word: שָׂרִים
  choice: des chefs
  rationale: Dans le contexte militaire, le mot désigne les dirigeants des troupes. « Chefs » reste naturel et suffisamment large, sans imposer un grade militaire moderne.
- source_word: וּתְרוּעָה
  choice: et le cri de guerre
  rationale: Le terme peut désigner une clameur ou une sonnerie de signal. Ici, après le bruit des chefs, « cri de guerre » exprime naturellement le sens militaire probable tout en signalant l’alternative en note.
