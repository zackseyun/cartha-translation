translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. La personnification du cheval et les images sensorielles et sonores de l’hébreu sont conservées. Les ambiguïtés de תְּרוּעָה et les nuances de רַעַם sont signalées sans alourdir le verset.
