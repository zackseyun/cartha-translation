  text: יַחְפְּר֣וּ בָ֭/עֵמֶק וְ/יָשִׂ֣ישׂ בְּ/כֹ֑חַ יֵ֝צֵ֗א לִ/קְרַאת נָֽשֶׁק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/021.yaml
  text: It paws in the valley and rejoices in its strength[b][a]; it goes out to meet the weapons.
translation:
  language: fr
  text: Il gratte le sol dans la vallée[a] et se réjouit de sa force ; il sort à la rencontre des armes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « creuse dans la vallée » ou « creuse le sol dans la vallée ». Le verbe hébreu signifie littéralement « creuser » et décrit ici l’action du cheval qui gratte le sol de ses sabots.
    reason: lexical_alternative
  - marker: b
    text: Ou « au-devant du combat ». Le nom hébreu peut désigner les armes ou l’armement et, par extension, le combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפְּרוּ
  choice: frappe du sabot
  rationale: Le verbe חפר signifie littéralement « creuser ». Appliqué au cheval, il évoque le sol qu’il creuse ou frappe du sabot ; cette formulation rend naturellement le geste en français sans perdre l’image concrète.
- source_word: בָעֵמֶק
  choice: dans la vallée
  rationale: עֵמֶק désigne couramment une vallée ou une basse plaine. « Dans la vallée » suit directement la formulation hébraïque.
- source_word: וְיָשִׂישׂ
  choice: et se réjouit
  rationale: שׂושׂ exprime la joie ou l’exultation. « Se réjouit » est actuel, clair et suffisamment soutenu.
- source_word: בְּכֹחַ
  choice: de sa force
  rationale: La préposition ב peut ici marquer ce qui cause ou nourrit sa joie. « Se réjouit de sa force » est naturel en français tout en conservant la relation volontairement assez ouverte de l’hébreu.
- source_word: יֵצֵא
  choice: il s’élance
  rationale: יצא signifie fondamentalement « sortir ». Dans la scène du cheval de guerre allant au-devant des armes, « s’élance » exprime naturellement le mouvement, sans lui attribuer explicitement une attaque.
- source_word: לִקְרַאת
  choice: à la rencontre de
  rationale: לקראת indique un mouvement en direction de quelqu’un ou de quelque chose afin de le rencontrer. La locution française en conserve le sens.
- source_word: נָשֶׁק
  choice: des armes
  rationale: נשק désigne concrètement les armes ou l’armement, et peut par extension évoquer le combat. Le choix principal conserve ici l’image concrète.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, naturel et digne. Le rythme conserve les deux mouvements du verset : l’énergie du cheval dans la vallée, puis son élan vers l’affrontement. Les notes préservent le sens littéral de חפר et l’ambiguïté de נשק.'
