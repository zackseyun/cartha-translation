    rationale: La formulation est possible en contexte équestre, mais « gratte le sol » rend plus directement l’action figurée de חפר tout en restant naturelle.
  revised_text: Il gratte le sol dans la vallée[a] et se réjouit de sa force ; il sort à la rencontre des armes[b].
