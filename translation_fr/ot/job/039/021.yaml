  naturalness: « Il gratte le sol dans la vallée » est une formulation française naturelle pour l’image équestre. « Il sort à la rencontre des armes » est clair et conserve le mouvement vers l’affrontement, sans surtraduction.
  terminology: « Armes » rend adéquatement נָשֶׁק, qui peut désigner l’armement collectivement; la note conserve avec justesse l’extension possible au combat. « Se réjouit de sa force » est idiomatique et compatible avec la relation exprimée par בְּכֹחַ.
