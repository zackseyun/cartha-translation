  text: because God has deprived her of wisdom and has not given her a share in understanding[a][b].
translation:
  language: fr
  text: car Dieu l’a privée de sagesse et ne lui a pas accordé une part d’intelligence[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « car Dieu lui a fait oublier la sagesse » ou « car Dieu a fait en sorte que la sagesse lui manque ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne lui a pas attribué en matière d’intelligence » ; le verbe évoque l’attribution d’une part.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: car
  rationale: Introduit la cause du comportement décrit dans le contexte. « Car » conserve clairement le lien causal et convient au registre poétique.
- source_word: הִשָּׁהּ
  choice: l’a privée de
  rationale: Le hiphil de נשה avec suffixe féminin exprime ici que Dieu a fait en sorte que la sagesse lui manque. « L’a privée de » rend naturellement cette causalité, tout en signalant en note les autres analyses possibles.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Rend directement le titre divin singulier courant dans Job, sans amplification absente de l’hébreu.
- source_word: חָכְמָה
  choice: sagesse
  rationale: Correspond au sens premier du nom et désigne ici le bon jugement ou la capacité instinctive appropriée.
- source_word: וְלֹא
  choice: et ne… pas
  rationale: Conserve la coordination et la négation simples de l’hébreu.
- source_word: חָלַק לָהּ
  choice: ne lui a pas donné sa part de
  rationale: חלק évoque le partage ou l’attribution d’une portion. Cette formulation française préserve mieux cette nuance distributive qu’un simple « ne lui a pas donné ».
- source_word: בַּבִּינָה
  choice: intelligence
  rationale: Rend la capacité de comprendre et de discerner, tout en maintenant une distinction naturelle avec « sagesse ».
theological_decisions:
- issue: L’action de Dieu dans le manque de sagesse de l’autruche
  choice: 'Dieu demeure le sujet explicite : il l’a privée de sagesse et ne lui a pas attribué de part d’intelligence.'
  alternative: Atténuer l’action divine par une formulation comme « elle manque de sagesse ».
  rationale: L’hébreu nomme explicitement Dieu comme sujet. La traduction conserve cette attribution directe et la tension théologique du texte sans l’adoucir.
translation_notes:
  register: Français moderne, digne et poétique. Le féminin « l’/lui » reprend l’autruche du contexte. La structure parallèle et l’action divine explicite sont conservées.
