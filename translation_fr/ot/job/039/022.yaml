source:
  edition: WLC
  text: יִשְׂחַ֣ק לְ֭/פַחַד וְ/לֹ֣א יֵחָ֑ת וְ/לֹֽא יָ֝שׁ֗וּב מִ/פְּנֵי חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/022.yaml
  text: He laughs at fear and is not dismayed[b][a], and he does not turn back from the sword.
translation:
  language: fr
  text: Il rit de la peur[a] et n’est pas épouvanté ; il ne recule pas devant l’épée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il se moque de la peur ». Le verbe hébreu peut exprimer la dérision aussi bien que le rire.
    reason: lexical_alternative
  - marker: b
    text: Ou « il ne bat pas en retraite devant l’épée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: rit
  rationale: Le verbe שׂחק évoque directement le rire, tout en pouvant comporter ici une nuance de dérision. « Rit » conserve l’image vive de l’hébreu sans expliciter excessivement cette nuance.
- source_word: לְפַחַד
  choice: de la peur
  rationale: פחד désigne la peur, l’effroi ou la terreur. Après « rire », la tournure française naturelle est « rire de » ; « la peur » préserve la formulation concise sans renforcer indûment l’intensité.
- source_word: יֵחָת
  choice: n’est pas épouvanté
  rationale: Le niphal de חתת peut exprimer le fait d’être brisé, consterné ou terrifié. Dans cette scène de bataille, « n’est pas épouvanté » rend clairement le sens psychologique tout en gardant un registre digne.
- source_word: יָשׁוּב
  choice: ne recule pas
  rationale: שׁוב signifie revenir ou faire demi-tour. En contexte militaire, « ne recule pas » exprime naturellement le refus de se détourner ou de battre en retraite.
- source_word: מִפְּנֵי
  choice: devant
  rationale: מִפְּנֵי peut signifier « de devant », « devant » ou « à cause de ». Ici, « devant » rend idiomatiquement l’idée de ne pas reculer face à une menace.
- source_word: חָרֶב
  choice: l’épée
  rationale: Le singulier חרב représente ici l’arme et, par extension, le danger du combat. L’article défini conserve cette valeur générique en français.
