  text: יַחְלְמ֣וּ בְ֭נֵי/הֶם יִרְבּ֣וּ בַ/בָּ֑ר יָ֝צְא֗וּ וְ/לֹא שָׁ֥בוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/004.yaml
  text: Their young ones become strong[a]; they grow up in the open field; they go out and do not return to them.
translation:
  language: fr
  text: Leurs petits deviennent vigoureux et grandissent en pleine nature[a] ; ils s’en vont et ne reviennent pas auprès d’elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les espaces sauvages » ou « en rase campagne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְלְמוּ
  choice: deviennent vigoureux
  rationale: Dans ce contexte animalier, le verbe décrit des petits qui acquièrent force et robustesse. « Deviennent vigoureux » rend ce développement physique en français naturel.
- source_word: בְנֵיהֶם
  choice: leurs petits
  rationale: Le nom signifie littéralement « leurs fils/enfants », mais « leurs petits » est le terme idiomatique pour la progéniture animale sans préciser le sexe.
- source_word: יִרְבּוּ
  choice: grandissent
  rationale: Bien que le verbe puisse signifier « se multiplier » ou « devenir nombreux », le parallélisme et le contexte de la croissance des petits favorisent ici l’idée de développement.
- source_word: בַבָּר
  choice: en pleine nature
  rationale: Le terme désigne ici un espace ouvert et non cultivé, le milieu sauvage. « En pleine nature » est clair et actuel, tandis que la note conserve d’autres nuances possibles.
- source_word: יָצְאוּ
  choice: ils s’en vont
  rationale: Cette formulation exprime naturellement le départ des petits loin de leurs mères, sans préciser davantage la destination.
- source_word: וְלֹא שָׁבוּ לָמוֹ
  choice: et ne reviennent pas auprès d’elles
  rationale: La formulation traduit directement l’absence de retour vers les mères évoquées dans le contexte, sans renforcer artificiellement la négation par « jamais ».
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Leurs petits » convient au contexte animalier ; le féminin « elles » renvoie aux mères mentionnées dans les versets précédents. La structure poétique est conservée par deux propositions coordonnées séparées par un point-virgule.
