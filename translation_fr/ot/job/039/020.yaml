  text: Can you make him leap like the locust? The majesty of his snorting is terrifying[a].
translation:
  language: fr
  text: Est-ce toi qui le fais bondir comme la sauterelle ? Son renâclement majestueux est terrifiant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Est-ce toi qui le fais trembler comme la sauterelle ? » Le verbe hébreu peut évoquer le fait de secouer, de faire trembler ou de provoquer un mouvement violent ; certains comprennent aussi que l’image met l’accent sur le bruit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַרְעִישֶׁנּוּ
  choice: Est-ce toi qui le fais bondir
  rationale: Le hiphil de רעשׁ exprime le fait de faire trembler, s’agiter ou se mouvoir avec violence. Dans la description du cheval et avec la comparaison à la sauterelle, « faire bondir » rend naturellement le mouvement brusque et vigoureux, tout en conservant l’interrogation adressée à Job.
- source_word: כָּאַרְבֶּה
  choice: comme la sauterelle
  rationale: Le singulier peut avoir une valeur représentative ou collective. « La sauterelle » convient en français pour évoquer l’espèce et son mouvement bondissant.
- source_word: הוֹד
  choice: puissant
  rationale: הוֹד désigne la majesté, la splendeur ou la magnificence. Devant « renâclement », une traduction adjectivale par « puissant » restitue de façon idiomatique le caractère imposant du cheval, sans transformer le renâclement lui-même en qualité morale.
- source_word: נַחְרוֹ
  choice: son renâclement
  rationale: Le terme renvoie au souffle bruyant expulsé par les naseaux. « Renâclement » est précis dans le contexte du cheval et plus naturel ici que « hennissement ».
- source_word: אֵימָה
  choice: inspire la terreur
  rationale: Le nom signifie « terreur » ou « effroi ». La tournure prédicative « inspire la terreur » est idiomatique en français et conserve la force du groupe nominal hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. La formulation garde l’adresse interrogative de Dieu à Job. « Renâclement » préserve l’image équine précise, tandis que « puissant » rend הוֹד de manière naturelle dans cette construction.
