  yaml_path: translation/ot/job/027/018.yaml
  text: He builds his house like a moth[a], like a shelter that a watchman makes.
translation:
  language: fr
  text: Il bâtit sa maison comme celle d’une teigne, comme une cabane qu’un gardien construit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנָה
  choice: se bâtit
  rationale: Le qatal poétique décrit ici de façon générale l’action caractéristique du méchant. La tournure pronominale exprime naturellement en français qu’il bâtit cette maison pour lui-même.
- source_word: כָעָשׁ
  choice: aussi fragile que celle d’une teigne
  rationale: עָשׁ désigne ordinairement la teigne. L’ajout explicatif « aussi fragile » rend intelligible la comparaison elliptique sans en changer l’image; « celle » reprend « maison ».
- source_word: בֵּיתוֹ
  choice: une maison
  rationale: Le sens concret de בַּיִת convient au parallélisme avec l’abri temporaire. La possession est déjà rendue par « se bâtit ».
- source_word: וּכְסֻכָּה
  choice: comme l’abri
  rationale: סֻכָּה désigne une cabane ou un abri temporaire. « Abri » est courant, naturel et conserve l’idée d’une construction précaire.
- source_word: עָשָׂה
  choice: se fait
  rationale: Le présent exprime la valeur générale du qatal en poésie; la tournure idiomatique française indique que le gardien aménage cet abri pour son usage.
- source_word: נֹצֵר
  choice: un gardien
  rationale: Le participe désigne celui qui veille ou garde, vraisemblablement un gardien de champ ou de vigne construisant un abri provisoire.
