  text: תַּשִּׂיגֵ֣/הוּ כַ֭/מַּיִם בַּלָּה֑וֹת לַ֝֗יְלָה גְּנָבַ֥תּ/וּ סוּפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/020.yaml
  text: Terrors overtake him like waters[b][a]; in the night a storm steals him away.
translation:
  language: fr
  text: Les terreurs l’atteignent comme des eaux[a] ; dans la nuit, une tempête[b] l’emporte à la dérobée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme une inondation ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un tourbillon » ou « une violente tempête ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשִּׂיגֵהוּ
  choice: l’atteignent
  rationale: Le hiphil de נשׂג exprime ici l’idée de rejoindre ou rattraper quelqu’un. « L’atteignent » est naturel en français et conserve l’image de calamités qui finissent par saisir leur victime.
- source_word: כַמַּיִם
  choice: comme des eaux
  rationale: Le pluriel français reflète la forme hébraïque et maintient la comparaison poétique sans préciser qu’il s’agit nécessairement d’une inondation.
- source_word: בַּלָּהוֹת
  choice: les terreurs
  rationale: Le terme désigne des terreurs ou des événements effroyables. « Les terreurs » est concis, digne et adapté au contexte poétique.
- source_word: לַיְלָה
  choice: dans la nuit
  rationale: Le nom est employé adverbialement. « Dans la nuit » restitue naturellement l’indication temporelle et l’atmosphère du vers.
- source_word: גְּנָבַתּוּ
  choice: l’emporte à la dérobée
  rationale: Le verbe גנב signifie fondamentalement « voler, dérober ». Dans cette construction, la tempête emporte l’homme comme un voleur qui agit furtivement ; cette formulation préserve l’image sans suggérer qu’elle le « vole » au sens français courant.
- source_word: סוּפָה
  choice: une tempête
  rationale: סופה désigne une violente tempête et peut, selon le contexte, évoquer un tourbillon. « Tempête » reste précis, courant et moins restrictif que « tourbillon ».
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La formulation conserve le parallélisme, l’image des eaux qui submergent et celle de la tempête agissant comme un voleur.
