  text: יְהִ֣י כְ֭/רָשָׁע אֹ֣יְבִ֑/י וּ/מִתְקוֹמְמִ֥/י כְ/עַוָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/007.yaml
  text: May my enemy be like the wicked[a], and the one who rises against me like the unrighteous.
translation:
  language: fr
  text: 'Que mon ennemi soit comme le méchant,

    et celui qui se dresse contre moi comme l’injuste.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: Que … subisse le sort de
  rationale: Le jussif de היה exprime ici un souhait à valeur d’imprécation. En français, une traduction littérale par « soit comme » risquerait de suggérer une simple ressemblance morale; « subisse le sort de » rend naturellement l’idée que Job souhaite à ses adversaires le traitement réservé aux méchants, tout en signalant en note la lecture plus formelle.
- source_word: כְרָשָׁע
  choice: le sort du méchant
  rationale: La préposition כ marque une comparaison et רָשָׁע désigne une personne méchante ou coupable. Dans ce souhait imprécatoire, « le sort du méchant » explicite la portée probable de la comparaison sans définir en quoi consiste ce sort.
- source_word: אֹיְבִי
  choice: mon ennemi
  rationale: Le nom אֹיֵב avec suffixe de première personne signifie directement « mon ennemi ».
- source_word: וּמִתְקוֹמְמִי
  choice: et celui qui se dresse contre moi
  rationale: La forme participiale de קום conserve l’image verbale d’une personne qui se lève ou se dresse avec hostilité contre Job; cette formulation est plus proche de l’hébreu que le seul nom « adversaire ».
- source_word: כְעַוָּל
  choice: le sort de l’homme injuste
  rationale: עַוָּל désigne une personne caractérisée par l’injustice ou le mal. « Homme injuste » reste naturel et distingue légèrement ce terme de רָשָׁע, sans réduire son sens au seul domaine judiciaire.
theological_decisions:
- issue: Portée de la comparaison introduite par כְּ
  choice: Comprendre le souhait comme visant le sort réservé au méchant et à l’injuste.
  alternative: 'Traduire formellement : « Que mon ennemi soit comme le méchant, et celui qui se dresse contre moi comme l’homme injuste. »'
  rationale: Le contexte d’imprécation favorise une comparaison de destinée ou de traitement plutôt qu’une simple assimilation morale, puisque Job considère déjà ses opposants comme hostiles. L’hébreu demeure toutefois elliptique; la traduction littérale est donc conservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme des deux membres est conservé; la répétition de « le sort de » clarifie l’imprécation, tandis que la note préserve la formulation hébraïque plus elliptique.
