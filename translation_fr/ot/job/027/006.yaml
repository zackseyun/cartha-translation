  text: בְּ/צִדְקָתִ֣/י הֶ֭חֱזַקְתִּי וְ/לֹ֣א אַרְפֶּ֑/הָ לֹֽא יֶחֱרַ֥ף לְ֝בָבִ֗/י מִ/יָּמָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/006.yaml
  text: I hold fast to my righteousness and will not let it go[b][a]; my heart does not reproach me for any of my days.
translation:
  language: fr
  text: Je tiens fermement à ma justice[a] et je ne la lâcherai pas ; mon cœur ne me fera aucun reproche, aucun jour de ma vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon intégrité ». Le mot hébreu signifie habituellement « justice » ou « rectitude », mais, dans le livre de Job, il peut aussi évoquer l’intégrité personnelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « mon cœur ne me raillera pas durant tous mes jours ». L’expression hébraïque évoque un reproche, une raillerie ou une accusation intérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתִי
  choice: à ma justice
  rationale: צְדָקָה exprime normalement la justice ou la rectitude. Dans la protestation de Job, « intégrité » est possible, mais « justice » conserve mieux la portée morale et judiciaire du terme.
- source_word: הֶחֱזַקְתִּי
  choice: Je tiens fermement
  rationale: Le hiphil de חזק signifie ici saisir ou maintenir avec fermeté. Le présent français rend naturellement la résolution actuelle de Job tout en reflétant la valeur rhétorique de l'accompli hébreu.
- source_word: וְלֹא אַרְפֶּהָ
  choice: et je ne la lâcherai pas
  rationale: Le hiphil de רפה signifie relâcher, laisser tomber ou abandonner. Le pronom féminin renvoie à « ma justice » ; cette formulation est naturelle et conserve l'image de la prise ferme.
- source_word: לֹא יֶחֱרַף לְבָבִי
  choice: mon cœur ne me reproche
  rationale: חרף peut signifier outrager, railler ou faire des reproches. Avec le cœur comme sujet, l'expression évoque une accusation intérieure ; « cœur » est maintenu plutôt que remplacé par l'interprétation « conscience ».
- source_word: מִיָּמָי
  choice: aucun de mes jours
  rationale: Dans la portée de la négation, מן avec יָמִים indique qu'aucun moment de la vie passée n'est visé par un reproche intérieur. La tournure française reste concise tout en préservant l'étrangeté mesurée de l'expression hébraïque.
theological_decisions:
- issue: Faut-il rendre צִדְקָה par le sens moral fort « justice » ou par le sens contextuel « intégrité » ?
  choice: justice
  alternative: intégrité
  rationale: « Justice » préserve le sens lexical moral et judiciaire ainsi que la force de la revendication de Job. « Intégrité » demeure une possibilité contextuelle signalée en note, sans atténuer silencieusement sa déclaration.
- issue: Le cœur est-il à comprendre explicitement comme la conscience ?
  choice: conserver « mon cœur »
  alternative: « ma conscience »
  rationale: Le texte nomme le cœur. Garder cette image respecte l'anthropologie et l'ambiguïté de l'hébreu, tandis que « conscience » expliciterait une interprétation plausible mais plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme et l'image concrète du cœur sans recourir au terme interprétatif « conscience ». Les deux marqueurs de notes sont placés dans le texte principal immédiatement après les expressions concernées.
