  yaml_path: translation/ot/job/027/021.yaml
  text: The east wind carries him away[a], and he is gone; it sweeps him away from his place.
translation:
  language: fr
  text: Le vent d’est l’emporte, et il s’en va ; il le fait tournoyer hors de sa place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשָּׂאֵהוּ
  choice: l’emporte
  rationale: Le verbe נשׂא signifie « soulever, porter, emporter ». Avec le vent comme sujet, « l’emporte » exprime naturellement le déplacement forcé.
- source_word: קָדִים
  choice: le vent d’est
  rationale: קָדִים désigne couramment le vent d’est, souvent destructeur dans la poésie hébraïque.
- source_word: וְיֵלַךְ
  choice: et il disparaît
  rationale: הלך signifie littéralement « aller, partir ». Dans ce contexte, la tournure exprime le résultat de l’enlèvement ; « il disparaît » rend ce résultat en français courant sans préciser davantage son sort.
- source_word: וִישָׂעֲרֵהוּ
  choice: il le chasse en tourbillonnant
  rationale: La forme issue de סער évoque l’action violente d’une tempête ou d’un tourbillon. Cette formulation conserve l’image météorologique et le mouvement brutal tout en restant naturelle en français.
- source_word: מִמְּקֹמוֹ
  choice: loin de chez lui
  rationale: Littéralement « de son lieu ». Ici, « loin de chez lui » rend naturellement l’arrachement à l’endroit où il se trouvait, bien que « de sa place » soit plus formel.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme est conservé, ainsi que la violence du vent d’est et du mouvement de tempête.
