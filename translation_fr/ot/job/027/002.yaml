source:
  edition: WLC
  text: חַי אֵ֭ל הֵסִ֣יר מִשְׁפָּטִ֑/י וְ֝/שַׁדַּ֗י הֵמַ֥ר נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/002.yaml
  text: As God lives[a], who has taken away my justice, and the Almighty, who has made my soul bitter[b],
translation:
  language: fr
  text: 'Par la vie de Dieu, qui m’a privé de mon droit[a],

    par le Tout-Puissant, qui a rendu mon âme amère[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la justice qui m’est due » ou « de ma juste cause ». Le mot hébreu peut désigner la justice, un jugement ou un droit légitime.
    reason: lexical_alternative
  - marker: b
    text: Ou « a rendu ma vie amère », ou simplement « m’a rendu amer ». Le mot hébreu traduit par « âme » peut aussi désigner la vie ou la personne elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אֵל
  choice: Aussi vrai que Dieu est vivant
  rationale: Cette formule française naturelle conserve la valeur de serment de l’expression hébraïque חַי suivie d’un titre divin.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל est ici le titre divin courant employé dans la formule de serment.
- source_word: הֵסִיר
  choice: m’a privé de
  rationale: Le hiphil de סור signifie enlever ou écarter. Avec « mon droit », « priver de » exprime naturellement le retrait de ce qui revient à Job.
- source_word: מִשְׁפָּטִי
  choice: mon droit
  rationale: מִשְׁפָּט peut désigner la justice, le jugement ou un droit légitime. Dans la protestation judiciaire de Job, « mon droit » est clair tout en laissant la note signaler les autres nuances.
- source_word: וְשַׁדַּי
  choice: et que le Tout-Puissant
  rationale: שַׁדַּי est rendu par son titre français usuel. La reprise de « que » coordonne naturellement les deux éléments de la formule de serment.
- source_word: הֵמַר
  choice: a rempli ... d’amertume
  rationale: Le hiphil de מרר signifie rendre amer ou remplir d’amertume. Cette formulation conserve l’image tout en restant idiomatique en français.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » convient au registre poétique et conserve la texture de l’expression hébraïque sans imposer ici une définition technique.
theological_decisions:
- issue: Traduction des titres divins אֵל et שַׁדַּי
  choice: Dieu ... le Tout-Puissant
  alternative: Dieu ... Shaddaï
  rationale: Les titres sont traduits afin d’en communiquer le sens en français, tout en maintenant le parallélisme solennel du serment.
- issue: Portée de l’accusation exprimée par מִשְׁפָּטִי
  choice: mon droit
  alternative: la justice qui m’est due / mon juste jugement
  rationale: Le texte présente sans l’atténuer l’affirmation de Job selon laquelle Dieu l’a privé de son droit. La traduction ne transforme pas cette plainte en verdict doctrinal porté par le narrateur.
translation_notes:
  register: Français international moderne, solennel et poétique. La phrase demeure ouverte, conformément au fait que le serment commencé au verset 2 se poursuit dans les versets suivants.
