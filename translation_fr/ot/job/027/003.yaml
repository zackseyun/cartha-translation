  variant: modern international French
source:
  edition: WLC
  text: כִּֽי כָל ע֣וֹד נִשְׁמָתִ֣/י בִ֑/י וְ/ר֖וּחַ אֱל֣וֹהַּ בְּ/אַפִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/003.yaml
  text: For as long as my breath is still in me[a], and the spirit of God is in my nostrils,
translation:
  language: fr
  text: Car, tant que mon souffle est encore en moi et que le souffle de Dieu[a] est dans mes narines,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’Esprit de Dieu ». Le mot hébreu רוּחַ peut signifier « souffle », « vent » ou « esprit ».'
    reason: Alternative lexicale préservant l’étendue sémantique de רוּחַ.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici l’affirmation solennelle de Job et son lien avec la déclaration qui suit, sans imposer une causalité plus forte que le contexte.
- source_word: כָל עוֹד
  choice: tant que… encore
  rationale: 'Exprime la durée et la continuité : aussi longtemps que la situation demeure.'
- source_word: נִשְׁמָתִי
  choice: un souffle… en moi
  rationale: נשמה désigne ici le souffle vital. La tournure française naturelle conserve l’image de la vie qui demeure en Job.
- source_word: בִי
  choice: en moi
  rationale: Préserve simplement l’idée de présence intérieure portée par la préposition ב.
- source_word: וְרוּחַ
  choice: et que le souffle
  rationale: Dans le parallélisme avec נִשְׁמָתִי et avec les narines, « souffle » rend le sens concret et vital de רוּחַ, tout en laissant « Esprit » comme possibilité en note.
- source_word: אֱלוֹהַּ
  choice: de Dieu
  rationale: אֱלוֹהַּ est un titre divin singulier, particulièrement fréquent dans Job ; « Dieu » est la traduction française directe.
- source_word: בְּאַפִּי
  choice: dans mes narines
  rationale: Le sens physique de אַף est requis par l’image de la respiration ; « narines » conserve sa précision poétique.
theological_decisions:
- issue: Sens de רוּחַ אֱלוֹהַּ en parallèle avec נִשְׁמָתִי
  choice: le souffle de Dieu
  alternative: l’Esprit de Dieu
  rationale: Le contexte immédiat parle de la vie et de la respiration, notamment par la mention des narines. « Souffle de Dieu » convient donc au parallélisme, sans exclure la valeur possible d’« Esprit », signalée en note afin de préserver l’ambiguïté théologique.
translation_notes:
  register: Français moderne, digne et poétique. La répétition de « souffle » reflète le parallélisme hébreu et l’image concrète de la respiration. La virgule finale est maintenue puisque le verset se prolonge syntaxiquement au verset suivant.
