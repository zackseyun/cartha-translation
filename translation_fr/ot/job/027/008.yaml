id: JOB.27.8
reference: Job 27:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י מַה תִּקְוַ֣ת חָ֭נֵף כִּ֣י יִבְצָ֑ע כִּ֤י יֵ֖שֶׁל אֱל֣וֹהַּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/008.yaml
  text: For what is the hope of the godless when God cuts him off[c][b][a], when God takes away his life?
translation:
  language: fr
  text: Car quel espoir reste-t-il à l’impie[a], quand il s’est enrichi[b], quand Dieu lui retire la vie ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’hypocrite ». Le terme hébreu peut désigner une personne impie, irrévérencieuse ou hypocrite.
    reason: lexical_alternative
  - marker: b
    text: 'La proposition hébraïque est difficile. Autres traductions possibles : « quand il a gagné » ou « quand il est retranché ».'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּקְוַת
  choice: espoir
  rationale: Le nom désigne ce que l’on espère ou attend. « Espoir » convient naturellement à la question rhétorique sur ce qui reste à l’impie à l’approche de la mort.
- source_word: חָנֵף
  choice: l’impie
  rationale: Dans Job, le terme désigne généralement une personne irrévérencieuse ou sans piété, plutôt qu’un hypocrite au seul sens d’une personne dissimulatrice.
- source_word: יִבְצָע
  choice: il s’est enrichi
  rationale: Le verbe בצע est couramment associé au gain, souvent mal acquis. La proposition est difficile, mais le sens « quand il a gagné / s’est enrichi » respecte directement cette valeur lexicale et maintient le contraste entre ses acquis et la perte de sa vie.
- source_word: יֵשֶׁל
  choice: retire
  rationale: Dans ce contexte, le verbe exprime l’action d’ôter ou d’arracher la vie. « Retire » est idiomatique en français et conserve Dieu comme sujet explicite.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Forme poétique singulière fréquente dans Job, rendue naturellement par « Dieu ».
- source_word: נַפְשׁוֹ
  choice: la vie
  rationale: נֶפֶשׁ désigne ici la vie de la personne, que Dieu lui retire à la mort, sans imposer une affirmation technique sur la nature de l’âme.
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ
  choice: Traduire par « la vie »
  alternative: « son âme »
  rationale: Le verset évoque la mort et la perte de la vie, sans formuler une doctrine précise sur le statut métaphysique de l’âme.
- issue: Sujet et sens de יִבְצָע
  choice: 'Comprendre le verbe au sens d’acquérir un gain : « quand il s’est enrichi »'
  alternative: « quand Dieu le retranche » ou « quand il est retranché »
  rationale: La forme verbale a normalement pour sujet l’impie et le verbe est lexicalement lié au gain. La difficulté réelle de la proposition est signalée en note plutôt que résolue silencieusement selon le parallélisme.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la question rhétorique et l’ambiguïté de la proposition centrale tout en évitant le terme « âme », potentiellement trop technique ici.
