id: JOB.27.11
reference: Job 27:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אוֹרֶ֣ה אֶתְ/כֶ֣ם בְּ/יַד אֵ֑ל אֲשֶׁ֥ר עִם שַׁ֝דַּ֗י לֹ֣א אֲכַחֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/011.yaml
  text: I will teach you concerning the hand of God[b][a]; what is with the Almighty I will not hide.
translation:
  language: fr
  text: Je vous instruirai au sujet de la main de Dieu[a] ; je ne cacherai pas ce qui est auprès du Tout-Puissant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « concernant la main de Dieu ». La « main » peut désigner ici sa puissance, son action ou ses interventions.
    reason: lexical_alternative
  - marker: b
    text: Ou « ce qui appartient au Tout-Puissant », « le conseil du Tout-Puissant » ou « ce qui vient du Tout-Puissant ». L’expression hébraïque est concise et quelque peu elliptique.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹרֶה
  choice: Je vous instruirai
  rationale: Le hifil inaccompli, première personne du singulier, de ירה a ici le sens d’enseigner ou d’instruire. Le futur convient à la déclaration de Job.
- source_word: אֶתְכֶם
  choice: vous
  rationale: Le pronom objet est à la deuxième personne du masculin pluriel ; « vous » est son équivalent naturel en français.
- source_word: בְּיַד אֵל
  choice: au sujet de la main de Dieu
  rationale: La préposition ב est comprise comme introduisant le sujet de l’instruction. La métaphore de la « main » est conservée, car elle peut évoquer la puissance, l’action ou les interventions de Dieu sans imposer un seul sens.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל fonctionne ici comme désignation divine ; « Dieu » est la formulation française courante et claire.
- source_word: אֲשֶׁר עִם שַׁדַּי
  choice: ce qui est auprès du Tout-Puissant
  rationale: L’expression hébraïque est concise et elliptique. « Auprès du » en conserve l’indétermination tout en restant intelligible en français, sans préciser indûment conseil, dessein ou jugement.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Traduction française traditionnelle et intelligible du titre divin שַׁדַּי, particulièrement fréquent dans Job.
- source_word: לֹא אֲכַחֵד
  choice: je ne cacherai pas
  rationale: Le piel inaccompli de כחד signifie ici cacher ou dissimuler. « Je ne cacherai pas » est direct et naturel.
theological_decisions:
- issue: L’action divine exprimée par « la main de Dieu »
  choice: Conserver la métaphore « la main de Dieu ».
  alternative: la puissance de Dieu ; ce que Dieu fait
  rationale: La métaphore biblique peut désigner la puissance, l’activité ou les interventions de Dieu. La conserver évite de réduire sa portée à une seule interprétation.
- issue: Le rapport entre la seconde proposition et le Tout-Puissant
  choice: Traduire « ce qui est auprès du Tout-Puissant » en maintenant l’ellipse.
  alternative: ce qui appartient au Tout-Puissant ; le conseil du Tout-Puissant ; ce qui vient du Tout-Puissant
  rationale: L’hébreu ne nomme explicitement ni conseil, ni dessein, ni jugement. La traduction retenue préserve cette largeur sémantique et la tension du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Instruirai » maintient un registre légèrement soutenu adapté au discours sapientiel. La ponctuation par point-virgule fait ressortir le parallélisme des deux propositions.
