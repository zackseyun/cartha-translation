  source_fidelity: 'Le sens du texte hébreu est bien rendu : « part » / « héritage » conserve le parallélisme de חֵלֶק et נַחֲלָה, et « reçoivent du Tout-Puissant » exprime naturellement, dans ce contexte, le verbe littéral « prennent ». La formulation « que Dieu réserve à » interprète de façon justifiée l’expression difficile עִם־אֵל, tandis que la note en maintient la forme littérale et signale son sens possible.'
