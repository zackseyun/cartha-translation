id: JOB.27.13
reference: Job 27:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֶ֤ה חֵֽלֶק אָדָ֖ם רָשָׁ֥ע עִם אֵ֑ל וְֽ/נַחֲלַ֥ת עָ֝רִיצִ֗ים מִ/שַּׁדַּ֥י יִקָּֽחוּ׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/013.yaml
  text: 'This is the portion of a wicked man with God[c][b][a], and the inheritance that the ruthless receive from the Almighty:'
translation:
  language: fr
  text: 'Voici la part que Dieu réserve à l’homme méchant[a],

    et l’héritage que les hommes impitoyables reçoivent du Tout-Puissant[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la part de l’homme méchant auprès de Dieu »; l’expression peut désigner la part que Dieu lui attribue.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « prennent du Tout-Puissant ». Dans ce contexte de part et d’héritage, le verbe a le sens de « recevoir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Voici
  rationale: Le démonstratif introduit solennellement l’énoncé; « Voici » est naturel en français et convient à la présentation de ce qui suit.
- source_word: חֵלֶק
  choice: la part
  rationale: Le terme désigne ici le lot attribué ou l’issue réservée à quelqu’un; « part » maintient le parallélisme sans se confondre avec « héritage ».
- source_word: אָדָם רָשָׁע
  choice: l’homme méchant
  rationale: Le singulier hébreu est conservé dans cette généralisation sapientielle; « méchant » exprime la culpabilité morale de רָשָׁע.
- source_word: עִם אֵל
  choice: que Dieu réserve à
  rationale: Littéralement « avec Dieu », l’expression indique ici la part qui se trouve auprès de Dieu, donc celle qu’il assigne; cette formulation rend l’idiome clairement tout en signalant le sens littéral en note.
- source_word: נַחֲלַת
  choice: l’héritage
  rationale: « Héritage » conserve l’image d’une part attribuée et reçue, en parallèle avec חֵלֶק.
- source_word: עָרִיצִים
  choice: les hommes impitoyables
  rationale: Le mot désigne des personnes violentes, oppressives ou sans pitié; « impitoyables » est actuel et met en relief leur caractère brutal.
- source_word: מִשַּׁדַּי
  choice: du Tout-Puissant
  rationale: שַׁדַּי est rendu comme un titre divin; « le Tout-Puissant » est l’équivalent français traditionnel et intelligible.
- source_word: יִקָּחוּ
  choice: reçoivent
  rationale: Le verbe signifie littéralement « prennent », mais dans le contexte d’une part ou d’un héritage attribué par Dieu, « reçoivent » exprime naturellement le résultat sans suggérer une saisie autonome.
theological_decisions:
- issue: Rapport exprimé par עִם אֵל
  choice: la part que Dieu réserve à l’homme méchant
  alternative: la part de l’homme méchant auprès de Dieu
  rationale: La préposition signifie formellement « avec/auprès de », mais le contexte du lot et de l’héritage permet un sens idiomatique indiquant ce que Dieu attribue. La note préserve la forme et l’ambiguïté de l’hébreu.
- issue: Titre divin שַׁדַּי
  choice: le Tout-Puissant
  alternative: Shaddaï
  rationale: Il s’agit d’un titre divin, traduit pour communiquer sa valeur usuelle en français plutôt que simplement translittéré.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé. Le deux-points final annonce la description développée dans les versets suivants.
