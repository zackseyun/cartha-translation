  text: אִם תְּדַבֵּ֣רְנָה שְׂפָתַ֣/י עַוְלָ֑ה וּ֝/לְשׁוֹנִ֗/י אִם יֶהְגֶּ֥ה רְמִיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/004.yaml
  text: my lips will not speak injustice[a], nor will my tongue utter deceit.
translation:
  language: fr
  text: mes lèvres ne diront rien d’injuste[a], et ma langue ne prononcera aucune tromperie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une tournure de serment avec « si » (אִם) pour exprimer une forte dénégation : littéralement, « si mes lèvres disent quelque chose d’injuste… », au sens de « assurément, mes lèvres ne diront rien d’injuste ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ne… rien / ne… aucune
  rationale: Dans cette formulation de serment elliptique, אִם exprime une forte dénégation plutôt qu’une simple condition. Une négation explicite rend naturellement cette force en français.
- source_word: תְּדַבֵּרְנָה
  choice: diront
  rationale: Le piel de דבר signifie « parler, dire ». L’imparfait prend ici une valeur prospective et résolue, et le pluriel s’accorde naturellement avec « mes lèvres ».
- source_word: שְׂפָתַי
  choice: mes lèvres
  rationale: L’image corporelle du texte hébreu est conservée; elle reste claire et naturelle en français et forme un parallèle avec « ma langue ».
- source_word: עַוְלָה
  choice: rien d’injuste
  rationale: Le nom désigne l’injustice ou ce qui est moralement mauvais. Cette formulation convient au contexte de la parole tout en évitant de le confondre avec la tromperie du second membre.
- source_word: וּלְשׁוֹנִי
  choice: et ma langue ne
  rationale: La conjonction coordonne le second membre, tandis que la négation française y reprend la force dénégative de la construction hébraïque. « Ma langue » préserve le parallélisme.
- source_word: יֶהְגֶּה
  choice: prononcera
  rationale: Avec « langue » pour sujet et « tromperie » pour objet, הגה désigne ici le fait d’émettre ou d’exprimer par la parole. « Prononcera » est actuel, digne et précis.
- source_word: רְמִיָּה
  choice: aucune tromperie
  rationale: Le terme peut désigner la tromperie, la duplicité ou la perfidie. « Tromperie » est clair et conserve sa distinction avec l’injustice du premier membre.
theological_decisions: []
