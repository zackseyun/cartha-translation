id: JOB.27.10
reference: Job 27:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם עַל שַׁדַּ֥י יִתְעַנָּ֑ג יִקְרָ֖א אֱל֣וֹהַּ בְּ/כָל עֵֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/010.yaml
  text: Will he delight himself in the Almighty? Will he call on God at all times?[a][b]
translation:
  language: fr
  text: Trouvera-t-il son plaisir dans le Tout-Puissant ? Invoquera-t-il Dieu en tout temps ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « s’il trouve son plaisir dans le Tout-Puissant » ; ici, la particule hébraïque introduit vraisemblablement une question rhétorique.'
    reason: lexical_alternative
  - marker: b
    text: « Invoquer » peut aussi être rendu par « appeler » ou « prier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Trouvera-t-il… ?
  rationale: Dans ce contexte, אִם introduit une question rhétorique plutôt qu’une condition. La tournure interrogative française en restitue directement la valeur discursive.
- source_word: עַל
  choice: dans
  rationale: Avec התענג et un objet personnel, עַל désigne celui en qui l’on trouve son plaisir. « Trouver son plaisir dans » est idiomatique en français.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Le titre divin est traduit plutôt que translittéré, conformément à l’usage français courant et au sens traditionnel du titre.
- source_word: יִתְעַנָּג
  choice: trouvera-t-il son plaisir
  rationale: Cette formulation naturelle exprime le fait de prendre plaisir en quelqu’un tout en reflétant la nuance du hitpael.
- source_word: יִקְרָא
  choice: invoquera-t-il
  rationale: Avec Dieu comme objet, קרא signifie ici appeler Dieu, s’adresser à lui ou le prier. « Invoquer » garde cette portée religieuse sans réduire le terme à une seule forme de prière.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Le nom divin singulier est rendu simplement par « Dieu », sans ajout absent de l’hébreu.
- source_word: בְּכָל עֵת
  choice: en tout temps
  rationale: 'Cette expression française naturelle conserve l’étendue temporelle de l’hébreu : à toute occasion, constamment.'
theological_decisions:
- issue: Traduction du titre divin שַׁדַּי
  choice: le Tout-Puissant
  alternative: Shaddaï
  rationale: Il s’agit d’un titre divin ; le traduire le rend immédiatement compréhensible, tandis que la translittération reste une possibilité formelle.
- issue: Valeur de אִם en tête du verset
  choice: question rhétorique directe
  alternative: 'proposition conditionnelle : « s’il trouve son plaisir… »'
  rationale: Le contexte consacré à l’impie favorise une question rhétorique. Une note conserve toutefois la forme plus littérale et l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, poétique et digne. L’inversion interrogative maintient le parallélisme des deux questions. « Trouver son plaisir » est plus naturel aujourd’hui que « faire ses délices », tandis que « en tout temps » conserve une légère élévation de registre adaptée à Job.
