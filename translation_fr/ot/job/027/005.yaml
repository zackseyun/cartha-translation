reference: Job 27:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָלִ֣ילָ/ה לִּ/י֮ אִם אַצְדִּ֪יק אֶ֫תְ/כֶ֥ם עַד אֶגְוָ֑ע לֹא אָסִ֖יר תֻּמָּתִ֣/י מִמֶּֽ/נִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/005.yaml
  text: Far be it from me to declare you right[a]; until I die[b], I will not remove my integrity from myself.
translation:
  language: fr
  text: Loin de moi l’idée de vous donner raison[a] ! Jusqu’à mon dernier souffle, je ne renoncerai pas à mon intégrité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « vous déclarer dans votre bon droit » ou « vous justifier ». Le verbe hébreu a ici un sens judiciaire : déclarer quelqu’un dans son droit.'
    reason: lexical_alternative
  - marker: b
    text: Ou « à ma conduite irréprochable ». Le terme hébreu peut désigner l’intégrité morale ou le caractère irréprochable que Job revendique pour sa défense.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: Loin de moi l’idée de
  rationale: Expression française naturelle et soutenue d’un rejet énergique, qui conserve la force de l’idiome hébreu sans calque obscur.
- source_word: אִם אַצְדִּיק אֶתְכֶם
  choice: de vous donner raison
  rationale: 'Le hiphil de צדק a ici une portée judiciaire : reconnaître ou déclarer les interlocuteurs dans leur bon droit. « Donner raison » est clair et idiomatique dans le contexte d’une controverse.'
- source_word: עַד אֶגְוָע
  choice: Jusqu’à mon dernier souffle
  rationale: Rend naturellement l’idée de persévérer jusqu’à la mort, avec une solennité convenant au discours de Job.
- source_word: לֹא אָסִיר
  choice: je ne renoncerai pas à
  rationale: Dans ce contexte, le sens concret de faire disparaître ou écarter de soi son intégrité s’exprime naturellement en français par le refus d’y renoncer.
- source_word: תֻּמָּתִי
  choice: mon intégrité
  rationale: Le terme désigne la droiture ou l’intégrité morale revendiquée par Job, sans nécessairement affirmer une perfection absolue.
- source_word: מִמֶּנִּי
  choice: à (dans « renoncer à mon intégrité »)
  rationale: La construction française idiomatique absorbe le complément hébreu « loin de moi/de moi » tout en conservant l’idée que Job refuse de se départir de son intégrité.
theological_decisions:
- issue: Portée de la revendication morale de Job
  choice: mon intégrité
  alternative: mon innocence ; ma conduite irréprochable
  rationale: « Intégrité » maintient la revendication de droiture de Job face aux accusations sans la transformer en affirmation explicite d’une absence absolue de péché.
- issue: Valeur judiciaire de אַצְדִּיק
  choice: vous donner raison
  alternative: vous justifier ; vous déclarer justes
  rationale: Le choix conserve l’idée de reconnaître les amis comme étant dans leur bon droit, sans importer les connotations doctrinales que « justifier » peut porter en français.
translation_notes:
  register: Français international moderne, digne et oralement naturel. L’exclamation marque la vigueur du refus. « Jusqu’à mon dernier souffle » évite une formulation plate, tandis que « renoncer à mon intégrité » privilégie l’idiome français sans effacer la détermination du texte hébreu.
