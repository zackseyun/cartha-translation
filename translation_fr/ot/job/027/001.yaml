  text: וַ/יֹּ֣סֶף אִ֭יּוֹב שְׂאֵ֥ת מְשָׁל֗/וֹ וַ/יֹּאמַֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/001.yaml
  text: And Job again took up his discourse and said:[a]
translation:
  language: fr
  text: Job reprit son discours et dit :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa sentence », « sa parabole » ou « son oracle » ; le terme hébreu peut désigner diverses paroles solennelles ou imagées.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: reprit
  rationale: Le verbe יסף signifie littéralement « ajouter » ou « continuer ». Avec l’infinitif שְׂאֵת, « reprit » exprime naturellement en français la reprise de la parole tout en rendant l’ensemble de l’expression hébraïque.
- source_word: שְׂאֵת
  choice: reprit
  rationale: L’infinitif de נשׂא signifie littéralement « lever » ou « porter ». Dans la tournure שׂאת משל, il forme une expression idiomatique signifiant prendre ou reprendre un discours solennel; le français « reprit son discours » en donne un équivalent naturel.
- source_word: מְשָׁלוֹ
  choice: son discours
  rationale: מָשָׁל peut désigner un proverbe, une parabole, une sentence ou un discours poétique. Ici, il introduit une longue prise de parole de Job; « discours » convient donc à la forme littéraire sans réduire indûment le champ du terme.
- source_word: וַיֹּאמַר
  choice: et dit
  rationale: Formule narrative ordinaire introduisant les paroles qui suivent; « et dit » en conserve la coordination simple et solennelle.
- source_word: אִיּוֹב
  choice: Job
  rationale: Forme française traditionnelle et courante du nom propre.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation idiomatique « reprit son discours » évite le calque peu naturel « leva son discours », tandis que la note préserve l’étendue sémantique de מָשָׁל.
