id: JOB.27.17
reference: Job 27:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָ֭כִין וְ/צַדִּ֣יק יִלְבָּ֑שׁ וְ֝/כֶ֗סֶף נָקִ֥י יַחֲלֹֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/017.yaml
  text: He may prepare it[a], but the righteous will wear it[b], and the innocent will divide the silver.
translation:
  language: fr
  text: Il peut préparer les vêtements[a], mais le juste les portera, et l’innocent partagera l’argent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il prépare les vêtements, mais le juste les portera. » L’imparfait hébreu peut être rendu sans nuance concessive; le contexte du verset précédent permet toutefois de comprendre : « Il peut préparer…, mais… »'
    reason: lexical_alternative
  - marker: b
    text: Les vêtements et l’argent sont repris du verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: יָכִין
  choice: Il peut préparer
  rationale: 'Le hiphil de כון signifie « préparer, apprêter ». Le contexte donne à l’imparfait une portée concessive possible : quoi qu’il prépare, un autre en profitera.'
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé au singulier désigne ici la personne juste; « le juste » est naturel et conserve la forme représentative du texte.
- source_word: יִלְבָּשׁ
  choice: les portera
  rationale: Le qal de לבש signifie « revêtir, porter ». Le complément « les » reprend les vêtements du verset précédent.
- source_word: כֶסֶף
  choice: l’argent
  rationale: כֶּסֶף peut désigner l’argent métal ou la richesse monétaire. « L’argent » convient au bien accumulé mentionné au verset précédent sans trancher inutilement entre métal et monnaie.
- source_word: נָקִי
  choice: l’innocent
  rationale: Adjectif substantivé désignant celui qui est exempt de faute; il marque le contraste moral avec le méchant.
- source_word: יַחֲלֹק
  choice: partagera
  rationale: Le qal de חלק signifie « diviser, répartir, partager ». « Partagera » exprime naturellement la répartition de l’argent amassé.
theological_decisions: []
