id: JOB.27.16
reference: Job 27:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם יִצְבֹּ֣ר כֶּ/עָפָ֣ר כָּ֑סֶף וְ֝/כַ/חֹ֗מֶר יָכִ֥ין מַלְבּֽוּשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/016.yaml
  text: Though he heaps up silver like dust and prepares clothing like clay[b][a],
translation:
  language: fr
  text: 'Même s’il amasse l’argent comme la poussière

    et prépare des vêtements comme l’argile,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « S’il amasse l’argent comme la poussière et prépare des vêtements comme l’argile. » La particule hébraïque peut signifier « si » ou « même si ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Même si
  rationale: La particule peut introduire une condition (« si ») ou prendre une valeur concessive (« même si »). Ici, la concession convient au développement, puisque le verset suivant montre que cette accumulation ne profitera pas au méchant.
- source_word: יִצְבֹּר
  choice: amasse
  rationale: Le verbe exprime l’idée d’accumuler ou de mettre en tas; « amasse » restitue naturellement cette image.
- source_word: כֶּעָפָר
  choice: comme la poussière
  rationale: La préposition marque une comparaison hyperbolique évoquant une quantité innombrable.
- source_word: כָּסֶף
  choice: l’argent
  rationale: Le nom désigne littéralement l’argent métal et, par extension, la richesse monétaire. En français, « l’argent » conserve naturellement les deux nuances.
- source_word: וְכַחֹמֶר
  choice: comme l’argile
  rationale: חֹמֶר désigne ici vraisemblablement l’argile, image d’une matière abondante et commune.
- source_word: יָכִין
  choice: entasse
  rationale: Le hiphil de כון signifie normalement « préparer, disposer ». Dans le parallélisme avec « amasse » et la comparaison quantitative, « entasse » rend idiomatiquement l’idée de préparer une grande quantité, sans changer le résultat concret de l’action.
- source_word: מַלְבּוּשׁ
  choice: les vêtements
  rationale: Le nom peut être collectif (« habillement ») ou désigner des vêtements. Le pluriel français est naturel dans cette image d’accumulation.
theological_decisions:
- issue: Valeur de la particule אִם
  choice: 'Lecture concessive : « Même si »'
  alternative: 'Lecture conditionnelle : « S’il »'
  rationale: Les deux valeurs sont grammaticalement possibles. La lecture concessive exprime mieux le contraste avec le verset suivant, tout en conservant l’autre lecture en note.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme est conservé sur deux lignes; « argent », « poussière », « vêtements » et « argile » maintiennent les images concrètes de l’hébreu.
