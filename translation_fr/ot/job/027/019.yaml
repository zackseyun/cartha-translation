  text: עָשִׁ֣יר יִ֭שְׁכַּב וְ/לֹ֣א יֵאָסֵ֑ף עֵינָ֖י/ו פָּקַ֣ח וְ/אֵינֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/019.yaml
  text: He lies down rich[a], but he will not be gathered; he opens his eyes[b], and he is gone.
translation:
  language: fr
  text: Il se couche riche, mais il ne sera pas recueilli[a] ; il ouvre les yeux, et il n’est plus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « il ne sera pas rassemblé ». L’expression peut évoquer la mort ou l’ensevelissement, comme le fait d’être réuni aux siens, sans le dire explicitement.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « et il n’est pas » ; expression pouvant signifier qu’il a disparu ou qu’il n’est plus en vie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: riche
  rationale: L’adjectif fonctionne comme un nom ou un attribut. « Il se couche riche » conserve la formulation compacte de l’hébreu sans ajouter explicitement « l’homme ».
- source_word: יִשְׁכַּב
  choice: il se couche
  rationale: Le sens fondamental est « se coucher ». Le présent de narration convient au caractère vif et poétique du passage, tout en laissant le contexte porter la valeur prospective.
- source_word: וְלֹא יֵאָסֵף
  choice: mais il ne sera pas recueilli
  rationale: Le niphal de אָסף signifie « être recueilli/rassemblé » et peut évoquer la mort, l’ensevelissement ou le fait d’être réuni aux siens. La traduction conserve la concision et l’ambiguïté de l’hébreu plutôt que d’expliciter l’objet sous-entendu.
- source_word: עֵינָיו פָּקַח
  choice: il ouvre les yeux
  rationale: Cette tournure française naturelle restitue la transition soudaine de la formulation hébraïque, littéralement « ses yeux, il ouvre ».
- source_word: וְאֵינֶנּוּ
  choice: il n’est plus
  rationale: Littéralement « il n’est pas », cette expression idiomatique indique qu’une personne a disparu ou n’existe plus. « Il n’est plus » garde ici la brièveté abrupte et la possible référence à la mort.
theological_decisions:
- issue: Portée de « il ne sera pas recueilli »
  choice: Ne pas préciser s’il s’agit d’être recueilli auprès de ses ancêtres, enseveli ou emporté par la mort.
  alternative: « Il ne sera pas recueilli auprès de ses pères » ou « il ne sera pas enseveli ».
  rationale: Le texte hébreu demeure elliptique. Une explicitation trancherait une ambiguïté réelle et pourrait introduire une conception particulière de la mort ou des rites funéraires.
translation_notes:
  register: Français moderne, sobre et poétique. Le verset conserve les formulations brèves et énigmatiques de l’hébreu. « Recueilli » est volontairement maintenu malgré son caractère légèrement marqué afin de préserver l’allusion possible à la mort et à l’ensevelissement sans l’expliciter.
