  source_fidelity: 'Le texte conserve correctement les trois mouvements du verset : le riche se couche, il n’est pas « recueilli/rassemblé », puis, à l’ouverture des yeux, « il n’est plus ». « Recueilli » peut rendre le niphal de אסף tout en laissant ouverte l’allusion possible à la mort ou à l’ensevelissement. Cette ambiguïté doit toutefois être signalée sur l’expression qu’elle concerne.'
