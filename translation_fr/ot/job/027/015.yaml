source:
  edition: WLC
  text: שריד/ו בַּ/מָּ֣וֶת יִקָּבֵ֑רוּ וְ֝/אַלְמְנֹתָ֗י/ו לֹ֣א תִבְכֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/015.yaml
  text: Those who survive him will be buried by death[a], and his widows will not weep.
translation:
  language: fr
  text: Ceux qui lui survivront seront ensevelis par la mort[a], et ses veuves ne pleureront pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seront ensevelis dans la mort ». L’expression hébraïque est condensée et peut évoquer soit la mort comme cause ou sort de leur ensevelissement, soit un ensevelissement au milieu de la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִידוֹ
  choice: Ceux qui lui survivront
  rationale: Le nom singulier muni du suffixe de 3e personne masculine du singulier a ici une valeur collective, confirmée par le verbe au pluriel. Cette formulation naturelle conserve l’idée de ceux qui restent après lui.
- source_word: בַּמָּוֶת
  choice: par la mort
  rationale: La préposition ב avec מָוֶת peut exprimer la circonstance ou un moyen proche de l’agent. « Par la mort » préserve l’image abrupte de l’hébreu sans exclure l’autre lecture, signalée en note.
- source_word: יִקָּבֵרוּ
  choice: seront ensevelis
  rationale: Le nifal imparfait de קבר exprime ici le passif « être enterré ». « Ensevelis » convient au registre funéraire et reste naturel en français moderne.
- source_word: וְאַלְמְנֹתָיו
  choice: et ses veuves
  rationale: אַלְמָנָה signifie « veuve » ; le pluriel avec suffixe masculin singulier se rend directement par « ses veuves », probablement les femmes devenues veuves à la suite des décès évoqués.
- source_word: לֹא תִבְכֶּינָה
  choice: ne pleureront pas
  rationale: בכה désigne précisément l’action de pleurer. Cette traduction conserve le sens concret plutôt que de l’élargir à l’ensemble du deuil.
theological_decisions: []
