  yaml_path: translation/ot/job/027/009.yaml
  text: Will God hear his cry when distress comes upon him?[a][b][c]
translation:
  language: fr
  text: Dieu entendra-t-il son cri quand la détresse viendra sur lui ?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son appel au secours » ou « sa supplication ».
    reason: lexical_alternative
  - marker: b
    text: Ou « si la détresse vient sur lui » ; la conjonction hébraïque peut aussi être comprise dans un sens conditionnel, bien que le sens temporel « quand » convienne bien au contexte.
    reason: alternative_reading
  - marker: c
    text: « Détresse » peut aussi être rendue par « malheur », « épreuve » ou « adversité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצַּעֲקָתוֹ
  choice: son cri
  rationale: צְעָקָה désigne un cri ou un appel pressant, souvent poussé dans la détresse. « Son cri » est naturel, concis et conserve cette force.
- source_word: יִשְׁמַע
  choice: entendra-t-il
  rationale: 'Dans cette question rhétorique, le yiqtol a naturellement une valeur future : il s''agit de savoir si Dieu écoutera cet homme au moment de la détresse.'
- source_word: אֵל
  choice: Dieu
  rationale: אֵל désigne ici Dieu. « Dieu » est la formulation française la plus claire et idiomatique.
- source_word: כִּי
  choice: quand
  rationale: La conjonction peut avoir plusieurs valeurs, notamment temporelle ou conditionnelle. Le sens temporel « quand » s'accorde bien avec le contexte, sans exclure l'autre lecture, signalée en note.
- source_word: תָבוֹא
  choice: viendra
  rationale: Le verbe בוא signifie littéralement « venir ». Le futur français convient à la question et préserve l'image d'une détresse qui survient.
- source_word: עָלָיו
  choice: sur lui
  rationale: Avec בוא, la préposition עַל exprime couramment ce qui vient ou s'abat sur quelqu'un. « Sur lui » suit sobrement la construction hébraïque.
- source_word: צָרָה
  choice: la détresse
  rationale: צָרָה peut désigner la détresse, le malheur, l'épreuve ou l'adversité. « Détresse » exprime la situation oppressante sans préciser indûment sa nature.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique et l'ordre logique de l'hébreu sont conservés. Les ambiguïtés lexicales de צְעָקָה et צָרָה ainsi que la valeur temporelle ou conditionnelle de כִּי sont présentées en notes.
