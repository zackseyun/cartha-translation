  yaml_path: translation/ot/job/027/023.yaml
  text: He claps his hands at him and hisses at him from his place[a][b].
translation:
  language: fr
  text: Il bat des mains contre lui et le siffle de là où il se tient.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le hue ». Le verbe hébreu désigne un sifflement et peut avoir, dans ce contexte, une valeur hostile ou moqueuse.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu ne précise pas le sujet de « bat » et « siffle ». Il peut être compris comme Dieu, d’autres personnes ou une force impersonnelle.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂפֹּק ... כַּפֵּימוֹ
  choice: bat des mains
  rationale: L’expression hébraïque désigne le fait de frapper ou battre des mains. « Battre des mains » conserve le geste concret sans préciser s’il exprime la dérision, le triomphe ou autre chose.
- source_word: עָלֵימוֹ / עָלָיו
  choice: contre lui / le
  rationale: Avec ces gestes hostiles, עַל peut exprimer une action dirigée contre quelqu’un. La variation française évite une répétition pesante tout en conservant la même cible.
- source_word: וְיִשְׁרֹק
  choice: conspue
  rationale: Le verbe שׁרק peut désigner un sifflement hostile ou le fait de conspuer. « Conspue » rend naturellement en français l’hostilité du geste sonore, tandis que « siffle » est signalé en note comme possibilité plus formelle.
- source_word: מִמְּקֹמוֹ
  choice: de là où il se tient
  rationale: מָקוֹם signifie « lieu, endroit ». Cette formulation française naturelle conserve l’idée que l’action part de l’endroit occupé par le sujet, sans transformer ce lieu en demeure.
theological_decisions:
- issue: Identité du sujet des verbes
  choice: Sujet masculin singulier implicite rendu par « il »
  alternative: Dieu, des gens, le vent d’est ou une force impersonnelle
  rationale: Les verbes hébreux sont au masculin singulier, mais aucun sujet explicite n’est donné dans ce verset. La traduction maintient cette indétermination au lieu d’identifier l’acteur.
translation_notes:
  register: Français international actuel, digne et accessible. « Conspuer » est légèrement soutenu, mais précis et idiomatique dans un contexte d’hostilité publique. Les marqueurs [a] et [b] figurent tous deux dans le texte.
