source:
  edition: WLC
  text: אִם יִרְבּ֣וּ בָנָ֣י/ו לְמוֹ חָ֑רֶב וְ֝/צֶאֱצָאָ֗י/ו לֹ֣א יִשְׂבְּעוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/014.yaml
  text: If his sons multiply[a], it is for the sword, and his descendants will not be satisfied with bread.
translation:
  language: fr
  text: Si ses fils deviennent nombreux, ils sont voués à l’épée, et ses descendants n’auront pas assez de pain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit naturellement en français la proposition conditionnelle, sans transformer la condition en concession ou en indication temporelle.
- source_word: יִרְבּוּ בָנָיו
  choice: ses fils deviennent nombreux
  rationale: Rend le verbe רבה dans son sens d’augmentation numérique et conserve le masculin explicite de בָּנִים.
- source_word: לְמוֹ חָרֶב
  choice: c’est pour l’épée
  rationale: Conserve l’image concrète de l’épée et exprime la destination funeste indiquée par la préposition.
- source_word: וְצֶאֱצָאָיו
  choice: et ses descendants
  rationale: Le terme désigne la postérité au sens large, au-delà des seuls fils immédiats.
- source_word: לֹא יִשְׂבְּעוּ לָחֶם
  choice: n’auront pas assez de pain
  rationale: Exprime en français courant l’idée idiomatique de ne pas être rassasié de pain, donc de manquer de nourriture, tout en conservant l’image concrète du pain.
theological_decisions:
- issue: Portée de la déclaration sur le sort des fils et des descendants
  choice: Maintien de la formulation conditionnelle et des images de l’épée et du manque de pain
  alternative: Expliciter une sentence divine de mort violente et de famine
  rationale: Le verset décrit le sort funeste de la postérité du méchant sans nommer explicitement l’agent ni développer le mécanisme du jugement; la traduction n’ajoute donc aucune précision doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La structure conditionnelle et le parallélisme sont préservés; « n’auront pas assez de pain » privilégie une expression naturelle plutôt que le calque moins idiomatique « ne seront pas rassasiés de pain ».
