  yaml_path: translation/ot/job/027/022.yaml
  text: He hurls at him and does not spare[b][a]; he surely flees from his hand.
translation:
  language: fr
  text: Il lance contre lui sans l’épargner[a] ; celui-ci s’enfuit de sa main[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Il jette/lance contre lui » ; l’objet du verbe n’est pas exprimé en hébreu. Selon le contexte, on peut aussi comprendre : « Il se jette sur lui » ou « Il fond sur lui ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « fuyant, il fuit de sa main ». La construction hébraïque, un infinitif absolu suivi d’un verbe conjugué, souligne l’intensité ou la précipitation de la fuite. « Sa main » peut aussi évoquer sa puissance ou son emprise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַשְׁלֵךְ עָלָיו
  choice: Il lance ses coups contre lui
  rationale: Le verbe signifie « jeter, lancer », mais son complément d’objet n’est pas exprimé en hébreu. « Ses coups » est donc indiqué comme un ajout de clarté dans la note, tandis que « contre lui » rend le mouvement hostile exprimé par עַל.
- source_word: וְלֹא יַחְמֹל
  choice: sans l’épargner
  rationale: חמל peut signifier « épargner » ou « avoir pitié ». Dans cette scène de jugement violent, « sans l’épargner » exprime avec concision l’absence de retenue et de compassion.
- source_word: מִיָּדוֹ
  choice: pour échapper à sa main
  rationale: La traduction conserve l’image concrète de la « main », qui peut aussi désigner la puissance ou l’emprise.
- source_word: בָּרוֹחַ יִבְרָח
  choice: s’enfuit précipitamment
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’idée de fuite. « Précipitamment » communique cette intensité sans reproduire la répétition peu naturelle en français.
theological_decisions:
- issue: Identité du sujet de « lance » et référent de « sa main »
  choice: Conserver les pronoms sans identifier explicitement le sujet
  alternative: Nommer Dieu ou le vent d’est
  rationale: Le contexte permet notamment de comprendre le sujet comme le vent d’est mentionné au verset précédent, mais le passage peut aussi être lu avec Dieu comme agent du jugement. Le texte français préserve cette ambiguïté.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La phrase distingue naturellement l’assaillant de sa victime par « celui-ci », tout en maintenant l’indétermination du sujet et des pronoms présente dans l’hébreu.
