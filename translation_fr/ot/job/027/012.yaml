  text: הֵן אַתֶּ֣ם כֻּלְּ/כֶ֣ם חֲזִיתֶ֑ם וְ/לָ/מָּה זֶּ֝֗ה הֶ֣בֶל תֶּהְבָּֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/012.yaml
  text: Look[a], all of you have seen it; why then do you become vain?
translation:
  language: fr
  text: Certes, vous l’avez tous vu ; pourquoi donc vous montrer si vains[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu associe un nom et un verbe de la même racine, évoquant le vide, la vanité ou la futilité. On pourrait aussi traduire : « pourquoi donc agir de façon si vaine ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: Particule d’affirmation et d’insistance attirant l’attention ; « Oui » convient ici à une assertion emphatique en français moderne.
- source_word: אַתֶּם כֻּלְּכֶם
  choice: vous tous
  rationale: Rend à la fois le pronom explicite et la totalité soulignée par כֻּלְּכֶם.
- source_word: חֲזִיתֶם
  choice: vous l’avez vu
  rationale: Le verbe חזה exprime la vue ou la constatation directe ; le passé composé relie cette observation au reproche présent.
- source_word: וְלָמָּה
  choice: alors pourquoi
  rationale: 'Exprime naturellement la conséquence argumentative : puisqu’ils ont tous constaté la réalité, leur conduite est inexplicable.'
- source_word: זֶּה
  choice: ainsi
  rationale: Dans cette tournure, זֶּה a vraisemblablement une valeur adverbiale ou intensive ; « ainsi » reste naturel sans lui attribuer un objet démonstratif précis.
- source_word: הֶבֶל תֶּהְבָּלוּ
  choice: vous perdre en futilités
  rationale: Le nom et le verbe apparentés évoquent le vide, la vanité ou la futilité. Cette formulation française rend l’idée d’une activité vaine sans limiter indûment le sens aux paroles seules.
theological_decisions:
- issue: Portée de la futilité reprochée
  choice: Ne pas préciser si elle concerne exclusivement les paroles, les raisonnements ou la conduite
  alternative: « débiter des paroles vides » ou « raisonner en vain »
  rationale: L’hébreu demeure général ; une précision contextuelle excessive supprimerait cette ambiguïté.
translation_notes:
  register: Français international moderne, direct et digne. La reprise « vous tous, vous » conserve l’emphase de l’hébreu. Le jeu étymologique hébreu, difficile à reproduire naturellement, est signalé en note.
