    issue: Explicitation interprétative dans le dernier membre
    rationale: « Se succèdent contre moi » transforme la phrase nominale חֲלִיפוֹת וְצָבָא עִמִּי en une prédication dynamique hostile. L'idée de vagues successives est possible, mais elle doit être réservée à la note afin de préserver l'ambiguïté du texte.
  - severity: low
    issue: Rendu de רבה
    rationale: « Redoubler de colère » est idiomatique, mais « accroître ta colère » correspond plus exactement au verbe causatif « augmenter » et évite de préciser un doublement.
  - severity: low
