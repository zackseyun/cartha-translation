revisions:
- from: Tu renouvelles tes témoins contre moi[a], tu redoubles de colère envers moi ; relèves et armée se succèdent contre moi[b].
  to: Tu renouvelles tes témoins contre moi[a], tu accrois ta colère contre moi ; changements et armée sont avec moi[b].
  rationale: La révision conserve le sens judiciaire et hostile des deux premiers membres, tout en corrigeant le dernier membre pour ne pas transformer une expression nominale ambiguë en scène militaire explicitement développée. Les interprétations militaires et celles qui comprennent צָבָא comme « guerre » ou « service pénible » sont maintenues en note, sans être imposées au texte principal.
  reviewer_model: gpt-5.6-terra
