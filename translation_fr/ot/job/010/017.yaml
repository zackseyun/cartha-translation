source:
  edition: WLC
  text: תְּחַדֵּ֬שׁ עֵדֶ֨י/ךָ נֶגְדִּ֗/י וְ/תֶ֣רֶב כַּֽ֭עַשְׂ/ךָ עִמָּדִ֑/י חֲלִיפ֖וֹת וְ/צָבָ֣א עִמִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/017.yaml
  text: You renew your witnesses against me[a], and you increase your anger with me[b]; changes and hard service are with me.
translation:
  language: fr
  text: Tu renouvelles tes témoins contre moi[a], tu accrois ta colère contre moi ; changements et armée sont avec moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes preuves contre moi » ou « tes témoignages contre moi » ; l’hébreu peut désigner des témoins personnels, des témoignages ou des éléments à charge.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « changements et armée avec moi ». On peut aussi comprendre : « des assauts successifs et la guerre sont contre moi » ou « des changements et un service pénible sont avec moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַדֵּשׁ
  choice: tu renouvelles
  rationale: Le piel de חדש exprime ici le renouvellement ou la reprise ; le présent français rend bien l’action répétée dont Job se plaint.
- source_word: עֵדֶיךָ
  choice: tes témoins
  rationale: Le pluriel עֵד peut désigner des témoins ou des témoignages/preuves. « Témoins » conserve nettement l’image judiciaire, sans exclure l’autre sens signalé en note.
- source_word: נֶגְדִּי
  choice: contre moi
  rationale: Bien que la préposition puisse signifier littéralement « devant moi », le contexte accusatoire appelle naturellement « contre moi ».
- source_word: וְתֶרֶב
  choice: tu redoubles
  rationale: La forme de רבה indique une augmentation. « Redoubler de colère » est naturel en français et suggère l’intensification répétée.
- source_word: כַּעַשְׂךָ
  choice: de colère
  rationale: כעס peut évoquer la colère, l’irritation ou l’indignation ; « colère » est ici le terme français le plus clair.
- source_word: עִמָּדִי
  choice: envers moi
  rationale: Le sens littéral est « avec moi », mais, associé à la colère, « envers moi » rend naturellement la relation hostile sans la surinterpréter.
- source_word: חֲלִיפוֹת
  choice: relèves
  rationale: חֲלִיפוֹת désigne des changements, remplacements ou successions. Avec צבא, « relèves » maintient l’image de contingents qui se remplacent.
- source_word: וְצָבָא
  choice: armée
  rationale: צבא peut signifier armée, guerre ou service pénible. Associé à « relèves », « armée » fait ressortir l’imagerie militaire probable.
- source_word: עִמִּי
  choice: se succèdent contre moi
  rationale: Littéralement « avec moi ». Le parallélisme hostile et l’image des relèves militaires justifient une formulation française dynamique qui explicite leur succession dirigée contre Job.
theological_decisions:
- issue: Nature des « témoins » suscités par Dieu
  choice: Conserver l’image judiciaire par « témoins »
  alternative: Rendre par « preuves » ou identifier les témoins aux souffrances de Job
  rationale: L’hébreu permet une lecture personnelle ou probatoire ; le texte ne précise pas l’identité de ces témoins. La traduction et la note préservent cette tension.
- issue: Interprétation de חֲלִיפוֹת וְצָבָא
  choice: Privilégier l’image de relèves militaires successives
  alternative: « changements et service pénible » ou « changements et guerre »
  rationale: La proximité de חֲלִיפוֹת avec צבא favorise l’idée de troupes ou d’assauts qui se relaient, mais l’ambiguïté lexicale est maintenue en note.
translation_notes:
  register: Français moderne, poétique et digne. Le tutoiement correspond à l’adresse directe à Dieu. La seconde proposition est légèrement explicitée pour rendre intelligible en français la formulation hébraïque très condensée, tandis que la note en conserve la littéralité et les principales possibilités.
