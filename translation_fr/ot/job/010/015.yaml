  text: אִם רָשַׁ֡עְתִּי אַלְלַ֬י לִ֗/י וְ֭/צָדַקְתִּי לֹא אֶשָּׂ֣א רֹאשִׁ֑/י שְׂבַ֥ע קָ֝ל֗וֹן וּ/רְאֵ֥ה עָנְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/015.yaml
  text: If I am wicked[a], woe to me! Even if I am righteous, I cannot lift up my head, filled with disgrace and looking on my affliction.
translation:
  language: fr
  text: 'Si j’ai fait le mal, malheur à moi ! Même si je suis juste, je ne peux relever la tête : je suis plein de honte. Vois mon affliction ![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre analyse : « plein de honte et voyant mon affliction » ou « les yeux fixés sur mon affliction ». L’hébreu est syntaxiquement difficile ; certains comprennent ces mots comme la suite de la description que Job fait de lui-même, plutôt que comme un appel direct à Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם רָשַׁעְתִּי
  choice: Si j’ai fait le mal
  rationale: Le parfait רָשַׁעְתִּי exprime naturellement une conduite mauvaise accomplie. Cette formulation française conserve la portée morale du verbe sans réduire le propos à une culpabilité strictement judiciaire.
- source_word: אַלְלַי לִי
  choice: malheur à moi !
  rationale: Expression française actuelle et digne qui garde la force de la plainte.
- source_word: וְצָדַקְתִּי
  choice: Même si je suis juste
  rationale: « Même si » rend la valeur concessive du contexte, tandis que « juste » préserve les dimensions morale et judiciaire de צדק.
- source_word: לֹא אֶשָּׂא רֹאשִׁי
  choice: je ne peux relever la tête
  rationale: L’expression évoque la capacité de retrouver assurance et dignité. « Ne peux » explicite la portée contextuelle sans faire de la phrase une simple décision volontaire.
- source_word: שְׂבַע קָלוֹן
  choice: tant je suis plein de honte
  rationale: שְׂבַע indique la satiété ou la plénitude. « Plein de honte » est idiomatique en français et rend l’humiliation exprimée par קָלוֹן; « tant » rattache naturellement cet état à l’impossibilité de relever la tête.
- source_word: וּרְאֵה עָנְיִי
  choice: Vois mon affliction !
  rationale: Selon la vocalisation massorétique, רְאֵה se lit le plus directement comme un impératif singulier. La traduction garde donc l’appel adressé à Dieu, tout en signalant en note l’autre analyse syntaxique possible.
theological_decisions:
- issue: Interprétation de וּרְאֵה עָנְיִי
  choice: 'Appel direct à Dieu : « Vois mon affliction ! »'
  alternative: 'Suite de la description de Job : « voyant mon affliction » ou « les yeux fixés sur mon affliction »'
  rationale: La forme vocalisée רְאֵה soutient directement l’impératif, mais l’enchaînement syntaxique permet aussi de comprendre ces mots comme prolongeant la description de l’état de Job. La note préserve cette ambiguïté sans effacer le mouvement de la plainte.
translation_notes:
  register: Français international moderne, sobre et digne. Le verset garde le contraste entre faute et justice, ainsi que le passage abrupt mais grammaticalement fondé de l’auto-description à l’appel adressé à Dieu.
