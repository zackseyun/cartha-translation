source:
  edition: WLC
  text: כִּֽי תְבַקֵּ֥שׁ לַ/עֲוֺנִ֑/י וּ֭/לְ/חַטָּאתִ֥/י תִדְרֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/006.yaml
  text: that you seek out my iniquity and search for my sin?[a]
translation:
  language: fr
  text: pour rechercher ma faute et scruter mon péché ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car tu recherches ma culpabilité et scrutes mon péché » ; le mot hébreu traduit par « faute » peut aussi désigner la culpabilité.'
    reason: Ambiguïté de כִּי et polysémie de עָוֹן.
lexical_decisions:
- source_word: כִּי
  choice: pour
  rationale: Dans la continuité de la question rhétorique du verset précédent, כִּי introduit ici ce que les jours de Dieu sembleraient lui permettre de faire; en français, l’infinitif de but « pour » rend naturellement ce lien sans en faire une affirmation causale indépendante.
- source_word: תְבַקֵּשׁ
  choice: rechercher
  rationale: Le piel de בקש exprime une recherche active. « Rechercher » convient au ton d’enquête et forme un parallèle naturel avec « scruter ».
- source_word: לַעֲוֺנִי
  choice: ma faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou la peine qui en résulte. « Ma faute » conserve ici le sens moral recherché, sans affirmer que Job est effectivement coupable.
- source_word: וּלְחַטָּאתִי
  choice: mon péché
  rationale: חַטָּאת désigne ici le péché, en parallèle avec עָוֹן. Le terme français garde la portée morale et la distinction lexicale entre les deux membres.
- source_word: תִדְרֹשׁ
  choice: scruter
  rationale: דרש peut signifier chercher, examiner ou enquêter. « Scruter » exprime une investigation minutieuse et évite une répétition plate de « rechercher ».
theological_decisions:
- issue: Rendu du couple עָוֹן et חַטָּאת
  choice: « ma faute » et « mon péché », sans affirmer la culpabilité réelle de Job
  alternative: « ma culpabilité » et « mon péché »
  rationale: Job décrit ce qu’il perçoit comme une recherche divine de motifs d’accusation. Le texte doit préserver cette plainte et la tension du livre, sans conclure que Job est réellement coupable.
- issue: Valeur de כִּי dans la question prolongée depuis le verset précédent
  choice: 'Le rendre par une tournure finale : « pour rechercher… »'
  alternative: « car tu recherches… » ou « afin que tu recherches… »
  rationale: La syntaxe dépend du contexte immédiat et peut exprimer le contenu ou la visée de la question. La tournure retenue est naturelle en français tout en gardant la force rhétorique; la valeur causale demeure signalée en note.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et se lit comme la suite de la question du verset précédent. « Scruter » conserve l’idée d’un examen poussé sans introduire de vocabulaire juridique absent du texte.
