  text: before I go—and do not return—to the land of darkness and deep shadow,[a]
translation:
  language: fr
  text: avant que je m’en aille sans revenir vers le pays des ténèbres et de l’ombre profonde,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la traduction traditionnelle : « le pays des ténèbres et de l’ombre de la mort ».'
    reason: Alternative lexicale pour צַלְמָוֶת.
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: avant que
  rationale: 'La particule temporelle introduit naturellement en français une proposition au subjonctif : « avant que je m’en aille ».'
- source_word: אֵלֵךְ
  choice: je m’en aille
  rationale: Le verbe הלך signifie couramment « aller ». Dans ce contexte de départ vers le séjour des morts, « m’en aller » reste naturel sans expliciter « mourir ».
- source_word: וְלֹא אָשׁוּב
  choice: sans retour
  rationale: Cette formulation française concise rend la négation de שׁוב (« revenir ») et s’intègre clairement à la phrase sans transformer l’énoncé en impératif.
- source_word: אֶל
  choice: vers
  rationale: La préposition marque la direction ; « vers » convient naturellement au mouvement exprimé par « s’en aller ».
- source_word: אֶרֶץ
  choice: le pays
  rationale: Ici, אֶרֶץ désigne un domaine ou un pays, plutôt que la terre au sens général.
- source_word: חֹשֶׁךְ
  choice: ténèbres
  rationale: « Ténèbres » rend directement l’obscurité tout en conservant le registre poétique et solennel.
- source_word: צַלְמָוֶת
  choice: ombre profonde
  rationale: Le terme désigne une obscurité ou une ombre particulièrement profonde. Cette traduction préserve le parallélisme poétique sans imposer l’analyse traditionnelle « ombre de la mort ».
theological_decisions:
- issue: Traduction de צַלְמָוֶת dans un contexte poétique associé à la mort
  choice: ombre profonde
  alternative: ombre de la mort ; obscurité profonde
  rationale: Le sens précis du terme reste discuté. « Ombre profonde » exprime naturellement l’obscurité extrême et préserve la tension lexicale, tandis que la traduction traditionnelle est signalée en note.
translation_notes:
  register: Français moderne, poétique et digne. La syntaxe demeure fluide tout en conservant l’image du déplacement vers un pays obscur et l’absence de retour.
