id: JOB.10.4
reference: Job 10:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/עֵינֵ֣י בָשָׂ֣ר לָ֑/ךְ אִם כִּ/רְא֖וֹת אֱנ֣וֹשׁ תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/004.yaml
  text: Do you have eyes of flesh[a], or do you see as a man sees?
translation:
  language: fr
  text: As-tu des yeux de chair, ou vois-tu comme voit un être humain[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un mortel ». Le mot hébreu אֱנוֹשׁ désigne un être humain et évoque souvent sa fragilité ou sa condition mortelle.
    reason: alternative lexicale
lexical_decisions:
- source_word: הַעֵינֵי בָשָׂר לָךְ
  choice: As-tu des yeux de chair
  rationale: La construction nominale avec לָךְ exprime ici la possession. « As-tu » est idiomatique en français, tandis que « yeux de chair » conserve l’image concrète et anthropomorphique de l’hébreu.
- source_word: אִם
  choice: ou
  rationale: Dans cette question rhétorique, אִם introduit une autre possibilité plutôt qu’une condition.
- source_word: כִּרְאוֹת ... תִּרְאֶה
  choice: vois-tu comme voit
  rationale: Cette formulation rend la comparaison introduite par כ et maintient la répétition du verbe « voir », importante dans le verset.
- source_word: אֱנוֹשׁ
  choice: un être humain
  rationale: Le nom désigne ici un représentant de l’humanité et peut suggérer sa faiblesse ou sa condition mortelle. « Un être humain » exprime clairement la valeur générique sans ajouter explicitement une nuance que le contexte laisse implicite.
theological_decisions:
- issue: Langage anthropomorphique concernant la perception de Dieu
  choice: Conserver l’image des « yeux de chair » et la comparaison avec la vision humaine
  alternative: 'Paraphraser : « Juges-tu d’après les apparences comme les humains ? »'
  rationale: L’hébreu emploie une image concrète et une question rhétorique. La conserver respecte la tension du discours de Job sans lui imposer une explication doctrinale.
- issue: Valeur générique du singulier אֱנוֹשׁ
  choice: un être humain
  alternative: un homme ; un mortel
  rationale: Le français moderne comprend naturellement « un être humain » dans un sens représentatif. « Un mortel » rendrait explicite une nuance de fragilité possible, mais non obligatoire ici.
translation_notes:
  register: Français moderne, sobre et digne. Le tutoiement convient à l’adresse directe de Job à Dieu. L’ordre « comme voit un être humain » est légèrement soutenu, mais naturel dans un registre poétique et utile pour préserver la répétition de « voir ».
