source:
  edition: WLC
  text: נָֽקְטָ֥ה נַפְשִׁ֗/י בְּ/חַ֫יָּ֥/י אֶֽעֶזְבָ֣ה עָלַ֣/י שִׂיחִ֑/י אֲ֝דַבְּרָה֗ בְּ/מַ֣ר נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/001.yaml
  text: My soul loathes my life[a]; I will give free course to my complaint[b]; I will speak in the bitterness of my soul.
translation:
  language: fr
  text: Mon âme a ma vie en horreur[a] ; je laisserai libre cours à ma plainte[b] ; je parlerai dans l’amertume de mon âme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mon âme est lasse de ma vie. » Le verbe hébreu peut exprimer aussi bien une profonde lassitude que l’horreur ou le dégoût.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, l’expression évoque le fait de relâcher sa plainte : Job ne la retiendra plus.'
    reason: idiom_explanation
lexical_decisions:
- source_word: נָקְטָה
  choice: a … en horreur
  rationale: Le verbe exprime une profonde répulsion, tout en pouvant aussi évoquer une lassitude extrême. « A en horreur » restitue sa force sans alourdir la phrase.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Le terme désigne ici la personne intérieure de Job. Le conserver dans les deux occurrences maintient la reprise expressive de l’hébreu.
- source_word: בְּחַיָּי
  choice: ma vie
  rationale: Dans cette construction, le syntagme désigne la vie de Job comme objet de son aversion.
- source_word: אֶעֶזְבָה עָלַי שִׂיחִי
  choice: je laisserai libre cours à ma plainte
  rationale: Cette tournure idiomatique indique que Job ne retiendra plus sa lamentation. La formulation française rend naturellement l’idée de relâcher toute contrainte.
- source_word: אֲדַבְּרָה
  choice: je parlerai
  rationale: La forme cohortative exprime ici une résolution ferme, bien rendue par le futur français.
- source_word: בְּמַר נַפְשִׁי
  choice: dans l’amertume de mon âme
  rationale: La préposition situe la parole de Job dans son état d’amertume, tandis que la traduction conserve l’image et la cohésion lexicale du verset.
