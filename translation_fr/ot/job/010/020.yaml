  source_fidelity: La question rhétorique « Mes jours ne sont-ils pas peu nombreux ? » rend fidèlement הֲלֹא מְעַט יָמָי. « Cesse et laisse-moi tranquille » conserve, comme le fait la piste anglaise, les deux verbes resserrés יחדל / ישית ממני sans expliciter le sujet implicite. Pour וְאַבְלִיגָה, « retrouve ... de sérénité » est possible par le contexte, mais « retrouve » présuppose un état antérieur et « sérénité » restreint indûment un verbe qui évoque plus largement un bref réconfort ou un regain de cœur.
