source:
  edition: WLC
  text: הֲ/לֹא מְעַ֣ט יָמַ֣/י יחדל ישית מִ֝מֶּ֗/נִּי וְ/אַבְלִ֥יגָה מְּעָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/020.yaml
  text: Are not my days few? Then cease and leave me alone[a], so that I may brighten up a little[b],
translation:
  language: fr
  text: Mes jours ne sont-ils pas peu nombreux ? Alors, cesse et laisse-moi tranquille[a], pour que je reprenne un peu courage[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « détourne-toi de moi » ou « retire-toi de moi ». L’expression hébraïque, qui associe « cesser » et « se retirer de moi », est concise et idiomatique.
    reason: alternative_reading
  - marker: b
    text: Ou « pour que je retrouve un peu de sérénité » ou « pour que j’aie un peu de répit ». Le verbe peut évoquer un bref allègement, un regain de courage ou un retour au calme.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: ne… pas ?
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative ; la tournure négative française en conserve la force.
- source_word: מְעַט יָמַי
  choice: mes jours… peu nombreux
  rationale: מְעַט qualifie ici les jours par leur petit nombre et, dans le contexte, la brièveté de la vie qui reste à Job.
- source_word: יחדל ישית מִמֶּנִּי
  choice: cesse et laisse-moi tranquille
  rationale: La formulation hébraïque est compacte et difficile. « Cesse » représente le premier verbe, tandis que « laisse-moi tranquille » rend idiomatiquement l’idée de se retirer de Job ou de détourner de lui son action.
- source_word: וְאַבְלִיגָה
  choice: pour que je retrouve… de sérénité
  rationale: Le verbe בלג évoque un bref allègement, un retour au calme ou un regain de courage ; « retrouver de la sérénité » exprime naturellement ce soulagement intérieur sans en faire nécessairement un rétablissement physique.
- source_word: מְעָט
  choice: un peu
  rationale: Employé adverbialement, le terme indique ici une faible mesure ou une courte durée de soulagement.
theological_decisions:
- issue: Sujet implicite de l’appel
  choice: Conserver l’impératif sans nommer Dieu
  alternative: « Ô Dieu, cesse… »
  rationale: Le contexte montre que Job s’adresse à Dieu, mais son nom n’apparaît pas dans ce verset ; ne pas l’ajouter respecte la forme resserrée de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est conservée, ainsi que la formulation abrupte de la supplication. La virgule finale est maintenue parce que le verset se poursuit syntaxiquement au verset suivant.
