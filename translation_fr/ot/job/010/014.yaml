id: JOB.10.14
reference: Job 10:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם חָטָ֥אתִי וּ/שְׁמַרְתָּ֑/נִי וּ֝/מֵ/עֲוֺנִ֗/י לֹ֣א תְנַקֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/014.yaml
  text: If I sin[a], you watch me[b], and you will not acquit me of my iniquity.
translation:
  language: fr
  text: Si je pèche[a], tu me surveilles[b] et tu ne m’acquittes pas de ma faute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si j’ai péché » ; le verbe hébreu peut présenter l’action comme accomplie.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « surveiller » évoque un examen attentif, non une garde protectrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit naturellement une proposition conditionnelle et préserve l’ambiguïté entre une hypothèse ponctuelle et une situation générale.
- source_word: חָטָאתִי
  choice: je pèche
  rationale: Le parfait qal à la première personne peut, dans cette construction conditionnelle, exprimer le cas envisagé de manière générale. Le présent français est naturel sans imposer un acte passé précis.
- source_word: וּשְׁמַרְתָּנִי
  choice: tu me surveilles
  rationale: Dans ce contexte accusatoire, שׁמר désigne une observation étroite plutôt qu’une garde protectrice. « Surveiller » rend clairement cette nuance.
- source_word: וּמֵעֲוֺנִי
  choice: de ma faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou sa conséquence. « Faute » conserve ici la dimension morale tout en restant naturel en français courant.
- source_word: לֹא תְנַקֵּנִי
  choice: tu ne m’acquittes pas
  rationale: 'Le piel de נקה a ici un sens judiciaire : déclarer innocent ou dégager de la culpabilité. « Acquitter » convient au caractère quasi judiciaire de la plainte.'
theological_decisions:
- issue: Sens judiciaire ou purificatoire de נקה
  choice: 'Sens judiciaire : « tu ne m’acquittes pas »'
  alternative: 'Sens purificatoire : « tu ne me purifies pas » ; sens pénal : « tu ne me laisses pas impuni »'
  rationale: Le contexte présente Dieu comme examinant la conduite de Job et refusant de le déclarer quitte. Le sens judiciaire préserve la tension de sa plainte sans introduire une catégorie rituelle étrangère au passage.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond au discours direct de Job à Dieu. « Surveilles » exprime la scrutiny hostile ou judiciaire du contexte ; « faute » est plus idiomatique que « iniquité » tout en conservant la portée morale.
