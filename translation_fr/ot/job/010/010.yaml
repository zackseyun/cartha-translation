  yaml_path: translation/ot/job/010/010.yaml
  text: Did you not pour me out like milk and curdle me like cheese?[a]
translation:
  language: fr
  text: Ne m’as-tu pas versé comme du lait et fait cailler comme du fromage ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait coaguler comme du lait caillé ». Le nom hébreu peut désigner plus précisément du fromage ou, plus généralement, un produit laitier caillé.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Ne m’as-tu pas
  rationale: Introduit une question rhétorique appelant une réponse affirmative ; cette tournure française en conserve naturellement la force.
- source_word: כֶחָלָב
  choice: comme du lait
  rationale: Le préfixe כ marque la comparaison ; « comme du lait » rend clairement l’image.
- source_word: תַּתִּיכֵנִי
  choice: versé
  rationale: Le hiphil de נתך évoque ici l’action de verser un liquide ; ce choix s’accorde avec l’image embryologique du lait.
- source_word: וְכַגְּבִנָּה
  choice: comme du fromage
  rationale: גְּבִנָּה désigne du fromage ou un produit laitier caillé ; « fromage » est le sens lexical simple et maintient le parallèle.
- source_word: תַּקְפִּיאַנִי
  choice: fait cailler
  rationale: Le hiphil de קפא exprime le fait de provoquer l’épaississement ou la coagulation ; « faire cailler » est idiomatique en français dans ce contexte laitier.
