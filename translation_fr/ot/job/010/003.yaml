  text: הֲ/ט֤וֹב לְ/ךָ֨ כִּֽי תַעֲשֹׁ֗ק כִּֽי תִ֭מְאַס יְגִ֣יעַ כַּפֶּ֑י/ךָ וְ/עַל עֲצַ֖ת רְשָׁעִ֣ים הוֹפָֽעְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/003.yaml
  text: Is it good for you that you oppress[a], that you despise the work of your hands, and shine upon the counsel of the wicked?
translation:
  language: fr
  text: Est-il bon pour toi d’opprimer, de mépriser l’œuvre de tes mains et de resplendir sur les projets des méchants[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « resplendir sur ». Dans ce contexte, l’expression peut suggérer que Dieu favorise les projets des méchants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב לְךָ
  choice: Est-il bon pour toi
  rationale: Conserve la forme directe de la question rhétorique et l’idée de ce qui serait bon ou avantageux pour Dieu, sans l’interpréter comme une simple question de plaisir.
- source_word: תַעֲשֹׁק
  choice: d’opprimer
  rationale: Le verbe désigne couramment l’oppression ou le fait de léser quelqu’un; « opprimer » maintient la force de l’accusation de Job.
- source_word: תִמְאַס
  choice: de mépriser
  rationale: Le verbe exprime un rejet teinté de dédain; « mépriser » en restitue les deux dimensions.
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: l’œuvre de tes mains
  rationale: Cette formulation française naturelle désigne ici le produit du travail des mains de Dieu, c’est-à-dire sa créature.
- source_word: עֲצַת רְשָׁעִים
  choice: les projets des méchants
  rationale: עֵצָה peut désigner un conseil, un dessein ou un projet. Dans ce contexte, « projets » exprime naturellement ce que les méchants conçoivent ou poursuivent, tout en maintenant la portée collective du pluriel.
- source_word: הוֹפָעְתָּ
  choice: faire briller ta faveur sur
  rationale: Le hiphil de יפע évoque littéralement le fait de resplendir ou de faire paraître avec éclat. Cette tournure conserve l’image lumineuse tout en rendant intelligible sa valeur probable de regard favorable.
theological_decisions:
- issue: Accusation anthropomorphique adressée à Dieu
  choice: Maintenir la question directe et les verbes accusateurs de Job
  alternative: « Semble-t-il bon pour toi de faire comme si tu opprimais… »
  rationale: L’hébreu ne prend aucune précaution pour atténuer les paroles de Job. La traduction conserve donc la tension du discours sans transformer l’accusation en simple apparence.
- issue: Sens de la lumière dirigée vers les projets des méchants
  choice: Conserver l’image de l’éclat en explicitant sa connotation favorable
  alternative: « favoriser les projets des méchants »
  rationale: Le verbe garde une métaphore de rayonnement, mais le contexte suggère une manifestation favorable. La formulation retenue préserve ces deux aspects sans réduire le texte à une seule paraphrase.
translation_notes:
  register: Français moderne, digne et direct. La structure en trois infinitifs préserve la progression rhétorique. « Faire briller ta faveur » rend la métaphore hébraïque compréhensible sans adoucir la contestation de Job.
