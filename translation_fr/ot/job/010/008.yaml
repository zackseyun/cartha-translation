id: JOB.10.8
reference: Job 10:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָדֶ֣י/ךָ עִ֭צְּבוּ/נִי וַֽ/יַּעֲשׂ֑וּ/נִי יַ֥חַד סָ֝בִ֗יב וַֽ/תְּבַלְּעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/008.yaml
  text: Your hands shaped me and made me[a], together all around[c][b]; yet you swallow me up.
translation:
  language: fr
  text: Tes mains m’ont façonné et m’ont fait, tout entier, de toutes parts[a] ; pourtant, tu m’engloutis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « ensemble, tout autour » : l’expression souligne que Dieu a façonné Job tout entier, de toutes parts.'
    reason: cultural_note
  - marker: b
    text: Ou « tu me détruis ». L’hébreu dit littéralement « tu m’engloutis », image saisissante de la destruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶיךָ
  choice: Tes mains
  rationale: Le pluriel hébreu avec suffixe de deuxième personne du masculin singulier est conservé ; l’image exprime l’action créatrice personnelle de Dieu.
- source_word: עִצְּבוּנִי
  choice: m’ont façonné
  rationale: Au piel, עצב désigne ici l’action de donner forme. « Façonner » garde la nuance artisanale et convient au parallèle avec « faire ».
- source_word: וַיַּעֲשׂוּנִי
  choice: et m’ont fait
  rationale: עשה est le verbe courant pour « faire ». La formulation préserve le parallélisme et l’effet cumulatif des deux verbes de création.
- source_word: יַחַד סָבִיב
  choice: tout entier, de toutes parts
  rationale: La combinaison exprime vraisemblablement la totalité et le caractère complet de la formation de Job. Cette tournure française naturelle conserve à la fois l’intensité de יחד et la dimension spatiale de סביב.
- source_word: וַתְּבַלְּעֵנִי
  choice: pourtant, tu m’engloutis
  rationale: בלע signifie littéralement « engloutir, avaler » et sert ici de métaphore vive de la destruction. « Pourtant » rend le contraste contextuel entre création et destruction, bien que le waw soit en lui-même polyvalent.
theological_decisions:
- issue: Langage anthropomorphique appliqué à la création divine
  choice: Conserver « Tes mains » ainsi que les deux verbes concrets « façonné » et « fait ».
  alternative: « Tu m’as créé » ou « Tu as formé mon corps ».
  rationale: La plainte de Job invoque le travail personnel et minutieux de Dieu. Généraliser en « créer » atténuerait la force corporelle et artisanale de l’image hébraïque.
- issue: Tension entre l’œuvre créatrice de Dieu et son action destructrice
  choice: 'Maintenir le contraste abrupt : « pourtant, tu m’engloutis ».'
  alternative: « et maintenant tu me détruis » ou « pour ensuite me détruire ».
  rationale: Le texte juxtapose intentionnellement la formation de Job et son engloutissement apparent par Dieu. Il faut préserver cette tension sans l’expliquer ni la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe à Dieu. « Façonner » préserve l’image de l’artisan ; le point-virgule met en relief le contraste sans l’exagérer.
