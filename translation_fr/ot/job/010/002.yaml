    issue: Restriction indue de תְּרִיבֵנִי à une action en justice formelle
    rationale: Le parallélisme avec « déclarer coupable » autorise une résonance judiciaire, mais ריב ne demande pas nécessairement qu’un procès soit explicitement engagé. Le texte principal doit éviter de trancher cette ambiguïté.
  - severity: low
    issue: Alternative française peu idiomatique dans la note b
    rationale: « Contester avec moi » est calqué sur une structure possible en anglais, mais ne correspond pas à l’usage moderne le plus naturel. « Me prendre à partie » ou « entrer en conflit avec moi » est préférable.
