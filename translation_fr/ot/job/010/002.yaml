  yaml_path: translation/ot/job/010/002.yaml
  text: I will say to God[a], ‘Do not condemn me[b]; let me know why you contend with me.’
translation:
  language: fr
  text: 'Je dirai à Dieu : « Ne me déclare pas coupable[a] ! Fais-moi savoir pourquoi tu me prends à partie[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne me condamne pas ». Le verbe hébreu relève du langage judiciaire et signifie déclarer quelqu’un coupable.
    reason: lexical_alternative
  - marker: b
    text: Ou « pourquoi tu entres en conflit avec moi » ou « pourquoi tu me fais un procès ». Le verbe peut évoquer une contestation ou une action en justice.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Je dirai
  rationale: L’imparfait qal à la première personne peut exprimer ici l’intention ou une parole prochaine. « Je dirai » conserve cette orientation sans surinterpréter.
- source_word: אֶל אֱלוֹהַּ
  choice: à Dieu
  rationale: אֱלוֹהַּ est un titre divin singulier fréquent dans Job ; « Dieu » est l’équivalent français naturel.
- source_word: אַל תַּרְשִׁיעֵנִי
  choice: Ne me déclare pas coupable
  rationale: 'Le hiphil de רשע possède un sens judiciaire : déclarer quelqu’un coupable. Cette formulation rend cette nuance plus précisément que le seul verbe « condamner ».'
- source_word: הוֹדִיעֵנִי
  choice: Fais-moi savoir
  rationale: L’impératif hiphil de ידע signifie faire connaître ou informer. « Fais-moi savoir » conserve la valeur causative tout en restant naturel.
- source_word: עַל מַה
  choice: pourquoi
  rationale: Dans cette interrogation, l’expression demande le motif ou le fondement de l’action.
- source_word: תְּרִיבֵנִי
  choice: tu engages un procès contre moi
  rationale: Le verbe ריב peut désigner une contestation ou une action en justice. Dans le parallélisme avec « déclarer coupable », la formulation judiciaire est naturelle, tandis qu’une note préserve le sens plus large.
theological_decisions:
- issue: Nuance judiciaire de la plainte de Job adressée à Dieu
  choice: « Ne me déclare pas coupable » et « tu engages un procès contre moi »
  alternative: « Ne me condamne pas » et « tu contestes avec moi »
  rationale: Le verset présente la relation conflictuelle en termes judiciaires. La traduction maintient cette tension sans développer une doctrine systématique du jugement divin ni préciser les motifs que le texte laisse inexpliqués.
translation_notes:
  register: Français international moderne, direct et digne. Le discours adressé à Dieu emploie le tutoiement, conforme au registre biblique français courant. Les termes judiciaires rendent le champ lexical hébreu, et les notes conservent l’amplitude sémantique de רשע et ריב.
