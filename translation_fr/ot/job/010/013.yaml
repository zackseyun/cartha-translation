source:
  edition: WLC
  text: וְ֭/אֵלֶּה צָפַ֣נְתָּ בִ/לְבָבֶ֑/ךָ יָ֝דַ֗עְתִּי כִּי זֹ֥את עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/013.yaml
  text: Yet these things you hid in your heart[b][a]; I knew that this was with you.
translation:
  language: fr
  text: Pourtant, tu avais caché ces choses dans ton cœur[a] ; je savais que cela était en toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu avais mis ces choses en réserve dans ton cœur ». Le verbe hébreu peut signifier « cacher », « mettre en réserve » ou « garder ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « cela était avec toi ». Cette expression peut évoquer ce qui se trouvait dans la pensée de Dieu ou appartenait à son dessein caché.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Pourtant, ces choses
  rationale: La conjonction וְ peut signifier simplement « et », mais le contexte marque un contraste avec les bienfaits évoqués au verset précédent. « Pourtant » exprime naturellement cette nuance sans préciser excessivement le lien logique.
- source_word: צָפַנְתָּ
  choice: tu avais caché
  rationale: Le verbe צפן peut signifier cacher, mettre en réserve ou conserver. Le plus-que-parfait situe en français ce dessein caché par rapport au constat de Job, tandis que « caché » maintient l'idée centrale de dissimulation.
- source_word: בִלְבָבֶךָ
  choice: dans ton cœur
  rationale: לֵבָב désigne le cœur comme siège de la pensée, de la volonté et de l'intention. L'expression française conserve l'image anthropologique de l'hébreu.
- source_word: יָדַעְתִּי
  choice: je savais
  rationale: Le qatal à la première personne exprime ici un savoir que Job présente comme acquis. L'imparfait français est idiomatique après le plus-que-parfait et rend l'état de connaissance sans suggérer une découverte soudaine.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce que Job savait ; « que » est donc le complémentiseur français naturel.
- source_word: זֹאת
  choice: cela
  rationale: Le démonstratif féminin singulier reprend de façon globale et peu définie ce qui vient d'être mentionné. « Cela » préserve cette référence comprimée sans l'expliciter en « projet » ou « intention ».
- source_word: עִמָּךְ
  choice: était en toi
  rationale: Littéralement « était avec toi ». En français, « était en toi » exprime plus naturellement qu'une chose résidait dans la pensée ou le dessein de Dieu, tout en maintenant l'indétermination du référent.
theological_decisions:
- issue: Nature du dessein caché de Dieu dans la plainte de Job
  choice: Conserver l'ambiguïté de « ces choses » et de « cela », en présentant la parole de Job comme l'affirmation d'une intention divine restée cachée.
  alternative: Identifier explicitement « cela » au projet secret de Dieu de faire souffrir Job, ou rattacher uniquement « ces choses » aux bienfaits du verset précédent.
  rationale: L'hébreu ne définit pas explicitement le référent. La traduction garde donc la tension théologique de la plainte de Job sans transformer son accusation en affirmation doctrinale plus précise que le texte.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond à l'adresse directe de Job à Dieu. Le parallélisme et les métaphores du « cœur » sont conservés, tandis que les notes signalent les principales ambiguïtés lexicales et idiomatiques.
