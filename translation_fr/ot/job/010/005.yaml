id: JOB.10.5
reference: Job 10:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/כִ/ימֵ֣י אֱנ֣וֹשׁ יָמֶ֑י/ךָ אִם שְׁ֝נוֹתֶ֗י/ךָ כִּ֣/ימֵי גָֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/005.yaml
  text: Are your days like the days of man[b][a], or your years like the days of a mighty man?
translation:
  language: fr
  text: 'Tes jours sont-ils comme ceux d’un mortel[a],

    ou tes années comme celles d’un homme vigoureux[b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu אֱנוֹשׁ peut aussi être traduit par « homme » ou « être humain »; il évoque parfois la fragilité humaine.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu גָבֶר peut aussi être traduit simplement par « homme » ou par « homme fort »; « homme vigoureux » maintient ici la distinction avec le terme du premier vers.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִימֵי
  choice: Tes jours sont-ils comme ceux de
  rationale: L’interrogatif הֲ, le comparatif כ et ימי forment une question rhétorique comparative. Cette tournure est naturelle en français et conserve la structure du vers.
- source_word: אֱנוֹשׁ
  choice: un mortel
  rationale: אֱנוֹשׁ désigne l’être humain avec une possible nuance de fragilité et de mortalité. « Un mortel » exprime cette nuance tout en convenant au contraste entre la durée humaine et celle de Dieu.
- source_word: יָמֶיךָ
  choice: tes jours
  rationale: Traduction directe du pluriel muni du suffixe de deuxième personne masculine singulière, Dieu étant ici interpellé.
- source_word: אִם
  choice: ou
  rationale: Dans le parallélisme poétique, אִם introduit le second terme de la question plutôt qu’une proposition conditionnelle.
- source_word: שְׁנוֹתֶיךָ
  choice: tes années
  rationale: Traduction directe, en parallèle avec « tes jours ».
- source_word: כִּימֵי
  choice: comme celles de
  rationale: Le comparatif est rendu comme dans le premier membre; « celles » reprend naturellement « années » en français.
- source_word: גָבֶר
  choice: un homme vigoureux
  rationale: גָבֶר peut désigner un homme en soulignant sa force ou sa vigueur. « Homme vigoureux » préserve sa distinction avec אֱנוֹשׁ sans préciser excessivement « guerrier ».
theological_decisions:
- issue: La comparaison entre la durée de Dieu et celle des humains
  choice: Conserver la question rhétorique sans expliciter son implication
  alternative: Paraphraser en affirmant que Dieu n’a pas une durée de vie humaine
  rationale: L’hébreu formule une interrogation qui nourrit l’argument de Job; l’expliciter supprimerait une part de sa force poétique et de sa tension.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est conservé sur deux lignes; le tutoiement correspond à l’adresse directe de Job à Dieu.
