  text: כַּ/אֲשֶׁ֣ר לֹא הָיִ֣יתִי אֶהְיֶ֑ה מִ֝/בֶּ֗טֶן לַ/קֶּ֥בֶר אוּבָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/019.yaml
  text: I would have been as though I had not been[b][a]; from the womb I would have been carried to the grave.
translation:
  language: fr
  text: J’aurais été comme si je n’avais pas existé[a] ; du ventre maternel, j’aurais été porté au tombeau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’aurais été comme si je n’avais pas été. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « du ventre maternel au tombeau, j’aurais été porté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: comme si
  rationale: Dans ce contexte, la particule introduit une comparaison avec une situation irréelle. « Comme si » exprime naturellement cette valeur contrefactuelle en français.
- source_word: לֹא הָיִיתִי אֶהְיֶה
  choice: Je serais comme si je n’avais jamais existé
  rationale: La succession des formes de היה décrit ici, dans le contexte du souhait de Job, une situation irréelle. Cette formulation française rend clairement l’idée d’une existence assimilée à la non-existence sans imposer une lecture temporelle littérale.
- source_word: מִבֶּטֶן
  choice: du ventre maternel
  rationale: Ce choix conserve l’image concrète du ventre tout en étant plus clair en français moderne que le seul « du ventre ».
- source_word: לַקֶּבֶר
  choice: au tombeau
  rationale: קבר désigne la tombe ou le lieu d’ensevelissement, et non le séjour des morts. « Tombeau » convient au registre poétique et funéraire du passage.
- source_word: אוּבָל
  choice: j’aurais été porté
  rationale: Le hophal de יבל exprime le fait d’être conduit ou transporté. « Porté » préserve la voix passive et l’image d’un nouveau-né emmené pour être enseveli.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le vers conserve le parallélisme poétique et le caractère contrefactuel du souhait de Job. « Directement » explicite dans le texte courant le trajet sans vie intermédiaire suggéré par « du ventre au tombeau » ; la note donne la structure hébraïque littérale.
