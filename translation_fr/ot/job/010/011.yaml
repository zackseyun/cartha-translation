  text: You clothed me with skin and flesh[a], and wove me together with bones and sinews.
translation:
  language: fr
  text: Tu m’as revêtu de peau et de chair, et tu m’as entouré d’os et de tendons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu m’as enveloppé d’os et de tendons » ; le verbe hébreu peut aussi évoquer l’idée de tresser ou de tisser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: peau
  rationale: Dans ce contexte décrivant le corps humain, « peau » est le terme direct et naturel.
- source_word: בָשָׂר
  choice: chair
  rationale: « Chair » désigne concrètement les tissus du corps et maintient le parallélisme poétique avec « peau ».
- source_word: תַּלְבִּישֵׁנִי
  choice: tu m’as revêtu
  rationale: Le hiphil de לבש signifie « vêtir, revêtir ». « Revêtu » conserve la métaphore d’un corps habillé de peau et de chair dans un registre poétique actuel.
- source_word: בַעֲצָמוֹת
  choice: d’os
  rationale: La préposition ב exprime ici la matière ou le moyen. La tournure « tissé d’os » rend cette relation avec concision en français.
- source_word: גִידִים
  choice: tendons
  rationale: Le mot désigne les tissus fibreux reliant les parties du corps. « Tendons » est précis, courant et plus immédiatement compréhensible aujourd’hui que « nerfs » dans cet emploi ancien ou « ligaments », plus spécialisé.
- source_word: תְּסֹכְכֵנִי
  choice: tu m’as tissé
  rationale: Le verbe סכך peut évoquer l’action de couvrir, d’entourer ou d’entrelacer. « Tissé » exprime ici poétiquement la formation cohérente du corps, tout en signalant en note l’autre sens possible.
theological_decisions:
- issue: Image anthropologique de la formation divine
  choice: Présenter le verset comme une évocation poétique de la manière dont Dieu a formé le corps de Job.
  alternative: Insister sur l’idée que les os et les tendons couvrent ou enferment Job.
  rationale: Le contexte immédiat décrit la formation corporelle de Job. La traduction conserve cette image sans ajouter de précision doctrinale étrangère au texte.
- issue: Ambiguïté du verbe תְּסֹכְכֵנִי
  choice: « tu m’as tissé » dans le texte, avec « tu m’as enveloppé » en note
  alternative: « tu m’as enveloppé » dans le texte principal
  rationale: Le contexte de formation corporelle soutient l’image du tissage, mais le sens de couverture ou d’enveloppement est lexicalement authentique et doit rester visible.
translation_notes:
  register: Français international moderne, sobre et poétique. « Revêtu » et « tissé » maintiennent les deux métaphores corporelles de l’hébreu sans archaïsme excessif; la note préserve l’ambiguïté lexicale du second verbe.
