  source_fidelity: La première proposition rend fidèlement l’interrogation et le hifil (« m’as-tu fait sortir »). La seconde exprime correctement la valeur contrefactuelle vraisemblable des inaccomplis dans le contexte. Toutefois, « sans qu’aucun regard se pose sur moi » reformule l’image explicite de l’« œil » qui voit et transforme la coordination hébraïque en subordonnée de manière plus interprétative.
