  text: וְ/לָ֣/מָּה מֵ֭/רֶחֶם הֹצֵאתָ֑/נִי אֶ֝גְוַ֗ע וְ/עַ֣יִן לֹא תִרְאֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/018.yaml
  text: Why[a], then, did you bring me out from the womb? I should have died, and no eye would have seen me.
translation:
  language: fr
  text: Pourquoi donc m’as-tu fait sortir du ventre maternel ? Je serais mort, et aucun œil ne m’aurait vu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je mourrais, et aucun œil ne me verrait. » Les formes verbales hébraïques peuvent être traduites de façon plus formelle ; le contexte favorise toutefois le sens irréel : Job évoque ce qui serait arrivé s’il n’avait pas été mis au monde.'
    reason: ambiguïté grammaticale
lexical_decisions:
- source_word: וְלָמָה
  choice: Pourquoi donc
  rationale: « Pourquoi » rend l’interrogation, et « donc » exprime naturellement le lien avec la plainte précédente porté par la conjonction.
- source_word: מֵרֶחֶם
  choice: du ventre maternel
  rationale: Cette formulation actuelle conserve l’image concrète du lieu d’où l’enfant sort à la naissance.
- source_word: הֹצֵאתָנִי
  choice: m’as-tu fait sortir
  rationale: Le hifil de יצא exprime ici le fait de faire sortir, c’est-à-dire de faire naître, tout en conservant l’adresse directe à Dieu.
- source_word: אֶגְוַע
  choice: J’aurais expiré
  rationale: Dans ce contexte de lamentation, l’inaccompli exprime vraisemblablement une conséquence irréelle souhaitée. « Expirer » rend le verbe גוע, qui désigne la mort.
- source_word: וְעַיִן לֹא תִרְאֵנִי
  choice: sans qu’aucun regard se pose sur moi
  rationale: L’œil désigne par métonymie celui qui voit. La tournure française restitue naturellement l’idée que personne ne l’aurait vu, sans perdre l’image du regard.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation garde le caractère abrupt de la plainte de Job et l’adresse directe à Dieu. « Ventre maternel » évite l’ambiguïté moderne de « sein » ; la note préserve l’ambiguïté modale des inaccomplis hébreux.
