  text: חַיִּ֣ים וָ֭/חֶסֶד עָשִׂ֣יתָ עִמָּדִ֑/י וּ֝/פְקֻדָּתְ/ךָ֗ שָֽׁמְרָ֥ה רוּחִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/012.yaml
  text: You have granted me life and steadfast love[b][a], and your care has preserved my spirit.
translation:
  language: fr
  text: Tu m’as accordé la vie et ton amour fidèle, et ta sollicitude[a] a préservé mon esprit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ta visite a préservé mon esprit » ; ou « ton attention vigilante a préservé mon esprit ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « mon souffle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִּים
  choice: la vie
  rationale: Bien que le nom soit morphologiquement pluriel, il désigne couramment la vie comme réalité globale; le singulier est naturel en français.
- source_word: וָחֶסֶד
  choice: ton amour fidèle
  rationale: חֶסֶד exprime ici la bonté durable et loyale de Dieu. « Amour fidèle » en conserve la richesse sans imposer un sens exclusivement contractuel ou confessionnel.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: tu m’as accordé
  rationale: L’expression signifie littéralement « tu as fait avec moi », mais elle décrit ici l’octroi bienveillant de la vie et de l’amour fidèle. « Tu m’as accordé » rend clairement cette valeur bénéficiaire.
- source_word: וּפְקֻדָּתְךָ
  choice: ta sollicitude
  rationale: פְקֻדָּה peut désigner une attention vigilante, une surveillance ou une intervention. Dans ce contexte de préservation, « sollicitude » exprime naturellement une attention active et bienveillante tout en laissant les autres nuances en note.
- source_word: שָׁמְרָה
  choice: a préservé
  rationale: Le verbe signifie garder, protéger ou conserver. « A préservé » convient au maintien de l’esprit ou du souffle de Job.
- source_word: רוּחִי
  choice: mon esprit
  rationale: רוּחַ peut désigner l’esprit ou le souffle. « Mon esprit » rend bien ici la vie intérieure soutenue par Dieu, tandis que « mon souffle » demeure une possibilité réelle signalée en note.
theological_decisions:
- issue: Nuance de חֶסֶד appliqué à Dieu
  choice: amour fidèle
  alternative: bonté; miséricorde; loyauté d’alliance
  rationale: « Amour fidèle » maintient la dimension de bonté constante et loyale sans réduire le terme à la seule compassion ni introduire une formulation doctrinale plus précise que le texte.
- issue: Sens de פְקֻדָּה
  choice: sollicitude divine attentive
  alternative: vigilance; intervention; visitation
  rationale: Le fait que cette פְקֻדָּה préserve l’esprit de Job favorise un sens positif d’attention vigilante. Une note conserve les autres nuances lexicales possibles sans transformer le terme en notion doctrinale de providence.
- issue: Sens de רוּחִי
  choice: mon esprit
  alternative: mon souffle
  rationale: Le contexte permet de comprendre רוּחַ comme l’esprit ou comme le souffle vital. Le texte principal retient « esprit », mais la note préserve explicitement l’ambiguïté anthropologique.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’adresse directe à Dieu. La phrase conserve le parallélisme entre les dons de Dieu et son action préservatrice; les notes maintiennent les ambiguïtés de פְקֻדָּה et de רוּחַ.
