id: JOB.10.7
reference: Job 10:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַֽל דַּ֭עְתְּ/ךָ כִּי לֹ֣א אֶרְשָׁ֑ע וְ/אֵ֖ין מִ/יָּדְ/ךָ֣ מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/007.yaml
  text: Though you know that I am not wicked[b][a], there is no one who can deliver from your hand.
translation:
  language: fr
  text: Bien que tu saches que je ne suis pas méchant[a], personne ne peut me délivrer de ta main[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « je ne suis pas coupable ». L’hébreu dit littéralement « je ne suis pas méchant » : Job nie être un homme méchant, sans nécessairement prétendre être absolument sans péché.'
    reason: lexical_alternative
  - marker: b
    text: Dans la langue biblique, « la main » peut représenter la puissance ou l’emprise d’une personne.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דַּעְתְּךָ
  choice: Bien que tu saches
  rationale: L’expression introduit ici, avec une valeur concessive liée au contexte, ce que Dieu sait. Cette formulation est naturelle en français et conserve la plainte directe de Job.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce que Dieu sait; la nuance concessive est déjà portée par « Bien que ».
- source_word: לֹא אֶרְשָׁע
  choice: je ne suis pas méchant
  rationale: L’imparfait hébreu peut avoir ici une valeur stative. « Méchant » conserve le vocabulaire moral de רשע sans transformer la déclaration en affirmation d’une absence absolue de péché.
- source_word: וְאֵין
  choice: personne ne peut
  rationale: La construction existentielle nie la présence de tout libérateur. Cette tournure idiomatique française s’accorde naturellement avec le participe qui suit.
- source_word: מִיָּדְךָ
  choice: de ta main
  rationale: La traduction conserve l’image hébraïque de la main comme expression de la puissance ou de l’emprise.
- source_word: מַצִּיל
  choice: me délivrer
  rationale: Le participe hiphil désigne celui qui délivre. Le pronom « me », implicite dans le contexte où Job parle de sa propre situation, rend la phrase complète et naturelle en français sans modifier son référent.
theological_decisions:
- issue: La revendication d’innocence de Job devant Dieu
  choice: « je ne suis pas méchant »
  alternative: « je suis innocent » ou « je ne suis pas coupable »
  rationale: L’hébreu emploie רשע, « méchant », et non une formule affirmant explicitement une perfection morale absolue. La traduction maintient donc la tension entre la protestation de Job et la question plus large de la condition humaine.
translation_notes:
  register: Français international actuel, sobre et digne. Le tutoiement correspond à l’adresse directe de Job à Dieu. L’image de la « main » est conservée, tandis que le pronom « me », implicite en hébreu, assure une formulation française naturelle.
