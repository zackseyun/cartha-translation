base_translation:
  language: en
  yaml_path: translation/ot/job/010/016.yaml
  text: If I lift myself up[a], you hunt me like a lion[b], and again you show yourself wonderful against me.
translation:
  language: fr
  text: S’il se relève[a], tu me chasses comme un lion, et de nouveau tu agis contre moi de manière extraordinaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile et elliptique. On peut aussi comprendre : « Si je m’élève » ou « Si je suis exalté ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu te montres merveilleux contre moi ». Le verbe hébreu peut désigner une action extraordinaire ou merveilleuse, ici dans un contexte hostile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגְאֶה
  choice: S’il s’élève
  rationale: Le verbe גאה exprime l’idée de s’élever ou d’être exalté. La forme hébraïque est à la troisième personne du masculin singulier et son sujet reste implicite; cette traduction conserve cette ambiguïté sans imposer un « je » absent de la forme verbale.
- source_word: כַּשַּׁחַל
  choice: comme un lion
  rationale: שַׁחַל désigne un lion, avec une possible connotation de force ou de férocité. « Comme un lion » restitue simplement l’image.
- source_word: תְּצוּדֵנִי
  choice: tu me chasses
  rationale: Le verbe צוד signifie chasser ou poursuivre une proie. « Tu me chasses » s’accorde naturellement avec l’image du lion.
- source_word: וְתָשֹׁב
  choice: et de nouveau
  rationale: Bien que שׁוב signifie littéralement « revenir », il marque ici la répétition de l’action; « de nouveau » en exprime clairement la valeur.
- source_word: תִּתְפַּלָּא
  choice: tu accomplis des choses extraordinaires
  rationale: La forme hitpael de פלא peut exprimer une action extraordinaire ou merveilleuse. Cette formulation française reste naturelle tout en préservant le caractère saisissant de l’action.
- source_word: בִי
  choice: contre moi
  rationale: Dans ce contexte conflictuel, la préposition ב désigne l’action dirigée contre Job; « contre moi » en rend la force contextuelle.
theological_decisions:
- issue: Le caractère extraordinaire de l’action divine dans un contexte hostile
  choice: tu accomplis contre moi des choses extraordinaires
  alternative: tu te montres merveilleux contre moi
  rationale: La traduction maintient la tension entre le caractère prodigieux de l’action divine et la souffrance que Job lui attribue. Elle n’en fait ni une œuvre bienveillante ni une simple attaque, tout en évitant en français une tournure artificielle.
translation_notes:
  register: Français moderne, international et digne. Le verset conserve l’ellipse du début et la tension troublante entre les actes extraordinaires de Dieu et leur orientation contre Job.
