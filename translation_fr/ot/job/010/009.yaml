  text: זְכָר נָ֭א כִּי כַ/חֹ֣מֶר עֲשִׂיתָ֑/נִי וְֽ/אֶל עָפָ֥ר תְּשִׁיבֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/009.yaml
  text: Remember[a], please, that you made me like clay[b], and will you return me to dust?
translation:
  language: fr
  text: Souviens-toi, je t’en prie, que tu m’as fait comme l’argile[a] ; et me ramèneras-tu à la poussière[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme l’argile ». L’expression hébraïque établit une comparaison ; elle ne dit pas explicitement « fait d’argile », même si elle évoque clairement le récit de la création.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et tu me ramèneras à la poussière ». La forme hébraïque peut être comprise comme une affirmation ou, dans le contexte, comme une question rhétorique.'
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר נָא
  choice: Souviens-toi, je t’en prie
  rationale: L’impératif זְכָר s’adresse directement à Dieu, tandis que נָא exprime ici une supplication polie. Cette formulation est naturelle en français moderne et conserve le ton de l’appel.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que Job demande à Dieu de se rappeler.
- source_word: כַחֹמֶר
  choice: semblable à l’argile
  rationale: Le préfixe כ־ marque une comparaison. Cette traduction préserve le caractère comparatif de l’hébreu sans transformer explicitement l’argile en matière d’origine.
- source_word: עֲשִׂיתָנִי
  choice: tu m’as fait
  rationale: Le verbe עשה signifie largement « faire ». Le choix français reste sobre et n’explicite pas davantage le façonnage suggéré par l’image.
- source_word: עָפָר
  choice: la poussière
  rationale: « Poussière » est le sens usuel dans ce contexte de création et de mortalité, avec un écho naturel au langage de la Genèse.
- source_word: תְּשִׁיבֵנִי
  choice: me ramèneras-tu
  rationale: Le hiphil de שוב exprime le fait de faire revenir ou de ramener. La forme interrogative rend en français la force probable de la protestation rhétorique.
theological_decisions:
- issue: La seconde proposition est-elle une affirmation ou une question rhétorique ?
  choice: 'Question rhétorique : « me ramèneras-tu à la poussière ? »'
  alternative: 'Affirmation : « tu me ramèneras à la poussière »'
  rationale: L’hébreu ne comporte pas de marque interrogative explicite et permet les deux lectures. Dans le contexte de la plainte de Job, la question rhétorique exprime bien son appel, sans effacer l’autre possibilité, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Je t’en prie » conserve la supplication sans archaïsme. Le point-virgule maintient le lien étroit entre la création de Job et son retour possible à la poussière.
