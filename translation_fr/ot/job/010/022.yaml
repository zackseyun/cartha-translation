  terminology: « Pays », « ténèbres », « obscurité profonde », « l’ombre de la mort » et « sans ordre » sont des équivalents solides et adaptés au français international moderne. La note lexicale est justifiée, mais son appel doit être placé sur « l’ombre de la mort », le terme qu’elle explique.
