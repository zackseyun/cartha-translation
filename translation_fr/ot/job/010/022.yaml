  text: a land of gloom[a], like deep darkness, of the shadow of death and without order, where it shines like deep darkness.
translation:
  language: fr
  text: 'Pays de ténèbres, comme l’obscurité profonde,

    d’ombre de la mort[a] et sans ordre,

    où elle brille comme l’obscurité profonde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’ombre profonde » pour « l’ombre de la mort » (צַלְמָוֶת) ; le terme hébreu peut désigner l’ombre de la mort ou, plus généralement, une obscurité très profonde.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: pays
  rationale: Dans ce contexte, Job décrit le séjour des morts comme une contrée; « pays » rend naturellement l’image spatiale.
- source_word: עֵיפָתָה
  choice: de ténèbres
  rationale: Le terme évoque une obscurité lugubre. « Ténèbres » convient au registre poétique et au champ lexical dominant du verset.
- source_word: כְּמוֹ אֹפֶל
  choice: pareil à l’obscurité profonde / comme l’obscurité profonde
  rationale: אֹפֶל désigne une obscurité épaisse ou profonde. La répétition française conserve celle de l’hébreu, avec une légère variation syntaxique naturelle.
- source_word: צַלְמָוֶת
  choice: l’ombre de la mort
  rationale: Cette traduction préserve l’association possible avec la mort et l’expression traditionnelle, sans exclure le sens plus général d’une ombre très profonde, signalé en note.
- source_word: וְלֹא סְדָרִים
  choice: où tout est sans ordre
  rationale: סְדָרִים renvoie à l’ordre ou à l’organisation; cette formulation exprime clairement le chaos du lieu.
- source_word: וַתֹּפַע
  choice: où même la lumière est
  rationale: Le verbe signifie « briller, resplendir ». La formulation rend intelligible en français le paradoxe selon lequel ce qui y tient lieu de lumière ressemble encore aux ténèbres, sans effacer cette tension.
theological_decisions:
- issue: Association de צַלְמָוֶת avec la mort ou avec une obscurité extrême
  choice: l’ombre de la mort
  alternative: l’ombre profonde
  rationale: Le contexte du séjour des morts rend l’association avec la mort pertinente, mais la polysémie du terme hébreu est conservée dans une note.
translation_notes:
  register: Français international moderne, poétique et digne. La reprise de « pays » structure le parallélisme. « Même la lumière » explicite légèrement le sujet implicite du verbe « briller » afin de conserver naturellement en français le paradoxe final.
