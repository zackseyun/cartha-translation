  text: He will flee from an iron weapon[b][a]; a bronze bow will pierce him through.
translation:
  language: fr
  text: Il fuira devant une arme de fer[a] ; un arc de bronze le transpercera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devant l’armement de fer ». Le mot hébreu peut désigner les armes de manière générale.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un arc de bronze passera à travers lui ». Le sens probable est que la flèche tirée par l’arc le transpercera.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְרַח
  choice: Il fuira
  rationale: Le qal inaccompli de ברח exprime ici, dans cette annonce poétique du jugement, une fuite envisagée dans l’avenir.
- source_word: מִנֵּשֶׁק בַּרְזֶל
  choice: devant une arme de fer
  rationale: נשק peut désigner une arme ou, plus largement, l’armement. « Arme de fer » conserve l’image et « fuir devant » est idiomatique en français.
- source_word: תַּחְלְפֵהוּ
  choice: le transpercera
  rationale: Le verbe חלף signifie fondamentalement passer ou traverser. Avec l’arc pour sujet dans ce contexte guerrier, il évoque la flèche qui traverse l’homme ; « transpercera » exprime naturellement ce sens implicite.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: un arc de bronze
  rationale: קשת désigne l’arc, et נחושה le bronze ou le cuivre ; « bronze » convient le mieux à cette image d’arme ancienne.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme poétique est conservé, tandis que « transpercera » rend explicite l’effet de l’arc suggéré par le verbe hébreu.
