  text: מוּסַ֣ר כְּלִמָּתִ֣/י אֶשְׁמָ֑ע וְ֝/ר֗וּחַ מִֽ/בִּינָתִ֥/י יַעֲנֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/003.yaml
  text: I hear a rebuke that shames me[b][a], and the spirit of my understanding answers me.
translation:
  language: fr
  text: J’entends un reproche qui m’humilie, et un esprit né de mon discernement me répond[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’esprit de mon discernement me répond » ; la préposition hébraïque peut aussi marquer un lien étroit avec le discernement, plutôt que la seule provenance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסַר
  choice: correction
  rationale: Le nom peut désigner la discipline, l’instruction ou la réprimande. Ici, « correction » exprime naturellement les paroles réprobatrices que Tsophar estime avoir entendues, tout en conservant une portée plus large que « reproche ».
- source_word: כְּלִמָּתִי
  choice: qui m’humilie
  rationale: La construction associe la correction à la honte ou à l’humiliation du locuteur. Une proposition relative est naturelle en français et rend clairement le suffixe de première personne.
- source_word: אֶשְׁמָע
  choice: J’entends
  rationale: 'Le présent convient au contexte immédiat : Tsophar réagit à ce qu’il vient d’entendre.'
- source_word: רוּחַ
  choice: l’esprit
  rationale: « Esprit » préserve l’image hébraïque d’un principe intérieur qui anime la réponse, sans la réduire d’emblée à la seule pensée.
- source_word: מִבִּינָתִי
  choice: issu de mon discernement
  rationale: La préposition מִן marque naturellement la provenance. « Issu de » conserve cette nuance et « discernement » rend בינה comme faculté de comprendre et de juger.
- source_word: יַעֲנֵנִי
  choice: me répond
  rationale: Le qal de ענה signifie normalement « répondre ». Avec le suffixe de première personne, la formulation directe « me répond » respecte la syntaxe tout en laissant en note la possibilité d’une impulsion à répondre.
