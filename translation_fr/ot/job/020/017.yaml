id: JOB.20.17
reference: Job 20:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל יֵ֥רֶא בִ/פְלַגּ֑וֹת נַהֲרֵ֥י נַ֝חֲלֵ֗י דְּבַ֣שׁ וְ/חֶמְאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/017.yaml
  text: He will not look upon streams[a], rivers flowing with honey and curds.
translation:
  language: fr
  text: Il ne verra pas les cours d’eau[a], les fleuves, les torrents de miel et de lait caillé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « les canaux, les fleuves, les oueds de miel et de lait caillé ».'
    reason: Les trois termes hébreux désignant des cours d’eau se recouvrent partiellement et peuvent être rendus de plusieurs manières.
lexical_decisions:
- source_word: אַל יֵרֶא
  choice: Il ne verra pas
  rationale: Dans ce contexte poétique décrivant le sort du méchant, אַל avec l’imparfait exprime naturellement une privation à venir plutôt qu’une interdiction. « Verra » conserve le sens concret de ראה sans expliciter davantage l’idée de jouissance.
- source_word: בִפְלַגּוֹת
  choice: les cours d’eau
  rationale: Le terme désigne des bras d’eau, canaux ou ruisseaux. « Cours d’eau » est naturel en français et garde une portée assez large; la préposition ב est rendue idiomatiquement dans la construction avec « voir ».
- source_word: נַהֲרֵי
  choice: les fleuves
  rationale: Le pluriel construit de נָהָר désigne des fleuves ou de grandes rivières. Un terme distinct maintient l’accumulation poétique de trois réalités aquatiques.
- source_word: נַחֲלֵי
  choice: les torrents
  rationale: נַחַל peut désigner un torrent, un ruisseau ou un oued. « Torrents » convient à l’image d’un écoulement abondant et reste distinct de « cours d’eau » et de « fleuves ».
- source_word: דְּבַשׁ
  choice: miel
  rationale: Équivalent français usuel, qui conserve l’image biblique d’abondance.
- source_word: וְחֶמְאָה
  choice: et de lait caillé
  rationale: חֶמְאָה peut désigner le lait caillé, la crème ou le beurre. « Lait caillé » évoque clairement un produit laitier pastoral sans suggérer nécessairement le beurre moderne.
theological_decisions:
- issue: Valeur de אַל avec l’imparfait
  choice: Déclaration négative concernant ce que le méchant ne verra pas
  alternative: 'Souhait ou imprécation: « Qu’il ne voie pas »'
  rationale: Le discours environnant annonce les conséquences qui atteindront le méchant. Le futur négatif français s’intègre mieux à cette série, tout en reconnaissant que la forme hébraïque peut avoir une nuance volitive.
translation_notes:
  register: Français international moderne, sobre et poétique. L’énumération de trois termes aquatiques est maintenue afin de ne supprimer aucun lexème hébreu. Le vocabulaire reste accessible, tandis que la note signale les principales variantes lexicales.
