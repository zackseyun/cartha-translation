source:
  edition: WLC
  text: עַ֭צְמוֹתָי/ו מָלְא֣וּ עלומ/ו וְ֝/עִמּ֗/וֹ עַל עָפָ֥ר תִּשְׁכָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/011.yaml
  text: His bones are full of his youthful vigor[a], but it will lie down with him in the dust.
translation:
  language: fr
  text: Ses os sont pleins de sa vigueur juvénile[a], mais elle se couchera avec lui dans la poussière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sa jeunesse » ; le terme hébreu peut désigner la jeunesse elle-même ou la vigueur qui lui est associée.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹתָיו
  choice: ses os
  rationale: Le pluriel de עֶצֶם avec suffixe masculin singulier désigne concrètement « ses os » et préserve l’image poétique hébraïque.
- source_word: מָלְאוּ
  choice: étaient pleins de
  rationale: Le qatal qal à la 3e personne du pluriel s’accorde avec « ses os » et décrit ici sa vigueur passée.
- source_word: עֲלוּמָיו
  choice: sa vigueur juvénile
  rationale: Le terme peut désigner la jeunesse elle-même ou la vigueur qui lui est associée. Cette formulation convient à l’image des os remplis de force tout en signalant l’alternative en note.
- source_word: וְעִמּוֹ
  choice: avec lui
  rationale: La préposition עִם avec suffixe exprime naturellement l’accompagnement jusque dans la mort.
- source_word: עַל־עָפָר
  choice: dans la poussière
  rationale: Bien que עַל signifie formellement « sur », « dans la poussière » rend naturellement en français l’image de la mort et de l’ensevelissement.
- source_word: תִּשְׁכָּב
  choice: elle se couchera
  rationale: Le qal inaccompli à la 3e personne du féminin singulier renvoie vraisemblablement à la jeunesse ou à la vigueur évoquée; le futur exprime son destin dans la poussière.
theological_decisions:
- issue: Antécédent du sujet féminin singulier de תִּשְׁכָּב
  choice: « elle », renvoyant à la vigueur juvénile
  alternative: Comprendre que la jeunesse elle-même descend avec lui dans la poussière
  rationale: L’hébreu laisse l’antécédent quelque peu implicite. Le féminin français reprend « vigueur » sans résoudre davantage la nuance entre jeunesse et force juvénile.
translation_notes:
  register: Français moderne, digne et poétique. « Se couchera avec lui dans la poussière » conserve la personnification et l’image funéraire du texte source.
