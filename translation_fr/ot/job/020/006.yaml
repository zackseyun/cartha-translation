  text: אִם יַעֲלֶ֣ה לַ/שָּׁמַ֣יִם שִׂיא֑/וֹ וְ֝/רֹאשׁ֗/וֹ לָ/עָ֥ב יַגִּֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/006.yaml
  text: Though his exaltation rises to the heavens[a], and his head reaches to the clouds[b],
translation:
  language: fr
  text: 'Même si sa hauteur monte jusqu’aux cieux[a]

    et que sa tête atteint les nuages,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Si sa hauteur monte jusqu’aux cieux ». L’hébreu peut introduire une simple condition (« si ») ou, dans ce contexte, une concession (« même si »). « Sa hauteur » peut aussi se comprendre comme « son élévation » ou « son exaltation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Même si
  rationale: Dans ce contexte poétique, אִם introduit vraisemblablement une hypothèse concessive; « même si » préserve toutefois sa forme conditionnelle et prépare naturellement la conséquence du verset suivant.
- source_word: יַעֲלֶה
  choice: monte
  rationale: Le qal imparfait de עלה exprime un mouvement ascendant; « monte » est direct, naturel et convient au parallélisme spatial.
- source_word: לַשָּׁמַיִם
  choice: jusqu’aux cieux
  rationale: « Jusqu’aux cieux » rend la limite extrême visée par ל et conserve la grandeur poétique du pluriel שׁמים.
- source_word: שִׂיאוֹ
  choice: son élévation
  rationale: שׂיא peut désigner la hauteur, l’élévation ou l’exaltation. « Élévation » maintient à la fois l’image verticale et une possible connotation de rang ou d’orgueil.
- source_word: וְרֹאשׁוֹ
  choice: et que sa tête
  rationale: « Sa tête » est le sens lexical direct et prolonge l’image d’une personne dressée à une hauteur immense.
- source_word: לָעָב
  choice: les nuages
  rationale: עָב désigne un nuage, souvent épais; le pluriel français est naturel dans cette image parallèle aux « cieux ».
- source_word: יַגִּיעַ
  choice: atteint
  rationale: Le verbe exprime ici le fait d’arriver jusqu’à une limite; « atteint » rend clairement cette portée spatiale.
theological_decisions:
- issue: Portée de l’élévation du méchant
  choice: Conserver « élévation », qui permet une lecture à la fois spatiale et figurée.
  alternative: « hauteur » pour une image surtout physique, ou « exaltation » pour insister sur le statut et l’orgueil.
  rationale: Le contexte concerne la grandeur passagère du méchant, mais le terme hébreu et le parallélisme avec la tête et les nuages ne permettent pas de réduire l’image à une seule dimension.
translation_notes:
  register: Français international moderne, poétique et digne. Le vers est formulé comme une proposition concessive qui se poursuit au verset suivant; « élévation » conserve l’ambiguïté entre hauteur visible et grandeur sociale ou orgueilleuse.
