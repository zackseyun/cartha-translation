source:
  edition: WLC
  text: הֲ/זֹ֣את יָ֭דַעְתָּ מִנִּי עַ֑ד מִנִּ֤י שִׂ֖ים אָדָ֣ם עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/004.yaml
  text: Have you known this from of old[a], since man was placed on the earth?
translation:
  language: fr
  text: Sais-tu cela depuis les temps anciens, depuis que l’être humain a été placé sur la terre ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲ/זֹאת
  choice: cela
  rationale: Le démonstratif introduit le contenu de la question rhétorique et renvoie probablement à l’affirmation développée au verset suivant. « Cela » est naturel en français et conserve cette valeur anaphorique ou cataphorique.
- source_word: יָדַעְתָּ
  choice: sais-tu
  rationale: Le parfait qal à la deuxième personne du masculin singulier, dans cette interrogation, exprime un savoir censé être acquis et durable. Le présent français rend naturellement la force rhétorique.
- source_word: מִנִּי עַד
  choice: depuis les temps anciens
  rationale: L’expression désigne une époque reculée. Cette formulation garde la portée temporelle sans suggérer abusivement l’éternité absolue que pourrait évoquer « depuis toujours ».
- source_word: מִנִּי שִׂים
  choice: depuis que … a été placé
  rationale: La construction marque le point de départ temporel lié à l’établissement de l’être humain sur la terre. Une proposition introduite par « depuis que » est claire et idiomatique en français.
- source_word: שִׂים
  choice: a été placé
  rationale: L’infinitif de שׂים présente אָדָם comme mis ou placé sur la terre. Le passif français conserve ce rapport sans préciser l’agent, lui aussi implicite dans la formulation hébraïque.
- source_word: אָדָם
  choice: l’être humain
  rationale: אָדָם est ici un singulier générique représentant l’humanité. « L’être humain » conserve le singulier représentatif et évite que « l’homme » soit compris comme désignant seulement le sexe masculin.
- source_word: עֲלֵי אָרֶץ
  choice: sur la terre
  rationale: Traduction locative directe et naturelle, avec « la terre » compris comme le monde habité.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: l’être humain
  alternative: l’homme
  rationale: Le contexte évoque l’apparition ou l’établissement de l’humanité sur la terre, non un individu masculin déterminé. « L’être humain » exprime clairement cette portée générique tout en conservant le singulier hébreu.
- issue: Ancienneté exprimée par מִנִּי עַד
  choice: depuis les temps anciens
  alternative: depuis toujours
  rationale: Le syntagme renvoie à l’antiquité reculée, parallèlement à l’établissement de l’être humain sur la terre. La traduction choisie évite d’en faire une affirmation sur l’éternité absolue.
translation_notes:
  register: Français moderne, international et digne. La question directe préserve la vigueur rhétorique de Tsophar. La formulation reste intelligible isolément tout en permettant à « cela » d’annoncer le contenu du verset suivant.
