  text: מֵשִׁ֣יב יָ֭גָע וְ/לֹ֣א יִבְלָ֑ע כְּ/חֵ֥יל תְּ֝מוּרָת֗/וֹ וְ/לֹ֣א יַעֲלֹֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/018.yaml
  text: He gives back what he labored for and does not swallow it down; according to the wealth of his exchange[a], he does not rejoice.
translation:
  language: fr
  text: Il rend ce qu’il a acquis par son labeur et ne l’engloutit pas ; selon la richesse qu’il a obtenue par ses échanges[a], il ne se réjouit pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Il restitue le fruit de son labeur et ne le consomme pas ; quant à la richesse tirée de ses échanges, il n’en jouit pas. » Le second membre est très condensé en hébreu; la relation exacte entre « richesse », « échange » et « se réjouir » admet plusieurs traductions proches.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵשִׁיב
  choice: Il rend
  rationale: Le participe hiphil de שוב exprime le fait de faire revenir ou de restituer. « Il rend » est naturel et conserve l’idée que le méchant doit se défaire de son gain.
- source_word: יָגָע
  choice: ce qu’il a acquis par son labeur
  rationale: Le terme peut désigner le labeur lui-même ou son produit. Comme objet de « rend », il désigne ici de façon naturelle ce qui a été acquis au prix du travail.
- source_word: וְלֹא יִבְלָע
  choice: sans l’engloutir
  rationale: בלע signifie concrètement « avaler, engloutir ». Le choix conserve l’image vive de richesses que l’homme ne peut ni absorber ni garder.
- source_word: כְּחֵיל
  choice: à la mesure de la richesse
  rationale: חֵיל désigne vraisemblablement ici les biens ou la richesse. Le préfixe כ, difficile dans cette construction compacte, est rendu dans son sens proportionnel possible.
- source_word: תְּמוּרָתוֹ
  choice: obtenue en échange
  rationale: תְּמוּרָה désigne un échange, une contrepartie ou ce qui est obtenu en échange. Cette formulation française explicite légèrement la relation sans déterminer davantage la nature de la transaction.
- source_word: וְלֹא יַעֲלֹס
  choice: il ne se réjouit pas
  rationale: עלס exprime la joie vive ou l’exultation. « Se réjouir » est clair, actuel et digne.
