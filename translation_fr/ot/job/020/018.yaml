revisions:
- from: Il rend ce qu’il a acquis par son labeur sans l’engloutir ; à la mesure de la richesse obtenue en échange[a], il ne se réjouit pas.
  to: Il rend ce qu’il a acquis par son labeur et ne l’engloutit pas ; selon la richesse qu’il a obtenue par ses échanges[a], il ne se réjouit pas.
  rationale: La révision rétablit la coordination explicite du premier membre et remplace une tournure française maladroite du second membre. Elle conserve l’image d’« engloutir », le caractère économique possible de « échanges » et l’ambiguïté reconnue de la syntaxe hébraïque, signalée en note.
