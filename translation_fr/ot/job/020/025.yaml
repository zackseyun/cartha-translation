- from: Il la retire[a], et elle sort de son corps ; une pointe étincelante sort de sa bile. Les terreurs fondent sur lui.
  to: Il l’en retire de son corps ; une pointe étincelante sort de sa bile ; des terreurs l’assaillent.
  rationale: La révision supprime le genre ajouté par « la / elle », corrige une alternative de note inadaptée au contexte corporel, et rend la dernière proposition de manière idiomatique sans modifier le sens ni résoudre indûment l’identité précise de l’objet implicite.
