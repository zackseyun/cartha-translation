    issue: Le pronom féminin « la / elle » attribue un genre à l’objet implicite.
    rationale: L’hébreu ne fournit pas ici de genre grammatical permettant de choisir entre une arme, un trait ou un autre objet sous-entendu. En français, l’élision « l’ » permet de préserver cette indétermination.
  - severity: medium
    issue: La note propose « Il la dégaine ».
    rationale: « Dégainer » évoque normalement le retrait d’une arme de son fourreau et risque de déplacer l’image, qui est celle d’un objet retiré du corps. La note doit présenter l’ellipse et une alternative plus littérale.
  revised_text: Il l’en retire de son corps ; une pointe étincelante sort de sa bile ; des terreurs l’assaillent.
