  yaml_path: translation/ot/job/020/025.yaml
  text: He pulls it out[a], and it comes from his body; a flashing point comes from his gall; terrors come upon him.
translation:
  language: fr
  text: Il l’en retire de son corps ; une pointe étincelante sort de sa bile ; des terreurs l’assaillent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלַף
  choice: Il la retire
  rationale: Le verbe signifie « retirer, tirer hors de », souvent à propos d’une arme. Le pronom féminin reprend naturellement en français l’arme ou la flèche implicite du contexte.
- source_word: וַיֵּצֵא
  choice: et elle sort
  rationale: Le verbe exprime le mouvement vers l’extérieur. « Sort » est direct et naturel après « retire ».
- source_word: מִגֵּוָה
  choice: de son corps
  rationale: גֵּוָה désigne ici le corps ou le tronc. « Corps » reste clair sans préciser indûment la partie anatomique.
- source_word: וּבָרָק
  choice: une pointe étincelante
  rationale: בָּרָק évoque l’éclair ou un éclat lumineux. Dans ce contexte d’arme traversant le corps, « pointe étincelante » rend la métonymie probable tout en conservant l’image vive.
- source_word: מִמְּרֹרָתוֹ
  choice: de sa bile
  rationale: Le terme peut désigner la bile, la vésicule biliaire ou, figurativement, l’amertume. Le contexte de blessure corporelle favorise le sens anatomique ; « bile » conserve la vigueur viscérale du texte.
- source_word: יַהֲלֹךְ עָלָיו
  choice: fondent sur lui
  rationale: La construction peut décrire des terreurs qui viennent sur quelqu’un. « Fondent sur lui » exprime naturellement leur irruption menaçante.
- source_word: אֵמִים
  choice: Les terreurs
  rationale: Le pluriel hébreu désigne des terreurs ou des choses effrayantes ; le pluriel français en préserve l’intensité.
