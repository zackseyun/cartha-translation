base_translation:
  language: en
  yaml_path: translation/ot/job/020/022.yaml
  text: In the fullness of his abundance[a], distress will come upon him[b]; every hand of the miserable will come against him.
translation:
  language: fr
  text: Au comble de son abondance[a], il sera dans la détresse ; toute main des malheureux se dressera contre lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand il aura tout ce qui lui suffit, il sera dans la détresse. » L’hébreu est concis : le nom peut évoquer ce qui suffit aussi bien que l’abondance, et le verbe, l’état d’être à l’étroit ou dans la détresse.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « toute main de celui qui peine viendra sur lui ». Le terme peut désigner une personne qui peine, qui souffre ou qui vit dans la misère.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְלֹאות
  choice: Au comble de
  rationale: La construction avec ב et מלא exprime ici une circonstance temporelle, au moment où la plénitude est atteinte. « Au comble de » conserve cette idée tout en étant naturel en français.
- source_word: שִׂפְקוֹ
  choice: son abondance
  rationale: Le nom désigne ce qui suffit, la profusion ou l’aisance. Dans le contexte de la prospérité du méchant, « abondance » rend clairement ce sens sans le réduire à la seule richesse matérielle.
- source_word: יֵצֶר לוֹ
  choice: la détresse l’assaillira
  rationale: La forme exprime le resserrement et la détresse qui atteignent quelqu’un. « L’assaillira » restitue naturellement la venue soudaine et hostile de cette détresse.
- source_word: כָּל יַד
  choice: toute main
  rationale: Le singulier distributif et l’image concrète de la main sont conservés, cette dernière pouvant représenter la puissance ou l’action d’une personne.
- source_word: עָמֵל
  choice: accablée
  rationale: Le terme peut désigner celui qui peine, souffre ou connaît la misère. « Accablée » convient à « main » en français et laisse entendre une personne éprouvée sans limiter le mot au travailleur.
- source_word: תְּבוֹאֶנּוּ
  choice: se dressera contre lui
  rationale: Le verbe signifie littéralement venir jusqu’à ou sur lui. Avec « toute main », le contexte suggère une action hostile ; « se dressera contre lui » explicite cette relation sans effacer l’image.
