  text: עַ֣יִן שְׁ֭זָפַתּ/וּ וְ/לֹ֣א תוֹסִ֑יף וְ/לֹא ע֝֗וֹד תְּשׁוּרֶ֥/נּוּ מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/009.yaml
  text: The eye that saw him will not see him again[a], and his place will no longer see him.
translation:
  language: fr
  text: L’œil qui l’a vu ne le verra plus[a], et son lieu ne le verra plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’œil qui l’a contemplé ne le contemplera plus. » L’hébreu emploie poétiquement « l’œil » au singulier et personnifie, dans le second membre, « son lieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: L’œil
  rationale: Le singulier poétique hébreu est conservé; il évoque tout regard qui s’était posé sur lui sans réduire l’image à « personne ».
- source_word: שְׁזָפַתּוּ
  choice: qui l’a vu
  rationale: Le verbe peut signifier voir ou regarder attentivement. « Vu » est naturel ici et maintient le parallélisme visuel.
- source_word: וְלֹא תוֹסִיף
  choice: ne le verra plus
  rationale: Avec la négation, יסף exprime l’idée de ne pas recommencer ou ne plus faire quelque chose; le complément et le verbe de perception sont repris naturellement en français.
- source_word: וְלֹא עוֹד
  choice: ne… plus
  rationale: Cette tournure rend simplement la cessation définitive exprimée par l’hébreu.
- source_word: תְּשׁוּרֶנּוּ
  choice: ne l’apercevra plus
  rationale: Le verbe signifie regarder ou voir. « Apercevoir » évite une répétition trop plate tout en conservant la personnification du lieu.
- source_word: מְקוֹמוֹ
  choice: le lieu où il était
  rationale: Littéralement « son lieu ». Cette formulation française explicite sans excès qu’il s’agit de l’endroit auquel il appartenait ou où il se trouvait, tout en permettant de conserver la personnification.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme et la personnification de l’hébreu sont maintenus, avec une légère explicitation de « son lieu » pour rendre l’image naturelle en français.
