  yaml_path: translation/ot/job/020/028.yaml
  text: The produce of his house will be carried away[b][a], flowing away in the day of his anger.
translation:
  language: fr
  text: Le produit de sa maison s’en ira[a], se déversant au jour de sa colère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « partira en exil » ou « sera emporté » ; le verbe peut désigner un départ ou un enlèvement, ici celui du produit ou des ressources de la maison du méchant.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit probablement de la colère de Dieu, bien que l’hébreu ne précise pas à qui renvoie le possessif.
    reason: alternative_reading
lexical_decisions:
- source_word: יִגֶל
  choice: s’en ira
  rationale: Le qal imparfait de גלה exprime ici le départ ou l’enlèvement de ce que possède la maison. « S’en ira » conserve la forme active et la possibilité d’un départ forcé sans préciser un agent absent de l’hébreu.
- source_word: יְבוּל בֵּיתוֹ
  choice: ce que produit sa maison
  rationale: יְבוּל désigne le produit, le rendement ou les ressources obtenues. Cette formulation naturelle garde l’image de la « maison », laquelle peut englober le foyer et le domaine.
- source_word: נִגָּרוֹת
  choice: ses biens s’écouleront
  rationale: Le participe nifal féminin pluriel de נגר évoque des choses qui se déversent ou s’écoulent. « Ses biens » explicite sobrement le pluriel implicite et « s’écouleront » préserve l’image liquide.
- source_word: בְּיוֹם אַפּוֹ
  choice: au jour de sa colère
  rationale: Rendu proche de l’idiome hébreu, avec un ton solennel. Le possessif reste non explicité afin de préserver l’ambiguïté du référent.
theological_decisions:
- issue: Référent de « sa colère »
  choice: Maintien du possessif « sa » sans nommer Dieu dans le texte
  alternative: « au jour de la colère de Dieu »
  rationale: Le contexte fait probablement référence à la colère de Dieu, mais l’hébreu ne nomme pas explicitement son référent. Le texte principal conserve donc cette tension, expliquée en note.
translation_notes:
  register: Français international actuel, sobre et digne. Le parallélisme est rendu par deux propositions séparées d’un point-virgule. L’image de biens qui s’écoulent est conservée sans la remplacer par une interprétation plus explicite.
