  text: Then Zophar the Naamathite answered and said:[a]
translation:
  language: fr
  text: Alors Tsophar le Naamatite répondit :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu ajoute : « et dit ».'
    reason: La formule hébraïque conventionnelle « répondit et dit » comporte un second verbe de parole, omis dans la traduction française pour la fluidité.
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Dans cette formule narrative de dialogue, ענה signifie « répondre ». Le passé simple convient au registre narratif français et indique que Tsophar réagit au discours précédent.
- source_word: צֹפַר
  choice: Tsophar
  rationale: Le nom propre est translittéré selon la forme française courante qui rend explicitement la consonne initiale hébraïque צ.
- source_word: הַנַּעֲמָתִי
  choice: le Naamatite
  rationale: Ce gentilé muni de l’article désigne l’origine géographique ou l’appartenance de Tsophar. « Naamatite » est une forme française claire et traditionnelle.
- source_word: וַיֹּאמַר
  choice: dit
  rationale: אמר signifie normalement « dire ». Dans la formule hébraïque « répondit et dit », ce second verbe peut être conservé pour refléter la formulation de la source, comme indiqué dans la note.
- source_word: וַ
  choice: Alors
  rationale: Le waw narratif fait progresser le récit. « Alors » exprime naturellement en français la succession et la reprise du dialogue.
