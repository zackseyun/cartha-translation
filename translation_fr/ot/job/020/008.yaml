  text: Like a dream he flies away and is not found[b][a]; he is driven away like a vision of the night.
translation:
  language: fr
  text: Comme un rêve, il s’envole, et on ne le trouve pas[a] ; il est chassé comme une vision de la nuit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et ils ne le trouvent pas ». Le verbe hébreu est à la troisième personne du pluriel, avec un sujet indéfini et un suffixe objet.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme une vision nocturne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: Comme un rêve
  rationale: Le préfixe כַּ marque la comparaison et חֲלוֹם signifie « rêve ». Cette formulation naturelle conserve l’image poétique.
- source_word: יָעוּף
  choice: il s’envole
  rationale: Le verbe עוּף signifie littéralement « voler ». « Il s’envole » préserve l’image vive d’une disparition rapide.
- source_word: וְלֹא יִמְצָאֻהוּ
  choice: et on ne le retrouve plus
  rationale: L’hébreu emploie un verbe actif au pluriel indéfini avec un suffixe objet, littéralement « et ils ne le trouvent pas ». Le pronom indéfini « on » rend naturellement cette construction en français, tandis que « plus » exprime ici le résultat durable de la disparition dans le contexte.
- source_word: וְיֻדַּד
  choice: il est chassé
  rationale: La forme passive causative décrit quelqu’un ou quelque chose que l’on chasse ou repousse. « Il est chassé » reste imagé et convient au parallélisme poétique.
- source_word: כְּחֶזְיוֹן לָיְלָה
  choice: comme une vision de la nuit
  rationale: חֶזְיוֹן signifie « vision » et לָיְלָה forme ici une relation génitive. La tournure conserve la poésie et la proximité avec l’hébreu.
