  text: חַ֣יִל בָּ֭לַע וַ/יְקִאֶ֑/נּוּ מִ֝/בִּטְנ֗/וֹ יוֹרִשֶׁ֥/נּוּ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/015.yaml
  text: He swallowed wealth[a], but he will vomit it up[b]; God will drive it out of his belly.
translation:
  language: fr
  text: Il a englouti des richesses[a], mais il les vomira ; Dieu les chassera de son ventre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la fortune » (חַיִל).
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: des richesses
  rationale: Dans ce contexte de gains accumulés par le méchant, le terme désigne les biens matériels. « Des richesses » est naturel en français et convient à l’image de ce qui a été englouti.
- source_word: בָּלַע
  choice: a englouti
  rationale: Le verbe exprime l’action d’avaler ou de dévorer. « Englouti » conserve l’image concrète et suggère l’avidité sans rompre le parallèle avec « vomira ».
- source_word: וַיְקִאֶנּוּ
  choice: mais il les vomira
  rationale: Le verbe signifie « vomir ». Le futur rend la conséquence annoncée dans ce discours poétique, et « mais » fait ressortir le renversement implicite. Le pronom pluriel reprend naturellement « des richesses ».
- source_word: מִבִּטְנוֹ
  choice: de son ventre
  rationale: Le terme désigne ici le ventre comme lieu imagé des richesses avalées. Cette traduction garde la force corporelle de la métaphore.
- source_word: יוֹרִשֶׁנּוּ
  choice: les chassera
  rationale: La forme causative indique que Dieu fera sortir les richesses du ventre du méchant. « Chassera » exprime cette expulsion forcée tout en restant proche de la construction hébraïque.
- source_word: אֵל
  choice: Dieu
  rationale: Le nom אֵל désigne explicitement Dieu, sujet de l’expulsion ; il ne faut pas atténuer cette action en conséquence impersonnelle.
theological_decisions:
- issue: L’agent du jugement qui expulse les richesses du méchant
  choice: Dieu est explicitement celui qui chasse les richesses de son ventre.
  alternative: Présenter cette perte comme une conséquence impersonnelle ou laisser l’agent indéterminé.
  rationale: L’hébreu nomme אֵל comme sujet de יוֹרִשֶׁנּוּ. La traduction maintient donc sans l’atténuer l’action directe de Dieu.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. L’image corporelle cohérente — engloutir, vomir, ventre — est conservée. La répétition de « les » clarifie que les richesses demeurent l’objet des deux actions.
