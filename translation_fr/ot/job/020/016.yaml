  text: רֹאשׁ פְּתָנִ֥ים יִינָ֑ק תַּֽ֝הַרְגֵ֗/הוּ לְשׁ֣וֹן אֶפְעֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/016.yaml
  text: He sucks the venom of cobras[b][a]; the tongue of a viper kills him.
translation:
  language: fr
  text: 'Il suce le venin des cobras[a] ;

    la langue d’une vipère le tue.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le poison des aspics ». L’hébreu peut désigner le « poison » des serpents ; « aspics » est une traduction traditionnelle de ce nom de serpent venimeux.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: venin
  rationale: Bien que le mot signifie souvent « tête », il désigne ici, dans cette image poétique et selon le parallélisme avec la vipère mortelle, la substance toxique du serpent. « Venin » est plus précis que « poison » pour une substance produite par un animal venimeux.
- source_word: פְּתָנִים
  choice: cobras
  rationale: Le terme désigne des serpents venimeux et est traditionnellement rendu par « aspics ». « Cobras » constitue un équivalent moderne clair, sans prétendre à une identification zoologique absolument certaine ; l’alternative traditionnelle est signalée en note.
- source_word: יִינָק
  choice: aspire
  rationale: Le verbe signifie littéralement « téter, sucer ». « Aspire » conserve l’image concrète de l’absorption tout en sonnant plus naturellement et dignement en français que « suce » dans ce contexte.
- source_word: תַּהַרְגֵהוּ
  choice: le tue
  rationale: Le verbe a pour sujet féminin singulier « la langue » et pour objet « lui ». Le présent exprime directement, dans le style poétique, l’issue certaine.
- source_word: לְשׁוֹן
  choice: langue
  rationale: La traduction maintient l’image littérale et frappante du texte hébreu, sans la remplacer par l’interprétation physiologique « crochets » ou « morsure ».
- source_word: אֶפְעֶה
  choice: vipère
  rationale: Le terme désigne un serpent venimeux. « Vipère » est un équivalent français moderne, clair et suffisamment général, sans imposer une précision zoologique incertaine.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et direct. Le parallélisme des deux membres est conservé. « Aspire » évite la connotation moderne potentiellement gênante de « suce » tout en restant proche du geste exprimé par l’hébreu. Le point-virgule rend le lien étroit entre l’ingestion du venin et la mort.
