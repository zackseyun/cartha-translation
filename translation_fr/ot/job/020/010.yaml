  yaml_path: translation/ot/job/020/010.yaml
  text: His sons will seek the favor of the poor[b][a], and his own hands will give back his wealth.
translation:
  language: fr
  text: Ses fils chercheront la faveur des pauvres[a], et ses propres mains restitueront ses biens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chercheront à apaiser les pauvres »; le verbe hébreu peut évoquer la recherche de leur faveur ou l’apaisement de personnes lésées.
    reason: lexical_alternative
  - marker: b
    text: Ou « sa richesse » ou « sa vigueur »; le nom hébreu peut désigner les biens, les ressources ou la force.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le nom hébreu est un masculin pluriel avec suffixe de troisième personne du masculin singulier; « ses fils » en conserve la précision grammaticale.
- source_word: יְרַצּוּ
  choice: chercheront la faveur de
  rationale: Le piel de רצה peut ici exprimer l’idée de rechercher l’acceptation ou la faveur de personnes lésées; cette formulation française reste naturelle sans imposer l’idée plus précise d’une réparation.
- source_word: דַלִּים
  choice: des pauvres
  rationale: דַלִּים désigne couramment les pauvres ou les personnes socialement faibles; « les pauvres » convient directement au contexte.
- source_word: יָדָיו
  choice: ses propres mains
  rationale: Le pluriel concret « mains » est conservé, et « propres » souligne que la restitution lui incombe personnellement.
- source_word: תָּשֵׁבְנָה
  choice: restitueront
  rationale: Le hifil de שוב signifie faire revenir, rendre ou restituer; « restitueront » exprime avec naturel le retour de biens dans ce contexte.
- source_word: אוֹנוֹ
  choice: ses biens
  rationale: אוֹן peut désigner la richesse, les ressources, les possessions ou la vigueur. « Ses biens » rend sobrement le sens matériel vraisemblable tout en évitant une précision excessive.
