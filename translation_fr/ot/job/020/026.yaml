  variant: modern international French
source:
  edition: WLC
  text: כָּל חֹשֶׁךְ֮ טָמ֪וּן לִ/צְפּ֫וּנָ֥י/ו תְּ֭אָכְלֵ/הוּ אֵ֣שׁ לֹֽא נֻפָּ֑ח יֵ֖רַע שָׂרִ֣יד בְּ/אָהֳלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/026.yaml
  text: All darkness is hidden up for his treasures[a]; a fire not blown will consume him[c][b]; it will feed on what remains in his tent.
translation:
  language: fr
  text: Toutes les ténèbres sont tenues en réserve pour lui[a] ; un feu que nul n’a attisé le dévorera[b] ; il consumera ce qui reste dans sa tente[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Toutes les ténèbres sont cachées parmi ses trésors. » L’expression hébraïque est difficile : elle peut désigner le malheur gardé en réserve pour lui ou ce qui est caché dans ses réserves.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « un feu qui n’a pas été soufflé ». Il peut s’agir d’un feu que personne n’a allumé ou attisé, ce qui peut suggérer un feu d’origine non humaine.'
    reason: lexical_alternative
  - marker: c
    text: 'Autres traductions possibles : « il fera du mal au survivant dans sa tente » ou « il consumera le reste dans sa tente ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל חֹשֶׁךְ
  choice: Toutes les ténèbres
  rationale: Conserve l’image hébraïque de l’obscurité, qui évoque ici le malheur ou le jugement, sans expliciter davantage que le texte.
- source_word: טָמוּן לִצְפּוּנָיו
  choice: sont tenues en réserve pour lui
  rationale: Rend l’idée de ce qui est caché ou réservé et adopte une lecture syntaxiquement plausible, tout en signalant en note l’autre compréhension possible liée à ses réserves cachées.
- source_word: תְּאָכְלֵהוּ
  choice: le dévorera
  rationale: Avec le feu pour sujet, « dévorer » restitue naturellement la vigueur concrète du verbe hébreu « manger ».
- source_word: אֵשׁ לֹא נֻפָּח
  choice: un feu que nul n’a attisé
  rationale: Exprime en français naturel le feu qui n’a pas été soufflé ou attisé, sans imposer explicitement l’identité de son auteur.
- source_word: יֵרַע
  choice: il consumera
  rationale: Dans le contexte du feu, traduit l’action destructrice probable, tout en reconnaissant en note que la forme peut aussi signifier faire du mal.
- source_word: שָׂרִיד
  choice: ce qui reste
  rationale: Préserve l’ambiguïté entre un reste matériel ou familial et un survivant, sans réduire le terme à une personne.
- source_word: בְּאָהֳלוֹ
  choice: dans sa tente
  rationale: Maintient l’image poétique littérale de la tente, qui peut aussi représenter la maison ou la maisonnée.
theological_decisions:
- issue: Origine du feu qui n’est pas attisé
  choice: Ne pas qualifier explicitement ce feu de divin
  alternative: « un feu envoyé par Dieu »
  rationale: Le contexte peut suggérer un jugement qui dépasse l’action humaine, mais le verset ne nomme pas Dieu comme agent ; la traduction conserve donc cette tension.
translation_notes:
  register: Français moderne, poétique et digne. La formulation reste accessible tout en conservant les images des ténèbres, du feu et de la tente, ainsi que les ambiguïtés de לִצְפּוּנָיו, יֵרַע et שָׂרִיד.
