  text: אֵין שָׂרִ֥יד לְ/אָכְל֑/וֹ עַל כֵּ֝֗ן לֹא יָחִ֥יל טוּבֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/021.yaml
  text: Nothing was left for him to devour[b][a]; therefore his prosperity will not endure.
translation:
  language: fr
  text: Rien n’échappe à sa voracité[a] ; c’est pourquoi sa prospérité ne durera pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Il n’y avait pas de survivant pour son manger. » La formulation évoque le fait que rien ne restait ou n’échappait à ce qu’il dévorait.'
    reason: lexical_alternative
  - marker: b
    text: 'Le sens du verbe hébreu est incertain. On peut aussi traduire : « ne se maintiendra pas » ou « ne subsistera pas » ; moins probablement ici : « ne prospérera pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין שָׂרִיד
  choice: Rien n’échappait
  rationale: Littéralement, la tournure signifie qu’il n’y avait aucun survivant ni reste. Dans ce contexte, cette formulation naturelle conserve l’image d’une consommation totale.
- source_word: לְאָכְלוֹ
  choice: à sa voracité
  rationale: L’infinitif de אכל désigne littéralement le fait de manger. Ici, il évoque la consommation avide du méchant ; « voracité » exprime ce sens sans le limiter à la nourriture.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: Expression courante introduisant la conséquence de la proposition précédente.
- source_word: יָחִיל
  choice: durera
  rationale: Le verbe est difficile. Dans cette proposition, il indique probablement que la prospérité ne se maintiendra pas dans le temps.
- source_word: טוּבוֹ
  choice: sa prospérité
  rationale: Le nom signifie littéralement « son bien » ou « ce qu’il a de bon » ; dans ce contexte de jugement, il désigne naturellement son aisance ou sa prospérité.
