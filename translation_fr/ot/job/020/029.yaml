source:
  edition: WLC
  text: זֶ֤ה חֵֽלֶק אָדָ֣ם רָ֭שָׁע מֵ/אֱלֹהִ֑ים וְ/נַחֲלַ֖ת אִמְר֣/וֹ מֵ/אֵֽל׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/020/029.yaml
  text: This is the portion of a wicked man from God[a], the inheritance appointed for him from the Mighty One.
translation:
  language: fr
  text: 'Voilà la part que Dieu réserve à l’homme méchant,

    l’héritage que le Puissant lui assigne[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’héritage de sa parole, venant du Puissant ». Le mot hébreu peut désigner une parole ou une déclaration; ici, il renvoie probablement à ce que Dieu a prononcé ou fixé pour cet homme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Voilà
  rationale: Le démonstratif ouvre la conclusion récapitulative de Tsophar. « Voilà » exprime naturellement en français l’identification solennelle du sort décrit.
- source_word: חֵלֶק אָדָם רָשָׁע
  choice: la part que Dieu réserve à l’homme méchant
  rationale: חֵלֶק désigne la part attribuée ou le sort réservé. La construction française avec « réserve » explicite la provenance marquée par מֵאֱלֹהִים sans modifier l’idée d’attribution. אָדָם רָשָׁע reste un singulier masculin à valeur générique.
- source_word: מֵאֱלֹהִים
  choice: que Dieu réserve
  rationale: אֱלֹהִים désigne ici Dieu comme source de la part attribuée au méchant. Cette formulation est plus naturelle que « de la part de Dieu » dans ce parallélisme.
- source_word: וְנַחֲלַת
  choice: l’héritage
  rationale: Le terme est parallèle à « part » et évoque ce qui revient à quelqu’un par attribution. Le français « héritage » conserve cette image.
- source_word: אִמְרוֹ
  choice: lui assigne
  rationale: Pris dans le parallélisme, le terme renvoie vraisemblablement à ce que Dieu prononce ou fixe pour le méchant. « Assigne » rend cette portée sans préciser excessivement qu’il s’agit d’un décret; le sens plus littéral « sa parole » est conservé en note.
- source_word: מֵאֵל
  choice: que le Puissant lui assigne
  rationale: אֵל est un titre divin parallèle à אֱלֹהִים. « le Puissant » maintient la variation poétique et la force du titre sans l’identifier au titre distinct « le Tout-Puissant ».
theological_decisions:
- issue: Valeur générique de אָדָם au masculin singulier
  choice: l’homme méchant
  alternative: la personne méchante
  rationale: Le texte parle d’un homme singulier représentatif. La formulation retenue conserve le genre grammatical et la portée générique de l’hébreu.
- issue: Interprétation de אִמְרוֹ
  choice: que le Puissant lui assigne
  alternative: de sa parole, venant du Puissant
  rationale: Dans le contexte, le second membre reformule la part que Dieu destine au méchant. Toutefois, le sens lexical de « parole/énoncé » demeure réel et n’est donc pas éliminé, mais signalé en note.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme est conservé sur deux lignes. « Le Puissant » rend le titre אֵל sans le confondre avec « le Tout-Puissant », habituellement associé à שַׁדַּי.
