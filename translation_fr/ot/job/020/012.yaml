  text: אִם תַּמְתִּ֣יק בְּ/פִ֣י/ו רָעָ֑ה יַ֝כְחִידֶ֗/נָּה תַּ֣חַת לְשׁוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/012.yaml
  text: Though evil is sweet in his mouth[a], he hides it under his tongue,
translation:
  language: fr
  text: Même si le mal est doux dans sa bouche[a], il le cache sous sa langue,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Si le mal est doux dans sa bouche ». La particule hébraïque peut exprimer une condition (« si ») ou une concession (« même si ») ; le contexte favorise ici le sens concessif.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Même si
  rationale: La particule peut introduire une condition (« si ») ou avoir ici une valeur concessive. Dans la description suivie de l’homme mauvais, « même si » exprime naturellement la concession tout en laissant l’alternative en note.
- source_word: תַּמְתִּיק
  choice: est doux
  rationale: Le hiphil de מתק peut signifier « rendre doux » et, avec une chose comme sujet, « être doux, agréable ». La tournure française restitue naturellement l’image gustative.
- source_word: בְּפִיו
  choice: dans sa bouche
  rationale: Traduction concrète de פֶּה, qui maintient le parallélisme de l’image avec « sous sa langue ».
- source_word: רָעָה
  choice: le mal
  rationale: Dans ce contexte sapientiel, le mot désigne le mal moral que l’homme mauvais savoure; « le mal » en conserve la portée générale.
- source_word: יַכְחִידֶנָּה
  choice: il le cache
  rationale: Le hiphil de כחד exprime ici l’action de cacher ou de dissimuler. Le pronom reprend « le mal ».
- source_word: תַּחַת
  choice: sous
  rationale: La préposition garde son sens spatial dans la métaphore de la bouche.
- source_word: לְשׁוֹנוֹ
  choice: sa langue
  rationale: La traduction littérale préserve l’image vive de quelqu’un qui garde le mal en bouche pour le savourer.
