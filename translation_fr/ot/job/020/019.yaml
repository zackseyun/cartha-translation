  rationale: La révision retire deux précisions interprétatives (« mais » et le préfixe re-), afin de reproduire la coordination et de préserver l’ambiguïté de l’expression hébraïque « une maison il a prise de force, et il ne la bâtira pas ».
  reviewer_model: gpt-5.6-terra
