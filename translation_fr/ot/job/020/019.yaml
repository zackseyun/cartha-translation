  yaml_path: translation/ot/job/020/019.yaml
  text: For he has crushed and abandoned the poor[a]; he has seized a house and will not rebuild it.
translation:
  language: fr
  text: 'Car il a écrasé et abandonné les pauvres ;

    il s’est emparé d’une maison et ne la bâtira pas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la raison du jugement exposé dans le contexte.
- source_word: רִצַּץ
  choice: a écrasé
  rationale: Ce choix conserve la force concrète et violente du verbe, sans la réduire au sens plus interprétatif d’« opprimer ».
- source_word: עָזַב
  choice: abandonné
  rationale: Le verbe exprime le fait de laisser ou de délaisser ; « abandonné » rend naturellement en français la faute commise envers les pauvres.
- source_word: דַּלִּים
  choice: les pauvres
  rationale: Dans ce contexte social, le terme désigne les personnes démunies et vulnérables.
- source_word: בַּיִת גָּזַל
  choice: s’est emparé d’une maison
  rationale: גזל évoque une prise injuste, souvent par la force. « S’est emparé » convient à une maison comme bien saisi et garde cette nuance mieux que le seul verbe « voler ».
- source_word: וְלֹא יִבֶנֵהוּ
  choice: mais il ne la rebâtira pas
  rationale: Le suffixe renvoie à la maison. Le futur exprime qu’il ne pourra pas profiter de son acquisition injuste en la bâtissant ou en la rétablissant ; « rebâtira » est naturel avec une maison déjà existante.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme poétique est conservé sur deux lignes. « Mais » explicite légèrement le contraste porté par la coordination hébraïque, tandis que le futur maintient la tension du jugement annoncé.
