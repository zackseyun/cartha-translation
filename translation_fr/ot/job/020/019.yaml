review_pass:
  verdict: revise
  source_fidelity: Le rendu de כִּי par « Car », de רִצַּץ par « a écrasé », de עָזַב par « abandonné », de דַּלִּים par « les pauvres » et de גזל par « s’est emparé » est fidèle au texte hébreu. En revanche, la coordination וְ (« et ») devant לֹא יִבֶנֵהוּ ne porte pas en elle-même une opposition à traduire par « mais ». Le préfixe re- de « rebâtira » n’est pas explicitement indiqué par בנה et réduit inutilement l’ambiguïté de l’image.
  naturalness: Le français demeure naturel, sobre et adapté au registre poétique. « Ne la bâtira pas » est un peu plus littéral et moins idiomatique dans le cadre d’une maison déjà saisie, mais il maintient précisément la tension elliptique et probablement ironique de l’hébreu sans en expliciter le sens.
  terminology: « Les pauvres » convient pour דלים. « S’est emparé d’une maison » rend bien la prise injuste exprimée par גזל. « Bâtira » conserve le champ lexical de בנה sans ajouter l’idée de reconstruction.
  issues:
  - severity: medium
    issue: « mais » ajoute un contraste non exprimé dans la coordination hébraïque.
    rationale: Le texte porte simplement וְלֹא, « et ne… pas ». Le contraste peut être ressenti dans la logique du verset, mais il ne doit pas être imposé dans une traduction d’équivalence optimale.
  - severity: medium
    issue: « rebâtira » ajoute l’idée de rebâtir/restaurer.
    rationale: בנה signifie « bâtir, construire »; le contexte permet diverses compréhensions de la formule, mais le préfixe « re- » restreint cette ambiguïté sans appui explicite du texte.
  revised_text: 'Car il a écrasé et abandonné les pauvres ;

    il s’est emparé d’une maison et ne la bâtira pas.'
