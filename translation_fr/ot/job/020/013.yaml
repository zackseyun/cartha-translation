  text: He spares it and does not let it go[a], and holds it in his mouth.
translation:
  language: fr
  text: Il la ménage et ne la lâche pas ; il la retient dans sa bouche[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans son palais » ; c’est-à-dire à l’intérieur de sa bouche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹל עָלֶיהָ
  choice: Il la ménage
  rationale: חמל exprime normalement le fait d’épargner ou de traiter avec ménagement. Ici, l’image est celle d’un homme qui conserve avec soin la méchanceté goûtée comme une douceur ; « ménage » garde cette nuance sans réduire le verbe au simple fait de garder.
- source_word: וְלֹא יַעַזְבֶנָּה
  choice: et ne la lâche pas
  rationale: עזב peut signifier laisser, abandonner ou relâcher. « Ne la lâche pas » rend naturellement, dans cette image concrète, son refus de s’en défaire.
- source_word: וְיִמְנָעֶנָּה
  choice: il la retient
  rationale: מנע signifie retenir, empêcher ou garder en réserve. Dans le contexte, l’homme retient dans sa bouche ce qu’il trouve doux au lieu de l’avaler ou de le rejeter.
- source_word: בְּתוֹךְ חִכּוֹ
  choice: dans sa bouche
  rationale: חך désigne littéralement le palais. « Dans sa bouche » transmet clairement l’image en français courant, tandis que le sens anatomique précis est signalé en note.
