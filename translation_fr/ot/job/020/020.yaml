  text: כִּ֤י לֹא יָדַ֣ע שָׁלֵ֣ו בְּ/בִטְנ֑/וֹ בַּ֝/חֲמוּד֗/וֹ לֹ֣א יְמַלֵּֽט׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/020.yaml
  text: For he knew no quiet in his belly[a]; with his desirable things he will not escape.
translation:
  language: fr
  text: 'Car il n’a connu aucun repos dans son ventre[a] ;

    il ne s’échappera pas avec ce qu’il convoite[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il n’a connu aucune tranquillité dans son estomac ».'
    reason: שָׁלֵו peut désigner le repos, l’aisance ou la tranquillité, et בֶּטֶן signifie littéralement « ventre » ; « estomac » est une autre expression française possible dans ce contexte.
  - marker: b
    text: 'Ou, selon une autre analyse : « il ne sauvera rien de ce qu’il convoite » ou « il ne se sauvera pas grâce à ses biens précieux ».'
    reason: בַּחֲמוּדוֹ peut être compris comme « avec/par ce qu’il convoite » et לֹא יְמַלֵּט peut être lu intransitivement (« il ne s’échappera pas ») ou, plus probablement de façon secondaire, transitivement (« il ne sauvera [rien] »).
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication du jugement décrit dans le contexte précédent.
- source_word: לֹא יָדַע שָׁלֵו
  choice: il n’a pas connu de repos
  rationale: Cette formulation conserve l’expression hébraïque et rend שָׁלֵו par l’idée de calme ou d’aisance, sans préciser davantage la nature de ce repos.
- source_word: בְּבִטְנוֹ
  choice: dans son ventre
  rationale: בֶּטֶן désigne concrètement le ventre ou les entrailles. Dans ce contexte marqué par l’avidité et la consommation, l’image corporelle mérite d’être conservée.
- source_word: בַּחֲמוּדוֹ
  choice: de ce qu’il désire
  rationale: Le terme dérivé de חמד peut désigner ce qui est désiré, précieux ou convoité. Cette traduction préserve l’idée de désir sans réduire le référent aux seuls trésors matériels.
- source_word: לֹא יְמַלֵּט
  choice: il ne sauvera rien
  rationale: Le piel de מלט peut signifier « faire échapper, mettre à l’abri, sauver ». Avec un objet sous-entendu, la proposition peut signifier qu’il ne préservera rien de ses biens convoités.
theological_decisions:
- issue: Ambiguïté syntaxique de la seconde proposition
  choice: il ne sauvera rien de ce qu’il désire
  alternative: il ne se sauvera pas grâce à ses biens précieux
  rationale: L’hébreu permet de comprendre מלט transitivement (« sauver, préserver ») avec un objet sous-entendu, ou de lui donner ici le sens de « s’échapper ». Le texte principal retient la lecture transitive, bien attestée pour le piel, tandis que la note conserve l’autre possibilité sans trancher artificiellement.
translation_notes:
  register: Français international moderne, poétique mais direct. Le parallélisme en deux lignes est conservé, ainsi que l’image concrète du ventre. Les notes signalent les principales ambiguïtés lexicales et syntaxiques sans imposer une interprétation confessionnelle.
