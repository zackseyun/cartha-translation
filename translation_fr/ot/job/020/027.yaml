source:
  edition: WLC
  text: יְגַלּ֣וּ שָׁמַ֣יִם עֲוֺנ֑/וֹ וְ֝/אֶ֗רֶץ מִתְקוֹמָ֘מָ֥ה לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/027.yaml
  text: The heavens will reveal his iniquity[b][a], and the earth will rise up against him.
translation:
  language: fr
  text: Les cieux révéleront sa faute[a], et la terre[b] se dressera contre lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa culpabilité » ; le mot hébreu peut désigner aussi bien la faute morale que la culpabilité qui en découle.
    reason: lexical_alternative
  - marker: b
    text: Ou « le pays », bien que « la terre » corresponde mieux au parallélisme avec « les cieux » dans ce contexte poétique.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלּוּ
  choice: révéleront
  rationale: Le piel inaccompli de גלה exprime ici l’action de dévoiler ou de faire connaître. « Révéleront » est naturel en français et conserve la portée judiciaire de cette mise au jour.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Le pluriel hébreu peut fonctionner comme un collectif, mais « les cieux » préserve le registre poétique et la personnification du témoin cosmique.
- source_word: עֲוֺנוֹ
  choice: sa faute
  rationale: עָוֹן peut désigner la faute morale, la culpabilité qui en découle, voire sa sanction. « Sa faute » reste compréhensible et assez large pour ne pas trancher entièrement entre acte coupable et culpabilité.
- source_word: וְאֶרֶץ
  choice: et la terre
  rationale: אֶרֶץ peut signifier « terre » ou « pays ». Dans le parallélisme avec « les cieux », « la terre » rend le mieux la scène cosmique personnifiée.
- source_word: מִתְקוֹמָמָה
  choice: se dressera
  rationale: Cette forme issue de קום évoque le fait de se lever en opposition. « Se dressera » conserve l’image vive et exprime naturellement l’hostilité en français.
- source_word: לוֹ
  choice: contre lui
  rationale: Avec un verbe décrivant un soulèvement hostile, ל prend ici une valeur adversative que « contre lui » restitue clairement.
theological_decisions:
- issue: Portée de עָוֹן
  choice: sa faute
  alternative: sa culpabilité
  rationale: Le terme hébreu peut viser soit le mal commis, soit l’état de culpabilité qui s’y attache. Le texte principal emploie un terme français courant et la note maintient explicitement l’autre lecture.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme cosmique entre « les cieux » et « la terre » est conservé, de même que leur personnification judiciaire.
