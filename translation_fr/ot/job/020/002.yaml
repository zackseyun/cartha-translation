  text: לָ֭/כֵן שְׂעִפַּ֣/י יְשִׁיב֑וּ/נִי וּ֝/בַ/עֲב֗וּר ח֣וּשִׁ/י בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/002.yaml
  text: Therefore my thoughts answer me[b][a], because of my inward agitation.
translation:
  language: fr
  text: C’est pourquoi mes pensées me poussent à répondre[a], à cause de l’agitation qui est en moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « mes pensées me répondent » ou « mes pensées inquiètes me font répondre ». L’expression hébraïque est condensée : elle peut décrire les pensées qui répondent en lui ou celles qui le poussent à répondre.'
    reason: lexical_alternative
  - marker: b
    text: Ou « à cause de la hâte qui est en moi ». Le terme hébreu peut exprimer la hâte, mais il désigne probablement ici une agitation ou une urgence intérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Ce connecteur exprime naturellement en français la conséquence ou l’inférence tirée de ce qui précède.
- source_word: שְׂעִפַּי
  choice: mes pensées
  rationale: Le terme peut évoquer des pensées partagées ou inquiètes, mais l’agitation est déjà explicitée dans le second membre; « pensées » évite de surinterpréter tout en laissant la note signaler la nuance possible.
- source_word: יְשִׁיבוּנִי
  choice: me poussent à répondre
  rationale: La forme causative de שוב, dans cet idiome condensé, peut indiquer que les pensées amènent l’orateur à répliquer. Cette formulation est naturelle en français tout en conservant l’ambiguïté dans la note.
- source_word: וּבַעֲבוּר
  choice: à cause de
  rationale: La locution marque ici la cause. La conjonction préfixée est intégrée à la syntaxe française sans ajouter un « et » pesant.
- source_word: חוּשִׁי
  choice: l’agitation
  rationale: Bien que le mot puisse être rattaché à l’idée de hâte, le contexte poétique suggère une agitation ou une urgence intérieure qui provoque la réponse.
- source_word: בִי
  choice: qui est en moi
  rationale: Cette expression conserve explicitement la localisation intérieure indiquée par la préposition hébraïque et son suffixe de première personne.
