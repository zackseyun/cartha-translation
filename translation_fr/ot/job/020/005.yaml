id: JOB.20.5
reference: Job 20:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י רִנְנַ֣ת רְ֭שָׁעִים מִ/קָּר֑וֹב וְ/שִׂמְחַ֖ת חָנֵ֣ף עֲדֵי רָֽגַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/005.yaml
  text: For the rejoicing of the wicked is brief[a], and the joy of the godless lasts only a moment.
translation:
  language: fr
  text: 'Car la jubilation des méchants est de courte durée,

    et la joie de l’impie[a] ne dure qu’un instant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’hypocrite ». Le mot hébreu peut désigner une personne hypocrite, mais il a ici le sens plus large de personne impie ou profane.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve naturellement sa valeur causale.
- source_word: רִנְנַת
  choice: la jubilation
  rationale: Le nom évoque une manifestation ou un cri de joie ; « jubilation » en rend la force tout en restant naturel en français.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Désigne ici, comme substantif pluriel, des personnes moralement coupables ; ce choix convient au registre sapiential.
- source_word: מִקָּרוֹב
  choice: est de courte durée
  rationale: Dans ce contexte temporel, l’expression indique que cette jubilation ne dure pas longtemps, plutôt qu’une proximité spatiale.
- source_word: וְשִׂמְחַת
  choice: et la joie de
  rationale: Rend directement le groupe construit et maintient le parallélisme poétique avec le premier membre.
- source_word: חָנֵף
  choice: l’impie
  rationale: Dans Job, le terme désigne plus largement une personne irréligieuse ou profane, et non seulement quelqu’un qui simule la piété.
- source_word: עֲדֵי רָגַע
  choice: ne dure qu’un instant
  rationale: Exprime idiomatiquement la limite temporelle marquée par עֲדֵי et la très courte durée indiquée par רָגַע.
theological_decisions:
- issue: Portée morale de חָנֵף
  choice: l’impie
  alternative: l’hypocrite
  rationale: « L’impie » préserve le sens religieux et moral large du mot dans Job, sans le réduire à la seule dissimulation religieuse.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux membres est conservé, avec une formulation idiomatique de leur brièveté temporelle.
