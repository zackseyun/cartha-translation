  text: לַ֭חְמ/וֹ בְּ/מֵעָ֣י/ו נֶהְפָּ֑ךְ מְרוֹרַ֖ת פְּתָנִ֣ים בְּ/קִרְבּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/014.yaml
  text: his food in his belly is turned[a]; it is the venom of cobras within him.
translation:
  language: fr
  text: 'Dans son ventre, sa nourriture se transforme : c’est du venin de cobras au-dedans de lui.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dans ses entrailles, son pain est changé en fiel d’aspics. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחְמוֹ
  choice: sa nourriture
  rationale: Bien que לֶחֶם désigne souvent le « pain », le mot évoque ici plus largement ce qu’il a mangé. « Sa nourriture » rend ce sens naturellement en français tout en conservant l’image concrète de l’aliment ingéré.
- source_word: בְּמֵעָיו
  choice: dans son ventre
  rationale: Le terme désigne les entrailles ou organes internes. « Dans son ventre » est une formulation actuelle et idiomatique qui convient à l’image digestive.
- source_word: נֶהְפָּךְ
  choice: se transforme
  rationale: Le nifal de הפך exprime ici un changement d’état. « Se transforme » indique clairement que la nourriture devient, en lui, quelque chose de nocif.
- source_word: מְרוֹרַת
  choice: du venin de
  rationale: Le nom peut signifier « fiel » ou « amertume », mais, associé à des serpents venimeux, il évoque leur poison. « Venin » communique directement cette image au lecteur moderne.
- source_word: פְּתָנִים
  choice: cobras
  rationale: Le mot hébreu désigne un serpent venimeux, traditionnellement rendu par « aspic ». « Cobras » constitue un équivalent moderne clair sans perdre la précision de l’image.
- source_word: בְּקִרְבּוֹ
  choice: au-dedans de lui
  rationale: L’expression situe le venin à l’intérieur de l’homme. « Au-dedans de lui » conserve la force corporelle de l’image et évite de répéter exactement « dans son ventre ».
theological_decisions: []
