    issue: Le verbe « disparaîtra » est moins fort que le verbe hébreu יֹאבֵד.
    rationale: אבד indique normalement périr, être détruit ou se perdre. Le contexte permet l’idée de disparition, mais « périra » préserve mieux la portée de ruine et de jugement du texte source.
  - severity: low
    issue: « Ses propres excréments » peut suggérer une insistance sur « propres » qui n’est pas explicitement marquée en hébreu.
    rationale: Le suffixe de גֶלֲלוֹ signifie « ses excréments / son excrément ». L’ajout peut être idiomatique, mais il n’est pas nécessaire pour rendre le possessif.
  revised_text: 'Comme ses excréments, il périra à jamais ; ceux qui l’ont vu diront : « Où est-il ? »'
