  text: כְּֽ֭/גֶלֲל/וֹ לָ/נֶ֣צַח יֹאבֵ֑ד רֹ֝אָ֗י/ו יֹאמְר֥וּ אַיּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/007.yaml
  text: Like his own dung[a], he will perish forever; those who saw him will say, ‘Where is he?’
translation:
  language: fr
  text: 'Comme ses excréments, il périra à jamais ; ceux qui l’ont vu diront : « Où est-il ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּגֶלֲלוֹ
  choice: Comme ses propres excréments
  rationale: גֶּלֶל désigne les excréments ou les déjections. « Excréments » préserve l’image volontairement humiliante tout en restant naturel dans un registre écrit digne ; « ses propres » rend explicitement le suffixe possessif.
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: Cette expression marque ici une disparition durable et définitive ; « pour toujours » en restitue naturellement la force.
- source_word: יֹאבֵד
  choice: il disparaîtra
  rationale: Le verbe אבד peut exprimer le fait de périr ou de disparaître. Dans ce contexte, la question « Où est-il ? » met en relief la disparition totale ; « disparaîtra » conserve ce lien sans exclure l’idée de ruine.
- source_word: רֹאָיו
  choice: ceux qui l’ont vu
  rationale: Le participe substantivé avec suffixe désigne ceux qui l’ont vu ou connu auparavant. Le passé composé est idiomatique en français et convient au regard rétrospectif.
- source_word: יֹאמְרוּ
  choice: diront
  rationale: אמר signifie directement « dire » ; la proposition interrogative qui suit indique que ces paroles prennent la forme d’une question.
- source_word: אַיּוֹ
  choice: Où est-il ?
  rationale: L’interrogatif de lieu avec suffixe pronominal signifie simplement « Où est-il ? », sans qu’il soit nécessaire d’ajouter « maintenant ».
