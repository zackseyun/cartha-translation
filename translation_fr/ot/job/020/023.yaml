base_translation:
  language: en
  yaml_path: translation/ot/job/020/023.yaml
  text: When he is about to fill his belly[a], he will send against him the burning of his anger and rain it upon him as his food.
translation:
  language: fr
  text: Quand il sera sur le point de remplir son ventre, Dieu enverra contre lui l’ardeur de sa colère et la fera pleuvoir sur lui comme sa nourriture.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La dernière expression hébraïque est difficile. Elle peut aussi être comprise comme « pendant qu’il mange » ou « sur/avec sa nourriture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי לְמַלֵּא בִטְנוֹ
  choice: Quand il sera sur le point de remplir son ventre
  rationale: Le tour avec היה et l’infinitif introduit ici naturellement la circonstance temporelle du jugement. « Remplir son ventre » conserve l’image concrète de l’appétit et de l’abondance.
- source_word: יְשַׁלַּח בּוֹ
  choice: Dieu déchaînera contre lui
  rationale: Le sujet implicite est Dieu dans le contexte. « Déchaîner » rend naturellement l’envoi hostile d’une colère, tandis que « contre lui » exprime la direction adversative de בּוֹ.
- source_word: חֲרוֹן אַפּוֹ
  choice: son ardente colère
  rationale: Cette formulation française claire conserve l’image de la chaleur ou de l’embrasement inhérente à חֲרוֹן.
- source_word: וְיַמְטֵר עָלֵימוֹ
  choice: et la fera pleuvoir sur lui
  rationale: Le causatif de מטר est rendu explicitement par « fera pleuvoir », ce qui préserve l’image d’un jugement tombant comme une pluie. Le pronom poétique עָלֵימוֹ renvoie ici au méchant singulier.
- source_word: בִּלְחוּמוֹ
  choice: pour qu’elle soit sa nourriture
  rationale: Le terme final est difficile, mais il paraît lié à la nourriture ou au repas. Cette traduction maintient le lien direct entre la colère qui pleut et ce que le méchant reçoit comme nourriture, tout en signalant l’incertitude en note.
theological_decisions:
- issue: Sujet implicite des verbes de jugement
  choice: Dieu est nommé explicitement comme sujet.
  alternative: Conserver un simple « il », ou recourir à une tournure passive.
  rationale: Le contexte immédiat présente la rétribution divine, et « sa colère » renvoie le plus naturellement à Dieu. Le nommer évite en français une référence pronominale obscure sans ajouter une affirmation étrangère au passage.
- issue: Rapport de בִּלְחוּמוֹ avec le jugement
  choice: La colère devient figurativement la nourriture du méchant.
  alternative: Le jugement tombe « pendant qu’il mange » ou « sur sa nourriture ».
  rationale: La syntaxe et le lexème sont difficiles. La traduction retenue préserve le lien alimentaire direct sans effacer les autres analyses possibles, qui sont indiquées en note.
translation_notes:
  register: Français international moderne, naturel et digne. L’image corporelle du ventre et la métaphore de la colère qui pleut sont conservées; l’ambiguïté de la dernière expression est explicitement signalée.
