revisions:
- from: Quand il sera sur le point de remplir son ventre, Dieu déchaînera contre lui son ardente colère et la fera pleuvoir sur lui pour qu’elle soit sa nourriture.[a]
  to: Quand il sera sur le point de remplir son ventre, Dieu enverra contre lui l’ardeur de sa colère et la fera pleuvoir sur lui comme sa nourriture.[a]
  rationale: La révision évite d’imposer une relation de but absente du texte et préserve l’ambiguïté reconnue de בִּלְחוּמוֹ. Elle remplace aussi « déchaînera » par « enverra », rendu plus direct de יְשַׁלַּח. Le reste de l’imagerie et le sujet divin contextuellement implicite sont conservés.
  reviewer_model: gpt-5.6-terra
