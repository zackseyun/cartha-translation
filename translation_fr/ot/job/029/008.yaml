  text: רָא֣וּ/נִי נְעָרִ֣ים וְ/נֶחְבָּ֑אוּ וִֽ֝/ישִׁישִׁים קָ֣מוּ עָמָֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/008.yaml
  text: The young men saw me and withdrew[a], and the aged rose and stood.
translation:
  language: fr
  text: Les jeunes gens me voyaient et se retiraient[a] ; les hommes âgés se levaient et restaient debout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se cachaient » ; le verbe hébreu peut signifier « se cacher », mais il exprime probablement ici le fait de s’effacer respectueusement devant Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּנִי
  choice: me voyaient
  rationale: Le verbe ראה exprime ici simplement la perception visuelle. L’imparfait français convient au tableau rétrospectif et aux actions habituelles décrites dans ce passage.
- source_word: נְעָרִים
  choice: les jeunes gens
  rationale: Le nom masculin pluriel désigne de jeunes hommes. « Jeunes gens » est naturel, exact quant au genre et adapté au registre poétique.
- source_word: וְנֶחְבָּאוּ
  choice: se retiraient
  rationale: Le niphal de חבא signifie littéralement « se cacher », mais, dans ce contexte d’honneur social, il évoque probablement des jeunes gens qui s’effacent ou se mettent à l’écart par respect. « Se retiraient » rend cette force contextuelle sans effacer le sens littéral, conservé en note.
- source_word: וִישִׁישִׁים
  choice: les hommes âgés
  rationale: ישישים désigne des hommes avancés en âge. Cette formulation évite « anciens », qui pourrait suggérer une fonction officielle plutôt que l’âge.
- source_word: קָמוּ
  choice: se levaient
  rationale: קום décrit l’action initiale de se lever en signe de respect.
- source_word: עָמָדוּ
  choice: restaient debout
  rationale: Après קום, עמד indique qu’ils demeuraient debout. Cette traduction conserve les deux mouvements distincts du texte hébreu tout en produisant un français naturel.
