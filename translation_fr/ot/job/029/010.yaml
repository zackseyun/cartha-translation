source:
  edition: WLC
  text: קוֹל נְגִידִ֥ים נֶחְבָּ֑אוּ וּ֝/לְשׁוֹנָ֗/ם לְ/חִכָּ֥/ם דָּבֵֽקָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/010.yaml
  text: The voice of nobles was hushed[b][a], and their tongue stuck to the roof of their mouth.
translation:
  language: fr
  text: La voix des notables se taisait, et leur langue restait collée à leur palais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur langue s’attachait à leur palais », image exprimant l’incapacité ou le refus de parler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: voix
  rationale: Avec des personnes comme référent, « voix » rend naturellement le son de leur parole et convient au parallélisme poétique.
- source_word: נְגִידִים
  choice: notables
  rationale: Le terme désigne des hommes de haut rang, dirigeants ou princes. « Notables » conserve ici l’idée de prééminence sociale sans imposer un titre monarchique précis.
- source_word: נֶחְבָּאוּ
  choice: s’éteignait
  rationale: Le verbe signifie fondamentalement « se cacher ». Appliqué à la voix, il évoque une voix qui disparaît, donc qui se tait; « s’éteignait » préserve cette image en français naturel.
- source_word: וּלְשׁוֹנָם
  choice: et leur langue
  rationale: L’hébreu emploie un singulier collectif avec un possesseur pluriel; le français peut conserver naturellement « leur langue ».
- source_word: לְחִכָּם
  choice: à leur palais
  rationale: Le nom désigne le palais, c’est-à-dire la partie supérieure intérieure de la bouche. « Palais » est précis et idiomatique en français.
- source_word: דָּבֵקָה
  choice: restait collée
  rationale: Le verbe signifie « s’attacher, coller ». Cette formulation transmet clairement l’image d’une incapacité ou d’une réticence à parler.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. L’imparfait s’accorde au souvenir narratif de Job 29 et présente l’attitude habituelle des notables en sa présence.
