  yaml_path: translation/ot/job/029/012.yaml
  text: For I delivered the poor who cried for help[a], and the fatherless who had no helper.
translation:
  language: fr
  text: Car je délivrais le pauvre qui appelait au secours, et l’orphelin[a] qui n’avait personne pour l’aider.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu désigne plus précisément une personne privée de père, particulièrement vulnérable dans la société de l’époque.
    reason: 'Précision lexicale : le français « orphelin » peut désigner une personne ayant perdu son père, sa mère ou ses deux parents.'
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’estime dont Job jouissait, en continuité avec le contexte précédent.
- source_word: אֲמַלֵּט
  choice: je délivrais
  rationale: Le piel de מלט exprime une intervention active pour arracher quelqu’un au danger. L’imparfait rend ici l’action habituelle évoquée rétrospectivement.
- source_word: עָנִי
  choice: le pauvre
  rationale: Dans ce contexte de justice sociale, le terme désigne naturellement une personne pauvre et vulnérable, sans exclure la nuance d’affliction.
- source_word: מְשַׁוֵּעַ
  choice: qui appelait au secours
  rationale: La proposition relative rend naturellement en français le participe décrivant une personne en train de lancer un appel à l’aide.
- source_word: יָתוֹם
  choice: l’orphelin
  rationale: « Orphelin » est le terme français courant pour cette catégorie sociale vulnérable, bien que l’hébreu désigne plus précisément une personne privée de père.
- source_word: וְלֹא עֹזֵר לוֹ
  choice: qui n’avait personne pour l’aider
  rationale: Formulation française naturelle qui conserve l’idée que l’orphelin ne disposait d’aucun soutien.
