  yaml_path: translation/ot/job/029/017.yaml
  text: I broke the fangs of the unrighteous, and from his teeth I threw the prey.
translation:
  language: fr
  text: 'Je brisais les crocs de l’injuste,

    et je jetais la proie hors de ses dents.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲשַׁבְּרָה
  choice: Je brisais
  rationale: Le waw narratif dans ce souvenir autobiographique s’intègre naturellement à la série d’actions habituelles décrites au passé; l’imparfait français convient au contexte de Job 29.
- source_word: מְתַלְּעוֹת
  choice: les crocs
  rationale: Le terme désigne les mâchoires ou les fortes dents d’un prédateur. « Crocs » conserve l’image animale et s’accorde avec la proie retenue entre les dents.
- source_word: עַוָּל
  choice: de l’injuste
  rationale: Le singulier substantivé désigne celui qui agit avec injustice; « l’injuste » est naturel et fidèle sans ajouter de qualification doctrinale.
- source_word: אַשְׁלִיךְ
  choice: j’arrachais
  rationale: Le verbe signifie littéralement « jeter, faire sortir ». Avec une proie tirée des dents d’un prédateur, le français idiomatique « arracher » exprime l’extraction énergique impliquée par l’image, sans changer son résultat.
- source_word: טָרֶף
  choice: la proie
  rationale: Sens direct du nom dans la métaphore du prédateur; il représente ici la victime délivrée de l’oppresseur.
theological_decisions:
- issue: Nature de l’image de justice exercée par Job
  choice: Conserver la métaphore animale sans expliciter son référent humain
  alternative: Paraphraser en disant que Job délivrait les victimes des oppresseurs
  rationale: Le texte présente l’injuste comme un prédateur et la personne opprimée comme sa proie. L’image doit rester vive et ouverte plutôt que d’être réduite à une explication.
translation_notes:
  register: Français moderne, sobre et dignifié. Le parallélisme poétique est conservé sur deux lignes. « Crocs » et « proie » maintiennent la vigueur concrète de la métaphore.
