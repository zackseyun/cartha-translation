  text: כַּ/אֲשֶׁ֣ר הָ֭יִיתִי בִּ/ימֵ֣י חָרְפִּ֑/י בְּ/ס֥וֹד אֱ֝ל֗וֹהַּ עֲלֵ֣י אָהֳלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/004.yaml
  text: as I was in the days of my prime[a], when God's intimate counsel was over my tent[b],
translation:
  language: fr
  text: comme j’étais aux jours de ma pleine maturité[a], quand le conseil intime de Dieu était sur ma tente[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux jours de mon automne », c’est-à-dire à la saison de la pleine maturité ou de l’épanouissement.
    reason: lexical_alternative
  - marker: b
    text: Ou « quand le secret de Dieu était sur ma tente ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Conserve la valeur comparative qui prolonge le souhait exprimé dans le contexte, tout en restant naturel en français.
- source_word: הָיִיתִי
  choice: j’étais
  rationale: Le qatal à la première personne est rendu par l’imparfait, adapté à l’évocation d’un état passé durable.
- source_word: בִּימֵי
  choice: aux jours de
  rationale: Maintient l’image temporelle hébraïque dans une formulation française digne et intelligible.
- source_word: חָרְפִּי
  choice: ma pleine maturité
  rationale: Le terme peut évoquer l’automne, saison de récolte, puis par extension la maturité florissante. « Pleine maturité » communique ce sens sans réduire le passage à la jeunesse.
- source_word: בְּסוֹד
  choice: les conseils intimes
  rationale: סוֹד peut désigner un conseil confidentiel, un cercle intime ou une communion proche. Cette formulation conserve les dimensions relationnelle et délibérative.
- source_word: אֱלוֹהַּ
  choice: de Dieu
  rationale: Rend naturellement en français la relation entre סוֹד et Dieu.
- source_word: עֲלֵי
  choice: reposaient sur
  rationale: Exprime la présence bienveillante étendue sur la tente tout en conservant l’image spatiale de l’hébreu.
- source_word: אָהֳלִי
  choice: ma tente
  rationale: Préserve l’image concrète du texte, qui peut aussi englober la demeure et la maisonnée.
theological_decisions:
- issue: Sens de בְּסוֹד אֱלוֹהַּ dans la relation passée de Job avec Dieu
  choice: « les conseils intimes de Dieu reposaient sur ma tente », évoquant proximité, faveur et communication confidentielle sans affirmer une révélation technique particulière
  alternative: « le conseil secret de Dieu était sur ma tente » ou « l’amitié de Dieu reposait sur ma tente »
  rationale: L’hébreu permet à la fois l’idée de conseil confidentiel et celle de proximité familière. Le pluriel français naturel conserve cette richesse sans la réduire à la seule amitié ni à un secret révélé.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste liée au souhait des versets précédents; la virgule finale signale que la phrase se poursuit. Les images de la saison et de la tente sont conservées, la première étant explicitée en note.
