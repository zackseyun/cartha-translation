  source_fidelity: 'La traduction rend bien la comparaison rétrospective de כַּאֲשֶׁר, l’état passé de הָיִיתִי, l’image temporelle de חָרְפִּי et l’image concrète de la tente. Toutefois, סוֹד est au singulier : « les conseils intimes » introduit un pluriel absent du texte et atténue l’image d’un conseil/secret divin unique. « Était sur ma tente » conserve sans interprétation excessive la formulation spatiale de עֲלֵי.'
