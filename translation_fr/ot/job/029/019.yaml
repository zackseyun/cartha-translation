  text: שָׁרְשִׁ֣/י פָת֣וּחַ אֱלֵי מָ֑יִם וְ֝/טַ֗ל יָלִ֥ין בִּ/קְצִירִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/019.yaml
  text: My roots were spread out to the waters[a], and dew stayed overnight on my branches.
translation:
  language: fr
  text: 'Ma racine s’étendait vers les eaux,

    et la rosée passait la nuit sur mes branches.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ma moisson ». Le mot hébreu est inhabituel dans ce contexte; « branches » s’accorde plus naturellement avec l’image végétale de la racine et de la rosée.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשִׁי
  choice: Ma racine
  rationale: Le nom hébreu est morphologiquement au singulier avec le suffixe de première personne. Le singulier est naturel en français poétique et conserve au plus près la forme de l’hébreu.
- source_word: פָתוּחַ
  choice: s’étendait
  rationale: Le participe décrit une racine ouverte ou déployée. « S’étendait » rend naturellement cet état et s’accorde avec l’orientation exprimée par אֱלֵי.
- source_word: אֱלֵי מָיִם
  choice: vers les eaux
  rationale: אֱלֵי exprime ici la direction ou l’orientation; « vers » la préserve. Le pluriel « les eaux » maintient la forme et la richesse poétique de מָיִם.
- source_word: וְטַל
  choice: et la rosée
  rationale: Traduction directe et idiomatique de טַל.
- source_word: יָלִין
  choice: passait la nuit
  rationale: Le verbe לון signifie loger ou demeurer pendant la nuit. Cette expression française moderne conserve clairement la nuance temporelle.
- source_word: בִּקְצִירִי
  choice: sur mes branches
  rationale: Le sens habituel de קָצִיר est « moisson », mais il s’accorde difficilement ici avec la rosée et le parallèle végétal de la racine. Le sens contextuel « branches » rend l’image cohérente, tout en signalant l’alternative plus littérale en note.
