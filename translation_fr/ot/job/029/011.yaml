source:
  edition: WLC
  text: כִּ֤י אֹ֣זֶן שָׁ֭מְעָה וַֽ/תְּאַשְּׁרֵ֑/נִי וְ/עַ֥יִן רָ֝אֲתָ֗ה וַ/תְּעִידֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/011.yaml
  text: For when an ear heard[a], it called me blessed, and when an eye saw, it testified for me.
translation:
  language: fr
  text: Car l’oreille qui m’entendait me disait heureux, et l’œil qui me voyait témoignait en ma faveur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « témoignait de moi » ou « rendait témoignage à mon sujet » ; dans ce contexte, ce témoignage est favorable à Job.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’honneur dont Job jouissait autrefois et assure une transition naturelle avec le contexte précédent.
- source_word: אֹזֶן שָׁמְעָה
  choice: l’oreille qui m’entendait
  rationale: Conserve l’image corporelle et le singulier générique de l’hébreu. Le complément « me » est implicite dans le parallélisme et rend la phrase naturelle en français.
- source_word: וַתְּאַשְּׁרֵנִי
  choice: me disait heureux
  rationale: 'Rend le sens déclaratif du verbe : reconnaître ou proclamer quelqu’un heureux, digne d’être estimé. Cette formulation reste naturelle sans suggérer nécessairement une bénédiction prononcée.'
- source_word: וְעַיִן רָאֲתָה
  choice: et l’œil qui me voyait
  rationale: Préserve le parallélisme poétique entre l’oreille et l’œil ainsi que leur emploi générique. Le complément implicite est explicité pour la clarté.
- source_word: וַתְּעִידֵנִי
  choice: témoignait en ma faveur
  rationale: Le verbe exprime un témoignage concernant Job ; le contexte indique qu’il lui est favorable. « Témoignait » conserve le champ judiciaire possible du terme.
theological_decisions:
- issue: Portée favorable du témoignage rendu à Job
  choice: témoignait en ma faveur
  alternative: témoignait à mon sujet / témoignait de moi
  rationale: L’hébreu peut exprimer plus généralement un témoignage concernant Job, mais le contexte de son ancien honneur montre qu’il s’agit ici d’une attestation favorable. Une note conserve la formulation plus littérale.
translation_notes:
  register: Français moderne, soutenu mais accessible. Le parallélisme poétique de l’oreille et de l’œil est conservé, avec explicitation discrète de Job comme objet implicite de l’audition et de la vue.
