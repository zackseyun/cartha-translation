lexical_decisions:
- source_word: בְּצֵאתִי
  choice: Quand je sortais
  rationale: La préposition בְּ avec l’infinitif construit de יצא et le suffixe de première personne a ici une valeur temporelle. L’imparfait français évoque naturellement l’habitude passée décrite par Job.
- source_word: שַׁעַר עֲלֵי קָרֶת
  choice: vers la porte de la ville
  rationale: Le syntagme désigne vraisemblablement la porte liée à la ville, lieu de la vie civique et judiciaire. « Vers » conserve la nuance directionnelle possible de עֲלֵי sans imposer une analyse trop précise de l’expression idiomatique.
- source_word: בָּרְחוֹב
  choice: sur la place
  rationale: רְחוֹב peut désigner un large espace public plutôt qu’une rue étroite. « La place » restitue clairement ce cadre civique en français moderne.
- source_word: אָכִין
  choice: j’installais
  rationale: Le hifil de כון exprime ici l’action de préparer ou de mettre en place. Avec « mon siège », « installais » est naturel et n’implique pas nécessairement un établissement permanent.
- source_word: מוֹשָׁבִי
  choice: mon siège
  rationale: Dans le contexte de la porte et de la place publique, מוֹשָׁב désigne le siège ou la place où Job prenait position, et non son habitation.
