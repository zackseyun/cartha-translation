  text: Quand je sortais pour aller à la porte de la ville[a], quand je préparais mon siège sur la place[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « la porte, vers/à la ville ». L’hébreu mentionne distinctement « la porte » et « la ville », et le rapport exact entre les deux dans cette expression est discuté.
