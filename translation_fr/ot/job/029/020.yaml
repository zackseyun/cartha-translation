  yaml_path: translation/ot/job/029/020.yaml
  text: My glory was ever fresh with me[b][a], and my bow was renewed in my hand.
translation:
  language: fr
  text: Ma gloire restera fraîche auprès de moi[a], et mon arc se renouvellera dans ma main[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ma gloire sera nouvelle avec moi. » L’adjectif hébreu peut signifier « nouvelle » ; dans ce contexte, il évoque probablement une gloire qui demeure fraîche, intacte.'
    reason: lexical_alternative
  - marker: b
    text: L’arc représente probablement ici la force ou la vigueur, mais l’hébreu conserve cette image concrète.
    reason: cultural_note
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: ma gloire
  rationale: Le nom כָּבוֹד peut désigner la gloire, l’honneur ou la dignité. « Ma gloire » conserve l’ampleur de l’image sans la réduire à la seule réputation sociale.
- source_word: חָדָשׁ
  choice: fraîche
  rationale: L’adjectif signifie littéralement « nouveau ». Dans ce parallélisme poétique, « fraîche » exprime naturellement une gloire qui demeure intacte et vigoureuse.
- source_word: עִמָּדִי
  choice: auprès de moi
  rationale: La locution signifie littéralement « avec moi ». « Auprès de moi » rend ici de façon naturelle l’idée que cette gloire demeure attachée à Job.
- source_word: קַשְׁתִּי
  choice: mon arc
  rationale: Le terme désigne concrètement l’arc. L’image, susceptible d’évoquer la force ou la vigueur, est conservée plutôt que remplacée par son interprétation.
- source_word: בְּיָדִי
  choice: dans ma main
  rationale: Cette traduction directe préserve l’image concrète d’une force disponible et maîtrisée.
- source_word: תַחֲלִיף
  choice: se renouvellera
  rationale: La forme hiphil de חלף peut exprimer ici le renouvellement. Le futur s’accorde avec le contexte du propos que Job rapporte à partir du verset 18, tout en conservant le parallélisme avec une gloire qui restera fraîche.
