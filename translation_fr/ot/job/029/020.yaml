  source_fidelity: 'Le texte rend correctement les deux imparfaits dans le cadre du discours rétrospectif de Job (v. 18) par des futurs : « restera » et « se renouvellera ». « Ma gloire », « fraîche », « auprès de moi », « mon arc » et « dans ma main » préservent les images et les relations du texte hébreu. « Auprès de moi » est une légère explicitation spatiale de עִמָּדִי (« avec moi »), mais demeure fidèle au sens contextuel de présence durable.'
