  terminology: « Gloire » conserve la polysémie de כָּבוֹד sans la réduire à l’honneur social. « Arc » maintient délibérément l’image hébraïque, sans imposer son interprétation comme force ou vigueur. Les notes sont bien ancrées et ne surinterprètent pas le passage.
