  text: מִֽי יִתְּנֵ֥/נִי כְ/יַרְחֵי קֶ֑דֶם כִּ֝/ימֵ֗י אֱל֣וֹהַּ יִשְׁמְרֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/002.yaml
  text: Oh[a], that I were as in months gone by, as in the days when God watched over me[b],
translation:
  language: fr
  text: Ah ! si seulement je pouvais retrouver les mois d’autrefois, les jours où Dieu veillait sur moi[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « me gardait » ou « me protégeait ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: Ah ! si je pouvais être
  rationale: L’expression hébraïque, littéralement « Qui me donnera… ? », formule ici un souhait nostalgique. La tournure française exprime naturellement ce souhait sans transformer la phrase en véritable question.
- source_word: כְיַרְחֵי קֶדֶם
  choice: comme aux mois d’autrefois
  rationale: כְּ marque la comparaison, יֶרַח désigne le mois et קֶדֶם renvoie ici au temps passé. Cette formulation conserve l’image inhabituelle mais poétique des « mois » révolus.
- source_word: כִּימֵי
  choice: comme aux jours où
  rationale: La formulation maintient le parallélisme temporel avec « comme aux mois d’autrefois » tout en reliant naturellement la proposition suivante.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Forme poétique singulière courante dans Job pour désigner Dieu ; rien ne justifie ici l’ajout de « Tout-Puissant ».
- source_word: יִשְׁמְרֵנִי
  choice: veillait sur moi
  rationale: Le verbe שׁמר peut signifier garder, protéger ou veiller sur. Dans ce souvenir des soins divins, « veillait sur moi » rend clairement l’idée d’une protection attentive.
theological_decisions:
- issue: L’action divine évoquée dans le souvenir de Job
  choice: Dieu veillait sur moi
  alternative: Dieu me gardait / me protégeait
  rationale: La traduction exprime les soins protecteurs que Job attribue à Dieu dans le passé, sans préciser davantage leur modalité ni introduire une affirmation doctrinale étrangère au texte.
translation_notes:
  register: Français moderne, digne et poétique. L’interjection « Ah ! » et la construction optative rendent la plainte nostalgique ; le parallélisme entre « mois » et « jours » est conservé.
