  text: when my steps were washed with curds[b][a], and the rock poured out for me streams of oil.
translation:
  language: fr
  text: 'quand mes pas étaient baignés de lait caillé[a]

    et que le rocher déversait près de moi[b] des ruisseaux d’huile.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « de crème » ou « de beurre » : le mot hébreu désigne un produit laitier épais qui peut être compris de plusieurs manières.'
    reason: lexical_alternative
  - marker: b
    text: Ou « avec moi » ou « auprès de moi » ; l’expression hébraïque est littéralement spatiale.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְחֹץ
  choice: quand … étaient baignés
  rationale: L’infinitif construit précédé de בְּ exprime ici naturellement une circonstance temporelle; le passif français conserve l’image concrète du verbe « laver, baigner ».
- source_word: הֲלִיכַי
  choice: mes pas
  rationale: Le nom peut désigner la marche ou le cours suivi. « Mes pas » maintient l’image corporelle et poétique sans l’abstraire en « conduite ».
- source_word: בְּחֵמָה
  choice: de lait caillé
  rationale: חֵמָה désigne un produit laitier épais, susceptible d’être compris comme lait caillé, crème ou beurre. « Lait caillé » évoque clairement le produit ancien et s’intègre naturellement à « baignés de ».
- source_word: וְצוּר
  choice: et … le rocher
  rationale: צוּר signifie « rocher » ou « roc ». L’article défini convient à cette évocation poétique générique d’une abondance jaillissant même du rocher.
- source_word: יָצוּק
  choice: déversait
  rationale: Le verbe יצק signifie verser ou répandre. « Déversait » conserve l’image d’un écoulement abondant et gouverne naturellement « des torrents ».
- source_word: עִמָּדִי
  choice: près de moi
  rationale: Cette forme signifie littéralement « avec moi » ou, spatialement, « auprès de moi ». « Près de moi » préserve cette proximité sans la transformer en datif de bénéficiaire.
- source_word: פַּלְגֵי
  choice: des torrents
  rationale: פַּלְגֵי désigne des cours, canaux ou courants. « Torrents » rend avec force l’hyperbole poétique de l’abondance.
- source_word: שָׁמֶן
  choice: d’huile
  rationale: שָׁמֶן désigne couramment l’huile, souvent l’huile d’olive dans ce contexte culturel; le terme général « huile » garde la concision de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international actuel, poétique et digne. Le parallélisme des deux propositions est conservé; « près de moi » maintient l’expression spatiale de l’hébreu, tandis que « torrents » restitue l’hyperbole d’une prospérité passée.
