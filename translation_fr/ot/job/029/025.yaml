  text: אֶֽבֲחַ֣ר דַּרְכָּ/ם֮ וְ/אֵשֵׁ֪ב רֹ֥אשׁ וְ֭/אֶשְׁכּוֹן כְּ/מֶ֣לֶךְ בַּ/גְּד֑וּד כַּ/אֲשֶׁ֖ר אֲבֵלִ֣ים יְנַחֵֽם׃
base_translation:
