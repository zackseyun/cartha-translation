  yaml_path: translation/ot/job/029/025.yaml
  text: I chose their way and sat as chief[a]; I dwelt like a king among the troops[c][b], like one who comforts mourners.
translation:
  language: fr
  text: Je choisissais leur voie et je siégeais à leur tête[a] ; je demeurais tel un roi au milieu d’une troupe[b], comme celui qui console les personnes en deuil[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je choisissais leur conduite et prenais place comme chef ». L’hébreu peut indiquer que Job déterminait ou approuvait la voie à suivre, puis occupait la position dirigeante.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tel un roi dans une bande ». Le mot hébreu peut désigner une troupe, une bande ou une compagnie.'
    reason: lexical_alternative
  - marker: c
    text: La dernière comparaison est difficile en hébreu. Elle peut souligner que Job consolait les personnes en deuil tout en occupant une place d’honneur.
    reason: textual_or_syntactic_difficulty
lexical_decisions:
- source_word: אֶבֲחַר דַּרְכָּם
  choice: Je choisissais leur voie
  rationale: 'Dans le cadre rétrospectif de Job 29, l’imparfait hébreu peut décrire une action habituelle passée. « Choisir leur voie » conserve l’expression concrète et son ambiguïté : Job pouvait déterminer ou approuver la conduite à suivre.'
- source_word: וְאֵשֵׁב רֹאשׁ
  choice: et je siégeais à leur tête
  rationale: La tournure exprime une position dirigeante tout en préservant l’image de Job assis à la place d’honneur. « Siéger » convient au registre poétique et institutionnel.
- source_word: וְאֶשְׁכּוֹן
  choice: je demeurais
  rationale: Le verbe שׁכן signifie demeurer, résider ou s’établir. L’imparfait français maintient ici la description habituelle du passé.
- source_word: כְּמֶלֶךְ בַּגְּדוּד
  choice: tel un roi au milieu de sa troupe
  rationale: Le préfixe כְּ marque la comparaison. גְּדוּד peut désigner une troupe, une bande ou une compagnie ; le singulier « sa troupe » rend naturellement l’image d’un roi entouré de ses hommes sans préciser indûment leur fonction.
- source_word: כַּאֲשֶׁר אֲבֵלִים יְנַחֵם
  choice: comme celui qui console les personnes en deuil
  rationale: La formulation rend intelligible le verbe singulier יְנַחֵם avec le pluriel אֲבֵלִים, tout en conservant la comparaison difficile du texte. « Personnes en deuil » est actuel et plus transparent que le substantif « endeuillés ».
theological_decisions:
- issue: Relation entre l’image royale et la consolation finale
  choice: Maintenir deux comparaisons successives sans expliciter leur rapport
  alternative: Comprendre la fin comme décrivant Job en « roi qui console les affligés » ou comme une proposition temporelle
  rationale: L’hébreu est syntaxiquement difficile. Il convient de préserver la tension entre l’autorité de Job et son rôle consolateur plutôt que de fixer une interprétation théologique ou syntaxique non certaine.
translation_notes:
  register: Français international moderne, digne et poétique. Les imparfaits rendent la rétrospective habituelle de Job 29. « Siégeais à leur tête » conserve à la fois l’image concrète et l’autorité sociale ; « personnes en deuil » privilégie la clarté courante.
