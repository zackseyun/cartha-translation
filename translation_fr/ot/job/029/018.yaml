  text: וָ֭/אֹמַר עִם קִנִּ֣/י אֶגְוָ֑ע וְ֝/כַ/ח֗וֹל אַרְבֶּ֥ה יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/018.yaml
  text: Then I said[a], ‘I will die in my nest, and I will multiply my days like the sand.’
translation:
  language: fr
  text: 'Je me disais : « Je mourrai dans mon nid et je multiplierai mes jours comme le sable[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « comme le phénix ». Certains comprennent ici le mot hébreu traduit par « sable » comme le nom d’un oiseau, mais le sens « sable » est plus probable dans ce contexte et correspond à l’image biblique courante d’une très grande quantité.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Je me disais
  rationale: Dans ce retour sur ses anciennes attentes, l’imparfait français exprime naturellement ce que Job se disait alors, tout en maintenant la progression de son souvenir.
- source_word: עִם קִנִּי
  choice: dans mon nid
  rationale: La préposition prend ici naturellement le sens de « dans » avec « nid ». Le nom concret est conservé afin de préserver l’image poétique d’une mort paisible chez soi.
- source_word: אֶגְוָע
  choice: je mourrai
  rationale: Le verbe désigne le fait d’expirer ou de mourir. Le futur convient à l’attente que Job entretenait à cette époque.
- source_word: וְכַחוֹל
  choice: comme le sable
  rationale: Le sens courant de חוֹל est « sable » et évoque ici une très grande quantité. L’interprétation possible comme nom d’un oiseau est signalée en note.
- source_word: אַרְבֶּה יָמִים
  choice: je multiplierai mes jours
  rationale: Le hiphil de רבה signifie « rendre nombreux, multiplier ». « Mes jours » explicite idiomatiquement que Job parle de la durée de sa propre vie, sans réduire la métaphore à une simple paraphrase.
theological_decisions:
- issue: Nature de חוֹל dans la comparaison
  choice: le sable
  alternative: le phénix
  rationale: Le sens lexical habituel et l’image biblique courante de l’innombrable favorisent « sable », mais l’autre compréhension ancienne demeure possible et mérite une note plutôt qu’une exclusion silencieuse.
translation_notes:
  register: Français moderne, digne et poétique. « Nid » maintient l’image concrète de la sécurité familiale; « multiplierai mes jours » conserve la formulation métaphorique de l’hébreu.
