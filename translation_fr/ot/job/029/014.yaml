source:
  edition: WLC
  text: צֶ֣דֶק לָ֭בַשְׁתִּי וַ/יִּלְבָּשֵׁ֑/נִי כִּֽ/מְעִ֥יל וְ֝/צָנִ֗יף מִשְׁפָּטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/014.yaml
  text: I put on righteousness[a], and it clothed me[b]; my justice was like a robe and a turban.
translation:
  language: fr
  text: J’ai revêtu la droiture[a], et elle m’a revêtu ; ma justice était comme un manteau et un turban[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « justice ». Le mot hébreu peut exprimer la droiture morale aussi bien que la justice.
    reason: lexical_alternative
  - marker: b
    text: Le turban est ici une étoffe enroulée autour de la tête, dans une image évoquant l’honneur et la dignité publique.
    reason: cultural_note
lexical_decisions:
- source_word: צֶדֶק
  choice: justice
  rationale: Le terme peut désigner la justice ou la droiture. « Justice » est naturel en français et exprime ici la qualité morale dont Job se revêt, tandis que « équité » dans le second membre évite d'aplatir les deux termes hébreux.
- source_word: לָבַשְׁתִּי
  choice: je me revêtais de
  rationale: Le verbe signifie mettre ou porter un vêtement. L'imparfait convient au rappel par Job de sa conduite habituelle et conserve l'image vestimentaire.
- source_word: וַיִּלְבָּשֵׁנִי
  choice: et elle me revêtait
  rationale: 'La répétition du même verbe préserve le retournement poétique : Job se revêt de justice, puis la justice elle-même le revêt.'
- source_word: כִּמְעִיל
  choice: comme un manteau
  rationale: מְעִיל désigne un vêtement extérieur ample ou une robe. « Manteau » est clair, actuel et digne.
- source_word: וְצָנִיף
  choice: et un turban
  rationale: צָנִיף désigne une étoffe enroulée autour de la tête. « Turban » est l'équivalent direct, accompagné d'une note culturelle.
- source_word: מִשְׁפָּטִי
  choice: mon équité
  rationale: מִשְׁפָּט peut évoquer le jugement, la justice ou l'exercice du droit. « Mon équité » rend ici la manière juste dont Job exerçait ses responsabilités publiques et distingue ce terme de צֶדֶק.
theological_decisions:
- issue: Rapport entre צֶדֶק et מִשְׁפָּטִי
  choice: justice / équité
  alternative: droiture / justice
  rationale: Les deux mots ont des champs sémantiques qui se recoupent. Le choix retenu maintient leur distinction sans imposer une opposition théologique trop précise ; la note signale l'autre rendu possible pour צֶדֶק.
translation_notes:
  register: Français international moderne, poétique et digne. La reprise de « revêtir » conserve le jeu verbal hébreu ; l'imparfait inscrit l'action dans l'évocation des habitudes passées de Job.
