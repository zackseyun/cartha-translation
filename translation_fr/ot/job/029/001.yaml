  text: וַ/יֹּ֣סֶף אִ֭יּוֹב שְׂאֵ֥ת מְשָׁל֗/וֹ וַ/יֹּאמַֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/001.yaml
  text: And Job continued, taking up his discourse, and said:[a]
translation:
  language: fr
  text: Job reprit son discours et dit :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa sentence », « sa parabole » ou « son oracle ». Le mot hébreu mashal a un sens large ; ici, il introduit le long discours poétique de Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: poursuivit
  rationale: 'Dans cette construction avec l’infinitif שְׂאֵת, le verbe יסף exprime la continuation : Job reprend et prolonge sa prise de parole.'
- source_word: אִיּוֹב
  choice: Job
  rationale: Forme française traditionnelle du nom propre.
- source_word: שְׂאֵת
  choice: son discours
  rationale: L’infinitif de נשׂא signifie littéralement « lever, porter, prendre ». Avec מָשָׁל, il forme l’expression « prendre la parole » ou « prononcer un discours » ; la tournure française fusionne naturellement cette nuance avec le verbe « poursuivre ».
- source_word: מְשָׁלוֹ
  choice: son discours
  rationale: 'מָשָׁל possède un champ sémantique étendu : proverbe, parabole, sentence, oracle ou discours poétique. Ici, il désigne la longue allocution poétique de Job ; « discours » convient donc au contexte sans la réduire à un proverbe bref.'
- source_word: וַיֹּאמַר
  choice: en disant
  rationale: Cette formule narrative introduit les paroles directes qui suivent. « En disant » rend la relation syntaxique avec la proposition précédente dans un français fluide.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation évite le calque lourd « continua, prenant son discours » tout en conservant l’idée de continuation et la valeur littéraire de מָשָׁל.
