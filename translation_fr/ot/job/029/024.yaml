  yaml_path: translation/ot/job/029/024.yaml
  text: I smiled at them—they did not believe it[c][b][a]; and they did not cast down the light of my face.
translation:
  language: fr
  text: Je leur souriais[a], et ils n’y croyaient pas[b] ; ils ne faisaient pas pâlir la lumière de mon visage[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je riais à leur adresse » ; le verbe hébreu peut désigner le rire aussi bien que le sourire.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils ne croyaient pas ». Cette expression peut traduire leur étonnement devant la faveur que Job leur témoignait.'
    reason: ambiguity_note
  - marker: c
    text: 'Littéralement : « ils ne faisaient pas tomber la lumière de mon visage ». La « lumière du visage » évoque une expression rayonnante et favorable.'
    reason: cultural_note
lexical_decisions:
- source_word: אֶשְׂחַק
  choice: Je leur souriais
  rationale: Le verbe שׂחק peut exprimer le rire ou le sourire. Dans ce contexte, « sourire » rend naturellement l’attitude favorable et digne de Job, tout en restant en harmonie avec l’image lumineuse de son visage.
- source_word: אֲלֵהֶם
  choice: leur
  rationale: La préposition אֶל indique ici l’orientation du sourire vers les personnes concernées ; le pronom indirect « leur » est la tournure française naturelle.
- source_word: לֹא יַאֲמִינוּ
  choice: ils n’y croyaient pas
  rationale: Cette formulation reste proche du sens littéral, « ils ne croyaient pas », sans imposer si leur réaction relevait de l’étonnement, de l’incrédulité ou d’une autre nuance contextuelle.
- source_word: וְאוֹר פָּנַי
  choice: la lumière de mon visage
  rationale: La traduction conserve l’image hébraïque d’un visage lumineux, signe d’une expression favorable ou bienveillante.
- source_word: לֹא יַפִּילוּן
  choice: ils ne faisaient pas pâlir
  rationale: Le hiphil de נפל signifie littéralement « faire tomber ». Avec « la lumière » pour objet, « faire pâlir » exprime naturellement en français l’idée de la faire diminuer, tout en conservant la métaphore.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’image poétique du visage lumineux, tandis que « faire pâlir » évite un calque peu naturel. Les notes maintiennent les ambiguïtés lexicales et contextuelles de l’hébreu.
