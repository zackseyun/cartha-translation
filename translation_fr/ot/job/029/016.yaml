id: JOB.29.16
reference: Job 29:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֣ב אָ֭נֹכִֽי לָֽ/אֶבְיוֹנִ֑ים וְ/רִ֖ב לֹא יָדַ֣עְתִּי אֶחְקְרֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/016.yaml
  text: I was a father to the poor[a], and I investigated the case of one I did not know.
translation:
  language: fr
  text: J’étais un père pour les pauvres, et j’examinais à fond une cause que je ne connaissais pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’examinais la cause de quelqu’un que je ne connaissais pas ».'
    reason: La construction hébraïque permet de rapporter l’absence de connaissance soit à la cause elle-même, soit à la personne dont Job défendait la cause.
lexical_decisions:
- source_word: אָב
  choice: un père
  rationale: Le nom signifie littéralement « père ». Ici, l’image évoque la protection et le soutien accordés aux personnes vulnérables; la conserver respecte la force morale de l’hébreu.
- source_word: אָנֹכִי
  choice: j’étais
  rationale: Le pronom indépendant est emphatique, tandis que la proposition hébraïque est sans verbe exprimé. Le cadre rétrospectif de Job 29 appelle naturellement l’imparfait en français.
- source_word: לָאֶבְיוֹנִים
  choice: pour les pauvres
  rationale: אֶבְיוֹן désigne les pauvres ou les nécessiteux. « Pour » exprime idiomatiquement en français le rôle protecteur exercé en leur faveur.
- source_word: רִיב
  choice: une cause
  rationale: רִיב peut désigner un différend, une plainte ou une affaire judiciaire. « Cause » convient au contexte d’examen et de défense sans imposer un cadre juridique trop technique.
- source_word: לֹא יָדַעְתִּי
  choice: que je ne connaissais pas
  rationale: ידע exprime ici l’absence de connaissance préalable. La formulation française maintient comme antécédent immédiat « une cause », conformément à la syntaxe la plus directe.
- source_word: אֶחְקְרֵהוּ
  choice: j’examinais à fond
  rationale: חקר signifie rechercher, sonder ou examiner soigneusement. « À fond » rend l’idée d’une enquête poussée, et l’imparfait correspond aux actions habituelles évoquées dans ce chapitre.
theological_decisions:
- issue: Objet de l’absence de connaissance
  choice: Job examinait une cause qu’il ne connaissait pas encore.
  alternative: Job examinait la cause d’une personne qu’il ne connaissait pas.
  rationale: Le suffixe masculin d’אֶחְקְרֵהוּ peut reprendre רִיב, également masculin, et la lecture la plus directe rattache לֹא יָדַעְתִּי à la cause. Toutefois, le contexte de défense des vulnérables permet aussi de comprendre qu’il s’agissait de la cause d’un inconnu; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. L’image concrète du « père » est conservée; « j’examinais à fond » exprime une enquête attentive sans jargon judiciaire.
