base_translation:
  language: en
  yaml_path: translation/ot/job/029/015.yaml
  text: I was eyes to the blind[a], and feet to the lame.
translation:
  language: fr
  text: J’étais des yeux pour l’aveugle[a], et des pieds pour celui qui boitait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « J’étais comme des yeux pour l’aveugle et comme des pieds pour celui qui boitait. »'
    reason: La métaphore prédicative hébraïque peut être explicitée par « comme », sans que ce mot figure dans le texte source.
lexical_decisions:
- source_word: עֵינַיִם
  choice: des yeux
  rationale: Le pluriel prédicatif conserve l’image concrète par laquelle Job décrit l’aide et l’orientation qu’il apportait.
- source_word: הָיִיתִי
  choice: J’étais
  rationale: Le qal accompli à la première personne décrit ici le rôle passé de Job dans ce passage rétrospectif.
- source_word: לַעִוֵּר
  choice: pour l’aveugle
  rationale: La préposition ל exprime ici la relation ou le bénéfice; le singulier défini a une portée représentative.
- source_word: וְרַגְלַיִם
  choice: et des pieds
  rationale: La formulation concrète et parallèle à « des yeux » préserve la métaphore poétique de l’aide à la mobilité.
- source_word: לַפִּסֵּחַ
  choice: pour celui qui ne pouvait pas marcher
  rationale: Cette formulation naturelle et respectueuse exprime l’incapacité de marcher désignée par le terme hébreu, sans employer une désignation aujourd’hui potentiellement dépréciative.
- source_word: אָנִי
  choice: implicite dans « J’étais »
  rationale: Le pronom indépendant renforce le sujet en hébreu; en français, un ajout final tel que « moi » serait lourd, tandis que la tournure avec « J’étais » garde naturellement Job au premier plan.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme et les images corporelles de l’hébreu sont conservés; la seconde désignation est formulée en langage courant et respectueux.
