  text: וְ/יִֽחֲל֣וּ כַ/מָּטָ֣ר לִ֑/י וּ֝/פִי/הֶ֗ם פָּעֲר֥וּ לְ/מַלְקֽוֹשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/023.yaml
  text: They waited for me as for the rain[a], and they opened their mouths wide for the spring rain.
translation:
  language: fr
  text: Ils m’attendaient comme on attend la pluie, et ils ouvraient grand la bouche devant la pluie tardive[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la pluie de printemps ». Le mot hébreu désigne la pluie de fin de saison.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִחֲלוּ
  choice: Ils m’attendaient
  rationale: Le verbe יחל exprime ici une attente confiante. « Attendaient » convient à l’image de la pluie espérée sans accentuer excessivement l’émotion.
- source_word: כַמָּטָר לִי
  choice: comme on attend la pluie
  rationale: Cette formulation française naturelle rend la comparaison introduite par כ et rattache explicitement l’attente à la pluie, tout en conservant « m’ » pour לִי.
- source_word: וּפִיהֶם פָּעֲרוּ
  choice: et ils ouvraient grand la bouche
  rationale: פער signifie ouvrir largement, particulièrement la bouche. L’imparfait maintient le tableau rétrospectif et l’action habituelle du contexte.
- source_word: לְמַלְקוֹשׁ
  choice: pour recevoir la pluie tardive
  rationale: מַלְקוֹשׁ désigne la pluie de fin de saison agricole. « Pluie tardive » préserve cette précision saisonnière; « pour recevoir » rend naturelle en français l’image d’une bouche ouverte en direction de cette pluie.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La répétition de « pluie » conserve le parallélisme et l’image agricole. L’ajout explicatif minimal « pour recevoir » évite en français l’expression peu naturelle « ouvrir la bouche pour la pluie » sans préciser que Job parle de sa parole ou de ses conseils.
