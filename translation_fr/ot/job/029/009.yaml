  text: שָׂ֭רִים עָצְר֣וּ בְ/מִלִּ֑ים וְ֝/כַ֗ף יָשִׂ֥ימוּ לְ/פִי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/009.yaml
  text: Princes held back their words[a], and put their hand over their mouth.
translation:
  language: fr
  text: 'Les princes retenaient leurs paroles[a]

    et mettaient la main sur leur bouche.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dignitaires s’abstenaient de parler ».
    reason: Alternative lexicale et formulation idiomatique de שָׂרִים עָצְרוּ בְמִלִּים.
lexical_decisions:
- source_word: שָׂרִים
  choice: Les princes
  rationale: Le terme désigne des personnages de haut rang, dirigeants ou dignitaires. « Princes » conserve le statut social élevé et convient à la scène de déférence publique.
- source_word: עָצְרוּ
  choice: retenaient
  rationale: Le verbe exprime ici l'idée de se contenir ou de s'abstenir; « retenaient » s'emploie naturellement avec « paroles ».
- source_word: בְמִלִּים
  choice: leurs paroles
  rationale: Littéralement « en/avec des paroles »; après עָצְרוּ, l'expression indique qu'ils retenaient ce qu'ils auraient dit. Le possessif implicite est explicité pour un français naturel.
- source_word: וְכַף
  choice: la main
  rationale: כַּף peut désigner la paume ou la main. Dans ce geste conventionnel de silence, « la main » est le terme français naturel.
- source_word: יָשִׂימוּ
  choice: mettaient
  rationale: Le verbe signifie « mettre, placer ». L'imparfait s'accorde avec le récit rétrospectif et la description d'une conduite habituelle dans le contexte.
- source_word: לְפִיהֶם
  choice: sur leur bouche
  rationale: La préposition peut signifier « à/sur ». « Mettre la main sur la bouche » rend clairement le geste de silence tout en restant proche de l'hébreu; le singulier distributif reproduit l'expression source.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme hébreu est conservé sur deux lignes; l'imparfait présente la déférence comme une conduite habituelle dans le souvenir de Job.
