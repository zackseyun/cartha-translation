  text: After my words they did not speak again[b][a], and my word dripped upon them.
translation:
  language: fr
  text: Après que j’avais parlé, ils ne reprenaient plus la parole[a], et ma parole tombait sur eux goutte à goutte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ne répondaient plus » ; le verbe hébreu peut évoquer le fait de ne pas recommencer à parler ou de ne pas répondre après que j’avais parlé.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « ma parole dégouttait sur eux » : image poétique d’une parole qui descend goutte à goutte sur ceux qui l’écoutent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי דְבָרִי
  choice: Après que j’avais parlé
  rationale: Cette tournure française naturelle exprime l’antériorité temporelle et le fait que Job venait d’achever son discours, sans calquer maladroitement « après mes paroles ».
- source_word: לֹא יִשְׁנוּ
  choice: ils ne reprenaient pas la parole
  rationale: Dans ce contexte de prise de parole, le verbe indique qu’ils ne parlaient pas de nouveau après Job. La formulation conserve aussi, en note, la possibilité d’une absence de réponse.
- source_word: וְעָלֵימוֹ
  choice: sur eux
  rationale: La préposition עַל avec suffixe masculin pluriel marque ici ceux sur qui les propos de Job descendent dans l’image poétique.
- source_word: תִּטֹּף
  choice: tombaient … goutte à goutte
  rationale: נטף évoque ce qui dégoutte ou tombe en gouttes. Cette expression française préserve l’image concrète tout en restant intelligible appliquée à la parole.
- source_word: מִלָּתִי
  choice: mes propos
  rationale: Le singulier collectif poétique désigne ce que Job disait. « Mes propos » est naturel en français et évite l’ambiguïté courante de « ma parole », sans effacer la valeur discursive du terme.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et poétique. L’imparfait convient à la rétrospective de Job sur une situation habituelle passée. L’image hébraïque de l’écoulement goutte à goutte est conservée sans lui attribuer explicitement une douceur ou une autorité que le vers ne formule pas.
