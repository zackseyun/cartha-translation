lexical_decisions:
- source_word: בְּעוֹד
  choice: quand ... était encore
  rationale: La construction בְּ + עוֹד marque ici la durée continue dans le passé et introduit un souvenir d’un état désormais révolu.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Titre divin fréquent dans Job, traduit par son équivalent français traditionnel et immédiatement compréhensible.
- source_word: עִמָּדִי
  choice: avec moi
  rationale: La préposition avec suffixe exprime directement la présence ou l’accompagnement.
- source_word: סְבִיבוֹתַי
  choice: m’entouraient
  rationale: Cette formulation verbale rend naturellement en français la disposition « autour de moi » avec le groupe nominal qui suit.
- source_word: נְעָרָי
  choice: mes jeunes gens
  rationale: Le terme peut désigner de jeunes hommes, des gens de service ou des serviteurs. « Mes jeunes gens » conserve le sens lexical premier sans préciser excessivement leur statut.
