  yaml_path: translation/ot/job/029/013.yaml
  text: The blessing of the perishing man came upon me[b][a], and I made the widow’s heart sing for joy.
translation:
  language: fr
  text: La bénédiction de celui qui allait périr[a] venait sur moi, et je faisais chanter de joie le cœur de la veuve[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de celui qui périssait ». Le participe hébreu peut désigner quelqu’un qui périt, qui va à sa perte ou qui est près de mourir.
    reason: lexical_alternative
  - marker: b
    text: Ou « je réjouissais le cœur de la veuve » ou « je faisais crier de joie le cœur de la veuve ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת
  choice: la bénédiction de
  rationale: Le nom à l’état construit introduit un rapport de dépendance avec le participe qui suit ; « la bénédiction de » est naturel en français.
- source_word: אֹבֵד
  choice: celui qui allait périr
  rationale: Le participe qal peut désigner quelqu’un qui périt, va à sa perte ou se trouve près de la mort. Cette formulation conserve le caractère imminent de la détresse sans préciser indûment sa nature.
- source_word: עָלַי
  choice: sur moi
  rationale: La préposition עַל avec le suffixe de première personne s’accorde ici avec l’image d’une bénédiction qui vient sur Job.
- source_word: תָּבֹא
  choice: venait
  rationale: L’imparfait français exprime naturellement l’action passée habituelle évoquée dans ce rappel poétique de la conduite de Job.
- source_word: לֵב
  choice: le cœur
  rationale: « Cœur » rend de façon transparente le siège de la vie intérieure et des émotions.
- source_word: אַלְמָנָה
  choice: de la veuve
  rationale: Traduction directe du nom singulier dans sa relation avec « cœur ».
- source_word: אַרְנִן
  choice: je faisais chanter de joie
  rationale: La forme causative de רנן indique que Job amenait le cœur de la veuve à pousser des cris ou des chants de joie ; la formulation retenue préserve cette valeur causative et reste naturelle.
theological_decisions: []
