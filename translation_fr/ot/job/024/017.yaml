  text: כִּ֤י יַחְדָּ֨ו בֹּ֣קֶר לָ֣/מוֹ צַלְמָ֑וֶת כִּֽי יַ֝כִּ֗יר בַּלְה֥וֹת צַלְמָֽוֶת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/017.yaml
  text: For deep darkness is morning to them all[c][b][a], for they are familiar with the terrors of deep darkness.
translation:
  language: fr
  text: Car, pour eux tous, l’obscurité profonde[b] est le matin[a] ; car chacun connaît[c] les terreurs de l’obscurité profonde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Car le matin est pour eux tous comme l’obscurité profonde. » L’ordre très condensé de l’hébreu permet les deux lectures.'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu peut aussi se traduire par « ombre de la mort » ou « ténèbres ». Ici, il désigne probablement une obscurité ou une noirceur profonde plutôt que la mort elle-même.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il connaît » ou « il reconnaît ». Le singulier semble avoir une valeur générale et désigner chacun des malfaiteurs évoqués.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici une explication qui prolonge la description des malfaiteurs dans le contexte.
- source_word: יַחְדָּו
  choice: tous
  rationale: Littéralement « ensemble » ; dans cette proposition, le français « pour eux tous » exprime naturellement sa portée collective.
- source_word: בֹּקֶר
  choice: le matin
  rationale: Le sens courant « matin » conserve le contraste saisissant avec l’obscurité profonde.
- source_word: לָמוֹ
  choice: pour eux
  rationale: Cette forme pronominale indique ici le rapport entre le matin et les personnes évoquées.
- source_word: צַלְמָוֶת
  choice: l’obscurité profonde
  rationale: Dans Job, le terme désigne souvent des ténèbres ou une obscurité extrêmes, sans évoquer nécessairement la mort.
- source_word: יַכִּיר
  choice: chacun connaît
  rationale: La forme verbale est au masculin singulier. « Chacun » préserve ce singulier tout en rendant explicite sa valeur générique pour les malfaiteurs décrits.
- source_word: בַּלְהוֹת
  choice: les terreurs
  rationale: Le pluriel désigne des épouvantes ou des horreurs soudaines ; « les terreurs de l’obscurité profonde » rend naturellement la construction.
theological_decisions:
- issue: Rapport entre « matin » et « obscurité profonde » dans la proposition nominale
  choice: « l’obscurité profonde est le matin »
  alternative: « le matin est pour eux comme l’obscurité profonde »
  rationale: L’hébreu ne marque pas explicitement lequel des deux noms est le sujet ou l’attribut. Le texte principal suit l’analyse où l’obscurité tient lieu de matin aux malfaiteurs, tandis que la note conserve l’autre lecture possible sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et soutenu. La formulation conserve le paradoxe abrupt de la proposition nominale hébraïque, tout en plaçant les compléments de manière naturelle en français. La répétition de « l’obscurité profonde » reproduit celle du texte source.
