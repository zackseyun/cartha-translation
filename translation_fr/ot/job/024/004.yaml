  text: יַטּ֣וּ אֶבְיוֹנִ֣ים מִ/דָּ֑רֶךְ יַ֥חַד חֻ֝בְּא֗וּ עֲנִיֵּי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/004.yaml
  text: They turn the needy off the road[b][a]; together the poor of the land hide themselves.
translation:
  language: fr
  text: Ils écartent les nécessiteux du chemin[a] ; tous ensemble, les pauvres du pays[b] se cachent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « détournent les nécessiteux de la voie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les pauvres de la terre ».'
    reason: lexical_alternative
  - marker: c
    text: 'Le verbe hébreu est à la forme passive ; on peut aussi traduire : « sont cachés ».'
    reason: grammatical_alternative
lexical_decisions:
- source_word: יַטּוּ
  choice: ils écartent
  rationale: Le hiphil de נטה exprime ici l’action de faire dévier ou de détourner. « Écartent » conserve cette valeur causative sans ajouter explicitement une violence que le verbe ne précise pas à lui seul.
- source_word: אֶבְיוֹנִים
  choice: les nécessiteux
  rationale: אֶבְיוֹן désigne des personnes pauvres et vulnérables qui sont dans le besoin. « Nécessiteux » permet aussi de le distinguer légèrement de עֲנִיֵּי dans le second membre.
- source_word: מִדָּרֶךְ
  choice: du chemin
  rationale: מִן avec דֶּרֶךְ indique qu’on éloigne quelqu’un du chemin ou de la voie. La formulation française garde l’image concrète tout en laissant possible un sens plus général.
- source_word: יַחַד
  choice: tous ensemble
  rationale: L’adverbe exprime une situation collective. « Tous ensemble » rattache clairement cette idée aux pauvres qui se cachent.
- source_word: חֻבְּאוּ
  choice: se cachent
  rationale: La forme pual peut être comprise passivement (« sont cachés ») ou rendue par un état/retrait réflexif. « Se cachent » est naturel en français, tandis qu’une note conserve l’ambiguïté de la forme hébraïque.
- source_word: עֲנִיֵּי אָרֶץ
  choice: les pauvres du pays
  rationale: עָנִי peut désigner le pauvre, l’affligé ou l’opprimé. Dans ce tableau social, אָרֶץ se rend naturellement par « pays », sans exclure le sens plus large de « terre ».
