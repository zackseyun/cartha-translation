  text: חָתַ֥ר בַּ/חֹ֗שֶׁךְ בָּ֫תִּ֥ים יוֹמָ֥ם חִתְּמוּ לָ֗/מוֹ לֹא יָ֥דְעוּ אֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/016.yaml
  text: In the dark they break into houses[a]; by day they shut themselves in[c][b]; they do not know the light.
translation:
  language: fr
  text: Dans l’obscurité, ils entrent par effraction dans des maisons[a] ; le jour, ils s’enferment[b] ; ils ne connaissent pas la lumière[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils creusent ou percent pour entrer dans des maisons ». Le verbe hébreu évoque littéralement le fait de creuser ou de percer, probablement pour entrer par effraction à travers une paroi.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils se scellent eux-mêmes », « ils se tiennent enfermés » ou « ils se cachent ». Le verbe hébreu évoque le fait de sceller ou de fermer.'
    reason: lexical_alternative
  - marker: c
    text: « La lumière » désigne d’abord ici la lumière du jour, mais peut aussi avoir une résonance morale.
    reason: preserve_ambiguity
lexical_decisions:
- source_word: חָתַר
  choice: s’introduisent dans
  rationale: Le verbe désigne littéralement l’action de creuser ou de percer, notamment un mur pour pénétrer dans une maison. « S’introduisent dans » exprime naturellement l’effraction en français, tandis que la note conserve l’image concrète du percement.
- source_word: בַּחֹשֶׁךְ
  choice: dans l’obscurité
  rationale: La préposition et le nom indiquent le cadre nocturne de l’action et soulignent la dissimulation.
- source_word: בָּתִּים
  choice: les maisons
  rationale: Le pluriel désigne directement des habitations ; « maisons » convient au contexte d’effraction.
- source_word: יוֹמָם
  choice: le jour
  rationale: Cette expression concise marque nettement le contraste poétique avec « dans l’obscurité ».
- source_word: חִתְּמוּ לָמוֹ
  choice: ils s’y enferment
  rationale: Le verbe signifie « sceller, fermer ». Avec לָמוֹ, il décrit vraisemblablement ces gens qui se ferment eux-mêmes aux regards pendant la journée. « S’y » rattache naturellement leur retraite aux maisons sans alourdir le vers.
- source_word: לֹא יָדְעוּ אוֹר
  choice: ils ne connaissent pas la lumière
  rationale: 'La formulation conserve l’hébraïsme intelligible et son ambiguïté : absence de familiarité avec la lumière du jour, avec une possible résonance morale.'
theological_decisions:
- issue: Portée littérale ou morale de « la lumière »
  choice: Conserver « la lumière » sans expliciter sa valeur symbolique dans le texte principal.
  alternative: Traduire « la lumière du jour » ou interpréter « ce qui est juste ».
  rationale: Le contexte vise d’abord la lumière diurne que les malfaiteurs évitent, mais le vocabulaire sapientiel permet aussi une résonance morale. La traduction préserve cette tension.
- issue: Alternance du singulier et du pluriel dans l’hébreu
  choice: Employer le pluriel « ils » dans tout le vers.
  alternative: Commencer par « il s’introduit », puis passer à « ils ».
  rationale: חָתַר est morphologiquement singulier, tandis que חִתְּמוּ et יָדְעוּ sont pluriels. Le pluriel continu produit un français naturel et comprend le premier individu comme représentatif du groupe, sans modifier le sens général.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme entre l’obscurité, le jour et la lumière est conservé. La ponctuation met en relief les trois propositions poétiques.
