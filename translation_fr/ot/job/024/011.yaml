  text: בֵּין שׁוּרֹתָ֥/ם יַצְהִ֑ירוּ יְקָבִ֥ים דָּ֝רְכ֗וּ וַ/יִּצְמָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/011.yaml
  text: Between their rows they press out oil[a]; they tread winepresses[b], yet they go thirsty.
translation:
  language: fr
  text: Entre leurs rangées, ils extraient de l’huile[a] ; ils foulent les raisins dans les pressoirs, mais ils ont soif.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entre leurs murs » ou, selon une interprétation du contexte agricole, « entre leurs terrasses ». Le terme hébreu peut désigner des rangées ou des murs, probablement ceux d’espaces agricoles clos ou aménagés en terrasses. Le verbe traduit par « extraient de l’huile » est rare et difficile ; sa racine est liée à l’idée de clarté ou de brillance, mais le contexte désigne probablement ici la production d’huile d’olive.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  choice: Entre
  rationale: La préposition situe les travailleurs au milieu d’aménagements agricoles et se rend directement par « entre ».
- source_word: שׁוּרֹתָם
  choice: leurs rangées
  rationale: Le nom peut désigner des rangées ou des murs. « Rangées » conserve l’image concrète la plus probable dans ce contexte agricole, sans préciser abusivement qu’il s’agit de terrasses.
- source_word: יַצְהִירוּ
  choice: ils extraient de l’huile
  rationale: Cette forme rare et difficile est liée à l’huile ou à la clarté. Dans le contexte du travail agricole, elle désigne vraisemblablement la production ou l’extraction d’huile.
- source_word: יְקָבִים דָּרְכוּ
  choice: ils foulent les raisins dans les pressoirs
  rationale: יְקָבִים désigne des pressoirs ou des cuves, et דָּרְכוּ l’action de fouler. L’ajout explicatif « les raisins » rend naturellement en français l’action sous-entendue par l’hébreu.
- source_word: וַיִּצְמָאוּ
  choice: mais ils ont soif
  rationale: 'La conjonction adversative fait ressortir l’ironie cruelle : ceux qui travaillent dans les pressoirs restent privés de boisson.'
