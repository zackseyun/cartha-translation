  text: חֲמ֣וֹר יְתוֹמִ֣ים יִנְהָ֑גוּ יַ֝חְבְּל֗וּ שׁ֣וֹר אַלְמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/003.yaml
  text: They drive away the orphan's donkey[b][a]; they take the widow's ox as a pledge.
translation:
  language: fr
  text: Ils emmènent l’âne des orphelins[a] ; ils prennent en gage le bœuf de la veuve[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’âne de chaque orphelin ». Le pluriel hébreu peut être compris collectivement ou distributivement.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire qu’ils le saisissent comme garantie d’une dette.
    reason: lexical_clarification
lexical_decisions:
- source_word: חֲמוֹר
  choice: âne
  rationale: Terme français courant et précis pour l’animal domestique de bât ; le singulier hébreu est conservé.
- source_word: יְתוֹמִים
  choice: des orphelins
  rationale: Le pluriel hébreu est rendu directement. La relation avec « âne » peut être comprise collectivement ou distributivement, ambiguïté signalée en note.
- source_word: יִנְהָגוּ
  choice: emmènent
  rationale: Le verbe נהג signifie conduire ou mener, notamment un animal. Dans ce contexte d’oppression, « emmènent » exprime l’enlèvement sans préciser au-delà de l’hébreu le mode de conduite.
- source_word: יַחְבְּלוּ
  choice: prennent en gage
  rationale: Le verbe désigne ici la saisie d’un bien comme garantie d’une dette ; cette formulation conserve la nuance juridique et économique.
- source_word: שׁוֹר
  choice: bœuf
  rationale: Équivalent usuel dans un contexte rural et juridique, désignant vraisemblablement un animal de travail.
- source_word: אַלְמָנָה
  choice: de la veuve
  rationale: Le nom singulier est conservé et sa relation possessive avec le bœuf est exprimée naturellement en français.
