  text: מִ/זֶּ֣רֶם הָרִ֣ים יִרְטָ֑בוּ וּֽ/מִ/בְּלִ֥י מַ֝חְסֶ֗ה חִבְּקוּ צֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/008.yaml
  text: They are drenched by the mountain rains[a]; lacking shelter[b], they embrace the rock.
translation:
  language: fr
  text: Trempés par les pluies des montagnes[a], faute d’abri, ils étreignent le rocher[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Trempés par le torrent des montagnes » ou « par les pluies torrentielles des montagnes ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ils étreignent le rocher », c’est-à-dire qu’ils se pressent contre lui pour s’abriter.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרֶם הָרִים
  choice: par les pluies des montagnes
  rationale: זֶרֶם désigne un fort ruissellement, une averse ou une pluie torrentielle. Dans ce contexte d’exposition en montagne, « pluies des montagnes » est naturel et laisse à la note les nuances possibles de torrent et d’orage.
- source_word: יִרְטָבוּ
  choice: Trempés
  rationale: Le verbe signifie être mouillé ou détrempé. « Trempés » restitue avec concision l’intensité suggérée par l’exposition aux intempéries.
- source_word: וּמִבְּלִי מַחְסֶה
  choice: faute d’abri
  rationale: La construction exprime la privation ou l’absence, et מַחְסֶה un refuge physique. « Faute d’abri » est idiomatique et conserve le rapport de cause implicite.
- source_word: חִבְּקוּ
  choice: ils étreignent
  rationale: Le verbe signifie littéralement « embrasser, étreindre ». Le choix conserve l’image vive de personnes qui se pressent contre la roche pour se protéger.
- source_word: צוּר
  choice: le rocher
  rationale: צוּר désigne une roche ou un rocher. « Le rocher » convient mieux que « la roche » à l’image concrète d’un relief auquel on peut s’agripper.
