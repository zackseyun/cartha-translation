- from: De la ville, les mourants gémissent[a], et les blessés à mort appellent au secours ; pourtant, Dieu ne tient pas cela pour une absurdité[b].
  to: De la ville, les mourants gémissent[a], et l’âme des victimes tuées crie au secours ; pourtant, Dieu ne tient pas cela pour une faute[b].
  rationale: La révision rétablit le groupe nominal singulier « l’âme des victimes tuées » et son verbe singulier, conformément au texte hébreu, tout en conservant le sens accessible en français moderne. Elle affine la proposition finale et sa note pour refléter la difficulté réelle de l’idiome sans présenter comme traduction directe une paraphrase fondée sur l’idée d’inattention divine.
