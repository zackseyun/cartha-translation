  variant: modern international French
source:
  edition: WLC
  text: מֵ֘/עִ֤יר מְתִ֨ים יִנְאָ֗קוּ וְ/נֶֽפֶשׁ חֲלָלִ֥ים תְּשַׁוֵּ֑עַ וֶ֝/אֱל֗וֹהַּ לֹא יָשִׂ֥ים תִּפְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/012.yaml
  text: From the city the dying groan[a], and the soul of the slain cries out for help[b], yet God does not regard it as folly.
translation:
  language: fr
  text: De la ville, les mourants gémissent[a], et l’âme des victimes tuées crie au secours ; pourtant, Dieu ne tient pas cela pour une faute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dans la ville, des hommes gémissent. » Le mot hébreu traduit par « les mourants » est difficile et peut aussi désigner des hommes.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression hébraïque est difficile. Le mot traduit par « faute » peut aussi évoquer la folie ou ce qui est répréhensible. On peut aussi comprendre : « Dieu ne tient pas cela pour une folie. » Le référent de « cela » n’est pas précisé dans l’hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעִיר
  choice: De la ville
  rationale: La préposition מִן marque naturellement l’origine du gémissement. « De la ville » conserve cette image sans exclure entièrement une nuance locative.
- source_word: מְתִים
  choice: les mourants
  rationale: Le terme est difficile et peut aussi être compris comme « les hommes ». Dans ce contexte, son parallélisme avec les victimes frappées à mort favorise « les mourants ».
- source_word: יִנְאָקוּ
  choice: gémissent
  rationale: Le verbe désigne l’expression audible et douloureuse de la souffrance ; « gémissent » est naturel et vigoureux en français.
- source_word: וְנֶפֶשׁ חֲלָלִים
  choice: et les blessés à mort
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne, tandis que חֲלָלִים désigne des personnes transpercées ou abattues. La formulation française rend ici les personnes elles-mêmes sans imposer une anthropologie particulière.
- source_word: תְּשַׁוֵּעַ
  choice: appellent au secours
  rationale: La forme exprime un cri pressant qui sollicite de l’aide. Le pluriel français s’accorde naturellement avec le collectif « les blessés à mort ».
- source_word: וֶאֱלוֹהַּ
  choice: pourtant, Dieu
  rationale: La conjonction prend ici une valeur adversative, opposant la détresse humaine à l’absence apparente de réaction divine.
- source_word: לֹא יָשִׂים תִּפְלָה
  choice: ne tient pas cela pour une absurdité
  rationale: L’expression est difficile. תִּפְלָה peut évoquer l’absurdité, la folie ou ce qui est répréhensible. Cette traduction reste proche des mots hébreux tout en laissant le référent de « cela » ouvert.
theological_decisions:
- issue: L’apparente absence de réaction divine face à l’injustice
  choice: pourtant, Dieu ne tient pas cela pour une absurdité
  alternative: 'pourtant, Dieu n’impute aucune faute ; ou : pourtant, Dieu ne prête pas attention à leur appel'
  rationale: Le verset formule la plainte de Job et maintient la tension entre la souffrance criante et l’inaction apparente de Dieu. La traduction ne cherche ni à résoudre cette tension ni à transformer la phrase en affirmation doctrinale générale.
- issue: Le référent de la proposition finale
  choice: cela
  alternative: leur appel ; cette injustice
  rationale: L’hébreu n’exprime pas explicitement l’objet de יָשִׂים. Le pronom neutre conserve l’ambiguïté entre les cris, la situation décrite et le caractère répréhensible de celle-ci.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le parallélisme poétique est préservé, ainsi que l’ambiguïté lexicale du premier groupe nominal et celle de la proposition finale.
