base_translation:
  language: en
  yaml_path: translation/ot/job/024/020.yaml
  text: The womb forgets him[a]; the worm feeds sweetly on him. He is remembered no more[b], and injustice is broken like a tree.
translation:
  language: fr
  text: Le ventre maternel l’oublie ; le ver le trouve savoureux[a]. On ne se souvient plus de lui, et l’injustice est brisée comme un arbre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le ver se repaît de lui avec délice ». L’hébreu exprime littéralement l’idée que le ver le trouve doux ou savoureux.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’homme injuste est brisé comme un arbre ». L’hébreu emploie le nom abstrait « injustice », qui peut ici désigner celui qui la commet.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁכָּחֵהוּ רֶחֶם
  choice: Le ventre maternel l’oublie
  rationale: La formulation garde רֶחֶם comme sujet personnifié et rend l’imparfait dans sa valeur descriptive. « Ventre maternel » exprime naturellement en français le sens de « sein maternel » sans identifier explicitement la mère.
- source_word: מְתָקוֹ רִמָּה
  choice: le ver le trouve savoureux
  rationale: La construction, très concise, associe la douceur au défunt et au ver. Cette traduction donne au ver le rôle de sujet suggéré par l’ordre poétique et conserve l’image macabre sans ajouter explicitement l’action de se nourrir.
- source_word: רִמָּה
  choice: le ver
  rationale: Le singulier hébreu est conservé et peut avoir une valeur collective en français.
- source_word: עוֹד לֹא יִזָּכֵר
  choice: On ne se souvient plus de lui
  rationale: Cette tournure idiomatique française restitue le passif hébreu et la cessation exprimée par עוֹד לֹא.
- source_word: וַתִּשָּׁבֵר
  choice: est brisée
  rationale: Le passif maintient le parallélisme descriptif du destin évoqué dans le verset.
- source_word: כָּעֵץ
  choice: comme un arbre
  rationale: Traduction directe de la comparaison, עֵץ désignant normalement ici un arbre.
- source_word: עַוְלָה
  choice: l’injustice
  rationale: Le substantif abstrait hébreu est maintenu dans le texte principal. « Injustice » est actuel, naturel et suffisamment large pour désigner le mal ou la conduite injuste.
theological_decisions:
- issue: Faut-il comprendre עַוְלָה comme une réalité abstraite ou comme une désignation concrète du méchant ?
  choice: l’injustice est brisée comme un arbre
  alternative: l’homme injuste est brisé comme un arbre
  rationale: La forme hébraïque est abstraite et doit rester visible dans le texte principal. Comme un abstrait peut toutefois désigner par métonymie celui qui commet l’injustice, la lecture concrète est signalée en note sans résoudre silencieusement l’ambiguïté.
- issue: Rapport syntaxique et sens de מְתָקוֹ רִמָּה
  choice: le ver le trouve savoureux
  alternative: le ver se repaît de lui avec délice
  rationale: L’hébreu exprime littéralement l’idée de douceur sans verbe explicite correspondant à « se nourrir ». Le texte principal préserve cette image, tandis que la note donne le sens alimentaire probable.
translation_notes:
  register: Français international moderne, sobre et poétique. La ponctuation suit les unités parallèles du vers hébreu. « Ventre maternel » évite l’ambiguïté anatomique de « sein » tout en gardant la personnification saisissante ; « savoureux » conserve l’image de la douceur, explicitée en note.
