id: JOB.24.5
reference: Job 24:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵ֤ן פְּרָאִ֨ים בַּֽ/מִּדְבָּ֗ר יָצְא֣וּ בְּ֭/פָעֳלָ/ם מְשַׁחֲרֵ֣י לַ/טָּ֑רֶף עֲרָבָ֥ה ל֥/וֹ לֶ֝֗חֶם לַ/נְּעָרִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/005.yaml
  text: Look[a], like wild donkeys in the wilderness they go out to their work, seeking prey early; the desert is bread for him[b], for the children.
translation:
  language: fr
  text: 'Voyez : pareils à des ânes sauvages dans le désert, ils sortent pour leur travail, cherchant dès l’aube de quoi se nourrir[a] ; la steppe lui sert de pain, pour les enfants[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se levant tôt pour chercher une proie ». Le participe peut exprimer le fait de chercher dès le matin, et טֶרֶף signifie littéralement « proie », mais peut aussi désigner la nourriture ou les provisions.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la steppe est pour lui du pain, pour les enfants ». L’hébreu emploie le singulier « pour lui », qui peut avoir une valeur distributive, et le dernier mot peut aussi se traduire par « les jeunes » ou « les garçons ». On peut donc comprendre : « la steppe fournit à chacun de la nourriture pour ses enfants ».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הֵן
  choice: Voyez
  rationale: Interpellation qui attire l’attention sur la scène ; « Voyez » est actuel et conserve la force déictique de l’hébreu.
- source_word: פְּרָאִים
  choice: ânes sauvages
  rationale: Désigne les ânes non domestiqués des régions arides ; cette expression est claire en français moderne.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Désigne ici une région inculte et aride où vivent les ânes sauvages.
- source_word: יָצְאוּ בְּפָעֳלָם
  choice: ils sortent pour leur travail
  rationale: Conserve le mouvement exprimé par יָצְאוּ et l’activité pénible et nécessaire désignée par פֹּעַל, sans préciser davantage sa nature.
- source_word: מְשַׁחֲרֵי
  choice: cherchant dès l’aube
  rationale: Le participe associe la recherche assidue à l’idée de se mettre en quête de bonne heure.
- source_word: לַטָּרֶף
  choice: de quoi se nourrir
  rationale: טֶרֶף peut désigner une proie ou, plus largement, la nourriture obtenue. Dans ce tableau de misère humaine, la formulation retenue exprime la subsistance sans effacer l’image de la quête, signalée en note.
- source_word: עֲרָבָה
  choice: la steppe
  rationale: Le terme désigne une plaine aride ou semi-désertique ; « steppe » le distingue ici de מִדְבָּר tout en restant naturel.
- source_word: לוֹ
  choice: lui
  rationale: Le texte hébreu porte un singulier, probablement distributif ou représentatif au milieu d’un sujet pluriel ; le singulier est conservé afin de ne pas résoudre cette tension.
- source_word: לֶחֶם
  choice: pain
  rationale: Le sens concret est maintenu, avec sa valeur courante de nourriture essentielle.
- source_word: לַנְּעָרִים
  choice: pour les enfants
  rationale: נְעָרִים peut désigner des jeunes, des garçons ou des enfants ; dans ce contexte de subsistance familiale, « enfants » est naturel sans imposer un sexe masculin.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais accessible. Le rythme en deux membres et l’image des ânes sauvages sont conservés. La formulation volontairement inhabituelle « lui sert de pain » maintient le singulier et la métaphore du texte hébreu, tandis que la note explicite une lecture française plus fluide.
