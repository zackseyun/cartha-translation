  text: At dawn the murderer rises[a]; he kills the poor and needy[b], and in the night he is like a thief.
translation:
  language: fr
  text: À l’aube, le meurtrier se lève[a] ; il tue le pauvre et l’indigent[b], et pendant la nuit, il est comme un voleur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « À la lumière » ou « Quand vient la lumière » ; l’expression hébraïque renvoie vraisemblablement à l’apparition du jour.
    reason: lexical_alternative
  - marker: b
    text: Ou « il met à mort le pauvre et l’indigent ». L’hébreu emploie ici un autre mot que celui rendu par « meurtrier » ; le texte principal conserve cette distinction avec « tue ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאוֹר
  choice: À l’aube
  rationale: L’expression signifie littéralement « à la lumière » ou « quand vient la lumière » et désigne vraisemblablement le point du jour. « À l’aube » exprime naturellement cette valeur temporelle.
- source_word: יָקוּם
  choice: se lève
  rationale: Le verbe קום décrit ici le fait de se lever pour entrer en action.
- source_word: רוֹצֵחַ
  choice: le meurtrier
  rationale: Le participe substantivé désigne de manière générique celui qui commet un meurtre.
- source_word: יִקְטָל
  choice: il tue
  rationale: Le texte emploie ici קטל, et non une seconde occurrence de רצח. « Il tue » préserve cette distinction lexicale.
- source_word: עָנִי וְאֶבְיוֹן
  choice: le pauvre et l’indigent
  rationale: Ce binôme désigne des personnes démunies et socialement vulnérables, tout en conservant les deux termes hébreux.
- source_word: וּבַלַּיְלָה
  choice: et pendant la nuit
  rationale: Cette expression marque le second cadre temporel et maintient le contraste poétique avec l’aube.
- source_word: יְהִי כַגַּנָּב
  choice: il se comporte comme un voleur
  rationale: Avec כ, היה peut décrire la manière d’agir ou le rôle adopté. Cette formulation naturelle rend le comportement visé sans affirmer une transformation d’identité.
