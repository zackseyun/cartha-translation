  text: בַּ֭/שָּׂדֶה בְּלִיל֣/וֹ יקצירו וְ/כֶ֖רֶם רָשָׁ֣ע יְלַקֵּֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/006.yaml
  text: In the field they harvest fodder[c][b][a], and they glean in the vineyard of the wicked.
translation:
  language: fr
  text: 'Dans le champ, ils récoltent du fourrage[a],

    et ils glanent dans la vigne du méchant[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la provende » ou « un mélange de fourrage ». Le mot hébreu désigne de la nourriture pour animaux plutôt que des céréales ordinaires.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils glanent la vigne du méchant ». L’hébreu ne répète pas explicitement la préposition « dans ».
    reason: lexical_alternative
  - marker: c
    text: '« Le méchant » peut désigner de façon générale un propriétaire méchant ; autre traduction possible : « un homme méchant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׂדֶה
  choice: Dans le champ
  rationale: La préposition ב et l’article défini donnent un sens locatif défini. « Dans le champ » est naturel et reste proche de la forme hébraïque au singulier.
- source_word: בְּלִילוֹ
  choice: du fourrage
  rationale: בְּלִיל désigne un mélange servant de nourriture aux animaux, plutôt que des céréales destinées à l’alimentation humaine. Le suffixe masculin singulier est difficile à rattacher avec certitude et n’est pas explicité dans le corps du texte afin d’éviter un antécédent artificiel.
- source_word: יקצירו
  choice: ils récoltent
  rationale: Le verbe קצר signifie moissonner ou récolter. « Récoltent » convient naturellement au fourrage sans suggérer exclusivement une moisson de céréales.
- source_word: וְכֶרֶם
  choice: et… dans la vigne
  rationale: L’hébreu introduit simplement « et une/la vigne » sans répéter la préposition. Le français ajoute « dans » pour exprimer naturellement le lieu où s’effectue le grappillage.
- source_word: רָשָׁע
  choice: du méchant
  rationale: L’adjectif substantivé singulier désigne ici une personne méchante, vraisemblablement le propriétaire de la vigne. Le singulier est conservé sans préciser davantage son identité.
- source_word: יְלַקֵּשׁוּ
  choice: ils grappillent
  rationale: Le piel de לקשׁ évoque le ramassage tardif ou celui des restes d’une récolte. « Grappiller » convient particulièrement au contexte d’une vigne et exprime l’idée de glanage.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Fourrage » est courant et précis ; « grappiller » conserve l’image agricole et le parallélisme avec « récoltent ». Les ambiguïtés concernant la construction de « vigne » et l’identité du méchant sont signalées en notes.
