source:
  edition: WLC
  text: עָר֣וֹם יָ֭לִינוּ מִ/בְּלִ֣י לְב֑וּשׁ וְ/אֵ֥ין כְּ֝ס֗וּת בַּ/קָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/007.yaml
  text: They spend the night naked[a], without clothing, and have no covering against the cold.
translation:
  language: fr
  text: Ils passent la nuit nus[a], sans vêtement, et n’ont rien pour se couvrir contre le froid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils passent la nuit dévêtus, sans habit, et n’ont rien pour se couvrir dans le froid. »'
    reason: 'Alternative lexicale et syntaxique : עָרוֹם peut décrire le fait d’être nu ou insuffisamment vêtu, et בַּקָּרָה peut se rendre plus littéralement par « dans le froid ».'
lexical_decisions:
- source_word: עָרוֹם
  choice: nus
  rationale: L’adjectif désigne l’absence de vêtements, ou du moins un dénuement vestimentaire extrême. « Nus » est direct, vivant et naturel dans ce tableau de misère.
- source_word: יָלִינוּ
  choice: passent la nuit
  rationale: Le verbe לין signifie passer la nuit ou loger. « Passent la nuit » en conserve clairement la valeur temporelle en français courant.
- source_word: מִבְּלִי
  choice: sans
  rationale: La construction exprime l’absence ou la privation. « Sans » est la formulation française la plus concise et naturelle.
- source_word: לְבוּשׁ
  choice: vêtement
  rationale: Le nom peut désigner un vêtement ou l’habillement en général. Le singulier collectif « sans vêtement » rend naturellement cette idée.
- source_word: כְּסוּת
  choice: rien pour se couvrir
  rationale: Le terme désigne ce qui sert à couvrir, notamment un vêtement protecteur. Cette formulation française reste générale sans préciser à tort qu’il s’agit d’une couverture ou d’un manteau.
- source_word: בַּקָּרָה
  choice: contre le froid
  rationale: Le nom signifie « froid ». Avec l’idée de couverture, « contre le froid » exprime naturellement la fonction protectrice, tandis que « dans le froid » demeure une autre lecture possible.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition sémantique de l’hébreu entre « nus » et « sans vêtement » est conservée, car elle souligne le dénuement. « Rien pour se couvrir » est plus idiomatique que « aucune couverture » et évite de sur-spécifier כְּסוּת.
