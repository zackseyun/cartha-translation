source:
  edition: WLC
  text: צִיָּ֤ה גַם חֹ֗ם יִגְזְל֥וּ מֵֽימֵי שֶׁ֗לֶג שְׁא֣וֹל חָטָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/019.yaml
  text: Drought and heat also snatch away the waters of snow[b][a]; so Sheol takes those who have sinned.
translation:
  language: fr
  text: La sécheresse et la chaleur ravissent les eaux de la neige[a] ; de même, le shéol[b] ravit ceux qui ont péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’eau de fonte des neiges ». L’hébreu dit littéralement « les eaux de la neige ».
    reason: lexical_alternative
  - marker: b
    text: 'Le « shéol » est le terme hébreu désignant le séjour des morts ; autre traduction possible : « la tombe ».'
    reason: alternative_reading
lexical_decisions:
- source_word: צִיָּה
  choice: la sécheresse
  rationale: Le nom désigne l’aridité ou la sécheresse. Ici, il fonctionne naturellement comme sujet personnifié du verbe « emporter ».
- source_word: גַם חֹם
  choice: et la chaleur
  rationale: חֹם signifie « chaleur ». Dans ce contexte poétique, גַם associe la chaleur à la sécheresse ; le français coordonne naturellement les deux termes par « et ».
- source_word: יִגְזְלוּ
  choice: emportent
  rationale: Le verbe גזל évoque le fait d’arracher, de ravir ou de dépouiller. « Emportent » conserve l’idée d’une disparition forcée tout en convenant aux sujets inanimés « sécheresse » et « chaleur ».
- source_word: מֵימֵי שֶׁלֶג
  choice: les eaux de la neige
  rationale: Cette traduction proche de la forme hébraïque conserve l’image poétique sans imposer l’interprétation plus explicite « l’eau de fonte des neiges ».
- source_word: שְׁאוֹל
  choice: le shéol
  rationale: La translittération préserve le terme hébreu désignant le séjour des morts sans le réduire à la tombe ni lui donner le sens doctrinal plus tardif d’enfer.
- source_word: חָטָאוּ
  choice: ceux qui ont péché
  rationale: La forme verbale parfaite plurielle signifie littéralement « ils ont péché ». Dans le second membre elliptique, « ceux qui ont péché » exprime clairement le groupe saisi par le shéol tout en conservant la formulation verbale.
theological_decisions:
- issue: Sens de שְׁאוֹל
  choice: Conserver « le shéol » comme désignation du séjour des morts.
  alternative: « la tombe », « le séjour des morts » ou « la mort »
  rationale: La translittération maintient l’étendue sémantique et l’ambiguïté du terme hébreu, sans introduire l’idée plus précise de châtiment final.
- issue: Rapport entre les deux membres poétiques
  choice: Rendre la comparaison implicite par « de même » et reprendre le verbe « emporte ».
  alternative: 'Conserver une simple juxtaposition elliptique : « … les eaux de la neige ; le shéol, ceux qui ont péché. »'
  rationale: L’hébreu juxtapose deux membres, le second étant elliptique. « De même » explicite avec retenue le rapport comparatif généralement compris, tandis que la répétition du verbe produit une phrase française claire sans modifier l’image.
translation_notes:
  register: Français moderne, poétique et digne. La structure parallèle reste concise ; « de même » rend intelligible l’ellipse hébraïque, et « shéol » conserve la portée propre du terme source.
