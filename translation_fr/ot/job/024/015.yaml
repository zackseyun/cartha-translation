  variant: modern international French
source:
  edition: WLC
  text: וְ/עֵ֤ין נֹאֵ֨ף שָׁ֤מְרָֽה נֶ֣שֶׁף לֵ֭/אמֹר לֹא תְשׁוּרֵ֣/נִי עָ֑יִן וְ/סֵ֖תֶר פָּנִ֣ים יָשִֽׂים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/015.yaml
  text: The eye of the adulterer waits for twilight[a], saying, ‘No eye will see me’[b]; and he puts a covering over his face.
translation:
  language: fr
  text: 'L’œil de l’homme adultère guette le crépuscule[a] en se disant : « Aucun œil ne me verra » ; il se couvre le visage[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la pénombre ». Le mot hébreu peut désigner la faible lumière du soir, ce qui convient au contexte d’un acte commis en secret.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il met une dissimulation du visage ». L’expression indique qu’il cache ou déguise son visage pour ne pas être reconnu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵין
  choice: œil
  rationale: Le sens concret « œil » préserve l’image qui relie le regard de l’homme adultère à celui dont il cherche à se dérober.
- source_word: נֹאֵף
  choice: l’homme adultère
  rationale: Le participe masculin singulier désigne ici un homme qui commet l’adultère. Cette formulation est claire et naturelle en français moderne.
- source_word: שָׁמְרָה
  choice: guette
  rationale: Le verbe signifie fondamentalement garder ou surveiller ; dans ce contexte, « guette » exprime l’attente vigilante du moment propice.
- source_word: נֶשֶׁף
  choice: crépuscule
  rationale: Le nom désigne une lumière indistincte, ici vraisemblablement celle du soir. « Crépuscule » conserve cette nuance sans préciser excessivement l’heure.
- source_word: לֵאמֹר
  choice: en se disant
  rationale: L’infinitif introduit les paroles ou la pensée intérieure du personnage ; « en se disant » rend naturellement ce monologue en français.
- source_word: תְשׁוּרֵנִי
  choice: me verra
  rationale: Le verbe שׁוּר signifie regarder ou voir. « Me verra » est idiomatique et maintient le motif du regard.
- source_word: וְסֵתֶר פָּנִים
  choice: il se couvre le visage
  rationale: L’expression hébraïque condensée évoque littéralement le fait de mettre une dissimulation du visage. La formulation française communique clairement l’action sans imposer un objet précis.
- source_word: יָשִׂים
  choice: il se couvre
  rationale: Le verbe signifie mettre ou placer. Combiné à l’expression précédente, il est rendu idiomatiquement par le verbe pronominal « se couvrir ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « œil » est conservée pour respecter l’image hébraïque. « Guette » restitue à la fois l’attente et la vigilance, tandis que « se couvre le visage » rend naturellement l’expression hébraïque elliptique.
