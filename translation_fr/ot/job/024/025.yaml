  text: וְ/אִם לֹ֣א אֵ֭פוֹ מִ֣י יַכְזִיבֵ֑/נִי וְ/יָשֵׂ֥ם לְ֝/אַ֗ל מִלָּתִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/024/025.yaml
  text: And if it is not so[a], then who can prove me a liar and make my word into nothing?
translation:
  language: fr
  text: Et s’il n’en est pas ainsi, alors qui me convaincra de mensonge et réduira ma parole à néant ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: Et s’il n’en est pas ainsi
  rationale: Introduit le défi conditionnel qui découle des affirmations précédentes de Job; la formulation explicite est naturelle en français tout en conservant le sens de l’hébreu.
- source_word: אֵפוֹ
  choice: '[rendu par la tournure interrogative qui suit]'
  rationale: Cette particule discursive renforce la conséquence et le défi. En français, son effet est suffisamment porté par la construction « s’il… qui… ? »; ajouter « alors » alourdirait légèrement la phrase.
- source_word: מִי
  choice: qui
  rationale: Pronom interrogatif direct, qui introduit un défi rhétorique.
- source_word: יַכְזִיבֵנִי
  choice: me convaincra de mensonge
  rationale: Le hiphil de כזב signifie ici montrer quelqu’un faux ou menteur. Cette expression française garde la force personnelle et quasi judiciaire du défi.
- source_word: וְיָשֵׂם לְאַל
  choice: et réduira … à néant
  rationale: L’expression signifie rendre nul, réduire à rien. « Réduire à néant » est idiomatique, clair et soutenu sans être archaïque.
- source_word: מִלָּתִי
  choice: mes paroles
  rationale: Le singulier hébreu désigne ici l’énoncé ou le discours de Job. Le pluriel français « mes paroles » est naturel et conserve la portée rhétorique de sa défense.
