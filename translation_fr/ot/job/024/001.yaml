source:
  edition: WLC
  text: מַדּ֗וּעַ מִ֭/שַּׁדַּי לֹא נִצְפְּנ֣וּ עִתִּ֑ים ו/ידע/ו לֹא חָ֥זוּ יָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/001.yaml
  text: Why are times not kept by the Almighty[b][a], and why do those who know him not see his days?
translation:
  language: fr
  text: Pourquoi les temps ne sont-ils pas cachés au Tout-Puissant[a], tandis que ceux qui le connaissent ne voient pas ses jours[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des temps fixés ». Le verbe peut aussi évoquer des temps gardés en réserve ; le sens est qu’ils ne sont pas dissimulés au Tout-Puissant.
    reason: lexical_alternative
  - marker: b
    text: « Ses jours » désigne probablement les jours où Dieu intervient, notamment pour juger.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: L’adverbe interrogatif introduit la plainte de Job. « Pourquoi » en conserve directement la force.
- source_word: מִשַּׁדַּי
  choice: par le Tout-Puissant
  rationale: Avec le passif נִצְפְּנוּ, la préposition מִן peut désigner l’agent ou la source. « Par le Tout-Puissant » rend cette relation sans alourdir la phrase ; « le Tout-Puissant » est la désignation traditionnelle et intelligible de שַׁדַּי dans Job.
- source_word: נִצְפְּנוּ
  choice: ne sont-ils pas réservés
  rationale: Le verbe צפן peut signifier cacher, conserver ou mettre en réserve. « Réservés » conserve le passif et convient à des moments destinés à une action future, sans ajouter explicitement l’idée d’un secret.
- source_word: עִתִּים
  choice: des temps
  rationale: Le pluriel désigne des temps ou des moments déterminés. La formulation générale « des temps » préserve la concision et l’ouverture du texte hébreu.
- source_word: וְיֹדְעָיו
  choice: ceux qui le connaissent
  rationale: Le participe qal muni du suffixe de troisième personne désigne ceux qui connaissent Dieu ; cette formulation française est naturelle et garde la portée relationnelle du verbe.
- source_word: חָזוּ
  choice: voient
  rationale: חזה signifie voir ou contempler, parfois avec une nuance de perception visionnaire. « Voient » convient ici et reste sobre.
- source_word: יָמָיו
  choice: ses jours
  rationale: Le pluriel suffixé est rendu littéralement afin de préserver l’expression poétique et son ambiguïté, sans la réduire à des jours de jugement ou d’intervention.
theological_decisions:
- issue: Sens de « ses jours » en rapport avec Dieu
  choice: Conserver l’expression littérale « ses jours ».
  alternative: « les jours où il intervient », « ses jours de jugement » ou « les temps qu’il a fixés »
  rationale: L’hébreu est condensé et peut évoquer les jours où Dieu intervient ou juge, mais il ne le précise pas. La traduction maintient donc la tension théologique et poétique, tandis que la note indique le sens contextuel probable.
- issue: Relation de מִן dans מִשַּׁדַּי avec le passif
  choice: 'Comprendre le Tout-Puissant comme l’agent : « par le Tout-Puissant ».'
  alternative: « loin du Tout-Puissant » ou « au Tout-Puissant »
  rationale: Dans le contexte de la plainte sur l’absence apparente de moments où Dieu agit, la lecture agentive s’accorde le mieux avec la seconde moitié du verset. La construction hébraïque demeure toutefois concise.
translation_notes:
  register: Français international moderne, sobre et poétique. La structure interrogative parallèle est conservée, de même que les formulations volontairement ouvertes « des temps » et « ses jours ».
