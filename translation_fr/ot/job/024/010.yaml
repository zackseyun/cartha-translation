  text: עָר֣וֹם הִ֭לְּכוּ בְּלִ֣י לְב֑וּשׁ וּ֝/רְעֵבִ֗ים נָ֣שְׂאוּ עֹֽמֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/010.yaml
  text: They go about naked[a], without clothing; hungry, they carry sheaves.
translation:
  language: fr
  text: Ils vont nus, sans vêtements ; affamés, ils portent des gerbes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une gerbe ». Le nom hébreu est au singulier, mais il peut avoir ici un sens collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: nus
  rationale: L’adjectif exprime l’absence de vêtements, ou éventuellement une tenue très insuffisante. « Nus » est direct, naturel et convient à la situation de dénuement décrite.
- source_word: הִלְּכוּ
  choice: ils vont
  rationale: Le verbe הלך signifie couramment « aller » ou « marcher ». Ici, « ils vont » présente naturellement leur condition habituelle ou persistante.
- source_word: בְּלִי לְבוּשׁ
  choice: sans vêtements
  rationale: בְּלִי marque la privation, et לְבוּשׁ désigne un vêtement ou l’habillement. Le pluriel français exprime idiomatiquement l’absence de quoi se vêtir.
- source_word: רְעֵבִים
  choice: affamés
  rationale: Le terme signifie « ayant faim ». Dans ce contexte de privation, « affamés » est un équivalent français courant et digne, sans imposer le sens plus extrême de « mourant de faim ».
- source_word: נָשְׂאוּ
  choice: ils portent
  rationale: נשא signifie ici « porter » ou « transporter », ce qui correspond au travail de manutention des produits de la moisson.
- source_word: עֹמֶר
  choice: des gerbes
  rationale: Le nom est morphologiquement singulier, mais peut avoir ici une valeur collective. Le pluriel français convient à plusieurs travailleurs transportant la récolte ; le singulier formel est signalé en note.
theological_decisions: []
