source:
  edition: WLC
  text: קַֽל ה֤וּא עַל פְּנֵי מַ֗יִם תְּקֻלַּ֣ל חֶלְקָתָ֣/ם בָּ/אָ֑רֶץ לֹֽא יִ֝פְנֶה דֶּ֣רֶךְ כְּרָמִֽים־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/018.yaml
  text: He is swift on the surface of the waters[a]; their portion in the land is cursed[c][b]; he does not turn toward the way of the vineyards.
translation:
  language: fr
  text: Il glisse rapidement à la surface des eaux[a] ; leur part dans le pays est maudite[b] ; il ne se tourne pas vers le chemin des vignes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il est léger à la surface des eaux ». L’hébreu est difficile ; le début du verset peut évoquer la rapidité, mais aussi le caractère fugitif ou éphémère.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu est difficile ; certains lisent « sa part dans le pays est maudite » au lieu de « leur part ».
    reason: textual_variant
  - marker: c
    text: Ou « il ne prend pas le chemin des vignes », peut-être au sens qu’il ne retourne plus vers les terres cultivées ou les lieux prospères.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַל
  choice: glisse rapidement
  rationale: L’adjectif signifie littéralement « léger » et peut évoquer ici la rapidité ou le caractère fugitif. Avec « à la surface des eaux », « glisse rapidement » rend naturellement l’image sans exclure la difficulté du texte, signalée en note.
- source_word: עַל־פְּנֵי מַיִם
  choice: à la surface des eaux
  rationale: Rend l’expression hébraïque de façon proche et naturelle, en conservant l’image de la surface des eaux.
- source_word: תְּקֻלַּל
  choice: est maudite
  rationale: 'Le pual de קלל se comprend le plus directement comme un passif : « être maudit ».'
- source_word: חֶלְקָתָם
  choice: leur part
  rationale: Suit la forme munie du suffixe pluriel dans le texte fourni, tout en signalant en note la possibilité du singulier.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: « Pays » convient à une part foncière et garde le lien avec les terres cultivées évoquées ensuite.
- source_word: לֹא יִפְנֶה
  choice: il ne prend pas
  rationale: Dans la construction avec דֶּרֶךְ, cette formulation française exprime naturellement le fait de ne pas se diriger vers une voie, sans imposer l’idée plus précise de retour.
- source_word: דֶּרֶךְ כְּרָמִים
  choice: le chemin des vignes
  rationale: Traduction proche de la construction hébraïque, qui préserve l’ambiguïté entre un chemin traversant les vignes et celui qui y conduit.
theological_decisions:
- issue: Référent des pronoms et cohérence du nombre
  choice: Maintien de « il » dans les première et troisième propositions, avec « leur part » au centre
  alternative: Harmoniser en « sa part » ou comprendre le sujet de manière impersonnelle
  rationale: Le verset hébreu est difficile et présente une tension de nombre qu’il vaut mieux conserver plutôt que résoudre silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste imagée et concise, tandis que les notes rendent explicites les principales incertitudes lexicales et textuelles.
