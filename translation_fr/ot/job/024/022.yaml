id: JOB.24.22
reference: Job 24:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מָשַׁ֣ךְ אַבִּירִ֣ים בְּ/כֹח֑/וֹ יָ֝ק֗וּם וְֽ/לֹא יַאֲמִ֥ין בַּֽ/חַיִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/022.yaml
  text: Yet he drags away the mighty by his power; he rises up[a], but he has no assurance of life.
translation:
  language: fr
  text: Pourtant, par sa force, il entraîne les puissants; il se lève, mais il n’est pas sûr de rester en vie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « il se lève, et il ne se fie pas à la vie »; autre compréhension possible: « il se lève, et personne n’est sûr de rester en vie ». Le sujet de la dernière proposition est ambigu en hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁךְ
  choice: il entraîne
  rationale: Le verbe משׁך signifie fondamentalement « tirer, entraîner ». Ici, avec les puissants pour objet et « par sa force », le sens coercitif convient mieux que l’extension possible « prolonger, préserver ».
- source_word: אַבִּירִים
  choice: les puissants
  rationale: Le terme désigne des êtres forts ou puissants. « Les puissants » conserve ici à la fois l’idée de force et celle de puissance sociale.
- source_word: בְּכֹחוֹ
  choice: par sa force
  rationale: Le syntagme exprime le moyen employé. « Par sa force » rend naturellement le beth instrumental et le nom כֹּחַ.
- source_word: יָקוּם
  choice: il se lève
  rationale: 'קום signifie couramment « se lever, se tenir debout ». Cette formulation garde ouverte la nuance exacte: entrer en action, s’affirmer ou continuer à tenir.'
- source_word: וְלֹא יַאֲמִין בַּחַיִּין
  choice: mais il n’est pas sûr de rester en vie
  rationale: La construction signifie littéralement qu’il ne se fie pas à la vie ou n’a pas confiance quant à sa vie. La formulation française exprime naturellement cette absence d’assurance tout en conservant le sujet masculin singulier du verbe.
theological_decisions:
- issue: Sujet et portée de la dernière proposition
  choice: 'Le même sujet masculin singulier est maintenu: « il n’est pas sûr de rester en vie » (avec une note signalant l’ambiguïté).'
  alternative: 'Lecture impersonnelle ou résultative: « personne n’est sûr de rester en vie »; lecture plus formelle: « il ne se fie pas à la vie ».'
  rationale: Le verbe hébreu est au masculin singulier et peut reprendre l’oppresseur; toutefois, la syntaxe comprimée et le contexte permettent de comprendre que son action rend la vie de tous incertaine. Le texte principal suit la forme grammaticale sans supprimer l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. « Pourtant » marque le contraste; « entraîne » garde l’image concrète sans lourdeur. La dernière proposition privilégie une expression française naturelle de l’insécurité de la vie, tandis que la note préserve l’ambiguïté syntaxique.
