id: JOB.24.24
reference: Job 24:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ר֤וֹמּוּ מְּעַ֨ט וְֽ/אֵינֶ֗/נּוּ וְֽ/הֻמְּכ֗וּ כַּ/כֹּ֥ל יִקָּפְצ֑וּ/ן וּ/כְ/רֹ֖אשׁ שִׁבֹּ֣לֶת יִמָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/024.yaml
  text: They are exalted a little while[a], and then they are gone; they are brought low; like all others they are gathered up[c][b], and like the head of a stalk of grain they are cut off.
translation:
  language: fr
  text: Ils sont élevés pour peu de temps, puis ils ne sont plus[a]. Ils sont abaissés ; comme tous les autres, ils sont emportés[b], et ils sont coupés comme le sommet d’un épi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici une forme au singulier, littéralement « puis il n’est plus », employée au milieu de verbes au pluriel.
    reason: textual_grammar
  - marker: b
    text: Ou « ils sont rassemblés ». Le verbe hébreu est rare, et sa nuance exacte est discutée.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « comme la tête d’un épi ».
    reason: cultural_note
lexical_decisions:
- source_word: רֹמּוּ
  choice: sont élevés
  rationale: Le verbe רום décrit ici leur élévation ou leur accession passagère à une position dominante. Le passif français maintient le contraste avec « sont abaissés ».
- source_word: מְּעַט
  choice: pour peu de temps
  rationale: Littéralement « un peu » ; la disparition qui suit donne ici à l’expression une valeur temporelle.
- source_word: וְאֵינֶנּוּ
  choice: puis ils ne sont plus
  rationale: L’idiome exprime la disparition ou la fin de leur présence. Le français emploie le pluriel d’après les verbes environnants, malgré la forme singulière de l’hébreu.
- source_word: וְהֻמְּכוּ
  choice: Ils sont abaissés
  rationale: Le passif exprime l’abaissement qui renverse leur élévation précédente, sans préciser l’agent.
- source_word: כַּכֹּל
  choice: comme tous les autres
  rationale: La comparaison indique qu’ils subissent le sort commun. « Les autres » explicite naturellement en français le terme implicite après « tous ».
- source_word: יִקָּפְצוּן
  choice: ils sont emportés
  rationale: Ce verbe rare peut évoquer le fait d’être rassemblé, retiré ou emporté. « Emportés » conserve l’idée de disparition sans en préciser abusivement le mécanisme.
- source_word: וּכְרֹאשׁ שִׁבֹּלֶת
  choice: comme le sommet d’un épi
  rationale: L’expression désigne la partie supérieure de l’épi et introduit une image de moisson. Cette formulation est à la fois précise et naturelle en français.
- source_word: יִמָּלוּ
  choice: ils sont coupés
  rationale: Dans l’image agricole, le verbe indique vraisemblablement que le sommet de l’épi est tranché. « Coupés » maintient aussi l’idée plus large d’une fin soudaine.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme entre élévation et abaissement est conservé, de même que l’image agricole finale. Les ambiguïtés grammaticales et lexicales significatives sont signalées en notes.
