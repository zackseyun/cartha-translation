source:
  edition: WLC
  text: רֹעֶ֣ה עֲ֭קָרָה לֹ֣א תֵלֵ֑ד וְ֝/אַלְמָנָ֗ה לֹ֣א יְיֵטִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/021.yaml
  text: He preys on the barren woman who does not bear[a], and he does no good to the widow.
translation:
  language: fr
  text: Il s’en prend à la femme stérile, qui n’enfante pas[a], et ne fait aucun bien à la veuve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il se repaît de la femme stérile » ; le verbe hébreu signifie littéralement « faire paître, nourrir », mais il semble avoir ici un sens prédateur.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה
  choice: s’en prend à
  rationale: Le participe de רעה signifie normalement « faire paître, nourrir », mais ce sens paraît incongru ici. Dans ce contexte décrivant l’oppression des personnes vulnérables, « s’en prend à » exprime naturellement la valeur hostile probable sans imposer l’image plus précise de la dévoration.
- source_word: עֲקָרָה
  choice: la femme stérile
  rationale: Le terme désigne ici au féminin singulier une femme qui n’enfante pas. « Femme stérile » est clair, courant et explicite.
- source_word: לֹא תֵלֵד
  choice: qui n’enfante pas
  rationale: Cette formulation suit de près le sens littéral « elle n’enfante pas », sans ajouter l’idée modale explicite qu’elle ne pourrait pas avoir d’enfant.
- source_word: אַלְמָנָה
  choice: la veuve
  rationale: Équivalent français habituel de cette catégorie sociale particulièrement vulnérable.
- source_word: לֹא יְיֵטִיב
  choice: ne fait aucun bien à
  rationale: Le hiphil de יטב peut signifier « faire du bien à, bien traiter ». Cette traduction conserve la formulation morale générale et la proximité avec l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition entre « stérile » et « qui n’enfante pas » est conservée parce qu’elle appartient au texte hébreu. Le présent rend les participes et formes verbales dans la continuité de la description du méchant.
