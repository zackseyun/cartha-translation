    rationale: Cette expression ajoute le procès de « trouver » et transforme une forme passive / stative (« il est soutenu ») en action active. Une formulation passive conserve mieux le lexème et l’ambiguïté du texte.
  - severity: low
    issue: La note b présente « il trouve un appui » comme une formulation plus formelle.
    rationale: Cette formulation n’est ni plus formelle ni plus proche de la morphologie hébraïque. La variante formelle doit employer le singulier et une traduction passive du verbe.
