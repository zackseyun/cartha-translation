base_translation:
  language: en
  yaml_path: translation/ot/job/024/023.yaml
  text: He gives them security[a], and they are supported[b]; his eyes are on their ways.
translation:
  language: fr
  text: Il leur accorde la sécurité[a], et ils sont soutenus[b] ; ses yeux sont sur leurs chemins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte ici le singulier « à lui », puis « il est soutenu » ; le pluriel est employé dans la traduction à cause de la fin du verset : « leurs chemins ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou, de manière plus formelle : « Il lui accorde la sécurité, et il est soutenu ; ses yeux sont sur leurs chemins. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: accorde
  rationale: Le qal inaccompli de נתן exprime ici le fait de donner ou d’accorder. Le présent convient à l’énoncé poétique et général.
- source_word: ל֣וֹ
  choice: leur
  rationale: La forme hébraïque est au singulier (« à lui »), mais le pluriel final דַּרְכֵיהֶם (« leurs chemins ») invite à comprendre le personnage de manière collective ou distributive. Une note conserve la forme littérale.
- source_word: לָבֶטַח
  choice: la sécurité
  rationale: Le substantif בטח désigne la sécurité ou la sûreté. « La sécurité » s’emploie naturellement avec « accorder » sans transformer cette sécurité en sentiment intérieur de confiance.
- source_word: וְיִשָּׁעֵן
  choice: et ils trouvent un appui
  rationale: Le nifal de שׁען peut signifier « être soutenu », « s’appuyer » ou « trouver un appui ». Cette formulation française reste naturelle et conserve l’image d’un soutien, avec un sujet collectif en cohérence avec « leurs chemins ».
- source_word: וְעֵינֵיהוּ
  choice: ses yeux
  rationale: Le pluriel avec suffixe singulier se rend naturellement par « ses yeux ». Le possesseur singulier est très probablement Dieu dans le contexte, sans être nommé explicitement dans le verset.
- source_word: עַל
  choice: sur
  rationale: La préposition marque ici le regard attentif dirigé vers les chemins ou la conduite des personnes concernées.
- source_word: דַּרְכֵיהֶם
  choice: leurs chemins
  rationale: דרך peut désigner un chemin ou, figurativement, une manière d’agir. « Chemins » maintient la métaphore hébraïque et laisse entendre son sens moral.
theological_decisions:
- issue: Alternance entre les formes singulières et plurielles dans le verset
  choice: Rendre le premier mouvement collectivement (« leur… ils »), tout en conservant le possesseur singulier dans « ses yeux » et le pluriel final « leurs chemins ».
  alternative: 'Traduire plus formellement : « Il lui accorde la sécurité, et il trouve un appui ; ses yeux sont sur leurs chemins. »'
  rationale: L’hébreu associe « à lui » et un verbe singulier à « leurs chemins ». Le pluriel final suggère que le méchant est envisagé comme représentant d’un groupe, tandis que « ses yeux » renvoie vraisemblablement à Dieu. La traduction rend le sens collectif lisible sans dissimuler la discordance grammaticale, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Trouvent un appui » conserve l’image de שׁען tout en évitant une tournure passive lourde. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
