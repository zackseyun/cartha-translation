  text: גְּבֻל֥וֹת יַשִּׂ֑יגוּ עֵ֥דֶר גָּ֝זְל֗וּ וַ/יִּרְעֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/002.yaml
  text: They move boundary markers[b][a]; they seize a flock and pasture it.
translation:
  language: fr
  text: Ils déplacent des bornes[a] ; ils volent un troupeau et le font paître[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enlèvent les bornes ». Le verbe hébreu peut désigner le déplacement ou l’enlèvement de repères fonciers afin d’empiéter sur le terrain d’autrui.
    reason: lexical_alternative
  - marker: b
    text: Ou « s’emparent d’un troupeau et le font paître » ou « volent un troupeau et le conduisent comme bergers ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבֻלוֹת
  choice: les bornes des propriétés
  rationale: Le pluriel désigne ici les repères matériels qui délimitent les terrains. Cette formulation explicite leur fonction foncière en français moderne.
- source_word: יַשִּׂיגוּ
  choice: déplacent
  rationale: Dans ce contexte, le verbe évoque le déplacement frauduleux de bornes afin d’empiéter sur le terrain d’autrui. « Enlèvent » reste possible.
- source_word: עֵדֶר
  choice: un troupeau
  rationale: Le nom collectif singulier désigne couramment un troupeau ; l’article indéfini rend naturellement la forme hébraïque sans article.
- source_word: גָּזְלוּ
  choice: s’emparent de
  rationale: Le verbe exprime une prise injuste, par vol ou violence. « S’emparent de » conserve cette portée sans préciser indûment la manière.
- source_word: וַיִּרְעוּ
  choice: le font paître
  rationale: Le verbe רעה décrit ici l’action de mener le troupeau au pâturage ou de s’en occuper comme berger. La formulation française exprime clairement l’action.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le présent général décrit les agissements des méchants. « Bornes des propriétés » rend concret le cadre juridique et social, tandis que « le font paître » conserve l’image d’une appropriation ouverte du troupeau volé.
