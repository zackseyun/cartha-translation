  to: Ils arrachent l’orphelin à la mamelle[a] et prennent un gage au pauvre.
  rationale: La seule correction nécessaire remplace « au sein » par « à la mamelle ». Cette formulation française rend plus clairement l’idée d’un enfant retiré du sein nourricier, sans introduire dans le texte principal la précision interprétative « de sa mère ». La note conserve cette explicitation possible et signale la difficulté de l’expression hébraïque.
