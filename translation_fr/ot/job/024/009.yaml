  yaml_path: translation/ot/job/024/009.yaml
  text: They snatch the orphan from the breast[a], and they take a pledge from the poor.
translation:
  language: fr
  text: Ils arrachent l’orphelin à la mamelle[a] et prennent un gage au pauvre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils enlèvent l’orphelin du sein de sa mère. » L’expression hébraïque est difficile ; elle semble décrire la violence de ceux qui emportent même un enfant orphelin encore allaité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְזְלוּ
  choice: Ils arrachent
  rationale: Le verbe גזל exprime une prise violente ou injuste. « Arrachent » rend ici la brutalité de l’acte plus nettement que « volent » ou « dérobent ».
- source_word: מִשֹּׁד
  choice: au sein
  rationale: L’expression hébraïque est difficile. La compréhension traditionnelle « au sein » convient au contexte de violence envers les plus vulnérables, tout en évitant de préciser dans le texte principal ce que l’hébreu ne dit pas explicitement.
- source_word: יָתוֹם
  choice: l’orphelin
  rationale: יָתוֹם désigne couramment l’orphelin, souvent plus précisément l’enfant privé de père. « L’orphelin » est naturel et conserve la catégorie sociale vulnérable visée.
- source_word: וְעַל
  choice: au
  rationale: Avec חבל dans ce contexte économique, עַל introduit la personne à laquelle le gage est pris. « Au pauvre » est l’expression idiomatique française.
- source_word: עָנִי
  choice: pauvre
  rationale: Parmi les sens possibles de עָנִי — pauvre, affligé, malheureux — le sens socioéconomique convient le mieux au contexte d’une dette garantie par un gage.
- source_word: יַחְבֹּלוּ
  choice: prennent un gage
  rationale: Dans cet emploi, חבל désigne le fait de prendre un objet en gage pour garantir une dette. Cette formulation reste claire, concise et proche du registre juridique de l’hébreu.
