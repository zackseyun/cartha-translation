  source_fidelity: 'La seconde proposition rend fidèlement וְעַל־עָנִי יַחְבֹּלוּ : « prendre un gage au pauvre » exprime bien la saisie d’un objet en garantie. La première conserve l’interprétation traditionnelle de מִשֹּׁד comme « sein/mamelle », tout en signalant à juste titre la difficulté de l’hébreu. « À la mamelle » rend plus clairement le mouvement de séparation indiqué par מִן que « au sein ».'
  naturalness: « Arracher l’orphelin à la mamelle » est une tournure française biblique encore naturelle et intelligible dans un registre moderne soutenu. Elle est plus idiomatique et plus précise que « arracher l’orphelin au sein », qui peut suggérer un simple lieu ou une appartenance plutôt que l’arrachement d’un enfant allaité.
  terminology: « Orphelin », « pauvre » et « gage » sont appropriés. Le terme « mamelle » évite d’ajouter « de sa mère » au texte principal, tout en exprimant sans ambiguïté le sens traditionnel de שֹׁד dans ce contexte.
