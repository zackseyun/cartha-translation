source:
  edition: WLC
  text: הֵ֤מָּה הָיוּ֮ בְּֽ/מֹרְדֵ֫י א֥וֹר לֹֽא הִכִּ֥ירוּ דְרָכָ֑י/ו וְ/לֹ֥א יָ֝שְׁב֗וּ בִּ/נְתִיבֹתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/013.yaml
  text: These are among those who rebel against the light[a]; they do not recognize its ways[b], and they do not stay in its paths.
translation:
  language: fr
  text: Ceux-là font partie de ceux qui se révoltent contre la lumière[a] ; ils ne reconnaissent pas ses voies[b] et ne restent pas sur ses sentiers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ceux-là étaient parmi les rebelles à la lumière. » Le verbe hébreu est formellement au passé (« étaient »), mais, dans ce contexte poétique, il peut décrire une catégorie permanente de personnes.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement en hébreu : « ses voies… ses sentiers ». Les suffixes renvoient très probablement à « la lumière ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Ceux-là
  rationale: Le pronom indépendant est emphatique et désigne avec relief la catégorie de personnes décrite dans le contexte.
- source_word: הָיוּ
  choice: comptent
  rationale: Bien que la forme verbale soit formellement au passé (« étaient »), le vers décrit vraisemblablement une catégorie permanente. « Comptent parmi » exprime naturellement en français l’appartenance à cette catégorie, sans figer l’énoncé dans le passé.
- source_word: בְּמֹרְדֵי
  choice: parmi ceux qui se révoltent
  rationale: La préposition ב marque ici l’inclusion dans un groupe, tandis que la forme participiale conserve l’idée active de rébellion.
- source_word: אוֹר
  choice: la lumière
  rationale: La traduction directe préserve à la fois le sens concret de la lumière et ses possibles résonances morales, sans les expliciter indûment.
- source_word: לֹא הִכִּירוּ
  choice: ils ne reconnaissent pas
  rationale: הכיר peut signifier reconnaître, connaître ou admettre. « Reconnaître » convient à l’image des voies de la lumière et laisse subsister les nuances de perception et d’acceptation.
- source_word: דְרָכָיו
  choice: ses voies
  rationale: Le suffixe masculin singulier renvoie le plus naturellement à אוֹר, grammaticalement masculin en hébreu. En français, « ses » s’accorde avec la possession et permet de renvoyer naturellement à « la lumière ».
- source_word: וְלֹא יָשְׁבוּ
  choice: et ne restent pas
  rationale: Avec des sentiers comme complément, ישב exprime ici le fait de demeurer ou de se maintenir plutôt que l’action littérale de s’asseoir.
- source_word: בִּנְתִיבֹתָיו
  choice: sur ses sentiers
  rationale: נתיבה désigne un sentier ou une piste. « Sentiers » maintient la distinction lexicale avec « voies » ainsi que le parallélisme poétique ; « sur » est idiomatique en français.
theological_decisions:
- issue: Référent des suffixes dans « ses voies » et « ses sentiers »
  choice: Les suffixes renvoient à « la lumière ».
  alternative: Les suffixes renvoient à un antécédent personnel implicite, ce qui pourrait donner « ses voies » au sens des voies de Dieu.
  rationale: L’antécédent grammatical le plus proche est אוֹר (« lumière »), nom masculin singulier en hébreu, et toute l’image du verset porte sur la rébellion contre la lumière. Ce choix évite d’introduire une personnification théologique plus explicite que le texte hébreu.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. « Ceux-là comptent parmi » rend l’emphase et l’appartenance à une catégorie ; le parallélisme poétique « voies… sentiers » est conservé.
