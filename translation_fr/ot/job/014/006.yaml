source:
  edition: WLC
  text: שְׁעֵ֣ה מֵ/עָלָ֣י/ו וְ/יֶחְדָּ֑ל עַד יִ֝רְצֶ֗ה כְּ/שָׂכִ֥יר יוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/006.yaml
  text: Look away from him[a], so that he may rest, until he fulfills his day like a hired worker.
translation:
  language: fr
  text: Détourne de lui ton regard[a], afin qu’il ait du répit, jusqu’à ce qu’il jouisse de sa journée comme un travailleur salarié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Détourne de lui ton regard, et qu’il cesse, jusqu’à ce qu’il soit satisfait de sa journée comme un travailleur salarié. » Le verbe rendu par « ait du répit » signifie littéralement « cesse »; dans le contexte, il peut évoquer le répit. Le verbe rendu par « jouisse » peut aussi exprimer la satisfaction ou, selon l’interprétation, le fait d’arriver au terme de la journée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁעֵה מֵעָלָיו
  choice: Détourne de lui ton regard
  rationale: L’impératif demande à Dieu de détourner son attention de l’être humain. Cette formulation française est naturelle et conserve l’image du regard scrutateur.
- source_word: וְיֶחְדָּל
  choice: afin qu’il ait du répit
  rationale: Le verbe חדל signifie fondamentalement « cesser ». Dans ce contexte, il évoque la cessation de la pression ou de l’épreuve; « avoir du répit » exprime ce sens sans suggérer la disparition de l’homme.
- source_word: עַד
  choice: jusqu’à ce que
  rationale: Marque la limite temporelle du répit demandé.
- source_word: יִרְצֶה
  choice: il achève
  rationale: רצה peut exprimer le plaisir, l’acceptation ou la satisfaction. Dans l’image de l’ouvrier salarié et de sa journée, « achève » rend l’idée d’atteindre le terme assigné, tout en laissant l’autre nuance en note.
- source_word: כְּשָׂכִיר
  choice: comme un ouvrier salarié
  rationale: שׂכיר désigne une personne engagée contre salaire. « Ouvrier salarié » restitue clairement l’image socioéconomique en français moderne.
- source_word: יוֹמוֹ
  choice: sa journée
  rationale: Littéralement « son jour ». « Sa journée » convient naturellement à la comparaison avec l’ouvrier et peut désigner la journée de travail sans ajout explicatif.
theological_decisions:
- issue: Nature de la demande adressée à Dieu
  choice: La traduire comme une demande de détourner son regard afin d’accorder du répit
  alternative: Comprendre que Dieu doit simplement laisser l’homme cesser ou s’arrêter
  rationale: Le contexte soutient l’idée d’un retrait de la surveillance ou de la pression divine, mais le texte hébreu reste lexicalement ouvert; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe de Job à Dieu. La formulation conserve l’image du regard et celle de la journée d’un travailleur salarié.
