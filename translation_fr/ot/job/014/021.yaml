source:
  edition: WLC
  text: יִכְבְּד֣וּ בָ֭נָי/ו וְ/לֹ֣א יֵדָ֑ע וְ֝/יִצְעֲר֗וּ וְֽ/לֹא יָבִ֥ין לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/021.yaml
  text: His sons come to honor[a], and he does not know it; they are brought low, and he does not perceive it.
translation:
  language: fr
  text: Ses fils sont honorés[a], et il ne le sait pas ; ils sont abaissés, et il ne comprend pas ce qu’il en est d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ses fils accèdent aux honneurs » ; le verbe peut exprimer le fait de devenir honoré ou important.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְבְּדוּ
  choice: sont honorés
  rationale: Le qal de כבד avec « ses fils » pour sujet exprime ici l’accès à une condition honorable ou élevée. « Sont honorés » demeure naturel et conserve la possibilité d’un état acquis.
- source_word: בָנָיו
  choice: ses fils
  rationale: Le nom hébreu est au masculin pluriel avec suffixe de troisième personne masculine singulière ; « ses fils » en respecte la précision.
- source_word: וְלֹא יֵדָע
  choice: mais il ne le sait pas
  rationale: ידע signifie « savoir, connaître ». Le pronom « le » reprend naturellement la situation précédente, et « mais » rend en français le contraste porté par la coordination.
- source_word: וְיִצְעֲרוּ
  choice: ils sont abaissés
  rationale: צער contraste ici avec l’honneur et désigne une réduction de rang, d’importance ou de condition. « Sont abaissés » préserve ce contraste sans préciser indûment la cause.
- source_word: וְלֹא יָבִין לָמוֹ
  choice: mais il ne s’en rend pas compte
  rationale: בין exprime le discernement ou la perception, tandis que לָמוֹ renvoie aux fils. La tournure idiomatique « s’en rendre compte » inclut ce rapport sans produire un français artificiel.
theological_decisions:
- issue: Portée de l’ignorance du mort concernant le sort de ses fils
  choice: Formuler seulement qu’il ne sait ni ne perçoit leur élévation ou leur abaissement
  alternative: En tirer une affirmation générale sur l’état de conscience après la mort
  rationale: Le verset décrit l’absence de connaissance du personnage à l’égard du sort de ses fils ; il ne convient pas d’élargir cette observation en doctrine systématique.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme entre honneur et abaissement est conservé, ainsi que la distinction entre savoir et percevoir.
