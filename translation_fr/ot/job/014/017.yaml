  text: My transgression is sealed up in a bag[a], and you cover over my iniquity.
translation:
  language: fr
  text: 'Ma transgression est scellée dans un sac,

    et tu recouvres ma faute[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu est difficile. On pourrait aussi traduire : « tu poses un enduit sur », « tu couds » ou « tu fixes par-dessus » ma faute. L’image exacte est discutée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתֻם
  choice: est scellée
  rationale: 'Le participe passif exprime un état résultant : la transgression est enfermée et mise en sûreté sous un sceau.'
- source_word: בִּצְרוֹר
  choice: dans un sac
  rationale: צְרוֹר peut désigner un ballot lié, une bourse ou un sac. « Sac » garde l’image concrète d’une chose enfermée et conservée, dans un français naturel.
- source_word: פִּשְׁעִי
  choice: ma transgression
  rationale: פֶּשַׁע désigne une transgression et peut comporter l’idée de révolte. « Transgression » conserve ici le poids moral du terme sans renforcer excessivement cette dernière nuance.
- source_word: וַתִּטְפֹּל
  choice: tu recouvres
  rationale: Le sens précis de טפל est difficile dans ce passage; il peut évoquer l’application d’un enduit, l’attachement ou la fermeture. « Tu recouvres » préserve l’image générale tout en restant intelligible; les possibilités plus concrètes sont signalées en note.
- source_word: עַל
  choice: sur
  rationale: Avec טפל, la préposition indique naturellement ce sur quoi une matière ou une couverture est appliquée.
- source_word: עֲוֺנִי
  choice: ma faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou ses conséquences. « Faute » garde la portée morale du mot tout en le distinguant de פֶּשַׁע dans le premier membre.
theological_decisions:
- issue: 'Portée de l’image : conservation des fautes ou pardon'
  choice: La formulation présente les fautes de Job comme enfermées et recouvertes en vue d’être conservées et comptées contre lui.
  alternative: L’image pourrait être comprise comme la dissimulation ou l’effacement des fautes, et donc comme une évocation du pardon.
  rationale: Dans le contexte immédiat de la plainte de Job, notamment le verset précédent, Dieu paraît surveiller et retenir ses fautes. Le texte ne doit donc pas introduire explicitement l’idée de pardon, tout en laissant subsister l’ambiguïté propre à l’image.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme est conservé sur deux lignes; « transgression » et « faute » maintiennent la distinction entre les deux termes hébreux sans imposer une terminologie confessionnelle.
