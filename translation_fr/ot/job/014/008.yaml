  text: Though its root grows old in the earth[a], and its stump dies in the dust[b],
translation:
  language: fr
  text: 'Même si sa racine vieillit dans la terre[a]

    et que sa souche meurt dans la poussière[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si sa racine vieillit dans la terre. » La particule hébraïque peut exprimer une condition, mais, dans le déroulement de l’image de l’arbre, elle a vraisemblablement ici une valeur concessive.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « tronc ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Même si
  rationale: 'Dans le développement de l’image de l’arbre, la particule introduit vraisemblablement une concession : malgré un état apparemment désespéré, la reprise demeure possible au verset suivant. La valeur conditionnelle reste néanmoins possible et est signalée en note.'
- source_word: יַזְקִין
  choice: vieillit
  rationale: Le verbe exprime ici le fait de devenir vieux. « Vieillit » est direct, naturel et conserve l’idée d’un processus.
- source_word: בָּאָרֶץ
  choice: dans la terre
  rationale: Dans ce contexte botanique, אָרֶץ désigne la terre où se trouve la racine. « Terre » garde aussi la dignité poétique du passage.
- source_word: שָׁרְשׁוֹ
  choice: sa racine
  rationale: Le singulier hébreu est conservé et peut désigner collectivement le système racinaire de l’arbre.
- source_word: וּבֶעָפָר
  choice: et dans la poussière
  rationale: עָפָר désigne la poussière ou la terre meuble. « Poussière » préserve la résonance poétique liée à la mortalité dans le livre de Job.
- source_word: יָמוּת
  choice: meurt
  rationale: Traduction directe du verbe courant « mourir », sans ajouter l’idée de flétrissement absente du terme.
- source_word: גִּזְעוֹ
  choice: sa souche
  rationale: גֵּזַע désigne ici la partie ligneuse restante d’un arbre abattu. « Souche » est le terme français naturel dans ce contexte et convient à l’image d’une repousse possible.
