  text: Surely his flesh on him feels pain[b][a], and his soul on him mourns.
translation:
  language: fr
  text: Certes, sa chair lui fait mal, et son âme est en deuil[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète littéralement « sur lui » après « sa chair » et après « son âme » : une tournure concise et difficile à reproduire naturellement en français, qui peut exprimer le rapport personnel de la douleur et du deuil. « Certes » traduit אַךְ, qui peut aussi se comprendre « seulement », « mais » ou « assurément ». « Âme » traduit נֶפֶשׁ, terme qui peut aussi désigner la vie, la personne ou l’être intérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mais… ne… que
  rationale: La particule peut être restrictive, emphatique ou adversative. Dans la conclusion contrastive du passage, cette formulation française garde à la fois le contraste et la restriction possibles.
- source_word: בְּשָׂרוֹ
  choice: sa chair
  rationale: « Chair » conserve l’image concrète de l’hébreu et le parallélisme avec נַפְשׁוֹ.
- source_word: עָלָיו
  choice: pour lui-même
  rationale: La tournure hébraïque littérale « sur lui » est peu naturelle en français. « Pour lui-même » exprime ici le rapport personnel ou réflexif possible sans introduire l’idée plus interprétative de « en lui ».
- source_word: יִכְאָב
  choice: souffre
  rationale: Le verbe exprime l’expérience de la douleur; « souffre » est naturel et suffisamment large en français.
- source_word: נַפְשׁוֹ
  choice: son être
  rationale: נֶפֶשׁ peut désigner l’être vivant, la personne, la vie ou l’âme. « Son être » préserve ici la dimension personnelle et intérieure sans imposer une anthropologie dualiste.
- source_word: תֶּאֱבָל
  choice: porte le deuil
  rationale: Le verbe signifie mener deuil, se lamenter. « Porte le deuil » conserve sa force funèbre dans le contexte.
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ en parallèle avec « chair »
  choice: son être
  alternative: son âme
  rationale: Le terme hébreu ne désigne pas nécessairement une âme séparée du corps. « Être » maintient l’ambiguïté entre personne, vie et être intérieur; la note signale les autres traductions possibles.
- issue: Portée de עָלָיו répété
  choice: pour lui-même dans les deux membres
  alternative: sur lui / en lui
  rationale: La répétition est conservée par une même expression française. Elle peut indiquer que la douleur et le deuil ne concernent que l’homme lui-même, mais l’hébreu compact permet d’autres analyses.
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme et la répétition de l’hébreu sont maintenus autant que possible, avec des notes pour sa syntaxe particulièrement compacte et ambiguë.
