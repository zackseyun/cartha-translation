review_pass:
  verdict: revise
  source_fidelity: La formulation « ne souffre que pour lui-même » transforme la construction קשה et elliptique עָלָיו (« sur lui ») en une restriction explicite quant à l’objet ou au bénéficiaire de la souffrance. Cette interprétation n’est pas assurée par le texte. De plus, « Mais… ne… que » fait d’אַךְ une restriction doublement intégrée à la proposition, alors que sa valeur peut être emphatique (« certes ») ou restrictive sans déterminer ainsi le sens de עָלָיו. Une traduction française sobre doit conserver l’orientation personnelle des deux occurrences sans en préciser indûment la portée.
  naturalness: « Sa chair lui fait mal » est idiomatique en français moderne et rend naturellement l’idée de douleur corporelle. « Son âme est en deuil » est poétique mais courant et digne. La répétition exacte de « sur lui » serait artificielle en français; elle doit être signalée en note plutôt que reproduite par « pour lui-même », qui modifie le sens.
  terminology: « Chair » préserve בְּשָׂרוֹ. « Âme » rend נַפְשׁוֹ dans le parallélisme avec la chair sans trancher la question anthropologique; une note indique les sens possibles (« vie », « personne », « être »). « Être » seul est plus abstrait et affaiblit le parallélisme poétique. « Est en deuil » rend bien le champ de אבל sans suggérer nécessairement un deuil rituel.
  issues:
  - severity: high
    issue: « ne souffre que pour lui-même » / « ne porte le deuil que pour lui-même »
    rationale: Ces expressions donnent à עָלָיו le sens spécifique de « pour lui-même » et font porter « que » sur l’objet de la souffrance et du deuil. Le texte hébreu ne fixe pas cette lecture; la locution répétée est elliptique et peut évoquer une expérience personnelle (« sur/en lui »), sans exclure d’autres analyses.
  - severity: medium
    issue: Valeur de אַךְ rendue par « Mais… ne… que »
    rationale: Cette solution cumule une adversative et une restriction grammaticale qui resserre trop le sens. « Certes » garde l’emphase possible sans imposer une syntaxe restrictive.
  - severity: medium
    issue: « son être » pour נַפְשׁוֹ
    rationale: Bien que possible dans certains contextes, « être » est abstrait en français et atténue le parallélisme concret et poétique entre chair et נפש. « Âme », accompagnée d’une note non dogmatique, est plus naturel ici.
