id: JOB.14.1
reference: Job 14:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֭דָם יְל֣וּד אִשָּׁ֑ה קְצַ֥ר יָ֝מִ֗ים וּֽ/שְׂבַֽע רֹֽגֶז־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/001.yaml
  text: Man[a], born of woman[b], is short of days and full of turmoil.
translation:
  language: fr
  text: L’être humain[a], né d’une femme, a la vie brève et est rassasié de tourment[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « L’homme »; l’hébreu emploie ici un singulier générique qui désigne la condition humaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « de trouble », « d’agitation » ou « d’inquiétude ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: L’être humain
  rationale: Le singulier générique décrit ici la condition humaine. « L’être humain » conserve cette valeur représentative en français moderne sans limiter l’énoncé au sexe masculin.
- source_word: יְלוּד אִשָּׁה
  choice: né d’une femme
  rationale: Cette formulation naturelle et concrète reproduit fidèlement la construction participiale hébraïque et souligne la condition mortelle commune.
- source_word: קְצַר יָמִים
  choice: a la vie brève
  rationale: L’hébreu signifie littéralement « court de jours ». La formulation choisie transmet clairement l’idée d’une existence de courte durée tout en gardant un registre digne.
- source_word: וּשְׂבַע רֹגֶז
  choice: et est rassasié de tourment
  rationale: « Rassasié » préserve l’image forte de שְׂבַע, celle d’une personne remplie jusqu’à satiété, tandis que « tourment » peut englober l’agitation intérieure et l’affliction extérieure.
- source_word: רֹגֶז
  choice: tourment
  rationale: Dans la plainte de Job, le mot désigne une existence troublée et agitée; « tourment » conserve cette amplitude mieux qu’un terme uniquement psychologique.
theological_decisions:
- issue: Rendu du singulier générique אָדָם
  choice: L’être humain
  alternative: L’homme; un être humain; l’humanité
  rationale: Le verset énonce une vérité générale sur la condition humaine au moyen d’un singulier représentatif. « L’être humain » maintient ce singulier sans introduire une restriction masculine.
- issue: Portée de רֹגֶז
  choice: tourment
  alternative: trouble; agitation; inquiétude
  rationale: Le contexte ne permet pas de réduire le mot à une émotion intérieure ou à des difficultés extérieures seulement. « Tourment » laisse subsister cette amplitude.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme concis est préservé; « rassasié de tourment » conserve l’image hébraïque plus nettement que le simple « rempli de troubles ».
