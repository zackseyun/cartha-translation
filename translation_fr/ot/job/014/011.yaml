  text: Les eaux disparaissent de la mer, et le fleuve tarit et se dessèche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָזְלוּ
  choice: se retirent
  rationale: Le verbe exprime ici l’idée que les eaux s’en vont ou disparaissent; « se retirent » est naturel en français tout en conservant l’image.
- source_word: יָם
  choice: mer
  rationale: Équivalent direct du nom hébreu, sans préciser artificiellement s’il s’agit d’une mer, d’un lac ou d’un bassin particulier.
- source_word: נָהָר
  choice: fleuve
  rationale: Le terme désigne un cours d’eau; « fleuve » conserve la formulation traditionnelle et l’ampleur de l’image.
- source_word: יֶחֱרַב
  choice: tarit
  rationale: Dans ce contexte hydrologique, le verbe décrit le cours d’eau qui devient sec; « tarit » rend cette évolution avec concision.
- source_word: וְיָבֵשׁ
  choice: et se dessèche
  rationale: Cette expression préserve le second verbe hébreu et son parallélisme intensifiant, sans le confondre avec יֶחֱרַב.
