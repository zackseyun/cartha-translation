source:
  edition: WLC
  text: כִּ֤י יֵ֥שׁ לָ/עֵ֗ץ תִּ֫קְוָ֥ה אִֽם יִ֭כָּרֵת וְ/ע֣וֹד יַחֲלִ֑יף וְ֝/יֹֽנַקְתּ֗/וֹ לֹ֣א תֶחְדָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/007.yaml
  text: 'For there is hope for a tree: if it is cut down[a], it will sprout again[b], and its shoot will not cease.'
translation:
  language: fr
  text: 'Car il y a de l’espoir pour un arbre : s’il est abattu, il repoussera[a], et son rejet[b] ne cessera pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se renouvellera »; dans l’image de l’arbre, le verbe hébreu évoque concrètement une nouvelle croissance.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « jeune pousse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve la valeur causale du terme hébreu.
- source_word: יֵשׁ לָעֵץ תִּקְוָה
  choice: il y a de l’espoir pour un arbre
  rationale: Rend naturellement la tournure existentielle hébraïque et le caractère général, presque proverbial, de l’image.
- source_word: אִם יִכָּרֵת
  choice: s’il est abattu
  rationale: Conserve la forme conditionnelle de אִם et la voix passive du nifal; « abattu » convient précisément à un arbre.
- source_word: וְעוֹד יַחֲלִיף
  choice: il repoussera
  rationale: Dans ce contexte végétal, le verbe désigne le renouvellement de la croissance; « repoussera » exprime en français à la fois la reprise et la nouvelle pousse.
- source_word: וְיֹנַקְתּוֹ
  choice: et son rejet
  rationale: Le nom désigne une pousse nouvelle ou un rejet issu de l’arbre. « Rejet » est précis et garde le singulier hébreu.
- source_word: לֹא תֶחְדָּל
  choice: ne cessera pas
  rationale: Reproduit sobrement l’expression absolue du texte hébreu sans ajouter explicitement une activité telle que « croître » ou « pousser ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. La formulation reste proche de la structure hébraïque, tout en employant le verbe idiomatique « repousser » pour l’image végétale. L’expression finale « ne cessera pas » conserve l’ellipse et la force du texte source.
