base_translation:
  language: en
  yaml_path: translation/ot/job/014/002.yaml
  text: Like a flower he comes forth and withers[a]; he flees like a shadow and does not remain.
translation:
  language: fr
  text: Il paraît comme une fleur, puis se fane[a] ; il fuit comme l’ombre et ne subsiste pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est coupé » ; le verbe hébreu peut évoquer soit le flétrissement, soit le fait d’être coupé, notamment dans l’image de la fleur.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִיץ
  choice: Comme une fleur
  rationale: צִיץ désigne une fleur ou une floraison. « Fleur » est naturel en français moderne et conserve l’image poétique de la fragilité humaine.
- source_word: יָצָא
  choice: il éclôt
  rationale: Le verbe signifie littéralement « sortir ». Appliqué à une fleur, « éclôt » exprime naturellement son apparition tout en restant fidèle à l’image du texte.
- source_word: וַיִּמָּל
  choice: puis se flétrit
  rationale: Dans cette image florale, le verbe peut évoquer le flétrissement, mais aussi le fait d’être coupé. « Se flétrit » donne le sens contextuel le plus naturel, tandis qu’une note conserve l’autre possibilité.
- source_word: וַיִּבְרַח
  choice: il fuit
  rationale: ברח signifie normalement « fuir ». Ce choix préserve la vigueur de l’image et la rapidité de la disparition.
- source_word: כַּצֵּל
  choice: comme l’ombre
  rationale: Équivalent direct et naturel qui exprime le caractère fugitif de la vie.
- source_word: וְלֹא יַעֲמוֹד
  choice: et ne demeure pas
  rationale: עמד signifie littéralement « se tenir », mais désigne ici le fait de subsister ou de rester. « Ne demeure pas » rend clairement cette idée sans effacer la tonalité poétique.
theological_decisions: []
