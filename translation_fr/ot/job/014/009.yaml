  source_fidelity: 'Le texte rend fidèlement l’image hébraïque : la réaction de l’arbre à la seule odeur de l’eau (מֵרֵיחַ מַיִם), son bourgeonnement (יַפְרִחַ) et la production d’une nouvelle végétation. « Rameaux » est une interprétation contextuellement plausible de קָצִיר, dont la valeur exacte demeure discutée ; la note conserve explicitement l’alternative agricole habituelle (« récolte »). « Comme une plante » traduit sans ajout l’expression comparative כְּמוֹ נָטַע.'
