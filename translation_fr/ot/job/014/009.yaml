  text: at the scent of water it will bud and produce growth like a planted tree[a].
translation:
  language: fr
  text: 'À l’odeur de l’eau, il bourgeonne

    et produit des rameaux comme une plante[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et produit une récolte comme ce qui a été planté ». Le mot hébreu traduit par « rameaux » signifie habituellement « moisson » ou « récolte », mais il peut désigner ici les pousses ou la ramure nouvelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵיחַ
  choice: À l’odeur de
  rationale: רֵיחַ désigne littéralement une odeur ou un parfum. Avec la préposition מִן, l’expression évoque ici la réaction de l’arbre à la seule proximité perceptible de l’eau; « à l’odeur de » conserve cette image poétique.
- source_word: מַיִם
  choice: l’eau
  rationale: Bien que de forme plurielle en hébreu, מַיִם fonctionne couramment comme un nom massif; le singulier est naturel en français.
- source_word: יַפְרִחַ
  choice: il bourgeonne
  rationale: La forme causative de פרח peut exprimer le fait de pousser, bourgeonner ou fleurir. « Bourgeonne » convient au retour à la vie de l’arbre coupé sans suggérer trop tôt sa floraison.
- source_word: וְעָשָׂה קָצִיר
  choice: et produit des rameaux
  rationale: עָשָׂה signifie largement « faire, produire ». Dans ce contexte végétal, קָצִיר peut être compris comme la nouvelle ramure ou les pousses produites; « produit des rameaux » rend naturellement cette reprise de croissance, tout en signalant en note l’autre sens possible.
- source_word: כְּמוֹ נָטַע
  choice: comme une plante
  rationale: כְּמוֹ introduit la comparaison, et נָטַע désigne ici ce qui est planté, donc une plante. Cette formulation reste concise et n’ajoute pas explicitement « arbre », même si le contexte en parle.
