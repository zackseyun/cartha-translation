  terminology: Le vocabulaire végétal est cohérent avec le contexte immédiat de l’arbre coupé. « Bourgeonne » évite de limiter יַפְרִחַ à la floraison. « Rameaux » est recevable, à condition de maintenir la note, ce que fait le projet. Aucun terme théologique ou nom propre ne demande d’intervention.
