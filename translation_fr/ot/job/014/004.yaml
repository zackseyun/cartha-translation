  yaml_path: translation/ot/job/014/004.yaml
  text: Who can bring a clean thing out of an unclean? No one[a].
translation:
  language: fr
  text: Qui peut faire sortir le pur de l’impur ? Personne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pas un. »'
    reason: La formulation littérale לֹא אֶחָד est « pas un » ; cette variante préserve l’ellipse et l’insistance de l’hébreu.
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif introduit une question rhétorique directe ; la capacité implicite ressort naturellement du contexte et du verbe.
- source_word: יִתֵּן
  choice: peut tirer
  rationale: Bien que נתן signifie littéralement « donner », l’expression désigne ici le fait de faire provenir ou de produire une chose à partir d’une autre. « Peut tirer » rend naturellement l’idée et l’impossibilité sous-entendue.
- source_word: טָהוֹר
  choice: le pur
  rationale: L’adjectif est employé substantivement. « Le pur » conserve la formulation brève et la catégorie volontairement indéterminée de l’hébreu.
- source_word: מִטָּמֵא
  choice: de l’impur
  rationale: La préposition מִן marque la provenance, et טָמֵא est probablement substantivé. « De l’impur » maintient le parallélisme lexical avec « le pur » sans préciser s’il s’agit d’une personne, d’une chose ou d’un état.
- source_word: לֹא אֶחָד
  choice: Personne
  rationale: Cette réponse elliptique signifie littéralement « pas un ». « Personne » en exprime clairement la négation absolue en français moderne.
theological_decisions:
- issue: Référent du langage de pureté et d’impureté
  choice: Formulation générale sur l’impossibilité de faire provenir le pur de l’impur, appliquée dans le contexte à la condition humaine.
  alternative: Allusion précise à la naissance issue de parents impurs, ou proverbe portant spécialement sur l’impureté morale ou rituelle.
  rationale: L’hébreu est bref et ne précise ni le sujet ni la nature de la pureté. La traduction garde donc ouvertes les dimensions rituelle, morale, héréditaire et existentielle.
translation_notes:
  register: Français moderne, concis et digne. Le couple « le pur / l’impur » reproduit la symétrie de l’hébreu tout en préservant l’ambiguïté du référent.
