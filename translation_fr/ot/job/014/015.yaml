source:
  edition: WLC
  text: תִּ֭קְרָא וְ/אָנֹכִ֣י אֶֽעֱנֶ֑/ךָּ לְֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ תִכְסֹֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/015.yaml
  text: You would call[a], and I would answer you[b]; you would long for the work of your hands.
translation:
  language: fr
  text: Tu appellerais, et moi, je te répondrais ; tu désirerais ardemment[a] l’œuvre de tes mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu languirais après ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « l’œuvre de tes mains » désigne ici l’être humain comme créature façonnée par Dieu.
    reason: cultural_note
lexical_decisions:
- source_word: תִּקְרָא
  choice: tu appellerais
  rationale: 'Le qal inaccompli à la 2e personne du masculin singulier reçoit ici une valeur modale, dans la continuité du souhait exprimé par Job : il imagine ce que Dieu ferait.'
- source_word: וְאָנֹכִי
  choice: et moi, je
  rationale: Le pronom personnel explicite est emphatique. « Et moi, je » restitue naturellement en français la réponse de Job à l’appel de Dieu.
- source_word: אֶעֱנֶךָּ
  choice: je te répondrais
  rationale: Le qal inaccompli à la 1re personne du singulier, avec suffixe de 2e personne, signifie directement « répondre à quelqu’un ». Le conditionnel s’accorde avec la nuance modale du premier verbe.
- source_word: לְמַעֲשֵׂה
  choice: l’œuvre
  rationale: מַעֲשֶׂה peut désigner une action, un travail ou son produit. Avec « tes mains », « l’œuvre » conserve l’image de ce que Dieu a façonné.
- source_word: יָדֶיךָ
  choice: de tes mains
  rationale: La formulation littérale préserve l’image anthropomorphique de Dieu comme créateur, sans la réduire à une expression abstraite.
- source_word: תִכְסֹף
  choice: tu désirerais ardemment
  rationale: Le verbe כסף exprime un désir intense, une aspiration ou une profonde nostalgie. « Désirer ardemment » est clair en français moderne et conserve cette force affective.
theological_decisions:
- issue: Le verset évoque-t-il un simple regard favorable de Dieu ou son désir profond pour la créature humaine ?
  choice: tu désirerais ardemment l’œuvre de tes mains
  alternative: tu porterais ton regard sur l’œuvre de tes mains
  rationale: 'Le sens naturel de כסף est celui d’un désir intense plutôt que d’une simple considération. Cette traduction maintient la tension de l’espérance de Job : Dieu désirerait de nouveau celui qu’il a lui-même façonné, au lieu de demeurer dans une relation de jugement.'
translation_notes:
  register: Français moderne, accessible et digne. Le conditionnel rend le scénario espéré par Job ; « et moi, je » conserve l’emphase du pronom hébreu. « Désirer ardemment » communique la force de כסף sans archaïsme excessif.
