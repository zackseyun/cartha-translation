id: JOB.14.13
reference: Job 14:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ֤י יִתֵּ֨ן בִּ/שְׁא֬וֹל תַּצְפִּנֵ֗/נִי תַּ֭סְתִּירֵ/נִי עַד שׁ֣וּב אַפֶּ֑/ךָ תָּ֤שִׁ֥ית לִ֖/י חֹ֣ק וְ/תִזְכְּרֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/013.yaml
  text: Oh[a], that you would hide me in Sheol, that you would conceal me until your anger turns away[b], that you would appoint a time for me and remember me!
translation:
  language: fr
  text: Ah ! si tu me cachais dans le shéol[a], si tu me dissimulais jusqu’à ce que ta colère se détourne, si tu fixais pour moi un terme[b] et te souvenais de moi !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans la tombe » ou « dans le séjour des morts ». Hébreu : « shéol ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « un temps fixé ». Le nom hébreu peut désigner ce qui est fixé, prescrit ou délimité.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ah ! si tu…
  rationale: Cette locution hébraïque exprime ici un souhait ardent, non une question littérale. La tournure française « Ah ! si… » en restitue naturellement la force optative.
- source_word: בִּשְׁאוֹל
  choice: dans le shéol
  rationale: La translittération conserve la notion hébraïque du séjour des morts sans la réduire à la tombe ni lui attribuer le sens doctrinal plus tardif d’enfer.
- source_word: תַּצְפִּנֵנִי / תַּסְתִּירֵנִי
  choice: tu me cachais / tu me dissimulais
  rationale: Les deux verbes proches sont rendus par des termes distincts afin de préserver leur parallélisme poétique et leur effet d’intensification.
- source_word: עַד שׁוּב אַפֶּךָ
  choice: jusqu’à ce que ta colère se détourne
  rationale: « Se détourne » conserve l’image de שׁוּב tout en exprimant clairement et naturellement la cessation de la colère divine.
- source_word: תָּשִׁית לִי חֹק
  choice: tu fixais pour moi un terme
  rationale: « Terme » peut désigner à la fois une échéance fixée et une limite déterminée. Ce choix préserve la latitude de חֹק sans imposer exclusivement l’idée de date, de décret ou de frontière.
- source_word: וְתִזְכְּרֵנִי
  choice: et te souvenais de moi
  rationale: Cette formulation directe garde la portée relationnelle de l’acte divin de se souvenir, sans l’expliciter davantage.
theological_decisions:
- issue: Sens de שְׁאוֹל
  choice: le shéol
  alternative: la tombe ; le séjour des morts
  rationale: Le contexte évoque le domaine des morts comme lieu où Job voudrait être caché jusqu’à l’apaisement de la colère divine. La translittération évite aussi bien de réduire ce domaine à une sépulture que d’y importer une doctrine ultérieure de l’enfer.
- issue: Nature du חֹק fixé pour Job
  choice: un terme
  alternative: un temps fixé ; une limite ; un décret
  rationale: Le contexte suggère probablement une période ou une échéance déterminée, mais le nom hébreu désigne plus largement ce qui est fixé ou prescrit. « Terme » maintient cette ambiguïté pertinente.
translation_notes:
  register: Français international moderne, poétique et digne. La reprise de « si tu » rend la supplication insistante de Job, tandis que « cacher » et « dissimuler » préservent le parallélisme hébreu. Les appels de note sont placés sur les expressions qu’ils expliquent.
