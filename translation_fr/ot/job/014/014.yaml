reference: Job 14:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם יָמ֥וּת גֶּ֗בֶר הֲ/יִ֫חְיֶ֥ה כָּל יְמֵ֣י צְבָאִ֣/י אֲיַחֵ֑ל עַד בּ֝֗וֹא חֲלִיפָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/014.yaml
  text: If a man dies[a], will he live again? All the days of my hard service I would wait, until my relief comes.
translation:
  language: fr
  text: Si un homme meurt, revivra-t-il ? Tous les jours de mon pénible service, j’attendrais jusqu’à ce que survienne mon changement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma relève » ou « mon renouvellement ». Le terme hébreu peut désigner un changement, une relève ou un renouvellement.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit la condition qui porte la question rhétorique, sans la transformer en proposition temporelle avec « quand ».
- source_word: יָמוּת
  choice: meurt
  rationale: Le présent français exprime naturellement une éventualité générale après « si ».
- source_word: גֶּבֶר
  choice: un homme
  rationale: Conserve le singulier masculin du terme hébreu, qui désigne ici l’être humain sous l’aspect de l’homme mortel.
- source_word: הֲיִחְיֶה
  choice: revivra-t-il ?
  rationale: Le préfixe « re- » rend explicite le retour à la vie impliqué par la succession mourir-vivre, sans en faire une affirmation doctrinale.
- source_word: כָּל יְמֵי צְבָאִי
  choice: Tous les jours de mon pénible service
  rationale: צָבָא peut désigner le service, notamment militaire, ou un temps assigné. « Pénible service » communique ici la durée imposée et éprouvante sans réduire l’image à la guerre.
- source_word: אֲיַחֵל
  choice: j’attendrais
  rationale: Le conditionnel français maintient le lien avec l’hypothèse précédente. Le verbe hébreu associe attente et espérance; dans cette construction avec « jusqu’à », l’attente est au premier plan.
- source_word: עַד בּוֹא
  choice: jusqu’à ce que vienne
  rationale: Rend naturellement la construction temporelle hébraïque tout en conservant la venue attendue.
- source_word: חֲלִיפָתִי
  choice: ma relève
  rationale: « Relève » peut évoquer à la fois la fin d’un service pénible, un remplacement et un changement de condition. Ce choix préserve mieux l’ouverture du terme que des formulations explicitement résurrectionnelles.
theological_decisions:
- issue: Le verset affirme-t-il clairement une résurrection après la mort, ou exprime-t-il une possibilité espérée ?
  choice: La question « revivra-t-il ? » reste ouverte, et « ma relève » ne définit pas précisément la nature du changement attendu.
  alternative: Employer « ma résurrection » ou « mon retour à la vie », ce qui ferait du verset une affirmation doctrinale plus explicite.
  rationale: L’hébreu présente une interrogation suivie d’une attente hypothétique. Il faut préserver cette tension et ne pas transformer l’espérance de Job en déclaration dogmatique.
translation_notes:
  register: Français international moderne, digne et accessible. L’inversion interrogative convient au registre poétique sans être archaïque. « Pénible service » maintient l’image d’une période imposée, tandis que « relève » fait écho à cette image et conserve l’ambiguïté du dernier terme.
