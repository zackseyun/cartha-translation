  text: But even a mountain falling wears away[b][a], and a rock is moved from its place.
translation:
  language: fr
  text: Mais même une montagne qui s’effondre finit par disparaître[a], et un rocher est déplacé de sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dépérit » ou « se flétrit » : le verbe désigne le plus souvent ce qui se flétrit ou dépérit ; il est ici appliqué métaphoriquement à une montagne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mais même
  rationale: Rend à la fois la forte transition adversative et l’emphase introduisant l’image de réalités apparemment durables qui disparaissent.
- source_word: הַר נוֹפֵל יִבּוֹל
  choice: une montagne finit par s’effondrer
  rationale: Formulation poétique naturelle en français. Le participe נוֹפֵל évoque la chute, tandis que יִבּוֹל, habituellement employé pour ce qui se flétrit ou dépérit, décrit ici métaphoriquement la ruine progressive d’une montagne.
- source_word: וְצוּר
  choice: et un rocher
  rationale: « Rocher » conserve le sens large de צוּר et forme un parallélisme naturel avec « montagne ».
- source_word: יֶעְתַּק
  choice: est déplacé
  rationale: Le verbe exprime l’idée d’être ôté ou déplacé; la tournure passive préserve la formulation du texte sans préciser l’agent.
- source_word: מִמְּקֹמוֹ
  choice: de son lieu
  rationale: Rendu proche de la construction hébraïque et adapté au registre poétique, en soulignant qu’une masse réputée fixe est arrachée à sa place.
