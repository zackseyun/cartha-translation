source:
  edition: WLC
  text: וְ/גֶ֣בֶר יָ֭מוּת וַֽ/יֶּחֱלָ֑שׁ וַ/יִּגְוַ֖ע אָדָ֣ם וְ/אַיּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/010.yaml
  text: But a man dies and is laid low[a]; a human being expires[c][b], and where is he?
translation:
  language: fr
  text: Mais l’homme meurt et s’affaiblit[a] ; l’être humain[c] expire[b], et où est-il ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devient sans force » ; « perd ses forces ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut évoquer le fait de rendre le dernier souffle.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu emploie en parallèle deux mots, גבר (« homme », avec une possible nuance de vigueur) et אדם (« être humain »), soulignant ainsi la mortalité humaine.
    reason: cultural_note
lexical_decisions:
- source_word: גֶּבֶר
  choice: l’homme
  rationale: Le nom désigne ici un homme dans sa vigueur, mais le contexte met précisément en relief son impuissance devant la mort. « L’homme » reste naturel et n’ajoute pas la notion plus étroite de guerrier.
- source_word: יָמוּת
  choice: meurt
  rationale: L’imparfait exprime ici une vérité générale sur la condition humaine ; le présent français en rend naturellement la portée gnomique.
- source_word: וַיֶּחֱלָשׁ
  choice: reste sans force
  rationale: Le verbe חלש évoque l’affaiblissement ou la perte de puissance. Dans la séquence qui décrit la mort, « reste sans force » exprime l’état d’impuissance qui en résulte sans introduire l’image absente du texte d’être terrassé.
- source_word: וַיִּגְוַע
  choice: expire
  rationale: גוע désigne le fait de rendre le dernier souffle, de mourir. « Expire » est concis, digne et distinct de « meurt », ce qui préserve le parallélisme poétique.
- source_word: אָדָם
  choice: l’être humain
  rationale: Le terme générique אדם répond à גבר tout en élargissant la formulation à l’humanité. « L’être humain » conserve cette nuance et la variation lexicale.
- source_word: וְאַיּוֹ
  choice: où est-il donc ?
  rationale: La question demande ce qu’est devenu l’être humain après sa mort. « Donc » rend naturellement en français la force contextuelle de la coordination sans transformer la question en affirmation.
theological_decisions:
- issue: Portée de la question « où est-il ? »
  choice: Conserver une interrogation ouverte
  alternative: La reformuler comme l’affirmation qu’il n’existe plus ou qu’il est introuvable
  rationale: Le verset formule une question rhétorique dans une méditation sur la mortalité ; il ne convient pas d’en imposer ici une résolution doctrinale.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme entre « l’homme » et « l’être humain » est conservé, ainsi que la progression « meurt / reste sans force / expire ». Les marqueurs de notes sont placés au point lexical ou interprétatif concerné.
