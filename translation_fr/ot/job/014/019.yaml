  - severity: low
    issue: « La terre meuble du pays » s’éloigne de l’image de « poussière de la terre/du sol ».
    rationale: Cette formulation est intelligible, mais introduit l’interprétation « terre meuble » et la nuance territoriale de « pays ». « Poussière du sol » maintient mieux l’image tout en restant naturel.
