revisions:
- from: L’eau use les pierres ; ses torrents[a] emportent la terre meuble du pays. Ainsi, tu fais disparaître l’espoir du mortel.
  to: L’eau use les pierres ; tu emportes les dépôts[a] de la poussière du sol ; ainsi, tu anéantis l’espoir du mortel.
  rationale: La révision rétablit l’adresse directe à Dieu dans la proposition médiane, en parallèle avec « tu anéantis » à la fin du verset. Elle remplace l’interprétation « ses torrents », qui transforme un terme lexicalement incertain en sujet grammatical, par « dépôts », rendu prudent accompagné d’une note qui préserve les principales possibilités. Elle rapproche aussi « poussière du sol » de l’hébreu sans sacrifier la lisibilité française.
