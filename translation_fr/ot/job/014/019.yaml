  verdict: revise
  source_fidelity: 'La première et la dernière propositions rendent bien l’image d’érosion et l’adresse à Dieu. En revanche, le texte massorétique porte probablement תִּשְׁטֹף comme un imparfait à la 2e personne masculine singulière, en parallèle avec הֶאֱבַדְתָּ : Dieu est donc le sujet de « tu emportes ». La traduction proposée fait de « ses torrents » un sujet pluriel, ce qui efface ce parallélisme et donne à la forme verbale une analyse moins probable. Le mot סְפִיחֶיהָ demeure rare et incertain; il convient de conserver l’incertitude en note sans faire de « torrents » le sujet principal du verset.'
  naturalness: « L’eau use les pierres » et « l’espoir du mortel » sont naturels, modernes et poétiques. « Tu emportes les dépôts de la poussière du sol » est un peu plus explicatif, mais reste idiomatique et permet de rendre la construction difficile sans créer un sujet français artificiel (« ses torrents »).
  terminology: « Mortel » rend sobrement אֱנוֹשׁ et son accent sur la fragilité. « Anéantis » traduit avec une force appropriée le hifil de אבד. « Poussière du sol » est plus proche de עֲפַר אָרֶץ que « terre meuble du pays », qui interprète davantage le syntagme.
  issues:
