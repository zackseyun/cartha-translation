  text: אֲבָנִ֤ים שָׁ֥חֲקוּ מַ֗יִם תִּשְׁטֹֽף סְפִיחֶ֥י/הָ עֲפַר אָ֑רֶץ וְ/תִקְוַ֖ת אֱנ֣וֹשׁ הֶאֱבַֽדְתָּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/019.yaml
  text: Water wears away stones[a]; its torrents wash away the soil of the earth; so you destroy the hope of man.
translation:
  language: fr
  text: L’eau use les pierres ; tu emportes les dépôts[a] de la poussière du sol ; ainsi, tu anéantis l’espoir du mortel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « dépôts » est rare et son sens est incertain. Il peut désigner des accumulations ou des écoulements; certains le comprennent aussi comme « ce qui pousse spontanément ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שָׁחֲקוּ מַיִם
  choice: L’eau use les pierres
  rationale: La construction poétique hébraïque est resserrée, mais elle décrit clairement l’action érosive de l’eau sur les pierres. Le singulier collectif « l’eau » est naturel en français.
- source_word: תִּשְׁטֹף
  choice: emportent
  rationale: Le verbe évoque ce qui est balayé ou entraîné par l’eau. « Emportent » convient au mouvement des torrents et à l’image de l’érosion.
- source_word: סְפִיחֶיהָ
  choice: ses torrents
  rationale: Ce terme rare et difficile semble désigner ici des écoulements ou déversements d’eau. « Ses torrents » rend l’image cohérente tout en signalant l’incertitude dans une note.
- source_word: עֲפַר אָרֶץ
  choice: la terre meuble du pays
  rationale: Littéralement « la poussière de la terre/du pays ». Dans ce contexte d’érosion, « terre meuble » désigne naturellement la couche de sol que l’eau peut emporter, tandis que « pays » conserve une valeur possible de אֶרֶץ.
- source_word: וְתִקְוַת אֱנוֹשׁ
  choice: l’espoir du mortel
  rationale: אֱנוֹשׁ désigne l’être humain sous l’angle de sa fragilité. « Le mortel » conserve le singulier représentatif, la concision et la tonalité poétique sans lecture exclusivement masculine.
- source_word: הֶאֱבַדְתָּ
  choice: tu fais disparaître
  rationale: Le hifil signifie faire périr ou détruire. « Tu fais disparaître » exprime directement l’anéantissement de l’espoir et maintient l’adresse à Dieu.
theological_decisions:
- issue: Adresse directe à Dieu dans la dernière proposition
  choice: Ainsi, tu fais disparaître l’espoir du mortel
  alternative: Et tu détruis l’espoir du mortel
  rationale: Le verbe à la deuxième personne du masculin singulier s’adresse clairement à Dieu. « Ainsi » explicite sobrement le rapport comparatif entre l’érosion décrite et l’anéantissement de l’espoir humain, sans atténuer l’accusation de Job.
- issue: Portée de אֱנוֹשׁ
  choice: le mortel
  alternative: l’être humain
  rationale: « Le mortel » garde l’accent hébreu sur la fragilité humaine et préserve la portée représentative du singulier sans imposer une distinction de sexe.
translation_notes:
  register: Français moderne, international et dignifié. Le rythme en trois propositions conserve la progression poétique de l’érosion naturelle vers l’espoir humain. Le tutoiement maintient l’adresse directe à Dieu habituelle dans le discours biblique français.
