id: JOB.14.5
reference: Job 14:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִ֥ם חֲרוּצִ֨ים יָמָ֗י/ו מִֽסְפַּר חֳדָשָׁ֥י/ו אִתָּ֑/ךְ חק/ו עָ֝שִׂ֗יתָ וְ/לֹ֣א יַעֲבֽוֹר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/005.yaml
  text: Since his days are determined[a], the number of his months is with you; you have set his limit[b], and he cannot pass it.
translation:
  language: fr
  text: Puisque ses jours sont fixés[a], le nombre de ses mois est auprès de toi ; tu as établi sa limite[b], qu’il ne peut franchir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Si ses jours sont fixés ». La particule hébraïque peut introduire une condition, mais, dans ce contexte, elle donne probablement le fondement de l’appel de Job : « Puisque ses jours sont fixés ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « sa frontière », ou encore « ce qui lui est prescrit ». Le terme hébreu peut désigner une borne fixe ou une prescription établie.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Puisque
  rationale: Dans le contexte, la particule introduit vraisemblablement le fondement de l’appel de Job plutôt qu’une simple hypothèse. « Puisque » restitue naturellement cette valeur, tout en signalant l’autre possibilité en note.
- source_word: חֲרוּצִים
  choice: sont fixés
  rationale: Le participe passif indique que les jours sont déterminés ou décidés. « Sont fixés » est clair, actuel et convient à l’idée d’une durée de vie délimitée.
- source_word: יָמָיו
  choice: ses jours
  rationale: Traduction directe du nom pluriel avec suffixe masculin singulier, les jours désignant ici la durée de la vie humaine.
- source_word: מִסְפַּר חֳדָשָׁיו
  choice: le nombre de ses mois
  rationale: Cette formulation conserve la construction nominale hébraïque sans la transformer en proposition verbale.
- source_word: אִתָּךְ
  choice: est auprès de toi
  rationale: La préposition signifie littéralement « avec toi ». « Auprès de toi » préserve cette image et laisse entendre, sans l’expliciter excessivement, que ce nombre relève de la connaissance et de l’autorité de Dieu.
- source_word: חֻקּוֹ
  choice: sa limite
  rationale: Le nom peut désigner une prescription, une frontière ou une limite fixée. « Limite » s’accorde naturellement avec le verbe « franchir ».
- source_word: עָשִׂיתָ
  choice: tu as établi
  rationale: Bien que le verbe signifie généralement « faire », associé à une limite ou prescription il exprime ici l’idée de l’établir.
- source_word: וְלֹא יַעֲבוֹר
  choice: qu’il ne peut franchir
  rationale: Le sujet du verbe est l’être humain évoqué, tandis que la limite en est l’objet implicite. La formulation exprime clairement l’impossibilité d’aller au-delà de la borne fixée.
theological_decisions:
- issue: Détermination divine de la durée de la vie humaine
  choice: Le verset présente les jours de l’être humain comme fixés, le nombre de ses mois comme étant auprès de Dieu, et sa limite comme établie par Dieu.
  alternative: On pourrait comprendre « auprès de toi » comme mettant surtout l’accent sur la connaissance divine de la durée de la vie, sans affirmer aussi directement sa détermination active.
  rationale: L’ensemble formé par « jours fixés », « auprès de toi » et « tu as établi sa limite » soutient une affirmation forte de l’autorité divine. La traduction conserve cette tension sans développer un système doctrinal au-delà du verset.
translation_notes:
  register: Français international moderne, naturel et digne. La structure poétique reste proche de l’hébreu, avec un point-virgule entre les deux membres. « Auprès de toi » préserve l’expression relationnelle du texte source, tandis que « qu’il ne peut franchir » rend explicitement l’objet implicite du dernier verbe.
