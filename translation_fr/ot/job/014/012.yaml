  text: וְ/אִ֥ישׁ שָׁכַ֗ב וְֽ/לֹא יָ֫ק֥וּם עַד בִּלְתִּ֣י שָׁ֭מַיִם לֹ֣א יָקִ֑יצוּ וְ/לֹֽא יֵ֝עֹ֗רוּ מִ/שְּׁנָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/012.yaml
  text: So a man lies down and does not rise[a]; until the heavens are no more[b], they will not awake or be roused from their sleep.
translation:
  language: fr
  text: Ainsi, l’homme se couche et ne se relève pas ; jusqu’à ce que les cieux ne soient plus[a], ils ne se réveilleront pas et ne seront pas tirés de leur sommeil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie aussi « jusqu’à ce que les cieux cessent d’exister ». Elle désigne de manière idiomatique une échéance pratiquement inaccessible.
    reason: lexical_alternative
  - marker: b
    text: 'Le verset emploie l’image du sommeil pour parler de la mort : les morts ne se réveillent pas et ne sont pas tirés de leur sommeil.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ
  choice: Ainsi, l’homme
  rationale: אִישׁ désigne ici l’homme au singulier dans un sens représentatif. L’article défini produit en français une formulation générique naturelle, tandis que « Ainsi » rend le וְ comme articulation de la comparaison et du raisonnement poétique.
- source_word: שָׁכַב
  choice: se couche
  rationale: Le verbe signifie « se coucher » et sert ici d’image euphémique de la mort. La traduction conserve cette image au lieu de l’expliciter par « meurt ».
- source_word: וְלֹא יָקוּם
  choice: et ne se relève pas
  rationale: קום évoque le fait de se relever. Le présent de portée générale convient à l’énoncé poétique et laisse intacte sa possible résonance avec le relèvement après la mort.
- source_word: עַד בִּלְתִּי שָׁמַיִם
  choice: jusqu’à ce que les cieux ne soient plus
  rationale: La construction signifie littéralement « jusqu’à [ce que] les cieux ne soient pas », c’est-à-dire jusqu’à leur disparition. Cette formulation française conserve l’horizon cosmique, pratiquement inaccessible, de l’hébreu.
- source_word: לֹא יָקִיצוּ
  choice: ils ne se réveilleront pas
  rationale: Le verbe יקיץ signifie « se réveiller ». Son pluriel marque le passage du singulier représentatif « l’homme » aux morts considérés collectivement ; le pronom « ils » conserve ce changement de nombre.
- source_word: וְלֹא יֵעֹרוּ
  choice: et ne seront pas tirés
  rationale: Le niphal de עור exprime le fait d’être éveillé ou tiré du sommeil. La tournure passive « être tirés » respecte cette nuance et forme un parallèle naturel avec « se réveiller ».
- source_word: מִשְּׁנָתָם
  choice: de leur sommeil
  rationale: Le nom signifie « sommeil » et prolonge ici l’image de la mort. Le possessif pluriel correspond aux verbes pluriels qui précèdent.
theological_decisions:
- issue: Faut-il expliciter l’image de la mort comme annihilation ou comme négation de la résurrection ?
  choice: Conserver les images du coucher, du relèvement et du réveil sans développement doctrinal
  alternative: Traduire explicitement par « meurt et ne revivra pas », ou introduire une référence explicite à la résurrection
  rationale: Le verset présente poétiquement la mort selon la perspective de Job. Son imagerie et sa tension doivent être préservées sans en faire une affirmation systématique sur l’annihilation ou la résurrection finale.
- issue: Rendu du masculin singulier אִישׁ
  choice: l’homme
  alternative: la personne ou l’être humain
  rationale: Le texte hébreu emploie un nom masculin singulier de valeur représentative. « L’homme » conserve cette forme tout en étant naturel dans ce contexte poétique.
translation_notes:
  register: Français international moderne, poétique et digne. Le changement abrupt du singulier « l’homme » au pluriel « ils » est maintenu parce qu’il correspond au passage de l’individu représentatif aux morts en général dans le texte hébreu.
