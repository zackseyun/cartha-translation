  text: For now you count my steps[b][a]; you do not keep watch over my sin.
translation:
  language: fr
  text: Car maintenant, tu comptes mes pas[a] ; ne surveilles-tu pas mon péché[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu dénombres mes pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne veilles-tu pas sur mon péché ? » ou « ne guettes-tu pas mon péché ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici une explication. « Car » conserve ce lien logique sans lui donner une emphase absente du texte.
- source_word: עַתָּה
  choice: maintenant
  rationale: L’adverbe marque la situation présente, en contraste avec l’avenir espéré par Job.
- source_word: צְעָדַי
  choice: mes pas
  rationale: Le nom désigne les pas ou les mouvements d’une personne. « Mes pas » restitue directement l’image et reste naturel en français.
- source_word: תִּסְפּוֹר
  choice: tu comptes
  rationale: Le verbe ספר signifie couramment « compter » ou « dénombrer ». « Tu comptes » est ici la formulation française la plus directe.
- source_word: לֹא
  choice: ne… pas
  rationale: La négation hébraïque est rendue par la négation française ordinaire.
- source_word: תִשְׁמוֹר עַל
  choice: tu ne surveilles pas
  rationale: שׁמר avec עַל peut exprimer l’idée de surveiller, de veiller sur ou de guetter. « Surveiller » maintient l’image d’une observation attentive et le parallèle avec le décompte des pas.
- source_word: חַטָּאתִי
  choice: mon péché
  rationale: Dans ce contexte, חַטָּאת désigne le péché. Le singulier hébreu est conservé, sans le transformer en pluriel ni en notion plus générale.
theological_decisions:
- issue: Sens de la proposition négative לֹא תִשְׁמוֹר עַל חַטָּאתִי dans son contexte
  choice: 'La rendre comme une affirmation au présent : « tu ne surveilles pas mon péché ».'
  alternative: « tu ne surveillerais pas mon péché » dans une construction hypothétique, ou « tu ne guettes pas mon péché » selon une autre nuance du verbe.
  rationale: La forme hébraïque est un imparfait directement nié et peut naturellement se lire comme une affirmation portant sur la situation présente. Le contexte plus large crée une tension avec les versets voisins ; la traduction la conserve au lieu de l’harmoniser.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure concise afin de conserver le parallélisme poétique. « Surveiller » est choisi plutôt que « veiller sur », qui pourrait suggérer en français une protection bienveillante.
