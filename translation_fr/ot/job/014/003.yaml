id: JOB.14.3
reference: Job 14:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַף עַל זֶ֭ה פָּקַ֣חְתָּ עֵינֶ֑/ךָ וְ/אֹ֘תִ֤/י תָבִ֖יא בְ/מִשְׁפָּ֣ט עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/003.yaml
  text: Yet on such a one you open your eyes[a], and you bring me into judgment with you.
translation:
  language: fr
  text: Et c’est sur un tel être que tu ouvres les yeux, et c’est moi que tu fais venir en jugement avec toi[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant toi » ; l’hébreu dit littéralement « avec toi », ce qui peut évoquer une comparution devant Dieu ou un procès engagé avec lui.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  choice: Et c’est… que
  rationale: La tournure clivée rend naturellement en français la valeur emphatique et protestataire de la particule dans ce contexte.
- source_word: עַל זֶה
  choice: sur un tel être
  rationale: Littéralement « sur celui-ci / sur cela » ; le contexte renvoie à l’être humain fragile décrit aux versets précédents. « Un tel être » explicite sobrement ce référent personnel.
- source_word: פָּקַחְתָּ עֵינֶךָ
  choice: tu ouvres les yeux
  rationale: La traduction conserve l’image hébraïque, qui évoque ici l’attention soutenue ou l’examen auquel Dieu soumet l’être humain.
- source_word: וְאֹתִי
  choice: et c’est moi que
  rationale: La construction clivée restitue l’accent porté par le pronom objet hébreu sur Job lui-même.
- source_word: תָבִיא
  choice: tu fais venir
  rationale: Le hiphil de בוא signifie littéralement « faire venir, amener ». Cette formulation préserve le noyau lexical sans préciser excessivement qu’il s’agit d’une convocation.
- source_word: בְמִשְׁפָּט
  choice: en jugement
  rationale: Cette expression française garde le sens judiciaire de מִשְׁפָּט sans transposer la scène dans un tribunal moderne.
- source_word: עִמָּךְ
  choice: avec toi
  rationale: Le choix conserve le sens ordinaire de la préposition עִם et la tension de l’image judiciaire, sans décider si Job comparaît devant Dieu ou se trouve engagé dans un procès avec lui.
theological_decisions:
- issue: La relation judiciaire exprimée par עִמָּךְ lorsque Job s’adresse à Dieu
  choice: avec toi
  alternative: devant toi ; contre toi
  rationale: 'L’hébreu dit normalement « avec toi ». Cette formulation préserve l’ambiguïté et la hardiesse de la plainte de Job : il peut être question de comparaître devant Dieu ou d’entrer avec lui dans une contestation judiciaire.'
translation_notes:
  register: Français moderne, digne et poétique. Les deux constructions clivées rendent l’emphase du vers hébreu et le ton de protestation. Le point d’exclamation, conforme à ce ton, reste une décision de ponctuation interprétative.
