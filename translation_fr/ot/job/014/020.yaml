  source_fidelity: 'Le texte rend fidèlement la progression de l’hébreu : Dieu prévaut durablement sur l’être humain, celui-ci « s’en va », puis Dieu change son visage et le renvoie. « Il s’en va » maintient à juste titre l’image verbale de הלך sans expliciter indûment la mort. « Tu changes son visage » conserve le concret de פָּנָיו, et « tu le renvoies » rend de façon suffisamment large le piel de שלח.'
