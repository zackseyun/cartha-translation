source:
  edition: WLC
  text: תִּתְקְפֵ֣/הוּ לָ֭/נֶצַח וַֽ/יַּהֲלֹ֑ךְ מְשַׁנֶּ֥ה פָ֝נָ֗י/ו וַֽ/תְּשַׁלְּחֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/020.yaml
  text: You overpower him forever[a], and he passes on[b]; you alter his face and send him away.
translation:
  language: fr
  text: Tu l’emportes sur lui pour toujours, et il s’en va[a] ; tu changes son visage[b] et tu le renvoies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il part ». Le verbe hébreu signifie littéralement « aller » ; dans ce contexte, il peut évoquer le départ de la vie ou de la scène humaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « son apparence ». Le mot hébreu traduit par « visage » peut désigner plus largement l’aspect extérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְקְפֵהוּ
  choice: tu l’emportes sur lui
  rationale: Le hiphil de תקף exprime ici le fait de devenir fort contre quelqu’un, de prévaloir sur lui. « L’emporter sur lui » rend naturellement la domination exercée par Dieu sans ajouter l’idée plus précise d’écrasement ou de destruction.
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: נֶצַח indique une durée permanente ou sans fin. Dans cette lamentation, « pour toujours » souligne le caractère irréversible de la victoire sur l’être humain mortel.
- source_word: וַיַּהֲלֹךְ
  choice: et il s’en va
  rationale: הלך signifie littéralement « aller ». « Il s’en va » conserve cette image et l’ambiguïté du texte, tout en pouvant évoquer dans le contexte le départ de la vie ou de la scène humaine.
- source_word: מְשַׁנֶּה
  choice: tu changes
  rationale: Le participe de שנה, « changer », fonctionne dans la continuité de l’adresse directe à Dieu. « Tu changes » est simple, actuel et laisse ouverte la nature exacte de cette transformation.
- source_word: פָנָיו
  choice: son visage
  rationale: פנים désigne littéralement le visage, mais peut aussi viser plus largement l’apparence extérieure. Le texte principal conserve l’image concrète, et la note signale le sens étendu possible.
- source_word: וַתְּשַׁלְּחֵהוּ
  choice: et tu le renvoies
  rationale: Le piel de שלח peut signifier envoyer au loin, congédier ou chasser. « Tu le renvoies » exprime le retrait imposé par Dieu sans préciser excessivement s’il s’agit d’un congédiement ou d’une expulsion.
theological_decisions:
- issue: La nature du départ de l’être humain
  choice: il s’en va
  alternative: il meurt / il disparaît
  rationale: Le contexte concerne la mortalité, mais le verbe hébreu signifie simplement « aller ». La traduction ne transforme donc pas en affirmation explicite de la mort ce que le texte laisse sous forme d’image.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le tutoiement maintient l’adresse directe à Dieu. La ponctuation conserve le parallélisme des deux propositions sans durcir les ambiguïtés du texte hébreu.
