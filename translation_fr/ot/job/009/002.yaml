    rationale: Cette expression française peut signifier principalement qu’une personne gagne une argumentation. Le qal צדק autorise certes une nuance judiciaire (« être dans son droit »), mais le rendu principal doit préserver plus explicitement « être juste », sans imposer ni réduire la portée du terme.
  - severity: low
    issue: La note présente « être juste » comme simple alternative alors que c’est le rendu lexical le plus direct.
    rationale: Après correction du texte principal, la note peut documenter « avoir raison » comme alternative judiciaire et préciser le littéral « avec Dieu ».
