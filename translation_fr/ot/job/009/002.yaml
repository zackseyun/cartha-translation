source:
  edition: WLC
  text: אָ֭מְנָם יָדַ֣עְתִּי כִי כֵ֑ן וּ/מַה יִּצְדַּ֖ק אֱנ֣וֹשׁ עִם אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/002.yaml
  text: Truly[a], I know that it is so[b]; but how can a man be righteous before God?
translation:
  language: fr
  text: Certes, je sais qu’il en est ainsi ; mais comment un être humain pourrait-il être juste devant Dieu[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comment un être humain pourrait-il avoir raison devant Dieu ? » Littéralement, « être juste avec Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: Oui, … bien
  rationale: Marque une concession emphatique et assurée dans un français naturel ; « oui » reprend l’affirmation précédente et « bien » renforce le savoir établi de Job.
- source_word: יָדַעְתִּי
  choice: je sais
  rationale: Le parfait exprime ici un état de connaissance acquis et ferme, rendu idiomatiquement au présent en français.
- source_word: כִי כֵן
  choice: qu’il en est ainsi
  rationale: Préserve la valeur confirmative de l’expression, qui reconnaît la vérité de ce qui précède.
- source_word: וּמַה
  choice: mais comment … pourrait-il
  rationale: La coordination introduit un contraste argumentatif après la concession ; le conditionnel français exprime naturellement la possibilité mise en question, sans nier explicitement celle-ci.
- source_word: יִצְדַּק
  choice: avoir raison
  rationale: Le qal de צדק peut signifier être juste ou être dans son droit. Dans le contexte de la contestation entre Job et Dieu, « avoir raison » conserve la nuance relationnelle et judiciaire sans importer une doctrine ultérieure de la justification.
- source_word: אֱנוֹשׁ
  choice: un être humain
  rationale: Rend le singulier représentatif désignant l’humanité fragile, avec une formulation inclusive et courante en français moderne.
- source_word: עִם אֵל
  choice: devant Dieu
  rationale: Bien que עִם signifie littéralement « avec », « devant Dieu » exprime naturellement la situation comparative ou judiciaire impliquée par le contexte.
theological_decisions:
- issue: Nuance judiciaire de la justice humaine par rapport à Dieu
  choice: comment un être humain pourrait-il avoir raison devant Dieu ?
  alternative: comment un être humain pourrait-il être juste devant Dieu ?
  rationale: « Avoir raison devant Dieu » convient au cadre de litige de Job et maintient ouverte la question de la position humaine face à Dieu. La variante en note conserve la lecture morale plus directement associée à « juste », sans introduire un mécanisme doctrinal de justification.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La concession initiale demeure solennelle sans archaïsme ; le vocabulaire judiciaire reste accessible. Le point-virgule reproduit le passage de l’acquiescement à la question centrale.
