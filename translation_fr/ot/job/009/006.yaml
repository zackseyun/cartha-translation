source:
  edition: WLC
  text: הַ/מַּרְגִּ֣יז אֶ֭רֶץ מִ/מְּקוֹמָ֑/הּ וְ֝/עַמּוּדֶ֗י/הָ יִתְפַלָּצֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/006.yaml
  text: who shakes the earth from its place[a], and its pillars tremble.
translation:
  language: fr
  text: 'lui qui ébranle la terre hors de sa place,

    et ses piliers tremblent[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frémissent » ou « sont saisis de tremblement ».
    reason: Alternative lexicale pour יִתְפַלָּצוּן, qui peut évoquer un tremblement intense.
lexical_decisions:
- source_word: הַמַּרְגִּיז
  choice: lui qui ébranle
  rationale: Le participe hiphil de רגז exprime ici une action causative. « Ébranle » rend naturellement l’idée de secouer fortement et convient à l’image cosmique.
- source_word: אֶרֶץ
  choice: la terre
  rationale: Le contexte cosmique — déplacement de la terre et tremblement de ses piliers — favorise « la terre » plutôt que le sens local « le pays ».
- source_word: מִמְּקוֹמָהּ
  choice: hors de sa place
  rationale: Cette formulation restitue directement la préposition et le suffixe féminin, tout en soulignant l’image d’un déplacement de la terre.
- source_word: וְעַמּוּדֶיהָ
  choice: et ses piliers
  rationale: « Piliers » conserve l’image cosmologique poétique du texte hébreu sans l’interpréter ni la moderniser en « fondations ».
- source_word: יִתְפַלָּצוּן
  choice: tremblent
  rationale: Le verbe désigne un tremblement violent. « Tremblent » est clair, naturel et maintient le parallélisme avec « ébranle » sans attribuer explicitement une émotion aux piliers.
theological_decisions:
- issue: L’image cosmologique des piliers de la terre
  choice: Conserver littéralement l’image « ses piliers »
  alternative: Rendre l’expression par « ses fondations » afin de l’adapter à une représentation moderne du monde
  rationale: Le verset emploie un langage cosmologique poétique ancien. La traduction préserve cette image littéraire sans la transformer en affirmation scientifique ni la faire correspondre à une cosmologie moderne.
translation_notes:
  register: Français international moderne, poétique et digne. L’inversion participiale « lui qui » s’inscrit dans la continuité de la description de Dieu, tandis que le vocabulaire reste accessible. Le marqueur de note est placé après le mot auquel l’alternative se rapporte.
