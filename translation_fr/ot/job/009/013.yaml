  variant: modern international French
source:
  edition: WLC
  text: אֱ֭לוֹהַּ לֹא יָשִׁ֣יב אַפּ֑/וֹ תחת/ו שָׁ֝חֲח֗וּ עֹ֣זְרֵי רָֽהַב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/013.yaml
  text: God does not turn back his anger; beneath him the helpers of Rahab crouch.
translation:
  language: fr
  text: Dieu ne détourne pas sa colère ; sous lui se sont courbés ceux qui viennent en aide à Rahab[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, Rahab paraît être une puissance chaotique personnifiée, souvent représentée comme un monstre marin. Le même nom peut avoir d’autres emplois symboliques ailleurs dans la Bible.
    reason: Le nom propre serait obscur pour beaucoup de lecteurs, mais son identification exacte ne doit pas être imposée dans le corps du texte.
lexical_decisions:
- source_word: יָשִׁיב אַפּוֹ
  choice: ne détourne pas sa colère
  rationale: Rend l’idée de faire revenir ou se retirer la colère, dans un français naturel, sans préciser au-delà du texte la cause ou la durée de cette colère.
- source_word: שָׁחֲחוּ
  choice: se sont courbés
  rationale: Le verbe exprime l’abaissement ou la courbure sous la domination de Dieu. Le passé composé respecte la forme accomplie de l’hébreu sans imposer l’image plus spécifique de l’accroupissement.
- source_word: עֹזְרֵי רָהַב
  choice: ceux qui viennent en aide à Rahab
  rationale: Conserve le rapport explicite d’aide exprimé par עֹזְרֵי et maintient Rahab comme nom propre énigmatique plutôt que d’en résoudre silencieusement l’identité.
theological_decisions:
- issue: Identité de Rahab
  choice: Conserver « Rahab » comme nom propre avec une note explicative prudente
  alternative: Traduire directement par « le monstre marin », « le chaos » ou « l’orgueil »
  rationale: Dans ce contexte, Rahab semble désigner une puissance chaotique personnifiée, mais le texte hébreu conserve le nom et ne l’explicite pas. La traduction préserve donc cette tension.
translation_notes:
  register: Français moderne, sobre et digne. La construction « sous lui » conserve l’image spatiale et hiérarchique de l’hébreu, tandis que « ceux qui viennent en aide à » reste plus accessible que « les auxiliaires de ».
