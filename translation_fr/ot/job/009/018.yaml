  text: לֹֽא יִ֭תְּנֵ/נִי הָשֵׁ֣ב רוּחִ֑/י כִּ֥י יַ֝שְׂבִּעַ֗/נִי מַמְּרֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/018.yaml
  text: He does not let me catch my breath[b][a], for he fills me with bitterness.
translation:
  language: fr
  text: Il ne me laisse pas reprendre mon souffle[a], car il me rassasie d’amertumes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retrouver mon souffle »; littéralement, « faire revenir mon souffle » — le mot peut aussi signifier « esprit ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de choses amères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּנֵנִי
  choice: il ne me laisse pas
  rationale: Avec l’infinitif qui suit, נתן a ici le sens idiomatique de « permettre, laisser », plutôt que le sens littéral de « donner ».
- source_word: הָשֵׁב רוּחִי
  choice: reprendre mon souffle
  rationale: L’expression associe le causatif de שוב (« faire revenir, rétablir ») à רוּחַ (« souffle, esprit, vent »). Dans ce contexte d’affliction incessante, « reprendre mon souffle » rend naturellement l’idée d’obtenir un répit tout en conservant l’image du souffle.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de l’affirmation précédente; « car » convient au lien causal et au registre poétique.
- source_word: יַשְׂבִּיעַנִי
  choice: me rassasie
  rationale: Le hifil de שבע signifie « rassasier, remplir ». « Rassasie » conserve l’image forte d’une satiété imposée, rendue négative par ce qui suit.
- source_word: מַמְּרֹרִים
  choice: d’amertumes
  rationale: Le pluriel peut désigner des choses ou des expériences amères. Le pluriel français « amertumes » préserve mieux que le singulier la forme et l’accumulation suggérées par l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. « Reprendre mon souffle » est idiomatique; « rassasie d’amertumes » conserve volontairement la vigueur et la tension de l’image hébraïque.
