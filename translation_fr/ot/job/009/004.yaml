  text: חֲכַ֣ם לֵ֭בָב וְ/אַמִּ֣יץ כֹּ֑חַ מִֽי הִקְשָׁ֥ה אֵ֝לָ֗י/ו וַ/יִּשְׁלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/004.yaml
  text: He is wise in heart and mighty in strength[a]; who has hardened himself against him and prospered?
translation:
  language: fr
  text: Il est sage de cœur et puissant en force ; qui s’est endurci contre lui et en est sorti indemne[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et a prospéré ». Le verbe hébreu peut désigner le fait de rester entier, sain et sauf, ou de réussir.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵבָב
  choice: Sage de cœur
  rationale: Conserve l’image hébraïque du cœur comme siège de l’intelligence et de la volonté, dans une formulation poétique et intelligible en français.
- source_word: וְאַמִּיץ כֹּחַ
  choice: et puissant en force
  rationale: Reproduit la tournure emphatique, légèrement redondante, de l’hébreu sans la réduire au simple adjectif « puissant ».
- source_word: מִי
  choice: qui
  rationale: Introduit directement la question rhétorique, conformément à l’hébreu et à l’usage naturel du français.
- source_word: הִקְשָׁה
  choice: s’est endurci
  rationale: Rend la valeur causative à sens réfléchi du hifil et l’idée d’une opposition obstinée.
- source_word: אֵלָיו
  choice: contre lui
  rationale: Dans cette construction, la préposition marque l’hostilité ou l’opposition plutôt qu’une simple direction.
- source_word: וַיִּשְׁלָם
  choice: et en est sorti indemne
  rationale: Exprime ici l’idée de demeurer entier, sain et sauf, après s’être opposé à Dieu; cette formulation convient à la portée rhétorique du verset.
theological_decisions:
- issue: Sujet implicite des prédicats initiaux
  choice: Ne pas ajouter « Il est » et employer la proposition adjectivale « Sage de cœur et puissant en force »
  alternative: « Il est sage de cœur et puissant en force »
  rationale: L’hébreu ne formule aucun pronom sujet. Le contexte désigne Dieu, mais le français peut préserver cette ellipse poétique sans obscurcir le référent.
- issue: Résultat de l’opposition à Dieu
  choice: « en est sorti indemne »
  alternative: « a prospéré »
  rationale: Le verbe שלם peut évoquer le fait de rester entier, sain et sauf, ou de réussir. Le contexte met surtout en relief l’impossibilité de s’opposer à Dieu sans dommage; la note conserve l’autre nuance possible.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation conserve le parallélisme, l’image du cœur et la force de la question rhétorique.
