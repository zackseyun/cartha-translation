  source_fidelity: 'Le texte rend fidèlement les deux participes hébreux : « déploie » correspond bien à נֹטֶה, « les cieux » à שָׁמַיִם, et « seul » conserve l’exclusivité de לְבַדּוֹ. « Marche sur les hauteurs de la mer » préserve l’image poétique et quelque peu insolite de וְדוֹרֵךְ עַל־בָּמֳתֵי־יָם sans la réduire dans le texte courant à une explication.'
