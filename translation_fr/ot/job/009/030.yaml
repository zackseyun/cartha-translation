  yaml_path: translation/ot/job/009/030.yaml
  text: If I washed myself with snow and cleansed my hands with lye,[a]
translation:
  language: fr
  text: 'Si je me lavais avec de la neige

    et me nettoyais les mains avec un produit alcalin,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec de la lessive de soude » ; le terme hébreu désigne un agent nettoyant alcalin, plutôt que du savon moderne au sens strict.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Même si
  rationale: 'Dans le développement de Job, la condition est concessive et hypothétique : même le nettoyage le plus poussé resterait sans effet selon le verset suivant.'
- source_word: הִתְרָחַצְתִּי
  choice: je me lavais
  rationale: Le hitpael de רחץ a ici un sens réfléchi, rendu naturellement en français par « me laver ».
- source_word: במו שָׁלֶג
  choice: avec de la neige
  rationale: La préposition marque le moyen employé. « Neige » est conservé sans expliciter « eau de neige », qui n’est pas formulé dans l’hébreu.
- source_word: וַהֲזִכּוֹתִי
  choice: et me nettoyais
  rationale: Le hiphil de זכה exprime l’action de rendre propre ou pur. « Nettoyer » convient au parallélisme concret tout en laissant subsister sa portée morale.
- source_word: בְּבֹר
  choice: avec de la lessive
  rationale: בֹּר désigne ici un produit alcalin servant au nettoyage. « Lessive » évoque en français une substance nettoyante traditionnelle, sans suggérer nécessairement le savon moderne.
- source_word: כַּפָּי
  choice: les mains
  rationale: Le terme désigne littéralement les paumes, mais « les mains » est l’expression française naturelle dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. La tournure « Même si » met en évidence la valeur concessive de l’hypothèse dans son contexte, tandis que le parallélisme poétique est conservé sur deux lignes.
