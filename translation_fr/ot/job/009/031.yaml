  text: then you would plunge me into the pit[b][a], and my own clothes would abhor me.
translation:
  language: fr
  text: alors tu me plongerais dans la fosse[a], et mes propres vêtements m’auraient en horreur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le fossé ». Le mot hébreu peut désigner une fosse, un fossé ou, dans certains contextes, la destruction.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mes habits me détesteraient ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: alors
  rationale: Adverbe temporel et consécutif qui poursuit l’hypothèse du verset précédent.
- source_word: בַּשַּׁחַת
  choice: dans la fosse
  rationale: שַׁחַת peut désigner une fosse, un fossé ou, selon le contexte, la destruction. « Fosse » conserve ici l’image concrète sans préciser excessivement le sens.
- source_word: תִּטְבְּלֵנִי
  choice: tu me plongerais
  rationale: Le verbe טבל signifie « tremper, immerger ». « Plonger » rend naturellement la force de l’image et maintient Dieu comme agent explicitement interpellé.
- source_word: וְתִעֲבוּנִי
  choice: m’auraient en horreur
  rationale: Le verbe תעב exprime une vive répulsion. La tournure française reste forte et convient à la personnification des vêtements.
- source_word: שַׂלְמוֹתָי
  choice: mes propres vêtements
  rationale: 'Le terme désigne les habits ou vêtements. « Propres » souligne l’ironie : même ce qui appartient à Job reculerait devant lui, sans introduire l’idée de vêtements propres au sens de lavés.'
theological_decisions:
- issue: Agent des verbes à la deuxième personne
  choice: 'Le verset s’adresse directement à Dieu : « tu me plongerais ».'
  alternative: Lecture impersonnelle ou circonstancielle selon laquelle Job finirait simplement dans la fosse.
  rationale: La deuxième personne masculine singulière poursuit l’adresse directe à Dieu dans le contexte. La traduction conserve ainsi la tension de la plainte de Job sans atténuer l’action divine.
translation_notes:
  register: Français international moderne, naturel et digne. Le conditionnel maintient l’enchaînement hypothétique avec le verset précédent. La personnification saisissante des vêtements est conservée.
