  text: חָ֭לְפוּ עִם אֳנִיּ֣וֹת אֵבֶ֑ה כְּ֝/נֶ֗שֶׁר יָט֥וּשׂ עֲלֵי אֹֽכֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/026.yaml
  text: They pass by like reed boats, like an eagle swooping on prey.
translation:
  language: fr
  text: Ils filent comme des barques de roseaux[a], comme un aigle qui fond sur sa nourriture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens du mot hébreu traduit par « roseaux » est incertain ; il pourrait désigner le papyrus ou un autre matériau léger.
    reason: Le nom אֵבֶה est rare et son identification lexicale n’est pas assurée.
lexical_decisions:
- source_word: חָלְפוּ
  choice: Ils filent
  rationale: Le verbe exprime ici un passage rapide, dans le prolongement de la comparaison des jours de Job avec un coureur au verset précédent.
- source_word: אֳנִיּוֹת אֵבֶה
  choice: des barques de roseaux
  rationale: « Barques » convient à de légères embarcations; אֵבֶה est rare et probablement lié au roseau ou au papyrus, mais son sens exact demeure incertain.
- source_word: נֶשֶׁר
  choice: l’aigle
  rationale: Équivalent français traditionnel et naturel pour ce grand rapace, sans chercher à préciser une espèce que le contexte ne détermine pas.
- source_word: יָטוּשׂ עֲלֵי אֹכֶל
  choice: qui fond sur sa proie
  rationale: Rend idiomatiquement le mouvement brusque du rapace vers sa nourriture; « proie » explicite naturellement ce que désigne אֹכֶל dans cette image.
theological_decisions:
- issue: Référent implicite du pluriel חָלְפוּ
  choice: Conserver « Ils », renvoyant aux jours de Job dans le contexte immédiat
  alternative: Répéter « Mes jours »
  rationale: Le pronom maintient la continuité syntaxique et poétique avec le verset précédent sans ajouter au texte hébreu.
translation_notes:
  register: Français moderne, sobre et poétique. « Ils filent » restitue la rapidité des deux images; « fond sur sa proie » est une tournure française courante et vigoureuse.
