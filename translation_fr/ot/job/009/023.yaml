source:
  edition: WLC
  text: אִם שׁ֭וֹט יָמִ֣ית פִּתְאֹ֑ם לְ/מַסַּ֖ת נְקִיִּ֣ם יִלְעָֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/023.yaml
  text: If a scourge kills suddenly[a], he mocks the calamity of the innocent.
translation:
  language: fr
  text: Si un fléau tue soudain, il se moque de l’épreuve des innocents[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’effondrement des innocents » ou « du désespoir des innocents ». Le nom hébreu rare peut évoquer une mise à l’épreuve, mais aussi le fait de fondre, de s’effondrer ou de perdre courage.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Rend directement la particule conditionnelle sans transformer l’hypothèse en affirmation temporelle.
- source_word: שׁוֹט
  choice: un fléau
  rationale: Le nom désigne concrètement un fouet, mais peut évoquer par extension une calamité destructrice. « Fléau » conserve cette portée figurée dans un français naturel.
- source_word: יָמִית
  choice: tue
  rationale: Le hiphil de מות signifie « faire mourir, tuer » ; « tue » est direct et actuel.
- source_word: פִּתְאֹם
  choice: soudain
  rationale: Restitue avec concision le sens adverbial de brusquerie.
- source_word: לְמַסַּת
  choice: de l’épreuve
  rationale: Le nom rare peut être rattaché à l’idée de mise à l’épreuve, mais aussi à celle de fonte, d’effondrement ou de désespoir. « Épreuve » convient au contexte tout en laissant les autres possibilités en note.
- source_word: נְקִיִּם
  choice: des innocents
  rationale: Désigne ceux qui sont exempts de faute ; « les innocents » est idiomatique et correspond à l’argument de Job sur la souffrance imméritée.
- source_word: יִלְעָג
  choice: il se moque
  rationale: Le verbe exprime la moquerie ou la dérision. Cette formulation garde la force de l’accusation.
theological_decisions:
- issue: Sujet de « il se moque »
  choice: Conserver le pronom « il », dont le référent contextuel est Dieu sans le nommer explicitement ici.
  alternative: Personnifier le fléau comme sujet, ou employer une tournure impersonnelle.
  rationale: Le contexte de Job 9 oriente vers Dieu comme sujet de l’accusation de Job, mais l’hébreu ne répète pas son nom. Le pronom préserve à la fois le lien contextuel et la tension du propos.
translation_notes:
  register: Français international moderne, sobre et digne. « Fléau » conserve l’image d’un coup destructeur sans imposer le sens strict de « fouet ». La phrase reste accusatrice et ne cherche pas à atténuer la tension théologique exprimée par Job.
