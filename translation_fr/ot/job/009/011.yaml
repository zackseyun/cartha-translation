source:
  edition: WLC
  text: הֵ֤ן יַעֲבֹ֣ר עָ֭לַ/י וְ/לֹ֣א אֶרְאֶ֑ה וְ֝/יַחֲלֹ֗ף וְֽ/לֹא אָבִ֥ין לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/011.yaml
  text: Look[a], he passes by me, and I do not see him; he moves on[c][b], and I do not perceive him.
translation:
  language: fr
  text: Voici[a], il passe près de moi[b], et je ne le vois pas ; il passe, et je ne le discerne pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Oui » ; le mot hébreu introduit une constatation appuyée.
    reason: lexical_alternative
  - marker: b
    text: Ou « il passe au-dessus de moi » ou « il passe devant moi ».
    reason: lexical_alternative
  - marker: c
    text: Ou « je ne le comprends pas » ; le verbe hébreu peut désigner aussi bien le discernement que la compréhension.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: Cette particule introduit avec vivacité une constatation emphatique. « Voici » conserve cette force déictique dans un registre français digne et encore naturel.
- source_word: יַעֲבֹר עָלַי
  choice: il passe près de moi
  rationale: Le verbe עבר associé à על décrit ici un mouvement par rapport à Job. « Près de moi » exprime une présence proche mais imperceptible, sans imposer l’image physique d’un passage au-dessus de lui.
- source_word: וְלֹא אֶרְאֶה
  choice: et je ne le vois pas
  rationale: Rend directement la négation et le verbe ראה, sans ajouter l’idée explicite d’incapacité que comporterait « je ne peux pas le voir ».
- source_word: וְיַחֲלֹף
  choice: il s’éloigne
  rationale: חלף peut évoquer le fait de passer puis de poursuivre son mouvement. « Il s’éloigne » distingue ce second verbe du premier tout en conservant le parallélisme d’un passage qui échappe à Job.
- source_word: וְלֹא אָבִין לוֹ
  choice: et je ne le discerne pas
  rationale: Le verbe בין couvre la perception, le discernement et la compréhension. « Discerner » convient au contexte d’une présence qui échappe aux sens tout en préservant une possible nuance de compréhension.
theological_decisions:
- issue: Référence du sujet à la troisième personne et des pronoms
  choice: Le sujet et les pronoms renvoient à Dieu.
  alternative: Un sujet indéfini, « quelqu’un », passe près de Job.
  rationale: Le contexte immédiat, en Job 9.10-12, décrit l’action insondable de Dieu. Les pronoms personnels préservent cette référence sans ajouter le nom divin, absent de ce verset.
- issue: Portée de אָבִין
  choice: Le verbe exprime ici le discernement de la présence divine.
  alternative: Le comprendre intellectuellement.
  rationale: Le parallélisme avec « je ne le vois pas » favorise la perception ou le discernement, mais la note conserve l’autre nuance réelle du verbe בין.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme hébreu est maintenu, tandis que « il s’éloigne » évite une répétition pesante et rend le mouvement continu. Les notes signalent les ambiguïtés spatiale et cognitive sans les résoudre artificiellement.
