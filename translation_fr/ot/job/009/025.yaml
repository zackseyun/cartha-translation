  yaml_path: translation/ot/job/009/025.yaml
  text: My days are swifter than a runner[a]; they flee away; they do not see good.
translation:
  language: fr
  text: Mes jours sont plus rapides qu’un coureur ; ils fuient, ils ne voient pas le bien[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bonheur », « la prospérité » ou « le bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Mes jours
  rationale: Le possessif pluriel conserve l’image hébraïque naturelle des jours qui composent la vie de Job.
- source_word: קַלּוּ מִנִּי רָץ
  choice: sont plus rapides qu’un coureur
  rationale: קַלּוּ exprime ici la rapidité, et מִנִּי introduit la comparaison avec רָץ, « un coureur ».
- source_word: בָּרְחוּ
  choice: ils s’enfuient
  rationale: Le verbe signifie fuir ou s’échapper et personnifie vivement les jours de Job.
- source_word: לֹא רָאוּ
  choice: sans avoir vu
  rationale: La tournure française relie naturellement la négation au passage rapide des jours tout en conservant l’idée qu’ils n’ont pas fait l’expérience du bien.
- source_word: טוֹבָה
  choice: le bonheur
  rationale: Dans ce contexte existentiel, « le bonheur » exprime naturellement le bien dont Job dit que ses jours n’ont pas joui, tout en laissant ouverte la nuance de prospérité ou de bien-être.
