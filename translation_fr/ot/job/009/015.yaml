  text: אֲשֶׁ֣ר אִם צָ֭דַקְתִּי לֹ֣א אֶעֱנֶ֑ה לִ֝/מְשֹׁפְטִ֗/י אֶתְחַנָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/015.yaml
  text: Even if I were in the right, I would not answer; I would plead for mercy from my judge.
translation:
  language: fr
  text: Même si j’avais raison, je ne répondrais pas ; je demanderais grâce à mon juge.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדַקְתִּי
  choice: j’avais raison
  rationale: Dans ce contexte judiciaire, le verbe exprime le fait d’être dans son droit ou reconnu juste ; « avoir raison » est naturel en français et conserve la portée juridique du passage.
- source_word: לֹא אֶעֱנֶה
  choice: je ne répondrais pas
  rationale: Le verbe ענה signifie ici répondre dans le cadre d’une contestation judiciaire. Le conditionnel français correspond à la proposition hypothétique introduite par « même si ».
- source_word: לִמְשֹׁפְטִי
  choice: à mon juge
  rationale: Le participe substantivé désigne celui qui juge Job. « Mon juge » préserve le caractère personnel et judiciaire sans préciser explicitement qu’il s’agit de Dieu.
- source_word: אֶתְחַנָּן
  choice: je demanderais grâce
  rationale: La forme intensive-réfléchie exprime une supplication en vue d’obtenir faveur ou compassion. « Demander grâce » rend avec concision le langage d’un suppliant devant son juge.
theological_decisions:
- issue: La justice revendiquée par Job face à son juge
  choice: Même si j’avais raison
  alternative: Même si j’étais juste
  rationale: « J’avais raison » maintient l’hypothèse judiciaire immédiate sans transformer la phrase en affirmation générale de perfection morale.
- issue: Identification du juge
  choice: mon juge
  alternative: celui qui me juge
  rationale: Le texte désigne littéralement « mon juge » sans développer son identité dans ce verset ; la traduction conserve cette sobriété et la tension du discours de Job.
translation_notes:
  register: Français moderne, digne et direct. La structure hypothétique et le parallélisme judiciaire sont conservés ; le point-virgule marque le passage de l’impossibilité de répondre à la supplication.
