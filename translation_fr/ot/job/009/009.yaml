  register: Français international moderne, poétique et digne. « Lui qui » assure la continuité syntaxique avec le contexte antérieur; les noms astronomiques usuels facilitent la compréhension, tandis que « chambres du sud » préserve l’image et l’ambiguïté du texte hébreu.
