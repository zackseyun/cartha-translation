source:
  edition: WLC
  text: יָגֹ֥רְתִּי כָל עַצְּבֹתָ֑/י יָ֝דַ֗עְתִּי כִּי לֹ֥א תְנַקֵּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/028.yaml
  text: I am afraid of all my pains[b][a]; I know that you will not acquit me.
translation:
  language: fr
  text: Je redoute toutes mes souffrances[a] ; je sais que tu ne m’acquitteras pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes mes douleurs », « toutes mes peines » ou « tous mes malheurs ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu ne me tiendras pas pour innocent » ou « tu ne me laisseras pas impuni ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: Je redoute
  rationale: Le qal accompli à valeur stative exprime ici une crainte présente. « Je redoute » rend naturellement l’idée d’une peur intense orientée vers les souffrances de Job.
- source_word: כָל
  choice: toutes
  rationale: Le quantificateur est conservé directement et s’accorde avec le nom féminin pluriel.
- source_word: עַצְּבֹתָי
  choice: mes souffrances
  rationale: Le terme peut désigner douleurs, peines ou afflictions. « Souffrances » convient au contexte physique et moral de Job sans restreindre le sens à un seul domaine.
- source_word: יָדַעְתִּי
  choice: je sais
  rationale: L’accompli de ידע a ici une valeur stative présente, rendue naturellement en français par « je sais ».
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce que Job sait.
- source_word: לֹא
  choice: ne… pas
  rationale: Négation française standard encadrant le verbe conjugué.
- source_word: תְנַקֵּנִי
  choice: tu ne m’acquitteras pas
  rationale: Le piel de נקה peut signifier déclarer innocent, acquitter ou laisser impuni. « Acquitter » maintient la nuance judiciaire du débat de Job avec Dieu.
theological_decisions:
- issue: Nuance judiciaire de נקה lorsque Job s’adresse à Dieu
  choice: tu ne m’acquitteras pas
  alternative: tu ne me tiendras pas pour innocent ; tu ne me laisseras pas impuni
  rationale: La formulation conserve la tension du procès métaphorique entre Job et Dieu, sans décider si l’accent porte sur la déclaration d’innocence ou sur l’absence de punition.
translation_notes:
  register: Français international moderne, sobre et digne. « Redouter » préserve l’intensité de la crainte ; « souffrances » garde l’étendue physique et morale du terme hébreu ; « acquitter » maintient l’imagerie judiciaire du contexte.
