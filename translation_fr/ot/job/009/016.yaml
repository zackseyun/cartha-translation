  variant: modern international French
source:
  edition: WLC
  text: אִם קָרָ֥אתִי וַֽ/יַּעֲנֵ֑/נִי לֹֽא אַ֝אֲמִ֗ין כִּֽי יַאֲזִ֥ין קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/016.yaml
  text: If I called and he answered me[a], I would not believe that he was listening to my voice.
translation:
  language: fr
  text: Si je l’appelais et qu’il me répondait, je ne croirais pas qu’il prête l’oreille à ma voix.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si je criais vers lui et qu’il me répondait, je ne croirais pas qu’il prête l’oreille à ma voix. »'
    reason: « Crier vers » est une autre possibilité lexicale pour קרא, plus expressive que « appeler ». « Prêter l’oreille » rend l’idée d’une écoute attentive de יאזין.
lexical_decisions:
- source_word: אִם
  choice: Même si
  rationale: Dans ce contexte hypothétique à portée concessive, « même si » exprime naturellement que Job envisage le cas sans le tenir pour convaincant.
- source_word: קָרָאתִי
  choice: je l’appelais
  rationale: קרא signifie couramment « appeler » ou « crier ». « Appeler » reste large et n’ajoute pas une intensité émotionnelle non imposée par l’hébreu.
- source_word: וַיַּעֲנֵנִי
  choice: et qu’il me répondait
  rationale: ענה signifie ici « répondre ». L’imparfait français s’intègre naturellement à l’hypothèse introduite par « même si ».
- source_word: לֹא אַאֲמִין
  choice: je ne croirais pas
  rationale: Le conditionnel français restitue la valeur hypothétique de l’imparfait hébreu dans cette construction.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce que Job ne croirait pas, plutôt qu’une cause.
- source_word: יַאֲזִין
  choice: il prête l’oreille
  rationale: אזן désigne une écoute attentive. « Prêter l’oreille » conserve cette nuance mieux que le simple « entendre ».
- source_word: קוֹלִי
  choice: à ma voix
  rationale: Traduction directe de קוֹלִי, sans expliciter la voix comme « prière » ou « supplication ».
theological_decisions:
- issue: Portée de la déclaration de Job sur la réponse divine
  choice: 'Présenter l’incrédulité subjective de Job : même en cas de réponse, il ne croirait pas que Dieu écoute attentivement.'
  alternative: Formuler soit une négation générale de l’écoute divine, soit un simple étonnement de Job.
  rationale: L’hébreu exprime l’incapacité de Job à croire, dans une situation hypothétique, que Dieu lui prête réellement attention. La formulation préserve cette tension sans en faire une affirmation doctrinale absolue.
translation_notes:
  register: Français international moderne, naturel et digne. « Même si » rend clairement la nuance concessive de l’hypothèse; « prêter l’oreille » conserve l’idée d’une écoute attentive sans archaïsme excessif.
