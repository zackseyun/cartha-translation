id: JOB.9.33
reference: Job 9:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹ֣א יֵשׁ בֵּינֵ֣י/נוּ מוֹכִ֑יחַ יָשֵׁ֖ת יָד֣/וֹ עַל שְׁנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/033.yaml
  text: There is no arbiter between us[a], who might lay his hand on us both.
translation:
  language: fr
  text: Il n’y a entre nous aucun arbitre[a] qui puisse poser sa main sur nous deux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « médiateur ». Le terme hébreu peut désigner une personne qui tranche un différend ou intervient entre deux parties en conflit.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יֵשׁ
  choice: Il n’y a… aucun
  rationale: Cette tournure française rend naturellement la construction existentielle négative hébraïque.
- source_word: בֵּינֵינוּ
  choice: entre nous
  rationale: Le syntagme situe l’arbitre entre les deux parties au litige, ici Job et Dieu.
- source_word: מוֹכִיחַ
  choice: arbitre
  rationale: Dans ce contexte judiciaire, le participe désigne une personne qui intervient entre deux parties et tranche leur différend. « Arbitre » préserve ce sens sans imposer une lecture théologique ultérieure.
- source_word: יָשֵׁת
  choice: qui puisse poser
  rationale: Cette formulation exprime l’action envisagée mais rendue impossible par l’absence d’un arbitre, tout en restant naturelle en français.
- source_word: יָדוֹ
  choice: sa main
  rationale: Le choix conserve l’image concrète de l’hébreu, qui peut suggérer l’autorité exercée sur les deux parties.
- source_word: עַל שְׁנֵינוּ
  choice: sur nous deux
  rationale: La formulation indique clairement que le geste concerne pareillement les deux parties.
theological_decisions:
- issue: Faut-il rendre מוֹכִיחַ par un terme pouvant évoquer explicitement une médiation théologique ?
  choice: arbitre
  alternative: médiateur
  rationale: Le contexte immédiat est celui d’un différend judiciaire entre Job et Dieu. « Arbitre » maintient cette dimension sans transformer l’énoncé en affirmation christologique explicite; « médiateur » reste toutefois une possibilité lexicale signalée en note.
translation_notes:
  register: Français moderne, international et digne. La phrase demeure concise et conserve l’image juridique ainsi que celle de la main posée sur les deux parties.
