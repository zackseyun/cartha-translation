  text: אָנֹכִ֥י אֶרְשָׁ֑ע לָ/מָּה זֶּ֝֗ה הֶ֣בֶל אִיגָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/029.yaml
  text: I will be condemned[a]; why then should I labor in vain?
translation:
  language: fr
  text: Quant à moi, je serai déclaré coupable[a] ; pourquoi donc peiner en vain ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je serai méchant ». Le verbe hébreu peut avoir un sens moral (« être méchant ») ou judiciaire (« être déclaré coupable »).'
    reason: alternative_reading
lexical_decisions:
- source_word: אָנֹכִי
  choice: Moi, je
  rationale: Le pronom indépendant met le sujet à la première personne en relief ; « Moi, je » conserve cette insistance de manière naturelle en français.
- source_word: אֶרְשָׁע
  choice: je serai déclaré coupable
  rationale: Le qal de רשע peut exprimer soit le fait d’être méchant, soit, dans un cadre judiciaire, celui d’être reconnu ou déclaré coupable. Le contexte de Job 9, centré sur l’impossibilité pour Job de faire reconnaître son innocence devant Dieu, favorise ici le sens judiciaire.
- source_word: לָמָה זֶּה
  choice: pourquoi donc
  rationale: Cette tournure interrogative signifie idiomatiquement « pourquoi donc ? » ou « pourquoi, dans ce cas ? » ; « donc » restitue le lien logique avec l’affirmation précédente.
- source_word: הֶבֶל
  choice: en vain
  rationale: הֶבֶל évoque ici la vacuité ou l’inutilité de l’effort. « En vain » est l’équivalent français le plus naturel dans cette question.
- source_word: אִיגָע
  choice: me fatiguer
  rationale: Le verbe יגע désigne le fait de peiner, de travailler jusqu’à la fatigue ou de se lasser. La forme française pronominale rend bien l’idée d’un effort épuisant et inutile.
theological_decisions:
- issue: Sens judiciaire ou moral de רשע
  choice: « je serai déclaré coupable »
  alternative: « je serai méchant »
  rationale: Le contexte immédiat porte sur la justice, l’innocence et le verdict devant Dieu. Le sens judiciaire est donc privilégié, tout en maintenant dans une note l’autre valeur possible du verbe hébreu afin de ne pas effacer son ambiguïté.
translation_notes:
  register: Français moderne, international et digne. L’ordre « Moi, je » conserve l’emphase hébraïque ; « pourquoi donc me fatiguer en vain ? » reste courant tout en gardant la force rhétorique et la tension du texte.
