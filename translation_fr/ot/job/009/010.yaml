  text: who does great things beyond searching out[b][a], and wonders beyond number.
translation:
  language: fr
  text: 'Il accomplit de grandes choses, qu’on ne peut sonder,

    et des merveilles sans nombre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹשֶׂה
  choice: Il accomplit
  rationale: Le participe qal décrit Dieu dans la continuité du contexte précédent. « Il accomplit » rend naturellement en français cette action caractéristique.
- source_word: גְדֹלוֹת
  choice: de grandes choses
  rationale: L’adjectif féminin pluriel est substantivé. « De grandes choses » conserve la portée large de l’hébreu sans préciser indûment qu’il s’agit seulement d’œuvres ou d’exploits.
- source_word: עַד אֵין חֵקֶר
  choice: qu’on ne peut sonder
  rationale: Cette formulation exprime l’impossibilité d’explorer pleinement ou de comprendre les actes de Dieu, tout en restant naturelle et digne en français contemporain.
- source_word: וְנִפְלָאוֹת
  choice: et des merveilles
  rationale: « Merveilles » désigne avec concision des actes extraordinaires qui suscitent l’émerveillement.
- source_word: עַד אֵין מִסְפָּר
  choice: sans nombre
  rationale: L’expression rend directement l’idée que ces merveilles sont innombrables et préserve le parallélisme poétique.
