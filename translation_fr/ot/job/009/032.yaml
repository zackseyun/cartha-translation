  yaml_path: translation/ot/job/009/032.yaml
  text: For he is not a man like me[a], that I should answer him, that we should come together in court.
translation:
  language: fr
  text: Car il n’est pas un homme comme moi, pour que je puisse lui répondre et que nous comparaissions ensemble en justice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour que je lui réponde et que nous nous présentions ensemble pour le jugement ».'
    reason: Préserve une traduction plus formelle de la construction hébraïque et l’éventail de sens de מִשְׁפָּט.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication que Job donne de l’impossibilité exposée dans le contexte; « Car » convient au mouvement argumentatif.
- source_word: לֹא אִישׁ כָּמֹנִי
  choice: lui n’est pas un homme comme moi
  rationale: Préserve la comparaison personnelle et le contraste entre Dieu et Job en tant que plaideur humain, tout en donnant en français l’emphase portée par l’ordre hébreu.
- source_word: אֶעֱנֶנּוּ
  choice: pour que je puisse lui répondre
  rationale: Le verbe signifie répondre; dans ce contexte judiciaire, il évoque la possibilité de présenter sa réponse à la partie adverse.
- source_word: נָבוֹא יַחְדָּו
  choice: que nous comparaissions ensemble
  rationale: « Comparaître ensemble » rend naturellement l’idée de se présenter tous deux dans le cadre judiciaire indiqué par la proposition suivante.
- source_word: בַּמִּשְׁפָּט
  choice: en justice
  rationale: מִשְׁפָּט peut désigner le jugement, le droit ou une procédure judiciaire; « en justice » conserve ici l’image d’un litige sans ajouter un tribunal terrestre explicite.
theological_decisions:
- issue: Image judiciaire entre Job et Dieu
  choice: Présenter comme impossible une comparution judiciaire entre Dieu et Job sur un pied d’égalité.
  alternative: « que nous allions ensemble au jugement »
  rationale: Le vocabulaire est juridique, mais le verset exprime avant tout, du point de vue de Job, que Dieu n’est pas un adversaire humain auquel il pourrait répondre dans une procédure commune.
- issue: Valeur de אִישׁ
  choice: « un homme »
  alternative: « un être humain »
  rationale: Le terme est masculin singulier et Job parle de lui-même; « un homme » conserve précisément le contraste formulé dans l’hébreu sans transformer celui-ci en affirmation abstraite sur la nature divine.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le raisonnement de Job; « comparaissions en justice » explicite sobrement le cadre judiciaire sans résoudre la tension théologique.
