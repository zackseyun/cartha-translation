source:
  edition: WLC
  text: אֶ֤רֶץ נִתְּנָ֬ה בְֽ/יַד רָשָׁ֗ע פְּנֵֽי שֹׁפְטֶ֥י/הָ יְכַסֶּ֑ה אִם לֹ֖א אֵפ֣וֹא מִי הֽוּא׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/024.yaml
  text: The earth is given into the hand of the wicked[a]; he covers the faces of its judges. If not[b], then who is it?
translation:
  language: fr
  text: La terre est livrée au pouvoir du méchant[a] ; il couvre les visages de ses juges[b]. Sinon, qui donc est-ce ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le pays est livré au pouvoir d’un méchant. » Le mot hébreu peut désigner « la terre » ou « le pays », et le singulier « méchant » peut viser un individu ou avoir un sens plus général.'
    reason: lexical_alternative
  - marker: b
    text: Le sujet de « il couvre » n’est pas exprimé en hébreu. Il peut s’agir de Dieu, du méchant ou d’un sujet non précisé.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: La terre
  rationale: אֶרֶץ peut désigner la terre entière ou un pays. Dans ce discours sur l’ordre du monde et l’injustice, « la terre » convient au sens le plus large, tandis que « le pays » reste possible et figure en note.
- source_word: נִתְּנָה
  choice: est livrée
  rationale: Le parfait nifal de נתן exprime ici le fait d’être remis ou livré à un pouvoir. Le présent français rend naturellement l’état qui en résulte.
- source_word: בְיַד
  choice: au pouvoir de
  rationale: L’expression hébraïque signifie être placé dans la main, donc sous le pouvoir de quelqu’un. « Au pouvoir de » transmet clairement cet idiome en français courant et digne.
- source_word: רָשָׁע
  choice: du méchant
  rationale: Le singulier hébreu peut désigner un individu méchant ou avoir une portée générique. Le singulier substantivé français garde cette concision sans préciser l’identité du personnage.
- source_word: פְּנֵי שֹׁפְטֶיהָ
  choice: le visage de ses juges
  rationale: Le français emploie naturellement le singulier distributif « le visage » pour chacun des juges. Le possessif renvoie à la terre, comme le suffixe féminin hébreu.
- source_word: יְכַסֶּה
  choice: il couvre
  rationale: Le piel à la troisième personne du masculin singulier signifie directement « il couvre ». Le texte hébreu ne nomme toutefois pas le sujet, ambiguïté signalée en note.
- source_word: אִם לֹא אֵפוֹא מִי הוּא
  choice: Sinon, qui donc est-ce ?
  rationale: La formule rend le défi rhétorique et la valeur de אֵפוֹא (« donc »), sans ajouter un antécédent absent de l’hébreu.
theological_decisions:
- issue: Identité du sujet implicite de « il couvre » et de la question finale
  choice: Le texte ne nomme pas explicitement le sujet ; une note conserve les principales possibilités.
  alternative: Identifier directement Dieu, le méchant ou un agent indéterminé comme sujet.
  rationale: Le contexte peut orienter la rhétorique vers Dieu comme acteur ultime, mais la proposition hébraïque laisse le sujet de יְכַסֶּה inexprimé. Il convient de préserver cette tension plutôt que de la résoudre dans la traduction.
translation_notes:
  register: Français international moderne, sobre et poétique. « Au pouvoir de » rend naturellement l’idiome de la main sans obscurité ; la formulation conserve la brièveté et le caractère accusateur de la parole de Job.
