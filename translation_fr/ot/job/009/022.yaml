  text: אַחַ֗ת הִ֥יא עַל כֵּ֥ן אָמַ֑רְתִּי תָּ֥ם וְ֝/רָשָׁ֗ע ה֣וּא מְכַלֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/022.yaml
  text: It is all one[a]; therefore I say[b], ‘He destroys both the blameless and the wicked.’
translation:
  language: fr
  text: 'Tout revient au même. C’est pourquoi je le dis[a] : il fait périr aussi bien l’homme intègre que le méchant[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je l’ai dit ». L’accompli hébreu peut, selon le contexte, être rendu comme une déclaration présente ou passée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « cela fait périr aussi bien l’homme intègre que le méchant », si l’on comprend le sujet de manière plus impersonnelle.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת הִיא
  choice: Tout revient au même
  rationale: L’expression indique ici que la différence entre les deux catégories ne change rien à leur sort. Cette formulation idiomatique française conserve la concision et l’amertume du constat de Job.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution marque clairement la conclusion que Job tire de son affirmation précédente.
- source_word: אָמַרְתִּי
  choice: je le dis
  rationale: Bien que la forme hébraïque soit un accompli, elle peut introduire ici une déclaration présente. « Je le dis » convient naturellement au mouvement du discours, tandis que la valeur passée ou accomplie est signalée en note.
- source_word: תָּם
  choice: l’homme intègre
  rationale: Dans Job, le terme désigne une personne entière et irréprochable dans sa conduite, sans impliquer une perfection absolue ni l’absence totale de péché.
- source_word: רָשָׁע
  choice: le méchant
  rationale: Rendu courant du terme désignant la personne moralement coupable; il forme ici l’antithèse de l’homme intègre.
- source_word: הוּא מְכַלֶּה
  choice: il fait périr
  rationale: Le pronom masculin singulier renvoie le plus naturellement à Dieu dans le contexte. « Faire périr » exprime avec dignité la force de כלה, qui signifie mener à son terme, anéantir ou détruire.
theological_decisions:
- issue: Sujet implicite de « il fait périr »
  choice: Le sujet est rendu personnellement par « il », en référence à Dieu dans le discours de Job.
  alternative: « Cela fait périr aussi bien l’homme intègre que le méchant. »
  rationale: Dans Job 9, Job parle de la puissance et du gouvernement de Dieu; Dieu est donc le référent le plus naturel. La traduction maintient sans l’atténuer la plainte théologique saisissante de Job, tout en signalant en note la possibilité d’une lecture plus impersonnelle.
translation_notes:
  register: Français international moderne, sobre et digne. « Tout revient au même » restitue l’idiome hébreu sans lourdeur; « l’homme intègre » évite que « parfait » suggère une perfection absolue. La formulation conserve volontairement la dureté de l’accusation de Job.
