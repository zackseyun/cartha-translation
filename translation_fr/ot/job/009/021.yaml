id: JOB.9.21
reference: Job 9:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תָּֽם אָ֭נִי לֹֽא אֵדַ֥ע נַפְשִׁ֗/י אֶמְאַ֥ס חַיָּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/021.yaml
  text: I am blameless[a]; I do not know myself; I despise my life.
translation:
  language: fr
  text: Je suis intègre ; je ne me connais pas moi-même[a] ; je méprise ma vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je ne connais pas mon âme » ou « je ne connais pas ma propre personne ». Le mot hébreu peut désigner l'âme, la personne elle-même ou la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּם
  choice: intègre
  rationale: Le terme désigne ici l'intégrité ou le caractère irréprochable de Job, sans nécessairement affirmer une perfection morale absolue. « Intègre » est naturel en français et fait écho au portrait de Job dans le livre.
- source_word: אָנִי
  choice: je
  rationale: Le pronom de première personne, exprimé dans l'hébreu, porte une légère emphase et est naturellement rendu par « je ».
- source_word: לֹא אֵדַע
  choice: je ne connais pas
  rationale: Le sens premier est « connaître ». Cette traduction conserve la formulation abrupte et son ambiguïté, au lieu de préciser « je ne me soucie pas de » ou « je ne reconnais pas ».
- source_word: נַפְשִׁי
  choice: moi-même
  rationale: נֶפֶשׁ peut désigner la personne, le soi, l'âme ou la vie. Dans cette construction, « moi-même » donne un français compréhensible tout en maintenant l'idée d'un rapport de Job à sa propre personne.
- source_word: אֶמְאַס
  choice: je méprise
  rationale: מָאַס signifie rejeter ou mépriser. « Méprise » conserve la force émotionnelle sans aller jusqu'au plus intense « j'ai horreur de ».
- source_word: חַיָּי
  choice: ma vie
  rationale: Le pluriel hébreu חַיִּים avec suffixe désigne ici l'existence vécue de Job ; « ma vie » est la formulation française naturelle.
theological_decisions:
- issue: Portée de l'affirmation תָּם אָנִי
  choice: « Je suis intègre »
  alternative: « Je suis innocent » ou « Je suis irréprochable »
  rationale: « Intègre » préserve l'affirmation de Job concernant sa droiture sans la transformer en revendication explicite d'absence absolue de péché.
translation_notes:
  register: Français moderne, sobre et digne. La ponctuation conserve les trois déclarations brèves et tendues de l'hébreu. « Intègre » appartient au registre biblique courant tout en restant accessible ; la note maintient l'étendue sémantique de נֶפֶשׁ.
