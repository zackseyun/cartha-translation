id: JOB.9.12
reference: Job 9:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵ֣ן יַ֭חְתֹּף מִ֣י יְשִׁיבֶ֑/נּוּ מִֽי יֹאמַ֥ר אֵ֝לָ֗י/ו מַֽה תַּעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/012.yaml
  text: Look[a], if he snatches away, who can turn him back? Who can say to him[b], ‘What are you doing?’
translation:
  language: fr
  text: 'S’il emporte soudain, qui peut le faire revenir ? Qui peut lui dire : « Que fais-tu ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: si
  rationale: Dans cette construction conditionnelle, הֵן introduit avec vivacité l’éventualité envisagée. En français courant, « s’il » restitue naturellement le mouvement de la phrase sans ajouter un « voici » peu idiomatique.
- source_word: יַחְתֹּף
  choice: emporte soudain
  rationale: חטף désigne une prise brusque et énergique. « Emporte soudain » exprime à la fois la soudaineté et l’idée d’enlèvement, sans préciser indûment l’objet.
- source_word: יְשִׁיבֶנּוּ
  choice: le faire revenir
  rationale: Le hifil de שוב signifie « faire revenir » ou « ramener ». Le suffixe masculin singulier est conservé personnellement et renvoie vraisemblablement à Dieu dans le contexte.
- source_word: מִי
  choice: qui peut
  rationale: Dans ces questions rhétoriques, l’interrogatif implique l’incapacité de quiconque à s’opposer à Dieu ; « qui peut » en rend naturellement la force.
- source_word: יֹאמַר אֵלָיו
  choice: lui dire
  rationale: Traduction directe, sans ajouter explicitement une idée de protestation qui demeure seulement implicite.
- source_word: מַה תַּעֲשֶׂה
  choice: Que fais-tu ?
  rationale: 'L’imparfait hébreu prend ici la valeur idiomatique d’une contestation portant sur l’action en cours ou caractéristique : « Que fais-tu ? »'
theological_decisions:
- issue: Référent des suffixes masculins singuliers
  choice: 'Les rendre personnellement comme renvoyant à Dieu : « le… lui ».'
  alternative: 'Comprendre le premier suffixe comme renvoyant à ce que Dieu emporte : « qui peut le ramener ? »'
  rationale: Le contexte décrit l’action irrésistible de Dieu, et la seconde proposition vise clairement Dieu comme destinataire de la question. La traduction personnelle maintient cette cohérence tout en respectant le masculin singulier.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et énergique, conformément aux questions rhétoriques de l’hébreu. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
