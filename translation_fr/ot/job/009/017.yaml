id: JOB.9.17
reference: Job 9:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲשֶׁר בִּ/שְׂעָרָ֥ה יְשׁוּפֵ֑/נִי וְ/הִרְבָּ֖ה פְצָעַ֣/י חִנָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/017.yaml
  text: who crushes me in a storm and multiplies my wounds without cause[a][b][c].
translation:
  language: fr
  text: lui qui m’écrase dans la tempête et multiplie mes blessures sans raison[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «par la tempête» ou «dans le tourbillon». La préposition hébraïque peut exprimer le cadre, la manière ou le moyen.
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi être rendu par «me meurtrit» ou, moins probablement ici, «se jette sur moi».
    reason: lexical_alternative
  - marker: c
    text: Ou «sans motif» ou «gratuitement».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: lui qui
  rationale: Le pronom relatif poursuit naturellement, en français, la description de Dieu commencée dans le contexte précédent.
- source_word: בִּשְׂעָרָה
  choice: dans la tempête
  rationale: שְׂעָרָה désigne une tempête ou un tourbillon. La préposition ב peut indiquer le cadre, la manière ou le moyen; «dans la tempête» conserve l’image sans trancher entièrement.
- source_word: יְשׁוּפֵנִי
  choice: m’écrase
  rationale: Le verbe rare שׁוף évoque ici une atteinte violente, en parallèle avec les blessures multipliées. «Écrase» en restitue la force.
- source_word: וְהִרְבָּה
  choice: et multiplie
  rationale: Le hifil de רבה signifie rendre nombreux ou accroître; «multiplie» est direct et poétique avec «blessures».
- source_word: פְצָעַי
  choice: mes blessures
  rationale: פצע désigne directement une blessure; ce choix est naturel et précis dans ce contexte.
- source_word: חִנָּם
  choice: sans raison
  rationale: חִנָּם signifie gratuitement, sans motif ou pour rien. «Sans raison» exprime clairement la plainte de Job sans ajouter d’interprétation.
theological_decisions:
- issue: La portée de חִנָּם quant à l’innocence de Job et à la justice divine
  choice: sans raison
  alternative: sans que je l’aie mérité
  rationale: La formulation conserve toute la force de la protestation de Job sans décider si elle affirme une innocence morale absolue ni atténuer la tension théologique du livre.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe poétique claire. «Lui qui» maintient le lien avec la phrase précédente; les notes préservent les ambiguïtés lexicales de l’hébreu.
