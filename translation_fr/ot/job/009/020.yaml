  text: אִם אֶ֭צְדָּק פִּ֣/י יַרְשִׁיעֵ֑/נִי תָּֽם אָ֝֗נִי וַֽ/יַּעְקְשֵֽׁ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/020.yaml
  text: If I am in the right[a], my own mouth would condemn me; though I am blameless, it would prove me crooked.
translation:
  language: fr
  text: Si je suis dans mon droit, ma propre bouche me condamnerait ; même si je suis intègre, elle me présenterait comme pervers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Même si je suis intègre, il me présenterait comme pervers », si Dieu est le sujet sous-entendu du dernier verbe.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: La particule introduit naturellement ici une condition. La portée concessive possible ressort de l’ensemble du verset sans qu’il soit nécessaire de traduire « même si ».
- source_word: אֶצְדָּק
  choice: je suis dans mon droit
  rationale: 'Le qal de צדק a ici un sens statif et judiciaire : « être dans son droit », plutôt que le sens causatif « me justifier ».'
- source_word: פִּי
  choice: ma propre bouche
  rationale: 'Le sens littéral est « ma bouche ». L’ajout de « propre » explicite sobrement l’ironie : les paroles mêmes de Job se retourneraient contre lui.'
- source_word: יַרְשִׁיעֵנִי
  choice: me condamnerait
  rationale: Le hiphil de רשע a dans ce contexte judiciaire le sens de déclarer coupable ou condamner.
- source_word: תָּם
  choice: je suis intègre
  rationale: Dans Job, תם désigne habituellement l’intégrité et l’absence de faute démontrable, non une perfection absolue. « Intègre » convient à une personne et reste naturel en français.
- source_word: וַיַּעְקְשֵׁנִי
  choice: elle me ferait passer pour quelqu’un de pervers
  rationale: Le verbe issu de עקשׁ évoque ce qui est tortueux ou pervers. Cette formulation exprime le résultat accusateur sans affirmer que la bouche rendrait réellement Job pervers.
theological_decisions:
- issue: Sujet de וַיַּעְקְשֵׁנִי
  choice: 'Le sujet reste « ma propre bouche » : « elle me ferait passer pour quelqu’un de pervers »'
  alternative: 'Dieu est le sujet sous-entendu : « il me ferait passer pour quelqu’un de pervers » ou « il me déclarerait pervers »'
  rationale: Le parallélisme favorise la continuité du sujet entre les deux membres. Toutefois, l’hébreu n’exprime pas le sujet du second verbe ; la note conserve donc l’autre lecture ancienne et théologiquement significative sans la faire entrer de force dans le texte.
translation_notes:
  register: Français moderne, international et digne. Le vocabulaire judiciaire de la première proposition est conservé, tandis que « intègre » évite de suggérer une perfection sans péché. Le pronom féminin « elle » rend explicite la continuité probable avec « ma propre bouche ».
