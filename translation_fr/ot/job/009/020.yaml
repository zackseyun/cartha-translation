    issue: Le second « si » introduit une condition absente du texte hébreu.
    rationale: Après le premier membre conditionnel, תָּם אָנִי signifie littéralement « je suis intègre / sans reproche ». Le français peut expliciter la valeur concessive impliquée par « Même si », mais ne devrait pas présenter ce membre comme une simple seconde protase parallèle.
  revised_text: Si je suis dans mon droit, ma propre bouche me condamnerait ; même si je suis intègre, elle me présenterait comme pervers.[a]
