- from: Si je suis dans mon droit, ma propre bouche me condamnerait ; si je suis intègre, elle me ferait passer pour quelqu’un de pervers.[a]
  to: Si je suis dans mon droit, ma propre bouche me condamnerait ; même si je suis intègre, elle me présenterait comme pervers.[a]
  rationale: La révision remplace la seconde condition explicite par une concession, plus fidèle à la proposition nominale hébraïque et à la logique paradoxale du verset. Elle conserve la lecture principale selon laquelle « ma propre bouche » reste le sujet du dernier verbe, tout en gardant en note l’interprétation possible où Dieu est le sujet implicite.
