  text: אִם יַ֭חְפֹּץ לָ/רִ֣יב עִמּ֑/וֹ לֹֽא יַ֝עֲנֶ֗/נּוּ אַחַ֥ת מִנִּי אָֽלֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/003.yaml
  text: If one wished to contend with him[b][a], he could not answer him one time out of a thousand.
translation:
  language: fr
  text: Si quelqu’un voulait plaider contre lui[a], il ne pourrait lui répondre une seule fois sur mille[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entrer en litige avec lui » ou « chercher à lui faire un procès ». Le verbe hébreu peut désigner une contestation de caractère judiciaire.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il ne lui répondrait pas une sur mille » ; le sens est qu’il ne pourrait lui répondre même pas une fois sur mille.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יַחְפֹּץ
  choice: Si quelqu’un voulait
  rationale: La tournure conditionnelle et hypothétique rend naturellement אִם avec l’inaccompli de חפץ, qui exprime ici la volonté ou le désir.
- source_word: לָרִיב עִמּוֹ
  choice: contester avec lui
  rationale: ריב désigne une contestation qui peut avoir une nuance judiciaire. « Contester avec lui » conserve à la fois l’affrontement verbal et la possibilité d’un litige, sans technicité excessive.
- source_word: לֹא יַעֲנֶנּוּ
  choice: il ne pourrait pas lui répondre
  rationale: ענה signifie « répondre ». Dans le contexte de la puissance et de la sagesse divines, la négation exprime l’incapacité du contestant plutôt qu’un simple refus.
- source_word: אַחַת מִנִּי אָלֶף
  choice: une seule fois sur mille
  rationale: Cette formulation française naturelle conserve l’hyperbole et rend explicite la valeur adverbiale de « une ».
theological_decisions:
- issue: Référent des pronoms
  choice: Le premier « quelqu’un/il » désigne une personne qui voudrait contester avec Dieu, tandis que « lui » renvoie à Dieu.
  alternative: Les deux protagonistes pourraient être compris de manière générique comme deux adversaires humains.
  rationale: Le contexte immédiat de Job 9.2-4 porte sur la sagesse et la puissance de Dieu. Le texte garde néanmoins les pronoms au lieu d’ajouter explicitement « Dieu », afin de préserver la formulation hébraïque.
- issue: Portée judiciaire de ריב
  choice: Employer « contester », avec une note signalant la nuance de procès.
  alternative: Traduire directement par « plaider contre lui » ou « lui faire un procès ».
  rationale: « Contester » préserve l’ambivalence entre dispute générale et confrontation judiciaire, sans imposer une scène strictement procédurale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en employant l’expression idiomatique française « une seule fois sur mille ». Les notes conservent la nuance judiciaire et la formulation elliptique de l’original.
