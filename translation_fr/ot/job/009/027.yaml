  yaml_path: translation/ot/job/009/027.yaml
  text: If I say[a], ‘I will forget my complaint[b]; I will put aside my sad face and be cheerful,’
translation:
  language: fr
  text: 'Si je dis : « J’oublierai ma plainte[a], j’abandonnerai mon air sombre et je prendrai un air joyeux[b] »,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma méditation » ou « mon discours intérieur ». Le terme hébreu peut désigner une réflexion intérieure aussi bien qu’une plainte ; ici, le contexte de lamentation favorise « plainte ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « laisser mon visage et… ». L’expression évoque l’abandon d’une expression accablée. Le dernier verbe hébreu est rare et son sens précis est incertain ; il peut évoquer le fait de se détendre, de se réconforter ou de prendre un air plus joyeux.
    reason: cultural_note
lexical_decisions:
- source_word: אִם אָמְרִי
  choice: Si je me dis
  rationale: La construction introduit ici une résolution hypothétique. « Si je me dis » est naturel en français et rend bien le discours intérieur de Job.
- source_word: אֶשְׁכְּחָה
  choice: Je vais oublier
  rationale: La forme exprime la résolution envisagée par Job; le futur proche convient à une décision qu’il se propose de prendre.
- source_word: שִׂיחִי
  choice: ma plainte
  rationale: Le terme peut désigner la méditation, le discours intérieur ou la plainte; dans ce contexte de lamentation, « plainte » convient le mieux sans effacer l’ambivalence lexicale, signalée en note.
- source_word: אֶעֶזְבָה פָנַי
  choice: changer de visage
  rationale: Littéralement, Job envisage de « laisser son visage », c’est-à-dire d’abandonner son expression accablée. L’expression française rend naturellement cette modification visible de l’attitude.
- source_word: וְאַבְלִיגָה
  choice: retrouver le sourire
  rationale: Le verbe rare évoque vraisemblablement un relâchement de la peine ou un visage qui s’éclaire. Cette formulation restitue l’effet affectif et visible de l’expression.
