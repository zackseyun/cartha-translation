lexical_decisions:
- source_word: הָאֹמֵר
  choice: lui qui dit
  rationale: Le participe poursuit la description de Dieu commencée dans le contexte précédent. « lui qui » conserve ce lien tout en restant naturel dans une phrase poétique.
- source_word: לַחֶרֶס
  choice: au soleil
  rationale: Dans ce contexte cosmique, avec l’idée de se lever et la mention des étoiles, חֶרֶס désigne très probablement le soleil dans un emploi poétique.
- source_word: וְלֹא יִזְרָח
  choice: « Ne te lève pas ! »
  rationale: L’imparfait peut s’entendre comme le contenu de la parole adressée au soleil. Le tutoiement garde la personnification vive du texte; la lecture résultative demeure signalée en note.
- source_word: וּבְעַד
  choice: sous
  rationale: Avec le verbe « sceller », la préposition évoque ce que l’on enferme ou recouvre par un sceau. « Mettre sous sceau » rend cette relation idiomatiquement en français.
- source_word: כּוֹכָבִים
  choice: les étoiles
  rationale: Le pluriel désigne simplement les étoiles; l’article défini convient naturellement à cette affirmation cosmique en français.
- source_word: יַחְתֹּם
  choice: met sous sceau
  rationale: Cette expression conserve l’image concrète de חתם, « sceller », tout en suggérant que Dieu empêche les étoiles de paraître.
