  text: 'lui qui dit au soleil[b] : « Ne te lève pas ! »[a] et qui scelle les étoiles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « et il ne se lève pas » ; l’hébreu peut exprimer soit l’ordre adressé au soleil, soit l’effet de la parole de Dieu.'
