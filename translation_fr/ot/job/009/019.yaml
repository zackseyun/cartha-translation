source:
  edition: WLC
  text: אִם לְ/כֹ֣חַ אַמִּ֣יץ הִנֵּ֑ה וְ/אִם לְ֝/מִשְׁפָּ֗ט מִ֣י יוֹעִידֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/019.yaml
  text: If it is a matter of strength[a], behold, he is mighty; and if of justice[b], who can summon him?
translation:
  language: fr
  text: S’il s’agit de force, le voilà puissant ! Et s’il s’agit de jugement[a], qui me convoquera[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Jugement » peut aussi se traduire par « justice » ou « procès » dans ce contexte judiciaire.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, selon une lecture guidée par le contexte : « qui le convoquera ? » Le texte hébreu vocalisé porte toutefois littéralement « qui me convoquera ? ». Le verbe peut aussi signifier « fixer une audience à » ou « assigner en justice ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לְכֹחַ
  choice: S’il s’agit de force
  rationale: 'La préposition לְ présente ici le domaine envisagé : « en matière de force ». Cette formulation française conserve la structure hypothétique tout en restant naturelle.'
- source_word: אַמִּיץ
  choice: puissant
  rationale: L’adjectif exprime une force supérieure ou irrésistible. « Puissant » évite de répéter « force » et convient au registre élevé du passage.
- source_word: הִנֵּה
  choice: le voilà
  rationale: La tournure attire vivement l’attention sur celui dont Job parle et restitue en français la force rhétorique de הִנֵּה.
- source_word: וְאִם לְמִשְׁפָּט
  choice: Et s’il s’agit de jugement
  rationale: מִשְׁפָּט possède ici une nette dimension judiciaire. « Jugement » conserve mieux que le seul mot « justice » l’image d’une procédure ou d’un procès.
- source_word: מִי יוֹעִידֵנִי
  choice: qui me convoquera
  rationale: 'Le hifil de יעד peut désigner le fait de fixer une rencontre ou de convoquer quelqu’un, notamment dans un cadre judiciaire. Le suffixe vocalisé ־נִי est à la première personne : « me ».'
theological_decisions:
- issue: L’imagerie judiciaire dans la contestation de Job
  choice: Conserver le langage de tribunal avec « jugement » et « convoquera », sans atténuer la hardiesse de Job.
  alternative: Traduire plus généralement par « justice » et « qui me fixera une audience ? »
  rationale: Le contexte de Job 9 met en scène l’impossibilité pour Job de faire trancher son différend avec Dieu. La traduction maintient cette tension sans la résoudre doctrinalement.
- issue: Objet du verbe יוֹעִידֵנִי
  choice: 'Suivre le texte massorétique vocalisé : « me convoquera ».'
  alternative: « Qui le convoquera ? », en comprenant Dieu comme objet d’après le contexte ou en adoptant une correction interprétative.
  rationale: La forme hébraïque transmise porte explicitement un suffixe de première personne. Même si « le convoquera » s’accorde bien avec certains développements contextuels, la traduction principale doit rendre le texte source attesté et signaler l’autre lecture.
translation_notes:
  register: Français international moderne, naturel et digne. L’exclamation après « puissant » restitue l’intensité de הִנֵּה. Le parallélisme des deux propositions conditionnelles est conservé, ainsi que l’ambiguïté judiciaire du second membre.
