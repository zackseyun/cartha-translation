  text: יָסֵ֣ר מֵ/עָלַ֣/י שִׁבְט֑/וֹ וְ֝/אֵמָת֗/וֹ אַֽל תְּבַעֲתַֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/034.yaml
  text: Let him remove his rod from upon me[a], and let not his terror frighten me.
translation:
  language: fr
  text: Qu’il retire de sur moi son bâton[a], et que sa terreur ne m’épouvante pas !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Qu’il détourne de moi sa verge, et que son effroi ne me terrifie pas. »
    reason: Alternative lexicale pour יָסֵר, מֵעָלַי, שִׁבְטוֹ, אֵמָתוֹ et תְּבַעֲתַנִּי.
lexical_decisions:
- source_word: יָסֵר
  choice: Qu’il retire
  rationale: Le hiphil de סור a ici une valeur jussive et exprime le souhait de Job. « Qu’il retire » rend naturellement cette nuance volitive.
- source_word: מֵעָלַי
  choice: de dessus moi
  rationale: Cette formulation conserve l’image hébraïque d’un bâton qui pèse sur Job, tout en restant claire en français moderne.
- source_word: שִׁבְטוֹ
  choice: son bâton
  rationale: שֵׁבֶט peut désigner un bâton, une verge ou un sceptre. Dans ce contexte de souffrance, « bâton » évoque au mieux l’instrument qui frappe, sans privilégier l’idée de royauté.
- source_word: וְאֵמָתוֹ
  choice: et que sa terreur
  rationale: אֵימָה désigne la terreur ou l’effroi. « Sa terreur » exprime ici la peur accablante inspirée par Dieu.
- source_word: אַל
  choice: ne… plus
  rationale: Avec le verbe qui suit, אַל exprime un souhait négatif. En contexte, « que… ne… plus » rend en français naturel le désir que cette terreur cesse.
- source_word: תְּבַעֲתַנִּי
  choice: m’épouvante
  rationale: Le verbe בעת signifie terrifier ou épouvanter. « M’épouvante » convient au registre poétique et évite une répétition maladroite de « terreur » et « terrifier ».
theological_decisions:
- issue: Référent des pronoms à la troisième personne du singulier
  choice: Dieu est évoqué indirectement par « il/son/sa », et non interpellé par « tu/ton/ta ».
  alternative: 'Adresse directe : « Retire de dessus moi ton bâton, et que ta terreur ne m’épouvante plus ! »'
  rationale: L’hébreu emploie un verbe et des suffixes à la troisième personne du singulier. La traduction préserve cette grammaire et la manière dont Job parle ici de Dieu, sans transformer le propos en adresse directe.
translation_notes:
  register: Français international moderne, poétique et digne. L’inversion avec « Qu’il… » conserve la force du souhait, tandis que « de dessus moi » maintient l’image concrète et pesante de l’hébreu.
