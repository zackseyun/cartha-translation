source:
  edition: WLC
  text: הַ/מַּעְתִּ֣יק הָ֭רִים וְ/לֹ֣א יָדָ֑עוּ אֲשֶׁ֖ר הֲפָכָ֣/ם בְּ/אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/005.yaml
  text: He removes mountains[a], and they do not know it[c][b], when he overturns them in his anger.
translation:
  language: fr
  text: Il déplace les montagnes[a] sans qu’elles le sachent[b], lorsqu’il les renverse dans sa colère[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il enlève les montagnes ». Le verbe hébreu peut désigner le fait de déplacer quelque chose de son emplacement.
    reason: lexical_alternative
  - marker: b
    text: Par une personnification poétique, les montagnes sont présentées comme ignorant que Dieu les renverse.
    reason: cultural_note
  - marker: c
    text: Ou « dans sa fureur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְתִּיק
  choice: déplace
  rationale: Le participe hiphil de עתק exprime ici le fait de faire changer quelque chose de place. « Déplace » conserve cette image sans préciser excessivement s’il les enlève ou les transporte.
- source_word: הָרִים
  choice: les montagnes
  rationale: Équivalent français courant du pluriel הָרִים.
- source_word: וְלֹא יָדָעוּ
  choice: sans qu’elles le sachent
  rationale: Cette formulation française naturelle conserve le pluriel du verbe et la personnification poétique des montagnes; « le » explicite sobrement l’objet implicite.
- source_word: אֲשֶׁר
  choice: lorsqu’il
  rationale: Dans ce contexte, אֲשֶׁר introduit la circonstance temporelle dans laquelle les montagnes ne savent pas ce qui leur arrive.
- source_word: הֲפָכָם
  choice: il les renverse
  rationale: Le verbe הפך évoque un retournement violent, et « les » rend explicitement le suffixe pronominal masculin pluriel.
- source_word: בְּאַפּוֹ
  choice: dans sa colère
  rationale: אַף désigne idiomatiquement la colère. « Dans sa colère » est clair, digne et naturel en français moderne, tout en conservant la valeur circonstancielle de la préposition.
theological_decisions: []
