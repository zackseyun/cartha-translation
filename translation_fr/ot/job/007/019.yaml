  naturalness: La coordination « refuseras-tu de détourner ... et de me laisser tranquille, ne serait-ce que ... » est syntaxiquement lourde et laisse entendre que « refuser » régit de la même manière les deux infinitifs. Deux interrogations donnent un français moderne plus net tout en restituant le parallélisme plaintif.
  terminology: « Salive » est un rendu juste et naturel de רֻקִּי. « Me laisseras-tu tranquille » est idiomatique et adéquat pour תַרְפֵּנִי dans ce contexte. La note peut expliciter l’idiome sans substituer cette explication au sens littéral dans le texte.
