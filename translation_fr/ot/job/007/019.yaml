  text: כַּ֭/מָּה לֹא תִשְׁעֶ֣ה מִמֶּ֑/נִּי לֹֽא תַ֝רְפֵּ֗/נִי עַד בִּלְעִ֥/י רֻקִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/019.yaml
  text: How long will you not look away from me[a], nor leave me alone until I swallow my spit?
translation:
  language: fr
  text: Jusqu’à quand ne détourneras-tu pas ton regard de moi[a] ? Ne me laisseras-tu pas tranquille jusqu’à ce que j’avale ma salive ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cesseras-tu de fixer ton regard sur moi ». L’expression « jusqu’à ce que j’avale ma salive » évoque un répit extrêmement bref.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Jusqu’à quand
  rationale: Dans cette plainte, l’interrogatif exprime la durée et introduit naturellement en français une demande pressante de répit.
- source_word: תִשְׁעֶה מִמֶּנִּי
  choice: refuseras-tu de détourner de moi ton regard
  rationale: Le verbe évoque ici l’orientation du regard. Cette formulation conserve l’idée que Job demande à Dieu de cesser de le surveiller fixement, tout en rendant explicitement la négation hébraïque.
- source_word: תַרְפֵּנִי
  choice: me laisser tranquille
  rationale: La forme causative de רפה signifie relâcher, lâcher prise ou cesser d’importuner. « Me laisser tranquille » est naturel en français moderne et convient au parallélisme.
- source_word: עַד
  choice: ne serait-ce que le temps de
  rationale: עַד marque la limite du répit demandé. Cette tournure française restitue la valeur idiomatique d’un délai extrêmement bref sans effacer l’image qui suit.
- source_word: בִּלְעִי רֻקִּי
  choice: d’avaler ma salive
  rationale: La traduction garde l’image corporelle concrète de l’hébreu. « Salive » est plus naturel et digne en français courant que « crachat », lequel pourrait suggérer une matière déjà expectorée.
theological_decisions:
- issue: Le regard divin comme objet de la plainte
  choice: Conserver la demande directe adressée à Dieu de détourner son regard
  alternative: Atténuer en parlant seulement d’accorder du repos
  rationale: Le texte présente sans l’adoucir la tension entre l’attention de Dieu et l’expérience oppressive qu’en fait Job. La traduction préserve cette audace théologique.
translation_notes:
  register: Français international moderne, direct et digne. La plainte conserve sa vigueur et son image corporelle, tandis que « ne serait-ce que le temps de » rend clairement la portée idiomatique de la dernière proposition.
