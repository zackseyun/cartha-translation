  text: so that my soul chooses strangling[b][a], death rather than my bones.
translation:
  language: fr
  text: alors ma vie choisirait l’étranglement[a], la mort plutôt que mes os[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’étouffement ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la mort de mes os ». Le sens comparatif (« la mort plutôt que mes os ») est probable : Job préfère la mort à la poursuite de son existence corporelle affligée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְחַר
  choice: je préférerais
  rationale: Le verbe בחר signifie « choisir ». Dans l’enchaînement poétique avec le verset précédent, le conditionnel français exprime naturellement le choix envisagé par Job, sans durcir la forme en décision actuelle.
- source_word: מַחֲנָק
  choice: être étranglé
  rationale: Le nom désigne l’étranglement ou l’étouffement. La tournure verbale est plus naturelle en français tout en conservant l’image concrète et violente.
- source_word: נַפְשִׁי
  choice: je
  rationale: נֶפֶשׁ désigne ici la personne vivante elle-même. Traduire par « je » évite le tour peu naturel « mon âme choisirait » sans imposer une distinction anthropologique étrangère au contexte.
- source_word: מָוֶת
  choice: la mort
  rationale: Équivalent direct et usuel de מָוֶת.
- source_word: מֵעַצְמוֹתָי
  choice: à mes os
  rationale: 'La préposition מן est comprise comparativement après l’idée de choix : Job préfère la mort à ses os, image de son existence corporelle affligée. « Os » conserve l’expression poétique hébraïque.'
theological_decisions:
- issue: Portée de נַפְשִׁי
  choice: Rendu idiomatiquement par « je »
  alternative: « mon âme » ou « ma vie »
  rationale: Le contexte parle du choix de Job lui-même. « Je » reste neutre quant à une doctrine de l’âme et correspond à l’usage large de נֶפֶשׁ pour la personne ou la vie.
translation_notes:
  register: Français moderne, sobre et poétique. La répétition de « je préférerais » rend explicite le parallélisme elliptique et assure une lecture naturelle, tandis que les notes préservent la formulation littérale et l’alternative lexicale.
