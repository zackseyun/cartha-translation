  source_fidelity: Le texte rend correctement la répétition temporelle (« chaque matin », « à chaque instant »), les deux suffixes masculins singuliers renvoyant à l’être humain, et le parallélisme entre l’attention divine et l’épreuve. Toutefois, « t’occuper de lui » évoque spontanément en français le soin ou la prise en charge, et risque donc d’adoucir l’attention intrusive et éprouvante que suggèrent le contexte de plainte et le parallélisme avec בחן. « L’observer » conserve une attention soutenue et scrutatrice sans réduire פקד à une seule acception technique.
