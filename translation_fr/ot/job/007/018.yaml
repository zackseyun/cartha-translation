  yaml_path: translation/ot/job/007/018.yaml
  text: that you attend to him every morning[b][a], and test him every moment?
translation:
  language: fr
  text: pour que tu l’observes chaque matin[a] et que tu le mettes à l’épreuve à chaque instant[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que tu lui rendes visite chaque matin ». Le verbe hébreu peut signifier « visiter », « observer », « prêter attention à » ou « intervenir auprès de ».
    reason: lexical_alternative
  - marker: b
    text: Ou « que tu l’examines à chaque instant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדֶנּוּ
  choice: pour que tu t’occupes de lui
  rationale: Le verbe פקד exprime ici l’attention active et répétée que Dieu porte à l’être humain. « T’occuper de lui » reste naturel en français et peut, dans le contexte de la plainte de Job, évoquer une surveillance pesante sans imposer l’idée d’une visite bienveillante.
- source_word: לִבְקָרִים
  choice: chaque matin
  rationale: Le pluriel à valeur itérative avec ל désigne une action qui se répète de matin en matin ; « chaque matin » en restitue naturellement la force.
- source_word: לִרְגָעִים
  choice: à chaque instant
  rationale: רגעים désigne de très brefs moments répétés. « À chaque instant » exprime clairement la continuité insistante de cette attention.
- source_word: תִּבְחָנֶנּוּ
  choice: tu le mettes à l’épreuve
  rationale: בחן signifie éprouver ou examiner afin de sonder la valeur ou la qualité de quelqu’un. « Mettre à l’épreuve » conserve cette nuance dans un français courant et digne.
- source_word: ־נּוּ
  choice: lui / le
  rationale: Le suffixe masculin singulier renvoie à l’être humain évoqué au verset précédent. Les pronoms singuliers maintiennent ce lien grammatical.
theological_decisions:
- issue: Tonalité de l’attention divine
  choice: Présenter l’action de Dieu comme une attention continuelle et éprouvante, ressentie comme pesante dans la plainte de Job.
  alternative: La rendre comme une sollicitude ou une visite exclusivement bienveillante.
  rationale: Le parallélisme avec « mettre à l’épreuve » et le contexte rhétorique de Job donnent à cette attention une tonalité accablante. La formulation préserve toutefois l’étendue sémantique du premier verbe au moyen d’une note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase poursuit la question rhétorique commencée au verset précédent ; « pour que » rend cette continuité syntaxique. Le tutoiement correspond à l’adresse directe de Job à Dieu.
