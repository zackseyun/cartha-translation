source:
  edition: WLC
  text: הֲֽ/יָם אָ֭נִי אִם תַּנִּ֑ין כִּֽי תָשִׂ֖ים עָלַ֣/י מִשְׁמָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/012.yaml
  text: Am I the sea[a], or a sea monster[b], that you set a guard over me?
translation:
  language: fr
  text: Suis-je la mer, ou un monstre marin[a], pour que tu établisses une surveillance sur moi[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un dragon » ou « un serpent ». Le mot hébreu tannîn désigne une grande créature menaçante, souvent associée à la mer et aux images du chaos.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour que tu postes une garde sur moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָם
  choice: Suis-je la mer
  rationale: La particule interrogative הֲ introduit une question rhétorique. « La mer » rend directement יָם et conserve l’imagerie poétique de la puissance chaotique sans imposer une personnification mythologique.
- source_word: אֲנִי
  choice: je
  rationale: Le pronom de première personne est exprimé en hébreu à des fins d’insistance; il est naturellement intégré à la tournure française « Suis-je… ? ».
- source_word: אִם
  choice: ou
  rationale: 'Dans cette double question rhétorique, אִם a une valeur disjonctive : « la mer, ou un monstre marin ».'
- source_word: תַּנִּין
  choice: un monstre marin
  rationale: תַּנִּין peut désigner une grande créature menaçante, un dragon ou un serpent. En parallèle avec « la mer », « monstre marin » est clair en français moderne et préserve l’imagerie sans préciser indûment son identité.
- source_word: כִּי
  choice: pour que
  rationale: Dans ce contexte, כִּי introduit la proposition qui motive la comparaison rhétorique. « Pour que » exprime naturellement en français le lien entre la menace supposée et la garde imposée.
- source_word: תָשִׂים
  choice: tu établisses
  rationale: Le verbe שׂים signifie mettre, placer ou établir. « Établir une garde » est une collocation française naturelle et soutenue.
- source_word: עָלַי
  choice: contre moi
  rationale: עַל peut ici exprimer une surveillance ou une mesure dirigée contre Job. « Contre moi » fait ressortir la plainte, tout en laissant en note l’autre nuance possible.
- source_word: מִשְׁמָר
  choice: une garde
  rationale: מִשְׁמָר désigne la garde, la surveillance ou la veille. « Une garde » convient à l’idée d’une mesure imposée pour contenir une menace.
theological_decisions:
- issue: Imagerie poétique de תַּנִּין et du chaos
  choice: « monstre marin », sans développer davantage l’arrière-plan mythologique
  alternative: « dragon » ou « serpent »
  rationale: Job se plaint d’être traité comme une puissance cosmique menaçante qu’il faudrait contenir. La formulation conserve cette tension poétique sans importer dans le verset un système mythologique plus élaboré.
- issue: Portée de la garde divine
  choice: « une garde contre moi »
  alternative: « une surveillance sur moi »
  rationale: 'Le texte présente sans l’atténuer la perception accusatrice de Job : Dieu le surveille ou le contient comme une menace. Il s’agit de la plainte de Job, et non d’une résolution doctrinale de cette plainte.'
translation_notes:
  register: Français international moderne, poétique et digne. La question rhétorique reste concise; « établir une garde » conserve l’idée de surveillance et de contention sans langage archaïque.
