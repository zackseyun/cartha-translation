id: JOB.7.11
reference: Job 7:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם אֲנִי֮ לֹ֤א אֶחֱשָׂ֫ךְ פִּ֥/י אֲֽ֭דַבְּרָה בְּ/צַ֣ר רוּחִ֑/י אָ֝שִׂ֗יחָה בְּ/מַ֣ר נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/011.yaml
  text: I also will not restrain my mouth[a]; I will speak in the distress of my spirit[c][b]; I will complain in the bitterness of my soul.
translation:
  language: fr
  text: Moi aussi, je ne retiendrai pas mes paroles[a] ; je parlerai dans la détresse[b] de mon esprit ; je me plaindrai[c] dans l’amertume de mon âme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je ne retiendrai pas ma bouche » ; autrement : « je ne garderai pas le silence ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans l’angoisse de mon esprit ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « je me lamenterai » ou « je parlerai ». Le verbe hébreu peut évoquer la réflexion, la parole ou la plainte selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Moi aussi
  rationale: גַּם a ici sa valeur additive habituelle. « Moi aussi » conserve cette relation sans introduire une conséquence explicite absente de l’hébreu.
- source_word: לֹא אֶחֱשָׂךְ פִּי
  choice: je ne retiendrai pas mes paroles
  rationale: L’hébreu dit littéralement que Job ne retiendra pas sa bouche. La formulation choisie exprime naturellement en français moderne le refus de contenir sa parole, tandis que la note conserve l’image corporelle originale.
- source_word: אֲדַבְּרָה
  choice: je parlerai
  rationale: L’imparfait hébreu exprime ici la résolution de Job. Le futur français rend clairement cette intention.
- source_word: בְּצַר רוּחִי
  choice: dans la détresse de mon esprit
  rationale: צַר évoque l’oppression, la détresse ou l’angoisse. « Détresse » est clair et suffisamment large, et « esprit » maintient la distinction poétique avec נֶפֶשׁ dans le membre suivant.
- source_word: אָשִׂיחָה
  choice: je me plaindrai
  rationale: Selon le contexte, שׂיח peut désigner la méditation, la parole, la lamentation ou la plainte. Ici, la souffrance et l’amertume favorisent le sens de plainte, sans effacer les autres possibilités signalées en note.
- source_word: בְּמַר נַפְשִׁי
  choice: dans l’amertume de mon âme
  rationale: La traduction conserve l’image de l’amertume et rend נֶפֶשׁ par « âme », terme naturel dans ce registre poétique et distinct de « esprit ».
theological_decisions:
- issue: Rapport entre רוּחַ et נֶפֶשׁ dans l’anthropologie poétique hébraïque
  choice: Conserver la distinction par « esprit » et « âme »
  alternative: Employer « cœur », « être intérieur » ou un même terme pour les deux
  rationale: Les deux termes sont parallèles sans être nécessairement des catégories techniques décrivant la composition de l’être humain. Les traduire distinctement préserve la texture du poème sans imposer une doctrine anthropologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est maintenu, ainsi que la distinction entre « esprit » et « âme ». L’image hébraïque de la bouche est expliquée en note afin d’éviter dans le texte principal un calque peu idiomatique.
