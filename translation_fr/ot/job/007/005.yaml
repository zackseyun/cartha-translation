  text: My flesh is clothed with worms and clods of dust; my skin hardens[a], then breaks out again.
translation:
  language: fr
  text: Ma chair est vêtue de vers et de mottes de poussière ; ma peau se durcit[a], puis se rouvre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma peau se referme, puis suppure de nouveau ». Le sens des deux derniers verbes hébreux est difficile ; ils décrivent probablement une peau qui se ferme ou se durcit brièvement avant de se rouvrir ou de se dégrader de nouveau.
    reason: alternative_reading
lexical_decisions:
- source_word: לָבַשׁ
  choice: est vêtue de
  rationale: Le verbe signifie littéralement « revêtir » ou « être vêtu ». Cette formulation conserve l’image saisissante du texte hébreu tout en restant naturelle en français.
- source_word: בְּשָׂרִי
  choice: ma chair
  rationale: « Chair » est l’équivalent direct et préserve l’accent concret mis sur le corps souffrant de Job.
- source_word: רִמָּה
  choice: vers
  rationale: Le nom désigne des vers ou larves liés à la décomposition. « Vers » garde la portée générale du terme sans préciser indûment qu’il s’agit d’asticots.
- source_word: גיש עָפָר
  choice: amas de poussière
  rationale: Le premier terme, rare et textuellement difficile, semble désigner une masse ou une motte ; « amas de poussière » évoque la terre agglutinée sur la peau sans imposer l’interprétation de croûtes.
- source_word: עוֹרִי
  choice: ma peau
  rationale: C’est le sens courant et direct du nom hébreu.
- source_word: רָגַע
  choice: se referme
  rationale: Dans ce contexte de peau malade, le verbe est probablement employé pour une plaie qui se resserre ou se ferme momentanément. Le choix reste concret, mais l’incertitude est signalée en note.
- source_word: וַיִּמָּאֵס
  choice: puis se rouvre
  rationale: Le sens exact du verbe dans ce contexte est difficile. La traduction suit l’image probable d’une peau qui, après s’être refermée, se dégrade ou s’ouvre de nouveau, sans faire de « mépriser » le sens explicite de la phrase.
