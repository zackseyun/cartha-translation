id: JOB.7.20
reference: Job 7:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָטָ֡אתִי מָ֤ה אֶפְעַ֨ל לָ/ךְ֮ נֹצֵ֪ר הָ/אָ֫דָ֥ם לָ֤/מָה שַׂמְתַּ֣/נִי לְ/מִפְגָּ֣ע לָ֑/ךְ וָ/אֶהְיֶ֖ה עָלַ֣/י לְ/מַשָּֽׂא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/020.yaml
  text: If I have sinned[a], what can I do to you, watcher of mankind? Why have you made me your target[c][b], so that I have become a burden to myself?
translation:
  language: fr
  text: Si j’ai péché[a], que puis-je te faire, toi qui surveilles les humains[b] ? Pourquoi as-tu fait de moi ta cible, au point que je suis devenu un fardeau pour moi-même[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « J’ai péché ». La phrase peut aussi être comprise comme une concession : « Même si j’ai péché » ou « Puisque j’ai péché » selon la nuance retenue.'
    reason: ambiguïté_syntaxique
  - marker: b
    text: 'Ou : « gardien de l’humanité » ou « toi qui veilles sur les humains ». Le terme hébreu peut évoquer aussi bien la garde que la surveillance attentive.'
    reason: alternative_lexicale
  - marker: c
    text: Le texte hébreu massorétique porte « un fardeau pour moi-même »; plusieurs versions anciennes reflètent « un fardeau pour toi ».
    reason: variante_textuelle
lexical_decisions:
- source_word: חָטָאתִי
  choice: Si j’ai péché
  rationale: 'La forme hébraïque signifie littéralement « j’ai péché ». Dans l’argumentation de Job, elle peut toutefois avoir une valeur concessive : il envisage le cas où il aurait péché sans nécessairement formuler ici un aveu catégorique. Le français explicite cette nuance par « si » tout en signalant la lecture littérale en note.'
- source_word: מָה אֶפְעַל לָךְ
  choice: que puis-je te faire
  rationale: Cette formulation conserve la question rhétorique portant sur ce que Job pourrait faire à Dieu. « Puis-je » rend naturellement l’idée d’impuissance implicite, sans transformer la phrase en « qu’ai-je fait ? », qui ne correspondrait pas à la forme verbale.
- source_word: נֹצֵר הָאָדָם
  choice: toi qui surveilles les humains
  rationale: נֹצֵר désigne celui qui veille, garde ou observe. Dans cette plainte, « surveilles » préserve surtout la nuance d’attention scrutatrice, tout en restant compatible avec l’idée générale de veiller. הָאָדָם est un singulier générique désignant l’humanité; le pluriel français « les humains » en restitue naturellement la portée collective.
- source_word: לָמָה שַׂמְתַּנִי לְמִפְגָּע לָךְ
  choice: Pourquoi as-tu fait de moi ta cible
  rationale: מִפְגָּע peut désigner ce qui est frappé ou exposé à une attaque. « Cible » exprime clairement et sobrement l’image, tandis que le pronom possessif « ta » rend idiomatiquement לָךְ.
- source_word: וָאֶהְיֶה עָלַי לְמַשָּׂא
  choice: au point que je suis devenu un fardeau pour moi-même
  rationale: Le texte massorétique porte עָלַי, « sur/pour moi », et conduit naturellement à « pour moi-même ». « Au point que » exprime en français le rapport de conséquence suggéré par le contexte, sans effacer la coordination hébraïque.
theological_decisions:
- issue: 'Valeur de חָטָאתִי : aveu direct ou concession rhétorique'
  choice: Si j’ai péché
  alternative: J’ai péché
  rationale: Le parfait peut être traduit formellement comme un aveu, mais le mouvement de la plainte permet une lecture concessive. La traduction principale préserve cette force argumentative, tandis que la note maintient visible la lecture grammaticale directe.
- issue: Portée générique de הָאָדָם
  choice: les humains
  alternative: l’être humain / l’humanité
  rationale: Le singulier hébreu est représentatif et non limité aux hommes de sexe masculin. Le pluriel générique est naturel en français moderne et ne tranche aucune question doctrinale.
- issue: Destinataire du « fardeau » dans la dernière proposition
  choice: pour moi-même
  alternative: pour toi
  rationale: « Pour moi-même » suit le texte massorétique עָלַי. Plusieurs témoins anciens reflètent toutefois une lecture « pour toi »; cette variante est signalée sans remplacer la lecture hébraïque reçue.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à l’adresse directe de Job à Dieu. La formulation conserve le ton audacieux de la plainte et ses ambiguïtés, sans l’adoucir ni transformer la phrase en confession doctrinale explicite.
