source:
  edition: WLC
  text: וּ/מֶ֤ה לֹא תִשָּׂ֣א פִשְׁעִ/י֮ וְ/תַעֲבִ֪יר אֶת עֲוֺ֫נִ֥/י כִּֽי עַ֭תָּה לֶ/עָפָ֣ר אֶשְׁכָּ֑ב וְ/שִׁ֖חֲרְתַּ֣/נִי וְ/אֵינֶֽ/נִּי׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/007/021.yaml
  text: Why do you not pardon my transgression and take away my iniquity? For now I will lie down in the dust[a]; you will seek me diligently[b], but I will be gone.
translation:
  language: fr
  text: Pourquoi ne pardonnes-tu pas ma transgression et n’enlèves-tu pas ma faute ? Car maintenant, je me coucherai dans la poussière ; tu me chercheras avec ardeur[a], mais je ne serai plus là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu me chercheras de bon matin ». Le verbe hébreu peut évoquer une recherche matinale, mais aussi une recherche ardente ou assidue.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: pardonnes
  rationale: Avec פשע pour complément, נשׂא signifie idiomatiquement enlever ou pardonner une faute. « Pardonnes » est naturel en français et garde la dimension relationnelle et morale.
- source_word: פִשְׁעִי
  choice: ma révolte
  rationale: פשע désigne une transgression envisagée comme rupture ou rébellion. « Ma révolte » préserve cette force et reste distinct du terme עון qui suit.
- source_word: וְתַעֲבִיר
  choice: n’enlèves
  rationale: Le hiphil de עבר signifie ici faire passer, écarter ou ôter. « Enlever » exprime clairement la suppression de la faute sans réduire le verbe à un simple oubli.
- source_word: עֲוֺנִי
  choice: ma faute
  rationale: עון peut désigner la faute, la culpabilité ou ses conséquences. « Ma faute » conserve ici l’ambiguïté morale mieux que « mon iniquité », moins courant en français moderne.
- source_word: כִּי עַתָּה
  choice: Car bientôt
  rationale: Dans ce contexte de mort imminente, עתה a une portée temporelle proche de « sous peu ». « Bientôt » rend naturellement l’enchaînement argumentatif, sans suggérer que Job repose déjà dans la poussière.
- source_word: לֶעָפָר אֶשְׁכָּב
  choice: je me coucherai dans la poussière
  rationale: La formulation conserve l’image concrète de la mortalité et de l’ensevelissement au lieu de l’expliciter par « je mourrai ».
- source_word: וְשִׁחֲרְתַּנִי
  choice: tu me chercheras avec empressement
  rationale: Le piel de שׁחר peut évoquer une recherche matinale, assidue ou empressée. Le corps du texte donne le sens contextuel probable, tandis qu’une note conserve la nuance littérale possible.
- source_word: וְאֵינֶנִּי
  choice: mais je ne serai plus là
  rationale: Littéralement « et moi, il n’y a pas », cette expression indique l’absence ou la disparition. Le futur contextuel et l’opposition sont rendus naturellement en français.
theological_decisions:
- issue: Distinction entre פשע et עון
  choice: « ma révolte » et « ma faute »
  alternative: « ma transgression » et « mon iniquité »
  rationale: Les deux termes apparentés restent distincts, sans imposer au second le seul sens de culpabilité ni employer un vocabulaire inutilement archaïque.
- issue: Image de la mort dans לֶעָפָר אֶשְׁכָּב
  choice: Conserver « je me coucherai dans la poussière »
  alternative: Traduire explicitement par « je mourrai »
  rationale: Le texte évoque poétiquement la mort et l’ensevelissement. Garder l’image respecte sa force littéraire et sa tension.
- issue: Sens de la recherche divine après la mort de Job
  choice: « tu me chercheras avec empressement » sans préciser le motif
  alternative: Interpréter la recherche comme un secours, un jugement ou un regret
  rationale: Le texte affirme que Dieu cherchera Job sans expliquer pourquoi. La traduction ne tranche donc pas cette ambiguïté théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé, ainsi que l’image concrète de la poussière. « Iniquité » a été évité comme trop marqué ou vieilli, tandis que la gravité des deux termes de faute demeure.
