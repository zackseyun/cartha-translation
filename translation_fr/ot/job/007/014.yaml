  text: then you terrify me with dreams and frighten me with visions[a].
translation:
  language: fr
  text: Alors, tu me terrifies par des rêves et tu m’épouvantes par des visions[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « tu me terrifies dans/par des rêves, et tu m’épouvantes de/à partir de visions ». Les prépositions hébraïques peuvent aussi exprimer le moyen ou la source de l’effroi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: alors
  rationale: Dans la suite de la plainte de Job, la conjonction marque ici le résultat ou la conséquence; « alors » rend ce lien plus naturellement qu’un simple « et ».
- source_word: חִתַּתַּנִי
  choice: tu me terrifies
  rationale: Le piel de חתת exprime une terreur intense. « Tu me terrifies » convient au contexte des tourments nocturnes sans imposer l’image physique de l’anéantissement.
- source_word: בַחֲלֹמוֹת
  choice: par des rêves
  rationale: La préposition ב peut indiquer ici le moyen. « Par des rêves » est naturel en français et explicite ce par quoi Job est terrifié.
- source_word: וּמֵחֶזְיֹנוֹת
  choice: et par des visions
  rationale: La préposition מן peut marquer la provenance ou, dans ce parallélisme, le moyen. « Par des visions » produit un parallélisme français fluide, tandis que la note conserve la formulation plus littérale « venant de visions ».
- source_word: תְּבַעֲתַנִּי
  choice: tu m’épouvantes
  rationale: Le piel de בעת évoque l’effroi ou l’épouvante. Ce choix maintient l’intensité du second verbe tout en évitant de répéter « terrifier ».
