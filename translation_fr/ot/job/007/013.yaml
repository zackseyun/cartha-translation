source:
  edition: WLC
  text: כִּֽי אָ֭מַרְתִּי תְּנַחֲמֵ֣/נִי עַרְשִׂ֑/י יִשָּׂ֥א בְ֝/שִׂיחִ֗/י מִשְׁכָּבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/013.yaml
  text: When I say[a], ‘My bed will comfort me[b]; my couch will bear my complaint,’
translation:
  language: fr
  text: 'Quand je me dis[a] : « Mon lit me consolera, ma couche soulagera ma plainte[b] »,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Car je me suis dit » ou « Si je me dis ». Le mot hébreu כִּי permet plusieurs lectures ici; « Quand je me dis » convient bien au contexte immédiat et à l’enchaînement avec le verset suivant.
    reason: lexical_alternative
  - marker: b
    text: Ou « ma méditation » ou « mes pensées ». Le mot hébreu שִׂיחַ peut désigner une réflexion intérieure aussi bien qu’une parole de lamentation; dans le contexte de la souffrance de Job, « plainte » est probablement le sens visé.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans le contexte immédiat, la particule introduit le moment où Job espère trouver du soulagement dans son lit. « Quand » assure naturellement l’enchaînement avec le verset suivant, tout en laissant les autres lectures possibles en note.
- source_word: אָמַרְתִּי
  choice: je me dis
  rationale: La forme hébraïque est un parfait, littéralement « j’ai dit », mais elle peut présenter ici une pensée que Job formule lorsqu’il cherche le repos. Le présent français rend naturellement cette situation répétée ou actuelle; le pronom réfléchi explicite qu’il s’agit d’un discours intérieur.
- source_word: תְּנַחֲמֵנִי
  choice: me consolera
  rationale: Le piel de נחם exprime l’action de consoler ou de réconforter. « Consolera » convient au registre digne de la lamentation et traduit directement l’espoir de Job.
- source_word: עַרְשִׂי
  choice: mon lit
  rationale: עֶרֶשׂ désigne un lit ou une couche. « Lit » est le terme français courant et permet une légère variation avec מִשְׁכָּבִי dans le second membre.
- source_word: יִשָּׂא בְשִׂיחִי
  choice: soulagera ma plainte
  rationale: נשא signifie fondamentalement « porter, soulever »; avec la préposition ב et dans ce contexte, l’expression évoque le fait d’alléger ou d’aider à porter la plainte de Job. « Soulagera ma plainte » restitue cette image d’un fardeau en français naturel.
- source_word: שִׂיחִי
  choice: ma plainte
  rationale: שִׂיחַ peut désigner une méditation, un murmure ou une plainte. Dans la lamentation de Job, « plainte » exprime le mieux la parole douloureuse, sans exclure entièrement sa dimension méditative, signalée en note.
- source_word: מִשְׁכָּבִי
  choice: ma couche
  rationale: מִשְׁכָּב désigne le lieu où l’on s’allonge. « Couche » préserve le parallélisme poétique avec « lit » sans répéter exactement le même mot.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu est conservé par « mon lit / ma couche » et « me consolera / soulagera ma plainte ». La ponctuation maintient la phrase ouverte, puisque la pensée se poursuit au verset suivant.
