id: JOB.7.9
reference: Job 7:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּלָ֣ה עָ֭נָן וַ/יֵּלַ֑ךְ כֵּ֥ן יוֹרֵ֥ד שְׁ֝א֗וֹל לֹ֣א יַעֲלֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/009.yaml
  text: As a cloud fades away and vanishes[a], so the one who goes down to Sheol does not come up.
translation:
  language: fr
  text: Comme un nuage se dissipe et disparaît, ainsi celui qui descend au shéol[a] ne remonte pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la tombe » ou « au séjour des morts ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: se dissipe
  rationale: Le verbe exprime l’idée d’arriver à son terme ou de disparaître. Avec « nuage » pour sujet, « se dissipe » rend naturellement l’image sans suggérer une destruction violente.
- source_word: עָנָן
  choice: un nuage
  rationale: Sens nominal direct; l’article indéfini convient à la comparaison générale en français.
- source_word: וַיֵּלַךְ
  choice: et disparaît
  rationale: Littéralement « et va/s’en va »; dans ce contexte, le mouvement du nuage aboutit à sa disparition. Cette formulation conserve le parallélisme avec כָּלָה.
- source_word: כֵּן
  choice: ainsi
  rationale: Introduit clairement et dignement le second terme de la comparaison.
- source_word: יוֹרֵד
  choice: celui qui descend
  rationale: Le participe substantivé désigne de manière générale la personne qui descend; la tournure française en préserve la valeur.
- source_word: שְׁאוֹל
  choice: shéol
  rationale: La translittération conserve le concept hébreu sans le réduire à la tombe ni préciser excessivement la nature du séjour des morts.
- source_word: לֹא יַעֲלֶה
  choice: ne remonte pas
  rationale: Le présent exprime ici une vérité générale et maintient l’opposition spatiale avec « descend ».
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: shéol
  alternative: la tombe; le séjour des morts
  rationale: Le terme hébreu peut évoquer la tombe ou le domaine des morts. Le conserver sous la forme « shéol » préserve cette amplitude et évite de transformer l’observation de Job sur le caractère irréversible de la mort, selon l’expérience humaine, en exposé doctrinal complet sur l’au-delà ou la résurrection.
translation_notes:
  register: Français international moderne, naturel et digne. La comparaison reste concise, avec le contraste vertical « descend / remonte ». « Shéol » est écrit avec une minuscule comme nom commun translittéré, et la note explicite ses principales possibilités de sens.
