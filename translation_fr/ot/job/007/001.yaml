source:
  edition: WLC
  text: הֲ/לֹא צָבָ֣א לֶ/אֱנ֣וֹשׁ על אָ֑רֶץ וְ/כִ/ימֵ֖י שָׂכִ֣יר יָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/001.yaml
  text: Is not man consigned to hard service on earth[a], and are not his days like those of a hired worker?
translation:
  language: fr
  text: L’être humain n’est-il pas astreint à un dur service sur la terre[a] ? Ses jours ne sont-ils pas comme ceux d’un salarié ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’être humain n’a-t-il pas à mener un combat sur la terre ? » Le mot hébreu צָבָא peut désigner le service militaire ou le combat ; ici, le parallèle avec le salarié suggère plus largement une période de service pénible et imposé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: n’est-il pas… ? / ne sont-ils pas… ?
  rationale: La particule introduit une question rhétorique qui appelle une réponse affirmative. La forme interrogative est naturelle en français et est reprise dans le second membre pour en expliciter la portée.
- source_word: צָבָא
  choice: astreint à un dur service
  rationale: Le nom peut désigner l’armée, la guerre ou une période de service imposé. Le parallèle avec le salarié oriente ici vers un service pénible et contraignant, sans exclure entièrement l’image militaire.
- source_word: אֱנוֹשׁ
  choice: l’être humain
  rationale: Le terme désigne l’humain dans sa fragilité et sa condition mortelle. Cette formulation moderne conserve la portée générique.
- source_word: עַל־אָרֶץ
  choice: sur la terre
  rationale: Rend directement l’expression locative et situe l’affirmation dans la condition humaine terrestre en général.
- source_word: וְכִימֵי
  choice: Ses jours ne sont-ils pas comme ceux de
  rationale: La comparaison hébraïque est formulée en une seconde question coordonnée, naturelle en français, tout en maintenant le parallélisme.
- source_word: שָׂכִיר
  choice: un salarié
  rationale: Désigne une personne engagée contre rémunération. « Salarié » est clair et actuel, tandis que « mercenaire » introduirait en français des connotations militaires ou péjoratives étrangères au contexte.
- source_word: יָמָיו
  choice: ses jours
  rationale: Conserve l’image temporelle concrète de l’hébreu plutôt que de la remplacer par « sa vie ».
theological_decisions: []
