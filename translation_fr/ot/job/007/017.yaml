source:
  edition: WLC
  text: מָֽה אֱ֭נוֹשׁ כִּ֣י תְגַדְּלֶ֑/נּוּ וְ/כִי תָשִׁ֖ית אֵלָ֣י/ו לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/017.yaml
  text: What is man[a], that you make so much of him[b], and that you set your heart on him?
translation:
  language: fr
  text: Qu’est-ce que l’être humain[a], pour que tu lui accordes tant d’importance[b] et que tu tournes ton cœur vers lui ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici un terme singulier qui désigne l’être humain dans sa condition mortelle ; voir Psaume 8.5.
    reason: précision_lexicale_et_renvoi
  - marker: b
    text: 'Ou : « tu le rendes grand », ou « tu l’élèves ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: מָה אֱנוֹשׁ
  choice: Qu’est-ce que l’être humain
  rationale: La question rhétorique est rendue directement. « L’être humain » conserve le singulier représentatif de אֱנוֹשׁ tout en évoquant la condition humaine mortelle et fragile dans un français actuel.
- source_word: כִּי תְגַדְּלֶנּוּ
  choice: pour que tu lui accordes tant d’importance
  rationale: Le piel de גדל signifie littéralement « rendre grand » ou « magnifier ». Ici, l’expression française traduit naturellement l’idée que Dieu donne à l’être humain une importance et une attention considérables, sans effacer les sens plus littéraux signalés en note.
- source_word: וְכִי
  choice: et que
  rationale: Cette formulation coordonne les deux membres parallèles de la même question rhétorique.
- source_word: תָשִׁית אֵלָיו לִבֶּךָ
  choice: que tu tournes ton cœur vers lui
  rationale: La tournure garde l’image anthropomorphique du cœur dirigé vers quelqu’un et exprime l’attention soutenue de Dieu sans la réduire à une abstraction.
theological_decisions:
- issue: Singulier représentatif de אֱנוֹשׁ
  choice: l’être humain
  alternative: l’homme mortel ; l’humanité
  rationale: Le singulier représentatif est conservé, ainsi que la référence à l’humanité fragile, sans transformer le texte en pluriel ni limiter artificiellement son propos au sexe masculin.
- issue: Langage anthropomorphique concernant l’attention divine
  choice: tu tournes ton cœur vers lui
  alternative: tu fixes ton attention sur lui
  rationale: Le choix retenu préserve explicitement « ton cœur », image poétique du texte hébreu, et laisse subsister toute sa portée affective, mentale et volitive.
translation_notes:
  register: Français international moderne, naturel et digne. La structure interrogative et le parallélisme poétique sont maintenus. « Tourner son cœur vers » conserve l’image hébraïque tout en restant compréhensible.
