  text: לֹא יָשׁ֣וּב ע֣וֹד לְ/בֵית֑/וֹ וְ/לֹא יַכִּירֶ֖/נּוּ ע֣וֹד מְקֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/010.yaml
  text: He does not return again to his house[a], and his place does not know him anymore.
translation:
  language: fr
  text: Il ne retournera plus dans sa maison, et son lieu ne le reconnaîtra plus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשׁוּב
  choice: retournera
  rationale: Le verbe שׁוב signifie couramment « retourner » ou « revenir ». Ici, « retournera » exprime naturellement le fait que le mort ne regagne pas sa demeure.
- source_word: עוֹד (première occurrence)
  choice: ne… plus
  rationale: Avec la négation, עוֹד marque ici la cessation définitive. En français, « ne retournera plus » est plus idiomatique que « ne retournera pas de nouveau ».
- source_word: לְבֵיתוֹ
  choice: dans sa maison
  rationale: בַּיִת désigne littéralement la maison. Avec « retourner », le français emploie naturellement « dans sa maison », tout en conservant l’image concrète de l’hébreu.
- source_word: יַכִּירֶנּוּ
  choice: ne le reconnaîtra
  rationale: Au hiphil, נכר peut signifier « reconnaître » ou « considérer comme connu ». « Reconnaître » convient à la personnification du lieu et demeure naturel en français.
- source_word: עוֹד (seconde occurrence)
  choice: ne… plus
  rationale: Dans la seconde proposition négative, עוֹד exprime également une absence désormais définitive.
- source_word: מְקֹמוֹ
  choice: le lieu où il vivait
  rationale: מָקוֹם signifie « lieu » ou « place ». L’explicitation légère « où il vivait » rend en français le lieu habituellement associé à la personne, sans le réduire nécessairement à sa seule maison.
