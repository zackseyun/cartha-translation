source:
  edition: WLC
  text: כֵּ֤ן הָנְחַ֣לְתִּי לִ֭/י יַרְחֵי שָׁ֑וְא וְ/לֵיל֥וֹת עָ֝מָ֗ל מִנּוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/003.yaml
  text: So I have been allotted months of emptiness[b][a], and nights of misery have been assigned to me.
translation:
  language: fr
  text: Ainsi, j’ai reçu en partage des mois de néant[a], et des nuits de souffrance[b] m’ont été assignées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «des mois d’inutilité», «des mois de vanité» ou «des mois de vide».
    reason: lexical_alternative
  - marker: b
    text: Ou «des nuits de peine», «de tourment» ou «de labeur».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Ainsi
  rationale: Introduit le rapprochement ou la conséquence par rapport à l’image du verset précédent, dans un français naturel et soutenu.
- source_word: הָנְחַ֣לְתִּי
  choice: j’ai reçu en partage
  rationale: La forme hophal présente Job comme celui à qui un lot est attribué. Cette formulation française garde l’idée d’une part imposée sans faire de Job l’agent de l’action.
- source_word: לִי
  choice: j’ai reçu
  rationale: Le pronom datif désigne Job comme bénéficiaire contraint; son sens est intégré idiomatiquement à la tournure «j’ai reçu en partage».
- source_word: יַרְחֵי
  choice: des mois de
  rationale: Le pluriel construit désigne une durée comptée en mois; «des mois de» est l’équivalent français direct et idiomatique.
- source_word: שָׁוְא
  choice: néant
  rationale: Le mot peut évoquer le vide, la vanité, l’inutilité ou la fausseté. Ici, «néant» exprime avec dignité le caractère creux et sans fruit de ces mois, tout en laissant les autres nuances en note.
- source_word: וְלֵיל֥וֹת
  choice: et des nuits de
  rationale: Maintient la coordination et la relation construite entre «nuits» et le nom qui suit.
- source_word: עָמָל
  choice: souffrance
  rationale: Dans cette plainte, le terme désigne plus naturellement la peine éprouvée que le travail productif. «Souffrance» reste large et compréhensible.
- source_word: מִנּוּ
  choice: m’ont été assignées
  rationale: Le passif pluriel a «nuits» pour sujet et présente celles-ci comme fixées ou attribuées à Job. L’accord féminin pluriel et le pronom datif rendent précisément la syntaxe hébraïque.
- source_word: לִי
  choice: m’
  rationale: Le datif est rendu explicitement par le pronom «m’», qui désigne Job comme celui à qui ces nuits sont assignées.
theological_decisions: []
