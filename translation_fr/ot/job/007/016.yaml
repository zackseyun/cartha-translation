  text: I despise my life[a]; I will not live forever. Leave me alone[b], for my days are a breath.
translation:
  language: fr
  text: Je méprise ma vie[a] ; je ne vivrai pas éternellement. Laisse-moi tranquille, car mes jours ne sont qu’un souffle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je le méprise », « Je le rejette » ou « J’en ai horreur ». L’hébreu ne précise pas l’objet du verbe ; « ma vie » est explicité d’après le contexte.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi évoquer la « vapeur » et souligne la brièveté ainsi que le caractère insaisissable de la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָאַסְתִּי
  choice: Je la méprise
  rationale: Le verbe signifie « rejeter, mépriser, dédaigner ». L’objet n’est pas exprimé en hébreu ; le pronom féminin « la » reprend naturellement la vie évoquée par le contexte, tout en signalant cette explicitation dans une note.
- source_word: לֹא לְעֹלָם אֶחְיֶה
  choice: je ne vivrai pas éternellement
  rationale: Cette formulation rend directement la négation, l’idée de durée indéfinie et l’imparfait hébreu, sans transformer l’affirmation de mortalité en souhait.
- source_word: חֲדַל מִמֶּנִּי
  choice: Laisse-moi tranquille
  rationale: L’impératif signifie littéralement « cesse, éloigne-toi de moi ». La tournure choisie est idiomatique en français moderne et conserve la force de la supplication de Job.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de la demande précédente ; « car » convient au registre digne du passage.
- source_word: הֶבֶל
  choice: un souffle
  rationale: Le mot évoque le souffle, la vapeur, la brièveté et le caractère insaisissable de l’existence. « Un souffle » exprime concrètement la fragilité et la courte durée des jours de Job.
- source_word: יָמָי
  choice: mes jours
  rationale: Traduction directe du pluriel avec suffixe possessif, désignant la durée de la vie de Job.
