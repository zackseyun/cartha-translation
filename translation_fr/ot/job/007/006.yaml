  text: יָמַ֣/י קַ֭לּוּ מִנִּי אָ֑רֶג וַ֝/יִּכְל֗וּ בְּ/אֶ֣פֶס תִּקְוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/006.yaml
  text: My days are swifter than a weaver’s shuttle[b][a]; they come to an end without hope.
translation:
  language: fr
  text: Mes jours passent plus vite que la navette d’un tisserand[a] ; ils s’achèvent sans espoir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens précis du mot hébreu dans cette expression est discuté. Il est traditionnellement compris ici comme désignant une navette de tisserand, image de mouvement rapide.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Mes jours
  rationale: Le pluriel muni du suffixe de première personne signifie littéralement « mes jours » et conserve l’image concrète de la durée vécue par Job.
- source_word: קַלּוּ
  choice: passent plus vite
  rationale: Le verbe exprime ici la rapidité ou la légèreté. Cette tournure française naturelle préserve la valeur comparative introduite par מִן.
- source_word: מִנִּי אָרֶג
  choice: que la navette du tisserand
  rationale: אָרֶג désigne ici un objet lié au tissage. Dans cette comparaison de vitesse, la navette fournit une image claire et traditionnelle, tout en laissant en note la portée lexicale plus générale du terme hébreu.
- source_word: וַיִּכְלוּ
  choice: ils s’achèvent
  rationale: כלה signifie parvenir à son terme, être consumé ou achevé. « Ils s’achèvent » rend avec concision la fin des jours de Job.
- source_word: בְּאֶפֶס תִּקְוָה
  choice: sans espoir
  rationale: אֶפֶס indique ici l’absence, et תִּקְוָה l’espoir. « Sans espoir » est une formulation française directe et fidèle.
