  yaml_path: translation/ot/job/007/007.yaml
  text: Remember that my life is a breath[b][a]; my eye will not return to see good.
translation:
  language: fr
  text: Souviens-toi que ma vie n’est qu’un souffle[a] ; mon œil ne verra plus le bien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’est que du vent ». Le mot hébreu רוּחַ peut signifier « souffle », « vent » ou « esprit » ; ici, il souligne le caractère fugitif de la vie.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « mon œil ne retournera pas voir le bien ». « Le bien » peut désigner le bien-être ou la prospérité.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Souviens-toi
  rationale: Impératif qal masculin singulier de זכר, adressé à Dieu dans le contexte. Cette formulation directe conserve la force de la supplication sans ajouter de terme absent de l’hébreu.
- source_word: כִּי
  choice: que
  rationale: Introduit ici le contenu de ce dont Dieu doit se souvenir ; « que » est la tournure française naturelle après « Souviens-toi ».
- source_word: רוּחַ
  choice: un souffle
  rationale: Dans cette lamentation, רוּחַ évoque le caractère fugitif et fragile de la vie. « Un souffle » rend naturellement cette image en français, tout en signalant en note l’autre image possible, « vent ».
- source_word: חַיָּי
  choice: ma vie
  rationale: Le nom avec suffixe de première personne désigne la vie du locuteur ; « ma vie » est l’équivalent français clair et idiomatique.
- source_word: לֹא תָשׁוּב ... לִרְאוֹת
  choice: ne reverra pas
  rationale: La construction signifie littéralement que l’œil « ne retournera pas voir ». Le verbe français « revoir » exprime avec naturel l’idée de ne plus voir de nouveau, sans alourdir le vers.
- source_word: עֵינִי
  choice: mon œil
  rationale: Le texte hébreu emploie le singulier. Le conserver respecte l’image poétique et l’évocation de la perception personnelle.
- source_word: טוֹב
  choice: le bonheur
  rationale: Dans ce contexte, טוֹב désigne le bien dont on fait l’expérience, le bien-être ou des jours heureux. « Le bonheur » est naturel en français ; une note conserve l’étendue sémantique vers « le bien » et « la prospérité ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et poétique. Le singulier « mon œil » conserve l’image hébraïque, tandis que « ne reverra pas » rend idiomatiquement la construction verbale. La tournure « n’est qu’un souffle » explicite la valeur métaphorique de la proposition nominale sans en modifier le sens.
