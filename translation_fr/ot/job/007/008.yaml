  text: לֹֽא תְ֭שׁוּרֵ/נִי עֵ֣ין רֹ֑אִי עֵינֶ֖י/ךָ בִּ֣/י וְ/אֵינֶֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/008.yaml
  text: The eye of the one who sees me will no longer behold me[a]; your eyes will be on me[b], but I will be gone.
translation:
  language: fr
  text: L’œil de celui qui me voit ne m’apercevra plus[a] ; tes yeux seront sur moi[b], mais je ne serai plus là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’œil qui me voit ne me verra pas. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tes yeux sont sur moi, et moi, je ne suis pas » ; autrement dit, quand tu me chercheras du regard, je ne serai plus là.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְשׁוּרֵנִי
  choice: ne m’apercevra plus
  rationale: Le verbe שׁור exprime ici le fait de regarder ou d’apercevoir. « Apercevoir » conserve le champ visuel tout en restant naturel en français ; avec la négation et le contexte, l’inaccompli reçoit une valeur future.
- source_word: עֵין רֹאִי
  choice: L’œil de celui qui me voit
  rationale: Cette formulation garde l’image concrète de l’œil et rend avec transparence la construction hébraïque « l’œil de celui qui me voit ».
- source_word: לֹא
  choice: ne… plus
  rationale: La négation simple est comprise dans le contexte comme la cessation prochaine du fait de voir Job. Une note conserve la possibilité d’une traduction plus strictement formelle par « ne… pas ».
- source_word: עֵינֶיךָ
  choice: tes yeux
  rationale: Le pluriel hébreu est maintenu, ainsi que l’expression anthropomorphique adressée directement à Dieu dans le contexte.
- source_word: בִּי
  choice: sur moi
  rationale: Après « tes yeux », « sur moi » traduit directement la préposition ב et exprime une attention dirigée vers Job sans expliciter davantage l’image.
- source_word: וְאֵינֶנִּי
  choice: mais je ne serai plus là
  rationale: Littéralement « et moi, je ne suis pas ». Dans ce contexte orienté vers l’avenir, la formule exprime la disparition ou l’absence de Job ; « je ne serai plus là » rend naturellement cet idiome sans préciser s’il s’agit seulement d’une disparition ou de la mort.
theological_decisions:
- issue: Référent de « tes yeux »
  choice: Dieu, à qui Job s’adresse directement
  alternative: Un observateur humain pris à partie de manière générique
  rationale: Le contexte immédiat présente Job s’adressant à Dieu. La traduction maintient toutefois le simple pronom de deuxième personne et n’ajoute pas « ô Dieu », absent de l’hébreu.
- issue: Portée de « je ne serai plus là »
  choice: Maintenir l’idée d’absence ou de disparition sans en préciser la nature
  alternative: Expliciter la mort de Job
  rationale: L’expression hébraïque peut évoquer la disparition et, dans le contexte, la mort prochaine, mais le verset ne formule pas explicitement cette dernière. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, sobre et poétique. « Apercevoir » apporte une légère élévation sans archaïsme ; la répétition de « œil / yeux » conserve le parallélisme et l’image de l’hébreu.
