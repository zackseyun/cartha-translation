  text: כְּ/עֶ֥בֶד יִשְׁאַף צֵ֑ל וּ֝/כְ/שָׂכִ֗יר יְקַוֶּ֥ה פָעֳלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/002.yaml
  text: Like a servant who longs for shade[a], and like a hired worker who waits for his wages[c][b],
translation:
  language: fr
  text: 'Comme un esclave qui aspire à l’ombre,

    comme un salarié qui attend son salaire,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּעֶבֶד
  choice: comme un esclave
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Ici, l’image du travail pénible et de la dépendance sociale donne davantage de force à « esclave ».
- source_word: יִשְׁאַף
  choice: qui aspire à
  rationale: Le verbe שׁאף exprime un désir intense, parfois l’idée de haleter. « Aspirer à » restitue ce vif désir dans un français naturel et digne.
- source_word: צֵל
  choice: l’ombre
  rationale: Dans le contexte d’un travail éprouvant sous la chaleur, צֵל désigne l’ombre qui apporte du soulagement.
- source_word: וּכְשָׂכִיר
  choice: comme un salarié
  rationale: שָׂכִיר désigne une personne engagée contre rémunération. « Salarié » rend clairement cette relation économique en français moderne.
- source_word: יְקַוֶּה
  choice: qui attend
  rationale: קוה peut signifier attendre ou espérer. Puisqu’il s’agit de la rémunération due au travailleur, « attend » exprime ici l’attente confiante et concrète.
- source_word: פָעֳלוֹ
  choice: son salaire
  rationale: פֹּעַל peut renvoyer au travail, à son produit ou à sa rétribution. Avec שָׂכִיר, le sens contextuel est la rémunération du travail.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu est conservé, ainsi que l’intensité de l’attente. « Esclave » préserve la dureté sociale de l’image; « salarié » est plus courant et immédiatement intelligible que « journalier », sans préciser au-delà de l’hébreu la durée de l’embauche.
