  text: אִם שָׁכַ֗בְתִּי וְ/אָמַ֗רְתִּי מָתַ֣י אָ֭קוּם וּ/מִדַּד עָ֑רֶב וְ/שָׂבַ֖עְתִּי נְדֻדִ֣ים עֲדֵי נָֽשֶׁף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/004.yaml
  text: When I lie down[a], I say, ‘When will I arise?’ But the evening drags on[c][b], and I am full of tossing until dawn.
translation:
  language: fr
  text: 'Quand je me couche[a], je me dis : « Quand me lèverai-je ? » Mais le soir n’en finit pas[b], et je suis rassasié de me retourner jusqu’à l’aube[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Si je me couche ». La particule hébraïque peut exprimer une condition, mais elle introduit probablement ici une situation qui se répète : « Quand je me couche ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « et le soir est mesuré ». L’expression semble décrire un soir qui se prolonge lentement.
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu peut désigner le crépuscule du soir ou celui du matin ; il renvoie probablement ici à l’aube.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Quand
  rationale: Bien que la particule signifie souvent « si », elle peut introduire ici une circonstance récurrente. « Quand » exprime naturellement l’épreuve que Job revit chaque nuit.
- source_word: שָׁכַבְתִּי וְאָמַרְתִּי
  choice: je me couche, je me dis
  rationale: Les formes accomplies ont ici une valeur habituelle ou itérative. Le présent français rend clairement cette expérience répétée.
- source_word: מָתַי אָקוּם
  choice: Quand me lèverai-je ?
  rationale: קום désigne ici le fait de se lever après avoir été couché. La formulation conserve la dignité et l’impatience de la plainte.
- source_word: וּמִדַּד עָרֶב
  choice: Mais le soir n’en finit pas
  rationale: L’expression associe le soir au verbe « mesurer » et évoque vraisemblablement sa durée qui semble interminable. Cette tournure française en restitue l’effet vécu sans remplacer « soir » par « nuit ».
- source_word: וְשָׂבַעְתִּי
  choice: je suis rassasié de
  rationale: Le verbe שבע signifie être rassasié ou avoir son plein de quelque chose. La traduction conserve l’image hébraïque, ici chargée d’une valeur pénible.
- source_word: נְדֻדִים
  choice: agitation
  rationale: Le nom évoque des mouvements répétés et une instabilité nocturne. « Agitation » couvre à la fois l’absence de repos et le fait de se retourner.
- source_word: עֲדֵי נָשֶׁף
  choice: jusqu’à l’aube
  rationale: נָשֶׁף peut désigner le crépuscule du soir ou celui du matin. Dans le déroulement de cette nuit d’insomnie, il s’agit vraisemblablement du crépuscule matinal, donc de l’aube.
