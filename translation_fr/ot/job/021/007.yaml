  text: מַדּ֣וּעַ רְשָׁעִ֣ים יִחְי֑וּ עָ֝תְק֗וּ גַּם גָּ֥בְרוּ חָֽיִל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/007.yaml
  text: Why do the wicked live on[a], grow old, and even become mighty in wealth?
translation:
  language: fr
  text: Pourquoi les méchants restent-ils en vie, vieillissent-ils et deviennent-ils même puissants[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deviennent-ils même riches ». Le mot hébreu peut désigner la puissance, la richesse, les ressources ou la force militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Introduit directement la question de protestation de Job, sans ajout explicatif.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Désigne naturellement, dans la littérature de sagesse, les personnes moralement mauvaises plutôt que de simples coupables au sens juridique.
- source_word: יִחְיוּ
  choice: restent en vie
  rationale: L’imparfait exprime ici la continuation de leur vie malgré le jugement auquel on pourrait s’attendre.
- source_word: עָתְקוּ
  choice: vieillissent
  rationale: Dans cette progression, le verbe évoque probablement le fait d’avancer en âge; cette formulation française est concise et naturelle.
- source_word: גַּם
  choice: et… même
  rationale: 'Marque une intensification: non seulement ils vivent et vieillissent, mais ils accèdent encore à la puissance et à la prospérité.'
- source_word: גָּבְרוּ
  choice: deviennent… puissants
  rationale: Rend l’idée d’un accroissement de force ou de puissance.
- source_word: חָיִל
  choice: par leurs richesses
  rationale: Dans ce contexte consacré à la prospérité des méchants, le terme peut désigner leurs biens ou ressources, tout en gardant un sens possible de force ou de puissance.
theological_decisions:
- issue: La prospérité durable des méchants
  choice: La question demeure une protestation ouverte, sans explication ajoutée.
  alternative: Reformuler de manière à suggérer une permission ou une finalité divine.
  rationale: L’hébreu exprime la tension sapientielle sans la résoudre dans ce verset.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe interrogative conserve l’intensification du texte hébreu et la note maintient l’ambiguïté de חָיִל.
