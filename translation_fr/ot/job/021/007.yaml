review_pass:
  verdict: revise
  source_fidelity: 'Le mouvement du verset est bien rendu : question de protestation, survie des méchants, avancée en âge, puis accroissement de leur puissance. Toutefois, « puissants par leurs richesses » introduit un lien causal (« par ») qui n’est pas exprimé par l’hébreu. Le syntagme גָּבְרוּ חָיִל est suffisamment large pour évoquer puissance, ressources ou richesse; il convient de ne pas fixer la richesse comme moyen causal.'
  naturalness: La double interrogation verbale est naturelle et soutenue en français moderne. La suppression de la virgule avant « et » rend l’enchaînement plus fluide. « Deviennent même puissants » est idiomatique et laisse à la note le soin d’expliciter l’éventuelle nuance de richesse.
  terminology: « Les méchants » est le rendu usuel et approprié de רְשָׁעִים dans ce contexte sapientiel. « Restent en vie » traduit adéquatement la durée suggérée par יִחְיוּ; « vieillissent » rend naturellement עָתְקוּ. La note doit présenter les valeurs lexicales possibles de חָיִל sans proposer l’expression française peu naturelle « puissants en force ».
  issues:
  - severity: medium
    issue: « par leurs richesses » ajoute une relation causale
    rationale: Le texte hébreu ne dit pas que les méchants deviennent puissants au moyen de leurs richesses. Il affirme leur accroissement en relation avec חָיִל, terme qui peut désigner puissance, ressources ou richesse.
  - severity: low
    issue: 'Formulation de note peu idiomatique : « puissants en force »'
    rationale: Cette tournure ne constitue pas une alternative française naturelle et ne reflète pas clairement l’ambiguïté lexicale du terme hébreu.
  revised_text: Pourquoi les méchants restent-ils en vie, vieillissent-ils et deviennent-ils même puissants[a] ?
  revised_footnotes:
