  to: Pourquoi les méchants restent-ils en vie, vieillissent-ils et deviennent-ils même puissants[a] ?
  rationale: La révision retire l’implication causale absente du texte source tout en conservant la progression rhétorique et l’ambiguïté de חָיִל. La note fournit une alternative française naturelle et explique les principales nuances possibles.
