  text: וְ/זֶ֗ה יָ֭מוּת בְּ/נֶ֣פֶשׁ מָרָ֑ה וְ/לֹֽא אָ֝כַ֗ל בַּ/טּוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/025.yaml
  text: while another dies with a bitter soul and has not enjoyed good[a].
translation:
  language: fr
  text: tandis qu’un autre meurt l’âme amère, sans avoir goûté au bonheur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et celui-ci meurt dans l’amertume de l’âme, sans avoir mangé de ce qui est bon » ; l’hébreu conserve l’image de la nourriture pour évoquer l’expérience des biens de la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה
  choice: tandis qu’un autre
  rationale: Dans le contexte, le démonstratif introduit un second cas opposé à celui du verset précédent. Cette formulation rend naturellement le contraste en français, sans effacer la mise en parallèle.
- source_word: יָמוּת
  choice: meurt
  rationale: L’imparfait hébreu décrit ici un cas général dans une comparaison poétique, plutôt qu’une prédiction strictement future.
- source_word: בְּ/נֶפֶשׁ מָרָה
  choice: l’âme amère
  rationale: Cette expression conserve נֶפֶשׁ, qui désigne ici l’être intérieur, ainsi que l’image forte de l’amertume, tout en restant concise et digne en français.
- source_word: וְ/לֹא אָכַל
  choice: sans avoir goûté
  rationale: Le verbe signifie littéralement « manger », mais exprime ici le fait d’avoir part au bien. « Goûter » garde l’image alimentaire tout en rendant naturellement le sens expérientiel.
- source_word: בַּ/טּוֹבָה
  choice: au bonheur
  rationale: Le nom peut désigner le bien, le bien-être ou la prospérité. « Bonheur » convient à l’expérience générale des biens de la vie sans limiter le sens à la richesse matérielle.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme contrastif est rendu avec fluidité, tandis que l’image hébraïque de la consommation reste perceptible dans « goûté » et explicitée en note.
