  text: His bull breeds and does not fail[a]; his cow calves and does not miscarry.
translation:
  language: fr
  text: Son taureau saillit et ne connaît pas d’échec[a] ; sa vache met bas sans perdre son petit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « et ne rejette pas » ou « et ne rend pas stérile ». Le verbe hébreu est difficile ici ; le texte principal rend le sens suggéré par le parallélisme : la saillie du taureau est efficace, et non infructueuse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרוֹ
  choice: son taureau
  rationale: שׁוֹר désigne un bovin ; dans ce contexte de reproduction, « taureau » précise naturellement qu’il s’agit du mâle reproducteur.
- source_word: עִבַּר
  choice: féconde
  rationale: Dans ce contexte, le verbe exprime l’action reproductrice efficace du mâle. « Féconde » est clair, précis et naturel en français.
- source_word: וְלֹא יַגְעִל
  choice: sans faillir
  rationale: Le sens du verbe est difficile ici. Le parallélisme indique que la saillie aboutit et n’est pas infructueuse ; « sans faillir » conserve une certaine généralité sans imposer un sens technique incertain.
- source_word: תְּפַלֵּט
  choice: met bas
  rationale: Le piel de פלט désigne ici la mise au monde d’un petit. « Met bas » est l’expression française courante et appropriée pour une vache.
- source_word: פָּרָתוֹ
  choice: sa vache
  rationale: פָּרָה désigne normalement une vache ; rien dans le texte n’impose le sens plus précis de « génisse ».
- source_word: וְלֹא תְשַׁכֵּל
  choice: sans perdre son petit
  rationale: שׁכל exprime la privation ou la perte de la progéniture. Dans ce contexte, cette formulation couvre naturellement la perte du veau sans limiter indûment le sens au seul avortement.
