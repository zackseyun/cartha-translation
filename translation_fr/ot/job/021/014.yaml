  text: וַ/יֹּאמְר֣וּ לָ֭/אֵל ס֣וּר מִמֶּ֑/נּוּ וְ/דַ֥עַת דְּ֝רָכֶ֗י/ךָ לֹ֣א חָפָֽצְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/014.yaml
  text: Yet they say to God[a], ‘Depart from us, and we do not desire the knowledge of your ways.’
translation:
  language: fr
  text: 'Pourtant, ils disent à Dieu : « Éloigne-toi de nous[a] ! Nous ne voulons pas connaître tes voies. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Détourne-toi de nous » ou « Va-t’en loin de nous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Pourtant, ils disent
  rationale: Le contexte oppose la prospérité des méchants à leur rejet de Dieu. Le présent exprime naturellement en français leur attitude caractéristique, tandis que « Pourtant » explicite la valeur adversative contextuelle du waw.
- source_word: לָאֵל
  choice: à Dieu
  rationale: אֵל désigne ici Dieu de manière courante plutôt qu’un nom propre à translittérer.
- source_word: סוּר מִמֶּנּוּ
  choice: Éloigne-toi de nous
  rationale: L’impératif סוּר avec מִן demande directement à Dieu de se retirer. Cette formulation française est nette, naturelle et conserve la force de l’ordre.
- source_word: וְדַעַת דְּרָכֶיךָ
  choice: connaître tes voies
  rationale: La tournure verbale est plus naturelle en français que « la connaissance de tes voies » tout en conservant le sens de דַּעַת. « Tes voies » peut désigner la manière d’agir de Dieu aussi bien que ses exigences morales.
- source_word: לֹא חָפָצְנוּ
  choice: Nous ne voulons pas
  rationale: חפץ exprime ici le désir ou la volonté. « Ne voulons pas » rend clairement le refus volontaire sans lui ajouter une nuance affective excessive.
theological_decisions:
- issue: La parole des méchants adressée à Dieu
  choice: 'Maintien de l’adresse directe : « Éloigne-toi de nous ! »'
  alternative: Paraphrase indirecte telle que « Laisse-nous tranquilles »
  rationale: L’hébreu présente un impératif brutal directement adressé à Dieu. Le conserver préserve le caractère choquant de la rébellion humaine sans l’atténuer.
- issue: Rapport entre le rejet de Dieu et le refus de connaître ses voies
  choice: Deux phrases successives sans lien causal ajouté
  alternative: « car nous ne voulons pas connaître tes voies »
  rationale: Le waw hébreu relie les propositions sans préciser formellement une relation causale. La ponctuation française conserve ce parallélisme et laisse ouverte la nuance logique.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à la deuxième personne du singulier hébraïque dans l’adresse à Dieu. La formulation privilégie une équivalence optimale et évite le tour peu idiomatique « la connaissance de tes voies ».
