  text: מִֽי יַגִּ֣יד עַל פָּנָ֣י/ו דַּרְכּ֑/וֹ וְ/הֽוּא עָ֝שָׂ֗ה מִ֣י יְשַׁלֶּם לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/031.yaml
  text: Who declares his way to his face? And for what he has done[b][a], who repays him?
translation:
  language: fr
  text: Qui lui reproche sa conduite en face ? Et pour ce qu’il a fait[a], qui le rétribue ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très concis : « et lui, il a fait ; qui le rétribue ? » Le texte peut se comprendre : « quant à ce qu’il a fait, qui le rétribue ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif introduit dans les deux membres une question rhétorique dont la forme doit être conservée.
- source_word: יַגִּיד
  choice: reproche
  rationale: Le hiphil de נגד signifie « déclarer, faire connaître » ; dans la construction avec « en face » et dans ce contexte de confrontation, « reprocher » exprime naturellement en français le fait d’exposer directement à quelqu’un sa conduite.
- source_word: עַל־פָּנָיו
  choice: en face
  rationale: L’expression, littéralement « sur sa face », désigne une confrontation directe en présence de la personne. « En face » est idiomatique et conserve cette nuance.
- source_word: דַּרְכּוֹ
  choice: sa conduite
  rationale: דֶּרֶךְ, « chemin », désigne ici figurativement la manière d’agir. « Sa conduite » rend ce sens clairement sans introduire une interprétation supplémentaire.
- source_word: וְהוּא עָשָׂה
  choice: Et ce qu’il a fait
  rationale: L’hébreu est elliptique, littéralement « et lui, il a fait ». La formulation française explicite le rapport probable avec la rétribution tout en signalant l’ellipse dans une note.
- source_word: יְשַׁלֶּם לוֹ
  choice: qui le lui rend
  rationale: Le piel de שלם exprime ici la rétribution, le fait de rendre à quelqu’un selon ses actes. Cette formulation française garde la force rétributive et le pronom indirect לוֹ.
theological_decisions:
- issue: Nature de la rétribution dans le second membre
  choice: « qui le lui rend ? »
  alternative: « qui lui fait payer ce qu’il a fait ? »
  rationale: La formulation retenue préserve la possibilité d’une rétribution sans préciser indûment qu’il s’agit d’un châtiment judiciaire ni identifier celui qui l’exercerait.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme des deux questions rhétoriques est conservé. « En face » rend l’idée de confrontation immédiate ; « conduite » clarifie la métaphore hébraïque du chemin.
