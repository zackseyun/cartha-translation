    issue: Ambiguïté de « qui le lui rend ? »
    rationale: Avec deux pronoms, cette expression ne communique pas clairement l’idée de rétribution envers la personne pour ses actes. Elle peut se lire comme « qui rend cela à lui », ce qui affaiblit la force judiciaire/rétributive du verbe hébreu.
