  text: יַ֭חַד עַל עָפָ֣ר יִשְׁכָּ֑בוּ וְ֝/רִמָּ֗ה תְּכַסֶּ֥ה עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/026.yaml
  text: Together they lie down in the dust[a], and worms cover them.
translation:
  language: fr
  text: Ensemble, ils se couchent dans la poussière, et les vers les recouvrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחַד
  choice: Ensemble
  rationale: L’adverbe souligne le sort commun des deux personnes opposées dans le contexte. « Ensemble » conserve cette insistance sans expliquer davantage.
- source_word: עַל עָפָר
  choice: dans la poussière
  rationale: Bien que עַל signifie normalement « sur », l’expression associée au fait de se coucher dans un contexte de mort évoque idiomatiquement l’ensevelissement dans la poussière.
- source_word: יִשְׁכָּבוּ
  choice: ils se couchent
  rationale: Le présent français exprime ici l’issue générale décrite par Job. « Se couchent » maintient l’image concrète de la mort sans la remplacer par l’interprétation « reposent ».
- source_word: רִמָּה
  choice: les vers
  rationale: Le nom désigne des vers, notamment ceux associés à la décomposition. « Les vers » est naturel en français et suffisamment large; « les asticots » serait possible, mais plus précis et plus cru.
- source_word: תְּכַסֶּה
  choice: recouvrent
  rationale: Le singulier hébreu s’accorde avec un nom collectif, tandis que le français emploie naturellement le pluriel avec « les vers ». « Recouvrent » restitue clairement l’image d’un enveloppement complet.
- source_word: עֲלֵיהֶם
  choice: les
  rationale: La valeur de la préposition est intégrée naturellement au verbe français « recouvrir quelqu’un », évitant le tour moins idiomatique « recouvrir sur eux ».
