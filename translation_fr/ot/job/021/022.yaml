source:
  edition: WLC
  text: הַ/לְ/אֵ֥ל יְלַמֶּד דָּ֑עַת וְ֝/ה֗וּא רָמִ֥ים יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/022.yaml
  text: Can anyone teach God knowledge[a], since he judges those on high?
translation:
  language: fr
  text: 'Peut-on enseigner la connaissance à Dieu,

    puisque c’est lui qui juge ceux qui sont élevés[a] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les êtres d’en haut » ; peut-être « les êtres célestes ».
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְאֵל
  choice: Peut-on … à Dieu
  rationale: La particule interrogative introduit une question rhétorique. Le pronom indéfini « on » restitue naturellement en français le sujet implicite, tandis que « à Dieu » conserve la construction avec לְ.
- source_word: יְלַמֶּד
  choice: enseigner
  rationale: Le piel de למד signifie couramment « enseigner, instruire ». « Enseigner » convient à la construction avec la chose enseignée et son destinataire.
- source_word: דָּעַת
  choice: la connaissance
  rationale: Le nom désigne la connaissance ou le savoir. « La connaissance » conserve ici le nom abstrait hébreu.
- source_word: וְהוּא
  choice: puisque c’est lui qui
  rationale: Dans le contexte, la proposition appuie la question rhétorique. « Puisque » rend ce rapport logique, et la tournure emphatique « c’est lui qui » reflète le pronom explicite הוּא.
- source_word: רָמִים
  choice: ceux qui sont haut placés
  rationale: L’adjectif substantivé au pluriel désigne des êtres ou des personnes élevés. Cette formulation reste assez large pour ne pas trancher entre puissants terrestres et êtres célestes.
- source_word: יִשְׁפּוֹט
  choice: juge
  rationale: Le qal de שפט signifie directement « juger ». Ce choix conserve l’idée de l’autorité judiciaire suprême de Dieu.
theological_decisions:
- issue: Référent de רָמִים
  choice: ceux qui sont haut placés
  alternative: les êtres célestes ; les grands ou les puissants
  rationale: L’hébreu permet un référent large. Le texte souligne que Dieu juge même les êtres élevés, sans préciser s’il s’agit de puissants terrestres ou d’êtres célestes ; la traduction maintient cette ambiguïté.
translation_notes:
  register: Français moderne, naturel et digne. La question rhétorique est conservée, de même que l’ambiguïté du référent de רָמִים. Le marqueur [a] figure dans le texte principal.
