  text: בָּתֵּי/הֶ֣ם שָׁל֣וֹם מִ/פָּ֑חַד וְ/לֹ֤א שֵׁ֖בֶט אֱל֣וֹהַּ עֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/009.yaml
  text: Their houses are safe from fear[b][a], and the rod of God is not upon them.
translation:
  language: fr
  text: Leurs maisons sont à l’abri de toute crainte[a], et le bâton de Dieu[b] ne vient pas sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Leurs foyers sont à l’abri de la peur ».
    reason: lexical_alternative
  - marker: b
    text: Le « bâton de Dieu » est une image qui peut évoquer son coup, sa correction ou l’affliction.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּתֵּיהֶם
  choice: leurs maisons
  rationale: Le pluriel construit de בַּיִת désigne littéralement leurs maisons. Dans ce contexte, il peut aussi englober les foyers ou maisonnées, mais « maisons » conserve l’image concrète de l’hébreu.
- source_word: שָׁלוֹם מִפָּחַד
  choice: sont en sécurité, à l’abri de la peur
  rationale: שָׁלוֹם exprime ici un état de paix et de sécurité, tandis que מִפָּחַד indique l’absence de peur ou de menace redoutée. Cette formulation française rend les deux éléments sans les confondre.
- source_word: שֵׁבֶט
  choice: bâton
  rationale: שֵׁבֶט peut désigner un bâton, une verge, un sceptre ou un instrument servant à frapper. « Bâton » conserve ici la métaphore sans préciser indûment s’il s’agit de châtiment, de correction ou d’épreuve.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: אֱלוֹהַּ est une forme poétique singulière courante pour désigner Dieu dans le livre de Job. « Dieu » en est l’équivalent direct.
- source_word: עֲלֵיהֶם
  choice: ne s’abat pas sur eux
  rationale: Littéralement, le bâton n’est pas « sur eux ». En français, « ne s’abat pas sur eux » rend naturellement l’image d’un instrument de frappe venant contre quelqu’un tout en maintenant la métaphore.
theological_decisions:
- issue: Nature de l’action divine évoquée par « le bâton de Dieu »
  choice: Conserver la métaphore du bâton sans définir précisément l’action divine.
  alternative: le châtiment de Dieu ; la correction de Dieu ; le fléau de Dieu
  rationale: La métaphore hébraïque peut évoquer un coup, une correction, un châtiment ou plus largement une affliction venant de Dieu. Une formulation plus précise éliminerait une ambiguïté réelle du texte.
translation_notes:
  register: Français moderne, clair et digne. « Maisons » préserve l’image concrète, tandis que la note signale le sens élargi possible de « foyers ». « Ne s’abat pas sur eux » évite le calque peu naturel « n’est pas sur eux » sans supprimer la métaphore poétique.
