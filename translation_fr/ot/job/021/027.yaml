  text: הֵ֣ן יָ֭דַעְתִּי מַחְשְׁבֽוֹתֵי/כֶ֑ם וּ֝/מְזִמּ֗וֹת עָלַ֥/י תַּחְמֹֽסוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/027.yaml
  text: Look[a], I know your thoughts, and the schemes with which you would wrong me.
translation:
  language: fr
  text: 'Eh bien, je connais vos pensées

    et les manœuvres que vous préparez contre moi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « et les complots que vous tramez contre moi » ou « et les projets violents que vous formez contre moi ». Le verbe hébreu peut évoquer la violence, l’oppression ou le fait de léser quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: Marque ici une affirmation insistante attirant l’attention. « Oui » conserve cette force dans un français actuel et digne, sans l’archaïsme de « Voici » dans cet emploi.
- source_word: יָדַעְתִּי
  choice: je connais
  rationale: Le parfait qal à la première personne exprime ici un savoir présent; « je connais » est naturel en français.
- source_word: מַחְשְׁבוֹתֵיכֶם
  choice: vos pensées
  rationale: Le nom peut désigner pensées, intentions ou desseins. « Pensées » reste proche de l’hébreu, tandis que le membre parallèle en précise la portée hostile.
- source_word: וּמְזִמּוֹת
  choice: et les projets
  rationale: Le terme évoque ici des desseins calculés. « Projets » est naturel et laisse le verbe suivant exprimer leur caractère malveillant sans ajouter explicitement « mauvais ».
- source_word: עָלַי
  choice: à me
  rationale: Avec le verbe חמס, la préposition introduit la personne visée par l’action hostile; la tournure française « me faire du tort » en rend idiomatiquement la fonction.
- source_word: תַּחְמֹסוּ
  choice: vous cherchez à me faire du tort
  rationale: Le verbe peut signifier exercer de la violence, opprimer ou léser. Dans ce contexte de projets hostiles contre Job, « chercher à faire du tort » communique l’intention et l’injustice sans imposer une violence nécessairement physique.
