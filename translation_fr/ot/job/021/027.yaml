    rationale: « Oui » répond ou acquiesce normalement à une assertion ou à une question ; il ne reproduit qu’imparfaitement la valeur présentative/emphatique de הֵן. « Eh bien » rend plus naturellement l’introduction insistante dans ce contexte.
  - severity: low
