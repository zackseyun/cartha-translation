  yaml_path: translation/ot/job/021/006.yaml
  text: When I remember, I am dismayed, and trembling seizes my flesh.
translation:
  language: fr
  text: Quand je m’en souviens, je suis épouvanté, et un frisson saisit ma chair.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Quand
  rationale: Dans ce contexte, la construction introduit la réaction qui se produit lorsque Job se souvient; « quand » exprime naturellement cette valeur temporelle en français, sans alourdir la phrase par un « si » peu idiomatique.
- source_word: זָכַרְתִּי
  choice: je m’en souviens
  rationale: Le verbe signifie « se souvenir ». Le pronom « en » reprend naturellement en français l’objet de la pensée développé dans le contexte.
- source_word: וְנִבְהָלְתִּי
  choice: je suis épouvanté
  rationale: Le niphal de בהל exprime ici un profond effroi ou bouleversement; « épouvanté » garde la force du terme.
- source_word: פַּלָּצוּת
  choice: un frisson
  rationale: Le nom désigne un tremblement ou frisson provoqué par l’effroi. « Un frisson » est actuel et s’accorde avec l’image corporelle.
- source_word: אָחַז בְּשָׂרִי
  choice: saisit ma chair
  rationale: 'Rendu direct de l’image hébraïque: le frisson s’empare de la chair de Job.'
