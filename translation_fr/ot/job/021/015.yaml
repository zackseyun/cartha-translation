source:
  edition: WLC
  text: מַה שַׁדַּ֥י כִּֽי נַֽעַבְדֶ֑/נּוּ וּ/מַה נּ֝וֹעִ֗יל כִּ֣י נִפְגַּע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/015.yaml
  text: What is the Almighty[a], that we should serve him? And what would we gain if we entreat him?
translation:
  language: fr
  text: Qu’est donc le Tout-Puissant pour que nous le servions ? Et que gagnerions-nous à le supplier ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה שַׁדַּי
  choice: Qu’est donc le Tout-Puissant
  rationale: מַה introduit ici une question rhétorique dédaigneuse sur l’importance ou l’intérêt de servir Dieu. « Qu’est donc » en restitue naturellement la force, tandis que « le Tout-Puissant » traduit le titre divin שַׁדַּי.
- source_word: כִּי נַעַבְדֶנּוּ
  choice: pour que nous le servions
  rationale: Dans cette construction, כִּי relie la question rhétorique à la conséquence envisagée. עבד désigne ici le service religieux et l’allégeance envers Dieu, sans se limiter au culte liturgique.
- source_word: וּמַה נּוֹעִיל
  choice: Et que gagnerions-nous
  rationale: Le verbe יעל exprime l’utilité ou le profit. Cette formulation française actuelle conserve le point de vue intéressé attribué aux méchants.
- source_word: כִּי נִפְגַּע בּוֹ
  choice: à le supplier
  rationale: פגע construit avec ב peut désigner le fait d’adresser une supplication ou une requête pressante à quelqu’un. « Le supplier » est clair, naturel et adapté au contexte de la prière.
theological_decisions:
- issue: Traduction du titre divin שַׁדַּי
  choice: le Tout-Puissant
  alternative: Shaddaï
  rationale: Il s’agit d’un titre divin, dont la traduction communique directement le sens traditionnel aux lecteurs francophones sans imposer une interprétation confessionnelle particulière.
- issue: Portée de עבד dans le rapport à Dieu
  choice: servir
  alternative: adorer
  rationale: « Servir » préserve le sens large d’allégeance et de service religieux, alors qu’« adorer » limiterait indûment le terme au culte.
translation_notes:
  register: Français international moderne, digne et direct. L’ajout de « donc » rend la force dédaigneuse de la question rhétorique sans en résoudre la tension. Le parallélisme des deux interrogations est conservé.
