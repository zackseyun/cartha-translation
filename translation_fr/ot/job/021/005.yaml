  yaml_path: translation/ot/job/021/005.yaml
  text: Turn to me and be appalled[a], and put your hand over your mouth.
translation:
  language: fr
  text: Tournez-vous vers moi et soyez consternés[a] ; mettez la main sur votre bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frappés de stupeur ». Le verbe hébreu peut exprimer la stupeur, la consternation ou l’effroi devant une réalité bouleversante.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: Tournez-vous vers moi
  rationale: L’impératif pluriel de פנה suivi de אֶל exprime un mouvement d’attention ou du visage en direction de Job. Cette formulation conserve l’adresse directe et pressante.
- source_word: וְהָשַׁמּוּ
  choice: et soyez consternés
  rationale: Le verbe שׁמם au hifil peut décrire une réaction de stupeur, de consternation ou d’effroi. « Soyez consternés » rend ici la force du choc sans réduire le sens au simple étonnement.
- source_word: וְשִׂימוּ יָד
  choice: mettez la main
  rationale: שׂים signifie couramment « mettre » ou « placer ». Le singulier collectif et l’absence de suffixe possessif sont naturellement rendus en français par « la main » dans cette expression.
- source_word: עַל פֶּה
  choice: sur votre bouche
  rationale: La préposition עַל et le nom פֶּה décrivent le geste de poser la main sur la bouche, signe de silence ou de stupeur. Le possessif est implicite dans le contexte de l’impératif pluriel.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le parallélisme des deux impératifs pluriels est conservé, ainsi que le geste concret de la main sur la bouche.
