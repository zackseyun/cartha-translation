  yaml_path: translation/ot/job/021/019.yaml
  text: God stores up his iniquity for his sons? Let him repay it to the man himself[c][b][a], so that he may know it.
translation:
  language: fr
  text: Dieu mettrait-il en réserve sa faute pour ses fils[b] ? Qu’il fasse payer cette faute à l’homme lui-même, afin qu’il le sache[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement, on peut aussi traduire : « Dieu met en réserve sa faute pour ses fils ; qu’il lui rende, afin qu’il sache. » L’hébreu n’impose pas la forme interrogative, mais le contexte favorise une question par laquelle Job conteste cette idée.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu dit « fils » ; le terme peut ici désigner plus largement les descendants d’un homme.
    reason: lexical_alternative
  - marker: c
    text: « Faute » traduit un terme hébreu qui peut aussi désigner l’iniquité, le malheur ou les conséquences du mal, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Terme singulier courant pour Dieu dans Job ; « Dieu » est l’équivalent français naturel, sans nuance ajoutée.
- source_word: יִצְפֹּן
  choice: mettrait-il en réserve
  rationale: צפן exprime l’idée de garder ou réserver. Le conditionnel interrogatif rend naturellement en français la proposition que Job met en cause dans ce contexte.
- source_word: לְבָנָיו
  choice: pour ses fils
  rationale: Le texte hébreu porte explicitement le masculin pluriel « fils » ; celui-ci est conservé, avec une note signalant sa possible portée plus large.
- source_word: אוֹנוֹ
  choice: sa faute
  rationale: אָוֶן peut désigner la faute, le mal ou le malheur qui en découle. « Sa faute » demeure proche du sens moral sans imposer l’interprétation plus explicite de « châtiment ».
- source_word: יְשַׁלֵּם
  choice: qu’il la lui fasse payer
  rationale: Le piel de שׁלם signifie rendre, rétribuer ou faire payer. La tournure jussive convient à la riposte de Job et exprime clairement que les conséquences doivent atteindre le coupable lui-même.
- source_word: אֵלָיו
  choice: à lui-même
  rationale: Le pronom renvoie au méchant ; « à lui-même » fait ressortir le contraste avec ses fils sans introduire un nouveau référent.
- source_word: וְיֵדָע
  choice: afin qu’il le sache
  rationale: ידע signifie « savoir, connaître ». La proposition peut exprimer ici le but ou le résultat ; « afin qu’il le sache » conserve ce sens tout en laissant implicite ce qu’il connaîtra par expérience.
theological_decisions:
- issue: La première proposition est-elle une affirmation de Job ou une idée qu’il conteste ?
  choice: 'La rendre comme une question rhétorique : « Dieu mettrait-il en réserve sa faute pour ses fils ? »'
  alternative: « Dieu met en réserve sa faute pour ses fils ; qu’il la lui fasse payer… »
  rationale: Le contexte de Job 21 favorise une contestation de l’idée selon laquelle la rétribution du méchant serait reportée sur ses descendants. La question rhétorique préserve cette dynamique argumentative, tandis qu’une note maintient la lecture syntaxique affirmative possible.
- issue: Sens de אוֹנוֹ dans un contexte de rétribution
  choice: « sa faute »
  alternative: « son châtiment », « son malheur » ou « son iniquité »
  rationale: Le mot peut désigner le mal commis ou ses conséquences. « Sa faute » suit de près la valeur morale du terme et évite de résoudre silencieusement l’ambiguïté en faveur du seul châtiment.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est formulée au conditionnel pour faire entendre la contestation de Job. « Faire payer » est idiomatique sans être familier et conserve la force rétributive du verbe. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
