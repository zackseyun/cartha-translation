  text: יְשַׁלְּח֣וּ כַ֭/צֹּאן עֲוִילֵי/הֶ֑ם וְ֝/יַלְדֵי/הֶ֗ם יְרַקֵּדֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/011.yaml
  text: They send out their little ones like a flock[c][b][a], and their children dance.
translation:
  language: fr
  text: Ils font sortir leurs tout-petits comme un troupeau[a], et leurs enfants dansent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des moutons ». Le mot hébreu désigne collectivement les moutons, les chèvres ou le petit bétail.
    reason: lexical_alternative
  - marker: b
    text: Ou « sautillent » ou « bondissent ». Le verbe hébreu décrit un mouvement vif, qui peut évoquer la danse ou les bonds.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּחוּ
  choice: ils laissent sortir
  rationale: Le piel de שלח signifie « envoyer, faire sortir, laisser aller ». Dans cette scène où les enfants se déplacent librement, « laissent sortir » est naturel en français et évite la nuance potentiellement autoritaire de « envoient ».
- source_word: כַצֹּאן
  choice: comme un troupeau
  rationale: צֹאן désigne collectivement le petit bétail, surtout les moutons et les chèvres. « Comme un troupeau » conserve l'image collective et le mouvement de groupe.
- source_word: עֲוִילֵיהֶם
  choice: leurs tout-petits
  rationale: עויל désigne de très jeunes enfants. « Tout-petits » exprime clairement leur jeune âge sans les limiter nécessairement aux nouveau-nés.
- source_word: יַלְדֵיהֶם
  choice: leurs enfants
  rationale: Le nom désigne ici les enfants ou la progéniture au sens large. « Enfants » rend naturellement le parallèle avec « tout-petits ».
- source_word: יְרַקֵּדוּן
  choice: bondissent de joie
  rationale: רקד évoque un mouvement vif pouvant être une danse, des bonds ou des sautillements. « Bondissent de joie » restitue l'allégresse de la scène tout en conservant l'idée de mouvement.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme entre les très jeunes enfants et les enfants est maintenu, ainsi que l'image pastorale collective.
