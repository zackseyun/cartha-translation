source:
  edition: WLC
  text: הֵ֤ן לֹ֣א בְ/יָדָ֣/ם טוּבָ֑/ם עֲצַ֥ת רְ֝שָׁעִ֗ים רָ֣חֲקָה מֶֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/016.yaml
  text: Look, is not their prosperity in their own hand? The counsel of the wicked is far from me.
translation:
  language: fr
  text: Voici, leur bien-être n’est pas entre leurs mains[a] ; le conseil des méchants est loin de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, comme question rhétorique : « leur bien-être n’est-il pas entre leurs mains ? »'
    reason: La séquence הֵן לֹא peut aussi être analysée comme une question rhétorique ; cette lecture modifie le rapport de la phrase avec la prospérité des méchants décrite dans le contexte.
lexical_decisions:
- source_word: הֵן
  choice: Pourtant
  rationale: Dans le contexte, la particule attire l’attention tout en introduisant une réserve à ce qui précède ; « pourtant » rend naturellement cette transition en français.
- source_word: טוּבָם
  choice: leur bonheur
  rationale: טוּב désigne ici la situation favorable, le bien-être ou la prospérité des méchants ; « bonheur » conserve une portée plus large que la seule richesse matérielle.
- source_word: עֲצַת רְשָׁעִים
  choice: le conseil des méchants
  rationale: Traduction formellement proche qui garde ouvertes les nuances de dessein, manière de penser et ligne de conduite.
- source_word: רָחֲקָה מֶנִּי
  choice: est loin de moi
  rationale: Reproduit l’image spatiale par laquelle Job marque sa séparation d’avec le conseil des méchants.
theological_decisions:
- issue: Rapport entre la prospérité des méchants et leur propre pouvoir
  choice: 'Proposition déclarative négative : « leur bonheur n’est pas entre leurs mains »'
  alternative: 'Question rhétorique : « leur bonheur n’est-il pas entre leurs mains ? »'
  rationale: Le texte consonantique et la ponctuation massorétique se lisent naturellement comme une affirmation. Une note conserve l’autre analyse, qui met davantage en relief la tension avec la prospérité décrite dans les versets précédents.
- issue: Distance de Job envers les méchants
  choice: Maintien de l’énoncé indépendant « le conseil des méchants est loin de moi »
  alternative: 'Lien logique explicite : « c’est pourquoi je me tiens loin des projets des méchants »'
  rationale: L’hébreu n’exprime ni connecteur causal ni verbe indiquant que Job s’éloigne activement ; la formulation retenue évite d’ajouter une relation logique absente du texte.
translation_notes:
  register: Français moderne, sobre et digne. La formulation demeure proche de la structure hébraïque sans devenir artificielle ; la note signale l’ambiguïté syntaxique réelle.
