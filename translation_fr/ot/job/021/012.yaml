  text: יִ֭שְׂאוּ כְּ/תֹ֣ף וְ/כִנּ֑וֹר וְ֝/יִשְׂמְח֗וּ לְ/ק֣וֹל עוּגָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/012.yaml
  text: They sing to the tambourine and lyre, and rejoice at the sound of the flute.
translation:
  language: fr
  text: Ils chantent accompagnés du tambourin et de la lyre[a], et se réjouissent au son de la flûte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils prennent le tambourin et la lyre ». Le verbe hébreu signifie littéralement « lever, porter, prendre », mais peut évoquer ici le chant accompagné de musique.'
    reason: Préserver l’ambiguïté réelle du verbe יִשְׂאוּ, que le contexte musical permet de comprendre soit comme l’action de chanter, soit plus littéralement comme celle de prendre les instruments.
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: ils chantent
  rationale: Le verbe signifie littéralement « lever, porter, prendre »; dans ce contexte musical, il peut désigner le fait d’élever la voix ou d’entonner un chant. « Ils chantent » donne en français naturel le sens contextuel sans ajouter explicitement « leur voix », absent du texte hébreu.
- source_word: כְּתֹף וְכִנּוֹר
  choice: accompagnés du tambourin et de la lyre
  rationale: La préposition כְ marque ici l’accompagnement musical. תֹף désigne un tambourin ou tambour sur cadre, et כִּנּוֹר un instrument à cordes de la famille de la lyre.
- source_word: עוּגָב
  choice: flûte
  rationale: Le terme désigne vraisemblablement un instrument à vent; « flûte » est clair et traditionnel, bien que l’identification précise de l’instrument ancien reste incertaine.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. « Accompagnés de » évite une formulation artificielle comme « chanter au tambourin » tout en conservant le rapport entre le chant et les instruments.
