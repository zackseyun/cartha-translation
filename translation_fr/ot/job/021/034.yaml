  text: וְ֭/אֵיךְ תְּנַחֲמ֣וּ/נִי הָ֑בֶל וּ֝/תְשֽׁוּבֹתֵי/כֶ֗ם נִשְׁאַר מָֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/021/034.yaml
  text: How then can you comfort me with emptiness[a], when your answers remain nothing but treachery?
translation:
  language: fr
  text: Comment donc pouvez-vous me consoler par des paroles creuses, alors que dans vos réponses il ne reste que de la trahison ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵיךְ
  choice: Comment donc
  rationale: L’interrogatif אֵיךְ introduit une question rhétorique, tandis que « donc » rend naturellement la valeur connective du waw dans ce contexte.
- source_word: תְּנַחֲמוּנִי
  choice: pouvez-vous me consoler
  rationale: Le piel de נחם avec suffixe de première personne signifie « me consoler ». Le modal « pouvez-vous » exprime naturellement la contestation rhétorique de Job.
- source_word: הָבֶל
  choice: avec du vide
  rationale: הבל désigne le vide, la vanité ou la futilité. « Avec du vide » conserve ici la force nominale et présente les paroles des amis comme dépourvues de substance.
- source_word: וּתְשׁוּבוֹתֵיכֶם
  choice: vos réponses
  rationale: תשובה signifie « réponse » ou « réplique » et renvoie ici aux discours des amis.
- source_word: נִשְׁאַר
  choice: ne restent que
  rationale: Le niphal de שׁאר signifie « rester, subsister ». La tournure française « ne restent que » rend le prédicat avec naturel sans effacer son idée fondamentale.
- source_word: מָעַל
  choice: trahison
  rationale: מעל évoque une infidélité, une rupture de confiance ou une trahison. « Trahison » préserve la gravité relationnelle de l’accusation, au-delà d’une simple erreur.
theological_decisions:
- issue: Portée de l’accusation מָעַל
  choice: trahison
  alternative: tromperie / infidélité
  rationale: Le terme peut désigner l’infidélité ou la faute contre une confiance. « Trahison » maintient la force de l’accusation de Job sans préciser davantage sa portée morale ou théologique.
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve le parallélisme accusateur et l’ambiguïté de הָבֶל, explicitée en note.
