  yaml_path: translation/ot/job/021/023.yaml
  text: One dies in the fullness of his vigor[a], wholly at ease and secure.
translation:
  language: fr
  text: L’un meurt en pleine vigueur[a], parfaitement tranquille et en sécurité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en pleine possession de ses forces » ; l’hébreu évoque un état entier, intact.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: L’un
  rationale: Le démonstratif introduit ici un premier cas dans une comparaison. « L’un » rend naturellement en français cette valeur représentative sans alourdir le texte.
- source_word: יָמוּת
  choice: meurt
  rationale: 'L’imparfait hébreu a ici une valeur générale : le présent français exprime naturellement cette observation sur l’expérience humaine.'
- source_word: בְּעֶצֶם תֻּמּוֹ
  choice: en pleine vigueur
  rationale: L’expression associe l’idée de substance ou de force à celle d’intégrité, de plénitude ou d’état intact. Dans ce contexte, elle décrit une vitalité non diminuée plutôt qu’une intégrité morale.
- source_word: כֻּלּוֹ
  choice: parfaitement
  rationale: Le terme intensifie l’ensemble de la description qui suit. « Parfaitement » en restitue la valeur adverbiale dans un français naturel.
- source_word: שַׁלְאֲנַן
  choice: tranquille
  rationale: L’adjectif évoque l’aisance et l’absence de trouble. « Tranquille » conserve cette idée sans réduire le mot à la seule prospérité matérielle.
- source_word: וְשָׁלֵיו
  choice: et en sécurité
  rationale: Ce terme parallèle renforce l’idée d’un bien-être paisible et sans menace. « En sécurité » distingue légèrement les deux adjectifs tout en conservant leur proximité sémantique.
theological_decisions: []
