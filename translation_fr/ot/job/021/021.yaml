  text: כִּ֤י מַה חֶפְצ֣/וֹ בְּ/בֵית֣/וֹ אַחֲרָ֑י/ו וּ/מִסְפַּ֖ר חֳדָשָׁ֣י/ו חֻצָּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/021.yaml
  text: For what does he care about his house after him[c][b][a], when the number of his months is cut off?
translation:
  language: fr
  text: Car que lui importe[a] sa maison[b] après lui, quand le nombre de ses mois est retranché[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quel plaisir trouve-t-il dans… ? »
    reason: lexical_alternative
  - marker: b
    text: Le mot « maison » peut aussi désigner les gens de sa maison, c’est-à-dire sa famille.
    reason: lexical_alternative
  - marker: c
    text: 'Ou « et le nombre de ses mois est fixé »; autre possibilité : « est réparti ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qui soutient l’argument précédent.
- source_word: מַה חֶפְצוֹ
  choice: que lui importe
  rationale: Rend naturellement en français la question rhétorique fondée sur חֵפֶץ, qui peut exprimer l’intérêt, le désir ou le plaisir.
- source_word: בְּבֵיתוֹ
  choice: sa maison
  rationale: Conserve l’image concrète de la « maison », tout en signalant en note son possible sens collectif.
- source_word: אַחֲרָיו
  choice: après lui
  rationale: Reproduit sobrement l’expression hébraïque et laisse le contexte évoquer ce qui suit sa disparition, sans expliciter davantage.
- source_word: וּמִסְפַּר חֳדָשָׁיו
  choice: quand le nombre de ses mois
  rationale: « Quand » exprime naturellement le rapport circonstanciel suggéré par la coordination; « mois » conserve l’expression concrète de la durée de la vie.
- source_word: חֻצָּצוּ
  choice: est retranché
  rationale: Le passif exprime ici la suppression ou l’interruption du nombre de mois; l’accord au singulier suit « le nombre » en français.
theological_decisions:
- issue: Sens du verbe rare חֻצָּצוּ
  choice: est retranché
  alternative: est fixé / est réparti
  rationale: Le contexte de la fin de la vie favorise l’idée d’une durée interrompue, mais le sens de détermination ou de répartition demeure possible et est conservé en note.
translation_notes:
  register: Français moderne, sobre et digne. La tournure rhétorique « que lui importe » est idiomatique; « après lui » maintient l’ambiguïté concise de l’hébreu.
