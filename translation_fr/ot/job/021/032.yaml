id: JOB.21.32
reference: Job 21:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֭/הוּא לִ/קְבָר֣וֹת יוּבָ֑ל וְֽ/עַל גָּדִ֥ישׁ יִשְׁקֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/032.yaml
  text: Yet he is carried to the grave[c][b][a], and over the mound one keeps watch.
translation:
  language: fr
  text: Pourtant, on le conduit aux tombeaux[c], et sur le tertre[b], on veille[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et il veille sur le tertre », si le défunt est le sujet du verbe ; l’hébreu ne précise pas explicitement le sujet.'
    reason: alternative_reading
  - marker: b
    text: Le mot rendu par « tertre » désigne un amas ou une masse entassée ; ici, il s’agit probablement de la terre amoncelée sur une tombe.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « aux tombes » ; le pluriel peut désigner collectivement le lieu de sépulture.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Pourtant, on le
  rationale: La conjonction peut simplement signifier « et », mais le contexte autorise une nuance adversative. Le pronom masculin est conservé comme complément dans la tournure française naturelle « on le conduit ».
- source_word: לִקְבָרוֹת
  choice: aux tombeaux
  rationale: Le nom hébreu est au pluriel. « Aux tombeaux » respecte cette forme et peut évoquer collectivement le lieu de sépulture, sans imposer le singulier idiomatique.
- source_word: יוּבָל
  choice: on le conduit
  rationale: Le hophal de יבל exprime le fait d’être mené ou porté. Dans le contexte funéraire, la tournure active indéfinie française garde le sens passif tout en restant naturelle.
- source_word: וְעַל
  choice: et sur
  rationale: Traduction directe de la conjonction et de la préposition, adaptée à l’image du tertre funéraire.
- source_word: גָּדִישׁ
  choice: le tertre
  rationale: Le mot désigne un amas ou une masse entassée. Ici, « tertre » rend naturellement l’élévation de terre au-dessus d’une tombe sans remplacer l’image par une interprétation plus précise.
- source_word: יִשְׁקֹד
  choice: on veille
  rationale: Le verbe signifie veiller, rester vigilant. Son sujet n’étant pas exprimé indépendamment en hébreu, « on veille » préserve autant que possible cette indétermination en français, tout en gardant la voix active.
theological_decisions:
- issue: Sujet de יִשְׁקֹד
  choice: 'Sujet indéfini : « on veille »'
  alternative: 'Le défunt comme sujet : « il veille sur le tertre »'
  rationale: La forme verbale masculine singulière permet de reprendre « il », mais le sujet peut aussi être compris de manière indéfinie. Le texte principal évite de trancher en faveur d’une activité attribuée au mort, tandis que la note conserve explicitement l’autre lecture.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le pluriel hébreu « aux tombeaux » et place les compléments dans un ordre proche de l’original, tout en employant le pronom indéfini « on » pour une lecture fluide et pour ne pas imposer un sujet absent du texte.
