source:
  edition: WLC
  text: שָׂ֭אוּ/נִי וְ/אָנֹכִ֣י אֲדַבֵּ֑ר וְ/אַחַ֖ר דַּבְּרִ֣/י תַלְעִֽיג׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/003.yaml
  text: Bear with me[a], and I will speak; and after I have spoken[b], you may mock.
translation:
  language: fr
  text: Supportez-moi[a], et je parlerai ; après que j’aurai parlé[b], tu pourras te moquer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tolérez-moi », « Prenez patience avec moi ». L’hébreu emploie littéralement le verbe « porter », ici au sens de supporter quelqu’un et de lui permettre de parler.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « après que j’aurai parlé, tu te moqueras ». L’hébreu peut exprimer soit un simple futur, soit une permission ou concession : « tu pourras te moquer ».'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂאוּנִי
  choice: Supportez-moi
  rationale: Le verbe נָשָׂא signifie fondamentalement « porter » et prend ici, avec le suffixe de première personne, le sens idiomatique de tolérer quelqu’un et de lui accorder le temps de parler. « Supportez-moi » conserve cette image et reste naturel en français.
- source_word: וְאָנֹכִי
  choice: et je
  rationale: Le pronom אָנֹכִי exprime explicitement et avec une certaine insistance la première personne. « Et je » maintient la coordination simple sans ajouter une nuance absente du texte.
- source_word: אֲדַבֵּר
  choice: je parlerai
  rationale: Le piel de דבר est le verbe courant pour « parler ». Le futur français convient à l’action que Job annonce après sa demande.
- source_word: וְאַחַר דַּבְּרִי
  choice: après que j’aurai parlé
  rationale: L’expression signifie littéralement « après mon parler ». Cette formulation française rend naturellement l’antériorité de la prise de parole par rapport à la moquerie.
- source_word: תַלְעִיג
  choice: tu pourras te moquer
  rationale: Le hiphil de לעג signifie « se moquer, railler ». La deuxième personne est morphologiquement singulière. « Tu pourras » exprime dans le texte principal la valeur permissive ou concessive qui convient bien au contexte, tout en signalant en note la lecture comme simple futur.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le pluriel « Supportez » puis le singulier « tu » reproduisent le changement de nombre du texte hébreu, qui peut viser ensuite un interlocuteur représentatif. La ponctuation garde l’enchaînement rhétorique de la demande de Job.
