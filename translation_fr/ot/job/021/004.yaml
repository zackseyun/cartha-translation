  text: הֶ֭/אָנֹכִי לְ/אָדָ֣ם שִׂיחִ֑/י וְ/אִם מַ֝דּ֗וּעַ לֹא תִקְצַ֥ר רוּחִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/004.yaml
  text: As for me, is my complaint against man? If not, why should my spirit not be impatient?
translation:
  language: fr
  text: Quant à moi, est-ce à un homme que s’adresse ma plainte ? Et si ce n’est pas le cas, pourquoi ne perdrais-je pas patience ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂיחִי
  choice: ma plainte
  rationale: Dans ce contexte de contestation et de souffrance, le nom désigne la plainte ou les propos plaintifs de Job, plutôt qu’une simple conversation.
- source_word: לְאָדָם
  choice: à un homme
  rationale: La préposition לְ est rendue naturellement avec l’idée d’une plainte adressée à quelqu’un; אָדָם reste indéfini et générique.
- source_word: תִקְצַר רוּחִי
  choice: perdrais-je patience
  rationale: L’expression idiomatique, littéralement « mon souffle/esprit serait court », évoque l’impatience ou l’exaspération; cette formulation française en restitue clairement le sens.
theological_decisions:
- issue: Destinataire implicite de la plainte de Job
  choice: Conserver « à un homme » sans expliciter Dieu
  alternative: « Ma plainte s’adresse-t-elle à Dieu plutôt qu’aux hommes ? »
  rationale: Le contraste peut laisser entendre que Job porte sa plainte devant Dieu, mais le texte ne nomme pas explicitement Dieu; l’implicite est donc préservé.
- issue: Valeur de וְאִם
  choice: « Et si ce n’est pas le cas »
  alternative: « Sinon » ou « Et pourquoi »
  rationale: Cette lecture conserve la condition elliptique présente dans l’hébreu et reflétée par la couche de consultation anglaise, sans combler davantage le sous-entendu.
translation_notes:
  register: Français international moderne, naturel et digne. La première question conserve l’indéfini singulier de l’hébreu; la seconde privilégie une expression idiomatique courante plutôt qu’un calque de « souffle court ».
