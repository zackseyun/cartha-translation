  text: זַרְעָ֤/ם נָכ֣וֹן לִ/פְנֵי/הֶ֣ם עִמָּ֑/ם וְ֝/צֶאֱצָאֵי/הֶ֗ם לְ/עֵינֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/008.yaml
  text: Their offspring are established before them[a], with them, and their descendants before their eyes.
translation:
  language: fr
  text: Leur descendance est solidement établie devant eux, avec eux, et leurs descendants sont sous leurs yeux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Leur descendance est en sécurité devant eux, avec eux, et leurs descendants sont sous leurs yeux. »'
    reason: Alternative lexicale pour נָכוֹן (« en sécurité »).
lexical_decisions:
- source_word: זַרְעָם
  choice: leur descendance
  rationale: זֶרַע désigne collectivement la postérité ou la descendance. « Leur descendance » est naturel en français moderne et ne restreint pas le sens aux seuls jeunes enfants.
- source_word: נָכוֹן
  choice: est solidement établie
  rationale: La forme exprime un état de stabilité, d'affermissement ou de sécurité. « Solidement établie » conserve l'image d'une situation ferme sans réduire le sens à la seule absence de danger.
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: Cette traduction maintient l'image spatiale de l'hébreu et suggère qu'ils voient leur descendance prospérer, sans expliciter davantage.
- source_word: עִמָּם
  choice: avec eux
  rationale: עִם signifie directement « avec ». L'expression souligne que leur descendance demeure présente auprès d'eux.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: et leurs rejetons
  rationale: צֶאֱצָאִים désigne les personnes issues d'eux. « Rejetons » distingue ce second terme de « descendance » et préserve le parallélisme, dans un registre digne quoique légèrement littéraire.
- source_word: לְעֵינֵיהֶם
  choice: sont sous leurs yeux
  rationale: L'expression hébraïque évoque ce qui se trouve directement à la vue de quelqu'un. « Sous leurs yeux » est une tournure française naturelle et vive.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la répétition et la tension du parallélisme hébreu. La ponctuation détache « avec eux » afin de ne pas le fondre silencieusement dans « devant eux ».
