id: JOB.21.30
reference: Job 21:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י לְ/י֣וֹם אֵ֭יד יֵחָ֣שֶׂךְ רָ֑ע לְ/י֖וֹם עֲבָר֣וֹת יוּבָֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/030.yaml
  text: For the evil man is spared for the day of disaster[b][a]; they are led away for the day of wrath.
translation:
  language: fr
  text: Car le méchant est épargné pour le jour du désastre[a] ; ils sont conduits au jour de la colère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est retenu pour le jour du désastre » ou « est réservé pour le jour du désastre ». Le verbe hébreu peut signifier « être épargné », « être retenu » ou « être réservé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils sont amenés au jour de la colère ». Le dernier verbe peut évoquer le fait d’être conduit ou amené jusqu’à ce jour.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le fondement de l’affirmation précédente et maintient le lien argumentatif.
- source_word: לְיוֹם אֵיד
  choice: pour le jour du désastre
  rationale: La préposition לְ avec « jour » renvoie ici naturellement à une échéance future ; אֵיד désigne le désastre, le malheur ou la ruine.
- source_word: יֵחָשֶׂךְ
  choice: est épargné
  rationale: Le nifal de חשׂך peut signifier « être épargné », « être retenu » ou « être réservé ». « Est épargné » exprime clairement l’absence de châtiment immédiat sans supprimer l’autre nuance possible.
- source_word: רָע
  choice: le méchant
  rationale: L’adjectif masculin singulier est substantivé et désigne une personne mauvaise ; « le méchant » est naturel en français et conserve le singulier représentatif.
- source_word: לְיוֹם עֲבָרוֹת
  choice: au jour de la colère
  rationale: עֲבָרוֹת, pluriel intensif lié à la fureur ou aux débordements de colère, se rend idiomatiquement par « la colère ». Devant « jour », « au jour » traduit naturellement la destination temporelle.
- source_word: יוּבָלוּ
  choice: ils sont conduits
  rationale: Le hofal pluriel de יבל signifie être amené, conduit ou emporté. Le pluriel hébreu est conservé malgré le passage du singulier représentatif au pluriel collectif.
theological_decisions:
- issue: Rapport entre la prospérité présente des méchants et le jugement divin futur
  choice: Le méchant échappe au désastre immédiat et est conduit vers un futur jour de colère.
  alternative: Le méchant est tenu à l’écart du jour du désastre, ou bien amené à comparaître lors de ce jour.
  rationale: Les deux expressions temporelles et les verbes employés suggèrent une mise en réserve pour un jugement futur, tout en laissant subsister l’ambiguïté lexicale sur le fait d’être épargné, retenu ou réservé.
translation_notes:
  register: Français international moderne, sobre et digne. Le singulier « le méchant » suivi du pluriel « ils » reproduit le changement de nombre du texte hébreu et son passage d’un individu représentatif à la catégorie des méchants.
