source:
  edition: WLC
  text: שִׁמְע֣וּ שָׁ֭מוֹעַ מִלָּתִ֑/י וּ/תְהִי זֹ֝֗את תַּנְח֥וּמֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/002.yaml
  text: Listen carefully to my words[a], and let this be your consolation.
translation:
  language: fr
  text: Écoutez attentivement mes paroles, et que cela soit votre consolation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « vos consolations »; on peut aussi traduire « votre réconfort ».
    reason: Le texte hébreu emploie un pluriel, alors que le singulier abstrait est plus naturel ici en français.
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Écoutez attentivement
  rationale: L’impératif pluriel suivi de l’infinitif absolu du même verbe renforce l’appel à écouter; le français exprime naturellement cette insistance par « attentivement ».
- source_word: מִלָּתִי
  choice: mes paroles
  rationale: Le nom hébreu est grammaticalement singulier (« ma parole »), mais désigne ici ce que Job est en train de dire; le pluriel est plus naturel en français dans cet appel tout en conservant le sens.
- source_word: וּתְהִי
  choice: et que ce soit
  rationale: Cette tournure rend la valeur volitive du jussif de היה dans un français actuel et digne.
- source_word: זֹאת
  choice: ce soit là
  rationale: Le démonstratif renvoie de manière compacte à l’écoute demandée; « là » marque naturellement cette référence en français sans la préciser davantage.
- source_word: תַּנְח֥וּמֹתֵיכֶם
  choice: votre consolation
  rationale: Le substantif hébreu est au pluriel avec un suffixe de deuxième personne du pluriel, mais le singulier abstrait « consolation » est idiomatique en français et convient au réconfort que les interlocuteurs peuvent offrir à Job en l’écoutant.
theological_decisions:
- issue: Référent de זֹאת (« ce »)
  choice: Conserver le référent implicite dans « que ce soit là »
  alternative: 'Expliciter: « que votre écoute soit »'
  rationale: L’hébreu peut viser l’acte d’écouter ou, plus largement, l’attention accordée aux paroles de Job. Ne pas expliciter préserve cette légère ambiguïté.
- issue: Possible tonalité ironique de « votre consolation »
  choice: Ne pas expliciter l’ironie dans le texte
  alternative: Ajouter une formulation telle que « toute la consolation que vous m’offrirez »
  rationale: Le contexte peut suggérer que Job oppose leur écoute à leurs consolations verbales insuffisantes, mais le verset lui-même laisse cette nuance implicite.
translation_notes:
  register: Français international moderne, clair et digne. L’intensification hébraïque est rendue idiomatiquement, tandis que la formulation compacte et la possible pointe ironique restent implicites.
