  text: יִהְי֗וּ כְּ/תֶ֥בֶן לִ/פְנֵי ר֑וּחַ וּ֝/כְ/מֹ֗ץ גְּנָבַ֥תּ/וּ סוּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/018.yaml
  text: May they be like straw before the wind[a], and like chaff that a storm carries away.
translation:
  language: fr
  text: Qu’ils soient comme la paille devant le vent, comme la balle qu’emporte[a] la tempête !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme la balle que la tempête dérobe » ou « arrache ». Le verbe hébreu signifie littéralement « voler, dérober » et décrit poétiquement un enlèvement soudain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Qu’ils soient
  rationale: L’imparfait peut avoir ici une valeur volitive, dans le souhait rhétorique formulé par Job. « Qu’ils soient » conserve cette nuance sans transformer le propos en simple constat.
- source_word: כְּתֶבֶן
  choice: comme la paille
  rationale: תבן désigne la paille, c’est-à-dire les tiges sèches restant après le traitement des céréales. « Paille » est précis et naturel en français moderne.
- source_word: לִפְנֵי רוּחַ
  choice: devant le vent
  rationale: L’expression évoque une matière légère exposée au vent et chassée devant lui. Cette formulation garde l’image et le parallélisme poétique.
- source_word: וּכְמֹץ
  choice: comme la bale
  rationale: מֹץ désigne les enveloppes légères et les déchets séparés du grain lors du vannage. « Bale » est le terme français précis dans cette image agricole, malgré son emploi moins courant.
- source_word: גְּנָבַתּוּ
  choice: qu’emporte
  rationale: Le verbe גנב signifie littéralement « voler, dérober », mais appliqué à la tempête il exprime ici un enlèvement brusque. « Emporte » rend naturellement l’effet de la tempête; la valeur littérale est signalée en note.
- source_word: סוּפָה
  choice: la tempête
  rationale: סוּפָה désigne une tempête ou un tourbillon violent. « Tempête » est clair, naturel et ne restreint pas indûment le phénomène à un tourbillon.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme hébreu est conservé. « Bale », terme agricole exact pour les enveloppes légères séparées du grain, maintient la distinction avec « paille »; la note préserve l’image inhabituelle du verbe « dérober ».
