id: JOB.21.20
reference: Job 21:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִרְא֣וּ עינ/ו כִּיד֑/וֹ וּ/מֵ/חֲמַ֖ת שַׁדַּ֣י יִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/020.yaml
  text: Let his own eyes see his ruin[b][a], and let him drink from the wrath of the Almighty.
translation:
  language: fr
  text: Que ses propres yeux voient son malheur[a][b], et qu’il boive de la fureur du Tout-Puissant !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa ruine » ou « sa catastrophe ».'
    reason: alternative lexicale
  - marker: b
    text: 'Autre lecture : « Ses yeux verront son malheur, et il boira de la fureur du Tout-Puissant. » Les imparfaits hébreux peuvent exprimer une prédiction plutôt qu’un souhait.'
    reason: lecture alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: Que ... voient
  rationale: Imparfait qal, 3e personne du pluriel, accordé avec « ses yeux ». Dans ce contexte, la tournure « Que... » exprime naturellement le souhait portant sur le jugement du méchant, tout en signalant en note la lecture prédictive possible.
- source_word: עינ/ו
  choice: ses propres yeux
  rationale: Le texte désigne « ses yeux » avec un suffixe possessif. « propres » souligne en français que le méchant doit constater personnellement son sort, idée mise en relief par la formulation hébraïque.
- source_word: כִּידוֹ
  choice: son malheur
  rationale: כִּיד désigne le malheur, la catastrophe ou la ruine. « Malheur » reste assez large pour ne pas renforcer indûment le terme jusqu’à l’anéantissement.
- source_word: וּמֵחֲמַת
  choice: et ... de la fureur de
  rationale: חֵמָה peut exprimer la fureur, la colère ardente, voire le venin dans certains contextes. Avec « boire » et le jugement divin, « boire de la fureur de » conserve la métaphore et la préposition מִן.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Rendu français traditionnel et intelligible du titre divin שַׁדַּי, particulièrement fréquent dans Job.
- source_word: יִשְׁתֶּה
  choice: qu’il boive
  rationale: Imparfait qal, 3e personne du singulier, compris parallèlement au premier verbe comme un souhait. Le verbe « boire » préserve l’image hébraïque de la colère divine absorbée comme une coupe.
theological_decisions:
- issue: Valeur des verbes à l’imparfait
  choice: 'Souhait : « Que ses propres yeux voient... et qu’il boive... »'
  alternative: 'Prédiction : « Ses yeux verront... et il boira... »'
  rationale: Le contexte présente Job demandant que le méchant subisse lui-même les conséquences de sa conduite. La lecture volitive convient à cette visée rhétorique, mais les formes hébraïques permettent aussi une lecture prédictive, conservée en note.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme hébraïque et la métaphore de la boisson sont conservés. Le point d’exclamation rend la force du souhait sans ajouter de contenu doctrinal.
