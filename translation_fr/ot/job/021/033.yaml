  text: מָֽתְקוּ ל֗/וֹ רִגְבֵ֫י נָ֥חַל וְ֭/אַחֲרָי/ו כָּל אָדָ֣ם יִמְשׁ֑וֹךְ וּ֝/לְ/פָנָ֗י/ו אֵ֣ין מִסְפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/033.yaml
  text: The clods of the valley are sweet to him[a]; all mankind follows after him[c][b], and those before him are without number.
translation:
  language: fr
  text: Les mottes de terre de la vallée lui sont douces[a] ; toute l’humanité marche à sa suite[b][c], et ceux qui sont devant lui sont innombrables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les mottes de terre du ravin — ou de l’oued — lui sont agréables. » Le mot hébreu peut désigner une vallée, un ravin, un oued ou le lit d’un cours d’eau.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tout אדם » ; le mot désigne ici l’ensemble des êtres humains.'
    reason: lexical_alternative
  - marker: c
    text: 'Cette ligne peut évoquer soit un cortège funèbre, soit la marche universelle des humains vers la mort : d’innombrables personnes sont devant lui, ou l’ont précédé, et toute l’humanité vient après lui.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָתְקוּ לּוֹ
  choice: lui sont douces
  rationale: Conserve la métaphore hébraïque de la douceur, qui présente la terre de la tombe comme agréable au mort, sans la réduire à une simple idée de repos.
- source_word: רִגְבֵי נָחַל
  choice: les mottes de terre de la vallée
  rationale: « Mottes de terre » rend concrètement רִגְבֵי. « Vallée » est naturel en français, tandis que la note signale que נָחַל peut aussi désigner un ravin, un oued ou le lit d’un cours d’eau.
- source_word: כָּל אָדָם
  choice: toute l’humanité
  rationale: אָדָם a ici un sens collectif et générique ; cette formulation inclut clairement l’ensemble des humains.
- source_word: וְאַחֲרָיו ... יִמְשׁוֹךְ
  choice: marche à sa suite
  rationale: Le verbe משך signifie fondamentalement « tirer, entraîner », mais avec « après lui » il évoque ici le mouvement de ceux qui suivent. La formulation française préserve l’image d’une progression sans imposer soit le cortège funèbre, soit la marche universelle vers la mort.
- source_word: וּלְפָנָיו אֵין מִסְפָּר
  choice: ceux qui l’ont précédé sont innombrables
  rationale: « Ont précédé » exprime la portée à la fois spatiale et temporelle de לְפָנָיו ; « innombrables » rend naturellement l’idiome אֵין מִסְפָּר.
theological_decisions:
- issue: Portée de l’image funéraire et du mouvement humain
  choice: Maintenir à la fois l’évocation possible d’un cortège funèbre et celle de l’humanité entière avançant vers la mort.
  alternative: Interpréter exclusivement la scène comme un cortège funèbre, ou exclusivement comme une affirmation abstraite de la mortalité universelle.
  rationale: Les expressions concrètes « à sa suite » et « ceux qui l’ont précédé » permettent les deux lectures. La traduction ne tranche donc pas une ambiguïté que l’hébreu conserve.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore inhabituelle « lui sont douces » est volontairement conservée ; la syntaxe reste fluide et l’ambiguïté funéraire du texte hébreu n’est pas résolue artificiellement.
