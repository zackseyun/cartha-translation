  terminology: 'Les termes « mottes de terre », « vallée », « humanité » et « innombrables » sont justes et accessibles. La note lexicale sur אדם devrait éviter de présenter « adam » translittéré comme la forme littérale française : elle peut citer le mot hébreu אדם et expliquer son sens collectif. Les notes conservent correctement les possibilités de « oued », « ravin » et lit de cours d’eau.'
