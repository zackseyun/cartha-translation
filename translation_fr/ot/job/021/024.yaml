  yaml_path: translation/ot/job/021/024.yaml
  text: His pails are full of milk[a], and the marrow of his bones is well-watered.
translation:
  language: fr
  text: Ses récipients sont pleins de lait[a], et la moelle de ses os est bien irriguée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ses mamelles sont pleines de lait. » Le terme hébreu est rare et peut désigner soit des mamelles, soit des récipients à lait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטִינָיו
  choice: ses récipients
  rationale: Le nom est rare et son sens débattu. Il peut désigner des récipients à lait ou des mamelles. « Récipients » conserve l’image d’une abondance de lait sans imposer l’une des interprétations; l’autre possibilité est signalée en note.
- source_word: מָלְאוּ
  choice: sont pleins
  rationale: Le parfait décrit ici l’état prospère du personnage; le présent français exprime naturellement cette valeur stative.
- source_word: חָלָב
  choice: lait
  rationale: Sens lexical courant, évoquant ici l’abondance et la prospérité.
- source_word: וּמֹחַ עַצְמוֹתָיו
  choice: et la moelle de ses os
  rationale: Cette formulation garde le rapport construit et l’image corporelle concrète de l’hébreu.
- source_word: יְשֻׁקֶּה
  choice: est bien irriguée
  rationale: Le pu‘al indique que la moelle reçoit de l’humidité ou est abreuvée. « Bien irriguée » rend l’image de vigueur et de vitalité tout en restant naturelle en français.
