base_translation:
  language: en
  yaml_path: translation/ot/job/021/017.yaml
  text: How often is the lamp of the wicked put out[c][b][a], and does their disaster come upon them? Does he apportion sorrows in his anger?
translation:
  language: fr
  text: Combien de fois la lampe des méchants s’éteint-elle[a][b] ? Leur malheur fond-il sur eux ? Leur distribue-t-il des souffrances dans sa colère[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Combien rarement la lampe des méchants s’éteint-elle ? » La question est rhétorique : Job conteste que les méchants soient régulièrement jugés de cette manière.'
    reason: lexical_alternative
  - marker: b
    text: La « lampe » représente ici la vie, la prospérité ou la fortune durable d’une personne.
    reason: cultural_note
  - marker: c
    text: 'Ou : « des douleurs », voire « des douleurs d’enfantement ». Le mot hébreu peut exprimer plusieurs formes de souffrance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Combien de fois
  rationale: L’interrogatif porte ici sur la fréquence et introduit une question rhétorique qui met en doute la régularité du jugement des méchants.
- source_word: נֵר
  choice: lampe
  rationale: Le terme désigne littéralement une lampe, image qui peut évoquer la vie, la prospérité ou la fortune durable d’une personne.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Rendu substantivé courant et naturel dans la littérature de sagesse.
- source_word: יִדְעָךְ
  choice: s’éteint-elle
  rationale: Le verbe דעך décrit l’extinction d’une lampe. La tournure pronominale est naturelle en français et ne précise pas un agent absent de l’hébreu.
- source_word: וְיָבֹא עָלֵימוֹ אֵידָם
  choice: Leur malheur fond-il sur eux ?
  rationale: אֵיד désigne le malheur, le désastre ou la calamité. « Fondre sur » exprime naturellement l’idée d’un malheur qui vient sur eux.
- source_word: חֲבָלִים
  choice: souffrances
  rationale: Le nom peut désigner des douleurs, des tourments ou des douleurs d’enfantement. « Souffrances » garde ici une portée suffisamment large.
- source_word: יְחַלֵּק
  choice: distribue-t-il
  rationale: Le piel de חלק signifie répartir, distribuer ou attribuer. « Distribuer » reste clair pour un lectorat moderne.
- source_word: בְּאַפּוֹ
  choice: dans sa colère
  rationale: L’expression avec אַף désigne la colère. Le possessif renvoie contextuellement au sujet implicite, compris comme Dieu.
theological_decisions:
- issue: Sujet implicite de יְחַלֵּק (« il distribue »)
  choice: Expliciter « Dieu » dans la troisième question
  alternative: Conserver le simple pronom « il »
  rationale: Le français isolé rendrait l’antécédent de « il » peu clair, puisque le sujet immédiatement précédent est « leur malheur ». Le contexte du débat sur le jugement divin identifie fortement Dieu comme l’agent, sans modifier la portée théologique de la question.
- issue: Portée interrogative et rhétorique du verset
  choice: Présenter les trois propositions comme des questions coordonnées
  alternative: Lire la dernière proposition comme une affirmation
  rationale: Le contexte et l’interrogatif initial favorisent une série de questions rhétoriques contestant l’idée que ce jugement frappe régulièrement les méchants, mais la syntaxe hébraïque ne répète pas de particule interrogative.
translation_notes:
  register: Français international moderne, sobre et digne. L’image concrète de la lampe est conservée. Les questions brèves rendent perceptible la contestation rhétorique de Job. « Dieu » est explicité pour éviter en français une référence pronominale trompeuse.
