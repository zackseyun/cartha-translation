  text: הֲ/לֹ֣א שְׁ֭אֶלְתֶּם ע֣וֹבְרֵי דָ֑רֶךְ וְ֝/אֹתֹתָ֗/ם לֹ֣א תְנַכֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/029.yaml
  text: Have you not asked those who travel the road[b][a], and do you not recognize their signs?
translation:
  language: fr
  text: N’avez-vous pas demandé aux voyageurs[a] ? Ne reconnaissez-vous pas leurs signes[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ceux qui passent par le chemin » ou « ceux qui parcourent la route ».

      '
    reason: lexical_alternative
  - marker: b
    text: Ou « leurs indices » ou « leurs marques » ; selon le contexte, l’expression peut désigner les éléments de témoignage qu’ils fournissent.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: N’avez-vous pas
  rationale: Conserve la question rhétorique, qui attend une réponse affirmative, ainsi que le ton de reproche.
- source_word: שְׁאֶלְתֶּם
  choice: interrogé
  rationale: Exprime naturellement l’idée de demander des renseignements à des personnes dont l’expérience peut instruire.
- source_word: עֹבְרֵי דָרֶךְ
  choice: ceux qui parcourent les routes
  rationale: Rend l’expression participiale désignant les personnes de passage ou les voyageurs. Le pluriel français est idiomatique tout en conservant l’image du déplacement sur les routes.
- source_word: וְאֹתֹתָם
  choice: leurs signes
  rationale: Maintient le sens lexical courant de אוֹת et l’ambiguïté du contexte, sans remplacer d’emblée les signes par des témoignages ou des récits.
- source_word: לֹא תְנַכֵּרוּ
  choice: Ne reconnaissez-vous pas
  rationale: Le piel de נכר peut ici exprimer le fait de reconnaître ou d’admettre. Cette formulation s’accorde directement avec « signes » et préserve la seconde question rhétorique.
theological_decisions: []
