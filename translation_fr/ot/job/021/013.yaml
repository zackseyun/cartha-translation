id: JOB.21.13
reference: Job 21:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יבלו בַ/טּ֣וֹב יְמֵי/הֶ֑ם וּ֝/בְ/רֶ֗גַע שְׁא֣וֹל יֵחָֽתּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/013.yaml
  text: They spend their days in prosperity[a], and in a moment they go down to Sheol.
translation:
  language: fr
  text: Ils passent leurs jours dans la prospérité et, en un instant, ils descendent au shéol[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tombe », « le séjour des morts » ou « la mort ». Le mot hébreu est shéol.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַלּוּ
  choice: ils passent
  rationale: Dans ce piel de בלה, le verbe exprime le fait d’employer ou de laisser s’écouler ses jours. « Ils passent leurs jours » rend naturellement l’idée temporelle sans introduire l’image plus littérale d’une usure.
- source_word: בַטּוֹב
  choice: dans la prospérité
  rationale: טוֹב désigne ici la bonne condition dont jouissent les méchants, dans un contexte d’aisance matérielle et de bien-être. « Prospérité » exprime ce sens contextuel sans réduire le terme au seul bonheur affectif.
- source_word: יְמֵיהֶם
  choice: leurs jours
  rationale: Traduction directe qui conserve l’expression temporelle hébraïque.
- source_word: וּבְרֶגַע
  choice: et, en un instant
  rationale: רֶגַע désigne un laps de temps extrêmement bref. Cette formulation préserve le contraste entre toute une vie prospère et une descente soudaine au séjour des morts.
- source_word: שְׁאוֹל
  choice: shéol
  rationale: La translittération conserve l’étendue du concept hébreu, au lieu de le réduire à la tombe physique, à la mort elle-même ou à une conception ultérieure de l’enfer.
- source_word: יֵחָתּוּ
  choice: ils descendent
  rationale: En association avec שְׁאוֹל, le verbe est compris comme un mouvement descendant vers le domaine des morts. « Ils descendent » conserve explicitement cette image et reste naturel en français.
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: shéol
  alternative: la tombe, le séjour des morts ou la mort
  rationale: Le terme évoque la destination des morts dans la pensée hébraïque sans imposer une doctrine plus tardive de l’enfer. La translittération maintient cette ouverture conceptuelle et théologique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le contraste poétique entre une longue prospérité et une descente qui survient en un instant. Le marqueur de note est placé après « shéol », terme auquel la note se rapporte.
