  text: כִּ֤י תֹֽאמְר֗וּ אַיֵּ֥ה בֵית נָדִ֑יב וְ֝/אַיֵּ֗ה אֹ֤הֶל מִשְׁכְּנ֬וֹת רְשָׁעִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/028.yaml
  text: For you say[a], ‘Where is the house of the noble man, and where is the tent[b], the dwelling place of the wicked?’
translation:
  language: fr
  text: 'Car vous dites : « Où est la maison du notable[a], et où est la tente, les demeures des méchants[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du prince ». Le mot hébreu peut désigner un homme de haut rang ou un personnage princier, et pas seulement quelqu’un de généreux.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « la tente, les demeures des méchants ». Cette expression condensée peut désigner la tente où habitent les méchants ou présenter la tente comme leurs demeures.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction relie cette question à l’argument précédent et introduit l’explication donnée par Job.
- source_word: תֹאמְרוּ
  choice: vous dites
  rationale: L’imparfait hébreu exprime ici naturellement une parole caractéristique ou actuelle des interlocuteurs de Job.
- source_word: בֵית
  choice: maison
  rationale: Ce terme conserve l’image concrète de la résidence, sans préciser indûment s’il s’agit aussi de la maisonnée ou du domaine.
- source_word: נָדִיב
  choice: notable
  rationale: Dans ce contexte, le mot désigne vraisemblablement un homme de rang élevé plutôt qu’une personne simplement généreuse. « Notable » est naturel en français moderne et garde le sens social.
- source_word: אֹהֶל
  choice: tente
  rationale: Le sens concret ordinaire est conservé, même si le terme peut évoquer plus largement une habitation.
- source_word: מִשְׁכְּנוֹת רְשָׁעִים
  choice: la demeure des méchants
  rationale: Cette formulation française rend l’apposition explicative probable avec « tente ». Une note signale que l’hébreu emploie littéralement un pluriel et reste syntaxiquement condensé.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et soutenu. La coordination des deux questions et l’image de la tente sont conservées. L’expression hébraïque inhabituelle associant une tente au singulier et des demeures au pluriel est rendue lisiblement dans le texte, puis explicitée en note sans supprimer son ambiguïté.
