source:
  edition: WLC
  text: גַּם שָׂ֣ב גַּם יָשִׁ֣ישׁ בָּ֑/נוּ כַּבִּ֖יר מֵ/אָבִ֣י/ךָ יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/010.yaml
  text: Both the gray-haired and the aged are among us[a], older in days than your father.
translation:
  language: fr
  text: Parmi nous, il y a aussi bien des hommes aux cheveux blancs que des vieillards, plus avancés en âge que ton père.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « puissant, par rapport à ton père, en jours »; dans ce contexte, le sens est : « plus âgé que ton père ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם
  choice: aussi bien ... que
  rationale: La répétition établit une coordination emphatique entre deux catégories. Cette tournure française en restitue naturellement la force distributive.
- source_word: שָׂב
  choice: des hommes aux cheveux blancs
  rationale: Le terme désigne des personnes d’un âge avancé avec l’image concrète des cheveux blancs; cette formulation préserve cette nuance.
- source_word: יָשִׁישׁ
  choice: des vieillards
  rationale: Le mot évoque le grand âge et forme un parallèle avec שָׂב sans être rendu exactement de la même manière.
- source_word: בָּנוּ
  choice: parmi nous
  rationale: La préposition avec le suffixe de première personne du pluriel exprime ici l’appartenance au groupe ou au milieu d’Éliphaz.
- source_word: כַּבִּיר
  choice: plus avancés en âge
  rationale: Bien que le terme signifie généralement « grand » ou « puissant », la comparaison suivie de « jours » indique ici que ces hommes surpassent le père de Job par l’âge.
- source_word: מֵאָבִיךָ יָמִים
  choice: que ton père
  rationale: Le syntagme signifie littéralement une comparaison avec le père de Job « en jours »; en français, la notion de jours est naturellement exprimée par « avancés en âge ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Hommes aux cheveux blancs » conserve l’image concrète du premier terme hébreu, tandis que « vieillards » maintient le parallélisme sans confondre les deux désignations.
