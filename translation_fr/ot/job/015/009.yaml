  text: What do you know that we do not know? What do you understand that is not with us?[a]
translation:
  language: fr
  text: Que sais-tu que nous ne sachions pas ? Que comprends-tu qui ne soit pas aussi avec nous ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et qui ne soit pas avec nous ». Autre traduction : « que nous n’ayons pas aussi »; l’expression peut évoquer la possession ou le fait de disposer de quelque chose.'
    reason: L’expression hébraïque avec עִם (« avec ») est conservée dans le texte; la note indique l’interprétation possessive possible sans la privilégier.
lexical_decisions:
- source_word: מַה יָדַעְתָ וְלֹא נֵדָע
  choice: Que sais-tu que nous ne sachions pas ?
  rationale: La question rhétorique oppose directement le savoir de Job à celui de ses interlocuteurs. Le subjonctif français après la formulation interrogative exprime naturellement l’indéfini sans modifier le sens.
- source_word: תָבִין
  choice: Que comprends-tu
  rationale: Le verbe בין désigne ici la compréhension ou le discernement. « Comprendre » est clair, courant et maintient le parallélisme avec « savoir ».
- source_word: וְלֹא עִמָנוּ הוּא
  choice: qui ne soit aussi à notre portée
  rationale: L’hébreu dit littéralement que la chose comprise « n’est pas avec nous ». Dans ce contexte, « à notre portée » rend naturellement l’idée d’un savoir ou d’une compréhension dont les interlocuteurs disposeraient eux aussi, tandis qu’une note conserve la tournure concrète de l’original.
