  text: that you turn your spirit against God and bring words out of your mouth?[a]
translation:
  language: fr
  text: Car tu tournes ton esprit contre Dieu et tu fais sortir des paroles de ta bouche ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers Dieu ». L’hébreu dit littéralement « vers Dieu » ; « contre Dieu » explicite l’opposition suggérée par le contexte accusateur.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: pour que
  rationale: Dans la suite de la question commencée au verset précédent, כִּי introduit ce à quoi conduit l’attitude reprochée à Job. « Pour que » rend naturellement cette articulation en français, sans imposer une nouvelle phrase causale.
- source_word: תָשִׁיב
  choice: tu tournes
  rationale: Le hiphil de שוב exprime ici l’orientation de la disposition intérieure de Job. « Tourner » conserve l’image et s’emploie naturellement avec « esprit ».
- source_word: אֶל אֵל
  choice: contre Dieu
  rationale: אֶל signifie littéralement « vers » ou « en direction de ». Le contexte accusateur donne à cette orientation une valeur hostile, rendue dans le texte par « contre », tandis qu’une note préserve le sens formel possible.
- source_word: רוּחֶךָ
  choice: ton esprit
  rationale: רוּחַ désigne ici la disposition intérieure de Job plutôt que le vent ou le souffle physique. « Esprit » préserve l’ampleur du terme sans le réduire à la colère ou au tempérament.
- source_word: וְהֹצֵאתָ
  choice: et fasses sortir
  rationale: Le hiphil de יצא signifie littéralement « faire sortir ». Le subjonctif coordonné après « pour que » donne une syntaxe française naturelle tout en conservant l’image concrète.
- source_word: מִפִּיךָ
  choice: de ta bouche
  rationale: La préposition מִן indique la provenance. Avec « faire sortir », « de ta bouche » est idiomatique et fidèle à l’image hébraïque.
- source_word: מִלִּין
  choice: de telles paroles
  rationale: מִלִּין signifie « mots, paroles ». L’ajout contextuel de « telles » explicite en français la valeur accusatrice des paroles évoquées, sans préciser un contenu absent de l’hébreu.
theological_decisions:
- issue: Orientation de l’esprit de Job envers Dieu
  choice: contre Dieu
  alternative: vers Dieu
  rationale: Le contexte présente les propos de Job comme une opposition à Dieu, mais la préposition hébraïque exprime d’abord la direction. La traduction principale rend la force contextuelle et la note maintient l’ambiguïté lexicale.
translation_notes:
  register: Français moderne, courant et digne. La phrase reste liée à la question du verset précédent. L’image de l’esprit tourné et des paroles qui sortent de la bouche est conservée.
