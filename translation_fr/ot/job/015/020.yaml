  - severity: low
    issue: Nuance de la préposition dans « réservé à »
    rationale: « Pour l’homme violent » correspond plus directement à לֶעָרִיץ et évite de suggérer que la réserve constitue nécessairement un bénéfice qui lui est attribué.
