  text: כָּל יְמֵ֣י רָ֭שָׁע ה֣וּא מִתְחוֹלֵ֑ל וּ/מִסְפַּ֥ר שָׁ֝נִ֗ים נִצְפְּנ֥וּ לֶ/עָרִֽיץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/020.yaml
  text: All the days of the wicked man he writhes[c][b][a], and a number of years are stored up for the ruthless.
translation:
  language: fr
  text: Tout au long de ses jours, le méchant se tord dans l’angoisse[a], et un nombre d’années est mis en réserve[b] pour l’homme violent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est dans l’angoisse » ; le verbe hébreu peut évoquer le fait de se tordre, de trembler ou d’éprouver une angoisse comparable aux douleurs de l’accouchement.
    reason: lexical_alternative
  - marker: b
    text: Ou « est caché » ou « est réservé ».
    reason: lexical_alternative
  - marker: c
    text: L’expression hébraïque est au masculin singulier et présente la personne violente comme un type.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: Tous les jours
  rationale: L’expression construit une totalité temporelle. Cette formulation française est naturelle tout en restant proche de l’hébreu.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé masculin singulier présente ici le méchant comme un type individuel.
- source_word: הוּא
  choice: — (non exprimé séparément)
  rationale: Le pronom hébreu reprend ou souligne le sujet; en français, le sujet déjà exprimé suffit et sa répétition serait lourde.
- source_word: מִתְחוֹלֵל
  choice: se tord de douleur
  rationale: La forme verbale évoque un mouvement de torsion et une souffrance continue; cette expression restitue les dimensions corporelle et psychologique sans les réduire à une seule.
- source_word: וּמִסְפַּר שָׁנִים
  choice: et un nombre d’années
  rationale: La phrase désigne une durée comptée mais non précisée, en conservant l’indétermination de l’hébreu.
- source_word: נִצְפְּנוּ
  choice: est réservé
  rationale: Le nifal de צפן peut exprimer ce qui est caché, mis en réserve ou réservé. Le singulier s’accorde naturellement en français avec « un nombre ».
- source_word: לֶעָרִיץ
  choice: à l’homme violent
  rationale: עָרִיץ désigne une personne violente, impitoyable ou tyrannique. Cette traduction garde la force du terme sans lui imposer un sens exclusivement politique.
theological_decisions:
- issue: Nature des années destinées à l’homme violent
  choice: Maintenir la formulation « un nombre d’années est réservé » sans préciser s’il s’agit des années de vie ou de souffrance.
  alternative: « ses années sont comptées » ou « des années de tourment lui sont réservées »
  rationale: L’hébreu laisse implicite ce que représentent exactement ces années. La traduction préserve cette tension au lieu de l’expliciter.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme et l’ambiguïté de la seconde proposition sont conservés; les termes masculins singuliers reflètent la représentation typologique du texte hébreu.
