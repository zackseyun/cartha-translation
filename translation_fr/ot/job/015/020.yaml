  source_fidelity: La première proposition doit exprimer la durée totale (« tous les jours » au sens de toute l’existence du méchant), plutôt qu’une répétition quotidienne. « Se tord dans l’angoisse » rend de façon suffisamment directe le verbe hébreu, dont le champ couvre l’angoisse et les contorsions. La seconde proposition conserve l’indétermination quant à la nature des années et le passif de צפן.
  naturalness: « Tout au long de ses jours » est plus idiomatique et non ambigu en français moderne que « Tous les jours » dans ce contexte. « Un nombre d’années est mis en réserve » reste proche de la formulation source, tout en étant grammatical et lisible.
  terminology: « Le méchant » et « l’homme violent » reflètent les masculins singuliers typologiques רָשָׁע et עָרִיץ. « Mis en réserve » préserve l’image de ce qui est caché ou réservé sans déterminer si ces années sont des années de vie ou de souffrance.
