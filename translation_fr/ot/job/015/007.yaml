  text: הֲ/רִאישׁ֣וֹן אָ֭דָם תִּוָּלֵ֑ד וְ/לִ/פְנֵ֖י גְבָע֣וֹת חוֹלָֽלְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/007.yaml
  text: Were you born as the first man[a], and were you brought forth before the hills?
translation:
  language: fr
  text: Es-tu né le premier des hommes[a] ? As-tu été mis au monde avant les collines ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « le premier homme » et peut faire allusion à Adam, sans employer explicitement ce nom comme nom propre.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲ/רִאישׁוֹן אָדָם
  choice: comme le premier homme
  rationale: La particule interrogative introduit une question rhétorique, et רִאשׁוֹן exprime ici la priorité dans le temps. « Comme le premier homme » rend naturellement en français la valeur prédicative de l’expression sans transformer explicitement אָדָם en nom propre.
- source_word: תִּוָּלֵד
  choice: Es-tu né
  rationale: Le niphal de ילד signifie couramment « naître ». Le passé composé convient à une question française actuelle portant sur une naissance passée.
- source_word: וְ/לִ/פְנֵי גְבָעוֹת
  choice: avant les collines
  rationale: La préposition marque l’antériorité, tandis que גְבָעוֹת désigne directement les collines et conserve l’image poétique d’un relief primordial.
- source_word: חוֹלָלְתָּ
  choice: As-tu été mis au monde
  rationale: Le verbe évoque l’enfantement. « Être mis au monde » préserve cette image tout en distinguant l’expression du verbe « naître » employé dans le premier membre.
theological_decisions:
- issue: Faut-il comprendre אָדָם comme le nom propre Adam ou comme le nom commun « homme » ?
  choice: Le nom commun dans l’expression « le premier homme »
  alternative: « Adam, le premier homme »
  rationale: Le texte hébreu permet une allusion à Adam, mais n’impose pas ici de traiter אָדָם comme un nom propre. La traduction principale conserve donc la formulation générique et la note signale l’autre compréhension possible.
translation_notes:
  register: Français moderne, international et digne. Les deux questions rhétoriques parallèles sont conservées, avec deux expressions distinctes liées à la naissance afin de refléter la variation verbale de l’hébreu.
