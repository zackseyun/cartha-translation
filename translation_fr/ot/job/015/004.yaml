source:
  edition: WLC
  text: אַף אַ֭תָּה תָּפֵ֣ר יִרְאָ֑ה וְ/תִגְרַ֥ע שִׂ֝יחָ֗ה לִ/פְנֵי אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/004.yaml
  text: Indeed[c][b][a], you annul the fear of God and diminish meditation before God.
translation:
  language: fr
  text: Assurément, toi, tu abolis la crainte de Dieu[a] et tu entraves la méditation[b] devant Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « la crainte » ; dans ce contexte, il s’agit probablement de la crainte révérencielle envers Dieu. On pourrait aussi traduire : « tu sapes la crainte » ou « tu la rends sans effet ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « la prière », « le recueillement » ou « la plainte ». Le terme hébreu peut désigner une réflexion méditative ou une parole adressée à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Oui
  rationale: La particule a ici une valeur emphatique et renforce l’accusation d’Éliphaz. « Oui » rend cette insistance avec naturel en français.
- source_word: אַתָּה
  choice: toi, tu
  rationale: Le pronom indépendant souligne explicitement la personne visée. La dislocation « toi, tu » conserve cette emphase en français.
- source_word: תָּפֵר
  choice: tu abolis
  rationale: Le hiphil de פרר signifie briser, annuler ou rendre sans effet. « Abolir » préserve la force causative et tranchante de l’accusation.
- source_word: יִרְאָה
  choice: la crainte de Dieu
  rationale: Le nom signifie littéralement « crainte », mais le contexte religieux et le parallèle avec « devant Dieu » indiquent la crainte révérencielle dirigée vers Dieu. Le complément explicite cette référence implicite.
- source_word: וְתִגְרַע
  choice: et tu amoindris
  rationale: Le verbe גרע signifie diminuer, retrancher ou restreindre. « Amoindrir » convient à l’objet abstrait tout en conservant l’idée d’une réduction.
- source_word: שִׂיחָה
  choice: la méditation
  rationale: Le terme peut désigner la méditation, la prière, la plainte ou une parole réfléchie. « Méditation » maintient une certaine largeur de sens et convient à l’expression « devant Dieu ».
- source_word: לִפְנֵי אֵל
  choice: devant Dieu
  rationale: Traduction directe et naturelle de l’expression indiquant la présence de Dieu.
theological_decisions:
- issue: Sens religieux de יִרְאָה
  choice: la crainte de Dieu
  alternative: la crainte ; le respect révérenciel
  rationale: Il ne s’agit vraisemblablement pas d’une peur indéterminée, mais de l’attitude religieuse envers Dieu. « Crainte de Dieu » conserve le vocabulaire biblique sans réduire cette attitude à la seule terreur.
- issue: Portée de שִׂיחָה devant Dieu
  choice: la méditation
  alternative: la prière ; le recueillement ; la plainte
  rationale: Le mot hébreu reste polysémique. « Méditation » laisse ouvertes les dimensions de réflexion, de parole adressée à Dieu et même de plainte, plutôt que d’imposer une lecture exclusivement liturgique.
translation_notes:
  register: Français moderne, digne et direct. La reprise « toi, tu » restitue l’insistance du pronom hébreu. Le parallélisme poétique et la tension accusatrice sont conservés, tandis que les notes signalent les principales ambiguïtés lexicales.
