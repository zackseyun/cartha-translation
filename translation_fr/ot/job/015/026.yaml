  text: יָר֣וּץ אֵלָ֣י/ו בְּ/צַוָּ֑אר בַּ֝/עֲבִ֗י גַּבֵּ֥י מָֽגִנָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/026.yaml
  text: He rushes at him with his neck[a], with the thick bosses of his shields.
translation:
  language: fr
  text: Il fonce sur lui, le cou tendu[a], avec les épais renflements de ses boucliers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec le cou ». On peut aussi traduire : « Il court contre lui, le cou en avant, avec les épais renflements de ses boucliers. » L’image hébraïque est vive et condensée; la relation exacte entre l’assaillant et les boucliers n’est pas explicitée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרוּץ
  choice: il fonce
  rationale: Le verbe signifie « courir ». Dans ce contexte hostile, « foncer » exprime un mouvement rapide et agressif sans imposer un vocabulaire militaire trop technique.
- source_word: אֵלָיו
  choice: sur lui
  rationale: Avec un verbe de mouvement employé dans un contexte d’attaque, אֶל prend naturellement une valeur hostile ; « foncer sur lui » est idiomatique en français.
- source_word: בְּצַוָּאר
  choice: le cou tendu
  rationale: L’hébreu dit littéralement « avec le cou ». Le français exige ici une formulation plus naturelle ; « le cou tendu » restitue l’image d’un assaut résolu tout en signalant en note le caractère elliptique de l’original.
- source_word: בַּעֲבִי
  choice: épais
  rationale: עֳבִי exprime l’épaisseur ou la masse. « Épais » conserve directement cette notion.
- source_word: גַּבֵּי
  choice: renflements
  rationale: Le terme désigne ici vraisemblablement les parties bombées ou saillantes des boucliers. « Renflements » est précis et plus immédiatement compréhensible que le terme technique « umbos ».
- source_word: מָגִנָּיו
  choice: ses boucliers
  rationale: La forme hébraïque est un pluriel muni d’un suffixe masculin singulier ; le pluriel est donc conservé.
theological_decisions:
- issue: Référents des pronoms dans la scène d’affrontement
  choice: Conserver « il » et « lui » sans explicitation
  alternative: Identifier explicitement l’homme impie et Dieu
  rationale: Le verset isolé emploie des pronoms, tandis que le contexte présente une attaque contre Dieu. Ajouter les référents dans le texte résoudrait une donnée que l’hébreu laisse implicite.
- issue: Rapport syntaxique de l’image des boucliers
  choice: « derrière les épais renflements »
  alternative: « avec les épais renflements »
  rationale: La préposition בְּ peut décrire ici la manière ou le moyen de l’assaut. « Derrière » rend naturellement l’image du combattant qui charge protégé par ses boucliers, sans supprimer l’ambiguïté, laquelle est indiquée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Fonce » rend l’élan hostile ; « renflements » évite le terme technique rare « umbos ». La formulation conserve les pronoms et le pluriel surprenant « boucliers » de l’hébreu.
