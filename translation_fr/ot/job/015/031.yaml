  text: אַל יַאֲמֵ֣ן ב/שו נִתְעָ֑ה כִּי שָׁ֝֗וְא תִּהְיֶ֥ה תְמוּרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/031.yaml
  text: Let him not trust in emptiness[a], deceiving himself[c][b], for emptiness will be his recompense.
translation:
  language: fr
  text: 'Qu’il ne mette pas sa confiance dans ce qui est vain : il est égaré[a], car ce qui est vain sera ce qu’il recevra en retour[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «il s’égare», «il est trompé» ou «il est dans l’illusion». L’hébreu peut décrire le fait d’être égaré sans préciser explicitement qu’il se trompe lui-même.
    reason: lexical_alternative
  - marker: b
    text: L’expression traduite deux fois par «ce qui est vain» peut aussi désigner le vide, la fausseté ou ce qui ne vaut rien. La répétition du même mot hébreu est conservée.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יַאֲמֵן
  choice: Qu’il ne mette pas sa confiance
  rationale: La particule négative avec l’inaccompli exprime ici une mise en garde; le hiphil de אמן désigne le fait de placer sa confiance en quelque chose.
- source_word: בַשָּׁוְא / שָׁוְא
  choice: dans ce qui est vain / ce qui est vain
  rationale: שָׁוְא peut évoquer la vanité, le vide, la fausseté ou ce qui ne vaut rien. «Ce qui est vain» reste naturel en français et la répétition préserve l’effet rhétorique de l’hébreu.
- source_word: נִתְעָה
  choice: en se laissant égarer
  rationale: Le niphal de תעה peut signifier être égaré, se fourvoyer ou être dans l’illusion. Cette formulation conserve l’ambiguïté entre égarement subi et implication du sujet, sans imposer l’idée explicite qu’il se trompe lui-même.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison ou la conséquence qui fonde la mise en garde.
- source_word: תִּהְיֶה תְמוּרָתוֹ
  choice: sera ce qu’il recevra en retour
  rationale: תְּמוּרָה désigne un échange, un remplacement ou ce qui est obtenu en retour. La formulation française rend ici le résultat reçu sans surcharger le terme d’une idée judiciaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais accessible. La tournure «Qu’il ne mette pas» garde la valeur de mise en garde à la troisième personne. «Ce qu’il recevra en retour» est préféré à «récompense», qui pourrait suggérer trop nettement une rétribution positive ou judiciaire.
