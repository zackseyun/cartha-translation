    issue: Nuance potentiellement ajoutée par « en se laissant égarer »
    rationale: Le niphal נִתְעָה décrit l’état d’une personne égarée ou trompée; il ne dit pas nécessairement qu’elle consent à cet égarement. « Se laisser égarer » peut suggérer une participation volontaire et réduit l’ambiguïté du texte source.
