  yaml_path: translation/ot/job/015/003.yaml
  text: Should he argue with useless words[a], or with speech that does no good?
translation:
  language: fr
  text: Va-t-il argumenter avec des propos inutiles[a], avec des paroles qui ne servent à rien ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Va-t-il raisonner au moyen d’un discours sans profit, avec des paroles par lesquelles il ne peut faire aucun bien ? »
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ
  choice: argumenter
  rationale: Le participe hiphil de יכח peut exprimer l’idée d’argumenter, de raisonner ou de reprendre. Dans ce débat, « argumenter » rend naturellement la critique qu’Élifaz adresse à Job sans imposer une nuance judiciaire.
- source_word: בְּדָבָר לֹא יִסְכּוֹן
  choice: avec des propos inutiles
  rationale: דָבָר désigne ici le discours, en parallèle avec מִלִּים. סכן exprime l’utilité ou le profit ; « propos inutiles » restitue avec concision l’idée de paroles qui n’apportent aucun bénéfice.
- source_word: וּמִלִּים
  choice: avec des paroles
  rationale: מִלִּים signifie « paroles » ou « mots ». « Paroles » préserve le parallélisme tout en évitant une répétition maladroite avec « propos ».
- source_word: לֹא יוֹעִיל בָּם
  choice: qui ne servent à rien
  rationale: Le hiphil de יעל signifie procurer un avantage, être utile ou faire du bien. Le suffixe de בָּם renvoie vraisemblablement aux paroles ; la formulation française exprime leur inefficacité.
