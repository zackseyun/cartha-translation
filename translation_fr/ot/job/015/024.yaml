- from: La détresse et l’angoisse le terrifient ; elles fondent sur lui comme un roi prêt à l’assaut.[a]
  to: La détresse et l’angoisse le terrifient ; elles l’emportent sur lui comme un roi prêt à l’attaque.[a]
