  text: יְֽ֭בַעֲתֻ/הוּ צַ֣ר וּ/מְצוּקָ֑ה תִּ֝תְקְפֵ֗/הוּ כְּ/מֶ֤לֶךְ עָתִ֬יד לַ/כִּידֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/024.yaml
  text: Distress and anguish terrify him[a]; they overpower him like a king ready for battle.
translation:
  language: fr
  text: La détresse et l’angoisse le terrifient ; elles l’emportent sur lui comme un roi prêt à l’attaque.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un roi prêt au combat ». Le terme hébreu traduit par « attaque » est rare et son sens précis est incertain ; il peut désigner plus particulièrement une attaque armée.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַעֲתֻהוּ
  choice: le terrifient
  rationale: Le piel de בעת exprime le fait de provoquer une vive terreur ; « terrifient » en conserve la force causative.
- source_word: צַר וּמְצוּקָה
  choice: la détresse et l’angoisse
  rationale: Ces deux termes évoquent l’adversité oppressante et l’état d’extrême resserrement. Ce couple naturel en français préserve le parallélisme poétique sans répétition plate.
- source_word: תִּתְקְפֵהוּ
  choice: elles fondent sur lui
  rationale: תקף indique ici une action puissante contre quelqu’un, pouvant signifier saisir, assaillir ou dominer. « Fondent sur lui » s’accorde naturellement avec la comparaison militaire qui suit et conserve l’intensité de l’image.
- source_word: כְּמֶלֶךְ
  choice: comme un roi
  rationale: Rend directement la comparaison introduite par כ.
- source_word: עָתִיד
  choice: prêt
  rationale: Dans ce contexte, le mot indique que le roi est préparé ou disposé à agir.
- source_word: לַכִּידוֹר
  choice: à l’assaut
  rationale: כידור est un mot rare et incertain, mais le contexte favorise une action militaire. « À l’assaut » conserve cette nuance sans imposer le sens plus général de « bataille ».
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. La personnification de la détresse et de l’angoisse ainsi que la comparaison militaire sont conservées. Le féminin pluriel « elles » reprend naturellement les deux noms français, malgré le verbe hébreu au féminin singulier.
