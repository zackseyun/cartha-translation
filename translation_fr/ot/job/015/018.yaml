  yaml_path: translation/ot/job/015/018.yaml
  text: what wise men declare[a], and have not hidden from their fathers—
translation:
  language: fr
  text: ce que les sages proclament[a] et n’ont pas caché à leurs pères —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « ce que leurs pères n’ont pas caché » ou « et n’ont rien caché de ce qu’ils avaient reçu de leurs pères ». L’hébreu permet plusieurs façons de comprendre le rapport entre « caché » et « leurs pères ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ce que
  rationale: Introduit le contenu transmis, dans le prolongement du verset précédent; « ce que » rend naturellement la proposition relative en français.
- source_word: חֲכָמִים
  choice: les sages
  rationale: Désigne concrètement les hommes reconnus pour leur sagesse; en français, « les sages » est naturel, digne et suffisamment précis.
- source_word: יַגִּידוּ
  choice: proclament
  rationale: Le hiphil de נגד exprime l’action de faire connaître ou d’annoncer; « proclament » convient au registre élevé et à la transmission publique d’un enseignement.
- source_word: וְלֹא
  choice: et n’ont pas
  rationale: Coordonne et nie la seconde action; le passé composé français exprime naturellement l’action accomplie dont le contenu est transmis.
- source_word: כִחֲדוּ
  choice: caché
  rationale: Le verbe signifie cacher ou dissimuler; « caché » est courant et conserve l’image hébraïque sans surinterprétation.
- source_word: מֵאֲבוֹתָם
  choice: de leurs pères
  rationale: 'Cette formulation reproduit la relation compacte exprimée par מִן et préserve l’ambiguïté: les pères peuvent être compris comme la source de la tradition ou comme les personnes auxquelles rien n’a été caché.'
theological_decisions:
- issue: Rapport syntaxique entre מֵאֲבוֹתָם et כִחֲדוּ
  choice: de leurs pères
  alternative: « ce que leurs pères n’ont pas caché » ou « sans rien cacher de ce qu’ils avaient reçu de leurs pères »
  rationale: L’hébreu est compact et permet plusieurs analyses. Le texte principal conserve cette ambiguïté plutôt que de préciser silencieusement si les pères sont la source de l’enseignement ou les personnes auxquelles il n’a pas été caché.
translation_notes:
  register: Français international moderne, sobre et digne. Le présent « proclament » conserve la portée générale de l’énoncé, tandis que le passé composé « n’ont pas caché » rend naturellement la seconde forme verbale. Le tour volontairement compact « caché de leurs pères » est moins explicite qu’une paraphrase, mais il maintient l’ambiguïté réelle de l’hébreu; la note en expose les principales lectures.
