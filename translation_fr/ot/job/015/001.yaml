  text: 'Then Eliphaz the Temanite answered and said:'
translation:
  language: fr
  text: 'Éliphaz le Témanite répondit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Le verbe ענה introduit ici la réplique d’Éliphaz dans le dialogue. « Répondit » rend naturellement la formule narrative hébraïque en français.
- source_word: אֱלִיפַז
  choice: Éliphaz
  rationale: Translittération française traditionnelle et courante du nom propre hébreu.
- source_word: הַתֵּימָנִי
  choice: le Témanite
  rationale: Le gentilé identifie Éliphaz comme originaire de Témân. « Le Témanite » est concis et conforme à l’usage biblique français.
- source_word: וַיֹּאמַר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles qui suivent. Ils rendent la fonction de וַיֹּאמַר sans la lourdeur de « répondit et dit ».
- source_word: וַ
  choice: enchaînement narratif non explicité
  rationale: Le waw marque la progression du dialogue. Après le discours précédent, l’ordre des phrases suffit en français à exprimer cet enchaînement sans ajouter « alors ».
