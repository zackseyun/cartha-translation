source:
  edition: WLC
  text: לֹֽא יֶ֭עְשַׁר וְ/לֹא יָק֣וּם חֵיל֑/וֹ וְ/לֹֽא יִטֶּ֖ה לָ/אָ֣רֶץ מִנְלָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/029.yaml
  text: He will not become rich[a], and his wealth will not endure[b], and his produce will not bend down to the earth.
translation:
  language: fr
  text: Il ne s’enrichira pas, sa fortune ne subsistera pas, et leur récolte[a] ne ploiera pas jusqu’à terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs biens », « leur gain » ou « leur abondance ». Le mot hébreu est rare et de sens incertain; il porte ici un suffixe pluriel (« leur »), après des formes au singulier.
    reason: lexical_alternative
  - marker: b
    text: La dernière proposition peut évoquer une récolte ou des branches qui, faute d’abondance, ne ploient pas jusqu’à terre. D’autres comprennent plus généralement que ses biens ne s’étendront pas sur le pays.
    reason: alternative_reading
lexical_decisions:
- source_word: יֶעְשַׁר
  choice: il ne s’enrichira pas
  rationale: Le qal de עשר exprime ici l’acquisition de richesses plutôt qu’un simple état. « S’enrichira » restitue naturellement cette valeur dynamique.
- source_word: יָקוּם
  choice: ne subsistera pas
  rationale: Le sens premier est « se tenir, rester debout », mais, avec la fortune comme sujet, le verbe indique qu’elle ne se maintiendra pas. « Subsister » conserve l’idée de durée et de stabilité.
- source_word: חֵילוֹ
  choice: sa fortune
  rationale: חַיִל peut désigner la force, les ressources ou les richesses. Dans ce contexte, « fortune » exprime clairement les biens accumulés par l’homme évoqué.
- source_word: יִטֶּה
  choice: ne ploiera pas
  rationale: נטה peut signifier incliner, étendre ou déployer. Avec une récolte et la mention de la terre, « ployer » préserve l’image concrète d’une production abondante qui s’abaisse sous son poids.
- source_word: מִנְלָם
  choice: leur récolte
  rationale: Ce terme rare et incertain porte un suffixe pluriel (« leur »), malgré le référent singulier des propositions précédentes. « Récolte » donne un sens cohérent à l’image de ce qui ploie jusqu’à terre, tandis qu’une note conserve les autres possibilités.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et littéraire. La formulation conserve l’image agricole possible ainsi que le passage inattendu du singulier au possessif pluriel dans l’hébreu, sans résoudre silencieusement l’incertitude du dernier terme.
