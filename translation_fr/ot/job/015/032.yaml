  text: בְּֽ/לֹא י֭וֹמ/וֹ תִּמָּלֵ֑א וְ֝/כִפָּת֗/וֹ לֹ֣א רַעֲנָֽנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/032.yaml
  text: It will be paid in full before his time[b][a], and his branch will not stay green.
translation:
  language: fr
  text: Avant son heure, cela sera mené à son terme[a], et sa branche ne restera pas verdoyante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « cela sera accompli avant son heure » ou « son dû lui sera payé intégralement avant son heure ». Le verbe hébreu signifie littéralement « être rempli » ou « être complet », et sa nuance exacte ici est discutée.'
    reason: lexical_alternative
  - marker: b
    text: Ou « sa palme » ou « sa pousse supérieure ». Le terme hébreu désigne une partie d’arbre ou de plante comparable à une branche.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֹא יוֹמוֹ
  choice: avant son heure
  rationale: L’expression signifie littéralement « pas en son jour »; en français idiomatique, « avant son heure » exprime naturellement l’idée d’une échéance prématurée.
- source_word: תִּמָּלֵא
  choice: cela sera mené à son terme
  rationale: Le niphal de מלא signifie littéralement « être rempli, être complet ». Cette formulation conserve l’idée d’achèvement sans imposer le sens financier de « payer intégralement »; le pronom neutre maintient aussi l’implicite du texte hébreu.
- source_word: כִפָּתוֹ
  choice: sa branche
  rationale: Le nom désigne une partie ramifiée ou une pousse supérieure d’un arbre ou d’une plante. « Branche » préserve l’image végétale sans préciser indûment qu’il s’agit d’un palmier.
- source_word: לֹא רַעֲנָנָה
  choice: ne restera pas verdoyante
  rationale: רענן évoque la fraîcheur, la vigueur et la verdure de la végétation. « Verdoyante » garde cette image concrète dans un français naturel.
theological_decisions:
- issue: Nature de ce qui arrive prématurément au méchant
  choice: Maintenir un sujet implicite avec « cela »
  alternative: « Son dû lui sera payé intégralement » ou « sa rétribution sera complète »
  rationale: Le contexte peut suggérer la rétribution du méchant, mais le verset ne la nomme pas explicitement. La traduction évite donc de transformer cette lecture contextuelle en affirmation explicite.
translation_notes:
  register: Français international moderne, digne et accessible. « Mené à son terme » rend le verbe de manière non financière tout en conservant son idée d’achèvement; « verdoyante » maintient l’image végétale.
