  text: יַרְשִֽׁיעֲ/ךָ֣ פִ֣י/ךָ וְ/לֹא אָ֑נִי וּ֝/שְׂפָתֶ֗י/ךָ יַעֲנוּ בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/006.yaml
  text: Your own mouth condemns you[a], and not I; your own lips testify against you.
translation:
  language: fr
  text: C’est ta propre bouche qui te condamne, et non pas moi ; tes propres lèvres témoignent contre toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « répondent contre toi ». Le verbe hébreu signifie plus littéralement « répondre », mais il semble avoir ici le sens judiciaire de témoigner.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְשִׁיעֲךָ
  choice: te condamne
  rationale: Le hiphil de רשע signifie ici « déclarer coupable, condamner ». Cette formulation naturelle conserve la portée judiciaire de l’accusation d’Éliphaz.
- source_word: פִיךָ
  choice: ta propre bouche
  rationale: Le texte dit littéralement « ta bouche ». « Propre » explicite sans lourdeur l’opposition avec « et non pas moi » et souligne que Job s’incrimine par ses paroles.
- source_word: וְלֹא אָנִי
  choice: et non pas moi
  rationale: Cette tournure préserve le contraste direct et appuyé du texte hébreu.
- source_word: וּשְׂפָתֶיךָ
  choice: tes propres lèvres
  rationale: Littéralement « tes lèvres ». « Propres » maintient le parallélisme avec la première proposition et l’idée d’auto-incrimination.
- source_word: יַעֲנוּ
  choice: témoignent
  rationale: 'Bien que le verbe ענה signifie couramment « répondre », le contexte judiciaire autorise ici « témoigner » : les paroles de Job sont présentées comme déposant contre lui.'
- source_word: בָךְ
  choice: contre toi
  rationale: Avec la nuance judiciaire du verbe, la préposition exprime naturellement une déposition à charge.
