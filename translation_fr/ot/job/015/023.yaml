source:
  edition: WLC
  text: נֹ֘דֵ֤ד ה֣וּא לַ/לֶּ֣חֶם אַיֵּ֑ה יָדַ֓ע כִּֽי נָכ֖וֹן בְּ/יָד֣/וֹ יֽוֹם חֹֽשֶׁךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/023.yaml
  text: He wanders about for bread[a], saying[b], ‘Where is it?’ He knows that a day of darkness is ready at hand for him.
translation:
  language: fr
  text: 'Il erre en quête de pain[a] : « Où est-il ? » Il sait qu’un jour de ténèbres est prêt, tout près de lui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « pain » peut aussi désigner la nourriture en général.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans sa main » ; l’expression suggère probablement que ce jour est prêt et tout proche de lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹדֵד
  choice: Il erre
  rationale: Le participe qal exprime une errance continue et sans repos. « Il erre » rend naturellement cette action sans préciser indûment qu’il s’agit d’exil ou de fuite.
- source_word: לַלֶּחֶם
  choice: en quête de pain
  rationale: לֶחֶם désigne littéralement le pain, avec le sens possible de nourriture en général. « En quête de » exprime ici une recherche pressante tout en conservant l’image concrète du pain.
- source_word: אַיֵּה
  choice: Où est-il ?
  rationale: L’interrogatif signifie « où ? ». Le pronom masculin renvoie naturellement au « pain » en français et restitue la formulation brève de l’hébreu.
- source_word: יָדַע
  choice: Il sait
  rationale: Le parfait de ידע indique une connaissance assurée. La traduction directe « Il sait » préserve cette force.
- source_word: נָכוֹן
  choice: est prêt
  rationale: Cette forme adjectivale ou passive évoque ce qui est préparé, établi et imminent. « Est prêt » conserve cette nuance sans expliciter la nature du malheur.
- source_word: בְּיָדוֹ
  choice: à ses côtés
  rationale: Littéralement « dans sa main », l’expression situe ici vraisemblablement le jour de ténèbres tout près de l’homme, prêt à le toucher. « À ses côtés » communique cette proximité sans suggérer qu’il le maîtrise.
- source_word: יוֹם חֹשֶׁךְ
  choice: un jour de ténèbres
  rationale: Le groupe construit désigne un jour caractérisé par les ténèbres. Cette traduction garde l’image hébraïque et ne la réduit pas à une explication comme « malheur » ou « jugement ».
theological_decisions:
- issue: Portée métaphorique du « jour de ténèbres »
  choice: Conserver « un jour de ténèbres » sans l’identifier explicitement à un jugement divin.
  alternative: un jour de malheur / le jour du châtiment
  rationale: Dans le discours d’Élifaz, l’expression évoque probablement la catastrophe qui menace le méchant, mais l’hébreu demeure imagé et ne nomme pas directement un jugement divin. La traduction maintient donc cette tension.
- issue: Rapport exprimé par בְּיָדוֹ
  choice: Comprendre l’expression comme indiquant que ce jour est tout proche de lui.
  alternative: « dans sa main », ce qui pourrait suggérer qu’il le possède ou le maîtrise
  rationale: Le contexte présente une menace imminente pour l’homme, non un événement placé sous son contrôle. La note conserve toutefois le sens littéral de l’expression.
translation_notes:
  register: Français international moderne, sobre et digne. « En quête de » garde la concision poétique du vers tout en restant courant ; la question directe et l’image des ténèbres préservent la tension du texte hébreu.
