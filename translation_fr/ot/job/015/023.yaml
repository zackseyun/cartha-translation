revisions:
- from: 'Il erre en quête de pain[a] : « Où est-il ? » Il sait qu’un jour de ténèbres est prêt à ses côtés[b].'
  to: 'Il erre en quête de pain[a] : « Où est-il ? » Il sait qu’un jour de ténèbres est prêt, tout près de lui[b].'
  rationale: La seule correction nécessaire remplace « à ses côtés » par « tout près de lui » et coordonne cette proximité avec « est prêt ». Cette formulation rend plus fidèlement l’imminence exprimée par l’hébreu, sans prétendre résoudre entièrement la valeur idiomatique disputée de בְּיָדוֹ ni expliciter les ténèbres comme un jugement divin.
