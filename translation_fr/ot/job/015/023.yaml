    rationale: « À ses côtés » décrit une simple position latérale et ne rend pas bien l’idiome littéral « dans sa main », qui, dans ce contexte, souligne la proximité menaçante ou l’imminence. Il faut éviter également une formulation qui suggérerait que l’homme contrôle ce jour.
