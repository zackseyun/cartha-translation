  source_fidelity: 'Le texte rend fidèlement les deux membres du verset : הֵן est bien marqué par « Voici », לֹא יַאֲמִין par « il ne fait pas confiance », et « les cieux ne sont pas purs à ses yeux » reproduit avec justesse le parallélisme, la pluralité de שָׁמַיִם et l’évaluation exprimée par בְּעֵינָיו. « À ses saints » est une construction française correcte pour le complément de « faire confiance » et rend l’orientation relationnelle de בְּקְדֹשָׁיו.'
