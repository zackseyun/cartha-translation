source:
  edition: WLC
  text: הֵ֣ן ב/קדש/ו לֹ֣א יַאֲמִ֑ין וְ֝/שָׁמַ֗יִם לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/015.yaml
  text: Look[a], he puts no trust even in his holy ones, and the heavens are not pure in his eyes.
translation:
  language: fr
  text: Voici, il ne fait pas confiance même à ses saints[a], et les cieux ne sont pas purs à ses yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses êtres saints ». L’hébreu dit littéralement « ses saints »; il s’agit probablement ici d’êtres célestes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: Introduit avec dignité une affirmation emphatique et attire l’attention, sans alourdir le vers poétique.
- source_word: בִּקְדֹשָׁיו
  choice: à ses saints
  rationale: Rend littéralement « ses saints » ou « ses êtres saints ». Le contexte et le parallélisme avec « les cieux » orientent probablement vers des êtres célestes, mais la formulation conserve l’ambiguïté du terme hébreu.
- source_word: לֹא יַאֲמִין
  choice: il ne fait pas confiance
  rationale: Le hiphil de אמן exprime ici le fait d’accorder sa confiance; cette tournure française est naturelle et conserve le sens relationnel.
- source_word: וְשָׁמַיִם
  choice: et les cieux
  rationale: Respecte le pluriel hébreu et le parallélisme poétique.
- source_word: לֹא זַכּוּ
  choice: ne sont pas purs
  rationale: Dans ce contexte, זכה évoque la pureté plutôt que l’innocence judiciaire.
- source_word: בְּעֵינָיו
  choice: à ses yeux
  rationale: Préserve l’image hébraïque de l’évaluation divine dans une expression française idiomatique.
theological_decisions:
- issue: Référent de « ses saints »
  choice: Maintenir « ses saints » dans le texte, avec une note indiquant qu’il s’agit probablement d’êtres célestes
  alternative: Traduire explicitement « ses êtres saints » ou « ses anges »
  rationale: Le parallélisme avec « les cieux » suggère fortement des êtres célestes, mais l’hébreu ne dit pas explicitement « anges ». La traduction préserve donc l’étendue lexicale et la tension du texte.
translation_notes:
  register: Français international moderne, poétique et digne. « Voici » marque l’emphase du discours; « à ses yeux » conserve l’image de l’original.
