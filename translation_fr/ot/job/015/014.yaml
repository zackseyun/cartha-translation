id: JOB.15.14
reference: Job 15:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מָֽה אֱנ֥וֹשׁ כִּֽי יִזְכֶּ֑ה וְ/כִֽי יִ֝צְדַּ֗ק יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/014.yaml
  text: What is man[a], that he should be pure, or one born of a woman[c][b], that he should be righteous?
translation:
  language: fr
  text: Qu’est-ce que l’être humain[a], pour qu’il soit pur[b], et celui qui est né d’une femme, pour qu’il soit juste[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « l’homme mortel ». Le mot hébreu souligne la fragilité de la condition humaine.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sans tache » ou « innocent ». Le verbe hébreu peut évoquer la pureté aussi bien que l’absence de faute.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « dans son droit ». Le verbe hébreu peut désigner le fait d’être juste ou d’avoir raison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Qu’est-ce que
  rationale: Introduit une question rhétorique sur la condition ou la valeur de l’être humain ; cette tournure française restitue naturellement la construction hébraïque.
- source_word: אֱנוֹשׁ
  choice: l’être humain
  rationale: Le nom désigne ici l’être humain mortel et fragile. « L’être humain » conserve la portée générique du singulier sans limiter le propos aux hommes de sexe masculin.
- source_word: כִּי
  choice: pour qu’il
  rationale: Après l’interrogatif, כִּי introduit ce qui paraît inconcevable dans la question rhétorique. « Pour qu’il » rend cette relation avec naturel en français.
- source_word: יִזְכֶּה
  choice: soit pur
  rationale: Le qal de זכה exprime le fait d’être pur, net ou exempt de faute. « Pur » convient au chevauchement des nuances morales et cultuelles dans ce contexte.
- source_word: וְכִי
  choice: et
  rationale: La conjonction hébraïque relie deux membres poétiques parallèles. « Et » en conserve la forme cumulative sans transformer explicitement le parallélisme en alternative.
- source_word: יִצְדַּק
  choice: soit juste
  rationale: Le qal de צדק décrit ici l’état de celui qui est juste ou reconnu dans son droit. « Soit juste » garde la largeur du terme sans imposer un sens technique de justification.
- source_word: יְלוּד אִשָּׁה
  choice: celui qui est né d’une femme
  rationale: Cette expression idiomatique désigne l’être humain dans sa condition mortelle. La formulation française conserve le singulier représentatif et l’image hébraïque.
theological_decisions:
- issue: Portée anthropologique de אֱנוֹשׁ et יְלוּד אִשָּׁה
  choice: Le singulier générique « l’être humain » et l’expression « celui qui est né d’une femme », visant l’humanité en général
  alternative: « L’homme » et « un fils de femme »
  rationale: Les formes hébraïques sont masculines singulières, mais leur portée est générique. La traduction retenue exprime clairement cette portée tout en préservant le parallélisme et l’image de la naissance humaine.
- issue: Nuance morale ou judiciaire de יִצְדַּק
  choice: « soit juste »
  alternative: « soit dans son droit » ou « soit déclaré juste »
  rationale: Le contexte poétique porte sur la pureté et la justice humaines sans exiger une interprétation judiciaire technique. « Juste » maintient cette amplitude sémantique.
- issue: Relation entre les deux membres introduits par כִּי et וְכִי
  choice: Parallélisme cumulatif rendu par « et »
  alternative: Parallélisme présenté comme une alternative avec « ou »
  rationale: Le texte hébreu porte explicitement la conjonction וְ. Le français « et » préserve cette donnée tout en laissant apparaître l’équivalence poétique des deux questions.
translation_notes:
  register: Français international moderne, sobre et poétique. La structure en deux membres parallèles est conservée, avec un vocabulaire accessible et digne. Le singulier générique est rendu sans masculinisation inutile, tandis que l’expression imagée « né d’une femme » reste intacte.
