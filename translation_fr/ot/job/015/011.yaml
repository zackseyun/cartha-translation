  text: הַ/מְעַ֣ט מִ֭מְּ/ךָ תַּנְחֻמ֣וֹת אֵ֑ל וְ֝/דָבָ֗ר לָ/אַ֥ט עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/011.yaml
  text: Are the consolations of God too small for you[a], or a word spoken gently to you?
translation:
  language: fr
  text: Les consolations de Dieu et une parole qui t’est dite avec douceur sont-elles si peu de chose pour toi[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Les consolations de Dieu sont-elles trop peu de chose pour toi, et une parole qui t’est dite avec douceur ? »'
    reason: La syntaxe hébraïque place d’abord « les consolations de Dieu », puis coordonne « une parole [dite] avec douceur »; la question peut être rendue en français par une coordination de deux sujets ou par une reprise elliptique du prédicat.
lexical_decisions:
- source_word: הַמְעַט
  choice: sont-elles trop peu de chose
  rationale: L’interrogation rhétorique demande si Job tient ces consolations pour insuffisantes ou négligeables. Cette tournure française conserve ces deux nuances.
- source_word: מִמְּךָ
  choice: pour toi
  rationale: 'Dans cette construction, la préposition marque le rapport à la personne concernée : « trop peu de chose pour toi ».'
- source_word: תַּנְחֻמוֹת
  choice: les consolations
  rationale: Le pluriel désigne les paroles ou les actes qui apportent du réconfort ; « consolations » en conserve le nombre et le registre digne.
- source_word: אֵל
  choice: de Dieu
  rationale: אֵל est ici le titre divin et désigne Dieu.
- source_word: וְדָבָר
  choice: ainsi qu’une parole
  rationale: Le waw coordonne un second élément de la question. « Ainsi que » préserve cette coordination sans imposer la valeur disjonctive « ou », qui n’est pas explicite en hébreu.
- source_word: לָאַט
  choice: dite avec douceur
  rationale: L’adverbe exprime une manière douce ou discrète ; le participe « dite » explicite en français l’acte de parole sous-entendu.
- source_word: עִמָּךְ
  choice: auprès de toi
  rationale: Cette formulation garde la valeur fondamentale de proximité ou d’accompagnement de עִם, tout en restant naturelle avec une parole adressée à Job.
theological_decisions:
- issue: Rapport entre « les consolations de Dieu » et « une parole dite avec douceur »
  choice: Conserver deux éléments coordonnés par « ainsi que »
  alternative: Lire la seconde expression comme une apposition ou une explication des consolations
  rationale: La syntaxe hébraïque permet une tension entre coordination et explicitation. La traduction ne réduit pas explicitement la parole douce aux consolations divines.
translation_notes:
  register: Français moderne, digne et intelligible. La tournure rhétorique est conservée, de même que la coordination ambiguë du texte hébreu.
