    issue: Construction verbale de « se remplir le ventre »
    rationale: L’hébreu emploie « remplir » avec « son ventre » comme complément direct. En français, « remplir son ventre de vent d’est » restitue mieux la syntaxe et l’image, tandis que « se remplir le ventre » est sensiblement moins élégant dans ce contexte.
