  text: הֶֽ/חָכָ֗ם יַעֲנֶ֥ה דַֽעַת ר֑וּחַ וִֽ/ימַלֵּ֖א קָדִ֣ים בִּטְנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/002.yaml
  text: Should a wise man answer with windy knowledge[a], and fill his belly with the east wind?
translation:
  language: fr
  text: Un sage devrait-il répondre par un savoir qui n’est que du vent[a], et remplir son ventre de vent d’est ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un savoir de vent », c’est-à-dire un savoir vide ou sans consistance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָכָם
  choice: un sage
  rationale: L’article interrogatif introduit une question rhétorique. Le masculin singulier est conservé, avec une portée générale.
- source_word: יַעֲנֶה
  choice: devrait-il répondre
  rationale: Dans cette question rhétorique, l’imparfait exprime ce qui conviendrait ou serait attendu; « devrait-il » restitue la force du reproche.
- source_word: דַעַת רוּחַ
  choice: un savoir qui n’est que du vent
  rationale: La construction signifie littéralement « savoir de vent ». Cette formulation conserve l’image du vent tout en rendant naturellement en français l’idée d’un savoir vide ou sans consistance.
- source_word: וִימַלֵּא
  choice: et se remplir
  rationale: Le verbe poursuit la question rhétorique. La tournure pronominale est idiomatique en français avec le complément corporel « le ventre ».
- source_word: קָדִים
  choice: du vent d’est
  rationale: Le terme désigne le vent d’est, souvent desséchant ou destructeur, mais le texte ne précise pas ici explicitement ces qualités.
- source_word: בִּטְנוֹ
  choice: le ventre
  rationale: Le choix conserve l’image corporelle concrète de l’hébreu; avec « se remplir », le français emploie naturellement l’article défini.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La question rhétorique et les deux images liées au vent sont préservées sans expliciter davantage la portée polémique d’Élifaz.
