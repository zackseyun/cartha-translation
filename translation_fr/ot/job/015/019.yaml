  text: לָ/הֶ֣ם לְ֭/בַדָּ/ם נִתְּנָ֣ה הָ/אָ֑רֶץ וְ/לֹא עָ֖בַר זָ֣ר בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/019.yaml
  text: To them alone the land was given[b][a], and no stranger passed among them.
translation:
  language: fr
  text: À eux seuls le pays fut donné[a], et aucun étranger ne passa au milieu d’eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la terre ». Le mot hébreu אֶרֶץ peut avoir les deux sens ; « pays » convient ici à l’idée d’un territoire donné exclusivement à un peuple.
    reason: lexical_alternative
  - marker: b
    text: Ou « et aucun étranger ne passa en leur sein ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֶם לְבַדָּם
  choice: À eux seuls
  rationale: Cette tournure française exprime naturellement l’attribution exclusive marquée par לָהֶם et renforcée par לְבַדָּם.
- source_word: נִתְּנָה
  choice: fut donné
  rationale: Le passé simple conserve la voix passive du nifal et convient au registre narratif et poétique de la déclaration.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: אֶרֶץ peut désigner la terre ou un pays. Ici, l’idée d’un territoire accordé exclusivement à un groupe et préservé des étrangers favorise « pays ».
- source_word: זָר
  choice: étranger
  rationale: זָר désigne une personne extérieure au groupe. « Étranger » garde cette portée sans préciser indûment une nationalité.
- source_word: עָבַר בְּתוֹכָם
  choice: ne passa au milieu d’eux
  rationale: עָבַר exprime le fait de passer, tandis que בְּתוֹכָם signifie « en leur sein, au milieu d’eux ». La formulation reste proche de l’image hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. L’ordre « À eux seuls » met en relief l’exclusivité comme en hébreu ; le passé simple soutient le caractère proverbial et poétique du discours.
