base_translation:
  language: en
  yaml_path: translation/ot/job/015/012.yaml
  text: Why does your heart carry you away[a], and why do your eyes flash?
translation:
  language: fr
  text: Pourquoi ton cœur t’emporte-t-il, et pourquoi tes yeux lancent-ils des éclairs[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « clignent-ils », « font-ils signe » ou peut-être « roulent-ils » ; le verbe hébreu est rare et sa nuance précise est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Pourquoi
  rationale: Bien que מַה signifie littéralement « quoi », il introduit ici une question rhétorique portant sur la cause ou le motif ; « pourquoi » est naturel en français.
- source_word: יִקָּחֲךָ
  choice: t’emporte
  rationale: Le verbe לקח signifie « prendre ». Avec « ton cœur » pour sujet, la tournure évoque le cœur qui entraîne la personne ; « t’emporte » restitue cette force figurée sans l’expliciter excessivement.
- source_word: לִבֶּךָ
  choice: ton cœur
  rationale: Le cœur désigne ici la personne intérieure, notamment la pensée et les émotions. L’image hébraïque demeure claire et naturelle en français.
- source_word: וּמַה
  choice: et pourquoi
  rationale: Comme le premier מַה, cette forme coordonnée introduit naturellement en contexte une seconde question rhétorique sur le motif.
- source_word: יִרְזְמוּן
  choice: lancent-ils des éclairs
  rationale: Ce verbe rare décrit un mouvement ou une expression des yeux dont la nuance précise est incertaine. Cette formulation rend l’intensité probable du regard tout en signalant l’incertitude en note.
- source_word: עֵינֶיךָ
  choice: tes yeux
  rationale: La traduction littérale est naturelle et conserve l’image corporelle du texte hébreu.
