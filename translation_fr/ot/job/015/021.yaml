  text: קוֹל פְּחָדִ֥ים בְּ/אָזְנָ֑י/ו בַּ֝/שָּׁל֗וֹם שׁוֹדֵ֥ד יְבוֹאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/021.yaml
  text: A sound of terrors is in his ears[a]; in prosperity the destroyer comes upon him.
translation:
  language: fr
  text: Des bruits terrifiants retentissent à ses oreilles ; en pleine prospérité[a], le dévastateur vient sur lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en paix » ou « en sécurité » ; le mot hébreu שָׁלוֹם peut désigner la paix, le bien-être, la sécurité ou la prospérité.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל פְּחָדִים
  choice: Un bruit terrifiant
  rationale: קוֹל désigne ici un phénomène entendu plutôt qu’une parole articulée. Le pluriel פְּחָדִים intensifie la menace ; « terrifiant » rend naturellement cette force en français sans réduire l’expression à une peur purement intérieure.
- source_word: בְּאָזְנָיו
  choice: résonne à ses oreilles
  rationale: Littéralement « dans ses oreilles ». « Résonne à ses oreilles » conserve l’image auditive concrète tout en donnant une phrase naturelle en français.
- source_word: בַּשָּׁלוֹם
  choice: en pleine prospérité
  rationale: שָׁלוֹם peut désigner la paix, la sécurité, le bien-être ou la prospérité. Ici, « en pleine prospérité » exprime la situation favorable dans laquelle le désastre survient soudainement, tandis que les autres valeurs possibles sont signalées en note.
- source_word: שׁוֹדֵד
  choice: le dévastateur
  rationale: Le participe désigne celui qui ravage, dévaste ou pille. « Dévastateur » exprime la menace de ruine sans restreindre le sens au seul pillage.
- source_word: יְבוֹאֶנּוּ
  choice: fond sur lui
  rationale: La forme signifie littéralement que le dévastateur « vient sur/contre lui ». « Fond sur lui » rend en français actuel et vif cette arrivée hostile et soudaine, sans préciser davantage l’identité de l’assaillant.
