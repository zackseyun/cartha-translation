source:
  edition: WLC
  text: לֹא יַאֲמִ֣ין שׁ֭וּב מִנִּי חֹ֑שֶׁךְ ו/צפו ה֣וּא אֱלֵי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/022.yaml
  text: He does not expect to return from darkness[a], and he is destined for the sword.
translation:
  language: fr
  text: 'Il ne s’attend pas à revenir des ténèbres,

    et il est destiné à l’épée[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il est guetté par l’épée » ou « l’épée l’attend ». Le verbe hébreu est difficile ; la proposition évoque probablement l’imminence d’une mort violente.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַאֲמִין
  choice: il ne croit pas
  rationale: Le hiphil de אמן exprime ici la conviction ou l’attente quant à une issue future, non une croyance religieuse. La tournure avec une proposition complétive est naturelle en français.
- source_word: שׁוּב
  choice: qu’il reviendra
  rationale: Le verbe שׁוב garde son sens de retour. Le futur français rend ici le contenu de l’attente portant sur l’avenir.
- source_word: מִנִּי חֹשֶׁךְ
  choice: des ténèbres
  rationale: La préposition מן indique la sortie hors d’un état de ténèbres, image du malheur ou de la mort imminente. « Des ténèbres » conserve l’image sans l’expliciter.
- source_word: וְצָפוּ הוּא אֱלֵי חָרֶב
  choice: et il est destiné à l’épée
  rationale: La forme verbale est difficile. Dans ce contexte, la proposition annonce qu’une mort violente l’attend. « Destiné à l’épée » est idiomatique tout en laissant la note signaler les autres analyses possibles.
- source_word: חָרֶב
  choice: l’épée
  rationale: L’épée représente ici la mort violente ou le jugement. L’article défini convient à cet emploi figuré en français.
theological_decisions:
- issue: Portée de l’image des ténèbres et de l’épée
  choice: Conserver les deux images sans identifier explicitement les ténèbres à la mort ni l’épée à un jugement divin.
  alternative: Paraphraser par « il n’échappera pas au malheur et mourra violemment ».
  rationale: Le texte hébreu demeure imagé et n’explicite pas entièrement la nature des ténèbres ni l’agent du châtiment; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme poétique est conservé sur deux lignes. « Ténèbres » et « épée » maintiennent les images fortes de l’hébreu sans ajouter d’interprétation confessionnelle.
