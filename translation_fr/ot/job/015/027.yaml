  text: because he has covered his face with his fat[a], and has put fatness on his loins.
translation:
  language: fr
  text: 'Car il a couvert son visage de graisse

    et s’est fait des bourrelets sur les flancs[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et a épaissi ses flancs. » Le terme hébreu rare peut désigner une épaisseur ou des plis de graisse.'
    reason: Le sens précis de פִּימָה demeure incertain; cette note propose une formulation plus générale sans imposer une interprétation.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici l’explication du portrait précédent; « car » conserve la valeur explicative et convient au registre poétique.
- source_word: כִסָּה פָנָיו
  choice: il a couvert son visage
  rationale: Rend directement l’image concrète du verbe « couvrir » et du nom « visage » sans l’interpréter davantage.
- source_word: בְּחֶלְבּוֹ
  choice: de sa graisse
  rationale: Conserve la métaphore corporelle frappante de חֵלֶב et le suffixe possessif.
- source_word: וַיַּעַשׂ פִּימָה
  choice: et accumulé de la graisse
  rationale: Le nom rare פִּימָה évoque l’épaisseur ou l’embonpoint; « accumulé de la graisse » donne en français naturel le résultat corporel exprimé par la construction avec « faire ».
- source_word: עֲלֵי כָסֶל
  choice: sur ses flancs
  rationale: כֶּסֶל désigne ici la région des reins ou des côtés du corps; « flancs » est anatomiquement clair et naturel dans cette image poétique.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et concret. Le parallélisme corporel et le caractère volontairement peu flatteur de l’image sont préservés; le vers est disposé sur deux lignes pour faire ressortir la poésie.
