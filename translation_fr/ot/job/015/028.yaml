  text: וַ/יִּשְׁכּ֤וֹן עָ֘רִ֤ים נִכְחָד֗וֹת בָּ֭תִּים לֹא יֵ֣שְׁבוּ לָ֑/מוֹ אֲשֶׁ֖ר הִתְעַתְּד֣וּ לְ/גַלִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/028.yaml
  text: He has lived in ruined cities[a], in houses where no one dwells, which were destined to become heaps.
translation:
  language: fr
  text: Il habitait dans des villes détruites[a], dans des maisons où personne ne demeurait, destinées à devenir des tas de décombres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il s’établissait dans des villes dévastées, dans des maisons qu’ils n’habitaient pas, préparées pour devenir des monceaux. » L’hébreu de ce verset est concis et permet plusieurs traductions très proches, surtout dans la proposition centrale.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכּוֹן
  choice: Il habitait
  rationale: Le verbe שכן signifie « habiter, demeurer, s’établir ». L’imparfait français rend naturellement ici le récit au passé sans imposer la valeur résultative du passé composé anglais.
- source_word: עָרִים נִכְחָדוֹת
  choice: des villes détruites
  rationale: Le participe passif de כחד décrit des villes supprimées, dévastées ou détruites. « Détruites » conserve la force du terme et prépare l’image finale des décombres.
- source_word: בָּתִּים לֹא יֵשְׁבוּ לָמוֹ
  choice: dans des maisons où personne ne demeurait
  rationale: La formulation hébraïque est compacte et difficile, notamment en raison du suffixe לָמוֹ. Cette traduction exprime clairement l’idée vraisemblable de maisons inhabitées sans donner au pronom une interprétation trop précise.
- source_word: אֲשֶׁר הִתְעַתְּדוּ
  choice: destinées
  rationale: Le hitpael de עתד peut signifier « être préparé, réservé, destiné ». « Destinées » rend de façon concise l’orientation vers l’état final décrit.
- source_word: לְגַלִּים
  choice: à devenir des tas de décombres
  rationale: גַּלִּים désigne des tas ou monceaux, notamment de pierres et de ruines. « Tas de décombres » explicite naturellement en français la nature de ces monceaux dans ce contexte.
