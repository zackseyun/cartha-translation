revisions:
- from: 'Il arrachera, comme la vigne, ses raisins encore verts[a],

    et, comme l’olivier, il rejettera sa fleur.'
  to: 'Tel une vigne, il dépouillera ses raisins encore verts,

    et, tel un olivier, il fera tomber sa fleur.'
  rationale: La révision corrige l’expression peu idiomatique « rejeter sa fleur » et rend les deux comparaisons parallèles et explicites. Elle garde la force lexicale du premier verbe dans « dépouillera », tout en conservant en note l’interprétation agricole plus neutre « fera tomber ».
  reviewer_model: gpt-5.6-terra
