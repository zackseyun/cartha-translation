  text: יַחְמֹ֣ס כַּ/גֶּ֣פֶן בִּסְר֑/וֹ וְ/יַשְׁלֵ֥ךְ כַּ֝/זַּ֗יִת נִצָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/033.yaml
  text: He will shake off his unripe grapes like a vine[b][a], and cast off his blossom like an olive tree.
translation:
  language: fr
  text: 'Tel une vigne, il dépouillera ses raisins encore verts,

    et, tel un olivier, il fera tomber sa fleur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחְמֹס
  choice: il arrachera
  rationale: Le verbe חמס porte habituellement une idée de violence, de dépouillement ou d’arrachement. Dans cette image agricole, « arrachera » conserve cette force tout en exprimant naturellement la perte prématurée du fruit.
- source_word: כַּגֶּפֶן
  choice: comme la vigne
  rationale: Traduction directe de la comparaison introduite par כ ; « la vigne » convient naturellement à l’image générique en français.
- source_word: בִּסְרוֹ
  choice: ses raisins encore verts
  rationale: בֹּסֶר désigne des raisins immatures. « Raisins encore verts » est clair en français moderne et garde le suffixe masculin singulier par « ses ».
- source_word: וְיַשְׁלֵךְ
  choice: et il rejettera
  rationale: Le hiphil de שלך signifie jeter ou rejeter. « Rejettera » préserve l’action exprimée par l’hébreu et s’accorde avec l’image de la fleur dont l’arbre se défait.
- source_word: כַּזַּיִת
  choice: comme l’olivier
  rationale: Dans ce contexte, זית désigne l’olivier, puisque la comparaison porte sur sa fleur.
- source_word: נִצָּתוֹ
  choice: sa fleur
  rationale: Le nom désigne la fleur ou la floraison d’une plante. « Sa fleur » est sobre, naturel et conserve le singulier de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le parallélisme hébreu est conservé, ainsi que la personnification implicite de la vigne et de l’olivier. « Arrachera » maintient la vigueur inhabituelle du premier verbe sans rendre l’image obscure.
