id: JOB.15.35
reference: Job 15:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָרֹ֣ה עָ֭מָל וְ/יָ֣לֹד אָ֑וֶן וּ֝/בִטְנָ֗/ם תָּכִ֥ין מִרְמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/015/035.yaml
  text: They conceive trouble and give birth to wickedness[a]; their womb prepares deceit.
translation:
  language: fr
  text: Ils conçoivent le malheur et enfantent le mal[a] ; leur ventre prépare la tromperie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils sont enceints de peine et donnent naissance à l’iniquité. »'
    reason: Alternative lexicale conservant plus littéralement l’état de grossesse exprimé par הָרֹה et d’autres nuances possibles de עָמָל et אָוֶן.
lexical_decisions:
- source_word: הָרֹה
  choice: conçoivent
  rationale: Le participe qal de הרה exprime ici, de façon métaphorique, le fait de concevoir ou d’être enceinte. « Conçoivent » conserve naturellement en français la progression vers l’enfantement.
- source_word: עָמָל
  choice: le malheur
  rationale: Dans la littérature de sagesse, עָמָל peut désigner la peine, le malheur ou le méfait. « Le malheur » maintient l’étendue sémantique et convient à l’image poétique.
- source_word: וְיָלֹד
  choice: et enfantent
  rationale: Le verbe ילד prolonge explicitement l’image de la grossesse et de la naissance. « Enfantent » est concis, actuel et soutenu.
- source_word: אָוֶן
  choice: le mal
  rationale: אָוֶן peut désigner le mal, l’iniquité ou le malheur. « Le mal » rend ici sa portée morale sans préciser abusivement une nuance particulière.
- source_word: וּבִטְנָם
  choice: leur ventre
  rationale: בטן peut signifier « ventre » ou « sein maternel ». « Leur ventre » respecte le sens corporel du terme tout en laissant l’image gestationnelle du contexte déterminer sa portée.
- source_word: תָּכִין
  choice: prépare
  rationale: Le hiphil de כון signifie notamment préparer, disposer ou établir. « Prépare » rend directement le processus intérieur suggéré par la métaphore.
- source_word: מִרְמָה
  choice: la tromperie
  rationale: מִרְמָה désigne la tromperie, la fraude ou la perfidie. « La tromperie » est clair en français moderne et ne surinterprète pas le degré de déloyauté.
theological_decisions:
- issue: Nombre et genre du sujet implicite
  choice: 'Pluriel générique : « Ils conçoivent… leur ventre… »'
  alternative: 'Singulier représentatif : « Il conçoit… son ventre… »'
  rationale: Bien que הָרֹה soit morphologiquement singulier, le suffixe masculin pluriel de וּבִטְנָם et le contexte qui décrit les méchants comme une catégorie favorisent un sujet pluriel en français. Ce choix évite une discordance artificielle sans effacer la valeur collective.
- issue: Portée morale de אָוֶן
  choice: « le mal »
  alternative: « l’iniquité » ou « le malheur »
  rationale: Le parallèle avec מִרְמָה donne au terme une nette portée morale, mais son champ lexical demeure assez large. « Le mal » préserve cette amplitude sans introduire une terminologie confessionnelle.
translation_notes:
  register: Français international moderne, poétique et digne. La métaphore de la conception, de l’enfantement et du ventre est maintenue. Le point-virgule reflète le parallélisme poétique sans alourdir la phrase.
