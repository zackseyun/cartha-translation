id: JOB.15.5
reference: Job 15:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י יְאַלֵּ֣ף עֲוֺנְ/ךָ֣ פִ֑י/ךָ וְ֝/תִבְחַ֗ר לְשׁ֣וֹן עֲרוּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/005.yaml
  text: For your iniquity teaches your mouth[b][a], and you choose the tongue of the crafty.
translation:
  language: fr
  text: 'Car ta faute instruit ta bouche[a],

    et tu choisis le langage des gens rusés[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta culpabilité instruit ta bouche ». Le mot hébreu peut désigner la faute, la culpabilité ou la peine liée à la faute.
    reason: lexical_alternative
  - marker: b
    text: Ou « la langue des gens rusés »; le terme peut aussi signifier « avisés » selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison donnée par Éliphaz à son accusation; « car » rend naturellement le lien argumentatif.
- source_word: יְאַלֵּף
  choice: instruit
  rationale: Le piel de אלף signifie enseigner ou former. « Instruit » conserve la personnification de la faute qui façonne les paroles de Job.
- source_word: עֲוֺנְךָ
  choice: ta faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou la peine qui en découle. Ici, la faute morale est présentée comme la source du discours; « faute » garde cette force sans réduire le mot au sentiment de culpabilité.
- source_word: פִיךָ
  choice: ta bouche
  rationale: Traduction concrète qui conserve l'image poétique hébraïque et reste naturelle en français.
- source_word: וְתִבְחַר
  choice: et tu choisis
  rationale: Rend directement le qal de בחר et maintient l'accusation personnelle formulée à la deuxième personne.
- source_word: לְשׁוֹן
  choice: le langage
  rationale: Dans cette construction, « langage » exprime naturellement une manière de parler, tout en maintenant le parallélisme sémantique avec « bouche ».
- source_word: עֲרוּמִים
  choice: des gens rusés
  rationale: עָרוּם peut être positif (« avisé ») ou négatif (« rusé »). Le contexte accusateur appelle ici la nuance négative de ruse calculée.
theological_decisions:
- issue: Nuance morale de עָוֹן dans l'accusation
  choice: « ta faute »
  alternative: « ta culpabilité » ou « ton iniquité »
  rationale: Le propos d'Éliphaz impute à la conduite morale de Job l'origine de ses paroles. « Faute » préserve cette accusation tout en laissant une note signaler l'autre sens lexical possible, « culpabilité ».
- issue: Valeur de עֲרוּמִים
  choice: « des gens rusés »
  alternative: « des gens avisés » ou « des gens habiles »
  rationale: Le terme peut exprimer la prudence ou la ruse selon le contexte. Ici, Éliphaz reproche à Job un discours calculé; la valeur péjorative convient donc, sans transformer cette accusation en jugement du narrateur.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme poétique est conservé, avec une formulation idiomatique. Les notes maintiennent l'ambiguïté de עָוֹן et la gamme sémantique de עָרוּם.
