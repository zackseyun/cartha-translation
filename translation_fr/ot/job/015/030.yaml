source:
  edition: WLC
  text: לֹֽא יָס֨וּר מִנִּי חֹ֗שֶׁךְ יֹֽ֭נַקְתּ/וֹ תְּיַבֵּ֣שׁ שַׁלְהָ֑בֶת וְ֝/יָס֗וּר בְּ/ר֣וּחַ פִּֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/030.yaml
  text: He will not depart from darkness[a]; a flame will dry up his shoots[b], and by the breath of his mouth he will pass away.
translation:
  language: fr
  text: Il n’échappera pas aux ténèbres ; une flamme desséchera sa jeune pousse[a], et il disparaîtra par le souffle de sa bouche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression conserve une image végétale : l’homme mauvais est comparé à une plante dont la jeune pousse est brûlée et desséchée.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « il disparaîtra par le souffle de la bouche de Dieu », si le possessif est compris comme renvoyant à Dieu plutôt qu’à l’homme mauvais.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָסוּר ... מִנִּי חֹשֶׁךְ
  choice: Il n’échappera pas aux ténèbres
  rationale: סור avec מן exprime ici l’impossibilité de se soustraire aux ténèbres, image du malheur. « N’échappera pas » est naturel en français et rend clairement le sens contextuel.
- source_word: יֹנַקְתּוֹ
  choice: ses jeunes pousses
  rationale: Le nom désigne une pousse ou un rejeton végétal. « Jeunes pousses » préserve clairement l’image de l’homme mauvais comparé à une plante.
- source_word: תְּיַבֵּשׁ שַׁלְהָבֶת
  choice: une flamme desséchera
  rationale: Le piel de יבש signifie « dessécher, faire dépérir », tandis que שַׁלְהֶבֶת désigne une flamme. La formulation conserve l’image d’une croissance brûlée et détruite.
- source_word: וְיָסוּר
  choice: il disparaîtra
  rationale: Le second emploi de סור évoque ici l’éloignement définitif ou la disparition de l’homme mauvais. « Disparaîtra » rend ce résultat sans imposer explicitement le sens plus fort de « périra ».
- source_word: בְּרוּחַ פִּיו
  choice: par le souffle de sa bouche
  rationale: רוּחַ peut signifier souffle, vent ou esprit. Avec « bouche », « souffle » est le sens concret le plus direct et maintient l’ambiguïté de l’expression.
- source_word: פִּיו
  choice: sa bouche
  rationale: Le suffixe masculin singulier renvoie le plus naturellement à l’homme mauvais, sujet du passage. Le possible renvoi à Dieu est conservé en note.
theological_decisions:
- issue: Référent de « sa bouche » dans la dernière proposition
  choice: la bouche de l’homme mauvais
  alternative: la bouche de Dieu
  rationale: L’antécédent grammatical le plus proche est l’homme mauvais décrit dans le contexte. Toutefois, puisque le « souffle de sa bouche » peut aussi évoquer ailleurs le jugement divin, la lecture qui renvoie à Dieu reste signalée sans être intégrée de force au texte principal.
translation_notes:
  register: Français international actuel, digne et accessible. La métaphore végétale est conservée, tandis que « n’échappera pas » explicite naturellement la portée contextuelle de סור avec מן. L’ambiguïté du référent final est préservée par une note.
