id: JOB.15.16
reference: Job 15:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַ֭ף כִּֽי נִתְעָ֥ב וְֽ/נֶאֱלָ֑ח אִישׁ שֹׁתֶ֖ה כַ/מַּ֣יִם עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/016.yaml
  text: how much less a man who is detestable and corrupt[b][a], who drinks injustice like water!
translation:
  language: fr
  text: combien moins encore un homme abject et corrompu[a], qui boit l’injustice[b] comme de l’eau !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « souillé » ou « infect ». Le terme hébreu est rare et évoque ce qui est impur ou répugnant.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’iniquité », « le méfait » ou « la perversité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: combien moins encore
  rationale: 'Dans le contexte, cette locution introduit le second terme d’un raisonnement a fortiori : si même les cieux ne sont pas purs devant Dieu, un homme l’est encore moins.'
- source_word: נִתְעָב
  choice: abject
  rationale: Le participe niphal décrit quelqu’un qui inspire une profonde répulsion. « Abject » est fort, naturel en français et convient ici à une appréciation morale.
- source_word: נֶאֱלָח
  choice: corrompu
  rationale: Ce terme rare évoque ce qui est souillé, infect ou moralement altéré. « Corrompu » exprime clairement la dégradation morale, tandis que « souillé » demeure une possibilité.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier et désigne ici un homme à valeur représentative; la traduction conserve cette forme.
- source_word: שֹׁתֶה
  choice: qui boit
  rationale: Le participe est rendu par une relative qui préserve la valeur caractéristique ou habituelle de l’action.
- source_word: כַמַּיִם
  choice: comme de l’eau
  rationale: Cette comparaison directe évoque la facilité et le caractère habituel avec lesquels l’homme absorbe le mal.
- source_word: עַוְלָה
  choice: injustice
  rationale: Le nom désigne l’injustice, le tort ou l’iniquité. « Injustice » conserve sa force éthique dans un français actuel sans recourir à un terme archaïque.
theological_decisions:
- issue: Masculin représentatif
  choice: un homme
  alternative: une personne; l’être humain
  rationale: L’hébreu emploie אִישׁ au masculin singulier dans une affirmation représentative. « Un homme » conserve la forme grammaticale de la source sans empêcher la portée générale du propos.
- issue: Portée morale de עַוְלָה
  choice: injustice
  alternative: iniquité; méfait; perversité
  rationale: « Injustice » transmet directement la dimension éthique du mot sans imposer un vocabulaire théologique plus spécialisé. Une note maintient les principales possibilités lexicales.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La tournure « combien moins encore » conserve explicitement le raisonnement a fortiori du contexte. Le parallélisme des deux qualificatifs et l’image vigoureuse de boire l’injustice comme de l’eau sont préservés.
