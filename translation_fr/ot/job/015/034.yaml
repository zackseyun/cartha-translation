source:
  edition: WLC
  text: כִּֽי עֲדַ֣ת חָנֵ֣ף גַּלְמ֑וּד וְ֝/אֵ֗שׁ אָכְלָ֥ה אָֽהֳלֵי שֹֽׁחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/034.yaml
  text: For the company of the godless is barren[b][a], and fire consumes the tents of bribery.
translation:
  language: fr
  text: Car l’assemblée des impies est stérile[a], et le feu dévore les tentes de la corruption[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’assemblée de l’hypocrite est stérile ». Le mot hébreu peut signifier « hypocrite », mais, dans Job, il a souvent le sens plus large d’« impie ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les tentes du pot-de-vin » ou « les tentes de la corruption ». L’expression caractérise ces demeures par un gain ou des pratiques corrompus, sans préciser la relation exacte.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici la raison ou l’explication de l’affirmation précédente, sans préciser davantage la nuance discursive.
- source_word: עֲדַת
  choice: la communauté des
  rationale: Désigne un groupe constitué. « Communauté » est naturel en français moderne et évite la connotation spécifiquement cultuelle que pourrait avoir « assemblée » dans certains contextes.
- source_word: חָנֵף
  choice: impies
  rationale: Dans Job, le terme désigne généralement ceux qui vivent sans respect pour Dieu, plutôt que de simples personnes hypocrites. Le singulier hébreu a ici une valeur collective après עֲדַת.
- source_word: גַּלְמוּד
  choice: stérile
  rationale: L’adjectif évoque l’absence de fruit, de descendance ou de fécondité. « Stérile » conserve cette image et sa portée dans le contexte sapiential.
- source_word: וְאֵשׁ
  choice: et le feu
  rationale: La coordination simple est conservée, avec l’article défini naturel en français dans cette formulation générale.
- source_word: אָכְלָה
  choice: dévore
  rationale: Le parfait peut exprimer ici une vérité générale ou présenter vivement le résultat. « Dévore » restitue l’image concrète du feu et la valeur gnomique.
- source_word: אָהֳלֵי
  choice: les tentes
  rationale: La traduction littérale préserve l’image concrète et le cadre ancien, tout en restant immédiatement compréhensible.
- source_word: שֹׁחַד
  choice: acquises par des pots-de-vin
  rationale: Le nom signifie « pot-de-vin » ou « corruption ». La relation de construit avec « tentes » est elliptique ; cette formulation naturelle explicite que ces demeures sont liées à un gain corrompu sans introduire de catégorie de personnes absente de l’hébreu.
theological_decisions:
- issue: Portée de חָנֵף
  choice: impies
  alternative: hypocrites
  rationale: Le contexte de Job favorise le sens moral et religieux plus large d’« impies », mais la possibilité lexicale d’« hypocrites » est conservée en note.
- issue: Nature de la stérilité exprimée par גַּלְמוּד
  choice: Maintenir l’image générale de stérilité
  alternative: Préciser « sans descendance » ou « improductive »
  rationale: L’hébreu permet une image de privation, de solitude ou d’absence de fécondité. La traduction ne tranche pas entre descendance, fruit durable et désolation.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, ainsi que l’image des « tentes ». « Pots-de-vin » est plus idiomatique que le calque « tentes de la corruption », tandis que la note signale la formulation littérale et l’ellipse hébraïque.
