source:
  edition: WLC
  text: כִּֽי נָטָ֣ה אֶל אֵ֣ל יָד֑/וֹ וְ/אֶל שַׁ֝דַּ֗י יִתְגַּבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/025.yaml
  text: because he has stretched out his hand against God[a], and has shown himself mighty against the Almighty.
translation:
  language: fr
  text: car il a tendu la main contre Dieu[a] et s’est montré fort contre le Tout-Puissant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il a tendu la main vers Dieu et s’est montré fort contre le Tout-Puissant » ; la préposition peut exprimer simplement la direction, tandis que le contexte indique l’hostilité.'
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: car
  rationale: Introduit la raison du jugement décrit dans le contexte. « Car » conserve naturellement la liaison explicative du vers poétique.
- source_word: נָטָה
  choice: a tendu
  rationale: Reproduit l’image concrète du verbe hébreu, qui signifie étendre ou tendre.
- source_word: אֶל
  choice: contre
  rationale: La préposition indique littéralement la direction, mais le contexte hostile donne à l’expression le sens d’un geste dirigé contre Dieu.
- source_word: אֵל
  choice: Dieu
  rationale: Rend le titre divin courant sans le confondre avec שַׁדַּי dans le membre parallèle.
- source_word: יָדוֹ
  choice: la main
  rationale: Conserve le singulier et l’image hébraïque d’un geste d’hostilité.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Traduit le titre divin par sa forme française usuelle et maintient la distinction avec אֵל.
- source_word: יִתְגַּבָּר
  choice: s’est dressé avec force
  rationale: Exprime la valeur réflexive du hitpael de גבר, celle d’un homme qui s’affermit ou déploie sa force face au Tout-Puissant, tout en restant naturel en français.
theological_decisions:
- issue: Rendu des titres divins en parallèle
  choice: « Dieu » pour אֵל et « le Tout-Puissant » pour שַׁדַּי
  alternative: « Dieu » et « Shaddaï »
  rationale: La traduction des deux titres en préserve le sens et le parallélisme sans introduire une translittération inutile.
- issue: Nature de l’opposition exprimée par יִתְגַּבָּר
  choice: « s’est dressé avec force contre »
  alternative: « s’est rendu fort contre »
  rationale: Le choix retenu garde l’idée de force délibérément déployée contre Dieu sans réduire le verbe à la seule arrogance ni prétendre que l’homme l’emporte.
translation_notes:
  register: Français moderne, digne et poétique. L’image concrète de la main tendue est conservée, ainsi que la tension ironique entre la force revendiquée par l’homme et le titre « le Tout-Puissant ».
