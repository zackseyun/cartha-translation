  text: הַ/בְ/ס֣וֹד אֱל֣וֹהַ תִּשְׁמָ֑ע וְ/תִגְרַ֖ע אֵלֶ֣י/ךָ חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/008.yaml
  text: Have you listened in the council of God[a], and restricted wisdom to yourself?
translation:
  language: fr
  text: As-tu écouté au conseil de Dieu[a] ? Et retiens-tu la sagesse pour toi seul ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le secret de Dieu » ou « dans le conseil intime de Dieu ». Le mot hébreu peut désigner un conseil confidentiel, un cercle intime ou une délibération secrète.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְ/סוֹד
  choice: dans le conseil
  rationale: סוֹד peut désigner un conseil confidentiel, un cercle intime ou une délibération secrète. « Dans le conseil » conserve ici l’image d’un accès privilégié aux délibérations divines, tandis que la note maintient les autres nuances possibles.
- source_word: אֱלוֹהַ
  choice: Dieu
  rationale: אֱלוֹהַ est une forme singulière fréquente dans Job ; « Dieu » en est l’équivalent français naturel.
- source_word: תִּשְׁמָע
  choice: as-tu écouté
  rationale: שׁמע peut signifier entendre ou écouter. Dans le contexte d’un conseil divin, « écouter » exprime bien l’idée d’une audition attentive et privilégiée.
- source_word: וְ/תִגְרַע
  choice: gardes-tu
  rationale: גרע peut exprimer l’idée de diminuer, retrancher, retenir ou réserver. Avec « pour toi seul », « garder » rend naturellement en français l’idée de retenir la sagesse à l’exclusion des autres.
- source_word: אֵלֶיךָ
  choice: pour toi seul
  rationale: La préposition avec le suffixe de deuxième personne indique une orientation vers l’interlocuteur ; dans ce contexte, « pour toi seul » explicite l’idée d’appropriation exclusive portée par la construction.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: « La sagesse » est l’équivalent usuel de חָכְמָה et convient ici sans lui imposer un sens théologique technique.
theological_decisions:
- issue: Sens de סוֹד appliqué à Dieu dans la rhétorique de Job
  choice: le conseil de Dieu
  alternative: le secret de Dieu ; le conseil intime de Dieu
  rationale: La question ironique d’Éliphaz suggère que Job prétendrait avoir accès aux délibérations confidentielles de Dieu. « Conseil » préserve cette possible image d’une assemblée délibérative, sans exclure le sens plus abstrait de « secret », signalé en note.
translation_notes:
  register: Français moderne, sobre et digne. Les deux questions brèves rendent la vigueur de l’interpellation rhétorique. « Conseil » conserve l’ambiguïté entre cercle délibératif et confidence, précisée par la note.
