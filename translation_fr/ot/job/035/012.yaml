  text: שָׁ֣ם יִ֭צְעֲקוּ וְ/לֹ֣א יַעֲנֶ֑ה מִ֝/פְּנֵ֗י גְּא֣וֹן רָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/012.yaml
  text: There they cry out[a], but he does not answer[b], because of the pride of evil men.
translation:
  language: fr
  text: Là, ils crient, mais il ne répond pas[a], à cause de l’orgueil[b] des méchants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu ne nomme pas explicitement le sujet de « il ne répond pas » ; le contexte laisse entendre qu’il s’agit de Dieu.
    reason: alternative_reading
  - marker: b
    text: Ou « de l’arrogance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Là
  rationale: L’adverbe est d’abord locatif et renvoie à la situation qui vient d’être décrite.
- source_word: יִצְעֲקוּ
  choice: ils crient
  rationale: Le verbe exprime un cri poussé dans la détresse; « ils crient » est direct, naturel et garde cette intensité.
- source_word: וְלֹא
  choice: mais… ne… pas
  rationale: La conjonction marque ici naturellement le contraste entre leur cri et l’absence de réponse.
- source_word: יַעֲנֶה
  choice: il ne répond pas
  rationale: Le verbe est à la troisième personne du masculin singulier, sans sujet explicitement nommé. Le présent convient à la portée générale de l’affirmation.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: Dans ce contexte, la locution prépositionnelle exprime la cause.
- source_word: גְּאוֹן
  choice: l’orgueil
  rationale: Avec les hommes mauvais, le terme prend son sens négatif d’orgueil ou d’arrogance; « orgueil » est concis et courant.
- source_word: רָעִים
  choice: des hommes mauvais
  rationale: L’adjectif substantivé masculin pluriel désigne des êtres humains mauvais. Cette formulation conserve explicitement le masculin du texte source.
theological_decisions:
- issue: Sujet implicite de « il ne répond pas »
  choice: Conserver le pronom « il » sans nommer explicitement Dieu.
  alternative: Dieu ne leur répond pas.
  rationale: Le contexte laisse entendre que Dieu est celui dont une réponse est attendue, mais le texte hébreu ne le nomme pas dans cette proposition. La traduction préserve cette retenue.
- issue: Sens de גְּאוֹן
  choice: l’orgueil
  alternative: l’arrogance
  rationale: Les deux termes rendent le sens négatif possible ici. « Orgueil » garde une formulation sobre sans atténuer le jugement moral.
- issue: Référence masculine de רָעִים
  choice: des hommes mauvais
  alternative: des méchants
  rationale: La formulation choisie rend explicitement le masculin pluriel du texte hébreu; « des méchants » serait plus compact, mais moins explicite quant à la référence humaine masculine.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle; l’ambiguïté du sujet de « répond » est conservée.
