source:
  edition: WLC
  text: מַ֭לְּפֵ/נוּ מִ/בַּהֲמ֣וֹת אָ֑רֶץ וּ/מֵ/ע֖וֹף הַ/שָּׁמַ֣יִם יְחַכְּמֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/011.yaml
  text: who teaches us more than the beasts of the earth and makes us wiser than the birds of the heavens[a].
translation:
  language: fr
  text: qui nous instruit plus que les bêtes de la terre et nous rend plus sages que les oiseaux du ciel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui nous instruit grâce aux bêtes de la terre et nous rend sages grâce aux oiseaux du ciel ». La préposition hébraïque peut indiquer la provenance ou le moyen plutôt qu’une comparaison.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַ֭לְּפֵנוּ
  choice: nous instruit
  rationale: Le participe piel de למד avec suffixe de première personne du pluriel exprime une instruction active. « Nous instruit » convient au registre poétique et forme un parallèle naturel avec « nous rend plus sages ».
- source_word: מִבַּהֲמוֹת אָרֶץ
  choice: plus que les bêtes de la terre
  rationale: La préposition מִן est comprise ici dans son sens comparatif, favorisé par le parallélisme. « Bêtes de la terre » conserve l’image concrète et la tonalité élevée de l’hébreu.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: que les oiseaux du ciel
  rationale: La préposition est également prise au sens comparatif. « Oiseaux du ciel » rend naturellement l’expression hébraïque עוֹף הַשָּׁמַיִם en français moderne.
- source_word: יְחַכְּמֵנוּ
  choice: nous rend plus sages
  rationale: Le piel de חכם avec suffixe de première personne du pluriel a ici un sens causatif. Le comparatif « plus sages » explicite en français la relation indiquée par מִן.
theological_decisions:
- issue: Valeur de la préposition מִן dans les deux membres du vers
  choice: 'Sens comparatif : Dieu instruit les humains plus que les animaux et les rend plus sages qu’eux.'
  alternative: 'Sens de provenance ou de moyen : Dieu nous instruit à partir des bêtes de la terre et nous donne la sagesse à partir des oiseaux du ciel.'
  rationale: Le parallélisme poétique immédiat et le contexte favorisent une comparaison entre la sagesse accordée aux humains et celle des animaux. L’autre valeur possible de la préposition hébraïque est néanmoins conservée en note.
translation_notes:
  register: Français international moderne, digne et poétique. « Instruit » évite une tournure trop familière, tandis que « oiseaux du ciel » reste naturel sans reproduire littéralement le pluriel hébreu « cieux ».
