  text: לְ/אִישׁ כָּמ֥וֹ/ךָ רִשְׁעֶ֑/ךָ וּ/לְ/בֶן אָ֝דָ֗ם צִדְקָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/008.yaml
  text: Your wickedness affects a man like yourself[a], and your righteousness a son of man.
translation:
  language: fr
  text: Ta méchanceté touche un homme comme toi, et ta justice, un être humain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « un fils d’homme ». L’expression hébraïque désigne ici un être humain mortel ; ce n’est pas un titre messianique.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִישׁ
  choice: affecte un homme
  rationale: La préposition לְ indique ici, dans une proposition elliptique éclairée par les versets 6–7, la personne sur laquelle la conduite de Job produit un effet. Le français exige de rétablir un verbe; « affecte » exprime cet effet sans préciser davantage sa nature.
- source_word: כָּמוֹךָ
  choice: comme toi
  rationale: 'Cette formulation naturelle conserve la comparaison explicite avec Job: il s’agit d’un autre homme de même condition que lui.'
- source_word: רִשְׁעֶךָ
  choice: ta méchanceté
  rationale: רֶשַׁע désigne ici le mal moral ou la conduite coupable. « Méchanceté » maintient le contraste éthique avec « justice ».
- source_word: וּלְבֶן אָדָם
  choice: et … un fils d’Adam
  rationale: L’expression poétique désigne ici un être humain et forme un parallèle avec « un homme comme toi ». « Fils d’Adam » conserve l’image hébraïque tout en évitant de transformer l’expression en titre messianique.
- source_word: צִדְקָתֶךָ
  choice: ta justice
  rationale: Le nom désigne la justice ou la conduite droite, en opposition directe à « ta méchanceté ». « Justice » est concis et respecte le registre moral du passage.
theological_decisions:
- issue: Sens de בֶּן אָדָם dans ce contexte
  choice: Une personne humaine, rendue littéralement par « un fils d’Adam »
  alternative: « un être humain » ou « un fils d’homme »
  rationale: Dans Job, l’expression est une désignation poétique courante de l’être humain, parallèle à אִישׁ, et non un titre messianique. La traduction retenue préserve l’image et la distinction lexicale du texte sans imposer une lecture christologique.
translation_notes:
  register: Français moderne, sobre et poétique. Le verbe « affecte », absent de la proposition nominale hébraïque, est rétabli d’après le contexte et vaut pour les deux membres. La virgule après « justice » marque cette ellipse sans alourdir la phrase.
