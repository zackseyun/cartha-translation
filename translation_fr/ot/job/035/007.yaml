source:
  edition: WLC
  text: אִם צָ֭דַקְתָּ מַה תִּתֶּן ל֑/וֹ א֥וֹ מַה מִ/יָּדְ/ךָ֥ יִקָּֽח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/007.yaml
  text: If you are righteous[b][a], what do you give to him? Or what does he take from your hand?
translation:
  language: fr
  text: Si tu es juste, que lui donnes-tu[a] ? Ou que reçoit-il[b] de ta main ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire à Dieu : dans ce contexte, Élihou affirme que la justice humaine ne procure aucun gain à Dieu.'
    reason: cross_reference
  - marker: b
    text: 'Ou : « prend-il ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit directement la condition formulée par Élihou.
- source_word: צָדַקְתָּ
  choice: tu es juste
  rationale: Le verbe צדק exprime ici le fait d’être juste ou dans son bon droit ; le présent français convient à la portée générale de la question.
- source_word: מַה תִּתֶּן לוֹ
  choice: que lui donnes-tu
  rationale: Cette formulation conserve la question rhétorique et la relation de don exprimée par נתן avec ל.
- source_word: מִיָּדְךָ
  choice: de ta main
  rationale: Préserve l’image hébraïque concrète de ce qui vient de la possession ou de l’action d’une personne.
- source_word: יִקָּח
  choice: reçoit-il
  rationale: לקח peut signifier « prendre » ou « recevoir ». Dans le parallélisme avec « donner », « recevoir » est naturel en français sans modifier le sens de l’argument.
theological_decisions:
- issue: Référent de לוֹ et du sujet implicite de יִקָּח
  choice: Maintien des pronoms « lui » et « il », avec une note indiquant que le contexte renvoie à Dieu.
  alternative: Remplacer directement les pronoms par « Dieu ».
  rationale: Le contexte de Job 35.6-8 désigne Dieu, mais l’hébreu de ce verset emploie des pronoms. Les conserver évite de rendre explicite dans le texte principal ce qui demeure contextuel.
translation_notes:
  register: Français moderne, sobre et digne. Le tutoiement correspond à l’adresse directe au singulier. Le parallélisme des deux questions rhétoriques et l’image de la main sont conservés.
