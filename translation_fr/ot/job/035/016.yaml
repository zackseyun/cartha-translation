  text: וְ֭/אִיּוֹב הֶ֣בֶל יִפְצֶה פִּ֑י/הוּ בִּ/בְלִי דַ֝֗עַת מִלִּ֥ין יַכְבִּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/035/016.yaml
  text: So Job opens his mouth in vain[a]; without knowledge he multiplies words.
translation:
  language: fr
  text: Ainsi, Job ouvre la bouche en vain[a] ; sans connaissance, il multiplie les paroles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec du vide » ou « avec vanité ». Le mot hébreu הֶבֶל peut évoquer le souffle, le vide, la vanité ou la futilité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִיּוֹב
  choice: Ainsi, Job
  rationale: Dans ce contexte conclusif, וְ peut avoir une valeur inférentielle. « Ainsi » relie naturellement ce jugement d’Élihou à ce qui précède.
- source_word: הֶבֶל
  choice: pour ne rien dire
  rationale: הֶבֶל évoque le souffle, le vide, la vanité ou la futilité. Ici, le terme caractérise la prise de parole de Job comme vide de contenu ou vaine ; cette formulation est naturelle en français tout en conservant l’image d’une parole sans substance.
- source_word: יִפְצֶה פִּיהוּ
  choice: ouvre la bouche
  rationale: L’expression פצה פה signifie littéralement « ouvrir la bouche » et désigne le fait de prendre la parole. Le même idiome fonctionne naturellement en français.
- source_word: בִּבְלִי דַעַת
  choice: sans connaissance
  rationale: בִּבְלִי exprime l’absence et דַעַת la connaissance. Le rendu direct préserve la portée de l’accusation d’Élihou sans préciser abusivement s’il s’agit de savoir, de discernement ou de compréhension.
- source_word: מִלִּין
  choice: les paroles
  rationale: Cette forme plurielle aramaïsante désigne des mots ou des paroles. « Paroles » convient au registre poétique et au discours prononcé.
- source_word: יַכְבִּר
  choice: il multiplie
  rationale: La forme verbale exprime le fait de rendre nombreux ou abondants. « Multiplier les paroles » reproduit directement cette idée et reste idiomatique en français.
theological_decisions:
- issue: Portée du jugement porté sur les paroles de Job
  choice: Conserver l’accusation directe d’Élihou selon laquelle Job parle dans le vide et sans connaissance.
  alternative: Atténuer l’énoncé en le présentant comme une simple impression ou comme une condamnation de Job lui-même.
  rationale: Le verset évalue les paroles de Job dans le cadre du discours d’Élihou. La traduction ne doit ni transformer cette voix discursive en verdict narratif absolu ni en réduire la vigueur.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La tournure « ouvre la bouche pour ne rien dire » est claire et idiomatique ; la note préserve l’éventail concret et abstrait de הֶבֶל. Le parallélisme entre parole vide et absence de connaissance est maintenu.
