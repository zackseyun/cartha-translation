source:
  edition: WLC
  text: אַךְ שָׁ֭וְא לֹא יִשְׁמַ֥ע אֵ֑ל וְ֝/שַׁדַּ֗י לֹ֣א יְשׁוּרֶֽ/נָּה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/013.yaml
  text: Surely God does not hear emptiness[a], and the Almighty does not regard it.
translation:
  language: fr
  text: Certes, Dieu n’écoute pas ce qui est vain[a], et le Tout-Puissant n’y prête pas attention.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est futile », « ce qui est faux » ou « ce qui est sans valeur ». Le terme hébreu peut désigner ce qui est vide, inutile ou trompeur.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Oui
  rationale: La particule introduit ici une affirmation appuyée. « Oui » rend cette insistance avec naturel, sans lui donner le sens restrictif de « seulement ».
- source_word: שָׁוְא
  choice: ce qui est vain
  rationale: Le terme peut désigner ce qui est vide, futile, sans valeur ou trompeur. Cette formulation garde son caractère général sans préciser abusivement qu’il s’agit d’un mensonge ou d’un cri particulier.
- source_word: יִשְׁמַע
  choice: n’écoute pas
  rationale: Dans ce contexte, l’imparfait énonce une vérité générale. « Écouter » exprime naturellement l’attention accordée, plutôt qu’une simple perception auditive.
- source_word: אֵל
  choice: Dieu
  rationale: Équivalent français courant et direct de ce titre divin.
- source_word: וְשַׁדַּי
  choice: et le Tout-Puissant
  rationale: Traduction française établie du titre divin שַׁדַּי, particulièrement naturelle dans le livre de Job.
- source_word: יְשׁוּרֶנָּה
  choice: n’y prête pas attention
  rationale: Le verbe שׁור signifie regarder ou considérer. Cette expression rend ici l’idée de considération attentive et forme un parallélisme naturel avec « n’écoute pas »; le pronom renvoie à « ce qui est vain ».
theological_decisions:
- issue: Référent et portée de שָׁוְא dans l’affirmation d’Élihou
  choice: Dieu n’accorde pas son écoute à ce qui est vain, futile ou dépourvu de substance.
  alternative: Dieu n’entend pas le mensonge en général, ou n’écoute pas précisément une prière insincère.
  rationale: Le texte ne nie pas la connaissance divine; il parle de l’attention que Dieu n’accorde pas à ce qui est vain. La traduction conserve la portée morale et rhétorique tout en évitant de réduire le terme à un seul type de parole ou de prière.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme hébreu est conservé avec « n’écoute pas » et « n’y prête pas attention ». « Ce qui est vain » reste idiomatique tout en maintenant l’ambiguïté lexicale du nom hébreu.
