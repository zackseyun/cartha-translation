  text: But no one says[a], ‘Where is God my Maker, who gives songs in the night?’
translation:
  language: fr
  text: 'Mais personne ne dit : « Où est Dieu, mon Créateur[a], qui donne des chants dans la nuit ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie littéralement une forme plurielle : « mes créateurs » ou « ceux qui m’ont fait ». Dans ce contexte, elle désigne le Dieu unique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָמַר
  choice: Mais personne ne dit
  rationale: La conjonction et la négation marquent ici un contraste avec le contexte précédent. Le sujet indéfini « personne » est implicite en hébreu et nécessaire en français naturel. Bien que le verbe soit formellement à l’accompli, le présent exprime bien cette observation générale.
- source_word: אַיֵּה
  choice: Où est
  rationale: L’interrogatif porte sur le lieu ou la présence; « Où est » est son équivalent direct et naturel en français.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Titre divin singulier courant dans le livre de Job; « Dieu » en donne le sens simplement.
- source_word: עֹשָׂי
  choice: celui qui m’a fait
  rationale: La forme hébraïque est grammaticalement plurielle avec un suffixe de première personne, mais elle désigne ici le Dieu unique. Cette formulation française exprime clairement l’action créatrice sans suggérer plusieurs créateurs; le pluriel formel est signalé en note.
- source_word: נֹתֵן
  choice: lui qui donne
  rationale: Le participe décrit une action caractéristique de Dieu. La reprise emphatique « lui qui » conserve la progression poétique et rattache clairement la proposition à Dieu.
- source_word: זְמִרוֹת
  choice: des chants
  rationale: Le nom désigne des chants ou mélodies, avec une éventuelle nuance de louange que le mot seul n’impose pas d’expliciter.
- source_word: בַּלָּיְלָה
  choice: dans la nuit
  rationale: Cette expression naturelle conserve la tonalité poétique et évocatrice de l’hébreu.
theological_decisions:
- issue: Nombre grammatical de עֹשָׂי lorsqu’il désigne Dieu
  choice: 'Sens singulier : « celui qui m’a fait »'
  alternative: 'Pluriel formel : « ceux qui m’ont fait » ou « mes créateurs »'
  rationale: Même si la forme hébraïque est plurielle, elle renvoie dans ce contexte au Dieu singulier. Le singulier évite une lecture polythéiste trompeuse, tandis que la note maintient la transparence sur la forme du texte source.
translation_notes:
  register: Français international moderne, clair et digne. « Celui qui m’a fait » est plus idiomatique que « mon Créateur » tout en reflétant directement le participe hébreu; « des chants dans la nuit » préserve l’image poétique sans préciser qu’il s’agit nécessairement de chants de louange.
