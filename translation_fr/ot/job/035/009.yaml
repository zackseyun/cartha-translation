  text: מֵ֭/רֹב עֲשׁוּקִ֣ים יַזְעִ֑יקוּ יְשַׁוְּע֖וּ מִ/זְּר֣וֹעַ רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/009.yaml
  text: Because of the multitude of oppressions they cry out[b][a]; they call for help because of the arm of the mighty.
translation:
  language: fr
  text: À cause de la multitude des oppressions, on crie ; on appelle au secours à cause du bras des puissants.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de / depuis le bras des puissants ». La préposition hébraïque peut aussi exprimer la cause, comme dans le texte. Le « bras » est une image de la force ou du pouvoir.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: מֵרֹב עֲשׁוּקִים
  choice: Sous le poids de multiples oppressions
  rationale: מִן marque ici vraisemblablement la cause, et רֹב l'abondance. « Sous le poids de » exprime naturellement en français la pression causée par les nombreuses oppressions, sans réduire עֲשׁוּקִים aux personnes opprimées.
- source_word: יַזְעִיקוּ
  choice: on pousse des cris
  rationale: Le hiphil de זעק désigne le fait de pousser un cri de détresse. Le pronom indéfini « on » rend le sujet humain non exprimé et évite d'attribuer artificiellement l'action aux « oppressions ».
- source_word: יְשַׁוְּעוּ
  choice: on appelle au secours
  rationale: Le verbe שוע exprime un appel à l'aide. Cette formulation distingue le second membre du simple cri tout en conservant le parallélisme.
- source_word: מִזְּרֹעַ
  choice: à cause du bras
  rationale: La préposition מִן est comprise comme causale, tandis que « bras » conserve l'image hébraïque de la force ou du pouvoir.
- source_word: רַבִּים
  choice: des puissants
  rationale: Dans ce contexte d'oppression, רַבִּים désigne probablement des personnages puissants plutôt qu'un grand nombre de personnes. « Les puissants » restitue cette valeur sociale.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le tour impersonnel « on » restitue les verbes au pluriel dont le sujet humain reste implicite. L'image du « bras » est maintenue et expliquée en note.
