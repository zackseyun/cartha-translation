source:
  edition: WLC
  text: אַ֣ף כִּֽי תֹ֭אמַר לֹ֣א תְשׁוּרֶ֑/נּוּ דִּ֥ין לְ֝/פָנָ֗י/ו וּ/תְח֥וֹלֵֽל לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/014.yaml
  text: How much less when you say[a], ‘You do not see him’; the case is before him, and you must wait for him.
translation:
  language: fr
  text: 'Combien moins encore si tu dis : « Tu ne le vois pas » ! Ta cause est devant lui : attends-le[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « tords-toi devant lui ». Le verbe hébreu est difficile, et beaucoup le comprennent ici au sens de « attends-le avec confiance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: À plus forte raison quand
  rationale: L’expression introduit ici un renforcement argumentatif dans la continuité du verset précédent. Cette tournure française rend cette progression sans réduire la locution à une simple concession.
- source_word: תֹאמַר
  choice: tu dis
  rationale: Le verbe est un qal inaccompli à la deuxième personne du masculin singulier, Elihou s’adressant directement à Job. La traduction simple convient.
- source_word: לֹא תְשׁוּרֶנּוּ
  choice: Tu ne le vois pas
  rationale: 'Le verbe שׁור signifie regarder, contempler ou percevoir. Dans le contexte, le sujet est Job et le suffixe renvoie le mieux à Dieu : Job dit ne pas le voir.'
- source_word: דִּין
  choice: Ta cause
  rationale: דִּין désigne ici une affaire à juger plutôt que la justice au sens abstrait. « Ta cause » exprime naturellement en français le cadre judiciaire et explicite la relation au destinataire suggérée par le contexte.
- source_word: לְפָנָיו
  choice: est devant lui
  rationale: La locution indique que l’affaire se trouve en présence de Dieu, soumise à son jugement. « Devant lui » conserve l’image judiciaire de l’hébreu.
- source_word: וּתְחוֹלֵל לוֹ
  choice: attends-le
  rationale: La forme rare et difficile, rattachée à חול, peut évoquer le fait de se tordre ou de s’agiter, mais elle est souvent comprise ici comme une attente confiante ou patiente. Le contexte d’une cause placée devant Dieu favorise « attends-le », tout en exigeant une note signalant l’alternative plus littérale.
theological_decisions:
- issue: Le rapport entre l’invisibilité présente de Dieu et la cause de Job
  choice: Job affirme ne pas voir Dieu, mais sa cause demeure devant Dieu et il est invité à l’attendre.
  alternative: Dieu ne voit pas la cause de Job.
  rationale: La syntaxe et le contexte favorisent Job comme sujet de « voir ». Le verset ne nie donc pas que Dieu connaisse l’affaire, sans pour autant expliquer pourquoi il reste caché.
- issue: Sens de l’exhortation finale
  choice: attends-le
  alternative: tourmente-toi devant lui / agite-toi devant lui
  rationale: Le sens d’attente s’accorde avec l’enchaînement judiciaire, mais l’étymologie et la rareté de la forme laissent subsister une réelle difficulté lexicale, conservée dans la note.
translation_notes:
  register: Français international moderne, naturel et digne. « À plus forte raison » conserve la force argumentative; « ta cause » maintient l’image judiciaire. La brièveté et la tension du texte hébreu sont préservées, tandis que la difficulté du dernier verbe est explicitement signalée en note.
