revisions:
- from: 'À plus forte raison quand tu dis : « Tu ne le vois pas. » Ta cause est devant lui : attends-le[a].'
  to: 'Combien moins encore si tu dis : « Tu ne le vois pas » ! Ta cause est devant lui : attends-le[a].'
  rationale: La révision corrige la direction argumentative de l’expression initiale et améliore la précision de la note lexicale. Elle conserve l’ellipse rhétorique, le langage judiciaire, l’ambiguïté réelle du dernier verbe et l’exhortation contextuellement la plus probable, sans imposer d’interprétation doctrinale.
