  text: כִּֽי תֹ֭אמַר מַה יִּסְכָּן לָ֑/ךְ מָֽה אֹ֝עִ֗יל מֵֽ/חַטָּאתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/003.yaml
  text: For you say[a], ‘What advantage is it to you? What profit do I have from my sin?’
translation:
  language: fr
  text: 'Car tu dis[a] : « Quel avantage cela t’apporte-t-il ? Quel profit en ai-je de plus qu’en péchant ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quel avantage en as-tu ? Qu’est-ce que mon péché me rapporte ? » L’hébreu est concis et elliptique. La seconde question peut exprimer une comparaison entre être juste et pécher.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qu’Élihou donne de l’affirmation de Job et marque naturellement le lien argumentatif avec ce qui précède.
- source_word: תֹאמַר
  choice: tu dis
  rationale: Imparfait qal, deuxième personne du masculin singulier ; le présent convient à la manière dont Élihou rapporte les propos de Job.
- source_word: מַה יִּסְכָּן לָךְ
  choice: Quel avantage cela t’apporte-t-il ?
  rationale: סכן exprime ici l’utilité ou l’avantage. « Cela » conserve le caractère elliptique de l’hébreu sans préciser abusivement le référent implicite.
- source_word: מָה אֹעִיל
  choice: Qu’est-ce que … me rapporte ?
  rationale: Le hiphil de יעל signifie « profiter, être avantageux ». Cette tournure est naturelle en français moderne et maintient la perspective personnelle du locuteur.
- source_word: מֵחַטָּאתִי
  choice: mon péché
  rationale: La préposition מִן peut indiquer la provenance ou la comparaison. Le texte principal exprime la provenance sans imposer la nuance comparative, laquelle est signalée en note.
theological_decisions:
- issue: Portée de la citation attribuée à Job par Élihou
  choice: Élihou présente Job comme demandant quel avantage personnel lui revient, puis ce que son péché lui rapporte.
  alternative: Élihou présente Job comme demandant ce qu’il gagne à être juste plutôt qu’à pécher.
  rationale: L’hébreu est bref et elliptique, et מִן peut avoir une valeur comparative. Le texte principal ne complète pas explicitement la comparaison ; la note en expose la possibilité afin de préserver la tension du passage.
translation_notes:
  register: Français international moderne, naturel et digne. Les questions restent directes, et « cela » préserve l’ellipse du texte source. Le marqueur [a] figure dans le texte principal.
