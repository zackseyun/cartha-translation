  text: אִם חָ֭טָאתָ מַה תִּפְעָל בּ֑/וֹ וְ/רַבּ֥וּ פְ֝שָׁעֶ֗י/ךָ מַה תַּעֲשֶׂה לּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/006.yaml
  text: If you sin[a], what do you accomplish against him? And if your transgressions are many, what do you do to him?
translation:
  language: fr
  text: Si tu pèches, quel effet produis-tu sur lui[a] ? Et si tes transgressions sont nombreuses, que lui fais-tu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « que fais-tu contre lui ? » Le verbe hébreu peut simplement signifier « faire » ou « produire »; avec la préposition, il peut exprimer ce qui est fait à l’égard de Dieu. La traduction retenue met en relief la question de l’effet produit, sans préciser qu’il s’agit nécessairement d’un dommage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתָ
  choice: Si tu pèches
  rationale: Le parfait hébreu dans cette proposition conditionnelle exprime ici un cas général; le présent français restitue naturellement cette portée hypothétique.
- source_word: מַה תִּפְעָל בּוֹ
  choice: quel effet cela a-t-il sur lui
  rationale: פעל peut désigner l’action ou l’effet produit, et בּוֹ marque ici ce qui atteint Dieu. Cette formulation naturelle exprime la question rhétorique sans préciser indûment qu’il s’agirait nécessairement d’un dommage.
- source_word: וְרַבּוּ פְשָׁעֶיךָ
  choice: Et si tes révoltes se multiplient
  rationale: La condition est sous-entendue dans le second membre parallèle. פשע comporte une nuance de rébellion volontaire, bien rendue par « révoltes »; le verbe « se multiplient » conserve l’idée dynamique de devenir nombreuses.
- source_word: מַה תַּעֲשֶׂה לּוֹ
  choice: que lui fais-tu
  rationale: Cette traduction directe de עשה avec ל préserve la simplicité et la force rhétorique de la seconde question sans ajouter « peux ».
theological_decisions:
- issue: La question affirme-t-elle que le péché humain est sans aucune importance pour Dieu, ou seulement qu’il ne l’atteint pas comme il atteindrait un être humain ?
  choice: La formulation porte sur l’effet produit sur Dieu, sans affirmer que le péché lui est moralement indifférent.
  alternative: « Quel tort lui causes-tu ? » expliciterait l’idée de dommage; « que fais-tu contre lui ? » serait plus adversatif.
  rationale: L’hébreu souligne dans l’argument d’Élihou la transcendance de Dieu. Garder une question sur l’effet évite de transformer cette affirmation en doctrine plus large sur l’attitude de Dieu envers le péché.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier correspond aux formes hébraïques adressées à Job. Le parallélisme des deux questions est conservé, avec une légère variation lexicale reflétant les deux verbes hébreux.
