    issue: Le sujet humain est effacé dans la première question.
    rationale: Le texte « quel effet cela a-t-il sur lui ? » substitue « cela » à la deuxième personne explicite dans מַה תִּפְעָל בּוֹ. La correction rétablit le sujet sans imposer l’interprétation plus forte de « nuire ».
  - severity: low
    issue: « Se multiplient » surinterprète le parfait ורבו.
    rationale: Le verbe peut certes se rapporter à la multiplication, mais dans ce parallélisme il signifie naturellement « sont nombreux ». Cette dernière formulation est plus proche de l’état envisagé par l’hébreu.
  - severity: low
    issue: « Révoltes » est moins précis ici que le terme moral usuel « transgressions ».
    rationale: פשעים peut comporter une nuance de rébellion, mais « transgressions » rend le pluriel abstrait et le registre moral du contexte sans suggérer des actes de révolte publique.
