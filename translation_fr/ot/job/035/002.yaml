source:
  edition: WLC
  text: הֲ֭/זֹאת חָשַׁ֣בְתָּ לְ/מִשְׁפָּ֑ט אָ֝מַ֗רְתָּ צִדְקִ֥/י מֵ/אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/002.yaml
  text: 'Do you think this is just: you say[a], ‘My righteousness is greater than God’s’?'
translation:
  language: fr
  text: 'Est-ce cela que tu estimes juste ? Tu dis[a] : « Ma justice est plus grande que celle de Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je suis juste devant Dieu », ou : « Mon bon droit vient de Dieu. » L’hébreu est condensé, et le rapport entre « ma justice » et « Dieu » est discuté.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲזֹאת חָשַׁבְתָּ
  choice: Est-ce cela que tu estimes
  rationale: L’interrogatif, le démonstratif et le verbe חשב forment une question rhétorique. « Estimer » exprime ici le jugement porté sur ce qui est juste.
- source_word: לְמִשְׁפָּט
  choice: juste
  rationale: מִשְׁפָּט possède une nuance judiciaire et morale ; dans cette construction, « juste » rend naturellement l’évaluation contestée par Élihou.
- source_word: אָמַרְתָּ
  choice: Tu dis
  rationale: Bien que la forme soit un accompli, la parole passée de Job est citée comme une position encore actuelle dans l’argument d’Élihou.
- source_word: צִדְקִי
  choice: Ma justice
  rationale: צֶדֶק désigne ici la rectitude ou le bon droit revendiqué par Job. « Justice » conserve la portée à la fois morale et judiciaire, sans réduire le terme à la seule innocence.
- source_word: מֵאֵל
  choice: plus grande que celle de Dieu
  rationale: מִן peut introduire une comparaison. L’ajout de « celle » explicite en français que la justice de Job est comparée à celle de Dieu, tout en maintenant l’autre analyse possible en note.
theological_decisions:
- issue: Sens de l’affirmation attribuée à Job par Élihou
  choice: 'Lecture comparative : « Ma justice est plus grande que celle de Dieu »'
  alternative: « Je suis juste devant Dieu » ou « Mon bon droit vient de Dieu »
  rationale: L’expression hébraïque צִדְקִי מֵאֵל est très condensée. La lecture comparative cadre bien avec le reproche formulé par Élihou, mais les autres rapports possibles entre « ma justice » et « Dieu » ne doivent pas être effacés.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement correspond au discours adressé personnellement à Job. La formulation conserve la force rhétorique et signale en note l’ambiguïté syntaxique majeure.
