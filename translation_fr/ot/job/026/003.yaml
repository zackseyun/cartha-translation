  text: מַה יָּ֭עַצְתָּ לְ/לֹ֣א חָכְמָ֑ה וְ֝/תוּשִׁיָּ֗ה לָ/רֹ֥ב הוֹדָֽעְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/003.yaml
  text: How you have counseled one without wisdom[a], and made sound wisdom known abundantly!
translation:
  language: fr
  text: Comme tu as bien conseillé celui qui manque de sagesse[a] et fait connaître en abondance une sagesse solide !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quel conseil tu as donné à celui qui manque de sagesse, et quelle sagesse solide tu as fait connaître en abondance ! » Le mot hébreu d’ouverture peut être rendu par « quel » ou par « comme » ; le texte retient la tournure exclamative avec « comme » pour faire entendre l’ironie de Job.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Comme
  rationale: Dans cette exclamation ironique, « Comme » rend naturellement la force de מַה sans réduire l’énoncé à une simple question.
- source_word: יָּעַצְתָּ
  choice: tu as bien conseillé
  rationale: Le verbe יעץ signifie « conseiller ». L’adverbe « bien », idiomatique dans une exclamation française introduite par « Comme », explicite la portée qualitative de la tournure sans atténuer l’ironie du contexte.
- source_word: לְלֹא חָכְמָה
  choice: celui qui manque de sagesse
  rationale: Cette formulation rend la construction « à celui qui n’a pas de sagesse » dans un français actuel et naturel, sans préciser davantage l’identité du référent.
- source_word: חָכְמָה
  choice: sagesse
  rationale: Équivalent usuel et approprié dans la littérature sapientiale.
- source_word: וְתוּשִׁיָּה
  choice: une sagesse efficace
  rationale: תּוּשִׁיָּה désigne ici une sagesse solide, avisée et capable d’aboutir à des résultats. « Sagesse efficace » conserve ce lien avec la sagesse tout en la distinguant de חָכְמָה.
- source_word: לָרֹב
  choice: en abondance
  rationale: La locution exprime l’ampleur de ce qui aurait été communiqué et maintient l’intensification sarcastique.
- source_word: הוֹדָעְתָּ
  choice: fait connaître
  rationale: Le hiphil de ידע signifie directement « faire connaître ».
theological_decisions:
- issue: Portée ironique de l’éloge
  choice: Conserver une exclamation positive en surface, dont l’ironie ressort du contexte
  alternative: Introduire explicitement une marque de sarcasme ou transformer le verset en question
  rationale: L’hébreu ne nomme pas le sarcasme ; il le fait entendre par le contexte du reproche de Job. La traduction préserve donc cette tension sans l’interpréter dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe exclamative conserve le parallélisme et l’ironie du reproche. Le marqueur [a] figure bien dans le texte principal.
