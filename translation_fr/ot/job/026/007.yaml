source:
  edition: WLC
  text: נֹטֶ֣ה צָפ֣וֹן עַל תֹּ֑הוּ תֹּ֥לֶה אֶ֝֗רֶץ עַל בְּלִי מָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/007.yaml
  text: He stretches out the north over emptiness[b][a]; he hangs the earth on nothing.
translation:
  language: fr
  text: Il déploie le nord au-dessus du vide[a] ; il suspend la terre sur rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-dessus de l’espace informe ». Le terme hébreu peut désigner le vide, l’absence de forme ou une étendue déserte. « Le nord » peut aussi évoquer ici le ciel septentrional.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: déploie
  rationale: Le participe qal de נטה exprime l’action d’étendre ou de déployer. « Déploie » est naturel en français et conserve l’image cosmique.
- source_word: צָפוֹן
  choice: le nord
  rationale: Le nom signifie d’abord « nord ». Dans ce contexte poétique, il peut désigner la partie septentrionale du ciel, mais la traduction littérale préserve cette ambiguïté.
- source_word: תֹּהוּ
  choice: le vide
  rationale: תֹּהוּ peut évoquer le vide, l’absence de forme ou une étendue déserte. « Le vide » est clair, digne et adapté à l’imagerie cosmique.
- source_word: תֹּלֶה
  choice: suspend
  rationale: Le participe qal de תלה signifie « suspendre » ou « accrocher ». « Suspend » rend directement l’image tout en étant idiomatique en français.
- source_word: אֶרֶץ
  choice: la terre
  rationale: Dans ce contexte cosmique, אֶרֶץ désigne la terre ou le monde, et non un territoire particulier.
- source_word: בְּלִי מָה
  choice: rien
  rationale: L’expression signifie « sans quoi que ce soit ». Avec עַל, « sur rien » en restitue de façon concise la force et l’image.
- source_word: עַל
  choice: au-dessus de / sur
  rationale: 'La même préposition reçoit deux équivalents français dictés par les constructions naturelles : « au-dessus du vide » puis « sur rien », sans perdre son sens spatial.'
theological_decisions:
- issue: Imagerie cosmologique
  choice: Conserver la description poétique de la souveraineté de Dieu sur l’ordre créé sans lui imposer une interprétation scientifique moderne.
  alternative: Lire le verset comme un énoncé scientifique précis, ou expliciter « le nord » comme une référence mythologique.
  rationale: Le texte hébreu emploie une imagerie cosmique concise. La traduction la maintient sans la réduire à une simple métaphore ni ajouter une interprétation absente du verset.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux propositions et les participes hébreux sont rendus par deux présents d’action. Une seule note regroupe les deux ambiguïtés lexicales afin de garder un texte principal fluide.
