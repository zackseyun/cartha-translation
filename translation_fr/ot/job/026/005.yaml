source:
  edition: WLC
  text: הָ/רְפָאִ֥ים יְחוֹלָ֑לוּ מִ/תַּ֥חַת מַ֝֗יִם וְ/שֹׁכְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/005.yaml
  text: The departed spirits tremble beneath the waters[a], and those who dwell in them.
translation:
  language: fr
  text: Les esprits des morts tremblent sous les eaux[a], ainsi que ceux qui les habitent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les morts se tordent sous les eaux. » Le mot hébreu רְפָאִים peut désigner « les morts » ou « les ombres », et le verbe יְחוֹלָלוּ peut aussi se traduire par « se tordent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְפָאִים
  choice: les esprits des morts
  rationale: Dans ce contexte poétique consacré à la souveraineté de Dieu sur le monde souterrain, le terme désigne les morts qui y séjournent plutôt que le peuple ancien des Rephaïm. Cette formulation reste claire en français moderne tout en conservant la dimension poétique du terme.
- source_word: יְחוֹלָלוּ
  choice: tremblent
  rationale: Le verbe peut exprimer le tremblement, la torsion ou les douleurs de l’enfantement. Ici, « tremblent » rend naturellement l’agitation saisie d’effroi devant Dieu, sans exclure l’image plus physique signalée en note.
- source_word: מִתַּחַת מַיִם
  choice: sous les eaux
  rationale: Cette expression française naturelle conserve l’image spatiale de ce qui se trouve au-dessous des eaux.
- source_word: וְשֹׁכְנֵיהֶם
  choice: ainsi que ceux qui les habitent
  rationale: Le suffixe renvoie le plus naturellement aux eaux. La formulation explicite ce lien tout en préservant le parallélisme et sans préciser davantage l’identité de leurs habitants.
theological_decisions:
- issue: Référent de רְפָאִים
  choice: les morts, envisagés comme les esprits séjournant dans le monde souterrain
  alternative: les Rephaïm, ancien peuple ou groupe de géants
  rationale: Le contexte cosmique et souterrain de Job 26 favorise le sens poétique courant de « morts » ou « ombres ». Il s’agit d’une décision lexicale et contextuelle, non de l’introduction d’une doctrine particulière sur l’au-delà.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. « Esprits des morts » est plus immédiatement compréhensible que « ombres » et évite de traiter « Rephaïm » comme un nom propre dans ce contexte. La syntaxe demeure poétique et garde l’ambiguïté imagée du texte hébreu.
