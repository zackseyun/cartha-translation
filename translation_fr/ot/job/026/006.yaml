  text: עָר֣וֹם שְׁא֣וֹל נֶגְדּ֑/וֹ וְ/אֵ֥ין כְּ֝ס֗וּת לָֽ/אֲבַדּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/006.yaml
  text: Sheol lies naked before him[b][a], and Abaddon has no covering.
translation:
  language: fr
  text: Le séjour des morts[a] est à nu devant lui, et Abaddon[b] n’a pas de couverture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Shéol ».'
    reason: lexical_alternative
  - marker: b
    text: « Abaddon » peut aussi être traduit par « destruction » ou « lieu de destruction ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: est à nu
  rationale: L’adjectif signifie « nu, découvert ». « Est à nu » conserve l’image poétique vive et son parallélisme avec l’absence de couverture, sans introduire l’idée passive qu’il aurait été mis à découvert.
- source_word: שְׁאוֹל
  choice: le séjour des morts
  rationale: Cette expression française naturelle désigne le domaine des morts sans le réduire à une tombe individuelle. Une note signale la translittération traditionnelle « Shéol ».
- source_word: נֶגְדּוֹ
  choice: devant lui
  rationale: Rend directement la préposition et le suffixe masculin singulier. Le contexte identifie Dieu comme référent sans qu’il soit nécessaire de l’expliciter dans le verset.
- source_word: אֵין
  choice: est sans
  rationale: Dans la seconde proposition, « est sans couverture » exprime naturellement l’absence indiquée par אֵין tout en conservant la structure nominale de l’hébreu.
- source_word: כְּסוּת
  choice: couverture
  rationale: Le nom désigne ce qui couvre. « Couverture » maintient le lien métaphorique précis avec « à nu » dans le premier membre.
- source_word: אֲבַדּוֹן
  choice: l’Abaddôn
  rationale: La translittération préserve la force poétique d’un terme parallèle au séjour des morts et ses résonances bibliques, sans décider s’il faut exclusivement l’entendre comme un lieu ou comme l’abstraction « destruction ».
theological_decisions:
- issue: Référent du suffixe masculin singulier dans נֶגְדּוֹ
  choice: « devant lui », avec Dieu comme référent contextuel
  alternative: Un observateur non précisé dans le discours immédiat
  rationale: Le contexte décrit la connaissance et la puissance de Dieu sur les domaines cachés. La formulation pronominale respecte l’hébreu sans ajouter le nom de Dieu au texte.
- issue: Nature d’אֲבַדּוֹן
  choice: Conserver « l’Abaddôn » comme désignation poétique
  alternative: Traduire « la destruction » ou « le lieu de destruction »
  rationale: Son parallélisme avec le séjour des morts favorise une désignation quasi toponymique, mais le texte garde une tension entre lieu personnifié et nom abstrait; la note conserve l’autre lecture.
translation_notes:
  register: Français international moderne, poétique et digne. « À nu » et « sans couverture » rendent le parallélisme concret de l’hébreu. L’article devant « Abaddôn » facilite la lecture française et marque ici une désignation du domaine parallèle au séjour des morts.
