source:
  edition: WLC
  text: בְּ֭/רוּח/וֹ שָׁמַ֣יִם שִׁפְרָ֑ה חֹֽלֲלָ֥ה יָ֝ד֗/וֹ נָחָ֥שׁ בָּרִֽיחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/013.yaml
  text: By his breath the heavens are made fair[c][b][a]; his hand pierced the fleeing serpent.
translation:
  language: fr
  text: Par son souffle[a], il a rendu les cieux splendides ; sa main a transpercé[b] le serpent fuyard[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par son Esprit » ou « par son vent ». Le mot hébreu peut signifier souffle, vent ou esprit.
    reason: lexical_alternative
  - marker: b
    text: Ou « a formé ». Le verbe hébreu peut être compris de différentes manières ; « a transpercé » s’accorde bien avec l’image d’un combat.
    reason: alternative_reading
  - marker: c
    text: Le « serpent fuyard » évoque probablement un serpent cosmique associé aux forces du chaos ; voir Ésaïe 27.1.
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוּחוֹ
  choice: Par son souffle
  rationale: רוּחַ peut désigner le souffle, le vent ou l’esprit. « Souffle » conserve ici l’image poétique concrète de la puissance créatrice de Dieu sans imposer une référence personnelle distincte ; בְּ exprime le moyen.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: « Les cieux » convient au registre poétique et cosmologique du passage et rend mieux l’expression hébraïque que le singulier plus ordinaire « le ciel ».
- source_word: שִׁפְרָה
  choice: sont devenus splendides
  rationale: Le verbe שׁפר évoque la beauté, l’éclat ou l’embellissement. Cette formulation française exprime naturellement le résultat de l’action tout en gardant la tonalité poétique.
- source_word: חֹלֲלָה
  choice: a transpercé
  rationale: Dans cette forme et ce contexte poétique, חול peut être compris comme « transpercer », mais aussi comme « former ». Avec « sa main » pour sujet et le serpent pour objet, « transpercer » s’accorde bien avec l’imagerie de combat cosmique, sans dissimuler l’autre analyse dans la note.
- source_word: יָדוֹ
  choice: sa main
  rationale: Le terme concret est conservé. Dans la poésie hébraïque, la main représente souvent la puissance agissante, mais il n’est pas nécessaire d’expliciter cette métonymie dans le texte.
- source_word: נָחָשׁ בָּרִיחַ
  choice: le serpent fuyard
  rationale: בָּרִיחַ peut évoquer ce qui fuit, glisse ou s’étend. « Serpent fuyard » est une lecture défendable qui préserve l’image hébraïque et son possible arrière-plan de combat cosmique sans identifier explicitement le serpent.
theological_decisions:
- issue: Faut-il rendre רוּחַ par « Esprit » et suggérer une référence trinitaire distincte ?
  choice: Le texte principal porte « souffle ».
  alternative: « Esprit » ou « vent ».
  rationale: La poésie décrit la puissance divine à l’œuvre, mais l’hébreu ne contraint pas à voir ici une référence personnelle explicite à l’Esprit. La note maintient l’ambiguïté lexicale.
- issue: Faut-il identifier נָחָשׁ בָּרִיחַ à Satan ou à Léviathan dans le texte principal ?
  choice: L’image non interprétée « le serpent fuyard » est conservée.
  alternative: « Léviathan », « le serpent du chaos » ou, dans une lecture théologique ultérieure, Satan.
  rationale: Le verset peut évoquer un combat cosmique, mais il ne nomme ni Satan ni Léviathan. La traduction ne précise donc pas le référent au-delà du texte.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste claire pour un lectorat général. « Splendides », « transpercé » et « serpent fuyard » préservent l’intensité imagée du vers sans ajouter d’identification doctrinale.
