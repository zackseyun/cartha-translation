  text: How you have helped the powerless! How you have saved the arm without strength![a]
translation:
  language: fr
  text: Comme tu as aidé celui qui est sans force ! Comme tu as sauvé le bras sans vigueur ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Quelle aide as-tu apportée à celui qui est sans force ? Comment as-tu sauvé un bras sans vigueur ? » L’hébreu est fortement ironique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה
  choice: Comme
  rationale: Dans ces questions rhétoriques à forte valeur ironique, מֶה peut être rendu idiomatiquement par une exclamation en « Comme… ! », plus naturelle ici que « Qu’as-tu… ? » tout en conservant la pointe sarcastique.
- source_word: עָזַרְתָּ
  choice: tu as aidé
  rationale: Le verbe עזר signifie « aider » ; le passé composé convient au discours direct et à la forme accomplie hébraïque.
- source_word: לְלֹא כֹחַ
  choice: celui qui est sans force
  rationale: Cette formulation conserve la référence singulière implicite et rend explicitement l’absence de כֹחַ, sans transformer l’expression en catégorie collective.
- source_word: הוֹשַׁעְתָּ
  choice: tu as sauvé
  rationale: Le hifil de ישׁע exprime l’action de sauver ou délivrer. « Sauvé » maintient le parallélisme avec « aidé » et la force ironique.
- source_word: זְרוֹעַ
  choice: le bras
  rationale: Le terme désigne littéralement le bras, image hébraïque de la puissance. La métaphore est conservée plutôt que remplacée par son sens figuré.
- source_word: לֹא עֹז
  choice: sans vigueur
  rationale: עֹז signifie force ou puissance. « Vigueur » évite une répétition lourde de « force » tout en préservant le parallèle sémantique.
