source:
  edition: WLC
  text: בְּ֭/כֹח/וֹ רָגַ֣ע הַ/יָּ֑ם ו/ב/תובנת/ו מָ֣חַץ רָֽהַב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/012.yaml
  text: By his power he stilled the sea[a], and by his understanding he shattered Rahab.
translation:
  language: fr
  text: 'Par sa puissance, il a calmé la mer ;

    par son intelligence, il a fracassé Rahab.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Rahab est ici le nom poétique d’une puissance du chaos ou d’un monstre marin auquel Dieu s’oppose ; on pourrait aussi traduire de manière interprétative : « le monstre marin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹחוֹ
  choice: Par sa puissance
  rationale: Le ב instrumental indique le moyen. « Puissance » convient au cadre cosmique et forme une expression naturelle en français.
- source_word: רָגַע
  choice: il a calmé
  rationale: Avec « la mer » comme complément, le verbe exprime ici vraisemblablement l’apaisement ou la maîtrise de la mer. « Calmé » reste naturel tout en préservant l’image poétique.
- source_word: הַיָּם
  choice: la mer
  rationale: Traduction directe qui conserve à la fois le sens concret et les résonances poétiques de la mer comme puissance chaotique.
- source_word: וּבִתְבוּנָתוֹ
  choice: par son intelligence
  rationale: תְּבוּנָה désigne l’intelligence, la compréhension ou le discernement. « Intelligence » est idiomatique et maintient le thème sapientiel du livre.
- source_word: מָחַץ
  choice: il a fracassé
  rationale: Le verbe évoque un coup qui écrase ou brise avec force. « Fracassé » rend cette violence décisive dans un registre poétique actuel.
- source_word: רָהַב
  choice: Rahab
  rationale: Le terme fonctionne ici comme le nom poétique d’une puissance du chaos. La translittération préserve l’image hébraïque et évite de réduire le mot à une seule interprétation.
theological_decisions:
- issue: Faut-il rendre רָהַב comme un nom propre ou l’interpréter de manière générique ?
  choice: Le nom propre « Rahab », désignant poétiquement une puissance du chaos vaincue par Dieu
  alternative: « le monstre marin » ou, plus abstraitement, « l’orgueil »
  rationale: Le contexte cosmologique et le parallélisme avec la mer favorisent une figure mythopoétique. Garder le nom propre préserve la tension et l’imagerie du texte ; une note en précise le sens possible sans l’imposer dans le verset.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est conservé sur deux lignes ; les verbes « calmé » et « fracassé » rendent clairement le contraste entre maîtrise et défaite violente.
