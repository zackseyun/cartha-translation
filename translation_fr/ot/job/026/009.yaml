  text: He covers the face of his throne[b][a], spreading his cloud over it.
translation:
  language: fr
  text: 'Il couvre la face du trône[a][b],

    étendant sur lui sa nuée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il saisit la face du trône ». Le verbe hébreu signifie plus littéralement « saisir » ou « tenir », mais il semble ici évoquer l’action de couvrir ou de dissimuler.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la face du trône », c’est-à-dire sa partie visible ou sa surface.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֵז
  choice: couvre
  rationale: Le verbe signifie plus littéralement « saisir » ou « tenir ». Dans ce parallélisme poétique, où la nuée est étendue sur le trône, « couvre » exprime naturellement l’effet de dissimulation sans effacer l’autre sens, signalé en note.
- source_word: פְּנֵי
  choice: la face de
  rationale: Cette formulation conserve l’image hébraïque de la « face », c’est-à-dire la partie visible ou la surface du trône.
- source_word: כִסֵּה
  choice: son trône
  rationale: Le nom désigne le trône. Le possessif, naturel en français, renvoie au sujet divin implicite, comme le fait explicitement le suffixe de « sa nuée » dans la suite du verset.
- source_word: פַּרְשֵׁז
  choice: étendant
  rationale: Le verbe exprime l’action de déployer ou d’étendre. Le participe français maintient le lien poétique avec la proposition précédente.
- source_word: עָלָיו
  choice: sur lui
  rationale: Le suffixe masculin singulier renvoie le plus naturellement au trône ; « sur lui » respecte son genre grammatical en français.
- source_word: עֲנָנוֹ
  choice: sa nuée
  rationale: Le singulier avec suffixe signifie « sa nuée ». « Nuée » convient au registre poétique et à l’image d’une présence céleste qui voile le trône.
theological_decisions:
- issue: Sujet implicite et appartenance du trône
  choice: Le verset présente Dieu couvrant son propre trône de sa nuée.
  alternative: Traduire plus littéralement « le trône », sans possessif explicite.
  rationale: Le contexte décrit l’action souveraine de Dieu, et « sa nuée » identifie clairement le sujet implicite. « Son trône » rend cette cohérence en français sans ajouter de précision doctrinale étrangère au texte.
- issue: Sens de מְאַחֵז
  choice: Rendre le sens contextuel par « couvre » tout en conservant le sens plus littéral en note.
  alternative: « Il saisit la face du trône » ou « Il tient fermement la face du trône ».
  rationale: L’image de la nuée étendue sur le trône favorise l’idée de le couvrir ou de le dissimuler, mais le sens concret de « saisir » demeure une possibilité lexicale authentique.
translation_notes:
  register: Français moderne, digne et poétique. « Nuée » préserve le registre biblique sans être obscur ; « la face de son trône » maintient l’image concrète de l’hébreu. Les deux notes sont placées immédiatement après l’expression concernée.
