  text: אֶת מִ֭י הִגַּ֣דְתָּ מִלִּ֑ין וְ/נִשְׁמַת מִ֝י יָצְאָ֥ה מִמֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/004.yaml
  text: To whom have you declared words[a], and whose breath has come out from you?
translation:
  language: fr
  text: 'À qui as-tu adressé des paroles,

    et de qui le souffle est-il sorti de toi[a] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et l’esprit de qui est sorti de toi ? » Le nom hébreu peut désigner le « souffle » ou, dans certains contextes, l’« esprit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי
  choice: À qui
  rationale: La particule devant l’interrogatif désigne ici la personne à qui les paroles sont adressées; « À qui » restitue naturellement la question rhétorique.
- source_word: הִגַּדְתָּ מִלִּין
  choice: as-tu adressé ces paroles
  rationale: Le hiphil de נגד signifie « déclarer, faire connaître, dire », et מִלִּין désigne des paroles. Dans ce contexte d’interlocution, « adresser ces paroles » est idiomatique en français et conserve la portée critique de la question.
- source_word: וְנִשְׁמַת מִי
  choice: et de qui vient le souffle
  rationale: נְשָׁמָה peut désigner le souffle, le souffle vital ou, par extension, l’esprit. « Souffle » préserve l’image concrète sans exclure l’allusion à l’inspiration.
- source_word: יָצְאָה מִמֶּךָּ
  choice: qui est sorti de toi
  rationale: יצא exprime concrètement le fait de sortir. Cette formulation garde l’image hébraïque d’un souffle émanant de l’interlocuteur.
theological_decisions:
- issue: Identité du souffle émanant de l’interlocuteur
  choice: Traduire concrètement par « souffle » et signaler « esprit » en note
  alternative: « et l’esprit de qui est sorti de toi ? »
  rationale: Le texte peut interroger soit la source du discours, soit l’inspiration qui l’anime. La traduction ne doit pas trancher silencieusement cette ambiguïté.
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme interrogatif est conservé sur deux lignes. « Ces paroles » est naturel dans la réplique directe, tandis que la note maintient l’ambiguïté théologique de נְשָׁמָה.
