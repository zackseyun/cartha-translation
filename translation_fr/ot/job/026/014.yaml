source:
  edition: WLC
  text: הֶן אֵ֤לֶּה קְצ֬וֹת דרכ/ו וּ/מַה שֵּׁ֣מֶץ דָּ֭בָר נִשְׁמַע בּ֑/וֹ וְ/רַ֥עַם גבורת/ו מִ֣י יִתְבּוֹנָֽן־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/026/014.yaml
  text: Look[a], these are the fringes of his ways[b], and what a mere whisper we hear of him! But the thunder of his power—who can understand it?
translation:
  language: fr
  text: 'Voici : ce ne sont là que les confins de ses voies[a], et comme le murmure que nous entendons à son sujet est faible[b] ! Mais le tonnerre de sa puissance, qui peut le comprendre ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les extrémités de ses voies ». L’hébreu évoque les bords les plus éloignés de ce que Dieu accomplit.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression hébraïque est rare et peut aussi se traduire : « comme le peu que nous entendons à son sujet est infime ! » Elle souligne combien ce qui est entendu est faible en comparaison du « tonnerre » de sa puissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Oui
  rationale: Particule déictique et emphatique. « Oui » attire l’attention tout en s’intégrant naturellement à la conclusion poétique du discours.
- source_word: קְצוֹת
  choice: les confins
  rationale: Le terme désigne les extrémités ou les bords. « Les confins » exprime que seuls les contours les plus éloignés de l’action divine sont perceptibles.
- source_word: דְּרָכָיו
  choice: ses voies
  rationale: Traduction proche de la métaphore hébraïque, naturelle dans un registre biblique actuel, sans réduire le sens aux seules œuvres.
- source_word: שֵׁמֶץ דָּבָר
  choice: le murmure ... est faible
  rationale: Cette expression rare évoque une infime portion, peut-être un son à peine perceptible. La formulation française conserve l’image auditive et son contraste avec le tonnerre.
- source_word: נִשְׁמַע בּוֹ
  choice: nous entendons à son sujet
  rationale: Le passif hébreu peut se rendre collectivement en français. « À son sujet » indique ce qui est perçu concernant Dieu, sans imposer l’idée d’une parole directement prononcée par lui.
- source_word: רַעַם גְּבוּרָתוֹ
  choice: le tonnerre de sa puissance
  rationale: Traduction directe qui maintient la puissante opposition poétique entre le faible murmure entendu et le tonnerre de la puissance divine.
- source_word: יִתְבּוֹנָן
  choice: peut le comprendre
  rationale: Le verbe exprime une compréhension attentive ou un discernement profond. « Comprendre » convient à la question rhétorique et demeure accessible.
theological_decisions:
- issue: Portée de la connaissance humaine de Dieu dans cette image poétique
  choice: Le texte affirme que les humains ne perçoivent que les confins des voies de Dieu et n’entendent qu’un faible murmure à son sujet.
  alternative: Limiter strictement cette affirmation aux seules œuvres cosmiques énumérées dans le contexte immédiat.
  rationale: Le contexte concerne les actes cosmiques de Dieu, mais les expressions « ses voies » et « sa puissance » ont une portée poétique qui ne doit être ni artificiellement élargie à tout l’être divin ni restreinte davantage que le texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme sonore entre « murmure » et « tonnerre » est conservé. Les marqueurs [a] et [b] figurent dans le texte principal.
