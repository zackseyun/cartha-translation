  text: חֹֽק חָ֭ג עַל פְּנֵי מָ֑יִם עַד תַּכְלִ֖ית א֣וֹר עִם חֹֽשֶׁךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/010.yaml
  text: He inscribed a circle on the surface of the waters[a], at the boundary of light and darkness.
translation:
  language: fr
  text: Il a tracé un cercle à la surface des eaux[a], jusqu’à la limite entre la lumière et les ténèbres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il a fixé une limite à la surface des eaux, jusqu’à la frontière entre la lumière et les ténèbres. »
    reason: Alternative lexicale préservant l’idée de limite fixée pour חֹק et l’expression poétique de la limite entre la lumière et les ténèbres.
lexical_decisions:
- source_word: חֹק חָג
  choice: a tracé un cercle
  rationale: חֹק désigne ici une limite fixée, tandis que חָג évoque l’action de tracer un cercle. Cette formulation française conserve l’image concrète d’une démarcation circulaire.
- source_word: עַל פְּנֵי מָיִם
  choice: à la surface des eaux
  rationale: פְּנֵי signifie littéralement « face » et, dans ce contexte spatial, se rend naturellement par « surface ».
- source_word: עַד תַּכְלִית
  choice: à la limite
  rationale: עַד indique le point jusqu’où s’étend le tracé, et תַּכְלִית son terme ou sa limite.
- source_word: אוֹר עִם חֹשֶׁךְ
  choice: entre la lumière et les ténèbres
  rationale: Littéralement « lumière avec ténèbres » ; « entre » exprime naturellement en français leur ligne de rencontre ou de séparation sans supprimer l’image poétique.
