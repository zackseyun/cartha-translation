  text: עַמּוּדֵ֣י שָׁמַ֣יִם יְרוֹפָ֑פוּ וְ֝/יִתְמְה֗וּ מִ/גַּעֲרָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/011.yaml
  text: The pillars of heaven tremble and are astonished at his rebuke[a][b][c].
translation:
  language: fr
  text: Les piliers du ciel tremblent[a] et sont stupéfaits[b] à sa réprimande[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vacillent » ou « sont ébranlés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sont saisis de stupeur » ; le verbe peut aussi exprimer l’effarement.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement « de sa réprimande » ; la préposition peut exprimer la source ou la cause : « à cause de sa réprimande ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי שָׁמַיִם
  choice: les piliers du ciel
  rationale: Le pluriel construit עַמּוּדֵי désigne des « piliers » ou des « colonnes ». « Les piliers du ciel » conserve naturellement en français l’image cosmique du texte sans la réduire à des fondations ni la transformer en explication.
- source_word: יְרוֹפָפוּ
  choice: tremblent
  rationale: Le verbe רפף exprime un mouvement de tremblement ou d’ébranlement. « Tremblent » restitue à la fois le mouvement et la réaction impressionnante évoquée par le parallélisme.
- source_word: וְיִתְמְהוּ
  choice: et sont stupéfaits
  rationale: Le verbe תמהּ exprime la stupeur ou l’étonnement profond. « Sont stupéfaits » est actuel et naturel, tout en évitant la nuance de répulsion morale que pourrait introduire « sont horrifiés ».
- source_word: מִגַּעֲרָתוֹ
  choice: devant sa réprimande
  rationale: La préposition מִן peut indiquer la source ou la cause de la réaction. « Devant sa réprimande » est idiomatique en français et maintient le lien entre la parole souveraine de Dieu et la réaction des piliers, tandis que la note conserve la formulation plus littérale et la valeur causale possible.
theological_decisions:
- issue: Image cosmique des « piliers du ciel »
  choice: Conserver l’image poétique cosmologique sans l’expliquer ni la présenter comme un énoncé scientifique littéral.
  alternative: Interpréter explicitement les piliers comme des montagnes, ou remplacer l’image par une formulation cosmologique moderne.
  rationale: La poésie de Job emploie une représentation cosmique saisissante. La traduction doit préserver cette image et sa force théologique sans imposer une identification absente du texte.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le parallélisme poétique et l’image cosmique. « Réprimande » rend le caractère verbal et autoritaire de גְּעָרָה sans ajouter une terminologie doctrinale.
