source:
  edition: WLC
  text: צֹרֵֽר מַ֥יִם בְּ/עָבָ֑י/ו וְ/לֹא נִבְקַ֖ע עָנָ֣ן תַּחְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/008.yaml
  text: He binds up the waters in his clouds[b][a], yet the cloud is not split open under them.
translation:
  language: fr
  text: Il enferme les eaux dans ses nuages[a], et pourtant la nuée ne se déchire pas sous elles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ses épais nuages »; le terme hébreu peut souligner la densité de la masse nuageuse.
    reason: lexical_alternative
  - marker: b
    text: Ou « n’éclate pas ». Le pronom traduit par « elles » est pluriel en hébreu et peut renvoyer aux eaux ou aux masses nuageuses.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרֵר
  choice: enferme
  rationale: Le participe de צרר évoque l’action de lier, envelopper ou retenir dans un espace clos. « Enferme » restitue naturellement l’image des eaux contenues dans les nuages.
- source_word: מַיִם
  choice: les eaux
  rationale: Le pluriel français convient au registre poétique et à l’imagerie cosmique du passage.
- source_word: בְּעָבָיו
  choice: dans ses nuages
  rationale: עָב désigne un nuage, souvent épais ou dense. « Ses nuages » conserve le possessif et reste fluide; la nuance de densité est signalée en note.
- source_word: וְלֹא
  choice: et pourtant ... ne ... pas
  rationale: La coordination exprime ici le contraste surprenant entre les eaux retenues et la nuée qui ne cède pas.
- source_word: נִבְקַע
  choice: ne se déchire pas
  rationale: Le nifal de בקע exprime le fait d’être fendu ou ouvert. La tournure pronominale française conserve l’image physique sans privilégier l’idée plus interprétative d’un éclatement.
- source_word: עָנָן
  choice: la nuée
  rationale: Le singulier hébreu est conservé. « Nuée » convient à la poésie biblique tout en distinguant légèrement ce collectif du pluriel « nuages ».
- source_word: תַּחְתָּם
  choice: sous elles
  rationale: Le suffixe est pluriel et renvoie très probablement aux eaux. Le français impose un genre au pronom; une note signale que l’antécédent hébreu peut aussi être compris comme les masses nuageuses.
