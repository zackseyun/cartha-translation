  yaml_path: translation/ot/job/013/009.yaml
  text: Will it be good when he examines you? Or will you mock him as one mocks a man?[a][b]
translation:
  language: fr
  text: Sera-t-il bon quand il vous examinera ? Ou vous moquerez-vous de lui comme on se moque d’un être humain[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi signifier « le tromper » ou « se jouer de lui » ; le mot rendu par « être humain » peut souligner la condition mortelle ou fragile de l’être humain, par contraste avec Dieu dans le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב
  choice: Est-ce que cela tournera bien pour vous
  rationale: La particule interrogative et טוֹב forment une question rhétorique orientée vers l’issue de l’examen. L’ajout explicite « pour vous » rend en français naturel l’implication contextuelle sans changer le sens.
- source_word: כִּי
  choice: quand
  rationale: כִּי introduit ici la circonstance temporelle dans laquelle l’issue est envisagée.
- source_word: יַחְקֹר אֶתְכֶם
  choice: il vous examinera
  rationale: חקר exprime un examen ou une investigation approfondie; le futur français convient à l’imparfait hébreu dans cet avertissement prospectif. « Vous » est pluriel dans le contexte.
- source_word: אִם
  choice: Ou
  rationale: Dans le parallélisme interrogatif, אִם introduit la seconde possibilité.
- source_word: כְּהָתֵל בֶּאֱנוֹשׁ
  choice: comme on se moque d’un simple être humain
  rationale: התל peut signifier se moquer, tromper ou jouer avec quelqu’un. « Se moquer » conserve ici la force accusatrice; « simple être humain » fait entendre le contraste entre l’humanité fragile et Dieu.
- source_word: תְּהָתֵלּוּ בוֹ
  choice: vous moquerez-vous de lui
  rationale: Le verbe à la deuxième personne masculine plurielle décrit la conduite des interlocuteurs envers Dieu; la tournure interrogative française garde la rhétorique du texte.
theological_decisions:
- issue: Référent des pronoms masculins singuliers
  choice: Les pronoms renvoient à Dieu, sans remplacer « il/lui » par le nom « Dieu » dans le corps du verset.
  alternative: Un examinateur ou juge non précisé.
  rationale: Le contexte immédiat (Job 13.7-11) présente Dieu comme celui qui sondera les interlocuteurs de Job. Le maintien des pronoms respecte toutefois la forme et la cohésion du texte hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est conservée, ainsi que le contraste entre Dieu et l’être humain mortel. Une seule note regroupe les deux précisions lexicales directement liées à la seconde proposition.
