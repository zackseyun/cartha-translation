    rationale: אֱנוֹשׁ peut évoquer la condition mortelle ou fragile, mais ne contient pas l'adjectif « simple ». « un être humain » préserve mieux le lexème tout en gardant le contraste contextuel.
  - severity: low
    issue: Alternative lexicale « jouer avec lui »
    rationale: Pour התל, « se jouer de lui » est une alternative française plus naturelle et plus proche de l'idée de railler, tromper ou traiter avec légèreté.
