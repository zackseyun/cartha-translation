  text: גַּם הוּא לִ֥/י לִֽ/ישׁוּעָ֑ה כִּי לֹ֥א לְ֝/פָנָ֗י/ו חָנֵ֥ף יָבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/016.yaml
  text: This also will be my salvation[b][a], for no godless man may come before him.
translation:
  language: fr
  text: Cela aussi sera mon salut[a], car aucun impie[b] ne peut se présenter devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « délivrance » ou « réhabilitation ».
    reason: lexical_alternative
  - marker: b
    text: Ou « homme profane ». Le mot hébreu désigne ici une personne irrévérencieuse envers Dieu; il peut aussi être traduit par « hypocrite », mais son sens ne se limite pas au manque de sincérité.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Cela aussi
  rationale: La combinaison marque ici l’ajout et renvoie probablement à la démarche ou à la situation évoquée juste avant, plutôt qu’à une personne distincte.
- source_word: לִי לִישׁוּעָה
  choice: contribuera à mon salut
  rationale: La tournure hébraïque signifie littéralement « sera pour moi en salut ». Cette formulation française restitue l’idée qu’un élément de la conduite de Job jouera en faveur de sa délivrance ou de sa justification, sans rendre la phrase artificielle.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison qui fonde l’affirmation précédente.
- source_word: חָנֵף
  choice: impie
  rationale: Le terme qualifie une personne irrévérencieuse ou moralement profane devant Dieu; « impie » évite le sens trop étroit d’« hypocrite ».
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Rend l’expression idiomatique désignant la présence de quelqu’un, tout en conservant le pronom masculin du texte.
- source_word: לֹא ... יָבוֹא
  choice: aucun ... ne peut se présenter
  rationale: Dans ce contexte, la négation exprime vraisemblablement l’impossibilité ou la non-admission d’un impie dans la présence divine; « se présenter » convient au cadre judiciaire du discours de Job.
theological_decisions:
- issue: Référent de « lui » dans לְפָנָיו
  choice: Conserver « lui », avec Dieu comme référent contextuel probable
  alternative: Expliciter « devant Dieu »
  rationale: Le contexte désigne naturellement Dieu, mais le texte hébreu emploie un pronom. Le conserver respecte sa forme et n’explicite pas davantage que la source.
- issue: Portée de יְשׁוּעָה
  choice: salut, englobant ici délivrance et justification
  alternative: délivrance ou justification
  rationale: « Salut » garde la valeur large et solennelle du substantif, tandis qu’une note signale les nuances particulièrement pertinentes dans le plaidoyer de Job.
- issue: Force de לֹא ... יָבוֹא
  choice: ne peut se présenter
  alternative: ne se présentera pas
  rationale: La logique du verset paraît porter sur l’accès possible à la présence de Dieu. La modalité reste toutefois susceptible d’être comprise comme une affirmation au futur, ce que la note reconnaît.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure concise; « se présenter devant lui » préserve à la fois le cadre judiciaire et l’expression de présence. Tous les marqueurs de note figurent dans le texte principal.
