  text: Why do you hide your face and count me as your enemy?[a]
translation:
  language: fr
  text: Pourquoi caches-tu ton visage et me tiens-tu pour ton ennemi[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et me considères-tu comme ton ennemi ? »'
    reason: Variante lexicale pour « me tiens-tu pour », qui rend le verbe hébreu « considérer, compter pour » tout en conservant la relation « ton ennemi ».
lexical_decisions:
- source_word: לָמָה
  choice: Pourquoi
  rationale: Interrogatif direct de cause, naturel et fidèle en français moderne.
- source_word: פָנֶיךָ
  choice: ton visage
  rationale: Conserve l’image concrète de l’hébreu, qui peut évoquer la présence ou la faveur sans expliciter davantage la métaphore.
- source_word: תַסְתִּיר
  choice: caches-tu
  rationale: Rend directement le sens de « cacher, dissimuler » et préserve l’expression relationnelle « cacher son visage ».
- source_word: וְתַחְשְׁבֵנִי
  choice: et me tiens-tu pour
  rationale: Cette tournure française naturelle exprime ici l’idée de considérer ou regarder quelqu’un comme quelque chose.
- source_word: לְאוֹיֵב
  choice: pour ton ennemi
  rationale: Rend le complément prédicatif « comme ennemi » dans une construction française idiomatique.
- source_word: לָךְ
  choice: ton
  rationale: 'Intègre naturellement la relation exprimée littéralement par « pour toi » : Job demande pourquoi Dieu le regarde comme son propre ennemi.'
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu dans « cacher ton visage »
  choice: Conserver l’expression « caches-tu ton visage »
  alternative: « retires-tu ta présence » ou « te détournes-tu de moi »
  rationale: Le texte hébreu emploie l’image concrète du visage de Dieu. La conserver maintient sa force poétique et théologique sans réduire son sens à une seule interprétation.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à l’adresse directe à Dieu et convient au registre poétique du livre de Job. La formulation principale privilégie une tournure française naturelle tout en conservant l’image hébraïque du visage.
