source:
  edition: WLC
  text: וְֽ/אוּלָ֗ם אַתֶּ֥ם טֹֽפְלֵי שָׁ֑קֶר רֹפְאֵ֖י אֱלִ֣ל כֻּלְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/004.yaml
  text: But you are plasterers of lies[b][a]; all of you are worthless physicians.
translation:
  language: fr
  text: Mais vous, vous êtes des fabricants de mensonges[a] ; vous êtes tous des médecins sans valeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous étalez des mensonges ». Le verbe hébreu peut évoquer le fait d’étaler ou d’appliquer une couche, image qui suggère qu’ils masquent la réalité par la fausseté.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression hébraïque désigne des médecins sans utilité ni valeur. Autre traduction possible : « des médecins inutiles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mais
  rationale: Marque une opposition nette avec ce qui précède ; « Mais » restitue simplement et naturellement cette transition adversative.
- source_word: אַתֶּם
  choice: vous, vous
  rationale: Le redoublement idiomatique en français souligne le pronom explicite et l’adresse directe aux interlocuteurs de Job.
- source_word: טֹפְלֵי שָׁקֶר
  choice: vous étalez le mensonge
  rationale: La reformulation verbale reste naturelle en français tout en conservant l’image concrète de quelque chose que l’on applique ou étale pour masquer la réalité. Le singulier « le mensonge » rend le nom hébreu collectif.
- source_word: רֹפְאֵי
  choice: médecins
  rationale: Conserve l’image nominale de praticiens censés guérir, employée ici ironiquement pour dénoncer les mauvais conseils des amis.
- source_word: אֱלִל
  choice: sans valeur
  rationale: Dans cette construction, le terme désigne le néant, l’inutilité ou l’absence de valeur plutôt qu’une idole concrète.
- source_word: כֻּלְּכֶם
  choice: tous
  rationale: Préserve l’inclusion emphatique de l’ensemble des interlocuteurs de Job.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. La première proposition est verbalisée afin de préserver naturellement l’image hébraïque de l’étalement sans recourir au substantif peu idiomatique « étaleurs ». Le parallélisme accusateur et l’emphase finale sur la totalité des interlocuteurs sont maintenus.
