  yaml_path: translation/ot/job/013/027.yaml
  text: You put my feet in the stocks[a], and you watch all my paths; you mark out the soles of my feet.
translation:
  language: fr
  text: 'Tu mets mes pieds dans les ceps[a],

    tu surveilles tous mes sentiers,

    tu marques les plantes de mes pieds[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une entrave » ; le terme hébreu désigne un dispositif servant à immobiliser les pieds.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur les racines de mes pieds, tu te marques/te traces » ; le verbe peut évoquer une marque gravée, le tracé d’une limite ou d’un contour autour des pieds.
    reason: lexical_and_imagery_ambiguity
lexical_decisions:
- source_word: וְתָשֵׂם
  choice: tu mets
  rationale: Le verbe שׂים signifie couramment « mettre, placer ». « Tu mets » reste direct et naturel dans ce contexte de contrainte.
- source_word: בַּסַּד
  choice: dans les ceps
  rationale: סַד désigne un dispositif qui immobilise les pieds. « Les ceps » est le terme français précis pour cet instrument de détention, tout en conservant l’image carcérale du texte.
- source_word: וְתִשְׁמוֹר
  choice: tu surveilles
  rationale: שׁמר peut signifier garder, observer ou veiller sur. Ici, « surveilles » exprime l’observation étroite et hostile dont Job se plaint.
- source_word: כָּל אָרְחוֹתָי
  choice: tous mes sentiers
  rationale: אֹרַח désigne un sentier ou une voie et peut aussi évoquer la conduite. « Sentiers » maintient l’image concrète sans exclure sa portée existentielle.
- source_word: עַל שָׁרְשֵׁי רַגְלַי
  choice: de la plante de mes pieds
  rationale: שֹׁרֶשׁ signifie littéralement « racine », mais l’expression désigne ici la partie inférieure ou la base des pieds. « La plante de mes pieds » en donne le sens anatomique probable en français clair.
- source_word: תִּתְחַקֶּה
  choice: tu traces le contour
  rationale: La forme de חקה évoque l’action de tracer, graver ou délimiter. « Traces le contour » conserve l’image d’un marquage qui circonscrit les mouvements de Job, sans la réduire à une seule interprétation technique.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. « Ceps » est précis mais moins courant ; la note en explicite le sens. Le parallélisme poétique est conservé sur trois lignes, et la dernière proposition maintient l’ambiguïté entre marquage, contour et délimitation.
