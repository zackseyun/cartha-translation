  yaml_path: translation/ot/job/013/012.yaml
  text: Your maxims are proverbs of ashes[a]; your defenses are defenses of clay.
translation:
  language: fr
  text: Vos maximes sont des proverbes de cendre[a] ; vos défenses, des défenses d’argile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vos souvenirs sont des proverbes de cendre ; vos remparts, des remparts d’argile. » L’hébreu est concis, et le dernier membre est difficile ; « défenses/remparts » traduit contextuellement le nom répété.'
    reason: alternative_reading
lexical_decisions:
- source_word: זִכְרֹנֵיכֶם
  choice: vos maximes
  rationale: Le nom renvoie normalement au souvenir ou au mémorial, mais, dans ce contexte sapiential, il désigne vraisemblablement les sentences mémorables et autorisées que les amis de Job invoquent. « Maximes » rend naturellement cette valeur sans transformer l’image qui suit.
- source_word: מִשְׁלֵי
  choice: des proverbes de
  rationale: מָשָׁל peut désigner un proverbe, une sentence ou une comparaison. Le syntagme nominal « proverbes de cendre » conserve la formulation poétique, concise et frappante de l’hébreu.
- source_word: אֵפֶר
  choice: cendre
  rationale: « Cendre » est le sens lexical ordinaire et évoque ici la vanité et la fragilité.
- source_word: לְגַבֵּי
  choice: 'ellipse de la copule : « vos défenses, des… »'
  rationale: La construction poétique est difficile et très condensée. En français, une apposition avec copule sous-entendue préserve mieux cette concision qu’une explicitation interprétative.
- source_word: חֹמֶר
  choice: argile
  rationale: Le terme désigne couramment l’argile, parfois le mortier ou la boue. « Argile » convient à l’image d’une protection terrestre et fragile.
- source_word: גַּבֵּיכֶם
  choice: vos défenses
  rationale: Bien que גַּב signifie littéralement « dos » ou une surface élevée, le contexte permet d’y voir métaphoriquement des ouvrages ou positions défensifs. « Défenses » exprime cette lecture contextuelle tout en évitant une formulation française obscure.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme nominal et la métaphore « proverbes de cendre / défenses d’argile » sont conservés. La ponctuation rend l’ellipse de la copule naturelle en français.
