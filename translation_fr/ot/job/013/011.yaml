base_translation:
  language: en
  yaml_path: translation/ot/job/013/011.yaml
  text: Will not his majesty terrify you[b][a], and his dread fall upon you?
translation:
  language: fr
  text: Sa majesté[a] ne vous terrifiera-t-elle pas, et sa terreur[b] ne tombera-t-elle pas sur vous ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son élévation » ou « sa dignité ». Le terme hébreu peut désigner l’élévation, la dignité ou un rang exalté.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « la crainte de lui ». Littéralement : « sa terreur ». L’expression peut désigner la terreur qu’il inspire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: ne… pas ?
  rationale: Rend la question rhétorique qui appelle une réponse affirmative, de manière naturelle en français.
- source_word: שְׂאֵתוֹ
  choice: sa majesté
  rationale: Le nom peut désigner l’élévation, la dignité ou la grandeur exaltée. « Sa majesté » convient au contexte de la grandeur divine qui inspire la terreur.
- source_word: תְּבַעֵת
  choice: terrifiera
  rationale: Le piel de בעת exprime le fait de causer une vive terreur ; « terrifier » en conserve l’intensité et le registre solennel.
- source_word: אֶתְכֶם
  choice: vous
  rationale: Correspond au pronom objet masculin pluriel de deuxième personne.
- source_word: וּפַחְדּוֹ
  choice: la frayeur qu’il inspire
  rationale: 'Explicite avec naturel le génitif objectif possible : la peur ou la frayeur provoquée par Dieu, tout en signalant en note la formulation possessive plus littérale.'
- source_word: יִפֹּל עֲלֵיכֶם
  choice: tombera-t-elle pas sur vous
  rationale: Conserve l’image hébraïque de quelque chose d’accablant qui tombe sur des personnes.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est conservé par deux questions rhétoriques. « Frayeur » évite la tournure peu naturelle « sa terreur » tout en maintenant la force du substantif hébreu.
