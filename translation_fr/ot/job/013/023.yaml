  text: כַּ/מָּ֣ה לִ֭/י עֲוֺנ֣וֹת וְ/חַטָּא֑וֹת פִּֽשְׁעִ֥/י וְ֝/חַטָּאתִ֗/י הֹדִיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/023.yaml
  text: How many are my iniquities and sins? Make my transgression and my sin known to me[a][b].
translation:
  language: fr
  text: Combien ai-je de fautes et de péchés[a] ? Fais-moi connaître ma transgression[b] et mon péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quelle est la gravité de mes fautes et de mes péchés ? » L’interrogatif hébreu peut porter sur l’étendue aussi bien que sur le nombre.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « transgression » peut aussi évoquer la « révolte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה לִי
  choice: Combien ai-je de
  rationale: Cette tournure rend naturellement en français l’expression hébraïque qui interroge sur le nombre ou l’étendue de ce qui appartient à Job, tout en conservant ici son sens quantitatif le plus direct.
- source_word: עֲוֺנוֹת
  choice: fautes
  rationale: « Fautes » exprime des torts moralement imputables dans un français actuel et accessible, tout en permettant de distinguer le terme des « péchés » qui suivent.
- source_word: וְחַטָּאוֹת
  choice: et de péchés
  rationale: « Péchés » est l’équivalent direct et usuel du pluriel חַטָּאוֹת et maintient la distinction avec עֲוֺנוֹת.
- source_word: פִּשְׁעִי
  choice: ma transgression
  rationale: « Transgression » conserve l’idée d’un franchissement coupable et laisse ouverte la nuance possible de révolte délibérée sans l’imposer dans le texte principal.
- source_word: וְחַטָּאתִי
  choice: et mon péché
  rationale: Le singulier « mon péché » reproduit simplement le nombre et le suffixe personnel de l’hébreu, ainsi que son parallèle avec « ma transgression ».
- source_word: הֹדִיעֵנִי
  choice: Fais-moi connaître
  rationale: 'Cette formulation restitue la valeur causative du hifil de ידע : Job demande que ses torts lui soient rendus connus.'
