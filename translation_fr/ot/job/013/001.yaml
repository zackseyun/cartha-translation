  text: Look[a], my eye has seen all this; my ear has heard and understood it.
translation:
  language: fr
  text: Oui, mon œil a vu tout cela ; mon oreille l’a entendu et compris.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « et discerné » ou « et examiné ». L’hébreu porte littéralement : « et elle a compris pour elle » ; cette tournure idiomatique, dont le référent précis est discuté, exprime que ce qui a été entendu a aussi été compris.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Oui
  rationale: Particule d’insistance qui attire l’attention et appuie l’affirmation. « Oui » est naturel en français moderne dans ce contexte, sans l’archaïsme de « Voici ».
- source_word: כֹּל
  choice: tout cela
  rationale: Le mot signifie littéralement « tout ». « Tout cela » explicite naturellement la référence récapitulative aux sujets déjà évoqués.
- source_word: רָאֲתָה עֵינִי
  choice: mon œil a vu
  rationale: Conserve le sujet singulier concret du texte hébreu et le parallélisme avec « mon oreille ».
- source_word: שָׁמְעָה אָזְנִי
  choice: mon oreille l’a entendu
  rationale: Conserve l’image et le parallélisme hébraïques. Le pronom « l’ » reprend « tout cela » dans une formulation française naturelle.
- source_word: וַתָּבֶן לָהּ
  choice: et compris
  rationale: Le verbe בין exprime l’intelligence ou le discernement. Le sujet féminin singulier renvoie naturellement à « mon oreille » ; le complément pronominal hébreu est idiomatique et indique ici l’assimilation de ce qui a été entendu.
