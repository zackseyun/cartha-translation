  yaml_path: translation/ot/job/013/010.yaml
  text: He will surely rebuke you if in secret you show partiality[a].
translation:
  language: fr
  text: Il ne manquera pas de vous reprendre si, en secret, vous faites preuve de partialité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « relever des visages », expression hébraïque qui signifie favoriser quelqu’un ou faire preuve de partialité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ יוֹכִיחַ
  choice: Il ne manquera pas de vous reprendre
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’affirmation. Cette tournure française exprime avec naturel la certitude de la réprimande, tandis que « reprendre » conserve la nuance de blâme et de mise en cause.
- source_word: אֶתְכֶם
  choice: vous
  rationale: Le pronom objet est masculin pluriel et désigne collectivement les amis de Job. En français, « vous » convient sans ajout explicatif.
- source_word: אִם
  choice: si
  rationale: La conjonction introduit ici une condition. « Si » préserve cette structure sans présenter leur conduite comme déjà certaine.
- source_word: בַּסֵּתֶר
  choice: en secret
  rationale: Le syntagme désigne une action cachée ou dissimulée. « En secret » en restitue directement la valeur adverbiale.
- source_word: פָּנִים תִּשָּׂאוּן
  choice: vous faites preuve de partialité
  rationale: L’expression hébraïque, littéralement « relever des visages », est un idiome désignant le favoritisme ou la partialité, notamment dans un cadre judiciaire. La formulation retenue est claire et naturelle en français moderne.
theological_decisions:
- issue: Sens de l’idiome נשׂא פנים
  choice: faire preuve de partialité
  alternative: favoriser quelqu’un ; avoir égard aux personnes
  rationale: L’idiome évoque un parti pris, ici dans la défense de Dieu par les amis de Job. « Partialité » conserve la portée éthique et quasi judiciaire du reproche sans préciser indûment la manière dont ce parti pris s’exerce.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « ne manquera pas de » rend l’intensification hébraïque avec naturel ; « reprendre » convient à une réprimande divine sans être inutilement archaïque.
