id: JOB.13.3
reference: Job 13:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אוּלָ֗ם אֲ֭נִי אֶל שַׁדַּ֣י אֲדַבֵּ֑ר וְ/הוֹכֵ֖חַ אֶל אֵ֣ל אֶחְפָּֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/003.yaml
  text: But I would speak to the Almighty[a], and I desire to argue with God.
translation:
  language: fr
  text: Mais moi, je veux parler au Tout-Puissant et je désire débattre[a] avec Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « raisonner avec Dieu » ou « présenter ma cause devant Dieu ». Le verbe hébreu peut évoquer le fait d’argumenter, de démontrer ou de défendre une cause.
    reason: alternative lexicale
lexical_decisions:
- source_word: אוּלָם
  choice: Mais
  rationale: Marque le contraste appuyé avec les paroles précédentes adressées aux amis de Job, dans un français actuel et naturel.
- source_word: אֲנִי
  choice: moi, je
  rationale: Rend l’insistance portée par le pronom hébreu explicitement exprimé.
- source_word: אֶל שַׁדַּי אֲדַבֵּר
  choice: je veux parler au Tout-Puissant
  rationale: L’imparfait hébreu exprime ici la volonté ou la résolution de Job plutôt qu’un simple futur. « Au Tout-Puissant » rend l’adresse directe et traduit le titre divin שַׁדַּי.
- source_word: וְהוֹכֵחַ
  choice: débattre
  rationale: Le hiphil de יכח peut désigner l’action d’argumenter, de contester ou de faire valoir une cause. « Débattre » conserve la confrontation verbale sans ajouter explicitement « ma cause », absent du texte.
- source_word: אֶל אֵל
  choice: avec Dieu
  rationale: Avec « débattre », « avec » est idiomatique en français et exprime la relation visée par la préposition; אֵל désigne ici Dieu.
- source_word: אֶחְפָּץ
  choice: je désire
  rationale: Exprime une volonté forte et délibérée, dans un registre digne conforme au contexte.
theological_decisions:
- issue: Traduction des désignations divines שַׁדַּי et אֵל
  choice: « le Tout-Puissant » et « Dieu »
  alternative: « Shaddaï » et « Dieu », ou « le Tout-Puissant » et « le Puissant »
  rationale: Le verset emploie deux désignations distinctes en parallèle. Les traduire ainsi préserve leur variation stylistique et leur sens usuel sans les harmoniser ni introduire une interprétation confessionnelle.
- issue: Portée judiciaire de יכח
  choice: « débattre avec Dieu » dans le texte, avec les autres possibilités en note
  alternative: « raisonner avec Dieu » ou « présenter ma cause devant Dieu »
  rationale: Le verbe admet une nuance argumentative ou judiciaire que le contexte ne permet pas de réduire à une seule formulation. Le texte reste naturel et la note préserve cette amplitude.
translation_notes:
  register: Français international moderne, digne et direct. « Moi, je » conserve l’emphase hébraïque; « débattre » reste accessible tout en maintenant la tension audacieuse des paroles de Job.
