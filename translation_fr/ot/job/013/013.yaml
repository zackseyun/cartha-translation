  yaml_path: translation/ot/job/013/013.yaml
  text: Be silent before me[a], and let me speak; then let come upon me what may.
translation:
  language: fr
  text: Taisez-vous devant moi[a], et laissez-moi parler ; puis, qu’il m’arrive ce qui arrivera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Gardez le silence devant moi, afin que je parle ; puis, que passe sur moi ce qui passera. »'
    reason: Alternative plus proche de l’image de « passer sur moi » et de la formulation hébraïque, sans attribuer à « loin de moi » une littéralité qu’il n’a pas.
lexical_decisions:
- source_word: הַחֲרִישׁוּ
  choice: Taisez-vous
  rationale: L’impératif hiphil pluriel de חרשׁ commande aux interlocuteurs de garder le silence. « Taisez-vous » est direct, naturel et conserve la force de l’ordre.
- source_word: מִמֶּנִּי
  choice: devant moi
  rationale: La préposition signifie littéralement « de moi », mais, avec le verbe « se taire », elle demande ici aux interlocuteurs de cesser de parler en présence de Job. « Devant moi » rend cette relation de façon idiomatique sans effacer la formulation littérale, signalée en note.
- source_word: וַאֲדַבְּרָה
  choice: et laissez-moi parler
  rationale: La forme cohortative exprime la volonté résolue de Job de prendre la parole. « Laissez-moi parler » en restitue naturellement la valeur volitive.
- source_word: אָנִי
  choice: moi
  rationale: Le pronom indépendant met Job en relief. Le pronom tonique « moi » dans « laissez-moi parler » transmet cette insistance de manière naturelle.
- source_word: וְיַעֲבֹר
  choice: puis, qu’il m’arrive
  rationale: עבר signifie fondamentalement « passer », mais avec עַל il peut évoquer ce qui vient ou tombe sur quelqu’un. La tournure « qu’il m’arrive » conserve la valeur jussive et exprime clairement l’acceptation des conséquences.
- source_word: עָלַי
  choice: m’
  rationale: Le complément « sur moi » est rendu idiomatiquement par le pronom indirect dans « qu’il m’arrive », tandis que la note conserve l’image plus littérale de ce qui « passe sur » Job.
- source_word: מָה
  choice: ce qui pourra
  rationale: 'מָה a ici une valeur indéfinie : « quoi que ce soit ». « Ce qui pourra » préserve cette indétermination ainsi que la résignation provocante de Job.'
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. L’impératif garde sa vigueur, et le second membre adopte une tournure légèrement soutenue afin de préserver la détermination et l’acceptation du risque exprimées par Job.
