  text: Listen carefully to my word[a], and let my declaration be in your ears.
translation:
  language: fr
  text: Écoutez attentivement ma parole, et prêtez l’oreille à ma déclaration[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon exposé » ou « mon explication » pour « ma déclaration ».
