lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Écoutez attentivement
  rationale: La combinaison du verbe à l’impératif et de l’infinitif absolu intensifie l’appel. « Écoutez attentivement » rend cette insistance dans un français naturel.
- source_word: מִלָּתִי
  choice: ma parole
  rationale: Le nom מִלָּה peut désigner une parole ou un discours. Le singulier « ma parole » conserve la forme hébraïque et le ton solennel de l’appel.
- source_word: וַאֲחֲוָתִי
  choice: ma déclaration
  rationale: Dans ce contexte, le terme désigne ce que Job expose ou déclare. « Ma déclaration » garde le caractère formel et délibéré de ses propos sans imposer le sens plus interprétatif d’« explication ».
- source_word: בְּאָזְנֵיכֶם
  choice: résonne à vos oreilles
  rationale: Littéralement « dans vos oreilles ». Cette formulation française conserve l’image concrète tout en exprimant naturellement la demande que les auditeurs prêtent attention.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. L’intensification hébraïque est rendue idiomatiquement, tandis que l’image concrète des oreilles est conservée sous une forme naturelle.
