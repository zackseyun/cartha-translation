  yaml_path: translation/ot/job/013/026.yaml
  text: For you write bitter things against me and make me inherit the iniquities of my youth[a][b].
translation:
  language: fr
  text: Car tu écris contre moi des choses amères[a] et tu me fais hériter des fautes de ma jeunesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu décrètes contre moi des choses amères » ; l’hébreu dit littéralement « tu écris contre moi des choses amères ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tu me fais porter la culpabilité des fautes de ma jeunesse » ou « le châtiment résultant des fautes de ma jeunesse ». Le mot hébreu peut désigner la faute, la culpabilité ou sa conséquence.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la plainte de Job et convient au mouvement argumentatif du passage.
- source_word: תִכְתֹּב עָלַי
  choice: tu écris contre moi
  rationale: Conserve l’image concrète du verbe « écrire » et la valeur adversative de la préposition, sans préciser indûment s’il s’agit d’accusations ou de décrets.
- source_word: מְרֹרוֹת
  choice: des choses amères
  rationale: Rend le pluriel substantivé de manière naturelle tout en laissant ouvertes les nuances de paroles, décisions, accusations ou épreuves amères.
- source_word: וְתוֹרִישֵׁנִי
  choice: et tu me fais hériter
  rationale: Préserve la valeur causative du hiphil de ירשׁ ainsi que la métaphore forte et inhabituelle de l’héritage.
- source_word: עֲוֺנוֹת
  choice: des fautes
  rationale: « Faute » est un terme français courant et digne qui peut désigner les actes répréhensibles sans réduire le mot hébreu à la seule culpabilité ou au seul châtiment; ces nuances sont signalées en note.
- source_word: נְעוּרָי
  choice: de ma jeunesse
  rationale: Rend directement la construction nominale avec suffixe de première personne.
theological_decisions:
- issue: Sens de עֲוֺנוֹת dans le contexte
  choice: les fautes commises durant la jeunesse, avec une possible implication de culpabilité ou de conséquences supportées
  alternative: la culpabilité ou le châtiment résultant des fautes de jeunesse
  rationale: Le terme hébreu peut désigner la faute, la culpabilité qu’elle entraîne ou sa conséquence punitive. Le texte principal conserve le sens moral large, tandis que la note maintient l’ambiguïté contextuelle.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve les métaphores hébraïques d’écriture et d’héritage, ainsi que l’ambiguïté théologique de עָוֹן.
