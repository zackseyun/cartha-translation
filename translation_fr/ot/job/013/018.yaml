id: JOB.13.18
reference: Job 13:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּה נָ֭א עָרַ֣כְתִּי מִשְׁפָּ֑ט יָ֝דַ֗עְתִּי כִּֽי אֲנִ֥י אֶצְדָּֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/018.yaml
  text: See now[a], I have prepared my case; I know that I will be vindicated.
translation:
  language: fr
  text: Voici, j’ai préparé ma cause ; je sais que j’aurai gain de cause.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je serai déclaré juste ». Le verbe hébreu appartient ici au langage judiciaire et signifie être reconnu dans son droit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Voici
  rationale: L’expression attire fortement l’attention sur ce que Job vient de faire. « Voici » rend de façon concise et digne la force déictique et emphatique des deux particules.
- source_word: עָרַכְתִּי
  choice: j’ai préparé
  rationale: Le verbe signifie mettre en ordre ou disposer. Dans ce contexte judiciaire, il s’agit pour Job d’avoir préparé son argumentation.
- source_word: מִשְׁפָּט
  choice: ma cause
  rationale: Dans l’imagerie judiciaire du passage, le nom désigne ici l’affaire ou la cause que Job entend présenter. Le possessif est fourni par le contexte et la première personne du verbe.
- source_word: יָדַעְתִּי כִּי
  choice: je sais que
  rationale: Le parfait exprime une conviction établie, et כִּי introduit le contenu de ce savoir.
- source_word: אֲנִי אֶצְדָּק
  choice: j’aurai gain de cause
  rationale: 'Le verbe צדק a ici un sens judiciaire : être reconnu dans son droit. Cette tournure française naturelle préserve la confiance de Job dans l’issue de sa cause sans importer une doctrine ultérieure de la justification.'
theological_decisions:
- issue: Portée judiciaire de l’affirmation de Job
  choice: j’aurai gain de cause
  alternative: je serai déclaré juste
  rationale: Job exprime sa certitude d’être reconnu dans son droit dans le différend judiciaire qu’il met en scène. Le choix principal conserve cette valeur médico-légale sans transformer le verset en formulation doctrinale ; la note signale l’autre traduction possible.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » conserve l’appel emphatique à l’attention ; « préparer ma cause » et « avoir gain de cause » maintiennent la cohérence de l’image judiciaire.
