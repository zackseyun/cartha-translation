  yaml_path: translation/ot/job/013/015.yaml
  text: Though he slay me[a], I will not hope; yet I will argue my ways before him.
translation:
  language: fr
  text: Même s’il me tue[a], je n’espérerai pas ; pourtant, je défendrai ma conduite devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traduction traditionnelle : « Même s’il me tue, j’espérerai en lui. » Elle repose sur une autre lecture de l’hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Même si
  rationale: Dans ce contexte, la particule introduit naturellement en français une concession forte.
- source_word: יִקְטְלֵנִי
  choice: il me tuait
  rationale: Le verbe signifie « tuer » ou « mettre à mort » ; l’imparfait après « même si » donne une tournure française naturelle tout en gardant la gravité de l’énoncé.
- source_word: לֹא אֲיַחֵל
  choice: je n’espérerais plus
  rationale: Le texte consonantique porte la négation לֹא, et יחל exprime ici l’attente confiante ou l’espérance. « Plus » explicite naturellement en français que la mort envisagée mettrait fin à cette attente, sans adopter la lecture traditionnelle לוֹ.
- source_word: אַךְ
  choice: pourtant
  rationale: La particule marque ici le contraste entre l’absence d’espérance annoncée et la résolution de Job à plaider sa cause.
- source_word: דְּרָכַי
  choice: ma conduite
  rationale: Littéralement « mes voies » ; dans ce contexte judiciaire, le terme désigne la manière de vivre de Job. « Ma conduite » restitue ce sens en français courant.
- source_word: אֶל־פָּנָיו
  choice: devant lui
  rationale: Littéralement « vers sa face » ; « devant lui » exprime idiomatiquement une confrontation directe en sa présence.
- source_word: אוֹכִיחַ
  choice: je défendrai
  rationale: Le hiphil de יכח peut désigner l’action d’exposer, de soutenir ou de plaider une cause. Avec « ma conduite », « je défendrai » rend clairement le cadre judiciaire.
theological_decisions:
- issue: Choix entre la négation du texte massorétique et la lecture traditionnelle positive
  choice: 'Suivre לֹא, « ne… pas » : « je n’espérerais plus »'
  alternative: « Même s’il me tuait, pourtant j’espérerais en lui »
  rationale: Le texte hébreu fourni lit לֹא (« ne… pas »), tandis que la traduction traditionnelle suppose לוֹ (« en lui / pour lui ») ou une lecture équivalente. Le texte principal suit donc la leçon massorétique donnée, et la variante importante est signalée en note.
translation_notes:
  register: Français moderne, digne et direct. La formulation conserve le contraste abrupt et la tonalité judiciaire du discours de Job, tout en évitant l’expression vieillie « mes voies ».
