  - severity: low
    issue: Concordance conditionnelle et formulation de la note traditionnelle
    rationale: Le futur (« s’il me tue, je n’espérerai pas ») reflète plus directement l’énoncé prospectif. Dans la note, « Même s’il me tue, j’espérerai en lui » donne la lecture traditionnelle sans un « pourtant » superflu.
