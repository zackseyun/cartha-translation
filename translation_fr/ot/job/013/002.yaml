  edition: WLC
  text: כְּֽ֭/דַעְתְּ/כֶם יָדַ֣עְתִּי גַם אָ֑נִי לֹא נֹפֵ֖ל אָנֹכִ֣י מִ/כֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/002.yaml
  text: What you know[a], I also know; I am not inferior to you.
translation:
  language: fr
  text: Ce que vous savez, moi aussi je le sais ; je ne vous suis pas inférieur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je ne tombe pas au-dessous de vous » ; autre traduction : « je ne vous cède en rien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַעְתְּכֶם
  choice: Ce que vous savez
  rationale: La préposition כְּ avec דַּעַת et le suffixe de 2e personne du pluriel introduit ici une comparaison entre le savoir des interlocuteurs et celui de Job. Cette formulation française est naturelle et s’accorde avec « moi aussi je le sais ».
- source_word: יָדַעְתִּי
  choice: je le sais
  rationale: 'Bien que la forme hébraïque soit un accompli à la 1re personne du singulier, le verbe décrit ici un état présent : Job possède lui aussi ce savoir. Le pronom « le » reprend naturellement « ce que vous savez ».'
- source_word: גַם אֲנִי
  choice: moi aussi
  rationale: La combinaison souligne que Job partage le même savoir. « Moi aussi » restitue clairement cette insistance en français moderne.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: je ne vous suis pas inférieur
  rationale: Le participe נֹפֵל avec מִן exprime une position moindre ou une insuffisance par comparaison. Dans ce contexte, Job nie être inférieur à ses interlocuteurs, notamment quant au savoir.
- source_word: אָנֹכִי
  choice: je
  rationale: Le pronom indépendant met le sujet en relief. En français, l’insistance est déjà portée par « moi aussi » dans la proposition précédente et reste perceptible dans la structure de la seconde.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe parallèle et l’affirmation ferme de Job sont conservées sans expliciter davantage le domaine de l’infériorité.
