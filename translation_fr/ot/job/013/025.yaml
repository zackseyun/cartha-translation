  text: הֶ/עָלֶ֣ה נִדָּ֣ף תַּעֲר֑וֹץ וְ/אֶת קַ֖שׁ יָבֵ֣שׁ תִּרְדֹּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/025.yaml
  text: Will you terrify a windblown leaf[b][a], and pursue dry chaff?
translation:
  language: fr
  text: Veux-tu terrifier une feuille emportée par le vent[a] et poursuivre de la paille sèche[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « une feuille chassée » ou « entraînée » ; le verbe évoque souvent l’action du vent, sans que celui-ci soit nommé explicitement.
    reason: source_clarity
  - marker: b
    text: Ou « du chaume sec » ; le terme hébreu désigne des restes végétaux desséchés.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָלֶה
  choice: une feuille
  rationale: Le nom עָלֶה désigne ici une feuille au singulier, image concrète de fragilité.
- source_word: נִדָּף
  choice: emportée par le vent
  rationale: Le participe de נדף évoque ce qui est poussé ou dispersé, implicitement par le vent. Cette formulation restitue naturellement l’image en français.
- source_word: תַּעֲרוֹץ
  choice: terrifier
  rationale: Le verbe ערץ exprime l’effroi ou la terreur causée. « Terrifier » en conserve la force dans cette question rhétorique.
- source_word: קַשׁ
  choice: paille
  rationale: קַשׁ peut désigner de la paille, du chaume ou des débris végétaux secs. « Paille » est naturel en français et maintient l’image de faiblesse.
- source_word: יָבֵשׁ
  choice: sèche
  rationale: L’adjectif signifie directement « sec » et accentue la fragilité de la paille.
- source_word: תִּרְדֹּף
  choice: poursuivre
  rationale: רדף signifie couramment « poursuivre » ou « pourchasser » ; « poursuivre » convient au registre poétique et au parallélisme.
theological_decisions: []
translation_notes:
  register: Question rhétorique rendue dans un français moderne, sobre et poétique. Le parallélisme des deux images de fragilité est conservé, ainsi que la vigueur des verbes appliqués à ces objets insignifiants.
