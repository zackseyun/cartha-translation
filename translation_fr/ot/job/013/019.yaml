  yaml_path: translation/ot/job/013/019.yaml
  text: Who is it that will contend with me? For then I would be silent and die[a].
translation:
  language: fr
  text: Qui donc pourrait engager un procès contre moi ? Car alors je me tairais et je mourrais[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car maintenant, je me tairais et je mourrais. » L’adverbe hébreu signifie le plus souvent « maintenant », mais beaucoup le comprennent ici au sens d’« alors », dans le fil de l’argumentation de Job.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הוּא
  choice: Qui donc
  rationale: L’interrogatif accompagné du pronom indépendant est emphatique. « Qui donc » en restitue naturellement la force rhétorique en français moderne.
- source_word: יָרִיב
  choice: pourrait engager un procès
  rationale: Le verbe ריב possède ici une nette nuance judiciaire. Cette formulation conserve l’image d’une contestation en justice tout en s’intégrant à la portée conditionnelle du défi lancé par Job.
- source_word: עִמָּדִי
  choice: contre moi
  rationale: Avec ריב, la préposition désigne la partie adverse. En français, « contre moi » exprime plus naturellement cette relation judiciaire que le calque « avec moi ».
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la conséquence explicative qui fonde le défi de Job.
- source_word: עַתָּה
  choice: alors
  rationale: 'Bien que עַתָּה signifie normalement « maintenant », le contexte permet de l’entendre comme la conséquence implicite du défi : si quelqu’un pouvait soutenir l’accusation, alors Job se tairait et mourrait. L’alternative lexicale est signalée en note.'
- source_word: אַחֲרִישׁ
  choice: je me tairais
  rationale: Le verbe exprime le fait de garder le silence. Le conditionnel français rend naturellement la conséquence implicite dans l’argumentation.
- source_word: וְאֶגְוָע
  choice: et je mourrais
  rationale: גוע désigne le fait d’expirer ou de mourir. « Mourir » garde ici la force sobre et directe de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. « Engager un procès » explicite sans excès la nuance judiciaire de ריב ; « Qui donc » préserve l’emphase rhétorique. Le conditionnel rend la conséquence implicite du défi.
