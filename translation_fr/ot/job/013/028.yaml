id: JOB.13.28
reference: Job 13:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֭/הוּא כְּ/רָקָ֣ב יִבְלֶ֑ה כְּ֝/בֶ֗גֶד אֲכָ֣ל/וֹ עָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/028.yaml
  text: while he wastes away like something rotten[a], like a garment eaten by moths.
translation:
  language: fr
  text: Et lui, il dépérit comme une chose pourrie[a], comme un vêtement dévoré par les mites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il se consume comme la pourriture ».'
    reason: Alternative lexicale plus formelle pour כְּרָקָב יִבְלֶה, qui conserve le nom abstrait « pourriture ».
lexical_decisions:
- source_word: וְהוּא
  choice: Et lui, il
  rationale: La conjonction et le pronom indépendant reprennent avec insistance le sujet souffrant. « Et lui, il » conserve cette reprise, ainsi que le passage remarquable à la troisième personne, sans imposer une relation temporelle absente de l’hébreu.
- source_word: כְּרָקָב
  choice: comme une chose pourrie
  rationale: רָקָב désigne la pourriture ou ce qui est atteint de pourriture. Cette formulation concrète donne en français une comparaison naturelle tout en gardant l’image de décomposition.
- source_word: יִבְלֶה
  choice: dépérit
  rationale: בלה exprime l’usure et la détérioration progressive. Dans ce contexte appliqué au souffrant, « dépérit » rend ce processus avec naturel, sans le réduire à la seule usure matérielle.
- source_word: כְּבֶגֶד
  choice: comme un vêtement
  rationale: בֶּגֶד est le terme général pour un vêtement; le singulier et le registre poétique sont ainsi préservés.
- source_word: אֲכָלוֹ
  choice: dévoré par
  rationale: Le verbe אכל signifie littéralement « manger »; avec le vêtement comme objet et la mite comme agent, « dévoré par » est l’expression française idiomatique qui en conserve la force.
- source_word: עָשׁ
  choice: les mites
  rationale: Le nom hébreu est au singulier mais peut désigner l’agent selon sa catégorie. Le pluriel générique « les mites » est naturel en français dans cette image traditionnelle.
theological_decisions:
- issue: Référent du pronom הוּא (« lui »)
  choice: 'Maintenir la troisième personne : « Et lui, il »'
  alternative: 'Employer la première personne : « Et moi, je »'
  rationale: Le texte massorétique porte explicitement un pronom de troisième personne, même si Job parle de lui-même dans le contexte. La traduction conserve cette tension grammaticale et rhétorique au lieu de la résoudre par une correction implicite.
translation_notes:
  register: Français international moderne, poétique et digne. La reprise disloquée « Et lui, il » reste courante et intelligible tout en marquant l’insistance de l’hébreu. « Dépérit » convient à la détérioration d’une personne, tandis que l’image parallèle du vêtement maintient l’idée d’usure.
