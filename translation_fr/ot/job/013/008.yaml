  text: הֲ/פָנָ֥י/ו תִּשָּׂא֑וּ/ן אִם לָ/אֵ֥ל תְּרִיבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/008.yaml
  text: Will you show partiality for him? Will you contend for God?[a][b]
translation:
  language: fr
  text: Prendrez-vous son parti ? Plaiderez-vous en faveur de Dieu ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Relèverez-vous son visage ? » Expression hébraïque signifiant favoriser quelqu’un ou faire preuve de partialité envers lui.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Défendrez-vous la cause de Dieu ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲפָנָיו תִּשָּׂאוּן
  choice: Prendrez-vous son parti ?
  rationale: L’expression hébraïque signifie littéralement « relever son visage », mais elle désigne ici le fait de favoriser quelqu’un ou de faire preuve de partialité. « Prendre son parti » est naturel en français et convient au contexte de controverse, tout en gardant le pronom masculin renvoyant à Dieu.
- source_word: אִם
  choice: '?'
  rationale: אִם introduit ici une seconde question rhétorique parallèle. En français, deux questions successives rendent plus naturellement cette fonction qu’un « si » littéral; « ou » reste possible.
- source_word: לָאֵל
  choice: en faveur de Dieu
  rationale: La préposition ל indique ici l’intérêt ou le bénéfice de quelqu’un. « En faveur de Dieu » exprime clairement cette relation sans suggérer un dieu indéfini.
- source_word: תְּרִיבוּן
  choice: Plaiderez-vous
  rationale: Le verbe ריב appartient au champ de la contestation et du litige. « Plaider » restitue bien la nuance judiciaire dans ce contexte, sans imposer l’idée plus générale d’une simple dispute.
theological_decisions:
- issue: Job accuse-t-il ses amis de défendre Dieu avec partialité ?
  choice: 'Les deux questions sont rendues comme un reproche : les amis prennent le parti de Dieu et plaident en sa faveur.'
  alternative: « Ferez-vous preuve de partialité envers lui ? Défendrez-vous la cause de Dieu ? »
  rationale: 'Le contexte présente les amis comme des défenseurs partiaux de Dieu. La traduction conserve la tension du texte : Job ne nie pas que Dieu soit juste, mais dénonce une défense de Dieu qui ne respecte pas la vérité.'
translation_notes:
  register: Français moderne, direct et digne. « Prendre son parti » est idiomatique et accessible; « plaider en faveur de » maintient la tonalité judiciaire du parallélisme.
