  text: שִׁמְעוּ נָ֥א תוֹכַחְתִּ֑/י וְ/רִב֖וֹת שְׂפָתַ֣/י הַקְשִֽׁיבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/006.yaml
  text: Please hear my argument[b][a], and listen to the pleadings of my lips.
translation:
  language: fr
  text: 'Écoutez, je vous prie, mon argument[a],

    et soyez attentifs aux plaidoyers de mes lèvres[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma réprimande » ou « ma défense » ; le terme hébreu peut désigner une correction, une réfutation ou une argumentation raisonnée.
    reason: lexical_alternative
  - marker: b
    text: Ou « aux contestations de mes lèvres » ; l’expression hébraïque évoque un débat, un différend ou une plaidoirie.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: Écoutez, je vous prie
  rationale: L’impératif pluriel appelle les interlocuteurs de Job à écouter, tandis que נָא en adoucit la force par une demande instante. « Je vous prie » convient au registre digne et reste naturel en français.
- source_word: תוֹכַחְתִּי
  choice: mon argument
  rationale: תּוֹכַחַת peut désigner une réprimande, une réfutation ou une argumentation. Dans le contexte judiciaire du discours de Job, « mon argument » exprime son raisonnement sans réduire le terme à une correction morale.
- source_word: וְרִבוֹת
  choice: et aux plaidoyers
  rationale: Le terme רִיבוֹת évoque les contestations, les débats ou les plaidoyers. « Plaidoyers » met en valeur la tonalité judiciaire du passage tout en laissant une note indiquant les autres nuances possibles.
- source_word: שְׂפָתַי
  choice: de mes lèvres
  rationale: La traduction conserve l’image hébraïque concrète des lèvres plutôt que de la remplacer par « mes paroles ».
- source_word: הַקְשִׁיבוּ
  choice: soyez attentifs à
  rationale: L’impératif de קשׁב demande une écoute soutenue. « Soyez attentifs à » le distingue légèrement du premier « écoutez » et restitue la progression du parallélisme.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme est conservé par deux appels complémentaires à l’écoute, et l’image « de mes lèvres » est maintenue. Les nuances judiciaires et correctives des deux substantifs sont signalées sans imposer une interprétation unique.
