  text: Seulement, ne me fais pas subir ces deux choses ; alors je ne me cacherai pas devant toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Seulement
  rationale: Le terme introduit ici une restriction à la demande de Job ; « Seulement » en rend clairement la force restrictive.
- source_word: שְׁתַּיִם
  choice: ces deux choses
  rationale: L’hébreu emploie le numéral féminin « deux » sans nom exprimé. Le français doit suppléer « choses » ; « ces » annonce naturellement les deux demandes précisées aux versets suivants.
- source_word: אַל תַּעַשׂ עִמָּדִי
  choice: ne me fais pas ces deux choses
  rationale: La construction de עשה avec עִם peut signifier « faire ou agir à l’égard de quelqu’un ». Cette formulation reste proche de l’hébreu tout en étant compréhensible en français.
- source_word: אָז
  choice: alors
  rationale: Le mot marque la conséquence de l’acceptation de la requête de Job.
- source_word: מִפָּנֶיךָ
  choice: loin de ta face
  rationale: Cette traduction conserve l’image concrète de la face tout en rendant la préposition indiquant l’éloignement ; « présence » demeure une possibilité idiomatique.
- source_word: לֹא אֶסָּתֵר
  choice: je ne me cacherai pas
  rationale: 'Le niphal de סתר se comprend ici de manière réfléchie ou intransitive : Job affirme qu’il ne se dérobera pas devant Dieu.'
