- from: Est-ce pour Dieu que vous direz ce qui est injuste[a], et pour lui ce qui est trompeur ?
  to: Tiendrez-vous des propos injustes pour Dieu[a], et des propos trompeurs pour lui ?
  rationale: La révision remplace une construction clivée et une ellipse peu naturelles par une interrogation directe, sans modifier le sens ni ajouter une interprétation doctrinale. Elle conserve la distinction entre l’injustice et la tromperie, le parallélisme « pour Dieu / pour lui », ainsi que l’ambiguïté réelle de la préposition en note.
