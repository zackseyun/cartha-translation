  text: הַ֭/לְ/אֵל תְּדַבְּר֣וּ עַוְלָ֑ה וְ֝/ל֗/וֹ תְּֽדַבְּר֥וּ רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/007.yaml
  text: Will you speak injustice for God[a], and deceit for him?
translation:
  language: fr
  text: Tiendrez-vous des propos injustes pour Dieu[a], et des propos trompeurs pour lui ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Dieu » dans le premier membre, et de même « à lui » dans le second. La préposition hébraïque peut aussi se comprendre au sens de « au nom de Dieu » / « en son nom ». Le contexte favorise l’idée de parler pour défendre Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלְאֵל
  choice: pour Dieu
  rationale: La préposition ל peut exprimer le bénéficiaire, la référence ou la représentation. Dans ce contexte, Job reproche à ses amis de parler en faveur de Dieu; « pour Dieu » conserve à la fois cette portée et la concision de l’hébreu.
- source_word: תְּדַבְּרוּ
  choice: direz
  rationale: L’imparfait dans cette question de reproche se rend naturellement par le futur français, qui maintient la force du défi moral.
- source_word: עַוְלָה
  choice: ce qui est injuste
  rationale: Le nom désigne l’injustice ou ce qui est moralement faux. Cette formulation française garde sa portée éthique et judiciaire sans le confondre avec le terme suivant.
- source_word: וְלוֹ
  choice: pour lui
  rationale: Le pronom renvoie à Dieu, et la préposition reprend le même rapport que dans le premier membre. « Pour lui » préserve le parallélisme et la brièveté.
- source_word: רְמִיָּה
  choice: ce qui est trompeur
  rationale: Le nom exprime la tromperie ou la duplicité. Cette tournure s’accorde naturellement avec « dire » sous-entendu et reste parallèle à « ce qui est injuste ».
theological_decisions:
- issue: Les amis parlent-ils en faveur de Dieu ou s’adressent-ils à Dieu ?
  choice: Job leur reproche de tenir des propos injustes pour défendre Dieu.
  alternative: Job leur reproche d’adresser à Dieu des propos injustes.
  rationale: Le contexte immédiat, notamment Job 13.8, présente les amis comme prenant le parti de Dieu. La traduction « pour Dieu » suit ce sens contextuel tout en signalant en note l’ambiguïté réelle de la préposition.
translation_notes:
  register: Français moderne, international et digne. La question rhétorique conserve sa force accusatrice. L’ellipse du verbe dans le second membre rend le parallélisme sans lourdeur, tandis que « ce qui est injuste / ce qui est trompeur » reste naturel et précis.
