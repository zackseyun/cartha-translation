source:
  edition: WLC
  text: וּ֭/קְרָא וְ/אָנֹכִ֣י אֶֽעֱנֶ֑ה אֽוֹ אֲ֝דַבֵּ֗ר וַ/הֲשִׁיבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/022.yaml
  text: Then call[a], and I will answer; or let me speak, and you reply to me.
translation:
  language: fr
  text: Alors appelle, et moi, je répondrai ; ou bien je parlerai, et toi, réponds-moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּקְרָא
  choice: Alors appelle
  rationale: L’impératif qal masculin singulier de קרא ouvre la première des deux possibilités proposées. « Alors » rend naturellement en français l’enchaînement implicite porté par la conjonction.
- source_word: וְאָנֹכִי
  choice: et moi, je
  rationale: Le pronom indépendant אָנֹכִי met le sujet en relief. La tournure disloquée « moi, je » restitue cette insistance dans un français naturel.
- source_word: אֶעֱנֶה
  choice: répondrai
  rationale: 'L’imparfait qal à la première personne exprime ici la réponse à venir dans l’échange proposé : si Dieu appelle, Job répondra.'
- source_word: אוֹ
  choice: ou bien
  rationale: La particule disjonctive introduit clairement la seconde possibilité. « Ou bien » souligne sans l’alourdir la structure alternative.
- source_word: אֲדַבֵּר
  choice: je parlerai
  rationale: 'L’imparfait piel à la première personne peut se lire comme la proposition parallèle à « appelle » : dans l’autre configuration, Job prendra la parole. Le futur français conserve la forme déclarative et l’ambiguïté modale de l’hébreu.'
- source_word: וַהֲשִׁיבֵנִי
  choice: et toi, réponds-moi
  rationale: L’impératif hiphil masculin singulier avec suffixe de première personne demande une réponse adressée à Job. « Toi » explicite l’opposition réciproque déjà marquée par אָנֹכִי, sans modifier le sens.
theological_decisions:
- issue: Identité de l’interlocuteur
  choice: Ne pas nommer Dieu dans le verset
  alternative: Ajouter « Dieu » ou « Seigneur »
  rationale: Le contexte montre que Job s’adresse à Dieu, mais le texte hébreu de ce verset ne le nomme pas. La traduction préserve cette formulation directe.
translation_notes:
  register: Français moderne, digne et direct. Le parallélisme de l’échange est mis en relief par « moi, je » et « toi », tandis que la ponctuation conserve les deux options du défi formulé par Job.
