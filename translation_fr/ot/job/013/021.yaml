  source_fidelity: 'Le texte rend fidèlement les deux demandes de Job : l’impératif hiphil הַרְחַק (« éloigne/retire ») appliqué à « ta main », avec מֵעָלַי (« de dessus moi »), puis la défense אַל avec le verbe « épouvanter ». « Éloigne de moi ta main » est une formulation française idiomatique qui conserve l’image sans surcharger le verset.'
