source:
  edition: WLC
  text: כַּ֭פְּ/ךָ מֵ/עָלַ֣/י הַרְחַ֑ק וְ֝/אֵ֥מָתְ/ךָ֗ אַֽל תְּבַעֲתַֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/021.yaml
  text: Withdraw your hand far from me[b][a], and do not let your dread terrify me.
translation:
  language: fr
  text: Éloigne de moi ta main[a], et que ta terreur[b] ne m’épouvante pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Éloigne ta main de dessus moi. »'
    reason: Précision sur l’image spatiale exprimée par מֵעָלַי.
  - marker: b
    text: 'Ou : « l’effroi que tu inspires » ; autre traduction possible : « ton épouvante ».'
    reason: Alternative lexicale rendant la nuance de אֵמָה avec le suffixe possessif.
lexical_decisions:
- source_word: כַּפְּךָ
  choice: ta main
  rationale: כַּף désigne littéralement la paume ou la main. « Main » conserve ici l’image biblique concrète de l’action ou de la pression exercée par Dieu, sans en préciser abusivement la nature.
- source_word: מֵעָלַי הַרְחַק
  choice: Éloigne de moi
  rationale: Le hiphil impératif de רחק signifie « mettre à distance, éloigner », tandis que מֵעָלַי évoque ce qui se trouve sur Job. La formulation française naturelle « Éloigne de moi ta main » garde l’ordre direct sans alourdir le vers.
- source_word: אֵמָתְךָ
  choice: ta terreur
  rationale: אֵימָה exprime la terreur ou l’effroi. « Ta terreur » respecte le suffixe de deuxième personne et préserve l’ambiguïté entre la terreur associée à Dieu et celle qu’il inspire.
- source_word: אַל תְּבַעֲתַנִּי
  choice: que … ne m’épouvante pas
  rationale: אַל marque ici la défense ou le souhait négatif, et בעת signifie terrifier, épouvanter ou jeter dans l’effroi. Cette tournure rend naturellement l’accord du verbe avec אֵמָתְךָ.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu (« ta main »)
  choice: Conserver littéralement « ta main ».
  alternative: ta puissance ; le coup que tu portes
  rationale: Le texte hébreu emploie une image corporelle concrète. La maintenir préserve la force poétique et laisse ouverte la question de savoir si la main représente la puissance, l’affliction ou une autre forme d’action divine.
- issue: Sens de « ta terreur »
  choice: Conserver « ta terreur » sans expliciter davantage.
  alternative: l’effroi que tu inspires ; la peur de toi
  rationale: Le possessif hébreu permet plusieurs nuances. La traduction retenue ne réduit pas l’expression à la seule peur subjective de Job et ne détermine pas excessivement le mode d’action divine.
translation_notes:
  register: Français international moderne, sobre et poétique. Le tutoiement convient à l’adresse directe de Job à Dieu. « Épouvante » est soutenu mais courant dans un registre biblique digne, et fait écho sans lourdeur à « terreur ».
