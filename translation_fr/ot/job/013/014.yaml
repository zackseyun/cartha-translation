  text: עַל מָ֤ה אֶשָּׂ֣א בְשָׂרִ֣/י בְ/שִׁנָּ֑/י וְ֝/נַפְשִׁ֗/י אָשִׂ֥ים בְּ/כַפִּֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/014.yaml
  text: Why should I take my flesh in my teeth and put my life in my hand?[a][b]
translation:
  language: fr
  text: Pourquoi prendrais-je ma chair entre mes dents[a] et mettrais-je ma vie dans ma main[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « dans mes dents » ; on peut aussi comprendre « avec mes dents ». L’expression hébraïque est difficile et semble évoquer le fait de s’exposer soi-même au danger.
    reason: lexical_alternative
  - marker: b
    text: Ou « mon âme » ou « ma personne ». Le mot hébreu peut désigner la vie, l’âme ou l’être lui-même ; ici, « ma vie » convient au contexte d’une mise en danger.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: Pourquoi… ?
  rationale: Cette expression introduit ici une question rhétorique portant sur le motif ou le but. « Pourquoi » est naturel en français et conserve pleinement sa force interrogative.
- source_word: אֶשָּׂא
  choice: prendrais-je
  rationale: Le verbe נשׂא peut signifier « soulever », « porter » ou « prendre ». Dans cette image difficile, « prendre » s’accorde naturellement avec « entre mes dents » sans effacer la métaphore.
- source_word: בְשָׂרִי
  choice: ma chair
  rationale: Le sens concret de בשר est « chair ». Ce choix préserve l’image vive et étrange de l’hébreu, alors que « mon corps » l’atténuerait.
- source_word: בְשִׁנָּי
  choice: entre mes dents
  rationale: La préposition ב peut être rendue littéralement par « dans », mais le français dit naturellement « entre les dents ». La formulation conserve l’image corporelle sans prétendre élucider entièrement l’expression.
- source_word: וְנַפְשִׁי
  choice: ma vie
  rationale: נפש peut désigner la vie, l’âme ou la personne elle-même. Dans le contexte d’une vie exposée au danger, « ma vie » communique le sens le plus probable tout en signalant l’autre possibilité en note.
- source_word: אָשִׂים
  choice: mettrais-je
  rationale: שׂים signifie couramment « mettre », « placer » ou « poser ». « Mettre » rend directement le verbe et convient à l’image française.
- source_word: בְכַפִּי
  choice: dans ma main
  rationale: כף désigne la paume ou, par extension, la main. « Dans ma main » préserve la métaphore hébraïque et reste plus naturel que « dans ma paume ».
theological_decisions:
- issue: Portée de נֶפֶשׁ dans l’expression de la mise en danger
  choice: ma vie
  alternative: mon âme / ma personne
  rationale: Le parallèle avec l’exposition volontaire au danger favorise le sens concret de « vie ». La note conserve l’étendue sémantique du terme sans introduire une conception particulière de l’âme.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe interrogative demeure naturelle, tandis que les deux images corporelles de l’hébreu sont conservées malgré leur étrangeté. Les notes rendent compte de l’obscurité du premier idiome et de la polysémie de נֶפֶשׁ.
