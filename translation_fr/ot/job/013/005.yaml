  text: מִֽי יִ֭תֵּן הַחֲרֵ֣שׁ תַּחֲרִישׁ֑וּ/ן וּ/תְהִ֖י לָ/כֶ֣ם לְ/חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/005.yaml
  text: If only you would keep completely silent[a], and it would count as wisdom for you.
translation:
  language: fr
  text: Si seulement vous vous taisiez complètement ! Ce serait sage de votre part.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Si seulement
  rationale: Cette tournure idiomatique exprime un souhait intense, et non une question littérale. « Si seulement » en restitue naturellement la valeur optative en français moderne.
- source_word: הַחֲרֵשׁ תַּחֲרִישׁוּן
  choice: vous gardiez un silence total
  rationale: L’infinitif absolu suivi du verbe conjugué de même racine renforce l’idée de se taire. « Un silence total » rend cette insistance dans une formulation française naturelle.
- source_word: וּתְהִי
  choice: Ce serait
  rationale: Le verbe féminin singulier renvoie vraisemblablement au silence ou à la situation qui vient d’être évoquée. Le démonstratif « ce » préserve cette référence sans la préciser davantage.
- source_word: לָכֶם
  choice: pour vous
  rationale: La préposition ל indique ici la relation ou l’avantage ; « pour vous » en est l’équivalent français direct et naturel.
- source_word: לְחָכְמָה
  choice: de la sagesse
  rationale: Le nom חָכְמָה signifie « sagesse ». La formulation « ce serait, pour vous, de la sagesse » reste proche de l’hébreu tout en étant compréhensible en français.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. L’exclamation rend la force du souhait initial ; la seconde phrase conserve la sobriété et la légère tension de la formulation hébraïque.
