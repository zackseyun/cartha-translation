  yaml_path: translation/ot/job/008/010.yaml
  text: Will they not teach you and tell you[a], and bring forth words from their heart?
translation:
  language: fr
  text: Ne vont-ils pas t’instruire et te parler, et faire sortir de leur cœur des paroles[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de leur cœur ». En hébreu, le « cœur » peut désigner le siège de la pensée aussi bien que celui des sentiments.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Ne vont-ils pas
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative, tout en conservant naturellement sa forme interrogative en français.
- source_word: הֵם
  choice: ils
  rationale: Renvoie aux générations passées évoquées dans le contexte précédent ; le pronom simple est naturel en français.
- source_word: יוֹרוּךָ
  choice: t’instruire
  rationale: Le hiphil de ירה signifie couramment « enseigner, instruire » ; « instruire » convient au contexte sapientiel.
- source_word: יֹאמְרוּ לָךְ
  choice: te parler
  rationale: Rend distinctement le verbe אמר et forme avec « t’instruire » une coordination française fluide.
- source_word: וּמִלִּבָּם
  choice: de leur cœur
  rationale: Préserve l’image anthropologique hébraïque du cœur comme siège de la pensée, de la réflexion et des sentiments.
- source_word: יוֹצִיאוּ
  choice: tirer
  rationale: Exprime le mouvement de paroles que l’on fait sortir de l’intérieur, sans la coloration archaïque de « faire sortir » ou « produire ».
- source_word: מִלִּים
  choice: des paroles
  rationale: « Paroles » convient mieux que « mots » à des propos de sagesse exprimés oralement.
