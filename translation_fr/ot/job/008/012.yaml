base_translation:
  language: en
  yaml_path: translation/ot/job/008/012.yaml
  text: While it is still in its shoot[a], not cut down[b], it dries up before any other grass.
translation:
  language: fr
  text: Alors qu’il est encore dans sa verdure[a], sans qu’on l’ait coupé[b], il se dessèche avant toute autre herbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « alors qu’il est encore en pousse », « dans sa fraîcheur » ou « dans son bourgeon ». Le terme hébreu désigne la croissance fraîche d’une plante.
    reason: lexical_alternative
  - marker: b
    text: Ou « cueilli ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹדֶנּוּ
  choice: Alors qu’il est encore
  rationale: L’adverbe muni du suffixe masculin singulier exprime la continuité de l’état de la plante et introduit naturellement en français une proposition temporelle.
- source_word: בְאִבּוֹ
  choice: dans sa fraîcheur
  rationale: Le nom désigne la croissance fraîche et verte d’une plante. « Dans sa fraîcheur » conserve cette idée sans imposer une identification trop précise entre pousse et bouton.
- source_word: לֹא יִקָּטֵף
  choice: sans avoir été coupé
  rationale: La forme passive de קטף peut évoquer une plante coupée ou cueillie. Cette formulation française rend clairement le fait que son dessèchement ne résulte pas d’une intervention humaine.
- source_word: וְלִפְנֵי
  choice: avant
  rationale: Dans ce contexte, la préposition établit une comparaison temporelle. Le français n’a pas besoin de rendre séparément la conjonction initiale.
- source_word: כָל חָצִיר
  choice: toute autre herbe
  rationale: L’ajout de « autre » explicite en français la comparaison entre la plante évoquée et les herbes ordinaires, sans modifier le sens contextuel.
- source_word: יִיבָשׁ
  choice: il se dessèche
  rationale: Le verbe יבש indique que la plante devient sèche ou dépérit. « Se dessèche » convient particulièrement à l’image d’une plante dépendante de l’eau.
