id: JOB.8.5
reference: Job 8:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם אַ֭תָּה תְּשַׁחֵ֣ר אֶל אֵ֑ל וְ/אֶל שַׁ֝דַּ֗י תִּתְחַנָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/005.yaml
  text: But if you seek God earnestly[a], and plead for favor from the Almighty[b],
translation:
  language: fr
  text: Mais si tu recherches Dieu avec ardeur[a] et que tu implores la faveur du Tout-Puissant[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu recherches Dieu dès le matin » ; le verbe hébreu peut évoquer une recherche matinale, mais il exprime probablement ici une recherche empressée ou assidue.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « Shaddaï », traditionnellement traduit par « le Tout-Puissant ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Mais si
  rationale: La particule introduit une condition; « mais » rend le contraste discursif avec le verset précédent, tandis que « si » conserve pleinement la valeur conditionnelle.
- source_word: אַתָּה
  choice: tu
  rationale: Le pronom masculin singulier est explicite en hébreu. Le français le rend naturellement par « tu », conformément à l’adresse personnelle du discours.
- source_word: תְּשַׁחֵר
  choice: recherches ... avec ardeur
  rationale: Le piel de שׁחר peut évoquer une recherche matinale, diligente ou empressée. Dans ce contexte d’appel à Dieu, « rechercher avec ardeur » exprime l’empressement sans imposer une référence à l’heure du jour.
- source_word: אֶל אֵל
  choice: Dieu
  rationale: La préposition indique la direction vers Dieu, mais elle s’intègre idiomatiquement au verbe français « rechercher ». אֵל est rendu naturellement par « Dieu ».
- source_word: וְ/אֶל
  choice: et ... du
  rationale: La conjonction coordonne les deux propositions. Avec le verbe de supplication, la direction vers שׁדי se rend naturellement en français par « implorer la faveur du ».
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Ce titre divin est traditionnellement et clairement rendu en français par « le Tout-Puissant »; la translittération « Shaddaï » est signalée en note.
- source_word: תִּתְחַנָּן
  choice: implores la faveur
  rationale: Le hitpael de חנן désigne l’action de supplier pour obtenir grâce ou faveur. Cette formulation conserve la nuance relationnelle tout en restant actuelle et accessible.
theological_decisions:
- issue: Rendu du titre divin שַׁדַּי
  choice: le Tout-Puissant
  alternative: Shaddaï
  rationale: Traduire le titre en communique la portée au lecteur français, sans imposer une interprétation doctrinale particulière; la forme hébraïque est conservée en note.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement reflète le singulier de l’adresse hébraïque. La virgule finale est conservée parce que le verset constitue la protase d’une condition poursuivie au verset suivant.
