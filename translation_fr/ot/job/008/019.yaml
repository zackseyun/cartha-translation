  text: הֶן ה֭וּא מְשׂ֣וֹשׂ דַּרְכּ֑/וֹ וּ֝/מֵ/עָפָ֗ר אַחֵ֥ר יִצְמָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/019.yaml
  text: Behold[a], this is the joy of his way[b], and out of the dust others will sprout.
translation:
  language: fr
  text: 'Voilà[a], c’est la joie de son chemin,

    et d’autres germeront de la poussière.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le voilà, lui, la joie de son chemin ». Le pronom hébreu peut être compris de manière plus personnelle, mais il peut aussi désigner la situation qui vient d’être décrite.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu porte « un autre » au singulier, tandis que le verbe est au pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Voici
  rationale: Particule emphatique qui attire l’attention. « Voici » conserve sa vivacité poétique dans un français digne et naturel.
- source_word: הוּא
  choice: voici la joie
  rationale: Le pronom masculin peut renvoyer à l’être évoqué ou, de façon déictique, résumer son sort. La formulation française laisse l’énoncé nominal relativement ouvert sans imposer « il ».
- source_word: מְשׂוֹשׂ
  choice: la joie
  rationale: Le nom désigne la joie ou l’allégresse. « La joie » rend sobrement le substantif tout en conservant l’éventuelle ironie du contexte.
- source_word: דַּרְכּוֹ
  choice: de son parcours
  rationale: דֶּרֶךְ peut désigner un chemin, une voie ou le cours d’une existence. « Parcours » convient à la métaphore végétale et au résumé de son destin, sans réduire l’expression à un sentier matériel.
- source_word: וּמֵעָפָר
  choice: et de la poussière
  rationale: La préposition indique l’origine. « Poussière » maintient l’image et les résonances bibliques de עָפָר.
- source_word: אַחֵר
  choice: d’autres
  rationale: Bien que l’adjectif soit morphologiquement singulier, le verbe qui suit est pluriel. Le français « d’autres » respecte cet accord de sens.
- source_word: יִצְמָחוּ
  choice: germeront
  rationale: צמח exprime la pousse végétale. « Germeront » garde l’image botanique avec concision.
theological_decisions:
- issue: Référent de הוּא et portée de « la joie de son parcours »
  choice: 'Formulation déictique : « Voici la joie de son parcours »'
  alternative: « Le voilà, lui, la joie de son parcours » ou « Voilà ce qui fait la joie de son parcours »
  rationale: L’hébreu demeure abrupt et peut être compris personnellement ou comme un résumé ironique du sort de la plante. Le texte principal conserve cette tension, tandis que la note signale l’autre lecture.
translation_notes:
  register: Français international moderne, poétique mais accessible. « Voici » préserve l’élan emphatique; « parcours » maintient la portée figurée de דֶּרֶךְ; la disposition en deux lignes reflète le parallélisme du vers.
