source:
  edition: WLC
  text: רָטֹ֣ב ה֭וּא לִ/פְנֵי שָׁ֑מֶשׁ וְ/עַ֥ל גַּ֝נָּת֗/וֹ יֹֽנַקְתּ֥/וֹ תֵצֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/016.yaml
  text: He is full of moisture before the sun[b][a], and his shoots spread out over his garden.
translation:
  language: fr
  text: Il est plein de sève devant le soleil[a], et ses pousses s’étendent sur son jardin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Devant le soleil » peut signifier « en présence du soleil » ou « à la lumière du soleil », et pas nécessairement « avant le lever du soleil ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et sa pousse sort sur son jardin ». Le nom hébreu singulier désignant une jeune pousse peut avoir un sens collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָטֹב
  choice: plein de sève
  rationale: L’adjectif désigne ce qui est humide ou bien irrigué. « Plein de sève » rend naturellement en français l’image d’une plante vigoureuse sans réduire le terme à la seule idée de luxuriance.
- source_word: הוּא
  choice: il
  rationale: Le pronom masculin maintient la personnification qui structure la comparaison de Bildad, même si l’image est végétale.
- source_word: לִפְנֵי שָׁמֶשׁ
  choice: devant le soleil
  rationale: Cette traduction conserve le sens spatial littéral et l’ambiguïté poétique de l’hébreu, qui peut évoquer une plante exposée à la lumière du soleil plutôt qu’un moment antérieur au lever du soleil.
- source_word: וְעַל
  choice: et … sur
  rationale: « Sur » préserve la valeur spatiale de la préposition tout en donnant une syntaxe française naturelle.
- source_word: גַּנָּתוֹ
  choice: son jardin
  rationale: Le nom et son suffixe masculin singulier sont rendus directement et naturellement.
- source_word: יֹנַקְתּוֹ
  choice: ses pousses
  rationale: Le nom désigne une jeune pousse ou un rejeton végétal. Le pluriel français exprime naturellement la possible valeur collective du singulier hébreu.
- source_word: תֵצֵא
  choice: s’étendent
  rationale: Le verbe signifie littéralement « sortir » ou « aller au-dehors ». Dans cette image végétale, « s’étendent » exprime clairement le déploiement des pousses sur le jardin sans perdre l’idée de mouvement vers l’extérieur.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais accessible. La personnification masculine et l’ambiguïté de « devant le soleil » sont conservées; « plein de sève » et « pousses » rendent l’image végétale dans un registre naturel et digne.
