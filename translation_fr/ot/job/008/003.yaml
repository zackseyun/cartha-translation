source:
  edition: WLC
  text: הַ֭/אֵל יְעַוֵּ֣ת מִשְׁפָּ֑ט וְ/אִם שַׁ֝דַּ֗י יְעַוֵּֽת צֶֽדֶק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/003.yaml
  text: Does God pervert justice[a], or does the Almighty pervert righteousness?
translation:
  language: fr
  text: Dieu fausse-t-il le droit[a], ou le Tout-Puissant fausse-t-il la justice ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu fausse-t-il le jugement, ou le Tout-Puissant fausse-t-il ce qui est juste ? »'
    reason: Les termes מִשְׁפָּט et צֶדֶק peuvent aussi être rendus respectivement par « jugement » et « ce qui est juste ».
lexical_decisions:
- source_word: הַאֵל
  choice: Dieu…-il
  rationale: La particule interrogative הַ introduit une question fermée, et אֵל est ici le titre commun « Dieu ». L’inversion rend naturellement la question rhétorique en français.
- source_word: יְעַוֵּת
  choice: fausserait
  rationale: Le piel de עוה exprime l’action de rendre tortueux ou de dénaturer. Dans ce cadre judiciaire et moral, « fausser » conserve cette force sans suggérer seulement une erreur involontaire.
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: מִשְׁפָּט désigne ici l’ordre du juste jugement ou le droit. « Le droit » garde la portée judiciaire et permet de ne pas le confondre avec צֶדֶק dans le second membre.
- source_word: וְאִם
  choice: Le…-il
  rationale: Dans ces deux interrogations parallèles, וְאִם introduit le second volet. En français, la juxtaposition de deux questions rend le parallélisme plus naturellement qu’un calque « et si » ; la variante avec « ou » est signalée en note.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: שַׁדַּי est un titre divin. « Le Tout-Puissant » est sa traduction française traditionnelle, claire et adaptée au contexte de Job.
- source_word: צֶדֶק
  choice: la justice
  rationale: צֶדֶק recouvre ce qui est juste ou conforme à la droiture. « La justice » est naturel en français et maintient, avec « le droit », une distinction entre les deux termes hébreux apparentés.
theological_decisions:
- issue: Rendre les deux titres divins אֵל et שַׁדַּי
  choice: Dieu… le Tout-Puissant
  alternative: El… Shaddaï
  rationale: Dans ce contexte, les deux formes fonctionnent comme des désignations divines intelligibles plutôt que comme des noms propres exigeant une translittération.
- issue: Maintenir la distinction entre מִשְׁפָּט et צֶדֶק
  choice: le droit… la justice
  alternative: la justice… la justice ; le jugement… la droiture
  rationale: Les deux notions se recouvrent dans le parallélisme sans être identiques. Deux termes français apparentés mais distincts évitent d’aplatir la formulation hébraïque.
- issue: Force rhétorique des interrogations
  choice: emploi du conditionnel dans deux questions parallèles
  alternative: Dieu fausse-t-il… ? Ou le Tout-Puissant fausse-t-il… ?
  rationale: Le conditionnel français exprime naturellement l’hypothèse jugée inconcevable par l’orateur, sans transformer la question rhétorique en affirmation doctrinale explicite.
translation_notes:
  register: Français moderne, international et digne. La formulation concise conserve le parallélisme poétique, la question rhétorique et la distinction juridique et morale des deux membres.
