id: JOB.8.20
reference: Job 8:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֶן אֵ֭ל לֹ֣א יִמְאַס תָּ֑ם וְ/לֹֽא יַ֝חֲזִ֗יק בְּ/יַד מְרֵעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/020.yaml
  text: Behold[a], God does not reject the blameless, nor does he uphold the hand of evildoers.
translation:
  language: fr
  text: Certes, Dieu ne rejette pas l’homme intègre et ne soutient pas les malfaiteurs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « ne tient pas la main des malfaiteurs ». Ou « ne fortifie pas la main des malfaiteurs ».
    reason: La construction hébraïque conserve l’image de la main et peut désigner le fait de prendre ou de soutenir quelqu’un; elle peut aussi être comprise comme le fait de fortifier la main.
lexical_decisions:
- source_word: הֶן
  choice: Oui
  rationale: Introduit ici une affirmation appuyée. « Oui » garde cette force dans un français poétique naturel, sans l’archaïsme de « Voici » dans cet emploi.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל est ici le terme poétique courant désignant Dieu; le texte n’ajoute pas explicitement « Tout-Puissant ».
- source_word: יִמְאַס
  choice: rejette
  rationale: מאס exprime le refus ou le rejet; « rejette » convient au contexte sans ajouter la nuance affective plus forte de « méprise ».
- source_word: תָּם
  choice: l’homme intègre
  rationale: L’adjectif substantivé masculin désigne une personne entière, irréprochable ou intègre. « L’homme intègre » rend à la fois la forme masculine et l’idée morale, familière au livre de Job.
- source_word: יַחֲזִיק
  choice: saisit
  rationale: Le hiphil de חזק peut signifier saisir, tenir fermement, soutenir ou fortifier. « Saisit » conserve ici l’image concrète avec « la main ».
- source_word: בְּיַד
  choice: la main des
  rationale: La locution signifie littéralement « dans/par la main de ». Avec חזק, elle évoque le fait de prendre ou tenir la main de quelqu’un, éventuellement pour le soutenir.
- source_word: מְרֵעִים
  choice: malfaiteurs
  rationale: Le participe désigne ceux qui font le mal. « Malfaiteurs » préserve cette valeur active plutôt que de généraliser en « méchants ».
theological_decisions:
- issue: Sens de וְלֹא יַחֲזִיק בְּיַד מְרֵעִים
  choice: ne saisit pas la main des malfaiteurs
  alternative: ne soutient pas les malfaiteurs / ne fortifie pas la main des malfaiteurs
  rationale: La formulation principale conserve l’image hébraïque sans trancher entièrement entre la saisie concrète et le soutien implicite. La note signale les principales compréhensions possibles.
translation_notes:
  register: Français moderne, digne et poétique. « Oui » marque l’affirmation emphatique; « l’homme intègre » maintient la référence masculine du substantif hébreu. L’image de la main est conservée dans le texte, avec l’ambiguïté idiomatique expliquée en note.
