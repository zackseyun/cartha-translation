  naturalness: « Oui » est possible, mais « Certes » rend plus naturellement, dans un registre poétique moderne, l’assertion emphatique de הֶן. « Ne soutient pas les malfaiteurs » est idiomatique et clair; la note maintient l’image de la main et l’ambiguïté lexicale.
