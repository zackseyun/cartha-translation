  text: כִּֽי שְׁאַל נָ֭א לְ/דֹ֣ר רִישׁ֑וֹן וְ֝/כוֹנֵ֗ן לְ/חֵ֣קֶר אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/008.yaml
  text: For please ask the former generation[b][a], and consider the findings of their fathers.
translation:
  language: fr
  text: Car, interroge donc la génération passée et considère les découvertes[a] de leurs pères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la recherche de leurs pères ». Le nom hébreu peut désigner soit l’acte de rechercher, soit ce que cette recherche a permis de découvrir.
    reason: lexical_alternative
  - marker: b
    text: « Leurs pères » peut aussi se comprendre au sens plus large de « leurs ancêtres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’appui que Bildad apporte à ce qui précède; « Car » conserve naturellement ce lien argumentatif.
- source_word: שְׁאַל נָא
  choice: interroge donc
  rationale: L’impératif signifie « demander, interroger, consulter »; נָא adoucit ou presse l’exhortation. En français, « donc » rend ici cette nuance sans lui donner artificiellement un sens temporel.
- source_word: לְדֹר רִישׁוֹן
  choice: la génération passée
  rationale: רִאשׁוֹן désigne ici une génération antérieure, et non nécessairement la toute première génération.
- source_word: וְכוֹנֵן
  choice: considère
  rationale: Dans ce contexte, la forme invite à fixer ou diriger son attention sur l’objet qui suit. « Considère » exprime cette attention de manière naturelle et concise.
- source_word: לְחֵקֶר
  choice: les découvertes
  rationale: חֵקֶר peut désigner soit la recherche elle-même, soit ce qu’elle permet de découvrir. Le contexte de la sagesse transmise favorise ici le résultat de l’investigation, sans exclure l’autre lecture, signalée en note.
- source_word: אֲבוֹתָם
  choice: ses pères
  rationale: Le suffixe pluriel renvoie collectivement à la génération passée; le français emploie naturellement le singulier collectif « génération » avec « ses ». « Pères » conserve l’expression ancestrale genrée de l’hébreu.
