lexical_decisions:
- source_word: וַיַּעַן
  choice: Alors… répondit
  rationale: Dans cette formule narrative, ענה signifie « répondre ». « Alors » rend naturellement la progression narrative portée par le waw initial.
- source_word: בִּלְדַּד
  choice: Bildad
  rationale: Le nom propre est translittéré selon l’usage français établi.
- source_word: הַשּׁוּחִי
  choice: le Shuhite
  rationale: Ce gentilé désigne l’appartenance de Bildad au peuple ou à la région associés à Shouah. « Shuhite » conserve la forme traditionnellement reconnue en français.
- source_word: וַיֹאמַר
  choice: ':'
  rationale: Le deux-points introduit directement le discours qui suit et rend en français naturel la formule hébraïque littérale « répondit et dit », sans modifier son rôle narratif.
