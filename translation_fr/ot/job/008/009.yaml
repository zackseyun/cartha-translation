lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel de Bildad à l’expérience des générations précédentes et conserve la valeur explicative de la particule.
- source_word: תְמוֹל אֲנַחְנוּ
  choice: nous sommes d’hier
  rationale: Conserve l’image hébraïque de l’origine toute récente des humains, tout en restant naturelle et intelligible en français.
- source_word: וְלֹא נֵדָע
  choice: et nous ne savons pas
  rationale: Rend directement la négation et l’inaccompli qal à la première personne du pluriel, sans renforcer en « nous ne savons rien ».
- source_word: כִּי
  choice: oui
  rationale: La seconde particule appuie ici l’explication précédente. « Oui » exprime naturellement cette valeur confirmative en français sans répéter lourdement « car ».
- source_word: צֵל
  choice: une ombre
  rationale: Préserve l’image poétique de la brièveté et du caractère fugitif de la vie humaine.
- source_word: יָמֵינוּ
  choice: nos jours
  rationale: Traduction directe du nom avec suffixe de première personne du pluriel.
- source_word: עֲלֵי אָרֶץ
  choice: sur la terre
  rationale: Rend clairement la localisation de la vie humaine dans le monde terrestre, dans un registre poétique courant.
