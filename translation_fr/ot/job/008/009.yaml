  text: For we are only of yesterday and do not know[a], for our days on the earth are a shadow.
translation:
  language: fr
  text: Car nous sommes d’hier, et nous ne savons pas[a], car nos jours sur la terre sont une ombre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous ne savons rien ». L’expression « nous sommes d’hier » souligne que notre existence est toute récente et que notre connaissance est donc limitée.'
