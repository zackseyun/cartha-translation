id: JOB.8.15
reference: Job 8:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִשָּׁעֵ֣ן עַל בֵּ֭ית/וֹ וְ/לֹ֣א יַעֲמֹ֑ד יַחֲזִ֥יק בּ֝֗/וֹ וְ/לֹ֣א יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/015.yaml
  text: He leans on his house[a], but it does not stand; he grasps hold of it[b], but it does not remain standing.
translation:
  language: fr
  text: Il s’appuie sur sa maison[a], mais elle ne tient pas ; il s’y agrippe[b], mais elle ne reste pas debout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il met sa confiance dans sa maison ». Le verbe hébreu peut exprimer aussi bien le fait de prendre physiquement appui que celui de compter sur quelque chose.
    reason: lexical_alternative
  - marker: b
    text: 'Les expressions « ne tient pas » et « ne reste pas debout » reproduisent le parallélisme hébreu : ce sur quoi cet homme compte se révèle instable.'
    reason: cross_reference
lexical_decisions:
- source_word: יִשָּׁעֵן
  choice: s’appuie
  rationale: Le nifal de שׁען exprime le fait de prendre appui sur quelque chose ou de s’y fier. « S’appuie » conserve l’image concrète tout en laissant entendre la dépendance.
- source_word: עַל בֵּיתוֹ
  choice: sur sa maison
  rationale: בַּיִת désigne normalement une maison. Même si le terme évoque ici ce sur quoi l’impie compte, traduire littéralement préserve l’image poétique sans l’interpréter à l’excès.
- source_word: וְלֹא יַעֲמֹד
  choice: mais elle ne tient pas
  rationale: עמד signifie se tenir debout ou subsister. « Ne tient pas » est naturel en français, exprime l’instabilité de la maison et convient au présent de vérité générale.
- source_word: יַחֲזִיק בּוֹ
  choice: il s’y agrippe
  rationale: Le hifil de חזק avec בּוֹ décrit une saisie ferme. « S’y agrippe » rend l’action physique avec force et fluidité.
- source_word: וְלֹא יָקוּם
  choice: mais elle ne reste pas debout
  rationale: קום peut signifier se lever ou se tenir debout. En parallèle avec עמד, cette formulation maintient l’image d’une structure incapable de demeurer dressée.
theological_decisions:
- issue: Nature de la « maison »
  choice: Conserver « maison » sans préciser s’il s’agit littéralement d’une demeure ou, figurativement, de ce qui inspire confiance.
  alternative: Traduire par « appui », « refuge » ou « maisonnée ».
  rationale: Le contexte rend l’image métaphorique, mais le texte hébreu garde le mot concret בַּיִת. La traduction préserve donc cette tension au lieu de la résoudre.
translation_notes:
  register: Français moderne, courant et digne. Le présent conserve la portée proverbiale du verset. « S’y agrippe » maintient la vigueur de l’image, tandis que la variation entre « ne tient pas » et « ne reste pas debout » évite une répétition lourde sans effacer le parallélisme.
