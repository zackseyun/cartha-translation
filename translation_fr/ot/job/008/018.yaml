  source_fidelity: « S’il est arraché de son lieu » rend de manière contextuelle et idiomatique l’élimination de l’homme/plante hors de son emplacement. Bien que בלע évoque plus littéralement l’engloutissement ou la destruction, « arraché » est défendable dans l’image végétale immédiate et ne force pas une interprétation doctrinale. La personnification de « son lieu » qui le renie correspond bien à la suite du verset. En revanche, « jamais » ajoute une portée temporelle absolue qui n’est pas exprimée par le parfait hébreu לֹא רְאִיתִיךָ.
