  text: אִם יְבַלְּעֶ֥/נּוּ מִ/מְּקוֹמ֑/וֹ וְ/כִ֥חֶשׁ בּ֝֗/וֹ לֹ֣א רְאִיתִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/018.yaml
  text: If he is destroyed from his place[a], then it will deny him, saying[b], “I have not seen you.”
translation:
  language: fr
  text: 'S’il est arraché de son lieu[a], celui-ci le reniera[b] : « Je ne t’ai pas vu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sa place », si l’on garde directement à l’esprit l’image de la plante. Les suffixes hébreux sont au masculin singulier et peuvent aussi renvoyer à l’homme représenté par cette image.
    reason: lexical_alternative
  - marker: b
    text: Ou « le désavouera »; le verbe hébreu peut exprimer le reniement, le désaveu ou le fait de se montrer trompeur envers quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: S’il
  rationale: Conserve la valeur conditionnelle de la particule hébraïque dans ce tableau poétique.
- source_word: יְבַלְּעֶנּוּ
  choice: est arraché
  rationale: Le piel de בלע évoque ici le fait d’être englouti ou supprimé. « Arraché » rend naturellement, dans l’image végétale du contexte, la disparition hors de son emplacement sans réduire le verbe à une destruction abstraite.
- source_word: מִמְּקוֹמוֹ
  choice: de son lieu
  rationale: Le suffixe masculin singulier peut viser l’homme représenté sous l’image de la plante, tout en permettant de penser à la place de celle-ci; l’ambiguïté est signalée en note.
- source_word: וְכִחֶשׁ בּוֹ
  choice: celui-ci le reniera
  rationale: Le sujet implicite est vraisemblablement « son lieu », personnifié. כחש exprime ici le désaveu ou le reniement, préparant la parole directe.
- source_word: לֹא רְאִיתִיךָ
  choice: Je ne t’ai jamais vu
  rationale: Rend la négation emphatique impliquée par la formule de désaveu tout en conservant l’image concrète de la vue.
theological_decisions:
- issue: Identification de l’être supprimé et personnification de son lieu
  choice: Employer le masculin personnel (« son lieu », « le ») tout en faisant du lieu le sujet du reniement
  alternative: Lire les suffixes en fonction de la plante (« sa place », « elle »)
  rationale: Le verset maintient volontairement un chevauchement entre l’image végétale et l’homme mauvais qu’elle représente; la traduction principale garde la personnalisation, et la note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation conserve la personnification du lieu et le passage fluide entre la plante et l’homme qu’elle figure.
