source:
  edition: WLC
  text: עַד יְמַלֵּ֣ה שְׂח֣וֹק פִּ֑י/ךָ וּ/שְׂפָתֶ֥י/ךָ תְרוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/021.yaml
  text: He will yet fill your mouth with laughter[a], and your lips with shouting.
translation:
  language: fr
  text: Il remplira encore ta bouche de rire[a] et tes lèvres de clameurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à ce qu’il remplisse ta bouche de rire et tes lèvres de clameurs ».'
    reason: Le mot hébreu עַד peut introduire une limite temporelle (« jusqu’à ce que »), reliant alors plus étroitement cette proposition au verset précédent.
lexical_decisions:
- source_word: עַד
  choice: encore
  rationale: Dans le contexte de la promesse amorcée au verset précédent, « encore » exprime naturellement en français l’accomplissement futur attendu. Le sens temporel « jusqu’à ce que » reste possible et est signalé en note.
- source_word: יְמַלֵּה
  choice: il remplira
  rationale: Le piel inaccompli, dont Dieu est le sujet implicite d’après le verset 20, reçoit ici une valeur future conforme à la portée de la promesse.
- source_word: שְׂחוֹק
  choice: rire
  rationale: Le nom désigne directement le rire. Dans ce contexte de relèvement, rien n’impose le sens négatif de rire moqueur.
- source_word: פִּיךָ
  choice: ta bouche
  rationale: Traduction directe qui conserve l’image poétique de la bouche remplie et le suffixe masculin singulier.
- source_word: וּשְׂפָתֶיךָ
  choice: et tes lèvres
  rationale: La formulation littérale préserve le parallélisme corporel avec « ta bouche ».
- source_word: תְרוּעָה
  choice: cris de joie
  rationale: Le terme désigne un cri retentissant, souvent joyeux ou triomphal. Ici, le parallèle avec le rire justifie d’expliciter sa tonalité joyeuse sans lui donner une nuance spécifiquement militaire ou liturgique.
theological_decisions:
- issue: Sujet implicite du verbe
  choice: « il », renvoyant à Dieu dans le contexte immédiat
  alternative: 'Une tournure passive : « ta bouche sera remplie de rire »'
  rationale: Dieu est le sujet agissant au verset 20, et le verset 21 poursuit naturellement cette pensée. Le pronom maintient Dieu comme auteur du relèvement sans ajouter son nom au texte.
translation_notes:
  register: Français moderne, naturel et poétique. Le tutoiement singulier reflète les suffixes hébreux de deuxième personne masculine singulière. « Cris de joie » rend la force de תְרוּעָה tout en restant accessible.
