source:
  edition: WLC
  text: אִם זַ֥ךְ וְ/יָשָׁ֗ר אָ֥תָּה כִּי עַ֭תָּה יָעִ֣יר עָלֶ֑י/ךָ וְ֝/שִׁלַּ֗ם נְוַ֣ת צִדְקֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/006.yaml
  text: If you are pure and upright[c][b][a], surely even now he will rouse himself for you and restore your righteous dwelling.
translation:
  language: fr
  text: Si tu es pur et droit, à coup sûr, maintenant même, il s’éveillera en ta faveur[a] et restaurera[b] ta demeure de justice[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se réveillera pour toi » ou « se mettra en action en ta faveur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « rendra entière » ou « fera prospérer » ; le verbe hébreu peut exprimer l’idée de restaurer, de compléter ou de rendre prospère.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « la demeure de ta justice » ; on peut aussi comprendre « ta demeure juste ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit simplement et fidèlement la condition formulée par Bildad.
- source_word: זַךְ
  choice: pur
  rationale: Exprime ici la pureté morale sans accentuer indûment la notion juridique d’innocence.
- source_word: יָשָׁר
  choice: droit
  rationale: Terme naturel du français sapientiel pour désigner la rectitude morale.
- source_word: כִּי עַתָּה
  choice: à coup sûr, dès maintenant
  rationale: Rend la valeur emphatique probable de כִּי ainsi que l’immédiateté exprimée par עַתָּה.
- source_word: יָעִיר עָלֶיךָ
  choice: il s’éveillera en ta faveur
  rationale: Conserve l’image hébraïque de l’éveil ou de la mise en mouvement, tout en exprimant que l’action est entreprise au bénéfice de Job.
- source_word: וְשִׁלַּם
  choice: et restaurera
  rationale: Dans ce contexte, le piel de שׁלם évoque le fait de rétablir ou de rendre entière la demeure de Job.
- source_word: נְוַת צִדְקֶךָ
  choice: ta demeure de justice
  rationale: Conserve la relation nominale du texte hébreu et son ambiguïté, plutôt que de réduire d’emblée צֶדֶק à un simple adjectif.
theological_decisions:
- issue: Sujet implicite des verbes de la proposition principale
  choice: Conserver le pronom « il », qui renvoie contextuellement à Dieu
  alternative: Ajouter explicitement « Dieu »
  rationale: L’hébreu n’exprime pas le nom du sujet. Le pronom reste intelligible grâce au contexte sans ajouter un élément absent du verset.
- issue: Portée de l’affirmation de Bildad
  choice: Présenter directement sa déclaration conditionnelle
  alternative: Introduire une formulation qui prendrait ses distances avec sa théologie rétributive
  rationale: Le verset rapporte les propos de Bildad sans que la traduction ait à les approuver ni à les corriger.
- issue: Sens de « demeure de justice »
  choice: Préserver le lien nominal entre la demeure et la justice
  alternative: Traduire « ta demeure juste » ou expliciter « la demeure où règne ta justice »
  rationale: La construction hébraïque peut qualifier moralement la demeure, le foyer ou son possesseur; la formulation retenue maintient cette tension.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste accessible tout en conservant l’image de l’éveil, le caractère conditionnel des paroles de Bildad et l’ambiguïté de la construction « demeure de justice ».
