  text: His roots are intertwined over a stone heap[a]; he sees a house of stones.
translation:
  language: fr
  text: Ses racines sont entrelacées sur un amas de pierres ; il voit une maison de pierres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une maison de pierre » ou « un lieu pierreux ». L’expression hébraïque signifie littéralement « maison de pierres » et peut désigner soit une construction en pierres, soit un lieu pierreux.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל גַּל
  choice: sur un amas de pierres
  rationale: עַל indique ici la position ou l’extension des racines sur l’amas. גַּל désigne un tas ou un amas et, dans ce contexte où les pierres sont ensuite mentionnées, « amas de pierres » rend naturellement l’image concrète.
- source_word: שָׁרָשָׁיו
  choice: ses racines
  rationale: Le pluriel possessif est direct et maintient la métaphore de l’être humain comparé à une plante.
- source_word: יְסֻבָּכוּ
  choice: s’entrelacent
  rationale: Le verbe évoque des éléments enchevêtrés ou entrelacés. La forme pronominale française exprime naturellement l’imbrication des racines.
- source_word: בֵּית אֲבָנִים
  choice: une maison de pierres
  rationale: Cette traduction conserve la formulation hébraïque et son ambiguïté possible entre une construction faite de pierres et un lieu pierreux.
- source_word: יֶחֱזֶה
  choice: il voit
  rationale: Le verbe signifie couramment « voir » ou « contempler ». « Il voit » est direct, naturel et préserve la personnification au singulier.
