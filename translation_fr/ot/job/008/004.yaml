id: JOB.8.4
reference: Job 8:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם בָּנֶ֥י/ךָ חָֽטְאוּ ל֑/וֹ וַֽ֝/יְשַׁלְּחֵ֗/ם בְּ/יַד פִּשְׁעָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/004.yaml
  text: If your sons sinned against him[a], he gave them over into the hand of their transgression.
translation:
  language: fr
  text: 'Si tes fils ont péché contre lui,

    il les a livrés au pouvoir de leur révolte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la main de leur révolte » ; l’expression signifie qu’ils ont été livrés à son pouvoir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit normalement une condition. « Si » conserve la portée hypothétique du propos de Bildad sans la transformer en affirmation causale.
- source_word: בָּנֶיךָ
  choice: tes fils
  rationale: Le nom hébreu est un masculin pluriel et désigne explicitement les fils, plutôt que les enfants en général.
- source_word: חָטְאוּ
  choice: ont péché
  rationale: Le qal accompli exprime ici l'action antérieure envisagée dans la proposition conditionnelle.
- source_word: לוֹ
  choice: contre lui
  rationale: Avec חטא, la préposition ל peut désigner la personne offensée. Le contexte renvoie fortement à Dieu, mais le pronom est conservé.
- source_word: וַיְשַׁלְּחֵם
  choice: il les a livrés
  rationale: Avec l'expression suivante « dans la main de », שלח exprime l'idée de livrer quelqu'un à une puissance ou aux conséquences de ses actes.
- source_word: בְּיַד
  choice: au pouvoir de
  rationale: Littéralement « dans la main de » ; l'expression idiomatique hébraïque signifie être placé sous le pouvoir de quelque chose ou de quelqu'un. Le français idiomatique privilégie ici « au pouvoir de ».
- source_word: פִּשְׁעָם
  choice: leur révolte
  rationale: פשע évoque une rupture volontaire, une rébellion ou une transgression. « Révolte » maintient sa nuance plus forte et le distingue de חטא, rendu par « pécher ».
theological_decisions:
- issue: Référent de « lui » dans « ont péché contre lui »
  choice: Conserver le pronom, dont le contexte indique Dieu.
  alternative: Remplacer le pronom par « Dieu » afin d'expliciter le référent.
  rationale: Le contexte de la justice divine rend le référent clair, mais l'hébreu emploie un pronom. Le conserver respecte la formulation et sa légère ambiguïté discursive.
- issue: Nature de la conséquence exprimée dans la proposition principale
  choice: « il les a livrés au pouvoir de leur révolte »
  alternative: « il les a livrés entre les mains de leur transgression »
  rationale: Cette formulation maintient à la fois l'action divine énoncée par Bildad et la puissance destructrice attribuée à leur propre révolte, sans préciser davantage le mécanisme de la rétribution.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme est conservé sur deux lignes. « Livrés au pouvoir de » rend naturellement l’idiome hébraïque, tandis que la note en préserve l’image littérale.
