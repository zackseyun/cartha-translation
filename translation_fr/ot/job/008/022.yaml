source:
  edition: WLC
  text: שֹׂנְאֶ֥י/ךָ יִלְבְּשׁוּ בֹ֑שֶׁת וְ/אֹ֖הֶל רְשָׁעִ֣ים אֵינֶֽ/נּוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/008/022.yaml
  text: Those who hate you will be clothed with shame[a], and the tent of the wicked will be no more.
translation:
  language: fr
  text: Ceux qui te haïssent seront couverts de honte, et la tente des méchants ne sera plus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « la tente des méchants n’est pas » ou « n’existe pas ».'
    reason: La forme hébraïque est une négation existentielle formellement présente, bien que le contexte favorise ici une traduction future et résultative.
lexical_decisions:
- source_word: שֹׂנְאֶיךָ
  choice: ceux qui te haïssent
  rationale: Le participe actif qal au pluriel, muni du suffixe de deuxième personne du masculin singulier, est employé comme substantif. Cette formulation naturelle conserve l’objet personnel « te ».
- source_word: יִלְבְּשׁוּ בֹשֶׁת
  choice: seront couverts de honte
  rationale: Le verbe לבשׁ évoque littéralement le fait de revêtir ou de porter un vêtement. Avec « honte », « seront couverts de honte » garde la métaphore tout en étant idiomatique en français actuel.
- source_word: וְאֹהֶל
  choice: et la tente
  rationale: אֹהֶל désigne littéralement une tente. Même si le mot peut représenter par métonymie la demeure ou la maisonnée, « tente » préserve l’image concrète du texte.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Le pluriel substantivé désigne collectivement les personnes mauvaises; « les méchants » est une formulation française claire et traditionnelle sans ajout interprétatif.
- source_word: אֵינֶנּוּ
  choice: ne sera plus
  rationale: La forme exprime littéralement une négation existentielle, « elle n’est pas ». Dans le mouvement prospectif des versets 20 à 22, le futur résultatif « ne sera plus » rend naturellement l’issue annoncée.
theological_decisions:
- issue: Valeur temporelle de la dernière proposition
  choice: 'Lecture future et résultative : « la tente des méchants ne sera plus »'
  alternative: 'Lecture présente et littérale : « la tente des méchants n’est pas » ou « n’existe pas »'
  rationale: Le contexte immédiat présente des résultats à venir concernant le rétablissement de Job et le sort de ses adversaires. Le futur convient donc au fil du discours, tandis qu’une note conserve la valeur formellement présente de la négation existentielle hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image vestimentaire de la honte et l’image concrète de la tente, tout en signalant l’ambiguïté temporelle de la proposition finale.
