translation:
  language: fr
  text: 'Son assurance est anéantie[a][b],

    et ce en quoi il se confie est la maison d’une araignée[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Son espoir est anéanti » : le nom hébreu peut désigner ici l’assurance, l’espoir ou la sécurité.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu traduit par « est anéantie » est rare et discuté ; il peut aussi évoquer ce qui est retranché ou supprimé et, moins probablement ici, ce qui est détesté.
    reason: lexical_alternative
  - marker: c
    text: Autrement dit, ce en quoi il se confie est aussi fragile que la toile, ou « maison », d’une araignée.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Son
  rationale: Le relatif rattache ce verset à l’impie évoqué au verset précédent. En français, une reprise par le possessif produit une phrase naturelle sans ajouter de référent.
- source_word: יָקוֹט
  choice: est tranchée
  rationale: Le verbe rare et discuté paraît décrire ici la suppression brutale de l’assurance. « Est tranchée » conserve l’image possible d’une rupture sans masquer l’incertitude lexicale.
- source_word: כִּסְלוֹ
  choice: son assurance
  rationale: Dans ce parallélisme avec מִבְטַחוֹ, le nom désigne vraisemblablement l’assurance ou l’espoir plutôt que les autres sens attestés du terme.
- source_word: וּבֵית
  choice: et ... une maison
  rationale: « Maison » maintient l’image concrète du texte hébreu; « et » marque le second membre parallèle.
- source_word: עַכָּבִישׁ
  choice: d’araignée
  rationale: Traduction directe du nom dans la chaîne construite « maison d’araignée ».
- source_word: מִבְטַחוֹ
  choice: ce en quoi il se confie
  rationale: Le nom peut désigner le fondement ou l’objet de la confiance. Cette formulation française explicite ce rapport tout en distinguant le terme de « son assurance » dans le premier membre.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé sur deux lignes. « Maison d’araignée » préserve la métaphore hébraïque, tandis que la note en explicite la fragilité.
