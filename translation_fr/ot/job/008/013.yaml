source:
  edition: WLC
  text: כֵּ֗ן אָ֭רְחוֹת כָּל שֹׁ֣כְחֵי אֵ֑ל וְ/תִקְוַ֖ת חָנֵ֣ף תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/013.yaml
  text: So are the paths of all who forget God[a], and the hope of the godless will perish.
translation:
  language: fr
  text: Il en va ainsi des chemins de tous ceux qui oublient Dieu, et l’espoir de l’impie[a] périra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’hypocrite ». Le terme hébreu peut désigner une personne impie ou irrévérencieuse ; ici, « l’impie » convient mieux au contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Il en va ainsi
  rationale: Cette tournure introduit naturellement en français la comparaison et la conclusion tirées de l’image précédente, sans expliciter davantage que l’hébreu.
- source_word: אָרְחוֹת
  choice: chemins
  rationale: Le pluriel conserve l’image concrète des sentiers ou des parcours qui représentent la conduite et la destinée humaines.
- source_word: שֹׁכְחֵי אֵל
  choice: tous ceux qui oublient Dieu
  rationale: Le participe hébreu est rendu par une proposition relative idiomatique. אֵל est ici un titre divin courant, naturellement traduit par « Dieu ».
- source_word: תִקְוַת
  choice: l’espoir de
  rationale: « Espoir » exprime naturellement l’attente confiante visée dans ce contexte sapientiel.
- source_word: חָנֵף
  choice: l’impie
  rationale: Dans Job, le terme désigne généralement une personne irréligieuse ou moralement pervertie, et non seulement quelqu’un qui dissimule ses véritables convictions. « Impie » préserve cette portée religieuse et morale.
- source_word: תֹּאבֵד
  choice: périra
  rationale: Le verbe אבד exprime la perte ou la destruction. « Périra » restitue sa force et convient au registre solennel du passage.
theological_decisions:
- issue: Sens de חָנֵף dans un contexte de jugement sapientiel
  choice: l’impie
  alternative: l’hypocrite
  rationale: « Impie » rend la portée morale et religieuse générale du terme dans Job, tandis que « hypocrite » risquerait de réduire le sens à la duplicité ou au manque de sincérité.
translation_notes:
  register: Français international moderne, naturel et digne. La structure « Il en va ainsi » conserve le lien comparatif avec l’image précédente, tandis que « chemins » maintient la métaphore hébraïque. Le marqueur de note est placé après le terme auquel la variante se rapporte.
