  text: הֲ/יִֽגְאֶה גֹּ֭מֶא בְּ/לֹ֣א בִצָּ֑ה יִשְׂגֶּה אָ֥חוּ בְלִי מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/011.yaml
  text: Does papyrus grow where there is no marsh? Does reed grass flourish without water?[a]
translation:
  language: fr
  text: Le papyrus pousse-t-il là où il n’y a pas de marais ? L’herbe des marais peut-elle prospérer sans eau ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jonc » pour « le papyrus » et « le roseau » pour « l’herbe des marais » ; l’hébreu met en parallèle deux plantes de milieu marécageux.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִֽגְאֶה
  choice: pousse-t-il
  rationale: La particule interrogative introduit une question rhétorique, et le verbe גאה décrit ici la croissance d’une plante. « Pousser » rend naturellement ce sens en français.
- source_word: גֹּ֭מֶא
  choice: papyrus
  rationale: Le nom désigne vraisemblablement le papyrus, plante caractéristique des milieux marécageux. Ce choix est plus précis que « jonc », tout en laissant l’alternative en note.
- source_word: בְּ/לֹ֣א בִצָּ֑ה
  choice: là où il n’y a pas de marais
  rationale: La formulation conserve l’idée d’absence exprimée par בלא et la valeur locative du contexte, dans un français idiomatique.
- source_word: יִשְׂגֶּה
  choice: peut-elle prospérer
  rationale: Le verbe évoque une croissance abondante ou vigoureuse. « Prospérer » exprime bien cette idée et maintient le parallélisme sans reproduire simplement « pousser ».
- source_word: אָ֥חוּ
  choice: herbe des marais
  rationale: Le terme désigne une végétation de milieu humide, mais l’espèce exacte reste incertaine. « Herbe des marais » est clair, naturel et évite une précision botanique excessive.
- source_word: בְלִי מָֽיִם
  choice: sans eau
  rationale: Traduction directe et idiomatique de l’expression privative, qui souligne la dépendance de cette plante à l’eau.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Les deux questions rhétoriques et leur parallélisme sont conservés. « Peut-elle » dans le second membre rend la tournure française naturelle sans modifier la portée de l’interrogation.
