  yaml_path: translation/ot/job/008/002.yaml
  text: How long will you keep saying these things[a], and the words of your mouth be a mighty wind?
translation:
  language: fr
  text: Jusqu’à quand continueras-tu à dire ces choses, et les paroles de ta bouche seront-elles un vent puissant ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד אָן
  choice: Jusqu’à quand
  rationale: Expression interrogative idiomatique qui rend naturellement en français l’impatience et le reproche de Bildad.
- source_word: תְּמַלֶּל
  choice: continueras-tu à dire
  rationale: La forme intensive exprime l’action de parler ou d’énoncer; « continueras-tu à dire » fait ressortir la durée implicite dans la question sans exagérer le sens.
- source_word: אֵלֶּה
  choice: de telles choses
  rationale: Le démonstratif pluriel renvoie aux propos précédents de Job. Cette formulation évite de répéter « paroles », présent dans le second membre.
- source_word: וְרוּחַ כַּבִּיר
  choice: tandis que ... sont un vent puissant
  rationale: רוּחַ conserve ici l’image concrète du vent, et כַּבִּיר en indique la puissance. « Tandis que » exprime naturellement la coordination à valeur circonstancielle dans cette question française.
- source_word: אִמְרֵי פִיךָ
  choice: les paroles de ta bouche
  rationale: Ce rendu conserve la construction poétique concrète de l’hébreu et son parallélisme, tout en restant intelligible en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. Le tutoiement correspond à l’adresse directe entre Bildad et Job. La métaphore du vent est conservée sans l’interpréter explicitement comme une parole vide ou arrogante.
