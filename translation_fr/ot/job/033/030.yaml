id: JOB.33.30
reference: Job 33:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ/הָשִׁ֣יב נַ֭פְשׁ/וֹ מִנִּי שָׁ֑חַת לֵ֝/א֗וֹר בְּ/א֣וֹר הַֽ/חַיִּים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/030.yaml
  text: to bring back his soul from the pit[c][b][a], that he may be enlightened with the light of life.
translation:
  language: fr
  text: pour ramener son âme[a] hors de la fosse[b], afin qu’elle soit éclairée par la lumière de la vie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa vie » ou « sa personne » ; le mot hébreu peut désigner l’âme, la vie ou la personne elle-même.
    reason: lexical_alternative
  - marker: b
    text: Ou « de la tombe » ou « de la destruction ».
    reason: lexical_alternative
  - marker: c
    text: Ou « pour la conduire à la lumière de la vie » ou « pour lui faire voir la lumière de la vie ». L’hébreu est concis et poétique.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָשִׁיב
  choice: pour ramener
  rationale: L’infinitif causatif de שוב exprime l’idée de faire revenir ou de ramener. « Ramener » conserve ce mouvement concret et s’accorde naturellement avec la délivrance hors de la fosse.
- source_word: נַפְשׁוֹ
  choice: son âme
  rationale: נפש peut désigner l’âme, la vie ou la personne elle-même. « Son âme » préserve l’ampleur anthropologique et poétique du terme, tandis que « sa vie » reste une possibilité signalée en note.
- source_word: מִנִּי שָׁחַת
  choice: hors de la fosse
  rationale: שחת évoque ici la fosse, avec les connotations possibles de tombe ou de destruction. « Hors de la fosse » maintient l’image spatiale ainsi que le contraste avec la lumière de la vie.
- source_word: לֵאוֹר
  choice: afin qu’elle soit éclairée
  rationale: La formulation hébraïque est concise et poétique. Cette proposition rend la visée ou le résultat de la délivrance tout en conservant la voix passive et le lien lexical avec la lumière.
- source_word: בְּאוֹר הַחַיִּים
  choice: par la lumière de la vie
  rationale: « Par » exprime naturellement en français la valeur instrumentale possible de ב. L’expression « lumière de la vie » conserve sans l’expliciter davantage l’image poétique compacte de l’hébreu.
theological_decisions:
- issue: Nature de נַפְשׁוֹ dans le contexte de la délivrance
  choice: Conserver « son âme » dans le texte
  alternative: « sa vie » ou « sa personne »
  rationale: Le contexte peut viser la préservation de la vie entière sans établir une distinction technique entre âme et corps. La note maintient cette amplitude sémantique et évite d’imposer une anthropologie confessionnelle.
translation_notes:
  register: Français international moderne, digne et poétique. La syntaxe reste fluide malgré la forme fragmentaire du verset, et les images de la fosse et de la lumière sont conservées.
