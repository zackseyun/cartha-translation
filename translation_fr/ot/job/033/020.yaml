  text: so that his life loathes bread[b][a], and his soul desirable food.
translation:
  language: fr
  text: 'au point que sa vie prend le pain en dégoût,

    et que son âme a les mets désirables en horreur.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les mets de choix » ; l’expression hébraïque désigne une nourriture désirée ou attirante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזִהֲמַתּוּ
  choice: prend … en dégoût
  rationale: Le verbe exprime la répulsion ou le dégoût. Cette tournure est naturelle en français dans le contexte de la nourriture et le lien avec ce qui précède est rendu par « au point que ».
- source_word: חַיָּתוֹ
  choice: sa vie
  rationale: Le terme désigne ici la vie ou l'être vivant de la personne, en parallèle avec נַפְשׁוֹ. « Sa vie » conserve cette formulation poétique sans la réduire à l'appétit.
- source_word: לָחֶם
  choice: le pain
  rationale: Le sens concret de « pain » est conservé, tandis que le second membre élargit l'image aux mets désirables.
- source_word: נַפְשׁוֹ
  choice: son être
  rationale: נפשׁ peut désigner l'âme, la vie ou la personne elle-même. « Son être » rend ici l'aversion de toute la personne dans un français naturel, tout en maintenant le parallélisme avec « sa vie ».
- source_word: מַאֲכַל
  choice: les mets
  rationale: Dans ce contexte poétique, « mets » désigne naturellement ce qui se mange et s'associe bien à l'adjectif « désirables ».
- source_word: תַּאֲוָה
  choice: désirables
  rationale: Le nom évoque le désir ou ce qui est désiré. « Mets désirables » reste proche de cette idée, sans préciser indûment s'il s'agit de mets raffinés ou simplement appétissants.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme hébreu entre « sa vie » et « son être » est conservé sans employer « âme », qui pourrait suggérer ici une distinction anthropologique plus précise que ne l'impose le contexte.
