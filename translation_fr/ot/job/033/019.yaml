source:
  edition: WLC
  text: וְ/הוּכַ֣ח בְּ֭/מַכְאוֹב עַל מִשְׁכָּב֑/וֹ ו/ריב עֲצָמָ֣י/ו אֵתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/019.yaml
  text: He is also reproved with pain on his bed[a], and with continual strife in his bones,
translation:
  language: fr
  text: Il est aussi corrigé par la douleur sur son lit, et le combat dans ses os est incessant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et le combat dans ses os est violent ». L’adjectif hébreu peut qualifier ce qui est durable ou incessant, mais aussi ce qui est fort ou puissant.
    reason: Alternative lexicale pour אֵתָן, dont le sens peut être « fort/puissant » plutôt que « durable/incessant ».
lexical_decisions:
- source_word: וְהוּכַח
  choice: Il est aussi corrigé
  rationale: Le hofal de יכח exprime ici le fait d’être repris ou corrigé. « Corrigé » conserve la portée corrective du terme sans présenter explicitement la souffrance comme un châtiment rétributif. « Aussi » rend le lien avec les moyens évoqués dans le contexte précédent.
- source_word: בְּמַכְאוֹב
  choice: par la douleur
  rationale: 'מַכְאוֹב désigne la douleur ou la souffrance. La préposition ב est comprise dans un sens instrumental : la douleur est le moyen de la correction.'
- source_word: עַל מִשְׁכָּבוֹ
  choice: sur son lit
  rationale: Traduction directe et naturelle de la situation de la personne alitée.
- source_word: וְרִיב
  choice: et le combat
  rationale: רִיב signifie habituellement querelle, conflit ou combat. Associé aux os, il décrit métaphoriquement une souffrance physique profonde.
- source_word: עֲצָמָיו
  choice: dans ses os
  rationale: Le nom concret « os » est conservé. La tournure « dans ses os » exprime naturellement en français le siège du combat évoqué par l’hébreu.
- source_word: אֵתָן
  choice: est incessant
  rationale: אֵתָן peut exprimer ce qui dure ou ce qui est fort. Dans ce contexte, « incessant » rend une douleur persistante, tandis que le sens possible de « violent » est signalé en note.
theological_decisions:
- issue: La souffrance comme action correctrice de Dieu
  choice: La douleur est présentée comme un moyen de correction, sans préciser qu’il s’agit d’un châtiment rétributif.
  alternative: Comprendre la souffrance soit comme un châtiment strictement punitif, soit comme une maladie sans aucune action divine.
  rationale: Dans le discours d’Élihou, Dieu peut s’adresser à l’être humain au moyen de la souffrance. « Corrigé » maintient cette visée sans imposer une doctrine plus complète de la rétribution.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de l’image corporelle hébraïque tout en donnant une phrase naturelle. Le parallélisme et l’ambiguïté sémantique principale sont préservés.
