  text: to turn a man from his deed[a], and to cover pride from a strong man,
translation:
  language: fr
  text: 'pour détourner l’être humain de son action[a]

    et cacher l’orgueil à l’homme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « pour ôter à l’être humain son action et cacher l’orgueil à l’homme ». L’hébreu est condensé : il peut s’agir soit de détourner quelqu’un de son action, soit de lui ôter l’action elle-même.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְהָסִיר
  choice: détourner … de
  rationale: 'L’infinitif construit au hiphil exprime ici la causation : faire s’écarter quelqu’un de quelque chose. « Détourner … de » rend naturellement ce sens.'
- source_word: אָדָם
  choice: l’être humain
  rationale: Le terme désigne ici une personne sans qu’il soit nécessaire d’accentuer son sexe; cette formulation reste au singulier et convient au registre actuel.
- source_word: מַעֲשֶׂה
  choice: ce qu’il fait
  rationale: Le nom signifie « action », « œuvre » ou « acte ». Dans cette construction hébraïque condensée, la formulation verbale explicite naturellement l’action propre de la personne sans en préciser indûment la valeur morale.
- source_word: וְגֵוָה
  choice: l’orgueil
  rationale: Le nom désigne ici l’élévation de soi au sens négatif; « orgueil » en restitue clairement la portée morale.
- source_word: מִגֶּבֶר
  choice: l’homme de
  rationale: גֶּבֶר peut évoquer l’homme dans sa vigueur, mais ici « l’homme » conserve le parallélisme humain sans introduire une force physique qui n’est pas nécessaire au propos.
- source_word: יְכַסֶּה
  choice: préserver
  rationale: Le verbe signifie littéralement « couvrir, cacher ». Avec מִן, il peut exprimer le fait de tenir quelqu’un à l’écart de quelque chose; « préserver de » rend ce rapport idiomatiquement en français tout en gardant l’idée protectrice du contexte.
theological_decisions:
- issue: Sens du but de l’intervention divine décrite par Élihou
  choice: Dieu détourne la personne de son action et la préserve de l’orgueil.
  alternative: Dieu écarte de la personne son action et cache l’orgueil loin de l’homme.
  rationale: L’hébreu est très condensé. Le contexte de Job 33.14-18 présente l’avertissement divin comme un moyen de retenir l’être humain; le texte principal suit ce mouvement sans qualifier explicitement l’action de mauvaise. La note conserve l’autre analyse syntaxique possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé sur deux lignes; la note signale l’ambiguïté syntaxique réelle sans la résoudre silencieusement.
