  - severity: low
    issue: Note alternative formulée « cacher l’orgueil loin de l’homme »
    rationale: « Loin de » ajoute une idée spatiale absente du texte. La construction française « cacher l’orgueil à l’homme » rend plus sobrement l’alternative « cacher/couvrir la fierté de l’homme ».
