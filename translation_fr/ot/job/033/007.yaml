  text: הִנֵּ֣ה אֵ֭מָתִ/י לֹ֣א תְבַעֲתֶ֑/ךָּ וְ֝/אַכְפִּ֗/י עָלֶ֥י/ךָ לֹא יִכְבָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/007.yaml
  text: Look[a], my terror will not frighten you, and my hand on you will not be heavy.
translation:
  language: fr
  text: 'Voici : la terreur que j’inspire ne t’épouvantera pas, et ma main ne pèsera pas sur toi[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ma pression ne sera pas lourde sur toi ». Le nom hébreu אַכְפִּי est difficile; il est traditionnellement compris comme « ma main », mais, dans ce contexte, il peut évoquer une pression ou un poids imposé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: La particule attire l’attention et introduit avec force l’assurance donnée à Job. « Voici » conserve cette fonction dans un registre français actuel et digne.
- source_word: אֵמָתִי
  choice: la terreur que j’inspire
  rationale: 'Le nom signifie « terreur, effroi » avec un suffixe de première personne. Cette formulation naturelle conserve le sens objectif probable : la terreur associée à la présence d’Élihou.'
- source_word: תְבַעֲתֶךָ
  choice: ne t’épouvantera pas
  rationale: Le piel de בעת exprime le fait de terrifier ou de jeter dans l’effroi. « Épouvanter » restitue l’intensité du verbe et s’accorde avec « terreur ».
- source_word: אַכְפִּי
  choice: la pression que j’exerce
  rationale: Ce nom rare et difficile semble désigner une pression ou un poids imposé à quelqu’un. La formulation choisie rend ce sens probable sans faire passer l’image traditionnelle de la main pour certaine.
- source_word: עָלֶיךָ
  choice: sur toi
  rationale: Équivalent français direct et naturel de la préposition עַל munie du suffixe de deuxième personne.
- source_word: יִכְבָּד
  choice: ne sera pas lourde
  rationale: Le qal de כבד signifie littéralement « être lourd ». La traduction conserve cette image de poids tout en restant compréhensible avec « pression ».
