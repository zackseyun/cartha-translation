id: JOB.33.12
reference: Job 33:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֶן זֹ֣את לֹא צָדַ֣קְתָּ אֶעֱנֶ֑/ךָּ כִּֽי יִרְבֶּ֥ה אֱ֝ל֗וֹהַ מֵ/אֱנֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/012.yaml
  text: Look[a], in this you are not right; I will answer you, for God is greater than man.
translation:
  language: fr
  text: Vois, en cela tu n’as pas raison. Je vais te répondre, car Dieu est plus grand que l’être humain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le mortel ». Le mot hébreu peut souligner la fragilité et la condition mortelle de l’être humain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Vois
  rationale: Particule de discours qui attire fortement l’attention. « Vois » est actuel, direct et digne, sans l’archaïsme de « voici » dans cet emploi.
- source_word: זֹאת
  choice: en cela
  rationale: Le démonstratif renvoie au point précis du discours de Job; « en cela » restitue naturellement cette valeur.
- source_word: לֹא צָדַקְתָּ
  choice: tu n’as pas raison
  rationale: Dans ce contexte de débat, צדק signifie être dans son droit ou avoir raison, plutôt qu’être juste au sens moral général.
- source_word: אֶעֱנֶךָּ
  choice: Je vais te répondre
  rationale: L’imparfait à la première personne annonce la réponse qu’Élihou s’apprête à donner; cette tournure est naturelle en français moderne.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’affirmation précédente; « car » en conserve clairement la force explicative.
- source_word: יִרְבֶּה
  choice: est plus grand
  rationale: Avec מן, le verbe רבה exprime ici une supériorité comparative, non une multiplication numérique.
- source_word: אֱלוֹהַ
  choice: Dieu
  rationale: Le titre divin singulier désigne simplement Dieu dans ce contraste.
- source_word: מֵאֱנוֹשׁ
  choice: que l’être humain
  rationale: אֱנוֹשׁ désigne ici l’humain générique, avec une nuance de fragilité et de mortalité. « L’être humain » préserve le contraste collectif sans donner à « homme » une portée exclusivement masculine.
theological_decisions:
- issue: Portée de אֱנוֹשׁ dans le contraste entre Dieu et l’humain
  choice: l’être humain
  alternative: le mortel
  rationale: Le terme hébreu est un singulier générique pouvant souligner la fragilité mortelle. Le texte affirme la supériorité de Dieu sur l’humain sans préciser ici la nature exacte de cette supériorité; la traduction conserve cette tension sans l’expliciter doctrinalement.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse personnelle d’Élihou à Job. La ponctuation sépare l’objection de l’annonce de la réponse, tandis que « car » conserve explicitement le lien causal.
