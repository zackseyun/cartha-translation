  text: יָשֹׁ֤ר עַל אֲנָשִׁ֗ים וַ/יֹּ֗אמֶר חָ֭טָאתִי וְ/יָשָׁ֥ר הֶעֱוֵ֗יתִי וְ/לֹא שָׁ֥וָה לִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/027.yaml
  text: He sings before men and says, ‘I have sinned and twisted what was right, and it was not repaid to me.’
translation:
  language: fr
  text: 'Il chante devant les hommes et dit : « J’ai péché, j’ai déformé ce qui était droit, et cela ne m’a pas été rendu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשֹׁר
  choice: Il chante
  rationale: Le verbe, rare sous cette forme, est traditionnellement rattaché à שׁיר (« chanter »); dans ce contexte, il introduit une confession publique. La vocalisation massorétique est inhabituelle, mais « chanter » rend le sens contextuel le plus probable.
- source_word: עַל אֲנָשִׁים
  choice: devant les hommes
  rationale: La préposition עַל peut ici indiquer la direction vers un auditoire ou une action faite en sa présence; « devant » donne un français naturel sans exclure l’idée de s’adresser aux hommes.
- source_word: וְיָשָׁר הֶעֱוֵיתִי
  choice: j’ai déformé ce qui était droit
  rationale: Le contraste lexical entre יָשָׁר (« droit ») et עוה (« rendre tortueux, déformer ») est conservé.
- source_word: וְלֹא שָׁוָה לִי
  choice: je n’ai pas été traité comme je le méritais
  rationale: L’expression signifie vraisemblablement que les conséquences du péché n’ont pas été infligées à proportion, plutôt qu’une simple absence de remboursement. Cette formulation reste cohérente avec le contexte immédiat de délivrance.
theological_decisions:
- issue: Nature de la confession finale
  choice: « je n’ai pas été traité comme je le méritais »
  alternative: « cela ne m’a pas profité » / « cela ne m’a pas été rendu »
  rationale: Le contexte décrit un pécheur délivré de la fosse par grâce. La traduction choisie exprime l’idée probable qu’il n’a pas reçu la juste contrepartie de sa faute, sans préciser davantage le mécanisme théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre « droit » et « déformé » est maintenu; la confession est formulée naturellement à la première personne.
