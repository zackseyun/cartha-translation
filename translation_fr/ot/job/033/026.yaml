  to: Il prie Dieu avec ferveur[a], et Dieu l’accueille favorablement. Il voit la face de Dieu[b] avec un cri de joie, et Dieu rend à l’être humain sa droiture[c].
  rationale: La révision privilégie des équivalents français modernes plus naturels tout en restant proche de l’hébreu. Elle clarifie dans le texte les référents que le français pronominal rendrait confus, sans masquer la concision du texte source, signalée en note. « Sa droiture » évite de réduire la צדקה à la seule justice judiciaire et conserve les lectures contextuelles possibles dans la note.
