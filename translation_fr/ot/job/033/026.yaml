source:
  edition: WLC
  text: יֶעְתַּ֤ר אֶל אֱל֨וֹהַּ וַ/יִּרְצֵ֗/הוּ וַ/יַּ֣רְא פָּ֭נָי/ו בִּ/תְרוּעָ֑ה וַ/יָּ֥שֶׁב לֶ֝/אֱנ֗וֹשׁ צִדְקָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/026.yaml
  text: He prays to God[a], and he accepts him; he sees his face with a shout of joy[c][b], and he restores to man his righteousness.
translation:
  language: fr
  text: Il prie Dieu avec ferveur[a], et Dieu l’accueille favorablement. Il voit la face de Dieu[b] avec un cri de joie, et Dieu rend à l’être humain sa droiture[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il supplie Dieu ». Le verbe hébreu souligne souvent une prière insistante.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit simplement « sa face » ; le contexte désigne très probablement la face de Dieu.
    reason: alternative_reading
  - marker: c
    text: Ou « sa justice », « sa juste condition » ou « sa réhabilitation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעְתַּר
  choice: adresse à Dieu une prière fervente
  rationale: Le verbe עתר exprime ici une prière insistante ou une supplication. Cette formulation naturelle garde l’idée d’une démarche fervente sans employer le verbe français ambigu « prier » au sens de simplement demander.
- source_word: וַיִּרְצֵהוּ
  choice: Dieu l’accueille favorablement
  rationale: Le verbe רצה indique que Dieu reçoit favorablement celui qui le supplie. La répétition de « Dieu » clarifie en français le changement de sujet implicite dans l’hébreu.
- source_word: וַיַּרְא פָּנָיו
  choice: Il voit sa face
  rationale: La formulation conserve la concision et le pronom de l’hébreu. Dans le contexte, l’homme voit vraisemblablement la face de Dieu, mais une note explicite le référent plutôt que de l’insérer silencieusement.
- source_word: בִּתְרוּעָה
  choice: avec un cri de joie
  rationale: תְּרוּעָה désigne un cri retentissant, souvent joyeux ou triomphal. « Un cri de joie » en préserve la dimension vocale et affective.
- source_word: וַיָּשֶׁב
  choice: rend
  rationale: 'Le hiphil de שוב a ici un sens causatif : faire revenir, restituer ou rendre. « Rend » est direct et convient à l’objet « sa justice ».'
- source_word: לֶאֱנוֹשׁ
  choice: à l’être humain
  rationale: אֱנוֹשׁ désigne l’être humain mortel. Cette expression est naturelle en français international et conserve la portée humaine générale du terme.
- source_word: צִדְקָתוֹ
  choice: sa justice
  rationale: צְדָקָה peut désigner la justice, la droiture ou la juste position de quelqu’un. « Sa justice » maintient la largeur sémantique et le suffixe possessif sans imposer une construction doctrinale ultérieure.
theological_decisions:
- issue: Référents des pronoms dans « il l’accueille favorablement ; il voit sa face »
  choice: Dieu accueille favorablement l’homme qui prie, puis l’homme voit la face de Dieu.
  alternative: On pourrait grammaticalement envisager que Dieu voie le visage de l’homme, mais l’enchaînement et l’expression « voir la face » favorisent la lecture retenue.
  rationale: Le contexte décrit le rétablissement de la relation entre l’être humain et Dieu. Le texte principal explicite le sujet de l’accueil, tandis que la note préserve l’ambiguïté formelle du possessif.
- issue: Sens de « sa justice »
  choice: Dieu rend à l’être humain sa justice, expression pouvant évoquer sa droiture, sa juste condition ou sa réhabilitation.
  alternative: Le terme peut être compris plus précisément comme « sa justification », « sa réhabilitation » ou « sa juste position » ; il ne faut toutefois pas préciser qu’il s’agit de la justice propre de Dieu attribuée à l’homme.
  rationale: Le suffixe renvoie le plus naturellement à l’être humain. Le choix littéral « sa justice » conserve la tension et la portée théologique de l’hébreu sans importer une doctrine étrangère au verset.
translation_notes:
  register: Français moderne, international et digne, avec un rythme poétique clair. Les sujets implicites ont été explicités lorsque nécessaire pour éviter une confusion française, tout en conservant en note l’ambiguïté réelle des pronoms. « L’être humain » rend la portée générale de אֱנוֹשׁ sans masculin générique inutile.
