source:
  edition: WLC
  text: וְֽ/אוּלָ֗ם שְׁמַֽע נָ֣א אִיּ֣וֹב מִלָּ֑/י וְֽ/כָל דְּבָרַ֥/י הַאֲזִֽינָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/001.yaml
  text: But now[a], Job, please hear my words, and listen to all my speech.
translation:
  language: fr
  text: Mais maintenant, Job, je t’en prie, écoute mes paroles et prête attention à tous mes propos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mais maintenant
  rationale: Marque une transition nette dans le discours d’Élihou; cette formulation française rend naturellement la valeur adversative et discursive de l’expression.
- source_word: שְׁמַע־נָא
  choice: écoute, je te prie
  rationale: L’impératif appelle Job à écouter, tandis que נָא adoucit la demande. « Je te prie » conserve une tonalité courtoise et digne sans être archaïque.
- source_word: אִיּוֹב
  choice: Job
  rationale: Forme française traditionnelle et standard du nom propre.
- source_word: מִלָּי
  choice: mes paroles
  rationale: Rend directement le nom pluriel muni du suffixe de première personne.
- source_word: וְכָל דְּבָרַי
  choice: et à tout ce que je dis
  rationale: Exprime la totalité visée par כָּל et traduit naturellement en français le second terme, proche de « mes paroles », sans produire une répétition lourde.
- source_word: הַאֲזִינָה
  choice: prête attention
  rationale: L’impératif hiphil demande une écoute attentive. Cette formulation distingue le verbe de שׁמע et préserve la progression du parallélisme.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’adresse demeure courtoise; le parallélisme hébreu entre deux verbes d’écoute et deux expressions désignant les propos d’Élihou est conservé avec une variation française naturelle.
