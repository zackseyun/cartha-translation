  text: אִם יֵ֤שׁ עָלָ֨י/ו מַלְאָ֗ךְ מֵלִ֗יץ אֶחָ֥ד מִנִּי אָ֑לֶף לְ/הַגִּ֖יד לְ/אָדָ֣ם יָשְׁרֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/023.yaml
  text: If there is for him an angel[a], a mediator, one among a thousand, to declare to man his uprightness[b],
translation:
  language: fr
  text: S’il y a pour lui un ange[a], un médiateur, un entre mille, pour faire connaître à l’homme ce qui est droit pour lui[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un ange, un interprète »; ou « un messager, un médiateur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sa droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ עָלָיו
  choice: S’il y a pour lui
  rationale: La tournure conserve la condition introduite par אִם, la valeur existentielle de יֵשׁ et la relation exprimée par עָלָיו, sans préciser davantage si l’intermédiaire se tient auprès de l’homme ou agit en sa faveur.
- source_word: מַלְאָךְ
  choice: ange
  rationale: Dans ce contexte, le terme désigne vraisemblablement un être céleste, mais son sens plus général de « messager » est signalé en note.
- source_word: מֵלִיץ
  choice: médiateur
  rationale: Le mot peut désigner celui qui intervient comme interprète, porte-parole ou intercesseur. « Médiateur » exprime ici sa fonction intermédiaire sans la définir excessivement.
- source_word: אֶחָד מִנִּי אָלֶף
  choice: un entre mille
  rationale: Cette formulation concise et idiomatique préserve l’idée de rareté exceptionnelle.
- source_word: לְהַגִּיד
  choice: pour faire connaître
  rationale: L’infinitif indique le but de l’intervention. « Faire connaître » rend naturellement l’idée d’annoncer, d’exposer ou d’expliquer.
- source_word: לְאָדָם
  choice: à l’homme
  rationale: אָדָם renvoie ici à l’être humain individuel déjà évoqué dans le contexte; le masculin du passage est conservé.
- source_word: יָשְׁרוֹ
  choice: ce qui est droit pour lui
  rationale: 'Cette traduction rend la notion de rectitude portée par ישר tout en laissant ouverte la référence du suffixe: ce qui convient à l’homme ou ce qui constitue sa juste voie. La lecture plus formelle « sa droiture » est conservée en note.'
theological_decisions:
- issue: Identité et fonction de מַלְאָךְ מֵלִיץ
  choice: un ange, un médiateur
  alternative: un messager, un interprète; ou un intercesseur céleste compris de manière plus spécifique
  rationale: Le texte présente une figure intermédiaire sans l’identifier plus précisément. La traduction ne lui impose donc ni identité christologique ni fonction angélologique développée.
- issue: Sens de יָשְׁרוֹ
  choice: ce qui est droit pour lui
  alternative: sa droiture
  rationale: La formulation principale exprime le sens contextuel probable sans décider si l’expression vise sa conduite juste, son devoir ou ce qui convient à son cas; la note conserve la lecture formellement plus proche.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde la structure conditionnelle et la suspension finale du verset, dont la phrase se poursuit au verset suivant. Les termes « ange » et « médiateur » restent génériques afin de préserver l’ambiguïté du texte hébreu.
