  yaml_path: translation/ot/job/033/031.yaml
  text: Pay attention[a], Job; listen to me. Be silent[b], and I will speak.
translation:
  language: fr
  text: Sois attentif, Job, écoute-moi. Garde le silence, et moi, je parlerai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְשֵׁב
  choice: Sois attentif
  rationale: L’impératif hiphil de קשׁב appelle une écoute attentive. « Sois attentif » est naturel en français moderne et conserve la force de l’ordre.
- source_word: אִיּוֹב
  choice: Job
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: שְׁמַע לִי
  choice: écoute-moi
  rationale: שׁמע construit avec ל désigne ici une écoute dirigée vers la personne qui parle. « Écoute-moi » est idiomatique et direct.
- source_word: הַחֲרֵשׁ
  choice: Garde le silence
  rationale: L’impératif de חרשׁ commande ici de demeurer silencieux. « Garde le silence » convient au contexte où Élihou demande à Job de ne pas l’interrompre.
- source_word: וְאָנֹכִי
  choice: et moi, je
  rationale: La conjonction est conservée, tandis que le pronom indépendant אָנֹכִי reçoit une expression emphatique naturelle en français par « moi, je ».
- source_word: אֲדַבֵּר
  choice: je parlerai
  rationale: L’imparfait piel de דבר exprime l’action que le locuteur entend accomplir après l’ordre donné à Job; le futur français rend clairement cette succession.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Les trois impératifs gardent la progression rhétorique de l’hébreu, et « moi, je » restitue l’accent porté par le pronom indépendant.
