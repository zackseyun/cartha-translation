  text: וַ/תִּקְרַ֣ב לַ/שַּׁ֣חַת נַפְשׁ֑/וֹ וְ֝/חַיָּת֗/וֹ לַֽ/מְמִתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/022.yaml
  text: His soul draws near to the pit[b][a], and his life to those who bring death.
translation:
  language: fr
  text: 'Son âme s’approche du gouffre[a],

    et sa vie de ceux qui donnent la mort[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la tombe » ou « de la destruction ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des morts » ou « des puissances qui donnent la mort » ; l’expression hébraïque est difficile et peut désigner soit des agents de mort, soit les morts ou les puissances du domaine de la mort.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרַב
  choice: s’approche
  rationale: Le verbe קרב signifie « s’approcher ». Le présent convient à cette description poétique générale de l’être humain qui dépérit et maintient le mouvement vers une issue imminente.
- source_word: לַשַּׁחַת
  choice: du gouffre
  rationale: שַׁחַת peut désigner une fosse, la tombe ou la destruction. « Gouffre » conserve l’image concrète et sa portée mortelle sans la réduire d’emblée à un seul référent.
- source_word: נַפְשׁוֹ
  choice: son âme
  rationale: נֶפֶשׁ peut signifier l’âme, la vie, l’être ou la personne. « Son âme » préserve la distinction poétique avec « sa vie » au second membre, sans imposer une anthropologie technique.
- source_word: וְחַיָּתוֹ
  choice: et sa vie
  rationale: Dans ce contexte, le terme désigne la vie ou l’existence vivante. « Sa vie » est naturel en français et répond au parallèle avec נַפְשׁוֹ.
- source_word: לַמְמִתִים
  choice: de ceux qui donnent la mort
  rationale: 'Le participe pluriel est naturellement compris au sens causatif : « ceux qui font mourir ». La formulation retenue garde cette valeur active sans préciser indûment s’il s’agit d’agents humains ou de puissances de mort.'
theological_decisions:
- issue: Nuance anthropologique du parallélisme entre נַפְשׁוֹ et וְחַיָּתוֹ
  choice: Rendre les deux termes par « son âme » et « sa vie », comme expressions poétiques parallèles.
  alternative: Aplanir le parallélisme en traduisant par « sa vie » et « son existence », ou comprendre « âme » comme un composant immatériel défini techniquement.
  rationale: Le parallélisme évoque la personne et sa vie menacées sans exposer une doctrine précise de la constitution humaine. La traduction conserve la différence lexicale sans la surinterpréter.
- issue: Identité de לַמְמִתִים
  choice: 'Conserver le sens actif et indéterminé : « ceux qui donnent la mort ».'
  alternative: Traduire par « les morts », « les meurtriers » ou comprendre des puissances relevant du domaine de la mort.
  rationale: La forme hébraïque favorise une lecture causative active, mais le contexte poétique ne permet pas d’identifier sûrement ces agents. Une note maintient les autres lectures possibles.
translation_notes:
  register: Français moderne, sobre et poétique. Le découpage en deux lignes met en valeur le parallélisme hébraïque. « Gouffre » et « donnent la mort » restent accessibles tout en conservant l’imagerie et l’ambiguïté du texte source.
