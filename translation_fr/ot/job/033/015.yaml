  text: בַּ/חֲל֤וֹם חֶזְי֬וֹן לַ֗יְלָה בִּ/נְפֹ֣ל תַּ֭רְדֵּמָה עַל אֲנָשִׁ֑ים בִּ֝/תְנוּמ֗וֹת עֲלֵ֣י מִשְׁכָּֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/015.yaml
  text: In a dream[a], a vision of the night, when deep sleep falls on men, in slumbers on the bed,
translation:
  language: fr
  text: Dans un rêve, dans une vision de la nuit, quand un profond sommeil tombe sur les humains[a], quand ils sont assoupis sur leur couche,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les hommes » ; le terme hébreu désigne ici les êtres humains en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: Dans un rêve
  rationale: La préposition ב situe ici la révélation dans le cadre d’un rêve. Cette formulation est naturelle en français et maintient le parallélisme poétique.
- source_word: חֶזְיוֹן לַיְלָה
  choice: dans une vision de la nuit
  rationale: Le syntagme signifie littéralement « vision de la nuit ». La répétition de « dans » explicite naturellement en français le parallélisme avec « dans un rêve » sans changer le sens.
- source_word: בִּנְפֹל תַּרְדֵּמָה
  choice: quand un profond sommeil tombe
  rationale: L’infinitif construit précédé de ב introduit une proposition temporelle. « Profond sommeil » exprime תַּרְדֵּמָה sans lui imposer le sens plus particulier de transe.
- source_word: עַל אֲנָשִׁים
  choice: sur les humains
  rationale: אֲנָשִׁים est un pluriel masculin employé ici de façon générique. « Les humains » communique clairement cette portée inclusive en français moderne, tandis qu’une note signale la forme littérale.
- source_word: בִּתְנוּמוֹת
  choice: quand ils sont assoupis
  rationale: Le pluriel poétique désigne l’état d’assoupissement. Une proposition temporelle coordonnée rend naturellement en français son rapport avec la scène, sans suggérer nécessairement plusieurs épisodes distincts.
- source_word: עֲלֵי מִשְׁכָּב
  choice: sur leur couche
  rationale: Le nom hébreu est singulier et peut avoir une valeur collective. « Leur couche » restitue cette image dans un français idiomatique et dignifié.
theological_decisions:
- issue: Portée générique de אֲנָשִׁים
  choice: les humains
  alternative: les hommes
  rationale: Le contexte vise les êtres humains en général, non exclusivement les personnes de sexe masculin. Le texte principal rend cette portée sans ambiguïté, et la note conserve la transparence quant à la forme masculine de l’hébreu.
translation_notes:
  register: Français moderne, international et dignifié. Le rythme ternaire et la répétition de « dans/quand » conservent la progression poétique du vers, lequel reste syntaxiquement ouvert sur le verset suivant.
