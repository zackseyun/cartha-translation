  text: For God speaks in one way[a], and in two, though one does not perceive it.
translation:
  language: fr
  text: Car Dieu parle tantôt d’une manière[a], tantôt d’une autre, sans qu’on y prenne garde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car Dieu parle une fois, et deux fois, sans qu’on y prenne garde. » Les nombres hébreux peuvent être compris soit comme des adverbes (« une fois... deux fois »), soit comme une expression idiomatique désignant différentes manières de parler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication d’Élihou sur la manière dont Dieu communique et conserve la valeur causale du contexte.
- source_word: בְאַחַת ... וּבִשְׁתַּיִם
  choice: d’une manière, puis d’une autre
  rationale: Rend naturellement en français l’expression numérique hébraïque, qui peut évoquer deux modalités ou des prises de parole répétées, tout en signalant l’autre lecture dans la note.
- source_word: יְדַבֶּר
  choice: parle
  rationale: Le présent exprime bien ici l’action générale ou habituelle de l’imparfait hébreu.
- source_word: אֵל
  choice: Dieu
  rationale: Traduction directe du titre divin אֵל, sans ajout de nuance étrangère au contexte.
- source_word: לֹא יְשׁוּרֶנָּה
  choice: sans qu’on y prenne garde
  rationale: שׁור désigne ici le fait de remarquer ou de percevoir. Le pronom « on » rend le sujet humain générique non exprimé, et « y » renvoie naturellement à la parole de Dieu.
theological_decisions:
- issue: Sujet humain implicite de la dernière proposition
  choice: Sujet générique rendu par « on »
  alternative: « il n’y prend pas garde »
  rationale: L’hébreu porte un sujet masculin singulier non exprimé qui a ici une portée générique. « On » évite de préciser indûment son identité tout en restant idiomatique.
- issue: Valeur des nombres « un » et « deux »
  choice: 'Modalités successives : « d’une manière, puis d’une autre »'
  alternative: 'Fréquence : « une fois, et même deux fois »'
  rationale: Le contexte suivant présente plusieurs moyens par lesquels Dieu parle. Toutefois, l’hébreu permet aussi de comprendre les nombres adverbialement; cette ambiguïté est conservée dans la note.
translation_notes:
  register: Français moderne, international et digne. La formulation principale privilégie une expression naturelle tout en préservant dans la note l’ambiguïté réelle de l’hébreu entre répétition et diversité des modalités.
