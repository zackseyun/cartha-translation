  text: מַ֭דּוּעַ אֵלָ֣י/ו רִיב֑וֹתָ כִּ֥י כָל דְּ֝בָרָ֗י/ו לֹ֣א יַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/013.yaml
  text: Why do you contend against him, because he does not answer for all his words?
translation:
  language: fr
  text: Pourquoi lui fais-tu un procès parce qu’il ne répond pas de tous ses actes[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de toutes ses paroles » ou « de toutes ses affaires ». La lecture traditionnelle porte « ses » ; le texte consonantique peut se lire « mes paroles ». De même, il peut se lire « contre moi » là où la lecture traditionnelle porte « contre lui ».'
    reason: Préserver l’étendue de דבר et signaler les variantes ketiv/qere attestées par le texte fourni, sans choisir dans le texte principal une interprétation confessionnelle ou une harmonisation contextuelle.
lexical_decisions:
- source_word: רִיבוֹתָ
  choice: entres-tu en procès
  rationale: Le verbe ריב désigne une contestation ou une dispute, souvent avec une nuance judiciaire. Cette formulation conserve ici la force juridique sans devenir obscure.
- source_word: כִּי
  choice: Parce que
  rationale: La conjonction introduit le motif de la contestation. La forme interrogative maintient le lien avec la question précédente sans trancher au-delà du texte.
- source_word: דְּבָרָיו
  choice: ses affaires
  rationale: דבר peut désigner une parole, une chose ou une affaire. Dans la construction « répondre de », « affaires » rend naturellement l’idée des actes ou décisions de Dieu tout en conservant le suffixe masculin singulier « ses » du texte massorétique.
- source_word: לֹא יַעֲנֶה
  choice: il ne répond d’aucune
  rationale: La négation portant sur une totalité se rend idiomatiquement en français par « aucune ». « Répondre de » exprime ici le fait de fournir une réponse ou de rendre compte.
theological_decisions:
- issue: Dieu répond-il aux paroles de Job ou rend-il compte de ses propres affaires ?
  choice: 'Conserver le suffixe massorétique à la troisième personne : « ses affaires »'
  alternative: « il ne répond à aucune de tes paroles »
  rationale: Le WLC lit explicitement דְּבָרָיו, « ses paroles/choses/affaires ». L’alternative suppose une autre lecture ou explicite le sens d’après le contexte. Le texte principal suit donc la forme hébraïque reçue sans harmonisation.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Entrer en procès » préserve la nuance judiciaire de ריב ; « répondre de ses affaires » reste naturel et maintient l’ambiguïté entre paroles, actes et décisions.
