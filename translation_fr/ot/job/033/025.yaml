translation:
  language: fr
  text: Sa chair devient plus fraîche qu’au temps de sa jeunesse[a] ; il revient aux jours de sa vigueur juvénile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa chair est rendue fraîche comme celle d’un jeune homme » ou « sa chair devient plus fraîche que celle d’un jeune homme ». Le verbe hébreu est rare, et le rapport avec la jeunesse peut être compris de plusieurs manières.
    reason: lexical_alternative
  - marker: b
    text: Ou « il revient aux jours de sa jeunesse ». Le nom hébreu peut désigner la jeunesse elle-même ou la vigueur qui lui est associée.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֻטֲפַשׁ
  choice: redevient plus fraîche
  rationale: Ce verbe rare exprime l’idée de devenir frais, vigoureux ou luxuriant. « Redevient plus fraîche » conserve l’image corporelle concrète ainsi que la notion de renouvellement suggérée par le contexte.
- source_word: בְּשָׂרוֹ
  choice: sa chair
  rationale: « Chair » est l’équivalent direct et maintient l’accent concret sur la restauration physique.
- source_word: מִנֹּעַר
  choice: que dans sa jeunesse
  rationale: 'La préposition מן peut ici marquer la comparaison : sa chair devient plus fraîche qu’elle ne l’était durant sa jeunesse. La construction reste toutefois susceptible d’autres analyses, signalées en note.'
- source_word: יָשׁוּב
  choice: il revient
  rationale: Le verbe masculin singulier renvoie le plus naturellement à la personne évoquée, plutôt qu’à sa seule chair, et exprime un retour à un état antérieur.
- source_word: לִימֵי
  choice: aux jours de
  rationale: Cette traduction directe préserve l’expression temporelle hébraïque tout en restant naturelle en français.
- source_word: עֲלוּמָיו
  choice: sa vigueur juvénile
  rationale: Le nom peut désigner la jeunesse elle-même ou la vigueur qui lui est associée. « Vigueur juvénile » rend naturellement cette seconde nuance dans le contexte de restauration corporelle.
