  text: הֵן אֲנִ֣י כְ/פִ֣י/ךָ לָ/אֵ֑ל מֵ֝/חֹ֗מֶר קֹרַ֥צְתִּי גַם אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/006.yaml
  text: Look[a], I am like your mouthpiece before God[b]; I too was pinched off from clay.
translation:
  language: fr
  text: Voici, devant Dieu, je suis comme ta bouche[a] ; moi aussi, j’ai été façonné à partir d’argile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je suis comme ta bouche pour Dieu ». L’expression peut aussi vouloir dire « je suis ton porte-parole devant Dieu », « je suis devant Dieu selon ton souhait » ou, peut-être, « je suis ton égal devant Dieu ».'
    reason: alternative_reading
  - marker: b
    text: 'Le verbe hébreu évoque le geste de pincer, de prélever ou de modeler de l’argile ; on pourrait traduire : « j’ai été tiré de l’argile » ou « détaché d’une masse d’argile ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: Particule emphatique qui attire l’attention et confirme l’affirmation. « Oui » est naturel dans ce discours solennel ; « Voici » serait également possible, mais plus marqué.
- source_word: כְפִיךָ לָאֵל
  choice: devant Dieu, je suis comme ta bouche
  rationale: La formulation française conserve l’image littérale et l’ambiguïté de l’hébreu, littéralement « comme ta bouche pour/à Dieu », sans imposer dans le corps du texte l’interprétation plus précise de porte-parole.
- source_word: מֵחֹמֶר
  choice: dans l’argile
  rationale: חֹמֶר désigne l’argile ou la matière argileuse. Avec « façonné », « dans l’argile » rend naturellement la matière à partir de laquelle l’être humain est modelé.
- source_word: קֹרַצְתִּי
  choice: j’ai été façonné
  rationale: Le verbe évoque ici un travail concret de l’argile, possiblement le geste de pincer ou de prélever une portion. « Façonné » reste naturel en français tout en maintenant l’image du modelage.
- source_word: גַם אֲנִי
  choice: moi aussi
  rationale: Cette formulation conserve l’emphase sur la condition humaine qu’Élihou partage avec Job.
theological_decisions:
- issue: Rapport qu’Élihou affirme entre Job, lui-même et Dieu
  choice: Conserver l’expression imagée « comme ta bouche » et signaler ses principales interprétations en note.
  alternative: Traduire directement « ton porte-parole devant Dieu », « selon ton souhait devant Dieu » ou « ton égal devant Dieu ».
  rationale: L’hébreu est condensé et discuté. Le second membre souligne la commune condition humaine d’Élihou et de Job, mais ne suffit pas à déterminer sans reste si le premier présente Élihou comme porte-parole, interlocuteur souhaité ou égal humain devant Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe préserve volontairement l’image inhabituelle de la « bouche » afin de ne pas résoudre une ambiguïté réelle du texte hébreu. « Façonné dans l’argile » restitue l’image tactile sans produire la formulation peu naturelle « pincé de l’argile ».
