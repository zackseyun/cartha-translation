  text: His flesh wastes away from sight[a], and his bones, once unseen, stick out.
translation:
  language: fr
  text: Sa chair dépérit au point de disparaître, et ses os, qu’on ne voyait pas, deviennent saillants.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sa chair se consume et disparaît de la vue, et ses os, qu’on ne voyait pas, sont mis à nu. » L’hébreu de cette ligne est concis et difficile, particulièrement le mot traduit par « deviennent saillants ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכֶל
  choice: dépérit
  rationale: Le qal inaccompli de כלה décrit ici le dépérissement physique progressif; « dépérit » rend naturellement cette dégradation corporelle.
- source_word: בְּשָׂרוֹ
  choice: sa chair
  rationale: La traduction concrète de בשר préserve l’image corporelle du texte hébreu.
- source_word: מֵרֹאִי
  choice: au point de disparaître
  rationale: מן avec רֹאִי exprime ici la disparition hors de la vue; cette formulation française transmet le résultat sans imposer une interprétation trop précise de la tournure compacte.
- source_word: וְשֻׁפִי
  choice: deviennent saillants
  rationale: La forme est difficile, mais le contexte indique vraisemblablement que les os deviennent visibles ou proéminents lorsque la chair dépérit.
- source_word: עַצְמוֹתָיו
  choice: ses os
  rationale: Traduction directe du nom pluriel muni du suffixe masculin singulier.
- source_word: לֹא רֻאּוּ
  choice: qu’on ne voyait pas
  rationale: Le passif négatif de ראה indique que les os n’étaient auparavant pas visibles; la tournure impersonnelle est naturelle en français.
