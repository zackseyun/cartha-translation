  variant: modern international French
source:
  edition: WLC
  text: זַ֥ךְ אֲנִ֗י בְּֽלִ֫י פָ֥שַׁע חַ֥ף אָנֹכִ֑י וְ/לֹ֖א עָוֺ֣ן לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/009.yaml
  text: ‘I am pure[a], without transgression; I am clean[b], and there is no iniquity in me.’
translation:
  language: fr
  text: « Je suis pur, sans transgression ; je suis innocent[a], et il n’y a en moi aucune faute[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « net » ; le mot hébreu peut désigner quelqu’un qui est pur ou exempt de culpabilité.
    reason: lexical_alternative
  - marker: b
    text: Ou « aucune culpabilité » ; le mot hébreu peut désigner la faute elle-même ou la culpabilité qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַךְ
  choice: pur
  rationale: L’adjectif exprime ici la pureté morale. « Pur » est naturel en français et permet de le distinguer de חַף dans le membre parallèle.
- source_word: בְּלִי פָשַׁע
  choice: sans transgression
  rationale: בְּלִי marque l’absence, tandis que פֶּשַׁע désigne une transgression, parfois envisagée comme une révolte. La formulation conserve la portée morale et juridique sans préciser indûment un cadre particulier.
- source_word: חַף
  choice: innocent
  rationale: Le terme peut désigner celui qui est net ou exempt de culpabilité. « Innocent » rend clairement cette nuance en français moderne, sans répéter « pur ».
- source_word: עָוֺן
  choice: faute
  rationale: עָוֺן peut désigner la faute, la culpabilité ou les conséquences de celle-ci. « Faute » reste naturel et suffisamment large dans cette affirmation de Job rapportée par Élihou.
- source_word: לִי
  choice: en moi
  rationale: La préposition signifie littéralement « à moi », mais, dans cette proposition d’existence exprimant une qualité morale attribuée au locuteur, « en moi » est l’équivalent idiomatique français.
theological_decisions:
- issue: Portée de l’affirmation de Job dans la citation d’Élihou
  choice: Rendre directement l’affirmation de pureté morale, sans l’atténuer ni l’amplifier.
  alternative: L’atténuer par « je me considère comme pur » ou l’expliciter comme une revendication doctrinale d’absence absolue de tout péché.
  rationale: L’hébreu juxtapose des prédicats directs et appuyés. La traduction préserve ainsi la tension du passage sans trancher la justesse de l’affirmation ni lui imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La structure parallèle et l’affirmation directe de l’hébreu sont conservées ; la ponctuation française emploie une espace avant le point-virgule.
