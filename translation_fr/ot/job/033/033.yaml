  text: If not[a], then listen to me; be silent[b], and I will teach you wisdom.
translation:
  language: fr
  text: Sinon, écoute-moi ; garde le silence, et je t’enseignerai la sagesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אַיִן
  choice: Sinon
  rationale: 'La locution introduit l’hypothèse contraire à l’invitation du verset précédent : si Job n’a rien à répondre. « Sinon » rend cette transition conditionnelle de façon concise et naturelle.'
- source_word: שְׁמַע לִי
  choice: écoute-moi
  rationale: Le verbe שׁמע construit avec ל exprime ici une écoute attentive dirigée vers celui qui parle ; « écoute-moi » convient au français moderne et garde la force de l’impératif.
- source_word: הַחֲרֵשׁ
  choice: garde le silence
  rationale: L’impératif de חרש commande ici de ne pas parler. « Garde le silence » est direct, naturel et digne.
- source_word: וַאֲאַלֶּפְךָ
  choice: et je t’enseignerai
  rationale: La forme piel de אלף signifie enseigner ou instruire. Après les impératifs, l’imparfait coordonné se rend naturellement par un futur.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: חכמה est le terme hébreu usuel pour la sagesse. Le substantif simple conserve le vocabulaire caractéristique de la littérature sapientielle.
