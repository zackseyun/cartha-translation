id: JOB.33.10
reference: Job 33:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵ֣ן תְּ֭נוּאוֹת עָלַ֣/י יִמְצָ֑א יַחְשְׁבֵ֖/נִי לְ/אוֹיֵ֣ב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/010.yaml
  text: Look[a], he finds grounds for hostility against me; he counts me as his enemy.
translation:
  language: fr
  text: Voici, il trouve contre moi des motifs d’hostilité[a] ; il me considère comme son ennemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hostilités contre moi », « des occasions de s’opposer à moi » ou, peut-être, « des griefs contre moi ». Le nom hébreu est rare et son sens dépend du contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: Marque une affirmation appuyée qui attire l’attention. « Voici » conserve cette force dans un registre digne, sans lourdeur excessive.
- source_word: תְּנוּאוֹת
  choice: des motifs d’hostilité
  rationale: Ce nom rare et dépendant du contexte peut désigner des manifestations d’hostilité, des occasions d’opposition ou des griefs. « Motifs d’hostilité » s’accorde naturellement avec « trouve » tout en préservant la dimension adversative.
- source_word: עָלַי
  choice: contre moi
  rationale: Dans ce contexte hostile, la préposition עַל a naturellement une valeur adversative.
- source_word: יִמְצָא
  choice: il trouve
  rationale: Le sens lexical fondamental est « trouver ». Cette formulation évite de renforcer l’accusation en traduisant par « invente ».
- source_word: יַחְשְׁבֵנִי
  choice: il me considère
  rationale: Le verbe חָשַׁב exprime ici une appréciation ou une attribution de statut. « Considère » est naturel en français actuel.
- source_word: לְאוֹיֵב לוֹ
  choice: comme son ennemi
  rationale: La construction indique le rôle ou le statut attribué à Job ; « comme son ennemi » en est le rendu français idiomatique.
theological_decisions:
- issue: Point de vue du locuteur sur la manière dont Dieu traite Job
  choice: 'Présenter sans l’atténuer la plainte rapportée : « il trouve contre moi des motifs d’hostilité ; il me considère comme son ennemi »'
  alternative: « il invente des accusations contre moi »
  rationale: Le verset rapporte la perception que Job a de l’action de Dieu, sans valider cette perception comme affirmation doctrinale. « Trouve » maintient la tension du texte sans durcir l’accusation en suggérant que Dieu fabriquerait de faux griefs.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » rend l’interjection emphatique ; la ponctuation conserve les deux propositions parallèles du texte hébreu.
