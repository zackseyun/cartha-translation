  text: יַחְשֹׂ֣ךְ נַ֭פְשׁ/וֹ מִנִּי שָׁ֑חַת וְ֝/חַיָּת֗/וֹ מֵ/עֲבֹ֥ר בַּ/שָּֽׁלַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/018.yaml
  text: He spares his soul from the pit[c][b][a], and his life from passing by the weapon.
translation:
  language: fr
  text: 'Il préserve son âme de la fosse[a],

    et sa vie de périr par l’arme[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la tombe » ou « de la destruction ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut désigner plus précisément un projectile, une arme de jet ou peut-être une épée; le vers évoque une mort violente.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְשֹׂךְ
  choice: préserve
  rationale: Le hiphil de חשׂך exprime ici l’action de retenir ou de garder quelqu’un d’un danger. « Préserve » rend naturellement cette intervention protectrice sans préciser explicitement le sujet, absent de ce verset isolé.
- source_word: נַפְשׁוֹ
  choice: son âme
  rationale: נפש peut désigner l’âme, la vie ou la personne. « Son âme » conserve l’image hébraïque et le parallélisme poétique avec « sa vie ».
- source_word: מִנִּי שָׁחַת
  choice: de la fosse
  rationale: שׁחת évoque concrètement la fosse et, par extension, la tombe ou la destruction. « La fosse » préserve cette métaphore mortuaire sans en réduire la polysémie.
- source_word: וְחַיָּתוֹ
  choice: sa vie
  rationale: Dans ce contexte, חיה désigne la vie de la personne et forme un parallèle avec נפש.
- source_word: מֵעֲבֹר
  choice: de périr
  rationale: Le sens littéral est « de passer », mais dans ce contexte de préservation face à la fosse et aux armes, l’expression évoque le passage vers une mort violente. « Périr » donne en français le sens contextuel naturel.
- source_word: בַּשָּׁלַח
  choice: sous les armes
  rationale: שׁלח peut désigner un projectile, une arme de jet ou une arme plus généralement. Le pluriel collectif français « sous les armes » reste prudent sur l’objet exact et exprime une mort violente.
theological_decisions:
- issue: Référent de נַפְשׁוֹ
  choice: son âme
  alternative: sa vie / sa personne
  rationale: Le choix conserve le langage anthropologique du texte sans supposer que l’âme soit ici une entité séparable; le parallèle indique clairement la préservation de la personne vivante.
- issue: Interprétation de עֲבֹר בַּשָּׁלַח
  choice: périr sous les armes
  alternative: passer par l’arme / rencontrer le projectile
  rationale: La formulation française rend l’issue mortelle suggérée par le parallélisme, tout en signalant en note l’incertitude sur la nature exacte de שׁלח.
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme « son âme / sa vie » est conservé. « Sous les armes » est idiomatique, mais la note maintient l’incertitude lexicale de שׁלח.
