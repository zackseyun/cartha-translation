translation_notes:
  register: Français international moderne, poétique mais accessible. « Se retrouve dans » suit d’assez près la relation elliptique de l’hébreu entre la droiture du cœur et les paroles, sans introduire une causalité trop précise. La seconde proposition privilégie une tournure française naturelle; la note préserve l’ambiguïté de בָּרוּר.
