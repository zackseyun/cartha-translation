  yaml_path: translation/ot/job/033/003.yaml
  text: The uprightness of my heart is in my words[a], and my lips speak knowledge clearly.
translation:
  language: fr
  text: La droiture de mon cœur se retrouve dans mes paroles, et mes lèvres expriment clairement ma connaissance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « mes lèvres expriment une connaissance pure » ou « mes lèvres disent clairement ce qu’elles savent ». Le terme hébreu rendu par « clairement » peut aussi évoquer la pureté ou la netteté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֶׁר
  choice: droiture
  rationale: Le nom désigne ce qui est droit, notamment sur le plan moral. « Droiture » rend ici la rectitude et la sincérité intérieure revendiquées par Élihou.
- source_word: לִבִּי
  choice: mon cœur
  rationale: Le cœur représente la personne intérieure, avec ses pensées et sa volonté. L’expression française conserve cette image hébraïque de manière naturelle.
- source_word: אֲמָרַי
  choice: mes paroles
  rationale: Le pluriel désigne les propos d’Élihou. « Mes paroles » est direct et maintient le parallélisme poétique avec « mes lèvres ».
- source_word: וְדַעַת
  choice: ce que je sais
  rationale: Le nom « connaissance » désigne ici le contenu que les lèvres expriment. La formulation verbale est plus naturelle en français tout en gardant ce sens.
- source_word: שְׂפָתַי
  choice: mes lèvres
  rationale: Les lèvres représentent la parole par métonymie. Conserver l’image préserve la poésie et le parallélisme avec le cœur.
- source_word: בָּרוּר
  choice: clairement
  rationale: Le terme peut évoquer la clarté, la franchise ou la pureté. Dans cette proposition portant sur la parole, « clairement » produit un sens naturel sans exclure les autres nuances, signalées en note.
- source_word: מִלֵּלוּ
  choice: expriment
  rationale: Le verbe signifie parler ou énoncer. « Expriment » convient à des lèvres prises comme sujet et permet une phrase idiomatique avec « ce que je sais ».
