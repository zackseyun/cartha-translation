  text: וַ/יְחֻנֶּ֗/נּוּ וַ/יֹּ֗אמֶר פְּ֭דָעֵ/הוּ מֵ/רֶ֥דֶת שָׁ֗חַת מָצָ֥אתִי כֹֽפֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/024.yaml
  text: then he is gracious to him and says[a], ‘Deliver him from going down to the pit[b]; I have found a ransom.’
translation:
  language: fr
  text: 'Alors il lui fait grâce et dit : « Délivre-le de descendre dans la fosse[a] ; j’ai trouvé une rançon[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « La fosse » peut aussi évoquer la tombe ou la destruction, et non seulement un trou matériel.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu כֹּפֶר peut désigner une rançon ou une compensation qui permet la libération. Dans certains contextes, il peut aussi avoir une portée expiatoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחֻנֶּנּוּ
  choice: alors il lui fait grâce
  rationale: Le verbe חנן exprime la grâce, la faveur ou la miséricorde. « Faire grâce » conserve cette nuance sans réduire l’action à un simple sentiment de pitié.
- source_word: וַיֹּאמֶר
  choice: et dit
  rationale: Le présent de narration rend naturellement en français la succession exprimée par le waw consécutif et introduit directement la parole citée.
- source_word: פְּדָעֵהוּ
  choice: Délivre-le
  rationale: Le verbe פדה peut signifier délivrer, racheter ou libérer moyennant une intervention ou un paiement. « Délivre-le » convient à l’impératif et évite de redoubler prématurément l’idée de rançon portée ensuite par כֹפֶר.
- source_word: מֵרֶדֶת
  choice: qu’il ne descende pas
  rationale: L’infinitif construit avec מִן exprime ici l’empêchement de la descente. Cette formulation française est naturelle tout en conservant clairement le mouvement vers le bas.
- source_word: שָׁחַת
  choice: la fosse
  rationale: Le terme désigne concrètement une fosse, avec dans ce contexte des évocations possibles de la tombe, de la mort ou de la destruction. « La fosse » préserve l’image sans en fixer toutes les implications.
- source_word: מָצָאתִי
  choice: J’ai trouvé
  rationale: 'Le parfait à la première personne peut exprimer un résultat désormais acquis : le fondement de la délivrance a été trouvé.'
- source_word: כֹפֶר
  choice: une rançon
  rationale: כֹפֶר désigne une rançon ou une compensation permettant la libération. « Une rançon » est clair en français moderne et correspond au contexte immédiat, sans imposer au mot un sens doctrinal plus technique.
theological_decisions:
- issue: Sens de כֹפֶר dans le discours d’Élihou
  choice: rançon
  alternative: prix d’expiation, compensation ou moyen de couvrir la faute
  rationale: Le contexte présente ce qui permet d’épargner à une personne la descente dans la fosse. « Rançon » garde l’idée concrète d’un prix ou moyen de libération, tandis que la note conserve les résonances possibles d’expiation sans les imposer au texte principal.
- issue: Référent du sujet de « il lui fait grâce et dit »
  choice: maintien du pronom « il »
  alternative: expliciter « le messager » ou « Dieu »
  rationale: L’hébreu ne répète pas explicitement le sujet dans ce verset. Le pronom maintient la continuité contextuelle et évite de trancher ici une question d’interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct reste vif ; les deux-points après « Délivre-le » rendent naturellement la construction hébraïque de prévention sans alourdir la phrase.
