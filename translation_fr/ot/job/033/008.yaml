source:
  edition: WLC
  text: אַ֭ךְ אָמַ֣רְתָּ בְ/אָזְנָ֑/י וְ/ק֖וֹל מִלִּ֣ין אֶשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/008.yaml
  text: 'Surely you have spoken in my hearing[a], and I have heard the sound of your words:'
translation:
  language: fr
  text: 'Oui, tu as parlé à mes oreilles,

    et j’ai entendu le son de tes paroles :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Oui
  rationale: La particule a ici une valeur d’affirmation énergique plutôt que restrictive. « Oui » introduit naturellement en français la reprise par Élihou des propos de Job.
- source_word: אָמַרְתָּ
  choice: tu as parlé
  rationale: Le qatal à la deuxième personne du masculin singulier renvoie aux paroles déjà prononcées par Job.
- source_word: בְאָזְנָי
  choice: à mes oreilles
  rationale: Cette formulation demeure proche de l’image hébraïque (« dans mes oreilles ») tout en étant idiomatique en français.
- source_word: וְקוֹל
  choice: et ... le son
  rationale: קוֹל peut désigner une voix ou un son. Avec « paroles », « le son de tes paroles » conserve l’accent auditif et reste naturel.
- source_word: מִלִּין
  choice: tes paroles
  rationale: La forme aramaïsante signifie « paroles ». Le possessif, implicite dans le contexte, est explicité en français pour désigner clairement les paroles de Job.
- source_word: אֶשְׁמָע
  choice: j’ai entendu
  rationale: Bien que la forme soit un yiqtol, le contexte la rattache à la parole antérieure de Job ; le passé composé exprime naturellement cette perception accomplie en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme auditif de l’hébreu est conservé par « à mes oreilles » et « le son de tes paroles », sans reproduire littéralement l’expression peu naturelle « dans mes oreilles ».
