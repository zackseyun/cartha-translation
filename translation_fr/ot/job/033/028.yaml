id: JOB.33.28
reference: Job 33:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פָּדָ֣ה נפש/י מֵ/עֲבֹ֣ר בַּ/שָּׁ֑חַת ו/חית/י בָּ/א֥וֹר תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/028.yaml
  text: He has redeemed my soul from passing into the pit[b][a], and my life will look upon the light.
translation:
  language: fr
  text: Il a racheté mon âme, l’empêchant de passer dans la fosse[a][b], et ma vie contemplera la lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il a délivré ma vie pour qu’elle ne descende pas dans la fosse. »'
    reason: lexical_alternative
  - marker: b
    text: Dans la poésie hébraïque, « la fosse » est une image courante de la mort ou de la tombe.
    reason: cultural_note
lexical_decisions:
- source_word: פָּדָה
  choice: a racheté
  rationale: Le verbe désigne le fait de racheter ou d’arracher quelqu’un à un danger. « A racheté » conserve cette image concrète et rend l’accompli hébreu, sans préciser un prix que le verset ne mentionne pas.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » préserve ici la distinction poétique avec וְחַיָּתִי, « ma vie », dans le second membre.
- source_word: מֵעֲבֹר
  choice: l’empêchant de passer
  rationale: La préposition מִן avec l’infinitif exprime ici la préservation d’un passage vers la fosse. Cette formulation française naturelle conserve l’image du mouvement sans suggérer que l’entrée a eu lieu.
- source_word: בַּשַּׁחַת
  choice: dans la fosse
  rationale: שַׁחַת désigne une fosse et, par image, la mort ou le séjour des morts. « La fosse » maintient la métaphore hébraïque.
- source_word: וְחַיָּתִי
  choice: et ma vie
  rationale: Le nom renvoie à la vie ou à l’existence vivante. Le choix littéral maintient le parallélisme poétique avec « mon âme » ainsi que l’accord féminin du verbe hébreu.
- source_word: בָּאוֹר
  choice: la lumière
  rationale: L’article hébreu justifie « la lumière ». Dans le contexte, elle évoque probablement la vie préservée, par contraste avec la fosse.
- source_word: תִּרְאֶה
  choice: contemplera
  rationale: L’imparfait hébreu est compris dans un sens futur. « Contemplera » exprime l’idée de voir la lumière et convient au registre poétique, sans expliciter davantage la portée de l’image.
theological_decisions:
- issue: Référent du sujet implicite de פָּדָה
  choice: Il a racheté mon âme
  alternative: Dieu a racheté mon âme ; Il racheta mon âme
  rationale: Le verbe masculin singulier n’a pas de sujet explicite dans ce verset. Le contexte renvoie à Dieu, mais la traduction conserve le pronom implicite plutôt que d’ajouter directement son nom.
- issue: Portée de l’image de la lumière
  choice: ma vie contemplera la lumière
  alternative: je reverrai la lumière ; ma vie jouira de la lumière
  rationale: 'La traduction conserve la personnification et l’ambiguïté poétique : la lumière peut évoquer la vie, le salut ou le retour à l’existence vécue, sans imposer une interprétation doctrinale précise.'
translation_notes:
  register: Français international moderne, digne et poétique. La syntaxe reste accessible tout en conservant le parallélisme entre « mon âme » et « ma vie », ainsi que les images de la fosse et de la lumière.
