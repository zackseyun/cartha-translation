  yaml_path: translation/ot/job/033/029.yaml
  text: Look[a], God does all these things two or three times with a man,
translation:
  language: fr
  text: 'Voici : Dieu accomplit tout cela deux ou trois fois à l’égard d’un homme[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’un être humain ». L’hébreu dit « avec un homme »; le singulier masculin est employé de façon représentative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Oui
  rationale: Particule discursive qui attire l’attention et confirme avec emphase l’affirmation; « Oui » est naturel et digne en français dans ce contexte conclusif.
- source_word: כָּל אֵלֶּה
  choice: tout cela
  rationale: Renvoie globalement aux diverses interventions divines décrites dans les versets précédents, sans ajouter un nom absent de l’hébreu.
- source_word: יִפְעַל
  choice: fait
  rationale: Le verbe פעל exprime ici l’action accomplie; « fait » s’associe naturellement à « tout cela ».
- source_word: אֵל
  choice: Dieu
  rationale: Rend directement le terme divin אֵל dans ce contexte.
- source_word: פַּעֲמַיִם שָׁלֹשׁ
  choice: deux fois, trois fois
  rationale: Conserve la formulation hébraïque juxtaposée et son idée de répétition, sans la réduire à une fréquence strictement délimitée par « deux ou trois fois ».
- source_word: עִם
  choice: pour
  rationale: Dans l’expression française, « pour » rend naturellement l’action de Dieu à l’égard de l’être humain; « avec » serait plus formel mais moins idiomatique ici.
- source_word: גָּבֶר
  choice: l’être humain
  rationale: Dans ce contexte généralisant, le masculin singulier hébreu désigne un représentant de l’humanité; « l’être humain » conserve le singulier générique sans suggérer que seuls les hommes sont concernés.
theological_decisions:
- issue: Portée représentative de גָּבֶר
  choice: l’être humain
  alternative: un homme
  rationale: Le nom est morphologiquement masculin, mais l’énoncé général porte sur la manière dont Dieu agit envers un humain. La traduction choisie explicite cette portée générique sans effacer le singulier représentatif.
- issue: Valeur de פַּעֲמַיִם שָׁלֹשׁ
  choice: deux fois, trois fois
  alternative: deux ou trois fois
  rationale: La juxtaposition littérale peut être une manière sémitique d’exprimer la répétition. La garder préserve la tension entre un décompte formulé et l’idée d’actions répétées.
translation_notes:
  register: Français international moderne, courant et digne. La phrase reste concise et conserve le rythme emphatique et récapitulatif de l’hébreu.
