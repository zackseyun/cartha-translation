  text: אָ֣ז יִ֭גְלֶה אֹ֣זֶן אֲנָשִׁ֑ים וּ/בְ/מֹ֖סָרָ֣/ם יַחְתֹּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/016.yaml
  text: then he opens the ears of men and seals their instruction[a].
translation:
  language: fr
  text: alors il ouvre l’oreille des hommes et scelle leur instruction[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur avertissement », « leur correction » ou « leur discipline ». Le mot hébreu מוּסָר peut désigner une instruction, un avertissement, une correction ou une discipline.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: alors
  rationale: Adverbe temporel qui marque la suite de la description précédente de la parole divine dans les rêves et les visions.
- source_word: יִגְלֶה אֹזֶן
  choice: il ouvre l’oreille
  rationale: Littéralement « il découvre l’oreille » ; l’expression signifie rendre quelqu’un réceptif à ce qui lui est communiqué. La formulation française conserve l’image biblique sans être obscure.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Le pluriel désigne ici les êtres humains ; « des hommes » respecte la forme du texte source et convient au registre poétique.
- source_word: וּבְמֹסָרָם
  choice: l’instruction qu’il leur donne
  rationale: מוּסָר peut désigner l’instruction, l’avertissement, la correction ou la discipline. La reformulation explicite naturellement en français la relation exprimée par le suffixe de troisième personne du pluriel, sans déterminer à tort une possession autonome.
- source_word: יַחְתֹּם
  choice: scelle
  rationale: Le verbe חתם évoque l’action de sceller, de fixer ou d’imprimer durablement. « Scelle » préserve cette métaphore.
theological_decisions:
- issue: Nature du מוּסָר communiqué par Dieu
  choice: instruction
  alternative: avertissement ; correction ; discipline
  rationale: Le contexte décrit une communication divine destinée à détourner l’être humain de sa conduite, mais le terme hébreu reste polysémique ; la note conserve les principales nuances possibles.
translation_notes:
  register: Français moderne, naturel et digne. Le singulier idiomatique « l’oreille des hommes » ainsi que la métaphore du sceau sont conservés ; la note maintient l’ambiguïté lexicale de מוּסָר.
