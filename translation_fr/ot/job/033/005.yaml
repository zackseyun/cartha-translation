  text: אִם תּוּכַ֥ל הֲשִׁיבֵ֑/נִי עֶרְכָ֥/ה לְ֝/פָנַ֗/י הִתְיַצָּֽבָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/005.yaml
  text: If you are able[a], answer me; set your case in order before me; take your stand.
translation:
  language: fr
  text: Si tu le peux, réponds-moi ; organise ta réponse devant moi[a] ; présente-toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « expose tes arguments devant moi ». Le verbe hébreu signifie « mettre en ordre » ou « préparer » ; son objet n’est pas exprimé et peut désigner la réponse, les paroles ou la cause de Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תּוּכַל
  choice: Si tu le peux
  rationale: Exprime directement la condition et la capacité, dans un français naturel qui conserve le ton de défi.
- source_word: הֲשִׁיבֵנִי
  choice: réponds-moi
  rationale: Dans ce contexte de controverse, le hiphil de שוב signifie idiomatiquement « répondre ».
- source_word: עֶרְכָה
  choice: expose tes arguments
  rationale: Le verbe ערך signifie « disposer, mettre en ordre ». L'objet n'étant pas exprimé, « tes arguments » explicite naturellement le sens probable dans cette joute verbale sans exclure la préparation d'une réponse.
- source_word: לְפָנַי
  choice: devant moi
  rationale: Rend simplement et fidèlement la présence face au locuteur.
- source_word: הִתְיַצָּבָה
  choice: tiens-toi prêt
  rationale: Le hitpael de יצב invite à se placer fermement ou à se présenter pour l'affrontement ; cette formulation restitue ici l'idée de prendre position et d'être prêt à répondre.
