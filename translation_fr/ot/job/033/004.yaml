id: JOB.33.4
reference: Job 33:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רֽוּחַ אֵ֥ל עָשָׂ֑תְ/נִי וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּחַיֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/004.yaml
  text: The Spirit of God has made me[a], and the breath of the Almighty gives me life.
translation:
  language: fr
  text: 'L’Esprit de Dieu m’a fait[a],

    et le souffle du Tout-Puissant me donne la vie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le souffle de Dieu m’a fait ». Le mot hébreu רוּחַ peut aussi signifier « souffle » ou « vent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: Esprit
  rationale: Dans l’expression רוּחַ אֵל et en parallèle avec « le souffle du Tout-Puissant », le mot peut désigner l’Esprit divin qui donne la vie. La majuscule signale ce référent, tandis que la note conserve le sens également possible de « souffle ».
- source_word: אֵל
  choice: Dieu
  rationale: אֵל désigne ici Dieu et répond poétiquement à שַׁדַּי dans le second membre.
- source_word: עָשָׂתְנִי
  choice: m’a fait
  rationale: Cette formulation directe rend le sens courant de עשה sans ajouter l’idée plus précise de façonner.
- source_word: נִשְׁמַת
  choice: souffle
  rationale: נשמה désigne le souffle vital; ce choix garde le lien avec la vie donnée par Dieu et le parallélisme avec רוּחַ.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: C’est l’équivalent français traditionnel et intelligible de ce titre divin dans Job.
- source_word: תְּחַיֵּנִי
  choice: me donne la vie
  rationale: Le piel de חיה exprime ici l’action de faire vivre. Cette tournure naturelle garde l’accent sur l’origine divine de la vie sans limiter le sens à « me maintient en vie ».
theological_decisions:
- issue: Faut-il comprendre רוּחַ אֵל comme l’« Esprit de Dieu » ou le « souffle de Dieu » ?
  choice: L’Esprit de Dieu
  alternative: Le souffle de Dieu
  rationale: Le contexte présente l’action vivifiante de Dieu et distingue poétiquement רוּחַ de נִשְׁמַת. « Esprit » rend bien l’agent divin, mais l’ambiguïté lexicale authentique est maintenue dans une note plutôt que supprimée.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme des deux membres est conservé; « m’a fait » reste simple et proche de l’hébreu, tandis que « me donne la vie » est idiomatique et exprime la valeur causative du verbe.
