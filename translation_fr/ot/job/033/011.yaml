source:
  edition: WLC
  text: יָשֵׂ֣ם בַּ/סַּ֣ד רַגְלָ֑/י יִ֝שְׁמֹ֗ר כָּל אָרְחֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/011.yaml
  text: He puts my feet in the stocks[a]; he watches all my paths.
translation:
  language: fr
  text: Il met mes pieds dans les ceps ; il surveille tous mes sentiers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il garde tous mes sentiers ». Le verbe hébreu peut exprimer soit la surveillance, soit la garde ; ici, le contexte favorise l’idée d’un examen contraignant plutôt que celle d’une protection.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: met
  rationale: Le verbe שׂים signifie couramment « mettre, placer ». Le présent convient au discours rapporté et rend naturellement l’action en français.
- source_word: בַּסַּד
  choice: dans l’entrave
  rationale: סַד désigne un dispositif qui immobilise les pieds. « L’entrave » conserve l’image concrète d’une immobilisation punitive et reste compréhensible en français moderne.
- source_word: רַגְלָי
  choice: mes pieds
  rationale: La forme avec suffixe de première personne renvoie naturellement aux deux pieds.
- source_word: יִשְׁמֹר
  choice: surveille
  rationale: שׁמר peut signifier garder ou surveiller. Dans ce contexte d’immobilisation et d’examen contraignant, « surveille » exprime une observation étroite sans suggérer une protection bienveillante.
- source_word: כָּל
  choice: tous
  rationale: Ce quantificateur porte sur l’ensemble des sentiers du locuteur.
- source_word: אָרְחֹתָי
  choice: mes sentiers
  rationale: אֹרַח désigne un sentier ou un chemin, souvent au sens figuré de conduite. « Sentiers » préserve la métaphore spatiale du texte.
theological_decisions:
- issue: La surveillance divine du second membre est-elle punitive ou protectrice ?
  choice: « il surveille tous mes sentiers », évoquant ici un examen contraignant
  alternative: « il garde tous mes sentiers », qui peut évoquer une protection
  rationale: Elihou résume la plainte de Job selon laquelle Dieu l’immobilise et observe tous ses déplacements. Le contexte favorise donc la surveillance, tout en maintenant en note l’autre valeur possible de שׁמר.
translation_notes:
  register: Français moderne, digne et direct. Le parallélisme est conservé ; « entrave » et « sentiers » maintiennent les images concrètes de l’hébreu, tandis que la note préserve l’ambiguïté de שׁמר.
