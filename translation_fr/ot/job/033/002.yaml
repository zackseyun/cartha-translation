  yaml_path: translation/ot/job/033/002.yaml
  text: Look now[a], I have opened my mouth; my tongue speaks in my palate.
translation:
  language: fr
  text: 'Voyez donc[a] : j’ai ouvert la bouche ; ma langue parle dans mon palais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Voici, je vous prie » ; la fin du verset peut aussi se rendre : « ma langue parle dans ma bouche. » L’expression hébraïque est très concrète et quelque peu inhabituelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Cette interjection attire l’attention sur ce qui suit. « Voici » conserve sa force déictique dans un registre français actuel et digne.
- source_word: נָא
  choice: donc
  rationale: La particule renforce ici l’appel à l’attention plutôt qu’elle n’exprime clairement une demande polie. « Donc » rend cette nuance sans alourdir la phrase.
- source_word: פָּתַחְתִּי פִי
  choice: j’ai ouvert la bouche
  rationale: La traduction conserve l’expression corporelle et poétique par laquelle l’hébreu annonce la prise de parole, ainsi que l’aspect accompli de la forme verbale.
- source_word: דִּבְּרָה
  choice: parle
  rationale: La forme verbale a pour sujet « ma langue ». Le présent français convient à la prise de parole en cours et préserve le parallélisme vivant, sans ajouter l’idée de « commencer » absente du verbe.
- source_word: לְשׁוֹנִי
  choice: ma langue
  rationale: Le terme est gardé littéralement comme organe de la parole, en parallèle avec « la bouche ».
- source_word: בְחִכִּי
  choice: dans mon palais
  rationale: חֵךְ désigne précisément le palais, et la préposition בְ est rendue par « dans ». La formulation volontairement concrète conserve le caractère vif et quelque peu inhabituel de l’hébreu.
