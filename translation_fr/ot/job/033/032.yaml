source:
  edition: WLC
  text: אִם יֵשׁ מִלִּ֥ין הֲשִׁיבֵ֑/נִי דַּ֝בֵּ֗ר כִּֽי חָפַ֥צְתִּי צַדְּקֶֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/032.yaml
  text: If you have words[a], answer me; speak, for I desire to justify you.
translation:
  language: fr
  text: Si tu as quelque chose à dire, réponds-moi ; parle, car je désire te donner raison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « te justifier » ou « reconnaître que tu as raison ».'
    reason: Alternative lexicale pour צַדְּקֶךָ, dont le sens contextuel est de déclarer quelqu’un dans son droit ou de reconnaître le bien-fondé de sa position.
lexical_decisions:
- source_word: אִם יֵשׁ מִלִּין
  choice: Si tu as quelque chose à dire
  rationale: L’expression existentielle signifie idiomatiquement que Job peut encore présenter des paroles ou des arguments. Cette formulation est plus naturelle en français que « s’il y a des paroles », sans restreindre le sens à une argumentation formelle.
- source_word: הֲשִׁיבֵנִי
  choice: réponds-moi
  rationale: L’impératif factitif de שוב prend ici le sens courant de répondre ou répliquer.
- source_word: דַּבֵּר
  choice: parle
  rationale: L’impératif direct prolonge l’invitation faite à Job de s’exprimer.
- source_word: כִּי
  choice: car
  rationale: La particule introduit la raison pour laquelle Élihou invite Job à parler.
- source_word: חָפַצְתִּי
  choice: je désire
  rationale: Le verbe exprime une volonté sincère ou un souhait marqué ; « je désire » en conserve la force et la dignité.
- source_word: צַדְּקֶךָ
  choice: te donner raison
  rationale: Dans ce contexte, la forme issue de צדק signifie reconnaître ou montrer que Job est dans son droit. « Te donner raison » est idiomatique et évite de faire entendre ici une doctrine technique de la justification.
theological_decisions:
- issue: Portée de צַדְּקֶךָ
  choice: te donner raison
  alternative: te justifier ; reconnaître que tu as raison
  rationale: Élihou affirme souhaiter pouvoir reconnaître le bien-fondé de la position de Job s’il répond. Le texte ne formule pas directement une doctrine de la justification devant Dieu ; la note conserve néanmoins les rendus plus formels possibles.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme des deux impératifs est conservé, tandis que l’idiome « avoir quelque chose à dire » rend naturellement l’expression hébraïque.
