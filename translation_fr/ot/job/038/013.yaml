  text: that it might take hold of the edges of the earth[a], and the wicked be shaken out of it[b],
translation:
  language: fr
  text: pour qu’elle saisisse les extrémités de la terre[a] et que les méchants soient secoués hors d’elle[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les coins de la terre ». L’hébreu dit littéralement « les ailes de la terre », image poétique désignant ses bords ou ses extrémités.
    reason: lexical_alternative
  - marker: b
    text: L’image est celle de l’aube qui saisit la terre et en secoue les méchants, comme on secouerait la poussière d’un vêtement.
    reason: cultural_note
lexical_decisions:
- source_word: לֶאֱחֹז
  choice: pour qu’elle saisisse
  rationale: L’infinitif construit précédé de ל exprime ici le but ou le résultat dans la continuité du verset précédent. « Saisir » conserve l’image concrète du verbe אחז et convient à l’aube personnifiée.
- source_word: בְּכַנְפוֹת
  choice: les extrémités
  rationale: כָּנָף signifie littéralement « aile », mais, associé à la terre, désigne poétiquement ses bords ou ses extrémités. La préposition ב introduit ce qui est saisi.
- source_word: הָאָרֶץ
  choice: de la terre
  rationale: Dans ce contexte cosmique du discours de YHWH sur la création et l’aube, « la terre » convient mieux que « le pays ».
- source_word: וְיִנָּעֲרוּ
  choice: et que … soient secoués
  rationale: Le niphal de נער exprime le fait d’être chassé ou détaché par secouement. Cette formulation maintient l’image sans ajouter dans le texte une direction que le français peut laisser à « en ».
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif substantivé désigne les personnes méchantes. « Les méchants » est concis, courant dans le registre biblique français et préserve la catégorie morale.
- source_word: מִמֶּנָּה
  choice: en
  rationale: Le suffixe féminin singulier renvoie à la terre. Le pronom « en » rend naturellement « hors d’elle / loin d’elle » avec le verbe « secouer ».
