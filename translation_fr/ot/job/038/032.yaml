  text: Can you bring out the Mazzaroth in its season[b][a], or guide Ayish along with her children?
translation:
  language: fr
  text: Peux-tu faire paraître les Mazzaroth en leur saison[a], ou guider Ayish avec ses enfants[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mazzaroth est un terme astronomique hébreu rare qui désigne peut-être les constellations ou les signes du zodiaque.
    reason: lexical_alternative
  - marker: b
    text: Ayish est le nom hébreu d’un astre ou d’une constellation. Certaines traductions anciennes l’identifient à Arcturus ; beaucoup y voient l’Ourse. Ses « enfants » désigneraient alors les étoiles qui l’accompagnent.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֹצִיא
  choice: Peux-tu faire paraître
  rationale: 'Le hiphil de יצא exprime ici la causation : faire sortir ou faire apparaître les astres. « Faire paraître » est naturel dans le contexte astronomique et conserve cette valeur causative.'
- source_word: מַזָּרוֹת
  choice: les Mazzaroth
  rationale: Ce terme astronomique rare demeure d'interprétation incertaine. La translittération évite de l'identifier abusivement aux constellations ou au zodiaque.
- source_word: בְּעִתּוֹ
  choice: en leur saison
  rationale: L'expression désigne le temps approprié ou fixé de leur apparition. Le singulier hébreu renvoie au collectif Mazzaroth ; le français emploie naturellement le pluriel avec la translittération comprise comme un ensemble.
- source_word: וְעַיִשׁ
  choice: Ayish
  rationale: Le nom de cet astre ou de cette constellation est incertain. Sa translittération préserve cette incertitude plutôt que d'imposer « Arcturus » ou « l'Ourse ».
- source_word: עַל־בָּנֶיהָ
  choice: avec ses petits
  rationale: L'hébreu dit littéralement « avec/sur ses fils ». « Ses petits » conserve l'image familiale liée à une constellation féminine et convient à l'identification possible avec l'Ourse et ses étoiles associées.
- source_word: תַנְחֵם
  choice: guider
  rationale: Le hiphil de נחה signifie conduire ou guider. « Guider » rend naturellement l'image du déplacement dirigé de la constellation dans le ciel.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Les deux noms astronomiques incertains sont translittérés afin de préserver l'opacité lexicale de l'hébreu ; les principales identifications proposées sont indiquées en notes.
