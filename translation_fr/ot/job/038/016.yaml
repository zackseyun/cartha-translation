  text: הֲ֭/בָאתָ עַד נִבְכֵי יָ֑ם וּ/בְ/חֵ֥קֶר תְּ֝ה֗וֹם הִתְהַלָּֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/016.yaml
  text: Have you come to the springs of the sea[b][a], or walked in the recesses of the deep?
translation:
  language: fr
  text: Es-tu parvenu jusqu’aux sources de la mer[a], et as-tu parcouru les recoins de l’abîme[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les profondeurs cachées de la mer ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les profondeurs de l’abîme » ou « les lieux les plus reculés de l’abîme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבָאתָ עַד
  choice: Es-tu parvenu jusqu’aux
  rationale: Le qal parfait interrogatif de בוא, avec עַד, exprime l’arrivée jusqu’à une destination. « Es-tu parvenu jusqu’aux » rend naturellement en français le défi direct adressé à Job.
- source_word: נִבְכֵי
  choice: sources
  rationale: Le terme peut désigner les lieux cachés d’où jaillissent les eaux, donc les sources de la mer. Cette lecture concrète convient au contexte, tout en laissant en note l’autre possibilité, « profondeurs ».
- source_word: יָם
  choice: la mer
  rationale: Nom commun désignant ici la mer, sans indication qu’il s’agisse d’un nom propre.
- source_word: וּבְחֵקֶר
  choice: les profondeurs insondables
  rationale: חֵקֶר évoque ce qui est exploré ou poussé jusqu’à sa limite, et, dans ce contexte spatial, les régions reculées et inaccessibles. « Profondeurs insondables » conserve à la fois l’idée de lieu et celle d’impossibilité à sonder.
- source_word: תְּהוֹם
  choice: l’abîme
  rationale: תְּהוֹם désigne les eaux profondes ou l’abîme primordial. « L’abîme » garde la force poétique et la résonance cosmologique du terme sans imposer une interprétation doctrinale.
- source_word: הִתְהַלָּכְתָּ
  choice: As-tu parcouru
  rationale: Le hitpael de הלך exprime le fait d’aller et venir ou de circuler. « Parcouru » rend mieux cette nuance que le simple « marché » dans un français naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. Les deux questions parallèles sont maintenues. « Abîme » préserve l’imagerie cosmologique de תְּהוֹם, tandis que les notes signalent l’ambiguïté réelle de נִבְכֵי et de חֵקֶר.
