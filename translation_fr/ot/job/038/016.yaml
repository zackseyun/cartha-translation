- from: Es-tu parvenu jusqu’aux sources de la mer[a] ? As-tu parcouru les profondeurs insondables de l’abîme[b] ?
  to: Es-tu parvenu jusqu’aux sources de la mer[a], et as-tu parcouru les recoins de l’abîme[b] ?
