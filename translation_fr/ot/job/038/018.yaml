  text: הִ֭תְבֹּנַנְתָּ עַד רַחֲבֵי אָ֑רֶץ הַ֝גֵּ֗ד אִם יָדַ֥עְתָּ כֻלָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/018.yaml
  text: Have you comprehended the expanse of the earth? Tell me, if you know it all.
translation:
  language: fr
  text: As-tu saisi l’étendue de la terre ? Dis-moi, si tu la connais tout entière.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְבֹּנַנְתָּ
  choice: As-tu saisi
  rationale: Le hitpael de בין exprime ici le fait de discerner ou comprendre pleinement; « saisi » est naturel en français et convient à la portée rhétorique de la question.
- source_word: עַד רַחֲבֵי אָרֶץ
  choice: toute l’étendue de la terre
  rationale: רַחֲבֵי désigne les vastes dimensions ou étendues de la terre; עַד suggère que la compréhension en atteint les limites. « Toute » rend cette idée sans transformer l’expression en mesure technique.
- source_word: הַגֵּד
  choice: Dis-le
  rationale: L’impératif signifie « déclare, raconte, fais savoir ». Le pronom « le » donne une formulation française idiomatique en renvoyant à la réponse demandée.
- source_word: כֻּלָּהּ
  choice: tout cela
  rationale: Le suffixe féminin singulier renvoie probablement à la terre ou à son étendue considérée dans sa totalité. « Tout cela » conserve une certaine souplesse référentielle et évite le peu naturel « si tu la connais tout entière » après l’impératif.
theological_decisions:
- issue: Portée de la connaissance revendiquée
  choice: si tu sais tout cela
  alternative: si tu la connais tout entière
  rationale: Le texte met Job au défi quant à sa connaissance totale de l’étendue terrestre. La traduction conserve cette exigence de totalité sans ajouter une affirmation cosmologique ou doctrinale étrangère au verset.
translation_notes:
  register: Tutoiement cohérent avec l’adresse directe de Dieu à Job. Registre actuel et digne; la brièveté et la force interrogative de l’hébreu sont préservées.
