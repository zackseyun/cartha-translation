  yaml_path: translation/ot/job/038/026.yaml
  text: to make it rain on a land where no man is[a], on a wilderness in which there is no human,
translation:
  language: fr
  text: pour faire pleuvoir sur une terre où il n’y a pas d’homme[a], sur un désert où il n’y a pas d’être humain,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici deux termes proches mais distincts : אִישׁ (« homme ») et אָדָם (« être humain, humanité »). On pourrait aussi traduire : « où il n’y a personne… où il n’y a aucun humain », ou employer « homme » dans les deux membres.'
    reason: Signaler la distinction lexicale hébraïque ainsi que des rendus français possibles sans ajouter l’idée d’habitation ou de résidence.
lexical_decisions:
- source_word: לְהַמְטִיר
  choice: pour faire pleuvoir
  rationale: L’infinitif construit au hifil exprime la causation. « Faire pleuvoir » est naturel en français et conserve cette valeur causative.
- source_word: עַל
  choice: sur
  rationale: La préposition désigne ici l’étendue qui reçoit la pluie ; « sur » est l’équivalent français le plus direct.
- source_word: אֶרֶץ
  choice: une terre
  rationale: Dans ce contexte, le mot désigne une étendue de terre plutôt que la planète entière. L’article indéfini convient à l’absence d’article en hébreu.
- source_word: לֹא אִישׁ
  choice: où il n’y a pas d’homme
  rationale: אִישׁ désigne ici un homme au singulier avec une portée représentative. Cette formulation française rend naturellement la construction existentielle sans effacer le contraste lexical avec אָדָם.
- source_word: מִדְבָּר
  choice: un désert
  rationale: Le terme désigne une région inculte et inhabitée. « Désert » est idiomatique en français et n’implique pas nécessairement une étendue sablonneuse.
- source_word: לֹא אָדָם בּוֹ
  choice: où ne vit aucun être humain
  rationale: אָדָם renvoie ici génériquement à l’humanité. « Être humain » préserve cette portée et le distingue de אִישׁ ; « ne vit » exprime naturellement l’absence de présence humaine indiquée par בּוֹ.
theological_decisions:
- issue: Rendu de אָדָם dans un contexte générique
  choice: être humain
  alternative: homme ; humanité
  rationale: Le contexte parle de l’absence de toute présence humaine. « Être humain » conserve la portée générique de אָדָם tout en maintenant la variation poétique avec אִישׁ, rendu par « homme ».
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « sur » conserve le parallélisme, tandis que l’inversion « où ne vit aucun être humain » donne au second membre une cadence naturelle.
