source:
  edition: WLC
  text: אֵיפֹ֣ה הָ֭יִיתָ בְּ/יָסְדִ/י אָ֑רֶץ הַ֝גֵּ֗ד אִם יָדַ֥עְתָּ בִינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/004.yaml
  text: Where were you when I founded the earth? Tell me[a], if you know understanding.
translation:
  language: fr
  text: Où étais-tu quand j’ai fondé la terre[a] ? Dis-le, si tu as de l’intelligence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand j’ai posé les fondations de la terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיפֹה
  choice: Où
  rationale: L’adverbe interrogatif porte directement sur le lieu. « Où » restitue avec naturel la force du défi divin.
- source_word: הָיִיתָ
  choice: étais-tu
  rationale: Le qal accompli, deuxième personne masculine singulier de היה, renvoie ici à une situation passée; l’imparfait français convient à la question circonstancielle.
- source_word: בְּיָסְדִי
  choice: quand j’ai fondé
  rationale: La préposition ב devant l’infinitif construit avec suffixe de première personne exprime le temps. « Fondé » conserve de façon concise la métaphore architecturale de יסד.
- source_word: אָרֶץ
  choice: la terre
  rationale: Le contexte cosmique de la création désigne la terre, non un territoire particulier.
- source_word: הַגֵּד
  choice: Dis-le
  rationale: L’impératif de נגד appelle Job à énoncer la réponse. Le pronom « le », implicite dans le contexte hébreu, est nécessaire à une formulation française naturelle.
- source_word: אִם
  choice: si
  rationale: La conjonction introduit ici une condition à valeur de défi rhétorique.
- source_word: יָדַעְתָּ בִינָה
  choice: tu as de l’intelligence
  rationale: L’expression littérale « tu connais l’intelligence » serait peu naturelle en français. Cette formulation idiomatique conserve l’idée de posséder le discernement requis pour répondre.
theological_decisions:
- issue: Métaphore architecturale de la création dans la parole divine
  choice: « quand j’ai fondé la terre »
  alternative: « quand j’ai posé les fondations de la terre »
  rationale: « Fondé » maintient l’image explicite de יסד et l’affirmation que Dieu a établi la terre, sans développer la métaphore au-delà du texte.
- issue: Portée rhétorique de la connaissance attribuée à Job
  choice: « si tu as de l’intelligence »
  alternative: « si tu connais l’intelligence »
  rationale: Le français idiomatique exprime ici une capacité de discernement. La condition demeure un défi rhétorique, sans préciser davantage la nature ou les limites de cette intelligence.
translation_notes:
  register: Français moderne, digne et direct. L’inversion interrogative et l’impératif bref préservent la solennité ainsi que la vigueur du défi adressé à Job.
