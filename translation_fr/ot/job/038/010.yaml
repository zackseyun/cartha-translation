source:
  edition: WLC
  text: וָ/אֶשְׁבֹּ֣ר עָלָ֣י/ו חֻקִּ֑/י וָֽ֝/אָשִׂ֗ים בְּרִ֣יחַ וּ/דְלָתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/010.yaml
  text: when I prescribed my boundary for it and set bars and doors,[a]
translation:
  language: fr
  text: quand je lui ai fixé ma limite et mis en place verrous et portes,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand j’ai fixé pour elle mon décret »; l’hébreu emploie littéralement un verbe qui signifie habituellement « briser », mais il semble désigner ici l’établissement de la limite de la mer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁבֹּר
  choice: j’ai fixé
  rationale: Le sens habituel de שׁבר, « briser », convient difficilement ici. Le contexte décrit l’établissement d’une limite imposée à la mer; « fixer » rend naturellement ce sens sans effacer la difficulté lexicale.
- source_word: עָלָיו
  choice: lui
  rationale: Le suffixe masculin singulier renvoie à la mer du contexte précédent. En français, « lui fixer » exprime naturellement l’idée d’imposer une limite à celle-ci.
- source_word: חֻקִּי
  choice: ma limite
  rationale: חֹק peut désigner un décret, une prescription ou une limite fixée. Ici, la maîtrise de la mer favorise le sens concret de « limite », tout en laissant entendre qu’elle résulte d’une décision divine.
- source_word: וָאָשִׂים
  choice: mis en place
  rationale: שׂים signifie « mettre, placer ». « Mis en place » convient à l’installation imagée des dispositifs qui retiennent la mer.
- source_word: בְּרִיחַ
  choice: verrous
  rationale: Le terme désigne une barre ou un verrou servant à fermer une entrée. Le pluriel français s’accorde naturellement avec « portes » et présente l’ensemble du dispositif de fermeture.
- source_word: וּדְלָתָיִם
  choice: portes
  rationale: La forme duelle évoque deux battants ou une paire de portes. « Portes » conserve l’image architecturale dans un français naturel.
theological_decisions:
- issue: Représentation anthropomorphique de la domination de Dieu sur la mer
  choice: Conserver l’image concrète de Dieu imposant une limite à la mer au moyen de verrous et de portes.
  alternative: Réduire l’image à une affirmation abstraite de la souveraineté divine sur la nature.
  rationale: Le verset exprime la souveraineté divine par une image architecturale vive. La conserver respecte la poésie hébraïque sans systématiser davantage son propos.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe s’inscrit dans la phrase commencée aux versets précédents. « Verrous et portes » maintient l’image concrète sans lourdeur; « ma limite » garde la tension entre frontière matérielle et décret divin.
