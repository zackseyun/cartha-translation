  text: when the dust hardens into a mass[a], and the clods stick together?
translation:
  language: fr
  text: 'quand la poussière se durcit en une masse[a]

    et que les mottes de terre adhèrent les unes aux autres ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand la poussière est coulée en une masse » ou « quand la poussière devient compacte, comme une matière coulée ». L’hébreu emploie une image liée au fait de verser ou de couler pour décrire un sol qui se compacte.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶקֶת
  choice: quand … se durcit
  rationale: La forme introduit ici une proposition temporelle. Le verbe évoque le fait de verser ou de couler, mais, appliqué à la poussière et en parallèle avec les mottes qui adhèrent, il décrit naturellement le sol qui se compacte et durcit.
- source_word: עָפָר
  choice: la poussière
  rationale: עָפָר désigne couramment la poussière ou la terre meuble. « La poussière » conserve l’image générique du matériau du sol.
- source_word: לַמּוּצָק
  choice: en une masse
  rationale: Le terme issu de יצק peut désigner ce qui est versé, coulé ou solidifié. « En une masse » exprime clairement le résultat dans ce contexte sans imposer trop fortement une image métallurgique.
- source_word: וּרְגָבִים
  choice: et les mottes de terre
  rationale: רְגָבִים désigne des mottes ou des blocs de terre. Cette formulation est précise et naturelle en français moderne.
- source_word: יְדֻבָּקוּ
  choice: se collent les unes aux autres
  rationale: La forme exprime l’adhérence des mottes entre elles. Cette traduction garde l’image physique et le sens passif-résultatif dans un français courant.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le parallélisme concret entre la poussière compactée et les mottes qui adhèrent est conservé, ainsi que l’ambiguïté de l’image hébraïque de la coulée dans la note.
