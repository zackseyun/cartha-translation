  text: כִּי יָשֹׁ֥חוּ בַ/מְּעוֹנ֑וֹת יֵשְׁב֖וּ בַ/סֻּכָּ֣ה לְמוֹ אָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/040.yaml
  text: when they crouch in their dens and lie in wait in the thicket?[a]
translation:
  language: fr
  text: quand ils se tapissent dans leurs tanières et se tiennent à l’affût dans le fourré ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous le couvert » ou « dans l’abri » pour « dans le fourré ». Ici, le mot hébreu סֻכָּה désigne un endroit couvert propice à l’affût, et non une cabane construite au sens de la fête des Cabanes.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: quand
  rationale: Dans la suite de la question commencée au verset précédent, la conjonction introduit naturellement la circonstance temporelle où les lions attendent leur proie.
- source_word: יָשֹׁחוּ
  choice: ils se tapissent
  rationale: Le verbe décrit ici des animaux qui s’abaissent et restent dissimulés en posture de chasse. « Se tapissent » est naturel en français et convient au contexte.
- source_word: בַמְּעוֹנוֹת
  choice: dans leurs tanières
  rationale: Le nom désigne des demeures ou repaires; dans le contexte des lions, « tanières » exprime clairement le sens. Le possessif est explicité naturellement d’après le contexte.
- source_word: יֵשְׁבוּ … לְמוֹ אָרֶב
  choice: se tiennent à l’affût
  rationale: Littéralement, ils « restent/sont assis pour l’embuscade ». L’expression française « se tenir à l’affût » restitue idiomatiquement la position maintenue en vue d’une attaque.
- source_word: בַסֻּכָּה
  choice: dans le fourré
  rationale: סֻכָּה désigne ici un couvert naturel servant de cachette, non une cabane de fête. « Fourré » convient au cadre animalier tout en gardant l’idée d’un abri végétal.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme entre la posture abaissée dans les tanières et l’attente dissimulée dans le fourré est conservé; la collocation hébraïque יֵשְׁבוּ … לְמוֹ אָרֶב est rendue par l’idiome français « se tiennent à l’affût ».
