  verdict: approve
  source_fidelity: Le texte rend fidèlement la circonstance introduite par כִּי (« quand »), la posture basse des lions dans leurs repaires (« se tapissent dans leurs tanières »), puis leur attente en embuscade dans un lieu couvert. La valeur idiomatique de יֵשְׁבוּ … לְמוֹ אָרֶב est bien conservée par « se tiennent à l’affût » sans effacer le contexte de chasse.
  naturalness: Le français est moderne, fluide et adapté au registre poétique soutenu de Job. « Se tapissent », « tanières », « se tiennent à l’affût » et « fourré » forment un ensemble naturel et intelligible dans le français international.
  terminology: « Tanières » convient au contexte immédiat des lionnes/lions (vv. 39–40). « Fourré » transmet de façon naturelle le couvert végétal ou la cachette exprimé par סֻכָּה, sans lui attribuer indûment le sens cultuel de « cabane ». La note explique utilement cette distinction et ses alternatives lexicales.
