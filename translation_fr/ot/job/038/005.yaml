  yaml_path: translation/ot/job/038/005.yaml
  text: Who set its measurements[a], if you know, or who stretched a line upon it?
translation:
  language: fr
  text: Qui en a fixé les dimensions[a] — si tu le sais —, ou qui a tendu le cordeau sur elle ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les mesures ».'
    reason: Variante lexicale pour le terme rare מְמַדֶּיהָ.
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Pronom interrogatif ouvrant la question rhétorique divine.
- source_word: שָׂם
  choice: a fixé
  rationale: Le qal de שׂים signifie ici établir ou déterminer; « fixer » convient à l’image architecturale des dimensions de la terre.
- source_word: מְמַדֶּיהָ
  choice: en a fixé les dimensions
  rationale: Le nom au pluriel avec suffixe féminin renvoie à la terre du contexte. « Les dimensions » exprime naturellement son étendue mesurée; le pronom « en » évite une répétition lourde.
- source_word: כִּי תֵדָע
  choice: si tu le sais
  rationale: Cette formulation conserve la valeur conditionnelle possible de כִּי dans une incise rhétorique, sans imposer la nuance plus interprétative de « bien sûr, tu le sais ».
- source_word: אוֹ
  choice: ou
  rationale: Conjonction disjonctive reliant les deux questions parallèles.
- source_word: נָטָה
  choice: a tendu
  rationale: Dans un contexte de construction, le verbe décrit l’action de tendre un cordeau.
- source_word: עָלֶיהָ
  choice: sur elle
  rationale: Le suffixe féminin reprend la terre et préserve l’image spatiale de l’hébreu.
- source_word: קָּו
  choice: le cordeau
  rationale: Dans l’image architecturale, קו désigne une ligne ou corde servant à mesurer. « Cordeau » est précis, naturel et évite l’ambiguïté d’une simple ligne.
theological_decisions:
- issue: Force rhétorique de כִּי תֵדָע
  choice: si tu le sais
  alternative: puisque tu le sais / tu le sais certainement
  rationale: Le contexte permet une ironie, mais la traduction retenue conserve l’ambiguïté grammaticale et laisse le lecteur percevoir la tension rhétorique sans l’expliciter davantage.
translation_notes:
  register: Français moderne, digne et direct. L’image de la construction est maintenue par « fixer les dimensions » et « tendre le cordeau »; les tirets signalent clairement l’incise sans alourdir la question.
