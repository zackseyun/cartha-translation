  text: הַֽ֭/תְקַשֵּׁר מַעֲדַנּ֣וֹת כִּימָ֑ה אֽוֹ מֹשְׁכ֖וֹת כְּסִ֣יל תְּפַתֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/031.yaml
  text: Can you bind the chains of the Pleiades[c][b][a], or loosen the cords of Orion?
translation:
  language: fr
  text: Peux-tu resserrer les liens des Pléiades[a], ou délier les cordes d’Orion[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu rare peut aussi être rendu par « attaches », « bandes » ou « chaînes » ; il évoque probablement les liens qui unissent les Pléiades.
    reason: lexical_alternative
  - marker: b
    text: Le nom hébreu désigne vraisemblablement ici la constellation d’Orion ; comme nom commun, il peut aussi signifier « insensé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְקַשֵּׁר
  choice: Peux-tu nouer
  rationale: L’interrogation avec le piel à la deuxième personne introduit une question rhétorique sur l’incapacité humaine. « Nouer » convient naturellement à « liens » et répond à « défaire » dans le second membre.
- source_word: מַעֲדַנּוֹת
  choice: les liens
  rationale: Ce nom rare semble désigner des attaches, des liens ou des bandes. « Liens » préserve l’image sans imposer l’idée plus précise de chaînes métalliques.
- source_word: כִּימָה
  choice: les Pléiades
  rationale: Dans ce contexte astronomique, ce nom désigne traditionnellement l’amas stellaire des Pléiades.
- source_word: מֹשְׁכוֹת
  choice: les cordes
  rationale: Le terme évoque ce qui sert à tirer ou à retenir. « Cordes » est concret, naturel et maintient le parallélisme avec les liens du premier membre.
- source_word: כְּסִיל
  choice: Orion
  rationale: Le parallélisme avec les Pléiades et le contexte céleste favorisent nettement l’identification à la constellation d’Orion, plutôt que le sens commun « insensé ».
- source_word: תְּפַתֵּחַ
  choice: défaire
  rationale: Le verbe signifie littéralement « ouvrir », mais appliqué à des cordes il prend naturellement le sens de les défaire ou de les relâcher. « Défaire » forme une opposition claire avec « nouer ».
