source:
  edition: WLC
  text: הֲ/נִגְל֣וּ לְ֭/ךָ שַׁעֲרֵי מָ֑וֶת וְ/שַׁעֲרֵ֖י צַלְמָ֣וֶת תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/017.yaml
  text: Have the gates of death been revealed to you[a], or have you seen the gates of deep darkness?
translation:
  language: fr
  text: Les portes de la mort t’ont-elles été dévoilées ? As-tu vu les portes des ténèbres profondes[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’ombre de la mort ». Le terme hébreu peut aussi désigner plus généralement une obscurité profonde ou lugubre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִגְלוּ לְךָ
  choice: t’ont-elles été dévoilées
  rationale: La particule interrogative avec le nifal accompli de גלה forme une question rhétorique. Le passif français conserve la voix hébraïque, et « dévoilées » exprime naturellement l’idée de rendre accessible à la connaissance ou à la vue.
- source_word: שַׁעֲרֵי מָוֶת
  choice: les portes de la mort
  rationale: Cette formulation reproduit directement la chaîne construite et maintient l’image concrète de l’accès au domaine de la mort.
- source_word: וְשַׁעֲרֵי
  choice: As-tu vu les portes
  rationale: Le waw coordonne les deux membres parallèles. Deux questions successives sont naturelles en français et préservent la force rhétorique sans devoir rendre mécaniquement la conjonction.
- source_word: צַלְמָוֶת
  choice: ténèbres profondes
  rationale: Le terme peut désigner une obscurité très dense ou lugubre. Ce choix correspond bien à son emploi contextuel sans imposer l’analyse traditionnelle « ombre de la mort », conservée en note.
- source_word: תִּרְאֶה
  choice: As-tu vu
  rationale: Dans cette série de questions divines portant sur l’expérience de Job, le passé composé français rend naturellement l’interrogation et son parallélisme avec le premier membre.
theological_decisions:
- issue: Rapport entre צַלְמָוֶת et la mort
  choice: ténèbres profondes
  alternative: ombre de la mort
  rationale: Le contexte évoque le domaine de la mort, mais le mot lui-même peut plus largement désigner une obscurité profonde. La traduction principale garde cette amplitude sémantique, tandis que la note signale la lecture traditionnelle.
translation_notes:
  register: Français moderne, digne et poétique, avec maintien de l’image concrète des portes et de la structure rhétorique en deux questions. Le tutoiement correspond à l’adresse directe singulière de Dieu à Job.
