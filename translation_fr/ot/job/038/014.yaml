translation:
  language: fr
  text: Elle se transforme comme l’argile sous un sceau[a], et ils se présentent comme un vêtement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Elle se retourne comme l’argile sous un sceau. » Le verbe hébreu peut aussi être rendu plus littéralement par « se retourner » ou « être transformée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et ils se tiennent/se présentent comme un vêtement ». Le sujet du verbe pluriel n’est pas exprimé ; il désigne probablement les formes ou les reliefs de la terre que l’aube rend visibles.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: תִּתְהַפֵּךְ
  choice: elle se transforme
  rationale: Le hitpael de הפך exprime ici un changement de forme ou d’aspect. Le féminin renvoie naturellement à la terre mentionnée dans le contexte précédent, sans rendre le sujet explicite dans le verset.
- source_word: כְּחֹמֶר חוֹתָם
  choice: comme l’argile sous le sceau
  rationale: L’expression est elliptique et évoque l’argile qui prend forme sous l’empreinte d’un sceau. Cette formulation française conserve l’image tout en restant claire.
- source_word: וְיִתְיַצְּבוּ
  choice: ses reliefs se dessinent
  rationale: Le verbe est au pluriel, mais son sujet n’est pas exprimé. Dans le contexte de l’aurore, il désigne vraisemblablement les formes ou reliefs de la terre qui deviennent distincts; la traduction rend cette idée sans la présenter comme certaine, grâce à une note.
- source_word: כְּמוֹ לְבוּשׁ
  choice: comme ceux d’un vêtement
  rationale: לְבוּשׁ désigne un vêtement. Le pronom « ceux » rattache naturellement la comparaison aux reliefs, évoquant les plis ou contours d’un vêtement.
theological_decisions:
- issue: Sujet implicite du verbe féminin singulier
  choice: « Elle » renvoie à la terre du contexte
  alternative: Rendre impersonnellement « Cela se transforme »
  rationale: La terre est le référent contextuel le plus naturel, mais la traduction évite de l’ajouter lexicalement en reprenant simplement le féminin.
- issue: Sujet non exprimé du verbe pluriel
  choice: Expliciter « ses reliefs » dans le texte et signaler l’incertitude en note
  alternative: Conserver « ils se tiennent » ou « ils paraissent » sans antécédent explicite
  rationale: Le français exige ici un référent compréhensible. Les reliefs ou formes de la terre conviennent au contexte, mais l’hébreu ne les nomme pas; la note préserve cette ambiguïté.
translation_notes:
  register: Français moderne, poétique et digne. « Se dessinent » communique l’apparition progressive des contours à l’aube; les notes conservent le caractère elliptique et l’ambiguïté grammaticale de l’hébreu.
