  text: בְּ/שׂוּמִ֣/י עָנָ֣ן לְבֻשׁ֑/וֹ וַ֝/עֲרָפֶ֗ל חֲתֻלָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/009.yaml
  text: when I made a cloud its garment[a], and thick darkness its swaddling band,
translation:
  language: fr
  text: 'quand j’ai fait de la nuée son vêtement,

    et de l’obscurité épaisse ses langes[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son bandeau d’emmaillotement ». L’hébreu évoque un nouveau-né que l’on enveloppe, dans le prolongement de la métaphore de la naissance de la mer.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמִי
  choice: quand j’ai fait de
  rationale: La préposition בְּ avec l’infinitif construit et le suffixe de première personne a ici une valeur temporelle. « Quand j’ai fait de » est naturel en français et introduit les deux images vestimentaires.
- source_word: עָנָן
  choice: la nuée
  rationale: « Nuée » exprime le nuage comme masse enveloppante et convient au registre poétique, sans être difficile à comprendre.
- source_word: לְבֻשׁוֹ
  choice: son vêtement
  rationale: לְבוּשׁ désigne un vêtement. Le suffixe masculin singulier renvoie à la mer dans le contexte.
- source_word: וַעֲרָפֶל
  choice: et de l’obscurité épaisse
  rationale: עֲרָפֶל évoque une obscurité dense, souvent atmosphérique. Cette traduction conserve sa force et le parallélisme avec la nuée.
- source_word: חֲתֻלָּתוֹ
  choice: ses langes
  rationale: Le terme appartient au champ lexical de l’emmaillotement. « Langes » maintient clairement l’image de la mer nouveau-née, tout en restant idiomatique en français.
theological_decisions:
- issue: Maintien de la métaphore de la naissance appliquée à la mer
  choice: ses langes
  alternative: son enveloppe
  rationale: Le contexte immédiat présente la mer comme sortant d’un sein. La traduction conserve donc l’image néonatale explicite au lieu de la généraliser.
translation_notes:
  register: Français moderne, poétique et digne. « Nuée » et « langes » préservent les images concrètes et le parallélisme du vers hébreu sans alourdir la syntaxe.
