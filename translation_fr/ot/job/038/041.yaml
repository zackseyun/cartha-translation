  variant: modern international French
source:
  edition: WLC
  text: מִ֤י יָכִ֥ין לָ/עֹרֵ֗ב צֵ֫יד֥/וֹ כִּֽי ילד/ו אֶל אֵ֣ל יְשַׁוֵּ֑עוּ יִ֝תְע֗וּ לִ/בְלִי אֹֽכֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/041.yaml
  text: Who prepares its prey for the raven when its young cry out to God and wander about for lack of food?[a][b][c]
translation:
  language: fr
  text: Qui prépare au corbeau sa nourriture quand ses petits crient vers Dieu et errent faute de nourriture ?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « procure au corbeau de quoi manger ». Le verbe hébreu signifie « préparer », « mettre à disposition » ou « procurer », et le nom traduit par « nourriture » peut aussi désigner une proie ou du gibier.
    reason: lexical_alternative
  - marker: b
    text: Ou « parce que ses petits crient vers Dieu ». La conjonction peut avoir un sens causal plutôt que temporel.
    reason: lexical_alternative
  - marker: c
    text: Ou « vagabondent » ou « s’égarent ». Le verbe hébreu peut désigner le fait d’errer ou de s’égarer à la recherche de nourriture.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Pronom interrogatif ouvrant une question rhétorique dans le discours de Dieu.
- source_word: יָכִין
  choice: prépare
  rationale: Le hiphil de כון signifie ici mettre à disposition, préparer ou procurer; « prépare » conserve l’image concrète.
- source_word: לָעֹרֵב
  choice: au corbeau
  rationale: La préposition indique le bénéficiaire; le singulier défini a une valeur générique.
- source_word: צֵידוֹ
  choice: sa nourriture
  rationale: ציד peut désigner le gibier, la proie ou la nourriture obtenue par la chasse. « Sa nourriture » rend le suffixe pronominal et convient naturellement à la provision destinée au corbeau, tout en évitant l’étrangeté de « sa proie » préparée pour lui.
- source_word: כִּי
  choice: quand
  rationale: La conjonction introduit ici naturellement la circonstance dans laquelle le besoin se manifeste, sans exclure une lecture causale.
- source_word: יַלְדָו
  choice: ses petits
  rationale: Le nom avec suffixe désigne les petits du corbeau; cette formulation est courante en français.
- source_word: אֶל אֵל
  choice: vers Dieu
  rationale: אֵל est ici le nom commun désignant Dieu; « crier vers Dieu » restitue clairement la direction du cri.
- source_word: יְשַׁוֵּעוּ
  choice: crient
  rationale: Le piel de שוע exprime un cri pressant, souvent un appel au secours; le contexte de faim en précise suffisamment la portée.
- source_word: יִתְעוּ
  choice: errent
  rationale: Le qal de תעה peut signifier errer, vagabonder ou s’égarer; « errent » préserve cette amplitude.
- source_word: לִבְלִי אֹכֶל
  choice: faute de nourriture
  rationale: L’expression indique la privation et peut aussi suggérer la cause de leur errance.
theological_decisions: []
