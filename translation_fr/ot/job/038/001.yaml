  text: וַ/יַּֽעַן יְהוָ֣ה אֶת אִ֭יּוֹב מנ ה/סערה וַ/יֹּאמַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/001.yaml
  text: Then Yahweh answered Job out of the whirlwind and said:[a]
translation:
  language: fr
  text: Alors Yahweh répondit à Job du sein de la tempête et dit :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du tourbillon ».
    reason: Alternative lexicale plausible pour סְעָרָה, qui peut désigner une tempête violente ou un tourbillon.
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Le verbe ענה, dans cette forme narrative, signifie couramment « répondre » et relie explicitement la parole de Yahweh aux discours précédents de Job.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: אֶת אִיּוֹב
  choice: à Job
  rationale: En français, le verbe « répondre » se construit naturellement avec la préposition « à » ; le marqueur hébreu de l'objet direct n'est donc pas reproduit formellement.
- source_word: מִן־הַסְּעָרָה
  choice: du milieu de la tempête
  rationale: סְעָרָה désigne une violente tempête ou un tourbillon. « Du milieu de la tempête » exprime naturellement en français la provenance de la voix sans imposer l'image plus précise du tourbillon.
- source_word: וַיֹּאמַר
  choice: et dit
  rationale: Cette formulation conserve la succession narrative et l'introduction formelle du discours direct.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le préserve sans lui substituer un titre.
- issue: Degré de précision de סְעָרָה dans la théophanie
  choice: tempête
  alternative: tourbillon ; bourrasque
  rationale: Le terme hébreu peut désigner une tempête violente ou un tourbillon. Le choix principal reste large, tandis que la note conserve l'autre image plausible.
translation_notes:
  register: Français moderne, digne et accessible. « Alors » marque la reprise narrative ; « du milieu de » est idiomatique dans une scène où une voix se fait entendre depuis la tempête. Le deux-points introduit le discours qui suit.
