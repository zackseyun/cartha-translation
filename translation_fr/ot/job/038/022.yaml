  source_fidelity: 'Le sens central est bien rendu : les deux questions rhétoriques évoquent les lieux de réserve de la neige et de la grêle. Toutefois, « entrepôts de la neige » est moins idiomatique et légèrement trop commercial en français. « Es-tu allé jusqu’aux » traduit de manière sobre בוא אל (« venir/aller jusqu’à ») sans surinterpréter le mouvement comme une entrée effective.'
