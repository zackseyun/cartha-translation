source:
  edition: WLC
  text: הֲ֭/בָאתָ אֶל אֹצְר֣וֹת שָׁ֑לֶג וְ/אֹצְר֖וֹת בָּרָ֣ד תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/022.yaml
  text: Have you entered the storehouses of the snow[a], or have you seen the storehouses of the hail?
translation:
  language: fr
  text: Es-tu allé jusqu’aux réserves de neige[a], ou as-tu vu les réserves de grêle ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les trésors de la neige […] les trésors de la grêle » ; ou « les entrepôts de neige […] les entrepôts de grêle ».
    reason: Alternative lexicale pour אֹצְרוֹת, qui peut désigner des trésors, des réserves ou des lieux où des provisions sont conservées.
lexical_decisions:
- source_word: הֲבָאתָ אֶל
  choice: Es-tu entré dans
  rationale: L’interrogatif הֲ et le parfait de בוא introduisent une question rhétorique. Avec un lieu de stockage, « entrer dans » exprime naturellement en français le mouvement vers l’intérieur suggéré par le contexte, sans alourdir la phrase.
- source_word: אֹצְרוֹת
  choice: entrepôts
  rationale: אֹצָר peut désigner un trésor, une réserve ou un lieu où l’on entrepose quelque chose. « Entrepôts » maintient ici l’image concrète de lieux où les phénomènes météorologiques sont stockés, tandis que « trésors » pourrait évoquer surtout des richesses précieuses.
- source_word: שָׁלֶג
  choice: neige
  rationale: Équivalent français courant du terme météorologique.
- source_word: וְאֹצְרוֹת
  choice: et ... les entrepôts
  rationale: Le וְ hébreu est conservé par « et ». La reprise du verbe français dans « et as-tu vu » rend explicite la structure parallèle déjà présente dans l’hébreu.
- source_word: בָּרָד
  choice: grêle
  rationale: Équivalent français courant du terme météorologique.
- source_word: תִּרְאֶה
  choice: as-tu vu
  rationale: Bien que la forme hébraïque soit un inaccompli, elle forme dans cette question poétique un parallèle avec le parfait précédent. Le passé composé est naturel en français pour interroger Job sur une expérience éventuelle antérieure.
theological_decisions: []
translation_notes:
  register: Français moderne, accessible et digne. La formulation garde l’image poétique concrète de lieux où seraient entreposées la neige et la grêle, ainsi que le parallélisme de la double question rhétorique.
