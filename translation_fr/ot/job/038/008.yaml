  text: וַ/יָּ֣סֶךְ בִּ/דְלָתַ֣יִם יָ֑ם בְּ֝/גִיח֗/וֹ מֵ/רֶ֥חֶם יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/008.yaml
  text: Or who shut in the sea with doors when it burst out from the womb[b][a],
translation:
  language: fr
  text: Ou qui a enfermé la mer derrière des portes, lorsqu’elle a jailli, en sortant du sein maternel[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu personnifie la mer comme un enfant qui jaillit du sein maternel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּסֶךְ
  choice: a enfermé
  rationale: Le verbe exprime ici l’action de contenir ou d’enclore la mer. « Enfermer » est naturel en français et s’accorde avec l’image concrète des portes.
- source_word: בִּדְלָתַיִם
  choice: derrière des portes
  rationale: Le nom duel désigne des portes, probablement à deux battants. Avec « enfermer », « derrière des portes » rend naturellement le moyen et l’image architecturale.
- source_word: יָם
  choice: la mer
  rationale: Même sans article explicite en hébreu, le contexte cosmique désigne la mer comme une réalité connue et déterminée.
- source_word: בְּגִיחוֹ
  choice: lorsqu’elle a jailli
  rationale: Le verbe évoque une sortie vive et puissante. « Jaillir » conserve cette énergie en français courant.
- source_word: מֵרֶחֶם יֵצֵא
  choice: du sein maternel
  rationale: Cette formulation conserve l’image de la naissance. En français, le mouvement de sortie est déjà exprimé par « a jailli » ; répéter « elle est sortie » alourdirait le vers sans ajouter de contenu.
theological_decisions:
- issue: Image poétique de la création de la mer
  choice: Conserver la personnification de la mer comme un enfant qui jaillit du sein maternel et que Dieu enferme derrière des portes.
  alternative: Reformuler abstraitement en disant que Dieu a fixé des limites à la mer.
  rationale: L’hébreu présente une scène de naissance saisissante. Garder cette métaphore respecte la poésie et n’affirme pas davantage que ce que dit l’image.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La question est ponctuée comme la continuation du discours divin. « Sein maternel » rend clairement רֶחֶם sans employer le terme plus clinique « utérus ».
