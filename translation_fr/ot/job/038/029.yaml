  text: מִ/בֶּ֣טֶן מִ֭י יָצָ֣א הַ/קָּ֑רַח וּ/כְפֹ֥ר שָׁ֝מַיִם מִ֣י יְלָדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/029.yaml
  text: From whose womb did the ice come forth[a], and who gave birth to the frost of heaven?
translation:
  language: fr
  text: Du sein de qui la glace est-elle sortie ? Et qui a enfanté le givre des cieux[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la gelée blanche des cieux » ou « la gelée blanche du ciel ».'
    reason: כְּפוֹר peut désigner plus précisément la gelée blanche, tandis que שָׁמַיִם peut se rendre par « les cieux » ou « le ciel » selon que l’on privilégie la forme poétique ou le phénomène atmosphérique.
lexical_decisions:
- source_word: מִבֶּטֶן מִי
  choice: Du sein de qui
  rationale: בֶּטֶן désigne le ventre ou le sein maternel. « Du sein de qui » conserve l’image de la naissance et rend naturellement la question personnelle introduite par מִי, dans un registre poétique digne.
- source_word: יָצָא הַקָּרַח
  choice: la glace est-elle sortie
  rationale: יָצָא signifie « sortir ». Cette formulation reste proche de l’hébreu et prolonge l’image de l’enfantement sans ajouter une interprétation.
- source_word: וּכְפֹר שָׁמַיִם
  choice: Et ... le givre des cieux
  rationale: כְּפוֹר désigne le givre ou la gelée blanche. « Givre » est précis et courant. « Des cieux » préserve la portée cosmique et poétique de שָׁמַיִם.
- source_word: מִי יְלָדוֹ
  choice: qui a enfanté
  rationale: Le verbe ילד exprime ici l’action de mettre au monde. « Enfanter » conserve avec concision la personnification maternelle; le pronom objet hébreu est rendu en français par le groupe nominal placé avant le verbe.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme de la naissance est maintenu entre « du sein » et « a enfanté », sans expliciter l’identité implicite de celui qui produit la glace et le givre.
