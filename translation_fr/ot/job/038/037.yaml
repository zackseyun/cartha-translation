  yaml_path: translation/ot/job/038/037.yaml
  text: Who can count the clouds with wisdom[a], or tip over the jars of the heavens?
translation:
  language: fr
  text: Qui peut compter les nuages avec sagesse, et qui peut incliner les jarres du ciel ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif introduit une question rhétorique sur une capacité qui appartient à Dieu.
- source_word: יְסַפֵּר
  choice: peut compter
  rationale: Le piel de ספר signifie ici « compter, dénombrer »; l’ajout de « peut » exprime naturellement en français la portée rhétorique de l’imparfait.
- source_word: שְׁחָקִים
  choice: les nuages
  rationale: Dans ce contexte météorologique et poétique, le terme désigne les nuages plutôt que le ciel en général.
- source_word: בְּחָכְמָה
  choice: avec sagesse
  rationale: Cette formulation conserve la valeur instrumentale ou modale de la préposition ב sans trancher entre « par sagesse » et « avec habileté ».
- source_word: וְנִבְלֵי שָׁמַיִם
  choice: les jarres du ciel
  rationale: נבל désigne un récipient, notamment une outre ou une jarre. « Jarres » préserve l’image concrète de réservoirs célestes sans ajouter explicitement « d’eau », absent de l’hébreu.
- source_word: יַשְׁכִּיב
  choice: peut incliner
  rationale: Le hiphil de שכב signifie littéralement « faire coucher ». Appliqué à des récipients, il évoque le geste de les coucher ou de les incliner afin d’en déverser le contenu; « incliner » conserve l’image sans expliciter le résultat.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « qui peut » rend explicite et fluide la coordination de deux questions rhétoriques. « Ciel » au singulier est l’expression idiomatique française dans cette image météorologique.
