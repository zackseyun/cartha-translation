  text: הֲ/תָצ֣וּד לְ/לָבִ֣יא טָ֑רֶף וְ/חַיַּ֖ת כְּפִירִ֣ים תְּמַלֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/039.yaml
  text: Do you hunt prey for the lioness[a], and satisfy the appetite of the young lions,
translation:
  language: fr
  text: 'Est-ce toi qui chasses une proie pour le lion[a]

    et qui combles l’appétit des jeunes lions[b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi désigner une lionne.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « remplis la vie des jeunes lions » ; l’expression désigne leur appétit ou leur faim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָצוּד
  choice: Est-ce toi qui chasses
  rationale: La particule interrogative הֲ et l’imparfait qal à la 2e personne du masculin singulier introduisent une question rhétorique adressée à Job. « Est-ce toi qui… » met naturellement en relief le contraste implicite avec Dieu.
- source_word: לְלָבִיא
  choice: pour la lionne
  rationale: לָבִיא peut désigner un lion ou une lionne. La mention parallèle des jeunes lions favorise ici « lionne », sans rendre ce choix absolument certain.
- source_word: טָרֶף
  choice: une proie
  rationale: Le terme désigne la proie capturée et dévorée par un animal carnivore; « proie » conserve précisément cette image.
- source_word: וְחַיַּת כְּפִירִים
  choice: les jeunes lions
  rationale: חַיַּת signifie littéralement « la vie de » et, avec le verbe « remplir », évoque ici les besoins vitaux ou l’appétit des כְּפִירִים, les jeunes lions. Le français idiomatique permet d’exprimer cet ensemble par le verbe « rassasier », tout en signalant la formulation littérale en note.
- source_word: תְּמַלֵּא
  choice: rassasies
  rationale: Le piel de מלא signifie « remplir ». Dans ce contexte alimentaire, « rassasier » rend naturellement l’idée de remplir les besoins vitaux ou la faim.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La structure en deux membres conserve le parallélisme poétique et la question rhétorique. Le choix de « lionne » est contextuel; la note porte plutôt sur l’expression hébraïque inhabituelle « remplir la vie », où une traduction strictement littérale serait obscure.
