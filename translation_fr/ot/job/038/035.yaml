  text: הַֽ/תְשַׁלַּ֣ח בְּרָקִ֣ים וְ/יֵלֵ֑כוּ וְ/יֹאמְר֖וּ לְ/ךָ֣ הִנֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/035.yaml
  text: Can you send out lightnings so that they go and say to you[a], ‘Here we are’ ?
translation:
  language: fr
  text: 'Peux-tu envoyer les éclairs pour qu’ils partent et te disent : « Nous voici » ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתְשַׁלַּח
  choice: Peux-tu envoyer
  rationale: La particule interrogative avec le hifil inaccompli à la deuxième personne forme une question rhétorique adressée à Job. « Peux-tu » rend naturellement la mise au défi portant sur sa capacité.
- source_word: בְּרָקִים
  choice: les éclairs
  rationale: Le pluriel hébreu désigne les manifestations ou traits de foudre. En français courant, « les éclairs » exprime naturellement ce pluriel tout en permettant la personnification qui suit.
- source_word: וְיֵלֵכוּ
  choice: pour qu’ils partent
  rationale: L’inaccompli coordonné prolonge l’envoi avec une nuance de but ou de résultat. « Partent » convient à des messagers envoyés et conserve l’image poétique.
- source_word: וְיֹאמְרוּ
  choice: et te disent
  rationale: La formulation maintient explicitement la personnification des éclairs, présentés comme des messagers qui répondent à celui qui les commande.
- source_word: לְךָ
  choice: te
  rationale: Le pronom datif singulier renvoie directement à l’interlocuteur, Job; le pronom conjoint est la tournure française la plus naturelle.
- source_word: הִנֵּנוּ
  choice: Nous voici
  rationale: Cette formule idiomatique exprime la présence et la disponibilité immédiates. Elle convient à la réponse de messagers prêts à obéir sans recourir à une expression archaïque.
theological_decisions:
- issue: Personnification des éclairs dans le discours divin
  choice: 'Conserver l’image selon laquelle les éclairs partent et disent : « Nous voici ».'
  alternative: Dépersonnaliser le verset en le réduisant à une description de phénomènes naturels soumis à Dieu.
  rationale: Le texte hébreu attribue explicitement aux éclairs le mouvement et la parole. Cette personnification souligne poétiquement qu’ils répondent au commandement divin, sans affirmer qu’ils possèdent littéralement une conscience.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est directe; la personnification et la vive réponse des éclairs sont intégralement conservées.
