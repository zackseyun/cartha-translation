  yaml_path: translation/ot/job/038/025.yaml
  text: Who has cut a channel for the flood[a], or a path for the thunderbolt,
translation:
  language: fr
  text: 'Qui a creusé un chenal pour le torrent[a],

    ou un chemin pour l’éclair du tonnerre ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « pour l’averse torrentielle ». Littéralement : « pour le flot […] pour l’éclair des voix (ou des sons) ».'
    reason: Le mot שֶׁטֶף peut désigner un flot impétueux ou une pluie torrentielle. L’expression rare חֲזִיז קֹלוֹת associe littéralement l’éclair à des « voix » ou « sons », probablement le tonnerre dans ce contexte.
lexical_decisions:
- source_word: פִלַּג
  choice: a creusé
  rationale: Le verbe évoque l’action de fendre ou de diviser afin d’ouvrir un passage. Avec תְּעָלָה, « creuser » exprime naturellement en français l’aménagement d’un chenal.
- source_word: שֶּׁטֶף
  choice: le torrent
  rationale: Le nom peut désigner un afflux impétueux, une crue ou une pluie torrentielle. « Le torrent » maintient l’image d’une masse d’eau violente conduite dans un chenal, tout en laissant ouverte la possibilité d’une averse torrentielle signalée en note.
- source_word: תְּעָלָה
  choice: un chenal
  rationale: Le terme désigne un conduit ou un canal destiné à l’eau. « Chenal » convient à ce cours assigné aux eaux et conserve la force poétique de l’image.
- source_word: דֶרֶךְ
  choice: une voie
  rationale: Le mot désigne un chemin ou un parcours. « Voie » forme un parallèle naturel avec « chenal » et évoque le trajet assigné au phénomène céleste.
- source_word: חֲזִיז קֹלוֹת
  choice: l’éclair accompagné du tonnerre
  rationale: חֲזִיז, terme rare, renvoie probablement à l’éclair ou à la foudre, tandis que קֹלוֹת signifie littéralement « voix » ou « sons » et désigne souvent le tonnerre dans un contexte météorologique. Cette formulation française rend les deux composantes sans les réduire au seul « coup de foudre ».
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme « chenal / voie » est conservé. La seconde proposition explicite sobrement l’association de l’éclair et du tonnerre tout en signalant en note la formulation hébraïque inhabituelle.
