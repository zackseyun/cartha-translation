source:
  edition: WLC
  text: הְֽ֭/מִ/יָּמֶי/ךָ צִוִּ֣יתָ בֹּ֑קֶר ידעתה שחר מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/012.yaml
  text: Have you[a], in your days, commanded the morning[b], and caused the dawn to know its place?
translation:
  language: fr
  text: Depuis que tu existes, as-tu jamais commandé au matin et fait connaître à l’aurore sa place[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fait connaître à l’aurore sa place ». Le verbe hébreu est causatif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיָּמֶיךָ
  choice: Depuis que tu existes… jamais
  rationale: L’expression interrogative מן + « tes jours » porte sur toute la durée de la vie de Job. Cette formulation française naturelle en restitue la portée temporelle.
- source_word: צִוִּיתָ
  choice: donné des ordres
  rationale: Le verbe signifie « commander, donner un ordre » et souligne l’autorité exercée sur le matin personnifié.
- source_word: בֹּקֶר
  choice: au matin
  rationale: « Le matin » est ici une réalité cosmique personnifiée; après « donner des ordres », « au matin » est idiomatique en français.
- source_word: יָדַעְתָּה
  choice: indiqué
  rationale: La forme causative de ידע signifie littéralement « faire connaître ». « Indiquer à l’aurore la place qu’elle devait prendre » en exprime naturellement la valeur causative.
- source_word: שַׁחַר
  choice: l’aurore
  rationale: « Aurore » distingue ce terme de « matin » tout en préservant le parallélisme poétique et la personnification.
- source_word: מְקוֹמוֹ
  choice: la place qu’elle devait prendre
  rationale: Cette tournure rend naturellement « sa place » dans le contexte d’une aurore à laquelle une position est assignée, sans préciser davantage la nature de cette place.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La question rhétorique ainsi que la personnification du matin et de l’aurore sont conservées; l’idiome hébreu « depuis tes jours » est rendu sous une forme française immédiatement compréhensible.
