  source_fidelity: 'Le sens temporel de הֲמִיָּמֶיךָ (« depuis que tu existes / au cours de ta vie ») et l''autorité de צִוִּיתָ sont bien rendus. En revanche, « indiqué à l’aurore la place qu’elle devait prendre » explicite et infléchit le texte : יָדַעְתָּה est causatif, « faire connaître », et מְקוֹמוֹ signifie simplement « sa place ».'
  naturalness: « Depuis que tu existes, as-tu jamais… ? » est naturel en français moderne et conserve le ton solennel de l'interrogation. « Commandé au matin » est idiomatique dans ce contexte poétique personnifié. « Fait connaître à l’aurore sa place » est à la fois naturel et plus fidèle que la formulation actuelle.
  terminology: « Matin » et « aurore » maintiennent la distinction entre בֹּקֶר et שַׁחַר. La révision conserve la personnification sans ajouter l'idée d'une place « qu’elle devait prendre ».
