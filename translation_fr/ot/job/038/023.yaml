revisions:
- from: que j’ai gardés en réserve[a] pour le temps de la détresse[b], pour le jour du combat et de la guerre ?
  to: que j’ai mis en réserve[a] pour un temps de détresse[b], pour un jour de combat et de guerre ?
  rationale: La révision corrige l’accord interprétatif du participe et restitue l’indéfini des deux expressions temporelles. Les parenthèses dans la note a signalent explicitement l’accord dépendant de l’antécédent contextuel, sans trancher une ambiguïté que le relatif hébreu ne résout pas à lui seul.
