review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : le relatif reprend les réalités météorologiques du verset précédent, et les deux compléments temporels ainsi que le doublet militaire sont conservés. Toutefois, « gardés » impose un antécédent masculin pluriel (« trésors/réserves »), alors que le référent contextuel immédiat est la grêle (féminin) — ou, plus largement, les phénomènes mentionnés. La formulation révisée évite cette surdétermination grammaticale tout en conservant l’accompli hébreu.'
  naturalness: « Pour le temps de la détresse » est moins naturel et indûment défini en français. « Pour un temps de détresse » et « pour un jour de combat et de guerre » sont idiomatiques, dignes et conservent l’indéfini de l’hébreu.
  terminology: « Détresse », « combat » et « guerre » rendent correctement les termes hébreux et préservent le parallélisme. « Mis en réserve » convient au contexte de stockage et évite de fixer artificiellement le genre et le nombre de l’antécédent dans ce fragment dépendant du verset précédent.
  issues:
  - severity: medium
    issue: Accord de « gardés »
    rationale: Le participe masculin pluriel interprète le relatif comme renvoyant aux « trésors/réserves » plutôt qu’à la neige et surtout à la grêle du contexte immédiat. Le relatif hébreu ne marque ni genre ni nombre. Une formulation sans accord visible préserve mieux cette souplesse contextuelle.
  - severity: low
    issue: Articles définis dans les expressions temporelles
    rationale: « le temps de la détresse » et « le jour du combat » ajoutent une détermination absente de לְעֵת צָר et לְיוֹם קְרָב. L’indéfini français rend plus directement le sens hébreu.
  revised_text: que j’ai mis en réserve[a] pour un temps de détresse[b], pour un jour de combat et de guerre ?
  revised_footnotes:
