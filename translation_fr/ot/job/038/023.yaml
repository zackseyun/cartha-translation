  text: which I have reserved for a time of distress[a], for a day of battle and war[b],
translation:
  language: fr
  text: que j’ai mis en réserve[a] pour un temps de détresse[b], pour un jour de combat et de guerre ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que j’ai retenue(s) » ou « que j’ai gardée(s) en réserve ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de malheur » ou « d’adversité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif reprend les « réserves » mentionnées au verset précédent et maintient le lien syntaxique avec la question en cours.
- source_word: חָשַׂכְתִּי
  choice: j’ai gardés en réserve
  rationale: Le verbe חשׂך peut signifier retenir, épargner ou réserver. « Garder en réserve » exprime ici l’idée d’une conservation intentionnelle en vue d’un usage ultérieur. L’accord masculin pluriel renvoie aux « trésors » ou « réserves » du verset 22.
- source_word: לְעֶת
  choice: pour le temps de
  rationale: La préposition ל indique ici la destination ou le but, tandis que עֵת désigne un temps ou une occasion déterminée.
- source_word: צָר
  choice: détresse
  rationale: Dans ce contexte, צָר désigne une période de détresse, de malheur ou d’adversité. « Détresse » conserve la gravité du terme sans en préciser excessivement la nature.
- source_word: לְיוֹם
  choice: pour le jour du
  rationale: Cette formulation garde le parallélisme avec « pour le temps de » et exprime la destination temporelle.
- source_word: קְרָב
  choice: combat
  rationale: Terme militaire courant désignant l’affrontement ou la bataille. « Combat » s’associe naturellement à « guerre » tout en maintenant les deux termes distincts.
- source_word: וּמִלְחָמָה
  choice: et de la guerre
  rationale: La traduction conserve la paire hébraïque de termes militaires proches au lieu de les fondre en une seule notion.
theological_decisions:
- issue: Emploi divin des forces naturelles dans un contexte de jugement et de conflit
  choice: Conserver le sens direct selon lequel Dieu tient ces phénomènes en réserve pour un temps de détresse et de guerre.
  alternative: Comprendre le langage comme une simple métaphore générale de la providence, sans portée militaire concrète.
  rationale: Le texte mentionne explicitement « le jour du combat et de la guerre ». La traduction garde cette image sans en atténuer ni en systématiser les implications théologiques.
translation_notes:
  register: Français moderne, digne et accessible. La phrase reste rattachée syntaxiquement au verset précédent et conserve la forme interrogative du discours divin. « Combat et guerre » préserve le redoublement hébreu sans lourdeur excessive.
