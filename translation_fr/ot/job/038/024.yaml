  text: אֵי זֶ֣ה הַ֭/דֶּרֶךְ יֵחָ֣לֶק א֑וֹר יָפֵ֖ץ קָדִ֣ים עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/024.yaml
  text: By what way is light divided[b][a], or the east wind scattered over the earth?
translation:
  language: fr
  text: Par quel chemin la lumière est-elle répartie[a][b], ou le vent d’est se disperse-t-il sur la terre ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Où est le chemin par lequel la lumière est répartie ? » L’interrogation hébraïque peut porter sur le lieu ou sur la manière.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’éclair » au lieu de « la lumière ». Le mot hébreu signifie normalement « lumière », mais certains lui donnent ici un sens météorologique plus précis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Par quel chemin
  rationale: La formule interrogative אֵי זֶה peut porter sur le lieu ou la manière. Avec הַדֶּרֶךְ, « Par quel chemin » rend naturellement l’image tout en laissant ouverte l’idée d’un trajet ou d’un moyen.
- source_word: יֵחָלֶק
  choice: se partage
  rationale: Le niphal de חלק exprime ici l’idée d’être partagé, réparti ou de se diviser. La tournure pronominale française convient à la poésie et ne précise pas d’agent.
- source_word: אוֹר
  choice: la lumière
  rationale: « Lumière » est le sens ordinaire de אוֹר. Le contexte de la tempête permet éventuellement « éclair », mais ne l’impose pas.
- source_word: יָפֵץ
  choice: se disperse
  rationale: Le verbe פוץ évoque la dispersion. La tournure pronominale produit un français naturel et maintient le parallélisme avec « se partage » sans ajouter d’agent explicite.
- source_word: קָדִים
  choice: le vent d’est
  rationale: קָדִים désigne couramment le vent venant de l’est, particulièrement approprié dans ce contexte météorologique.
- source_word: עֲלֵי אָרֶץ
  choice: sur la terre
  rationale: La locution signifie « sur, au-dessus de ». « Sur la terre » convient à la portée cosmique du discours sans réduire אֶרֶץ à un territoire particulier.
