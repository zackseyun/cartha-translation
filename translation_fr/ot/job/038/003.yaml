  yaml_path: translation/ot/job/038/003.yaml
  text: Gird up your loins like a man[a]; I will question you[b], and you shall make it known to me.
translation:
  language: fr
  text: Prépare-toi donc comme un homme[a] ! Je t’interrogerai, et fais-moi savoir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ceins tes reins comme un homme. » Cette expression évoque le fait de serrer son vêtement à la taille afin d’être prêt à agir. Autre traduction possible : « prépare-toi comme un guerrier ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « fais-moi savoir ». Selon le sens dans ce dialogue, on peut aussi traduire : « réponds-moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר נָא ... חֲלָצֶיךָ
  choice: Prépare-toi donc
  rationale: L’expression concrète « ceindre ses reins » signifie se préparer fermement à agir. Une traduction purement littérale serait peu naturelle en français moderne ; « donc » rend ici la nuance pressante de נָא sans en faire une marque de politesse.
- source_word: כְגֶבֶר
  choice: comme un homme
  rationale: גֶּבֶר désigne un homme, souvent avec une nuance de force ou de vaillance. Le masculin explicite et la vigueur du défi sont conservés, tandis qu’une note signale l’autre rendu possible.
- source_word: וְאֶשְׁאָלְךָ
  choice: Je t’interrogerai
  rationale: שׁאל signifie « demander, questionner ». Dans ce défi soutenu, « interroger » exprime mieux la série de questions qui suit.
- source_word: וְהוֹדִיעֵנִי
  choice: et toi, instruis-moi
  rationale: La forme causative de ידע signifie littéralement « fais-moi savoir ». « Instruis-moi » conserve cette force causative en français naturel et maintient l’ironie solennelle du défi, sans la réduire silencieusement à « réponds-moi ».
theological_decisions:
- issue: Expression masculine dans le défi divin
  choice: comme un homme
  alternative: comme un guerrier / comme un homme vaillant
  rationale: Le texte emploie explicitement le nom masculin גֶּבֶר. Le conserver respecte la formulation source ; dans ce contexte, l’expression appelle Job à faire preuve de résolution et n’énonce pas une doctrine sur la supériorité masculine.
- issue: Portée de l’ordre final
  choice: instruis-moi
  alternative: réponds-moi
  rationale: Le causatif hébreu demande littéralement à Job de « faire savoir » à Dieu. Le rendu choisi préserve la tension rhétorique et théologique de cette formulation, tandis que « réponds-moi » explicite sa fonction dans le dialogue.
translation_notes:
  register: Français international moderne, direct et solennel. « Prépare-toi » évite l’expression aujourd’hui vieillie « ceins tes reins », tout en conservant celle-ci en note. Le pronom tonique « toi » souligne le face-à-face du défi.
