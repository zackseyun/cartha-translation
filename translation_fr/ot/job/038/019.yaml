  text: Where is the way to the dwelling of light[a], and where is the place of darkness,
translation:
  language: fr
  text: Où est le chemin qui mène à la demeure de la lumière[a] ? Et les ténèbres, où est leur lieu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « Quel est le chemin où demeure la lumière ? Et les ténèbres, où est leur lieu ? » L’hébreu relie de façon elliptique « chemin » et « demeure »; il peut donc évoquer le chemin vers le séjour de la lumière.'
    reason: Précise l’ambiguïté syntaxique sans supposer une préposition absente du texte hébreu.
lexical_decisions:
- source_word: אֵי זֶה
  choice: Où est
  rationale: Cette tournure interrogative porte ici sur la localisation ou l’accès. « Où est » est idiomatique en français et convient aux deux membres du verset.
- source_word: הַדֶּרֶךְ
  choice: le chemin
  rationale: דֶּרֶךְ désigne un chemin, une voie ou une route. « Le chemin » conserve l’image concrète d’un accès.
- source_word: יִשְׁכָּן אוֹר
  choice: qui mène à la demeure de la lumière
  rationale: Le verbe שׁכן signifie « demeurer, résider ». Cette formulation française naturelle maintient la personnification cosmique de la lumière tout en rattachant clairement le chemin à sa destination.
- source_word: וְחֹשֶׁךְ
  choice: Et les ténèbres
  rationale: Le nom חֹשֶׁךְ s’oppose à la lumière. Le pluriel lexical français « les ténèbres » rend naturellement ce nom collectif singulier en hébreu.
- source_word: מְקֹמוֹ
  choice: leur lieu
  rationale: מָקוֹם signifie « lieu, place » et le suffixe renvoie aux ténèbres. Le possessif pluriel s’accorde avec la forme française « les ténèbres ».
