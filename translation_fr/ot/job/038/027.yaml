  text: pour rassasier les étendues dévastées et désolées, et faire pousser l’herbe naissante ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַשְׂבִּיעַ
  choice: pour rassasier
  rationale: Conserve l’image concrète de la terre abreuvée jusqu’à satiété.
- source_word: שֹׁאָה וּמְשֹׁאָה
  choice: les terres dévastées et désolées
  rationale: Rend le doublet hébreu par deux adjectifs proches, sans l’aplatir en un seul terme; « terres » explicite naturellement le lieu visé en français.
- source_word: וּלְהַצְמִיחַ
  choice: et y faire germer
  rationale: Exprime la causation du hifil et ajoute « y » pour relier naturellement la végétation aux terres mentionnées.
- source_word: מֹצָא דֶשֶׁא
  choice: de jeunes pousses d’herbe
  rationale: מֹצָא désigne ici ce qui sort ou apparaît; « jeunes pousses » conserve cette idée de croissance émergente sans la tournure peu naturelle « la croissance de l’herbe ».
theological_decisions:
- issue: Finalité de la pluie envoyée sur un territoire inhabité
  choice: Conserver les infinitifs de but « pour… et… »
  alternative: Les reformuler comme de simples conséquences
  rationale: La syntaxe hébraïque présente ces actions comme les fins de l’intervention divine évoquée au verset précédent, ce qui maintient l’accent sur la sollicitude de Dieu envers la création indépendamment de l’utilité humaine.
translation_notes:
  register: Français moderne, naturel et digne. La coordination et l’image de satiété restent proches de l’hébreu, tandis que « de jeunes pousses d’herbe » évite un calque maladroit.
