source:
  edition: WLC
  text: מִי שָׁ֭ת בַּ/טֻּח֣וֹת חָכְמָ֑ה א֤וֹ מִֽי נָתַ֖ן לַ/שֶּׂ֣כְוִי בִינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/036.yaml
  text: Who has put wisdom in the inward parts[a], or who has given understanding to the mind?
translation:
  language: fr
  text: Qui a mis la sagesse au plus profond de l’être[a], ou qui a donné l’intelligence à l’esprit ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Qui a mis la sagesse dans les parties cachées, ou qui a donné l’intelligence au coq ? » Le second terme peut désigner un oiseau — traditionnellement le coq, parfois l’ibis — plutôt que l’esprit.'
    reason: Lecture alternative de deux termes hébreux rares et difficiles.
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Pronom interrogatif introduisant chacune des deux questions rhétoriques de Dieu.
- source_word: שָׁת
  choice: a mis
  rationale: Rend simplement l’idée de placer ou de mettre et forme un parallèle naturel avec « a donné ».
- source_word: בַּטֻּחוֹת
  choice: au plus profond de l’être
  rationale: Le terme rare et difficile semble désigner les parties intérieures ou cachées. Cette formulation conserve le sens intérieur et métaphorique sans imposer le littéralisme potentiellement trompeur de « reins ».
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Équivalent français courant, en parallèle avec « l’intelligence ».
- source_word: אוֹ
  choice: Qui … ? Qui … ?
  rationale: L’hébreu relie les propositions par « ou ». En français, deux questions coordonnées sans « ou » rendent plus naturellement la progression rhétorique sans changer sa portée.
- source_word: נָתַן
  choice: a donné
  rationale: Sens usuel du verbe dans ce contexte; correspond au parallèle avec « a mis ».
- source_word: לַשֶּׂכְוִי
  choice: à l’esprit
  rationale: Le nom est très discuté. Le parallélisme avec les profondeurs de l’être ainsi qu’entre sagesse et intelligence favorise ici une faculté intérieure; l’interprétation zoologique est signalée en note.
- source_word: בִינָה
  choice: l’intelligence
  rationale: Rend la faculté de comprendre et préserve son rapport étroit, sans identité complète, avec la sagesse.
theological_decisions:
- issue: Sens de deux termes rares dans une question divine sur la sagesse
  choice: Les deux membres évoquent les facultés intérieures auxquelles Dieu donne sagesse et intelligence.
  alternative: Le second terme peut désigner un oiseau, traditionnellement le coq et parfois l’ibis; le premier peut alors évoquer des parties cachées.
  rationale: Le parallélisme poétique favorise la lecture anthropologique, mais les données lexicales ne permettent pas d’écarter la lecture zoologique. La note conserve donc cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. « Au plus profond de l’être » communique l’intériorité sans employer l’anatomique « reins ». Deux questions successives remplacent naturellement la coordination hébraïque par « ou ». Le marqueur [a] figure dans le texte.
