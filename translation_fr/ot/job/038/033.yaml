id: JOB.38.33
reference: Job 38:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ֭/יָדַעְתָּ חֻקּ֣וֹת שָׁמָ֑יִם אִם תָּשִׂ֖ים מִשְׁטָר֣/וֹ בָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/033.yaml
  text: Do you know the ordinances of the heavens? Can you establish their rule on the earth?[a]
translation:
  language: fr
  text: Connais-tu les lois des cieux ? Peux-tu établir leur autorité sur la terre ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son autorité », « sa domination » ou « son gouvernement ». Le suffixe hébreu est au singulier (« son ») et renvoie probablement aux cieux considérés comme un ensemble.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Connais-tu
  rationale: L’interrogatif הֲ suivi du qatal de ידע exprime ici une question sur le savoir présent. « Connais-tu » est naturel et garde la force du défi divin.
- source_word: חֻקּוֹת
  choice: les lois
  rationale: חֻקּוֹת désigne des prescriptions ou des règles fixes. Dans ce contexte cosmique, « lois » exprime clairement l’ordre établi sans évoquer uniquement une législation humaine.
- source_word: שָׁמָיִם
  choice: des cieux
  rationale: Le pluriel « cieux » conserve la forme hébraïque et le registre cosmique élevé du passage.
- source_word: אִם
  choice: Peux-tu
  rationale: אִם introduit ici la seconde question, parallèle à la première. « Peux-tu » restitue naturellement en français la portée rhétorique du défi.
- source_word: תָּשִׂים
  choice: établir
  rationale: Le verbe שׂים signifie fondamentalement « mettre, placer » ; associé à מִשְׁטָר et à la terre, « établir » rend l’idée de mettre une autorité en vigueur.
- source_word: מִשְׁטָרוֹ
  choice: leur autorité
  rationale: מִשְׁטָר évoque le pouvoir, la domination ou l’autorité. « Autorité » préserve cette idée de gouvernement sans préciser indûment le mécanisme de l’influence céleste. Le possessif français est accordé avec « les cieux », tandis que la note signale le suffixe hébreu singulier.
- source_word: בָאָרֶץ
  choice: sur la terre
  rationale: Dans ce contexte, בָאָרֶץ désigne le domaine terrestre sur lequel s’exerce l’ordre céleste ; « sur la terre » est la formulation française naturelle.
theological_decisions:
- issue: Nature de l’ordre céleste évoqué
  choice: Le verset parle des lois fixes des cieux et de leur autorité sur la terre sans définir plus précisément leur mode d’action.
  alternative: Comprendre le verset comme une affirmation précise d’une influence astrologique ou constellaire sur les affaires terrestres.
  rationale: Le contexte porte sur les astres et les cieux, mais les mots hébreux expriment surtout un ordre établi et une autorité. La traduction conserve ce langage cosmique sans introduire une doctrine astrologique absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Les questions directes conservent la vigueur rhétorique du discours divin ; « lois des cieux » reste accessible tout en gardant la portée cosmique du texte.
