lexical_decisions:
- source_word: הֲיֵשׁ לַמָּטָר
  choice: La pluie a-t-elle
  rationale: La tournure interrogative existentielle avec ל de relation ou de possession se rend naturellement en français par « avoir ».
- source_word: אָב
  choice: un père
  rationale: Le sens concret de « père » conserve la métaphore de la génération et le parallélisme avec le verbe suivant.
- source_word: אוֹ מִי
  choice: ou qui
  rationale: Traduction directe et naturelle de la coordination disjonctive suivie du pronom interrogatif.
- source_word: הוֹלִיד
  choice: a engendré
  rationale: Le hiphil de ילד exprime ici l’action d’engendrer. « A engendré » est digne, précis et moins archaïque que « a procréé » ou certaines tournures littéraires.
- source_word: אֶגְלֵי טָל
  choice: les gouttes de rosée
  rationale: Cette expression restitue clairement la relation construite entre les gouttes et la rosée, tout en préservant l’image poétique.
