source:
  edition: WLC
  text: בְּ/רָן יַ֭חַד כּ֣וֹכְבֵי בֹ֑קֶר וַ֝/יָּרִ֗יעוּ כָּל בְּנֵ֥י אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/007.yaml
  text: when the morning stars sang together[a], and all the sons of God shouted for joy?
translation:
  language: fr
  text: 'quand les étoiles du matin chantaient ensemble,

    et que tous les fils de Dieu[a] poussaient des cris de joie ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les êtres célestes » ou « les anges ». Hébreu : « les fils de Dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/רָן
  choice: quand… chantaient
  rationale: La préposition בְּ avec l’infinitif construit introduit ici une proposition temporelle. רנן exprime un chant ou un cri jubilant ; « chantaient » convient au parallélisme poétique.
- source_word: יַחַד
  choice: ensemble
  rationale: Le terme exprime l’action commune ou simultanée ; « ensemble » est naturel et conserve la force collective.
- source_word: כּוֹכְבֵי בֹקֶר
  choice: les étoiles du matin
  rationale: Cette expression reproduit naturellement en français l’image poétique de la construction hébraïque « étoiles du matin ».
- source_word: וַ/יָּרִיעוּ
  choice: poussaient des cris de joie
  rationale: À la forme hiphil, le verbe désigne le fait de pousser un cri, ici manifestement jubilant en parallèle avec le chant.
- source_word: כָּל
  choice: tous
  rationale: Le mot souligne la totalité du groupe et s’accorde en français avec « fils ».
- source_word: בְּנֵי אֱלֹהִים
  choice: les fils de Dieu
  rationale: Cette traduction formelle conserve l’expression hébraïque et sa portée théologique sans identifier explicitement ces êtres aux anges.
theological_decisions:
- issue: Identité des בְּנֵי אֱלֹהִים
  choice: les fils de Dieu
  alternative: les êtres célestes ; les anges ; les êtres divins
  rationale: Dans Job, l’expression désigne vraisemblablement des membres de la cour céleste. La conserver littéralement respecte toutefois la formulation hébraïque et évite de trancher dans le texte principal une identification interprétative.
translation_notes:
  register: Français international moderne, poétique et digne. L’imparfait rend les deux actions simultanées dans la proposition temporelle et maintient le parallélisme du vers.
