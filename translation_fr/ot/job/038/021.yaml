source:
  edition: WLC
  text: יָ֭דַעְתָּ כִּי אָ֣ז תִּוָּלֵ֑ד וּ/מִסְפַּ֖ר יָמֶ֣י/ךָ רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/021.yaml
  text: You know[a], for then you were born, and the number of your days is great!
translation:
  language: fr
  text: Tu le sais, puisque tu étais déjà né à cette époque et que le nombre de tes jours est grand[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « et tes jours sont nombreux ». Littéralement : « et le nombre de tes jours [est] grand / nombreux ».'
    reason: La tournure hébraïque permet de rendre רַבִּים soit en rapport avec « le nombre », soit plus librement en rapport avec « tes jours ».
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Tu le sais
  rationale: Le qal accompli, 2e personne masculine singulier, prend ici une valeur rhétorique dans l'ironie du discours divin. Le pronom « le » reprend implicitement la connaissance évoquée au verset précédent.
- source_word: כִּי אָז
  choice: puisque… à cette époque
  rationale: כִּי introduit l'explication ironique, tandis que אָז renvoie au temps des événements de la création. « Puisque » rend naturellement le lien argumentatif sarcastique en français.
- source_word: תִּוָּלֵד
  choice: tu étais déjà né
  rationale: 'Le nifal inaccompli de ילד est employé avec une référence temporelle passée dans cette pointe ironique : Job aurait dû être né au temps de la création pour en avoir connaissance. « Déjà » explicite cette relation temporelle sans modifier l''idée.'
- source_word: וּמִסְפַּר יָמֶיךָ רַבִּים
  choice: et que le nombre de tes jours est grand
  rationale: La formulation conserve la chaîne nominale hébraïque et l'accord sémantique avec « nombre », tout en maintenant l'hyperbole ironique.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à l'adresse divine à Job. La ponctuation exclamative et « puisque » préservent le ton sarcastique sans ajouter d'explication doctrinale.
