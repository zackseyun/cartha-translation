  text: הֲ/תָרִ֣ים לָ/עָ֣ב קוֹלֶ֑/ךָ וְֽ/שִׁפְעַת מַ֥יִם תְּכַסֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/034.yaml
  text: Can you raise your voice to the clouds[b][a], so that an abundance of water covers you?
translation:
  language: fr
  text: Peux-tu élever la voix vers le nuage[a], pour que des eaux abondantes te couvrent[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers l’épais nuage » ; le nom hébreu est au singulier et peut désigner une masse nuageuse dense.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et que des eaux en abondance te couvrent ». L’hébreu peut être compris comme une simple coordination, et l’expression évoque aussi une masse d’eau débordante.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: הֲתָרִים
  choice: Peux-tu élever
  rationale: Le hifil de רוּם, dans cette question rhétorique, porte sur la capacité d’élever la voix. « Peux-tu élever » conserve la forme du défi divin.
- source_word: לָעָב
  choice: vers le nuage
  rationale: עָב est ici singulier et peut désigner un nuage épais chargé de pluie. « Vers le nuage » respecte le nombre du texte hébreu, tandis que la note signale une autre formulation naturelle.
- source_word: קוֹלֶךָ
  choice: la voix
  rationale: קוֹל désigne naturellement la voix dans le contexte d’un appel adressé au nuage. En français, « élever la voix » exprime idiomatiquement le possessif implicite du sujet.
- source_word: וְשִׁפְעַת מַיִם
  choice: pour que des eaux abondantes
  rationale: שִׁפְעָה évoque l’abondance ou le débordement. « Des eaux abondantes » rend l’idée d’une grande quantité d’eau sans imposer le sens destructeur de « déluge ».
- source_word: תְּכַסֶּךָּ
  choice: te couvrent
  rationale: Le piel de כסה signifie « couvrir » et le suffixe de deuxième personne du masculin singulier renvoie à Job. Le pluriel français s’accorde avec « des eaux ».
theological_decisions:
- issue: Rapport entre les deux propositions
  choice: 'La seconde proposition est rendue comme le résultat recherché de la première : « pour que » les eaux couvrent celui qui appelle.'
  alternative: 'Lire une simple coordination : « et que des eaux abondantes te couvrent » ou « et des eaux abondantes te couvrent » sans expliciter le rapport de résultat.'
  rationale: La question met à l’épreuve la capacité humaine à commander la pluie. « Pour que » rend naturellement en français le rapport implicite entre l’ordre donné au nuage et la venue de l’eau, tandis qu’une note préserve la coordination plus formelle possible.
translation_notes:
  register: Français international moderne, direct et digne. La tournure « élever la voix » est idiomatique, tandis que « le nuage » maintient l’image singulière de l’hébreu. Les notes conservent les ambiguïtés lexicale et syntaxique sans alourdir le verset.
