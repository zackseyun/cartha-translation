  yaml_path: translation/ot/job/038/030.yaml
  text: The waters are hidden like stone[b][a], and the surface of the deep is frozen.
translation:
  language: fr
  text: Les eaux durcissent comme la pierre[a], et la surface de l’abîme se fige[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Les eaux se cachent comme la pierre. » Le verbe hébreu est inhabituel ici ; dans ce contexte, il semble décrire les eaux qui se retirent en se durcissant sous l’effet du gel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la surface de l’abîme se trouve retenue » ou « se solidifie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּאֶבֶן
  choice: comme la pierre
  rationale: Le préfixe כ exprime ici la comparaison. « Comme la pierre » conserve l’image de la dureté sans transformer explicitement l’eau en pierre.
- source_word: מַיִם
  choice: les eaux
  rationale: Bien que מַיִם puisse fonctionner comme un nom massif, le pluriel « les eaux » convient au registre poétique et cosmique du passage.
- source_word: יִתְחַבָּאוּ
  choice: durcissent
  rationale: Le verbe signifie normalement « se cacher », mais son association avec « comme la pierre » et le parallélisme avec la surface de l’abîme qui se fige indiquent ici le durcissement des eaux sous l’effet du froid. La traduction littérale est signalée en note afin de préserver l’étrangeté de l’hébreu.
- source_word: וּפְנֵי
  choice: et la surface de
  rationale: Littéralement « et la face de » ; à propos d’une étendue d’eau, « la surface de » est l’équivalent idiomatique naturel en français.
- source_word: תְהוֹם
  choice: l’abîme
  rationale: « L’abîme » rend le profond réservoir d’eaux évoqué dans ce contexte cosmique et conserve la solennité poétique du terme.
- source_word: יִתְלַכָּדוּ
  choice: se fige
  rationale: Le verbe évoque ce qui est saisi, retenu ou étroitement lié. Dans le contexte du gel, « se fige » exprime naturellement la solidification tout en gardant une nuance plus imagée que le simple adjectif « gelée ».
