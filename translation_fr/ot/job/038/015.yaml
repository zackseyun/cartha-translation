id: JOB.38.15
reference: Job 38:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יִמָּנַ֣ע מֵ/רְשָׁ אוֹרָ֑/ם וּ/זְר֥וֹעַ רָ֝מָ֗ה תִּשָּׁבֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/015.yaml
  text: Their light is withheld from the wicked[b][a], and the uplifted arm is broken.
translation:
  language: fr
  text: Leur lumière est refusée aux méchants, et le bras levé est brisé.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bras levé sera brisé ». L’imparfait hébreu peut exprimer le futur aussi bien qu’un présent descriptif.
    reason: lexical_alternative
  - marker: b
    text: Le « bras » symbolise probablement ici la force ou la puissance, en particulier la puissance violente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִמָּנַע
  choice: est refusée
  rationale: Le niphal imparfait de מנע exprime ici le fait que la lumière est retirée ou refusée aux méchants. Cette tournure passive est naturelle en français et respecte la forme hébraïque.
- source_word: מֵרְשָׁעִים
  choice: aux méchants
  rationale: 'La préposition מִן marque la privation : les méchants sont privés de leur lumière. « Aux méchants » rend cette relation idiomatiquement en français sans préciser le genre.'
- source_word: אוֹרָם
  choice: leur lumière
  rationale: Le suffixe possessif de אוֹרָם désigne littéralement « leur lumière », c’est-à-dire la lumière dont jouissent les méchants dans l’image poétique du contexte.
- source_word: וּזְרוֹעַ
  choice: et le bras
  rationale: זְרוֹעַ signifie littéralement « bras » et peut symboliser la force ou la puissance. L’image concrète est conservée dans le texte.
- source_word: רָמָה
  choice: levé
  rationale: רָמָה décrit ici le bras comme élevé ou levé. « Levé » est naturel en français et laisse percevoir aussi bien la menace violente que l’arrogance.
- source_word: תִּשָּׁבֵר
  choice: est brisé
  rationale: Le niphal imparfait de שבר peut avoir dans ce passage poétique une valeur de présent descriptif ou général. « Est brisé » maintient la vivacité du tableau; le futur reste possible.
theological_decisions:
- issue: Valeur temporelle de תִּשָּׁבֵר
  choice: 'présent descriptif : « est brisé »'
  alternative: 'futur : « sera brisé »'
  rationale: L’imparfait hébreu permet les deux lectures. Le présent s’accorde bien avec la description vive de l’effet de l’aurore, tandis qu’une note préserve la possibilité du futur.
- issue: Sens figuré du « bras levé »
  choice: conserver l’image littérale dans le texte
  alternative: expliciter par « la puissance menaçante » ou « la force violente »
  rationale: Le bras représente probablement la force, notamment la puissance violente, mais le texte hébreu conserve une image concrète qu’il convient de ne pas résoudre dans la traduction principale.
translation_notes:
  register: Français international moderne, sobre et poétique. La formulation conserve l’image concrète du bras et la passivité des deux verbes. Les marqueurs sont placés après la proposition à laquelle ils se rapportent.
