  text: On what were its bases sunk[a], or who laid its cornerstone[b],
translation:
  language: fr
  text: Dans quoi ses bases ont-elles été enfoncées[a] ? Ou qui a posé sa pierre d’angle[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses fondations » ou « ses socles ». Le terme hébreu désigne des bases, des socles ou des supports de fondation.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qui a jeté (ou lancé) la pierre de son angle » ; dans ce contexte de construction, le verbe désigne la pose d’une pierre d’angle.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: Sur quoi
  rationale: Rend directement la question portant sur le support de l’édifice et conserve l’image architecturale.
- source_word: אֲדָנֶיהָ
  choice: ses bases
  rationale: אֶדֶן désigne une base, un socle ou un support de fondation. « Bases » garde l’image concrète sans employer un terme excessivement technique.
- source_word: הָטְבָּעוּ
  choice: ont-elles été enfoncées
  rationale: Le hophal de טָבַע exprime l’action passive d’être enfoncé ou fiché. Cette formulation préserve la force visuelle du verbe hébreu.
- source_word: אוֹ
  choice: ou
  rationale: Conjonction disjonctive simple reliant les deux questions rhétoriques.
- source_word: מִי
  choice: qui
  rationale: Équivalent direct du pronom interrogatif.
- source_word: יָרָה
  choice: a posé
  rationale: Bien que le verbe puisse littéralement signifier « lancer » ou « jeter », le contexte de construction appelle en français l’expression idiomatique « poser une pierre d’angle ».
- source_word: אֶבֶן פִּנָּתָהּ
  choice: sa pierre d’angle
  rationale: La locution signifie littéralement « la pierre de son angle ». « Pierre d’angle » est l’expression architecturale française naturelle, et le possessif renvoie à la terre dans le contexte.
theological_decisions:
- issue: Métaphore architecturale de la création de la terre
  choice: Conserver les images concrètes des bases et de la pierre d’angle.
  alternative: Paraphraser par « Qu’est-ce qui soutient la terre ? »
  rationale: La formulation poétique présente la terre comme un édifice. La conserver évite de réduire le texte à une explication cosmologique abstraite ou d’y importer une interprétation scientifique.
translation_notes:
  register: Français international moderne, poétique et digne. L’inversion interrogative maintient le ton solennel sans archaïsme, tandis que « enfoncées » conserve l’image vive du passif hébreu.
