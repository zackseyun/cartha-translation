id: JOB.3.16
reference: Job 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: א֤וֹ כְ/נֵ֣פֶל טָ֭מוּן לֹ֣א אֶהְיֶ֑ה כְּ֝/עֹלְלִ֗ים לֹא רָ֥אוּ אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/016.yaml
  text: Or like a hidden miscarriage[a], I would not be[b], like infants who never saw light.
translation:
  language: fr
  text: Ou bien, comme un enfant mort-né, caché[a], je n’existerais pas, comme des nourrissons qui n’ont jamais vu la lumière[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une fausse couche cachée ». Le terme hébreu peut désigner une fausse couche ou un enfant mort-né ; le participe signifie « caché » ou « dissimulé ».
    reason: lexical_alternative
  - marker: b
    text: « Voir la lumière » évoque ici le fait de venir au monde et de connaître la vie terrestre.
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: Ou bien
  rationale: Introduit naturellement en français une autre possibilité dans la suite des hypothèses formulées par Job.
- source_word: כְ/נֵ֣פֶל
  choice: comme un enfant mort-né
  rationale: Le nom נֵפֶל peut désigner le produit d’une fausse couche ou un enfant mort-né. Cette formulation est digne, intelligible et convient à la comparaison personnelle introduite par « comme ».
- source_word: טָ֭מוּן
  choice: caché
  rationale: Conserve le sens premier du participe de טמן, « cacher, dissimuler », sans préciser indûment qu’il s’agit d’un ensevelissement.
- source_word: לֹ֣א אֶהְיֶ֑ה
  choice: je n’existerais pas
  rationale: Rend clairement en français moderne le souhait contrefactuel de non-existence exprimé par Job.
- source_word: כְ֝/עֹלְלִ֗ים
  choice: comme les nourrissons
  rationale: עֹלְלִים désigne de très jeunes enfants; « nourrissons » correspond au contexte immédiat.
- source_word: לֹא רָ֥אוּ אֽוֹר
  choice: qui n’ont jamais vu la lumière
  rationale: Préserve l’image hébraïque tout en employant une tournure française naturelle; « jamais » explicite la portée contextuelle de la négation.
theological_decisions:
- issue: Portée de la non-existence souhaitée par Job
  choice: Traduire simplement « je n’existerais pas »
  alternative: Interpréter la phrase comme une affirmation sur l’état des morts ou sur l’au-delà
  rationale: Le verset exprime le regret contrefactuel de Job concernant son entrée dans la vie terrestre; il ne faut pas lui faire trancher une question anthropologique ou eschatologique plus large.
translation_notes:
  register: Français international moderne, sobre et poétique. « Enfant mort-né » évite le caractère clinique de certaines formulations tout en gardant l’ambiguïté lexicale en note. La répétition de « comme » respecte la structure hébraïque.
