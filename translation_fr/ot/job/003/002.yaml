  choice: Job
  rationale: Le nom propre est donné sous sa forme française traditionnelle.
- source_word: וַיֹּאמַר
  choice: dit
  rationale: אמר est le verbe courant pour introduire des paroles. « Dit » en conserve la simplicité narrative; associé à « prit la parole », il reflète la formule hébraïque redoublée.
