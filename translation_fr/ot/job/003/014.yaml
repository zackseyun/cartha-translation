  yaml_path: translation/ot/job/003/014.yaml
  text: with kings and counselors of the earth, who built ruins for themselves,
translation:
  language: fr
  text: avec les rois et les conseillers de la terre, qui se bâtissaient des ruines[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui rebâtissaient pour eux-mêmes des lieux dévastés »'
    reason: Le groupe hébreu peut évoquer soit l’édification de constructions vouées à devenir des ruines, soit la reconstruction de lieux déjà dévastés.
lexical_decisions:
- source_word: מְלָכִים
  choice: rois
  rationale: Équivalent direct et naturel du pluriel hébreu.
- source_word: יֹעֲצֵי אָרֶץ
  choice: conseillers de la terre
  rationale: Conserve la portée générale de l’expression hébraïque et son parallélisme avec les rois.
- source_word: הַבֹּנִים חֳרָבוֹת לָמוֹ
  choice: qui se bâtissaient des ruines
  rationale: Reproduit l’image paradoxale de l’hébreu, où le verbe « bâtir » porte sur des « ruines » ou « lieux dévastés », et rend le pronom d’intérêt לָמוֹ par la tournure pronominale française.
theological_decisions:
- issue: Identification des constructions évoquées
  choice: Ne pas préciser qu’il s’agit de tombeaux, de palais ou de villes restaurées.
  alternative: « qui se bâtissaient de grands tombeaux » ou « qui rebâtissaient des lieux dévastés »
  rationale: Le texte hébreu ne nomme pas explicitement des tombeaux et permet plusieurs compréhensions; la traduction conserve donc cette tension.
translation_notes:
  register: Français moderne, sobre et digne. L’expression volontairement frappante « se bâtissaient des ruines » préserve le paradoxe du texte source plutôt que de l’expliquer dans le corps du verset.
