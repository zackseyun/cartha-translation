  text: יִקְּבֻ֥/הוּ אֹרְרֵי י֑וֹם הָ֝/עֲתִידִ֗ים עֹרֵ֥ר לִוְיָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/008.yaml
  text: Let those who curse days curse it, those ready to rouse Leviathan.
translation:
  language: fr
  text: Que le maudissent ceux qui maudissent les jours, ceux qui sont prêts à réveiller Léviathan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרְרֵי יוֹם
  choice: ceux qui maudissent les jours
  rationale: Le syntagme hébreu emploie « jour » sans article et peut désigner ceux dont le rôle est de maudire des jours; le pluriel français exprime naturellement cette portée générale, tandis que le pronom singulier renvoie au jour précis évoqué dans le contexte.
- source_word: הָעֲתִידִים
  choice: ceux qui savent
  rationale: Dans ce contexte, le participe exprime l'aptitude ou la compétence, plutôt qu'une simple disposition momentanée.
- source_word: עֹרֵר
  choice: réveiller
  rationale: L'infinitif signifie éveiller ou susciter; « réveiller » convient à l'image d'une créature redoutable tirée de son repos.
- source_word: לִוְיָתָן
  choice: Léviathan
  rationale: Translittération traditionnelle du nom hébreu, qui préserve l'identité et la charge poétique de la figure sans l'identifier davantage.
theological_decisions:
- issue: Nature de Léviathan
  choice: Conserver « Léviathan » sans explication dans le texte
  alternative: Interpréter comme un monstre marin, un crocodile ou une constellation
  rationale: Le verset ne précise pas ici la nature exacte de Léviathan; la traduction conserve donc l'ambiguïté poétique et mythique du texte.
translation_notes:
  register: Français moderne, poétique et digne. La répétition de « maudissent » reproduit celle de la racine hébraïque. « Le » renvoie au jour de la naissance mentionné au verset 3.
