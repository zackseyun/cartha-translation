  text: לָ֤/מָּה לֹּ֣א מֵ/רֶ֣חֶם אָמ֑וּת מִ/בֶּ֖טֶן יָצָ֣אתִי וְ/אֶגְוָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/011.yaml
  text: Why did I not die from the womb[b][a], and come out from the belly and expire?
translation:
  language: fr
  text: Pourquoi ne suis-je pas mort dès le sein maternel, n’ai-je pas expiré en sortant du ventre de ma mère ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Interrogatif de cause naturel en français, qui conserve la force de la plainte de Job.
- source_word: לֹא
  choice: ne… pas
  rationale: Négation simple portant sur le premier verbe et, par le parallélisme de la question, sur l'issue évoquée dans le second membre.
- source_word: מֵרֶחֶם
  choice: dès le sein maternel
  rationale: רֶחֶם désigne le sein maternel. « Dès » rend ici naturellement le point de départ temporel associé à la mort souhaitée, sans réduire l'image à la seule formule abstraite « à la naissance ».
- source_word: אָמוּת
  choice: ne suis-je pas mort
  rationale: L'imparfait qal à la première personne prend, dans cette plainte rétrospective, la forme idiomatique française d'une question contrefactuelle au passé.
- source_word: מִבֶּטֶן
  choice: du ventre de ma mère
  rationale: בֶּטֶן peut désigner le ventre ou le sein maternel. « Ventre de ma mère » reste concret et distingue ce terme de רֶחֶם dans le membre parallèle.
- source_word: יָצָאתִי
  choice: ne suis-je pas sorti
  rationale: Conserve l'image concrète de la sortie plutôt que de l'interpréter simplement par « naître ».
- source_word: וְאֶגְוָע
  choice: pour expirer
  rationale: גוע est distinct de מות et peut évoquer le fait d'expirer ou de rendre le dernier souffle. La tournure française exprime ici l'issue immédiate souhaitée après la sortie du ventre.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « Pourquoi » explicite en français la portée de l'unique interrogatif hébreu sur les deux membres parallèles. Les deux termes maternels distincts sont rendus par « sein maternel » et « ventre de ma mère ».
