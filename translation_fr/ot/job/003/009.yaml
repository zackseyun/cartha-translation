source:
  edition: WLC
  text: יֶחְשְׁכוּ֮ כּוֹכְבֵ֪י נִ֫שְׁפּ֥/וֹ יְקַו לְ/א֥וֹר וָ/אַ֑יִן וְ/אַל יִ֝רְאֶ֗ה בְּ/עַפְעַפֵּי שָֽׁחַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/009.yaml
  text: May the stars of its twilight be dark[a]; may it wait for light, but there be none[b], and may it not see the eyelids of dawn.
translation:
  language: fr
  text: Que les étoiles de son crépuscule s’obscurcissent[a] ! Qu’elle attende la lumière, mais qu’il n’y en ait pas, et qu’elle ne voie pas les paupières de l’aurore[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les étoiles de son soir ». Le mot hébreu peut désigner le crépuscule, en particulier celui du soir.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les paupières de l’aurore », image poétique hébraïque évoquant l’apparition des premières lueurs du matin.
    reason: cultural_note
lexical_decisions:
- source_word: יֶחְשְׁכוּ
  choice: s’obscurcissent
  rationale: Le qal à valeur volitive, dans ce contexte de malédiction, exprime un souhait. « S’obscurcissent » rend naturellement le devenir ou l’état sombre tout en gardant la force imprécatoire.
- source_word: כּוֹכְבֵי נִשְׁפּוֹ
  choice: les étoiles de son crépuscule
  rationale: L’état construit exige « les étoiles de… », et le suffixe est conservé par « son ». נֶשֶׁף peut désigner le crépuscule, notamment celui du soir ; le contexte des étoiles favorise ici « crépuscule ».
- source_word: יְקַו
  choice: qu’elle attende
  rationale: קוה peut signifier attendre ou espérer. « Attende » exprime ici l’attente déçue de la nuit personnifiée sans ajouter une nuance psychologique excessive.
- source_word: לְאוֹר
  choice: la lumière
  rationale: « Lumière » conserve le sens fondamental et le contraste poétique avec l’obscurité, sans préciser davantage par « lumière du jour ».
- source_word: וָאַיִן
  choice: mais qu’il n’y en ait pas
  rationale: La tournure rend l’attente frustrée et maintient la portée volitive de la malédiction. Le pronom « en » reprend naturellement « la lumière » en français.
- source_word: וְאַל־יִרְאֶה
  choice: et qu’elle ne voie pas
  rationale: אַל suivi de l’imparfait exprime une défense ou un souhait négatif ; dans cette imprécation, « qu’elle ne voie pas » en conserve la force.
- source_word: בְּעַפְעַפֵּי שָׁחַר
  choice: les paupières de l’aurore
  rationale: La traduction littérale préserve l’image poétique hébraïque de l’aurore qui ouvre les yeux, image désignant les premières lueurs du matin.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La nuit, antécédent implicite dans le contexte, est reprise par le féminin « elle ». Les exclamations rendent la série de souhaits imprécatoires. L’image concrète des « paupières de l’aurore » est conservée plutôt qu’explicitée dans le corps du texte.
