source:
  edition: WLC
  text: שָׁ֣ם רְ֭שָׁעִים חָ֣דְלוּ רֹ֑גֶז וְ/שָׁ֥ם יָ֝נ֗וּחוּ יְגִ֣יעֵי כֹֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/017.yaml
  text: There the wicked cease from turmoil[b][a], and there those weary in strength find rest.
translation:
  language: fr
  text: Là, les méchants cessent de s’agiter[a], et là se reposent ceux dont les forces sont épuisées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cessent de semer le trouble », « cessent leur rage » ou « cessent d’être en proie à l’agitation ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « les épuisés de force », c’est-à-dire ceux qui n’ont plus de forces.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Là
  rationale: Adverbe locatif simple et naturel, répété dans les deux membres pour conserver le parallélisme poétique.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Rend directement le substantif désignant les personnes moralement mauvaises, sans explicitation doctrinale.
- source_word: חָדְלוּ
  choice: cessent
  rationale: Le présent convient à la description générale du lieu évoqué dans la lamentation, tout en gardant le sens de « cesser ».
- source_word: רֹגֶז
  choice: de s’agiter
  rationale: Le nom peut évoquer agitation, trouble ou rage. La tournure verbale française est naturelle et préserve l’idée d’une activité turbulente sans la réduire à la seule colère.
- source_word: וְשָׁם
  choice: et là
  rationale: Conserve la conjonction, la répétition du locatif et l’équilibre du vers hébreu.
- source_word: יָנוּחוּ
  choice: se reposent
  rationale: Rend simplement נוח, « se reposer, être au repos », dans un français courant et digne.
- source_word: יְגִיעֵי כֹחַ
  choice: ceux dont les forces sont épuisées
  rationale: Exprime naturellement l’expression littérale « les épuisés de force » tout en maintenant la référence explicite à la force.
theological_decisions: []
translation_notes:
  register: Français moderne international, poétique mais immédiatement compréhensible. Le parallélisme « Là… et là… » est maintenu, ainsi que l’ambiguïté de רֹגֶז au moyen d’une note.
