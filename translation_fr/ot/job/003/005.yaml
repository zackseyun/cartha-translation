source:
  edition: WLC
  text: יִגְאָלֻ֡/הוּ חֹ֣שֶׁךְ וְ֭/צַלְמָוֶת תִּשְׁכָּן עָלָ֣י/ו עֲנָנָ֑ה יְ֝בַעֲתֻ֗/הוּ כִּֽמְרִ֥ירֵי יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/005.yaml
  text: May darkness and deep shadow reclaim it[a]; may a cloud dwell over it[b]; may the blacknesses of the day terrify it.
translation:
  language: fr
  text: Que les ténèbres et l’ombre profonde[a] le reprennent ! Qu’une nuée demeure sur lui ! Que les obscurités du jour l’épouvantent[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ombre de la mort » ou « l’obscurité profonde » pour צַלְמָוֶת.
    reason: lexical_alternative
  - marker: b
    text: L’expression « les obscurités du jour » est difficile. Elle peut aussi se comprendre comme « l’obscurité du jour », « les éclipses du jour » ou, moins probablement, « les amertumes du jour ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְאָלֻהוּ
  choice: le reprennent
  rationale: Le verbe גאל évoque ici l’action de reprendre ou de réclamer comme sien. « Le reprennent » conserve l’idée que les ténèbres récupèrent ce jour, sans les connotations positives que « rachètent » aurait en français.
- source_word: חֹשֶׁךְ
  choice: les ténèbres
  rationale: Rendu courant et soutenu de l’obscurité, approprié à l’image poétique de l’effacement du jour de la naissance.
- source_word: צַלְמָוֶת
  choice: l’ombre profonde
  rationale: Le terme peut désigner l’ombre de la mort ou une obscurité très profonde. « Ombre profonde » préserve l’image et l’ambiguïté sans imposer explicitement la mort.
- source_word: תִּשְׁכָּן עָלָיו
  choice: demeure au-dessus de lui
  rationale: שׁכן signifie demeurer, résider ou s’établir. La formulation conserve cette durée tout en exprimant naturellement la position de la nuée au-dessus du jour.
- source_word: עֲנָנָה
  choice: une nuée
  rationale: Le singulier désigne une masse nuageuse. « Nuée » convient au registre poétique et reste immédiatement compréhensible.
- source_word: יְבַעֲתֻהוּ
  choice: l’épouvantent
  rationale: Le piel de בעת exprime le fait de frapper de terreur. « Épouvanter » restitue cette forte intensité.
- source_word: כִּמְרִירֵי יוֹם
  choice: les obscurités du jour
  rationale: L’expression est difficile. Dans ce contexte dominé par les ténèbres, la nuée et l’effacement du jour, elle désigne probablement des assombrissements ou des noirceurs. « Obscurités » garde le pluriel hébreu sans produire le français peu naturel « noirceurs du jour ».
