  text: הַֽ/מְחַכִּ֣ים לַ/מָּ֣וֶת וְ/אֵינֶ֑/נּוּ וַֽ֝/יַּחְפְּרֻ֗/הוּ מִ/מַּטְמוֹנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/021.yaml
  text: who wait for death[a], but it does not come, and dig for it more than for hidden treasures,
translation:
  language: fr
  text: 'qui attendent la mort[a], mais elle ne vient pas,

    et qui creusent pour la trouver plus que pour des trésors cachés,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et elle n’est pas là » ; l’hébreu dit littéralement « et elle n’est pas », c’est-à-dire que la mort ne se présente pas ou n’arrive pas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְחַכִּים
  choice: qui attendent
  rationale: Le participe de חכה exprime l’attente, souvent empreinte d’espoir ou d’impatience. « Attendent » en conserve le sens premier sans transformer explicitement l’attente en désir.
- source_word: לַמָּוֶת
  choice: la mort
  rationale: 'Le complément introduit par ל désigne ce qui est attendu : la mort.'
- source_word: וְאֵינֶנּוּ
  choice: mais elle ne vient pas
  rationale: Littéralement, « et elle n’est pas » ou « et elle n’est pas là », le suffixe masculin singulier renvoyant à la mort en hébreu. Dans ce contexte, l’expression signifie naturellement qu’elle ne se présente pas; « mais elle ne vient pas » explicite sobrement cette implication.
- source_word: וַיַּחְפְּרֻהוּ
  choice: et qui creusent pour la trouver
  rationale: חפר signifie d’abord « creuser ». L’ajout de « pour la trouver » rend en français la valeur du pronom objet tout en préservant l’image concrète d’une recherche par excavation.
- source_word: מִמַּטְמוֹנִים
  choice: plus que pour des trésors cachés
  rationale: מַטְמוֹן désigne un trésor caché ou enfoui. Le מִן a ici une valeur comparative, et « trésors cachés » maintient le lien avec l’image de l’action de creuser.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La tournure conserve le parallélisme ainsi que l’image frappante de personnes creusant à la recherche de la mort comme on chercherait des trésors enfouis.
