lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: qui se réjouissent
  rationale: L’article suivi du participe a une valeur substantivale et poursuit la description commencée au verset précédent. Cette tournure relative est naturelle en français et conserve l’idée d’une joie éprouvée.
- source_word: אֱלֵי גִיל
  choice: à l’extrême
  rationale: L’expression, littéralement « vers/jusqu’à l’exultation », intensifie ici le verbe précédent. « À l’extrême » rend cette force idiomatique sans alourdir le vers poétique.
- source_word: יָשִׂישׂוּ
  choice: qui exultent
  rationale: Le verbe renchérit sur la joie déjà exprimée. « Exultent » maintient cette intensification poétique et évite de rendre les deux verbes hébreux de la même manière.
- source_word: כִּי
  choice: quand
  rationale: La conjonction introduit naturellement la circonstance qui suscite leur exultation. Une lecture causale, « parce que », demeure toutefois possible et est signalée en note.
- source_word: יִמְצְאוּ
  choice: ils trouvent
  rationale: « Trouver » rend directement le verbe hébreu et en conserve la simplicité saisissante dans ce contexte.
- source_word: קָבֶר
  choice: la tombe
  rationale: « La tombe » est une expression française naturelle pour désigner de manière générique l’aboutissement dans la mort. L’indéfini « une tombe » reste grammaticalement possible.
