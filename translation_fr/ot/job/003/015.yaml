source:
  edition: WLC
  text: א֣וֹ עִם שָׂ֭רִים זָהָ֣ב לָ/הֶ֑ם הַֽ/מְמַלְאִ֖ים בָּתֵּי/הֶ֣ם כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/015.yaml
  text: or with princes who had gold[b][a], who filled their houses with silver—
translation:
  language: fr
  text: 'ou avec des princes qui possédaient de l’or[a],

    qui remplissaient leurs maisons d’argent—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dignitaires » ou « dirigeants » pour « princes » (שָׂרִים).
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: ou
  rationale: Poursuit simplement la série d’éventualités irréalisées évoquées par Job aux versets 13 à 16.
- source_word: עִם
  choice: avec
  rationale: Exprime directement la compagnie des grands personnages morts auprès desquels Job imagine reposer.
- source_word: שָׂרִים
  choice: princes
  rationale: Désigne des personnages de haut rang; « princes » conserve le registre poétique élevé, tandis que « dirigeants » ou « dignitaires » restent possibles.
- source_word: זָהָב לָהֶם
  choice: qui possédaient de l’or
  rationale: Rend naturellement la construction hébraïque exprimant la possession, sans l’aplatir en simple qualification.
- source_word: הַֽמְמַלְאִ֖ים
  choice: qui remplissaient
  rationale: Le participe décrit les princes; l’imparfait français convient à cette évocation de personnages du passé.
- source_word: בָּתֵּי/הֶם
  choice: leurs maisons
  rationale: Traduit le nom concret sans préciser indûment « palais », même si le contexte évoque de puissants personnages.
- source_word: כָּֽסֶף
  choice: argent
  rationale: Dans ce parallèle avec l’or, le terme désigne le métal précieux plutôt que la monnaie au sens abstrait.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme entre l’or et l’argent est conservé, ainsi que le tiret final indiquant la continuation de la phrase. « Maisons » reste fidèle à l’hébreu et évite l’interprétation plus précise « palais ».
