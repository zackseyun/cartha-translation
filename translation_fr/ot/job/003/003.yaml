  text: יֹ֣אבַד י֭וֹם אִוָּ֣לֶד בּ֑/וֹ וְ/הַ/לַּ֥יְלָה אָ֝מַ֗ר הֹ֣רָה גָֽבֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/003.yaml
  text: May the day perish on which I was born[a], and the night that said, ‘A man is conceived.’
translation:
  language: fr
  text: 'Que périssent le jour où je suis né et la nuit qui a dit : « Un homme[a] a été conçu ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un enfant mâle » ; dans ce contexte, le mot hébreu peut désigner un enfant de sexe masculin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאבַד
  choice: Périsse
  rationale: 'Le subjonctif employé seul rend avec concision la valeur jussive et imprécatoire : Job formule une malédiction, non une simple prédiction.'
- source_word: יוֹם
  choice: le jour
  rationale: Le contexte désigne le jour précis de la naissance de Job, d’où l’article défini.
- source_word: אִוָּלֶד בּוֹ
  choice: où je suis né
  rationale: Le niphal de ילד exprime ici la naissance subie par le locuteur. « Le jour où » est la tournure française naturelle.
- source_word: וְהַלַּיְלָה
  choice: et la nuit
  rationale: La conjonction coordonne la nuit au jour comme second objet de la malédiction.
- source_word: אָמַר
  choice: qui a dit
  rationale: Cette formulation conserve la personnification de la nuit, présentée comme annonçant la conception.
- source_word: הֹרָה
  choice: a été conçu
  rationale: La tournure passive convient au contexte d’une annonce de conception et évite de faire de la nuit le sujet qui conçoit.
- source_word: גָבֶר
  choice: un homme
  rationale: גָבֶר désigne explicitement un être humain de sexe masculin. « Un homme » conserve le terme hébreu de près, tandis que le contexte permet aussi de comprendre « un enfant mâle », signalé en note.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. L’ordre parallèle « le jour… et la nuit… » ainsi que la personnification de la nuit sont conservés. Le point d’exclamation dans la citation marque la forme d’annonce sans atténuer la violence de l’imprécation.
