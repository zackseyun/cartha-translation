  yaml_path: translation/ot/job/003/023.yaml
  text: to a man whose way is hidden[b][a], and whom God has hedged in?
translation:
  language: fr
  text: à l’homme dont le chemin est caché[a], et que Dieu a entouré d’une haie[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dont la route est dissimulée ».
    reason: lexical_alternative
  - marker: b
    text: Ou « que Dieu a enfermé » ou « que Dieu a encerclé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְגֶבֶר
  choice: à l’homme
  rationale: La préposition לְ rattache ce membre à la question commencée au verset 20 (« Pourquoi donne-t-il la lumière… ? »). Le masculin singulier גֶּבֶר est conservé par « l’homme ».
- source_word: דַּרְכּוֹ נִסְתָּרָה
  choice: dont le chemin est caché
  rationale: « Chemin » maintient la métaphore de דֶּרֶךְ, qui peut désigner le parcours de vie. Le passif statif « est caché » préserve l’ambiguïté quant à celui auquel ce chemin échappe.
- source_word: וַיָּסֶךְ ... בַּעֲדוֹ
  choice: et que ... a enfermé de toutes parts
  rationale: Le verbe et la préposition expriment l’idée d’entourer ou de fermer toute issue. Cette formulation est naturelle en français et garde l’image d’un homme bloqué.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Ce nom poétique singulier, fréquent dans Job, désigne Dieu sans comporter le sens particulier de « Tout-Puissant ».
theological_decisions:
- issue: Agent de l’enfermement
  choice: Dieu demeure explicitement le sujet de l’action.
  alternative: Une tournure passive qui atténuerait ou supprimerait l’action divine.
  rationale: Le texte hébreu nomme expressément אֱלוֹהַּ comme sujet; la plainte de Job ne doit donc pas être adoucie.
- issue: Sens du chemin caché
  choice: La formulation conserve l’ambiguïté de « dont le chemin est caché ».
  alternative: Préciser que l’homme ne voit plus son avenir ou que Dieu lui dissimule sa route.
  rationale: Le texte ne précise ni à qui le chemin est caché ni exactement en quel sens; expliciter trancherait indûment.
translation_notes:
  register: Français moderne, digne et lisible. Le verset reste syntaxiquement rattaché à la question commencée au verset 20. « Enfermé de toutes parts » rend naturellement l’image d’un encerclement sans effacer l’action explicite de Dieu.
