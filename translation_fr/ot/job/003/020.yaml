  text: לָ֤/מָּה יִתֵּ֣ן לְ/עָמֵ֣ל א֑וֹר וְ֝/חַיִּ֗ים לְ/מָ֣רֵי נָֽפֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/020.yaml
  text: Why is light given to the troubled[b][a], and life to the bitter in soul?
translation:
  language: fr
  text: Pourquoi la lumière[b] est-elle donnée au malheureux[a], et la vie à ceux qui ont l’âme amère ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi donne-t-il la lumière au malheureux, et la vie à ceux qui ont l’âme amère ? » L’hébreu ne précise pas qui donne, même si le contexte laisse probablement entendre qu’il s’agit de Dieu.'
    reason: alternative_reading
  - marker: b
    text: « Lumière » est une image poétique de l’existence continuée ; l’hébreu conserve cette métaphore au lieu de dire directement « vie » dans le premier membre.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Rend directement l’adverbe interrogatif qui ouvre la plainte de Job, avec sa force poétique.
- source_word: יִתֵּן
  choice: est-elle donnée
  rationale: Bien que l’hébreu emploie un verbe actif à la troisième personne du masculin singulier, le sujet n’est pas exprimé. Le passif français garde le donateur implicite sans ajouter explicitement Dieu.
- source_word: לְעָמֵל
  choice: au malheureux
  rationale: עָמֵל désigne ici une personne accablée par la peine ou la misère, plutôt qu’un simple travailleur. « Malheureux » est naturel et convient au contexte de la lamentation.
- source_word: אוֹר
  choice: la lumière
  rationale: Conserve l’image poétique hébraïque de la lumière, qui évoque ici la poursuite de l’existence, sans la remplacer par une explication.
- source_word: וְחַיִּים
  choice: et la vie
  rationale: חַיִּים a une forme plurielle en hébreu, mais désigne idiomatiquement la vie; le singulier est l’équivalent français naturel.
- source_word: לְמָרֵי נָפֶשׁ
  choice: à ceux qui ont l’amertume dans l’âme
  rationale: Cette formulation française naturelle préserve à la fois l’amertume profonde et la référence à l’être intérieur exprimée par נֶפֶשׁ.
theological_decisions:
- issue: Sujet implicite de יִתֵּן
  choice: Laisser le donateur implicite au moyen du passif « est-elle donnée ».
  alternative: « Pourquoi donne-t-il… ? » ou « Pourquoi Dieu donne-t-il… ? »
  rationale: Le contexte suggère probablement Dieu, mais le verset ne le nomme pas. Le passif maintient l’ambiguïté et la tension théologique de la plainte sans rendre l’accusation plus explicite que l’hébreu.
translation_notes:
  register: Français international moderne, poétique et digne. La métaphore de la lumière et l’expression liée à l’âme sont conservées, tandis que la syntaxe reste claire pour un lectorat général.
