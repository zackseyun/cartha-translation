  yaml_path: translation/ot/job/003/018.yaml
  text: There the prisoners are at ease together[a]; they do not hear the voice of the taskmaster.
translation:
  language: fr
  text: Là, les prisonniers sont tous tranquilles ; ils n’entendent pas la voix de l’oppresseur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du surveillant » ou « de celui qui exige son dû ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: tous
  rationale: L’adverbe exprime ici la condition commune des prisonniers. « Tous » s’intègre naturellement au français tout en conservant l’idée collective de « ensemble ».
- source_word: אֲסִירִים
  choice: les prisonniers
  rationale: Le terme désigne des personnes détenues ou liées. « Les prisonniers » est clair, actuel et convient au tableau du séjour des morts où les contraintes terrestres ont cessé.
- source_word: שַׁאֲנָנוּ
  choice: sont tranquilles
  rationale: Le verbe évoque le calme et l’absence de trouble. « Sont tranquilles » rend cet état sans lui donner le sens plus précis d’un repos physique.
- source_word: לֹא שָׁמְעוּ
  choice: ils n’entendent plus
  rationale: Dans ce contexte poétique décrivant l’état des morts, le qatal peut avoir une valeur résultative ou présente. « N’entendent plus » exprime naturellement la cessation durable de l’autorité auparavant subie, bien que le sens formel soit « ils n’entendent pas ».
- source_word: קוֹל
  choice: la voix
  rationale: « La voix » rend directement le nom hébreu et désigne ici les ordres ou exigences audibles de celui qui contraint.
- source_word: נֹגֵשׂ
  choice: celui qui les contraint
  rationale: Le participe désigne celui qui presse, impose un travail ou exige un paiement. Cette formulation reste concrète sans limiter indûment le référent à un surveillant d’esclaves ou à un collecteur.
