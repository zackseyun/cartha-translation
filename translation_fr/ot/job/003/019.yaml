source:
  edition: WLC
  text: קָטֹ֣ן וְ֭/גָדוֹל שָׁ֣ם ה֑וּא וְ֝/עֶ֗בֶד חָפְשִׁ֥י מֵ/אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/019.yaml
  text: The small and the great are there[a], and the servant is free from his master.
translation:
  language: fr
  text: Le petit et le grand sont là, et l’esclave[a] est libre de son maître.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi se traduire par « serviteur » ; ici, le contraste avec le fait d’être libre de son maître met en avant la condition d’esclave.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹן
  choice: le petit
  rationale: En opposition à גָדוֹל, le terme désigne ici surtout une personne de faible rang ou de peu d’importance. « Le petit » conserve la formulation concise et le contraste social de l’hébreu.
- source_word: גָדוֹל
  choice: le grand
  rationale: Mis en contraste avec קָטֹן, le terme désigne une personne importante ou de rang élevé. « Le grand » forme en français une paire naturelle avec « le petit ».
- source_word: שָׁם
  choice: là
  rationale: L’adverbe renvoie au lieu évoqué dans le contexte précédent, le séjour des morts, sans l’expliciter davantage que l’hébreu.
- source_word: הוּא
  choice: sont
  rationale: Le pronom singulier reprend collectivement la paire « le petit et le grand ». Le pluriel est nécessaire dans une formulation française naturelle, sans ajouter l’idée explicite de « pareillement ».
- source_word: עֶבֶד
  choice: l’esclave
  rationale: Le mot peut désigner un serviteur ou un esclave. Le contraste direct avec la liberté et avec un maître met ici en relief la condition servile, ce que rend clairement « esclave ».
- source_word: חָפְשִׁי
  choice: libre
  rationale: L’adjectif exprime directement l’absence de sujétion, en contraste avec la condition d’esclave.
- source_word: מֵאֲדֹנָיו
  choice: de son maître
  rationale: La préposition marque la séparation, et אֲדוֹן désigne ici le maître humain de l’esclave. La tournure concise « libre de son maître » reproduit ce rapport sans introduire l’idée plus précise d’un affranchissement juridique.
theological_decisions: []
