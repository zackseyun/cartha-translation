  text: לֹ֤א שָׁלַ֨וְתִּי וְ/לֹ֖א שָׁקַ֥טְתִּי וְֽ/לֹא נָ֗חְתִּי וַ/יָּ֥בֹא רֹֽגֶז׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/003/026.yaml
  text: I was not at ease[a], and I was not quiet; I was not at rest[b], and turmoil came.
translation:
  language: fr
  text: Je n’ai pas été tranquille[a], je n’ai pas eu de calme, je ne me suis pas reposé ; et l’agitation est venue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je n’ai pas été en paix, je n’ai pas été tranquille, je ne me suis pas reposé ». L’hébreu emploie trois verbes de sens voisin pour intensifier l’absence totale de répit éprouvée par Job.
    reason: lexical_alternative
  - marker: b
    text: Ou « le trouble est venu » ou « le tumulte est venu ». Le nom hébreu peut désigner l’agitation, le trouble ou le bouleversement.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַוְתִּי
  choice: je n’ai connu ni tranquillité
  rationale: שׁלה/שׁלו évoque la tranquillité, l’aisance ou une sécurité sans perturbation. « Connaître la tranquillité » est naturel en français et s’intègre à la triple négation.
- source_word: שָׁקַטְתִּי
  choice: ni calme
  rationale: שׁקט désigne le calme ou l’absence de perturbation. « Calme » reste distinct de « tranquillité » tout en maintenant le parallélisme.
- source_word: נָחְתִּי
  choice: ni repos
  rationale: נוח signifie se reposer ou trouver du repos. « Repos » forme le troisième terme, plus concret, de la progression.
- source_word: רֹגֶז
  choice: l’agitation
  rationale: רֹגֶז peut désigner l’agitation, le trouble, le tumulte ou le frémissement. « Agitation » conserve ici l’idée d’un bouleversement sans la réduire à la colère.
- source_word: וַיָּבֹא
  choice: est venue
  rationale: Le verbe exprime simplement la venue de רֹגֶז. Aucun complément comme « sur moi » n’est ajouté, puisqu’il n’est pas explicite dans l’hébreu.
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: ni ... ni ... ni ...
  rationale: La triple coordination négative reproduit de façon idiomatique en français l’insistance rythmique des trois négations hébraïques.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La formulation nominale « ni tranquillité, ni calme, ni repos » rend la triple négation avec une cadence naturelle, tandis que le point-virgule marque le passage à l’arrivée soudaine de l’agitation.
