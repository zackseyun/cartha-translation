source:
  edition: WLC
  text: כִּֽי לִ/פְנֵ֣י לַ֭חְמִ/י אַנְחָתִ֣/י תָבֹ֑א וַֽ/יִּתְּכ֥וּ כַ֝/מַּ֗יִם שַׁאֲגֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/024.yaml
  text: For my sighing comes before my bread[b][a], and my groanings pour out like water.
translation:
  language: fr
  text: Car mes soupirs viennent avant mon pain[a], et mes cris[b] se déversent comme de l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma nourriture » ; en hébreu, le mot « pain » peut désigner plus largement ce que l’on mange.
    reason: lexical_alternative
  - marker: b
    text: Ou « mes rugissements » ; le terme hébreu peut évoquer le cri puissant d’un animal, ce qui intensifie l’expression de l’angoisse de Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication de la détresse que Job vient d’évoquer.
- source_word: לִפְנֵי
  choice: avant
  rationale: 'La préposition exprime naturellement l’antériorité : les soupirs précèdent le fait de manger.'
- source_word: לַחְמִי
  choice: mon pain
  rationale: Le sens concret de « pain » préserve l’image hébraïque, tout en pouvant désigner plus largement la nourriture.
- source_word: אַנְחָתִי
  choice: mes soupirs
  rationale: Le nom désigne les soupirs ou gémissements causés par la détresse. Le pluriel français rend naturellement la valeur collective du singulier hébreu.
- source_word: תָבֹא
  choice: viennent
  rationale: Le présent convient à la plainte poétique et présente cette souffrance comme habituelle ou persistante.
- source_word: וַיִּתְּכוּ
  choice: se déversent
  rationale: Le verbe évoque un écoulement abondant; cette tournure conserve l’image vive sans imposer une voix passive.
- source_word: כַמַּיִם
  choice: comme de l’eau
  rationale: La comparaison directe avec l’eau est conservée.
- source_word: שַׁאֲגֹתָי
  choice: mes cris
  rationale: Le terme peut évoquer des rugissements ou de puissants cris. « Cris » est naturel en français et laisse la note restituer la force animale du mot.
