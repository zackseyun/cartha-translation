id: JOB.3.13
reference: Job 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי עַ֭תָּה שָׁכַ֣בְתִּי וְ/אֶשְׁק֑וֹט יָ֝שַׁ֗נְתִּי אָ֤ז יָנ֬וּחַֽ לִֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/013.yaml
  text: For now I would have lain down and been quiet[b][a]; I would have slept—then I would have been at rest.
translation:
  language: fr
  text: Car maintenant, je serais couché, tranquille[a] ; je dormirais, et alors j’aurais du repos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sans trouble » ; autre traduction possible : « en paix ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « alors il y aurait du repos pour moi » ; autre traduction possible : « alors je serais en repos ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication du souhait exprimé dans le contexte précédent.
- source_word: עַתָּה
  choice: maintenant
  rationale: L’adverbe situe dans le présent la conséquence irréelle de ce qui se serait produit si Job était mort à sa naissance.
- source_word: שָׁכַבְתִּי
  choice: je serais couché
  rationale: Le verbe conserve l’image corporelle de quelqu’un qui s’allonge, ici associée poétiquement à la mort, tandis que le conditionnel rend l’irréel du contexte.
- source_word: וְאֶשְׁקֹט
  choice: tranquille
  rationale: שׁקט évoque le calme et l’absence de trouble. Cette formulation française est naturelle et reste moins interprétative que « en paix ».
- source_word: יָשַׁנְתִּי
  choice: je dormirais
  rationale: Le verbe ordinaire « dormir » préserve la métaphore du texte sans la remplacer explicitement par la mort.
- source_word: אָז
  choice: alors
  rationale: L’adverbe marque l’étape consécutive dans la progression poétique.
- source_word: יָנוּחַ לִי
  choice: j’aurais du repos
  rationale: Cette tournure rend naturellement la construction avec לִי, littéralement « il y aurait du repos pour moi », tout en la distinguant de « tranquille ».
theological_decisions:
- issue: L’image de la mort exprimée par le coucher, le sommeil et le repos
  choice: Conserver les images concrètes de se coucher, dormir et avoir du repos, sans expliciter la mort dans le verset.
  alternative: Traduire directement par « je serais mort » ou développer en « je reposerais dans la mort ».
  rationale: L’hébreu évoque poétiquement la mort au moyen de verbes ordinaires. Maintenir ces images préserve la tension du texte sans lui imposer une doctrine précise sur l’état des morts.
translation_notes:
  register: Français international moderne, sobre et poétique. Le conditionnel exprime clairement la situation irréelle sous-entendue par le contexte, tout en conservant le parallélisme hébreu.
