source:
  edition: WLC
  text: כִּ֤י לֹ֣א סָ֭גַר דַּלְתֵ֣י בִטְנִ֑/י וַ/יַּסְתֵּ֥ר עָ֝מָ֗ל מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/010.yaml
  text: because it did not shut the doors of my womb[b][a], nor hide trouble from my eyes.
translation:
  language: fr
  text: parce qu’elle n’a pas fermé les portes du ventre qui m’a porté[a], ni caché la souffrance à mes yeux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les portes de mon ventre ». Il s’agit ici du ventre maternel qui a porté Job.'
    reason: lexical_alternative
  - marker: b
    text: Le terme peut aussi désigner la peine, le malheur, la misère ou le pénible labeur.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: parce que
  rationale: Introduit la raison de la malédiction prononcée dans le contexte immédiat et conserve clairement la valeur causale.
- source_word: סָגַר
  choice: fermé
  rationale: Rend directement l’action de fermer et s’emploie naturellement avec « portes ».
- source_word: דַּלְתֵי
  choice: les portes
  rationale: Conserve l’image concrète des battants qui auraient dû empêcher la naissance.
- source_word: בִטְנִי
  choice: du ventre qui m’a porté
  rationale: Le suffixe hébreu signifie littéralement « mon ventre », mais il désigne ici le ventre maternel d’où Job est né. Cette formulation française rend le référent sans donner à entendre que Job possède lui-même un utérus.
- source_word: וַיַּסְתֵּר
  choice: ni caché
  rationale: La négation du premier membre porte naturellement sur le second; « ni » reproduit cette coordination en français.
- source_word: עָמָל
  choice: la souffrance
  rationale: Le mot couvre la peine, le malheur, la misère ou le pénible labeur. Dans la plainte de Job, « souffrance » exprime naturellement le mal éprouvé tout en restant assez large.
- source_word: מֵעֵינָי
  choice: à mes yeux
  rationale: Conserve l’image hébraïque de ce qui aurait été soustrait au regard de Job, c’est-à-dire à son expérience.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La métaphore des « portes » est conservée, tandis que « du ventre qui m’a porté » explicite juste assez le référent maternel pour éviter une formulation française trompeuse.
