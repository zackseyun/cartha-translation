  yaml_path: translation/ot/job/003/001.yaml
  text: After this[a], Job opened his mouth and cursed his day.
translation:
  language: fr
  text: Après cela, Job ouvrit la bouche et maudit son jour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire le jour de sa naissance. L’hébreu dit littéralement : « son jour ».'
    reason: clarification_contextuelle
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: Après cela
  rationale: 'Cette expression marque naturellement la succession temporelle : « après cela » rend le lien narratif avec ce qui précède dans un français moderne et digne.'
- source_word: פָּתַח ... אֶת פִּיהוּ
  choice: ouvrit la bouche
  rationale: L’expression hébraïque introduit une prise de parole solennelle. La conserver respecte son relief rhétorique sans la réduire à « se mit à parler ».
- source_word: אִיּוֹב
  choice: Job
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וַיְקַלֵּל
  choice: maudit
  rationale: Le piel de קלל signifie ici « maudire ». Ce choix conserve la force abrupte du texte sans l’atténuer.
- source_word: אֶת יוֹמוֹ
  choice: son jour
  rationale: L’hébreu dit littéralement « son jour ». Le contexte précise ensuite qu’il s’agit du jour de sa naissance ; la formulation concise préserve ici la progression du texte.
theological_decisions:
- issue: Faut-il préciser dans le texte principal que « son jour » désigne le jour de la naissance de Job ?
  choice: Conserver l’expression concise « son jour » dans le texte principal.
  alternative: « le jour de sa naissance » ou « son jour de naissance »
  rationale: Ce verset ne contient pas explicitement le mot « naissance », même si la suite rend ce sens manifeste. Garder « son jour » évite d’anticiper l’explication donnée par le contexte et préserve l’ambiguïté limitée de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et littéraire. Le passé simple convient au registre narratif biblique sans être archaïque. L’idiome « ouvrit la bouche » est maintenu pour sa solennité.
