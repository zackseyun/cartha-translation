  yaml_path: translation/ot/job/003/012.yaml
  text: Why did knees receive me[a], and why breasts[b], that I should nurse?
translation:
  language: fr
  text: Pourquoi des genoux m’ont-ils reçu[a], et pourquoi des seins, pour que je tète[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « genoux » évoquent probablement le nouveau-né reçu sur les genoux ou dans le giron à sa naissance.
    reason: cultural_note
  - marker: b
    text: 'Le verbe hébreu désigne l’action du nourrisson qui tire le lait du sein ; on pourrait aussi traduire : « pour que je puisse téter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: L’adverbe interrogatif introduit directement la lamentation de Job ; « Pourquoi » en restitue la force avec naturel.
- source_word: קִדְּמוּנִי
  choice: m’ont-ils accueilli
  rationale: Le verbe קדם signifie ici venir à la rencontre de quelqu’un ou le recevoir. Avec « genoux », « accueillir » rend l’image du nouveau-né reçu à sa naissance sans la développer dans le corps du texte.
- source_word: בִרְכָּיִם
  choice: des genoux
  rationale: Le pluriel concret de l’hébreu est conservé. L’image peut évoquer le nouveau-né reçu sur les genoux ou dans le giron, ce qu’explicite la note.
- source_word: וּמַה
  choice: et pourquoi
  rationale: Littéralement « et quoi », l’expression reprend ici la question causale du premier membre dans un parallélisme ; « et pourquoi » est idiomatique en français.
- source_word: שָׁדַיִם
  choice: des seins
  rationale: Le terme anatomique direct est clair et fidèle. Préciser « maternels » ajouterait une information implicite mais non exprimée dans l’hébreu.
- source_word: כִּי
  choice: pour que
  rationale: Dans ce contexte, la conjonction introduit la finalité ou le résultat lié à la présence des seins ; « pour que » conserve cette relation.
- source_word: אִינָק
  choice: je tète
  rationale: Le verbe désigne l’action du nourrisson qui tire le lait du sein. « Téter » est précis, naturel et évite l’ambiguïté française de « nourrir » ou « allaiter », qui désignent normalement l’action de la mère.
