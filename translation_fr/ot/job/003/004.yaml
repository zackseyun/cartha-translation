source:
  edition: WLC
  text: הַ/יּ֥וֹם הַ/ה֗וּא יְֽהִ֫י חֹ֥שֶׁךְ אַֽל יִדְרְשֵׁ֣/הוּ אֱל֣וֹהַּ מִ/מָּ֑עַל וְ/אַל תּוֹפַ֖ע עָלָ֣י/ו נְהָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/004.yaml
  text: May that day be darkness[a]; may God above not seek it[b], and may no light shine upon it.
translation:
  language: fr
  text: Que ce jour-là soit ténèbres ! Que Dieu d’en haut ne le recherche pas[a], et qu’aucune lumière ne brille sur lui[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne s’en soucie pas ». Le verbe hébreu peut signifier rechercher, s’enquérir de ou se soucier de.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aucune clarté » ou « aucune splendeur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַהוּא
  choice: ce jour
  rationale: Le démonstratif renvoie au jour de la naissance de Job déjà évoqué. « Ce jour » est naturel en français et maintient ce lien contextuel.
- source_word: יְהִי חֹשֶׁךְ
  choice: soit ténèbres
  rationale: Le subjonctif à valeur optative restitue l’imprécation exprimée par le jussif. L’emploi nominal de « ténèbres » conserve la formulation dense et poétique de l’hébreu.
- source_word: יִדְרְשֵׁהוּ
  choice: ne s’en soucie pas
  rationale: Dans ce contexte, דרש évoque le fait de rechercher, de prendre en considération ou de s’occuper de ce jour. « Ne s’en soucie pas » rend clairement l’idée d’une absence d’attention divine, tandis que la note conserve le sens plus littéral « ne le recherche pas ».
- source_word: אֱלוֹהַּ מִמָּעַל
  choice: Dieu, d’en haut
  rationale: אֱלוֹהַּ désigne explicitement Dieu, et מִמָּעַל exprime sa position « d’en haut ». La ponctuation évite de transformer « d’en haut » en épithète figée.
- source_word: תּוֹפַע
  choice: brille
  rationale: Le verbe יפע exprime ici l’apparition éclatante de la lumière. « Briller » est idiomatique et convient au parallélisme poétique.
- source_word: נְהָרָה
  choice: lumière
  rationale: Le nom rare désigne la lumière, la clarté ou la splendeur. « Lumière » est naturel et suffisamment large; les nuances possibles sont signalées en note.
- source_word: עָלָיו
  choice: sur lui
  rationale: Le pronom masculin singulier reprend « ce jour », qui est masculin en français comme en hébreu.
theological_decisions:
- issue: Mention de Dieu dans une imprécation
  choice: Conserver la référence directe à « Dieu, d’en haut »
  alternative: Employer une tournure impersonnelle telle que « le ciel »
  rationale: Le texte hébreu nomme explicitement Dieu. La traduction préserve donc sans l’atténuer l’audace de la lamentation de Job.
- issue: Sens de la sollicitude divine exprimée par דרש
  choice: « ne s’en soucie pas » dans le texte, avec l’alternative littérale en note
  alternative: « ne le recherche pas »
  rationale: La lecture contextuelle suggère que Job souhaite que Dieu ne prête aucune attention à ce jour. La note maintient toutefois l’ambiguïté lexicale du verbe, sans imposer une interprétation unique.
translation_notes:
  register: Français moderne, poétique et digne. Les exclamations rendent la force imprécatoire du verset sans archaïsme. La formulation conserve le parallélisme entre les ténèbres, l’absence d’attention divine et l’absence de lumière.
