  yaml_path: translation/ot/job/003/006.yaml
  text: As for that night[a], let darkness seize it; let it not rejoice among the days of the year; let it not enter into the number of the months.
translation:
  language: fr
  text: Quant à cette nuit-là, que l’obscurité s’en empare ; qu’elle ne se réjouisse pas parmi les jours de l’année[a] ; qu’elle n’entre pas dans le nombre des mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’elle ne soit pas jointe aux jours de l’année ». Le verbe hébreu est rare dans cet emploi ; certains y voient l’exclusion du calendrier plutôt que l’absence de réjouissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלַּיְלָה הַהוּא
  choice: Quant à cette nuit-là
  rationale: La tournure détachée rend la mise en relief du syntagme hébreu placé en tête, tout en restant naturelle en français.
- source_word: יִקָּחֵהוּ
  choice: que l’obscurité s’en empare
  rationale: Le verbe לקח signifie littéralement « prendre ». « S’emparer de » conserve ici l’image d’une puissance hostile prenant possession de la nuit.
- source_word: אֹפֶל
  choice: l’obscurité
  rationale: Ce terme désigne l’obscurité ou les ténèbres. « L’obscurité » est clair et permet de conserver la personnification produite par le verbe.
- source_word: אַל יִחַדְּ
  choice: qu’elle ne se réjouisse pas
  rationale: Dans cet emploi rare et discuté, le verbe peut évoquer une participation joyeuse. Cette lecture est retenue dans le texte, tandis que le sens possible d’association au calendrier est signalé en note.
- source_word: בִּימֵי שָׁנָה
  choice: parmi les jours de l’année
  rationale: « Parmi » exprime naturellement l’inclusion dans l’ensemble des jours qui composent l’année.
- source_word: בְּמִסְפַּר יְרָחִים
  choice: dans le compte des mois
  rationale: Cette formulation conserve l’image du dénombrement présente dans מִסְפַּר, avec une expression française naturelle.
- source_word: אַל יָבֹא
  choice: qu’elle n’entre pas
  rationale: Le choix garde le sens concret de בוא, « venir, entrer », appliqué ici à l’admission dans le décompte des mois.
