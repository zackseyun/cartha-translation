  yaml_path: translation/ot/job/003/025.yaml
  text: For the dread I dreaded has come upon me[b][a], and what I feared has come to me.
translation:
  language: fr
  text: Car la terreur que je redoutais s’est abattue sur moi[a], et ce que je craignais m’est arrivé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un nom et un verbe de même racine, littéralement de l’ordre de « la peur que j’ai redoutée », pour renforcer l’idée. Le premier verbe signifie probablement qu’elle est venue sur Job ou l’a atteint; le second dit plus simplement qu’elle est « venue à lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication de la plainte précédente de Job; « Car » rend naturellement cette valeur explicative et causale.
- source_word: פַחַד פָּחַדְתִּי
  choice: la terreur que je redoutais
  rationale: Le nom et le verbe apparentés produisent une insistance difficile à reproduire littéralement en français. La combinaison « terreur » et « redoutais » conserve l’intensité et une proximité sémantique sans devenir artificielle.
- source_word: וַיֶּאֱתָיֵנִי
  choice: s’est abattue sur moi
  rationale: Dans ce contexte de calamité, cette expression traduit l’idée d’un malheur qui atteint Job et permet de garder une nuance plus forte que le simple יָבֹא לִי du second membre.
- source_word: וַאֲשֶׁר
  choice: et ce que
  rationale: Cette tournure française naturelle introduit le second membre parallèle sans l’alourdir.
- source_word: יָגֹרְתִּי
  choice: je craignais
  rationale: Le verbe exprime ici la crainte. « Je craignais » maintient le parallélisme tout en évitant de répéter « redoutais ».
- source_word: יָבֹא לִי
  choice: m’est arrivé
  rationale: Bien que l’hébreu dise plus littéralement « est venu à moi », « m’est arrivé » est idiomatique en français pour un événement redouté, tout en restant distinct du premier verbe.
theological_decisions: []
