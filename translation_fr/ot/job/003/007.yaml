source:
  edition: WLC
  text: הִנֵּ֤ה הַ/לַּ֣יְלָה הַ֭/הוּא יְהִ֣י גַלְמ֑וּד אַל תָּבֹ֖א רְנָנָ֣ה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/007.yaml
  text: Look, may that night be barren; let no joyful cry enter it.
translation:
  language: fr
  text: Oui, que cette nuit-là soit stérile ! Qu’aucun cri de joie n’y retentisse !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Oui
  rationale: Dans cette imprécation poétique, la particule attire l’attention tout en renforçant le souhait. « Oui » est naturel en français et conserve cette force sans le ton archaïque de « Voici ».
- source_word: גַלְמוּד
  choice: stérile
  rationale: Le terme évoque l’isolement ou l’absence de fécondité. Appliqué à la nuit de la conception ou de la naissance, « stérile » restitue naturellement l’image voulue.
- source_word: רְנָנָה
  choice: cri de joie
  rationale: Le nom désigne un cri retentissant, souvent joyeux. « Cri de joie » préserve explicitement cette valeur.
- source_word: אַל־תָּבוֹא ... בּוֹ
  choice: Qu’aucun ... n’y retentisse
  rationale: Littéralement, le cri ne doit pas « entrer en elle ». En français poétique, un cri « retentit » dans la nuit ; cette formulation transmet clairement l’absence souhaitée de toute célébration.
theological_decisions:
- issue: Portée de l’imprécation de Job
  choice: Conserver le souhait poétique visant la nuit personnifiée
  alternative: Transformer le verset en affirmation factuelle
  rationale: Les formes verbales expriment une malédiction ou un souhait, et non un enseignement doctrinal ni la description d’un fait accompli.
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme exclamatif rend l’intensité de la lamentation sans archaïsme. « Cette nuit-là » reprend précisément הַלַּיְלָה הַהוּא.
