  variant: modern international French
source:
  edition: WLC
  text: הֲ/לֹֽא את שַׂ֣כְתָּ בַעֲד֧/וֹ וּ/בְעַד בֵּית֛/וֹ וּ/בְעַ֥ד כָּל אֲשֶׁר ל֖/וֹ מִ/סָּבִ֑יב מַעֲשֵׂ֤ה יָדָי/ו֙ בֵּרַ֔כְתָּ וּ/מִקְנֵ֖/הוּ פָּרַ֥ץ בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/010.yaml
  text: Have you not put a hedge around him and around his house and around all that he has[a], on every side? You have blessed the work of his hands[b], and his livestock has spread throughout the land.
translation:
  language: fr
  text: N’est-ce pas toi qui as dressé une haie[a] autour de lui, de sa maison et de tout ce qui lui appartient, de tous côtés ? Tu as béni l’œuvre de ses mains, et ses troupeaux se sont répandus[b] dans le pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « placé une clôture protectrice ». L’hébreu emploie l’image concrète d’un enclos entourant et protégeant.
    reason: lexical_alternative
  - marker: b
    text: Ou « ont beaucoup augmenté ». Le verbe hébreu évoque littéralement ce qui fait irruption, déborde ou s’étend au-dehors.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂכְתָּ
  choice: as dressé une haie
  rationale: Le verbe évoque concrètement une clôture placée autour de quelqu’un pour le protéger. Cette formulation conserve à la fois l’image et sa portée protectrice.
- source_word: בַעֲדוֹ / וּבְעַד בֵּיתוֹ / וּבְעַד כָּל אֲשֶׁר לוֹ
  choice: autour de lui, de sa maison et de tout ce qui lui appartient
  rationale: Avec le verbe שׂוּךְ et l’adverbe מִסָּבִיב, בְּעַד exprime ici l’encerclement protecteur. La répétition française de « autour de » serait possible, mais l’ellipse coordonnée est naturelle et limpide.
- source_word: מִסָּבִיב
  choice: de tous côtés
  rationale: Cette locution rend l’idée d’un encerclement complet dans un français actuel.
- source_word: מַעֲשֵׂה יָדָיו
  choice: l’œuvre de ses mains
  rationale: La traduction conserve l’expression hébraïque désignant le travail et l’activité productive de Job, tout en restant naturelle en français.
- source_word: בֵּרַכְתָּ
  choice: Tu as béni
  rationale: Le verbe signifie « bénir ». Le conserver évite de réduire l’action divine à la seule prospérité matérielle.
- source_word: מִקְנֵהוּ
  choice: ses troupeaux
  rationale: Le nom collectif désigne ici le bétail possédé par Job. « Ses troupeaux » est idiomatique et rend bien ce collectif.
- source_word: פָּרַץ
  choice: se sont répandus
  rationale: Le verbe exprime une expansion qui déborde ou fait irruption. « Se sont répandus » préserve mieux cette image dynamique que le simple « ont augmenté ».
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Le syntagme indique l’espace dans lequel les troupeaux se sont étendus. « Dans le pays » reste proche de l’hébreu sans imposer une portée géographique plus précise.
- source_word: הֲלֹא את
  choice: N’est-ce pas toi qui
  rationale: Cette tournure conserve la question rhétorique et met naturellement en relief l’action de Dieu en français.
theological_decisions:
- issue: Conserver le langage de bénédiction plutôt que le réduire à la prospérité
  choice: Tu as béni l’œuvre de ses mains
  alternative: Tu as fait prospérer le travail de ses mains
  rationale: L’hébreu attribue explicitement la réussite de Job à la bénédiction divine. « Béni » conserve cette affirmation théologique sans en limiter le sens à un résultat économique.
- issue: Préserver la métaphore de la clôture protectrice
  choice: as dressé une haie autour de lui
  alternative: l’as protégé
  rationale: L’image concrète de l’enclos appartient au texte et donne sa force à l’accusation de l’adversaire. Une formulation abstraite en effacerait une partie.
- issue: Rendre l’expansion des troupeaux sans aplatir l’image
  choice: ses troupeaux se sont répandus dans le pays
  alternative: son bétail a beaucoup augmenté dans le pays
  rationale: Le choix retenu maintient la vigueur de פָּרַץ tout en restant intelligible, sans trancher entre expansion spatiale et croissance abondante.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique est formulée naturellement, tandis que les images hébraïques de la haie et de l’expansion sont conservées. « Troupeaux » rend le collectif hébreu de façon courante.
