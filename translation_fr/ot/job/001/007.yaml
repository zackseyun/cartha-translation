  source_fidelity: 'Le texte rend fidèlement la structure et le sens du verset hébreu : Yahweh interroge l’Adversaire sur sa provenance, puis celui-ci répond par les deux infinitifs décrivant son déplacement sur la terre. « D’où viens-tu ? » est une formulation française idiomatique pour מֵאַיִן תָּבֹא. « Parcourir la terre » et « m’y promener » conservent la progression des deux expressions hébraïques sans leur attribuer un sens technique ou militarisé absent du texte.'
