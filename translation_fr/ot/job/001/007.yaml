  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל הַ/שָּׂטָ֖ן מֵ/אַ֣יִן תָּבֹ֑א וַ/יַּ֨עַן הַ/שָּׂטָ֤ן אֶת יְהוָה֙ וַ/יֹּאמַ֔ר מִ/שּׁ֣וּט בָּ/אָ֔רֶץ וּ/מֵֽ/הִתְהַלֵּ֖ךְ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/007.yaml
  text: Then Yahweh said to the Adversary[a], “Where have you come from?” And the Adversary answered Yahweh and said, “From roaming on the earth and from walking about on it.”
translation:
  language: fr
  text: 'Alors Yahweh dit à l’Adversaire[a] : « D’où viens-tu ? » L’Adversaire répondit à Yahweh : « De parcourir la terre et de m’y promener. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « le Satan ». Ici, le terme porte l’article défini et fonctionne comme un titre : « l’Adversaire ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הַשָּׂטָן
  choice: l’Adversaire
  rationale: L’article défini hébreu indique ici une fonction ou un titre plutôt qu’un nom propre ; « l’Adversaire » en rend naturellement le sens large.
- source_word: מֵאַיִן תָּבֹא
  choice: D’où viens-tu ?
  rationale: Formulation française naturelle qui exprime le point de provenance demandé.
- source_word: וַיַּעַן
  choice: répondit
  rationale: Correspond au verbe narratif courant de réponse et convient au récit au passé simple.
- source_word: מִשּׁוּט בָּאָרֶץ
  choice: De parcourir la terre
  rationale: « Parcourir » exprime le déplacement en divers sens ; « la terre » convient à la portée cosmique du passage.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: et de m’y promener
  rationale: Le verbe pronominal rend le mouvement répété ou libre du hitpael, et « y » reprend naturellement « la terre ».
theological_decisions:
- issue: 'Statut de הַשָּׂטָן : nom propre ou titre/fonction'
  choice: 'Titre/fonction : « l’Adversaire »'
  alternative: 'Nom propre : « Satan » ; translittération plus formelle : « le Satan »'
  rationale: La présence de l’article défini en hébreu favorise nettement une désignation fonctionnelle dans ce contexte, sans imposer l’emploi ultérieur comme nom propre.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme narratif est conservé sans reproduire inutilement le redoublement hébreu « répondit… et dit », peu naturel en français.
