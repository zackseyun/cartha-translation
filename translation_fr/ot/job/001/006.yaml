base_translation:
  language: en
  yaml_path: translation/ot/job/001/006.yaml
  text: There was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them.
translation:
  language: fr
  text: Un jour, les fils de Dieu[a] vinrent se présenter devant Yahweh, et l’Adversaire[b] vint lui aussi au milieu d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « fils de Dieu » peuvent désigner ici des êtres célestes appartenant à la cour divine.
    reason: cultural_note
  - marker: b
    text: Ou, selon la traduction traditionnelle, « Satan ». L’hébreu dit « l’adversaire » avec l’article défini ; il peut s’agir ici d’un titre plutôt que d’un nom propre.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Un jour
  rationale: Cette formule narrative introduit une nouvelle scène. « Un jour » est naturel en français moderne et n’ajoute pas un marqueur discursif absent du texte.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: les fils de Dieu
  rationale: La traduction formellement proche conserve l’image et l’ambiguïté de l’expression hébraïque, sans la remplacer dans le texte par une interprétation.
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: se présenter devant Yahweh
  rationale: Dans ce contexte de cour, le verbe exprime la comparution devant un supérieur; « se présenter devant » en restitue naturellement le sens.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération représente directement le nom divin hébreu et suit le choix du projet attesté dans la couche de consultation.
- source_word: הַשָּׂטָן
  choice: l’Adversaire
  rationale: Le nom porte l’article défini en hébreu et désigne ici vraisemblablement une fonction ou un titre; « l’Adversaire » en conserve le sens lexical sans en faire d’emblée un nom propre.
- source_word: בְּתוֹכָם
  choice: au milieu d’eux
  rationale: Cette formulation française naturelle exprime sa présence au sein du groupe.
theological_decisions:
- issue: Faut-il comprendre הַשָּׂטָן comme un nom propre ou comme un titre?
  choice: l’Adversaire
  alternative: Satan; l’Accusateur
  rationale: La présence de l’article défini favorise ici un titre ou une désignation de fonction. Le choix principal préserve cette donnée, tandis que la traduction traditionnelle est signalée en note.
- issue: Faut-il interpréter בְּנֵי הָאֱלֹהִים ou en conserver la forme?
  choice: les fils de Dieu
  alternative: les êtres célestes; les êtres divins
  rationale: L’expression semble désigner des êtres de la cour céleste, mais la traduction littérale préserve l’imagerie et la tension théologique du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative reste sobre. Les termes « fils de Dieu » et « l’Adversaire » conservent les ambiguïtés significatives de l’hébreu.
