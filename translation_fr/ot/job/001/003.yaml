source:
  edition: WLC
  text: וַ/יְהִ֣י מִ֠קְנֵ/הוּ שִֽׁבְעַ֨ת אַלְפֵי צֹ֜אן וּ/שְׁלֹ֧שֶׁת אַלְפֵ֣י גְמַלִּ֗ים וַ/חֲמֵ֨שׁ מֵא֤וֹת צֶֽמֶד בָּקָר֙ וַ/חֲמֵ֣שׁ מֵא֣וֹת אֲתוֹנ֔וֹת וַ/עֲבֻדָּ֖ה רַבָּ֣ה מְאֹ֑ד וַ/יְהִי֙ הָ/אִ֣ישׁ הַ/ה֔וּא גָּד֖וֹל מִ/כָּל בְּנֵי קֶֽדֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/003.yaml
  text: His livestock were seven thousand sheep[a], three thousand camels, five hundred yoke of oxen, five hundred female donkeys, and a very large household; and that man was greater than all the sons of the east.
translation:
  language: fr
  text: Il possédait sept mille têtes de petit bétail[a], trois mille chameaux, cinq cents paires de bœufs, cinq cents ânesses et un très grand nombre de serviteurs[b]. Cet homme était le plus grand de tous les fils de l’Orient[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner collectivement les moutons et les chèvres.
    reason: lexical_ambiguity
  - marker: b
    text: Ou « une domesticité très nombreuse » ; l’expression peut désigner les serviteurs ou, plus largement, l’ensemble du service attaché au domaine.
    reason: lexical_ambiguity
  - marker: c
    text: C’est-à-dire les peuples de l’Orient, ou les Orientaux.
    reason: idiom_clarification
lexical_decisions:
- source_word: מִקְנֵהוּ
  choice: Il possédait
  rationale: Le nom désigne ici le cheptel ou les biens d’élevage, immédiatement détaillés par l’inventaire. En français, la tournure verbale introduit naturellement cette liste sans perdre le sens.
- source_word: צֹאן
  choice: têtes de petit bétail
  rationale: Le terme hébreu peut englober les moutons et les chèvres. « Petit bétail » préserve cette étendue sémantique, et « têtes de » convient au dénombrement.
- source_word: גְמַלִּים
  choice: chameaux
  rationale: Équivalent français direct et courant.
- source_word: צֶמֶד בָּקָר
  choice: paires de bœufs
  rationale: צֶמֶד désigne une paire d’animaux attelés ensemble, et בָּקָר les bovins employés ici comme bêtes de trait. « Paires de bœufs » est clair et actuel.
- source_word: אֲתוֹנוֹת
  choice: ânesses
  rationale: Le féminin du terme hébreu est explicite; « ânesses » le restitue avec précision et naturel.
- source_word: עֲבֻדָּה רַבָּה מְאֹד
  choice: un très grand nombre de serviteurs
  rationale: Dans cet inventaire de richesse, l’expression désigne vraisemblablement l’importante main-d’œuvre attachée au domaine. Une note conserve l’autre compréhension possible, celle d’une vaste domesticité ou exploitation.
- source_word: גָּדוֹל מִכָּל
  choice: le plus grand de tous
  rationale: La construction comparative indique que Job surpassait tous les autres, probablement par sa richesse, son rang et son importance; la formulation française préserve cette amplitude.
- source_word: בְּנֵי קֶדֶם
  choice: les fils de l’Orient
  rationale: Cette traduction conserve l’image et la forme de l’idiome hébreu; une note en explicite le sens collectif et géographique.
theological_decisions:
- issue: Portée de la grandeur de Job
  choice: le plus grand
  alternative: le plus riche / le plus important
  rationale: Le texte ne précise pas si גָּדוֹל vise uniquement la richesse, le rang social ou une importance plus générale. « Le plus grand » maintient cette indétermination.
- issue: Sens collectif de בְּנֵי קֶדֶם
  choice: les fils de l’Orient
  alternative: les peuples de l’Orient / les Orientaux
  rationale: L’idiome masculin pluriel hébreu est conservé dans le texte, tandis que la note indique qu’il désigne collectivement les habitants des régions orientales.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de l’inventaire reste fluide; « petit bétail », « ânesses » et « paires de bœufs » conservent les précisions du texte hébreu. Les notes signalent les ambiguïtés réelles sans alourdir le verset.
