id: JOB.1.1
reference: Job 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִ֛ישׁ הָיָ֥ה בְ/אֶֽרֶץ ע֖וּץ אִיּ֣וֹב שְׁמ֑/וֹ וְ/הָיָ֣ה הָ/אִ֣ישׁ הַ/ה֗וּא תָּ֧ם וְ/יָשָׁ֛ר וִ/ירֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/001.yaml
  text: There was a man in the land of Uz whose name was Job[a], and that man was blameless and upright, fearing God and turning away from evil.
translation:
  language: fr
  text: Il y avait, dans le pays d’Outs, un homme du nom de Job. Cet homme était intègre et droit ; il craignait Dieu et se détournait du mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « évitait le mal ». Le verbe hébreu peut exprimer le fait de se détourner du mal, de s’en écarter ou de l’éviter.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָיָה
  choice: Il y avait […] un homme
  rationale: Cette tournure introduit naturellement en français moderne le personnage et le cadre du récit, tout en conservant la valeur existentielle simple de l’hébreu.
- source_word: בְאֶרֶץ עוּץ
  choice: dans le pays d’Outs
  rationale: « Pays » rend naturellement אֶרֶץ dans cette indication géographique ; « Outs » est la translittération française usuelle du nom de lieu.
- source_word: אִיּוֹב שְׁמוֹ
  choice: du nom de Job
  rationale: Formulation française courante qui conserve la fonction d’identification de la proposition hébraïque.
- source_word: וְהָיָה הָאִישׁ הַהוּא
  choice: Cet homme était
  rationale: Le démonstratif reprend explicitement l’homme qui vient d’être présenté, conformément à הַהוּא.
- source_word: תָּם
  choice: intègre
  rationale: Dans la littérature de sagesse, le terme évoque la plénitude morale et l’intégrité, sans affirmer nécessairement une perfection absolue ou une absence totale de péché.
- source_word: יָשָׁר
  choice: droit
  rationale: L’adjectif exprime la rectitude éthique ; « droit » est idiomatique et forme en français un couple naturel avec « intègre ».
- source_word: וִירֵא אֱלֹהִים
  choice: il craignait Dieu
  rationale: La crainte désigne ici une attitude de respect religieux et de piété. Le contexte impose le singulier « Dieu » malgré la morphologie plurielle dאֱלֹהִים.
- source_word: וְסָר מֵרָע
  choice: se détournait du mal
  rationale: Cette traduction conserve l’image verbale d’un éloignement actif du mal et peut aussi impliquer le fait de l’éviter.
theological_decisions:
- issue: Portée de la description morale de Job
  choice: Job est présenté comme intègre et moralement droit.
  alternative: Job est déclaré absolument parfait ou entièrement exempt de péché.
  rationale: תָּם loue fortement l’intégrité de Job, mais ne requiert pas l’idée de perfection morale absolue. « Intègre » préserve cette nuance et la tension du récit.
- issue: Référent de אֱלֹהִים
  choice: Dieu
  alternative: des dieux
  rationale: L’expression et le contexte narratif indiquent un référent singulier.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme en deux phrases clarifie l’introduction et la caractérisation de Job. Le point-virgule maintient l’unité de sa description morale. Le marqueur [a] est placé après l’expression concernée.
