id: JOB.1.20
reference: Job 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֤קָם אִיּוֹב֙ וַ/יִּקְרַ֣ע אֶת מְעִל֔/וֹ וַ/יָּ֖גָז אֶת רֹאשׁ֑/וֹ וַ/יִּפֹּ֥ל אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/020.yaml
  text: Then Job rose[a], tore his robe, shaved his head, fell to the ground, and bowed down.
translation:
  language: fr
  text: Alors Job se leva, déchira son manteau, se rasa la tête, tomba à terre et se prosterna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « adora ». Le verbe hébreu désigne le fait de s’incliner ou de se prosterner, souvent en signe de révérence ou d’adoration.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le qal narratif de קום fait progresser le récit. « Se leva » est naturel et conserve l’idée de se mettre debout.
- source_word: וַיִּקְרַע אֶת מְעִילוֹ
  choice: déchira son manteau
  rationale: קרע désigne ici le geste concret de déchirer un vêtement en signe de deuil, et מְעִיל un vêtement de dessus important.
- source_word: וַיָּגָז אֶת רֹאשׁוֹ
  choice: se rasa la tête
  rationale: גזז signifie couper ou tondre. Dans ce contexte de deuil, « se rasa la tête » exprime clairement l’action sans lourdeur.
- source_word: וַיִּפֹּל אַרְצָה
  choice: tomba à terre
  rationale: La forme directionnelle אַרְצָה indique un mouvement vers le sol. « Tomba à terre » est idiomatique et précis.
- source_word: וַיִּשְׁתָּחוּ
  choice: se prosterna
  rationale: Le verbe désigne l’abaissement corporel jusqu’à terre, souvent comme marque de révérence ou d’adoration. « Se prosterna » préserve le geste explicite sans imposer à lui seul son interprétation cultuelle.
theological_decisions:
- issue: Le dernier geste de Job exprime-t-il seulement une prosternation physique ou explicitement l’adoration ?
  choice: se prosterna
  alternative: adora
  rationale: Le verbe hébreu exprime directement une posture d’abaissement et peut, selon le contexte, désigner l’adoration. La traduction principale conserve le geste observable, tandis que la note signale sa portée religieuse possible, soutenue par la parole adressée à Dieu au verset suivant.
translation_notes:
  register: Français moderne, sobre et narratif. La succession rapide des verbes reproduit le rythme de l’hébreu. « Manteau » reste courant tout en évoquant un vêtement de dessus significatif, et « se prosterna » conserve la tension entre geste corporel et adoration.
