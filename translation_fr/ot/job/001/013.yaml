  text: There was a day when his sons and his daughters were eating and drinking wine in the house of their oldest brother[a].
translation:
  language: fr
  text: Un jour, ses fils et ses filles mangeaient et buvaient du vin chez leur frère aîné[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur frère premier-né ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Un jour
  rationale: Cette formule narrative hébraïque introduit une nouvelle scène. « Un jour » en rend naturellement la valeur indéfinie en français moderne, sans ajouter un marqueur temporel absent du texte.
- source_word: וּבָנָיו וּבְנֹתָיו
  choice: ses fils et ses filles
  rationale: L’hébreu nomme explicitement les deux groupes; la traduction conserve cette précision plutôt que de généraliser par « ses enfants ».
- source_word: אֹכְלִים וְשֹׁתִים
  choice: mangeaient et buvaient
  rationale: Les participes décrivent une action en cours; l’imparfait français restitue naturellement cet arrière-plan narratif.
- source_word: יַיִן
  choice: du vin
  rationale: Équivalent lexical direct et naturel en français dans cette construction.
- source_word: בְּבֵית אֲחִיהֶם
  choice: chez leur frère
  rationale: Littéralement « dans la maison de leur frère »; « chez leur frère » exprime clairement et naturellement le lieu en français courant.
- source_word: הַבְּכוֹר
  choice: aîné
  rationale: Le terme désigne celui qui est le premier-né. Dans ce contexte familial, « frère aîné » est idiomatique; le sens plus littéral est indiqué en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait présente l’action en cours, tandis que « chez » évite la lourdeur de « dans la maison de » sans perdre l’indication de lieu.
