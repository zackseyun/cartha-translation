source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ עָרֹ֨ם יצתי מִ/בֶּ֣טֶן אִמִּ֗/י וְ/עָרֹם֙ אָשׁ֣וּב שָׁ֔מָ/ה יְהוָ֣ה נָתַ֔ן וַ/יהוָ֖ה לָקָ֑ח יְהִ֛י שֵׁ֥ם יְהוָ֖ה מְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/021.yaml
  text: And he said[a], “Naked I came out from my mother’s womb, and naked I will return there. Yahweh gave, and Yahweh has taken away[b]. May the name of Yahweh be blessed.”
translation:
  language: fr
  text: 'Il dit : « Nu, je suis sorti du ventre de ma mère, et nu, je retournerai là[a]. Yahweh[b] a donné, et Yahweh a pris. Que le nom de Yahweh soit béni ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « là » sans nommer explicitement la destination. Il peut évoquer figurativement le ventre maternel, plus largement la terre ou la tombe, ou encore le retour à un état où l’on ne possède rien.
    reason: alternative_reading
  - marker: b
    text: 'Hébreu : YHWH, nom divin traditionnellement rendu par « le SEIGNEUR ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֹם
  choice: nu
  rationale: Le mot désigne l’absence de vêtements et peut aussi évoquer le fait de ne rien posséder. « Nu » conserve à la fois l’image concrète de la naissance et la portée existentielle du propos.
- source_word: יצתי
  choice: je suis sorti
  rationale: Le verbe יצא décrit ici la sortie du ventre maternel, donc la naissance. Le passé composé est naturel en français moderne.
- source_word: מִבֶּטֶן אִמִּי
  choice: du ventre de ma mère
  rationale: Traduction directe et concrète de l’expression hébraïque, dans un français courant et digne.
- source_word: וְעָרֹם אָשׁוּב שָׁמָה
  choice: et nu, je retournerai là
  rationale: Cette formulation maintient l’accent initial sur « nu » et traduit explicitement שָׁמָה, « là », sans préciser une destination que l’hébreu laisse implicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin YHWH, plutôt que substitution par un titre.
- source_word: נָתַן
  choice: a donné
  rationale: Le passé composé exprime naturellement en français l’action accomplie qui demeure pertinente dans la situation présente.
- source_word: לָקָח
  choice: a pris
  rationale: « A pris » reste proche du sens simple du verbe hébreu et évite d’ajouter l’idée explicite de reprendre ce qui aurait été prêté.
- source_word: יְהִי
  choice: Que… soit
  rationale: Cette tournure rend naturellement la valeur optative ou bénédictive du jussif hébreu.
- source_word: שֵׁם יְהוָה
  choice: le nom de Yahweh
  rationale: La construction nominale hébraïque est conservée avec sa force révérencielle.
- source_word: מְבֹרָךְ
  choice: béni
  rationale: « Béni » correspond à la forme passive et conserve le champ lexical de la bénédiction, contrairement à l’interprétation plus étroite « loué ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre plutôt que de lui substituer un titre.
- issue: Référent de שָׁמָה, « là »
  choice: Conserver « là » sans préciser la destination
  alternative: retourner à la terre / dans la tombe / dans le ventre de ma mère
  rationale: L’hébreu laisse le référent implicite. La traduction conserve ainsi l’ambiguïté entre l’image du ventre maternel, la terre ou la tombe, et le retour à l’état de dénuement.
- issue: Portée de לָקָח
  choice: a pris
  alternative: a repris / a enlevé
  rationale: « A repris » pourrait suggérer que les biens n’étaient que prêtés, tandis que « a enlevé » accentuerait la privation. « A pris » maintient la formulation sobre et théologiquement tendue de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et solennel. La répétition de « nu » et du nom « Yahweh » reproduit la force poétique de l’hébreu. La légère étrangeté de « retournerai là » est volontaire afin de ne pas effacer l’ambiguïté du texte source.
