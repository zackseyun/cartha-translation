  text: ע֣וֹד זֶ֣ה מְדַבֵּ֗ר וְ/זֶה֮ בָּ֣א וַ/יֹּאמַר֒ כַּשְׂדִּ֞ים שָׂ֣מוּ שְׁלֹשָׁ֣ה רָאשִׁ֗ים וַֽ/יִּפְשְׁט֤וּ עַל הַ/גְּמַלִּים֙ וַ/יִּקָּח֔וּ/ם וְ/אֶת הַ/נְּעָרִ֖ים הִכּ֣וּ לְ/פִי חָ֑רֶב וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/017.yaml
  text: While this one was still speaking[a], another came and said, “The Chaldeans formed three raiding parties, swept down on the camels and took them, and they struck down the young men with the edge of the sword[c][b]. And I alone have escaped to tell you.”
translation:
  language: fr
  text: 'Celui-ci parlait encore lorsqu’un autre arriva et dit : « Les Chaldéens se sont répartis en trois bandes[a], se sont jetés sur les chameaux et les ont emmenés. Ils ont passé les jeunes gens[b] au fil de l’épée[c]. Moi seul, j’ai pu m’échapper pour te l’annoncer. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ont placé trois têtes »; on peut aussi comprendre : « ont formé trois divisions » ou « se sont déployés en trois groupes ».'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « jeunes gens » peut aussi désigner des serviteurs ou des hommes de la maison.
    reason: lexical_alternative
  - marker: c
    text: 'Expression hébraïque, littéralement : « ont frappé par la bouche de l’épée »; elle signifie qu’ils les ont tués à l’épée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֣וֹד זֶ֣ה מְדַבֵּר
  choice: Celui-ci parlait encore lorsque
  rationale: Rend l’action en cours exprimée par עוֹד avec le participe, tout en conservant la référence anaphorique de זֶה au messager précédent.
- source_word: וְזֶה בָּא וַיֹּאמַר
  choice: un autre arriva et dit
  rationale: Dans cette succession de messagers, le second זֶה désigne naturellement un nouveau messager; « un autre » est idiomatique en français.
- source_word: כַּשְׂדִּים
  choice: Les Chaldéens
  rationale: Transcription française usuelle de l’ethnonyme désignant collectivement les assaillants.
- source_word: שָׂמוּ שְׁלֹשָׁה רָאשִׁים
  choice: se sont répartis en trois bandes
  rationale: Littéralement « ont placé trois têtes »; dans ce contexte de raid, l’expression évoque trois groupes ou détachements. La formulation française garde cette organisation tactique sans imposer un terme militaire trop précis.
- source_word: וַיִּפְשְׁטוּ עַל
  choice: se sont jetés sur
  rationale: Exprime l’irruption soudaine et hostile de פשט על dans un français naturel.
- source_word: וַיִּקָּחוּם
  choice: les ont emmenés
  rationale: Le suffixe renvoie aux chameaux; « emmenés » indique naturellement qu’ils ont été saisis puis conduits ailleurs lors du raid.
- source_word: הַנְּעָרִים
  choice: les jeunes gens
  rationale: Conserve le sens lexical premier de נְעָרִים sans trancher silencieusement en faveur de « serviteurs », sens contextuellement possible.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: ont passé ... au fil de l’épée
  rationale: Expression française idiomatique qui conserve l’image hébraïque de la « bouche » ou du « tranchant » de l’épée et implique la mise à mort.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Moi seul, j’ai pu m’échapper
  rationale: Reproduit l’insistance de רַק אֲנִי לְבַדִּי sur l’unique rescapé; « j’ai pu m’échapper » rend le fait d’avoir échappé au désastre.
- source_word: לְהַגִּיד לָךְ
  choice: pour te l’annoncer
  rationale: Rend la finalité de l’évasion et la formule urgente du messager dans un registre narratif naturel.
