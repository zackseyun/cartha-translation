base_translation:
  language: en
  yaml_path: translation/ot/job/001/015.yaml
  text: And Sheba fell upon them and took them[a], and they struck down the young men with the edge of the sword[c][b]; and I alone have escaped to tell you.
translation:
  language: fr
  text: Les gens de Saba fondirent sur eux et les emmenèrent[a]. Ils passèrent les jeunes gens au fil de l’épée[b][c]. Moi seul, j’ai échappé pour te l’annoncer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « Saba », nom propre employé ici pour désigner les gens de Saba.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la bouche de l’épée », expression qui signifie « au fil de l’épée ».'
    reason: lexical_alternative
  - marker: c
    text: Les « jeunes gens » sont probablement les serviteurs de Job qui gardaient les animaux.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּפֹּל שְׁבָא
  choice: Les gens de Saba fondirent sur eux
  rationale: Le nom propre שְׁבָא désigne ici collectivement les assaillants venus de Saba. « Fondirent sur » rend l’emploi hostile de נפל et le caractère soudain de l’attaque dans un français naturel.
- source_word: וַתִּקָּחֵם
  choice: les emmenèrent
  rationale: Le suffixe masculin pluriel renvoie aux bœufs et aux ânesses du verset précédent. Dans ce contexte de raid, « emmenèrent » exprime clairement la prise du bétail sans ajouter l’idée non formulée de destination.
- source_word: הַנְּעָרִים
  choice: les jeunes gens
  rationale: Le terme peut désigner des jeunes hommes ou des serviteurs. La traduction conserve son sens lexical direct, tandis qu’une note précise leur fonction probable dans le contexte.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: passèrent ... au fil de l’épée
  rationale: Cette locution française établie rend l’action meurtrière et conserve l’image de l’hébreu, littéralement « frappèrent par la bouche de l’épée ».
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Moi seul, j’ai échappé
  rationale: « Moi seul » préserve l’insistance de רַק אֲנִי לְבַדִּי, et le passé composé convient au récit oral d’un survivant dont l’évasion vient d’avoir lieu.
- source_word: לְהַגִּיד לָךְ
  choice: pour venir te l’annoncer
  rationale: « Annoncer » convient à un compte rendu solennel, et « venir » explicite naturellement en français la démarche impliquée par la scène sans modifier le contenu du message.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Les gens de Saba » évite l’ethnonyme plus rare « Sabéens » tout en rendant explicite la valeur collective du nom propre. La syntaxe brève maintient l’urgence du rapport du messager.
