base_translation:
  language: en
  yaml_path: translation/ot/job/001/012.yaml
  text: And Yahweh said to the Accuser[a], “Look, all that he has is in your hand; only against him do not stretch out your hand.” Then the Accuser went out from the presence of Yahweh.
translation:
  language: fr
  text: 'Yahweh dit à l’Accusateur[a] : « Voici, tout ce qui lui appartient est entre tes mains ; seulement, ne porte pas la main sur lui. » Alors l’Accusateur sortit de la présence de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Satan » ou « l’adversaire ». En hébreu, le terme est précédé de l’article, ce qui suggère un titre ou une fonction.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre, conformément au texte hébreu.
- source_word: הַשָּׂטָן
  choice: l’Accusateur
  rationale: L’article hébreu indique ici vraisemblablement une fonction ou un titre ; « l’Accusateur » rend bien le rôle exercé dans le prologue.
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque naturellement en français l’attention et l’emphase introduites par le présentatif hébreu.
- source_word: כָל אֲשֶׁר לוֹ
  choice: tout ce qui lui appartient
  rationale: Rend clairement et naturellement l’ensemble des biens de Job.
- source_word: בְּיָדֶךָ
  choice: est en ton pouvoir
  rationale: Exprime le sens idiomatique de la main comme pouvoir ou autorité, dans un français actuel.
- source_word: רַק
  choice: seulement
  rationale: Introduit nettement l’unique restriction imposée.
- source_word: אֵלָיו אַל תִּשְׁלַח יָדֶךָ
  choice: ne porte pas la main sur lui
  rationale: Rend idiomatiquement l’action hostile interdite contre Job tout en conservant l’image de la main.
- source_word: וַיֵּצֵא
  choice: se retira
  rationale: Rend le départ de la scène d’audience avec une formulation narrative naturelle et digne.
- source_word: מֵעִם פְּנֵי יְהוָה
  choice: de devant Yahweh
  rationale: Conserve de près l’image spatiale de la comparution devant Yahweh, sans alourdir la phrase.
theological_decisions:
- issue: Interprétation de הַשָּׂטָן dans le prologue de Job
  choice: l’Accusateur
  alternative: le Satan ; l’adversaire ; Satan
  rationale: La présence de l’article favorise une désignation fonctionnelle plutôt qu’un nom propre déjà figé. Cette traduction préserve la portée accusatrice du rôle sans imposer une identification théologique ultérieure.
translation_notes:
  register: Français international moderne, naturel et digne. « Voici » maintient la solennité sans archaïsme marqué ; « ne porte pas la main sur lui » est idiomatique tout en préservant l’image hébraïque.
