  rationale: La révision rétablit l’écho de « main » entre les deux propositions, tout en employant l’expression française naturelle « entre tes mains ». Elle rend ensuite le mouvement de départ et l’expression de présence de manière plus directe et idiomatique, sans modifier la portée du texte ni trancher l’identification de l’Accusateur.
