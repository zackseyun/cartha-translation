lexical_decisions:
- source_word: וַיִּוָּלְדוּ לוֹ
  choice: Il eut
  rationale: La formule hébraïque signifie littéralement « lui furent nés ». En français moderne, « il eut » exprime naturellement le lien de parenté et le résultat de la naissance, sans suggérer ici une action particulière du père.
- source_word: שִׁבְעָה בָנִים
  choice: sept fils
  rationale: Le cardinal et le nom désignent précisément sept enfants de sexe masculin ; « fils » conserve cette information.
- source_word: וְשָׁלֹשׁ בָּנוֹת
  choice: et trois filles
  rationale: La coordination et le cardinal sont rendus directement, et « filles » exprime précisément le lien filial féminin.
