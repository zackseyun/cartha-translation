  text: וְ/אוּלָם֙ שְֽׁלַֽח נָ֣א יָֽדְ/ךָ֔ וְ/גַ֖ע בְּ/כָל אֲשֶׁר ל֑/וֹ אִם לֹ֥א עַל פָּנֶ֖י/ךָ יְבָרֲכֶֽ/ךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/011.yaml
  text: But stretch out your hand[a], please, and touch all that he has, and he will surely curse you to your face.
translation:
  language: fr
  text: 'Mais étends donc ta main et touche à tout ce qui lui appartient : à coup sûr, il te maudira en face[a] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « il te bénira ». Dans le prologue de Job, ce verbe est généralement compris comme une manière euphémistique de dire « maudire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mais
  rationale: Marque naturellement la forte opposition avec l’affirmation précédente.
- source_word: שְׁלַח נָא יָדְךָ
  choice: étends donc la main
  rationale: Conserve l’image hébraïque de la main mise en action; « donc » rend ici נָא comme particule d’exhortation dans un défi, plus naturellement que « s’il te plaît ».
- source_word: וְגַע
  choice: et touche
  rationale: Reproduit le sens premier de נגע tout en laissant le contexte indiquer qu’il s’agit d’un contact nuisible.
- source_word: בְּכָל אֲשֶׁר לוֹ
  choice: à tout ce qui lui appartient
  rationale: Expression française naturelle qui englobe les biens et possessions de Job.
- source_word: אִם לֹא
  choice: à coup sûr
  rationale: Rend la valeur emphatique de cette formule elliptique de serment plutôt qu’une condition ordinaire.
- source_word: עַל פָּנֶיךָ
  choice: en face
  rationale: Conserve l’idée d’une opposition directe et ouverte, dans une tournure française courante.
- source_word: יְבָרֲכֶךָּ
  choice: il te maudira
  rationale: Dans ce contexte hostile, ברך (« bénir ») fonctionne comme un euphémisme révérenciel pour « maudire »; le sens littéral est signalé en note.
theological_decisions:
- issue: Emploi euphémistique de ברך dans le prologue de Job
  choice: Traduire par « il te maudira » dans le texte principal
  alternative: « il te bénira »
  rationale: L’accusation de l’adversaire exige ici l’idée que Job se retournera ouvertement contre Dieu. La traduction « maudira » communique ce sens contextuel reconnu, tandis que la note conserve la forme lexicale littérale et la tension du texte.
translation_notes:
  register: Français international moderne, direct et digne. La formulation garde l’image de la main et le verbe concret « toucher », sans expliciter davantage la nature du mal envisagé. Le point d’exclamation rend la vigueur provocatrice du défi.
