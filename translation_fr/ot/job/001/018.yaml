base_translation:
  language: en
  yaml_path: translation/ot/job/001/018.yaml
  text: While this one was still speaking[a], another came and said, “Your sons and your daughters were eating and drinking wine in the house of their firstborn brother.”
translation:
  language: fr
  text: 'Pendant qu’il parlait encore, un autre arriva et dit : « Tes fils et tes filles mangeaient et buvaient du vin chez leur frère aîné. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד זֶה מְדַבֵּר
  choice: Pendant qu’il parlait encore
  rationale: Cette tournure rend naturellement l’action encore en cours du participe מְדַבֵּר et l’arrivée du messager avant la fin du précédent rapport.
- source_word: וְזֶה בָּא
  choice: un autre arriva
  rationale: Littéralement « celui-ci arriva » ; dans la succession narrative, le démonstratif désigne un nouveau messager. « Un autre » exprime clairement cette fonction en français.
- source_word: וַיֹּאמַר
  choice: et dit
  rationale: Rendu narratif direct et idiomatique du wayyiqtol introduisant les paroles du messager.
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: Tes fils et tes filles
  rationale: L’hébreu nomme explicitement les deux groupes ; la traduction conserve cette précision plutôt que de généraliser par « tes enfants ».
- source_word: אֹכְלִים וְשֹׁתִים יַיִן
  choice: mangeaient et buvaient du vin
  rationale: Les participes décrivent une action en cours. L’imparfait français convient au récit rapporté et reste proche de la formulation hébraïque, sans interpréter « mangeaient » comme « festoyaient ».
- source_word: בְּבֵית אֲחִיהֶם הַבְּכוֹר
  choice: chez leur frère aîné
  rationale: « Chez » rend naturellement l’idée d’être dans la maison de quelqu’un. Dans ce contexte familial, הַבְּכוֹר désigne le frère premier par ordre de naissance ; « frère aîné » est précis et idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation reste proche de l’hébreu tout en évitant le calque lourd « pendant que celui-ci parlait ». Aucun marqueur de note n’est nécessaire, car « mangeaient et buvaient du vin » conserve déjà le sens littéral et l’alternative « festoyaient » n’est pas requise pour comprendre le verset.
