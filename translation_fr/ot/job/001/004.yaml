  text: וְ/הָלְכ֤וּ בָנָי/ו֙ וְ/עָשׂ֣וּ מִשְׁתֶּ֔ה בֵּ֖ית אִ֣ישׁ יוֹמ֑/וֹ וְ/שָׁלְח֗וּ וְ/קָרְאוּ֙ לִ/שְׁלֹ֣שֶׁת אחיתי/הם לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת עִמָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/004.yaml
  text: His sons would go and hold a feast[a], each in his own house on his day, and they would send and invite their three sisters to eat and drink with them.
translation:
  language: fr
  text: Ses fils avaient l’habitude d’aller organiser un festin, chacun chez lui, en son jour[a]. Ils envoyaient inviter leurs trois sœurs à manger et à boire avec eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « le jour de son anniversaire ». L’hébreu dit littéralement « en son jour », ce qui peut désigner soit le jour attribué à chacun, soit son anniversaire.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: avaient l’habitude
  rationale: Dans cette description narrative, le qatal exprime une action coutumière; cette tournure française rend clairement la répétition passée.
- source_word: בָנָיו
  choice: ses fils
  rationale: Le nom hébreu est masculin pluriel et les sœurs sont mentionnées séparément.
- source_word: וְעָשׂוּ מִשְׁתֶּה
  choice: d’organiser […] un festin
  rationale: Cette formulation naturelle rend l’idiome « faire un festin » et conserve son caractère festif.
- source_word: בֵּית אִישׁ
  choice: tour à tour […] chez eux, chacun
  rationale: La construction distributive indique que chaque fils recevait dans sa propre maison; « tour à tour » explicite naturellement cette répartition sans préciser indûment la nature du jour.
- source_word: יוֹמוֹ
  choice: à son jour
  rationale: Le rendu littéral préserve l’ambiguïté entre le jour assigné à chacun dans un cycle et son anniversaire.
- source_word: וְשָׁלְחוּ וְקָרְאוּ
  choice: Ils faisaient aussi inviter
  rationale: La tournure causative française exprime l’envoi d’un message destiné à appeler ou inviter les sœurs, tout en maintenant l’aspect habituel du contexte.
- source_word: לִשְׁלֹשֶׁת אֲחִיתֵיהֶם
  choice: leurs trois sœurs
  rationale: Traduction directe de la forme définie par le possessif et le numéral.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: à manger et à boire
  rationale: Le couple d’infinitifs désigne simplement la participation au festin.
- source_word: עִמָּהֶם
  choice: avec eux
  rationale: La préposition marque la participation commune des sœurs avec leurs frères.
theological_decisions:
- issue: Sens de יוֹמוֹ (« son jour »)
  choice: Maintenir « à son jour » dans le texte et expliquer l’ambiguïté en note.
  alternative: « le jour qui lui était attribué » ou « le jour de son anniversaire »
  rationale: L’hébreu ne tranche pas explicitement entre le tour assigné à chaque fils et son anniversaire; choisir l’un dans le texte résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait et « avaient l’habitude » rendent la pratique répétée; « festin » garde la tonalité célébrative. La formulation « à son jour » est volontairement proche de l’hébreu afin de préserver son ambiguïté.
