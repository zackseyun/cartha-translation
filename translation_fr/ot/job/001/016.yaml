  to: 'Celui-ci parlait encore lorsqu’un autre arriva et dit : « Un feu de Dieu est tombé du ciel ; il a embrasé les brebis et les jeunes hommes, et les a consumés. Moi seul, j’ai échappé pour te l’annoncer. »'
