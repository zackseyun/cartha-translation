review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, notamment « un feu de Dieu » et la séquence des calamités. Toutefois, נְעָרִים désigne littéralement des « jeunes hommes »; le contexte permet qu'ils soient au service de Job, mais « serviteurs » interprète et restreint le terme. « Au désastre » ajoute un complément absent de l'hébreu.
  naturalness: La formulation est fluide et adaptée à un français moderne narratif. La révision proposée conserve ce registre tout en évitant l'ajout explicatif.
  terminology: « Feu de Dieu » préserve utilement l'ambiguïté de אֵשׁ אֱלֹהִים. « Brebis » correspond au contexte immédiat du cheptel de Job et à la valeur de צֹאן. « Jeunes hommes » rend נְעָרִים sans imposer leur statut social.
  issues:
  - severity: medium
    issue: « les serviteurs » pour בַנְּעָרִים
    rationale: Le terme hébreu peut, selon le contexte, désigner des membres du personnel, mais son sens lexical non marqué est « jeunes hommes ». Le rendre ainsi préserve l'ambiguïté du texte et s'aligne sur l'audit anglais.
  - severity: low
    issue: Ajout de « au désastre »
    rationale: Le verbe signifie simplement « s'échapper / réchapper »; l'ajout est compréhensible mais non nécessaire et légèrement explicatif.
