base_translation:
  language: en
  yaml_path: translation/ot/job/001/016.yaml
  text: While this one was still speaking, another came and said, “Fire of God fell from heaven and burned among the sheep and the young men and consumed them, and I alone have escaped to tell you.”
translation:
  language: fr
  text: 'Celui-ci parlait encore lorsqu’un autre arriva et dit : « Un feu de Dieu est tombé du ciel ; il a embrasé les brebis et les jeunes hommes, et les a consumés. Moi seul, j’ai échappé pour te l’annoncer. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשׁ אֱלֹהִים
  choice: un feu de Dieu
  rationale: Reproduit l’expression hébraïque sans décider si elle désigne littéralement une action divine, la foudre ou un feu d’une violence extraordinaire.
- source_word: בַצֹּאן
  choice: les troupeaux
  rationale: צֹאן désigne ici le petit bétail, notamment les brebis mentionnées au verset précédent ; « troupeaux » est naturel en français dans ce contexte.
- source_word: בַנְּעָרִים
  choice: les serviteurs
  rationale: נְעָרִים peut signifier « jeunes hommes » ou, dans ce récit, les hommes au service de Job ; « serviteurs » exprime leur fonction contextuelle.
- source_word: וַתֹּאכְלֵם
  choice: les a consumés
  rationale: Conserve l’image idiomatique du feu qui « dévore » tout en offrant une formulation française naturelle et solennelle.
- source_word: וָאִמָּלְטָה
  choice: j’ai échappé au désastre
  rationale: Le verbe signifie s’échapper ou se sauver ; le complément explicite naturellement l’événement sans en modifier le sens.
theological_decisions:
- issue: Sens de « feu de Dieu »
  choice: Maintenir « un feu de Dieu »
  alternative: « la foudre » ou « un feu envoyé par Dieu »
  rationale: L’hébreu laisse ouverte la portée exacte de l’expression ; la traduction ne doit ni la réduire à un phénomène météorologique précis ni affirmer plus explicitement une causalité divine.
translation_notes:
  register: Français moderne, narratif et digne. La répétition caractéristique des annonces de catastrophe est préservée, avec une ponctuation fluide pour la lecture publique.
