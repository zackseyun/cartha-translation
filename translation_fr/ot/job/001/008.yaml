source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן הֲ/שַׂ֥מְתָּ לִבְּ/ךָ֖ עַל עַבְדִּ֣/י אִיּ֑וֹב כִּ֣י אֵ֤ין כָּמֹ֨/הוּ֙ בָּ/אָ֔רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/008.yaml
  text: 'And Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is none like him on the earth: a blameless and upright man[b], one who fears God and turns away from evil.”'
translation:
  language: fr
  text: 'Yahvé dit à l’Accusateur[a] : « As-tu prêté attention à mon serviteur Job ? Il n’y a personne comme lui sur la terre : c’est un homme intègre et droit, qui craint Dieu et se détourne du mal. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « l’Adversaire » ; traditionnellement « Satan ». En hébreu, le terme est précédé de l’article et semble désigner ici un titre ou une fonction plutôt qu’un nom propre. Littéralement, « As-tu mis ton cœur sur mon serviteur Job ? », c’est-à-dire : « As-tu prêté attention à lui ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante du nom divin conserve ici le nom propre plutôt que de lui substituer le titre « le Seigneur ».
- source_word: הַשָּׂטָן
  choice: l’Accusateur
  rationale: L’article hébreu indique ici vraisemblablement un titre ou une fonction. « L’Accusateur » exprime clairement ce rôle dans la scène de cour céleste.
- source_word: הֲשַׂמְתָּ לִבְּךָ עַל
  choice: As-tu porté ton attention sur
  rationale: Cette formulation française naturelle rend l’expression littérale « as-tu placé ton cœur sur », qui signifie diriger délibérément son attention vers quelqu’un.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte, le mot désigne Job comme appartenant à Dieu et le servant, sans mettre l’accent sur l’esclavage comme statut social.
- source_word: כִּי אֵין כָּמֹהוּ בָּאָרֶץ
  choice: Il n’y a personne comme lui sur la terre
  rationale: La formulation exprime naturellement en français le caractère incomparable de Job et conserve la portée probablement universelle de la proposition.
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: un homme intègre et droit
  rationale: « Intègre » rend la plénitude morale de תָּם sans suggérer une perfection absolue, tandis que « droit » exprime la rectitude morale de יָשָׁר.
- source_word: יְרֵא אֱלֹהִים
  choice: qui craint Dieu
  rationale: Cette traduction conserve l’idiome biblique et sa portée religieuse, qui englobe révérence, fidélité et piété.
- source_word: וְסָר מֵרָע
  choice: et se détourne du mal
  rationale: Le participe décrit une conduite habituelle consistant à éviter et rejeter le mal.
theological_decisions:
- issue: הַשָּׂטָן désigne-t-il ici un nom propre ou un titre ?
  choice: l’Accusateur
  alternative: Satan ; l’adversaire
  rationale: La présence de l’article défini favorise dans ce passage la compréhension d’un titre fonctionnel. La traduction évite donc de transformer trop tôt ce titre en nom propre.
- issue: תָּם affirme-t-il que Job est absolument sans péché ?
  choice: intègre
  alternative: irréprochable ; parfait ; accompli
  rationale: Dans la littérature sapientiale et en association avec « droit », le terme qualifie l’intégrité et la cohérence morales de Job, sans nécessairement affirmer une perfection exempte de tout péché.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible, tandis que les expressions bibliques porteuses de sens théologique (« craint Dieu », « se détourne du mal ») sont conservées.
