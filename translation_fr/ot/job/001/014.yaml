  text: And a messenger came to Job and said[a], “The oxen were plowing, and the donkeys were grazing beside them,”
translation:
  language: fr
  text: 'Un messager vint auprès de Job et dit : « Les bœufs labouraient, et les ânesses broutaient à côté d’eux,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאָךְ
  choice: Un messager
  rationale: Dans ce contexte, מַלְאָךְ désigne l’homme qui vient rapporter un désastre, et non un ange. Le וּ narratif est rendu naturellement par l’enchaînement de la phrase.
- source_word: בָּא אֶל אִיּוֹב
  choice: vint auprès de Job
  rationale: בוא avec אֶל exprime l’arrivée auprès d’une personne. « Vint auprès de Job » convient au registre narratif et évite la tournure moins naturelle « vint à Job ».
- source_word: וַיֹּאמַר
  choice: et dit
  rationale: Le verbe fait progresser le récit; le sujet reste clairement le messager.
- source_word: הַבָּקָר
  choice: Les bœufs
  rationale: בָּקָר peut désigner les bovins en général, mais leur travail de labour justifie ici le terme précis « bœufs ».
- source_word: הָיוּ חֹרְשׁוֹת
  choice: labouraient
  rationale: La construction décrit une action en cours dans le passé. L’imparfait français la rend naturellement.
- source_word: וְהָאֲתֹנוֹת
  choice: et les ânesses
  rationale: Le nom hébreu est explicitement féminin pluriel; le français permet de conserver cette précision sans lourdeur.
- source_word: רֹעוֹת
  choice: broutaient
  rationale: Dans ce contexte animal, רעה désigne l’action de paître; « broutaient » est courant et précis.
- source_word: עַל יְדֵיהֶם
  choice: à côté d’eux
  rationale: Cette expression idiomatique indique la proximité spatiale des ânesses par rapport aux bœufs.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait restitue les actions en cours. La ponctuation finale demeure ouverte, puisque le discours du messager se poursuit au verset suivant.
