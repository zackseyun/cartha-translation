  text: וְ/הִנֵּה֩ ר֨וּחַ גְּדוֹלָ֜ה בָּ֣אָה מֵ/עֵ֣בֶר הַ/מִּדְבָּ֗ר וַ/יִּגַּע֙ בְּ/אַרְבַּע֙ פִּנּ֣וֹת הַ/בַּ֔יִת וַ/יִּפֹּ֥ל עַל הַ/נְּעָרִ֖ים וַ/יָּמ֑וּתוּ וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/019.yaml
  text: And behold[a], a great wind came from across the wilderness and struck the four corners of the house, and it fell on the young men, and they died[b]; and I alone have escaped to tell you.
translation:
  language: fr
  text: Et voici[a] qu’un vent puissant est venu d’au-delà du désert. Il a frappé les quatre coins de la maison, qui s’est écroulée sur les jeunes gens, et ils sont morts[b]. Moi seul, j’ai échappé pour te l’annoncer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et soudain ».'
    reason: La formule hébraïque introduit vivement un événement nouveau et soudain.
  - marker: b
    text: L’hébreu dit « les jeunes gens ». Le terme peut aussi désigner des serviteurs selon le contexte.
    reason: Le mot hébreu possède une amplitude sémantique que la traduction principale ne peut entièrement reproduire.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Cette formule conserve la soudaineté et la vivacité du récit tout en restant naturelle dans un registre narratif digne.
- source_word: רוּחַ גְּדוֹלָה
  choice: un vent violent
  rationale: Dans ce contexte, רוּחַ désigne le vent. « Violent » exprime naturellement en français l’intensité de גְּדוֹלָה sans préciser indûment qu’il s’agit d’une tempête.
- source_word: בָּאָה מֵעֵבֶר הַמִּדְבָּר
  choice: est arrivé de l’autre côté du désert
  rationale: מֵעֵבֶר indique l’autre côté ou l’au-delà du désert. Cette formulation garde l’orientation spatiale sans imposer une géographie plus précise.
- source_word: וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת
  choice: Il a frappé les quatre coins de la maison
  rationale: Le contexte destructeur justifie « frapper » pour נגע; « les quatre coins » et « la maison » rendent directement les termes hébreux.
- source_word: וַיִּפֹּל עַל הַנְּעָרִים
  choice: qui s’est écroulée sur les jeunes gens
  rationale: Le sujet implicite du verbe singulier est naturellement la maison. « S’est écroulée » rend explicitement le sens contextuel de sa chute, tandis que « jeunes gens » préserve la forme masculine de הַנְּעָרִים.
- source_word: וַיָּמֻתוּ
  choice: et ils sont morts
  rationale: Rend simplement le verbe מות sans lui ajouter une valeur causative.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Moi seul, j’ai échappé au désastre
  rationale: « Moi seul » restitue la double insistance de רַק et לְבַדִּי. Le complément « au désastre » rend idiomatique en français l’emploi absolu du verbe « échapper » sans ajouter un agent de délivrance.
- source_word: לְהַגִּיד לָךְ
  choice: pour venir te l’annoncer
  rationale: Cette expression française naturelle rend le but du survivant et la formule répétée des messagers dans le chapitre.
theological_decisions:
- issue: Identité des הַנְּעָרִים
  choice: les jeunes gens
  alternative: les serviteurs / les enfants
  rationale: Le terme masculin peut désigner des jeunes hommes ou des serviteurs selon le contexte. La traduction conserve sa portée lexicale et son genre grammatical sans harmoniser explicitement avec les fils et les filles mentionnés auparavant.
translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque est légèrement restructurée en phrases françaises afin d’éviter une chaîne lourde, tout en conservant la progression rapide du témoignage.
