id: JOB.1.9
reference: Job 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר הַֽ/חִנָּ֔ם יָרֵ֥א אִיּ֖וֹב אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/009.yaml
  text: Then the Accuser answered Yahweh and said[b][a], “Does Job fear God for nothing?"
translation:
  language: fr
  text: 'Alors l’Accusateur[a] répondit à Yahweh : « Est-ce pour rien[b] que Job craint Dieu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « le satan » ou « l’adversaire ». Le terme porte ici l’article et fonctionne comme un titre, d’où « l’Accusateur ».'
    reason: alternative_reading
  - marker: b
    text: Ou « sans raison » ou « sans contrepartie ». La question porte sur le caractère désintéressé de la crainte de Dieu chez Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Dans cette formule narrative, le verbe ענה signifie « répondre ». Le passé simple convient au récit soutenu en français.
- source_word: הַשָּׂטָן
  choice: l’Accusateur
  rationale: L’article hébreu indique ici un titre ou une fonction plutôt qu’un nom propre. « L’Accusateur » rend la dimension judiciaire et oppositionnelle du rôle dans la scène.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte directement le tétragramme, nom personnel divin ; « Yahweh » le transcrit au lieu de lui substituer un titre.
- source_word: וַיֹּאמַר
  choice: introduit par les deux-points
  rationale: Après « répondit », traduire séparément « et dit » serait lourd en français. Les deux-points introduisent naturellement les paroles directes tout en conservant leur fonction narrative.
- source_word: הֲחִנָּם
  choice: pour rien
  rationale: Cette expression naturelle conserve la tension entre l’idée d’absence de motif et celle d’absence d’avantage ou de récompense.
- source_word: יָרֵא
  choice: craint
  rationale: « Craindre » conserve la force du verbe ירא et son sens biblique de crainte révérencielle, sans l’atténuer en « respecter » ou « révérer ».
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne le vrai Dieu et se rend directement par « Dieu ».
theological_decisions:
- issue: Valeur de הַשָּׂטָן avec l’article
  choice: l’Accusateur
  alternative: le satan ; l’adversaire ; Satan
  rationale: L’article présente le terme comme un titre ou une fonction dans cette scène. Ce choix évite d’imposer au passage l’idée qu’il s’agit déjà strictement d’un nom propre, tout en maintenant sa fonction d’accusation.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ; Jéhovah ; le SEIGNEUR
  rationale: La transcription « Yahweh » préserve le nom divin présent dans l’hébreu au lieu de le remplacer par un titre.
- issue: Portée de הֲחִנָּם
  choice: pour rien
  alternative: sans raison ; gratuitement ; sans contrepartie
  rationale: La question met en doute le caractère désintéressé de la crainte de Dieu chez Job. « Pour rien » laisse ouvertes les nuances de cause et d’avantage matériel.
translation_notes:
  register: 'Français moderne, naturel et digne. Le passé simple inscrit la phrase dans le registre narratif. La formule hébraïque littérale « répondit… et dit » est rendue idiomatiquement par « répondit… : », sans perte de contenu. Les guillemets français et l’espace avant le point d’interrogation suivent la typographie française.'
