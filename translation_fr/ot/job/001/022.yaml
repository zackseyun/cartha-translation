  text: בְּ/כָל זֹ֖את לֹא חָטָ֣א אִיּ֑וֹב וְ/לֹא נָתַ֥ן תִּפְלָ֖ה לֵ/אלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/022.yaml
  text: In all this[a], Job did not sin, nor did he charge God with wrongdoing.
translation:
  language: fr
  text: Dans tout cela, Job ne pécha pas et n’accusa pas Dieu d’avoir mal agi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’attribua aucune folie à Dieu » ou « n’attribua rien d’inconvenant à Dieu ».'
    reason: Alternative lexicale pour le nom rare תִּפְלָה, qui peut évoquer la folie, une conduite déplacée ou quelque chose de moralement répréhensible.
lexical_decisions:
- source_word: בְּכָל זֹאת
  choice: Dans tout cela
  rationale: Cette expression renvoie à l’ensemble des événements qui viennent d’être racontés. « Dans tout cela » est naturel en français et conserve cette portée globale.
- source_word: לֹא חָטָא
  choice: ne pécha pas
  rationale: חטא est le verbe courant signifiant « pécher ». Le terme théologique direct est conservé plutôt que remplacé par une formulation morale plus vague.
- source_word: אִיּוֹב
  choice: Job
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וְלֹא נָתַן תִּפְלָה לֵאלֹהִים
  choice: et n’accusa pas Dieu d’avoir mal agi
  rationale: Littéralement, la construction évoque le fait d’attribuer à Dieu תִּפְלָה. La formulation choisie exprime naturellement en français l’idée que Job n’impute à Dieu aucune conduite blâmable, sans affaiblir la force morale du terme.
- source_word: תִּפְלָה
  choice: avoir mal agi
  rationale: Le nom rare désigne ici ce qui est répréhensible, déplacé ou insensé. « Avoir mal agi » communique clairement sa portée morale dans ce contexte, tandis que les autres nuances possibles sont signalées en note.
- source_word: לֵאלֹהִים
  choice: Dieu
  rationale: La préposition ל marque ici la personne à qui une conduite répréhensible aurait été attribuée; אֱלֹהִים désigne clairement Dieu.
theological_decisions:
- issue: Sens de תִּפְלָה lorsqu’il est rapporté à Dieu
  choice: Job n’accusa pas Dieu d’avoir mal agi
  alternative: Job n’attribua à Dieu ni folie ni conduite inconvenante
  rationale: Le texte souligne que Job, malgré ses pertes, n’impute aucune faute à Dieu. La traduction principale rend cette portée morale en français courant, tandis que la note préserve les nuances lexicales de folie et d’inconvenance sans trancher au-delà des données du texte.
translation_notes:
  register: Français international moderne, sobre et digne. « Pécha » conserve le vocabulaire biblique précis; « n’accusa pas Dieu d’avoir mal agi » reste immédiatement compréhensible. La note maintient l’ambiguïté du terme hébreu rare.
