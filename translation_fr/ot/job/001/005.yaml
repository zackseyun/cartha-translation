  text: וַ/יְהִ֡י כִּ֣י הִקִּיפֽוּ֩ יְמֵ֨י הַ/מִּשְׁתֶּ֜ה וַ/יִּשְׁלַ֧ח אִיּ֣וֹב וַֽ/יְקַדְּשֵׁ֗/ם וְ/הִשְׁכִּ֣ים בַּ/בֹּקֶר֮ וְ/הֶעֱלָ֣ה עֹלוֹת֮ מִסְפַּ֣ר כֻּלָּ/ם֒ כִּ֚י אָמַ֣ר אִיּ֔וֹב אוּלַי֙ חָטְא֣וּ בָנַ֔/י וּ/בֵרֲכ֥וּ אֱלֹהִ֖ים בִּ/לְבָבָ֑/ם כָּ֛כָה יַעֲשֶׂ֥ה אִיּ֖וֹב כָּל הַ/יָּמִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/005.yaml
  text: And when the days of the feasting had run their course, Job would send and consecrate them, and he would rise early in the morning and offer burnt offerings according to the number of them all. For Job said, “Perhaps my sons have sinned and cursed God in their hearts.” Thus Job would do all the time.
translation:
  language: fr
  text: 'Quand le cycle des jours de festin était achevé, Job faisait appeler ses enfants et les consacrait. Puis il se levait de bon matin et offrait un holocauste pour chacun d’eux, car il se disait : « Peut-être mes fils ont-ils péché et maudit Dieu dans leur cœur[a]. » Voilà ce que Job faisait continuellement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « béni Dieu dans leur cœur ». Ici, « bénir » est employé par euphémisme au sens de « maudire ».'
    reason: La note rend visible le choix lexical singulier du texte hébreu tout en donnant dans le corps du verset le sens exigé par le contexte.
lexical_decisions:
- source_word: הִקִּיפוּ יְמֵי הַמִּשְׁתֶּה
  choice: le cycle des jours de festin était achevé
  rationale: Le verbe הִקִּיפוּ évoque l’accomplissement d’un tour ou d’un cycle. Cette formulation conserve cette image tout en restant naturelle en français.
- source_word: וַיְקַדְּשֵׁם
  choice: les consacrait
  rationale: Le verbe קדש signifie ici mettre à part ou rendre rituellement prêt devant Dieu. « Consacrait » reste proche de la forme hébraïque sans préciser un rite que le texte ne décrit pas.
- source_word: עֹלוֹת מִסְפַּר כֻּלָּם
  choice: un holocauste pour chacun d’eux
  rationale: עֹלָה désigne une offrande entièrement consumée. La tournure française exprime naturellement que le nombre d’holocaustes correspondait au nombre de ses enfants.
- source_word: בֵּרֲכוּ אֱלֹהִים
  choice: maudit Dieu
  rationale: Bien que ברך signifie normalement « bénir », il fonctionne ici comme un euphémisme contextuel pour « maudire », sens confirmé par les emplois parallèles dans le prologue de Job.
- source_word: כָּל הַיָּמִים
  choice: continuellement
  rationale: L’expression idiomatique signifie que Job agissait ainsi de façon habituelle et répétée, non nécessairement sans interruption.
theological_decisions:
- issue: La valeur de ברך appliqué à Dieu dans la crainte de Job
  choice: maudit Dieu
  alternative: béni Dieu
  rationale: Le contexte présente l’acte comme un péché nécessitant un holocauste, et les occurrences parallèles de Job 1–2 emploient le même euphémisme. Une note signale néanmoins la forme littérale afin de ne pas masquer le procédé du texte hébreu.
- issue: Portée de la consécration accomplie par Job
  choice: les consacrait
  alternative: les purifiait
  rationale: « Consacrait » évite d’affirmer que les enfants avaient effectivement contracté une souillure; Job agit par précaution face à une faute seulement possible.
translation_notes:
  register: Français international moderne, digne et lisible. L’imparfait rend les actions habituelles. « De bon matin » et « holocauste » conservent un registre biblique courant sans archaïsme excessif.
