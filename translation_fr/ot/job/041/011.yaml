  text: מִ֭/פִּי/ו לַפִּידִ֣ים יַהֲלֹ֑כוּ כִּיד֥וֹדֵי אֵ֝֗שׁ יִתְמַלָּֽטוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/011.yaml
  text: From his mouth torches go out[a]; sparks of fire leap forth.
translation:
  language: fr
  text: 'De sa bouche sortent des torches ;

    des étincelles de feu jaillissent[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des brandons » ou « des traits enflammés » ; le terme hébreu est rare.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפִּיו
  choice: De sa bouche
  rationale: 'מִן avec פֶּה et le suffixe masculin singulier indique naturellement l’origine : « de sa bouche ». Le masculin convient à la présentation poétique du Léviathan dans le contexte.'
- source_word: לַפִּידִים
  choice: des torches
  rationale: לַפִּידִים désigne couramment des torches ou des brandons. « Torches » conserve l’image concrète et vive du texte hébreu.
- source_word: יַהֲלֹכוּ
  choice: sortent
  rationale: Le verbe הלך signifie littéralement « aller, marcher », mais avec « de sa bouche » il exprime ici le mouvement vers l’extérieur. « Sortent » est naturel en français et garde cette valeur directionnelle.
- source_word: כִּידוֹדֵי אֵשׁ
  choice: des étincelles de feu
  rationale: כִּידוֹדֵי est un terme rare et discuté. Dans le parallélisme poétique, il évoque des éléments ardents projetés. « Étincelles de feu » convient à l’image sans imposer une interprétation militaire trop précise.
- source_word: יִתְמַלָּטוּ
  choice: jaillissent
  rationale: La racine מלט a normalement l’idée de s’échapper, mais décrit ici une émission soudaine. « Jaillissent » rend cette énergie avec naturel.
