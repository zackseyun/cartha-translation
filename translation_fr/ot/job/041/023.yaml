  text: יַרְתִּ֣יחַ כַּ/סִּ֣יר מְצוּלָ֑ה יָ֝֗ם יָשִׂ֥ים כַּ/מֶּרְקָחָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/023.yaml
  text: He makes the deep boil like a pot[a]; he makes the sea like a pot of ointment.
translation:
  language: fr
  text: Il fait bouillonner les profondeurs comme une marmite ; il rend la mer semblable à une préparation parfumée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à un mélange d’aromates » ou « à un onguent ». Le terme hébreu désigne une préparation composée par mélange, souvent associée aux parfums ou aux onguents.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְתִּיחַ
  choice: fait bouillonner
  rationale: Le hifil de רתח exprime l’action de faire bouillir ou bouillonner. « Fait bouillonner » restitue naturellement en français la force causative et le mouvement des eaux.
- source_word: כַּסִּיר
  choice: comme une marmite
  rationale: סִיר désigne un récipient de cuisson. « Marmite » évoque clairement un liquide en ébullition et convient au registre poétique sans être archaïque.
- source_word: מְצוּלָה
  choice: les profondeurs
  rationale: מְצוּלָה désigne les profondeurs marines ou les eaux profondes. Le pluriel français est idiomatique et maintient le parallélisme avec « la mer ».
- source_word: יָם
  choice: la mer
  rationale: יָם signifie normalement « mer » ; ce choix conserve l’image concrète et le parallélisme poétique.
- source_word: יָשִׂים
  choice: rend
  rationale: Dans cette construction comparative, שׂים a le sens de faire devenir ou de présenter comme. « Rend » est naturel en français et conserve cette valeur résultative.
- source_word: כַּמֶּרְקָחָה
  choice: semblable à une préparation parfumée
  rationale: מֶרְקָחָה désigne une composition obtenue par mélange, souvent associée aux onguents, aux aromates ou à la parfumerie. « Préparation parfumée » exprime ce domaine lexical sans ajouter au texte un second récipient absent de l’hébreu ; la note préserve les autres nuances possibles.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et accessible. Le rythme en deux propositions conserve le parallélisme hébreu. « Marmite » rend concrète l’image de l’ébullition, tandis que la seconde comparaison reste volontairement évocatrice et légèrement énigmatique, comme dans la source.
