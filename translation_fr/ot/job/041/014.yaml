  text: בְּֽ֭/צַוָּאר/וֹ יָלִ֣ין עֹ֑ז וּ֝/לְ/פָנָ֗י/ו תָּד֥וּץ דְּאָבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/014.yaml
  text: In his neck strength lodges[a], and before him dismay leaps.
translation:
  language: fr
  text: 'Dans son cou loge la force,

    et devant lui bondit l’épouvante.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «devant lui bondit la consternation». Le nom hébreu דְּאָבָה est rare; dans ce contexte poétique, son sens peut aller de la consternation ou de l’abattement jusqu’à l’épouvante.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצַוָּארוֹ
  choice: Dans son cou
  rationale: Le ב locatif avec צַוָּאר et le suffixe masculin singulier présente le cou comme le lieu où réside la force; cette formulation conserve l’image hébraïque.
- source_word: יָלִין
  choice: loge
  rationale: Le verbe לין signifie proprement «passer la nuit, loger». Employé métaphoriquement, il personnifie la force comme une présence établie.
- source_word: עֹז
  choice: la force
  rationale: Équivalent direct et naturel du nom courant désignant la force ou la puissance.
- source_word: וּלְפָנָיו
  choice: et devant lui
  rationale: Rend naturellement l’expression idiomatique signifiant «devant, en avant de lui».
- source_word: תָּדוּץ
  choice: bondit
  rationale: Ce verbe rare évoque un mouvement vif, le fait de sauter ou bondir; «bondit» préserve la personnification poétique sans la tonalité positive que pourrait suggérer «danse».
- source_word: דְּאָבָה
  choice: l’épouvante
  rationale: Le nom rare peut évoquer l’effroi, l’abattement ou la consternation. Dans ce contexte, «épouvante» exprime naturellement la peur qui précède le Léviathan, sans éliminer l’incertitude signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le présent «loge» maintient l’image concrète de la force établie dans le cou; «bondit» conserve la vive personnification du second membre.
