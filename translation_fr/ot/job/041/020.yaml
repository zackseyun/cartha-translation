  text: לֹֽא יַבְרִיחֶ֥/נּוּ בֶן קָ֑שֶׁת לְ֝/קַ֗שׁ נֶהְפְּכוּ ל֥/וֹ אַבְנֵי קָֽלַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/020.yaml
  text: The son of the bow cannot make him flee[a]; slingstones become like stubble to him.
translation:
  language: fr
  text: L’archer ne peut le mettre en fuite[a] ; les pierres de fronde deviennent pour lui comme du chaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « le fils de l’arc », c’est-à-dire l’archer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַבְרִיחֶנּוּ
  choice: ne peut le mettre en fuite
  rationale: Le hiphil de ברח avec un suffixe objet masculin singulier exprime l’action de faire fuir. « Mettre en fuite » conserve clairement cette valeur causative dans un français naturel et soutenu.
- source_word: בֶן קָשֶׁת
  choice: l’archer
  rationale: Littéralement « fils de l’arc », cette tournure hébraïque désigne celui qui manie l’arc. « L’archer » transmet directement l’expression idiomatique en français moderne ; la formulation littérale est signalée en note.
- source_word: לְקַשׁ
  choice: comme du chaume
  rationale: קשׁ désigne les tiges sèches restant après la moisson, matière légère et sans résistance. « Chaume » restitue précisément l’image.
- source_word: נֶהְפְּכוּ לוֹ
  choice: deviennent pour lui
  rationale: 'Le niphal de הפך marque ici un changement d’état ou d’effet : par rapport à lui, les projectiles deviennent aussi insignifiants que du chaume. La traduction préserve la construction avec לוֹ sans l’interpréter comme un simple jugement mental.'
- source_word: אַבְנֵי קָלַע
  choice: les pierres de fronde
  rationale: Le groupe construit désigne les pierres lancées au moyen d’une fronde. « Pierres de fronde » est clair, exact et naturel en français.
