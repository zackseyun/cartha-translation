  text: נַ֭פְשׁ/וֹ גֶּחָלִ֣ים תְּלַהֵ֑ט וְ֝/לַ֗הַב מִ/פִּ֥י/ו יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/013.yaml
  text: His breath kindles coals[a], and a flame comes out from his mouth.
translation:
  language: fr
  text: Son souffle embrase les braises[a], et une flamme sort de sa bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Son âme » ou « Sa gorge embrase les braises ». Le nom hébreu נֶפֶשׁ peut désigner l’âme, la vie ou la gorge et, par extension dans ce contexte, le souffle.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: son souffle
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la gorge. Ici, le parallélisme avec « de sa bouche » et l’image d’une exhalation enflammée favorisent le sens contextuel « souffle », naturel en français.
- source_word: גֶּחָלִים
  choice: les braises
  rationale: Le nom désigne des charbons ardents ou des braises. « Braises » exprime clairement l’image en français courant, sans ajouter un adjectif redondant.
- source_word: תְּלַהֵט
  choice: embrase
  rationale: La forme intensive et causative du verbe להט signifie faire brûler ou flamber. « Embrase » en conserve la force tout en restant concise et poétique.
- source_word: וְלַהַב
  choice: et une flamme
  rationale: לַהַב est un nom singulier signifiant « flamme ». L’article indéfini donne une syntaxe française naturelle tout en préservant l’image au singulier.
- source_word: מִפִּיו
  choice: de sa bouche
  rationale: Traduction directe et idiomatique de la préposition מִן avec « bouche » et le suffixe possessif.
- source_word: יֵצֵא
  choice: sort
  rationale: Le verbe יצא signifie sortir. Avec « de sa bouche », « sort » est la formulation française la plus directe et naturelle.
