  text: אִישׁ בְּ/אָחִ֥י/הוּ יְדֻבָּ֑קוּ יִ֝תְלַכְּד֗וּ וְ/לֹ֣א יִתְפָּרָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/009.yaml
  text: Each one sticks to its fellow[a]; they are clasped together and cannot be separated.
translation:
  language: fr
  text: Chacune est attachée à sa compagne[a] ; elles s’imbriquent et ne se séparent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chacune avec son frère ». Dans cette image poétique des écailles du Léviathan, « frère » est une personnification relationnelle; « compagne » rend naturellement ce lien entre écailles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Chacune
  rationale: אִישׁ a ici une valeur distributive dans la description des écailles du Léviathan. Le féminin renvoie naturellement à « écaille » dans le contexte français.
- source_word: בְּאָחִיהוּ
  choice: à sa voisine
  rationale: Littéralement « avec/à son frère ». Pour des écailles adjacentes, « sa voisine » rend naturellement la relation de proximité tout en conservant la métaphore relationnelle; le sens littéral est signalé en note.
- source_word: יְדֻבָּקוּ
  choice: adhère
  rationale: Le verbe דבק exprime une adhérence étroite. Le singulier français correspond à la portée distributive de « chacune ».
- source_word: יִתְלַכְּדוּ
  choice: elles s’imbriquent
  rationale: Le verbe évoque des éléments saisis, retenus ou étroitement liés les uns aux autres. « S’imbriquent » convient à l’image concrète d’écailles jointives sans devenir excessivement technique.
- source_word: וְלֹא יִתְפָּרָדוּ
  choice: et ne se séparent pas
  rationale: Cette formulation rend directement l’imparfait hébreu nié, sans renforcer explicitement l’énoncé en une impossibilité absolue.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve le mouvement distributif du premier membre puis le pluriel collectif du second. « Adhère » et « s’imbriquent » rendent de façon concrète le parallélisme des deux verbes hébreux.
