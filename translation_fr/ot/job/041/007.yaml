  source_fidelity: Le texte hébreu présente d’abord « fierté » (גַּאֲוָה) en rapport avec les rangées de boucliers, plutôt que d’employer sans ambiguïté un adjectif qualifiant ces rangées. La seconde partie les décrit comme fermées par l’image d’un sceau étanche. La révision rend plus explicitement ce rapport tout en conservant l’image des plaques protectrices.
