- source_word: גַּאֲוָה
  choice: fières
  rationale: Le nom « orgueil, majesté, fierté » qualifie ici naturellement, en français, l’aspect imposant des rangées de plaques protectrices.
- source_word: אֲפִיקֵי מָגִנִּים
  choice: rangées de boucliers
  rationale: אֲפִיקֵי peut désigner des lignes ou rangées; « boucliers » conserve l’image des plaques protectrices du Léviathan.
- source_word: סָגוּר
  choice: sont closes
  rationale: Rend l’idée de fermeture complète tout en s’accordant en français avec « rangées ».
- source_word: חוֹתָם צָר
  choice: étroitement scellées
  rationale: L’expression évoque un sceau serré, sans interstice; cette formulation conserve à la fois l’image du sceau et l’intensité.
