  text: אֶחָ֣ד בְּ/אֶחָ֣ד יִגַּ֑שׁוּ וְ֝/ר֗וּחַ לֹא יָב֥וֹא בֵֽינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/008.yaml
  text: They press close[a], one to another, and no air can come between them.
translation:
  language: fr
  text: Elles se serrent l’une contre l’autre, et l’air[a] ne passe pas entre elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «le vent» ou «un souffle». Le mot hébreu peut signifier «air», «vent» ou «souffle»; il désigne ici une réalité physique.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד בְּאֶחָד
  choice: l’une contre l’autre
  rationale: La tournure distributive exprime la proximité réciproque de chaque écaille avec la suivante; le féminin renvoie naturellement aux écailles décrites dans le contexte.
- source_word: יִגַּשׁוּ
  choice: se serrent
  rationale: 'Dans la description des écailles étroitement jointes, ce verbe indique ici davantage qu’un simple rapprochement: elles sont pressées les unes contre les autres.'
- source_word: וְרוּחַ
  choice: souffle d’air
  rationale: רוּחַ peut désigner l’air, le vent ou le souffle. «Souffle d’air» convient à la réalité physique décrite tout en conservant la nuance de mouvement de l’air.
- source_word: לֹא יָבוֹא
  choice: ne passe
  rationale: Littéralement, l’air «ne vient» pas entre elles. En français idiomatique, «ne passe» exprime clairement l’absence de tout interstice sans ajouter explicitement une modalité absente de la forme hébraïque.
- source_word: בֵינֵיהֶם
  choice: entre elles
  rationale: La préposition indique l’espace séparant les éléments adjacents; le pronom féminin reprend «les écailles» du contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le verset conserve l’image concrète d’écailles si étroitement serrées que l’air ne passe pas entre elles.
