  text: מִ֭/שֵּׂת/וֹ יָג֣וּרוּ אֵלִ֑ים מִ֝/שְּׁבָרִ֗ים יִתְחַטָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/017.yaml
  text: At his rising the mighty are afraid; at the crashing they are beside themselves.
translation:
  language: fr
  text: Quand il se dresse, les puissants prennent peur ; devant le fracas, ils perdent tous leurs moyens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשֵּׂתוֹ
  choice: Quand il se dresse
  rationale: Le nom שֵׂת, avec suffixe, désigne ici vraisemblablement le fait que le Léviathan se lève ou se dresse. La tournure française rend naturellement la valeur circonstancielle de מִן.
- source_word: אֵלִים
  choice: les puissants
  rationale: Le terme peut désigner des êtres forts ou puissants, voire des dieux selon le contexte. Ici, « les puissants » préserve la portée générale sans imposer une identification théologique.
- source_word: מִשְּׁבָרִים
  choice: devant le fracas
  rationale: Le pluriel שְׁבָרִים évoque des bris, des déferlements ou des chocs retentissants. « le fracas » conserve l'image sonore et violente sans préciser indûment sa cause.
- source_word: יִתְחַטָּאוּ
  choice: ils perdent tous leurs moyens
  rationale: La forme rare peut exprimer le désarroi ou l'affolement. Cette expression française actuelle traduit l'idée d'être bouleversé au point de ne plus savoir agir, plutôt qu'un sens cultuel de purification peu probable ici.
theological_decisions:
- issue: Identité des אֵלִים
  choice: les puissants
  alternative: les dieux
  rationale: Le contexte décrit l'effroi provoqué par le Léviathan, mais ne permet pas de trancher avec certitude entre êtres puissants, héros et êtres divins. « Les puissants » maintient cette ouverture sans introduire une précision doctrinale.
translation_notes:
  register: Français moderne, naturel et digne. Le parallélisme en deux membres est conservé, avec une formulation vive et intelligible.
