  text: The sword that reaches him cannot stand[a]; nor can spear, dart[b], or javelin.
translation:
  language: fr
  text: L’épée qui l’atteint ne peut tenir[a], pas plus que la lance, le trait[b] ou le javelot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’épée qui le rattrape ne l’emporte pas. » Littéralement, l’hébreu dit qu’elle « ne se tient pas ».'
    reason: lexical_alternative
  - marker: b
    text: Les termes hébreux rendus par « trait » et « javelot » sont rares et leur sens est incertain. Le premier peut aussi désigner un projectile ou une hampe, et le second une cotte de mailles ou une armure.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשִּׂיגֵהוּ
  choice: qui l’atteint
  rationale: Le verbe signifie « atteindre, rattraper ». « Qui l’atteint » convient à l’épée sans préciser indûment qu’elle blesse.
- source_word: חֶרֶב
  choice: l’épée
  rationale: Nom courant de l’épée, employé ici de façon générique.
- source_word: בְּלִי תָקוּם
  choice: ne tient pas
  rationale: La tournure signifie littéralement que l’épée « ne se tient pas » ou « ne subsiste pas ». « Ne tient pas » conserve l’image concrète tout en exprimant son inefficacité.
- source_word: חֲנִית
  choice: la lance
  rationale: Équivalent français courant et accessible de cette arme d’hast.
- source_word: מַסָּע
  choice: le trait
  rationale: Ce terme rare et incertain semble désigner ici un projectile ou une hampe. « Trait » préserve cette portée générale sans imposer une identification trop précise.
- source_word: וְשִׁרְיָה
  choice: ou le javelot
  rationale: Dans cette série d’armes offensives, le sens « javelot » est contextuellement plausible, bien que le terme rare puisse aussi désigner une cotte de mailles ou une armure.
