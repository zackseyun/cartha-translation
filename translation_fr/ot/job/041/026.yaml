id: JOB.41.26
reference: Job 41:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵֽת כָּל גָּבֹ֥הַּ יִרְאֶ֑ה ה֝֗וּא מֶ֣לֶךְ עַל כָּל בְּנֵי שָֽׁחַץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/041/026.yaml
  text: He looks on everything that is high[a]; he is king over all the sons of pride.
translation:
  language: fr
  text: Il voit tout ce qui est élevé[a] ; lui, il est roi de tous les fils de l’orgueil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les hautains » ou « tous les orgueilleux ».
    reason: lexical_alternative
  - marker: b
    text: Expression poétique pouvant désigner tous les êtres caractérisés par l’orgueil.
    reason: idiom_clarification
lexical_decisions:
- source_word: אֵת כָּל גָּבֹהַּ
  choice: tout ce qui est élevé
  rationale: אֵת marque le complément d’objet de יִרְאֶה, et כָּל suivi de l’adjectif singulier גָּבֹהַּ a une portée globale. Cette formulation française conserve l’image de la hauteur sans exclure la nuance figurée d’orgueil.
- source_word: יִרְאֶה
  choice: il voit
  rationale: Le verbe ראה signifie d’abord « voir ». Le présent français convient à cette description poétique et évite d’ajouter une nuance de mépris ou de domination absente du verbe lui-même.
- source_word: הוּא
  choice: lui, il
  rationale: Le pronom indépendant est exprimé afin de préserver son relief emphatique dans la seconde proposition.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Le terme désigne directement un roi et maintient la métaphore de la suprématie.
- source_word: עַל כָּל בְּנֵי שָׁחַץ
  choice: de tous les fils de l’orgueil
  rationale: « Roi de » est idiomatique en français pour exprimer la souveraineté, tandis que « fils de l’orgueil » conserve l’expression métaphorique hébraïque sans la réduire à une catégorie précise d’êtres.
theological_decisions:
- issue: Identification des « fils de l’orgueil »
  choice: Maintenir cette désignation poétique ouverte, applicable aux êtres caractérisés par l’orgueil ou la hauteur.
  alternative: Préciser qu’il s’agit de bêtes féroces ou de puissances cosmiques.
  rationale: Le texte hébreu ne délimite pas explicitement la catégorie visée. La traduction préserve donc l’ambiguïté zoologique et mythopoétique.
- issue: Rapport entre « ce qui est élevé » et l’orgueil
  choice: Conserver dans le texte l’image concrète de la hauteur, avec une note signalant la lecture figurée possible.
  alternative: Traduire directement par « tous les orgueilleux ».
  rationale: גָּבֹהַּ désigne littéralement ce qui est haut ou élevé, mais peut évoquer la hauteur d’esprit. Traduire l’image et noter l’autre lecture préserve les deux dimensions.
translation_notes:
  register: Français moderne, sobre et poétique. La reprise « lui, il » rend l’emphase de הוּא sans archaïsme. « Fils de l’orgueil » conserve volontairement la métaphore et son indétermination.
