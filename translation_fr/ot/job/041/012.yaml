  text: מִ֭/נְּחִירָי/ו יֵצֵ֣א עָשָׁ֑ן כְּ/ד֖וּד נָפ֣וּחַ וְ/אַגְמֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/012.yaml
  text: Smoke goes out from his nostrils[b][a], like a boiling pot and burning rushes.
translation:
  language: fr
  text: De ses narines sort de la fumée, comme d’une marmite chauffée[a] et de joncs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un chaudron ». Le mot hébreu peut désigner une marmite ou un récipient plus grand, comparable à un chaudron. Le terme rendu par « chauffée » évoque ce qui est attisé ou chauffé par le souffle.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « et des joncs ». Il peut s’agir de joncs employés comme combustible, qui contribueraient à l’image de la fumée, mais le texte ne dit pas explicitement qu’ils brûlent.
    reason: cultural_note
lexical_decisions:
- source_word: מִנְּחִירָיו
  choice: de ses narines
  rationale: נְחִירַיִם désigne les narines ou le nez. Le pluriel « narines » conserve l’image corporelle précise, avec la préposition מִן et le suffixe masculin singulier.
- source_word: יֵצֵא עָשָׁן
  choice: sort de la fumée
  rationale: L’imparfait de יצא décrit ici une action caractéristique. L’inversion « sort de la fumée » est naturelle en français poétique et garde l’ordre d’image de l’hébreu.
- source_word: כְּדוּד
  choice: comme d’une marmite
  rationale: דּוּד peut désigner un récipient de cuisson, depuis la marmite jusqu’au chaudron. « Marmite » est courant et convient à l’image de l’ébullition.
- source_word: נָפוּחַ
  choice: bouillonnante
  rationale: Le participe évoque ce qui est attisé ou chauffé par le souffle. Appliqué à la marmite dans cette comparaison, « bouillonnante » exprime naturellement l’effet visible sans alourdir la phrase.
- source_word: וְאַגְמֹן
  choice: et de joncs qui brûlent
  rationale: אַגְמוֹן désigne des joncs ou roseaux de marais. Dans l’image de la fumée produite par une chaleur attisée, la formulation explicite leur combustion probable, tout en signalant cette nuance dans une note.
