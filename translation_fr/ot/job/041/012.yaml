  naturalness: La phrase est fluide et d’un registre poétique naturel. « Marmite chauffée » est un peu moins imagé que « marmite bouillonnante », mais est plus sobre et fidèle; la note peut expliciter la nuance d’une chaleur attisée.
  terminology: « Narines », « fumée », « marmite » et « joncs » sont appropriés en français international moderne. « Chaudron » constitue une bonne alternative lexicale. Les notes doivent éviter de présenter comme littérale ou certaine l’idée que les joncs brûlent.
