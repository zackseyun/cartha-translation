  text: לא אַחֲרִ֥ישׁ בַּדָּ֑י/ו וּ/דְבַר גְּ֝בוּר֗וֹת וְ/חִ֣ין עֶרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/004.yaml
  text: I will not keep silent about his limbs[a], or the account of his mighty strength and the grace of his proportions.
translation:
  language: fr
  text: Je ne passerai pas sous silence ses membres[a], sa force prodigieuse ni l’élégance de sa structure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses parties, le récit de ses puissants exploits et la beauté de son agencement ».
    reason: La syntaxe poétique et les mots בַּדָּיו, גְּבוּרוֹת et עֶרְכּוֹ permettent une traduction plus littérale qui met l’accent sur les parties du corps, les manifestations de puissance et leur agencement.
lexical_decisions:
- source_word: אַחֲרִישׁ
  choice: Je ne passerai pas sous silence
  rationale: Le hiphil de חרשׁ exprime ici le fait de s’abstenir de parler. Cette tournure française naturelle conserve la résolution à la première personne.
- source_word: בַּדָּיו
  choice: ses membres
  rationale: בַּד peut désigner des parties ou des membres. Dans la description corporelle du Léviathan, « membres » est concret et adapté au contexte.
- source_word: דְבַר
  choice: sa
  rationale: Dans cette construction poétique, דְבַר introduit ce dont le locuteur va parler. Plutôt que de traduire lourdement par « le récit de », le français exprime directement l’objet du discours.
- source_word: גְּבוּרוֹת
  choice: force prodigieuse
  rationale: Le pluriel peut désigner des puissances, des exploits ou des manifestations de puissance. Ici, la description physique du Léviathan favorise l’idée de sa force extraordinaire.
- source_word: חִין
  choice: l’élégance
  rationale: חֵן évoque la grâce, le charme ou la beauté. « Élégance » rend ici sa valeur esthétique sans suggérer la grâce théologique.
- source_word: עֶרְכּוֹ
  choice: sa structure
  rationale: Dérivé de ערך, le terme évoque l’agencement ou l’ordonnance. « Structure » convient à la forme corporelle de l’animal tout en gardant l’idée d’organisation.
theological_decisions: []
