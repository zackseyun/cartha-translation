  text: לֹֽא אַ֭כְזָר כִּ֣י יְעוּרֶ֑/נּוּ וּ/מִ֥י ה֝֗וּא לְ/פָנַ֥/י יִתְיַצָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/002.yaml
  text: No one is so fierce that he dares to stir him up[a]. Who then is he who can stand before me?
translation:
  language: fr
  text: Nul n’est assez féroce pour oser le réveiller[a]. Qui donc pourrait se tenir devant moi ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le réveiller » ou « l’éveiller ». Dans ce contexte, il s’agit de pousser le Léviathan à réagir, donc de le provoquer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אַכְזָר
  choice: Personne n’est assez intrépide
  rationale: אַכְזָר évoque ici une dureté ou une audace redoutable. Dans ce contexte, « intrépide » exprime naturellement le courage téméraire nécessaire pour affronter le Léviathan, sans donner au terme une portée exclusivement morale comme le ferait « cruel ».
- source_word: כִּי יְעוּרֶנּוּ
  choice: pour le provoquer
  rationale: Le verbe עור signifie littéralement « réveiller, éveiller, mettre en mouvement ». Appliqué au Léviathan, il désigne ici le fait de le faire réagir en le provoquant. La construction française avec « assez… pour » restitue la relation entre les deux propositions.
- source_word: וּמִי הוּא
  choice: Qui donc
  rationale: Le waw et le pronom emphatique font progresser l’argument et renforcent la question rhétorique. « Qui donc » rend cet effet sans lourdeur.
- source_word: לְפָנַי יִתְיַצָּב
  choice: pourrait se tenir devant moi
  rationale: Le hitpael de יצב signifie « se placer, prendre position, se tenir ». Le conditionnel « pourrait » explicite la portée rhétorique de la question, tandis que « devant moi » conserve l’image de la présence ou de la confrontation.
theological_decisions:
- issue: Passage du Léviathan à Dieu dans la seconde phrase
  choice: '« moi » désigne Dieu : si personne n’ose provoquer le Léviathan, à plus forte raison personne ne peut tenir devant son Créateur.'
  alternative: Comprendre les deux phrases comme se rapportant uniquement au Léviathan.
  rationale: Le suffixe de première personne dans לְפָנַי (« devant moi ») renvoie naturellement au locuteur divin. Le texte développe ainsi un raisonnement du plus petit au plus grand, sans effacer la transition rhétorique.
translation_notes:
  register: Français moderne, international et digne. « Intrépide » évite le contresens moral possible de « cruel » tout en conservant l’idée d’une audace extrême. La formulation reste concise et suit le mouvement rhétorique de l’hébreu.
