  - severity: medium
    issue: « provoquer » remplace le sens lexical premier de יְעוּרֶנּוּ dans le texte principal.
    rationale: Le verbe signifie « réveiller, éveiller, réveiller de son sommeil »; la provocation est le sens contextuel. Une traduction principale plus proche peut conserver ce sens, tandis que la note explique l'implication de provocation.
