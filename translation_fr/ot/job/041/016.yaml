  text: לִ֭בּ/וֹ יָצ֣וּק כְּמוֹ אָ֑בֶן וְ֝/יָצ֗וּק כְּ/פֶ֣לַח תַּחְתִּֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/016.yaml
  text: His heart is hard like a stone[a], hard like the lower millstone.
translation:
  language: fr
  text: Son cœur est dur comme la pierre[a], dur comme la meule inférieure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ferme comme la pierre »; le verbe hébreu évoque littéralement ce qui est coulé, et donc rigide ou solide.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבּוֹ
  choice: son cœur
  rationale: לֵב désigne ici le cœur comme centre intérieur; « cœur » conserve l’image concrète et convient naturellement à cette description poétique de Léviathan.
- source_word: יָצוּק
  choice: est dur
  rationale: Le verbe יצק signifie littéralement « verser, couler »; dans cet emploi passif, il évoque une matière coulée devenue rigide ou solide. « Est dur » exprime clairement l’effet de cette image en français moderne.
- source_word: כְּמוֹ אָבֶן
  choice: comme la pierre
  rationale: Cette formulation naturelle conserve la comparaison concrète avec la pierre et sa dureté.
- source_word: וְיָצוּק
  choice: dur
  rationale: La répétition de יָצוּק renforce le parallélisme poétique. Répéter « dur » restitue cette insistance sans lourdeur excessive.
- source_word: כְּפֶלַח תַּחְתִּית
  choice: comme la meule inférieure
  rationale: Dans ce contexte, פֶלַח associé à תַּחְתִּית désigne vraisemblablement la pierre inférieure d’un moulin, particulièrement lourde et dure. « Meule inférieure » est précis et idiomatique.
