  text: אַ֭חֲרָי/ו יָאִ֣יר נָתִ֑יב יַחְשֹׁ֖ב תְּה֣וֹם לְ/שֵׂיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/024.yaml
  text: Behind him a path shines[b][a]; one would think the deep to be gray-haired.
translation:
  language: fr
  text: Derrière lui, un sentier resplendit[a] ; on croirait que l’abîme a des cheveux blancs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Après son passage, un sentier resplendit ». L’hébreu peut se comprendre dans un sens spatial (« derrière lui ») ou temporel (« après lui ») ; le contexte du sillage sur l’eau favorise « derrière lui ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « l’abîme comme des cheveux blancs » ou « comme la blancheur de l’âge » : l’écume fait paraître les eaux profondes blanches, comme une chevelure blanchie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Derrière lui
  rationale: La forme peut exprimer une succession spatiale ou temporelle. Dans cette évocation du Léviathan avançant dans l’eau, le sens spatial décrit le sillage qu’il laisse derrière lui, tout en signalant l’autre lecture en note.
- source_word: יָאִיר
  choice: resplendit
  rationale: Le hiphil de אור signifie « donner de la lumière » ou « faire briller ». « Resplendit » rend de façon poétique mais claire l’éclat du sillage écumeux.
- source_word: נָתִיב
  choice: un sentier
  rationale: Le nom désigne un chemin ou une piste. « Sentier » conserve ici la métaphore d’une voie lumineuse tracée sur les eaux.
- source_word: יַחְשֹׁב
  choice: on croirait
  rationale: Bien que le verbe soit formellement à la troisième personne du masculin singulier, il peut avoir une valeur impersonnelle. « On croirait » exprime naturellement l’impression produite sur l’observateur.
- source_word: תְּהוֹם
  choice: l’abîme
  rationale: Le terme désigne les eaux profondes. « L’abîme » garde la force poétique du mot sans le réduire à la seule mer visible.
- source_word: לְשֵׂיבָה
  choice: a des cheveux blancs
  rationale: שֵׂיבָה peut désigner les cheveux blancs, la blancheur de l’âge ou la vieillesse. Cette formulation personnifie l’abîme et rend l’image de l’écume blanche sans l’expliquer directement dans le verset.
