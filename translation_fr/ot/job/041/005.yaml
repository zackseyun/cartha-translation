  text: מִֽי גִ֭לָּה פְּנֵ֣י לְבוּשׁ֑/וֹ בְּ/כֶ֥פֶל רִ֝סְנ֗/וֹ מִ֣י יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/005.yaml
  text: Who has stripped off the front of his garment? Who can come within his double bridle?[a]
translation:
  language: fr
  text: Qui a mis à nu la surface de son vêtement ? Qui peut entrer dans le double de sa bride[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Qui entrera dans le repli de sa bride ? » L’expression hébraïque est difficile ; elle peut désigner métaphoriquement la gueule, les mâchoires ou une double rangée de dents du Léviathan.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִלָּה
  choice: a découvert
  rationale: Le verbe signifie « découvrir, mettre à nu ». Cette formulation française conserve l’image d’un revêtement qu’on écarte sans imposer l’idée plus précise d’un dépouillement.
- source_word: פְּנֵי לְבוּשׁוֹ
  choice: le devant de son vêtement
  rationale: La traduction garde les éléments concrets « face/devant » et « vêtement », sans identifier explicitement ce vêtement à la peau ou aux écailles.
- source_word: בְּכֶפֶל
  choice: entre les deux parties
  rationale: כפל évoque ce qui est double ou replié. « Entre les deux parties » rend l’accès à une structure doublée tout en laissant l’image ouverte.
- source_word: רִסְנוֹ
  choice: son mors
  rationale: רסן désigne normalement un mors, une bride ou une muselière. « Mors » est concis et conserve la métaphore équestre appliquée à la région de la gueule.
- source_word: מִי יָבוֹא
  choice: Qui pénétrera
  rationale: Dans cette question de défi, le verbe exprime l’idée d’entrer ou de s’aventurer à l’intérieur. Le futur français communique naturellement l’impossibilité implicite.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La formulation maintient le parallélisme interrogatif et l’obscurité réelle de l’image hébraïque, avec une note présentant l’autre analyse possible.
