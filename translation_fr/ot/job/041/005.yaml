revisions:
- from: Qui a découvert le devant de son vêtement ? Qui pénétrera entre les deux parties de son mors[a] ?
  to: Qui a mis à nu la surface de son vêtement ? Qui peut entrer dans le double de sa bride[a] ?
  rationale: La révision rend plus précisément la valeur extérieure de פני (« surface »), conserve l’image concrète du vêtement, et retire l’interprétation excessive « entre les deux parties ». « Dans le double de sa bride » maintient l’obscurité syntaxique et imagée du texte hébreu ; la note expose sans trancher les principales possibilités. Le présent modal « peut » rend le défi rhétorique de la seconde question.
