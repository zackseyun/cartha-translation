  text: הֵן תֹּחַלְתּ֥/וֹ נִכְזָ֑בָה הֲ/גַ֖ם אֶל מַרְאָ֣י/ו יֻטָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/001.yaml
  text: Behold[a], his hope proves false[b]; is one not cast down even at the sight of him?
translation:
  language: fr
  text: Voici, son espoir se révèle illusoire[a] ; n’est-on pas terrassé rien qu’à le voir[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son attente est déçue » ou « sa confiance s’effondre ». Le verbe hébreu peut indiquer que l’espoir s’avère trompeur ou qu’il est déçu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne tombe-t-on pas à terre à sa seule vue ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: Introduit avec force l’affirmation et attire l’attention, tout en gardant un ton poétique et digne.
- source_word: תֹּחַלְתּוֹ
  choice: son espoir
  rationale: Rend directement le nom « espoir, attente » et conserve le pronom masculin du texte hébreu sans en préciser artificiellement le référent.
- source_word: נִכְזָבָה
  choice: se révèle illusoire
  rationale: 'Exprime le résultat porté par le verbe : l’espoir s’avère trompeur, sans suggérer seulement le sentiment subjectif d’une personne déçue.'
- source_word: הֲגַם
  choice: n’est-on pas… rien que
  rationale: 'La question négative restitue la force rhétorique, tandis que « rien que » communique l’intensification : la seule vue suffit.'
- source_word: אֶל מַרְאָיו
  choice: rien qu’à le voir
  rationale: Formulation française naturelle pour la réaction provoquée par la vue ou l’apparence du Léviathan; elle exprime idiomatiquement l’idée de sa seule vue.
- source_word: יֻטָל
  choice: terrassé
  rationale: Le passif rend l’idée d’être jeté à terre ou abattu; « terrassé » reste concis et peut évoquer aussi bien l’effondrement que la peur accablante.
