  yaml_path: translation/ot/job/041/019.yaml
  text: He regards iron as straw[a], and bronze as rotten wood.
translation:
  language: fr
  text: Il considère le fer comme de la paille, et le bronze[a] comme du bois pourri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cuivre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְשֹׁב
  choice: considère
  rationale: Le verbe חָשַׁב exprime ici une appréciation ou une manière de tenir quelque chose pour tel; « considère » rend naturellement cette évaluation.
- source_word: לְתֶבֶן
  choice: comme de la paille
  rationale: תֶּבֶן désigne couramment la paille; la préposition לְ introduit ici ce à quoi le fer est assimilé.
- source_word: בַּרְזֶל
  choice: le fer
  rationale: Désignation ordinaire de ce métal dans ce contexte.
- source_word: לְעֵץ רִקָּבוֹן
  choice: comme du bois pourri
  rationale: L’expression signifie littéralement « comme du bois de pourriture »; « bois pourri » conserve l’image tout en étant idiomatique en français moderne.
- source_word: נְחוּשָׁה
  choice: le bronze
  rationale: נְחוּשָׁה peut désigner le cuivre ou le bronze. « Bronze » convient au contexte de matériaux résistants et maintient l’ambiguïté lexicale dans une note.
