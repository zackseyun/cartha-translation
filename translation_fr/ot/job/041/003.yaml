source:
  edition: WLC
  text: מִ֣י הִ֭קְדִּימַ/נִי וַ/אֲשַׁלֵּ֑ם תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם לִ/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/003.yaml
  text: Who has first given to me[a], that I should repay him? Whatever is under all the heavens is mine.
translation:
  language: fr
  text: Qui m’a accordé un bienfait le premier[a], pour que je doive le lui rendre ? Tout ce qui est sous tous les cieux est à moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Qui m’a devancé, pour que je doive le lui rendre ? » Le verbe hébreu peut signifier « venir avant » ou « prendre les devants » ; ici, il désigne probablement le fait d’accorder d’abord un bienfait, de manière à obliger l’autre à rendre en retour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif ouvre une question rhétorique. « Qui » en conserve directement la force sans ajouter d’emphase.
- source_word: הִקְדִּימַנִי
  choice: m’a fait un don le premier
  rationale: Le hiphil de קדם signifie littéralement « venir avant, devancer » ; associé à « rendre », il évoque ici le fait de prendre les devants en accordant un bienfait qui créerait une dette. Cette formulation exprime naturellement l’idiome en français, tandis que la note conserve le sens plus formel.
- source_word: וַאֲשַׁלֵּם
  choice: pour que je doive le lui rendre
  rationale: 'Dans cette question rhétorique, le verbe exprime la conséquence du don préalable : Dieu serait tenu de rendre en retour. « doive » rend cette obligation implicite sans transformer la phrase en promesse.'
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: sous tous les cieux
  rationale: Cette expression suit de près le pluriel hébreu et désigne la totalité du monde créé.
- source_word: לִי הוּא
  choice: est à moi
  rationale: La tournure possessive française est concise et garde l’affirmation emphatique de propriété. « Tout ce qui » explicite naturellement la totalité sous-entendue par la construction hébraïque.
theological_decisions:
- issue: La dette envers Dieu et la souveraineté de Dieu sur la création
  choice: La question nie que quiconque puisse obliger Dieu en lui donnant d’abord quelque chose ; la seconde phrase affirme que tout ce qui est sous les cieux lui appartient.
  alternative: Traduire plus littéralement le premier verbe par « devancer », sans expliciter l’idée d’un don ou d’un bienfait.
  rationale: Le rapprochement entre l’action préalable et le fait de rendre indique qu’il ne s’agit pas d’une simple antériorité temporelle, mais d’un acte censé placer Dieu en position de débiteur. La note maintient néanmoins l’ambiguïté lexicale du verbe.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique reste vive ; « sous tous les cieux » conserve la tonalité élevée et le pluriel de l’hébreu.
