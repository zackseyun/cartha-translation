  text: מַפְּלֵ֣י בְשָׂר֣/וֹ דָבֵ֑קוּ יָצ֥וּק עָ֝לָ֗י/ו בַּל יִמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/015.yaml
  text: The folds of his flesh cling together[a]; they are cast firm upon him and cannot be moved.
translation:
  language: fr
  text: Les replis de sa chair adhèrent les uns aux autres ; ils sont solidement fixés sur lui[a] et ne peuvent être ébranlés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coulés sur lui ». L’hébreu évoque quelque chose qui a été versé ou coulé et qui est ainsi devenu ferme.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפְּלֵי
  choice: replis
  rationale: Le terme désigne ici des parties pendantes ou plissées du corps. « Replis » conserve cette image concrète et convient naturellement à la chair.
- source_word: בְשָׂרוֹ
  choice: sa chair
  rationale: « Chair » rend directement בשר sans élargir le sens à « corps » ni l’interpréter comme « peau ».
- source_word: דָבֵקוּ
  choice: adhèrent les uns aux autres
  rationale: Le verbe דבק exprime une adhérence étroite. Cette formulation française rend clairement l’action réciproque des replis.
- source_word: יָצוּק
  choice: sont comme coulés
  rationale: Le mot évoque une matière versée ou coulée qui se solidifie. « Comme coulés » préserve cette image tout en indiquant son emploi métaphorique.
- source_word: עָלָיו
  choice: sur lui
  rationale: Rendu direct et idiomatique de la préposition avec suffixe pronominal.
- source_word: בַּל יִמּוֹט
  choice: ne peuvent bouger
  rationale: La négation poétique בַּל et le verbe מוט expriment ici l’impossibilité d’être déplacé ou ébranlé. La tournure choisie est naturelle en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. La formulation conserve l’image corporelle des replis et la métaphore de la matière coulée, sans préciser davantage la nature de la créature.
