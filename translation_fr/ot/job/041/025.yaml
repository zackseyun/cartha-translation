id: JOB.41.25
reference: Job 41:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵֽין עַל עָפָ֥ר מָשְׁל֑/וֹ הֶ֝/עָשׂ֗וּ לִ/בְלִי חָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/025.yaml
  text: On earth there is none like him[b][a], one made without fear.
translation:
  language: fr
  text: 'Sur terre, nul n’est son égal[a] : il a été fait sans peur[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nul ne lui ressemble »; le terme hébreu peut exprimer ici la ressemblance ou l’égalité.
    reason: lexical_alternative
  - marker: b
    text: Ou « il a été fait pour être sans effroi », c’est-à-dire comme un être qui ne se laisse pas terrifier.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: nul n’est
  rationale: La particule existentielle négative exprime ici une négation absolue; « nul n’est » est naturel et soutenu en français.
- source_word: עַל עָפָר
  choice: sur terre
  rationale: Littéralement « sur la poussière / le sol »; dans ce contexte, l’expression désigne le domaine terrestre et se rend naturellement par « sur terre ».
- source_word: מָשְׁלוֹ
  choice: son égal
  rationale: Le terme exprime ici la comparaison ou l’équivalence. « Son égal » convient à la construction existentielle, tout en laissant en note l’autre traduction possible, « semblable à lui ».
- source_word: הֶעָשׂוּ
  choice: il a été fait
  rationale: La forme issue de עשה a un sens passif et renvoie à la manière dont cette créature a été faite; cette traduction en conserve directement la valeur.
- source_word: לִבְלִי
  choice: sans
  rationale: La construction exprime l’absence; « sans » est son équivalent français le plus concis.
- source_word: חָת
  choice: peur
  rationale: Le nom désigne la crainte, l’effroi ou la terreur. « Peur » est clair et idiomatique, tandis que « effroi » est signalé en note.
theological_decisions:
- issue: Portée de « fait sans peur »
  choice: Conserver la formulation « il a été fait sans peur » sans préciser davantage sa portée.
  alternative: « fait pour ne rien craindre » ou « créé inaccessible à l’effroi »
  rationale: L’hébreu peut décrire l’absence de peur comme caractéristique résultant de sa fabrication, mais n’explicite ni finalité stricte ni doctrine particulière de la création; la traduction maintient cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le deux-points explicite le lien descriptif entre les deux propositions sans ajouter de causalité. « Nul » maintient la solennité poétique sans archaïsme marqué.
