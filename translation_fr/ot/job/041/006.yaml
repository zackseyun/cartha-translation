translation_notes:
  register: Français international moderne, soutenu mais accessible. La métaphore inhabituelle des « battants de sa face » est conservée dans le texte, avec son interprétation en note. « Règne » est un léger apport idiomatique destiné à rendre la force de la proposition nominale hébraïque.
