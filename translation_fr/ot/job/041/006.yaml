translation:
  language: fr
  text: Qui a ouvert les portes de sa face ? Autour de ses dents, c’est la terreur[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui peut ouvrir les portes de sa bouche ? » L’hébreu dit littéralement : « les portes de sa face », expression poétique qui désigne la bouche ou les mâchoires.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Autour de ses dents, c’est l’épouvante. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּלְתֵי
  choice: les battants
  rationale: Le pluriel construit désigne littéralement les battants d’une porte. « Battants » préserve l’image poétique tout en évoquant deux parties mobiles ; « mâchoires » expliciterait l’image.
- source_word: פָנָיו
  choice: sa face
  rationale: Le nom signifie normalement « face », « surface » ou « devant ». Le choix littéral conserve la métaphore hébraïque, tandis que le contexte renvoie à la bouche ou aux mâchoires.
- source_word: מִי
  choice: Qui
  rationale: Pronom interrogatif ordinaire introduisant ici une question rhétorique.
- source_word: פִתֵּחַ
  choice: a ouvert
  rationale: Le verbe signifie « ouvrir ». Le passé composé français rend naturellement l’accompli à portée rhétorique sans transformer explicitement l’énoncé en question de capacité.
- source_word: סְבִיבוֹת
  choice: autour de
  rationale: L’expression désigne ce qui entoure. « Autour de » restitue directement la relation spatiale.
- source_word: שִׁנָּיו
  choice: ses dents
  rationale: Le sens lexical de base est « dents » ; « crocs » renforcerait l’image au-delà du terme hébreu.
- source_word: אֵימָה
  choice: la terreur
  rationale: Le nom exprime la terreur ou l’épouvante. La tournure « règne la terreur » rend la proposition nominale de façon naturelle et vigoureuse en français.
