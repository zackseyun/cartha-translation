  text: כְּ֭/קַשׁ נֶחְשְׁב֣וּ תוֹתָ֑ח וְ֝/יִשְׂחַ֗ק לְ/רַ֣עַשׁ כִּידֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/021.yaml
  text: A club is regarded as straw[b][a], and he laughs at the rattling of the javelin.
translation:
  language: fr
  text: Une massue[a] est pour lui comme de la paille[b] ; il se rit du bruit du javelot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un projectile » ; le terme hébreu traduit par « massue » est rare, et son sens précis est incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme du chaume ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקַשׁ
  choice: comme de la paille
  rationale: קַשׁ désigne la paille ou le chaume. « De la paille » exprime naturellement en français l’idée de quelque chose de léger et d’inoffensif.
- source_word: נֶחְשְׁבוּ
  choice: est pour lui
  rationale: Le passif de חשׁב signifie « être tenu pour, être considéré comme ». La tournure idiomatique « est pour lui » conserve le point de vue de Léviathan sans alourdir le vers.
- source_word: תוֹתָח
  choice: une massue
  rationale: Ce terme rare désigne ici une arme, mais son sens précis reste incertain. « Massue » convient au parallélisme avec le javelot tout en laissant l’incertitude signalée en note.
- source_word: וְיִשְׂחַק
  choice: il se rit
  rationale: Le verbe signifie « rire » et, dans ce contexte, implique que Léviathan tourne la menace en dérision. Le pronom masculin reprend la personnification du contexte.
- source_word: לְרַעַשׁ
  choice: du fracas
  rationale: רַעַשׁ peut évoquer un bruit, un ébranlement ou un vacarme. « Fracas » restitue ici la menace sonore de l’arme sans préciser indûment son mouvement.
- source_word: כִּידוֹן
  choice: du javelot
  rationale: כִּידוֹן désigne une arme d’hast, souvent un javelot. Ce choix convient à l’image guerrière et la distingue d’autres termes hébreux rendus par « lance ».
