  yaml_path: translation/ot/job/041/010.yaml
  text: His sneezings flash forth light[b][a], and his eyes are like the eyelids of dawn.
translation:
  language: fr
  text: Ses éternuements font jaillir la lumière[a], et ses yeux sont comme les paupières de l’aurore[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ses éternuements font briller la lumière. » Le verbe hébreu est causatif, et l’expression est très poétique.'
    reason: lexical_alternative
  - marker: b
    text: Image poétique hébraïque évoquant la première lumière du jour qui s’ouvre.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטִישֹׁתָיו
  choice: ses éternuements
  rationale: Le nom dérivé de עטש désigne directement les éternuements. Ce choix concret préserve l’image poétique sans l’élargir en « renâclements » ou « souffles ».
- source_word: תָּהֶל אוֹר
  choice: font jaillir la lumière
  rationale: La forme causative du verbe exprime l’idée de faire briller ou paraître la lumière. « Font jaillir » restitue cette valeur causative et la vivacité de l’image.
- source_word: וְעֵינָיו
  choice: et ses yeux
  rationale: Traduction directe de la conjonction et du nom muni du suffixe masculin singulier.
- source_word: כְעַפְעַפֵּי שָׁחַר
  choice: comme les paupières de l’aurore
  rationale: La traduction conserve la métaphore hébraïque littérale des « paupières » pour évoquer la première lumière qui s’ouvre à l’aube.
