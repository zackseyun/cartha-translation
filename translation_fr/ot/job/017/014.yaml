  naturalness: « Je dis à la fosse » est plus idiomatique et rend sans ambiguïté l’adresse introduite par le lamed hébreu. La reprise de « au ver » rend également l’ellipse intelligible en français.
  terminology: « fosse » conserve de façon appropriée l’ambiguïté de שחת, sans imposer « tombe » ou une interprétation eschatologique. « ver » rend naturellement רמה dans cette image de décomposition. Les points d’exclamation ne sont pas requis par le texte hébreu et peuvent être retirés sans affaiblir la force poétique.
