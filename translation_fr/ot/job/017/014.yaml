  text: I call to the pit, ‘You are my father,’ and to the worm, ‘My mother and my sister.’
translation:
  language: fr
  text: 'Je dis à la fosse : « Tu es mon père », et au ver : « Ma mère et ma sœur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרָאתִי
  choice: J’appelle
  rationale: Le verbe קרא signifie ici « appeler » ou « s’adresser à ». Le présent français restitue naturellement la parole vive de Job sans réduire le sens à « dire ».
- source_word: שַׁחַת
  choice: la fosse
  rationale: שׁחת peut désigner une fosse, notamment comme image du séjour des morts ou de la tombe. « La fosse » conserve cette image concrète et son ambiguïté sans préciser indûment « tombe » ou « corruption ».
- source_word: רִמָּה
  choice: le ver
  rationale: רמה désigne le ver associé à la décomposition. Le singulier collectif et concret « le ver » correspond à la forme hébraïque et préserve la personnification.
- source_word: אָבִי אָתָּה
  choice: Tu es mon père !
  rationale: La formulation directe conserve l’ordre prédicatif et l’intensité de l’adresse à la fosse.
- source_word: אִמִּי וַאֲחֹתִי
  choice: Ma mère et ma sœur !
  rationale: La coordination familiale est reproduite sans ajouter un verbe absent de ce second membre, compris par ellipse.
theological_decisions:
- issue: Rapport de Job à la mort et à la décomposition
  choice: Conserver les métaphores familiales adressées à la fosse et au ver
  alternative: Expliciter que Job considère la tombe comme sa demeure ou qu’il s’attend à mourir
  rationale: L’hébreu exprime cette proximité par une personnification frappante, sans en donner une interprétation doctrinale explicite. La traduction maintient donc la tension poétique.
translation_notes:
  register: Français moderne, sobre et poétique. Les deux-points rendent explicite l’adresse directe déjà portée par l’hébreu. Les points d’exclamation soulignent l’apostrophe sans ajouter de contenu interprétatif.
