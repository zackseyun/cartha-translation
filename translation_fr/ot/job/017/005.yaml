    rationale: « Les yeux de ses enfants s’épuiseront » applique maladroitement à « yeux » un verbe qui décrit normalement des personnes ou des ressources. « Se consumeront » est une formulation française idiomatique dans un registre biblique sobre et correspond à l'éventail sémantique de כלה.
  - severity: low
    issue: Construction initiale elliptique
    rationale: Le relatif substantivé « Qui dénonce » est recevable, mais « Celui qui dénonce » améliore la complétude et la lisibilité sans modifier la portée proverbiale.
  - severity: low
    issue: Note légèrement trop affirmative sur l'avantage personnel
    rationale: Le contexte peut suggérer le profit, mais le syntagme לְחֵלֶק est disputé. La note doit présenter cette idée comme une possibilité plutôt que comme le sens apparent assuré.
