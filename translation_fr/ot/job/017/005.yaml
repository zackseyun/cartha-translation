  text: לְ֭/חֵלֶק יַגִּ֣יד רֵעִ֑ים וְ/עֵינֵ֖י בָנָ֣י/ו תִּכְלֶֽנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/005.yaml
  text: He denounces friends for a share[a], and the eyes of his children will fail.
translation:
  language: fr
  text: Celui qui dénonce ses amis pour une part[a], les yeux de ses enfants se consumeront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour une portion », « par intérêt »; selon une autre interprétation, « par flatterie ». L’expression hébraïque est difficile. Elle peut évoquer le fait de dénoncer ses amis en vue d’un avantage personnel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחֵלֶק
  choice: pour une part
  rationale: חֵלֶק désigne fondamentalement une « part » ou une « portion ». La formulation française reste proche de l’hébreu difficile sans préciser de manière incertaine qu’il s’agit d’un butin; les lectures liées au profit ou à la flatterie sont signalées en note.
- source_word: יַגִּיד
  choice: dénonce
  rationale: Le hiphil de נגד signifie « déclarer, faire connaître ». Avec « amis » comme complément et dans ce contexte défavorable, « dénonce » exprime naturellement l’idée de livrer ou d’accuser quelqu’un, sans imposer un cadre judiciaire précis.
- source_word: רֵעִים
  choice: ses amis
  rationale: רֵעִים signifie couramment « amis » ou « compagnons ». Le possessif, implicite dans la relation exprimée, donne en français une tournure naturelle et fait ressortir la trahison.
- source_word: וְעֵינֵי בָנָיו
  choice: les yeux de ses enfants
  rationale: בנים peut désigner les fils ou, plus largement, les enfants. « Enfants » convient ici sans restreindre inutilement la portée du terme.
- source_word: תִּכְלֶנָה
  choice: s’épuiseront
  rationale: כלה peut exprimer l’épuisement, le dépérissement ou le fait d’arriver à son terme. Appliqué aux yeux, « s’épuiseront » conserve l’image ouverte, qui peut évoquer le dépérissement, l’attente vaine ou la défaillance de la vue.
theological_decisions:
- issue: Lien entre l’acte commis et le sort des enfants
  choice: Maintenir la succession des deux propositions sans expliciter davantage la causalité
  alternative: Introduire « alors », « c’est pourquoi » ou présenter la seconde proposition comme une malédiction
  rationale: L’hébreu les relie par וְ, dont la valeur exacte demeure ici ouverte. La traduction préserve donc la tension entre conséquence, jugement annoncé et formulation proverbiale.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe proverbiale et l’obscurité réelle du premier membre sont conservées; la note présente les principales possibilités sans trancher au-delà des données hébraïques.
