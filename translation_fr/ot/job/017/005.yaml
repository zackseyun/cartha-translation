- from: Qui dénonce ses amis pour une part[a], les yeux de ses enfants s’épuiseront.
  to: Celui qui dénonce ses amis pour une part[a], les yeux de ses enfants se consumeront.
  rationale: La révision rend la phrase pleinement naturelle et remplace « s’épuiseront », peu approprié pour des yeux, par « se consumeront », qui préserve l'image de dépérissement sans trancher son mécanisme. La note maintient les alternatives importantes tout en signalant explicitement l'incertitude du premier membre.
