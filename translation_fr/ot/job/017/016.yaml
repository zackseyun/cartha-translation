  yaml_path: translation/ot/job/017/016.yaml
  text: Will they go down to the bars of Sheol? Shall we descend together into the dust?[a][b]
translation:
  language: fr
  text: Descendront-elles jusqu’aux verrous du séjour des morts[a] ? Reposerons-nous ensemble dans la poussière[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’aux parties du séjour des morts » ou « jusqu’aux barres du séjour des morts ». L’image hébraïque évoque probablement les portes verrouillées du domaine des morts.
    reason: lexical_alternative
  - marker: b
    text: 'Le terme hébreu נָחַת, avant « poussière », est difficile. Il peut évoquer le repos; ou, selon une autre interprétation : « Descendrons-nous ensemble dans la poussière ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּדֵּי
  choice: verrous
  rationale: Dans ce contexte, le terme évoque probablement les barres ou verrous qui ferment le séjour des morts. « Verrous » restitue en français une image naturelle d’enfermement, tout en signalant les autres possibilités en note.
- source_word: שְׁאֹל
  choice: séjour des morts
  rationale: Cette expression française conserve l’idée du shéol comme domaine des défunts sans la réduire à une tombe individuelle; elle reste plus immédiatement compréhensible que la simple translittération « Shéol ».
- source_word: תֵּרַדְנָה
  choice: Descendront-elles
  rationale: Le féminin pluriel renvoie vraisemblablement aux espérances évoquées dans le contexte. La forme interrogative rend le mouvement rhétorique du passage.
- source_word: אִם
  choice: marque d’une seconde question (« Descendrons-nous… ? »)
  rationale: Bien que le mot signifie couramment « si », il peut ici introduire une question parallèle. Une formulation interrogative directe est naturelle en français et préserve l’incertitude du vers.
- source_word: יַחַד
  choice: ensemble
  rationale: Ce choix rend directement l’idée d’une destination ou d’un sort partagé.
- source_word: עַל עָפָר
  choice: dans la poussière
  rationale: Littéralement « sur la poussière », mais le contexte de descente vers la mort appelle naturellement « dans la poussière » en français.
- source_word: נָחַת
  choice: descendrons
  rationale: Le mot difficile est compris comme exprimant la descente, en parallèle avec תֵּרַדְנָה. La lecture « reposer » demeure plausible et figure donc en note.
theological_decisions:
- issue: Représentation de שְׁאוֹל
  choice: séjour des morts
  alternative: Shéol; tombe
  rationale: « Séjour des morts » préserve la portée du terme hébreu sans imposer une conception confessionnelle précise de l’au-delà ni le réduire à la tombe matérielle.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « descendront/descendrons » conserve le parallélisme hébreu; les deux questions maintiennent l’ambiguïté rhétorique du texte.
