  text: Surely mockers are with me[b][a], and my eye lodges on their provocation.
translation:
  language: fr
  text: Assurément, des moqueurs sont avec moi[a], et mon œil reste fixé sur leurs provocations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des trompeurs sont avec moi » ; le terme hébreu peut désigner des personnes qui trompent ou qui tournent en dérision.
    reason: lexical_alternative
  - marker: b
    text: Litt. « mon œil passe la nuit sur leurs provocations ». Ou « mon œil demeure sur leur rébellion » ou « sur leur amertume » ; l’expression hébraïque est difficile et peut évoquer une conduite provocatrice, rebelle ou amère.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Assurément
  rationale: L’expression fonctionne ici comme une affirmation emphatique plutôt que comme une condition; « Assurément » en rend naturellement la force.
- source_word: הֲתֻלִים
  choice: des moqueurs
  rationale: Le nom peut désigner des personnes qui trompent ou qui tournent en dérision; dans le contexte des paroles hostiles adressées à Job, « moqueurs » convient bien, sans exclure l’autre nuance signalée en note.
- source_word: עִמָּדִי
  choice: sont avec moi
  rationale: Cette formulation rend simplement la présence de ces personnes auprès de Job.
- source_word: וּבְהַמְּרוֹתָם
  choice: sur leurs provocations
  rationale: Le terme difficile peut évoquer des provocations, une rébellion ou de l’amertume. « Provocations » correspond au contexte conflictuel sans imposer un sens spécifiquement théologique.
- source_word: תָּלַן
  choice: passe la nuit
  rationale: Le verbe signifie littéralement « loger, passer la nuit ». Garder cette image inhabituelle respecte la vigueur et l’ambiguïté de l’hébreu.
- source_word: עֵינִי
  choice: mon œil
  rationale: Le singulier de l’hébreu est conservé et demeure intelligible en français dans cette image poétique.
