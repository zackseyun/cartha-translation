  text: My days have passed by; my plans are broken off[a], the desires of my heart.
translation:
  language: fr
  text: Mes jours ont passé ; mes projets ont été brisés[a], les désirs de mon cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ont été arrachés » ou « ont été interrompus ». La fin du verset peut aussi se traduire : « les possessions de mon cœur », « les choses chères à mon cœur » ou « l’héritage de mon cœur ». L’expression hébraïque est rare et difficile.'
    reason: Ambiguïtés lexicales de נתק et surtout de מוֹרָשֵׁי.
lexical_decisions:
- source_word: יָמַי
  choice: mes jours
  rationale: Rend directement le nom avec suffixe de première personne et conserve l’image hébraïque de la durée de la vie.
- source_word: עָבְרוּ
  choice: ont passé
  rationale: Le parfait qal exprime ici l’écoulement désormais accompli des jours ; cette tournure est naturelle en français.
- source_word: זִמֹּתַי
  choice: mes projets
  rationale: Dans ce contexte, le terme désigne les desseins ou intentions de Job, sans la nuance péjorative que pourrait suggérer « manigances ».
- source_word: נִתְּקוּ
  choice: ont été brisés
  rationale: Le nifal de נתק évoque ce qui est arraché, rompu ou interrompu ; « ont été brisés » convient à des projets tout en gardant la force de l’image.
- source_word: מוֹרָשֵׁי
  choice: les trésors de
  rationale: Le mot rare est lié à l’idée de possession ou d’héritage. « Les trésors de mon cœur » exprime ce que le cœur possède et chérit, tout en évitant de réduire silencieusement le sens aux seuls désirs.
- source_word: לְבָבִי
  choice: mon cœur
  rationale: Rendu français usuel qui préserve le cœur comme siège intérieur de la pensée, de la volonté et des aspirations.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. La juxtaposition finale est conservée afin de respecter la structure dense et ambiguë de l’hébreu.
