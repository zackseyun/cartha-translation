  text: וְ֭/אַיֵּה אֵפ֣וֹ תִקְוָתִ֑/י וְ֝/תִקְוָתִ֗/י מִ֣י יְשׁוּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/015.yaml
  text: And where[a], then, is my hope? And my hope—who can see it?
translation:
  language: fr
  text: Et où donc est mon espérance ? Et mon espérance, qui peut la voir[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui la verra ? » ou « qui la contemplera ? ». Le verbe hébreu peut signifier « voir » ou « contempler », et la forme verbale peut être comprise au futur ou avec une valeur modale (« peut »).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיֵּה
  choice: Et où
  rationale: אַיֵּה est un interrogatif de lieu, « où ? » ; le וְ initial relie naturellement la question à la suite de la lamentation.
- source_word: אֵפוֹ
  choice: donc
  rationale: La particule ajoute ici une nuance d’insistance ou de conséquence ; « donc » la restitue naturellement en français moderne.
- source_word: תִקְוָתִי
  choice: mon espérance
  rationale: תִּקְוָה désigne l’espoir ou l’attente. « Espérance » convient au registre poétique et grave du passage sans préciser indûment l’objet de cette attente.
- source_word: וְתִקְוָתִי
  choice: Mon espérance
  rationale: La répétition du nom est conservée pour respecter l’insistance et la force poétique de l’hébreu ; le וְ est rendu implicitement par l’enchaînement des deux questions, plus naturel en français.
- source_word: מִי
  choice: qui
  rationale: Pronom interrogatif personnel standard introduisant la seconde question.
- source_word: יְשׁוּרֶנָּה
  choice: peut la voir
  rationale: Le verbe שׁור signifie « voir, regarder, contempler ». L’imparfait peut recevoir ici une valeur modale (« peut ») ; le suffixe féminin renvoie à תִּקְוָה, repris par « la ».
theological_decisions:
- issue: Valeur de l’imparfait יְשׁוּרֶנָּה
  choice: 'Lecture modale : « qui peut la voir ? »'
  alternative: 'Lecture au futur : « qui la verra ? »'
  rationale: Le contexte permet les deux lectures. La valeur modale exprime naturellement l’impossibilité de discerner l’espérance de Job, sans exclure la lecture future, signalée en note.
translation_notes:
  register: Français moderne, digne et poétique. La répétition de « mon espérance » est maintenue, ainsi que les deux questions successives. « Espérance » privilégie un registre soutenu mais courant dans un texte biblique ; aucune précision théologique étrangère au verset n’est ajoutée.
