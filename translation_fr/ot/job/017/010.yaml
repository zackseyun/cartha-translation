  naturalness: « Mais vous tous, revenez et venez donc » demeure volontairement énergique et quelque peu répétitif, comme l’hébreu. La formulation est intelligible en français moderne sans introduire le sens plus spécifique de « se présenter ». « Je ne trouverai parmi vous aucun sage » est naturel et rend exactement la négation.
  terminology: « Sage » convient à חָכָם dans ce contexte et conserve le masculin singulier substantivé qui vise les compagnons de Job. Aucun terme théologique spécialisé n’est en cause.
