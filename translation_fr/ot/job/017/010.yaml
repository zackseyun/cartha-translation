  text: וְֽ/אוּלָ֗ם כֻּלָּ֣/ם תָּ֭שֻׁבוּ וּ/בֹ֣אוּ נָ֑א וְ/לֹֽא אֶמְצָ֖א בָ/כֶ֣ם חָכָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/010.yaml
  text: But all of you[a], come back now, and come; I will not find a wise man among you.
translation:
  language: fr
  text: Mais vous tous, revenez et venez donc ; je ne trouverai parmi vous aucun sage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mais
  rationale: Marque une forte opposition avec ce qui précède ; « Mais » est naturel et direct en français moderne.
- source_word: כֻּלָּם
  choice: vous tous
  rationale: Les verbes à la deuxième personne du pluriel montrent que Job s’adresse directement à l’ensemble de ses interlocuteurs.
- source_word: תָּשֻׁבוּ
  choice: revenez
  rationale: Le verbe שוב exprime ici, dans une formule de sommation, l’idée de revenir ou de reprendre la confrontation.
- source_word: וּבֹאוּ נָא
  choice: et présentez-vous
  rationale: בוא suivi de נָא forme ici une invitation pressante, voire un défi. « Présentez-vous » rend la sommation sans donner à נָא une politesse excessive.
- source_word: וְלֹא אֶמְצָא
  choice: je ne trouverai pas
  rationale: 'L’inaccompli a naturellement une valeur future ou résultative après la sommation : même s’ils reviennent, Job ne trouvera pas de sage parmi eux.'
- source_word: בָכֶם
  choice: parmi vous
  rationale: La préposition situe le sage recherché au sein du groupe interpellé ; « parmi vous » est idiomatique en français.
- source_word: חָכָם
  choice: un seul sage
  rationale: L’adjectif masculin singulier est substantivé. « Un seul sage » fait ressortir la négation portant sur tout membre éventuel du groupe sans supprimer le genre grammatical du texte.
theological_decisions:
- issue: Rendu genré de חָכָם
  choice: un seul sage
  alternative: une seule personne sage
  rationale: L’hébreu emploie un masculin singulier substantivé et vise immédiatement les compagnons masculins de Job. Le rendu conserve cette forme sans généralisation inclusive.
translation_notes:
  register: Français international moderne, digne et direct. La répétition verbale hébraïque est rendue par deux impératifs distincts afin de conserver la vigueur de la sommation sans produire une tournure artificielle.
