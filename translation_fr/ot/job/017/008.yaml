id: JOB.17.8
reference: Job 17:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָשֹׁ֣מּוּ יְשָׁרִ֣ים עַל זֹ֑את וְ֝/נָקִ֗י עַל חָנֵ֥ף יִתְעֹרָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/008.yaml
  text: The upright are appalled at this[a], and the innocent stirs himself up against the godless.
translation:
  language: fr
  text: Les hommes droits sont consternés devant cela, et l’innocent se soulève contre l’impie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’hypocrite ». Le mot hébreu חָנֵף peut désigner une personne impie ou irrévérencieuse; dans certaines traductions traditionnelles, il est rendu par « hypocrite ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: sont consternés
  rationale: Le qal de שׁמם exprime ici une réaction de stupeur horrifiée. « Sont consternés » rend cette force émotionnelle en français naturel.
- source_word: יְשָׁרִים
  choice: les hommes droits
  rationale: L’adjectif pluriel est employé substantivement et désigne les personnes moralement droites. L’ajout de « hommes » est générique et rend l’expression naturelle en français.
- source_word: עַל זֹאת
  choice: devant cela
  rationale: La préposition עַל introduit ici ce qui provoque la réaction. « Devant cela » convient idiomatiquement à la consternation sans préciser davantage la référence ambiguë de « cela ».
- source_word: נָקִי
  choice: l’innocent
  rationale: Le terme désigne celui qui est exempt de faute ou de culpabilité; « l’innocent » exprime clairement cette catégorie morale.
- source_word: חָנֵף
  choice: l’impie
  rationale: חָנֵף désigne largement une personne irrévérencieuse ou impie. « L’impie » préserve le contraste éthique et religieux avec les hommes droits et l’innocent, sans réduire le sens à l’hypocrisie.
- source_word: יִתְעֹרָר
  choice: se soulève
  rationale: 'La forme hitpolal a une valeur réflexive: l’innocent se met lui-même en mouvement pour agir. « Se soulève » conserve cette dynamique et s’emploie naturellement avec « contre ».'
- source_word: עַל חָנֵף
  choice: contre l’impie
  rationale: Avec le verbe d’éveil ou de mobilisation, עַל marque ici l’opposition; « contre » rend directement cette valeur adversative.
theological_decisions:
- issue: Sens de חָנֵף
  choice: l’impie
  alternative: l’hypocrite
  rationale: Le contexte oppose les personnes droites et innocentes à une personne irrévérencieuse envers Dieu. « L’impie » conserve cette opposition morale et religieuse, tandis que « l’hypocrite » restreindrait le terme à la duplicité.
- issue: Valeur de יִתְעֹרָר
  choice: se soulève
  alternative: est indigné
  rationale: La traduction retenue préserve la valeur réflexive et dynamique de la forme verbale sans ramener le mouvement décrit à un simple état émotionnel.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre « les hommes droits » et « l’innocent » est conservé, de même que l’indétermination du démonstratif « cela ». Le singulier collectif de la seconde proposition est maintenu.
