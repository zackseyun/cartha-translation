  text: אִם אֲ֭קַוֶּה שְׁא֣וֹל בֵּיתִ֑/י בַּ֝/חֹ֗שֶׁךְ רִפַּ֥דְתִּי יְצוּעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/013.yaml
  text: If I hope for Sheol as my house[a], if I spread my bed in the darkness,
translation:
  language: fr
  text: Si j’espère avoir le shéol pour demeure[a], j’étends mon lit dans les ténèbres,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tombe » ou « le séjour des morts ». Le mot hébreu « shéol » désigne le domaine des morts et a un sens plus large qu’un simple lieu d’ensevelissement.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Conserve la valeur conditionnelle ou hypothétique de la particule hébraïque sans la transformer en indication temporelle.
- source_word: אֲקַוֶּה
  choice: j’espère avoir
  rationale: Le piel de קוה exprime ici une attente chargée d’espoir. Avec « pour demeure », cette formulation rend naturellement en français l’attente du shéol comme futur lieu d’habitation.
- source_word: שְׁאוֹל
  choice: le shéol
  rationale: La translittération préserve l’étendue du concept hébraïque, qui désigne le séjour des morts et ne se réduit pas à une tombe matérielle.
- source_word: בֵּיתִי
  choice: pour demeure
  rationale: La relation nominale entre « shéol » et « ma maison » est rendue idiomatiquement. « Demeure » conserve l’image d’un lieu où habiter tout en convenant au registre poétique.
- source_word: בַּחֹשֶׁךְ
  choice: dans les ténèbres
  rationale: Rend la préposition et l’article hébreux, tout en préservant l’image du monde obscur associé à la mort.
- source_word: רִפַּדְתִּי
  choice: j’étends
  rationale: Le verbe évoque l’action d’étaler ou de disposer une couche. « J’étends mon lit » garde cette image concrète et reste naturel en français.
- source_word: יְצוּעָי
  choice: mon lit
  rationale: Désigne le lieu où l’on s’allonge. « Lit » est clair, courant et maintient l’image de la mort comme repos.
theological_decisions:
- issue: Faut-il traduire שְׁאוֹל de manière interprétative ?
  choice: le shéol
  alternative: la tombe ; le séjour des morts
  rationale: « Shéol » conserve la portée propre au terme hébreu sans la réduire à l’ensevelissement ni lui imposer une conception doctrinale ultérieure. La note donne les équivalents explicatifs utiles.
translation_notes:
  register: Français moderne, sobre et poétique. La répétition de « si » respecte le parallélisme hébreu et laisse ouverte la construction conditionnelle qui se poursuit dans le contexte.
