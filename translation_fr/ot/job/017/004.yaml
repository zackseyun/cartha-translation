source:
  edition: WLC
  text: כִּֽי לִ֭בָּ/ם צָפַ֣נְתָּ מִּ/שָּׂ֑כֶל עַל כֵּ֝֗ן לֹ֣א תְרֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/004.yaml
  text: For you have hidden their heart from understanding[b][a]; therefore you will not exalt them.
translation:
  language: fr
  text: Car tu as tenu leur cœur à l’écart du discernement[a] ; c’est pourquoi tu ne les élèveras pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « leur cœur » : en hébreu, le cœur désigne souvent le siège de la pensée et du discernement, et pas seulement celui des émotions. Le verbe peut aussi être rendu par « cacher » ou « tenir caché ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « tu ne les relèveras pas » ; selon le contexte, « tu ne les laisseras pas triompher ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui explique la conséquence exprimée dans la seconde proposition et convient au mouvement argumentatif du poème.
- source_word: לִבָּם
  choice: leur cœur
  rationale: Conserve l’image hébraïque du cœur comme siège de la pensée, de la volonté et du discernement.
- source_word: צָפַנְתָּ
  choice: tu as fermé
  rationale: Dans la construction avec מִן, le verbe exprime ici l’idée de soustraire ou de rendre inaccessible ; « fermé leur cœur à » est naturel en français tout en maintenant l’action divine explicite.
- source_word: מִשָּׂכֶל
  choice: à l’intelligence
  rationale: 'Le מִן marque la séparation : leur cœur est tenu à l’écart du discernement. « Intelligence » désigne ici la capacité de comprendre et de juger avec discernement.'
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: Rend clairement le lien de conséquence entre les deux propositions.
- source_word: לֹא תְרֹמֵם
  choice: tu ne les élèveras pas
  rationale: Préserve l’image fondamentale du verbe רום, « élever », sans préciser indûment s’il s’agit d’honneur, de rang ou de victoire.
theological_decisions:
- issue: Référent des suffixes et pronoms pluriels (« leur », « les »)
  choice: Conserver les pronoms sans identifier davantage le groupe visé.
  alternative: Expliciter qu’il s’agit des adversaires de Job ou de leurs alliés.
  rationale: Les verbes à la deuxième personne montrent que Job s’adresse à Dieu, tandis que les formes à la troisième personne plurielle renvoient à un autre groupe. Le verset seul ne le nomme pas, et l’expliciter résoudrait une ambiguïté que l’hébreu conserve.
- issue: Portée de « tu ne les élèveras pas »
  choice: Conserver l’image ouverte de l’élévation.
  alternative: Traduire « tu ne les laisseras pas triompher » ou « tu ne les honoreras pas ».
  rationale: Le contexte peut suggérer le triomphe ou l’honneur, mais רום signifie d’abord élever. La formulation retenue préserve la tension et évite de limiter la portée théologique du propos.
translation_notes:
  register: Français moderne, digne et poétique. La structure causale du verset est maintenue, de même que l’adresse directe à Dieu et l’ambiguïté concernant l’identité de « leur/eux ». Les marqueurs de notes suivent leur ordre d’apparition dans le texte.
