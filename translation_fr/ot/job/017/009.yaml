  variant: modern international French
source:
  edition: WLC
  text: וְ/יֹאחֵ֣ז צַדִּ֣יק דַּרְכּ֑/וֹ וּֽ/טֳהָר יָ֝דַ֗יִם יֹסִ֥יף אֹֽמֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/009.yaml
  text: Yet the righteous holds fast to his way[a], and the one with clean hands grows stronger.
translation:
  language: fr
  text: Pourtant, le juste tient bon dans sa voie, et celui qui a les mains pures devient plus fort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ajoute de la force » ; on peut aussi comprendre : « gagne en force » ou, dans un sens plus précis, « prend courage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאחֵז
  choice: Pourtant … tient ferme
  rationale: La conjonction peut se rendre par « et », mais le contexte lui donne une légère valeur adversative. אחז exprime ici l’idée de saisir et de ne pas lâcher, donc de persévérer.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé désigne ici, au singulier représentatif, la personne juste sans qu’il soit nécessaire d’ajouter « homme ».
- source_word: דַּרְכּוֹ
  choice: dans sa voie
  rationale: דֶּרֶךְ peut désigner un chemin ou une manière de vivre. « Sa voie » conserve à la fois l’image concrète et la portée figurée.
- source_word: וּטֳהָר יָדַיִם
  choice: celui qui a les mains pures
  rationale: Cette formulation naturelle conserve l’image hébraïque des mains pures, qui évoque l’innocence et l’intégrité morale.
- source_word: יֹסִיף אֹמֶץ
  choice: devient plus fort
  rationale: L’expression signifie littéralement « ajoute de la force ». La formulation retenue exprime naturellement en français l’accroissement de force ou de fermeté, sans le limiter au seul courage.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme du verset et l’image concrète des « mains pures » sont préservés ; « pourtant » fait ressortir avec mesure le contraste contextuel.
