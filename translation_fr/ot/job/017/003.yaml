  text: שִֽׂימָ/ה נָּ֭א עָרְבֵ֣/נִי עִמָּ֑/ךְ מִֽי ה֝֗וּא לְ/יָדִ֥/י יִתָּקֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/003.yaml
  text: Lay down[a], please, a pledge for me with yourself[b]; who else is there who would strike hands with me?
translation:
  language: fr
  text: Porte-toi, je t'en prie, garant pour moi auprès de toi-même[a] ! Qui donc me donnerait la main pour s'engager envers moi[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Donne une garantie pour moi auprès de toi-même. » L’hébreu emploie le vocabulaire juridique du cautionnement ou de la garantie.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Qui est celui qui frapperait dans ma main ? » Ce geste de la main pouvait confirmer un engagement, notamment un cautionnement.'
    reason: cultural_note
lexical_decisions:
- source_word: שִׂימָה נָּא
  choice: Dépose donc
  rationale: L’impératif de שׂים appelle à placer ou constituer quelque chose; dans ce contexte juridique, « dépose » convient à une garantie. La particule נָא donne à la demande une nuance instante et polie, rendue naturellement par « donc » dans cette supplication.
- source_word: עָרְבֵנִי
  choice: une garantie pour moi
  rationale: La forme issue de ערב relève du cautionnement et demande qu’une sûreté soit fournie en faveur de Job. « Une garantie pour moi » reste clair tout en conservant le cadre juridique.
- source_word: עִמָּךְ
  choice: auprès de toi-même
  rationale: La garantie doit être placée « avec » Dieu. « Auprès de toi-même » met en relief la tension singulière du propos, où Dieu est sollicité comme garant alors que la sûreté demeure auprès de lui, sans expliquer davantage le mécanisme.
- source_word: מִי הוּא
  choice: Qui donc
  rationale: La formule introduit une question rhétorique. « Qui donc » en restitue la force sans ajouter explicitement « d’autre », qui n’est pas exprimé dans l’hébreu.
- source_word: לְיָדִי יִתָּקֵעַ
  choice: s’engagerait envers moi en me serrant la main
  rationale: תקע avec « ma main » évoque le geste par lequel on conclut un engagement de caution. La formulation française conserve à la fois le sens juridique et l’image concrète de la main.
theological_decisions:
- issue: Métaphore juridique adressée à Dieu
  choice: Job demande à Dieu de constituer pour lui une garantie auprès de Dieu lui-même.
  alternative: Job demanderait seulement qu’un garant indéterminé soit désigné en sa faveur.
  rationale: עִמָּךְ rattache explicitement la garantie à Dieu, tandis que la question suivante souligne l’absence de quelqu’un qui accepterait de s’engager envers Job. La traduction conserve cette tension sans définir doctrinalement comment Dieu pourrait tenir ces deux rôles.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire juridique demeure compréhensible; l’image ancienne du geste de la main est conservée dans le texte et explicitée en note.
