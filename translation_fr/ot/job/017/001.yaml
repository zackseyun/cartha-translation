  text: רוּחִ֣/י חֻ֭בָּלָה יָמַ֥/י נִזְעָ֗כוּ קְבָרִ֥ים לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/001.yaml
  text: My spirit is broken[a]; my days are extinguished[b]; graves await me.
translation:
  language: fr
  text: Mon esprit est brisé[a] ; mes jours s’éteignent[b] ; des tombes m’attendent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mon souffle est brisé ». Le mot hébreu רוּחַ peut signifier « esprit » ou « souffle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « mes jours sont éteints ». Le verbe évoque vraisemblablement quelque chose que l’on éteint, comme une flamme.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: mon souffle
  rationale: רוּחַ peut désigner le souffle ou l’esprit. Dans ce contexte de vie défaillante et de mort imminente, « souffle » rend naturellement la dimension vitale, tout en conservant « esprit » comme autre lecture possible.
- source_word: חֻבָּלָה
  choice: est brisé
  rationale: La forme passive exprime un état de ruine ou de destruction. « Est brisé » convient au ton de la lamentation sans préciser indûment la manière dont ce souffle a été atteint.
- source_word: יָמַי
  choice: mes jours
  rationale: Traduction directe du pluriel possessif, qui désigne les jours restant à vivre à Job.
- source_word: נִזְעָכוּ
  choice: s’éteignent
  rationale: Le verbe évoque ce qui est éteint ou étouffé, probablement comme une flamme. Le présent français exprime ici le processus et l’imminence de la fin.
- source_word: קְבָרִים
  choice: des tombes
  rationale: Le pluriel hébreu est conservé plutôt que ramené au singulier collectif « la tombe ».
- source_word: לִי
  choice: m’attendent
  rationale: Littéralement « pour moi » ou « à moi ». Dans le contexte, « m’attendent » exprime idiomatiquement que les tombes sont désormais ce qui se trouve devant Job.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le rythme ternaire de l’hébreu est préservé. « Souffle » privilégie ici l’image de la vie qui défaillit, tandis que la note maintient l’ambiguïté avec « esprit ».
