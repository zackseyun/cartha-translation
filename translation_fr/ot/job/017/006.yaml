  - severity: low
    issue: La note b présente « je serai » comme littéral sans signaler que le contexte poétique peut viser l'état présent.
    rationale: La forme אֶהְיֶה est formellement un inaccompli, mais son interprétation temporelle demeure contextuelle; la note doit préserver cette nuance.
