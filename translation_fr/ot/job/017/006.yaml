  yaml_path: translation/ot/job/017/006.yaml
  text: He has made me a byword among the peoples[b][a], and I have become one before whom people spit.
translation:
  language: fr
  text: Il a fait de moi la risée des peuples[a], et je suis devenu un objet de crachats aux yeux de tous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un proverbe parmi les peuples ». Le terme hébreu désigne probablement quelqu’un qui est devenu un objet proverbial de mépris.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et je serai un crachat devant les visages ». La forme peut aussi exprimer ici un état présent ; l’expression désigne un objet de mépris public.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצִּגַנִי
  choice: Il a fait de moi
  rationale: 'Le hifil avec suffixe de première personne exprime une action causative : Job a été placé dans une condition publique d’opprobre. Cette tournure est naturelle en français et s’accorde avec l’attribut qui suit.'
- source_word: לִמְשֹׁל
  choice: la risée
  rationale: La forme inhabituelle renvoie vraisemblablement à une parole proverbiale ou à un objet proverbial de mépris. « La risée » rend clairement l’opprobre public dans un français actuel, tandis que la note conserve l’autre possibilité lexicale.
- source_word: עַמִּים
  choice: des peuples
  rationale: Le pluriel est maintenu afin de refléter עַמִּים, sans le réduire au collectif singulier « les gens ».
- source_word: וְתֹפֶת
  choice: quelqu’un à qui l’on crache
  rationale: Le substantif paraît désigner le fait de cracher ou l’objet sur lequel on crache. La formulation explicite l’image sans l’aplatir en un terme abstrait comme « honte ».
- source_word: לְפָנִים
  choice: au visage
  rationale: Littéralement « devant les faces »; dans ce contexte, l’expression évoque un mépris ouvert et directement infligé. « Au visage » restitue naturellement cette humiliation en français.
- source_word: אֶהְיֶה
  choice: je suis devenu
  rationale: Bien que la forme soit un inaccompli, le parallélisme poétique permet de comprendre un état présent résultant de l’action précédente. « Je suis devenu » exprime ce résultat sans exclure la nuance durative.
