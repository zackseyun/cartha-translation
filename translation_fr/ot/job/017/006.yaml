  source_fidelity: La première proposition rend bien le hifil (« il a fait de moi ») et le sens vraisemblablement proverbial et déshonorant de לִמְשֹׁל. La seconde conserve à juste titre l'image du crachat et l'état résultant que peut exprimer l'inaccompli poétique. Toutefois, « au visage » affirme un crachat dirigé sur le visage de Job, alors que לְפָנִים signifie plus prudemment « devant les visages », soit publiquement, sous les yeux des gens.
  naturalness: « La risée des peuples » est naturel et soutenu sans être archaïque. « Un objet de crachats aux yeux de tous » est idiomatique en français international moderne et exprime le mépris public sans introduire le détail plus fort de cracher au visage.
  terminology: « Risée » rend adéquatement l'opprobre public associé à un proverbe ou à une expression proverbiale. « Objet de crachats » conserve l'imagerie concrète de תֹפֶת tout en évitant de réduire le terme à une honte abstraite. Les notes maintiennent l'alternative « proverbe » et signalent la littéralité ainsi que l'ambiguïté temporelle de l'inaccompli.
