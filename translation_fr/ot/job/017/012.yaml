  text: They make night into day; they say, ‘Light is near,’ in the face of darkness.
translation:
  language: fr
  text: 'Ils font de la nuit le jour ; ils disent : « La lumière est proche face aux ténèbres. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַיְלָה לְיוֹם יָשִׂימוּ
  choice: Ils font de la nuit le jour
  rationale: Rend directement l’opposition nuit/jour et le verbe שׂים, « mettre, faire de », dans un français naturel.
- source_word: אוֹר קָרוֹב
  choice: « La lumière est proche »
  rationale: Conserve la formulation brève et l’ambiguïté poétique de l’hébreu, sans préciser indûment ce que représente la lumière.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: face aux ténèbres
  rationale: 'Préserve l’image spatiale et la tension du texte hébreu : la lumière est dite proche alors même que les ténèbres sont présentes.'
theological_decisions:
- issue: Sujet et statut de « La lumière est proche »
  choice: Maintenir « ils » comme sujet du premier membre et présenter le second comme leurs paroles par des guillemets, sans ajouter un verbe introducteur.
  alternative: 'Ils font de la nuit le jour ; ils disent : « La lumière est proche », face aux ténèbres.'
  rationale: Le texte hébreu ne contient pas explicitement « ils disent ». Les guillemets rendent plausible la valeur déclarative du second membre tout en évitant d’insérer ce verbe dans le texte.
translation_notes:
  register: Français moderne, sobre et poétique. Le point-virgule maintient le parallélisme serré du verset ; « ténèbres » conserve le registre biblique dignifié sans être archaïque.
