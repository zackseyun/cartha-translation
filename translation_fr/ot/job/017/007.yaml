  source_fidelity: Le premier membre rend fidèlement וַתֵּכַהּ (« s’est obscurci / s’est affaibli »), עֵינִי (« mon œil ») et מִכַּעַשׂ (« de chagrin »), tout en signalant correctement les sens voisins de כַּעַשׂ. Dans le second membre, le pluriel masculin וִיצֻרַי et כֻּלָּם est plus directement rendu par « tous mes membres » que par le collectif singulier « toute ma silhouette ». « Sont comme une ombre » reproduit sans ajout le comparatif כַּצֵּל.
  naturalness: « Mon œil s’est obscurci de chagrin » est naturel dans un registre poétique moderne. « Tous mes membres sont comme une ombre » est également clair, sobre et fidèle au parallélisme, sans l’explicitation interprétative de « n’est plus qu’une ombre ».
  terminology: « Membres » constitue un rendu français approprié du terme rare et discuté וִיצֻרַי. La note doit conserver les possibilités « formes », « traits corporels » ou « constitution », sans prétendre résoudre l’incertitude. L’appel de note doit être placé sur « membres », le mot auquel il se rapporte.
