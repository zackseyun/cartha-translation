  text: My eye has grown dim from grief[b][a], and all my members are like a shadow.
translation:
  language: fr
  text: Mon œil s’est obscurci de chagrin[a], et tous mes membres[b] sont comme une ombre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’irritation », « de contrariété », « de vexation » ou « de colère ». Le mot hébreu peut désigner diverses formes de trouble intérieur.
    reason: lexical_alternative
  - marker: b
    text: Ou « mes formes », « mes traits corporels » ou « ma constitution ». Le terme hébreu est rare et son sens précis est discuté.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכַהּ
  choice: s’est obscurci
  rationale: Le verbe כהה exprime le fait de devenir terne, faible ou obscur. « S’est obscurci » conserve ici l’image poétique d’une vue qui baisse.
- source_word: מִכַּעַשׂ
  choice: de chagrin
  rationale: כַּעַשׂ peut désigner le chagrin, l’irritation ou la colère. Dans cette lamentation marquée par la souffrance, « chagrin » convient au contexte sans effacer les autres sens possibles, signalés en note.
- source_word: עֵינִי
  choice: Mon œil
  rationale: Le texte hébreu emploie le singulier avec un suffixe de première personne. Le singulier demeure intelligible et garde la forme ainsi que la tonalité poétique de la source.
- source_word: וִיצֻרַי
  choice: toute ma silhouette
  rationale: Le pluriel יְצֻרַי, de sens discuté, peut évoquer les formes ou traits corporels, voire les membres. Dans la comparaison avec une ombre, « toute ma silhouette » rend naturellement l’apparence corporelle devenue indistincte tout en laissant l’incertitude lexicale en note.
- source_word: כַּצֵּל
  choice: n’est plus qu’une ombre
  rationale: Cette formulation française naturelle conserve l’image de l’ombre et exprime l’état d’effacement ou d’amaigrissement suggéré dans le contexte.
- source_word: כֻּלָּם
  choice: toute
  rationale: Le masculin pluriel « tous » renvoie à l’ensemble des יְצֻרַי. Avec le collectif français « silhouette », sa portée globale est rendue par « toute ».
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le vers conserve le singulier « mon œil » et l’image de l’ombre. « Silhouette » offre une lecture naturelle de וִיצֻרַי dans ce contexte, tandis que la note maintient l’ambiguïté entre formes, traits et membres corporels.
