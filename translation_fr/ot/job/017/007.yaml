  - severity: low
    issue: La formulation « n’est plus qu’une ombre » renforce légèrement la comparaison.
    rationale: Le texte dit littéralement que tous les éléments visés « sont comme une ombre ». « Sont comme une ombre » maintient l’image sans en préciser l’effet.
