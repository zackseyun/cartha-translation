  text: וַ/יֹּאמֶר֮ נַעֲמָן֒ וָ/לֹ֕א יֻתַּן נָ֣א לְ/עַבְדְּ/ךָ֔ מַשָּׂ֥א צֶֽמֶד פְּרָדִ֖ים אֲדָמָ֑ה כִּ֡י לֽוֹא יַעֲשֶׂה֩ ע֨וֹד עַבְדְּ/ךָ֜ עֹלָ֤ה וָ/זֶ֨בַח֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים כִּ֖י אִם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/017.yaml
  text: Then Naaman said[a], “If not, please let your servant be given a load of soil, a pair of mules' burden; for your servant will no longer offer burnt offering or sacrifice to other gods[c][b], but only to Yahweh.”
translation:
  language: fr
  text: 'Alors Naaman dit : « Sinon, je te prie, qu’on donne à ton serviteur une quantité de terre équivalant à la charge d’une paire de mulets[a][b]. Car ton serviteur n’offrira plus ni holocauste ni sacrifice à d’autres dieux, mais à Yahweh seul[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « une charge de terre pour une paire de mulets ». Il s’agit de la quantité de terre que deux mulets peuvent porter.'
    reason: lexical_alternative
  - marker: b
    text: La demande de terre d’Israël peut refléter l’association ancienne entre une divinité et son territoire, ou le désir de rendre un culte à Yahweh sur de la terre israélite. Le texte n’en précise pas la raison.
    reason: cultural_note
  - marker: c
    text: « Yahweh » transcrit le nom divin représenté en hébreu par les quatre consonnes YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: וָלֹא
  choice: Sinon
  rationale: Dans le contexte, Naaman réagit au refus d’Élisée d’accepter son présent. « Sinon » rend avec concision la réponse conditionnelle et elliptique de l’hébreu sans expliciter davantage que le texte.
- source_word: יֻתַּן נָא לְעַבְדְּךָ
  choice: je te prie, qu’on donne à ton serviteur
  rationale: Cette formulation conserve la tournure passive de יֻתַּן, la politesse exprimée par נָא et la manière déférente dont Naaman parle de lui-même.
- source_word: מַשָּׂא צֶמֶד פְּרָדִים אֲדָמָה
  choice: une quantité de terre équivalant à la charge d’une paire de mulets
  rationale: La formulation exprime naturellement en français la quantité de terre transportable par deux mulets, tout en conservant les éléments concrets de l’hébreu.
- source_word: כִּי לֹא יַעֲשֶׂה עוֹד עַבְדְּךָ
  choice: Car ton serviteur n’offrira plus
  rationale: Avec des objets sacrificiels, עשה signifie idiomatiquement offrir ou présenter; « n’offrira plus » est clair et naturel.
- source_word: עֹלָה וָזֶבַח
  choice: ni holocauste ni sacrifice
  rationale: « Holocauste » désigne l’offrande entièrement consumée, tandis que « sacrifice » garde à זֶבַח sa portée plus générale.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: à d’autres dieux
  rationale: La préposition désigne les divinités destinataires des offrandes; cette traduction est directe et idiomatique.
- source_word: כִּי אִם לַיהוָה
  choice: mais à Yahweh seul
  rationale: כִּי אִם exprime une exclusion forte. « Mais à Yahweh seul » rend clairement l’exclusivité et conserve le nom divin.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Motif de la demande de terre d’Israël
  choice: La demande est traduite sans en préciser le motif dans le texte principal.
  alternative: Expliquer qu’elle devait servir de base à un autel ou permettre de rendre un culte sur de la terre israélite.
  rationale: Le verset relie cette terre au culte exclusif de Yahweh, mais n’explique pas précisément la pensée de Naaman. Une note présente les possibilités sans trancher.
translation_notes:
  register: Français international moderne, naturel et digne. La déférence de Naaman est conservée par « je te prie » et « ton serviteur ». La syntaxe reste lisible tout en maintenant la tournure passive de la requête et l’ambiguïté entourant la terre demandée.
