source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/קְרֹא֩ מֶֽלֶךְ יִשְׂרָאֵ֨ל אֶת הַ/סֵּ֜פֶר וַ/יִּקְרַ֣ע בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ הַ/אֱלֹהִ֥ים אָ֨נִי֙ לְ/הָמִ֣ית וּֽ/לְ/הַחֲי֔וֹת כִּֽי זֶה֙ שֹׁלֵ֣חַ אֵלַ֔/י לֶ/אֱסֹ֥ף אִ֖ישׁ מִ/צָּֽרַעְתּ֑/וֹ כִּ֤י אַךְ דְּעֽוּ נָא֙ וּ/רְא֔וּ כִּֽי מִתְאַנֶּ֥ה ה֖וּא לִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/007.yaml
  text: And when the king of Israel read the letter[a], he tore his clothes and said, “Am I God, to put to death and to make alive, that this man sends word to me to cure a man of his leprosy? Only take note, please[b], and see how he is seeking a quarrel with me.”
translation:
  language: fr
  text: 'Lorsque le roi d’Israël lut la lettre, il déchira ses vêtements et dit : « Suis-je Dieu, capable de faire mourir et de faire vivre, pour que cet homme m’envoie demander de guérir un homme de sa lèpre[a] ? Comprenez donc, je vous prie, et voyez : il cherche un prétexte contre moi[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « lèpre » peut désigner diverses affections cutanées, et pas seulement la maladie de Hansen.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il cherche querelle avec moi » ; l’expression peut aussi évoquer la recherche d’une occasion hostile contre quelqu’un.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: la lettre
  rationale: Dans ce contexte narratif, סֵפֶר désigne le message écrit envoyé par le roi d’Aram ; « lettre » est le terme français naturel et précis.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: il déchira ses vêtements
  rationale: Cette formulation conserve littéralement le geste conventionnel exprimant la détresse et l’effroi.
- source_word: הַאֱלֹהִים אָנִי
  choice: Suis-je Dieu
  rationale: La question oppose le roi au Dieu qui possède l’autorité sur la mort et la vie ; l’absence d’article devant l’attribut est naturelle en français.
- source_word: לְהָמִית וּלְהַחֲיוֹת
  choice: capable de faire mourir et de faire vivre
  rationale: « Faire mourir et faire vivre » préserve le parallélisme solennel des deux infinitifs ; « capable de » explicite naturellement leur rapport à la question rhétorique sans modifier son sens.
- source_word: שֹׁלֵחַ אֵלַי
  choice: m’envoie quelqu’un
  rationale: Le sujet implicite est le roi araméen désigné avec distance par « cet homme », et la personne envoyée est Naaman ; cette formulation suit le mouvement concret du récit.
- source_word: לֶאֱסֹף אִישׁ מִצָּרַעְתּוֹ
  choice: afin que je le guérisse de sa lèpre
  rationale: אָסַף avec מִן exprime ici le retrait ou la délivrance d’un mal. « Guérir de » en rend idiomatiquement le sens en français.
- source_word: צָּרַעַת
  choice: lèpre
  rationale: Le terme traditionnel assure la continuité narrative, tandis qu’une note signale que le mot hébreu couvre des affections cutanées plus larges que la maladie de Hansen.
- source_word: אַךְ דְּעוּ נָא וּרְאוּ
  choice: Sachez-le donc et voyez
  rationale: La paire d’impératifs est conservée ; « donc » rend ici l’insistance de אַךְ et נָא de manière naturelle, plutôt qu’une politesse peu probable dans cette exclamation alarmée.
- source_word: מִתְאַנֶּה הוּא לִי
  choice: il cherche un prétexte contre moi
  rationale: Le hitpael de אנה exprime la recherche d’une occasion hostile. « Chercher un prétexte contre » restitue clairement cette intention sans imposer qu’une querelle ait déjà commencé.
theological_decisions:
- issue: Sens de הָאֱלֹהִים dans la question rhétorique
  choice: Suis-je Dieu
  alternative: Suis-je un dieu
  rationale: Dans le contexte israélite, la capacité de faire mourir et vivre relève de la prérogative divine. La traduction retenue conserve cette force tout en laissant la déclaration dans la bouche du roi.
- issue: Portée médicale de צָרַעַת
  choice: lèpre, avec note explicative
  alternative: grave maladie de peau
  rationale: « Lèpre » reste immédiatement reconnaissable dans ce récit, mais la note évite de réduire abusivement le terme hébreu à la seule maladie de Hansen.
- issue: Nature de l’hostilité exprimée par מִתְאַנֶּה
  choice: il cherche un prétexte contre moi
  alternative: il cherche querelle avec moi
  rationale: Le texte peut viser soit une occasion d’accusation, soit une provocation. Le choix principal souligne le motif politique soupçonné par le roi, tandis que la note préserve l’autre nuance.
translation_notes:
  register: Français international moderne, narratif et digne. Le parallélisme « faire mourir et faire vivre » est conservé. Les deux impératifs hébreux restent distincts, et l’ambiguïté entre prétexte hostile et querelle est signalée en note.
