  text: וְ/צָרַ֤עַת נַֽעֲמָן֙ תִּֽדְבַּק בְּ/ךָ֔ וּֽ/בְ/זַרְעֲ/ךָ לְ/עוֹלָ֑ם וַ/יֵּצֵ֥א מִ/לְּ/פָנָ֖י/ו מְצֹרָ֥ע כַּ/שָּֽׁלֶג־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/027.yaml
  text: So Naaman’s skin disease will cling to you and to your offspring forever.” And he went out from his presence diseased[a], white as snow.
translation:
  language: fr
  text: « Ainsi, la maladie de peau de Naamân s’attachera à toi et à ta descendance pour toujours. » Guéhazi quitta alors sa présence, atteint de cette maladie[a], blanc comme la neige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « la lèpre de Naamân s’attachera à toi… et il sortit lépreux, blanc comme la neige ». Les termes hébreux צָרַעַת et מְצֹרָע désignent plus largement une affection cutanée grave ou un état associé, pas nécessairement la lèpre au sens médical moderne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: maladie de peau
  rationale: Le terme hébreu désigne une affection cutanée grave ou un état rituel associé, sans correspondre nécessairement à la maladie de Hansen. Cette formulation moderne évite une précision médicale anachronique.
- source_word: נַעֲמָן
  choice: Naamân
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: תִּדְבַּק
  choice: s’attachera
  rationale: Le verbe דבק exprime ici l’idée d’une adhérence persistante; « s’attachera à » conserve l’image de la malédiction en français naturel.
- source_word: וּבְזַרְעֲךָ
  choice: et à ta descendance
  rationale: זֶרַע désigne ici la postérité; « descendance » est clair, courant et adapté au registre.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Dans cette formule de jugement, l’expression indique une durée indéfiniment prolongée.
- source_word: וַיֵּצֵא
  choice: quitta alors
  rationale: Cette formulation restitue le mouvement narratif de la forme verbale hébraïque dans un français fluide.
- source_word: מִלְּפָנָיו
  choice: sa présence
  rationale: Littéralement « de devant lui »; « quitter sa présence » rend naturellement l’idée relationnelle et spatiale.
- source_word: מְצֹרָע
  choice: atteint de cette maladie
  rationale: Le participe appartient au même champ lexical que צָרַעַת. La reprise démonstrative maintient le lien avec la maladie de Naamân sans poser un diagnostic moderne précis.
- source_word: כַשָּׁלֶג
  choice: blanc comme la neige
  rationale: Le texte dit littéralement « comme la neige »; la blancheur constitue le point de comparaison implicite et peut être explicitée naturellement en français.
theological_decisions:
- issue: Sens de צָרַעַת et מְצֹרָע
  choice: maladie de peau / atteint de cette maladie
  alternative: lèpre / lépreux
  rationale: Le passage présente une affection imposée comme jugement et transmise à la descendance, mais le vocabulaire hébreu ne justifie pas son identification certaine à la lèpre moderne. La traduction principale conserve donc une désignation générale, tandis que la formulation traditionnelle est signalée en note.
- issue: Identification du sujet implicite de וַיֵּצֵא
  choice: Guéhazi
  alternative: il
  rationale: Le contexte immédiat identifie sans ambiguïté Guéhazi comme celui qui sort de la présence d’Élisée. Nommer le sujet rend la phrase française autonome et claire sans modifier le référent.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image forte de l’affection qui « s’attache » à Guéhazi et à sa descendance, tout en évitant l’identification médicale anachronique à la lèpre.
