  to: 'Mais Guéhazi, le serviteur d’Élisée, l’homme de Dieu, se dit : « Voici que mon maître a ménagé Naaman, cet Araméen, en ne prenant pas de sa main ce qu’il avait apporté. Aussi vrai que Yahweh est vivant[a], je vais courir après lui et prendre quelque chose de lui. »'
