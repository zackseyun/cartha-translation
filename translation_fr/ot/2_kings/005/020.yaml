  text: וַ/יֹּ֣אמֶר גֵּיחֲזִ֗י נַעַר֮ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִים֒ הִנֵּ֣ה חָשַׂ֣ךְ אֲדֹנִ֗/י אֶֽת נַעֲמָ֤ן הָֽ/אֲרַמִּי֙ הַ/זֶּ֔ה מִ/קַּ֥חַת מִ/יָּד֖/וֹ אֵ֣ת אֲשֶׁר הֵבִ֑יא חַי יְהוָה֙ כִּֽי אִם רַ֣צְתִּי אַחֲרָ֔י/ו וְ/לָקַחְתִּ֥י מֵ/אִתּ֖/וֹ מְאֽוּמָה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/020.yaml
  text: But Gehazi[a], the servant of Elisha the man of God, said, “Look, my master has spared Naaman this Aramean by not taking from his hand what he brought. As Yahweh lives[d][c][b], I will run after him and take something from him.”
translation:
  language: fr
  text: 'Mais Guéhazi, le serviteur d’Élisée, l’homme de Dieu, se dit : « Voici que mon maître a ménagé Naaman, cet Araméen, en ne prenant pas de sa main ce qu’il avait apporté. Aussi vrai que Yahweh est vivant[a], je vais courir après lui et prendre quelque chose de lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formule de serment hébraïque ; littéralement : « Yahweh est vivant. »'
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: serviteur
  rationale: Dans ce contexte, le terme désigne la fonction de Guéhazi auprès d’Élisée plutôt que son âge.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Traduction transparente du titre prophétique traditionnel.
- source_word: הִנֵּה
  choice: omis comme interjection autonome
  rationale: Sa valeur emphatique est naturellement portée en français par la formulation directe « Mon maître a… »; « Voici » serait peu idiomatique dans ce monologue.
- source_word: חָשַׂךְ
  choice: a ménagé
  rationale: Le verbe exprime ici qu’Élisée a épargné à Naaman de devoir céder son présent, tout en conservant la nuance de retenue.
- source_word: אֲדֹנִי
  choice: mon maître
  rationale: Il s’agit d’Élisée, supérieur humain de Guéhazi, et non de Dieu.
- source_word: הָאֲרַמִּי
  choice: cet Araméen
  rationale: « Araméen » correspond directement au terme ethnique hébreu; le démonstratif restitue הַזֶּה.
- source_word: מִקַּחַת מִיָּדוֹ
  choice: en refusant de prendre de sa main
  rationale: Cette formulation rend la retenue exprimée par חָשַׂךְ suivi de l’infinitif, tout en conservant l’image hébraïque de la main.
- source_word: אֵת אֲשֶׁר הֵבִיא
  choice: ce qu’il avait apporté
  rationale: Le plus-que-parfait situe naturellement en français l’apport antérieur à la décision d’Élisée.
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Rend clairement en français moderne la formule de serment hébraïque tout en conservant le nom divin.
- source_word: רַצְתִּי אַחֲרָיו
  choice: je vais courir après lui
  rationale: Le parfait dans la formule de serment exprime ici une résolution immédiate; le futur proche est naturel en français.
- source_word: וְלָקַחְתִּי מֵאִתּוֹ מְאוּמָה
  choice: et obtenir quelque chose de sa part
  rationale: « Obtenir » exprime mieux le projet de soutirer un présent que le calque « prendre de lui », sans préciser indûment la nature de la chose.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel divin; « Yahweh » le conserve plutôt que de lui substituer un titre.
- issue: Force morale du serment de Guéhazi
  choice: conserver la formule solennelle sans commentaire dans le corps du texte
  alternative: expliciter qu’il invoque abusivement le nom divin
  rationale: Le récit laisse l’ironie et la faute ressortir du contexte; la traduction ne doit pas ajouter un jugement absent de cette proposition.
translation_notes:
  register: Français international moderne, narratif et digne. « Se dit » rend naturellement un propos intérieur introduit en hébreu par « dit ». L’apposition « cet Araméen, Naaman » garde l’accent dépréciatif possible du démonstratif sans le renforcer artificiellement. Le marqueur [a] figure dans le texte principal.
