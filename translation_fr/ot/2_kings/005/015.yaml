  text: וַ/יָּשָׁב֩ אֶל אִ֨ישׁ הָ/אֱלֹהִ֜ים ה֣וּא וְ/כָֽל מַחֲנֵ֗/הוּ וַ/יָּבֹא֮ וַ/יַּעֲמֹ֣ד לְ/פָנָי/ו֒ וַ/יֹּ֗אמֶר הִנֵּה נָ֤א יָדַ֨עְתִּי֙ כִּ֣י אֵ֤ין אֱלֹהִים֙ בְּ/כָל הָ/אָ֔רֶץ כִּ֖י אִם בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּ֛ה קַח נָ֥א בְרָכָ֖ה מֵ/אֵ֥ת עַבְדֶּֽ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/015.yaml
  text: Then he returned to the man of God[a], he and all his company, and came and stood before him and said, “See now, I know that there is no God in all the earth except in Israel. And now, please accept a gift from your servant.”
translation:
  language: fr
  text: 'Puis Naaman retourna auprès de l’homme de Dieu, avec toute sa suite. Il vint se tenir devant lui et dit : « Maintenant, je sais qu’il n’y a de Dieu sur toute la terre qu’en Israël. Accepte donc, je te prie, un cadeau[a] de la part de ton serviteur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une bénédiction ». Ici, le terme hébreu désigne un cadeau ou un présent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Titre hébreu consacré pour un prophète ou porte-parole divin; cette formulation préserve l’idiome et sa portée littéraire.
- source_word: מַחֲנֵהוּ
  choice: toute sa suite
  rationale: Littéralement « son camp »; dans ce récit, le terme désigne les personnes qui accompagnent Naaman. « Sa suite » est naturel en français et convient à son rang.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: se tenir devant lui
  rationale: Expression conventionnelle marquant la présence devant quelqu’un; le rendu reste proche de l’hébreu et naturel.
- source_word: הִנֵּה נָא
  choice: Maintenant
  rationale: La combinaison attire l’attention sur la prise de conscience qui suit. « Maintenant » exprime ici naturellement cette nouvelle certitude sans archaïsme.
- source_word: יָדַעְתִּי
  choice: je sais
  rationale: Le parfait exprime un état présent issu de l’expérience récente de Naaman; « je sais » en rend clairement la force.
- source_word: אֵין אֱלֹהִים בְּכָל הָאָרֶץ כִּי אִם בְּיִשְׂרָאֵל
  choice: il n’y a de Dieu sur toute la terre qu’en Israël
  rationale: Cette formulation française exprime directement l’affirmation exclusive du texte, tout en conservant « en Israël » plutôt que d’ajouter « le Dieu d’Israël ».
- source_word: בְרָכָה
  choice: un cadeau
  rationale: Le sens premier est « bénédiction », mais le nom désigne idiomatiquement ici un présent offert. « Cadeau » communique clairement ce sens en français moderne.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Il s’agit ici d’une autodésignation déférente, non d’une insistance sur un statut servile.
- source_word: קַח נָא
  choice: Accepte donc, je te prie
  rationale: Littéralement « prends, s’il te plaît »; dans le contexte d’une offrande, « accepte » rend naturellement la valeur pragmatique de l’impératif.
theological_decisions:
- issue: La confession de Naaman selon laquelle il n’y a de Dieu qu’en Israël
  choice: Conserver comme une affirmation directe de l’unicité du Dieu révélé en Israël, avec « Dieu » et la localisation « en Israël ».
  alternative: Écrire « dieu » au sens générique ou développer en « il n’y a pas d’autre Dieu que le Dieu d’Israël ».
  rationale: L’hébreu formule une confession exclusive forte. Le rendu choisi n’en atténue pas la portée, mais évite aussi d’ajouter une identification explicite absente de la proposition.
translation_notes:
  register: Français international moderne, digne et accessible. Le nom « Naaman » explicite le sujet du pronom hébreu au début du verset afin d’éviter une ambiguïté française, tandis que la répétition des actions et la confession solennelle sont préservées. Le tutoiement correspond au singulier de l’adresse hébraïque et au rapport personnel exprimé dans la scène.
