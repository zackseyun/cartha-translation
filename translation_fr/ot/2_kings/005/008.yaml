  to: 'Lorsque Élisée, l’homme de Dieu, apprit que le roi d’Israël avait déchiré ses vêtements[a], il envoya dire au roi : « Pourquoi avez-vous déchiré vos vêtements ? Qu’il vienne donc chez moi[b], et il saura qu’il y a un prophète en Israël. »'
  rationale: La révision retire l’ajout interprétatif « cet homme » tout en gardant, dans la note, l’identification contextuelle certaine de Naaman. Elle adopte aussi le vouvoiement, qui est la forme française naturelle pour l’adresse directe à un roi et conserve un référent singulier.
