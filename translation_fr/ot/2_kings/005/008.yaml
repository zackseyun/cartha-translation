    issue: « Cet homme » explicite et enrichit le sujet implicite de יָבֹא.
    rationale: Le contexte identifie le référent à Naaman, mais le texte source ne dit pas « cet homme ». « Qu’il vienne » conserve mieux la formulation elliptique, tandis que la note peut préciser le référent.
  - severity: low
    issue: Tutoiement du roi (« as-tu », « tes »).
    rationale: Le singulier hébreu ne requiert pas le tutoiement français. Le vouvoiement est la forme naturelle et respectueuse pour s’adresser à un roi en français moderne, sans introduire un pluriel sémantique.
