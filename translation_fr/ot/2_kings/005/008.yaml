source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִ֗ים כִּֽי קָרַ֤ע מֶֽלֶךְ יִשְׂרָאֵל֙ אֶת בְּגָדָ֔י/ו וַ/יִּשְׁלַח֙ אֶל הַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר לָ֥/מָּה קָרַ֖עְתָּ בְּגָדֶ֑י/ךָ יָבֹֽא נָ֣א אֵלַ֔/י וְ/יֵדַ֕ע כִּ֛י יֵ֥שׁ נָבִ֖יא בְּ/יִשְׂרָאֵֽל׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/008.yaml
  text: When Elisha[a], the man of God, heard that the king of Israel had torn his clothes, he sent to the king, saying, “Why have you torn your clothes? Please let him come to me[b], and he will know that there is a prophet in Israel.”
translation:
  language: fr
  text: 'Lorsque Élisée, l’homme de Dieu, apprit que le roi d’Israël avait déchiré ses vêtements[a], il envoya dire au roi : « Pourquoi avez-vous déchiré vos vêtements ? Qu’il vienne donc chez moi[b], et il saura qu’il y a un prophète en Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression désigne le geste habituel qui consistait à déchirer ses vêtements en signe de détresse ou de deuil.
    reason: Précision culturelle et lexicale sur le geste décrit par l’hébreu.
  - marker: b
    text: « Qu’il vienne donc chez moi » désigne Naaman, et non le roi d’Israël.
    reason: Clarification du référent implicite du verbe hébreu à la troisième personne.
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Lorsque … apprit
  rationale: La tournure temporelle française restitue naturellement l’enchaînement narratif hébreu sans ajouter un marqueur tel que « Or » ou « Maintenant », absent du texte source.
- source_word: אֱלִישָׁע
  choice: Élisée
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Cette expression conserve le titre prophétique établi et sa portée représentative, plutôt que de le réduire à une simple description de piété.
- source_word: קָרַע … אֶת בְּגָדָיו
  choice: avait déchiré ses vêtements
  rationale: Le plus-que-parfait marque l’antériorité de l’acte par rapport au moment où Élisée l’apprend. « Déchirer ses vêtements » rend clairement le geste conventionnel de détresse ou de deuil.
- source_word: וַיִּשְׁלַח אֶל הַמֶּלֶךְ לֵאמֹר
  choice: il envoya dire au roi
  rationale: Formulation française idiomatique qui n’ajoute pas explicitement de messager et introduit naturellement les paroles rapportées.
- source_word: לָמָּה קָרַעְתָּ בְּגָדֶיךָ
  choice: Pourquoi as-tu déchiré tes vêtements ?
  rationale: Le passé composé convient à une action récente dont les effets demeurent présents, tout en conservant l’interpellation directe au singulier.
- source_word: יָבֹא נָא אֵלַי
  choice: Que cet homme vienne donc chez moi
  rationale: Le subjonctif à la troisième personne respecte le fait qu’Élisée parle de Naaman, et non du roi. « Donc » rend ici avec naturel la nuance d’appel portée par נָא sans transformer la phrase en ordre adressé directement à Naaman.
- source_word: וְיֵדַע
  choice: et il saura
  rationale: Le futur exprime la conséquence attendue tout en maintenant la coordination et la légère ouverture interprétative de l’imparfait hébreu.
- source_word: כִּי יֵשׁ נָבִיא בְּיִשְׂרָאֵל
  choice: qu’il y a un prophète en Israël
  rationale: La tournure existentielle française correspond directement à יֵשׁ et préserve l’accent mis sur la présence réelle d’un prophète en Israël.
theological_decisions:
- issue: Portée du titre אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  alternative: un homme pieux ; l’homme qui appartient à Dieu
  rationale: Dans ce récit, l’expression fonctionne comme un titre prophétique désignant Élisée comme représentant de Dieu. La traduction retenue préserve cette fonction sans lui imposer une interprétation confessionnelle supplémentaire.
- issue: Référent des verbes masculins singuliers dans יָבֹא … וְיֵדַע
  choice: Naaman, explicité par « cet homme » et par une note
  alternative: le roi d’Israël
  rationale: Le contexte immédiat indique que celui qui doit venir et apprendre qu’il existe un prophète en Israël est Naaman. La formulation évite néanmoins d’ajouter son nom dans le corps du verset.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement conserve le singulier de l’adresse hébraïque au roi sans recourir au vouvoiement moderne, qui brouillerait le nombre. « Cet homme » explicite sobrement le pronom implicite afin d’éviter que le lecteur ne prenne le roi pour celui qui doit venir.
