  source_fidelity: 'Le sens et l’enchaînement du texte hébreu sont correctement rendus : Élisée apprend le geste du roi, lui fait transmettre un message, et demande que Naaman vienne afin qu’il reconnaisse la présence d’un prophète en Israël. Le plus-que-parfait est justifié. Toutefois, « cet homme » ajoute au texte un démonstratif et le nom commun « homme », alors que l’hébreu emploie seulement un verbe à la troisième personne avec sujet implicite.'
  naturalness: « Que cet homme vienne donc chez moi » est moins naturel et plus explicitant que nécessaire. Dans une adresse à un roi, le vouvoiement est le registre français idiomatique ; il peut parfaitement désigner une seule personne et ne fausse donc pas le singulier hébreu.
  terminology: « Élisée », « l’homme de Dieu », « déchirer ses vêtements » et « un prophète en Israël » sont exacts et de registre approprié.
