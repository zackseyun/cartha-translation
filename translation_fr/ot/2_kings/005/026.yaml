source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לֹא לִבִּ֣/י הָלַ֔ךְ כַּ/אֲשֶׁ֧ר הָֽפַךְ אִ֛ישׁ מֵ/עַ֥ל מֶרְכַּבְתּ֖/וֹ לִ/קְרָאתֶ֑/ךָ הַ/עֵ֞ת לָ/קַ֤חַת אֶת הַ/כֶּ֨סֶף֙ וְ/לָ/קַ֣חַת בְּגָדִ֔ים וְ/זֵיתִ֤ים וּ/כְרָמִים֙ וְ/צֹ֣אן וּ/בָקָ֔ר וַ/עֲבָדִ֖ים וּ/שְׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/026.yaml
  text: But he said to him[a], “Did not my heart go when the man turned from his chariot to meet you? Is this the time to take silver, and to take garments, and olive orchards and vineyards, and sheep and cattle[b], and male servants and female servants?”
translation:
  language: fr
  text: 'Mais Élisée lui dit : « Mon cœur ne t’a-t-il pas accompagné[a] lorsque cet homme s’est détourné de son char pour venir à ta rencontre ? Était-ce le moment de prendre de l’argent et des vêtements, des oliveraies et des vignes, du petit et du gros bétail, des serviteurs et des servantes[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « N’étais-je pas présent en esprit lorsque cet homme s’est détourné de son char pour venir à ta rencontre ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des esclaves, hommes et femmes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי הָלַךְ
  choice: Mon cœur ne t’a-t-il pas accompagné
  rationale: Cette formulation conserve l’image hébraïque du cœur qui « va » tout en rendant clairement en français l’idée de la présence ou de la perception intérieure d’Élisée. Le pronom « t’ » est implicite dans le contexte et permet une phrase française naturelle.
- source_word: כַּאֲשֶׁר הָפַךְ אִישׁ מֵעַל מֶרְכַּבְתּוֹ לִקְרָאתֶךָ
  choice: lorsque cet homme s’est détourné de son char pour venir à ta rencontre
  rationale: « S’est détourné » reflète le sens fondamental de הָפַךְ sans préciser au-delà du texte s’il est descendu du char. « Cet homme » désigne naturellement Naaman dans le contexte sans introduire son nom.
- source_word: הָעֵת
  choice: Était-ce le moment
  rationale: La question rhétorique, implicite en hébreu, exprime la réprobation d’Élisée. L’imparfait français s’accorde naturellement avec l’acte passé qu’il condamne.
- source_word: לָקַחַת אֶת הַכֶּסֶף
  choice: prendre de l’argent
  rationale: כֶּסֶף désigne littéralement l’argent-métal et couramment la monnaie. En français moderne, « de l’argent » restitue naturellement les deux dimensions pertinentes ici.
- source_word: בְּגָדִים
  choice: des vêtements
  rationale: Terme courant, digne et exact pour les biens textiles reçus par Guéhazi.
- source_word: זֵיתִים
  choice: des oliveraies
  rationale: Dans cette énumération de biens productifs, le pluriel désigne vraisemblablement des plantations d’oliviers plutôt que les fruits seuls.
- source_word: כְרָמִים
  choice: des vignes
  rationale: « Vignes » est le terme français naturel pour des propriétés viticoles et forme une paire fluide avec « oliveraies ».
- source_word: צֹאן וּבָקָר
  choice: du petit et du gros bétail
  rationale: Cette paire française traditionnelle et intelligible rend les catégories collectives hébraïques plus exactement que « brebis et bovins », qui serait trop restrictif.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: des serviteurs et des servantes
  rationale: La traduction conserve la distinction de genre explicite. Ces termes peuvent désigner des personnes en condition servile; cette possibilité est signalée en note sans l’imposer dans le corps du texte.
theological_decisions:
- issue: Nature de la connaissance d’Élisée exprimée par לִבִּי הָלַךְ
  choice: Conserver l’image du cœur qui accompagne Guéhazi
  alternative: « N’étais-je pas présent en esprit ? »
  rationale: Le texte affirme une forme de perception à distance sans en expliquer précisément le mécanisme. La traduction préserve cette tension au lieu de définir une doctrine de révélation prophétique.
- issue: Statut social exprimé par עֲבָדִים וּשְׁפָחוֹת
  choice: serviteurs et servantes
  alternative: esclaves, hommes et femmes
  rationale: Le champ sémantique inclut le service dépendant et l’esclavage. Le contexte énumère des acquisitions et ne permet pas d’en déterminer plus précisément le statut juridique; une note conserve donc l’autre lecture importante.
translation_notes:
  register: Français international moderne, courant et digne. L’image sémitique du « cœur » est maintenue, mais légèrement explicitée pour rester intelligible. L’énumération garde son rythme cumulatif et la question rhétorique conserve la force de la réprimande prophétique.
