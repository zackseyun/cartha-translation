  - severity: low
    issue: « Puis il tourna les talons et partit furieux »
    rationale: « Tourner les talons » est une intensification idiomatique non explicitement exprimée par ויפן. « Il se détourna et partit, furieux » restitue les deux verbes sans ajout.
  - severity: low
    issue: 'Note b : « la disparition de l’affection physique »'
    rationale: טהרתּי exprime l’état de devenir/être pur ou net ; la guérison est contextuellement impliquée, mais « disparition » n’est pas le sens lexical direct. Une note doit présenter ce recouvrement avec davantage de précision.
