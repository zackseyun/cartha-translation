  to: « L’Abana[a] et le Parpar, les rivières de Damas, ne valent-ils pas mieux que toutes les eaux d’Israël ? Ne pourrais-je pas m’y laver et être pur[b] ? » Il se détourna et partit, furieux.
  rationale: La révision conserve toutes les ambiguïtés pertinentes du texte hébreu et les noms traditionnels, tout en remplaçant un terme hydrologique français trop spécifique, en supprimant une intensification idiomatique de la scène du départ, et en précisant la note lexicale sur la pureté.
