base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/012.yaml
  text: Are not Abanah and Pharpar[a], the rivers of Damascus[b], better than all the waters of Israel? Could I not wash in them and be clean?” So he turned and went away in a rage.
translation:
  language: fr
  text: « L’Abana[a] et le Parpar, les rivières de Damas, ne valent-ils pas mieux que toutes les eaux d’Israël ? Ne pourrais-je pas m’y laver et être pur[b] ? » Il se détourna et partit, furieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains lisent « Amana », selon une autre forme traditionnelle du nom de ce cours d’eau.
    reason: alternative_reading
  - marker: b
    text: Ou « devenir net » ou « être purifié » ; l’hébreu peut évoquer à la fois le fait d’être débarrassé de son état physique et une notion plus large de pureté.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: ne… pas ? / ne pourrais-je pas ?
  rationale: La particule introduit ici deux questions rhétoriques qui attendent une réponse affirmative ; cette tournure est naturelle en français.
- source_word: טוֹב … מִכֹּל
  choice: valent-ils mieux que toutes
  rationale: La construction est comparative. « Valoir mieux que » rend idiomatiquement l’idée de supériorité tout en conservant la totalité exprimée par « toutes ».
- source_word: אבנה
  choice: l’Abana
  rationale: Transcription française naturelle de la forme du texte massorétique ; la variante traditionnelle « Amana » est signalée en note.
- source_word: וּפַרְפַּר
  choice: et le Parpar
  rationale: Transcription directe du nom hébreu, avec l’article normalement employé en français devant un nom de cours d’eau.
- source_word: נַהֲרוֹת דַּמֶּשֶׂק
  choice: les fleuves de Damas
  rationale: Rend naturellement la chaîne construite hébraïque. « Fleuves » conserve le terme générique du texte sans identifier plus précisément ces cours d’eau.
- source_word: מִכֹּל מֵימֵי יִשְׂרָאֵל
  choice: que toutes les eaux d’Israël
  rationale: Préserve l’expression totalisante et le terme large « eaux », sans le réduire à « fleuves ».
- source_word: אֶרְחַץ בָּהֶם
  choice: m’y laver
  rationale: Le pronom adverbial « y » renvoie naturellement en français aux deux fleuves nommés et « me laver » reprend l’action demandée à Naaman.
- source_word: וְטָהָרְתִּי
  choice: et devenir pur
  rationale: Cette formulation garde l’idée d’un changement d’état et l’amplitude de טהר, qui peut évoquer aussi bien la guérison physique que la pureté.
- source_word: וַיִּפֶן וַיֵּלֶךְ
  choice: il tourna les talons et partit
  rationale: 'Expression française vive et naturelle qui restitue les deux mouvements successifs : se détourner puis s’en aller.'
- source_word: בְּחֵמָה
  choice: furieux
  rationale: Rend l’intensité de חֵמָה plus justement que le simple « en colère », dans un français actuel.
theological_decisions:
- issue: Portée du vocabulaire de purification
  choice: devenir pur
  alternative: être guéri / devenir propre / être purifié
  rationale: Le contexte concerne la maladie de peau de Naaman, mais le verbe hébreu peut aussi porter une nuance de pureté plus large. « Devenir pur » préserve ce chevauchement sans limiter le sens à la guérison ni imposer une lecture cultuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions rhétoriques conservent l’emportement de Naaman. Les marqueurs de notes sont placés immédiatement après les mots qu’ils éclairent.
