  source_fidelity: 'Le sens fondamental est bien rendu : deux questions rhétoriques, comparaison avec l’ensemble des eaux d’Israël, lavage dans ces cours d’eau et départ sous le coup d’une vive colère. Une formulation plus littérale de la double action finale évite toutefois l’ajout idiomatique de « tourner les talons ». « Rivières » convient mieux que « fleuves » pour les cours d’eau de Damas en français moderne.'
  naturalness: Le français est généralement fluide et d’un registre approprié. « Il se détourna et partit, furieux » est naturel, vif et plus proche de la succession verbale hébraïque. « Rivières » est plus idiomatique et géographiquement moins connoté que « fleuves » dans ce contexte.
  terminology: Les noms Abana et Parpar sont recevables, et la note sur « Amana » préserve correctement la variante. « Être pur » conserve utilement le recouvrement entre l’état physique et la pureté, sans imposer « guéri » ou « purifié ». La note explicative doit éviter de présenter la disparition de l’affection comme le sens lexical direct du verbe.
