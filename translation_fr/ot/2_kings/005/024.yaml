base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/024.yaml
  text: When he came to the hill[a], he took them from their hands and deposited them in the house. Then he sent the men away[c][b], and they went.
translation:
  language: fr
  text: Quand il arriva à la colline[a], il les prit de leurs mains[b] et les déposa[c] dans la maison. Puis il renvoya les hommes, et ils partirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à la butte » ou « à la colline fortifiée » ; hébreu : « à l’Ophel ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « de leur main ».
    reason: lexical_alternative
  - marker: c
    text: Ou « les rangea » ou « les mit à l’abri ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹפֶל
  choice: la colline
  rationale: Le nom עֹפֶל peut désigner une hauteur, une butte ou une colline fortifiée. Dans ce récit, « la colline » exprime clairement le relief sans imposer le nom propre « Ophel », surtout associé à Jérusalem.
- source_word: מִיָּדָם
  choice: de leurs mains
  rationale: L’hébreu emploie littéralement « de leur main », au singulier collectif. Le pluriel français « de leurs mains » conserve l’image concrète tout en restant idiomatique.
- source_word: וַיִּפְקֹד
  choice: les déposa
  rationale: Dans ce contexte, פקד décrit l’action de placer les biens reçus à l’intérieur de la maison, vraisemblablement pour les mettre à l’abri. « Déposa » rend ce geste sans préciser davantage que le texte.
- source_word: בַּבָּיִת
  choice: dans la maison
  rationale: בית désigne ici le plus naturellement le bâtiment où Guéhazi place les biens.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le texte dit simplement « les hommes ». Même s’il s’agit, d’après le contexte, des serviteurs de Naaman, une désignation plus précise n’est pas introduite.
