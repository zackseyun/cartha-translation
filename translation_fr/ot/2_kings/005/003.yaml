base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/003.yaml
  text: She said to her mistress[b][a], “If only my lord were before the prophet who is in Samaria! Then he would gather him in from his leprosy.”
translation:
  language: fr
  text: 'Elle dit à sa maîtresse : « Ah ! si seulement mon maître était auprès du prophète qui est à Samarie ! Alors celui-ci le guérirait de sa lèpre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traditionnellement traduit par « lèpre » peut désigner plus largement une affection de la peau; il ne correspond pas nécessairement à la maladie appelée aujourd’hui lèpre ou maladie de Hansen.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִרְתָּהּ
  choice: sa maîtresse
  rationale: Dans ce contexte domestique, le terme désigne la femme qui exerce son autorité sur la jeune servante. « Maîtresse » exprime clairement ce rapport social.
- source_word: אַחֲלֵי
  choice: Ah ! si seulement
  rationale: Cette tournure française naturelle conserve la force du souhait exprimé par la particule hébraïque.
- source_word: אֲדֹנִי
  choice: mon maître
  rationale: La jeune fille parle de Naaman avec déférence. « Maître » convient au cadre domestique et conserve le possessif.
- source_word: לִפְנֵי
  choice: était auprès de
  rationale: L’expression hébraïque signifie littéralement « devant » et, idiomatiquement, « en présence de ». « Auprès de » communique naturellement l’idée d’une rencontre personnelle sans imposer la posture de se tenir debout.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Le texte emploie le titre défini sans nommer Élisée; la traduction maintient cette formulation.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: « À » est la préposition française habituelle avec un nom de ville et rend ici naturellement la localisation.
- source_word: אָז
  choice: Alors
  rationale: Le mot introduit la conséquence attendue de la situation souhaitée.
- source_word: יֶאֱסֹף אֹתוֹ מִצָּרַעְתּוֹ
  choice: il le délivrerait de sa lèpre
  rationale: Le verbe אסף signifie fondamentalement « rassembler, recueillir » mais, dans cette construction avec מן, il évoque ici le retrait ou la disparition de l’affection. « Délivrer de » reste naturel en français tout en conservant davantage cette image de retrait que le simple verbe « guérir ».
- source_word: צָרַעַת
  choice: lèpre
  rationale: « Lèpre » est le terme biblique français traditionnel et immédiatement reconnaissable, mais une note précise que le mot hébreu ne correspond pas nécessairement à la maladie de Hansen.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’exclamation « Ah ! si seulement » restitue le souhait ardent de la jeune fille. « Celui-ci » évite toute ambiguïté en indiquant que le sujet de la délivrance est le prophète.
