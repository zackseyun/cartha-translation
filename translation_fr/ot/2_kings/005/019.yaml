  rationale: La révision remplace « s’éloigna de lui » par « partit de chez lui », qui rend plus directement מֵאִתּוֹ dans ce contexte, et maintient l’indétermination de כִּבְרַת אָרֶץ avec « une certaine distance ». Elle ne donne aucune interprétation de la formule « Va en paix ».
