  text: And he said to him[a], “Go in peace.” So he went from him some distance.
translation:
  language: fr
  text: 'Il lui dit : « Va en paix. » Puis Naaman partit de chez lui et parcourut une certaine distance[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne une portion de chemin sans en préciser la longueur exacte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Il lui dit
  rationale: Le wayyiqtol poursuit le récit, et le pronom indirect renvoie à Naaman. Cette formulation est naturelle en français et n’ajoute aucune nuance temporelle absente de l’hébreu.
- source_word: לֵךְ לְשָׁלוֹם
  choice: Va en paix
  rationale: Cette formule conventionnelle associe congé et bénédiction. La traduction française conserve sa brièveté ainsi que sa portée ouverte.
- source_word: וַיֵּלֶךְ מֵאִתּוֹ
  choice: Puis Naaman s’éloigna de lui
  rationale: Le nom de Naaman explicite le sujet afin d’éviter une succession de pronoms ambigus en français. « S’éloigna de lui » exprime naturellement le départ hors de la présence d’Élisée.
- source_word: כִּבְרַת אָרֶץ
  choice: et parcourut une certaine distance[a]
  rationale: L’expression désigne une étendue de chemin sans donner de mesure exacte. « Une certaine distance » préserve cette imprécision sans suggérer qu’elle était nécessairement considérable.
theological_decisions:
- issue: Portée de la réponse d’Élisée après la demande de Naaman concernant le temple de Rimmôn
  choice: Conserver simplement la formule « Va en paix »
  alternative: La développer comme une approbation explicite de la conduite envisagée par Naaman, ou comme une formule de congé dépourvue de toute portée éthique
  rationale: L’hébreu ne formule ni approbation ni condamnation explicite. La traduction maintient donc la tension théologique du texte au lieu de la trancher.
translation_notes:
  register: Français international moderne, sobre et digne. Le nom « Naaman » est repris pour assurer la clarté référentielle; la formulation reste fluide et proche de la progression narrative hébraïque.
