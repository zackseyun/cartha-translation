  text: וַ/יָּבֵ֣א הַ/סֵּ֔פֶר אֶל מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר וְ/עַתָּ֗ה כְּ/ב֨וֹא הַ/סֵּ֤פֶר הַ/זֶּה֙ אֵלֶ֔י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ אֶת נַעֲמָ֣ן עַבְדִּ֔/י וַ/אֲסַפְתּ֖/וֹ מִ/צָּרַעְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/006.yaml
  text: And he brought the letter to the king of Israel[a], saying, “And now, when this letter comes to you, behold, I have sent Naaman my servant to you, so that you may gather him in from his skin disease.”
translation:
  language: fr
  text: 'Il remit la lettre au roi d’Israël. Elle disait : « À présent, quand cette lettre te parviendra, voici que je t’ai envoyé Naaman, mon serviteur, afin que tu le guérisses de sa maladie de peau[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « de sa lèpre ». Le terme hébreu peut désigner diverses affections cutanées. Le verbe employé avec « maladie de peau » forme ici une expression inhabituelle, dont le sens dans ce contexte est de délivrer Naaman de son affection.'
    reason: Signaler la portée plus large de צָרַעַת et le caractère inhabituel de l’expression avec אסף, sans proposer une littéralité française trompeuse.
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Il remit
  rationale: Le hifil de בוא a ici « la lettre » pour complément. « Remit » exprime naturellement en français l’acheminement et la présentation de la lettre, sans préciser davantage le mode de livraison.
- source_word: הַסֵּפֶר
  choice: la lettre
  rationale: Dans cet échange diplomatique entre rois, סֵפֶר désigne une communication écrite; « lettre » est l’équivalent moderne le plus naturel.
- source_word: לֵאמֹר
  choice: Elle disait
  rationale: Cette formulation introduit clairement le contenu de la lettre en français courant, là où une reproduction mécanique de « disant » serait maladroite.
- source_word: וְעַתָּה
  choice: À présent
  rationale: Conserve le marqueur discursif de la correspondance royale dans un registre digne et actuel.
- source_word: כְּבוֹא הַסֵּפֶר הַזֶּה אֵלֶיךָ
  choice: quand cette lettre te parviendra
  rationale: L’infinitif construit précédé de כְּ a une valeur temporelle. « Parviendra » convient naturellement à une lettre adressée à un destinataire.
- source_word: הִנֵּה
  choice: voici que
  rationale: Conserve la fonction présentative et emphatique de la particule hébraïque tout en restant idiomatique dans une lettre royale.
- source_word: שָׁלַחְתִּי
  choice: je t’ai envoyé
  rationale: Le parfait présente l’envoi comme accompli au moment où le destinataire lit la lettre.
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Translittération française usuelle du nom propre.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: עֶבֶד peut désigner un esclave, un serviteur ou un subordonné royal. « Serviteur » préserve cette latitude sans imposer un statut plus précis.
- source_word: וַאֲסַפְתּוֹ
  choice: afin que tu le guérisses
  rationale: Avec מִן et le nom de la maladie, אסף forme ici une expression inhabituelle dont le sens contextuel est la suppression de l’affection. Une traduction littérale par « recueillir » serait incompréhensible en français; la note conserve néanmoins l’image singulière de l’hébreu.
- source_word: מִצָּרַעְתּוֹ
  choice: de sa maladie de peau
  rationale: צָרַעַת recouvre dans la Bible hébraïque des affections plus larges que la maladie de Hansen moderne. « Maladie de peau » évite une précision médicale anachronique.
theological_decisions:
- issue: Portée de צָרַעַת
  choice: maladie de peau
  alternative: lèpre
  rationale: Le terme hébreu ne correspond pas exactement à la lèpre au sens médical moderne. Le texte principal emploie donc une désignation plus large, tandis que la note préserve le rendu traditionnel.
- issue: Expression וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ
  choice: afin que tu le guérisses de sa maladie de peau
  alternative: afin que tu le recueilles hors de sa maladie de peau
  rationale: Le sens demandé au roi d’Israël est bien la guérison, mais l’hébreu emploie le verbe concret « rassembler/recueillir ». Le français principal donne le sens contextuel et la note signale l’expression inhabituelle, sans lui attribuer une portée doctrinale particulière.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe de la correspondance royale reste légèrement soutenue (« À présent », « voici que »), tandis que « remettre la lettre » et « maladie de peau » demeurent immédiatement compréhensibles.
