base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/011.yaml
  text: But Naaman became angry and went away[a], and he said, “Look, I said to myself, ‘Surely he will come out to me and stand and call on the name of Yahweh his God[b], and wave his hand over the place and heal the leprous person.’”
translation:
  language: fr
  text: 'Mais Naamân se mit en colère et s’en alla. Puis il dit : « Je m’étais dit : “Il sortira certainement vers moi, se tiendra, invoquera le nom de Yahweh, son Dieu, agitera sa main au-dessus de l’endroit et guérira la personne atteinte d’une maladie de peau[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus traditionnellement, « guérira le lépreux ». Le terme hébreu désigne une personne touchée par une affection cutanée relevant de la catégorie biblique souvent appelée « lèpre », sans correspondre nécessairement à la maladie de Hansen.
    reason: Précision lexicale et médicale sur le terme dérivé de צרע.
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: se mit en colère
  rationale: Exprime naturellement l’entrée dans l’état de colère indiquée par le contexte narratif, sans en exagérer l’intensité.
- source_word: וַיֵּלַךְ
  choice: s’en alla
  rationale: Marque ici le départ irrité de Naamân plutôt qu’un simple déplacement.
- source_word: הִנֵּה אָמַרְתִּי אֵלַי
  choice: Je m’étais dit
  rationale: Rend idiomatiquement la parole intérieure introduite avec emphase; le plus-que-parfait situe cette attente avant la réaction présente.
- source_word: יֵצֵא יָצוֹא
  choice: Il sortira certainement
  rationale: L’adverbe « certainement » restitue l’intensification produite par l’infinitif absolu associé au verbe conjugué.
- source_word: וְקָרָא בְּשֵׁם
  choice: invoquera le nom de
  rationale: « Invoquer le nom de » rend précisément l’expression cultuelle hébraïque dans un français actuel et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu.
- source_word: וְהֵנִיף יָדוֹ
  choice: agitera la main
  rationale: Conserve le geste de mouvement ou d’ondulation exprimé par הניף, tel que Naamân l’imagine.
- source_word: אֶל הַמָּקוֹם
  choice: au-dessus de l’endroit atteint
  rationale: Dans ce contexte de geste curatif, « au-dessus de » est naturel; « atteint » explicite sobrement que הַמָּקוֹם désigne la zone malade.
- source_word: וְאָסַף הַמְּצֹרָע
  choice: guérira la personne atteinte d’une maladie de peau
  rationale: Le verbe אסף a ici le sens contextuel d’enlever l’affection, donc de guérir. Le terme substantivé peut désigner la personne atteinte; cette formulation évite d’identifier automatiquement l’affection biblique à la maladie de Hansen.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le caractère de nom propre sans ajouter une interprétation confessionnelle.
- issue: Référent de הַמְּצֹרָע
  choice: la personne atteinte d’une maladie de peau
  alternative: la maladie de peau / la lèpre
  rationale: La forme hébraïque peut être comprise comme désignant l’être atteint, tandis que le verbe signifie contextuellement l’enlèvement de son mal. La formulation choisie est naturelle et ne suppose pas un diagnostic médical moderne.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe directe garde l’irritation et l’attente emphatique de Naamân. « Se tiendra là » rend le geste attendu sans lourdeur; « maladie de peau » évite une identification médicale anachronique.
