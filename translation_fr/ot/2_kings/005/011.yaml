  to: 'Mais Naamân se mit en colère et s’en alla. Puis il dit : « Je m’étais dit : “Il sortira certainement vers moi, se tiendra, invoquera le nom de Yahweh, son Dieu, agitera sa main au-dessus de l’endroit et guérira la personne atteinte d’une maladie de peau[a].” »'
