base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/021.yaml
  text: So Gehazi pursued Naaman. When Naaman saw him running after him[a], he got down from the chariot to meet him and said, “Is all well?”
translation:
  language: fr
  text: 'Guéhazi poursuivit Naaman. Lorsque Naaman le vit courir derrière lui, il descendit de son char pour aller à sa rencontre et lui demanda : « Tout va bien[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie shalom, terme qui peut désigner la paix ou le bien-être ; il sert ici à demander si tout va bien.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: se lança à la poursuite de
  rationale: Le verbe רדף exprime une poursuite intentionnelle. Cette tournure française est naturelle dans le récit sans suggérer nécessairement une hostilité.
- source_word: וַיִּרְאֶה ... רָץ אַחֲרָיו
  choice: le vit courir derrière lui
  rationale: La formulation conserve la perception visuelle et l’action en cours, tout en évitant en français la répétition ambiguë de deux pronoms identiques.
- source_word: וַיִּפֹּל מֵעַל הַמֶּרְכָּבָה
  choice: il descendit de son char
  rationale: Bien que נפל signifie couramment « tomber », il décrit ici de manière idiomatique le fait de descendre d’un véhicule, sans qu’il s’agisse forcément d’une chute accidentelle.
- source_word: לִקְרָאתוֹ
  choice: pour aller à sa rencontre
  rationale: לקראת désigne le mouvement par lequel on va au-devant de quelqu’un; cette expression en rend clairement le sens.
- source_word: הֲשָׁלוֹם
  choice: Tout va bien ?
  rationale: שלום fonctionne ici comme une demande conventionnelle au sujet du bien-être ou de la situation. Cette question est concise et idiomatique en français moderne.
- source_word: וַ
  choice: donc / lorsque / et
  rationale: Les waw narratifs font progresser la succession des actions. Leur rendu varie selon la syntaxe naturelle du français afin de préserver un récit fluide.
