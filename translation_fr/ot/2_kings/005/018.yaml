  text: לַ/דָּבָ֣ר הַ/זֶּ֔ה יִסְלַ֥ח יְהוָ֖ה לְ/עַבְדֶּ֑/ךָ בְּ/ב֣וֹא אֲדֹנִ֣/י בֵית רִמּוֹן֩ לְ/הִשְׁתַּחֲוֺ֨ת שָׁ֜מָּ/ה וְ/ה֣וּא נִשְׁעָ֣ן עַל יָדִ֗/י וְ/הִֽשְׁתַּחֲוֵ֨יתִי֙ בֵּ֣ית רִמֹּ֔ן בְּ/הִשְׁתַּחֲוָיָ֨תִ/י֙ בֵּ֣ית רִמֹּ֔ן יִסְלַח נא יְהוָ֥ה לְ/עַבְדְּ/ךָ֖ בַּ/דָּבָ֥ר הַ/זֶּֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/018.yaml
  text: 'In this matter[a], may Yahweh pardon your servant: when my master goes into the house of Rimmon to bow down there, and he is leaning on my hand, so that I also bow down in the house of Rimmon—when I bow down in the house of Rimmon[b], may Yahweh please pardon your servant in this matter.'
translation:
  language: fr
  text: 'Que Yahweh pardonne à ton serviteur à ce sujet : lorsque mon maître entre dans le temple de Rimmon pour s’y prosterner[a], en s’appuyant sur mon bras, et que je me prosterne moi aussi dans le temple de Rimmon[b] — lorsque je me prosterne dans le temple de Rimmon, que Yahweh veuille bien pardonner à ton serviteur à ce sujet !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut signifier aussi bien « se prosterner » que « adorer » ou « rendre un culte ».
    reason: lexical_alternative
  - marker: b
    text: Le « temple de Rimmon » est le sanctuaire consacré à Rimmon, une divinité syrienne.
    reason: cultural_note
lexical_decisions:
- source_word: יִסְלַח
  choice: Que … pardonne / que … veuille bien pardonner
  rationale: La forme exprime ici une demande. « Pardonner » convient naturellement à la requête adressée à Dieu, tandis que « veuille bien » rend la nuance suppliante de נָא dans la seconde occurrence.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: לְעַבְדֶּךָ
  choice: à ton serviteur
  rationale: Dans cette formule respectueuse par laquelle Naaman parle de lui-même, « serviteur » est idiomatique et approprié au contexte.
- source_word: בְּבוֹא אֲדֹנִי
  choice: lorsque mon maître entre
  rationale: La construction infinitive marque la circonstance temporelle. « Mon maître » désigne le roi servi par Naaman et évite une confusion avec un titre divin.
- source_word: בֵית רִמּוֹן
  choice: le temple de Rimmon
  rationale: Littéralement « la maison de Rimmon » ; dans ce contexte cultuel, le français courant désigne naturellement cet édifice comme un temple.
- source_word: לְהִשְׁתַּחֲוֺת / וְהִשְׁתַּחֲוֵיתִי / בְּהִשְׁתַּחֲוָיָתִי
  choice: se prosterner / je me prosterne
  rationale: Le verbe décrit le geste de s’incliner profondément et peut aussi prendre le sens de rendre un culte. « Se prosterner » conserve ici la dimension corporelle sans trancher la question de l’intention intérieure de Naaman.
- source_word: נִשְׁעָן עַל יָדִי
  choice: en s’appuyant sur mon bras
  rationale: L’hébreu dit littéralement « sur ma main », mais l’expression française « s’appuyer sur mon bras » rend clairement et naturellement le geste de soutien physique.
- source_word: נָא
  choice: veuille bien
  rationale: Cette tournure française rend la particule de supplication avec dignité, sans lourdeur archaïque.
theological_decisions:
- issue: Le geste exprimé par הִשְׁתַּחֲוָה dans le temple d’une divinité étrangère est-il explicitement un acte d’adoration ?
  choice: se prosterner
  alternative: adorer / rendre un culte
  rationale: Le verbe hébreu peut désigner soit un geste corporel, soit l’adoration. Le contexte montre que Naaman accomplira extérieurement ce geste en soutenant son maître, mais ne précise pas directement son intention intérieure. La traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition insistante du texte hébreu est conservée. « Temple » explicite naturellement la fonction cultuelle de בֵית (« maison »), tandis que « se prosterner » maintient l’ambiguïté voulue entre geste corporel et acte religieux.
