revisions:
- from: 'Que Yahweh pardonne ceci à ton serviteur : lorsque mon maître entre dans le temple de Rimmon pour s’y prosterner[a], en s’appuyant sur mon bras, et que je me prosterne moi aussi dans le temple de Rimmon[b] — lorsque je me prosterne dans le temple de Rimmon, que Yahweh veuille bien pardonner ceci à ton serviteur !'
  to: 'Que Yahweh pardonne à ton serviteur à ce sujet : lorsque mon maître entre dans le temple de Rimmon pour s’y prosterner[a], en s’appuyant sur mon bras, et que je me prosterne moi aussi dans le temple de Rimmon[b] — lorsque je me prosterne dans le temple de Rimmon, que Yahweh veuille bien pardonner à ton serviteur à ce sujet !'
  rationale: La révision corrige la relation syntaxique de la requête de pardon, sans modifier le sens du passage. Elle maintient la répétition rhétorique, la nuance suppliante de « veuille bien », l’ambiguïté du geste de prosternation et les deux ancres de notes.
