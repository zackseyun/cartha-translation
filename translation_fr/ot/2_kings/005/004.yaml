translation_notes:
  register: Français moderne, digne et accessible. La tournure évite un calque artificiel de l’idiome hébreu tout en en signalant la forme dans la note. Le pronom masculin reste non identifié dans la traduction afin de ne pas résoudre au-delà du texte immédiat l’identité de celui qui fait le rapport.
