  text: So he went in and told his master[a], saying, “Thus and thus spoke the girl who is from the land of Israel.”
translation:
  language: fr
  text: 'Il alla trouver son maître et lui rapporta : « La jeune fille qui est du pays d’Israël a dit ceci et cela[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ainsi et ainsi » ou « ceci et cela » ; expression hébraïque qui résume les paroles sans les répéter mot à mot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Il alla trouver
  rationale: בוא peut signifier venir, aller ou entrer selon le point de vue. Ici, « alla trouver » exprime naturellement le déplacement vers le supérieur auquel le rapport est adressé, sans imposer l’idée d’une entrée physique que le contexte ne précise pas.
- source_word: וַיַּגֵּד
  choice: lui rapporta
  rationale: Le hiphil de נגד signifie faire savoir, raconter ou rapporter. « Rapporta » convient au contexte officiel et évite la lourdeur de deux verbes de parole successifs.
- source_word: לַאדֹנָיו
  choice: son maître
  rationale: אָדוֹן désigne un seigneur ou maître. « Son maître » conserve ici la relation hiérarchique exprimée par l’hébreu sans identifier explicitement le personnage.
- source_word: לֵאמֹר
  choice: introduit par les deux-points
  rationale: La formule hébraïque introduit le discours rapporté. En français moderne, les deux-points remplissent naturellement cette fonction sans calque pesant comme « en disant ».
- source_word: כָּזֹאת וְכָזֹאת
  choice: Voilà, en substance
  rationale: L’expression idiomatique résume les paroles prononcées sans les répéter mot à mot. « En substance » en restitue clairement la fonction en français courant, tandis qu’une note conserve la forme littérale.
- source_word: דִּבְּרָה
  choice: a dit
  rationale: דבר est le verbe courant pour parler. Le passé composé est naturel dans ce rapport narratif en français moderne.
- source_word: הַנַּעֲרָה
  choice: la jeune fille
  rationale: נַעֲרָה peut désigner une fille ou une jeune femme. « La jeune fille » rend directement le terme sans ajouter ici son statut de servante captive, connu par le contexte mais non exprimé dans ce mot.
- source_word: אֲשֶׁר מֵאֶרֶץ יִשְׂרָאֵל
  choice: qui vient du pays d’Israël
  rationale: Cette formulation conserve la proposition relative et rend explicitement אֶרֶץ par « pays », dans un français naturel.
