  text: וַ/יֹּ֣אמֶר שָׁל֗וֹם אֲדֹנִ/י֮ שְׁלָחַ֣/נִי לֵ/אמֹר֒ הִנֵּ֣ה עַתָּ֡ה זֶ֠ה בָּ֣אוּ אֵלַ֧/י שְׁנֵֽי נְעָרִ֛ים מֵ/הַ֥ר אֶפְרַ֖יִם מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים תְּנָ/ה נָּ֤א לָ/הֶם֙ כִּכַּר כֶּ֔סֶף וּ/שְׁתֵּ֖י חֲלִפ֥וֹת בְּגָדִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/022.yaml
  text: And he said[a], “All is well. My master has sent me to say, ‘Look, just now two young men from the hill country of Ephraim, from among the sons of the prophets, have come to me[c][b]. Please give them a talent of silver and two changes of clothes.’”
translation:
  language: fr
  text: 'Il répondit : « Tout va bien.[a] Mon maître m’a envoyé te dire : “Deux jeunes hommes viennent justement d’arriver chez moi, de la région montagneuse d’Éphraïm ; ils font partie des fils des prophètes.[b] Donne-leur, je te prie, un talent d’argent[c] et deux changements de vêtements.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Paix » ou « Cela va bien ». Ici, le mot hébreu sert à rassurer : il n’y a rien qui ne va pas.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « fils des prophètes » désigne les membres d’une communauté de prophètes.
    reason: cultural_note
  - marker: c
    text: Le talent était une importante unité de poids employée pour les métaux précieux.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Tout va bien
  rationale: 'Dans ce dialogue, shalom sert à rassurer Naamân : rien de fâcheux ne s’est produit. Cette formulation idiomatique convient mieux que le littéral « Paix ».'
- source_word: אֲדֹנִי
  choice: mon maître
  rationale: Guéhazi parle d’Élisée dans le cadre d’une relation de serviteur à maître ; « maître » est naturel et n’introduit pas de connotation divine.
- source_word: שְׁלָחַנִי
  choice: m’envoie
  rationale: Le parfait hébreu exprime un envoi déjà effectué dont la portée demeure présente. En français direct, le présent « m’envoie te dire » rend naturellement cette actualité.
- source_word: הִנֵּה עַתָּה זֶה
  choice: viennent justement d’arriver
  rationale: Le groupe attire l’attention sur le caractère tout récent de l’arrivée. L’intégrer au verbe évite un « Voici » lourd tout en conservant l’immédiateté.
- source_word: נְעָרִים
  choice: jeunes hommes
  rationale: Le terme peut désigner des garçons, de jeunes hommes ou des serviteurs. Leur appartenance au groupe prophétique favorise ici le sens non servile « jeunes hommes ».
- source_word: מֵהַר אֶפְרַיִם
  choice: de la région montagneuse d’Éphraïm
  rationale: L’expression désigne généralement les hautes terres d’Éphraïm, et non une montagne isolée.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: ils font partie des fils des prophètes
  rationale: La formulation garde l’expression technique et culturellement marquée de l’hébreu, tandis que la syntaxe française en rend clairement le sens d’appartenance.
- source_word: תְּנָה נָּא
  choice: Donne-leur, je te prie
  rationale: L’impératif accompagné de נָא constitue une requête polie ; « je te prie » préserve ce ton dans un registre narratif digne.
- source_word: כִּכַּר כֶּסֶף
  choice: un talent d’argent
  rationale: Le talent est ici une unité de poids appliquée à l’argent métal. Le terme traditionnel est précis, avec une note explicative pour les lecteurs modernes.
- source_word: חֲלִפוֹת בְּגָדִים
  choice: tenues de rechange
  rationale: L’expression désigne deux ensembles complets de vêtements destinés à remplacer ceux que l’on porte ; « tenues de rechange » est clair et naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct reste fluide sans archaïsmes. Le vouvoiement n’est pas employé afin de refléter la forme verbale hébraïque au singulier et les usages du récit biblique en français ; « je te prie » maintient néanmoins la politesse de la demande.
