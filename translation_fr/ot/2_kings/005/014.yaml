base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/014.yaml
  text: So he went down and dipped himself in the Jordan seven times[a], according to the word of the man of God; and his flesh was restored like the flesh of a little boy[b], and he was cleansed.
translation:
  language: fr
  text: Il descendit donc et se plongea sept fois[a] dans le Jourdain, conformément à la parole de l’homme de Dieu. Sa chair redevint semblable à celle d’un petit garçon, et il devint pur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’immergea ». Le verbe hébreu peut désigner l’action de plonger ou de s’immerger.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il fut purifié ». L’hébreu peut exprimer ici l’accès à un état de pureté ou le résultat d’une purification.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Il descendit donc
  rationale: Le verbe conserve le mouvement concret de la descente, tandis que « donc » exprime naturellement le lien de conséquence avec les instructions précédentes.
- source_word: וַיִּטְבֹּל
  choice: se plongea
  rationale: Le verbe טבל désigne l’action de plonger ou d’immerger. La tournure pronominale convient au sujet qui accomplit lui-même l’action sans préciser davantage sa modalité.
- source_word: בַּיַּרְדֵּן
  choice: dans le Jourdain
  rationale: Cette forme française usuelle conserve le nom propre du fleuve sans ajout explicatif inutile.
- source_word: שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: Traduction directe et idiomatique de l’expression de répétition.
- source_word: כִּדְבַר
  choice: conformément à la parole de
  rationale: דבר peut désigner une parole ou une instruction. Cette formulation conserve « parole » tout en indiquant que Naaman agit en accord avec ce qui lui a été dit.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Traduction consacrée et littérale de ce titre prophétique, qui en préserve la portée théologique.
- source_word: וַיָּשָׁב בְּשָׂרוֹ
  choice: Sa chair redevint
  rationale: שׁוב exprime ici un retour à un état antérieur. « Chair » maintient l’image corporelle concrète de בשר, et « redevint » rend naturellement le résultat.
- source_word: כִּבְשַׂר נַעַר קָטֹן
  choice: semblable à celle d’un petit garçon
  rationale: Le pronom « celle » évite en français une répétition lourde de « chair », tandis que « petit garçon » rend l’association de נער et קטן et conserve la vivacité de la comparaison.
- source_word: וַיִּטְהָר
  choice: il fut purifié
  rationale: טהר exprime l’accès à l’état de pureté. « Fut purifié » conserve à la fois le résultat concret de la guérison et les résonances de pureté, sans réduire le propos à une catégorie uniquement médicale.
theological_decisions:
- issue: Nature du rétablissement de Naaman
  choice: Décrire à la fois la restauration corporelle et la purification
  alternative: Employer seulement un terme médical tel que « guéri », ou ne décrire qu’un état de pureté
  rationale: L’hébreu associe explicitement le rétablissement de la chair à l’accès à la pureté. La traduction maintient ces deux dimensions sans leur imposer une lecture sacramentelle, typologique ou strictement médicale.
- issue: Valeur de וַיִּטְהָר
  choice: il fut purifié
  alternative: il devint pur
  rationale: La forme hébraïque peut être exprimée en français comme un résultat de purification ou comme l’entrée dans un état de pureté. Le texte principal privilégie une formulation événementielle, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le mouvement narratif de l’hébreu tout en restant naturelle en français. Le point sépare les deux étapes du récit pour éviter une phrase excessivement chargée.
