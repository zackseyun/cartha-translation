  - severity: low
    issue: « mit deux talents d’argent dans deux sacs » atténue l’action exprimée par וַיָּצַר.
    rationale: Le verbe indique que l’argent est lié, emballé ou ficelé ; « empaqueta » rend cette action sans imposer une technique trop précise.
