  text: וַ/יֹּ֣אמֶר נַעֲמָ֔ן הוֹאֵ֖ל קַ֣ח כִּכָּרָ֑יִם וַ/יִּפְרָץ בּ֗/וֹ וַ/יָּצַר֩ כִּכְּרַ֨יִם כֶּ֜סֶף בִּ/שְׁנֵ֣י חֲרִטִ֗ים וּ/שְׁתֵּי֙ חֲלִפ֣וֹת בְּגָדִ֔ים וַ/יִּתֵּן֙ אֶל שְׁנֵ֣י נְעָרָ֔י/ו וַ/יִּשְׂא֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/023.yaml
  text: Naaman said[a], “Please, take two talents.” And he urged him, and tied up two talents of silver in two bags, with two changes of clothes, and gave them to two of his servants[c][b], and they carried them before him.
translation:
  language: fr
  text: 'Naaman dit : « Je t’en prie, accepte deux talents[a]. » Il insista auprès de lui et empaqueta deux talents d’argent dans deux sacs, avec deux tenues de rechange. Puis il remit le tout à deux de ses serviteurs, qui le portèrent devant Guéhazi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le talent était une grande unité de poids. Son poids exact varie selon l’étalon retenu ; deux talents représentaient plusieurs dizaines de kilogrammes d’argent.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « devant lui », c’est-à-dire devant Guéhazi.'
    reason: referent_clarification
lexical_decisions:
- source_word: הוֹאֵל קַח
  choice: Accepte donc
  rationale: L’expression associe une particule de courtoisie ou d’exhortation à l’impératif « prendre ». Dans ce contexte de don, « accepte donc » rend naturellement l’invitation insistante de Naaman.
- source_word: כִּכָּרָיִם
  choice: deux talents
  rationale: Le talent est ici une unité de poids; le terme biblique traditionnel reste précis et reconnaissable, avec une note explicative.
- source_word: וַיִּפְרָץ בּוֹ
  choice: Il insista auprès de lui
  rationale: L’idiome exprime une pression insistante exercée sur Guéhazi afin qu’il accepte davantage que ce qu’il avait demandé.
- source_word: וַיָּצַר
  choice: mit … dans deux sacs
  rationale: Le verbe évoque l’action de serrer, envelopper ou attacher. Avec les sacs explicitement mentionnés, cette formulation française décrit clairement l’opération sans surspécifier sa forme.
- source_word: חֲרִטִים
  choice: sacs
  rationale: Le mot désigne des contenants destinés à l’argent ou aux objets précieux; « sacs » est clair et suffisamment général.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: deux tenues de rechange
  rationale: L’expression désigne deux ensembles de vêtements; « tenues de rechange » est naturel en français moderne.
- source_word: שְׁנֵי נְעָרָיו
  choice: deux de ses serviteurs
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un assistant. Leur fonction de porteurs au service de Naaman justifie ici « serviteurs ».
- source_word: וַיִּשְׂאוּ לְפָנָיו
  choice: qui les portèrent devant Guéhazi
  rationale: La préposition indique qu’ils marchaient devant la personne concernée. Le nom « Guéhazi », explicité d’après le contexte immédiat, évite l’ambiguïté du pronom français.
