base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/016.yaml
  text: But he said[a], “As Yahweh lives, before whom I stand, I will not take it.” And he urged him to take it[b], but he refused.
translation:
  language: fr
  text: 'Mais il répondit : « Aussi vrai que Yahweh est vivant, devant qui je me tiens[a], je n’accepterai rien[b]. » Naaman insista pour qu’il accepte, mais il refusa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en présence de qui je me tiens » ; l’expression peut aussi évoquer le service accompli auprès de Yahweh.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « si je prends ». Dans cette formule de serment, « si » exprime une forte négation : « je ne prendrai certainement rien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Cette formulation française naturelle conserve la solennité de la formule hébraïque de serment.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: lui devant qui je me tiens
  rationale: Cette traduction préserve l’image de la présence royale et le sens implicite du service prophétique sans réduire l’expression à une seule interprétation.
- source_word: אִם אֶקָּח
  choice: je n’accepterai rien
  rationale: Dans une formule de serment, אִם introduit ici une forte négation elliptique. « Accepter » exprime naturellement en français le refus du présent proposé.
- source_word: וַיִּפְצַר בּוֹ לָקַחַת
  choice: Naaman insista pour qu’il accepte
  rationale: פצר indique une pression insistante. Le nom « Naaman », clair d’après le contexte, évite en français une succession ambiguë de pronoms masculins.
- source_word: וַיְמָאֵן
  choice: mais il refusa
  rationale: Traduction directe et naturelle du refus ferme exprimé par מאן.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Sens de « se tenir devant » Yahweh
  choice: lui devant qui je me tiens
  alternative: que je sers
  rationale: La formulation retenue conserve à la fois l’image de la présence de Dieu et sa portée possible de service prophétique, sans expliciter exclusivement l’une ou l’autre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la solennité du serment tout en évitant l’archaïsme; les ambiguïtés de l’expression prophétique et de la formule hébraïque sont signalées en notes.
