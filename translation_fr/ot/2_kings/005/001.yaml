  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֠/נַעֲמָן שַׂר צְבָ֨א מֶֽלֶךְ אֲרָ֜ם הָיָ֣ה אִישׁ֩ גָּד֨וֹל לִ/פְנֵ֤י אֲדֹנָי/ו֙ וּ/נְשֻׂ֣א פָנִ֔ים כִּֽי ב֛/וֹ נָֽתַן יְהוָ֥ה תְּשׁוּעָ֖ה לַ/אֲרָ֑ם וְ/הָ/אִ֗ישׁ הָיָ֛ה גִּבּ֥וֹר חַ֖יִל מְצֹרָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/001.yaml
  text: Naaman[a], commander of the army of the king of Aram, was a great man before his master and highly esteemed, because through him Yahweh had given victory to Aram. The man was a mighty warrior[c][b], but he was leprous.
translation:
  language: fr
  text: Naaman, chef de l’armée du roi d’Aram[a], était un homme important aux yeux de son maître et jouissait d’une haute considération, car, par son intermédiaire, Yahweh avait donné la victoire[b] à Aram. Cet homme était un valeureux guerrier, mais il était lépreux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionnellement « Syrie »; l’hébreu porte « Aram », nom du royaume araméen.
    reason: alternative_reading
  - marker: b
    text: Ou « la délivrance », voire « le salut »; dans ce contexte, le mot hébreu désigne un succès militaire.
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu désigne une grave affection de la peau dans le monde ancien; il ne correspond pas nécessairement à la lèpre au sens médical moderne, appelée maladie de Hansen.
    reason: cultural_note
lexical_decisions:
- source_word: שַׂר צְבָא מֶלֶךְ אֲרָם
  choice: chef de l’armée du roi d’Aram
  rationale: שַׂר צְבָא désigne le commandant des forces militaires. « Chef de l’armée » est une formulation française claire et actuelle; « Aram » conserve le nom historique hébreu.
- source_word: הָיָה אִישׁ גָּדוֹל לִפְנֵי אֲדֹנָיו וּנְשֻׂא פָנִים
  choice: était un homme important aux yeux de son maître et jouissait d’une haute considération
  rationale: אִישׁ גָּדוֹל exprime ici le rang et l’importance sociale plutôt que la taille. לִפְנֵי et l’idiome נְשֻׂא פָנִים indiquent respectivement l’appréciation du souverain et l’honneur dont Naaman bénéficiait.
- source_word: כִּי בוֹ נָתַן יְהוָה תְּשׁוּעָה לַאֲרָם
  choice: car, par son intermédiaire, Yahweh avait donné la victoire à Aram
  rationale: בוֹ a ici une valeur instrumentale. תְּשׁוּעָה peut signifier salut, délivrance ou victoire; le contexte militaire favorise « victoire ». Le plus-que-parfait convient à l’antériorité de ces succès par rapport au statut décrit.
- source_word: גִּבּוֹר חַיִל
  choice: un valeureux guerrier
  rationale: Dans ce contexte militaire, l’expression évoque la force et la vaillance éprouvées. Cette traduction reste idiomatique sans perdre la dimension martiale.
- source_word: מְצֹרָע
  choice: lépreux
  rationale: Le terme désigne une personne atteinte de צָרַעַת. « Lépreux » maintient le lien lexical traditionnel, tandis qu’une note avertit que le diagnostic ancien ne correspond pas nécessairement à la maladie de Hansen.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom divin personnel plutôt que de lui substituer un titre.
- issue: Yahweh accorde une victoire à une nation étrangère
  choice: Yahweh avait donné la victoire à Aram
  alternative: Yahweh avait délivré Aram
  rationale: L’hébreu attribue directement à Yahweh le succès militaire d’Aram. La traduction conserve sans l’atténuer cette affirmation de sa souveraineté au-delà d’Israël.
translation_notes:
  register: 'Français international moderne, digne et accessible. La formulation conserve la structure rhétorique du verset: prestige social et valeur militaire de Naaman, suivis du contraste abrupt introduit par « mais ». Les termes de cour sont rendus naturellement sans archaïsme.'
