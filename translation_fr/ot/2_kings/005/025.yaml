base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/025.yaml
  text: But he went in and stood before his master[a], and Elisha said to him, “Where have you been, Gehazi?” And he said[b], “Your servant did not go anywhere.”
translation:
  language: fr
  text: 'Mais Guéhazi vint et se tint devant son maître. Élisée lui demanda : « D’où viens-tu, Guéhazi ? » Il répondit : « Ton serviteur n’est allé nulle part[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ton serviteur n’est allé ni ici ni là. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא בָא
  choice: Mais Guéhazi entra
  rationale: Le וְ ouvre ici un contraste léger avec les actes secrets qui précèdent. בָא signifie littéralement « vint », mais le contexte implique l’entrée de Guéhazi auprès d’Élisée; « entra » l’exprime naturellement en français. Le nom explicite évite l’ambiguïté du pronom en français.
- source_word: וַיַּעֲמֹד אֶל אֲדֹנָיו
  choice: se tint devant son maître
  rationale: La tournure décrit Guéhazi se présentant ou se tenant au service de son supérieur. « Se tint devant » conserve la forme narrative et la relation sociale sans donner à אֲדֹנָיו un sens divin.
- source_word: מֵאָן גֵּחֲזִי
  choice: D’où viens-tu, Guéhazi ?
  rationale: מֵאָן demande littéralement « d’où ? ». Cette formulation française est à la fois naturelle et proche de l’interrogation hébraïque, sans ajouter explicitement « où étais-tu ? ».
- source_word: לֹא הָלַךְ עַבְדְּךָ
  choice: Ton serviteur n’est allé
  rationale: La désignation respectueuse de soi à la troisième personne est conservée, car elle caractérise la réponse déférente de Guéhazi.
- source_word: אָנֶה וָאָנָה
  choice: nulle part
  rationale: L’expression idiomatique signifie littéralement « ici ou là / d’un côté ou de l’autre ». « Nulle part » rend clairement et naturellement la portée générale de la négation en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre biblique littéraire sans archaïsme marqué. La répétition de « Guéhazi » clarifie le sujet, tandis que « ton serviteur » préserve la déférence sociale de l’hébreu.
