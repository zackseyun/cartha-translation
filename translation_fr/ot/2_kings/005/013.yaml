  to: 'Alors ses serviteurs s’approchèrent de lui et lui dirent : « Mon père, si le prophète t’avait demandé une grande chose, ne l’aurais-tu pas faite ? À plus forte raison le ferais-tu quand il te dit : “Lave-toi et sois pur[a] !” »'
