  yaml_path: translation/ot/2_kings/005/013.yaml
  text: Then his servants came near and spoke to him and said[a], “My father, if the prophet had spoken to you some great thing, would you not do it? How much more, then, when he says to you, ‘Wash, and be clean’?”
translation:
  language: fr
  text: 'Alors ses serviteurs s’approchèrent de lui et lui dirent : « Mon père, si le prophète t’avait demandé une grande chose, ne l’aurais-tu pas faite ? À plus forte raison le ferais-tu quand il te dit : “Lave-toi et sois pur[a] !” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sois purifié ». L’hébreu peut évoquer le fait de devenir pur ou d’être purifié.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיִּגְּשׁוּ עֲבָדָיו
  choice: ses serviteurs s’approchèrent de lui
  rationale: נגשׁ exprime l’action de s’approcher, tandis que עבד désigne ici les subordonnés de Naaman. « Serviteurs » convient au contexte sans préciser indûment leur statut juridique.
- source_word: אָבִי
  choice: Mon père
  rationale: Cette appellation respectueuse adressée par des subordonnés à leur supérieur conserve la métaphore hébraïque sans suggérer une filiation réelle.
- source_word: דָּבָר גָּדוֹל
  choice: quelque chose de difficile
  rationale: Dans ce raisonnement qui oppose une exigence importante à l’ordre très simple de se laver, l’expression désigne vraisemblablement une tâche considérable ou exigeante plutôt qu’une chose seulement prestigieuse.
- source_word: הֲלוֹא תַעֲשֶׂה
  choice: ne l’aurais-tu pas fait ?
  rationale: La particule הֲלוֹא introduit une question rhétorique qui attend une réponse affirmative. Le conditionnel passé est naturel en français dans cette proposition hypothétique.
- source_word: וְאַף כִּי
  choice: À plus forte raison
  rationale: Cette locution rend l’argument hébreu allant du plus exigeant au plus simple.
- source_word: רְחַץ
  choice: Lave-toi
  rationale: Impératif direct et naturel qui reprend fidèlement l’ordre du prophète.
- source_word: וּטְהָר
  choice: et sois pur
  rationale: טהר peut exprimer le fait de devenir pur ou propre. « Sois pur » conserve la résonance à la fois physique et liée à la pureté, sans réduire le propos à une simple toilette.
theological_decisions:
- issue: Nuance de טהר dans la guérison de Naaman
  choice: et sois pur
  alternative: et sois purifié ; et deviens pur
  rationale: Le récit concerne la guérison d’une affection cutanée tout en employant le vocabulaire de la pureté. La formulation retenue maintient ces deux dimensions sans importer une interprétation théologique ultérieure.
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement correspond à l’adresse directe de serviteurs à Naaman en hébreu et demeure naturel dans la citation. « Mon père » conserve la déférence de l’expression originale.
