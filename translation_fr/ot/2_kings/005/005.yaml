translation_notes:
  register: Français international moderne, digne et accessible. Le discours royal reste direct. Le nom « Naaman », explicite dans le contexte immédiat mais seulement sous-entendu par les verbes hébreux de ce verset, est employé pour éviter une succession de pronoms ambiguë en français.
