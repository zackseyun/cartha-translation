source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ אֲרָם֙ לֶךְ בֹּ֔א וְ/אֶשְׁלְחָ֥ה סֵ֖פֶר אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל וַ/יֵּלֶךְ֩ וַ/יִּקַּ֨ח בְּ/יָד֜/וֹ עֶ֣שֶׂר כִּכְּרֵי כֶ֗סֶף וְ/שֵׁ֤שֶׁת אֲלָפִים֙ זָהָ֔ב וְ/עֶ֖שֶׂר חֲלִיפ֥וֹת בְּגָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/005.yaml
  text: Then the king of Aram said, “Go, come, and I will send a letter to the king of Israel.” So he went and took in his hand ten talents of silver, six thousand pieces of gold, and ten changes of clothing.
translation:
  language: fr
  text: 'Le roi d’Aram lui dit : « Va donc[a] ! J’enverrai une lettre au roi d’Israël. » Naaman partit, emportant avec lui dix talents d’argent, six mille pièces d’or[b] et dix tenues de rechange.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Va, viens ». Les deux impératifs expriment probablement ici une permission ou un encouragement pressant.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte simplement « six mille [d’]or » ; l’unité comptée n’est pas précisée.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ בֹּא
  choice: Va donc !
  rationale: Les deux impératifs hébreux, littéralement « va, viens », forment ici une expression idiomatique d’autorisation et d’encouragement. « Va donc ! » en restitue naturellement la force en français, tandis qu’une note conserve la forme inhabituelle de l’hébreu.
- source_word: סֵפֶר
  choice: une lettre
  rationale: Dans cet échange diplomatique entre rois, le terme désigne une communication écrite ; « lettre » est précis et naturel.
- source_word: בְּיָדוֹ
  choice: emportant avec lui
  rationale: Littéralement « dans sa main », l’expression indique ici que Naaman prend ces biens avec lui. La formulation française évite un littéralisme peu naturel sans modifier le sens.
- source_word: כִּכְּרֵי כֶסֶף
  choice: talents d’argent
  rationale: Le talent est une ancienne unité de poids. La conserver évite une conversion moderne incertaine.
- source_word: שֵׁשֶׁת אֲלָפִים זָהָב
  choice: six mille pièces d’or
  rationale: L’hébreu dit seulement « six mille [d’]or », sans nommer l’unité comptée. « Pièces » rend la phrase lisible, mais l’ajout est signalé en note afin de ne pas donner une précision absente du texte source.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: tenues de rechange
  rationale: L’expression désigne des ensembles de vêtements permettant de changer de tenue, vraisemblablement destinés à servir de présents.
- source_word: מֶלֶךְ אֲרָם
  choice: le roi d’Aram
  rationale: « Aram » reprend directement le nom hébreu et évite de le remplacer par l’appellation géographique plus tardive « Syrie ».
