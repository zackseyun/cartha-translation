source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו אֱלִישָׁ֖ע מַלְאָ֣ךְ לֵ/אמֹ֑ר הָל֗וֹךְ וְ/רָחַצְתָּ֤ שֶֽׁבַע פְּעָמִים֙ בַּ/יַּרְדֵּ֔ן וְ/יָשֹׁ֧ב בְּשָׂרְ/ךָ֛ לְ/ךָ֖ וּ/טְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/010.yaml
  text: So Elisha sent a messenger to him[a], saying, “Go and wash in the Jordan seven times, and your flesh will be restored to you[b], and you will be clean.”
translation:
  language: fr
  text: 'Alors Élisée lui envoya un messager pour lui dire : « Va te laver sept fois dans le Jourdain. Ta chair redeviendra saine[a] et tu seras pur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ta chair reviendra à toi ». Cet idiome hébreu exprime le retour à un état sain.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu seras purifié ». Le verbe peut désigner le fait de devenir propre ou pur et possède ici des résonances à la fois physiques et rituelles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Alors … envoya
  rationale: Le verbe שׁלח signifie ici « envoyer ». « Alors » rend naturellement la progression narrative marquée par וַ־, sans surcharger le lien logique.
- source_word: אֵלָיו
  choice: lui
  rationale: Le pronom renvoie à Naaman dans le contexte ; « lui envoya » est la formulation française naturelle.
- source_word: מַלְאָךְ
  choice: messager
  rationale: Dans cette scène, il s’agit clairement d’un intermédiaire humain et non d’un ange.
- source_word: לֵאמֹר
  choice: pour lui dire
  rationale: Cette tournure rend naturellement en français la formule hébraïque qui introduit les paroles rapportées.
- source_word: הָלוֹךְ וְרָחַצְתָּ
  choice: Va te laver
  rationale: L’infinitif absolu suivi du verbe conjugué a ici une valeur impérative. La forme pronominale « te laver » convient à l’action accomplie sur soi.
- source_word: שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: Équivalent direct et naturel de l’expression numérique hébraïque.
- source_word: בַּיַּרְדֵּן
  choice: dans le Jourdain
  rationale: Le nom traditionnel du fleuve suffit en français, comme le simple nom avec article en hébreu.
- source_word: וְיָשֹׁב בְּשָׂרְךָ לְךָ
  choice: Ta chair redeviendra saine
  rationale: Le sens premier est que la chair « reviendra » à Naaman, idiome exprimant son rétablissement. La formulation choisie communique clairement le retour à l’état sain tout en conservant le terme concret « chair ».
- source_word: וּטְהָר
  choice: tu seras pur
  rationale: Le verbe טהר indique le fait de devenir propre ou pur. « Tu seras pur » conserve en français les résonances physiques et rituelles du terme sans le réduire explicitement à la guérison.
theological_decisions:
- issue: Faut-il traduire בָּשָׂר par « chair », « peau » ou « corps » ?
  choice: chair
  alternative: peau ; corps
  rationale: « Chair » correspond au terme hébreu concret et préserve son image corporelle. « Peau » serait plus précis que le texte source, tandis que « corps » en atténuerait la force.
- issue: Faut-il rendre טהר par un vocabulaire de guérison ou de purification ?
  choice: tu seras pur
  alternative: tu seras guéri ; tu seras purifié
  rationale: Le contexte concerne une affection corporelle, mais le verbe porte aussi des résonances de pureté. « Tu seras pur » maintient cette tension au lieu de trancher exclusivement en faveur de la guérison physique ou de la purification rituelle.
translation_notes:
  register: Français international moderne, simple et digne. L’ordre bref des instructions est conservé, ainsi que le vocabulaire concret de la « chair » et l’ambivalence de « pur ».
