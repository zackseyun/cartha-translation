  yaml_path: translation/ot/2_kings/005/009.yaml
  text: So Naaman came with his horses and chariots[a], and stood at the entrance of Elisha’s house.
translation:
  language: fr
  text: Naaman vint avec ses chevaux et ses chars[a], et se tint à l’entrée de la maison d’Élisée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « avec son cheval et avec son char » ; les singuliers ont probablement ici un sens collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint
  rationale: Dans cette séquence narrative, בוא décrit simplement l’arrivée de Naaman auprès d’Élisée. « Vint » conserve le mouvement du récit sans ajouter la nuance plus explicite de « arriva ».
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Le nom propre est rendu selon sa forme française biblique courante.
- source_word: בְּסוּסוֹ
  choice: avec ses chevaux
  rationale: Bien que la forme hébraïque soit au singulier avec suffixe (« avec son cheval »), le nom peut avoir ici une valeur collective, naturelle dans le contexte de l’escorte prestigieuse de Naaman.
- source_word: וּבְרִכְבּוֹ
  choice: et ses chars
  rationale: רֶכֶב peut désigner collectivement les chars. Le pluriel français s’accorde avec la scène d’une suite militaire, tout en signalant en note le singulier morphologique de l’hébreu.
- source_word: וַיַּעֲמֹד
  choice: il s’arrêta
  rationale: עמד signifie littéralement « se tenir debout », mais décrit ici Naaman qui s’immobilise devant la maison. « Il s’arrêta » est naturel en français et conserve l’image de son arrivée solennelle sans suggérer qu’il entre.
- source_word: פֶּתַח הַבַּיִת
  choice: à l’entrée de la maison
  rationale: פֶּתַח désigne l’ouverture ou l’entrée. « À l’entrée » est précis et idiomatique en français moderne.
- source_word: לֶאֱלִישָׁע
  choice: d’Élisée
  rationale: 'Dans cette construction, ל marque l’appartenance ou l’association : il s’agit de la maison d’Élisée.'
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation garde la sobriété narrative du texte hébreu. « Élisée » suit l’usage français traditionnel, tandis que les pluriels « chevaux » et « chars » rendent probablement la valeur collective des singuliers hébreux.
