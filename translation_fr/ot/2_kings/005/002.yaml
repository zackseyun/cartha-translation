  source_fidelity: 'La structure essentielle est bien comprise : des groupes araméens prennent une jeune Israélite captive, qui est ensuite affectée auprès de la femme de Naaman. Toutefois, « en expédition » précise le mouvement de sortie d’une manière non explicitement formulée, et « se retrouva » ajoute une nuance circonstancielle absente de l’hébreu. « Petite fille » rend plus directement נַעֲרָה קְטַנָּה, y compris sa petitesse.'
  naturalness: Le français est globalement naturel. « Elle était au service de la femme de Naaman » est plus direct, idiomatique et narrativement sobre que « Elle se retrouva au service de ».
  terminology: « Araméennes », « pays d’Israël », « captive » et « la femme de Naaman » sont appropriés. Les notes conservent utilement l’alternative et l’explication de l’expression idiomatique לִפְנֵי.
