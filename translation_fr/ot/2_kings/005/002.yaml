  text: וַ/אֲרָם֙ יָצְא֣וּ גְדוּדִ֔ים וַ/יִּשְׁבּ֛וּ מֵ/אֶ֥רֶץ יִשְׂרָאֵ֖ל נַעֲרָ֣ה קְטַנָּ֑ה וַ/תְּהִ֕י לִ/פְנֵ֖י אֵ֥שֶׁת נַעֲמָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/002.yaml
  text: Bands of Arameans had gone out and taken captive from the land of Israel a small girl[b][a], and she served before Naaman’s wife.
translation:
  language: fr
  text: Des bandes araméennes étaient sorties et avaient emmené captive du pays d’Israël une petite fille[a]. Elle était au service de la femme de Naaman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une toute jeune fille ». L’expression hébraïque souligne son jeune âge et sa petitesse.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « elle fut devant la femme de Naaman », c’est-à-dire qu’elle était à son service.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרָם ... גְדוּדִים
  choice: Des bandes araméennes
  rationale: Le nom collectif « Aram », suivi d’un verbe au pluriel et de גְדוּדִים, désigne ici des groupes armés araméens. Cette formulation rend explicitement les agents humains sans confondre le peuple avec le territoire.
- source_word: יָצְאוּ
  choice: étaient parties en expédition
  rationale: Le parfait présente une action d’arrière-plan antérieure à la capture. « Partir en expédition » convient à des bandes armées et reste moins chargé que « partir piller ».
- source_word: וַיִּשְׁבּוּ
  choice: avaient emmené captive
  rationale: Le verbe signifie prendre et conduire quelqu’un en captivité, nuance plus précise que le simple fait de capturer.
- source_word: מֵאֶרֶץ יִשְׂרָאֵל
  choice: du pays d’Israël
  rationale: Cette expression conserve la référence géographique explicite de l’hébreu tout en restant naturelle en français.
- source_word: נַעֲרָה קְטַנָּה
  choice: une toute jeune fille
  rationale: La combinaison souligne la jeunesse et la petitesse de la fille. « Toute jeune fille » exprime naturellement son très jeune âge sans lui attribuer d’emblée un statut de servante.
- source_word: וַתְּהִי לִפְנֵי
  choice: Elle se retrouva au service de
  rationale: Littéralement « elle fut devant », tournure qui décrit ici une fonction d’assistance ou de service personnel. « Se retrouva » rend aussi naturellement le changement de situation consécutif à sa capture.
- source_word: אֵשֶׁת נַעֲמָן
  choice: la femme de Naaman
  rationale: Cette formulation française rend directement la relation exprimée par l’état construit hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Araméennes » conserve la désignation historique du texte. Les plus-que-parfaits marquent l’arrière-plan narratif, puis la seconde phrase met en relief la nouvelle condition de la jeune captive.
