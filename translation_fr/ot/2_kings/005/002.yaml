    rationale: Le contexte et גְּדוּדִים permettent de comprendre des bandes de raid, mais יָצְאוּ signifie d’abord « sortir / partir ». Une formulation non interprétative préserve mieux le degré de précision du texte source.
  - severity: low
    issue: « se retrouva » ajoute une nuance de situation subie ou fortuite.
    rationale: La captivité rend cette nuance compréhensible, mais וַתְּהִי énonce simplement qu’elle fut/était auprès de la femme de Naaman, dans une fonction de service.
  - severity: low
    issue: « toute jeune fille » met l’accent sur l’âge sans rendre aussi directement la petitesse de קְטַנָּה.
    rationale: « Une petite fille » reproduit naturellement en français les deux aspects de l’expression tout en laissant la note signaler l’alternative.
