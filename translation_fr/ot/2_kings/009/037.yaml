  text: ו/הית נִבְלַ֣ת אִיזֶ֗בֶל כְּ/דֹ֛מֶן עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה בְּ/חֵ֣לֶק יִזְרְעֶ֑אל אֲשֶׁ֥ר לֹֽא יֹאמְר֖וּ זֹ֥את אִיזָֽבֶל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/037.yaml
  text: And Jezebel’s corpse will be like dung on the face of the field in the territory of Jezreel[a], so that they will not say, “This is Jezebel.”
translation:
  language: fr
  text: 'Le cadavre de Jézabel sera comme du fumier à la surface du champ, dans le domaine de Jizréel[a], si bien qu’on ne dira pas : « C’est Jézabel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la parcelle de Jizréel ». Le mot hébreu חֵלֶק peut désigner une étendue précise, un domaine ou une parcelle de terre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: sera
  rationale: Le parfait avec waw poursuit ici l’annonce prophétique précédente; le futur français en rend naturellement la portée.
- source_word: נִבְלַת אִיזֶבֶל
  choice: le cadavre de Jézabel
  rationale: « Cadavre » désigne directement un corps mort et conserve la dureté de l’image hébraïque.
- source_word: כְּדֹמֶן
  choice: comme du fumier
  rationale: דֹּמֶן désigne les excréments ou le fumier; « fumier » convient au contexte d’un champ tout en gardant le caractère dégradant de la comparaison.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: répandu à la surface du champ
  rationale: La locution signifie littéralement « sur la face du champ ». L’ajout de « répandu » explicite naturellement en français la dispersion impliquée par l’image, sans en modifier le sens.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: sur le territoire de Jizréel
  rationale: חֵלֶק peut désigner une portion, une parcelle ou une étendue de terre. « Territoire » reste naturel tout en laissant la variante plus étroite en note.
- source_word: אֲשֶׁר לֹא יֹאמְרוּ
  choice: si bien qu’on ne pourra pas dire
  rationale: 'Le relatif exprime ici le résultat: le corps sera à ce point dispersé ou méconnaissable qu’il ne pourra plus être identifié. Le pronom indéfini « on » rend naturellement le pluriel impersonnel hébreu.'
- source_word: זֹאת אִיזָבֶל
  choice: C’est Jézabel
  rationale: Cette formule française rend simplement l’identification déictique de l’hébreu.
