base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/011.yaml
  text: Then Jehu went out to the servants of his master, and one said to him, “Is everything well? Why did this madman come to you?” And he said to them, “You know the man and his talk.”
translation:
  language: fr
  text: 'Puis Jéhu sortit rejoindre les serviteurs de son maître. L’un d’eux lui demanda : « Tout va-t-il bien[a] ? Pourquoi ce fou[b] est-il venu te voir ? » Il leur répondit : « Vous connaissez l’homme et ses propos[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu demande littéralement : « Est-ce la paix ? »'
    reason: lexical_alternative
  - marker: b
    text: Ou « cet homme insensé ». Le mot hébreu est ici une désignation méprisante.
    reason: lexical_alternative
  - marker: c
    text: Ou « sa manière de parler ». Le terme hébreu peut désigner assez largement la parole ou le discours d’une personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנָיו
  choice: les serviteurs de son maître
  rationale: Cette expression conserve les termes généraux de l’hébreu sans préciser ici que le maître est le roi ni suggérer nécessairement une condition servile.
- source_word: וַיֹּאמֶר לוֹ
  choice: L’un d’eux lui demanda
  rationale: Le verbe hébreu est au singulier alors que le groupe précédent est pluriel ; la formulation française indique naturellement qu’un membre du groupe prend la parole.
- source_word: הֲשָׁלוֹם
  choice: Tout va-t-il bien ?
  rationale: Cette tournure française actuelle rend l’interrogation idiomatique sur la paix, le bien-être ou le bon déroulement des choses.
- source_word: הַמְשֻׁגָּע הַזֶּה
  choice: ce fou
  rationale: Le terme hébreu est une désignation masculine méprisante ; « ce fou » en préserve la brièveté et la charge insultante.
- source_word: מַדּוּעַ בָּא ... אֵלֶיךָ
  choice: Pourquoi ... est-il venu te voir ?
  rationale: « Venir te voir » exprime naturellement en français la venue de l’homme auprès de Jéhu, sans ajouter de motif précis.
- source_word: אַתֶּם יְדַעְתֶּם אֶת הָאִישׁ
  choice: Vous connaissez l’homme
  rationale: La formulation conserve la réponse évasive de Jéhu et le nom défini de l’hébreu.
- source_word: שִׂיחוֹ
  choice: ses propos
  rationale: « Propos » garde une portée assez large pour désigner ce que l’homme dit ou sa manière de parler, sans réduire le sens à un message précis ni imposer l’idée de divagation.
