review_pass:
  verdict: revise
  source_fidelity: 'La désignation généalogique hébraïque répète בן (« fils de ») : Jéhu est « fils de Josaphat, fils de Nimshi ». Rendre Nimshi par « petit-fils » impose une relation de grand-père à petit-fils que les généalogies bibliques peuvent ne pas préciser strictement. Le second וּבָאתָ requiert aussi une action de se rendre auprès de Jéhu, mieux rendue ici par « Va le voir » que par « Va vers lui ».'
  naturalness: Le français révisé reste moderne, clair et direct. « Va le voir » évite la répétition moins naturelle de « cherche » suivie de « va le trouver », tout en marquant le déplacement. « Chambre intérieure » exprime avec sobriété le cadre privé de l’expression hébraïque.
  terminology: Les formes françaises bibliques usuelles « Jéhu », « Josaphat » et « Nimshi » sont conservées. « Frères » maintient le terme source sans trancher son éventuelle extension aux compagnons. La note préserve la formulation imagée « une pièce dans une pièce ».
  issues:
  - severity: medium
    issue: « petit-fils de Nimshi » restreint indûment la chaîne généalogique.
    rationale: 'Le second בן doit être rendu littéralement par « fils de Nimshi » : l’hébreu généalogique peut employer « fils » avec une portée plus large et ne contraint pas ici la relation précise de petit-fils.'
  - severity: low
    issue: « Va vers lui » est moins idiomatique et moins directement lié à l’action de se rendre auprès de Jéhu.
    rationale: Le second בוא introduit l’approche de Jéhu avant de le faire se lever ; « Va le voir » le rend naturellement sans ajouter de détail spatial.
  revised_text: Quand tu seras arrivé là-bas, cherche Jéhu, fils de Josaphat, fils de Nimshi. Va le voir, fais-le se lever du milieu de ses frères et conduis-le dans une chambre intérieure[a].
  revised_footnotes:
