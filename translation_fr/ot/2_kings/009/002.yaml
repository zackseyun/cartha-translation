revisions:
- from: Quand tu seras arrivé là-bas, cherche Jéhu, fils de Josaphat et petit-fils de Nimshi. Va vers lui, fais-le se lever du milieu de ses frères et conduis-le dans une pièce retirée[a].
  to: Quand tu seras arrivé là-bas, cherche Jéhu, fils de Josaphat, fils de Nimshi. Va le voir, fais-le se lever du milieu de ses frères et conduis-le dans une chambre intérieure[a].
  rationale: La révision corrige l’inférence généalogique non justifiée de « petit-fils » et améliore le rendu du second verbe de mouvement. Elle conserve le sens, le registre et l’ambiguïté possible de « frères », ainsi que l’ancrage et le contenu fonctionnel de la note.
