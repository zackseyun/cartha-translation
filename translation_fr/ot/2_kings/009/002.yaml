base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/002.yaml
  text: When you arrive there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, get him up from among his brothers, and bring him into an inner room.
translation:
  language: fr
  text: Quand tu seras arrivé là-bas, cherche Jéhu, fils de Josaphat, fils de Nimshi. Va le voir, fais-le se lever du milieu de ses frères et conduis-le dans une chambre intérieure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une pièce dans une pièce », c’est-à-dire une chambre intérieure, à l’écart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ שָׁמָּה
  choice: Quand tu seras arrivé là-bas
  rationale: Le verbe בוא peut signifier venir, aller ou arriver selon le point de vue. Ici, l’arrivée précède les instructions suivantes; cette formulation est naturelle en français.
- source_word: וּרְאֵה שָׁם
  choice: cherche
  rationale: ראה signifie littéralement « voir », mais, suivi du nom de Jéhu dans cette consigne, il demande de le repérer. « Cherche » exprime naturellement cette valeur contextuelle; « là-bas » dans la proposition précédente situe déjà la recherche.
- source_word: יֵהוּא בֶן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: Jéhu, fils de Josaphat et petit-fils de Nimshi
  rationale: Dans cette chaîne généalogique, le second בן présente Nimshi comme l’ascendant de Jéhu par Josaphat. « Petit-fils » évite en français l’ambiguïté selon laquelle Josaphat serait lui aussi fils de Nimshi au même niveau syntaxique.
- source_word: וּבָאתָ
  choice: Va vers lui
  rationale: Le second בוא marque un mouvement vers Jéhu avant de le faire lever. « Va vers lui » restitue ce mouvement sans supposer explicitement que Jéhu se trouve déjà dans une autre pièce.
- source_word: וַהֲקֵמֹתוֹ
  choice: fais-le se lever
  rationale: Le hifil de קום signifie faire se lever ou mettre debout. Cette traduction garde explicitement la valeur causative.
- source_word: מִתּוֹךְ אֶחָיו
  choice: du milieu de ses frères
  rationale: אחים signifie littéralement « frères » et peut désigner ici les compagnons d’armes de Jéhu. Le texte principal conserve le terme concret et potentiellement chargé du texte hébreu.
- source_word: וְהֵבֵיאתָ אֹתוֹ
  choice: et conduis-le
  rationale: Le hifil de בוא signifie faire venir, amener ou conduire. Comme l’envoyé se déplace avec Jéhu vers un lieu privé, « conduis-le » est idiomatique en français.
- source_word: חֶדֶר בְּחָדֶר
  choice: dans une pièce retirée
  rationale: L’expression littérale « une pièce dans une pièce » désigne une chambre intérieure et privée. « Pièce retirée » en communique la fonction tout en conservant l’image littérale en note.
