  text: וַ/יְהִ֗י כִּ/רְא֤וֹת יְהוֹרָם֙ אֶת יֵה֔וּא וַ/יֹּ֖אמֶר הֲ/שָׁל֣וֹם יֵה֑וּא וַ/יֹּ֨אמֶר֙ מָ֣ה הַ/שָּׁל֔וֹם עַד זְנוּנֵ֞י אִיזֶ֧בֶל אִמְּ/ךָ֛ וּ/כְשָׁפֶ֖י/הָ הָ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/022.yaml
  text: And it happened[a], when Jehoram saw Jehu, that he said, “Is it peace, Jehu?” And he said, “What peace can there be[b], so long as the prostitutions of Jezebel your mother and her many sorceries continue?”
translation:
  language: fr
  text: 'Quand Joram vit Jéhu, il lui demanda : « La paix, Jéhu ? » Jéhu répondit : « Quelle paix peut-il y avoir[b] tant que durent les prostitutions[a] de Jézabel, ta mère, et ses nombreuses pratiques de sorcellerie ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner des actes de prostitution et, au sens figuré, une infidélité morale ou religieuse.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Quelle paix ? » La réponse reprend le mot employé par Joram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Quand … vit
  rationale: La construction narrative introduit ici naturellement la circonstance temporelle. « Quand » restitue le déroulement du récit en français courant sans alourdir la phrase par un calque comme « Il arriva que, lorsque ».
- source_word: הֲשָׁלוֹם
  choice: Est-ce la paix ?
  rationale: Le nom שָׁלוֹם reste explicite afin de préserver sa reprise rhétorique immédiate dans la réponse de Jéhu.
- source_word: מָה הַשָּׁלוֹם
  choice: Quelle paix peut-il y avoir ?
  rationale: Cette formulation française exprime la force rhétorique de la question, qui nie la possibilité de la paix dans les conditions présentes, tout en conservant la répétition du mot « paix ».
- source_word: עַד
  choice: tant que durent
  rationale: Dans ce contexte, עַד présente une situation persistante qui rend la paix impossible. « Tant que durent » en rend clairement la valeur durative.
- source_word: זְנוּנֵי
  choice: les prostitutions
  rationale: Le terme hébreu est volontairement cru et peut évoquer à la fois une conduite sexuelle et, métaphoriquement, une infidélité religieuse. « Prostitutions » conserve cette image sans la réduire d’emblée à la seule idolâtrie.
- source_word: אִיזֶבֶל אִמְּךָ
  choice: Jézabel, ta mère
  rationale: Cette tournure française conserve l’adresse accusatrice et identifie clairement le lien entre Joram et Jézabel.
- source_word: וּכְשָׁפֶיהָ הָרַבִּים
  choice: et ses nombreuses pratiques de sorcellerie
  rationale: « Pratiques de sorcellerie » est clair en français moderne, restitue le pluriel et évite le tour plus archaïque « ses sortilèges », qui pourrait désigner seulement des formules magiques.
theological_decisions:
- issue: Portée littérale ou figurée de זְנוּנֵי
  choice: Conserver l’image forte avec « prostitutions »
  alternative: Traduire par « idolâtries », « débauches » ou « inconduites »
  rationale: Le contexte peut inclure une accusation morale et cultuelle. Une traduction plus interprétative comme « idolâtries » supprimerait la polysémie et résoudrait une tension que l’hébreu laisse ouverte.
- issue: Sens et répétition de שָׁלוֹם
  choice: Employer « paix » dans les deux répliques
  alternative: Rendre la première occurrence par « Tout va bien ? » ou « Viens-tu en paix ? »
  rationale: La répétition lexicale structure l’échange et donne sa force à la réplique de Jéhu. La conserver évite d’effacer cet effet rhétorique.
translation_notes:
  register: 'Français international moderne, direct et digne. Les noms propres suivent leurs formes françaises usuelles : Joram, Jéhu et Jézabel. La formulation conserve la rudesse de l’accusation et la répétition rhétorique de « paix », tout en évitant une syntaxe inutilement archaïque.'
