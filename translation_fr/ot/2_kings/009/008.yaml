base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/008.yaml
  text: And all the house of Ahab shall perish[a], and I will cut off from Ahab every male, bond and free in Israel.
translation:
  language: fr
  text: Toute la maison d’Achab périra, et je retrancherai de la maison d’Achab tout mâle[a], esclave ou libre[b], en Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quiconque urine contre un mur », expression crue désignant les mâles.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « retenu et laissé ». Le sens précis de cette expression est incertain ; dans ce contexte, elle paraît englober les mâles de toute condition.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאָבַד
  choice: périra
  rationale: Dans cet oracle prophétique, le qatal précédé de la conjonction a une portée future. « Périra » exprime le jugement annoncé sans préciser davantage l’agent.
- source_word: כָּל בֵּית אַחְאָב
  choice: Toute la maison d’Achab
  rationale: « Maison » conserve l’image biblique de la maisonnée et de la dynastie royale.
- source_word: וְהִכְרַתִּי לְאַחְאָב
  choice: je retrancherai de la maison d’Achab
  rationale: Le hiphil de כרת est rendu par « retrancher », terme de jugement qui préserve la métaphore de suppression. La relation exprimée par לְאַחְאָב est explicitée naturellement en français comme une appartenance à la maison d’Achab.
- source_word: מַשְׁתִּין בְּקִיר
  choice: tout homme
  rationale: L’expression hébraïque crue désigne les personnes de sexe masculin. « Tout homme » en transmet le sens dans un français naturel; la formulation littérale figure en note.
- source_word: וְעָצוּר וְעָזוּב
  choice: esclave ou libre
  rationale: Cette paire traditionnelle semble englober les hommes de toute condition, mais son sens exact est discuté. La traduction contextuelle est accompagnée d’une note signalant la littéralité et l’incertitude.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: 'La préposition est comprise localement: le jugement vise la maison d’Achab en Israël.'
theological_decisions:
- issue: Formule de jugement contre la dynastie d’Achab
  choice: Conserver « maison d’Achab » et « retrancher », tout en rendant l’idiome sexué par « tout homme » dans le texte.
  alternative: Paraphraser l’ensemble par « j’anéantirai toute la famille d’Achab » ou reproduire littéralement l’expression crue dans le texte principal.
  rationale: Ce choix maintient le langage dynastique et la force de l’oracle de jugement sans rendre le texte principal inutilement obscur. Les notes assurent la transparence sur les deux idiomes hébreux.
translation_notes:
  register: Français international moderne, digne et direct. Le vocabulaire « maison » et « retrancher » conserve la texture de l’oracle royal, tandis que les expressions hébraïques difficiles sont rendues intelligiblement et documentées en notes.
