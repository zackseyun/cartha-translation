  source_fidelity: 'La tournure initiale « Aussi vrai que » ne fonctionne pas naturellement ici comme rendu autonome de l’idiome hébreu אִם לֹא : elle appelle habituellement une proposition corrélative explicite et rend la construction française ambiguë. « Oui » restitue de manière sobre l’assertion solennelle. « Soulève-le » rend plus précisément שָׂא que « prends-le ». Le reste conserve les éléments essentiels : le sang de Naboth et de ses fils, la rétribution sur la parcelle et le double « déclare Yahweh ».'
