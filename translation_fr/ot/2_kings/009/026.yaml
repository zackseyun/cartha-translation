  text: אִם לֹ֡א אֶת דְּמֵ֣י נָבוֹת֩ וְ/אֶת דְּמֵ֨י בָנָ֜י/ו רָאִ֤יתִי אֶ֨מֶשׁ֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּמְתִּ֥י לְ/ךָ֛ בַּ/חֶלְקָ֥ה הַ/זֹּ֖את נְאֻם יְהוָ֑ה וְ/עַתָּ֗ה שָׂ֧א הַשְׁלִכֵ֛/הוּ בַּ/חֶלְקָ֖ה כִּ/דְבַ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/026.yaml
  text: ‘Surely I saw yesterday the blood of Naboth and the blood of his sons,’ declares Yahweh[a], ‘and I will repay you on this plot of land,’ declares Yahweh. ‘So now, lift him up and throw him on the plot, according to the word of Yahweh.’
translation:
  language: fr
  text: « Oui, j’ai vu hier le sang de Naboth et le sang de ses fils, déclare Yahweh[a], et je te ferai payer cela sur cette parcelle, déclare Yahweh. Maintenant, soulève-le et jette-le dans la parcelle, conformément à la parole de Yahweh. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Certes, j’ai vu hier le sang de Naboth et le sang de ses fils. » La tournure hébraïque initiale est une affirmation solennelle, proche d’un serment.'
    reason: alternative lexicale pour l’idiome emphatique אִם לֹא
lexical_decisions:
- source_word: אִם לֹא
  choice: Aussi vrai que
  rationale: Cette tournure hébraïque introduit ici une affirmation solennelle proche d’un serment, et non une condition ordinaire. « Aussi vrai que » en restitue naturellement la force en français.
- source_word: דְּמֵי
  choice: le sang
  rationale: Le pluriel hébreu « sangs » évoque le sang versé et la culpabilité liée au meurtre. Le singulier est idiomatique en français tout en préservant cette portée.
- source_word: נָבוֹת
  choice: Naboth
  rationale: Translittération française usuelle du nom propre.
- source_word: בָנָיו
  choice: ses fils
  rationale: L’hébreu désigne précisément les fils, et non les enfants en général.
- source_word: רָאִיתִי
  choice: j’ai vu
  rationale: Le passé composé convient à une action passée dont la constatation fonde directement le jugement prononcé.
- source_word: אֶמֶשׁ
  choice: hier
  rationale: Le terme peut désigner le jour ou la nuit précédente ; « hier » est ici la formulation la moins interprétative.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formule prophétique solennelle est rendue de façon claire et digne, en conservant le nom divin.
- source_word: וְשִׁלַּמְתִּי לְךָ
  choice: je te le ferai payer
  rationale: Le piel de שלם exprime ici une rétribution judiciaire. Cette tournure française est naturelle et conserve l’idée de rendre à quelqu’un selon son acte.
- source_word: בַּחֶלְקָה הַזֹּאת
  choice: sur cette parcelle même
  rationale: חֶלְקָה désigne une parcelle de terrain. « Même » rend l’insistance du démonstratif dans le contexte de la rétribution sur le lieu concerné.
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: La formule marque le passage conséquent de la déclaration divine à l’ordre donné.
- source_word: שָׂא
  choice: prends-le
  rationale: L’impératif signifie littéralement porter ou soulever. Dans le contexte du déplacement du corps, « prends-le » est naturel sans préciser inutilement le geste.
- source_word: הַשְׁלִכֵהוּ
  choice: jette-le
  rationale: L’impératif exprime l’action directe de jeter le corps dans la parcelle.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole de Yahweh
  rationale: La formulation indique que l’action accomplit ce que Yahweh avait déclaré.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme ; « Yahweh » conserve le nom divin plutôt que de lui substituer un titre.
- issue: Spécificité de בָנָיו dans le contexte du jugement
  choice: ses fils
  alternative: ses enfants
  rationale: Le texte hébreu dit explicitement « ses fils ». La traduction conserve cette précision sans généraliser.
- issue: Portée judiciaire de la rétribution divine
  choice: je te le ferai payer
  alternative: je te rétribuerai
  rationale: La formulation maintient la responsabilité personnelle et la dimension judiciaire du propos sans ajouter une explication doctrinale.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe garde la solennité de l’oracle tout en évitant les archaïsmes. La répétition de « déclare Yahweh » est conservée, comme dans l’hébreu.
