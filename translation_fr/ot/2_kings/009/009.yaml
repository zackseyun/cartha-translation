  text: וְ/נָֽתַתִּי֙ אֶת בֵּ֣ית אַחְאָ֔ב כְּ/בֵ֖ית יָרָבְעָ֣ם בֶּן נְבָ֑ט וּ/כְ/בֵ֖ית בַּעְשָׁ֥א בֶן אֲחִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/009.yaml
  text: And I will make the house of Ahab like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a].
translation:
  language: fr
  text: Je rendrai la maison d’Achab semblable à la maison de Jéroboam, fils de Nebath, et à la maison de Baésha, fils d’Ahija[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la dynastie d’Achab semblable à celle de Jéroboam, fils de Nebath, et à celle de Baésha, fils d’Ahija ». Ici, le mot hébreu traduit par « maison » désigne une maison royale, c’est-à-dire une lignée dynastique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתִּי
  choice: Je rendrai
  rationale: Dans cette formule de jugement, נָתַתִּי suivi de l’objet et de comparaisons signifie idiomatiquement « rendre semblable à ». Le futur français exprime naturellement l’action annoncée, tandis que le waw de liaison n’a pas besoin d’un « et » initial dans ce verset autonome.
- source_word: בֵּית אַחְאָב
  choice: la maison d’Achab
  rationale: « Maison » conserve la métaphore hébraïque de la lignée royale; « dynastie » en explicite le sens mais est réservé à la note.
- source_word: כְּ/בֵית
  choice: semblable à la maison de
  rationale: Le préfixe כ marque la comparaison. Cette formulation s’intègre naturellement à « rendre » et garde la comparaison explicite.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Les formes françaises bibliques usuelles des noms sont retenues, et la filiation est exprimée clairement.
- source_word: וּ/כְ/בֵית
  choice: et à la maison de
  rationale: La conjonction coordonne le second terme comparatif; la reprise de « semblable » n’est pas nécessaire en français.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baésha, fils d’Ahija
  rationale: Les noms sont rendus selon des formes françaises bibliques reconnaissables, et la construction filiale est conservée.
theological_decisions:
- issue: Formule de jugement visant une lignée royale
  choice: la maison d’Achab ... la maison de Jéroboam ... la maison de Baésha
  alternative: la dynastie d’Achab ... la dynastie de Jéroboam ... la dynastie de Baésha
  rationale: Le maintien de « maison » préserve l’image hébraïque et les échos aux jugements antérieurs, sans réduire explicitement le terme à sa seule dimension politique. Une note en précise ici le sens dynastique.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve la métaphore biblique de la « maison » tout en évitant un calque peu naturel du verbe hébreu. Les noms propres suivent des formes françaises bibliques courantes.
