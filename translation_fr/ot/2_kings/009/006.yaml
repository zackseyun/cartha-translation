  text: וַ/יָּ֨קָם֙ וַ/יָּבֹ֣א הַ/בַּ֔יְתָ/ה וַ/יִּצֹ֥ק הַ/שֶּׁ֖מֶן אֶל רֹאשׁ֑/וֹ וַ/יֹּ֣אמֶר ל֗/וֹ כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מְשַׁחְתִּ֧י/ךָֽ לְ/מֶ֛לֶךְ אֶל עַ֥ם יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/006.yaml
  text: 'So he got up and went into the house[a], and he poured the oil on his head and said to him, “Thus says Yahweh, the God of Israel: I have anointed you king over the people of Yahweh, over Israel.”'
translation:
  language: fr
  text: 'Alors il se leva et entra dans la maison. Il versa l’huile sur sa tête et lui dit : « Voici ce que dit Yahweh, le Dieu d’Israël : Je t’ai oint[a] roi d’Israël, le peuple de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je t’oins roi d’Israël, le peuple de Yahweh. » Dans cette formule d’investiture, le parfait hébreu peut avoir une valeur performative.'
    reason: Préserve l’ambiguïté entre l’acte présenté comme accompli et la déclaration qui accomplit officiellement l’investiture.
lexical_decisions:
- source_word: וַיָּקָם
  choice: il se leva
  rationale: Le wayyiqtol de קום poursuit la séquence narrative. « Se leva » est naturel et digne en français moderne.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: entra dans la maison
  rationale: בוא accompagné du hé directionnel sur בַּיִת exprime un mouvement vers l’intérieur de la maison.
- source_word: וַיִּצֹק הַשֶּׁמֶן אֶל רֹאשׁוֹ
  choice: Il versa l’huile sur sa tête
  rationale: יצק signifie couramment « verser » ; l’article défini de הַשֶּׁמֶן est conservé, et אֶל indique ici la surface sur laquelle l’huile est versée.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formulation française naturelle de la formule de messager prophétique, sans archaïsme inutile.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du tétragramme, qui conserve le nom divin présent dans le texte hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct de la construction génitivale hébraïque.
- source_word: מְשַׁחְתִּיךָ
  choice: Je t’ai consacré par l’onction
  rationale: משׁח désigne l’acte d’oindre. Cette formulation reste intelligible en français courant tout en conservant explicitement la notion rituelle d’onction et l’aspect accompli du parfait.
- source_word: לְמֶלֶךְ
  choice: comme roi
  rationale: La préposition לְ marque ici la fonction ou le résultat de l’onction royale.
- source_word: אֶל עַם יְהוָה
  choice: sur le peuple de Yahweh
  rationale: Dans ce contexte d’investiture royale, אֶל désigne la sphère sur laquelle s’exerce l’autorité du roi ; « sur » rend ce sens en français.
- source_word: אֶל יִשְׂרָאֵל
  choice: sur Israël
  rationale: La répétition de « sur » conserve le parallélisme hébraïque et présente Israël comme l’explicitation du peuple de Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » maintient le nom propre plutôt que de le remplacer par un titre.
- issue: Valeur de la déclaration מְשַׁחְתִּיךָ
  choice: Je t’ai consacré par l’onction
  alternative: Je te consacre par l’onction
  rationale: Le parfait peut décrire l’acte tout juste accompli, mais il peut aussi avoir une force performative dans cette formule d’investiture. Le texte principal retient l’accompli et la note préserve l’autre nuance.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici ce que dit » évite l’archaïsme de « Ainsi parle » ; « consacré par l’onction » conserve le sens rituel de משׁח sans employer le peu courant « oint ».
