revisions:
- from: 'Alors il se leva et entra dans la maison. Il versa l’huile sur sa tête et lui dit : « Voici ce que dit Yahweh, le Dieu d’Israël : Je t’ai consacré par l’onction[a] comme roi sur le peuple de Yahweh, sur Israël. »'
  to: 'Alors il se leva et entra dans la maison. Il versa l’huile sur sa tête et lui dit : « Voici ce que dit Yahweh, le Dieu d’Israël : Je t’ai oint[a] roi d’Israël, le peuple de Yahweh. »'
  rationale: La révision emploie « oindre », équivalent lexical direct de משח dans le contexte d’une investiture royale, et reformule les compléments finaux dans un français plus fluide. Elle maintient la relation appositionnelle entre « le peuple de Yahweh » et « Israël » ainsi que l’ambiguïté performative du parfait hébreu.
