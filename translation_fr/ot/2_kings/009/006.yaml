    issue: Répétition peu naturelle de « sur » dans « roi sur le peuple de Yahweh, sur Israël »
    rationale: Les deux groupes introduits par אֶל présentent Israël comme l’explicitation du peuple de Yahweh. En français, « roi d’Israël, le peuple de Yahweh » conserve cette relation sans une répétition syntaxiquement pesante.
  - severity: low
    issue: « Consacré par l’onction » est moins direct que le lexique de l’onction royale
    rationale: Le verbe משח signifie proprement « oindre ». « Je t’ai oint » est précis, idiomatique dans le français biblique moderne et préserve mieux la concision de la formule.
  - severity: low
    issue: La note alternative ne reprend pas l’ensemble du complément royal et du peuple concerné
    rationale: Une note sur la valeur performative doit donner une alternative complète afin de ne pas laisser entendre que seul le syntagme « comme roi » est en jeu.
