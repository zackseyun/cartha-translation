revisions:
- from: Tu frapperas la maison d’Achab, ton maître, et je vengerai le sang de mes serviteurs les prophètes, ainsi que le sang de tous les serviteurs de Yahweh, versé par Jézabel.[a]
  to: Tu frapperas la maison d’Achab, ton maître, et je vengerai sur Jézabel le sang de mes serviteurs, les prophètes, et le sang de tous les serviteurs de Yahweh.[a]
  rationale: La révision replace l’idée exprimée par « de la main de Jézabel » dans une construction française qui porte sans ambiguïté sur les deux groupes de victimes. Elle conserve la force rétributive de נקם, l’idiome dynastique de « maison », et la latitude du texte quant au degré précis de participation de Jézabel.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:43:34Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’impératif/prophétie adressé à Jéhu, « la maison d’Achab », « ton maître », les deux groupes de serviteurs et le nom Yahweh. Toutefois, dans le texte proposé, le participe « versé par Jézabel », placé après le second « sang », se rattache normalement seulement à ce second groupe. L’idiome hébreu final gouverne les deux occurrences de « sang ». « Sur Jézabel » permet de rendre en français l’idée de rétribution dirigée contre elle et sa responsabilité, sans affirmer qu’elle a personnellement versé chaque sang.
  naturalness: Le français est globalement moderne et digne. « Je vengerai sur Jézabel le sang de… » est une formulation biblique française claire et plus cohérente syntaxiquement que la relative finale du projet. Les virgules autour de « les prophètes » signalent utilement l’apposition.
  terminology: « Maison d’Achab », « maître », « serviteurs », « prophètes » et « Yahweh » sont appropriés. La note maintient à juste titre l’image hébraïque littérale « de la main de Jézabel » et explique l’idée d’agence/responsabilité sans la réduire à une participation personnelle à chaque meurtre.
  issues:
  - severity: medium
    issue: Portée syntaxique ambiguë de « versé par Jézabel »
    rationale: Dans « le sang de mes serviteurs les prophètes, ainsi que le sang de tous les serviteurs de Yahweh, versé par Jézabel », le participe final qualifie prioritairement le second groupe seulement. Or מִיַּד אִיזָבֶל se rapporte à la vengeance du sang des prophètes comme à celle de tous les serviteurs de Yahweh.
  revised_text: Tu frapperas la maison d’Achab, ton maître, et je vengerai sur Jézabel le sang de mes serviteurs, les prophètes, et le sang de tous les serviteurs de Yahweh.[a]
