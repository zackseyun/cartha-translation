  text: וְ/הִ֨כִּיתָ֔ה אֶת בֵּ֥ית אַחְאָ֖ב אֲדֹנֶ֑י/ךָ וְ/נִקַּמְתִּ֞י דְּמֵ֣י עֲבָדַ֣/י הַ/נְּבִיאִ֗ים וּ/דְמֵ֛י כָּל עַבְדֵ֥י יְהוָ֖ה מִ/יַּ֥ד אִיזָֽבֶל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/007.yaml
  text: And you shall strike down the house of Ahab your master[a], and I will avenge the blood of my servants the prophets and the blood of all the servants of Yahweh from the hand of Jezebel.
translation:
  language: fr
  text: Tu frapperas la maison d’Achab, ton maître, et je vengerai sur Jézabel le sang de mes serviteurs, les prophètes, et le sang de tous les serviteurs de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la main de Jézabel », expression qui indique son action ou sa responsabilité dans le sang versé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכִּיתָה
  choice: Tu frapperas
  rationale: Le verbe נכה exprime ici l’action décisive menée contre une dynastie. « Frapper » conserve la force judiciaire du terme sans imposer à lui seul une formulation plus explicite que l’hébreu.
- source_word: בֵּית אַחְאָב
  choice: la maison d’Achab
  rationale: Dans ce contexte royal, « maison » désigne la lignée et l’ensemble dynastique d’Achab, tout en conservant l’image biblique.
- source_word: אֲדֹנֶיךָ
  choice: ton maître
  rationale: Le mot désigne le supérieur humain de Jéhu. « Maître » évite de le confondre avec un titre divin.
- source_word: וְנִקַּמְתִּי
  choice: je vengerai
  rationale: Le verbe נקם présente l’action de Dieu comme une rétribution en faveur des victimes; « venger » en garde la force sans ajout explicatif.
- source_word: דְּמֵי
  choice: le sang de
  rationale: Le pluriel hébreu peut évoquer le sang versé et la culpabilité qui en découle. L’expression française « le sang de » reste naturelle et conserve l’image.
- source_word: עֲבָדַי הַנְּבִיאִים
  choice: mes serviteurs les prophètes
  rationale: La formulation identifie les prophètes comme les serviteurs de Dieu et reproduit simplement l’apposition hébraïque.
- source_word: כָּל עַבְדֵי יְהוָה
  choice: tous les serviteurs de Yahweh
  rationale: La construction possessive est rendue directement, et le nom divin est translittéré comme nom propre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération représente le tétragramme comme nom personnel, au lieu de lui substituer un titre.
- source_word: מִיַּד אִיזָבֶל
  choice: versé par Jézabel
  rationale: Littéralement « de la main de Jézabel », l’expression indique ici son rôle ou sa responsabilité dans l’effusion de sang. L’ajout de « versé » explicite en français le lien naturel avec « le sang » sans modifier l’agent.
theological_decisions:
- issue: La vengeance divine
  choice: je vengerai le sang
  alternative: je tirerai vengeance du sang
  rationale: Le texte attribue explicitement à Dieu la rétribution du meurtre de ses serviteurs. La formulation retenue préserve cette tension théologique sans l’atténuer ni la développer.
- issue: L’étendue de la responsabilité de Jézabel
  choice: le sang ... versé par Jézabel
  alternative: le sang ... qui est réclamé à Jézabel
  rationale: L’idiome hébreu signale l’agence ou la responsabilité, sans préciser si Jézabel a personnellement tué chaque victime. La traduction conserve cette latitude.
translation_notes:
  register: Français international moderne, digne et accessible. « Maison » conserve l’idiome dynastique biblique; « Yahweh » rend le nom divin. La ponctuation clarifie les deux groupes de victimes sans effacer leur parallélisme.
