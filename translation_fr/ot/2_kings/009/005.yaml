base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/005.yaml
  text: So he came[a], and behold, the commanders of the army were sitting. And he said, “I have a word for you, commander.” And Jehu said, “For which one of us?” And he said, “For you, commander.”
translation:
  language: fr
  text: 'Il arriva, et voici que les commandants de l’armée étaient assis. Il dit : « J’ai une parole[a] pour toi, commandant. » Jéhu demanda : « Pour lequel d’entre nous ? » Il répondit : « Pour toi, commandant. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un message ». L’hébreu dit littéralement : « Une parole est à moi pour toi, commandant. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Il entra donc
  rationale: Le wayyiqtol fait progresser le récit. Dans le contexte immédiat, le jeune prophète entre auprès des commandants ; « donc » marque naturellement l’enchaînement sans l’alourdir.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette tournure conserve la fonction présentative et vive de הִנֵּה tout en restant naturelle dans un récit français soutenu.
- source_word: שָׂרֵי הַחַיִל
  choice: les commandants de l’armée
  rationale: שָׂרִים désigne ici les chefs militaires réunis, et חַיִל l’armée. « Commandants » évite d’attribuer un grade moderne trop précis.
- source_word: יֹשְׁבִים
  choice: étaient assis
  rationale: Le participe décrit leur posture au moment où le messager entre ; l’imparfait rend cet arrière-plan continu.
- source_word: דָּבָר
  choice: une parole
  rationale: « Parole » garde le sens premier et la concision de דָּבָר, lequel peut aussi désigner un message dans ce contexte.
- source_word: לִי אֵלֶיךָ
  choice: J’ai … pour toi
  rationale: La construction hébraïque est elliptique, littéralement proche de « une parole est à moi pour toi ». Cette formulation française en exprime naturellement le sens.
- source_word: הַשַּׂר
  choice: commandant
  rationale: Employé comme apostrophe au singulier, שַׂר désigne ici un chef militaire. « Commandant » convient au contexte sans imposer le grade technique que le mot peut désigner en français moderne.
- source_word: אֶל־מִי מִכֻּלָּנוּ
  choice: Pour lequel d’entre nous ?
  rationale: La question porte sur l’homme visé parmi tous les chefs présents. Cette formulation rend clairement la valeur partitive de מִכֻּלָּנוּ.
- source_word: אֵלֶיךָ הַשָּׂר
  choice: Pour toi, commandant
  rationale: La réponse identifie directement Jéhu comme destinataire et reprend naturellement la formulation précédente.
