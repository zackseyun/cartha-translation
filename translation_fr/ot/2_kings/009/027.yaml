  text: וַ/אֲחַזְיָ֤ה מֶֽלֶךְ יְהוּדָה֙ רָאָ֔ה וַ/יָּ֕נָס דֶּ֖רֶךְ בֵּ֣ית הַגָּ֑ן וַ/יִּרְדֹּ֨ף אַחֲרָ֜י/ו יֵה֗וּא וַ֠/יֹּאמֶר גַּם אֹת֞/וֹ הַכֻּ֣/הוּ אֶל הַ/מֶּרְכָּבָ֗ה בְּ/מַֽעֲלֵה גוּר֙ אֲשֶׁ֣ר אֶֽת יִבְלְעָ֔ם וַ/יָּ֥נָס מְגִדּ֖וֹ וַ/יָּ֥מָת שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/027.yaml
  text: When Ahaziah king of Judah saw this[a], he fled by the way of Beth-haggan. And Jehu pursued him and said, “Strike him too, in the chariot!” So they struck him at the ascent of Gur, which is by Ibleam[b]. But he fled to Megiddo and died there.
translation:
  language: fr
  text: 'Quand Ochozias, roi de Juda, vit cela, il s’enfuit par le chemin de Beth-Haggan[a]. Jéhu se lança à sa poursuite et ordonna : « Frappez-le, lui aussi, dans son char[b], à la montée de Gour, près de Yibleam ! » Ochozias s’enfuit à Meguiddo et y mourut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beth-Haggan peut signifier « maison du jardin », mais il s’agit probablement ici d’un nom de lieu; il est donc translittéré.
    reason: cultural_note
  - marker: b
    text: Ou « frappez-le aussi vers le char »; la préposition hébraïque peut indiquer le lieu ou la direction.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: vit cela
  rationale: Le verbe signifie simplement « voir »; « cela » explicite naturellement en français l’événement observé sans le définir davantage.
- source_word: דֶּרֶךְ בֵּית הַגָּן
  choice: par le chemin de Beth-Haggan
  rationale: דֶּרֶךְ désigne un chemin ou une route. בֵּית הַגָּן est traité ici comme un nom de lieu et translittéré plutôt que traduit.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: se lança à sa poursuite
  rationale: Cette tournure française naturelle rend l’action de poursuivre quelqu’un exprimée par רדף suivi de אַחַר.
- source_word: גַּם אֹתוֹ
  choice: lui aussi
  rationale: 'La formulation conserve la valeur additive de גַּם : Ochozias doit être frappé à son tour.'
- source_word: הַכֻּהוּ
  choice: Frappez-le
  rationale: L’impératif de נכה signifie largement « frapper »; « tuer » préciserait excessivement la portée lexicale immédiate.
- source_word: אֶל הַמֶּרְכָּבָה
  choice: dans son char
  rationale: Dans ce contexte, la préposition flexible אֶל peut situer Ochozias dans le char au moment où il doit être frappé; une note conserve l’autre nuance possible de direction.
- source_word: בְּמַעֲלֵה גוּר
  choice: à la montée de Gour
  rationale: מַעֲלֶה désigne une montée ou un passage en pente; la traduction garde cette précision topographique.
- source_word: אֲשֶׁר אֶת יִבְלְעָם
  choice: près de Yibleam
  rationale: La proposition situe la montée de Gour par rapport à Yibleam sans imposer une précision géographique supérieure à celle de l’hébreu.
- source_word: וַיָּנָס מְגִדּוֹ
  choice: Il s’enfuit jusqu’à Meguiddo
  rationale: Le verbe exprime la fuite, et le nom de lieu sans préposition indique naturellement ici la destination atteinte.
- source_word: וַיָּמָת שָׁם
  choice: et y mourut
  rationale: La formulation concise reproduit la succession des événements et rend שָׁם par le pronom adverbial « y ».
