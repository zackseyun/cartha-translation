revisions:
- from: 'Quand Ochozias, roi de Juda, vit cela, il s’enfuit par le chemin de Beth-Haggan[a]. Jéhu se lança à sa poursuite et ordonna : « Frappez-le, lui aussi, dans son char[b], à la montée de Gour, près de Yibleam ! » Il s’enfuit jusqu’à Meguiddo et y mourut.'
  to: 'Quand Ochozias, roi de Juda, vit cela, il s’enfuit par le chemin de Beth-Haggan[a]. Jéhu se lança à sa poursuite et ordonna : « Frappez-le, lui aussi, dans son char[b], à la montée de Gour, près de Yibleam ! » Ochozias s’enfuit à Meguiddo et y mourut.'
  rationale: La révision identifie explicitement Ochozias comme le sujet de sa fuite afin d’éviter une ambiguïté française créée par la proximité de Jéhu. La note sur « dans son char » est resserrée pour refléter plus exactement l’ambiguïté directionnelle de la préposition hébraïque, sans introduire « contre », qui excède le texte.
  reviewer_model: gpt-5.6-terra
