translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent des formes françaises lisibles tout en restant proches de l’hébreu. La commande et l’indication topographique sont réunies sans ajouter une proposition narrative distincte (« ils le frappèrent »), absente du texte hébreu transmis.
