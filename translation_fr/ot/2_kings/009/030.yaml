base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/030.yaml
  text: When Jehu came to Jezreel[a], Jezebel heard of it. She painted her eyes with kohl, adorned her head[b], and looked out through the window.
translation:
  language: fr
  text: Lorsque Jéhu arriva à Jizréel, Jézabel l’apprit. Elle se maquilla les yeux avec du khôl[a], arrangea sa coiffure[b] et regarda par la fenêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « mit du khôl sur ses yeux ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « rendit sa tête belle » ; l’hébreu emploie littéralement une expression signifiant « rendit bonne/belle sa tête ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא יֵהוּא יִזְרְעֶאלָה
  choice: Lorsque Jéhu arriva à Jizréel
  rationale: La forme directionnelle de יִזְרְעֶאלָה indique un mouvement vers Jizréel. « Arriva à » rend naturellement en français l’aboutissement du déplacement de Jéhu.
- source_word: וְאִיזֶבֶל שָׁמְעָה
  choice: Jézabel l’apprit
  rationale: Le verbe « entendre » a ici un objet implicite fourni par le contexte, à savoir l’arrivée de Jéhu. « L’apprit » l’exprime avec concision dans un français naturel.
- source_word: וַתָּשֶׂם בַּפּוּךְ עֵינֶיהָ
  choice: Elle se maquilla les yeux avec du khôl
  rationale: פּוּךְ désigne un cosmétique sombre appliqué aux yeux. « Khôl » conserve la réalité culturelle concrète, tandis que « se maquilla les yeux » rend l’action idiomatiquement.
- source_word: וַתֵּיטֶב אֶת רֹאשָׁהּ
  choice: soigna sa coiffure
  rationale: L’expression signifie littéralement qu’elle rendit sa tête belle ou soignée. Dans ce contexte de toilette, « soigna sa coiffure » est naturel sans introduire un geste précis absent de l’hébreu.
- source_word: וַתַּשְׁקֵף בְּעַד הַחַלּוֹן
  choice: regarda par la fenêtre
  rationale: Le verbe décrit le fait de regarder depuis une ouverture, et בְּעַד indique ici le passage du regard à travers celle-ci. « Regarda par la fenêtre » est l’expression française usuelle.
