base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/032.yaml
  text: He lifted up his face toward the window and said[a], “Who is with me? Who?” Then two or three eunuchs looked down at him.
translation:
  language: fr
  text: 'Il leva les yeux vers la fenêtre et dit : « Qui est avec moi ? Qui ? » Alors deux ou trois eunuques[a] regardèrent vers lui depuis la fenêtre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fonctionnaires de la cour » ; le terme hébreu peut désigner des eunuques ou des fonctionnaires, mais, dans le cadre d’un palais royal, « eunuques » est le sens le plus probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא פָנָיו
  choice: Il leva le visage
  rationale: Rend directement l’image hébraïque tout en restant claire en français; le contexte indique qu’il dirige son regard vers le haut.
- source_word: הַחַלּוֹן
  choice: la fenêtre
  rationale: Équivalent architectural courant et précis dans cette scène du palais.
- source_word: מִי אִתִּי מִי
  choice: Qui est avec moi ? Qui ?
  rationale: Conserve la formulation directe et la répétition insistante de l’interrogatif, sans expliciter davantage par « de mon côté ».
- source_word: וַיַּשְׁקִיפוּ אֵלָיו
  choice: se penchèrent pour le regarder
  rationale: Le verbe décrit un regard porté depuis une position élevée. Cette tournure française restitue naturellement l’action à la fenêtre, même si l’idée de se pencher est légèrement contextuelle.
- source_word: שְׁנַיִם שְׁלֹשָׁה
  choice: deux ou trois
  rationale: Expression française naturelle correspondant à cette juxtaposition hébraïque de nombres qui désigne un petit nombre indéterminé.
- source_word: סָרִיסִים
  choice: eunuques
  rationale: Dans le cadre d’un palais royal, « eunuques » est le sens le plus probable; le terme peut toutefois désigner plus largement des hauts fonctionnaires de cour, possibilité signalée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve l’image concrète du visage levé et l’insistance de la question répétée. « Se penchèrent pour le regarder » rend de façon naturelle le regard depuis la fenêtre située en hauteur.
