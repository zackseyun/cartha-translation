  text: וַֽ/יְמַהֲר֗וּ וַ/יִּקְחוּ֙ אִ֣ישׁ בִּגְד֔/וֹ וַ/יָּשִׂ֥ימוּ תַחְתָּ֖י/ו אֶל גֶּ֣רֶם הַֽ/מַּעֲל֑וֹת וַֽ/יִּתְקְעוּ֙ בַּ/שּׁוֹפָ֔ר וַ/יֹּאמְר֖וּ מָלַ֥ךְ יֵהֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/013.yaml
  text: Then they hurried[a], and each man took his garment and put it under him on the bare steps, and they blew the horn and said[b], “Jehu is king!”
translation:
  language: fr
  text: 'Alors ils se dépêchèrent. Chacun prit son vêtement et le plaça sous Jéhu, à même les marches[a]. Puis ils sonnèrent du cor[b] et dirent : « Jéhu est roi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « au sommet des marches » ou « sur le palier de l’escalier ». L’expression hébraïque est rare, et son sens précis reste incertain.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : shofar, cor utilisé pour donner un signal ; traditionnellement traduit par « trompette ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: Alors ils se dépêchèrent
  rationale: Le verbe מהר exprime ici une réaction immédiate et rapide. « Alors » maintient l’enchaînement narratif du waw consécutif.
- source_word: אִישׁ בִּגְדוֹ
  choice: Chacun prit son vêtement
  rationale: אִישׁ a un sens distributif, « chacun », et בֶּגֶד désigne largement un vêtement, sans imposer qu’il s’agisse précisément d’un manteau.
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: le plaça sous Jéhu
  rationale: Le pronom de תַחְתָּיו renvoie naturellement à Jéhu. Le nom explicite évite en français une ambiguïté gênante entre le vêtement et Jéhu, sans préciser davantage la manière dont les vêtements furent disposés.
- source_word: אֶל גֶּרֶם הַמַּעֲלוֹת
  choice: à même les marches
  rationale: L’expression hébraïque est rare et difficile. « À même les marches » exprime l’idée probable de vêtements posés directement sur la surface des marches, tout en signalant l’incertitude dans une note.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: ils sonnèrent du cor
  rationale: שׁוֹפָר désigne un cor servant notamment à donner un signal. « Sonner du cor » est naturel, concret et plus précis que le traditionnel « sonner de la trompette ».
- source_word: מָלַךְ יֵהוּא
  choice: Jéhu est roi !
  rationale: Dans cette acclamation, le parfait מָלַךְ proclame l’accession désormais effective de Jéhu. La formule française directe « Jéhu est roi ! » convient au cri public sans ajouter une construction passive absente de l’hébreu.
