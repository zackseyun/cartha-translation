translation_notes:
  register: Français international moderne, narratif et digne. Les phrases brèves rendent la rapidité de la scène. Le nom « Jéhu » est répété pour lever une ambiguïté pronominale propre au français, et l’incertitude de l’expression concernant les marches est conservée en note.
