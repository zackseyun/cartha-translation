base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/016.yaml
  text: So Jehu mounted up and went to Jezreel[a], because Joram was lying there[b], and Ahaziah king of Judah had gone down to see Joram.
translation:
  language: fr
  text: Jéhu monta et partit pour Jezréel, car Joram y était couché, et Ahazia, roi de Juda, était descendu voir Joram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: monta sur son char
  rationale: Le verbe רכב exprime l’action de monter ou de chevaucher. Le char est compris d’après le contexte narratif, mais n’est pas nommé explicitement dans ce verset; une note signale cette précision contextuelle.
- source_word: וַיֵּלֶךְ יִזְרְעֶאלָה
  choice: partit pour Jizréel
  rationale: הלך est le verbe courant « aller » et le ה directionnel marque le mouvement vers Jizréel. « Partit pour » distingue naturellement en français le départ de l’action précédente de monter.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison du déplacement de Jéhu. « Car » convient au registre narratif biblique tout en restant courant.
- source_word: שֹׁכֵב שָׁמָּה
  choice: y était couché
  rationale: Le participe שֹׁכֵב signifie littéralement « couché ». Cette formulation préserve le sens sans préciser davantage son état médical; « y » rend naturellement שָׁמָּה.
- source_word: יָרַד
  choice: était descendu
  rationale: Le verbe garde sa nuance topographique de descente, et le plus-que-parfait exprime une action antérieure au départ de Jéhu.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: voir Joram
  rationale: La formulation traduit directement « voir Joram »; dans ce contexte, le français comprend naturellement qu’Ahazia était venu lui rendre visite.
- source_word: יֵהוּא / יוֹרָם / אֲחַזְיָה / יִזְרְעֶאל / יְהוּדָה
  choice: Jéhu / Joram / Ahazia / Jizréel / Juda
  rationale: Formes françaises modernes et reconnaissables des noms propres, proches de leur transcription hébraïque.
