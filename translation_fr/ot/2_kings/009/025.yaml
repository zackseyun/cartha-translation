  text: וַ/יֹּ֗אמֶר אֶל בִּדְקַר֙ שלשה שָׂ֚א הַשְׁלִכֵ֔/הוּ בְּ/חֶלְקַ֕ת שְׂדֵ֖ה נָב֣וֹת הַ/יִּזְרְעֵאלִ֑י כִּֽי זְכֹ֞ר אֲנִ֣י וָ/אַ֗תָּה אֵ֣ת רֹכְבִ֤ים צְמָדִים֙ אַֽחֲרֵי֙ אַחְאָ֣ב אָבִ֔י/ו וַֽ/יהוָה֙ נָשָׂ֣א עָלָ֔י/ו אֶת הַ/מַּשָּׂ֖א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/025.yaml
  text: 'Then he said to Bidkar his officer[a], “Lift him up and throw him onto the plot of the field of Naboth the Jezreelite[c][b], for remember: you and I were riding side by side behind Ahab his father when Yahweh laid this pronouncement against him.”'
translation:
  language: fr
  text: 'Puis il dit à Bidkar, son officier[a] : « Soulève-le et jette-le sur la parcelle du champ de Naboth le Jizréélite. Souviens-toi : toi et moi, nous chevauchions ensemble[b] derrière Achab, son père, lorsque Yahweh a prononcé contre lui cet oracle[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son troisième homme » ; il peut s’agir d’un titre technique désignant le rang ou la fonction de Bidkar.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « chevauchant par paires » ; l’expression indique probablement que Jéhu et Bidkar chevauchaient ensemble derrière Achab.
    reason: lexical_alternative
  - marker: c
    text: Ou « cette déclaration » ou « ce fardeau » ; le terme hébreu désigne une parole prophétique lourde de conséquences.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְקַר
  choice: Bidkar
  rationale: Nom propre translittéré sous une forme simple et conforme à l’usage biblique français.
- source_word: שלשה
  choice: son officier
  rationale: La tradition textuelle et le contexte indiquent ici une fonction auprès de Jéhu. « Son officier » reste clair sans imposer un grade militaire précis.
- source_word: שָׂא
  choice: Soulève-le
  rationale: L’impératif de נשׂא désigne ici l’action de soulever ou de prendre le corps avant de le jeter.
- source_word: הַשְׁלִכֵהוּ
  choice: jette-le
  rationale: Rend directement la force de l’impératif et son suffixe masculin singulier.
- source_word: בְּחֶלְקַת שְׂדֵה
  choice: sur la parcelle du champ
  rationale: « Parcelle » rend חלקה, tandis que « du champ » conserve le complément שדה; la préposition française « sur » convient au mouvement vers le terrain.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Naboth de Jizréel
  rationale: Formulation française naturelle pour le nom et le gentilé, identifiant Naboth comme originaire ou habitant de Jizréel.
- source_word: זְכֹר
  choice: souviens-toi
  rationale: Impératif direct qui introduit le souvenir invoqué pour justifier l’ordre.
- source_word: רֹכְבִים צְמָדִים
  choice: nous chevauchions ensemble
  rationale: Littéralement, l’expression évoque des cavaliers allant par paire. La formulation choisie exprime clairement que Jéhu et Bidkar accompagnaient ensemble Achab sans préciser indûment leur disposition exacte.
- source_word: אַחֲרֵי אַחְאָב אָבִיו
  choice: derrière Achab, son père
  rationale: Conserve le sens spatial ou d’accompagnement de אחרי. Dans le contexte, « son père » désigne le père du roi qui vient d’être frappé.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom divin personnel plutôt que remplacé par un titre.
- source_word: נָשָׂא עָלָיו אֶת־הַמַּשָּׂא הַזֶּה
  choice: a prononcé contre lui cette déclaration
  rationale: מַשָּׂא désigne ici une parole prophétique solennelle et menaçante; « déclaration » est intelligible, tandis que la note conserve les nuances d’« oracle » et de « fardeau ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom divin; « Yahweh » en préserve le caractère de nom propre.
- issue: Sens prophétique de מַשָּׂא
  choice: déclaration
  alternative: oracle ou fardeau
  rationale: Le terme décrit une parole prophétique de poids dirigée contre Achab. Le texte principal privilégie la clarté sans effacer les autres nuances, signalées en note.
- issue: Référent de « son père »
  choice: le père du roi frappé, c’est-à-dire Achab
  alternative: le père de Jéhu ou de Bidkar
  rationale: Le contexte narratif rattache le pronom au roi Joram, fils d’Achab; la formulation française conserve néanmoins le pronom du texte.
translation_notes:
  register: Français international actuel, digne et narratif. Les impératifs restent directs. La syntaxe « Car souviens-toi » maintient l’appel solennel à la mémoire, et les notes préservent les ambiguïtés techniques et prophétiques de l’hébreu.
