  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : Jéhu ordonne à Bidkar de jeter le corps sur la parcelle liée à Naboth et rappelle une parole de Yahweh contre Achab. Toutefois, le gentilé hébreu הַיִּזְרְעֵאלִי est préférable sous la forme explicite « le Jizréélite » plutôt que réduit à « de Jizréel ».'
  naturalness: Le français est globalement clair et actuel. La suppression de « Car » devant l’impératif rend l’enchaînement plus naturel sans perdre la valeur explicative de כי. « Nous chevauchions ensemble » convient au texte principal, la note maintenant la difficulté de צמדים.
  terminology: « Yahweh » est cohérent avec la décision éditoriale fournie. « Oracle » est plus précis et plus naturel que « déclaration » pour מַשָּׂא dans ce contexte prophétique, sans imposer le sens métaphorique de « fardeau ». « Officier » reste une solution prudente pour שלשה, dont la portée technique est incertaine.
