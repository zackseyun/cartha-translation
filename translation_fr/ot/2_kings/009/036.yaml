  - severity: medium
    issue: Ancre de note placée après « Jizréel » plutôt qu’après « territoire »
    rationale: La note explique la portée lexicale de חֵלֶק (« territoire », « parcelle », « portion »), non le nom propre יִזְרְעֶאל. L’ancre doit suivre « territoire » pour correspondre au mot commenté.
