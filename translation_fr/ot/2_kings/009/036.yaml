base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/036.yaml
  text: So they returned and told him[a], and he said, “It is the word of Yahweh, which he spoke by the hand of his servant Elijah the Tishbite, saying, ‘In the territory of Jezreel the dogs will eat the flesh of Jezebel.’”
translation:
  language: fr
  text: 'Ils revinrent et lui firent leur rapport. Il dit : « C’est la parole de Yahweh, celle qu’il avait prononcée par l’intermédiaire de son serviteur Élie le Tishbite : “Sur le territoire[a] de Jizréel, les chiens mangeront la chair de Jézabel.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la parcelle de Jizréel » ou « dans la portion de Jizréel » ; le terme hébreu peut désigner une étendue ou une parcelle de terre.
    reason: La portée exacte de חֵלֶק demeure ouverte entre un territoire et une portion de terrain plus délimitée.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיַּגִּידוּ לוֹ
  choice: Ils revinrent donc lui faire leur rapport
  rationale: Les deux formes narratives marquent la succession des actions. « Faire leur rapport » rend naturellement le hiphil de נגד dans ce contexte sans ajouter le contenu sous-entendu.
- source_word: דְּבַר יְהוָה הוּא
  choice: C’est la parole de Yahweh
  rationale: Cette formulation française conserve l’identification emphatique de la proposition nominale hébraïque et rend directement le nom divin.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: celle qu’il avait prononcée par l’intermédiaire de son serviteur
  rationale: Le plus-que-parfait situe naturellement la parole prophétique avant son accomplissement. « Par l’intermédiaire de » transmet l’idée d’agence portée par l’expression idiomatique בְּיַד sans reproduire en français une tournure obscure.
- source_word: אֵלִיָּהוּ הַתִּשְׁבִּי
  choice: Élie le Tishbite
  rationale: Les formes françaises usuelles du nom personnel et du gentilé sont retenues.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: Sur le territoire de Jizréel
  rationale: חֵלֶק peut désigner une portion, une parcelle ou une étendue de terre. « Territoire » exprime clairement le sens géographique sans le limiter avec certitude à une petite parcelle.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: les chiens mangeront
  rationale: Traduction directe qui garde la simplicité et la brutalité de l’annonce prophétique.
- source_word: בְּשַׂר אִיזָבֶל
  choice: la chair de Jézabel
  rationale: « Chair » correspond précisément à בָּשָׂר et préserve le caractère concret de la prophétie.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » conserve le nom propre au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement narratif hébreu, tandis que l’expression d’agence est rendue idiomatiquement. Les guillemets imbriqués distinguent la parole de Jéhu de la citation prophétique.
