  text: וְ/הַ/צֹּפֶה֩ עֹמֵ֨ד עַֽל הַ/מִּגְדָּ֜ל בְּ/יִזְרְעֶ֗אל וַ/יַּ֞רְא אֶת שִׁפְעַ֤ת יֵהוּא֙ בְּ/בֹא֔/וֹ וַ/יֹּ֕אמֶר שִׁפְעַ֖ת אֲנִ֣י רֹאֶ֑ה וַ/יֹּ֣אמֶר יְהוֹרָ֗ם קַ֥ח רַכָּ֛ב וּֽ/שְׁלַ֥ח לִ/קְרָאתָ֖/ם וְ/יֹאמַ֥ר הֲ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/017.yaml
  text: The watchman was standing on the tower in Jezreel[a], and he saw the company of Jehu as he came and said, “I see a company.” And Jehoram said, “Take a horseman and send him to meet them, and let him say, ‘Is it peace?’”
translation:
  language: fr
  text: 'La sentinelle se tenait sur la tour de Jizréel ; elle vit, à l’approche de Jéhu, une troupe et dit : « Je vois une troupe. » Joram ordonna : « Prends un cavalier et envoie-le à leur rencontre. Qu’il demande : “Est-ce la paix ?”[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement : « Est-ce que tout va bien ? »'
    reason: La question hébraïque très concise peut porter sur la situation générale aussi bien que sur des intentions pacifiques.
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: la sentinelle
  rationale: Désigne la personne chargée de guetter. « La sentinelle » convient naturellement à la scène sans introduire de connotation prophétique.
- source_word: עֹמֵד
  choice: se tenait
  rationale: Le participe présente une situation en cours servant d’arrière-plan au récit.
- source_word: הַמִּגְדָּל
  choice: la tour
  rationale: Reprend le sens simple du nom hébreu sans préciser « tour de guet », précision seulement contextuelle.
- source_word: בְּיִזְרְעֶאל
  choice: à Jizréel
  rationale: Forme française courante du nom de lieu ; la préposition « à » est idiomatique avec une ville.
- source_word: שִׁפְעַת
  choice: la troupe
  rationale: Dans ce contexte, le mot désigne un groupe visible de personnes. « Troupe » convient au cadre militaire sans déterminer exactement l’effectif.
- source_word: יֵהוּא
  choice: Jéhu
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: בְּבֹאוֹ
  choice: qui approchait
  rationale: Exprime naturellement en français que le groupe mené par Jéhu était en train d’arriver, tout en conservant la valeur circonstancielle de l’infinitif hébreu.
- source_word: שִׁפְעַת אֲנִי רֹאֶה
  choice: Je vois une troupe
  rationale: Conserve la répétition du nom employé dans la proposition précédente.
- source_word: קַח רַכָּב
  choice: Prends un cavalier
  rationale: Le singulier et la suite du récit indiquent un messager monté individuel plutôt que la cavalerie en général.
- source_word: וּשְׁלַח לִקְרָאתָם
  choice: et envoie-le à leur rencontre
  rationale: Conserve le suffixe pluriel du texte massorétique, qui renvoie au groupe aperçu.
- source_word: וְיֹאמַר
  choice: Qu’il demande
  rationale: Rend la valeur injonctive du verbe dans la suite de l’impératif. « Demande » explicite naturellement en français la fonction de la question rapportée.
- source_word: הֲשָׁלוֹם
  choice: Est-ce la paix ?
  rationale: Préserve la formulation brève, son ambiguïté entre bien-être et intention pacifique, ainsi que le motif répété de la paix dans le passage.
- source_word: יְהוֹרָם
  choice: Joram
  rationale: Forme française courante du nom royal hébreu Yehoram.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « troupe » et la question inhabituelle « Est-ce la paix ? » sont maintenues afin de préserver la texture et l’ambiguïté du texte hébreu. Le marqueur de note est placé après l’expression qu’il explique.
