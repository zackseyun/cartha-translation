  to: 'La sentinelle se tenait sur la tour de Jizréel ; elle vit, à l’approche de Jéhu, une troupe et dit : « Je vois une troupe. » Joram ordonna : « Prends un cavalier et envoie-le à leur rencontre. Qu’il demande : “Est-ce la paix ?”[a] »'
