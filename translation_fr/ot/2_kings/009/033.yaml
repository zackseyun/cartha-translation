  text: And he said[a], “Throw her down!” So they threw her down, and some of her blood spattered on the wall and on the horses, and he trampled her.
translation:
  language: fr
  text: 'Il dit : « Jetez-la en bas ! » Ils la jetèrent donc en bas. Une partie de son sang éclaboussa le mur et les chevaux, puis il la piétina.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שמטהו / וישמטוה
  choice: « Jetez-la en bas ! » / Ils la jetèrent donc en bas
  rationale: Le verbe שמט exprime ici l’ordre de faire tomber Jézabel de la fenêtre. La répétition de « jeter » conserve en français le lien lexical entre l’ordre et son exécution.
- source_word: ויז מדמה
  choice: Une partie de son sang éclaboussa
  rationale: La construction hébraïque, littéralement « il jaillit de son sang », a une valeur partitive. Cette formulation naturelle conserve à la fois l’idée d’une projection de sang et celle d’une quantité indéterminée.
- source_word: הקיר ואל הסוסים
  choice: le mur et les chevaux
  rationale: Traduction directe des deux éléments atteints par le sang, sans préciser davantage le rôle des chevaux.
- source_word: וירמסנה
  choice: puis il la piétina
  rationale: Le verbe רמס signifie « piétiner, fouler aux pieds ». Le sujet grammatical est au singulier et renvoie naturellement à Jéhu; la traduction ne précise pas le moyen employé, que le contexte peut suggérer.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. « En bas » rend explicite la direction imposée par la scène, tandis que « piétina » préserve la violence concise du texte hébreu sans ajouter que Jéhu agit personnellement à pied ou au moyen de chevaux.
