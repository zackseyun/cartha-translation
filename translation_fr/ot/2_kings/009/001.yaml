  variant: modern international French
source:
  edition: WLC
  text: וֶ/אֱלִישָׁע֙ הַ/נָּבִ֔יא קָרָ֕א לְ/אַחַ֖ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים וַ/יֹּ֨אמֶר ל֜/וֹ חֲגֹ֣ר מָתְנֶ֗י/ךָ וְ֠/קַח פַּ֣ךְ הַ/שֶּׁ֤מֶן הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וְ/לֵ֖ךְ רָמֹ֥ת גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/001.yaml
  text: Then Elisha the prophet called one of the sons of the prophets and said to him[a], “Gird up your loins, take this flask of oil in your hand[b], and go to Ramoth-gilead.”
translation:
  language: fr
  text: 'Alors Élisée, le prophète, appela l’un des membres du groupe des prophètes[a] et lui dit : « Relève les pans de ton vêtement et attache-les à ta taille[b], prends cette fiole d’huile en main et va à Ramoth-Galaad. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’un des fils des prophètes ». Cette expression désigne les membres d’un groupe de prophètes, et non nécessairement leurs fils biologiques.'
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « Ceins tes reins ». Il fallait relever et attacher un vêtement ample autour de la taille pour se préparer à agir ou à voyager rapidement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִישָׁע הַנָּבִיא
  choice: Alors Élisée, le prophète
  rationale: La conjonction fait progresser le récit. « Alors » rend naturellement cette succession narrative, tandis que l’apposition conserve le titre défini d’Élisée.
- source_word: קָרָא לְאַחַד
  choice: appela l’un
  rationale: Rend directement le verbe « appeler » et la construction partitive « l’un de » sans renforcer indûment le sens en « convoqua ».
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: des membres du groupe des prophètes
  rationale: L’expression hébraïque littérale « fils des prophètes » désigne ici les membres d’un groupe prophétique. La formulation retenue évite de suggérer une filiation biologique tout en conservant le terme « prophètes ».
- source_word: וַיֹּאמֶר לוֹ
  choice: et lui dit
  rationale: Formule française directe et naturelle pour introduire les paroles rapportées.
- source_word: חֲגֹר מָתְנֶיךָ
  choice: Relève les pans de ton vêtement et attache-les à ta taille
  rationale: 'Explicite en français moderne le geste concret exprimé par l’idiome hébreu : ajuster un vêtement ample autour de la taille afin d’être prêt à agir ou à voyager.'
- source_word: וְקַח פַּךְ הַשֶּׁמֶן הַזֶּה בְּיָדֶךָ
  choice: prends en main cette fiole d’huile
  rationale: « Fiole » convient à un petit récipient destiné à contenir de l’huile. « Prends en main » conserve l’image concrète de בְּיָדֶךָ sans lourdeur.
- source_word: וְלֵךְ רָמֹת גִּלְעָד
  choice: et va à Ramoth-de-Galaad
  rationale: Rend simplement l’impératif et emploie une forme française courante du nom de lieu.
theological_decisions:
- issue: Identité des « fils des prophètes »
  choice: membres du groupe des prophètes
  alternative: fils des prophètes
  rationale: Le contexte institutionnel de l’expression est rendu sans imposer une filiation biologique. Une note signale toutefois la forme littérale et préserve la transparence envers l’hébreu.
translation_notes:
  register: 'Français international moderne, naturel et digne. La traduction privilégie une équivalence optimale : elle explicite deux idiomes hébreux qui seraient obscurs ou trompeurs s’ils étaient reproduits mot à mot, tout en donnant leurs formes littérales en notes.'
