base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/028.yaml
  text: His servants carried him to Jerusalem and buried him in his tomb with his fathers in the city of David[a][b].
translation:
  language: fr
  text: Ses serviteurs le transportèrent à Jérusalem et l’ensevelirent dans son tombeau, avec ses pères, dans la cité de David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Avec ses pères » est une expression funéraire hébraïque qui signifie ici : parmi ses ancêtres de la lignée royale.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: le transportèrent
  rationale: Le hiphil de רכב signifie littéralement « firent monter » ou « firent transporter ». Puisqu’il s’agit du corps d’Ahazia, « le transportèrent » exprime naturellement le déplacement sans laisser entendre qu’il voyageait vivant.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עבד désigne couramment un serviteur et peut aussi viser un membre du service royal. « Ses serviteurs » reste direct et convient au contexte.
- source_word: יְרוּשָׁלָמָה
  choice: à Jérusalem
  rationale: La terminaison directionnelle indique un mouvement vers Jérusalem, rendu naturellement par « à Jérusalem ».
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: et l’ensevelirent
  rationale: « Ensevelir » rend ici l’acte de déposer le défunt dans son lieu de sépulture et s’accorde avec le registre narratif biblique moderne.
- source_word: בִקְבֻרָתוֹ
  choice: dans son tombeau
  rationale: Le nom désigne ici le lieu où il est enterré. « Tombeau » convient au contexte royal.
- source_word: עִם אֲבֹתָיו
  choice: avec ses pères
  rationale: Cette formulation conserve l’idiome funéraire hébreu et sa portée dynastique; une note en explicite le sens.
- source_word: בְּעִיר דָּוִד
  choice: dans la cité de David
  rationale: Rendu conventionnel du nom de lieu, avec « cité » qui désigne ici le secteur historique appelé cité de David.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. « Transportèrent » évite l’ambiguïté potentiellement trompeuse d’une traduction littérale telle que « firent monter », tandis que « avec ses pères » préserve l’idiome hébreu, expliqué en note.
