base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/021.yaml
  text: Then Jehoram said[a], “Harness!” and they harnessed his chariot. Then Jehoram king of Israel and Ahaziah king of Judah went out, each in his chariot, to meet Jehu, and they found him in the plot of land of Naboth the Jezreelite.
translation:
  language: fr
  text: 'Alors Joram dit : « Attelle ! » Alors on attela son char.[a] Joram, roi d’Israël, et Ochozias, roi de Juda, partirent chacun dans son char à la rencontre de Jéhu. Ils le trouvèrent sur la parcelle de Naboth, le Jizréélite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit formellement : « il attela son char ». La tournure peut désigner l’exécution de l’ordre par un subordonné.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹר
  choice: Attelez !
  rationale: Dans le contexte d’un char, le verbe désigne l’action d’atteler l’équipe au véhicule. L’impératif français est bref et rend l’urgence de l’ordre royal.
- source_word: וַיֶּאְסֹר רִכְבּוֹ
  choice: Et l’on attela son char
  rationale: L’hébreu porte formellement un verbe masculin singulier, « il attela son char », probablement avec un sens indéfini renvoyant au serviteur chargé d’exécuter l’ordre. La tournure avec « l’on » reste naturelle en français sans suggérer que le roi l’attela lui-même.
- source_word: אִישׁ בְּרִכְבּוֹ
  choice: chacun sur son char
  rationale: 'אִישׁ a ici une valeur distributive : chacun des deux rois se déplace sur son propre char.'
- source_word: לִקְרַאת יֵהוּא
  choice: à la rencontre de Jéhu
  rationale: La locution exprime normalement le fait de sortir ou d’avancer pour rencontrer quelqu’un.
- source_word: וַיִּמְצָאֻהוּ
  choice: Ils le trouvèrent
  rationale: מצא peut signifier trouver ou rencontrer. « Trouvèrent » conserve simplement la formulation narrative sans préciser davantage la nature de la rencontre.
- source_word: בְּחֶלְקַת נָבוֹת
  choice: sur la parcelle de terre de Naboth
  rationale: חֶלְקָה désigne une parcelle ou une propriété foncière délimitée. « Parcelle de terre » maintient la nuance juridique et narrative liée à l’affaire de Naboth.
- source_word: הַיִּזְרְעֵאלִי
  choice: de Jizréel
  rationale: Le gentilé hébreu identifie Naboth par son lieu d’origine. « De Jizréel » est plus immédiatement compréhensible en français moderne que « le Jizréélite ».
