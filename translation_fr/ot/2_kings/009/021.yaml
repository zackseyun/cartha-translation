translation_notes:
  register: Français international moderne, narratif et digne. Les noms Joram, Ochozias et Jéhu suivent les formes françaises bibliques courantes. L’impératif pluriel « Attelez ! » exprime naturellement en français un ordre adressé au personnel, tandis que la note conserve la forme grammaticale singulière de l’hébreu.
