  source_fidelity: L’impératif hébreu אֱסֹר est au singulier. « Attelez ! » le transforme en ordre pluriel. La forme narrative suivante est grammaticalement « il attela son char », mais le français « on attela son char » rend naturellement l’exécution de l’ordre sans affirmer que Joram a lui-même attelé. Le gentilé הַיִּזְרְעֵאלִי mérite d’être conservé plutôt que réduit à une simple origine géographique.
  naturalness: « Attelle ! » est un ordre bref et naturel, adressé à un subordonné singulier. « Chacun dans son char » rend plus directement la distribution exprimée par l’hébreu. « Naboth, le Jizréélite » est clair dans un registre biblique moderne et conserve l’identification du personnage.
  terminology: Les formes Joram, Ochozias et Jéhu sont cohérentes avec l’usage biblique français. « Parcelle » rend bien חלקה. « Le Jizréélite » restitue le gentilé sans surcharge interprétative.
