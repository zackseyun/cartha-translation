  text: וַ/יֵּלְכ֖וּ לְ/קָבְרָ֑/הּ וְ/לֹא מָ֣צְאוּ בָ֗/הּ כִּ֧י אִם הַ/גֻּלְגֹּ֛לֶת וְ/הָ/רַגְלַ֖יִם וְ/כַפּ֥וֹת הַ/יָּדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/035.yaml
  text: So they went to bury her[a], but they found nothing of her except the skull, the feet, and the palms of the hands.
translation:
  language: fr
  text: Ils allèrent donc l’enterrer, mais ils ne trouvèrent d’elle que le crâne, les pieds et les paumes des mains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Ils allèrent donc
  rationale: Le wayyiqtol fait progresser le récit; « donc » exprime naturellement en français la suite logique de l’ordre donné au verset précédent.
- source_word: לְקָבְרָהּ
  choice: l’enterrer
  rationale: L’infinitif construit de קבר avec suffixe féminin singulier renvoie à Jézabel. Cette formulation est directe et idiomatique.
- source_word: וְלֹא מָצְאוּ בָהּ
  choice: mais ils ne trouvèrent d’elle
  rationale: La coordination prend ici une valeur adversative. « D’elle » rend l’idée de ce qui subsistait de son corps tout en conservant la tournure inhabituelle et saisissable de l’hébreu.
- source_word: כִּי אִם
  choice: que
  rationale: Après la négation, « ne… que » rend avec concision la locution exceptive hébraïque.
- source_word: הַגֻּלְגֹּלֶת
  choice: le crâne
  rationale: גֻּלְגֹּלֶת désigne précisément le crâne, et non la tête entière.
- source_word: וְהָרַגְלַיִם
  choice: les pieds
  rationale: Le duel רַגְלַיִם a ici son sens anatomique ordinaire de « pieds ».
- source_word: וְכַפּוֹת הַיָּדָיִם
  choice: les paumes des mains
  rationale: כַּפּוֹת précise les paumes ou parties creuses des mains; la traduction garde cette précision anatomique.
