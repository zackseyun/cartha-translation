base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/029.yaml
  text: In the eleventh year of Joram son of Ahab[a], Ahaziah became king over Judah.
translation:
  language: fr
  text: La onzième année du règne de Joram, fils d’Achab[a], Achazia devint roi de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les indications chronologiques concernant les règnes de Joram et d’Achazia sont difficiles à harmoniser entre les livres des Rois et des Chroniques. La présente traduction rend l’hébreu tel qu’il est écrit, sans chercher à résoudre la chronologie dans le corps du texte.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת אַחַת עֶשְׂרֵה שָׁנָה
  choice: La onzième année du règne de
  rationale: La formule hébraïque indique une date selon l’année de règne d’un roi. L’ajout explicatif « du règne de » est naturel en français et rend clairement la valeur chronologique du לְ.
- source_word: לְיוֹרָם
  choice: de Joram
  rationale: Dans cette formule royale, la préposition לְ établit le règne de Joram comme repère chronologique.
- source_word: בֶּן אַחְאָב
  choice: fils d’Akab
  rationale: Le patronyme identifie Joram. « Akab » est une forme française établie du nom hébreu אַחְאָב.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette notice d’accession, le verbe marque l’entrée en fonction plutôt que l’ensemble du règne.
- source_word: אֲחַזְיָה
  choice: Achazia
  rationale: Forme française courante du nom hébreu אֲחַזְיָה.
- source_word: עַל יְהוּדָה
  choice: de Juda
  rationale: Avec le verbe « devenir roi », le français idiomatique dit « roi de Juda »; cela exprime fidèlement l’autorité exercée sur le royaume.
theological_decisions:
- issue: Difficulté d’harmonisation chronologique
  choice: Conserver sans correction la onzième année indiquée par le texte hébreu
  alternative: Modifier ou expliquer la date dans le corps du verset pour l’harmoniser avec d’autres notices de Rois et Chroniques
  rationale: La traduction doit rendre le texte hébreu tel qu’il est transmis et préserver la tension chronologique, sans imposer une solution conjecturale.
translation_notes:
  register: Français moderne, clair et digne. La formulation « La onzième année du règne de » explicite naturellement la formule de datation royale; « devint roi de Juda » évite le tour moins idiomatique « régna sur Juda » lorsqu’il s’agit précisément de l’accession.
