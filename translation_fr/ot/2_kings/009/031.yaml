  text: וְ/יֵה֖וּא בָּ֣א בַ/שָּׁ֑עַר וַ/תֹּ֣אמֶר הֲ/שָׁל֔וֹם זִמְרִ֖י הֹרֵ֥ג אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/031.yaml
  text: As Jehu came into the gate[a], she said, “Is it peace, Zimri[c][b], murderer of his master?”
translation:
  language: fr
  text: 'Quand Jéhu entra par la porte, elle dit : « Est-ce la paix[a], Zimri[b], meurtrier[c] de son maître ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tout va-t-il bien ? »'
    reason: lexical_alternative
  - marker: b
    text: Jézabel appelle Jéhu « Zimri » pour l’insulter, en le comparant à Zimri, qui avait tué son maître et s’était emparé du trône (voir 1 Rois 16.9-20).
    reason: cross_reference
  - marker: c
    text: 'Littéralement : « celui qui tue ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא בַשָּׁעַר
  choice: franchissait la porte
  rationale: L’expression décrit l’entrée de Jéhu par la porte de la ville. « Franchissait la porte » rend naturellement le mouvement exprimé en hébreu sans ajouter explicitement « de la ville », que le contexte permet de comprendre.
- source_word: וַתֹּאמֶר
  choice: elle dit
  rationale: Le verbe féminin singulier renvoie à Jézabel dans le contexte immédiat ; le pronom explicite est nécessaire en français.
- source_word: הֲשָׁלוֹם
  choice: Est-ce la paix
  rationale: Cette formulation conserve la brièveté et l’ambiguïté de la question hébraïque, qui peut porter sur la paix, la sécurité ou le fait que tout aille bien.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Le nom est conservé selon sa forme française traditionnelle. Dans la bouche de Jézabel, il fonctionne comme une comparaison insultante avec l’ancien usurpateur.
- source_word: הֹרֵג
  choice: meurtrier de
  rationale: Le participe signifie littéralement « celui qui tue ». « Meurtrier » exprime en français courant la force accusatrice de l’apostrophe.
- source_word: אֲדֹנָיו
  choice: son maître
  rationale: Le terme désigne ici un supérieur humain. « Maître » préserve le pronom singulier ambigu de l’hébreu et évite une confusion avec un titre divin.
theological_decisions:
- issue: Portée de l’appellation « Zimri, meurtrier de son maître »
  choice: La rendre comme une apostrophe sarcastique par laquelle Jézabel assimile Jéhu à Zimri.
  alternative: Comprendre « Zimri » comme une simple désignation directe, sans expliciter l’allusion historique.
  rationale: 'Le contexte de 1 Rois 16.9-20 éclaire l’insulte : Zimri avait tué son maître et pris le pouvoir. Le texte principal conserve toutefois l’apostrophe telle quelle, tandis que la note explique l’allusion sans imposer davantage d’interprétation.'
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « Est-ce la paix » garde la tension et l’étrangeté expressive de l’hébreu, tandis que les notes donnent les équivalents plus idiomatiques et expliquent l’allusion historique.
