  text: And the dogs will eat Jezebel in the territory of Jezreel[a], and there will be no one to bury her.” Then he opened the door and fled.
translation:
  language: fr
  text: Les chiens mangeront Jézabel dans le domaine de Jizréel[a], et personne ne l’enterrera. » Puis il ouvrit la porte et s’enfuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la parcelle de Jizréel » ou « dans le territoire de Jizréel ». Le mot hébreu חֵלֶק désigne une étendue, une portion ou une parcelle de terre.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאכְלוּ
  choice: mangeront
  rationale: Rend directement le futur simple du verbe אכל dans cette annonce prophétique, sans ajouter l’intensité de « dévoreront ».
- source_word: הַכְּלָבִים
  choice: les chiens
  rationale: Conserve l’article défini de l’hébreu et le caractère concret de l’annonce de jugement.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: sur le terrain de Jizréel
  rationale: חֵלֶק désigne ici une étendue ou une parcelle de terre. « Terrain » reste naturel en français et convient au cadre local, tout en laissant en note les autres nuances possibles.
- source_word: וְאֵין קֹבֵר
  choice: et personne ne l’enterrera
  rationale: L’hébreu dit littéralement qu’il n’y a personne qui enterre. Le pronom objet, implicite dans le contexte, est explicité en français; le futur correspond à l’annonce prophétique.
- source_word: וַיִּפְתַּח הַדֶּלֶת
  choice: Puis il ouvrit la porte
  rationale: « Puis » traduit naturellement la progression narrative du wayyiqtol.
- source_word: וַיָּנֹס
  choice: et s’enfuit
  rationale: נוס exprime la fuite; « s’enfuit » garde la brièveté et l’urgence de la narration.
- source_word: אִיזֶבֶל
  choice: Jézabel
  rationale: Forme française usuelle du nom propre biblique.
- source_word: יִזְרְעֶאל
  choice: Jizréel
  rationale: Forme française biblique largement attestée et distincte de Jézabel.
