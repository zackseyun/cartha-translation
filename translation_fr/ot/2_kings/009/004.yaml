  text: So the young man, the young prophet, went to Ramoth-gilead.
translation:
  language: fr
  text: Le jeune homme, le jeune homme du prophète[a], partit donc pour Ramoth-de-Galaad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète « le jeune homme » : littéralement, « le jeune homme, le jeune homme du prophète ». Cette seconde expression peut désigner le jeune assistant du prophète.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: partit donc
  rationale: Le wayyiqtol fait avancer le récit. « Partit donc » exprime naturellement en français la conséquence de l’ordre donné au verset précédent.
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: נַעַר désigne ici le jeune homme envoyé par Élisée; cette traduction conserve l’indication d’âge sans lui attribuer une fonction absente du terme lui-même.
- source_word: הַנַּעַר הַנָּבִיא
  choice: le jeune prophète
  rationale: La seconde expression est apposée à la première et identifie le jeune homme comme prophète. La formulation retenue conserve aussi la répétition marquée de הַנַּעַר dans l’hébreu.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth-de-Galaad
  rationale: Forme française conventionnelle du nom de lieu composé, claire pour le lectorat moderne.
theological_decisions:
- issue: Statut du jeune homme
  choice: « le jeune prophète », qui présente le messager lui-même comme prophète
  alternative: « le serviteur du prophète », qui ferait de lui le serviteur d’un autre prophète
  rationale: Les deux groupes nominaux définis הַנַּעַר הַנָּבִיא se lisent naturellement en apposition (« le jeune homme, le prophète »), lecture également soutenue par les anciennes versions. La traduction évite donc d’introduire une relation possessive qui n’est pas explicitement marquée.
translation_notes:
  register: Français moderne, simple et digne. La répétition inhabituelle est maintenue dans le texte afin de refléter l’insistance de l’hébreu, puis explicitée en note.
