  text: וַ/יָּבֹ֖א וַ/יֹּ֣אכַל וַ/יֵּ֑שְׁתְּ וַ/יֹּ֗אמֶר פִּקְדוּ נָ֞א אֶת הָ/אֲרוּרָ֤ה הַ/זֹּאת֙ וְ/קִבְר֔וּ/הָ כִּ֥י בַת מֶ֖לֶךְ הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/034.yaml
  text: Then he went in and ate and drank[a], and he said, “Please see to this cursed woman and bury her, for she is a king’s daughter.”
translation:
  language: fr
  text: 'Puis il entra, mangea et but. Ensuite il dit : « Veuillez vous occuper de cette femme maudite[a] et l’enterrer, car elle est fille de roi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de cette maudite » ; l’hébreu emploie une forme féminine substantivée sans exprimer le mot « femme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Puis il entra
  rationale: Dans ce contexte narratif, בוא décrit l’entrée de Jéhu dans la demeure ou le palais. « Il entra » est direct et naturel en français.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: mangea et but
  rationale: Les deux verbes n’ont pas de complément exprimé en hébreu ; la traduction n’ajoute donc ni nourriture ni vin.
- source_word: פִּקְדוּ נָא
  choice: Veuillez vous occuper de
  rationale: פקד signifie ici prêter attention à quelqu’un et prendre en charge ce qui doit être fait. « Veuillez » rend naturellement la nuance de נָא dans un ordre formulé avec retenue.
- source_word: הָאֲרוּרָה הַזֹּאת
  choice: cette femme maudite
  rationale: La forme féminine désigne Jézabel. Le nom « femme » est explicité pour obtenir une formulation française claire, tandis que « maudite » conserve la force du terme hébreu.
- source_word: וְקִבְרוּהָ
  choice: et l’enterrer
  rationale: L’infinitif coordonné après « veuillez » rend naturellement le second impératif hébreu et son suffixe féminin.
- source_word: כִּי בַת מֶלֶךְ הִיא
  choice: car elle est fille de roi
  rationale: La proposition donne le motif de l’ensevelissement. « Fille de roi » conserve l’absence d’article et met l’accent sur le rang royal sans préciser l’identité du roi.
