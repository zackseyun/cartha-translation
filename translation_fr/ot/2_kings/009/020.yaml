  text: וַ/יַּגֵּ֤ד הַ/צֹּפֶה֙ לֵ/אמֹ֔ר בָּ֥א עַד אֲלֵי/הֶ֖ם וְ/לֹֽא שָׁ֑ב וְ/הַ/מִּנְהָ֗ג כְּ/מִנְהַג֙ יֵה֣וּא בֶן נִמְשִׁ֔י כִּ֥י בְ/שִׁגָּע֖וֹן יִנְהָֽג־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/020.yaml
  text: And the watchman reported[a], saying, “He came up to them, but he has not returned; and the driving is like the driving of Jehu son of Nimshi, for he drives madly.”
translation:
  language: fr
  text: 'Le guetteur fit son rapport : « Il les a rejoints, mais il ne revient pas. La façon de conduire ressemble à celle de Jéhu, fils de Nimshi, car il conduit comme un fou.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il conduit avec frénésie » ou « il conduit comme un dément ». L’hébreu souligne sa manière effrénée et téméraire de conduire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד הַצֹּפֶה
  choice: Le guetteur fit son rapport
  rationale: Dans ce contexte militaire, « guetteur » désigne naturellement l’homme posté pour observer, et « fit son rapport » rend la communication officielle exprimée par נגד.
- source_word: לֵאמֹר
  choice: ': « … »'
  rationale: En français actuel, les deux-points introduisant le discours direct rendent naturellement la formule hébraïque sans le lourd « en disant ».
- source_word: בָּא עַד אֲלֵיהֶם
  choice: Il les a rejoints
  rationale: La combinaison בוא עד אל indique que le messager est arrivé jusqu’au groupe; « rejoindre » exprime clairement ce contact.
- source_word: וְלֹא שָׁב
  choice: mais il ne revient pas
  rationale: 'Le présent traduit le constat actuel du guetteur : après les avoir rejoints, le messager ne fait pas retour.'
- source_word: וְהַמִּנְהָג כְּמִנְהַג
  choice: La façon de conduire ressemble à celle de
  rationale: Cette formulation française naturelle conserve la comparaison portant sur la manière de conduire, sans répétition maladroite.
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: Jéhu, fils de Nimshi
  rationale: Les noms propres suivent leur forme française usuelle ou une translittération claire; le patronyme est conservé.
- source_word: כִּי בְשִׁגָּעוֹן יִנְהָג
  choice: car il conduit comme un fou
  rationale: Le substantif שִׁגָּעוֹן employé adverbialement décrit une conduite frénétique ou déraisonnable; cette expression conserve la vigueur de l’image.
