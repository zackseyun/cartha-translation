base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/024.yaml
  text: And Jehu drew his bow full and struck Jehoram between his arms[a], and the arrow came out through his heart, and he collapsed in his chariot.
translation:
  language: fr
  text: Jéhu banda son arc de toute sa force et atteignit Joram entre les bras[a]. La flèche ressortit par son cœur, et il s’affaissa dans son char.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entre les épaules » ou « entre les omoplates ». L’hébreu dit littéralement « entre ses bras », expression qui peut désigner ici le haut du dos ou la région des épaules.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא יָדוֹ בַקֶּשֶׁת
  choice: banda son arc de toute sa force
  rationale: L’expression hébraïque signifie littéralement « remplir sa main avec l’arc » et décrit vraisemblablement l’action de tirer pleinement l’arc. Cette formulation française en restitue naturellement l’intensité.
- source_word: וַיַּךְ
  choice: atteignit
  rationale: Le verbe נכה signifie largement « frapper ». Dans ce contexte de tir à l’arc, « atteignit » exprime clairement l’impact sans remplacer le verbe par « décocha » ou préciser davantage que l’hébreu.
- source_word: בֵּין זְרֹעָיו
  choice: entre les bras
  rationale: זְרוֹעַ désigne normalement le bras. La traduction principale conserve la formulation hébraïque, malgré son imprécision anatomique, tandis que la note présente l’interprétation contextuelle possible.
- source_word: וַיֵּצֵא הַחֵצִי מִלִּבּוֹ
  choice: La flèche lui ressortit par le cœur
  rationale: Le texte décrit la sortie de la flèche depuis la région du cœur. « Ressortit par le cœur » rend le mouvement et la blessure mortelle sans effacer l’image concrète de l’hébreu.
- source_word: וַיִּכְרַע
  choice: il s’affaissa
  rationale: כרע évoque le fait de plier ou de s’effondrer. « S’affaissa » convient au corps de Joram qui cède après le coup mortel et garde une tonalité narrative digne.
- source_word: בְּרִכְבּוֹ
  choice: dans son char
  rationale: Le suffixe possessif renvoie au char de Joram. « Dans son char » est direct et naturel en français.
theological_decisions: []
translation_notes:
  register: 'Français moderne, narratif et digne. La traduction privilégie une équivalence optimale : elle rend naturellement l’idiome du tir à l’arc, tout en conservant dans le texte l’expression anatomique ambiguë « entre les bras » et en l’éclairant par une note.'
