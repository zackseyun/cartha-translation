  yaml_path: translation/ot/2_kings/009/019.yaml
  text: 'So he sent a second horseman[a], and he came to them and said, “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.”'
translation:
  language: fr
  text: 'Il envoya un deuxième cavalier. Celui-ci arriva auprès d’eux et dit : « Ainsi parle le roi : Est-ce la paix[a] ? » Mais Jéhu répondit : « Qu’as-tu à voir avec la paix ? Mets-toi derrière moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Est-ce que tout va bien ? » Le terme hébreu peut désigner la paix, le bien-être ou une situation favorable.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב סוּס שֵׁנִי
  choice: un deuxième cavalier
  rationale: L’expression désigne littéralement un second homme monté à cheval. « Un deuxième cavalier » est naturel en français et convient au rôle de messager.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Ainsi parle le roi
  rationale: Cette formulation conserve le caractère solennel de la formule hébraïque du messager tout en restant claire en français moderne.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: Le terme peut désigner la paix, le bien-être ou une situation favorable. « La paix » préserve sa répétition dans la question du roi et la réplique de Jéhu.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: Qu’as-tu à voir avec la paix ?
  rationale: Cette tournure française rend l’expression idiomatique hébraïque et son ton brusque, sans effacer la répétition de « paix ».
- source_word: סֹב אֶל אַחֲרָי
  choice: Passe derrière moi
  rationale: L’hébreu ordonne au cavalier de se détourner pour prendre place derrière Jéhu. Cette traduction reste proche de l’indication spatiale sans expliciter davantage par « suis-moi ».
