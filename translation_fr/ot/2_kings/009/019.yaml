  source_fidelity: 'Le sens général est fidèle : le second cavalier est envoyé, transmet la question royale, et Jéhu rejette sa préoccupation de la « paix ». La répétition de « paix » rend bien la répétition de שָׁלוֹם. Toutefois, « Passe derrière moi » évoque plus naturellement le fait de passer physiquement derrière quelqu’un ; dans ce contexte, l’impératif ordonne au cavalier de se placer derrière Jéhu, c’est-à-dire de se joindre à son groupe.'
