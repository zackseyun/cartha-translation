base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/023.yaml
  text: Then Jehoram turned his hands and fled[a], and said to Ahaziah, “Treachery[b], Ahaziah!”
translation:
  language: fr
  text: 'Alors Joram fit demi-tour avec son char[a] et s’enfuit. Il dit à Ochozias : « Trahison[b], Ochozias ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tourna ses mains ». Dans le contexte, l’expression désigne probablement la manœuvre par laquelle il fit tourner son char, mais l’hébreu ne mentionne explicitement ni le char ni les rênes ici.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Tromperie » ou « Perfidie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ יָדָיו
  choice: fit faire demi-tour à son char
  rationale: Littéralement, l’expression évoque le fait de « tourner ses mains ». Dans cette scène où Joram conduit un char, elle désigne vraisemblablement la manœuvre par laquelle il le fait tourner. La formulation française rend naturellement l’action tout en signalant en note ce qui est explicite ou implicite dans l’hébreu.
- source_word: וַיָּנֹס
  choice: s’enfuit
  rationale: Le verbe נוס exprime ici une fuite urgente; « s’enfuit » est direct et naturel dans un récit.
- source_word: מִרְמָה
  choice: Trahison
  rationale: Le nom peut désigner la tromperie, la perfidie ou la trahison. Dans la bouche d’un roi qui comprend l’hostilité de Jéhu, « Trahison ! » restitue bien la force de l’alarme sans employer le terme juridiquement plus précis « haute trahison ».
- source_word: אֲחַזְיָהוּ / אֲחַזְיָה
  choice: Ochozias
  rationale: Forme française traditionnelle et largement reconnue du nom biblique; la répétition vocative finale est conservée pour rendre l’urgence de l’hébreu.
- source_word: וַיֹּאמֶר אֶל אֲחַזְיָהוּ ... אֲחַזְיָה
  choice: 'Il dit à Ochozias : « Trahison, Ochozias ! »'
  rationale: La syntaxe du discours direct et la répétition du nom de l’interlocuteur sont préservées.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Fit faire demi-tour à son char » privilégie la clarté contextuelle, tandis que la note conserve l’expression concrète et ambiguë de l’hébreu. Le nom royal est rendu par la forme française usuelle « Joram » et le nom de son interlocuteur par « Ochozias ».
