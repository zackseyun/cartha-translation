  text: וַ/יָּשָׁב֩ יְהוֹרָ֨ם הַ/מֶּ֜לֶךְ לְ/הִתְרַפֵּ֣א בִ/יְזְרְעֶ֗אל מִן הַ/מַּכִּים֙ אֲשֶׁ֣ר יַכֻּ֣/הוּ אֲרַמִּ֔ים בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/יֹּ֤אמֶר יֵהוּא֙ אִם יֵ֣שׁ נַפְשְׁ/כֶ֔ם אַל יֵצֵ֤א פָלִיט֙ מִן הָ/עִ֔יר לָ/לֶ֖כֶת ל/גיד בְּ/יִזְרְעֶֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/015.yaml
  text: King Jehoram had returned to Jezreel to recover from the wounds that the Arameans had inflicted on him when he fought against Hazael king of Aram. Jehu said, “If this is your wish, let no one escape from the city to go and report it in Jezreel.”
translation:
  language: fr
  text: 'Le roi Joram était retourné à Jizréel pour se remettre des blessures que les Araméens lui avaient infligées pendant qu’il combattait Hazaël, roi d’Aram. Jéhu dit : « Si vous le voulez, que personne ne s’échappe de la ville pour aller porter la nouvelle à Jizréel. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: était retourné
  rationale: Le plus-que-parfait situe naturellement ce retour avant les paroles de Jéhu, tandis que « retourner » rend le sens simple de שוב.
- source_word: לְהִתְרַפֵּא
  choice: pour se remettre
  rationale: Dans ce contexte de blessures, le hitpael de רפא désigne le rétablissement; cette tournure française est naturelle sans suggérer que Joram se guérit lui-même.
- source_word: מִן הַמַּכִּים אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: des blessures que les Araméens lui avaient infligées
  rationale: Les « coups » sont ici des blessures de guerre. « Infliger des blessures » exprime clairement l’action de נכה et conserve l’antériorité.
- source_word: אֲרַמִּים
  choice: les Araméens
  rationale: Ce terme historique correspond au peuple d’Aram et évite l’anachronisme possible de « Syriens ».
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָאֵל
  choice: pendant qu’il combattait Hazaël
  rationale: L’infinitif avec ב indique la circonstance temporelle; avec « combattre » transitif, le français exprime naturellement l’affrontement contre Hazaël.
- source_word: אִם יֵשׁ נַפְשְׁכֶם
  choice: Si telle est votre volonté
  rationale: L’expression idiomatique porte sur la volonté ou le consentement du groupe; la formulation choisie est claire, actuelle et digne.
- source_word: אַל יֵצֵא פָלִיט מִן הָעִיר
  choice: que personne ne s’échappe de la ville
  rationale: פָלִיט désigne ici quiconque réussirait à s’enfuir, et non une catégorie établie de fugitifs ou de survivants.
- source_word: לָלֶכֶת לְהַגִּיד בְּיִזְרְעֶאל
  choice: pour aller porter la nouvelle à Jizréel
  rationale: Les deux infinitifs décrivent le déplacement destiné à transmettre l’information; « porter la nouvelle » est idiomatique en français et le contexte fournit le contenu sous-entendu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les formes françaises usuelles Joram, Jizréel, Jéhu et Hazaël sont retenues. Aucun marqueur discursif équivalent à « maintenant » n’est ajouté, et aucune note n’est nécessaire.
