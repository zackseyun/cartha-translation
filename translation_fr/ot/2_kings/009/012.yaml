base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/012.yaml
  text: 'And they said[a], “That is a lie. Please tell us.” So he said, “Thus and thus he said to me, saying, ‘Thus says Yahweh: I have anointed you king over Israel.’”'
translation:
  language: fr
  text: 'Ils lui dirent : « C’est faux ! Dis-nous, je t’en prie. » Il répondit : « Il m’a dit telle et telle chose[a] : “Ainsi parle Yahweh : Je t’ai oint roi sur Israël.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme ceci et comme cela » ; expression désignant un résumé indéfini ou partiel, plutôt qu’une citation mot à mot. On peut aussi rendre : « telles et telles choses ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: C’est faux !
  rationale: Le nom hébreu signifie « mensonge, fausseté ». Dans cet échange abrupt, « C’est faux ! » rend naturellement l’accusation selon laquelle Jéhu dissimule le véritable message.
- source_word: הַגֶּד נָא לָנוּ
  choice: Dis-nous donc ce qu’il t’a dit
  rationale: L’impératif hiphil de נגד signifie « raconter, déclarer » et נָא exprime ici une insistance polie. Le complément explicité en français découle du contexte immédiat et évite une formulation artificiellement elliptique.
- source_word: כָּזֹאת וְכָזֹאת
  choice: telle et telle chose
  rationale: Cette locution donne un résumé indéfini ou partiel des propos, plutôt qu’une citation mot à mot. La note conserve l’ambiguïté entre résumé vague et formule « telle et telle chose ».
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Cette formulation conserve la cadence solennelle de la formule prophétique de messager tout en restant idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu directement par « Yahweh », conformément au nom divin présent dans le texte hébreu.
- source_word: מְשַׁחְתִּיךָ
  choice: Je t’ai consacré par l’onction
  rationale: Le verbe משׁח signifie « oindre ». Cette expression française moderne préserve l’acte concret de l’onction ainsi que sa portée royale et théologique.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: comme roi sur Israël
  rationale: La préposition ל marque la nomination à la fonction royale, tandis que אֶל exprime ici l’autorité exercée sur Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le représente sans le remplacer par un titre.
- issue: Portée royale de משׁח
  choice: consacré par l’onction comme roi
  alternative: oint roi
  rationale: Le choix retenu garde l’image et la signification de l’onction royale dans une langue accessible, sans réduire le verbe à une consécration générique.
translation_notes:
  register: Français international moderne, digne et narratif. Le dialogue demeure vif ; la formule prophétique conserve une solennité mesurée. Le tour « consacré par l’onction » évite l’opacité possible de « oint » pour certains lecteurs tout en préservant le terme théologique.
