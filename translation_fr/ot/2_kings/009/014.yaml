review_pass:
  verdict: revise
  source_fidelity: 'La relation généalogique répétée בן ... בן est mieux conservée par « fils de Josaphat, fils de Nimshi » que par « fils de Josaphat et petit-fils de Nimshi ». La construction היה + participe décrit l''arrière-plan narratif : l''imparfait français « montait la garde » le rend plus exactement et plus naturellement que le plus-que-parfait « avait monté la garde ».'
  naturalness: « Conspira contre » est une formulation moderne, directe et idiomatique; « forma une conspiration » est possible mais inutilement lourde. « Lui et tout Israël » maintient explicitement les deux éléments du sujet hébreu tout en restant naturel.
  terminology: Les formes Jéhu, Josaphat, Joram, Nimshi, Ramoth en Galaad, Hazaël et Aram sont appropriées. « Aram » rend fidèlement le toponyme/ethnonyme hébreu sans le remplacer dans le texte par « Syrie ».
  issues:
  - severity: medium
    issue: La généalogie est interprétée comme « petit-fils ».
    rationale: Le texte répète littéralement « fils de » et ne requiert pas une reformulation du second lien. Conserver la répétition protège la spécificité formelle et évite de résoudre une éventuelle souplesse généalogique de בן.
  - severity: medium
    issue: « avait monté la garde » présente l'action comme antérieure et achevée.
    rationale: L'hébreu היה שֹׁמֵר présente Joram en train d'assurer la garde dans l'arrière-plan du récit. « montait la garde » rend mieux cette durée.
  - severity: low
    issue: « forma donc une conspiration » est pesant et « donc » peut surmarquer le lien logique.
    rationale: Le verbe français « conspirer contre » transmet directement la valeur hostile de קשר avec la cible introduite par אֶל.
  revised_text: Jéhu, fils de Josaphat, fils de Nimshi, conspira contre Joram. Or Joram montait la garde à Ramoth en Galaad, lui et tout Israël[a], à cause de Hazaël, roi d’Aram[b].
  revised_footnotes:
  - marker: a
    text: Dans ce contexte militaire, « tout Israël » peut désigner les forces du royaume d’Israël; l’hébreu dit littéralement « tout Israël ».
    reason: cultural_note
  - marker: b
    text: 'Traditionnellement « Syrie »; hébreu : « Aram ».'
    reason: alternative_reading
  - marker: c
    text: Ou « gardait Ramoth en Galaad » ou « défendait Ramoth en Galaad ». Le verbe hébreu peut exprimer la garde, la surveillance ou la défense dans un contexte militaire.
    reason: lexical_alternative
  revision_rationale: La révision préserve plus étroitement la forme généalogique hébraïque, rend l'action militaire de fond par un imparfait français, et emploie une expression politique idiomatique. La note lexicale est conservée avec une ancre c, placée après « montait la garde », afin que son rattachement soit explicite.
