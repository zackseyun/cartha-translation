source:
  edition: WLC
  text: וַ/יִּתְקַשֵּׁ֗ר יֵה֛וּא בֶּן יְהוֹשָׁפָ֥ט בֶּן נִמְשִׁ֖י אֶל יוֹרָ֑ם וְ/יוֹרָם֩ הָיָ֨ה שֹׁמֵ֜ר בְּ/רָמֹ֣ת גִּלְעָ֗ד ה֚וּא וְ/כָל יִשְׂרָאֵ֔ל מִ/פְּנֵ֥י חֲזָאֵ֖ל מֶֽלֶךְ אֲרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/014.yaml
  text: So Jehu son of Jehoshaphat[a], son of Nimshi, conspired against Joram. Now Joram had been keeping watch at Ramoth-gilead, he and all Israel[c][b], because of Hazael king of Aram.
translation:
  language: fr
  text: Jéhu, fils de Josaphat, fils de Nimshi, conspira contre Joram. Or Joram montait la garde à Ramoth en Galaad, lui et tout Israël[a], à cause de Hazaël, roi d’Aram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte militaire, « tout Israël » peut désigner les forces du royaume d’Israël; l’hébreu dit littéralement « tout Israël ».
    reason: cultural_note
  - marker: b
    text: 'Traditionnellement « Syrie »; hébreu : « Aram ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְקַשֵּׁר
  choice: forma donc une conspiration contre
  rationale: Le hitpael de קשר désigne ici l’entrée dans un complot ou une révolte. Cette formulation française exprime clairement l’action politique hostile sans en préciser indûment les modalités.
- source_word: בֶּן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: fils de Josaphat et petit-fils de Nimshi
  rationale: Dans cette chaîne généalogique, le second בן rattache Nimshi à Josaphat; « petit-fils » rend naturellement en français la relation exprimée, tout en conservant les deux générations.
- source_word: אֶל יוֹרָם
  choice: contre Joram
  rationale: Avec קשר dans un contexte de conspiration, אֶל indique la cible du complot; « contre » restitue cette valeur adversative.
- source_word: הָיָה שֹׁמֵר
  choice: avait monté la garde
  rationale: La construction היה suivie du participe présente une action passée en arrière-plan. « Monter la garde » conserve le sens militaire de surveillance ou de défense tout en restant idiomatique.
- source_word: בְּרָמֹת גִּלְעָד
  choice: à Ramoth en Galaad
  rationale: Cette forme française transparente distingue la ville de Ramoth de la région de Galaad.
- source_word: הוּא וְכָל יִשְׂרָאֵל
  choice: avec tout Israël
  rationale: Le texte dit littéralement « lui et tout Israël ». En français narratif, « avec tout Israël » restitue naturellement l’accompagnement, sans remplacer la désignation nationale par « armée » dans le texte principal.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: La préposition introduit ici la menace qui motive la garde; « à cause de » préserve ce rapport causal sans imposer explicitement la peur.
- source_word: מֶלֶךְ אֲרָם
  choice: roi d’Aram
  rationale: « Aram » rend directement le nom hébreu אֲרָם, plutôt que l’appellation traditionnelle et historiquement plus tardive « Syrie ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Forma une conspiration » garde la tonalité politique du récit; « avait monté la garde » fournit l’arrière-plan narratif. Les noms suivent les formes françaises bibliques usuelles, avec « Aram » maintenu d’après l’hébreu.
