revisions:
- from: Jéhu, fils de Josaphat et petit-fils de Nimshi, forma donc une conspiration contre Joram. Or Joram, avec tout Israël[a], avait monté la garde à Ramoth en Galaad[b] à cause de Hazaël, roi d’Aram[c].
  to: Jéhu, fils de Josaphat, fils de Nimshi, conspira contre Joram. Or Joram montait la garde à Ramoth en Galaad, lui et tout Israël[a], à cause de Hazaël, roi d’Aram[b].
  rationale: La révision préserve plus étroitement la forme généalogique hébraïque, rend l'action militaire de fond par un imparfait français, et emploie une expression politique idiomatique. La note lexicale est conservée avec une ancre c, placée après « montait la garde », afin que son rattachement soit explicite.
