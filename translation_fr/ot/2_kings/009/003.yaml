- from: 'Tu prendras la fiole d’huile, tu la verseras sur sa tête et tu diras : « Voici ce que dit Yahweh : Je t’ai consacré par l’onction comme roi sur Israël[a]. » Puis tu ouvriras la porte et tu t’enfuiras sans attendre.'
  to: 'Tu prendras la fiole d’huile, tu la verseras sur sa tête et tu diras : « Voici ce que dit Yahweh : Je t’ai oint roi sur Israël[a]. » Puis tu ouvriras la porte ; enfuis-toi et ne t’attarde pas.'
  rationale: La révision rétablit « oint », équivalent direct de משׁח, affine la note sur la construction לְמֶלֶךְ אֶל יִשְׂרָאֵל sans masquer son caractère inhabituel, et conserve séparément l’ordre de fuir et l’interdiction d’attendre.
