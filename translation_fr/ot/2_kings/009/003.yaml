base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/003.yaml
  text: 'Then take the flask of oil[a], pour it on his head, and say, ‘Thus says Yahweh: I have anointed you king over Israel.’ Then open the door and flee; do not wait.'
translation:
  language: fr
  text: 'Tu prendras la fiole d’huile, tu la verseras sur sa tête et tu diras : « Voici ce que dit Yahweh : Je t’ai oint roi sur Israël[a]. » Puis tu ouvriras la porte ; enfuis-toi et ne t’attarde pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme roi pour Israël » ; la préposition hébraïque rendue littéralement par « pour » ou « vers » exprime ici, dans une formule d’investiture royale, la royauté exercée sur Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַךְ הַשֶּׁמֶן
  choice: la fiole d’huile
  rationale: פַךְ désigne un petit récipient destiné à contenir un liquide. « Fiole » est précis et naturel ici ; הַשֶּׁמֶן signifie simplement « l’huile », sans préciser qu’il s’agit d’huile d’olive.
- source_word: וְיָצַקְתָּ עַל רֹאשׁוֹ
  choice: tu la verseras sur sa tête
  rationale: יצק avec עַל exprime l’action de verser sur quelque chose. Le pronom « la » reprend naturellement « l’huile » en français.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Cette formulation française actuelle conserve le caractère solennel de la formule prophétique tout en rendant explicitement le nom divin יְהוָה par « Yahweh ».
- source_word: מְשַׁחְתִּיךָ
  choice: Je t’ai consacré par l’onction
  rationale: Le parfait hébreu présente l’acte comme accompli dans cette déclaration performative. Cette formulation exprime clairement en français le geste d’investiture sans perdre la notion d’onction.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: comme roi sur Israël
  rationale: לְמֶלֶךְ marque la nomination à la fonction royale. « Sur Israël » rend la relation d’autorité impliquée par la formule d’investiture, tandis qu’une note signale la préposition hébraïque inhabituelle אֶל.
- source_word: וְנַסְתָּה וְלֹא תְחַכֶּה
  choice: tu t’enfuiras sans attendre
  rationale: נוס indique une fuite urgente, et חכה l’interdiction d’attendre. La formulation française réunit naturellement les deux instructions tout en préservant leur urgence.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de la formule royale אֶל יִשְׂרָאֵל
  choice: roi sur Israël
  alternative: roi pour Israël ; roi d’Israël
  rationale: Dans le contexte de l’investiture, la formule exprime la royauté exercée sur Israël. La traduction retient ce sens sans dissimuler la forme littérale, donnée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Voici ce que dit Yahweh » garde la solennité prophétique sans archaïsme. « Consacré par l’onction » rend accessible le verbe cultuel משׁח, tandis que « s’enfuir sans attendre » conserve l’urgence de l’ordre.
