base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/018.yaml
  text: 'So the horseman went to meet him and said[a], “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.” And the watchman reported, saying, “The messenger reached them[b], but he has not returned.”'
translation:
  language: fr
  text: 'Le cavalier alla donc à sa rencontre et dit : « Voici ce que dit le roi : “Est-ce la paix[a] ?” » Mais Jéhu répondit : « Qu’as-tu à faire de la paix ? Range-toi derrière moi[b]. » La sentinelle fit alors ce rapport : « Le messager les a rejoints, mais il n’est pas revenu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tout va-t-il bien ? » L’hébreu emploie ici shalom, « paix », mot répété tout au long de l’échange.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Tourne-toi derrière moi. » Le sens peut être : « Passe derrière moi » ou « Suis-moi. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב הַסּוּס
  choice: le cavalier
  rationale: L’expression signifie littéralement « celui qui monte le cheval ». « Le cavalier » est l’équivalent français naturel dans ce contexte de messager militaire.
- source_word: לִקְרָאתוֹ
  choice: à sa rencontre
  rationale: La construction exprime un déplacement vers quelqu’un afin de le rencontrer ; cette tournure est naturelle et précise en français.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Voici ce que dit le roi
  rationale: Cette formulation rend clairement la formule officielle du messager royal en français moderne, tout en conservant sa solennité.
- source_word: הֲשָׁלוֹם
  choice: Est-ce la paix ?
  rationale: Le mot שָׁלוֹם peut porter ici sur la paix, la sécurité ou le fait que tout aille bien. Le choix « paix » conserve le mot-clé répété dans l’échange et sa force narrative.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: Qu’as-tu à faire de la paix ?
  rationale: Cette expression idiomatique constitue une rebuffade et écarte la question du messager. La traduction reste intelligible tout en maintenant la répétition de « paix ».
- source_word: סֹב אֶל אַחֲרָי
  choice: Range-toi derrière moi
  rationale: L’ordre demande au cavalier de passer derrière Jéhu, vraisemblablement pour se joindre à sa suite. Cette traduction exprime naturellement l’action en français ; le sens plus littéral est indiqué en note.
- source_word: הַצֹּפֶה
  choice: la sentinelle
  rationale: Le terme désigne la personne postée en observation. « Sentinelle » convient au cadre militaire et reste courant en français international.
- source_word: הַמַּלְאָךְ
  choice: le messager
  rationale: Dans ce récit historique, מַלְאָךְ désigne manifestement un envoyé humain, et non un être angélique.
- source_word: בָּא ... עַד הֵם
  choice: les a rejoints
  rationale: L’expression indique que le messager est arrivé jusqu’au groupe. « Les a rejoints » est concis et naturel.
- source_word: וְלֹא שָׁב
  choice: mais il n’est pas revenu
  rationale: La sentinelle constate que l’envoyé n’a pas fait le chemin du retour. Le passé composé convient à ce constat encore valable au moment du rapport.
