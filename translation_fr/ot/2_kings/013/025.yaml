  text: וַ/יָּ֜שָׁב יְהוֹאָ֣שׁ בֶּן יְהוֹאָחָ֗ז וַ/יִּקַּ֤ח אֶת הֶֽ/עָרִים֙ מִ/יַּד֙ בֶּן הֲדַ֣ד בֶּן חֲזָאֵ֔ל אֲשֶׁ֣ר לָקַ֗ח מִ/יַּ֛ד יְהוֹאָחָ֥ז אָבִ֖י/ו בַּ/מִּלְחָמָ֑ה שָׁלֹ֤שׁ פְּעָמִים֙ הִכָּ֣/הוּ יוֹאָ֔שׁ וַ/יָּ֖שֶׁב אֶת עָרֵ֥י יִשְׂרָאֵֽל־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/025.yaml
  text: Then Jehoash son of Jehoahaz regained and took back the cities from the hand of Ben-hadad son of Hazael[a], which he had taken from the hand of Jehoahaz his father in war. Three times Joash struck him[b], and he restored the cities of Israel.
translation:
  language: fr
  text: Joas, fils de Joachaz, reprit les villes à Ben-Hadad, fils de Hazaël[a], qui les avait prises à son père Joachaz pendant la guerre. Joas le battit à trois reprises[b] et rendit les villes à Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie dans ce verset deux formes du même nom royal : « Jehoash » au début et « Joash » ensuite, toutes deux rendues ici par « Joas ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « le frappa ». Dans ce contexte militaire, le verbe hébreu peut signifier vaincre un adversaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּקַּח
  choice: reprit
  rationale: Les deux verbes expriment ensemble la récupération et la reprise des villes. En français, « reprit » restitue naturellement les deux idées sans redondance maladroite.
- source_word: הֶעָרִים
  choice: les villes
  rationale: Équivalent courant et approprié pour des centres urbains, souvent fortifiés, dans ce récit historique.
- source_word: מִיַּד
  choice: à
  rationale: Littéralement « de la main de » ; dans ce contexte militaire, « reprendre à quelqu’un » rend clairement et naturellement l’idée de retirer de son pouvoir.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Transcription française usuelle du nom royal araméen.
- source_word: אֲשֶׁר לָקַח
  choice: qui les avait prises
  rationale: Le plus-que-parfait marque en français l’antériorité de la prise des villes par Ben-Hadad.
- source_word: אָבִיו
  choice: son père
  rationale: 'Le possessif renvoie naturellement à Joas : Joachaz était son père.'
- source_word: בַּמִּלְחָמָה
  choice: pendant la guerre
  rationale: Formulation naturelle qui situe la perte antérieure des villes dans le conflit armé.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: à trois reprises
  rationale: Expression idiomatique en français moderne pour des victoires militaires répétées.
- source_word: הִכָּהוּ
  choice: le battit
  rationale: Dans un contexte militaire, נכה peut désigner le fait de frapper ou de vaincre. « Battit » transmet le sens de défaite sans suggérer nécessairement la mort.
- source_word: יוֹאָשׁ
  choice: Joas
  rationale: Le texte hébreu emploie ici la forme courte du même nom royal ; la note signale l’alternance avec la forme longue au début du verset.
- source_word: וַיָּשֶׁב
  choice: rendit
  rationale: Le verbe causatif exprime la restitution des villes au contrôle d’Israël.
