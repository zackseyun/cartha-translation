base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/021.yaml
  text: And it happened, as they were burying a man, that behold, they saw the raiding band; so they threw the man into Elisha’s grave. And when the man went and touched Elisha’s bones, he came to life and stood up on his feet.
translation:
  language: fr
  text: Or, comme des gens enterraient un homme, voici qu’ils aperçurent une bande de pillards. Ils jetèrent alors l’homme dans le tombeau d’Élisée. L’homme alla toucher les ossements d’Élisée[a] ; il revint à la vie et se dressa sur ses pieds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « L’homme alla et toucha les ossements d’Élisée. »'
    reason: La formulation hébraïque est inhabituelle dans ce contexte ; la note en donne la structure exacte sans supprimer le verbe « aller » du texte principal.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: soudain
  rationale: Dans ce récit, la formule attire l’attention sur l’apparition inattendue de la bande armée ; « soudain » rend naturellement cette fonction en français.
- source_word: הַגְּדוּד
  choice: une bande de pillards
  rationale: Le nom désigne ici une troupe faisant une incursion ou un raid ; cette formulation exprime à la fois son caractère collectif et hostile.
- source_word: בְּקֶבֶר אֱלִישָׁע
  choice: dans le tombeau d’Élisée
  rationale: « Tombeau » convient à un lieu d’ensevelissement déjà occupé et garde le sens concret de קֶבֶר.
- source_word: וַיְחִי
  choice: il revint à la vie
  rationale: Le contexte indique qu’un homme mort recouvre la vie ; cette expression est plus explicite et naturelle que le littéral « il vécut ».
- source_word: וַיָּקָם עַל רַגְלָיו
  choice: se dressa sur ses pieds
  rationale: Cette traduction conserve l’image hébraïque du relèvement corporel tout en restant idiomatique et digne.
theological_decisions:
- issue: Lien entre le contact avec les ossements d’Élisée et le retour à la vie
  choice: Présenter simplement la succession narrative sans expliquer le mécanisme du miracle
  alternative: Attribuer explicitement le miracle à Dieu ou un pouvoir aux reliques
  rationale: Le verset rapporte l’événement sans formuler ici d’explication causale ou doctrinale ; la traduction ne doit pas en ajouter.
- issue: Forme inhabituelle וַיֵּלֶךְ וַיִּגַּע
  choice: 'Conserver dans le texte l’idée de mouvement : « alla toucher »'
  alternative: Lisser en « entra en contact avec » ou « toucha »
  rationale: Le texte massorétique comporte explicitement le verbe « aller ». Malgré l’étrangeté de la scène, le conserver respecte la source et évite de résoudre silencieusement la difficulté.
translation_notes:
  register: Français moderne, international et narratif. « Or » assure une transition digne sans reproduire mécaniquement « et il arriva ». La syntaxe reste claire pour un large lectorat, tandis que la note signale honnêtement la tournure hébraïque difficile.
