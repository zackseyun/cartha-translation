base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/013.yaml
  text: And Joash slept with his fathers[a], and Jeroboam sat on his throne. And Joash was buried in Samaria with the kings of Israel.
translation:
  language: fr
  text: Joas s’endormit avec ses ancêtres[a], et Jéroboam s’assit sur son trône. Joas fut enseveli à Samarie avec les rois d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « se coucha avec ses ancêtres » ; cette expression hébraïque est une formule conventionnelle annonçant la mort d’un roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Le verbe signifie littéralement « se coucher » et fait ici partie de la formule royale conventionnelle annonçant la mort. Cette traduction préserve l’image hébraïque sans la réduire simplement à « mourut ».
- source_word: עִם אֲבֹתָיו
  choice: avec ses ancêtres
  rationale: « Ancêtres » rend naturellement en français moderne le sens dynastique de אָבוֹת dans cette formule, tout en évitant que « pères » soit compris comme désignant seulement les parents immédiats.
- source_word: יָשַׁב עַל כִּסְאוֹ
  choice: s’assit sur son trône
  rationale: La formulation conserve l’image hébraïque traditionnelle de l’accession au trône sans expliciter davantage que le texte source.
- source_word: וַיִּקָּבֵר
  choice: fut enseveli
  rationale: La forme passive rend l’avis funéraire hébreu sans introduire un sujet indéfini absent du texte.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: En français, « à Samarie » est la formulation locative naturelle pour indiquer la ville où eut lieu l’ensevelissement.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: avec les rois d’Israël
  rationale: Cette traduction suit étroitement l’hébreu et indique que Joas fut enseveli en compagnie des autres rois d’Israël.
