  yaml_path: translation/ot/2_kings/013/022.yaml
  text: Hazael king of Aram oppressed Israel all the days of Jehoahaz[a].
translation:
  language: fr
  text: Hazaël, roi d’Aram[a], opprima Israël pendant tout le temps de Joachaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Aram » ; traditionnellement « Syrie » dans certaines traductions.'
    reason: Signale l’appellation géographique traditionnelle sans la substituer au nom présent dans le texte hébreu.
lexical_decisions:
- source_word: וַחֲזָאֵל
  choice: Hazaël
  rationale: Le waw assure ici la continuité narrative sans exiger l’ajout d’un connecteur explicite en français. Le nom propre est transcrit selon l’usage français courant.
- source_word: מֶלֶךְ אֲרָם
  choice: roi d’Aram
  rationale: La construction hébraïque exprime le titre de Hazaël. « Aram » reprend directement le nom propre hébreu plutôt que l’appellation traditionnelle « Syrie ».
- source_word: לָחַץ
  choice: opprima
  rationale: Le verbe désigne une pression dure et durable, ici dans un contexte de domination politique et militaire. « Opprimer » rend naturellement cette idée en français.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: Le marqueur d’objet direct n’est pas rendu séparément. Dans ce contexte, « Israël » désigne le royaume du Nord.
- source_word: כֹּל יְמֵי
  choice: pendant tout le temps de
  rationale: Cette formulation française exprime la durée entière visée par l’idiome hébreu, sans décider explicitement s’il s’agit de toute la vie ou de tout le règne de Joachaz.
- source_word: יְהוֹאָחָז
  choice: Joachaz
  rationale: Forme française traditionnelle et courante du nom royal hébreu.
