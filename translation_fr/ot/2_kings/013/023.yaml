source:
  edition: WLC
  text: וַ/יָּחָן֩ יְהוָ֨ה אֹתָ֤/ם וַֽ/יְרַחֲמֵ/ם֙ וַ/יִּ֣פֶן אֲלֵי/הֶ֔ם לְמַ֣עַן בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם יִצְחָ֣ק וְ/יַֽעֲקֹ֑ב וְ/לֹ֤א אָבָה֙ הַשְׁחִיתָ֔/ם וְ/לֹֽא הִשְׁלִיכָ֥/ם מֵֽ/עַל פָּנָ֖י/ו עַד עָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/023.yaml
  text: But Yahweh was gracious to them and had compassion on them[a], and he turned toward them because of his covenant with Abraham, Isaac, and Jacob. He was not willing to destroy them, and he did not cast them from his presence until now.
translation:
  language: fr
  text: Mais Yahweh leur fit grâce et eut compassion d’eux. Il se tourna vers eux à cause de son alliance avec Abraham, Isaac et Jacob. Il ne voulut pas les détruire et ne les rejeta pas de sa présence jusqu’à ce jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּחָן
  choice: leur accorda sa faveur
  rationale: Le verbe חנן exprime une faveur accordée avec grâce. Cette formulation est naturelle en français moderne et conserve la nuance de bienveillance imméritée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיְרַחֲמֵם
  choice: eut compassion d’eux
  rationale: Le verbe רחם évoque une compassion profonde; cette expression en restitue clairement la dimension affective.
- source_word: וַיִּפֶן אֲלֵיהֶם
  choice: Il se tourna vers eux
  rationale: La traduction conserve l’image hébraïque d’un mouvement vers eux, qui suggère ici une attention favorable sans l’expliciter davantage.
- source_word: לְמַעַן בְּרִיתוֹ
  choice: à cause de son alliance
  rationale: למען indique ici le motif ou le fondement de l’action divine. « À cause de » exprime cette relation de manière idiomatique.
- source_word: אֶת אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: avec Abraham, Isaac et Jacob
  rationale: La construction hébraïque est condensée; « avec » rend naturellement en français le rapport entre l’alliance et les patriarches.
- source_word: וְלֹא אָבָה הַשְׁחִיתָם
  choice: Il ne voulut pas les détruire
  rationale: אָבָה exprime la volonté ou le consentement. « Ne voulut pas » en préserve directement la nuance volitive.
- source_word: וְלֹא הִשְׁלִיכָם מֵעַל פָּנָיו
  choice: il ne les rejeta pas loin de sa présence
  rationale: La formulation restitue l’idée de les jeter loin de devant sa face, tout en employant une expression claire et digne en français.
- source_word: עַד עָתָּה
  choice: jusqu’à ce jour
  rationale: L’expression renvoie au présent du narrateur. « Jusqu’à ce jour » est idiomatique dans un récit historique et marque la continuité jusqu’à ce point.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. La translittération « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: L’alliance comme motif de la compassion et de la retenue divines
  choice: à cause de son alliance avec Abraham, Isaac et Jacob
  alternative: en faveur de son alliance avec Abraham, Isaac et Jacob
  rationale: Le texte fonde l’attitude favorable de Dieu sur son alliance avec les patriarches. La traduction maintient ce lien sans développer une interprétation doctrinale supplémentaire.
translation_notes:
  register: 'Français international moderne, naturel et digne. La syntaxe reste proche des trois mouvements de l’hébreu: faveur et compassion, retournement motivé par l’alliance, puis refus de détruire et de rejeter.'
