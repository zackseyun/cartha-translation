base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/019.yaml
  text: Then the man of God was angry with him and said[a], “You should have struck the ground five or six times; then you would have struck Aram until it was finished[b]. But now you will strike Aram only three times.”
translation:
  language: fr
  text: 'Alors l’homme de Dieu se mit en colère contre lui et dit[a] : « Il fallait frapper le sol cinq ou six fois ! Alors, tu aurais frappé la Syrie jusqu’à en finir avec elle[b]. Mais maintenant, tu ne frapperas la Syrie que trois fois. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « frapper » ; « le sol » est repris de l’action immédiatement précédente au verset 18.
    reason: cross_reference
  - marker: b
    text: 'Ou : « jusqu’à la détruire entièrement ». L’expression hébraïque indique que l’action contre la Syrie aurait été menée pleinement à son terme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף עָלָיו
  choice: se mit en colère contre lui
  rationale: Exprime naturellement en français la colère dirigée contre le roi, sans en exagérer l’intensité.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Conserve le titre hébreu traditionnel plutôt que de l’interpréter comme « prophète ».
- source_word: לְהַכּוֹת
  choice: frapper le sol
  rationale: Le texte dit littéralement « frapper » ; l’objet « le sol » est repris de l’action immédiatement précédente au verset 18 afin que la réprimande soit claire.
- source_word: חָמֵשׁ אוֹ שֵׁשׁ פְּעָמִים
  choice: cinq ou six fois
  rationale: Rend directement l’expression numérique hébraïque.
- source_word: אָז הִכִּיתָ אֶת אֲרָם
  choice: Alors, tu aurais frappé la Syrie
  rationale: Le conditionnel passé exprime la conséquence irréalisée, tandis que la répétition de « frapper » maintient le lien entre le geste symbolique et les victoires militaires.
- source_word: עַד כַּלֵּה
  choice: jusqu’à l’anéantir
  rationale: Rend l’idée de mener l’action jusqu’à son terme complet. Le pronom renvoie à la Syrie comme puissance ennemie, sans préciser davantage la nature de cet anéantissement.
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Marque clairement le contraste entre la possibilité perdue et le résultat désormais annoncé.
- source_word: שָׁלֹשׁ פְּעָמִים תַּכֶּה אֶת אֲרָם
  choice: tu ne frapperas la Syrie que trois fois
  rationale: L’imparfait hébreu est prédictif ; la tournure restrictive française explicite la limitation impliquée par le contraste.
theological_decisions:
- issue: Maintien du rapport symbolique entre le fait de frapper le sol et celui de frapper Aram
  choice: Employer « frapper » dans les deux propositions, tout en ajoutant « le sol » d’après le verset 18.
  alternative: Employer « frapper le sol » puis « vaincre la Syrie ».
  rationale: La répétition verbale laisse apparaître le rapport établi par le récit entre le signe prophétique et le nombre des victoires, sans développer une interprétation théologique supplémentaire.
- issue: Portée de עַד כַּלֵּה
  choice: « jusqu’à l’anéantir »
  alternative: « jusqu’à en finir avec elle » ou « jusqu’à sa destruction complète »
  rationale: La formulation retenue conserve la force d’achèvement total du syntagme hébreu, tout en laissant au contexte militaire le soin d’en déterminer la portée exacte.
translation_notes:
  register: Français international moderne, narratif et digne. « Syrie » est employé comme désignation française courante d’Aram dans ce contexte. Le tutoiement correspond à l’adresse directe du prophète au roi et convient au récit biblique contemporain.
