  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֗ם וּ/בְ/יַ֛ד בֶּן הֲדַ֥ד בֶּן חֲזָאֵ֖ל כָּל הַ/יָּמִֽים־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/003.yaml
  text: So Yahweh’s anger burned against Israel[a], and he gave them into the hand of Hazael king of Aram, and into the hand of Ben-hadad son of Hazael[c][b], all those days.
translation:
  language: fr
  text: Alors la colère de Yahweh s’enflamma contre Israël, et il les livra entre les mains[a] de Hazaël, roi d’Aram[b], et entre les mains[a] de Ben-Hadad, fils de Hazaël, pendant tous ces jours-là[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans la main de », expression qui signifie « sous le pouvoir ou l’autorité de ».
    reason: lexical_alternative
  - marker: b
    text: Aram est le nom hébreu du royaume souvent appelé « Syrie » dans des traductions plus anciennes.
    reason: alternative_reading
  - marker: c
    text: Littéralement « tous les jours », c’est-à-dire pendant toute cette période.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: la colère de Yahweh s’enflamma
  rationale: Cette formulation française naturelle conserve l’image vive de l’idiome hébreu, selon lequel la colère « brûle », sans recourir au littéralisme peu clair du « nez ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: בְּיִשְׂרָאֵל
  choice: contre Israël
  rationale: Avec un verbe exprimant la colère, la préposition בְּ marque ici la personne ou le peuple visé.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: il les livra entre les mains de
  rationale: « Livrer entre les mains de » exprime clairement la remise au pouvoir d’un ennemi tout en conservant l’image hébraïque de la main.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: Hazaël, roi d’Aram
  rationale: Les noms sont translittérés, et le toponyme hébreu אֲרָם est rendu directement par « Aram » plutôt que par l’appellation historique plus interprétative « Syrie ».
- source_word: בֶּן־הֲדַד בֶּן־חֲזָאֵל
  choice: Ben-Hadad, fils de Hazaël
  rationale: La généalogie explicite du texte hébreu est conservée, avec une graphie française lisible du nom propre.
- source_word: כָּל הַיָּמִים
  choice: durant tout ce temps
  rationale: L’expression désigne toute la période évoquée dans le récit. Cette tournure est naturelle en français tout en maintenant sa portée temporelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le verset emploie directement le tétragramme. La translittération « Yahweh » préserve le nom personnel présent dans la source au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore de la colère qui s’enflamme et l’image des mains sont conservées, tandis que la syntaxe demeure naturelle. La coordination hébraïque répétée est légèrement allégée en français sans modifier les deux agents de l’oppression.
