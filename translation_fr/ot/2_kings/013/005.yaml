source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֤ה לְ/יִשְׂרָאֵל֙ מוֹשִׁ֔יעַ וַ/יֵּ֣צְא֔וּ מִ/תַּ֖חַת יַד אֲרָ֑ם וַ/יֵּשְׁב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/אָהֳלֵי/הֶ֖ם כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/005.yaml
  text: And Yahweh gave Israel a deliverer[a], so that they went out from under the hand of Aram[c][b]; and the sons of Israel lived in their tents as formerly.
translation:
  language: fr
  text: Yahweh donna à Israël un libérateur[a], si bien qu’ils échappèrent à l’emprise d’Aram[b] ; les fils d’Israël habitèrent dans leurs tentes comme autrefois[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un sauveur ». Le mot hébreu désigne quelqu’un qui apporte secours et délivrance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de sous la main d’Aram », expression hébraïque désignant la libération du pouvoir d’Aram.
    reason: cultural_note
  - marker: c
    text: Ou « comme auparavant », « comme aux temps passés ». Littéralement, l’expression hébraïque évoque « hier et avant-hier » pour parler du passé.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin sous une forme translittérée, conformément à la priorité donnée au texte source et à l’usage du projet.
- source_word: מוֹשִׁיעַ
  choice: un libérateur
  rationale: Le participe substantivé désigne ici quelqu’un qui délivre Israël d’une oppression politique. « Libérateur » exprime ce sens historique sans imposer une identification messianique absente du verset.
- source_word: מִתַּחַת יַד אֲרָם
  choice: à l’emprise d’Aram
  rationale: Littéralement « de dessous la main d’Aram » ; l’expression hébraïque évoque la domination ou le pouvoir oppressif. « Emprise » en restitue naturellement l’image et le sens en français.
- source_word: אֲרָם
  choice: Aram
  rationale: Conserve le nom historique du royaume biblique plutôt que de lui substituer le nom géographique plus tardif « Syrie ».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve la désignation familiale et collective explicite de l’hébreu, tout en restant intelligible dans un registre biblique moderne.
- source_word: בְּאָהֳלֵיהֶם
  choice: dans leurs tentes
  rationale: Maintient le terme concret de l’hébreu plutôt que de le généraliser en « maisons » ou « demeures ».
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: comme autrefois
  rationale: Rend idiomatiquement une expression qui signifie le retour à la situation des jours passés.
- source_word: וַיֵּצְאוּ
  choice: ils échappèrent
  rationale: Dans le contexte de l’expression « de dessous la main d’Aram », le verbe décrit la sortie hors d’une domination ; « échappèrent à l’emprise » en donne une formulation française naturelle.
- source_word: וַיֵּשְׁבוּ
  choice: habitèrent
  rationale: Le verbe signifie ici demeurer ou vivre dans un lieu. « Habitèrent » convient au complément « dans leurs tentes » et conserve un registre narratif digne.
theological_decisions:
- issue: Faut-il rendre מוֹשִׁיעַ par « libérateur » ou par « sauveur » ?
  choice: libérateur
  alternative: sauveur
  rationale: Le contexte immédiat concerne une délivrance historique de la domination araméenne. « Libérateur » préserve cette portée sans exclure la dimension du salut accordé par Dieu ni introduire une lecture christologique que le verset ne formule pas.
- issue: Faut-il conserver littéralement la désignation בְנֵי יִשְׂרָאֵל ?
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation retenue préserve la métaphore familiale et l’identité collective exprimées par l’hébreu, sans neutraliser la forme du texte source.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide tout en conservant « Yahweh », « Aram », « les fils d’Israël » et « leurs tentes », éléments concrets et littéraires du texte hébreu.
