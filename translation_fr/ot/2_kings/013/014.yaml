  source_fidelity: 'Le texte rend fidèlement la progression narrative : Élisée est déjà atteint de l’affection qui causera sa mort, Joas descend vers lui, pleure sur lui et reprend l’exclamation traditionnelle. « Dont il allait mourir » conserve bien l’orientation future de אֲשֶׁר יָמוּת בּוֹ dans le cadre narratif. « Descendit » maintient le détail directionnel de וַיֵּרֶד. « Pleura sur lui » est une équivalence idiomatique sûre de l’expression littérale « pleura sur son visage », sans imposer une reconstruction physique de la scène.'
  naturalness: 'Le français est moderne, fluide et d’un registre biblique digne. « Char d’Israël et ses cavaliers ! » conserve à dessein le caractère elliptique et solennel de l’acclamation. Le singulier de « Char » est recevable : רֶכֶב est formellement singulier et peut avoir une valeur collective dans ce syntagme traditionnel.'
