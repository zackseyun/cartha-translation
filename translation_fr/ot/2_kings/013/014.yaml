  text: וֶֽ/אֱלִישָׁע֙ חָלָ֣ה אֶת חָלְי֔/וֹ אֲשֶׁ֥ר יָמ֖וּת בּ֑/וֹ וַ/יֵּ֨רֶד אֵלָ֜י/ו יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל וַ/יֵּ֤בְךְּ עַל פָּנָי/ו֙ וַ/יֹּאמַ֔ר אָבִ֣/י אָבִ֔/י רֶ֥כֶב יִשְׂרָאֵ֖ל וּ/פָרָשָֽׁי/ו־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/014.yaml
  text: Elisha had become sick with the illness from which he would die[a]. And Joash king of Israel went down to him and wept over him and said, “My father[b], my father! The chariots of Israel and its horsemen!”
translation:
  language: fr
  text: 'Élisée était atteint de la maladie dont il allait mourir. Joas, roi d’Israël, descendit auprès de lui, pleura sur lui et dit : « Mon père, mon père ! Char d’Israël et ses cavaliers ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette exclamation reprend les paroles qu’Élisée avait adressées à Élie en 2 Rois 2.12.
    reason: cross_reference
lexical_decisions:
- source_word: חָלָה אֶת חָלְיוֹ
  choice: était atteint de la maladie
  rationale: Cette formulation française naturelle conserve la répétition étymologique hébraïque entre le verbe « être malade » et le nom « maladie », sans alourdir la phrase.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: dont il allait mourir
  rationale: La relative présente cette maladie comme celle qui causerait sa mort, avec une perspective encore future au moment du récit.
- source_word: וַיֵּרֶד אֵלָיו
  choice: descendit auprès de lui
  rationale: « Descendit » préserve le détail directionnel de ירד; « auprès de lui » exprime naturellement le mouvement vers Élisée.
- source_word: וַיֵּבְךְּ עַל־פָּנָיו
  choice: pleura sur lui
  rationale: L’expression hébraïque est littéralement « pleura sur son visage », mais l’idiome désigne ici les pleurs de Joas penché sur Élisée ou en sa présence; « pleura sur lui » reste vivant et idiomatique.
- source_word: אָבִי אָבִי
  choice: Mon père, mon père !
  rationale: Le possessif et la répétition rendent l’affection, le respect et la détresse du roi.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: Char d’Israël et ses cavaliers !
  rationale: Le singulier hébreu רֶכֶב peut désigner le char ou collectivement les chars; le français au singulier conserve la forme concise et l’écho exact de 2 Rois 2.12 sans expliciter la métaphore.
theological_decisions:
- issue: Portée métaphorique de « Char d’Israël et ses cavaliers »
  choice: Conserver l’exclamation directement adressée à Élisée sans l’expliquer dans le texte.
  alternative: Paraphraser qu’Élisée est la véritable force ou défense d’Israël, ou comprendre ces mots comme la description d’une vision céleste.
  rationale: La formule fait écho à 2 Rois 2.12 et souligne la portée du prophète pour Israël, mais le texte ne développe pas explicitement la métaphore. La traduction en maintient donc la tension et l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination hébraïque a été allégée en français. L’expression militaire demeure abrupte et métaphorique, comme dans la source.
