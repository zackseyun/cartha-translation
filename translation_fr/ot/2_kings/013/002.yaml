  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ֠/יֵּלֶךְ אַחַ֨ר חַטֹּ֜את יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל לֹא סָ֥ר מִמֶּֽ/נָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/002.yaml
  text: He did what was evil in the eyes of Yahweh and walked after the sins of Jeroboam son of Nebat[a], who caused Israel to sin; he did not turn away from them.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahvé et suivit les péchés de Jéroboam, fils de Nebath, qui avait fait pécher Israël ; il ne s’en détourna pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ne se détourna pas d’elle ». Le suffixe hébreu est féminin singulier et renvoie probablement, de manière collective, à la conduite pécheresse de Jéroboam.'
    reason: ambiguïté grammaticale et référentielle
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le passé simple rend naturellement la succession narrative du wayyiqtol dans un registre français digne et soutenu.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: ce qui est mal aux yeux de Yahvé
  rationale: Cette formulation conserve l’expression évaluative récurrente des livres des Rois tout en restant claire en français moderne.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » restitue ici le nom divin plutôt que de lui substituer un titre.
- source_word: וַיֵּלֶךְ אַחַר
  choice: suivit
  rationale: L’expression hébraïque signifie littéralement « marcher après » ; « suivre » en transmet naturellement l’idée de conformer sa conduite à un modèle.
- source_word: חַטֹּאת
  choice: les péchés
  rationale: Le pluriel français correspond à la forme plurielle hébraïque et désigne les pratiques pécheresses associées à Jéroboam.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Les formes traditionnelles françaises des noms sont employées, et le patronyme hébreu est conservé.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: qui avait fait pécher Israël
  rationale: « Faire pécher » rend directement la valeur causative du hifil de חטא ; le plus-que-parfait explicite l’antériorité naturelle de l’action de Jéroboam.
- source_word: לֹא סָר מִמֶּנָּה
  choice: il ne s’en détourna pas
  rationale: « Se détourner de » rend le sens de סור. Le pronom adverbial « en » évite d’imposer en français un nombre précis au référent du suffixe hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël. Sa transcription française préserve cette donnée au lieu de la remplacer par un titre.
- issue: Référent du suffixe féminin singulier dans מִמֶּנָּה
  choice: il ne s’en détourna pas
  alternative: il ne se détourna pas d’eux / de ces péchés
  rationale: Le suffixe hébreu est féminin singulier, alors que « péchés » est morphologiquement pluriel. « En » garde ouverte la possibilité d’un renvoi collectif à la conduite pécheresse de Jéroboam sans effacer la tension grammaticale.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit historique écrit ; le vocabulaire reste accessible. « Suivit » privilégie l’expression française naturelle sans perdre l’idée d’adhésion à la conduite de Jéroboam.
