  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹאָחָ֛ז וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבוּרָת֑/וֹ הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/008.yaml
  text: The rest of the acts of Jehoahaz[a], and all that he did[b], and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: fr
  text: Le reste des actes de Joachaz, tout ce qu’il a fait et ses exploits[a], ne sont-ils pas consignés dans le livre des Annales des rois d’Israël[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa puissance », « sa vaillance » ou « ses hauts faits ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le livre des Chroniques des rois d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָחָז
  choice: Le reste des actes de Joachaz
  rationale: Dans cette formule de conclusion de règne, דִּבְרֵי désigne l’ensemble des faits ou actes du roi, et non seulement ses paroles. « Le reste des actes » est naturel en français et conserve la portée historique de l’expression.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: tout ce qu’il a fait
  rationale: Traduction directe et fluide de la proposition relative, sans restreindre la portée générale du verbe עָשָׂה.
- source_word: וּגְבוּרָתוֹ
  choice: et ses exploits
  rationale: גְּבוּרָה peut évoquer la puissance, la vaillance ou les actes remarquables. Dans un résumé royal, « ses exploits » rend naturellement la dimension concrète du terme tout en laissant ouverte sa portée précise.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: n’est-il pas consigné
  rationale: La question rhétorique hébraïque est conservée. En français, le sujet collectif sous-entendu par l’énumération peut être repris au singulier comme « le reste », d’où « n’est-il pas ». « Consigné » est idiomatique pour des faits enregistrés dans des annales.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Bien que עַל signifie littéralement « sur », le français dit naturellement qu’un fait est consigné « dans » un livre ou un registre.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: des Annales des rois d’Israël
  rationale: Dans cette formule archivistique, דִּבְרֵי הַיָּמִים désigne une chronique ou des annales royales. « Annales » évite de faire croire qu’il s’agit nécessairement du livre biblique des Chroniques.
