  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/שֶׁ֨בַע֙ שָׁנָ֔ה לְ/יוֹאָ֖שׁ מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ יְהוֹאָ֨שׁ בֶּן יְהוֹאָחָ֤ז עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/010.yaml
  text: In the thirty-seventh year of Joash king of Judah[a], Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years.
translation:
  language: fr
  text: La trente-septième année du règne de Joas, roi de Juda[a], Joas, fils de Joachaz, devint roi d’Israël à Samarie. Il régna seize ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu distingue par leur graphie le nom du roi de Juda, יוֹאָשׁ (Yoash), de celui du roi d’Israël, יְהוֹאָשׁ (Yehoash). La tradition française les appelle généralement tous deux « Joas ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָשֶׁבַע שָׁנָה
  choice: La trente-septième année du règne de
  rationale: La formule hébraïque situe l’accession dans une année de règne précise. L’ajout explicatif « du règne de » produit en français une formulation naturelle et sans ambiguïté.
- source_word: לְיוֹאָשׁ מֶלֶךְ יְהוּדָה
  choice: Joas, roi de Juda
  rationale: Le לְ marque ici le règne servant de repère chronologique; « Joas » est la forme française traditionnelle du nom יוֹאָשׁ.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette formule royale, le parfait de מלך a une valeur ingressive et indique l’accession au trône, tandis que la fin du verset précise la durée du règne.
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: Joas, fils de Joachaz
  rationale: « Joas » et « Joachaz » sont les formes françaises usuelles de ces noms. Puisque la tradition française rend généralement יוֹאָשׁ et יְהוֹאָשׁ de la même manière, une note signale la différence graphique de l’hébreu.
- source_word: עַל יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Avec מלך, עַל exprime l’autorité exercée sur Israël. La tournure idiomatique française « devint roi d’Israël » restitue naturellement ce rapport.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: La préposition בְּ indique le lieu. En français, « à Samarie » est la construction normale pour une ville et désigne ici la capitale du royaume du Nord.
- source_word: שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: Il régna seize ans
  rationale: Le groupe numérique indique la durée du règne. Une nouvelle phrase rend clairement en français la succession entre accession et durée.
