  yaml_path: translation/ot/2_kings/013/015.yaml
  text: Then Elisha said to him[a], “Take a bow and arrows.” So he took a bow and arrows.
translation:
  language: fr
  text: 'Élisée lui dit alors : « Prends un arc et des flèches. » Le roi lui apporta[a] donc un arc et des flèches.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Il prit donc pour lui-même un arc et des flèches. » L’hébreu se lit toutefois plus naturellement « vers lui », en référence à Élisée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait avancer le récit ; « alors » exprime naturellement cette progression en français moderne.
- source_word: לּוֹ
  choice: lui
  rationale: La préposition ל avec suffixe masculin singulier désigne ici le destinataire des paroles d’Élisée.
- source_word: אֱלִישָׁע
  choice: Élisée
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: קַח
  choice: Prends
  rationale: L’impératif de לקח commande directement de prendre ou de se procurer les objets mentionnés.
- source_word: קֶשֶׁת וְחִצִּים
  choice: un arc et des flèches
  rationale: Rend directement les deux armes, avec les articles qu’exige le français naturel ; leur répétition dans la seconde proposition est conservée.
- source_word: וַיִּקַּח
  choice: apporta donc
  rationale: Dans ce contexte, לקח associé à אֵלָיו indique que le roi prend les objets en direction d’Élisée. « Apporta » exprime cette action de manière idiomatique, tandis que « donc » marque la réponse à l’ordre.
- source_word: אֵלָיו
  choice: lui
  rationale: La préposition אֶל avec suffixe masculin singulier signifie le plus naturellement « vers lui » et renvoie vraisemblablement à Élisée ; intégrée au verbe « apporter », elle devient le pronom indirect « lui ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le sujet « le roi » est explicité dans la seconde phrase afin d’éviter l’ambiguïté créée en français par deux pronoms masculins successifs. La direction exprimée par אֵלָיו est conservée dans « lui apporta », avec une note signalant l’autre analyse possible.
