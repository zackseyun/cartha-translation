source:
  edition: WLC
  text: וַ/יַּֽעֲשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּ֞אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל בָּ֥/הּ הָלָֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/011.yaml
  text: He did what was evil in the sight of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], by which he caused Israel to sin; he walked in them.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh. Il ne se détourna d’aucun des péchés de Jéroboam, fils de Nebath, qui avait fait pécher Israël ; il marcha dans cette voie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il marcha en elle ». Le pronom hébreu est au singulier féminin ; il peut renvoyer collectivement aux péchés mentionnés ou à la voie pécheresse qu’ils représentent.'
    reason: La note préserve le singulier grammatical du suffixe hébreu et indique sans la trancher son référence collective ou implicite.
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: Il fit ce qui est mal
  rationale: La formule narrative courante de 1–2 Rois est rendue naturellement tout en conservant son jugement moral explicite.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette traduction conserve la métaphore hébraïque de l’évaluation divine et rend directement le nom divin.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: Il ne se détourna d’aucun des péchés
  rationale: Dans cette phrase négative, מִכָּל exprime qu’il n’abandonna aucun des péchés en question ; cette formulation est précise et naturelle en français.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Forme française traditionnelle et intelligible des noms propres, avec apposition naturelle du patronyme.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: par lesquels celui-ci avait fait pécher Israël
  rationale: Le relatif est rattaché aux péchés comme moyens de l’égarement, tandis que « celui-ci » identifie Jéroboam comme sujet causatif du hifil הֶחֱטִיא.
- source_word: בָּהּ הָלָךְ
  choice: il persista dans cette voie
  rationale: L’hébreu a littéralement « il marcha en elle ». Le singulier féminin paraît reprendre collectivement la conduite pécheresse ; la traduction rend l’image comme une manière de vivre sans créer en français un désaccord avec « péchés ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme ; « Yahweh » préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Référent du relatif אֲשֶׁר
  choice: les péchés comme moyens par lesquels Jéroboam fit pécher Israël
  alternative: Jéroboam, qui fit pécher Israël
  rationale: La proximité de חַטֹּאות et la construction permettent de comprendre les péchés comme antécédent instrumental. La formulation française garde néanmoins Jéroboam comme agent de « faire pécher ».
- issue: Nombre du suffixe dans בָּהּ
  choice: référence collective à la voie pécheresse
  alternative: 'référence littérale au singulier : « il marcha en elle »'
  rationale: Le suffixe est formellement féminin singulier malgré l’antécédent pluriel « péchés ». Le texte principal restitue le sens collectif, et la note conserve la particularité grammaticale.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit historique écrit. La formule « aux yeux de Yahweh » maintient la couleur biblique sans être obscure ; « persista dans cette voie » exprime naturellement l’hébraïsme final.
