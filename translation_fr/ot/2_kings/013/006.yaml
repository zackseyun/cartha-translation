  verdict: revise
  source_fidelity: 'Le sens global est fidèlement rendu : le contraste, le refus de renoncer aux péchés liés à Jéroboam, l’action de faire pécher Israël et la permanence de l’Ashéra à Samarie sont conservés. Toutefois, « les pratiquer » pluralise et concrétise le complément alors que le suffixe hébreu est féminin singulier et peut renvoyer collectivement à la voie/pratique pécheresse. « y persista » maintient mieux cette référence non résolue et l’idée de persévérance de הלך avec ב.'
