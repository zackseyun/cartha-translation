  terminology: « maison de Jéroboam », « faire pécher », « Ashéra » et « Samarie » sont appropriés. La note sur Ashéra préserve correctement l’ambiguïté entre la déesse et le symbole/objet cultuel, sans surinterpréter le texte principal.
  issues:
