  text: אַ֠ךְ לֹֽא סָ֜רוּ מֵ/חַטֹּ֧אות בֵּית יָרָבְעָ֛ם אֲשֶׁר החטי אֶת יִשְׂרָאֵ֖ל בָּ֣/הּ הָלָ֑ךְ וְ/גַם֙ הָ/אֲשֵׁרָ֔ה עָמְדָ֖ה בְּ/שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/006.yaml
  text: Yet they did not turn away from the sins of the house of Jeroboam[a], by which he caused Israel to sin; in them he walked, and even the Asherah remained standing in Samaria.
translation:
  language: fr
  text: Pourtant, ils ne se détournèrent pas des péchés de la maison de Jéroboam, par lesquels il avait fait pécher Israël ; on y persista. Même l’Ashéra[a] resta dressée à Samarie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner la déesse cananéenne Ashéra ou, comme c’est probablement le cas ici, l’objet cultuel associé à son culte.
    reason: alternative lexicale et référent ambigu
lexical_decisions:
- source_word: אַךְ
  choice: Pourtant
  rationale: Marque le contraste concessif avec la délivrance mentionnée auparavant, dans un français naturel.
- source_word: לֹא סָרוּ מֵחַטֹּאות
  choice: ils ne se détournèrent pas des péchés
  rationale: Avec מִן, סור exprime l’abandon d’une conduite ; le pluriel « péchés » respecte le texte.
- source_word: בֵּית יָרָבְעָם
  choice: la maison de Jéroboam
  rationale: Conserve l’expression hébraïque, qui désigne ici l’héritage cultuel et politique lié à Jéroboam sans la réduire à la seule dynastie.
- source_word: אֲשֶׁר החטי אֶת יִשְׂרָאֵל
  choice: par lesquels il avait fait pécher Israël
  rationale: Le hiphil de חטא signifie « faire pécher ». Le plus-que-parfait rend l’antériorité de l’action de Jéroboam dans le récit.
- source_word: בָּהּ הָלָךְ
  choice: on continua à les pratiquer
  rationale: Littéralement, « il/on marcha en elle ». Le sujet masculin singulier n’est pas explicitement nommé et peut avoir une valeur impersonnelle renvoyant à la conduite persistante d’Israël ; cette formulation française préserve cette indétermination mieux qu’un pronom personnel ambigu. Le pluriel reprend naturellement les « péchés ».
- source_word: וְגַם
  choice: Même
  rationale: Rend l’ajout emphatique de la dernière proposition.
- source_word: הָאֲשֵׁרָה
  choice: l’Ashéra
  rationale: La translittération maintient l’ambiguïté entre la déesse et l’objet cultuel qui lui est associé, explicitée en note.
- source_word: עָמְדָה
  choice: resta dressée
  rationale: Conserve à la fois l’image de la position debout et l’idée de maintien dans le temps.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: Préposition française idiomatique avec le nom de la ville.
theological_decisions:
- issue: Référent de הָאֲשֵׁרָה
  choice: « l’Ashéra » dans le texte, probablement l’objet cultuel associé à son culte
  alternative: « le poteau sacré d’Ashéra » ou « la déesse Ashéra »
  rationale: Le fait qu’elle « resta dressée » à Samarie favorise l’objet cultuel, mais le terme hébreu peut aussi désigner la divinité ; la translittération évite de trancher silencieusement.
- issue: Sujet de בָּהּ הָלָךְ
  choice: 'tournure impersonnelle : « on continua à les pratiquer »'
  alternative: « il les pratiqua » ou « Israël continua dans cette voie »
  rationale: Le verbe hébreu est au masculin singulier alors que le contexte immédiat commence au pluriel. La tournure impersonnelle conserve l’absence de sujet explicite tout en exprimant la persistance dans les pratiques pécheresses.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite le calque peu naturel « marcher dans des péchés » tout en maintenant l’idée de conduite persistante. Le point-virgule conserve l’articulation serrée du verset.
