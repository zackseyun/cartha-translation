base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/009.yaml
  text: And Jehoahaz lay down with his fathers[a], and they buried him in Samaria. Then Joash his son reigned in his place.
translation:
  language: fr
  text: Joachaz reposa avec ses ancêtres, et on l’enterra à Samarie. Puis Joas[a], son fils, régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Joas » est aussi transcrit « Yehoash » dans certaines traductions.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: reposa avec ses ancêtres
  rationale: Cette formule royale conventionnelle annonce la mort. « Reposa » conserve l’image hébraïque sans employer le calque français peu naturel « se coucha avec ses pères »; « ancêtres » exprime ici clairement la portée collective de אֲבֹתָיו.
- source_word: וַיִּקְבְּרֻהוּ
  choice: on l’enterra
  rationale: Le verbe hébreu est à la troisième personne du pluriel avec un sujet indéfini. Le pronom français « on » en conserve naturellement la valeur active et indéfinie.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: Pour une ville, le français courant emploie naturellement « à » afin d’indiquer le lieu de l’ensevelissement.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans cette notice de succession, le verbe désigne l’accession au règne et le fait d’exercer la royauté; « régna » maintient la formule royale avec concision.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: L’expression marque le remplacement dynastique et se rend directement et naturellement ainsi en français.
- source_word: יְהוֹאָחָז
  choice: Joachaz
  rationale: Forme française traditionnelle et reconnaissable du nom hébreu.
- source_word: יוֹאָשׁ
  choice: Joas
  rationale: Forme française traditionnelle correspondant à la forme hébraïque Yoash présente dans ce verset.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formule de mort conserve son image traditionnelle sous une forme intelligible; la syntaxe active et indéfinie de l’ensevelissement est maintenue avec « on ». Le marqueur de note est placé après « Joas », le mot auquel la note se rapporte.
