  - severity: medium
    issue: Intensification interprétative de כַּלֵּה
    rationale: « Anéantir » peut suggérer une extermination totale. « Détruire » rend suffisamment l’idée de mettre fin à Aram sans renforcer inutilement le terme hébreu.
  - severity: low
