base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/017.yaml
  text: Then he said[a], “Open the window eastward,” and he opened it. Then Elisha said, “Shoot,” and he shot. And he said, “Yahweh’s arrow of victory, the arrow of victory over Aram! For you will strike Aram at Aphek until you have destroyed it.”
translation:
  language: fr
  text: 'Puis il dit : « Ouvre la fenêtre vers l’est. » Et il l’ouvrit. Élisée dit alors : « Tire ! » Et il tira. Élisée dit : « Flèche de victoire de Yahvé[a], flèche de victoire contre Aram ! Tu frapperas Aram à Apheq jusqu’à le détruire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Flèche de salut venant de Yahvé, flèche de délivrance contre Aram ! » Le mot hébreu peut signifier « victoire », « salut » ou « délivrance ».'
    reason: Conserver l’étendue sémantique de תְּשׁוּעָה et l’ambiguïté relative de לַיהוָה.
lexical_decisions:
- source_word: פְּתַח הַחַלּוֹן קֵדְמָה
  choice: Ouvre la fenêtre du côté de l’est
  rationale: L’impératif פְּתַח signifie naturellement « ouvre » ; קֵדְמָה indique la direction, « vers l’est ». « Du côté de l’est » conserve ce sens dans un français idiomatique sans transformer nécessairement l’expression en « fenêtre orientale ».
- source_word: יְרֵה
  choice: Tire !
  rationale: Dans ce contexte de tir à l’arc, l’impératif est clair sans qu’il soit nécessaire d’ajouter « une flèche », absent de l’hébreu.
- source_word: חֵץ תְּשׁוּעָה לַיהוָה
  choice: Flèche de victoire de Yahvé
  rationale: תְּשׁוּעָה peut désigner le salut, la délivrance ou la victoire. Le contexte militaire favorise « victoire », tandis que « de Yahvé » préserve la relative souplesse du ל, qui associe cette victoire à Yahvé comme source et agent.
- source_word: וְחֵץ תְּשׁוּעָה בַאֲרָם
  choice: flèche de victoire contre Aram
  rationale: 'La seconde expression précise la première. La préposition ב prend ici un sens adversatif naturel : « contre Aram ».'
- source_word: אֲרָם
  choice: Aram
  rationale: La translittération du nom hébreu évite de substituer au royaume antique l’appellation géopolitique moderne « Syrie ».
- source_word: וְהִכִּיתָ אֶת אֲרָם בַּאֲפֵק
  choice: Tu frapperas Aram à Apheq
  rationale: « Frapper » conserve l’image et la portée du verbe נכה sans anticiper à lui seul la destruction complète exprimée ensuite. « À Apheq » convient à un lieu de bataille.
- source_word: עַד כַּלֵּה
  choice: jusqu’à l’anéantir
  rationale: L’expression indique que l’action sera menée jusqu’à son terme destructeur. Le pronom « l’ » reprend Aram comme puissance ou armée ennemie.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » rend explicitement le nom divin dans une forme française courante et reconnaissable.
theological_decisions:
- issue: Sens de תְּשׁוּעָה dans l’oracle militaire
  choice: victoire
  alternative: salut ou délivrance
  rationale: Le geste symbolique de la flèche et l’annonce de la bataille à Apheq donnent au terme un sens militaire concret. Une note conserve toutefois son éventail sémantique plus large.
- issue: Rapport exprimé par לַיהוָה
  choice: de Yahvé
  alternative: venant de Yahvé / pour Yahvé
  rationale: Le génitif français laisse ouverte la relation exacte tout en indiquant que la victoire relève de Yahvé, sans imposer une analyse unique de la préposition.
- issue: Portée de עַד כַּלֵּה
  choice: jusqu’à l’anéantir
  alternative: jusqu’à en finir avec lui
  rationale: Le choix exprime l’achèvement destructeur annoncé, sans préciser au-delà du texte s’il s’agit du peuple, du royaume ou des forces militaires d’Aram.
translation_notes:
  register: Français moderne, international et digne, avec une narration fluide. Les phrases brèves et les impératifs conservent le rythme du geste prophétique. « Apheq » suit une translittération française transparente ; « Yahvé » rend le nom divin.
