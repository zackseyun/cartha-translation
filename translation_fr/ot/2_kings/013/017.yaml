  source_fidelity: 'Le sens du texte hébreu est globalement bien rendu : l’orientation vers l’est, le tir, la flèche comme signe de victoire/délivrance contre Aram, et l’aboutissement de la campagne à Apheq sont conservés. « Jusqu’à l’anéantir » est cependant plus rhétorique et plus absolu que nécessaire pour כַּלֵּה, dont le sens est celui d’achever ou de détruire l’ennemi.'
  naturalness: « Vers l’est » est plus direct et idiomatique que « du côté de l’est ». Le déplacement de l’appel de note auprès de l’expression qu’il éclaire rend l’ancrage clair. « Jusqu’à le détruire » conserve un français moderne, sobre et précis.
  terminology: « Yahvé », « Élisée », « Aram » et « Apheq » sont cohérents. « Victoire » convient au contexte militaire pour תְּשׁוּעָה, tandis que la note préserve les possibilités « salut » et « délivrance ».
