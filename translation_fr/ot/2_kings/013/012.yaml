  text: וְ/יֶ֨תֶר דִּבְרֵ֤י יוֹאָשׁ֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְב֣וּרָת֔/וֹ אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣ה מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/012.yaml
  text: The rest of the acts of Joash[a], and all that he did[b], and his might with which he fought against Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: fr
  text: Le reste des actes de Joas, tout ce qu’il a fait et sa vaillance dans le combat contre Amatsia[a], roi de Juda, tout cela n’est-il pas écrit dans le livre des annales des rois d’Israël[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « avec Amatsia ». Dans ce contexte militaire, la préposition hébraïque exprime un affrontement hostile.
    reason: lexical_alternative
  - marker: b
    text: Ce livre des annales des rois d’Israël désigne une source royale citée dans les livres des Rois ; il ne s’agit pas du livre biblique des Chroniques.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: Le reste des actes de Joas
  rationale: Dans cette formule de conclusion de règne, דִּבְרֵי désigne idiomatiquement les actes ou faits du roi plutôt que ses seules paroles. Le וְ initial assure la continuité du récit sans exiger un adverbe temporel comme « maintenant ».
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: tout ce qu’il a fait
  rationale: Rend directement la totalité exprimée par כָּל et le sens large du verbe עָשָׂה.
- source_word: וּגְבוּרָתוֹ
  choice: et la vaillance dont il a fait preuve
  rationale: גְּבוּרָה peut désigner la force, la vaillance ou les hauts faits. « Vaillance » convient au contexte militaire et la tournure française relie naturellement cette qualité au combat qui suit.
- source_word: אֲשֶׁר נִלְחַם עִם אֲמַצְיָה
  choice: en combattant Amatsia
  rationale: Le verbe נלחם exprime ici un engagement militaire hostile. En français, « combattre Amatsia » communique clairement ce rapport adversatif sans alourdir la phrase.
- source_word: אֲמַצְיָה מֶלֶךְ יְהוּדָה
  choice: Amatsia, roi de Juda
  rationale: Emploie les formes françaises usuelles du nom propre et du titre royal.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: tout cela n’est-il pas écrit
  rationale: Préserve la question rhétorique hébraïque. « Tout cela » reprend naturellement en français l’ensemble des faits précédemment énumérés et correspond au pronom pluriel hébreu הֵם pris collectivement.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: dans le livre des Annales des rois d’Israël
  rationale: « Dans » est l’équivalent idiomatique de עַל lorsqu’il s’agit d’un document écrit. « Annales » rend clairement le titre d’un registre royal tout en évitant de l’identifier au livre biblique des Chroniques.
