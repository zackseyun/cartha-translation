  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/מֶ֣לֶךְ יִשְׂרָאֵ֗ל הַרְכֵּ֤ב יָֽדְ/ךָ֙ עַל הַ/קֶּ֔שֶׁת וַ/יַּרְכֵּ֖ב יָד֑/וֹ וַ/יָּ֧שֶׂם אֱלִישָׁ֛ע יָדָ֖י/ו עַל יְדֵ֥י הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/016.yaml
  text: Then he said to the king of Israel[a], “Put your hand on the bow.” So he put his hand on it, and Elisha laid his hands on the king’s hands.
translation:
  language: fr
  text: 'Puis il dit au roi d’Israël : « Pose ta main sur l’arc. » Le roi posa sa main dessus, et Élisée posa ses mains sur celles du roi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַרְכֵּב
  choice: Pose
  rationale: Le hiphil impératif de רכב décrit ici le fait de mettre la main sur l’arc. « Pose » est naturel en français et conserve clairement le geste concret.
- source_word: יָדְךָ עַל־הַקֶּשֶׁת
  choice: ta main sur l’arc
  rationale: Cette formulation rend directement la relation spatiale exprimée par עַל dans un français courant et digne.
- source_word: וַיַּרְכֵּב יָדוֹ
  choice: Le roi posa sa main dessus
  rationale: L’hébreu ne répète pas le complément. « Dessus » renvoie sans ambiguïté à l’arc, tandis que « le roi » évite une succession de pronoms potentiellement équivoque en français.
- source_word: וַיָּשֶׂם
  choice: posa
  rationale: « Posa » traduit simplement l’action de mettre les mains sur celles du roi, sans ajouter d’interprétation symbolique.
- source_word: יָדָיו עַל יְדֵי הַמֶּלֶךְ
  choice: ses mains sur celles du roi
  rationale: Le pluriel est conservé pour les mains d’Élisée et celles du roi; la reprise par « celles » produit une phrase française naturelle.
- source_word: וַיֹּאמֶר לְמֶלֶךְ יִשְׂרָאֵל
  choice: Puis il dit au roi d’Israël
  rationale: « Puis » marque naturellement la progression narrative du waw consécutif sans alourdir le récit.
theological_decisions:
- issue: Signification du geste d’Élisée posant ses mains sur celles du roi
  choice: Décrire le geste sans en préciser la portée symbolique
  alternative: Présenter le geste comme une transmission de puissance prophétique ou comme un signe de direction divine au combat
  rationale: Le verset rapporte l’acte, mais n’en explicite pas encore le sens. La traduction préserve donc l’image et laisse le contexte en éclairer la portée.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’adresse directe au roi dans l’hébreu. La répétition de « posa » reflète le parallèle des deux actions sans donner au geste une nuance absente du texte.
