  text: וַ/יָּ֖מָת חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֑ם וַ/יִּמְלֹ֛ךְ בֶּן הֲדַ֥ד בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/024.yaml
  text: Then Hazael king of Aram died[a], and Ben-hadad his son became king in his place.
translation:
  language: fr
  text: Hazaël, roi d’Aram, mourut, et son fils Ben-Hadad devint roi à sa place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le qal wayyiqtol de מות exprime simplement l’événement passé dans la suite narrative. Le passé simple convient au registre narratif biblique moderne et la coordination « et » rend le waw séquentiel sans ajouter un « alors » absent du contenu lexical.
- source_word: חֲזָאֵל
  choice: Hazaël
  rationale: Translittération française usuelle du nom propre, avec tréma pour signaler la séparation des voyelles.
- source_word: מֶלֶךְ אֲרָם
  choice: roi d’Aram
  rationale: Aram est le nom du royaume dans l’hébreu. Ce choix est historiquement plus précis que la traduction traditionnelle « Syrie ».
- source_word: וַיִּמְלֹךְ
  choice: devint roi
  rationale: Dans cette formule de succession, מלך désigne l’accession au trône plutôt que la durée du règne. « Devint roi » est naturel et précis en français.
- source_word: בֶּן־הֲדַד
  choice: Ben-Hadad
  rationale: Forme française claire du nom propre composé, conservée avec trait d’union.
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le suffixe pronominal renvoie à Hazaël; la relation filiale est explicitement maintenue.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans le contexte royal, תחתיו marque le remplacement et la succession. « À sa place » rend fidèlement cette formule.
