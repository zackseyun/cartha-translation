  yaml_path: translation/ot/2_kings/013/001.yaml
  text: In the twenty-third year of Joash son of Ahaziah, king of Judah, Jehoahaz son of Jehu began to reign over Israel in Samaria, and he reigned seventeen years.
translation:
  language: fr
  text: La vingt-troisième année du règne de Joas, fils d’Ahazia et roi de Juda, Joachaz, fils de Jéhu, commença à régner sur Israël à Samarie. Il régna dix-sept ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: commença à régner / régna
  rationale: Dans la formule chronologique d’ouverture, le premier emploi marque naturellement le début du règne; le second, associé à une durée, se rend simplement par « il régna ».
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: Reproduit directement la construction hébraïque désignant l’étendue de l’autorité royale.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: Indique le siège depuis lequel Joachaz exerce la royauté.
