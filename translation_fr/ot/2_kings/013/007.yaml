revisions:
- from: Car il n’avait laissé à Joachaz comme troupes que cinquante cavaliers, dix chars et dix mille fantassins. En effet, le roi d’Aram les avait détruites et les avait réduites à l’état de poussière sous le piétinement du battage[a].
  to: Car il n’avait laissé à Joachaz comme troupes que cinquante cavaliers, dix chars et dix mille fantassins. En effet, le roi d’Aram les avait détruites et les avait réduites comme de la poussière au battage[a].
  rationale: La révision remplace une explicitation lourde de l’image finale par une formulation française naturelle, plus proche du comparatif hébreu et de son ambiguïté. Le reste du texte est conservé, notamment le sens militaire contextuel de עָם.
