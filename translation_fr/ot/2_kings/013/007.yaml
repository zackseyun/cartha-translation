  text: כִּ֣י לֹא֩ הִשְׁאִ֨יר לִ/יהוֹאָחָ֜ז עָ֗ם כִּ֣י אִם חֲמִשִּׁ֤ים פָּֽרָשִׁים֙ וַ/עֲשָׂ֣רָה רֶ֔כֶב וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים רַגְלִ֑י כִּ֤י אִבְּדָ/ם֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יְשִׂמֵ֥/ם כֶּֽ/עָפָ֖ר לָ/דֻֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/007.yaml
  text: For he left Jehoahaz no people except fifty horsemen[a], ten chariots, and ten thousand foot soldiers, because the king of Aram had destroyed them and made them like dust at threshing.
translation:
  language: fr
  text: Car il n’avait laissé à Joachaz comme troupes que cinquante cavaliers, dix chars et dix mille fantassins. En effet, le roi d’Aram les avait détruites et les avait réduites comme de la poussière au battage[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « comme de la poussière à fouler » ou « comme de la poussière pour le battage ». Le terme hébreu évoque le foulage ou le battage; la nuance précise de la construction est discutée.'
    reason: La construction לָדוּשׁ peut désigner le battage ou le foulage qui lui est associé. La note préserve les principales nuances sans imposer une interprétation unique.
lexical_decisions:
- source_word: הִשְׁאִיר
  choice: avait laissé
  rationale: Le hifil de שׁאר exprime ici le fait de laisser subsister. Cette formulation conserve le sens actif et convient au contexte militaire.
- source_word: עָם
  choice: troupes
  rationale: Le nom signifie couramment « peuple », mais l’énumération des cavaliers, des chars et des fantassins lui donne ici un sens militaire. « Troupes » reste naturel sans élargir le propos à toute la population.
- source_word: כִּי אִם
  choice: ne… que
  rationale: Après la négation, cette tournure exprime naturellement en français l’unique reste des forces de Joachaz.
- source_word: פָּרָשִׁים
  choice: cavaliers
  rationale: Le terme désigne des combattants montés ; « cavaliers » est précis et usuel en français moderne.
- source_word: רֶכֶב
  choice: chars
  rationale: Bien que le singulier puisse avoir une valeur collective, le nombre dix indique ici des chars employés comme unités militaires.
- source_word: רַגְלִי
  choice: fantassins
  rationale: Le terme désigne les soldats combattant à pied. « Fantassins » est concis et immédiatement compréhensible.
- source_word: אִבְּדָם
  choice: les avait détruites
  rationale: Le piel de אבד indique une destruction sévère. Le pronom renvoie naturellement aux troupes, féminin pluriel en français.
- source_word: וַיְשִׂמֵם
  choice: les avait réduites à l’état de
  rationale: Avec la comparaison qui suit, שׂים décrit le résultat imposé. Cette formulation rend naturellement l’idée sans affaiblir l’image.
- source_word: כֶּעָפָר לָדוּשׁ
  choice: à l’état de poussière sous le piétinement du battage
  rationale: La traduction conserve la poussière ainsi que l’image de דושׁ, qui évoque le foulage ou piétinement associé au battage des céréales.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La première proposition conserve le sujet implicite de l’hébreu (« il »), identifiable dans le contexte, tandis que « troupes » explicite le sens militaire de עָם. La répétition causale de כִּי est rendue par « Car » puis « En effet » afin d’éviter une succession lourde de deux « car ».
