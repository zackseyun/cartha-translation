  text: וַ/יְחַ֥ל יְהוֹאָחָ֖ז אֶת פְּנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ יְהוָ֔ה כִּ֤י רָאָה֙ אֶת לַ֣חַץ יִשְׂרָאֵ֔ל כִּֽי לָחַ֥ץ אֹתָ֖/ם מֶ֥לֶךְ אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/004.yaml
  text: Then Jehoahaz sought the favor of Yahweh[a], and Yahweh listened to him, for he saw the oppression of Israel[b], because the king of Aram oppressed them.
translation:
  language: fr
  text: 'Alors Joachaz implora Yahweh[a], et Yahweh l’écouta, car il vit l’oppression d’Israël : le roi d’Aram l’opprimait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chercha la faveur de Yahweh ». L’expression hébraïque, littéralement « apaisa la face de Yahweh », est un idiome qui signifie solliciter sa faveur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: implora Yahweh
  rationale: L’expression idiomatique signifie chercher la faveur de quelqu’un ou le supplier. « implora » rend naturellement l’appel pressant sans reproduire littéralement « la face ».
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: l’écouta
  rationale: שׁמע construit avec אֶל exprime ici une écoute favorable; « l’écouta » préserve cette nuance sans expliciter davantage la réponse divine.
- source_word: כִּי רָאָה
  choice: car il vit
  rationale: Le premier כִּי introduit la raison pour laquelle Yahweh écoute Joachaz.
- source_word: לַחַץ יִשְׂרָאֵל
  choice: l’oppression que subissait Israël
  rationale: לַחַץ désigne la contrainte ou l’oppression exercée par une puissance hostile. La tournure française indique clairement qu’Israël en est la victime.
- source_word: כִּי לָחַץ אֹתָם מֶלֶךְ אֲרָם
  choice: de la part du roi d’Aram
  rationale: Le second כִּי précise l’origine de l’oppression. L’intégration en complément évite une répétition lourde de « opprimer » tout en conservant le rapport causal et l’agent.
- source_word: מֶלֶךְ אֲרָם
  choice: le roi d’Aram
  rationale: « Aram » conserve le nom hébreu du royaume plutôt que le terme historique plus tardif « Syrie ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom divin personnel; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Sens de וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: implora Yahweh
  alternative: chercha la faveur de Yahweh
  rationale: « implora » exprime l’acte de supplication indiqué par l’idiome, sans suggérer que Dieu aurait dû être rituellement apaisé.
translation_notes:
  register: Français moderne, digne et accessible. « Joachaz » suit la forme française usuelle du nom royal; « Aram » conserve le toponyme hébreu. La dernière proposition est intégrée à la précédente pour éviter la répétition peu naturelle « oppression… opprimait », sans perdre l’identité de l’oppresseur.
