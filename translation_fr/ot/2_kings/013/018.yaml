  text: וַ/יֹּ֛אמֶר קַ֥ח הַ/חִצִּ֖ים וַ/יִּקָּ֑ח וַ/יֹּ֤אמֶר לְ/מֶֽלֶךְ יִשְׂרָאֵל֙ הַךְ אַ֔רְצָ/ה וַ/יַּ֥ךְ שָֽׁלֹשׁ פְּעָמִ֖ים וַֽ/יַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/018.yaml
  text: Then he said[a], “Take the arrows,” and he took them. And he said to the king of Israel, “Strike the ground,” and he struck it three times and stopped.
translation:
  language: fr
  text: 'Puis il dit : « Prends les flèches. » Le roi les prit. Élisée dit au roi d’Israël : « Frappe le sol. » Le roi frappa trois fois, puis s’arrêta.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « puis resta immobile ». Le verbe hébreu signifie littéralement « se tenir, rester » ; dans ce contexte, il indique que le roi cessa de frapper après trois coups.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח הַחִצִּים
  choice: Prends les flèches
  rationale: L’impératif de לקח appelle un ordre direct et naturel. L’article défini de l’hébreu est conservé.
- source_word: וַיִּקָּח
  choice: Le roi les prit
  rationale: Le pronom « les » reprend naturellement « les flèches ». Le sujet explicite « le roi » évite en français une succession ambiguë de pronoms masculins, sans modifier le référent fourni par le contexte.
- source_word: לְמֶלֶךְ יִשְׂרָאֵל
  choice: au roi d’Israël
  rationale: Traduction directe et digne du complément indirect hébreu.
- source_word: הַךְ אַרְצָה
  choice: Frappe le sol
  rationale: נכה exprime ici une action énergique. « Frapper » convient au registre narratif, tandis que « tirer » préciserait excessivement la manière d’agir. La forme directive אַרְצָה désigne ici le sol vers lequel le coup est porté.
- source_word: וַיַּךְ שָׁלֹשׁ פְּעָמִים
  choice: Le roi frappa trois fois
  rationale: « Trois fois » rend directement l’expression numérique. La répétition du sujet clarifie qui accomplit l’action dans une narration française comportant deux hommes.
- source_word: וַיַּעֲמֹד
  choice: puis s’arrêta
  rationale: Le verbe signifie littéralement « se tenir, rester », mais indique ici idiomatiquement que le roi cessa de frapper. « Puis s’arrêta » transmet clairement cette valeur contextuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms « le roi » et « Élisée » remplacent certains pronoms hébreux afin de lever une ambiguïté référentielle peu naturelle en français, tout en respectant le contexte immédiat.
