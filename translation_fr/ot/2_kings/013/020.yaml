  text: וַ/יָּ֥מָת אֱלִישָׁ֖ע וַֽ/יִּקְבְּרֻ֑/הוּ וּ/גְדוּדֵ֥י מוֹאָ֛ב יָבֹ֥אוּ בָ/אָ֖רֶץ בָּ֥א שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/020.yaml
  text: Then Elisha died, and they buried him. Now raiding bands of Moab used to come into the land at the coming of the year.
translation:
  language: fr
  text: Élisée mourut, et on l’enterra. Or, des bandes de Moabites entraient dans le pays au début de l’année[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au printemps ». L’hébreu dit littéralement « à la venue de l’année »; l’expression peut désigner le début ou le tournant de l’année et est souvent comprise, dans ce contexte, comme le printemps, saison des campagnes militaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le verbe מות signifie simplement « mourir »; le passé simple fait progresser naturellement le récit en français.
- source_word: אֱלִישָׁע
  choice: Élisée
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: וַיִּקְבְּרֻהוּ
  choice: on l’enterra
  rationale: L’hébreu emploie un pluriel actif indéfini, littéralement « ils l’enterrèrent ». Le pronom indéfini « on » en restitue naturellement la valeur sans introduire des personnes non identifiées.
- source_word: גְדוּדֵי מוֹאָב
  choice: des bandes de pillards moabites
  rationale: גְדוּד désigne ici des bandes armées menant des incursions plutôt qu’une armée régulière; « moabites » exprime naturellement en français leur lien avec Moab.
- source_word: יָבֹאוּ
  choice: entraient
  rationale: L’imparfait hébreu a ici une valeur habituelle. L’imparfait français rend cette répétition, tandis que « entrer dans » explicite le mouvement indiqué par בוא avec בָאָרֶץ.
- source_word: בָאָרֶץ
  choice: dans le pays
  rationale: Avec le verbe de mouvement בוא, la préposition marque l’entrée dans le territoire. « Le pays » convient au territoire visé dans le contexte.
- source_word: בָּא שָׁנָה
  choice: au retour de l’année
  rationale: Cette expression reste proche de l’hébreu, littéralement « à la venue de l’année », et conserve l’ambiguïté de l’idiome au lieu de l’identifier sans réserve au printemps.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple porte les événements ponctuels, tandis que l’imparfait exprime les incursions habituelles. La tournure idiomatique finale est maintenue dans le texte et éclairée en note.
