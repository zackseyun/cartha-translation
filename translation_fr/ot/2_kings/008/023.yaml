source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹרָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/023.yaml
  text: The rest of the acts of Yoram[b][a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: fr
  text: Le reste des actes de Yoram[a], ainsi que tout ce qu’il a fait, n’est-il pas écrit dans le livre des Chroniques des rois de Juda[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Yoram ; traditionnellement : Joram.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « le livre des Annales des rois de Juda ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes
  rationale: Dans cette formule de bilan royal, דִּבְרֵי désigne les faits ou actes consignés concernant le roi. « Le reste des actes » est naturel en français tout en conservant le sens historiographique de l’expression.
- source_word: יוֹרָם
  choice: Yoram
  rationale: « Yoram » reproduit directement la forme hébraïque יוֹרָם. La forme française traditionnelle « Joram » est signalée en note.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: ainsi que tout ce qu’il a fait
  rationale: Cette formulation rend explicitement la totalité exprimée par כָל et relie naturellement les deux éléments de la phrase en français.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: n’est-il pas écrit
  rationale: La question rhétorique, qui appelle une réponse affirmative, est conservée. En français, l’accord au singulier avec le noyau « le reste », complété par « tout ce qu’il a fait », est plus naturel que le calque du pronom pluriel hébreu.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Bien que עַל signifie littéralement « sur », le français dit idiomatiquement qu’un renseignement est écrit « dans » un livre ou un registre.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: le livre des Chroniques des rois de Juda
  rationale: L’expression désigne les archives royales relatives aux rois de Juda. « Chroniques » conserve le rendu traditionnel, tandis que « Annales » demeure une possibilité lexicale indiquée en note.
