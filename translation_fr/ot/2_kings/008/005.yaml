revisions:
- from: 'Or, tandis qu’il racontait au roi comment Élisée avait rendu la vie au mort[a], voici que la femme dont il avait rendu le fils à la vie adressait au roi un appel pressant au sujet de sa maison et de son champ. Guéhazi dit : « Mon seigneur le roi, voici cette femme[b], et voici son fils, à qui Élisée a rendu la vie. »'
  to: 'Or, tandis qu’il racontait au roi comment Élisée avait rendu la vie à un mort[a], voici que la femme dont le fils avait été rendu à la vie par Élisée adressait au roi un appel pressant au sujet de sa maison et de son champ. Guéhazi dit : « Mon seigneur le roi, voici cette femme[b], et voici son fils, à qui Élisée avait rendu la vie. »'
  rationale: La révision corrige une construction possessive non idiomatique et clarifie sans ajouter d’interprétation que c’est le fils de cette femme qu’Élisée avait rendu à la vie. Elle maintient la valeur causative du verbe hébreu, l’effet narratif de « voici que », la requête urgente relative aux biens, ainsi que les deux ancres de note.
