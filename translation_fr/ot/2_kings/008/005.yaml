  text: וַ֠/יְהִי ה֥וּא מְסַפֵּ֣ר לַ/מֶּלֶךְ֮ אֵ֣ת אֲשֶׁר הֶחֱיָ֣ה אֶת הַ/מֵּת֒ וְ/הִנֵּ֨ה הָ/אִשָּׁ֜ה אֲשֶׁר הֶחֱיָ֤ה אֶת בְּנָ/הּ֙ צֹעֶ֣קֶת אֶל הַ/מֶּ֔לֶךְ עַל בֵּיתָ֖/הּ וְ/עַל שָׂדָ֑/הּ וַ/יֹּ֤אמֶר גֵּֽחֲזִי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ זֹ֚את הָֽ/אִשָּׁ֔ה וְ/זֶה בְּנָ֖/הּ אֲשֶׁר הֶחֱיָ֥ה אֱלִישָֽׁע־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/005.yaml
  text: And as he was telling the king how he had restored the dead to life[a], behold, the woman whose son he had restored to life was crying out to the king about her house and about her field. And Gehazi said, “My lord the king, this is the woman[b], and this is her son whom Elisha restored to life.”
translation:
  language: fr
  text: 'Or, tandis qu’il racontait au roi comment Élisée avait rendu la vie à un mort[a], voici que la femme dont le fils avait été rendu à la vie par Élisée adressait au roi un appel pressant au sujet de sa maison et de son champ. Guéhazi dit : « Mon seigneur le roi, voici cette femme[b], et voici son fils, à qui Élisée avait rendu la vie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « comment il avait fait revivre un mort » ou « comment il avait ramené un mort à la vie ». L’hébreu emploie la forme causative du verbe « vivre » (חיה).'
    reason: lexical_alternative
  - marker: b
    text: '« Voici » souligne la coïncidence soudaine et frappante : la femme apparaît précisément au moment où Guéhazi raconte ce récit.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הוּא מְסַפֵּר
  choice: Or, tandis qu’il racontait
  rationale: La construction narrative avec היה et le participe présente une action en cours servant de cadre temporel. « Or, tandis que » restitue naturellement cette transition en français.
- source_word: אֵת אֲשֶׁר הֶחֱיָה אֶת הַמֵּת
  choice: comment Élisée avait rendu la vie au mort
  rationale: Le hifil de חיה signifie « faire vivre, rendre la vie ». Le sujet implicite est explicité par « Élisée » pour éviter en français une ambiguïté momentanée avec Guéhazi, sans modifier le référent contextuel. Le singulier « au mort » préserve la forme hébraïque.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure conserve l’effet de surprise et la coïncidence frappante signalés par la particule, dans un registre narratif français digne et actuel.
- source_word: הָאִשָּׁה אֲשֶׁר הֶחֱיָה אֶת בְּנָהּ
  choice: la femme dont il avait rendu le fils à la vie
  rationale: L’hébreu relie grammaticalement la femme et l’action accomplie sur son fils. Cette formulation française reste proche de cette structure tout en demeurant intelligible.
- source_word: צֹעֶקֶת אֶל הַמֶּלֶךְ
  choice: adressait au roi un appel pressant
  rationale: צעק désigne ici un cri ou recours demandant secours ou justice. « Appel pressant » exprime l’urgence sans suggérer nécessairement qu’elle criait physiquement à cet instant.
- source_word: עַל בֵּיתָהּ וְעַל שָׂדָהּ
  choice: au sujet de sa maison et de son champ
  rationale: עַל introduit l’objet de la requête. « Champ » garde le sens concret de שדה et évite le terme plus général « terre ».
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Mon seigneur le roi
  rationale: Formule respectueuse qui reproduit l’adresse de cour sans ajouter une nuance doctrinale au titre « seigneur ».
- source_word: זֹאת הָאִשָּׁה וְזֶה בְּנָהּ
  choice: voici cette femme, et voici son fils
  rationale: Les démonstratifs identifient avec force les personnes présentes. La répétition de « voici » convient à la scène de reconnaissance immédiate.
- source_word: אֲשֶׁר הֶחֱיָה אֱלִישָׁע
  choice: à qui Élisée a rendu la vie
  rationale: La formulation conserve la valeur causative de חיה et nomme explicitement Élisée, comme l’hébreu.
