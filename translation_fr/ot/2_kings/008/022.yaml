  text: וַ/יִּפְשַׁ֣ע אֱד֗וֹם מִ/תַּ֨חַת֙ יַד יְהוּדָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה אָ֛ז תִּפְשַׁ֥ע לִבְנָ֖ה בָּ/עֵ֥ת הַ/הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/022.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. Then Libnah also rebelled at that time.
translation:
  language: fr
  text: Édom se révolta contre l’autorité de Juda, et il en est ainsi jusqu’à ce jour[a]. Alors, à cette époque-là, Libna se révolta elle aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se détacha de l’autorité de Juda ». Le verbe hébreu évoque ici une révolte politique contre le pouvoir établi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע
  choice: se révolta
  rationale: Dans ce contexte politique, פשע désigne une révolte contre une autorité établie. « Se révolta » est naturel en français et convient aux deux occurrences.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: contre la domination de Juda
  rationale: L’expression hébraïque signifie littéralement « de dessous la main de Juda » et désigne ici l’assujettissement politique. La formulation choisie rend clairement cet idiome sans conserver une image peu naturelle en français.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: et il en est ainsi jusqu’à ce jour
  rationale: Cette formule indique que la situation issue de la révolte se prolonge jusqu’au temps de rédaction; l’explicitation évite de laisser entendre que l’action ponctuelle de se révolter se poursuivait.
- source_word: אָז ... בָּעֵת הַהִיא
  choice: À cette même époque
  rationale: Les deux indications temporelles encadrent la seconde révolte et la rattachent au même moment historique. Une formulation française unique évite la lourdeur de « Alors... à cette époque » tout en préservant le lien temporel.
- source_word: לִבְנָה
  choice: Libna
  rationale: Translittération française usuelle du nom de lieu hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. L’idiome hébreu de la « main » est rendu selon son sens politique, tandis que la continuité historique de la situation est explicitée avec sobriété.
