base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/006.yaml
  text: The king asked the woman, and she told him. Then the king appointed an official[a] for her, saying, “Restore everything that belongs to her, along with all the yield of the field from the day she left the land until now.”
translation:
  language: fr
  text: 'Le roi interrogea la femme, et elle lui raconta. Alors le roi chargea un fonctionnaire[a] de cette affaire, en lui disant : « Restitue-lui tout ce qui lui appartient, ainsi que toute la production du champ depuis le jour où elle a quitté le pays jusqu’à présent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un eunuque ». Le titre employé à la cour peut désigner un eunuque au sens propre ou, plus généralement, un fonctionnaire royal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל הַמֶּלֶךְ לָאִשָּׁה
  choice: Le roi interrogea la femme
  rationale: Le verbe signifie ici demander ou interroger. Le français explicite naturellement que le roi sollicite son récit, tandis que « la femme » convient à la Sunamite déjà mentionnée.
- source_word: וַתְּסַפֶּר לוֹ
  choice: elle lui raconta ce qui s’était passé
  rationale: Au piel, ספר signifie raconter ou relater. Le complément explicite idiomatiquement le contenu sous-entendu sans en préciser davantage la nature.
- source_word: וַיִּתֶּן לָהּ הַמֶּלֶךְ סָרִיס אֶחָד
  choice: le roi chargea un fonctionnaire[a] de s’occuper d’elle
  rationale: La construction indique que le roi désigne un agent chargé de faire exécuter la restitution. « Fonctionnaire » rend le rôle de cour sans trancher le sens possible d’eunuque, signalé en note; le numéral אֶחָד marque ici un individu et n’a pas besoin d’être rendu mécaniquement.
- source_word: הָשֵׁיב אֶת כָּל אֲשֶׁר לָהּ
  choice: Restitue-lui tout ce qui lui appartient
  rationale: L’impératif hiphil de שוב ordonne de rendre les biens à leur propriétaire. « Restituer » convient au contexte juridique et administratif.
- source_word: כָּל תְּבוּאֹת הַשָּׂדֶה
  choice: toute la production de son champ
  rationale: תְּבוּאָה désigne les produits ou le rendement agricole. Le singulier collectif « production » est naturel en français; le possessif explicite le rapport déjà établi par le contexte.
- source_word: מִיּוֹם עָזְבָה אֶת הָאָרֶץ וְעַד עָתָּה
  choice: depuis le jour où elle a quitté le pays jusqu’à maintenant
  rationale: La tournure conserve les deux bornes temporelles de l’hébreu. Ici הָאָרֶץ désigne naturellement le pays ou territoire qu’elle avait quitté.
