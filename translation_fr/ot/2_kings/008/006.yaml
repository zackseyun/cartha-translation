revisions:
- from: 'Le roi interrogea la femme, et elle lui raconta ce qui s’était passé. Alors le roi chargea un fonctionnaire[a] de s’occuper d’elle en lui disant : « Restitue-lui tout ce qui lui appartient, ainsi que toute la production de son champ depuis le jour où elle a quitté le pays jusqu’à maintenant. »'
  to: 'Le roi interrogea la femme, et elle lui raconta. Alors le roi chargea un fonctionnaire[a] de cette affaire, en lui disant : « Restitue-lui tout ce qui lui appartient, ainsi que toute la production du champ depuis le jour où elle a quitté le pays jusqu’à présent. »'
  rationale: La révision retire deux explicitations qui ne sont pas exprimées par l’hébreu tout en conservant un français moderne et clair. Elle précise la portée administrative de la charge confiée au fonctionnaire par le contexte de l’ordre direct, sans trancher l’ambiguïté lexicale de סָרִיס, maintenue en note.
