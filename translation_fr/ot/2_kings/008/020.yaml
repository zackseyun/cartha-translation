source:
  edition: WLC
  text: בְּ/יָמָי/ו֙ פָּשַׁ֣ע אֱד֔וֹם מִ/תַּ֖חַת יַד יְהוּדָ֑ה וַ/יַּמְלִ֥כוּ עֲלֵי/הֶ֖ם מֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/020.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: fr
  text: De son temps, Édom se révolta contre la domination de Juda[a], et les Édomites établirent un roi à leur tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se révolta de dessous la main de Juda ».'
    reason: L’hébreu emploie une image concrète pour exprimer la fin de la domination politique de Juda.
lexical_decisions:
- source_word: בְּיָמָיו
  choice: De son temps
  rationale: Cette expression temporelle française, naturelle et concise, désigne la période du règne du roi dont il est question.
- source_word: פָּשַׁע
  choice: se révolta
  rationale: Dans ce contexte politique, le verbe désigne une révolte contre une puissance dominante, et non une transgression morale.
- source_word: אֱדוֹם
  choice: Édom / les Édomites
  rationale: « Édom » est la forme française usuelle. Dans la seconde proposition, le pluriel hébreu conduit à expliciter les membres de ce peuple par « les Édomites ».
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: contre la domination de Juda
  rationale: Cette formulation rend clairement en français moderne l’idée politique exprimée par l’image hébraïque « de dessous la main de Juda », tandis que la note conserve l’image originale.
- source_word: וַיַּמְלִכוּ עֲלֵיהֶם מֶלֶךְ
  choice: les Édomites établirent un roi à leur tête
  rationale: Le hifil de מלך signifie ici faire régner ou instituer quelqu’un comme roi. « À leur tête » rend naturellement עֲלֵיהֶם sans suggérer une action réflexive artificielle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le texte privilégie une formulation politique naturelle tout en conservant dans la note l’image concrète de l’hébreu.
