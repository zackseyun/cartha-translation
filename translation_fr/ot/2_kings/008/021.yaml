base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/021.yaml
  text: So Joram crossed over to Zair[a], with all the chariots with him. Then he arose by night and struck Edom, which had surrounded him, and the commanders of the chariots[b]; but the people fled to their tents.
translation:
  language: fr
  text: Alors Joram passa à Tsaïr[a], avec tous ses chars. Il se leva de nuit et frappa les Édomites qui l’encerclaient, ainsi que les commandants des chars. Mais le peuple s’enfuit vers ses tentes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « à Séïr ». Le nom de lieu hébreu est difficile ; certains y voient une forme liée à Séïr, autre nom du territoire d’Édom, plutôt que le nom distinct Tsaïr.
    reason: alternative_reading
  - marker: b
    text: « S’enfuir vers ses tentes » est une expression hébraïque qui signifie que les hommes se dispersèrent et rentrèrent chez eux.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: passa
  rationale: Le verbe עבר exprime ici le déplacement vers un lieu; « passa » reste proche de l’hébreu sans préciser indûment l’itinéraire.
- source_word: צָעִירָה
  choice: à Tsaïr
  rationale: Le texte massorétique vocalisé semble désigner un lieu. La translittération « Tsaïr » en conserve la forme tout en signalant en note l’incertitude textuelle et géographique.
- source_word: וְכָל הָרֶכֶב עִמּוֹ
  choice: avec tous ses chars
  rationale: רכב peut désigner collectivement les chars ou les forces de chars. Cette formulation française est naturelle et conserve l’image concrète.
- source_word: קָם לַיְלָה
  choice: se leva de nuit
  rationale: La formulation garde la séquence narrative et l’idée d’une action entreprise pendant la nuit, sans ajouter qu’il partit ou attaqua dès cet instant.
- source_word: וַיַּכֶּה
  choice: frappa
  rationale: נכה est un terme militaire large. « Frappa » n’exagère pas l’issue en parlant d’une défaite totale.
- source_word: אֱדוֹם הַסֹּבֵיב אֵלָיו
  choice: les Édomites qui l’encerclaient
  rationale: Le collectif « Édom » désigne ici les forces édomites; la relative rend clairement le participe indiquant qu’elles entouraient Joram.
- source_word: שָׂרֵי הָרֶכֶב
  choice: les chefs des chars
  rationale: שׂרים désigne des chefs ou commandants. La traduction conserve la relation avec les chars sans imposer une terminologie militaire moderne.
- source_word: וַיָּנָס הָעָם לְאֹהָלָיו
  choice: le peuple s’enfuit vers ses tentes
  rationale: La traduction conserve le singulier collectif et l’image idiomatique hébraïque, expliquée en note.
