  text: In the twelfth year of Joram son of Ahab[a], king of Israel, Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: fr
  text: La douzième année du règne de Joram[a], fils d’Achab et roi d’Israël, Achazia, fils de Joram et roi de Juda, devint roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pour le roi d’Israël, l’hébreu emploie ici la forme Yoram, et pour le roi de Juda la forme Yehoram. Ces deux formes apparentées sont traditionnellement rendues toutes deux par « Joram » en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: La douzième année du règne de
  rationale: La formule hébraïque de datation royale est idiomatique. L’ajout de « du règne » explicite naturellement en français ce que la construction exprime dans ce contexte.
- source_word: לְ/יוֹרָם
  choice: de Joram
  rationale: Dans cette formule royale, la préposition ל indique le roi dont on compte les années de règne.
- source_word: בֶּן אַחְאָב
  choice: fils d’Achab
  rationale: La construction patronymique est rendue directement.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Le titre royal est traduit directement en français courant.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans une notice d’accession, le qatal de מלך indique couramment le commencement du règne. « Devint roi » est clair et naturel.
- source_word: אֲחַזְיָהוּ
  choice: Ahazia
  rationale: Transcription française biblique courante du nom hébreu.
- source_word: בֶן יְהוֹרָם
  choice: fils de Joram
  rationale: La forme hébraïque יְהוֹרָם est rendue selon la convention française courante « Joram ». La note signale que l’hébreu emploie ici deux formes apparentées, distinction moins visible en français.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Le titre royal est traduit directement.
