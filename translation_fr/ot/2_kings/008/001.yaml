  text: וֶ/אֱלִישָׁ֡ע דִּבֶּ֣ר אֶל הָ/אִשָּׁה֩ אֲשֶׁר הֶחֱיָ֨ה אֶת בְּנָ֜/הּ לֵ/אמֹ֗ר ק֤וּמִי וּ/לְכִי֙ אתי וּ/בֵיתֵ֔/ךְ וְ/ג֖וּרִי בַּ/אֲשֶׁ֣ר תָּג֑וּרִי כִּֽי קָרָ֤א יְהוָה֙ לָֽ/רָעָ֔ב וְ/גַם בָּ֥א אֶל הָ/אָ֖רֶץ שֶׁ֥בַע שָׁנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/001.yaml
  text: Elisha had spoken to the woman whose son he had restored to life[a], saying, “Arise, and go, you and your household, and stay wherever you can stay, for Yahweh has called for a famine, and it has also come upon the land for seven years.”
translation:
  language: fr
  text: 'Élisée avait dit à la femme dont il avait rendu la vie au fils : « Lève-toi, pars, toi et les tiens, et va séjourner là où tu pourras[a], car Yahweh a appelé la famine, et elle doit aussi venir sur le pays pendant sept ans. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu peut aussi signifier « résider comme étrangère » ou « vivre temporairement » : il ne s’agit pas nécessairement d’une installation durable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבֶּר ... לֵאמֹר
  choice: 'avait dit ... :'
  rationale: Le plus-que-parfait situe naturellement cette parole avant les événements racontés ensuite. En français, « avait dit » suivi des deux-points rend sans lourdeur la construction hébraïque « avait parlé ... en disant ».
- source_word: אֲשֶׁר הֶחֱיָה אֶת־בְּנָהּ
  choice: dont il avait ramené le fils à la vie
  rationale: Cette formulation idiomatique conserve la valeur causative de החיה et rappelle que le fils était mort puis rendu vivant.
- source_word: קוּמִי וּלְכִי
  choice: Lève-toi, pars
  rationale: Les deux impératifs féminins singuliers sont conservés. « Pars » convient mieux que le simple « va » puisqu’il s’agit de quitter le pays menacé.
- source_word: אתי וּבֵיתֵךְ
  choice: toi et les tiens
  rationale: La « maison » désigne ici les personnes qui composent le foyer. « Les tiens » est clair, naturel et inclut la maisonnée sans réduire nécessairement celle-ci à la seule famille nucléaire.
- source_word: וְגוּרִי בַּאֲשֶׁר תָּגוּרִי
  choice: va séjourner là où tu pourras
  rationale: גור évoque une résidence non permanente, souvent en qualité d’étrangère. « Séjourner » garde cette nuance, tandis que « là où tu pourras » exprime naturellement la liberté pratique impliquée par la proposition.
- source_word: קָרָא יְהוָה לָרָעָב
  choice: Yahweh a appelé la famine
  rationale: קרא avec ל présente Yahweh comme celui qui appelle ou convoque la famine. La métaphore inhabituelle est conservée plutôt que remplacée par une simple annonce.
- source_word: וְגַם בָּא אֶל־הָאָרֶץ שֶׁבַע שָׁנִים
  choice: et elle va s’abattre sur le pays pendant sept ans
  rationale: Dans cette parole d’avertissement, le parfait hébreu présente la venue comme certaine. Le futur proche français convient au cadre narratif, et « s’abattre sur » exprime idiomatiquement la venue d’une famine sur un territoire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le représente comme nom propre sans le remplacer par un titre.
- issue: Agentivité divine dans l’arrivée de la famine
  choice: Yahweh a appelé la famine
  alternative: Yahweh a annoncé une famine
  rationale: Le rendu retenu préserve l’image forte du texte, où Yahweh convoque la famine, sans atténuer son rôle en simple annonceur.
- issue: Valeur temporelle de וְגַם בָּא
  choice: elle va s’abattre
  alternative: elle est aussi venue
  rationale: Le parfait peut présenter comme accompli un événement certain, alors que le contexte montre que l’avertissement précède les sept années. Le français exprime cette imminence certaine au futur proche sans nier la tension aspectuelle de l’hébreu.
translation_notes:
  register: Français international actuel, narratif et digne. Les impératifs restent directs sans archaïsme. « Les tiens » rend la maisonnée dans une langue ordinaire; « séjourner » maintient la nuance de résidence temporaire.
