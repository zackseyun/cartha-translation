  text: וַ/יָּבֹ֤א אֱלִישָׁע֙ דַּמֶּ֔שֶׂק וּ/בֶן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם חֹלֶ֑ה וַ/יֻּגַּד ל֣/וֹ לֵ/אמֹ֔ר בָּ֛א אִ֥ישׁ הָ/אֱלֹהִ֖ים עַד הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/007.yaml
  text: Then Elisha came to Damascus. Now Ben-hadad king of Aram was sick[a], and it was told him, saying, “The man of God has come here.”
translation:
  language: fr
  text: 'Élisée vint à Damas. Ben-Hadad, roi d’Aram[a], était malade. On lui annonça : « L’homme de Dieu est arrivé jusqu’ici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Syrie ». L’hébreu porte « Aram ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient à une narration française soutenue et naturelle.
- source_word: אֱלִישָׁע
  choice: Élisée
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: דַּמֶּשֶׂק
  choice: Damas
  rationale: Forme française standard du nom de lieu.
- source_word: וּבֶן־הֲדַד
  choice: Ben-Hadad
  rationale: La conjonction introduit ici une information de contexte. En français, une nouvelle phrase sans conjonction exprime naturellement cette transition.
- source_word: מֶלֶךְ אֲרָם
  choice: roi d’Aram
  rationale: Aram reproduit directement le terme ethnogéographique hébreu, sans le remplacer par l’équivalent historique interprétatif « Syrie ».
- source_word: חֹלֶה
  choice: était malade
  rationale: Le participe prédicatif décrit l’état du roi; cette formulation est simple et exacte.
- source_word: וַיֻּגַּד לוֹ
  choice: On lui annonça
  rationale: Le pronom indéfini français rend naturellement le passif impersonnel hébreu tout en indiquant qu’une information lui fut communiquée.
- source_word: לֵאמֹר
  choice: introduit par les deux-points
  rationale: La ponctuation française rend naturellement la formule hébraïque de citation sans l’alourdir par « en disant ».
- source_word: בָּא
  choice: est arrivé
  rationale: L’accompli dans le discours rapporté présente une arrivée déjà réalisée dont le résultat demeure actuel.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: La traduction conserve le titre hébreu littéral et sa résonance narrative, plutôt que de l’expliciter par « prophète ».
- source_word: עַד הֵנָּה
  choice: jusqu’ici
  rationale: Cette expression conserve la valeur de עַד, marquant que l’homme de Dieu est parvenu jusqu’au lieu où se trouvent les locuteurs.
