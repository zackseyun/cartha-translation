source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ בֵּ֣ית אַחְאָ֔ב וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּ֛י חֲתַ֥ן בֵּית אַחְאָ֖ב הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/027.yaml
  text: He walked in the way of the house of Ahab and did what was evil in the sight of Yahweh[a], like the house of Ahab, for he was a son-in-law of the house of Ahab.
translation:
  language: fr
  text: Il marcha dans la voie de la maison d’Achab et fit ce qui est mal aux yeux de Yahweh, comme la maison d’Achab, car il était le gendre de la maison d’Achab[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il était apparenté à la maison d’Achab par mariage ». Le terme hébreu peut désigner plus largement une relation créée par mariage, mais « gendre » convient précisément dans ce contexte.'
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Il marcha dans la voie
  rationale: Cette formulation conserve la métaphore hébraïque de la marche pour désigner la conduite, tout en restant intelligible en français biblique moderne.
- source_word: בֵּית אַחְאָב
  choice: la maison d’Achab
  rationale: « Maison » peut désigner à la fois la famille, l’entourage dynastique et la lignée royale d’Achab; cette traduction préserve cette amplitude.
- source_word: וַיַּעַשׂ הָרַע
  choice: fit ce qui est mal
  rationale: Cette expression rend naturellement la formule d’évaluation morale récurrente dans les livres des Rois.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La traduction garde l’image hébraïque des « yeux » et exprime l’évaluation divine.
- source_word: כְּבֵית אַחְאָב
  choice: comme la maison d’Achab
  rationale: Le comparatif demeure concis et conserve comme référent collectif la famille ou dynastie d’Achab.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de la conduite et de l’évaluation qui précèdent.
- source_word: חֲתַן בֵּית אַחְאָב
  choice: il lui était apparenté par mariage
  rationale: חֲתַן désigne une relation créée par mariage et peut plus précisément signifier « gendre ». La formulation retenue évite de préciser à tort le lien exact tout en conservant son caractère matrimonial.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte explicitement le nom divin; « Yahweh » le représente comme nom propre sans le remplacer par un titre.
- issue: Portée de la comparaison avec la maison d’Achab
  choice: Maintien de « comme la maison d’Achab »
  alternative: comme l’avait fait la maison d’Achab
  rationale: La formulation conserve la brièveté et la possible portée collective de l’hébreu, sans réduire la comparaison à un seul acte passé.
translation_notes:
  register: Français international moderne, digne et lisible. La métaphore biblique « marcher dans la voie » et l’expression « aux yeux de Yahweh » sont conservées, tandis que la relation matrimoniale est formulée sans imposer une précision que le terme hébreu ne garantit pas dans ce contexte.
