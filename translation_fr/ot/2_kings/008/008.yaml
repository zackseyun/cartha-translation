  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל חֲזָהאֵ֗ל קַ֤ח בְּ/יָֽדְ/ךָ֙ מִנְחָ֔ה וְ/לֵ֕ךְ לִ/קְרַ֖את אִ֣ישׁ הָ/אֱלֹהִ֑ים וְ/דָרַשְׁתָּ֨ אֶת יְהוָ֤ה מֵֽ/אוֹת/וֹ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/008.yaml
  text: And the king said to Hazael[a], “Take a gift in your hand, and go to meet the man of God, and inquire of Yahweh through him, saying, ‘Will I recover from this sickness?’”
translation:
  language: fr
  text: 'Le roi dit à Hazaël : « Prends un présent avec toi et va à la rencontre de l’homme de Dieu. Par son intermédiaire, consulte Yahweh en lui demandant : “Guérirai-je de cette maladie ?” »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Survivrai-je à cette maladie ? » Le verbe hébreu signifie littéralement « vivre » et peut ici désigner le fait de survivre ou de guérir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: un présent
  rationale: Dans ce récit, il s’agit d’un don apporté au prophète à l’occasion d’une consultation, et non d’une offrande cultuelle. « Présent » convient au registre narratif et à la situation diplomatique.
- source_word: בְּיָדְךָ
  choice: avec toi
  rationale: Littéralement « dans ta main ». L’expression idiomatique française « prends ... avec toi » transmet naturellement l’idée qu’Hazaël doit l’emporter lui-même.
- source_word: לִקְרַאת
  choice: à la rencontre de
  rationale: Après « va », l’infinitif indique le but du déplacement. « Va à la rencontre de » est naturel et proche de la structure hébraïque.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Ce titre hébreu désigne un prophète, mais sa traduction littérale conserve sa portée narrative et théologique.
- source_word: וְדָרַשְׁתָּ אֶת־יְהוָה מֵאֹתוֹ
  choice: Par son intermédiaire, consulte Yahweh
  rationale: דרשׁ exprime ici la recherche d’une réponse divine, tandis que מֵאֹתוֹ indique que l’homme de Dieu sert d’intermédiaire. La formulation française rend explicitement cette médiation sans confondre le prophète avec la source de l’oracle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: הַאֶחְיֶה
  choice: Guérirai-je
  rationale: Le verbe signifie littéralement « vivre », mais, dans le contexte d’une maladie, la question porte idiomatiquement sur la guérison ou la survie. « Guérirai-je » est clair et naturel, tandis qu’une note conserve le sens littéral.
- source_word: מֵחֳלִי זֶה
  choice: de cette maladie
  rationale: Cette formulation française exprime naturellement le mal dont le roi demande s’il guérira.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le Tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Médiation de l’homme de Dieu dans la consultation
  choice: Par son intermédiaire, consulte Yahweh
  alternative: interroge Yahweh auprès de lui
  rationale: La formulation préserve à la fois Yahweh comme source de la réponse et le prophète comme intermédiaire, sans préciser davantage le mécanisme de révélation.
translation_notes:
  register: Français international moderne, narratif et digne. « Présent » évite la connotation cultuelle d’« offrande ». L’ordre des propositions a été légèrement ajusté pour rendre clairement et naturellement en français la consultation de Yahweh par l’intermédiaire du prophète.
