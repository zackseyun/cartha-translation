  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱלִישָׁ֔ע לֵ֥ךְ אֱמָר לא חָיֹ֣ה תִחְיֶ֑ה וְ/הִרְאַ֥/נִי יְהוָ֖ה כִּֽי מ֥וֹת יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/010.yaml
  text: And Elisha said to him[a], “Go, say to him, ‘You will certainly recover’; but Yahweh has shown me that he will certainly die.”
translation:
  language: fr
  text: 'Élisée lui dit : « Va lui dire : “Tu guériras certainement.”[a] Cependant, Yahvé m’a montré qu’il mourra certainement. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Tu ne vivras certainement pas. » Le texte est difficile. Beaucoup comprennent ici le sens : « Tu guériras certainement », en contraste avec la révélation qui suit, selon laquelle il mourra effectivement.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱלִישָׁע
  choice: Élisée lui dit
  rationale: Le sujet Élisée est explicite en hébreu. Cette formulation est naturelle en français et conserve le destinataire pronominal.
- source_word: לֵךְ אֱמָר
  choice: Va lui dire
  rationale: Cette tournure française naturelle rend la succession des deux impératifs sans lourdeur.
- source_word: לא חָיֹה תִחְיֶה
  choice: Tu guériras certainement
  rationale: Dans le contexte de la maladie, « guérir » exprime mieux que le calque « vivre » le sens vraisemblablement visé. L’infinitif absolu suivi de l’imparfait marque la certitude. La difficulté du לא négatif du texte massorétique est signalée en note.
- source_word: וְהִרְאַנִי יְהוָה
  choice: Cependant, Yahvé m’a montré
  rationale: « Cependant » explicite la valeur adversative du waw dans le contraste entre le message à transmettre et la révélation prophétique. Le nom divin est translittéré « Yahvé » conformément à l’usage du projet.
- source_word: כִּי מוֹת יָמוּת
  choice: qu’il mourra certainement
  rationale: L’infinitif absolu avec l’imparfait exprime une mort certaine; la formulation choisie en restitue clairement l’emphase en français moderne.
theological_decisions:
- issue: Interprétation de לא חיה תחיה
  choice: Le texte principal donne l’instruction d’annoncer une guérison certaine.
  alternative: « Tu ne vivras certainement pas », selon la forme négative du texte massorétique; ou « Tu vivras certainement », si l’on suppose notamment לוֹ à la place de לא.
  rationale: La lecture négative littérale s’accorde difficilement avec le contraste qui suit et avec le récit, où Ben-Hadad peut guérir de sa maladie mais mourra par l’action de Hazaël. Le texte principal rend donc le sens contextuel probable, tandis que la note conserve avec transparence la difficulté textuelle et interprétative.
translation_notes:
  register: Français international moderne, clair et digne. « Va lui dire » est idiomatique; « guériras » convient au contexte médical; les deux adverbes « certainement » préservent les constructions hébraïques emphatiques parallèles.
