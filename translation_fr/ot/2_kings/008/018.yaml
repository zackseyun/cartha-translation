  source_fidelity: 'La formulation suit fidèlement la structure du verset : conduite selon le modèle des rois d’Israël, comparaison avec la maison d’Achab, motivation matrimoniale, puis jugement divin. Toutefois, « une fille d’Achab » affaiblit indûment la référence définie portée par le complément en construction (« fille d’Achab »), qui désigne ici son épouse connue dans le récit.'
