  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָֽיְתָה לּ֖/וֹ לְ/אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/018.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife, and he did what was evil in the eyes of Yahweh.
translation:
  language: fr
  text: Il suivit la voie des rois d’Israël, comme l’avait fait la maison d’Achab, car il avait pour femme la fille d’Achab. Il fit ce qui est mal aux yeux de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Il suivit la voie
  rationale: L’expression hébraïque décrit la conduite selon un modèle. « Suivre la voie » conserve la métaphore tout en étant naturel en français moderne.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: Rend directement le groupe nominal désignant les souverains du royaume du Nord comme modèle de conduite.
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: comme l’avait fait la maison d’Achab
  rationale: Le singulier français s’accorde avec « maison », nom collectif qui désigne ici la famille ou dynastie d’Achab; le plus-que-parfait situe ce modèle avant la conduite décrite.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français la raison de cette conformité à la maison d’Achab.
- source_word: בַּת אַחְאָב הָיְתָה לּוֹ לְאִשָּׁה
  choice: il avait pour femme une fille d’Achab
  rationale: Rend idiomatiquement l’état matrimonial exprimé en hébreu sans transformer la proposition en événement. L’absence d’article devant « fille » est reflétée par « une fille ».
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: Reproduit la formule d’évaluation morale et la substantivation de הָרַע dans un français clair et digne.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Conserve l’image hébraïque de l’évaluation divine et transcrit le nom propre divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » le rend comme nom propre plutôt que de le remplacer par un titre.
- issue: Rapport entre le mariage et la conduite mauvaise
  choice: Conserver le lien explicatif formulé par « car »
  alternative: Atténuer ou expliciter davantage une causalité personnelle directe
  rationale: Le texte présente le mariage comme explication narrative de la conformité à la maison d’Achab, sans détailler le mécanisme ni attribuer explicitement toute la faute à l’épouse.
translation_notes:
  register: Français international moderne, narratif et digne. La métaphore de la « voie » et celle des « yeux » sont conservées parce qu’elles restent transparentes. « Maison d’Achab » maintient l’expression dynastique biblique sans imposer l’explicitation « dynastie ».
