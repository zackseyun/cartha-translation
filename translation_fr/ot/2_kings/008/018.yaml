  terminology: Les noms propres Israël, Achab et Yahweh sont cohérents. « Maison d’Achab » conserve utilement l’expression dynastique hébraïque sans lui imposer une interprétation technique. Le jugement « ce qui est mal aux yeux de Yahweh » rend correctement la formule hébraïque.
