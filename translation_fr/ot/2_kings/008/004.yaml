  text: וְ/הַ/מֶּ֗לֶךְ מְדַבֵּר֙ אֶל גֵּ֣חֲזִ֔י נַ֥עַר אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹ֑ר סַפְּרָ/ה נָּ֣א לִ֔/י אֵ֥ת כָּל הַ/גְּדֹל֖וֹת אֲשֶׁר עָשָׂ֥ה אֱלִישָֽׁע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/004.yaml
  text: The king was speaking with Gehazi[a], the servant of the man of God, saying, “Please tell me all the great things that Elisha has done.”
translation:
  language: fr
  text: 'Le roi était en train de parler avec Guéhazi, le serviteur[a] de l’homme de Dieu. Il lui disait : « Raconte-moi, je te prie, toutes les grandes choses qu’Élisée a faites. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’assistant de l’homme de Dieu » ou « le jeune homme de l’homme de Dieu »; le mot hébreu נַעַר peut désigner, selon le contexte, un serviteur, un assistant ou un jeune homme.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֵּר
  choice: était en train de parler
  rationale: Le participe place à l’arrière-plan une action en cours dans le récit; cette tournure rend clairement la valeur progressive en français moderne.
- source_word: גֵּחֲזִי
  choice: Guéhazi
  rationale: Translittération française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: נַעַר
  choice: serviteur
  rationale: Dans la relation avec « l’homme de Dieu », le terme désigne vraisemblablement la fonction de Guéhazi; une note conserve les autres valeurs possibles du mot hébreu.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Rend littéralement le titre hébreu consacré sans le préciser davantage par « prophète ».
- source_word: סַפְּרָה נָּא לִי
  choice: Raconte-moi, je te prie
  rationale: ספר appelle ici le récit détaillé des actes, tandis que נָא nuance l’impératif par une demande courtoise.
- source_word: כָּל הַגְּדֹלוֹת
  choice: toutes les grandes choses
  rationale: L’adjectif féminin pluriel substantivé désigne de grands actes ou faits remarquables; cette formulation préserve l’ampleur sémantique de l’hébreu.
- source_word: עָשָׂה
  choice: a faites
  rationale: Le passé composé présente naturellement en français les actes accomplis d’Élisée qui restent pertinents dans la conversation.
- source_word: וְהַמֶּלֶךְ
  choice: Le roi
  rationale: Le waw assure ici la continuité narrative; il n’est pas nécessaire de le rendre par un connecteur explicite en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La progression narrative est rendue sans ajouter de marqueur temporel absent de l’hébreu. La répétition française est évitée en divisant la phrase après « l’homme de Dieu », tout en conservant l’action en cours et l’introduction de la parole.
