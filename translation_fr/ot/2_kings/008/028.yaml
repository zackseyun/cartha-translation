  text: וַ/יֵּ֜לֶךְ אֶת יוֹרָ֣ם בֶּן אַחְאָ֗ב לַ/מִּלְחָמָ֛ה עִם חֲזָהאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמֹ֣ת גִּלְעָ֑ד וַ/יַּכּ֥וּ אֲרַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/028.yaml
  text: He went with Joram son of Ahab to war against Hazael king of Aram at Ramoth-gilead[b][a], and the Arameans wounded Joram.
translation:
  language: fr
  text: Il partit avec Joram, fils d’Achab, faire la guerre à Hazaël, roi d’Aram, à Ramoth en Galaad. Les Araméens blessèrent[a] Joram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frappèrent ». Le verbe hébreu a un sens plus général ; le contexte indique ici que Joram fut blessé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אֶת יוֹרָם
  choice: Il partit avec Joram
  rationale: Après le verbe « aller », אֵת exprime ici l’accompagnement. « Partit avec » rend naturellement le mouvement dans ce contexte militaire.
- source_word: לַמִּלְחָמָה עִם חֲזָהאֵל
  choice: faire la guerre à Hazaël
  rationale: Dans ce contexte, עִם marque l’adversaire engagé au combat, et non l’accompagnement. Cette tournure française exprime clairement l’opposition.
- source_word: מֶלֶךְ אֲרָם
  choice: roi d’Aram
  rationale: « Aram » reproduit directement le nom ethnogéographique hébreu, plutôt que l’équivalent traditionnel « Syrie ».
- source_word: בְּרָמֹת גִּלְעָד
  choice: à Ramoth en Galaad
  rationale: Le syntagme désigne le lieu de la bataille. La forme française traditionnelle et intelligible « Ramoth en Galaad » distingue la ville de la région.
- source_word: וַיַּכּוּ
  choice: blessèrent
  rationale: Le verbe נכה signifie largement « frapper ». Le contexte immédiat, explicité au verset suivant, montre qu’il s’agit ici d’une blessure et non de la mort de Joram.
- source_word: אֲרַמִּים
  choice: les Araméens
  rationale: Le nom ethnique pluriel est rendu directement et reste cohérent avec « Aram ».
- source_word: יוֹרָם
  choice: Joram
  rationale: Cette forme française correspond à la forme hébraïque présente dans le verset.
