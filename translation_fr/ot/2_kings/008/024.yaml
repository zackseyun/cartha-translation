  text: וַ/יִּשְׁכַּ֤ב יוֹרָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ אֲחַזְיָ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/024.yaml
  text: And Yoram lay down with his fathers and was buried with his fathers in the City of David[b][a], and Ahaziah his son reigned in his place.
translation:
  language: fr
  text: Yoram[a] se coucha avec ses ancêtres[b] et fut enterré avec eux dans la Cité de David. Son fils Ahazia régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce nom est traditionnellement rendu par « Joram » dans de nombreuses versions françaises.
    reason: alternative_reading
  - marker: b
    text: Ou « s’endormit avec ses ancêtres ». L’hébreu emploie une formule royale conventionnelle pour évoquer la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Le verbe שׁכב signifie littéralement « se coucher » et appartient ici à la formule royale conventionnelle annonçant la mort. Cette traduction conserve l’image hébraïque sans la réduire simplement à « mourut ».
- source_word: עִם אֲבֹתָיו
  choice: avec ses ancêtres
  rationale: Dans cette formule dynastique, אבות désigne les générations précédentes. « Ancêtres » est plus naturel et immédiatement compréhensible en français moderne que le calque « pères », tout en préservant la portée généalogique.
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: La forme niphal exprime ici le passif. « Fut enterré » rend clairement la succession narrative.
- source_word: בְּעִיר דָּוִד
  choice: dans la Cité de David
  rationale: « Cité de David » rend l’expression comme un nom de lieu reconnu, et non comme une simple description possessive.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Le verbe מלך est employé dans la formule de succession royale. « Régna » en garde la concision et n’ajoute pas un commencement explicitement formulé.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans un contexte de succession, תחתיו signifie qu’Ahazia succède à Yoram dans sa fonction royale.
- source_word: יוֹרָם
  choice: Yoram
  rationale: Cette forme suit directement le nom hébreu יוֹרָם plutôt que sa forme française traditionnelle « Joram ».
- source_word: אֲחַזְיָהוּ
  choice: Ahazia
  rationale: Cette translittération française suit de près la forme hébraïque du nom, sans adopter une variante confessionnelle traditionnelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formule hébraïque de mort est conservée dans le texte, avec une note qui en explicite le sens. La seconde occurrence de « avec ses ancêtres » est reprise par « avec eux » afin d’éviter une répétition lourde sans modifier le référent.
