source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת חָמֵ֗שׁ לְ/יוֹרָ֤ם בֶּן אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה מָלַ֛ךְ יְהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/016.yaml
  text: And in the fifth year of Joram son of Ahab king of Israel[a], while Jehoshaphat was king of Judah, Jehoram son of Jehoshaphat, king of Judah[b], began to reign.
translation:
  language: fr
  text: La cinquième année du règne de Joram, fils d’Achab, roi d’Israël, alors que Josaphat était roi de Juda[a], Jéhoram, fils de Josaphat, roi de Juda, commença à régner[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et Josaphat, roi de Juda ». La formulation hébraïque est condensée ; certains y voient l’indication d’une période de corégence.'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu emploie deux formes apparentées mais distinctes : « Joram » pour le roi d’Israël et « Jéhoram » pour le fils de Josaphat, roi de Juda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת חָמֵשׁ לְ/יוֹרָם
  choice: La cinquième année du règne de Yoram
  rationale: La formule rend naturellement en français la notice chronologique hébraïque. Le cardinal hébreu a ici une valeur ordinale, et la préposition indique que l’année est comptée dans le règne de Yoram.
- source_word: בֶּן אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: fils d’Achab et roi d’Israël
  rationale: Le patronyme et le titre royal sont conservés; la coordination par « et » rend l’apposition claire en français.
- source_word: וִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: alors que Josaphat était roi de Juda
  rationale: La proposition hébraïque, nominale et condensée, est explicitée comme circonstance temporelle sans introduire dans le texte l’hypothèse plus précise d’une corégence.
- source_word: מָלַךְ
  choice: commença à régner
  rationale: Dans une notice royale, le verbe signale ici l’accession au règne plutôt que toute sa durée.
- source_word: יוֹרָם / יְהוֹרָם
  choice: Yoram / Joram
  rationale: Deux formes françaises distinctes permettent de refléter la différence graphique de l’hébreu et d’éviter de confondre le roi d’Israël avec celui de Juda.
- source_word: יְהוֹרָם בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: Joram, fils de Josaphat et roi de Juda
  rationale: Le patronyme et le titre final sont maintenus, tout en adoptant une apposition naturelle en français.
theological_decisions:
- issue: La proposition chronologique condensée qui associe le règne de Josaphat à l’accession de Joram
  choice: La rendre temporellement par « alors que Josaphat était roi de Juda » sans préciser davantage la relation entre les règnes.
  alternative: Traduire littéralement « et Josaphat, roi de Juda » ou affirmer explicitement une corégence.
  rationale: L’hébreu mentionne Josaphat sans verbe et crée une tension chronologique, mais ne dit pas expressément qu’il s’agissait d’une corégence. La traduction garde cette tension sans imposer une solution historique.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe de la notice royale est fluidifiée sans effacer la répétition des titres ni la difficulté chronologique du texte hébreu.
