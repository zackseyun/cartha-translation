  text: בֶּן עֶשְׂרִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אֲחַזְיָ֣הוּ בְ/מָלְכ֔/וֹ וְ/שָׁנָ֣ה אַחַ֔ת מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֤ם אִמּ/וֹ֙ עֲתַלְיָ֔הוּ בַּת עָמְרִ֖י מֶ֥לֶךְ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/026.yaml
  text: Ahaziah was twenty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother's name was Athaliah, the daughter of Omri king of Israel.
translation:
  language: fr
  text: Ahazia avait vingt-deux ans lorsqu’il devint roi, et il régna un an à Jérusalem. Sa mère s’appelait Athalie, fille d’Omri[a], roi d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « descendante d’Omri ». En hébreu, le mot « fille » peut parfois désigner une descendante ou une femme appartenant à une dynastie, et non nécessairement une fille directe.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: avait vingt-deux ans
  rationale: La formule hébraïque signifie littéralement « fils de vingt-deux ans »; l’expression idiomatique française indique naturellement l’âge exact.
- source_word: בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: Cette formule d’accession royale est rendue de façon naturelle tout en conservant l’idée du commencement du règne.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: et il régna un an
  rationale: Rend directement la durée du règne avec une tournure française concise et soutenue.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, on règne normalement « à » Jérusalem; cette préposition exprime ici le lieu du règne.
- source_word: וְשֵׁם אִמּוֹ עֲתַלְיָהוּ
  choice: Sa mère s’appelait Athalie
  rationale: Formulation française naturelle correspondant à l’expression hébraïque « le nom de sa mère était Athalie ».
- source_word: בַּת עָמְרִי
  choice: fille d’Omri
  rationale: Le sens lexical premier de בַּת est « fille ». Comme le terme peut aussi désigner une descendante ou une femme appartenant à une dynastie, cette possibilité est signalée en note.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Rend directement le titre royal qui identifie Omri.
theological_decisions:
- issue: Portée généalogique de l’expression « fille d’Omri »
  choice: Conserver « fille d’Omri » dans le texte principal.
  alternative: « descendante d’Omri » ou « membre de la dynastie d’Omri »
  rationale: Le terme hébreu désigne d’abord une fille, mais les termes de parenté peuvent exprimer une filiation plus large. Le texte principal garde la formulation concrète de l’hébreu, tandis que la note préserve l’ambiguïté généalogique sans la trancher.
translation_notes:
  register: Français international moderne, clair et digne. Les noms propres suivent les formes françaises bibliques courantes. La syntaxe évite le calque de la formule hébraïque d’âge tout en maintenant sa précision.
