  text: He was thirty-two years old when he became king, and he reigned eight years in Jerusalem.
translation:
  language: fr
  text: Il avait trente-deux ans lorsqu’il devint roi, et il régna huit ans à Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: Il avait trente-deux ans
  rationale: Dans cette formule d’âge, בֶּן suivi d’un nombre et de שָׁנָה signifie « être âgé de X ans ». La tournure française naturelle est « avoir X ans ».
- source_word: הָיָה בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction situe l’âge du personnage au moment de son accession au trône. Cette formulation restitue clairement ce sens en français moderne.
- source_word: וּשְׁמֹנֶה שנה
  choice: huit ans
  rationale: Expression numérique directe indiquant la durée du règne.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe désigne l’exercice de la royauté; « régner » en est l’équivalent français précis et idiomatique.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, la préposition idiomatique devant un nom de ville est « à »; elle indique ici le lieu d’où le roi exerça son règne.
