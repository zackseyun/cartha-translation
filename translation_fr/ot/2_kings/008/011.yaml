  text: וַ/יַּעֲמֵ֥ד אֶת פָּנָ֖י/ו וַ/יָּ֣שֶׂם עַד בֹּ֑שׁ וַ/יֵּ֖בְךְּ אִ֥ישׁ הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/011.yaml
  text: And he fixed his gaze and stared until he was ashamed[a], and the man of God wept.
translation:
  language: fr
  text: Il fixa son regard et le maintint jusqu’à ce qu’il éprouve de la honte[a]. Puis l’homme de Dieu pleura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à ce qu’Hazaël éprouve de la honte ». En hébreu, le sujet de « éprouve de la honte » est moins explicite que ne l’exige habituellement le français.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד אֶת־פָּנָיו
  choice: Il fixa son regard
  rationale: Littéralement, la tournure évoque le fait de tenir son visage immobile. « Fixa son regard » exprime naturellement en français l’attitude décrite sans recourir au calque peu idiomatique « fit tenir son visage ».
- source_word: וַיָּשֶׂם
  choice: et le maintint
  rationale: Le verbe שׂים signifie couramment « mettre, placer ». Dans cette construction difficile, il prolonge vraisemblablement l’idée d’un regard tenu avec insistance ; « le maintint » restitue cette continuité sans ajouter un objet humain absent de l’hébreu.
- source_word: עַד־בֹּשׁ
  choice: jusqu’à ce qu’il soit gêné
  rationale: בוש exprime ici la honte ou la gêne. Le pronom « il » conserve en français l’indétermination du sujet, tandis que « gêné » convient naturellement à la situation d’un regard soutenu.
- source_word: וַיֵּבְךְּ
  choice: pleura
  rationale: בכה signifie « pleurer ». Le passé simple maintient un récit digne et fluide.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Cette expression est le titre traditionnel du prophète et doit être conservée plutôt que remplacée par « le prophète ».
theological_decisions:
- issue: Identité de la personne éprouvant la gêne dans עַד־בֹּשׁ
  choice: Conserver l’ambiguïté par « jusqu’à ce qu’il soit gêné »
  alternative: « jusqu’à ce qu’Hazaël soit gêné » ou « jusqu’à ce qu’Élisée soit gêné »
  rationale: Le texte hébreu ne nomme pas explicitement le sujet de בוש. Le préciser résoudrait une ambiguïté réelle du récit que la traduction doit préserver.
translation_notes:
  register: Français international moderne, sobre et narratif. « Fixa son regard » et « le maintint » rendent l’image hébraïque dans une formulation courante, tandis que « l’homme de Dieu » conserve le titre biblique.
