id: 2KI.8.19
reference: 2 Kings 8:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֤ה יְהוָה֙ לְ/הַשְׁחִ֣ית אֶת יְהוּדָ֔ה לְמַ֖עַן דָּוִ֣ד עַבְדּ֑/וֹ כַּ/אֲשֶׁ֣ר אָֽמַר ל֗/וֹ לָ/תֵ֨ת ל֥/וֹ נִ֛יר לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/019.yaml
  text: Yet Yahweh was not willing to destroy Judah[a], for the sake of David his servant[b], just as he had said to him that he would give him a lamp for his sons all the days.
translation:
  language: fr
  text: 'Mais Yahvé ne voulut pas détruire Juda, par égard pour David, son serviteur, comme il le lui avait dit[a] : il lui donnerait une lampe[b] pour ses fils, pour toujours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme il le lui avait promis ».'
    reason: lexical_alternative
  - marker: b
    text: La « lampe » est ici une image royale représentant la continuité de la lignée ou de la dynastie de David.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: Mais ... ne voulut pas
  rationale: La tournure exprime ici un contraste avec le jugement évoqué dans le contexte et porte sur la volonté ou le consentement de Yahvé, non sur une simple absence d’action.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui conserve sa valeur de nom propre.
- source_word: לְהַשְׁחִית אֶת־יְהוּדָה
  choice: détruire Juda
  rationale: Le hiphil de שׁחת désigne la destruction résultant du jugement; « détruire » en restitue directement la force.
- source_word: לְמַעַן דָּוִד עַבְדּוֹ
  choice: par égard pour David, son serviteur
  rationale: « Par égard pour » exprime naturellement le motif fondé sur la considération accordée à David, tandis que l’apposition conserve son statut de serviteur de Dieu.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: comme il le lui avait dit
  rationale: Le texte hébreu emploie le verbe « dire ». La formulation française en conserve le sens littéral tout en permettant au contexte de faire entendre la valeur de promesse.
- source_word: לָתֵת לוֹ נִיר
  choice: il lui donnerait une lampe
  rationale: Le discours indirect est naturel en français, et « lampe » préserve l’image concrète de la continuité de la maison royale.
- source_word: לְבָנָיו
  choice: pour ses fils
  rationale: Cette formulation reste proche de la préposition hébraïque et maintient la référence masculine propre au contexte de succession dynastique, sans expliciter davantage le rapport exact entre la lampe et les fils.
- source_word: כָּל־הַיָּמִים
  choice: pour toujours
  rationale: L’expression idiomatique signifie une continuité durable; le calque « tous les jours » évoquerait à tort en français une fréquence quotidienne.
theological_decisions:
- issue: Image dynastique נִיר
  choice: une lampe
  alternative: une lignée / une lumière
  rationale: La métaphore royale est conservée au lieu d’être remplacée par son interprétation. Elle maintient les liens littéraires et théologiques avec les autres évocations de la promesse davidique.
- issue: Valeur de אָמַר dans le contexte de l’alliance
  choice: comme il le lui avait dit
  alternative: comme il le lui avait promis
  rationale: « Dit » suit le lexème hébreu et préserve la distinction entre le sens verbal explicite et la fonction de promesse que lui donne le contexte.
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur / Jéhovah
  rationale: Le nom propre est conservé plutôt que remplacé par un titre, conformément à l’évidence du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image de la lampe et le statut de David comme serviteur, tout en rendant idiomatiquement la durée et le contraste contextuel.
