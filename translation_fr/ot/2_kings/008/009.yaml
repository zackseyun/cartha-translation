base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/009.yaml
  text: So Hazael went to meet him and took a gift in his hand[a], even every good thing of Damascus, a load for forty camels. He came and stood before him and said, “Your son Ben-hadad king of Aram has sent me to you, saying[b], ‘Will I recover from this sickness?’”
translation:
  language: fr
  text: 'Hazaël alla donc à sa rencontre. Il emporta avec lui un présent : tout ce que Damas avait de meilleur, de quoi charger quarante chameaux. Il arriva, se tint devant lui et dit : « Ton fils[a] Ben-Hadad, roi d’Aram, m’a envoyé auprès de toi pour te demander : “Guérirai-je de cette maladie[b] ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ton fils » est ici une formule de déférence et d’humilité adressée à une personne respectée; elle n’indique pas nécessairement une filiation réelle.
    reason: cultural_note
  - marker: b
    text: 'Ou : « Survivrai-je à cette maladie ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרָאתוֹ
  choice: à sa rencontre
  rationale: Cette expression rend naturellement le mouvement vers Élisée sans réduire la rencontre à une simple salutation.
- source_word: מִנְחָה
  choice: un présent
  rationale: Dans ce contexte diplomatique, le terme désigne un cadeau apporté à une personne honorée, et non une offrande cultuelle ni nécessairement un tribut politique.
- source_word: בְיָדוֹ
  choice: avec lui
  rationale: Littéralement « dans sa main », cette tournure hébraïque indique ici qu’Hazaël emporte le présent. « Avec lui » est naturel en français et évite de suggérer qu’il portait personnellement à la main la charge de quarante chameaux.
- source_word: וְכָל טוּב דַּמֶּשֶׂק
  choice: tout ce que Damas avait de meilleur
  rationale: Cette formulation exprime à la fois l’abondance et la qualité des biens de Damas, tout en rattachant l’expression au présent par une apposition.
- source_word: מַשָּׂא אַרְבָּעִים גָּמָל
  choice: de quoi charger quarante chameaux
  rationale: La formule décrit naturellement en français la quantité de biens correspondant à la charge de quarante chameaux.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: se tint devant lui
  rationale: La traduction conserve la posture formelle de celui qui se présente devant une personne reconnue comme supérieure.
- source_word: בִּנְךָ
  choice: Ton fils
  rationale: Le sens littéral et la métaphore familiale sont conservés; une note précise qu’il s’agit ici d’une formule déférente.
- source_word: שְׁלָחַנִי אֵלֶיךָ לֵאמֹר
  choice: m’a envoyé auprès de toi pour te demander
  rationale: Cette formulation française naturelle exprime la mission et introduit directement la question transmise, sans modifier son contenu.
- source_word: הַאֶחְיֶה מֵחֳלִי זֶה
  choice: Guérirai-je de cette maladie ?
  rationale: Dans le contexte d’une maladie, « vivre de cette maladie » demande idiomatiquement si le malade guérira. La traduction principale donne ce sens, tandis qu’une note conserve l’alternative plus littérale liée à la survie.
- source_word: אֲרָם
  choice: Aram
  rationale: Le nom historique est translittéré plutôt que remplacé par une désignation géopolitique plus tardive.
