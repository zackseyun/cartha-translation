base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/003.yaml
  text: At the end of seven years, the woman returned from the land of the Philistines, and she went out to appeal to the king for her house and for her field.
translation:
  language: fr
  text: Au bout de sept ans, la femme revint du pays des Philistins. Elle alla réclamer[a] au roi sa maison et son champ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « crier au roi » ou « implorer le roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה שֶׁבַע שָׁנִים
  choice: Au bout de sept ans
  rationale: La tournure idiomatique marque l’achèvement de la période de sept ans; « au bout de » est naturel en français narratif.
- source_word: וַתָּשָׁב
  choice: revint
  rationale: Le verbe שׁוּב indique ici le retour de la femme depuis son lieu de séjour mentionné dans le contexte.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: le pays des Philistins
  rationale: Cette traduction suit explicitement la construction hébraïque et reste immédiatement compréhensible.
- source_word: וַתֵּצֵא
  choice: Elle alla
  rationale: Dans ce contexte, יָצָא exprime son déplacement pour se présenter devant le roi. « Elle alla » rend naturellement le mouvement sans introduire une sortie physique qui paraîtrait artificielle en français.
- source_word: לִצְעֹק
  choice: faire appel
  rationale: צָעַק signifie littéralement « crier », mais désigne ici une demande de justice adressée au roi en vue de récupérer des biens. « Faire appel » communique cette portée judiciaire, tandis que le sens plus littéral est conservé en note.
- source_word: אֶל הַמֶּלֶךְ
  choice: au roi
  rationale: La préposition אֶל désigne directement le roi comme destinataire de la requête.
- source_word: אֶל בֵּיתָהּ וְאֶל שָׂדָהּ
  choice: au sujet de sa maison et de son champ
  rationale: Les deux compléments indiquent l’objet de la requête. « Au sujet de » évite de suggérer qu’elle s’adresse à ses biens et préserve les termes concrets « maison » et « champ ».
