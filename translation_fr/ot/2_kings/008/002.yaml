source:
  edition: WLC
  text: וַ/תָּ֨קָם֙ הָֽ/אִשָּׁ֔ה וַ/תַּ֕עַשׂ כִּ/דְבַ֖ר אִ֣ישׁ הָ/אֱלֹהִ֑ים וַ/תֵּ֤לֶךְ הִיא֙ וּ/בֵיתָ֔/הּ וַ/תָּ֥גָר בְּ/אֶֽרֶץ פְּלִשְׁתִּ֖ים שֶׁ֥בַע שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/002.yaml
  text: So the woman arose and did according to the word of the man of God. She went[a], she and her household, and lived as a foreign resident in the land of the Philistines for seven years.
translation:
  language: fr
  text: La femme se leva donc et fit ce que l’homme de Dieu lui avait dit. Elle partit avec tous les siens et vécut comme étrangère[a] dans le pays des Philistins pendant sept ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : séjourna comme étrangère.'
    reason: Signale une formulation plus traditionnelle du verbe hébreu גור tout en conservant sa nuance de résidence étrangère et non permanente.
lexical_decisions:
- source_word: וַתָּקָם
  choice: se leva
  rationale: Le verbe קום au wayyiqtol introduit la réaction de la femme. « Se leva » conserve l’enchaînement narratif et le registre biblique sans nécessairement décrire un simple changement de posture.
- source_word: וַתַּעַשׂ כִּדְבַר
  choice: fit ce que … lui avait dit
  rationale: L’expression signifie agir conformément à une parole ou à une instruction. Cette formulation est plus naturelle en français moderne que le calque « fit selon la parole de ».
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Titre biblique consacré désignant un prophète ou un envoyé de Dieu; il traduit directement l’expression hébraïque sans la réduire ici au seul terme « prophète ».
- source_word: וַתֵּלֶךְ הִיא וּבֵיתָהּ
  choice: Elle partit avec tous les siens
  rationale: בַּיִת avec suffixe désigne ici la maisonnée plutôt que le bâtiment. « Tous les siens » inclut naturellement les personnes appartenant à son foyer et rend l’insistance de הִיא וּבֵיתָהּ.
- source_word: וַתָּגָר
  choice: vécut comme étrangère
  rationale: Le verbe גור évoque la résidence d’une personne étrangère, sans statut foncier permanent. Cette traduction explicite cette nuance sociale dans un français courant.
- source_word: בְּאֶרֶץ פְּלִשְׁתִּים
  choice: dans le pays des Philistins
  rationale: Traduction transparente de la construction hébraïque, préférable ici au nom géographique plus spécialisé « Philistie ».
- source_word: שֶׁבַע שָׁנִים
  choice: pendant sept ans
  rationale: Le français emploie naturellement « pendant » pour exprimer cette durée de résidence.
theological_decisions: []
