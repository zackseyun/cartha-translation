source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חֲזָאֵ֔ל מַדּ֖וּעַ אֲדֹנִ֣/י בֹכֶ֑ה וַ/יֹּ֡אמֶר כִּֽי יָדַ֡עְתִּי אֵ֣ת אֲשֶׁר תַּעֲשֶׂה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֜ל רָעָ֗ה מִבְצְרֵי/הֶ֞ם תְּשַׁלַּ֤ח בָּ/אֵשׁ֙ וּ/בַחֻֽרֵי/הֶם֙ בַּ/חֶ֣רֶב תַּהֲרֹ֔ג וְ/עֹלְלֵי/הֶ֣ם תְּרַטֵּ֔שׁ וְ/הָרֹתֵי/הֶ֖ם תְּבַקֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/012.yaml
  text: 'Hazael said[a], “Why is my lord weeping?” And he said, “Because I know the evil that you will do to the sons of Israel: you will set their fortresses on fire, kill their young men with the sword, dash their little children to pieces[b], and rip open their pregnant women.”'
translation:
  language: fr
  text: 'Hazaël demanda : « Pourquoi mon seigneur pleure-t-il ? » Élisée répondit : « Parce que je sais quel mal tu feras aux fils d’Israël[a] : tu mettras le feu à leurs forteresses[b], tu tueras leurs jeunes hommes par l’épée, tu mettras en pièces leurs petits enfants et tu éventreras leurs femmes enceintes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au peuple d’Israël » ou « aux Israélites ». L’hébreu dit littéralement « aux fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tu incendieras leurs places fortes ». Littéralement, « tu enverras leurs forteresses dans le feu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Titre respectueux adressé à Élisée, sans portée divine ici ; « mon seigneur » conserve la déférence sociale dans un français digne et naturel.
- source_word: בֹכֶה
  choice: pleure-t-il
  rationale: Le participe exprime une action en cours ; le présent français convient naturellement à la question directe.
- source_word: כִּי יָדַעְתִּי
  choice: Parce que je sais
  rationale: כִּי introduit l’explication, et le parfait de יָדַע porte ici un état de connaissance présent.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה ... רָעָה
  choice: quel mal tu feras
  rationale: Cette formulation française relie naturellement רָעָה à la relative anticipée tout en conservant le poids moral du terme.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Rend formellement l’expression hébraïque, qui désigne collectivement le peuple d’Israël ; une formulation idiomatique est signalée en note.
- source_word: מִבְצְרֵיהֶם תְּשַׁלַּח בָּאֵשׁ
  choice: tu livreras leurs forteresses au feu
  rationale: Conserve l’image hébraïque de faire passer ou d’envoyer les places fortes dans le feu, dans une tournure française naturelle.
- source_word: וּבַחֻרֵיהֶם
  choice: leurs jeunes hommes
  rationale: Le nom désigne des hommes jeunes dans la force de l’âge, éventuellement aptes au combat, sans imposer « guerriers ».
- source_word: בַּחֶרֶב תַּהֲרֹג
  choice: tu tueras ... par l’épée
  rationale: Traduction directe qui conserve l’instrument et la violence concrète de l’hébreu.
- source_word: עֹלְלֵיהֶם
  choice: leurs petits enfants
  rationale: Le mot désigne de très jeunes enfants ; cette expression préserve leur vulnérabilité sans limiter le sens aux nouveau-nés.
- source_word: תְּרַטֵּשׁ
  choice: tu fracasseras
  rationale: Le verbe évoque l’action brutale de briser ou mettre en pièces ; « fracasser » en restitue la force avec concision.
- source_word: הָרֹתֵיהֶם תְּבַקֵּעַ
  choice: tu éventreras leurs femmes enceintes
  rationale: Rend explicitement l’acte décrit par le verbe « fendre » et préserve sans euphémisme le caractère atroce de la prophétie.
theological_decisions:
- issue: Portée de לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  alternative: au peuple d’Israël / aux Israélites
  rationale: La formulation principale conserve l’idiome hébraïque masculin pluriel, tout en reconnaissant en note sa portée collective.
- issue: Violence explicite de la parole prophétique
  choice: Conserver les atrocités dans des termes directs et graphiques
  alternative: Employer des formulations atténuées comme « faire du mal » ou « attaquer »
  rationale: Le texte hébreu décrit volontairement des actes précis et atroces ; les atténuer en réduirait la gravité morale et narrative.
- issue: Identification du second locuteur
  choice: Élisée répondit
  alternative: il répondit
  rationale: Le texte hébreu emploie simplement « il dit », mais le référent contextuel est Élisée. Nommer le locuteur évite une ambiguïté française accidentelle sans modifier le sens du récit.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe reste fluide tout en conservant le parallélisme de l’énumération et la brutalité explicite du texte. « Hazaël » et « Élisée » suivent les formes françaises usuelles des noms bibliques.
