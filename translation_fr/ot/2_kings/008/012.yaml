  terminology: Les noms « Hazaël » et « Élisée », « mon seigneur », « fils d’Israël », « jeunes hommes » et « femmes enceintes » sont justes. « Fils d’Israël » maintient l’idiome source, avec des alternatives idiomatiques en note.
