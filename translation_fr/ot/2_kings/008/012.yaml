  - severity: low
    issue: « tu fracasseras leurs petits enfants »
    rationale: Le choix est compréhensible, mais « tu mettras en pièces leurs petits enfants » est une collocation française plus établie pour rendre le verbe de destruction violente, sans atténuer le texte.
