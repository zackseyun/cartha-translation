base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/013.yaml
  text: Hazael said[a], “But what is your servant, this dog, that he should do this great thing?” And Elisha said, “Yahweh has shown me that you will be king over Aram.”
translation:
  language: fr
  text: 'Hazaël dit : « Mais qu’est donc ton serviteur, ce chien, pour qu’il fasse une si grande chose ? » Élisée répondit : « Yahweh m’a montré que tu serais roi d’Aram[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « roi sur Aram » ; littéralement « roi sur Aram ».
    reason: Alternative lexicale et précision sur la construction hébraïque.
lexical_decisions:
- source_word: כִּי מָה
  choice: Mais qu’est donc
  rationale: Cette formulation rend l’objection incrédule de Hazaël et la valeur discursive de la tournure, dans un français naturel.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Il s’agit ici d’une formule conventionnelle d’abaissement respectueux, sans indication nécessaire d’un statut juridique d’esclave.
- source_word: הַכֶּלֶב
  choice: ce chien
  rationale: L’expression apposée conserve l’image fortement dépréciative et l’effet d’auto-abaissement du texte hébreu.
- source_word: כִּי יַעֲשֶׂה
  choice: pour qu’il fasse
  rationale: La construction française exprime l’incrédulité de Hazaël devant l’idée qu’un être tel que lui puisse accomplir ce qui vient d’être annoncé.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: une chose aussi grande
  rationale: Cette traduction conserve la largeur sémantique de דָּבָר et l’ambivalence de גָּדוֹל, sans remplacer explicitement l’expression par « atrocité » malgré le contexte terrible.
- source_word: הִרְאַנִי
  choice: m’a montré
  rationale: Le parfait hébreu désigne une révélation reçue dont Élisée expose maintenant le contenu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement comme nom propre.
- source_word: מֶלֶךְ עַל אֲרָם
  choice: roi sur Aram
  rationale: « Sur » reflète directement la préposition עַל, tandis qu’« Aram » préserve le nom propre hébreu et évite l’anachronisme possible de « Syrie ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le verset emploie directement le tétragramme; « Yahweh » en préserve le caractère de nom propre.
- issue: Rapport entre la révélation divine et la royauté future de Hazaël
  choice: que tu serais roi
  alternative: que tu es roi
  rationale: La formulation française rend la portée prospective de la vision dans le contexte, sans suggérer que Hazaël règne déjà au moment du dialogue.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve l’image de « ce chien » ainsi que l’expression volontairement large « une chose aussi grande », afin de ne pas atténuer ni surinterpréter la tension du texte.
