revisions:
- from: 'Hazaël dit : « Mais qu’est donc ton serviteur, ce chien, pour qu’il fasse une chose aussi grande ? » Élisée répondit : « Yahweh m’a montré que tu serais roi sur Aram[a]. »'
  to: 'Hazaël dit : « Mais qu’est donc ton serviteur, ce chien, pour qu’il fasse une si grande chose ? » Élisée répondit : « Yahweh m’a montré que tu serais roi d’Aram[a]. »'
  rationale: La révision améliore l’idiomaticité française de l’expression royale tout en conservant explicitement en note la construction hébraïque. Elle ajuste aussi légèrement la formulation de l’incrédulité de Hazaël sans préciser abusivement la nature de « la grande chose ».
  reviewer_model: gpt-5.6-terra
