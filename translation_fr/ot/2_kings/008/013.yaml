review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est fidèlement rendu : l’auto-abaissement de Hazaël (« ton serviteur, ce chien »), son incrédulité devant « cette grande chose », et l’annonce divine de sa royauté sont conservés. « Tu serais roi » restitue convenablement la portée future de l’annonce. La construction hébraïque מֶלֶךְ עַל־אֲרָם signifie littéralement « roi sur Aram », mais désigne idiomatiquement le roi qui règne sur Aram.'
  naturalness: « Roi sur Aram » est intelligible, mais demeure peu naturel en français international moderne. « Roi d’Aram » est la formulation française usuelle et ne modifie pas le sens de domination exprimé par l’hébreu ; la note conserve utilement le littéral. « Une chose aussi grande » est possible, mais « une si grande chose » évite la nuance comparative que « aussi » peut suggérer en français.
  terminology: Les noms Hazaël, Élisée, Aram et Yahweh sont cohérents avec le texte source et le registre retenu. « Ton serviteur » convient à la formule de déférence, sans imposer le sens social plus précis d’« esclave ».
  issues:
  - severity: low
    issue: « roi sur Aram » est calqué sur l’hébreu.
    rationale: La préposition עַל est bien « sur », mais en français le titre souverain s’exprime normalement par « roi d’Aram ». La littéralité peut être préservée en note.
  - severity: low
    issue: « une chose aussi grande » peut avoir une coloration comparative.
    rationale: Le texte hébreu qualifie directement « cette grande chose » ; « une si grande chose » rend plus directement l’intensité sans introduire implicitement un terme de comparaison.
  revised_text: 'Hazaël dit : « Mais qu’est donc ton serviteur, ce chien, pour qu’il fasse une si grande chose ? » Élisée répondit : « Yahweh m’a montré que tu serais roi d’Aram[a]. »'
  revised_footnotes:
