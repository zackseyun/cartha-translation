base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/014.yaml
  text: So he went away from Elisha and came to his master[a], who said to him, “What did Elisha say to you?” And he said, “He told me, ‘You will surely recover.’”
translation:
  language: fr
  text: 'Il quitta Élisée et se rendit auprès de son maître. Celui-ci lui demanda : « Que t’a dit Élisée ? » Il répondit : « Il m’a dit : “Tu guériras certainement[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu vivras certainement. » L’hébreu emploie l’infinitif absolu et une forme conjuguée du verbe « vivre » pour renforcer l’affirmation ; dans ce contexte, il s’agit de guérir de la maladie.'
    reason: Signaler le sens lexical littéral et la construction emphatique derrière la traduction contextuelle « guérir ».
lexical_decisions:
- source_word: וַיֵּלֶךְ מֵאֵת אֱלִישָׁע
  choice: Il quitta donc Élisée
  rationale: La forme narrative fait progresser le récit, et מֵאֵת marque l’éloignement. « Quitta » exprime naturellement en français le départ de la présence d’Élisée; « donc » assure la continuité narrative.
- source_word: וַיָּבֹא אֶל אֲדֹנָיו
  choice: et se rendit auprès de son maître
  rationale: בוא אֶל indique le mouvement vers quelqu’un. Dans ce contexte de cour, אֲדֹנָיו désigne le supérieur humain de Hazaël; « son maître » évite toute confusion avec un titre divin.
- source_word: מָה אָמַר לְךָ אֱלִישָׁע
  choice: Que t’a dit Élisée ?
  rationale: Le passé composé est la tournure naturelle du français moderne pour cette question portant sur une conversation qui vient d’avoir lieu.
- source_word: וַיֹּאמֶר אָמַר לִי
  choice: 'Il répondit : « Il m’a dit »'
  rationale: Le premier וַיֹּאמֶר introduit la réponse, tandis que אָמַר לִי rapporte les paroles d’Élisée. Cette formulation française évite une répétition pesante de « dit » sans modifier le contenu.
- source_word: חָיֹה תִחְיֶה
  choice: Tu guériras certainement
  rationale: L’infinitif absolu suivi de l’imparfait intensifie le verbe. Dans le contexte immédiat d’une maladie, « guérir » rend le sens contextuel de « vivre », tandis que « certainement » conserve l’emphase hébraïque.
theological_decisions:
- issue: Sens de אֲדֹנָיו dans ce cadre royal
  choice: son maître
  alternative: son seigneur
  rationale: Le mot désigne ici Ben-Hadad comme supérieur de Hazaël, non Dieu. « Maître » rend la relation sociale sans suggérer un titre divin.
- issue: Interprétation contextuelle de חיה
  choice: guériras
  alternative: vivras
  rationale: Puisque la question concerne l’issue de la maladie du roi, « guérir » communique naturellement le sens en contexte. La note conserve néanmoins le sens lexical plus littéral « vivre » et l’emphase de la construction hébraïque.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste direct et fluide. La formulation conserve l’affirmation emphatique de Hazaël sans expliciter ici son rapport avec l’oracle plus complet du verset précédent.
