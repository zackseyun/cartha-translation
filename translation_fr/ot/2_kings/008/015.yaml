  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יִּקַּ֤ח הַ/מַּכְבֵּר֙ וַ/יִּטְבֹּ֣ל בַּ/מַּ֔יִם וַ/יִּפְרֹ֥שׂ עַל פָּנָ֖י/ו וַ/יָּמֹ֑ת וַ/יִּמְלֹ֥ךְ חֲזָהאֵ֖ל תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/015.yaml
  text: And it happened on the next day that he took the covering cloth[a], dipped it in water, and spread it over his face, and he died[b]. Then Hazael reigned in his place.
translation:
  language: fr
  text: Le lendemain, il prit la couverture[a], la plongea dans l’eau et l’étendit sur son visage. Et il mourut[b]. Puis Hazaël devint roi à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couvre-lit », « étoffe tissée » ou « étoffe en filet »; le terme hébreu est rare, et la nature exacte de cet objet demeure incertaine.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu ne précise pas explicitement qui accomplit ces gestes. D’après le contexte, beaucoup comprennent qu’il s’agit de Hazaël, mais celui-ci n’est nommé que dans la dernière proposition.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Le lendemain
  rationale: Expression temporelle naturelle en français, qui marque le jour suivant les événements précédents.
- source_word: הַמַּכְבֵּר
  choice: la couverture
  rationale: Le nom hébreu est rare et désigne vraisemblablement une étoffe servant à couvrir; « couverture » reste naturel sans préciser indûment sa forme exacte.
- source_word: וַיִּטְבֹּל בַּמַּיִם
  choice: la plongea dans l’eau
  rationale: Le verbe exprime l’action de plonger ou tremper un objet dans un liquide; le pronom féminin reprend « couverture ».
- source_word: וַיִּפְרֹשׂ עַל־פָּנָיו
  choice: l’étendit sur son visage
  rationale: Rend directement l’idée de déployer ou d’étendre l’étoffe sur le visage.
- source_word: וַיָּמֹת
  choice: Et il mourut
  rationale: Conserve la simple progression narrative de l’hébreu sans expliciter une relation de but ou de conséquence.
- source_word: וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו
  choice: Puis Hazaël devint roi à sa place
  rationale: Formulation française naturelle de la succession royale, tout en gardant la progression du récit.
theological_decisions:
- issue: Sujet non exprimé des verbes « prit », « plongea » et « étendit »
  choice: Conserver le pronom « il » sans nommer l’auteur des gestes dans le texte principal.
  alternative: Identifier explicitement Hazaël comme l’auteur, ou envisager un serviteur non nommé.
  rationale: Les formes verbales hébraïques indiquent un sujet masculin singulier, mais le verset ne le nomme pas avant la proposition finale. Le contexte conduit souvent à comprendre Hazaël, sans que cette identification soit explicitée ici.
- issue: Lien entre l’étoffe posée sur le visage et la mort
  choice: 'Traduire par deux propositions narratives successives : « Et il mourut ».'
  alternative: « de sorte qu’il mourut » ou « et ainsi il mourut ».
  rationale: Le waw narratif marque la succession; une formulation explicitement causale renforcerait un rapport que la syntaxe ne formule pas elle-même.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au registre biblique littéraire tout en restant clair. La segmentation avant « Et il mourut » évite une accumulation lourde et préserve la succession hébraïque.
