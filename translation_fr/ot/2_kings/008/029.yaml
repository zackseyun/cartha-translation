  text: וַ/יָּשָׁב֩ יוֹרָ֨ם הַ/מֶּ֜לֶךְ לְ/הִתְרַפֵּ֣א בְ/יִזְרְעֶ֗אל מִן הַ/מַּכִּים֙ אֲשֶׁ֨ר יַכֻּ֤/הוּ אֲרַמִּים֙ בָּֽ/רָמָ֔ה בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/אֲחַזְיָ֨הוּ בֶן יְהוֹרָ֜ם מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִ/רְא֞וֹת אֶת יוֹרָ֧ם בֶּן אַחְאָ֛ב בְּ/יִזְרְעֶ֖אל כִּֽי חֹלֶ֥ה הֽוּא־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/029.yaml
  text: Then King Yoram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him at Ramah when he fought against Hazael king of Aram[a]. And Ahaziah son of Jehoram, king of Judah, went down to see Yoram son of Ahab in Jezreel[c][b], because he was sick.
translation:
  language: fr
  text: Le roi Yoram retourna à Jizréel pour se rétablir[a] des blessures que les Araméens[b] lui avaient infligées à Rama, lorsqu’il avait combattu Hazaël, roi d’Aram. Ahazia, fils de Yehoram et roi de Juda, descendit à Jizréel pour voir[c] Yoram, fils d’Achab, parce que celui-ci était malade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pour être guéri».
    reason: lexical_alternative
  - marker: b
    text: 'Traditionnellement : «les Syriens».'
    reason: lexical_alternative
  - marker: c
    text: Dans ce contexte, «voir» signifie aussi «rendre visite à».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: retourna
  rationale: Dans la séquence narrative, שוב indique naturellement que Yoram revient à Jizréel après le combat.
- source_word: לְהִתְרַפֵּא
  choice: pour se rétablir
  rationale: Le hitpael de רפא peut exprimer le fait de guérir ou de se remettre; «se rétablir» convient naturellement à une convalescence sans suggérer une autoguérison.
- source_word: מִן הַמַּכִּים
  choice: des blessures
  rationale: Le terme désigne littéralement des coups, mais le contexte médical renvoie aux blessures qui en résultent.
- source_word: אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: que les Araméens lui avaient infligées
  rationale: Cette formulation française exprime naturellement que les Araméens sont les auteurs des blessures, tout en respectant l’antériorité par rapport au retour.
- source_word: בָּרָמָה
  choice: à Rama
  rationale: La préposition ב situe ici le combat; «à» est l’expression française naturelle devant un nom de lieu.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל
  choice: lorsqu’il avait combattu Hazaël
  rationale: L’infinitif construit précédé de ב exprime la circonstance temporelle. Le plus-que-parfait clarifie que le combat précède le retour sans modifier la chronologie hébraïque.
- source_word: וַאֲחַזְיָהוּ…יָרַד
  choice: Ahazia… descendit
  rationale: «Descendit» conserve la nuance directionnelle de ירד dans la progression narrative.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: pour voir Yoram
  rationale: La traduction conserve le sens littéral de ראה ainsi que l’usage contextuel d’aller voir une personne malade.
- source_word: כִּי חֹלֶה הוּא
  choice: parce que celui-ci était malade
  rationale: חֹלֶה décrit son état de maladie. «Celui-ci» lève en français l’ambiguïté référentielle créée par la succession de noms masculins.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les formes «Yoram» et «Yehoram» reflètent les formes distinctes employées dans le texte hébreu du verset. «Aram» et «Araméens» préservent la désignation historique plutôt que la forme traditionnelle «Syrie/Syriens».
