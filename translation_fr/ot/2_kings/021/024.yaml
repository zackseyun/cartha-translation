  text: וַ/יַּךְ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/024.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[a], and the people of the land made Josiah his son king in his place.
translation:
  language: fr
  text: Mais le peuple du pays tua tous ceux qui avaient conspiré contre le roi Amon, et le peuple du pays établit son fils Josias comme roi à sa place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: tua
  rationale: Dans ce contexte de représailles contre les auteurs du complot, נכה désigne une action mortelle. « Tua » est direct, naturel et sans archaïsme.
- source_word: עַם הָאָרֶץ
  choice: le peuple du pays
  rationale: Cette traduction conserve l’expression hébraïque désignant ici un groupe sociopolitique de la population. La reprise pronominale dans la seconde proposition allège le français sans modifier le référent.
- source_word: כָּל הַקֹּשְׁרִים
  choice: tous ceux qui avaient conspiré
  rationale: Le participe de קשר désigne les personnes impliquées dans le complot. Le plus-que-parfait situe naturellement leur conspiration avant les représailles.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: contre le roi Amon
  rationale: Avec קשר, la préposition עַל exprime l’hostilité dirigée contre Amon.
- source_word: וַיַּמְלִיכוּ
  choice: établit comme roi
  rationale: Le hiphil de מלך signifie faire régner ou établir quelqu’un comme roi. Cette formulation n’ajoute pas l’idée d’une cérémonie de couronnement.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: son fils Josias
  rationale: Cet ordre des mots est le plus naturel en français et identifie clairement Josias comme le fils d’Amon.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: L’expression indique que Josias succède à Amon dans la royauté.
- source_word: וַ
  choice: Mais / puis
  rationale: Le premier waw marque ici le contraste avec l’assassinat raconté au verset précédent; le second fait progresser le récit vers l’établissement de Josias.
