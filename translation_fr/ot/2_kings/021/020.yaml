  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֥ה אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/020.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh, tout comme l’avait fait son père Manassé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le waw consécutif fait progresser le récit; en français, le passé simple convient à la narration et la conjonction initiale peut être omise naturellement.
- source_word: הָרַע
  choice: ce qui est mal
  rationale: Cette formulation française idiomatique rend l’expression עשה הרע sans transformer le mal en objet abstrait peu naturel.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La formulation conserve la métaphore hébraïque tout en exprimant clairement l’évaluation portée par Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כַּאֲשֶׁר
  choice: tout comme
  rationale: Cette tournure exprime naturellement et nettement la comparaison entre la conduite du fils et celle de son père.
- source_word: עָשָׂה
  choice: l’avait fait
  rationale: Le plus-que-parfait marque en français l’antériorité des actes de Manassé par rapport à l’action principale du récit.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Il s’agit de la forme française usuelle de ce nom biblique.
- source_word: אָבִיו
  choice: son père
  rationale: Cette traduction rend directement le nom et son suffixe possessif masculin singulier.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique écrit; l’expression « aux yeux de » conserve l’image hébraïque sans obscurité.
