  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: fr
  text: Il bâtit des autels pour toute l’armée des cieux dans les deux cours de la maison de Yahvé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour toute l’armée céleste ». L’expression hébraïque « armée des cieux » désigne l’ensemble céleste et, dans ce contexte, probablement les astres ou les puissances célestes auxquels un culte était rendu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Il bâtit
  rationale: Le wayyiqtol qal de בנה exprime la suite du récit au passé. En français, le passé simple convient au registre narratif biblique sans qu’il soit nécessaire de traduire explicitement la conjonction.
- source_word: מִזְבְּחוֹת
  choice: des autels
  rationale: Le pluriel courant désigne sans ambiguïté des autels.
- source_word: לְכָל צְבָא הַשָּׁמָיִם
  choice: pour toute l’armée des cieux
  rationale: Cette formulation préserve l’expression hébraïque collective et sa portée céleste ou astrale, sans la réduire aux seules étoiles.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: dans les deux cours
  rationale: Le numéral indique explicitement deux cours, et « cours » est le terme naturel dans le contexte du sanctuaire.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: La traduction conserve l’image hébraïque de la « maison » et rend directement le nom divin יהוה par « Yahvé ».
theological_decisions:
- issue: Sens de צְבָא הַשָּׁמָיִם
  choice: l’armée des cieux
  alternative: les astres du ciel
  rationale: L’expression peut viser les corps célestes ou, plus largement, les puissances célestes. La traduction retenue conserve cette ambiguïté dans un contexte de culte astral.
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme; « Yahvé » représente le nom propre et le distingue d’un titre.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple maintient la tenue du récit historique; « maison de Yahvé » et « armée des cieux » conservent les images essentielles de l’hébreu.
