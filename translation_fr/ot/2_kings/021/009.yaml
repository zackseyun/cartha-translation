revisions:
- from: Mais ils n’écoutèrent pas. Manassé les égara, de sorte qu’ils firent plus de mal que les nations[a] que Yahweh avait anéanties devant les fils d’Israël[b].
  to: Mais ils n’écoutèrent pas, et Manassé les égara, les poussant à faire le mal plus encore que les nations[a] que Yahweh avait détruites devant les fils d’Israël[b].
  rationale: La révision conserve toutes les informations du texte source, tout en rétablissant plus nettement la dépendance de l’infinitif « faire le mal » à l’égarement provoqué par Manassé. Elle emploie « détruites », traduction ferme mais non surinterprétative de הִשְׁמִיד, et corrige la précision grammaticale de la note comparative.
