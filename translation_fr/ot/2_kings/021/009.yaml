  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּתְעֵ֤/ם מְנַשֶּׁה֙ לַ/עֲשׂ֣וֹת אֶת הָ/רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/009.yaml
  text: But they did not listen[b][a], and Manasseh led them astray to do more evil than the nations that Yahweh had destroyed before the sons of Israel.
translation:
  language: fr
  text: Mais ils n’écoutèrent pas, et Manassé les égara, les poussant à faire le mal plus encore que les nations[a] que Yahweh avait détruites devant les fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à faire le mal plus que les nations ». L’hébreu emploie la préposition מן pour exprimer la comparaison.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les Israélites ». Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: n’écoutèrent pas
  rationale: Dans ce contexte, שׁמע implique une écoute qui appelle une réponse. « Écouter » conserve à la fois l’idée d’entendre et celle de tenir compte, sans expliciter excessivement par « obéir ».
- source_word: וַיַּתְעֵם
  choice: les égara
  rationale: La forme causative de תעה indique que Manassé fit dévier le peuple sur le plan moral et religieux. « Les égara » exprime clairement cette action en français courant et digne.
- source_word: לַעֲשׂוֹת אֶת הָרָע
  choice: de sorte qu’ils firent plus de mal
  rationale: L’infinitif dépend de l’action causative de Manassé. La tournure française rend naturellement le résultat de cet égarement, tandis que « plus » explicite la comparaison introduite par מִן.
- source_word: מִן הַגּוֹיִם
  choice: que les nations
  rationale: מִן a ici une valeur comparative. « Nations » convient mieux au cadre historique que « païens » ou « Gentils », qui ajouteraient une nuance étrangère au texte.
- source_word: הִשְׁמִיד
  choice: avait anéanties
  rationale: Le verbe exprime une destruction complète. Le plus-que-parfait marque naturellement en français l’antériorité de cette action par rapport au règne de Manassé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: מִפְּנֵי
  choice: devant
  rationale: Dans le contexte de la conquête, l’expression désigne les nations ôtées de devant Israël. « Devant » conserve l’image et reste intelligible en français.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction reproduit l’expression hébraïque et sa forme masculine collective; « les Israélites » demeure une formulation française idiomatique possible.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte emploie directement le tétragramme. La translittération préserve le nom divin sans lui substituer un titre.
- issue: Portée de l’expression masculine collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: Le texte source dit littéralement « les fils d’Israël » pour désigner collectivement le peuple de l’alliance. Le texte principal conserve cette forme, tandis que la note signale l’équivalent idiomatique.
- issue: Comparaison entre Juda et les nations
  choice: ils firent plus de mal que les nations
  alternative: ils firent le mal plus que les nations
  rationale: La syntaxe hébraïque présente une comparaison réelle mais compacte. La formulation retenue la rend clairement sans préciser davantage en quoi consistait cette supériorité dans le mal.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au récit historique, tandis que le plus-que-parfait marque l’action antérieure de Yahweh. La phrase conserve l’image de l’égarement et l’expression traditionnelle « fils d’Israël », avec des notes pour les formulations alternatives.
