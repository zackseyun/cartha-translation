  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה בְּ/יַד עֲבָדָ֥י/ו הַ/נְּבִיאִ֖ים לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/010.yaml
  text: And Yahweh spoke by the hand of his servants the prophets[a], saying,
translation:
  language: fr
  text: 'Alors Yahweh parla par l’intermédiaire de ses serviteurs les prophètes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors … parla
  rationale: Le piel de דבר signifie couramment « parler ». « Alors » marque naturellement la progression narrative du waw consécutif sans alourdir la phrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel יהוה plutôt que de lui substituer un titre.
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: L’expression littérale « par la main de » est ici un idiome d’intermédiaire ou d’agent. La formulation française retenue en exprime clairement le sens.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans ce contexte prophétique, עבד désigne ceux qui sont au service de Dieu et chargés de transmettre sa parole.
- source_word: הַנְּבִיאִים
  choice: les prophètes
  rationale: Le groupe nominal défini, en apposition, précise que les serviteurs concernés sont les prophètes.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Devant le discours direct qui commence au verset suivant, le deux-points est la manière la plus naturelle en français moderne de rendre la fonction introductive de לאמר, sans ajouter le calque lourd « en disant ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu emploie le Tétragramme. « Yahweh » préserve le nom propre attesté dans la source au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La tournure idiomatique « par l’intermédiaire de » évite le calque peu naturel « par la main de ». Le deux-points introduit directement la parole divine du verset suivant.
