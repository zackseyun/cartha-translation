base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/018.yaml
  text: And Manasseh lay down with his fathers and was buried in the garden of his house[a], in the garden of Uzza. And Amon his son became king in his place.
translation:
  language: fr
  text: Manassé se coucha avec ses pères[a] et fut enterré dans le jardin de sa maison, dans le jardin d’Ouzza. Son fils Amon devint roi à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expression hébraïque conventionnelle signifiant qu’il mourut. Littéralement : « se coucha avec ses pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: se coucha avec ses pères
  rationale: Cette formulation conserve l’expression royale conventionnelle qui annonce la mort, sans la réduire au seul verbe « mourir ». Le français biblique reste compréhensible, et une note explicite le sens idiomatique.
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: Rendu passif direct et naturel du niphal de קבר.
- source_word: בְּגַן בֵּיתוֹ
  choice: dans le jardin de sa maison
  rationale: La traduction suit les termes גן et בית sans préciser « palais », notion plausible mais non exprimée explicitement.
- source_word: בְּגַן עֻזָּא
  choice: dans le jardin d’Ouzza
  rationale: La répétition appositionnelle de « jardin » est maintenue conformément à l’hébreu, et le nom propre est translittéré sous la forme française Ouzza.
- source_word: וַיִּמְלֹךְ
  choice: devint roi
  rationale: Dans cette formule de succession, מלך désigne l’accession à la royauté plutôt que la durée du règne.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Cette expression française rend directement l’idée de succession dynastique portée par תחתיו.
theological_decisions:
- issue: Portée de l’expression funéraire « se coucher avec ses pères »
  choice: Conserver l’image hébraïque dans le texte et en préciser le sens en note
  alternative: Traduire directement par « mourut » ou « rejoignit ses ancêtres »
  rationale: L’expression est une formule royale de décès. La conserver respecte sa texture et son éventuelle résonance, sans en imposer une interprétation précise concernant l’état des morts.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe demeure proche de la formule hébraïque de décès et de succession; « maison » est conservé plutôt que le terme plus interprétatif « palais ».
