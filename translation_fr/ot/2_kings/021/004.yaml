  text: וּ/בָנָ֥ה מִזְבְּחֹ֖ת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֖ם אָשִׂ֥ים אֶת שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem I will put my name.”
translation:
  language: fr
  text: 'Il bâtit des autels dans la maison de Yahweh[a], dont Yahweh avait dit : « À Jérusalem, je mettrai mon nom[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans le temple de Yahweh ». Littéralement : « dans la maison de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: « Mettre son nom » est une expression liée au sanctuaire ; elle renvoie ici au lieu que Yahweh choisit d’associer à son nom et à sa présence.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/בָנָה
  choice: Il bâtit
  rationale: Le verbe qal à la 3e personne du masculin singulier poursuit la narration. En français, « Il bâtit » rend naturellement l’action sans alourdir la phrase par un « Et » initial.
- source_word: מִזְבְּחֹת
  choice: des autels
  rationale: Le pluriel de מִזְבֵּחַ désigne directement des autels sacrificiels.
- source_word: בְּ/בֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: Cette formulation conserve l’expression hébraïque « maison de YHWH ». « Temple de Yahweh » serait plus idiomatique, mais moins proche de l’image du texte source.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de le remplacer par un titre.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: au sujet de laquelle Yahweh avait dit
  rationale: Le relatif renvoie le plus naturellement à la maison de Yahweh. Le plus-que-parfait situe cette parole divine avant l’action racontée.
- source_word: בִּ/ירוּשָׁלַם
  choice: À Jérusalem
  rationale: La préposition ב marque ici le lieu. La mise en tête conserve l’accent porté par l’ordre hébreu sur Jérusalem.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: je mettrai mon nom
  rationale: La traduction conserve l’expression relative au sanctuaire sans la développer en une paraphrase sur la présence divine. Le mot « là » n’est pas explicite dans ce verset.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom divin. « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Sens théologique de « je mettrai mon nom »
  choice: Conserver l’expression « je mettrai mon nom »
  alternative: j’y établirai ma présence
  rationale: L’expression évoque le lieu choisi auquel Yahweh associe son nom et sa présence, mais le texte ne développe pas cette implication. La traduction maintient donc l’image et sa portée théologique sans l’expliciter dans le corps du verset.
- issue: Antécédent du relatif אֲשֶׁר
  choice: La maison de Yahweh
  alternative: Jérusalem comme lieu où Yahweh avait parlé
  rationale: La construction permet une certaine souplesse, mais le relatif suit immédiatement « maison de Yahweh » et l’énoncé cité identifie Jérusalem comme le lieu choisi. « Au sujet de laquelle » conserve ce lien grammatical sans transformer le relatif en adverbe de lieu.
translation_notes:
  register: Français international moderne, digne et accessible. « Bâtit » convient au registre narratif biblique sans être archaïque. La syntaxe explicite « au sujet de laquelle » évite l’ambiguïté peu naturelle de « où » tout en gardant le lien avec la maison de Yahweh.
