  text: And Amon’s servants conspired against him and put the king to death in his own house[a].
translation:
  language: fr
  text: Les serviteurs d’Amon conspirèrent[a] contre lui et mirent le roi à mort dans sa maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « complotèrent contre lui ».'
    reason: Variante lexicale pour le verbe hébreu קשר dans un contexte de conspiration politique.
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: complotèrent
  rationale: Dans ce contexte politique, קשר désigne l’organisation d’un complot. « Complotèrent » est précis, naturel et concis en français.
- source_word: עַבְדֵי אָמוֹן
  choice: les serviteurs d’Amon
  rationale: Le terme désigne les hommes attachés au service du roi, probablement des membres de sa cour. « Serviteurs » préserve le sens direct sans imposer la fonction plus précise d’« officiers ».
- source_word: עָלָיו
  choice: contre lui
  rationale: Avec le verbe exprimant le complot, על indique que l’action hostile est dirigée contre Amon.
- source_word: וַיָּמִיתוּ
  choice: mirent … à mort
  rationale: Cette formulation rend clairement la valeur causative du hifil de מות tout en restant idiomatique en français.
- source_word: אֶת־הַמֶּלֶךְ
  choice: le roi
  rationale: L’hébreu emploie ici le titre plutôt que le nom propre; la traduction conserve cette désignation narrative.
- source_word: בְּבֵיתוֹ
  choice: dans sa propre maison
  rationale: Le suffixe possessif signifie « sa maison ». « Sa propre maison » souligne naturellement en français le lieu personnel de l’assassinat, sans en modifier le sens.
