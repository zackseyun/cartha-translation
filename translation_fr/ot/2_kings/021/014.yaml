  variant: modern international French
source:
  edition: WLC
  text: וְ/נָטַשְׁתִּ֗י אֵ֚ת שְׁאֵרִ֣ית נַחֲלָתִ֔/י וּ/נְתַתִּ֖י/ם בְּ/יַ֣ד אֹֽיְבֵי/הֶ֑ם וְ/הָי֥וּ לְ/בַ֛ז וְ/לִ/מְשִׁסָּ֖ה לְ/כָל אֹיְבֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/014.yaml
  text: And I will forsake the remnant of my inheritance and give them into the hand of their enemies[b][a], and they will become plunder and spoil for all their enemies.
translation:
  language: fr
  text: J’abandonnerai le reste de mon héritage[a] et je les livrerai au pouvoir de leurs ennemis. Ils deviendront une proie et un butin pour tous leurs ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de mon patrimoine ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטַשְׁתִּי
  choice: J’abandonnerai
  rationale: Le verbe נטשׁ exprime ici l’action de délaisser ou d’abandonner. « Abandonner » est actuel, digne et conserve la force judiciaire du propos.
- source_word: שְׁאֵרִית
  choice: le reste
  rationale: שְׁאֵרִית désigne ce qui subsiste après les jugements annoncés. « Le reste » est naturel en français moderne tout en conservant cette idée.
- source_word: נַחֲלָתִי
  choice: de mon héritage
  rationale: נחלה désigne un héritage ou une part attribuée et, ici, le peuple considéré comme appartenant à Dieu. « Mon héritage » préserve ce langage d’appartenance sans en préciser excessivement le référent.
- source_word: וּנְתַתִּים בְּיַד
  choice: et je les livrerai au pouvoir
  rationale: L’expression hébraïque signifie littéralement donner quelqu’un dans la main d’un autre, c’est-à-dire le placer sous son pouvoir. La formulation française rend clairement cette domination hostile.
- source_word: אֹיְבֵיהֶם
  choice: leurs ennemis
  rationale: Traduction directe et cohérente dans les deux occurrences du terme.
- source_word: וְהָיוּ
  choice: Ils deviendront
  rationale: Le verbe היה présente ici le résultat futur de leur remise aux ennemis ; « deviendront » fait ressortir cette conséquence.
- source_word: לְבַז וְלִמְשִׁסָּה
  choice: une proie et un butin
  rationale: Les deux noms proches évoquent ce qui est saisi et pillé par l’ennemi. Le doublet français conserve l’intensification rhétorique de l’hébreu.
- source_word: לְכָל אֹיְבֵיהֶם
  choice: pour tous leurs ennemis
  rationale: 'La préposition לְ indique ici la relation de résultat : le reste du peuple sera livré à l’exploitation de tous ses ennemis.'
theological_decisions:
- issue: Portée de « mon héritage »
  choice: Conserver « mon héritage » sans identifier plus précisément le peuple, le territoire ou la possession de Dieu.
  alternative: « mon patrimoine » ou « ce qui m’appartient »
  rationale: L’hébreu porte un langage d’appartenance lié à l’alliance, mais le verset ne précise pas davantage le référent. La traduction maintient cette tension sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Au pouvoir de » naturalise l’image hébraïque de la main sans en perdre le sens. La répétition de « leurs ennemis » est conservée, comme dans le texte source.
