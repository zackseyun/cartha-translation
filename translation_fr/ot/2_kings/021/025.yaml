id: 2KI.21.25
reference: 2 Kings 21:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָמ֖וֹן אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/025.yaml
  text: The rest of the acts of Amon[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: fr
  text: Les autres actes d’Amon[a], ce qu’il a fait, ne sont-ils pas écrits dans le livre des Chroniques des rois de Juda[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faits ». Le mot hébreu דִּבְרֵי signifie littéralement « paroles » ou « affaires », mais, dans cette formule de résumé royal, il désigne les actes rapportés du roi.
    reason: lexical_alternative
  - marker: b
    text: Le « livre » était un document écrit ancien, probablement un rouleau. L’expression entière peut aussi être rendue par « les annales des rois de Juda ».
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Les autres actes
  rationale: יֶתֶר désigne ce qui reste, et דִּבְרֵי, dans cette formule de conclusion royale, renvoie aux actes ou faits du roi. « Les autres actes » est naturel en français et permet de conserver le pluriel repris par הֵם כְּתוּבִים.
- source_word: אָמ֖וֹן
  choice: Amon
  rationale: Translittération française usuelle du nom propre.
- source_word: אֲשֶׁר עָשָׂה
  choice: ce qu’il a fait
  rationale: Cette proposition relative explicite les actes d’Amon sans ajouter d’interprétation.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ne sont-ils pas écrits
  rationale: La tournure interrogative négative conserve la question rhétorique, qui appelle une réponse affirmative, ainsi que le pluriel de הֵם et כְּתוּבִים.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Bien que עַל signifie littéralement « sur », le français dit naturellement qu’un contenu est écrit « dans » un livre ou un registre.
- source_word: דִּבְרֵי הַיָּמִים
  choice: les Chroniques
  rationale: Dans cette formule historiographique, l’expression désigne des annales ou chroniques royales.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: des rois de Juda
  rationale: Dans le titre de cette source, לְ exprime idiomatiquement l’association avec les rois de Juda.
