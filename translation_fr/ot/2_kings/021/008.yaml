  text: וְ/לֹ֣א אֹסִ֗יף לְ/הָנִיד֙ רֶ֣גֶל יִשְׂרָאֵ֔ל מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לַֽ/אֲבוֹתָ֑/ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת כְּ/כֹל֙ אֲשֶׁ֣ר צִוִּיתִ֔י/ם וּ/לְ/כָל הַ֨/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה אֹתָ֖/ם עַבְדִּ֥/י מֹשֶֽׁה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/008.yaml
  text: And I will not again make Israel’s foot wander from the land that I gave to their fathers[a], if only they are careful to do according to all that I commanded them[c][b], and according to all the law that my servant Moses commanded them.
translation:
  language: fr
  text: Et je ne ferai plus quitter à Israël la terre que j’ai donnée à leurs pères[a], à condition qu’ils veillent à agir conformément à tout ce que je leur ai commandé et à toute la loi[b] que mon serviteur Moïse leur a prescrite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à leurs ancêtres ». « Leurs pères » est ici une expression d’alliance qui désigne les ancêtres d’Israël.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « toute l’instruction ». Ici, la « loi » désigne la Torah transmise par Moïse. L’hébreu dit littéralement : « faire errer le pied d’Israël », image de son déplacement hors de la terre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹסִיף
  choice: je ne ferai plus
  rationale: Avec la négation, יסף exprime ici la non-répétition de l’action. « Ne… plus » rend naturellement cette valeur en français.
- source_word: לְהָנִיד רֶגֶל יִשְׂרָאֵל
  choice: errer le pied d’Israël loin de
  rationale: La tournure conserve l’image concrète du pied collectif d’Israël et explicite par « loin de » la notion de déplacement hors du territoire, sans la réduire d’emblée à « chasser ».
- source_word: הָאֲדָמָה
  choice: la terre
  rationale: Dans ce contexte territorial et allianciel, le terme désigne le pays donné aux ancêtres plutôt que le sol matériel.
- source_word: לַאֲבוֹתָם
  choice: à leurs pères
  rationale: Le français conserve l’expression ancestrale et alliancielle de l’hébreu; une note signale l’équivalent moderne « ancêtres ».
- source_word: רַק אִם
  choice: pourvu que
  rationale: Cette formulation exprime nettement la condition restrictive sans lui donner une valeur simplement souhaitative.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: ils veillent à agir
  rationale: La formule rend à la fois l’attention vigilante portée aux prescriptions et leur mise en pratique.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִם
  choice: conformément à tout ce que je leur ai commandé
  rationale: « Conformément à » rend le préfixe comparatif כְּ et maintient l’idée d’une conduite réglée sur l’ensemble des commandements.
- source_word: וּלְכָל הַתּוֹרָה
  choice: et à toute la Loi
  rationale: Dans ce contexte mosaïque, « la Loi » est le rendu français établi de תּוֹרָה, tout en laissant « instruction » comme possibilité lexicale en note.
- source_word: צִוָּה אֹתָם עַבְדִּי מֹשֶׁה
  choice: que mon serviteur Moïse leur a prescrite
  rationale: « Prescrire » évite une répétition lourde de « commander » tout en conservant l’autorité de l’ordre transmis par Moïse; « mon serviteur Moïse » maintient le titre honorifique.
theological_decisions:
- issue: Condition attachée au maintien d’Israël dans la terre
  choice: « pourvu qu’ils veillent » présente l’obéissance comme une condition réelle
  alternative: Atténuer la proposition en simple souhait ou en remarque rhétorique
  rationale: רַק אִם introduit explicitement une restriction conditionnelle. La traduction préserve la tension entre le don de la terre et l’exigence d’obéissance sans la résoudre doctrinalement.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore singulière « le pied d’Israël » est volontairement conservée malgré son caractère marqué; la syntaxe française est toutefois fluidifiée. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
