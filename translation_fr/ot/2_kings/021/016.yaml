  source_fidelity: 'Le sens général est fidèle : l’addition emphatique, l’effusion abondante de sang innocent, l’idiome d’extension totale, la responsabilité causative de Manassé et le nom Yahweh sont tous conservés. Toutefois, la formulation finale actuelle affaiblit la structure syntaxique en la rendant redondante.'
