  variant: modern international French
source:
  edition: WLC
  text: וְ/גַם֩ דָּ֨ם נָקִ֜י שָׁפַ֤ךְ מְנַשֶּׁה֙ הַרְבֵּ֣ה מְאֹ֔ד עַ֛ד אֲשֶׁר מִלֵּ֥א אֶת יְרוּשָׁלִַ֖ם פֶּ֣ה לָ/פֶ֑ה לְ/בַ֤ד מֵֽ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יְהוּדָ֔ה לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/016.yaml
  text: Moreover[a], Manasseh shed very much innocent blood, until he had filled Jerusalem from one end to the other, besides his sin by which he caused Judah to sin, to do what was evil in the eyes of Yahweh.
translation:
  language: fr
  text: De plus, Manassé versa une quantité considérable de sang innocent, jusqu’à en remplir Jérusalem d’un bout à l’autre[a], outre le péché par lequel il fit pécher Juda, en lui faisant faire ce qui est mal aux yeux de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « bouche à bouche », expression qui signifie ici dans toute l’étendue de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: De plus
  rationale: Rend naturellement la valeur additive et emphatique de l’expression, qui introduit une accusation supplémentaire.
- source_word: דָּם נָקִי
  choice: sang innocent
  rationale: Expression française consacrée qui conserve la portée juridique et morale du syntagme hébreu.
- source_word: שָׁפַךְ ... הַרְבֵּה מְאֹד
  choice: répandit une très grande quantité de
  rationale: « Répandre le sang » est idiomatique en français, tandis que « une très grande quantité » restitue la forte intensification hébraïque sans lourdeur.
- source_word: עַד אֲשֶׁר מִלֵּא אֶת יְרוּשָׁלִַם פֶּה לָפֶה
  choice: au point d’en remplir Jérusalem d’un bout à l’autre
  rationale: « Au point de » exprime ici le résultat extrême; « d’un bout à l’autre » transmet le sens de l’idiome littéralement « bouche à bouche ».
- source_word: לְבַד מֵחַטָּאתוֹ
  choice: sans compter le péché
  rationale: Marque clairement que l’effusion de sang s’ajoutait au péché mentionné, tout en conservant le singulier hébreu.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יְהוּדָה
  choice: qu’il fit commettre à Juda
  rationale: Conserve la valeur causative du hifil de חטא et la responsabilité active de Manassé.
- source_word: לַעֲשׂוֹת הָרַע
  choice: en lui faisant pratiquer ce qui est mal
  rationale: Explicite naturellement en français le contenu du péché tout en maintenant le lien causatif avec Juda.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Préserve la métaphore évaluative hébraïque et rend le nom divin par sa translittération.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Force causative de הֶחֱטִיא
  choice: le péché qu’il fit commettre à Juda
  alternative: le péché dans lequel il entraîna Juda
  rationale: Le hifil indique que Manassé amena activement Juda à pécher; la formulation choisie conserve cette causalité sans développer une doctrine au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. La phrase conserve l’accumulation accusatrice de l’hébreu tout en évitant un calque peu naturel.
