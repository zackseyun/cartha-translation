  to: De plus, Manassé versa une quantité considérable de sang innocent, jusqu’à en remplir Jérusalem d’un bout à l’autre[a], outre le péché par lequel il fit pécher Juda, en lui faisant faire ce qui est mal aux yeux de Yahweh.
