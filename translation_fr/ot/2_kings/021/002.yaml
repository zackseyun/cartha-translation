revisions:
- from: Il fit ce qui est mal aux yeux de Yahweh, en suivant les pratiques abominables[a] des nations que Yahweh avait chassées devant les fils d’Israël[b].
  to: Il fit ce qui est mal aux yeux de Yahweh, à l’exemple des pratiques abominables[a] des nations que Yahweh avait chassées de devant les fils d’Israël[b].
  rationale: La seule révision nécessaire remplace « en suivant » par une comparaison plus directe et, surtout, « devant » par « de devant » après « chassées ». Cette dernière correction rend sans ambiguïté l’expulsion des nations hors de la présence des fils d’Israël, conformément à מִפְּנֵי. Les ancres et les deux notes demeurent correctement associées aux expressions expliquées.
