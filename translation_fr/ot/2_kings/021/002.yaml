  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/002.yaml
  text: He did what was evil in the sight of Yahweh[b][a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh, à l’exemple des pratiques abominables[a] des nations que Yahweh avait chassées de devant les fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les abominations ».'
    reason: Précision sur la forme concrète et fortement évaluative du terme hébreu.
  - marker: b
    text: 'Ou : « les Israélites ».'
    reason: Équivalent collectif idiomatique de l’expression hébraïque « les fils d’Israël ».
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: La formule hébraïque signifie idiomatiquement « faire ce qui est mal ». Le passé simple convient au récit historique et restitue le wayyiqtol sans alourdir la phrase d’un « et » initial.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette tournure française naturelle conserve l’image hébraïque des « yeux » et exprime l’évaluation divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre.
- source_word: כְּתוֹעֲבֹת הַגּוֹיִם
  choice: en suivant les pratiques abominables des nations
  rationale: תּוֹעֵבָה désigne ici des actes ou usages jugés abominables, probablement notamment cultuels. « En suivant » rend la valeur de conformité ou d’imitation portée par כְּ dans un français naturel.
- source_word: הוֹרִישׁ
  choice: avait chassées
  rationale: Le hiphil de ירש exprime ici le fait de déposséder ou d’expulser les nations. Le plus-que-parfait marque naturellement l’antériorité de cette action.
- source_word: מִפְּנֵי
  choice: devant
  rationale: « Chasser devant » conserve l’image spatiale de l’hébreu tout en restant compréhensible en français.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve l’expression filiale explicite et conventionnelle de l’hébreu; « les Israélites » demeure une formulation idiomatique possible.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom divin. « Yahweh » le restitue directement sans lui substituer un titre.
- issue: Portée de תּוֹעֵבוֹת
  choice: les pratiques abominables
  alternative: les abominations
  rationale: Dans ce contexte, le pluriel vise les conduites détestables des nations, sans limiter explicitement le terme à une catégorie précise. La traduction garde donc sa forte évaluation morale et religieuse sans préciser davantage.
- issue: Expression בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation choisie préserve l’expression masculine et généalogique du texte source, tandis que l’alternative en donne le sens collectif idiomatique.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve l’idiome « aux yeux de », le nom Yahweh et l’expression « fils d’Israël », tout en rendant כְּתוֹעֲבֹת par une tournure française naturelle qui exprime l’imitation de pratiques jugées abominables.
