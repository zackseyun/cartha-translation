  text: וַ/יַּעֲזֹ֕ב אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑י/ו וְ/לֹ֥א הָלַ֖ךְ בְּ/דֶ֥רֶךְ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/022.yaml
  text: He abandoned Yahweh[a], the God of his fathers[b], and did not walk in the way of Yahweh.
translation:
  language: fr
  text: Il abandonna Yahweh, le Dieu de ses pères[a], et ne marcha pas dans la voie de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Dieu de ses ancêtres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: Il abandonna
  rationale: Le verbe עזב signifie quitter, délaisser ou abandonner. « Abandonna » est naturel en français moderne et exprime nettement la rupture de fidélité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: le Dieu de ses pères
  rationale: Cette formulation suit de près le syntagme hébreu et conserve sa dimension familiale et historique.
- source_word: וְלֹא הָלַךְ
  choice: et ne marcha pas
  rationale: Le choix maintient la métaphore biblique de la marche comme manière de vivre et d'agir.
- source_word: בְּדֶרֶךְ יְהוָה
  choice: dans la voie de Yahweh
  rationale: « Voie » rend le sens métaphorique de דֶּרֶךְ, qui désigne ici la conduite conforme à Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin; « Yahweh » préserve ce nom sans le remplacer par un titre.
- issue: Portée de אֲבֹתָיו
  choice: ses pères
  alternative: ses ancêtres
  rationale: « Pères » correspond formellement au masculin pluriel hébreu et conserve l'expression traditionnelle, tandis que « ancêtres » en explicite la portée généalogique possible.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique; la métaphore « marcher dans la voie » est conservée parce qu'elle demeure intelligible.
