  yaml_path: translation/ot/2_kings/021/026.yaml
  text: And they buried him in his tomb in the garden of Uzza[b][a], and Josiah his son became king in his place.
translation:
  language: fr
  text: On l’enterra[a] dans son tombeau[b], dans le jardin d’Ouzza, et son fils Josias devint roi à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il l’enterra » ; le sujet n’est pas précisé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans sa tombe » ou « dans son lieu de sépulture ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: On l’enterra
  rationale: Le verbe hébreu est formellement à la 3e personne du masculin singulier (« il l’enterra »), mais son sujet n’est pas précisé. Le pronom indéfini « on » rend naturellement en français cette action accomplie par des agents non nommés, sans imposer un sujet singulier déterminé.
- source_word: קְבֻרָתוֹ
  choice: son tombeau
  rationale: Le nom désigne ici le lieu où il fut enseveli. « Son tombeau » est concis, naturel et adapté au registre narratif, tout en laissant en note les autres nuances possibles.
- source_word: גַן עֻזָּא
  choice: le jardin d’Ouzza
  rationale: Cette formulation reproduit naturellement le rapport construit hébreu et emploie la forme française traditionnelle et intelligible du nom propre.
- source_word: וַיִּמְלֹךְ
  choice: devint roi
  rationale: Dans cette formule de succession, le verbe marque l’accession à la royauté plutôt que l’ensemble du règne.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: L’expression hébraïque indique que Josias succède à son père; « à sa place » en conserve directement l’image et le sens.
