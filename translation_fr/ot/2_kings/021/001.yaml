  text: בֶּן שְׁתֵּ֨ים עֶשְׂרֵ֤ה שָׁנָה֙ מְנַשֶּׁ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֥ם אִמּ֖/וֹ חֶפְצִי בָֽהּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/001.yaml
  text: Manasseh was twelve years old when he began to reign[a], and he reigned fifty-five years in Jerusalem. His mother’s name was Hephzibah.
translation:
  language: fr
  text: Manassé avait douze ans lorsqu’il devint roi, et il régna cinquante-cinq ans à Jérusalem. Sa mère s’appelait Hephtsiba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hephtsiba signifie approximativement « Mon plaisir est en elle ».
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: avait douze ans
  rationale: Expression hébraïque habituelle indiquant l’âge; cette formulation en restitue naturellement le sens en français moderne.
- source_word: בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La préposition ב avec la forme verbale situe l’âge de Manassé au début de son règne; cette tournure française est naturelle et précise.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: cinquante-cinq ans
  rationale: Rend le nombre hébreu dans la forme normale du français moderne.
- source_word: מָלַךְ
  choice: il régna
  rationale: Dans cette formule royale, le verbe מלך désigne l’exercice de la royauté pendant une période donnée.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: Le français emploie naturellement la préposition « à » avec un nom de ville.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Formulation française naturelle qui conserve intégralement l’information de la tournure hébraïque « le nom de sa mère était ».
- source_word: חֶפְצִי בָהּ
  choice: Hephtsiba
  rationale: Translittération française biblique courante du nom propre hébreu, plutôt que traduction de sa signification.
