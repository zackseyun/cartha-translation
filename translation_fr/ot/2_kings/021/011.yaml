  text: יַעַן֩ אֲשֶׁ֨ר עָשָׂ֜ה מְנַשֶּׁ֤ה מֶֽלֶךְ יְהוּדָה֙ הַ/תֹּעֵב֣וֹת הָ/אֵ֔לֶּה הֵרַ֕ע מִ/כֹּ֛ל אֲשֶׁר עָשׂ֥וּ הָ/אֱמֹרִ֖י אֲשֶׁ֣ר לְ/פָנָ֑י/ו וַ/יַּחֲטִ֥א גַֽם אֶת יְהוּדָ֖ה בְּ/גִלּוּלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/011.yaml
  text: Because Manasseh king of Judah has done these abominations[a], and has done more evil than all the Amorites who were before him did, and has also caused Judah to sin with his idols,
translation:
  language: fr
  text: Parce que Manassé, roi de Juda, a commis ces abominations, a fait plus de mal que tous les Amorites qui l’avaient précédé et a aussi fait pécher Juda par ses idoles[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « idoles » est fortement péjoratif; il peut aussi évoquer des « idoles immondes », voire des « idoles-excréments ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Parce que
  rationale: Introduit la cause du jugement annoncé au verset suivant et conserve la suspension syntaxique du verset.
- source_word: עָשָׂה ... הַתֹּעֵבוֹת הָאֵלֶּה
  choice: a commis ces abominations
  rationale: « Commettre » est naturel en français avec des actes répréhensibles; « abominations » garde la forte réprobation cultuelle et morale du terme.
- source_word: הֵרַע מִכֹּל אֲשֶׁר עָשׂוּ
  choice: a fait plus de mal que tous ...
  rationale: Rend la valeur comparative du hiphil sans réduire le mal à une simple qualité abstraite.
- source_word: הָאֱמֹרִי אֲשֶׁר לְפָנָיו
  choice: tous les Amorites qui l’avaient précédé
  rationale: L’ethnonyme singulier collectif est rendu au pluriel; le plus-que-parfait marque naturellement leur antériorité par rapport à Manassé.
- source_word: וַיַּחֲטִא גַם אֶת יְהוּדָה
  choice: il a aussi entraîné Juda dans le péché
  rationale: Exprime clairement la valeur causative du hiphil de חטא dans un français courant et digne.
- source_word: בְּגִלּוּלָיו
  choice: par ses idoles
  rationale: « Par » exprime ici le moyen; « idoles » reste immédiatement compréhensible, tandis que la nuance méprisante du mot hébreu est signalée en note.
theological_decisions:
- issue: Force péjorative de גִּלּוּלִים
  choice: idoles
  alternative: idoles immondes; littéralement, terme méprisant évoquant des excréments
  rationale: Le texte principal privilégie une formulation claire sans effacer la charge polémique, laquelle est explicitée en note.
- issue: Responsabilité de Manassé dans le péché de Juda
  choice: a entraîné Juda dans le péché
  alternative: a fait pécher Juda
  rationale: La formulation retient la causalité grammaticale sans préciser au-delà du texte le mécanisme exact de cette influence.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase reste ouverte par une virgule, car « Parce que » introduit le motif du jugement dont l’énoncé se poursuit au verset suivant.
