  text: בֶּן עֶשְׂרִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אָמ֣וֹן בְּ/מָלְכ֔/וֹ וּ/שְׁתַּ֣יִם שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מְשֻׁלֶּ֥מֶת בַּת חָר֖וּץ מִן יָטְבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/019.yaml
  text: Amon was twenty-two years old when he began to reign, and he reigned two years in Jerusalem. His mother’s name was Meshullemeth daughter of Haruz, from Jotbah.
translation:
  language: fr
  text: Amon avait vingt-deux ans lorsqu’il devint roi, et il régna deux ans à Jérusalem. Sa mère s’appelait Meshoullémeth ; elle était fille de Harouts et originaire de Yotba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: avait vingt-deux ans
  rationale: Cette formule hébraïque indique l’âge. La formulation française restitue naturellement l’idiome sans littéralisme artificiel.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: L’infinitif construit précédé de ב situe l’âge au moment de l’accession au trône. Cette tournure est naturelle en français et convient à la formule royale.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe désigne l’exercice de la royauté et se rend précisément par « régner ».
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, la préposition « à » est la tournure locative normale devant un nom de ville.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Cette formulation actuelle et fluide transmet exactement l’indication du nom de la mère.
- source_word: מְשֻׁלֶּמֶת
  choice: Meshoullémeth
  rationale: Le nom propre est translittéré en tenant compte des conventions phonétiques françaises.
- source_word: בַּת חָרוּץ
  choice: elle était fille de Harouts
  rationale: La tournure exprime clairement la relation généalogique, tandis que « Harouts » adapte le nom propre aux conventions françaises.
- source_word: מִן יָטְבָה
  choice: originaire de Yotba
  rationale: La préposition מִן indique ici la provenance. « Originaire de » évite de rattacher par erreur le lieu au seul père et exprime naturellement l’origine de la mère en français.
