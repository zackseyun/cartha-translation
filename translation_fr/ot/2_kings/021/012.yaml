  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֙ מֵבִ֣יא רָעָ֔ה עַל יְרוּשָׁלִַ֖ם וִֽ/יהוּדָ֑ה אֲשֶׁר֙ כָּל שמעי/ו תִּצַּ֖לְנָה שְׁתֵּ֥י אָזְנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/012.yaml
  text: 'Therefore[a], this is what Yahweh, the God of Israel, says: Behold, I am bringing disaster on Jerusalem and Judah[b], so that both ears of everyone who hears of it will tingle.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh, le Dieu d’Israël : Je vais faire venir un malheur sur Jérusalem et Juda, de sorte que les deux oreilles de quiconque en entendra parler tinteront.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « les deux oreilles tinteront » décrit le choc et l’effroi provoqués par une nouvelle terrible.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence de ce qui précède.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Rend la formule prophétique de messager dans un français actuel et digne.
- source_word: הִנְנִי מֵבִיא
  choice: Je vais faire venir
  rationale: Exprime l’annonce emphatique et l’imminence portée par הִנְנִי suivi du participe, sans conserver un « voici » peu naturel devant la première personne en français.
- source_word: רָעָה
  choice: un malheur
  rationale: Dans ce contexte de jugement, le mot désigne une catastrophe infligée, non le mal moral; « malheur » convient au registre prophétique français.
- source_word: עַל יְרוּשָׁלִַם וִיהוּדָה
  choice: sur Jérusalem et Juda
  rationale: Conserve l’image du malheur qui vient sur les lieux visés.
- source_word: כָּל שֹׁמְעָיו
  choice: quiconque en entendra parler
  rationale: Le suffixe renvoie naturellement au malheur annoncé; la tournure française convient à l’annonce d’une nouvelle.
- source_word: תִּצַּלְנָה שְׁתֵּי אָזְנָיו
  choice: fera tinter les deux oreilles
  rationale: Préserve l’image corporelle frappante de l’idiome hébreu plutôt que d’en donner seulement l’interprétation.
theological_decisions:
- issue: Sens de רָעָה dans l’action judiciaire de Dieu
  choice: un malheur
  alternative: un mal / une catastrophe
  rationale: Le contexte indique une calamité judiciaire et non une faute morale; cette traduction évite de faire dire au texte que Dieu commet le mal tout en maintenant la gravité du jugement.
translation_notes:
  register: Français international moderne, solennel sans archaïsme excessif. La formule prophétique reste marquée, et l’idiome des deux oreilles est conservé dans le texte puis expliqué en note.
