review_pass:
  verdict: revise
  source_fidelity: 'La structure et les images du texte hébreu sont bien rendues : le cordeau et le fil à plomb sont étendus sur Jérusalem, puis l’image du récipient essuyé et retourné exprime le jugement. Toutefois, « J’effacerai » ne reproduit pas la répétition intentionnelle de מָחָה, que la comparaison développe précisément par « essuyer ». Employer « essuierai » aux deux endroits conserve mieux le parallélisme lexical et l’image concrète.'
  naturalness: « J’essuierai Jérusalem » est une métaphore de jugement compréhensible dans le registre biblique français et devient particulièrement claire grâce à la comparaison suivante. « Sens dessus dessous » évoque plus spontanément le désordre que le retournement physique d’un plat ; « le retourner » est plus direct et plus proche de l’hébreu.
  terminology: « Cordeau », « fil à plomb », « maison d’Achab », « Samarie » et « Jérusalem » sont justes et adaptés à un français biblique moderne. Dans la note a, « niveau » n’est pas une alternative lexicale suffisamment exacte pour מִשְׁקֹלֶת ; « plomb » ou « plomb de maçon » convient mieux.
  issues:
  - severity: medium
    issue: Rupture de la répétition de מָחָה
    rationale: Le texte traduit וּמָחִיתִי par « J’effacerai », mais reprend ensuite « essuie ». Le même verbe hébreu, répété dans le comparant, relie explicitement le sort de Jérusalem au geste d’essuyer le plat. « J’essuierai » préserve ce lien.
  - severity: low
    issue: « Sens dessus dessous » est moins précis pour le geste final
    rationale: Cette locution peut signifier « en désordre ». Le texte dit littéralement que le récipient est retourné sur sa face ; « le retourner » rend le geste sans ajouter une nuance étrangère.
  - severity: low
    issue: Alternative « niveau » dans la note a
    rationale: Un niveau n’est pas le référent le plus direct de מִשְׁקֹלֶת, instrument pondéré. « Plomb » est une alternative plus exacte.
  revised_text: 'J’étendrai sur Jérusalem le cordeau de Samarie et le fil à plomb de la maison d’Achab[a], et j’essuierai Jérusalem comme on essuie un plat[b] : on l’essuie et on le retourne.'
  revised_footnotes:
