revisions:
- from: 'J’étendrai sur Jérusalem le cordeau de Samarie et le fil à plomb de la maison d’Achab[a]. J’effacerai Jérusalem comme on essuie un plat[b] : on l’essuie, puis on le retourne sens dessus dessous.'
  to: 'J’étendrai sur Jérusalem le cordeau de Samarie et le fil à plomb de la maison d’Achab[a], et j’essuierai Jérusalem comme on essuie un plat[b] : on l’essuie et on le retourne.'
  rationale: La révision rétablit en français la répétition du verbe « essuyer », correspondant à la répétition de מָחָה dans l’hébreu, et rend le retournement final de manière plus littérale et idiomatique. Elle corrige également l’alternative terminologique de la note a sans modifier le sens du passage.
