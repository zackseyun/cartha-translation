base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/013.yaml
  text: And I will stretch over Jerusalem the measuring line of Samaria and the plumb line of the house of Ahab[a], and I will wipe Jerusalem as one wipes a dish[b], wiping it and turning it upside down.
translation:
  language: fr
  text: 'J’étendrai sur Jérusalem le cordeau de Samarie et le fil à plomb de la maison d’Achab[a], et j’essuierai Jérusalem comme on essuie un plat[b] : on l’essuie et on le retourne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la ligne de mesure de Samarie » et « le plomb de la maison d’Achab ». Ces instruments figurent la norme de jugement appliquée à Samarie et à la dynastie d’Achab.
    reason: lexical_alternative
  - marker: b
    text: Ou « une assiette » ou « une coupe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי
  choice: J’étendrai sur
  rationale: Le verbe נָטָה signifie concrètement « étendre, tendre ». Avec קָו et עַל, il évoque un cordeau tendu sur Jérusalem et conserve l’image matérielle du jugement.
- source_word: קָו
  choice: le cordeau
  rationale: קָו désigne ici une ligne servant à mesurer. « Cordeau » est le terme français naturel dans le domaine de la construction et maintient la métaphore sans l’expliciter excessivement.
- source_word: מִשְׁקֹלֶת
  choice: le fil à plomb
  rationale: Le nom désigne un instrument de mesure lesté. « Fil à plomb » est précis, actuel et forme avec « cordeau » une paire cohérente d’instruments de construction employés métaphoriquement pour le jugement.
- source_word: בֵּית אַחְאָב
  choice: la maison d’Achab
  rationale: L’expression dynastique est conservée littéralement ; « maison » peut naturellement désigner la lignée ou la dynastie d’Achab dans le registre biblique.
- source_word: וּמָחִיתִי
  choice: J’effacerai
  rationale: מָחָה peut signifier effacer ou essuyer. « Effacerai » exprime le jugement porté contre Jérusalem, tandis que la reprise « essuie » dans la comparaison préserve l’image concrète et le jeu lexical, malgré l’impossibilité de reproduire parfaitement en français le même verbe dans les deux emplois.
- source_word: כַּאֲשֶׁר יִמְחֶה אֶת הַצַּלַּחַת
  choice: comme on essuie un plat
  rationale: La troisième personne masculine singulière a une valeur indéfinie ; le pronom « on » la rend naturellement. צַלַּחַת peut désigner un plat, une assiette ou une coupe ; « plat » reste assez large.
- source_word: מָחָה
  choice: on l’essuie
  rationale: La répétition hébraïque renforce et détaille l’action. Sa reprise explicite en français conserve cet effet plutôt que de l’omettre.
- source_word: וְהָפַךְ עַל פָּנֶיהָ
  choice: puis on le retourne sens dessus dessous
  rationale: Littéralement, le plat est retourné « sur sa face ». L’expression française « sens dessus dessous » restitue clairement et idiomatiquement le geste.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française traditionnelle et standard du nom de lieu.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française traditionnelle et standard du nom de lieu.
theological_decisions:
- issue: Portée de la métaphore du cordeau de Samarie et du fil à plomb de la maison d’Achab
  choice: Jérusalem sera soumise au même jugement que Samarie et la maison d’Achab.
  alternative: Dans d’autres contextes bibliques, les instruments de mesure peuvent évoquer la construction ou la restauration.
  rationale: Le contexte immédiat est celui d’une condamnation, et l’image suivante du plat essuyé puis retourné indique que la mesure annonce ici la destruction. La traduction conserve cependant la métaphore sans insérer cette interprétation dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les deux images successives — instruments de mesure puis plat essuyé — ainsi que la répétition emphatique de מָחָה. Le futur simple rend la déclaration divine avec sobriété. Le point entre les propositions allège une longue coordination hébraïque sans modifier leur rapport.
