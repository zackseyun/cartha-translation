base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/003.yaml
  text: And he rebuilt the high places that Hezekiah his father had destroyed, and he erected altars to Baal, and made an Asherah, as Ahab king of Israel had done, and he bowed down to all the host of heaven and served them.
translation:
  language: fr
  text: Il reconstruisit les hauts lieux que son père Ézéchias avait détruits. Il dressa des autels à Baal et fit une ashéra[a], comme l’avait fait Achab, roi d’Israël. Il se prosterna devant toute l’armée céleste et leur rendit un culte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « ashéra ». Le terme peut désigner la déesse Ashéra ou, dans ce contexte, plus probablement un objet cultuel associé à elle ; la forme exacte de cet objet n’est pas précisée.'
    reason: Préserve l’ambiguïté lexicale de אֲשֵׁרָה sans présenter « poteau » comme une identification certaine.
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: les hauts lieux
  rationale: Terme biblique établi désignant des lieux de culte surélevés ou sanctuaires locaux; il conserve ici la portée cultuelle du mot hébreu.
- source_word: מִזְבְּחֹת לַבַּעַל
  choice: des autels à Baal
  rationale: La préposition marque la destination cultuelle des autels; «à Baal» est naturel et fidèle.
- source_word: אֲשֵׁרָה
  choice: un poteau sacré
  rationale: Dans ce contexte, le terme désigne vraisemblablement un objet cultuel associé à la déesse Ashéra plutôt que la déesse seule; une note conserve l’ambiguïté.
- source_word: כָל־צְבָא הַשָּׁמַיִם
  choice: toute l’armée céleste
  rationale: Rend littéralement l’expression hébraïque, qui désigne ici les corps ou puissances célestes envisagés comme objets de culte.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: lui rendit un culte
  rationale: Le verbe עבד prend ici un sens cultuel. Le singulier collectif français «lui» reprend naturellement «toute l’armée céleste», tandis que l’hébreu emploie un pronom pluriel.
theological_decisions:
- issue: Référent de אֲשֵׁרָה
  choice: Objet cultuel («un poteau sacré»), avec note
  alternative: La déesse elle-même («une Ashéra» ou «une statue d’Ashéra»)
  rationale: Le verbe «faire» et le parallèle de 1 Rois 16.33 favorisent un objet cultuel, mais la forme hébraïque ne précise pas sa nature exacte; la note évite de trancher au-delà des données.
- issue: Nature de «l’armée céleste»
  choice: Conserver l’expression sans l’identifier exclusivement aux astres ou aux êtres spirituels
  alternative: «Tous les astres du ciel»
  rationale: L’expression peut renvoyer aux corps célestes, tout en gardant une portée plus large dans l’usage biblique; la formulation préserve cette latitude.
translation_notes:
  register: Français moderne, clair et digne. Les phrases ont été légèrement segmentées pour la lisibilité, tout en conservant l’enchaînement narratif et la répétition des actes cultuels.
