  text: וַ/יֵּ֕לֶךְ בְּ/כָל הַ/דֶּ֖רֶךְ אֲשֶׁר הָלַ֣ךְ אָבִ֑י/ו וַֽ/יַּעֲבֹ֗ד אֶת הַ/גִּלֻּלִים֙ אֲשֶׁ֣ר עָבַ֣ד אָבִ֔י/ו וַ/יִּשְׁתַּ֖חוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/021.yaml
  text: He walked in all the way that his father had walked[a], and he served the idols that his father had served, and bowed down to them.
translation:
  language: fr
  text: Il suivit en tous points la voie qu’avait suivie son père. Il servit les idoles[a] qu’avait servies son père et se prosterna devant elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « idoles » est méprisant. Il est peut-être lié au mot « excréments » ; on peut aussi rendre son sens par « idoles abjectes » ou « idoles répugnantes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַךְ אָבִיו
  choice: Il suivit en tout la voie qu’avait suivie son père
  rationale: La construction « marcher dans toute la voie » décrit ici la conduite. « Suivre en tout la voie » conserve la métaphore du chemin tout en étant idiomatique en français moderne.
- source_word: וַיַּעֲבֹד
  choice: Il servit
  rationale: Le verbe עבד signifie « servir » et prend ici un sens cultuel. « Servit » maintient sa distinction avec le verbe suivant, qui désigne la prosternation.
- source_word: הַגִּלֻּלִים
  choice: les idoles[a]
  rationale: « Idoles » désigne clairement le référent en français courant. Le caractère fortement méprisant du terme hébreu est signalé en note.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: et se prosterna devant elles
  rationale: Le verbe exprime l’action de s’incliner ou de se prosterner en signe de révérence. Cette formulation préserve le geste concret sans le confondre avec « servir ».
theological_decisions:
- issue: Valeur péjorative de גִּלֻּלִים
  choice: idoles, avec une note
  alternative: idoles répugnantes ; idoles d’excréments
  rationale: Le terme hébreu exprime le mépris. La traduction principale reste naturelle et intelligible, tandis que la note préserve la force péjorative sans imposer en français une expression lourde ou excessivement interprétative.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « son père » est conservée comme dans l’hébreu. Le découpage en deux phrases allège la longue coordination sans modifier la progression du verset.
