revisions:
- from: Il fit passer son fils par le feu[a], pratiqua les présages[b] et la divination, et eut recours aux médiums et aux spirites[c]. Il multiplia les actes mauvais aux yeux de Yahweh, afin de provoquer sa colère.
  to: Il fit passer son fils par le feu[a], pratiqua l’interprétation des présages[b] et la divination, et eut recours aux médiums et aux spirites[c]. Il multiplia les mauvaises actions aux yeux de Yahweh, provoquant ainsi sa colère.
  rationale: La révision corrige une expression non idiomatique en français, améliore légèrement la fluidité de la proposition sur les mauvaises actions et évite de renforcer indûment la nuance de finalité dans la dernière proposition. Elle maintient les ambiguïtés du texte hébreu et tous les ancrages de notes.
