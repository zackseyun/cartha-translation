  text: וְ/הֶעֱבִ֤יר אֶת בְּנ/וֹ֙ בָּ/אֵ֔שׁ וְ/עוֹנֵ֣ן וְ/נִחֵ֔שׁ וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעֹנִ֑ים הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִֽיס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/006.yaml
  text: He made his son pass through the fire[a], practiced soothsaying and divination, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[c][b], provoking him to anger.
translation:
  language: fr
  text: Il fit passer son fils par le feu[a], pratiqua l’interprétation des présages[b] et la divination, et eut recours aux médiums et aux spirites[c]. Il multiplia les mauvaises actions aux yeux de Yahweh, provoquant ainsi sa colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « Il sacrifia son fils dans le feu. » L’expression hébraïque signifie littéralement : « il fit passer son fils par le feu ».'
    reason: alternative_reading
  - marker: b
    text: 'Autre traduction possible : « pratiqua l’art de prédire l’avenir ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « consulta des médiums et des spirites ». L’expression hébraïque est difficile et peut désigner plus largement le recours à de tels praticiens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִיר אֶת־בְּנוֹ בָּאֵשׁ
  choice: Il fit passer son fils par le feu
  rationale: Cette formulation conserve l’expression hébraïque et son caractère idiomatique sans préciser dans le corps du texte les modalités exactes du rite, qui renvoie vraisemblablement à un sacrifice d’enfant.
- source_word: וְעוֹנֵן
  choice: pratiqua les présages
  rationale: Le verbe désigne une pratique occulte visant à connaître l’avenir. « Pratiquer les présages » reste compréhensible et le distingue du terme suivant, plus général.
- source_word: וְנִחֵשׁ
  choice: la divination
  rationale: Le verbe נחשׁ évoque la recherche de signes ou d’augures. « Divination » rend naturellement la catégorie générale tout en laissant ouverte la méthode employée.
- source_word: וְעָשָׂה אוֹב וְיִדְּעֹנִים
  choice: eut recours aux médiums et aux spirites
  rationale: L’expression littérale avec עשה est difficile. « Eut recours à » exprime une implication pratique sans imposer l’idée plus précise d’une nomination officielle ou d’une simple consultation ponctuelle.
- source_word: הִרְבָּה לַעֲשׂוֹת הָרַע
  choice: Il multiplia les actes mauvais
  rationale: Cette tournure française naturelle conserve l’idée d’abondance ou d’intensification exprimée par le hiphil de רבה suivi de l’infinitif.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La traduction conserve la métaphore évaluative hébraïque et rend le tétragramme par « Yahweh » conformément à la politique du projet.
- source_word: לְהַכְעִיס
  choice: afin de provoquer sa colère
  rationale: La tournure exprime la valeur finale ou résultative de l’infinitif causatif et identifie naturellement Yahweh comme référent du possessif.
theological_decisions:
- issue: Degré d’explicitation du rite impliquant le fils
  choice: Conserver dans le texte l’idiome « fit passer son fils par le feu »
  alternative: « sacrifia son fils dans le feu » ou « brûla son fils dans le feu »
  rationale: Le contexte évoque fortement un sacrifice d’enfant, mais l’hébreu décrit littéralement le fait de faire passer le fils par le feu. Le texte principal préserve cette formulation, tandis que la note expose son sens probable.
- issue: Sens de עשה avec אוֹב וְיִדְּעֹנִים
  choice: « eut recours aux médiums et aux spirites »
  alternative: « consulta des médiums et des spirites » ou « institua des médiums et des spirites »
  rationale: L’idiome hébreu ne détermine pas avec certitude la forme exacte de l’implication du roi. La formulation retenue conserve cette latitude.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le choix suit la politique du projet relative au tétragramme.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant l’idiome du passage par le feu, la distinction entre les pratiques divinatoires et l’intensification exprimée par הִרְבָּה.
