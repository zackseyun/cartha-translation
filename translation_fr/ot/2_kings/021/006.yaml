    issue: « pratiqua les présages » est une collocation française fautive ou très maladroite.
    rationale: Les présages sont interprétés ou observés ; la pratique est l’interprétation des présages. La correction rend le français naturel et maintient la distinction lexicale avec « divination ».
  - severity: low
