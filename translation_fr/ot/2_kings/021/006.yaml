  source_fidelity: 'Le sens général est bien rendu : l’idiome concernant le fils et le feu est conservé sans explicitation indue, les deux pratiques divinatoires restent distinctes, et « eut recours à » préserve utilement l’ambiguïté de l’expression עם עשה. « Afin de » peut toutefois suggérer un but délibéré plus nettement que ne l’exige l’infinitif hébreu ; une formulation résultative est préférable.'
  naturalness: '« Pratiqua les présages » n’est pas idiomatique en français : on pratique l’interprétation des présages, non les présages eux-mêmes. « Il multiplia les actes mauvais » est compréhensible mais lourd ; « Il multiplia les mauvaises actions » est plus naturel tout en gardant l’intensification.'
  terminology: « Médiums », « spirites » et « Yahweh » conviennent au registre et aux choix du projet. « Interprétation des présages » rend clairement la valeur divinatoire de וְעוֹנֵן, sans la confondre avec le terme suivant.
