base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/017.yaml
  text: The rest of the acts of Manasseh, and all that he did, and his sin that he committed—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: fr
  text: Le reste des actes de Manassé, tout ce qu’il a fait et le péché qu’il a commis ne sont-ils pas écrits dans le livre des Chroniques[a] des rois de Juda ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le livre des annales des rois de Juda ». L’expression hébraïque désigne un registre royal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: Le reste des actes de Manassé
  rationale: Dans cette formule de conclusion de règne, דִּבְרֵי désigne les actes ou les affaires du roi plutôt que ses seules paroles. Le français « actes » rend naturellement cet emploi.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: tout ce qu’il a fait
  rationale: Traduction directe et naturelle de la proposition relative, sans ajouter d’interprétation.
- source_word: וְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: et le péché qu’il a commis
  rationale: Le substantif avec suffixe signifie littéralement « son péché », et la construction associe deux mots de même racine pour souligner l’acte de pécher. En français, « le péché qu’il a commis » conserve le sens et évite la lourdeur de « son péché qu’il a commis ».
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: cela n’est-il pas écrit
  rationale: La question rhétorique hébraïque attend une réponse affirmative. Le singulier collectif « cela » reprend naturellement en français l’ensemble des éléments énumérés, tout en maintenant la forme interrogative.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: dans le livre des Chroniques des rois de Juda
  rationale: « Dans » est idiomatique en français pour ce qui est consigné dans un document. « Chroniques » rend le titre traditionnel de ce registre royal, sans l’identifier nécessairement au livre biblique des Chroniques.
