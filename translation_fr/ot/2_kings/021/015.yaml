reference: 2 Kings 21:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֨ר עָשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינַ֔/י וַ/יִּהְי֥וּ מַכְעִסִ֖ים אֹתִ֑/י מִן הַ/יּ֗וֹם אֲשֶׁ֨ר יָצְא֤וּ אֲבוֹתָ/ם֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/015.yaml
  text: because they have done what is evil in my eyes and have been provoking me from the day their fathers came out of Egypt to this day[a].
translation:
  language: fr
  text: parce qu’ils ont fait ce qui est mal à mes yeux et n’ont cessé de provoquer ma colère depuis le jour où leurs pères sont sortis d’Égypte jusqu’à aujourd’hui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs ancêtres sont sortis d’Égypte ». L’hébreu dit littéralement « leurs pères », terme masculin de parenté qui désigne ici les générations précédentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: parce que
  rationale: La locution introduit la cause du jugement annoncé au verset précédent. « Parce que » est le lien causal le plus naturel en français moderne.
- source_word: עָשׂוּ אֶת־הָרַע
  choice: ils ont fait ce qui est mal
  rationale: Cette formulation rend naturellement l’idiome hébreu sans le calquer par « faire le mal » et conserve la portée évaluative de l’acte.
- source_word: בְּעֵינַי
  choice: à mes yeux
  rationale: L’expression française garde la métaphore évaluative de l’hébreu tout en étant courante et claire.
- source_word: וַיִּהְיוּ מַכְעִסִים אֹתִי
  choice: et n’ont cessé de provoquer ma colère
  rationale: La construction היה suivie du participe exprime ici une conduite durable ou répétée. « N’ont cessé de » en restitue la continuité, tandis que « provoquer ma colère » explicite naturellement la valeur causative de כעס.
- source_word: מִן־הַיּוֹם אֲשֶׁר
  choice: depuis le jour où
  rationale: Cette tournure marque clairement en français le point de départ d’une conduite qui se poursuit jusqu’au moment présent du récit.
- source_word: יָצְאוּ אֲבוֹתָם מִמִּצְרַיִם
  choice: leurs pères sont sortis d’Égypte
  rationale: « Sont sortis d’Égypte » correspond au verbe traditionnel de l’Exode, et « leurs pères » conserve le terme masculin de parenté employé dans l’hébreu.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: jusqu’à aujourd’hui
  rationale: Cette expression française est naturelle et conserve le terme final de la durée indiquée en hébreu.
theological_decisions:
- issue: Continuité collective de la rébellion d’Israël depuis la sortie d’Égypte
  choice: Conserver la perspective historique et collective du texte, qui relie les générations présentes à celles qui les ont précédées.
  alternative: Limiter l’énoncé aux fautes des rois ou de la génération récente.
  rationale: Le verset fait explicitement remonter la provocation au jour de la sortie d’Égypte et la prolonge jusqu’au présent. La traduction maintient cette tension sans ajouter d’explication doctrinale.
- issue: Portée du terme אֲבוֹתָם
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: Le mot hébreu est un terme masculin de parenté pouvant désigner les générations antérieures. Le texte principal en conserve la forme, tandis que la note signale le sens référentiel plus large.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en préservant l’image « à mes yeux », la durée de la provocation et le terme de parenté masculin du texte source.
