  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הָ/אֲשֵׁרָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה בַּ/בַּ֗יִת אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ אֶל דָּוִד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/007.yaml
  text: And he set the carved image of Asherah that he had made in the house of which Yahweh had said to David and to Solomon his son[a], “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: fr
  text: 'Il plaça dans la maison l’image sculptée d’Ashéra qu’il avait faite, la maison dont Yahweh avait dit à David et à son fils Salomon : « Dans cette maison et à Jérusalem, que j’ai choisie parmi toutes les tribus d’Israël, je placerai mon nom pour toujours. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Il plaça
  rationale: Le verbe שׂוּם décrit ici l’action d’installer un objet dans un lieu. « Plaça » est naturel, précis et n’ajoute aucune indication sur le mode d’installation.
- source_word: פֶּסֶל הָאֲשֵׁרָה
  choice: la statue sculptée d’Ashéra
  rationale: פֶּסֶל désigne une représentation façonnée, notamment par taille ou sculpture, tandis que הָאֲשֵׁרָה établit son rapport avec Ashéra. Cette formulation évite de réduire l’objet à un simple poteau cultuel.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il avait faite
  rationale: Le plus-que-parfait exprime naturellement en français que la fabrication a précédé l’installation.
- source_word: בַּבַּיִת
  choice: dans la Maison
  rationale: בַּיִת signifie littéralement « maison » et désigne ici le sanctuaire. La majuscule contextuelle permet d’identifier le Temple tout en conservant la répétition lexicale et la portée théologique de « maison ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le caractère personnel du tétragramme plutôt que de lui substituer un titre.
- source_word: וְאֶל שְׁלֹמֹה בְנוֹ
  choice: et à son fils Salomon
  rationale: L’ordre français rend clairement que Salomon est le fils de David, conformément au référent du suffixe hébreu.
- source_word: בַּבַּיִת הַזֶּה
  choice: Dans cette Maison
  rationale: La traduction garde le démonstratif et reprend « Maison », préservant ainsi l’écho lexical avec la première proposition.
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: que j’ai choisie parmi toutes les tribus d’Israël
  rationale: « Parmi » exprime idiomatiquement la sélection opérée au sein de l’ensemble évoqué par מִן avec בחר. L’accord au féminin rattache naturellement la relative à Jérusalem.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: je placerai mon nom
  rationale: La formulation conserve l’image biblique du nom divin établi dans le lieu choisi, sans la paraphraser en présence ou habitation.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression française courante rend la durée indéfinie ou perpétuelle exprimée par עוֹלָם.
theological_decisions:
- issue: Nature de l’objet cultuel désigné par פֶּסֶל הָאֲשֵׁרָה
  choice: la statue sculptée d’Ashéra
  alternative: la statue de l’ashéra / le poteau d’Ashéra
  rationale: Le texte associe explicitement פֶּסֶל, une représentation façonnée ou sculptée, à הָאֲשֵׁרָה. Traduire seulement par « poteau sacré » serait plus spécifique que le verset et atténuerait la mention de l’image sculptée.
- issue: Référent de la relative אֲשֶׁר בָּחַרְתִּי
  choice: Jérusalem, que j’ai choisie
  alternative: cette Maison et Jérusalem, que j’ai choisies
  rationale: L’hébreu emploie un relatif sans marquage de genre ou de nombre, de sorte que la syntaxe permet une certaine ambiguïté. Le singulier du verbe et le parallèle biblique de la ville choisie favorisent le rattachement à Jérusalem, sans nier que la Maison participe elle aussi au lieu du nom divin.
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: « Yahweh » représente directement le nom propre hébreu et évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. « Maison » porte une majuscule pour signaler clairement le Temple sans remplacer le mot hébreu par une explicitation. La scission après la première phrase allège une longue structure hébraïque tout en maintenant son rapport logique.
