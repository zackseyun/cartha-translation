revisions:
- from: 'Il plaça dans la Maison la statue sculptée d’Ashéra qu’il avait faite. C’était cette Maison dont Yahweh avait dit à David et à son fils Salomon : « Dans cette Maison et à Jérusalem, que j’ai choisie parmi toutes les tribus d’Israël, je placerai mon nom pour toujours. »'
  to: 'Il plaça dans la maison l’image sculptée d’Ashéra qu’il avait faite, la maison dont Yahweh avait dit à David et à son fils Salomon : « Dans cette maison et à Jérusalem, que j’ai choisie parmi toutes les tribus d’Israël, je placerai mon nom pour toujours. »'
  rationale: 'La révision rétablit la relative directement liée à « maison », supprime l’assertion ajoutée « C’était », emploie « image sculptée » pour פֶּסֶל et normalise la minuscule. Le rattachement de « que j’ai choisie » à Jérusalem est maintenu : la forme relative hébraïque reste elle-même non marquée, et le français doit choisir un antécédent grammatical sans prétendre lever toute la portée conjointe de la formule sur la maison et Jérusalem.'
