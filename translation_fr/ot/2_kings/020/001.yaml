source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה חִזְקִיָּ֖הוּ לָ/מ֑וּת וַ/יָּבֹ֣א אֵ֠לָי/ו יְשַׁעְיָ֨הוּ בֶן אָמ֜וֹץ הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר יְהוָה֙ צַ֣ו לְ/בֵיתֶ֔/ךָ כִּ֛י מֵ֥ת אַתָּ֖ה וְ/לֹ֥א תִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/001.yaml
  text: 'In those days Hezekiah became sick, near to death. And Isaiah son of Amoz the prophet[a] came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you will not live.”'
translation:
  language: fr
  text: 'En ces jours-là, Ézéchias tomba malade, au point de mourir. Le prophète Ésaïe, fils d’Amots, vint le voir et lui dit : « Ainsi parle Yahweh : Mets de l’ordre dans ta maison, car tu vas mourir[a] ; tu ne vivras pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « car tu es mourant » ou « car tu es mort ». L’expression hébraïque annonce une mort certaine et imminente.'
    reason: Signaler la forme littérale inhabituelle et les principales possibilités de traduction sans affaiblir la force de l’annonce.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: En ces jours-là
  rationale: Reproduit l’expression temporelle hébraïque courante dans un français narratif naturel et digne.
- source_word: חָלָה חִזְקִיָּהוּ לָמוּת
  choice: Ézéchias tomba malade, au point de mourir
  rationale: « Tomba malade » conserve la valeur ingressive du verbe, tandis que « au point de mourir » exprime la gravité extrême indiquée par l’infinitif לָמוּת sans affirmer qu’il mourut effectivement.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: le prophète Ésaïe, fils d’Amots
  rationale: La formulation française place naturellement le titre avant le nom et conserve explicitement la filiation.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique traditionnelle, concise et proche de l’hébreu ; le présent français convient à une parole divine proclamée au destinataire.
- source_word: צַו לְבֵיתֶךָ
  choice: Mets de l’ordre dans ta maison
  rationale: Rend l’idiome comme une injonction à régler les affaires de sa maison et à donner les dispositions nécessaires avant sa mort.
- source_word: כִּי מֵת אַתָּה
  choice: car tu vas mourir
  rationale: Le participe prédicatif annonce ici une mort certaine et imminente ; cette tournure française en communique naturellement la force sans parler d’une mort déjà accomplie.
- source_word: וְלֹא תִחְיֶה
  choice: tu ne vivras pas
  rationale: Traduction directe qui maintient la répétition solennelle et catégorique de l’annonce.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin propre ; « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Force de מֵת אַתָּה face à la guérison racontée ensuite
  choice: tu vas mourir
  alternative: tu es mourant
  rationale: La traduction conserve le caractère catégorique et imminent de l’annonce dans la scène, sans tenter de résoudre ici la tension narrative et théologique créée par la suite du récit.
translation_notes:
  register: Français international moderne, accessible et solennel. La coordination initiale hébraïque n’est pas reproduite mécaniquement en tête de la deuxième phrase. La ponctuation et l’ordre des appositions suivent l’usage français contemporain.
