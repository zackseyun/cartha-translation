  text: בָּ/עֵ֣ת הַ/הִ֡יא שָׁלַ֡ח בְּרֹאדַ֣ךְ בַּ֠לְאֲדָן בֶּֽן בַּלְאֲדָ֧ן מֶֽלֶךְ בָּבֶ֛ל סְפָרִ֥ים וּ/מִנְחָ֖ה אֶל חִזְקִיָּ֑הוּ כִּ֣י שָׁמַ֔ע כִּ֥י חָלָ֖ה חִזְקִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/012.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, because he had heard that Hezekiah had been sick.
translation:
  language: fr
  text: À cette époque, Berodak-Baladan, fils de Baladan, roi de Babylone, envoya des lettres et un cadeau à Ézéchias, car il avait appris qu’Ézéchias avait été malade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « Berodak-Baladan »; « Merodak-Baladan », forme attestée en Ésaïe 39.1 et dans une ancienne tradition textuelle, est aussi possible.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: À cette époque
  rationale: Expression temporelle naturelle en français moderne, qui situe l’épisode sans préciser indûment sa durée.
- source_word: שָׁלַח
  choice: envoya
  rationale: Équivalent courant et exact du verbe hébreu dans ce contexte diplomatique.
- source_word: בְּרֹאדַךְ בַּלְאֲדָן
  choice: Berodak-Baladan
  rationale: Translittération de la forme consonantique du texte massorétique de 2 Rois 20.12; la variante Merodak-Baladan est signalée en note.
- source_word: בֶּן בַּלְאֲדָן
  choice: fils de Baladan
  rationale: Rend directement la construction patronymique hébraïque.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Formulation française consacrée pour le titre royal et le royaume.
- source_word: סְפָרִים
  choice: des lettres
  rationale: Dans cet échange diplomatique, le pluriel désigne vraisemblablement de la correspondance plutôt que des livres ou des documents génériques.
- source_word: וּמִנְחָה
  choice: et un cadeau
  rationale: Le terme peut désigner une offrande, un présent ou un tribut; « cadeau » convient au geste diplomatique sans imposer l’idée de tribut.
- source_word: אֶל חִזְקִיָּהוּ
  choice: à Ézéchias
  rationale: Rend simplement le destinataire indiqué par la préposition hébraïque.
- source_word: כִּי שָׁמַע
  choice: car il avait appris
  rationale: Le premier כִּי exprime la cause; le plus-que-parfait respecte l’antériorité dans le récit, et « apprendre » est idiomatique pour une nouvelle reçue.
- source_word: כִּי חָלָה חִזְקִיָּהוּ
  choice: qu’Ézéchias avait été malade
  rationale: Le second כִּי introduit le contenu appris; cette formulation situe naturellement la maladie avant l’envoi tout en respectant l’accompli hébreu.
