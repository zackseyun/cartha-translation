  text: וַ/יְהִ֣י יְשַׁעְיָ֔הוּ לֹ֣א יָצָ֔א ה/עיר הַ/תִּֽיכֹנָ֑ה וּ/דְבַר יְהוָ֔ה הָיָ֥ה אֵלָ֖י/ו לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/004.yaml
  text: And it happened[a], before Isaiah had gone out into the middle court, that the word of Yahweh came to him, saying,
translation:
  language: fr
  text: 'Or Ésaïe n’était pas encore sorti de la cour centrale[a] lorsque la parole de Yahweh lui fut adressée en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la ville centrale ». Dans ce contexte, l’expression est traditionnellement comprise comme désignant une partie du palais, probablement une cour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Or
  rationale: Introduit avec naturel un nouveau développement du récit, sans recourir à la tournure vieillie « il arriva que ».
- source_word: יְשַׁעְיָהוּ
  choice: Ésaïe
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: לֹא יָצָא
  choice: n’était pas encore sorti
  rationale: Le plus-que-parfait et « pas encore » rendent clairement l’antériorité inachevée au moment où la parole divine survient.
- source_word: הָעִיר הַתִּיכֹנָה
  choice: la cour centrale
  rationale: Dans le contexte du palais, cette compréhension traditionnelle donne un sens naturel; une note conserve toutefois le sens littéral du texte consonantique, « la ville centrale ».
- source_word: וּדְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Conserve la formule prophétique établie et rend directement le nom divin.
- source_word: הָיָה אֵלָיו
  choice: lui fut adressée
  rationale: Expression française idiomatique pour la venue d’une parole divine à un prophète.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Introduit naturellement en français le discours direct qui commence au verset suivant.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le caractère personnel du nom sans introduire une interprétation confessionnelle particulière.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe fluide conserve la succession temporelle du texte hébreu; la note signale honnêtement la difficulté de הָעִיר הַתִּיכֹנָה.
