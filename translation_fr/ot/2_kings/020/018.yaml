  edition: WLC
  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יקח וְ/הָיוּ֙ סָֽרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/018.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: fr
  text: Et certains de tes fils, qui seront issus de toi, que tu auras engendrés, seront emmenés et deviendront des eunuques[a] dans le palais du roi de Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fonctionnaires de la cour » ou « fonctionnaires du palais » ; le terme hébreu peut désigner soit des eunuques au sens propre, soit, dans certains contextes, des fonctionnaires royaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: Et certains de tes fils
  rationale: Le מִן partitif appelle naturellement « certains de tes fils ». « Fils » conserve le terme hébreu, tout en pouvant viser ici la descendance royale.
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: issus de toi
  rationale: Cette expression française naturelle garde l'idée hébraïque de filiation physique sans reproduire lourdement l'image de « sortir de toi ».
- source_word: אֲשֶׁר תּוֹלִיד
  choice: ceux que tu auras engendrés
  rationale: Le hiphil de ילד exprime ici l'engendrement par le père. « Engendrés » est précis, digne et intelligible, et le futur antérieur convient à l'antériorité par rapport à leur déportation.
- source_word: יקח
  choice: seront emmenés
  rationale: La forme écrite est un singulier actif à valeur vraisemblablement impersonnelle dans ce contexte. Le passif français évite d'ajouter un sujet absent et « emmenés » exprime clairement le déplacement forcé.
- source_word: וְהָיוּ
  choice: et deviendront
  rationale: Avec un nom attribut, היה peut signifier « être » ou « devenir ». Ici, « deviendront » marque naturellement la situation nouvelle résultant de la déportation.
- source_word: סָרִיסִים
  choice: des eunuques
  rationale: « Eunuques » représente le sens lexical premier et convient à la gravité de l'oracle. Le sens possible de fonctionnaires de cour est conservé en note.
- source_word: בְּהֵיכַל
  choice: dans le palais
  rationale: Avec « roi de Babylone », הֵיכָל désigne clairement le palais royal plutôt qu'un temple.
- source_word: מֶלֶךְ בָּבֶל
  choice: du roi de Babylone
  rationale: Cette formulation rend directement et naturellement la chaîne construite hébraïque.
theological_decisions:
- issue: Sens de סָרִיסִים dans le cadre d'une cour royale
  choice: « eunuques » dans le texte principal
  alternative: « fonctionnaires de cour » ou « dignitaires du palais »
  rationale: Le mot peut désigner des hommes castrés ou, par extension dans certains contextes, des officiers royaux. Le sens littéral reste plausible ici et porte la force du jugement, tandis que la note maintient l'ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les deux propositions relatives du texte hébreu sans devenir artificielle. Le terme « engendrés » est légèrement soutenu, mais précis et adapté au registre biblique.
