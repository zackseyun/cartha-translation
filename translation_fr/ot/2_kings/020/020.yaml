source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י חִזְקִיָּ֨הוּ֙ וְ/כָל גְּב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר עָשָׂ֗ה אֶת הַ/בְּרֵכָה֙ וְ/אֶת הַ/תְּעָלָ֔ה וַ/יָּבֵ֥א אֶת הַ/מַּ֖יִם הָ/עִ֑ירָ/ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/020.yaml
  text: The rest of the acts of Hezekiah[a], and all his might[c][b], and how he made the pool and the conduit and brought the water into the city—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: fr
  text: Le reste des actes d’Ézéchias, toute sa puissance et la manière dont il aménagea le réservoir[a] et le canal[b], et fit entrer l’eau dans la ville[c], tout cela n’est-il pas écrit dans le livre des annales des rois de Juda ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bassin » ; le terme hébreu peut désigner un bassin d’eau aménagé.
    reason: lexical_alternative
  - marker: b
    text: Ou « conduite » ; le terme hébreu désigne un cours d’eau aménagé ou un ouvrage servant à conduire l’eau.
    reason: lexical_alternative
  - marker: c
    text: Il s’agit probablement des travaux hydrauliques d’Ézéchias à Jérusalem ; voir 2 Chroniques 32.30.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: le reste des actes
  rationale: Formule historiographique courante dans les livres des Rois. « Actes » désigne naturellement les faits et réalisations du règne, tout en conservant la portée assez large de דְּבָרִים.
- source_word: גְּבוּרָתוֹ
  choice: toute sa puissance
  rationale: Le nom peut évoquer la force, la vaillance ou les hauts faits. « Puissance » conserve ici le caractère abstrait du terme hébreu, les travaux hydrauliques qui suivent pouvant en illustrer les effets.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: et comment il aménagea
  rationale: La proposition introduit une réalisation précise d’Ézéchias. Dans ce contexte de travaux hydrauliques, « aménagea » est naturel sans préciser davantage la nature technique de l’ouvrage.
- source_word: הַבְּרֵכָה
  choice: le réservoir
  rationale: בְּרֵכָה désigne un bassin ou réservoir construit. « Réservoir » convient bien au contexte d’approvisionnement urbain, tout en laissant « bassin » comme possibilité lexicale.
- source_word: הַתְּעָלָה
  choice: le canal
  rationale: Le mot désigne une voie d’eau ou un ouvrage conduisant l’eau. « Canal » est clair en français moderne et n’impose pas la forme plus précise d’un tunnel.
- source_word: וַיָּבֵא אֶת־הַמַּיִם הָעִירָה
  choice: et fit entrer l’eau dans la ville
  rationale: Le suffixe directionnel de עִירָה marque le mouvement vers l’intérieur de la ville. La tournure causative française rend naturellement l’action attribuée au roi sans supposer qu’il l’accomplit personnellement.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: tout cela n’est-il pas écrit
  rationale: Cette formulation conserve la question rhétorique de la formule de clôture hébraïque. « Tout cela » reprend idiomatiquement en français l’ensemble des faits mentionnés.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: le livre des annales des rois de Juda
  rationale: « Annales » désigne clairement le document royal cité comme source et évite de le confondre avec le livre biblique canonique des Chroniques.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La question rhétorique et l’ampleur sémantique de « puissance » sont conservées. Le texte ne précise ni « tunnel » ni un site archéologique particulier, afin de ne pas aller au-delà de l’hébreu.
