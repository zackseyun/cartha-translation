    rationale: La subordonnée avec « que » offre une syntaxe française plus fluide sans modifier la valeur évaluative de נָקֵל.
  - severity: low
    issue: « dispositif d’ombre d’Ahaz » est une expression française imprécise et peut suggérer une identification technique assurée.
    rationale: Le référent exact demeure discuté; la note doit signaler les possibilités sans les trancher.
