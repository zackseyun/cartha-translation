  source_fidelity: 'Le sens fondamental est bien rendu : Ézéchias juge facile l’extension ou l’avancée normale de l’ombre sur dix marches et demande plutôt son retour en arrière. Toutefois, וַיֹּאמֶר signifie d’abord « dit »; « répondit » ajoute une nuance conversationnelle non nécessaire. La formulation révisée conserve l’ambiguïté de לִנְטוֹת sans identifier le dispositif comme un cadran solaire.'
  naturalness: « Il est facile que l’ombre s’allonge de dix marches » est plus idiomatique que « Il est facile pour l’ombre de s’allonger de dix marches », tout en gardant une formulation concise et un registre moderne digne. « Non, que l’ombre recule plutôt » restitue naturellement le rejet suivi de la préférence.
  terminology: « Marches » reflète directement מַעֲלוֹת. La note conserve « degrés » comme possibilité et évite de présenter comme certaine la nature du dispositif d’Ahaz.
