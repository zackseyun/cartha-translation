base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/010.yaml
  text: And Hezekiah said, “It is an easy thing for the shadow to stretch forward ten steps. No, but let the shadow go back ten steps.”
translation:
  language: fr
  text: 'Ézéchias dit : « Il est facile que l’ombre s’allonge de dix marches[a]. Non, que l’ombre recule plutôt de dix marches. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dix degrés ». Le mot hébreu signifie « marches » ou « montées » et peut désigner les marches ou les graduations du dispositif d’Ahaz lié à l’ombre.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: Il est facile
  rationale: Rend naturellement en français moderne l’idée de facilité ou de légèreté exprimée par l’adjectif hébreu.
- source_word: הַצֵּל / לַצֵּל
  choice: l’ombre
  rationale: Équivalent direct et naturel de צֵל avec l’article défini.
- source_word: לִנְטוֹת
  choice: de s’allonger
  rationale: Le verbe נטה exprime ici l’extension de l’ombre. « S’allonger » conserve cette image sans préciser plus que l’hébreu le mécanisme du déplacement.
- source_word: מַעֲלוֹת
  choice: marches
  rationale: Le nom désigne littéralement des montées ou des marches. Dans ce contexte, « marches » reste concret et évite d’imposer l’interprétation traditionnelle en degrés d’un cadran solaire.
- source_word: לֹא כִּי
  choice: Non ! … plutôt
  rationale: Cette formulation marque le rejet de la première possibilité puis la préférence pour l’autre, avec un français naturel.
- source_word: יָשׁוּב
  choice: Que … recule
  rationale: Le verbe שׁוב indique un retour. La tournure injonctive française rend la valeur volitive de la demande d’Ézéchias.
- source_word: אֲחֹרַנִּית
  choice: recule
  rationale: L’idée de mouvement vers l’arrière est intégrée au verbe « reculer », ce qui évite une formulation redondante.
