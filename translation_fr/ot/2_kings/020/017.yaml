  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑לָ/ה לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/017.yaml
  text: Look, days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon. Not a thing will be left, says the LORD.
translation:
  language: fr
  text: Voici que des jours viennent où tout ce qui est dans ta maison, tout ce que tes ancêtres ont amassé jusqu’à ce jour, sera emporté à Babylone. Il n’en restera rien, dit le SEIGNEUR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Cette formule attire solennellement l’attention sur l’annonce prophétique et convient au registre biblique moderne.
- source_word: בְּבֵיתֶךָ
  choice: dans ton palais
  rationale: Adressé au roi Ézéchias, בַּיִת désigne ici sa maison royale et ses trésors; « palais » rend naturellement ce sens contextuel.
- source_word: אֲבֹתֶיךָ
  choice: tes ancêtres
  rationale: Le terme désigne les prédécesseurs familiaux d’Ézéchias; « ancêtres » est plus naturel et inclusif en français moderne que le littéral « pères ».
- source_word: אָצְרוּ
  choice: ont amassé
  rationale: Le verbe exprime l’accumulation ou la mise en réserve de richesses.
- source_word: וְנִשָּׂא
  choice: sera emporté
  rationale: Le passif annonce le transfert forcé de l’ensemble des biens vers Babylone.
- source_word: בָּבֶלָה
  choice: à Babylone
  rationale: Le suffixe directionnel indique le mouvement vers Babylone.
- source_word: לֹא יִוָּתֵר דָּבָר
  choice: Il n’en restera rien
  rationale: 'Rend idiomatiquement la négation totale: pas une seule chose ne demeurera.'
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française courante pour représenter le tétragramme divin tout en le distinguant du titre ordinaire « Seigneur ».
theological_decisions:
- issue: Portée de la prophétie de jugement
  choice: Conserver l’annonce catégorique d’un pillage total sans préciser davantage son accomplissement historique.
  alternative: Expliciter l’exil babylonien ou en atténuer la portée.
  rationale: Le verset annonce directement que les biens seront emportés et que rien ne restera; toute précision historique supplémentaire dépasserait le texte.
translation_notes:
  register: Français international moderne, solennel et direct. Le tutoiement maintient l’adresse personnelle au roi. La syntaxe garde le parallélisme de l’hébreu sans lourdeur.
