source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע עֲלֵי/הֶם֮ חִזְקִיָּהוּ֒ וַ/יַּרְאֵ֣/ם אֶת כָּל בֵּ֣ית נְכֹתֹ֡/ה אֶת הַ/כֶּסֶף֩ וְ/אֶת הַ/זָּהָ֨ב וְ/אֶת הַ/בְּשָׂמִ֜ים וְ/אֵ֣ת שֶׁ֣מֶן הַ/טּ֗וֹב וְ/אֵת֙ בֵּ֣ית כֵּלָ֔י/ו וְ/אֵ֛ת כָּל אֲשֶׁ֥ר נִמְצָ֖א בְּ/אֽוֹצְרֹתָ֑י/ו לֹֽא הָיָ֣ה דָבָ֗ר אֲ֠שֶׁר לֹֽא הֶרְאָ֧/ם חִזְקִיָּ֛הוּ בְּ/בֵית֖/וֹ וּ/בְ/כָל מֶמְשַׁלְתּֽ/וֹ־־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/013.yaml
  text: And Hezekiah listened to them and showed them all his treasure house—the silver[a], the gold, the spices, the fine oil, his armory, and everything that was found in his storehouses[d][c][b]. There was nothing in his house or in all his realm that Hezekiah did not show them.
translation:
  language: fr
  text: 'Ézéchias les écouta[a] et leur montra tout son trésor[b] : l’argent, l’or, les aromates, l’huile précieuse, son dépôt d’équipement[c] et tout ce qui se trouvait dans ses réserves. Il n’y eut rien, dans sa maison ni dans tout son domaine[d], qu’Ézéchias ne leur montrât.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les entendit »; l’expression hébraïque peut aussi évoquer le fait de leur accorder une audience ou de les accueillir favorablement.
    reason: lexical_alternative
  - marker: b
    text: Ou « le dépôt de ses objets précieux »; littéralement, « la maison de ses objets précieux ».
    reason: lexical_alternative
  - marker: c
    text: Ou « son arsenal »; littéralement, « la maison de ses objets » ou « de son équipement ».
    reason: lexical_alternative
  - marker: d
    text: Ou « dans toute l’étendue de son autorité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עֲלֵיהֶם
  choice: Ézéchias les écouta
  rationale: « Écouter » conserve le sens fondamental de שׁמע tout en permettant, dans ce contexte diplomatique, la nuance d’un accueil ou d’une audience favorable, signalée en note sans être imposée dans le texte.
- source_word: וַיַּרְאֵם / הֶרְאָם
  choice: leur montra
  rationale: Le hifil de ראה signifie naturellement « montrer »; la même formulation française rend les deux occurrences.
- source_word: בֵּית נְכֹתֹה
  choice: la salle de ses trésors
  rationale: L’expression désigne le lieu où étaient gardés les biens précieux du roi. « Salle de ses trésors » est naturel en français et représente le suffixe possessif.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: l’argent, l’or
  rationale: Dans cet inventaire, כסף désigne le métal précieux plutôt que la monnaie au sens moderne; les articles définis reprennent ceux de l’hébreu.
- source_word: הַבְּשָׂמִים
  choice: les aromates
  rationale: Le terme désigne largement des substances aromatiques de valeur; « aromates » évite de limiter le sens aux épices alimentaires ou aux parfums.
- source_word: שֶׁמֶן הַטּוֹב
  choice: l’huile précieuse
  rationale: Littéralement « la bonne huile »; dans l’inventaire de biens royaux, « précieuse » exprime sa qualité et sa valeur sans préciser indûment son usage.
- source_word: בֵּית כֵּלָיו
  choice: son arsenal
  rationale: Littéralement « la maison de son équipement/de ses objets ». Dans ce contexte royal, כלי peut désigner l’équipement militaire; « arsenal » est concis, mais l’ambiguïté est conservée en note.
- source_word: כָּל אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: tout ce qui se trouvait dans ses réserves
  rationale: אוצר peut désigner un dépôt, une réserve ou un trésor. « Réserves » convient aux biens entreposés et évite une répétition lourde de « trésors ».
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: Il n’y eut rien… qu’Ézéchias ne leur montrât
  rationale: Cette formulation française rend fidèlement la double négation hébraïque et son insistance sur la totalité.
- source_word: בְּבֵיתוֹ
  choice: dans sa maison
  rationale: Traduction formelle de בית; le contexte royal permet de comprendre le palais, mais le texte ne l’explicite pas.
- source_word: בְכָל מֶמְשַׁלְתּוֹ
  choice: dans tout son domaine
  rationale: ממשלה désigne l’étendue soumise à son autorité. « Domaine » garde cette amplitude sans réduire nécessairement le sens au seul royaume comme entité politique.
