base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/015.yaml
  text: And he said[a], “What did they see in your house?” And Hezekiah said, “They saw everything that is in my house[b]. There was nothing that I did not show them among my treasuries.”
translation:
  language: fr
  text: 'Il dit : « Qu’ont-ils vu dans ta maison[a] ? » Ézéchias dit : « Ils ont vu tout ce qui est dans ma maison. Il n’y avait rien dans mes réserves[b] que je ne leur aie montré. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans ton palais ». Littéralement : « dans ta maison ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « dans mes trésoreries » ou « dans mes salles du trésor ». Le terme hébreu peut désigner les lieux où l’on conserve des objets précieux ou des provisions.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Qu’
  rationale: Le pronom interrogatif introduit directement la question ; « qu’est-ce qu’ils ont vu » serait également possible, mais plus lourd.
- source_word: רָאוּ
  choice: ont-ils vu / ont vu
  rationale: Le verbe ראה désigne ici l’action ordinaire de voir ; le passé composé convient naturellement au récit et au dialogue en français moderne.
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: dans ta maison / dans ma maison
  rationale: בַּיִת signifie littéralement « maison » et peut désigner un palais dans un contexte royal. Le texte principal conserve le terme concret et sa répétition, tandis qu’une note signale la nuance contextuelle.
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: tout ce qui est dans ma maison
  rationale: Cette formulation garde la portée exhaustive de כָּל et la structure relative de l’hébreu dans un français naturel.
- source_word: לֹא הָיָה דָבָר
  choice: il n’y avait rien
  rationale: Rendu idiomatique de la construction existentielle négative hébraïque, avec l’imparfait adapté à la situation décrite.
- source_word: אֲשֶׁר לֹא הִרְאִיתִם
  choice: que je ne leur aie montré
  rationale: Le hiphil de ראה signifie « faire voir », donc « montrer » ; « leur » rend explicitement le suffixe masculin pluriel.
- source_word: בְּאֹצְרֹתָי
  choice: parmi mes trésors
  rationale: אֹצָר peut désigner un trésor, une réserve ou le lieu où des biens sont gardés. « Parmi mes trésors » convient au contexte royal et évite de faire porter « dans » sur l’action de montrer.
