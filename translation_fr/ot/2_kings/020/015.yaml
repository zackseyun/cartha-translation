    issue: « Parmi mes trésors » rend אֹצְרוֹת comme des objets précieux plutôt que comme des lieux de conservation.
    rationale: Le pluriel אֹצְרוֹת désigne ici des trésoreries, magasins ou réserves. La préposition בְּ est mieux représentée par « dans », et non par « parmi ». La correction évite aussi d’ajouter l’idée que seuls des trésors précieux sont en cause.
  - severity: low
    issue: « Ézéchias répondit » explicite une relation de réponse que le texte hébreu formule simplement par « dit ».
    rationale: Dans ce dialogue, il répond bien à la question, mais « dit » conserve plus directement la répétition de וַיֹּאמֶר et le style narratif.
