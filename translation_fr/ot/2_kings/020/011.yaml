  source_fidelity: Le projet rend correctement l’appel d’Ésaïe à Yahweh, le caractère causatif de וַיָּשֶׁב et le recul de l’ombre de dix marches. Toutefois, « cria vers Yahweh » est un calque peu idiomatique en français, et l’ordre actuel de la fin de phrase obscurcit le lien entre les dix marches, les marches d’Ahaz et la descente antérieure de l’ombre.
  naturalness: « Cria à Yahweh » est plus naturel pour un appel adressé à Dieu. « Fit reculer l’ombre de dix marches sur les marches d’Ahaz qu’elle avait descendues » est fluide, conserve la répétition concrète de « marches » présente en hébreu et exprime sans redondance le mouvement inverse.
