  rationale: La révision améliore l’idiome français et clarifie la structure de la proposition finale. La répétition explicite de « Yahweh » évite que « celui-ci » ne paraisse démonstratif ou lourd, tout en identifiant sans ambiguïté le sujet implicite du verbe causatif dans le contexte immédiat. Elle ne transforme pas les « marches » en cadran et ne modifie ni l’étendue ni le sens du signe.
