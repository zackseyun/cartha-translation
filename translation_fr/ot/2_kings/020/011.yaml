  text: וַ/יִּקְרָ֛א יְשַׁעְיָ֥הוּ הַ/נָּבִ֖יא אֶל יְהוָ֑ה וַ/יָּ֣שֶׁב אֶת הַ/צֵּ֗ל בַּֽ֠/מַּעֲלוֹת אֲשֶׁ֨ר יָרְדָ֜ה בְּ/מַעֲל֥וֹת אָחָ֛ז אֲחֹֽרַנִּ֖ית עֶ֥שֶׂר מַעֲלֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/011.yaml
  text: And Isaiah the prophet cried out to Yahweh[a], and he brought the shadow back the ten steps by which it had gone down on the steps of Ahaz.
translation:
  language: fr
  text: Ésaïe, le prophète, cria à Yahweh, et Yahweh fit reculer l’ombre de dix marches[a] sur les marches d’Ahaz qu’elle avait descendues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dix degrés ». Le mot hébreu signifie « marches » ou « degrés »; certains y voient les éléments d’un dispositif servant à mesurer l’ombre, d’où la traduction traditionnelle « cadran d’Ahaz ».
    reason: Alternative lexicale et incertitude sur la nature du dispositif.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: cria vers
  rationale: Avec אֶל־יְהוָה, le verbe קרא exprime ici un appel pressant adressé à Dieu. « Cria vers » conserve la vivacité du verbe sans expliciter davantage par « pria ».
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: Ésaïe, le prophète
  rationale: Forme française courante du nom, suivie du titre; les virgules donnent une tournure naturelle en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, conformément à l’orientation du projet, plutôt que son remplacement par un titre.
- source_word: וַיָּשֶׁב
  choice: fit revenir
  rationale: Le hiphil de שוב est causatif. « Fit revenir » en garde clairement la valeur tout en restant idiomatique.
- source_word: אֶת הַצֵּל
  choice: l’ombre
  rationale: Objet direct du verbe causatif; le signe concerne le déplacement de l’ombre.
- source_word: אֲחֹרַנִּית
  choice: en arrière
  rationale: L’adverbe indique un mouvement inverse; « en arrière » le rend directement et naturellement.
- source_word: עֶשֶׂר מַעֲלוֹת
  choice: dix marches
  rationale: מַעֲלוֹת désigne littéralement des marches ou des degrés. « Marches » demeure concret et évite d’imposer l’interprétation d’un cadran solaire.
- source_word: בְּמַעֲלוֹת אָחָז
  choice: sur les marches d’Ahaz
  rationale: La formulation reste proche de l’hébreu et ne précise pas la nature exacte de l’aménagement associé à Ahaz.
- source_word: אֲשֶׁר יָרְדָה
  choice: qu’elle avait descendues
  rationale: Le pronom reprend « l’ombre » et le plus-que-parfait exprime naturellement son mouvement antérieur sur les marches.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme. Sa transcription préserve le nom propre de l’alliance au lieu de le remplacer par un titre.
- issue: Nature des מַעֲלוֹת אָחָז
  choice: les marches d’Ahaz
  alternative: l’escalier d’Ahaz / le cadran d’Ahaz
  rationale: L’hébreu parle de « marches/degrés » sans identifier explicitement un cadran. Le texte principal conserve donc cette indétermination historique.
- issue: Sujet implicite de וַיָּשֶׁב
  choice: celui-ci, renvoyant à Yahweh
  alternative: il, avec une référence grammaticale moins explicite
  rationale: Dans le récit, l’action miraculeuse répond à l’appel adressé à Yahweh. « Celui-ci » clarifie le référent immédiat sans ajouter un nom absent de l’hébreu.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve l’image concrète des marches ainsi que l’incertitude sur le dispositif d’Ahaz; elle évite le terme plus interprétatif « cadran solaire » dans le texte principal.
