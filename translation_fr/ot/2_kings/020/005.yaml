revisions:
- from: 'Retourne dire à Ézéchias, le chef de mon peuple : « Voici ce que dit Yahweh, le Dieu de David, ton ancêtre : J’ai entendu ta prière et j’ai vu tes larmes. Voici, je suis en train de te guérir[a]. Le troisième jour, tu monteras à la maison de Yahweh. »'
  to: 'Retourne et dis à Ézéchias, le chef de mon peuple : « Voici ce que dit Yahweh, le Dieu de David, ton ancêtre : J’ai entendu ta prière et j’ai vu tes larmes. Voici, je te guéris[a]. Le troisième jour, tu monteras à la maison de Yahweh. »'
  rationale: 'La révision limite les changements aux deux points nécessaires : elle rend explicitement la coordination des impératifs et remplace une périphrase progressive trop restrictive par une formulation française plus fidèle à la valeur souple du participe hébreu. Le reste du texte et l’ancre de note sont conservés.'
