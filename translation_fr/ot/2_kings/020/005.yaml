source:
  edition: WLC
  text: שׁ֣וּב וְ/אָמַרְתָּ֞ אֶל חִזְקִיָּ֣הוּ נְגִיד עַמִּ֗/י כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵי֙ דָּוִ֣ד אָבִ֔י/ךָ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ רָאִ֖יתִי אֶת דִּמְעָתֶ֑/ךָ הִנְ/נִי֙ רֹ֣פֶא לָ֔/ךְ בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י תַּעֲלֶ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/005.yaml
  text: 'Go back and say to Hezekiah[a], the leader of my people, ‘Thus says Yahweh, the God of David your father: I have heard your prayer; I have seen your tears. Look, I am healing you. On the third day you will go up to the house of Yahweh.’'
translation:
  language: fr
  text: 'Retourne et dis à Ézéchias, le chef de mon peuple : « Voici ce que dit Yahweh, le Dieu de David, ton ancêtre : J’ai entendu ta prière et j’ai vu tes larmes. Voici, je te guéris[a]. Le troisième jour, tu monteras à la maison de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je vais te guérir ». L’hébreu dit plus littéralement : « Voici, je te guéris », avec un participe qui peut exprimer une action imminente ou déjà engagée.'
    reason: Préserver l’ambiguïté du participe hébreu entre une action déclarée ou engagée et sa réalisation future, sans imposer l’idée d’un processus déjà en cours.
lexical_decisions:
- source_word: שׁוּב וְאָמַרְתָּ
  choice: Retourne dire
  rationale: L’impératif demande à Ésaïe de revenir sur ses pas, puis de transmettre le message. Cette formulation est naturelle en français et conserve la séquence implicite.
- source_word: נְגִיד עַמִּי
  choice: le chef de mon peuple
  rationale: נָגִיד désigne ici celui qui dirige le peuple. « Chef » est clair et n’introduit pas la nuance dynastique moderne de « prince ».
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Rend naturellement en français moderne la formule prophétique solennelle, tout en conservant le nom divin.
- source_word: אֱלֹהֵי דָּוִד אָבִיךָ
  choice: le Dieu de David, ton ancêtre
  rationale: Dans ce contexte royal, אָב signifie l’ancêtre dynastique plutôt que le père immédiat d’Ézéchias. La formulation évite une méprise tout en conservant le lien personnel.
- source_word: שָׁמַעְתִּי אֶת תְּפִלָּתֶךָ
  choice: J’ai entendu ta prière
  rationale: Le passé composé exprime naturellement en français une action accomplie dont les effets sont présents.
- source_word: רָאִיתִי אֶת דִּמְעָתֶךָ
  choice: j’ai vu tes larmes
  rationale: Conserve le parallélisme avec l’écoute de la prière et le sens collectif du substantif hébreu.
- source_word: הִנְנִי רֹפֶא לָךְ
  choice: Voici, je suis en train de te guérir
  rationale: « Voici » marque l’insistance de הִנְנִי, tandis que la tournure progressive reflète le participe רֹפֵא et son action imminente ou engagée.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Le troisième jour
  rationale: Rend directement l’indication temporelle sans ajouter « à partir de maintenant », absent de l’hébreu.
- source_word: תַּעֲלֶה
  choice: tu monteras
  rationale: Le futur convient à l’annonce et « monter » conserve la nuance topographique et cultuelle du déplacement vers le sanctuaire.
- source_word: בֵּית יְהוָה
  choice: à la maison de Yahweh
  rationale: Traduction transparente de l’expression hébraïque, plutôt que l’explicitation interprétative « temple ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Valeur aspectuelle de רֹפֶא dans la promesse divine
  choice: je suis en train de te guérir
  alternative: je te guérirai
  rationale: La construction הִנְנִי suivie du participe présente l’action comme imminente ou déjà engagée. Le contexte permet une lecture future, signalée en note, sans effacer la forme participiale.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique garde une certaine solennité sans archaïsmes; le tutoiement correspond au discours direct adressé à Ézéchias.
