    text: 'Ou : « je vais te guérir ». L’hébreu dit plus littéralement : « Voici, je te guéris », avec un participe qui peut exprimer une action imminente ou déjà engagée.'
    reason: Préserver l’ambiguïté du participe hébreu entre une action déclarée ou engagée et sa réalisation future, sans imposer l’idée d’un processus déjà en cours.
  revision_rationale: 'La révision limite les changements aux deux points nécessaires : elle rend explicitement la coordination des impératifs et remplace une périphrase progressive trop restrictive par une formulation française plus fidèle à la valeur souple du participe hébreu. Le reste du texte et l’ancre de note sont conservés.'
