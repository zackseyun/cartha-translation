  text: וַ/יֹּ֤אמֶר חִזְקִיָּ֨הוּ֙ אֶֽל יְשַׁעְיָ֔הוּ מָ֣ה א֔וֹת כִּֽי יִרְפָּ֥א יְהוָ֖ה לִ֑/י וְ/עָלִ֛יתִי בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/008.yaml
  text: And Hezekiah said to Isaiah[a], “What is the sign that Yahweh will heal me and that I will go up to the house of Yahweh on the third day?”
translation:
  language: fr
  text: 'Ézéchias dit à Ésaïe : « Quel sera le signe que Yahweh me guérira et que je monterai, le troisième jour, à la maison de Yahweh[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au temple de Yahweh ». Littéralement, « à la maison de Yahweh ».
    reason: Alternative lexicale explicitant que l’expression désigne le sanctuaire.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait avancer le récit. Le passé simple convient au registre narratif français sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: יְשַׁעְיָהוּ
  choice: Ésaïe
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: מָה אוֹת
  choice: Quel signe
  rationale: Rend naturellement la demande d’un signe confirmant l’accomplissement de la parole divine.
- source_word: כִּי
  choice: indiquera que
  rationale: כִּי introduit ici le contenu confirmé par le signe. L’ajout de « indiquera » explicite en français le lien syntaxique implicite sans définir la nature du signe.
- source_word: יִרְפָּא ... לִי
  choice: me guérira
  rationale: Le yiqtol exprime ici l’accomplissement futur annoncé; le datif hébreu se rend idiomatiquement par le pronom objet « me ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin יהוה, préservant son caractère de nom propre plutôt que de le remplacer par un titre.
- source_word: וְעָלִיתִי
  choice: et que ... je monterai
  rationale: עלה signifie « monter » et convient particulièrement au déplacement vers le sanctuaire. La répétition de « que » coordonne clairement les deux éléments confirmés par le signe.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: le troisième jour
  rationale: Expression temporelle française naturelle et fidèle.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Conserve l’image et la formulation littérales de l’hébreu; « temple » est proposé en note comme équivalent contextuel.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: Le texte porte directement le tétragramme. « Yahweh » maintient le nom personnel et évite de le remplacer silencieusement par un titre.
- issue: Sens de בֵּית יְהוָה
  choice: la maison de Yahweh
  alternative: le temple de Yahweh
  rationale: La traduction principale préserve la métaphore hébraïque, tandis que la note donne le référent institutionnel naturel sans effacer la formulation source.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple maintient un style narratif soutenu mais courant dans la lecture biblique; la question demeure directe et naturelle.
