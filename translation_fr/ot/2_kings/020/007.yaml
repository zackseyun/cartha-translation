source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְשַֽׁעְיָ֔הוּ קְח֖וּ דְּבֶ֣לֶת תְּאֵנִ֑ים וַ/יִּקְח֛וּ וַ/יָּשִׂ֥ימוּ עַֽל הַ/שְּׁחִ֖ין וַ/יֶּֽחִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/007.yaml
  text: And Isaiah said[a], “Take a cake of figs.” So they took it and laid it on the boil[c][b], and he recovered.
translation:
  language: fr
  text: 'Puis Ésaïe dit : « Prenez un gâteau de figues[a]. » Ils le prirent donc, l’appliquèrent sur le furoncle[b], et il se rétablit[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une masse de figues pressées » ou « un pain de figues ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la plaie enflammée » ou « l’ulcère ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « et il vécut » ; dans ce contexte, cela signifie qu’il se rétablit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le wayyiqtol fait progresser le récit. « Puis » exprime naturellement cette succession en français sans préciser davantage le rapport temporel.
- source_word: יְשַׁעְיָהוּ
  choice: Ésaïe
  rationale: Forme française traditionnelle et largement reconnue du nom du prophète.
- source_word: קְחוּ
  choice: Prenez
  rationale: Impératif pluriel de לקח. « Prenez » conserve directement le nombre et le sens du verbe, sans ajouter la nuance directionnelle de « apportez ».
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: un gâteau de figues
  rationale: דְּבֶלֶת désigne une masse ou un gâteau de fruits pressés, et תְּאֵנִים précise qu’il s’agit de figues. Cette formulation reste concrète et compréhensible.
- source_word: וַיִּקְחוּ
  choice: Ils le prirent donc
  rationale: Le verbe est au pluriel et son objet, implicite en hébreu, est naturellement repris par « le » en français. « Donc » marque la réponse à l’ordre donné.
- source_word: וַיָּשִׂימוּ עַל
  choice: l’appliquèrent sur
  rationale: Le verbe שׂים signifie largement « mettre, placer ». Dans ce contexte de soin, « appliquer sur » rend idiomatiquement le geste sans affirmer un mécanisme médical précis.
- source_word: הַשְּׁחִין
  choice: le furoncle
  rationale: שְׁחִין peut désigner un furoncle, une lésion enflammée ou un ulcère. « Furoncle » est ici un équivalent français concis et concret, tandis que les autres possibilités sont signalées en note.
- source_word: וַיֶּחִי
  choice: et il se rétablit
  rationale: Le verbe חיה signifie littéralement « vivre » ou « revenir à la vie », mais désigne contextuellement le retour à la santé. « Il se rétablit » communique ce sens sans évoquer une résurrection.
theological_decisions:
- issue: Portée de וַיֶּחִי à la fin du récit
  choice: un rétablissement physique
  alternative: « il vécut » ou « il revint à la vie »
  rationale: Dans le contexte de la maladie d’Ézéchias et de l’application du gâteau de figues sur la lésion, le verbe décrit naturellement son rétablissement. Une note conserve toutefois la formulation hébraïque plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct et les verbes au pluriel suivent la syntaxe hébraïque. Le vocabulaire médical demeure courant et les ambiguïtés lexicales importantes sont conservées dans les notes.
