  text: אָנָּ֣ה יְהוָ֗ה זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵבָ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/003.yaml
  text: “Please[a], O Yahweh, remember, I pray, how I have walked before you in faithfulness and with a whole heart[b], and have done what is good in your eyes.” And Hezekiah wept bitterly.
translation:
  language: fr
  text: « Je t’en prie, Yahweh, souviens-toi de la manière dont j’ai marché devant toi avec fidélité[a] et avec un cœur entier[b], et dont j’ai fait ce qui est bien à tes yeux. » Puis Ézéchias pleura abondamment[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la vérité ». Le mot hébreu peut désigner la vérité, la sincérité ou la fidélité.
    reason: lexical_alternative
  - marker: b
    text: Ou « d’un cœur sans partage ».
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu emploie une expression intensive, littéralement « pleura avec de grands pleurs ». Autre traduction possible : « pleura amèrement ».'
    reason: translation_clarity
lexical_decisions:
- source_word: אָנָּה ... נָא
  choice: Je t’en prie ... donc
  rationale: Les deux particules donnent à la prière son caractère pressant. « Je t’en prie » exprime naturellement la supplication, tandis que « donc » laisse percevoir la force de נָא sans produire une répétition pesante.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui préserve ici l’adresse personnelle au Dieu d’Israël.
- source_word: זְכָר
  choice: souviens-toi
  rationale: Rend directement l’impératif hébreu et convient à une prière instante.
- source_word: אֲשֶׁר הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: de la manière dont j’ai marché devant toi
  rationale: Préserve la métaphore hébraïque de la marche comme conduite de vie, tout en rendant la relation syntaxique avec « souviens-toi » naturelle en français.
- source_word: בֶּאֱמֶת
  choice: avec fidélité
  rationale: Dans ce contexte moral, אֱמֶת évoque la loyauté et la sincérité de la conduite; « fidélité » garde ce sens sans exclure la nuance de vérité.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: d’un cœur entier
  rationale: שָׁלֵם exprime l’intégrité ou l’absence de partage du cœur, non une perfection absolue.
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: et dont j’ai fait ce qui est bien à tes yeux
  rationale: Conserve l’expression évaluative hébraïque centrée sur le jugement de Dieu.
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: Puis Ézéchias pleura abondamment
  rationale: La construction avec le nom « pleurs » qualifié de « grands » intensifie l’action. « Abondamment » rend cette intensité sans introduire nécessairement l’idée d’amertume.
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte contient le nom propre divin dans une adresse directe; sa translittération préserve cette particularité.
- issue: Portée de לֵבָב שָׁלֵם dans l’affirmation d’Ézéchias
  choice: d’un cœur entier
  alternative: d’un cœur parfait
  rationale: Le choix maintient l’affirmation d’une loyauté entière sans transformer le verset en déclaration explicite d’impeccabilité.
- issue: Intensité de בְּכִי גָדוֹל
  choice: pleura abondamment
  alternative: pleura amèrement
  rationale: גָדוֹל signifie littéralement « grand » et intensifie les pleurs; « amèrement » est possible idiomatiquement, mais précise une qualité émotionnelle que l’hébreu ne formule pas directement.
translation_notes:
  register: Français international actuel, digne et accessible. La métaphore biblique « marcher devant toi » et l’expression « à tes yeux » sont conservées parce qu’elles restent intelligibles. « Je t’en prie » évite l’archaïsme de « de grâce », et « cœur entier » préserve la tension du propos sans suggérer une perfection sans péché.
