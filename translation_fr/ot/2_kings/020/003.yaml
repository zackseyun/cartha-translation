  terminology: « Yahweh », « Ézéchias », « fidélité », « cœur entier » et « à tes yeux » conviennent au français biblique moderne international et représentent adéquatement les termes hébreux. Les notes a et b préservent utilement les nuances lexicales. La note c doit éviter de qualifier de littérale une formulation plurielle qui ne correspond pas exactement à la construction hébraïque.
