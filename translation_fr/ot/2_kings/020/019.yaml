  text: וַ/יֹּ֤אמֶר חִזְקִיָּ֨הוּ֙ אֶֽל יְשַֽׁעְיָ֔הוּ ט֥וֹב דְּבַר יְהוָ֖ה אֲשֶׁ֣ר דִּבַּ֑רְתָּ וַ/יֹּ֕אמֶר הֲ/ל֛וֹא אִם שָׁל֥וֹם וֶ/אֱמֶ֖ת יִהְיֶ֥ה בְ/יָמָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/019.yaml
  text: Then Hezekiah said to Isaiah[a], “The word of Yahweh that you have spoken is good.” For he thought, “Will there not be peace and stability in my days?”
translation:
  language: fr
  text: 'Alors Ézéchias dit à Ésaïe : « La parole de Yahweh que tu as prononcée est bonne. » Car il se disait : « N’y aura-t-il pas de paix et de stabilité de mon vivant[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pendant mes jours ». On peut aussi traduire « paix et vérité » ou « paix et fidélité » ; ici, le mot hébreu rendu par « stabilité » évoque ce qui est sûr et durable.'
    reason: Signaler à la fois la formulation littérale de l’expression temporelle et l’ambiguïté lexicale de אֱמֶת.
lexical_decisions:
- source_word: טוֹב
  choice: bonne
  rationale: Rend directement l’évaluation concise de la parole annoncée, sans préciser si Ézéchias la juge moralement bonne ou simplement acceptable.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve le lien avec la proclamation prophétique, et « Yahweh » représente explicitement le nom divin.
- source_word: דִּבַּרְתָּ
  choice: que tu as prononcée
  rationale: Formulation française naturelle pour une parole prophétique adressée par Ésaïe, tout en gardant celui-ci comme porte-parole.
- source_word: הֲלוֹא אִם
  choice: 'Car il se disait : « N’y aura-t-il pas… ? »'
  rationale: La construction hébraïque est elliptique. Cette formulation restitue sa valeur de justification et sa force rhétorique dans un français intelligible, sans supprimer la tension morale.
- source_word: שָׁלוֹם
  choice: paix
  rationale: Terme large qui peut inclure la tranquillité collective et le bien-être, sans le réduire à la prospérité matérielle.
- source_word: אֱמֶת
  choice: stabilité
  rationale: Dans ce contexte royal et national, le mot peut désigner une situation fiable et durable. « Stabilité » exprime ce sens contextuel, tandis que les sens plus formels sont signalés en note.
- source_word: בְיָמָי
  choice: de mon vivant
  rationale: Expression française actuelle et naturelle équivalant à « pendant mes jours », qui souligne que le jugement annoncé ne surviendra pas durant la vie d’Ézéchias.
theological_decisions:
- issue: La dernière proposition est elliptique et peut être comprise comme une seconde parole prononcée ou comme l’explication de la réaction d’Ézéchias.
  choice: 'La rendre comme une réflexion explicative : « Car il se disait… »'
  alternative: '« Puis il ajouta : “N’est-ce pas qu’il y aura paix et vérité pendant mes jours ?” »'
  rationale: Le contexte indique qu’Ézéchias réagit au report du désastre au-delà de sa vie. La formulation choisie rend l’enchaînement intelligible sans excuser son égocentrisme ni rendre son approbation plus sévère que le texte.
- issue: Le sens de אֱמֶת dans le couple שָׁלוֹם וֶאֱמֶת.
  choice: « paix et stabilité » dans le texte
  alternative: « paix et vérité » ou « paix et fidélité »
  rationale: « Stabilité » convient à la sécurité durable du règne dans ce contexte, mais la polysémie réelle du terme hébreu est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « de mon vivant » évite le calque « dans mes jours ». Le discours conserve la brièveté du récit et la tension morale de la réaction d’Ézéchias.
