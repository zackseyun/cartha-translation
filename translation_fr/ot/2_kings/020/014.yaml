base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/014.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him[a], “What did these men say, and where did they come from to you?” And Hezekiah said, “They came to me from a distant land[b], from Babylon.”
translation:
  language: fr
  text: 'Alors le prophète Ésaïe vint trouver le roi Ézéchias et lui demanda : « Qu’ont dit ces hommes, et d’où sont-ils venus chez toi[a] ? » Ézéchias répondit : « Ils sont venus d’un pays lointain, de Babylone[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et d’où viennent-ils chez toi ? » La forme verbale hébraïque peut se rendre au présent, mais le passé convient au contexte narratif.'
    reason: lexical_alternative
  - marker: b
    text: La formule « d’un pays lointain » est ensuite précisée par « de Babylone » ; elle conserve l’insistance d’Ézéchias sur l’éloignement des visiteurs avant qu’il nomme leur pays d’origine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Alors ... vint trouver
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession, et « vint trouver » rend idiomatiquement le mouvement vers le roi.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: le prophète Ésaïe
  rationale: Forme française traditionnelle du nom, accompagnée du titre défini qui précise sa fonction.
- source_word: אֶל־הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: le roi Ézéchias
  rationale: La construction française avec le titre suivi du nom rend naturellement l’apposition hébraïque.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: lui demanda
  rationale: Le verbe hébreu signifie littéralement « lui dit », mais la parole qui suit est interrogative ; « demanda » est ici une équivalence contextuelle naturelle.
- source_word: מָה אָמְרוּ הָאֲנָשִׁים הָאֵלֶּה
  choice: Qu’ont dit ces hommes
  rationale: Le passé composé convient à une question portant sur les paroles récemment prononcées ; « hommes » conserve la désignation masculine explicite.
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: et d’où sont-ils venus chez toi
  rationale: Le passé composé correspond au contexte narratif malgré l’imparfait hébreu. « Chez toi » exprime naturellement en français le mouvement vers la personne et sa résidence.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: d’un pays lointain
  rationale: Expression française courante qui conserve l’idée d’éloignement géographique.
- source_word: בָּאוּ מִבָּבֶל
  choice: Ils sont venus ... de Babylone
  rationale: 'La réponse conserve l’ordre hébreu : origine générale, puis précision géographique.'
