  text: Then he turned his face to the wall and prayed to Yahweh[a], saying,
translation:
  language: fr
  text: 'Alors il tourna son visage vers le mur et pria Yahweh[a] en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » (יהוה), nom propre du Dieu d’Israël, souvent rendu par « le SEIGNEUR » dans les traductions.'
    reason: Préciser la forme hébraïque écrite du nom divin et signaler la convention de traduction courante.
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: Alors il tourna
  rationale: Le wayyiqtol hiphil de סבב présente l’action suivante du récit. « Alors » marque naturellement la progression narrative, et « tourna » exprime le mouvement causatif dans ce contexte.
- source_word: פָּנָיו
  choice: son visage
  rationale: פנים désigne ici concrètement le visage. Cette formulation conserve l’image du texte hébreu tout en restant naturelle en français.
- source_word: אֶל הַקִּיר
  choice: vers le mur
  rationale: אֶל indique la direction et קִיר signifie « mur ». « Vers le mur » rend précisément le mouvement sans suggérer nécessairement un contact.
- source_word: וַיִּתְפַּלֵּל
  choice: et pria
  rationale: Le hitpael de פלל signifie ici « prier ». Le passé simple convient au registre narratif biblique français sans être archaïque.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: La préposition אֶל introduit le destinataire de la prière. Le nom divin יהוה est translittéré « Yahweh », ce qui préserve sa valeur de nom propre.
- source_word: לֵאמֹר
  choice: 'en disant :'
  rationale: L’infinitif construit de אמר introduit les paroles de la prière qui suivent. « En disant » reproduit cette fonction de façon claire et idiomatique.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu porte explicitement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le distingue du titre « Seigneur » sans ajouter d’interprétation confessionnelle; une note signale la convention alternative courante.
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple maintient la concision du récit; « vers le mur » conserve la nuance directionnelle de אֶל. Le deux-points introduit naturellement le contenu de la prière au verset suivant.
