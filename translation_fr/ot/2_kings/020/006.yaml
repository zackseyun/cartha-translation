source:
  edition: WLC
  text: וְ/הֹסַפְתִּ֣י עַל יָמֶ֗י/ךָ חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִי֙ עַל הָ/עִ֣יר הַ/זֹּ֔את לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/006.yaml
  text: And I will add fifteen years to your life[a], and I will deliver you and this city from the hand of the king of Assyria[b], and I will defend this city for my own sake and for the sake of my servant David.
translation:
  language: fr
  text: J’ajouterai quinze ans à ta vie. Je te délivrerai, toi et cette ville, du pouvoir du roi d’Assyrie[a], et je défendrai cette ville[b], par égard pour moi-même et pour David, mon serviteur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la main du roi d’Assyrie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je protégerai cette ville ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֹסַפְתִּי עַל יָמֶיךָ חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: J’ajouterai quinze ans à ta vie
  rationale: L’hébreu dit littéralement « j’ajouterai à tes jours quinze années ». « À ta vie » restitue naturellement en français l’idée d’une prolongation de la durée de vie.
- source_word: וּמִכַּף מֶלֶךְ אַשּׁוּר
  choice: du pouvoir du roi d’Assyrie
  rationale: כַּף, littéralement « main » ou « paume », désigne ici le pouvoir ou l’emprise du roi. La traduction explicite cet idiome tout en signalant sa forme littérale en note.
- source_word: אַצִּילְךָ וְאֵת הָעִיר הַזֹּאת
  choice: Je te délivrerai, toi et cette ville
  rationale: Le hiphil de נצל exprime l’action d’arracher au danger ou de délivrer. La reprise « toi et cette ville » rend clairement les deux compléments du verbe.
- source_word: וְגַנּוֹתִי עַל הָעִיר הַזֹּאת
  choice: je défendrai cette ville
  rationale: Le verbe גנן signifie protéger ou défendre. « Défendrai » convient au contexte de menace militaire sans exclure la notion plus générale de protection.
- source_word: לְמַעֲנִי וּלְמַעַן דָּוִד עַבְדִּי
  choice: par égard pour moi-même et pour David, mon serviteur
  rationale: למען indique ici le motif de l’intervention divine. « Par égard pour » est naturel et digne en français, tout en conservant la double motivation explicitement énoncée.
theological_decisions:
- issue: Motif divin de la défense de Jérusalem
  choice: par égard pour moi-même et pour David, mon serviteur
  alternative: à cause de moi-même et à cause de David, mon serviteur
  rationale: La formulation retenue conserve sans l’expliquer davantage la tension du texte, qui fonde l’action de Dieu à la fois sur lui-même et sur David, son serviteur.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse divine au roi. La syntaxe évite un calque lourd tout en conservant les deux objets de la délivrance et les deux motifs de la défense.
