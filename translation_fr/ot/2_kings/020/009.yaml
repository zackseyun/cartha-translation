base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/009.yaml
  text: 'And Isaiah said[a], “This is the sign for you from Yahweh, that Yahweh will do the thing that he has spoken: shall the shadow go forward ten steps, or shall it turn back ten steps?”'
translation:
  language: fr
  text: 'Ésaïe dit : « Voici le signe que Yahweh te donne pour confirmer qu’il accomplira ce qu’il a déclaré : l’ombre avancera-t-elle de dix marches[a], ou reculera-t-elle de dix marches ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dix degrés ». Le mot hébreu signifie littéralement « marches » ou « montées » ; dans ce contexte, il est traditionnellement rendu par « degrés », en lien avec le mouvement de l’ombre et les « degrés d’Ahaz » mentionnés au verset 11.
    reason: Alternative lexicale ; le référent matériel précis des maʿalot demeure incertain.
lexical_decisions:
- source_word: הָאוֹת
  choice: le signe
  rationale: Le nom אוֹת désigne ici un signe confirmant que la parole annoncée s’accomplira.
- source_word: מֵאֵת יְהוָה
  choice: venant de Yahweh
  rationale: La préposition composée indique la source du signe, et le nom divin est rendu par « Yahweh ».
- source_word: כִּי
  choice: que
  rationale: Dans ce contexte, כִּי introduit le contenu ou la portée confirmative du signe.
- source_word: יַעֲשֶׂה יְהוָה אֶת הַדָּבָר אֲשֶׁר דִּבֵּר
  choice: Yahweh accomplira ce qu’il a déclaré
  rationale: Cette formulation française naturelle exprime la réalisation effective de la chose précédemment annoncée, sans alourdir la phrase par « la chose qu’il a dite ».
- source_word: הָלַךְ הַצֵּל
  choice: l’ombre avancera-t-elle
  rationale: Bien que הָלַךְ soit formellement un accompli, la construction interrogative présente ici la première des deux possibilités proposées pour le signe.
- source_word: מַעֲלוֹת
  choice: marches
  rationale: Le mot désigne littéralement des marches ou des degrés d’élévation. « Marches » conserve l’image concrète sans identifier avec certitude le dispositif.
- source_word: אִם
  choice: ou
  rationale: אִם introduit ici le second terme d’une question disjonctive.
- source_word: יָשׁוּב
  choice: reculera-t-elle
  rationale: Le verbe שׁוּב exprime un retour en arrière; « reculera » forme en français un contraste direct et naturel avec « avancera ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » préserve ici le caractère de nom propre sans substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La question à deux options est rendue de manière directe; « marches » maintient l’image concrète du texte hébreu, tandis que la note signale le rendu traditionnel « degrés ».
