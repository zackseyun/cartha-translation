  text: וַ/יִּשְׁכַּ֥ב חִזְקִיָּ֖הוּ עִם אֲבֹתָ֑י/ו וַ/יִּמְלֹ֛ךְ מְנַשֶּׁ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/021.yaml
  text: And Hezekiah lay down with his fathers[a], and Manasseh his son became king in his place.
translation:
  language: fr
  text: Ézéchias se coucha avec ses ancêtres[a], et son fils Manassé devint roi à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec ses pères ». L’hébreu emploie ici une formule royale conventionnelle pour parler de la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Le verbe שׁכב signifie littéralement « se coucher » et, suivi de « avec ses pères », appartient à une formule royale conventionnelle évoquant la mort. « Se coucha » conserve l’image hébraïque sans la réduire au simple verbe « mourir ».
- source_word: עִם אֲבֹתָיו
  choice: avec ses ancêtres
  rationale: Littéralement « avec ses pères », cette expression désigne les générations précédentes dans une formule de mort royale. « Ancêtres » rend clairement ce sens en français moderne tout en évitant que « avec ses pères » soit compris comme visant plusieurs pères au sens strict.
- source_word: וַיִּמְלֹךְ
  choice: devint roi
  rationale: Dans cette formule de succession, מלך marque l’accession au trône. « Devint roi » exprime mieux cet événement que « régna », qui pourrait attirer l’attention sur la durée du règne.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française traditionnelle et courante de ce nom propre hébreu.
- source_word: בְנוֹ
  choice: son fils
  rationale: Rend explicitement la relation filiale indiquée dans le texte hébreu.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans un contexte de succession royale, תחתיו indique que Manassé prend la place d’Ézéchias comme roi.
theological_decisions:
- issue: Portée de la formule « se coucher avec ses ancêtres »
  choice: Conserver la formule imagée et l’expliquer en note comme une annonce conventionnelle de la mort
  alternative: Traduire directement par « mourut »
  rationale: La formulation hébraïque évoque la mort sans employer ici le verbe « mourir ». La conserver respecte la texture littéraire du récit sans lui attribuer une affirmation plus précise sur l’état des morts.
translation_notes:
  register: Français moderne, sobre et digne. La tournure « se coucha avec ses ancêtres » garde l’image traditionnelle du texte source; la note prévient une lecture trop littérale et précise l’hébraïsme.
