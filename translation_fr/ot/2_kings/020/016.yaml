  text: וַ/יֹּ֥אמֶר יְשַׁעְיָ֖הוּ אֶל חִזְקִיָּ֑הוּ שְׁמַ֖ע דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/016.yaml
  text: Then Isaiah said to Hezekiah[a], “Hear the word of Yahweh.”
translation:
  language: fr
  text: 'Alors Ésaïe dit à Ézéchias : « Écoute la parole de Yahweh[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement en français la succession narrative.
- source_word: יְשַׁעְיָהוּ
  choice: Ésaïe
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: אֶל חִזְקִיָּהוּ
  choice: à Ézéchias
  rationale: La préposition אֶל indique ici le destinataire de la parole; « à » est l’équivalent français naturel. « Ézéchias » est la forme française traditionnelle du nom.
- source_word: שְׁמַע
  choice: Écoute
  rationale: L’impératif de שׁמע appelle non seulement à entendre, mais à prêter attention. « Écoute » rend cette sommation prophétique en français moderne.
- source_word: דְּבַר
  choice: la parole
  rationale: Dans cette formule prophétique, דָּבָר désigne ce que Dieu communique. « La parole » conserve l’expression biblique établie et sa solennité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte directement le tétragramme, nom personnel divin. « Yahweh » le translittère au lieu de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le tétragramme. Le rendre par « Yahweh » préserve le nom personnel présent dans la source; la traduction traditionnelle par « le SEIGNEUR » est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure brève conserve la force de la sommation prophétique; le deux-points introduit normalement la parole directe en français.
