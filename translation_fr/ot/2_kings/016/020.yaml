base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/020.yaml
  text: And Ahaz slept with his fathers and was buried with his fathers in the city of David[a], and Hezekiah his son reigned in his place.
translation:
  language: fr
  text: Achaz se coucha avec ses pères[a] et fut enterré avec ses pères dans la cité de David. Son fils Ézéchias régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « se coucher avec ses pères » est une formule royale conventionnelle pour dire qu’Achaz mourut; elle évoque son rattachement à ses ancêtres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Dans la formule royale de décès, שׁכב avec « avec ses pères » annonce la mort. « Se coucha » conserve l’image et le caractère formulaire de l’hébreu, tandis que la note en explicite le sens.
- source_word: עִם אֲבֹתָיו
  choice: avec ses pères
  rationale: Cette formulation suit étroitement l’expression dynastique hébraïque et maintient son lien avec la lignée royale; « avec ses ancêtres » serait plus immédiatement transparent, mais moins formellement proche.
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: Le nifal appelle naturellement une tournure passive. « Fut enterré » est courant, clair et digne en français moderne.
- source_word: בְּעִיר דָּוִד
  choice: dans la Cité de David
  rationale: Il s’agit du nom traditionnel et transparent du lieu; la majuscule à « Cité » signale ici le toponyme établi.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans une notice de succession, מלך exprime l’accession et le règne. « Régna » restitue avec concision la formule hébraïque.
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: « Ézéchias » est la forme française conventionnelle du nom biblique.
- source_word: בְנוֹ
  choice: son fils
  rationale: La relation filiale est explicitement exprimée dans l’hébreu et reste naturelle dans la formule française de succession.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans ce contexte de succession royale, תַּחְתָּיו désigne le remplacement sur le trône; « à sa place » en conserve directement le sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation royale répétitive de l’hébreu est conservée, notamment « avec ses pères », afin de préserver son caractère dynastique et formulaire; la note clarifie l’idiome de décès.
