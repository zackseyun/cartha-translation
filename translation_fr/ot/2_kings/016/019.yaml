source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָחָ֖ז אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/019.yaml
  text: The rest of the acts of Ahaz[a], which he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: fr
  text: Le reste des actes qu’Achaz a accomplis n’est-il pas écrit dans le livre des Chroniques des rois de Juda[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le livre des Annales des rois de Juda ».'
    reason: Alternative lexicale pour דִּבְרֵי הַיָּמִים, qui peut désigner des chroniques ou des annales royales.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes
  rationale: יֶתֶר désigne ce qui reste, et דִּבְרֵי, dans cette formule de bilan royal, renvoie aux actes ou aux affaires du roi plutôt qu’à ses seules paroles. Le וְ initial assure la continuité du récit sans exiger un connecteur français explicite.
- source_word: אָחָז
  choice: Achaz
  rationale: Forme française traditionnelle et largement reconnue du nom royal hébreu.
- source_word: אֲשֶׁר עָשָׂה
  choice: tout ce qu’il a fait
  rationale: Cette formulation naturelle restitue la relative hébraïque et son caractère récapitulatif sans réduire sa portée.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: n’est-il pas écrit
  rationale: La question rhétorique attend une réponse affirmative. En français, l’accord au singulier avec « le reste » est naturel, même si l’hébreu reprend au pluriel les actes évoqués.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Bien que עַל signifie littéralement « sur », le français emploie idiomatiquement « dans » pour indiquer qu’un renseignement figure dans un document.
- source_word: דִּבְרֵי הַיָּמִים
  choice: les Chroniques
  rationale: Dans ce titre de document royal, l’expression désigne une relation chronologique des événements; « Chroniques » est l’équivalent français conventionnel, tandis qu’« Annales » reste possible.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: des rois de Juda
  rationale: Dans cette formule archivistique, לְ exprime la relation du document aux rois de Juda; le complément avec « de » est idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La structure conserve la question rhétorique et la formule historiographique de l’hébreu, tout en adoptant l’accord naturel avec le sujet singulier « le reste ».
