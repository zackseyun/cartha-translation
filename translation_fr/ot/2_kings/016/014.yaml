  terminology: « Autel de bronze », « Yahweh » et « côté nord » sont appropriés. La note sur « cuivre » préserve correctement l’alternative lexicale. La note b est reformulée pour signaler à la fois le libellé hébreu et son référent, sans transformer le texte en une paraphrase.
