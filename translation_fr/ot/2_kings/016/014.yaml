  text: וְ/אֵ֨ת הַ/מִּזְבַּ֣ח הַ/נְּחֹשֶׁת֮ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָה֒ וַ/יַּקְרֵ֗ב מֵ/אֵת֙ פְּנֵ֣י הַ/בַּ֔יִת מִ/בֵּין֙ הַ/מִּזְבֵּ֔חַ וּ/מִ/בֵּ֖ין בֵּ֣ית יְהוָ֑ה וַ/יִּתֵּ֥ן אֹת֛/וֹ עַל יֶ֥רֶךְ הַ/מִּזְבֵּ֖חַ צָפֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/014.yaml
  text: As for the bronze altar that was before Yahweh[a], he brought it from the front of the house, from between the altar and the house of Yahweh[b], and put it on the north side of the altar.
translation:
  language: fr
  text: Quant à l’autel de bronze[a] qui se trouvait devant Yahweh, il le retira de devant la maison, de l’endroit situé entre l’autel et la maison de Yahweh[b], et le plaça sur le côté nord de l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’autel de cuivre ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « la maison de Yahweh » ; il s’agit du temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבַּח הַנְּחֹשֶׁת
  choice: l’autel de bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze. « Bronze » est le terme traditionnel et vraisemblable pour le mobilier cultuel, tandis qu’une note conserve l’autre possibilité.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: qui se trouvait devant Yahweh
  rationale: לִפְנֵי exprime ici une position spatiale devant ou en présence de Yahweh. « Se trouvait devant » rend clairement cette localisation sans effacer sa portée cultuelle.
- source_word: וַיַּקְרֵב מֵאֵת פְּנֵי הַבַּיִת
  choice: il le déplaça de devant la Maison
  rationale: Dans ce contexte, קרב décrit le déplacement de l’autel. Avec מֵאֵת פְּנֵי, la formulation indique qu’il fut retiré de l’espace devant le bâtiment. « Déplaça » est naturel en français et évite l’ambiguïté de « approcha ».
- source_word: הַבַּיִת / בֵּית יְהוָה
  choice: la Maison / la maison de Yahweh
  rationale: Le maintien de « maison » reflète le vocabulaire hébreu. La majuscule au premier emploi signale naturellement qu’il s’agit du sanctuaire, et la note explicite le référent.
- source_word: מִבֵּין הַמִּזְבֵּחַ וּמִבֵּין בֵּית יְהוָה
  choice: de l’endroit situé entre l’autel et la maison de Yahweh
  rationale: La répétition de מִבֵּין précise le lieu d’où l’autel de bronze fut retiré. L’ajout léger de « l’endroit situé » rend la syntaxe française fluide sans ajouter de contenu.
- source_word: וַיִּתֵּן אֹתוֹ
  choice: et le plaça
  rationale: נתן signifie ici mettre ou placer un objet. « Plaça » convient au registre narratif et à l’action physique.
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפוֹנָה
  choice: sur le côté nord de l’autel
  rationale: יֶרֶךְ désigne le côté ou le flanc, et צָפוֹנָה indique la direction du nord. La formulation choisie est précise et idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom personnel d’alliance sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction conserve « maison » pour בַּיִת tout en clarifiant son sens cultuel en note. « Déplaça » rend le mouvement contextuel sans reproduire maladroitement le sens littéral « fit approcher ».
