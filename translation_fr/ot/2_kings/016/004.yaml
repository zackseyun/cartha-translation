  yaml_path: translation/ot/2_kings/016/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: fr
  text: Il offrit des sacrifices et brûla de l’encens sur les hauts lieux, sur les collines et sous tout arbre verdoyant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous tout arbre feuillu » ou « sous tout arbre luxuriant ». L’adjectif hébreu peut décrire ce qui est vert, frais ou luxuriant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: Il offrait des sacrifices
  rationale: Le verbe זבח désigne l’action d’offrir un sacrifice. Cette formulation est naturelle en français moderne et conserve la valeur cultuelle du verbe.
- source_word: וַיְקַטֵּר
  choice: faisait brûler de l’encens
  rationale: Dans ce contexte cultuel, le piel de קטר peut désigner l’action de faire fumer une offrande, notamment de brûler de l’encens. La traduction retenue correspond à la formule récurrente des livres des Rois sans expliciter davantage que l’hébreu.
- source_word: בַּבָּמוֹת
  choice: sur les hauts lieux
  rationale: במות désigne des sites cultuels locaux, souvent situés en hauteur. « Hauts lieux » est le terme biblique français établi et maintient leur caractère de lieux de culte.
- source_word: וְעַל הַגְּבָעוֹת
  choice: sur les collines
  rationale: גבעות désigne des collines. Une traduction distincte de « hauts lieux » préserve la différence entre les sites cultuels et le relief topographique.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: et sous tout arbre verdoyant
  rationale: רענן peut qualifier ce qui est vert, frais, feuillu ou luxuriant. « Verdoyant » garde l’image concrète et l’expression biblique tout en restant naturelle en français.
theological_decisions:
- issue: Rendu de la formule relative au culte illicite
  choice: 'Conserver les actions et les lieux concrets : « offrait des sacrifices et faisait brûler de l’encens sur les hauts lieux, sur les collines et sous tout arbre verdoyant »'
  alternative: Expliciter par une formulation comme « pratiquait un culte païen dans des sanctuaires »
  rationale: Le verset énumère des gestes et des lieux sans employer ici un qualificatif tel que « païen ». Le rendu retenu laisse au contexte le soin de porter l’évaluation négative et n’ajoute aucune interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait rend naturellement la série d’actions habituelles décrites dans ce contexte narratif. La coordination hébraïque est conservée sans alourdir la phrase.
