  text: וְ/אֶת מיסך הַ/שַּׁבָּ֜ת אֲשֶׁר בָּנ֣וּ בַ/בַּ֗יִת וְ/אֶת מְב֤וֹא הַ/מֶּ֨לֶךְ֙ הַֽ/חִיצ֔וֹנָ/ה הֵסֵ֖ב בֵּ֣ית יְהוָ֑ה מִ/פְּנֵ֖י מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/018.yaml
  text: And the covered way for the Sabbath that they had built in the house[a], and the outer entrance of the king[d][c][b], he turned away from the house of Yahweh because of the king of Assyria.
translation:
  language: fr
  text: Il retira de la maison de Yahweh le passage couvert pour le sabbat qu’ils avaient construit dans la maison[a], ainsi que l’entrée extérieure du roi[b], à cause du roi d’Assyrie[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la structure couverte du sabbat », « le pavillon du sabbat » ou « le portique du sabbat ». Le sens architectural exact du terme hébreu est incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’entrée extérieure réservée au roi » ou « la voie d’accès extérieure du roi ».
    reason: lexical_alternative
  - marker: d
    text: Ou « en raison du roi d’Assyrie » ; peut-être « par crainte du roi d’Assyrie ».
    reason: alternative_reading
lexical_decisions:
- source_word: מיסך הַשבת
  choice: le passage couvert du sabbat
  rationale: מיסך est un terme architectural rare et de sens incertain, qui paraît désigner une structure couverte associée au sabbat. « Passage couvert » reste intelligible sans préciser indûment sa forme.
- source_word: אֲשֶׁר בָּנוּ בַבַּיִת
  choice: qu’ils avaient construit dans la Maison
  rationale: La traduction conserve la proposition relative et le sujet pluriel non identifié de בָּנוּ. La majuscule à « Maison » indique ici le sanctuaire tout en maintenant l’image hébraïque.
- source_word: מְבוֹא הַמֶּלֶךְ הַחִיצוֹנָה
  choice: l’entrée extérieure du roi
  rationale: מְבוֹא désigne une entrée ou une voie d’accès. La formulation conserve le rapport au roi et la qualification « extérieure » sans définir davantage l’aménagement.
- source_word: הֵסֵב
  choice: il les détourna
  rationale: Le hifil de סבב peut exprimer l’action de faire tourner, détourner, déplacer ou modifier. « Détourna » préserve cette latitude mieux que « supprima ».
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La formulation garde l’expression hébraïque בית יהוה et rend le nom divin יהוה par « Yahweh ».
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: à cause du roi d’Assyrie
  rationale: מִפְּנֵי peut marquer une cause ou une motivation devant une personne. « À cause de » demeure volontairement général et n’impose pas l’idée plus précise de peur.
theological_decisions:
- issue: Nature des changements apportés au sanctuaire et motivation d’Ahaz
  choice: 'Conserver une formulation peu interprétative : « détourna » et « à cause du roi d’Assyrie ».'
  alternative: « retira », « déplaça » ou « modifia » ; « par crainte du roi d’Assyrie ».
  rationale: Le texte établit une intervention liée au roi d’Assyrie, mais ne précise entièrement ni la modification architecturale ni le mobile psychologique d’Ahaz.
translation_notes:
  register: Français international moderne, digne et accessible. La dislocation des deux compléments avant le verbe reflète l’ordre marqué de l’hébreu tout en restant naturelle en français. « Maison » puis « maison de Yahweh » conserve l’image du sanctuaire ; les notes signalent les principales incertitudes architecturales et historiques.
