reference: 2 Kings 16:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֣ה הַ/יָּשָׁ֗ר בְּ/עֵינֵ֛י יְהוָ֥ה אֱלֹהָ֖י/ו כְּ/דָוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/002.yaml
  text: Ahaz was twenty years old when he began to reign[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh his God[b], as David his father had done.
translation:
  language: fr
  text: Ahaz avait vingt ans lorsqu’il devint roi, et il régna seize ans à Jérusalem. Il ne fit pas ce qui est droit aux yeux de Yahweh, son Dieu,[a] comme l’avait fait David, son père.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il ne fit pas ce qui est juste devant Yahweh, son Dieu. »'
    reason: Alternative lexicale pour הַיָּשָׁר בְּעֵינֵי, dont l’expression peut aussi se rendre par « ce qui est juste devant ».
  - marker: b
    text: Ici, « père » signifie ancêtre ou prédécesseur dynastique, et non père immédiat.
    reason: Précision culturelle et généalogique sur l’emploi royal du mot אָב.
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: avait vingt ans
  rationale: Cette expression rend naturellement en français l’idiome hébreu indiquant l’âge, sans reproduire littéralement « fils de vingt ans ».
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction situe l’âge d’Ahaz au moment de son accession au trône. Cette formulation est plus naturelle en français actuel que « lorsqu’il commença à régner ».
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe désigne l’exercice de la royauté et convient à la formule royale du passage.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: Le français emploie normalement la préposition « à » avec un nom de ville.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: Il ne fit pas ce qui est droit
  rationale: Cette formulation conserve l’évaluation morale caractéristique des livres des Rois tout en restant claire en français moderne.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: L’expression française correspond directement à l’idiome hébreu exprimant le point de vue selon lequel une conduite est évaluée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: Le suffixe masculin singulier renvoie à Ahaz et la formulation conserve la relation exprimée par l’hébreu.
- source_word: כְּדָוִד אָבִיו
  choice: comme l’avait fait David, son père
  rationale: Le verbe ajouté est implicitement repris de la proposition précédente. « Père » conserve le terme hébreu, dont la portée dynastique est précisée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel. « Yahweh » le rend explicitement sans le remplacer par un titre.
- issue: Sens de « David, son père »
  choice: Conserver « père » dans le texte et préciser son sens en note
  alternative: David, son ancêtre
  rationale: Dans ce contexte royal, « père » désigne un ancêtre dynastique et non le père immédiat d’Ahaz. Le maintien du terme préserve l’expression hébraïque, tandis que la note prévient une lecture généalogique erronée.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit historique écrit; « avait vingt ans » exprime naturellement l’âge au moment de l’accession. La formule « ce qui est droit aux yeux de » conserve la couleur de l’évaluation deutéronomiste sans devenir obscure.
