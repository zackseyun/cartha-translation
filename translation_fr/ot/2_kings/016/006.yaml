base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/006.yaml
  text: At that time Rezin king of Aram restored Elath to Aram[a], and drove the Judeans out of Elath[b]; and the Arameans came to Elath and have lived there to this day.
translation:
  language: fr
  text: À cette époque, Retsîn, roi d’Aram, rendit Élath[b] à Aram et chassa les Judéens d’Élath. Puis les Araméens[a] vinrent à Élath et y habitent encore aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu massorétique porte « les Araméens ». Certains interprètes et témoins anciens favorisent toutefois « les Édomites », lecture qui paraît mieux s’accorder avec le contexte et avec 2 Chroniques 28.17.
    reason: textual_variant
  - marker: b
    text: 'Le nom Élath apparaît ici sous deux formes légèrement différentes en hébreu : Élath et Éloth.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: rendit
  rationale: Le hifil de שוב exprime ici le fait de faire revenir Élath sous une autorité politique. « Rendit » traduit naturellement ce transfert sans ajouter davantage que le texte.
- source_word: אֵילַת / אֵילוֹת
  choice: Élath
  rationale: Le nom de lieu présente deux formes orthographiques dans le verset. « Élath » est retenu uniformément dans le texte français, et la variation hébraïque est signalée en note.
- source_word: לַאֲרָם
  choice: à Aram
  rationale: La préposition marque ici la destination ou le bénéficiaire du transfert de contrôle. Le nom propre biblique « Aram » est conservé plutôt que remplacé par « Syrie ».
- source_word: וַיְנַשֵּׁל
  choice: chassa de la ville
  rationale: Le verbe désigne l’éviction de personnes hors d’un lieu qu’elles occupaient. Cette formulation est claire et restitue la force de l’expulsion.
- source_word: הַיְהוּדִים
  choice: les Judéens
  rationale: Dans le cadre monarchique, le terme désigne les habitants ou ressortissants de Juda. « Judéens » évite une association anachronique avec un sens ethnoreligieux plus tardif de « Juifs ».
- source_word: וארמים
  choice: les Araméens
  rationale: Le texte massorétique vocalisé porte « Araméens ». La variante « Édomites », soutenue par certains témoins anciens et par le contexte, est conservée en note plutôt qu’introduite dans le texte principal.
- source_word: וַיֵּשְׁבוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: y habitent encore aujourd’hui
  rationale: L’expression hébraïque indique une installation qui se prolonge jusqu’au présent du narrateur. Le présent accompagné de « encore aujourd’hui » rend cet effet naturellement en français.
theological_decisions:
- issue: Difficulté textuelle concernant le peuple installé à Élath
  choice: Les Araméens vinrent alors à Élath
  alternative: Les Édomites vinrent alors à Élath
  rationale: La lecture du texte massorétique, « Araméens », gouverne le texte principal. La lecture « Édomites » est néanmoins importante, car elle est appuyée par certains témoins anciens et paraît mieux s’accorder avec le contexte historique ainsi qu’avec 2 Chroniques 28.17. La note préserve cette tension sans la résoudre silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. Les noms « Retsîn », « Aram » et « Élath » conservent leur forme biblique. La syntaxe reste proche du récit hébreu tout en évitant une répétition française maladroite de « Élath » dans la proposition centrale.
