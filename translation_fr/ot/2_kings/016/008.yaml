source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אָחָ֜ז אֶת הַ/כֶּ֣סֶף וְ/אֶת הַ/זָּהָ֗ב הַ/נִּמְצָא֙ בֵּ֣ית יְהוָ֔ה וּ/בְ/אֹֽצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֥ח לְ/מֶֽלֶךְ אַשּׁ֖וּר שֹֽׁחַד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/008.yaml
  text: Ahaz took the silver and the gold that was found in the house of Yahweh and in the treasuries of the king’s house[a], and sent it as a bribe to the king of Assyria.
translation:
  language: fr
  text: Ahaz prit l’argent et l’or qui se trouvaient dans la maison de Yahweh et dans les trésoreries du palais royal, et les envoya au roi d’Assyrie en guise de pot-de-vin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme tribut » ou « comme présent » ; le mot hébreu désigne habituellement un pot-de-vin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le passé simple convient au récit historique et rend directement le wayyiqtol de לקח.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: l’argent et l’or
  rationale: Cette formulation conserve les deux métaux précieux concrets; «argent» peut désigner ici l’argent métal ou les richesses en argent.
- source_word: הַנִּמְצָא
  choice: qui se trouvaient
  rationale: Le participe passif de מצא désigne ici ce qui était présent ou disponible dans ces lieux; le pluriel français s’accorde naturellement avec «l’argent et l’or».
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Rend littéralement «maison de YHWH» et conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: et dans les trésors du palais royal
  rationale: אֹצְרוֹת désigne des trésors ou dépôts; «palais royal» exprime naturellement en français la «maison du roi» dans ce contexte.
- source_word: וַיִּשְׁלַח
  choice: et les envoya
  rationale: Le pronom «les» reprend naturellement l’argent et l’or qui constituaient ensemble le paiement envoyé.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: au roi d’Assyrie
  rationale: Rendu idiomatique et direct de la construction hébraïque.
- source_word: שֹׁחַד
  choice: en pot-de-vin
  rationale: Le mot désigne couramment un paiement destiné à obtenir une faveur. «Pot-de-vin» garde sa nuance négative sans exclure ici la fonction politique d’un présent ou tribut.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; «Yahweh» conserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Nature du paiement שֹׁחַד
  choice: pot-de-vin
  alternative: tribut ou présent
  rationale: Le sens lexical ordinaire est négatif, mais le contexte diplomatique permet de comprendre le paiement comme un tribut ou un présent visant à gagner l’appui assyrien; la note maintient cette latitude.
translation_notes:
  register: Français international moderne, narratif et digne. «Maison de Yahweh» conserve l’image hébraïque, tandis que «palais royal» évite l’expression moins naturelle «maison du roi». Le marqueur [a] est placé immédiatement après le terme concerné.
