review_pass:
  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle : Ahaz prend l’argent et l’or disponibles dans la maison de Yahweh et les réserves royales, puis les fait parvenir au roi d’Assyrie. « Pot-de-vin » rend bien la valeur usuelle de שֹׁחַד, dont la nuance négative doit être conservée, tandis que la note signale correctement les possibilités contextuelles « tribut » et « présent ».'
  naturalness: « Les envoya en pot-de-vin » n’est pas idiomatique en français moderne. « Les envoya ... en guise de pot-de-vin » exprime naturellement la fonction de ces biens. « Dans les trésors du palais royal » est également peu naturel pour désigner des lieux de dépôt ; « dans les trésoreries du palais royal » est plus précis et fluide.
  terminology: « Yahweh » respecte le choix de rendre le tétragramme par le nom divin. « Maison de Yahweh » conserve l’expression hébraïque. « Trésoreries du palais royal » rend אֹצְרוֹת dans son sens de dépôts ou salles du trésor, sans effacer l’opposition entre la maison de Yahweh et la résidence royale.
  issues:
  - severity: medium
    issue: 'Construction française non idiomatique : « les envoya en pot-de-vin »'
    rationale: En français, un objet envoyé comme paiement corrupteur s’exprime naturellement par « envoyer ... en guise de pot-de-vin » ou « comme pot-de-vin », non par « en pot-de-vin ».
  - severity: low
    issue: « dans les trésors du palais royal » désigne maladroitement le lieu de conservation
    rationale: Le français comprend plus spontanément « trésors » comme les objets précieux eux-mêmes. « Trésoreries » rend mieux les אֹצְרוֹת, c’est-à-dire les dépôts ou salles du trésor.
  - severity: low
    issue: Alternatives de la note formulées de façon elliptique
    rationale: « En tribut » et « en présent » reproduisent la construction maladroite du texte. « Comme tribut » et « comme présent » sont idiomatiques et conservent la même information lexicale.
