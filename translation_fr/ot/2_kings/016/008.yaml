- from: Ahaz prit l’argent et l’or qui se trouvaient dans la maison de Yahweh et dans les trésors du palais royal, et les envoya en pot-de-vin[a] au roi d’Assyrie.
  to: Ahaz prit l’argent et l’or qui se trouvaient dans la maison de Yahweh et dans les trésoreries du palais royal, et les envoya au roi d’Assyrie en guise de pot-de-vin[a].
  rationale: La révision ne modifie pas le sens du verset. Elle corrige la construction française régissant « pot-de-vin », précise naturellement la fonction locative de « trésoreries » et harmonise la formulation des alternatives de note. Le marqueur demeure attaché au terme rendu par שֹׁחַד.
