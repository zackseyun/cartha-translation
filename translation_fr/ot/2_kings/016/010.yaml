base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/010.yaml
  text: Then King Ahaz went to meet Tiglath-pileser king of Assyria at Damascus, and he saw the altar that was at Damascus. And King Ahaz sent to Uriah the priest a model of the altar and its pattern, according to all its workmanship.
translation:
  language: fr
  text: Le roi Ahaz se rendit à Damas à la rencontre de Tiglath-Piléser, roi d’Assyrie. Il vit l’autel qui se trouvait à Damas, puis il envoya au prêtre Urie une représentation de l’autel et son plan, avec tous les détails de sa fabrication.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּמוּת
  choice: une représentation
  rationale: Le terme désigne une ressemblance ou une reproduction visuelle. « Représentation » reste assez large pour ne pas imposer l’idée d’une maquette matérielle.
- source_word: תַּבְנִיתוֹ
  choice: son plan
  rationale: Dans ce contexte architectural, le mot désigne la forme ou la configuration de l’autel; « plan » rend naturellement l’information technique transmise au prêtre.
- source_word: לְכָל מַעֲשֵׂהוּ
  choice: avec tous les détails de sa fabrication
  rationale: Cette formulation exprime l’exhaustivité indiquée par כָּל et le sens concret de מַעֲשֶׂה, ici la façon dont l’autel est réalisé.
