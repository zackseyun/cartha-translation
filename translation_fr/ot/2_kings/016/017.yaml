base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/017.yaml
  text: Then King Ahaz cut off the frames of the stands and removed the basin from them[c][b][a], and he took down the Sea from upon the bronze oxen that were under it and put it on a stone pavement.
translation:
  language: fr
  text: Le roi Ahaz coupa les encadrements des supports et en retira le bassin[a]. Il fit descendre la Mer[b] des bœufs de bronze[c] qui étaient sous elle et la posa sur un pavement de pierres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la cuve ». Le terme hébreu désigne un bassin servant aux ablutions dans le Temple.
    reason: lexical_alternative
  - marker: b
    text: « La Mer » est le nom du grand bassin fabriqué pour le Temple de Salomon (voir 1 Rois 7.23-26).
    reason: cross_reference
  - marker: c
    text: Ou « les taureaux de bronze ». Le terme hébreu peut désigner de manière générale des bovins; « bœufs » est la désignation usuelle dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַצֵּץ
  choice: découpa
  rationale: Le verbe קצץ exprime l’action de couper ou de retrancher. « Découpa » rend naturellement ici le démontage d’éléments des supports.
- source_word: הַמִּסְגְּרוֹת
  choice: les encadrements
  rationale: מִסְגְּרוֹת désigne les parties formant cadres ou bordures dans la description des supports du Temple. « Encadrements » reste neutre quant à leur fonction exacte.
- source_word: הַמְּכֹנוֹת
  choice: les supports
  rationale: Dans ce contexte, מְכֹנוֹת désigne les structures mobiles qui portaient les bassins. « Supports » est précis sans ajouter le détail des roues, absent de ce verset.
- source_word: וַיָּסַר מֵעֲלֵיהֶם וְאֶת הַכִּיּוֹר
  choice: et en retira le bassin
  rationale: La formulation française conserve le bassin au singulier comme dans le texte hébreu et rend מֵעֲלֵיהֶם par le pronom « en », dont l’antécédent est « les supports ».
- source_word: הַיָּם
  choice: la Mer
  rationale: La majuscule indique qu’il s’agit du nom donné au grand bassin du Temple, et non de la mer au sens géographique.
- source_word: הוֹרִד
  choice: descendit
  rationale: La forme causative de ירד signifie faire descendre. « Descendit » conserve cette image spatiale tout en convenant au démontage de l’objet.
- source_word: הַבָּקָר הַנְּחֹשֶׁת
  choice: les bovins de bronze
  rationale: בָּקָר est un terme collectif pouvant désigner des bovins sans préciser leur sexe. « Bovins » préserve cette généralité, contrairement à « bœufs » ou « taureaux ».
- source_word: אֲשֶׁר תַּחְתֶּיהָ
  choice: qui la soutenaient
  rationale: L’hébreu dit littéralement qu’ils étaient sous la Mer. Dans ce contexte architectural, « qui la soutenaient » exprime clairement leur position et leur fonction.
- source_word: וַיִּתֵּן אֹתוֹ
  choice: et la posa
  rationale: נתן indique ici la mise en place de la Mer. Le féminin « la » reprend naturellement « la Mer » en français.
- source_word: עַל מַרְצֶפֶת אֲבָנִים
  choice: sur un pavement de pierres
  rationale: מַרְצֶפֶת désigne une surface pavée. « Pavement de pierres » conserve explicitement le pluriel אֲבָנִים sans suggérer une plateforme surélevée.
