revisions:
- from: Le roi Ahaz découpa les encadrements des supports et en retira le bassin[a]. Il descendit la Mer[b] de dessus les bovins de bronze[c] qui la soutenaient et la posa sur un pavement de pierres.
  to: Le roi Ahaz coupa les encadrements des supports et en retira le bassin[a]. Il fit descendre la Mer[b] des bœufs de bronze[c] qui étaient sous elle et la posa sur un pavement de pierres.
  rationale: La révision remplace une explicitation interprétative par la relation spatiale exprimée dans l’hébreu, adopte « bœufs » comme terme français naturel dans ce contexte tout en conservant l’ambiguïté en note, et améliore la restitution du causatif de ירד.
  reviewer_model: gpt-5.6-terra
