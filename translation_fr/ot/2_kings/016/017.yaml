    text: « La Mer » est le nom du grand bassin fabriqué pour le Temple de Salomon (voir 1 Rois 7.23-26).
    reason: cross_reference
  - marker: c
    text: Ou « les taureaux de bronze ». Le terme hébreu peut désigner de manière générale des bovins; « bœufs » est la désignation usuelle dans ce contexte.
    reason: lexical_alternative
