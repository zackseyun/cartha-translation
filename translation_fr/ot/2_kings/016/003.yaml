source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/דֶ֖רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֤ם אֶת בְּנ/וֹ֙ הֶעֱבִ֣יר בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁ֨ר הוֹרִ֤ישׁ יְהוָה֙ אֹתָ֔/ם מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/003.yaml
  text: He walked in the way of the kings of Israel[a], and even made his son pass through the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: fr
  text: Il suivit la voie des rois d’Israël et fit même passer son fils par le feu[a], conformément aux pratiques abominables des nations que Yahweh avait chassées devant les fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « offrit son fils dans le feu ». L’hébreu dit littéralement « fit passer son fils par le feu », expression associée à un rite païen condamné.
    reason: Signaler une interprétation possible sans la substituer à l’expression plus précise du texte hébreu.
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Il suivit la voie
  rationale: L’expression hébraïque décrit une conduite ou un mode de vie. « Suivre la voie » conserve la métaphore tout en étant naturel en français moderne.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: Construction génitive directe désignant les souverains du royaume du Nord comme modèle de conduite répréhensible.
- source_word: וְגַם
  choice: et fit même
  rationale: « Même » rend la valeur emphatique et la progression vers une faute particulièrement grave.
- source_word: אֶת־בְּנוֹ
  choice: son fils
  rationale: Le texte hébreu emploie explicitement le singulier.
- source_word: הֶעֱבִיר בָּאֵשׁ
  choice: fit passer son fils par le feu
  rationale: Cette formulation conserve l’expression hébraïque traditionnelle sans déterminer au-delà du texte les modalités exactes du rite condamné.
- source_word: כְּתֹעֲבוֹת הַגּוֹיִם
  choice: conformément aux pratiques abominables des nations
  rationale: Le כְּ exprime ici la conformité ou l’imitation. « Pratiques abominables » communique naturellement le sens concret de תֹּועֵבוֹת dans ce contexte cultuel.
- source_word: אֲשֶׁר הוֹרִישׁ
  choice: que … avait chassées
  rationale: Le verbe désigne ici l’expulsion ou la dépossession des habitants du pays; le plus-que-parfait marque l’antériorité par rapport au règne d’Ahaz.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel représenté par le tétragramme plutôt que de lui substituer un titre.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: devant les fils d’Israël
  rationale: La formulation conserve l’image spatiale de l’expulsion ainsi que l’expression hébraïque traditionnelle « fils d’Israël ».
theological_decisions:
- issue: Faut-il expliciter הֶעֱבִיר בָּאֵשׁ comme un sacrifice d’enfant ?
  choice: Conserver dans le texte l’expression « fit passer son fils par le feu »
  alternative: « offrit son fils dans le feu » ou « brûla son fils dans le feu »
  rationale: Le contexte condamne clairement un rite païen, mais l’expression hébraïque ne précise pas à elle seule tous ses détails. La traduction principale préserve donc l’ambiguïté réelle, tandis que la note signale l’interprétation sacrificielle possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide tout en conservant les principales images hébraïques et la gravité du jugement porté sur ces pratiques.
