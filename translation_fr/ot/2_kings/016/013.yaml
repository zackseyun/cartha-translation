  text: וַ/יַּקְטֵ֤ר אֶת עֹֽלָת/וֹ֙ וְ/אֶת מִנְחָת֔/וֹ וַ/יַּסֵּ֖ךְ אֶת נִסְכּ֑/וֹ וַ/יִּזְרֹ֛ק אֶת דַּֽם הַ/שְּׁלָמִ֥ים אֲשֶׁר ל֖/וֹ עַל הַ/מִּזְבֵּֽחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/013.yaml
  text: And he burned his burnt offering and his grain offering[a], and he poured out his drink offering, and he threw the blood of the peace offerings that were his against the altar.
translation:
  language: fr
  text: Il brûla son holocauste et son offrande de céréales, versa sa libation et projeta contre l’autel le sang de ses sacrifices de communion[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de paix » ou « sacrifices de bien-être ». Le mot hébreu désigne une catégorie particulière de sacrifices (שְׁלָמִים).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: il brûla
  rationale: Dans ce contexte sacrificiel, le hifil de קטר désigne l’action de faire partir l’offrande en fumée sur l’autel. « Brûla » est naturel en français moderne tout en conservant l’action rituelle.
- source_word: עֹלָתוֹ
  choice: son holocauste
  rationale: עֹלָה est le terme sacrificiel usuel pour l’offrande entièrement consumée. « Holocauste » demeure le terme biblique français précis et courant dans ce contexte.
- source_word: מִנְחָתוֹ
  choice: son offrande de céréales
  rationale: Dans le vocabulaire cultuel, מִנְחָה désigne ici l’offrande faite de produits céréaliers plutôt qu’un don générique. Cette formulation est précise et compréhensible.
- source_word: וַיַּסֵּךְ אֶת נִסְכּוֹ
  choice: versa sa libation
  rationale: נסך désigne l’action rituelle de verser une offrande liquide, et נֶסֶךְ la libation elle-même. « Versa sa libation » rend l’expression avec concision et exactitude.
- source_word: וַיִּזְרֹק
  choice: projeta
  rationale: זרק exprime ici le geste de lancer le sang contre l’autel. « Projeta » conserve davantage la force du verbe que « aspergea », qui pourrait évoquer une fine aspersion.
- source_word: דַּם הַשְּׁלָמִים
  choice: le sang de ses sacrifices de communion
  rationale: שְׁלָמִים désigne une catégorie sacrificielle particulière. « Sacrifices de communion » est une expression française intelligible qui évoque le repas partagé associé à ces sacrifices, sans effacer les autres nuances possibles, signalées en note.
- source_word: אֲשֶׁר לוֹ
  choice: de ses sacrifices
  rationale: Le possessif français « ses » rend naturellement et sans surinterprétation la proposition hébraïque indiquant que ces sacrifices étaient les siens.
- source_word: עַל הַמִּזְבֵּחַ
  choice: contre l’autel
  rationale: Avec זרק dans le rite du sang, עַל décrit ici le sang projeté contre ou sur la paroi de l’autel. « Contre l’autel » fait clairement percevoir le geste physique.
theological_decisions:
- issue: Sens sacrificiel de שְׁלָמִים
  choice: sacrifices de communion
  alternative: sacrifices de paix ; sacrifices de bien-être
  rationale: Le terme hébreu peut être présenté sous plusieurs angles complémentaires. Le texte retient une désignation claire en français et la note préserve les principales autres analyses sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la succession rapide des gestes rituels de l’hébreu. « Libation » et « holocauste » sont des termes cultuels précis encore aisément reconnaissables ; la note explique seulement le terme dont l’équivalence française reste la plus discutée.
