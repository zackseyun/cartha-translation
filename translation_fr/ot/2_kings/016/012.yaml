  naturalness: Le français est sobre et naturel. « Monta sur l’autel » est un peu plus idiomatique et précis que « monta dessus », tout en gardant l'image concrète du texte.
  terminology: « Damas » et « autel » sont les termes établis. La note conserve correctement, sans l'imposer, l'interprétation selon laquelle la montée peut être une expression elliptique d'une action sacrificielle.
