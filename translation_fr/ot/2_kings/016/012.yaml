revisions:
- from: Quand le roi revint de Damas, il vit l’autel. Le roi s’approcha de l’autel et monta dessus[a].
  to: Quand le roi arriva de Damas, il vit l’autel. Le roi s’approcha de l’autel et monta sur l’autel[a].
  rationale: La révision remplace « revint » par « arriva », qui ne présuppose pas un retour et correspond au sens non marqué de וַיָּבֹא. Elle remplace aussi « dessus » par la formulation explicite « sur l’autel », plus naturelle dans ce contexte et plus transparente quant à l’antécédent du pronom hébreu. La note reste ancrée à la proposition finale et préserve l’alternative interprétative sans ajouter l'offrande au texte principal.
