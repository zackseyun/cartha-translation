  text: וַ/יָּבֹ֤א הַ/מֶּ֨לֶךְ֙ מִ/דַּמֶּ֔שֶׂק וַ/יַּ֥רְא הַ/מֶּ֖לֶךְ אֶת הַ/מִּזְבֵּ֑חַ וַ/יִּקְרַ֥ב הַ/מֶּ֛לֶךְ עַל הַ/מִּזְבֵּ֖חַ וַ/יַּ֥עַל עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/012.yaml
  text: When the king came from Damascus[a], the king saw the altar; and the king came near to the altar and went up on it.
translation:
  language: fr
  text: Quand le roi arriva de Damas, il vit l’autel. Le roi s’approcha de l’autel et monta sur l’autel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’approcha de l’autel et y fit une offrande ». Certains comprennent « monta sur l’autel » comme une manière abrégée de dire qu’il commença à y offrir des sacrifices, bien que l’hébreu décrive plus littéralement une montée sur l’autel.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא … מִדַּמֶּשֶׂק
  choice: revint de Damas
  rationale: Dans ce contexte narratif, le roi revient à Jérusalem après son séjour à Damas. « Revint de Damas » exprime naturellement le déplacement depuis Damas sans alourdir la phrase.
- source_word: הַמֶּלֶךְ
  choice: le roi / il
  rationale: Le titre est explicité au début et repris une fois dans la seconde phrase. Le pronom au milieu évite une répétition peu naturelle en français tout en gardant le roi comme acteur clairement mis en avant.
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה désigne ici la perception visuelle simple; « vit » conserve la brièveté de la narration.
- source_word: אֶת הַמִּזְבֵּחַ
  choice: l’autel
  rationale: « Autel » est l’équivalent français précis et usuel de מִזְבֵּחַ.
- source_word: וַיִּקְרַב … עַל הַמִּזְבֵּחַ
  choice: s’approcha de l’autel
  rationale: Avec קרב, la préposition עַל indique ici le mouvement vers l’autel. La tournure pronominale « s’approcha de » est naturelle en français.
- source_word: וַיַּעַל עָלָיו
  choice: monta dessus
  rationale: עלה suivi de עַל avec suffixe décrit le plus directement une montée sur l’autel. « Monta dessus » préserve ce sens concret sans introduire explicitement l’acte d’offrir, décrit au verset suivant.
theological_decisions:
- issue: וַיַּעַל עָלָיו décrit-il une montée physique ou, par ellipse, l’action d’offrir un sacrifice ?
  choice: 'montée physique : « monta dessus »'
  alternative: « y offrit un sacrifice » ou « y fit une offrande »
  rationale: Le sens le plus direct de עלה avec עַל est celui de monter sur quelque chose. La traduction conserve cette formulation, même inhabituelle, tandis qu’une note signale l’interprétation cultuelle possible sans l’imposer au texte.
translation_notes:
  register: Français moderne, sobre et narratif. La division en deux phrases allège la succession des verbes. La répétition hébraïque de « le roi » est partiellement conservée, mais remplacée une fois par « il » pour éviter une lourdeur artificielle. Le marqueur de note est placé sur l’expression réellement concernée.
