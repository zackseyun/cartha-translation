  text: אָ֣ז יַעֲלֶ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֧הוּ מֶֽלֶךְ יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם לַ/מִּלְחָמָ֑ה וַ/יָּצֻ֨רוּ֙ עַל אָחָ֔ז וְ/לֹ֥א יָכְל֖וּ לְ/הִלָּחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/005.yaml
  text: Then Rezin king of Aram and Pekah son of Remaliah[a], king of Israel, came up to Jerusalem for war, and they besieged Ahaz, but they were not able to fight against him.
translation:
  language: fr
  text: Alors Retsîn, roi d’Aram, et Péqah, fils de Remalia, roi d’Israël, montèrent à Jérusalem pour faire la guerre. Ils assiégèrent Ahaz, mais ne purent le combattre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la combattre », c’est-à-dire Jérusalem. Après « combattre », l’hébreu ne répète pas le complément.
    reason: Le complément de לְהִלָּחֵם n’est pas exprimé en hébreu. Il peut renvoyer à Ahaz, dernier référent masculin explicite, ou à Jérusalem, la ville assiégée; la note préserve cette ambiguïté.
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque la progression temporelle du récit de façon naturelle en français.
- source_word: יַעֲלֶה
  choice: montèrent
  rationale: Le verbe עלה désigne ici le mouvement militaire vers Jérusalem, ville située en hauteur; le pluriel français suit les deux souverains coordonnés.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Retsîn, roi d’Aram
  rationale: Le nom propre est translittéré selon un usage français courant, et « Aram » reproduit plus directement le terme ethnogéographique hébreu que « Syrie ».
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: et Péqah, fils de Remalia, roi d’Israël
  rationale: Cette formulation conserve le patronyme et l’apposition royale de l’hébreu dans un français clair.
- source_word: יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: à Jérusalem pour lui faire la guerre
  rationale: La destination et le but militaire sont exprimés naturellement; « lui » reprend Jérusalem sans ajouter un infinitif plus précis que l’expression hébraïque.
- source_word: וַיָּצֻרוּ עַל אָחָז
  choice: Ils assiégèrent Ahaz
  rationale: Dans un contexte militaire, צור על signifie mettre quelqu’un ou un lieu en état de siège; le complément explicite du texte est Ahaz.
- source_word: וְלֹא יָכְלוּ לְהִלָּחֵם
  choice: mais ne purent combattre contre lui
  rationale: La traduction conserve l’idée d’incapacité et le sens fondamental de לחם sans transformer explicitement le combat en victoire ou en prise de la ville. Le référent non répété en hébreu demeure signalé comme ambigu par une note.
