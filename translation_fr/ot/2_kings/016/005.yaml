  - severity: low
    issue: « pour lui faire la guerre » anticipe un complément non exprimé dans la formule hébraïque
    rationale: Le contexte rend Jérusalem très probable, mais « pour faire la guerre » conserve plus directement le caractère non spécifié de לַמִּלְחָמָה.
