review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement la progression narrative, les deux souverains, leur montée à Jérusalem dans un but guerrier et le siège d’Ahaz. Le complément de לְהִלָּחֵם demeure absent de l’hébreu; le rendre par « le » est une interprétation contextuellement plausible, à conserver avec une note signalant la possibilité que Jérusalem soit visée.
  naturalness: « Combattre contre lui » est compréhensible, mais lourd et peu idiomatique en français moderne. « Le combattre » est plus naturel. « Pour faire la guerre » rend le but militaire sans imposer inutilement Jérusalem comme complément de l’expression.
  terminology: « Retsîn », « Péqah », « Aram », « Israël » et « assiégèrent » sont cohérents avec un registre biblique moderne et une équivalence formelle raisonnable. « Ahaz » est conservé conformément au texte hébreu.
