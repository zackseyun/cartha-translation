source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אָחָ֜ז מַלְאָכִ֗ים אֶל תִּ֠גְלַת פְּלֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ לֵ/אמֹ֔ר עַבְדְּ/ךָ֥ וּ/בִנְ/ךָ֖ אָ֑נִי עֲלֵ֨ה וְ/הוֹשִׁעֵ֜/נִי מִ/כַּ֣ף מֶֽלֶךְ אֲרָ֗ם וּ/מִ/כַּף֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל הַ/קּוֹמִ֖ים עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/007.yaml
  text: So Ahaz sent messengers to Tiglath-pileser king of Assyria[a], saying, “I am your servant and your son. Come up and save me from the hand of the king of Aram and from the hand of the king of Israel[c][b], who are rising up against me.”
translation:
  language: fr
  text: 'Alors Achaz envoya des messagers à Tiglath-Piléser, roi d’Assyrie, pour lui dire : « Je suis ton serviteur et ton fils[a]. Monte et sauve-moi du pouvoir[b] du roi d’Aram[c] et du pouvoir du roi d’Israël, qui se dressent contre moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ces mots constituent une formule diplomatique de soumission ; on pourrait comprendre : « Je suis ton vassal et ton fils. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de la main » ; la main représente ici le pouvoir ou l’emprise.'
    reason: lexical_alternative
  - marker: c
    text: « Aram » est traditionnellement rendu par « Syrie ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Forme narrative courante du verbe שלח ; « envoya » convient naturellement au récit.
- source_word: מַלְאָכִים
  choice: messagers
  rationale: Dans ce contexte politique, le terme désigne des émissaires humains. « Messagers » reste précis sans surinterpréter leur fonction.
- source_word: תִּגְלַת פְּלֶסֶר
  choice: Tiglath-Piléser
  rationale: Transcription française actuelle et reconnaissable du nom royal assyrien.
- source_word: עַבְדְּךָ וּבִנְךָ
  choice: ton serviteur et ton fils
  rationale: La formulation littérale conserve les métaphores diplomatiques de soumission et de dépendance présentes dans l’hébreu.
- source_word: עֲלֵה
  choice: Monte
  rationale: L’impératif de עלה signifie « monter ». Le contexte indique une intervention militaire, sans qu’il soit nécessaire de l’expliciter dans le verbe.
- source_word: וְהוֹשִׁיעֵנִי
  choice: sauve-moi
  rationale: Le hifil de ישׁע exprime l’action de sauver ou de délivrer. Ici, le contexte lui donne un sens militaire et politique.
- source_word: מִכַּף
  choice: du pouvoir
  rationale: Littéralement « de la main de » ; en français actuel, « du pouvoir de » communique clairement l’idée d’emprise ou de domination.
- source_word: אֲרָם
  choice: Aram
  rationale: Le nom historique « Aram » suit directement l’hébreu et évite l’anachronisme possible de « Syrie ».
- source_word: הַקּוֹמִים עָלָי
  choice: qui se dressent contre moi
  rationale: Le participe exprime une hostilité en cours ; « se dressent contre moi » en conserve l’image et la valeur aspectuelle.
theological_decisions:
- issue: Langage diplomatique d’abaissement employé par Achaz
  choice: « ton serviteur et ton fils »
  alternative: « ton vassal » ou « ton vassal et ton fils »
  rationale: Le propos marque une soumission politique, mais l’hébreu emploie explicitement les images du serviteur et du fils. Les conserver évite de remplacer la rhétorique du texte par une terminologie politique technique.
- issue: Portée du verbe « sauver » dans cet appel
  choice: « sauve-moi »
  alternative: « délivre-moi » ou « secours-moi »
  rationale: Dans ce passage, le salut demandé est militaire et politique. « Sauve-moi » maintient néanmoins la continuité lexicale du verbe biblique sans lui imposer ici un sens spirituel.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond aux formes hébraïques singulières et à l’adresse personnelle au roi. La répétition de « du pouvoir du roi » reflète le parallélisme de la source, tandis que les notes préservent l’idiome concret et les principales possibilités lexicales.
