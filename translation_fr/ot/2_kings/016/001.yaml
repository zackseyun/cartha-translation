  text: In the seventeenth year of Pekah son of Remaliah, Ahaz son of Jotham, king of Judah, began to reign.
translation:
  language: fr
  text: La dix-septième année du règne de Péqah, fils de Remalia, Ahaz, fils de Jotam, devint roi de Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: La dix-septième année du règne de
  rationale: La formule hébraïque établit une synchronisation entre deux règnes. L’ajout explicatif « du règne de » exprime naturellement en français la valeur du complément introduit par לְ.
- source_word: לְפֶקַח בֶּן רְמַלְיָהוּ
  choice: de Péqah, fils de Remalia
  rationale: La préposition לְ désigne ici le roi dont on compte les années de règne; le patronyme est conservé dans une formulation française naturelle.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette formule d’accession, le verbe désigne l’entrée dans la royauté plutôt que la durée entière du règne. « Devint roi » est concis et idiomatique.
- source_word: אָחָז בֶּן יוֹתָם
  choice: Ahaz, fils de Jotam
  rationale: Les noms propres sont translittérés selon des formes françaises usuelles, et la filiation hébraïque est rendue directement.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Le titre en apposition précise le royaume sur lequel Ahaz accède à la royauté; intégré au prédicat français, il donne naturellement « devint roi de Juda ».
