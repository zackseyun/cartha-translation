  text: ו/יצו/הו הַ/מֶּֽלֶךְ אָ֠חָז אֶת אוּרִיָּ֨ה הַ/כֹּהֵ֜ן לֵ/אמֹ֗ר עַ֣ל הַ/מִּזְבֵּ֣חַ הַ/גָּד֡וֹל הַקְטֵ֣ר אֶת עֹֽלַת הַ/בֹּקֶר֩ וְ/אֶת מִנְחַ֨ת הָ/עֶ֜רֶב וְֽ/אֶת עֹלַ֧ת הַ/מֶּ֣לֶךְ וְ/אֶת מִנְחָת֗/וֹ וְ֠/אֵת עֹלַ֞ת כָּל עַ֤ם הָ/אָ֨רֶץ֙ וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֔ם וְ/כָל דַּ֥ם עֹלָ֛ה וְ/כָל דַּם זֶ֖בַח עָלָ֣י/ו תִּזְרֹ֑ק וּ/מִזְבַּ֧ח הַ/נְּחֹ֛שֶׁת יִֽהְיֶה לִּ֖/י לְ/בַקֵּֽר־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/015.yaml
  text: Then King Ahaz commanded Uriah the priest[a], saying, “On the great altar offer up the morning burnt offering and the evening grain offering, and the king’s burnt offering and his grain offering, and the burnt offering of all the people of the land and their grain offerings and their drink offerings; and throw on it all the blood of the burnt offering and all the blood of the sacrifice. But the bronze altar shall be for me to inquire by.”
translation:
  language: fr
  text: 'Le roi Ahaz donna cet ordre au prêtre Urie : « Sur le grand autel, fais monter en fumée l’holocauste du matin et l’offrande de céréales du soir, ainsi que l’holocauste du roi et son offrande de céréales, l’holocauste de tout le peuple du pays, leurs offrandes de céréales et leurs libations. Tu projetteras sur cet autel tout le sang de l’holocauste et tout le sang du sacrifice. Quant à l’autel de bronze, il me servira à consulter[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à examiner », « à inspecter » ou peut-être « à chercher une orientation ». L’expression hébraïque est difficile, et la fonction exacte qu’Ahaz réserve à l’autel de bronze demeure incertaine.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַוֵּהוּ הַמֶּלֶךְ אָחָז
  choice: Le roi Ahaz donna cet ordre
  rationale: Cette formulation française naturelle conserve la force d’autorité du verbe צוה et l’ordre usuel du titre royal et du nom.
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: au prêtre Urie
  rationale: Le nom est rendu sous sa forme française traditionnelle, et le titre est intégré naturellement au complément indirect.
- source_word: עַל הַמִּזְבֵּחַ הַגָּדוֹל
  choice: Sur le grand autel
  rationale: La traduction conserve la préposition spatiale et l’adjectif qui distingue cet autel de l’autel de bronze.
- source_word: הַקְטֵר
  choice: fais fumer
  rationale: Le hiphil de קטר décrit le fait de faire monter l’offrande en fumée sur l’autel; cette expression garde l’image concrète du texte source.
- source_word: עֹלַת הַבֹּקֶר
  choice: l’holocauste du matin
  rationale: « Holocauste » est le terme sacrificiel français établi pour עֹלָה, offrande entièrement consumée.
- source_word: מִנְחַת הָעֶרֶב
  choice: l’offrande de céréales du soir
  rationale: Dans ce contexte cultuel, מִנְחָה désigne une offrande alimentaire; « de céréales » est clair pour le lecteur moderne.
- source_word: עֹלַת הַמֶּלֶךְ וְאֶת מִנְחָתוֹ
  choice: l’holocauste du roi et son offrande de céréales
  rationale: La construction possessive et le renvoi du pronom au roi sont préservés.
- source_word: עֹלַת כָּל עַם הָאָרֶץ
  choice: l’holocauste de tout le peuple du pays
  rationale: La formulation traduit littéralement le collectif עַם הָאָרֶץ sans lui imposer ici un sens social spécialisé.
- source_word: מִנְחָתָם וְנִסְכֵּיהֶם
  choice: leurs offrandes de céréales et leurs libations
  rationale: Les suffixes pluriels et les deux catégories d’offrandes sont maintenus; « libations » est le terme français précis pour les offrandes liquides.
- source_word: עָלָיו תִּזְרֹק
  choice: Tu projetteras sur cet autel
  rationale: זרק exprime une projection rituelle du sang plutôt qu’une légère aspersion; « cet autel » explicite sans ambiguïté le référent du pronom.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: l’autel de bronze
  rationale: Traduction directe qui distingue l’ancien autel du grand autel nouvellement installé.
- source_word: לְבַקֵּר
  choice: à consulter
  rationale: Cette traduction conserve une possible idée de consultation ou de recherche de direction tout en laissant la fonction exacte de l’autel indéterminée; l’incertitude est signalée en note.
theological_decisions:
- issue: Fonction réservée à l’autel de bronze dans l’expression לְבַקֵּר
  choice: il me servira à consulter
  alternative: il me servira à examiner / à inspecter / à rechercher une direction
  rationale: Le sens précis de l’expression est incertain. Le contexte peut évoquer une consultation cultuelle, mais le texte ne définit pas son procédé; la traduction évite donc de préciser une pratique divinatoire non explicitement nommée.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire sacrificiel établi (« holocauste », « offrande de céréales », « libations ») assure la précision sans archaïsme excessif. Le marqueur [a] est placé sur l’expression réellement concernée par la note.
