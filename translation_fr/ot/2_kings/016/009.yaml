    issue: « répondit favorablement à sa demande » interprète excessivement וַיִּשְׁמַע אֵלָיו.
    rationale: Le texte dit qu’il l’écouta ou lui prêta une écoute favorable, sans exprimer explicitement ni « demande » ni « réponse ». Une note peut signaler la nuance contextuelle responsive.
  - severity: low
    issue: « fit mettre à mort Recîn » introduit une médiation exécutive non requise.
    rationale: Le verbe hébreu permet simplement « tua Recîn »; cette formulation est plus directe et ne spécifie pas le mode de mise à mort.
