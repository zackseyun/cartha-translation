base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/009.yaml
  text: So the king of Assyria listened to him[a], and the king of Assyria went up against Damascus and captured it, and he deported its people to Kir[b], and he put Rezin to death.
translation:
  language: fr
  text: Le roi d’Assyrie l’écouta[a]. Il marcha contre Damas, s’en empara, déporta ses habitants à Qir[b] et tua Recîn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui accorda une écoute favorable ». Le verbe hébreu peut désigner une écoute qui entraîne une action.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la déporta à Qir » ; la ville désigne ici ses habitants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: répondit favorablement à sa demande
  rationale: 'שׁמע avec אֶל exprime ici une écoute suivie d’effet : le roi d’Assyrie donne suite à l’appel d’Ahaz. Cette formulation française rend l’action responsive sans suggérer une obéissance hiérarchique.'
- source_word: מֶלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: Traduction directe de la chaîne construite. La seconde occurrence est reprise par « Il » afin d’éviter une répétition lourde en français tout en gardant le même sujet clairement identifiable.
- source_word: וַיַּעַל ... אֶל דַּמֶּשֶׂק
  choice: Il marcha contre Damas
  rationale: Dans ce récit militaire, עלה suivi de אֶל désigne une avancée hostile. « Marcha contre » exprime clairement l’expédition militaire.
- source_word: וַיִּתְפְּשֶׂהָ
  choice: s’en empara
  rationale: תפשׂ indique ici la prise de contrôle de la ville. Le pronom « en » renvoie naturellement à Damas en français.
- source_word: וַיַּגְלֶהָ קִירָה
  choice: déporta ses habitants à Qir
  rationale: Le suffixe hébreu renvoie formellement à Damas, la ville représentant ses habitants par métonymie. La traduction explicite cette population, seul objet naturel du verbe « déporter » en français.
- source_word: קִירָה
  choice: Qir
  rationale: Le nom de lieu קִיר est translittéré selon une graphie française courante, et le suffixe directionnel est rendu par « à ».
- source_word: וְאֶת רְצִין הֵמִית
  choice: et fit mettre à mort Recîn
  rationale: Le hifil המית signifie « faire mourir ». « Fit mettre à mort » conserve cette valeur causative et convient à l’exécution d’un roi vaincu.
theological_decisions: []
