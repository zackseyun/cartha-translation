base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/011.yaml
  text: So Uriah the priest built the altar[a], according to all that King Ahaz had sent from Damascus; thus Uriah the priest did, until King Ahaz came from Damascus.
translation:
  language: fr
  text: Le prêtre Ourie construisit l’autel conformément à tout ce que le roi Ahaz avait envoyé de Damas. Le prêtre Ourie fit ainsi[a], jusqu’à ce que le roi Ahaz arrive de Damas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ainsi fit le prêtre Ourie ». L’expression souligne sa conformité à ce que le roi Ahaz avait envoyé.'
    reason: Cette note explicite l’idiome hébreu כֵּן עָשָׂה sans modifier la nuance temporelle exprimée dans le texte principal.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: construisit
  rationale: Le verbe בנה désigne normalement l’action de bâtir ou de construire. « Construisit » convient naturellement à la fabrication d’un autel.
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: le prêtre Ourie
  rationale: כהן signifie « prêtre ». L’apposition répétée dans l’hébreu est conservée aux deux endroits pour maintenir l’insistance du texte.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: מזבח est le terme courant pour un autel, et l’article défini est conservé.
- source_word: כְּכֹל אֲשֶׁר
  choice: conformément à tout ce que
  rationale: La construction exprime une conformité complète au modèle ou aux indications transmis par Ahaz.
- source_word: שָׁלַח
  choice: avait envoyé
  rationale: Le plus-que-parfait indique clairement que l’envoi depuis Damas précédait la construction de l’autel, sans préciser au-delà du texte ce qui avait été envoyé.
- source_word: מִדַּמֶּשֶׂק
  choice: de Damas
  rationale: La préposition מִן indique ici la provenance; « de Damas » est idiomatique dans les deux occurrences.
- source_word: כֵּן עָשָׂה
  choice: fit exactement ainsi
  rationale: L’expression souligne qu’Ourie se conforma aux indications d’Ahaz. « Exactement » rend cette insistance tout en gardant le tour démonstratif « ainsi ».
- source_word: עַד בּוֹא
  choice: avant que … ne revienne
  rationale: Avec l’infinitif בוא, עַד situe ici l’exécution par rapport à l’arrivée du roi. Cette formulation française exprime naturellement que l’ouvrage fut réalisé avant son retour; la note conserve la forme plus littérale et sa nuance temporelle.
- source_word: הַמֶּלֶךְ אָחָז
  choice: le roi Ahaz
  rationale: Cette formulation correspond naturellement en français au titre suivi du nom propre.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition de « le prêtre Ourie » est volontairement maintenue, comme dans l’hébreu. « Revienne de Damas » est plus naturel que « vienne de Damas » dans ce contexte de retour du roi.
