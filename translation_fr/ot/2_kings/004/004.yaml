  text: וּ/בָ֗את וְ/סָגַ֤רְתְּ הַ/דֶּ֨לֶת֙ בַּעֲדֵ֣/ךְ וּ/בְעַד בָּנַ֔יִ/ךְ וְ/יָצַ֕קְתְּ עַ֥ל כָּל הַ/כֵּלִ֖ים הָ/אֵ֑לֶּה וְ/הַ/מָּלֵ֖א תַּסִּֽיעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/004.yaml
  text: Then go in and shut the door behind yourself and behind your sons[a], and pour into all these containers[b]; and set aside the full ones.
translation:
  language: fr
  text: Puis rentre, ferme la porte derrière toi et tes fils, et verse dans tous ces récipients[a] ; quand l’un est plein, mets-le de côté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ces ustensiles ». Le terme hébreu est large et peut désigner diverses sortes d’objets ou de contenants.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et le plein, tu le déplaceras » ; autre traduction possible : « retire celui qui est plein ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאת
  choice: Puis rentre
  rationale: Dans ce contexte, בוא indique qu’elle doit entrer chez elle. « Rentre » est naturel en français puisque la maison est la sienne, et « puis » rend la succession des instructions portée par le waw.
- source_word: וְסָגַרְתְּ הַדֶּלֶת
  choice: ferme la porte
  rationale: סגר signifie fermer. Cette formulation directe et courante convient à une instruction.
- source_word: בַּעֲדֵךְ וּבְעַד בָּנַיִךְ
  choice: derrière toi et tes fils
  rationale: Avec une porte que l’on ferme, בעד exprime ici l’idée de laisser les personnes à l’intérieur tout en excluant les autres. « Derrière toi et tes fils » restitue naturellement l’image spatiale.
- source_word: וְיָצַקְתְּ עַל
  choice: et verse dans
  rationale: יצק signifie « verser » et, devant des récipients, le français emploie naturellement « verser dans ». Le complément « de l’huile » reste implicite comme dans l’hébreu.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: tous ces récipients
  rationale: כְּלִים est un terme large désignant ici les objets destinés à recevoir l’huile. « Récipients » est précis, actuel et moins restrictif que « jarres ».
- source_word: וְהַמָּלֵא
  choice: quand l’un est plein
  rationale: L’adjectif singulier déterminé signifie littéralement « le plein », c’est-à-dire le récipient plein. La formulation française exprime clairement sa valeur générique sans imposer un pluriel absent du texte.
- source_word: תַּסִּיעִי
  choice: mets-le de côté
  rationale: Le hiphil de נסע indique ici qu’il faut déplacer ou retirer le récipient rempli. « Mettre de côté » décrit naturellement l’action pratique attendue.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. L’impératif singulier féminin est rendu par les formes françaises non marquées « rentre », « ferme », « verse » et « mets ». La dernière proposition explicite légèrement la valeur générique du singulier hébreu afin d’éviter l’expression peu naturelle « le plein », tout en conservant le singulier.
