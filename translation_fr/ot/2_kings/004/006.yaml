  text: וַ/יְהִ֣י כִּ/מְלֹ֣את הַ/כֵּלִ֗ים וַ/תֹּ֤אמֶר אֶל בְּנָ/הּ֙ הַגִּ֨ישָׁ/ה אֵלַ֥/י עוֹד֙ כֶּ֔לִי וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אֵ֥ין ע֖וֹד כֶּ֑לִי וַֽ/יַּעֲמֹ֖ד הַ/שָּֽׁמֶן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/006.yaml
  text: And when the containers were full[a], she said to her son, “Bring me another container.” But he said to her[b], “There is not another container.” Then the oil stopped.
translation:
  language: fr
  text: 'Quand les récipients furent pleins[a], elle dit à son fils : « Apporte-moi encore un récipient. » Il lui répondit : « Il n’y en a plus. » Alors l’huile cessa de couler[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les vases » au lieu de « les récipients ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’huile s’arrêta » ou « l’huile se tint immobile ». Le sens est qu’elle cessa de couler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְלֹאת
  choice: Quand … furent pleins
  rationale: La préposition כְּ avec l’infinitif construit introduit ici une proposition temporelle. Cette formulation rend naturellement en français l’idée que le remplissage des récipients était achevé.
- source_word: הַכֵּלִים / כֶּלִי
  choice: les récipients / un récipient
  rationale: כְּלִי est un terme large désignant ici un objet destiné à contenir l’huile. « Récipient » reste précis dans le contexte sans imposer une forme particulière comme le ferait « jarre ».
- source_word: הַגִּישָׁה אֵלַי
  choice: Apporte-moi
  rationale: Le hifil impératif de נגשׁ signifie faire approcher ou présenter. Dans la scène, le fils doit apporter un récipient à sa mère ; « Apporte-moi » exprime cette action de façon idiomatique.
- source_word: עוֹד כֶּלִי
  choice: encore un récipient
  rationale: Avec le nom singulier, עוֹד désigne ici un récipient supplémentaire. « Encore un » conserve cette nuance sans ajouter d’emphase.
- source_word: אֵין עוֹד כֶּלִי
  choice: Il n’y en a plus
  rationale: אֵין exprime l’absence ou la non-existence. La reprise pronominale évite une répétition lourde tout en indiquant clairement qu’aucun autre récipient n’est disponible.
- source_word: וַיַּעֲמֹד הַשָּׁמֶן
  choice: Alors l’huile cessa de couler
  rationale: עמד signifie littéralement « se tenir, s’arrêter ». Dans ce contexte, il indique que l’écoulement miraculeux de l’huile prit fin ; cette formulation explicite sobrement le sens contextuel.
