reference: 2 Kings 4:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל אִישָׁ֔/הּ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים קָד֣וֹשׁ ה֑וּא עֹבֵ֥ר עָלֵ֖י/נוּ תָּמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/009.yaml
  text: And she said to her husband[a], “Look now, I know that this is a holy man of God who regularly passes by us.”
translation:
  language: fr
  text: 'Elle dit à son mari : « Vois, je sais que cet homme de Dieu qui passe régulièrement[a] chez nous est saint. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « constamment ».
    reason: Alternative lexicale pour תָּמִיד, qui peut souligner soit la régularité habituelle, soit la continuité répétée.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Elle dit
  rationale: Le wayyiqtol fait avancer le récit ; le passé simple convient à une narration française écrite, naturelle et digne.
- source_word: אֶל אִישָׁהּ
  choice: à son mari
  rationale: Dans ce contexte domestique, אִישׁ avec le suffixe féminin singulier désigne idiomatiquement son mari.
- source_word: הִנֵּה נָא
  choice: Vois
  rationale: L’impératif discursif attire avec douceur l’attention de l’interlocuteur. « Vois » garde cette fonction sans donner à נָא un sens temporel artificiel.
- source_word: יָדַעְתִּי
  choice: je sais
  rationale: Le parfait exprime ici une conviction désormais établie à partir d’observations répétées.
- source_word: אִישׁ אֱלֹהִים
  choice: homme de Dieu
  rationale: Cette expression est un titre reconnu pour un prophète ou un envoyé de Dieu ; sa forme traditionnelle conserve sa portée littéraire et théologique.
- source_word: קָדוֹשׁ הוּא
  choice: est saint
  rationale: Cette formulation conserve la sainteté comme prédicat de l’homme de Dieu, sans la réduire au sens plus vague de « pieux ».
- source_word: עֹבֵר עָלֵינוּ
  choice: qui passe … chez nous
  rationale: Dans ce contexte de déplacements répétés, l’expression décrit son passage par le lieu où habite le couple. « Chez nous » est idiomatique en français.
- source_word: תָּמִיד
  choice: régulièrement
  rationale: Le contexte indique une habitude récurrente plutôt qu’une action ininterrompue ; « régulièrement » rend clairement cette valeur.
theological_decisions:
- issue: Traduction du titre אִישׁ אֱלֹהִים
  choice: homme de Dieu
  alternative: homme pieux
  rationale: « Homme de Dieu » préserve le titre biblique d’un prophète ou envoyé divin, tandis que « homme pieux » transformerait le titre en simple description morale.
- issue: Rapport entre קָדוֹשׁ et אִישׁ אֱלֹהִים
  choice: cet homme de Dieu … est saint
  alternative: c’est un saint homme de Dieu
  rationale: La formulation retenue garde à la fois le titre « homme de Dieu » et la prédication explicite de sa sainteté, sans résoudre davantage la portée exacte de cette qualification.
translation_notes:
  register: Français international moderne, narratif et digne. « Vois » conserve la fonction d’appel à l’attention de הִנֵּה נָא ; « chez nous » rend naturellement le passage à proximité du domicile.
