base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/010.yaml
  text: Please let us make a small upper room on the wall[a], and let us put there for him a bed, a table, a chair, and a lampstand; and whenever he comes to us[b], he can turn in there.
translation:
  language: fr
  text: Faisons, je te prie, une petite chambre haute sur le mur[a], et mettons-y pour lui un lit, une table, une chaise et un porte-lampe. Ainsi, chaque fois qu’il viendra chez nous, il pourra y faire halte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une petite chambre haute avec un mur », ou simplement « une petite chambre haute ». L’expression hébraïque est très compacte, et la relation exacte entre la chambre et le mur reste incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « il pourra s’y arrêter ». Le verbe hébreu signifie souvent « se détourner » et désigne ici le fait de faire halte pour être hébergé.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשֶׂה נָּא
  choice: Faisons, je te prie
  rationale: Le cohortatif à la première personne du pluriel, accompagné de נָא, exprime une proposition formulée avec courtoisie. « Je te prie » convient à l’adresse de la femme à son mari.
- source_word: עֲלִיַּת קִיר קְטַנָּה
  choice: une petite chambre haute sur le mur
  rationale: עֲלִיָּה désigne une chambre à l’étage ou chambre haute, קִיר signifie littéralement « mur », et קְטַנָּה « petite ». La formulation conserve le caractère concret et compact de l’hébreu sans trancher silencieusement la relation architecturale exacte.
- source_word: וְנָשִׂים לוֹ שָׁם
  choice: et mettons-y pour lui
  rationale: שִׂים signifie « mettre, placer » et la forme poursuit la proposition volitive. Le pronom adverbial « y » rend naturellement שָׁם.
- source_word: מִטָּה
  choice: un lit
  rationale: Dans ce contexte d’hébergement, « lit » est l’équivalent moderne le plus direct.
- source_word: שֻׁלְחָן
  choice: une table
  rationale: Équivalent usuel et précis du meuble désigné.
- source_word: כִסֵּא
  choice: une chaise
  rationale: Le terme désigne un siège; « chaise » convient naturellement à cette liste de mobilier domestique.
- source_word: מְנוֹרָה
  choice: un porte-lampe
  rationale: Le mot désigne le support sur lequel on place une lampe plutôt que la lampe elle-même. « Porte-lampe » évite ici les connotations électriques modernes de « lampadaire ».
- source_word: וְהָיָה בְּבֹאוֹ אֵלֵינוּ
  choice: Ainsi, quand il viendra chez nous
  rationale: La tournure וְהָיָה introduit la circonstance ou le résultat envisagé. « Quand » préserve la lecture temporelle sans imposer une fréquence absente de la forme hébraïque.
- source_word: יָסוּר שָׁמָּה
  choice: il pourra s’y retirer
  rationale: סוּר signifie fondamentalement « se détourner, se retirer » et peut désigner une halte chez quelqu’un. Cette traduction garde l’image verbale tout en restant naturelle dans le contexte.
theological_decisions: []
translation_notes:
