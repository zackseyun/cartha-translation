  naturalness: Le français est globalement naturel, sobre et adapté au dialogue. « Il pourra y faire halte » est plus idiomatique et contextuellement clair que « il pourra s’y retirer ».
  terminology: « Chambre haute », « lit », « table », « chaise » et « porte-lampe » conviennent au contexte. Le terme « porte-lampe » maintient la distinction entre la lampe et son support sans introduire l’anachronisme possible de « lampadaire ».
