  text: וַ/יֹּ֣אמֶר ל֗/וֹ אֱמָר נָ֣א אֵלֶי/הָ֮ הִנֵּ֣ה חָרַ֣דְתְּ אֵלֵי/נוּ֮ אֶת כָּל הַ/חֲרָדָ֣ה הַ/זֹּאת֒ מֶ֚ה לַ/עֲשׂ֣וֹת לָ֔/ךְ הֲ/יֵ֤שׁ לְ/דַבֶּר לָ/ךְ֙ אֶל הַ/מֶּ֔לֶךְ א֖וֹ אֶל שַׂ֣ר הַ/צָּבָ֑א וַ/תֹּ֕אמֶר בְּ/ת֥וֹךְ עַמִּ֖/י אָנֹכִ֥י יֹשָֽׁבֶת־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/013.yaml
  text: And he said to him[a], “Please say to her, ‘Look, you have taken all this trouble for us. What is to be done for you? Is there anything to be spoken for you to the king or to the commander of the army?’” And she said[c][b], “I am living among my own people.”
translation:
  language: fr
  text: 'Il lui dit : « Dis-lui, je te prie : “Tu t’es donné toute cette peine pour nous[a]. Que faire pour toi ? Y a-t-il quelque chose à dire en ta faveur au roi ou au chef de l’armée[b] ?” » Elle répondit : « Je vis au milieu de mon peuple[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tu as tremblé pour nous de toute cette inquiétude ». Il s’agit ici d’une expression évoquant les soins empressés et toute la peine qu’elle s’est donnée.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « Y a-t-il quelque chose à dire en ton nom au roi ou au chef de l’armée ? »'
    reason: lexical_alternative
  - marker: c
    text: Cette réponse indique vraisemblablement qu’elle est établie au sein de sa communauté et ne demande pas l’appui particulier des autorités royales ou militaires.
    reason: cultural_note
lexical_decisions:
- source_word: חָרַדְתְּ / חֲרָדָה
  choice: tu t’es donné toute cette peine
  rationale: Le verbe et le nom apparenté évoquent littéralement le tremblement, l’inquiétude ou l’empressement. Dans ce contexte d’hospitalité, la tournure idiomatique désigne les soins attentifs et les grands efforts de la femme.
- source_word: הִנֵּה
  choice: omis explicitement
  rationale: La particule attire l’attention sur ce qui suit. En français actuel, l’emphase est naturellement portée par la construction elle-même; « voici » ou « regarde » serait ici plus lourd et moins idiomatique.
- source_word: מֶה לַעֲשׂוֹת לָךְ
  choice: Que faire pour toi ?
  rationale: Cette formulation concise conserve l’infinitif et laisse l’agent implicite, comme l’hébreu, tout en restant naturelle en français.
- source_word: הֲיֵשׁ לְדַבֶּר לָךְ
  choice: Faut-il parler en ta faveur
  rationale: La tournure exprime l’idée de prendre la parole pour elle, c’est-à-dire d’intervenir ou de présenter une requête en son nom, sans préciser davantage la nature de cette intervention.
- source_word: שַׂר הַצָּבָא
  choice: chef de l’armée
  rationale: שַׂר désigne ici le haut responsable militaire. « Chef de l’armée » est clair, actuel et suffisamment général.
- source_word: בְּתוֹךְ עַמִּי אָנֹכִי יֹשָׁבֶת
  choice: Je vis au milieu des miens
  rationale: La formulation rend à la fois l’appartenance communautaire exprimée par « mon peuple » et le fait d’y être établie, sans expliciter dans le texte une sécurité ou un contentement seulement implicites.
- source_word: נָא
  choice: je te prie
  rationale: La particule adoucit l’impératif. « Je te prie » convient au registre narratif digne et évite la tonalité parfois trop familière de « s’il te plaît ».
