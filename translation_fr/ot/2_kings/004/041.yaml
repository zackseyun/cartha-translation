base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/041.yaml
  text: Then he said[a], “Bring some flour.” And he threw it into the pot and said, “Pour it out for the people[b], so that they may eat.” And there was nothing harmful in the pot.
translation:
  language: fr
  text: 'Puis il dit : « Apportez de la farine. » Il la jeta dans la marmite, puis dit : « Servez-en au peuple, afin qu’ils mangent. » Et il n’y avait rien de nocif dans la marmite.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’y avait pas de chose mauvaise dans la marmite » ; dans ce contexte, il s’agit de l’absence de tout élément nocif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ קֶמַח
  choice: Apportez de la farine
  rationale: L’impératif pluriel de לקח peut signifier « prendre » ou, selon la situation, « apporter ». Ici, Élisée demande qu’on lui procure de la farine pour la mettre aussitôt dans la marmite.
- source_word: וַיַּשְׁלֵךְ אֶל הַסִּיר
  choice: Il la jeta dans la marmite
  rationale: שלך signifie couramment « jeter ». Le pronom « la » reprend naturellement « la farine », tandis que « marmite » désigne clairement le récipient de cuisson.
- source_word: צַק לָעָם
  choice: Servez-en au peuple
  rationale: יצק signifie littéralement « verser », mais désigne ici l’action de distribuer le contenu de la marmite. « Servez-en » conserve l’image d’un mets liquide tout en restant naturel en français.
- source_word: וְיֹאכֵלוּ
  choice: afin qu’ils mangent
  rationale: Cette formulation rend la valeur de but ou de résultat de la proposition coordonnée à l’impératif.
- source_word: וְלֹא הָיָה דָבָר רָע בַּסִּיר
  choice: Et il n’y avait plus rien de nocif dans la marmite
  rationale: דָבָר רָע signifie littéralement « chose mauvaise ». Dans le contexte du ragoût dangereux, « rien de nocif » exprime le sens concret sans suggérer un mal moral. « Plus » explicite naturellement la disparition du danger antérieurement constaté.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. « Marmite » convient au récipient de cuisson du contexte ; « servez-en » traduit idiomatiquement l’acte de verser et de distribuer le ragoût. Le marqueur de note est placé après la proposition qu’il explique.
