base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/033.yaml
  text: He went in and shut the door behind the two of them[a], and prayed to Yahweh.
translation:
  language: fr
  text: Il entra, ferma la porte derrière eux deux[a] et pria Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « ferma la porte sur eux deux », c’est-à-dire qu’Élisée et l’enfant restèrent seuls dans la pièce.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Il entra
  rationale: Le wayyiqtol de בוא poursuit la narration et décrit l’entrée d’Élisée dans la pièce. « Il entra » est naturel et digne en français.
- source_word: וַיִּסְגֹּר הַדֶּלֶת
  choice: ferma la porte
  rationale: סגר signifie fermer; avec דלת, « ferma la porte » est l’expression française courante.
- source_word: בְּעַד שְׁנֵיהֶם
  choice: sur eux deux
  rationale: Avec le verbe « fermer », בְּעַד peut indiquer que la porte est fermée sur les personnes restées à l’intérieur. Cette formulation conserve l’image hébraïque et l’ambiguïté spatiale, tandis que la note explicite le sens contextuel.
- source_word: וַיִּתְפַּלֵּל
  choice: et pria
  rationale: Le hitpael de פלל signifie ici « prier ». Le passé simple convient à la succession d’actions dans ce récit.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: La préposition אֶל marque le destinataire de la prière; en français, celui-ci suit directement « prier ». Le nom divin יהוה est rendu par « Yahweh » conformément à la décision terminologique fournie.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le Tétragramme. « Yahweh » préserve ici le nom propre, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple maintient le registre digne du récit biblique sans vocabulaire archaïque.
