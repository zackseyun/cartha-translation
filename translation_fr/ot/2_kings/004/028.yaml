  text: וַ/תֹּ֕אמֶר הֲ/שָׁאַ֥לְתִּי בֵ֖ן מֵ/אֵ֣ת אֲדֹנִ֑/י הֲ/לֹ֣א אָמַ֔רְתִּי לֹ֥א תַשְׁלֶ֖ה אֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/028.yaml
  text: She said[a], “Did I ask my lord for a son? Did I not say, ‘Do not deceive me’?”
translation:
  language: fr
  text: 'Elle dit : « Ai-je demandé un fils à mon seigneur ? N’ai-je pas dit : “Ne me trompe pas[a]” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne me donne pas de faux espoirs ». Le verbe hébreu peut signifier induire quelqu’un en erreur; ici, il évoque l’espoir suscité par la promesse d’un fils, espoir qui semble maintenant avoir été déçu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Elle dit
  rationale: Le waw narratif fait avancer le récit et introduit la parole. En français naturel, la conjonction peut être omise sans perte de sens.
- source_word: הֲשָׁאַלְתִּי
  choice: Ai-je demandé
  rationale: La particule interrogative introduit une question rhétorique portant sur une demande antérieure. Le passé composé convient au français narratif moderne.
- source_word: בֵן
  choice: un fils
  rationale: Le nom hébreu désigne précisément un fils, et non simplement un enfant.
- source_word: מֵאֵת אֲדֹנִי
  choice: à mon seigneur
  rationale: Avec le verbe « demander », le français idiomatique emploie « demander quelque chose à quelqu’un ». « Mon seigneur » est ici une formule respectueuse adressée à Élisée, non un titre divin.
- source_word: הֲלֹא אָמַרְתִּי
  choice: N’ai-je pas dit
  rationale: Cette seconde question rhétorique rappelle les paroles antérieures de la femme. La traduction reste proche du verbe hébreu « dire » sans expliciter inutilement le destinataire.
- source_word: לֹא תַשְׁלֶה אֹתִי
  choice: Ne me trompe pas
  rationale: Le hifil de שלה exprime ici l’idée d’induire quelqu’un en erreur ou de le bercer d’une attente qui risque d’être déçue. « Ne me trompe pas » est direct, naturel et conserve la portée générale du verbe; la nuance contextuelle des faux espoirs est signalée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Les deux questions rhétoriques sont conservées, ainsi que l’adresse respectueuse « mon seigneur ». Les guillemets emboîtés distinguent la parole présente de la citation de ses paroles antérieures.
