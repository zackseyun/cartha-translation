  yaml_path: translation/ot/2_kings/004/036.yaml
  text: Then he called Gehazi and said[a], “Call this Shunammite woman.” So he called her, and she came to him. Then he said, “Take up your son.”
translation:
  language: fr
  text: 'Puis Élisée appela Guéhazi et lui dit : « Appelle cette Sunamite[a]. » Guéhazi l’appela, et elle vint vers Élisée. Il lui dit : « Prends ton fils. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « cette femme de Sunem ». L’hébreu emploie un gentilé féminin : littéralement « cette Sunamite ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל גֵּיחֲזִי
  choice: Puis Élisée appela Guéhazi
  rationale: Le sujet implicite est Élisée, clairement établi par le contexte. « Puis » rend naturellement la progression narrative du wayyiqtol, et « appela » traduit directement קרא.
- source_word: קְרָא
  choice: Appelle
  rationale: L’impératif de קרא signifie ici appeler ou faire venir quelqu’un. « Appelle » reste direct et naturel.
- source_word: הַשֻּׁנַמִּית הַזֹּאת
  choice: cette Sunamite
  rationale: Le gentilé féminin désigne la femme originaire de Sunem. « Cette Sunamite » conserve à la fois le démonstratif et la forme concise de l’hébreu.
- source_word: וַיִּקְרָאֶהָ
  choice: Guéhazi l’appela
  rationale: La répétition explicite de קרא est conservée. Le nom « Guéhazi » remplace le pronom implicite afin d’éviter toute ambiguïté naturelle en français.
- source_word: וַתָּבוֹא אֵלָיו
  choice: elle vint vers Élisée
  rationale: בוא + אֶל exprime le mouvement vers une personne. Le nom « Élisée » explicite le référent du pronom hébreu et évite de laisser croire qu’elle vient vers Guéhazi.
- source_word: שְׂאִי
  choice: Prends
  rationale: L’impératif féminin singulier de נשׂא peut signifier soulever, prendre ou emporter. Dans ce contexte, « Prends » est naturel et laisse le geste précis au contexte.
- source_word: בְנֵךְ
  choice: ton fils
  rationale: בן avec le suffixe féminin singulier signifie précisément « ton fils ».
theological_decisions: []
