base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/008.yaml
  text: And one day Elisha passed through Shunem[a], where there was a prominent woman, and she urged him to eat bread. So whenever he passed by[b], he would turn in there to eat bread.
translation:
  language: fr
  text: Un jour, Élisée passa par Shounem. Il y avait là une femme notable[a], qui insista pour qu’il prenne un repas[b]. Par la suite, chaque fois qu’il passait par là, il s’y arrêtait pour prendre un repas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une grande femme » ; l’expression renvoie probablement à son rang social ou à ses moyens.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « manger du pain », expression qui peut désigner le fait de prendre un repas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Un jour
  rationale: Cette formule ouvre un nouvel épisode du récit. « Un jour » en restitue naturellement la valeur temporelle en français moderne.
- source_word: וַיַּעֲבֹר אֱלִישָׁע אֶל שׁוּנֵם
  choice: Élisée passa par Shounem
  rationale: Dans ce contexte de déplacement, עבר indique qu’Élisée passe par cette localité. « Shounem » transcrit le nom hébreu du lieu.
- source_word: אִשָּׁה גְדוֹלָה
  choice: une femme importante
  rationale: L’expression désigne vraisemblablement une femme jouissant d’un rang social élevé ou de moyens considérables. « Importante » préserve cette relative ouverture sans réduire le sens à la seule richesse.
- source_word: וַתַּחֲזֶק בּוֹ
  choice: elle insista
  rationale: L’expression évoque littéralement une action ferme sur quelqu’un et, dans ce contexte d’hospitalité, signifie qu’elle pressa Élisée d’accepter son invitation.
- source_word: לֶאֱכָל לָחֶם
  choice: prendre un repas
  rationale: Littéralement « manger du pain », expression où « pain » désigne par métonymie la nourriture ou le repas. « Prendre un repas » transmet clairement l’usage idiomatique en français.
- source_word: מִדֵּי עָבְרוֹ
  choice: chaque fois qu’il passait par là
  rationale: La construction exprime une action répétée à chacune de ses traversées.
- source_word: יָסֻר שָׁמָּה
  choice: il s’arrêtait chez elle
  rationale: סור exprime ici le fait de se détourner de son trajet pour entrer ou faire halte. Le contexte montre que l’arrêt avait lieu chez cette femme.
