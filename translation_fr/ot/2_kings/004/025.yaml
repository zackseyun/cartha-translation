base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/025.yaml
  text: So she went and came to the man of God at Mount Carmel. And when the man of God saw her from a distance[a], he said to Gehazi his servant, “Look, that Shunammite woman.”
translation:
  language: fr
  text: 'Elle partit donc et se rendit auprès de l’homme de Dieu, au mont Carmel. Lorsque l’homme de Dieu l’aperçut de loin[a], il dit à Guéhazi, son serviteur : « Regarde, voilà cette Sunamite. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à distance ». L’expression hébraïque indique qu’il la vit alors qu’elle se trouvait encore à une certaine distance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: Elle partit donc et se rendit
  rationale: Les deux wayyiqtol font progresser le récit. Cette formulation française conserve la succession des actions sans la répétition peu naturelle de « aller » et « venir ».
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Traduction directe du titre hébreu traditionnel, sans le remplacer par l’interprétation « prophète ».
- source_word: אֶל הַר הַכַּרְמֶל
  choice: au mont Carmel
  rationale: Le second אֶל situe l’homme de Dieu au mont Carmel; la tournure française évite une répétition maladroite de « auprès de/à ».
- source_word: וַיְהִי כִּרְאוֹת
  choice: Lorsque … aperçut
  rationale: La construction introduit une proposition temporelle. « Aperçut » convient au fait de distinguer une personne encore éloignée.
- source_word: מִנֶּגֶד
  choice: à distance
  rationale: Dans ce contexte, l’expression indique qu’Élisée la voit alors qu’elle est encore éloignée; une note signale l’autre rendu possible.
- source_word: נַעֲרוֹ
  choice: son serviteur
  rationale: Bien que le nom puisse littéralement désigner un jeune homme, il exprime ici la fonction de Guéhazi auprès d’Élisée.
- source_word: הִנֵּה
  choice: Regarde, voilà
  rationale: Ces mots rendent la fonction déictique et l’appel immédiat à l’attention dans un français actuel.
- source_word: הַשּׁוּנַמִּית הַלָּז
  choice: cette Sunamite
  rationale: « Sunamite » conserve la désignation géographique, tandis que « cette » identifie la femme précise qu’Élisée montre à Guéhazi.
theological_decisions: []
