base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/026.yaml
  text: Now please run to meet her and say to her[a], ‘Is it well with you? Is it well with your husband? Is it well with the child?’ And she said[b], ‘It is well.’
translation:
  language: fr
  text: 'Maintenant, cours donc à sa rencontre et dis-lui : « Tout va-t-il bien[a] pour toi ? Tout va-t-il bien pour ton mari ? Tout va-t-il bien pour l’enfant[b] ? » Elle répondit : « Tout va bien. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu shalom, employé quatre fois dans ce verset, peut évoquer la paix, l’intégrité ou le bien-être. Ici, il sert à demander si tout va bien, puis à répondre que tout va bien.
    reason: lexical_alternative
  - marker: b
    text: Ou « le garçon ». Le mot hébreu yeled peut signifier « enfant » ou « garçon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: L’adverbe temporel introduit une instruction pressante. « Maintenant » en conserve directement la valeur sans ajouter une immédiateté plus forte que celle du texte.
- source_word: רֽוּץ נָא
  choice: cours … je te prie
  rationale: L’impératif « cours » garde l’idée concrète de se hâter en courant, tandis que « je te prie » rend la nuance d’exhortation polie ou insistante de נָא dans un français digne et naturel.
- source_word: לִקְרָאתָהּ
  choice: à sa rencontre
  rationale: Cette locution rend l’expression hébraïque usuelle désignant le fait d’aller au-devant de quelqu’un.
- source_word: וֶאֱמָר לָהּ
  choice: et dis-lui
  rationale: « Dis-lui » correspond directement au verbe אמר et introduit naturellement les paroles citées.
- source_word: הֲשָׁלוֹם לָךְ
  choice: Tout va-t-il bien pour toi ?
  rationale: La question porte ici sur la situation et le bien-être de la femme. Cette formulation française conserve la structure reprise dans les trois questions et le champ assez large de שָׁלוֹם.
- source_word: הֲשָׁלוֹם לְאִישֵׁךְ
  choice: Tout va-t-il bien pour ton mari ?
  rationale: Dans cette relation, אִישׁ désigne le mari. La répétition de la même tournure reproduit l’insistance structurée de l’hébreu.
- source_word: הֲשָׁלוֹם לַיָּלֶד
  choice: Tout va-t-il bien pour l’enfant ?
  rationale: יֶלֶד peut désigner un enfant ou, plus précisément, un garçon. « L’enfant » garde la portée lexicale générale et l’article défini renvoie à l’enfant connu dans le récit.
- source_word: וַתֹּאמֶר שָׁלוֹם
  choice: 'Elle répondit : « Tout va bien. »'
  rationale: La réponse hébraïque ne comporte que שָׁלוֹם. « Tout va bien » en exprime naturellement le sens contextuel tout en restant bref.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition « Tout va-t-il bien… ? » préserve le parallélisme et les quatre emplois de שָׁלוֹם, tandis que « je te prie » rend נָא sans donner au commandement un ton excessivement abrupt.
