  text: וַ/יֹּ֗אמֶר מַ֠דּוּעַ אתי הלכתי אֵלָי/ו֙ הַ/יּ֔וֹם לֹֽא חֹ֖דֶשׁ וְ/לֹ֣א שַׁבָּ֑ת וַ/תֹּ֖אמֶר שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/023.yaml
  text: And he said[a], “Why are you going to him today? It is neither new moon nor Sabbath.” And she said, “Peace.”
translation:
  language: fr
  text: 'Il dit : « Pourquoi vas-tu le voir aujourd’hui ? Ce n’est ni la nouvelle lune ni le sabbat. » Elle répondit : « Tout va bien[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Paix. » On pourrait aussi traduire : « Cela va bien. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Interrogatif demandant la raison; « pourquoi » est l’équivalent naturel en français moderne.
- source_word: אתי הלכתי
  choice: vas-tu
  rationale: La forme textuelle irrégulière vise une destinataire au féminin singulier et exprime son déplacement imminent ou en cours; le présent français convient à la situation immédiate.
- source_word: אֵלָיו
  choice: le voir
  rationale: Le pronom renvoie à Élisée. « Aller le voir » rend naturellement en français l’idée d’aller auprès de lui sans remplacer le pronom par son nom.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent temporel direct et idiomatique.
- source_word: לֹא חֹדֶשׁ וְלֹא שַׁבָּת
  choice: Ce n’est ni la nouvelle lune ni le sabbat
  rationale: La construction négative double est naturellement rendue par « ni… ni… » et présente la raison de la question.
- source_word: חֹדֶשׁ
  choice: la nouvelle lune
  rationale: Dans ce contexte calendaire et cultuel, le mot désigne la nouvelle lune, non simplement le mois.
- source_word: שַׁבָּת
  choice: le sabbat
  rationale: Terme biblique français usuel pour le jour saint d’Israël.
- source_word: שָׁלוֹם
  choice: Tout va bien
  rationale: Littéralement « paix », le nom fonctionne ici comme une réponse idiomatique rassurante. Le français « Tout va bien » communique cette fonction, tandis que la note conserve la forme lexicale.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le dialogue reste bref. « Le voir » évite la tournure moins idiomatique « aller à lui », et « Tout va bien » restitue la valeur pragmatique de שָׁלוֹם tout en conservant son sens littéral en note.
