source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לַ/מּוֹעֵ֤ד הַ/זֶּה֙ כָּ/עֵ֣ת חַיָּ֔ה אתי חֹבֶ֣קֶת בֵּ֑ן וַ/תֹּ֗אמֶר אַל אֲדֹנִ/י֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אַל תְּכַזֵּ֖ב בְּ/שִׁפְחָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/016.yaml
  text: Then he said[a], "At this appointed time next year, you will be embracing a son." But she said, "No, my lord, man of God; do not deceive your servant."
translation:
  language: fr
  text: 'Alors il dit : « À cette même époque, l’an prochain[a], tu tiendras un fils dans tes bras. » Elle répondit : « Non, mon seigneur, homme de Dieu ! Ne trompe pas ta servante. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers ce temps de vie », expression qui désigne ici la même époque l’année suivante.'
    reason: La tournure hébraïque כָּעֵת חַיָּה est idiomatique et son image littérale ne peut être reproduite clairement dans le corps du texte.
lexical_decisions:
- source_word: לַמּוֹעֵד הַזֶּה
  choice: à cette même époque
  rationale: מוֹעֵד désigne un moment fixé ou déterminé. Dans cette annonce liée au cycle de l’année, « à cette même époque » exprime naturellement le retour du moment indiqué.
- source_word: כָּעֵת חַיָּה
  choice: l’an prochain
  rationale: Cette expression idiomatique, littéralement difficile, renvoie ici au retour de la même période, l’année suivante. Le sens courant figure dans le texte et la forme plus littérale dans une note.
- source_word: אתי
  choice: tu
  rationale: Le texte massorétique comporte ici une forme signalée par la tradition comme devant être lue אַתְּ, « tu » au féminin. Le pronom indépendant apporte une légère insistance, naturelle dans la tournure française.
- source_word: חֹבֶקֶת
  choice: tu tiendras … dans tes bras
  rationale: Le participe évoque le fait de serrer ou tenir l’enfant dans ses bras. Cette formulation française est naturelle et conserve l’image concrète.
- source_word: בֵּן
  choice: un fils
  rationale: L’hébreu désigne explicitement un fils, et non simplement un enfant.
- source_word: אַל
  choice: Non
  rationale: Le premier אַל exprime ici une réaction émotive de refus ou de supplication plutôt qu’une interdiction autonome.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Il s’agit d’une adresse respectueuse à Élisée. « Mon seigneur » conserve la déférence sans présenter le prophète comme Dieu.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homme de Dieu
  rationale: Cette expression est le titre hébreu usuel d’un prophète et se rend clairement par la formule française traditionnelle.
- source_word: תְּכַזֵּב
  choice: ne trompe pas
  rationale: Le verbe peut signifier mentir, tromper ou se révéler faux. La femme supplie le prophète de ne pas susciter en elle une espérance qui serait déçue.
- source_word: בְּשִׁפְחָתֶךָ
  choice: ta servante
  rationale: Le nom est explicitement féminin et constitue ici une humble manière de parler de soi. « Ta servante » le préserve naturellement.
theological_decisions:
- issue: Valeur de l’adresse אֲדֹנִי appliquée à Élisée
  choice: mon seigneur
  alternative: mon maître ; monsieur
  rationale: Le titre marque le respect social envers le prophète, non une confession de divinité. La traduction maintient cette distinction tout en conservant la solennité de l’échange.
- issue: Portée de תְּכַזֵּב dans la supplication de la femme
  choice: ne trompe pas ta servante
  alternative: ne mens pas à ta servante ; ne donne pas de faux espoirs à ta servante
  rationale: La traduction garde le sens direct du verbe et laisse perceptible la tension entre mensonge, promesse qui se révélerait fausse et espoir qui serait déçu, sans imposer une seule interprétation psychologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur « tu tiendras » rend naturellement la prédiction exprimée par le participe hébreu. L’exclamation après « homme de Dieu » restitue l’intensité de la supplication sans l’exagérer.
