  yaml_path: translation/ot/2_kings/004/017.yaml
  text: So the woman conceived and bore a son at that appointed time[a], about this time next year, just as Elisha had spoken to her.
translation:
  language: fr
  text: La femme devint enceinte et mit au monde un fils au moment fixé[a], à la même époque l’année suivante, comme Élisée le lui avait dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « à ce moment fixé, comme au temps de la vie » ; expression idiomatique désignant la même époque l’année suivante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: devint enceinte
  rationale: Le qal de הרה exprime ici le fait de devenir enceinte. Cette formulation est naturelle en français moderne et convient au récit de l’accomplissement de la promesse.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: אִשָּׁה peut signifier « femme » ou « épouse »; ici, le syntagme reprend la Sunamite déjà identifiée dans le récit, sans mettre l’accent sur son statut conjugal.
- source_word: וַתֵּלֶד בֵּן
  choice: mit au monde un fils
  rationale: ילד suivi de בֵּן est une expression courante pour la naissance d’un fils. « Mit au monde » est actuel, digne et idiomatique.
- source_word: לַמּוֹעֵד הַזֶּה
  choice: au moment fixé
  rationale: מוֹעֵד désigne un moment déterminé ou fixé. En français narratif, l’article défini renvoie naturellement au moment annoncé auparavant, sans devoir reproduire mécaniquement le démonstratif hébreu.
- source_word: כָּעֵת חַיָּה
  choice: à peu près à la même époque l’année suivante
  rationale: Cette locution idiomatique, attestée dans des récits de promesse de naissance, renvoie approximativement à la même période de l’année suivante. La traduction communique ce sens tout en signalant en note la formulation hébraïque difficile.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיהָ אֱלִישָׁע
  choice: comme Élisée le lui avait annoncé
  rationale: La proposition relative souligne l’accomplissement de la parole antérieure d’Élisée. « Annoncé » rend naturellement en contexte une parole prédictive, et le plus-que-parfait marque son antériorité.
- source_word: אֱלִישָׁע
  choice: Élisée
  rationale: Le nom propre suit sa forme française biblique établie.
