base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/029.yaml
  text: Then he said to Gehazi, “Tuck up your garment, take my staff in your hand, and go. If you meet anyone, do not greet him; and if anyone greets you, do not answer him. Then place my staff on the boy’s face.”
translation:
  language: fr
  text: 'Alors il dit à Guéhazi : « Relève les pans de ton vêtement et attache-les à la taille[a], prends mon bâton en main et pars. Si tu rencontres quelqu’un[c], ne le salue pas[b] ; et si quelqu’un te salue, ne lui réponds pas. Puis pose mon bâton sur le visage du garçon. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ceins tes reins », expression qui signifie qu’il faut fixer son vêtement autour de la taille pour se préparer à agir rapidement.'
    reason: lexical_alternative
  - marker: b
    text: Ou, littéralement, « ne le bénis pas » et « s’il te bénit » ; le verbe désigne probablement ici l’échange de salutations en chemin.
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu signifie littéralement « un homme », mais il a ici le sens générique de « quelqu’un ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגֹר מָתְנֶיךָ
  choice: Relève les pans de ton vêtement et attache-les à la taille
  rationale: L’expression signifie littéralement « ceins tes reins ». Elle décrit ici le geste consistant à fixer un vêtement long autour de la taille afin de pouvoir partir rapidement. La formulation française explicite naturellement cette action.
- source_word: מִשְׁעַנְתִּי
  choice: mon bâton
  rationale: Le nom désigne un bâton servant d’appui. « Bâton » convient naturellement au récit et à l’objet qu’Élisée ordonne de poser sur l’enfant.
- source_word: וָלֵךְ
  choice: et pars
  rationale: L’impératif exprime un départ immédiat. « Pars » rend en français courant l’urgence de l’ordre.
- source_word: כִּי תִמְצָא אִישׁ
  choice: Si tu rencontres quelqu’un
  rationale: 'אִישׁ signifie formellement « homme », mais possède ici une portée générique : toute personne rencontrée en chemin.'
- source_word: לֹא תְבָרְכֶנּוּ / וְכִי יְבָרֶכְךָ אִישׁ
  choice: ne le salue pas / si quelqu’un te salue
  rationale: Dans le contexte d’une rencontre en chemin, ברך désigne vraisemblablement l’échange de salutations plutôt qu’une bénédiction formelle.
- source_word: לֹא תַעֲנֶנּוּ
  choice: ne lui réponds pas
  rationale: ענה signifie ici répondre à la salutation reçue. La formulation directe conserve la brièveté et l’urgence de l’hébreu.
- source_word: וְשַׂמְתָּ ... עַל פְּנֵי הַנָּעַר
  choice: Puis pose mon bâton sur le visage du garçon
  rationale: « Poser » rend naturellement שׂים, tandis que « sur le visage » conserve l’expression concrète de l’hébreu. « Puis » marque la dernière étape de la suite d’ordres.
- source_word: הַנָּעַר
  choice: le garçon
  rationale: נַעַר peut désigner un garçon, un jeune homme ou un serviteur. Dans ce contexte, il s’agit du fils de la Sunamite ; « le garçon » est clair et naturel.
