  text: וַ/יֹּ֗אמֶר לְכִ֨י שַׁאֲלִי לָ֤/ךְ כֵּלִים֙ מִן הַ/ח֔וּץ מֵ/אֵ֖ת כָּל שכנ/כי כֵּלִ֥ים רֵקִ֖ים אַל תַּמְעִֽיטִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/003.yaml
  text: Then he said[a], “Go, borrow vessels for yourself from outside, from all your neighbors—empty vessels[b]. Do not gather only a few.”
translation:
  language: fr
  text: 'Il lui dit : « Sors et emprunte à tous tes voisins des récipients, des récipients vides. Ne t’en procure pas seulement quelques-uns[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « demande des récipients ». Le verbe hébreu peut signifier plus généralement « demander » ; dans ce contexte, il implique vraisemblablement un emprunt temporaire. Littéralement, l’ordre final signifie « ne diminue pas » ou « ne fais pas peu » ; il demande de ne pas se limiter à un petit nombre de récipients.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי
  choice: Va
  rationale: L’impératif féminin singulier envoie la femme accomplir l’action ; « Va » est direct et naturel en français.
- source_word: שַׁאֲלִי
  choice: emprunter
  rationale: Le verbe peut signifier plus généralement « demander », mais le contexte indique qu’elle doit obtenir temporairement des récipients auprès de ses voisins.
- source_word: לָךְ
  choice: intégré au sens de « emprunter »
  rationale: Le datif marque ici l’intérêt personnel de la femme. En français, l’idée est suffisamment portée par l’ordre qui lui est directement adressé ; « pour toi-même » serait lourd et pourrait suggérer la propriété définitive.
- source_word: כֵּלִים
  choice: récipients
  rationale: Le terme hébreu est général. Puisque ces objets doivent contenir de l’huile, « récipients » reste précis sans imposer indûment la forme de jarres ou de cruches.
- source_word: מִן הַחוּץ
  choice: au-dehors
  rationale: Cette formulation rend explicitement l’idée de l’extérieur, tout en laissant la phrase suivante préciser qu’il s’agit d’aller auprès des voisins.
- source_word: מֵאֵת כָּל שכנכי
  choice: à tous tes voisins
  rationale: Avec « emprunter », le français idiomatique emploie « à ». Le masculin pluriel peut désigner collectivement l’ensemble des personnes du voisinage, sans préciser leur sexe.
- source_word: כֵּלִים רֵקִים
  choice: des récipients vides
  rationale: La répétition de « récipients » reproduit l’insistance de l’hébreu, et « vides » énonce la condition nécessaire à la suite du récit.
- source_word: אַל תַּמְעִיטִי
  choice: N’en prends pas seulement quelques-uns
  rationale: Littéralement, l’expression interdit de réduire ou de faire peu. Cette traduction française exprime clairement l’ordre de ne pas se limiter à un petit nombre.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Récipients » conserve la portée générale du terme hébreu ; la répétition originale est maintenue pour l’insistance. La tournure finale privilégie une formulation immédiatement compréhensible sans effacer l’image littérale, signalée en note.
