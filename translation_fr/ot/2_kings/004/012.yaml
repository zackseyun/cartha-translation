  text: וַ/יֹּ֨אמֶר֙ אֶל גֵּחֲזִ֣י נַעֲר֔/וֹ קְרָ֖א לַ/שּׁוּנַמִּ֣ית הַ/זֹּ֑את וַ/יִּקְרָא לָ֔/הּ וַֽ/תַּעֲמֹ֖ד לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/012.yaml
  text: Then he said to Gehazi his servant[a], “Call this Shunammite woman.” So he called her, and she stood before him.
translation:
  language: fr
  text: 'Puis Élisée dit à Guéhazi, son serviteur : « Appelle cette Sunamite[a]. » Guéhazi l’appela, et elle se tint devant Élisée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cette Sunamite », c’est-à-dire cette femme originaire de Sunem.'
    reason: Précision sur le gentilé féminin employé par l’hébreu.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis Élisée dit
  rationale: Le wayyiqtol fait progresser le récit. « Puis » rend naturellement la succession; le nom « Élisée », explicité par le contexte, évite en français une série de pronoms ambigus.
- source_word: גֵּחֲזִי
  choice: Guéhazi
  rationale: Translittération française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: נַעֲרוֹ
  choice: son serviteur
  rationale: נַעַר peut désigner un jeune homme, un assistant ou un serviteur. Ici, le terme exprime la fonction de Guéhazi auprès d’Élisée; « serviteur » est clair et courant.
- source_word: קְרָא
  choice: Appelle
  rationale: Dans ce contexte, קרא signifie faire venir quelqu’un auprès de soi. « Appelle » conserve la simplicité de l’impératif hébreu sans la force plus officielle de « convoque ».
- source_word: לַשּׁוּנַמִּית הַזֹּאת
  choice: cette Sunamite
  rationale: Le substantif féminin hébreu identifie la femme par son origine, Sunem. En français, « la Sunamite » fonctionne naturellement comme nom et n’exige pas l’ajout de « femme ».
- source_word: וַיִּקְרָא לָהּ
  choice: Guéhazi l’appela
  rationale: La répétition de « appeler » reflète celle de קרא. Le nom du sujet est explicité pour lever l’ambiguïté que produirait « il » en français.
- source_word: וַתַּעֲמֹד
  choice: elle se tint
  rationale: עמד signifie se tenir debout ou prendre position. « Se tint » rend ici une présence maintenue sans ajouter un déplacement absent de l’hébreu.
- source_word: לְפָנָיו
  choice: devant Élisée
  rationale: L’expression signifie « devant lui » ou « en sa présence ». L’explicitation du référent restitue sans ambiguïté qu’elle se tient devant Élisée, non devant Guéhazi.
