  text: וַ/יַּ֜עַל וַ/יִּשְׁכַּ֣ב עַל הַ/יֶּ֗לֶד וַ/יָּשֶׂם֩ פִּ֨י/ו עַל פִּ֜י/ו וְ/עֵינָ֤י/ו עַל עֵינָי/ו֙ וְ/כַפָּ֣י/ו עַל כפ/ו וַ/יִּגְהַ֖ר עָלָ֑י/ו וַ/יָּ֖חָם בְּשַׂ֥ר הַ/יָּֽלֶד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/034.yaml
  text: Then he went up and lay on the boy[a], and put his mouth on his mouth, his eyes on his eyes, and his palms on his palms; and he stretched himself over him, and the boy’s flesh became warm.
translation:
  language: fr
  text: Puis il monta et se coucha sur l’enfant. Il posa sa bouche sur celle de l’enfant, ses yeux sur les siens et ses paumes sur les siennes. Il s’étendit sur lui[a], et la chair de l’enfant se réchauffa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il se pencha sur lui ». Le verbe hébreu est rare et peut évoquer le fait de se courber ou de s’étendre au-dessus de l’enfant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Puis il monta
  rationale: Le verbe עלה signifie « monter ». La chambre haute est sous-entendue par le contexte, mais n’est pas explicitement mentionnée dans ce verset.
- source_word: וַיִּשְׁכַּב עַל הַיֶּלֶד
  choice: et se coucha sur l’enfant
  rationale: Cette formulation rend directement la position physique décrite par שׁכב עַל, sans l’atténuer ni lui attribuer une portée médicale.
- source_word: וַיָּשֶׂם פִּיו עַל פִּיו
  choice: Il posa sa bouche sur sa bouche
  rationale: « Posa » exprime naturellement le verbe courant שׂים tout en conservant le contact corporel précis du texte.
- source_word: וְעֵינָיו עַל עֵינָיו
  choice: ses yeux sur ses yeux
  rationale: La construction sans verbe dépend de « posa ». La répétition préserve la symétrie de l’hébreu.
- source_word: וְכַפָּיו עַל כַּפָּיו
  choice: ses paumes sur ses paumes
  rationale: כַּף désigne précisément la paume ou le creux de la main ; « paumes » maintient cette précision anatomique.
- source_word: וַיִּגְהַר עָלָיו
  choice: Il s’étendit sur lui[a]
  rationale: Le verbe rare גהר décrit vraisemblablement le fait de se courber ou de s’étendre au-dessus de quelqu’un. Dans ce contexte, « s’étendit sur lui » rend clairement la posture tout en signalant l’incertitude lexicale en note.
- source_word: וַיָּחָם בְּשַׂר הַיָּלֶד
  choice: la chair de l’enfant se réchauffa
  rationale: חם indique ici le fait de devenir chaud, et בָּשָׂר est rendu concrètement par « chair » plutôt que par le terme plus général « corps ».
- source_word: הַיֶּלֶד / הַיָּלֶד
  choice: l’enfant
  rationale: יֶלֶד peut désigner un enfant ou un garçon. « L’enfant » est naturel en français et correspond à la manière dont ce fils est présenté dans le récit.
theological_decisions:
- issue: Nature du geste d’Élisée envers l’enfant mort
  choice: Décrire concrètement les gestes sans en préciser le mécanisme.
  alternative: Présenter la scène comme une réanimation par bouche-à-bouche ou employer une formulation euphémique.
  rationale: L’hébreu rapporte un geste corporel prophétique lié au retour à la vie de l’enfant, mais n’en explique pas le fonctionnement. La traduction évite donc aussi bien l’interprétation médicale anachronique que l’atténuation du récit.
translation_notes:
  register: Français moderne, clair et digne. La répétition des parties du corps conserve le rythme concret et symétrique de l’hébreu ; « chair » maintient son langage corporel sans ajouter d’explication interprétative.
