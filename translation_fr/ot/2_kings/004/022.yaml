base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/022.yaml
  text: Then she called to her husband and said[a], “Please send me one of the young men and one of the female donkeys[b], so that I may run to the man of God and return.”
translation:
  language: fr
  text: 'Elle appela alors son mari et lui dit : « Envoie-moi, je te prie, l’un des jeunes hommes et l’une des ânesses, afin que je puisse courir jusqu’à l’homme de Dieu et revenir.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu signifie littéralement « courir » et souligne ici l’urgence; on pourrait aussi traduire : « afin que je puisse me hâter auprès de l’homme de Dieu et revenir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶל אִישָׁהּ
  choice: Elle appela alors son mari
  rationale: Le wayyiqtol fait avancer le récit; « alors » rend naturellement la succession. Dans ce contexte domestique, אִישָׁהּ désigne son mari.
- source_word: שִׁלְחָה נָא לִי
  choice: Envoie-moi, je te prie
  rationale: L’impératif accompagné de נָא formule une demande courtoise. Cette tournure conserve à la fois l’injonction et la politesse.
- source_word: אֶחָד מִן הַנְּעָרִים
  choice: l’un des jeunes hommes
  rationale: נַעַר peut désigner un jeune homme ou un serviteur. La traduction retenue préserve le sens lexical sans imposer un statut servile qui reste implicite.
- source_word: וְאַחַת הָאֲתֹנוֹת
  choice: et l’une des ânesses
  rationale: אָתוֹן désigne spécifiquement une ânesse; le féminin explicite de l’hébreu est donc conservé.
- source_word: וְאָרוּצָה
  choice: afin que je puisse courir
  rationale: Le cohortatif exprime ici l’action projetée à la suite de la demande. « Courir » garde l’image et l’urgence du verbe רוץ.
- source_word: עַד אִישׁ הָאֱלֹהִים
  choice: jusqu’à l’homme de Dieu
  rationale: עַד marque le point d’arrivée. « Jusqu’à » en conserve la nuance, tandis que « homme de Dieu » reproduit le titre hébreu traditionnel du prophète.
- source_word: וְאָשׁוּבָה
  choice: et revenir
  rationale: Le second cohortatif poursuit l’expression de l’intention de la femme; l’infinitif coordonné est naturel en français après « afin que je puisse ».
