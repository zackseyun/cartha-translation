translation_notes:
  register: Français moderne, digne et narratif. « Je te prie » rend la politesse sans archaïsme excessif. Le titre « homme de Dieu » et le terme précis « ânesses » sont conservés. Le marqueur de note [a] figure dans le texte après l’ensemble de la proposition qu’il éclaire.
