  text: וַ/יֹּ֥אמֶר אֶל אָבִ֖י/ו רֹאשִׁ֣/י רֹאשִׁ֑/י וַ/יֹּ֨אמֶר֙ אֶל הַ/נַּ֔עַר שָׂאֵ֖/הוּ אֶל אִמּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/019.yaml
  text: And he said to his father[a], “My head, my head!” Then he said to the young man, “Carry him to his mother.”
translation:
  language: fr
  text: 'Il dit à son père : « Ma tête ! Ma tête ! » Alors le père dit au jeune homme[a] : « Porte-le à sa mère. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le mot hébreu peut désigner un garçon, un jeune homme, un assistant ou un serviteur, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אָבִיו
  choice: Il dit à son père
  rationale: Le verbe אמר signifie simplement « dire » ; la détresse ressort de l’exclamation répétée sans qu’il soit nécessaire d’ajouter « crier ». La relation filiale est rendue directement.
- source_word: רֹאשִׁי רֹאשִׁי
  choice: Ma tête ! Ma tête !
  rationale: La répétition brève est conservée afin de restituer l’intensité et l’urgence sans expliciter par « j’ai mal », ce que l’hébreu ne dit pas formellement.
- source_word: וַיֹּאמֶר
  choice: Alors le père dit
  rationale: « Alors » marque naturellement la progression narrative du wayyiqtol. La reprise explicite de « le père » lève en français une ambiguïté pronominale susceptible de faire croire que l’enfant donne l’ordre, alors que le contexte désigne le père.
- source_word: אֶל הַנַּעַר
  choice: au jeune homme
  rationale: נַעַר peut désigner un garçon, un jeune homme ou un serviteur. Ici, l’individu est assez grand pour porter l’enfant ; « jeune homme » préserve l’indication probable d’âge sans imposer dans le texte son statut de serviteur.
- source_word: שָׂאֵהוּ
  choice: Porte-le
  rationale: Dans ce contexte, l’impératif de נשׂא demande de prendre physiquement l’enfant et de le transporter.
- source_word: אֶל אִמּוֹ
  choice: à sa mère
  rationale: Traduction directe et naturelle du terme de parenté, dans un registre narratif digne.
theological_decisions: []
translation_notes:
  register: Français international actuel, simple et digne. Le rythme concis du récit et la répétition expressive de l’hébreu sont préservés. L’explicitation « le père » assure une référence naturelle en français sans ajouter un nouvel acteur.
