translation_notes:
  register: Français international moderne, narratif et digne. Le vocabulaire reste accessible, sans archaïsme ni précision botanique excessive. La répétition hébraïque de « champ » est rendue par « sauvage » dans les expressions végétales, avec sa forme littérale signalée en note. La tension du lien causal final est conservée dans le texte et explicitée en note.
