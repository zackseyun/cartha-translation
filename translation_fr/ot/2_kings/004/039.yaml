  text: וַ/יֵּצֵ֨א אֶחָ֣ד אֶל הַ/שָּׂדֶה֮ לְ/לַקֵּ֣ט אֹרֹת֒ וַ/יִּמְצָא֙ גֶּ֣פֶן שָׂדֶ֔ה וַ/יְלַקֵּ֥ט מִמֶּ֛/נּוּ פַּקֻּעֹ֥ת שָׂדֶ֖ה מְלֹ֣א בִגְד֑/וֹ וַ/יָּבֹ֗א וַ/יְפַלַּ֛ח אֶל סִ֥יר הַ/נָּזִ֖יד כִּֽי לֹ֥א יָדָֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/039.yaml
  text: Then one man went out into the field to gather herbs[a], and he found a wild vine and gathered from it wild gourds, filling his garment. Then he came and sliced them into the pot of stew[c][b], though they did not know what they were.
translation:
  language: fr
  text: L’un d’eux sortit dans la campagne pour cueillir des plantes comestibles[a]. Il trouva une vigne sauvage et y cueillit des courges sauvages[b], de quoi remplir son vêtement. Puis il revint et les coupa en morceaux dans la marmite de ragoût, car ils ne savaient pas ce que c’était[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la verdure ». Le mot hébreu désigne de manière générale des plantes comestibles cueillies dans la campagne.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « une vigne des champs » et « des courges des champs » : il s’agit d’une vigne sauvage portant des fruits sauvages, probablement des coloquintes.'
    reason: lexical_alternative
  - marker: c
    text: 'Le mot hébreu traduit par « car » peut introduire une explication. On peut aussi comprendre : « sans qu’ils sachent ce que c’était ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד
  choice: L’un d’eux
  rationale: Le numéral est employé substantivement pour désigner un membre masculin du groupe. « L’un d’eux » est naturel en français et rend explicite l’appartenance au groupe donnée par le contexte.
- source_word: לְלַקֵּט אֹרֹת
  choice: pour cueillir des plantes comestibles
  rationale: אֹרֹת désigne largement des végétaux ou de la verdure destinés à être mangés. Cette formulation claire évite de limiter indûment le sens aux herbes aromatiques.
- source_word: גֶּפֶן שָׂדֶה
  choice: une vigne sauvage
  rationale: L’expression décrit une vigne poussant à l’état sauvage dans la campagne. La traduction fonctionnelle est plus naturelle que « une vigne des champs ».
- source_word: פַּקֻּעֹת שָׂדֶה
  choice: des courges sauvages
  rationale: Le terme désigne les fruits d’une plante sauvage, probablement des coloquintes. « Courges sauvages » reste accessible sans imposer une identification botanique plus précise que le texte.
- source_word: מְלֹא בִגְדוֹ
  choice: de quoi remplir son vêtement
  rationale: L’idiome hébreu exprime la quantité recueillie dans le vêtement utilisé comme contenant, tout en conservant l’image concrète.
- source_word: וַיְפַלַּח
  choice: les coupa en morceaux
  rationale: Le verbe signifie fendre ou découper. Le pronom reprend naturellement les fruits cueillis, objet implicite en hébreu.
- source_word: סִיר הַנָּזִיד
  choice: la marmite de ragoût
  rationale: נָזִיד est un mets cuit ou ragoût, et סִיר le récipient de cuisson. Cette expression est actuelle et concrète.
- source_word: כִּי לֹא יָדָעוּ
  choice: car ils ne savaient pas ce que c’était
  rationale: Le כִּי est rendu dans sa valeur explicative courante, tandis que « ce que c’était » explicite sobrement l’objet sous-entendu de leur ignorance. Le pluriel « ils » est conservé.
