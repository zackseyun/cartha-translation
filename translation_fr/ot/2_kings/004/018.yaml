  text: And the boy grew[a], and one day he went out to his father[b], to the reapers.
translation:
  language: fr
  text: Le garçon grandit[a]. Un jour[b], il sortit vers son père, vers les moissonneurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’enfant ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : formule narrative littéralement de type « et il arriva, le jour... » ; elle introduit ici une occasion particulière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: grandit
  rationale: Le verbe גדל décrit ici la croissance de l’enfant. « Grandit » reste naturel en français sans préciser davantage son degré de maturité.
- source_word: הַיָּלֶד
  choice: le garçon
  rationale: יֶלֶד peut désigner un enfant ou, plus précisément, un garçon. Le contexte permet « le garçon », tandis que la note conserve l’autre possibilité.
- source_word: וַיְהִי הַיּוֹם
  choice: un jour
  rationale: Cette tournure narrative hébraïque introduit une occasion particulière. « Un jour » en restitue naturellement la fonction en français moderne.
- source_word: וַיֵּצֵא
  choice: il sortit
  rationale: יצא exprime un mouvement vers l’extérieur, probablement en direction du lieu où l’on moissonnait. « Sortit » préserve cette nuance.
- source_word: אֶל אָבִיו
  choice: pour rejoindre son père
  rationale: La préposition אֶל marque le mouvement en direction du père. « Rejoindre » exprime ce déplacement de manière idiomatique en français.
- source_word: אֶל הַקֹּצְרִים
  choice: auprès des moissonneurs
  rationale: Le second groupe introduit par אֶל situe la destination du garçon du côté des personnes qui coupent les céréales. « Moissonneurs » est précis et « auprès de » évite de transformer explicitement le père en moissonneur, ce que la syntaxe suggère sans l’imposer absolument.
