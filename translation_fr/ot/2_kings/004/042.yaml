  text: וְ/אִ֨ישׁ בָּ֜א מִ/בַּ֣עַל שָׁלִ֗שָׁה וַ/יָּבֵא֩ לְ/אִ֨ישׁ הָ/אֱלֹהִ֜ים לֶ֤חֶם בִּכּוּרִים֙ עֶשְׂרִֽים לֶ֣חֶם שְׂעֹרִ֔ים וְ/כַרְמֶ֖ל בְּ/צִקְלֹנ֑/וֹ וַ/יֹּ֕אמֶר תֵּ֥ן לָ/עָ֖ם וְ/יֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/042.yaml
  text: And a man came from Baal-shalishah and brought to the man of God bread of the firstfruits[a], twenty loaves of barley, and fresh grain in his sack. And he said, “Give it to the people[b], so that they may eat.”
translation:
  language: fr
  text: 'Un homme arriva de Baal-Shalisha et apporta à l’homme de Dieu du pain des prémices : vingt pains d’orge, ainsi que du grain frais[a] dans son sac[b]. L’homme de Dieu dit : « Donne cela au peuple pour qu’ils mangent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du grain grillé ». Le terme hébreu peut désigner du grain préparé pour être mangé, et pas seulement du grain frais.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « sac » est rare et son sens demeure incertain ; il peut désigner un sac, une enveloppe ou, peut-être, la balle du grain.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom désigne ici simplement un individu de sexe masculin ; « un homme » est direct et naturel.
- source_word: מִבַּעַל שָׁלִשָׁה
  choice: de Baal-Shalisha
  rationale: Il s’agit d’un nom de lieu, conservé par translittération selon un usage français lisible.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Cette désignation traditionnelle d’un prophète est rendue littéralement afin de préserver le vocabulaire et les échos littéraires du texte.
- source_word: לֶחֶם בִּכּוּרִים
  choice: du pain des prémices
  rationale: La formulation garde le lien explicite avec les prémices sans préciser davantage la portée cultuelle de l’expression.
- source_word: עֶשְׂרִים לֶחֶם שְׂעֹרִים
  choice: vingt pains d’orge
  rationale: Dans ce contexte de dénombrement, לֶחֶם désigne naturellement des pains ; cette tournure est idiomatique en français.
- source_word: כַרְמֶל
  choice: du grain frais
  rationale: Le mot désigne ici du grain frais ou préparé, et non le mont Carmel. « Grain frais » convient au contexte des prémices, tandis que l’autre interprétation courante est signalée en note.
- source_word: בְּצִקְלֹנוֹ
  choice: dans son sac
  rationale: Le nom rare semble désigner un contenant ou une enveloppe. « Sac » donne un sens clair et plausible, sans masquer l’incertitude signalée en note.
- source_word: תֵּן לָעָם וְיֹאכֵלוּ
  choice: Donne cela aux gens pour qu’ils mangent
  rationale: L’impératif suivi de la forme verbale coordonnée exprime ici naturellement le but ou le résultat attendu.
theological_decisions:
- issue: Sujet implicite de וַיֹּאמֶר (« il dit »)
  choice: Élisée dit
  alternative: Il dit
  rationale: Le contexte immédiat du récit identifie l’homme de Dieu à Élisée. Employer son nom évite en français que le pronom soit compris comme renvoyant à l’homme venu de Baal-Shalisha, sans changer l’identité narrative du locuteur.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’enchaînement hébreu, tandis que les appositions sont ponctuées pour une lecture naturelle. Les marqueurs de notes sont placés immédiatement après les expressions réellement concernées.
