source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר קְרָא לָ֑/הּ וַ/יִּקְרָא לָ֔/הּ וַֽ/תַּעֲמֹ֖ד בַּ/פָּֽתַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/015.yaml
  text: Then he said[a], “Call her.” So he called her, and she stood in the doorway.
translation:
  language: fr
  text: 'Alors il dit : « Appelle-la. » Il l’appela donc, et elle se tint à l’entrée[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’embrasure de la porte ». Le terme hébreu peut désigner l’ouverture d’une porte ou l’entrée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors il dit
  rationale: Le wayyiqtol de אמר fait progresser le récit. « Alors » rend naturellement cette succession en français sans alourdir la phrase.
- source_word: קְרָא לָהּ
  choice: Appelle-la
  rationale: L’impératif masculin singulier de קרא suivi du pronom féminin signifie simplement appeler la femme; « convoque-la » serait inutilement formel.
- source_word: וַיִּקְרָא לָהּ
  choice: Il l’appela donc
  rationale: La reprise du verbe קרא décrit l’exécution immédiate de l’ordre. « donc » exprime ce lien tout en conservant la sobriété narrative.
- source_word: וַתַּעֲמֹד
  choice: elle se tint
  rationale: עמד signifie ici prendre position ou se tenir debout. Le français « se tint » n’ajoute pas un déplacement que l’hébreu n’énonce pas.
- source_word: בַּפָּתַח
  choice: à l’entrée
  rationale: פתח désigne une ouverture, une entrée ou l’espace d’une porte. « à l’entrée » est naturel et laisse ouverte la localisation précise.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Les pronoms masculins sont conservés comme dans l’hébreu plutôt que de répéter les noms des personnages. Le marqueur de note est placé après le terme auquel porte réellement la variante lexicale.
