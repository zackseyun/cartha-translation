source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ מְשָׁ֣רְת֔/וֹ מָ֚ה אֶתֵּ֣ן זֶ֔ה לִ/פְנֵ֖י מֵ֣אָה אִ֑ישׁ וַ/יֹּ֗אמֶר תֵּ֤ן לָ/עָם֙ וְ/יֹאכֵ֔לוּ כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה אָכֹ֥ל וְ/הוֹתֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/043.yaml
  text: 'But his servant said[a], “How am I to set this before a hundred men?” And he said, “Give it to the people, and let them eat[b], for thus says Yahweh: ‘They shall eat and have some left over.’”'
translation:
  language: fr
  text: 'Mais son serviteur dit[a] : « Comment pourrais-je mettre cela devant cent hommes ? » Il dit : « Donne-le au peuple, et qu’ils mangent[b], car voici ce que dit Yahweh : “Ils mangeront et il en restera.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Que donnerai-je ceci devant cent hommes ? » C’est-à-dire : « Comment donner cela à cent hommes ? »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « manger et laisser de reste »; l’expression annonce qu’il restera de la nourriture après qu’ils auront mangé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתוֹ
  choice: son serviteur
  rationale: Le terme désigne celui qui sert personnellement Élisée. « Serviteur » est naturel dans ce récit et conserve le rapport de service.
- source_word: מָה אֶתֵּן זֶה לִפְנֵי מֵאָה אִישׁ
  choice: Comment pourrais-je mettre cela devant cent hommes ?
  rationale: Cette formulation rend l’incrédulité exprimée par מָה et conserve l’image concrète de la nourriture placée devant les convives.
- source_word: אִישׁ
  choice: hommes
  rationale: Le masculin distributif après « cent » est ici rendu explicitement, conformément à la forme hébraïque et au référent probable.
- source_word: תֵּן לָעָם
  choice: Donne-le à ces gens
  rationale: עָם désigne collectivement le groupe présent. « Ces gens » est plus naturel ici que « le peuple » et respecte le passage du terme אִישׁ à un nom collectif.
- source_word: וְיֹאכֵלוּ
  choice: et qu’ils mangent
  rationale: Après l’impératif, la forme verbale a une valeur jussive ou résultative que cette tournure française exprime naturellement.
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: car voici ce que dit Yahweh
  rationale: La formule conserve l’autorité de l’annonce prophétique tout en étant claire et idiomatique en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin présent dans le texte hébreu sans le remplacer par un titre.
- source_word: אָכֹל וְהוֹתֵר
  choice: Ils mangeront et il en restera
  rationale: 'La tournure rend avec naturel la certitude du résultat annoncé : tous mangeront et une partie de la nourriture restera.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre sans l’assimiler au titre אֲדֹנָי.
- issue: Force de la promesse אָכֹל וְהוֹתֵר
  choice: Ils mangeront et il en restera
  alternative: Qu’ils mangent et qu’ils en laissent
  rationale: Dans la formule prophétique, les infinitifs annoncent avec assurance le résultat plutôt qu’ils ne donnent un nouvel ordre. Le futur français conserve cette valeur sans surinterprétation.
translation_notes:
  register: Français international moderne, narratif et digne. « Comment pourrais-je » exprime l’étonnement du serviteur; « mettre cela devant » conserve l’image hébraïque. Le nom d’Élisée est explicité dans la seconde réplique afin d’éviter une succession pronominale ambiguë en français.
