revisions:
- from: 'Mais son serviteur dit[a] : « Comment pourrais-je mettre cela devant cent hommes ? » Élisée répondit : « Donne-le à ces gens, et qu’ils mangent[b], car voici ce que dit Yahweh : “Ils mangeront et il en restera.” »'
  to: 'Mais son serviteur dit[a] : « Comment pourrais-je mettre cela devant cent hommes ? » Il dit : « Donne-le au peuple, et qu’ils mangent[b], car voici ce que dit Yahweh : “Ils mangeront et il en restera.” »'
  rationale: La révision retire l’ajout explicatif « Élisée », rend לָעָם par le collectif défini « le peuple » et corrige la note a, qui déformait le démonstratif hébreu. La note b explicite l’expression hébraïque tout en conservant sa valeur de promesse de surplus.
