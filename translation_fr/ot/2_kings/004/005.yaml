base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/005.yaml
  text: So she went from him and shut the door behind herself and behind her sons; they were bringing the vessels to her[a], and she was pouring.
translation:
  language: fr
  text: Elle le quitta donc et ferma la porte sur elle et sur ses fils. Ceux-ci lui apportaient les récipients[a], et elle versait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit simplement : « ils lui apportaient » ; « les récipients » est précisé d’après le contexte des récipients vides mentionnés aux versets précédents.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: Elle le quitta donc
  rationale: Le verbe fait avancer le récit, et מֵאִתּוֹ indique qu’elle s’éloigne de l’homme de Dieu. « Le quitta » est naturel en français sans suggérer une rupture relationnelle dans ce contexte.
- source_word: וַתִּסְגֹּר הַדֶּלֶת בַּעֲדָהּ וּבְעַד בָּנֶיהָ
  choice: et ferma la porte sur elle et sur ses fils
  rationale: Avec סגר הדלת, בְּעַד exprime la fermeture qui les laisse à l’intérieur. La répétition de « sur » conserve la structure insistante de l’hébreu tout en restant idiomatique.
- source_word: הֵם מַגִּשִׁים אֵלֶיהָ
  choice: Ceux-ci lui apportaient les récipients[a]
  rationale: Le participe décrit une action en cours. L’objet n’est pas exprimé dans ce membre de phrase, mais les récipients vides sont clairement ceux des versets précédents; ils sont explicités pour une lecture française naturelle et signalés en note.
- source_word: וְהִיא מיצקת
  choice: et elle versait l’huile
  rationale: Le participe présente une action continue, simultanée à celle des fils. L’objet « l’huile » est implicite d’après le contexte immédiat; son ajout évite en français l’emploi abrupt de « verser » sans complément.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. L’imparfait rend les deux actions simultanées et continues. « Ceux-ci » désigne sans ambiguïté les fils, tandis que « sur elle et sur ses fils » garde la répétition de l’original.
