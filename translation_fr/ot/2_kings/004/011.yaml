  yaml_path: translation/ot/2_kings/004/011.yaml
  text: One day he came there[a], turned aside into the upper room, and lay down there.
translation:
  language: fr
  text: Un jour, il vint là, se détourna pour entrer dans la chambre haute et s’y coucha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et y dormit ». Le verbe hébreu peut désigner le fait de se coucher ou de dormir ; le contexte n’impose pas le sens plus précis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Un jour
  rationale: Cette formule narrative introduit une occasion particulière. « Un jour » est naturel en français moderne et conserve la valeur temporelle sans calquer lourdement l’hébreu.
- source_word: וַיָּבֹא שָׁמָּה
  choice: il vint là
  rationale: בוא signifie couramment « venir » ou « entrer », et שָׁמָּה indique « là ». Cette formulation reste proche du mouvement déictique du récit.
- source_word: וַיָּסַר
  choice: se retira
  rationale: סור exprime ici le fait de quitter son trajet pour gagner un endroit particulier. « Se retira » rend naturellement en français l’entrée à l’écart dans la pièce préparée pour lui.
- source_word: אֶל הָעֲלִיָּה
  choice: dans la chambre haute
  rationale: עֲלִיָּה désigne une pièce aménagée à l’étage ou sur la terrasse. « Chambre haute » préserve le caractère architectural tout en restant clair et digne.
- source_word: וַיִּשְׁכַּב שָׁמָּה
  choice: et s’y coucha
  rationale: שׁכב peut signifier se coucher, être étendu ou dormir. « S’y coucha » conserve l’action sans préciser qu’il s’endormit.
