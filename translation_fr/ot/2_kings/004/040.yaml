base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/040.yaml
  text: So they poured it out for the men to eat. But as they were eating from the stew[a], they cried out and said, “There is death in the pot, man of God!” And they could not eat.
translation:
  language: fr
  text: 'Ils en versèrent aux hommes pour qu’ils mangent. Mais tandis qu’ils mangeaient du ragoût, ils poussèrent des cris et dirent : « La mort[a] est dans la marmite, homme de Dieu ! » Et ils ne purent pas manger.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la mort est dans la marmite ». L’expression signifie probablement que le ragoût était mortel ou toxique.'
    reason: Préserve dans le texte l’image hébraïque, tout en indiquant avec prudence son sens probable.
lexical_decisions:
- source_word: וַיִּצְקוּ
  choice: Ils en servirent
  rationale: Le verbe signifie concrètement « verser ». Dans le contexte de la distribution d’un mets liquide, « servir » est naturel en français, tandis que le pronom « en » garde le lien avec le contenu de la marmite.
- source_word: לַאֲנָשִׁים
  choice: aux hommes
  rationale: Le nom masculin pluriel désigne ici les hommes rassemblés auprès d’Élisée ; la traduction conserve cette référence sexuée.
- source_word: כְּאָכְלָם מֵהַנָּזִיד
  choice: tandis qu’ils mangeaient du ragoût
  rationale: La tournure temporelle exprime une action en cours. נָזִיד désigne un mets bouilli ou ragoût ; « ragoût » est courant et adapté au contexte.
- source_word: צָעָקוּ
  choice: ils poussèrent des cris
  rationale: Le verbe évoque une clameur soudaine et alarmée, rendue idiomatiquement en français.
- source_word: מָוֶת בַּסִּיר
  choice: Il y a la mort dans la marmite
  rationale: La formulation imagée de l’hébreu, littéralement « mort dans la marmite », est conservée plutôt que réduite à l’interprétation « poison ».
- source_word: אִישׁ הָאֱלֹהִים
  choice: homme de Dieu
  rationale: Titre traditionnel d’Élisée et apostrophe directe naturelle en français.
- source_word: וְלֹא יָכְלוּ לֶאֱכֹל
  choice: Et ils ne purent pas manger
  rationale: La traduction suit l’absence d’objet explicite dans l’hébreu et conserve la conclusion abrupte.
