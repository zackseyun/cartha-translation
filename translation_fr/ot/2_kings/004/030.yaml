  text: וַ/תֹּ֨אמֶר֙ אֵ֣ם הַ/נַּ֔עַר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּ֖קָם וַ/יֵּ֥לֶךְ אַחֲרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/030.yaml
  text: Then the boy’s mother said[a], “As Yahweh lives, and as your soul lives, I will not leave you.” So he arose and went after her.
translation:
  language: fr
  text: 'Alors la mère du garçon dit[a] : « Aussi vrai que Yahweh est vivant et que tu vis, je ne te quitterai pas. » Il se leva et la suivit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formule de serment hébraïque, littéralement : « Yahweh est vivant, et ta vie est vivante » ; autrement dit : « Aussi vrai que Yahweh est vivant et que tu vis. »'
    reason: La note signale la formulation hébraïque sous-jacente et explique sa valeur idiomatique.
lexical_decisions:
- source_word: אֵם הַנַּעַר
  choice: la mère du garçon
  rationale: Rend naturellement la construction « mère du garçon » tout en conservant l’identification précise de la femme.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Aussi vrai que Yahweh est vivant et que tu es vivant
  rationale: Restitue en français courant la force de la formule de serment. נַפְשְׁךָ désigne ici la personne vivante de l’interlocuteur plutôt qu’une affirmation sur la nature de l’âme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: je ne te quitterai pas
  rationale: Après la formule de serment, אִם introduit une forte dénégation; une traduction conditionnelle littérale serait trompeuse en français.
- source_word: וַיָּקָם
  choice: se leva
  rationale: Équivalent français naturel de קום dans cette suite narrative.
- source_word: וַיֵּלֶךְ אַחֲרֶיהָ
  choice: la suivit
  rationale: Exprime naturellement en français le sens contextuel de « marcher derrière/après elle ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה dans la formule de serment
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » conserve le nom personnel et évite de le remplacer silencieusement par un titre.
- issue: Sens de נַפְשְׁךָ dans la formule חֵי נַפְשְׁךָ
  choice: que tu es vivant
  alternative: que ton âme est vivante
  rationale: Dans cette formule de serment, נֶפֶשׁ avec le suffixe renvoie idiomatiquement à la vie ou à la personne de l’interlocuteur. La formulation retenue ne tranche donc pas une question anthropologique étrangère au contexte.
translation_notes:
  register: Français international moderne, digne et aisément compréhensible. « Élisée » explicite le sujet masculin de la dernière proposition, clair dans le contexte mais non nommé dans ce verset isolé; « la suivit » évite l’ambiguïté possible de « alla après elle ». Le point d’exclamation rend la fermeté du serment sans ajouter de contenu.
