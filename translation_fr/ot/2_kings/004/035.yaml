  text: וַ/יָּ֜שָׁב וַ/יֵּ֣לֶךְ בַּ/בַּ֗יִת אַחַ֥ת הֵ֨נָּה֙ וְ/אַחַ֣ת הֵ֔נָּה וַ/יַּ֖עַל וַ/יִּגְהַ֣ר עָלָ֑י/ו וַ/יְזוֹרֵ֤ר הַ/נַּ֨עַר֙ עַד שֶׁ֣בַע פְּעָמִ֔ים וַ/יִּפְקַ֥ח הַ/נַּ֖עַר אֶת עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/035.yaml
  text: Then he returned and walked in the house[a], once here and once there; then he went up and stretched himself over him, and the boy sneezed seven times[b], and the boy opened his eyes.
translation:
  language: fr
  text: Puis il revint et marcha de long en large dans la maison[a]. Ensuite, il remonta et se pencha sur lui[b]. Le garçon éternua sept fois, puis le garçon ouvrit les yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une fois ici et une fois là ». On peut aussi traduire : « fit les cent pas dans la maison ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « se courba sur lui » ; dans ce contexte, on peut aussi comprendre : « s’étendit sur lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Puis il revint
  rationale: Le verbe שׁוּב exprime ici le retour d’Élisée et la forme narrative fait progresser le récit ; « Puis » rend naturellement cette succession.
- source_word: וַיֵּלֶךְ בַּבַּיִת אַחַת הֵנָּה וְאַחַת הֵנָּה
  choice: marcha de long en large dans la maison
  rationale: La proposition décrit un déplacement à l’intérieur de la maison, littéralement « une fois ici et une fois là ». « De long en large » exprime clairement ce va-et-vient en français actuel, tandis que la note conserve l’image hébraïque.
- source_word: וַיַּעַל
  choice: il remonta
  rationale: Le verbe עָלָה garde son sens spatial et renvoie vraisemblablement à la chambre haute ou au lit où se trouvait l’enfant. « Remonta » convient puisque Élisée s’y était déjà rendu auparavant.
- source_word: וַיִּגְהַר עָלָיו
  choice: se pencha sur lui
  rationale: Le verbe גהר décrit le fait de se courber ou de se pencher au-dessus de quelqu’un. Cette formulation reste descriptive et n’explique pas le mécanisme du miracle.
- source_word: וַיְזוֹרֵר
  choice: éternua
  rationale: Ce verbe rare est traditionnellement et lexicalement compris au sens d’« éternuer » ; le complément numérique indique une action répétée.
- source_word: הַנַּעַר
  choice: le garçon
  rationale: נַעַר désigne ici le fils de la Shounamite. « Le garçon » est naturel, précis et respecte la désignation répétée dans l’hébreu.
- source_word: עַד שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: 'Bien que עַד puisse signifier « jusqu’à », avec le nombre d’occurrences il indique ici le total atteint : sept éternuements.'
- source_word: וַיִּפְקַח הַנַּעַר אֶת עֵינָיו
  choice: puis le garçon ouvrit les yeux
  rationale: פָּקַח עֵינַיִם est l’expression habituelle pour « ouvrir les yeux ». La répétition de « le garçon » suit l’insistance explicite du texte hébreu.
theological_decisions:
- issue: Nature du geste d’Élisée sur l’enfant
  choice: Décrire le geste par « se pencha sur lui » sans lui attribuer un mécanisme sacramentel ou magique.
  alternative: « s’étendit sur lui » ou « se courba sur lui »
  rationale: Le récit rapporte une action corporelle associée au retour de l’enfant à la vie, mais n’en explique pas le fonctionnement. La traduction conserve donc le geste et son ambiguïté sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases restent simples et accessibles. « De long en large » rend idiomatiquement le mouvement répété, tandis que la note préserve la formulation concrète de l’hébreu. La reprise de « le garçon » conserve la structure emphatique du verset.
