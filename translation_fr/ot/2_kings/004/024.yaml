  yaml_path: translation/ot/2_kings/004/024.yaml
  text: Then she saddled the donkey and said to her servant[a], “Drive on and go; do not slow down for me unless I tell you.”
translation:
  language: fr
  text: 'Puis elle sella l’ânesse et dit à son serviteur : « Conduis l’ânesse et avance ; ne ralentis pas pour moi[a], sauf si je te le dis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu est elliptique et peut se comprendre littéralement comme « ne retiens pas pour moi de monter ». Dans le contexte, il s’agit vraisemblablement de ne pas ralentir ni s’arrêter à cause d’elle pendant qu’elle est en route.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּחֲבֹשׁ הָאָתוֹן
  choice: elle sella l’ânesse
  rationale: Dans ce contexte, חבש désigne le fait de préparer une monture en la sellant. אָתוֹן désigne explicitement une ânesse, distinction que le français exprime naturellement.
- source_word: נַעֲרָהּ
  choice: son serviteur
  rationale: נַעַר peut désigner un jeune homme au service de quelqu’un. « Serviteur » exprime ici clairement sa fonction, tout en conservant le masculin du texte hébreu.
- source_word: נְהַג וָלֵךְ
  choice: Conduis-la et avance !
  rationale: נהג signifie mener ou conduire un animal, tandis que l’impératif renforcé par וָלֵךְ commande de poursuivre rapidement la route. Le pronom « la » explicite naturellement en français que l’ordre concerne l’ânesse.
- source_word: אַל תַּעֲצָר לִי לִרְכֹּב
  choice: Ne ralentis pas pour moi
  rationale: עצר peut signifier retenir, arrêter ou entraver. Avec לִי et לִרְכֹּב, la formule demande au serviteur de ne pas interrompre ni ralentir la progression de la femme pendant qu’elle monte.
- source_word: כִּי אִם אָמַרְתִּי לָךְ
  choice: sauf si je te le dis
  rationale: Après une interdiction, כִּי אִם introduit une exception. Cette formulation française rend clairement l’autorisation conditionnelle.
