base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/002.yaml
  text: And Elisha said to her[a], “What shall I do for you? Tell me, what do you have in the house?” And she said, “Your female servant has nothing at all in the house except a flask of oil.”
translation:
  language: fr
  text: 'Élisée lui dit : « Que puis-je faire pour toi ? Dis-moi, qu’as-tu chez toi ? » Elle répondit : « Ta servante n’a absolument rien chez elle, si ce n’est un petit récipient d’huile[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une fiole d’huile », « un flacon d’huile » ou « une petite cruche d’huile » ; le mot hébreu désigne un petit contenant destiné à l’huile.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: Que puis-je faire pour toi ?
  rationale: Cette formulation française naturelle rend la question délibérative concernant l’action qu’Élisée pourrait accomplir en sa faveur.
- source_word: הַגִּידִי לִי
  choice: Dis-moi
  rationale: L’impératif est rendu directement, sans ajouter de formule de politesse absente de l’hébreu.
- source_word: מַה יֶּשׁ לָכִי בַּבָּיִת
  choice: qu’as-tu chez toi ?
  rationale: La construction existentielle avec ל exprime ici la possession. « Chez toi » restitue naturellement le cadre domestique en français.
- source_word: לְשִׁפְחָתְךָ
  choice: Ta servante
  rationale: La femme parle d’elle-même à la troisième personne avec déférence. « Servante » conserve le genre féminin sans archaïsme excessif.
- source_word: אֵין ... כֹל
  choice: n’a absolument rien
  rationale: « Absolument rien » rend l’insistance produite par la négation associée à כֹל.
- source_word: כִּי אִם
  choice: si ce n’est
  rationale: Cette locution introduit naturellement en français l’unique exception à la déclaration précédente.
- source_word: אָסוּךְ שָׁמֶן
  choice: un petit récipient d’huile
  rationale: Le terme rare אָסוּךְ désigne un contenant à huile, vraisemblablement petit, mais sa forme précise est incertaine. Le choix évite de trancher arbitrairement entre fiole, flacon et cruche.
