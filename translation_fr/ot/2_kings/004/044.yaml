- from: Il plaça donc la nourriture devant eux[a]. Ils mangèrent et en laissèrent, conformément à la parole de Yahvé.
  to: Il plaça la nourriture devant eux. Ils mangèrent et en laissèrent, conformément à la parole de Yahvé.
