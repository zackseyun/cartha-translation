base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/044.yaml
  text: So he set it before them[a], and they ate and had some left over, according to the word of Yahweh.
translation:
  language: fr
  text: Il plaça la nourriture devant eux. Ils mangèrent et en laissèrent, conformément à la parole de Yahvé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: Il plaça donc la nourriture devant eux
  rationale: Littéralement « il mit/donna devant eux ». En français, « placer devant eux » exprime naturellement le fait de servir le repas. « La nourriture » explicite le complément sous-entendu fourni par le contexte immédiat.
- source_word: וַיֹּאכְלוּ
  choice: Ils mangèrent
  rationale: Traduction directe du verbe אכל dans la suite narrative.
- source_word: וַיּוֹתִרוּ
  choice: et en laissèrent
  rationale: Le hiphil de יתר indique qu’une partie resta après le repas. « En laissèrent » conserve la formulation active de l’hébreu sans préciser davantage ce qui demeura.
- source_word: כִּדְבַר
  choice: conformément à la parole de
  rationale: Cette formulation garde le nom « parole » et souligne que l’événement s’est produit en accord avec l’annonce divine.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme, plutôt qu’un titre substitutif.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom divin lui-même. La forme « Yahvé » le distingue du titre אֲדֹנָי et le rend dans l’usage français courant.
- issue: Lien entre le reste de nourriture et la parole divine
  choice: conformément à la parole de Yahvé
  alternative: comme Yahvé l’avait dit
  rationale: Le choix retenu préserve la construction nominale hébraïque « selon la parole de » ainsi que son lien explicite avec l’accomplissement de la parole divine.
translation_notes:
  register: Français moderne, naturel et digne. La syntaxe narrative reste concise. L’explicitation « la nourriture » évite un pronom sans antécédent dans un verset présenté isolément, tout en restant fidèle au contexte précédent.
