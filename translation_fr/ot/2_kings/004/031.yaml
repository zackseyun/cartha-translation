  naturalness: Le français est naturel et de registre narratif soutenu. « Guéhazi les devança et posa » est plus direct et plus fluide dans ce récit au passé. La suppression de « donc » évite d'ajouter une nuance de conséquence qui n'est pas explicitement marquée.
