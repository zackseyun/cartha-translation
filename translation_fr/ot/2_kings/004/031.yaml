  text: וְ/גֵחֲזִ֞י עָבַ֣ר לִ/פְנֵי/הֶ֗ם וַ/יָּ֤שֶׂם אֶת הַ/מִּשְׁעֶ֨נֶת֙ עַל פְּנֵ֣י הַ/נַּ֔עַר וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין קָ֑שֶׁב וַ/יָּ֤שָׁב לִ/קְרָאת/וֹ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר לֹ֥א הֵקִ֖יץ הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/031.yaml
  text: And Gehazi went on ahead of them and laid the staff on the boy’s face[a], but there was no sound and no response. So he returned to meet him and told him, saying, “The boy has not awakened.”
translation:
  language: fr
  text: 'Guéhazi les devança et posa le bâton sur le visage du garçon, mais il n’y eut ni son ni réaction.[a] Puis il revint à la rencontre d’Élisée et lui fit ce rapport : « Le garçon ne s’est pas réveillé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « il n’y eut ni voix ni écoute ».'
    reason: La note préserve les termes plus formels de l’hébreu, tandis que « ni son ni réaction » exprime naturellement leur effet dans le contexte.
lexical_decisions:
- source_word: עָבַר לִפְנֵיהֶם
  choice: les avait devancés
  rationale: Cette formulation française naturelle exprime que Guéhazi était passé devant Élisée et la mère pour arriver avant eux.
- source_word: הַמִּשְׁעֶנֶת
  choice: le bâton
  rationale: « Bâton » désigne naturellement l’objet d’Élisée en français moderne, sans la connotation disciplinaire possible de « verge ».
- source_word: עַל פְּנֵי הַנַּעַר
  choice: sur le visage du garçon
  rationale: La traduction conserve le sens concret de פָּנִים et rend נַעַר par un terme courant adapté au contexte.
- source_word: וְאֵין קוֹל וְאֵין קָשֶׁב
  choice: il n’y eut ni son ni réaction
  rationale: « Son » rend directement קוֹל, tandis que « réaction » exprime en contexte l’absence d’attention ou de réponse indiquée par קָשֶׁב; une note préserve la formulation plus littérale.
- source_word: וַיָּשָׁב לִקְרָאתוֹ
  choice: Il revint donc à la rencontre d’Élisée
  rationale: La phrase restitue le mouvement de retour de Guéhazi vers le référent masculin; le nom explicite évite une ambiguïté pronominale peu naturelle en français.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: et lui fit ce rapport
  rationale: Cette formule française digne et concise rend l’acte de rapporter, sans reproduire lourdement l’hébraïsme « annonça en disant ».
- source_word: לֹא הֵקִיץ הַנָּעַר
  choice: Le garçon ne s’est pas réveillé
  rationale: Le passé composé exprime naturellement en français le résultat constaté de la tentative, sans ajouter l’idée de résurrection absente du verbe lui-même.
theological_decisions:
- issue: Sens de הֵקִיץ dans le rapport de Guéhazi
  choice: ne s’est pas réveillé
  alternative: n’est pas revenu à la vie
  rationale: Le verbe signifie « se réveiller »; la traduction préserve la tension narrative entre sommeil et mort sans expliciter prématurément une interprétation théologique.
translation_notes:
  register: Français international moderne, narratif et digne. Le plus-que-parfait initial situe naturellement l’avance prise par Guéhazi par rapport à l’action en cours. Le nom « Élisée » explicite le référent de לִקְרָאתוֹ afin d’éviter une ambiguïté en français. Le marqueur [a] figure dans le texte principal.
