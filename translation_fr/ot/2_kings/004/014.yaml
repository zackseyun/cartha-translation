  text: So he said[a], “What then is to be done for her?” And Gehazi said, “Well, she has no son[b], and her husband is old.”
translation:
  language: fr
  text: 'Il dit alors : « Que faire donc pour elle ? » Guéhazi répondit : « Eh bien, elle n’a pas de fils[a], et son mari est âgé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « il n’y a pas de fils pour elle ».'
