lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit alors
  rationale: Le waw consécutif fait progresser le récit ; « alors » rend naturellement cette succession en français.
- source_word: וּמֶה לַעֲשׂוֹת לָהּ
  choice: Que peut-on donc faire pour elle ?
  rationale: Cette formulation française naturelle conserve la question sur l’action envisageable en faveur de la femme, sans préciser davantage l’agent implicite.
- source_word: גֵּיחֲזִי
  choice: Guéhazi
  rationale: Translittération française usuelle du nom propre.
- source_word: אֲבָל
  choice: Eh bien
  rationale: La particule introduit ici une réponse réfléchie plutôt qu’une forte opposition ; « Eh bien » en restitue la nuance conversationnelle.
- source_word: בֵּן אֵין לָהּ
  choice: elle n’a pas de fils
  rationale: La tournure possessive est idiomatique en français et בֵּן désigne précisément un fils, non un enfant de manière générale.
- source_word: וְאִישָׁהּ זָקֵן
  choice: et son mari est âgé
  rationale: Dans ce contexte, אִישׁ désigne le mari ; « est âgé » exprime dignement et directement son grand âge.
