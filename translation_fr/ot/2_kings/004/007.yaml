base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/007.yaml
  text: Then she came and told the man of God[a], and he said, “Go, sell the oil, and pay your debts[b]; and you and your sons can live on what is left.”
translation:
  language: fr
  text: 'Elle vint en informer l’homme de Dieu. Celui-ci lui dit : « Va vendre l’huile et paie ton créancier[a]. Ensuite, toi et tes fils, vous vivrez de ce qui restera[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « paie tes dettes », si la forme hébraïque désigne ce qui est dû plutôt que la personne à qui cela est dû.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « toi et tes fils, tu vivras de ce qui restera »; le verbe hébreu est au féminin singulier et s’adresse directement à la femme.'
    reason: source_form
lexical_decisions:
- source_word: וַתָּבֹא וַתַּגֵּד
  choice: Elle vint en informer
  rationale: Les deux wayyiqtol font progresser le récit. « Vint en informer » exprime naturellement en français le déplacement vers l’homme de Dieu et le fait de lui rapporter ce qui s’est passé.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Conserve le titre hébreu traditionnel sans le réduire à l’interprétation « le prophète ».
- source_word: לְכִי מִכְרִי אֶת הַשֶּׁמֶן
  choice: Va vendre l’huile
  rationale: Rend directement les deux impératifs féminins singuliers et ne précise pas « huile d’olive », détail absent de l’expression hébraïque.
- source_word: וְשַׁלְּמִי אֶת נשי/כי
  choice: et paie ton créancier
  rationale: Dans le contexte, la forme désigne naturellement la personne à qui la dette est due; le créancier est déjà mentionné au verset 1. La possibilité de comprendre l’expression comme l’obligation elle-même est signalée en note.
- source_word: וְאַתְּ בני/כי
  choice: toi et tes fils
  rationale: Préserve l’insistance du pronom « toi » et le terme masculin précis « fils ».
- source_word: תִחְיִי בַּנּוֹתָר
  choice: vous vivrez de ce qui restera
  rationale: Exprime en français courant la subsistance assurée par le produit restant, tout en conservant la valeur future de l’imparfait hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct reste simple et concret. « Celui-ci » évite une longue coordination et indique clairement que l’homme de Dieu prend la parole.
