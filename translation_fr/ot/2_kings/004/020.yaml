  yaml_path: translation/ot/2_kings/004/020.yaml
  text: And he carried him and brought him to his mother[a], and he sat on her knees until noon; then he died.
translation:
  language: fr
  text: Il le porta et l’amena à sa mère. L’enfant resta assis sur les genoux[a] de sa mère jusqu’à midi, puis il mourut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur ses cuisses » ou « dans son giron » ; l’hébreu dit littéralement « sur ses genoux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֵהוּ
  choice: Il le porta
  rationale: Le verbe נשׂא peut signifier « soulever » ou « porter » ; dans ce déplacement vers la mère, « porta » exprime naturellement l’action prolongée.
- source_word: וַיְבִיאֵהוּ
  choice: et l’amena à sa mère
  rationale: Le hifil de בוא marque le fait d’amener quelqu’un vers une destination ; « amena » conserve cette orientation.
- source_word: וַיֵּשֶׁב
  choice: L’enfant resta
  rationale: ישׁב peut signifier « s’asseoir », « demeurer » ou « rester ». Ici, « resta » rend plus naturellement en français la durée indiquée par « jusqu’à midi », sans imposer une posture autonome à l’enfant malade.
- source_word: עַל בִּרְכֶּיהָ
  choice: sur les genoux de sa mère
  rationale: Le texte hébreu dit littéralement « sur ses genoux ». La répétition de « sa mère » lève clairement l’ambiguïté du possessif en français.
- source_word: עַד הַצָּהֳרַיִם
  choice: jusqu’à midi
  rationale: צָהֳרַיִם désigne le milieu du jour ; « midi » est l’équivalent français courant et précis.
- source_word: וַיָּמֹת
  choice: puis il mourut
  rationale: Le waw narratif fait avancer la succession des événements ; « puis » l’exprime naturellement, tandis que le passé simple convient au récit biblique dans un registre digne et accessible.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La seconde proposition nomme explicitement « l’enfant » et répète « sa mère » afin d’éviter les ambiguïtés pronominales naturelles en français, sans ajouter de nouvelle information.
