source:
  edition: WLC
  text: וְ/אִשָּׁ֣ה אַחַ֣ת מִ/נְּשֵׁ֣י בְנֵֽי הַ֠/נְּבִיאִים צָעֲקָ֨ה אֶל אֱלִישָׁ֜ע לֵ/אמֹ֗ר עַבְדְּ/ךָ֤ אִישִׁ/י֙ מֵ֔ת וְ/אַתָּ֣ה יָדַ֔עְתָּ כִּ֣י עַבְדְּ/ךָ֔ הָיָ֥ה יָרֵ֖א אֶת יְהוָ֑ה וְ/הַ֨/נֹּשֶׁ֔ה בָּ֗א לָ/קַ֜חַת אֶת שְׁנֵ֧י יְלָדַ֛/י ל֖/וֹ לַ/עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/001.yaml
  text: One woman from the wives of the sons of the prophets cried out to Elisha, saying, “Your servant, my husband, has died, and you know that your servant feared Yahweh. And the creditor has come to take my two children for himself as servants.”
translation:
  language: fr
  text: 'Une femme parmi les épouses des fils des prophètes cria à Élisée : « Ton serviteur, mon mari, est mort, et tu sais que ton serviteur craignait Yahweh. Or, le créancier est venu prendre mes deux enfants[a] pour en faire ses esclaves. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes deux fils ». L’hébreu dit « mes deux enfants » ; le contexte peut permettre de comprendre plus précisément « mes deux fils ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה אַחַת מִנְּשֵׁי בְנֵי הַנְּבִיאִים
  choice: Une femme parmi les épouses des fils des prophètes
  rationale: « Une femme » introduit naturellement un personnage indéfini sans ajouter un « maintenant » absent du lexique. « Parmi les épouses » exprime l’appartenance au groupe, tandis que « fils des prophètes » conserve la désignation sociale hébraïque sans la réduire à une école ou à une corporation.
- source_word: צָעֲקָה אֶל אֱלִישָׁע לֵאמֹר
  choice: cria à Élisée
  rationale: Le verbe « cria » rend la détresse et l’urgence de צעק. En français, les deux verbes introducteurs hébreux peuvent être représentés naturellement par les deux-points.
- source_word: עַבְדְּךָ אִישִׁי מֵת
  choice: Ton serviteur, mon mari, est mort
  rationale: 'La formulation maintient les deux rapports explicités par l’hébreu : l’homme était le serviteur d’Élisée et le mari de la locutrice. « Est mort » exprime à la fois le décès accompli et sa conséquence présente.'
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: craignait Yahweh
  rationale: « Craindre Yahweh » conserve l’idiome biblique ירא את et sa portée religieuse, sans l’aplatir en simple peur ni l’interpréter uniquement comme respect.
- source_word: הַנֹּשֶׁה
  choice: le créancier
  rationale: Terme juridique et économique courant désignant celui à qui la dette est due.
- source_word: בָּא לָקַחַת
  choice: est venu prendre
  rationale: Le passé composé rend une venue accomplie dont la menace demeure immédiate dans la situation racontée.
- source_word: שְׁנֵי יְלָדַי
  choice: mes deux enfants
  rationale: יְלָדַי désigne littéralement les enfants de la femme et ne précise pas ici leur sexe; la formulation française préserve cette latitude lexicale.
- source_word: לוֹ לַעֲבָדִים
  choice: pour en faire ses esclaves
  rationale: Cette expression française rend idiomatiquement l’appropriation marquée par לוֹ et le statut servile exprimé par לַעֲבָדִים, sans atténuer ce dernier en simple service domestique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin, non un titre. « Yahweh » le rend directement plutôt que de lui substituer « le SEIGNEUR ».
- issue: Portée de l’expression יָרֵא אֶת יְהוָה
  choice: craignait Yahweh
  alternative: révérait Yahweh
  rationale: « Craignait » préserve l’idiome et sa tension entre crainte, respect et fidélité religieuse, au lieu de n’en retenir que la révérence.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe du discours direct reste simple et pressante. « Fils des prophètes » est volontairement conservé comme désignation historique du groupe prophétique; « esclaves » maintient sans euphémisme la dureté de la menace.
