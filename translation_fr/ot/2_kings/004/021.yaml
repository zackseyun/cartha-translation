  yaml_path: translation/ot/2_kings/004/021.yaml
  text: Then she went up and laid him on the bed of the man of God[a], shut the door behind him[b], and went out.
translation:
  language: fr
  text: Puis elle monta, le coucha sur le lit de l’homme de Dieu, ferma la porte sur lui et sortit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַל
  choice: Puis elle monta
  rationale: Le verbe עלה exprime un mouvement vers le haut, probablement vers la chambre haute du contexte. « Puis » rend naturellement la progression narrative.
- source_word: וַתַּשְׁכִּבֵהוּ
  choice: le coucha
  rationale: La forme causative de שׁכב signifie qu’elle le fit se coucher ou le déposa en position couchée. « Le coucha » est naturel, concis et précis en français.
- source_word: עַל מִטַּת
  choice: sur le lit
  rationale: מִטָּה désigne normalement un lit ou une couche, et עַל indique ici la position « sur ».
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Cette traduction directe conserve le titre hébreu sans le préciser par interprétation en « prophète ».
- source_word: וַתִּסְגֹּר בַּעֲדוֹ
  choice: referma la porte sur lui
  rationale: Avec סגר, בְּעַד indique qu’elle ferme l’accès en laissant le garçon à l’intérieur. La porte, non exprimée séparément en hébreu, est naturellement sous-entendue. « Referma » convient à une porte déjà ouverte pour entrer.
- source_word: וַתֵּצֵא
  choice: et sortit
  rationale: יצא signifie « sortir ». La formulation conserve le mouvement concret sans ajouter de destination.
