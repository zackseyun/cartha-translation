  source_fidelity: La traduction rend fidèlement la séquence narrative, la chute aux pieds d’Élisée, la prosternation, la prise du fils et la sortie. Toutefois, « entra » précise un mouvement d’entrée que le verbe וַתָּבֹא (« elle vint ») n’explicite pas dans ce verset.
  naturalness: « Se prosterna jusqu’à terre » est compréhensible, mais « se prosterna à terre » est plus idiomatique en français moderne tout en conservant la force du geste.
  terminology: « Se prosterna » rend bien וַתִּשְׁתַּחוּ sans imposer le sens cultuel d’« adorer ». « Élisée » est correctement employé dans la note. La note conserve utilement l’alternative lexicale et son ancrage.
  issues:
