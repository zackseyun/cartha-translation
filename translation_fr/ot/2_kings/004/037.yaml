  yaml_path: translation/ot/2_kings/004/037.yaml
  text: Then she came and fell at his feet and bowed to the ground[a]. Then she picked up her son and went out.
translation:
  language: fr
  text: Alors elle vint, tomba à ses pieds et se prosterna à terre[a]. Puis elle prit son fils et sortit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’inclina jusqu’à terre ». Le verbe hébreu peut aussi signifier « adorer » dans certains contextes ; ici, il désigne vraisemblablement un geste de profond respect devant Élisée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Alors elle entra
  rationale: Le waw consécutif fait avancer le récit. Dans le contexte immédiat, elle entre auprès d’Élisée; « entra » rend naturellement le mouvement sans répéter systématiquement « et ».
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: tomba à ses pieds
  rationale: Cette formulation française idiomatique conserve le geste de supplication et de profonde reconnaissance exprimé par l’hébreu.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: se prosterna jusqu’à terre
  rationale: Le verbe שׁחה désigne ici un profond geste d’hommage devant Élisée. « Se prosterna » préserve l’intensité physique du geste sans imposer le sens cultuel d’« adorer ».
- source_word: וַתִּשָּׂא אֶת בְּנָהּ
  choice: elle prit son fils
  rationale: נשא peut signifier lever, porter ou prendre. « Prit son fils » est naturel en français et laisse ouverte la manière précise dont elle l’a pris.
- source_word: וַתֵּצֵא
  choice: sortit
  rationale: Rend directement et sobrement le mouvement exprimé par יצא.
theological_decisions:
- issue: Sens de וַתִּשְׁתַּחוּ devant Élisée
  choice: Décrire un geste de prosternation et de profond respect
  alternative: « adora », lecture possible du même verbe dans certains contextes cultuels
  rationale: Le contexte présente un hommage reconnaissant adressé à Élisée. La traduction conserve le geste et la portée révérencielle sans affirmer qu’il s’agit d’une adoration divine.
translation_notes:
  register: Français international moderne, simple et digne. La succession narrative est fluide, tandis que la prosternation est rendue avec sa force concrète et son ambiguïté contextuelle.
