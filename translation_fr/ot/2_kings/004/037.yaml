    rationale: Le texte hébreu dit simplement qu’elle vint. Le contexte peut suggérer une entrée, mais le verset ne l’exprime pas explicitement; « vint » préserve donc mieux le degré de précision de la source.
  - severity: low
    issue: « se prosterna jusqu’à terre » est moins idiomatique.
    rationale: En français, « se prosterner à terre » est la formulation habituelle. Elle exprime adéquatement la prosternation marquée par le verbe hébreu et l’adverbe « vers la terre ».
