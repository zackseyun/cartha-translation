  text: וַ/תָּבֹ֞א אֶל אִ֤ישׁ הָֽ/אֱלֹהִים֙ אֶל הָ/הָ֔ר וַֽ/תַּחֲזֵ֖ק בְּ/רַגְלָ֑י/ו וַ/יִּגַּ֨שׁ גֵּֽיחֲזִ֜י לְ/הָדְפָ֗/הּ וַ/יֹּאמֶר֩ אִ֨ישׁ הָ/אֱלֹהִ֤ים הַרְפֵּֽה לָ/הּ֙ כִּֽי נַפְשָׁ֣/הּ מָֽרָה לָ֔/הּ וַֽ/יהוָה֙ הֶעְלִ֣ים מִמֶּ֔/נִּי וְ/לֹ֥א הִגִּ֖יד לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/027.yaml
  text: When she came to the man of God at the mountain[a], she took hold of his feet. Gehazi came near to push her away, but the man of God said, “Leave her alone, for her soul is bitter within her[b], and Yahweh has hidden it from me and has not told me.”
translation:
  language: fr
  text: 'Lorsqu’elle arriva auprès de l’homme de Dieu, sur la montagne, elle s’agrippa à ses pieds. Guéhazi s’approcha pour la repousser, mais l’homme de Dieu dit : « Laisse-la, car elle a l’âme amère[a]. Yahweh me l’a caché et ne me l’a pas fait savoir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son âme est amère pour elle » ; cette expression hébraïque décrit une profonde détresse intérieure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Conserve littéralement le titre hébreu habituel d’un prophète sans le remplacer par une désignation interprétative.
- source_word: אֶל הָהָר
  choice: sur la montagne
  rationale: Dans le contexte de l’arrivée auprès d’Élisée, cette formulation situe naturellement l’homme de Dieu sur la montagne sans préciser davantage le relief.
- source_word: וַתַּחֲזֵק בְּרַגְלָיו
  choice: elle s’agrippa à ses pieds
  rationale: Le verbe חזק avec ב exprime ici une prise ferme. « S’agripper » restitue l’urgence du geste dans un français naturel.
- source_word: וַיִּגַּשׁ
  choice: s’approcha
  rationale: Rend directement le mouvement d’approche dans le fil du récit.
- source_word: לְהָדְפָהּ
  choice: pour la repousser
  rationale: Le verbe הדף évoque une action physique visant à l’écarter; « repousser » en conserve la force sans exagération.
- source_word: הַרְפֵּה לָהּ
  choice: Laisse-la
  rationale: Dans ce contexte, l’impératif demande à Guéhazi de cesser d’intervenir contre elle.
- source_word: נַפְשָׁהּ מָרָה לָהּ
  choice: son âme est dans l’amertume
  rationale: Préserve à la fois le terme anthropologique נֶפֶשׁ et l’image hébraïque de l’amertume, tandis qu’une note en explicite la valeur affective.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: הֶעְלִים מִמֶּנִּי
  choice: me l’a caché
  rationale: Rend directement le causatif de עלם et l’idée que cette réalité n’a pas été portée à la connaissance d’Élisée.
- source_word: וְלֹא הִגִּיד לִי
  choice: ne me l’a pas fait savoir
  rationale: Expression française naturelle qui conserve le parallélisme avec l’idée précédente de non-divulgation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin; sa transcription préserve cette donnée plutôt que de la remplacer par un titre.
- issue: Portée anthropologique et affective de נַפְשָׁהּ מָרָה לָהּ
  choice: son âme est dans l’amertume
  alternative: elle est dans une profonde détresse
  rationale: Le choix principal garde l’image et le terme du texte hébreu sans réduire נֶפֶשׁ à un simple pronom; la note prévient une lecture limitée au ressentiment.
- issue: Connaissance prophétique d’Élisée
  choice: Yahweh me l’a caché et ne me l’a pas fait savoir
  alternative: Yahweh ne me l’a pas révélé
  rationale: La formulation maintient les deux verbes du texte et l’aveu explicite d’une connaissance qui dépend de ce que Dieu communique, sans élaborer une doctrine supplémentaire.
translation_notes:
  register: Français international moderne, narratif et digne. « S’agrippa » rend le geste avec naturel et intensité; l’expression plus proche de l’hébreu « son âme est dans l’amertume » est conservée et expliquée en note.
