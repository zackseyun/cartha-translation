  terminology: « L’homme de Dieu », « Guéhazi » et « Yahweh » sont cohérents avec la source. « Laisse-la » rend bien l’impératif de ne plus intervenir. La note explique utilement l’idiome sans lui imposer une interprétation doctrinale.
