base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/038.yaml
  text: And Elisha returned to Gilgal[a], and there was a famine in the land. Now the sons of the prophets were sitting before him, and he said to his servant, “Put on the large pot and boil stew for the sons of the prophets.”
translation:
  language: fr
  text: 'Élisée revint à Guilgal alors que la famine sévissait dans le pays. Les fils des prophètes[a] étaient assis devant lui. Il dit à son serviteur : « Mets la grande marmite sur le feu et prépare un ragoût pour les fils des prophètes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les disciples des prophètes » ; l’expression désigne les membres d’une communauté prophétique.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: revint
  rationale: Le qal parfait de שׁוב exprime ici le retour à un lieu antérieur ; « revint » est naturel et concis.
- source_word: הַגִּלְגָּלָה
  choice: à Guilgal
  rationale: Le hé directionnel indique un mouvement vers Guilgal, rendu idiomatiquement par « à » après le verbe revenir.
- source_word: וְהָרָעָב בָּאָרֶץ
  choice: alors que la famine sévissait dans le pays
  rationale: La proposition nominale fournit l’arrière-plan circonstanciel. « Sévissait » exprime naturellement en français une famine en cours sans modifier le sens.
- source_word: בְנֵי הַנְּבִיאִים
  choice: les fils des prophètes
  rationale: La traduction conserve l’expression familiale hébraïque, tandis qu’une note en explique le sens communautaire ou formatif.
- source_word: יֹשְׁבִים לְפָנָיו
  choice: étaient assis devant lui
  rationale: Le participe décrit une situation en cours ; « devant lui » conserve à la fois la disposition spatiale et la possible relation de disciples à maître.
- source_word: לְנַעֲרוֹ
  choice: à son serviteur
  rationale: נַעַר peut désigner un jeune homme ou un assistant ; la tâche confiée favorise ici « serviteur ».
- source_word: שְׁפֹת הַסִּיר הַגְּדוֹלָה
  choice: Mets la grande marmite sur le feu
  rationale: Le verbe שפת signifie mettre le récipient à cuire ; l’ajout explicite « sur le feu » rend l’action clairement et naturellement en français.
- source_word: וּבַשֵּׁל נָזִיד
  choice: et prépare un ragoût
  rationale: בשׁל couvre l’idée de faire cuire ou bouillir. Avec נָזִיד, « préparer un ragoût » est plus idiomatique que « faire bouillir un ragoût » tout en conservant l’action culinaire.
theological_decisions:
- issue: Sens de l’expression בְנֵי הַנְּבִיאִים
  choice: les fils des prophètes
  alternative: les disciples des prophètes
  rationale: Le texte principal préserve l’image hébraïque et son ambiguïté institutionnelle ; la note précise qu’il s’agit vraisemblablement des membres d’une communauté prophétique, sans imposer une structure plus définie que le texte.
translation_notes:
  register: Français international moderne, narratif et digne. « Marmite » et « ragoût » sont courants et précis. La syntaxe est légèrement segmentée pour la clarté, sans perdre les relations du texte hébreu.
