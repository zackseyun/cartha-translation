  text: וַ/יָּבֹ֥א אֱלִישָׁ֖ע הַ/בָּ֑יְתָ/ה וְ/הִנֵּ֤ה הַ/נַּ֨עַר֙ מֵ֔ת מֻשְׁכָּ֖ב עַל מִטָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/032.yaml
  text: When Elisha came into the house[a], behold, the boy was dead, laid on his bed.
translation:
  language: fr
  text: Élisée entra dans la maison, et voici que le garçon était mort, étendu[a] sur son lit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couché ». Le participe hébreu décrit le garçon dans l’état d’une personne étendue ou couchée là.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entra
  rationale: Le wayyiqtol fait progresser le récit. Avec הַבָּיְתָה, « entra dans » exprime naturellement en français le mouvement vers l’intérieur de la maison.
- source_word: אֱלִישָׁע
  choice: Élisée
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הַבָּיְתָה
  choice: dans la maison
  rationale: Le ה directionnel indique un mouvement vers la maison ou à l’intérieur de celle-ci; « dans la maison », associé à « entra », en rend clairement le sens spatial.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette tournure conserve la présentation vive et soudaine marquée par הִנֵּה, dans un registre narratif digne mais compréhensible.
- source_word: הַנַּעַר
  choice: le garçon
  rationale: Dans ce contexte, נַעַר désigne le fils de la Sunamite; « garçon » est plus précis et naturel que « jeune homme » ou « serviteur ».
- source_word: מֵת
  choice: était mort
  rationale: La forme décrit l’état constaté du garçon à l’arrivée d’Élisée, plutôt que l’événement antérieur de sa mort.
- source_word: מֻשְׁכָּב
  choice: étendu
  rationale: Le participe passif exprime l’état résultant d’une personne que l’on a étendue ou déposée. « Étendu » préserve cette nuance tout en restant naturel.
- source_word: עַל מִטָּתוֹ
  choice: sur son lit
  rationale: Traduction directe et idiomatique de la relation spatiale et du suffixe possessif.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici que » maintient l’effet de découverte de l’hébreu sans recourir à l’archaïque « voici » employé seul comme interjection.
