  text: וַ/יִּכְרֹ֨ת יְהוֹיָדָ֜ע אֶֽת הַ/בְּרִ֗ית בֵּ֤ין יְהוָה֙ וּ/בֵ֤ין הַ/מֶּ֨לֶךְ֙ וּ/בֵ֣ין הָ/עָ֔ם לִ/הְי֥וֹת לְ/עָ֖ם לַֽ/יהוָ֑ה וּ/בֵ֥ין הַ/מֶּ֖לֶךְ וּ/בֵ֥ין הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/017.yaml
  text: Then Jehoiada made the covenant between Yahweh and the king and the people[a], that they should be a people for Yahweh[b], and also between the king and the people.
translation:
  language: fr
  text: Alors Jojada conclut l’alliance entre Yahweh, le roi et le peuple[a], afin qu’ils soient un peuple pour Yahweh[b], ainsi qu’entre le roi et le peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « coupa l’alliance », expression courante qui signifie « conclut l’alliance ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « afin qu’ils soient le peuple de Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: conclut
  rationale: L’expression hébraïque כרת ברית, littéralement « couper une alliance », est l’idiome habituel pour conclure ou établir une alliance. « Conclut » est naturel en français et conserve la portée formelle de l’acte.
- source_word: הַבְּרִית
  choice: l’alliance
  rationale: L’article défini est présent, et « alliance » rend la force institutionnelle et théologique de ברית mieux qu’« accord ».
- source_word: בֵּין יְהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: entre Yahweh, le roi et le peuple
  rationale: La répétition de בֵּין désigne les parties concernées. Cette formulation française fluide maintient la relation tripartite sans lourdeur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: afin qu’ils soient un peuple pour Yahweh
  rationale: La proposition infinitive exprime le but ou le résultat de l’alliance. Cette formulation conserve la construction relationnelle de l’hébreu sans la réduire d’emblée à un possessif.
- source_word: וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: Il conclut aussi une alliance entre le roi et le peuple
  rationale: La reprise explicite du verbe et du nom en français clarifie qu’une relation d’alliance entre le roi et le peuple s’ajoute à la première, sans changer le sens.
- source_word: הָעָם
  choice: le peuple
  rationale: « Le peuple » est le rendu français courant et transparent du collectif עָם dans ce contexte d’alliance.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie le nom divin; « Yahweh » le représente directement et en maintient la résonance d’alliance.
- issue: Sens de la formule לִהְיוֹת לְעָם לַיהוָה
  choice: un peuple pour Yahweh
  alternative: le peuple de Yahweh
  rationale: Le possessif exprime correctement l’appartenance implicite, mais la formulation retenue préserve davantage la forme relationnelle et la tension de l’hébreu.
- issue: Rapport entre les deux alliances mentionnées
  choice: présenter distinctement l’alliance tripartite et celle entre le roi et le peuple
  alternative: comprendre une seule alliance englobant toutes les parties
  rationale: La répétition de וּבֵין après la proposition de but signale une relation supplémentaire entre le roi et le peuple; la traduction la rend claire sans trancher au-delà de la syntaxe.
translation_notes:
  register: Français international moderne, digne et accessible. « Joad » suit la forme française biblique usuelle de Jehoiada. La seconde proposition devient une phrase indépendante afin d’éviter une coordination française ambiguë, tout en conservant la structure logique du verset.
