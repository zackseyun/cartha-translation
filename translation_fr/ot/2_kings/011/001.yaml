  text: וַֽ/עֲתַלְיָה֙ אֵ֣ם אֲחַזְיָ֔הוּ ו/ראתה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֨קָם֙ וַ/תְּאַבֵּ֔ד אֵ֖ת כָּל זֶ֥רַע הַ/מַּמְלָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/001.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, so she arose and destroyed all the royal offspring.
translation:
  language: fr
  text: Athalie, mère d’Ahazia, vit que son fils était mort. Alors elle se leva et fit périr toute la descendance royale.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute la semence du royaume », c’est-à-dire la lignée ou les descendants de la famille royale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲתַלְיָה
  choice: Athalie
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante. Le waw narratif n’est pas traduit par un marqueur temporel explicite absent de l’hébreu.
- source_word: אֵם אֲחַזְיָהוּ
  choice: mère d’Ahazia
  rationale: La chaîne construite identifie Athalie par son lien maternel avec Ahazia, dans une formulation française naturelle.
- source_word: וַתֵּרֶא כִּי מֵת בְּנָהּ
  choice: vit que son fils était mort
  rationale: La construction exprime la constatation d’un fait; « était mort » conserve la valeur résultative de מֵת.
- source_word: וַתָּקָם
  choice: Alors elle entreprit
  rationale: Dans ce récit, קום marque le passage résolu à l’action plutôt que le simple fait de se lever physiquement. « Alors » rend l’enchaînement narratif sans ajouter une causalité trop forte.
- source_word: וַתְּאַבֵּד
  choice: de faire périr
  rationale: Le piel de אבד signifie causer la perte ou la destruction. « Faire périr » exprime ici l’élimination meurtrière sans préciser un mode d’exécution absent du texte.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: toute la descendance royale
  rationale: זֶרַע signifie littéralement « semence », mais désigne ici les descendants; הַמַּמְלָכָה précise leur appartenance à la lignée dynastique.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation évite l’archaïsme « se leva » lorsqu’il pourrait suggérer un simple mouvement corporel, tout en maintenant la progression énergique du récit.
