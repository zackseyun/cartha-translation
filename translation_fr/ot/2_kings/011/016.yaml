  yaml_path: translation/ot/2_kings/011/016.yaml
  text: So they laid hands on her[a], and she went by the way of the horses’ entrance to the king’s house[b], and there she was put to death.
translation:
  language: fr
  text: Ils se saisirent d’elle[a]. Elle passa par le chemin de l’entrée des chevaux, à la maison du roi[b], et là, elle fut mise à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils mirent les mains sur elle ». On peut aussi traduire : « ils l’arrêtèrent ». Certains comprennent toutefois l’expression au sens de « ils lui firent place ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le chemin de l’entrée des chevaux, [de] la maison du roi ». L’expression peut désigner la voie d’accès ou l’entrée par laquelle les chevaux pénétraient dans l’enceinte du palais.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: Ils se saisirent d’elle
  rationale: L’expression hébraïque signifie littéralement qu’ils mirent les mains sur elle. Dans ce contexte d’arrestation, « se saisirent d’elle » en exprime naturellement le sens en français sans suggérer qu’ils la frappèrent.
- source_word: וַתָּבֹא
  choice: Elle passa
  rationale: Le verbe בוא décrit ici le déplacement d’Athalie depuis l’enceinte du temple vers le palais. « Elle passa » s’accorde naturellement avec l’itinéraire introduit par דֶּרֶךְ, sans imposer le passif interprétatif « elle fut conduite ».
- source_word: דֶּרֶךְ מְבוֹא הַסּוּסִים
  choice: par le chemin de l’entrée des chevaux
  rationale: Cette formulation conserve à la fois la notion de chemin ou d’itinéraire portée par דֶּרֶךְ et celle d’entrée portée par מְבוֹא, sans préciser indûment qu’il s’agissait d’une porte particulière.
- source_word: בֵּית הַמֶּלֶךְ
  choice: jusqu’au palais royal
  rationale: Littéralement « maison du roi » ; dans ce contexte, l’expression désigne le palais. « Palais royal » est clair et naturel en français moderne.
- source_word: וַתּוּמַת
  choice: elle fut mise à mort
  rationale: 'La forme hophal de מות a une valeur causative passive : elle fut tuée ou exécutée. « Fut mise à mort » conserve cette force et convient au contexte d’une exécution ordonnée.'
- source_word: שָׁם
  choice: là
  rationale: L’adverbe localise explicitement la mise à mort au lieu qui vient d’être mentionné.
theological_decisions: []
translation_notes:
  register: 'Français moderne, digne et narratif. La traduction privilégie une équivalence optimale : elle rend explicitement le palais visé par « maison du roi », tout en conservant la formulation concrète et relativement indéterminée « entrée des chevaux ».'
