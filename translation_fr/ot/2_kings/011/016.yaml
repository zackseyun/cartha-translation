    issue: Ajout de « donc »
    rationale: Le waw narratif relie les actions sans marquer nécessairement une conséquence. « Donc » introduit une inférence absente du texte.
  - severity: medium
    issue: « jusqu’au palais royal » interprète et réorganise la relation spatiale
    rationale: Le texte dit littéralement « le chemin de l’entrée des chevaux [de/la] maison du roi ». « Jusqu’au » présente le palais comme terme explicite du déplacement, tandis que « palais royal » remplace « maison du roi ». Cette interprétation est plausible, mais une formulation plus proche conserve mieux l’ambiguïté structurelle.
  - severity: low
    issue: Note b ne correspond pas entièrement à l’ancrage de la traduction
    rationale: 'La note commence par « Littéralement : la maison du roi », alors que le texte traduit « palais royal ». En rétablissant « maison du roi » dans le texte, l’ancrage et la note deviennent cohérents.'
  revised_text: Ils se saisirent d’elle[a]. Elle passa par le chemin de l’entrée des chevaux, à la maison du roi[b], et là, elle fut mise à mort.
