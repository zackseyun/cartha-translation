revisions:
- from: Ils se saisirent donc d’elle[a]. Elle passa par le chemin de l’entrée des chevaux jusqu’au palais royal[b], et là, elle fut mise à mort.
  to: Ils se saisirent d’elle[a]. Elle passa par le chemin de l’entrée des chevaux, à la maison du roi[b], et là, elle fut mise à mort.
  rationale: La révision supprime l’inférence « donc » et évite de présenter « le palais royal » comme le terme explicitement indiqué par « jusqu’à ». Elle conserve les termes « chemin », « entrée des chevaux » et « maison du roi », tout en laissant à la note l’identification contextuelle probable avec l’enceinte du palais. Le texte reste naturel et ne force pas une analyse syntaxique contestable de la chaîne nominale hébraïque.
