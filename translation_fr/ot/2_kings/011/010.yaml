id: 2KI.11.10
reference: 2 Kings 11:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/כֹּהֵ֜ן לְ/שָׂרֵ֣י ה/מאיות אֶֽת הַ/חֲנִית֙ וְ/אֶת הַ/שְּׁלָטִ֔ים אֲשֶׁ֖ר לַ/מֶּ֣לֶךְ דָּוִ֑ד אֲשֶׁ֖ר בְּ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/010.yaml
  text: Then the priest gave to the commanders of hundreds the spears and the shields that had belonged to King David[b][a], which were in the house of Yahweh.
translation:
  language: fr
  text: Puis le prêtre remit aux commandants des unités de cent hommes les lances[a] et les boucliers qui avaient appartenu au roi David et qui se trouvaient dans la maison de Yahvé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « la lance »; le singulier peut avoir ici un sens collectif.
    reason: lexical_alternative
  - marker: b
    text: 'C’est-à-dire dans le temple de Yahvé. Littéralement : « dans la maison de Yahvé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Puis ... remit
  rationale: Le waw consécutif fait avancer le récit. « Puis » marque naturellement la succession, et « remit » convient au transfert d’armes confiées aux commandants.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Traduction directe du nom singulier défini.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: aux commandants des unités de cent hommes
  rationale: L’expression désigne les chefs militaires placés à la tête de groupes de cent hommes. Cette formulation est plus immédiatement compréhensible en français moderne que le calque « chefs de centaines ».
- source_word: הַחֲנִית
  choice: les lances
  rationale: Bien que le mot hébreu soit morphologiquement au singulier, il peut avoir ici un sens collectif. Le pluriel s’accorde avec la distribution d’armes à plusieurs commandants et avec le pluriel « boucliers ».
- source_word: הַשְּׁלָטִים
  choice: les boucliers
  rationale: Dans ce contexte d’armement royal conservé dans le sanctuaire, le terme désigne très probablement des boucliers ou un équipement défensif; « boucliers » est la traduction la mieux établie.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִד
  choice: qui avaient appartenu au roi David
  rationale: La tournure hébraïque exprime la possession. Le plus-que-parfait rend naturellement le fait que ces armes de David étaient désormais conservées dans le sanctuaire.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahvé
  rationale: La traduction conserve l’image hébraïque de la « maison » de Yahvé, tout en signalant en note que le temple est visé.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est rendu directement sous sa forme française courante, plutôt que remplacé par un titre.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » préserve le nom propre divin et constitue sa forme courante en français.
- issue: Singulier grammatical ou sens collectif de הַחֲנִית
  choice: les lances
  alternative: la lance
  rationale: Le singulier hébreu est préservé comme possibilité en note, mais le contexte de plusieurs responsables recevant un ensemble d’armes favorise un emploi collectif.
translation_notes:
  register: Français international moderne, clair et digne. La formulation militaire explicite le sens de « chefs de centaines » sans archaïsme, tandis que « maison de Yahvé » conserve l’image du texte source; la note en précise le référent.
