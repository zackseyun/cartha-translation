  text: וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ/ן הַ/שְּׁלִשִׁ֤ית מִ/כֶּם֙ בָּאֵ֣י הַ/שַּׁבָּ֔ת וְ/שֹׁ֣מְרֵ֔י מִשְׁמֶ֖רֶת בֵּ֥ית הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/005.yaml
  text: 'And he commanded them[a], saying, “This is the thing that you shall do: one third of you who come on the Sabbath shall keep watch over the king’s house,”'
translation:
  language: fr
  text: 'Il leur donna cet ordre : « Voici ce que vous ferez : un tiers d’entre vous qui prenez votre service le jour du sabbat assurera la garde de la maison du roi[a], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du palais royal ». L’hébreu dit littéralement « de la maison du roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֵּם לֵאמֹר
  choice: Il leur donna cet ordre
  rationale: Cette formulation française naturelle conserve l’autorité du piel de צוה et rend idiomatiquement la formule introductive לֵאמֹר.
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּן
  choice: Voici ce que vous ferez
  rationale: Rend fidèlement la construction démonstrative et la valeur directive de l’imparfait, dans un français actuel et digne.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: un tiers d’entre vous
  rationale: Expression fractionnaire idiomatique en français, avec une valeur collective singulière.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: qui prenez votre service le jour du sabbat
  rationale: Dans ce contexte de relève des gardes, בוא désigne ceux qui arrivent pour entrer en fonction; la formulation explicite ce sens contextuel sans modifier le moment indiqué.
- source_word: וְשֹׁמְרֵי מִשְׁמֶרֶת
  choice: assurera la garde
  rationale: Rend naturellement en français l’expression hébraïque de garde ou de faction et conserve la force prescriptive de l’instruction.
- source_word: בֵּית הַמֶּלֶךְ
  choice: la maison du roi
  rationale: Conserve l’expression hébraïque littérale sans imposer le sens contextuel plus précis de palais royal.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Prenez votre service » rend le contexte d’une relève de garde le jour du sabbat; le singulier « assurera » s’accorde avec le collectif « un tiers ».
