base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/012.yaml
  text: Then he brought out the king’s son and put the crown on him and gave him the testimony[a], and they made him king and anointed him; and they clapped their hands and said, “Long live the king!”
translation:
  language: fr
  text: 'Alors il fit sortir le fils du roi, posa sur lui la couronne et lui remit le témoignage[a]. Ils le firent roi et l’oignirent. Puis ils frappèrent des mains et dirent : « Vive le roi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le document de l’alliance » ou « le décret » ; l’hébreu porte « le témoignage », probablement un document écrit servant d’attestation et lié à l’exercice de la royauté.
    reason: 'Alternative lexicale : le référent précis de הָעֵדוּת n’est pas explicitement identifié.'
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: il fit sortir
  rationale: Le hifil de יצא exprime l’action de faire sortir. Cette formulation française conserve clairement la valeur causative.
- source_word: בֶּן־הַמֶּלֶךְ
  choice: le fils du roi
  rationale: Traduction naturelle et directe de la chaîne construite hébraïque.
- source_word: הַנֵּזֶר
  choice: la couronne
  rationale: Dans ce contexte royal, נֵזֶר désigne l’insigne de la royauté. « Couronne » est plus courant et accessible que « diadème ».
- source_word: הָעֵדוּת
  choice: le témoignage
  rationale: Le nom signifie littéralement « témoignage » ou « attestation ». Le contexte peut évoquer un document lié aux obligations royales, mais le texte hébreu ne le précise pas davantage.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: ils le proclamèrent roi
  rationale: Le hifil de מלך signifie établir quelqu’un comme roi. « Proclamèrent roi » rend naturellement la cérémonie d’intronisation sans répéter l’idée de la couronne.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: lui donnèrent l’onction
  rationale: Cette expression française rend l’acte officiel d’oindre le roi tout en restant claire dans le contexte cérémoniel.
- source_word: וַיַּכּוּ כָף
  choice: ils applaudirent
  rationale: L’expression hébraïque signifie littéralement frapper des mains. Dans cette scène d’acclamation publique, « applaudirent » en donne l’équivalent idiomatique naturel.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Vive le roi !
  rationale: Formule française consacrée qui restitue exactement la force de l’acclamation royale au jussif.
theological_decisions:
- issue: Sens de הָעֵדוּת dans la scène du couronnement
  choice: « le témoignage » dans le texte principal
  alternative: « le document de l’alliance » ou « le décret »
  rationale: Le terme peut désigner un document attestant les obligations de l’alliance, éventuellement la loi destinée au roi, mais l’hébreu dit seulement « le témoignage ». La traduction principale conserve cette indétermination et la note présente les interprétations contextuelles possibles.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases ont été légèrement segmentées pour une lecture naturelle. « Vive le roi ! » conserve la formule publique d’acclamation, tandis que la note maintient l’ambiguïté du terme technique הָעֵדוּת.
