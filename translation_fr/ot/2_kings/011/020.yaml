base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/020.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. As for Athaliah, they put her to death with the sword at the king’s house.
translation:
  language: fr
  text: Tout le peuple du pays se réjouit, et la ville fut tranquille. Quant à Athalie, on la mit à mort par l’épée à la maison du roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au palais royal ». Litt. « maison du roi ». L’expression hébraïque finale est concise et peut recevoir en français des nuances légèrement différentes quant au lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: se réjouit
  rationale: Le verbe שׂמח exprime la joie. « Se réjouit » conserve pleinement cette force et convient naturellement au sujet collectif.
- source_word: כָּל עַם הָאָרֶץ
  choice: tout le peuple du pays
  rationale: Cette traduction garde l’expression hébraïque et sa possible portée sociopolitique, sans la réduire à la seule population en général.
- source_word: וְהָעִיר שָׁקָטָה
  choice: et la ville retrouva le calme
  rationale: שׁקט évoque le calme et la fin des troubles. La formulation française rend naturellement le retour à une situation paisible sans surinterpréter le terme.
- source_word: וְאֶת עֲתַלְיָהוּ
  choice: Quant à Athalie
  rationale: L’objet placé en tête avec אֵת produit un léger effet de mise en relief et de changement de sujet, bien rendu en français par « Quant à ».
- source_word: הֵמִיתוּ
  choice: on la mit à mort
  rationale: Le hiphil de מות signifie « faire mourir, mettre à mort ». Le pronom indéfini « on » restitue naturellement le sujet pluriel non exprimé en français.
- source_word: בַחֶרֶב
  choice: par l’épée
  rationale: Le beth a ici une valeur instrumentale. « Par l’épée » maintient l’instrument précis et le ton solennel du récit.
- source_word: בֵּית מלך
  choice: à la maison du roi
  rationale: La traduction reste proche du sens littéral « maison du roi » et rend prudemment la valeur locative de l’expression compacte; « palais royal » demeure une équivalence contextuelle possible.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le rythme narratif est conservé, ainsi que la mise en relief d’Athalie. « Retrouva le calme » est plus idiomatique que « fut calme » tout en restant fidèle au contexte de cessation des troubles.
