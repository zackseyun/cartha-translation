  text: וּ/שְׁתֵּ֤י הַ/יָּדוֹת֙ בָּ/כֶ֔ם כֹּ֖ל יֹצְאֵ֣י הַ/שַּׁבָּ֑ת וְ/שָֽׁמְר֛וּ אֶת מִשְׁמֶ֥רֶת בֵּית יְהוָ֖ה אֶל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/007.yaml
  text: And the two divisions among you[a], all who go off duty on the Sabbath[c][b], shall keep watch over the house of Yahweh for the king.
translation:
  language: fr
  text: Les deux groupes parmi vous[a], c’est-à-dire tous ceux qui quittent leur service le jour du sabbat[b], monteront la garde à la maison de Yahweh pour le roi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les deux mains parmi vous » ; l’expression désigne vraisemblablement deux groupes ou deux unités.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tous ceux qui sortent le jour du sabbat ». Dans ce contexte, il s’agit probablement des gardes qui terminent leur service lors du changement d’équipe du sabbat.'
    reason: alternative_reading
  - marker: c
    text: Littéralement, la préposition peut se traduire par « vers le roi ». La formulation hébraïque est difficile ; dans le contexte, la maison de Yahweh doit être gardée en vue de protéger le roi.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁתֵּי הַיָּדוֹת
  choice: les deux groupes
  rationale: L’expression signifie littéralement « les deux mains », mais יָד peut désigner ici une partie ou une section d’un corps organisé. « Groupes » exprime clairement les deux unités de gardes sans conserver un calque obscur.
- source_word: בָּכֶם
  choice: parmi vous
  rationale: La préposition avec le pronom de deuxième personne du pluriel indique que ces deux groupes appartiennent à l’ensemble des hommes auxquels Yehoyada s’adresse.
- source_word: כֹּל יֹצְאֵי הַשַּׁבָּת
  choice: tous ceux qui quittent leur service le jour du sabbat
  rationale: Littéralement, il s’agit de « tous ceux qui sortent le sabbat ». Dans le contexte du changement de garde décrit aux versets voisins, l’expression désigne ceux dont le service se termine ce jour-là.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  choice: monteront la garde
  rationale: Le verbe שׁמר et le nom apparenté מִשְׁמֶרֶת forment une expression de surveillance. « Monter la garde » rend naturellement cette idée et conserve la valeur injonctive du contexte.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Le texte dit littéralement « la maison de Yahweh ». « Maison » reste proche de l’hébreu tout en désignant clairement le sanctuaire dans ce contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin, plutôt que par un titre de substitution.
- source_word: אֶל הַמֶּלֶךְ
  choice: pour le roi
  rationale: La préposition אֶל est difficile ici. « Pour le roi » conserve une certaine souplesse tout en indiquant, conformément au contexte, que cette garde est assurée en vue de la protection du roi.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin. La forme « Yahweh » le représente directement sans lui substituer un titre.
- issue: Rapport entre la garde de la maison de Yahweh et le roi
  choice: pour le roi
  alternative: vers le roi / auprès du roi / afin de protéger le roi
  rationale: La préposition hébraïque permet difficilement de préciser à elle seule le rapport exact. La traduction ne transforme donc pas explicitement la formule en « protéger le roi », bien que le contexte narratif indique que telle est sa finalité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe explicite l’apposition entre les « deux groupes » et ceux qui quittent leur service, tandis que les notes signalent les expressions hébraïques inhabituelles et l’incertitude de la dernière préposition.
