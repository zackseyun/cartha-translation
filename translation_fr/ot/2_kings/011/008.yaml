base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/008.yaml
  text: You shall surround the king on every side[a], each man with his weapons in his hand. Whoever comes within the ranks shall be put to death[b]. Stay with the king when he goes out and when he comes in.
translation:
  language: fr
  text: Vous entourerez le roi de tous côtés, chacun ses armes à la main. Quiconque pénétrera dans les rangs[a] sera mis à mort. Restez auprès du roi quand il sortira et quand il entrera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les lignes » ou « dans les rangées ». Le terme hébreu désigne probablement les rangs formés par les gardes.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « à sa sortie et à son entrée » : expression indiquant qu’ils doivent l’accompagner et le protéger dans tous ses déplacements.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִקַּפְתֶּם עַל הַמֶּלֶךְ סָבִיב
  choice: Vous entourerez le roi de tous côtés
  rationale: La forme verbale exprime l’encerclement protecteur du roi, tandis que סָבִיב précise qu’il doit être entouré de toutes parts. Cette formulation est naturelle en français et conserve la portée militaire de l’ordre.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: chacun ses armes à la main
  rationale: אִישׁ a ici une valeur distributive. Dans ce contexte de garde armée, כְּלִי désigne les armes plutôt que des objets ou du matériel en général. « Ses armes à la main » est une tournure française idiomatique.
- source_word: וְהַבָּא אֶל הַשְּׂדֵרוֹת
  choice: Quiconque pénétrera dans les rangs
  rationale: Le participe substantivé désigne toute personne qui s’approcherait de cette manière. שְּׂדֵרוֹת renvoie vraisemblablement aux rangées ou lignes formées par les gardes; « les rangs » restitue clairement ce cadre militaire sans effacer l’incertitude lexicale, signalée en note.
- source_word: יוּמָת
  choice: sera mis à mort
  rationale: 'Le hophal exprime ici un ordre à la voix passive: l’intrus doit être exécuté. « Sera mis à mort » conserve cette force juridique et militaire.'
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: Restez auprès du roi
  rationale: Dans cette suite d’instructions, la construction a valeur d’ordre et exprime l’accompagnement protecteur. « Auprès du roi » est plus naturel que le calque « avec le roi » tout en conservant le sens.
- source_word: בְּצֵאתוֹ וּבְבֹאוֹ
  choice: quand il sortira et quand il rentrera
  rationale: La paire d’infinitifs décrit les mouvements du roi. La formulation française garde les deux actions concrètes et demeure naturelle; leur portée plus générale est explicitée en note.
