source:
  edition: WLC
  text: וַ/יַּעַמְד֨וּ הָ/רָצִ֜ים אִ֣ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֗/וֹ מִ/כֶּ֨תֶף הַ/בַּ֤יִת הַ/יְמָנִית֙ עַד כֶּ֤תֶף הַ/בַּ֨יִת֙ הַ/שְּׂמָאלִ֔ית לַ/מִּזְבֵּ֖חַ וְ/לַ/בָּ֑יִת עַל הַ/מֶּ֖לֶךְ סָבִֽיב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/011.yaml
  text: And the guards stood[a], each man with his weapons in his hand, from the right side of the house to the left side of the house, by the altar and by the house[c][b], around the king.
translation:
  language: fr
  text: Les gardes[a] prirent position, chacun ses armes à la main, depuis le côté droit du Temple jusqu’à son côté gauche[b], près de l’autel et du Temple[c], tout autour du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui courent »; il s’agit ici de la garde royale.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre, selon l’orientation du Temple : « depuis le côté sud jusqu’au côté nord ».'
    reason: alternative_reading
  - marker: c
    text: L’hébreu dit ici « la maison », expression qui désigne le Temple.
    reason: cultural_note
lexical_decisions:
- source_word: הָרָצִים
  choice: les gardes
  rationale: Le participe signifie littéralement « ceux qui courent », mais désigne ici les membres armés de la garde royale. « Les gardes » exprime clairement leur fonction dans ce contexte.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: chacun ses armes à la main
  rationale: אִישׁ a une valeur distributive, et כְּלִי désigne ici les armes. Cette formulation naturelle conserve l’image de gardes prêts à intervenir.
- source_word: מִכֶּתֶף ... עַד כֶּתֶף
  choice: depuis le côté ... jusqu’à son côté
  rationale: כֶּתֶף signifie littéralement « épaule », mais désigne idiomatiquement le côté ou le flanc d’un bâtiment.
- source_word: הַבַּיִת
  choice: le Temple
  rationale: Dans ce contexte, « la maison » désigne sans ambiguïté le Temple. Le rendre explicitement ainsi évite en français moderne une confusion avec une habitation ordinaire.
- source_word: הַיְמָנִית / הַשְּׂמָאלִית
  choice: droit ... gauche
  rationale: Ces adjectifs désignent directement la droite et la gauche. L’interprétation topographique « sud ... nord » reste possible et est signalée en note.
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: près de l’autel et du Temple
  rationale: La préposition ל exprime ici la disposition spatiale sans permettre de préciser absolument s’il s’agit de proximité ou de direction. « Près de » convient naturellement à la scène.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: tout autour du roi
  rationale: Cette expression décrit l’encerclement protecteur du roi; « tout autour » restitue la force de סָבִיב.
