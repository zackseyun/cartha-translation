base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/006.yaml
  text: and a third shall be at the Sur Gate[a], and a third at the gate behind the runners[b]; and you shall keep watch over the house to prevent intrusion.
translation:
  language: fr
  text: Un tiers se tiendra à la porte de Sour, et un tiers à la porte derrière les coureurs[a] ; vous assurerez la garde de la maison pour empêcher toute intrusion[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les gardes » ou « les gardes royaux » ; l’hébreu dit littéralement « les coureurs ».
    reason: lexical_alternative
  - marker: b
    text: Le sens du terme hébreu est incertain ; il pourrait aussi signifier « comme une barrière » ou « pour assurer sa défense ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: un tiers
  rationale: L’ordinal féminin substantivé désigne ici, de manière distributive, l’une des trois sections de la garde.
- source_word: בְּשַׁעַר סוּר
  choice: à la porte de Sour
  rationale: שַׁעַר signifie « porte » et סוּר est vraisemblablement le nom propre de cette porte ; la translittération française « Sour » évite de lui attribuer un sens non établi.
- source_word: בַּשַּׁעַר אַחַר הָרָצִים
  choice: à la porte située derrière les coureurs
  rationale: אַחַר a ici son sens spatial naturel, « derrière ». La formulation conserve la relation architecturale imprécise du texte tout en restant claire en français.
- source_word: הָרָצִים
  choice: les coureurs
  rationale: Le participe substantivé de רוץ signifie littéralement « les coureurs ». Dans le cadre royal, il peut désigner des gardes ou des membres de l’escorte royale ; cette valeur fonctionnelle est signalée en note sans être imposée dans le texte.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת
  choice: vous monterez la garde
  rationale: La construction associant le verbe שמר au nom apparenté משמרת insiste sur la garde à assurer. « Monter la garde » rend naturellement cette idée en français.
- source_word: הַבַּיִת
  choice: la Maison
  rationale: בַּיִת signifie littéralement « maison » et peut ici renvoyer à la résidence royale ou au complexe concerné. « Maison » préserve cette désignation sans trancher explicitement entre palais et temple ; la majuscule signale qu’il s’agit d’un édifice déterminé dans le récit.
- source_word: מַסָּח
  choice: pour en empêcher l’accès
  rationale: Ce terme rare et obscur paraît indiquer une fonction de protection, d’exclusion ou de barrage. La formulation choisie exprime le sens contextuel probable, tandis qu’une note conserve l’incertitude lexicale.
