id: 2KI.11.13
reference: 2 Kings 11:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תִּשְׁמַ֣ע עֲתַלְיָ֔ה אֶת ק֥וֹל הָֽ/רָצִ֖ין הָ/עָ֑ם וַ/תָּבֹ֥א אֶל הָ/עָ֖ם בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/013.yaml
  text: When Athaliah heard the noise of the guards and of the people[c][b][a], she came to the people in the house of Yahweh.
translation:
  language: fr
  text: Lorsqu’Athalie entendit le bruit[b] des gardes[a] et du peuple, elle se rendit auprès du peuple dans la maison de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les coureurs » ; il s’agit probablement de la garde royale ou d’un corps de gardes du corps.
    reason: lexical_alternative
  - marker: b
    text: Ou « le son » ou « la voix ».
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire le temple de Yahweh ou son enceinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: entendit
  rationale: Dans cette séquence narrative, שׁמע désigne la perception auditive simple plutôt qu’une écoute attentive.
- source_word: עֲתַלְיָה
  choice: Athalie
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: קוֹל
  choice: bruit
  rationale: קוֹל peut désigner une voix, un son ou un bruit. Dans cette scène publique impliquant les gardes et le peuple, « bruit » évoque naturellement la clameur collective sans préciser davantage sa nature.
- source_word: הָרָצִין
  choice: les gardes
  rationale: Le terme, apparenté au verbe « courir », signifie littéralement « les coureurs », mais désigne en contexte royal un corps de gardes ou de gardes du corps. « Les gardes » exprime clairement leur fonction.
- source_word: הָעָם
  choice: le peuple
  rationale: Correspondance directe avec עָם, qui désigne ici la population assemblée.
- source_word: וַתָּבֹא אֶל
  choice: elle se rendit auprès de
  rationale: בוא avec אֶל exprime un déplacement vers une personne ou un groupe. « Se rendit auprès de » est naturel en français et évite l’ambiguïté de « vint » quant au point de vue narratif.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction conserve l’image hébraïque de la « maison » et rend directement le nom divin יהוה par « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
- issue: Identification de בֵּית יְהוָה
  choice: la maison de Yahweh
  alternative: le temple de Yahweh
  rationale: « Maison » maintient la formulation concrète du texte hébreu, tandis que le contexte indique qu’il s’agit du temple ou de son enceinte.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste proche de la syntaxe hébraïque tout en employant « se rendit auprès de » pour un mouvement naturel en français. Les notes préservent les principales possibilités lexicales sans surinterpréter la scène.
