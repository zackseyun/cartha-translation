source:
  edition: WLC
  text: וַ/תִּקַּ֣ח יְהוֹשֶׁ֣בַע בַּת הַ/מֶּֽלֶךְ י֠וֹרָם אֲח֨וֹת אֲחַזְיָ֜הוּ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗ה וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ ה/ממותתים אֹת֥/וֹ וְ/אֶת מֵינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/יַּסְתִּ֧רוּ אֹת֛/וֹ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הוּמָֽת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/002.yaml
  text: But Jehosheba[a], the daughter of King Joram, sister of Ahaziah, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, along with his nurse, into the bedroom; and they hid him from Athaliah[c][b], so that he was not put to death.
translation:
  language: fr
  text: Mais Joschéba, fille du roi Joram et sœur d’Achazia, prit Joas, fils d’Achazia, et l’enleva du milieu des fils du roi qu’on mettait à mort, avec sa nourrice[a], dans la chambre à coucher[b]. Puis ils le cachèrent[c] à Athalie, si bien qu’il ne fut pas mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la nourrice qui l’allaitait ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la chambre des lits ».'
    reason: lexical_alternative
  - marker: c
    text: 'Le verbe hébreu est au pluriel : « ils le cachèrent ».'
    reason: source_transparency
lexical_decisions:
- source_word: וַתִּקַּח
  choice: prit
  rationale: Le verbe narratif courant לקח signifie ici « prendre »; « prit » reste naturel sans préciser indûment la manière de l’action.
- source_word: יְהוֹשֶׁבַע
  choice: Joschéba
  rationale: Forme française traditionnelle du nom dans le livre des Rois, immédiatement reconnaissable tout en reflétant le nom hébreu.
- source_word: בַּת הַמֶּלֶךְ יוֹרָם
  choice: fille du roi Joram
  rationale: La chaîne construite identifie Joschéba comme la fille de Joram, qualifié de roi.
- source_word: אֲחוֹת אֲחַזְיָהוּ
  choice: sœur d’Achazia
  rationale: אחות désigne normalement une sœur; il n’y a pas lieu d’atténuer ce lien familial pour harmoniser d’autres données généalogiques.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: le déroba
  rationale: גנב signifie fondamentalement « voler, dérober ». Dans ce sauvetage clandestin, « déroba » conserve à la fois la force lexicale et l’idée de soustraction secrète.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ
  choice: du milieu des fils du roi
  rationale: Traduction proche de l’expression hébraïque; « fils du roi » évite le terme plus interprétatif « princes ».
- source_word: הַמּוּמָתִים
  choice: qu’on mettait à mort
  rationale: Le participe hophal exprime une mise à mort en cours; l’imparfait français rend naturellement cette scène de massacre.
- source_word: מֵינִקְתּוֹ
  choice: sa nourrice
  rationale: Le nom désigne la femme qui allaitait l’enfant. « Nourrice » est idiomatique, tandis que la précision « nourrice qui l’allaitait » est donnée en note.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: dans la chambre à coucher
  rationale: Littéralement « dans la chambre des lits »; « chambre à coucher » en exprime naturellement le sens en français moderne.
- source_word: וַיַּסְתִּרוּ אֹתוֹ
  choice: ils le cachèrent
  rationale: Le verbe du texte massorétique est au pluriel. La traduction garde ce pluriel au lieu de le ramener à Joschéba seule.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: à Athalie
  rationale: Dans ce contexte de dissimulation, « cacher quelqu’un à quelqu’un » rend naturellement l’idée de le soustraire à sa vue et à son pouvoir.
- source_word: וְלֹא הוּמָת
  choice: si bien qu’il ne fut pas mis à mort
  rationale: Le passif de מות indique qu’il échappa à la mise à mort; « si bien que » explicite sobrement le résultat contextuel.
theological_decisions:
- issue: Lien familial entre Joschéba et Achazia
  choice: Conserver « sœur d’Achazia »
  alternative: Employer un terme plus large comme « parente d’Achazia »
  rationale: Le texte hébreu emploie le terme ordinaire signifiant « sœur ». Une harmonisation généalogique ne doit pas être introduite dans la traduction.
- issue: Sujet pluriel du verbe « cacher »
  choice: Traduire « ils le cachèrent »
  alternative: 'Lisser au singulier : « elle le cacha »'
  rationale: La forme verbale massorétique est explicitement plurielle, peut-être en incluant la nourrice ou d’autres personnes. Cette donnée doit rester visible.
translation_notes:
  register: Français moderne, narratif et digne. Les noms suivent des formes françaises bibliques usuelles. La formulation reste proche de l’hébreu tout en divisant la longue proposition en phrases lisibles; elle conserve notamment le lien familial explicite et le pluriel inattendu du verbe « cacher ».
