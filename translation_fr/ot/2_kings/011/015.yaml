  text: וַ/יְצַו֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן אֶת שָׂרֵ֥י ה/מיאות פְּקֻדֵ֣י הַ/חַ֗יִל וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הוֹצִ֤יאוּ אֹתָ/הּ֙ אֶל מִ/בֵּ֣ית לַ/שְּׂדֵרֹ֔ת וְ/הַ/בָּ֥א אַחֲרֶ֖י/הָ הָמֵ֣ת בֶּ/חָ֑רֶב כִּ֚י אָמַ֣ר הַ/כֹּהֵ֔ן אַל תּוּמַ֖ת בֵּ֥ית יְהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/015.yaml
  text: Then Jehoiada the priest commanded the captains of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, put to death with the sword.” For the priest had said, “She must not be put to death in the house of Yahweh.”
translation:
  language: fr
  text: 'Alors le prêtre Jehoïada donna cet ordre aux chefs de centaines préposés à l’armée : « Faites-la sortir entre les rangs[a], et si quelqu’un la suit, qu’on le mette à mort par l’épée. » En effet, le prêtre avait dit : « Qu’elle ne soit pas mise à mort dans la maison de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hors des rangées » ou « dans l’espace entre les lignes ». L’expression hébraïque est difficile et désigne probablement le passage d’Athalie à travers les rangs ordonnés des gardes.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: chefs de centaines
  rationale: Rend formellement le titre militaire sans introduire le terme romain « centurions ».
- source_word: פְּקֻדֵי הַחַיִל
  choice: préposés à l’armée
  rationale: Le participe passif de פקד désigne ceux qui ont reçu une charge à l’égard de la force militaire ; cette formulation conserve la nuance de nomination.
- source_word: הוֹצִיאוּ אֹתָהּ
  choice: Faites-la sortir
  rationale: Le hifil impératif de יצא exprime le fait de faire sortir ou d’emmener dehors ; la tournure choisie est naturelle en français dans un ordre direct.
- source_word: אֶל מִבֵּית לַשְּׂדֵרוֹת
  choice: entre les rangs
  rationale: La construction hébraïque est difficile. Dans ce contexte militaire, elle semble désigner une sortie à travers ou au milieu des rangées ordonnées de gardes.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: si quelqu’un la suit
  rationale: Le participe singulier défini a une valeur générique. La formulation française garde ouverte l’idée de suivre Athalie, notamment pour la soutenir.
- source_word: הָמֵת בֶּחָרֶב
  choice: qu’on le mette à mort par l’épée
  rationale: L’infinitif absolu prend ici une force impérative. « Mettre à mort » convient au caractère officiel de l’ordre, tandis que « par l’épée » conserve l’instrument explicitement nommé.
- source_word: אַל תּוּמַת
  choice: Qu’elle ne soit pas mise à mort
  rationale: La forme passive à valeur jussive exprime une interdiction ; le sujet féminin est explicité d’après le contexte.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’expression hébraïque tout en désignant clairement, dans le contexte, le sanctuaire de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve ici le nom propre divin.
- issue: Portée de « celui qui vient derrière elle »
  choice: si quelqu’un la suit
  alternative: quiconque vient derrière elle
  rationale: Le français retenu conserve la portée générique et l’ambiguïté entre un simple mouvement à sa suite et un ralliement en sa faveur, sans trancher théologiquement ou historiquement.
translation_notes:
  register: Français international moderne, sobre et digne. Les titres militaires restent proches de l’hébreu ; la syntaxe du discours direct a été légèrement fluidifiée sans supprimer l’enchaînement causal du verset.
