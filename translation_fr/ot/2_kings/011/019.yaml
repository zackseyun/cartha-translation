  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ֠/מֵּאוֹת וְ/אֶת הַ/כָּרִ֨י וְ/אֶת הָ/רָצִ֜ים וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יֹּרִ֤ידוּ אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּב֛וֹאוּ דֶּֽרֶך שַׁ֥עַר הָ/רָצִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יֵּ֖שֶׁב עַל כִּסֵּ֥א הַ/מְּלָכִֽים־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/019.yaml
  text: Then he took the commanders of hundreds[a], the Carites, the runners, and all the people of the land, and they brought the king down from the house of Yahweh and came by way of the gate of the runners to the king’s house[b], and he sat on the throne of the kings.
translation:
  language: fr
  text: Puis il prit avec lui les chefs de centaine, les Carites[a], les coureurs[b] et tout le peuple du pays. Ils firent descendre le roi de la maison de Yahweh et se rendirent à la maison du roi en passant par la porte des coureurs. Le roi s’assit sur le trône des rois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Kérétiens » ou « les gardes du corps ». Le terme hébreu est incertain.
    reason: alternative_reading
  - marker: b
    text: Littéralement « les coureurs »; il s’agit probablement de gardes royaux ou de messagers. Le même terme se retrouve dans « la porte des coureurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Puis il prit avec lui
  rationale: Le verbe au singulier renvoie naturellement à Yehoyada. « Prit avec lui » exprime en français actuel l’idée de réunir et d’emmener les groupes énumérés.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: les chefs de centaine
  rationale: Cette formulation conserve l’organisation militaire évoquée par l’hébreu sans introduire le terme romain « centurions ».
- source_word: הַכָּרִי
  choice: les Cariens
  rationale: Le terme hébreu est incertain. « Cariens » en préserve la forme probable sans trancher entre une désignation ethnique et une fonction de garde.
- source_word: הָרָצִים
  choice: les coureurs
  rationale: Le sens littéral est conservé. Dans ce contexte royal, il s’agit probablement de gardes ou de messagers officiels, possibilité signalée en note.
- source_word: כָּל עַם הָאָרֶץ
  choice: tout le peuple du pays
  rationale: Cette traduction garde l’expression hébraïque sans décider si elle désigne l’ensemble de la population ou un groupe civique particulier.
- source_word: וַיֹּרִידוּ אֶת הַמֶּלֶךְ
  choice: Ils firent descendre le roi
  rationale: Le pluriel marque le passage de Yehoyada seul au groupe assemblé comme sujet. « Firent descendre » conserve le mouvement depuis le sanctuaire vers le palais.
- source_word: מִבֵּית יְהוָה
  choice: de la maison de Yahweh
  rationale: « Maison » maintient le parallèle avec la maison du roi, tandis que « Yahweh » transcrit le nom divin.
- source_word: דֶּרֶךְ שַׁעַר הָרָצִים
  choice: en passant par la porte des coureurs
  rationale: Formulation française naturelle qui conserve l’itinéraire et reprend le titre concret du corps officiel.
- source_word: בֵּית הַמֶּלֶךְ
  choice: au palais royal
  rationale: « Palais royal » rend clairement la destination en français moderne, sans ambiguïté avec une simple habitation privée.
- source_word: וַיֵּשֶׁב עַל כִּסֵּא הַמְּלָכִים
  choice: Le roi s’assit sur le trône des rois
  rationale: Le sujet est explicité pour la clarté. Le pluriel « des rois » est conservé afin de préserver l’idée du trône dynastique sans l’aplanir en « trône royal ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » en préserve le caractère de nom propre.
- issue: Portée de עַם הָאָרֶץ
  choice: tout le peuple du pays
  alternative: toute la population du pays
  rationale: L’expression peut avoir une portée sociale ou institutionnelle particulière. Le rendu retenu préserve cette tension au lieu d’identifier sans preuve le groupe à toute la population.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est fluidifiée sans effacer les changements de sujet ni les termes institutionnels incertains. « Maison de Yahweh » conserve le langage cultuel et le parallèle hébraïque, tandis que « palais royal » évite une ambiguïté inutile en français.
