revisions:
- from: Puis il prit avec lui les chefs de centaine, les Cariens[a], les coureurs[b] et tout le peuple du pays. Ils firent descendre le roi de la maison de Yahweh et se rendirent au palais royal en passant par la porte des coureurs. Le roi s’assit sur le trône des rois.
  to: Puis il prit avec lui les chefs de centaine, les Carites[a], les coureurs[b] et tout le peuple du pays. Ils firent descendre le roi de la maison de Yahweh et se rendirent à la maison du roi en passant par la porte des coureurs. Le roi s’assit sur le trône des rois.
  rationale: 'La révision limite deux surinterprétations évitables : « Carites » maintient l’incertitude de הכרִי, et « maison du roi » restitue plus étroitement בית המלך ainsi que son parallèle avec la maison de Yahweh. Le reste du projet est conservé, y compris le pluriel dynastique de « trône des rois » et les deux ancres de note.'
