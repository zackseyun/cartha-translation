source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֞וּ שָׂרֵ֣י ה/מאיות כְּ/כֹ֣ל אֲשֶׁר צִוָּה֮ יְהוֹיָדָ֣ע הַ/כֹּהֵן֒ וַ/יִּקְחוּ֙ אִ֣ישׁ אֶת אֲנָשָׁ֔י/ו בָּאֵ֣י הַ/שַּׁבָּ֔ת עִ֖ם יֹצְאֵ֣י הַ/שַּׁבָּ֑ת וַ/יָּבֹ֖אוּ אֶל יְהוֹיָדָ֥ע הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/009.yaml
  text: So the commanders of hundreds did according to all that Jehoiada the priest commanded. Each took his men[a], those coming on duty on the Sabbath together with those going off duty on the Sabbath, and they came to Jehoiada the priest.
translation:
  language: fr
  text: Les commandants de cent hommes exécutèrent tout ce que leur avait ordonné le prêtre Jehoïada. Chacun prit ses hommes[a], ceux qui prenaient leur service le jour du sabbat avec ceux qui le quittaient ce jour-là, et ils vinrent auprès du prêtre Jehoïada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « ceux qui entraient le jour du sabbat avec ceux qui sortaient le jour du sabbat ». Dans ce contexte, il s’agit vraisemblablement des groupes qui prenaient et quittaient leur service.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: les commandants de cent hommes
  rationale: Cette expression désigne les chefs militaires d'unités de cent hommes. La formulation est claire en français moderne et conserve la structure militaire.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: exécutèrent tout ce que leur avait ordonné
  rationale: La tournure exprime une obéissance complète à un ordre revêtu d'autorité. « Exécutèrent tout ce que… avait ordonné » est naturel et garde cette force.
- source_word: אִישׁ אֶת־אֲנָשָׁיו
  choice: Chacun prit ses hommes
  rationale: Le singulier distributif אִישׁ individualise chaque commandant, tandis que « ses hommes » désigne les hommes placés sous son autorité.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: ceux qui prenaient leur service le jour du sabbat
  rationale: Dans le contexte de la garde, l'entrée lors du sabbat correspond vraisemblablement à la relève qui prend son service. La note conserve le sens plus littéral.
- source_word: יֹצְאֵי הַשַּׁבָּת
  choice: ceux qui le quittaient ce jour-là
  rationale: En parallèle avec le groupe entrant, il s'agit vraisemblablement de ceux qui terminent leur service. Le pronom évite une répétition lourde en français.
- source_word: וַיָּבֹאוּ אֶל יְהוֹיָדָע הַכֹּהֵן
  choice: et ils vinrent auprès du prêtre Jehoïada
  rationale: La traduction rend simplement le mouvement vers Jehoïada, sans ajouter l'idée plus précise de se présenter officiellement.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Sabbat » conserve le terme institutionnel biblique. L'explicitation des relèves dans le texte principal favorise la compréhension, tandis que la note préserve la formulation hébraïque plus littérale et son degré d'ambiguïté.
