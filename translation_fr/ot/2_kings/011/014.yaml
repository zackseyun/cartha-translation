  to: 'Elle regarda : voici que le roi se tenait près de la colonne[a], selon la coutume. Les chefs et les trompettistes se tenaient auprès du roi, et tout le peuple du pays était dans la joie et sonnait des trompettes. Alors Athalie déchira ses vêtements et cria : « Complot ! Complot ! »[b]'
