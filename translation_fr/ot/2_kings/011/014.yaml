base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/014.yaml
  text: And she looked, and behold, the king was standing by the pillar, according to the custom, with the officers and the trumpets beside the king, and all the people of the land were rejoicing and blowing trumpets. Then Athaliah tore her clothes and cried, “Conspiracy! Conspiracy!”
translation:
  language: fr
  text: 'Elle regarda : voici que le roi se tenait près de la colonne[a], selon la coutume. Les chefs et les trompettistes se tenaient auprès du roi, et tout le peuple du pays était dans la joie et sonnait des trompettes. Alors Athalie déchira ses vêtements et cria : « Complot ! Complot ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la colonne ». La préposition hébraïque admet ici plusieurs nuances de lieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « Trahison ! Trahison ! »
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Elle regarda
  rationale: Le verbe ראה signifie couramment « voir »; devant וְהִנֵּה, « regarda » rend naturellement la découverte soudaine de la scène.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure conserve la force déictique et dramatique de הִנֵּה dans un français actuel et digne.
- source_word: הַמֶּלֶךְ עֹמֵד
  choice: le roi se tenait
  rationale: Le participe présente une posture en cours; l’imparfait français restitue cet arrière-plan descriptif.
- source_word: עַל הָעַמּוּד
  choice: près de la colonne
  rationale: עַל peut ici exprimer une position associée à la colonne cérémonielle, plutôt qu’une position littéralement dessus; l’ambiguïté locative est signalée en note.
- source_word: כַּמִּשְׁפָּט
  choice: selon la coutume
  rationale: מִשְׁפָּט désigne ici l’usage ou la procédure établie de la cérémonie royale, non un jugement judiciaire.
- source_word: וְהַשָּׂרִים
  choice: les chefs
  rationale: שׂרים désigne largement des responsables ou dignitaires; « chefs » convient au contexte sans préciser indûment leur rang.
- source_word: וְהַחֲצֹצְרוֹת
  choice: les trompettes
  rationale: Le texte massorétique nomme les instruments eux-mêmes. La métonymie éventuelle « trompettistes » n’est pas imposée au texte principal.
- source_word: אֶל הַמֶּלֶךְ
  choice: auprès du roi
  rationale: Dans ce contexte, אֶל marque la proximité et la présence auprès du roi.
- source_word: כָל עַם הָאָרֶץ
  choice: tout le peuple du pays
  rationale: Rendu direct de l’expression hébraïque, sans déterminer davantage son éventuelle portée sociopolitique.
- source_word: שָׂמֵחַ
  choice: était dans la joie
  rationale: Le singulier hébreu s’accorde collectivement avec « peuple » et exprime une joie publique active.
- source_word: וְתֹקֵעַ בַּחֲצֹצְרוֹת
  choice: et sonnait des trompettes
  rationale: תקע avec חצצרות signifie faire retentir les trompettes; le singulier français suit le sujet collectif.
- source_word: וַתִּקְרַע עֲתַלְיָה אֶת בְּגָדֶיהָ
  choice: Athalie déchira ses vêtements
  rationale: Traduction naturelle du geste conventionnel de détresse, sans en expliciter davantage le sens.
- source_word: קֶשֶׁר קָשֶׁר
  choice: Complot ! Complot !
  rationale: קֶשֶׁר désigne une conspiration ou un complot; la répétition emphatique est conservée.
