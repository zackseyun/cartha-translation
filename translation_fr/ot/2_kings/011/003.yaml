  yaml_path: translation/ot/2_kings/011/003.yaml
  text: And he was with her in the house of the LORD, hiding for six years, while Athaliah was reigning over the land.
translation:
  language: fr
  text: Il resta avec elle dans la maison du SEIGNEUR, caché pendant six ans, tandis qu’Atalie régnait sur le pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִתְחַבֵּא
  choice: caché
  rationale: Le participe hitpael décrit Joas demeurant à l’abri des regards; « caché » rend naturellement en français cet état continu, sans préciser davantage le moyen de sa dissimulation.
- source_word: בֵּית יְהוָה
  choice: la maison du SEIGNEUR
  rationale: « Maison » conserve l’expression hébraïque désignant ici le temple; « le SEIGNEUR » suit la convention française courante pour le tétragramme.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte royal, le terme désigne le territoire soumis au pouvoir d’Atalie, vraisemblablement Juda; « le pays » préserve la formulation non spécifiée du texte.
theological_decisions:
- issue: Nature du pouvoir exercé par Atalie
  choice: régnait sur le pays
  alternative: était reine du pays
  rationale: Le participe מֹלֶכֶת exprime son exercice continu du pouvoir. La traduction verbale ne tranche pas davantage la question de la légitimité de son règne.
translation_notes:
  register: Français moderne, sobre et narratif. Le présent de narration (« Il resta » étant au passé simple) est évité au profit d’un récit cohérent au passé; « tandis que » marque la simultanéité et le contraste entre la clandestinité de Joas et le règne d’Atalie.
