source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ כָל עַם֩ הָ/אָ֨רֶץ בֵּית הַ/בַּ֜עַל וַֽ/יִּתְּצֻ֗/הוּ אֶת מזבחת/ו וְ/אֶת צְלָמָי/ו֙ שִׁבְּר֣וּ הֵיטֵ֔ב וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֣י הַֽ/מִּזְבְּח֑וֹת וַ/יָּ֧שֶׂם הַ/כֹּהֵ֛ן פְּקֻדּ֖וֹת עַל בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/018.yaml
  text: Then all the people of the land went into the house of Baal and tore it down[a]. They thoroughly smashed his altars and his images, and they killed Mattan the priest of Baal before the altars[c][b]. Then the priest appointed overseers over the house of Yahweh.
translation:
  language: fr
  text: Alors tout le peuple du pays se rendit au temple de Baal[a] et le démolit. Ils brisèrent complètement ses autels et ses statues[b], et tuèrent Mattân, le prêtre de Baal, devant les autels. Puis le prêtre désigna des responsables pour la maison de Yahweh[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison de Baal ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ses représentations », « ses idoles » ou « ses images ».'
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu peut aussi désigner des fonctions de surveillance ou des postes de garde.
    reason: lexical_ambiguity
  - marker: d
    text: Yahweh représente le nom divin hébreu YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: כָל עַם הָאָרֶץ
  choice: tout le peuple du pays
  rationale: Cette expression politico-sociale fréquente dans les livres des Rois est conservée sans la réduire, de manière interprétative, aux seules classes populaires.
- source_word: בֵּית הַבַּעַל
  choice: le temple de Baal
  rationale: Le mot hébreu signifie littéralement « maison », mais « temple » exprime naturellement en français la fonction cultuelle du bâtiment; la formulation littérale est signalée en note.
- source_word: וַיִּתְּצֻהוּ
  choice: le démolit
  rationale: Le verbe décrit la destruction d'un édifice; « démolir » est précis, vigoureux et naturel dans ce contexte.
- source_word: מִזְבְּחֹתָיו
  choice: ses autels
  rationale: Le suffixe masculin singulier renvoie naturellement à Baal, conformément à la forme hébraïque.
- source_word: צְלָמָיו
  choice: ses statues
  rationale: Le terme désigne des représentations matérielles ou des statues. « Statues » reste concret sans ajouter le jugement explicite contenu dans « idoles ».
- source_word: שִׁבְּרוּ הֵיטֵב
  choice: brisèrent complètement
  rationale: L'adverbe intensifie le verbe « briser » et souligne le caractère total de la destruction.
- source_word: מַתָּן כֹּהֵן הַבַּעַל
  choice: Mattân, le prêtre de Baal
  rationale: Rend directement le nom propre et la fonction cultuelle de l'homme.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: devant les autels
  rationale: Préserve le sens spatial ordinaire de la préposition sans préciser davantage la scène.
- source_word: וַיָּשֶׂם הַכֹּהֵן פְּקֻדּוֹת
  choice: le prêtre établit des responsables
  rationale: Dans ce contexte administratif, le verbe et le nom évoquent la mise en place d'une surveillance ou de personnes chargées d'une fonction. « Responsables » donne un sens personnel plausible tout en laissant la difficulté lexicale en note.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve ici la désignation hébraïque traditionnelle du sanctuaire, tandis que le nom divin est rendu explicitement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom divin au lieu de le remplacer par un titre; la convention française traditionnelle est indiquée en note.
- issue: Nature des פְּקֻדּוֹת établies sur le sanctuaire
  choice: des responsables
  alternative: des postes de garde / des fonctions de surveillance
  rationale: Le nom peut désigner des charges, une organisation de surveillance ou les personnes qui l'exercent. Le contexte favorise des personnes responsables, mais la note conserve l'ambiguïté administrative.
translation_notes:
  register: Français international moderne, narratif et digne. « Temple » est employé pour la clarté au premier membre, avec le littéral en note; « maison de Yahweh » conserve ensuite l'expression biblique et le contraste cultuel. Les verbes restent directs et vigoureux, conformément au récit hébreu.
