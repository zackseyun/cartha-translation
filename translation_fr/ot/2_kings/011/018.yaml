  naturalness: 'L’ensemble est naturel et digne en français moderne. En revanche, « établit des responsables sur la maison de Yahweh » est un calque peu idiomatique : en français, on désigne des responsables « pour » une institution ou on les charge d’en assurer la surveillance.'
  terminology: Les termes cultuels (« temple », « autels », « prêtre », « maison de Yahweh ») et le nom Mattân conviennent. « Statues » est un rendu concret et non confessionnel de צְלָמָיו. Le maintien de « Yahweh » est cohérent avec le choix éditorial communiqué; la note explique la convention traditionnelle sans l’imposer au texte.
