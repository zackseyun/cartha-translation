source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ֠/שְּׁבִיעִית שָׁלַ֨ח יְהוֹיָדָ֜ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י ה/מאיות לַ/כָּרִי֙ וְ/לָ֣/רָצִ֔ים וַ/יָּבֵ֥א אֹתָ֛/ם אֵלָ֖י/ו בֵּ֣ית יְהוָ֑ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם בְּרִ֜ית וַ/יַּשְׁבַּ֤ע אֹתָ/ם֙ בְּ/בֵ֣ית יְהוָ֔ה וַ/יַּ֥רְא אֹתָ֖/ם אֶת בֶּן הַ/מֶּֽלֶךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/004.yaml
  text: In the seventh year Jehoiada sent and took the commanders of hundreds[a], the Carites, and the runners, and brought them to himself in the house of Yahweh. He made a covenant with them and put them under oath in the house of Yahweh[b], and showed them the king’s son.
translation:
  language: fr
  text: La septième année, Yehojada envoya chercher les chefs de centaines des Cariens[a] et des coureurs[b], puis il les fit venir auprès de lui dans la maison de Yahweh. Il conclut une alliance avec eux, leur fit prêter serment dans la maison de Yahweh et leur montra le fils du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « des Kéréthiens ». Le terme hébreu semble désigner un corps de la garde royale, mais son identification précise est incertaine.
    reason: alternative_reading
  - marker: b
    text: Les « coureurs » étaient probablement des gardes royaux ou des messagers attachés au roi.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִית
  choice: La septième année
  rationale: Formulation temporelle naturelle en français; la conjonction narrative initiale n’a pas besoin d’être reproduite séparément.
- source_word: שָׁלַח ... וַיִּקַּח
  choice: envoya chercher
  rationale: Dans ce contexte, l’envoi a pour but de faire venir les officiers. Cette expression française rend naturellement l’enchaînement des deux verbes sans suggérer que Yehojada partit lui-même les prendre.
- source_word: שָׂרֵי הַמֵּאוֹת לַכָּרִי וְלָרָצִים
  choice: les chefs de centaines des Cariens et des coureurs
  rationale: Le titre désigne des officiers commandant des unités de cent. Les prépositions attachées à « Cariens » et « coureurs » permettent de comprendre qu’il s’agit des chefs de ces deux corps, plutôt que de trois groupes indépendants.
- source_word: לַכָּרִי
  choice: des Cariens
  rationale: Le terme paraît désigner un corps de garde appelé les Cariens, mais son identification exacte demeure incertaine; cette incertitude est signalée en note.
- source_word: וְלָרָצִים
  choice: et des coureurs
  rationale: La traduction littérale conserve le titre ancien de ce corps royal; une note en indique la fonction probable.
- source_word: וַיָּבֵא אֹתָם אֵלָיו
  choice: puis il les fit venir auprès de lui
  rationale: Cette formulation exprime clairement que Yehojada les introduisit en sa présence, tout en restant naturelle en français.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’expression hébraïque, qui désigne ici le temple, et « Yahweh » rend directement le nom divin.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: il conclut une alliance avec eux
  rationale: « Conclure une alliance » est l’équivalent français idiomatique de l’expression hébraïque littérale « couper une alliance » et en conserve la solennité politique et religieuse.
- source_word: וַיַּשְׁבַּע אֹתָם
  choice: leur fit prêter serment
  rationale: 'Rend le sens causatif du verbe: Yehojada leur imposa un engagement solennel.'
- source_word: וַיַּרְא אֹתָם אֶת בֶּן הַמֶּלֶךְ
  choice: il leur montra le fils du roi
  rationale: Traduction directe et idiomatique de la présentation du prince caché aux officiers.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre d’alliance plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Les noms propres suivent une translittération proche de l’hébreu (« Yehojada », « Yahweh »). Les deux notes sont placées directement après les termes qu’elles expliquent, contrairement au positionnement incohérent de la couche anglaise fournie.
