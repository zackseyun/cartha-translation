  yaml_path: translation/ot/2_kings/007/020.yaml
  text: 'And so it happened to him: the people trampled him in the gate[b][a], and he died.'
translation:
  language: fr
  text: 'Et c’est ce qui lui arriva[a] : le peuple le piétina à la porte de la ville[b], et il mourut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et il en fut ainsi pour lui », c’est-à-dire que les événements se produisirent exactement comme cela avait été annoncé.'
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la porte de la ville » ou « dans le passage de la porte ». Le terme hébreu peut désigner la zone de la porte urbaine ou le passage de celle-ci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ כֵן
  choice: Et c’est ce qui lui arriva
  rationale: Cette formulation française naturelle rend l’idée que les événements se produisirent pour lui comme ils avaient été annoncés, sans ajouter de commentaire théologique explicite.
- source_word: וַיִּרְמְסוּ
  choice: le piétina
  rationale: Le verbe רמס désigne l’action de fouler ou de piétiner quelqu’un sous les pieds. « Le piétina » est direct, précis et idiomatique.
- source_word: הָעָם
  choice: le peuple
  rationale: עם signifie normalement « peuple ». Dans le contexte, il s’agit de la population qui se précipite par la porte ; « la foule » expliciterait davantage la scène mais s’éloignerait du terme hébreu.
- source_word: בַּשַּׁעַר
  choice: à la porte de la ville
  rationale: שַׁעַר peut désigner la porte urbaine ainsi que l’espace ou le passage qui lui est associé. « À la porte de la ville » est naturel en français et situe clairement la scène.
- source_word: וַיָּמֹת
  choice: et il mourut
  rationale: La proposition hébraïque énonce simplement sa mort après le piétinement. La coordination conserve cette sobriété narrative, tandis que le lien de conséquence ressort du contexte.
theological_decisions:
- issue: Formulation de l’accomplissement du jugement annoncé
  choice: Présenter le sort de l’officier comme ce qui lui arriva, conformément à la parole précédemment annoncée, sans commentaire théologique ajouté.
  alternative: 'Expliciter le jugement, par exemple : « Ainsi, le jugement s’accomplit contre lui. »'
  rationale: Le contexte montre l’accomplissement de la parole prophétique d’Élisée, mais le verset lui-même reste narratif. La traduction préserve cette forme et laisse le contexte porter la dimension de jugement.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation reste proche de l’hébreu tout en évitant le peu naturel « dans la porte » dans le texte principal.
