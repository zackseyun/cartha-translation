source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ לֹֽא כֵ֣ן אֲנַ֣חְנוּ עֹשִׂ֗ים הַ/יּ֤וֹם הַ/זֶּה֙ יוֹם בְּשֹׂרָ֣ה ה֔וּא וַ/אֲנַ֣חְנוּ מַחְשִׁ֗ים וְ/חִכִּ֛ינוּ עַד א֥וֹר הַ/בֹּ֖קֶר וּ/מְצָאָ֣/נוּ עָו֑וֹן וְ/עַתָּה֙ לְכ֣וּ וְ/נָבֹ֔אָה וְ/נַגִּ֖ידָה בֵּ֥ית הַ/מֶּֽלֶךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/009.yaml
  text: Then they said to one another[a], “What we are doing is not right. This day is a day of good news, and we are keeping silent. If we wait until the light of morning, guilt will overtake us. So now, come[b], let us go and report it to the king’s household.”
translation:
  language: fr
  text: 'Ils se dirent l’un à l’autre : « Nous n’agissons pas bien. Ce jour est un jour de bonne nouvelle, et nous gardons le silence. Si nous attendons jusqu’aux premières lueurs du matin, la faute nous rattrapera[a]. Maintenant donc, venez, allons annoncer la nouvelle à la maison du roi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la faute nous trouvera ». Le terme hébreu peut désigner la faute, la culpabilité ou le châtiment qui en découle.'
    reason: lexical_alternative
  - marker: b
    text: « La maison du roi » peut désigner la famille ou l’entourage royal, mais aussi le palais.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֲנַחְנוּ עֹשִׂים
  choice: Nous n’agissons pas bien
  rationale: Cette formulation française naturelle reste proche de l’expression hébraïque, littéralement « ce n’est pas ainsi que nous agissons », et conserve son jugement moral.
- source_word: יוֹם בְּשֹׂרָה
  choice: un jour de bonne nouvelle
  rationale: בְּשֹׂרָה désigne ici une bonne nouvelle, celle de la délivrance inattendue de Samarie.
- source_word: מַחְשִׁים
  choice: nous gardons le silence
  rationale: Le participe causatif exprime un silence maintenu volontairement et dans la durée.
- source_word: וְחִכִּינוּ עַד אוֹר הַבֹּקֶר
  choice: Si nous attendons jusqu’aux premières lueurs du matin
  rationale: Le parfait précédé de וְ prend ici une valeur conditionnelle. « Les premières lueurs du matin » rend naturellement l’image de אוֹר הַבֹּקֶר.
- source_word: וּמְצָאנוּ עָוֹן
  choice: la faute nous rattrapera
  rationale: Cette traduction conserve l’image littérale selon laquelle la faute « trouve » les hommes, tout en restant idiomatique et en laissant ouverte la nuance entre culpabilité et châtiment.
- source_word: לְכוּ וְנָבֹאָה
  choice: venez, allons
  rationale: Le double mouvement d’exhortation de l’impératif et du cohortatif est conservé dans une tournure française compréhensible.
- source_word: וְנַגִּידָה
  choice: annoncer la nouvelle
  rationale: Le verbe נגד au hifil signifie faire savoir ou annoncer; le complément explicité par le contexte rend la phrase naturelle en français.
- source_word: בֵּית הַמֶּלֶךְ
  choice: la maison du roi
  rationale: La traduction formelle préserve l’ambivalence entre le palais comme lieu et la maison royale comme entourage ou institution.
theological_decisions:
- issue: Sens de עָוֹן dans l’expression וּמְצָאנוּ עָוֹן
  choice: la faute nous rattrapera
  alternative: le châtiment nous atteindra / nous serons reconnus coupables
  rationale: Le nom peut évoquer la faute, la culpabilité ou sa conséquence punitive. Le texte principal conserve cette tension plutôt que de choisir exclusivement la culpabilité intérieure ou le châtiment extérieur.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct garde le ton d’une prise de conscience morale urgente. « Venez, allons » conserve volontairement la double exhortation hébraïque, tandis que les notes maintiennent les ambiguïtés lexicales réelles.
