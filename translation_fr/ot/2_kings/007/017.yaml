    issue: « sur le bras duquel il s’appuyait »
    rationale: Le texte hébreu porte littéralement « sur sa main » (עַל־יָדוֹ), non « sur son bras ». Même si « bras » est idiomatique en français, la conservation de « main » est possible et préserve l’image du texte source.
  - severity: low
    issue: « comme l’homme de Dieu l’avait annoncé »
    rationale: « Annoncé » interprète la parole comme une annonce prophétique. « Comme l’avait dit l’homme de Dieu » suit plus directement דִּבֶּר tout en laissant le contexte établir la nature prophétique de cette parole.
