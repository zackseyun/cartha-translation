  source_fidelity: 'Révision mineure nécessaire : « sur le bras duquel » remplace l’image explicite de la « main » (יַד) par un autre membre. Le français permet de conserver « main » sans perdre l’intelligibilité. « Avait annoncé » est recevable dans le contexte, mais « avait dit » rend plus exactement le double emploi de דִּבֶּר (« avait parlé/dit »).'
  naturalness: Le texte est globalement fluide et de registre narratif moderne. « Confier la surveillance de la porte à » est plus idiomatique que « charger de la surveillance de la porte » avec cet ordre des compléments. « Dans le passage de la porte » demeure une explicitation naturelle du cadre architectural.
  terminology: « Officier », « l’homme de Dieu » et « le peuple » sont appropriés. La note sur שָׁלִישׁ conserve utilement l’incertitude quant au grade. Une note distincte sur « main » explicite que la formulation française préserve une expression hébraïque littérale associée à la proximité du roi.
