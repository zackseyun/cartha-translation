  text: וְ/הַ/מֶּלֶךְ֩ הִפְקִ֨יד אֶת הַ/שָּׁלִ֜ישׁ אֲשֶׁר נִשְׁעָ֤ן עַל יָד/וֹ֙ עַל הַ/שַּׁ֔עַר וַ/יִּרְמְסֻ֧/הוּ הָ/עָ֛ם בַּ/שַּׁ֖עַר וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֤ר דִּבֶּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/רֶ֥דֶת הַ/מֶּ֖לֶךְ אֵלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/017.yaml
  text: The king had appointed the officer on whose hand he leaned to be in charge of the gate[a], but the people trampled him in the gate, and he died[b], just as the man of God had spoken when the king came down to him.
translation:
  language: fr
  text: Le roi avait confié la surveillance de la porte à l’officier sur la main duquel il s’appuyait[a][b]. Mais le peuple le piétina dans le passage de la porte, et il mourut, comme l’avait dit l’homme de Dieu lorsque le roi était descendu auprès de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner un officier supérieur, un capitaine ou un aide de camp royal.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur la main duquel il s’appuyait » ; cette expression décrit un officier très proche du roi.
    reason: cultural_note
lexical_decisions:
- source_word: הִפְקִיד ... עַל הַשַּׁעַר
  choice: avait chargé de la surveillance de la porte
  rationale: Le hiphil de פקד avec עַל exprime ici l’attribution d’une responsabilité. Le plus-que-parfait marque naturellement le retour narratif à une mesure déjà prise.
- source_word: הַשָּׁלִישׁ
  choice: l’officier
  rationale: Le terme désigne un officier de haut rang proche du roi, mais son grade précis demeure incertain; « officier » évite une précision injustifiée.
- source_word: אֲשֶׁר נִשְׁעָן עַל יָדוֹ
  choice: sur le bras duquel il s’appuyait
  rationale: Bien que יָד signifie littéralement « main », le français idiomatique dit que l’on s’appuie sur le bras de quelqu’un. L’image et la proximité fonctionnelle avec le roi sont préservées.
- source_word: וַיִּרְמְסֻהוּ הָעָם
  choice: le peuple le piétina
  rationale: רמס exprime directement l’action de fouler ou piétiner; « le peuple » conserve la valeur habituelle de הָעָם sans réduire le groupe à une simple foule.
- source_word: בַּשַּׁעַר
  choice: dans le passage de la porte
  rationale: La porte antique était un espace de passage aménagé, non un simple battant. Cette formulation rend clairement le lieu où l’homme fut piétiné.
- source_word: כַּאֲשֶׁר דִּבֶּר אִישׁ הָאֱלֹהִים
  choice: comme l’homme de Dieu l’avait annoncé
  rationale: La formule relie explicitement la mort à la parole prophétique antérieure. « Annoncé » est naturel en français tout en conservant l’idée d’une parole préalable accomplie.
- source_word: בְּרֶדֶת הַמֶּלֶךְ אֵלָיו
  choice: lorsque le roi était descendu vers lui
  rationale: L’infinitif construit précédé de בְּ a une valeur temporelle. Le plus-que-parfait situe cette descente au moment de la déclaration antérieure.
theological_decisions:
- issue: Accomplissement de la parole prophétique
  choice: La mort est explicitement présentée comme conforme à ce que l’homme de Dieu avait annoncé.
  alternative: Rapporter simplement la mort sans mettre en relief son rapport avec l’annonce antérieure.
  rationale: Le texte hébreu établit lui-même ce lien au moyen de כַּאֲשֶׁר דִּבֶּר et de la reprise de דִּבֶּר; la traduction garde cette insistance sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible; « passage de la porte » explicite sobrement la réalité architecturale. Le seul marqueur de note [a] figure bien dans le texte et précise l’incertitude lexicale liée au rang de l’officier.
