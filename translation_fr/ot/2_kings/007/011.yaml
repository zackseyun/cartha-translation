  text: וַ/יִּקְרָ֖א הַ/שֹּֽׁעֲרִ֑ים וַ/יַּגִּ֕ידוּ בֵּ֥ית הַ/מֶּ֖לֶךְ פְּנִֽימָה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/011.yaml
  text: Then the gatekeepers called out and reported it inside the king’s house[a].
translation:
  language: fr
  text: Alors les gardiens de la porte crièrent et transmirent la nouvelle à l’intérieur de la maison du roi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la maisonnée du roi, à l’intérieur » ; littéralement : « à la maison du roi, vers l’intérieur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: crièrent
  rationale: Le verbe קרא décrit ici un appel lancé à voix haute pour donner l’alerte. Le singulier hébreu devant le sujet pluriel peut s’expliquer par l’ordre verbal et n’exige pas un sujet singulier en français.
- source_word: הַשֹּׁעֲרִים
  choice: les gardiens de la porte
  rationale: שֹׁעֲרִים désigne les hommes postés à la porte. Cette formulation est plus immédiatement claire en français moderne que « portiers », qui peut évoquer une autre fonction.
- source_word: וַיַּגִּידוּ
  choice: transmirent la nouvelle
  rationale: נגד signifie faire savoir ou rapporter. L’objet reste implicite en hébreu, mais « la nouvelle » le restitue naturellement d’après le contexte immédiat.
- source_word: בֵּית הַמֶּלֶךְ
  choice: palais royal
  rationale: Littéralement « maison du roi ». Dans ce contexte administratif et résidentiel, « palais royal » rend naturellement le référent probable sans imposer que le message ait été adressé au roi lui-même.
- source_word: פְּנִימָה
  choice: à l’intérieur
  rationale: 'L’adverbe indique une direction vers l’intérieur : la nouvelle est relayée depuis la porte vers l’intérieur du palais.'
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Gardiens de la porte » évite l’ambiguïté moderne de « portiers » ; « transmirent la nouvelle » exprime clairement le relais d’information sans identifier plus précisément son destinataire.
