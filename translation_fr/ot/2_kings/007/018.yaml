  text: וַ/יְהִ֗י כְּ/דַבֵּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֶל הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר סָאתַ֨יִם שְׂעֹרִ֜ים בְּ/שֶׁ֗קֶל וּֽ/סְאָה סֹ֨לֶת֙ בְּ/שֶׁ֔קֶל יִהְיֶה֙ כָּ/עֵ֣ת מָחָ֔ר בְּ/שַׁ֖עַר שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/018.yaml
  text: And it happened just as the man of God had spoken to the king[a], saying, “Two seahs of barley for a shekel, and one seah of fine flour for a shekel[b], will be about this time tomorrow in the gate of Samaria.”
translation:
  language: fr
  text: 'Et il arriva comme l’homme de Dieu l’avait dit au roi : « Deux séas d’orge coûteront un sicle, et un séa de fleur de farine coûtera un sicle, demain, vers la même heure, à la porte de Samarie[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou « dans la porte de Samarie ». La porte de la ville était un lieu public où se pratiquaient notamment le commerce et la justice.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Et il arriva
  rationale: Cette formule rend l’ouverture narrative et introduit ici l’accomplissement de la parole annoncée, sans recourir à une tournure archaïque.
- source_word: כְּדַבֵּר
  choice: exactement comme ... l’avait annoncé
  rationale: La préposition כְּ exprime la conformité entre l’événement et la parole antérieure. Le plus-que-parfait convient au regard rétrospectif du verset.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Traduction directe du titre hébreu, préférable à l’interprétation « le prophète ».
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français courant, les deux-points introduisent naturellement la citation et rendent la fonction de l’infinitif quotatif sans l’artificiel « en disant ».
- source_word: סָאתַיִם שְׂעֹרִים
  choice: deux séas d’orge
  rationale: Le duel numérique et l’unité ancienne sont conservés, de même que le nom précis de la céréale.
- source_word: בְּשֶׁקֶל
  choice: coûteront un sicle
  rationale: Dans cette formule de prix, בְּ indique le prix demandé. Le verbe « coûter » explicite naturellement en français la proposition nominale hébraïque.
- source_word: וּסְאָה סֹלֶת
  choice: et un séa de fleur de farine
  rationale: « Un séa » maintient le contraste avec les deux séas précédents; « fleur de farine » rend la farine fine et de qualité désignée par סֹלֶת.
- source_word: יִהְיֶה
  choice: coûteront ... [et] ... un sicle
  rationale: Le singulier hébreu porte elliptiquement sur la situation tarifaire annoncée. En français, le futur intégré à la formule de prix en restitue clairement le sens.
- source_word: כָּעֵת מָחָר
  choice: demain à peu près à la même heure
  rationale: La formulation conserve la nuance approximative de כְּ et situe l’accomplissement au même moment le lendemain.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: à la porte de Samarie
  rationale: « À la porte » est l’expression française naturelle pour le lieu public et commercial désigné, tout en restant proche de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La structure d’accomplissement prophétique est conservée, tandis que la formule commerciale elliptique de l’hébreu est rendue par le verbe courant « coûter ». Les unités anciennes sont maintenues et expliquées en note.
