    issue: « exactement comme » et « l’avait annoncé » renforcent ou interprètent légèrement la formulation source.
    rationale: כְדַבֵּר exprime que l’événement survient conformément à ce que l’homme de Dieu avait dit. « Comme ... avait dit » est plus direct et préserve mieux la formulation du texte.
  - severity: low
    issue: La seconde formule de prix repose sur une ellipse verbale en français.
    rationale: L’ellipse est compréhensible, mais répéter « coûtera » donne une phrase plus fluide sans modifier le sens commercial de la formule hébraïque.
  revised_text: 'Et il arriva comme l’homme de Dieu l’avait dit au roi : « Deux séas d’orge coûteront un sicle, et un séa de fleur de farine coûtera un sicle, demain, vers la même heure, à la porte de Samarie[b]. »'
  revised_footnotes:
