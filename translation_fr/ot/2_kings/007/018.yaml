    text: Le séa était une ancienne mesure de capacité pour les matières sèches; le sicle servait ici d’unité monétaire fondée sur un poids d’argent.
    reason: cultural_note
  - marker: b
    text: Ou « dans la porte de Samarie ». La porte de la ville était un lieu public où se pratiquaient notamment le commerce et la justice.
    reason: lexical_alternative
