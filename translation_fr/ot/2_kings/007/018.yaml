  to: 'Et il arriva comme l’homme de Dieu l’avait dit au roi : « Deux séas d’orge coûteront un sicle, et un séa de fleur de farine coûtera un sicle, demain, vers la même heure, à la porte de Samarie[b]. »'
  rationale: La révision rapproche l’introduction de la formulation hébraïque sans alourdir le français et rend les deux prix explicitement parallèles. L’appel de note a est supprimé, car la note correspondante ne dispose plus d’un ancrage précis et n’est pas nécessaire au sens du verset; la note b demeure ancrée à « porte de Samarie ».
