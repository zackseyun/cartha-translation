  text: וַ/יָּבֹאוּ֩ הַֽ/מְצֹרָעִ֨ים הָ/אֵ֜לֶּה עַד קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה וַ/יָּבֹ֜אוּ אֶל אֹ֤הֶל אֶחָד֙ וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֔וּ וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם כֶּ֤סֶף וְ/זָהָב֙ וּ/בְגָדִ֔ים וַ/יֵּלְכ֖וּ וַ/יַּטְמִ֑נוּ וַ/יָּשֻׁ֗בוּ וַ/יָּבֹ֨אוּ֙ אֶל אֹ֣הֶל אַחֵ֔ר וַ/יִּשְׂא֣וּ מִ/שָּׁ֔ם וַ/יֵּלְכ֖וּ וַ/יַּטְמִֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/008.yaml
  text: When these lepers came to the edge of the camp[a], they entered one tent and ate and drank, and they carried off silver and gold and clothing from there, and went and hid them. Then they returned and entered another tent, and carried things off from there, and went and hid them.
translation:
  language: fr
  text: Lorsque ces lépreux[a] arrivèrent à l’extrémité du camp, ils entrèrent dans une tente, mangèrent et burent. Ils emportèrent de là de l’argent, de l’or et des vêtements, puis allèrent les cacher. Ensuite, ils revinrent, entrèrent dans une autre tente, en emportèrent, puis allèrent les cacher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traditionnellement traduit par « lépreux » désigne des personnes atteintes d’une maladie de peau. Il peut couvrir un ensemble d’affections plus large que la lèpre au sens médical moderne.
    reason: cultural_note
lexical_decisions:
- source_word: הַמְצֹרָעִים
  choice: ces lépreux
  rationale: Le terme désigne des personnes atteintes de צָרַעַת. « Lépreux » conserve la désignation traditionnelle et concise du récit, tandis que la note précise que l’affection visée ne correspond pas nécessairement à la lèpre au sens médical moderne.
- source_word: קְצֵה הַמַּחֲנֶה
  choice: l’extrémité du camp
  rationale: קָצֶה désigne le bord ou l’extrémité d’un espace. Cette formulation française rend clairement leur arrivée à la limite du camp.
- source_word: אֹהֶל אֶחָד
  choice: une tente
  rationale: Même si אֶחָד signifie littéralement « un », l’indéfini « une tente » exprime naturellement en français l’entrée dans une première tente sans effacer la progression vers « une autre tente ».
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: mangèrent et burent
  rationale: Les verbes narratifs indiquent une succession simple d’actions, correctement rendue par le passé simple dans ce récit.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: emportèrent de là
  rationale: נשא exprime ici l’action de prendre et d’emporter les biens présents dans les tentes. « Emporter » restitue ce mouvement sans ajouter l’idée explicite de pillage.
- source_word: כֶּסֶף וְזָהָב וּבְגָדִים
  choice: de l’argent, de l’or et des vêtements
  rationale: Cette énumération est exacte et naturelle en français moderne. « Vêtements » est plus courant que « habits » ou « vêtements précieux », ce dernier ajout n’étant pas exprimé.
- source_word: וַיַּטְמִנוּ
  choice: allèrent les cacher
  rationale: Le verbe signifie cacher ou dissimuler. Le pronom « les » reprend naturellement les objets emportés, sans préciser qu’ils les auraient enterrés.
- source_word: וַיָּשֻׁבוּ
  choice: Ensuite, ils revinrent
  rationale: « Ensuite » rend avec fluidité la progression de la chaîne narrative introduite en hébreu par la conjonction et une nouvelle forme verbale narrative.
- source_word: אֹהֶל אַחֵר
  choice: une autre tente
  rationale: Cette expression restitue directement אַחֵר et marque le passage à une seconde tente.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: emportèrent de là diverses choses
  rationale: À la seconde occurrence, l’objet reste implicite en hébreu. « Diverses choses » rend cette ellipse compréhensible en français sans identifier des biens que le texte ne nomme pas.
