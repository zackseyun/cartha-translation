translation_notes:
  register: Français narratif moderne, clair et digne. Le passé simple convient au registre d’un récit biblique écrit sans être archaïque. Les phrases sont légèrement segmentées afin d’éviter une longue accumulation de coordinations tout en conservant la succession rapide des actions de l’hébreu.
