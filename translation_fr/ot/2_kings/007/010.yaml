base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/010.yaml
  text: So they came and called to the gatekeepers of the city[a], and they told them, saying, “We came to the camp of Aram, and behold, there was no one there, no human sound—only the horses tied, and the donkeys tied[b], and the tents as they were.”
translation:
  language: fr
  text: 'Ils vinrent appeler les gardiens de la porte de la ville et leur dirent : « Nous sommes allés au camp d’Aram, et voici : il n’y avait là personne, aucun bruit humain[a] ; il n’y avait que les chevaux attachés, les ânes attachés et les tentes telles qu’elles étaient. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucune voix humaine ». Le mot hébreu peut désigner spécialement la voix ou, plus largement, tout bruit produit par un être humain.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֵר הָעִיר
  choice: le gardien de la porte de la ville
  rationale: Le nom hébreu est morphologiquement singulier. Les formes plurielles qui suivent peuvent viser l’ensemble du personnel auquel ce gardien appartient; la traduction conserve donc le singulier du texte tout en gardant le pluriel « leur » ensuite.
- source_word: וַיַּגִּידוּ לָהֶם לֵאמֹר
  choice: Ils leur rapportèrent
  rationale: Le hiphil de נגד exprime ici le fait de transmettre un rapport. Cette formulation française rend naturellement la formule hébraïque sans reproduire lourdement « en disant ».
- source_word: מַחֲנֵה אֲרָם
  choice: le camp d’Aram
  rationale: « Aram » conserve directement le nom propre hébreu et évite de lui substituer l’appellation géopolitique traditionnelle « Syrie ».
- source_word: וְהִנֵּה
  choice: et voici
  rationale: Cette expression maintient la présentation vive et soudaine marquée par הִנֵּה, dans un registre biblique encore naturel en français moderne.
- source_word: אֵין שָׁם אִישׁ
  choice: il n’y avait là personne
  rationale: אִישׁ désigne ici une personne quelconque plutôt qu’un homme de sexe masculin; « personne » restitue clairement ce sens générique.
- source_word: וְקוֹל אָדָם
  choice: aucun bruit humain
  rationale: קוֹל peut désigner une voix ou plus largement un son. « Bruit humain » préserve cette portée large et rend אָדָם de manière générique.
- source_word: כִּי אִם
  choice: Il n’y avait que
  rationale: L’expression introduit les seules exceptions au constat d’absence. La tournure française explicite naturellement cette restriction.
- source_word: הַסּוּס אָסוּר ... וְהַחֲמוֹר אָסוּר
  choice: les chevaux attachés, les ânes attachés
  rationale: Les noms singuliers ont vraisemblablement une valeur collective. « Attachés » rend clairement אסר dans le contexte d’animaux laissés au camp.
- source_word: וְאֹהָלִים כַּאֲשֶׁר הֵמָּה
  choice: et les tentes telles qu’elles étaient
  rationale: La formulation conserve l’idée que les tentes avaient été laissées dans leur état, sans ajouter explicitement « à leur place ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct est allégé de la formule hébraïque « en disant », tandis que « et voici » en conserve la vivacité. L’ambiguïté de קוֹל entre « voix » et « bruit » est signalée en note.
