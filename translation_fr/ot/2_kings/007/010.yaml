  source_fidelity: 'Le sens général est fidèle au texte hébreu : arrivée au camp d’Aram, constat de l’absence de toute présence ou bruit humain, animaux attachés et tentes laissées telles quelles. Toutefois, le singulier « le gardien » suivi de « Ils leur rapportèrent » crée une discordance référentielle en français. Malgré la morphologie singulière de שֹׁעֵר, les pluriels contextuels justifient un collectif au pluriel.'
