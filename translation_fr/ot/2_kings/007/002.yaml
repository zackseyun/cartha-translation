base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/002.yaml
  text: Then the officer on whose arm the king leaned answered the man of God and said[a], “Look, if Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you are about to see it with your own eyes[b], but you will not eat from it.”
translation:
  language: fr
  text: 'Alors l’officier sur le bras duquel le roi s’appuyait répondit à l’homme de Dieu : « Eh bien, même si Yahweh faisait des fenêtres dans le ciel[a], une telle chose pourrait-elle arriver ? » L’homme de Dieu répondit : « Eh bien, tu le verras de tes propres yeux, mais tu n’en mangeras pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ouvrait les vannes du ciel ». L’hébreu dit littéralement « faisait des fenêtres dans le ciel », image d’une intervention extraordinaire venant d’en haut.'
    reason: Alternative idiomatique et explication de la métaphore hébraïque.
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: l’officier
  rationale: Le terme désigne ici un haut officier militaire ou royal, sans permettre de préciser sûrement son grade.
- source_word: נִשְׁעָן עַל יָדוֹ
  choice: sur le bras duquel le roi s’appuyait
  rationale: Cette formulation conserve l’image concrète de l’hébreu tout en étant idiomatique en français.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Titre hébreu traditionnel et transparent désignant ici le prophète.
- source_word: הִנֵּה
  choice: Voyons ! / Eh bien
  rationale: La particule attire fortement l’attention; des rendus distincts et naturels expriment respectivement l’incrédulité de l’officier et la réplique appuyée du prophète.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel présent dans le texte hébreu.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: faisait des fenêtres dans le ciel
  rationale: Le rendu maintient l’image inhabituelle des ouvertures célestes plutôt que de l’interpréter directement comme une abondante provision.
- source_word: הֲיִהְיֶה הַדָּבָר הַזֶּה
  choice: une telle chose pourrait-elle arriver ?
  rationale: Le conditionnel et l’interrogation rendent l’incrédulité concernant la possibilité de l’événement annoncé.
- source_word: רֹאֶה בְּעֵינֶיךָ
  choice: tu le verras de tes propres yeux
  rationale: Expression française naturelle qui conserve l’insistance de la formulation hébraïque.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: mais tu n’en mangeras pas
  rationale: Le pronom « en » renvoie naturellement à la nourriture ou à l’abondance promise dans le contexte, tout en préservant l’idée qu’il la verra sans y prendre part.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Nature des « fenêtres dans le ciel »
  choice: conserver la métaphore
  alternative: « ouvrir les vannes du ciel »
  rationale: La métaphore hébraïque peut évoquer une intervention ou une provision extraordinaires venant d’en haut, mais le verset ne l’explicite pas; le texte principal maintient donc son image et son ouverture interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. « Voyons ! » donne à la première réplique son ton sceptique, tandis que « Eh bien » marque la réponse ferme du prophète sans archaïsme. Le dialogue évite de répéter mécaniquement « il dit », puisque les interlocuteurs sont nommés pour lever l’ambiguïté naturelle en français.
