base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/003.yaml
  text: There were four men with a skin disease at the entrance of the gate[a], and they said to one another, “Why are we sitting here until we die?”
translation:
  language: fr
  text: 'Il y avait quatre hommes atteints d’une maladie de peau à l’entrée de la porte[a]. Ils se dirent entre eux : « Pourquoi restons-nous assis ici jusqu’à ce que nous mourions ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « lépreux ». Le terme hébreu désigne une affection cutanée associée à la צָרַעַת ; celle-ci ne correspond pas nécessairement à la lèpre moderne (maladie de Hansen).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעָה אֲנָשִׁים הָיוּ
  choice: Il y avait quatre hommes
  rationale: La tournure existentielle introduit les participants de cette nouvelle scène. Le français naturel place « il y avait » en tête sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: מְצֹרָעִים
  choice: atteints d’une maladie de peau
  rationale: Le terme désigne des personnes touchées par l’affection associée à צָרַעַת, sans correspondre nécessairement à la maladie de Hansen moderne. Cette formulation évite une identification médicale trompeuse.
- source_word: פֶּתַח הַשָּׁעַר
  choice: à l’entrée de la porte de la ville
  rationale: Le groupe construit signifie littéralement « à l’ouverture/entrée de la porte ». L’ajout explicatif « de la ville » rend en français moderne la fonction de שַׁעַר dans ce contexte urbain sans modifier le lieu désigné.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־רֵעֵהוּ
  choice: Ils se dirent les uns aux autres
  rationale: L’expression distributive au singulier a un sens réciproque. Cette formulation française naturelle conserve l’échange au sein du groupe.
- source_word: מָה אֲנַחְנוּ יֹשְׁבִים פֹּה
  choice: Pourquoi rester assis ici
  rationale: מָה introduit ici une question rhétorique de cause, donc « pourquoi ». L’infinitif français dans la question directe traduit naturellement l’action continue exprimée par le participe tout en gardant l’idée concrète d’être assis.
- source_word: עַד מָתְנוּ
  choice: jusqu’à ce que nous mourions
  rationale: La locution indique l’aboutissement fatal de leur attente. Le subjonctif est requis en français après « jusqu’à ce que ».
