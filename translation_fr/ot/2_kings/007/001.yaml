  to: 'Élisée dit alors : « Écoutez la parole de Yahweh ! Voici ce que dit Yahweh : Demain, vers la même heure, on aura un séa[a] de fleur de farine pour un sicle, et deux séas d’orge pour un sicle, à la porte de Samarie. »'
