  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע שִׁמְע֖וּ דְּבַר יְהוָ֑ה כֹּ֣ה אָמַ֣ר יְהוָ֗ה כָּ/עֵ֤ת מָחָר֙ סְאָֽה סֹ֣לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל בְּ/שַׁ֥עַר שֹׁמְרֽוֹן־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/001.yaml
  text: 'Then Elisha said[a], “Hear the word of Yahweh. Thus says Yahweh: About this time tomorrow, a seah of fine flour will be for a shekel, and two seahs of barley for a shekel, at the gate of Samaria.”'
translation:
  language: fr
  text: 'Élisée dit alors : « Écoutez la parole de Yahweh ! Voici ce que dit Yahweh : Demain, vers la même heure, on aura un séa[a] de fleur de farine pour un sicle, et deux séas d’orge pour un sicle, à la porte de Samarie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le séa était une unité de mesure de capacité pour les matières sèches.
    reason: Note culturelle nécessaire pour expliquer une unité ancienne conservée dans le texte.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw narratif fait progresser le récit ; « alors » restitue naturellement cette succession en français.
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif est au pluriel et introduit solennellement une proclamation prophétique.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve la formule prophétique traditionnelle et sa portée, sans la réduire à un simple message.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Formulation française actuelle et digne de la formule de messager prophétique.
- source_word: כָּעֵת מָחָר
  choice: Demain, vers la même heure
  rationale: Cette tournure française rend l’indication temporelle approximative portée par כְּ et renvoie naturellement à l’heure présente.
- source_word: סְאָה / סָאתַיִם
  choice: un séa / deux séas
  rationale: La translittération maintient l’unité de mesure sèche précise du texte hébreu et permet de rendre clairement le duel.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: L’expression désigne une farine fine de qualité ; « fleur de farine » est précis et naturel dans ce registre.
- source_word: בְּשֶׁקֶל
  choice: pour un sicle
  rationale: Dans ce contexte commercial, la préposition indique le prix ; « sicle » conserve l’unité ancienne.
- source_word: שְׂעֹרִים
  choice: orge
  rationale: Équivalent français courant du nom de cette céréale.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: au marché de la porte de Samarie
  rationale: L’ajout explicatif « marché » rend immédiatement compréhensible la fonction commerciale de la porte urbaine dans cette annonce de prix, sans changer le lieu indiqué.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La proclamation garde sa solennité, tandis que les unités hébraïques concrètes sont conservées. « Au marché de la porte » explicite sobrement le rôle commercial de la porte de la ville.
