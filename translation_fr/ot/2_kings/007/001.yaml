    issue: Ajout de « marché » dans « au marché de la porte de Samarie »
    rationale: Le texte hébreu dit seulement « à la porte de Samarie ». Bien que la porte urbaine ait pu être un lieu de commerce, « marché » explicite une donnée contextuelle qui n’est pas lexicalement présente et réduit l’équivalence formelle.
