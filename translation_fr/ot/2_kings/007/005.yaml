source:
  edition: WLC
  text: וַ/יָּק֣וּמוּ בַ/נֶּ֔שֶׁף לָ/ב֖וֹא אֶל מַחֲנֵ֣ה אֲרָ֑ם וַ/יָּבֹ֗אוּ עַד קְצֵה֙ מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֖ם אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/005.yaml
  text: So they arose at twilight to go to the camp of Aram. When they came to the edge of the camp of Aram[a], behold, there was no one there.
translation:
  language: fr
  text: Ils se levèrent donc au crépuscule pour se rendre au camp des Araméens. Lorsqu’ils arrivèrent à la lisière du camp des Araméens, voici qu’il n’y avait personne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּק֣וּמוּ
  choice: Ils se levèrent donc
  rationale: Le wayyiqtol de קום fait progresser le récit. « Se levèrent » garde un ton narratif digne, tandis que « donc » exprime naturellement la conséquence de leur décision précédente.
- source_word: בַנֶּשֶׁף
  choice: au crépuscule
  rationale: נֶשֶׁף désigne ici le crépuscule, vraisemblablement celui du soir d’après le contexte. La formulation conserve toutefois la portée lexicale sans ajouter explicitement « du soir ».
- source_word: לָבוֹא אֶל
  choice: pour se rendre à
  rationale: L’infinitif exprime le but. En français, « se rendre à » traduit naturellement le déplacement vers le camp sans reproduire mécaniquement « venir ».
- source_word: מַחֲנֵה אֲרָם
  choice: le camp des Araméens
  rationale: Dans cette construction, אֲרָם désigne le peuple ou le royaume araméen. « Le camp des Araméens » est clair et conforme à l’usage français biblique moderne.
- source_word: וַיָּבֹאוּ עַד קְצֵה
  choice: Lorsqu’ils arrivèrent à la lisière
  rationale: עַד קְצֵה indique qu’ils atteignirent l’extrémité extérieure du camp. « À la lisière » convient naturellement à la bordure d’un camp et « lorsqu’ils arrivèrent » restitue la progression temporelle.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: הִנֵּה signale une découverte soudaine et surprenante. « Voici que » en préserve la fonction discursive dans un registre français digne.
- source_word: אֵין שָׁם אִישׁ
  choice: il n’y avait personne
  rationale: Bien que אִישׁ soit morphologiquement masculin singulier, dans cette tournure négative il exprime idiomatiquement l’absence de tout être humain. « Personne » rend exactement ce sens en français naturel.
theological_decisions:
- issue: Valeur générique de אִישׁ dans une proposition existentielle négative
  choice: il n’y avait personne
  alternative: il n’y avait pas un homme
  rationale: Le contexte ne distingue pas les hommes des femmes, mais constate que le camp est entièrement vide. Traduire par « personne » préserve donc le sens générique de l’hébreu sans introduire une restriction masculine absente du propos.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique écrit. « Voici que » conserve l’effet de surprise de l’hébreu sans recourir à l’archaïque « voici » isolé; aucun appel de note n’est nécessaire.
