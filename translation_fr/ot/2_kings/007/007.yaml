  to: Ils se levèrent et s’enfuirent au crépuscule[a]. Ils abandonnèrent leurs tentes, leurs chevaux et leurs ânes — le camp tel qu’il était[b] — et s’enfuirent pour sauver leur vie[c].
  rationale: La révision retire l’inférence logique ajoutée par « donc » et rend plus visiblement l’apposition hébraïque relative au camp. Elle conserve la répétition de « s’enfuirent », le sens idiomatique de la fuite pour la vie, ainsi que l’ambiguïté lexicale de « crépuscule ».
