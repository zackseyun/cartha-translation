base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/007.yaml
  text: So they arose and fled at twilight[a], and they left their tents, their horses[c][b], their donkeys—the camp as it was—and fled for their lives.
translation:
  language: fr
  text: Ils se levèrent et s’enfuirent au crépuscule[a]. Ils abandonnèrent leurs tentes, leurs chevaux et leurs ânes — le camp tel qu’il était[b] — et s’enfuirent pour sauver leur vie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la tombée de la nuit » ; le terme hébreu peut désigner la pénombre du soir ou celle de l’aube.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le camp comme il était ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « vers leur vie », expression signifiant qu’ils fuyaient pour préserver leur vie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַנֶּשֶׁף
  choice: au crépuscule
  rationale: נֶשֶׁף désigne la pénombre entre le jour et la nuit. « Au crépuscule » est naturel en français et préserve l’indétermination lexicale quant au soir ou à l’aube.
- source_word: וַיַּעַזְבוּ
  choice: ils abandonnèrent
  rationale: Dans le contexte d’une fuite précipitée, עזב exprime ici plus fortement qu’un simple départ le fait de tout laisser sur place.
- source_word: אָהֳלֵיהֶם
  choice: leurs tentes
  rationale: Équivalent direct et usuel dans le contexte d’un camp militaire.
- source_word: סוּסֵיהֶם
  choice: leurs chevaux
  rationale: Équivalent lexical direct.
- source_word: חֲמֹרֵיהֶם
  choice: leurs ânes
  rationale: Équivalent courant en français moderne pour ces animaux domestiques de bât.
- source_word: הַמַּחֲנֶה כַּאֲשֶׁר הִיא
  choice: laissant le camp tel quel
  rationale: Cette formulation française naturelle conserve l’idée que le camp fut abandonné dans l’état où il se trouvait, sans préciser davantage.
- source_word: וַיָּנֻסוּ אֶל נַפְשָׁם
  choice: s’enfuirent pour sauver leur vie
  rationale: L’expression hébraïque signifie qu’ils fuient afin de préserver leur vie. La tournure française rend clairement cet idiome.
- source_word: וַיָּקוּמוּ
  choice: ils se levèrent
  rationale: קום marque le déclenchement de l’action; « se levèrent » conserve la cadence narrative avec dignité.
- source_word: וַיָּנ֣וּסוּ ... וַיָּנֻסוּ
  choice: s’enfuirent ... s’enfuirent
  rationale: La répétition du même verbe hébreu est préservée afin de rendre l’urgence et le mouvement du récit.
