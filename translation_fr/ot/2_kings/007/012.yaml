  text: וַ/יָּ֨קָם הַ/מֶּ֜לֶךְ לַ֗יְלָה וַ/יֹּ֨אמֶר֙ אֶל עֲבָדָ֔י/ו אַגִּֽידָה נָּ֣א לָ/כֶ֔ם אֵ֛ת אֲשֶׁר עָ֥שׂוּ לָ֖/נוּ אֲרָ֑ם יָדְע֞וּ כִּי רְעֵבִ֣ים אֲנַ֗חְנוּ וַ/יֵּצְא֤וּ מִן הַֽ/מַּחֲנֶה֙ לְ/הֵחָבֵ֤ה ב/ה/שדה לֵ/אמֹ֔ר כִּֽי יֵצְא֤וּ מִן הָ/עִיר֙ וְ/נִתְפְּשֵׂ֣/ם חַיִּ֔ים וְ/אֶל הָ/עִ֖יר נָבֹֽא־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/012.yaml
  text: Then the king arose in the night and said to his servants[a], “Let me tell you, please, what Aram has done to us. They know that we are hungry, so they have gone out from the camp to hide themselves in the field, saying, ‘When they come out from the city, we will seize them alive and enter the city.’”
translation:
  language: fr
  text: 'Alors le roi se leva dans la nuit et dit à ses serviteurs : « Permettez-moi de vous dire ce qu’Aram[a] nous a fait. Ils savent que nous avons faim ; ils ont donc quitté le camp pour aller se cacher dans la campagne, en se disant : “Quand ils sortiront de la ville, nous les prendrons vivants et nous entrerons dans la ville.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Araméens ». L’hébreu emploie ici le nom Aram pour désigner le peuple ou l’armée d’Aram.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Dans ce contexte nocturne, le verbe קום décrit naturellement le roi qui se lève, probablement de son lit, sans qu’il soit nécessaire de préciser davantage.
- source_word: לַיְלָה
  choice: pendant la nuit
  rationale: L’accusatif adverbial indique le moment de l’action ; cette formulation française conserve nettement le cadre nocturne.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עבד peut désigner les serviteurs, les assistants ou les fonctionnaires d’un roi. « Serviteurs » garde ici la portée large du terme hébreu.
- source_word: אַגִּידָה נָּא לָכֶם
  choice: Permettez-moi de vous dire
  rationale: Le cohortatif accompagné de נָא exprime une proposition insistante ou courtoise. Cette tournure en restitue la nuance sans produire un français artificiel.
- source_word: אֲרָם
  choice: Aram
  rationale: Le texte emploie le nom du pays ou du peuple de manière métonymique pour désigner les Araméens ou leur armée. La translittération évite de le remplacer par une désignation géopolitique moderne.
- source_word: יָדְעוּ כִּי רְעֵבִים אֲנַחְנוּ
  choice: Ils savent que nous avons faim
  rationale: Dans le raisonnement prêté aux ennemis, le parfait exprime une connaissance actuelle ; le présent est naturel en français dans ce discours direct.
- source_word: וַיֵּצְאוּ מִן הַמַּחֲנֶה
  choice: ils ont donc quitté le camp
  rationale: Le passé composé présente une action récente dont le résultat explique la situation présente. « Quitté » rend idiomatiquement la sortie hors du camp.
- source_word: לְהֵחָבֵה
  choice: pour aller se cacher
  rationale: L’infinitif exprime le but et comporte une valeur réfléchie. La formulation française rend explicitement le déplacement et la dissimulation envisagés.
- source_word: בַשָּׂדֶה
  choice: dans la campagne
  rationale: Le singulier hébreu peut désigner l’espace ouvert hors de la ville. « Dans la campagne » convient mieux en français à l’emplacement d’une embuscade que le trop étroit « dans le champ ».
- source_word: לֵאמֹר
  choice: en se disant
  rationale: Le terme introduit le contenu du plan que le roi attribue aux Araméens. « En se disant » conserve cette fonction tout en clarifiant qu’il s’agit de leur intention supposée.
- source_word: כִּי יֵצְאוּ מִן הָעִיר
  choice: Quand ils sortiront de la ville
  rationale: כִּי introduit ici la circonstance attendue qui déclenchera l’embuscade. « Quand » convient à l’assurance prêtée aux assiégeants.
- source_word: וְנִתְפְּשֵׂם חַיִּים
  choice: nous les prendrons vivants
  rationale: תפשׂ signifie saisir ou capturer, tandis que חַיִּים précise qu’ils doivent être pris en vie. La tournure choisie est exacte et naturelle.
- source_word: וְאֶל הָעִיר נָבֹא
  choice: puis nous entrerons dans la ville
  rationale: Le verbe בוא avec אֶל indique l’entrée dans la ville. « Puis » explicite sobrement la succession impliquée par la coordination hébraïque.
