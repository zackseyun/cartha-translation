translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche du mouvement du texte hébreu, tout en évitant des calques peu naturels. Le passage du singulier collectif « Aram » au pronom pluriel « ils » reflète la référence à l’armée ou aux Araméens.
