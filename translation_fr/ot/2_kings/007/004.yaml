base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/004.yaml
  text: If we say[a], ‘Let us enter the city,’ the famine is in the city, and we will die there. And if we sit here, we will die. So now, come, let us fall into the camp of Aram. If they let us live, we will live; and if they put us to death[b], we will die.”
translation:
  language: fr
  text: 'Si nous disons : « Entrons dans la ville », la famine est dans la ville, et nous y mourrons. Et si nous restons ici, nous mourrons. Maintenant donc, allons tomber dans le camp d’Aram[a]. S’ils nous laissent vivre, nous vivrons ; et s’ils nous tuent, nous mourrons. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « allons nous rendre au camp d’Aram » ou « passer au camp d’Aram ». L’expression hébraïque נפל אל, littéralement « tomber vers/dans », peut, dans un contexte militaire, désigner le fait de se rallier à une force ou de se rendre à elle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבוֹא
  choice: Entrons
  rationale: Dans les paroles envisagées après « si nous disons », l’imparfait à la première personne du pluriel exprime ici une proposition. L’impératif français « Entrons » rend naturellement cette valeur.
- source_word: הָרָעָב בָּעִיר
  choice: la famine y sévit
  rationale: רָעָב désigne une famine, non une simple faim. Le verbe « sévit » donne en français naturel le sens de sa présence active dans la ville, tandis que « y » reprend « la ville » sans lourdeur.
- source_word: יָשַׁבְנוּ פֹה
  choice: nous restons ici
  rationale: ישׁב peut signifier s’asseoir, demeurer ou rester. Dans cette délibération sur les options possibles, « rester » exprime clairement le fait de ne pas bouger.
- source_word: וְעַתָּה לְכוּ
  choice: Maintenant donc, allons
  rationale: וְעַתָּה marque le passage de la réflexion à la décision, et לְכוּ introduit une exhortation collective. Cette formulation est idiomatique et conserve la progression logique.
- source_word: וְנִפְּלָה אֶל
  choice: allons nous rendre à
  rationale: Dans un contexte militaire, נפל אל est un idiome qui peut signifier passer à l’autre camp ou se livrer à lui. « Se rendre à » communique clairement ce sens en français moderne.
- source_word: מַחֲנֵה אֲרָם
  choice: camp d’Aram
  rationale: Le nom hébreu אֲרָם est conservé sous la forme « Aram », plutôt que remplacé dans le texte par « Syrie ».
- source_word: יְחַיֻּנוּ נִחְיֶה
  choice: S’ils nous laissent en vie, nous vivrons
  rationale: Le piel de חיה signifie préserver la vie ou laisser vivre. La formulation conserve la répétition intentionnelle autour de la vie.
- source_word: יְמִיתֻנוּ
  choice: s’ils nous font mourir
  rationale: Le hifil de מות est causatif. « Faire mourir » en préserve la forme et maintient le parallèle lexical avec « nous mourrons ».
- source_word: וָמַתְנוּ / וָמָתְנוּ
  choice: nous mourrons
  rationale: Dans ces propositions conditionnelles, la forme exprime le résultat attendu. Le futur français convient à cette conséquence certaine selon chaque option.
