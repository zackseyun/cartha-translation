- from: 'Si nous disons : « Entrons dans la ville », la famine y sévit et nous y mourrons. Et si nous restons ici, nous mourrons. Maintenant donc, allons nous rendre[a] au camp d’Aram[b]. S’ils nous laissent en vie, nous vivrons ; et s’ils nous font mourir, nous mourrons. »'
  to: 'Si nous disons : « Entrons dans la ville », la famine est dans la ville, et nous y mourrons. Et si nous restons ici, nous mourrons. Maintenant donc, allons tomber dans le camp d’Aram[a]. S’ils nous laissent vivre, nous vivrons ; et s’ils nous tuent, nous mourrons. »'
  rationale: La révision conserve la délibération concise et répétitive du texte hébreu, évite d’ajouter l’idée de « sévir », et surtout ne transforme pas en sens unique l’idiome נפל אל. La note culturelle sur Aram demeure utile, mais ne doit pas être signalée dans le texte si l’ancre n’est pas placée sur « Aram ».
