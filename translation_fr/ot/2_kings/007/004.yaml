  register: Français international moderne, digne et direct. Le rythme répétitif du raisonnement désespéré est conservé, notamment par « nous mourrons » et par le parallèle entre « laissent en vie » et « vivrons ». Les marqueurs de note ont été placés sur les expressions qu’ils expliquent.
