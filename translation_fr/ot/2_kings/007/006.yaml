source:
  edition: WLC
  text: וַ/אדֹנָ֞/י הִשְׁמִ֣יעַ אֶת מַחֲנֵ֣ה אֲרָ֗ם ק֥וֹל רֶ֨כֶב֙ ק֣וֹל ס֔וּס ק֖וֹל חַ֣יִל גָּד֑וֹל וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו הִנֵּ֣ה שָֽׂכַר עָלֵי/נוּ֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶת מַלְכֵ֧י הַ/חִתִּ֛ים וְ/אֶת מַלְכֵ֥י מִצְרַ֖יִם לָ/ב֥וֹא עָלֵֽי/נוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/006.yaml
  text: For the Lord had caused the camp of Aram to hear the sound of chariots[a], the sound of horses, the sound of a great army, and they said to one another, “Look, the king of Israel has hired the kings of the Hittites and the kings of Egypt against us[c][b], to come against us.”
translation:
  language: fr
  text: 'Car le Seigneur avait fait entendre au camp d’Aram le bruit des chars, le bruit des chevaux et le bruit d’une grande armée, et ils se dirent les uns aux autres[a] : « Regardez ! Le roi d’Israël a engagé contre nous les rois des Hittites et les rois d’Égypte pour venir contre nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chacun dit à son frère » ou « un homme dit à son frère ».'
    reason: L’expression hébraïque concrète a une valeur réciproque, rendue dans le texte par « les uns aux autres ».
lexical_decisions:
- source_word: וַאדֹנָי
  choice: le Seigneur
  rationale: Le mot est le titre divin אֲדֹנָי, et non le tétragramme. « Le Seigneur » désigne naturellement ici le Dieu d’Israël sans substituer un nom absent du texte.
- source_word: הִשְׁמִיעַ
  choice: avait fait entendre
  rationale: Le hifil de שׁמע exprime la causation. Le plus-que-parfait convient à l’explication rétrospective de la fuite des Araméens.
- source_word: מַחֲנֵה אֲרָם
  choice: au camp d’Aram
  rationale: « Aram » conserve le nom hébreu et évite les associations géopolitiques modernes de « Syrie ».
- source_word: קוֹל רֶכֶב ... קוֹל סוּס ... קוֹל חַיִל גָּדוֹל
  choice: le bruit des chars, le bruit des chevaux et le bruit d’une grande armée
  rationale: La triple reprise de קוֹל est conservée. « Bruit » rend ici clairement l’impression sonore d’une force militaire en mouvement.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל אָחִיו
  choice: ils s’étaient dit les uns aux autres
  rationale: Cette formulation française naturelle rend la valeur réciproque de l’expression hébraïque, dont la forme littérale est signalée en note.
- source_word: הִנֵּה
  choice: Regardez !
  rationale: L’impératif attire vivement l’attention et restitue la force déictique de הִנֵּה dans un français actuel.
- source_word: שָׂכַר עָלֵינוּ
  choice: a engagé contre nous
  rationale: שׂכר signifie « engager, louer les services de » et עַל prend ici un sens hostile. Aucun complément tel que « mercenaires » n’est ajouté.
- source_word: מַלְכֵי הַחִתִּים
  choice: les rois des Hittites
  rationale: La traduction conserve explicitement le pluriel et le rapport génitif du texte.
- source_word: מַלְכֵי מִצְרַיִם
  choice: les rois d’Égypte
  rationale: Le pluriel, même historiquement surprenant, est maintenu conformément au texte massorétique.
- source_word: לָבוֹא עָלֵינוּ
  choice: pour qu’ils marchent contre nous
  rationale: Cette tournure exprime naturellement en contexte militaire le déplacement hostile marqué par בוא avec עַל, sans réduire explicitement l’expression au seul acte d’attaquer.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: le Maître
  rationale: Le contexte identifie le référent comme le Dieu d’Israël. « Le Seigneur » est le titre divin français usuel, tout en évitant de rendre אֲדֹנָי comme s’il s’agissait du tétragramme.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition rhétorique de « le bruit » ainsi que les pluriels « rois » sont conservés; les formulations archaïques et les précisions historiques absentes de l’hébreu sont évitées.
