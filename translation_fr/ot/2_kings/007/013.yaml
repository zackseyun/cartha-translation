base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/013.yaml
  text: Then one of his servants answered and said[a], “Please let them take five of the horses that remain, which are left in it. Behold, they are like all the multitude of Israel who are left in it; behold, they are like all the multitude of Israel who have perished[b]. So let us send and see.”
translation:
  language: fr
  text: 'Alors l’un de ses serviteurs répondit : « Qu’on prenne donc cinq des chevaux qui restent, ceux qui y sont restés[a]. Ils sont comme toute la multitude d’Israël qui y reste ; ils sont comme toute la multitude d’Israël qui a péri[b]. Envoyons et voyons. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « en elle ». Le pronom féminin renvoie très probablement à la ville de Samarie, sans que le nom de la ville soit répété dans ce verset.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu présente ici une comparaison difficile et répétitive : « ils sont comme toute la multitude d’Israël qui y reste… comme toute la multitude d’Israël qui a péri ». La traduction conserve cette répétition plutôt que d’en préciser le sens de manière conjecturale.'
    reason: textual_difficulty
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵעֲבָדָיו
  choice: Alors l’un de ses serviteurs répondit
  rationale: Dans le récit, ענה introduit ici une prise de parole. « Serviteurs » demeure assez large pour le contexte de la cour sans préciser indûment leur statut.
- source_word: וְיִקְחוּ נָא
  choice: Qu’on prenne donc
  rationale: Le tour jussif avec נָא exprime une proposition pressante mais courtoise. « Donc » rend naturellement cette nuance en français sans alourdir la réplique.
- source_word: חֲמִשָּׁה מִן הַסּוּסִים
  choice: cinq des chevaux
  rationale: Le partitif מן se rend naturellement par « des ».
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ בָהּ
  choice: qui restent, ceux qui sont encore dans la ville
  rationale: La formulation conserve la répétition de שׁאר par deux expressions françaises proches. « La ville » explicite le référent féminin implicite, très probablement Samarie, signalé en note.
- source_word: הִנָּם
  choice: Ils sont
  rationale: Le pronom démonstratif emphatique est intégré avec sobriété à la phrase française. Répéter « voici » deux fois produirait ici un effet artificiel et obscurcirait davantage une comparaison déjà difficile.
- source_word: כְּכָל הֲמוֹן יִשְׂרָאֵל
  choice: comme toute la multitude d’Israël
  rationale: « Multitude » conserve le sens collectif de הָמוֹן et la portée de כָּל sans réduire Israël aux seuls habitants mentionnés.
- source_word: אֲשֶׁר תָּמּוּ
  choice: qui a péri
  rationale: Dans le contexte de la famine, תמם indique ceux qui sont arrivés à leur fin, donc qui ont péri.
- source_word: וְנִשְׁלְחָה וְנִרְאֶה
  choice: Envoyons des hommes voir ce qu’il en est
  rationale: Les deux cohortatifs expriment une proposition. Le français exige normalement un complément après « envoyer » ; « des hommes » explicite minimalement les personnes chargées de la reconnaissance, sans préciser leur identité.
