source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/עָ֔ם וַ/יָּבֹ֕זּוּ אֵ֖ת מַחֲנֵ֣ה אֲרָ֑ם וַ/יְהִ֨י סְאָה סֹ֜לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל כִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/016.yaml
  text: Then the people went out and plundered the camp of Aram[a], and a seah of fine flour was sold for a shekel, and two seahs of barley for a shekel[b], according to the word of Yahweh.
translation:
  language: fr
  text: Alors le peuple sortit et pilla le camp d’Aram. Un séa[a] de fleur de farine se vendit pour un sicle[b], et deux séas d’orge pour un sicle, conformément à la parole de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le séa était une mesure de capacité pour les matières sèches.
    reason: cultural_note
  - marker: b
    text: Le sicle était une unité de poids utilisée comme référence de valeur.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הָעָם
  choice: Alors le peuple sortit
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession en français, tandis que « le peuple » traduit directement הָעָם.
- source_word: וַיָּבֹזּוּ
  choice: pilla
  rationale: Le verbe בזז désigne le fait d’emporter le butin d’un ennemi. « Piller » est clair, actuel et conserve le contexte militaire.
- source_word: מַחֲנֵה אֲרָם
  choice: le camp d’Aram
  rationale: Cette formulation suit de près la construction hébraïque et conserve le nom ancien Aram sans le remplacer par une désignation géopolitique ultérieure.
- source_word: וַיְהִי
  choice: se vendit
  rationale: Dans cette formule de prix, le verbe indique idiomatiquement que la denrée atteignit ce prix sur le marché. « Se vendit » rend ce sens implicite sans lourdeur.
- source_word: סְאָה / סָאתַיִם
  choice: une séa / deux séas
  rationale: L’hébreu nomme une mesure précise de capacité pour les matières sèches, avec un duel explicite dans le second cas. La translittération préserve cette réalité ancienne.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: סֹלֶת désigne une farine fine et de qualité. « Fleur de farine » est l’expression française usuelle et précise.
- source_word: בְּשֶׁקֶל
  choice: pour un sicle
  rationale: « Pour » convient à l’énoncé d’un prix. « Sicle » est le terme français traditionnel pour cette unité ancienne de poids servant ici de référence monétaire.
- source_word: שְׂעֹרִים
  choice: orge
  rationale: Le pluriel hébreu désigne ici la denrée de manière collective; le singulier collectif « orge » est naturel en français.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole de Yahweh
  rationale: La formule souligne l’accomplissement exact de la parole prophétique antérieure. « Conformément à » préserve cette relation, et le nom divin est rendu directement par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Rapport entre l’événement et la parole prophétique
  choice: conformément à la parole de Yahweh
  alternative: comme Yahweh l’avait dit
  rationale: Le choix retenu reste proche de la construction כִּדְבַר et affirme l’accomplissement sans ajouter au texte une précision temporelle explicite.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit; les unités anciennes et le nom Aram sont conservés, avec de brèves notes culturelles pour l’intelligibilité.
