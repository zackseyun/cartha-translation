  text: וַ/יִּקְח֕וּ שְׁנֵ֖י רֶ֣כֶב סוּסִ֑ים וַ/יִּשְׁלַ֨ח הַ/מֶּ֜לֶךְ אַחֲרֵ֧י מַחֲנֵֽה אֲרָ֛ם לֵ/אמֹ֖ר לְכ֥וּ וּ/רְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/014.yaml
  text: So they took two chariots with horses[a], and the king sent them after the camp of Aram, saying, “Go and see.”
translation:
  language: fr
  text: 'Ils prirent donc deux chars avec leurs chevaux[a], et le roi les envoya à la suite du camp d’Aram, en disant : « Allez voir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « deux chars de chevaux », expression condensée désignant probablement deux chars attelés ou deux équipages de chars.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Ils prirent donc
  rationale: Le wayyiqtol fait progresser le récit. « donc » exprime ici naturellement la conséquence de la décision prise au verset précédent.
- source_word: שְׁנֵי רֶכֶב סוּסִים
  choice: deux chars avec leurs chevaux
  rationale: L’expression hébraïque est condensée et quelque peu elliptique. Cette formulation française désigne clairement deux chars attelés sans imposer une analyse plus précise que le texte.
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ
  choice: et le roi les envoya
  rationale: 'Le pronom « les » explicite en français l’objet sous-entendu par le contexte : les hommes ou équipages chargés de la reconnaissance.'
- source_word: אַחֲרֵי מַחֲנֵה אֲרָם
  choice: à la suite du camp d’Aram
  rationale: La locution garde le sens directionnel de אַחֲרֵי et indique que les envoyés suivent la piste du camp qui s’est déplacé, sans suggérer nécessairement une poursuite militaire offensive.
- source_word: אֲרָם
  choice: Aram
  rationale: Le nom ancien du royaume est conservé ; « Syrie » risquerait une association anachronique avec l’État moderne.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Rend la formule hébraïque qui introduit le discours direct tout en restant idiomatique en français.
- source_word: לְכוּ וּרְאוּ
  choice: Allez voir
  rationale: Les deux impératifs brefs et directs sont rendus par une expression française naturelle qui conserve l’ordre de reconnaissance.
theological_decisions: []
