source:
  edition: WLC
  text: וַ/יֵּלְכ֣וּ אַחֲרֵי/הֶם֮ עַד הַ/יַּרְדֵּן֒ וְ/הִנֵּ֣ה כָל הַ/דֶּ֗רֶךְ מְלֵאָ֤ה בְגָדִים֙ וְ/כֵלִ֔ים אֲשֶׁר הִשְׁלִ֥יכוּ אֲרָ֖ם ב/החפז/ם וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים וַ/יַּגִּ֖דוּ לַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/015.yaml
  text: So they went after them as far as the Jordan[a], and behold, the whole road was full of garments and equipment that Aram had thrown away in their haste[c][b]. Then the messengers returned and reported to the king.
translation:
  language: fr
  text: Ils les suivirent donc jusqu’au Jourdain. Or, tout le chemin était jonché de vêtements et de matériel qu’Aram avait jetés dans sa hâte. Puis les messagers revinrent faire leur rapport au roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵיהֶם
  choice: Ils les suivirent donc
  rationale: Rend naturellement la progression narrative du wayyiqtol et le sens contextuel de poursuite porté par אַחֲרֵיהֶם, sans exagérer en parlant d’une poursuite militaire active.
- source_word: עַד הַיַּרְדֵּן
  choice: jusqu’au Jourdain
  rationale: עַד indique la limite atteinte; « jusqu’au » est direct et idiomatique en français.
- source_word: וְהִנֵּה
  choice: Or
  rationale: Marque la découverte et attire l’attention dans un registre narratif digne et actuel; « voici » serait possible, mais plus marqué ici.
- source_word: כָל הַדֶּרֶךְ מְלֵאָה
  choice: tout le chemin était jonché
  rationale: Le sens littéral est « tout le chemin était plein ». « Était jonché » exprime naturellement en français qu’une route est couverte d’objets abandonnés.
- source_word: בְגָדִים
  choice: vêtements
  rationale: Terme courant, exact et immédiatement compréhensible pour les pièces d’habillement.
- source_word: וְכֵלִים
  choice: matériel
  rationale: כֵלִים est un terme large désignant des objets, ustensiles ou équipements. Dans le contexte d’une armée en fuite, « matériel » conserve cette largeur sans réduire le sens à des récipients.
- source_word: אֲשֶׁר הִשְׁלִיכוּ אֲרָם
  choice: qu’Aram avait jetés
  rationale: Le plus-que-parfait situe correctement l’abandon avant la découverte. « Aram » préserve le nom collectif du texte hébreu.
- source_word: בְחָפְזָם
  choice: dans sa hâte
  rationale: Le suffixe pluriel renvoie aux membres du collectif Aram; en français, l’accord sémantique au singulier avec le nom collectif donne une phrase naturelle. « Hâte » évite de surinterpréter par « panique ».
- source_word: וַיָּשֻׁבוּ הַמַּלְאָכִים
  choice: Puis les messagers revinrent
  rationale: מַלְאָכִים signifie littéralement « messagers ». Bien que ces hommes aient été envoyés en reconnaissance, « messagers » préserve le lexème source.
- source_word: וַיַּגִּידוּ לַמֶּלֶךְ
  choice: faire leur rapport au roi
  rationale: Dans ce contexte officiel, cette formulation rend naturellement l’idée d’informer ou de rapporter les constatations au roi.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve « Aram » comme nom collectif, l’ampleur sémantique de כֵלִים et la fonction littérale de « messagers », tout en privilégiant une syntaxe française naturelle.
