base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/006.yaml
  text: The rest of the acts of Azariah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: fr
  text: Le reste des actes d’Azaria et tout ce qu’il a fait, cela n’est-il pas écrit[a] dans le livre des Annales des rois de Juda[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « consigné » ou « rapporté ». Le texte retient « écrit », plus proche du terme hébreu.'
    reason: lexical_alternative
  - marker: b
    text: Le « livre des Annales des rois de Juda » désigne un registre ou des annales royales, régulièrement cités comme source dans les livres des Rois.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי עֲזַרְיָהוּ
  choice: Le reste des actes d’Azaria
  rationale: Dans cette formule de conclusion des règnes, דִּבְרֵי désigne les faits et gestes du roi plutôt que ses seules paroles. « Le reste des actes » est naturel en français et garde la portée historiographique de l’expression.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: ainsi que tout ce qu’il a fait
  rationale: Rend directement la proposition relative tout en reliant naturellement les deux éléments coordonnés en français.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: tout cela n’est-il pas écrit
  rationale: Conserve la question rhétorique hébraïque et le sens direct de כְּתוּבִים. La reprise « tout cela » clarifie en français le référent du pronom pluriel hébreu הֵם.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Bien que עַל signifie littéralement « sur », le français dit idiomatiquement qu’un renseignement est écrit « dans » un livre ou un registre.
- source_word: דִּבְרֵי הַיָּמִים
  choice: les Annales
  rationale: Dans ce contexte archivistique, l’expression désigne une chronique suivie des événements royaux. « Annales » communique clairement cette fonction en français moderne.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: des rois de Juda
  rationale: Dans le titre de cette source, la préposition לְ exprime l’appartenance ou la destination et se rend naturellement par « des ».
