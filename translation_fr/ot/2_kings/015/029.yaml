  text: בִּ/ימֵ֞י פֶּ֣קַח מֶֽלֶךְ יִשְׂרָאֵ֗ל בָּא֮ תִּגְלַ֣ת פִּלְאֶסֶר֮ מֶ֣לֶךְ אַשּׁוּר֒ וַ/יִּקַּ֣ח אֶת עִיּ֡וֹן וְ/אֶת אָבֵ֣ל בֵּֽית מַעֲכָ֡ה וְ/אֶת יָ֠נוֹחַ וְ/אֶת קֶ֨דֶשׁ וְ/אֶת חָצ֤וֹר וְ/אֶת הַ/גִּלְעָד֙ וְ/אֶת הַ/גָּלִ֔ילָ/ה כֹּ֖ל אֶ֣רֶץ נַפְתָּלִ֑י וַ/יַּגְלֵ֖/ם אַשּֽׁוּרָ/ה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/029.yaml
  text: In the days of Pekah king of Israel[a], Tiglath-pileser king of Assyria came and captured Ijon, Abel-beth-maacah, Janoah, Kedesh, Hazor, Gilead, and Galilee—all the land of Naphtali—and he carried them away to Assyria.
translation:
  language: fr
  text: Du temps de Péqah, roi d’Israël, Tiglath-Piléser, roi d’Assyrie, vint et s’empara d’Iyyôn, d’Abel-Beth-Maaka, de Yanoah, de Qédesh, de Hatsor, de Galaad et de la Galilée — tout le territoire de Nephtali —, puis il les déporta en Assyrie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il les emmena en exil en Assyrie ».'
    reason: Alternative lexicale pour le verbe hébreu exprimant la déportation ou l’exil.
lexical_decisions:
- source_word: בִּימֵי
  choice: Du temps de
  rationale: Rend naturellement la formule temporelle hébraïque tout en conservant son caractère historique.
- source_word: בָּא
  choice: vint
  rationale: Conserve le sens littéral du verbe; le contexte militaire est explicité par le verbe suivant.
- source_word: וַיִּקַּח
  choice: s’empara de
  rationale: Dans ce contexte de conquête de villes et de régions, cette expression française transmet clairement le sens militaire de « prendre ».
- source_word: עִיּוֹן
  choice: Iyyôn
  rationale: Translittération française proche de la forme hébraïque.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: Abel-Beth-Maaka
  rationale: Forme toponymique française lisible, réunie par des traits d’union.
- source_word: יָנוֹחַ
  choice: Yanoah
  rationale: Translittération française proche de la forme hébraïque.
- source_word: קֶדֶשׁ
  choice: Qédesh
  rationale: Translittération française usuelle et proche de l’hébreu.
- source_word: חָצוֹר
  choice: Hatsor
  rationale: Forme française courante du toponyme.
- source_word: הַגִּלְעָד
  choice: Galaad
  rationale: Forme française biblique établie et immédiatement reconnaissable.
- source_word: הַגָּלִילָה
  choice: la Galilée
  rationale: Forme géographique naturelle en français, avec l’article requis par l’usage.
- source_word: כֹּל אֶרֶץ נַפְתָּלִי
  choice: tout le territoire de Nephtali
  rationale: « Territoire » convient ici à une étendue tribale et rend clairement la valeur récapitulative de l’expression.
- source_word: וַיַּגְלֵם
  choice: il en déporta les habitants
  rationale: Le suffixe masculin pluriel renvoie naturellement aux populations des lieux conquis; cette explicitation évite en français de donner l’impression que des villes elles-mêmes furent emportées.
- source_word: אַשּׁוּרָה
  choice: en Assyrie
  rationale: La forme directionnelle indique le lieu de destination; « en Assyrie » est l’expression idiomatique française.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les formes des noms propres suivent des usages francophones reconnaissables tout en restant proches de l’hébreu. L’incise entre tirets conserve la fonction récapitulative de « tout le territoire de Nephtali ».
