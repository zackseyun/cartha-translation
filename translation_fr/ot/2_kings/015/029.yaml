    issue: Explicitation de « les habitants » pour le suffixe pronominal de וַיַּגְלֵם.
    rationale: Le texte hébreu dit littéralement « il les déporta » et ne nomme pas son référent. Même si les déportés sont contextuellement les habitants, l’ajout dans le texte principal réduit cette concision et l’ambiguïté formelle.
  - severity: low
    issue: La note actuelle présente « il les déporta » comme littéral tout en justifiant une explicitation absente du texte source.
    rationale: Une note d’alternative lexicale est préférable et évite d’affirmer que le pronom doit être remplacé dans la traduction par « les habitants ».
