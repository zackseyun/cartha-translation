source:
  edition: WLC
  text: ה֣וּא דְבַר יְהוָ֗ה אֲשֶׁ֨ר דִּבֶּ֤ר אֶל יֵהוּא֙ לֵ/אמֹ֔ר בְּנֵ֣י רְבִיעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל וַֽ/יְהִי כֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/012.yaml
  text: This was the word of Yahweh that he spoke to Jehu, saying, “Your sons to the fourth generation shall sit on the throne of Israel.” And so it happened.
translation:
  language: fr
  text: 'C’était là la parole que Yahvé avait adressée à Jéhu : « Tes fils siégeront sur le trône d’Israël jusqu’à la quatrième génération. » Et il en fut ainsi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא דְבַר יְהוָה
  choice: C’était là la parole que Yahvé
  rationale: « C’était là » renvoie naturellement en français à l’événement précédent comme accomplissement de la parole divine; « parole » conserve l’expression biblique sans la réduire explicitement à une promesse.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, plutôt que substitution par un titre.
- source_word: אֲשֶׁר דִּבֶּר אֶל יֵהוּא לֵאמֹר
  choice: 'avait adressée à Jéhu :'
  rationale: Le plus-que-parfait marque l’antériorité de l’oracle par rapport à son accomplissement; les deux verbes hébreux introduisant la citation sont rendus par une tournure française concise et naturelle.
- source_word: בְּנֵי רְבִיעִים
  choice: Tes fils … jusqu’à la quatrième génération
  rationale: La formulation garde l’image filiale de בְּנֵי tout en explicitant clairement la portée dynastique de l’expression hébraïque.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: siégeront sur le trône d’Israël
  rationale: « Siéger » préserve la métaphore concrète du trône et exprime idiomatiquement l’exercice de la royauté; le datif לְךָ est reflété par « tes fils » et la continuité de la lignée.
- source_word: וַיְהִי כֵן
  choice: Et il en fut ainsi
  rationale: Formule française digne et concise qui indique explicitement l’accomplissement de la déclaration.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahvé » le conserve sous sa forme française traditionnelle et largement intelligible.
- issue: Nature de דְבַר יְהוָה
  choice: la parole que Yahvé avait adressée
  alternative: la promesse de Yahvé
  rationale: « Parole » préserve la catégorie plus large du texte hébreu, tout en laissant le contenu cité manifester qu’il s’agit ici d’une promesse dynastique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement solennelle sans archaïsmes opaques. Aucun appel de note n’est nécessaire.
