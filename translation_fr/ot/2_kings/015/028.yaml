source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִן חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/028.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh. Il ne se détourna pas des péchés de Jéroboam, fils de Nebath, qui avait fait pécher Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: La formule royale hébraïque est rendue dans un français naturel tout en conservant son évaluation morale directe.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette formulation française courante préserve la métaphore hébraïque du jugement porté par Dieu ainsi que le nom divin.
- source_word: לֹא סָר מִן חַטֹּאות
  choice: Il ne se détourna pas des péchés
  rationale: Le verbe סור avec מן exprime ici l’abandon d’une conduite; « se détourner de » convient au contexte moral.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Forme française traditionnelle et intelligible du nom et du patronyme bibliques.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: qui avait fait pécher Israël
  rationale: Le hifil de חטא est causatif. Le plus-que-parfait indique naturellement en français que cette action de Jéroboam était antérieure au règne évalué.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve ici le nom propre d’alliance sans le remplacer par un titre.
- issue: Responsabilité de Jéroboam dans le péché d’Israël
  choice: avait fait pécher Israël
  alternative: avait entraîné Israël dans le péché
  rationale: Le causatif hébreu attribue explicitement à Jéroboam un rôle causal; la traduction retenue préserve cette force sans préciser davantage le mécanisme de son influence.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe conserve la formule récurrente des évaluations royales tout en restant naturelle. Aucun marqueur de note n’est nécessaire.
