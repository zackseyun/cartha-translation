source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹתָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/036.yaml
  text: The rest of the acts of Jotham[a], which he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: fr
  text: Le reste des actes de Yotam, qu’il a accomplis, ne sont-ils pas écrits[a] dans le livre des Annales des rois de Juda[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « consignés ». Le terme hébreu signifie littéralement « écrits », avec ici l’idée d’une inscription dans un document officiel.
    reason: lexical_alternative
  - marker: b
    text: Le « livre des Annales des rois de Juda » désigne une source annalistique royale, pas nécessairement le livre biblique des Chroniques.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes
  rationale: יֶתֶר désigne ce qui reste, et דִּבְרֵי, dans cette formule de bilan royal, renvoie aux actes ou aux faits du roi plutôt qu’à ses seules paroles. Le וְ initial assure la liaison avec le contexte sans exiger ici un « et » explicite en français.
- source_word: יוֹתָם
  choice: Yotam
  rationale: Translittération française simple et proche de la forme hébraïque du nom propre.
- source_word: אֲשֶׁר עָשָׂה
  choice: tout ce qu’il a fait
  rationale: Cette formulation naturelle conserve la proposition relative et son caractère récapitulatif sans réduire son champ à un acte particulier.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: n’est-il pas écrit
  rationale: La question rhétorique, qui appelle une réponse affirmative, est conservée. En français, le singulier s’accorde naturellement avec « le reste », malgré la reprise plurielle hébraïque qui envisage les différents actes.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Littéralement « sur le livre/rouleau » ; « dans le livre » exprime idiomatiquement l’inscription dans un document.
- source_word: דִּבְרֵי הַיָּמִים
  choice: les Annales
  rationale: Dans cette citation de source royale, l’expression désigne un relevé chronologique ou annalistique. « Annales » communique clairement cette fonction en français.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: des rois de Juda
  rationale: Dans le titre de la source, la préposition לְ indique que les annales concernent les rois de Juda ; le complément français avec « de » est idiomatique.
theological_decisions:
- issue: Identification du document cité
  choice: Présenter les « Annales des rois de Juda » comme une source royale sans les identifier au livre biblique des Chroniques
  alternative: Comprendre cette désignation comme un renvoi direct au livre canonique des Chroniques
  rationale: La formule hébraïque désigne une source annalistique royale citée par le rédacteur des Rois ; le texte ne l’identifie pas explicitement au livre biblique appelé les Chroniques.
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve la question rhétorique et la structure récapitulative de la formule royale, tout en employant « Annales » pour rendre clairement la nature du document cité.
