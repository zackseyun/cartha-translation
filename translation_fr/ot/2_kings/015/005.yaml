base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/005.yaml
  text: And Yahweh struck the king[a], and he was leprous until the day of his death, and he lived in a separate house. And Jotham the king’s son was over the household[b], judging the people of the land.
translation:
  language: fr
  text: Le SEIGNEUR frappa le roi, qui fut atteint de lèpre[a] jusqu’au jour de sa mort. Il vécut dans une maison à l’écart[b]. Yotam, fils du roi, était à la tête du palais et rendait la justice au peuple du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traditionnellement rendu par « lèpre » peut désigner plus largement une grave affection de la peau; il ne correspond pas nécessairement à la lèpre moderne, ou maladie de Hansen.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque est incertaine; elle peut désigner « une maison de séparation » ou « une maison isolée », vraisemblablement une résidence distincte.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le nom divin par la convention française traditionnelle en petites capitales, claire pour le lecteur tout en le distinguant du titre ordinaire « Seigneur ».
- source_word: וַיְנַגַּע
  choice: frappa
  rationale: Dans ce contexte, נגע désigne une atteinte infligée par Dieu, et non un simple contact. « Frappa » conserve clairement l’action divine sans en préciser le mécanisme.
- source_word: מְצֹרָע
  choice: fut atteint de lèpre
  rationale: Cette formulation française naturelle conserve le terme traditionnel, tandis qu’une note précise que le mot hébreu ne correspond pas nécessairement à la maladie de Hansen.
- source_word: עַד יוֹם מֹתוֹ
  choice: jusqu’au jour de sa mort
  rationale: Conserve l’idiome hébreu et sa cadence solennelle.
- source_word: בְּבֵית הַחָפְשִׁית
  choice: dans une maison à l’écart
  rationale: La locution est difficile, mais le contexte indique vraisemblablement une résidence séparée ou isolée. Cette traduction exprime cette fonction sans donner au radical חפשׁ un sens positif trompeur.
- source_word: עַל הַבַּיִת
  choice: avait la charge du palais
  rationale: L’expression désigne ici la responsabilité administrative de la maison royale; « palais » rend ce sens institutionnel de façon naturelle en français.
- source_word: שֹׁפֵט
  choice: rendait la justice
  rationale: Le participe exprime une activité continue de jugement ou de gouvernement. Cette formulation conserve explicitement la fonction judiciaire sans exclure sa portée administrative.
- source_word: עַם הָאָרֶץ
  choice: le peuple du pays
  rationale: Rend directement l’expression hébraïque sans la réduire à une catégorie politique moderne.
theological_decisions:
- issue: Nature de l’affection désignée par מְצֹרָע
  choice: Conserver « atteint de lèpre » dans le texte avec une note de prudence lexicale.
  alternative: « atteint d’une grave maladie de peau »
  rationale: Le mot hébreu ne permet pas d’identifier avec certitude la maladie de Hansen. Le terme traditionnel reste reconnaissable, mais la note empêche une identification médicale indue.
- issue: Portée de la fonction exercée par Yotam
  choice: Distinguer sa charge du palais de son exercice de la justice envers le peuple.
  alternative: Présenter explicitement Yotam comme régent ou comme gouvernant le pays.
  rationale: Le texte décrit ses responsabilités sans lui attribuer expressément le titre de régent; la traduction évite donc de résoudre cette implication historique dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination hébraïque répétée est légèrement restructurée pour assurer une narration naturelle, sans supprimer la succession des faits ni l’opposition entre l’isolement du roi et les responsabilités de Yotam.
