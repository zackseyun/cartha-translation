id: 2KI.15.18
reference: 2 Kings 15:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֠ר מֵ/עַ֨ל חַטֹּ֜אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/018.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat[a], with which he caused Israel to sin, all his days.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh. Il ne se détourna pas des péchés de Jéroboam, fils de Nebath[a], par lesquels celui-ci avait entraîné Israël dans le péché, et cela durant toute sa vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des péchés de Jéroboam, fils de Nebath, qui avait entraîné Israël dans le péché ». En hébreu, la proposition relative peut se rapporter directement à Jéroboam plutôt qu’aux « péchés ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: Rend naturellement en français la formule d’évaluation royale, tout en conservant le sens objectif de « faire le mal ».
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Conserve la métaphore hébraïque de l’évaluation divine et transcrit le nom divin personnel.
- source_word: לֹא סָר מֵעַל חַטֹּאות
  choice: Il ne se détourna pas des péchés
  rationale: « Se détourner de » exprime en français actuel l’abandon d’une conduite, tout en gardant l’image de סור.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Forme française traditionnelle et claire des noms propres, avec le lien de filiation explicite.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: par lesquels celui-ci avait entraîné Israël dans le péché
  rationale: Le relatif est rattaché dans le texte principal aux « péchés »; « celui-ci » identifie Jéroboam comme agent, et « entraîner dans le péché » rend avec naturel la valeur causative du hifil de חטא.
- source_word: כָּל יָמָיו
  choice: et cela durant toute sa vie
  rationale: Exprime la continuité de cette conduite pendant tous ses jours sans limiter artificiellement la formule à la seule durée officielle du règne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme, rendu ici comme nom personnel plutôt que remplacé par un titre.
- issue: Antécédent de אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 'Le relatif est rattaché aux « péchés » : « par lesquels celui-ci avait entraîné Israël dans le péché »'
  alternative: 'Le relatif peut qualifier directement Jéroboam : « Jéroboam, fils de Nebath, qui avait entraîné Israël dans le péché »'
  rationale: La syntaxe hébraïque autorise les deux rattachements. Le texte principal suit le rattachement aux péchés, tandis que la note conserve l’autre analyse sans transformer cette ambiguïté en distinction doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’idiome « aux yeux de », emploie le passé simple adapté au récit biblique et explicite sobrement le référent de « celui-ci ». Le marqueur [a] figure immédiatement après le nom concerné.
