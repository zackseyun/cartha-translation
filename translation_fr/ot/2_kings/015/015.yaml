  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י שַׁלּ֔וּם וְ/קִשְׁר֖/וֹ אֲשֶׁ֣ר קָשָׁ֑ר הִנָּ֣/ם כְּתֻבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/015.yaml
  text: The rest of the acts of Shallum[a], and the conspiracy that he conspired—behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: fr
  text: Le reste des actes de Shalloum, ainsi que la conspiration qu’il a tramée, voici qu’ils sont consignés dans le livre des annales des rois d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit des archives royales officielles auxquelles les livres des Rois renvoient régulièrement.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes
  rationale: Dans cette formule de conclusion royale, דִּבְרֵי désigne les actes ou les affaires du roi plutôt que ses seules paroles. « Le reste des actes » est naturel et fidèle à l’usage.
- source_word: שַׁלּוּם
  choice: Shalloum
  rationale: Translittération française courante du nom hébreu.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: ainsi que la conspiration qu’il avait ourdie
  rationale: קֶשֶׁר désigne ici une conspiration politique. Le français ne permet pas de reproduire naturellement la construction hébraïque avec nom et verbe de même racine; « conspiration… ourdie » en conserve le sens et une certaine insistance.
- source_word: הִנָּם כְּתֻבִים
  choice: est écrit
  rationale: Le singulier français s’accorde avec le groupe coordonné envisagé comme l’ensemble de ce qui est consigné. La particule déictique הִנָּם appartient à la formule d’orientation vers les archives et n’exige pas ici un « voici » peu naturel.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: dans le livre des annales
  rationale: L’expression désigne un document historiographique royal. « Annales » rend idiomatiquement דִּבְרֵי הַיָּמִים, tandis que « dans » convient au contenu d’un livre en français.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: Dans le titre de cette source, לְ marque la relation aux rois d’Israël.
