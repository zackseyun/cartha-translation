  text: וַ/יִּשְׁכַּ֤ב עֲזַרְיָה֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֛/וֹ עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ יוֹתָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/007.yaml
  text: And Azariah slept with his fathers[a], and they buried him with his fathers in the city of David. And Jotham his son reigned in his place.
translation:
  language: fr
  text: Azaria s’endormit avec ses pères[a], et on l’enterra avec ses pères dans la Cité de David. Son fils Yotam régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec ses ancêtres ». L’expression hébraïque « s’endormir avec ses pères » est une manière traditionnelle de parler de la mort et du fait de rejoindre les générations précédentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: s’endormit
  rationale: Conserve l’euphémisme hébreu traditionnel pour la mort, sans le réduire au simple verbe « mourir ».
- source_word: עִם אֲבֹתָיו
  choice: avec ses pères
  rationale: Préserve la formule royale hébraïque et son lien avec les générations antérieures; « avec ses ancêtres » est une possibilité plus explicite.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: on l’enterra
  rationale: Le pluriel hébreu a un sujet non précisé. En français, le pronom indéfini « on » rend naturellement cette action sans inventer d’agents déterminés.
- source_word: בְּעִיר דָּוִד
  choice: dans la Cité de David
  rationale: Rend clairement le nom de lieu traditionnel désignant le secteur royal de Jérusalem.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans la formule de succession, le passé simple exprime de façon concise et digne l’accession et l’exercice de la royauté.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Exprime directement la succession dans la fonction royale, plutôt qu’une simple postériorité chronologique.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La formule traditionnelle « s’endormit avec ses pères » est maintenue pour refléter l’idiome royal hébreu, avec une note qui en éclaire le sens. « Yotam » suit une translittération française proche de l’hébreu.
