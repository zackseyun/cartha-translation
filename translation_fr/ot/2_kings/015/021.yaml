source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י מְנַחֵ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/021.yaml
  text: The rest of the acts of Menahem[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: fr
  text: Le reste des actes de Menahem et tout ce qu’il a fait, ne sont-ils pas écrits dans le livre des Chroniques[a] des rois d’Israël ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le livre des Annales des rois d’Israël ».
    reason: Alternative lexicale pour סֵפֶר דִּבְרֵי הַיָּמִים, qui peut désigner un registre annalistique officiel.
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Le reste de
  rationale: יֶתֶר désigne ce qui reste. En français, « Le reste de » rend naturellement la formule récapitulative sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: דִּבְרֵי
  choice: actes
  rationale: Dans cette formule royale, דִּבְרֵי renvoie aux faits et gestes consignés du roi, plutôt qu’à ses seules paroles.
- source_word: מְנַחֵם
  choice: Menahem
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: et tout ce qu’il a fait
  rationale: Traduction directe qui conserve le caractère formulaire et englobant de l’expression hébraïque.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: ne sont-ils pas écrits
  rationale: La question rhétorique appelle une réponse affirmative. Le pluriel français reflète explicitement הֵם כְּתוּבִים et l’ensemble coordonné « le reste… et tout… ».
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Bien que עַל signifie littéralement « sur », « dans le livre » est l’expression idiomatique française pour un contenu consigné dans un document.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: le livre des Chroniques
  rationale: La locution désigne un recueil officiel de chroniques ou d’annales. « Chroniques » conserve la formulation biblique familière tout en restant intelligible.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: Le ל marque ici la relation entre les annales et les rois d’Israël; « des rois d’Israël » est naturel dans le titre du document.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La structure interrogative traditionnelle est conservée parce qu’elle reproduit la question rhétorique hébraïque. Le marqueur de note est placé après le titre auquel l’alternative se rapporte.
