  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/003.yaml
  text: He did what was right in the eyes of Yahweh, according to all that Amaziah his father had done.
translation:
  language: fr
  text: Il fit ce qui est droit aux yeux de Yahweh, conformément à tout ce qu’avait fait Amatsia, son père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol fait avancer le récit. En français narratif, le passé simple convient au registre historique et la conjonction initiale peut rester implicite.
- source_word: הַיָּשָׁר
  choice: ce qui est droit
  rationale: L’adjectif défini est employé substantivement. « Ce qui est droit » conserve la notion morale et la formule biblique tout en restant clair.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette formulation garde la métaphore hébraïque qui exprime l’évaluation selon le point de vue de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: exactement comme l’avait fait
  rationale: כְּכֹל אֲשֶׁר marque une conformité complète au modèle évoqué. « Exactement comme » l’exprime naturellement; le plus-que-parfait indique l’antériorité des actes d’Amatsia.
- source_word: אֲמַצְיָהוּ
  choice: Amatsia
  rationale: Forme française courante du nom hébreu.
- source_word: אָבִיו
  choice: son père
  rationale: Le contexte généalogique désigne ici le père immédiat, et non un ancêtre plus éloigné.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » préserve le nom personnel et évite de le remplacer par un titre.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple correspond au registre d’un récit historique écrit; la formule « ce qui est droit aux yeux de » conserve l’expression évaluative hébraïque sans lourdeur excessive.
