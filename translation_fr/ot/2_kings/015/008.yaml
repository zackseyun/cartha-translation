base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/008.yaml
  text: In the thirty-eighth year of Azariah king of Judah, Zechariah son of Jeroboam became king over Israel in Samaria for six months.
translation:
  language: fr
  text: La trente-huitième année du règne d’Azaria, roi de Juda, Zacharie, fils de Jéroboam, devint roi d’Israël à Samarie. Il régna six mois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה לַעֲזַרְיָהוּ
  choice: La trente-huitième année du règne d’Azaria
  rationale: La formule hébraïque de datation emploie un cardinal à valeur ordinale. En français courant, « du règne de » explicite naturellement que l’année est comptée dans le règne d’Azaria.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rend directement la chaîne construite qui précise la fonction et le royaume d’Azaria.
- source_word: מָלַךְ
  choice: devint roi … Il régna
  rationale: Le verbe marque ici l’accession au trône, tandis que l’expression de durée indique combien de temps dura le règne. La répartition en deux propositions produit un français naturel sans perdre ces deux aspects.
- source_word: זְכַרְיָהוּ בֶן יָרָבְעָם
  choice: Zacharie, fils de Jéroboam
  rationale: Emploie les formes françaises traditionnelles et largement reconnues de ces noms, avec une apposition filiale claire.
- source_word: עַל יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Avec מלך, עַל désigne le peuple ou le territoire gouverné. « roi d’Israël » est ici plus idiomatique que « roi sur Israël » et conserve le sens.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: La préposition locative situe le siège du règne; pour une ville, le français idiomatique emploie « à ».
- source_word: שִׁשָּׁה חֳדָשִׁים
  choice: Il régna six mois
  rationale: L’accusatif hébreu exprime la durée. Le français peut l’exprimer directement, sans préposition, dans une proposition verbale.
