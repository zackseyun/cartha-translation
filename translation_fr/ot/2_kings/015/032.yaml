base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/032.yaml
  text: In the second year of Pekah son of Remaliah[a], king of Israel, Jotham son of Uzziah, king of Judah[b], became king.
translation:
  language: fr
  text: La deuxième année du règne de Péqah, fils de Remalia, roi d’Israël, Yotam, fils d’Ozias[b], roi de Juda, devint roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « commença à régner ». Le verbe hébreu peut désigner l’accession à la royauté ou le commencement d’un règne.'
    reason: lexical_alternative
  - marker: b
    text: Ozias est aussi appelé Azaria dans d’autres passages.
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/פֶקַח
  choice: La deuxième année du règne de Péqah
  rationale: La construction introduit une datation selon les années de règne. L’ajout explicite de « du règne » rend naturellement en français la fonction du לְ sans modifier le sens.
- source_word: בֶּן רְמַלְיָהוּ
  choice: fils de Remalia
  rationale: Patronyme conservé selon l’usage biblique français courant.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Titre royal et royaume rendus directement.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette notice d’accession, le verbe exprime l’entrée dans la royauté; « devint roi » évite la lecture purement durative de « régna ».
- source_word: יוֹתָם
  choice: Yotam
  rationale: Translittération française moderne du nom hébreu.
- source_word: בֶּן עֻזִיָּהוּ
  choice: fils d’Ozias
  rationale: Le texte porte explicitement le nom Ozias; la forme française traditionnelle est retenue.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: L’apposition est conservée et rattachée clairement à Yotam.
