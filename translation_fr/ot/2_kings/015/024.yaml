id: 2KI.15.24
reference: 2 Kings 15:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/024.yaml
  text: He did what was evil in the eyes of Yahweh[a]. He did not turn away from the sins of Jeroboam son of Nebat[b], who caused Israel to sin.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh. Il ne se détourna pas des péchés de Jéroboam, fils de Nebath, qui avait fait pécher Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: Cette formulation française naturelle conserve la formule hébraïque d’évaluation royale et sa portée morale.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: L’expression garde l’image hébraïque de l’évaluation divine tout en étant idiomatique en français moderne.
- source_word: לֹא סָר
  choice: Il ne se détourna pas
  rationale: Le verbe סור décrit ici le refus d’abandonner une conduite; « se détourner de » en restitue clairement le sens.
- source_word: מֵחַטֹּאות
  choice: des péchés
  rationale: Le pluriel חַטֹּאות désigne directement les pratiques coupables associées à Jéroboam; « péchés » en préserve la portée religieuse et morale.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Les formes françaises usuelles des noms sont retenues, et le patronyme hébraïque est rendu explicitement.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: qui avait fait pécher Israël
  rationale: Le factitif « faire pécher » reflète directement la valeur causative du hifil de חטא. Le plus-que-parfait situe naturellement cette influence antérieure dans le récit français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin personnel. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Responsabilité de Jéroboam dans le péché d’Israël
  choice: qui avait fait pécher Israël
  alternative: qui avait entraîné Israël dans le péché
  rationale: La formulation retenue maintient la force causative du verbe hébreu sans préciser par quel moyen Jéroboam a exercé cette influence.
translation_notes:
  register: 'Français international moderne, sobre et digne. Le passé simple convient au récit historique, tandis que le plus-que-parfait marque l’antériorité de l’action de Jéroboam. Aucune note n’est nécessaire: les notes anglaises fournies sont mal rattachées à leurs appels et n’expriment pas une ambiguïté substantielle du texte hébreu.'
