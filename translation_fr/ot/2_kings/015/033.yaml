base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/033.yaml
  text: He was twenty-five years old when he began to reign[a], and he reigned sixteen years in Jerusalem. His mother’s name was Jerusha daughter of Zadok.
translation:
  language: fr
  text: Il avait vingt-cinq ans lorsqu’il devint roi, et il régna seize ans à Jérusalem. Sa mère s’appelait Yerousha ; elle était fille de Tsadok.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Il avait vingt-cinq ans
  rationale: Cette tournure rend naturellement en français l’expression hébraïque usuelle indiquant l’âge, littéralement « fils de vingt-cinq ans ».
- source_word: הָיָה בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: Dans cette formule royale, la construction indique l’âge du roi au moment de son accession au trône. Cette formulation est claire et naturelle en français moderne.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ בִּירוּשָׁלִָם
  choice: et il régna seize ans à Jérusalem
  rationale: La traduction conserve directement la durée et le lieu du règne dans un ordre naturel en français.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Équivalent idiomatique moderne de la formule hébraïque « le nom de sa mère était ».
- source_word: יְרוּשָׁא
  choice: Yerousha
  rationale: Transcription française lisible qui représente le yod initial et la consonne שׁ par « sh ».
- source_word: בַּת צָדוֹק
  choice: elle était fille de Tsadok
  rationale: La relation familiale est conservée explicitement ; la reprise par une proposition évite une succession de compléments peu naturelle en français.
