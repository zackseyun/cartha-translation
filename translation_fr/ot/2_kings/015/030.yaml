source:
  edition: WLC
  text: וַ/יִּקְשָׁר קֶ֜שֶׁר הוֹשֵׁ֣עַ בֶּן אֵלָ֗ה עַל פֶּ֨קַח֙ בֶּן רְמַלְיָ֔הוּ וַ/יַּכֵּ֨/הוּ֙ וַ/יְמִיתֵ֔/הוּ וַ/יִּמְלֹ֖ךְ תַּחְתָּ֑י/ו בִּ/שְׁנַ֣ת עֶשְׂרִ֔ים לְ/יוֹתָ֖ם בֶּן עֻזִיָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/030.yaml
  text: Then Hoshea son of Elah conspired in a conspiracy against Pekah son of Remaliah, struck him down, put him to death, and reigned in his place, in the twentieth year of Jotham son of Uzziah.
translation:
  language: fr
  text: Alors Osée, fils d’Éla, forma un complot contre Péqah, fils de Remalia. Il le frappa, le mit à mort et régna à sa place, la vingtième année de Yotam, fils d’Ozias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « la vingtième année de Yotam, fils d’Ozias ». Cette indication présente une difficulté chronologique, puisque le règne de Yotam est ailleurs donné comme ayant duré seize ans (2 Rois 15.33). La traduction conserve ici le texte hébreu sans l’harmoniser.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְשָׁר קֶשֶׁר
  choice: forma un complot
  rationale: La construction hébraïque associe un verbe et un nom de même racine pour renforcer l’idée de conspiration. En français, « forma un complot » restitue naturellement l’ensemble de l’expression sans la redondance peu idiomatique « complota un complot ».
- source_word: הוֹשֵׁעַ בֶּן אֵלָה
  choice: Osée, fils d’Éla
  rationale: Les noms suivent les formes françaises bibliques usuelles, et le patronyme est conservé pour l’identification historique.
- source_word: עַל פֶּקַח בֶּן רְמַלְיָהוּ
  choice: contre Péqah, fils de Remalia
  rationale: Dans ce contexte de conspiration, עַל désigne la personne visée et se rend naturellement par « contre ».
- source_word: וַיַּכֵּהוּ
  choice: Il le frappa
  rationale: Le verbe נכה exprime ici l’action violente de frapper. Le verbe suivant indiquant explicitement la mort, cette traduction préserve la succession des deux actions sans anticiper le sens du second verbe.
- source_word: וַיְמִיתֵהוּ
  choice: le mit à mort
  rationale: Le hiphil de מות a une valeur causative; « mit à mort » la restitue de manière claire et idiomatique.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: régna à sa place
  rationale: Cette formulation rend directement l’accession d’Osée à la royauté en remplacement de Péqah.
- source_word: בִּשְׁנַת עֶשְׂרִים לְיוֹתָם בֶּן עֻזִיָּה
  choice: la vingtième année de Yotam, fils d’Ozias
  rationale: La formule de datation royale est traduite telle qu’elle figure dans le texte massorétique, sans harmonisation chronologique.
theological_decisions:
- issue: Tension chronologique dans la formule de règne
  choice: Conserver « la vingtième année de Yotam, fils d’Ozias » dans le texte principal.
  alternative: Harmoniser la date avec le règne d’Ahaz ou modifier le nombre d’années.
  rationale: Le texte hébreu attribue explicitement cette date à Yotam. La traduction conserve cette donnée malgré sa difficulté par rapport aux autres indications chronologiques du livre, et signale la tension en note plutôt que de la résoudre sans appui textuel.
translation_notes:
  register: Français moderne, international et digne. La syntaxe a été divisée en deux phrases pour améliorer la lisibilité tout en conservant l’enchaînement narratif. Les noms propres emploient des formes françaises bibliques courantes.
