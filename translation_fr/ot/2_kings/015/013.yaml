  text: שַׁלּ֤וּם בֶּן יָבֵישׁ֙ מָלַ֔ךְ בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה לְ/עֻזִיָּ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ יֶֽרַח יָמִ֖ים בְּ/שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/013.yaml
  text: Shallum son of Jabesh became king in the thirty-ninth year of Uzziah king of Judah[a], and he reigned for a month of days in Samaria.
translation:
  language: fr
  text: Shalloum, fils de Yabesh, devint roi la trente-neuvième année du règne d’Ozias, roi de Juda. Il régna un mois[a] à Samarie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un mois de jours », c’est-à-dire environ un mois.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette formule chronologique, le qatal indique l’accession au trône plutôt que la durée du règne.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: la trente-neuvième année du règne
  rationale: Cette formulation française naturelle exprime clairement l’année royale servant de repère chronologique.
- source_word: לְעֻזִיָּה מֶלֶךְ יְהוּדָה
  choice: d’Ozias, roi de Juda
  rationale: Dans les synchronismes royaux, לְ indique ici que l’année est comptée selon le règne d’Ozias.
- source_word: וַיִּמְלֹךְ
  choice: Il régna
  rationale: Le verbe fait progresser le récit de l’accession à la durée effective du règne.
- source_word: יֶרַח יָמִים
  choice: un mois
  rationale: L’expression hébraïque signifie idiomatiquement un mois, vraisemblablement un mois complet; sa forme littérale est signalée en note.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: Pour une ville envisagée comme siège du pouvoir royal, « à Samarie » est la tournure française la plus naturelle.
