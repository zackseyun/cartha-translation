  text: וְ/יֶ֛תֶר דִּבְרֵ֥י פְקַחְיָ֖ה וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/026.yaml
  text: The rest of the acts of Pekahiah[a], and all that he did, behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: fr
  text: Le reste des actes de Peqahya et tout ce qu’il a fait, tout cela est écrit dans le livre des annales des rois d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le registre des événements des rois d’Israël »; le terme traduit par « livre » peut aussi désigner un rouleau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes
  rationale: Dans cette formule de bilan royal, דִּבְרֵי désigne les faits, les affaires ou les actes du roi, et non seulement ses paroles. Le וְ initial s’intègre naturellement à la continuité du récit sans qu’il soit nécessaire d’ajouter un marqueur temporel comme « maintenant ».
- source_word: פְקַחְיָה
  choice: Peqahya
  rationale: Translittération française moderne du nom hébreu, distinguant le qoph par « q » et rendant la finale théophore יָה par « ya ».
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: et tout ce qu’il a fait
  rationale: Rend directement la portée générale du verbe עשה sans préciser indûment la nature de ses réalisations.
- source_word: הִנָּם כְּתוּבִים
  choice: tout cela est écrit
  rationale: La reprise « tout cela » fournit en français une présentation emphatique et naturelle de l’ensemble précédent. « Est écrit » conserve le sens du participe passif כְּתוּבִים, tandis que la dislocation rend la force présentative de הִנָּם sans recourir à l’archaïsme « voici, ils sont écrits ».
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Même si עַל signifie littéralement « sur », le français documentaire dit naturellement qu’un fait est écrit « dans » un livre. סֵפֶר peut matériellement désigner un rouleau, mais « livre » convient au titre d’une source archivistique.
- source_word: דִּבְרֵי הַיָּמִים
  choice: les annales
  rationale: Dans ce contexte, l’expression désigne un relevé chronologique officiel. « Annales » est plus transparent en français moderne que le calque « événements des jours » et évite la confusion avec le livre biblique des Chroniques.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: Le לְ du titre indique ici l’appartenance ou la destination du document; le génitif français « des rois d’Israël » est la formulation idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La reprise « tout cela » évite une construction lourde tout en conservant l’effet présentatif de l’hébreu. « Annales » rend clairement la nature archivistique de la source citée.
