  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ מְנַחֵ֨ם בֶּן גָּדִ֧י עַל יִשְׂרָאֵ֛ל עֶ֥שֶׂר שָׁנִ֖ים בְּ/שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/017.yaml
  text: In the thirty-ninth year of Azariah king of Judah, Menahem son of Gadi became king over Israel, and he reigned ten years in Samaria.
translation:
  language: fr
  text: La trente-neuvième année du règne d’Azaria, roi de Juda, Menahem, fils de Gadi, devint roi d’Israël. Il régna dix ans à Samarie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה לַעֲזַרְיָה
  choice: La trente-neuvième année du règne d’Azaria
  rationale: La formule hébraïque établit une synchronisation entre règnes. L’ajout explicite de « du règne » est naturel en français et clarifie la valeur de ל sans changer le sens.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rendu direct de la chaîne construite et titre royal usuel en français.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette formule d’accession, le verbe signale le début du règne; sa durée est ensuite donnée séparément.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: Menahem, fils de Gadi
  rationale: Les noms sont translittérés et בֶּן est rendu par l’expression identificatrice française « fils de ».
- source_word: עַל יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Avec מָלַךְ, עַל désigne le peuple sur lequel s’exerce la royauté. La tournure « devint roi d’Israël » est plus naturelle en français que « régna sur Israël » ici et évite de confondre l’accession avec la durée du règne.
- source_word: עֶשֶׂר שָׁנִים
  choice: dix ans
  rationale: Expression directe de la durée du règne.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: La préposition locative désigne ici la ville siège du règne; en français, « à » s’emploie normalement devant un nom de ville.
