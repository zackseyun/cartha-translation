base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/037.yaml
  text: In those days Yahweh began to send against Judah Rezin king of Aram[b][a], and Pekah son of Remaliah.
translation:
  language: fr
  text: En ces jours-là, Yahweh commença à envoyer Retsîn, roi d’Aram[b], et Péqah, fils de Remalia, contre Juda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en Juda » ; dans ce contexte, l’expression hébraïque a vraisemblablement un sens hostile, d’où « contre Juda ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « Aram » ; traduction traditionnelle : « Syrie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: En ce temps-là
  rationale: Cette tournure française naturelle exprime la période historique introduite par l’expression temporelle hébraïque.
- source_word: הֵחֵל
  choice: commença
  rationale: Le verbe marque ici le début d’une action.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel représenté par le tétragramme.
- source_word: לְהַשְׁלִיחַ בִּיהוּדָה
  choice: à envoyer contre Juda
  rationale: Le sens premier est « envoyer », tandis que le contexte militaire donne à la préposition une valeur hostile dirigée contre Juda.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Retsîn, roi d’Aram
  rationale: Les noms sont translittérés selon l’usage français, et « Aram » reflète directement le terme hébreu.
- source_word: וְאֵת פֶּקַח בֶּן רְמַלְיָהוּ
  choice: ainsi que Péqah, fils de Remalia
  rationale: Le marqueur d’objet introduit le second personnage envoyé; « ainsi que » rend clairement la coordination en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre plutôt que de lui substituer un titre.
- issue: Agentivité divine dans l’hostilité contre Juda
  choice: Yahweh commença à envoyer contre Juda
  alternative: Yahweh permit qu’ils attaquent Juda
  rationale: Le texte attribue directement à Yahweh le commencement de cet envoi; la traduction préserve cette tension théologique sans l’atténuer en simple permission.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle; les formes françaises Retsîn et Péqah sont employées, et Remalia est conservé sans graphie inutilement archaïsante.
