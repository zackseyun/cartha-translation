id: 2KI.15.9
reference: 2 Kings 15:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָ֑י/ו לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/009.yaml
  text: He did what was evil in the sight of Yahweh[a], just as his fathers had done. He did not turn away from the sins of Jeroboam son of Nebat, with which he caused Israel to sin.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh, comme l’avaient fait ses pères. Il ne se détourna pas des péchés de Jéroboam, fils de Nebath, par lesquels celui-ci avait fait pécher Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jéroboam, fils de Nebath, lui qui avait fait pécher Israël. » La proposition relative hébraïque peut être rattachée directement à Jéroboam ou comprise comme reliant ses péchés au moyen par lequel il entraîna Israël dans le péché.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol narratif de עשה appelle ici un passé simple, naturel dans un récit historique français.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: ce qui est mal aux yeux de Yahweh
  rationale: Cette formulation conserve l’expression évaluative deutéronomiste et l’image hébraïque « aux yeux de », tout en restant claire en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: comme l’avaient fait ses pères
  rationale: Le plus-que-parfait marque naturellement l’antériorité; « ses pères » maintient le terme masculin et sa portée dynastique dans ce contexte royal.
- source_word: לֹא סָר
  choice: Il ne se détourna pas
  rationale: סור exprime ici le fait de ne pas abandonner une conduite religieuse et morale.
- source_word: מֵחַטֹּאות
  choice: des péchés
  rationale: Le pluriel hébreu est conservé et désigne l’ensemble des fautes cultuelles associées à Jéroboam.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Forme française traditionnelle et immédiatement reconnaissable des noms, avec conservation de la filiation.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: par lesquels celui-ci avait fait pécher Israël
  rationale: Cette lecture relie étroitement les péchés de Jéroboam au moyen par lequel il avait conduit Israël au péché; « celui-ci » évite que le sujet renvoie au roi mentionné au début du verset.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le nom propre est conservé au lieu d’être remplacé par un titre, sans ajouter d’interprétation confessionnelle.
- issue: Référent de la proposition אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: les péchés comme moyen par lequel Jéroboam fit pécher Israël
  alternative: 'Jéroboam lui-même comme antécédent direct : « lui qui avait fait pécher Israël »'
  rationale: La formulation principale suit la relation instrumentale retenue par la couche de consultation, tandis que la note signale honnêtement l’autre rattachement syntaxique possible.
- issue: Portée de אֲבֹתָיו
  choice: ses pères
  alternative: ses ancêtres / ses prédécesseurs
  rationale: Le terme masculin pluriel est maintenu; dans le contexte monarchique, il évoque notamment les rois antérieurs dont il reproduit la conduite.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple convient au récit historique; le vocabulaire demeure accessible. L’expression biblique « aux yeux de Yahweh » et le terme dynastique « ses pères » sont volontairement conservés.
