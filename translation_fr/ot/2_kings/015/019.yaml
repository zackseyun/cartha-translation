base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/019.yaml
  text: Pul king of Assyria came against the land[b][a], and Menahem gave Pul a thousand talents of silver so that his hand might be with him to strengthen the kingdom in his hand.
translation:
  language: fr
  text: Poul, roi d’Assyrie, vint attaquer le pays[a]. Ménahem donna à Poul mille talents d’argent afin que Poul lui prête main-forte pour affermir le royaume sous son autorité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « pays » désigne probablement le territoire d’Israël.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « afin que ses mains soient avec lui pour affermir le royaume dans sa main », c’est-à-dire afin que Poul soutienne Ménahem dans la consolidation du royaume sous son autorité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא פוּל מֶלֶךְ אַשּׁוּר עַל הָאָרֶץ
  choice: Poul, roi d’Assyrie, vint attaquer le pays
  rationale: Avec עַל dans ce contexte militaire, בָּא exprime une venue hostile. « Vint attaquer » rend naturellement ce mouvement dirigé contre le pays sans préciser au-delà de l’hébreu la forme de l’intervention.
- source_word: וַיִּתֵּן מְנַחֵם לְפוּל
  choice: Ménahem donna à Poul
  rationale: Le verbe נָתַן signifie d’abord « donner ». Le contexte permet de comprendre qu’il s’agit d’un paiement politique, sans qu’il soit nécessaire d’introduire cette interprétation dans le verbe.
- source_word: אֶלֶף כִּכַּר כָּסֶף
  choice: mille talents d’argent
  rationale: Le talent est l’équivalent français traditionnel de כִּכָּר comme unité de poids; « d’argent » précise la matière conformément au texte.
- source_word: לִהְיוֹת יָדָיו אִתּוֹ
  choice: afin que celui-ci lui prête main-forte
  rationale: Littéralement, la main de Poul doit être « avec » Ménahem, image qui exprime son appui. « Prêter main-forte » conserve l’image de la main tout en communiquant clairement le soutien politique.
- source_word: לְהַחֲזִיק הַמַּמְלָכָה בְּיָדוֹ
  choice: pour affermir le royaume entre ses mains
  rationale: Le hiphil de חזק signifie ici rendre ferme ou consolider. « Entre ses mains » conserve l’image hébraïque de la maîtrise exercée par Ménahem sur le royaume.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. Les noms sont rendus selon les formes françaises usuelles « Poul » et « Ménahem ». La formulation privilégie une équivalence optimale : elle explicite l’idiome politique de la main dans le corps du texte tout en en conservant un écho, et donne la forme littérale en note.'
