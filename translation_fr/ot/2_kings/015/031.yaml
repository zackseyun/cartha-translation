  text: וְ/יֶ֥תֶר דִּבְרֵי פֶ֖קַח וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/031.yaml
  text: The rest of the acts of Pekah[a], and all that he did—behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: fr
  text: Le reste des actes de Péqah et tout ce qu’il a fait, tout cela est écrit dans le livre des Chroniques[a] des rois d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Annales ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes
  rationale: יֶתֶר désigne ce qui reste, et דִּבְרֵי, dans cette formule de conclusion royale, renvoie idiomatiquement aux actes ou aux affaires du roi plutôt qu’à ses « paroles ».
- source_word: פֶקַח
  choice: Péqah
  rationale: Transcription française courante du nom hébreu.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: et tout ce qu’il a fait
  rationale: Rend directement la portée exhaustive de כָל et le sens simple du verbe עָשָׂה.
- source_word: הִנָּם כְּתוּבִים
  choice: tout cela est écrit
  rationale: Le présentatif hébreu souligne que l’ensemble mentionné se trouve consigné. « Tout cela est écrit » transmet naturellement cette reprise emphatique en français, sans le calque peu idiomatique « voici, ils sont écrits ».
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Bien que la préposition signifie littéralement « sur », le français emploie idiomatiquement « dans » pour indiquer qu’un contenu figure dans un document.
- source_word: דִּבְרֵי הַיָּמִים
  choice: les Chroniques
  rationale: Dans les formules royales, l’expression désigne des archives annalistiques. « Chroniques » est un équivalent français établi et compréhensible.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: Dans le titre du document, לְ marque ici le rapport entre les chroniques et les rois auxquels elles se rapportent; le complément français avec « de » est naturel.
theological_decisions: []
