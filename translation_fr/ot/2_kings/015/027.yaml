  text: בִּ/שְׁנַ֨ת חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ פֶּ֣קַח בֶּן רְמַלְיָ֧הוּ עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן עֶשְׂרִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/027.yaml
  text: In the fifty-second year of Azariah king of Judah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years.
translation:
  language: fr
  text: La cinquante-deuxième année du règne d’Azaria, roi de Juda, Péqah, fils de Remalia, devint roi d’Israël à Samarie. Il régna vingt ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: La cinquante-deuxième année du règne
  rationale: La formule française naturelle explicite le cadre d’une année de règne, implicite dans la formule chronologique hébraïque.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: d’Azaria, roi de Juda
  rationale: Cette formulation conserve le rapport entre l’année mentionnée et Azaria, ainsi que son titre royal.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette notice royale, le verbe marque l’accession au trône; ce choix évite aussi de répéter immédiatement « régna ».
- source_word: פֶּקַח בֶּן־רְמַלְיָהוּ
  choice: Péqah, fils de Remalia
  rationale: Les noms sont translittérés selon un usage français clair, et le patronyme hébreu est rendu directement.
- source_word: עַל־יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Avec le verbe régner, la préposition indique le peuple ou royaume gouverné; « roi d’Israël » est la formulation française la plus naturelle dans une notice d’accession.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: La préposition marque ici le lieu où s’exerce la royauté, Samarie étant la capitale; en français, « à » convient naturellement à un nom de ville.
- source_word: עֶשְׂרִים שָׁנָה
  choice: vingt ans
  rationale: Traduction directe de la durée du règne.
