source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יוֹתָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ אָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/038.yaml
  text: And Jotham lay down with his fathers and was buried with his fathers in the city of David his father[b][a], and Ahaz his son reigned in his place.
translation:
  language: fr
  text: Yotam reposa avec ses pères[a] et fut enterré avec ses pères dans la ville de David, son père[b]. Son fils Achaz régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec ses ancêtres ». L’hébreu dit littéralement « avec ses pères », dans une formule habituelle annonçant la mort d’un roi.
    reason: lexical_alternative
  - marker: b
    text: Ici, « père » signifie « ancêtre » ou « fondateur de la dynastie »; David n’était pas le père immédiat de Yotam.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: reposa
  rationale: Dans cette formule royale de décès, le verbe évoque le fait de se coucher et, par euphémisme, de mourir. « Reposa » conserve cette image sans l’ambiguïté indésirable qu’aurait en français moderne « se coucha avec ».
- source_word: עִם אֲבֹתָיו
  choice: avec ses pères
  rationale: La formulation conserve le terme hébreu et le caractère traditionnel de la formule dynastique; une note précise que « ses ancêtres » est aussi une traduction naturelle.
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: Le passif français correspond à la forme passive hébraïque et exprime clairement la suite des événements.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: dans la ville de David, son père
  rationale: La formulation reste proche de l’hébreu tout en marquant l’apposition par une virgule. Ici, « père » désigne David comme ancêtre dynastique de Yotam.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: C’est le terme français concis et usuel dans les notices de succession royale.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Cette expression rend naturellement l’idée hébraïque de remplacement et de succession.
theological_decisions:
- issue: Sens de « son père » à propos de David
  choice: Conserver « père » dans le texte en l’entendant au sens d’ancêtre dynastique
  alternative: Traduire explicitement « son ancêtre »
  rationale: David n’est pas le père immédiat de Yotam, mais son ancêtre dans la lignée royale. Garder le terme « père » préserve la formulation et la conception généalogique de l’hébreu, tandis que la note prévient toute confusion.
translation_notes:
  register: Français international moderne, sobre et digne. « Reposa » maintient l’image funéraire sans employer le très ambigu « se coucha avec ». Les expressions « ses pères » et « son père » sont conservées pour refléter le langage ancestral et dynastique de l’hébreu, avec des notes explicatives.
