source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֣ר עָלָי/ו֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ שָׁלִישׁ֗/וֹ וַ/יַּכֵּ֨/הוּ בְ/שֹׁמְר֜וֹן בְּ/אַרְמ֤וֹן בֵּית מלך אֶת אַרְגֹּ֣ב וְ/אֶת הָ/אַרְיֵ֔ה וְ/עִמּ֛/וֹ חֲמִשִּׁ֥ים אִ֖ישׁ מִ/בְּנֵ֣י גִלְעָדִ֑ים וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/025.yaml
  text: Then Pekah son of Remaliah[a], his officer, conspired against him and struck him down in Samaria, in the citadel of the king’s house, with Argob and Arieh, and with him were fifty men of the Gileadites[d][c][b]. So he put him to death and reigned in his place.
translation:
  language: fr
  text: Péqah, fils de Remalia, son officier[a], complota contre lui. Il le frappa à Samarie, dans la citadelle de la maison du roi[b], avec Argob et Arié[c] ; cinquante hommes d’entre les Galaadites étaient avec lui. Il le mit à mort et régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son commandant ». Le terme hébreu désigne un officier militaire de haut rang, mais son grade exact est incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le palais de la maison du roi ». Le mot hébreu peut désigner un palais ou une résidence royale fortifiée.
    reason: lexical_alternative
  - marker: c
    text: Le nom Arié correspond aussi au mot hébreu qui signifie « lion » ; dans ce contexte, il est préférable d’y voir un nom de personne, en parallèle avec Argob.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: complota contre lui
  rationale: Dans le contexte politique des Rois, קשר désigne un complot dirigé contre le souverain ; cette formulation est naturelle et précise en français.
- source_word: שָׁלִישׁוֹ
  choice: son officier
  rationale: שָׁלִישׁ désigne ici un officier de haut rang, mais le grade exact demeure incertain ; « officier » évite de le préciser indûment.
- source_word: וַיַּכֵּהוּ
  choice: Il le frappa
  rationale: Cette traduction conserve le sens large de נכה et le distingue de וַיְמִיתֵהוּ, qui indique ensuite explicitement la mise à mort.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: Rendu locatif idiomatique du nom de lieu en français.
- source_word: בְּאַרְמוֹן בֵּית מֶלֶךְ
  choice: dans la citadelle de la maison du roi
  rationale: אַרְמוֹן peut désigner une citadelle, un palais ou une résidence fortifiée ; « citadelle » rend la dimension fortifiée sans confondre toute la maison royale avec un palais.
- source_word: אֶת אַרְגֹּב וְאֶת הָאַרְיֵה
  choice: avec Argob et Arié
  rationale: Le parallélisme et les marques de l’objet direct favorisent la lecture de deux noms propres, même si אַרְיֵה signifie lexicalement « lion ».
- source_word: וְעִמּוֹ חֲמִשִּׁים אִישׁ מִבְּנֵי גִלְעָדִים
  choice: cinquante hommes d’entre les Galaadites étaient avec lui
  rationale: La proposition nominale précise les hommes qui accompagnaient Péqah ; « d’entre » préserve la valeur partitive de מִן.
- source_word: וַיְמִיתֵהוּ
  choice: Il le fit mourir
  rationale: Le hiphil de מות est causatif ; cette formulation préserve cette nuance et reste distincte du verbe précédent.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: et régna à sa place
  rationale: Formule française naturelle correspondant à la formule de succession royale.
