  verdict: revise
  source_fidelity: La réserve introduite par רַק et la persistance indiquée par עוֹד sont bien rendues. Toutefois, « ne disparurent pas » décrit plutôt une disparition de fait, tandis que לֹא סָרוּ, avec les hauts lieux comme sujet, signifie qu’ils ne furent pas enlevés/supprimés. « Faire fumer des offrandes » est compréhensible, mais peu idiomatique; « faire monter des offrandes en fumée » rend naturellement la portée large possible de מְקַטְּרִים sans imposer « encens ».
