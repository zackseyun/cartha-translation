  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/004.yaml
  text: Only the high places were not removed; the people still were sacrificing and making offerings in smoke on the high places.
translation:
  language: fr
  text: Cependant, les hauts lieux ne furent pas supprimés ; le peuple continuait à y offrir des sacrifices et à y faire monter des offrandes en fumée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à y brûler de l’encens ». Le verbe hébreu peut désigner précisément l’action de brûler de l’encens ou, plus largement, celle de faire monter une offrande en fumée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Cependant
  rationale: Dans cette formule d’évaluation royale, le terme introduit une réserve par rapport au jugement positif précédent. « Cependant » rend naturellement cette nuance adversative en français.
- source_word: הַבָּמוֹת
  choice: les hauts lieux
  rationale: Expression consacrée et historiquement précise pour les sites cultuels locaux désignés par בָּמוֹת.
- source_word: לֹא סָרוּ
  choice: ne disparurent pas
  rationale: Avec « les hauts lieux » comme sujet, le verbe indique que ces sites ne furent pas supprimés. Cette formulation reste naturelle sans préciser explicitement l’agent.
- source_word: עוֹד הָעָם
  choice: le peuple continuait
  rationale: עוֹד marque la poursuite de la pratique ; l’imparfait français exprime naturellement cette action habituelle et persistante.
- source_word: מְזַבְּחִים
  choice: à y offrir des sacrifices
  rationale: Rend clairement l’activité cultuelle exprimée par זבח, avec un français plus idiomatique que « sacrifier » employé sans complément.
- source_word: וּמְקַטְּרִים
  choice: à y faire fumer des offrandes
  rationale: Préserve la portée possible du verbe קטר, qui peut désigner l’encens brûlé ou, plus largement, une offrande consumée dont la fumée monte, sans limiter indûment le sens.
- source_word: בַּבָּמוֹת
  choice: y
  rationale: Le pronom locatif reprend sans lourdeur « les hauts lieux » et correspond au complément de lieu hébreu.
theological_decisions:
- issue: Nature du culte pratiqué sur les hauts lieux
  choice: Le texte rapporte la persistance de sacrifices et d’offrandes consumées sur ces sites sans préciser la divinité à laquelle ils étaient destinés.
  alternative: Qualifier explicitement ces pratiques d’idolâtrie, ou affirmer qu’elles étaient adressées au SEIGNEUR dans des lieux non autorisés.
  rationale: Ce verset ne nomme pas la divinité concernée. La traduction conserve donc la retenue du texte et ne tranche pas une question que celui-ci laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. « Hauts lieux » conserve le vocabulaire historique traditionnel ; la reprise par « y » évite une répétition pesante. La note maintient l’ambiguïté lexicale réelle de וּמְקַטְּרִים.
