source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה עֻזִיָּ֥הוּ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/034.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done.
translation:
  language: fr
  text: Il fit ce qui est droit aux yeux de Yahweh, en tout point comme l’avait fait son père Ozias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ailleurs, ce roi est aussi appelé « Azaria ».
    reason: Signaler l’autre nom biblique du même roi sans modifier la forme « Ozias » attestée dans ce verset.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le waw consécutif fait progresser le récit. Dans un verset présenté isolément, le passé simple français rend naturellement cette action narrative sans qu’il soit nécessaire d’ajouter « Et ».
- source_word: הַיָּשָׁר
  choice: ce qui est droit
  rationale: Cette expression désigne ce qui est juste ou droit selon l’évaluation divine. « Ce qui est droit » est à la fois fidèle à l’image hébraïque et naturel en français biblique moderne.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La traduction conserve la métaphore hébraïque par laquelle la conduite humaine est évaluée du point de vue de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin plutôt que par un titre de substitution.
- source_word: כְּכֹל אֲשֶׁר
  choice: en tout comme
  rationale: Cette formulation exprime à la fois la comparaison et la portée globale de כֹּל, dans un français fluide.
- source_word: עֻזִיָּהוּ
  choice: Ozias
  rationale: Le texte hébreu porte ici le nom עֻזִיָּהוּ, traditionnellement rendu « Ozias » en français, sans l’harmoniser avec l’autre nom royal « Azaria ».
- source_word: אָבִיו
  choice: son père
  rationale: Le contexte généalogique immédiat appelle le sens direct de père, et non celui, plus large, d’ancêtre.
- source_word: עָשָׂה
  choice: avait fait
  rationale: Le plus-que-parfait indique naturellement que la conduite d’Ozias précède celle du roi dont parle le verset.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom propre divin. « Yahweh » en préserve la fonction de nom d’alliance au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’expression imagée « aux yeux de » et rend la comparaison hébraïque de façon concise. Le marqueur de note est placé après « Ozias », terme auquel la note se rapporte.
