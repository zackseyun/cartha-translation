  text: בֶּן שֵׁ֨שׁ עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְכָלְיָ֖הוּ מִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/002.yaml
  text: He was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah of Jerusalem.
translation:
  language: fr
  text: Il avait seize ans lorsqu’il devint roi, et il régna cinquante-deux ans à Jérusalem. Sa mère s’appelait Jecolia, de Jérusalem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « originaire de Jérusalem ».'
    reason: La préposition hébraïque מן peut exprimer la provenance ; « de Jérusalem » maintient une formulation plus générale dans le texte.
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: Il avait seize ans
  rationale: La formule hébraïque signifie littéralement « fils de seize ans »; la formulation retenue en exprime naturellement le sens en français moderne.
- source_word: הָיָה בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction situe l’âge du roi au moment de son accession au trône.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה מָלַךְ
  choice: il régna cinquante-deux ans
  rationale: « Régner » est l’équivalent précis et usuel de מלך dans les notices royales.
- source_word: בִּירוּשָׁלָם
  choice: à Jérusalem
  rationale: La préposition ב indique ici le lieu où s’exerce le règne; « à » est idiomatique avec un nom de ville.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Cette tournure française actuelle restitue naturellement la formule hébraïque « le nom de sa mère était ».
- source_word: יְכָלְיָהוּ
  choice: Jecolia
  rationale: Forme française traditionnelle et intelligible du nom hébreu, sans translittération inutilement technique.
- source_word: מִירוּשָׁלָם
  choice: elle était originaire de Jérusalem
  rationale: La préposition מן exprime la provenance. La reprise explicite du sujet évite que « de Jérusalem » soit rattaché au nom propre et produit une phrase française naturelle.
theological_decisions: []
translation_notes:
  register: 'Français moderne, sobre et digne. La structure de la notice royale est conservée, tandis que les idiomes hébreux sont rendus sous une forme immédiatement compréhensible. La note de l’anglais de consultation n’est pas reprise: son appel est placé après l’accession au trône alors que son contenu concerne מִירוּשָׁלָם, et la provenance est exprimée sans ambiguïté dans le texte français.'
