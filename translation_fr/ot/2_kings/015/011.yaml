id: 2KI.15.11
reference: 2 Kings 15:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יֶ֖תֶר דִּבְרֵ֣י זְכַרְיָ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/011.yaml
  text: The rest of the acts of Zechariah—behold[a], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: fr
  text: Le reste des actes de Zacharie — les voici consignés dans le livre des Chroniques des rois d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le livre des Annales des rois d’Israël ».'
    reason: Alternative lexicale pour דִּבְרֵי הַיָּמִים, qui peut désigner des chroniques ou des annales royales.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes
  rationale: Dans la formule récapitulative des livres des Rois, יֶתֶר désigne ce qui reste à rapporter et דִּבְרֵי les actes ou faits du règne, plutôt que les seules paroles.
- source_word: זְכַרְיָה
  choice: Zacharie
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: הִנָּם
  choice: les voici
  rationale: Conserve la valeur déictique et emphatique de la particule hébraïque tout en restant idiomatique en français; le pronom pluriel renvoie aux actes.
- source_word: כְּתוּבִים
  choice: consignés
  rationale: Exprime naturellement dans un contexte d’archives le sens de « mis par écrit », sans changer l’idée du texte hébreu.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Dans cette formule archivistique, le français emploie naturellement « dans le livre », bien que עַל signifie littéralement « sur ».
- source_word: דִּבְרֵי הַיָּמִים
  choice: les Chroniques
  rationale: Rend de façon concise l’expression désignant un recueil historiographique royal; « annales » demeure une traduction possible.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: Rend naturellement la relation entre le recueil et les rois d’Israël dans le titre de l’ouvrage.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « les voici consignés » maintient l’emphase de הִנָּם sans recourir à l’archaïsme « voici qu’ils sont écrits ». Le tiret marque la reprise emphatique de la formule hébraïque.
