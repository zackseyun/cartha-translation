source:
  edition: WLC
  text: וַ/יַּעַל֩ מְנַחֵ֨ם בֶּן גָּדִ֜י מִ/תִּרְצָ֗ה וַ/יָּבֹא֙ שֹׁמְר֔וֹן וַ/יַּ֛ךְ אֶת שַׁלּ֥וּם בֶּן יָבֵ֖ישׁ בְּ/שֹׁמְר֑וֹן וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/014.yaml
  text: Then Menahem son of Gadi went up from Tirzah and came to Samaria, and he struck down Shallum son of Jabesh in Samaria and put him to death, and he reigned in his place.
translation:
  language: fr
  text: Alors Menahem, fils de Gadi, monta de Tirtsa et se rendit à Samarie. Là, à Samarie, il frappa Shalloum, fils de Yabesh, et le mit à mort. Puis il régna à sa place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה signifie couramment « monter ». « Monta » conserve l’expression géographique et narrative sans préciser indûment qu’il s’agissait d’une marche militaire.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: Menahem, fils de Gadi
  rationale: Les noms propres sont translittérés selon des formes françaises claires, et la filiation est conservée.
- source_word: מִתִּרְצָה
  choice: de Tirtsa
  rationale: La préposition מן indique ici le point de départ.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: se rendit à Samarie
  rationale: בוא suivi d’un nom de lieu exprime l’arrivée. « Se rendit à » est naturel en français et évite la répétition peu fluide de « monta… et vint ».
- source_word: וַיַּךְ אֶת
  choice: frappa
  rationale: נכה désigne l’action violente portée contre Shalloum. Le verbe suivant, « le mit à mort », rend explicitement l’issue fatale; traduire ici par « abattit » créerait une redondance et pourrait absorber la proposition suivante.
- source_word: שַׁלּוּם בֶּן יָבֵישׁ
  choice: Shalloum, fils de Yabesh
  rationale: La translittération distingue les consonnes des noms hébreux tout en restant lisible en français; la filiation est maintenue.
- source_word: בְּשֹׁמְרוֹן
  choice: là, à Samarie
  rationale: La localisation répétée dans l’hébreu est conservée. L’ajout de « là » relie naturellement la seconde mention à l’arrivée précédente.
- source_word: וַיְמִיתֵהוּ
  choice: le mit à mort
  rationale: La forme causative de מות est rendue directement par l’expression française « mettre à mort ».
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: il régna à sa place
  rationale: מלך signifie « régner » ou « être roi », et תחתיו marque ici la substitution ou succession.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La répétition de Samarie, présente dans l’hébreu, est maintenue sans lourdeur excessive. Les enchaînements par « Alors », « Là » et « Puis » rendent la succession des formes narratives hébraïques avec naturel.
