  text: אָ֣ז יַכֶּֽה מְ֠נַחֵם אֶת תִּפְסַ֨ח וְ/אֶת כָּל אֲשֶׁר בָּ֤/הּ וְ/אֶת גְּבוּלֶ֨י/הָ֙ מִ/תִּרְצָ֔ה כִּ֛י לֹ֥א פָתַ֖ח וַ/יַּ֑ךְ אֵ֛ת כָּל הֶ/הָ֥רוֹתֶ֖י/הָ בִּקֵּֽעַ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/016.yaml
  text: Then Menahem struck Tiphsah[a], and all who were in it, and its territory from Tirzah, because it had not opened to him; and he struck it[c][b], ripping open all its pregnant women.
translation:
  language: fr
  text: Alors Menahem attaqua Tifsah, tout ce qui s’y trouvait[a] et son territoire, depuis Tirtsa. Comme la ville ne lui avait pas ouvert ses portes[b], il éventra toutes les femmes enceintes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous ceux qui s’y trouvaient ». L’expression hébraïque peut désigner aussi bien les personnes que, plus largement, tout ce que contenait la ville.'
    reason: lexical_alternative
  - marker: b
    text: « Ouvrir ses portes » signifie ici laisser entrer Menahem, autrement dit se rendre à lui.
    reason: cultural_note
  - marker: c
    text: 'Ou : « fendit le ventre de toutes les femmes enceintes ». Le verbe hébreu décrit l’action violente de fendre ou d’ouvrir de force.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Adverbe temporel qui marque naturellement la succession des événements dans un récit.
- source_word: יַכֶּה / וַיַּךְ
  choice: attaqua
  rationale: Dans ce contexte militaire, נכה désigne une attaque violente. « Attaqua » est plus naturel en français actuel que « frappa » pour une ville, tout en conservant la répétition du verbe hébreu.
- source_word: תִּפְסַח
  choice: Tifsah
  rationale: Translittération française moderne du nom de lieu hébreu.
- source_word: כָּל אֲשֶׁר בָּהּ
  choice: tout ce qui s’y trouvait
  rationale: La formulation conserve l’étendue indéterminée de l’hébreu, qui peut englober les habitants et les biens, sans la limiter artificiellement aux seules personnes.
- source_word: גְּבוּלֶיהָ
  choice: son territoire
  rationale: גְּבוּל désigne ici vraisemblablement l’étendue territoriale dépendant de la ville, et non seulement ses frontières.
- source_word: מִתִּרְצָה
  choice: depuis Tirtsa
  rationale: Rendu direct de la préposition מן. Cette formulation préserve autant que possible la relation syntaxique concise et quelque peu ambiguë de l’hébreu.
- source_word: כִּי לֹא פָתַח
  choice: Comme la ville ne lui avait pas ouvert ses portes
  rationale: Dans un contexte de siège, « ouvrir » signifie laisser entrer l’assaillant ou se rendre. « La ville » explicite le sujet collectif singulier, et « ses portes » rend l’expression intelligible en français.
- source_word: הֶהָרוֹתֶיהָ
  choice: toutes les femmes enceintes
  rationale: L’adjectif substantivé désigne directement les femmes enceintes rattachées à la ville. La formulation reste sobre et explicite.
- source_word: בִּקֵּעַ
  choice: éventra
  rationale: Le piel de בקע exprime l’action violente de fendre ou d’ouvrir. « Éventra » communique directement l’horreur précise de l’acte en français naturel.
