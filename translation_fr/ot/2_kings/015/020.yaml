  text: וַ/יֹּצֵא֩ מְנַחֵ֨ם אֶת הַ/כֶּ֜סֶף עַל יִשְׂרָאֵ֗ל עַ֚ל כָּל גִּבּוֹרֵ֣י הַ/חַ֔יִל לָ/תֵת֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר חֲמִשִּׁ֧ים שְׁקָלִ֛ים כֶּ֖סֶף לְ/אִ֣ישׁ אֶחָ֑ד וַ/יָּ֨שָׁב֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹא עָ֥מַד שָׁ֖ם בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/020.yaml
  text: Then Menahem exacted the money from Israel[a], from all the mighty men of valor, to give to the king of Assyria fifty shekels of silver from each man. So the king of Assyria turned back and did not remain there in the land.
translation:
  language: fr
  text: Alors Menahem préleva l’argent sur Israël, sur tous les hommes fortunés[a], afin de donner au roi d’Assyrie cinquante sicles d’argent par homme. Le roi d’Assyrie se retira donc et ne resta pas dans le pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi désigner des « hommes vaillants », des hommes de guerre ou des notables. Elle peut évoquer la force militaire, le rang social ou la richesse; le contexte de cette levée favorise ici le sens d’hommes disposant de ressources.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא ... אֶת הַכֶּסֶף עַל יִשְׂרָאֵל
  choice: Menahem préleva cet argent sur Israël
  rationale: Le verbe signifie littéralement « faire sortir », mais, avec l’argent et la préposition עַל, il décrit ici une levée imposée. « Préleva ... sur » exprime naturellement cette contrainte fiscale sans surinterpréter sa forme précise.
- source_word: עַל כָּל גִּבּוֹרֵי הַחַיִל
  choice: c’est-à-dire sur tous les hommes riches et influents[a]
  rationale: La répétition de עַל précise vraisemblablement quelle partie d’Israël supporta la levée. גִּבּוֹרֵי הַחַיִל peut désigner des hommes forts ou vaillants, mais aussi des notables disposant de biens; le contexte fiscal favorise ici le statut économique et social. La note conserve les autres valeurs possibles.
- source_word: חֲמִשִּׁים שְׁקָלִים כֶּסֶף לְאִישׁ אֶחָד
  choice: cinquante sicles d’argent par homme
  rationale: « Sicle » rend l’unité de poids ancienne, et « par homme » exprime avec concision la somme exigée de chacun.
- source_word: וַיָּשָׁב מֶלֶךְ אַשּׁוּר
  choice: Le roi d’Assyrie se retira donc
  rationale: שׁוב indique que le roi repartit ou rebroussa chemin. « Se retira » convient au départ d’une puissance militaire après le versement.
- source_word: וְלֹא עָמַד שָׁם בָּאָרֶץ
  choice: et ne resta pas dans le pays
  rationale: Dans ce contexte, עמד signifie demeurer ou maintenir sa présence plutôt que se tenir debout au sens physique.
theological_decisions:
- issue: Identité des גִּבּוֹרֵי הַחַיִל
  choice: hommes riches et influents
  alternative: hommes vaillants / hommes de guerre
  rationale: Aucun enjeu doctrinal n’impose un sens unique. Le contexte d’une contribution individuelle de cinquante sicles favorise les hommes de moyens, tandis que la note préserve la portée militaire possible de l’expression.
translation_notes:
  register: Français international moderne, narratif et digne. « Préleva » et « se retira » sont courants sans être familiers. « Sicle » est maintenu comme terme biblique usuel pour l’unité de poids; aucune conversion moderne incertaine n’est ajoutée.
