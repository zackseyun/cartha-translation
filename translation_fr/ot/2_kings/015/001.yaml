base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/001.yaml
  text: In the twenty-seventh year of Jeroboam king of Israel, Azariah son of Amaziah, king of Judah, began to reign.
translation:
  language: fr
  text: La vingt-septième année du règne de Jéroboam, roi d’Israël, Azaria, fils d’Amatsia, devint roi de Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: La vingt-septième année du règne de
  rationale: La formule hébraïque date l’événement d’après l’année de règne du souverain. En français naturel, « du règne de » explicite la valeur chronologique du lamed sans alourdir la phrase.
- source_word: לְיָרָבְעָם מֶלֶךְ יִשְׂרָאֵל
  choice: de Jéroboam, roi d’Israël
  rationale: Le lamed désigne ici le roi dont les années de règne servent de repère; le titre royal est rendu selon l’usage français courant.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette notice d’avènement, le verbe indique l’entrée en fonction royale. « Devint roi » est naturel et conserve la concision de l’hébreu.
- source_word: עֲזַרְיָה בֶן אֲמַצְיָה
  choice: Azaria, fils d’Amatsia
  rationale: Les noms propres suivent une translittération française usuelle, et בֶן est rendu directement par « fils de ».
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Le titre final précise le royaume sur lequel Azaria commence à régner; il se rattache naturellement à « devint roi » en français.
