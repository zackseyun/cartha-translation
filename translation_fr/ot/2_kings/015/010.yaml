  text: וַ/יִּקְשֹׁ֤ר עָלָי/ו֙ שַׁלֻּ֣ם בֶּן יָבֵ֔שׁ וַ/יַּכֵּ֥/הוּ קָֽבָלְ עָ֖ם וַ/יְמִיתֵ֑/הוּ וַ/יִּמְלֹ֖ךְ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/010.yaml
  text: Then Shallum son of Jabesh conspired against him and struck him down before the people[a], and put him to death and reigned in his place.
translation:
  language: fr
  text: Alors Shalloum, fils de Yabesh, conspira contre lui. Il le frappa devant le peuple[a] et le mit à mort, puis il régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en public » ou « devant l’assemblée » ; le sens de l’expression hébraïque est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: conspira contre lui
  rationale: Dans le contexte politique d’une succession royale, קשר désigne un complot contre le souverain. « Conspira contre lui » restitue directement cette idée dans un registre digne et courant.
- source_word: שַׁלֻּם בֶּן־יָבֵשׁ
  choice: Shalloum, fils de Yabesh
  rationale: Les noms sont translittérés selon des formes françaises usuelles, et בן est rendu par la formule généalogique naturelle « fils de ».
- source_word: וַיַּכֵּהוּ
  choice: Il le frappa
  rationale: נכה signifie ici frapper. Le verbe suivant exprimant explicitement la mise à mort, cette formulation préserve la succession des actes sans faire de ce premier verbe un synonyme de « tuer ».
- source_word: קָבָל־עָם
  choice: devant le peuple
  rationale: Cette expression difficile semble indiquer que l’acte eut lieu en présence du peuple ou publiquement. « Devant le peuple » reste proche de l’hébreu et conserve son ambiguïté.
- source_word: וַיְמִיתֵהוּ
  choice: le mit à mort
  rationale: Le hiphil de מות exprime le fait de faire mourir ou de mettre à mort. Cette traduction garde la valeur causative et distingue ce geste du coup précédemment mentionné.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: puis il régna à sa place
  rationale: מלך avec תחתיו décrit l’accession au trône à la place du roi précédent. « Régna à sa place » conserve explicitement la notion royale; « puis » rend naturellement la progression narrative.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. La syntaxe est divisée en deux phrases pour éviter une coordination lourde, tout en conservant la séquence hébraïque : complot, coup, mise à mort, accession au trône. L’expression difficile קָבָל־עָם demeure littérale dans le texte, avec les principales possibilités en note.'
