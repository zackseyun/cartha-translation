base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/023.yaml
  text: In the fiftieth year of Azariah king of Judah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years.
translation:
  language: fr
  text: La cinquantième année du règne d’Azaria, roi de Juda, Pekahia, fils de Menahem, devint roi d’Israël à Samarie. Il régna deux ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת חֲמִשִּׁים שָׁנָה לַ/עֲזַרְיָה
  choice: La cinquantième année du règne d’Azaria
  rationale: La formule hébraïque date l’accession par rapport au règne d’Azaria. L’ajout explicatif « du règne de » rend naturellement en français la valeur du préfixe ל sans modifier le sens.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Le groupe construit désigne directement la fonction d’Azaria et le royaume sur lequel il règne.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette notice royale, le verbe marque l’accession au trône; la durée du règne est indiquée séparément à la fin du verset.
- source_word: פְּקַחְיָה
  choice: Pekahia
  rationale: Transcription française moderne du nom propre hébreu, sans accent ajouté afin de rester proche de sa forme source.
- source_word: בֶן מְנַחֵם
  choice: fils de Menahem
  rationale: Identification filiale directe, avec transcription française usuelle du nom.
- source_word: עַל יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Avec מָלַךְ, la préposition עַל indique le peuple ou le territoire soumis à l’autorité royale. La tournure française « devint roi d’Israël » est plus naturelle que « devint roi sur Israël ».
- source_word: בְּ/שֹׁמְרוֹן
  choice: à Samarie
  rationale: Le préfixe locatif ב situe le siège du règne dans la capitale; en français, « à » convient naturellement à un nom de ville.
- source_word: שְׁנָתָיִם
  choice: Il régna deux ans
  rationale: Le duel signifie « deux ans ». Le verbe est repris en français afin de former une proposition complète et claire.
