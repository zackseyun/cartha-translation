  text: Menahem mourut[a], et son fils Peqahya régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se coucha avec ses pères ». Cette expression hébraïque est une formule habituelle pour évoquer la mort d’un roi avant de nommer son successeur.'
