lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: mourut
  rationale: L’expression hébraïque, littéralement « se coucha avec ses pères », est une formule consacrée annonçant la mort d’un roi avant la succession. « Mourut » en communique clairement le sens en français moderne, tandis que la note conserve l’image et la formulation de l’hébreu.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans cette formule de succession royale, le verbe indique que Pekachia accéda au trône et exerça la royauté. « Régna » reste concis et naturel.
- source_word: פְּקַחְיָה
  choice: Pekachia
  rationale: Transcription française courante du nom propre hébreu.
- source_word: בְנוֹ
  choice: son fils
  rationale: La relation filiale est explicitement maintenue comme dans le texte source.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Cette expression rend directement l’idée de remplacement dans la succession royale.
