  text: רַ֤ק הַ/בָּמוֹת֙ לֹ֣א סָ֔רוּ ע֗וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמ֑וֹת ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/035.yaml
  text: Only the high places were not removed; the people still were sacrificing and burning incense on the high places[a]. He built the upper gate of the house of Yahweh.
translation:
  language: fr
  text: Toutefois, les hauts lieux ne furent pas supprimés ; le peuple continuait à offrir des sacrifices et à faire monter des offrandes en fumée sur les hauts lieux[a]. C’est lui qui construisit la porte supérieure de la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à brûler de l’encens sur les hauts lieux ». Le verbe hébreu peut désigner plus précisément l’action de brûler de l’encens, ou plus largement celle de faire monter une offrande en fumée.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Seulement
  rationale: Introduit l’exception qui nuance l’évaluation positive du roi, conformément à la formule récurrente des Rois.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: les hauts lieux / y
  rationale: « Hauts lieux » est le terme français consacré pour ces sanctuaires locaux ; le pronom « y » évite une répétition lourde tout en gardant le référent clair.
- source_word: לֹא סָרוּ
  choice: ne disparurent pas
  rationale: Rend naturellement l’idée que les hauts lieux ne furent pas éliminés, sans imposer explicitement un agent au verbe.
- source_word: עוֹד הָעָם מְזַבְּחִים
  choice: le peuple continuait à y offrir des sacrifices
  rationale: L’imparfait avec « continuait » exprime la pratique persistante indiquée par עוֹד et les participes.
- source_word: וּמְקַטְּרִים
  choice: à y faire fumer des offrandes
  rationale: Préserve la portée cultuelle potentiellement large de קטר, qui peut désigner l’encensement ou plus généralement la combustion d’une offrande produisant de la fumée.
- source_word: הוּא בָּנָה
  choice: C’est lui qui construisit
  rationale: L’extraction rend l’emphase légère du pronom indépendant הוּא.
- source_word: שַׁעַר ... הָעֶלְיוֹן
  choice: la porte supérieure
  rationale: Désigne naturellement une porte distinguée par sa position élevée.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Conserve l’expression hébraïque « maison » et rend directement le nom divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » conserve le nom propre plutôt que de le remplacer par un titre.
- issue: Nature précise de l’action exprimée par מקטרים
  choice: faire fumer des offrandes
  alternative: brûler de l’encens
  rationale: Le verbe peut viser spécifiquement l’encens, mais aussi plus largement une offrande consumée en fumée ; le texte principal conserve cette latitude et la note signale l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit historique ponctuel (« construisit »), tandis que l’imparfait exprime la pratique habituelle persistante du peuple.
