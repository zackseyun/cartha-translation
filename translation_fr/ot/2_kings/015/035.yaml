    issue: « ne disparurent pas »
    rationale: Le verbe סוּר dans cette formule royale signifie que les hauts lieux ne furent pas ôtés ou supprimés. « Disparaître » peut suggérer une disparition spontanée plutôt que leur maintien faute d’abolition.
  - severity: medium
    issue: « faire fumer des offrandes »
    rationale: Cette expression est peu idiomatique en français moderne. « Faire monter des offrandes en fumée » rend naturellement le geste rituel sans trancher indûment entre l’encens et une offrande brûlée.
  - severity: low
    issue: « Seulement » en position initiale et remplacement de la seconde occurrence de « hauts lieux » par « y »
    rationale: La formulation est compréhensible, mais « Toutefois » est plus fluide comme adversatif narratif, et la répétition explicite respecte mieux la structure et le vocabulaire du verset.
