  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/001.yaml
  text: And when King Hezekiah heard it, he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: fr
  text: Lorsque le roi Ézékias entendit cela, il déchira ses vêtements, se couvrit d’une toile de sac et entra dans la maison de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Lorsque … entendit
  rationale: La formule narrative hébraïque introduit l’événement suivant et sa circonstance temporelle. « Lorsque » rend naturellement cette relation en français sans reproduire lourdement « et il arriva que ».
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: le roi Ézékias
  rationale: Cet ordre est l’expression normale du titre suivi du nom propre en français.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: il déchira ses vêtements
  rationale: Cette formulation claire et actuelle conserve précisément le geste de deuil et de détresse.
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: se couvrit d’une toile de sac
  rationale: Le verbe réfléchi est conservé. « Toile de sac » désigne en français la matière grossière portée en signe de deuil ou d’humiliation.
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: entra dans la maison de Yahweh
  rationale: Avec בוא et le complément de lieu, « entra dans » exprime le mouvement vers l’intérieur. « Maison » préserve l’image cultuelle du texte au lieu de l’aplatir en « Temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin représente directement le tétragramme employé dans le texte hébreu, plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. « Yahweh » en préserve le caractère de nom propre sans importer la substitution traditionnelle par un titre.
translation_notes:
  register: Français moderne, international et digne. La syntaxe est fluide tout en conservant la succession des trois actions et l’expression biblique « maison de Yahweh ».
