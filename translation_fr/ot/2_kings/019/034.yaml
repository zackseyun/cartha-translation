id: 2KI.19.34
reference: 2 Kings 19:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/גַנּוֹתִ֛י אֶל הָ/עִ֥יר הַ/זֹּ֖את לְ/הֽוֹשִׁיעָ֑/הּ לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/034.yaml
  text: For I will defend this city to save it[a], for my own sake and for the sake of my servant David.
translation:
  language: fr
  text: Je protégerai cette ville pour la sauver[a], à cause de moi-même et à cause de David, mon serviteur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la délivrer ». Le verbe hébreu peut signifier « sauver » ou « délivrer » lorsqu’il s’agit d’arracher une personne ou une ville à un danger.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: Je protégerai
  rationale: Le verbe גנן exprime l’action de couvrir ou de protéger. « Protéger » convient au contexte militaire tout en restant naturel en français moderne.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: cette ville
  rationale: Avec גנן, la préposition אֶל désigne ici l’objet vers lequel s’exerce la protection; le français idiomatique n’exige pas de préposition.
- source_word: לְהוֹשִׁיעָהּ
  choice: et je la sauverai
  rationale: L’infinitif exprime le but de la protection. La coordination rend naturellement en français la relation entre protection et salut, sans modifier le sens.
- source_word: לְמַעֲנִי
  choice: à cause de moi-même
  rationale: Cette formulation conserve l’accent porté sur Dieu comme motif de son intervention, sans expliciter davantage la nature de ce motif.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: et à cause de David, mon serviteur
  rationale: La traduction préserve le second motif introduit parallèlement par לְמַעַן ainsi que l’apposition « mon serviteur ».
theological_decisions:
- issue: Motifs divins du salut de Jérusalem
  choice: Dieu sauvera la ville à cause de lui-même et à cause de David, son serviteur.
  alternative: Comprendre la mention de David uniquement comme un renvoi ponctuel à des promesses passées, sans portée d’alliance plus large.
  rationale: L’hébreu énonce explicitement deux motifs parallèles introduits par לְמַעַן. La traduction les conserve sans préciser ni résoudre davantage leur portée théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Protéger » est plus courant que « défendre » pour rendre l’image de couverture portée par גנן; « sauver » garde la formulation concise du texte. La répétition de « à cause de » conserve le parallélisme des deux motifs.
