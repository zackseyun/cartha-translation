base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, Hena, and Ivvah?
translation:
  language: fr
  text: Où sont le roi de Hamath, le roi d’Arpad et le roi de la ville de Sefarvaïm, de Hena[a] et d’Ivva ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre transcription : « Héna ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיּוֹ
  choice: Où sont
  rationale: L’adverbe interrogatif muni d’un suffixe masculin singulier demande littéralement où se trouve le roi; en français, le pluriel « sont » s’accorde naturellement avec la série coordonnée de rois et exprime leur sort dans cette question provocatrice.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Équivalent courant de מֶלֶךְ. La répétition hébraïque est conservée devant Hamath et Arpad, tandis que le troisième « roi » introduit la dernière série de lieux.
- source_word: חֲמָת
  choice: Hamath
  rationale: Transcription française traditionnelle et reconnaissable du nom de lieu.
- source_word: אַרְפָּד
  choice: Arpad
  rationale: Transcription française courante du nom de lieu.
- source_word: לָעִיר
  choice: de la ville de
  rationale: Cette formulation conserve explicitement עִיר, « ville », et comprend le préfixe ל comme marquant la relation au roi mentionné.
- source_word: סְפַרְוָיִם
  choice: Sefarvaïm
  rationale: Transcription adaptée aux conventions graphiques françaises.
- source_word: הֵנַע
  choice: Héna
  rationale: Transcription française claire du nom propre; l’accent aide à indiquer la prononciation.
- source_word: וְעִוָּה
  choice: et d’Ivva
  rationale: La conjonction relie Ivva à la série de lieux régie par « le roi de »; « d’ » explicite cette dépendance en français.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. La question de défi est conservée. La coordination a été légèrement resserrée pour rester naturelle, tout en maintenant la répétition rhétorique de « roi ». Le segment final est compris comme une série de villes dépendant du troisième « roi »; la ponctuation et les prépositions françaises rendent cette analyse explicite.
