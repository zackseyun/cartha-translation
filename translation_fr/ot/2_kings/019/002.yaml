  text: וַ֠/יִּשְׁלַח אֶת אֶלְיָקִ֨ים אֲשֶׁר עַל הַ/בַּ֜יִת וְ/שֶׁבְנָ֣א הַ/סֹּפֵ֗ר וְ/אֵת֙ זִקְנֵ֣י הַ/כֹּֽהֲנִ֔ים מִתְכַּסִּ֖ים בַּ/שַּׂקִּ֑ים אֶל יְשַֽׁעְיָ֥הוּ הַ/נָּבִ֖יא בֶּן אָמֽוֹץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/002.yaml
  text: And he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, clothed in sackcloth, to Isaiah the prophet[b], the son of Amoz.
translation:
  language: fr
  text: Il envoya Éliakim, responsable du palais[a], Shebna, le secrétaire, et les anciens des prêtres, vêtus de sacs[b], auprès du prophète Ésaïe, fils d’Amots.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui était sur la maison ». Il s’agissait d’un haut fonctionnaire chargé du palais ou de la maison royale.'
    reason: cultural_note
  - marker: b
    text: C’est-à-dire de toile de sac, une étoffe grossière portée en signe de deuil ou d’humiliation. Le participe hébreu peut souligner l’action de se couvrir ou l’état qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Il envoya
  rationale: Le wayyiqtol fait progresser le récit. En français, le passé simple suffit, sans qu’il soit nécessaire d’ajouter un connecteur.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: responsable du palais
  rationale: Cette expression désigne un haut fonctionnaire chargé du palais ou de la maison royale. Cette formulation française est naturelle tout en laissant la note préciser la portée de la fonction.
- source_word: הַסֹּפֵר
  choice: le secrétaire
  rationale: Dans ce contexte royal, סֹפֵר désigne vraisemblablement un secrétaire ou scribe officiel. « Secrétaire » exprime clairement la fonction en français moderne sans la réduire à un simple copiste.
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: les anciens des prêtres
  rationale: 'La traduction conserve les deux éléments du groupe construit : des anciens appartenant au corps sacerdotal, sans les assimiler simplement aux principaux prêtres.'
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: tous vêtus d’habits de deuil
  rationale: Le participe décrit soit l’action de se couvrir, soit l’état qui en résulte. Le sac étant un vêtement de deuil et d’humiliation, la formulation communique naturellement son sens culturel; la note conserve l’image littérale et l’ambiguïté aspectuelle.
- source_word: אֶל יְשַׁעְיָהוּ הַנָּבִיא
  choice: auprès du prophète Ésaïe
  rationale: « Auprès de » rend naturellement la destination d’une délégation envoyée vers une personne; le titre apposé est conservé.
- source_word: בֶּן אָמוֹץ
  choice: fils d’Amots
  rationale: Identification généalogique directe, conforme à l’usage français.
theological_decisions: []
