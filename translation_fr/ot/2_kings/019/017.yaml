source:
  edition: WLC
  text: אָמְנָ֖ם יְהוָ֑ה הֶחֱרִ֜יבוּ מַלְכֵ֥י אַשּׁ֛וּר אֶת הַ/גּוֹיִ֖ם וְ/אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/017.yaml
  text: Truly[a], O Yahweh[b], the kings of Assyria have laid waste the nations and their lands.
translation:
  language: fr
  text: Il est vrai[a], Yahweh, que les rois d’Assyrie ont dévasté les nations et leurs pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Oui » ou « Assurément »; le terme hébreu introduit une affirmation appuyée.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « leur pays »; le singulier hébreu a probablement ici un sens collectif ou distributif.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: Il est vrai
  rationale: Cette formule introduit une affirmation reconnue comme vraie, avec une nuance emphatique et concessive. Elle est naturelle en français dans le cadre de la prière d’Ézéchias.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh » plutôt que remplacé par un titre.
- source_word: הֶחֱרִיבוּ
  choice: ont dévasté
  rationale: Le hiphil de חרב exprime ici le fait de réduire à la ruine. « Ont dévasté » convient au contexte de conquêtes militaires.
- source_word: מַלְכֵי אַשּׁוּר
  choice: les rois d’Assyrie
  rationale: Cette formulation rend directement et naturellement la chaîne construite hébraïque.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Dans ce contexte géopolitique, le terme désigne les nations soumises par l’Assyrie.
- source_word: אַרְצָם
  choice: leurs pays
  rationale: Bien que le nom hébreu soit au singulier, il se rapporte collectivement ou distributivement aux différentes nations. Le pluriel français exprime clairement ce sens.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme; conserver un nom propre préserve son statut de nom divin plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Il est vrai… que » restitue l’affirmation initiale sans archaïsme; « dévasté » conserve la force militaire du verbe.
