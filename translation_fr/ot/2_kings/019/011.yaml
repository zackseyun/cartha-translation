  source_fidelity: 'Le sens général est fidèle : les rois d’Assyrie ont agi contre tous les pays et la question finale est une provocation rhétorique. Toutefois, l’infinitif hébreu לְהַחֲרִימָם est plus exactement rendu comme une action liée à ce qu’ils leur ont fait (« en les vouant... ») que comme une nouvelle proposition indépendante après deux-points.'
  naturalness: Le français est moderne et naturel. « Tu as bien entendu » transmet de façon idiomatique l’insistance introductive. La formulation révisée rend plus souplement le lien syntaxique avec « ce que ... ont fait ».
  terminology: « Vouer à la destruction » rend bien la nuance de חרם sans jargon technique. « Délivré » convient au nifal de נצל et au ton rhétorique. La note doit proposer une alternative grammaticalement complète et directement rattachable au texte.
