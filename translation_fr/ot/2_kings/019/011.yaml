source:
  edition: WLC
  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֵת֩ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַֽחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands, devoting them to destruction—and will you be delivered?
translation:
  language: fr
  text: Tu as bien entendu ce que les rois d’Assyrie ont fait à tous les pays, en les vouant à la destruction[a]. Et toi, serais-tu délivré ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en les détruisant entièrement » ; l’hébreu emploie un terme qui désigne le fait de vouer à la destruction.
    reason: alternative lexicale
lexical_decisions:
- source_word: הִנֵּה
  choice: bien
  rationale: Dans ce contexte de défi, הִנֵּה souligne une réalité déjà connue. « Tu as bien entendu » restitue naturellement cette insistance en français moderne sans recourir à l’archaïque « voici ».
- source_word: שָׁמַעְתָּ
  choice: tu as entendu
  rationale: Le parfait à la deuxième personne du masculin singulier désigne une information reçue auparavant et toujours pertinente.
- source_word: מַלְכֵי אַשּׁוּר
  choice: les rois d’Assyrie
  rationale: Rend directement et naturellement la construction hébraïque à l’état construit.
- source_word: לְכָל הָאֲרָצוֹת
  choice: à tous les pays
  rationale: Le pluriel אֲרָצוֹת désigne ici des territoires politiques conquis, d’où « pays » plutôt que « terres ».
- source_word: לְהַחֲרִימָם
  choice: ils les ont voués à la destruction
  rationale: Le verbe חרם à la forme causative exprime la mise à part pour une destruction totale. La formulation conserve cette nuance particulière tout en restant compréhensible.
- source_word: וְאַתָּה תִּנָּצֵל
  choice: Et toi, serais-tu délivré ?
  rationale: Le pronom indépendant marque fortement le contraste. Le conditionnel français rend naturellement la question rhétorique et provocatrice, tandis que « délivré » conserve la valeur passive du nifal.
theological_decisions:
- issue: Rendu du vocabulaire de חרם dans un contexte de guerre
  choice: voués à la destruction
  alternative: entièrement détruits
  rationale: « Voués à la destruction » préserve l’idée spécifique d’une mise à part irrévocable pour la destruction, sans réduire le terme à une simple victoire militaire ni introduire une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, direct et digne. La tournure initiale exprime l’insistance de הִנֵּה sans archaïsme, et la question finale conserve le ton provocateur du message assyrien.
