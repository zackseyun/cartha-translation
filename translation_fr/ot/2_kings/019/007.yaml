source:
  edition: WLC
  text: הִנְ/נִ֨י נֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב לְ/אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/007.yaml
  text: Look[a], I am putting a spirit in him, and he will hear a report and return to his own land[b], and I will make him fall by the sword in his own land.
translation:
  language: fr
  text: 'Voici, je vais mettre en lui un esprit[a] : il entendra une nouvelle[b], retournera dans son pays, et je le ferai tomber par l’épée dans son propre pays.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une disposition » ; le mot hébreu peut aussi signifier « souffle » ou « vent ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une information » ou « une rumeur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici
  rationale: La formule attire l’attention sur l’annonce divine et conserve sa force déictique dans un français actuel et digne.
- source_word: נֹתֵן
  choice: je mets
  rationale: Le participe après הִנְנִי présente l’action comme imminente et vivement annoncée; le présent français en garde l’immédiateté.
- source_word: רוּחַ
  choice: un esprit
  rationale: Le terme peut désigner un esprit, un souffle, un vent ou une disposition intérieure. « Un esprit » reste proche de l’hébreu et ne précise pas excessivement le moyen par lequel Dieu agit sur le roi assyrien.
- source_word: וְשָׁמַע
  choice: il entendra
  rationale: Dans cette annonce prophétique, la forme verbale poursuit la séquence des résultats de l’action divine et reçoit naturellement une valeur future.
- source_word: שְׁמוּעָה
  choice: une nouvelle
  rationale: Le nom désigne ce qui est entendu, une nouvelle, une information ou une rumeur. « Une nouvelle » est idiomatique et demeure neutre quant à la fiabilité du message.
- source_word: וְשָׁב
  choice: retournera
  rationale: Le verbe exprime le retour ou le fait de rebrousser chemin; « retournera » convient naturellement avec la destination indiquée.
- source_word: לְאַרְצוֹ
  choice: dans son pays
  rationale: En français, le mouvement de retour se construit naturellement avec « dans son pays »; le suffixe possessif est rendu explicitement.
- source_word: וְהִפַּלְתִּיו
  choice: je le ferai tomber
  rationale: Cette formulation conserve la valeur causative du hiphil de נפל sans la remplacer par une expression plus interprétative telle que « je le frapperai à mort ».
- source_word: בַּחֶרֶב
  choice: par l’épée
  rationale: La formulation préserve l’instrument de la mort et l’expression biblique, tout en restant compréhensible en français moderne.
- source_word: בְּאַרְצוֹ
  choice: dans son propre pays
  rationale: « Propre » souligne ici, sans ajout de sens étranger au suffixe, l’ironie de sa chute dans le pays auquel il sera retourné.
theological_decisions:
- issue: Sens de רוּחַ dans l’oracle de jugement divin
  choice: un esprit
  alternative: une disposition; un souffle; un vent
  rationale: Le contexte présente l’action souveraine de Dieu conduisant le roi assyrien à entendre une nouvelle puis à repartir. « Un esprit » préserve l’étendue sémantique du mot hébreu ainsi que l’ambiguïté concernant la nature exacte de cette action, sans en imposer le mécanisme.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe coordonnée conserve la progression serrée de l’oracle hébreu. « Voici » maintient la solennité sans employer l’archaïque « voici que » de manière systématique; les notes préservent les principales ambiguïtés lexicales.
