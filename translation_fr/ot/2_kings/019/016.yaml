  terminology: « Yahweh » respecte le rendu établi du tétragramme. « Sennachérib », « le Dieu vivant » et « insulter » sont justes, usuels et adaptés au registre. La note associe correctement « défier » à la gamme sémantique de חרף sans réduire le sens à cette seule nuance.
