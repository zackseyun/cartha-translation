  text: הַטֵּ֨ה יְהוָ֤ה אָזְנְ/ךָ֙ וּֽ/שֲׁמָ֔ע פְּקַ֧ח יְהוָ֛ה עֵינֶ֖י/ךָ וּ/רְאֵ֑ה וּ/שְׁמַ֗ע אֵ֚ת דִּבְרֵ֣י סַנְחֵרִ֔יב אֲשֶׁ֣ר שְׁלָח֔/וֹ לְ/חָרֵ֖ף אֱלֹהִ֥ים חָֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/016.yaml
  text: Incline your ear[a], O Yahweh, and hear; open your eyes, O Yahweh, and see; and hear the words of Sennacherib, which he has sent to reproach the living God.
translation:
  language: fr
  text: Tends l’oreille, Yahweh, et écoute ! Ouvre les yeux, Yahweh, et regarde ! Écoute les paroles de Sennachérib, qu’il a envoyées pour insulter[a] le Dieu vivant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « défier »; le verbe hébreu peut évoquer l’insulte, la raillerie ou l’affront lancé avec défi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Tends l’oreille
  rationale: L’impératif de נטה avec « oreille » est une expression imagée demandant une écoute attentive. « Tends l’oreille » est naturel en français actuel et conserve l’image hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française intelligible du nom divin יהוה, afin de préserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: וּשֲׁמָע
  choice: et écoute / Écoute
  rationale: שמע est répété dans le verset. La répétition de « écoute » maintient l’insistance et le parallélisme de la prière.
- source_word: פְּקַח ... עֵינֶיךָ וּרְאֵה
  choice: Ouvre les yeux ... et regarde
  rationale: Rend directement les deux impératifs et conserve leur parallélisme avec l’appel à tendre l’oreille et à écouter.
- source_word: דִּבְרֵי סַנְחֵרִיב
  choice: les paroles de Sennachérib
  rationale: דִּבְרֵי est un pluriel construit. « Paroles » restitue directement ce pluriel et convient au contexte d’un discours outrageant.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: qu’il a envoyées
  rationale: Le relatif est rattaché aux « paroles » selon le sens de la phrase. L’accord du participe passé est requis en français puisque le complément d’objet direct féminin pluriel le précède.
- source_word: לְחָרֵף
  choice: pour insulter
  rationale: חרף exprime ici l’outrage verbal, la raillerie ou l’affront. « Insulter » est clair, actuel et suffisamment large pour rendre ce noyau de sens.
- source_word: אֱלֹהִים חָי
  choice: le Dieu vivant
  rationale: Expression française consacrée et directe, qui conserve le contraste implicite entre le Dieu vivant et les divinités sans vie.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie le nom propre divin. Sa translittération préserve cette donnée sans substituer au nom un titre traditionnel.
- issue: Portée de חרף dirigé contre Dieu
  choice: insulter le Dieu vivant
  alternative: défier le Dieu vivant
  rationale: Le verbe désigne d’abord l’outrage, la provocation méprisante ou la raillerie. « Insulter » garde cette dimension verbale, tandis que « défier » met davantage en avant l’affront et la confrontation; cette nuance est signalée en note sans trancher excessivement.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Les impératifs brefs et la répétition d’« écoute » préservent le rythme pressant de la prière. La ponctuation expressive rend naturellement la succession des appels en français sans ajouter de contenu.
