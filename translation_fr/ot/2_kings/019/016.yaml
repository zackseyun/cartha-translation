  source_fidelity: 'Le texte rend fidèlement la succession des impératifs et le parallélisme de la prière : « tends l’oreille / écoute », « ouvre les yeux / regarde », puis la reprise de « écoute ». « Insulter le Dieu vivant » rend bien לְחָרֵף אֱלֹהִים חָי. La formulation « les paroles ... qu’il a envoyées » suit l’interprétation contextuelle également retenue dans la piste d’audit anglaise. Le suffixe singulier de שְׁלָחוֹ est syntaxiquement difficile dans le texte massorétique et peut évoquer l’émissaire plutôt que les paroles elles-mêmes, mais la formulation française ne force pas une lecture théologique et demeure une traduction idiomatique recevable du sens contextuel.'
