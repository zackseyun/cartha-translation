  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/003.yaml
  text: 'They said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[c][b], but there is no strength to give birth.”'
translation:
  language: fr
  text: 'Ils lui dirent : « Voici ce que dit Ézéchias : Ce jour est un jour de détresse, de réprimande et d’outrage[a]. Les enfants sont arrivés jusqu’au moment de la naissance[b][c], mais il n’y a pas de force pour enfanter. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de mépris » ou « d’insulte » pour « d’outrage ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les enfants sont arrivés jusqu’au lieu ou au moment de l’enfantement ». L’image est celle d’un travail arrivé au moment de la naissance, alors que les forces viennent à manquer.'
    reason: cultural_note
  - marker: c
    text: Le terme hébreu מַשְׁבֵּר est difficile ; il peut désigner plus concrètement le lieu de l’accouchement, parfois compris comme le siège d’accouchement.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette tournure française naturelle conserve la fonction solennelle de la formule de messager introduisant les paroles d’Ézéchias.
- source_word: יוֹם צָרָה
  choice: un jour de détresse
  rationale: « Détresse » exprime une situation de pression et de danger extrêmes sans ajouter une interprétation particulière.
- source_word: וְתוֹכֵחָה
  choice: de réprimande
  rationale: Le nom peut désigner une réprimande, un reproche ou une correction. « Réprimande » reste proche du sens lexical et s’intègre à la série de trois noms.
- source_word: וּנְאָצָה
  choice: d’outrage
  rationale: Le terme évoque le mépris ou l’insulte méprisante. « Outrage » rend à la fois l’affront subi et sa gravité, sans le limiter explicitement au blasphème.
- source_word: הַיּוֹם הַזֶּה
  choice: Ce jour
  rationale: La formulation garde l’insistance du démonstratif hébreu et convient au registre solennel du message royal.
- source_word: בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: Les enfants sont arrivés au moment de naître
  rationale: Cette traduction transmet clairement en français actuel l’image d’un travail parvenu à son moment décisif, tout en signalant en note l’incertitude concernant מַשְׁבֵּר.
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: mais il n’y a pas de force pour accoucher
  rationale: 'La tournure conserve l’énoncé impersonnel et le paradoxe de l’image : l’accouchement est imminent, mais la force nécessaire fait défaut.'
- source_word: בָנִים
  choice: les enfants
  rationale: Bien que le nom soit formellement masculin pluriel, la métaphore concerne les nouveau-nés en général ; « enfants » convient mieux que « fils » en français.
