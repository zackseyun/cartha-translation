  text: וַ/יִּקַּ֨ח חִזְקִיָּ֧הוּ אֶת הַ/סְּפָרִ֛ים מִ/יַּ֥ד הַ/מַּלְאָכִ֖ים וַ/יִּקְרָאֵ֑/ם וַ/יַּ֨עַל֙ בֵּ֣ית יְהוָ֔ה וַ/יִּפְרְשֵׂ֥/הוּ חִזְקִיָּ֖הוּ לִ/פְנֵ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[a], and he went up to the house of Yahweh[c][b], and Hezekiah spread them before Yahweh.
translation:
  language: fr
  text: Ézéchias prit les lettres[a] de la main des messagers et les lut. Puis il monta à la maison de Yahweh et les déploya[b] devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « documents », « rouleaux » ou « écrits » ; le terme hébreu a un sens plus large que celui de lettres personnelles.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « il le déploya », au singulier, envisageant peut-être l’ensemble des lettres comme un seul message écrit.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: les lettres
  rationale: Le nom désigne largement des écrits, livres ou documents. Dans ce contexte, il s’agit du message écrit remis par les messagers; « lettres » est donc naturel, tout en laissant d’autres possibilités en note.
- source_word: מִיַּד הַמַּלְאָכִים
  choice: de la main des messagers
  rationale: Cette formulation conserve l’image concrète de l’hébreu. Les מַלְאָכִים sont ici des messagers humains, non des êtres célestes.
- source_word: וַיַּעַל
  choice: il monta
  rationale: Le verbe exprime une montée; cette nuance convient au déplacement vers le sanctuaire et reste idiomatique en français.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Traduction transparente de l’expression hébraïque; « temple de Yahweh » serait une explicitation contextuelle possible.
- source_word: וַיִּפְרְשֵׂהוּ
  choice: les déploya
  rationale: Le verbe décrit l’action d’étendre ou de déployer les écrits. Le suffixe hébreu est formellement singulier, probablement parce que le message écrit est envisagé comme un ensemble; le français reprend le pluriel nécessaire avec « lettres », et la particularité est signalée en note.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Rendu direct et idiomatique de l’action accomplie en présence de Yahweh.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel. « Yahweh » le représente directement sans lui substituer un titre.
- issue: Rapport entre le pluriel הַסְּפָרִים et le suffixe singulier de וַיִּפְרְשֵׂהוּ
  choice: Employer le pluriel en français et signaler le singulier hébreu en note
  alternative: Écrire « il le déploya » malgré l’antécédent pluriel
  rationale: Le passage du pluriel au singulier peut envisager les écrits comme un message unique, mais reproduire littéralement ce changement créerait en français une discordance obscure. La note préserve la donnée textuelle sans imposer une explication certaine.
translation_notes:
  register: Français international actuel, digne et accessible. La coordination répétitive de l’hébreu est légèrement allégée par « Puis », sans modifier la succession des actions. « Maison de Yahweh » conserve l’expression source plutôt que de l’expliciter par « temple ».
