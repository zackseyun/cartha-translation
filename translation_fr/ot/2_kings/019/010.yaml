  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying, “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: fr
  text: 'Voici ce que vous direz à Ézéchias, roi de Juda : « Que ton Dieu[a], en qui tu mets ta confiance, ne te trompe pas en disant : “Jérusalem ne sera pas livrée entre les mains du roi d’Assyrie.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton dieu ». L’hébreu ne distingue pas les majuscules des minuscules, et le roi assyrien tourne en dérision la confiance d’Ézéchias.
    reason: Alternative typographique et nuance liée au point de vue du locuteur.
lexical_decisions:
- source_word: כֹּה תֹאמְרוּן
  choice: Voici ce que vous direz
  rationale: Rend naturellement en français moderne la formule de message et la valeur directive de l’imparfait à la deuxième personne du pluriel.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Ézéchias, roi de Juda
  rationale: Emploie les formes françaises usuelles du nom propre et du titre en apposition.
- source_word: אַל יַשִּׁאֲךָ
  choice: Que … ne te trompe pas
  rationale: Le verbe נשׁא exprime ici l’idée de tromper ou d’abuser. Cette tournure prohibitive reste naturelle et conserve l’adresse directe au singulier.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בּוֹ
  choice: en qui tu mets ta confiance
  rationale: Restitue le complément introduit par ב avec בטח et exprime clairement la confiance placée en une personne.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Introduit directement les paroles par lesquelles, selon le roi d’Assyrie, Dieu tromperait Ézéchias, sans préciser davantage le lien syntaxique.
- source_word: לֹא תִנָּתֵן
  choice: ne sera pas livrée
  rationale: Rend le niphal passif de נתן dans son sens contextuel de remise au pouvoir de l’ennemi.
- source_word: בְּיַד
  choice: entre les mains de
  rationale: Conserve l’image hébraïque du pouvoir ou du contrôle, sous une forme idiomatique en français.
theological_decisions:
- issue: Interprétation de אֱלֹהֶיךָ dans la bouche du roi assyrien
  choice: ton Dieu
  alternative: ton dieu
  rationale: Le référent est le Dieu d’Ézéchias, ce qui justifie la majuscule dans le texte principal. L’hébreu ne marque toutefois pas cette distinction typographique et le locuteur s’exprime avec mépris; l’autre graphie est donc signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement est conservé parce que le discours s’adresse directement à Ézéchias au singulier, tandis que « vous direz » vise les messagers au pluriel. Les citations emboîtées rendent visibles les différents niveaux de parole.
