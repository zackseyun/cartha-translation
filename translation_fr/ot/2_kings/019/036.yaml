lexical_decisions:
- source_word: וַיִּסַּע וַיֵּלֶךְ וַיָּשָׁב
  choice: leva le camp, partit et s’en retourna
  rationale: La succession des trois verbes est conservée, tout en rendant וַיִּסַּע selon son sens contextuel de départ ou de levée du camp et וַיָּשָׁב comme un retour.
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: Dans ce contexte, le verbe indique que Sennachérib demeura à Ninive; « resta » est naturel en français et évite de suggérer nécessairement qu’il y établit alors une nouvelle résidence.
- source_word: בְּנִינְוֵה
  choice: à Ninive
  rationale: Forme française courante du nom de la ville avec la préposition locative naturelle.
