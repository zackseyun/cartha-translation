  text: אֲנִ֣י קַ֔רְתִּי וְ/שָׁתִ֖יתִי מַ֣יִם זָרִ֑ים וְ/אַחְרִב֙ בְּ/כַף פְּעָמַ֔/י כֹּ֖ל יְאֹרֵ֥י מָצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/024.yaml
  text: I myself have dug and drunk foreign waters[a], and with the sole of my feet I dry up all the streams of Egypt.
translation:
  language: fr
  text: Moi, j’ai creusé et bu des eaux étrangères ; sous la plante de mes pieds, j’ai asséché tous les canaux d’Égypte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les canaux ou bras du Nil d’Égypte ». Le terme hébreu peut désigner spécialement des cours d’eau ou canaux liés au Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Moi, j’ai
  rationale: Le pronom indépendant renforce l’affirmation arrogante du locuteur ; la dislocation « Moi, j’ai » restitue naturellement cette insistance en français.
- source_word: קַרְתִּי
  choice: j’ai creusé
  rationale: Le verbe désigne ici l’action de creuser, vraisemblablement pour atteindre une source d’eau. La traduction n’ajoute ni « puits » ni autre complément absent de l’hébreu.
- source_word: מַיִם זָרִים
  choice: des eaux étrangères
  rationale: Cette formulation conserve le sens littéral de זָרִים et évoque, dans le contexte de conquête, les eaux de territoires étrangers sans expliciter davantage que le texte.
- source_word: וְאַחְרִב
  choice: j’ai asséché
  rationale: Le hiphil de חרב signifie ici « rendre sec, assécher ». La suite narrative du discours permet de rendre la forme verbale par un passé composé, en parallèle avec les deux parfaits précédents.
- source_word: בְּכַף פְּעָמַי
  choice: avec la plante de mes pieds
  rationale: כַּף, appliqué au pied, en désigne la plante. L’expression conserve l’image concrète d’une domination si grande que le simple contact des pieds assèche les cours d’eau.
- source_word: יְאֹרֵי
  choice: canaux
  rationale: יְאֹר désigne souvent les bras, chenaux ou canaux liés au Nil. « Canaux » est naturel dans ce contexte, tandis qu’une note signale les autres nuances possibles.
- source_word: מָצוֹר
  choice: Égypte
  rationale: Dans cette association avec יְאֹרֵי, מָצוֹר est compris comme une désignation poétique de l’Égypte plutôt que dans son sens courant de « siège » ou de « place forte ».
theological_decisions:
- issue: Référent et force rhétorique du discours à la première personne
  choice: Conserver sans l’atténuer la vantardise royale à la première personne.
  alternative: Préciser dans le verset qu’il s’agit du roi d’Assyrie ou réduire les paroles à une simple propagande militaire.
  rationale: Le contexte identifie le locuteur, mais le verset lui-même met en avant son « moi » arrogant. La traduction préserve cette tension sans ajouter d’interprétation théologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme bref et affirmatif conserve le ton de la proclamation royale. « Asséché » est plus idiomatique que « rendu secs », et le passé composé relie les trois actions dans une même vantardise.
