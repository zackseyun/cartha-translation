  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָ קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ עַל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/022.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel[a][b].
translation:
  language: fr
  text: Qui as-tu insulté et blasphémé ? Contre qui as-tu élevé la voix et levé les yeux bien haut ? Contre le Saint d’Israël[a][b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « outragé et injurié ». Les deux verbes hébreux, de sens voisin, désignent des paroles méprisantes et offensantes ; le second peut plus précisément évoquer le blasphème contre Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « levé tes yeux vers les hauteurs » : une image exprimant l’orgueil et l’arrogance.'
    reason: cultural_note
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: insulté
  rationale: Le verbe désigne ici une parole outrageante et méprisante. « Insulté » est naturel en français moderne et forme une progression claire vers « blasphémé ».
- source_word: גִדַּפְתָּ
  choice: blasphémé
  rationale: Le verbe peut désigner des paroles injurieuses dirigées contre Dieu. Dans ce contexte, « blasphémé » préserve la gravité religieuse de l’accusation.
- source_word: הֲרִימוֹתָ קּוֹל
  choice: élevé la voix
  rationale: Cette expression française naturelle conserve l’image hébraïque et le ton de défi arrogant.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: porté avec hauteur tes regards
  rationale: Cette formulation conserve l’image du regard élevé tout en rendant explicite, sans lourdeur, la connotation d’orgueil portée par מָרוֹם dans ce contexte.
- source_word: קְדֹושׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Il s’agit d’un titre divin consacré dans le langage biblique français et particulièrement associé au livre d’Ésaïe, auquel ce récit est étroitement lié.
- source_word: עַל
  choice: contre
  rationale: La préposition exprime ici une orientation hostile ; « contre » restitue directement cette force.
- source_word: מִי
  choice: qui
  rationale: Après les prépositions et comme objet antéposé, « qui » est la forme correcte et naturelle en français moderne.
theological_decisions:
- issue: Préserver la gravité théologique des paroles dirigées contre Dieu
  choice: Employer « blasphémé » et conserver l’identification culminante « contre le Saint d’Israël »
  alternative: Employer un terme moins explicitement religieux tel que « outragé » ou « injurié »
  rationale: Le propos ne dénonce pas seulement une arrogance politique, mais des paroles sacrilèges visant le Dieu d’Israël. « Blasphémé » exprime cette portée sans ajouter de contenu doctrinal étranger au texte.
- issue: Ponctuation de l’identification finale
  choice: Faire de « Contre le Saint d’Israël ! » une réponse culminante et emphatique
  alternative: Conserver un point final neutre
  rationale: La syntaxe hébraïque place le titre divin en culmination après les questions rhétoriques. Le point d’exclamation rend en français cette force accusatrice sans modifier le sens.
translation_notes:
  register: Français international moderne, digne et direct. Les questions rhétoriques et la répétition de « contre » sont conservées. « Le Saint d’Israël » maintient le titre divin traditionnel sans archaïsme excessif.
