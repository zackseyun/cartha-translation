  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת כָּל דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/004.yaml
  text: Perhaps Yahweh your God will hear all the words of the Rabshakeh[a], whom his master the king of Assyria has sent to mock the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that remains.
translation:
  language: fr
  text: Peut-être Yahweh, ton Dieu, entendra-t-il toutes les paroles du Rab-Shaké[a], que son maître, le roi d’Assyrie, a envoyé pour insulter le Dieu vivant, et réprouvera-t-il ces paroles[b] que Yahweh, ton Dieu, a entendues. Élève donc une prière[c] en faveur du reste qui subsiste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Rab-Shaké » est vraisemblablement un titre officiel assyrien; on a aussi proposé « grand échanson ».
    reason: cultural_note
  - marker: b
    text: 'Ou : « le réprimandera à cause des paroles que Yahweh, ton Dieu, a entendues ». Le verbe hébreu peut exprimer la réprimande, la réfutation ou l’établissement du tort.'
    reason: lexical_alternative
  - marker: c
    text: L’expression hébraïque signifie littéralement « élève » ou « porte une prière »; elle peut simplement se traduire par « prie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: Peut-être que … entendra
  rationale: Préserve la possibilité espérée exprimée par אוּלַי avec l’imparfait, dans une tournure française naturelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: רַב שָׁקֵה
  choice: le Rab-Shaké
  rationale: Conserve par translittération ce titre assyrien dont le sens administratif précis reste discuté.
- source_word: לְחָרֵף
  choice: pour insulter
  rationale: Exprime le mépris outrageant dirigé contre Dieu; « insulter » est actuel, fort et compatible avec la gamme sémantique du verbe.
- source_word: אֱלֹהִים חַי
  choice: le Dieu vivant
  rationale: Rend directement l’expression hébraïque et son contraste implicite avec les divinités sans vie.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: et qu’il demandera compte des paroles
  rationale: הוכיח peut évoquer la réprimande, l’accusation ou l’établissement du tort. Cette formulation conserve l’idée d’une intervention judiciaire sans ajouter un objet humain absent de l’hébreu.
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: Fais donc monter une prière
  rationale: Conserve l’image idiomatique de « porter/élever une prière » tout en restant intelligible en français moderne.
- source_word: בְּעַד הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: en faveur du reste qui subsiste
  rationale: בְּעַד marque l’intercession; « reste » maintient le terme biblique, et « qui subsiste » rend le participe נִמְצָאָה sans redondance excessive.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom propre divin; sa transcription le distingue des titres divins.
- issue: Sens de הוכיח dans la réponse attendue de Dieu
  choice: demandera compte des paroles
  alternative: réprimandera à cause des paroles / réfutera les paroles
  rationale: La construction ne donne pas explicitement d’objet personnel. Le choix retenu garde la dimension de réprobation ou de jugement tout en évitant de déterminer trop étroitement comment Dieu répondra.
- issue: Rendu de השארית
  choice: le reste
  alternative: les survivants / ceux qui restent
  rationale: « Le reste » est fidèle au substantif collectif et conserve sa résonance biblique sans affirmer davantage que le verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond à l’adresse faite à Ésaïe. La syntaxe conserve la longue supplication du texte tout en la rendant fluide; les ambiguïtés du titre assyrien et du verbe הוכיח sont signalées en notes.
