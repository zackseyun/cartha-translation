revisions:
- from: Peut-être que Yahweh, ton Dieu, entendra toutes les paroles du Rab-Shaké[a], que le roi d’Assyrie, son maître, a envoyé pour insulter le Dieu vivant, et qu’il demandera compte des paroles que Yahweh, ton Dieu, a entendues[b]. Fais donc monter une prière[c] en faveur du reste qui subsiste.
  to: Peut-être Yahweh, ton Dieu, entendra-t-il toutes les paroles du Rab-Shaké[a], que son maître, le roi d’Assyrie, a envoyé pour insulter le Dieu vivant, et réprouvera-t-il ces paroles[b] que Yahweh, ton Dieu, a entendues. Élève donc une prière[c] en faveur du reste qui subsiste.
  rationale: La correction remplace une expression française ambiguë et sémantiquement déplacée par « réprouvera ces paroles », qui rend naturellement la réprobation impliquée par הוֹכִיחַ et respecte l’ambiguïté syntaxique quant à un éventuel objet personnel implicite. « Élève donc une prière » améliore l’idiomaticité sans perdre l’image de l’hébreu. Les appels de notes restent placés sur les éléments qu’ils expliquent.
