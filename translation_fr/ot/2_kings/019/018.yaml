  text: וְ/נָתְנ֥וּ אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/018.yaml
  text: and they have cast their gods into the fire[a], for they were not gods, but the work of human hands, wood and stone; therefore they destroyed them.
translation:
  language: fr
  text: et ils ont jeté leurs dieux au feu[a], car ce n’étaient pas des dieux, mais des objets fabriqués par des mains humaines, en bois et en pierre ; c’est pourquoi ils les ont détruits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ont mis leurs dieux dans le feu ». Le verbe hébreu signifie littéralement « donner, mettre » ; il a ici le sens de jeter quelque chose au feu.'
    reason: Alternative lexicale reflétant le sens fondamental du verbe hébreu et la nuance entre mise et projection.
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: et ils ont jeté
  rationale: נתן signifie fondamentalement « donner, mettre », mais avec « au feu » il exprime ici l’action d’y jeter ou d’y livrer quelque chose. « Jeter au feu » est naturel en français moderne et convient au contexte de destruction.
- source_word: אֱלֹהֵיהֶם
  choice: leurs dieux
  rationale: Le texte désigne d’abord ces objets selon la prétention des nations, avant de nier explicitement qu’ils soient réellement des dieux. « Idoles » atténuerait cet effet rhétorique.
- source_word: בָּאֵשׁ
  choice: au feu
  rationale: Avec le verbe de mouvement « jeter », « au feu » rend idiomatiquement la destination exprimée par l’hébreu.
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: car ce n’étaient pas des dieux
  rationale: La proposition explique pourquoi ces objets pouvaient être détruits. L’imparfait s’intègre au cadre passé du récit tout en conservant la négation de leur divinité réelle.
- source_word: כִּי אִם
  choice: mais
  rationale: 'La locution introduit un contraste correctif fort : non pas des dieux, mais des objets fabriqués.'
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: des ouvrages faits de main humaine
  rationale: Cette formulation souligne leur fabrication par des êtres humains et maintient le contraste avec le Dieu vivant. Le pluriel s’accorde naturellement avec les objets évoqués.
- source_word: עֵץ וָאֶבֶן
  choice: du bois et de la pierre
  rationale: La formule nomme simplement les matériaux dont étaient faits ces prétendus dieux.
- source_word: וַיְאַבְּדוּם
  choice: c’est pourquoi ils les ont détruits
  rationale: 'La forme est comprise transitivement : les envahisseurs ont détruit ces objets. « C’est pourquoi » explicite en français le rapport de conséquence avec leur nature matérielle, sans changer le référent du pronom.'
theological_decisions:
- issue: Négation de la divinité des objets appelés « leurs dieux »
  choice: leurs dieux… ce n’étaient pas des dieux
  alternative: leurs idoles
  rationale: 'Conserver « dieux » dans les deux membres préserve la tension rhétorique de l’hébreu : ce que les nations appelaient leurs dieux n’avait aucune divinité réelle.'
- issue: Sens générique de אָדָם dans l’expression de fabrication
  choice: de main humaine
  alternative: de la main de l’homme
  rationale: אָדָם désigne ici l’être humain en général, non un homme particulier. « Humaine » exprime clairement ce sens générique et le contraste théologique entre le Créateur vivant et les objets fabriqués.
translation_notes:
  register: Français international moderne, digne et accessible. La conjonction initiale « et » est conservée parce que le verset poursuit la phrase et la prière du contexte. Le point-virgule maintient le lien étroit entre la nature matérielle des objets et leur destruction.
