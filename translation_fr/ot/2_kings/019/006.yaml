source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹֽנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֗עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶֽלֶךְ אַשּׁ֖וּר אֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/006.yaml
  text: 'Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: fr
  text: 'Ésaïe leur dit : « Vous direz ceci à votre maître : Voici ce que dit Yahweh : “Ne crains pas à cause des paroles que tu as entendues, celles par lesquelles les serviteurs[a] du roi d’Assyrie ont blasphémé contre moi.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les jeunes gens du roi d’Assyrie ». Le terme hébreu peut désigner des jeunes hommes, mais il renvoie probablement ici à des agents ou à des dignitaires royaux.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le passé simple convient au récit français soutenu et rend naturellement le wayyiqtol narratif de אמר.
- source_word: אֲדֹנֵיכֶם
  choice: votre maître
  rationale: Le terme désigne ici Ézéchias comme supérieur des envoyés et évite de confondre cet emploi humain avec un titre divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin conformément à la politique du projet.
- source_word: אַל תִּירָא
  choice: Ne crains pas
  rationale: Rend avec concision et dignité la défense à valeur rassurante.
- source_word: מִפְּנֵי הַדְּבָרִים
  choice: les paroles
  rationale: Dans ce contexte, דְּבָרִים désigne les propos menaçants entendus; la construction française avec « craindre » n’exige pas de rendre séparément la préposition causale.
- source_word: שָׁמַעְתָּ
  choice: tu as entendues
  rationale: Le passé composé exprime une action achevée dont les effets demeurent présents.
- source_word: גִּדְּפוּ
  choice: ont blasphémé contre
  rationale: Le verbe décrit ici des paroles outrageant Dieu; cette formulation conserve leur gravité religieuse en français naturel.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: les serviteurs du roi d’Assyrie
  rationale: Dans ce cadre royal, נְעָרִים désigne vraisemblablement des agents, serviteurs ou dignitaires du roi, plutôt que de simples jeunes hommes.
- source_word: אֹתִי
  choice: moi
  rationale: Maintient explicitement Yahweh comme cible personnelle du blasphème.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le Tétragramme; sa transcription préserve le nom personnel d’alliance sans le remplacer par un titre.
- issue: Force de גִּדְּפוּ lorsque Dieu en est l’objet
  choice: ont blasphémé contre moi
  alternative: m’ont outragé
  rationale: « Blasphémé » exprime clairement la portée sacrilège des propos, tandis que « contre moi » donne une construction française idiomatique et conserve Dieu comme cible explicite.
translation_notes:
  register: Français international moderne, sobre et digne. Le discours direct imbriqué est ponctué pour distinguer les paroles d’Ésaïe de l’oracle de Yahweh. Le tutoiement singulier correspond à l’adresse faite à Ézéchias.
