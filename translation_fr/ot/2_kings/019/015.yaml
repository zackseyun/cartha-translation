  text: וַ/יִּתְפַּלֵּ֨ל חִזְקִיָּ֜הוּ לִ/פְנֵ֣י יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/015.yaml
  text: And Hezekiah prayed before Yahweh and said[a], “Yahweh, God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.”
translation:
  language: fr
  text: 'Ézéchias pria devant Yahweh et dit : « Yahweh, Dieu d’Israël, toi qui trônes au-dessus des chérubins[a], toi seul, tu es Dieu sur tous les royaumes de la terre. C’est toi qui as fait les cieux et la terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toi qui sièges sur les chérubins ». L’hébreu dit littéralement « siégeant/assis, les chérubins », sans préciser de relation spatiale ; dans ce contexte cultuel et royal, l’expression évoque l’intronisation de Yahweh en lien avec les chérubins.'
    reason: Alternative lexicale et préservation de l’absence de préposition spatiale explicite dans l’hébreu.
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: pria
  rationale: Le verbe signifie directement « prier » ; le passé simple convient au récit biblique français sans ajouter l’idée plus précise d’intercession.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » conserve le sens relationnel et spatial de לִפְנֵי, c’est-à-dire une prière offerte en présence de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Dieu d’Israël
  rationale: Cette formulation française directe respecte la construction hébraïque et convient à l’interpellation de la prière.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: toi qui sièges au-dessus des chérubins
  rationale: « Siéger » exprime naturellement l’image royale du participe יֹשֵׁב ; « au-dessus » correspond à la représentation cultuelle de Yahweh intronisé sur l’arche, sans introduire « entre », absent de l’hébreu.
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: toi seul, tu es Dieu
  rationale: La tournure conserve l’insistance du pronom אַתָּה et la force exclusive de לְבַדְּךָ dans un français naturel.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: sur tous les royaumes de la terre
  rationale: « Sur » rend clairement la souveraineté universelle affirmée ici, tout en restant idiomatique en français.
- source_word: עָשִׂיתָ
  choice: as fait
  rationale: « Faire » est l’équivalent direct de עָשָׂה et évite d’importer le vocabulaire plus spécifique de « créer ».
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: le ciel et la terre
  rationale: « Le ciel et la terre » est la formule française courante et naturelle pour cette totalité créée, bien que שָׁמַיִם ait une forme plurielle en hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin ; le conserver rend visible l’adresse personnelle de la prière sans le remplacer par un titre.
- issue: Exclusivité divine et souveraineté universelle
  choice: toi seul, tu es Dieu sur tous les royaumes de la terre
  alternative: tu es le Dieu, toi seul, pour tous les royaumes de la terre
  rationale: La formulation retenue exprime à la fois l’exclusivité marquée par לְבַדְּךָ et la relation de souveraineté envers tous les royaumes, sans développer l’affirmation au-delà du texte.
- issue: Image de Yahweh et des chérubins
  choice: toi qui sièges au-dessus des chérubins
  alternative: toi qui demeures parmi les chérubins
  rationale: Le contexte royal et cultuel favorise l’idée d’intronisation, mais la note maintient ouverte la portée spatiale du participe et de la construction hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif ; la prière emploie une syntaxe solennelle mais accessible. La reprise « toi… toi seul » préserve l’emphase hébraïque sans lourdeur excessive.
