  text: וַ/יִּשְׁמַ֗ע אֶל תִּרְהָ֤קָה מֶֽלֶך כּוּשׁ֙ לֵ/אמֹ֔ר הִנֵּ֥ה יָצָ֖א לְ/הִלָּחֵ֣ם אִתָּ֑/ךְ וַ/יָּ֨שָׁב֙ וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים אֶל חִזְקִיָּ֖הוּ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/009.yaml
  text: When he heard concerning Tirhakah king of Cush[a], saying, “Look, he has come out to fight against you,” he turned back and sent messengers to Hezekiah, saying,
translation:
  language: fr
  text: 'Quand il apprit au sujet de Tirhaqa, roi de Koush[a], qu’on disait : « Voici qu’il est sorti pour te combattre », il envoya de nouveau des messagers à Ézéchias, en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « roi d’Éthiopie ». L’hébreu porte « Koush », ancienne région située au sud de l’Égypte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: Quand il apprit, au sujet de
  rationale: La construction fait progresser le récit et introduit la nouvelle reçue. « Quand il apprit » exprime naturellement la relation temporelle, tandis que « au sujet de » respecte la préposition אֶל.
- source_word: תִּרְהָקָה
  choice: Tirhaqa
  rationale: Translittération française usuelle du nom propre.
- source_word: מֶלֶךְ כּוּשׁ
  choice: roi de Koush
  rationale: Conserve le toponyme hébreu plutôt que de l’identifier directement à l’Éthiopie moderne.
- source_word: לֵאמֹר ... הִנֵּה
  choice: « Le voici
  rationale: La ponctuation introduit directement le contenu de la nouvelle, et « voici » rend avec dignité et naturel la particule d’attention הִנֵּה.
- source_word: יָצָא לְהִלָּחֵם אִתָּךְ
  choice: qui est sorti pour te combattre
  rationale: Rend directement le mouvement exprimé par יָצָא, le but de l’action et la valeur hostile de אִתָּךְ dans ce contexte militaire.
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: il envoya de nouveau
  rationale: Dans cette construction, שׁוב suivi d’un autre verbe peut exprimer la répétition de l’action (« il recommença à envoyer »), ce qui convient au contexte immédiat et évite d’imposer un déplacement physique non explicité.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Le contexte diplomatique et militaire désigne ici des envoyés humains.
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française biblique établie du nom du roi.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Préserve la formule hébraïque qui introduit les paroles développées au verset suivant.
