revisions:
- from: Le reste de la maison de Juda qui aura survécu[a] poussera de nouveau des racines vers le bas et portera du fruit vers le haut.
  to: Le reste survivant de la maison de Juda s’enracinera de nouveau en profondeur et portera du fruit en hauteur.
  rationale: La révision évite le futur antérieur non requis, préserve la nuance cumulative de « reste survivant » et emploie des expressions françaises idiomatiques pour l’enracinement et l’orientation contrastée des racines et du fruit. La note conserve l’alternative lexicale signalée dans la piste d’audit anglaise.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:16:09Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens global et l’imagerie végétale sont fidèlement rendus. Toutefois, « qui aura survécu » transforme inutilement le participe hébreu הנשארה (« qui reste / subsistant ») en futur antérieur et suggère une antériorité temporelle que le texte ne marque pas. « Reste survivant » rend plus directement la double expression פליטת ... הנשארה.
  naturalness: « Poussera de nouveau des racines vers le bas » est compréhensible, mais « s’enracinera de nouveau en profondeur » est plus idiomatique dans un français moderne tout en gardant l’opposition verticale avec « en hauteur ».
  terminology: « Maison de Juda » est bien conservé. « Reste survivant » maintient à la fois le motif du reste et l’idée de survivants, sans surinterprétation théologique. « Porter du fruit » est le collocatif français approprié.
  issues:
  - severity: medium
    issue: Temps et valeur de « qui aura survécu »
    rationale: Le futur antérieur introduit une relation temporelle achevée qui n’est pas exprimée par le participe hébreu. Le qualificatif désigne le reste qui demeure, tandis que le verbe principal annonce sa reprise de croissance.
  - severity: low
    issue: Formulation de l’alternative en note
    rationale: « Les rescapés qui resteront » ajoute également un futur inutile. Une alternative au présent qualificatif reflète mieux la construction hébraïque.
  revised_text: Le reste survivant de la maison de Juda s’enracinera de nouveau en profondeur et portera du fruit en hauteur.
  revised_footnotes:
  - marker: a
    text: 'Autre traduction : « les rescapés de la maison de Juda qui restent ».'
    reason: Le texte hébreu associe un terme désignant les rescapés à un participe signifiant « qui reste » ; cette formulation met davantage en évidence les deux éléments.
  revision_rationale: La révision évite le futur antérieur non requis, préserve la nuance cumulative de « reste survivant » et emploie des expressions françaises idiomatiques pour l’enracinement et l’orientation contrastée des racines et du fruit. La note conserve l’alternative lexicale signalée dans la piste d’audit anglaise.
