  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: fr
  text: Le reste survivant de la maison de Juda s’enracinera de nouveau en profondeur et portera du fruit en hauteur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָסְפָה
  choice: poussera de nouveau
  rationale: Le verbe יסף marque ici la reprise ou le renouvellement de l’action. « De nouveau » exprime naturellement la restauration annoncée.
- source_word: פְּלֵיטַת
  choice: le reste
  rationale: Le nom désigne collectivement ceux qui ont échappé au désastre. « Le reste » conserve le motif biblique du peuple préservé, tandis que la proposition « qui aura survécu » explicite sa dimension concrète.
- source_word: בֵּית יְהוּדָה
  choice: de la maison de Juda
  rationale: Cette formulation garde l’expression historique et collective du texte hébreu plutôt que de la réduire à « Juda ».
- source_word: הַנִּשְׁאָרָה
  choice: qui aura survécu
  rationale: Le participe qualifie ce reste comme ce qui demeure après la catastrophe. Le futur antérieur convient en français pour une survie antérieure à la croissance annoncée.
- source_word: שֹׁרֶשׁ
  choice: poussera … des racines
  rationale: L’hébreu emploie l’image de l’enracinement. Cette tournure française conserve l’image concrète et s’accorde avec l’indication de direction.
- source_word: לְמָטָּה
  choice: vers le bas
  rationale: La traduction maintient l’orientation spatiale et son contraste poétique avec « vers le haut ».
- source_word: וְעָשָׂה פְרִי
  choice: et portera du fruit
  rationale: « Porter du fruit » est l’équivalent idiomatique naturel de l’expression hébraïque et préserve la métaphore agricole.
- source_word: לְמָעְלָה
  choice: vers le haut
  rationale: Cette formulation reproduit le parallélisme vertical avec les racines dirigées « vers le bas ».
theological_decisions:
- issue: Le langage du reste dans une annonce de restauration
  choice: le reste de la maison de Juda qui aura survécu
  alternative: les survivants de la maison de Juda qui resteront
  rationale: La formulation choisie conserve à la fois le motif collectif du « reste » et la réalité de la survie après le jugement, sans tirer de conclusion doctrinale au-delà du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme imagé entre les racines dirigées vers le bas et le fruit porté vers le haut est conservé.
