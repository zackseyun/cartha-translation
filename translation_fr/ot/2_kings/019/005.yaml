  text: So the servants of King Hezekiah came to Isaiah.
translation:
  language: fr
  text: Les serviteurs du roi Ézéchias vinrent alors auprès d’Ésaïe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vinrent donc
  rationale: Le wayyiqtol de בוא fait avancer le récit. « Vinrent » rend le mouvement vers Ésaïe, et « donc » exprime naturellement l’enchaînement avec l’ordre donné au verset précédent sans imposer une causalité forte.
- source_word: עַבְדֵי
  choice: les serviteurs de
  rationale: Le pluriel construit de עבד peut désigner des serviteurs, des membres de l’entourage royal ou des fonctionnaires. « Serviteurs » préserve le terme source sans préciser davantage leur fonction.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: du roi Ézéchias
  rationale: Cette formulation française naturelle conserve le titre royal et le nom propre.
- source_word: אֶל
  choice: auprès de
  rationale: La préposition indique ici un déplacement vers une personne. « Auprès de » rend idiomatiquement le fait qu’ils se présentent à Ésaïe.
- source_word: יְשַׁעְיָהוּ
  choice: Ésaïe
  rationale: Forme française traditionnelle et largement reconnue du nom du prophète.
