  text: וְ/זֶה לְּ/ךָ֣ הָ/א֔וֹת אָכ֤וֹל הַ/שָּׁנָה֙ סָפִ֔יחַ וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית סָחִ֑ישׁ וּ/בַ/שָּׁנָ֣ה הַ/שְּׁלִישִׁ֗ית זִרְע֧וּ וְ/קִצְר֛וּ וְ/נִטְע֥וּ כְרָמִ֖ים וְ/אִכְל֥וּ פִרְיָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/029.yaml
  text: 'And this shall be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; and in the third year sow and reap[b], and plant vineyards and eat their fruit.'
translation:
  language: fr
  text: 'Voici le signe pour toi : cette année, mangez ce qui pousse tout seul[a] ; la deuxième année, ce qui en repoussera[b] ; la troisième année, semez et moissonnez, plantez des vignes et mangez-en les fruits.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire ce qui pousse sans avoir été semé.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu est rare. Il peut désigner une « deuxième pousse », une production spontanée de la deuxième année liée à celle de l’année précédente.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: le signe
  rationale: אוֹת désigne couramment un signe qui confirme une parole ou une promesse ; « le signe » est naturel dans ce contexte prophétique.
- source_word: לְךָ
  choice: qui t’est donné
  rationale: Le pronom est au singulier et vise Ézéchias. Cette formulation française rend naturellement « pour toi » tout en conservant le changement ultérieur vers les impératifs pluriels adressés au peuple.
- source_word: אָכוֹל
  choice: mangez
  rationale: L’infinitif absolu a ici une valeur injonctive ou prédictive. Le pluriel français s’accorde avec les impératifs pluriels explicites de la troisième année et comprend la population concernée.
- source_word: סָפִיחַ
  choice: ce qui pousse tout seul
  rationale: Le nom désigne une production spontanée, sans semailles. Cette expression est claire et non technique en français moderne.
- source_word: סָחִישׁ
  choice: ce qui en repoussera
  rationale: Ce terme rare semble désigner la pousse spontanée de la deuxième année provenant de la production précédente. La formulation garde ce lien tout en signalant implicitement l’incertitude lexicale.
- source_word: זִרְעוּ וְקִצְרוּ
  choice: semez et moissonnez
  rationale: Les deux impératifs pluriels décrivent directement la reprise normale des travaux agricoles.
- source_word: וְנִטְעוּ כְרָמִים
  choice: plantez des vignes
  rationale: כְרָמִים peut désigner des vignobles ; en français, « planter des vignes » est l’expression agricole la plus naturelle.
- source_word: וְאִכְלוּ פִרְיָם
  choice: mangez-en les fruits
  rationale: Le suffixe pluriel renvoie naturellement aux vignes ou vignobles. « En » évite une lourdeur et conserve le sens littéral de la consommation de leurs fruits.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le singulier de « t’est donné » conserve l’adresse à Ézéchias, tandis que les impératifs pluriels rendent les formes hébraïques qui concernent la collectivité. Les coordinations restent additives, sans introduire un contraste absent de l’hébreu.
