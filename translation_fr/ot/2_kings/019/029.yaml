  verdict: revise
  source_fidelity: Le sens agricole et la succession des trois années sont fidèlement rendus. Toutefois, « qui t’est donné » ajoute légèrement l’idée de don, absente de לְךָ (« pour toi »). « Voici le signe pour toi » restitue plus directement la formule hébraïque. La formulation du second produit conserve à juste titre la difficulté du rare סָחִישׁ.
  naturalness: Le français est clair et de registre moderne. Les impératifs pluriels sont naturels dans la perspective de la population concernée, malgré l’adresse initiale au singulier à Ézéchias. « Mangez-en les fruits » est idiomatique.
  terminology: « Signe », « pousse tout seul », « semez », « moissonnez » et « plantez des vignes » sont appropriés. La note sur סָחִישׁ doit exprimer l’incertitude sans présenter comme certaine une origine précise dans une « récolte » antérieure.
