reference: 2 Kings 19:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִי֩ ה֨וּא מִֽשְׁתַּחֲוֶ֜ה בֵּ֣ית נִסְרֹ֣ךְ אֱלֹהָ֗י/ו וְֽ/אַדְרַמֶּ֨לֶךְ וְ/שַׂרְאֶ֤צֶר הִכֻּ֣/הוּ בַ/חֶ֔רֶב וְ/הֵ֥מָּה נִמְלְט֖וּ אֶ֣רֶץ אֲרָרָ֑ט וַ/יִּמְלֹ֛ךְ אֵֽסַר חַדֹּ֥ן בְּנ֖/וֹ תַּחְתָּֽי/ו׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/037.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisrok his god, Adrammelek and Sharezer struck him down with the sword, and they escaped to the land of Ararat. And Esar-haddon his son reigned in his place.
translation:
  language: fr
  text: Il arriva que, tandis qu’il se prosternait dans le temple de Nisrok[a], son dieu, Adrammélek et Saréser le frappèrent de l’épée. Ils s’enfuirent ensuite au pays d’Ararat, et son fils Ésar-Haddon régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nisrok : nom selon le texte hébreu; traditionnellement « Nisroch ».'
    reason: Variante traditionnelle de translittération du nom divin.
lexical_decisions:
- source_word: וַיְהִי
  choice: Il arriva que
  rationale: Cette formule rend la fonction narrative de וַיְהִי dans un français actuel et soutenu, sans recourir à la tournure archaïque « il advint que ».
- source_word: מִשְׁתַּחֲוֶה
  choice: se prosternait
  rationale: Le hitpael de שׁחה décrit ici un geste cultuel. « Se prosternait » conserve à la fois le geste concret et sa portée d’adoration.
- source_word: בֵּית
  choice: dans le temple de
  rationale: Littéralement « maison de », mais, devant le nom d’un dieu, le mot désigne son sanctuaire. « Temple » est donc l’équivalent naturel et précis en français.
- source_word: נִסְרֹךְ
  choice: Nisrok
  rationale: Translittération proche de la forme vocalisée du texte hébreu; la graphie traditionnelle « Nisroch » est signalée en note.
- source_word: אֱלֹהָיו
  choice: son dieu
  rationale: Le nom au singulier avec suffixe masculin singulier désigne simplement le dieu de Sennachérib.
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: le frappèrent de l’épée
  rationale: Cette formulation conserve l’image verbale de נכה et la mention explicite de l’arme; le contexte de succession indique clairement que le coup fut mortel.
- source_word: נִמְלְטוּ
  choice: s’enfuirent
  rationale: Le nifal de מלט exprime ici une fuite réussie après l’assassinat. « S’enfuirent » est naturel dans ce récit.
- source_word: אֶרֶץ אֲרָרָט
  choice: au pays d’Ararat
  rationale: Rend directement le groupe construit et sa fonction de destination géographique.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans un récit de succession royale, מלך indique que le fils accède au règne; la suite « à sa place » rend la succession explicite.
- source_word: אֵסַר חַדֹּן
  choice: Ésar-Haddon
  rationale: Forme française lisible du nom royal, avec trait d’union pour refléter ses deux éléments dans le texte hébreu.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Cette expression idiomatique rend précisément la succession dynastique indiquée par le terme hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de la progression hébraïque tout en évitant les calques lourds. « Se prosternait » préserve le geste cultuel concret, tandis que « temple » explicite naturellement le sens contextuel de « maison ».
