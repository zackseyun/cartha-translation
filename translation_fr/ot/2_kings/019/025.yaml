  text: הֲ/לֹֽא שָׁמַ֤עְתָּ לְ/מֵֽ/רָחוֹק֙ אֹתָ֣/הּ עָשִׂ֔יתִי לְ/מִ֥/ימֵי קֶ֖דֶם וִֽ/יצַרְתִּ֑י/הָ עַתָּ֣ה הֲבֵיאתִ֗י/הָ וּ/תְהִ֗י לַ/הְשׁ֛וֹת גַּלִּ֥ים נִצִּ֖ים עָרִ֥ים בְּצֻרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/025.yaml
  text: Have you not heard? Long ago I made it[a]; from days of old I formed it. Now I have brought it to pass[c][b], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: fr
  text: N’as-tu pas entendu ? Il y a longtemps[a], j’ai fait cela ; dès les temps anciens, je l’ai façonné. Maintenant, je l’ai fait arriver, de sorte que tu réduises des villes fortifiées en monceaux de ruines[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de loin » ; l’expression hébraïque peut avoir un sens spatial, mais le parallèle avec « dès les temps anciens » favorise ici le sens temporel.
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque difficile ; on pourrait aussi traduire « en amas dévastés » ou, plus littéralement, « en monceaux dressés ».
    reason: textual_difficulty
lexical_decisions:
- source_word: הֲלֹא שָׁמַעְתָּ
  choice: N’as-tu pas entendu
  rationale: La tournure conserve la question rhétorique, qui appelle une réponse affirmative, dans un français naturel.
- source_word: לְמֵרָחוֹק
  choice: depuis longtemps
  rationale: L’expression signifie littéralement « de loin », mais son parallélisme avec « dès les jours anciens » favorise ici un sens temporel.
- source_word: אֹתָהּ עָשִׂיתִי
  choice: j’ai fait cela
  rationale: « Cela » rend le pronom féminin sans imposer un antécédent précis que l’hébreu laisse implicite; « fait » garde la portée large de עשה.
- source_word: לְמִימֵי קֶדֶם
  choice: dès les jours anciens
  rationale: Cette formulation exprime l’ancienneté du dessein tout en conservant la couleur temporelle de l’expression hébraïque.
- source_word: וִיצַרְתִּיהָ
  choice: je l’ai façonné
  rationale: Le verbe יצר évoque l’action de former ou de façonner; le pronom français reprend naturellement « cela ».
- source_word: עַתָּה הֲבֵיאתִיהָ
  choice: Maintenant, je le fais arriver
  rationale: La formulation garde l’image hébraïque de « faire venir » tout en exprimant la réalisation présente de ce qui avait été façonné autrefois.
- source_word: וּתְהִי לַהְשׁוֹת
  choice: tu réduis ainsi
  rationale: La forme peut exprimer le résultat ou le but concernant le roi assyrien. « Ainsi » relie sa dévastation à l’action divine énoncée juste avant sans surdéterminer la nuance grammaticale.
- source_word: עָרִים בְּצֻרוֹת
  choice: des villes fortifiées
  rationale: Rendu direct et idiomatique du groupe nominal hébreu.
- source_word: גַּלִּים נִצִּים
  choice: monceaux de ruines
  rationale: L’expression hébraïque est difficile, mais elle décrit vraisemblablement les amas laissés par la destruction des villes; cette formulation en transmet clairement l’image.
theological_decisions:
- issue: La souveraineté divine et les conquêtes assyriennes
  choice: Le texte présente les succès destructeurs du roi assyrien comme la réalisation actuelle de ce que Dieu avait établi depuis longtemps.
  alternative: Atténuer le propos en simple prescience divine, ou au contraire lui faire affirmer explicitement une théorie exhaustive de la causalité.
  rationale: Les verbes « faire », « façonner » et « faire arriver » affirment fortement l’initiative souveraine de Dieu, sans pour autant déclarer moralement bonnes les violences assyriennes ni préciser davantage leur rapport philosophique à l’action humaine.
- issue: Valeur de וּתְהִי
  choice: La relation est rendue comme un résultat par « ainsi ».
  alternative: 'Traduire explicitement le but par « afin que tu réduises » ou conserver une coordination plus littérale : « et tu as réduit ».'
  rationale: La forme hébraïque permet une nuance de but ou de résultat. « Ainsi » préserve ce lien sans trancher plus nettement que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du parallélisme hébreu, tandis que « cela », « le fais arriver » et « ainsi » évitent d’expliciter au-delà du texte le contenu du dessein et la nuance exacte de but ou de résultat.
