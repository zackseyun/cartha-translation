revisions:
- from: 'N’as-tu pas entendu que, depuis longtemps[a], j’ai fait cela ? Dès les jours anciens, je l’ai façonné. Maintenant, je le fais arriver : tu réduis ainsi des villes fortifiées en monceaux de ruines[b].'
  to: N’as-tu pas entendu ? Il y a longtemps[a], j’ai fait cela ; dès les temps anciens, je l’ai façonné. Maintenant, je l’ai fait arriver, de sorte que tu réduises des villes fortifiées en monceaux de ruines[b].
  rationale: La révision restitue le parfait de « j’ai fait arriver », remplace une tournure temporelle un peu littérale par un français plus idiomatique, et rend le rapport entre l’accomplissement divin et l’action du roi comme conséquence/dessein sans trancher indûment l’ambiguïté de la construction hébraïque.
