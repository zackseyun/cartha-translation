  text: וַ/יִּשְׁלַח֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֶל חִזְקִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֨ר הִתְפַּלַּ֧לְתָּ אֵלַ֛/י אֶל סַנְחֵרִ֥ב מֶֽלֶךְ אַשּׁ֖וּר שָׁמָֽעְתִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/020.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah, saying, “Thus says the LORD, the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria, I have heard.”'
translation:
  language: fr
  text: 'Alors Ésaïe, fils d’Amots, envoya dire à Ézéchias : « Voici ce que dit le Seigneur, le Dieu d’Israël : J’ai entendu la prière que tu m’as adressée au sujet de Sennachérib, roi d’Assyrie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל חִזְקִיָּהוּ לֵאמֹר
  choice: envoya dire à Ézéchias
  rationale: Cette tournure française naturelle exprime l’envoi d’un message à Ézéchias sans ajouter de messager absent du texte.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit le Seigneur
  rationale: Formule prophétique idiomatique et digne; « le Seigneur » rend le tétragramme selon l’usage courant des traductions françaises.
- source_word: אֲשֶׁר הִתְפַּלַּלְתָּ אֵלַי ... שָׁמָעְתִּי
  choice: J’ai entendu la prière que tu m’as adressée
  rationale: Le relatif אֲשֶׁר rattache l’acte de prier à « j’ai entendu ». Cette formulation restitue naturellement en français l’objet sous-entendu de « j’ai entendu », sans imposer une valeur causale certaine.
- source_word: אֶל סַנְחֵרִב
  choice: au sujet de Sennachérib
  rationale: Dans ce contexte, אֶל indique ce sur quoi porte la prière, et non son destinataire.
theological_decisions:
- issue: Valeur de אֲשֶׁר avant « tu as prié »
  choice: 'Construction relative : « la prière que tu m’as adressée »'
  alternative: 'Construction causale : « Parce que tu m’as prié »'
  rationale: אֲשֶׁר est formellement relatif et peut introduire le contenu entendu; la formulation retenue préserve ce lien syntaxique sans faire de la prière la cause méritoire de la réponse divine.
translation_notes:
  register: 'Français international moderne, clair et soutenu. Les noms propres suivent les formes françaises bibliques courantes : Ésaïe, Amots, Ézéchias, Sennachérib.'
