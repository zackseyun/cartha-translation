  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּךְ֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה שְׁמוֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/035.yaml
  text: And that night the angel of Yahweh went out and struck down one hundred eighty-five thousand in the camp of Assyria. When people rose early in the morning, behold, all of them were dead bodies.
translation:
  language: fr
  text: Cette nuit-là, l’ange de Yahweh sortit et frappa cent quatre-vingt-cinq mille personnes dans le camp d’Assyrie. Quand on se leva de bon matin[a], voici qu’ils étaient tous des cadavres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils se levèrent de bon matin ». L’hébreu ne précise pas qui accomplit cette action.'
    reason: Préserver l’indétermination du sujet hébreu.
  - marker: b
    text: 'L’hébreu dit littéralement : « des cadavres morts », expression qui souligne avec force qu’ils étaient morts.'
    reason: Signaler l’expression hébraïque emphatique que le français idiomatique ne reproduit pas mot à mot.
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Cette nuit-là
  rationale: La formule narrative « et il arriva » peut être naturellement condensée en français moderne sans perdre le lien temporel.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ désigne ici un agent surnaturel; « ange » convient au contexte. Le nom divin est transcrit « Yahweh ».
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Rend directement le verbe יצא tout en conservant la progression narrative.
- source_word: וַיַּךְ
  choice: frappa
  rationale: Le verbe נכה signifie « frapper » et le contexte ainsi que la proposition finale rendent manifeste l’issue mortelle, sans qu’il soit nécessaire de l’expliciter deux fois.
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: dans le camp d’Assyrie
  rationale: Reproduction naturelle et proche de la construction hébraïque; « Assyrie » désigne ici par métonymie les forces assyriennes.
- source_word: מֵאָה שְׁמוֹנִים וַחֲמִשָּׁה אָלֶף
  choice: cent quatre-vingt-cinq mille hommes
  rationale: Le nombre est rendu directement. « hommes » précise naturellement en français les personnes comptées dans le camp, sans identifier davantage le groupe.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Quand on se leva de bon matin
  rationale: Le sujet de la troisième personne du pluriel n’est pas identifié en hébreu. Le pronom indéfini « on » conserve cette indétermination mieux qu’un référent ajouté.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure française actuelle conserve la fonction de הִנֵּה, qui attire l’attention sur une découverte saisissante.
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: ils étaient tous des cadavres
  rationale: « Cadavres » exprime naturellement le sens de פְּגָרִים מֵתִים; « tous » préserve la portée totalisante de כֻלָּם.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme; la transcription « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Nature de מַלְאַךְ יהוה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Dans ce récit d’intervention surnaturelle et de jugement, « ange » est le sens contextuel naturel, sans préciser davantage son identité théologique.
translation_notes:
  register: Français international moderne, narratif et digne. « De bon matin » conserve l’idée de lever matinal; « voici que » garde le relief rhétorique sans recourir à l’archaïsme « voici » isolé. Les notes rendent visibles l’indétermination du sujet et l’emphase de l’hébreu.
