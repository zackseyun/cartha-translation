base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/027.yaml
  text: But I know your sitting down[a], your going out, and your coming in[b], and your raging against me.
translation:
  language: fr
  text: Je sais quand tu t’assieds, quand tu sors et quand tu entres[a], et je connais ta fureur contre moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le fait que tu t’assieds, que tu sors et que tu entres ». Cette expression évoque l’ensemble des mouvements et de la conduite d’une personne.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « ton agitation contre moi » ou « ton emportement contre moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: quand tu t’assieds
  rationale: Le terme vient de ישׁב et désigne littéralement le fait de s’asseoir ou de demeurer. Avec « quand tu sors et quand tu rentres », la formulation concrète conserve l’image hébraïque tout en restant naturelle en français.
- source_word: וְצֵאתְךָ
  choice: quand tu sors
  rationale: Le terme vient de יצא et forme avec בוא l’expression complémentaire « sortir et rentrer ». La tournure verbale est idiomatique en français moderne.
- source_word: וּבֹאֲךָ
  choice: quand tu rentres
  rationale: Le terme vient de בוא. « Rentrer » rend naturellement le mouvement opposé à « sortir » et convient mieux ici que le plus abstrait « entrée ».
- source_word: יָדָעְתִּי
  choice: Je sais / je connais
  rationale: Le parfait qal de ידע exprime ici la connaissance certaine et complète de Dieu. Le présent français en restitue la portée; « connais » est repris devant le dernier complément pour assurer la clarté syntaxique.
- source_word: הִתְרַגֶּזְךָ
  choice: ta fureur
  rationale: La forme issue de רגז au hitpael peut désigner l’agitation, l’emportement ou la fureur. Dans ce contexte d’hostilité envers Dieu, « fureur » transmet la force du terme sans lui ajouter la notion distincte d’insolence.
- source_word: אֵלָי
  choice: contre moi
  rationale: Bien que אֶל signifie couramment « vers », l’émotion hostile exprimée ici appelle en français la relation adversative « contre moi ».
- source_word: וְאֵת
  choice: et je connais
  rationale: La conjonction et le marqueur d’objet introduisent un autre complément de יָדָעְתִּי. La répétition du verbe en français clarifie la construction sans modifier le sens.
