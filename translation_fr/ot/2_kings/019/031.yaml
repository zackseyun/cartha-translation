source:
  edition: WLC
  text: כִּ֤י מִ/ירוּשָׁלִַ֨ם֙ תֵּצֵ֣א שְׁאֵרִ֔ית וּ/פְלֵיטָ֖ה מֵ/הַ֣ר צִיּ֑וֹן קִנְאַ֛ת יְהוָ֥ה תַּֽעֲשֶׂה זֹּֽאת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/031.yaml
  text: For from Jerusalem a remnant will go out[a], and from Mount Zion survivors. The zeal of Yahweh will do this.
translation:
  language: fr
  text: Car de Jérusalem sortira un reste, et du mont Sion des survivants. Le zèle[a] de Yahweh accomplira cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La jalousie de Yahweh ». Le nom hébreu peut signifier « zèle » ou « jalousie » ; ici, il exprime l’engagement ardent de Yahweh à délivrer Jérusalem.'
    reason: Alternative lexicale préservant la polysémie du terme hébreu.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici le fondement ou l’assurance de la promesse précédente ; « Car » rend naturellement ce lien logique.
- source_word: מִירוּשָׁלִַם תֵּצֵא שְׁאֵרִית
  choice: de Jérusalem sortira un reste
  rationale: La préposition marque l’origine, et le futur « sortira » conserve l’image de mouvement ainsi que l’accord avec le nom singulier « reste ».
- source_word: וּפְלֵיטָה מֵהַר צִיּוֹן
  choice: et du mont Sion des survivants
  rationale: « Survivants » désigne les personnes ayant échappé au désastre. La tournure elliptique conserve le parallélisme hébreu avec la première proposition.
- source_word: קִנְאַת
  choice: Le zèle
  rationale: Le nom peut exprimer le zèle ou la jalousie. Dans ce contexte, « zèle » évoque l’engagement ardent de Dieu à réaliser la délivrance, sans effacer l’autre nuance, signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver sa valeur de nom propre plutôt que de lui substituer un titre.
- source_word: תַּעֲשֶׂה זֹּאת
  choice: accomplira cela
  rationale: Le verbe exprime ici la réalisation effective de ce qui vient d’être annoncé ; « accomplira » est naturel en français et convient au registre prophétique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme, traité ici comme le nom personnel du Dieu d’Israël.
- issue: Nuance de קִנְאַת יְהוָה
  choice: Le zèle de Yahweh
  alternative: La jalousie de Yahweh
  rationale: Le contexte met au premier plan l’ardeur avec laquelle Yahweh accomplira la délivrance, mais le terme hébreu permet aussi la nuance de jalousie ; celle-ci est donc conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme concis de l’hébreu est maintenu, y compris l’ellipse verbale dans le second membre.
