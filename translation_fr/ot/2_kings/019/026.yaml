base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/026.yaml
  text: Therefore their inhabitants were short of strength[a]; they were dismayed and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and scorched before it is grown.
translation:
  language: fr
  text: Leurs habitants étaient impuissants[a] ; ils étaient consternés et couverts de honte. Ils étaient comme l’herbe des champs et la tendre verdure, comme l’herbe des toits, et comme une végétation brûlée avant d’avoir poussé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « courts de main », expression hébraïque signifiant qu’ils manquaient de force ou de pouvoir.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu exprime l’image finale de façon compacte : il peut évoquer une végétation brûlée ou desséchée avant d’être sur pied, ou une culture atteinte de brûlure avant sa maturité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹשְׁבֵיהֶן
  choice: Leurs habitants
  rationale: Le suffixe renvoie aux villes mentionnées dans le contexte ; « habitants » est précis et naturel en français.
- source_word: קִצְרֵי יָד
  choice: étaient impuissants
  rationale: L’expression idiomatique signifie littéralement « courts de main » et désigne l’incapacité ou le manque de force. « Impuissants » en transmet clairement le sens.
- source_word: חַתּוּ
  choice: étaient consternés
  rationale: Le verbe exprime l’effondrement intérieur, l’épouvante ou le désarroi. « Consternés » conserve cette force sans imposer l’image plus spécifique d’un anéantissement physique.
- source_word: וַיֵּבֹשׁוּ
  choice: couverts de honte
  rationale: Cette formulation rend le résultat de la défaite et la disgrâce exprimée par le verbe.
- source_word: עֵשֶׂב שָׂדֶה
  choice: l’herbe des champs
  rationale: Traduction directe et idiomatique de l’image végétale.
- source_word: וִירַק דֶּשֶׁא
  choice: la tendre verdure
  rationale: L’expression évoque une végétation verte et fraîche ; « tendre verdure » en restitue aussi la fragilité implicite.
- source_word: חֲצִיר גַּגּוֹת
  choice: l’herbe des toits
  rationale: Cette traduction conserve l’image concrète d’une herbe poussant dans une faible épaisseur de terre et se desséchant rapidement.
- source_word: וּשְׁדֵפָה לִפְנֵי קָמָה
  choice: une végétation brûlée avant de se dresser
  rationale: L’hébreu associe de manière très compacte le dessèchement ou la brûlure à ce qui précède l’état de céréale dressée. La formulation française conserve l’image agricole tout en restant lisible.
