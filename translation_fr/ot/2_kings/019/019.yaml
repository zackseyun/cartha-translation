id: 2KI.19.19
reference: 2 Kings 19:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֥/נוּ נָ֖א מִ/יָּד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּ֥י אַתָּ֛ה יְהוָ֥ה אֱלֹהִ֖ים לְ/בַדֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/019.yaml
  text: And now[a], Yahweh our God, please save us from his hand[b], so that all the kingdoms of the earth may know that you alone are God.
translation:
  language: fr
  text: Et maintenant, Yahweh notre Dieu, sauve-nous, je t’en prie, de sa main[a], afin que tous les royaumes de la terre[b] sachent que toi seul, Yahweh, tu es Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de sa main »; expression désignant son pouvoir ou son emprise.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « tous les royaumes du pays »; dans ce contexte international, « de la terre » paraît préférable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la liaison introduite par וְ et la valeur temporelle de עַתָּה, qui ouvre la requête culminante de la prière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement la forme avec suffixe de première personne du pluriel.
- source_word: הוֹשִׁיעֵנוּ נָא
  choice: sauve-nous, je t’en prie
  rationale: L’impératif exprime la demande de délivrance, et נָא en marque le caractère pressant et suppliant.
- source_word: מִיָּדוֹ
  choice: de sa main
  rationale: Préserve l’image hébraïque de la main comme expression du pouvoir ou de l’emprise, tout en l’expliquant en note.
- source_word: וְיֵדְעוּ
  choice: afin que … sachent
  rationale: Dans ce contexte, la forme verbale coordonnée exprime naturellement le but recherché par la délivrance demandée.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: tous les royaumes de la terre
  rationale: Le contexte international favorise la portée globale de הָאָרֶץ, sans exclure en note le sens possible de « pays ».
- source_word: כִּי
  choice: que
  rationale: Introduit ici le contenu de ce que les royaumes doivent reconnaître.
- source_word: אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ
  choice: que toi seul, Yahweh, tu es Dieu
  rationale: La tournure française met en relief l’exclusivité exprimée par לְבַדֶּךָ tout en gardant Yahweh comme apostrophe identificatrice et אֱלֹהִים comme prédicat.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; sa transcription préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de לְבַדֶּךָ dans la confession finale
  choice: toi seul, Yahweh, tu es Dieu
  alternative: toi, Yahweh, tu es Dieu, toi seul
  rationale: Les deux formulations expriment l’exclusivité. La formulation retenue est naturelle en français et laisse porter « seul » sur le sujet sans ajouter d’explication doctrinale.
- issue: Valeur de וְיֵדְעוּ après la requête
  choice: afin que … sachent
  alternative: et … sauront
  rationale: Le contexte de prière soutient une nuance de but, mais la possibilité formelle d’un résultat coordonné demeure reconnue.
translation_notes:
  register: Français international moderne, digne et accessible. « Je t’en prie » rend la supplication sans archaïsme; la répétition du pronom dans « toi seul … tu es » est une mise en relief naturelle en français.
