revisions:
- from: 'Par l’intermédiaire de tes messagers, tu as insulté le Seigneur et tu as dit : « Avec mes nombreux chars, moi, je suis monté jusqu’aux hauteurs des montagnes, dans les parties les plus reculées du Liban. J’abattrai ses cèdres majestueux, ses cyprès les plus beaux[a]. J’atteindrai son refuge le plus lointain, sa forêt luxuriante. »'
  to: 'Par l’intermédiaire de tes messagers, tu as insulté le Seigneur et tu as dit : « Avec mes nombreux chars, moi, je suis monté jusqu’aux hauteurs des montagnes, dans les parties les plus reculées du Liban. J’abattrai ses hauts cèdres, ses plus beaux cyprès[a]. J’entrerai dans son gîte le plus reculé, dans sa forêt fertile. »'
  rationale: Révision limitée afin de rendre explicitement le mouvement d’entrée, de mieux refléter le sens premier de « lieu où l’on séjourne » et de conserver la notion de haute stature des cèdres. La note demeure ancrée au terme hébreu בְּרוֹשׁ, dont l’identification botanique est incertaine.
