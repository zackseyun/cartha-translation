  text: בְּ/יַ֣ד מַלְאָכֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר ב/רכב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְח֣וֹר בְּרֹשָׁ֔י/ו וְ/אָב֨וֹאָה֙ מְל֣וֹן קִצֹּ֔/ה יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/023.yaml
  text: By the hand of your messengers you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; and I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest lodging place, its forest garden.’
translation:
  language: fr
  text: 'Par l’intermédiaire de tes messagers, tu as insulté le Seigneur et tu as dit : « Avec mes nombreux chars, moi, je suis monté jusqu’aux hauteurs des montagnes, dans les parties les plus reculées du Liban. J’abattrai ses hauts cèdres, ses plus beaux cyprès[a]. J’entrerai dans son gîte le plus reculé, dans sa forêt fertile. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses plus beaux sapins » ; l’identification exacte de l’espèce d’arbre désignée par le terme hébreu est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד מַלְאָכֶיךָ
  choice: Par l’intermédiaire de tes messagers
  rationale: L’expression idiomatique בְּיַד marque ici l’intermédiaire ou l’agent. Cette formulation française conserve ce rapport sans le calque peu naturel « par la main de » ; מַלְאָכֶיךָ désigne les envoyés humains du roi.
- source_word: חֵרַפְתָּ
  choice: tu as insulté
  rationale: Le verbe exprime l’outrage, la raillerie méprisante ou le défi. « Insulté » rend directement l’affront adressé au Seigneur.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Le texte porte אֲדֹנָי, et non le tétragramme YHWH ; « le Seigneur » maintient cette distinction.
- source_word: בְּרֹב רִכְבִּי
  choice: Avec mes nombreux chars
  rationale: רֹב souligne la quantité et donc la puissance militaire dont se vante le locuteur. La tournure est claire et naturelle en français moderne.
- source_word: אֲנִי עָלִיתִי
  choice: moi, je suis monté
  rationale: Le pronom indépendant אֲנִי renforce le sujet. La dislocation française « moi, je » restitue cette insistance orgueilleuse.
- source_word: מְרוֹם הָרִים
  choice: jusqu’aux hauteurs des montagnes
  rationale: מְרוֹם désigne la hauteur ou un lieu élevé. « Jusqu’aux » explicite naturellement le terme du mouvement sans modifier l’image.
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: dans les parties les plus reculées du Liban
  rationale: יַרְכְּתֵי évoque les extrémités ou recoins difficiles d’accès. La traduction garde l’idée d’une pénétration jusqu’au fond du Liban.
- source_word: קוֹמַת אֲרָזָיו
  choice: ses cèdres majestueux
  rationale: קוֹמָה renvoie à la hauteur ou à la stature. « Majestueux » communique ici la haute stature des cèdres sans produire une expression française pesante.
- source_word: מִבְחוֹר בְּרֹשָׁיו
  choice: ses cyprès les plus beaux
  rationale: מִבְחוֹר désigne ce qui est choisi ou excellent. בְּרוֹשׁ est un conifère dont l’identification précise reste discutée ; « cyprès » est retenu dans le texte avec une note.
- source_word: מְלוֹן קִצֹּה
  choice: son refuge le plus lointain
  rationale: מָלוֹן désigne un lieu où l’on séjourne ou s’abrite, tandis que קִצֹּה indique son extrémité. « Refuge » convient mieux que le littéral « lieu d’hébergement » à l’image poétique du Liban inaccessible.
- source_word: יַעַר כַּרְמִלּוֹ
  choice: sa forêt luxuriante
  rationale: יַעַר signifie « forêt » et כַּרְמִל peut évoquer une terre plantée, fertile ou verdoyante. « Forêt luxuriante » restitue l’image sans identifier ici le mot au mont Carmel.
theological_decisions:
- issue: Distinction entre אֲדֹנָי et YHWH
  choice: le Seigneur
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le texte source emploie אֲדֹנָי et non YHWH. La traduction évite donc une forme française réservée au nom divin et conserve la distinction lexicale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le discours direct conserve le ton emphatique et vantard du roi. Le marqueur [a] est placé après « cyprès », le terme auquel la note se rapporte.
