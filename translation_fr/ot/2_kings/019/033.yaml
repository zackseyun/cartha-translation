  text: בַּ/דֶּ֥רֶךְ אֲשֶׁר יָבֹ֖א בָּ֣/הּ יָשׁ֑וּב וְ/אֶל הָ/עִ֥יר הַ/זֹּ֛את לֹ֥א יָבֹ֖א נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/033.yaml
  text: By the way that he came[a], by it he will return, and he will not come to this city, declares Yahweh.
translation:
  language: fr
  text: Il repartira par le chemin par lequel il est venu, et il ne viendra pas jusqu’à cette ville — déclaration de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר יָבֹא בָּהּ יָשׁוּב
  choice: Il repartira par le chemin par lequel il est venu
  rationale: Cette formulation naturelle en français conserve l’idée qu’il reprendra le même itinéraire. Le premier imparfait יָבֹא désigne ici sa venue déjà accomplie, tandis que יָשׁוּב annonce son retour.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבֹא
  choice: et il ne viendra pas jusqu’à cette ville
  rationale: La traduction maintient le verbe courant « venir » sans lui ajouter le sens plus précis d’« entrer ». « Jusqu’à » exprime naturellement en français le mouvement vers la ville.
- source_word: נְאֻם יְהוָה
  choice: — déclaration de Yahweh
  rationale: La formule prophétique נְאֻם est rendue avec solennité, et le nom divin יהוה est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu porte le nom propre divin; sa translittération préserve cette distinction plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La répétition hébraïque autour du chemin est conservée sous une forme idiomatique, sans expliciter davantage l’identité du sujet ni renforcer « venir » en « entrer ».
