source:
  edition: WLC
  text: יַ֚עַן הִתְרַגֶּזְ/ךָ֣ אֵלַ֔/י וְ/שַׁאֲנַנְ/ךָ֖ עָלָ֣ה בְ/אָזְנָ֑/י וְ/שַׂמְתִּ֨י חַחִ֜/י בְּ/אַפֶּ֗/ךָ וּ/מִתְגִּ/י֙ בִּ/שְׂפָתֶ֔י/ךָ וַ/הֲשִׁ֣בֹתִ֔י/ךָ בַּ/דֶּ֖רֶךְ אֲשֶׁר בָּ֥אתָ בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/028.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips, and I will turn you back by the way by which you came.
translation:
  language: fr
  text: Parce que ta fureur contre moi et ton assurance sont montées jusqu’à mes oreilles[a], je mettrai mon crochet dans ton nez et mon mors entre tes lèvres, puis je te ferai retourner par le chemin par lequel tu es venu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton arrogance », « ta suffisance ». Le terme hébreu évoque l’aisance ou une sécurité pleine d’assurance, ici dans un contexte hostile.
    reason: Alternative lexicale permettant de préserver l’étendue sémantique de שַׁאֲנַנְךָ.
lexical_decisions:
- source_word: יַעַן
  choice: Parce que
  rationale: Introduit explicitement la cause du jugement annoncé, dans un français naturel.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: ta fureur contre moi
  rationale: Le hitpael de רָגַז exprime ici une agitation hostile et furieuse dirigée contre Dieu. « Fureur » restitue cette intensité sans ajouter l’idée distincte d’insolence.
- source_word: שַׁאֲנַנְךָ
  choice: ton assurance
  rationale: Le terme évoque l’aisance, la sécurité tranquille ou la confiance en soi. « Assurance » conserve cette base sémantique, tandis que le contexte lui donne une valeur coupable; les nuances plus fortement négatives sont signalées en note.
- source_word: עָלָה בְאָזְנָי
  choice: sont montées jusqu’à mes oreilles
  rationale: Conserve l’image anthropomorphique et le mouvement ascendant de l’expression hébraïque, tout en étant compréhensible en français.
- source_word: חַחִי בְּאַפֶּךָ
  choice: mon crochet dans ton nez
  rationale: Rend concrètement l’instrument de contrainte et l’humiliation du roi assyrien. Le sens physique de אַף est requis ici.
- source_word: מִתְגִּי בִּשְׂפָתֶיךָ
  choice: mon mors entre tes lèvres
  rationale: « Mors » désigne précisément l’instrument servant à diriger un animal; « entre tes lèvres » garde l’image corporelle de l’hébreu dans une formulation française naturelle.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: je te ferai retourner
  rationale: La tournure causative exprime clairement que Dieu contraint l’envahisseur à repartir.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: par le chemin par lequel tu es venu
  rationale: 'Préserve la répétition et la symétrie du jugement: l’envahisseur repartira exactement par sa voie d’arrivée.'
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu
  choice: Conserver « montées jusqu’à mes oreilles », « mon crochet » et « mon mors »
  alternative: Réduire les images à des abstractions telles que « je l’ai entendu » et « je te maîtriserai »
  rationale: Les images concrètes portent la force du discours prophétique et présentent la connaissance et la souveraineté divines sans qu’il soit nécessaire de les expliquer ou de les atténuer.
- issue: Nuance de שַׁאֲנַנְךָ
  choice: Employer « ton assurance » dans le texte principal
  alternative: « ton arrogance », « ta suffisance » ou « ta sécurité tranquille »
  rationale: Le mot désigne fondamentalement une aisance sûre d’elle-même. « Assurance » préserve cette amplitude, tandis que la note indique les nuances péjoratives possibles dans ce contexte hostile.
translation_notes:
  register: Français international moderne, digne et direct. Les images physiques du texte hébreu sont maintenues; la syntaxe reste fluide sans effacer la répétition rhétorique finale.
