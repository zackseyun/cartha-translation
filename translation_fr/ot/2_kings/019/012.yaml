  text: הַ/הִצִּ֨ילוּ אֹתָ֜/ם אֱלֹהֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר שִׁחֲת֣וּ אֲבוֹתַ֔/י אֶת גּוֹזָ֖ן וְ/אֶת חָרָ֑ן וְ/רֶ֥צֶף וּ/בְנֵי עֶ֖דֶן אֲשֶׁ֥ר בִּ/תְלַאשָּֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Tel-assar?
translation:
  language: fr
  text: Les dieux des nations que mes ancêtres ont détruites les ont-ils délivrées — Gozan, Harân, Retseph et les habitants d’Éden[a] qui étaient à Tel-Assar ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Éden ». Cette expression peut désigner les gens ou les habitants d’Éden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: les ont-ils sauvées
  rationale: Le hifil accompli de נצל exprime ici, dans une question rhétorique, l’idée de délivrer ou sauver. Le passé composé convient au français actuel et au contexte historique de la provocation assyrienne.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet renvoie aux nations ou populations énumérées. En français, son genre est accordé avec « nations », l’antécédent grammatical explicite.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: les dieux des nations
  rationale: Traduction directe de la construction nominale, désignant les divinités adorées par ces nations.
- source_word: אֲשֶׁר שִׁחֲתוּ אֲבוֹתַי
  choice: que mes ancêtres ont détruites
  rationale: Dans ce contexte militaire, le piel de שׁחת signifie détruire ou ravager. « Mes ancêtres » rend naturellement אֲבוֹתַי comme désignation des prédécesseurs royaux, sans suggérer seulement le père immédiat.
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: Gozan, Harrân, Retseph
  rationale: Les noms propres sont translittérés sous des formes françaises reconnaissables et proches de l’hébreu.
- source_word: וּבְנֵי עֶדֶן
  choice: les habitants d’Éden
  rationale: L’expression signifie littéralement « les fils d’Éden », mais בני peut désigner les membres ou la population d’un lieu. « Les habitants d’Éden » communique clairement ce sens collectif, tandis que la forme littérale est conservée en note.
- source_word: אֲשֶׁר בִּתְלַאשָּׂר
  choice: qui étaient à Tel-Assar
  rationale: La préposition ב devant un nom de lieu situe ici les habitants d’Éden à Tel-Assar. « À » est idiomatique en français pour une localité.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La structure interrogative conserve la force de la question rhétorique et l’ordre général de l’hébreu. « Ancêtres » évite l’ambiguïté moderne de « pères » tout en exprimant les prédécesseurs du roi assyrien.
