- from: 'C’est pourquoi voici ce que dit Yahweh au sujet du roi d’Assyrie : Il n’entrera pas dans cette ville, il n’y tirera aucune flèche, il ne s’avancera pas contre elle avec un bouclier[a] et il n’élèvera pas contre elle de rampe de siège[b].'
  to: 'C’est pourquoi voici ce que dit Yahweh au sujet du roi d’Assyrie : Il n’entrera pas dans cette ville, il n’y tirera aucune flèche, il ne s’avancera pas contre elle avec un bouclier[a] et il n’élèvera pas contre elle une rampe de siège[b].'
