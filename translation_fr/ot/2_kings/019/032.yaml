source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עָלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/032.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He shall not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or cast up a siege ramp against it.'
translation:
  language: fr
  text: 'C’est pourquoi voici ce que dit Yahweh au sujet du roi d’Assyrie : Il n’entrera pas dans cette ville, il n’y tirera aucune flèche, il ne s’avancera pas contre elle avec un bouclier[a] et il n’élèvera pas contre elle une rampe de siège[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ne se présentera pas devant elle avec un bouclier ». L’hébreu évoque probablement une avancée contre la ville sous la protection d’un bouclier.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « remblai de siège » ou « levée de terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Conserve la valeur conclusive de l’adverbe tout en étant naturel en français moderne.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Rend naturellement en français la formule prophétique consacrée sans perdre sa force déclarative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre.
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: au sujet du roi d’Assyrie
  rationale: Dans ce contexte, אֶל introduit celui que concerne l’oracle plutôt qu’un destinataire directement interpellé.
- source_word: לֹא יָבֹא אֶל הָעִיר הַזֹּאת
  choice: Il n’entrera pas dans cette ville
  rationale: Le contexte promet qu’il ne pénétrera pas dans la ville; cette formulation est claire et idiomatique.
- source_word: יוֹרֶה שָׁם חֵץ
  choice: il n’y tirera aucune flèche
  rationale: Exprime naturellement la négation hébraïque et l’action militaire de décocher une flèche.
- source_word: יְקַדְּמֶנָּה מָגֵן
  choice: il ne s’avancera pas contre elle avec un bouclier
  rationale: Préserve l’image d’une approche militaire avec un bouclier, tout en tenant compte de l’ambiguïté du verbe קדמ.
- source_word: יִשְׁפֹּךְ עָלֶיהָ סֹלְלָה
  choice: il n’élèvera pas contre elle de rampe de siège
  rationale: 'Rend l’expression militaire idiomatiquement: il s’agit d’amasser de la terre afin de construire un ouvrage d’approche.'
- source_word: סֹלְלָה
  choice: rampe de siège
  rationale: Terme moderne et intelligible pour l’ouvrage de terre élevé contre une ville assiégée.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin; sa transcription préserve cette distinction au lieu de le remplacer par un titre.
- issue: Portée de אֶל devant « roi d’Assyrie »
  choice: au sujet du roi d’Assyrie
  alternative: au roi d’Assyrie
  rationale: L’oracle parle du sort du roi sans être présenté ici comme une parole qui lui est directement remise; « au sujet de » respecte cette fonction contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le rythme de la déclaration prophétique et la série de négations, tout en explicitant sobrement le vocabulaire militaire.
