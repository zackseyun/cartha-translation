source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/021.yaml
  text: 'This is the word that Yahweh has spoken concerning him: ‘Virgin Daughter Zion despises you[a]; she mocks you[b]. Daughter Jerusalem shakes her head behind you.’'
translation:
  language: fr
  text: 'Voici la parole que Yahweh a prononcée à son sujet :


    « La vierge, fille de Sion, te méprise

    et se moque de toi.

    La fille de Jérusalem secoue la tête[a] derrière toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secouer la tête est ici un geste de mépris et de dérision.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: la parole
  rationale: Dans cette formule introduisant un oracle, « la parole » rend naturellement דָּבָר tout en conservant l’idée d’une déclaration divine.
- source_word: דִּבֶּר יְהוָה עָלָיו
  choice: Yahweh a prononcée à son sujet
  rationale: עַל désigne ici le sujet de l’oracle, sans qu’il soit nécessaire de l’expliciter par « contre lui ». Le passé composé convient en français à la déclaration qui vient d’être transmise.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: בָּזָה לְךָ
  choice: te méprise
  rationale: Le verbe exprime le mépris ou le dédain; le présent donne à la raillerie sa force vive dans l’oracle.
- source_word: לָעֲגָה לְךָ
  choice: se moque de toi
  rationale: Cette formulation courante et directe rend le sens de railler ou tourner en dérision.
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: la vierge, fille de Sion
  rationale: Cette formulation conserve à la fois l’image de la vierge et la personnification poétique de Sion, dans un français intelligible et digne.
- source_word: אַחֲרֶיךָ
  choice: derrière toi
  rationale: Le sens spatial est maintenu. Dans le contexte, l’image présente Jérusalem qui manifeste son mépris dans le dos de l’ennemi en retraite.
- source_word: רֹאשׁ הֵנִיעָה
  choice: secoue la tête
  rationale: L’expression française décrit clairement le geste tout en laissant la note en préciser la valeur culturelle de dérision.
- source_word: בַּת יְרוּשָׁלִָם
  choice: la fille de Jérusalem
  rationale: La traduction conserve la personnification poétique de la ville et le parallélisme avec « fille de Sion ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Valeur de עָלָיו après דִּבֶּר
  choice: à son sujet
  alternative: contre lui
  rationale: La préposition peut introduire le thème de la parole. Le contexte rend l’oracle hostile, mais la traduction ne force pas cette nuance dans la préposition elle-même.
translation_notes:
  register: Français international moderne, poétique sans archaïsme. Le parallélisme des deux désignations féminines de la ville est conservé, ainsi que le présent expressif de la raillerie.
