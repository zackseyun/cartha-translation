source:
  edition: WLC
  text: כִּ֛י אִֽם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּירָ֑אוּ וְ/הוּא֙ יַצִּ֣יל אֶתְ/כֶ֔ם מִ/יַּ֖ד כָּל אֹיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/039.yaml
  text: But Yahweh your God you shall fear[a], and he will deliver you from the hand of all your enemies.
translation:
  language: fr
  text: Mais c’est Yahweh, votre Dieu, que vous craindrez, et c’est lui qui vous délivrera du pouvoir de tous vos ennemis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la main de tous vos ennemis » ; cette expression signifie « de leur pouvoir » ou « de leur emprise ».'
    reason: idiome hébreu
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais c’est… que
  rationale: 'La locution marque ici un contraste exclusif avec l’interdiction du verset précédent : non pas les autres dieux, mais Yahweh. La construction clivée est naturelle en français et conserve cette mise en relief.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Dans son rapport à Yahweh, אֱלֹהִים est ici singulier et porte le suffixe de la deuxième personne du pluriel.
- source_word: תִּירָאוּ
  choice: vous craindrez
  rationale: L’imparfait hébreu a ici une force prescriptive. « Craindre » garde à la fois la révérence et le poids réel de la crainte dans ce contexte d’alliance.
- source_word: וְהוּא
  choice: et c’est lui qui
  rationale: Le pronom indépendant explicite met le sujet en relief. La tournure française « c’est lui qui » rend cette insistance sans ajouter « lui-même ».
- source_word: יַצִּיל
  choice: délivrera
  rationale: Le hiphil de נצל exprime l’action d’arracher au danger ou au pouvoir d’un adversaire ; « délivrer » convient au contexte.
- source_word: מִיַּד
  choice: du pouvoir de
  rationale: Littéralement « de la main de ». L’équivalent idiomatique français exprime clairement l’autorité ou l’emprise des ennemis, tandis que la note conserve l’image hébraïque.
- source_word: כָּל אֹיְבֵיכֶם
  choice: tous vos ennemis
  rationale: Traduction directe et naturelle du quantificateur suivi du nom pluriel avec suffixe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le nom d’alliance יהוה. « Yahweh » le conserve comme nom propre au lieu de le remplacer par un titre.
- issue: Sens de ירא envers Dieu
  choice: craindrez
  alternative: révérerez / respecterez profondément
  rationale: Le contexte implique une crainte révérencielle qui commande la fidélité. « Craindre » préserve la tension sémantique du terme hébreu sans le réduire au simple respect.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur prescriptive maintient la forme de l’hébreu ; les constructions clivées rendent l’accent porté sur Yahweh et sur son action.
