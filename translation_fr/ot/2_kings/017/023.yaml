source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר הֵסִ֨יר יְהוָ֤ה אֶת יִשְׂרָאֵל֙ מֵ/עַ֣ל פָּנָ֔י/ו כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד כָּל עֲבָדָ֣י/ו הַ/נְּבִיאִ֑ים וַ/יִּ֨גֶל יִשְׂרָאֵ֜ל מֵ/עַ֤ל אַדְמָת/וֹ֙ אַשּׁ֔וּרָ/ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/023.yaml
  text: until Yahweh removed Israel from before him[a], just as he had spoken by the hand of all his servants the prophets. So Israel was exiled from its land to Assyria[b], to this day.
translation:
  language: fr
  text: jusqu’à ce que Yahweh ait éloigné Israël de devant lui[a], comme il l’avait déclaré par l’intermédiaire[b] de tous ses serviteurs, les prophètes. Ainsi, Israël fut déporté de son pays en Assyrie, où il est resté jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant sa face »; on peut aussi traduire : « loin de sa présence ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la main de ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: ait éloigné
  rationale: Le hiphil de סור exprime ici le fait de faire partir ou d’écarter. « Éloigner » conserve cette valeur causative sans préciser davantage la nature du jugement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin YHWH, conformément à l’orientation du projet.
- source_word: מֵעַל פָּנָיו
  choice: de devant lui
  rationale: Cette formulation française garde l’image relationnelle et judiciaire de l’expression hébraïque, littéralement « de devant sa face », sans lourdeur excessive.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: comme il l’avait annoncé
  rationale: « Annoncé » exprime naturellement, dans ce contexte, la parole prophétique antérieure qui trouve son accomplissement, tout en conservant la comparaison introduite par כַּאֲשֶׁר.
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: L’expression hébraïque signifie littéralement « par la main de » et marque ici l’intermédiaire ou l’agent. La formulation retenue est naturelle en français moderne.
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: tous ses serviteurs, les prophètes
  rationale: L’apposition identifie les prophètes comme les serviteurs de Yahweh et reproduit directement la structure sémantique de l’hébreu.
- source_word: וַיִּגֶל
  choice: fut déporté
  rationale: Dans ce contexte historique, גלה désigne l’exil imposé par une déportation. Le singulier respecte « Israël » comme nom collectif.
- source_word: מֵעַל אַדְמָתוֹ
  choice: loin de son territoire
  rationale: אַדְמָה désigne ici la terre propre à Israël. « Territoire » rend clairement le sens national et géographique, tandis que « loin de » reflète מֵעַל.
- source_word: אַשּׁוּרָה
  choice: en Assyrie
  rationale: Le suffixe directionnel indique le déplacement vers l’Assyrie; après « fut déporté », « en Assyrie » est la tournure française naturelle.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: où il se trouve encore aujourd’hui
  rationale: La formule signifie littéralement « jusqu’à ce jour ». Dans ce contexte, la formulation explicite naturellement la continuité de l’exil d’Israël jusqu’au temps du narrateur.
theological_decisions:
- issue: Portée de מֵעַל פָּנָיו dans le jugement divin
  choice: de devant lui
  alternative: loin de sa présence
  rationale: « De devant lui » préserve l’image personnelle et judiciaire de l’hébreu sans décider si la « présence » doit être comprise dans un sens local, cultuel ou théologique.
- issue: Continuité exprimée par עַד הַיּוֹם הַזֶּה
  choice: où il se trouve encore aujourd’hui
  alternative: jusqu’à ce jour
  rationale: Le sens temporel est rendu comme une observation du narrateur concernant Israël en exil, sans en tirer de conclusion théologique ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le lien avec le verset précédent grâce à l’ouverture « jusqu’à ce que ». Les idiomes hébreux sont rendus naturellement dans le texte, avec leurs formes plus littérales en notes.
