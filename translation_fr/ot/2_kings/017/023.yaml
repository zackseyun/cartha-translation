revisions:
- from: jusqu’à ce que Yahweh ait éloigné Israël de devant lui[a], comme il l’avait annoncé par l’intermédiaire[b] de tous ses serviteurs, les prophètes. Ainsi, Israël fut déporté loin de son territoire, en Assyrie, où il se trouve encore aujourd’hui.
  to: jusqu’à ce que Yahweh ait éloigné Israël de devant lui[a], comme il l’avait déclaré par l’intermédiaire[b] de tous ses serviteurs, les prophètes. Ainsi, Israël fut déporté de son pays en Assyrie, où il est resté jusqu’à ce jour.
  rationale: La révision retire l’ajout sémantique « loin de », rend plus directement la terre nationale par « son pays » et préserve la formule temporelle du narrateur avec « jusqu’à ce jour ». Elle remplace également « annoncé » par le plus neutre « déclaré ». Les deux notes existantes sont exactes, utiles et correctement ancrées; elles sont donc conservées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:15:55Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la structure générale, le nom divin, l’agentivité de « par l’intermédiaire de », l’apposition « ses serviteurs, les prophètes » et la destination assyrienne. Toutefois, « loin de son territoire » ajoute une idée de distance absente du texte, et « où il se trouve encore aujourd’hui » reformule de façon interprétative la formule narrative « jusqu’à ce jour ».
  naturalness: Le français est globalement naturel et soutenu. « De son pays » et « jusqu’à ce jour » sont à la fois plus directs, plus idiomatiques dans un récit biblique moderne et plus proches de l’hébreu. « Déclaré » convient mieux que « annoncé » pour la parole divine transmise par les prophètes, sans imposer une nuance supplémentaire.
  terminology: « Yahweh », « Israël », « Assyrie », « déporté » et « ses serviteurs, les prophètes » sont appropriés. Les notes conservent utilement les formes littérales des deux idiomes hébreux et leurs ancres correspondent aux expressions concernées.
  issues:
  - severity: medium
    issue: « loin de son territoire »
    rationale: Le syntagme hébreu signifie « de dessus/de sa terre ». Le mot « loin » introduit une notion de distance qui n’est pas exprimée; « de son pays » rend le départ de la terre d’Israël sans ajout.
  - severity: medium
    issue: « où il se trouve encore aujourd’hui »
    rationale: Cette relative explicite et localise l’état d’Israël d’une manière plus interprétative que la formule hébraïque עַד הַיּוֹם הַזֶּה. « où il est resté jusqu’à ce jour » conserve le lien avec l’Assyrie et la portée temporelle du texte.
  - severity: low
    issue: « comme il l’avait annoncé »
    rationale: « Annoncé » est possible, mais « déclaré » est plus neutre pour דִּבֶּר (« il avait parlé/déclaré ») et évite de renforcer inutilement la nuance de proclamation.
  revised_text: jusqu’à ce que Yahweh ait éloigné Israël de devant lui[a], comme il l’avait déclaré par l’intermédiaire[b] de tous ses serviteurs, les prophètes. Ainsi, Israël fut déporté de son pays en Assyrie, où il est resté jusqu’à ce jour.
  revised_footnotes:
