base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/041.yaml
  text: So these nations feared Yahweh[a], yet they were serving their carved images. Their children also, and their children's children—as their fathers did, so they are doing to this day.
translation:
  language: fr
  text: Ainsi, ces nations craignaient Yahweh, tout en rendant un culte à leurs images sculptées[a]. Leurs enfants aussi, et les enfants de leurs enfants, font encore aujourd’hui comme leurs pères l’avaient fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs idoles ». Le terme hébreu désigne précisément des images taillées.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Ainsi, … craignaient
  rationale: Le waw narratif introduit ici la conclusion récapitulative du passage. « Ainsi » en exprime naturellement la portée en français.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ces nations
  rationale: Le terme désigne les groupes étrangers établis en Samarie; « nations » conserve la désignation collective du texte.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: craignaient Yahweh
  rationale: « Craindre Yahweh » préserve l’expression religieuse et son amplitude, qui peut inclure crainte et révérence sans préciser ici la sincérité de cette attitude.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְאֶת פְּסִילֵיהֶם
  choice: tout en … leurs images sculptées
  rationale: פְּסִילִים désigne spécifiquement des représentations cultuelles façonnées par sculpture. « Tout en » rend clairement la coexistence contrastée des deux pratiques dans ce contexte.
- source_word: הָיוּ עֹבְדִים
  choice: rendant un culte
  rationale: La construction périphrastique exprime une pratique habituelle. Avec des images cultuelles comme objet, « rendre un culte » transmet naturellement en français le sens religieux de עבד.
- source_word: גַּם בְּנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: Leurs enfants et les enfants de leurs enfants
  rationale: Cette formulation conserve la répétition généalogique de l’hébreu et inclut naturellement les générations successives.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: ce que leurs pères avaient fait
  rationale: Le plus-que-parfait marque naturellement en français l’antériorité de la conduite des ancêtres par rapport à celle de leurs descendants.
- source_word: הֵם עֹשִׂים עַד הַיּוֹם הַזֶּה
  choice: font encore aujourd’hui
  rationale: Le présent et « encore aujourd’hui » rendent à la fois la continuité indiquée par le participe et la formule temporelle hébraïque.
theological_decisions:
- issue: Coexistence de la crainte de Yahweh et du culte rendu aux images
  choice: craignaient Yahweh, tout en rendant un culte à leurs images sculptées
  alternative: adoraient Yahweh et servaient leurs idoles; prétendaient craindre Yahweh
  rationale: L’hébreu affirme simultanément les deux pratiques sans déterminer si cette crainte était sincère, syncrétiste ou seulement extérieure. La traduction conserve cette tension sans ajouter de jugement théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase finale est légèrement réorganisée pour être idiomatique tout en conservant la succession des générations, l’exemple ancestral et la continuité jusqu’au temps du narrateur.
