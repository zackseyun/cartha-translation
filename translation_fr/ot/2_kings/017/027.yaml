revisions:
- from: 'Alors le roi d’Assyrie donna cet ordre : « Faites venir là-bas l’un des prêtres que vous en avez déportés. Qu’il aille s’y établir[a] et qu’il leur enseigne la manière d’adorer le dieu du pays[b]. »'
  to: 'Alors le roi d’Assyrie donna cet ordre : « Envoyez là-bas l’un des prêtres que vous avez déportés de là. Qu’il y aille et s’y établisse[a], et qu’il leur enseigne la règle du dieu du pays[b]. »'
  rationale: La révision remplace une expression de déplacement peu naturelle par « envoyez là-bas » et restitue מִשְׁפָּט par « règle », terme assez large pour ne pas ajouter l’idée spécifique d’adoration. Les notes documentent à la fois l’irrégularité de nombre du texte hébreu et les principales nuances lexicales et théologiques de la dernière expression.
