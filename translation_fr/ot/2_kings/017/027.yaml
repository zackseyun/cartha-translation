base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/027.yaml
  text: Then the king of Assyria commanded[a], saying, “Take there one of the priests whom you exiled from there, and let him go and live there[e][d][c][b], and let him teach them the custom of the god of the land.”
translation:
  language: fr
  text: 'Alors le roi d’Assyrie donna cet ordre : « Envoyez là-bas l’un des prêtres que vous avez déportés de là. Qu’il y aille et s’y établisse[a], et qu’il leur enseigne la règle du dieu du pays[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici deux verbes au pluriel (« qu’ils aillent » et « qu’ils s’établissent »), bien que le contexte indique un seul prêtre et que le verbe suivant soit au singulier.
    reason: textual_variant
  - marker: b
    text: 'Autres traductions possibles : « la loi », « l’exigence » ou « l’usage du dieu du pays ». « Le Dieu du pays » est également possible. La minuscule dans le texte principal reflète le point de vue du roi assyrien, qui pense en termes de divinité territoriale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Le verbe צוה exprime un ordre royal. Cette tournure est naturelle en français moderne et conserve sa force.
- source_word: הֹלִיכוּ שָׁמָּה
  choice: Faites venir là-bas
  rationale: Le hiphil de הלך signifie ici faire aller ou conduire quelqu’un vers un lieu. « Faites venir là-bas » rend le déplacement ordonné sans préciser indûment les moyens employés.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: l’un des prêtres
  rationale: La construction partitive est rendue directement et naturellement.
- source_word: אֲשֶׁר הִגְלִיתֶם מִשָּׁם
  choice: que vous en avez déportés
  rationale: Le hiphil de גלה désigne couramment la déportation. Le pronom « en » reprend le lieu d’où les prêtres avaient été emmenés.
- source_word: וְיֵלְכוּ וְיֵשְׁבוּ שָׁם
  choice: Qu’il aille s’y établir
  rationale: Le texte massorétique porte ici deux verbes au pluriel malgré l’antécédent singulier et le verbe singulier qui suit. Le français suit le sens contextuel singulier, tandis qu’une note signale l’irrégularité formelle.
- source_word: וְיֹרֵם
  choice: qu’il leur enseigne
  rationale: Le hiphil de ירה exprime l’action d’enseigner ou d’instruire; le suffixe pluriel est rendu par « leur ».
- source_word: מִשְׁפַּט
  choice: la manière d’adorer
  rationale: Dans ce contexte, מִשְׁפַּט désigne la pratique prescrite ou le culte dû à la divinité locale. Cette formulation explicite naturellement le sens religieux sans le réduire à une loi codifiée.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: le dieu du pays
  rationale: La minuscule reflète la conception assyrienne d’une divinité territoriale dans le discours rapporté, sans trancher au niveau du narrateur l’identité réelle du référent.
theological_decisions:
- issue: Majuscule ou minuscule pour אֱלֹהֵי הָאָרֶץ
  choice: le dieu du pays
  alternative: le Dieu du pays
  rationale: La minuscule préserve le point de vue du roi assyrien, qui conçoit la divinité comme attachée à un territoire. La majuscule reste possible si l’expression est comprise selon l’identité véritable du Dieu d’Israël.
- issue: Discordance de nombre dans וְיֵלְכוּ / וְיֵשְׁבוּ
  choice: 'sens singulier : « Qu’il aille s’y établir »'
  alternative: 'forme plurielle : « Qu’ils aillent s’y établir »'
  rationale: L’antécédent est « l’un des prêtres » et le verbe suivant est singulier. Le singulier communique donc le sens contextuel, tandis que la note conserve l’information sur la forme hébraïque.
translation_notes:
  register: Français international moderne, narratif et digne. « Donner cet ordre » convient au cadre royal; « s’établir » exprime une résidence durable. La formulation « manière d’adorer » privilégie la clarté courante tout en conservant en note l’alternative plus formelle « règle ».
