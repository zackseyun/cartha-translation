  text: עַ֣ד הַ/יּ֤וֹם הַ/זֶּה֙ הֵ֣ם עֹשִׂ֔ים כַּ/מִּשְׁפָּטִ֖ים הָ/רִֽאשֹׁנִ֑ים אֵינָ֤/ם יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֵינָ֣/ם עֹשִׂ֗ים כְּ/חֻקֹּתָ/ם֙ וּ/כְ/מִשְׁפָּטָ֔/ם וְ/כַ/תּוֹרָ֣ה וְ/כַ/מִּצְוָ֗ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁר שָׂ֥ם שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/034.yaml
  text: To this day they act according to the former customs[a]. They do not fear Yahweh, and they do not act according to their statutes and their ordinances, or according to the law and the commandment that Yahweh commanded the sons of Jacob[d][c][b], whom he named Israel.
translation:
  language: fr
  text: Jusqu’à ce jour, ils suivent les pratiques d’autrefois[a]. Ils ne craignent pas Yahweh[b] et ne se conforment ni à leurs prescriptions ni à leurs règles, ni à la loi et au commandement que Yahweh a ordonné aux fils de Jacob[c], Jacob auquel il a donné le nom d’Israël[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon les anciennes règles » ou « selon les coutumes d’autrefois ».
    reason: lexical_alternative
  - marker: b
    text: « Craindre Yahweh » peut aussi se rendre par « révérer Yahweh »; l’expression hébraïque associe crainte, profond respect et fidélité envers lui.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « les fils de Jacob »; l’expression désigne collectivement le peuple issu de Jacob.
    reason: lexical_alternative
  - marker: d
    text: C’est-à-dire Jacob; voir Genèse 32.29 et 35.10.
    reason: cross_reference
lexical_decisions:
- source_word: כַּמִּשְׁפָּטִים הָרִאשֹׁנִים
  choice: ils suivent les pratiques d’autrefois
  rationale: מִשְׁפָּט peut désigner ici une coutume, une règle ou une pratique établie. Le contexte évoque les usages religieux précédemment décrits; « pratiques d’autrefois » est naturel en français tout en conservant l’idée d’usages antérieurs.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: craignent Yahweh
  rationale: L’expression associe crainte, respect religieux et fidélité d’alliance. « Craindre Yahweh » conserve l’idiome biblique et sa force sans le réduire au seul respect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: כְּחֻקֹּתָם וּכְמִשְׁפָּטָם
  choice: à leurs prescriptions ni à leurs règles
  rationale: « Prescriptions » rend le caractère fixé de חֻקּוֹת, tandis que « règles » exprime ici la valeur normative de מִשְׁפָּט. Le possessif « leurs » maintient l’ambiguïté de son référent dans le texte hébreu.
- source_word: וְכַתּוֹרָה וְכַמִּצְוָה
  choice: ni à la loi et au commandement
  rationale: Les singuliers hébreux sont conservés. Dans la portée des négations, « ni » rend naturellement en français la série des normes auxquelles ils ne se conforment pas.
- source_word: בְּנֵי יַעֲקֹב
  choice: les fils de Jacob
  rationale: La formulation reste proche du masculin pluriel hébreu; elle désigne collectivement les descendants de Jacob.
- source_word: אֲשֶׁר שָׂם שְׁמוֹ יִשְׂרָאֵל
  choice: ce Jacob auquel il avait donné le nom d’Israël
  rationale: La reprise explicite de « Jacob » lève une ambiguïté grammaticale accidentelle en français et exprime idiomatiquement l’attribution du nom Israël.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le Tétragramme comme nom propre; « Yahweh » préserve directement ce nom d’alliance.
- issue: Référent de « leurs prescriptions » et « leurs règles »
  choice: Maintenir le possessif sans en préciser le référent
  alternative: Expliciter soit les normes propres aux peuples, soit les prescriptions données à Israël
  rationale: Les suffixes hébreux signifient littéralement « leurs », mais leur référent peut être discuté dans ce passage. La traduction conserve cette tension au lieu d’imposer une interprétation.
- issue: Portée de la crainte de Yahweh
  choice: craignent Yahweh
  alternative: révèrent Yahweh
  rationale: « Craindre » préserve à la fois la formulation traditionnelle, la solennité théologique et l’éventail sémantique de l’idiome hébreu.
translation_notes:
  register: Français international moderne, courant et digne. La structure négative a été légèrement réorganisée pour être naturelle en français. Le tiret explicatif permet d’identifier clairement Jacob comme celui qui a reçu le nom d’Israël, sans alourdir la phrase.
