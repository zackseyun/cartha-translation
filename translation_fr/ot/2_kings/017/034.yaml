- from: Jusqu’à ce jour, ils suivent les pratiques d’autrefois[a]. Ils ne craignent pas Yahweh[b] et ne se conforment ni à leurs prescriptions ni à leurs règles, ni à la loi et au commandement que Yahweh avait prescrits aux fils de Jacob[c] — ce Jacob auquel il avait donné le nom d’Israël[d].
  to: Jusqu’à ce jour, ils suivent les pratiques d’autrefois[a]. Ils ne craignent pas Yahweh[b] et ne se conforment ni à leurs prescriptions ni à leurs règles, ni à la loi et au commandement que Yahweh a ordonné aux fils de Jacob[c], Jacob auquel il a donné le nom d’Israël[d].
