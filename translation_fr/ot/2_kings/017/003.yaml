base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/003.yaml
  text: Shalmaneser king of Assyria came up against him[a], and Hoshea became his servant and paid him tribute.
translation:
  language: fr
  text: Salmanasar, roi d’Assyrie, marcha contre lui, et Osée devint son serviteur[a] et lui paya un tribut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son vassal ». L’hébreu dit littéralement « son serviteur » et exprime ici une subordination politique.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָלָיו
  choice: marcha contre lui
  rationale: Dans un contexte militaire, l’expression désigne une avancée dirigée contre quelqu’un. « Marcha contre lui » reste naturelle en français et n’affirme pas nécessairement qu’un assaut a déjà eu lieu.
- source_word: שַׁלְמַנְאֶסֶר
  choice: Salmanasar
  rationale: Forme française traditionnelle et courante du nom du roi assyrien.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: roi d’Assyrie
  rationale: L’apposition identifie Salmanasar par son titre et son royaume.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: devint son serviteur
  rationale: La construction exprime un changement de statut et la subordination politique d’Osée. « Serviteur » conserve l’image hébraïque sans suggérer nécessairement l’esclavage personnel.
- source_word: וַיָּשֶׁב לוֹ מִנְחָה
  choice: lui paya un tribut
  rationale: Dans ce cadre politique, l’expression désigne le versement d’un tribut par un souverain soumis.
- source_word: מִנְחָה
  choice: tribut
  rationale: Le contexte géopolitique impose ici le sens de paiement dû par un roi subordonné, plutôt que celui d’offrande ou de cadeau.
theological_decisions:
- issue: Nature de la relation entre Osée et Salmanasar
  choice: serviteur
  alternative: vassal
  rationale: Le texte emploie le terme hébreu courant pour « serviteur », ici dans un sens politique. Le texte principal préserve cette formulation, tandis que la note explicite la valeur contextuelle de « vassal ».
translation_notes:
  register: Français moderne, international et digne. La tournure « marcha contre lui » conserve la portée militaire de l’idiome sans transformer l’avancée en attaque explicite. Le marqueur [a] figure immédiatement après le terme concerné.
