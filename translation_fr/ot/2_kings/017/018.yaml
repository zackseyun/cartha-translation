revisions:
- from: Alors Yahvé se mit dans une grande colère contre Israël et l’écarta de devant sa face[a]. Il ne resta que la seule tribu de Juda.
  to: Alors Yahvé se mit très en colère contre Israël et les écarta de sa présence[a]. Il ne resta que la tribu de Juda, elle seule.
  rationale: La révision améliore l’idiomaticité tout en conservant la force de la colère divine, le pluriel des Israélites écartés et l’insistance selon laquelle seule la tribu de Juda resta. La note remplace une alternative légèrement expansive par une formulation française fidèle et signale la littéralité anthropomorphique de l’hébreu.
