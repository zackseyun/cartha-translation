  text: וַ/יִּתְאַנַּ֨ף יְהוָ֤ה מְאֹד֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְסִרֵ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו לֹ֣א נִשְׁאַ֔ר רַ֛ק שֵׁ֥בֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/018.yaml
  text: So Yahweh was very angry with Israel and removed them from before his face[a]; none was left except the tribe of Judah alone.
translation:
  language: fr
  text: Alors Yahvé se mit très en colère contre Israël et les écarta de sa présence[a]. Il ne resta que la tribu de Juda, elle seule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de devant lui ». Littéralement : « de devant sa face ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַנַּף יְהוָה מְאֹד
  choice: Yahvé se mit dans une grande colère
  rationale: Le hitpael de אנף décrit une colère qui s’enflamme, intensifiée par מְאֹד. Cette tournure française exprime naturellement le déclenchement et la force de la colère.
- source_word: בְּיִשְׂרָאֵל
  choice: contre Israël
  rationale: Avec un verbe de colère, בְּ marque ici la personne ou le peuple visé; « contre » est idiomatique et précis en français.
- source_word: וַיְסִרֵם
  choice: l’écarta
  rationale: Le verbe causatif exprime le fait de faire partir ou d’éloigner. Le pronom singulier reprend naturellement le nom collectif « Israël » en français, sans expliciter l’exil au-delà du texte.
- source_word: מֵעַל פָּנָיו
  choice: de devant sa face
  rationale: Cette formulation conserve l’image concrète et anthropomorphique de l’hébreu; l’équivalent idiomatique « loin de sa présence » est signalé en note.
- source_word: לֹא נִשְׁאַר רַק שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: Il ne resta que la seule tribu de Juda
  rationale: « Ne… que » rend l’exception introduite par רַק, tandis que « seule » conserve l’insistance de לְבַדּוֹ sans produire une tournure trop lourde.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » représente le nom divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Expression anthropomorphique de la présence divine en מֵעַל פָּנָיו
  choice: de devant sa face
  alternative: loin de sa présence
  rationale: Le texte hébreu emploie l’image concrète de la face de Dieu. La conserver maintient la texture théologique du passage; la formulation plus abstraite et idiomatique est donnée en note.
- issue: Référent d’« Israël »
  choice: Le royaume du Nord, envisagé collectivement
  alternative: L’ensemble du peuple de l’alliance dans un sens plus large
  rationale: Le contexte immédiat raconte la chute et la déportation du royaume du Nord. La traduction ne développe pas ce référent dans le corps du verset et évite ainsi d’ajouter une interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant l’anthropomorphisme hébreu et l’insistance finale sur Juda.
