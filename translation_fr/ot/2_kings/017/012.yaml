  text: וַ/יַּֽעַבְד֖וּ הַ/גִּלֻּלִ֑ים אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם לֹ֥א תַעֲשׂ֖וּ אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/012.yaml
  text: They served the idols[a], concerning which Yahweh had said to them, “You shall not do this thing.”
translation:
  language: fr
  text: 'Ils ont rendu un culte aux idoles[a], au sujet desquelles Yahweh leur avait dit : « Vous ne ferez pas cela. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « idoles » est un terme péjoratif, qui peut évoquer des « idoles immondes » ou des « idoles de fumier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: Ils ont rendu un culte
  rationale: Le verbe עבד signifie fondamentalement « servir », mais, avec des idoles pour complément, il désigne ici clairement le service cultuel. « Rendre un culte » est naturel en français et conserve cette portée religieuse sans réduire le verbe au seul geste de prosternation.
- source_word: הַגִּלֻּלִים
  choice: aux idoles[a]
  rationale: « Idoles » est le terme français courant et intelligible. Le mot hébreu est fortement méprisant; cette nuance difficile à rendre naturellement dans le corps du texte est signalée en note.
- source_word: אֲשֶׁר אָמַר יְהוָה לָהֶם
  choice: alors que Yahweh leur avait dit
  rationale: Le relatif hébreu relie les idoles ou la pratique idolâtre à l'interdiction antérieure. « Alors que » exprime naturellement en français le contraste implicite entre leur conduite et le commandement reçu, tandis que le plus-que-parfait marque l'antériorité de la parole divine.
- source_word: לֹא תַעֲשׂוּ אֶת־הַדָּבָר הַזֶּה
  choice: Vous ne ferez pas cela
  rationale: Cette formulation garde la force solennelle de l'interdiction et rend idiomatiquement דָּבָר הַזֶּה sans le calque peu naturel « cette chose ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom divin personnel plutôt que de le remplacer par un titre.
- issue: Référent de « cela » dans l'interdiction
  choice: Maintenir la référence générale à la pratique idolâtre
  alternative: Expliciter « rendre un culte à ces idoles »
  rationale: L'hébreu dit littéralement « cette chose » et ne détaille pas davantage l'acte. « Cela » conserve cette relative indétermination sans ajouter une précision interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. « Rendre un culte » évite l'ambiguïté de « servir les idoles » en français courant; la citation conserve une tonalité de commandement sans archaïsme.
