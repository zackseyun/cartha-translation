  verdict: revise
  source_fidelity: 'Le texte rend correctement les principaux éléments hébreux : l’encens brûlé, les hauts lieux, l’imitation des nations, et les actes mauvais accomplis pour susciter la colère de Yahweh. Toutefois, « chassées devant eux » risque en français de signifier que les nations étaient chassées en leur présence ou vers l’avant, alors que מִפְּנֵיהֶם exprime le retrait « de devant eux ».'
