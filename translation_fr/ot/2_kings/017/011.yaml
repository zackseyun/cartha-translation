  text: וַ/יְקַטְּרוּ שָׁם֙ בְּ/כָל בָּמ֔וֹת כַּ/גּוֹיִ֕ם אֲשֶׁר הֶגְלָ֥ה יְהוָ֖ה מִ/פְּנֵי/הֶ֑ם וַֽ/יַּעֲשׂוּ֙ דְּבָרִ֣ים רָעִ֔ים לְ/הַכְעִ֖יס אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/011.yaml
  text: There they burned incense on all the high places[a], like the nations whom Yahweh had driven out before them; and they did evil things to provoke Yahweh.
translation:
  language: fr
  text: Là, ils brûlèrent de l’encens sur tous les hauts lieux, à la manière des nations que Yahweh avait chassées de devant eux[a]. Ils firent des choses mauvaises pour irriter Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que Yahweh avait déportées de devant eux ». Le verbe hébreu peut désigner une déportation ou, plus largement ici, l’éloignement forcé des peuples hors du pays.
    reason: Alternative lexicale pour הֶגְלָה, dont le sens peut aller de l’éloignement à la déportation.
lexical_decisions:
- source_word: וַיְקַטְּרוּ
  choice: ils brûlèrent de l’encens
  rationale: Le piel de קטר désigne le fait de faire monter une fumée cultuelle, souvent en brûlant de l’encens. Cette formulation française est naturelle et convient au contexte du culte pratiqué sur les hauts lieux.
- source_word: שָׁם
  choice: là
  rationale: L’adverbe renvoie directement aux lieux de culte évoqués dans le contexte immédiat.
- source_word: בְּכָל בָּמוֹת
  choice: sur tous les hauts lieux
  rationale: בָּמוֹת est un terme cultuel désignant des sanctuaires ou lieux de culte situés sur des hauteurs. « Hauts lieux » en conserve la portée technique traditionnelle sans explicitation excessive.
- source_word: כַּגּוֹיִם
  choice: à la manière des nations
  rationale: Cette tournure exprime naturellement la comparaison et indique qu’Israël imitait les pratiques cultuelles des peuples précédemment dépossédés.
- source_word: אֲשֶׁר הֶגְלָה יְהוָה מִפְּנֵיהֶם
  choice: que Yahweh avait chassées devant eux
  rationale: Dans ce contexte de dépossession du pays, le hiphil de גלה évoque l’éloignement forcé des peuples. « Chassées devant eux » rend clairement le mouvement hors du territoire tout en conservant l’idiome spatial hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est rendu par sa translittération usuelle en français plutôt que remplacé par un titre.
- source_word: וַיַּעֲשׂוּ דְּבָרִים רָעִים
  choice: ils firent des choses mauvaises
  rationale: Traduction directe et accessible qui conserve le caractère général de l’accusation morale.
- source_word: לְהַכְעִיס
  choice: pour irriter
  rationale: Le hiphil de כעס signifie provoquer l’irritation ou la colère. « Irriter » permet de garder Yahweh comme objet direct, conformément à la syntaxe hébraïque.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie le nom propre de Dieu. Le conserver sous la forme « Yahweh » distingue ce nom d’un simple titre.
- issue: Sens de הֶגְלָה dans le contexte de la conquête
  choice: avait chassées devant eux
  alternative: avait déportées loin de devant eux
  rationale: Le contexte vise les nations retirées du pays avant Israël. Le choix principal exprime cette dépossession, tandis que la note conserve la possibilité lexicale plus précise d’une déportation.
translation_notes:
  register: Français moderne, digne et lisible. Le passé simple convient au récit historique écrit. « Hauts lieux » conserve le vocabulaire cultuel de 2 Rois, et la formulation maintient sans l’atténuer l’idée que les actes décrits visaient à irriter Yahweh.
