  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּקְשׁ֤וּ אֶת עָרְפָּ/ם֙ כְּ/עֹ֣רֶף אֲבוֹתָ֔/ם אֲשֶׁר֙ לֹ֣א הֶאֱמִ֔ינוּ בַּֽ/יהוָ֖ה אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/014.yaml
  text: But they would not listen; they stiffened their neck like the neck of their fathers[a], who did not believe in Yahweh their God.
translation:
  language: fr
  text: Mais ils n’ont pas écouté ; ils ont raidi leur nuque comme leurs ancêtres avaient raidi la leur, eux qui n’ont pas cru[a] en Yahweh, leur Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’ont pas mis leur confiance en Yahweh, leur Dieu ». Le verbe hébreu peut exprimer la foi ou la confiance dans le cadre de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמֵעוּ
  choice: Mais ils n’ont pas écouté
  rationale: Le verbe שׁמע signifie entendre ou écouter et peut, dans un contexte d’alliance, impliquer l’obéissance. « N’ont pas écouté » conserve le sens premier, tandis que « Mais » exprime naturellement le contraste avec les avertissements précédents.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: ils ont raidi la nuque
  rationale: L’expression hébraïque décrit littéralement le fait de rendre la nuque dure. Cette formulation française conserve l’image concrète de l’entêtement sans la réduire à une simple abstraction.
- source_word: כְּעֹרֶף אֲבוֹתָם
  choice: comme leurs ancêtres
  rationale: Le français évite l’expression peu naturelle « comme la nuque de leurs ancêtres », tout en maintenant la comparaison et son lien immédiat avec l’image de la nuque raidie.
- source_word: הֶאֱמִינוּ בַּיהוָה
  choice: n’ont pas cru en Yahweh
  rationale: Le hiphil de אמן construit avec ב peut exprimer la foi ou la confiance placée en quelqu’un. « Croire en » reproduit directement la construction et laisse une note signaler la nuance possible de confiance.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Le singulier français rend explicitement le lien d’alliance exprimé par le nom avec suffixe possessif.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom personnel de Dieu. « Yahweh » le représente directement plutôt que de le remplacer par un titre.
- issue: Valeur de אמן avec la préposition ב
  choice: n’ont pas cru en Yahweh
  alternative: n’ont pas mis leur confiance en Yahweh
  rationale: Les deux lectures sont fondées lexicalement. Le texte principal conserve la correspondance formelle « croire en », tandis que la note préserve la dimension relationnelle et alliancielle de la confiance.
translation_notes:
  register: Français international moderne, digne et accessible. Le point-virgule rend la progression entre le refus d’écouter et l’obstination. L’image hébraïque de la nuque raidie est conservée sous une forme naturelle en français.
