source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוָ֤ה אִתָּ/ם֙ בְּרִ֔ית וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר לֹ֥א תִֽירְא֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא תִשְׁתַּחֲו֣וּ לָ/הֶ֔ם וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִזְבְּח֖וּ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/035.yaml
  text: And Yahweh made a covenant with them and commanded them, saying, “You shall not fear other gods, and you shall not bow down to them, or serve them, or sacrifice to them.”
translation:
  language: fr
  text: 'Yahweh conclut une alliance avec eux et leur donna cet ordre : « Vous ne craindrez pas d’autres dieux ; vous ne vous prosternerez pas devant eux, vous ne les servirez pas et vous ne leur offrirez pas de sacrifices. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: avait conclu une alliance
  rationale: L’expression hébraïque כרת ברית est une locution qui signifie « conclure une alliance ». Le plus-que-parfait rend naturellement le rappel d’un acte antérieur dans le contexte narratif français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, plutôt que substitution par un titre.
- source_word: וַיְצַוֵּם לֵאמֹר
  choice: 'leur avait donné cet ordre :'
  rationale: Cette formulation française actuelle et digne exprime directement l’idée de commandement et introduit naturellement le discours, sans calquer le participe hébreu « disant ».
- source_word: לֹא תִירְאוּ
  choice: Vous ne craindrez pas
  rationale: Le futur à valeur injonctive conserve la solennité juridique de l’interdiction dans le cadre de l’alliance. « Craindre » reste distinct des actes cultuels énumérés ensuite.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Rendu direct de l’expression hébraïque, sans l’interpréter comme « dieux étrangers ».
- source_word: תִשְׁתַּחֲווּ לָהֶם
  choice: vous ne vous prosternerez pas devant eux
  rationale: « Se prosterner devant » conserve l’action corporelle concrète et la distingue du service cultuel.
- source_word: תַעַבְדוּם
  choice: vous ne les servirez pas
  rationale: « Servir » maintient la distinction lexicale entre la crainte, la prosternation, le service et le sacrifice.
- source_word: תִזְבְּחוּ לָהֶם
  choice: vous ne leur offrirez pas de sacrifices
  rationale: Formulation française naturelle qui explicite l’acte sacrificiel sans ajouter de contenu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin ; sa transcription préserve cette donnée plutôt que de lui substituer un titre.
- issue: Force des interdictions dans le discours d’alliance
  choice: 'futur à valeur injonctive : « Vous ne… pas »'
  alternative: 'impératif : « Ne… pas »'
  rationale: Le futur injonctif français restitue la tonalité solennelle et juridique des prohibitions, sans modifier leur portée.
- issue: Sens de ירא appliqué à d’autres dieux
  choice: craindre
  alternative: adorer
  rationale: Le sens concret « craindre » est conservé, car les verbes suivants détaillent séparément plusieurs actes de culte ; traduire ici par « adorer » effacerait cette articulation.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La coordination a été légèrement allégée en français tout en conservant les quatre interdictions distinctes. Le plus-que-parfait situe naturellement l’alliance et le commandement avant les pratiques décrites dans le contexte.
