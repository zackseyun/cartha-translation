id: 2KI.17.9
reference: 2 Kings 17:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְחַפְּא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל דְּבָרִים֙ אֲשֶׁ֣ר לֹא כֵ֔ן עַל יְהוָ֖ה אֱלֹהֵי/הֶ֑ם וַ/יִּבְנ֨וּ לָ/הֶ֤ם בָּמוֹת֙ בְּ/כָל עָ֣רֵי/הֶ֔ם מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/009.yaml
  text: And the sons of Israel secretly did things that were not right against Yahweh their God[a], and they built for themselves high places in all their cities[c][b], from watchtower to fortified city.
translation:
  language: fr
  text: Les Israélites firent en secret contre Yahvé leur Dieu des choses qui n’étaient pas justes[a]. Ils se construisirent des hauts lieux[b] dans toutes leurs villes, depuis la tour de guet jusqu’à la ville fortifiée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dissimulèrent des choses qui n’étaient pas justes au sujet de Yahvé leur Dieu ». Le verbe hébreu est rare et peut évoquer soit la dissimulation, soit une action accomplie en secret.'
    reason: lexical_alternative
  - marker: b
    text: Les « hauts lieux » étaient des lieux de culte locaux, souvent associés à un culte non autorisé.
    reason: cultural_note
  - marker: c
    text: 'L’expression « depuis la tour de guet jusqu’à la ville fortifiée » signifie ici : dans tout le pays, du plus petit poste de garde à la cité la mieux défendue.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַפְּאוּ
  choice: firent en secret
  rationale: Le verbe rare חפא peut évoquer l’action clandestine ou la dissimulation. « Firent en secret » s’accorde naturellement avec l’objet « des choses » tout en conservant cette nuance.
- source_word: דְּבָרִים אֲשֶׁר לֹא כֵן
  choice: des choses qui n’étaient pas justes
  rationale: Cette formulation rend l’évaluation morale de l’expression idiomatique sans préciser au-delà de l’hébreu la nature exacte des actes.
- source_word: עַל יְהוָה אֱלֹהֵיהֶם
  choice: contre Yahvé leur Dieu
  rationale: Dans ce contexte d’infidélité cultuelle, עַל a vraisemblablement une valeur adversative, bien que le sens plus neutre « au sujet de » reste possible.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française usuelle du nom divin personnel.
- source_word: וַיִּבְנוּ לָהֶם בָּמוֹת
  choice: Ils se construisirent des hauts lieux
  rationale: « Hauts lieux » conserve le terme cultuel traditionnel, tandis que la tournure pronominale rend לָהֶם et la dimension d’initiative propre.
- source_word: בְכָל עָרֵיהֶם
  choice: dans toutes leurs villes
  rationale: Équivalent direct et naturel de la locution hébraïque.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: depuis la tour de guet
  rationale: La formulation rend de façon idiomatique une tour destinée aux gardes ou guetteurs et ouvre le mérisme géographique.
- source_word: עַד עִיר מִבְצָר
  choice: jusqu’à la ville fortifiée
  rationale: Équivalent naturel qui achève le mérisme allant du petit poste de garde à la cité défendue.
theological_decisions:
- issue: Nature des actes cachés d’Israël
  choice: Des actes répréhensibles accomplis secrètement contre Yahvé
  alternative: Des paroles ou des affaires dissimulées au sujet de Yahvé
  rationale: Le verbe rare, son complément דְּבָרִים et la mention immédiate de la construction des hauts lieux favorisent l’idée d’actes cultuels clandestins et infidèles. La note maintient néanmoins l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, clair et digne. « Israélites » est plus naturel que le calque « fils d’Israël ». Le passé simple convient au registre narratif biblique sans être archaïque. Les marqueurs de notes sont placés immédiatement après les éléments qu’ils expliquent.
