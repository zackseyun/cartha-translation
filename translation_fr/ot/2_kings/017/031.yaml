source:
  edition: WLC
  text: וְ/הָ/עַוִּ֛ים עָשׂ֥וּ נִבְחַ֖ז וְ/אֶת תַּרְתָּ֑ק וְ/הַ/סְפַרְוִ֗ים שֹׂרְפִ֤ים אֶת בְּנֵי/הֶם֙ בָּ/אֵ֔שׁ לְ/אַדְרַמֶּ֥לֶךְ וַֽ/עֲנַמֶּ֖לֶךְ אלה ספרים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/031.yaml
  text: The Avvites made Nibhaz and Tartak, and the Sepharvites were burning their sons in the fire to Adrammelek and Anammelek, the gods of Sepharvaim.
translation:
  language: fr
  text: Les Avvites[a] firent Nibhaz et Tartak, et les habitants de Sefarvaïm brûlaient leurs fils dans le feu en l’honneur d’Adrammélek et d’Anammélek, les dieux de Sefarvaïm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les Avvim ».'
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, ils offraient leurs fils en sacrifice à ces dieux en les brûlant.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַוִּים
  choice: les Avvites
  rationale: Nom collectif désignant un peuple; la translittération française usuelle conserve le nom propre ethnique.
- source_word: עָשׂוּ
  choice: firent
  rationale: Le verbe signifie littéralement « faire » et a ici pour objets des divinités ou leurs représentations cultuelles; la traduction n’ajoute pas « idoles » ou « images », que l’hébreu n’explicite pas.
- source_word: נִבְחַז וְאֶת תַּרְתָּק
  choice: Nibhaz et Tartak
  rationale: Noms propres de divinités, translittérés.
- source_word: הַסְפַרְוִים
  choice: les habitants de Sefarvaïm
  rationale: Le gentilé pluriel désigne les gens originaires de Sefarvaïm; cette formulation est plus transparente en français moderne que « Sefarvaïtes ».
- source_word: שֹׂרְפִים
  choice: brûlaient
  rationale: Le participe exprime ici une pratique habituelle ou répétée; l’imparfait français en rend naturellement la valeur.
- source_word: אֶת בְּנֵיהֶם בָּאֵשׁ
  choice: leurs fils dans le feu
  rationale: בנים est rendu précisément par « fils » et בָּאֵשׁ par l’expression directe « dans le feu ».
- source_word: לְאַדְרַמֶּלֶךְ וַעֲנַמֶּלֶךְ
  choice: en l’honneur d’Adrammélek et d’Anammélek
  rationale: La préposition לְ marque ici les destinataires divins de l’offrande; « en l’honneur de » exprime en français la dédicace cultuelle sans suggérer un simple mouvement spatial.
- source_word: אלה ספרים
  choice: les dieux de Sefarvaïm
  rationale: Le syntagme construit identifie Adrammélek et Anammélek comme les divinités liées à Sefarvaïm.
theological_decisions:
- issue: Expliciter que Nibhaz et Tartak étaient des idoles ou des représentations
  choice: Conserver « firent Nibhaz et Tartak »
  alternative: « fabriquèrent des idoles de Nibhaz et de Tartak » ou « firent des représentations de Nibhaz et de Tartak »
  rationale: L’hébreu emploie simplement « faire » suivi des noms. Le contexte cultuel implique probablement des objets fabriqués, mais le texte ne les qualifie pas explicitement.
- issue: Généraliser בְּנֵיהֶם en « enfants »
  choice: Traduire par « leurs fils »
  alternative: « leurs enfants »
  rationale: Le terme hébreu est masculin et spécifique; rien dans le contexte immédiat n’oblige à le généraliser.
- issue: Nature du sacrifice par le feu
  choice: Conserver la formulation concrète dans le texte et expliquer en note qu’il s’agit de sacrifices d’enfants
  alternative: Introduire directement « offraient leurs fils en sacrifice » dans le texte
  rationale: La formulation principale reste proche de l’expression hébraïque, tandis que la note fournit l’information culturelle sans remplacer l’image du texte.
translation_notes:
  register: Français international moderne, sobre et digne. L’imparfait « brûlaient » rend la pratique habituelle exprimée par le participe hébreu; « tandis que » évite une coordination lourde tout en maintenant le contraste entre les pratiques des deux peuples. Tous les marqueurs de notes figurent dans le texte principal.
