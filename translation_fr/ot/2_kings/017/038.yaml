  text: וְ/הַ/בְּרִ֛ית אֲשֶׁר כָּרַ֥תִּי אִתְּ/כֶ֖ם לֹ֣א תִשְׁכָּ֑חוּ וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/038.yaml
  text: And the covenant that I made with you[a], you shall not forget[b], and you shall not fear other gods.
translation:
  language: fr
  text: Et l’alliance que j’ai conclue avec vous[a], vous ne l’oublierez pas[b], et vous ne craindrez pas d’autres dieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « l’alliance que j’ai coupée avec vous ». « Conclure une alliance » rend cet idiome hébreu en français naturel.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne l’oubliez pas, et ne craignez pas d’autres dieux ». Les formes hébraïques peuvent être rendues soit par un futur à valeur prescriptive, soit par un impératif en français.
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְּרִית
  choice: l’alliance
  rationale: Dans ce contexte, בְּרִית désigne la relation formelle et contraignante établie par Dieu; « alliance » en conserve la portée biblique et théologique mieux que « accord » ou « traité ».
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: que j’ai conclue avec vous
  rationale: L’hébreu emploie littéralement l’expression « couper une alliance ». « Conclure une alliance » restitue naturellement en français l’idiome de l’établissement d’une alliance.
- source_word: לֹא תִשְׁכָּחוּ
  choice: vous ne l’oublierez pas
  rationale: La forme avec לֹא exprime ici une interdiction ou une instruction. Le futur français garde le ton solennel de l’exigence liée à l’alliance; le pronom « l’ » reprend naturellement l’objet antéposé.
- source_word: וְלֹא תִירְאוּ
  choice: et vous ne craindrez pas
  rationale: יָרֵא peut exprimer la crainte ou la révérence. « Craindre » préserve ici la formule biblique d’allégeance religieuse sans réduire le sens à la peur émotionnelle ni l’expliciter par « adorer ».
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Cette expression désigne les dieux autres que le Dieu d’Israël. « D’autres dieux » est direct, idiomatique et conserve la formulation de l’exclusivité de l’alliance.
theological_decisions:
- issue: Idiome de l’alliance et valeur des formes négatives
  choice: 'Conserver « alliance », rendre l’idiome par « conclue », et employer le futur à valeur prescriptive: « vous ne l’oublierez pas… vous ne craindrez pas ».'
  alternative: 'Employer des impératifs: « n’oubliez pas… ne craignez pas », ou rendre ירא par « révérer ».'
  rationale: Le texte associe le rappel de l’alliance à deux interdictions. Le futur français permet de conserver le ton solennel et prescriptif sans trancher excessivement entre commandement direct et instruction formulée comme obligation; « craindre » maintient en outre la tension entre crainte, révérence et allégeance cultuelle.
translation_notes:
  register: Français international moderne, digne et accessible. L’antéposition de « l’alliance » reproduit l’emphase de l’hébreu, tandis que le pronom de reprise assure une syntaxe française naturelle. Le parallélisme des deux futurs négatifs conserve le ton de l’instruction liée à l’alliance.
