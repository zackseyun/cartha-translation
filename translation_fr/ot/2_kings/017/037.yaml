source:
  edition: WLC
  text: וְ/אֶת הַ/חֻקִּ֨ים וְ/אֶת הַ/מִּשְׁפָּטִ֜ים וְ/הַ/תּוֹרָ֤ה וְ/הַ/מִּצְוָה֙ אֲשֶׁ֣ר כָּתַ֣ב לָ/כֶ֔ם תִּשְׁמְר֥וּ/ן לַ/עֲשׂ֖וֹת כָּל הַ/יָּמִ֑ים וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/037.yaml
  text: And the statutes and the judgments and the law and the commandment that he wrote for you[a], you shall keep to do all the days[c][b], and you shall not fear other gods.
translation:
  language: fr
  text: Les prescriptions, les règles, la loi et le commandement qu’il a écrits pour vous[a], vous veillerez à les mettre en pratique tous les jours[b] ; vous ne craindrez pas d’autres dieux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les décrets, les décisions, l’instruction et l’ordre ». L’hébreu accumule quatre termes du droit de l’alliance, dont les sens sont proches sans être identiques.'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque associe le fait de garder ou d’observer à celui d’accomplir concrètement.
    reason: lexical_alternative
  - marker: c
    text: Ici, « craindre » comprend la révérence et l’allégeance cultuelle accordées à une divinité.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים
  choice: les prescriptions
  rationale: Le terme désigne des dispositions établies ou décrétées. « Prescriptions » conserve sa portée juridique et se distingue des autres termes de la série.
- source_word: הַמִּשְׁפָּטִים
  choice: les règles
  rationale: Dans ce contexte, le mot renvoie aux règles ou décisions qui régissent la vie de l’alliance. « Règles » est naturel en français moderne tout en maintenant un terme distinct de « prescriptions ».
- source_word: הַתּוֹרָה
  choice: la loi
  rationale: Bien que תּוֹרָה puisse aussi signifier « instruction », « loi » convient à cette accumulation de termes juridiques et garde sa force reconnue dans le cadre de l’alliance.
- source_word: הַמִּצְוָה
  choice: le commandement
  rationale: Le singulier hébreu est conservé, ainsi que le registre solennel du terme.
- source_word: אֲשֶׁר כָּתַב לָכֶם
  choice: qu’il a écrits pour vous
  rationale: Le pronom implicite masculin singulier est maintenu sans remplacer explicitement son référent par « le Seigneur ». L’accord au pluriel rattache naturellement le participe aux quatre éléments énumérés.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: vous veillerez à les mettre en pratique
  rationale: Cette formulation française naturelle rend ensemble l’idée de garder attentivement et celle d’accomplir concrètement.
- source_word: כָּל הַיָּמִים
  choice: tous les jours
  rationale: La tournure restitue directement l’idiome hébreu et sa valeur de continuité sans ajouter de possessif.
- source_word: תִירְאוּ
  choice: vous ne craindrez pas
  rationale: « Craindre » préserve l’étendue sémantique du verbe, qui englobe ici la crainte révérencielle et l’allégeance cultuelle.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: C’est le rendu direct et habituel de l’expression désignant les divinités autres que le Dieu d’Israël.
theological_decisions:
- issue: Maintien des quatre termes juridiques de l’alliance
  choice: 'Conserver quatre désignations distinctes : « prescriptions, règles, loi, commandement »'
  alternative: Réduire l’énumération à une formule générale telle que « les lois et les commandements »
  rationale: L’accumulation hébraïque est rhétoriquement significative. La conserver évite d’aplanir les diverses dimensions des obligations de l’alliance.
- issue: Sujet de « qu’il a écrits »
  choice: Conserver le pronom « il »
  alternative: Expliciter « que le Seigneur a écrits »
  rationale: Le contexte permet d’identifier le référent, mais le verset hébreu n’emploie pas ici le nom divin. Le pronom évite une explicitation absente du texte source.
- issue: Portée de la crainte des autres dieux
  choice: Conserver « craindre » avec une note explicative
  alternative: Traduire directement par « vénérer » ou « adorer »
  rationale: Le verbe hébreu peut exprimer à la fois la peur, la révérence et l’allégeance cultuelle. « Craindre » préserve cette tension au lieu de la résoudre dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. La construction avec reprise pronominale (« Les prescriptions… vous veillerez à les… ») conserve la mise en relief initiale de l’énumération hébraïque tout en restant naturelle. Le point-virgule marque clairement les deux obligations coordonnées.
