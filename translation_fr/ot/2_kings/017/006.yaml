- from: La neuvième année du règne d’Osée, le roi d’Assyrie s’empara de Samarie. Il déporta Israël en Assyrie[a] et installa les exilés à Halah, sur les rives du Habor, le fleuve de Gozan[b], ainsi que dans les villes des Mèdes.
  to: La neuvième année du règne d’Osée, le roi d’Assyrie s’empara de Samarie. Il déporta Israël en Assyrie[a] et installa les exilés à Halah, sur le Habor, le fleuve de Gozan[b], ainsi que dans les villes de Médie.
  rationale: La révision corrige le référent territorial de מָדָי par « Médie » et remplace « sur les rives du Habor » par « sur le Habor », formulation naturelle qui évite de trancher plus que nécessaire la valeur locative de la préposition hébraïque. Les autres choix, notamment « déporta Israël » et « installa les exilés », sont conservés.
