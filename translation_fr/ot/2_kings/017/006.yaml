base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/006.yaml
  text: In the ninth year of Hoshea[a], the king of Assyria captured Samaria and carried Israel away to Assyria, and settled them in Halah, and on the Habor, the river of Gozan[b], and in the cities of Media.
translation:
  language: fr
  text: La neuvième année du règne d’Osée, le roi d’Assyrie s’empara de Samarie. Il déporta Israël en Assyrie[a] et installa les exilés à Halah, sur le Habor, le fleuve de Gozan[b], ainsi que dans les villes de Médie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « emmena Israël en exil en Assyrie ». Le verbe hébreu désigne un déplacement forcé vers l’exil.
    reason: lexical_alternative
  - marker: b
    text: Ou « près du Habor, le fleuve de Gozan ». L’hébreu peut évoquer une installation le long du Habor, dans la région de Gozan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַתְּשִׁיעִית לְהוֹשֵׁעַ
  choice: La neuvième année du règne d’Osée
  rationale: Le ל indique ici le repère chronologique du règne. L’ajout explicatif « du règne » produit un français naturel sans modifier le sens.
- source_word: לָכַד
  choice: s’empara de
  rationale: Dans un contexte militaire et avec une ville pour objet, cette expression rend naturellement l’idée de capture.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: Rendu direct et idiomatique de la chaîne construite.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française traditionnelle et usuelle du nom de la ville.
- source_word: וַיֶּגֶל אֶת יִשְׂרָאֵל
  choice: Il déporta Israël
  rationale: Le hiphil de גלה exprime ici le déplacement forcé en exil. « Déporta » est précis, courant et conserve Israël comme désignation collective.
- source_word: אַשּׁוּרָה
  choice: en Assyrie
  rationale: Le suffixe directionnel indique un mouvement vers l’Assyrie; « en Assyrie » est la tournure française naturelle.
- source_word: וַיֹּשֶׁב אֹתָם
  choice: installa les exilés
  rationale: Le hiphil de ישׁב signifie faire habiter ou établir. « Les exilés » explicite le référent du pronom pluriel hébreu après le collectif singulier « Israël », sans ajouter un nouveau groupe.
- source_word: בַּחְלַח
  choice: à Halah
  rationale: Translittération du toponyme avec la préposition française convenant à un lieu habité.
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: sur les rives du Habor, le fleuve de Gozan
  rationale: Le contexte identifie le Habor comme un cours d’eau. « Sur les rives » exprime naturellement l’établissement le long d’un fleuve, tandis que l’apposition préserve le rapport syntaxique avec Gozan.
- source_word: וְעָרֵי מָדָי
  choice: ainsi que dans les villes des Mèdes
  rationale: מָדָי désigne ici les Mèdes ou leur territoire. La formulation conserve la référence ethno-géographique et la coordination finale.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour la lisibilité. Le terme « exilés » reprend le collectif « Israël » et évite l’ambiguïté d’un pronom pluriel après un nom collectif singulier.
