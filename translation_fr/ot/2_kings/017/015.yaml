  text: וַ/יִּמְאֲס֣וּ אֶת חֻקָּ֗י/ו וְ/אֶת בְּרִית/וֹ֙ אֲשֶׁ֣ר כָּרַ֣ת אֶת אֲבוֹתָ֔/ם וְ/אֵת֙ עֵֽדְוֺתָ֔י/ו אֲשֶׁ֥ר הֵעִ֖יד בָּ֑/ם וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י הַ/הֶ֨בֶל֙ וַ/יֶּהְבָּ֔לוּ וְ/אַחֲרֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתָ֔/ם אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֹתָ֔/ם לְ/בִלְתִּ֖י עֲשׂ֥וֹת כָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/015.yaml
  text: They rejected his statutes and his covenant that he had made with their fathers[a], and his testimonies with which he had warned them. They went after vanity and became vain, and after the nations that were around them[c][b], concerning whom Yahweh had commanded them not to do like them.
translation:
  language: fr
  text: Ils rejetèrent ses prescriptions, son alliance qu’il avait conclue avec leurs pères, et ses témoignages[a], par lesquels il les avait avertis. Ils suivirent ce qui est vain et devinrent eux-mêmes vains.[b] Ils suivirent aussi les nations qui les entouraient, au sujet desquelles Yahweh leur avait ordonné de ne pas agir comme elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ses témoignages par lesquels il avait témoigné contre eux » ; le verbe peut évoquer un témoignage solennel aussi bien qu’un avertissement.'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu emploie deux mots apparentés : ils ont suivi ce qui est vain — vide, futile ou sans valeur, notamment les idoles dans ce contexte — et sont devenus eux-mêmes vains.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: Ils rejetèrent
  rationale: מָאַס exprime le rejet ou le mépris. « Rejetèrent » rend clairement le refus délibéré sans ajouter une nuance affective excessive.
- source_word: חֻקָּיו
  choice: ses prescriptions
  rationale: חֻקִּים désigne ici les règles prescrites par Dieu. « Prescriptions » conserve la portée juridique et alliancenelle dans un français actuel.
- source_word: בְּרִיתוֹ אֲשֶׁר כָּרַת
  choice: l’alliance qu’il avait conclue
  rationale: « Conclure une alliance » rend naturellement l’idiome hébreu littéral « couper une alliance ».
- source_word: אֲבוֹתָם
  choice: leurs pères
  rationale: Le masculin pluriel est conservé, conformément à la formule biblique relative aux pères d’Israël.
- source_word: עֵדְוֹתָיו אֲשֶׁר הֵעִיד בָּם
  choice: ses témoignages par lesquels il les avait avertis
  rationale: « Témoignages » maintient le vocabulaire de l’attestation, tandis que « avertis » exprime la valeur d’avertissement solennel du verbe הֵעִיד. Une note conserve l’autre analyse possible.
- source_word: הַהֶבֶל וַיֶּהְבָּלוּ
  choice: ce qui est vain et devinrent eux-mêmes vains
  rationale: Cette formulation reproduit le jeu entre le nom הֶבֶל et le verbe apparenté, tout en laissant ouvertes les idées de vide, de futilité et de choses sans valeur.
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבֹתָם
  choice: les nations qui les entouraient
  rationale: « Nations » convient au contexte historique et « qui les entouraient » rend simplement la proposition relative.
- source_word: לְבִלְתִּי עֲשׂוֹת כָּהֶם
  choice: de ne pas agir comme elles
  rationale: Cette expression française naturelle conserve la comparaison concise de l’hébreu sans préciser davantage les pratiques visées.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » préserve le nom personnel d’alliance sans le remplacer par un titre.
- issue: Portée de הֶבֶל dans le contexte de l’idolâtrie
  choice: ce qui est vain
  alternative: les idoles / ce qui est vide / ce qui ne vaut rien
  rationale: Le choix principal préserve la métaphore et le jeu de mots sans identifier explicitement הֶבֶל aux idoles, implication probable mais non formulée directement.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique. La répétition « suivirent » reproduit la structure hébraïque, et « eux-mêmes » rend perceptible le retournement poétique sans surinterpréter le résultat.
