  verdict: revise
  source_fidelity: 'Le texte rend avec fidélité les principaux termes et la progression du verset : rejet des prescriptions, de l’alliance et des témoignages ; poursuite de ce qui est vain et participation à cette vanité ; imitation interdite des nations environnantes. Le jeu de mots hébreu הֶבֶל / וַיֶּהְבָּלוּ est utilement maintenu. La relation finale introduite par אֲשֶׁר (« au sujet desquelles / concernant lesquelles ») est plus exactement exprimée que par le contrastif potentiel « alors que ».'
  naturalness: Le français est globalement moderne, clair et adapté à une narration biblique. « Ce qui est vain » et « devinrent eux-mêmes vains » conserve délibérément une tension sémantique que la note explique. La ponctuation révisée rend plus lisible le lien entre les témoignages et l’avertissement.
  terminology: « Prescriptions », « alliance », « témoignages » et « Yahweh » sont cohérents avec le texte source et le registre retenu. « Agir comme elles » respecte la comparaison concise de כָּהֶם sans ajouter les pratiques des nations.
