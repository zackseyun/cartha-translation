  to: Ils rejetèrent ses prescriptions, son alliance qu’il avait conclue avec leurs pères, et ses témoignages[a], par lesquels il les avait avertis. Ils suivirent ce qui est vain et devinrent eux-mêmes vains.[b] Ils suivirent aussi les nations qui les entouraient, au sujet desquelles Yahweh leur avait ordonné de ne pas agir comme elles.
