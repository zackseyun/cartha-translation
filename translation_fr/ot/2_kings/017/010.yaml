source:
  edition: WLC
  text: וַ/יַּצִּ֧בוּ לָ/הֶ֛ם מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/010.yaml
  text: They set up for themselves pillars and Asherah poles on every high hill and under every green tree[a].
translation:
  language: fr
  text: Ils érigèrent pour eux-mêmes des stèles et des poteaux d’Ashéra[a] sur toute colline élevée et sous tout arbre verdoyant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ashérim »; le terme hébreu désigne des objets cultuels associés à Ashéra, dont la forme exacte demeure incertaine.
    reason: Alternative lexicale et précision sur l’incertitude du référent.
lexical_decisions:
- source_word: וַיַּצִּבוּ
  choice: Ils érigèrent
  rationale: Le hiphil de נצב désigne ici l’action de dresser ou d’installer des objets cultuels. « Érigèrent » convient naturellement aux stèles et aux objets associés à Ashéra.
- source_word: לָהֶם
  choice: pour eux-mêmes
  rationale: Le datif pronominal indique que les Israélites installèrent ces objets pour leur propre usage; la tournure réflexive explicite cette nuance.
- source_word: מַצֵּבוֹת
  choice: des stèles
  rationale: Le terme désigne des pierres dressées ayant ici une fonction cultuelle. « Stèles » est précis, concis et n’ajoute pas dans le corps du texte un qualificatif absent de l’hébreu.
- source_word: וַאֲשֵׁרִים
  choice: des poteaux d’Ashéra
  rationale: Le pluriel renvoie à des objets cultuels associés à la déesse Ashéra. Cette formulation reste compréhensible tout en conservant explicitement cette association; une note signale l’autre translittération possible.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: sur toute colline élevée
  rationale: Rend directement l’image spatiale de l’hébreu dans un français naturel et actuel.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: et sous tout arbre verdoyant
  rationale: רַעֲנָן évoque une végétation verte, fraîche et abondante. « Verdoyant » préserve l’image et le caractère formulaire de l’expression.
theological_decisions:
- issue: Interprétation de אֲשֵׁרִים
  choice: poteaux d’Ashéra
  alternative: ashérim; objets cultuels d’Ashéra
  rationale: Le terme désigne vraisemblablement des objets cultuels liés à Ashéra, sans permettre d’en préciser avec certitude la forme ou la matière. La traduction usuelle est retenue pour sa lisibilité, tandis que la note préserve l’incertitude lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le parallélisme des lieux (« sur toute… et sous tout… ») ainsi que la nuance réflexive de לָהֶם.
