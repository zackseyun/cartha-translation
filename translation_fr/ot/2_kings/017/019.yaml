  text: גַּם יְהוּדָ֕ה לֹ֣א שָׁמַ֔ר אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יֵּ֣לְכ֔וּ בְּ/חֻקּ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/019.yaml
  text: Even Judah did not keep the commandments of Yahweh their God[b][a], but walked in the statutes that Israel had made.
translation:
  language: fr
  text: Même Juda n’a pas gardé les commandements de Yahweh, leur Dieu, mais ils ont suivi les prescriptions qu’Israël avait établies.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les pratiques qu’Israël observait ». Le verbe hébreu peut désigner le fait d’établir ces prescriptions ou, selon une compréhension plus large, de les pratiquer.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: Même
  rationale: En tête de phrase, la particule souligne que Juda, lui aussi, partage la culpabilité d’Israël; « même » restitue cette insistance dans le contexte.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Nom usuel en français du royaume du Sud.
- source_word: שָׁמַר
  choice: garder
  rationale: Dans un contexte d’alliance et de commandements, le verbe signifie observer ou respecter; « garder » conserve le registre biblique tout en restant compréhensible.
- source_word: מִצְוֺת
  choice: les commandements
  rationale: Ce choix préserve la portée juridique et religieuse du pluriel hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française courante du nom divin, plutôt que substitution par un titre.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Le suffixe hébreu est au pluriel et renvoie aux habitants représentés collectivement par Juda.
- source_word: וַיֵּלְכוּ
  choice: mais ils ont suivi
  rationale: Avec la préposition ב, le verbe exprime ici une conduite conforme à un modèle. « Suivre » rend naturellement le sens en français, et « mais » explicite l’opposition contextuelle.
- source_word: בְּחֻקּוֹת
  choice: les prescriptions
  rationale: Le terme désigne des règles, institutions ou pratiques prescrites; « prescriptions » maintient sa nuance normative sans suggérer nécessairement une loi légitime.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Dans le contexte, le nom désigne le royaume du Nord.
- source_word: אֲשֶׁר עָשׂוּ
  choice: qu’Israël avait établies
  rationale: Le verbe peut signifier faire, établir ou pratiquer. Le pluriel peut prendre Israël comme collectif; « établies » convient à des prescriptions tout en laissant en note l’autre compréhension possible.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme; la translittération préserve le nom personnel sans lui substituer un titre.
- issue: Sujet et sens de עָשׂוּ dans la proposition relative
  choice: qu’Israël avait établies
  alternative: qu’ils pratiquaient; qu’ils avaient faites
  rationale: La forme verbale est plurielle et peut renvoyer à Israël envisagé collectivement ou aux Israélites. Le contexte favorise Israël comme sujet, mais le sens de « pratiquer » demeure possible et est signalé en note.
translation_notes:
  register: Français moderne, digne et accessible. La métaphore littérale « marcher dans » a été rendue par « suivre », plus naturelle en français. L’alternance entre le collectif singulier « Juda » et le pluriel « leur / ils » reproduit le passage hébreu du royaume à ses habitants.
