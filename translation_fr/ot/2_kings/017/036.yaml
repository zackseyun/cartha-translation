source:
  edition: WLC
  text: כִּ֣י אִֽם אֶת יְהוָ֗ה אֲשֶׁר֩ הֶעֱלָ֨ה אֶתְ/כֶ֜ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בְּ/כֹ֧חַ גָּד֛וֹל וּ/בִ/זְר֥וֹעַ נְטוּיָ֖ה אֹת֣/וֹ תִירָ֑אוּ וְ/ל֥/וֹ תִֽשְׁתַּחֲו֖וּ וְ/ל֥/וֹ תִזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/036.yaml
  text: But Yahweh[a], who brought you up from the land of Egypt with great power and with an outstretched arm—you shall fear him, and to him you shall bow down[b], and to him you shall sacrifice.
translation:
  language: fr
  text: Mais Yahweh[a], lui qui vous a fait sortir du pays d’Égypte avec une grande puissance et avec un bras étendu, c’est lui que vous craindrez[b] ; devant lui vous vous prosternerez et vous lui offrirez des sacrifices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire le début : « Plutôt, c’est Yahweh… que vous craindrez. » L’hébreu oppose Yahweh aux autres dieux mentionnés dans le contexte.'
    reason: alternative_reading
  - marker: b
    text: Ici, « craindre » comprend la crainte révérencielle et la fidélité envers Dieu, sans désigner uniquement la terreur.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Au contraire
  rationale: 'Après l’interdiction de craindre d’autres dieux, cette locution introduit l’opposition positive : non pas eux, mais Yahweh. « Au contraire » exprime clairement cette valeur contrastive en français actuel.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: הֶעֱלָה אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: vous a fait sortir du pays d’Égypte
  rationale: Le hifil de עלה évoque littéralement le fait de faire monter, mais, dans la formule de l’Exode, « faire sortir » transmet naturellement en français le mouvement de délivrance hors d’Égypte.
- source_word: בְּכֹחַ גָּדוֹל
  choice: avec une grande puissance
  rationale: La préposition a ici une valeur instrumentale, et « grande puissance » rend fidèlement l’intensité de l’expression.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: et avec le bras étendu
  rationale: Cette image traditionnelle de l’Exode représente la puissance salvatrice de Dieu en action. La répétition de « avec » conserve le parallélisme instrumental de l’hébreu.
- source_word: אֹתוֹ תִירָאוּ
  choice: vous craindrez Yahweh
  rationale: Le verbe « craindre » préserve la formulation et la richesse théologique de ירא, qui comprend ici la crainte révérencielle sans se réduire à la terreur.
- source_word: וְלוֹ תִשְׁתַּחֲווּ
  choice: c’est devant lui que vous vous prosternerez
  rationale: Le verbe désigne concrètement l’action de se courber ou de se prosterner. La tournure emphatique rend la mise en relief de לֹו, « à lui ».
- source_word: וְלוֹ תִזְבָּחוּ
  choice: c’est à lui que vous offrirez des sacrifices
  rationale: « Offrir des sacrifices » explicite naturellement en français l’action cultuelle de זבח, tandis que la tournure « c’est à lui » conserve l’insistance du texte.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme comme nom propre. Sa transcription préserve cette donnée sans lui substituer un titre.
- issue: Sens de ירא dans un contexte d’adoration et d’alliance
  choice: craindrez
  alternative: révérerez
  rationale: « Craindre » conserve la tension du terme hébreu, qui peut englober respect profond, loyauté cultuelle et crainte, au lieu de limiter d’emblée son sens à la seule révérence.
- issue: Force prescriptive des imparfaits hébreux
  choice: 'futur à valeur injonctive : « vous craindrez… vous vous prosternerez… vous offrirez »'
  alternative: 'impératif : « craignez… prosternez-vous… offrez »'
  rationale: Le futur français reflète la forme prescriptive solennelle de l’hébreu tout en restant intelligible dans ce contexte de commandement.
translation_notes:
  register: Français international actuel, digne et accessible. Les tournures emphatiques « c’est devant lui » et « c’est à lui » reproduisent l’insistance hébraïque sans lourdeur excessive ; le vocabulaire cultuel reste concret.
