  to: Mais Yahweh[a], lui qui vous a fait sortir du pays d’Égypte avec une grande puissance et avec un bras étendu, c’est lui que vous craindrez[b] ; devant lui vous vous prosternerez et vous lui offrirez des sacrifices.
