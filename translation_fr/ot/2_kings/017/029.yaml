  text: וַ/יִּהְי֣וּ עֹשִׂ֔ים גּ֥וֹי גּ֖וֹי אֱלֹהָ֑י/ו וַ/יַּנִּ֣יחוּ בְּ/בֵ֣ית הַ/בָּמ֗וֹת אֲשֶׁ֤ר עָשׂוּ֙ הַ/שֹּׁ֣מְרֹנִ֔ים גּ֥וֹי גּוֹי֙ בְּ/עָ֣רֵי/הֶ֔ם אֲשֶׁ֛ר הֵ֥ם יֹשְׁבִ֖ים שָֽׁם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/029.yaml
  text: But each nation kept making its own gods[a], and they set them in the shrines of the high places that the people of Samaria had made, each nation in the cities where they lived.
translation:
  language: fr
  text: Mais chaque peuple fabriquait ses propres dieux et les plaçait dans les sanctuaires des hauts lieux qu’avaient construits les habitants de Samarie[a], chaque peuple dans les villes où il habitait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les Samaritains ».'
    reason: La désignation hébraïque peut être rendue directement par « les Samaritains », mais « les habitants de Samarie » évite une possible lecture anachronique.
lexical_decisions:
- source_word: וַיִּהְיוּ עֹשִׂים
  choice: fabriquait
  rationale: La construction היה + participe exprime ici une action habituelle ou répétée dans le passé. L’imparfait français en rend naturellement la durée et le caractère coutumier.
- source_word: גּוֹי גּוֹי
  choice: chaque peuple
  rationale: 'La répétition a une valeur distributive : chacun des peuples agit séparément. « Peuple » convient mieux ici que « nation » au contexte des populations déplacées.'
- source_word: אֱלֹהָיו
  choice: ses propres dieux
  rationale: Le suffixe renvoie distributivement à chaque peuple. « Propres » fait ressortir que chacun fabriquait les divinités qui lui étaient particulières.
- source_word: וַיַּנִּיחוּ
  choice: les plaçait
  rationale: Le verbe signifie déposer ou placer. L’imparfait s’accorde avec la description d’une pratique répétée et avec le sujet distributif « chaque peuple ».
- source_word: בְּבֵית הַבָּמוֹת
  choice: dans les sanctuaires des hauts lieux
  rationale: L’expression désigne les édifices cultuels associés aux hauts lieux. « Sanctuaires » transmet clairement le sens en français moderne sans conserver le calque obscur « maison des hauts lieux ».
- source_word: אֲשֶׁר עָשׂוּ הַשֹּׁמְרֹנִים
  choice: qu’avaient construits les habitants de Samarie
  rationale: Le terme désigne ici les gens de Samarie. Cette formulation évite d’évoquer automatiquement la communauté samaritaine d’une époque postérieure.
- source_word: בְּעָרֵיהֶם אֲשֶׁר הֵם יֹשְׁבִים שָׁם
  choice: dans les villes où il habitait
  rationale: Le singulier reprend distributivement « chaque peuple » et rend la proposition locative de façon naturelle.
theological_decisions:
- issue: Sens historique de הַשֹּׁמְרֹנִים
  choice: les habitants de Samarie
  alternative: les Samaritains
  rationale: Dans ce récit, le mot renvoie aux habitants de la région ou de la ville de Samarie, sans exiger l’identification avec la communauté religieuse samaritaine connue ultérieurement. L’alternative littérale est néanmoins signalée.
translation_notes:
  register: Français international moderne, courant et digne. L’imparfait présente ces actes comme des pratiques habituelles; la reprise « chaque peuple » conserve l’insistance distributive de l’hébreu.
