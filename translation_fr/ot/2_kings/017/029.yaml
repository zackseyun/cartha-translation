  source_fidelity: Le texte rend correctement la valeur distributive de גּוֹי גּוֹי par « chaque peuple », le possessif de אֱלֹהָיו par « ses propres dieux », et la nuance habituelle de וַיִּהְיוּ עֹשִׂים par l’imparfait « fabriquait ». « Les plaçait » exprime adéquatement וַיַּנִּיחוּ dans la présentation distributive de l’ensemble. « Sanctuaires des hauts lieux » est une formulation idiomatique qui transmet la fonction cultuelle de בֵּית הַבָּמוֹת sans calque inutile. La clause finale conserve l’idée que chaque peuple agit dans les villes où il réside.
