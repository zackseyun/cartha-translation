id: 2KI.17.16
reference: 2 Kings 17:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּעַזְב֗וּ אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעֲשׂ֥וּ לָ/הֶ֛ם מַסֵּכָ֖ה שנים עֲגָלִ֑ים וַ/יַּעֲשׂ֣וּ אֲשֵׁירָ֗ה וַ/יִּֽשְׁתַּחֲווּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַ/יַּעַבְד֖וּ אֶת הַ/בָּֽעַל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/016.yaml
  text: And they abandoned all the commandments of Yahweh their God[a], and made for themselves cast images, two calves, and made an Asherah, and bowed down to all the host of heaven, and served Baal.
translation:
  language: fr
  text: Ils abandonnèrent tous les commandements de Yahweh, leur Dieu, se fabriquèrent deux veaux en métal fondu, firent une ashéra[a], se prosternèrent devant toute l’armée du ciel et servirent Baal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «un objet cultuel d’Ashéra». Le terme hébreu peut désigner la déesse cananéenne Ashéra ou l’objet cultuel qui lui était associé.
    reason: Alternative lexicale nécessaire pour préserver l’ambiguïté du terme hébreu.
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: abandonnèrent
  rationale: Le verbe exprime ici l’abandon des exigences de l’alliance, et non un simple éloignement.
- source_word: כָּל מִצְוֺת
  choice: tous les commandements
  rationale: Cette formulation conserve explicitement כָּל et convient au contexte de l’alliance.
- source_word: יְהוָה אֱלֹהֵיהֶם
  choice: Yahweh, leur Dieu
  rationale: Le nom divin est translittéré et le suffixe possessif, important dans ce contexte d’alliance, est conservé.
- source_word: וַיַּעֲשׂוּ לָהֶם מַסֵּכָה שנים עֲגָלִים
  choice: se fabriquèrent deux veaux en métal fondu
  rationale: Cette tournure française naturelle rend le datif réfléchi, identifie les deux veaux et conserve le procédé de fabrication indiqué par מַסֵּכָה.
- source_word: אֲשֵׁירָה
  choice: une ashéra
  rationale: La translittération préserve l’ambiguïté entre la divinité cananéenne et l’objet cultuel qui lui était associé; le contexte de fabrication favorise l’objet sans l’imposer entièrement.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: se prosternèrent
  rationale: Le choix conserve le geste physique de prosternation, sans le confondre avec le verbe suivant qui désigne le service cultuel.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: devant toute l’armée du ciel
  rationale: L’expression désigne l’ensemble des corps ou puissances célestes; «armée du ciel» en préserve l’image.
- source_word: וַיַּעַבְדוּ אֶת הַבָּעַל
  choice: servirent Baal
  rationale: «Servirent» rend la nuance cultuelle de עבד tout en maintenant sa distinction avec la prosternation; l’article hébreu n’est pas reproduit devant le nom propre en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel; sa translittération le distingue d’un titre et conserve sa fonction dans le cadre de l’alliance.
- issue: Référent de אֲשֵׁירָה
  choice: une ashéra
  alternative: un poteau d’Ashéra
  rationale: Le fait qu’on la «fasse» suggère un objet cultuel, mais le terme hébreu peut aussi renvoyer à la déesse; la translittération et la note préservent cette ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La coordination verbale rapide du récit hébreu est conservée sans répétition mécanique de «et». «En métal fondu» précise naturellement en français le type d’images fabriquées.
