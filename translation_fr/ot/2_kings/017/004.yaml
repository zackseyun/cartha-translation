source:
  edition: WLC
  text: וַ/יִּמְצָא֩ מֶֽלֶךְ אַשּׁ֨וּר בְּ/הוֹשֵׁ֜עַ קֶ֗שֶׁר אֲשֶׁ֨ר שָׁלַ֤ח מַלְאָכִים֙ אֶל ס֣וֹא מֶֽלֶךְ מִצְרַ֔יִם וְ/לֹא הֶעֱלָ֥ה מִנְחָ֛ה לְ/מֶ֥לֶךְ אַשּׁ֖וּר כְּ/שָׁנָ֣ה בְ/שָׁנָ֑ה וַֽ/יַּעַצְרֵ֨/הוּ֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּאַסְרֵ֖/הוּ בֵּ֥ית כֶּֽלֶא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/004.yaml
  text: Then the king of Assyria discovered a conspiracy in Hoshea[a], because he had sent messengers to So king of Egypt and had not sent up tribute to the king of Assyria, as year by year[d][c][b]. So the king of Assyria confined him and bound him in prison.
translation:
  language: fr
  text: Le roi d’Assyrie découvrit qu’Osée conspirait[a], car celui-ci avait envoyé des messagers à Sô, roi d’Égypte[b], et n’avait pas versé le tribut[c] au roi d’Assyrie comme il le faisait chaque année. Alors le roi d’Assyrie le fit arrêter[d] et l’enchaîna en prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « trouva une conspiration en Osée »; l’expression signifie qu’il découvrit chez lui un complot ou une trahison.'
    reason: lexical_alternative
  - marker: b
    text: « Sô » transcrit le nom hébreu. L’identité historique de ce roi d’Égypte reste incertaine.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « n’avait pas fait monter le tribut »; on peut aussi traduire : « n’avait pas apporté le tribut ».'
    reason: lexical_alternative
  - marker: d
    text: 'L’hébreu distingue deux actions : le roi d’Assyrie fit d’abord arrêter ou détenir Osée, puis il l’enchaîna en prison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... בְּהוֹשֵׁעַ קֶשֶׁר
  choice: découvrit qu’Osée conspirait
  rationale: Rend naturellement en français l’idiome hébreu, littéralement « trouva une conspiration en Osée », sans gommer l’idée d’un complot politique.
- source_word: שָׁלַח מַלְאָכִים
  choice: avait envoyé des messagers
  rationale: « Messagers » conserve le sens large du terme hébreu; le contexte indique une mission diplomatique.
- source_word: סוֹא
  choice: Sô
  rationale: Translittération française du nom hébreu, dont l’identification historique demeure incertaine.
- source_word: מִנְחָה
  choice: tribut
  rationale: Dans le cadre des relations entre un souverain assyrien et son vassal, le terme désigne un tribut plutôt qu’un simple présent.
- source_word: הֶעֱלָה
  choice: versé
  rationale: Formulation française courante pour le paiement d’un tribut; le sens littéral « faire monter » serait peu naturel ici.
- source_word: כְּשָׁנָה בְשָׁנָה
  choice: comme il le faisait chaque année
  rationale: Exprime clairement la régularité annuelle de l’idiome hébreu et son lien implicite avec le versement du tribut.
- source_word: וַיַּעַצְרֵהוּ
  choice: le fit arrêter
  rationale: Le verbe indique ici la saisie ou la détention d’Osée; cette traduction maintient une action distincte de son enchaînement et de son emprisonnement.
- source_word: וַיַּאַסְרֵהוּ בֵּית כֶּלֶא
  choice: l’enchaîna en prison
  rationale: Préserve le sens fondamental de « lier, enchaîner » et rend idiomatiquement le lieu de détention.
theological_decisions: []
