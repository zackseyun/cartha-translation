  text: וַ/יֵּֽלְכוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/כָל חַטֹּ֥אות יָרָבְעָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה לֹא סָ֖רוּ מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/022.yaml
  text: And the children of Israel walked in all the sins that Jeroboam had committed[a]; they did not turn away from them.
translation:
  language: fr
  text: Les Israélites pratiquèrent tous les péchés que Jéroboam avait commis ; ils ne s’en détournèrent pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils ne se détournèrent pas d’elle » ; le pronom hébreu au singulier renvoie probablement, de manière collective, à la conduite pécheresse qui vient d’être décrite.'
    reason: Préciser le nombre grammatical du texte hébreu et préserver l’ambiguïté de son référent.
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: suivirent
  rationale: Avec la préposition ב, הלך décrit ici une conduite, le fait de suivre une voie. « Suivirent » restitue naturellement cette valeur morale en français moderne.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation française courante exprime clairement le groupe national visé par l’expression hébraïque, sans l’ambiguïté moderne possible de « fils d’Israël ».
- source_word: בְּכָל חַטֹּאות
  choice: tous les péchés
  rationale: Le pluriel désigne l’ensemble des pratiques coupables évoquées. Avec « suivre », le français n’exige pas de préposition correspondant explicitement à ב.
- source_word: אֲשֶׁר עָשָׂה
  choice: que Jéroboam avait commis
  rationale: Le verbe עשה signifie littéralement « faire », mais « commettre des péchés » est l’expression française idiomatique et conserve exactement la portée morale du contexte.
- source_word: לֹא סָרוּ
  choice: ils ne s’en détournèrent pas
  rationale: סור exprime le fait de s’écarter ou de se détourner. La tournure choisie rend leur persistance dans cette conduite.
- source_word: מִמֶּנָּה
  choice: en
  rationale: Le pronom hébreu est féminin singulier, probablement avec une valeur collective renvoyant à la conduite pécheresse évoquée. Le français « en » préserve discrètement cette référence sans imposer un antécédent grammatical pluriel.
theological_decisions:
- issue: Référent du suffixe féminin singulier dans מִמֶּנָּה après le pluriel « péchés »
  choice: Employer « s’en détournèrent », qui laisse le référent collectif implicite
  alternative: « ne se détournèrent d’aucun d’eux », avec renvoi explicite aux péchés au pluriel
  rationale: Le singulier hébreu peut viser collectivement la voie ou la conduite pécheresse qui vient d’être décrite. La formulation française retenue conserve cette tension référentielle au lieu de la résoudre silencieusement en faveur du pluriel.
translation_notes:
  register: Français international moderne, simple et digne. « Les Israélites » est plus naturel aujourd’hui que « les fils d’Israël ». Le point-virgule souligne la continuité entre l’adoption des péchés de Jéroboam et le refus persistant de s’en détourner.
