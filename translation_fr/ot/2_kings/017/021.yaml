base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/021.yaml
  text: For Israel tore itself away from the house of David[a], and they made Jeroboam son of Nebat king; and Jeroboam drove Israel from following Yahweh and caused them to commit a great sin.
translation:
  language: fr
  text: En effet, Israël se détacha de la maison de David[a]. Les Israélites établirent Jéroboam, fils de Nebath, comme roi. Jéroboam détourna Israël de Yahweh[b] et amena les Israélites à commettre un grand péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il arracha Israël à la maison de David. » La syntaxe hébraïque permet de comprendre « Israël » soit comme le sujet, soit comme l’objet du verbe.'
    reason: ambiguïté syntaxique
  - marker: b
    text: 'Ou : « écarta Israël de Yahweh ». Le verbe hébreu peut évoquer le fait de chasser, d’écarter ou d’égarer.'
    reason: variante lexicale
lexical_decisions:
- source_word: קָרַע יִשְׂרָאֵל מֵעַל בֵּית דָּוִד
  choice: Israël se détacha de la maison de David
  rationale: קָרַע évoque littéralement le fait de déchirer ou d’arracher. La forme pronominale « se détacha » exprime naturellement en français la rupture politique avec l’autorité dynastique de David, tout en conservant dans une note l’autre analyse syntaxique possible.
- source_word: וַיַּמְלִיכוּ אֶת יָרָבְעָם בֶּן נְבָט
  choice: Les Israélites établirent comme roi Jéroboam, fils de Nebath
  rationale: Le hiphil de מלך signifie ici installer quelqu’un comme roi. Le sujet implicite du pluriel est explicité par « les Israélites » pour éviter un pronom français sans antécédent clair.
- source_word: וַיַּדַּח
  choice: détourna
  rationale: נדח peut exprimer l’action de chasser, d’écarter ou d’égarer. « Détourna » convient au contexte d’apostasie sans effacer l’idée d’une action exercée par Jéroboam sur Israël.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: de Yahweh
  rationale: L’expression hébraïque signifie littéralement éloigner quelqu’un de derrière Yahweh, c’est-à-dire l’empêcher de continuer à le suivre. En français, « détourner de Yahweh » rend naturellement cet idiome.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, conformément à la pratique éditoriale indiquée, plutôt que par un titre substitutif.
- source_word: וְהֶחֱטִיאָם חֲטָאָה גְדוֹלָה
  choice: amena les Israélites à commettre un grand péché
  rationale: Le hiphil de חטא est causatif. Cette formulation conserve la responsabilité exercée par Jéroboam et évite une répétition maladroite du verbe « pécher » devant le nom « péché ».
theological_decisions:
- issue: Sujet de קָרַע au début du verset
  choice: Israël se détacha de la maison de David
  alternative: Il arracha Israël à la maison de David
  rationale: La syntaxe permet de lire « Israël » comme sujet, mais le verbe masculin singulier autorise aussi un sujet implicite (« il », vraisemblablement Yahweh dans le contexte) avec Israël comme objet. La traduction principale suit la lecture où Israël est sujet et la note préserve l’ambiguïté réelle.
- issue: Portée de וַיַּדַּח dans l’apostasie d’Israël
  choice: Jéroboam détourna Israël de Yahweh
  alternative: Jéroboam éloigna Israël de la suite de Yahweh
  rationale: « Détourna » exprime à la fois l’action causale de Jéroboam et l’abandon de la fidélité à Yahweh, sans préciser davantage que le texte la nature de cette influence.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve explicitement sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Les phrases sont légèrement segmentées pour la lisibilité. « Établir comme roi » garde la valeur causative de l’hébreu, tandis que « maison de David » conserve la désignation dynastique biblique.
