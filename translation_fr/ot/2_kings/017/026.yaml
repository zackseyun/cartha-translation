  text: וַ/יֹּאמְר֗וּ לְ/מֶ֣לֶךְ אַשּׁוּר֮ לֵ/אמֹר֒ הַ/גּוֹיִ֗ם אֲשֶׁ֤ר הִגְלִ֨יתָ֙ וַ/תּ֨וֹשֶׁב֙ בְּ/עָרֵ֣י שֹׁמְר֔וֹן לֹ֣א יָֽדְע֔וּ אֶת מִשְׁפַּ֖ט אֱלֹהֵ֣י הָ/אָ֑רֶץ וַ/יְשַׁלַּח בָּ֣/ם אֶת הָ/אֲרָי֗וֹת וְ/הִנָּ/ם֙ מְמִיתִ֣ים אוֹתָ֔/ם כַּ/אֲשֶׁר֙ אֵינָ֣/ם יֹדְעִ֔ים אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/026.yaml
  text: So they spoke to the king of Assyria[a], saying, “The nations that you have exiled and settled in the cities of Samaria do not know the law of the god of the land, so he has sent lions among them; and behold, they are killing them[b], because they do not know the law of the god of the land.”
translation:
  language: fr
  text: 'Ils dirent au roi d’Assyrie : « Les populations que tu as déportées et installées dans les villes de Samarie ne connaissent pas la règle du dieu du pays[a]. Il a donc envoyé parmi elles des lions, et voilà qu’ils les tuent, parce qu’elles ne connaissent pas la règle du dieu du pays[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « du Dieu du pays ». La minuscule dans le texte principal reflète la manière dont les locuteurs parlent de la divinité locale ; dans le récit, il s’agit du Dieu d’Israël.'
    reason: alternative_reading
  - marker: b
    text: Le mot traduit par « règle » peut aussi signifier « loi », « coutume » ou « pratique prescrite » ; il désigne ici la manière dont le dieu du pays devait être honoré.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹיִם
  choice: les populations
  rationale: Dans ce contexte, le terme désigne plusieurs groupes ethniques déplacés par l’Assyrie. « Populations » est naturel en français et convient mieux que « nations » à des groupes réinstallés dans des villes.
- source_word: הִגְלִיתָ
  choice: tu as déportées
  rationale: Le hiphil de גלה exprime un déplacement forcé. « Déporter » en restitue clairement le caractère coercitif.
- source_word: וַתּוֹשֶׁב
  choice: et installées
  rationale: La forme causative de ישׁב indique que le roi a fait habiter ces populations dans un nouveau lieu. « Installer » l’exprime naturellement sans surcharge.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: dans les villes de Samarie
  rationale: Cette formulation conserve le complément construit et laisse « Samarie » désigner la région, conformément au contexte.
- source_word: מִשְׁפַּט
  choice: la règle
  rationale: Ici, מִשְׁפַּט désigne la norme ou la pratique prescrite pour le culte de la divinité locale. « Règle » garde cette idée d’exigence sans suggérer uniquement une coutume sociale ni un verdict judiciaire.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: le dieu du pays
  rationale: La minuscule préserve le point de vue territorial et païen exprimé dans le discours rapporté, tout en laissant ouverte l’identification du référent au Dieu d’Israël.
- source_word: וַיְשַׁלַּח בָּם אֶת הָאֲרָיוֹת
  choice: Il a donc envoyé parmi elles des lions
  rationale: « Parmi elles » rend בם sans imposer exclusivement l’idée hostile de « contre elles » ; « donc » explicite la relation causale portée par le contexte.
- source_word: וְהִנָּם מְמִיתִים אוֹתָם
  choice: qui, maintenant, les tuent
  rationale: La tournure relative évite un « voici » peu naturel dans ce rapport indirect, tandis que « maintenant » conserve la valeur présentative et actuelle de וְהִנָּם avec le participe exprimant l’action en cours.
- source_word: כַּאֲשֶׁר אֵינָם יֹדְעִים
  choice: parce qu’elles ne connaissent pas
  rationale: Dans le contexte, כַּאֲשֶׁר introduit la cause attribuée aux attaques ; « parce que » en donne le sens clairement.
theological_decisions:
- issue: Majuscule ou minuscule dans « dieu du pays »
  choice: « dieu » avec une minuscule dans le texte principal
  alternative: « Dieu du pays » avec une majuscule
  rationale: Le discours présente la divinité selon la conception territoriale des populations déplacées. La minuscule conserve leur perspective sans nier que, dans le cadre narratif, il s’agit du Dieu d’Israël.
- issue: Sens cultuel de מִשְׁפַּט
  choice: « règle »
  alternative: « loi », « coutume » ou « pratique prescrite »
  rationale: Le mot renvoie ici à la manière dont la divinité du pays doit être honorée. « Règle » préserve à la fois la dimension normative et l’imprécision du terme hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct reste fluide, avec des termes concrets (« déportées », « installées », « lions ») et sans archaïsmes. L’accord au féminin pluriel reprend « populations ».
