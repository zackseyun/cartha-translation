source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי חָטְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/יהוָ֣ה אֱלֹהֵי/הֶ֔ם הַ/מַּעֲלֶ֤ה אֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/תַּ֕חַת יַ֖ד פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יִּֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/007.yaml
  text: And this happened because the children of Israel had sinned against Yahweh their God[a], who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt[b], and had feared other gods.
translation:
  language: fr
  text: Cela arriva parce que les Israélites avaient péché contre Yahweh, leur Dieu, qui les avait fait sortir du pays d’Égypte, les délivrant du pouvoir de Pharaon, roi d’Égypte[a], et parce qu’ils avaient craint d’autres dieux.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de dessous la main de Pharaon, roi d’Égypte » ; cette expression désigne son pouvoir ou sa domination.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avaient révéré d’autres dieux » ou « avaient adoré d’autres dieux ». Le verbe hébreu signifie d’abord « craindre », mais peut désigner une crainte révérencielle qui se manifeste par le culte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Cela arriva parce que
  rationale: Cette formulation française naturelle conserve à la fois le développement narratif et la valeur causale de כִּי.
- source_word: חָטְאוּ ... לַיהוָה
  choice: avaient péché contre Yahweh
  rationale: Le plus-que-parfait convient à l’explication rétrospective, et la préposition associée à חטא exprime ici l’idée de pécher contre quelqu’un.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: En français moderne, ce terme désigne naturellement le peuple d’Israël sans perdre la portée nationale et collective de l’expression hébraïque.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Le singulier français avec le possessif restitue directement la relation exprimée par le suffixe hébreu.
- source_word: הַמַּעֲלֶה אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: qui les avait fait sortir du pays d’Égypte
  rationale: Bien que עלה signifie littéralement « faire monter », « faire sortir d’Égypte » est l’expression française idiomatique correspondant à cet emploi exodique.
- source_word: מִתַּחַת יַד פַּרְעֹה
  choice: les délivrant du pouvoir du pharaon
  rationale: L’image hébraïque « de dessous la main » désigne la domination. La traduction en explicite le sens dans un français clair, tout en signalant l’image littérale en note.
- source_word: וַיִּירְאוּ אֱלֹהִים אֲחֵרִים
  choice: et parce qu’ils avaient craint d’autres dieux
  rationale: « Craindre » conserve le noyau lexical de ירא et l’ambiguïté entre peur, révérence et dévotion cultuelle; la répétition de « parce que » clarifie en français que ce second acte fait aussi partie de la cause annoncée.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, sans le remplacer par un titre.
- issue: Portée religieuse de ירא devant « d’autres dieux »
  choice: avaient craint d’autres dieux
  alternative: avaient adoré d’autres dieux
  rationale: Dans ce contexte, le verbe peut inclure la vénération et le culte, mais le traduire uniquement par « adorer » réduirait la gamme sémantique de l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. « Les Israélites » évite le tour aujourd’hui moins naturel « les enfants d’Israël ». La syntaxe causale est rendue explicite sans supprimer la coordination du texte hébreu.
