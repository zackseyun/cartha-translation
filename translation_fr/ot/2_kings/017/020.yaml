  source_fidelity: 'Le texte français rend avec fidélité la séquence verbale hébraïque : Yahweh rejette, afflige, livre à des pillards, puis expulse de sa présence. « Toute la descendance d’Israël » conserve la portée globale de כָּל־זֶרַע יִשְׂרָאֵל sans la circonscrire interprétativement au royaume du Nord. « Les livra au pouvoir de pillards » restitue naturellement l’idiome « donner entre les mains de ».'
  naturalness: Le français est moderne, clair et d’un registre biblique sobre. La segmentation en deux phrases ne nuit ni à l’enchaînement narratif ni à la force du jugement. « Jusqu’à ce qu’il les ait chassés loin de sa présence » est idiomatique et transmet correctement l’aboutissement de l’expulsion.
  terminology: « Yahweh » correspond au tétragramme ; « descendance », « affligea », « pillards » et « présence » sont précis et accessibles. Les notes lexicales sont exactes dans leur fonction et leurs ancres sont toutes présentes et correctement placées.
