source:
  edition: WLC
  text: וַ/יִּמְאַ֨ס יְהוָ֜ה בְּ/כָל זֶ֤רַע יִשְׂרָאֵל֙ וַ/יְעַנֵּ֔/ם וַֽ/יִּתְּנֵ֖/ם בְּ/יַד שֹׁסִ֑ים עַ֛ד אֲשֶׁ֥ר הִשְׁלִיכָ֖/ם מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/020.yaml
  text: So Yahweh rejected all the offspring of Israel[a], and afflicted them and gave them into the hand of plunderers[c][b], until he had cast them out from his presence.
translation:
  language: fr
  text: Alors Yahweh rejeta toute la descendance d’Israël[a]. Il les affligea et les livra au pouvoir de pillards[b], jusqu’à ce qu’il les ait chassés loin de sa présence[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la postérité d’Israël » ; littéralement « toute la semence d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les donna dans la main de pillards ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « loin de devant sa face ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: rejeta
  rationale: Le verbe מָאַס exprime ici un refus décisif dans un contexte de jugement. « Rejeta » conserve cette force sans ajouter la nuance affective de mépris.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de représenter directement le tétragramme du texte hébreu.
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: toute la descendance d’Israël
  rationale: זֶרַע, littéralement « semence », désigne collectivement la postérité ou la descendance. Cette formulation est naturelle en français et ne restreint pas la portée de « toute ».
- source_word: וַיְעַנֵּם
  choice: Il les affligea
  rationale: Au piel, ענה peut signifier affliger, humilier ou opprimer. « Affligea » garde une portée assez large pour les souffrances liées au jugement.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: les livra au pouvoir de
  rationale: L’expression idiomatique « donner dans la main de » signifie placer sous le pouvoir d’un autre. La formulation choisie transmet clairement ce sens en français actuel.
- source_word: שֹׁסִים
  choice: pillards
  rationale: Le participe désigne ceux qui dépouillent ou pillent. « Pillards » est précis, courant et conserve la dimension prédatrice du terme.
- source_word: עַד אֲשֶׁר
  choice: jusqu’à ce que
  rationale: La locution introduit le terme auquel aboutit la suite des actes de jugement.
- source_word: הִשְׁלִיכָם
  choice: il les ait chassés
  rationale: השליך signifie littéralement jeter ou lancer. Dans ce contexte, « chasser » rend naturellement l’idée d’une expulsion sans répéter « rejeta ».
- source_word: מִפָּנָיו
  choice: loin de sa présence
  rationale: Littéralement « de devant sa face », l’expression indique qu’ils sont expulsés de la présence de Yahweh.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte le nom propre divin. Sa translittération préserve celui-ci au lieu de lui substituer un titre.
- issue: Portée de « toute la descendance d’Israël »
  choice: Conserver la formulation globale sans en préciser davantage le référent
  alternative: Limiter explicitement l’expression au royaume du Nord, ou l’étendre explicitement à chaque descendant de Jacob
  rationale: Le contexte historique éclaire l’expression, mais l’hébreu dit simplement « toute la descendance d’Israël ». La traduction conserve cette tension sans imposer une délimitation interprétative.
- issue: Sens de l’expulsion loin de la présence divine
  choice: Conserver l’image relationnelle et judiciaire de la présence de Yahweh
  alternative: Réduire l’expression à un éloignement géographique ou à une invisibilité littérale
  rationale: מִפָּנָיו est un idiome de présence. La traduction n’explicite pas davantage la nature de l’exclusion.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases ont été légèrement segmentées pour assurer la clarté tout en conservant la succession des actes en hébreu. « Au pouvoir de » traduit naturellement l’idiome de la main, tandis que les notes gardent les images hébraïques significatives.
