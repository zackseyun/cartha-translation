  text: וַ/יָּ֣עַד יְהוָ֡ה בְּ/יִשְׂרָאֵ֣ל וּ/בִ/יהוּדָ֡ה בְּ/יַד֩ כָּל נביא/ו כָל חֹזֶ֜ה לֵ/אמֹ֗ר שֻׁ֝֠בוּ מִ/דַּרְכֵי/כֶ֤ם הָֽ/רָעִים֙ וְ/שִׁמְרוּ֙ מִצְוֺתַ֣/י חֻקּוֹתַ֔/י כְּ/כָ֨ל הַ/תּוֹרָ֔ה אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבֹֽתֵי/כֶ֑ם וַֽ/אֲשֶׁר֙ שָׁלַ֣חְתִּי אֲלֵי/כֶ֔ם בְּ/יַ֖ד עֲבָדַ֥/י הַ/נְּבִיאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/013.yaml
  text: Yet Yahweh warned Israel and Judah by every one of his prophets and every seer, saying, “Turn from your evil ways and keep my commandments and my statutes, according to all the law that I commanded your fathers and that I sent to you by my servants the prophets.”
translation:
  language: fr
  text: 'Pourtant, Yahweh avertit solennellement[a] Israël et Juda par chacun de ses prophètes et par chaque voyant : « Détournez-vous de vos mauvaises voies et gardez mes commandements et mes prescriptions, conformément à toute la Loi que j’ai prescrite à vos pères[b] et que je vous ai transmise par l’intermédiaire de mes serviteurs les prophètes[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu peut aussi se traduire : « témoigna contre Israël et Juda » ; il évoque un avertissement ou un témoignage solennel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vos ancêtres ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « par la main de mes serviteurs les prophètes » ; c’est-à-dire par leur intermédiaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַד
  choice: avertit solennellement
  rationale: Le hiphil de עוּד exprime ici un avertissement ou témoignage pressant. « Avertit solennellement » rend sa force sans imposer la lecture plus judiciaire « témoigna contre ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: Israël et Juda
  rationale: Avec le verbe עוּד, la préposition ב peut marquer les destinataires ou ceux contre lesquels porte le témoignage. La construction française directe reste naturelle et n'explicite pas excessivement cette nuance.
- source_word: בְּיַד כָּל נביא/ו כָל חֹזֶה
  choice: par chacun de ses prophètes et par chaque voyant
  rationale: ביד est un idiome instrumental. « Chacun de ses prophètes » et « chaque voyant » préservent la force distributive de כָּל ... כָּל ainsi que la distinction entre prophète et voyant.
- source_word: שֻׁבוּ מִדַּרְכֵיכֶם הָרָעִים
  choice: Détournez-vous de vos mauvaises voies
  rationale: שׁוב signifie se tourner ou revenir; avec מן, « se détourner de » convient précisément. « Voies » conserve la métaphore morale de דֶּרֶךְ.
- source_word: וְשִׁמְרוּ מִצְוֺתַי חֻקּוֹתַי
  choice: et gardez mes commandements et mes prescriptions
  rationale: « Gardez » restitue le sens covenantal de שׁמר. Les deux substantifs distincts sont maintenus; « prescriptions » rend חֻקּוֹת dans un français juridique et biblique naturel.
- source_word: כְּכָל הַתּוֹרָה
  choice: conformément à toute la Loi
  rationale: Dans ce contexte de commandements et de prescriptions, « Loi » convient à תּוֹרָה; « toute » préserve כָּל.
- source_word: אֲשֶׁר צִוִּיתִי אֶת אֲבֹתֵיכֶם
  choice: que j’ai prescrite à vos pères
  rationale: Le verbe « prescrire » permet un complément indirect naturel en français tout en rendant צוה. « Vos pères » conserve la formulation masculine et historique de אָבוֹת, avec l'autre possibilité signalée en note.
- source_word: וַאֲשֶׁר שָׁלַחְתִּי אֲלֵיכֶם בְּיַד עֲבָדַי הַנְּבִיאִים
  choice: et que je vous ai transmise par l’intermédiaire de mes serviteurs les prophètes
  rationale: « Transmise » rend idiomatiquement l'envoi de la Loi ou instruction vers le peuple; « par l'intermédiaire de » explicite sans surcharge l'instrumental ביד. La formulation garde le rattachement grammatical à la Loi tout en laissant perceptible la médiation prophétique.
theological_decisions:
- issue: Référent de « que je vous ai transmise »
  choice: La proposition relative se rattache grammaticalement à « toute la Loi », comprise comme transmise au peuple par les prophètes.
  alternative: Elle peut viser plus largement le message prophétique, ou reprendre l'exhortation à se détourner du mal et à garder les commandements.
  rationale: L'enchaînement syntaxique favorise le rattachement à la Loi, mais le texte associe aussi cette Loi à sa proclamation prophétique renouvelée. La traduction conserve la construction relative sans ajouter d'explication doctrinale.
translation_notes:
  register: Français international moderne, digne et lisible. Le vocabulaire covenantal demeure reconnaissable sans archaïsme excessif. « Voyant » est conservé pour distinguer חֹזֶה de « prophète », et les marqueurs de notes [a], [b] et [c] figurent tous dans le texte.
