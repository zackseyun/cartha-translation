id: 2KI.17.32
reference: 2 Kings 17:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּהְי֥וּ יְרֵאִ֖ים אֶת יְהוָ֑ה וַ/יַּעֲשׂ֨וּ לָ/הֶ֤ם מִ/קְצוֹתָ/ם֙ כֹּהֲנֵ֣י בָמ֔וֹת וַ/יִּהְי֛וּ עֹשִׂ֥ים לָ/הֶ֖ם בְּ/בֵ֥ית הַ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/032.yaml
  text: They feared Yahweh[a], and they appointed for themselves from among all their people priests of the high places[b], who were serving for them in the houses of the high places.
translation:
  language: fr
  text: Ils craignaient Yahweh et désignèrent pour eux-mêmes, parmi les leurs[a], des prêtres des hauts lieux[b], qui officiaient pour eux dans les sanctuaires des hauts lieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi toutes leurs couches sociales ». L’expression hébraïque est idiomatique et peut évoquer un choix fait dans l’ensemble de la population, sans distinction appropriée.'
    reason: lexical_alternative
  - marker: b
    text: Les « hauts lieux » étaient des lieux de culte locaux, par opposition au sanctuaire central.
    reason: cultural_note
lexical_decisions:
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: craignaient Yahweh
  rationale: « Craindre » conserve l’expression hébraïque, qui peut inclure la révérence religieuse, sans la réduire au simple fait de rendre un culte ni résoudre la tension avec les pratiques décrites ensuite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel plutôt que de lui substituer le titre « le Seigneur ».
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: désignèrent pour eux-mêmes
  rationale: Avec des personnes investies d’une fonction, עשה peut exprimer leur établissement ou leur nomination. « Désignèrent » est naturel en français et לָהֶם marque que cette désignation était faite pour leur propre service.
- source_word: מִקְצוֹתָם
  choice: parmi les leurs
  rationale: L’expression, littéralement liée aux « extrémités » du groupe, est idiomatique et discutée. Cette formulation indique une sélection au sein de leur propre population sans imposer le sens contesté « parmi les plus humbles ».
- source_word: כֹּהֲנֵי בָמוֹת
  choice: prêtres des hauts lieux
  rationale: Cette formulation conserve le terme cultuel traditionnel désignant les lieux de culte locaux, souvent illégitimes dans le récit des Rois.
- source_word: וַיִּהְיוּ עֹשִׂים לָהֶם
  choice: qui officiaient pour eux
  rationale: La construction périphrastique décrit l’activité continue des prêtres au service de la population. « Officiaient » rend le contexte cultuel sans préciser un rite absent du verbe.
- source_word: בְּבֵית הַבָּמוֹת
  choice: dans les sanctuaires des hauts lieux
  rationale: Le singulier constructif peut avoir une valeur collective. « Sanctuaires » rend naturellement en français les bâtiments cultuels associés aux hauts lieux, sans introduire l’idée plus spécifique de grands temples.
theological_decisions:
- issue: Tension entre la crainte de Yahweh et le culte pratiqué dans les hauts lieux
  choice: Coordination simple par « et »
  alternative: « mais », « pourtant » ou « tout en prétendant craindre Yahweh »
  rationale: L’hébreu juxtapose les deux réalités par une conjonction ordinaire. La traduction conserve cette tension sans déclarer que leur crainte était feinte ni ajouter explicitement une opposition que le lecteur peut déduire du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche de l’enchaînement hébraïque, tandis que « désignèrent » et « officiaient » rendent naturellement les fonctions évoquées. Les marqueurs [a] et [b] figurent dans le texte.
