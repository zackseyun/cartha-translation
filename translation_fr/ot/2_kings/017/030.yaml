reference: 2 Kings 17:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַנְשֵׁ֣י בָבֶ֗ל עָשׂוּ֙ אֶת סֻכּ֣וֹת בְּנ֔וֹת וְ/אַנְשֵׁי כ֔וּת עָשׂ֖וּ אֶת נֵֽרְגַ֑ל וְ/אַנְשֵׁ֥י חֲמָ֖ת עָשׂ֥וּ אֶת אֲשִׁימָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/030.yaml
  text: The men of Babylon made Succoth-benoth[a], the men of Cuth made Nergal[b], and the men of Hamath made Ashima.
translation:
  language: fr
  text: Les hommes[b] de Babylone firent Soukkoth-Benoth[a] ; les hommes de Kouth firent Nergal, et les hommes de Hamath firent Ashima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Soukkoth-Benoth est probablement le nom d’une divinité étrangère ou d’un objet cultuel. Le sens de ce nom étant incertain, il est translittéré plutôt que traduit.
    reason: cultural_note
  - marker: b
    text: Ou « les gens de Babylone […] les gens de Kouth […] les gens de Hamath ». L’hébreu emploie chaque fois l’expression « les hommes de ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: les hommes de
  rationale: Le pluriel construit de אִישׁ désigne ici les hommes ou, collectivement, les habitants rattachés à chaque ville. « Les hommes de » conserve la forme masculine explicite et la répétition de l’hébreu ; « les gens de » ou « les habitants de » reste possible.
- source_word: עָשׂוּ
  choice: firent
  rationale: Le verbe courant עשה signifie « faire ». « Firent » préserve la sobriété du texte, sans préciser qu’ils fabriquèrent des statues ni qu’ils les établirent comme dieux.
- source_word: סֻכּוֹת בְּנוֹת
  choice: Soukkoth-Benoth
  rationale: Il s’agit vraisemblablement du nom propre d’une divinité ou d’un objet cultuel étranger. La translittération évite de donner pour certaine une étymologie obscure.
- source_word: כּוּת
  choice: Kouth
  rationale: Nom de lieu translittéré selon une graphie française qui représente le son initial et la voyelle longue de l’hébreu.
- source_word: נֵרְגַל
  choice: Nergal
  rationale: Nom propre d’une divinité mésopotamienne, conservé par translittération plutôt que traduit.
- source_word: חֲמָת
  choice: Hamath
  rationale: Nom de lieu conservé sous sa forme française usuelle.
- source_word: אֲשִׁימָא
  choice: Ashima
  rationale: Nom propre d’une divinité étrangère, translittéré sans proposer d’interprétation étymologique incertaine.
theological_decisions:
- issue: Faut-il qualifier les objets de עָשׂוּ d’« idoles » ou de « dieux » ?
  choice: Conserver uniquement les noms propres, sans ajouter « idole » ni « dieu » dans le texte principal.
  alternative: « fabriquèrent l’idole Soukkoth-Benoth » ou « firent de Soukkoth-Benoth leur dieu »
  rationale: L’hébreu emploie simplement « firent » suivi d’un complément direct. Le contexte cultuel permet de comprendre ces noms comme ceux de divinités ou d’objets cultuels, mais toute qualification supplémentaire trancherait ce que la formulation du verset laisse implicite.
translation_notes:
  register: Français moderne, sobre et digne. La répétition de « les hommes de » et du verbe « firent » reproduit la structure parallèle de l’hébreu. Les noms étrangers sont translittérés selon des formes lisibles en français.
