  text: וַ/יְהִ֗י בִּ/תְחִלַּת֙ שִׁבְתָּ֣/ם שָׁ֔ם לֹ֥א יָרְא֖וּ אֶת יְהוָ֑ה וַ/יְשַׁלַּ֨ח יְהוָ֤ה בָּ/הֶם֙ אֶת הָ֣/אֲרָי֔וֹת וַ/יִּֽהְי֥וּ הֹרְגִ֖ים בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/025.yaml
  text: And it happened[a], at the beginning of their dwelling there, that they did not fear Yahweh; so Yahweh sent lions among them, and they were killing some of them.
translation:
  language: fr
  text: Au début de leur séjour là-bas, ils ne craignaient pas Yahweh[a]. Alors Yahweh envoya parmi eux des lions, qui tuaient certains d’entre eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne révéraient pas Yahweh ». En hébreu, « craindre » comprend ici la révérence et le respect dû à Dieu, et non la seule terreur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת שִׁבְתָּם שָׁם
  choice: Au début de leur installation là
  rationale: La formulation exprime le commencement de leur établissement dans le pays. « Installation » rend ici le sens contextuel de ישׁב de manière naturelle, sans perdre la nuance temporelle explicite.
- source_word: יָרְאוּ אֶת־יְהוָה
  choice: ils ne craignaient pas Yahweh
  rationale: Le verbe ירא désigne ici une crainte révérencielle impliquant le respect dû à Dieu. « Craindre Yahweh » reste transparent par rapport à l’hébreu et conserve toute l’étendue du terme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
- source_word: וַיְשַׁלַּח ... בָּהֶם אֶת הָאֲרָיוֹת
  choice: Yahweh envoya des lions parmi eux
  rationale: « Parmi eux » rend naturellement la préposition ב et présente les lions comme envoyés au milieu de la population.
- source_word: וַיִּהְיוּ הֹרְגִים בָּהֶם
  choice: et ceux-ci se mirent à tuer certains d’entre eux
  rationale: La construction היה suivie du participe indique une action en cours ou répétée. « Se mirent à tuer » en marque le commencement dans le récit, tandis que « certains d’entre eux » rend la valeur partitive du complément sans suggérer une destruction totale.
theological_decisions:
- issue: Sens de la crainte de Yahweh
  choice: craignaient Yahweh
  alternative: révéraient Yahweh
  rationale: « Craindre » préserve l’expression biblique et son ambiguïté féconde entre crainte et profond respect; la note précise qu’il ne s’agit pas seulement de terreur.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le Tétragramme; conserver « Yahweh » distingue le nom personnel du titre « Seigneur ».
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe narrative reste fluide; « ceux-ci » désigne clairement les lions, et la reprise « d’entre eux » désigne les habitants.
