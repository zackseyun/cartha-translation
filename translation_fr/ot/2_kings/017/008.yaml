base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/008.yaml
  text: And they walked in the statutes of the nations whom Yahweh had dispossessed before the sons of Israel[c][b][a], and in the practices that the kings of Israel had introduced.
translation:
  language: fr
  text: Ils suivirent les prescriptions des nations que Yahweh avait chassées devant les Israélites[a], ainsi que celles que les rois d’Israël avaient établies[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant les fils d’Israël » ; c’est-à-dire les Israélites. Autre traduction possible : « que Yahweh avait dépossédées devant les Israélites ».'
    reason: La note conserve la désignation littérale בני ישראל et signale la nuance de dépossession portée par le hiphil de ירש.
  - marker: b
    text: 'L’hébreu est elliptique : littéralement, « et [dans ce] que les rois d’Israël avaient fait ». Le contexte permet de sous-entendre « prescriptions » ou « pratiques ».'
    reason: La note explique l’ellipse réelle de la proposition finale sans introduire une analyse grammaticale contextuellement infondée.
lexical_decisions:
- source_word: וַיֵּלְכוּ בְּחֻקּוֹת
  choice: Ils suivirent les prescriptions
  rationale: Le verbe הלך signifie littéralement « marcher », mais, avec בְּחֻקּוֹת, il décrit la conduite conforme à des règles ou pratiques. « Suivirent les prescriptions » restitue naturellement cette valeur éthique sans donner à חֻקּוֹת le sens trop vague de simples habitudes.
- source_word: הַגּוֹיִם
  choice: des nations
  rationale: Dans ce contexte historique, גּוֹיִם désigne les peuples non israélites du pays. « Nations » est précis et évite la charge religieuse que pourrait porter « païens ».
- source_word: אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי
  choice: que Yahweh avait dépossédées devant
  rationale: Le hiphil de ירש peut exprimer l’expulsion assortie de la perte du territoire. « Dépossédées » conserve cette nuance, tandis que « devant » reflète מִפְּנֵי et évoque leur retrait à l’arrivée d’Israël.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression signifie littéralement « les fils d’Israël », mais fonctionne ici comme désignation collective du peuple. « Les Israélites » est son équivalent français naturel et exact.
- source_word: וּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר עָשׂוּ
  choice: ainsi que celles que les rois d’Israël avaient établies
  rationale: La proposition hébraïque est elliptique. La reprise de « prescriptions » fournit l’objet implicite, et עשׂה peut désigner leur mise en place. Cette formulation rattache naturellement la seconde proposition à « ils suivirent », tout en signalant en note une autre analyse grammaticale possible.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Interprétation de la proposition finale elliptique
  choice: les prescriptions que les rois d’Israël avaient établies
  alternative: les rois d’Israël qu’ils avaient établis
  rationale: Le contexte immédiat favorise la reprise implicite de חֻקּוֹת (« prescriptions »), mais l’hébreu permet grammaticalement de rattacher אֲשֶׁר עָשׂוּ aux « rois d’Israël ». La variante est donc conservée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Suivirent les prescriptions » évite un calque obscur de la métaphore hébraïque « marcher dans », tandis que « Yahweh » conserve le nom divin. La tournure finale est lissée dans le texte et son ambiguïté réelle est préservée en note.
