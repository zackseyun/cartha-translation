revisions:
- from: Ils suivirent les prescriptions des nations que Yahweh avait dépossédées devant les Israélites[a], ainsi que celles que les rois d’Israël avaient établies[b].
  to: Ils suivirent les prescriptions des nations que Yahweh avait chassées devant les Israélites[a], ainsi que celles que les rois d’Israël avaient établies[b].
  rationale: La révision conserve le choix interprétatif contextuellement le plus solide pour la proposition finale, tout en expliquant son ellipse sans surinterpréter l’ambiguïté syntaxique. Elle remplace aussi une expression française peu claire par une formulation biblique moderne plus naturelle, tout en préservant en note la nuance de dépossession du verbe hébreu.
