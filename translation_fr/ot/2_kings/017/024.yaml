source:
  edition: WLC
  text: וַ/יָּבֵ֣א מֶֽלֶךְ אַשּׁ֡וּר מִ/בָּבֶ֡ל וּ֠/מִ/כּוּ֠תָ/ה וּ/מֵ/עַוָּ֤א וּ/מֵֽ/חֲמָת֙ וּ/סְפַרְוַ֔יִם וַ/יֹּ֨שֶׁב֙ בְּ/עָרֵ֣י שֹֽׁמְר֔וֹן תַּ֖חַת בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּֽרְשׁוּ֙ אֶת שֹׁ֣מְר֔וֹן וַ/יֵּֽשְׁב֖וּ בְּ/עָרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/024.yaml
  text: Then the king of Assyria brought people from Babylon[a], Cuthah, Avva, Hamath, and Sepharvaim, and settled them in the cities of Samaria in place of the sons of Israel[b]. They took possession of Samaria and lived in its cities.
translation:
  language: fr
  text: Puis le roi d’Assyrie fit venir des gens de Babylone, de Kouta, d’Avva[a], de Hamath et de Sefarvaïm, et les installa dans les villes de Samarie à la place des fils d’Israël[b]. Ils prirent possession de la Samarie et habitèrent dans ses villes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi transcrire ce nom « Awwa ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des Israélites » ou « du peuple d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: fit venir des gens
  rationale: Le hiphil de בוא signifie « faire venir » ou « amener ». Le complément humain, implicite dans l’hébreu et évident d’après le contexte du repeuplement, est explicité par « des gens » pour obtenir un français naturel.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: Cette formulation rend naturellement la construction hébraïque et correspond à l’usage historique courant en français.
- source_word: מִבָּבֶל ... וּסְפַרְוַיִם
  choice: de Babylone, de Kouta, d’Avva, de Hamath et de Sefarvaïm
  rationale: Les noms de lieux sont rendus sous des formes françaises ou francisées usuelles. La répétition de « de » clarifie que les gens venaient de chacune des localités énumérées.
- source_word: וַיֹּשֶׁב
  choice: les installa
  rationale: 'Le hiphil de ישׁב est causatif : le roi fit habiter ces populations dans les villes. « Les installa » conserve cette valeur tout en restant idiomatique.'
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: dans les villes de Samarie
  rationale: Le pluriel « villes » est conservé. Ici, Samarie désigne le territoire ou la région, et non uniquement la capitale.
- source_word: תַּחַת בְּנֵי יִשְׂרָאֵל
  choice: à la place des fils d’Israël
  rationale: תַּחַת exprime ici le remplacement. « Fils d’Israël » garde la forme de l’expression hébraïque, tout en permettant de signaler en note son sens collectif.
- source_word: וַיִּרְשׁוּ אֶת שֹׁמְרוֹן
  choice: Ils prirent possession de la Samarie
  rationale: Dans ce contexte de déplacement et de repeuplement, ירשׁ signifie prendre possession d’un territoire. « Héritèrent » introduirait en français une nuance juridique ou théologique peu adaptée ici.
- source_word: וַיֵּשְׁבוּ בְּעָרֶיהָ
  choice: et habitèrent dans ses villes
  rationale: Le qal de ישׁב exprime ici le fait d’habiter. Le possessif féminin singulier renvoie à la Samarie.
theological_decisions:
- issue: Portée de l’expression ethnique בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; le peuple d’Israël
  rationale: La formulation hébraïque est littéralement masculine, mais elle désigne collectivement la population d’Israël et ne se limite pas aux hommes. Le texte conserve l’expression source, tandis que la note en précise les équivalents idiomatiques sans restreindre sa portée.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au récit historique écrit. Les formulations causatives de l’hébreu sont rendues clairement sans lourdeur, et les noms géographiques suivent des formes françaises reconnaissables.
