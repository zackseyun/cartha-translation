  naturalness: « Il fit ce qui est mal aux yeux de Yahweh » est naturel et convient au registre biblique moderne. « Mais non pas comme les rois d’Israël qui l’avaient précédé » est idiomatique, digne et plus proche de la formulation source que « mais pas autant que ».
  terminology: « Yahweh » rend correctement יהוה conformément au choix éditorial. « Aux yeux de » reproduit naturellement l’idiome évaluatif hébreu. « Les rois d’Israël » et « qui l’avaient précédé » sont exacts.
