  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה רַ֗ק לֹ֚א כְּ/מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], yet not like the kings of Israel who were before him.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh, mais[a] non pas comme les rois d’Israël qui l’avaient précédé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « seulement, non pas comme les rois d’Israël qui étaient avant lui ». Le mot hébreu rendu par « mais » introduit une restriction à l’évaluation qui précède.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה poursuit le récit. En français narratif, « Il fit » rend naturellement l’action sans conserver mécaniquement la conjonction initiale.
- source_word: הָרַע
  choice: ce qui est mal
  rationale: L’adjectif substantivé désigne « le mal » ou « ce qui est mal ». Cette dernière tournure est naturelle et claire dans la formule d’évaluation royale.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression conserve l’image hébraïque et indique que l’acte est évalué selon le jugement de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: רַק לֹא כְּמַלְכֵי יִשְׂרָאֵל
  choice: mais pas autant que les rois d’Israël
  rationale: רַק introduit ici une restriction à l’évaluation négative. Avec la comparaison niée, « pas autant que » exprime naturellement en français une différence de degré, sans nier que le roi ait fait le mal.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: qui l’avaient précédé
  rationale: Littéralement « qui étaient avant lui » ; la formulation choisie précise naturellement qu’il s’agit des rois antérieurs.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme ; « Yahweh » préserve le nom propre au lieu de lui substituer un titre.
- issue: Portée de la restriction introduite par רַק
  choice: 'Une comparaison atténuant le degré de sa faute : « mais pas autant que »'
  alternative: « seulement, pas comme les rois d’Israël »
  rationale: Le verset maintient le jugement négatif tout en le nuançant par rapport aux rois antérieurs. La formulation française explicite légèrement la valeur comparative probable, tandis que la note conserve la construction plus formelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « aux yeux de » conserve l’idiome biblique sans paraître archaïque ; « qui l’avaient précédé » évite l’ambiguïté temporelle de « qui étaient avant lui ».
