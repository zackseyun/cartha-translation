  text: וַ/יַּ֥עַל מֶֽלֶךְ אַשּׁ֖וּר בְּ/כָל הָ/אָ֑רֶץ וַ/יַּ֨עַל֙ שֹׁמְר֔וֹן וַ/יָּ֥צַר עָלֶ֖י/הָ שָׁלֹ֥שׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/005.yaml
  text: Then the king of Assyria went up throughout all the land[a], and he went up against Samaria and besieged it for three years.
translation:
  language: fr
  text: Alors le roi d’Assyrie parcourut tout le pays[a], marcha contre Samarie et l’assiégea pendant trois ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « monta à travers tout le pays ». Le verbe hébreu peut désigner une montée au sens propre ou une avancée militaire ; le siège mentionné ensuite favorise ici le sens militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: parcourut / marcha contre
  rationale: Le verbe עלה signifie littéralement « monter », mais peut désigner une progression militaire. Le français varie la formulation selon le complément pour rendre naturellement le mouvement à travers le pays puis l’avancée hostile contre Samarie.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: Rend normalement la construction hébraïque et désigne le souverain assyrien connu dans le contexte.
- source_word: בְּכָל הָאָרֶץ
  choice: tout le pays
  rationale: Avec la préposition ב, l’expression indique ici l’étendue du déplacement à travers le territoire; « pays » convient au territoire d’Israël dans ce récit.
- source_word: וַיַּעַל שֹׁמְרוֹן
  choice: marcha contre Samarie
  rationale: Dans un récit militaire, עלה suivi d’une ville peut exprimer une avancée contre elle. Le siège mentionné ensuite confirme le sens hostile, sans qu’il soit nécessaire de traduire par le terme plus fort « attaqua ».
- source_word: וַיָּצַר עָלֶיהָ
  choice: l’assiégea
  rationale: Le verbe צור désigne ici l’action de mettre une ville en état de siège; cette formulation est concise et idiomatique en français.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: pendant trois ans
  rationale: « Pendant » exprime clairement et naturellement la durée du siège.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Marcha contre » conserve la nuance de progression militaire sans surtraduire le verbe hébreu; « assiégea » rend précisément l’action qui suit.
