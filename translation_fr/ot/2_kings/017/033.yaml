source:
  edition: WLC
  text: אֶת יְהוָ֖ה הָי֣וּ יְרֵאִ֑ים וְ/אֶת אֱלֹֽהֵי/הֶם֙ הָי֣וּ עֹֽבְדִ֔ים כְּ/מִשְׁפַּט֙ הַ/גּוֹיִ֔ם אֲשֶׁר הִגְל֥וּ אֹתָ֖/ם מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/033.yaml
  text: They feared Yahweh[a], but they served their own gods, according to the custom of the nations from which they had been exiled.
translation:
  language: fr
  text: Ils craignaient Yahweh et[a] servaient leurs propres dieux, selon la coutume des nations d’où on les avait déportés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais ils servaient leurs propres dieux ». L’hébreu emploie simplement « et » ; le contexte permet toutefois de comprendre un contraste.'
    reason: Préciser la possible valeur adversative de la conjonction sans l’imposer dans le texte principal.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: הָיוּ יְרֵאִים
  choice: ils craignaient
  rationale: La construction avec היה et un participe exprime une attitude habituelle ou continue ; l’imparfait français rend naturellement cette valeur et conserve la notion de crainte révérencielle.
- source_word: אֱלֹהֵיהֶם
  choice: leurs propres dieux
  rationale: Le possessif hébreu est rendu explicitement ; « propres » fait ressortir sans ambiguïté qu’il s’agit de leurs divinités, par opposition à Yahweh.
- source_word: הָיוּ עֹבְדִים
  choice: servaient
  rationale: Dans un contexte religieux, עבד désigne le service cultuel. « Servaient » reste proche de l’hébreu tout en étant naturel en français biblique courant.
- source_word: כְּמִשְׁפַּט
  choice: selon la coutume
  rationale: מִשְׁפָּט désigne ici une pratique établie plutôt qu’un jugement ou une règle juridique.
- source_word: הַגּוֹיִם
  choice: des nations
  rationale: Le terme désigne les différents peuples ou pays d’origine des populations déplacées ; « nations » en conserve la portée collective.
- source_word: אֲשֶׁר הִגְלוּ אֹתָם מִשָּׁם
  choice: d’où on les avait déportés
  rationale: La formulation impersonnelle française rend naturellement l’action causative hébraïque sans préciser un agent que le texte n’identifie pas clairement ; le plus-que-parfait situe la déportation avant les pratiques décrites.
theological_decisions:
- issue: Valeur de la conjonction entre la crainte de Yahweh et le service d’autres dieux
  choice: Conserver « et » dans le texte principal
  alternative: Employer « mais » ou « tout en » pour expliciter le contraste
  rationale: L’hébreu porte la conjonction ordinaire וְ, « et ». Le contexte fait bien apparaître une tension syncrétiste, mais conserver la coordination évite de résoudre dans la traduction une relation logique que la forme hébraïque laisse implicite.
translation_notes:
  register: Français international moderne, sobre et digne. L’imparfait traduit les pratiques habituelles. La syntaxe demeure accessible, tandis que la note préserve la tension entre coordination formelle et contraste contextuel.
