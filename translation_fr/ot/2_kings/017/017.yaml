  text: וַֽ֠/יַּעֲבִירוּ אֶת בְּנֵי/הֶ֤ם וְ/אֶת בְּנֽוֹתֵי/הֶם֙ בָּ/אֵ֔שׁ וַ/יִּקְסְמ֥וּ קְסָמִ֖ים וַ/יְנַחֵ֑שׁוּ וַ/יִּֽתְמַכְּר֗וּ לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/017.yaml
  text: They made their sons and their daughters pass through the fire[a], practiced divination and interpreted omens, and sold themselves to do what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: fr
  text: Ils firent passer leurs fils et leurs filles par le feu[a], pratiquèrent la divination et interprétèrent les présages, et se vendirent pour faire ce qui est mal aux yeux de Yahweh, afin de provoquer sa colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « sacrifièrent leurs fils et leurs filles dans le feu ». L’expression hébraïque signifie littéralement « firent… passer par le feu ».'
    reason: alternative lexicale et précision sur la nature probable du rite
lexical_decisions:
- source_word: וַיַּעֲבִירוּ ... בָּאֵשׁ
  choice: firent passer par le feu
  rationale: Cette formulation conserve l’expression causative hébraïque et son écho intertextuel sans préciser davantage, dans le texte principal, la forme exacte du rite.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: leurs fils et leurs filles
  rationale: L’hébreu nomme explicitement les deux groupes; les conserver fait ressortir l’étendue et l’horreur de l’acte.
- source_word: וַיִּקְסְמוּ קְסָמִים
  choice: pratiquèrent la divination
  rationale: Cette tournure française naturelle rend la construction hébraïque à verbe et complément de même racine sans lourdeur.
- source_word: וַיְנַחֵשׁוּ
  choice: interprétèrent les présages
  rationale: Le verbe désigne l’observation ou l’interprétation divinatoire de signes; cette traduction moderne le distingue du terme précédent.
- source_word: וַיִּתְמַכְּרוּ
  choice: se vendirent
  rationale: 'Le sens métaphorique vif du hitpael est conservé: ils se sont eux-mêmes livrés à l’asservissement moral au mal.'
- source_word: לַעֲשׂוֹת הָרַע
  choice: pour faire ce qui est mal
  rationale: Cette formulation idiomatique rend l’expression hébraïque où «le mal» désigne génériquement ce qui est mauvais.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La métaphore évaluative hébraïque est naturelle en français et exprime le jugement divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte source plutôt que de lui substituer un titre.
- source_word: לְהַכְעִיסוֹ
  choice: provoquant ainsi sa colère
  rationale: La formulation rend la valeur causative du verbe et relie naturellement l’infinitif hébreu à l’ensemble de leur conduite.
theological_decisions:
- issue: Nature du rite impliquant les enfants et le feu
  choice: Conserver dans le texte l’expression «firent passer par le feu leurs fils et leurs filles».
  alternative: «sacrifièrent leurs fils et leurs filles dans le feu» ou «brûlèrent leurs fils et leurs filles dans le feu»
  rationale: Le contexte indique fortement un sacrifice d’enfants ou un rite apparenté, mais l’expression hébraïque elle-même ne décrit pas explicitement tous les détails. La traduction principale en préserve donc l’ambiguïté réelle, tandis qu’une note donne le sens probable.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Cette forme représente directement le nom divin du texte hébreu et assure la cohérence du projet.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme demeure soutenu sans archaïsmes; la seconde phrase permet de préserver la force de «se vendirent» et la progression vers la colère divine.
