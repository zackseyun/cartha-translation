  text: וַ/יָּבֹ֞א אֶחָ֣ד מֵ/הַ/כֹּהֲנִ֗ים אֲשֶׁ֤ר הִגְלוּ֙ מִ/שֹּׁ֣מְר֔וֹן וַ/יֵּ֖שֶׁב בְּ/בֵֽית אֵ֑ל וַֽ/יְהִי֙ מוֹרֶ֣ה אֹתָ֔/ם אֵ֖יךְ יִֽירְא֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/028.yaml
  text: Then one of the priests whom they had exiled from Samaria came and lived in Bethel[a], and he taught them how they should fear Yahweh.
translation:
  language: fr
  text: Alors l’un des prêtres qu’ils avaient déportés de Samarie vint habiter à Béthel. Il leur enseigna comment ils devaient craindre Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom divin, traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque et l’autre convention de traduction courante.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Alors ... vint
  rationale: Le waw consécutif fait progresser le récit; « Alors » exprime naturellement cette succession en français.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: l’un des prêtres
  rationale: Cette tournure désigne un individu appartenant à un groupe de prêtres.
- source_word: אֲשֶׁר הִגְלוּ מִשֹּׁמְרוֹן
  choice: qu’ils avaient déportés de Samarie
  rationale: Le hiphil de גלה signifie emmener en exil ou déporter. Le sujet pluriel indéterminé du texte hébreu est conservé par « ils ».
- source_word: וַיֵּשֶׁב בְּבֵית אֵל
  choice: vint habiter à Béthel
  rationale: ישב indique ici qu’il établit sa résidence; « habiter » est actuel et naturel, sans renforcer indûment l’idée d’une installation définitive.
- source_word: וַיְהִי מוֹרֶה אֹתָם
  choice: Il leur enseigna
  rationale: La construction היה suivie d’un participe présente son activité d’enseignement; le passé simple convient au récit français et exprime clairement sa fonction.
- source_word: אֵיךְ יִירְאוּ
  choice: comment ils devaient craindre
  rationale: La proposition porte sur la manière appropriée d’agir et possède une nuance normative que rend « devaient ».
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin יהוה et le distingue d’un titre comme « le Seigneur ».
theological_decisions:
- issue: Sens de « craindre » appliqué à Yahweh
  choice: craindre Yahweh
  alternative: révérer Yahweh
  rationale: Le verbe ירא peut inclure respect, révérence et obéissance, mais « craindre » préserve ici l’étendue sémantique et la tension du texte sans la réduire à une seule nuance.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom divin lui-même. « Yahweh » le rend explicitement, tandis qu’une note signale la convention traditionnelle.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple maintient un registre narratif biblique naturel sans vocabulaire archaïque. La répétition de « ils » conserve le sujet indéterminé du verbe hébreu plutôt que d’identifier explicitement les déporteurs.
