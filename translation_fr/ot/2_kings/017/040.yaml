  text: וְ/לֹ֖א שָׁמֵ֑עוּ כִּ֛י אִֽם כְּ/מִשְׁפָּטָ֥/ם הָֽ/רִאשׁ֖וֹן הֵ֥ם עֹשִֽׂים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/040.yaml
  text: But they did not listen; instead[a], they kept acting according to their former custom.
translation:
  language: fr
  text: Mais ils n’écoutèrent pas ; ils continuèrent plutôt à suivre leur ancienne coutume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils continuèrent à faire selon leur ancienne règle/pratique ». Le mot hébreu מִשְׁפָּט peut désigner une ordonnance, une règle ou une pratique coutumière. Dans ce contexte, il se rapporte à leur ancienne manière établie de pratiquer le culte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Mais… ne… pas
  rationale: La conjonction suivie de la négation prolonge le récit tout en marquant un léger contraste avec l’instruction précédente ; « mais » rend naturellement cette nuance.
- source_word: שָׁמֵעוּ
  choice: ils n’écoutèrent pas
  rationale: Le verbe שׁמע peut signifier entendre, écouter ou obéir. « Écouter » conserve ici à la fois l’idée d’attention et celle de réponse attendue, sans expliciter excessivement « obéir ».
- source_word: כִּי אִם
  choice: au contraire
  rationale: Cette locution oppose ce qu’ils n’ont pas fait à ce qu’ils ont continué de faire ; « au contraire » exprime clairement cette valeur adversative.
- source_word: כְּמִשְׁפָּטָם
  choice: selon leur… coutume
  rationale: מִשְׁפָּט peut désigner un jugement, une règle, une ordonnance ou une pratique établie. Dans ce contexte cultuel, « coutume » rend le mieux une manière de faire habituelle.
- source_word: הָרִאשׁוֹן
  choice: ancienne
  rationale: L’adjectif renvoie à leur manière de faire antérieure. En français, « leur ancienne coutume » est plus naturel que « leur première coutume ».
- source_word: הֵם עֹשִׂים
  choice: ils continuèrent à agir
  rationale: La construction participiale présente une conduite durable ou habituelle. « Continuèrent à agir » restitue cette persistance dans un français naturel.
