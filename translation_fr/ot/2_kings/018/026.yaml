source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶלְיָקִ֣ים בֶּן חִ֠לְקִיָּהוּ וְ/שֶׁבְנָ֨ה וְ/יוֹאָ֜ח אֶל רַב שָׁקֵ֗ה דַּבֶּר נָ֤א אֶל עֲבָדֶ֨י/ךָ֙ אֲרָמִ֔ית כִּ֥י שֹׁמְעִ֖ים אֲנָ֑חְנוּ וְ/אַל תְּדַבֵּ֤ר עִמָּ֨/נוּ֙ יְהוּדִ֔ית בְּ/אָזְנֵ֣י הָ/עָ֔ם אֲשֶׁ֖ר עַל הַ/חֹמָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/026.yaml
  text: Then Eliakim son of Hilkiah[a], and Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. And do not speak with us in Judean in the hearing of the people who are on the wall.”
translation:
  language: fr
  text: 'Alors Éliakim, fils de Hilqiya, Shebna et Yoah dirent au grand échanson : « Parle, s’il te plaît, à tes serviteurs en araméen, car nous le comprenons. Ne nous parle pas en judéen[a], à portée d’oreille du peuple qui se trouve sur la muraille. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en hébreu ». Le terme hébreu signifie littéralement « judéen » et désigne la langue de Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: le grand échanson
  rationale: Le terme est un titre de fonction assyrien. « Grand échanson » en conserve le sens traditionnel sans le transformer en nom propre ni préciser abusivement une fonction militaire.
- source_word: דַּבֶּר נָא
  choice: Parle, s’il te plaît
  rationale: L’impératif accompagné de נָא exprime ici une requête polie; cette formulation est naturelle et conserve cette nuance.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans cet échange diplomatique, le mot relève d’une formule de déférence et ne met pas spécialement l’accent sur l’esclavage.
- source_word: אֲרָמִית
  choice: en araméen
  rationale: La forme désigne ici la langue dans laquelle ils demandent que l’on s’adresse à eux.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: car nous le comprenons
  rationale: Dans ce contexte de compétence linguistique, שׁמע signifie comprendre plutôt que simplement entendre.
- source_word: יְהוּדִית
  choice: en judéen
  rationale: Le terme désigne littéralement la langue de Juda. « Judéen » conserve cette désignation historique sans lui imposer une classification linguistique moderne.
- source_word: בְּאָזְנֵי
  choice: à portée d’oreille de
  rationale: L’expression hébraïque, littéralement « aux oreilles de », souligne que le peuple pourrait entendre les paroles.
- source_word: הָעָם אֲשֶׁר עַל הַחֹמָה
  choice: du peuple qui se trouve sur la muraille
  rationale: Le texte dit « le peuple » sans identifier explicitement ces personnes comme des soldats; la traduction préserve cette généralité.
- source_word: וַיֹּאמֶר ... אֶל
  choice: Alors ... dirent à
  rationale: Le waw narratif fait progresser le récit. Le verbe hébreu est formellement au singulier, mais le sujet composé appelle naturellement le pluriel en français.
