id: 2KI.18.29
reference: 2 Kings 18:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ אַל יַשִּׁ֥יא לָ/כֶ֖ם חִזְקִיָּ֑הוּ כִּי לֹ֣א יוּכַ֔ל לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/029.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you from his hand.'
translation:
  language: fr
  text: 'Ainsi parle le roi : « Qu’Ézéchias ne vous trompe pas[a], car il ne pourra pas vous délivrer de sa main[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne vous égare pas ». Le verbe hébreu peut désigner le fait d’égarer ou de tromper.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de sa main », expression qui signifie « de son pouvoir ». Le passage parallèle d’Ésaïe 36.14 porte « de ma main ».
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Ainsi parle le roi
  rationale: Cette formule française naturelle et digne conserve le caractère officiel de la proclamation royale et la valeur conventionnelle de la formule hébraïque.
- source_word: אַל יַשִּׁיא לָכֶם
  choice: Qu’Ézéchias ne vous trompe pas
  rationale: Le verbe hébreu exprime ici l’idée d’égarer ou de tromper. La tournure avec « qu’il ne… pas » rend directement l’interdiction adressée au peuple tout en restant idiomatique en français.
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre biblique.
- source_word: כִּי לֹא יוּכַל
  choice: car il ne pourra pas
  rationale: « Car » introduit explicitement le motif de l’avertissement, et le futur rend l’incapacité annoncée par la forme verbale hébraïque.
- source_word: לְהַצִּיל אֶתְכֶם
  choice: vous délivrer
  rationale: « Délivrer » convient au contexte militaire et politique et rend le fait d’arracher quelqu’un au pouvoir d’un adversaire.
- source_word: מִיָּדוֹ
  choice: de sa main
  rationale: 'La traduction conserve l’image hébraïque de la main comme expression du pouvoir. Le suffixe du texte massorétique fourni est à la troisième personne du masculin singulier : « sa main ».'
theological_decisions:
- issue: Référent et forme de מִיָּדוֹ (« de sa main »)
  choice: Conserver « de sa main », avec le suffixe à la troisième personne tel qu’il figure dans le texte hébreu fourni.
  alternative: « de ma main », selon le passage parallèle d’Ésaïe 36.14 ; ou « de son pouvoir », qui explicite l’expression idiomatique.
  rationale: La traduction suit prioritairement le texte massorétique fourni sans l’harmoniser avec le parallèle d’Ésaïe. L’image de la main demeure compréhensible en français et préserve l’ambiguïté potentielle du référent.
translation_notes:
  register: Français international moderne, clair et digne. « Ainsi parle le roi » maintient le ton d’une proclamation officielle sans archaïsme excessif. L’expression imagée « de sa main » est conservée dans le texte et expliquée en note.
