  text: עַ֣ל אֲשֶׁ֣ר לֹֽא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעַבְרוּ֙ אֶת בְּרִית֔/וֹ אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וְ/לֹ֥א שָׁמְע֖וּ וְ/לֹ֥א עָשֽׂוּ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/012.yaml
  text: because they did not listen to the voice of Yahweh their God[a], but transgressed his covenant, all that Moses the servant of Yahweh commanded[c][b]; they neither listened nor did it.
translation:
  language: fr
  text: parce qu’ils n’avaient pas écouté la voix de Yahweh, leur Dieu[a], et avaient transgressé son alliance — tout ce que Moïse, serviteur de Yahweh, avait ordonné[b] —, et qu’ils n’avaient ni écouté ni mis en pratique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « écouter la voix de » signifie souvent aussi « obéir à ».
    reason: lexical_alternative
  - marker: b
    text: 'La construction hébraïque peut aussi se comprendre ainsi : « avaient transgressé son alliance et tout ce que Moïse, serviteur de Yahweh, avait ordonné ».'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: עַל אֲשֶׁר
  choice: parce que
  rationale: La locution introduit la cause de la prise de Samarie et de l’exil rapportés au verset précédent.
- source_word: שָׁמְעוּ בְּקוֹל
  choice: écouté la voix de
  rationale: Cette formulation conserve l’image concrète de l’hébreu, tout en laissant entendre l’obéissance qu’implique couramment cette expression.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: וַיַּעַבְרוּ אֶת בְּרִיתוֹ
  choice: avaient violé son alliance
  rationale: Dans un contexte d’alliance, עבר exprime la transgression ou la violation. « Violer une alliance » est idiomatique et digne en français moderne.
- source_word: אֵת כָּל אֲשֶׁר צִוָּה
  choice: tout ce que … avait ordonné
  rationale: La proposition précise l’étendue du contenu de l’alliance transgressée, sans en atténuer la totalité.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: Moïse, serviteur de Yahweh
  rationale: « Serviteur » rend ici le titre honorifique et officiel de Moïse plus justement que « esclave ».
- source_word: וְלֹא שָׁמְעוּ וְלֹא עָשׂוּ
  choice: Ils n’avaient ni écouté ni agi en conséquence
  rationale: La répétition de « écouter » est maintenue, tandis que « agir en conséquence » exprime naturellement le passage à l’acte visé par עשׂה sans ajouter un objet précis absent de l’hébreu.
theological_decisions:
- issue: Sens de שׁמע dans l’expression שָׁמְעוּ בְּקוֹל
  choice: écouté la voix de
  alternative: obéi à
  rationale: L’expression hébraïque implique souvent l’obéissance, mais conserver « écouter la voix » maintient à la fois son image concrète et sa reprise rhétorique en fin de verset.
- issue: Rapport entre « son alliance » et « tout ce que Moïse … avait ordonné »
  choice: apposition marquée par un tiret
  alternative: avaient violé son alliance et tout ce que Moïse … avait ordonné
  rationale: La répétition du marqueur d’objet אֵת favorise une lecture où « tout ce que Moïse … avait ordonné » explicite le contenu de l’alliance; une note signale l’autre analyse syntaxique possible.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel; sa translittération le distingue d’un simple titre.
translation_notes:
  register: Français international moderne, sobre et digne. Le plus-que-parfait rattache clairement cette explication causale aux événements racontés au verset précédent. Le tiret rend l’apposition hébraïque sans alourdir la phrase, et la dernière proposition reste distincte afin de préserver l’insistance de la répétition.
