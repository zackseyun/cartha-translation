  text: אַיֵּה֩ אֱלֹהֵ֨י חֲמָ֜ת וְ/אַרְפָּ֗ד אַיֵּ֛ה אֱלֹהֵ֥י סְפַרְוַ֖יִם הֵנַ֣ע וְ/עִוָּ֑ה כִּֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/034.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim[a], Hena, and Ivvah? Have they delivered Samaria from my hand?
translation:
  language: fr
  text: Où sont les dieux de Hamath et d’Arpad ? Où sont les dieux de Sepharvaïm, de Hena et d’Ivva[a] ? Ont-ils délivré Samarie de ma main ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Ivva » est aussi transcrit « Avva » selon les traditions.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Où sont
  rationale: L’interrogatif de lieu ouvre une raillerie. Le pluriel français s’accorde naturellement avec « les dieux ».
- source_word: אֱלֹהֵי
  choice: les dieux de
  rationale: La forme construite plurielle désigne ici les divinités associées aux villes ou peuples nommés, sans que la traduction se prononce sur leur réalité ou leur puissance.
- source_word: חֲמָת וְאַרְפָּד
  choice: Hamath et Arpad
  rationale: Translittération conforme aux formes françaises bibliques courantes des noms de lieux.
- source_word: סְפַרְוַיִם הֵנַע וְעִוָּה
  choice: Sepharvaïm, Héna et Ivva
  rationale: Les noms propres sont translittérés selon un usage français lisible. « Ivva » représente עִוָּה ; les variantes traditionnelles sont signalées en note.
- source_word: כִּי
  choice: Ont-ils
  rationale: Dans ce contexte, כִּי introduit ou renforce la question rhétorique finale. Une interrogation directe restitue naturellement la force de la raillerie en français.
- source_word: הִצִּילוּ
  choice: délivré
  rationale: Le hiphil de נצל signifie faire échapper, délivrer ou sauver. « Délivré » convient au contexte de domination militaire.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française traditionnelle et courante du nom de la ville ou du royaume.
- source_word: מִיָּדִי
  choice: de ma main
  rationale: L’expression concrète hébraïque évoque le pouvoir et la domination. Elle reste intelligible et vigoureuse en français.
theological_decisions:
- issue: Portée du défi lancé au sujet des divinités païennes
  choice: Conserver la vantardise selon laquelle les dieux des villes conquises n’ont pas délivré Samarie du pouvoir assyrien.
  alternative: Transformer la dernière question en affirmation générale sur l’impuissance de toutes les divinités nationales.
  rationale: L’hébreu nomme plusieurs groupes de dieux puis formule une question rhétorique concernant Samarie. La traduction maintient cette tension sans affirmer ni nier explicitement l’existence ou la puissance réelle de ces divinités.
translation_notes:
  register: Français moderne, digne et direct. La répétition de « Où sont les dieux » et l’image « de ma main » sont conservées afin de rendre la force provocatrice du discours.
