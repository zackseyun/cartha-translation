id: 2KI.18.3
reference: 2 Kings 18:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥ד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/003.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: fr
  text: Il fit ce qui est droit aux yeux de Yahweh, conformément à tout ce qu’avait fait David, son père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « père » signifie « ancêtre » dans la lignée de David, et non père immédiat.
    reason: Note culturelle et sémantique sur l’emploi élargi du terme hébreu אָב.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol qal de עשה poursuit le récit. En français narratif, le passé simple rend naturellement cette action, sans qu’il soit nécessaire de traduire explicitement le waw par « et ».
- source_word: הַיָּשָׁר
  choice: ce qui est droit
  rationale: L’adjectif défini ישר est employé substantivement. « Ce qui est droit » conserve l’évaluation morale du texte dans une formulation française naturelle et digne.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette expression hébraïque indique une évaluation selon le point de vue de Yahweh. L’image des « yeux » reste claire et idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin personnel plutôt que de lui substituer un titre.
- source_word: כְּכֹל אֲשֶׁר
  choice: conformément à tout ce que
  rationale: La préposition comparative כ avec כל et אשר exprime la conformité à un modèle. Cette tournure restitue précisément le rapport sans lourdeur.
- source_word: עָשָׂה
  choice: avait fait
  rationale: Le parfait renvoie aux actes antérieurs de David pris comme modèle; le plus-que-parfait explicite naturellement ce rapport temporel en français.
- source_word: דָּוִד אָבִיו
  choice: David, son père
  rationale: La formulation conserve le terme familial et la portée dynastique de l’hébreu. Ici, « père » désigne un ancêtre de la lignée royale, précision donnée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans remplacer celui-ci par un titre.
- issue: Sens de « père » appliqué à David
  choice: Conserver « David, son père » dans le texte
  alternative: David, son ancêtre
  rationale: La formule royale établit à la fois la filiation dynastique et David comme modèle. Le maintien de « père » préserve cette résonance, tandis que la note prévient une lecture comme père immédiat.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit historique écrit; l’expression « aux yeux de » préserve l’image hébraïque tout en restant courante.
