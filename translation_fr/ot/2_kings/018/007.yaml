  text: וְ/הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ בְּ/כֹ֥ל אֲשֶׁר יֵצֵ֖א יַשְׂכִּ֑יל וַ/יִּמְרֹ֥ד בְּ/מֶֽלֶךְ אַשּׁ֖וּר וְ/לֹ֥א עֲבָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/007.yaml
  text: And Yahweh was with him; wherever he went[a], he prospered. And he rebelled against the king of Assyria and did not serve him.
translation:
  language: fr
  text: Yahweh était avec lui. Dans tout ce qu’il entreprenait[a], il réussissait. Il se révolta contre le roi d’Assyrie et ne le servit pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « partout où il allait, il prospérait » ; ou encore : « dans tout ce qu’il faisait, il agissait avec sagesse ». Le terme hébreu associe les idées de sagesse et de réussite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin, conformément à sa présence explicite dans le texte hébreu.
- source_word: וְהָיָה ... עִמּוֹ
  choice: était avec lui
  rationale: Rend naturellement l’expression hébraïque de présence et de faveur divines durables.
- source_word: בְּכֹל אֲשֶׁר יֵצֵא
  choice: dans tout ce qu’il entreprenait
  rationale: Littéralement lié à ce pour quoi il « sortait », le tour désigne ici l’ensemble de ses entreprises, notamment royales ou militaires.
- source_word: יַשְׂכִּיל
  choice: il réussissait
  rationale: Le hifil de שׂכל associe conduite avisée et réussite; « réussissait » exprime bien le résultat dans ce contexte royal, tandis que la note conserve l’autre nuance.
- source_word: וַיִּמְרֹד
  choice: il se révolta
  rationale: Expression française naturelle d’une rébellion politique contre une puissance suzeraine.
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: contre le roi d’Assyrie
  rationale: Correspondance directe et idiomatique du complément hébreu.
- source_word: וְלֹא עֲבָדוֹ
  choice: et ne le servit plus
  rationale: Dans le cadre politique, עבד évoque le service de vassal. « Plus » explicite la rupture impliquée par la révolte sans préciser davantage ses modalités.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom propre sans le remplacer par un titre.
- issue: Lien entre sagesse et réussite dans יַשְׂכִּיל
  choice: il réussissait
  alternative: il agissait avec sagesse
  rationale: Le contexte souligne l’issue favorable des actions du roi, mais le champ sémantique du verbe contient aussi l’idée d’agir avec discernement; cette tension est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait rend la présence constante de Yahweh et la réussite habituelle d’Ézéchias; le passé simple marque ensuite l’acte politique de révolte.
