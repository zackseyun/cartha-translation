base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/002.yaml
  text: He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abi daughter of Zechariah.
translation:
  language: fr
  text: Il avait vingt-cinq ans lorsqu’il devint roi, et il régna vingt-neuf ans à Jérusalem. Sa mère s’appelait Abi, fille de Zacharie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Il avait vingt-cinq ans
  rationale: Cette expression hébraïque est la tournure habituelle pour indiquer l’âge. La formulation française en donne naturellement le sens.
- source_word: הָיָה בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction situe l’âge du personnage au moment de son accession au trône. Cette formulation est claire et idiomatique en français.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe désigne l’exercice de la royauté; « régna » en est l’équivalent français précis et traditionnel.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, la préposition « à » convient naturellement à un nom de ville et indique ici le lieu d’où le roi exerça son règne.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Cette formulation moderne et naturelle rend fidèlement l’expression hébraïque « le nom de sa mère était ».
- source_word: אֲבִי
  choice: Abi
  rationale: Le nom propre hébreu est translittéré directement sous la forme « Abi ».
- source_word: בַּת זְכַרְיָה
  choice: fille de Zacharie
  rationale: Le groupe construit indique la filiation. « Zacharie » est la forme française biblique courante du nom hébreu.
