source:
  edition: WLC
  text: וַֽ/יַּעֲמֹד֙ רַב שָׁקֵ֔ה וַ/יִּקְרָ֥א בְ/קוֹל גָּד֖וֹל יְהוּדִ֑ית וַ/יְדַבֵּ֣ר וַ/יֹּ֔אמֶר שִׁמְע֛וּ דְּבַר הַ/מֶּ֥לֶךְ הַ/גָּד֖וֹל מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/028.yaml
  text: Then the Rabshakeh stood and called out in a loud voice in Judean[a], and he spoke and said, “Hear the word of the great king, the king of Assyria.”
translation:
  language: fr
  text: 'Alors le Rab-Shaké se tint debout et cria d’une voix forte en judéen[a]. Il prit la parole et dit : « Écoutez la parole du grand roi, le roi d’Assyrie ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en hébreu ». Le terme hébreu désigne plus précisément la langue de Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: se tint debout
  rationale: Le verbe עמד décrit simplement la position prise dans la séquence narrative; « se tint debout » est naturel et légèrement plus soutenu que « se leva », qui pourrait suggérer un mouvement non explicite.
- source_word: רַב שָׁקֵה
  choice: le Rab-Shaké
  rationale: La translittération conserve le titre assyrien tel qu’il fonctionne dans le récit, sans imposer une équivalence administrative incertaine comme « grand échanson ».
- source_word: וַיִּקְרָא בְקוֹל גָּדוֹל
  choice: cria d’une voix forte
  rationale: L’expression indique un appel public à haut volume. Cette formulation française rend concrètement l’intensité sans la surinterpréter comme une proclamation officielle.
- source_word: יְהוּדִית
  choice: en judéen
  rationale: Le terme désigne spécifiquement la langue de Juda. « Judéen » préserve cette précision historique, tandis que « hébreu » est l’appellation plus courante mais plus générale.
- source_word: וַיְדַבֵּר וַיֹּאמֶר
  choice: Il prit la parole et dit
  rationale: Cette formulation maintient les deux verbes introducteurs de l’hébreu tout en évitant une tournure française pesante comme « il parla et dit ».
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif pluriel interpelle directement l’auditoire. « Écoutez » est plus naturel en français actuel que le littéral « Entendez » et garde la force de l’ordre.
- source_word: דְּבַר
  choice: la parole
  rationale: Dans ce contexte, דָּבָר introduit une déclaration royale. « Parole » conserve le registre solennel et la proximité lexicale avec l’hébreu; « message » serait possible mais plus explicatif.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: du grand roi
  rationale: La traduction directe respecte le titre royal assyrien et son emphase politique.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: Cette construction française rend clairement et formellement le groupe hébreu à l’état construit.
theological_decisions: []
