  text: הַ/הַצֵּ֥ל הִצִּ֛ילוּ אֱלֹהֵ֥י הַ/גּוֹיִ֖ם אִ֣ישׁ אֶת אַרְצ֑/וֹ מִ/יַּ֖ד מֶ֥לֶךְ אַשּֽׁוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/033.yaml
  text: Have the gods of the nations ever delivered[a], each one, his land from the hand of the king of Assyria?
translation:
  language: fr
  text: Les dieux des nations ont-ils jamais délivré[a], chacun, son propre pays de la main du roi d’Assyrie ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici une tournure intensive; littéralement : « Ont-ils vraiment délivré… ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהַצֵּל הִצִּילוּ
  choice: ont-ils jamais délivré
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’idée verbale. Dans cette question rhétorique provocatrice, « jamais » rend naturellement en français la force du défi sans reproduire lourdement la répétition hébraïque.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: les dieux des nations
  rationale: Le pluriel construit désigne directement les divinités associées aux différents peuples; cette formulation préserve le contraste voulu par l’orateur assyrien.
- source_word: אִישׁ
  choice: chacun
  rationale: אִישׁ a ici une valeur distributive et renvoie à chaque dieu, non à un homme.
- source_word: אֶת אַרְצוֹ
  choice: son propre pays
  rationale: Le suffixe singulier s’accorde avec le sens distributif de « chacun ». « Propre » clarifie en français que chaque dieu est censé délivrer le pays qui lui correspond.
- source_word: מִיַּד
  choice: de la main de
  rationale: Cette expression conserve l’image hébraïque de la main comme symbole du pouvoir ou de la domination, tout en restant intelligible en français biblique moderne.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: Traduction directe et idiomatique de la construction hébraïque.
