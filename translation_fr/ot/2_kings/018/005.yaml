  variant: modern international French
source:
  edition: WLC
  text: בַּ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּטָ֑ח וְ/אַחֲרָ֞י/ו לֹא הָיָ֣ה כָמֹ֗/הוּ בְּ/כֹל֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/005.yaml
  text: He trusted in Yahweh[a], the God of Israel. After him there was none like him among all the kings of Judah, nor among those who were before him.
translation:
  language: fr
  text: Il mit sa confiance en Yahweh[a], le Dieu d’Israël. Après lui, aucun des rois de Juda ne fut comme lui, pas même ceux qui l’avaient précédé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh est le nom personnel de Dieu représenté en hébreu par les quatre consonnes YHWH.
    reason: Précision sur le rendu du nom divin.
lexical_decisions:
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition בְּ marque ici l’objet de la confiance. Le nom divin יהוה est translittéré « Yahweh » afin de conserver le nom propre présent dans l’hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: La chaîne construite identifie Yahweh comme le Dieu d’Israël et fonctionne en apposition.
- source_word: בָּטָח
  choice: mit sa confiance
  rationale: Le qal accompli de בטח signifie « se confier, mettre sa confiance ». Cette tournure française exprime naturellement l’acte personnel de s’appuyer sur Dieu.
- source_word: וְאַחֲרָיו לֹא הָיָה כָמֹהוּ
  choice: Après lui, aucun … ne fut comme lui
  rationale: La formulation conserve la comparaison temporelle et l’affirmation d’unicité exprimées par l’hébreu.
- source_word: בְּכֹל מַלְכֵי יְהוּדָה
  choice: des rois de Juda
  rationale: Dans cette comparaison, בְּכֹל désigne l’ensemble au sein duquel aucun égal ne se trouve. La construction française avec « aucun des » est idiomatique et fidèle.
- source_word: וַאֲשֶׁר הָיוּ לְפָנָיו
  choice: pas même ceux qui l’avaient précédé
  rationale: Le relatif étend explicitement la comparaison aux rois antérieurs. « Pas même » rend en français la portée négative héritée de la proposition précédente.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le Tétragramme comme nom propre. « Yahweh » en conserve la fonction nominative sans le remplacer par un titre.
- issue: Portée de la comparaison entre les rois
  choice: Aucun roi de Juda après Ézéchias ne fut comme lui, pas même parmi ses prédécesseurs
  alternative: Aucun roi de Juda, antérieur ou postérieur, ne fut comme lui
  rationale: 'La traduction suit l’ordre et la tension de la formulation hébraïque : elle mentionne d’abord ceux qui viennent après lui, puis ceux qui étaient avant lui, sans reformuler en superlatif abstrait.'
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif biblique; « mit sa confiance » reste courant et met en valeur l’acte de confiance. La répétition de « lui » reflète la comparaison insistante de l’hébreu.
