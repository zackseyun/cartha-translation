  text: וַ/יִּשְׁלַ֣ח חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֣ה אֶל מֶֽלֶךְ אַשּׁוּר֩ לָכִ֨ישָׁ/ה לֵ/אמֹ֤ר חָטָ֨אתִי֙ שׁ֣וּב מֵֽ/עָלַ֔/י אֵ֛ת אֲשֶׁר תִּתֵּ֥ן עָלַ֖/י אֶשָּׂ֑א וַ/יָּ֨שֶׂם מֶֽלֶךְ אַשּׁ֜וּר עַל חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה שְׁלֹ֤שׁ מֵאוֹת֙ כִּכַּר כֶּ֔סֶף וּ/שְׁלֹשִׁ֖ים כִּכַּ֥ר זָהָֽב־־־׀׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/014.yaml
  text: Then Hezekiah king of Judah sent to the king of Assyria at Lachish[a], saying, “I have offended. Withdraw from me. Whatever you impose on me[b], I will bear.” So the king of Assyria imposed on Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.
translation:
  language: fr
  text: 'Alors Ézéchias, roi de Juda, envoya au roi d’Assyrie à Lakish[a] pour lui dire : « J’ai péché. Éloigne-toi de moi. Ce que tu m’imposeras[b], je le supporterai. » Le roi d’Assyrie imposa donc à Ézéchias, roi de Juda, trois cents talents d’argent et trente talents d’or.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers Lakish ». La forme hébraïque peut indiquer un déplacement en direction de Lakish ; dans ce contexte, elle peut aussi signaler que le roi d’Assyrie s’y trouvait.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Ce que tu mettras sur moi, je le porterai. » Il s’agit de supporter la charge ou de payer le prélèvement imposé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya des messagers
  rationale: Le verbe signifie littéralement « envoya »; en français, l’ajout explicite de « des messagers » rend naturel l’envoi suivi d’un discours direct, sans changer la nature de l’action implicite.
- source_word: לָכִישָׁה
  choice: à Lakish
  rationale: Le hé directionnel peut indiquer un mouvement vers Lakish, tandis que le contexte permet aussi de comprendre que le roi d’Assyrie s’y trouvait. La formulation française conserve cette souplesse.
- source_word: חָטָאתִי
  choice: J’ai péché
  rationale: חטא est le verbe courant pour « pécher ». Malgré le contexte diplomatique, cette traduction maintient la force morale du terme hébreu plutôt que de la réduire à une simple faute politique.
- source_word: שׁוּב מֵעָלַי
  choice: Retire-toi de moi
  rationale: L’expression désigne le fait de revenir en arrière ou de cesser la pression hostile; « retire-toi de moi » convient au contexte militaire et reste proche de l’image hébraïque.
- source_word: אֵת אֲשֶׁר תִּתֵּן עָלַי
  choice: Ce que tu m’imposeras
  rationale: נתן על évoque ici une charge ou un prélèvement placé sur quelqu’un. « Imposer » est clair sans préciser indûment s’il s’agit d’un tribut, d’une amende ou d’une autre obligation.
- source_word: אֶשָּׂא
  choice: je le supporterai
  rationale: נשא signifie porter ou supporter. Dans le contexte, cela implique vraisemblablement l’acquittement de la charge, mais « supporterai » préserve l’image et l’étendue du terme.
- source_word: וַיָּשֶׂם ... עַל
  choice: imposa à
  rationale: L’expression indique qu’une obligation est mise à la charge d’Ézéchias. La reprise d’« imposer » assure la cohérence avec les paroles précédentes.
- source_word: כִּכַּר
  choice: talents
  rationale: Le talent est une ancienne unité de poids. Le terme conventionnel français convient ici puisque l’argent et l’or sont évalués au poids.
- source_word: כֶּסֶף
  choice: argent
  rationale: Le mot désigne ici le métal argent, mesuré en talents, et non la monnaie au sens général.
- source_word: זָהָב
  choice: or
  rationale: Sens lexical direct du métal précieux, également mesuré en talents.
theological_decisions:
- issue: Force morale de l’aveu d’Ézéchias
  choice: « J’ai péché »
  alternative: « J’ai eu tort » ou « Je suis coupable envers toi »
  rationale: Le contexte est diplomatique, mais l’hébreu emploie le verbe ordinaire signifiant pécher. Le texte français conserve donc sa portée morale sans déterminer explicitement contre qui le péché aurait été commis.
- issue: Degré d’interprétation du prélèvement
  choice: « Ce que tu m’imposeras, je le supporterai »
  alternative: « Quel que soit le tribut que tu fixeras, je le paierai »
  rationale: La formulation retenue ne réduit pas la charge à un tribut ou à une amende, même si la suite montre qu’elle prend la forme d’un prélèvement de métaux précieux.
translation_notes:
  register: Français international moderne, naturel et digne. « Ézéchias » et « Lakish » suivent les formes bibliques françaises usuelles. Le rythme narratif demeure concis; les répétitions de « roi de Juda » et du verbe « imposer » reflètent celles de l’hébreu.
