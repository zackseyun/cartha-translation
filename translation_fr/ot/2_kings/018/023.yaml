source:
  edition: WLC
  text: וְ/עַתָּה֙ הִתְעָ֣רֶב נָ֔א אֶת אֲדֹנִ֖/י אֶת מֶ֣לֶךְ אַשּׁ֑וּר וְ/אֶתְּנָ֤ה לְ/ךָ֙ אַלְפַּ֣יִם סוּסִ֔ים אִם תּוּכַ֕ל לָ֥/תֶת לְ/ךָ֖ רֹכְבִ֥ים עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/023.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: fr
  text: 'Maintenant donc, fais un pari[a], je te prie, avec mon maître, le roi d’Assyrie : je te donnerai deux mille chevaux, si tu es capable de fournir des cavaliers pour les monter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prends un engagement envers mon maître » ou « conclus un accord avec mon maître ». Le verbe hébreu peut désigner le fait de s’engager ou de conclure un accord, mais il semble exprimer ici un pari ou un défi moqueur.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב
  choice: fais un pari
  rationale: Dans ce contexte de provocation, la forme hébraïque évoque vraisemblablement un pari ou un défi moqueur, tout en pouvant aussi désigner un engagement ou un accord. « Fais un pari » rend clairement la raillerie liée à la condition qui suit.
- source_word: נָא
  choice: je te prie
  rationale: Cette particule atténue formellement l’impératif. « Je te prie » conserve ici la politesse rhétorique, teintée d’ironie, sans recourir à une tournure archaïque.
- source_word: אֶת אֲדֹנִי
  choice: avec mon maître
  rationale: Après le verbe, אֶת a ici une valeur relationnelle rendue par « avec ». אֲדֹנִי désigne le supérieur du porte-parole assyrien, et non Dieu ; « mon maître » évite donc une résonance théologique indue.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: Rendu direct et usuel de la construction hébraïque.
- source_word: וְאֶתְּנָה לְךָ
  choice: je te donnerai
  rationale: La forme exprime ici l’offre provocatrice du locuteur. Le futur français restitue naturellement cette proposition.
- source_word: אַלְפַּיִם סוּסִים
  choice: deux mille chevaux
  rationale: Traduction directe de l’expression numérique.
- source_word: אִם תּוּכַל
  choice: si tu es capable
  rationale: La proposition conditionnelle porte sur la capacité de Juda et accentue la moquerie du discours.
- source_word: לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: fournir des cavaliers pour les monter
  rationale: Littéralement, il s’agit de se procurer ou de placer des cavaliers sur les chevaux. Cette formulation française explicite naturellement que le défi concerne le manque de cavaliers disponibles, tout en conservant l’image concrète des hommes montant les chevaux.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse hébraïque au singulier et convient au ton direct et méprisant du discours. La tournure « je te prie » préserve la politesse ironique de נָא, tandis que les deux-points rendent naturellement le lien entre le défi et l’offre qui le précise.
