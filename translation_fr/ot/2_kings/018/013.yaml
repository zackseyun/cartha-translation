base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/013.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: fr
  text: La quatorzième année du règne du roi Ézéchias, Sennachérib, roi d’Assyrie, marcha contre toutes les villes fortifiées de Juda et s’en empara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ חִזְקִיָּה
  choice: La quatorzième année du règne du roi Ézéchias
  rationale: La formule hébraïque date l’événement d’après l’année de règne du roi. L’ajout explicatif « du règne » produit en français une formulation naturelle et sans ambiguïté, tandis que la conjonction initiale n’exige pas ici de marqueur discursif distinct.
- source_word: סַנְחֵרִיב
  choice: Sennachérib
  rationale: Forme française traditionnelle et courante du nom du roi assyrien.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: roi d’Assyrie
  rationale: Le groupe construit hébreu précise le titre et le royaume de Sennachérib; l’apposition française le rend directement.
- source_word: עָלָה … עַל
  choice: marcha contre
  rationale: Dans ce contexte militaire, le verbe signifie avancer ou partir en campagne contre une cible. « Marcha contre » conserve l’idée de mouvement offensif sans imposer que l’assaut soit déjà exprimé par ce seul verbe.
- source_word: כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: toutes les villes fortifiées de Juda
  rationale: הַבְּצֻרוֹת désigne des villes munies de fortifications; « villes fortifiées » est l’expression militaire française claire et usuelle.
- source_word: וַיִּתְפְּשֵׂם
  choice: et s’en empara
  rationale: Le verbe exprime la prise effective des villes, et le pronom suffixe renvoie à celles-ci. « S’en empara » convient naturellement à une conquête militaire.
