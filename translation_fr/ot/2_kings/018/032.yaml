source:
  edition: WLC
  text: עַד בֹּאִ/י֩ וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֗ם אֶרֶץ֩ דָּגָ֨ן וְ/תִיר֜וֹשׁ אֶ֧רֶץ לֶ֣חֶם וּ/כְרָמִ֗ים אֶ֣רֶץ זֵ֤ית יִצְהָר֙ וּ/דְבַ֔שׁ וִֽ/חְי֖וּ וְ/לֹ֣א תָמֻ֑תוּ וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חִזְקִיָּ֔הוּ כִּֽי יַסִּ֤ית אֶתְ/כֶם֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/032.yaml
  text: until I come and take you away to a land like your own land[a], a land of grain and new wine, a land of bread and vineyards, a land of olive oil and honey, so that you may live and not die. And do not listen to Hezekiah, for he is misleading you by saying[b], ‘Yahweh will deliver us.’
translation:
  language: fr
  text: 'jusqu’à ce que je vienne vous emmener dans un pays semblable au vôtre, un pays de céréales et de vin nouveau[a], un pays de pain et de vignobles, un pays d’huile d’olive et de miel[b]. Ainsi, vous vivrez et vous ne mourrez pas. N’écoutez pas Ézéchias, car il vous égare en disant : « Yahweh nous délivrera. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de céréales et de vin ». Le terme hébreu תִּירוֹשׁ désigne souvent le vin nouveau, c’est-à-dire le produit frais de la vigne.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie une expression condensée, littéralement « d’olivier, d’huile et de miel »; « huile d’olive » en exprime le sens naturel.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד בֹּאִי
  choice: jusqu’à ce que je vienne
  rationale: L’expression fixe le moment futur jusqu’auquel les auditeurs doivent attendre; « vienne » rend simplement et directement בוא.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: vous emmener
  rationale: לקח signifie « prendre »; dans le contexte de la déportation, « emmener » exprime naturellement le déplacement imposé sans ajouter la violence de « traîner » ou « enlever de force ».
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: dans un pays semblable au vôtre
  rationale: La préposition comparative כְ indique une ressemblance, non une identité; la formulation conserve l’argument de propagande assyrien.
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: un pays de blé et de vin nouveau
  rationale: דגן désigne les céréales ou le grain, rendu ici par le collectif courant « blé »; תירוש désigne plus précisément le vin nouveau ou le produit frais de la vigne.
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: un pays de pain et de vignobles
  rationale: La formulation conserve les images concrètes de לחם, « pain », et כרמים, « vignobles », qui évoquent l’abondance agricole.
- source_word: אֶרֶץ זֵית יִצְהָר וּדְבַשׁ
  choice: un pays d’huile d’olive et de miel
  rationale: 'L’expression hébraïque est condensée: זית désigne l’olivier ou l’olive et יצהר l’huile fraîche. « Huile d’olive » en communique naturellement le sens en français.'
- source_word: וִחְיוּ וְלֹא תָמֻתוּ
  choice: Ainsi, vous vivrez et vous ne mourrez pas
  rationale: L’impératif hébreu exprime ici l’exhortation et son résultat promis; « ainsi » rend ce lien sans transformer l’appel en simple constat.
- source_word: וְאַל תִּשְׁמְעוּ אֶל חִזְקִיָּהוּ
  choice: N’écoutez pas Ézéchias
  rationale: שמע אל signifie ici écouter quelqu’un au sens de lui accorder foi ou de suivre son avis; le français direct reste intelligible.
- source_word: כִּי יַסִּית אֶתְכֶם
  choice: car il vous égare
  rationale: Le hiphil de סות peut signifier pousser, séduire ou égarer. « Vous égare » convient à l’accusation du porte-parole sans imposer une qualification doctrinale plus forte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin personnel est translittéré plutôt que remplacé par un titre.
- source_word: יַצִּילֵנוּ
  choice: nous délivrera
  rationale: Le hiphil de נצל exprime la délivrance ou le sauvetage face à un danger; « délivrera » convient au contexte militaire et conserve la portée théologique du terme.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom personnel tout en évitant de le remplacer par un titre.
- issue: Portée de יסית dans l’accusation contre Ézéchias
  choice: il vous égare
  alternative: il vous pousse / il vous séduit
  rationale: Le propos est celui du représentant assyrien, qui présente la confiance encouragée par Ézéchias comme trompeuse. La traduction conserve cette accusation comme discours du personnage, sans l’approuver ni la renforcer.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « un pays de… » est maintenue pour reproduire la cadence persuasive du discours. « Ézéchias » suit la forme française traditionnelle du nom, tandis que « Yahweh » conserve le nom divin personnel.
