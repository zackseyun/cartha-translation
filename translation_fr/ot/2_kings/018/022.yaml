  text: וְ/כִי תֹאמְר֣וּ/ן אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵי֙ הַ/מִּזְבֵּ֣חַ הַ/זֶּ֔ה תִּֽשְׁתַּחֲו֖וּ בִּ/ירוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/022.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall worship before this altar in Jerusalem’?”
translation:
  language: fr
  text: 'Mais si vous me dites : « Nous mettons notre confiance dans le Seigneur notre Dieu », n’est-ce pas lui dont Ézéchias a supprimé les hauts lieux et les autels, en disant à Juda et à Jérusalem : « Devant cet autel, à Jérusalem, vous vous prosternerez » ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le Seigneur
  rationale: Rend le nom divin selon la convention française courante et dignifiée, en harmonie avec la couche de consultation anglaise « the LORD ».
- source_word: בָּטָחְנוּ
  choice: Nous mettons notre confiance
  rationale: Exprime naturellement en français l’accompli hébreu de בטח, ici comme déclaration présente de confiance.
- source_word: בָּמוֹתָיו
  choice: ses lieux sacrés
  rationale: במה désigne des sites cultuels surélevés ou locaux. « Lieux sacrés » reste compréhensible tout en évitant de réduire nécessairement le terme à une simple hauteur topographique.
- source_word: תִּשְׁתַּחֲווּ
  choice: vous vous prosternerez
  rationale: Le verbe חוה décrit l’acte de se prosterner, souvent dans le cadre du culte; la traduction conserve ici le geste concret.
- source_word: לִפְנֵי הַמִּזְבֵּחַ הַזֶּה
  choice: devant cet autel
  rationale: Traduction directe de la préposition et du syntagme nominal, sans expliciter davantage la logique cultuelle de l’orateur.
theological_decisions:
- issue: À qui renvoient les lieux sacrés et les autels supprimés ?
  choice: Conserver le possessif « ses », renvoyant grammaticalement au Seigneur dans l’argument de l’orateur assyrien.
  alternative: Expliciter qu’Ézéchias aurait supprimé des sanctuaires illégitimes ou idolâtres.
  rationale: Le discours repose sur la compréhension, erronée ou polémique, de l’orateur selon laquelle la centralisation du culte aurait offensé le Dieu de Juda. La traduction ne corrige pas silencieusement son argument.
- issue: Valeur de וַיֹּאמֶר après les verbes de suppression
  choice: « en disant »
  alternative: « et a dit »
  rationale: Le participe français relie naturellement l’ordre adressé à Juda et Jérusalem à l’action d’Ézéchias, conformément au sens discursif, sans modifier le contenu.
- issue: Nature de l’acte exprimé par תשתחוו
  choice: « vous vous prosternerez »
  alternative: « vous adorerez »
  rationale: Le choix conserve l’image corporelle du texte et n’efface pas l’ambivalence entre geste de prosternation et acte cultuel.
translation_notes:
  register: Français moderne, clair et digne. Le vouvoiement pluriel reflète l’adresse collective. « Aux habitants de Juda et de Jérusalem » explicite légèrement les destinataires géographiques pour produire un français naturel, sans changer leur identité. La structure interrogative et l’ironie polémique du discours sont conservées.
