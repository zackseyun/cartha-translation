source:
  edition: WLC
  text: עַתָּ֡ה הִנֵּ֣ה בָטַ֣חְתָּ לְּ/ךָ֡ עַל מִשְׁעֶנֶת֩ הַ/קָּנֶ֨ה הָ/רָצ֤וּץ הַ/זֶּה֙ עַל מִצְרַ֔יִם אֲשֶׁ֨ר יִסָּמֵ֥ךְ אִישׁ֙ עָלָ֔י/ו וּ/בָ֥א בְ/כַפּ֖/וֹ וּ/נְקָבָ֑/הּ כֵּ֚ן פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/כָֽל הַ/בֹּטְחִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/021.yaml
  text: Look, you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, will go into his palm and pierce it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: fr
  text: 'Regarde ! Tu mets ta confiance dans l’Égypte, ce roseau brisé qui sert d’appui[a] : si un homme s’appuie dessus[b], il entrera dans sa paume et la transpercera. Tel est Pharaon, roi d’Égypte, pour tous ceux qui mettent leur confiance en lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce roseau écrasé qui sert d’appui ». L’adjectif hébreu peut désigner ce qui est écrasé, meurtri ou brisé ; « brisé » convient bien à l’image d’un appui qui se fend et blesse la main.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur lequel un homme s’appuie ». Le masculin singulier a ici une valeur générique.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָטַחְתָּ לְּךָ עַל מִצְרַיִם
  choice: Tu mets ta confiance dans l’Égypte
  rationale: Le parfait de בטח décrit ici la confiance actuelle reprochée à l’interlocuteur. « Mettre sa confiance dans » est naturel en français et conserve l’idée de dépendance.
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  choice: ce roseau brisé qui sert d’appui
  rationale: מִשְׁעֶנֶת désigne ce sur quoi l’on s’appuie, tandis que רָצוּץ peut signifier écrasé, meurtri ou brisé. « Brisé » convient à l’image d’un roseau qui se fend et blesse la main.
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: si un homme s’appuie dessus
  rationale: Le niphal de סמך exprime l’action de prendre appui. La valeur conditionnelle implicite est explicitée avec « si »; le singulier masculin générique est conservé.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: il lui entrera dans la paume et la transpercera
  rationale: כַּף désigne ici la paume; בוא garde l’image concrète de l’entrée du roseau dans celle-ci, et נקב celle de la perforation.
- source_word: כֵּן פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Voilà ce qu’est le pharaon, roi d’Égypte
  rationale: כֵּן applique directement l’image précédente au pharaon. Cette tournure française restitue clairement la comparaison sans l’expliquer davantage.
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: pour tous ceux qui mettent leur confiance en lui
  rationale: 'Le lamed indique la relation ou l’effet : telle est la réalité du pharaon pour ceux qui comptent sur lui. Le participe garde sa portée générale.'
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. L’image concrète du roseau servant d’appui et pénétrant la paume est préservée. « Regarde ! » rend הִנֵּה sans ajouter de marqueur temporel absent de l’hébreu.
