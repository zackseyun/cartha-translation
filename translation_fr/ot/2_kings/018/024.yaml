  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְּטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/024.yaml
  text: How then can you turn back the face of a single captain among the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: fr
  text: Comment donc pourrais-tu repousser un seul gouverneur[a] parmi les moindres serviteurs de mon maître, alors que tu comptes sur l’Égypte pour des chars et des cavaliers ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « responsable » ou « officier ». Le terme hébreu peut désigner un gouverneur provincial ou un chef militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: repousser
  rationale: L’expression hébraïque signifie littéralement « faire retourner la face de » et, dans ce contexte militaire, « repousser » ou « tenir tête à ». « Repousser » exprime naturellement l’idée en français.
- source_word: פַחַת
  choice: gouverneurs
  rationale: Le terme désigne un responsable de haut rang, souvent un gouverneur provincial pouvant exercer un commandement militaire. « Gouverneur » conserve mieux l’étendue de son sens que le seul terme « capitaine ».
- source_word: אַחַד
  choice: un seul
  rationale: 'Cette formulation rend l’insistance rhétorique : Juda serait incapable de résister même à un seul responsable assyrien de rang inférieur.'
- source_word: עַבְדֵי אֲדֹנִי הַקְּטַנִּים
  choice: qui comptent parmi les moindres serviteurs de mon maître
  rationale: Le relatif rattache clairement le gouverneur aux serviteurs de rang inférieur du maître du porte-parole, sans suggérer une petite taille physique.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: puisque tu comptes sur l’Égypte
  rationale: בטח על exprime ici le fait de placer sa confiance dans un allié ou de dépendre de lui. « Compter sur » convient au contexte politique et militaire.
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: pour avoir des chars et des cavaliers
  rationale: La préposition indique les ressources militaires attendues de l’Égypte ; « pour avoir » explicite sobrement cette relation en français naturel.
theological_decisions: []
