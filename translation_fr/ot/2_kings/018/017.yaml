source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֡וּר אֶת תַּרְתָּ֥ן וְ/אֶת רַב סָרִ֣יס וְ/אֶת רַב שָׁקֵ֨ה מִן לָכִ֜ישׁ אֶל הַ/מֶּ֧לֶךְ חִזְקִיָּ֛הוּ בְּ/חֵ֥יל כָּבֵ֖ד יְרוּשָׁלִָ֑ם וַֽ/יַּעֲלוּ֙ וַ/יָּבֹ֣אוּ יְרוּשָׁלִַ֔ם וַ/יַּעֲל֣וּ וַ/יָּבֹ֗אוּ וַ/יַּֽעַמְדוּ֙ בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָֽ/עֶלְיוֹנָ֔ה אֲשֶׁ֕ר בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/017.yaml
  text: Then the king of Assyria sent the Tartan[a], the Rab-saris, and the Rab-shakeh from Lachish to King Hezekiah at Jerusalem with a great army. They went up and came to Jerusalem; they went up and came and stood by the conduit of the upper pool[c][b], which is on the highway of the washer’s field.
translation:
  language: fr
  text: Alors le roi d’Assyrie envoya de Lakish le tartân, le rab-saris et le rab-shaké[a] auprès du roi Ézéchias, à Jérusalem, avec une armée considérable[b]. Ils montèrent et arrivèrent à Jérusalem ; ils montèrent, arrivèrent et prirent position près du canal du réservoir supérieur, qui se trouve sur la route du champ du blanchisseur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « tartân », le « rab-saris » et le « rab-shaké » sont probablement des titres officiels assyriens plutôt que des noms propres. Ils pourraient désigner respectivement le commandant en chef, un haut fonctionnaire de la cour et un autre dignitaire de haut rang, mais leurs fonctions exactes sont incertaines.
    reason: cultural_note
  - marker: b
    text: 'Ou : « avec une importante force militaire ».'
    reason: lexical_alternative
  - marker: c
    text: 'Traditionnellement : « le champ du foulon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְתָּן / רַב סָרִיס / רַב שָׁקֵה
  choice: le tartân, le rab-saris et le rab-shaké
  rationale: Ces expressions désignent vraisemblablement des titres officiels assyriens plutôt que des noms propres. Leur translittération évite d’attribuer à chacun une fonction trop précise alors que leur équivalence exacte demeure incertaine.
- source_word: בְּחֵיל כָּבֵד
  choice: avec une armée considérable
  rationale: חַיִל désigne ici une force militaire, et כָּבֵד en souligne l’importance. Cette formulation est naturelle en français tout en conservant l’idée d’une force nombreuse ou imposante.
- source_word: וַיַּעֲלוּ ... וַיָּבֹאוּ ... וַיַּעֲלוּ וַיָּבֹאוּ וַיַּעַמְדוּ
  choice: Ils montèrent et arrivèrent… ils montèrent, arrivèrent et prirent position
  rationale: La répétition de la séquence narrative hébraïque est conservée. « Montèrent » rend aussi l’ascension vers Jérusalem, tandis que « prirent position » exprime naturellement l’arrêt militaire marqué par עמד.
- source_word: תְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: le canal du réservoir supérieur
  rationale: תְעָלָה est un canal ou conduit d’eau et בְּרֵכָה un bassin ou réservoir. « Réservoir » rend clairement la réalité topographique dans ce contexte.
- source_word: מְסִלַּת שְׂדֵה כוֹבֵס
  choice: la route du champ du blanchisseur
  rationale: מְסִלָּה désigne une route aménagée. כּוֹבֵס est celui qui lave ou blanchit les étoffes ; « blanchisseur » est moderne et compréhensible, contrairement au traditionnel « foulon », aujourd’hui moins courant.
