  text: וַ/יִּדְבַּק֙ בַּֽ/יהוָ֔ה לֹא סָ֖ר מֵ/אַֽחֲרָ֑י/ו וַ/יִּשְׁמֹר֙ מִצְוֺתָ֔י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/006.yaml
  text: He held fast to Yahweh; he did not turn away from following him[a], and he kept his commandments, which Yahweh had commanded Moses.
translation:
  language: fr
  text: Il s’attacha[a] à Yahweh ; il ne cessa pas de le suivre et observa les commandements que Yahweh avait prescrits à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il resta fermement attaché à Yahweh ». Le verbe hébreu exprime un attachement fort et fidèle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדְבַּק
  choice: resta fermement attaché
  rationale: Le verbe דבק exprime ici un attachement durable et une fidélité résolue envers Yahweh. Cette formulation française restitue sa force relationnelle et celle de l’alliance sans suggérer une adhérence physique.
- source_word: בַּיהוָה
  choice: à Yahweh
  rationale: La préposition ב marque la personne à laquelle Ézéchias demeure attaché ; le nom divin est translittéré conformément au texte source.
- source_word: לֹא סָר מֵאַחֲרָיו
  choice: il ne se détourna pas de lui
  rationale: L’expression hébraïque signifie qu’il ne cessa pas de suivre Yahweh et ne dévia pas de sa fidélité. Le français naturel peut l’exprimer sans reproduire littéralement « de derrière lui ».
- source_word: וַיִּשְׁמֹר
  choice: il respecta
  rationale: Avec des commandements pour complément, שׁמר signifie les observer ou s’y conformer. « Respecta » est clair, naturel et conserve la portée morale et juridique.
- source_word: מִצְוֺתָיו
  choice: les commandements
  rationale: מִצְוֹת désigne les prescriptions données par Dieu ; « commandements » maintient le registre de l’alliance et de la Loi.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: que Yahweh avait donnés à Moïse
  rationale: En contexte, צוה signifie que Yahweh a prescrit ces commandements à Moïse. Le plus-que-parfait explicite naturellement l’antériorité de leur transmission.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » conserve le nom d’alliance et suit la décision éditoriale fournie, sans le remplacer par un titre.
- issue: Portée de דבק
  choice: attachement fidèle et résolu
  alternative: adhésion physique ou simple proximité
  rationale: Dans ce contexte d’obéissance aux commandements, le verbe décrit la fidélité d’Ézéchias à Yahweh. La traduction en conserve la force sans ajouter une terminologie doctrinale absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. « Resta fermement attaché » rend l’intensité de דבק avec naturel ; la note conserve une formulation plus proche de l’image hébraïque.
