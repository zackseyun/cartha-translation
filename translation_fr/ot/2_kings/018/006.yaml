  source_fidelity: 'Révision sûre recommandée : « ne se détourna pas de lui » exprime l’idée générale, mais ne rend pas explicitement מֵאַחֲרָיו (« de le suivre »). « Observer » est aussi plus précis que « respecter » pour שׁמר employé avec des commandements.'
