    rationale: לֹא סָר מֵאַחֲרָיו signifie littéralement qu’il ne se détourna pas de derrière lui, c’est-à-dire qu’il ne cessa pas de le suivre. La révision préserve cette nuance d’allégeance sans lourdeur.
  - severity: low
    issue: « Respecta les commandements » est un peu moins exact que « observa les commandements ».
    rationale: Dans cette collocation, שׁמר désigne l’observance effective des commandements, non seulement le respect au sens d’estime.
  - severity: low
    issue: L’ancre de note est placée après « Yahweh », alors que la note explique le verbe d’attachement.
    rationale: La déplacer après « s’attacha » rend le renvoi transparent et conforme à son motif lexical.
  revised_text: Il s’attacha[a] à Yahweh ; il ne cessa pas de le suivre et observa les commandements que Yahweh avait prescrits à Moïse.
