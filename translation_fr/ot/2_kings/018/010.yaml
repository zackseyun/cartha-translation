  text: וַֽ/יִּלְכְּדֻ֗/הָ מִ/קְצֵה֙ שָׁלֹ֣שׁ שָׁנִ֔ים בִּ/שְׁנַת שֵׁ֖שׁ לְ/חִזְקִיָּ֑ה הִ֣יא שְׁנַת תֵּ֗שַׁע לְ/הוֹשֵׁ֨עַ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל נִלְכְּדָ֖ה שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/010.yaml
  text: At the end of three years they captured it. In the sixth year of Hezekiah[a], which was the ninth year of Hoshea king of Israel, Samaria was captured.
translation:
  language: fr
  text: Au terme de trois ans, ils la prirent. La sixième année d’Ézéchias, c’est-à-dire la neuvième année d’Osée, roi d’Israël, Samarie fut prise.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְכְּדֻהָ
  choice: ils s’en emparèrent
  rationale: Le qal narratif à la 3e personne du pluriel avec suffixe féminin renvoie à Samarie et maintient les assaillants comme sujet implicite. « S’emparer de » rend naturellement l’idée de conquête.
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: Au bout de trois ans
  rationale: Cette tournure française rend précisément l’idiome temporel « à la fin de trois ans » sans suggérer nécessairement un moment longtemps postérieur.
- source_word: בִּשְׁנַת שֵׁשׁ לְחִזְקִיָּה
  choice: C’était la sixième année du règne d’Ézéchias
  rationale: Formule française naturelle de datation royale; « du règne » explicite sobrement la valeur référentielle du lamed.
- source_word: הִיא
  choice: qui correspondait à
  rationale: Le pronom synchronise les deux systèmes de datation; cette formulation française exprime clairement leur équivalence chronologique.
- source_word: שְׁנַת תֵּשַׁע לְהוֹשֵׁעַ מֶלֶךְ יִשְׂרָאֵל
  choice: la neuvième année du règne d’Osée, roi d’Israël
  rationale: La seconde datation royale et le titre explicite sont conservés dans un français idiomatique.
- source_word: נִלְכְּדָה שֹׁמְרוֹן
  choice: Samarie fut prise
  rationale: Le passif rend le niphal accompli. « Fut prise » est la tournure française usuelle pour la conquête d’une ville et conserve la reprise de la racine לכד sur le plan sémantique.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française traditionnelle et actuelle du nom de la ville.
