translation_notes:
  register: Français international moderne, digne et accessible. Les titres de cour sont rendus fonctionnellement lorsqu’un équivalent français suffisamment sûr existe; le titre assyrien incertain est translittéré et expliqué en note. Le marqueur de note est placé après « Rab-Shaké », terme auquel la note se rapporte.
