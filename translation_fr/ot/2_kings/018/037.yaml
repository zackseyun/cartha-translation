base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/037.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: fr
  text: Alors Éliakim, fils de Hilkija, le maître du palais, Shebna, le secrétaire, et Joach, fils d’Asaph, l’archiviste, se rendirent auprès d’Ézéchias, les vêtements déchirés. Ils lui rapportèrent les paroles du Rab-Shaké[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Rab-Shaké » est un titre officiel assyrien, qui pouvait désigner un haut dignitaire tel qu’un grand échanson ou un porte-parole.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Alors … se rendirent auprès de
  rationale: Le verbe hébreu est au singulier parce qu’il précède un sujet composé, tournure courante en hébreu. Le pluriel est requis en français une fois les trois hommes nommés. « Alors » rend naturellement la progression narrative.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: maître du palais
  rationale: Cette expression désigne la haute fonction administrative de responsable de la maison royale. « Maître du palais » est une formulation française claire et consacrée pour ce titre.
- source_word: הַסֹּפֵר
  choice: le secrétaire
  rationale: Dans ce contexte de cour, le terme désigne un haut fonctionnaire chargé de l’écrit plutôt qu’un simple copiste. « Secrétaire » communique clairement cette fonction en français moderne.
- source_word: הַמַּזְכִּיר
  choice: archiviste
  rationale: Le titre désigne le fonctionnaire chargé de conserver ou de consigner la mémoire officielle. « Archiviste » rend cette fonction administrative de façon concise et actuelle.
- source_word: קְרוּעֵי בְגָדִים
  choice: les vêtements déchirés
  rationale: La formulation conserve l’image concrète du texte et indique leur état à l’arrivée, signe visible de détresse et de deuil.
- source_word: וַיַּגִּדוּ לוֹ
  choice: Ils lui rapportèrent
  rationale: « Rapporter » convient à la transmission officielle d’un discours tout en restant naturel en français.
- source_word: דִּבְרֵי
  choice: les paroles de
  rationale: Cette traduction proche de l’hébreu souligne qu’ils transmettent le discours même du dignitaire assyrien.
- source_word: רַב שָׁקֵה
  choice: le Rab-Shaké
  rationale: Le terme est un titre officiel assyrien dont l’équivalent précis demeure discuté. La translittération évite de lui attribuer abusivement une fonction trop précise; une note en explique la nature.
