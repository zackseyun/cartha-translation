- from: Il battit les Philistins jusqu’à Gaza et sur son territoire[a], depuis la tour de garde jusqu’à la ville fortifiée[b].
  to: Il battit les Philistins jusqu’à Gaza et dans tout son territoire[a], depuis la tour de garde jusqu’à la ville fortifiée[b].
  rationale: La révision améliore la syntaxe française tout en conservant l’étendue militaire et territoriale du texte hébreu. Les notes maintiennent l’ambiguïté de גְּבוּל et expliquent sobrement la formule « de la tour de garde à la ville fortifiée », sans lui attribuer une précision géographique ou doctrinale absente du texte.
