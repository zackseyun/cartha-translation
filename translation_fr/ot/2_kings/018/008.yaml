  text: הֽוּא הִכָּ֧ה אֶת פְּלִשְׁתִּ֛ים עַד עַזָּ֖ה וְ/אֶת גְּבוּלֶ֑י/הָ מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/008.yaml
  text: He struck the Philistines as far as Gaza and its territory[b][a], from watchtower to fortified city.
translation:
  language: fr
  text: Il battit les Philistins jusqu’à Gaza et dans tout son territoire[a], depuis la tour de garde jusqu’à la ville fortifiée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et ses frontières ». Le mot hébreu peut désigner aussi bien les limites d’un territoire que le territoire lui-même.
    reason: lexical_alternative
  - marker: b
    text: Cette formule désigne l’ensemble du territoire, du plus petit poste de garde à la ville fortifiée.
    reason: cultural_note
lexical_decisions:
- source_word: הוּא
  choice: Il
  rationale: Le pronom sujet explicite reprend Ézéchias et conserve la légère insistance de l’hébreu, tout en restant naturel en français.
- source_word: הִכָּה
  choice: battit
  rationale: Dans ce contexte militaire, « battre » exprime naturellement l’action victorieuse de נכה sans recourir à l’archaïque « frapper » au sens guerrier ni préciser au-delà du texte l’ampleur de la défaite.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation ethnique française usuelle.
- source_word: עַד עַזָּה
  choice: jusqu’à Gaza
  rationale: עַד indique ici la limite atteinte par l’action militaire.
- source_word: וְאֶת גְּבוּלֶיהָ
  choice: et sur son territoire
  rationale: גְּבוּל peut désigner une frontière ou l’espace délimité. Ici, le territoire dépendant de Gaza convient au contexte; « sur » rend idiomatiquement en français l’extension de l’attaque, tout en signalant l’alternative en note.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: depuis la tour de garde
  rationale: נוֹצְרִים désigne ceux qui surveillent ou gardent; l’expression se rend naturellement par « tour de garde » et constitue le premier terme d’une formule englobante.
- source_word: עַד עִיר מִבְצָר
  choice: jusqu’à la ville fortifiée
  rationale: Rendu courant de עִיר מִבְצָר. Avec « tour de garde », l’expression couvre l’ensemble des implantations, de l’avant-poste à la cité défendue.
