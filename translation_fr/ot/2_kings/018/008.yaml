    issue: Coordination géographique peu naturelle
    rationale: Dans « jusqu’à Gaza et sur son territoire », les compléments ne sont pas coordonnés de manière idiomatique. « Dans tout son territoire » clarifie que la portée s’étend à l’ensemble du territoire de Gaza.
  - severity: low
    issue: Formulation de la note lexicale a
    rationale: « Ou “et jusqu’à ses frontières” » introduit un « jusqu’à » qui n’est pas répété dans l’hébreu. La note peut donner directement l’alternative lexicale « et ses frontières ».
  - severity: low
    issue: Présentation de la note b comme littérale
    rationale: La glose « tour des gardiens » reflète la morphologie, mais l’expression est idiomatique et se comprend naturellement comme « tour de garde ». Une note explicative sans étiquette de littéralité est plus exacte.
