  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רַב שָׁקֵ֔ה אִמְרוּ נָ֖א אֶל חִזְקִיָּ֑הוּ כֹּֽה אָמַ֞ר הַ/מֶּ֤לֶךְ הַ/גָּדוֹל֙ מֶ֣לֶךְ אַשּׁ֔וּר מָ֧ה הַ/בִּטָּח֛וֹן הַ/זֶּ֖ה אֲשֶׁ֥ר בָּטָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/019.yaml
  text: 'Then the Rabshakeh said to them, "Please say to Hezekiah, ''Thus says the great king, the king of Assyria: What is this confidence that you have trusted in?''"'
translation:
  language: fr
  text: 'Le grand échanson leur dit : « Dites, je vous prie, à Ézékias : “Voici ce que dit le grand roi, le roi d’Assyrie : Quelle est donc cette assurance sur laquelle tu t’appuies ?” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: le grand échanson
  rationale: Titre officiel assyrien traditionnellement rendu ainsi en français ; il désigne un haut dignitaire plutôt qu’un nom propre.
- source_word: אִמְרוּ נָא
  choice: Dites, je vous prie
  rationale: נָא apporte ici une nuance de demande, possiblement teintée de condescendance dans ce discours diplomatique.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: le grand roi
  rationale: Reproduit le titre royal emphatique employé par l’émissaire assyrien.
- source_word: מָה הַבִּטָּחוֹן הַזֶּה
  choice: Quelle est donc cette assurance
  rationale: Conserve la question dépréciative ; « donc » rend naturellement en français la force contextuelle de « cette » sans l’alourdir.
- source_word: אֲשֶׁר בָּטָחְתָּ
  choice: sur laquelle tu t’appuies
  rationale: Le même champ lexical hébreu associe « assurance » et le fait de mettre sa confiance ; cette formulation française évite une répétition maladroite tout en gardant le sens.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et oral, adapté à une proclamation officielle provocatrice. Le tutoiement adressé à Ézékias reflète la deuxième personne masculine singulière de l’hébreu et le ton dominateur de l’émissaire.
