  text: וַ/יֶּ֧גֶל מֶֽלֶךְ אַשּׁ֛וּר אֶת יִשְׂרָאֵ֖ל אַשּׁ֑וּרָ/ה וַ/יַּנְחֵ֞/ם בַּ/חְלַ֧ח וּ/בְ/חָב֛וֹר נְהַ֥ר גּוֹזָ֖ן וְ/עָרֵ֥י מָדָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/011.yaml
  text: And the king of Assyria exiled Israel to Assyria and settled them in Halah[a], and on the Habor, the river of Gozan[b], and in the cities of the Medes.
translation:
  language: fr
  text: Le roi d’Assyrie déporta Israël[a] en Assyrie et les installa à Halah, près du Habor, le fleuve de Gozân[b], ainsi que dans les villes des Mèdes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Israël » désigne ici le royaume du Nord et les membres de sa population emmenés en exil.
    reason: Précision historique et culturelle sur le sens collectif du nom.
  - marker: b
    text: 'Autre traduction possible : « à Halah et sur le Habor, le fleuve de Gozân ».'
    reason: La préposition hébraïque et le rapport géographique entre le Habor et Gozân peuvent être exprimés de plusieurs manières.
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: déporta
  rationale: Le hiphil de גלה exprime ici un déplacement forcé vers l’exil; « déporta » rend clairement le caractère politique et contraint de l’action.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: Rendu direct et idiomatique de l’état construit.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom désigne collectivement le royaume du Nord et sa population; conserver « Israël » préserve cette référence politico-nationale.
- source_word: אַשּׁוּרָה
  choice: en Assyrie
  rationale: Le suffixe directionnel indique un mouvement vers l’Assyrie; en français, « déporter en Assyrie » est naturel.
- source_word: וַיַּנְחֵם
  choice: installa les exilés
  rationale: La forme causative décrit l’établissement des personnes déportées dans des lieux assignés. Le complément explicite évite une ambiguïté pronominale sans changer le référent.
- source_word: בַּחְלַח
  choice: à Halah
  rationale: Toponyme translittéré; « à » convient à un lieu d’établissement.
- source_word: וּבְחָבוֹר
  choice: sur les rives du Habor
  rationale: Puisque le terme suivant identifie le Habor comme un fleuve, cette formulation rend naturellement la localisation riveraine suggérée par בְּ, sans présenter les exilés comme installés dans l’eau.
- source_word: נְהַר גּוֹזָן
  choice: le fleuve de Gozân
  rationale: Rendu transparent de la chaîne construite, qui associe le Habor à Gozân tout en laissant ouverte la nature exacte de ce rapport géographique.
- source_word: וְעָרֵי מָדָי
  choice: ainsi que dans les villes des Mèdes
  rationale: מָדָי peut désigner les Mèdes ou la Médie; « villes des Mèdes » suit directement la forme hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la succession géographique de l’hébreu. « Déporta » explicite la contrainte de l’exil; « installa les exilés » rend le causatif dans un français naturel. Les accents de « Gozân » et « Mèdes » suivent un usage français traditionnel et lisible.
