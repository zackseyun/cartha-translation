base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/018.yaml
  text: And they called for the king[a], and Eliakim son of Hilkiah, who was over the household, came out to them, along with Shebna the scribe and Joah son of Asaph[c][b], the recorder.
translation:
  language: fr
  text: Ils appelèrent le roi. Alors sortirent à leur rencontre Éliakim, fils de Hilqiya, responsable du palais[a], Shebna, le secrétaire[b], et Yoah, fils d’Asaph, l’archiviste[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui était sur la maison » ; il s’agit d’un titre administratif, celui du responsable de la maison royale.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « le scribe ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le mémorialiste » ; la fonction exacte de cet officier royal n’est pas certaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל הַמֶּלֶךְ
  choice: Ils appelèrent le roi
  rationale: קרא avec אֶל exprime ici le fait d’appeler quelqu’un ou de réclamer sa présence. Cette formulation reste proche de l’hébreu sans transformer explicitement l’appel en sommation officielle.
- source_word: וַיֵּצֵא אֲלֵהֶם
  choice: sortit à leur rencontre
  rationale: יצא signifie « sortir »; avec אֲלֵהֶם, le contexte indique que le représentant judéen sort pour rejoindre la délégation assyrienne. « À leur rencontre » est idiomatique en français et conserve le mouvement vers eux.
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: Éliakim, fils de Hilqiya
  rationale: Les noms sont translittérés et la construction patronymique hébraïque est rendue directement.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: qui était responsable du palais
  rationale: L’expression désigne un haut responsable de la maison royale. « Palais » rend ici le sens institutionnel de בַּיִת plus clairement que le simple mot « maison », tout en conservant une note sur le titre.
- source_word: הַסֹּפֵר
  choice: le secrétaire
  rationale: Dans ce cadre gouvernemental, סֹפֵר désigne un fonctionnaire chargé de l’écrit plutôt qu’un copiste au sens courant. « Secrétaire » communique naturellement cette fonction, tandis que « scribe » demeure signalé en note.
- source_word: הַמַּזְכִּיר
  choice: l’archiviste
  rationale: Le terme désigne un officier royal chargé des mémoires, documents ou comptes rendus. « Archiviste » est un équivalent français établi et intelligible, sans préciser excessivement les contours incertains de la charge.
