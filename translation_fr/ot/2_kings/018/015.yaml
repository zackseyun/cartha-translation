  text: וַ/יִּתֵּן֙ חִזְקִיָּ֔ה אֶת כָּל הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בֵית יְהוָ֑ה וּ/בְ/אֹצְר֖וֹת בֵּ֥ית הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/015.yaml
  text: So Hezekiah gave all the silver that was found in the house of Yahweh and in the treasuries of the king's house[a][b][c].
translation:
  language: fr
  text: Ézéchias donna tout l’argent[a] qui se trouvait dans la maison de Yahweh[b] et dans les trésors de la maison du roi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne littéralement l’argent métal et peut aussi signifier « monnaie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le temple de Yahweh »; littéralement « la maison de Yahweh ».
    reason: lexical_alternative
  - marker: c
    text: Ou « le palais royal »; littéralement « la maison du roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Le verbe נתן signifie largement « donner, remettre ». « Donna » reste naturel et conserve cette largeur de sens sans préciser davantage la nature du tribut.
- source_word: חִזְקִיָּה
  choice: Ézéchias
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: כָּל
  choice: tout
  rationale: Rend directement la portée exhaustive du quantificateur hébreu.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: En français, « argent » peut désigner à la fois le métal et, par extension, la monnaie; ce choix conserve donc naturellement l’ambiguïté lexicale de כֶּסֶף.
- source_word: הַנִּמְצָא
  choice: qui se trouvait
  rationale: Cette formulation française naturelle rend le participe niphal de מצא et désigne ce qui était présent ou disponible dans ces lieux.
- source_word: בֵית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction littérale « maison de Yahweh » préserve l’expression hébraïque et son parallélisme avec « maison du roi »; dans ce contexte, elle désigne le temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וּבְאֹצְרוֹת
  choice: et dans les trésors
  rationale: אֹצָר peut désigner un trésor ou un dépôt; le pluriel « trésors » convient ici aux réserves du roi et au contexte financier.
- source_word: בֵּית הַמֶּלֶךְ
  choice: la maison du roi
  rationale: Cette traduction formelle conserve l’expression hébraïque et le parallélisme du verset, tout en laissant une note préciser qu’il s’agit contextuellement du palais royal.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom personnel au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu sans être raide; « maison de Yahweh » et « maison du roi » maintiennent le parallélisme de la source.
