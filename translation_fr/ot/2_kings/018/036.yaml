  text: וְ/הֶחֱרִ֣ישׁוּ הָ/עָ֔ם וְ/לֹֽא עָנ֥וּ אֹת֖/וֹ דָּבָ֑ר כִּי מִצְוַ֨ת הַ/מֶּ֥לֶךְ הִ֛יא לֵ/אמֹ֖ר לֹ֥א תַעֲנֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/036.yaml
  text: But the people kept silent and did not answer him a word[a], for the king’s command was, “Do not answer him.”
translation:
  language: fr
  text: 'Mais le peuple garda le silence et ne lui répondit pas un mot[a], car le roi avait donné cet ordre : « Ne lui répondez pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne lui répondit pas une parole » ; cette expression signifie qu’il ne lui donna absolument aucune réponse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱרִישׁוּ
  choice: garda le silence
  rationale: Le hifil de חרשׁ exprime ici le fait de demeurer silencieux. « Garda le silence » rend la retenue volontaire dans un français naturel et digne.
- source_word: הָעָם
  choice: le peuple
  rationale: עם désigne simplement le peuple, ici les Judéens qui écoutent depuis la muraille, sans qu’il soit nécessaire de préciser davantage.
- source_word: וְלֹא עָנוּ אֹתוֹ דָבָר
  choice: ne lui répondit pas un mot
  rationale: Cette formulation conserve l’expression hébraïque avec דָבָר (« un mot »), tout en restant idiomatique en français.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison du silence du peuple ; « car » assure naturellement ce lien causal dans le récit.
- source_word: מִצְוַת הַמֶּלֶךְ הִיא לֵאמֹר
  choice: le roi avait donné cet ordre
  rationale: La tournure hébraïque signifie littéralement que le commandement du roi était de dire ce qui suit. Cette formulation française explicite naturellement l’antériorité de l’ordre et introduit la citation sans lourdeur.
- source_word: לֹא תַעֲנֻהוּ
  choice: Ne lui répondez pas
  rationale: Le verbe est à la deuxième personne masculine plurielle et exprime une interdiction adressée au groupe. La reprise de « répondre » préserve celle du verbe ענה dans l’hébreu.
theological_decisions: []
