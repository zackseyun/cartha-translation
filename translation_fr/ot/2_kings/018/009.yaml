  text: וַֽ/יְהִ֞י בַּ/שָּׁנָ֤ה הָֽ/רְבִיעִית֙ לַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ הִ֚יא הַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֔ית לְ/הוֹשֵׁ֥עַ בֶּן אֵלָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל עָלָ֞ה שַׁלְמַנְאֶ֧סֶר מֶֽלֶךְ אַשּׁ֛וּר עַל שֹׁמְר֖וֹן וַ/יָּ֥צַר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/009.yaml
  text: And it happened in the fourth year of King Hezekiah—which was the seventh year of Hoshea son of Elah[b][a], king of Israel—that Shalmaneser king of Assyria came up against Samaria and besieged it.
translation:
  language: fr
  text: La quatrième année du règne du roi Ézéchias — c’était la septième année du règne d’Osée, fils d’Éla, roi d’Israël —, Salmanazar, roi d’Assyrie, marcha contre Samarie et l’assiégea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַּשָּׁנָה הָרְבִיעִית
  choice: La quatrième année du règne
  rationale: La formule hébraïque introduit une datation royale. En français moderne, la construction nominale est plus naturelle qu’un calque comme « il arriva dans la quatrième année », sans perte de contenu.
- source_word: לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: du roi Ézéchias
  rationale: Le lamed indique ici l’année de règne prise comme repère chronologique; « du règne du roi Ézéchias » l’explicite naturellement.
- source_word: הִיא הַשָּׁנָה הַשְּׁבִיעִית
  choice: c’était la septième année du règne
  rationale: Le pronom reprend la date précédente et établit la synchronisation entre les deux règnes.
- source_word: לְהוֹשֵׁעַ בֶּן־אֵלָה מֶלֶךְ יִשְׂרָאֵל
  choice: d’Osée, fils d’Éla, roi d’Israël
  rationale: Cette formulation française conserve la filiation, le titre et la seconde datation royale.
- source_word: עָלָה ... עַל שֹׁמְרוֹן
  choice: marcha contre Samarie
  rationale: Dans ce contexte militaire, עלה suivi de על décrit une campagne dirigée contre une ville. « Marcha contre » rend clairement ce mouvement hostile.
- source_word: שַׁלְמַנְאֶסֶר מֶלֶךְ אַשּׁוּר
  choice: Salmanazar, roi d’Assyrie
  rationale: « Salmanazar » est la forme française traditionnelle et largement reconnue du nom royal assyrien; l’apposition reproduit le titre hébreu.
- source_word: וַיָּצַר עָלֶיהָ
  choice: et l’assiégea
  rationale: Le verbe צור désigne ici l’action d’assiéger une ville; cette traduction est concise et exacte.
