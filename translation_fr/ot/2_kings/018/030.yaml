  text: וְ/אַל יַבְטַ֨ח אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר הַצֵּ֥ל יַצִּילֵ֖/נוּ יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ אֶת הָ/עִ֣יר הַ/זֹּ֔את בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/030.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us, and this city will not be given into the hand of the king of Assyria.’
translation:
  language: fr
  text: 'Ne laissez pas Ézéchias vous amener à mettre votre confiance en Yahweh en disant : « Yahweh nous délivrera certainement, et cette ville ne sera pas livrée aux mains du roi d’Assyrie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם
  choice: Ne laissez pas Ézéchias vous amener à mettre votre confiance
  rationale: 'Le hiphil de בטח avec le pronom objet exprime ici une action causative : Ézéchias amène le peuple à se confier en Yahweh. Cette formulation conserve cette nuance tout en restant naturelle en français.'
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: אֶל יְהוָה
  choice: en Yahweh
  rationale: Avec le verbe בטח, la préposition אֶל se rend idiomatiquement par « en » dans l’expression française « mettre sa confiance en ».
- source_word: לֵאמֹר
  choice: en disant
  rationale: L’infinitif introduit directement les paroles rapportées d’Ézéchias.
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: nous délivrera certainement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. « Certainement » exprime cette valeur emphatique sans reproduire littéralement la répétition hébraïque.
- source_word: וְלֹא תִנָּתֵן
  choice: et ... ne sera pas livrée
  rationale: Le passif de נתן désigne ici le fait d’être livré au pouvoir de l’ennemi. « Livrée » convient naturellement au contexte militaire.
- source_word: הָעִיר הַזֹּאת
  choice: cette ville
  rationale: Traduction française directe et naturelle du nom accompagné du démonstratif.
- source_word: בְּיַד
  choice: aux mains de
  rationale: Cette expression conserve l’image concrète de l’hébreu tout en étant idiomatique en français pour désigner le pouvoir ou le contrôle.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: Désignation historique usuelle en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » conserve le nom propre divin au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La tournure causative est conservée sans lourdeur, l’emphase hébraïque est rendue idiomatiquement, et l’image des « mains » est maintenue.
