revisions:
- from: À cette époque, Ézéchias découpa les portes du temple de Yahweh ainsi que les montants[a] qu’Ézéchias, roi de Juda, avait plaqués, et il les donna au roi d’Assyrie.
  to: À cette époque, Ézéchias coupa les portes du temple de Yahweh ainsi que les montants[a] qu’Ézéchias, roi de Juda, avait recouverts, et il les donna au roi d’Assyrie.
  rationale: La révision remplace deux formulations françaises moins justes ou moins naturelles tout en conservant la structure, la répétition du nom propre, l’ambiguïté architecturale et l’absence de précision sur la matière du revêtement dans le verset source.
