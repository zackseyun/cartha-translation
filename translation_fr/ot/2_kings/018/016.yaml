base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/016.yaml
  text: At that time Hezekiah cut off the doors of the temple of Yahweh and the doorposts that Hezekiah king of Judah had overlaid[a], and gave them to the king of Assyria.
translation:
  language: fr
  text: À cette époque, Ézéchias coupa les portes du temple de Yahweh ainsi que les montants[a] qu’Ézéchias, roi de Juda, avait recouverts, et il les donna au roi d’Assyrie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les encadrements de portes » ou « les piliers » ; le terme hébreu est rare et peut désigner plus largement des supports architecturaux associés aux portes du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: À cette époque
  rationale: Cette expression temporelle courante situe naturellement l’événement dans la suite du récit.
- source_word: קִצַּץ
  choice: découpa
  rationale: Le verbe exprime l’action concrète de couper ou de retrancher. « Découpa » conserve cette force sans réduire l’acte au simple enlèvement d’un revêtement.
- source_word: דַּלְתוֹת
  choice: les portes
  rationale: C’est le sens courant et le plus clair du terme; le contexte désigne les portes du temple.
- source_word: הֵיכַל יְהוָה
  choice: le temple de Yahweh
  rationale: Dans ce contexte, הֵיכָל désigne le temple de Jérusalem. Le nom divin est translittéré « Yahweh ».
- source_word: הָאֹמְנוֹת
  choice: les montants
  rationale: Ce nom rare semble désigner des éléments architecturaux associés aux portes. « Montants » convient au contexte tout en laissant en note les autres possibilités.
- source_word: צִפָּה
  choice: avait plaqués
  rationale: Le verbe signifie recouvrir ou plaquer une surface, souvent de métal. Le plus-que-parfait rend l’antériorité de cette intervention d’Ézéchias.
- source_word: וַיִּתְּנֵם
  choice: et il les donna
  rationale: Cette formulation suit directement le verbe narratif hébreu et reprend les éléments retirés du temple.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: au roi d’Assyrie
  rationale: Traduction française directe et naturelle de la construction hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve ici le nom personnel divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition du nom d’Ézéchias est conservée parce qu’elle figure dans l’hébreu. La formulation ne précise pas la matière du placage, absente du verset fourni.
