source:
  edition: WLC
  text: אָמַ֨רְתָּ֙ אַךְ דְּבַר שְׂפָתַ֔יִם עֵצָ֥ה וּ/גְבוּרָ֖ה לַ/מִּלְחָמָ֑ה עַתָּה֙ עַל מִ֣י בָטַ֔חְתָּ כִּ֥י מָרַ֖דְתָּ בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/020.yaml
  text: You say, ‘It is only a word of the lips’—but counsel and strength are for war. Now in whom have you trusted, that you have rebelled against me?
translation:
  language: fr
  text: 'Tu as dit : « Ce ne sont que des paroles » ; mais il faut du conseil et de la force pour la guerre. Maintenant, en qui as-tu mis ta confiance, puisque tu t’es révolté contre moi ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר שְׂפָתַיִם
  choice: des paroles
  rationale: Littéralement « une parole des lèvres » ; l’expression déprécie les propos comme de simples mots, sans substance réelle.
- source_word: עֵצָה
  choice: stratégie
  rationale: Dans le contexte militaire, le terme désigne le conseil réfléchi, le plan ou la stratégie nécessaire à la guerre ; « stratégie » est naturel et précis en français moderne.
- source_word: גְבוּרָה
  choice: puissance
  rationale: Le mot évoque ici la force ou la capacité militaire ; « puissance » conserve cette portée sans la réduire au seul courage.
- source_word: בָטַחְתָּ
  choice: as-tu placé ta confiance
  rationale: Rend clairement l’idée de se fier à quelqu’un comme appui, tout en conservant la question rhétorique.
- source_word: מָרַדְתָּ
  choice: te révolter
  rationale: Correspond au sens politique concret de rébellion contre l’autorité assyrienne dans ce contexte.
theological_decisions:
- issue: Rapport syntaxique entre « paroles » et « stratégie et puissance »
  choice: 'Deux phrases contrastées : « Ce ne sont que des paroles. » Mais, pour faire la guerre, il faut stratégie et puissance.'
  alternative: '« Tu as dit : “Stratégie et puissance pour la guerre ne sont que paroles.” »'
  rationale: L’hébreu est abrupt et peut recevoir plusieurs analyses. La formulation choisie suit la lecture attestée par la couche anglaise auditée et préserve le contraste entre de simples paroles et les moyens réellement nécessaires à la guerre, sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, digne et oralement naturel. Le tutoiement convient à l’adresse directe entre représentants royaux. La tournure « il faut » explicite sobrement la relation nominale abrupte de l’hébreu sans modifier le sens général.
