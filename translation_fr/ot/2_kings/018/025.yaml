source:
  edition: WLC
  text: עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה לְ/הַשְׁחִת֑/וֹ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה עַל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/025.yaml
  text: Now[a], was it apart from Yahweh that I came up against this place to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: fr
  text: 'Maintenant, est-ce sans Yahweh[a] que je suis monté contre ce lieu pour le détruire ? Yahweh m’a dit : « Monte contre ce pays et détruis-le. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « indépendamment de Yahweh ».'
    reason: Variante lexicale permettant d’expliciter la nuance de מִבַּלְעֲדֵי sans alourdir le texte principal.
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: est-ce sans
  rationale: L’interrogatif הֲ joint à מִבַּלְעֲדֵי introduit une question rhétorique. « Est-ce sans » est naturel en français et conserve l’affirmation implicite que le locuteur ne prétend pas agir indépendamment de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin, conformément à la forme hébraïque du texte source.
- source_word: עָלִיתִי
  choice: je suis monté
  rationale: עלה signifie couramment « monter » et peut décrire ici l’avancée militaire, sans qu’il soit nécessaire de l’expliciter davantage.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ce lieu
  rationale: « Ce lieu » rend directement מָקוֹם sans remplacer le terme par une identification interprétative comme Jérusalem.
- source_word: לְהַשְׁחִיתוֹ
  choice: pour le détruire
  rationale: Le hiphil de שׁחת exprime ici la destruction du lieu ; le pronom masculin « le » reprend naturellement « ce lieu ».
- source_word: אָמַר אֵלַי
  choice: m’a dit
  rationale: Formulation française directe et idiomatique de la formule hébraïque de parole.
- source_word: עֲלֵה
  choice: Monte
  rationale: Rend formellement l’impératif de עלה tout en laissant le contexte militaire préciser le sens.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ce pays
  rationale: Dans ce contexte d’invasion, « pays » rend naturellement אֶרֶץ et maintient la distinction avec « ce lieu » dans la première proposition.
- source_word: וְהַשְׁחִיתָהּ
  choice: et détruis-le
  rationale: Répète la racine שׁחת comme en hébreu. Le masculin grammatical français reprend « pays », tandis que le suffixe hébreu féminin reprend אֶרֶץ.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » conserve le nom propre plutôt que de le remplacer par un titre.
- issue: Nature de la prétendue autorisation divine revendiquée par le porte-parole assyrien
  choice: Conserver la revendication telle quelle sans en confirmer ni en nier la véracité
  alternative: Ajouter une formulation signalant explicitement qu’il ment ou qu’il rapporte une révélation authentique
  rationale: Le verset présente les paroles du locuteur sans trancher ici leur véracité. La traduction préserve cette tension narrative et théologique.
- issue: Identification de « ce lieu » et de « ce pays »
  choice: Conserver les deux expressions génériques distinctes
  alternative: Jérusalem et Juda
  rationale: L’hébreu emploie מָקוֹם puis אֶרֶץ. Ne pas substituer des noms propres évite de préciser au-delà du texte, tout en maintenant la différence de portée possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe directe conserve la force provocatrice de la question rhétorique et la répétition de « détruire ». « Ce pays » est préféré à « cette terre » dans ce contexte militaire, tandis que « ce lieu » maintient le terme plus local de la première proposition.
