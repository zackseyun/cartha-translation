source:
  edition: WLC
  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר מֶ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵֽנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵֽי בוֹרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/031.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern,'
translation:
  language: fr
  text: '« N’écoutez pas Ézéchias, car voici ce que dit le roi d’Assyrie : Faites la paix avec moi[a] et sortez vers moi ; que chacun mange de sa vigne et de son figuier, et boive l’eau de sa citerne, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Faites avec moi une bénédiction », expression qui signifie ici conclure la paix ou accepter un accord.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: écoutez
  rationale: Avec אֶל, le verbe שׁמע signifie ici « écouter » ou « prêter attention à ». « Écoutez » conserve le sens immédiat sans expliciter davantage l’idée implicite d’obéissance.
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: כִּי כֹה אָמַר
  choice: car voici ce que dit
  rationale: Formulation française actuelle qui restitue naturellement la formule hébraïque introduisant une citation directe.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: Rendu direct et transparent de la chaîne construite hébraïque.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: Faites la paix avec moi
  rationale: L’expression idiomatique désigne ici l’acceptation de conditions favorables ou un accord avec le roi assyrien. Sa formulation littérale inhabituelle est signalée en note.
- source_word: וּצְאוּ אֵלַי
  choice: et sortez vers moi
  rationale: Préserve le mouvement concret exprimé par יצא et אֶל, sans remplacer explicitement l’expression par « rendez-vous », bien que la soumission soit impliquée par le contexte du siège.
- source_word: וְאִכְלוּ אִישׁ גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ
  choice: Alors chacun mangera les fruits de sa vigne et de son figuier
  rationale: 'Le français exige un complément naturel avec « manger » : « les fruits de » explicite ce qui est sous-entendu dans l’hébreu. « Chacun » rend l’emploi distributif de אִישׁ sans lourdeur.'
- source_word: וּשְׁתוּ אִישׁ מֵי בוֹרוֹ
  choice: et chacun boira l’eau de sa citerne
  rationale: בּוֹר désigne ici une citerne destinée à recueillir et conserver l’eau, plutôt qu’un puits alimenté par une source.
theological_decisions:
- issue: Emploi distributif répété de אִישׁ
  choice: chacun
  alternative: chaque homme
  rationale: Dans ce contexte, אִישׁ a une valeur distributive générique. « Chacun » est idiomatique en français et conserve cette valeur sans suggérer inutilement que la promesse ne concernerait que les hommes adultes.
- issue: Expression politique idiomatique עֲשׂוּ אִתִּי בְרָכָה
  choice: Faites la paix avec moi
  alternative: Concluez un accord avec moi
  rationale: '« Faites la paix avec moi » exprime l’offre assyrienne tout en conservant une partie de la tension rhétorique : il s’agit d’une paix proposée dans un contexte de siège. La note maintient la transparence sur la formulation littérale singulière.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe directe conserve le ton de proclamation du discours assyrien. « Sortez vers moi » reste volontairement proche de l’image hébraïque et ne transforme pas explicitement l’invitation en ordre de capitulation.
