source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם רַב שָׁקֵ֗ה הַ/עַ֨ל אֲדֹנֶ֤י/ךָ וְ/אֵלֶ֨י/ךָ֙ שְׁלָחַ֣/נִי אֲדֹנִ֔/י לְ/דַבֵּ֖ר אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה הֲ/לֹ֣א עַל הָ/אֲנָשִׁ֗ים הַ/יֹּֽשְׁבִים֙ עַל הַ֣/חֹמָ֔ה לֶ/אֱכֹ֣ל אֶת חרי/הם וְ/לִ/שְׁתּ֛וֹת אֶת שיני/הם עִמָּ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/027.yaml
  text: Then the Rabshakeh said to them[a], “Has my master sent me to speak these words only to your master and to you? Has he not also sent me to the men sitting on the wall, who will eat their own dung and drink their own urine with you?”
translation:
  language: fr
  text: 'Alors le Rab-Shaké leur dit[a] : « Est-ce seulement auprès de ton maître et auprès de toi que mon maître m’a envoyé prononcer ces paroles ? N’est-ce pas aussi auprès des hommes assis sur la muraille, qui devront, avec vous, manger leurs excréments et boire leur urine ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici une image de siège volontairement crue : « manger leurs excréments et boire leur urine ». La tradition de lecture massorétique substitue des expressions euphémiques, notamment « boire l’eau de leurs pieds » pour la seconde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: le Rab-Shaké
  rationale: Ce titre assyrien désigne ici le haut fonctionnaire qui sert de porte-parole. La translittération française traditionnelle évite de préciser à tort une fonction exacte et reste claire comme titre narratif.
- source_word: הַעַל אֲדֹנֶיךָ וְאֵלֶיךָ שְׁלָחַנִי אֲדֹנִי
  choice: Est-ce seulement auprès de ton maître et auprès de toi que mon maître m’a envoyé
  rationale: La construction interrogative avec עַל oppose les interlocuteurs officiels aux hommes sur la muraille. « Seulement » explicite en français la restriction impliquée par la question rhétorique et par la reprise הֲלֹא עַל.
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: prononcer ces paroles
  rationale: Cette formulation naturelle et digne conserve l’image concrète des « paroles » sans lourdeur.
- source_word: הֲלֹא עַל הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחֹמָה
  choice: N’est-ce pas aussi auprès des hommes assis sur la muraille
  rationale: הֲלֹא introduit une question qui attend une réponse affirmative. « Aussi » rend explicite l’élargissement implicite aux défenseurs présents sur la muraille.
- source_word: לֶאֱכֹל אֶת חרי/הם וְלִשְׁתּוֹת אֶת שיני/הם
  choice: qui devront […] manger leurs excréments et boire leur urine
  rationale: Les infinitifs décrivent la conséquence imminente du siège. « Devront » exprime cette contrainte sans introduire l’idée théologique de prédestination. Les termes directs conservent la violence volontaire de la provocation.
- source_word: עִמָּכֶם
  choice: avec vous
  rationale: L’expression indique que les hommes sur la muraille subiront la même détresse que les personnes auxquelles le porte-parole s’adresse.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et soutenu. Le tutoiement singulier reflète l’adresse directe à l’interlocuteur principal, tandis que « avec vous » conserve le pluriel final. La crudité de la menace est maintenue, car elle fait partie de la stratégie d’intimidation du discours.
